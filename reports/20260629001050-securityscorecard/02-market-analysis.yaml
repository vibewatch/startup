chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The cyber risk ratings and third-party risk management (TPRM) market that SecurityScorecard
    competes in is large, fragmented, and growing at 15–18% CAGR, with analyst estimates for the
    core TPRM software category ranging from $8.1B to $11.1B in 2026 and projections of $20–46B by
    2030–2035 depending on scope. Adjacent budgets in GRC ($23B), EASM ($0.9B), and cyber insurance
    ($19.6B) extend SecurityScorecard's reachable opportunity. The CISO is the primary economic
    buyer, but budget flows from IT/security, GRC, procurement, and insurance P&L silos. Regulatory
    tailwinds—NIS2, DORA, SEC cyber disclosure—are the single strongest adoption accelerator, yet
    data quality, false positives, platform consolidation by larger vendors, and budget cyclicality
    constrain pace of adoption.

sections:
  - id: market-boundary
    title: Market Boundary, Taxonomy, and Adjacent Spend
    body: >-
      SecurityScorecard competes at the intersection of three overlapping software categories:
      cyber risk ratings (also called security ratings or cyber risk scoring), third-party risk
      management (TPRM) platforms, and external attack surface management (EASM). The core
      differentiator of the ratings category is the "outside-in" continuous scoring methodology—
      observable internet signals aggregated into A–F letter grades without on-premises agents or
      vendor participation—which provides automated coverage of millions of organizations at once.


      The primary included spend is enterprise software subscription revenue for platforms that
      monitor external cyber posture and vendor/supply-chain risk: security ratings feeds, TPRM
      workflow software, questionnaire automation, continuous vendor monitoring, and AI-assisted
      remediation orchestration. Closely adjacent budgets include: governance, risk and compliance
      (GRC) software (which often houses TPRM workflows), external attack surface management tools
      (which compete and complement on the scanning side), cyber insurance underwriting technology
      (which uses security ratings to price policies), and board-level cyber risk reporting dashboards.
      Together these adjacent categories add approximately $23–35B in software spend that overlaps
      with SecurityScorecard's platform scope.


      Excluded from the core TAM are internal network security products (firewalls, endpoint
      detection, SIEM), identity and access management, and the broader $244B global information
      security market estimated by Gartner for 2026. Substitutes for security ratings include
      one-time penetration tests, ad hoc questionnaire-only programs (often Excel-based), managed
      security service providers handling vendor assessments, and internal security teams conducting
      point-in-time audits. The critical boundary distinction is that SecurityScorecard's outside-in
      continuous rating model replaces periodic, labor-intensive assessments—a distinct value
      proposition that separates the product from traditional GRC checkbox tools, though that
      boundary is blurring as larger GRC platforms add continuous monitoring features.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
    tableRefs:
      - TM001

  - id: market-sizing
    title: Market Sizing — Multiple Lenses and Contradictory Estimates
    body: >-
      Analyst estimates for the global TPRM software market in 2026 vary substantially depending
      on definition scope: Grand View Research puts the 2023 base at $7.42B growing to $20.59B by
      2030 at a 15.7% CAGR; SkyQuest estimates $11.11B for 2025 scaling to $37.44B by 2033 at
      16.4%; Business Research Insights places the 2026 market at $10.36B scaling to $45.98B by
      2035 at 18.2%. The spread—roughly $8–11B for a 2026 point estimate—reflects different
      definitions of "TPRM" (pure software vs. managed services included), different geographies,
      and varying treatment of adjacent categories like GRC and EASM.


      The external attack surface management sub-segment that overlaps with SecurityScorecard's
      ratings engine is projected at $930.7M by 2026 at a 17.5% CAGR, while the broader attack
      surface management market (including internal ASM) is estimated to grow from $1.43B in 2024
      to $9.19B by 2032 at a 30.4% CAGR. GRC software, which houses TPRM workflows for many
      large enterprises, is separately estimated at $23.32B in 2026 growing to $39.01B by 2031
      at a 10.84% CAGR. Cyber insurance premiums reached approximately $15.3–19.6B in 2025–2026
      and represent an adjacent demand pool: insurers increasingly require security ratings as
      underwriting inputs, creating a derived demand signal for ratings providers.


      Constructing a bottoms-up SAM for SecurityScorecard requires isolating the software portion
      of TPRM (approximately 59% of market per Grand View Research), the North American and
      European share (roughly 70% combined), and the enterprise-grade portion excludes SME
      self-serve. Applying these filters to the $10–11B TPRM total yields a serviceable addressable
      market of approximately $4–7B. SecurityScorecard's reported $150M+ ARR implies roughly
      2–4% penetration of this SAM, consistent with an early-to-mid growth stage. The contradictory
      sizing estimates are preserved in Table TM002 as required by quality policy.
