  - id: growth-drivers
    title: Growth Drivers — Regulation, Threat Escalation, and AI
    body: >-
      The three strongest growth drivers for the cyber risk ratings and TPRM market in 2026 are:
      (1) regulatory mandates, (2) supply chain threat escalation, and (3) AI-driven automation
      expanding the ROI case.


      On regulation: NIS2 (EU) covers 18 critical sectors, required transposition by October 2024,
      and in January 2026 the EU Commission proposed targeted amendments to ease compliance for
      28,700 companies. DORA (EU financial resilience) became effective in January 2025 and requires
      financial entities to manage ICT third-party risk continuously. The SEC's July 2023 Cybersecurity
      Disclosure Rule requires public companies to report material incidents within four business
      days and disclose third-party risk management governance in annual 10-K filings—creating
      board-level demand for auditable TPRM programs. Together these three frameworks directly
      mandate or strongly incentivize the continuous vendor monitoring that security ratings provide.


      On threats: Third-party involvement in breaches doubled to approximately 30% of all breaches
      in 2025 (Verizon DBIR), and SecurityScorecard's own 2025 research documented 35.5% of 2024
      breaches as third-party related. Black Kite's 2026 report found that each vendor breach now
      cascades to an average of 5.28 downstream organizations—the highest ever recorded—while
      41.4% of ransomware attacks now originate through third-party vectors. Global supply chain
      attack costs reached an estimated $60B in 2025.


      On AI: TITAN AI's March 2026 launch claims 95% reduction in manual TPRM effort, validating
      the automation ROI thesis. Gartner projects the AI-amplified security market will reach $160B
      by 2029, and 75%+ of enterprises will use AI-amplified cybersecurity products by 2028. This
      creates both an expansion of the addressable market (AI unlocking mid-market buyers who
      previously couldn't staff TPRM programs) and a competitive advantage for vendors who embed AI
      early in their platforms.
