callouts:
  - calloutType: risk
    title: Divergent Analyst Estimates Obscure True Market Size
    body: >-
      The TPRM market lacks a consensus definition, causing analyst estimates to diverge by 40%+
      (from $8.09B to $11.11B for the same approximate year). Broader definitions that include
      GRC and managed services inflate addressable market figures significantly. SecurityScorecard
      and investors should anchor sizing to the software-only, enterprise-tier, continuous
      monitoring segment rather than top-level analyst totals.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011

  - calloutType: strength
    title: Triple Regulatory Tailwind — NIS2, DORA, SEC — Creates Sustained Demand
    body: >-
      Three independently powerful regulatory mandates (EU NIS2, EU DORA, US SEC Disclosure Rule)
      simultaneously drive demand for continuous vendor risk monitoring. SecurityScorecard benefits
      from all three: NIS2 covers European supply chain security obligations, DORA mandates
      financial-sector ICT vendor monitoring, and the SEC rule drives US board-level demand for
      auditable TPRM programs. This regulatory convergence is the strongest single demand
      accelerator in the market.
    claimRefs:
      - CM025
      - CM026
      - CM027
      - CM028

  - calloutType: risk
    title: Platform Consolidation and Mindshare Erosion Are Structural Threats
    body: >-
      Both SecurityScorecard and BitSight saw IVRM mindshare decline sharply (SSC from 11.1% to
      5.7%; BitSight from 10.8% to 5.8%) on PeerSpot, indicating category fragmentation.
      Larger platform vendors—Palo Alto, Microsoft, CrowdStrike—are adding risk management
      features, potentially displacing standalone vendors through enterprise bundling. This
      constraint is medium-term in nature but is already visible in buyer evaluation patterns.
    claimRefs:
      - CM034
      - CM038
      - CM039

