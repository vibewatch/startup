evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full current board roster with all director names, institutional affiliations, committee assignments, and
      independence designations.
    whyItMatters: >-
      Board composition and governance quality are key inputs to assessing fiduciary oversight of a private company at
      unicorn scale; partial board visibility prevents a complete governance risk assessment.
    diligencePath: >-
      Request formal board composition disclosure during due diligence; review board consent minutes or investor rights
      agreement that identifies board seat holders per series.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: >-
      Official headcount figure from SecurityScorecard directly or from a regulatory filing such as a state employment
      report or federal WARN Act submission.
    whyItMatters: >-
      Headcount is a proxy for operational scale, burn rate estimation, and revenue-per-employee benchmarking; current
      estimates from aggregators range 615-639 and may be materially stale.
    diligencePath: >-
      Request HR data room disclosure or check any regulatory filing that contains employment counts; cross-reference
      LinkedIn active employees and job posting velocity.
    relatedQuestionRefs:
      - QO010
  - type: conflicting-data
    severity: material
    topic: competitive-positioning
    missingEvidence: >-
      Independent head-to-head capability comparison with BitSight and other security ratings competitors, including
      methodology audit, data source overlap, false-positive rates, and rating stability studies.
    whyItMatters: >-
      SecurityScorecard competes directly with BitSight (a $2.4B Moody's-backed platform) and multiple other TPRM
      vendors; without independent comparative data, claims of platform superiority cannot be verified and market share
      estimates are unreliable.
    diligencePath: >-
      Commission a Forrester or Gartner comparative evaluation; review independent rating accuracy studies from academic
      or industry researchers; interview reference customers who evaluated both platforms.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: ratings-methodology
    missingEvidence: >-
      Independent audit or credible external review of SecurityScorecard's rating methodology accuracy, coverage bias,
      false-positive rate, and appeal process effectiveness.
    whyItMatters: >-
