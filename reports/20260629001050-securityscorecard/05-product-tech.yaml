  title: Product & Technology
  summary: >-
    SecurityScorecard's core product is a patented outside-in security ratings engine that continuously scores more than 12 million organizations
    across ten risk factor groups using non-intrusive internet scanning of 3.9 billion IPv4 addresses and a world-class malware DNS sinkhole
    detecting over 2 billion daily requests. Scoring 3.0 (April 2024) moved from a factor-weighted average to direct issue-severity aggregation,
    tightening breach-predictive accuracy so that F-grade organizations are 13.8× more likely to be breached than A-grade peers. The March 2026
    TITAN AI platform launch adds AI-accelerated questionnaire automation (95% manual-effort reduction), continuous vendor discovery, and
    threat-informed remediation, bolstered by the September 2025 HyperComply acquisition. Key diligence gaps are: the proprietary algorithm
    remains a "black-box" without public audit, Forrester cited missing AI evidence-document parsing and duplicate-finding issues, and FedRAMP
    status is Ready not Authorized.

sections:
  - id: scoring-methodology
    title: Outside-In Scoring Methodology and Data Engine
    body: >-
      SecurityScorecard's foundational product is its outside-in security ratings engine — a non-intrusive, continuous assessment of an
      organization's internet-facing infrastructure that requires no agent installation or vendor cooperation. The engine categorizes every
      discovered security issue into one of ten risk factor groups: Network Security, DNS Health, Patching Cadence, Endpoint Security,
      IP Reputation, Application Security, Cubit Score, Hacker Chatter, Information Leak, and Social Engineering. Each issue type carries
      a High, Medium, or Low severity level, and those severity weights directly shape a 0-to-100 score for each factor as well as the overall
      numeric score, which maps to an A-through-F letter grade identical to a credit rating for cybersecurity.


      Scoring 3.0, launched on April 9, 2024 after a September 2023 preview period, replaced the prior methodology in which the overall score
      was simply a weighted average of the ten factor scores. Under 3.0, factors retain numeric scores but carry no individual weights in the
      overall computation; instead, the overall score directly reflects all discovered security issues and their severity impact. This change
      increased the breach-correlation signal: an F-grade organization (score ≤60) is now 13.8× more likely to sustain a breach than an
      A-grade (90–100) organization, compared to a 7.7× multiple under the prior model. SecurityScorecard's data science team assessed over
      15,000 historical breaches to validate this correlation mapping.


      The scoring algorithm applies size normalization via a logarithmic scale to ensure fair comparison across organizations of very different
      sizes, preventing a small organization with few IPs from appearing artificially secure simply because it has fewer possible findings than
      a large enterprise. After calculating size-adjusted "z-scores" for each issue type, the algorithm applies a quarterly calibration pass
      to smooth statistical fluctuations. Daily recalibration of factor and total scores ensures low score volatility: if an organization's
      digital footprint and issue counts remain stable its score will remain unchanged from day to day.
