  - id: technology-architecture
    title: Technology Architecture and Data Infrastructure
    body: >-
      SecurityScorecard's data pipeline begins with a proprietary in-house global internet scanning framework that covers the entire IPv4
      address space — more than 3.9 billion routable IPs — on a 10-day cycle across more than 1,400 ports. Cloud assets, which change
      ownership more rapidly, are scanned multiple times daily. The scanner collects IP address exposure data, fingerprints of services,
      products, operating systems, and libraries including version numbers, Common Platform Enumeration (CPE) IDs, CVE Version 2 IDs, and
      Nmap script output. This raw signal is supplemented by a network of sensors spanning three continents, plus a sinkhole and honeypot
      network that the company describes as one of the world's largest — capturing more than 2 billion malware DNS requests daily. Commercial
      and open-source threat intelligence feeds round out the signal ingestion layer.


      Attribution is the most operationally critical and error-prone step: SecurityScorecard must associate collected signals with specific
      organizations based on their digital footprints. The attribution engine relies on DNS lookups, BGP routing data, and other reliable
      mapping sources. Organizations can actively participate by claiming and refuting assets in their scorecard to improve attribution
      accuracy. The Scoring 3.0 engine applies a modified z-score calculation per issue type, comparing each organization against a
      reference population of more than 12 million rated entities and using the logarithmic normalization described above. SecurityScorecard
      applies machine-learning algorithms to improve accuracy of findings and provide insights on emerging threats such as ransomware
      strains and zero-day vulnerabilities.


      AI capabilities are embedded across the platform through the TITAN AI engine and the HyperComply RespondAI integration. The TITAN AI
      platform is presented as an "operational clearinghouse" that connects enterprises and vendors through a shared data layer — merging
      outside-in adversary telemetry from the rating engine with inside-out risk information from assessments to produce predictive,
      high-fidelity signals. The company asserts 99.9% accurate risk attribution with near-zero refute rate, though this claim is not
      independently audited.
