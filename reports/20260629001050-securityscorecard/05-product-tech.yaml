  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: methodology-limitations
      missingEvidence: >-
        An independent audit or published technical description of the Scoring 3.0 algorithm's factor-interaction logic,
        breach-correlation training dataset composition, and attribution decision boundaries.
      whyItMatters: >-
        Without third-party validation of the algorithm, customers and regulators cannot verify scoring accuracy, and
        organizations dispute resolution has no binding mechanism. The black-box nature is the most common CISO objection.
      diligencePath: >-
        Request SecurityScorecard's full methodology whitepaper and commission an independent statistical review against
        a sample of known-breach organizations to test F-grade predictive accuracy.
      relatedQuestionRefs: [QE026]

    - type: enumeration-incomplete
      severity: minor
      topic: product-modules
      missingEvidence: >-
        A confirmed production milestone or independent customer case study for the combined HyperComply-SecurityScorecard
        integrated platform, demonstrating stable post-acquisition operation of RespondAI within TITAN Assess in 2026.
      whyItMatters: >-
        The acquisition closed only in September 2025 and integration was still in progress at time of authoring; the
        combined product's production track record is short. Customers evaluating TITAN Assess as a core workflow tool
        should verify integration stability before committing.
      diligencePath: >-
        Request customer references specifically for the integrated HyperComply functionality within TITAN Assess;
        ask for integration architecture documentation and SLA commitments from SecurityScorecard.
      relatedQuestionRefs: [QE027]

    - type: missing-source
      severity: minor
      topic: api-integrations
      missingEvidence: >-
        A comparison of SecurityScorecard's platform breadth (outside-in ratings + TPRM + managed service + AI) against
        point-solution EASM or pure-play TPRM competitors on a dimension-by-dimension basis from an independent analyst
        in 2026 (post-TITAN AI launch).
      whyItMatters: >-
        The competitive landscape has shifted rapidly with TITAN AI and HyperComply; a post-launch independent
        comparison is needed to assess whether SecurityScorecard's platform convergence creates a durable advantage
        or merely matches moves already made by Bitsight, Panorays, and Black Kite.
      diligencePath: >-
        Commission or obtain a current Gartner/Forrester Wave or MQ analysis that covers the TPRM market
        post-TITAN AI launch; cross-reference with product teardowns from G2 and Gartner Peer Insights.
      relatedQuestionRefs: [QE021]

    - type: private-evidence-only
      severity: material
      topic: compliance-trust
      missingEvidence: >-
        Confirmation of a full FedRAMP Authorization to Operate (ATO) from a sponsoring federal agency, which would
        upgrade the platform from "Ready" to "Authorized" status and unlock unrestricted federal procurement.
      whyItMatters: >-
        FedRAMP Ready status is a prerequisite, not authorization. Without an ATO sponsor, federal agencies must
        conduct their own authorization process — a multi-year undertaking — before production deployment.
        The 96% YoY public sector growth claimed in 2023 may be constrained without full authorization.
      diligencePath: >-
        Check the FedRAMP Marketplace (marketplace.fedramp.gov) for SecurityScorecard ATO status; ask the company
        directly whether an ATO sponsor has been identified and what the timeline for full authorization is.
      relatedQuestionRefs: []

