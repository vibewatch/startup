callouts:
  - calloutType: strength
    title: Breach-Correlated Scoring with 12M+ Organization Coverage
    body: >-
      SecurityScorecard's Scoring 3.0 methodology produces breach-correlated grades validated against 15,000+ historical incidents.
      The 13.8× breach likelihood multiple for F-grade vs. A-grade organizations, combined with daily score updates and coverage
      of more than 12 million rated organizations globally, provides a uniquely broad and continuously refreshed risk intelligence
      dataset that competitors have not replicated at equivalent scale.
    claimRefs:
      - CE004
      - CE007
      - CE009

  - calloutType: risk
    title: Black-Box Methodology and Attribution Error Exposure
    body: >-
      The proprietary scoring algorithm is not independently audited, and the attribution engine still generates occasional
      false positives. Organizations incorrectly linked to foreign IP addresses or misattributed domains face unfair score
      penalties that persist until a manual dispute — which can take weeks to resolve. Forrester's 2024 critique also noted
      missing AI-parsing capability for evidence documents, limiting the platform's ability to validate vendor-submitted
      attestations. These gaps are structural risks that cannot be mitigated purely by scale.
    claimRefs:
      - CE038
      - CE039
      - CE040

  - calloutType: insight
    title: TITAN AI Positions SecurityScorecard for Active Defense — But Claims Require Diligence
    body: >-
      The March 2026 TITAN AI launch reframes SecurityScorecard from a ratings provider into a continuous detection-and-response
      platform. The 99.9% attribution accuracy claim, 75% breach reduction promise, and 95% manual-work reduction figures are
      compelling but are entirely company-asserted without third-party validation. Due diligence should require reference-check
      evidence of TITAN Secure remediation outcomes and an independent assessment of the HyperComply integration's production
      stability before accepting these metrics at face value.
    claimRefs:
      - CE022
      - CE023
      - CE024
      - CE041

