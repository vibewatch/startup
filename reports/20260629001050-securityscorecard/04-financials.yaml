company:
  name: SecurityScorecard

chapter:
  number: 4
  title: Financials
  summary: >
    SecurityScorecard exceeded $150M ARR as of October 2025—the only publicly disclosed revenue figure—with third-party
    aggregators estimating $144.3M for full-year 2024. MAX managed services grew at triple-digit rates (370% YoY as
    of mid-2025) and channel ARR expanded 160% in 2025, signaling a rapid shift toward managed and partner-delivered
    revenue. The company reported positive free cash flow and a 40% ARR-per-FTE improvement in its Q3 2025 record
    quarter. However, gross margin, net revenue retention, unit economics, burn rate, and ARR growth rates are
    undisclosed, creating material diligence gaps for any underwriting exercise. The $1B Series E valuation set in
    March 2021 is five years stale and not independently verified by a subsequent round.

sections:
  - id: arr-trajectory
    title: Revenue Model and ARR Trajectory
    body: >
      SecurityScorecard's disclosed revenue history is sparse but directionally positive. Third-party SaaS databases
      estimate ARR grew from approximately $71M in 2021 to $88.5M in 2022 (roughly 25% YoY), $106M in 2023 (~20% YoY),
      and $144.3M in early 2024 (~36% YoY)—representing an implied four-year CAGR of approximately 27%. The only
      company-disclosed figure is the $150M+ ARR milestone announced in October 2025 as part of a joint press release
      with Safe Security resolving a trade secret lawsuit. No standalone investor release, earnings call, or audited
      filing has confirmed this figure, limiting its auditability. No subsequent public ARR update has been issued as
      of June 2026, creating a growing freshness gap.

      The company's recurring revenue model is anchored in annual SaaS subscriptions for security ratings,
      third-party risk monitoring, and supply chain detection capabilities. These subscriptions generate predictable
      ARR with renewal dynamics typical of enterprise security software—though exact NRR and gross churn are not
      publicly available. Revenue recognition follows standard SaaS contract recognition; no deferred revenue
      complications or consumption-based anomalies have been disclosed. Given 3,300+ enterprise customers and $150M+
      ARR, the implied average contract value is approximately $45,000 per customer per year—consistent with
      enterprise TPRM pricing benchmarks.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI031
      - CI032
