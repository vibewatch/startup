      - CI036
      - CI024

  - calloutType: risk
    title: MAX Growth May Pressure Blended Gross Margin
    body: >
      MAX managed services—the fastest-growing product at triple-digit rates—involves partner-delivered
      services with a human cost-of-service component that likely carries materially lower gross margins
      than the core SaaS platform. As MAX's share of ARR expands, the blended gross margin trajectory
      may face compression. SecurityScorecard discloses no margin data, making this risk unquantifiable
      from public sources.
    claimRefs:
      - CI004
      - CI022
      - CI008

  - calloutType: insight
    title: Adverse Signal From Competitor CEO Contradicted by Subsequent Performance Data
    body: >
      In June 2024, Safe Security's CEO publicly alleged SecurityScorecard was "laying off significant
      portions of their teams because of the poor performance of their business." This characterization
      was made during active litigation and appears contradicted by the October 2025 record-quarter
      announcement. However, the adversarial context of financial disclosures (including the $150M ARR
      in the lawsuit resolution announcement) warrants independent verification of all company-claimed
      financial metrics.
    claimRefs:
      - CI027
      - CI028
      - CI001

