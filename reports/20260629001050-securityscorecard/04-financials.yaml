  - calloutType: risk
    title: Material Financial Opacity Limits Underwriting Confidence
    body: >
      SecurityScorecard discloses no gross margin, net revenue retention, burn rate, or unit economics.
      The single ARR data point ($150M+, October 2025) was released in the context of a lawsuit settlement
      rather than a standard investor communication, limiting its auditability. The stale $1B Series E
      valuation (March 2021) provides no independent market check on current financial quality.
    claimRefs:
