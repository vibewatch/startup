  - id: financial-gaps-verdict
    title: Financial Quality Assessment and Diligence Gaps
    body: >
      SecurityScorecard's observable financial profile is consistent with a growing, increasingly capital-efficient
      SaaS company: ARR exceeding $150M, positive free cash flow, 40% ARR/FTE improvement, triple-digit MAX growth,
      and 10+ consecutive quarters of revenue growth. These are meaningful signals for a private company in the TPRM
      market. However, nearly every metric required for full financial underwriting remains private or unverified.

      The adverse signal from the Safe Security CEO in June 2024—alleging that SecurityScorecard was "laying off
      significant portions of their teams because of the poor performance of their business"—was made during active
      litigation and represents a motivated competitor's characterization. The subsequent October 2025 press release
      reporting positive FCF and record quarterly performance directly contradicts this framing. However, the litigation
      context of the original $150M ARR disclosure (it appeared in the lawsuit settlement announcement rather than a
      standalone financial release) invites scrutiny and reduces its independent verifiability. The external-only
      security assessment methodology has also faced criticism for potential false positives and limited depth, which
      could impair pricing power and enterprise upsell capacity over time.

      Key diligence blockers include: gross margin by product line (core SaaS vs. MAX vs. TITAN AI), net revenue
      retention, trailing ARR growth rate from the $150M floor, exact headcount composition and productivity by
      function, cash and debt positions, and contribution margins from emerging revenue streams (insurance data,
      questionnaire automation). None of these are accessible from public sources as of June 2026.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI034
      - CI035
      - CI039
