  - id: capital-adequacy
    title: Capital Adequacy and Funding Posture
    body: >
      SecurityScorecard has raised approximately $293M in equity across seven rounds from 2013 through its March 2021
      Series E at a $1B post-money valuation. No new equity round has been publicly announced since March 2021—meaning
      the company has operated for more than five years on the Series E capital stack. The $1B valuation is therefore
      more than five years stale and reflects Series E market dynamics that differ substantially from current conditions.
      No debt facility, credit line, or secondary liquidity event has been publicly confirmed.

      The positive free cash flow signal from October 2025 suggests SecurityScorecard is not burning cash at a material
      rate, which is significant given the five-year absence of a new capital raise. This implies either (a) the company
      has reached or is near operating breakeven on a cash basis, (b) it has a material cash reserve from the Series E
      that continues to fund operations, or (c) some combination. Without a balance sheet disclosure, none of these
      hypotheses can be confirmed. The 40% ARR/FTE efficiency improvement reinforces the capital efficiency narrative,
      though the absolute cash position remains unknown. IPO readiness has been referenced in executive case studies,
      but no S-1 filing, bankers announcement, or explicit IPO timeline has been disclosed as of June 2026.

      At the implied $150M+ ARR run rate and a 7–10x ARR multiple typical for private SaaS cybersecurity companies
      in 2026, the enterprise value would be approximately $1.05–$1.5B, which roughly brackets the 2021 valuation.
      This suggests the stale valuation is neither dramatically cheap nor expensive relative to current ARR—but it
      is unverifiable without a current funding event.
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI038
      - CI043
