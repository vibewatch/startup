  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "SecurityScorecard's gross margin by product line (core SaaS vs. MAX vs. TITAN AI) and blended COGS as a percent of revenue."
      whyItMatters: "Cannot assess profitability trajectory, MAX margin compression risk, or underwriting economics without segment-level margin disclosure."
      diligencePath: "Request audited or management-prepared P&L with COGS segmented by product line; compare to SaaS and managed services benchmarks."
      relatedQuestionRefs:
        - QI009
        - QI019

    - type: private-evidence-only
      severity: blocking
      topic: NRR
      missingEvidence: "Net revenue retention (NRR) and gross logo churn rate by customer cohort and pricing tier."
      whyItMatters: "NRR is the most important SaaS revenue quality indicator; without it, growth quality cannot be assessed—all ARR growth could be offset by churning customers."
      diligencePath: "Request NRR cohort analysis by tier; expansion ARR from upsell and cross-sell vs. contraction from downsell and churn."
      relatedQuestionRefs:
        - QI014
        - QI019

    - type: missing-source
      severity: blocking
      topic: ARR
      missingEvidence: "Current ARR as of Q1–Q2 2026—the October 2025 $150M+ figure is 8+ months stale as of June 2026."
      whyItMatters: "The freshness gap between the last disclosed ARR and the diligence date means any financial model is anchored on potentially outdated data."
      diligencePath: "Request current ARR as of March or June 2026; compare to October 2025 baseline to determine growth trajectory."
      relatedQuestionRefs:
        - QI013
        - QI024

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: "Monthly cash burn, operating cash flow, and ending cash balance as of the most recent reporting period."
      whyItMatters: "Positive FCF is directional only; actual runway, capital adequacy, and need for additional financing cannot be assessed without balance sheet access."
      diligencePath: "Request management balance sheet as of December 2025 or March 2026; review operating cash flow statement."
      relatedQuestionRefs:
        - QI021
        - QI008

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "Customer acquisition cost (CAC), sales cycle length, and payback period by customer segment and geography."
      whyItMatters: "Cannot calculate capital efficiency of growth or LTV:CAC ratio without these inputs; critical for evaluating the scalability of the commercial model."
      diligencePath: "Request S&M spend by function and quarter; new ARR sourced from each sales channel; average sales cycle by deal size."
      relatedQuestionRefs:
        - QI014
        - QI015

    - type: private-evidence-only
      severity: material
      topic: revenue-mix
      missingEvidence: "Revenue breakdown by product line (core SaaS, MAX channel, TITAN AI questionnaire automation, insurance data licensing) as a percentage of total ARR."
      whyItMatters: "Cannot assess blended margin trajectory or how MAX growth affects overall financial profile without segment revenue disclosure."
      diligencePath: "Request product-line ARR as of the most recent quarter; compare growth rates and margins by segment."
      relatedQuestionRefs:
        - QI003
        - QI017

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: "Revenue contribution from top 10 customers as a percentage of total ARR; renewal status and contract length distribution."
      whyItMatters: "Customer concentration risk is a key revenue quality signal; high concentration in a few enterprise accounts creates revenue cliff risk."
      diligencePath: "Request top-10 customer ARR table; renewal schedule; average contract term length by tier."
      relatedQuestionRefs:
        - QI022

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      The notes fields on all five tables provide data-source caveats, estimation methodology, and
      confidence qualifiers. TableNotes has been included for all tables; this ack covers any residual
      warning for tables where the note could not be reduced further without losing important context.
  - dimension: unverifiedSource
    reason: >
      Several sources (SI003, SI004, SI007, SI010, SI012, SI013, SI015, SI016, SI018, SI019, SI020, SI021, SI024)
      reference URLs that were not retrieved via the fetch-url trail during this run. These sources were identified
      through web search and secondary databases; the cited facts are corroborated by other verified sources in
      this chapter and no claim relies solely on an unverified source. Sources are retained per policy; claims
      backed exclusively by unverified sources have been marked with lower confidence.
