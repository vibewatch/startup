  - calloutType: strength
    title: Positive Free Cash Flow and Improving Capital Efficiency
    body: >
      SecurityScorecard's October 2025 press release disclosed positive free cash flow and a 40% improvement
      in ARR per FTE. After five years without a new equity round, these signals suggest the company has
      reached or is approaching cash-neutral operations—materially de-risking the capital adequacy picture
      relative to earlier-stage SaaS companies at comparable ARR scale.
