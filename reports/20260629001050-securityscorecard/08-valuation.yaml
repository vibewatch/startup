  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - NRR below 100%
        - Any disclosed or credibly inferred net revenue retention below 100%
        - Signals customer churn overcoming expansion; revenue quality collapses; all premium multiples invalid
        - Downgrade to AVOID; revise EV floor to 3–4x ARR ($450–600M)
      - - Gross margin below 70%
        - Disclosed gross margin below 70% at any scale
        - MAX managed services cost-of-delivery exceeds SaaS norm; company re-rated as tech-enabled services
        - Apply services multiple (4–7x EBITDA vs 6–10x ARR); EV compression of 30–50%
      - - Down round or flat round
        - Primary equity financing at less than $900M post-money valuation
        - Confirms secondary market signal; liquidation preferences reset; earlier investors impaired
        - Triggers investor governance review; reassess cap-table waterfall for equity value distribution
      - - BitSight platform acquisition by major insurer or ratings agency
        - Moody's, S&P, Verisk, or large reinsurer acquires or further integrates BitSight as exclusive cyber ratings standard
        - Eliminates SSC's insurance underwriting differentiation; addressable market for core ratings shrinks
        - Downgrade to AVOID; SSC's strategic optionality heavily discounted
      - - Revenue concentration revealed above 20% in single customer or partner
        - Customer or partner contributing >20% of ARR disclosed or inferred
        - Concentration risk incompatible with SaaS premium; churn risk becomes catastrophic
        - Require customer concentration covenant before any equity purchase or LP commitment
    notes: >
      Triggers are ordered by materiality to the investment thesis. The NRR and gross margin triggers are the most
      actionable because they are disclosable facts within management's control. The competitive trigger (BitSight
      acquisition) is externally driven and would require rapid reassessment.
    claimRefs:
      - CV035
      - CV036
      - CV041
      - CV042

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Net Revenue Retention
        - Gross and net revenue retention by cohort and segment (overall, enterprise, insurance, managed services)
        - NRR is the single most important SaaS valuation driver; without it, the applicable multiple range spans 3x–15x ARR — too wide to underwrite
        - Management data room request; cross-reference with customer expansion deal announcements
      - - Gross Margin
        - Disclosed blended gross margin and segment-level margins (SaaS ratings, MAX managed services, insurance API)
        - If managed-services gross margin is 40–50%, blended margin may be below the 70% SaaS threshold; this would trigger a 30–50% multiple discount
        - Management data room; benchmark against comparable MSSP and SaaS hybrid companies
      - - Cap Table and Preference Stack
        - Fully diluted share count, option pool, preference liquidation waterfall, anti-dilution provisions by round
        - Secondary market prices common shares; preference overhang across 6 rounds may mean common equity receives materially less than headline EV in a sale at $900M–$1.2B
        - Request directly from company; model multiple exit price scenarios through preference stack
      - - Insurance Revenue Contribution
        - Quantified revenue from cyber-insurance underwriting APIs and premium analytics partnerships
        - Insurance-underwriting ARR commands a structural premium in a potential sale to a ratings incumbent (Moody's, Verisk); without quantification, this strategic asset is priced at zero
        - Management disclosure or channel-partner revenue agreement review
      - - ARR Growth Rate by Segment
        - Quarterly ARR growth by product line (core ratings, MAX, HyperComply, international) for trailing 8 quarters
        - Channel ARR grew 160% YoY but total ARR CAGR is ~21%; verifying which segments drive durable vs. partner-concentrated growth is critical to projecting 2027–2028 revenue
        - Management data room; corroborate with CrowdStrike and WTW marketplace reports citing SSC channel metrics
    notes: >
      Diligence asks are ranked by valuation impact. Without NRR and gross margin, the bull-case thesis cannot be
      validated and the recommendation should not be upgraded from TRACK to BUY. Cap table and insurance-revenue
      quantification are secondary but material for deal structure and strategic-premium modeling.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV043

