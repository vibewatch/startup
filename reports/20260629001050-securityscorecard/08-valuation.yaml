  - id: scenarios
    title: Bull, Base, and Bear Scenarios
    body: >
      The bull case rests on three conditions: TITAN AI delivers measurable ARR acceleration above 30% per
      year by 2027, the insurance-driven revenue stream becomes quantifiable and earns a separate strategic-asset
      premium, and a financial or strategic acquirer (insurance carrier, credit ratings firm, or large GRC/risk
      platform) pays a 10–15x ARR multiple for the combined TPRM-plus-insurance-analytics package. At 15x ARR
      on $175M projected ARR, the enterprise value would reach approximately $2.25B — a 125% return over the $1B
      2021 anchor. This scenario depends on margin disclosure confirming 75%+ gross margins and 110%+ NRR.

      The base case assumes continued 15–20% total ARR growth, no strategic acquirer paying a premium, and a
      public cybersecurity IPO market in 2027–2028 where TPRM/risk-ratings vendors trade in the 6–8x ARR band.
      At 7x ARR on $165M (mid-2027 projected ARR), the enterprise value reaches approximately $1.15B, broadly
      consistent with the $1B last-round price and offering modest upside from current secondary market levels.
      The base case is not a strong buy signal given the lack of downside protection from disclosed metrics.

      The bear case is triggered by margin or NRR disclosure revealing a sub-70% gross margin (consistent with
      the managed-services-heavy MAX model) and sub-100% NRR (customer churn pressured by BitSight/UpGuard
      competition). In this scenario, a 3–5x ARR multiple applies, yielding $450–$750M enterprise value — below
      the $1B last-round price and representing a meaningful down round. The secondary market's $360M implied
      valuation may be pricing in an asymmetric tail of this scenario, potentially compounded by cap table
      overhang from liquidation preferences accumulated across six rounds.
