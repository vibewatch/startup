callouts:
  - calloutType: risk
    title: Secondary Market Pricing Is an Adverse Valuation Signal
    body: >
      Secondary market platforms (Premier Alternatives: $359.5M implied EV; Hiive: $1.66/share) price
      SecurityScorecard equity at a 53–64% discount to the March 2021 $1B round price, and the 52-week
      trend is negative (−13%). While secondary market prices reflect liquidity discounts, cap-table
      complexity, and limited volume, a sustained discount of this magnitude is a warning signal. Investors
      should treat the secondary implied EV of $360–$470M as a bearish anchor requiring active rebuttal
      via disclosed NRR and gross margin data before adopting a base-case assumption near $1B.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV035

  - calloutType: insight
    title: The Securiti AI Comp Is the Most Directly Anchoring Reference
    body: >
      Veeam's $1.725B acquisition of Securiti AI in Q4 2025 at approximately $150M ARR and ~11x ARR is
      the most comparable transaction for SecurityScorecard: same ARR scale, both AI-integrated, both
      private-company cybersecurity SaaS with enterprise focus. This comp places a strategic-acquisition
      midpoint of ~$1.6–1.8B for SecurityScorecard if a strategic buyer emerged — comfortably above the
      $1B round price — but this assumes a buyer willing to pay a strategic premium for the TPRM-plus-insurance
      asset, which has not yet materialized and cannot be assumed without evidence.
    claimRefs:
      - CV018
      - CV019

  - calloutType: recommendation
    title: TRACK Until NRR and Margin Are Disclosed
    body: >
      The TRACK recommendation reflects a company with demonstrated market leadership and structural tailwinds
      that is nonetheless impossible to underwrite at a specific valuation without core financial disclosures.
      The upgrade to BUY requires: (1) NRR confirmed at 110%+ or higher, (2) gross margin confirmed at 70%+
      consistent with pure SaaS, and (3) either an IPO filing or credible M&A process at base-case-or-higher
      valuation. Any one of these catalysts occurring would justify re-evaluation within 90 days.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV043

