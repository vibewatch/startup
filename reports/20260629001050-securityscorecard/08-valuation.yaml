  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: NRR and gross margin
      missingEvidence: >
        Net revenue retention (gross and net), blended gross margin, and segment-level gross margins for
        SecurityScorecard's SaaS ratings, MAX managed services, and insurance API revenue streams.
      whyItMatters: >
        NRR and gross margin are the two most material valuation drivers in SaaS underwriting. Without them,
        the applicable multiple range spans 3–15x ARR — a $1.8B range at $150M ARR — making precise
        price-setting impossible. A sub-70% gross margin would reclassify SSC as tech-enabled services.
      diligencePath: >
        Data room request from management or through lead investor channel; NRR proxy from customer expansion
        deal announcements and competitive displacement data; gross margin implied by headcount and revenue data.
      relatedQuestionRefs:
        - QV020
        - QV026
        - QV032
        - QV034

    - type: private-evidence-only
      severity: blocking
      topic: cap table and preference stack
      missingEvidence: >
        Fully diluted share count, liquidation preference waterfall by round, anti-dilution provisions,
        and employee stock option pool size to calculate equity waterfall across exit scenarios.
      whyItMatters: >
        Six rounds of financing with liquidation preferences may mean common equity receives materially
        less than the headline enterprise value in a $900M–$1.2B base-case exit. Secondary market
        prices (which reflect common shares) may already be pricing this dilution discount.
      diligencePath: >
        Direct request from company or lead investor; model preference stack across $450M, $1B, and
        $2.25B exit scenarios to determine common equity proceeds under bear/base/bull cases.
      relatedQuestionRefs:
        - QV029
        - QV034

    - type: missing-source
      severity: material
      topic: insurance revenue quantification
      missingEvidence: >
        Quantified revenue or ARR contribution from cyber-insurance underwriting API integrations (Aon,
        Willis, insurers) as a distinct segment with its own pricing, retention, and growth dynamics.
      whyItMatters: >
        Insurance-underwriting ARR commands a structural premium in a potential sale to a credit-ratings
        or risk-data incumbent. Without quantification, this strategic asset is valued at zero in any
        DCF or comp-based approach, potentially understating intrinsic value if the segment is material.
        The comparable valuation table (TV004) is marked partial because no publicly traded or recently
        acquired insurance-analytics pure-play was available at matching ARR scale to serve as a comp.
      diligencePath: >
        Request segment-level ARR breakdown; review partnership agreements for revenue-share structure;
        benchmark against insurance analytics vendors for applicable premium multiple.
      relatedQuestionRefs:
        - QV004
      relatedTableRefs:
        - TV004

    - type: stale
      severity: material
      topic: secondary market volume and velocity
      missingEvidence: >
        Transaction volume, bid-ask spread, and number of active trades on secondary platforms (Hiive,
        Premier Alts, Forge) to assess whether prices reflect arm's-length trades or thin-market
        indicative bids.
      whyItMatters: >
        A $360M secondary implied EV based on one or two small block trades is far less reliable
        than a price based on active bidding with volume. Thin markets can produce artificially
        depressed prices that overstate down-round risk, or alternatively a few optimistic bids
        that understate valuation compression.
      diligencePath: >
        Register with private secondary marketplaces (Hiive, Forge, PM Insights) to request
        recent transaction history and bid-ask spread data for SecurityScorecard shares.
      relatedQuestionRefs:
        - QV013
        - QV029

