  - id: investment-thesis
    title: Investment Thesis, Anti-Thesis, and Kill Criteria
    body: >
      The investment thesis rests on SecurityScorecard's category leadership in a structurally growing market.
      TPRM is no longer optional: NIS2, DORA, the SEC cyber-disclosure rule, and supply-chain ransomware frequency
      have converted security ratings from a discretionary tool to a board-level mandate. SecurityScorecard's 12M+
      rated organizations, Fortune 100 penetration (70%), and deep insurance-underwriting integrations (Aon, Willis,
      and others) constitute a data and relationship moat that is difficult for new entrants to replicate. The TITAN
      AI launch at RSA 2026 and the HyperComply acquisition address the questionnaire-automation gap and could expand
      the total contract value per account.

      The anti-thesis is equally documented. The TPRM field has 200+ competitors; the Forrester Wave Q2 2026
      placed BitSight as a Leader while SecurityScorecard was not top-ranked, suggesting competitive erosion at
      the highest-value enterprise deals. The outside-in ratings methodology faces persistent false-positive
      criticism that undermines buyer confidence and creates churn risk. Revenue opacity prevents verification of
      margin quality, NRR, or whether growth is driven by expansion (high multiple deserving) versus new logos
      (lower multiple deserving). The $1B valuation is five years stale with no subsequent price discovery, while
      secondary markets have moved 50–64% lower, implying investors are pricing exit uncertainty.

      The thesis break is a confirmed NRR below 100%, a disclosed gross margin below 70%, or a new primary round
      priced below $900M (i.e., a down round against the $1B 2021 anchor). Any of these would structurally shift
      the recommendation from TRACK to AVOID.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
    tableRefs:
      - TV002
      - TV005
    figureRefs:
      - FV001

  - id: exit-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >
      SecurityScorecard has no announced IPO plans as of June 2026, and the cybersecurity IPO bar is high:
      Netskope required $707M ARR with 33% growth and 118% NRR to command a $7.3B debut. At $150M ARR and with
      undisclosed NRR and profitability, SecurityScorecard is not yet public-market ready on disclosed metrics
      alone. An M&A exit is the more probable near-term liquidity path, with potential strategic buyers including
      a credit-risk data incumbent (Moody's, S&P, Verisk), a large GRC/risk platform vendor (ServiceNow, SAP),
      a managed-security services acquirer, or a private equity consolidation of the TPRM category.

      The most critical diligence priority is NRR, gross margin, and burn-rate disclosure, without which no
      premium multiple can be defended. Secondary priorities include cap table transparency (preference
      structure, anti-dilution provisions, weighted-average proceeds allocation) and the quantification of
      insurance-underwriting revenue as a distinct asset with its own strategic premium.

      Final diligence asks are structured in Table TV006. Absent satisfactory responses to the NRR and
      margin disclosures, the recommendation remains TRACK rather than BUY, and investors should not price
      in bull-case outcomes without primary evidence.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
    tableRefs:
      - TV006

