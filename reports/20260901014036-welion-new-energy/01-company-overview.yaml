  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: An official, dated company disclosure that reconciles whether current headcount is above 1,200 or closer to 1,300 and how many staff sit in R&D versus manufacturing.
    whyItMatters: Headcount is a proxy for scale, burn, and organizational maturity; current public numbers conflict across sources.
    diligencePath: Request the latest HR/org snapshot or prospectus headcount table from management; re-check prospectus once ChiNext filing is public.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Audited revenue, gross margin, operating loss, capex, and cash balance figures.
    whyItMatters: Without audited financials, investors cannot distinguish real commercialization from heavily subsidized scale-up or quantify IPO readiness.
    diligencePath: Wait for ChiNext prospectus, management presentation, or audited financing materials; verify against regulator filings.
    relatedQuestionRefs:
    - QO023
    - QO024
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board composition, investor rights, and related-party governance disclosures.
    whyItMatters: The company is founder/scientist-led and capex intensive; control rights and governance quality directly affect IPO and minority-investor risk.
    diligencePath: Review future prospectus, shareholder agreements, and board committee disclosures once filed.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: minor
    topic: footprint
    missingEvidence: A reconciled site-and-capacity table that explains the difference between four major bases and seven total bases in public materials.
    whyItMatters: Operating-footprint ambiguity muddies capacity planning, capex needs, and real manufacturing readiness.
    diligencePath: Ask management for site list with commissioning dates, designed capacity, and current utilization.
    relatedQuestionRefs:
    - QO014
    - QO015
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Pack volumes, pricing, take rate, and margin contribution for NIO and ESS programmes.
    whyItMatters: Deployment headlines do not reveal whether WeLion has found a repeatable profitable customer wedge.
    diligencePath: Request signed-customer summary, shipment table, and gross-margin bridge during management diligence.
