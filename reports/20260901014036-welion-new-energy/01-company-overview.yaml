- id: capital-base-and-commercial-stakeholders
  title: Capital Base and Commercial Stakeholders
  body: >-
    By the time WeLion began ChiNext pre-IPO tutoring in December 2025, the company was already backed by

    a dense network of strategic and financial investors. English-language reporting from CnEVPost,

    ChinaEVHome, Jiemian Global, and SMM consistently named Huawei-backed Hubble Investment, Xiaomi's

    Changjiang Industrial Fund, NIO Capital, Geely-linked capital, and later ICBC Capital or Guangdong

    Energy Group among the company's shareholders or D+-round participants. The investor list matters

    because it is unusually aligned with WeLion's go-to-market path: NIO is an anchor customer in premium

    EVs, Xiaomi and Huawei represent potential ecosystem and industrial connectivity, and state-backed or

    bank-affiliated funds can support the long capex cycle that battery manufacturing requires.


    Public reporting also indicates that WeLion had completed nine financing rounds by the time of the 2025

    IPO push. The 2025 Hurun Global Unicorn Index assigned the company an RMB 18.5 billion valuation, while

    2026 sector commentary from SMM referenced a roughly RMB 20 billion pre-IPO value. Those figures should

    not be blended casually: the former is an index valuation and the latter is market commentary tied to a

    later fundraising window. But taken together they show that external investors continued to mark WeLion

    firmly above the unicorn threshold as commercialization evidence accumulated.


    Beyond equity capital, the stakeholder map now extends into suppliers and industrial partners. BASF's

    battery-materials joint venture publicly confirmed shipments of cathode active materials for WeLion's

    semi-solid programme, while the Shaanxi Forestry Industry Group cooperation agreement shows WeLion using

    joint-venture structures to push energy-storage manufacturing outward. The picture is of a startup that

    is no longer capitalized only by venture investors; it now sits inside a broader industrial coalition.
