- id: manufacturing-footprint-and-products
  title: Manufacturing Footprint and Product Scale
  body: >-
    The public record on WeLion's physical scale is directionally clear but numerically messy, which is

    itself an important diligence point. Official and semi-official materials describe Fangshan in Beijing

    as the corporate and R&D anchor, but different sources count different numbers of industrial bases and

    capacity milestones. An August 2026 SMM review highlighted four major battery bases in Fangshan,

    Liyang, Huzhou, and Zibo, with capacity expected to reach 7 GWh by 2024 and 16 GWh by 2025. A 2026

    exhibition profile, however, described seven major bases including Shaoxing, Shenzhen, and Zhuhai.

    These descriptions may not actually conflict—one likely counts major battery-production bases and the

    other a wider set of affiliated operating sites—but the company has not provided one public, audited

    operating-footprint table that reconciles them.


    Product-level evidence is stronger. WeLion's semi-solid cells are already associated with three visible

    commercialization tracks: the 360 Wh/kg NIO vehicle cell, a 280Ah energy-storage cell supplied into

    grid or industrial projects, and a 4695 cylindrical cell programme with JAC Yiwei targeting 600–1,000

    km range vehicles. In 2026, additional lightweight-power products—the SHP410 and SHP480—were announced

    for UAVs, robotics, and mobile power at Battery Show Europe. That breadth suggests WeLion is trying to

    spread technical risk across adjacent applications rather than depending solely on one premium EV pack.


    Still, production evidence does not equal full industrial maturity. The company remains early on the

    journey from semi-solid bridge chemistry to true all-solid-state scale manufacturing, and later chapters

    treat that gap as a core risk rather than a settled achievement.
