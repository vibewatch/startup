    topic: headcount
    missingEvidence: >-
      An official, dated company disclosure that reconciles whether current headcount is above 1,200 or closer to 1,300
      and how many staff sit in R&D versus manufacturing.
    whyItMatters: Headcount is a proxy for scale, burn, and organizational maturity; current public numbers conflict across sources.
    diligencePath: >-
      Request the latest HR/org snapshot or prospectus headcount table from management; re-check prospectus once ChiNext
      filing is public.
