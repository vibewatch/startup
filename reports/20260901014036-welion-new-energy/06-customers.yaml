- id: deployment-proof-and-end-user-adoption
  title: Deployment Proof and End-User Adoption
  body: >-
    The NIO relationship gives WeLion something most advanced-battery startups do not have: visible end-user

    adoption evidence. Multiple 2023-2026 sources document the 150 kWh semi-solid battery pack entering service,

    being integrated into NIO vehicles, and achieving real-world long-range demonstrations in the ET7. Later 2026

    sources also frame semi-solid packs as compatible with NIO's battery-swap ecosystem and present battery swap

    as a scaled customer behavior rather than a lab test. Even if some coverage is promotional, the aggregate

    picture is clear — WeLion technology is in front of real drivers, not just procurement teams.


    The JAC Yiwei cooperation adds another adoption surface. It does not yet match NIO's deployed proof depth, but

    it indicates another OEM willing to co-develop around WeLion's large cylindrical semi-solid cells. On the ESS

    side, the Shaanxi Forestry procurement and Qingyang pack-project coverage show that customers are also buying

    into storage-related use cases, not only passenger vehicles.


    Still, public proof is uneven. We can observe deployment and demonstrations; we cannot observe broad shipment

    counts, repeat order sizes, or customer-level profitability. Adoption is visible, but not fully measured.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
