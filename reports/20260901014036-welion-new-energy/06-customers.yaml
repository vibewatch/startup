- id: retention-repeat-usage-and-customer-quality
  title: Retention, Repeat Usage, and Customer Quality
  body: >-
    The best public repeat-usage proxy is not a renewal table but the NIO battery-swap and deployment ecosystem.

    Battery-swap compatibility matters because it turns an advanced battery into a repeat-use service surface:

    drivers are not merely buying once, but using the battery inside an ongoing infrastructure network. Real-world

    range demonstrations and later network-scale swap statistics suggest genuine end-user engagement around the

    NIO platform, even if they do not isolate how many users specifically select the 150 kWh WeLion-powered pack.


    Customer quality also looks stronger on the NIO side than on the rest of the portfolio. NIO remains a large,

    public, heavily financed OEM capable of supporting advanced battery programs. By contrast, the second-line

    customer set is promising but still opaque. JAC Yiwei is developmental; ESS counterparties are often project

    or JV structures rather than highly transparent public customers; and broader category customers remain mostly

    unnamed in public materials.


    The retention verdict is therefore mixed. NIO provides a rare recurring-use environment and credible customer

    quality, but public evidence on repeat orders, multi-year renewals, and segment diversification remains thin.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
