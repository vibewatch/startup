company:
  name: WeLion New Energy
chapter:
  number: 6
  title: Customers
  summary: >-
    WeLion's customer picture is real but concentrated. The company can point to one highly visible anchor customer in

    NIO, one important second OEM pathway through JAC Yiwei, and a growing set of energy-storage and industrial project

    relationships including the Shaanxi Forestry group cooperation and related pack-manufacturing projects. Yet the

    public record still shows far more depth on NIO than on any other customer, making customer concentration and proof-

    depth imbalance the central commercial issue in 2026.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: >-
    Publicly visible WeLion customers fall into three main groups. First are premium EV OEM programs, dominated by

    NIO and secondarily supported by the JAC Yiwei collaboration. Second are energy-storage and industrial

    counterparties such as Shaanxi Forestry Industry Group and associated joint-venture or procurement structures.

    Third are a broader but less specifically named set of application customers in construction machinery, marine,

    light mobility, and specialty-power contexts implied by WeLion's product materials. This is enough to prove

    that the company is not single-segment in aspiration, but not enough to prove balanced revenue by customer.


    The biggest segmentation fact is concentration. NIO is the only customer with repeated public evidence across

    deployment, end-user experience, battery-swap compatibility, timing milestones, and vehicle use. JAC Yiwei is

    a meaningful second OEM relationship, but still reads as a programme under development. Energy-storage

    customers show growing importance through project announcements, but named end-market deployment detail remains

    thinner than the NIO record.


    The resulting customer map is therefore lopsided: one highly visible anchor, a handful of credible second-line

    proofs, and a long tail of still-thin public demand signals.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
