callouts:
- calloutType: strength
  title: NIO gives WeLion unusually strong customer proof for a battery startup
  body: >-
    Most advanced-battery startups struggle to show real end-user adoption. WeLion can show vehicle integration,

    service launch, range demonstrations, and likely swap-network compatibility through NIO — a materially deeper

    customer-proof stack than a typical pilot-line battery company.
  claimRefs:
  - CU010
  - CU012
  - CU020
  - CU021
- calloutType: risk
  title: Customer concentration remains the core commercial weakness
  body: >-
    Public proof outside NIO is improving but still much thinner. If the NIO premium-battery programme stagnates,

    WeLion does not yet have equally well-evidenced customer channels ready to replace the flagship narrative.
  claimRefs:
  - CU006
  - CU026
  - CU033
  - CU035
- calloutType: risk
  title: Announcements do not equal repeat monetized deployments
  body: >-
    JAC Yiwei, Shaanxi procurement, and Qingyang project announcements all matter, but public evidence still does

    not prove repeat orders, realized revenue, or durable cohort retention. The customer story is credible, yet

    still highly dependent on future conversion from visible programs to repeat business.
  claimRefs:
  - CU016
  - CU024
  - CU029
  - CU034
