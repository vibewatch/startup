- id: market-size-and-segment-economics
  title: Market Size, Scale, and the Solid-State Wedge
  body: >-
    At the top-down level, the EV battery market is already enormous. Axis Intelligence estimated global EV

    battery deployment at 1.2 TWh in 2025, up 30% year over year, with average pack prices falling to

    $108/kWh. CnEVPost's H1 2026 SNE data then showed 608.5 GWh of global EV battery usage in just the first

    half, up 20% year over year. These figures confirm that battery demand is not speculative; it is a very

    large, still-growing industrial market.


    Yet the solid-state portion is still small. IMARC estimated the China solid-state battery market at only

    about $400.4 million in 2025, with a path to roughly $5.1 billion by 2034 and a 32.71% CAGR. That is

    fast growth from a small base, not immediate parity with the larger EV battery market. Energy Solutions

    likewise argues that solid-state remains in prototype-to-pilot transition, with pilot-scale costs of

    $300–500/kWh versus roughly $90–110/kWh for high-nickel liquid cells and $70–90/kWh for LFP. In other

    words, the relevant wedge is strategically important but still commercially selective.


    For WeLion, the useful sizing lens is not 'all EV batteries' but the subset where density and safety win

    despite higher cost: premium Chinese EVs, premium export programmes, demo fleets, and specialized ESS or

    lightweight-power applications. That is still a multi-billion-dollar opportunity over time, but it is

    smaller and slower than the broad-TAM narratives often attached to solid-state technology.
