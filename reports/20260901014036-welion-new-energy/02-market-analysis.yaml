    missingEvidence: A management-grade breakdown of WeLion's actual served market by EV, ESS, and lightweight-power revenue or contracted capacity.
    whyItMatters: Top-down market size is abundant, but investability depends on the company's realistic served market and notional share within it.
    diligencePath: Request segment revenue, booked pipeline, and customer-program capacity commitments from management or future prospectus.
