callouts:
- calloutType: strength
  title: WeLion already looks like a product system, not just a chemistry claim
  body: >-
    The most investable part of WeLion's technology story is that it spans chemistry, formats, packs, and use

    cases. Public evidence shows concrete product positioning across EVs, ESS, construction, and marine, which is

    materially stronger than a single-lab-breakthrough narrative.
  claimRefs:
  - CE001
  - CE010
  - CE013
  - CE019
- calloutType: risk
  title: The bridge-product advantage depends on honest classification
  body: >-
    WeLion benefits if the 2026 standards environment clearly separates hybrid solid-liquid batteries from true

    all-solid-state products. But the same clarity also limits overclaiming: investors must not confuse a leading

    semi-solid commercialization story with already-solved all-solid-state manufacturing.
  claimRefs:
  - CE028
  - CE029
  - CE030
  - CE033
- calloutType: risk
  title: Public technical detail is still thinner than public commercial narrative
  body: >-
    WeLion shares enough detail to show credible architecture and product breadth, but not enough to audit yield,

    cycle-life decay, warranty risk, or all claimed certifications. The public story is stronger on product logic

    than on fully verifiable engineering data.
  claimRefs:
  - CE024
  - CE035
  - CE036
  - CE037
