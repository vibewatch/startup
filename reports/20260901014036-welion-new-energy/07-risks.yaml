  - type: private-evidence-only
    severity: material
    topic: ess-conversion-and-collections
    missingEvidence: Commissioning, acceptance, payment, and repeat-order evidence for ESS projects and procurement deals.
    whyItMatters: Headline order values can overstate durable revenue if project conversion lags or collections weaken.
    diligencePath: Request signed delivery milestones, invoices, or operating asset references for key projects.
