  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-compliance-pack
    missingEvidence: Internal battery-passport, carbon-footprint, labelling, and dangerous-goods documentation for actual exportable products.
    whyItMatters: This evidence would turn abstract EU compliance risk into an auditable operating-readiness judgment.
    diligencePath: Request sample product compliance files and identify the internal owner responsible for EU documentation.
    relatedQuestionRefs:
    - QR008
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: manufacturing-quality-metrics
    missingEvidence: Yield, scrap, warranty, cycle-life cohort, and field-failure data by product line.
    whyItMatters: Without these metrics, the manufacturing-risk assessment remains directionally correct but not fully quantified.
    diligencePath: Request plant KPI dashboards or prospectus-grade operating metrics.
    relatedQuestionRefs:
    - QR021
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-diversification
    missingEvidence: Revenue share, repeat-order history, and installed-base detail for customers beyond NIO.
    whyItMatters: This is the key missing evidence for judging concentration risk and scenario resilience.
    diligencePath: Request top-customer concentration data and named repeat-deployment case studies.
    relatedQuestionRefs:
    - QR017
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: governance-depth
    missingEvidence: Full board composition, committee structure, and second-line operations leadership chart.
    whyItMatters: These details would sharpen the people-and-governance risk ranking ahead of IPO.
    diligencePath: Request governance materials used in tutoring or board presentations.
    relatedQuestionRefs:
