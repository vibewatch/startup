summary:
  headline: WeLion 有真实商业化证明、少见的中国半固态电池可信度，也有可行的 IPO 路径；但当前 RMB 18.5-20.0bn 的估值叙事仍跑在收入、利润率、客户集中度和制造质量的公开证据前面，低置信度下最稳妥的结论是 Track。
