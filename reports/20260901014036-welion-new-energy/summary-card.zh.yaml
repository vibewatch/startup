  topStrengths:
    - 借助 NIO 跑出的真实装车证明，让 WeLion 的商业化论据强于许多下一代电池初创公司。
    - Chinese Academy of Sciences 渊源和 Institute of Physics 背景，撑起可信的技术护城河和战略叙事。
    - BASF 材料支持、JAC Yiwei 合作和 ESS 项目的公开证据显示，公司不只是单一实验室故事。
    - >-
      Late-stage funding and IPO tutoring indicate continued capital-market and strategic-investor interest. 后期融资和 IPO
      辅导说明资本市场与战略投资人仍有兴趣。
    - 半固态桥接产品让 WeLion 在全固态全面产业化之前，先把部分固态叙事变现。
  topRisks:
    - 公开财务仍高度不透明：收入、毛利率、现金、良率和股权结构条款都未披露。
    - 客户集中度高，因为 NIO 仍是公开记录中唯一证据扎实的锚定客户。
    - 旗舰高端电池包故事真实存在，但比市场热度窄；NIO 在有限采用后已停供 150 kWh 电池包。
    - CATL、BYD、Ganfeng、Samsung SDI 等在位者的固态项目成熟后，可能压缩 WeLion 的时间窗口护城河。
    - WeLion 接近 IPO 审视时，出口合规、标准和制造质量负担也在上升。
  unresolvedGaps:
    - 经审计的收入、毛利率、现金、capex 和营运资本数据仍未公开。
    - D+ 轮确切规模、每股价格、清算优先权、反稀释条款，以及任何二级交易定价仍未知。
    - 最大客户收入占比和非 NIO 重复订单深度仍未披露。
    - 按产品线划分的良率、报废、质保准备金和循环寿命 cohort 数据仍未公开。
    - ESS 项目的转化、投运、回款和重复订单证据仍太薄，不足以支撑可融资 underwriting。
    - IPO 辅导里程碑、保荐机构细节和预计申报时间尚不够透明，无法精确建模催化剂时点。
