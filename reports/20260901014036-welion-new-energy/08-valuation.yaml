chapter:
  number: 8
  title: Valuation
  summary: WeLion's public valuation markers point to a late-2025 to 2026 private worth of roughly RMB 18.5-20.0 billion, which places the company comfortably above the unicorn line and in the same broad conversation as listed next-generation battery names — but without comparable disclosure. The right read is not that WeLion is obviously mispriced in one direction; it is that the company has enough commercialization proof to justify serious strategic value, yet still too much opacity on revenue, margins, and cap-table terms to support a clean buy call at the current public valuation narrative. That makes the best-supported stance Track, with low confidence, high risk, and a stretched valuation posture.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: >-
    The investment case for WeLion is unusual because it has more real-world proof than many battery startups, but

    much less financial transparency than public markets would normally demand. The thesis starts with commercial

    credibility. WeLion is not merely promising a next-generation battery chemistry in lab conditions: it has a

    visible NIO deployment history, a second OEM pathway via JAC Yiwei, BASF materials support, and ESS project

    evidence that indicates the company has already crossed into the industrial system. That makes the company more

    than an option on scientific research.


    The anti-thesis is that current valuation still rests heavily on narrative and strategic scarcity. Public

    sources continue to cite late-stage funding support, Xiaomi and Huawei participation, and IPO readiness as

    reasons the company deserves a premium mark, but the public record does not disclose revenue, gross margin,

    cash runway, or cap-table terms. In other words, the company may deserve a premium to earlier-stage science-

    only peers, yet investors cannot verify how much of that premium should survive once operating metrics become

    visible.


    The right framework is therefore price-sensitive rather than company-quality-only. WeLion can be both a real

    technology winner and a stretched investment entry at the same time.
