  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-pricing
    missingEvidence: Exact D+ round size, per-share price, liquidation preferences, anti-dilution terms, and any secondary-market transactions.
    whyItMatters: These inputs determine whether the apparent valuation band is investable for new common-equity buyers.
    diligencePath: Request legal financing documents, banker materials, or current secondary-market indications.
    relatedQuestionRefs:
    - QV005
    - QV010
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, cash, capex, and working-capital data.
    whyItMatters: Without audited company financials, valuation cannot move beyond scenario ranges and public narrative bounds.
    diligencePath: Obtain IPO draft, audited financial package, or lender diligence materials.
    relatedQuestionRefs:
    - QV004
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, repeat-order timing, and non-NIO revenue diversification.
    whyItMatters: This is the most important commercial variable in deciding whether WeLion deserves a premium to weak public comps.
    diligencePath: Request prospectus draft KPI tables or board reporting on concentration and cohort performance.
    relatedQuestionRefs:
    - QV008
    - QV027
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: manufacturing-economics
    missingEvidence: Yield, scrap, warranty-reserve, and conversion-cost metrics by product line.
    whyItMatters: These data determine whether current commercialization proof can support durable margins and therefore durable valuation.
    diligencePath: Request plant KPI packs, quality reviews, and cost-bridge materials.
