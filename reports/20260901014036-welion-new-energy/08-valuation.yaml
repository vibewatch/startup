- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Audited revenue, gross margin, and collections by segment
    - Turns narrative valuation into operating valuation
    - Request IPO filing, auditor package, or management room data
  - - Cap table and preferences
    - Per-share price, preference stack, anti-dilution, and secondary rights
    - Determines common-equity return math
    - Request legal financing documents or banker summary
  - - Customer concentration
    - Top-customer revenue share and repeat-order history
    - Tests whether current premium is too dependent on NIO
    - Request board-level KPI deck or prospectus draft
  - - Manufacturing quality
    - Yield, scrap, warranty reserve, and cycle-life cohort data
    - Determines whether commercialization is economically durable
    - Request site KPI data and quality-control reports
  - - ESS conversion
    - Commissioning, acceptance, and payment evidence for named projects
    - Separates backlog headlines from real cash conversion
    - Request project documents and collections aging
  - - IPO timetable
    - Tutoring milestones, sponsor, and filing readiness
    - Clarifies the timing of the strongest potential catalyst
    - Request formal listing roadmap
  notes: These asks prioritize the missing variables that would most directly change recommendation, confidence, or valuation stance.
