- id: scenario-framework-and-valuation-range
  title: Scenario Framework and Valuation Range
  body: >-
    Because WeLion lacks published revenue and margin data, scenario analysis is the only credible valuation tool

    available from public evidence. The bull case assumes IPO progress continues, NIO remains commercially useful,

    second-line OEM and ESS programs convert into repeat business, and disclosure quality improves enough for the

    market to reward the company as a rare Chinese battery platform with actual deployment. Under that path,

    upside above the current range is possible, but it still depends on evidence arriving rather than merely on

    sentiment staying strong.


    The base case assumes the company broadly holds its current private mark while the public record improves only

    incrementally. That is the most plausible near-term path because it matches what current sources already show:

    meaningful strategic value, real commercialization texture, and persistent opacity. The bear case is driven by

    the exact points public markets have punished elsewhere in the sector — narrow customer proof, premium-product

    demand weakness, and delayed disclosure around operating quality.


    This scenario frame is deliberately conservative. It treats WeLion's current valuation as a ceiling that still

    has to be earned with disclosure rather than as a floor guaranteed by strategic investors or sector hype.
