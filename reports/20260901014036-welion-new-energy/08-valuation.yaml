- id: financing-history-and-current-valuation-marks
  title: Financing History and Current Valuation Marks
  body: >-
    Public valuation evidence is directionally consistent even if it is not auditor-grade. Longbridge and Jiemian

    both anchor WeLion around an RMB 18.5 billion level, while SMM-style coverage pushes the mark toward RMB 20

    billion in 2026 pre-IPO commentary. Hurun's 2026 unicorn materials strengthen that range by confirming the

    company remained in the global unicorn set through the 2026 publication cycle. Taken together, these sources

    support a working valuation band rather than a single clean mark.


    What they do not show is equally important. None of the reviewed public sources discloses the exact D+ round

    size, per-share price, liquidation preferences, or common-equity dilution math. Nor do they disclose audited

    company-level financials. As a result, the current valuation story is best understood as a strategic,

    milestone-backed private mark — not a number that has already been pressure-tested by continuous public-market

    disclosure.


    IPO tutoring matters because it can convert that narrative into better evidence. Until it does, however,

    investors should treat the current valuation range as a plausible market consensus rather than as settled fair

    value.
