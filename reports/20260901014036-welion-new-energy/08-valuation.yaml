- id: recommendation-kill-triggers-and-final-diligence
  title: Recommendation, Kill Triggers, and Final Diligence
  body: >-
    The best-supported investment posture is Track. WeLion has enough proof to stay on an active watchlist and

    more credibility than many frontier-battery startups, but not enough public evidence to justify a confident

    buy recommendation at the current valuation narrative. High risk and low confidence are the natural result of

    that asymmetry: meaningful upside remains possible, yet the range of outcomes is still exceptionally wide.


    Investors should focus on a few observable triggers. A public filing, formalized financing event, or sharper

    operating disclosure would be the single strongest positive catalyst because it could convert the thesis from

    valuation folklore into auditable data. The opposite is also true. If IPO progress stalls, if customer breadth

    remains narrow, or if listed battery peers re-rate lower again, WeLion's current mark will look harder to

    defend quickly.


    Final diligence should therefore concentrate less on generic market sizing and more on the missing variables

    that actually price the investment: revenue quality, margin path, customer concentration, and preference-stack

    overhang.
