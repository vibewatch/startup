- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO process stalls
    - No clear filing progress or tutoring is delayed materially
    - Keeps opacity unresolved and weakens valuation support
    - Hold or downgrade watchlist conviction
  - - Customer breadth remains narrow
    - No durable non-NIO repeat-customer proof by 2027
    - Concentration risk remains too high for premium pricing
    - Assume lower terminal multiple
  - - Public comps re-rate lower again
    - QS / SLDP or peer basket compress materially
    - Comparable ceiling for WeLion falls
    - Tighten entry discipline or wait
  - - Operating disclosure disappoints
    - Yield, order conversion, or gross margin appear weak
    - Narrative premium loses credibility
    - Move to avoid until evidence improves
  - - Positive filing / financing catalyst appears
    - Public filing or formal financing adds auditable data
    - Thesis becomes more evidence-backed
    - Reassess toward upgrade if valuation still reasonable
  notes: These triggers are chosen because they can be observed from public filings, financing events, or credible operating disclosures.
