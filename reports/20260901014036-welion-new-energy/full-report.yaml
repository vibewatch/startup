      - number: '1.5'
        title: Milestones, IPO Path, and Adverse Signals
        blocks:
          - type: paragraph
            body: |-
              WeLion's chronology since 2023 shows why the company commands strategic attention. In mid-2023 it
              delivered the first batch of 360 Wh/kg semi-solid cells to NIO; by June 2024 NIO's 150 kWh pack had
              entered limited service; in April 2024 WeLion broadened its automotive narrative with the Yiwei/JAC
              4695 programme; in late 2025 it launched ChiNext pre-IPO tutoring; and by 2026 sector analysts were
              discussing WeLion as one of the likely first listed pure-play solid-state battery companies in China.
              The October 2025 state-owned-enterprise deal around ESS manufacturing and the BASF materials milestone
              added evidence that commercialization was moving beyond a single-automaker story.

              The adverse evidence is equally important. NIO's ultra-long-range 150 kWh product did not become a mass
              consumer hit: electrive reported in November 2025 that NIO had already discontinued production after only
              a few hundred packs because of high cost and limited user demand. More broadly, Jiemian, SMM, Bamboo
              Works' discussion of QingTao, and other industry coverage all make the same structural point: solid-state
              battery manufacturing remains capital intensive, scale economics are not yet proven, and many products
              marketed as "solid-state" are still hybrid semi-solid designs with residual liquid electrolyte.

              That combination leads to a nuanced chapter-one conclusion. WeLion has genuine scientific pedigree,
              unusually strong strategic backers, and one of the best commercialization records among Chinese
              semi-solid battery startups. But it is still an execution story, not a de-risked industrial compounder.
              The IPO process increases visibility and financing options, yet it also forces the company toward a
              harder standard of proof on profitability, yield, and sustainable demand.
