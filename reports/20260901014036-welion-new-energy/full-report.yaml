      - number: '7.4'
        title: People, Governance, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Scientific pedigree is one of WeLion's strongest assets, but the same structure creates key-person and

              governance concentration. Public coverage still centers heavily on Yu Huigen, Li Hong, and the Chinese
              Academy

              of Sciences origin story. That strengthens trust in the underlying research platform, yet it leaves
              limited

              visibility into how broad the operating bench is beneath the founding circle. For a capital-intensive
              battery

              manufacturer approaching IPO, that is not a cosmetic issue; it bears directly on whether commercial
              scaling,

              plant operations, and capital-markets execution can all mature at the same speed.


              Battery companies often look strongest right before execution complexity compounds. The company must
              coordinate

              materials partners, product qualification, project financing logic, and multi-site manufacturing while
              also

              tightening disclosure discipline for public markets. Peer failures across the broader battery sector
              underline

              that industrial execution has to become more systematic than the early-stage founder narrative.


              The key risk is therefore not simply whether management is credible. It is whether the current team depth,

              governance structure, and reporting cadence are already strong enough for the next phase or still largely

              inferred from scientific reputation and customer headlines.
