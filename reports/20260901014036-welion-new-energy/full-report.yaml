      - number: '3.3'
        title: Switching Costs, Distribution Power, and Buyer Lock-In
        blocks:
          - type: paragraph
            body: >-
              Battery competition is not won only on laboratory metrics. OEMs care about qualification time,
              cell-to-pack

              integration, safety validation, manufacturing yield, warranty confidence, and the ability to guarantee

              deliveries over multiple vehicle generations. Those dynamics create high switching costs even when a
              startup

              appears technically strong. A buyer already integrated with CATL or BYD can continue buying mature LFP or

              high-nickel products while monitoring next-generation alternatives, which gives incumbents a built-in
              option

              value that startups do not enjoy.


              WeLion's counterweight is relationship-led proof. NIO gave it the rare chance to prove a semi-solid
              battery

              in a premium vehicle context, and JAC Yiwei broadens the story beyond one customer. BASF's public delivery
              of

              cathode active materials also matters because it shows that credible industrial partners are willing to
              plug

              into WeLion's supply chain. Still, these are proof points, not yet evidence of deep lock-in. Public
              sources do

              not show multi-customer volume commitments, transparent pricing power, or a distribution network
              comparable

              to the incumbent giants.


              For diligence, that means WeLion looks stronger on product proof than on channel power. The company may be

              ahead of several startup peers in commercialization readiness, but it remains vulnerable if incumbents
              bundle

              next-generation batteries into broader supply contracts or if customers multi-home rather than commit.
            claimRefs:
