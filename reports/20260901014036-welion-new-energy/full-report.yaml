  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: |-
              The broadest possible market label for WeLion is the global EV battery market, but that framing is too
              blunt for diligence. WeLion does not compete for every battery dollar spent in transport, storage, and
              electronics. The practical market boundary is narrower: high-energy-density traction batteries for
              premium or technically demanding EV programmes; safer or longer-life storage batteries for grid and
              industrial projects that can tolerate a premium; and adjacent lightweight-power applications such as
              drones, robotics, and mobile power where mass or volumetric density matter more than lowest-cost
              chemistry. The company is therefore best analyzed as a participant in the emerging semi-solid /
              solid-state wedge inside larger lithium-ion markets.

              The status-quo substitute remains conventional lithium-ion, especially LFP and high-nickel NMC/NCA.
              Axis Intelligence, ChinaBiz Insider, and Energy Solutions all make clear that mainstream scale still
              belongs to those mature chemistries. LFP dominates stationary storage and has moved aggressively into
              mainstream automotive because it is cheap, robust, and manufactured at extraordinary Chinese scale.
              NMC remains relevant in range-sensitive premium vehicles. Semi-solid designs such as WeLion's are
              economically interesting only when they create enough extra range, safety, or packaging flexibility to
              justify a premium over those incumbents.

              This distinction matters because many solid-state narratives overstate substitutability. A premium EV
              battery that competes against a 100–150 kWh high-end pack is not addressing the same budget line as a
              50–60 kWh mass-market LFP pack, much less a stationary-storage container optimized for cost per cycle.
              WeLion's market is therefore better understood as a constrained high-value subset of broader battery
              demand, not an immediate claim on the entire battery industry.
