            body: >-
              The comparable set is imperfect but still informative. QuantumScape remains the best-listed reference for
              a

              next-generation battery platform with strong technical optionality, while Solid Power represents the
              market's

              harsher pricing of an earlier commercialization profile. By late August and early September 2026,
              QuantumScape

              sat in the mid-$3 billion market-cap range, whereas Solid Power traded near the low-$0.5 billion range.
              Both

              valuations are far below the peak exuberance that once surrounded the category. That is the most important

              public-market lesson: the market still pays for strategic battery upside, but it punishes opacity and
              delay.


              WeLion's current private mark of roughly $2.6-2.8 billion equivalent places it closer to QuantumScape than
              to

              Solid Power. That positioning can be defended if investors emphasize visible commercialization proof
              through

              NIO and semi-solid deployment. It becomes harder to defend if they emphasize the still-missing financial
