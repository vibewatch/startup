      - number: '4.2'
        title: Traction Proxies and Public Financial Markers
        blocks:
          - type: paragraph
            body: >-
              The chapter's strongest financial evidence is indirect. WeLion's valuation references, IPO process, and

              order announcements all indicate that sophisticated counterparties treat it as a material industrial
              asset.

              Longbridge and SMM referenced a valuation band from RMB 18.5 billion to roughly RMB 20 billion in
              2025-2026,

              while multiple media outlets described IPO tutoring or filing preparation for the ChiNext board. Those
              facts

              do not prove revenue quality, but they do show that the market is assigning substantial option value to
              the

              company.


              Customer-side evidence also matters. NIO's March 2026 results showed RMB 87.5 billion of 2025 revenue and

              RMB 45.9 billion of year-end cash plus investments, rising to RMB 48.2 billion by the end of Q1 2026.

              That does not translate into WeLion revenue directly, yet it does reduce the fear that WeLion's flagship
              EV

              customer is immediately unable to fund premium battery programmes. Likewise, the BASF cathode-material

              delivery and the disclosed ESS order flow imply real working commercial relationships rather than lab-only

              experiments.


              Still, the distinction between traction proxy and financial proof is crucial. Valuation markers, customer
              cash,

              and high-profile orders all help frame potential scale, but none substitute for audited WeLion revenue,

              shipment, gross-margin, or receivables data.
            claimRefs:
