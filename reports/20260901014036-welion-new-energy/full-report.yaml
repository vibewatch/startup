  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Application Map
        blocks:
          - type: paragraph
            body: >-
              Public product materials show that WeLion is building more than a single flagship EV cell. Its product
              pages

              and solution pages map batteries into premium electric vehicles, electric boats and yachts, construction

              machinery, electric motorcycles, electric bikes, energy storage, and other power-sensitive applications.
              That

              breadth matters because it positions the company as a platform supplier capable of matching cell
              chemistry,

              form factor, and pack architecture to different use cases rather than relying entirely on one
              ultra-premium

              EV story.


              The flagship public proof remains automotive. WeLion's 360 Wh/kg-class semi-solid battery became
              associated

              with NIO's 150 kWh pack, while JAC Yiwei cooperation points to 4695 large cylindrical cells for long-range
              EVs.

              At the same time, the company advertises 280Ah-class batteries and pack solutions relevant to heavy-duty,

              construction, and storage use cases. The portfolio therefore blends high-specific-energy showpieces with
              more

              practical power and safety-oriented products.


              This breadth should not be mistaken for equal maturity across all categories. The public record supports
              an

              automotive-and-storage-led company with multiple adjacent application experiments, not a fully proven
              leader in

              every segment it names. Still, the breadth is real and central to understanding the technology stack.
            claimRefs:
