      - number: '5.4'
        title: Trust, Safety, Standards, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Product diligence in batteries always includes safety, standards, and claims discipline. This is where
              2026 is

              especially important. Several independent sources report that China is implementing its first national

              solid-state battery standard, tightening the definition of true all-solid-state batteries and pushing
              hybrid

              products into clearer categories. That matters directly to WeLion because the company's current commercial
              edge

              comes from bridge products that many earlier headlines loosely called "solid-state." Under the stricter
              2026

              framing, those products should be understood more precisely as hybrid solid-liquid or semi-solid.


              That shift is not necessarily bad for WeLion. In fact, it may help credible suppliers by filtering
              inflated

              claims from weaker rivals. The standards literature and technical reviews suggest WeLion benefits if the
              market

              distinguishes real mass-produced hybrid-solid products from hypothetical all-solid-state prototypes. The

              roadmap then becomes clearer: bridge products now, higher-energy and eventually all-solid-state products
              later,

              with performance and safety claims disciplined by more formal terminology.


              The trust verdict is balanced. Public materials support real technical capability and strong safety
              messaging,

              but full verification of long-cycle reliability, marine certifications, and cross-segment field
              performance

              still requires private test data and customer audits.
            claimRefs:
