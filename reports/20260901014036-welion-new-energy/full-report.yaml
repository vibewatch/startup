  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case for WeLion is unusual because it has more real-world proof than many battery startups,
              but

              much less financial transparency than public markets would normally demand. The thesis starts with
              commercial

              credibility. WeLion is not merely promising a next-generation battery chemistry in lab conditions: it has
              a

              visible NIO deployment history, a second OEM pathway via JAC Yiwei, BASF materials support, and ESS
              project

              evidence that indicates the company has already crossed into the industrial system. That makes the company
              more

              than an option on scientific research.


              The anti-thesis is that current valuation still rests heavily on narrative and strategic scarcity. Public

              sources continue to cite late-stage funding support, Xiaomi and Huawei participation, and IPO readiness as

              reasons the company deserves a premium mark, but the public record does not disclose revenue, gross
              margin,

              cash runway, or cap-table terms. In other words, the company may deserve a premium to earlier-stage
              science-

              only peers, yet investors cannot verify how much of that premium should survive once operating metrics
              become

              visible.


              The right framework is therefore price-sensitive rather than company-quality-only. WeLion can be both a
              real

              technology winner and a stretched investment entry at the same time.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
