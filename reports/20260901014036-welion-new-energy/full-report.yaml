  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              WeLion's revenue model is industrial B2B rather than recurring software or consumer hardware. Public
              product

              and market evidence points to at least three monetization lanes: EV cells and battery systems sold into
              OEM

              programmes such as NIO and JAC Yiwei; energy-storage cells or systems sold into grid, industrial, or
              state-

              linked projects; and smaller specialty-power products where energy density matters more than commodity
              cost.

              The product catalog and media coverage suggest the company is monetizing both current semi-solid products
              and

              future pipeline technology, but not through public list prices.


              Because contracts are private, the best public monetization evidence comes from order announcements and

              programme deployments. The October 2025 4 GWh / RMB 4 billion Shaanxi Forestry Industry cooperation
              provides

              the cleanest disclosed deal-size proxy, even though it likely bundles more than bare cells. NIO deployment

              coverage confirms that WeLion has progressed far enough to get into production-adjacent vehicle
              programmes,

              but public sources still do not disclose pack volumes, cell ASPs, rebates, or warranty economics.


              This creates a classic hardware diligence problem: there is clear evidence of revenue mechanisms and
              customer

              willingness to engage, but not yet enough public disclosure to convert those mechanisms into a reliable
              top-

              line model. Revenue quality therefore remains plausible rather than demonstrated.
            claimRefs:
