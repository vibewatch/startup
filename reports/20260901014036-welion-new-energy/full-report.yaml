      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Scientific pedigree plus real deployment is WeLion's main differentiator
            body: |-
              Many solid-state battery startups can claim promising lab chemistry; far fewer can combine a genuine
              Chinese Academy of Sciences origin story with vehicle deployment and named strategic backers. WeLion
              has all three, which explains why it sits near the front of China's would-be solid-state IPO queue.
            calloutType: strength
            claimRefs:
              - CO003
              - CO007
              - CO020
              - CO028
          - type: callout
            title: Commercial proof exists, but demand proof is still narrow
            body: |-
              The NIO programme proves that WeLion can get a semi-solid battery into a real vehicle, yet the 150 kWh
              pack's later discontinuation shows that technical achievement and scalable customer demand are different
              things. Premium-range halo products do not automatically convert into profitable, repeatable volume.
            calloutType: risk
            claimRefs:
              - CO028
              - CO037
              - CO041
          - type: callout
            title: The stakeholder mix is optimized for capex-heavy industrial scaling
            body: |-
              Huawei- and Xiaomi-linked capital, NIO adjacency, BASF material support, and state-enterprise ESS
              cooperation all point to the same theme: WeLion is building as an industrial coalition, not as a
              software-style venture company. That can be an advantage in batteries, but it also raises expectations
              for execution, disclosure, and capital efficiency.
            calloutType: insight
            claimRefs:
