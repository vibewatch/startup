      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track is the most defensible posture at the current mark
            body: >-
              WeLion looks too real to ignore and too opaque to underwrite aggressively. The company deserves a live
              watchlist

              slot, but current public evidence does not justify a high-conviction buy call at an implied RMB
              18.5-20.0bn

              value.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV022
              - CV037
              - CV038
          - type: callout
            title: The public comp lesson is compression, not euphoria
            body: >-
              Public next-generation battery companies still command strategic value, but the market has become much
              less

              forgiving of delay and opacity. That is the main reason WeLion's current private mark should be treated as

              stretched unless harder evidence arrives.
            calloutType: risk
