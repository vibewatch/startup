      - number: '5.2'
        title: Chemistry, Cell Design, and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical idea across WeLion's current products is not the elimination of liquid electrolyte in
              one

              jump, but the controlled reduction of liquid content through hybrid solid-liquid and semi-solid
              architectures.

              Official materials describe semi-solid batteries as an intermediate state between conventional lithium-ion
              and

              all-solid-state batteries. Third-party technical sources sharpen that description: Battery Design and
              sector

              analyses characterize the company's known cell as a high-energy semi-solid design close to the NIO 150 kWh

              pack, while broader 2026 reviews place WeLion among the Chinese companies commercializing the bridge layer

              before true all-solid-state reaches mass production.


              WeLion's solution page adds important architectural details. It claims 360 Wh/kg mass-produced EV cells,

              10-80% charging in as little as 12 minutes, support for 46-series large cylindrical full-tab cells, and a

              mix of CTP integration, intelligent manufacturing, and multi-level safety design. These statements suggest
              the

              company's product architecture is best understood as a combination of chemistry innovation, cell-format

              engineering, pack-level integration, and manufacturing-process adaptation.


              The architecture is therefore not just "a better material." It is a product system spanning electrolyte
              design,

              electrode compatibility, format selection, pack integration, BMS and thermal strategy, and line conversion
              or

              manufacturing know-how.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
