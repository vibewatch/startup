      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market is a premium wedge inside much larger battery markets
            body: |-
              The headline global EV battery market is undeniably large, but WeLion does not need to win all of it.
              The economically relevant wedge is premium EV, selective ESS, and lightweight-power niches where density
              or safety matter enough to justify higher cost than LFP or standard lithium-ion.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM014
              - CM034
          - type: callout
            title: Mass-market replacement of LFP remains a distant outcome
            body: |-
              ESS economics, Chinese scale, and LFP's current cost advantage mean solid-state does not displace the
              mass market in one step. The most plausible path is coexistence: semi-solid and later all-solid-state win
              premium and specialized use cases first, while LFP keeps the bulk of volume for years.
            calloutType: risk
            claimRefs:
              - CM012
              - CM021
              - CM038
          - type: callout
            title: China's ecosystem structure gives domestic leaders a speed advantage
            body: |-
              China's dominant manufacturing base, strong domestic OEM demand, and policy push around standards mean a
              company like WeLion can commercialize earlier than many Western peers even if it remains much smaller than
              CATL or BYD. That ecosystem advantage is one reason the company is investable as a strategic platform.
            calloutType: strength
