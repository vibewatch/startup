chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Positioning
        blocks:
          - type: paragraph
            body: |-
              Beijing WeLion New Energy Technology Co., Ltd. was founded in 2016 and is headquartered in
              Doudian Town, Fangshan District, Beijing. Across its English-language corporate materials,
              industry profiles, and later IPO reporting, the company presents itself as a solid-state
              lithium battery developer commercializing work that originated inside the Institute of Physics
              of the Chinese Academy of Sciences. That scientific lineage matters because WeLion is not just
              a generic EV battery startup; it is repeatedly described as the industrialization platform for
              the institute's solid-state battery research and as an industry-university-research incubation
              enterprise created to turn laboratory work into vehicle and energy-storage products.

              The company's product scope is broader than a single concept battery. Public materials show a
              portfolio spanning hybrid solid-liquid electrolyte traction cells for electric vehicles,
              280Ah-class energy-storage cells, and lighter high-energy products for drones, robots and
              portable power. The business model is therefore best understood as B2B cell and battery-system
              supply rather than consumer hardware: WeLion sells into automakers, energy-storage projects,
              and industrial customers that need higher energy density or safer chemistry than conventional
              lithium-ion can offer.

              The strongest commercial proof-point so far is NIO. WeLion's 360 Wh/kg semi-solid cell became
              the core of NIO's 150 kWh ultra-long-range battery pack, making WeLion one of the first Chinese
              startups to move semi-solid cells from R&D narrative to limited series deployment in passenger
              EVs. Later reporting also tied WeLion to energy-storage orders, BASF cathode-material
              collaboration, and a JAC Yiwei programme using 4695 large cylindrical semi-solid cells. Those
              links support the view that WeLion is already operating as a commercialization platform, even if
              true all-solid-state mass production remains a future milestone rather than a completed one.
