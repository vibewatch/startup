      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |-
              Public descriptions of WeLion's founding team consistently link three figures: Chen Liquan,
              Li Hong, and Yu Huigen. Chen Liquan, an academician of the Chinese Academy of Engineering, is
              frequently presented as a founding scientific sponsor or co-founder-level origin figure; Li Hong,
              a senior researcher from the Institute of Physics, appears as both technical founder and public
              advocate of the company's commercialization mission; and Yu Huigen is regularly identified as the
              chairman, legal representative, and executive operator who holds practical control over the
              enterprise. Jiemian's 2026 IPO coverage went further by stating that Yu Huigen controlled roughly
              29% of the company, giving him outsized influence over governance and strategic direction.

              This leadership mix creates both strength and concentration. The strength comes from unusually deep
              academic credibility for a Chinese battery startup: the company can credibly claim to sit on top of
              decades of Institute of Physics work in solid-state batteries. The concentration risk comes from the
              same structure. Public governance disclosures remain thin, the broader board composition is not
              described in any granular public filing we reviewed, and the company's identity is still tightly tied
              to a small founding and scientific circle. For diligence purposes, that means scientific pedigree is a
              real moat, but investors would still need sharper visibility into board independence, shareholder
              rights, and succession depth beneath Yu Huigen and Li Hong.

              Leadership signaling in late 2025 and 2026 also shifted from pure R&D messaging toward capital-market
              readiness. Multiple IPO-focused articles frame WeLion as a company transitioning from lab-backed battery
              innovator to a would-be listed industrial champion. That transition raises the bar for financial
              controls, disclosure discipline, and manufacturing execution, all of which matter more once the company
              pursues public capital and broader institutional ownership.
            claimRefs:
