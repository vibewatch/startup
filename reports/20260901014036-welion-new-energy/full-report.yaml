disclaimer: >-
  This report is an automated diligence summary based solely on publicly available information as of 2026-09-01 and does
  not constitute investment advice. WeLion is a private company, and several of the most valuation-critical variables —
  including revenue, margins, cash, financing terms, manufacturing yields, and customer concentration — are not publicly
  disclosed. All valuation ranges in this report are evidence-based scenarios, not guaranteed market-clearing prices.
