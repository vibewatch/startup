      - number: '5.3'
        title: Deployment Workflow, Manufacturing, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              WeLion's technology only matters if it can survive the deployment workflow from cell design to customer
              pack.

              Public sources imply a multi-step operating model: chemistry R&D, pilot or mass-production process
              control,

              OEM or project qualification, pack integration, safety validation, and then customer deployment. The NIO,

              JAC, BASF, and ESS project evidence all fit this workflow. They show the company does not stop at
              laboratory

              science; it has to coordinate material suppliers, manufacturing lines, platform-specific cell formats, and

              downstream pack integration.


              That operating chain introduces dependencies. BASF material supply supports cathode readiness; standards

              development in China affects what may legally be called solid-state versus hybrid solid-liquid; and
              large-cell

              or large-pack applications require reliability, fast charging, and thermal control that look very
              different

              from a consumer-electronics battery. Semi-solid commercialization helps because it retains more line

              compatibility and lower conversion cost than all-solid-state, but dependency risk remains high.


              In practical diligence terms, WeLion's product maturity is best described as commercially meaningful but
              still

              dependency-heavy. It has more manufacturing and integration reality than a lab-only peer, but it is still
              tied

              to suppliers, standards, and yield-sensitive industrial execution.
            claimRefs:
              - CE019
              - CE020
              - CE021
              - CE022
              - CE023
              - CE024
