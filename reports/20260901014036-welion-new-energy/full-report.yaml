  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Disclosure Risk
        blocks:
          - type: paragraph
            body: >-
              WeLion operates in a battery category that is becoming more rule-bound in 2026, not less. The European

              battery regime is moving from high-level sustainability ambition into specific operating obligations
              around

              carbon-footprint disclosures, labelling, and battery-passport preparation, and multiple logistics and

              compliance guides now frame incomplete paperwork as a direct shipment-risk issue rather than an
              administrative

              nuisance. For a company like WeLion — which is expanding from premium EV cells into energy-storage
              projects

              and still signals international ambition — that matters because export readiness will eventually be tested
              in

              documentation, traceability, and chemistry classification, not just in energy density.


              The domestic standards environment is tightening as well. Across 2026 Chinese market coverage, the
              category is

              being forced to distinguish more clearly between hybrid solid-liquid batteries and truly all-solid-state

              batteries. That does not automatically hurt WeLion, whose best commercial proof is in semi-solid bridge

              products, but it does remove room for narrative slippage. If the company markets bridge chemistry too

              aggressively as already-solved all-solid-state industrialization, the standards environment can turn into
              a

              reputational and diligence risk rather than a tailwind.


              IPO preparation amplifies the issue. Once WeLion began ChiNext pre-IPO tutoring in late 2025, investors
              gained

              more confidence that a listing path exists, but the public record still lacks the prospectus-grade detail
              that

              would normally settle disputes over capacity, yield, customer concentration, and cash needs. The legal
              risk is

              therefore not obvious litigation in public view; it is the chance that compliance burdens and disclosure
              gaps

              narrow the valuation window faster than operating execution catches up.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
