      - number: '7.2'
        title: Technical, Manufacturing, and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              The largest industrial risk remains the bridge from a visible semi-solid product story to a repeatable,

              economically durable battery-manufacturing business. The sector's own leaders are still cautioning that

              all-solid-state batteries are not ready for mass deployment in 2026. CATL's public TRL framing, combined
              with

              SMM's small-batch-only expectations for 2027 and independent commentary about pilot-scale bottlenecks,
              shows

              how far the category still is from routine, high-yield production. That does not deny WeLion's
              achievement;

              it shows why the next step is the dangerous one.


              WeLion has enough proof to avoid being dismissed as a lab-only startup, but not enough to let investors
              audit

              manufacturing quality. Public materials do not disclose yield, scrap, cycle-life cohorts, warranty losses,
              or

              field-failure rates. Even the company's physical footprint reads inconsistently across sources. That
              matters

              because battery businesses usually fail at the intersection of yield, capex, and quality, not at the point
              of

              early technical plausibility.


              Raw materials add another layer. Lithium price recovery in 2026, combined with supply deficits and export-

              control noise around strategic materials, means input costs can move against a manufacturer precisely
              while it

              is still trying to scale a premium chemistry. The resulting operating risk is not that WeLion lacks
              technology;

              it is that the path from technology to stable delivered gross margin remains mostly undisclosed.
            claimRefs:
