      - number: '4.3'
        title: Cost Structure, Unit Economics, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Public evidence strongly suggests that WeLion is a capital-intensive manufacturing business with long cash

              conversion cycles. Advanced batteries require plant build-out, qualification inventory, materials
              prepayment,

              process yield improvement, and warranty support. Even without direct WeLion financial statements, sources
              on

              solid-state industry cost curves and peer financials show the same pattern: pilot or early-scale
              operations

              consume cash long before they reliably throw it off.


              The disclosed Shaanxi order lets us derive only one rough economic clue. Dividing RMB 4 billion by 4 GWh
              gives

              an implied value of roughly RMB 1.0 per Wh, or about RMB 1,000 per kWh, before separating cells from
              storage-

              system balance-of-plant. That is not a clean cell ASP, but it suggests WeLion is competing in a
              premium-value

              band rather than a commodity-LFP price tier. Whether that premium is sufficient to cover oxide-electrolyte

              process complexity, capex amortization, and scrap is impossible to know from public data.


              Comparables reinforce the caution. Publicly listed solid-state peers such as QuantumScape still hold large

              cash balances relative to revenue because commercialization remains expensive. For WeLion, the likely
              next-

              stage financial challenge is not proving there is demand, but proving that demand can be served with
              yields,

              working capital, and gross margins good enough for public-market scrutiny.
            claimRefs:
