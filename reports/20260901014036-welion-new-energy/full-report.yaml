      - number: '7.5'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The risk picture is not one-sided. WeLion has real mitigating evidence: live deployment with NIO, public

              materials support from BASF, and state-linked ESS counterparties prove that the company has already
              crossed

              the threshold from pure research project to commercial industrial participant. That is a meaningful
              defense

              against the harshest skepticism usually directed at advanced-battery startups.


              But mitigants only matter if they remain compounding rather than static. Investors should monitor whether
              the

              company converts one anchor customer into multiple durable accounts, whether standards tightening improves

              honesty and discipline in product positioning, and whether IPO preparation produces more operating
              clarity.

              The wrong read would be to treat any one funding or IPO milestone as proof that manufacturing risk has
              been

              solved.


              The cleanest thesis-break signals are observable: stalled IPO progress; prospectus-style disclosure that
              shows

              weak yields, narrow orders, or heavy financing dependence; export-compliance slippage on overseas
              programs; or

              failure to produce visible repeat deployments outside the NIO flagship arc. If those indicators worsen,
