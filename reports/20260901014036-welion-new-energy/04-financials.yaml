callouts:
- calloutType: strength
  title: The financing story is real even if the financial statements are not public
  body: >-
    Strategic investors, an IPO process, a multi-billion-renminbi order headline, BASF supply support, and anchor

    customer deployment together show that WeLion has crossed a meaningful commercial threshold. These are not the

    signals of a science project that cannot raise capital. They are the signals of a company the market believes

    could matter — provided the numbers eventually support the story.
  claimRefs:
  - CI010
  - CI015
  - CI016
  - CI028
- calloutType: risk
  title: Valuation is not a substitute for runway
  body: >-
    Public valuation markers around RMB 18.5-20.0 billion can create the illusion that capital adequacy is known.

    It is not. Without cash, burn, debt, and capex disclosure, investors cannot tell whether the company is well-

    funded for scale or simply expensive on paper while still financing-dependent.
  claimRefs:
  - CI011
  - CI029
  - CI031
- calloutType: risk
  title: The most important missing number is gross margin
  body: >-
    In advanced batteries, the difference between an exciting program and an attractive business is usually gross

    margin after yield, warranty, and working-capital burden. Public sources show demand proxies and customer

    credibility, but not whether WeLion earns money on its most visible products.
  claimRefs:
  - CI020
  - CI023
  - CI033
