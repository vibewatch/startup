- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited revenue by segment
    - Cannot distinguish real commercial scale from pre-commercial narrative
    - Wait for ChiNext prospectus or management data room
  - - Gross margin by product and customer
    - Cannot judge whether premium chemistry creates real operating leverage
    - Request audited margin bridge and BOM assumptions
  - - Cash, burn, and runway
    - Cannot assess urgency of next financing or IPO dependence
    - Request balance sheet, cash forecast, and monthly burn
  - - Debt, guarantees, and equipment financing
    - Hidden leverage could materially change risk
    - Request debt schedule, security interests, and covenant package
  - - Shipment volumes and utilization
    - Cannot convert order headlines into real operational throughput
    - Request shipped MWh/GWh by quarter and plant utilization
  - - Receivables aging by major customer
    - Customer concentration and collection risk remain opaque
    - Request AR aging with NIO and ESS counterparties separated
  notes: These gaps are not academic. They are the minimum dataset needed to move from a strategic narrative to an underwritable financial model.
