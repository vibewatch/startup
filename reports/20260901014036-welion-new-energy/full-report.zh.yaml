      - number: '6.2'
        title: 部署证明与终端用户采用
        blocks:
          - type: paragraph
            body: >-
              NIO 关系给了 WeLion 大多数先进电池初创公司没有的东西：可见的终端用户采用证据。多个 2023-2026 年来源记录了 150 kWh 半固态电池包投入服务、集成进 NIO 车辆，并在 ET7
              上完成真实道路长续航演示。较晚的 2026 年来源还把半固态电池包描述为兼容 NIO 换电生态，并把换电视为规模化客户行为，而不是实验室测试。即便部分报道带有宣传属性，整体图景仍然清楚——WeLion
              技术已经摆在真实驾驶者面前，而不只是采购团队面前。

              JAC Yiwei 合作增加了另一个采用界面。它还达不到 NIO 部署证明的深度，但说明另一个 OEM 愿意围绕 WeLion 的大圆柱半固态电芯共同开发。ESS 侧，Shaanxi Forestry 采购和
              Qingyang 电池包项目报道显示，客户也在买入储能相关用例，而不只是乘用车。

              不过，公开证明并不均匀。我们能观察到部署和演示；看不到广泛出货量、重复订单规模或客户层面盈利能力。采用是可见的，但没有被完整计量。
