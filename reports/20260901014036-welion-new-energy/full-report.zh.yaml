  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与披露风险
        blocks:
          - type: paragraph
            body: >-
              WeLion 所在的电池品类在 2026
              年变得更受规则约束，而不是更少。欧洲电池制度正从高层次可持续愿景，推进到围绕碳足迹披露、标签和电池护照准备的具体运营义务；多份物流和合规指南也把文件不完整视为直接出货风险，而不是行政麻烦。对 WeLion
              这样的公司——从高端 EV 电芯扩张到储能项目，同时仍释放国际化意图——这很关键，因为出口准备度最终会在文件、可追溯性和化学体系分类上接受检验，而不只是看能量密度。

              国内标准环境也在收紧。2026 年中国市场报道中，品类被迫更清晰地区分混合固液电池和真正全固态电池。这不会自动伤害
              WeLion，因为它最强的商业证明来自半固态过渡产品，但它会压缩叙事滑移空间。如果公司过于激进地把过渡化学体系营销成已经解决的全固态产业化，标准环境就会从顺风变成声誉和尽调风险。

              IPO 准备放大了这个问题。WeLion 于 2025 年末启动 ChiNext
              上市辅导后，投资人更有信心看到一条上市路径，但公开记录仍缺少招股书级别细节，无法按通常方式解决产能、良率、客户集中度和现金需求争议。因此，法律风险不是公开视野中的明显诉讼；风险在于，合规负担和披露缺口可能比经营执行更快收窄估值窗口。
