      - number: '4.3'
        title: 成本结构、单位经济性与资本密集度
        blocks:
          - type: paragraph
            body: >-
              公开证据强烈显示，WeLion 是一家资本密集型制造企业，现金转换周期很长。先进电池需要建厂、认证库存、材料预付款、工艺良率提升和质保支持。即使没有 WeLion
              直接财务报表，固态行业成本曲线和同业财务资料也显示同一模式：试点或早期规模化运营会先消耗现金，远早于稳定产出现金。


              已披露的 Shaanxi 订单只能推导出一个粗略经济线索。RMB 4 billion 除以 4 GWh，得到隐含价值约 RMB 1.0/Wh，或约 RMB 1,000/kWh；这还是在把电芯与储能系统 BOS
              分开之前。这不是干净的电芯 ASP，但说明 WeLion 竞争的是高价值溢价区间，而不是商品化 LFP 价格层。这个溢价能否覆盖氧化物电解质工艺复杂度、capex 摊销和报废，公开数据无法判断。


              可比公司进一步强化了谨慎态度。QuantumScape 等上市固态同业相对收入仍持有大量现金，因为商业化仍然昂贵。对 WeLion
              来说，下一阶段最可能的财务挑战不是证明有需求，而是证明能用足以经受公开市场审视的良率、营运资本和毛利率来服务这些需求。
