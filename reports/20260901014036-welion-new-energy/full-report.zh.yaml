  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与应用地图
        blocks:
          - type: paragraph
            body: >-
              公开产品材料显示，WeLion 不只是在做一款旗舰 EV
              电芯。其产品页和解决方案页把电池映射到高端电动车、电动船艇、工程机械、电动摩托、电动自行车、储能和其他对动力敏感的应用。这种广度重要，因为它把公司定位成平台型供应商：能够根据不同用例匹配电芯化学体系、形态和电池包架构，而不是完全依赖一个超高端
              EV 故事。


              旗舰公开验证仍来自汽车。WeLion 的 360 Wh/kg 级半固态电池与 NIO 150 kWh 电池包绑定，JAC Yiwei 合作则指向面向长续航 EV 的 4695 大圆柱电芯。同时，公司宣传
              280Ah 级电池和电池包方案，适用于重载、工程和储能场景。因此，产品组合把高比能展示品与更实用、偏动力和安全的产品混在一起。


              不能把这种广度误读为所有品类成熟度相同。公开记录支持的，是一家以汽车和储能为牵引、拥有多个相邻应用实验的公司，而不是每个命名分部都已经完全验证的领导者。即便如此，这种广度是真实的，也是理解技术栈的核心。
