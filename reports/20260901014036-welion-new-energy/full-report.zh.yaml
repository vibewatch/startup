      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开资料描述 WeLion 创始团队时，一贯提到 Chen Liquan、Li Hong 和 Yu Huigen 三个人。Chen Liquan
              是中国工程院院士，常被视为创始科学支持者或联合创始人级别的源头人物；Li Hong 是中国科学院物理研究所资深研究员，既是技术创始人，也是公司商业化使命的公开倡导者；Yu Huigen
              则经常被认定为董事长、法定代表人和执行操盘者，对企业拥有实际控制权。Jiemian 2026 年 IPO 报道进一步称，Yu Huigen 控制公司约 29% 股权，因此对治理和战略方向影响很大。


              这种领导层组合既是优势，也是集中风险。优势来自中国电池创业公司少见的深厚学术可信度：公司可以可信地声称，自己站在中国科学院物理研究所数十年固态电池工作的基础上。集中风险也来自同一结构。公开治理披露仍然很薄，我们审阅的公开文件没有细致描述更完整的董事会构成，公司的身份仍与小范围创始和科学圈层紧密绑定。尽调层面，科学声望确实构成护城河，但投资人仍需要更清楚地看到董事会独立性、股东权利，以及
              Yu Huigen 和 Li Hong 之下的接班梯队。


              2025 年末和 2026 年，领导层信号也从纯研发叙事转向资本市场准备。多篇 IPO 相关报道把 WeLion
              描述为一家公司，正在从实验室背书的电池创新者转向潜在上市工业冠军。这个转变提高了财务控制、披露纪律和制造执行的门槛；一旦公司寻求公开资本和更广泛的机构股东，这些能力会更重要。
