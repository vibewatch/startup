      - number: '2.4'
        title: 增长驱动、采用约束与未解问题
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动因素清晰且就在当下。中国在电池制造和部署规模上仍占压倒性优势；电池包价格持续下行；高端 EV 买家仍愿意奖励续航和安全；中国 ESS 需求在 2026 年初快速加速。WeLion
              也受益于政策和标准化顺风：IMARC 和 CarNewsChina 都描述了中国推动更清晰的固态及固液混合电池国家定义，这应能减少营销含混，帮助行业区分试点就绪产品和实验室概念。


              约束同样真实。Energy Solutions、Xnergy 和 Intelligent Living 都强调，固态商业化受成本、良率、界面和时间表滑移限制。ChinaBiz Insider
              显示，当下主流储能经济性压倒性偏向 LFP；electrive 关于 NIO 停产 150 kWh 电池包的报道则说明，即使真实半固态产品落地，如果客户付费意愿薄弱，也会停滞。同时，CATL、BYD
              等在位巨头可以用更大规模迭代半固态和其他先进化学体系，压缩创业公司的经济性。


              因此，尽调姿态应是平衡的，而不是亢奋。市场足够大，增长也足够快，能支撑战略投资；但赛道仍早，SOM 主张必须被证据约束。对 WeLion 而言，关键未解问题是：它能以盈利方式拿下多少高端 EV 和 ESS
              楔子，客户实际能长期承受多高溢价，以及其过渡化学体系多快能转化为更广泛、可重复的需求。
