      - number: '3.2'
        title: WeLion 领先在哪里，又没有领先在哪里
        blocks:
          - type: paragraph
            body: >-
              WeLion 最强的公开差异化不是原始规模，而是商业化质感。它能拿出的证据包括：能工作的半固态产品、与 NIO 的真实 OEM 集成历史、与 JAC Yiwei 的第二条汽车合作路径、BASF
              材料支持，以及中国科学院物理研究所背景带来的科学正当性。这些因素让 WeLion 比纯实验室故事更可信，也解释了为什么 IPO 报道反复把它框定为中国固态电池的 A 股领先候选者。


              话虽如此，WeLion 不是这个领域无可争议的技术或市场领导者。CATL 和 BYD 可以投入更多资金，在规模上更快迭代，也更容易吸收商业化失败。Samsung SDI、QuantumScape 和 Solid
              Power 对今天的中国 OEM 买方来说不是完美替代，但它们为能量密度、制造工艺成熟度和验证纪律设定全球标杆。QingTao 和 Ganfeng 说明，中国还有其他严肃的固态竞争者，包括愿意募 IPO
              资金或公开试点生产里程碑的同业。


              这里的反向证据尤其重要。NIO 150 kWh 电池包只出货几百个后停产，说明 WeLion
              当前产品验证比标题暗示的更窄。一家公司可以足够早、科学实力足够强，同时仍发现首个高端应用贵到难以大规模扩张。这正是在位巨头会攻击的核心竞争脆弱点。
