      - number: '7.2'
        title: 技术、制造与质量风险
        blocks:
          - type: paragraph
            body: >-
              最大的工业风险仍是从可见的半固态产品故事，跨到可重复、经济上可持续的电池制造业务。行业龙头自己仍在提醒，2026 年全固态电池还没有准备好大规模部署。CATL 公开的 TRL 表述，加上 SMM 对 2027
              年仅小批量的预期，以及独立评论对试点规模瓶颈的描述，都显示这个品类距离常规高良率生产还有多远。这不是否认 WeLion 的成绩；而是说明下一步为什么危险。

              WeLion
              的证明足以避免被归为只在实验室里的初创公司，但还不足以让投资人审计制造质量。公开材料没有披露良率、报废、循环寿命队列、质保损失或现场故障率。甚至公司的实体产能足迹在不同来源中也不一致。这很重要，因为电池业务通常不是死在早期技术可行性，而是死在良率、资本开支和质量的交叉点。

              原材料又叠加了一层风险。2026 年锂价回升，加上供应短缺和围绕战略材料的出口管制噪音，意味着当制造商仍在放大高端化学体系时，投入成本可能反向移动。由此产生的运营风险不是 WeLion
              没有技术；而是从技术走向稳定交付毛利率的路径，大部分仍未披露。
