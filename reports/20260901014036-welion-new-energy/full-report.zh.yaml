  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、在位巨头与替代品
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争区分，是直接商业化同业与战略压顶者。WeLion 当前的直接同业，是试图在 2020 年代后期把半固态或固态电芯推进车辆项目和储能项目的中国或亚洲公司。这个群体包括 QingTao
              Energy、Ganfeng 的固态项目，以及依附于在位车企或材料网络的新兴平台型公司。战略压顶者更大：中国的 CATL 和 BYD、韩国的 Samsung SDI、日本的 Toyota，以及
              QuantumScape、Solid Power 等美国上市开发商，它们塑造时间表、融资情绪和买方预期。


              替代集合还要更广。电池买家完全可以不买下一代电芯，继续用 LFP、高镍锂离子或另一种过渡化学体系。这意味着 WeLion 不只是在与其他固态公司赛跑；它还要说服
              OEM，相比直接出货下一代成熟液态电解质电池，为半固态或后续全固态性能支付溢价更划算。现实中，这让 CATL 和 BYD 尤其危险，因为它们能卖现状方案，也能出货过渡产品，未来还可通过同一客户渠道推出全固态版本。


              因此，正确的格局镜头是多层的。WeLion 最近的直接竞争对手规模更小、更专业，但真正的护城河必须经受在位规模、买方谨慎，以及推迟采用直到成本下降这一简单选项的冲击。
