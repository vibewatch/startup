      - number: '8.3'
        title: 公开与私募可比公司的映射
        blocks:
          - type: paragraph
            body: >-
              可比公司集合并不完美，但仍有信息量。QuantumScape 仍是下一代电池平台中最好的上市参照，具有强技术可选性；Solid Power 则代表市场对更早商业化阶段的更严厉定价。到 2026 年 8 月下旬和
              9 月上旬，QuantumScape 市值位于 $3 billion 中段，Solid Power 则接近 $0.5 billion
              低位。两者估值都远低于这个品类曾经的狂热峰值。这是最重要的公开市场教训：市场仍会为战略电池上行空间付费，但会惩罚不透明和延迟。

              WeLion 当前私募估值约合 $2.6-2.8 billion，更接近 QuantumScape，而不是 Solid Power。如果投资人强调通过 NIO
              和半固态部署体现的可见商业化证明，这个位置可以辩护。如果强调仍缺失的财务和制造指标，它就更难辩护。从这个意义上，公司像一个部分去风险的平台在定价，但尚未披露能完全证明去风险的数据。

              私募可比也有帮助。Hurun 和更广泛的电池独角兽名单显示，当战略稀缺性、制造雄心和地缘政治重要性同时对齐时，超大规模电池公司私募估值并不少见。这让 WeLion 不显得孤立。但它没有取消对入场价格纪律的要求。
