      - number: '1.4'
        title: 制造足迹与产品规模
        blocks:
          - type: paragraph
            body: >-
              WeLion 实体规模的公开记录方向清楚，但数字混乱，这本身就是重要尽调点。官方和半官方材料把北京房山描述为公司与研发锚点，但不同来源统计的产业基地数量和产能里程碑并不一致。SMM 2026 年 8
              月的一篇回顾提到，房山、溧阳、湖州和淄博四大电池基地，产能预计到 2024 年达 7 GWh、到 2025 年达 16 GWh。另一份 2026
              年展会资料则描述了七大基地，包括绍兴、深圳和珠海。这些说法未必真正冲突——前者可能统计主要电池生产基地，后者统计更广泛的关联运营点——但公司尚未提供一张公开、经审计的运营足迹表来统一口径。


              产品层面的证据更强。WeLion 半固态电芯已经对应三条可见商业化路径：NIO 车辆用 360 Wh/kg 电芯；供应给电网或工业项目的 280Ah 储能电芯；以及与 JAC Yiwei 合作、面向
              600–1,000 km 续航车辆的 4695 圆柱电芯项目。2026 年，公司还在 Battery Show Europe 发布了面向 UAV、机器人和移动电源的轻量化动力产品 SHP410 和
              SHP480。这种广度说明，WeLion 试图把技术风险分散到相邻应用，而不是只押注一个高端 EV 电池包。


              但生产证据不等于完整工业成熟度。公司仍处在从半固态过渡化学体系走向真正全固态规模制造的早期阶段，后续章节也会把这个缺口作为核心风险，而不是已经解决的成就。
