      - number: '4.2'
        title: 牵引力代理指标与公开财务标记
        blocks:
          - type: paragraph
            body: >-
              本章最强的财务证据是间接的。WeLion 的估值参考、IPO 进程和订单公告都显示，成熟交易对手把它视为重要工业资产。Longbridge 和 SMM 提到，2025-2026 年估值区间从 RMB 18.5
              billion 到约 RMB 20 billion；多家媒体则描述公司正在接受创业板 IPO 辅导或准备申报。这些事实不能证明收入质量，但说明市场正在给公司相当高的期权价值。


              客户侧证据也重要。NIO 2026 年 3 月业绩显示，2025 年收入为 RMB 87.5 billion，年末现金加投资为 RMB 45.9 billion，到 2026 年一季度末升至 RMB 48.2
              billion。这不能直接转化为 WeLion 收入，但确实降低了一个担忧：WeLion 的标杆 EV 客户马上无力为高端电池项目买单。同样，BASF 正极材料交付和披露的 ESS
              订单流也意味着真实商业关系，而不是只停留在实验室实验。


              但牵引力代理和财务证明之间的区别至关重要。估值标记、客户现金和高调订单都有助于框定潜在规模，但它们都不能替代 WeLion 经审计收入、出货量、毛利率或应收账款数据。
