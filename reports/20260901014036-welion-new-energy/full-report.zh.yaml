            body: >-
              公开估值证据方向一致，即便还达不到审计级别。Longbridge 和 Jiemian 都把 WeLion 锚定在约 RMB 18.5 billion，SMM 风格报道则在 2026 年 IPO 前评论中把估值推向
              RMB 20 billion。Hurun 2026 独角兽材料确认公司在 2026 年发布周期中仍位列全球独角兽，进一步强化这个区间。合在一起，这些来源支持一个工作估值带，而不是一个干净的单点估值。

              同样重要的是它们没有显示什么。所有审阅过的公开来源都没有披露确切 D+
              轮规模、每股价格、清算优先权或普通股稀释测算。也没有披露经审计的公司层面财务。因此，当前估值故事最好理解为一个有战略和里程碑支撑的私募估值标记——不是已经被连续公开市场披露压力测试过的数字。

              上市辅导重要，因为它可以把叙事转化为更好的证据。但在此之前，投资人应把当前估值区间视为合理的市场共识，而不是已经确定的公允价值。
            claimRefs:
