      - number: '8.4'
        title: 情景框架与估值区间
        blocks:
          - type: paragraph
            body: >-
              由于 WeLion 没有公布收入和利润率数据，情景分析是公开证据下唯一可信的估值工具。乐观情景假设 IPO 进展继续推进，NIO 仍具商业价值，二线 OEM 和 ESS
              项目转化为重复业务，披露质量提升到足以让市场把公司奖励为少见的、已有实际部署的中国电池平台。在这条路径下，当前区间以上仍有上行空间，但它依赖证据到来，而不只是情绪保持强劲。

              基准情景假设公司大体维持当前私募估值，而公开记录只渐进改善。这是近期最可能的路径，因为它匹配当前来源已经显示的内容：有意义的战略价值、真实商业化纹理和持续不透明。悲观情景由公开市场在行业其他公司身上已经惩罚过的确切问题驱动——客户证明狭窄、高端产品需求疲弱，以及经营质量披露延迟。

              这个情景框架有意保守。它把 WeLion 当前估值视为仍需靠披露挣来的天花板，而不是战略投资人或行业热度保证的地板。
