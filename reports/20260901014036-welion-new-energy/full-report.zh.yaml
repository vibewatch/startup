companyProfile:
  summary: >-
    WeLion New Energy 于 2016 年在北京成立，是中国科学院物理研究所固态电池研究走向商业化的平台。公开资料一贯把公司与 Yu Huigen、Li Hong 以及其电池工作的中科院科学脉络联系在一起。WeLion
    目前的商业身份建立在半固态和混合固液电解质锂电池上，尤其是 NIO 150 kWh 电池项目；产品组合也覆盖储能电芯、大尺寸 EV 电芯，以及相邻的特种动力应用。到 2025 年末和 2026 年，公司已进入创业板 IPO
    辅导期；公开报道显示，其吸引了 Xiaomi、Huawei 等战略投资方，公开估值参考约为 RMB 18.5-20.0 billion。相比许多前沿电池创业公司，WeLion 有更强的真实部署证据，但按公开市场标准看，财务仍不透明。
