      - number: '7.3'
        title: 伙伴、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              WeLion 最强的商业证明也是它最大的依赖。NIO 仍是唯一一个在车辆集成、终端用户部署和持续叙事相关性上有反复公开证据的客户关系。这很有力，但也意味着 NIO
              超高端电池项目内部的需求疲软或经济性失败，会直接传导到市场对 WeLion 的评估。150 kWh 电池包在有限采用后停用很重要，不是因为它推翻了技术，而是因为它揭示了旗舰先进电池成功仍可能多么狭窄。

              其他关系真实存在，但证据更薄。BASF 有助于验证材料准备度。JAC Yiwei 提供第二条 OEM 路径。Shaanxi 相关 ESS 采购和 Qingyang
              电池包项目显示管理层在尝试建立更宽基础。但这些渠道看起来仍更像扩张选项，而不是已经去风险的经常性收入。公开证据更能证明关系存在，而不是证明销量、回款或重复订单耐久性。

              竞争强度让问题更复杂。CATL、BYD、Ganfeng 和 Samsung SDI 都在推进相邻或可直接比较的下一代电池时间线。即便 WeLion
              保住半固态部署的时间优势，一旦资本更充足的在位者补上同样的产品缺口，初创公司的议价能力也可能迅速流失。
