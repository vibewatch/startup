      - number: '3.4'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              WeLion 的护城河真实存在，但有条件。科学品牌、半固态运行验证、中国先进电池生态位置，以及投资人—客户网络，都是有意义的优势。它们可能足以让 WeLion 在 IPO
              前后继续处于中国固态创业公司第一梯队。但如果行业变成由 CATL、BYD、Samsung SDI、Toyota
              或另一家大公司主导的规模与良率竞赛，这些优势显然不足以保护公司；大公司拥有更强制造杠杆和更广客户触达。


              最令人清醒的同业证据来自 WeLion 之外。Bamboo Works 在 QingTao 发布里程碑后，仍称其商业模式尚未证实；QuantumScape、Solid Power
              等上市同业也仍在谈验证和试点线，而非大规模汽车出货。换句话说，整个品类仍在解决同一个商业化问题。短期看，这有利于
              WeLion，因为没有竞争对手完全甩开市场；但也意味着一旦某个巨头先解决成本和良率，赛道仍可能突然商品化。


              因此，竞争结论是有层次的：WeLion 是中国半固态电池最可信的商业化故事之一，但长期防御力不取决于先登上新闻标题，而取决于能否把早期验证转化为可重复、多客户的制造经济性。
