      - number: '5.3'
        title: 部署流程、制造与依赖项
        blocks:
          - type: paragraph
            body: >-
              WeLion 的技术只有打穿从电芯设计到客户电池包的部署链条，才有投资意义。

              公开来源指向一套多步骤运营模型：化学体系研发、试点或量产工艺控制、OEM 或项目认证、电池包集成、安全验证，最后进入客户部署。NIO、JAC、BASF 和 ESS
              项目证据都能放进这条流程。它们说明，公司不只是停在实验室科学；它还要协调材料供应商、制造产线、平台专属电芯形态，以及下游电池包集成。

              这条运营链也带来依赖。BASF
              的材料供应支撑正极准备度；中国标准制定会影响哪些产品能依法称为固态，哪些只能称为混合固液；大电芯或大电池包应用需要可靠性、快充和热管理，要求与消费电子电池完全不同。半固态商业化有帮助，因为它比全固态保留了更多产线兼容性，转换成本也更低，但依赖风险仍然很高。

              落到尽调口径，WeLion 的产品成熟度最适合描述为：已有商业意义，但仍然高度依赖外部条件。它比只停留在实验室的同行更接近制造和集成现实，但仍被供应商、标准和对良率敏感的工业执行绑住。
