      - number: '7.5'
        title: 缓释因素、监测项与否决标准
        blocks:
          - type: paragraph
            body: >-
              风险图景并非单边。WeLion 有真实缓释证据：与 NIO 的实车部署、BASF 的公开材料支持，以及国资相关 ESS
              交易对手，证明公司已经跨过从纯研究项目到商业工业参与者的门槛。这是对先进电池初创公司常见最严厉质疑的有力防御。

              但缓释因素只有在持续复利、而不是静态存在时才重要。投资人应监测公司能否把一个锚定客户转化为多个持久账户，标准收紧是否提升产品定位的诚实度和纪律性，以及 IPO
              准备能否带来更多经营透明度。错误解读是把任何一次融资或 IPO 里程碑都当成制造风险已经解决的证明。

              最干净的投资逻辑破裂信号是可观察的：IPO 进展停滞；招股书式披露显示良率弱、订单窄或融资依赖重；海外项目出现出口合规滑坡；或者无法在 NIO
              旗舰弧线之外拿出可见的重复部署。如果这些指标恶化，当前商业化领先就不再像护城河，而更像短暂的先发尖峰。
