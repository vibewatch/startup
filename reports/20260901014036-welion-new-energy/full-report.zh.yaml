      - number: '2.2'
        title: 市场规模、产业规模与固态楔子
        blocks:
          - type: paragraph
            body: >-
              从自上而下看，EV 电池市场已经极其庞大。Axis Intelligence 估计，2025 年全球 EV 电池装机为 1.2 TWh，同比增长 30%，平均电池包价格降至
              $108/kWh。随后，CnEVPost 的 H1 2026 SNE 数据显示，仅上半年全球 EV 电池用量就达 608.5 GWh，同比增长
              20%。这些数字确认，电池需求不是猜想，而是一个很大且仍在增长的工业市场。


              但固态部分仍然很小。IMARC 估计，2025 年中国固态电池市场仅约 $400.4 million，到 2034 年有望达到约 $5.1 billion，CAGR 为
              32.71%。这是小基数上的快速增长，不是与更大 EV 电池市场马上平起平坐。Energy Solutions 同样认为，固态仍处在原型到试点的过渡期，试点规模成本为 $300–500/kWh，而高镍液态电芯约
              $90–110/kWh，LFP 为 $70–90/kWh。换句话说，相关楔子战略上重要，但商业上仍是选择性市场。


              对 WeLion 来说，有用的规模镜头不是“所有 EV 电池”，而是密度和安全性足以压过更高成本的子集：中国高端 EV、高端出口项目、示范车队，以及专业 ESS
              或轻量化动力应用。长期看，这仍是数十亿美元机会，但比固态技术常挂靠的广义 TAM 叙事更小、更慢。
