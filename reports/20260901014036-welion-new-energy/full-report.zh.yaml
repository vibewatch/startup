      - number: '1.5'
        title: 里程碑、IPO 路径与反向信号
        blocks:
          - type: paragraph
            body: >-
              WeLion 自 2023 年以来的时间线解释了为什么公司能获得战略关注。2023 年中，公司向 NIO 交付首批 360 Wh/kg 半固态电芯；到 2024 年 6 月，NIO 150 kWh
              电池包进入有限服务；2024 年 4 月，WeLion 通过 Yiwei/JAC 4695 项目扩展汽车叙事；2025 年末，公司启动创业板上市辅导；到 2026 年，行业分析师已开始讨论 WeLion
              可能成为中国首批上市的纯固态电池公司之一。2025 年 10 月围绕 ESS 制造的国企合作，以及 BASF 材料里程碑，又补充了商业化不再只是单一车企故事的证据。


              反向证据同样重要。NIO 超长续航 150 kWh 产品没有成为大众消费爆款：electrive 2025 年 11 月报道，因成本高、用户需求有限，NIO
              只生产了几百个电池包后就已经停产。更广泛地看，Jiemian、SMM、Bamboo Works 对 QingTao
              的讨论以及其他行业报道都指向同一个结构性问题：固态电池制造仍然资本密集，规模经济尚未证实，许多被营销为“固态”的产品仍是带有残余液态电解质的混合半固态设计。


              因此，第一章的结论应保持细腻。WeLion 有真实科学背景、异常强的战略支持者，也拥有中国半固态电池创业公司中最好的商业化记录之一。但它仍是执行故事，不是已经去风险化的工业复利资产。IPO
              进程提高了可见度和融资选项，却也迫使公司用更硬的标准证明盈利能力、良率和可持续需求。
