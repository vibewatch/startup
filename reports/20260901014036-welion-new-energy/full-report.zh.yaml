  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              公开可见的 WeLion 客户大致分为三类。第一类是高端 EV OEM 项目，以 NIO 为主，JAC Yiwei 合作作为第二支撑。第二类是储能和工业交易对手，例如 Shaanxi Forestry
              Industry Group 以及相关合资或采购结构。第三类更宽，但具体名称较少，来自 WeLion
              产品材料中暗示的工程机械、海事、轻出行和特种电源应用客户。这足以证明公司并非只想做单一细分市场，但还不足以证明收入按客户实现均衡。

              最重要的分层事实是集中度。NIO 是唯一在部署、终端用户体验、换电兼容性、时间节点和车辆使用上反复出现公开证据的客户。JAC Yiwei 是有意义的第二个 OEM
              关系，但仍更像开发中的项目。储能客户通过项目公告显示重要性在上升，但具名终端市场部署细节仍比 NIO 记录薄。

              因此，客户图谱是偏斜的：一个高度可见的锚定客户，少数可信的二线证明，以及一条公开需求信号仍然偏薄的长尾。
