      - number: '7.4'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              科学履历是 WeLion 最强资产之一，但同一结构也制造了关键人物和治理集中度。公开报道仍高度围绕 Yu Huigen、Li Hong
              和中国科学院起源故事展开。这增强了外界对底层研究平台的信任，却让创始圈层之下的运营梯队到底有多宽，能见度有限。对一家接近 IPO
              的资本密集型电池制造商来说，这不是表面问题；它直接关系到商业放量、工厂运营和资本市场执行能否以同样速度成熟。

              电池公司往往在执行复杂度叠加前看起来最强。公司必须协调材料伙伴、产品认证、项目融资逻辑和多地制造，同时还要为公开市场收紧披露纪律。更广泛电池行业的同行失败提醒我们，工业执行必须比早期创始人叙事更系统。

              因此，关键风险不只是管理层是否可信。而是当前团队深度、治理结构和报告节奏，是否已经足够支撑下一阶段，还是主要由科学声誉和客户标题推断出来。
