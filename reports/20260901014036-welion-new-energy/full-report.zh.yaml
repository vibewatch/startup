      - number: '5.2'
        title: 化学体系、电芯设计与运行架构
        blocks:
          - type: paragraph
            body: >-
              WeLion
              当前产品的核心技术思路，不是一步消灭液态电解质，而是通过混合固液和半固态架构有控制地降低液体含量。官方材料把半固态电池描述为传统锂离子与全固态电池之间的中间状态。第三方技术来源进一步收紧了这个描述：Battery
              Design 和行业分析把公司已知电芯描述为接近 NIO 150 kWh 电池包的高能量半固态设计；更广泛的 2026 年回顾则把 WeLion 列入中国在真正全固态量产前商业化过渡层的公司。


              WeLion 解决方案页补充了重要架构细节。公司称拥有 360 Wh/kg 量产 EV 电芯、最快 12 分钟完成 10-80% 充电、支持 46 系列大圆柱全极耳电芯，并结合 CTP
              集成、智能制造和多级安全设计。这些说法表明，公司的产品架构最好被理解为化学创新、电芯形态工程、电池包级集成和制造工艺适配的组合。


              因此，这套架构不只是“一种更好的材料”。它是一个产品系统，覆盖电解质设计、电极兼容性、形态选择、电池包集成、BMS 和热管理策略，以及产线转换或制造 know-how。
