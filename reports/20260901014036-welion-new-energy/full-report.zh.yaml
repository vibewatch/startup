        title: 扩张路径、集中度风险与结论
        blocks:
          - type: paragraph
            body: >-
              WeLion 的扩张路径是可见的：深化 NIO 相关部署，把 JAC Yiwei 转化为规模化生产，把 ESS
              从采购标题推进到已安装运营资产，最终把同一套电芯和电池包逻辑扩展到重型、海事和其他专用领域。公开来源越来越支持这条故事中的 ESS 一端，包括 Shaanxi Forestry 采购和 3 GWh
              Qingyang 固态电池包项目。这很重要，因为它显示管理层在努力避免纯粹依赖单一 EV 客户。

              但在这些新路径成熟前，集中度风险仍然很高。NIO 仍是唯一能在公开信息中反复观察到终端用户采用的客户。如果 NIO 高端电池项目表现不佳，WeLion 的商业叙事会被不成比例地削弱。同样，如果 JAC 或 ESS
              伙伴停留在公告或试点阶段，客户基础在理论上会显得更宽，但在变现现实中并不宽。

              因此，客户结论在旗舰证明质量上偏正面，在可独立验证的客户多元化广度上偏负面。WeLion 有真实客户；它还没有一个完全去风险的客户组合。
