  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              给 WeLion 套上的最大市场标签是全球 EV 电池市场，但这个框架对尽调太粗。WeLion 并不竞争交通、储能和电子领域的每一块电池预算。实际市场边界更窄：面向高端或技术要求高的 EV
              项目的高能量密度动力电池；面向电网和工业项目、更安全或寿命更长且能承受溢价的储能电池；以及无人机、机器人、移动电源等相邻轻量化动力应用，在这些场景里，质量或体积能量密度比最低成本化学体系更重要。因此，公司更适合被分析为大型锂离子市场中正在出现的半固态
              / 固态楔子参与者。


              现状替代品仍是传统锂离子，尤其是 LFP 和高镍 NMC/NCA。Axis Intelligence、ChinaBiz Insider 和 Energy Solutions
              都明确指出，主流规模仍属于这些成熟化学体系。LFP 主导固定式储能，也凭借便宜、稳健和中国超大制造规模，快速进入主流汽车市场。NMC 在重视续航的高端车中仍有位置。只有当 WeLion
              这类半固态设计创造出足够的额外续航、安全性或封装灵活性，足以支撑相对既有方案的溢价时，经济性才有意义。


              这种区分很重要，因为许多固态叙事夸大了替代性。一个对标 100–150 kWh 高端电池包的高端 EV 电池，并不对应 50–60 kWh 大众市场 LFP
              电池包的同一预算线，更不用说按每循环成本优化的固定式储能集装箱。因此，WeLion 的市场更应理解为更广泛电池需求中的受约束高价值子集，而不是对整个电池行业的即时索取权。
