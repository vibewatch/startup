      - number: '3.3'
        title: 切换成本、分销力量与买方锁定
        blocks:
          - type: paragraph
            body: >-
              电池竞争不是只靠实验室指标赢。OEM 关心认证时间、电芯到电池包集成、安全验证、制造良率、质保信心，以及跨多个车型世代保障交付的能力。即使创业公司看起来技术强，这些动态也会制造高切换成本。已经与 CATL 或
              BYD 集成的买方，可以一边继续采购成熟 LFP 或高镍产品，一边观察下一代替代方案；这给在位者带来创业公司没有的内生期权价值。


              WeLion 的对冲力量，是关系带来的验证。NIO 给了它少见机会，在高端车辆场景中证明半固态电池；JAC Yiwei 则把故事扩展到单一客户之外。BASF
              公开交付正极活性材料也重要，因为它显示可信产业伙伴愿意接入 WeLion 供应链。但这些仍是验证点，不是深度锁定证据。公开来源没有显示多客户批量承诺、透明定价权，或可与在位巨头相比的分销网络。


              尽调上，这意味着 WeLion 在产品验证上强于渠道力量。公司商业化准备度可能领先若干创业同业，但如果在位巨头把下一代电池捆绑进更广泛供应合同，或者客户多家下注而不承诺，WeLion 仍然脆弱。
