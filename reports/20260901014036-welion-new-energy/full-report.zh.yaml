      - number: '2.3'
        title: 买方群体、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              第一类买方是高端 EV OEM 及其电池决策者。在 WeLion 当前验证集中，NIO 位于中心，因为它在 150 kWh 电池包中采用了 WeLion 电芯，并围绕长续航、高规格车辆做品牌定位。JAC
              Yiwei 的意义在于，它把路径从单一 OEM 扩展出去，并显示市场对面向 600–1,000 km 车辆的大圆柱半固态电芯有兴趣。在这些项目里，使用者是最终驾驶员，但付款方和预算所有者是 OEM
              及电池系统项目经理，他们看重续航差异化、平台适配和品牌光环。


              第二类买方是电网级或工业 ESS 开发商。在这一分部，使用者可能是公用事业、场站运营商或工业能源管理方；付款方通常是项目开发商或资产所有者；预算所有者往往位于基础设施
              capex，而不是汽车产品规划。这里的销售动作较少依赖极致质量能量密度，更看重安全、循环寿命、衰减曲线、许可便利性，以及支撑重视本征安全的高价值项目的能力。


              第三类买方包括机器人、无人机和移动电源集成商。这个市场战略上较小，但可能更早商业化，因为所需体量较低、每公斤价值更高。三类买方的采用漏斗大体一致：验证电芯性能，集成进电池包或产品，在有限部署中证明可靠性，然后只有在成本和良率可接受时才扩张。这个漏斗解释了为什么半固态过渡产品可以先于全固态设计出货，却不能证明大众市场采用已经临近。
