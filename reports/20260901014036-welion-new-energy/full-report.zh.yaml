      - number: '4.4'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              WeLion 的资本故事既强，也不完整。强在公司仍能吸引战略投资人、维持 IPO 进程，并在最耗资本的制造品类之一里为多年工业扩张融资。不完整在于，公开资料没有显示其手头现金、债务义务、月度烧钱、库存融资，或
              R&D 与工厂 capex 的拆分。对私募市场承销而言，这些不是脚注，而是核心变量。


              合理解读是，直到公开上市、大客户预付款或持续毛利产生降低新增外部资本需求之前，WeLion 仍依赖融资。公司的估值标记意味着投资人愿意资助这段旅程，但估值本身不是现金跑道。没有招股书，就无法判断 IPO
              叙事有多少建立在真实经营杠杆上，又有多少建立在前瞻技术期权价值上。


              因此，财务结论是：对战略重要性谨慎正面，对公开证据质量谨慎负面。收入机制真实，交易对手可信，牵引力信号存在；但经审计收入质量、毛利率路径和现金跑道仍是未解决的尽调阻塞点。
