            body: 全球 EV 电池这个大盘无疑很大，但 WeLion 不需要赢下全部。经济上真正相关的楔子，是高端 EV、选择性 ESS 和轻量化动力小众市场；在这些场景里，密度或安全性足以支撑高于 LFP 或标准锂离子的成本。
