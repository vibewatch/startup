      - number: '6.3'
        title: 留存、重复使用与客户质量
        blocks:
          - type: paragraph
            body: >-
              最好的公开重复使用代理指标不是续约表，而是 NIO
              换电和部署生态。换电兼容性重要，因为它把先进电池变成重复使用的服务界面：驾驶者不是一次性购买，而是在持续运行的基础设施网络中使用电池。真实道路续航演示和后续网络规模换电统计，说明 NIO
              平台周围存在真实终端用户参与，尽管这些数据无法拆出具体有多少用户选择 150 kWh 的 WeLion 供电电池包。

              客户质量在 NIO 侧也强于组合中的其他部分。NIO 仍是大型、上市、融资充足的 OEM，有能力支持先进电池项目。相比之下，二线客户组前景不错，但仍不透明。JAC Yiwei 处于开发阶段；ESS
              交易对手往往是项目或 JV 结构，而不是高度透明的公开客户；更宽品类客户在公开材料中大多没有具名。

              因此，留存结论是混合的。NIO 提供了罕见的重复使用环境和可信客户质量，但重复订单、多年续约和细分市场多元化的公开证据仍然偏薄。
