  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              WeLion 的投资案例不常见：它比许多电池初创公司有更多真实世界证明，但财务透明度远低于公开市场通常要求。投资逻辑从商业可信度开始。WeLion 不只是在实验室条件下承诺下一代电池化学体系：它有可见的 NIO
              部署历史，通过 JAC Yiwei 获得第二条 OEM 路径，有 BASF 材料支持，也有 ESS 项目证据，显示公司已经进入工业系统。因此，它不只是一个押注科学研究的期权。

              反向逻辑是，当前估值仍高度依赖叙事和战略稀缺性。公开来源继续把后期融资支持、Xiaomi 和 Huawei 参与、IPO
              准备作为公司应获得溢价估值的理由，但公开记录没有披露收入、毛利率、现金跑道或股权结构条款。换句话说，公司或许相对更早期的纯科学同行应享受溢价，但投资人无法验证，一旦经营指标可见，这部分溢价还能保留多少。

              因此，正确框架应对价格敏感，而不是只看公司质量。WeLion 可以同时是真实技术赢家，也可能是一个入场估值偏高的投资。
