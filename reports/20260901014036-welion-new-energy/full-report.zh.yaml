      - number: '1.3'
        title: 资本基础与商业利益相关方
        blocks:
          - type: paragraph
            body: >-
              WeLion 2025 年 12 月启动创业板上市辅导时，背后已经站着密集的战略和财务投资网络。CnEVPost、ChinaEVHome、Jiemian Global、SMM 等英文报道一贯点名 Huawei
              支持的 Hubble Investment、Xiaomi 的 Changjiang Industrial Fund、NIO Capital、Geely 相关资本，以及后来的 ICBC Capital 或
              Guangdong Energy Group，称它们是公司股东或 D+ 轮参与方。投资人名单重要，是因为它与 WeLion 的上市路径高度匹配：NIO 是高端 EV 锚定客户，Xiaomi 和 Huawei
              代表潜在生态和产业连接，国资或银行系基金则可以支撑电池制造所需的漫长 capex 周期。


              公开报道还显示，到 2025 年 IPO 推进时，WeLion 已完成九轮融资。2025 Hurun Global Unicorn Index 给出的公司估值为 RMB 18.5 billion；而 SMM
              2026 年行业评论提到，IPO 前估值约 RMB 20 billion。这些数字不应随意混合：前者是指数估值，后者是与后续融资窗口相关的市场评论。但合在一起看，随着商业化证据累积，外部投资人仍持续把
              WeLion 稳稳定在独角兽门槛之上。


              除股权资本外，利益相关方版图已延伸到供应商和产业伙伴。BASF 的电池材料合资公司公开确认，已为 WeLion 半固态项目供应正极活性材料；Shaanxi Forestry Industry Group
              合作协议则显示，WeLion 正用合资结构向外推进储能制造。图景很清楚：这家公司不再只由风险投资资本供血，而是嵌入了更广泛的产业联盟。
