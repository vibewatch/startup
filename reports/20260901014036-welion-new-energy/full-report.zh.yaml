      - number: '8.5'
        title: 投资建议、否决触发与最终尽调
        blocks:
          - type: paragraph
            body: >-
              最有证据支撑的投资姿态是观察。WeLion
              的证明足以让它留在主动观察名单上，可信度也高于许多前沿电池初创公司，但公开证据还不足以在当前估值叙事下支撑有信心的买入建议。高风险和低置信度正是这种不对称的自然结果：有意义的上行仍可能存在，但结果区间仍异常宽。

              投资人应聚焦少数可观察触发项。公开申报、正式融资事件或更清晰的经营披露，会是最强的正面催化剂，因为它能把投资逻辑从估值民间传说转化为可审计数据。反面也成立。如果 IPO
              进展停滞、客户广度仍窄，或上市电池同行再次下调估值，WeLion 当前估值标记会很快变得更难辩护。

              因此，最终尽调应少看泛泛的市场规模，多看真正给这笔投资定价的缺失变量：收入质量、利润率路径、客户集中度和优先股堆叠包袱。
