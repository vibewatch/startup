chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与定位
        blocks:
          - type: paragraph
            body: >-
              Beijing WeLion New Energy Technology Co., Ltd. 成立于 2016 年，总部位于北京市房山区窦店镇。无论是英文公司材料、行业资料，还是后续 IPO
              报道，公司都把自己定位为固态锂电池开发商，负责把中国科学院物理研究所的研究成果商业化。科学脉络之所以重要，是因为 WeLion 不是泛泛的 EV
              电池创业公司；公开资料反复把它描述为该所固态电池研究的产业化平台，也是把实验室成果转化为车辆和储能产品的产学研孵化企业。


              公司的产品范围不止一款概念电池。公开材料显示，组合覆盖 EV 用混合固液电解质动力电芯、280Ah 级储能电芯，以及面向无人机、机器人和便携电源的轻量化高能量产品。因此，商业模式更应理解为 B2B
              电芯和电池系统供应，而不是消费硬件：WeLion 卖给汽车制造商、储能项目和工业客户，满足它们对更高能量密度或比传统锂离子更安全化学体系的需求。


              目前最强的商业验证来自 NIO。WeLion 的 360 Wh/kg 半固态电芯成为 NIO 150 kWh 超长续航电池包的核心，使 WeLion 成为最早把半固态电芯从研发叙事推进到乘用 EV
              有限批量部署的中国创业公司之一。后续报道还把 WeLion 与储能订单、BASF 正极材料合作，以及采用 4695 大圆柱半固态电芯的 JAC Yiwei 项目联系在一起。这些联系支持一个判断：WeLion
              已经在按商业化平台运转，即使真正全固态量产仍是未来里程碑，而非既成事实。
