  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              WeLion 的收入模式是工业 B2B，不是经常性软件，也不是消费硬件。公开产品和市场证据至少指向三条变现通道：卖给 NIO、JAC Yiwei 等 OEM 项目的 EV
              电芯和电池系统；卖给电网、工业或国资相关项目的储能电芯或系统；以及能量密度比商品化成本更重要的小型特种动力产品。产品目录和媒体报道显示，公司正在变现当前半固态产品和未来管线技术，但不是通过公开标价。


              由于合同私密，最好的公开变现证据来自订单公告和项目部署。2025 年 10 月 Shaanxi Forestry Industry 4 GWh / RMB 4 billion
              合作提供了最清晰的披露交易规模代理，尽管它很可能不只包含裸电芯。NIO 部署报道确认，WeLion 已经推进到接近量产的车辆项目中，但公开来源仍未披露电池包数量、电芯 ASP、返利或质保经济性。


              这造成典型硬件尽调问题：收入机制和客户参与意愿有清晰证据，但公开披露还不足以把这些机制转化为可靠收入模型。因此，收入质量仍是“可信”，而非已经被证明。
