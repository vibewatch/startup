summary:
  headline: >-
    WeLion has real commercialization proof, rare Chinese semi-solid battery credibility, and a
    plausible IPO path, but the current RMB 18.5-20.0bn valuation narrative still runs ahead of
    public evidence on revenue, margins, customer concentration, and manufacturing quality, making
    Track the most defensible call at low confidence.
