companyProfile:
  summary: >-
    WeLion New Energy was founded in 2016 in Beijing as the commercialization platform for
    solid-state-battery research originating from the Institute of Physics, Chinese Academy of
    Sciences. Public sources consistently tie the company to Yu Huigen, Li Hong, and the broader
    CAS scientific lineage behind its battery work. WeLion's current commercial identity rests on
    semi-solid and hybrid solid-liquid electrolyte lithium batteries, especially the 150 kWh NIO
    battery program, while its product portfolio also spans energy-storage cells, large-format EV
    cells, and adjacent specialty-power applications. By late 2025 and 2026, the company had
    entered ChiNext IPO tutoring, attracted strategic investors including Xiaomi and Huawei in
    public reporting, and accumulated public valuation references around RMB 18.5-20.0 billion.
    The company has stronger real-world deployment proof than many frontier battery startups, but
    it remains financially opaque by public-market standards.
  foundedDate: '2016-01-01'
  founders:
    - name: Yu Huigen
      role: Chairman / operating leader
      background: >-
        Public reporting consistently presents Yu Huigen as the practical operating leader and key
        control figure during WeLion's commercialization and IPO-preparation phase.
    - name: Li Hong
      role: Co-founder / president / technical leader
      background: >-
        Senior Institute of Physics researcher associated with translating Chinese Academy of
        Sciences solid-state battery research into commercial products.
    - name: Chen Liquan
      role: Founding scientific sponsor
      background: >-
        Chinese Academy of Engineering academician widely associated with the original scientific
        platform behind WeLion's solid-state battery positioning.
  foundingLocation: Beijing, China
  headquarters: Fangshan District, Beijing, China
  productSummary: >-
    WeLion sells advanced lithium battery products into B2B applications. The current flagship
    commercial proof is a semi-solid or hybrid solid-liquid traction-battery pathway used in NIO's
    150 kWh premium EV program. Public sources also show energy-storage cells and systems,
    46-series large cylindrical EV cell development with JAC Yiwei, and adjacent batteries for
    marine, machinery, robotics, UAV, and other specialized-power use cases. The long-term roadmap
    still points toward fuller all-solid-state commercialization, but the currently evidenced
    revenue-bearing products are bridge-chemistry systems.
  customerFocus: >-
    Primary customers and counterparties are premium EV OEMs led by NIO, second-line automotive
    partners such as JAC Yiwei, and energy-storage / industrial project buyers or JV structures.
    Public customer proof is strongest in premium EV deployment and weaker in broader diversified
    recurring accounts.
  businessModel: >-
    B2B battery developer and manufacturer. WeLion aims to generate revenue from EV battery cells
    and packs, ESS cells and systems, and related industrial battery programs, with value creation
    dependent on product qualification, manufacturing scale-up, and eventual public-market or other
    strategic financing to support capital intensity.
  stage: D+ private company preparing for public listing
  fundingStatus: >-
    Public sources describe WeLion as having raised multiple rounds from Series A through D+, with
