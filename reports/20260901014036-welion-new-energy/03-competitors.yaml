  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing
    missingEvidence: Contract pricing, warranty terms, and realized ASPs for WeLion versus major OEM or ESS customers.
    whyItMatters: Without price and warranty evidence, competitive advantage cannot be converted into margin or underwriting conclusions.
    diligencePath: Request signed customer economics, rebate schedules, and warranty-reserve assumptions from management or prospectus.
    relatedQuestionRefs:
    - QP018
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: yield-and-quality
    missingEvidence: Comparative manufacturing yield, scrap, defect, and degradation data versus CATL, BYD, Ganfeng, and other peers.
    whyItMatters: Scale competition in batteries is usually won on yield and reliability, not headline density alone.
    diligencePath: Request pilot-line and plant yield dashboards, customer qualification data, and lifecycle test results.
    relatedQuestionRefs:
    - QP013
    - QP017
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: customer-lock-in
    missingEvidence: Evidence of repeat orders, multi-year supply commitments, and customer switching-cost behavior beyond NIO headlines.
    whyItMatters: Competitive defensibility depends on lock-in and repeat procurement, not one-off proof projects.
    diligencePath: Obtain shipment tables, re-order rates, signed framework agreements, and pipeline conversion metrics.
    relatedQuestionRefs:
    - QP015
    - QP019
    - QP020
    - QP025
  - type: conflicting-data
    severity: minor
    topic: competitive-timelines
    missingEvidence: Comparable third-party timeline tracking for CATL, BYD, QingTao, and Ganfeng using one methodology.
    whyItMatters: Peer timeline sources use different definitions for pilot, small-batch, and mass production.
    diligencePath: Build a normalized competitor timeline model using filings, official releases, and engineering milestones.
    relatedQuestionRefs:
    - QP006
    - QP007
    - QP010
    - QP011
  - type: private-evidence-only
    severity: material
    topic: warranty-and-service
    missingEvidence: Field-failure, recall, and warranty-claim data for WeLion and named peers.
    whyItMatters: Battery buyers value downstream reliability economics at least as much as performance claims.
    diligencePath: Request quality incident history, reserves, and service agreements under NDA.
