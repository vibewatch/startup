callouts:
- calloutType: strength
  title: WeLion has more real commercialization texture than many startup peers
  body: >-
    Compared with many solid-state startups, WeLion can point to a stronger bundle of proof: a shipped semi-solid

    product, a visible anchor customer in NIO, a second OEM cooperation path through JAC Yiwei, BASF materials

    support, and a deep Institute-of-Physics origin story. That combination gives it better narrative credibility

    than companies that have only pilot-line or investor-deck evidence.
  claimRefs:
  - CP011
  - CP012
  - CP013
  - CP027
- calloutType: risk
  title: Incumbent scale is the real moat-killer
  body: >-
    The hardest competitor for WeLion is not necessarily another startup. It is the battery giant that can offer

    today's chemistry, tomorrow's bridge product, and eventually a solid-state roadmap through the same OEM

    relationship. CATL and BYD are dangerous precisely because they let customers postpone switching while still

    staying inside a trusted supplier relationship.
  claimRefs:
  - CP008
  - CP020
  - CP026
  - CP036
- calloutType: risk
  title: NIO proves technical deployment, not durable competitive lock-in
  body: >-
    The NIO programme is meaningful proof, but the discontinuation of the 150 kWh pack after only a few hundred

    units is a reminder that early deployment can coexist with weak product-market fit. If repeat volumes do not

    appear, WeLion's customer proof remains more important for reputation than for defensible economics.
  claimRefs:
  - CP003
  - CP014
  - CP025
  - CP035
