  topStrengths:
    - >-
      Real deployment proof through NIO gives WeLion a stronger commercialization case than many next-generation battery
      startups.
    - >-
      Chinese Academy of Sciences lineage and Institute of Physics heritage create a credible technical moat and
      strategic narrative.
    - >-
      Public evidence of BASF materials support, JAC Yiwei collaboration, and ESS projects shows the company is broader
      than a single lab claim.
    - Late-stage funding and IPO tutoring indicate continued capital-market and strategic-investor interest.
    - >-
      Semi-solid bridge products allow WeLion to monetize part of the solid-state narrative before full all-solid
      industrialization arrives.
  topRisks:
    - >-
      Public financial opacity remains severe because revenue, gross margin, cash, yield, and cap-table terms are still
      undisclosed.
    - Customer concentration is high because NIO remains the only deeply evidenced anchor customer in the public record.
    - >-
      The flagship premium-pack story is real but narrower than hype, with NIO discontinuing the 150 kWh pack after
      limited uptake.
    - >-
      Incumbents such as CATL, BYD, Ganfeng, and Samsung SDI can compress WeLion's timing moat as solid-state programs
      mature.
    - >-
      Export-compliance, standards, and manufacturing-quality burdens are increasing just as WeLion approaches IPO
      scrutiny.
  unresolvedGaps:
    - Audited revenue, gross margin, cash, capex, and working-capital data are still not public.
    - >-
      Exact D+ round size, per-share price, liquidation preferences, anti-dilution terms, and any secondary pricing are
      unknown.
    - Top-customer revenue share and non-NIO repeat-order depth remain undisclosed.
    - Yield, scrap, warranty reserve, and cycle-life cohort data by product line remain unavailable publicly.
    - >-
      ESS project conversion, commissioning, collections, and repeat-order evidence are still too thin for bankable
      underwriting.
    - >-
      IPO tutoring milestones, sponsor detail, and expected filing timing are not yet transparent enough to model
      catalyst timing precisely.
