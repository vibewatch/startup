    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and current stage
        blocks:
          - type: paragraph
            body: >-
              JumpCloud's identity is well established across company and independent profiles even if some metadata
              disagree at the margin. Retained sources converge on Louisville, Colorado as headquarters, 2012 as the
              founding year, and 2013 as the formal market launch. Product positioning has evolved more aggressively
              than the financing record: company pages now frame JumpCloud as an AI-powered unified IT management
              platform that secures human, non-human, and agentic identities, while independent descriptions still
              anchor the business in cloud directory, identity, access, and device management. Public stage evidence
              remains late private rather than newly financed growth: the latest valuation evidence in retained sources
              still points back to the 2021 Series F, with no newer priced equity round surfaced in this pool.
