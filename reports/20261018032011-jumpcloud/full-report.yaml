  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently describes JumpCloud as a consolidation product for IT teams that want
              one control plane for directory data, endpoint control, and access policy instead of a stack of separate
              AD, SSO, and MDM tools. That workflow starts with one cloud directory per user, extends into app and
              infrastructure access, and then reaches down into device policy so the same operator can manage users,
              endpoints, and authentication from one console. The product is therefore easiest to understand as an IT
              operations platform with identity at the center, not as a pure application-only IAM suite or a
              zero-configuration federation layer.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
