              The retained public record is founder-heavy. Rajat Bhargava remains the named CEO in current third-party
              profiles, and Rajat Bhargava, Greg Keller, and Larry Middle recur as the core founding set across multiple
              sources. That is useful for continuity, but it also means the chapter cannot fully validate the broader
