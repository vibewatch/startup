  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring revenue architecture and list pricing
        blocks:
          - type: paragraph
            body: >-
              JumpCloud monetizes a unified directory, access, and device-management platform rather than hardware or
              transaction volume. Public pricing reviewed in August 2026 shows entry packages billed per user per month,
              a menu of separately priced modules, and larger Platform tiers that move behind a sales conversation. A
              30-day full-feature trial supplies a product-led entry point, while the quote-only tiers imply
              sales-assisted expansion for larger or more complex accounts. This structure creates seat, module,
              support, and package-upgrade levers, but list prices are not realized ASP: the sources do not disclose
              negotiated discounts, contract duration, revenue mix, attach rates, or revenue-recognition policy.
            claimRefs:
