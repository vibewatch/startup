            body: >-
              The public footprint described in the assigned pool is broad, but it is not evenly evidenced across buyer
              segments. Company-originated or company-relayed sources frame JumpCloud as serving more than 250,000
              organizations across over 160 countries, while independent reviews repeatedly place the product with
              IT-led teams replacing fragmented directory, access, and device stacks. The most consistent personas are
              IT administrators, security/identity operators, and MSPs managing mixed Windows, macOS, Linux, and Android
              estates. The segment story is therefore strongest for infrastructure-centric buyers rather than
              line-of-business owners, and public evidence still does not separate free usage, paid deployments, or
              channel-led accounts within that headline organization count.
