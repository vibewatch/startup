              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
      - number: '5.3'
        title: Differentiation, buyer fit, and implementation maturity
        blocks:
          - type: paragraph
            body: >-
              Third-party commentary makes the fit profile clearer than the official marketing does. JumpCloud appears
              strongest where an IT team needs identity tied directly to device posture across mixed operating systems,
              especially when replacing legacy directory infrastructure or reducing tool sprawl. That same evidence also
              narrows the best-fit buyer: the product is less compelling when the main requirement is large-scale CIAM
              or deep federation depth without device management. Implementation maturity also looks operational rather
              than turnkey. Multiple sources stress migration planning, access audits, and supported-platform
              verification, which suggests consolidation value is real but depends on disciplined rollout rather than on
              a frictionless self-serve deployment.
            claimRefs:
              - CE004
              - CE007
              - CE008
      - number: '5.4'
        title: Trust, compliance, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The public trust surface is mixed. On the positive side, third-party catalog material attributes SOC 2
              Type II, ISO 27001, and a broad integration set to JumpCloud, which supports the argument that the
              platform is commercially mature and integration-ready. On the risk side, the strongest adverse evidence in
              this pool is not about a missing feature but about operating context: a competitor analysis aimed at EU
              buyers argues that US jurisdiction still governs EU-resident data, and it recaps the 2023 Lazarus-linked
              incident as a supply-chain event that reached the orchestration path for downstream customers. That makes
              security and sovereignty a product-architecture question for regulated buyers, not just a legal footnote
              attached after purchase.
            claimRefs:
              - CE009
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mixed-OS estates are the clearest product fit
            body: >-
              The strongest consistent differentiation is not generic IAM breadth; it is the product's ability to keep
              directory, access, and device controls in one system for IT teams running heterogeneous endpoint fleets.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE007
          - type: callout
            title: Regulated-buyer diligence reaches beyond feature fit
            body: >-
              EU sovereignty concerns and the 2023 supply-chain incident change the product question from "does the
              feature exist?" to "is this control plane acceptable for sensitive identity and device data in our
              jurisdiction and risk model?"
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
