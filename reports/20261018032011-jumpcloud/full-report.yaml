        title: Funding history, milestone cadence, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Funding and scale evidence are directionally positive but not clean enough to treat as precision facts.
              JumpCloud's own materials only claim more than $400 million raised, while two retained third-party
              trackers disagree on whether total disclosed funding is roughly $408 million or $423 million-plus and on
