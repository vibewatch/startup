      - number: '4.2'
        title: Public traction is directional, not an audited revenue base
        blocks:
          - type: paragraph
            body: >-
              Sacra estimates that JumpCloud reached $105 million of ARR in 2023, up 31% from $80 million in 2022. That
              metric is ARR, not GAAP revenue, and it is both third-party estimated and historical relative to the
              October 2026 run date. More recent demand signals are product-adoption proxies rather than financial
              disclosure: a JumpCloud partner repeats the company's count of more than 250,000 organizations across
              160-plus countries, while Capterra reports favorable reviewer scores for secure login, authentication, and
              data security. Neither source identifies the current number of paying customers, ARR concentration,
              free-to-paid conversion, cohort retention, or revenue by customer segment.
            claimRefs:
              - CI002
              - CI011
              - CI012
      - number: '4.3'
        title: Financing history does not establish capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $408 million of cumulative funding across 11 rounds and identifies the September 2021
              Series F as $225 million at a $2.62 billion post-money valuation. Those are historical financing facts,
              not evidence of cash still available in 2026. JumpCloud's February 2026 announcement of a venture arm and
              first investment in Tofu is a current capital-allocation signal, but the company disclosed neither the
              program size nor the investment amount. The assigned sources provide no current cash balance, burn,
              runway, debt or covenant schedule, so they cannot establish the next-round trigger or financing
              dependency.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The revenue mechanism is plausible for durable recurring software: customers can begin with a focused
              per-user package, add modules, and graduate to broader negotiated tiers as their identity and device
              estate grows. The adverse read is that this same modularity can create renewal friction. Siit's review
              reports complaints about roughly 10% renewal increases, while Access Security Hub notes that total cost
              varies with users, devices, and enabled modules. Without realized discounting, gross margin, support
              burden, CAC, payback, churn, NRR, cash, and runway, however, neither operating leverage nor financing
              resilience is underwriteable. The financial stance is therefore positive on monetization design but
              blocked on revenue quality, margin path, and capital adequacy.
            claimRefs:
              - CI009
              - CI010
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical funding is not current liquidity
            body: >-
              The $408 million funding total and 2021 Series F identify financing history only. Without current cash,
              burn, debt, or commitments, they cannot support a runway claim.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: callout
            title: Packaging is clearer than financial performance
            body: >-
              Public list prices explain how seats and modules can expand contract value, but realized pricing,
              retention, margin, and cash conversion remain private.
            calloutType: insight
