  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute logic
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently places JumpCloud in a bundled control-plane category rather than a
              point IAM niche. JumpCloud's own Cloud Directory page says the platform "unifies identity and device
              management into a central engine," while Security Stack and Intellyx describe the same cross-OS,
              mixed-environment scope. The most direct status-quo substitute is still legacy Active Directory and its
              adjacent admin stack: CyberSecurityO says JumpCloud addresses organizations, especially SMBs, startups,
              and cloud-native companies, that have no on-premises Active Directory and do not want to build one, and
              Security Stack calls it a cloud-based alternative to Microsoft Active Directory. That boundary includes
              directory, authentication, provisioning, and device-control workflows, but it does not automatically
              include deep CIAM, large-federation programs, or stand-alone IGA/PAM budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM011
              - CM012
      - number: '2.2'
        title: Buyer, user, payer, and channel pattern
        blocks:
          - type: paragraph
            body: >-
              Buyer evidence points to IT-led adoption rather than line-of-business pull. Access Security Hub says
              JumpCloud is best for "IT-driven teams managing users + devices," and CyberSecurityO frames the core buyer
              as SMB, startup, and cloud-native organizations that want to centralize users, devices, and authentication
              without legacy directory infrastructure. MSPs also matter because CyberSecurityO describes JumpCloud as a
              way to manage multiple client environments from a single multi-tenant console. The practical user base is
              employees, administrators, and managed endpoints, while the payer is typically the IT or identity budget
              owner trying to replace several adjacent tools with one console. Public sources show breadth across
              startup, enterprise, and MSP environments, but they do not reveal how much of that footprint is paid,
              partner-mediated, or concentrated in any one segment.
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.3'
        title: Sizing lenses, demand drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Public market sizing remains proxy-based rather than revenue-linked. JumpCloud's own 2026 G2 releases
              provide the strongest activity signals: the Fall report was based on 936 verified reviews, 12.2% of
              reviews described replacing separate tools with a single platform, and 68% of JumpCloud reviews mentioned
              device control, while the Spring release said 4,000+ verified user reviews supported leadership across 150
              categories. Those data points support a consolidation driver, not a TAM/SAM/SOM dollar model. The
              addressable story is also broadening into non-human identity and AI-agent governance, which helps the
              narrative around adjacencies, but monetization of that adjacency is not publicly broken out. Constraints
              are equally important: Access Security Hub says JumpCloud is "not a pure enterprise IAM suite," and
              CyberSecurityO says organizations past roughly 500–1,000 employees with complex governance or PAM needs
              may require complementary tooling. For valuation, public evidence supports a credible consolidation thesis
              more than a source-backed bridge from installed-base scale to monetized SAM or SOM.
            claimRefs:
