      - CE003
      - CE004
      - CE006
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to an IT-led journey that starts with directory replacement and can expand into broader
      device, access, and SaaS-governance workflows, but leaves renewal quality largely opaque.
    data:
      items:
        - label: Directory sprawl trigger
          actor: IT lead or MSP
          touchpoints:
            - Mixed-OS fleet and legacy directory pain drive initial evaluation
            - Buyers look for one place to manage identity, devices, and access
        - label: Trial and first deployment
          actor: Admin team
          touchpoints:
            - Free ten-day trial covers ten users and ten devices
            - Initial proof point is easier setup than stitching separate tools
        - label: Core identity control
          actor: IT operations
          touchpoints:
            - Provisioning, SSO, MFA, and lifecycle management become daily workflows
            - Windows, macOS, Linux, and Android support broadens applicability
        - label: Device and policy consolidation
          actor: IT or security admin
          touchpoints:
            - Single-console device and access policies reduce point-tool sprawl
            - Integrations with HRIS, cloud apps, and legacy systems raise switching value
        - label: Expansion into adjacent modules
          actor: Security and IT ops
          touchpoints:
            - SaaS discovery surfaces shadow IT
            - Access-request and de-provisioning workflows extend use beyond core directory
        - label: Renewal and scale decision
          actor: Security leadership
          touchpoints:
            - Fit remains strongest for IT-led environments and MSP-managed estates
            - Public evidence does not show NRR, GRR, churn, or concentration by channel
    approximationNotes: >-
      Stage order reflects the common sequence implied by public sources; it does not imply conversion rates because the
      sources do not provide a comparable cohort denominator.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU007
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence clusters JumpCloud's residual risk around enterprise-fit, rollout, and governance execution rather
      than around the absence of core IAM features.
    data:
      columns:
        - label: Likelihood signal
          detail: Ordinal public-evidence read on how structurally recurring the risk appears.
        - label: Impact signal
          detail: Ordinal public-evidence read on how damaging the risk could be for underwriting.
      rows:
        - label: 2023 security-credibility overhang
          values:
            - label: Medium
              detail: >-
                The cited evidence is historical, but security diligence remains live because current outcome metrics
                are not public here.
              tone: warning
            - label: High
              detail: Identity vendors can lose deals quickly if buyers doubt incident governance or assurance quality.
              tone: warning
        - label: Federation / CIAM underfit
          values:
            - label: High
              detail: Multiple reviews frame this as a structural fit issue for federation-heavy or CIAM-heavy buyers.
              tone: negative
            - label: High
              detail: Losing enterprise-fit in strategic accounts would directly affect expansion durability.
              tone: negative
        - label: AI-governance disclosure gap
          values:
            - label: Medium
              detail: >-
                The 2026 product expansion is real, but the public corpus does not show buyer-by-buyer compliance
                fallout yet.
              tone: warning
            - label: Medium
              detail: Missing public compliance mappings can delay or narrow regulated procurement.
              tone: warning
        - label: Rollout complexity / services dependence
          values:
            - label: High
              detail: Setup complexity and partner-led migration work appear repeatedly in third-party commentary.
              tone: negative
            - label: Medium
              detail: Poor implementation can slow deployment and reduce time-to-value even when core features exist.
              tone: negative
        - label: Reporting-depth gap
          values:
            - label: High
              detail: Reporting limitations are described directly in public review commentary.
              tone: warning
            - label: Medium
              detail: Audit-heavy buyers can stall if native evidence output does not satisfy diligence requirements.
              tone: warning
        - label: Pricing / feature-gating creep
          values:
            - label: High
              detail: Public reviews describe modular packaging and add-on expansion as recurring concerns.
              tone: warning
            - label: Medium
              detail: Cost creep can erode sales efficiency and customer ROI before it becomes a thesis-breaker.
              tone: warning
    approximationNotes: >-
      Ordinal placement is the chapter's synthesized ranking from cited evidence, not an external benchmark score or
      incident-frequency model.
    claimRefs:
      - CR004
      - CR007
      - CR008
      - CR009
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Breadth and traction support relevance, but stale price discovery and fit limits keep the recommendation at track.
    data:
      nodes:
        - id: breadth
          label: Unified identity + device platform
          value: Official platform breadth
          note: Supports premium potential only if customers truly consolidate tools.
        - id: traction
          label: 250k+ organization signal
          value: Adoption evidence
          note: Useful traction indicator, but much of the scale language still traces back to company positioning.
        - id: anchor
          label: 2021 Series F still anchors the mark
          value: $2.56B-$2.62B
          note: Retained 2026 profiles still point back to the September 2021 round.
        - id: uncertainty
          label: Current KPIs remain incomplete
          value: $144.3M revenue estimate; 979-1,098 employee reads
          note: Third-party estimates help frame the case but do not fully verify revenue quality or growth.
        - id: downside
          label: Fit and execution caveats
          value: Federation / agentic risk
          note: Independent reviews flag CIAM and switching limitations that can compress buyer appetite.
        - id: recommendation
          label: Track / stretched
          value: Revisit only with lower price or fresher KPIs
          note: Do not underwrite the old private mark until new evidence resets the valuation basis.
      edges:
        - from: breadth
          to: traction
          label: Supports relevance
        - from: traction
          to: anchor
          label: Does not by itself reset valuation
        - from: anchor
          to: uncertainty
          label: Needs fresh KPI proof
        - from: uncertainty
          to: downside
          label: Magnifies downside
        - from: downside
          to: recommendation
          label: Forces price discipline
    approximationNotes: >-
      Flow summarizes valuation logic from retained evidence; it does not imply precise probability weights or infer
      conversion rates between nodes.
    claimRefs:
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
