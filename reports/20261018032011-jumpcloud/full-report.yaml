  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitution paths
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "cloud IAM" alone. JumpCloud is repeatedly described as a
              cloud directory platform that combines identity, access, and device management, and public reviews frame
              it as a replacement for on-prem Active Directory plus at least part of an SSO and endpoint stack. That
              creates three practical substitution paths: direct identity peers such as Okta and Microsoft Entra ID,
              complex upmarket incumbents such as Ping Identity and legacy ForgeRock, and status-quo bundles where
              buyers keep Active Directory and layer separate MDM, MFA, or network authentication tools. The strongest
              public fit remains IT-led SMB and lower-mid-market teams managing heterogeneous Windows, macOS, and Linux
              fleets; those buyers value a single operational console more than best-in-class federation depth. As a
              result, JumpCloud's direct rivalry is not with one vendor but with the buyer's preferred stack design:
              consolidated cross-platform control versus deeper single-domain specialization.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP013
