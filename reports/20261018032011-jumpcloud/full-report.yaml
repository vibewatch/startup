      - number: '3.2'
        title: Capability, pricing, and migration tradeoffs
        blocks:
          - type: paragraph
            body: >-
              JumpCloud's wedge is operational breadth inside one subscription: directory, MFA, SSO, LDAP, RADIUS,
              device management, and patching. That breadth is strongest where buyers want one platform across mixed
              operating systems and do not want to assemble separate tools. Public third-party comparisons nevertheless
              show clear boundaries. Okta retains the bigger SaaS integration catalog and stronger federation or CIAM
              depth; Microsoft Entra ID is more compelling inside Microsoft 365, Defender, and hybrid Active Directory
              estates; Ping Identity and ForgeRock remain better matched to enterprises that need API-centric security,
              deep orchestration, or on-prem and hybrid deployment flexibility. Pricing signals reinforce the
              segmentation. JumpCloud's published free tier and user-based bundles lower evaluation friction, while Ping
              and ForgeRock remain quote-driven and Okta commonly expands in price as governance or other modules are
              added. This leaves JumpCloud well placed for bottom-up IT adoption, but less obviously advantaged in
              procurement-led large-enterprise transformations.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP016
      - number: '3.3'
        title: Durability, multi-homing, and incumbent response
        blocks:
          - type: paragraph
            body: >-
              JumpCloud's moat looks more operational than structural. The durable advantage is vendor consolidation for
              buyers that want one system to cover directory, access, and cross-platform endpoint policy, reinforced by
              trust markers such as public compliance credentials and broad deployment claims. But public evidence also
              shows that JumpCloud reduces switching pain by coexisting with existing systems: reviewers describe it as
              an overlay for some Active Directory environments, and product-history summaries note support for
              federated authentication with Okta and Entra ID. That coexistence helps adoption, yet it also implies
              weaker lock-in because buyers can multi-home identity layers instead of fully standardizing on JumpCloud.
              The main displacement risk is that direct rivals own narrower but deeper buying criteria: Okta in
              federation and CIAM, Entra in Microsoft-native hybrid identity, Jamf or Kandji in Apple-centric device
              control, and Ping/ForgeRock in high-complexity enterprise identity. JumpCloud can win consolidation-led
              deals, but commoditization risk rises as buyers split those domains back into specialist tools.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Consolidation is the core wedge
            body: >-
              The strongest public differentiation is not pure identity sophistication but the ability to consolidate
              directory, access, and mixed-OS device control into one operational system for IT-led buyers.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP012
          - type: callout
            title: Specialist incumbents still own the hardest enterprise requirements
            body: >-
              Public comparisons consistently place Okta, Microsoft Entra ID, and Ping or ForgeRock ahead when the
              buying center prioritizes deep federation, CIAM, Microsoft ecosystem leverage, or complex hybrid
              orchestration.
            calloutType: risk
            claimRefs:
