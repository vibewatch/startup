      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public product detail points to a layered operating model. The directory remains the core record system,
              with HR or existing-directory sync feeding account state and group changes into lifecycle workflows.
              Access services such as SSO, MFA, LDAP, RADIUS, SSH, and conditional access sit on top of that core, while
              endpoint management extends the same policy plane across Windows, macOS, Linux, and mobile fleets. The
              2026 agentic IAM extension adds another layer focused on AI identities, discovery, registration, and
              policy-governed access. That architecture is specific enough to underwrite module scope, but not yet
              specific enough to verify service-level reliability, large-scale adoption, or regulated-environment
              deployment readiness from public evidence alone.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
