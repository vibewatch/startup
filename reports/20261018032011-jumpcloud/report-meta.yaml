companyProfile:
  summary: >-
    JumpCloud is a late-private identity and device-management company built around a single cloud directory and IT
    control plane. The public record supports Louisville, Colorado as headquarters, a 2012 founding date, a 2013 market
    launch, and a product story that now stretches from directory and access control into agentic identity governance.
    The company remains founder-led and visibly backed by late-stage investors, but current financial performance and
    ownership economics are still only partially disclosed.
