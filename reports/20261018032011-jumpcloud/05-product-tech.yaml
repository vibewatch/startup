  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Independent GitHub package forum release or practitioner-community telemetry showing external builder adoption of JumpCloud APIs scripts or agentic tooling.
      whyItMatters: The product thesis includes extensibility and automation, but the current pool proves documentation and support surfaces rather than real external developer usage or release cadence.
      diligencePath: Request public changelog links API or SDK usage metrics marketplace or forum activity and customer engineering references; if no public proxy exists, document that absence explicitly in the next refresh.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: regulated-agentic-compliance
      missingEvidence: Public FedRAMP GovCloud EU AI governance or similar regulated-environment scope for Agentic IAM.
      whyItMatters: Agentic controls are now part of the product story, but regulated buyers cannot judge deployment readiness from launch language alone.
      diligencePath: Ask product and security leadership for roadmap dates planned attestations data-flow diagrams and customer commitments tied to Agentic IAM.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: reliability-telemetry
