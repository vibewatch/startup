  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: Current ARR or revenue, gross margin, net retention, burn, and paying-customer concentration data.
      whyItMatters: Without current revenue quality metrics, the old private valuation anchor cannot be translated into a confident return case.
      diligencePath: Request current board or lender KPI packs and customer-cohort reporting from management.
      relatedQuestionRefs: [QV009]
    - type: missing-source
      severity: material
      topic: capitalization
      missingEvidence: Current cap-table terms, liquidation preferences, option-pool sizing, and any secondary transaction pricing.
      whyItMatters: Entry discipline depends on downside economics as much as headline enterprise value.
      diligencePath: Obtain the latest cap table, investor-rights summary, and any recent tender or secondary-clearing documentation.
      relatedQuestionRefs: [QV009]
    - type: conflicting-data
      severity: material
      topic: funding-and-headcount
      missingEvidence: A reconciled financing history and a management-confirmed current employee count.
      whyItMatters: Public directories disagree on both total capital raised and current workforce scale, reducing confidence in precision valuation work.
      diligencePath: Reconcile third-party profiles against management financing history and current HRIS or payroll exports.
      relatedQuestionRefs: [QV002, QV009]
    - type: stale
      severity: material
      topic: price-discovery
      missingEvidence: A post-2021 financing, tender, IPO filing, or other fresh price-discovery event.
      whyItMatters: The report can frame the valuation as stretched, but not prove what today's market-clearing price would be.
      diligencePath: Monitor new financing disclosures, secondary-market indications, or formal IPO preparation materials.
      relatedQuestionRefs: [QV006, QV009]
