schemaVersion: report-v2
artifact: valuation
slug: jumpcloud
runDate: 2026-10-18
company:
  name: JumpCloud
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still anchors JumpCloud's valuation to its September 2021 Series F at
    roughly $2.56B-$2.62B, while retained 2026 directories and reviews provide only estimated
    revenue, mixed headcount reads, and no new priced financing event. That combination supports
    a track stance with a stretched valuation view: product breadth and adoption signals are real,
    but the current public record is not strong enough to underwrite the old private mark.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The retained public record supports staying engaged with JumpCloud but not underwriting the
      September 2021 private-market anchor as if it were still a live clearing price. Tracxn still
      points to a $225M Series F at a $2.62B post-money value, while Silicon Valley Invest Club
      still lists a September 2021 $2.56B valuation and StartupHub still describes Series F as the
      latest round on record. Compworth's current revenue estimate of $144.3M gives a rough
      valuation sanity check, but that estimate is unconfirmed and the same public sources do not
      disclose current gross margin, retention, burn, or liquidation terms. That leaves enough
      evidence to judge the price as stretched, but not enough to issue a buy call or support a
      return target with conviction.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-anti-thesis-and-scenarios
    title: Thesis, anti-thesis, and scenario framing
    body: >-
      The core thesis is straightforward: JumpCloud still has a credible platform story because its
      official materials and independent reviews consistently describe one console spanning
      identity, access, and device management across mixed operating systems, and third-party
      catalogs continue to treat it as a meaningful contender against both directory-first IAM
      vendors and broader endpoint or access players. The anti-thesis is equally important for
      pricing: Access Security Hub explicitly says the product is not ideal for federation-heavy
      CIAM environments, while Intellyx warns that customers already committed to competing tools
      may resist switching and that younger competitors can build agentic access control from a
      cleaner slate. Scenario work therefore has to reward real product breadth without assuming
      that breadth automatically preserves the 2021 valuation anchor.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV013, CV014]
    tableRefs: [TV002, TV003]
  - id: diligence-gaps-comparables-and-thesis-breakers
    title: Diligence gaps, comparables, and thesis-break triggers
    body: >-
      The best public comparable frame from the assigned evidence pool is categorical rather than
      fully numeric: Compworth names Okta, Jamf, and OneLogin as top competitors, while Tracxn
      highlights RSA, SailPoint, and SecureAuth. That mix implies JumpCloud straddles identity,
      access, endpoint, and directory budgets, which is strategically positive but makes clean
      one-line multiple mapping difficult without fresher revenue quality data. The thesis breaks
      if a new mark clears materially below the 2021 Series F, if enterprise buyers keep treating
      CIAM and large-scale federation as reasons to choose more specialized tools, or if management
      cannot show that recent AI or agentic additions improve monetization instead of raising
      execution risk. The next diligence step is therefore not to debate story quality, but to
      demand current ARR or revenue, paying-customer concentration, margin, retention, cap-table,
      and secondary-pricing evidence before turning a track stance into an entry decision.
    claimRefs: [CV003, CV005, CV008, CV009, CV011, CV012, CV013, CV014]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Decision implication
    rows:
      - [Recommendation, Track, "Stay engaged but do not underwrite the 2021 private valuation as a current entry price."]
      - [Confidence, Medium, "Product-market relevance is visible, but public valuation inputs are stale and incomplete."]
      - [Risk rating, High, "Category-fit caveats and missing financial quality metrics can compress the acceptable entry multiple."]
      - [Valuation stance, Stretched, "Retained public marks still cluster around the 2021 Series F at roughly $2.56B-$2.62B."]
      - ["Target return / exit", "Not supportable from public evidence", "Wait for fresher revenue quality, cap-table, and price-discovery data before sizing upside."]
    notes: >-
      Recommendation summary synthesized from retained public profiles and reviews; price discipline
      reflects stale valuation anchors and missing current financial-quality disclosures.
    claimRefs: [CV001, CV002, CV004, CV012, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Read
      - What would change the view
    rows:
      - ["Unified platform breadth across identity, access, and device management", Thesis, "Company-confirmed proof that breadth converts into stronger retention and monetization at current scale."]
      - ["Vendor consolidation and lower-TCO pitch", Thesis, "Evidence that large customers actually replace multiple tools rather than treating JumpCloud as an additional control layer."]
      - ["Stale valuation anchor with no newer priced public reset", Anti-thesis, "A new round, tender, IPO filing, or credible secondary mark that resets the 2021 Series F benchmark."]
      - ["Federation-heavy CIAM limits and agentic execution risk", Anti-thesis, "Independent proof that enterprise buyers adopt JumpCloud despite those fit limits and that AI features monetize cleanly."]
    notes: >-
      Arguments summarize evidence-backed thesis and anti-thesis points; they are not standalone
      investment advice and still depend on fresh financial and cap-table diligence.
    claimRefs: [CV006, CV007, CV008, CV009, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Platform breadth keeps winning budget consolidation and current revenue is materially above third-party estimates", "$2.2B-$2.6B; roughly preserves the 2021 anchor only if fresh KPIs show durable growth and better-than-feared quality", "AI or multi-product expansion fails to monetize and the old mark remains stale", "Needs a new financing or secondary data point plus stronger revenue-quality disclosure."]
      - [Base, "JumpCloud remains strategically relevant but public evidence still lacks audited revenue quality and new price discovery", "$1.4B-$1.9B; implies a discount to the 2021 mark until investors can verify margin retention and current customer economics", "Investors keep haircutting opaque private software marks and category overlap limits pricing power", "Most likely until management refreshes valuation evidence beyond directory listings."]
      - [Bear, "Product-fit caveats matter more than platform breadth and a new mark clears below the old round", "$0.9B-$1.3B; downside case for a valuation reset if stale private-market pricing and execution risk dominate", "Competitive switching friction, weaker monetization, or a down round expose the 2021 mark as too rich", "Triggered by a discounted financing, weak secondary clearing, or evidence that CIAM and federation buyers choose specialists."]
    notes: >-
      Scenario ranges are heuristic valuation frames anchored to the retained $2.56B-$2.62B 2021
      mark and Compworth's $144.3M revenue estimate; they are not observed market transactions.
    claimRefs: [CV001, CV002, CV004, CV008, CV009, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Breadth and traction support relevance, but stale price discovery and fit limits keep the
      recommendation at track.
    data:
      nodes:
        - id: breadth
          label: Unified identity + device platform
          value: Official platform breadth
          note: Supports premium potential only if customers truly consolidate tools.
        - id: traction
          label: 250k+ organization signal
          value: Adoption evidence
          note: Useful traction indicator, but much of the scale language still traces back to company positioning.
        - id: anchor
          label: 2021 Series F still anchors the mark
          value: $2.56B-$2.62B
          note: Retained 2026 profiles still point back to the September 2021 round.
        - id: uncertainty
          label: Current KPIs remain incomplete
          value: '$144.3M revenue estimate; 979-1,098 employee reads'
          note: Third-party estimates help frame the case but do not fully verify revenue quality or growth.
        - id: downside
          label: Fit and execution caveats
          value: Federation / agentic risk
          note: Independent reviews flag CIAM and switching limitations that can compress buyer appetite.
        - id: recommendation
          label: Track / stretched
          value: Revisit only with lower price or fresher KPIs
          note: Do not underwrite the old private mark until new evidence resets the valuation basis.
      edges:
        - from: breadth
          to: traction
          label: Supports relevance
        - from: traction
          to: anchor
          label: Does not by itself reset valuation
        - from: anchor
          to: uncertainty
          label: Needs fresh KPI proof
        - from: uncertainty
          to: downside
          label: Magnifies downside
        - from: downside
          to: recommendation
          label: Forces price discipline
    approximationNotes: >-
      Flow summarizes valuation logic from retained evidence; it does not imply precise probability
      weights or infer conversion rates between nodes.
    claimRefs: [CV006, CV008, CV010, CV012, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: What would move the call
    body: >-
      A move from track toward buy would require a materially lower entry point than the stale 2021
      anchor or a fresh financing or secondary mark supported by current revenue, retention, margin,
      and cap-table evidence. A move toward avoid would follow a discounted round, weak secondary
      clearing, or stronger proof that federation-heavy and customer-IAM buyers systematically
      choose more specialized alternatives.
    claimRefs: [CV008, CV009, CV012, CV013, CV014]
