company:
  name: "JumpCloud"
chapter:
  number: 1
  title: "Company Overview"
  summary: "JumpCloud still presents as a late-private identity and device-management platform company whose public valuation anchor remains its September 2021 Series F, even as 2026 company materials reposition the product around agentic identity. The retained evidence supports core identity, product, and milestone facts, but current revenue, profitability, paying-customer mix, and ownership terms remain materially undisclosed."
sections:
  - id: "identity-stage"
    title: "Identity, scope, and current stage"
    body: |-
      JumpCloud's identity is well established across company and independent profiles even if some metadata disagree at the margin. Retained sources converge on Louisville, Colorado as headquarters, 2012 as the founding year, and 2013 as the formal market launch. Product positioning has evolved more aggressively than the financing record: company pages now frame JumpCloud as an AI-powered unified IT management platform that secures human, non-human, and agentic identities, while independent descriptions still anchor the business in cloud directory, identity, access, and device management. Public stage evidence remains late private rather than newly financed growth: the latest valuation evidence in retained sources still points back to the 2021 Series F, with no newer priced equity round surfaced in this pool.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007", "CO008"]
    tableRefs: ["TO001"]
  - id: "leadership-stakeholders"
    title: "Leadership, founder continuity, and stakeholder concentration"
    body: |-
      The retained public record is founder-heavy. Rajat Bhargava remains the named CEO in current third-party profiles, and Rajat Bhargava, Greg Keller, and Larry Middle recur as the core founding set across multiple sources. That is useful for continuity, but it also means the chapter cannot fully validate the broader management bench or current board composition from primary materials in this pool. Stakeholder visibility is stronger on financing participants than on governance rights: Sapphire Ventures and BlackRock are the most visible late-stage capital anchors, General Atlantic and other crossover investors remain named, and the Google Workspace partnership is strategically important because it supports JumpCloud's modern-Active-Directory-replacement narrative. Diligence should therefore test whether founder reliance and investor influence are matched by a deeper independently verifiable leadership bench.
    claimRefs: ["CO001", "CO007", "CO008", "CO010", "CO013"]
    tableRefs: ["TO002", "TO003"]
  - id: "funding-milestones-risks"
    title: "Funding history, milestone cadence, and adverse context"
    body: |-
      Funding and scale evidence are directionally positive but not clean enough to treat as precision facts. JumpCloud's own materials only claim more than $400 million raised, while two retained third-party trackers disagree on whether total disclosed funding is roughly $408 million or $423 million-plus and on whether the latest public valuation should be read as $2.62 billion or $2.63 billion. That makes the 2021 Series F the last public pricing anchor, not a current fair-value proof point. Milestones after that round show continued product expansion: MYKI in 2022, Google Workspace in 2023, Resmo in 2024, and Agentic IAM in 2026. The most important negative marker is the July 2023 network intrusion, which is a real operational scar even if retained sources do not show a lasting customer-count reset.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO011", "CO012", "CO013", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
