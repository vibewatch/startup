schemaVersion: "report-v2"
artifact: financials
slug: jumpcloud
runDate: 2026-10-18
company:
  name: JumpCloud
chapter:
  number: 4
  title: Financials
  summary: >-
    JumpCloud has a legible recurring-software model built around per-user packages,
    modular add-ons, and quote-only expansion tiers, but public evidence does not
    establish realized pricing or current revenue quality. The assigned evidence
    provides a historical third-party ARR estimate and financing anchor while leaving
    gross margin, retention, CAC, burn, cash, runway, and debt unavailable.
sections:
  - id: revenue-model-and-pricing
    title: Recurring revenue architecture and list pricing
    body: >-
      JumpCloud monetizes a unified directory, access, and device-management platform
      rather than hardware or transaction volume. Public pricing reviewed in August
      2026 shows entry packages billed per user per month, a menu of separately priced
      modules, and larger Platform tiers that move behind a sales conversation. A
      30-day full-feature trial supplies a product-led entry point, while the quote-only
      tiers imply sales-assisted expansion for larger or more complex accounts. This
      structure creates seat, module, support, and package-upgrade levers, but list
      prices are not realized ASP: the sources do not disclose negotiated discounts,
      contract duration, revenue mix, attach rates, or revenue-recognition policy.
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Public traction is directional, not an audited revenue base
    body: >-
      Sacra estimates that JumpCloud reached $105 million of ARR in 2023, up 31%
      from $80 million in 2022. That metric is ARR, not GAAP revenue, and it is both
      third-party estimated and historical relative to the October 2026 run date.
      More recent demand signals are product-adoption proxies rather than financial
      disclosure: a JumpCloud partner repeats the company's count of more than
      250,000 organizations across 160-plus countries, while Capterra reports favorable
      reviewer scores for secure login, authentication, and data security. Neither
      source identifies the current number of paying customers, ARR concentration,
      free-to-paid conversion, cohort retention, or revenue by customer segment.
    claimRefs: [CI002, CI011, CI012]
  - id: capital-adequacy-and-unit-economics
    title: Financing history does not establish capital adequacy
    body: >-
      Tracxn reports $408 million of cumulative funding across 11 rounds and identifies
      the September 2021 Series F as $225 million at a $2.62 billion post-money
      valuation. Those are historical financing facts, not evidence of cash still
      available in 2026. JumpCloud's February 2026 announcement of a venture arm and
      first investment in Tofu is a current capital-allocation signal, but the company
      disclosed neither the program size nor the investment amount. The assigned
      sources provide no current cash balance, burn, runway, debt or covenant schedule,
      so they cannot establish the next-round trigger or financing dependency.
    claimRefs: [CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The revenue mechanism is plausible for durable recurring software: customers can
      begin with a focused per-user package, add modules, and graduate to broader
      negotiated tiers as their identity and device estate grows. The adverse read is
      that this same modularity can create renewal friction. Siit's review reports
      complaints about roughly 10% renewal increases, while Access Security Hub notes
      that total cost varies with users, devices, and enabled modules. Without realized
      discounting, gross margin, support burden, CAC, payback, churn, NRR, cash, and
      runway, however, neither operating leverage nor financing resilience is
      underwriteable. The financial stance is therefore positive on monetization
      design but blocked on revenue quality, margin path, and capital adequacy.
    claimRefs: [CI009, CI010, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public status
      - Revenue-quality read
      - Diligence ask
    rows:
      - [Device Management, "Standalone device-management package", "Per user / month", "$9 annual-billing list price; $11 monthly", "Recurring seat revenue; realized ASP unknown", "Provide billed ARR, discounts, and renewal rate for this package"]
      - [SSO, "Single sign-on package with MFA access and Password Manager", "Per user / month", "$11 annual-billing list price; $13 monthly", "Recurring seat revenue with bundled features", "Provide package ARR, gross retention, and support cost"]
      - [Device Identity Management, "Device management plus identity controls", "Per user / month", "$13 annual-billing list price; $15 monthly", "Higher list price suggests bundle expansion", "Provide upgrade conversion and cohort NRR"]
      - [A la carte modules and support, "Optional capabilities layered onto packages", "Per user / month", "$2-$5 annual and $3-$6 monthly across disclosed modules", "Visible expansion lever; attach rate unknown", "Provide module attach, downgrade, and gross-margin data"]
      - [Platform tiers and channel contracts, "Broader suites sold through sales", "Negotiated contract", "Platform Essentials, Platform, Platform Prime, MSP, and partner rates are not public", "Likely larger contracts, but pricing and mix are opaque", "Provide enterprise and MSP rate cards, discounts, and concentration"]
    notes: >-
      Values are August 2026 public list-price transcriptions, not realized revenue,
      net pricing, margin, or revenue-mix disclosures.
    claimRefs: [CI001, CI003, CI004, CI005]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing element
      - Public value or term
      - Billing basis
      - Qualification
      - Underwriting implication
    rows:
      - [Device Management, "$9 annual / $11 monthly", "Per user / month", "List price; discounts undisclosed", "Creates a low-end package entry point"]
      - [SSO, "$11 annual / $13 monthly", "Per user / month", "Includes SSO, MFA access, and Password Manager", "Bundles multiple access functions"]
      - [Device Identity Management, "$13 annual / $15 monthly", "Per user / month", "Combines device and identity management", "Supports package upsell"]
      - [A la carte modules, "$2-$5 annual / $3-$6 monthly", "Per user / month", "Range spans disclosed modules; some capabilities are package-only", "Adds expansion revenue but increases bill complexity"]
      - [Platform Essentials, "Contact sales", "Negotiated contract", "300-user maximum", "Sales-assisted pricing begins before the largest tiers"]
      - [Trial and free tier, "30-day unrestricted trial; no permanent free tier for new accounts", "Time-limited trial", "Legacy free tier applies only to older accounts", "Product-led evaluation does not imply free-to-paid conversion"]
    notes: >-
      The publisher states that rates were verified in August 2026; annual billing
      can save up to 18%, but realized discounts and contract terms remain private.
    claimRefs: [CI003, CI004, CI005, CI006, CI009]
  - id: TI003
    title: Unit economics and capital adequacy table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR", "$105M estimated for 2023", Low, "Directional scale and growth anchor; not revenue", "Provide audited revenue, board-reported ARR, and an ARR-to-revenue bridge through 2026"]
      - ["ARR growth", "31% estimated for 2023 versus $80M in 2022", Low, "Historical momentum proxy only", "Provide monthly new, expansion, contraction, and churn ARR through 2026"]
      - ["Paying-customer count and concentration", null, Low, "Required to calculate ARPA and concentration", "Provide current paying logos, ARR bands, and top-10 / top-20 concentration"]
      - ["Gross margin and service-delivery cost", null, Low, "Determines software quality and support drag", "Provide hosting, support, professional-services, and channel costs by segment"]
      - ["CAC, payback, GRR, and NRR", null, Low, "Tests whether modular expansion offsets acquisition and churn", "Provide cohort economics by direct, enterprise, and MSP motion"]
      - ["Historical funding", "$408M over 11 rounds; latest disclosed round $225M in Sep 2021", Medium, "Capital raised is not cash available", "Reconcile all financing proceeds to current cash, acquisitions, and cumulative burn"]
      - ["Cash, burn, runway, and debt", null, Low, "Determines financing dependency and next-round timing", "Provide cash, monthly burn, runway, debt, leases, covenants, and minimum-cash policy"]
    notes: >-
      Null values mean the assigned public evidence does not disclose the metric; they
      are not zeros. ARR is retained with its original metric name and is not relabeled
      as accounting revenue.
    claimRefs: [CI002, CI012, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer identity and device workloads can monetize through seats, modules,
      support, and negotiated tiers, while gross-profit conversion remains undisclosed.
    data:
      nodes:
        - id: managed-estate
          label: Managed users and devices
          note: The customer workload that establishes the billing base
        - id: entry-package
          label: Per-user entry package
          note: Device Management, SSO, or Device Identity Management
        - id: module-attach
          label: A la carte module attach
          note: Additional identity, access, device, SaaS, and support capabilities
        - id: package-upgrade
          label: Broader platform tier
          note: Platform packages move to contact-sales pricing
        - id: contracted-arr
          label: Contracted recurring value
          note: Public sources do not disclose package mix or realized discounting
        - id: gross-profit-conversion
          label: Gross-profit conversion
          note: Hosting, support, services, and channel costs are not publicly quantified
      edges:
        - from: managed-estate
          to: entry-package
          label: Seats enter a per-user package
        - from: entry-package
          to: module-attach
          label: Optional modules expand the account
        - from: entry-package
          to: package-upgrade
          label: Larger needs move to broader tiers
        - from: module-attach
          to: contracted-arr
          label: Add-ons can raise recurring contract value
        - from: package-upgrade
          to: contracted-arr
          label: Negotiated tiers can raise contract scope
        - from: contracted-arr
          to: gross-profit-conversion
          label: Cost-to-serve determines gross profit
    approximationNotes: >-
      This is a qualitative mechanism, not a measured funnel or waterfall. No conversion
      rate, package mix, ARR contribution, gross margin, or cash conversion is inferred.
    claimRefs: [CI001, CI007, CI008, CI016]
callouts:
  - calloutType: risk
    title: Historical funding is not current liquidity
    body: >-
      The $408 million funding total and 2021 Series F identify financing history only.
      Without current cash, burn, debt, or commitments, they cannot support a runway claim.
    claimRefs: [CI013, CI014, CI015]
  - calloutType: insight
    title: Packaging is clearer than financial performance
    body: >-
      Public list prices explain how seats and modules can expand contract value, but
      realized pricing, retention, margin, and cash conversion remain private.
    claimRefs: [CI003, CI004, CI005, CI008, CI016]
