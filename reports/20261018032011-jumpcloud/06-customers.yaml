schemaVersion: report-v2
artifact: customers
slug: jumpcloud
runDate: 2026-10-18
company:
  name: JumpCloud
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence supports broad top-of-funnel adoption and clear fit with
    IT-led buyers, MSPs, and hybrid-IT environments, but it is much stronger on breadth
    than on durability. Gartner review volume and a few named outcome anecdotes support
    active usage, while retention, paying-customer mix, and concentration remain largely
    undisclosed in the assigned public pool.
sections:
  - id: customer-footprint
    title: Customer footprint and segment fit
    body: >-
      The public footprint described in the assigned pool is broad, but it is not evenly
      evidenced across buyer segments. Company-originated or company-relayed sources frame
      JumpCloud as serving more than 250,000 organizations across over 160 countries,
      while independent reviews repeatedly place the product with IT-led teams replacing
      fragmented directory, access, and device stacks. The most consistent personas are IT
      administrators, security/identity operators, and MSPs managing mixed Windows,
      macOS, Linux, and Android estates. The segment story is therefore strongest for
      infrastructure-centric buyers rather than line-of-business owners, and public
      evidence still does not separate free usage, paid deployments, or channel-led
      accounts within that headline organization count.
    claimRefs: [CU001, CU002, CU003, CU004, CU012, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-signals
    title: Adoption signals and proof of live use
    body: >-
      Adoption proof is strongest where third-party review platforms and partner-mediated
      customer stories overlap. Gartner surfaces both a product-level review corpus and a
      SaaS-management-specific rating profile, which together show current user activity,
      positive overall sentiment, and enough detail to infer live rather than purely pilot
      usage. Named customer proof is thinner: the best public examples in the assigned
      pool are Cloudfresh's references to Superlógica and Solidgate, plus an anonymized
      Gartner reviewer describing several months of production use of the SaaS management
      module. Those datapoints are useful, but they do not establish broad, independently
      verifiable production depth across enterprise accounts.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002, TU003]
  - id: expansion-and-durability
    title: Expansion motion is visible; durability is not
    body: >-
      The assigned evidence suggests JumpCloud expands beyond core directory replacement
      into adjacent workflows such as SaaS discovery, access requests, de-provisioning,
      and broader endpoint control. That supports a land-and-expand story inside IT
      operations: customers can start with directory or SSO needs and later consolidate
      more access and device functions. However, the public pool does not disclose the
      retention metrics that would show whether this expansion path translates into sticky
      recurring revenue. No retained source provides NRR, GRR, churn, renewal rates,
      contract duration, or reliable direct-versus-channel mix, so durability remains an
      evidence gap rather than a proved strength.
    claimRefs: [CU007, CU012, CU013, CU014]
  - id: limitations-and-risk
    title: Customer-quality limits and concentration risk
    body: >-
      Customer-quality evidence has three limits. First, independent reviews say the
      platform works best where identity and device control are tightly coupled, and is
      less compelling for federation-heavy CIAM or pure identity-governance use cases.
      Second, the most specific public outcome cases are partner-mediated or anonymized,
      which weakens reference quality even when the reported results are positive. Third,
      MSPs appear frequently as a route-to-market and operating persona, but public
      sources do not quantify how much revenue or concentration sits in any one channel,
      customer cohort, or top account. That leaves real procurement and concentration risk
      unresolved.
    claimRefs: [CU008, CU011, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Supported use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - SMB / early-scale IT teams
        - IT admin or IT lead buys and operates; employer pays
        - Replace separate directory, SSO, and device tools with one console
        - Expert Insights cites a free ten-day trial for ten users and ten devices
        - Supports low-friction initial adoption and self-serve evaluation
        - Free-to-paid conversion and paid-seat expansion are not disclosed
      - - Mid-market organizations
        - IT/security admins are primary users; company pays
        - Centralize user provisioning, access policies, and device control
        - Expert Insights recommends the product for mid-sized organizations
        - Seat-based platform scope suggests room for cross-module expansion
        - No public renewal, churn, or contract-length disclosure
      - - Hybrid and enterprise environments
        - Central IT or security team sponsors; enterprise payer
        - Manage mixed OS fleets and integrate HRIS, cloud, and legacy systems
        - Security Stack and JumpCloud's own materials position the platform from startups through enterprises
        - Higher strategic value where directory, access, and endpoint control converge
        - Top-account concentration and direct-vs-channel mix are not public
      - - MSP-managed customer estates
        - MSP operates day to day; end customer ultimately pays
        - Run access and device controls across multiple client environments
        - Gartner vendor details and Security Stack explicitly reference MSPs
        - Adds a partner-led distribution path beyond direct IT sales
        - MSP revenue share and partner concentration are undisclosed
    notes: >-
      Segments reflect publicly described fit and operating personas rather than audited
      revenue segmentation; null economics, retention, and concentration detail remain a
      diligence gap.
    claimRefs: [CU002, CU003, CU004, CU012, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Organizations served
        - 250,000+ organizations across 160+ countries
        - "2026-09-18"
        - Cloudfresh citing the company
        - medium
        - Broad global footprint and large top-of-funnel reach
        - Paying customers, active admins, and revenue per organization are not disclosed
      - - Gartner SaaS management ratings
        - 4.5 average from 48 all-time ratings; 56% 5-star, 42% 4-star, 2% 3-star
        - 2026-10-18 access
        - Gartner Peer Insights
        - medium
        - Positive review signal for the SaaS-management-specific surface
        - Voluntary-review sample size and retention by cohort are unknown
      - - Gartner product review corpus
        - 160 reviews
        - "2026-08-19"
        - Gartner Peer Insights
        - medium
        - Larger review footprint for the broader product family
        - No split by paid tier, module, or deployment maturity
      - - Named customer outcome
        - Superlógica reported 89% fewer security incidents
        - "2026-09-18"
        - Cloudfresh
        - medium
        - Suggests measurable security ROI in at least one live deployment
        - Partner-mediated example with no published seat count or baseline period
      - - Named customer outcome
        - Solidgate reported onboarding 3x faster
        - "2026-09-18"
        - Cloudfresh
        - medium
        - Suggests operational ROI and workflow expansion value
        - Partner-mediated example with no contract or retention disclosure
    notes: >-
      Trajectory evidence mixes company-claimed breadth, voluntary review counts, and
      partner-mediated customer outcomes; none of the retained sources reveals paid-account
      denominator, cohort retention, or direct revenue contribution by segment.
    claimRefs: [CU001, CU005, CU006, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Superlógica
        - Brazilian fintech
        - Consolidated identity and access controls on JumpCloud
        - Production customer case
        - 89% fewer security incidents
        - Partner-issued proof with no public contract size, module mix, or measurement window
      - - Solidgate
        - Payments / fintech
        - Onboarding and access workflow improvement through Cloudfresh-assisted deployment
        - Production customer case
        - Onboarding 3x faster
        - Partner-issued proof with no published seat count, ARR impact, or renewal history
      - - Anonymous Gartner reviewer
        - 50M-1B USD IT services company
        - SaaS management module alongside the core directory platform for shadow-IT discovery and workflow automation
        - Appears to be live use after a few months in market
        - Surfaced unexpected SaaS usage and automated straightforward access-request and de-provisioning flows
        - Customer is unnamed, and the same review flags app-recognition and real-time data limitations
    notes: >-
      This is a partial sample of public customer proof available in the assigned prefetched
      pool; the strongest named examples are partner-mediated and the most detailed direct
      usage story is anonymized.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named or concretely describable customer-proof items available in the
        assigned successful prefetched pool as of the 2026-10-18 run, including partner
        case references and Gartner-anonymized peer reviews.
    claimRefs: [CU007, CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to an IT-led journey that starts with directory replacement
      and can expand into broader device, access, and SaaS-governance workflows, but
      leaves renewal quality largely opaque.
    data:
      items:
        - label: Directory sprawl trigger
          actor: IT lead or MSP
          touchpoints:
            - Mixed-OS fleet and legacy directory pain drive initial evaluation
            - Buyers look for one place to manage identity, devices, and access
        - label: Trial and first deployment
          actor: Admin team
          touchpoints:
            - Free ten-day trial covers ten users and ten devices
            - Initial proof point is easier setup than stitching separate tools
        - label: Core identity control
          actor: IT operations
          touchpoints:
            - Provisioning, SSO, MFA, and lifecycle management become daily workflows
            - Windows, macOS, Linux, and Android support broadens applicability
        - label: Device and policy consolidation
          actor: IT or security admin
          touchpoints:
            - Single-console device and access policies reduce point-tool sprawl
            - Integrations with HRIS, cloud apps, and legacy systems raise switching value
        - label: Expansion into adjacent modules
          actor: Security and IT ops
          touchpoints:
            - SaaS discovery surfaces shadow IT
            - Access-request and de-provisioning workflows extend use beyond core directory
        - label: Renewal and scale decision
          actor: Security leadership
          touchpoints:
            - Fit remains strongest for IT-led environments and MSP-managed estates
            - Public evidence does not show NRR, GRR, churn, or concentration by channel
    approximationNotes: >-
      Stage order reflects the common sequence implied by public sources; it does not imply
      conversion rates because the sources do not provide a comparable cohort denominator.
    claimRefs: [CU002, CU003, CU004, CU007, CU011, CU012, CU014]
callouts:
  - calloutType: insight
    title: Breadth is visible; durability is not
    body: >-
      JumpCloud has enough review density and customer anecdotes to support real adoption,
      but the retained public pool still cannot answer the core durability questions that
      matter for underwriting customer quality.
    claimRefs: [CU001, CU005, CU006, CU014]
  - calloutType: risk
    title: Proof quality skews toward IT operators, not procurement decision-makers
    body: >-
      The best public evidence comes from peer reviewers, partner case stories, and
      product-fit reviews, so buyer depth and concentration by paid enterprise account
      remain materially under-disclosed.
    claimRefs: [CU003, CU009, CU010, CU013, CU014]
