evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, gross margin, burn rate, runway, and profitability disclosures.
    whyItMatters: >-
      Without current financial disclosures, the chapter can anchor identity and milestones but cannot validate
      operating scale or unit quality.
    diligencePath: >-
      Request board materials or a dataroom KPI pack with revenue, margin, burn, and retention definitions tied to the
      latest quarter.
    relatedQuestionRefs:
      - QO004
  - type: stale
    severity: material
    topic: customer-mix
    missingEvidence: A current paying-customer count, free-to-paid conversion data, and concentration by customer segment or channel.
    whyItMatters: The official 250,000+ organization figure does not reveal monetized customer density or revenue concentration.
    diligencePath: >-
      Ask management for current paid-customer counts, cohort conversion, and ARR concentration by direct versus partner
      channels.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance-and-financing-terms
    missingEvidence: >-
      Official confirmation of current board seats, observer rights, secondary liquidity history, and any live debt or
      credit facilities.
    whyItMatters: >-
      Public investor names alone do not show who controls governance, downside terms, or post-2021 capital structure
      risk.
    diligencePath: >-
      Request the current cap table, board schedule, investor rights agreement summary, and any debt or warehouse
      agreements.
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: primary-governance-sources
    missingEvidence: A retained official leadership or governance page naming the current broader executive team.
    whyItMatters: >-
      Founder continuity is visible, but management-bench quality cannot be fully underwritten from retained source text
      alone.
    diligencePath: Confirm whether JumpCloud publishes an executive-team page or supply the latest org chart during diligence.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: sizing-model
    missingEvidence: >-
      Segment-level paid-customer counts, ACV distribution, and channel mix needed to convert public adoption proxies
      into a real SAM or SOM.
    whyItMatters: >-
      Without monetized cohort data, valuation work can describe demand direction but cannot bridge installed-base
      breadth into revenue-backed market capture.
    diligencePath: Request management cohort cuts by SMB, mid-market, MSP, enterprise, geography, and AI-agent attach rate.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: Independent buyer-budget studies or procurement examples showing who actually owns the spend by segment.
    whyItMatters: >-
      Budget ownership shapes sales cycle length, competitive set, and whether consolidation benefits translate into
      budget release.
    diligencePath: >-
      Review public procurement records, customer interviews, or win/loss notes that tie deployments to named IT,
      security, or platform budgets.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Apples-to-apples realized enterprise contract pricing, required module mix, and discount structure for JumpCloud,
      Okta, Entra ID, and Ping/ForgeRock.
    whyItMatters: >-
      Public list prices and quote ranges do not show total cost once governance, endpoint, support, and hybrid features
      are added.
    diligencePath: >-
      Collect current enterprise quotes or procurement records for a common seat count and required feature set, then
      normalize add-on modules and contract minimums.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: competitor-scale-and-funding
    missingEvidence: >-
      Current, comparable customer scale, revenue, and financing evidence for JumpCloud and each private or public
      competitor in the assigned set.
    whyItMatters: >-
      Product positioning alone cannot establish competitive scale, financial capacity, or the durability of investment
      in roadmap and distribution.
    diligencePath: >-
      Collect current filings for public competitors and primary financing or audited operating disclosures for private
      companies, preserving each metric's period and denominator.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: cost-structure
    missingEvidence: >-
      Gross margin, hosting cost, support burden, professional-services cost, channel economics, working capital, and
      capex
    whyItMatters: These inputs determine whether recurring contract value converts into durable gross profit and operating leverage.
    diligencePath: Request audited financials and a segment-level cost-of-revenue bridge for direct, enterprise, and MSP customers.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: CAC, CAC payback, gross retention, net revenue retention, logo churn, module attach, and cohort expansion
    whyItMatters: List pricing and historical ARR cannot establish sales efficiency or revenue durability without cohort economics.
    diligencePath: Request monthly SaaS KPI cohorts by customer segment, acquisition channel, package, and geography.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, runway, debt, leases, covenants, venture commitments, and next-round
      trigger
    whyItMatters: Funding raised is not cash available, so financing dependency cannot be assessed from historical rounds.
    diligencePath: Request the latest board finance pack, treasury schedule, debt documents, and an 18-month cash forecast.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent GitHub package forum release or practitioner-community telemetry showing external builder adoption of
      JumpCloud APIs scripts or agentic tooling.
    whyItMatters: >-
      The product thesis includes extensibility and automation, but the current pool proves documentation and support
      surfaces rather than real external developer usage or release cadence.
    diligencePath: >-
      Request public changelog links API or SDK usage metrics marketplace or forum activity and customer engineering
      references; if no public proxy exists, document that absence explicitly in the next refresh.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: regulated-agentic-compliance
    missingEvidence: Public FedRAMP GovCloud EU AI governance or similar regulated-environment scope for Agentic IAM.
    whyItMatters: >-
      Agentic controls are now part of the product story, but regulated buyers cannot judge deployment readiness from
      launch language alone.
    diligencePath: >-
      Ask product and security leadership for roadmap dates planned attestations data-flow diagrams and customer
      commitments tied to Agentic IAM.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: reliability-telemetry
    missingEvidence: Status-page history SLA terms and post-2023 incident reliability data tied to directory device and agent services.
    whyItMatters: >-
      Architecture diligence needs objective uptime and incident evidence before treating this control plane as a
      consolidation layer for identity and endpoints.
    diligencePath: >-
      Collect status-history exports SLA language and postmortems or customer references that quantify service
      availability and operational response.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Segment-level NRR, GRR, churn, renewal rate, contract duration, and cohort retention data for direct and
      channel-led customers.
    whyItMatters: >-
      Public adoption breadth does not prove recurring-revenue durability or expansion quality without retention and
      renewal evidence.
    diligencePath: >-
      Request board-ready cohort retention tables and contract-term summaries split by direct, MSP, and enterprise
      segments.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Paying-customer count, top-customer share, MSP/channel revenue mix, and any concentration thresholds tied to
      renewals or gross retention.
    whyItMatters: >-
      A broad organization count can still mask partner dependence or revenue concentration in a small number of paying
      accounts.
    diligencePath: >-
      Obtain customer concentration schedules, channel ARR mix, and the top-10 customer revenue share from management or
      data room exports.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: >-
      Direct customer-authored case studies or procurement records with named production deployments, scope, timing, and
      measurable outcomes.
    whyItMatters: >-
      Current named proof is partner-mediated or anonymized, which limits confidence in how repeatable the reported
      outcomes are across the broader customer base.
    diligencePath: >-
      Collect direct reference calls or public procurement/customer-presentation evidence across SMB, mid-market,
      enterprise, and MSP channels.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: ai-governance-compliance
    missingEvidence: >-
      Primary trust-center or regulatory documentation mapping Agentic IAM to regulated-buyer requirements such as
      public-sector architecture or AI-governance controls.
    whyItMatters: >-
      Without primary compliance evidence, investors cannot tell whether new AI-agent features accelerate enterprise
      adoption or delay regulated deals.
    diligencePath: >-
      Request trust-center exports, public-sector roadmap, AI-risk classification memo, and regulated-customer
      references tied to Agentic IAM.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: implementation-dependence
    missingEvidence: Quantified partner concentration, services attach rate, deployment duration, and escalation SLA data.
    whyItMatters: >-
      If rollout quality depends heavily on partners or services labor, margin durability and enterprise expansion may
      be weaker than feature breadth suggests.
    diligencePath: >-
      Ask management for partner-sourced ARR mix, services attach, deployment timelines, and implementation escalation
      metrics.
    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Post-2023 incident metrics, independent audit evidence, and recent uptime or incident-rate disclosure.
    whyItMatters: >-
      Security credibility is central to identity vendors, and a historical intrusion does not prove present-day
      assurance for large buyers.
    diligencePath: >-
      Review the incident postmortem, third-party audit results, status or uptime history, and current SOC 2 or ISO
      evidence.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Current ARR or revenue, gross margin, net retention, burn, and paying-customer concentration data.
    whyItMatters: >-
      Without current revenue quality metrics, the old private valuation anchor cannot be translated into a confident
      return case.
    diligencePath: Request current board or lender KPI packs and customer-cohort reporting from management.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: Current cap-table terms, liquidation preferences, option-pool sizing, and any secondary transaction pricing.
    whyItMatters: Entry discipline depends on downside economics as much as headline enterprise value.
    diligencePath: Obtain the latest cap table, investor-rights summary, and any recent tender or secondary-clearing documentation.
    relatedQuestionRefs:
      - QV009
  - type: conflicting-data
    severity: material
    topic: funding-and-headcount
    missingEvidence: A reconciled financing history and a management-confirmed current employee count.
    whyItMatters: >-
      Public directories disagree on both total capital raised and current workforce scale, reducing confidence in
      precision valuation work.
    diligencePath: Reconcile third-party profiles against management financing history and current HRIS or payroll exports.
    relatedQuestionRefs:
      - QV002
      - QV009
  - type: stale
    severity: material
    topic: price-discovery
    missingEvidence: A post-2021 financing, tender, IPO filing, or other fresh price-discovery event.
    whyItMatters: The report can frame the valuation as stretched, but not prove what today's market-clearing price would be.
    diligencePath: Monitor new financing disclosures, secondary-market indications, or formal IPO preparation materials.
    relatedQuestionRefs:
      - QV006
      - QV009
