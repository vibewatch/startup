      - number: '2.3'
        title: 规模估算视角、需求驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              公开 市场规模测算 仍然 proxy-based 而 超过 与收入挂钩. JumpCloud's own 2026 G2 releases 提供 最强 activity signals: Fall report
              是 based 在 936 经验证评价, 12.2% 的 评价 described replacing 独立工具 与 a 单一平台, 、 68% 的 JumpCloud 评价 mentioned 设备控制, 而
              Spring release said 4,000+ verified 用户 评价 supported leadership 覆盖 150 类别. 那些 data points 支持 a 整合驱动因素, 不 a
              TAM/SAM/SOM dollar model. 可触达市场叙事 是 也 broadening 进入 非人类身份 、 AI 代理治理, which helps narrative 围绕 adjacencies,
              但 变现 的 该 adjacency 是 不 公开地 broken out. Constraints 是 同样 重要: Access Security Hub says JumpCloud 是 "不 a pure
              企业级 IAM 套件”；CyberSecurityO 表示，员工数超过约 500–1,000 人且治理或 PAM 需求复杂的组织，可能需要补充工具。 用于 估值, 公开 证据 支持 a 可信的整合论点 更多 超过
              a 来源-backed bridge 从 installed-base 规模 至 monetized SAM 或 SOM.
