  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 覆盖面和牵引力支持其相关性，但陈旧的价格发现和适配局限使建议维持为跟踪。
    data:
      nodes:
        - id: breadth
          label: 统一身份 + 设备平台
          value: Official platform breadth
          note: 只有在客户确实整合工具的情况下，才支持溢价潜力。
        - id: traction
          label: 250k+组织信号
          value: Adoption evidence
          note: 这是有用的牵引力指标，但许多规模表述仍可追溯到公司的定位叙事。
        - id: anchor
          label: 2021 年 Series F 仍是估值锚点
          value: $2.56B-$2.62B
          note: 保留的 2026 年资料仍指向 2021 年 9 月的那轮融资。
        - id: uncertainty
          label: 当前 KPI 仍不完整
          value: $144.3M revenue estimate; 979-1,098 employee reads
          note: 第三方估算有助于构建判断，但无法完全验证收入质量或增长。
        - id: downside
          label: 适配与执行方面的保留意见
          value: Federation / agentic risk
          note: 独立评测指出 CIAM 和切换方面的局限，可能压缩买家意愿。
        - id: recommendation
          label: 跟踪 / 估值偏高
          value: Revisit only with lower price or fresher KPIs
          note: 在新证据重置估值基础前，不要把旧的私有市场估值计入投资判断。
      edges:
        - from: breadth
          to: traction
          label: 支持相关性
        - from: traction
          to: anchor
          label: 本身不能重置估值
        - from: anchor
          to: uncertainty
          label: 需要新的 KPI 证据
        - from: uncertainty
          to: downside
          label: 放大下行风险
        - from: downside
          to: recommendation
          label: 迫使价格纪律
    approximationNotes: 流程总结了保留证据支持的估值逻辑；它不代表精确的概率权重，也没有推断节点之间的转化率。
