  - id: TV003
    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 多头
        - 平台覆盖面持续赢得预算整合需求，且当前收入显著高于第三方估算
        - $2.2B-$2.6B；只有新鲜 KPI 显示增长持久且收入质量好于预期，才大致守得住 2021 年锚点
        - AI 或多产品扩张无法变现，旧估值仍然陈旧
        - 需要新的融资或二级市场数据点，以及更充分的收入质量披露。
      - - 基准
        - JumpCloud 在战略上仍有相关性，但公开证据仍缺少经审计的收入质量和新的价格发现
        - $1.4B-$1.9B；在投资者能够验证利润率留存和当前客户经济性前，意味着相对 2021 年估值打折
        - 投资者继续压低不透明的私有软件估值，品类重叠限制定价能力
        - 在管理层把估值证据更新到目录列表之外前，这是最可能的情景。
      - - 空头
        - 产品适配问题比平台覆盖面更重要，新估值低于上一轮
        - $0.9B-$1.3B；如果陈旧的私募市场定价和执行风险占上风，这是估值重置的下行情景
        - 竞争性切换阻力、更弱的变现能力或下轮融资，会暴露 2021 年估值过高
        - 由折价融资、疲弱的二级市场成交，或 CIAM 和联合身份买家选择专业厂商触发。
