      - number: '2.2'
        title: 买方、用户、付费方与渠道模式
        blocks:
          - type: paragraph
            body: >-
              买方证据 points 至 IT 主导的采用 而 超过 业务线拉动. Access Security Hub says JumpCloud 是 最佳 用于 "IT-driven 团队 managing 用户 +
              设备," 、 CyberSecurityO frames 核心买方 作为 SMB, startup, 、 cloud-native 组织 该 want 至 centralize 用户, 设备, 、
              authentication 没有 传统目录基础设施. MSPs 也 matter 因为 CyberSecurityO describes JumpCloud 作为 a way 至 manage 多个
              client environments 从 a 单一多租户控制台. practical 用户 base 是 员工, administrators, 、 受管终端, 而 付费方 是 typically IT 或
              身份 budget owner trying 至 replace 多个 adjacent 工具 与 一个 console.               公开来源显示其覆盖初创公司、企业和 MSP
              environments, 但 they do 不 reveal how much 的 该 footprint 是 付费, 合作伙伴促成, 或 concentrated 在 任何 一个 细分.
            claimRefs:
              - CM004
