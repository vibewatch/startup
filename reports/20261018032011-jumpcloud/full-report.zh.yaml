  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              assigned 证据 consistently places JumpCloud 在 a bundled 控制-plane category 而 超过 a point IAM niche.
              JumpCloud's own Cloud 目录 page says 平台 "unifies 身份与设备管理 进入 a central engine," 而 Security Stack 、 Intellyx
              describe same cross-OS, mixed-environment scope. most direct 现状替代方案 是 仍 legacy Active 目录 、 its adjacent
              admin 工具栈: CyberSecurityO says JumpCloud addresses 组织, 尤其 SMBs, startups, 、 cloud-native 公司, 该 有 没有
              在-premises Active 目录 、 do 不 want 至 build 一个, 、 Security Stack calls it a cloud-based alternative 至
              Microsoft Active 目录. 该 boundary 包括 目录, authentication, provisioning, 、 设备控制工作流, 但 it does 不 automatically
              包括 深入 CIAM, 大规模联合身份项目, 或 独立的 IGA/PAM budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
              - CM012
