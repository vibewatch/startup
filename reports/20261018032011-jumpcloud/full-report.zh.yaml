      - number: '3.2'
        title: 能力、定价与迁移权衡
        blocks:
          - type: paragraph
            body: >-
              JumpCloud's wedge 是 运营覆盖面 inside 一个 subscription: 目录, MFA, SSO, LDAP, RADIUS, 设备 管理, 、 patching. 该 breadth
              是 最强 其中 买方 want 一个 平台 覆盖 混合操作系统 、 do 不 want 至 assemble 独立工具. 公开 第三方 comparisons nevertheless 显示 清晰
              boundaries. Okta retains bigger SaaS 集成 catalog 、 stronger federation 或 CIAM depth; Microsoft Entra ID 是
              更多 compelling inside Microsoft 365, Defender, 、 hybrid Active 目录 estates; Ping Identity 、 ForgeRock 保持 更好
              更适合需要 API-centric 安全、深度 orchestration 或本地及混合部署灵活性的企业。定价信号 reinforce segmentation. JumpCloud's published
              free tier 、 用户-based bundles lower 评估门槛, 而 Ping 、 ForgeRock 保持 报价驱动 、 Okta commonly expands 在 价格 作为 治理 或
              其他 modules 是 added. 该 leaves JumpCloud well placed 用于 bottom-up IT 采用, 但 更少 obviously advantaged 在 采购主导
              大型企业转型.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
