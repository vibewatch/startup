              detail: 引用证据属于历史信息，但由于当前结果指标在此处没有公开，安全尽调仍然重要。
              tone: warning
            - label: 高
              detail: 如果买家怀疑事件治理或保障质量，身份厂商可能很快丢单。
              tone: warning
        - label: 联合身份 / CIAM 适配不足
          values:
            - label: 高
              detail: 多份评测都将其描述为以联合身份或 CIAM 为主的买家的结构性适配问题。
              tone: negative
            - label: 高
              detail: 在战略客户中失去企业适配度，会直接影响扩张的持久性。
              tone: negative
        - label: AI 治理披露缺口
          values:
            - label: 中
              detail: 2026 年的产品扩张确实存在，但公开资料尚未显示逐买家的合规后果。
              tone: warning
            - label: 中
              detail: 缺少公开的合规映射，可能延迟或收窄受监管采购。
              tone: warning
        - label: 落地复杂度 / 对服务的依赖
          values:
            - label: 高
              detail: 第三方评论反复提到设置复杂度和合作伙伴主导的迁移工作。
              tone: negative
            - label: 中
              detail: 即使核心功能存在，实施不佳也会拖慢部署，拉长实现价值的时间。
              tone: negative
        - label: 报告深度缺口
          values:
            - label: 高
              detail: 公开评测评论直接描述了报告能力的局限。
              tone: warning
            - label: 中
              detail: 如果原生证据输出无法满足尽调要求，重视审计的买家可能会暂停推进。
              tone: warning
        - label: 定价 / 功能分层蔓延
          values:
            - label: 高
              detail: 公开评测将模块化套餐和附加项扩张列为反复出现的担忧。
              tone: warning
            - label: 中
              detail: 成本蔓延可能在成为论点破坏因素前，先侵蚀销售效率和客户 ROI。
              tone: warning
