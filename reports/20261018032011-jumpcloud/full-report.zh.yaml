  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 经常性收入架构与目录定价
        blocks:
          - type: paragraph
            body: >-
              JumpCloud monetizes a unified 目录, 访问, 、 设备管理 平台 而 超过 hardware 或 transaction volume. 公开 定价 reviewed 在
              August 2026 显示 entry packages billed 按用户按月, a menu 的 separately priced modules, 、 更大 平台 tiers 该 move
              behind a 销售沟通. A 30-day 全功能试用 supplies a 产品-led 切入点, 而 quote-仅 tiers imply 销售辅助扩张 用于 更大 或 更多 complex
              accounts. 该 structure creates seat, module, 支持, 、 package-upgrade levers, 但 list prices 是 不 实际 ASP: 来源 do
              不 disclose 谈判折扣, 合同期限, 收入结构, 附加模块渗透率, 或 收入确认政策.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
