              straddles 身份, 访问, endpoint, 、 目录 budgets, which 是 strategically positive 但 使 clean 一个-line 多个 mapping
              difficult 没有 fresher 收入 quality data. thesis breaks 如果 a 新 mark clears materially below 2021 Series F, 如果
              企业买方继续把 CIAM、大规模 federation 视为选择专业工具的理由，或如果管理层无法 显示 该 recent AI 或 agentic additions improve 变现 而非 的
              raising 执行风险. 下一 diligence step 是 therefore 不 至 debate story quality, 但 至 demand 当前 ARR 或 收入, paying-客户
              concentration, margin, retention, cap-table, 、 secondary-定价 证据 之前 turning a track stance 进入 an 进入决策.
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 哪些因素会改变判断
            body: >-
              A move 从 track toward buy 会 require a materially lower 切入点 超过 stale 2021 anchor 或 a 新融资 或 二级市场定价 supported
              由 当前 收入, retention, margin, 、 cap-table 证据. A move toward avoid 会 follow a discounted round, weak
              secondary clearing, 或 stronger proof 该 federation-heavy 、 客户-IAM 买方 systematically choose 更多 specialized
              alternatives.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
