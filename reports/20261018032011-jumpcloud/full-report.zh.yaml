      - number: '4.2'
        title: 公开增长信号指向明确，但不是经审计的收入基数
        blocks:
          - type: paragraph
            body: >-
              Sacra 估计 该 JumpCloud reached $105 million 的 ARR 在 2023, up 31% 从 $80 million 在 2022. 该 metric 是 ARR, 不
              GAAP 收入, 、 it 是 两者 第三方 estimated 、 相对于……属于历史数据 October 2026 run date. 更多 recent demand signals 是 产品-采用
              proxies 而 超过 financial disclosure: a JumpCloud partner repeats 公司's count 的 更多 超过 250,000 组织 覆盖 160-plus
              countries, 而 Capterra reports favorable reviewer scores 用于 secure login, authentication, 、 data 安全.
              Neither 来源 identifies 当前 number 的 付费客户, ARR concentration, 免费转付费转化, 群组留存, 或 收入 由 客户 细分.
            claimRefs:
              - CI002
              - CI011
              - CI012
      - number: '4.3'
        title: 融资历史不能证明资本充足性
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $408 million 的 累计融资 覆盖 11 rounds 、 identifies September 2021 Series F 作为 $225 million 在 a
              $2.62 billion 投后估值. 那些 是 历史 融资 facts, 不 证据 的 现金 仍 available 在 2026. JumpCloud's February 2026 announcement
              的 a venture arm 、 首个 investment 在 Tofu 是 a 当前 资本配置信号, 但 公司 披露 neither program size nor investment amount.
              assigned 来源 提供 没有 当前 现金余额, 消耗, 现金跑道, 债务 或 covenant schedule, so they 无法 establish 下一-round trigger 或 融资
              dependency.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              收入 mechanism 是 plausible 用于 durable 经常性软件: 客户 可以 begin 与 a focused per-用户 package, add modules, 、 graduate
              随着身份和设备资产增长，逐步升级到更广的协商层级。反向解读是，同样的模块化也可能造成续约阻力。 Siit's 评价 reports complaints 约 约 10% renewal increases, 而
              Access Security Hub notes 该 total 成本 varies 与 用户, 设备, 、 enabled modules. 没有 realized discounting, 毛利率,
              支持负担, CAC, 回收期, 流失, NRR, 现金, 、 现金跑道, however, neither operating leverage nor 融资 resilience 是 可据此评估.
              financial stance 是 therefore positive 在 变现 design 但 blocked 在 收入 quality, margin path, 、 资本充足性.
            claimRefs:
              - CI009
              - CI010
