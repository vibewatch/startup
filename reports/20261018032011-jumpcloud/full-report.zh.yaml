  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代路径
        blocks:
          - type: paragraph
            body: >-
              relevant 竞争集合 是 更广 超过 "云 IAM" alone. JumpCloud 是 repeatedly described 作为 a 云目录 平台 该 combines 身份, 访问, 、 设备
              管理, 、 公开 评价 frame it 作为 a 替代 用于 在-prem Active 目录，并替代至少一部分 SSO 和终端工具栈. 该 creates three practical 替代路径:
              直接身份领域同业 such 作为 Okta 、 Microsoft Entra ID, complex upmarket incumbents such 作为 Ping Identity 、 legacy
              ForgeRock, 、 现状工具组合 其中 买方 keep Active 目录 、 layer separate MDM, MFA, 或 network authentication 工具. 最强 公开 fit
              仍然 IT-led SMB 、 lower-mid-市场 团队 managing 异构的 Windows, macOS, 、 Linux fleets; 那些 买方 价值 a 单一 运营控制台 更多 超过
              最佳-在-class federation depth. 作为 a result, JumpCloud's direct rivalry 是 不 与 一个 vendor 但 与 买方's preferred
              工具栈 design: consolidated cross-平台 控制 versus 更深入 单一-domain 专业化.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP013
