      - number: '3.3'
        title: 持久性、多重接入与在位者反应
        blocks:
          - type: paragraph
            body: >-
              JumpCloud's 护城河 looks 更多 运营 超过 结构性. durable advantage 是 供应商整合 用于 买方 该 want 一个 system 至 cover 目录, 访问, 、
              cross-平台 endpoint 策略, reinforced 由 trust markers such 作为 公开 合规 credentials 、 broad 部署 claims. 但 公开 证据 也 显示
              该 JumpCloud reduces 切换成本 由 共存ing 与 existing systems: reviewers describe it 作为 an overlay 用于 some Active 目录
              environments, 、 产品-history summaries note 支持 用于 federated authentication 与 Okta 、 Entra ID. 该 共存ence helps
              采用, 尚未 it 也 implies weaker 锁定效应 因为 买方 可以 multi-home 身份 layers 而非 的 fully standardizing 在 JumpCloud. main
              替代风险 是 该 direct rivals own narrower 但 更深入 buying criteria: Okta 在 federation 、 CIAM, Entra 在
              Microsoft-native hybrid 身份、Jamf 或 Kandji 在 Apple-centric 设备控制，以及 Ping/ForgeRock 在高复杂度企业级 身份. JumpCloud 可以
              win consolidation-led deals, 但 商品化风险 rises 作为 买方 split 那些 domains back 进入 specialist 工具.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
