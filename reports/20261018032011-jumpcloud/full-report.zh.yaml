        blocks:
          - type: paragraph
            body: >-
              融资 、 规模 证据 是 directionally positive 但 不 clean enough 至 treat 作为 precision facts. JumpCloud's own materials
              仅 claim 更多 超过 $400 million raised, 而 two retained 第三方 trackers disagree 在 是否 total 披露 融资 是 约 $408 million
