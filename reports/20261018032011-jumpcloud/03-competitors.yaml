        - { label: Microsoft Entra ID, x: 3, y: 4 }
        - { label: Ping Identity, x: 1, y: 5 }
        - { label: ForgeRock, x: 1, y: 4 }
        - { label: OneLogin, x: 1, y: 3 }
    approximationNotes: >-
      Coordinates are evidence-backed ordinal placements synthesized from claims CP003
      through CP015; higher x reflects broader native device-control scope and higher y
      reflects deeper federation governance and complex-enterprise identity coverage.
    claimRefs: [CP003, CP004, CP006, CP007, CP008, CP010, CP012, CP015]
callouts:
  - calloutType: strength
    title: Consolidation is the core wedge
    body: >-
      The strongest public differentiation is not pure identity sophistication but the
      ability to consolidate directory, access, and mixed-OS device control into one
      operational system for IT-led buyers.
    claimRefs: [CP001, CP004, CP009, CP012]
  - calloutType: risk
    title: Specialist incumbents still own the hardest enterprise requirements
    body: >-
      Public comparisons consistently place Okta, Microsoft Entra ID, and Ping or
      ForgeRock ahead when the buying center prioritizes deep federation, CIAM, Microsoft
      ecosystem leverage, or complex hybrid orchestration.
    claimRefs: [CP006, CP007, CP008, CP012, CP015]
