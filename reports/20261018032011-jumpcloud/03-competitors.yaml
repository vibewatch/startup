  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Apples-to-apples realized enterprise contract pricing, required module mix, and discount structure for JumpCloud, Okta, Entra ID, and Ping/ForgeRock.
      whyItMatters: Public list prices and quote ranges do not show total cost once governance, endpoint, support, and hybrid features are added.
      diligencePath: Collect current enterprise quotes or procurement records for a common seat count and required feature set, then normalize add-on modules and contract minimums.
      relatedQuestionRefs: [QP008]
    - type: missing-source
      severity: material
      topic: competitor-scale-and-funding
      missingEvidence: Current, comparable customer scale, revenue, and financing evidence for JumpCloud and each private or public competitor in the assigned set.
      whyItMatters: Product positioning alone cannot establish competitive scale, financial capacity, or the durability of investment in roadmap and distribution.
      diligencePath: Collect current filings for public competitors and primary financing or audited operating disclosures for private companies, preserving each metric's period and denominator.
