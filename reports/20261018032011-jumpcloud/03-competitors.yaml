      - Public differentiation signal
      - Public limitation / risk
    rows:
      - [JumpCloud, Unified directory plus UEM, "Security Stack attributes 250,000+ organizations to JumpCloud; current funding is not evidenced in the assigned pool", SMB and lower-mid-market IT teams replacing AD plus point tools, Cross-platform device plus identity control from one SaaS console, Weaker federation or CIAM depth and smaller app catalog than top enterprise IdPs]
      - [Okta, Cloud-native workforce and customer IAM, "JumpCloud's comparison describes support for millions of users; financing is not assessed", Large enterprises prioritizing SaaS SSO and federation, Broad SaaS integration catalog plus stronger federation and CIAM depth, Device management is less comprehensive and modular costs can rise]
      - [Microsoft Entra ID, Microsoft-centric IAM plus endpoint stack, "JumpCloud's comparison describes support for millions of users; financing is not assessed", Microsoft 365 and Azure heavy hybrid estates, Deep Microsoft ecosystem integration plus AD sync and Intune alignment, Value and flexibility weaken outside Microsoft-centered environments]
      - [Ping Identity and ForgeRock, Complex enterprise hybrid and API-first IAM, "The assigned comparison describes largest-enterprise scale but provides no financing evidence", Large enterprises with custom apps and orchestration needs, Hybrid or on-prem flexibility plus API security and orchestration depth, Quote-based pricing and higher implementation complexity]
      - [OneLogin, App-centric workforce IAM substitute, Scale and funding are not quantified in the assigned evidence, Buyers prioritizing application access over endpoint control, App-centric IAM without requiring JumpCloud's device-management breadth, Product depth and pricing are not established by the assigned evidence]
      - [Legacy AD plus specialist point tools, Status quo and internal integration substitute, Not a single company and funding is not applicable, Buyers retaining Group Policy Kerberos or legacy AD-integrated applications, Preserves existing infrastructure and permits specialist MDM or IAM choices, More vendors and integration work remain with the buyer]
    notes: >-
      Profiles summarize publicly stated positioning and product scope; scale statements retain
      their issuer, comparable competitor funding is unavailable in the assigned evidence, and
      "limitation / risk" reflects cited public tradeoffs rather than measured win rates.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP012, CP013, CP014, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - JumpCloud
      - Okta
      - Microsoft Entra ID
      - Ping Identity / ForgeRock
    rows:
      - [Cross-platform device management, Strong Windows macOS Linux control plus patching, Limited native device control and relies on third-party MDM, Strong Windows-first endpoint posture through Intune and Defender, Not a core native differentiator in cited public comparisons]
      - [Federation and CIAM depth, Workforce oriented but not CIAM-first, Strongest cited SaaS federation and CIAM depth, Strong workforce identity depth especially in Microsoft estates, Strong enterprise federation and custom identity journeys]
      - [Application and integration breadth, Smaller catalog than Okta and Entra for legacy enterprise apps, Very broad SaaS integration network, Broad coverage with deepest value in Microsoft ecosystem, Broad custom and API integration for complex estates]
      - [Deployment architecture, Cloud-native agent model as AD alternative, Cloud-native SaaS, Cloud-native with hybrid sync through Entra Connect, Cloud hybrid and on-prem options with greater operational complexity]
    notes: >-
      Cells are evidence-backed summaries from the cited sources; the matrix does not claim a
      single shared benchmark score or independently measured performance ranking.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP010, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Public pricing cue
      - Contract model
      - Included capability cue
      - Implication
    rows:
      - [JumpCloud, Free up to 10 users and 10 devices and annual bundles from 9 dollars device management 11 dollars SSO plus MFA and 21 dollars platform, Public user-based plans plus custom premium tier, Directory access and device capabilities can be bundled in one SKU path, Lowest evaluation friction in the cited set]
      - [Okta, Common bundles estimated around 6 to 15 dollars per user per month, Per-user enterprise pricing with minimum contract value, Strong identity modules but added features expand spend, Better fit when identity depth outranks consolidation]
      - [Microsoft Entra ID, Basic features free with Microsoft 365 and premium tiers about 6 to 9 dollars per user per month, Per-user pricing frequently bundled inside Microsoft suites, Conditional Access PIM and governance ride premium Microsoft licensing, Economics are strongest when the estate is already Microsoft standardized]
      - [Ping Identity and ForgeRock, Quote-based and scope-dependent pricing, Customized contract tied to identities transactions or deployment scope, Advanced orchestration API security and hybrid flexibility, Hardest to compare bottom-up and most procurement-led]
    notes: >-
      Public list-price cues are not realized contract pricing; discounts, bundles, and
      module choices likely change total cost materially in enterprise deals.
    claimRefs: [CP008, CP009, CP016]
