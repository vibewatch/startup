        - label: IT-led SMB and lower-mid-market buyer cohort
          detail: Best-fit buyers are IT-driven teams centralizing users, devices, and authentication without legacy infrastructure.
          claimRefs: [CM004, CM016]
        - label: MSP-managed multi-tenant estates
          detail: Channel value comes from administering multiple customer environments from one console.
          claimRefs: [CM005]
        - label: Enterprise qualification point
          detail: Federation-heavy CIAM, deep governance, and stand-alone PAM needs can require complementary tooling.
          claimRefs: [CM012, CM013]
        - label: AI-agent and non-human identity adjacency
          detail: The newest expansion area is agent and non-human identity governance, but public monetization detail is absent.
          claimRefs: [CM011, CM015]
    approximationNotes: No assigned-pool source discloses a defensible TAM, SAM, or SOM, so this pyramid shows narrowing demand layers rather than scaled market values.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM011, CM012, CM013, CM015, CM016]
