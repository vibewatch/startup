  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Cloud-native SMBs and startups
        - IT manager or systems administrator
        - Employees and managed endpoints
        - IT operations budget
        - Replace no-AD identity and device stack with one console
        - IT operations lead
        - Avoid building on-prem directory infrastructure
      - - Lower-mid-market mixed-OS teams
        - IT or security administrator
        - Employees across Windows, macOS, and Linux estates
        - IT or security budget
        - Consolidate directory, authentication, and device control
        - Identity or endpoint lead
        - Reduce tool sprawl and audit burden
      - - MSPs
        - Service delivery manager
        - MSP administrators and client users/devices
        - MSP service-delivery budget or pass-through customer budget
        - Manage multiple client environments from one multi-tenant console
        - MSP practice owner
        - Improve operating leverage across client estates
      - - Enterprise or CIAM-heavy programs
        - Identity architect or platform lead
        - Workforce users, with adjacent customer-identity stakeholders
        - Security or platform budget
        - Evaluate whether JumpCloud needs complementary federation, IGA, or PAM tooling
        - Identity governance lead
        - Need deeper governance or federation than the core bundle offers
    notes: Buyer and budget-owner labels are inferred from how sources describe the operating workflow; no assigned source publishes a segment-by-segment spending mix.
    claimRefs: [CM004, CM005, CM012, CM016]
