        - Stand-alone best-of-breed endpoint tools outside identity consolidation
        - IT operations / endpoint owner
        - Device control is part of the demand-consolidation story
      - - Active Directory replacement or avoidance
        - Cloud directory, LDAP/RADIUS replacement, and mixed-OS access administration
        - Ongoing maintenance of on-prem directory infrastructure
        - IT infrastructure owner
        - Main status-quo substitute named by multiple reviewers
      - - MSP multi-tenant administration
        - Central management across multiple client environments
        - Single-customer-only admin tooling
        - MSP service owner
        - Distinct channel and workflow called out in review evidence
      - - AI-agent / non-human identity adjacency
