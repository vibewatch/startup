        - Security / identity leadership
        - New adjacency, but public monetization remains unclear
    notes: Sources define product scope and exclusions qualitatively; "excluded spend" means adjacent budgets not directly evidenced as JumpCloud's core category.
    claimRefs: [CM001, CM002, CM003, CM005, CM011, CM012]
