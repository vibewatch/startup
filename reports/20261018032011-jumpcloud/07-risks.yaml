figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence clusters JumpCloud's residual risk around enterprise-fit, rollout,
      and governance execution rather than around the absence of core IAM features.
    data:
      columns:
        - label: Likelihood signal
          detail: Ordinal public-evidence read on how structurally recurring the risk appears.
        - label: Impact signal
          detail: Ordinal public-evidence read on how damaging the risk could be for underwriting.
      rows:
        - label: 2023 security-credibility overhang
          values:
            - label: Medium
              detail: The cited evidence is historical, but security diligence remains live because current outcome metrics are not public here.
              tone: warning
            - label: High
              detail: Identity vendors can lose deals quickly if buyers doubt incident governance or assurance quality.
              tone: warning
        - label: Federation / CIAM underfit
          values:
            - label: High
              detail: Multiple reviews frame this as a structural fit issue for federation-heavy or CIAM-heavy buyers.
              tone: negative
            - label: High
              detail: Losing enterprise-fit in strategic accounts would directly affect expansion durability.
              tone: negative
        - label: AI-governance disclosure gap
          values:
            - label: Medium
              detail: The 2026 product expansion is real, but the public corpus does not show buyer-by-buyer compliance fallout yet.
              tone: warning
            - label: Medium
              detail: Missing public compliance mappings can delay or narrow regulated procurement.
              tone: warning
        - label: Rollout complexity / services dependence
          values:
            - label: High
              detail: Setup complexity and partner-led migration work appear repeatedly in third-party commentary.
              tone: negative
            - label: Medium
              detail: Poor implementation can slow deployment and reduce time-to-value even when core features exist.
              tone: negative
        - label: Reporting-depth gap
          values:
            - label: High
              detail: Reporting limitations are described directly in public review commentary.
              tone: warning
            - label: Medium
              detail: Audit-heavy buyers can stall if native evidence output does not satisfy diligence requirements.
              tone: warning
        - label: Pricing / feature-gating creep
          values:
            - label: High
              detail: Public reviews describe modular packaging and add-on expansion as recurring concerns.
              tone: warning
            - label: Medium
              detail: Cost creep can erode sales efficiency and customer ROI before it becomes a thesis-breaker.
              tone: warning
    approximationNotes: >-
      Ordinal placement is the chapter's synthesized ranking from cited evidence, not an
      external benchmark score or incident-frequency model.
    claimRefs: [CR004, CR007, CR008, CR009, CR012, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Enterprise-fit drift is the highest residual risk
    body: >-
      The public corpus repeatedly suggests JumpCloud becomes harder to defend when a buyer's
      requirements shift toward federation-heavy identity architecture, CIAM depth, or
      compliance-led reporting rather than tightly coupled identity-plus-device control.
    claimRefs: [CR006, CR007, CR015]
  - calloutType: insight
    title: Mitigation breadth exists, but proof depth is thinner
    body: >-
      Official materials describe a broad control stack, yet the assigned public sources do
      not substitute for independent assurance on post-incident performance, audit depth, or
      regulated-buyer acceptance.
    claimRefs: [CR009, CR012, CR014]
  - calloutType: assumption
    title: Diligence should test governance and implementation evidence directly
    body: >-
      Before underwriting upside from Agentic IAM or enterprise expansion, diligence should
      request AI-governance mappings, post-incident assurance evidence, and partner / services
      dependency metrics rather than relying on feature descriptions alone.
    claimRefs: [CR004, CR010, CR012]
