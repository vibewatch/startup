    "number": 5,
    "title": "Product & Technology",
    "summary": "Gusto has turned SMB payroll into a broader employment operating system that now spans HR, benefits, retirement, contractor payments, tax credits, time tools, mobile workflows, and emerging AI copilots. Public evidence supports real product breadth and active 2026 release velocity, but it also shows a partner-gated API surface, limited international depth beyond contractors, thin public trust documentation, and customer-risk exposure when payroll or compliance support fails."
