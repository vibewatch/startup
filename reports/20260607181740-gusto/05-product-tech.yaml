    {
      "id": "architecture-integration-and-operating-model",
      "title": "Architecture, Integration, and Operating Model",
      "body": "The public architecture read is a cloud-delivered SaaS stack with both employer and employee mobile surfaces sitting above a payroll-and-recordkeeping core, plus adjacent workflow modules that sync back into the same system of record. Official payroll, time, and mobile pages show payroll, timesheets, PTO, expenses, onboarding, and paycheck-management features flowing through one interface, while PCMag adds a rare infrastructure detail by saying Gusto runs databases and production services on AWS and applies TLS in transit, MFA, backups, and fraud monitoring. The integration story is broad but carefully controlled. Gusto’s app directory and payroll pages expose many named integrations, and the docs show serious OAuth-based developer tooling, sandbox companies, QA, and scoped production keys. But the same docs also make clear that the API model is partner-centric: direct customer company-system API access is not yet supported, not all use cases are approved, and production rollout requires security review and pre-approval. That combination points to a real architecture with real extensibility, but not to a fully open enterprise platform.",
