      "id": "scenario-analysis-and-return-range",
      "title": "Bull, Base, and Bear Scenarios",
      "body": "The valuation is most useful when framed as explicit scenario math rather than a single point estimate. In the bull case, Gusto reaches roughly $1.5 billion of 2027 revenue, proves that the non-payroll platform is durable, and benefits from a friendlier IPO market, which supports a 15x multiple and approximately $22.5 billion of value. In the base case, growth remains healthy but moderation continues, revenue reaches about $1.2 billion, and a 10x multiple produces around $12 billion. In the bear case, competition and macro pressure push growth toward the mid-teens, revenue only reaches roughly $1.15 billion, and the market pays 7x, which yields about $8 billion. Against a $9.3 billion entry point, those outcomes imply a wide dispersion in gross returns: strong upside if the IPO window reopens, only modest appreciation in the base case, and capital impairment if the market concludes the current mark already discounts most of the forward progress.",
