  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Gusto’s valuation case is attractive but not effortless: a roughly $9.3B mark against more than $1B of actual trailing revenue, about 30% growth, free-cash-flow positivity since 2023, and 500K+ customers makes the current ~9x multiple look reasonable versus premium private HR leaders, even if it remains above mature public payroll comps. The upside case depends on proving that flat valuation since 2022 is a timing artifact rather than a ceiling, with continued non-payroll mix shift, successful Guideline/Mosey integration, and a reopened IPO window pushing value toward a ~$12B base case and ~$22.5B bull case. The key caution is that the same flat mark, U.S.-centric TAM perception, acquisition spending, and a reported debt layer all imply real skepticism. Recommendation: BUY (track) at secondary prices, but size positions only after validating tender terms, integration retention, and real IPO readiness."
  },
