    {
      "id": "final-diligence-asks-and-thesis-breaks",
      "title": "Final Diligence Asks and Thesis-Break Triggers",
      "body": "The remaining work is not to decide whether Gusto is a good company; prior chapters already support that. The real underwriting question is whether today’s secondary entry has enough margin of safety relative to the next liquidity event. That means the highest-value diligence is concentrated around pricing mechanics, integration quality, and competitive durability. Investors should confirm the exact tender share price and preference stack, understand whether Guideline-related divestitures or customer churn could mute the expected retirement uplift, and ask management what specific operational milestones would make a 2026 or 2027 IPO realistic. The thesis would break if growth drops below roughly 20% without compensating margin improvement, if the next mark or secondary print comes in below $9.3 billion, or if clear share-loss evidence emerges against Rippling, Deel, ADP, or other payroll incumbents. Those are monitorable, decision-relevant conditions, which is why the recommendation is BUY (track) rather than a blind green light.",
