      - number: '7.5'
        title: 宏观、战略与投资逻辑破裂综合判断
        blocks:
          - type: paragraph
            body: >-
              Gusto 的自上而下风险主要是周期性风险，而不是品类被淘汰的风险。公司已经服务 500,000+ 家企业，实际过去收入也超过 $1 billion，这意味着承保问题不再是薪资软件是否有真实需求。问题是：如果
              SMB 基础走弱，或估值预期跑在公开证据前面，这种需求还能保持多强韧性。Federal Reserve 的 2026 年雇主企业调查是关键外部读数：收入和就业预期降至 2020 年以来最低，77%
              企业称成本上升和/或关税是财务挑战，申请融资的企业中约三分之一仍面临资金缺口。这些不是 Gusto 特有问题，但会直接转化为客户流失、招聘放缓、薪资量下降，以及税务和现金流边缘案例上更高的支持需求。


              战略上，公司面临估值与退出时点悖论。TechCrunch 称，Gusto 2025 年 6 月老股交易把公司估值定在约 $9.3 billion，和 2022
              年初大致持平，尽管收入已大约翻倍，并且业务已经多年现金流为正。这是多重压缩风险的有力证据，也提醒投资人：强业务仍可能是一个棘手的 2026 年公开市场故事；同一篇文章明确称，在 IPO
              市场仍然寒冷时，公开上市看起来仍不稳妥。因此，正确投资姿态应该是有条件的。Gusto 不需要完美，但必须避免破坏信任的薪资事故，证明收购正在干净整合，显示合作伙伴集中度足够分散，并证明 AI
              加速正在改善服务质量，而不是掩盖人员压力。下方缓释表把这转化为可监控触发器和明确的投资逻辑破裂标准。
