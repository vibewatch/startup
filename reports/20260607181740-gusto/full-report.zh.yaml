      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Gusto 的三位联合创始人仍深度参与公司运营。Joshua Reeves 担任 CEO，自创立以来一直在这个位置。Tomer London 以联合创始人兼首席产品官身份继续负责高层产品领导；Edward Kim
              是联合创始人兼技术负责人。CEO 是公司主要外部窗口，持续面向媒体、投资人和客户。公司任命 Tolithia Kornweibel 为首席营收官，负责商业化与销售。2025 年 12 月，Gusto 任命
              Anthropic CTO Rahul Patil 进入董事会，把技术可信度和 AI 专长补到治理层。董事会还包括 General Catalyst CEO Hemant Taneja，General
              Catalyst 是 Gusto 持续时间最长的投资方之一。高管团队相对稳定；主要负面领导事件是 2023 年 2 月裁员约 126 人（约占员工 5%），CEO Reeves
              将原因归结为宏观环境变化。此后未见重大 C-suite 离职公开报道，公司在 2025–2026 年又开始扩张团队。创始人集中仍是治理风险：三位联合创始人均担任运营角色，Josh Reeves 同时是 CEO
              和潜在上市公司候选企业的公众门面，形成关键人风险。
