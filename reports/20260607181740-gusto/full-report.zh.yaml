        - 跟踪哪些新的州强制要求能带来可衡量的产品驱动获客
      - - CalSavers 及类似退休金强制要求
        - 驱动
        - 2025-2026
        - 让最小加州雇主产生紧迫感，并支撑 401(k) / 合规增购
        - 衡量合规内容转化为退休计划采用的比例
