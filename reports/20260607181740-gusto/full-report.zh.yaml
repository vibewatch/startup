  - id: TV006
    title: 最终尽调问题表
    columns:
      - 未决尽调问题
      - 证据缺口
      - 重要性
      - 负责人 / 下一步
    rows:
      - - 2025 年要约回购价格机制
        - 确切股价、符合资格的证券类别、相对优先股的折价 / 溢价，以及任何附函条款
        - 这些输入直接决定老股交易真实入场成本，以及优先股堆叠下的下行风险。
        - 加仓前，要求提供要约备忘录、股权结构表和律师摘要。
      - - 优先股堆叠和近期老股交易
        - 最新股数、清算优先权，以及任何 2026 年老股交易成交价
        - 若不弄清普通股和后期优先股持有人实际拥有什么，回报模型并不完整。
        - 获取更新后的股权结构表，以及经纪人对近期交易的反馈。
      - - Guideline 整合后的留存
        - 客户留存、附加销售转化，以及任何绑定竞争对手的 Guideline 账户剥离
        - 这笔收购必须带来能支撑估值倍数的扩张，而不只是表面上的产品宽度。
        - 要求提供交割后整合仪表盘和队列级留存数据。
      - - 非薪酬业务组合质量
        - 按薪酬、退休金、福利、合规和资金类产品拆分的 ARR 与毛利率
        - 如果非薪酬业务质量低于表面 ARR 结构显示的水平，估值溢价会收窄。
        - 要求提供产品损益表和附加率队列拆分。
      - - 真实 IPO 准备度
        - 董事会标准、投行接触、审计准备度，以及哪些里程碑会触发申报
        - 基准和乐观情景取决于下一次流动性事件的时间。
        - 要求管理层定义 IPO 门槛，而不是只说这是长期事项。
      - - 竞争耐久性
        - 与 Rippling、Deel、ADP、Paychex 和 Paylocity 相比的赢单率、输单率和定价压力
        - 投资逻辑最快崩掉的路径，是核心薪酬切入点出现结构性份额流失。
        - 要求提供队列级销售管线和续约分析，而不只是个案故事。
    notes: 缺失尽调集中在估值机制，以及哪些因素会打开或挡住估值倍数扩张。这些问题按对预期回报模型影响大小排序。
