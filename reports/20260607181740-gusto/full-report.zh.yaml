      - - 薪资引擎与记录层
        - 运行薪资、存储税表、支持付款速度选择，并充当记录系统
        - 银行通道、税务规则、薪资逻辑、直接存款合作伙伴
        - 这是所有相邻模块都依赖的核心平台
        - 公开吞吐量和失败率指标缺失
      - - 工时 / PTO / 排班同步层
        - 捕捉工时、排班、PTO、休息和出勤，并把批准后的数据推入薪资
