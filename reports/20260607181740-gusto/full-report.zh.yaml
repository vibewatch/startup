      - number: '3.4'
        title: 护城河耐久性与替换风险
        blocks:
          - type: paragraph
            body: >-
              Gusto 的护城河是真实的，但比泛泛的 HR 平台叙事更窄。客户证据仍证明，易用性、入职、自动驾驶式薪资和合规辅助，是 SMB 买方采用并留存的原因。这让 Gusto
              在美国本土小企业中拥有可防守位置：这些企业想把薪资、福利和基础 HR 放在一个产品里，又不想承担大型套件的实施负担。问题在于，这个品类最可信的对手从不同方向进攻。ADP 和 Paychex
              靠更深的合规、报表和服务信任进攻；QuickBooks 靠会计相邻性进攻；Rippling 靠更广的自动化、IT 和上探市场工作流控制进攻；Deel 靠国际薪资和 EOR 进攻；Justworks、TriNet
              和 Insperity 则靠外包 HR 与 PEO 服务模型进攻。切换成本有意义，因为薪资数据、税务设置、福利选择、权限和集成无法无摩擦迁移，但也没有高到买方在产品不再适配后不能离开。因此，上探 SMB
              是核心风险区：复杂度上升后，Gusto 可能不是因为核心薪资失效而流失，而是因为买方开始在简单性之外优先选择广度、服务深度或全球就绪度。Rippling–Deel
              诉讼周期也显示，资本充足的竞争者正在激烈争夺品类叙事领导权。
