        title: 风险信号、杠杆与公开来源缺口
        blocks:
          - type: paragraph
            body: >-
              主要财务空头案例不是 Gusto 没有收入，而是估值和披露质量落后于收入故事。尽管公司从 2023 财年超过 $500 million 收入，走到 2026 年约 $1 billion 过去 12
              个月收入，标题估值仍停留在大致相同的 2022–2025 年区间，意味着倍数压缩而不是升值。如果利润率稳、现金生成真实，这可以管理，但 Gusto 并不公开披露毛利率、渠道
              CAC、回本期、NRR、流失率、烧钱或债务约束。独立三角验证也比理想状态更薄。本轮中，一些知名金融信息入口无法访问、过于泛化或不可用：具体 WSJ 和 Business Insider URL
              未能干净解析，Crunchbase 被 Cloudflare 阻挡，Bloomberg 搜索只返回通用结果页，抓取的 CB Insights 页面则解析到另一家名为 Gusto
              的公司。投资判断含义很直接：收入质量看起来强，资本强度看起来温和而非极端，但缺少审计利润率和现金数据，意味着最终财务结论应保持建设性但有条件，而不是完全绿灯。
