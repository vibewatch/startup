  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 判断
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 罕见的增长与现金生成组合
        - 对一家后期薪资平台来说，>$1B 实际过去收入、~30% 增长，且自 2023 年起 FCF 转正，并不常见。
        - 如果增长滑到 ~20% 以下且利润率停滞，溢价倍数就很难维护。
      - - 投资逻辑
        - 多产品扩张真实存在
        - 目前超过一半 ARR 来自薪资以外的产品，Guideline 又加深了退休金附加。
        - 如果非薪资组合停滞，或 Guideline 整合带来流失，平台故事会变弱。
      - - 投资逻辑
        - 相比高溢价私营龙头仍有折价
        - 尽管规模叙事相近，Rippling 和 Deel 的私营估值标记都比 Gusto 高得多。
        - 如果私营可比公司的热度消退，或 Gusto 错过下一段增长，这个折价可能合理。
      - - 反向逻辑
        - 估值持平可能反映结构性天花板
        - 尽管收入大幅增长，名义估值标记自 2022 年以来几乎没动。
        - 可信的 IPO 路径，或明显更高的老股成交价，会说明天花板是周期性的，而非结构性的。
      - - 反向逻辑
        - 仅聚焦美国可能压住 TAM 认知
        - 相比 Gusto 当前叙事，Deel 和 Rippling 讲的是更全球、更宽的操作系统故事。
        - 若有明确证据证明国际化或相邻扩张跑通，TAM 折价会收窄。
      - - 反向逻辑
        - 收购包袱让资本效率变得不清晰
