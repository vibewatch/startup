  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 收入 / ARR 基础
      - 估值 / 市值
      - 隐含倍数
      - 对 Gusto 的参考意义
      - 局限
    rows:
      - - Rippling
        - 私营 HR / IT / 支出平台
        - CNBC 称 ARR 在 2025 年突破 $1B
        - ~$16.8B 估值
        - ~16.8x ARR
        - 最好的私营高溢价平台基准，用来观察投资人仍会多激进地定价品类龙头。
        - 私营公司指标披露比上市可比公司更薄；ARR 和利润率不像上市公司收入那样接受同等审计。
      - - Deel
        - 私营全球薪资 / HR 平台
        - 公司称 2025 年 ARR 超过 $1B
        - ~$17.3B 估值
        - ~17.3x ARR
        - 最直接的全球薪资扩张可比公司，也最能提醒投资人：全球覆盖仍会拿到溢价估值。
        - 新闻稿和私募轮数据不如公开申报标准化。
      - - Paycom
        - 上市薪资 / HCM
        - FY2025 收入 $2.05B
        - ~$6.4B 市值
        - ~3.1x 收入
        - 显示当前二级市场投资人如何给规模化美国薪资软件运营商定价。
        - 公开报价每天波动，市场定价的是成熟上市公司，不是 IPO 前的复利增长资产。
      - - Paylocity
        - 上市薪资 / HCM
        - FY2025 收入 $1.60B
        - ~$6.1B 市值
        - ~3.8x 收入
        - 有用的云原生 SMB 薪资 / HCM 基准。
        - 同样是成熟上市可比公司；估值可能低估私募买家愿意为更快的 IPO 前增长支付的价格。
      - - Paychex
        - 上市薪资 / HCM
        - FY2025 收入 $5.57B
        - ~$36.3B 市值
        - ~6.5x 收入
        - 最接近的成熟美国薪资可比公司，因此也是 Gusto 最清晰的上市天花板参考。
        - 增长更慢，资本回报画像也不同，因此不是完美的一对一基准。
      - - ADP
        - 上市薪资 / 雇主服务
        - 大型成熟薪资 / HCM 收入基础
        - ~$92.7B 市值
        - 低到中个位数收入倍数区间
        - 用来观察公开市场如何定价薪资基础设施耐久性的最佳规模基准。
        - 规模太大且业务太分散，无法直接类比面向小企业的 Gusto。
      - - Workday
        - 上市企业 SaaS / HCM / 财务
        - FY2026 收入 $9.55B
        - ~$35.6B 市值
        - ~3.7x 收入
        - 大盘 SaaS 参照物，投资人仍会用它对比高质量 HCM 软件。
        - 企业财务 / HCM 暴露和客户规模画像差异很大，限制了直接可比性。
    notes: 这组可比筛选刻意混合：Gusto 不应只按成熟上市薪资公司估值，也不应只按高溢价私营赢家估值。最诚实的读法是，Gusto 处在两组之间。私营公司披露仍不完整，公开市场估值每天变动，因此这张表是决策筛选，而不是精确公允价值主张。
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerated from the most decision-relevant private and public payroll/HCM comparables fetched during the 2026
        valuation pass, using disclosed valuation events, public-market quote pages, and official revenue releases where
        available.
