        - 销售效率判断大多只能靠推断
        - 索取渠道级 CAC、回本周期、转化和留存队列
        - 公开 GTM 数据不足
      - - 按队列划分的 NRR 与流失
        - 交叉销售证据很强，但公开资料没有硬性的 NRR 或流失序列
        - 留存质量仍停留在估计，而非已被证明
        - 索取按细分市场拆分的 NRR、客户流失和收入流失
        - 非上市公司指标缺口
      - - 数据库交叉验证
        - CB Insights 返回了错误的 Gusto 实体，Crunchbase 访问受阻
        - 削弱了用数据库确认融资历史的力度
        - 尽调时使用付费数据库导出，或索取公司提供的截图
        - 访问和实体解析问题
      - - 媒体佐证
        - WSJ 和 Business Insider URL 未能干净解析；Bloomberg 搜索只返回通用搜索壳
        - 部分外部估值 / 债务交叉验证仍不完整
        - 用订阅账号或内部媒体数据库重跑
        - 访问受阻 / 通用结果问题
      - - 公开监管文件支持
        - 通过这个界面访问 SEC 浏览搜索，没有得到干净的 Form D 确认
        - 限制了以监管文件级别佐证私募融资的能力
        - 索取公司文件清单，或由法律顾问准备的融资时间表
        - 公开界面的文件缺口
