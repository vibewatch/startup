      - number: '6.3'
        title: 满意度、耐久性与切换成本代理指标
        blocks:
          - type: paragraph
            body: >-
              Gusto 的公开耐久性证据在代理指标上很强，在真实队列经济上很弱。官方薪资页称，十个客户中有九个愿意推荐 Gusto，平均客户评分为 4.5/5 星，88% 同意 Gusto 帮助他们保持合规。定价页引用了
              Capterra 上 4,137 条评价的 4.6 星均分；归档的 Software Advice 页面显示 3,873 条评价下整体评分
              4.6，并有关于薪资自动化和支持的正面评论。官方客户证言反复出现同一组正面主题：入职容易、发薪快、员工自助、福利集成，以及更低的行政开销。粘性逻辑也直观，并得到来源支撑。定价和薪资页面强调年中薪资迁移支持、W-2
              连续性、福利计划同步、工伤保险，以及与薪资无缝衔接的 401(k)；Sacra 则明确认为，福利、工时、HR 和合规附加产品创造切换成本和扩张收入。问题在于缺失项仍然关键：Gusto 不公开
              NRR、GRR、客户层面流失、合同期限或真实留存队列。反向评价证据同样重要，因为这是任务关键型软件。Trustpilot
              归档语料反复抱怨定价透明度、支持排队、申报错误、税务解决和国际承包商问题，尽管其中也有从老牌厂商切换过来、并更喜欢 Gusto 界面的满意用户。
