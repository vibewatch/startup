        - 排班广度仍面向 SMB
      - - 福利 / 退休 / 税收抵免层
        - 使用与薪资挂钩的数据驱动扣款、退休入职、计划合规和税收抵免估算
        - 承保方关系、Guideline 集成、薪资数据质量
        - 新模块不需要新的员工记录，因此形成交叉销售护城河
        - 公开实施和支持细节有限
      - - 集成与 API 层
        - OAuth 应用、沙盒公司、分配范围、预审批和合作伙伴 QA 支持第三方构建
        - 开发者关系、QA 产能、合作伙伴审批、API 稳定性
        - 解释了 Gusto 如何延伸到会计师、嵌入式薪资和合作伙伴产品
        - 直接客户系统 API 访问仍不支持，也并非所有用例都会获批
      - - 云安全与运营层
        - PCMag 报道 AWS 托管、传输中 TLS、MFA、备份和欺诈监控；信任中心存在
        - AWS、安全运营、直接存款和监控控制
        - 这一层支撑薪资信任，并降低欺诈 / 运营风险
        - 公开认证细节、SLA 历史和企业架构深度仍偏薄
      - - AI 工作流层
        - ChatGPT/Claude/Slack 集成和 Cofounder 自动处理查询、提醒、审批和部分薪资动作
        - 模型可靠性、权限、工作流护栏、支持 QA
        - 可能提升薪资、合规和管理工作流的杠杆
        - 公开护栏细节较少，AI 错误风险仍落在关键任务工作流上
