        - 驱动
        - 当前
        - 支撑更快实施、自动更新，也更适合精简的 SMB 团队
        - 获取更干净的 2026 年新实施云占比基准
      - - 薪资 + HR + 福利一体化套餐
        - 驱动
        - 当前
        - 通过整合分散供应商抬高 ARPU 和留存
        - 量化核心薪资之外交叉销售附加率
      - - HR 工作流中的 AI / 自动化
        - 驱动
        - 当前且在加速
        - 提升异常检测、自助服务和小团队行政杠杆
        - 测试治理缺口是否拖慢买方对 AI 功能的信任
