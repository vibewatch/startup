  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户任务
        blocks:
          - type: paragraph
            body: >-
              Gusto 的产品最适合理解为一套 SMB
              雇佣运营系统，锚点工作流仍是薪资，但商业逻辑现在取决于发薪前、发薪中和发薪后围绕薪资发生的事情。官方产品面现在覆盖薪资、招聘与入职、员工记录、绩效与调查、健康和金融福利、由 Guideline 支撑的 Gusto
              401(k)、承包商付款、合规仪表板、税收抵免、工时跟踪、移动工作流，以及面向会计师的工具。这一点重要，因为实际买方问题并不是孤立地“跑一张工资单”；而是把员工数据、福利选择、税表、排班和合规任务放在一处，让小团队不用对账多个系统。同一产品面也解释了护城河和限制：Gusto
              对美国 SMB 买方来说集成度少见地高，但其国际范围仍围绕承包商付款展开，而不是完整全球薪资或 EOR 技术栈。
