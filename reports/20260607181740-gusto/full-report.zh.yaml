          - type: callout
            title: 金融科技相邻业务拓宽合规边界
            body: Gusto Money 把薪资软件变成由合作伙伴编排的金融工作流，包含放贷、账单支付和开票。即使第三方在技术上拥有部分栈，这也会扩大公司的监管和运营负担。
