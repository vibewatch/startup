  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Gusto 方案
      - 可衡量 / 可见收益
      - 限制
    rows:
      - - 运行常规薪资
        - 手工薪资、报税和付款时点会制造截止日期风险
        - 薪资核心支持不限次数运行、自动报税和多速付款选项
        - 官方页面强调减少手工步骤，并在需要时提供当日 / 即时选项
        - 公开 SLA 和大公司规模指标没有披露
      - - 新员工入职
        - 新员工设置通常要处理多份文件、多个系统和多处签名
        - HR 入职清单、文档存储、电子签名、软件开通和移动入职
        - 一条员工记录可流入薪资、文档和应用访问，无需重复录入
        - 高端人才管理深度仍弱于企业套件
      - - 提供福利和退休计划
        - 福利选择和退休扣款通常在薪资之外处理
        - 福利管理，加上由 Guideline 支撑的 Gusto 401(k)
        - 与薪资同步的扣款减少手工纠错，也可能释放退休计划税收抵免
        - 公开资料对承保方经济性、支持负载和 Guideline 并入后的迁移质量细节有限
      - - 支付承包商和混合团队
        - SMB 往往要为员工和承包商切换不同工作流
        - 统一的承包商与员工薪资、自动化 1099 处理、定时承包商付款
        - 2026 年春季更新减少了更多承包商手工工作，并支持拆分付款工作流
        - 国际支持对承包商更广，对完整员工薪资覆盖较弱
      - - 处理合规任务
        - 业主容易漏掉变化中的规则、截止日期以及必需培训或文件
        - Compliance Hub、提醒、休息政策支持、远程 I-9 验证和认证 HR 帮助
        - 仪表盘驱动的工作流把隐藏合规工作变成可见任务
        - Mosey 支撑的更广业务合规推出仍未完成
      - - 离开办公桌也能跑薪资 / 管理工作
        - SMB 经营者经常要在移动中批准工时、费用或薪资
        - 官方移动应用覆盖薪资、工时表、费用、入职、提前领薪和福利
        - 雇主和员工都能在同一个应用里操作，不必等到桌面端
        - 应用商店和官方页面展示了能力广度，但没有移动可靠性指标
      - - 服务会计师和多客户管理员
        - 会计师在工具切换和追踪客户合规机会中损耗时间
        - Gusto Pro 加上 Karbon 集成和浮出的建议
        - Spring Showcase 在 Karbon 内增加薪资跟踪，并主动浮出机会
        - 会计师的真实采用率和按事务所细分的 ROI 没有公开
    notes: 这些工作流把产品页内容转成 SMB 经营者、员工和会计师真正要完成的任务，而不是只罗列 SKU。收益仍是方向性的，因为公开来源讲清产品机制多于已实现的客户结果。
