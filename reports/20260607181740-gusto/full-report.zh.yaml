        - 如果管理层证明 Guideline 带来强留存、高附加和快速回本，收购压力就会从担忧变成优势。
    notes: 正反两边刻意保持对称：两边都有证据支撑，只有其中一边拿到决定性证明，投资建议才会改变。这不是泛泛的质量表，而是针对当前入场点的估值表。
