      - number: '1.4'
        title: 规模指标与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，Gusto 已形成可观规模。公司服务超过 500,000 家美国小企业，高于 2024 年 8 月约 300,000 家直接客户和 2025 年 3 月 400,000+
              家直接客户。仅最近披露的单季，Gusto 就新增约 50,000 家客户。公司过去 12 个月收入在 2026 年初突破 $1 billion——这是实际收入，不是年化 ARR
              预测——背后是连续五个季度增长加速。Sacra 估计 2025 年收入为 $975M，较 2024 年 $750M 同比增长约 30%。公司 401(k) 业务 ARR 在 2024 年同比增长约
              50%，Gusto Money（员工金融账户产品）ARR 同比增长超过 140%。Gusto 现在超过一半的 ARR 来自薪资之外的产品，标志着公司从单一薪资产品公司根本转向多产品 HR 平台。Gusto
              2026 年员工数估计约 2,300–2,900 人，最大办公室在 Denver（约 640 人），San Francisco 为第二大办公室（约 375 人）。关键里程碑包括 2015 年更名、2019
              年将健康福利扩展到全美国、2021 年 Series E 和员工要约收购、2023 年裁员、2025 年 6 月按 $9.3B 估值进行的要约收购、2025 年 10 月以约 $600M 收购
              Guideline，以及 2026 年 4 月收购 Mosey。
