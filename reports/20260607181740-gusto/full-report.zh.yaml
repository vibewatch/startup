      - number: '6.4'
        title: 扩张动作、渠道杠杆与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Gusto
              客户侧最强的乐观逻辑，不只是新增客户数量，而是平台看起来正在账户内部和相邻渠道周围加深。官方案例和产品页反复把薪资连接到健康保险、401(k)、工伤保险、入职、合规、工时工具、承包商付款和会计师工作流。Dark
              Horse CPAs 是特别重要的证据点：它说明 Gusto 既能作为该事务所的直接操作系统，也能成为会计师主导渠道向数百个终端客户推荐的产品。会计师计划本身已经足够大，值得单独看待：18,000+
              家事务所、正式合作伙伴层级，以及最高 20% 的收入分成。话虽如此，集中度故事仍只得到部分支撑。公开证据显示 SMB
              客户横跨多个垂直行业，但收入基础仍压倒性依赖小企业雇主；一旦出现对员工数敏感的下行周期，客户风险会直接传导。公开来源也没有披露头部客户集中度、各分部 ARR
              或渠道结构。最后，平台的国际化故事仍比本土业务窄：Gusto 支持在 120+ 个国家支付承包商款项，但公开证据仍集中在美国薪资、福利和合规。这给 Rippling
              这类更宽套件或全球化专家留下空间，未来可能把部分扩张中的客户向上端或跨境场景拉走。
