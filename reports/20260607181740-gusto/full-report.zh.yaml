      - - HR 与员工管理
        - 运营、办公室经理、HR 通才
        - 招聘、入职、文档存储、组织数据、绩效、调查
        - 成熟 / 扩张中
        - 把招聘、入职和员工记录拉进与薪资同一套系统
        - 高级 HR 深度仍弱于企业级 HCM 套件
      - - 福利与员工金融
