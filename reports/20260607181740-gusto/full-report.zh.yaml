  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与可见买方画像
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Gusto 的客户基础很宽，但重心仍清楚落在 SMB，而不是企业级 HCM 存量市场。当前客户中心称，超过 500,000 家企业使用
              Gusto，并展示了营销机构、医疗健康分析公司、律所、会计师事务所、牙科诊所、零售商、餐厅、啤酒厂、建筑企业和软件创业公司的案例标题。当前客户评价页把这幅图景说得更具体：可见评论者带有姓名、行业和团队规模，多个例子落在
              2–10 名员工区间；官方证据也向上覆盖 16 人和 17 人运营团队、58 人组织、50+ 员工创业公司，甚至一家 100+ 员工会计师事务所——该事务所自己使用
              Gusto，也把它推荐给客户。买方往往是老板、财务经理、办公室经理、会计师或合伙人，而不是集中采购团队。Gusto
              自己的小企业平台定位、简单的按员工计价，以及合作伙伴计划里会计师转介绍的突出位置，都与此一致。实际结论是：Gusto 的甜蜜点不是某个狭窄垂直行业，而是美国雇主型
              SMB。只要薪资、福利、招聘和合规复杂度已经超出电子表格，但还没到必须上重型企业套件的程度，就是它最适合切入的区间。
