companyProfile:
  summary: >-
    Gusto（前身 ZenPayroll）是一家总部位于 San Francisco 的薪资、HR 与福利 SaaS 平台，2011 年由 Joshua Reeves、Tomer London 和 Edward Kim
    创立。公司服务超过 500,000 家美国小企业，提供全托管薪资发放、健康福利、401(k)（通过收购 Guideline）、HR 工具、合规自动化（通过收购 Mosey）和员工金融服务（Gusto Money）。截至 2026 年
    6 月，Gusto 过去 12 个月收入已突破 $1 billion，自由现金流为正，并按 2025 年 6 月二级市场要约收购估值约 $9.3 billion。ARR
    现在超过一半来自核心薪资之外的产品，说明公司已从薪资服务商成功演进为多产品 SMB 运营系统。
