      - number: '7.6'
        title: 图表证据
        blocks:
          - type: callout
            title: 薪资信任是真正的单点故障
            body: Gusto 可以扛住一轮嘈杂评价或一次孤立的竞争对手攻击，但承受不了大范围薪资税、工资或资金流转事故——那会让 SMB 老板相信，平台在发薪日并不安全。
            calloutType: risk
            claimRefs:
              - CR013
              - CR015
