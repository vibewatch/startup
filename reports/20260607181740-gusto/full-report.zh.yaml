      - - 非薪资软件套件
        - 交叉销售到福利、HR、合规和工时工具
        - 现在超过一半 ARR 来自薪资之外的产品
        - 管理层称非薪资产品现在贡献 ARR 大多数
        - 分散收入并抬高 NRR 潜力，但公开口径未分拆产品组合
        - 按薪资、福利、退休、Money 和合规拆分 ARR
      - - 健康福利 / 经纪管理
        - 类经纪管理叠加集成费
        - Gusto 担任经纪方时不收管理费；外部经纪方集成每名符合条件员工 $6
        - 全国福利层已嵌入薪资
        - 经常性，但部分是转付且服务较重
        - 披露抽成率、参保人数和福利毛利率
      - - 由 Guideline 支撑的 401(k)
        - 退休计划管理与薪资集成
        - 定价随 401(k) 集成而变；营销口径强调低月费、无交易费
        - 收购 Guideline 后形成合规驱动的高留存邻近业务
        - 可能耐久且利于附加率，但实际定价不透明
        - 披露参与雇主、储蓄者、收入和利润率结构
      - - R&D 税收抵免
        - 按成功收费的税收抵免追回服务
        - 已识别抵免额的 15%；Premium 可享折扣
        - 管理层称去年帮助释放 $64M+ 抵免
        - 毛利更高的事件型收入，不是典型 SaaS MRR
        - 披露年度税收抵免收入以及附加 / 申报转化
      - - Gusto Money / Payroll Bridge
        - 嵌入式金融、开票、账单支付和伙伴发行的信用产品
        - 基础工具已包含；Money Plus $19/mo；可能收取交易和融资费
        - Money 产品 2024 年 ARR 增长 140%
        - 经常性与交易型经济性混合，并依赖伙伴
        - 披露活跃账户、费用收入和信用损失暴露
      - - 仅承包商和全球承包商付款
        - 按承包商定价和付款收费
        - Contractor Only 促销价：6 个月 $0 基础费 + 每名承包商 $6；全球承包商不收按承包商计的月费
        - 有用的低端入门 SKU 和仅承包商切入点
        - ARPU 低于雇主薪资，但扩大 TAM
        - 披露仅承包商客户数，以及转化为 W-2 薪资的比例
      - - 伙伴 / 嵌入式渠道
        - 会计师推荐和嵌入式薪资分销
        - 伙伴收入分成 5%-20%；嵌入式经济性未披露
        - 18,000+ 家会计事务所叠加嵌入式薪资伙伴关系
        - 可能降低 CAC、提升分销效率，但贡献毛利未披露
        - 披露收入分成费用、渠道组合和嵌入式毛利率
    notes: 本表列出官方定价、伙伴和产品页面可见的变现面；分部收入金额大多未披露，所以当前价值 / 状态混合了已报道事实和明确尽调问题。
