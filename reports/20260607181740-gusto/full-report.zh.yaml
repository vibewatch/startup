      - number: '7.3'
        title: 合作伙伴与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Gusto 的产品广度越来越依赖一张战略上有吸引力、但运营上脆弱的依赖图。最明显的单点依赖是基础设施：PCMag 称 Gusto 在 AWS 上运行数据库和生产服务；AWS
              自身安全材料强调日志、自动化和事件响应，而不是可迁移性。如果 Gusto 生产环境仍以 AWS 为中心，宕机或配置问题会同时传导到薪资、承包商付款、HR 工作流和金融产品。第二组依赖落在 Gusto Money
              内部。Payroll Bridge 依赖 Parafin 和 Celtic Bank，账单支付和开票依赖 Melio，这意味着资金流转可靠性和合规已不再完全位于 Gusto
              自己的软件边界内。同样逻辑也适用于福利和退休。Gusto 的福利栈依赖持牌顾问、经纪人集成、承保机构和由 Guideline 驱动的 401(k)
              工作流；承保机构连接、经纪人权限或退休计划服务任何一处出问题，都可能反噬薪资扣款和员工信任。


              分发层也带有自身的集中度风险。Gusto 称 18,000+ 家会计师事务所参与其合作伙伴计划，最高层级可获得最高 20% 收入分成。这种广度是一条护城河，但公开记录没有披露来源 ARR
              或头部事务所集中度，因此投资人无法判断少数大型事务所是否对获客或留存有不成比例的影响。AI 功能又加入一条更新的依赖链。Gusto 2026 年发布叙事明确点名 ChatGPT 和 Claude
              集成；Anthropic 与 OpenAI 状态页都显示近期发生过事故，或 API 正常运行时间并非完美。这不意味着 AI 功能存在生死级脆弱性，但确实意味着，Gusto
              越把审批、分析或薪资相邻动作推入第三方模型层，就越会继承来自不可控供应商的宕机、延迟和输出质量风险。最后，Mosey 和 Guideline
              都是战略上合理的收购，但每一项都在客户最期待低错误执行的地方，增加了集成和产品一致性负担。
