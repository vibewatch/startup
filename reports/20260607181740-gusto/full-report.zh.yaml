  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              约 $9.3 billion 的估值下，Gusto 已经不再像一家困境私营公司那样定价，但也没有被按增长最快的 HR 十角兽估值。公司现在有超过 $1 billion 的实际过去收入、500,000+
              客户、连续五个季度加速增长，并且自 2023 年起自由现金流为正。这组组合重要，因为多数后期薪资和 HCM 公司要么增长更强但现金生成更弱，要么利润率更好但增速明显更慢。基于此，约 9x
              收入倍数足够可辩护，能够支持在当前二级市场水平上采取买入（观察）立场。谨慎理由同样清楚：市场自 2022 年以来一直把 Gusto
              维持在大致相同的表观估值附近，说明投资人在公司证明下一段规模曲线之前，仍认为上方有天花板。因此，正确姿态是建设性但价格敏感：选择性买入，按温和基准情景承保，不要假设私募市场热情会自动回归。
            claimRefs:
              - CV001
