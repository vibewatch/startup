        title: 架构、集成与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开架构读数是一套云交付 SaaS
              栈：雇主端和员工端移动界面位于薪资与记录核心之上，周边工作流模块再同步回同一系统记录。官方薪资、工时和移动页面显示，薪资、工时表、PTO、费用、入职和工资单管理功能都流经同一界面；PCMag
              还给出少见的基础设施细节，称 Gusto 在 AWS 上运行数据库和生产服务，并采用传输中 TLS、MFA、备份和欺诈监控。集成故事很宽，但控制也很谨慎。Gusto
              的应用目录和薪资页面暴露许多具名集成，文档也显示其 OAuth 开发者工具、沙盒公司、QA 和限定范围生产密钥都相当认真。但同一批文档也明确，API 模型以合作伙伴为中心：尚不支持直接的客户公司系统 API
              访问，并非所有用例都会获批，生产发布需要安全审查和预批准。这个组合指向真实架构和真实可扩展性，但还不是完全开放的企业平台。
