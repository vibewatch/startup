      - number: '2.5'
        title: 矛盾、负面角度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的负面角度不是需求崩塌，而是定义膨胀。同一个市场可以看起来像 $8.9 billion 的薪资服务品类、$12+ billion 的美国薪资软件品类、$28.6 billion
              的更宽薪资服务报告、$44+ billion 的全球 HR 科技相邻市场，或 $80.9 billion 的簿记加薪资服务行业。这些数字不能互换。若没有范围纪律就使用更宽口径，会夸大 Gusto 当前
              SAM，尤其因为公司仍主要聚焦美国，而数量最多的雇主是最小、支出最低的企业。

              仍有一些重要尽调问题未解。可取得的第三方证据无法精确锁定 2026 年新薪资实施中云端占比、Gusto 500,000 家客户内的细分组合，或 Gusto、ADP、Paychex、Rippling 等供应商在
              SMB 市场的逐家份额。同样，关于薪资切换成本和流失的高质量公开基准也很薄。市场机会显然足够大，但更合适的投资判断是把 TAM 当作区间，按仅雇主相关性校准，并观察 Gusto
              能否继续上探市场和交叉销售，同时不丢掉微型 SMB 客群的价格匹配。
