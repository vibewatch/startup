  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Gusto 的监管边界比普通 SMB SaaS
              厂商更宽，因为公司卖的已经不只是薪资界面。当前公开产品栈覆盖薪资税申报、健康保险经纪与经纪人集成、退休计划管理、承包商和跨境付款，以及包含账单支付、开票和薪资信用额度的 Gusto Money
              工具。这意味着主要法律风险不是某一起轰动诉讼，而是一层层叠加的合规栈：申报错误、工时工资误算、隐私漏洞或牌照遗漏，都可能同时带来直接处罚和信任冲击。IRS
              指引明确要求雇主按时缴存并申报联邦雇佣税，并在过往申报出错时使用特定更正流程。Gusto
              对外宣传可自动申报联邦、州和地方表格，因此任何系统性产品或服务故障，都会正好打中客户外包出去、用来避免处罚的工作流。公开负面评价说明了为什么这很重要：一些客户声称，在依赖 Gusto
              税务工作流后，出现少缴税款、留置权、罚款和滞纳金争议。


              消费金融相邻业务又加了一层风险。Gusto Money 现在通过 Parafin、Celtic Bank 和 Melio 等合作伙伴，把用户导向 Payroll Bridge
              信贷、账单支付和开票；与此同时，CFPB 执法案卷持续瞄准非银支付、汇款和雇主发薪工具。正确解读不是 Gusto 已经遭到 CFPB
              行动，而是公司已经踏入一个受监控的边界，披露、服务、投诉处理和资金保护预期都明显高于纯薪资软件。州层面的保险和退休义务也重要。Gusto 宣传持牌顾问、经纪人集成和 20+ 个州退休强制要求；NAIC
              指引明确显示，保险销售人员牌照仍由各州管理。在 IP 上，公开专利风险比用户简报最初暗示的更窄：CourtListener 显示 Patent Armory 于 2025 年 4 月起诉 Gusto，但双方在
              2025 年 6 月撤诉，因此残余风险是未来专利主张再次出现，而不是 2026 年仍悬在法庭上的活跃案件。
