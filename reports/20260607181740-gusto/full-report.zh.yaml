      - 公开角色
      - 关键依赖
      - 重要性
      - 公开缺口 / 风险
    rows:
      - - Web + 移动控制平面
        - 雇主和员工应用暴露薪资、工时、入职、费用、福利和薪酬管理
        - 浏览器、iOS/Android 应用质量、应用商店分发
        - 让 Gusto 不止是桌面薪资控制台，而是能在运营中发挥作用
