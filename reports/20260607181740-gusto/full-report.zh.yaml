      - number: '8.2'
        title: 可比公司背景与天花板争论
        blocks:
          - type: paragraph
            body: >-
              可比组把 Gusto 放在一个不寻常的中间地带。私营品类龙头仍拿到丰富得多的估值：Rippling 2025 年 5 月融资估值 $16.8 billion，CNBC 后来称其 2025 年 ARR 超过 $1
              billion；Deel 2025 年 10 月一轮融资在披露 $1 billion+ ARR 基础上估值 $17.3 billion。相比之下，公开市场薪资和 HCM 公司当前市值倍数低得多：Paycom 和
              Paylocity 大致处于低个位数到高个位数收入倍数，Paychex 是最强的成熟类比，约为中个位数；Workday 和 ADP 仍是大盘软件和薪资基准，而不是直接的小企业薪资同业。这样一来，Gusto
              位于中间：明显低于高溢价私营龙头，明显高于增速较慢的上市公司。反向角度是，2022 年以来估值持平可能说明，投资人把 Gusto 看作有边界的美国本土薪资复利公司，而不是定义品类的全球平台；Guideline
              收购价格与 Guideline 此前私募估值的对比，也强化了这种天花板风险。
