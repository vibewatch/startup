  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 维度
      - 公开证据
      - 上行空间
      - 风险
      - 尽调问题
    rows:
      - - 从薪资扩展到福利 / 退休
        - 健康保险、工伤保险、税收优惠福利和 401(k) 已嵌入定价和客户故事
        - 客户成熟后抬高 ARPU 和切换成本
        - 接入更多工作流后，支持或申报质量一旦滑坡，破坏面会更大
        - 索取按队列划分的绑定率，以及按附加产品划分的毛利率
      - - 从薪资扩展到 HR / 入职 / 合规
        - RealWork Labs、Magpie 和薪资页面都突出入职、文档存储、州级合规和员工自助服务
        - 把产品做成更宽的雇佣运营系统，而不只是单一工具
        - 规模扩大后，产品复杂度和服务负担可能更难管理
        - 索取按模块划分的产品采用率和每模块支持工单数
      - - 会计师渠道杠杆
        - 合作伙伴页面提到 18,000+ 家事务所和最高 20% 收入分成；Dark Horse 和 Lance CPA 展示了活跃会计师使用场景
        - 嵌入式顾问能以低 CAC 获客并留住客户
        - 渠道依赖可能掩盖获客集中度或价格让利
        - 索取渠道贡献 ARR、合作伙伴留存，以及头部会计合作伙伴集中度
      - - SMB 宏观暴露
        - Sacra 指出，按员工计费模型对经济下行造成的员工数减少敏感
        - 庞大 SMB 市场仍有大片空白，并且新企业持续形成
        - 经济衰退或小企业承压时，席位数和产品需求会迅速走弱
        - 索取以往宏观放缓期间的留存和降购行为
      - - 上探市场与竞争流失
        - RealWork Labs 和 Dark Horse 显示 Gusto 触达了一些中型客户，但 Sacra 将 Rippling 和 Justworks 描述为更宽的平台替代选项
        - 在客户需要企业级工具之前，Gusto 可以向更复杂的 SMB 延展
        - 部分成长型客户可能升级到更宽的全球化或 IT 集成套件
        - 索取按客户规模划分的赢单 / 输单数据，以及按竞争对手划分的流失原因
      - - 国际化限制
        - 定价页面称可向 120+ 个国家的承包商付款，但公开证明仍集中在美国薪资和国内合规
        - 对偶尔使用全球承包商的 SMB 有用
        - 这不等于完整全球薪资或 EOR，Deel / Rippling / Remote 仍有明确产品优势
        - 索取当前国际收入结构和跨境扩展路线图
      - - 收入集中度披露
        - 未找到公开头部客户 ARR 明细表或渠道组合披露
        - 客户 logo 广度降低了单一 logo 集中的担忧
        - 仅凭公开数据仍无法排除经济集中度
        - 索取前 10 和前 25 客户 ARR 集中度，以及最大客户历史
    notes: 公开证据最强的是扩张路径，最弱的是硬集中度数字。正确解读是：客户广度和渠道杠杆偏正面，但收入集中度和真实留存经济性仍取决于私有数据室披露。
