      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              把估值写成明确情景测算，而不是单点估计，最有用。乐观情景下，Gusto 2027 年收入达到约 $1.5 billion，证明非薪资平台可持续，并受益于更友好的 IPO 市场；这支撑 15x 倍数和约 $22.5
              billion 价值。基准情景下，增长保持健康但继续放缓，收入达到约 $1.2 billion，10x 倍数对应约 $12 billion。悲观情景下，竞争和宏观压力把增长推向十几个百分点中段，收入只达到约
              $1.15 billion，市场支付 7x，对应约 $8 billion。相对于 $9.3 billion 入场点，这些结果意味着总回报分布很宽：若 IPO
              窗口重开，上行强劲；基准情景只有温和升值；若市场认为当前估值已贴现大部分前进空间，则会出现资本受损。
            claimRefs:
