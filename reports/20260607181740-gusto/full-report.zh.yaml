      - number: '1.6'
        title: 负面事件与风险信号
        blocks:
          - type: paragraph
            body: >-
              多个负面事件和风险因素会影响对 Gusto 的尽调判断。最重要的运营负面事件是 2023 年 2 月裁员约 126 人（约占员工 5%），发生在 2021 和 2022
              年融资高点之后、宏观环境恶化之时。公司此后已恢复员工增长，但这次裁员说明公司对宏观周期敏感。诉讼方面，Patent Armory Inc. 于 2025 年对 Gusto 提起专利侵权诉讼（案号
              1:25-cv-00467），请求赔偿、律师费和诉讼费用；截至 2026 年中，该案仍在进行。New Jersey Bankruptcy Court 曾有一起对抗程序（Straffi, Trustee v.
              Gusto, Inc.）在 2023 年形成针对 Gusto 的金钱判决，2024 年初和解后该判决被撤销，事项关闭。尽管同期收入几乎翻倍，公司估值自 2022 年初以来仍约为
              $9.3B，形成相对估值下修，反映更广泛的科技市场倍数压缩。Gusto 的 IPO 时间仍不确定；截至 2026 年 5 月，公司拒绝分享时间表，IPO 市场也依然挑剔。截至报告日，公开数据库中未发现
              CFPB、SEC 或 IRS 对 Gusto 采取重大执法行动。
