      - number: '1.5'
        title: 战略收购与合作伙伴渠道
        blocks:
          - type: paragraph
            body: >-
              Gusto 完成了两笔战略收购，大幅扩展平台边界。2025 年 10 月，Gusto 以约 $600 million 收购 Guideline，这是一家专注于中小企业 401(k) 退休计划的创业公司。自
              2015 年起，Guideline 一直是 Gusto 最受欢迎的 401(k) 合作伙伴，服务约 65,000 家企业、超过一百万名储蓄者，并管理超过 $20 billion 资产。该交易估值低于
              Guideline 2021 年 $1.15B 的峰值估值，并伴随一项计划：剥离与竞争性薪资平台相连的 Guideline 账户。2026 年 4 月，Gusto 收购 AI 驱动的合规自动化创业公司
              Mosey，用于搭建 “Gusto Business Compliance”——让企业在 Gusto 平台内管理多州薪资注册、年度申报、续期和其他监管义务。小企业平均每名员工每年合规成本约
              $14,700，Gusto 与 Mosey 的整合直接切中这一痛点。Gusto 的会计师合作伙伴渠道是另一根战略杠杆：公司通过分层 Partner Program（Silver、Gold、Platinum）与超过
              10,000 家会计和税务机构合作，提供最高 20% 的收入分成，并向合作机构免费提供 Gusto Plus 订阅。该渠道带来大量获客，并通过嵌入式会计师关系形成更稳的留存。
