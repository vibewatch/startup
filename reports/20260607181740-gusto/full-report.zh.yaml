      - number: '8.4'
        title: 最终尽调问题与投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >-
              剩下的工作不是判断 Gusto
              是否是一家好公司；前几章已经支持这一点。真正的承保问题是：今天的二级市场入场价，相对下一次流动性事件是否有足够安全边际。这意味着最高价值的尽调集中在定价机制、整合质量和竞争耐久性。投资人应确认老股交易的精确每股价格和优先股堆叠，理解
              Guideline 相关剥离或客户流失是否会削弱预期退休业务提升，并询问管理层，哪些具体运营里程碑会让 2026 或 2027 年 IPO 变得现实。若增长降至约 20%
              以下且没有相应利润率改善，若下一次估值或二级市场成交价低于 $9.3 billion，或若出现相对 Rippling、Deel、ADP
              或其他薪资老牌厂商的明确份额流失证据，投资逻辑就会破裂。这些都是可监控、与决策相关的条件，因此建议是 买入（观察），而不是盲目开绿灯。
