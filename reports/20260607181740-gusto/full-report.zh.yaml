  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 支撑证据
      - 决策含义
    rows:
      - - 投资建议
        - 买入（观察）
        - 在 >$1B 实际过去收入、~30% 增长和自由现金流转正的背景下，~$9.3B 估值支撑建设性的入场判断，不需要激进假设。
        - 可在老股交易中选择性加仓，但在尽调补上要约和整合缺口前，仓位保持适中。
      - - 信心
        - 中
        - 核心运营证据很强，但回报结果仍高度受 IPO 时间、倍数扩张和具体老股条款影响。
        - 不要默认按乐观情景做投资测算；用基准情景作为仓位锚。
      - - 风险评级
        - 中
        - 业务质量看起来高，但 2022 年以来估值持平、市场对以美国为中心 TAM 的认知，以及收购支出，都带来真实的天花板风险。
        - 持有公司，不持有叙事：按季度跟踪下行触发因素。
      - - 估值立场
        - 合理至有吸引力
        - 筛选来看，Gusto 比 Rippling、Deel 等私营龙头便宜，但比成熟上市薪资同业更贵；增长叠加现金生成，可以支撑中间区间倍数。
        - 只有增长和 FCF 持久性延续，才可以接受相对上市薪资公司的溢价。
      - - 基准情景结果
        - ~$12B 估值 / ~1.3x 总 MOIC
        - 基准情景假设 $1.2B 收入和 10x 倍数，相比今天的估值标记提升并不大。
        - 入场纪律仍然重要，因为基准情景只是不错，并不惊艳。
      - - 主要上调 / 下调信号
        - 若 IPO 准备度可信、非薪资产品附加率持久，则上调；若增长低于 20% 或下一次估值标记更低，则下调。
        - 能解决天花板争议的同一批证据，也会改变投资建议。
        - 用明确监控替代静态信念。
    notes: 这份摘要刻意把公司质量和价格敏感性拆开。投资建议偏建设性，因为运营证据真实；但前提仍是估值纪律，以及 2022 年以来估值持平最终被证明是暂时的，而不是结构性的。
