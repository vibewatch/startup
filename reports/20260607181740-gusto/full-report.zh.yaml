  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长降档
        - 收入增长低于 ~20%，且利润率没有相应抬升
        - 摧毁相对成熟上市薪资可比公司支付溢价的理由。
        - 从买入（观察）下调至持有或放弃，等待重新做投资测算。
      - - 估值标记下调
        - 新的要约、融资或老股成交价低于 $9.3B
        - 确认估值持平不是暂时现象，下行风险仍未完全出清。
        - 在弄清估值重置前，将其视为新增资本的终止触发因素。
      - - 整合表现不及预期
        - Guideline 附加率或留存明显不及计划，或剥离损伤客户基础
        - 拿掉支撑未来倍数扩张的多产品扩张故事中关键一环。
        - 降低确信度，削减乐观情景权重。
      - - 竞争份额流失
        - 明确证据显示 Rippling、Deel、ADP 或其他薪资同业正在抢走核心客群或定价权
        - 削弱护城河，也削弱增长和退出倍数假设。
        - 立即重新做投资测算；如果压力看起来是结构性的，考虑退出。
      - - IPO 窗口持续关闭
        - 即便运营结果强劲，到 2027 年底仍看不到可信的上市流动性路径
        - 推迟变现，并可能压住私募市场重估上行空间。
        - 降低持仓，并要求更高的老股入场折价。
      - - 现金灵活性恶化
        - 债务负担或收购支出开始挤出内生产品投入
        - 叙事从高效复利增长变成资产负债表管理。
        - 除非现金生成证据抵消风险，否则下调。
    notes: 这些不是假设性谈资，而是绑定估值模型的明确决策规则。任一规则触发后，公司可能仍然不错，但当前入场投资逻辑会改变。
