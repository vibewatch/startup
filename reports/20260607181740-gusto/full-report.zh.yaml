      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              Gusto 的核心承保风险，是在薪资或合规关键窗口出现运营信任失败。Gusto 自己的页面承诺自动税务申报、几分钟跑完薪资、50
              州注册支持、当日和即时付款，以及让薪资经理离开办公桌也能操作的移动工作流。这些功能商业上很有吸引力，但也压缩了质量错误的容忍空间。公开评价反复描述一些问题，而这些问题重要正是因为薪资是任务关键场景：付款延迟、税务处理错误或延迟、支持排队、福利扣款混乱，以及在截止日期前难以解决边缘问题。PCMag
              总体正面的评测反而强化了这条风险逻辑：它称赞 Gusto 的广度和易用性，同时确认 Gusto 现在已经覆盖 AI
              辅助薪资准备、账单支付、开票、当日和即时付款、费用工作流，以及移动管理界面。产品暴露面增长得比公开可靠性证据更快。


              安全风险同样不对称。Gusto 存储薪资数据、福利数据、税表和金融账户流；FTC 指引显示，处理金融信息的机构应维护书面安全计划、风险评估、加密、MFA、日志、供应商监督、事件响应计划和泄露通知。CISA 和
              NIST 都强调，面向 SMB 的系统需要持续加固、漏洞扫描、日志、MFA 和云配置控制；Cybersecurity Dive 报道称，过去一年三分之一的 SMB 遭遇网络攻击，平均成本接近
              $255,000。Gusto Money 称合作伙伴使用银行级加密和 MFA；PCMag 称 Gusto 使用
              AWS、TLS、MFA、备份和欺诈监控。这在方向上令人安心，但公开信任中心披露仍然很薄，公司也不发布数字化薪资平台 SLA 或详细正常运行时间历史。因此，实际风险不是 Gusto
              完全没有控制，而是投资人还无法验证：在一个 AI 已经撰写约一半新代码、并帮助处理一半支持量的技术栈里，控制成熟度、QA 覆盖和事件处理是否跟得上。
