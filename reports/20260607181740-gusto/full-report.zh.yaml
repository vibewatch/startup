      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求驱动强，且主要是结构性的。第一，监管复杂度持续上升：州级休假规则、加班变化、税务更新和退休强制要求，让小团队管理薪资更难。California 的 CalSavers 扩围尤其相关，因为 2026
              年连只有一名员工的企业也会被纳入合规网。第二，产品架构在改善：云交付、一体化 HR / 薪资套件、自动化和 AI
              驱动的异常检测，让小雇主能买一个系统，而不是把多个点状工具缝在一起。第三，企业和劳动力流动仍足够高，新雇主和变化中的员工数会持续创造新的薪资设置需求。

              但这个市场并非没有摩擦。切换薪资系统仍需要数据迁移、验证和集成工作，会拖慢竞争替换。网络安全、隐私和税务引擎维护同时抬高买方焦虑和供应商成本。AI 采用是真实的，尤其在 SMB HR
              团队中，但政策和治理明显落后于使用。最重要的是，剩余空白并不均质：微型企业数量多，却往往不愿为完整软件栈付费，直到合规事件、招聘爆发或福利要求逼到眼前。因此，增长仍应保持吸引力，但不能假设每一家小雇主都以相同速度或
              ARPU 转化。
