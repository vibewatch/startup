  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Gusto 的核心市场既不是「全部 HR 科技」，也不是完整的薪资服务宇宙。公司销售的是一层面向美国雇主型 SMB
              的一体化运营系统：从薪资处理和税务申报切入，再叠加福利管理、退休、入职、员工档案和合规工作流。把这些支出纳入范围很重要，因为薪资是系统记录入口；雇主已经信任平台后，福利、401(k)、税收抵免和合规才会继续扩张收入。

              实际上，最相关的客户是拥有 1-499 名员工的雇主型 SMB，尤其是由业主或运营负责人主导、想要软件加轻服务，而不是企业级实施项目的群体。

              当前核心范围排除了几类相邻但不同的市场：全球薪资和 EOR 服务、面向大型重采购组织的企业 HCM 套件、独立会计和 ERP，以及并不真正需要 W-2
              薪资的无雇员个体业务。许多目标买家的现状替代方案仍是手工薪资、电子表格、簿记员、会计师或传统外包机构拼成的补丁。因此，市场定义必须锚定雇主薪资复杂度，而不能只看美国企业数量这个过宽的标题数字。
