    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Gusto, Inc.（法定名称 ZenPayroll, Inc.，以 Gusto 名义经营）由 Joshua Reeves、Tomer London 和 Edward Kim 于 2011 年在
              California 州 San Francisco 创立。公司在 2012 年 12 月推出首个产品——面向小企业的云端薪资发放服务；2015 年 9 月从 ZenPayroll 更名为
              Gusto，反映其目标已从薪资扩展到健康福利、HR 工具和合规。截至 2026 年 6 月，Gusto 仍是处于后 Series E 阶段的私营公司，总部位于 San Francisco，最大美国办公室在
              Denver。公司的核心使命是成为小企业的主要伙伴，承接薪资、税务合规、健康福利、401(k)、HR 和各类合规事务，让企业主把精力放回增长。Gusto 的商业模式是订阅
              SaaS：客户按月支付基础费用（$40–$180/month，取决于套餐层级），再按员工支付月费（$6–$22）。三档主套餐——Simple、Plus 和
              Premium——服务从几名员工到数百名员工的小型至中型企业。Gusto 还通过增值服务收费，包括次日直接存款、健康保险经纪、401(k) 管理、R&D 税收抵免服务，以及面向员工的金融账户产品 Gusto
              Money。Gusto 现在超过一半的 ARR 来自核心薪资之外的产品，确认平台已成功扩展为更宽的小企业运营系统。
