          - type: paragraph
            body: >-
              公开单位经济性只露出一部分，但已有足够证据给业务框出范围。用公司 500,000 家客户里程碑对照 $1 billion 过去 12 个月收入门槛，意味着每家企业年收入约 $2,000，或每月约
              $167。把附加项纳入后，这与小雇主薪资软件经济性大致匹配，也与 Gusto 官方标价加按员工收费的方向一致。仍保持私有的数据比公开数据更重要：Gusto 不披露实际
              CAC、回本期、毛利率、净收入留存、流失率或按产品线划分的细分收入。因此，最好的公开解读只能是推断式的。鉴于薪资在运营上有粘性，超过一半 ARR 现在来自非薪资扩张产品，且合作伙伴渠道嵌入分销模型，一个低置信度的
              100%–110% NRR 和低于 10% 年流失率估计在方向上站得住。毛利率可能低于最佳纯 SaaS，因为薪资税申报、合规支持、福利管理和支付运营都会增加服务交付成本，因此 60%–70% 的估计比 80%+
              软件假设更可辩护。
