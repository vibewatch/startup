        - 当前
        - 新招聘、新设机构和角色变化让薪资设置需求持续复现
        - 跟踪新企业转化与替换赢单的对比
      - - 切换成本与迁移摩擦
        - 约束
        - 持续存在
        - 拖慢竞争性替换，拉长替换销售周期
        - 按供应商寻找独立的流失 / 切换成本基准
