  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 风险
      - 司法辖区 / 边界
      - 当前状态
      - 发生概率
      - 严重性
      - 缓释措施 / 公开控制
      - 剩余暴露 / 投资含义
      - 尽调路径
    rows:
      - - 薪资税汇缴或申报失败
        - IRS + 州 / 地方税务机构
        - 实时运营风险；Gusto 对外主打自动申报和更正工作流
        - 中
        - 危急
        - 自动申报、50 州注册支持、聚焦薪资税产品
        - 系统性计算或汇缴错误会带来罚款、留置权、赔付成本，并立即损害客户信任
        - 索取按税表类型划分的税务解决积压、申报错误率、罚款赔付和月度缺陷趋势
      - - 客户工时工资或福利扣款误算
        - 州劳工机构 + 私人索赔律师群体
        - 任务关键软件风险；反向评论提到薪资、福利和扣款争议
        - 中
        - 高
        - 薪资加福利一体化工作流、支持团队、AI 辅助准备
        - 扣款错误或发薪时点错误可能引发员工索赔、客户流失或赔偿争议
        - 索取扣款、工资扣押、加班和追溯薪资调整的错误率数据；审查客户赔偿条款
      - - CFPB / FTC 对 Gusto Money 及合作伙伴主导信贷或支付工作流的审查
        - 消费金融和非银行支付边界
        - 未发现针对 Gusto 的已知行动，但产品现在包括 Payroll Bridge、账单支付和开票
        - 中
        - 高
        - 合作贷款方和支付提供商、银行级加密、MFA、产品免责声明
        - 消费金融邻近业务把披露、服务、投诉处理和资金保障预期扩展到纯薪资 SaaS 之外
        - 梳理哪些实体负责贷款、支付、投诉和 KYC；索取 Payroll Bridge 和资金产品的审计 / 合规备忘录
      - - 州级保险代理人牌照和福利经纪合规
        - 50 州保险和福利管理边界
        - 持续性监管要求，因为 Gusto 宣传持牌顾问和经纪集成
        - 中
        - 高
        - 持牌顾问、经纪集成工作流、保险公司网络、与薪资同步的注册
        - 牌照或委任缺口可能损害福利扩张，并在关键州制造监管暴露
