  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模、增长与结构迁移
        blocks:
          - type: paragraph
            body: >-
              Gusto 的收入画像对一家私营 SMB 软件公司来说少见地强。2026 年 5 月，公司称过去 12 个月收入已突破 $1 billion，TechCrunch 也明确说明该数字反映的是此前 12
              个月赚到的实际收入，而不是年化 ARR。同一份公司披露把这一里程碑与超过 500,000 家小企业客户、连续五个季度增长加速联系起来；Yahoo Finance 转载的 Fortune 报道还补充，Gusto 在
              2023 财年已经创造超过 $500 million 收入。Sacra 的 2025 年模型随后补上中间桥：2024 年收入约 $750 million，2025 年收入约 $975 million，意味着公开
              $1 billion 里程碑前一年同比增速约 30%。更重要的质量信号不是规模，而是结构。管理层称，现在超过一半 ARR 来自薪资之外的产品，第三方报道也称 401(k) ARR 在 2024 年增长约
              50%，Gusto Money 增长超过 140%。这个组合让公司不再像单功能薪资工具，而更像多产品 SMB 雇佣与金融运营平台。
