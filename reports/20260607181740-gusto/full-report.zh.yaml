      - 2027 收入
      - 退出倍数
      - 隐含估值
      - 相对 $9.3B 的约略总 MOIC
      - 关键假设
      - 主要风险
    rows:
      - - 乐观
        - $1.5B
        - 15x
        - $22.5B
        - ~2.4x
        - IPO 市场恢复、持续 ~25%+ 增长、Guideline/Mosey 整合成功，非薪资组合扩张。
        - 既需要执行兑现，也需要倍数扩张，不能只靠其中之一。
      - - 基准
        - $1.2B
        - 10x
        - $12.0B
        - ~1.3x
        - 持续健康增长，但倍数扩张有限，IPO 需求选择性恢复。
        - 如果市场仍把 Gusto 当作高端私营薪资资产，而不是突破型平台，上行空间真实存在但不夸张。
      - - 悲观
        - $1.15B
        - 7x
        - ~$8.0B
        - ~0.9x
        - 增长降至十几个百分点中段，公开市场可比公司倍数持续受压，竞争压力上升。
        - 下一次估值标记更低或整合失败，会让今天的入场变成风险调整后很差的押注。
    notes: 这些情景刻意保持简单透明。目标不是电子表格式精确，而是给出可决策的区间，把运营假设同估值和回报结果连起来。
