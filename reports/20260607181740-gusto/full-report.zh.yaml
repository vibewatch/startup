      - number: '6.2'
        title: 采用轨迹与具名生产证据
        blocks:
          - type: paragraph
            body: >-
              客户数轨迹已经不再只是模糊的标识墙叙事。Sacra 2026 年 1 月的画像称，Gusto 直接 SMB 客户从 2024 年 8 月的 300,000 家增至 2025 年 3 月超过 400,000
              家；Gusto 2026 年 5 月的收入发布又把当前披露数字提高到 500,000+ 小企业，并补充称仅上个季度就新增约 50,000
              家客户。这个规模更重要，是因为它旁边已经有具名部署证据，而不只是收入线上的炫耀。Reach 是一家 16 人数字营销机构，它描述了如何摆脱手工薪资流程，并用 Gusto 提供健康福利和 PTO。RealWork
              Labs 是一家 50+ 员工软件公司，它称 Gusto 帮助其升级入职流程、支持远程州合规，并把福利和承包商工作流打包进一个系统。Lemon Yellow
              描述了从手工支票转向更专业的薪资与福利配置。Magpie Health Analytics 在十个州用 Gusto 管理薪资、HR 和福利；Dark Horse CPAs 则在内部使用该平台，并覆盖 275+
              客户的会计师账本。合在一起，这些案例支撑了 Gusto 在极小公司、成长型创业公司、受监管医疗健康场景，以及会计师中介型 SMB 关系中的真实生产使用。主要限制是，相比 500,000+
              客户基础，最深的公开证据仍只是小样本。
