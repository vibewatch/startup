      - number: '5.5'
        title: 约束与尽调风险
        blocks:
          - type: paragraph
            body: >-
              主要产品技术空头案例不是 Gusto 缺少功能，而是最重要的风险正好落在客户最不希望失败的位置：薪资准确性、税务 / 合规处理、支持响应，以及美国本土 SMB 核心之外的产品边缘。公开文档显示，API
              面经过思考但仍有闸门，开放开发者社区信号温和，关于正常运行时间、企业级规模基准或完全透明证明材料包的公开证据很少。国际广度是另一个清晰限制。Gusto
              可以向许多国家的承包商付款，但产品叙事仍围绕美国薪资、福利和合规，而不是广泛的跨国雇佣基础设施。支持风险信号在这里也比非关键任务应用更重要，因为薪资错误、存款失败或税务修复延迟，会直接打到工资、罚款或福利管理。因此，尽调姿态应继续认可产品质量和路线图，但要以更深入的可靠性、信任文档、API
              路线图，以及 Mosey 支撑的 Business Compliance 真实部署状态私有审查为条件。
