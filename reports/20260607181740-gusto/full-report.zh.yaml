      - number: '2.2'
        title: 市场规模与渗透率
        blocks:
          - type: paragraph
            body: >-
              需要多个规模口径，因为不同发布机构对这个品类的定义差异很大。Mordor Intelligence 将狭义美国薪资服务市场估为 2025 年约 $8.44 billion、2026 年 $8.91
              billion，其中 SMB 细分以 10.95% CAGR 增长最快。Emergen Research 使用更宽的美国 HR 薪资软件定义，2024 年达到 $12.34 billion，并预计 2034
              年达到 $28.45 billion。The Business Research Company 进一步扩到全球 HR 薪资软件市场，2026 年为 $42.78 billion；IBISWorld 的
              $80.9 billion 薪资与簿记服务口径更宽，因为包含大量服务型簿记工作，并不是 Gusto 的软件 SAM。这些数字与其说矛盾，不如说范围换了。

              自下而上的口径对 Gusto 更有用：约 5.52 million 家美国雇主型 SMB，乘以每月约 $150-200 的薪资 / HR 支出，对应年度核心机会约 $9.9-13.2 billion。Gusto
              拥有超过 500,000 家客户，约渗透了这个雇主型 SMB 基数的 9%。用同一官方客户数和公司的过去 12 个月收入里程碑推算，SOM 约为每年 $1 billion，平均每家企业年收入约
              $2,000；这与“薪资加交叉销售”模型一致，而不是单纯的薪资工具。
