        title: 信任、质量与移动执行
        blocks:
          - type: paragraph
            body: >-
              公开信任证据在方向上积极，但单独来看还不足以支撑企业级尽调。产品页面突出合规仪表板、认证 HR 专家、税务自动化、休息政策支持、远程 I-9 验证和面向员工的金融工具。官方移动页面和 Google Play
              列表确认，Gusto 不只是桌面管理产品；薪资运行、工时表审批、入职、提前领薪、福利访问、文件签署和费用提交都被推入移动应用。第三方产品评论也很强：PCMag 给 Gusto 五星 Editors’ Choice
              评级，TechRadar 称其在 SMB 薪资和合规上可靠。但这些正面信号旁边也有有意义的负面信号。归档的 Trustpilot
              评论包含对定价透明度、税务处理、支持响应和付款延迟的投诉，信任中心本身在公开细节上也偏薄。这个组合说明，产品足够好，能赢得并留住 SMB，但当薪资、支持或合规执行滑坡时仍有暴露。
