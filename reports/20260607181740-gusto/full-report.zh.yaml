  - id: TU004
    title: 留存 / 重复使用 / 满意度表
    columns:
      - 信号
      - 数值 / 观察
      - 指向什么
      - 主要限制
      - 尽调问题
    rows:
      - - 官方薪资满意度信号
        - 薪资页面称，9/10 客户愿意推荐 Gusto，平均评分为 4.5/5
        - 当前满意度和产品市场匹配度在方向上较强
        - 公司展示指标，不是第三方队列留存
        - 索取底层调查窗口、方法论和细分客群组合
      - - 合规信心
        - 薪资页面称，88% 认同 Gusto 帮助其保持合规
        - 合规自动化似乎是核心留存驱动
        - 仍是态度调查指标，不是可观察续约行为
        - 索取按产品队列划分的支持工单和申报错误趋势数据
      - - 第三方评论深度
        - 定价页面引用 Capterra 上 4.6 星、4,137 条评论；Software Advice 归档显示整体 4.6 分、3,873 条评论
        - 大规模评论量支撑广泛使用和整体正面情绪
        - 评论均值不是留存经济性，也可能滞后于当前支持问题
        - 索取近期评论趋势、已验证账户组合，以及按公司规模划分的队列
      - - 具名客户耐久性轶事
        - Reach 称福利帮助实现了几乎没有流失；RealWork Labs 称随着员工数增长，Gusto 跟着一起扩展
        - 薪资加福利的一体化使用可以变成高粘性运营骨干
        - 案例研究轶事不能替代已披露的 GRR 或 NRR
        - 索取按产品深度划分的实际流失、续约和扩张数据
      - - 结构性切换成本
        - 定价页面和 Sacra 都强调数据迁移支持、福利与薪资同步，以及向 HR、合规和 401(k) 扩展
        - 接入更多工作流后，年中切走在运营上会很痛
        - 如果支持掉链子，结构性粘性并不保证客户满意
        - 索取竞争替换尝试中的挽留率数据，以及历史迁移流失
      - - 反向评论证据
        - Trustpilot 投诉反复提到定价透明度、支持排队、税务解决问题和国际承包商限制
        - 即使产品楔子很强，执行问题也会威胁留存
        - Trustpilot 偏向不满用户，会放大最差情形
        - 索取支持 SLA 达成率、税务解决积压，以及国际付款事故率
      - - 公开留存指标缺口
        - 未找到公开 NRR、GRR、流失、合同期限或真实队列表
        - 真实客户耐久性仍需私下尽调
        - 缺少证据不等于存在弱点，但这一点很重要
        - 索取按产品包划分的季度留存桥和队列表
    notes: 该表把公开满意度与切换成本代理指标，同真实续约经济性区分开。Gusto 的公开证据足以提示粘性，但若没有私有数据，仍不足以支撑对真实留存的判断。
