      - number: '1.3'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              Gusto 自创立以来通过股权和债务融资累计筹集超过 $929.8 million，至少横跨十二轮。早期资金来自 Y Combinator（2012 加速器，$100K）、2012 年 12 月 $6.1M
              种子轮（Google Ventures 等），以及 2014 年 2 月由 Google Ventures 领投、Kleiner Perkins 和 General Catalyst 参投的 $20M
              Series A。Series B（$60M，2015 年 4 月）由 CapitalG（Google 的成长基金）领投，建立了长期锚定关系。$140M Series C（2018 年 7 月）引入
              Dragoneer、T. Rowe Price、MSD Capital 和 Y Combinator Continuity；$200M Series D（2019 年 7 月）估值 $3.8B，引入
              Fidelity、Generation Investment Management 等。$175M Series E（2021 年 8 月）由 T. Rowe Price 领投，估值约
              $9.5B，并伴随面向员工的二级要约收购。2022 年 5 月 $55M 的 Series E 延伸轮把该轮扩至约 $230M。2025 年 11 月，Gusto 完成 $178.5M
              一般债务融资。最近一次估值事件是 2025 年 6 月由 Ontario Teachers' Pension Plan（Teachers' Venture Growth 部门）领投、超过 $200M
              的二级市场要约收购，估值 $9.3B——与 2022 年初一轮持平——为员工和早期投资人提供流动性。按 $9.3B 估值和 2025 年估计收入约 $975M（Sacra）计算，Gusto 隐含收入倍数约
              9.5x，低于类似收入规模下 Rippling 约 16.8x 和 Deel 约 17.3x。公司自 2023 年初以来自由现金流为正。
