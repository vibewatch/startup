evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board composition beyond known members (Taneja, Patil) not publicly disclosed for private company
    whyItMatters: Board control and voting rights determine strategic decisions including IPO timing and acquisition approvals
    diligencePath: Request board composition and shareholder agreements in formal data room access
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: >-
      Exact ownership stakes, pro-rata rights, and current investor cap table for all Gusto investors are not publicly
      disclosed
    whyItMatters: Cap table structure affects dilution analysis, liquidation waterfall, and governance alignment in exit scenarios
    diligencePath: Request cap table, investor rights agreement, and latest 409A valuation from company in formal diligence
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited financial statements, gross margin, EBITDA, and customer churn rate not publicly disclosed
    whyItMatters: Unit economics and retention rates are critical for valuation and IPO readiness assessment
    diligencePath: Request audited financials, gross margin by product line, and NRR/churn data in investor data room
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: minor
    topic: litigation
    missingEvidence: >-
      Full patent infringement lawsuit filing (Patent Armory Inc. v. Gusto) details, alleged infringement scope, and
      likely damages exposure
    whyItMatters: >-
      Active patent litigation could result in damages, licensing costs, or feature modifications affecting product
      roadmap
    diligencePath: Pull full docket from PACER (Case 1:25-cv-00467); request IP counsel opinion from company in diligence
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: minor
    topic: acquisition
    missingEvidence: >-
      Mosey acquisition price not publicly disclosed; integration timeline and expected contribution to Gusto Business
      Compliance not confirmed
    whyItMatters: Understanding acquisition cost and integration risk is important for assessing capital allocation quality
    diligencePath: Request Mosey deal terms, earn-out structure if any, and integration roadmap milestones
    relatedQuestionRefs:
