  - type: access-blocked
    severity: material
    topic: cloud-implementation-share
    missingEvidence: >-
      An accessible, methodology-backed 2026 source quantifying the exact share of new payroll implementations that are
      cloud-based.
    whyItMatters: >-
      The cloud-adoption direction is clear, but a precise implementation-share figure would sharpen both market-growth
      and switching-cost analysis.
    diligencePath: >-
      Obtain the full text or underlying methodology from analyst reports such as Data Insights or equivalent accessible
      benchmark studies and confirm whether the metric is share of implementations, employers, or revenue.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: Gusto-customer-segment-mix
    missingEvidence: A disclosed split of Gusto's 500,000 customers by employee band such as 1-4, 5-49, and 50-499 employees.
    whyItMatters: Without the segment mix, penetration and future ARPU expansion are difficult to underwrite precisely.
    diligencePath: >-
      Request management disclosure or customer-cohort materials showing logo counts, revenue mix, and retention by
      employer size band.
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: material
    topic: payroll-switching-cost-benchmarks
    missingEvidence: An independent 2026 benchmark quantifying SMB payroll switching costs, implementation time, or vendor churn.
    whyItMatters: >-
      Switching friction is a key governor of share shifts, yet current public sources describe the issue qualitatively
      rather than quantitatively.
    diligencePath: >-
      Search private market research, implementation partner data, or public-company customer-retention commentary for
      measurable migration costs and churn benchmarks.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: vendor-market-share-precision
    missingEvidence: >-
      A credible 2026 market-share breakdown for U.S. SMB payroll vendors including Gusto, ADP, Paychex, Rippling, and
      peers.
    whyItMatters: >-
