companyProfile:
  summary: >-
    Gusto (formerly ZenPayroll) is a San Francisco-based payroll, HR, and
    benefits SaaS platform founded in 2011 by Joshua Reeves, Tomer London, and
    Edward Kim. The company serves over 500,000 U.S. small businesses, offering
    full-service payroll, health benefits, 401(k) (via its Guideline
    acquisition), HR tools, compliance automation (via its Mosey acquisition),
    and employee financial services (Gusto Money). As of June 2026, Gusto has
    surpassed $1 billion in trailing twelve-month revenue, is free cash flow
    positive, and is valued at approximately $9.3 billion based on its June
    2025 secondary tender offer. More than half of ARR now comes from products
    beyond core payroll, signaling a successful evolution from payroll provider
    to multi-product SMB operating system.
  foundedDate: "2011-01-01"
