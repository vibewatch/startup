  headquarters: "San Francisco, CA, USA (largest office: Denver, CO)"
  productSummary: >-
    Gusto offers a cloud-based SaaS suite including: full-service multi-state
    payroll (federal/state/local tax filing, direct deposit); health, dental,
    and vision benefits administration; 401(k) retirement plans (Gusto 401k,
    powered by Guideline); HR tools (onboarding, time tracking, PTO, performance
    management); business compliance automation (Gusto Business Compliance,
    powered by Mosey); R&D tax credit filing; and Gusto Money (employee
    financial account). Plans range from Simple ($40-49/month + $6/employee)
    to Premium ($180/month + $22/employee).
  customerFocus: "U.S. small and medium-sized businesses, primarily 1–100 employees"
  businessModel: >-
    Subscription SaaS with base monthly fee plus per-employee-per-month
    charges across three tiers (Simple, Plus, Premium); add-on revenue from
    health insurance brokerage, 401(k) administration, R&D tax credits, and
    Gusto Money. Accountant partner channel (10K+ firms) drives significant
    customer acquisition. Over 50% of ARR from non-payroll products as of 2026.
