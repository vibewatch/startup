  - id: "acquisitions-and-partnerships"
    title: "Strategic Acquisitions and Partner Channel"
    body: >-
      Gusto has executed two strategic acquisitions that significantly expanded its
      platform scope. In October 2025, Gusto acquired Guideline, a 401(k) retirement
      plan startup focused on small and medium businesses, for approximately $600
      million. Guideline had been Gusto's most popular 401(k) partner since 2015,
      serving approximately 65,000 businesses, over one million savers, and managing
      more than $20 billion in assets. The acquisition (valued below Guideline's 2021
      peak valuation of $1.15B) was accompanied by a plan to divest Guideline accounts
      linked to competing payroll platforms. In April 2026, Gusto acquired Mosey, an
      AI-powered compliance automation startup, to build out "Gusto Business
      Compliance"—enabling businesses to manage multi-state payroll registrations,
      annual filings, renewals, and other regulatory obligations within Gusto's platform.
      Compliance costs for small businesses average approximately $14,700 per employee
      per year, and Gusto's integration with Mosey addresses this pain point directly.
      Gusto's accountant partner channel is another strategic lever: the company works
      with over 10,000 accounting and tax firms through its tiered Partner Program
      (Silver, Gold, Platinum), offering revenue sharing of up to 20% and free Gusto
      Plus subscriptions for partner firms. This channel drives significant customer
      acquisition and creates durable retention through the embedded accountant
      relationship.
