callouts:
  - calloutType: "strength"
    title: "Revenue Milestone and FCF Profile Rare in SMB SaaS"
    body: >-
      Gusto crossing $1B in actual trailing revenue while remaining free cash flow
      positive since 2023 is unusual for a private SMB SaaS company. This profile—
      combined with a modest $9.3B valuation relative to revenue—creates a compelling
      setup for an IPO at a materially higher multiple than the current secondary
      price, assuming market conditions improve.
    claimRefs:
      - CO024
      - CO023
      - CO022

  - calloutType: "risk"
    title: "Flat Valuation Despite Revenue Doubling Creates M&A and IPO Optionality Risk"
    body: >-
      Gusto's valuation has remained near $9.3B since early 2022, despite revenue
      approximately doubling in the intervening period. This de-rating reflects tech
      multiple compression. If the IPO market remains frozen or if a potential acquirer
      anchors to the $9.3B secondary price, the company and its investors may face
      prolonged illiquidity or a discounted exit versus 2021-era expectations.
    claimRefs:
      - CO022
      - CO040
      - CO044

