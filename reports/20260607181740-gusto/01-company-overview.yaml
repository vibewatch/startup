  - id: "leadership-and-governance"
    title: "Founders, Leadership, and Governance"
    body: >-
      Gusto's three co-founders remain deeply involved in the company's operations.
      Joshua Reeves serves as Chief Executive Officer, a role he has held since
      founding. Tomer London continues in a senior product leadership capacity as
      co-founder and Chief Product Officer, while Edward Kim serves as co-founder and
      Head of Technology. The CEO is the primary external face of the company,
      regularly engaging with press, investors, and customers. The company appointed
      Tolithia Kornweibel as Chief Revenue Officer to lead go-to-market. In December
      2025, Gusto appointed Anthropic CTO Rahul Patil to its board of directors, adding
      technical credibility and AI expertise at the governance level. The board also
      includes Hemant Taneja, CEO of General Catalyst, one of Gusto's longest-standing
      investors. The executive team has been relatively stable; the major adverse
      leadership event was a February 2023 reduction-in-force of approximately 126
      employees (about 5% of the workforce), which CEO Reeves attributed to changing
      macroeconomic conditions. No major C-suite departures have been publicly reported
      since then, and the company has been growing its workforce again through 2025–2026.
      Founder concentration remains a governance risk: all three co-founders hold
      operational roles, and Josh Reeves' combined CEO and public-company-candidate
      stature creates key-person exposure.
