  - id: "adverse-and-risk-flags"
    title: "Adverse Events and Risk Flags"
    body: >-
      Several adverse events and risk factors are relevant to a diligence assessment
      of Gusto. The most significant operational adverse event was the February 2023
      workforce reduction of approximately 126 employees (~5% of headcount), initiated
      amid deteriorating macroeconomic conditions after the 2021 and 2022 fundraising
      highs. While the company has since resumed growth in headcount, this reduction
      demonstrates the company's sensitivity to macro cycles. On the litigation front,
      Patent Armory Inc. filed a patent infringement lawsuit (Case 1:25-cv-00467) against
      Gusto in 2025 seeking damages, attorneys' fees, and costs; this case was active
      as of mid-2026. A prior adversary proceeding in New Jersey Bankruptcy Court
      (Straffi, Trustee v. Gusto, Inc.) resulting in a money judgment against Gusto in
      2023 was vacated after settlement in early 2024, closing that matter. The company's
      valuation has remained flat at approximately $9.3B since early 2022 despite
      revenue nearly doubling in that period, creating a relative de-rating that reflects
      broader tech market multiple compression. Gusto's IPO timing remains uncertain;
      the company declined to share a timeline as of May 2026, and the IPO market
      remains selective. No major CFPB, SEC, or IRS enforcement actions against Gusto
      were found in public databases as of the report date.
