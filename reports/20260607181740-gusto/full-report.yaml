      - number: '1.4'
        title: Scale Metrics and Key Milestones
        blocks:
          - type: paragraph
            body: >-
              Gusto has achieved significant scale as of mid-2026. The company serves over 500,000 small businesses
              across the United States, up from approximately 300,000 direct customers in August 2024 and 400,000+
              direct customers by March 2025. Gusto added approximately 50,000 new customers in the most recently
              reported quarter alone. The company's trailing twelve-month revenue crossed $1 billion in early
              2026—actual revenue, not annualized ARR projections—driven by five consecutive quarters of accelerating
              growth. Sacra estimated 2025 revenue at $975M, growing ~30% year-over-year from $750M in 2024. The
              company's 401(k) business ARR grew approximately 50% year-over-year in 2024, while Gusto Money (its
              employee financial account product) grew ARR over 140% year-over-year. More than half of Gusto's ARR now
              comes from products beyond payroll, marking a fundamental shift from a single-product payroll company to a
              multi-product HR platform. Gusto's headcount is estimated at approximately 2,300–2,900 employees as of
              2026, with the largest office in Denver (≈640 employees) and San Francisco as the second largest (≈375
              employees). Key milestones include the 2015 rebrand, the 2019 expansion into health benefits nationwide,
              the 2021 Series E and employee tender offer, the 2023 layoff, the June 2025 tender offer at $9.3B, the
              October 2025 Guideline acquisition for ~$600M, and the April 2026 Mosey acquisition.
