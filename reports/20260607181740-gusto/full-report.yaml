              enterprise HCM estate. The current customers hub says more than 500,000 businesses use Gusto and surfaces
              story titles spanning marketing agencies, healthcare analytics firms, law firms, accounting practices,
              dental groups, retailers, restaurants, breweries, construction businesses, and software startups. The
              current customer reviews page makes that picture more concrete by attaching names, industries, and team
              sizes to visible reviewers: multiple examples sit in the two-to-ten employee range, but official proof
              also stretches upward to 16-person and 17-person operating teams, 58-employee organizations, 50-plus
              employee startups, and even a 100-plus employee accounting firm that uses Gusto itself while recommending
