      - number: '7.2'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              The core underwriting risk in Gusto is operational trust failure during a payroll or compliance-critical
              window. Gusto's own pages promise automatic tax filing, payroll in minutes, 50-state registration support,
              same-day and instant pay, and a mobile workflow that lets payroll managers act away from a desk. Those
              features are commercially attractive, but they also compress the tolerance for quality errors. Public
              reviews repeatedly describe problems that matter precisely because payroll is mission critical: delayed
              payments, incorrect or delayed tax handling, support queues, benefit-deduction confusion, and difficulty
              resolving edge-case issues before deadlines. PCMag's generally positive review actually reinforces the
              risk logic: it praises Gusto's breadth and usability while simultaneously confirming that Gusto now spans
              AI-assisted payroll prep, bill pay, invoicing, same-day and instant pay, expense workflows, and
              mobile-admin surfaces. The surface area is growing faster than the public evidence on reliability.


              Security risk is similarly asymmetric. Gusto stores payroll data, benefits data, tax forms, and
              financial-account flows; FTC guidance shows that financial-information handlers are expected to maintain
              written security programs, risk assessments, encryption, MFA, logging, vendor oversight, incident-response
              plans, and breach notifications. CISA and NIST both emphasize continuous hardening, vulnerability
              scanning, logging, MFA, and cloud-configuration control for SMB-facing systems, while Cybersecurity Dive
              reports that one in three SMBs were hit by a cyberattack in the past year at an average cost near
              $255,000. Gusto Money says partners use bank-level encryption and MFA, and PCMag says Gusto uses AWS, TLS,
              MFA, backups, and fraud monitoring. That is directionally reassuring, but the public trust-center surface
              remains thin and the company does not publish a numeric payroll-platform SLA or detailed uptime history.
              The practical risk is therefore not that Gusto lacks controls entirely; it is that investors cannot yet
              verify whether control maturity, QA coverage, and incident handling are keeping pace with a stack where AI
              already writes roughly half of new code and helps handle half of support volume.
