  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Revenue / ARR Basis
      - Value / Market Cap
      - Implied Multiple
      - Relevance to Gusto
      - Limitation
    rows:
      - - Rippling
        - Private HR / IT / spend platform
        - CNBC said ARR crossed $1B in 2025
        - ~$16.8B valuation
        - ~16.8x ARR
        - Best private premium-platform benchmark for how aggressively investors still price category leaders.
        - >-
          Private metric disclosure is thinner than for public comps; ARR and margins are not audited in the same way
          public-company revenues are.
      - - Deel
        - Private global payroll / HR platform
        - Company said it surpassed $1B ARR in 2025
        - ~$17.3B valuation
        - ~17.3x ARR
        - Most direct global payroll expansion comp and strongest reminder that global scope still earns premium marks.
        - Press-release and private-round data are less standardized than public filings.
      - - Paycom
        - Public payroll / HCM
        - FY2025 revenue $2.05B
        - ~$6.4B market cap
        - ~3.1x revenue
        - Shows how current public investors value a scaled U.S. payroll software operator.
        - >-
          Public quotes are volatile day to day and the market is pricing a mature public company, not a pre-IPO
          compounder.
      - - Paylocity
        - Public payroll / HCM
        - FY2025 revenue $1.60B
        - ~$6.1B market cap
        - ~3.8x revenue
        - Useful cloud-native SMB payroll/HCM benchmark.
        - Also a mature public comp; valuation may understate what private buyers pay for faster pre-IPO growth.
      - - Paychex
        - Public payroll / HCM
        - FY2025 revenue $5.57B
        - ~$36.3B market cap
        - ~6.5x revenue
        - Closest mature U.S. payroll analog and therefore the clearest public ceiling reference for Gusto.
        - Slower growth and a different capital-return profile make it an imperfect one-for-one benchmark.
      - - ADP
        - Public payroll / employer services
        - Large mature payroll / HCM revenue base
        - ~$92.7B market cap
        - Low-to-mid single-digit revenue zone
        - Best scale benchmark for how the public market values payroll infrastructure durability.
        - Too large and diversified to be a direct small-business Gusto analog.
      - - Workday
        - Public enterprise SaaS / HCM / finance
        - FY2026 revenue $9.55B
        - ~$35.6B market cap
        - ~3.7x revenue
        - Large-cap SaaS reference for upper-quality HCM software investors still compare against.
        - Enterprise finance/HCM exposure and very different customer size profile limit direct comparability.
    notes: >-
      This comparable screen is intentionally mixed: Gusto should not be valued only off mature public payroll names or
      only off premium private winners. The most honest read is that Gusto sits between those groups. Because
      private-company disclosures remain incomplete and public marks move every day, the table is a decision screen
      rather than a claim of pinpoint fair value.
