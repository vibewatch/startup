      - number: '3.2'
        title: Peer Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              The direct peer set shows why Gusto is differentiated but not unchallenged. ADP still pairs unmatched
              scale with compliance depth, automated payroll, tax handling, and rich reporting, but comparison sources
              and market reputation continue to frame it as more complex and less naturally tuned to the smallest
              employer cohort. Paychex competes similarly, adding strong HCM and PEO reach plus advisory-style support
              for nearly 800,000 customers. Rippling is the most important product challenger because it extends beyond
              payroll into identity, device management, spend, and automation on top of a unified employee graph and
              500+ integrations; that makes it compelling for upper-SMB and venture-backed buyers willing to pay for
              breadth. Deel is the clearest global competitor, with 1.5 million workers supported and 150+ countries
              covered, but its center of gravity remains international hiring and cross-border compliance rather than
              domestic SMB payroll simplicity. QuickBooks Payroll is functionally narrower but strategically dangerous
              because it bundles payroll into the accounting workflow many SMBs already trust. Workday is broader and
              more sophisticated still, but its buyer motion, enterprise scope, and implementation weight place it
              mostly above Gusto's core lane. The result is a market where no rival exactly matches Gusto, yet several
              rivals decisively outperform it on one axis that matters to a scaling buyer.
