  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Open Diligence Ask
      - Missing Evidence
      - Why It Matters
      - Owner / Next Step
    rows:
      - - 2025 tender price mechanics
        - Exact share price, eligible security classes, discount / premium to preferred, and any side-letter terms
        - These inputs directly determine real secondary entry economics and preference-stack downside.
        - Request tender memo, cap table, and counsel summary before increasing position size.
      - - Preference stack and recent secondaries
        - Latest share counts, liquidation preferences, and any 2026 secondary prints
        - Return modeling is incomplete without understanding what common and late preferred holders really own.
        - Get updated cap table and broker feedback from recent trades.
      - - Guideline integration retention
        - Customer retention, attach conversion, and any divestiture of rival-linked Guideline accounts
        - The acquisition must create multiple-supporting expansion, not just headline breadth.
        - Ask for post-close integration dashboard and cohort-level retention data.
      - - Non-payroll mix quality
        - ARR and gross margin by payroll, retirement, benefits, compliance, and money products
        - If non-payroll mix is lower quality than headline ARR mix suggests, the valuation premium narrows.
        - Request product P&L and attach-rate cohort breakdown.
      - - Real IPO readiness
        - Board criteria, banker engagement, audit readiness, and what milestones would trigger a filing
        - The base and bull cases depend on timing of the next liquidity event.
        - Ask management to define the IPO gate, not just say it is long-term.
      - - Competitive durability
        - Win-rate, loss-rate, and pricing pressure versus Rippling, Deel, ADP, Paychex, and Paylocity
        - The fastest way to break the thesis is structural share loss in the core payroll wedge.
        - Request cohort-level pipeline and renewal analysis, not just anecdotes.
    notes: >-
      The missing diligence is concentrated around valuation mechanics and what would unlock or block multiple
      expansion. These asks are prioritized in the order they most change the expected-return model.
    claimRefs:
      - CV033
      - CV037
