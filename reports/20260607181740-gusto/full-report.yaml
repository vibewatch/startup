  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Payroll tax or wage-calculation failure
        - Tax-resolution backlog, filing-error rate, payroll reruns, customer reimbursement claims
        - Sustained material increase in filing defects or any multi-state systemic error event
        - >-
          Pause underwriting unless management provides root-cause analysis, remediation, and customer-impact
          containment data
      - - Security or fintech-control incident
        - Public breach notices, regulator inquiries, Trust Center updates, customer advisories
        - >-
          Unauthorized access affecting payroll or money-product data, or any FTC/CFPB inquiry tied to safeguarding or
          servicing
        - >-
          Move to thesis-break review; require incident report, forensic scope, and control remediation before
          proceeding
      - - Partner outage or dependency failure
        - AWS incident correlation, lender/payment partner complaints, model-vendor outage frequency
        - Repeated outages or service disruptions that materially delay payroll, funding, or AI-assisted workflows
        - Discount growth and margin assumptions; request vendor redundancy and contractual remedies
      - - Mosey / Guideline integration miss
        - Launch delays, migration churn, support spikes, cross-sell underperformance
        - Business Compliance slips materially past 2026 or retirement / compliance servicing quality degrades
        - Treat acquisition synergies as unproven and reduce expansion-mix assumptions
      - - Founder / leadership concentration
        - Founder role changes, executive departures, support-operations attrition, public reorgs
        - Unexpected founder transition without visible succession depth
        - Require governance diligence before investment committee approval
      - - SMB macro deterioration
        - Customer adds, payroll volume, financing demand, small-business expectations indices
        - Small-business hiring and revenue expectations remain depressed while Gusto net adds slow materially
        - Cut revenue-growth assumptions and raise churn / downsell assumptions
      - - IPO / valuation slippage
