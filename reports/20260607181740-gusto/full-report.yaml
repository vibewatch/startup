  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - BUY (track)
        - >-
          ~$9.3B valuation against >$1B actual trailing revenue, ~30% growth, and free-cash-flow positivity supports a
          constructive entry view without requiring heroic assumptions.
        - >-
          Accumulate selectively in secondaries, but keep sizing moderate until diligence closes the tender and
          integration gaps.
      - - Confidence
        - Medium
        - >-
          Core operating proof is strong, but return outcomes remain very sensitive to IPO timing, multiple expansion,
          and exact secondary terms.
        - Do not underwrite to the bull case by default; use the base case as the sizing anchor.
      - - Risk Rating
        - Medium
        - >-
          The business appears high quality, but flat valuation since 2022, U.S.-centric TAM perception, and acquisition
          spending create real ceiling risk.
        - 'Own the company, not the narrative: track downside triggers quarterly.'
      - - Valuation Stance
        - Reasonable-to-attractive
        - >-
          Gusto screens cheaper than private leaders like Rippling and Deel, but richer than mature public payroll
          peers; the middle multiple can be justified by growth plus cash generation.
        - A premium to public payroll names is acceptable only if growth and FCF durability persist.
      - - Base-Case Outcome
        - ~$12B value / ~1.3x gross MOIC
        - The base case assumes $1.2B revenue and a 10x multiple, which is not a huge uplift from today’s mark.
        - Entry discipline still matters because the base case is good, not spectacular.
      - - Primary Upgrade / Downgrade Signals
        - >-
          Upgrade on credible IPO readiness and durable non-payroll attach; downgrade on sub-20% growth or a lower next
          mark.
        - The same evidence that resolves the ceiling debate will change the recommendation.
        - Use explicit monitoring rather than static conviction.
    notes: >-
      This summary intentionally separates company quality from price sensitivity. The recommendation is constructive
      because the operating proof is real, but it remains conditional on valuation discipline and on whether the flat
      mark since 2022 proves temporary rather than structural.
