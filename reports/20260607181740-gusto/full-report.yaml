  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Signal
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Growth downshift
        - Revenue growth falls below ~20% with no offsetting margin step-up
        - Destroys the rationale for paying a premium to mature public payroll comps.
        - Downgrade from BUY (track) to HOLD or PASS pending re-underwrite.
      - - Lower valuation mark
        - New tender, financing, or secondary print below $9.3B
        - Confirms that flat valuation was not temporary and that downside is still not fully cleared.
        - Treat as a kill trigger for new capital until the reset is understood.
      - - Integration underperformance
        - Guideline attach or retention materially misses plan, or divestitures impair the customer base
        - Removes a key part of the multi-product expansion story supporting future multiple expansion.
        - Reduce conviction and cut bull-case weighting.
      - - Competitive share loss
        - Clear evidence that Rippling, Deel, ADP, or other payroll peers are winning away core cohorts or pricing power
        - Undercuts the moat and weakens both growth and exit-multiple assumptions.
        - Re-underwrite immediately; consider exit if the pressure looks structural.
      - - IPO window stays shut
        - No credible path to public liquidity by late 2027 despite strong operating results
        - Delays monetization and may cap private-market rerating upside.
        - Hold smaller and demand stronger secondary entry discounts.
      - - Cash flexibility deteriorates
        - Debt burden or acquisition spend starts crowding out organic product investment
        - Changes the story from efficient compounding to balance-sheet management.
        - Downgrade unless cash-generation evidence offsets the risk.
    notes: >-
      These are not hypothetical talking points; they are explicit decision rules tied to the valuation model. If any
      one of them is hit, the company may still be good, but the current entry thesis changes.
    claimRefs:
      - CV029
