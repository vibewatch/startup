            body: >-
              The public architecture read is a cloud-delivered SaaS stack with both employer and employee mobile
              surfaces sitting above a payroll-and-recordkeeping core, plus adjacent workflow modules that sync back
              into the same system of record. Official payroll, time, and mobile pages show payroll, timesheets, PTO,
