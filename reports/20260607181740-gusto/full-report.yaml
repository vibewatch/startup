      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are strong and mostly structural. First, regulatory complexity keeps rising: state leave

              rules, overtime changes, tax updates, and retirement mandates make payroll administration harder for small

              teams. California's CalSavers expansion is especially relevant because it brings even one-employee

              businesses into the compliance net in 2026. Second, product architecture is improving: cloud delivery,

              integrated HR/payroll bundles, automation, and AI-driven anomaly detection let small employers buy a
              single

              system rather than stitching together point tools. Third, business and workforce churn remain high enough

              that new employers and changing headcount continuously create fresh payroll setup demand.


              But the market is not frictionless. Switching payroll systems still requires data migration, validation,

              and integration work, which slows competitive displacement. Cybersecurity, privacy, and tax-engine upkeep

              raise both buyer anxiety and vendor cost. AI adoption is real, especially among SMB HR teams, yet policy

              and governance lag well behind usage. Most importantly, the remaining white space is not homogeneous:

              microbusinesses are numerous but often reluctant to pay for a full software stack until a compliance
              event,

              hiring burst, or benefits requirement forces the issue. That is why growth should stay attractive without

              assuming every small employer converts at the same speed or ARPU.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
