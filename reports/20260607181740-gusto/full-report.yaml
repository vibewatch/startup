  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              At roughly $9.3 billion, Gusto is no longer priced like a distressed private company, but it also is not
              being valued like the fastest-growing HR decacorns. The company now has more than $1 billion of actual
              trailing revenue, more than 500,000 customers, five accelerating quarters, and free-cash-flow positivity
              that dates back to 2023. That combination matters because most late-stage payroll and HCM companies have
              either stronger growth with weaker cash generation or better margins with materially slower growth. On
              that basis, a ~9x revenue multiple looks defendable enough to support a BUY (track) stance at current
              secondary levels. The reason for caution is equally clear: the market has kept Gusto around the same
              headline valuation since 2022, which implies investors still see a ceiling until the company proves the
              next leg of scale. The right posture is therefore constructive but price-sensitive: buy selectively,
              underwrite to a moderate base case, and avoid assuming private-market enthusiasm returns automatically.
