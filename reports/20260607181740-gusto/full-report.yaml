            body: >-
              Gusto’s product is best understood as an SMB employment operating system whose anchor workflow is still
              payroll, but whose commercial logic now depends on what happens around payroll before, during, and after a
              pay run. The official surface now spans payroll, hiring and onboarding, employee records, performance and
              surveys, health and financial benefits, Gusto 401(k) powered by Guideline, contractor payments, compliance
              dashboards, tax credits, time tracking, mobile workflows, and accountant-facing tools. That matters
              because the practical buyer problem is not “run a paycheck” in isolation; it is keeping employee data,
              benefits elections, tax forms, schedules, and compliance tasks in one place so a small team does not need
              to reconcile multiple systems. The same surface also explains both moat and limitation: Gusto is unusually
              integrated for a U.S. SMB buyer, but its international scope is still framed around contractor payments
