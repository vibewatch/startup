      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              Gusto has raised over $929.8 million in total capital across equity and debt financing since its founding,
              spanning at least twelve rounds. Early capital came from Y Combinator (2012 accelerator, $100K), a $6.1M
              seed round in December 2012 (Google Ventures, others), and a $20M Series A in February 2014 led by Google
              Ventures with participation from Kleiner Perkins and General Catalyst. The Series B ($60M, April 2015) was
              led by CapitalG (Google's growth fund), establishing a lasting anchor relationship. The $140M Series C
              (July 2018) brought in Dragoneer, T. Rowe Price, MSD Capital, and Y Combinator Continuity; the $200M
              Series D (July 2019) at a $3.8B valuation brought Fidelity, Generation Investment Management, and others.
              The $175M Series E (August 2021) was led by T. Rowe Price at approximately a $9.5B valuation, accompanied
              by a secondary tender offer for employees. A $55M Series E extension in May 2022 extended that round to
              roughly $230M. In November 2025, Gusto raised $178.5M in a general debt round. The most recent valuation
              event was the June 2025 secondary tender offer of over $200M led by Ontario Teachers' Pension Plan
              (Teachers' Venture Growth arm) at a $9.3B valuation—the same level as the early 2022 round—providing
              liquidity to employees and early investors. Gusto's implied revenue multiple at $9.3B against ~$975M 2025
              estimated revenue (Sacra) is roughly 9.5x, modest compared to Rippling's ~16.8x and Deel's ~17.3x
              valuation on similar revenue. The company has been free cash flow positive since early 2023.
