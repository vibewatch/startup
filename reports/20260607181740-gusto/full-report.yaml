      - number: '3.3'
        title: Pricing, Packaging, and Go-to-Market Dynamics
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging reinforce where each vendor tries to win. Gusto's own plans still start at $49 per
              month plus $6 per person and climb to Premium at $180 plus $22 per person, which keeps it affordable for
              small employers while monetizing add-ons and more complex workflows as headcount rises. QuickBooks Payroll
              is close enough on entry pricing to be a real substitute, especially because the product includes same-day
              direct deposit and native accounting adjacency. Forbes' 2026 competitor roundup also places Justworks in
              the same entry-price ballpark, but Justworks competes through payroll plus outsourced HR and contractor
              support rather than through modular software depth. ADP and Paychex typically shift pricing into custom
              quotes and service packaging, which raises perceived complexity but supports broader compliance and
              advisory sales motions. Rippling and Deel are not just payroll purchases; they are broader platform buys,
              so they often justify premium pricing with workflow breadth, automation, or international scope.
              Distribution also differs. ADP and Paychex benefit from long-standing brand trust and service-led selling,
              QuickBooks benefits from installed accounting distribution, and PEOs benefit from benefits/compliance
              outsourcing demand. Gusto's relative advantage is still an SMB-friendly self-serve or low-friction buying
              motion, but that advantage weakens as the buyer starts valuing richer reporting, global hiring, or
              outsourced people operations over simple domestic payroll setup.
