  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Gusto's regulatory perimeter is wider than a normal SMB SaaS vendor because the company is no longer just
              selling payroll screens. The current public product stack spans payroll tax filing, health-insurance
              brokerage and broker integration, retirement-plan administration, contractor and cross-border payments,
              and Gusto Money tools that include bill pay, invoicing, and a payroll line of credit. That means the
              primary legal risk is not a single spectacular lawsuit; it is a layered compliance stack in which a filing
              error, wage-hour miscalculation, privacy lapse, or licensing miss can create both direct penalties and a
              trust shock. IRS guidance makes clear that employers must deposit and report federal employment taxes on
              time and use specific correction processes when prior filings are wrong. Gusto markets automatic filing
              across federal, state, and local forms, so any systemic product or service failure would hit exactly the
              workflow customers outsource to avoid penalties. Public adverse reviews show why this matters: some
              customers claim underpaid taxes, liens, fines, and late-fee disputes after relying on Gusto's tax
              workflows.


              Consumer-finance adjacency adds another layer. Gusto Money now routes users into Payroll Bridge credit,
              bill pay, and invoicing through partners such as Parafin, Celtic Bank, and Melio, while the CFPB
              enforcement docket continues to target nonbank payments, remittance, and employer-pay tools. The right
              read is not that Gusto is already under CFPB action; it is that the company has stepped into a monitored
              perimeter where disclosures, servicing, complaint handling, and safeguarding expectations are materially
              higher than pure payroll software. State insurance and retirement obligations matter too. Gusto advertises
              licensed advisors, broker integration, and 20-plus state retirement mandates, while NAIC guidance makes
              clear that producer licensing remains state-governed. On IP, the public patent risk is narrower than the
              user brief initially suggested: CourtListener shows Patent Armory sued Gusto in April 2025 but the parties
              dismissed the case in June 2025, so the residual risk is future patent-assertion recurrence rather than an
              active 2026 courtroom overhang.
