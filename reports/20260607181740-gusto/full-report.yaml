    title: Retention / Repeat Usage / Satisfaction Table
    columns:
      - Signal
      - Value / observation
      - What it suggests
      - Main caveat
      - Diligence ask
    rows:
      - - Official payroll satisfaction signal
        - Payroll page says 9/10 customers would recommend Gusto and average rating is 4.5/5
        - Directionally strong current satisfaction and product-market fit
        - Company-presented metric rather than third-party cohort retention
        - Request underlying survey window, methodology, and segment mix
      - - Compliance confidence
        - Payroll page says 88% agree Gusto helps them stay compliant
        - Compliance automation appears to be a core retention driver
        - Still an attitudinal survey metric rather than observed renewal behavior
        - Request support ticket and filing-error trend data by product cohort
      - - Third-party review depth
        - >-
          Pricing page cites 4.6 stars on Capterra across 4,137 reviews; Software Advice archive shows 4.6 overall and
          3,873 reviews
        - Large review volume supports broad usage and generally positive sentiment
        - Review averages are not retention economics and may lag current support issues
        - Request recent review trend, verified-account mix, and cohort by company size
      - - Named-customer durability anecdote
        - >-
          Reach says benefits helped create hardly any turnover; RealWork Labs says Gusto scaled with it as headcount
          grew
        - Integrated payroll-plus-benefits use can become a sticky operating backbone
        - Case-study anecdotes are not substitute for disclosed GRR or NRR
        - Request actual churn, renewal, and expansion data by product depth
      - - Structural switching costs
        - >-
          Pricing and Sacra both emphasize data-transfer support, synced benefits and payroll, and expansion into HR,
          compliance, and 401(k)
        - Switching away mid-year looks operationally painful once more workflows are attached
        - Structural stickiness does not guarantee customer satisfaction if support slips
        - Request save-rate data on competitive replacement attempts and historical migration losses
      - - Adverse review evidence
        - >-
          Trustpilot complaints repeatedly mention pricing transparency, support queues, tax-resolution issues, and
          international contractor limitations
        - Execution issues can threaten retention even when the product wedge is strong
        - Trustpilot skews toward dissatisfied users and overstates worst cases
        - Request support SLA attainment, tax-resolution backlog, and international payment incident rates
      - - Public retention metric gap
        - No public NRR, GRR, churn, contract-duration, or true cohort table found
        - True customer durability still requires private diligence
        - Absence of evidence is not evidence of weakness, but it is material
        - Request quarterly retention bridge and cohort tables by product bundle
    notes: >-
      This table separates public satisfaction and switching-cost proxies from actual renewal economics. Gusto’s public
      evidence is rich enough to suggest stickiness, but not enough to underwrite true retention without private data.
