      - number: '5.5'
        title: Constraints and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              The main product-tech bear case is not that Gusto lacks functionality; it is that the most important risks
              sit exactly where customers least want failure: payroll accuracy, tax/compliance handling, support
              response, and product edges outside the domestic SMB core. Public docs show a thoughtful but still gated
              API surface, modest open developer-community signal, and little public evidence of uptime,
              enterprise-scale benchmarks, or a fully transparent attestation package. International breadth is another
              clear limit. Gusto can pay contractors in many countries, but the product narrative remains centered on
              U.S. payroll, benefits, and compliance rather than on broad multinational employment infrastructure. The
              support-risk signal also matters more here than it would for a less mission-critical app, because payroll
              mistakes, failed deposits, or delayed tax fixes can hit wages, penalties, or benefits administration
              directly. The diligence posture should therefore stay constructive on product quality and roadmap, but
              conditional on deeper private review of reliability, trust documentation, API roadmap, and the real
              deployment status of Mosey-powered Business Compliance.
