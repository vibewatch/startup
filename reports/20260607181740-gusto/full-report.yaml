              Gusto crossing $1B in actual trailing revenue while remaining free cash flow positive since 2023 is
              unusual for a private SMB SaaS company. This profile— combined with a modest $9.3B valuation relative to
              revenue—creates a compelling setup for an IPO at a materially higher multiple than the current secondary
              price, assuming market conditions improve.
