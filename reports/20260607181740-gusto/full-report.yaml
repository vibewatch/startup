      - number: '4.2'
        title: Pricing architecture and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Public pricing confirms that Gusto monetizes customers through a layered mix of subscription, per-worker,
              and add-on fees. The current official 2026 pricing page shows Simple at $49 per month, Plus at $80 plus
              $12 per person, and Premium at $180 plus $22 per person, while archived third-party pricing pages still
              show an older $40 plus $6 Simple plan. That mismatch matters because it suggests list-price evolution over
              time rather than a perfectly stable public menu. Beyond payroll, Gusto monetizes benefits and compliance
              in several ways: health administration is free when Gusto is the broker, external-broker integration costs
              $6 per eligible employee, R&D tax credits are priced at 15% of identified credits, and Gusto Money Plus
              costs $19 per month while basic money tools sit inside the broader subscription. The 401(k) offer is now
              bundled as Gusto 401(k) powered by Guideline, with pricing varying by integration rather than being
              exposed as a single flat list price. The accountant channel is also financially important because it
              drives acquisition through revenue sharing of 5% to 20%, which likely lowers blended CAC compared with
              purely direct acquisition.
