      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map changes materially by employer size. In the smallest businesses, the buyer, user, and payer

              are often the same person: founder, owner-operator, or office manager. They are usually replacing manual

              payroll, a local accountant, or an inflexible legacy bureau, and their purchasing trigger is pain
              avoidance

              rather than workforce transformation. Once the company reaches roughly 5-19 employees, payroll frequency,

              onboarding, benefits coordination, and multi-state complexity become more visible; an operations manager,

              bookkeeper, or outside accountant often becomes the daily user while the owner still approves spend.


              In the 20-99 employee range, payroll is no longer just an admin task. HR, finance, and operations begin to

              split, and decision criteria move toward integrations, reporting, support responsiveness, and compliance

              coverage. In the 100-499 employee range, Gusto still competes, but alternatives like Paylocity, Rippling,

              ADP, or Paychex become more attractive because buyers increasingly value deeper workflow control and
              broader

              back-office infrastructure. Competitive comparison pages consistently show that companies leave Gusto not

              because payroll stops working, but because they need global employment, mid-market HR depth, or a more

              traditional service-heavy compliance model.
            claimRefs:
