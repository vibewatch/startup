    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Gusto, Inc. (legally ZenPayroll, Inc., d/b/a Gusto) was founded in 2011 in San Francisco, California by
              Joshua Reeves, Tomer London, and Edward Kim. The company launched its first product—a cloud-based payroll
              service for small businesses—in December 2012, and rebranded from ZenPayroll to Gusto in September 2015 to
              reflect its broadened ambitions beyond payroll into health benefits, HR tools, and compliance. As of June
              2026, Gusto operates as a private company at the late stage (post-Series E), headquartered in San
              Francisco with its largest U.S. office in Denver. The company's core mission is to serve as the leading
              partner for small businesses, handling payroll, tax compliance, health benefits, 401(k), HR, and
              compliance so business owners can focus on growth. Gusto's business model is subscription-based SaaS:
              customers pay a base monthly fee ($40–$180/month depending on plan tier) plus a per-employee per-month
              charge ($6–$22). The three main plans—Simple, Plus, and Premium—serve small to mid-sized businesses
              employing from a handful to a few hundred workers. Gusto also earns revenue from value-added services
              including next-day direct deposit, health insurance brokerage, 401(k) administration, R&D tax credit
              services, and Gusto Money, a financial account product for employees. More than half of Gusto's annual
              recurring revenue now comes from products beyond core payroll, confirming the platform's successful
              expansion into a broader small-business operating system.
