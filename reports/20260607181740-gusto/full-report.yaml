            body: >-
              Gusto’s public durability evidence is strong on proxies and weak on actual cohort economics. Officially,
              the payroll page says nine out of ten customers would recommend Gusto, average customer rating is 4.5 out
              of 5 stars, and 88% agree Gusto helps them stay compliant. The pricing page cites a 4.6-star Capterra
              average across 4,137 reviews, while the archived Software Advice surface shows a 4.6 overall rating with
              3,873 reviews and positive commentary about payroll automation and support. Official testimonials repeat
              the same positive themes: easy onboarding, fast payroll, employee self-service, integrated benefits, and
              lower admin overhead. The stickiness logic is also intuitive and source-supported. Pricing and payroll
              pages emphasize mid-year payroll transfer help, W-2 continuity, benefit-plan syncing, workers’ comp, and a
              401(k) that works seamlessly with payroll, while Sacra explicitly argues that benefits, time, HR, and
              compliance add-ons create switching costs and expansion revenue. The problem is what remains missing:
              Gusto does not publicly disclose NRR, GRR, logo churn, contract length, or real retention cohorts. Adverse
              review evidence also matters because this is mission-critical software. Trustpilot’s archived corpus
              repeatedly complains about pricing transparency, support queues, filing errors, tax resolution, and
              international contractor problems, even though it also includes happy users who switched from incumbents
