  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Gusto's core market is not "all HR tech" and not the full payroll-services universe. The company sells an

              integrated U.S. employer-SMB operating layer that starts with payroll processing and tax filing, then adds

              benefits administration, retirement, onboarding, employee records, and compliance workflows for businesses

              with paid employees. That included spend matters because payroll is the system-of-record entry point,
              while

              benefits, 401(k), tax credits, and compliance expand revenue once the employer already trusts the
              platform.

              In practice, the most relevant customers are employer SMBs with 1-499 workers, especially the owner-led
              and

              operations-led cohort that wants software plus light service rather than enterprise implementation
              projects.


              Excluded from the current core scope are several adjacent but distinct categories: global payroll and

              employer-of-record services, enterprise HCM suites aimed at larger procurement-heavy organizations,

              standalone accounting and ERP, and nonemployer solo businesses that do not actually need W-2 payroll.

              The status-quo substitute for many target buyers is still a patchwork of manual payroll, spreadsheets,

              bookkeepers, accountants, or legacy outsourcers. That is why market definition must be anchored on
              employer

              payroll complexity, not just on the very broad headline count of U.S. businesses.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
