    rows:
      - - Run regular payroll
        - Manual payroll, tax filing, and payout timing create deadline risk
        - Payroll core with unlimited runs, automated tax filing, and multi-speed payout options
        - Official pages emphasize fewer manual steps and same-day / instant options when needed
        - Public SLA and large-company scale metrics are not disclosed
      - - Onboard a new employee
        - New-hire setup often requires multiple documents, systems, and signatures
        - HR onboarding checklists, document storage, e-signatures, software provisioning, and mobile onboarding
        - One employee record can flow into payroll, documents, and app access without re-entry
        - Higher-end talent-management depth is still lighter than enterprise suites
      - - Offer benefits and retirement
        - Benefits elections and retirement deductions are usually handled outside payroll
        - Benefits administration plus Gusto 401(k) powered by Guideline
        - Payroll-synced deductions reduce manual corrections and can unlock retirement-plan tax credits
        - Public detail on carrier economics, support load, and post-Guideline migration quality is limited
      - - Pay contractors and mixed teams
        - SMBs often juggle separate workflows for employees and contractors
        - Unified contractor and employee payroll, automated 1099 handling, scheduled contractor pay
        - Spring 2026 updates removed more manual contractor work and support split-pay workflows
        - International support is broader for contractors than for full employee payroll
      - - Handle compliance tasks
        - Owners miss changing rules, deadlines, and required training or paperwork
        - Compliance Hub, alerts, break-policy support, remote I-9 verification, and certified HR help
        - Dashboard-driven workflow turns hidden compliance work into visible tasks
        - Broader Mosey-powered business-compliance rollout was still pending
      - - Run payroll/admin work away from a desk
        - SMB operators often need to approve time, expenses, or payroll on the move
        - Official mobile app for payroll, timesheets, expenses, onboarding, early pay, and benefits
        - Employers and employees can both act from the same app instead of waiting for desktop access
        - App-store and official pages show capability breadth, but not mobile reliability metrics
      - - Serve accountants and multi-client admins
        - Accountants lose time switching tools and chasing client compliance opportunities
        - Gusto Pro plus Karbon integration and surfaced recommendations
        - Spring Showcase adds payroll tracking inside Karbon and proactive opportunity surfacing
        - Real accountant adoption and ROI by firm segment are not public
