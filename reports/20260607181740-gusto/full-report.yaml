    title: Competitor Profile Table
    columns:
      - Competitor
      - Category
      - Scale / Signal
      - Target Buyer
      - Core Strength
      - Primary Weakness vs. Gusto
    rows:
      - - ADP RUN
        - Legacy incumbent
        - 1.1M+ clients; 140+ countries; 75+ years
        - SMB through enterprise
        - Compliance depth, tax workflows, reporting, service trust
        - Higher complexity and less micro-SMB-native buying experience
      - - Paychex Flex
        - Legacy incumbent
        - Nearly 800,000 customers; pays 1 in 11 U.S. private-sector workers
        - SMB and mid-market
        - Full-service HCM plus HR/PEO support
        - Less product-led feel and less attractive for the smallest employers
      - - Rippling
        - Modern platform challenger
        - $16.8B valuation; 20,000+ customers; 4,000+ employees
        - Upper SMB and venture-backed growth companies
        - Unified HR + IT + spend + payroll automation
        - Can be overbuilt and more expensive for very small businesses
      - - Deel
        - Global-first competitor
        - $17.3B valuation; 37,000+ businesses; 1.5M workers; 150+ countries
        - Global employers and contractor-heavy firms
        - International payroll, EOR, and cross-border compliance
        - Not optimized around U.S.-only SMB payroll simplicity
      - - QuickBooks Payroll
        - Accounting-adjacent substitute
        - Backed by Intuit; paired with 100M-customer fintech platform
        - SMBs already running QuickBooks
        - Accounting integration, same-day direct deposit, familiar brand
        - Less HR depth and narrower people-platform ambition
      - - Workday
        - Enterprise adjacency
        - 11,500+ organizations; 65%+ of Fortune 500
        - Larger mid-market and enterprise
        - Comprehensive global HCM and analytics
        - Too complex and costly for Gusto's core SMB lane
      - - Justworks / TriNet / Insperity
