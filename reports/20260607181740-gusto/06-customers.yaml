    "number": 6,
    "title": "Customers",
    "summary": "Gusto now has unusually strong public customer-scale proof for an SMB payroll vendor: official 2026 disclosures put the base above 500,000 small businesses, Sacra traces direct customers from roughly 300,000 in August 2024 to more than 400,000 by March 2025, and the current customer hub shows a broad surface of named stories across services, healthcare, accounting, retail, hospitality, and software. The bullish read is a sticky, multi-product SMB platform with a meaningful accountant channel and credible customer love; the bearish read is that true NRR, churn, and concentration remain undisclosed while adverse review surfaces repeatedly complain about pricing transparency, support delays, tax-resolution issues, and international limitations."
  },
