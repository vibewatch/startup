    {
      "id": "expansion-motion-channel-leverage-and-concentration-risk",
      "title": "Expansion Motion, Channel Leverage, and Concentration Risk",
      "body": "The best bull case on Gusto customers is not just new-logo volume; it is the way the platform appears to deepen inside accounts and around adjacent channels. Official stories and product pages repeatedly connect payroll to health insurance, 401(k), workers’ comp, onboarding, compliance, time tools, contractor payments, and accountant workflows. Dark Horse CPAs is a particularly important proof point because it shows Gusto working both as a direct operating system for the firm and as a product that an accountant-led channel can recommend to hundreds of end clients. The accountant program itself is large enough to matter, with 18,000-plus firms, formal partner tiers, and revenue share up to 20%. That said, the concentration story is still only partially underwritten. Public evidence suggests broad vertical diversification across SMBs, but the revenue base still depends overwhelmingly on small-business employers, making headcount-sensitive downturns a direct customer risk. Public sources also do not disclose top-customer concentration, ARR by segment, or channel mix. Finally, the platform’s international story remains narrower than the domestic one: Gusto supports contractor payments in more than 120 countries, but public proof still centers on U.S. payroll, benefits, and compliance. That leaves room for broader suites such as Rippling or global specialists to pull some expanding customers upmarket or cross-border over time.",
