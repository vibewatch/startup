      "id": "customer-base-segmentation-and-visible-buyer-profile",
      "title": "Customer Base Segmentation and Visible Buyer Profile",
      "body": "Public evidence paints Gusto as a broad but still clearly SMB-centered customer base rather than an enterprise HCM estate. The current customers hub says more than 500,000 businesses use Gusto and surfaces story titles spanning marketing agencies, healthcare analytics firms, law firms, accounting practices, dental groups, retailers, restaurants, breweries, construction businesses, and software startups. The current customer reviews page makes that picture more concrete by attaching names, industries, and team sizes to visible reviewers: multiple examples sit in the two-to-ten employee range, but official proof also stretches upward to 16-person and 17-person operating teams, 58-employee organizations, 50-plus employee startups, and even a 100-plus employee accounting firm that uses Gusto itself while recommending it to clients. The buyer is often an owner, finance manager, office manager, accountant, or partner rather than a centralized procurement team. That aligns with Gusto’s own positioning as a small-business platform, its simple per-employee pricing, and the prominence of accountant referrals in the partner program. The practical takeaway is that Gusto’s sweet spot is not a single narrow vertical; it is the U.S. employer-SMB segment wherever payroll, benefits, hiring, and compliance complexity have outgrown spreadsheets but not yet demanded a heavyweight enterprise suite.",
