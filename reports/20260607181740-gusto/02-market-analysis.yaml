      "id": "market-sizing-and-penetration",
      "title": "Market Sizing and Penetration",
      "body": "Multiple sizing lenses are necessary because the category is defined very differently across publishers.\nMordor Intelligence sizes the narrow U.S. payroll services market at about $8.44 billion in 2025 and\n$8.91 billion in 2026, with the SMB segment growing fastest at 10.95% CAGR. Emergen Research uses a broader\nU.S. HR payroll software definition, reaching $12.34 billion in 2024 and projecting $28.45 billion by 2034.\nThe Business Research Company broadens again to a global HR payroll software market of $42.78 billion in\n2026, while IBISWorld's $80.9 billion Payroll & Bookkeeping Services figure is broader still because it\nincludes service-heavy bookkeeping work that is not Gusto's software SAM. These are not contradictions so\nmuch as scope changes.\n\nA bottom-up lens is more useful for Gusto: roughly 5.52 million U.S. employer SMBs times an approximate\n$150-200 monthly payroll/HR spend yields about $9.9-13.2 billion of annual core opportunity. With more\nthan 500,000 customers, Gusto has penetrated roughly 9% of that employer-SMB base. Using the same official\ncustomer count and the company's trailing revenue milestone implies a SOM around $1 billion annually and an\naverage revenue profile of roughly $2,000 per business per year, consistent with a payroll-plus-cross-sell\nmodel rather than a payroll-only utility.",
