    {
      "id": "risk-flags-and-public-gaps",
      "title": "Risk flags, leverage, and public-source gaps",
      "body": "The main financial bear case is not that Gusto lacks revenue; it is that valuation and disclosure quality lag the revenue story. Despite moving from north of $500 million of fiscal-2023 revenue to roughly $1 billion of trailing revenue by 2026, the company's headline valuation has stayed around the same 2022-to-2025 band, which implies multiple compression rather than appreciation. That is manageable if margins are durable and cash generation is real, but Gusto does not publicly disclose gross margin, channel CAC, payback, NRR, churn, burn, or debt covenants. Independent triangulation is also thinner than ideal. Some well-known financial-information surfaces were inaccessible, generic, or unusable during this run: the specific WSJ and Business Insider URLs did not resolve cleanly, Crunchbase was blocked by Cloudflare, Bloomberg search returned only a generic results page, and the fetched CB Insights page resolved to a different company named Gusto. The underwriting implication is straightforward: revenue quality appears strong, capital intensity appears moderate rather than extreme, but the absence of audited margin and cash data means the final financial verdict should stay constructive-but-conditional rather than fully greenlit.",
