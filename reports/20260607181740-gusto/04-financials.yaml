    {
      "id": "capital-adequacy-and-balance-sheet",
      "title": "Capital adequacy, valuation, and balance-sheet posture",
      "body": "Capital adequacy looks better than the public-openness of the record might suggest, but it is still not fully underwritable from open sources alone. Premier Alternatives pegs Gusto at $9.3 billion of valuation and $929.8 million of total capital raised, including a reported $178.5 million debt round in November 2025 and a 10.0x capital-efficiency ratio. Yahoo Finance's republication of Fortune's June 2025 tender-offer scoop shows that the tender was a $200 million-plus secondary transaction at the same $9.3 billion valuation, led by Ontario Teachers' Venture Growth, and that Gusto had been free-cash-flow positive since early 2023. TechCrunch's 2022 extension-round story provides the adverse read: the company added roughly $55 million to its Series E at a flat valuation in a changed market rather than resetting higher. Capital deployment has also been meaningful. Gusto agreed to acquire Guideline for a reported roughly $600 million, well below Guideline's 2021 peak valuation but still a major use of capital. The combination of free-cash-flow positivity and historical fundraising supports a low-confidence estimate that Gusto still has a meaningful cash cushion, but the exact cash balance, debt terms, and runway are not public.",
