      "id": "unit-economics-and-retention",
      "title": "Unit economics, ARPU, and retention reads",
      "body": "Public unit economics remain only partially visible, but enough evidence exists to bracket the business. Using the company's 500,000-customer milestone against the $1 billion trailing-revenue threshold implies roughly $2,000 of annual revenue per business, or about $167 per month. That aligns reasonably with payroll software economics for small employers once add-ons are included, and it is directionally consistent with Gusto's official list prices plus per-person charges. What remains private is more important than what is public: Gusto does not disclose realized CAC, payback, gross margin, net revenue retention, churn, or segment-level revenue by product line. The best public read is therefore inferential. Because payroll is operationally sticky, because more than half of ARR now comes from non-payroll expansion products, and because partner channels are embedded in the distribution model, a low-confidence estimate of 100% to 110% NRR and sub-10% annual churn is directionally supportable. Gross margin likely sits below best-in-class pure SaaS because payroll tax filing, compliance support, benefits administration, and payment operations add service-delivery costs, so a 60% to 70% estimate is more defensible than an 80%+ software assumption.",
