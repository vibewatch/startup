    "title": "Financials",
    "summary": "Gusto's public financial story is strong on scale and improving mix but still incomplete on true underwriting detail: the company says it has more than $1 billion of actual trailing revenue, serves more than 500,000 businesses, has been free-cash-flow positive since early 2023, and now gets more than half of ARR from products beyond payroll. Public sources support a roughly $9.3 billion valuation on about $975 million to $1 billion of revenue and a 10x capital-efficiency ratio, but flat valuation since 2022, a reported $178.5 million debt layer, and missing disclosure on gross margin, CAC, NRR, churn, cash, burn, and debt terms keep the final verdict constructive-but-conditional rather than fully underwritten."
  },
