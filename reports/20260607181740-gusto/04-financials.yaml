    {
      "id": "revenue-scale-and-mix",
      "title": "Revenue scale, growth, and mix shift",
      "body": "Gusto's top-line profile is unusually strong for a private SMB software company. In May 2026 the company said it had surpassed $1 billion in trailing-12-month revenue, and TechCrunch explicitly clarified that the figure reflected actual revenue earned over the prior twelve months rather than annualized ARR. The same company disclosure tied the milestone to more than 500,000 small business customers and five consecutive quarters of accelerating growth, while Fortune-republished coverage on Yahoo Finance added that Gusto had already generated north of $500 million in fiscal 2023. Sacra's 2025 model then fills in the bridge: roughly $750 million of 2024 revenue and about $975 million of 2025 revenue, implying around 30% year-over-year growth just before the public $1 billion milestone. The more important quality signal is mix, not just scale. Management says more than half of ARR now comes from products beyond payroll, and third-party reporting says 401(k) ARR grew about 50% in 2024 while Gusto Money grew more than 140%. That combination makes the business less like a single-function payroll utility and more like a multi-product SMB employment and financial-operations platform.",
