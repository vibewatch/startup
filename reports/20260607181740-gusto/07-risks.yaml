      "calloutType": "risk",
      "title": "Payroll trust is the real single-point failure",
      "body": "Gusto can survive a noisy review cycle or an isolated competitor attack, but it cannot afford a broad payroll-tax, wage, or money-movement incident that convinces SMB owners the platform is unsafe at payday.",
