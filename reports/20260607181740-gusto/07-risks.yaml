        "CR013",
        "CR015",
        "CR016",
        "CR049"
      ]
    },
    {
      "calloutType": "insight",
      "title": "The patent headline overstates current risk",
      "body": "Public court records show the Patent Armory case was filed and then dismissed in 2025. The more relevant legal question today is whether Gusto has enough freedom-to-operate discipline to avoid recurring NPE or competitor assertions as it broadens the stack.",
      "claimRefs": [
        "CR043",
        "CR044",
        "CR045",
        "CR046"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Fintech adjacency broadens the compliance perimeter",
      "body": "Gusto Money turns payroll software into a partner-orchestrated financial workflow with lending, bill pay, and invoicing. That expands the company's regulatory and operational burden even if third parties technically own parts of the stack.",
