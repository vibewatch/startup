    "number": 7,
    "title": "Risks",
    "summary": "Gusto's risk profile is elevated wherever payroll accuracy, money movement, or regulated benefits intersect with fast product expansion. The sharpest risks are not existential demand risk but trust fragility: a meaningful payroll tax or wage calculation failure, a material security or fintech-control incident around Gusto Money, or a partner outage across AWS, banking, insurance, or LLM dependencies would transmit quickly into customer churn, remediation cost, and slower IPO readiness. The good news is that public evidence also shows real mitigants — scale above 500,000 businesses, more than $1 billion in actual trailing revenue, strong accountant-channel breadth, and a product surface that increasingly bundles payroll, benefits, retirement, and compliance — but several thesis-critical controls remain private, including SLA history, post-acquisition integration quality, partner concentration, and founder-succession depth."
