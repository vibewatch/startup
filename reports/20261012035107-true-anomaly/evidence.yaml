evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-cap-table
    missingEvidence: >-
      Detailed equity capitalization table showing share classes, voting control, liquidation preference multiples, and
      secondary transaction terms.
    whyItMatters: >-
      Essential to evaluate post-Series D dilution, downside protection features, and governance control between
      founders and institutional leads.
    diligencePath: >-
      Request confidential cap table schedule and Series D investors' rights agreement under formal non-disclosure
      review.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: blocking
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements verifying GAAP revenue run-rates, gross margin per Jackal satellite, contract backlog
      conversion, and operating cash burn.
    whyItMatters: >-
      True Anomaly's $2.2 billion valuation cannot be fundamentally grounded without visibility into recurring revenue,
      unit economics, and cash burn.
    diligencePath: >-
      Obtain management financial presentation, backlog conversion audit, and cash-flow projections during confirmatory
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited contract task-order awards under the Andromeda IDIQ specifying True Anomaly's exact funded obligation
      versus the shared $1.8 billion ceiling.
    whyItMatters: >-
      Conflating a 14-company shared IDIQ ceiling with committed company backlog distorts serviceable addressable market
      and downstream valuation models.
    diligencePath: >-
      Inspect Federal Procurement Data System (FPDS) / SAM.gov contract action records for True Anomaly's specific
      delivery orders under contract Andromeda.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable bids, awarded contract values, spacecraft unit prices, Mosaic license terms, discounts, support fees,
      and realized gross margins.
    whyItMatters: >-
      Without normalized commercial terms, the analysis cannot test price leadership, total mission cost, or whether
      integration breadth earns attractive economics.
    diligencePath: >-
      Request redacted proposals and contracts, normalize scope and data rights, and compare life-cycle cost for at
      least three procurement paths.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-verification
    missingEvidence: >-
      A common-scenario government test report or telemetry-backed benchmark covering mission success, navigation error,
      response time, propellant use, and safety events.
    whyItMatters: >-
      Product breadth cannot establish performance superiority or reliability against competitor and internal-build
      alternatives.
    diligencePath: >-
      Obtain program test reports and raw metric definitions, then commission an independent technical review using a
      common mission scenario.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      Current competitor funding, backlog, fleet size, contract scope, customer concentration, and strategic roadmap
      from primary or high-reputation sources.
    whyItMatters: >-
      The assigned pool identifies categories and names but cannot rank their scale, staying power, or likelihood of
      entering True Anomaly's core programs.
    diligencePath: >-
      Build a procurement-level competitor set from current award notices, filings, official product documents, and
      customer references.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Disclosed bill-of-materials cost per Jackal vehicle, production launch costs, and realized software licensing
      gross margins.
    whyItMatters: >-
      Essential to underwrite long-term profitability, margin expansion trajectory, and price durability against legacy
      defense aerospace primes.
    diligencePath: >-
      Request audited GAAP income statement by segment, unit-cost manufacturing variance reports, and Mosaic gross
      margin disclosures.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-backlog
    missingEvidence: >-
      Firm funded contract backlog dollar amounts, annual recurring revenue (ARR), and milestone conversion schedules
      across Golden Dome, Andromeda, and VICTUS HAZE awards.
    whyItMatters: >-
      Determines revenue visibility, revenue quality, and the timeline required to achieve cash-flow breakeven against
      high fixed manufacturing overhead.
    diligencePath: >-
      Review government contract task order schedules, funded ceiling allocations, and cash collection profiles during
      confirmatory financial diligence.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: developer-signal-deficiency
    missingEvidence: >-
      Public developer repositories, package registry telemetry, or practitioner community signal for Mosaic software
      stack.
    whyItMatters: >-
      True Anomaly operates in a classified defense and ITAR-restricted domain, preventing public open-source developer
      evaluation of its Elixir codebase or C2 APIs.
    diligencePath: >-
      Request unclassified software architecture white papers, SDK integration documentation, and third-party cyber
      audit reports under NDA.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: on-orbit-rpo-sensor-telemetry
    missingEvidence: >-
      Detailed optical, infrared, and radar sensor resolution telemetry and rendezvous guidance precision metrics from
      Mission X-1 and X-2.
    whyItMatters: >-
      On-orbit rendezvous and proximity operations (RPO) are technically challenging, and initial Mission X-1 satellites
      failed to conduct their planned rendezvous test.
    diligencePath: Review Space Force operational test reports and telemetry logs from the VICTUS HAZE TacRS demonstration.
  - type: missing-source
    severity: material
    topic: customer-retention-nrr
    missingEvidence: >-
      Audited retention figures, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and detailed cohort renewal
      rates for national security contracts.
    whyItMatters: >-
      Without documented retention or contract conversion rates, long-term customer economics and recurring revenue
      durability cannot be independently modeled.
    diligencePath: >-
      Request classified or proprietary contract backlog, option exercise history, and follow-on task order conversion
      rates directly in diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Full comprehensive listing of classified task orders, multi-year program of record commitments, and non-defense
      customer engagements.
    whyItMatters: >-
      Classified mission compartments and prototype-phase contracting obscure the boundary between firm recurring
      programs and temporary pilot demonstrations.
    diligencePath: >-
      Obtain prime contract transition schedules and Space Systems Command Program of Record insertion milestones in
      management review.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: operational-telemetry-and-rendezvous-proof
    missingEvidence: >-
      Audited flight telemetry, on-orbit sensor calibration logs, and rendezvous tracking accuracy records for Jackal
      spacecraft under operational Space Force test conditions.
