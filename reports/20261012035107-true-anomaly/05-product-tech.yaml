chapter:
  number: 5
  title: "Product & Technology"
  summary: "True Anomaly fields a software-defined space superiority stack comprising the maneuverable Jackal Autonomous Orbital Vehicle and the Elixir-based Mosaic mission autonomy software platform. Co-designing high-delta-v spacecraft with real-time autonomous command allows the company to support space domain awareness and tactically responsive missions, though scaling production to 50 spacecraft annually and proving autonomous rendezvous reliability remain key diligence hurdles."
sections:
  - id: "jackal-spacecraft-platform"
    title: "Jackal Autonomous Orbital Vehicle Architecture and Subsystems"
    body: "True Anomaly's hardware architecture centers on the Jackal Autonomous Orbital Vehicle (AOV), an ESPA-class spacecraft platform engineered specifically for dynamic space-to-space operations rather than static orbital surveillance. Sized roughly equivalent to a compact refrigerator, Jackal breaks with traditional defense satellite design by prioritizing extreme maneuverability and attritable production economics over multi-decade orbital longevity. The vehicle integrates an advanced 20-thruster propulsion architecture delivering approximately 800 m/s of total delta-v, granting the vehicle sufficient kinematic capability to perform rapid orbital plane changes, phasing maneuvers, and rendezvous and proximity operations (RPO) against non-cooperative objects in low Earth orbit. Jackal's physical structure incorporates reconfigurable mission hardpoints capable of hosting non-Earth imaging optical payloads, infrared sensors, radio-frequency diagnostic tools, and potential active effectors. Power is provided by deployable solar array wings paired with high-density onboard battery reserves. While initial flight validation on SpaceX Transporter-10 in March 2024 proved solar power generation and basic telemetry, autonomous rendezvous maneuvers could not be completed, demonstrating that on-orbit proximity maneuvering remains the critical technical hurdle as True Anomaly advances plans to scale the Jackal bus toward geosynchronous and cislunar operating envelopes."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE008"
      - "CE010"
    tableRefs:
      - "TE001"
  - id: "mosaic-autonomy-software"
    title: "Mosaic Mission Autonomy, Digital Simulation, and Command Architecture"
    body: "The operational backbone of True Anomaly's product portfolio is Mosaic, an integrated software platform engineered to orchestrate autonomous multi-spacecraft missions and compress tactical decision cycles for military operators. Built on the Elixir programming language to leverage the BEAM virtual machine's battle-tested concurrency, low latency, and fault tolerance, Mosaic operates both as ground command-and-control infrastructure and as an onboard autonomous software executive. On the ground, Mosaic provides a Common Operating Picture that ingests telemetry and sensor feeds across space and terrestrial domains, translating high-level operator intent into multi-burn tactical maneuver sequences through human-machine teaming workflows. To accelerate pre-mission validation and operator readiness, Mosaic incorporates the Digital Range, a high-fidelity physics-based simulation engine capable of modeling friendly and adversarial orbital dynamics, alongside the Ascension multiplayer training suite designed for Space Force Guardians. By executing onboard autonomous guidance and proximity monitoring, Mosaic eliminates dependence on persistent high-bandwidth ground communications, representing a distinct software-defined architectural departure from the bespoke, ground-tethered operational software historically delivered by legacy defense aerospace primes."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE013"
    figureRefs:
      - "FE001"
  - id: "operational-workflows-use-cases"
    title: "Tactical Missions, Flight Demonstrations, and Operational Use-Cases"
    body: "True Anomaly aligns its product capabilities directly with U.S. Space Force space superiority requirements across four primary operational workflows: space domain awareness, tactical threat characterization, adversary emulation, and tactically responsive defense. Under the Space Domain Awareness and threat characterization use-cases, Jackal utilizes close-approach maneuvering and multi-spectral sensors to inspect, image, and characterize uncataloged or maneuvering orbital objects. For tactically responsive space (TacRS), True Anomaly demonstrated rapid spacecraft delivery under the Space Force VICTUS HAZE program, proving rapid-callup mission integration alongside launch providers like Firefly Aerospace. The company's flight heritage reflects rapid iterative prototyping: following the initial Mission X-1 deployment of two Jackal vehicles in March 2024, a third Jackal was launched on SpaceX Bandwagon-2 in December 2024 to mature flight avionics and sensor operations. Furthermore, True Anomaly has expanded its mission baseline beyond low Earth orbit, engineering deep-space variants of Jackal to address strategic monitoring requirements in geostationary orbit and cislunar space, where high-value national security assets face expanding foreign surveillance and interdiction threats."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "manufacturing-and-technical-risks"
    title: "GravityWorks Production Scaling, Supply Dependencies, and Technical Risks"
    body: "Industrializing spacecraft production represents both True Anomaly's primary growth vector and its most demanding technical challenge. The company operates approximately 140,000 square feet of advanced engineering and production facilities, anchored by its GravityWorks manufacturing headquarters in Centennial, Colorado, and a major integration facility in Long Beach, California. True Anomaly has articulated an aggressive production ramp targeting 50 Jackal spacecraft annually to fulfill potential production tranches for Golden Dome space-based interceptor prototypes and Space Force surveillance constellations. However, transitioning from low-rate prototype fabrication to serialized aerospace production introduces significant operational dependencies. The architecture relies heavily on specialized aerospace components, radiation-tolerant avionics, and commercial rideshare launch providers like SpaceX and Firefly. Beyond supply chain constraints, close-proximity maneuvering in congested low Earth orbit carries intrinsic technical risks: unexpected thruster anomalies, sensor blindness during rendezvous, or autonomy failures could precipitate orbital collisions, escalating space debris hazards and triggering Kessler syndrome conditions that would severely impact operational space defense deployments."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE014"
    tableRefs:
      - "TE003"
