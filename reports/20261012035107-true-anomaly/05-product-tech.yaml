callouts:
  - calloutType: "strength"
    title: "Full-Stack Convergence of Purpose-Built Hardware and Autonomy Software"
    body: "True Anomaly's core technical moat lies in the unified co-design of the Jackal maneuvering bus and the Mosaic mission autonomy engine. Rather than retrofitting commercial communications buses, True Anomaly combines high-thrust 20-thruster propulsion with an Elixir-based control plane, enabling rapid proximity operations that legacy defense contractors cannot easily match at an attritable price point."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
      - "CE013"
  - calloutType: "risk"
    title: "On-Orbit Rendezvous Flight Proof and Orbital Proximity Hazards"
    body: "While True Anomaly has demonstrated orbital launch and solar array power generation, its initial Mission X-1 satellites failed to execute their scheduled rendezvous maneuvers. In congested orbital regimes, autonomous proximity operations carry severe risks of collision and debris generation, making demonstrated rendezvous reliability on upcoming missions like VICTUS HAZE critical for customer underwriting."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE014"
