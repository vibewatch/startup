          detail: High risk and stretched valuation pending private diligence.
      edges:
        - from: financing
          to: roadmap
        - from: roadmap
          to: execution
        - from: execution
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: >-
      The flow is a decision sequence, not a forecast or representation of cash
      balances, probabilities, or contract revenue.
