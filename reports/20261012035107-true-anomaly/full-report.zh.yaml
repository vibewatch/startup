        blocks:
          - type: paragraph
            body: >-
              True Anomaly 主要靠与美国太空军及国家安全太空客户签订国防合同获得收入，业务分为三个相互整合的解决方案层：自主轨道硬件、任务软件和轨道行动。公司的旗舰硬件产品是 Jackal
              自主轨道飞行器（AOV），这是一种面向在轨监视、战术交会、空间领域感知和战术太空态势感知的可机动 ESPA 级平台。True Anomaly 将 Jackal 与 Mosaic 组合，后者是一套 AI
              驱动的指挥控制软件平台，可在多航天器星座中自动完成飞行规划和战术决策支持。收入主要来自竞争性原型合同、Other Transaction
              Authority（OTA）授标和任务执行里程碑，而不是传统的经常性商业订阅。近期重要客户里程碑包括：入选太空系统司令部 Golden Dome 项目 12 家天基拦截器原型主承包商之一，以及入选太空军
              Andromeda 项目 14 家争夺空间领域感知任务订单的承包商之一。硬件制造合同带来大额里程碑式资金流入，而 Mosaic 软件许可和运营服务是利润率更高、可经常性变现的路径，但仍取决于政府舰队持续扩张。
