      - number: '1.4'
        title: 飞行演示、国防合同与技术挑战
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 的运营成熟过程伴随着快速飞行测试，也出现了值得关注的轨道异常。2024 年 3 月，公司借助 SpaceX 的 Transporter-10 拼车任务发射最初两架
              Jackal，内部代号为 Mission X。两架飞行器都建立了太阳能发电和通信能力，但团队未能在轨执行原定的交会与近距行动测试。2024 年 12 月，第三架 Jackal 通过 SpaceX
              Bandwagon-2 部署，继续验证传感器和机动能力。与此同时，公司取得美国太空军 32 亿美元 Golden Dome 天基拦截器计划的主承包商资格，并进入 18 亿美元 Andromeda
              地球同步轨道态势感知合同的竞争名单，同时与 Firefly Aerospace 准备开展 Victus Haze 战术快速响应太空演示。独立分析指出，要证明 22
              亿美元估值合理，公司必须证明交会可靠性可以重复实现，并把国防原型项目转化为多年期经常性生产合同。
            claimRefs:
