      - number: '3.3'
        title: 分销、切换与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              主要分销优势来自进入国家安全项目，以及把硬件、软件、服务和制造能力打包提供。True Anomaly
              报告称其合同覆盖硬件、软件和服务；独立报道则称其入选天基拦截器和空间领域感知原型项目。如果项目推进，这会形成学习和采购优势，但并不会消除多重供应：机构可以资助多个原型，把专业传感器或分析能力与其他航天器组合，或依靠主承包商完成整合。任务流程、操作员培训、遥测接口和飞行程序嵌入后，切换成本可能最高；然而保留的来源没有量化续约、排他性、整合时间或供应商约束。资本和设施增强了持续经营能力，但不能证明客户被锁定。
            claimRefs:
