  - id: FE001
    title: True Anomaly 全栈太空优势架构
    type: stack
    summary: 覆盖任务指挥、云到边缘自主化、机载航空电子设备和实体航天器制造的六层架构。
    data:
      layers:
        - label: 1. 任务指挥与操作员界面
          detail: 面向 Space Force Guardians 的 Mosaic 通用作战态势图和 Ascension 多人战术指挥界面。
        - label: 2. 任务规划与数字靶场仿真
          detail: 运行于 Azure 和 Elixir 上的虚拟数字靶场，用于仿真友方与对手航天器的交会行动。
        - label: 3. 通信与地面链路集成
          detail: 利用 Viasat 网络基础设施整合全球地面站，提供韧性遥测下行链路和人在回路中的任务指令。
        - label: 4. 机载自主任务执行器
          detail: 机载 Mosaic 自主引擎将指挥官意图转化为自主交会、临近感知和实时避碰。
        - label: 5. 航天器平台航空电子设备与挂载载荷
          detail: 抗辐射计算架构、非地球天体光学成像传感器、电子战载荷及可按任务配置的挂载接口。
        - label: 6. 推进与实体结构
          detail: 冷气 / 双组元推进的 20 推进器系统，提供 800 m/s delta-v；太阳能阵列发电，并在 GravityWorks 设施制造。
    approximationNotes: 架构图反映 Mosaic 软件栈和 Jackal 航天器子系统布局的非机密披露。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 美国国防航天项目中的采用阶段和运营扩张循环。
    data:
      items:
        - label: 威胁发现与缺口评估
          detail: Space Force 操作员识别受争夺的轨道威胁，以及传统导弹防御和领域感知架构中的缺口。
          tone: neutral
        - label: 原型开发与 OTA 征集
          detail: Space Systems Command 通过其他交易授权（OTA）和竞争性原型池发起快速采购征集。
          tone: positive
        - label: 飞行经验与演示
          detail: True Anomaly 执行飞行测试（Mission X）和响应式演示任务（VICTUS HAZE），在 LEO 验证 Jackal 和 Mosaic。
          tone: positive
        - label: 主项目入选
          detail: 入选主要国防主承包商池，包括 Golden Dome 天基拦截器和 Andromeda SDA 航天器。
          tone: positive
        - label: OTA 里程碑执行与现金滞后
          detail: 付款跟随已完成的工程里程碑，在没有经常性正式项目收入的情况下，造成 90-180 天的营运资金缺口。
          tone: risk
        - label: 舰队扩张与 GEO 迁移
          detail: Denver 设施将产能扩大至每年 50 艘 Jackal 航天器，用于地球同步轨道和地月空间的运营部署。
          tone: opportunity
    approximationNotes: 旅程图阶段综合了国防采购工作流、公开 OTA 合同结构和运营扩张计划。
