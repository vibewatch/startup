      - number: '5.4'
        title: GravityWorks 生产规模化、供应依赖与技术风险
        blocks:
          - type: paragraph
            body: >-
              将航天器生产工业化，既是 True Anomaly 的主要增长方向，也是最严峻的技术挑战。公司运营约 140,000 平方英尺的先进工程和生产设施，核心是位于科罗拉多州森特尼尔的 GravityWorks
              制造总部，以及加利福尼亚州长滩的大型整合设施。True Anomaly 提出了激进的生产爬坡目标：每年生产 50 架 Jackal，以满足 Golden Dome
              天基拦截器原型和太空军监视星座潜在生产批次的需求。不过，从低速率原型制造转向序列化航空航天生产，会带来重大运营依赖。该架构高度依赖专业航空航天部件、耐辐射航电，以及 SpaceX 和 Firefly
              等商业拼车发射服务商。除供应链约束外，在拥挤的近地轨道执行近距机动还带有内在技术风险：意外推进器异常、交会时传感器失明或自主系统故障，可能引发轨道碰撞，放大太空碎片风险并触发凯斯勒综合征，严重影响运营型太空防御部署。
