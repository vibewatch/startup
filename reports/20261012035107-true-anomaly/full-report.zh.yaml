              美元，岗位主要集中在专业航空航天工程、推进、系统整合、合规和安全风险管理。物理运营开销覆盖科罗拉多州丹佛和科罗拉多斯普林斯、加利福尼亚州长滩共 140,000
              平方英尺的设施，用于任务运营、洁净室装配和卫星制造。公司宣布的目标是在丹佛工厂把 Jackal 年产能提升至最多 50 架。不过，单位经济性仍不透明：True Anomaly
