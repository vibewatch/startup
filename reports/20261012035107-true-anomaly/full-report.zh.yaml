      - number: '5.3'
        title: 战术任务、飞行演示与运营用例
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 的产品能力直接对应美国太空军的太空优势需求，覆盖四类主要运营流程：空间领域感知、战术威胁表征、对手模拟和战术快速响应防御。在空间领域感知和威胁表征用例中，Jackal
              利用近距机动和多光谱传感器检查、成像并刻画未编入目录或正在机动的轨道目标。针对战术快速响应太空（TacRS），True Anomaly 在太空军 VICTUS HAZE 项目下展示了快速交付航天器的能力，并与
              Firefly Aerospace 等发射服务商协同完成快速召集任务整合。公司的飞行履历体现出快速迭代原型路线：两架 Jackal 于 2024 年 3 月执行首次 Mission X-1 部署后，第三架
              Jackal 于 2024 年 12 月搭载 SpaceX Bandwagon-2 发射，用于成熟飞行航电和传感器运营。此外，True Anomaly 已把任务基线扩展到近地轨道之外，开发 Jackal
              深空变体，以满足地球同步轨道和地月空间的战略监视需求；这些区域的高价值国家安全资产正面临不断扩大的外国监视和拦截威胁。
