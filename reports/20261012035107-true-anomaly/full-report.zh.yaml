      - number: '5.2'
        title: Mosaic 任务自主、数字仿真与指挥架构
        blocks:
          - type: paragraph
            body: >-
              Mosaic 是 True Anomaly 产品组合的运营骨干，也是一套用于编排自主多航天器任务、压缩军事操作员战术决策周期的集成软件平台。Mosaic 采用 Elixir 编程语言，利用 BEAM
              虚拟机经过实战验证的并发性、低延迟和容错能力；它既作为地面指挥控制基础设施运行，也作为机载自主软件执行器运行。在地面端，Mosaic
              提供通用作战态势图，汇集太空和地面领域的遥测与传感器数据，并通过人机协同流程把高层级操作员意图转化为多次点火的战术机动序列。为加快任务前验证和操作员准备，Mosaic 集成 Digital
              Range，这是一套能够模拟友方和敌方轨道动力学的高保真物理仿真引擎；同时集成面向 Space Force Guardians 的 Ascension 多人训练套件。Mosaic
              执行机载自主制导和近距监测，减少对持续高带宽地面通信的依赖，这与传统国防航空航天主承包商历来交付的定制化、依赖地面的运营软件形成鲜明架构差异。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE013
