      - number: '4.2'
        title: 合同变现与政府采购机制
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 通过专门的国防采购机制变现自身能力，以加快军事航天采购。由于国防航空航天产品不采用公开目录价的商业惯例，价格按项目谈判，使用固定总价里程碑、成本补偿安排和快速 OTA
              演示协议。对轨道硬件而言，合同把定制卫星制造、平台集成、有效载荷适配和发射前功能测试打包进单任务或多飞行器任务订单。Mosaic 则与硬件项目一同部署，提供 AI
              辅助轨道机动和人机协同任务分配，但独立软件价格基准仍属机密。该领域的销售周期高度依赖联邦国防拨款、年度《国防授权法》重点和太空系统司令部的竞争性招标。Golden Dome
              等数十亿美元项目中的主承包商地位，虽然建立了可观的收入上限，但近期确认收入仍受交付进度、演示标准和合同阶段性淘汰约束。评估商业规模化时，投资者必须区分合同总上限潜力和实际获得资金授权的任务订单。
