  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 融资主标题支撑执行能力，但经济证明和证券条款仍需填补与价格敏感型投资判断之间的缺口。
    data:
      nodes:
        - id: financing
          label: $650M D 轮融资
          detail: 包含 $50M 债务；已募资金不等于可用现金。
        - id: roadmap
          label: 任务与项目路线图
          detail: 十几项任务和 Andromeda 交付是公司自述的计划。
        - id: execution
          label: 执行测试
          detail: 项目转化、任务进展和交付节奏仍是决定性因素。
        - id: economics
          label: 经济证明缺口
          detail: 收入、利润率、烧钱速度、现金及有资金支持的积压订单转化均未披露。
        - id: price
          label: 据报道的 $2.2B 估值
          detail: 据第三方报道；公司 D 轮公告未提及。
        - id: decision
          label: 继续研究
          detail: 在私有尽调完成前，风险高且估值偏高。
      edges:
        - from: financing
          to: roadmap
        - from: roadmap
          to: execution
        - from: execution
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: 该流程是决策顺序，不是对现金余额、概率或合同收入的预测或呈现。
