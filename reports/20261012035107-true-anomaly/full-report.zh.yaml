chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营布局
        blocks:
          - type: paragraph
            body: >-
              True Anomaly, Inc. 是一家成立于 2022 年 8
              月、总部位于科罗拉多州森特尼尔的风险资本支持型国防科技公司。公司专注国家安全太空领域，设计并制造自主轨道飞行器、人工智能驱动的指挥软件和专用有效载荷，用于太空优势与威慑。其核心产品包括 Jackal
              自主轨道飞行器——一种可消耗、高度机动的航天器，针对近地轨道、地球同步轨道和地月空间的交会与近距行动而设计——以及 Mosaic，这是一套全栈自主与战场管理软件平台，可把操作员意图转化为自主轨道行动。True
              Anomaly 在科罗拉多州森特尼尔和科罗拉多斯普林斯、加利福尼亚州长滩及华盛顿特区合计拥有 140,000 平方英尺的运营空间。
            claimRefs:
              - CO001
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 创始人、高管领导与治理
        blocks:
          - type: paragraph
            body: >-
              公司由一批曾从事军事航天和技术工作的人员创立：首席执行官 Even Rogers 曾任美国空军少校，具备太空威慑和轨道作战战术经验；Kyle Zakrzewski
              曾任太空军和空军军官，专长轨道交战行动；Daniel Brunski 专注自主飞行动力学和近距机动；Tom Nichols 专长航空航天硬件架构与原型设计。航天器开发和制造由航天器开发总监 Sean
              Ozdemir 负责，他把航天器工程团队从最初的白板概念扩展成一体化设计、测试和生产团队。关键人物依赖仍高度集中在 CEO Even Rogers 身上，其经历连接了军事行动需求、五角大楼采购关系和私人资本募集。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历史、估值与利益相关方画像
        blocks:
          - type: paragraph
            body: >-
              自成立以来，True Anomaly 累计获得超过 $1B 资本，其中包括 2026 年 4 月 28 日完成的 $650M Series D，投后估值为 $2.2B。本轮由风险投资机构 Eclipse 和
              Riot Ventures 共同领投，新增长型和跨界投资者 Paradigm、Atreides、G Squared、The Private Shares Fund 与 VanEck 参与，既有支持者
              Accel、Menlo Ventures 和 Meritech Capital 也继续跟投。交易还包含 Stifel Bank 提供的 $50M 债务额度。此前，公司于 2025 年 4 月完成由 Accel
              领投的 $260M Series C。公司正把资本用于把制造吞吐能力提升至每年约 50 架 Jackal，并将员工总数从 300 人增至 2026 年底约 500 人。
            claimRefs:
