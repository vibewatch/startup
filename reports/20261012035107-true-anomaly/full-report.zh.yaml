  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              国防航天市场正从传统的地基空间态势感知，结构性转向主动式天基空间领域感知和太空优势行动。过去，军事航天监视主要依靠地面雷达跟踪网络和光学望远镜监测轨道碎片、编制固定卫星目录。但随着近地轨道出现更多可机动对手卫星和反空间威胁，地球同步轨道、地月空间等轨道区域迫切需要动态在轨检查与近距行动平台。True
              Anomaly 的可服务市场边界严格限于国家安全太空优势能力，具体包括高 delta-v
              可机动航天器、自主交会与近距行动系统，以及一体化战场管理指挥控制软件。该边界明确排除商业卫星通信、消费级地球观测星座、商品化运载火箭制造和民用太空科学任务。传统替代方案主要是传统航空航天国防主承包商耗费十多年采购周期建造的大型精密卫星，但这类卫星缺乏争夺性行动所需的快速生产节奏和轨道机动能力。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 可服务市场规模、合同上限与测算视角
        blocks:
          - type: paragraph
            body: >-
              要测算国家安全可机动航天器市场，必须拆分高层级国防拨款、多授标不定期交付 / 不定量合同的上限授权，以及近期可服务任务订单预算。重点项目显示政府需求可观：美国太空军设立 Andromeda IDIQ，累计上限
              18 亿美元，用于采购空间领域感知和战术快速响应能力。与此同时，太空系统司令部启动 Golden Dome
              天基拦截器计划的原型开发，潜在架构规模达数十亿美元。不过，从投资尽调角度看，不能把这些宏观上限当成供应商已经锁定的订单积压。无论在 Andromeda 项目还是太空军地球同步轨道监视竞标中，True
              Anomaly 都只是 14 家竞争企业之一，争取的是具体交付订单。同样，Golden Dome 原型合同也分配给了 12 个承包商团队。因此，尽管太空军的研究、开发、测试与评估预算总额达数百亿美元，True
              Anomaly 近期可服务市场仍受这些共享资金池的竞争性分配所约束。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 买方、用户、付款方分层与采购流程
        blocks:
          - type: paragraph
            body: >-
              太空优势硬件和软件的客户集中在美国国防部及盟国国家安全机构。主要采购部门是美国太空军的太空系统司令部，旗下有 Space Safari 等战术快速响应太空项目办公室，也有 SpaceWERX
              等商业技术转化机构。实际用户包括 Space Delta 指挥梯队和联合战斗司令部，如美国太空司令部和美国战略司令部；他们需要实时轨道表征和威胁威慑能力。预算权来自国会国防拨款委员会，覆盖 Title 10
              下的军人人员、采购和研究账户。采购流程不同于商业企业销售周期，严重依赖行动能力演示。VICTUS HAZE 战术快速响应太空飞行任务等项目是必要的闸门里程碑：供应商必须证明能在 72
              小时内向非合作目标机动，才有资格参与后续经常性生产采购。
            claimRefs:
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动因素、资本强度与结构性市场约束
        blocks:
          - type: paragraph
            body: >-
              可机动太空优势平台的采用，受到地缘政治摩擦加剧以及官方将轨道认定为主动作战领域的推动。军事规划者需要能动态机动的系统，以应对地球同步轨道潜在对手的动能和非动能拦截；关键导弹预警和国家通信资产正位于该轨道。为了满足客户对高运营可用率的需求，True
              Anomaly 计划在科罗拉多工厂把 Jackal 的制造节奏提升至每年最多 50
              架。不过，市场扩张受到严重的结构性约束。天基拦截器和轨道作战架构需要巨额资本投入、复杂的航天飞行认证以及严格的供应链整合。此外，原型演示项目还会遭遇执行瓶颈：从实验性原型授标转向多年期项目采购，需要国会持续授权国防预算，而地缘政治和预算优先级又在不断变化。任务订单资金义务缺少透明、非机密的报告，也给长期商业收入预测带来重大不确定性。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: IDIQ 上限混淆风险
            body: 18 亿美元 Andromeda IDIQ 等合同工具的最高额度，是 14 家竞争公司共享的采购上限，不是 True Anomaly 已承诺的订单积压或保证收入。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM013
              - CM014
          - type: callout
            title: 从监视转向主动优势的作战理念转变
            body: 国防航天需求正从地基被动跟踪，结构性转向能够执行动态近距行动并持续监视 GEO 的在轨可机动航天器。
            calloutType: insight
            claimRefs:
              - CM001
              - CM010
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争边界不止是可机动卫星。True Anomaly 把 Jackal、有效载荷和 Mosaic
              作为一套太空优势系统推出，而保留的市场资料还显示，商业空间领域感知供应商、轨道服务飞行器公司、广义航天器和发射供应商以及大型国防主承包商都在争夺相关政府预算。因此，买方可以选择垂直整合的专业厂商，在内部整合项目下拼装单点产品，把任务交给现有主承包商，或继续采用现有的跟踪与传统航天器组合。这些是替代采购路径，不一定是产品完全相同的同业公司。公开证据对
              True Anomaly 自身范围的支持最强，对竞争者规模、融资和项目层面表现的支持最弱，因此画像表把这些单元格标为未知，而不是推断双方相当。
            claimRefs:
              - CP001
              - CP008
              - CP009
              - CP010
              - CP011
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP009
              - CP010
