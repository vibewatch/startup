  - id: FP001
    title: 按一体化广度和公开任务证据划分的竞争定位
    type: quadrant
    summary: 受证据约束的序数图展示 True Anomaly 已披露的一体化广度，同时强调同类替代方案缺乏可比的公开运营数据。
    data:
      xAxis:
        label: 硬件与软件一体化广度
        min: 1
        max: 5
      yAxis:
        label: 公开记录的响应式 / 临近任务证据
        min: 1
        max: 5
      points:
        - label: True Anomaly
          x: 5
          'y': 4
          rationale: Full-stack scope and multiple flights are public; neutral telemetry is not.
        - label: 商业跟踪专业厂商
          x: 2
          'y': 2
          rationale: Retained evidence identifies tracking overlap but not an owned full-stack mission system.
        - label: 轨道服务航天器
          x: 3
          'y': 3
          rationale: The category overlaps in maneuver and proximity operations; comparable results are absent.
        - label: 综合航天器平台
          x: 3
          'y': 2
          rationale: Broader infrastructure scope is identified without a common mission benchmark.
        - label: 现有国防主承包商
          x: 4
          'y': 2
          rationale: Integration breadth is plausible from category position, but program-level evidence is missing.
        - label: 内部自建 / 现状
          x: 2
          'y': 1
          rationale: A substitute procurement path with no comparable public performance record in the pool.
    approximationNotes: 分数是分析师根据指定样本中已披露的类别范围和证据可得性编制的 1 至 5 序数值；它们不是实测表现、市场份额、定价或经独立验证的能力分数。
