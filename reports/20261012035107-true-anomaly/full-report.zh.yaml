        - 据报道的 $2.2B 估值缺乏公开收入和盈利能力支持。
        - 以经审计的增长、利润率、积压订单质量和支持投资者回报的证券条款为依据。
    notes: 该表将已披露的计划和融资，与需要私有信息验证的经济结果区分开来。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 主要风险和下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - 任务推进，项目准入转化为有资金支持的生产，且可重复的经济模型逐渐显现。
        - 相对于据报道的 $2.2B 估值，溢价或许有依据；但公开数据无法支持上限或回报倍数。
        - 任务失败、项目筛选落选，或利润率持续受硬件约束。
        - 只有经审计的积压订单、利润率和交付证据出现后，信号才会增强。
      - - 基准
        - 项目参与持续，但生产和经济证明逐步到位。
        - 只有新证据验证当前预期时，估值才可能接近据报道的 $2.2B；回报仍无法量化。
        - 任务订单延迟、进一步稀释，或积压订单向收入转化乏力。
        - 信号中性：融资和项目准入可见，但运营经济指标不可见。
      - - 悲观
        - 项目转化或任务执行不及预期，而固定投资和融资需求仍在持续。
        - 低于据报道的 $2.2B 估值；没有股权结构表，无法估算经优先权调整的损失。
        - 失去重要项目位置、任务反复延迟、契约压力，或发生稀释性融资。
        - 在披露项目经济指标和现金跑道前，风险仍然重大。
    notes: 各档位是相对于据报道投后估值的定性判断，不是内在价值区间；由于缺少必要财务输入，没有赋予数值概率或回报。
    claimRefs:
      - CV004
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: True Anomaly 创立、融资轮次、飞行测试演示及国防合同入选情况的时间线，覆盖至 2026 年。
    data:
      items:
        - date: 2022-08
          label: 在科罗拉多州 Centennial 创立
          detail: True Anomaly 由退役军人 Even Rogers、Kyle Zakrzewski、Daniel Brunski 和 Tom Nichols 创立。
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: 2024-02
          label: Jackal AOV 交付至 Vandenberg
          detail: 最初两艘 Jackal 航天器在科罗拉多完成功能检查，并运往 Vandenberg SFB。
          tone: positive
          claimRefs:
            - CO003
            - CO012
        - date: 2024-03
          label: Mission X Transporter-10 飞行异常
          detail: 首对 Jackal 搭载 SpaceX Transporter-10 发射；卫星成功通电，但未通过交会测试。
          tone: negative
          claimRefs:
            - CO012
        - date: 2024-04
          label: Victus Haze 合同授予
          detail: Space Systems Command 选择 True Anomaly 与 Firefly Aerospace 共同执行 TacRS 演示任务。
          tone: positive
          claimRefs:
            - CO013
        - date: 2024-12
          label: Jackal Bandwagon-2 发射
          detail: 第三艘 Jackal 搭乘 SpaceX Bandwagon-2 拼车发射，开展在轨子系统验证。
          tone: positive
          claimRefs:
            - CO012
        - date: 2025-04
          label: $260M C 轮融资
          detail: Accel 牵头的超额认购成长融资，并配套 Stifel 债务，用于加快设施和舰队扩张。
          tone: positive
          claimRefs:
            - CO007
        - date: 2026-04
          label: $650M D 轮融资，估值 $2.2B
          detail: Eclipse 和 Riot Ventures 共同牵头的大额融资，另有 Stifel 提供的 $50M 债务，使累计融资超过 $1B。
          tone: positive
          claimRefs:
            - CO004
            - CO005
            - CO006
        - date: 2026-04
          label: Golden Dome 与 Andromeda 入选
          detail: 获授原型合同，成为 12 家 Golden Dome 拦截器主承包商之一，也是 14 家 Andromeda SDA 承担方之一。
          tone: positive
          claimRefs:
            - CO010
            - CO011
    approximationNotes: 日期代表航空航天新闻和公司新闻稿记录的公开披露及发射日期。
    claimRefs:
