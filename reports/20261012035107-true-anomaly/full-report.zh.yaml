  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Jackal 自主轨道飞行器架构与子系统
        blocks:
          - type: paragraph
            body: >-
              True Anomaly 的硬件架构以 Jackal 自主轨道飞行器（AOV）为中心。这是一种 ESPA 级航天器平台，专门为动态空间到空间行动设计，而不是静态轨道监视。Jackal
              的尺寸大致相当于一台小型冰箱，打破了传统国防卫星设计：它优先追求极高机动性和可消耗式生产经济性，而不是数十年的轨道寿命。飞行器集成了先进的 20 推进器架构，总 delta-v 约 800
              m/s，足以快速改变轨道平面、执行变轨和针对近地轨道非合作目标开展交会与近距行动（RPO）。Jackal
              的实体结构带有可重构任务挂载点，可搭载非地球成像光学有效载荷、红外传感器、射频诊断工具和潜在主动效应器。电力由可展开太阳能阵列翼和高密度机载电池储备共同提供。2024 年 3 月在 SpaceX
              Transporter-10 上的首次飞行验证证明了太阳能发电和基础遥测，但未能完成自主交会机动，说明在 True Anomaly 计划把 Jackal
              平台扩展至地球同步轨道和地月空间运行范围时，在轨近距机动仍是关键技术障碍。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE010
