              - CP014
      - number: '3.2'
        title: 能力与商业对比
        blocks:
          - type: paragraph
            body: >-
              True Anomaly
              披露的产品主张，把可机动航天器、模块化任务挂载点、任务规划、指挥控制和自主能力放进同一套系统。独立技术评论描述了相同的系统级闭环，但也提醒，遥测、错失距离、不确定性边界、推进剂消耗和政府测试报告都未公开。这个区分很重要：产品广度看得见，但经过独立基准验证的优越性看不见。已分配的证据同样没有提供
              True Anomaly
              或所列替代方案面向客户的价格、单航天器价格、软件订阅价格或实际合同经济性。采购看起来更像项目制、谈判式采购，而不是目录定价，因此总任务成本、整合负担、进度和保障证据，比没有依据的价格排名更适合作为购买标准。
            claimRefs:
