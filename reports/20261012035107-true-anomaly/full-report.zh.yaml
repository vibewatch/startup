      - number: '3.4'
        title: 反向证据与竞争结论
        blocks:
          - type: paragraph
            body: >-
              最有力的反证是执行风险，而不是已有记录的价格战。独立报道称，最初两架 Jackal
              成功发电，却没有完成计划中的交会测试；后续评论则认为公开记录具体但不完整。后来受控航天器和公司报告的运营飞行任务显示产品在迭代，但中立比较所需的底层遥测不可得。因此，稳妥结论是有条件的：True Anomaly
              拥有可信的全栈定位和不寻常的融资能力，但能否持久取决于可重复的飞行表现、生产节奏、项目转化和经过验证的成本。在这些数据缺失时，现有主承包商的反制、内部整合和单点方案组合仍是可信的替代路径。
