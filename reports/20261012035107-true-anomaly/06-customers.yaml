chapter:
  number: 6
  title: "Customers"
  summary: "True Anomaly operates with an exclusively U.S. national security customer base, having secured prime contractor prototype selections on the Space Force's flagship Golden Dome and Andromeda programs alongside tactical demonstration awards like VICTUS HAZE. However, the company holds zero commercial revenue hedge and relies on Other Transaction Authority milestone disbursements without documented Program of Record baseline revenue, exposing its rapid operational expansion to substantial working capital payment lags."
sections:
  - id: "customer-segmentation"
    title: "Customer Base Segmentation and National Security Focus"
    body: "True Anomaly operates with a singular focus on national security space defense, explicitly eschewing dual-use commercial markets. The company's customer base is concentrated within the United States defense establishment, specifically the United States Space Force (USSF), Space Systems Command (SSC), and related defense intelligence stakeholders. Within this customer ecosystem, demand is segmented into three primary operational vectors: space domain awareness, space-based missile defense interception, and tactically responsive space operations. In contrast to legacy defense aerospace contractors that maintain substantial commercial satellite or launch divisions, True Anomaly has constructed its entire product portfolio around purpose-built military requirements. Company leadership has affirmed that commercial communications and Earth observation are not target markets; rather, the enterprise exists to defend critical space infrastructure on behalf of the U.S. government and allied partners. While allied and coalition defense ministries represent a strategic long-term expansion vector, all publicly confirmed procurement activity and active prototype engagements remain anchored exclusively within U.S. Department of Defense commands."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU006"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Adoption Trajectory and Mission Cadence"
    body: "True Anomaly's customer adoption trajectory is defined by a rapid progression from company-funded orbital flight tests toward competitive selections on flagship national security programs. Following initial flight trials in Low Earth Orbit—including the launch of its first two Jackal Autonomous Orbital Vehicles on Transporter-10 in early 2024—the company shifted focus toward operational customer demonstrations. A major inflection occurred in April 2026 when the Pentagon selected True Anomaly as one of 12 prime contractors awarded prototype technologies contracts under the multi-billion-dollar Golden Dome space-based interceptor initiative. Simultaneously, the company secured a position among 14 vendors on the Space Force's Andromeda space domain awareness program, which carries a potential contract ceiling of $1.8 billion. To meet expanding mission commitments across contested orbital regimes, True Anomaly has scaled its physical infrastructure across Denver, Colorado Springs, and Long Beach, expanding its workforce toward a target of 500 employees by year-end 2026. This operational ramp supports a planned mission cadence of approximately a dozen missions over 18 months, extending beyond Low Earth Orbit into geostationary orbit and cislunar space."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof"
    title: "Named Customer Proof and Program Engagement"
    body: "Documented proof of customer adoption centers on high-visibility Space Force contracts and joint operational demonstrations. True Anomaly's most prominent customer engagement is its prime contractor position on the Space Systems Command Golden Dome program, where it develops space-based interceptor hardware and software architectures designed to track and neutralize hypersonic and orbital threats. In parallel, the company participates in the VICTUS HAZE Tactically Responsive Space mission in partnership with Firefly Aerospace, demonstrating rapid-response on-orbit threat characterization and rendezvous proximity operations under compressed operational timelines. Beyond hardware platforms, the company's Mosaic software suite has secured adoption under the Space Force Rapid Resilient Command and Control program, establishing operational software footprints within military command centers. While these engagements validate True Anomaly's technical credibility and non-traditional prime contractor status, verified customer proof remains primarily situated within prototype awards and competitive demonstration phases rather than mature, recurring multi-year procurement programs."
    claimRefs:
      - "CU003"
      - "CU008"
      - "CU009"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-concentration-risks"
    title: "Customer Retention, Cash Flow Mechanics, and Monopsony Risk"
    body: "Because True Anomaly sells exclusively to the defense sector, its business model is subject to acute customer concentration and procurement friction inherent to sovereign defense contracting. Government procurement is structured primarily around Other Transaction Authority (OTA) agreements and prototype demonstration milestones rather than steady commercial subscriptions. Independent supply chain intelligence highlights that OTA disbursements follow verified technical milestone completion rather than predictable quarterly schedules, creating working capital lag times of 90 to 180 days that must be absorbed through venture capital reserves during rapid manufacturing scale-up. Furthermore, True Anomaly currently lacks disclosed baseline revenue from established Programs of Record, meaning customer retention cannot yet be evaluated through standard commercial metrics such as Net Revenue Retention or contract renewals. Durability depends on successfully converting competitive prototype positions—particularly on Golden Dome and Andromeda—into long-term production contracts, navigating down-selection cycles where the company faces well-capitalized defense incumbents."
    claimRefs:
      - "CU010"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
