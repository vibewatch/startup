companyProfile:
  summary: >-
    True Anomaly is a venture-backed defense-space company that combines maneuverable spacecraft, mission software,
    payloads, and responsive space operations for U.S. national-security customers. Founded in August 2022 and
    headquartered in Centennial, Colorado, the company has grown around Jackal autonomous orbital vehicles and the
    Mosaic command-and-control software stack, while building a customer base centered on the U.S. Space Force and
    related defense-space programs. The business is well capitalized after a $650 million April 2026 Series D, but the
    public record still leaves revenue quality, margins, cap-table terms, and mission reliability incompletely
    disclosed.
