  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: Comparable bids, awarded contract values, spacecraft unit prices, Mosaic license terms, discounts, support fees, and realized gross margins.
      whyItMatters: Without normalized commercial terms, the analysis cannot test price leadership, total mission cost, or whether integration breadth earns attractive economics.
      diligencePath: Request redacted proposals and contracts, normalize scope and data rights, and compare life-cycle cost for at least three procurement paths.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: independent-verification
