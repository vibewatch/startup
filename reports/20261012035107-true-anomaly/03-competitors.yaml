      - ["Independent performance evidence", "Underlying telemetry not public", "Unknown in pool", "Unknown in pool", "Unknown in pool", "A neutral, common-scenario test is required"]
    notes: >-
      Disclosed denotes a retained public statement, not independently verified performance.
      Category overlap is based on the retained landscape description; all unsupported cells
      are explicitly marked unknown.
