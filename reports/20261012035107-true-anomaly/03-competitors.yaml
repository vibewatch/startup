      - [Point-solution assembly, "Buyer combines tracking, software, spacecraft, and integration", "Unknown", "Capabilities split across suppliers", "Model total integration and assurance cost rather than list price"]
      - [Incumbent-prime award, "Prime-led government contract", "Unknown", "Program integration plus subcontracted components may be included", "Compare schedule, risk transfer, fee, and data rights"]
      - [Internal build / status quo, "Government or operator retains integration and existing assets", "Unknown", "Depends on current fleet, tools, and workforce", "Use avoided procurement cost alongside readiness and opportunity cost"]
    notes: >-
      No reviewed source in the assigned pool publishes comparable customer-facing prices or
      realized contract economics. Commercial-model descriptions are evidence-constrained
      procurement interpretations, and every price cell remains unknown.
    claimRefs: [CP002, CP012, CP013, CP015]
figures:
  - id: FP001
    title: Competitive positioning by integrated breadth and public mission evidence
    type: quadrant
    summary: >-
      An evidence-constrained ordinal map shows True Anomaly's disclosed integration breadth
      while emphasizing that category alternatives lack comparable public operating data.
    data:
      xAxis:
        label: Integrated hardware-software breadth
        min: 1
        max: 5
      yAxis:
        label: Publicly documented responsive / proximity mission evidence
        min: 1
        max: 5
      points:
        - label: True Anomaly
          x: 5
          y: 4
          rationale: "Full-stack scope and multiple flights are public; neutral telemetry is not."
        - label: Commercial tracking specialists
          x: 2
          y: 2
          rationale: "Retained evidence identifies tracking overlap but not an owned full-stack mission system."
        - label: Orbital servicing vehicles
          x: 3
          y: 3
          rationale: "The category overlaps in maneuver and proximity operations; comparable results are absent."
        - label: Broad spacecraft platforms
          x: 3
          y: 2
          rationale: "Broader infrastructure scope is identified without a common mission benchmark."
        - label: Incumbent defense primes
          x: 4
          y: 2
          rationale: "Integration breadth is plausible from category position, but program-level evidence is missing."
        - label: Internal build / status quo
          x: 2
          y: 1
          rationale: "A substitute procurement path with no comparable public performance record in the pool."
    approximationNotes: >-
      Scores are analyst-authored ordinal values from 1 to 5 based only on disclosed category
      scope and evidence availability in the assigned pool; they are not measured performance,
      market share, pricing, or independently verified capability scores.
    claimRefs: [CP004, CP006, CP007, CP015, CP016]
callouts:
  - calloutType: strength
    title: Full-stack scope is the visible differentiator
    body: >-
      The retained record consistently describes True Anomaly as combining spacecraft,
      payload hosting, autonomy, mission planning, and command software rather than selling a
      single tracking or servicing component.
    claimRefs: [CP001, CP003, CP004]
  - calloutType: risk
    title: Comparative economics are not public
    body: >-
      No assigned source supports a customer-facing price, realized contract unit, renewal
      metric, or neutral cost comparison, so cost leadership and switching-cost claims remain
      underwriting gaps.
    claimRefs: [CP012, CP013, CP016]
