callouts:
  - calloutType: "risk"
    title: "Flight Heritage Deficit in Autonomous Rendezvous"
    body: "True Anomaly's core capability claims depend on autonomous proximity operations and high-delta-v maneuvers in contested orbits. The loss of communications during Mission X-1 prevented the planned demonstration of live rendezvous, leaving the primary operational proof unresolved until future orbital flights validate the full guidance and control stack."
    claimRefs:
      - "CR001"
      - "CR011"
  - calloutType: "insight"
    title: "Golden Dome Program Down-Selection Exposure"
    body: "Selection as one of 12 prime contractors for the Pentagon's Golden Dome prototype program provides significant strategic momentum and helped catalyze the $650M Series D round. However, defense space prototype awards historically experience severe attrition during down-selection to production contracts, meaning True Anomaly must outcompete established defense primes to convert early prototype funding into sustainable program-of-record revenue."
    claimRefs:
      - "CR003"
      - "CR013"
