      - number: '2.3'
        title: Buyer, User, and Payer Segmentation and Procurement Workflows
        blocks:
          - type: paragraph
            body: >-
              The customer landscape for space superiority hardware and software is concentrated within the United
              States Department of Defense and allied national security establishments. The primary procurement
              authority is the U.S. Space Force's Space Systems Command, operating through specialized program offices
              such as Space Safari for tactically responsive space initiatives and SpaceWERX for commercial technology
              transition. Operational users comprise Space Delta command echelons and joint combatant commands,
              including U.S. Space Command and U.S. Strategic Command, who require real-time orbital characterization
              and threat deterrent capabilities. Budget authority originates from congressional defense appropriations
              committees funding designated program elements across Title 10 military personnel, procurement, and
              research accounts. The procurement workflow departs from commercial enterprise sales cycles, depending
              heavily upon operational capability demonstrations. Programs such as the VICTUS HAZE Tactically Responsive
              Space sortie serve as necessary gating milestones, wherein vendors must prove rapid orbital response
              timelines—maneuvering toward non-cooperative targets within 72 hours—before qualifying for recurring
              production procurement.
            claimRefs:
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Capital Intensity, and Structural Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of maneuverable space superiority platforms is propelled by intensifying geopolitical friction
              and official recognition of orbit as an active warfighting domain. Military planners require systems
              capable of dynamic maneuvering to counter potential adversary kinetic and non-kinetic interdiction in
              geostationary orbit, where critical missile-warning and national communications assets reside. In response
              to customer demand for high-rate operational availability, True Anomaly has targeted a manufacturing
              cadence of up to 50 Jackal spacecraft per year at its Colorado facilities. Nonetheless, severe structural
              constraints govern market expansion. Space-based interceptor and orbital combat architectures demand
              immense capital intensity, complex spaceflight qualification, and rigorous supply chain integration.
              Furthermore, prototype demonstration programs face execution bottlenecks: transitioning from experimental
              prototype awards into multi-year programmatic procurement requires continuous congressional defense
              authorization amidst shifting geopolitical and budgetary priorities. The lack of transparent, unclassified
              reporting on task-order funding obligations introduces material uncertainty into long-term commercial
              revenue forecasting.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: IDIQ Ceiling Conflation Risk
            body: >-
              Contract vehicle maximums such as the $1.8 billion Andromeda IDIQ represent shared procurement ceilings
              across 14 competing companies rather than committed backlog or guaranteed revenue for True Anomaly.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM013
              - CM014
          - type: callout
            title: Doctrine Shift from Surveillance to Active Superiority
            body: >-
              Defense space demand is structurally inflecting from ground-based passive tracking toward on-orbit
              maneuverable spacecraft capable of dynamic proximity operations and persistent GEO monitoring.
            calloutType: insight
            claimRefs:
              - CM001
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary is wider than maneuverable satellites. True Anomaly presents Jackal, payloads,
              and Mosaic as one space-superiority stack, while the retained landscape source identifies commercial
              space-domain-awareness providers, an orbital servicing vehicle company, broader spacecraft and launch
              suppliers, and major defense primes competing for related government budgets. A buyer can therefore select
              a vertically integrated specialist, assemble point products under an internal integration program, award
              the mission to an incumbent prime, or retain the existing mix of tracking and conventional spacecraft.
              These are substitute procurement paths, not necessarily product-identical peers. Public evidence is
              strongest for True Anomaly's own scope and weakest for competitor scale, funding, and program-level
              performance, so the profile table treats those cells as unknown instead of inferring parity.
            claimRefs:
              - CP001
              - CP008
