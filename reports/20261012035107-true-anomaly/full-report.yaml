      - number: '3.2'
        title: Capability and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              True Anomaly's disclosed proposition combines a maneuverable spacecraft, modular mission hardpoints,
              mission planning, command and control, and autonomy in a common stack. Independent technical commentary
              describes the same system-level loop but cautions that telemetry, miss distances, uncertainty bounds,
              propellant use, and a government test report are not public. That distinction matters: breadth is visible,
              independently benchmarked superiority is not. The assigned evidence also contains no customer-facing
              price, per-spacecraft price, software subscription, or realized contract economics for True Anomaly or
              named alternatives. Procurement appears programmatic and negotiated rather than catalog-priced, making
              total mission cost, integration burden, schedule, and assurance evidence more useful buying criteria than
              an unsupported price rank.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP012
              - CP013
