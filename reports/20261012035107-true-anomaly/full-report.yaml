      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that an integrated spacecraft-and-software supplier can win durable positions as U.S.
              national-security space programs move from prototypes toward operational fleets. True Anomaly says it
              builds spacecraft, software, and payloads for space superiority; it also plans a dozen missions over 18
              months and delivery of Jackal into the Andromeda program. The anti-thesis is execution concentration. An
              independent industry analysis describes True Anomaly as one of 12 Golden Dome contractors and identifies
              program execution, manufacturing cadence, and mission progression as valuation tests. Those are
              opportunities, not booked economic outcomes. Failure to convert program access into funded, repeatable
              deliveries would weaken both the growth case and the current valuation anchor.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Financing and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              The April 2026 Series D was $650 million, including $50 million of debt from Stifel Bank, and the company
              said cumulative capital raised since 2022 exceeded $1 billion. That follows a $260 million Series C,
              inclusive of equity and debt, and a $100 million Series B. The sequence demonstrates access to large pools
              of institutional capital, but it does not establish cash available after historical spending. Nor does the
              public record separate equity from debt in every earlier round or disclose the current cap table,
              liquidation preferences, option overhang, debt covenants, or dilution expected from future financing.
              Those missing security-level details prevent a reliable estimate of investor proceeds even if an
              enterprise-value outcome were known.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
      - number: '8.4'
        title: Scenarios and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should use the reported $2.2 billion post-money mark as a reference point, not as
              verified intrinsic value. A bear outcome sits below that mark if mission or program conversion
              disappoints; a base outcome remains around the mark only if funded backlog, margins, and delivery
              reliability become visible; and a bull outcome can justify a premium only after repeatable mission and
              production proof. Precise probabilities and return multiples are not supportable from the retained
              evidence. A third-party registry offers historical IPO price-to-sales yardsticks of roughly 1x to 33x
              across five space and defense companies, but True Anomaly's undisclosed revenue makes those multiples
              non-transferable. They show dispersion, not a defensible company value.
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exit Readiness and Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness remains unproven. One industry analysis reports that the company has not set an IPO
              timeline, and the retained sources provide no audited operating history with which to test public-market
              readiness. Before underwriting an entry, investors should obtain audited statements, revenue and
              funded-backlog bridges, hardware and software gross margins, cash and burn schedules, program-level task
              orders, cap-table and preference documents, debt agreements, and mission-reliability evidence.
              Thesis-break triggers should include loss of material program positions, repeated mission failures,
              sustained manufacturing delays, or economics that require recurring dilutive capital without corresponding
              funded backlog. A supported target return, hold period, and exit range must wait for those private inputs
              rather than being invented from the financing headline.
            claimRefs:
              - CV013
              - CV014
              - CV016
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Strategic relevance is not enough to support the reported valuation without audited economics and
              security-level terms.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Financing is not liquidity
            body: >-
              More than $1 billion of cumulative capital raised does not establish current cash on hand, runway, or
              proceeds available to new investors.
            calloutType: risk
            claimRefs:
              - CV003
              - CV013
