              - CP015
      - number: '3.3'
        title: Distribution, switching, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The principal distribution advantage is access to national-security programs and the ability to offer
              hardware, software, services, and manufacturing capacity together. True Anomaly reported contracts
              spanning hardware, software, and services, while independent reporting says it was selected for prototype
              work in space-based interceptors and space-domain awareness. That creates learning and procurement
              advantages if programs progress, but it does not eliminate multi-homing: agencies can fund several
              prototypes, combine specialist sensors or analytics with other spacecraft, or rely on prime contractors
              for integration. Switching costs are likely highest after mission workflows, operator training, telemetry
              interfaces, and flight procedures are embedded, yet the retained sources do not quantify renewal,
              exclusivity, integration time, or supplier constraints. Capital and facilities improve staying power, but
              they are not proof of customer lock-in.
            claimRefs:
              - CP002
              - CP005
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP015
              - CP016
      - number: '3.4'
        title: Adverse evidence and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence is execution risk rather than a documented price war. Independent
              reporting says the first two Jackals generated power but did not complete the planned rendezvous test, and
              later commentary characterizes the public record as specific but incomplete. A later controlled spacecraft
              and company-reported operational sorties indicate iteration, but the underlying telemetry needed for a
              neutral comparison is unavailable. The defensible conclusion is therefore conditional: True Anomaly has a
              credible full-stack position and unusual financing capacity, but durability depends on repeatable flight
              performance, production cadence, program conversion, and verified cost. Without those data, incumbent
              response, internal integration, and point-solution combinations remain credible displacement paths.
            claimRefs:
              - CP006
              - CP007
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack scope is the visible differentiator
            body: >-
              The retained record consistently describes True Anomaly as combining spacecraft, payload hosting,
              autonomy, mission planning, and command software rather than selling a single tracking or servicing
              component.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP004
          - type: callout
            title: Comparative economics are not public
            body: >-
              No assigned source supports a customer-facing price, realized contract unit, renewal metric, or neutral
              cost comparison, so cost leadership and switching-cost claims remain underwriting gaps.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Core Defense Space Streams
        blocks:
          - type: paragraph
            body: >-
              True Anomaly generates revenue primarily through defense contracting with the U.S. Space Force and
              national security space customers across three integrated solution layers: autonomous orbital hardware,
              mission software, and orbital operations. The company's flagship hardware offering is the Jackal
              Autonomous Orbital Vehicle (AOV), designed for rendezvous and proximity operations, persistent orbital
              surveillance, and tactical space domain awareness. True Anomaly packages Jackal with Mosaic, an AI-enabled
              command-and-control software platform that automates flight planning and tactical decision-support across
              multi-spacecraft constellations. Revenue realization occurs through competitive prototype contracts, Other
              Transaction Authority (OTA) awards, and mission execution milestones, rather than traditional recurring
              commercial subscription streams. Significant recent customer milestones include selection as one of 12
              prime contractors developing space-based interceptor prototypes for the Space Systems Command Golden Dome
              program, as well as selection among 14 contractors competing for space domain awareness task orders under
              the Space Force Andromeda program. While hardware manufacturing contracts deliver large milestone-based
              injections, Mosaic software licensing and operational services represent higher-margin, recurring
              monetization avenues that remain tied to ongoing government fleet expansion.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI013
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
