  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The defense space market is undergoing a structural transition from legacy, ground-based Space Situational
              Awareness toward active, space-based Space Domain Awareness and space superiority operations.
              Historically, military space surveillance relied upon terrestrial radar tracking networks and optical
              telescopes to monitor orbital debris and catalog fixed satellite positions. However, the proliferation of
              maneuverable adversary satellites and counter-space threats in low Earth orbit, geostationary Earth orbit,
              and cislunar transit regimes has created an urgent requirement for dynamic, on-orbit inspection and
              proximity operations platforms. The addressable market boundary for True Anomaly strictly encompasses
              national security space superiority capabilities—specifically high-delta-v maneuverable spacecraft,
              autonomous rendezvous and proximity operations systems, and integrated battle management
              command-and-control software. This boundary deliberately excludes commercial satellite communications,
              consumer Earth observation constellations, commoditized launch vehicle manufacturing, and civil space
              science missions. Status-quo substitutes have historically comprised large exquisite satellites built over
              decade-long acquisition cycles by traditional aerospace defense primes, which lack the rapid production
              cadence and orbital maneuverability required for contested operations.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Addressable Market Sizing, Contract Ceilings, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for national security maneuverable spacecraft requires disaggregating high-level defense
              appropriations, multi-award Indefinite Delivery Indefinite Quantity ceiling authorizations, and near-term
              addressable task-order budgets. Headline program vehicles indicate significant government demand: the U.S.
              Space Force established the Andromeda IDIQ with an aggregate $1.8 billion ceiling to procure space domain
              awareness and tactically responsive capabilities. Concurrently, the Space Systems Command initiated
              prototype development for the Golden Dome space-based interceptor initiative, representing a
              multi-billion-dollar potential architecture. However, market sizing from an investment diligence
              perspective cannot treat these macro ceilings as guaranteed vendor backlogs. Under both the Andromeda
              program and the Space Force geostationary orbit monitoring competition, True Anomaly is one of 14
              competing industry participants vying for discrete delivery orders. Similarly, Golden Dome prototype
              contracts have been distributed across 12 contractor teams. Consequently, while the broader Space Force
              research, development, test, and evaluation budget represents tens of billions in top-line spending, True
              Anomaly's near-term serviceable addressable market is bounded by the competitive award allocations of
              these shared pools.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
