              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Monopsony Exposure and Milestone Working Capital Gaps
            body: >-
              True Anomaly's exclusive alignment with national security space missions eliminates commercial revenue
              diversification. Reliance on Other Transaction Authority agreements introduces potential 90 to 180 day
              cash collection lags against significant monthly operational burn, requiring disciplined balance sheet
              management until Program of Record production funding is secured.
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
              - CU014
          - type: callout
            title: Non-Traditional Prime Status in Flagship Space Programs
            body: >-
              Selection as one of 12 prime contractors on the Pentagon's Golden Dome initiative and one of 14 vendors on
              the potential $1.8 billion Andromeda program demonstrates exceptional customer traction for a
              venture-backed startup, placing True Anomaly at the center of next-generation orbital defense.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Ranking & Investment Exposure
        blocks:
          - type: paragraph
            body: >-
              True Anomaly's commercial and strategic positioning occupies an inherently volatile domain characterized
              by acute technical execution hurdles, intense capital requirements, and binary defense contracting
              outcomes. The company's recent capital infusion—securing a $650 million Series D financing round in April
              2026 at a post-money valuation of $2.2 billion—provides significant liquidity to expand manufacturing
              operations and scale its headcount. Concurrently, selection as one of 12 prime contractors developing
              prototype technologies for the Pentagon's $3.2 billion Golden Dome space-based interceptor missile defense
              initiative establishes critical early institutional validation. However, this high valuation mark
              simultaneously elevates downside risk: early prototype participation does not guarantee selection for
              ultimate production programs of record, where the Department of Defense historically winnows initial
              performer rosters down to a concentrated subset of legacy or proven aerospace contractors.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR013
          - type: figure
