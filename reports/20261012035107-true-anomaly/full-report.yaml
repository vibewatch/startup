chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              True Anomaly, Inc. is a venture-backed defense technology company established in August 2022 and based in
              Centennial, Colorado. Operating exclusively within the national security space domain, the company designs
              and manufactures autonomous orbital vehicles, artificial-intelligence-driven command software, and
              specialized payloads designed for space superiority and deterrence. Its core product suite includes the
              Jackal autonomous orbital vehicle—an attritable, highly maneuverable spacecraft engineered for rendezvous
              and proximity operations across low Earth orbit, geostationary orbit, and cislunar space—and Mosaic, a
              full-stack autonomy and battle-management software platform that translates operator intent into
              autonomous orbital action. True Anomaly maintains an operational footprint spanning 140,000 square feet
              across Centennial and Colorado Springs, Colorado; Long Beach, California; and Washington, D.C.
            claimRefs:
              - CO001
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company was founded by a cadre of former military space practitioners and technical specialists: Chief
              Executive Officer Even Rogers, a former U.S. Air Force Major with operational expertise in space
              deterrence and orbital combat tactics; Kyle Zakrzewski, a former Space Force and Air Force officer
              specializing in orbital engagement operations; Daniel Brunski, focused on autonomous flight dynamics and
              proximity maneuvers; and Tom Nichols, specializing in aerospace hardware architecture and prototyping.
              Spacecraft development and manufacturing operations are led by Director of Spacecraft Development Sean
              Ozdemir, who scaled the spacecraft engineering organization from an initial whiteboard concept into an
              integrated design, test, and production team. Key-person dependency remains heavily concentrated in CEO
              Even Rogers, whose background bridges military operational requirements, Pentagon procurement
              relationships, and private capital formation.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization History, Valuation, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              True Anomaly has accumulated more than $1 billion in total capital since inception, punctuated by a $650
              million Series D financing closed on April 28, 2026, at a $2.2 billion post-money valuation. The Series D
              round was co-led by venture firms Eclipse and Riot Ventures, with participation from new growth and
              crossover investors including Paradigm, Atreides, G Squared, The Private Shares Fund, and VanEck,
              alongside existing venture backers Accel, Menlo Ventures, and Meritech Capital. The transaction
              incorporated a $50 million debt facility provided by Stifel Bank. This financing followed a $260 million
              Series C closed in April 2025 led by Accel. The company is directing capital toward expanding
              manufacturing throughput toward 50 Jackal spacecraft annually and increasing total headcount from 300
              personnel toward 500 by year-end 2026.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
