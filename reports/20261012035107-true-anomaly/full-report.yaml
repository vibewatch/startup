      - number: '6.2'
        title: Adoption Trajectory and Mission Cadence
        blocks:
          - type: paragraph
            body: >-
              True Anomaly's customer adoption trajectory is defined by a rapid progression from company-funded orbital
              flight tests toward competitive selections on flagship national security programs. Following initial
              flight trials in Low Earth Orbit—including the launch of its first two Jackal Autonomous Orbital Vehicles
              on Transporter-10 in early 2024—the company shifted focus toward operational customer demonstrations. A
              major inflection occurred in April 2026 when the Pentagon selected True Anomaly as one of 12 prime
              contractors awarded prototype technologies contracts under the multi-billion-dollar Golden Dome
              space-based interceptor initiative. Simultaneously, the company secured a position among 14 vendors on the
              Space Force's Andromeda space domain awareness program, which carries a potential contract ceiling of $1.8
              billion. To meet expanding mission commitments across contested orbital regimes, True Anomaly has scaled
              its physical infrastructure across Denver, Colorado Springs, and Long Beach, expanding its workforce
              toward a target of 500 employees by year-end 2026. This operational ramp supports a planned mission
              cadence of approximately a dozen missions over 18 months, extending beyond Low Earth Orbit into
              geostationary orbit and cislunar space.
            claimRefs:
              - CU002
              - CU005
              - CU007
              - CU011
          - type: table
            tableRef: TU002
