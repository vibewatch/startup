        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity Versus Production Visibility
            body: >-
              While True Anomaly has accumulated over $1 billion in lifetime capital, scaling manufacturing from small
              prototype batches to 50 Jackal spacecraft per year introduces substantial fixed overhead, while unit
              margins and recurring software ARR remain unverified.
            calloutType: risk
            claimRefs:
              - CI001
              - CI015
              - CI016
          - type: callout
            title: Diligence Priorities for Financial Underwriting
            body: >-
              Underwriting requires confirmatory access to True Anomaly's funded contract backlog, milestone billing
              schedules, and unit-level manufacturing cost ledgers before validating the implied $2.2 billion post-money
              valuation.
            calloutType: recommendation
            claimRefs:
