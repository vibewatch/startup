  - id: FE001
    title: True Anomaly full-stack space superiority architecture
    type: stack
    summary: >-
      Six-layer architectural hierarchy spanning mission command, cloud-to-edge autonomy, onboard avionics, and physical
      spacecraft manufacturing.
    data:
      layers:
        - label: 1. Mission Command & Operator Interface
          detail: >-
            Mosaic Common Operating Picture and Ascension multiplayer tactical command interface for Space Force
            Guardians.
        - label: 2. Mission Planning & Digital Range Simulation
          detail: >-
            Virtual digital range running on Azure and Elixir for simulated friendly and adversarial spacecraft
            rendezvous engagements.
        - label: 3. Communications & Ground Link Integration
          detail: >-
            Global ground station integration leveraging Viasat network infrastructure for resilient telemetry downlinks
            and human-in-the-loop tasking.
        - label: 4. Onboard Autonomous Mission Executive
          detail: >-
            Onboard Mosaic autonomy engine translating commander intent into autonomous rendezvous, proximity sensing,
            and real-time collision avoidance.
        - label: 5. Spacecraft Bus Avionics & Hardpoint Payloads
          detail: >-
            Radiation-hardened computing architecture, optical non-Earth imaging sensors, electronic warfare payloads,
            and mission-configurable hardpoints.
        - label: 6. Propulsion & Physical Structure
          detail: >-
            Cold-gas/bipropellant 20-thruster propulsion stack providing 800 m/s delta-v, solar array power generation,
            manufactured at GravityWorks facilities.
    approximationNotes: >-
      Architectural representation reflects unclassified disclosures of the Mosaic software stack and Jackal spacecraft
      subsystem layout.
