      - number: '6.3'
        title: Named Customer Proof and Program Engagement
        blocks:
          - type: paragraph
            body: >-
              Documented proof of customer adoption centers on high-visibility Space Force contracts and joint
              operational demonstrations. True Anomaly's most prominent customer engagement is its prime contractor
              position on the Space Systems Command Golden Dome program, where it develops space-based interceptor
              hardware and software architectures designed to track and neutralize hypersonic and orbital threats. In
              parallel, the company participates in the VICTUS HAZE Tactically Responsive Space mission in partnership
              with Firefly Aerospace, demonstrating rapid-response on-orbit threat characterization and rendezvous
              proximity operations under compressed operational timelines. Beyond hardware platforms, the company's
              Mosaic software suite has secured adoption under the Space Force Rapid Resilient Command and Control
              program, establishing operational software footprints within military command centers. While these
              engagements validate True Anomaly's technical credibility and non-traditional prime contractor status,
              verified customer proof remains primarily situated within prototype awards and competitive demonstration
              phases rather than mature, recurring multi-year procurement programs.
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU012
