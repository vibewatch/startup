      - number: '6.4'
        title: Customer Retention, Cash Flow Mechanics, and Monopsony Risk
        blocks:
          - type: paragraph
            body: >-
              Because True Anomaly sells exclusively to the defense sector, its business model is subject to acute
              customer concentration and procurement friction inherent to sovereign defense contracting. Government
              procurement is structured primarily around Other Transaction Authority (OTA) agreements and prototype
              demonstration milestones rather than steady commercial subscriptions. Independent supply chain
              intelligence highlights that OTA disbursements follow verified technical milestone completion rather than
              predictable quarterly schedules, creating working capital lag times of 90 to 180 days that must be
              absorbed through venture capital reserves during rapid manufacturing scale-up. Furthermore, True Anomaly
              currently lacks disclosed baseline revenue from established Programs of Record, meaning customer retention
              cannot yet be evaluated through standard commercial metrics such as Net Revenue Retention or contract
              renewals. Durability depends on successfully converting competitive prototype positions—particularly on
              Golden Dome and Andromeda—into long-term production contracts, navigating down-selection cycles where the
              company faces well-capitalized defense incumbents.
            claimRefs:
              - CU010
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
