              - CO010
              - CO011
              - CO013
      - number: '1.4'
        title: Flight Demonstrations, Defense Contracts, and Technical Challenges
        blocks:
          - type: paragraph
            body: >-
              True Anomaly's operational maturation has been marked by rapid flight testing alongside notable orbital
              anomalies. In March 2024, the company launched its initial two Jackal spacecraft on SpaceX's
              Transporter-10 rideshare mission under the internal moniker Mission X. While both vehicles established
              solar power generation and communications, the team was unable to execute its planned rendezvous and
              proximity operations test on-orbit. A third Jackal was deployed in December 2024 via SpaceX Bandwagon-2 to
              continue sensor and maneuver validation. Concurrently, the firm secured prime contractor status from the
              U.S. Space Force for the $3.2 billion Golden Dome space-based interceptor initiative and a position on the
              $1.8 billion Andromeda geostationary domain awareness contract, while preparing for the Victus Haze
              Tactically Responsive Space demonstration with Firefly Aerospace. Independent analysis highlights that
              justifying its $2.2 billion valuation requires proving repeatable rendezvous reliability and converting
              defense prototypes into multi-year recurring production contracts.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
