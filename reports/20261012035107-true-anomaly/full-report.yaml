              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Jackal Autonomous Orbital Vehicle Architecture and Subsystems
        blocks:
          - type: paragraph
            body: >-
              True Anomaly's hardware architecture centers on the Jackal Autonomous Orbital Vehicle (AOV), an ESPA-class
              spacecraft platform engineered specifically for dynamic space-to-space operations rather than static
              orbital surveillance. Sized roughly equivalent to a compact refrigerator, Jackal breaks with traditional
              defense satellite design by prioritizing extreme maneuverability and attritable production economics over
              multi-decade orbital longevity. The vehicle integrates an advanced 20-thruster propulsion architecture
              delivering approximately 800 m/s of total delta-v, granting the vehicle sufficient kinematic capability to
              perform rapid orbital plane changes, phasing maneuvers, and rendezvous and proximity operations (RPO)
              against non-cooperative objects in low Earth orbit. Jackal's physical structure incorporates
              reconfigurable mission hardpoints capable of hosting non-Earth imaging optical payloads, infrared sensors,
              radio-frequency diagnostic tools, and potential active effectors. Power is provided by deployable solar
              array wings paired with high-density onboard battery reserves. While initial flight validation on SpaceX
              Transporter-10 in March 2024 proved solar power generation and basic telemetry, autonomous rendezvous
              maneuvers could not be completed, demonstrating that on-orbit proximity maneuvering remains the critical
              technical hurdle as True Anomaly advances plans to scale the Jackal bus toward geosynchronous and cislunar
              operating envelopes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
      - number: '5.2'
        title: Mosaic Mission Autonomy, Digital Simulation, and Command Architecture
        blocks:
          - type: paragraph
            body: >-
              The operational backbone of True Anomaly's product portfolio is Mosaic, an integrated software platform
              engineered to orchestrate autonomous multi-spacecraft missions and compress tactical decision cycles for
              military operators. Built on the Elixir programming language to leverage the BEAM virtual machine's
              battle-tested concurrency, low latency, and fault tolerance, Mosaic operates both as ground
              command-and-control infrastructure and as an onboard autonomous software executive. On the ground, Mosaic
              provides a Common Operating Picture that ingests telemetry and sensor feeds across space and terrestrial
              domains, translating high-level operator intent into multi-burn tactical maneuver sequences through
              human-machine teaming workflows. To accelerate pre-mission validation and operator readiness, Mosaic
              incorporates the Digital Range, a high-fidelity physics-based simulation engine capable of modeling
              friendly and adversarial orbital dynamics, alongside the Ascension multiplayer training suite designed for
              Space Force Guardians. By executing onboard autonomous guidance and proximity monitoring, Mosaic
              eliminates dependence on persistent high-bandwidth ground communications, representing a distinct
              software-defined architectural departure from the bespoke, ground-tethered operational software
              historically delivered by legacy defense aerospace primes.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
