chapter:
  number: 1
  title: "Company Overview"
  summary: "True Anomaly is a venture-backed defense space company founded in August 2022 and headquartered in Centennial, Colorado. Capitalized with over $1 billion following an April 2026 Series D round valuing the firm at $2.2 billion, True Anomaly builds Jackal autonomous spacecraft, Mosaic command software, and space-based interceptors for U.S. Space Force space-superiority missions."
sections:
  - id: "identity-and-mission"
    title: "Corporate Identity, Mission, and Operating Footprint"
    body: "True Anomaly, Inc. is a venture-backed defense technology company established in August 2022 and based in Centennial, Colorado. Operating exclusively within the national security space domain, the company designs and manufactures autonomous orbital vehicles, artificial-intelligence-driven command software, and specialized payloads designed for space superiority and deterrence. Its core product suite includes the Jackal autonomous orbital vehicle—an attritable, highly maneuverable spacecraft engineered for rendezvous and proximity operations across low Earth orbit, geostationary orbit, and cislunar space—and Mosaic, a full-stack autonomy and battle-management software platform that translates operator intent into autonomous orbital action. True Anomaly maintains an operational footprint spanning 140,000 square feet across Centennial and Colorado Springs, Colorado; Long Beach, California; and Washington, D.C."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance"
    body: "The company was founded by a cadre of former military space practitioners and technical specialists: Chief Executive Officer Even Rogers, a former U.S. Air Force Major with operational expertise in space deterrence and orbital combat tactics; Kyle Zakrzewski, a former Space Force and Air Force officer specializing in orbital engagement operations; Daniel Brunski, focused on autonomous flight dynamics and proximity maneuvers; and Tom Nichols, specializing in aerospace hardware architecture and prototyping. Spacecraft development and manufacturing operations are led by Director of Spacecraft Development Sean Ozdemir, who scaled the spacecraft engineering organization from an initial whiteboard concept into an integrated design, test, and production team. Key-person dependency remains heavily concentrated in CEO Even Rogers, whose background bridges military operational requirements, Pentagon procurement relationships, and private capital formation."
    claimRefs:
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Capitalization History, Valuation, and Stakeholder Profile"
    body: "True Anomaly has accumulated more than $1 billion in total capital since inception, punctuated by a $650 million Series D financing closed on April 28, 2026, at a $2.2 billion post-money valuation. The Series D round was co-led by venture firms Eclipse and Riot Ventures, with participation from new growth and crossover investors including Paradigm, Atreides, G Squared, The Private Shares Fund, and VanEck, alongside existing venture backers Accel, Menlo Ventures, and Meritech Capital. The transaction incorporated a $50 million debt facility provided by Stifel Bank. This financing followed a $260 million Series C closed in April 2025 led by Accel. The company is directing capital toward expanding manufacturing throughput toward 50 Jackal spacecraft annually and increasing total headcount from 300 personnel toward 500 by year-end 2026."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-adverse-events"
    title: "Flight Demonstrations, Defense Contracts, and Technical Challenges"
    body: "True Anomaly's operational maturation has been marked by rapid flight testing alongside notable orbital anomalies. In March 2024, the company launched its initial two Jackal spacecraft on SpaceX's Transporter-10 rideshare mission under the internal moniker Mission X. While both vehicles established solar power generation and communications, the team was unable to execute its planned rendezvous and proximity operations test on-orbit. A third Jackal was deployed in December 2024 via SpaceX Bandwagon-2 to continue sensor and maneuver validation. Concurrently, the firm secured prime contractor status from the U.S. Space Force for the $3.2 billion Golden Dome space-based interceptor initiative and a position on the $1.8 billion Andromeda geostationary domain awareness contract, while preparing for the Victus Haze Tactically Responsive Space demonstration with Firefly Aerospace. Independent analysis highlights that justifying its $2.2 billion valuation requires proving repeatable rendezvous reliability and converting defense prototypes into multi-year recurring production contracts."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
