  topStrengths:
    - 由经验团队主导，Unreal Engine 5 上的 AAA 制作质感真实存在，使 Shrapnel 有别于大量低质 Web3 游戏项目。
    - 首个也是唯一获准接入中国政府背书 Trusted Copyright Chain 的西方 Web3 游戏，先发进入约 600-700M 玩家市场，形成监管护城河。
    - Gala Games 提供战略支持和链上分发，Moonshot UGC 工具集也可能带来创作者经济飞轮。
    - 上线活动能吸引注意力：2024 Epic early-access 窗口录得 3.7M 次会话，社交粉丝也很大。
  topRisks:
    - 据报 $1.1B 股权估值约为公司自家 SHRAP 代币公开市值（约 $1.1M）的 1,000 倍，甚至高于领投方 Gala Games 本身的市值。
    - 实时活跃几乎归零——Steam Early Access 峰值约 200-255 名同时在线，虽有 500,000+ 社交粉丝，日常却常落到个位数。
    - SHRAP 代币较 2023 年 12 月 $0.44 的 ATH 已下跌约 99.9%，削弱链上经济和任何 play-to-earn 逻辑。
    - 现有和历史诉讼（包括 Realm Metaverse v. Neon Machine、SDNY 1:25-cv-10057 以及 2023 年控制权纠纷）叠加代币和 NFT 的证券 / 监管暴露。
    - 资本、链上基础设施和中国市场准入高度依赖 Gala Games；未披露 SEC Form D 和审计财务。
  unresolvedGaps:
    - 审计财务、收入、烧钱速度、现金跑道和员工数均未披露。
    - $1.1B 估值依据（收入倍数、可比公司集或战略溢价）未披露，也未核验。
    - 尽管 2026 年 4 月已上线，中国区参与指标（DAU、同时在线、交易量）和确切收入分成条款仍未披露。
    - 股权结构表、清算优先权和代币金库现金跑道未公开。
    - 从社交 / 账户触达到活跃付费玩家的长期留存和转化尚未验证。
