company:
  name: "Shrapnel"
chapter:
  number: 8
  title: "Valuation"
  summary: "Neon Machine's reported $1.1B post-money valuation — set in August 2025 via a $19.5M Series A led by Gala Games — is disconnected from every observable market signal. The SHRAP token trades at ~$0.0004 with a market capitalization of roughly $1.1M, implying a ~1,000x gap between the private equity mark and the public market's assessment of the token economy. Comparable Web3 gaming tokens (Axie Infinity $179M, Immutable $112M, Gala $119M, Big Time $15M, Star Atlas $2.9M) universally trade at a fraction of their peak valuations and none approach a $1B enterprise value. With 93% of blockchain gaming projects now considered effectively dead, no disclosed revenue, peak concurrent Steam players of ~255, and active litigation, the valuation appears materially overvalued relative to both public-market comps and sector fundamentals. Recommendation: research-more / proceed-with-extreme-caution at any entry near the reported mark."
sections:
  - id: "financing-valuation-context"
    title: "Financing and Valuation Context"
    body: >-
      Neon Machine has raised more than $38 million in equity across multiple rounds culminating in a
      $19.5M Series A in August 2025 led by Gala Games at a reported $1.1 billion post-money valuation.
      Earlier capital includes an October 2023 round of approximately $20M led by Polychain Capital with
      participation from Griffin Gaming Partners. The $1.1B mark elevated Neon Machine to unicorn status
      per TechCrunch's 2025 list, placing a AAA-aspiring blockchain game studio at a valuation
      comparable to mid-stage SaaS companies with proven revenue. Critically, the valuation was set by a
      single lead investor — Gala Games — which is simultaneously a strategic partner providing blockchain
      infrastructure (GalaChain) and China-market access via the Trusted Copyright Chain, raising
      questions about arm's-length pricing. No secondary transactions, public-market references, or
      independent valuation marks exist to corroborate the $1.1B figure. Total equity raised of ~$38M
      implies a ~28x ratio of valuation to cumulative funding, an aggressive multiple for a pre-revenue
      gaming studio. No SEC Form D filing exists on EDGAR for Neon Machine, Inc., an anomaly for a
      US-domiciled company raising at this scale. The funding structure includes two tranches within the
      Series A, suggesting milestone-based capital deployment, though tranche conditions are not public.
      Active litigation — Realm Metaverse Real Estate Inc. v. Neon Machine (SDNY 1:25-cv-10057) alleging
      securities fraud — and a prior bankruptcy of majority shareholder 4D Factory further complicate
      the cap-table picture and preference overhang.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005", "CV006", "CV007", "CV008"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "token-equity-disconnect"
    title: "Token vs. Equity Valuation Disconnect"
    body: >-
      The central contradiction in Shrapnel's valuation is the ~1,000x gap between the $1.1B private
      equity mark and the ~$1.1M SHRAP token market capitalization. SHRAP trades at approximately
      $0.0004 per token as of mid-June 2026, with a circulating supply of roughly 2.89 billion tokens
      (96% of the 3 billion maximum supply). The fully diluted valuation of the token is approximately
      $1.2M. The token reached an all-time high of approximately $0.44 in December 2023, representing
      a 99.9% decline to current levels. Daily trading volume is under $1,000, indicating near-zero
      liquidity. CoinCodex forecasts the token to end 2026 at $0.000376, still bearish. DropsTab
      records a total fundraise of $57.6M including token-sale proceeds, with a current market cap of
      $630K. This disconnect can be interpreted several ways: the equity investors hold governance
      and IP rights beyond token economics; the token economy has structurally failed while the equity
      thesis rests on game-development IP; or the private mark is simply stale and inflated by a
      non-arm's-length transaction. In any reading, the public market assigns the SHRAP token economy
      near-zero value, directly contradicting the thesis that token-powered gameplay creates
      sustainable revenue. If the token is the economic backbone of the platform as described in
      company materials, its collapse undermines the revenue model that must justify the equity price.
    claimRefs: ["CV009", "CV010", "CV011", "CV012", "CV013", "CV014", "CV015", "CV016"]
    tableRefs: ["TV002"]
    figureRefs: ["FV003"]
  - id: "comparable-analysis"
    title: "Comparable Valuation Analysis"
    body: >-
      No direct public comparable exists for a $1.1B blockchain gaming valuation in mid-2026. The
      closest public-market references are traded gaming tokens and disclosed private rounds. Axie
      Infinity (AXS), the historical leader of play-to-earn gaming, trades at a market cap of $179M
      and FDV of $278M — down from a $9.7B peak — with a live game and 99,000 daily users. Immutable
      (IMX), the leading NFT gaming infrastructure platform with 680+ games onboarded, carries a
      market cap of $112M and FDV of $265M. Gala Games (GALA), Shrapnel's own lead investor, has a
      market cap of $119M and FDV of $119M on 48B circulating tokens — implying Gala itself is valued
      below the mark it assigned to its portfolio company. Big Time (BIGTIME) trades at $15M market
      cap with a live AAA-quality game. Star Atlas (ATLAS), another ambitious space MMO with
      blockchain, sits at $2.9M market cap — effectively dead. Illuvium (ILV), a AAA blockchain RPG,
      carries a $26M market cap. On the private side, Gunzilla Games (Off The Grid) has raised $76–120M
      cumulatively but its valuation is undisclosed; it has an actual live game on Steam with
      meaningful player counts. In every case, even the most successful Web3 gaming projects carry
      public valuations of $15M–$279M — one to two orders of magnitude below Shrapnel's $1.1B mark.
      The valuation premium appears to rely entirely on the China-market optionality via the
      GalaChain-TCC bridge and the assumption of AAA gameplay quality, neither of which has been
      validated by market traction.
    claimRefs: ["CV017", "CV018", "CV019", "CV020", "CV021", "CV022", "CV023", "CV024", "CV025"]
    tableRefs: ["TV004"]
    figureRefs: ["FV002"]
  - id: "scenario-analysis"
    title: "Bull, Base and Bear Scenarios"
    body: >-
      Bull case (~10% probability): Shrapnel achieves mainstream adoption with 100K+ concurrent
      players, the China TCC bridge generates material revenue, marketplace volume drives sustainable
      fees, and SHRAP token recovers to $0.01–$0.05, supporting a $30M–$150M FDV that partially
      justifies the equity mark via token treasury appreciation. Implied valuation: $300M–$800M
      equity value if game reaches top-10 Web3 title status. Key assumptions: UE5 quality attracts
      traditional gamers, China regulatory framework holds, UGC ecosystem produces viral content.
      Base case (~50% probability): The game survives in niche status with 5K–20K concurrent players,
      token remains depressed at $0.0001–$0.001, China revenue is immaterial in year one, and the
      studio requires additional funding at a significant down-round. Implied valuation: $50M–$150M,
      representing a 70–95% haircut from the reported $1.1B. Key assumptions: product quality is
      adequate but insufficient to overcome Web3 gaming stigma; Gala continues strategic support.
      Bear case (~40% probability): Player population remains ghost-town level, token goes to zero
      or exchanges delist, litigation results in adverse judgment, studio runs out of capital and
      shuts down or sells IP. Implied valuation: $0–$30M (recovery value of IP and tools). Key
      assumptions: Web3 gaming continues secular decline, China market entry fails or is revoked,
      Gala Games itself faces financial distress. The probability-weighted expected value is
      approximately $55M–$120M, an 89–95% discount to the reported $1.1B valuation.
    claimRefs: ["CV026", "CV027", "CV028", "CV029", "CV030", "CV031", "CV032"]
    tableRefs: ["TV003"]
    figureRefs: ["FV004"]
  - id: "recommendation-verdict"
    title: "Recommendation, Verdict and Diligence Asks"
    body: >-
      Recommendation: Research-More with a strong Overvalued stance. The $1.1B valuation cannot be
      supported by any observable data point — token market cap, player engagement, revenue disclosure,
      or sector comparables. The private mark appears to reflect strategic value assigned by a
      conflicted lead investor (Gala Games) rather than fair market value. Risk rating: Very High.
      Confidence: Medium — the overvaluation thesis is well-supported by public data, but the
      possibility of non-public traction metrics or China revenue that we cannot verify prevents a
      high-confidence outright rejection. Valuation stance: Materially overvalued — the
      probability-weighted expected value of $55M–$120M implies the reported mark is 9–20x above
      fair value. Investment implication: No entry at or near the reported $1.1B mark is defensible
      without (a) verified revenue from China marketplace operations, (b) evidence of sustained
      player engagement above 10K concurrent, (c) token price recovery indicating real economic
      activity, and (d) an independent valuation opinion. Kill triggers include: token delisting,
      adverse litigation judgment exceeding $5M, China TCC revocation, Gala Games insolvency, or
      concurrent player count remaining below 500 for six consecutive months post-launch. Final
      diligence asks: management accounts showing revenue and burn; cap-table with preference stack;
      China marketplace GMV data; independent valuation methodology for the $1.1B mark; token
      treasury balances and insider unlock schedule; post-settlement governance agreements.
    claimRefs: ["CV033", "CV034", "CV035", "CV036", "CV037", "CV038", "CV039", "CV040"]
    tableRefs: ["TV005", "TV006"]
