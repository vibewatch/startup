    title: "1,000x equity-to-token valuation gap"
    body: "The $1.1B private equity mark coexists with a ~$1.1M SHRAP token market cap — roughly 1,000x divergence. No public-market comparable in Web3 gaming approaches $1B. The gap suggests the private mark is either stale, strategically inflated, or dependent on non-public information unavailable to outside investors."
    claimRefs: ["CV009", "CV010", "CV033"]
  - calloutType: "risk"
    title: "93% sector mortality rate"
    body: "Caladan's April 2026 study of 3,200+ GameFi titles found 93% are effectively dead, with $12–15B in capital destroyed. Annual Web3 gaming funding collapsed 93% from $4B (2022) to $360M (2025). Shrapnel exists in a sector where survival — let alone unicorn valuation — is a statistical anomaly."
    claimRefs: ["CV030", "CV031"]
  - calloutType: "strength"
    title: "China TCC optionality remains live"
    body: "The GalaChain-Trusted Copyright Chain bridge granting access to China's 683M gamers is a genuine first-mover advantage that no competitor currently holds. If the China revenue-share mechanism generates meaningful GMV, it could partially rehabilitate the valuation — but no data confirms this thesis."
    claimRefs: ["CV026", "CV027"]
