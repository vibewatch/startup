  topStrengths:
    - >-
      Genuine AAA production values on Unreal Engine 5 led by an experienced team, differentiating Shrapnel from the
      many low-quality Web3 game projects.
    - >-
      First and only licensed Western Web3 game approved on China's government-backed Trusted Copyright Chain, a
      first-mover regulatory moat into a ~600-700M-gamer market.
    - >-
      Strategic backing and on-chain distribution from Gala Games, plus the Moonshot UGC toolset as a potential
      creator-economy flywheel.
    - >-
      Demonstrated capacity to attract attention at launch events (3.7M sessions over the 2024 Epic early-access window)
      and a large social following.
  topRisks:
    - >-
      The reported $1.1B equity valuation is roughly 1,000x the company's own ~$1.1M public SHRAP token market cap and
      exceeds the market cap of lead investor Gala Games itself.
    - >-
      Live engagement is near zero — Steam Early Access peaked around 200-255 concurrent players and frequently sits in
      single digits despite 500,000+ social followers.
    - >-
      The SHRAP token has collapsed ~99.9% from its December 2023 ATH of $0.44, undermining the on-chain economy and any
      play-to-earn thesis.
    - >-
      Active and prior litigation (including Realm Metaverse v. Neon Machine, SDNY 1:25-cv-10057, and the 2023 control
      dispute) plus securities/regulatory exposure for the token and NFTs.
    - >-
      Heavy concentration risk on Gala Games for capital, on-chain infrastructure, and China market access, with no SEC
      Form D and no audited financials disclosed.
  unresolvedGaps:
    - No audited financials, revenue, burn rate, runway, or headcount have been disclosed.
    - >-
      The basis for the $1.1B valuation (revenue multiple, comparable set, or strategic premium) is undisclosed and
      unverified.
    - >-
      China engagement metrics (DAU, concurrent players, transaction volume) and the exact China revenue-share terms
      remain undisclosed despite the April 2026 launch.
    - Cap-table structure, liquidation preferences, and token-treasury runway are not publicly available.
    - Long-term retention and conversion from social/account reach to active paying players is unproven.
