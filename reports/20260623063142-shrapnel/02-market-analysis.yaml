slug: "shrapnel"
runDate: "2026-06-23"
company:
  name: "Shrapnel"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Shrapnel operates at the intersection of two large but methodologically incompatible market taxonomies: the Web3/blockchain gaming market (estimated at $28–$49B in 2025 depending on source, CAGR 18–23%) and the traditional FPS/shooter market ($27.5–$82B in 2025). China's $49.8B gaming market with 683M players represents the single largest expansion opportunity enabled by the GalaChain-TCC bridge, but regulatory constraints, crypto volatility, and entrenched player skepticism of NFT economics impose material adoption ceilings that no market-size report adequately prices in."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Definition"
    body: >-
      Shrapnel's addressable market must be defined across two overlapping but distinct taxonomies.
      The primary classification is the Web3 or blockchain gaming market: games that integrate blockchain
      technology, non-fungible tokens, cryptocurrency wallets, and decentralized asset ownership into their
      core loop. The secondary classification is the traditional first-person shooter and extraction-shooter
      genre on PC, where Shrapnel must compete for players against incumbents such as Escape from Tarkov,
      Hunt: Showdown, ARC Raiders, and mainstream franchises like Call of Duty. These two markets overlap
      only partially: most Web3 gamers currently play casual or mobile titles rather than hardcore PC shooters,
      and most extraction-shooter players are skeptical of blockchain integration. The included spend for
      Shrapnel encompasses in-game NFT purchases, marketplace transaction fees, token-economy participation,
      and traditional game-monetisation streams. Excluded spend includes pure DeFi speculation unrelated to
      gameplay, hardware sales, and non-gaming blockchain activity. Adjacencies include the broader metaverse
      and virtual-world market, esports prize pools, and user-generated-content creator economies. The
      status-quo substitute for Shrapnel's target player is a free-to-play extraction shooter with no
      blockchain component, where digital items have no secondary-market resale value. Any realistic
      addressable-market estimate must therefore intersect the Web3 gaming TAM with the extraction-shooter
      player base and then layer China-specific regulatory access as a geographic multiplier.
    claimRefs: ["CM001", "CM002", "CM005", "CM015", "CM020", "CM033"]
    tableRefs: ["TM001"]
    figureRefs: ["FM003"]
  - id: "market-sizing"
    title: "Market Sizing and Estimate Range"
    body: >-
      Published market estimates for Web3 gaming diverge significantly depending on scope and methodology.
      The Business Research Company, via Research and Markets and GII Research, sizes the Web3 gaming market
      at $39.65 billion in 2025 growing to $48.55 billion in 2026 at a CAGR of 22.4 percent, projecting
      $108 billion by 2030. Straits Research values the same market at only $28.31 billion in 2025 with an
      18.1 percent CAGR to $117 billion by 2034. Future Market Insights estimates $33.7 billion in 2025 and
      $39.9 billion in 2026 at 18.5 percent CAGR. Precedence Research sizes the market at $37.55 billion in
      2025 with a 19.24 percent CAGR. Business Research Insights projects $44.54 billion in 2026. These
      differences stem from varying definitions of what counts as Web3 gaming revenue versus broader blockchain
      ecosystem revenue. A narrower blockchain-gaming-only taxonomy from The Business Research Company yields
      only $11.22 billion in 2025 growing to $17.82 billion in 2026 at a much higher 58.8 percent CAGR. The
      broader shooter-games market is $82.02 billion in 2025 per Fortune Business Insights, while the
      first-person-shooter slice is $27.53 billion growing to $30.15 billion in 2026. Shrapnel's realistic
      serviceable addressable market is the intersection of Web3 gaming infrastructure users who play PC
      extraction shooters, which is a small fraction of either headline figure. We preserve the full range of
      contradictory estimates and note that no single source provides a bottom-up sizing for Web3 extraction
      shooters specifically.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005", "CM006", "CM007", "CM008", "CM009", "CM010", "CM011", "CM034", "CM035"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001", "FM002"]
  - id: "buyer-segmentation"
    title: "Buyer and Player Segmentation"
    body: >-
      Shrapnel's target user base segments into at least four distinct buyer personas with different
      motivations, budget ownership, and adoption triggers. First, hardcore PC extraction-shooter players
      who seek high-stakes PvPvE gameplay and own the hardware budget; their adoption trigger is gameplay
      quality, not blockchain features. Second, Web3 native digital-asset investors who view in-game NFTs
      as speculative assets; their budget is crypto-wallet capital and their trigger is token-economy
      upside and secondary-market liquidity. Third, user-generated-content creators who use Shrapnel's
      Moonshot tools to design and sell maps, skins, and items; their trigger is creator-economy revenue
      share. Fourth, Chinese gamers accessing Shrapnel through the Trusted Copyright Chain, whose budget
      comes from RMB-denominated marketplace transactions and whose trigger is regulatory availability of
      a Western AAA title with compliant digital-asset trading. The payer in all cases is the player
      directly, but the budget-owner distinction matters: hardcore shooter players spend on cosmetics
      from discretionary entertainment budgets, while crypto investors deploy speculative capital with
      different risk tolerance. Play-to-earn models blur this line, creating a fifth segment of low-income
      grinders whose sustainability depends on new capital inflows, a model widely criticised after
      the Axie Infinity collapse. Shrapnel's China-first expansion strategy prioritises the fourth segment
      given the 683 million addressable player base.
    claimRefs: ["CM012", "CM013", "CM016", "CM017", "CM018", "CM019", "CM020", "CM036", "CM037"]
    tableRefs: ["TM003"]
    figureRefs: ["FM004"]
  - id: "growth-drivers-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      The Web3 gaming market is propelled by several structural drivers: the growing adoption of
      cryptocurrency wallets among gamers, rising demand for true digital-asset ownership, the
      expansion of play-to-earn and creator-economy models, investment momentum with $1.1 billion
      deployed into blockchain gaming in Q2 2024 alone, Asia-Pacific regional growth led by China
      and Southeast Asia, and the maturation of Layer-2 scaling solutions that reduce transaction
      costs. Shrapnel-specific drivers include the China TCC bridge providing compliant access to
      a $49.8 billion gaming market with nearly 700 million players, and the extraction-shooter
      genre's dominance of PC playtime as evidenced by Escape from Tarkov capturing 1.7 percent
      of global PC playtime share in 2025. Against these sit material constraints. Regulatory risk
      is paramount: China bans general cryptocurrency and pay-to-earn models except through the
      narrow TCC framework, while the US SEC may classify certain game tokens or NFTs as securities
      under the Howey test. Crypto and NFT market volatility destabilises in-game economies.
      Player skepticism of NFT integration is documented and widespread, driven by past rug-pulls,
      pay-to-win perceptions, and the Axie Infinity economic collapse. The play-to-earn model's
      sustainability depends on continuous new-player inflows, creating Ponzi-like dynamics when
      growth stalls. Switching costs from established extraction shooters are low in theory but
      high in practice because genre players have invested hundreds of hours into progression
      systems. Trust remains the single largest barrier: Web3 games must overcome a reputational
      deficit created by years of low-quality cash-grab projects before mainstream FPS players
      will adopt blockchain mechanics.
    claimRefs: ["CM021", "CM022", "CM023", "CM024", "CM025", "CM026", "CM027", "CM028", "CM029", "CM030", "CM031", "CM032", "CM038", "CM039", "CM040"]
    tableRefs: ["TM004"]
  - id: "sizing-gaps"
    title: "Sizing Diligence Gaps and Contradictory Estimates"
    body: >-
      The market-sizing evidence base contains irreconcilable contradictions that cannot be resolved
      without proprietary data. The 2025 Web3 gaming market estimate ranges from $28.31 billion to
      $39.65 billion depending on source, a 40-percent spread that reflects definitional disagreement
      rather than measurement error. The narrower blockchain-gaming taxonomy at $11.22 billion versus
      the broader Web3 gaming figure at $39.65 billion reveals a nearly four-to-one gap that is
      entirely methodological. No published report provides a bottom-up TAM for Web3 extraction
      shooters or for blockchain-enabled FPS games specifically, forcing any Shrapnel-specific SAM
      estimate to be constructed from assumptions about genre penetration rates and crypto-wallet
      adoption among hardcore PC gamers. The China opportunity of $49.8 billion and 683 million players
      is an overall gaming-market figure; the portion accessible through the TCC framework for a
      single Western Web3 title is orders of magnitude smaller and depends on regulatory execution,
      platform discovery, and the as-yet-unproven economics of cross-border RMB digital-asset trading.
      Investment momentum is episodic: the $1.1 billion Q2 2024 figure represents a 314-percent
      quarter-over-quarter spike that may not sustain. These gaps define the diligence agenda for
      any investor relying on market-size arguments to justify the $1.1 billion valuation.
    claimRefs: ["CM001", "CM003", "CM008", "CM012", "CM021", "CM034", "CM035", "CM040"]
