  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的可服务市场必须放在两套重叠但不同的分类里定义。第一层是 Web3 或区块链游戏市场：把区块链技术、非同质化代币、加密钱包和去中心化资产所有权整合进核心循环的游戏。第二层是传统 PC
              第一人称射击和撤离射击品类；Shrapnel 要在这里与 Escape from Tarkov、Hunt: Showdown、ARC Raiders，以及 Call of Duty
              等主流系列争夺玩家。两类市场只部分重叠：多数 Web3 玩家现在玩的是休闲或移动游戏，而非硬核 PC 射击；多数撤离射击玩家也怀疑区块链整合。计入 Shrapnel 的支出包括游戏内 NFT
              购买、市场交易费、代币经济参与和传统游戏变现流。排除项包括与玩法无关的纯 DeFi
              投机、硬件销售和非游戏区块链活动。相邻市场包括更广义的元宇宙和虚拟世界市场、电竞奖金池以及用户生成内容创作者经济。Shrapnel
              目标玩家的现状替代品，是没有区块链组件的免费撤离射击游戏，其数字物品没有二级市场转售价值。因此，任何现实的可服务市场估算，都必须先取 Web3 游戏 TAM
              与撤离射击玩家基数的交集，再把中国特定监管准入作为地理乘数叠加。
