      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，没有直接公开可比公司能支撑 $1.1B 的区块链游戏估值。最接近的公开市场参照，是交易中的游戏 token 和已披露的私募轮次。Axie Infinity（AXS）是 play-to-earn
              游戏的历史龙头，市值 $179M、FDV $278M，较 $9.7B 峰值大幅下跌，但仍有在线游戏和 99,000 日活用户。Immutable（IMX）是领先 NFT 游戏基础设施平台，已接入 680+
              款游戏，市值 $112M、FDV $265M。Gala Games（GALA）作为 Shrapnel 自身领投方，基于 48B 流通 token，市值 $119M、FDV $119M——这意味着 Gala
              自己的估值低于它给组合公司标出的估值。Big Time（BIGTIME）有一款在线 AAA 质量游戏，市值 $15M。Star Atlas（ATLAS）是另一款雄心很大的区块链太空 MMO，市值
              $2.9M——事实上已死亡。Illuvium（ILV）是一款 AAA 区块链 RPG，市值 $26M。私募侧，Gunzilla Games（Off The Grid）累计融资 $76–120M，但估值未披露；它在
              Steam 上有真实在线游戏，且玩家数有意义。每个案例里，即便最成功的 Web3 游戏项目，公开估值也只有 $15M–$279M——比 Shrapnel 的 $1.1B
              标记低一到两个数量级。估值溢价似乎完全依赖通过 GalaChain-TCC bridge 获得的中国市场选择权，以及 AAA 玩法质量假设；二者都尚未被市场牵引验证。
            claimRefs:
