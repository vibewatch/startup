      - number: '7.2'
        title: 现有诉讼与法律风险
        blocks:
          - type: paragraph
            body: >-
              Neon Machine 正面临持续的联邦诉讼，直接牵涉公司及其更广泛生态。最重要的在审案件是 Realm Metaverse Real Estate Inc. v. Neon Machine, Inc. and
              Oganesson Factory Limited（SDNY 1:25-cv-10057），2025 年 12 月 4 日提交，指控与 NFT 延迟交付相关的 12 U.S.C. § 22
              项下证券欺诈。起诉书称，Neon Machine 于 2024 年告知 Realm，其购买的 NFT 将推迟到 2027 年交付，比最初承诺晚了数年。案件由 Jeannette A. Vargas
              法官审理，Barbara Moses 法官任治安法官；截至 2026 年 6 月仍在审理，Neon Machine 已聘请 Orrick Herrington & Sutcliffe
              LLP。相较于更简单的违约索赔，证券欺诈框架抬高了法律风险，因为不利认定可能创设先例，把 Shrapnel NFT 定性为投资合约。相关生态诉讼还包括 4D Factory, Inc. Chapter 11
              破产案（SDNY 23-11618，2023 年 10 月提交），涉及 Neon Machine 前多数股东 Cort Javarone；对抗诉讼 The 4D Factory, LLC v.
              Long（24-01319）将创始人 Mark Long、Polychain Ventures 和 Griffin Gaming Partners 等列为被申请人；以及 GPC3 I, LLC v.
              Javarone（SDNY 1:25-cv-00060/24654），指控前控股股东违反 token 购买协议。2025 年 3 月内部控制权争议和解，解决了最紧迫的治理危机，但残余敞口仍在：4D Factory
              破产财产可能保留对 Neon Machine 资产的残余索赔，Realm Metaverse 案件又带来新的证券欺诈风险，并可能扩展为集体诉讼。CourtListener 案件检索返回六起点名 Neon
              Machine 或与其密切相关的联邦事项，显示诉讼密度对这个规模和阶段的工作室而言并不寻常。
