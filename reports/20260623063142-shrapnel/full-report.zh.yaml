              据 TechCrunch 引用的 PitchBook 数据，Neon Machine 至今已融资超过 $38M，投资者包括 Gala Games、Griffin Gaming Partners 和
              Polychain Capital。工作室在 2023 年 10 月宣布完成 Polychain 领投的 $20M 融资，并在 2025 年 8 月披露分两批完成的 $19.5M Series A，最近一批由
              Gala Games 领投，Griffin Gaming Partners 和 Polychain Capital 参投。该轮据称估值 $1.1B，使 Shrapnel 登上 TechCrunch 2025
              年独角兽名单。2024 年底披露的另一轮战略融资被描述为由 Blizzard Avalanche Ecosystem Fund 领投。这个估值放在公开交易的 SHRAP 代币背景下尤其刺眼：2026
