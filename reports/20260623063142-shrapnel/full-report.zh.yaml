      - number: '5.4'
        title: 用户生成内容与 Moonshot 工具
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的 Moonshot 工具是由 CTO Don Norbury 领导、基于 Unreal Engine
              的用户生成内容创作套件。该工具集允许玩家和创作者设计皮肤、地图、武器、音效及其他资产，再铸造成 NFT 并在市场上交易。经济承诺在于，创作者保有真正所有权，并可在其他玩家获取其作品时借 SHRAP
              代币经济变现。Moonshot 被定位为核心差异点——把 Shrapnel 从传统射击游戏变成一个由社区生成并拥有内容的平台。工具的技术细节（blueprint 模板、插件、mod SDK
              版本）没有在任何公开技术文档中发布。路线图提到 2026 年将扩展创作者工具和 modding 竞赛，但除营销话术外，没有披露具体发布时间表或功能列表。UGC 流水线的实际成熟度无法从外部核验：截至 2026 年
              6 月 Steam Early Access 期间，还没有独立确认社区创作地图或物品已在市场上线。
