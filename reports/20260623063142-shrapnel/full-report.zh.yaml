  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与定价模型
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 是一款免费游玩的撤离 FPS，变现完全 Web3 原生。收入流由四根柱子组成：第一，Shrapnel Marketplace，玩家在其中买卖和交易 NFT
              物品（武器、外观、Operators、地图），交易费用以 SHRAP 支付；第二，工作室直接销售外观和装备 NFT；第三，SHRAP
              被消耗于铸造用户生成内容、参与赛季活动等玩法动作，形成代币效用消耗；第四，中国市场收入分成机制，由 GalaChain 借可信版权链推动人民币结算的物品交易，并把所得收入用于回购 SHRAP 代币。行业标准
              NFT 市场平台费通常为每笔交易的 2%–5%，但 Shrapnel 未公开披露自己的具体费率。二级销售上的创作者版税——NFT 生态中常见为 5–10%——可能提供额外收入分成。公司未披露审计收入数字，Neon
              Machine, Inc. 也未在 EDGAR 提交 SEC Form D，所有收入主张都无法通过公开备案核验。
            claimRefs:
              - CI001
              - CI002
              - CI003
