      - number: '6.4'
        title: 留存、耐久性与玩家满意度
        blocks:
          - type: paragraph
            body: >-
              按任何游戏行业标准看，留存数据都很灾难。2026 年 3 月同时在线峰值 200 名之后，平均同时在线人数 4 月环比下滑 65%，5 月下滑 74%，6 月再下滑
              40%——匹配失败让游戏事实上无法游玩。Neon Machine 未披露 cohort 留存、DAU/MAU 比率或 session 时长分析。Steam 评价情绪只能提供部分代理指标：总体 75/100
              掩盖了近期评价很可能下行的趋势，2026 年 5–6
              月多条评价明确提到找不到对局。按评论文本看，玩家对核心玩法机制（枪感、移动、视觉）的满意度中等偏正面，但玩家太少、凑不出一局时，满意度已经无关紧要。Battle Pass
              系统推出了不会过期、可交易的奖励，试图靠进度体系拉动留存，但无法弥补根本性的玩家数量缺口。适用于 SaaS 的 NRR/GRR
              框架无法干净映射到免费游戏；最接近的类比是回流玩家比例，而从同时在线数据看，这一比例显然接近于零。公司未公开 churn 分析、FTUE 完成率或 D1/D7/D30 留存数据。
