      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 股权与 token 估值相差 1,000 倍
            body: >-
              $1.1B 私募股权标记与约 $1.1M SHRAP token 市值并存——相差约 1,000 倍。Web3 游戏里没有公开市场可比项目接近
              $1B。这个缺口说明，私募标记要么已经过时，要么被战略性抬高，要么依赖外部投资者无法获得的非公开信息。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV033
          - type: callout
            title: 行业死亡率 93%
            body: >-
              Caladan 2026 年 4 月对 3,200+ 款 GameFi 游戏的研究发现，93% 已事实上死亡，$12–15B 资本被毁灭。Web3 游戏年度融资从 $4B（2022 年）暴跌 93% 至
              $360M（2025 年）。Shrapnel 所在行业里，能活下来——更不用说独角兽估值——本身就是统计异常。
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
          - type: callout
            title: 中国 TCC 选择权仍然存在
            body: >-
              GalaChain-Trusted Copyright Chain bridge 打开了进入中国 683M 游戏玩家市场的通道，这是竞争对手目前没有的真实先发优势。如果中国收入分成机制产生有意义的
              GMV，估值可能部分修复——但目前没有数据证实这一论点。
            calloutType: strength
            claimRefs:
              - CV026
              - CV027
