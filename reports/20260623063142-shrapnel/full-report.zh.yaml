      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景（约 10% 概率）：Shrapnel 获得主流采用，同时在线玩家超过 100K，中国 TCC bridge 产生实质收入，市场交易量带来可持续费用，SHRAP token 回升至
              $0.01–$0.05，支撑 $30M–$150M FDV，并通过 token 财库升值部分证明股权估值。隐含估值：若游戏进入 Web3 前十，股权价值为 $300M–$800M。关键假设：UE5
              质量吸引传统玩家，中国监管框架维持，UGC 生态产出病毒式内容。基准情景（约 50% 概率）：游戏以小众状态存活，同时在线玩家 5K–20K，token 仍低迷在
              $0.0001–$0.001，中国收入第一年不重要，工作室需要以显著 down-round 追加融资。隐含估值：$50M–$150M，较披露 $1.1B 折价 70–95%。关键假设：产品质量合格，但不足以克服
              Web3 游戏污名；Gala 继续提供战略支持。熊市情景（约 40% 概率）：玩家群体维持鬼城水平，token 归零或被交易所下架，诉讼出现不利判决，工作室耗尽资本并关闭或出售
              IP。隐含估值：$0–$30M（IP 和工具回收价值）。关键假设：Web3 游戏继续长期下行，中国市场进入失败或被撤销，Gala Games 自身遭遇财务困境。概率加权预期价值约 $55M–$120M，较披露
              $1.1B 估值折价 89–95%。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
