      - number: '2.5'
        title: 规模尽调缺口与矛盾估算
        blocks:
          - type: paragraph
            body: >-
              市场规模证据基础存在无法调和的矛盾，缺少专有数据就不能解决。2025 年 Web3 游戏市场估算在 $28.31B 到 $39.65B 之间，取决于来源；40%
              的差距反映的是定义分歧，而非测量误差。更窄的区块链游戏分类为 $11.22B，而更广义 Web3 游戏数字为 $39.65B，暴露出近四倍差距，且完全由方法造成。没有已发布报告为 Web3 撤离射击或支持区块链的
              FPS 游戏提供自下而上的 TAM，迫使任何 Shrapnel 专属 SAM 估算都建立在品类渗透率和硬核 PC 玩家加密钱包采用率假设之上。中国机会的 $49.8B 和 6.83
              亿玩家是整体游戏市场数字；单个西方 Web3 作品能够通过 TCC 框架触达的部分要小几个数量级，并取决于监管执行、平台发现，以及跨境人民币数字资产交易经济性是否跑通。投资动能也呈阶段性：2024 年 Q2 的
              $1.1B 数字代表环比 314% 激增，未必能持续。这些缺口定义了任何投资者若用市场规模论证 $1.1B 估值时必须完成的尽调议程。
