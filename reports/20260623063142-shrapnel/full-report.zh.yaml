      - number: '6.5'
        title: 扩张、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的扩张论点靠三根支柱支撑：中国市场进入、UGC 驱动的内容循环，以及传统免费游戏增长机制（Battle Pass、赛季活动、新 Operator）。通过 Trusted Copyright
              Chain 打开中国机会，结构上很重要——它是 $49B 市场里第一款获许可的西方 Web3 游戏——但执行风险很高。尽管 4 月 30
              日发布距运行日期已近两个月，截至运行日期，公司仍未披露中国同时在线玩家数据或市场交易额。集中度风险极端：整个分发和中国准入策略都依赖 GalaChain 和 Gala Games，而后者也是 Series A
              领投方。若 Gala Games 出现金融困境或监管行动，资本结构和中国收入渠道会同时坍塌。Steam 是唯一的西方分发平台；Epic Games Store 已不再为 Shrapnel 活跃。UGC
              创作者社区可能形成飞轮——玩家创作内容可缓解早期 Web3 游戏常见的内容荒——但创作者工具尚未完全部署，而可触达创作者群体又需要一个目前并不存在的活跃玩家基础。营销渠道更依赖 crypto-native
              媒体，而不是主流游戏媒体，进一步限制了对传统 FPS 受众的触达；后者才是更大的可触达细分市场。
