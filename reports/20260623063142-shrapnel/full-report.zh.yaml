      - number: '5.6'
        title: 信任、质量、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的信任与质量状态喜忧参半。正面看，开发团队由 AAA 老兵组成，履历覆盖 Call of Duty、Halo、BioShock 和 Ghost of
              Tsushima，技术能力可信。游戏确实发布了可运行版本，持续每周打补丁，也维护活跃的 Steam Community。Neon Machine 已获得 $37.5M
              资金支持开发。负面看，抢先体验评价提到操作笨拙、撤离崩溃、纹理质量不一致（部分区域「rendered off the Nintendo 64」）以及通用 /
              重复的音效设计。上线后重做后坐力和命中判定，说明团队有响应能力，但也确认已发布版本存在基础枪感问题。NFT
              或代币合约没有公开智能合约审计。没有披露反作弊中间件（EAC、BattlEye、Vanguard）。多人服务器或市场没有公开状态页、SLA 或 uptime 承诺。隐私政策和数据处理文档仅限于标准 Steam
              条款。中国桥接的监管合规通过 TCC 合作关系来主张，但没有独立审计确认遵循情况。Steam 历史峰值并发 253 且降至个位数，本身就是质量信号：要么游戏因打磨缺口留不住玩家，要么区块链 / NFT
              层劝退主流玩家，或者两者兼有。
