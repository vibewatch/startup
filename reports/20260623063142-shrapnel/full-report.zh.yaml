      - number: '5.5'
        title: 发布状态、开发者信号与路线图
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 2.0 于 2026 年 3 月 5 日进入 Steam Early Access，此前经历一年技术重置，早期窗口则是 2024 年 2 月 Epic Games Store 付费抢先体验（27
              天，据称 370 万场次）。Steam 发布带来 Stockpile 4v4 模式、一张 Tokyo 主题地图、两名 Operators，以及用 UE5 重做的枪感。计划中的 Early Access
              时长约两个月：第一个月增加玩法内容，第二个月加入进度功能（Missions、Battle Pass）。工作室承诺定期发布开发博客，并保持每周补丁节奏。已有记录补丁包括 3 月 18
              日稳定性更新（纹理加载修复、Sigma 拾取 bug、死亡画面 Operator 切换）和 3 月 25 日平衡补丁（Phantom HP 从 400 降至 350、DMR 身体命中伤害提高、AR2 弹匣容量从
              33 降至 30、移除镜头震动）。路线图项目包括基于技能的匹配、武器 loadout 自定义菜单、账号进度、社交功能、每日任务、更多地图，以及扩展到五名 Operators。经 GalaChain–TCC
              进入中国的 Early Access 于 2026 年 4 月 30 日启动。不过，第三方追踪（SteamCharts）记录的历史峰值并发仅 253，2026 年 3 月平均约 21，2026 年 6
              月当前数字为 1–4。三个月内从数百人衰减到个位数，说明技术改进仍未解决严重留存问题。
