companyProfile:
  summary: >-
    Shrapnel 是 Neon Machine, Inc. 这个西雅图游戏工作室打造的品牌和游戏；Neon Machine 成立于 2014 年，Shrapnel 项目本身始于 2020 年。它是一款用 Unreal Engine
    5 打造的免费 AAA 第一人称撤离射击游戏，叠加 NFT 资产所有权、源自 Avalanche 且已迁移至 GalaChain 的 SHRAP 代币，以及 Moonshot 用户生成内容工具集。公司背后有 Gala
    Games、Griffin Gaming Partners 和 Polychain Capital，2025 年 8 月 Series A 披露估值 $1.1B。它也是首个获准接入中国政府支持的可信版权链的西方 Web3
    游戏。本次尽调的核心张力，是该私募股权标记与公司自身约 $1.1M 的公开 SHRAP 代币市值之间约 1,000 倍的差距；实时并发玩家接近归零，且诉讼仍在叠加。
