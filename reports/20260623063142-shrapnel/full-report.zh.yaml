  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与画像
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的可触达受众分为四类。第一类是 crypto-native 玩家和 NFT 持有者，他们参与了 2022–2023 年 Extraction Pack 预售和 Operator NFT
              投放；这些早期支持者构成上线前社区的骨干，按 AlphaGrowth 跟踪，约有 31,100 名链上 token/NFT 持有者。第二类是传统 FPS 和撤离射击玩家，他们来自 2026 年 3 月免费
              Steam Early Access 发布，被玩法质量吸引，而不是 Web3 经济。第三类是 UGC 创作者，他们被 Moonshot 工具吸引，用来设计可铸造成可交易 NFT
              的地图、皮肤和武器；工作室把这类人群定位为长期内容供给引擎。第四类是投机者和交易者，他们参与 SHRAP token 市场和 NFT 市场，但不一定玩游戏。目前地域结构偏西方，但通过 GalaChain 和
              Trusted Copyright Chain 在中国开启 Early Access，瞄准的是接近 7 亿中国游戏玩家的可触达市场。用户和付费方并不相同：免费模式意味着大多数玩家不付费，较小一部分人参与 NFT
              购买、市场交易和基于 token 的交易。从社交关注者到注册账号、再到活跃同时在线玩家，转化漏斗急剧收窄；下方 Steam 数据说明了这一点。
