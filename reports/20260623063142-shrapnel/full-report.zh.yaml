      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Neon Machine 由长期游戏行业创业者 Mark Long 创立；他在 2024 年前一直担任 CEO，也是 Shrapnel 的公众面孔。在计划中的免费发布之前，工作室任命 Ken Rosman
              为首席执行官。Rosman 是有 30 年经验的视频游戏老兵，曾在 Microsoft 的 Xbox 部门多年参与 Halo Wars、Sunset Overdrive 等作品；Long
              转任顾问，随后离开公司，去另一家新公司担任 CEO。Dave Johnson 领导 Shrapnel 项目，前 Shrapnel 工作室负责人、CTO Don Norbury 负责 Moonshot
              工具。治理一直有争议：2023 年 11 月，工作室创始人指控当时的多数股东、投资公司 4D Factory 负责人 Cort Javarone 发动「政变」；Javarone 则反称管理层失控。4D
              Factory 实体于 2023 年 10 月在纽约南区申请破产；投资者 GPC3 I, LLC 于 2025 年 1 月起诉 Javarone；Neon Machine 于 2025 年 3 月与创始人 /
              投资者诉讼达成和解。如今关键人依赖集中在 Rosman，以及与 Gala Games 的关系上。
