            body: >-
              把 Shrapnel 同 Web3 同行和传统既有玩家按关键购买标准对比，结论喜忧参半。制作质量上，Shrapnel 和 Off The Grid 都使用 Unreal Engine 5，并雇用有 AAA
              资历的开发者，视觉上可与传统射击游戏站在同一水平。但 Shrapnel 的实际玩家体验很有限——2026 年 3 月的 Steam Early Access 只上线一张 Tokyo 地图和一个 Stockpile
              撤离模式；ARC Raiders 则已推出多个生态区、进度系统，并用 1,500 万份销量证明留存。分发上，Shrapnel 可在 Steam 和 Epic 获取，但区块链功能被门控；Off The Grid
              还覆盖 PlayStation 和 Xbox。传统作品主导主机分发。定价上，Shrapnel 免费游玩，可选 NFT / 代币购买；Escape from Tarkov 版本售价 $45–150；ARC
              Raiders 采用 $40 付费买断。中国 TCC 准入给了 Shrapnel 一个任何竞争者都没有的独特监管优势，但中国变现需要经 GalaChain 走收入回购机制。用户生成内容方面，Shrapnel 的
