      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Web3 游戏市场由几项结构性驱动推动：游戏玩家对加密钱包的采用增加，对真正数字资产所有权的需求上升，play-to-earn 与创作者经济模式扩张，投资动能仍在——仅 2024 年 Q2 就有 $1.1B
              投入区块链游戏；由中国和东南亚带动的亚太增长，以及降低交易成本的 Layer-2 扩容方案成熟。Shrapnel 自身驱动包括：中国 TCC 桥接为一个 $49.8B、近 7
              亿玩家的游戏市场提供合规通道；撤离射击品类在 PC 游戏时长中占优，Escape from Tarkov 2025 年拿下全球 PC 游戏时长 1.7%
              份额就是证据。另一边则是实质约束。监管风险居首：中国禁止一般加密货币和 pay-to-earn 模式，除非通过狭窄的 TCC 框架；美国 SEC 也可能按 Howey 测试把部分游戏代币或 NFT
              定性为证券。加密和 NFT 市场波动会扰乱游戏内经济。玩家对 NFT 整合的怀疑有记录且广泛存在，原因包括过去的卷款项目、pay-to-win 印象，以及 Axie Infinity
              经济崩盘。Play-to-earn
              模式的可持续性取决于不断流入的新玩家；增长停滞时，动态就接近庞氏。既有撤离射击的切换成本理论上低，实践中却高，因为品类玩家已在进度系统里投入数百小时。信任仍是最大单一门槛：多年来低质量圈钱项目留下声誉赤字，Web3
              游戏必须先跨过这道坎，主流 FPS 玩家才会接受区块链机制。
