  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: Web3 区块链游戏竞争者
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 最接近的直接竞争者是 Gunzilla Games 的 Off The Grid，一款基于 Web3 的 AAA 大逃杀射击游戏，用 Unreal Engine 5 打造，运行在基于
              Avalanche 的 GUNZ 区块链上。Gunzilla 累计融资超过 $100M，投资者包括 CoinFund、Avalanche 的 Blizzard Fund、Republic Capital 和
              Coinbase Ventures，资本实力显著高于 Shrapnel 据称的 $38M。Off The Grid 于 2024 年登陆 PC、PS5 和 Xbox，并报告 2025 年有 1,730
              万个钱包准备迁移主网，月度市场交易额 $13M，已解码 NFT 资产超过 413,000 个。它的双通道模式——Steam 上传统玩法、平台外区块链功能——与 Shrapnel 的 Web2/Web3
              分拆相似，但分发规模更大。Gunzilla 之外，更广泛的 Web3 游戏图景是一则警示。Illuvium (ILV) 在代币峰值时估值曾接近 $1B，2026 年 6 月市值约
              $27–35M，活跃玩家数未披露。基于 Solana 的太空 MMO Star Atlas (ATLAS) 市值约 $3M，较历史高点下跌 99.96%；有报道指其开发停摆，Solana Foundation
              总裁也在 2026 年 3 月宣称区块链游戏不会回来了。Axie Infinity (AXS) 这个 play-to-earn 先行者已成反面教材，日活从 280 万跌至约 99,000，代币较峰值下跌
              99%，市值约 $250M。Big Time (BIGTIME) 维持 $16–21M 的小市值，但不披露玩家数。整体看，2020 年以来上线的 Web3 游戏项目已有 93% 实际死亡，整个板块摧毁了 $15B
              资本。
