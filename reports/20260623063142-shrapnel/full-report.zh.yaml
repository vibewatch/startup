      - number: '8.2'
        title: Token 与股权估值脱节
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 估值的核心矛盾，是 $1.1B 私募股权标记与约 $1.1M SHRAP token 市值之间约 1,000 倍的缺口。截至 2026 年 6 月中旬，SHRAP 约以每枚 $0.0004
              交易，流通供应约 28.9 亿枚（占 30 亿最大供应量的 96%）。token 的完全稀释估值约 $1.2M。token 于 2023 年 12 月达到约 $0.44 的历史高点，较当前水平下跌
              99.9%。日交易量低于 $1,000，说明流动性接近为零。CoinCodex 预测该 token 2026 年底为 $0.000376，仍偏空。DropsTab 记录包含 token 销售收入在内的总融资为
              $57.6M，当前市值为 $630K。这个脱节可以有几种解释：股权投资者持有超出 token 经济的治理权和 IP 权利；token 经济已结构性失败，而股权论点依赖游戏开发
              IP；或者私募估值只是已经过时，并被一笔非公平交易抬高。无论哪种解读，公开市场都给 SHRAP token 经济赋予接近零的价值，直接反驳了 token 驱动玩法能创造可持续收入的论点。如果 token
              如公司材料所述是平台的经济骨架，它的崩盘就削弱了必须支撑股权价格的收入模型。
            claimRefs:
