chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 是面向消费者的品牌和游戏；法律运营实体是 Neon Machine, Inc.，一家位于华盛顿州西雅图的游戏工作室。Neon Machine 成立于 2014 年，但 Shrapnel
              项目本身始于 2020 年，当时的目标是做一款「blockbuster-quality」撤离射击游戏，让玩家拥有并交易自己的创作。产品是一款免费游玩、基于团队的第一人称射击游戏，用 Unreal Engine 5
              打造，背景设在末日后的「Sacrifice Zone」；Operators 在其中收集并撤离一种名为 Sigma 的资源。商业模式完全 Web3 原生：游戏内装备、皮肤和玩家设计物品被代币化为 NFT，一个
              Layer-1 效用代币 SHRAP 支撑经济体系，并配套游戏内市场和工作室的「Moonshot」Web3 游戏开发与用户生成内容工具套件。变现预期来自道具销售、市场费用、代币效用，以及在中国的 SHRAP
              收入分成回购。截至运行日，公司仍是风险资本支持的私营企业，大致处在 Series A 阶段，正从付费抢先体验转向更广泛的免费发布和受监管的中国进入。
