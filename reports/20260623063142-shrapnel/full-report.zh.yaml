  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与证券风险
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的监管风险横跨三个司法辖区，至少涉及四套不同法律框架。在美国，尽管 SEC 在 Atkins 主席的「Project Crypto」框架下于 2025 年转向先给指导、再执法，SHRAP 实用型
              token 及相关 NFT 仍面临 Howey 测试下的残余证券法风险。SEC 此前已追诉 NFT 发行方——Impact Theory（2023 年 8 月 $6.1M 和解）和 Stoner
              Cats（2023 年 9 月 $1M 罚款）——原因是发行方出售未注册投资合约，购买者期待从发行方努力中获利。SHRAP 的 tokenomics 包含收入分成回购机制（最高 10% 中国收入用于回购
              SHRAP）、二级市场可交易性，以及与游戏价值升值绑定的推广历史；这些因素都可能在未来执法中被用于 Howey 第三、第四要件。Skadden 2025 年 8 月分析确认，虽然 SEC
              执法姿态已软化，但「token 化证券仍然是证券」，Howey 测试仍是所有联邦巡回法院的控制性法律。在中国，crypto 交易和 P2E 在 2026 年多部委框架下仍被严格禁止；Shrapnel
              通过政府背书的 Trusted Copyright Chain（TCC）和 NPPA 许可运营，这是一条狭窄的合规走廊，一旦政策逆转或 TCC 失去官方支持，就可能坍塌。Norton Rose Fulbright
              2026 年分析指出，中国新框架「继续维持对加密货币的严格禁令」，只允许在严格监管下开展 RWA tokenisation——任何向类 crypto 机制滑移，都有立即执法风险。在欧盟，即将出台的 Digital
              Fairness Act 专门针对游戏中的 loot box 和随机物品变现，比利时已将付费 loot box 刑事化，荷兰也在推进执法。Shrapnel 的 NFT
              撤离机制让玩家为随机物品容器付费，并在二级市场交易产出；若欧盟把这类物品定性为赌博，或按 MiCA 归入受监管金融工具，它就正落在监管靶心。Game Growth Advisor 的 2026
              合规指南警告，欧盟、英国和亚洲的 loot box 监管正「趋向同一套要求：披露盒子里有什么，验证玩家年龄，不要模糊财务上发生了什么」。短期内，SEC
              姿态较软让监管执法概率维持在中等，但严重性很高；不利裁定可能迫使 token 重组、地理封锁，或在主要市场停止运营。
