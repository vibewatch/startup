      - number: '2.2'
        title: 市场规模与估算区间
        blocks:
          - type: paragraph
            body: >-
              已发布的 Web3 游戏市场估算，因范围和方法不同而大幅分歧。The Business Research Company 通过 Research and Markets 与 GII Research 给出的规模为
              2025 年 $39.65B、2026 年 $48.55B，CAGR 22.4%，并预计 2030 年达到 $108B。Straits Research 对同一市场的估值仅为 2025 年 $28.31B，按
              18.1% CAGR 到 2034 年达到 $117B。Future Market Insights 估算 2025 年 $33.7B、2026 年 $39.9B，CAGR 18.5%。Precedence
              Research 给出 2025 年 $37.55B，CAGR 19.24%。Business Research Insights 预计 2026 年为 $44.54B。这些差异来自不同机构对 Web3
              游戏收入与更广义区块链生态收入边界的不同定义。The Business Research Company 采用更窄的区块链游戏分类时，2025 年仅 $11.22B，2026 年 $17.82B，但 CAGR
              高达 58.8%。Fortune Business Insights 给出的更广义射击游戏市场 2025 年为 $82.02B，其中第一人称射击切片为 $27.53B，并增长至 2026 年
              $30.15B。Shrapnel 现实的可服务可获得市场，是会玩 PC 撤离射击的 Web3 游戏基础设施用户交集，只占任一头部数字的一小部分。我们保留互相矛盾估算的完整区间，并指出没有任何单一来源为 Web3
              撤离射击提供自下而上的具体规模测算。
