      - number: '7.4'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 依赖定制区块链基础设施（GalaChain）、跨链桥机制和智能合约治理的资产所有权，其技术栈带来重大运营风险。OWASP Smart Contract Top 10 for 2025
              将访问控制漏洞和业务逻辑缺陷列为严重性最高的两类；仅 2024 年，二者合计就造成 DeFi 损失超过 $1.42B。到 2026 年，跨链桥攻击累计损失已超过 $2.8B，Kelp DAO（$292M）和
              Drift Protocol（$285M）事件说明，桥架构仍然结构性脆弱。Shrapnel 用于中国运营的 GalaChain-to-TCC
              bridge，以及任何未来跨链集成，都会继承这类系统性漏洞。GalaChain 本身是一条相对年轻的许可制 Layer-1 区块链，没有 Ethereum 或 Solana
              主网那样经过实战检验；链级宕机或攻击会同时中断所有游戏内交易、市场活动和 NFT 转移。运营上，工作室多次推迟发布，暴露出执行风险：游戏最初被定位为 2023 年正式发布，随后转为 2024 年 2 月付费
              early access，再转为 2026 年 3 月 Steam Early Access，完整免费版本仍未上线。Steam Early Access 发布时峰值仅约 255
              名同时在线玩家，几个月内衰减到个位数——这意味着要么产品市场匹配有问题，要么营销投入不足。Steam 评价提到性能问题、bug 和内容单薄，也进一步证明质量风险。NFT
              市场和游戏内经济在游戏客户端之外增加了攻击面：智能合约漏洞可能抽干玩家资产，市场操纵可能摧毁信任，针对 Web3 玩家钱包的 drainer 钓鱼活动也是行业级威胁；Shrapnel 尚未通过 bug
              bounty 或审计披露公开回应这一威胁。
