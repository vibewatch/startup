  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Neon Machine 已在多轮股权融资中筹集超过 $38M，最终于 2025 年 8 月完成由 Gala Games 领投的 $19.5M Series A，披露投后估值为 $1.1B。更早资金包括 2023
              年 10 月由 Polychain Capital 领投、Griffin Gaming Partners 参投的约 $20M 轮次。按 TechCrunch 2025 年名单，$1.1B 估值把 Neon
              Machine 推入独角兽行列，也让一家志在 AAA 的区块链游戏工作室拿到了可与已有收入验证的中期 SaaS 公司相比的估值。关键在于，这一估值由单一领投方 Gala Games 定价；Gala Games
              同时也是战略伙伴，提供区块链基础设施（GalaChain）并通过 Trusted Copyright Chain 提供中国市场准入，这引发了是否为公平交易定价的问题。没有二级交易、公开市场参照或独立估值标记来佐证
              $1.1B。累计股权融资约 $38M，意味着估值与累计融资额之比约 28x；对一家收入前游戏工作室而言，这一倍数非常激进。EDGAR 上没有 Neon Machine, Inc. 的 SEC Form D
              文件；对一家在美国注册、以这个规模融资的公司而言，这是异常情况。Series A 内含两笔 tranche，暗示资本按里程碑部署，但 tranche 条件未公开。在审诉讼 Realm Metaverse Real
              Estate Inc. v. Neon Machine（SDNY 1:25-cv-10057）指控证券欺诈，加之前多数股东 4D Factory 的破产，使 cap table 图景和优先权悬置问题更复杂。
