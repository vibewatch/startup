      - number: '6.2'
        title: 采用轨迹与牵引指标
        blocks:
          - type: paragraph
            body: >-
              采用证据分为三个阶段。2024 年 2 月 Epic Games Store 付费 Early Access 期间，Neon Machine 披露约 27 天内产生超过 370 万场游戏
              session——玩家提取 1.41 亿 Sigma、售出 384,000 件物品、开火 3,700 万次。这些数字来自工作室自有 Intel 页面和 Chainwire
              融资公告，是目前最强的量化牵引信号。不过，2024 年 2 月是付费访问窗口（Extraction Packs 约 $20–50），受众经过自我筛选，也已经投入资金。第二阶段是 2026 年 3 月 12 日免费
              Steam Early Access 发布。Steambase 记录发布当天历史峰值为 200 名同时在线玩家，3 月平均为 40 名。4 月降至平均 13 名，5 月降至 3 名，2026 年 6 月平均为 2
              名，峰值仅 6 名。SteamCharts 也印证了这些数字，显示游戏经常只有 0–2 名玩家在线。第三阶段是 2026 年 4 月 30 日起通过 GalaChain 和 Trusted Copyright
              Chain 在中国开启 Early Access，目前太新，还没有可验证的参与数据。若不理解 session ≠ 同时在线玩家、付费受众 ≠ 免费受众、2024 年窗口可能包含机器人或重复 session
              膨胀——这是 Web3 游戏指标里的常见担忧——就无法把 27 天 Epic 指标和 Steam 同时在线数据对齐。Steam 发布后三个月内从峰值衰减到近乎为零，是最关键的负面牵引信号。
