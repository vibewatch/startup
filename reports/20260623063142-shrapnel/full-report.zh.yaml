      - number: '5.3'
        title: 区块链架构与代币基础设施
        blocks:
          - type: paragraph
            body: >-
              SHRAP 代币作为 Avalanche 上的 ERC-20 发行，固定最大供应量 30 亿枚，并在 2023 年底一次性 Token Generation Event (TGE) 中生成。归属合约部署在
              Avalanche C-Chain 上，并在子网激活前锁定。原计划的 Shrapnel 子网本应作为游戏交易专用 Layer-1，但迁移到 GalaChain 取代了原子网路线图。在 GalaChain
              上，SHRAP 仍是 NFT 购买、市场交易、UGC 铸造和质押的游戏内货币。最多 10% 来自中国玩家的收入将用于定期回购 SHRAP。GalaChain–TCC
              跨链桥支持全球与中国生态之间安全、合规地移动数字资产。所有链上活动，包括跨境转移，都消耗 GALA 作为 gas。NFT 类别包括 Operators（可玩角色）、武器皮肤、外观物品和用户生成地图 /
              内容。Shrapnel Marketplace 提供挂单、交易、制作（Printer）和回收（Recycle Depot）功能。智能合约安全审计尚未公开披露；鉴于链上资产支撑整个经济模型，这是一个实质缺口。
