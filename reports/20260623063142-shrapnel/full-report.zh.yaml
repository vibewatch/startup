      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >-
              与企业 SaaS 公司不同，免费游戏没有具名客户合同。不过，Steam 评价、社区参与和链上数据能提供真实用户的可验证证据。Steam 显示 762 条评价，评分 75/100、总体为 Mostly
              Positive，说明真实玩家玩过并评价了这款游戏。但近期差评提到匹配超时超过 20 分钟，并把游戏称为「鬼城」——由于玩家群体坍塌，玩家实际上找不到对局。Outposts.io 记录的 Player
              Council 计划选出社区成员，直接向开发团队反馈；这证明仍有一小撮投入度较高的核心用户。链上看，AlphaGrowth 跟踪到超过 31,100 名 SHRAP token 持有者，不过持有 token
              不等于活跃游玩。Discord 成员约 65,000，X 关注者约 403,000——但在游戏行业，社交指标一向很难代表活跃玩家。核心证明问题在于，Steam 发布以来，没有独立来源确认任一时点有超过 200
              名真人同时游玩。2024 年 370 万 session 数字由公司披露，且未公开第三方验证方法。
