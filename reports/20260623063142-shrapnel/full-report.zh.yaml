      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的财务画像是一家收入前、依赖代币的 Web3
              游戏公司：私募估值过大，公开披露很少，代币经济严重承压。没有显示市场交易量、费用收入和代币消耗使用率的管理账，收入质量就无法评估。利润率路径仍属推测：数字商品业务一旦上规模可有高毛利，但 Neon Machine
              尚未证明能以有意义规模吸引付费用户——Steam Early Access 峰值并发玩家仅约 255，随后衰减。资本强度取决于工作室能否靠 Series A
              后现金和中国市场收入维持开发，但外部无法核验。尽调阻断项包括：索取管理账和审计财务；确认和解后的股权结构和清算优先级；核验中国收入分成机制和 SHRAP 回购量；获取代币金库余额和内部人解锁时间表；厘清
              $19.5M Series A 募资用途。在这些问题解决前，财务故事完全依赖据称融资叙事，而非已验证商业牵引或可持续单位经济。
