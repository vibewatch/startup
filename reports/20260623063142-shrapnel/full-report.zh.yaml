      - number: '8.5'
        title: 建议、结论与尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：继续研究，并明确判断为估值过高。任何可观察数据点——token 市值、玩家参与、收入披露或行业可比——都无法支撑 $1.1B 估值。私募标记似乎反映的是有冲突的领投方（Gala
              Games）赋予的战略价值，而不是公允市场价值。风险评级：很高。置信度：中——公开数据充分支持估值过高论点，但存在非公开牵引指标或中国收入的可能性，我们无法验证，因此不能高置信度直接否决。估值立场：明显高估——$55M–$120M
              的概率加权预期价值意味着披露标记高于公允价值 9–20 倍。投资含义：若没有（a）中国市场运营收入验证，（b）持续玩家参与超过 10K 同时在线的证据，（c）token
              价格恢复以证明真实经济活动，以及（d）独立估值意见，则在或接近披露 $1.1B 标记入场都不可辩护。否决触发器包括：token 退市、超过 $5M 的不利诉讼判决、中国 TCC 许可撤销、Gala Games
              破产，或发布后连续六个月同时在线玩家数低于 500。最终尽调问题：显示收入和 burn 的管理账；带优先权栈的 cap table；中国市场 GMV 数据；$1.1B 标记的独立估值方法；token
              财库余额和内部人解锁时间表；和解后的治理协议。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
