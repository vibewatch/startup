      - number: '7.3'
        title: Token 与财务风险
        blocks:
          - type: paragraph
            body: >-
              SHRAP token 已从 2023 年 12 月 $0.44 的历史高点下跌约 99.9%，至 2026 年 6 月约 $0.0003；完全稀释市值约 $1.1M，而公司披露的私募股权估值为
              $1.1B，两者相差 1,000 倍。这一缺口叠加出多重风险。第一，token 财库 runway：若 Neon Machine 持有大量 SHRAP
              储备用于运营，其美元价值已基本蒸发。第二，流动性和退市风险：以当前交易量和市值看，交易所上币已缺乏商业可行性，从主要交易所下架会进一步削弱 token 效用和投资者信心。第三，作为中国变现模式核心的回购机制（最高
              10% 中国收入用于回购 SHRAP）结构上很弱：考虑到当前流通盘动态，即便游戏收入可观，对 token 价格的推动也很有限，从而削弱支撑玩家留存的 play-to-own 价值主张。YearBull 风险评估把
              SHRAP 的总体风险评为「中等」，市场位置为「周期后段」，意味着当前 crypto 周期里的上行空间有限。更广泛的 Web3 游戏行业经历了灾难性淘汰：多份行业分析显示，2021–2024
              年上线的区块链游戏超过 93% 现在已「事实上死亡」，行业总价值毁灭超过 $15B。Shrapnel 能否活下来，取决于游戏质量能否跑赢 token 经济；但 burn-rate
              数据仍未披露，缺少管理账就无法评估 runway。
