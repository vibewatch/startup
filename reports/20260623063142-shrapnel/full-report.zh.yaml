              2025–2026 年该品类的爆款，跨平台峰值并发约 960,000，销量超过 1,400 万份，Steam 稳态并发 85,000–105,000——约为 Shrapnel 峰值并发的 400
              倍。Tencent 旗下 TiMi Studio Group 的 Delta Force 据称并发甚至超过 ARC Raiders，凭大规模跨平台参与度坐稳品类之王。Crytek 的 Hunt: Showdown
              是品类老将，峰值并发约 60,000，稳定核心玩家较小但忠诚。Call of Duty: Warzone 及其 DMZ 模式借助全球最大 FPS 系列，在 Activision
