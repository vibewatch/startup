        title: 财务红旗与诉讼敞口
        blocks:
          - type: paragraph
            body: >-
              财务分析暴露出几项红旗。最重要的是 $1.1B 私募股权估值与约 $1.1M SHRAP 代币市值之间约 1,000
              倍的背离：如果代币经济本该支撑用户参与，它的实际崩塌就说明市场不相信项目经济可持续。第二，没有公开审计财务、收入数字或运营指标（员工数、烧钱、跑道），外部无法独立承销。第三，在多轮据称超过 $38M
              的融资后仍未提交 SEC Form D，提出了监管披露问题。第四，现行诉讼带来或有负债：Realm Metaverse Real Estate Inc. v. Neon Machine（SDNY
              1:25-cv-10057，2025 年 12 月提交）提出证券和 NFT 相关主张；GPC3 I, LLC v.
              Javarone（1:25-cv-00060）涉及与工作室前投资者相关的一份代币购买协议违约。第五，前多数股东 4D Factory 于 2023 年 10 月申请 Chapter 11 破产（SDNY
              23-11618/23-11619），对抗程序 4D Factory LLC v. Long 已在 2025 年 5 月关闭，但留下残余股权结构复杂性。第六，代币归属仍在继续；截至 2026 年中，Team
              and Advisor 分配仅解锁 40%，意味着内部人解锁带来的持续卖压至少延续到 2028 年 10 月。
