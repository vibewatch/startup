      - number: '7.5'
        title: 合作伙伴、依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 与 Gala Games 的关系带来关键单一伙伴集中风险。Gala Games 同时是股权领投方（Series A）、区块链基础设施提供方（GalaChain）、中国市场准入赋能方（TCC
              bridge）和 token 经济对手方（GALA 作为 gas token）。Gala Games 若失败、发生争议或遭遇监管行动，将同时损害 Shrapnel 的融资、技术栈、市场准入和 token
              经济——这种风险相关性在垂直整合型集团之外很少见。Gala 之外，中国市场进入依赖 Lingjing Game Labs（人民日报数字子公司）负责本地分发和 NPPA 合规；这段关系引入 Neon Machine
              无法直接控制的地缘政治与合作伙伴执行风险。领导层更替进一步放大执行风险：创始人兼前 CEO Mark Long 在 2025 年治理争议后离开，CEO Ken Rosman
              成为关键人物，而他加入的明确目的就是负责发布阶段。工作室未披露继任计划、未具名 CFO，对工程或产品领导梯队深度的公开信息也有限。竞争环境已经更激烈：Gunzilla Games 的 Off The Grid 于
              2025 年 7 月登陆 Steam，玩家数明显更高；撤离射击品类如今挤满资金充足的新进入者，包括 Arc Raiders，以及加入撤离模式的传统系列。单一伙伴依赖、领导梯队薄、竞争压力和 token
              价格崩盘叠加，形成一种局面：任何单点故障都可能级联成工作室的生存风险。
