      - number: '5.2'
        title: 技术栈与架构
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 基于 Unreal Engine 5 打造，在 2026 年 3 月 Steam 发布前的一年技术重置中，已从早期 UE4 版本完整迁移到 UE5。工作室称，UE5
              升级改善了视觉保真度、服务器响应和命中判定可靠性。核心技术系统包括：用 bullet pooling
              重建的射击判定流水线（枪战中复用子弹对象，而不是创建新实例）；用固定曲线后坐力模式替代随机水平后坐力；按玩家姿态（腰射、ADS、蹲伏）调整散布机制；以及保障竞技完整性的服务器权威网络模型。后端推测使用专用服务器托管比赛并靠云扩展；没有公开文档确认具体云服务商（AWS、Azure
              或 GCP）。区块链层最初运行在 Avalanche 子网（自定义 L1）上，SHRAP ERC-20 代币部署于 Avalanche C-Chain。2025 年中后期，Neon Machine 宣布将所有
              NFT 资产和 SHRAP 代币完整迁移到 GalaChain；GalaChain 是 Gala Games 为游戏和娱乐打造的自定义 Layer-1 区块链。GalaChain 提供更快交易终局性、更低 gas
              成本，以及与 Gala 市场基础设施的原生集成。GALA 作为所有链上交易的 gas 代币。架构还增加 GalaChain 与中国可信版权链（TCC）之间的跨链桥，计划 2026 年 Q1
              启用，从而支持合规数字资产流动。反作弊和安全措施未公开记录；Steam 商店页未列出 Easy Anti-Cheat 或 BattlEye 集成，对竞技多人游戏来说是一个缺口。
