  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心玩法
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 是一款免费游玩、基于团队的第一人称撤离射击游戏，背景设在虚构的末日后「Sacrifice Zone」：2038 年小行星 38 Sigma 撞击月球，陨石轰击地球，形成该区域。玩家以精英
              Operators 身份进入敌对区域，在对手小队得手前定位、收集并撤离一种名为 Sigma 的不稳定资源。主要发布模式 Stockpile 是 4v4 目标制竞技玩法，两队竞速存入 300 grav-kilos
              的 Sigma。核心循环结合资源收集、小队枪战、动态流星雨危险和撤离压力。游戏内资产——Operators、武器皮肤、外观——以 GalaChain 上的 NFT 形式代币化，并可在 Shrapnel
              Marketplace 交易。Operators 可升级解锁 perk，自定义玩法风格。Printer 用收集物品制作神秘奖励，Recycle Depot 把多个物品转化为新物品。Shrapnel 的商业模式完全
              Web3 原生：SHRAP 代币效用消耗、市场费用，以及经可信版权链实现的中国收入分成机制，构成变现支柱。游戏优先面向 PC（Windows），已在 Steam 开启 Early Access；尚未宣布主机版本。
