            body: >-
              Shrapnel 声称的竞争护城河有四条：借 Unreal Engine 5 实现 AAA 制作质量，Moonshot UGC 创作者工具包，SHRAP
              代币经济，以及率先接入中国可信版权链。每一条都有实质耐久性问题。UE5 护城河现在只是入场券——Off The Grid 和多个传统作品都用同一引擎，单靠画面保真度守不住。Moonshot
              工具包是最新颖的资产，但价值完全取决于能否吸引足够多创作者采用，目前尚未证明。SHRAP 代币价格约 $0.0008、市值约 $1.1M（较 ATH 低 99%），更像潜在负债而非护城河：它复制了其他所有
              Web3 游戏代币的崩盘模式，代币公开市场判断与工作室 $1.1B 私募估值之间的差距，是核心可信度问题。中国 TCC 准入确实稀缺——尚无其他西方 Web3
              游戏做到——但商业价值取决于能否把受监管准入转化为付费玩家，仍未证明。替代风险包括：ARC Raiders 和 Delta Force 证明撤离射击无需区块链也能做到大规模；Web3 游戏板块 93%
