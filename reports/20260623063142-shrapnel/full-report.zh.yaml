      - number: '4.2'
        title: 代币经济与市场表现
        blocks:
          - type: paragraph
            body: >-
              SHRAP 代币是 Shrapnel 生态的经济骨架，运行在 Avalanche 上，固定最大供应量为 3,000,000,000 枚。代币生成发生在 2023 年底；到 2026 年 6 月，约 28.9 亿枚
              SHRAP 已流通，约为最大供应量的 96%。TGE 时分配给 Community Rewards（约 27%）、Team and Advisors（约 27%，即 810M SHRAP，47 个月 cliff
              后线性归属）、Seed investors（约 20%，即 600M，现已完全解锁）、Strategic investors（约 7%，即 210M，到 2026 年 6 月约 79% 解锁）以及
              Ecosystem/Liquidity 储备（约 19%）。代币在 TGE 后不久的 2023 年 12 月达到约 $0.44 的历史高点，受投机需求推升。此后，SHRAP 到 2026 年 6 月中旬已下跌约
              99.9% 至约 $0.0004，市值约 $1.1M，日交易量低于 $1,000。CryptoSlate 记录的历史低点是 2026 年 6 月 9 日的 $0.00031。这场崩盘发生在 2025 年 8
              月私募股权估值被标记为 $1.1B 期间，私募标记与公开市场对代币经济的判断之间形成约 1,000 倍差距，构成本次尽调中最核心的负面财务信号。
