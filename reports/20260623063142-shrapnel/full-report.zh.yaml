      - number: '2.3'
        title: 买家与玩家分层
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 的目标用户至少可分为四类买家画像，动机、预算归属和采用触发点都不同。第一，硬核 PC 撤离射击玩家。他们追求高风险 PvPvE
              玩法，也拥有硬件预算；采用触发点是玩法质量，不是区块链功能。第二，Web3 原生数字资产投资者。他们把游戏内 NFT
              视为投机资产；预算来自加密钱包资本，触发点是代币经济上行和二级市场流动性。第三，用户生成内容创作者。他们用 Shrapnel 的 Moonshot
              工具设计并销售地图、皮肤和物品；触发点是创作者经济分成。第四，通过可信版权链接入 Shrapnel 的中国玩家。他们的预算来自人民币计价的市场交易，触发点是一个西方 AAA
              作品在合规数字资产交易下可用。所有情形下付款人都是玩家本人，但预算所有者差异很重要：硬核射击玩家从可支配娱乐预算里买外观；加密投资者投入投机资本，风险容忍度不同。Play-to-earn
              模式模糊了这条线，并创造出第五类低收入打金玩家；其可持续性依赖新资本流入，Axie Infinity 崩盘后这个模式受到广泛批评。鉴于 6.83 亿可服务玩家基数，Shrapnel
              的中国优先扩张战略把第四类放在优先位置。
