      - number: '2.5'
        title: Sizing Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The market-sizing evidence base contains irreconcilable contradictions that cannot be resolved without
              proprietary data. The 2025 Web3 gaming market estimate ranges from $28.31 billion to $39.65 billion
              depending on source, a 40-percent spread that reflects definitional disagreement rather than measurement
              error. The narrower blockchain-gaming taxonomy at $11.22 billion versus the broader Web3 gaming figure at
              $39.65 billion reveals a nearly four-to-one gap that is entirely methodological. No published report
              provides a bottom-up TAM for Web3 extraction shooters or for blockchain-enabled FPS games specifically,
              forcing any Shrapnel-specific SAM estimate to be constructed from assumptions about genre penetration
              rates and crypto-wallet adoption among hardcore PC gamers. The China opportunity of $49.8 billion and 683
              million players is an overall gaming-market figure; the portion accessible through the TCC framework for a
              single Western Web3 title is orders of magnitude smaller and depends on regulatory execution, platform
              discovery, and the as-yet-unproven economics of cross-border RMB digital-asset trading. Investment
              momentum is episodic: the $1.1 billion Q2 2024 figure represents a 314-percent quarter-over-quarter spike
              that may not sustain. These gaps define the diligence agenda for any investor relying on market-size
              arguments to justify the $1.1 billion valuation.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM012
              - CM021
              - CM034
              - CM035
              - CM040
