      - number: '8.5'
        title: Recommendation, Verdict and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Research-More with a strong Overvalued stance. The $1.1B valuation cannot be supported by
              any observable data point — token market cap, player engagement, revenue disclosure, or sector
              comparables. The private mark appears to reflect strategic value assigned by a conflicted lead investor
              (Gala Games) rather than fair market value. Risk rating: Very High. Confidence: Medium — the overvaluation
              thesis is well-supported by public data, but the possibility of non-public traction metrics or China
              revenue that we cannot verify prevents a high-confidence outright rejection. Valuation stance: Materially
              overvalued — the probability-weighted expected value of $55M–$120M implies the reported mark is 9–20x
              above fair value. Investment implication: No entry at or near the reported $1.1B mark is defensible
              without (a) verified revenue from China marketplace operations, (b) evidence of sustained player
              engagement above 10K concurrent, (c) token price recovery indicating real economic activity, and (d) an
              independent valuation opinion. Kill triggers include: token delisting, adverse litigation judgment
              exceeding $5M, China TCC revocation, Gala Games insolvency, or concurrent player count remaining below 500
              for six consecutive months post-launch. Final diligence asks: management accounts showing revenue and
              burn; cap-table with preference stack; China marketplace GMV data; independent valuation methodology for
              the $1.1B mark; token treasury balances and insider unlock schedule; post-settlement governance
              agreements.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 1,000x equity-to-token valuation gap
            body: >-
              The $1.1B private equity mark coexists with a ~$1.1M SHRAP token market cap — roughly 1,000x divergence.
              No public-market comparable in Web3 gaming approaches $1B. The gap suggests the private mark is either
              stale, strategically inflated, or dependent on non-public information unavailable to outside investors.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV033
          - type: callout
            title: 93% sector mortality rate
            body: >-
              Caladan's April 2026 study of 3,200+ GameFi titles found 93% are effectively dead, with $12–15B in capital
              destroyed. Annual Web3 gaming funding collapsed 93% from $4B (2022) to $360M (2025). Shrapnel exists in a
              sector where survival — let alone unicorn valuation — is a statistical anomaly.
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
          - type: callout
            title: China TCC optionality remains live
            body: >-
              The GalaChain-Trusted Copyright Chain bridge granting access to China's 683M gamers is a genuine
              first-mover advantage that no competitor currently holds. If the China revenue-share mechanism generates
              meaningful GMV, it could partially rehabilitate the valuation — but no data confirms this thesis.
            calloutType: strength
            claimRefs:
              - CV026
              - CV027
