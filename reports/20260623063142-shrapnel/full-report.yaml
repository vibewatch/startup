      - number: '1.2'
        title: Founders, Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Neon Machine was founded by longtime game-industry entrepreneur Mark Long, who served as CEO and public
              face of Shrapnel through 2024. Ahead of the planned free-to-play launch the studio installed Ken Rosman, a
              30-year video-game veteran who spent years at Microsoft's Xbox division on titles such as Halo Wars and
              Sunset Overdrive, as chief executive; Long moved to an advisory role and subsequently left the company to
              become CEO of a separate venture. Dave Johnson leads the Shrapnel project and former Shrapnel studio head
              Don Norbury, the CTO, oversees the Moonshot tools. Governance has been contentious: in November 2023
              studio founders alleged that Cort Javarone, then majority shareholder and head of investment firm 4D
              Factory, had staged a "coup," while Javarone countered that leadership had gone rogue. 4D Factory entities
              filed for bankruptcy in the Southern District of New York in October 2023, investor GPC3 I, LLC sued
              Javarone in January 2025, and Neon Machine settled the founder/investor litigation in March 2025.
              Key-person dependence now concentrates on Rosman and on the Gala Games relationship.
