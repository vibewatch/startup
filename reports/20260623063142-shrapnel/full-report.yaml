      - number: '7.2'
        title: Active Litigation and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Neon Machine faces ongoing federal litigation that directly implicates the company and its broader
              ecosystem. The most material active case is Realm Metaverse Real Estate Inc. v. Neon Machine, Inc. and
              Oganesson Factory Limited (SDNY 1:25-cv-10057), filed December 4, 2025, alleging securities fraud under 12
              U.S.C. § 22 in connection with a delayed NFT delivery. The complaint asserts that Neon Machine informed
              Realm in 2024 that delivery of a purchased NFT would be postponed until 2027, several years beyond the
              original promise. The case is assigned to Judge Jeannette A. Vargas with Magistrate Judge Barbara Moses
              and remains pending as of June 2026; Neon Machine has retained Orrick Herrington & Sutcliffe LLP. The
              securities-fraud framing — rather than a simpler breach-of-contract claim — elevates the legal risk
              because an adverse finding could establish precedent characterising Shrapnel NFTs as investment contracts.
              Related ecosystem litigation includes the 4D Factory, Inc. Chapter 11 bankruptcy (SDNY 23-11618, filed
              October 2023) involving Neon Machine's former majority shareholder Cort Javarone; the adversary proceeding
              The 4D Factory, LLC v. Long (24-01319) naming founder Mark Long, Polychain Ventures, and Griffin Gaming
              Partners among respondents; and GPC3 I, LLC v. Javarone (SDNY 1:25-cv-00060/24654) alleging breach of a
              token-purchase agreement by the former controlling shareholder. The March 2025 settlement of the
              internal-control dispute resolved the most acute governance crisis, but residual exposure persists: the 4D
              Factory bankruptcy estate may hold residual claims against Neon Machine assets, and the Realm Metaverse
              case introduces fresh securities-fraud risk with potential class-action expansion. CourtListener's docket
              search returns six federal matters naming or closely associated with Neon Machine, indicating a litigation
              density atypical for a studio of this size and stage.
