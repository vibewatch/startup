      - number: '5.5'
        title: Launch State, Developer Signal, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Shrapnel 2.0 entered Steam Early Access on March 5, 2026, after a year-long technical reset from the
              earlier Epic Games Store paid early-access window (February 2024, 27 days, 3.7 million sessions reported).
              The Steam launch introduced the Stockpile 4v4 mode, a Tokyo-themed map, two Operators, and UE5-rebuilt
              gunplay. The planned Early Access duration is approximately two months, with gameplay content in month one
              and progression features (Missions, Battle Pass) in month two. The studio committed to regular dev blog
              updates and weekly patch cadences. Documented patches include a March 18 stability update (texture loading
              fixes, Sigma pickup bug, Operator-switch on death screen) and a March 25 balance patch (Phantom HP reduced
              400 to 350, DMR body-shot damage increased, AR2 mag capacity reduced 33 to 30, camera shakes removed).
              Roadmap items include skill-based matchmaking, weapon-loadout customization menu, account progression,
              social features, daily missions, more maps, and expansion to five Operators. China Early Access via
              GalaChain–TCC launched April 30, 2026. However, third-party tracking (SteamCharts) records an all-time
              peak of only 253 concurrent players, with the average in March 2026 around 21 and current figures in June
              2026 at 1–4. This decay from hundreds to single digits within three months signals an acute retention
