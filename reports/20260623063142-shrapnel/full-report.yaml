      - number: '5.2'
        title: Technology Stack and Architecture
        blocks:
          - type: paragraph
            body: >-
              Shrapnel is built on Unreal Engine 5, having undergone a complete migration from its earlier UE4 build to
              UE5 during the year-long technical reset preceding the March 2026 Steam launch. The studio reports that
              the UE5 upgrade brought improvements in visual fidelity, server responsiveness, and hit-detection
              reliability. Core technical systems include a rebuilt shot-resolution pipeline using bullet pooling
              (reusing bullet objects in firefights rather than creating new instances), fixed curve-based recoil
              patterns replacing random horizontal recoil, adjusted spread mechanics based on player stance (hip-fire,
              ADS, crouching), and a server-authoritative networking model for competitive integrity. The backend is
              assumed to use dedicated servers for match hosting with cloud-based scaling; no public documentation
              confirms the specific cloud provider (AWS, Azure, or GCP). The blockchain layer originally ran on an
              Avalanche subnet (custom L1), with the SHRAP ERC-20 token deployed on Avalanche C-Chain. In mid-to-late
              2025 Neon Machine announced a full migration of all NFT assets and the SHRAP token to GalaChain, a custom
              Layer-1 blockchain built by Gala Games for gaming and entertainment. GalaChain offers faster transaction
              finality, lower gas costs, and native integration with Gala's marketplace infrastructure. GALA serves as
              the gas token for all on-chain transactions. The architecture adds a cross-chain bridge between GalaChain
              and China's Trusted Copyright Chain (TCC), scheduled for Q1 2026, enabling compliant digital-asset
              movement. Anti-cheat and security measures are not publicly documented; the Steam store page does not list
              Easy Anti-Cheat or BattlEye integration, which is a gap for a competitive multiplayer title.
            claimRefs:
