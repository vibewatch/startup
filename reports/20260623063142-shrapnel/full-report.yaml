  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's addressable market must be defined across two overlapping but distinct taxonomies. The primary
              classification is the Web3 or blockchain gaming market: games that integrate blockchain technology,
              non-fungible tokens, cryptocurrency wallets, and decentralized asset ownership into their core loop. The
              secondary classification is the traditional first-person shooter and extraction-shooter genre on PC, where
              Shrapnel must compete for players against incumbents such as Escape from Tarkov, Hunt: Showdown, ARC
              Raiders, and mainstream franchises like Call of Duty. These two markets overlap only partially: most Web3
              gamers currently play casual or mobile titles rather than hardcore PC shooters, and most
              extraction-shooter players are skeptical of blockchain integration. The included spend for Shrapnel
              encompasses in-game NFT purchases, marketplace transaction fees, token-economy participation, and
              traditional game-monetisation streams. Excluded spend includes pure DeFi speculation unrelated to
              gameplay, hardware sales, and non-gaming blockchain activity. Adjacencies include the broader metaverse
              and virtual-world market, esports prize pools, and user-generated-content creator economies. The
              status-quo substitute for Shrapnel's target player is a free-to-play extraction shooter with no blockchain
              component, where digital items have no secondary-market resale value. Any realistic addressable-market
              estimate must therefore intersect the Web3 gaming TAM with the extraction-shooter player base and then
              layer China-specific regulatory access as a geographic multiplier.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM015
              - CM020
              - CM033
