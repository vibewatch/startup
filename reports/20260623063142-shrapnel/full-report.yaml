            body: >-
              Shrapnel's trust and quality posture is mixed. On the positive side, the development team comprises AAA
              veterans with shipped credits on Call of Duty, Halo, BioShock, and Ghost of Tsushima — providing credible
              technical competence. The game ships real builds, issues weekly patches, and maintains an active Steam
              Community presence. Neon Machine secured $37.5 million in funding to finance development. On the negative
              side, early-access reviews cite clunky controls, extraction crashes, inconsistent texture quality (some
              areas "rendered off the Nintendo 64"), and generic/repetitive sound design. The recoil and hit- detection
              overhauls introduced post-launch demonstrate responsiveness but also confirm that shipped builds had
              fundamental gunplay issues. No public smart-contract audit exists for the NFT or token contracts. No
              anti-cheat middleware (EAC, BattlEye, Vanguard) is disclosed. No public status page, SLA, or uptime
              commitment exists for multiplayer servers or marketplace. Privacy policy and data-handling documentation
              is limited to standard Steam terms. Regulatory compliance for the China bridge is asserted through the TCC
              partnership but no independent audit confirms adherence. The all-time Steam peak of 253 concurrent players
              — declining to single digits — is itself a quality signal: either the game is not retaining players due to
              polish gaps, the blockchain/NFT layer alienates mainstream gamers, or both.
