  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Shrapnel is a free-to-play extraction FPS whose monetization is entirely Web3-native. Revenue streams
              comprise four pillars: first, the Shrapnel Marketplace where players buy, sell, and trade NFT items
              (weapons, cosmetics, Operators, maps) with transaction fees payable in SHRAP; second, direct cosmetic and
              equipment NFT sales by the studio; third, token utility sinks where SHRAP is consumed for gameplay actions
              such as minting user-generated content and participating in seasonal events; and fourth, a China-market
              revenue-share mechanism in which GalaChain facilitates renminbi-settled item trading through the Trusted
              Copyright Chain, with resulting revenue used to repurchase SHRAP tokens. Industry-standard NFT marketplace
              platform fees typically range between 2% and 5% of each transaction, though Shrapnel has not publicly
              disclosed its exact fee schedule. Creator royalties on secondary sales — common in the NFT ecosystem at
              5–10% — may provide additional revenue share. No audited revenue figures have been disclosed, and no SEC
              Form D has been filed for Neon Machine, Inc. on EDGAR, leaving all revenue claims unverifiable through
              public filings.
