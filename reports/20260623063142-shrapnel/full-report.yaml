      - number: '2.3'
        title: Buyer and Player Segmentation
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's target user base segments into at least four distinct buyer personas with different
              motivations, budget ownership, and adoption triggers. First, hardcore PC extraction-shooter players who
              seek high-stakes PvPvE gameplay and own the hardware budget; their adoption trigger is gameplay quality,
              not blockchain features. Second, Web3 native digital-asset investors who view in-game NFTs as speculative
              assets; their budget is crypto-wallet capital and their trigger is token-economy upside and
              secondary-market liquidity. Third, user-generated-content creators who use Shrapnel's Moonshot tools to
              design and sell maps, skins, and items; their trigger is creator-economy revenue share. Fourth, Chinese
              gamers accessing Shrapnel through the Trusted Copyright Chain, whose budget comes from RMB-denominated
              marketplace transactions and whose trigger is regulatory availability of a Western AAA title with
              compliant digital-asset trading. The payer in all cases is the player directly, but the budget-owner
              distinction matters: hardcore shooter players spend on cosmetics from discretionary entertainment budgets,
              while crypto investors deploy speculative capital with different risk tolerance. Play-to-earn models blur
              this line, creating a fifth segment of low-income grinders whose sustainability depends on new capital
              inflows, a model widely criticised after the Axie Infinity collapse. Shrapnel's China-first expansion
              strategy prioritises the fourth segment given the 683 million addressable player base.
            claimRefs:
              - CM012
              - CM013
              - CM016
              - CM017
              - CM018
