companyProfile:
  summary: >-
    Shrapnel is the brand and game produced by Neon Machine, Inc., a Seattle game studio founded in 2014, with the
    Shrapnel project itself beginning in 2020. It is a free-to-play AAA first-person extraction shooter built in Unreal
    Engine 5, layering NFT asset ownership, the Avalanche-originated SHRAP token (since migrated to GalaChain), and the
    Moonshot user-generated-content toolset. Backed by Gala Games, Griffin Gaming Partners, and Polychain Capital, the
    company reported a $1.1 billion valuation on its August 2025 Series A. It is the first licensed Western Web3 game
    approved on China's government-backed Trusted Copyright Chain. The headline diligence tension is the roughly 1,000x
    gap between that private equity mark and the company's own ~$1.1M public SHRAP token market capitalization,
    compounded by near-zero live concurrent players and active litigation.
