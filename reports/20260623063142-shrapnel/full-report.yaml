      - number: '5.4'
        title: User-Generated Content and Moonshot Tools
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's Moonshot tools are an Unreal-Engine-based user-generated-content creation suite led by CTO Don
              Norbury. The toolset allows players and creators to design skins, maps, weapons, sound effects, and other
              assets which can then be minted as NFTs and traded on the marketplace. The economic promise is that
              creators retain true ownership and can monetize their work via the SHRAP token economy when other players
              acquire their creations. Moonshot is positioned as a core differentiator — transforming Shrapnel from a
              conventional shooter into a platform where the community generates and owns content. Technical details of
              the tooling (blueprint templates, plugins, mod SDK version) have not been published in any public
              technical documentation. The roadmap references expanded creator tools and modding competitions for 2026,
              but no concrete release schedule or feature list has been disclosed beyond marketing language. The
              practical maturity of the UGC pipeline cannot be verified externally: no community-created maps or items
              have been independently confirmed as live on the marketplace during Steam Early Access as of June 2026.
