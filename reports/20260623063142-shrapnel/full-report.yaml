      - number: '6.4'
        title: Retention, Durability, and Player Satisfaction
        blocks:
          - type: paragraph
            body: >-
              Retention data is catastrophic by any gaming-industry standard. From the March 2026 peak of 200 concurrent
              players, average concurrency fell 65% month-over-month in April, 74% in May, and 40% in June — leaving the
              game functionally unplayable due to matchmaking failures. No cohort retention data, DAU/MAU ratios, or
              session-length analytics have been disclosed by Neon Machine. Steam review sentiment provides a partial
              proxy: the overall 75/100 score masks a likely declining recent-review trend, with multiple reviews from
              May-June 2026 explicitly citing inability to find matches. Player satisfaction with core gameplay
              mechanics (gunplay, movement, visuals) appears moderate-to-positive based on review text analysis, but
              satisfaction is irrelevant when there are too few players to form a match. The Battle Pass system —
              launched with non-expiring, tradeable rewards — represents an attempt to drive retention through
              progression, but cannot overcome the fundamental population deficit. The NRR/GRR frameworks applicable to
              SaaS do not map cleanly to a free-to-play game, but the closest analogue — returning player percentage —
              is evidently near zero based on concurrent player data. No churn analytics, FTUE completion rates, or
              D1/D7/D30 retention figures are publicly available.
