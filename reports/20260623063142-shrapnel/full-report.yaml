            body: >-
              Comparing Shrapnel against both Web3 peers and traditional incumbents across key buying criteria reveals a
              mixed picture. On production quality, Shrapnel and Off The Grid both use Unreal Engine 5 and employ
              AAA-credentialed developers, putting them visually on par with traditional shooters. However, Shrapnel's
              actual player experience is limited — its Steam Early Access launched in March 2026 with a single Tokyo
              map and a Stockpile extraction mode, whereas ARC Raiders shipped with multiple biomes, progression
              systems, and 15 million copies worth of proven retention. On distribution, Shrapnel is available on Steam
              and Epic but blockchain features are gated; Off The Grid adds PlayStation and Xbox. Traditional titles
              dominate console distribution. On pricing, Shrapnel is free-to-play with optional NFT/token purchases;
              Escape from Tarkov charges $45-150 for editions; ARC Raiders uses a premium model at $40. The China TCC
              access gives Shrapnel a unique regulatory advantage unavailable to any competitor, though monetisation in
              China requires the revenue-repurchase mechanism through GalaChain. On user-generated content, Shrapnel's
              Moonshot tools are its strongest claimed differentiator — no other Web3 or traditional extraction shooter
              offers comparable creator infrastructure. However, this capability is unproven at scale, with no public
              data on creator adoption or content volume.
