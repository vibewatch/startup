  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Web3 Blockchain Game Competitors
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's closest direct competitor is Off The Grid by Gunzilla Games, a Web3 AAA battle-royale shooter
              built in Unreal Engine 5 on the Avalanche-based GUNZ blockchain. Gunzilla has raised over $100 million in
              total funding from investors including CoinFund, Avalanche's Blizzard Fund, Republic Capital, and Coinbase
              Ventures, significantly out-capitalising Shrapnel's reported $38 million. Off The Grid launched on PC,
              PS5, and Xbox in 2024 and reported 17.3 million wallets preparing for mainnet migration in 2025, with $13
              million in monthly marketplace trading volume and over 413,000 decoded NFT assets. Its dual-access model —
              traditional gameplay on Steam, blockchain features off-platform — mirrors Shrapnel's Web2/Web3 split but
              at greater distribution scale. Beyond Gunzilla, the broader Web3 gaming landscape is a cautionary tale.
              Illuvium (ILV), once valued near $1 billion at its token peak, trades at a market cap of approximately
              $27-35 million in June 2026 with undisclosed active player counts. Star Atlas (ATLAS), the Solana-based
              space MMO, sits at a market cap of roughly $3 million — down 99.96% from its all-time high — with reports
              of development halts and the Solana Foundation president declaring in March 2026 that gaming on blockchain
              is not coming back. Axie Infinity (AXS), the cautionary play-to-earn pioneer, collapsed from 2.8 million
              daily active users to approximately 99,000, with its token down 99% from peak to a market cap near $250
              million. Big Time (BIGTIME) maintains a modest $16-21 million market cap but discloses no player numbers.
              In aggregate, 93% of Web3 gaming projects launched since 2020 are now effectively dead, with $15 billion
              in capital destroyed across the sector.
            claimRefs:
