        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Neon Machine has raised more than $38 million in equity across multiple rounds culminating in a $19.5M
              Series A in August 2025 led by Gala Games at a reported $1.1 billion post-money valuation. Earlier capital
              includes an October 2023 round of approximately $20M led by Polychain Capital with participation from
              Griffin Gaming Partners. The $1.1B mark elevated Neon Machine to unicorn status per TechCrunch's 2025
              list, placing a AAA-aspiring blockchain game studio at a valuation comparable to mid-stage SaaS companies
              with proven revenue. Critically, the valuation was set by a single lead investor — Gala Games — which is
              simultaneously a strategic partner providing blockchain infrastructure (GalaChain) and China-market access
              via the Trusted Copyright Chain, raising questions about arm's-length pricing. No secondary transactions,
              public-market references, or independent valuation marks exist to corroborate the $1.1B figure. Total
              equity raised of ~$38M implies a ~28x ratio of valuation to cumulative funding, an aggressive multiple for
              a pre-revenue gaming studio. No SEC Form D filing exists on EDGAR for Neon Machine, Inc., an anomaly for a
              US-domiciled company raising at this scale. The funding structure includes two tranches within the Series
              A, suggesting milestone-based capital deployment, though tranche conditions are not public. Active
              litigation — Realm Metaverse Real Estate Inc. v. Neon Machine (SDNY 1:25-cv-10057) alleging securities
              fraud — and a prior bankruptcy of majority shareholder 4D Factory further complicate the cap-table picture
              and preference overhang.
