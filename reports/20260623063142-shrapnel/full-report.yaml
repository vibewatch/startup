  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Securities Risk
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's exposure to regulatory risk spans three jurisdictions and at least four distinct legal
              frameworks. In the United States, the SHRAP utility token and associated NFTs face residual securities-law
              risk under the Howey test despite the SEC's 2025 shift toward guidance-first enforcement under Chairman
              Atkins's "Project Crypto" framework. The SEC previously pursued NFT issuers — Impact Theory ($6.1M
              settlement, August 2023) and Stoner Cats ($1M penalty, September 2023) — for selling unregistered
              investment contracts where purchasers expected profits from the issuer's efforts. SHRAP's tokenomics
              include a revenue-share buyback mechanism (up to 10% of Chinese revenue used to repurchase SHRAP),
              secondary-market tradability, and a promotional history tied to game-value appreciation, all of which are
              factors a future enforcement action could cite under Howey's third and fourth prongs. Skadden's August
              2025 analysis confirms that while the SEC's enforcement posture has softened, "tokenized securities are
              still securities" and the Howey test remains controlling law in all federal circuits. In China, crypto
              trading and P2E remain strictly illegal under the 2026 multi-ministry framework; Shrapnel operates via the
              government-backed Trusted Copyright Chain (TCC) and NPPA licensing, a narrow compliance corridor that
              could collapse if policy reverses or the TCC loses official backing. Norton Rose Fulbright's 2026 analysis
              notes that the new Chinese framework "continues to uphold its stringent prohibition on cryptocurrencies"
              while permitting only RWA tokenisation under tight supervision — any slippage toward crypto-like mechanics
              risks immediate enforcement. In the EU, the forthcoming Digital Fairness Act specifically targets loot-box
              and randomised-item monetisation in games, with Belgium already criminalising paid loot boxes and the
              Netherlands pursuing enforcement. Shrapnel's NFT extraction mechanics, where players pay for randomised
              item containers and trade outputs on secondary markets, sit squarely in the regulatory crosshairs if the
              EU classifies such items as gambling or regulated financial instruments under MiCA. Game Growth Advisor's
              2026 compliance guide warns that loot-box regulations in the EU, UK, and Asia are "converging on the same
              set of requirements: disclose what's in the box, verify the age of the player, and don't obscure what's
              happening financially." Probability of regulatory enforcement remains medium in the near term due to the
              SEC's softer posture, but severity is high given that an adverse ruling could force token restructuring,
              geo-blocking, or operational cessation in a major market.
            claimRefs:
