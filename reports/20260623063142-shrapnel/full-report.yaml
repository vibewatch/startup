      - number: '7.3'
        title: Token and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              The SHRAP token has collapsed approximately 99.9% from its December 2023 all-time high of $0.44 to
              approximately $0.0003 in June 2026, yielding a fully diluted market capitalisation near $1.1 million
              against the company's reported $1.1 billion private equity valuation — a 1,000x divergence. This gap
              creates multiple compounding risks. First, token-treasury runway: if Neon Machine holds significant SHRAP
              reserves intended to fund operations, their dollar value has effectively evaporated. Second, liquidity and
              delisting risk: at current trading volumes and market cap, exchange listings become commercially unviable
              and removal from major exchanges would further erode token utility and investor confidence. Third, the
              buyback mechanism central to the China monetisation model (up to 10% of Chinese revenue used to repurchase
              SHRAP) is structurally weak: even substantial game revenue would move the token price negligibly given the
              current float dynamics, undermining the play-to-own value proposition that underpins player retention.
              YearBull's risk assessment rates SHRAP at "medium" overall risk with a "late cycle" market position,
              implying limited upside potential in the current crypto cycle. The broader Web3 gaming sector has
              experienced catastrophic attrition: more than 93% of blockchain games launched between 2021 and 2024 are
              now "effectively dead" according to multiple industry analyses, and over $15 billion in aggregate sector
              value has been destroyed. Shrapnel's survival depends on game quality outpacing token economics, but
              burn-rate data remains undisclosed, making it impossible to assess runway without management accounts.
            claimRefs:
