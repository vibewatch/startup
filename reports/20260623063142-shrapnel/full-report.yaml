        title: Customer Segmentation and Profile
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's addressable audience divides into four primary segments. First, crypto-native players and NFT
              holders who participated in the 2022-2023 Extraction Pack presales and Operator NFT drops — these early
              supporters formed the backbone of the pre-launch community and include roughly 31,100 on-chain token/NFT
              holders as tracked by AlphaGrowth. Second, traditional FPS and extraction-shooter players recruited
              through the free-to-play Steam Early Access launch in March 2026, attracted by gameplay quality rather
              than Web3 economics. Third, UGC creators drawn to the Moonshot tools for designing maps, skins, and
              weapons that can be minted as tradeable NFTs — a segment the studio positions as a long-term content
              supply engine. Fourth, speculators and traders participating in SHRAP token markets and the NFT
              marketplace without necessarily playing the game. The geographic split is currently Western-weighted but
              the China Early Access launch via GalaChain and the Trusted Copyright Chain targets an addressable market
              of nearly 700 million Chinese gamers. User and payer are not identical: the free-to-play model means most
              players are non-paying, while a smaller subset participates in NFT purchases, marketplace trading, and
              token-based transactions. The conversion funnel from social follower to registered account to active
              concurrent player narrows drastically, as demonstrated by the Steam data below.
