      - number: '6.2'
        title: Adoption Trajectory and Traction Metrics
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence spans three distinct phases. During the paid Early Access window on Epic Games Store in
              February 2024, Neon Machine reported over 3.7 million game sessions across approximately 27 days — players
              extracted 141 million Sigma, sold 384,000 items, and fired 37 million shots. These figures, sourced from
              the studio's own Intel page and the Chainwire fundraising announcement, represent the strongest
              quantitative traction signal available. However, the February 2024 period was paid access (Extraction
              Packs at ~$20-50), meaning the audience was self-selected and financially committed. The second phase is
              the free-to-play Steam Early Access launch on March 12, 2026. Steambase records an all-time peak of 200
              concurrent players on launch day, with an average of 40 concurrent players in March. By April this dropped
              to an average of 13, in May to 3, and in June 2026 the average sits at 2 with a peak of just 6.
              SteamCharts corroborates these figures, showing the game frequently at 0-2 players online. The third
              phase, China Early Access via GalaChain and the Trusted Copyright Chain beginning April 30, 2026, is too
              new to produce verifiable engagement data. The 27-day Epic metric and the Steam concurrent data cannot be
              reconciled without understanding that sessions ≠ concurrent players, paid ≠ free audiences, and the 2024
              window may have included bot/repeat session inflation — a common concern in Web3 gaming metrics. The decay
              from peak to near-zero within three months of Steam launch is the paramount adverse traction signal.
