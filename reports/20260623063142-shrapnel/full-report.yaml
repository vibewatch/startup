        title: Exhibits
        blocks:
          - type: callout
            title: Market-size estimates are irreconcilable
            body: >-
              Published Web3 gaming market estimates range from $28B to $40B for the same year, a 40% spread driven by
              definitional disagreement. No source isolates the Web3 extraction-shooter subgenre, making any
              Shrapnel-specific TAM an assumption stack.
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM034
          - type: callout
            title: China TCC is a genuine structural moat
            body: >-
              First-mover access to China's $49.8B gaming market through the government-sanctioned Trusted Copyright
              Chain is a hard-to-replicate competitive advantage, provided the regulatory framework remains stable and
              the RMB trading mechanics function as designed.
            calloutType: insight
            claimRefs:
              - CM012
              - CM020
              - CM024
          - type: callout
            title: Player skepticism is the binding constraint
            body: >-
              Mainstream FPS players are actively hostile to blockchain integration after years of low-quality Web3
              cash-grabs. Shrapnel must overcome this reputational deficit with gameplay quality before any market-size
              argument becomes relevant.
            calloutType: risk
            claimRefs:
