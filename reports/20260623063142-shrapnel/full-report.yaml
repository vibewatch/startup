      - number: '5.3'
        title: Blockchain Architecture and Token Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The SHRAP token was issued as an ERC-20 on Avalanche with a fixed maximum supply of 3 billion tokens,
              generated at a single Token Generation Event (TGE) in late 2023. Vesting contracts were deployed on the
              Avalanche C-Chain and locked pending subnet activation. The planned Shrapnel subnet was intended to serve
              as a dedicated Layer-1 for gameplay transactions, but the migration to GalaChain superseded the original
              subnet roadmap. On GalaChain, SHRAP remains the in-game currency for NFT purchases, marketplace
              transactions, UGC minting, and staking. Up to 10 percent of revenue generated from Chinese players will be
              used for periodic SHRAP buybacks. The GalaChain–TCC cross-chain bridge enables secure,
              regulation-compliant movement of digital assets between the global and Chinese ecosystems. All on-chain
              activities, including cross-border transfers, consume GALA as gas. NFT categories include Operators
              (playable characters), weapon skins, cosmetic items, and user-generated maps/content. The Shrapnel
              Marketplace provides listing, trading, crafting (Printer), and recycling (Recycle Depot) functions.
              Smart-contract security audits have not been publicly disclosed, which represents a material gap given
              that on-chain assets underpin the entire economic model.
