              The central contradiction in Shrapnel's valuation is the ~1,000x gap between the $1.1B private equity mark
              and the ~$1.1M SHRAP token market capitalization. SHRAP trades at approximately $0.0004 per token as of
              mid-June 2026, with a circulating supply of roughly 2.89 billion tokens (96% of the 3 billion maximum
              supply). The fully diluted valuation of the token is approximately $1.2M. The token reached an all-time
              high of approximately $0.44 in December 2023, representing a 99.9% decline to current levels. Daily
              trading volume is under $1,000, indicating near-zero liquidity. CoinCodex forecasts the token to end 2026
              at $0.000376, still bearish. DropsTab records a total fundraise of $57.6M including token-sale proceeds,
              with a current market cap of $630K. This disconnect can be interpreted several ways: the equity investors
              hold governance and IP rights beyond token economics; the token economy has structurally failed while the
              equity thesis rests on game-development IP; or the private mark is simply stale and inflated by a
              non-arm's-length transaction. In any reading, the public market assigns the SHRAP token economy near-zero
              value, directly contradicting the thesis that token-powered gameplay creates sustainable revenue. If the
              token is the economic backbone of the platform as described in company materials, its collapse undermines
