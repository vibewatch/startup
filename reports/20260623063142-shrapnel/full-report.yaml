      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The Web3 gaming market is propelled by several structural drivers: the growing adoption of cryptocurrency
              wallets among gamers, rising demand for true digital-asset ownership, the expansion of play-to-earn and
              creator-economy models, investment momentum with $1.1 billion deployed into blockchain gaming in Q2 2024
              alone, Asia-Pacific regional growth led by China and Southeast Asia, and the maturation of Layer-2 scaling
              solutions that reduce transaction costs. Shrapnel-specific drivers include the China TCC bridge providing
              compliant access to a $49.8 billion gaming market with nearly 700 million players, and the
              extraction-shooter genre's dominance of PC playtime as evidenced by Escape from Tarkov capturing 1.7
              percent of global PC playtime share in 2025. Against these sit material constraints. Regulatory risk is
              paramount: China bans general cryptocurrency and pay-to-earn models except through the narrow TCC
              framework, while the US SEC may classify certain game tokens or NFTs as securities under the Howey test.
              Crypto and NFT market volatility destabilises in-game economies. Player skepticism of NFT integration is
              documented and widespread, driven by past rug-pulls, pay-to-win perceptions, and the Axie Infinity
              economic collapse. The play-to-earn model's sustainability depends on continuous new-player inflows,
              creating Ponzi-like dynamics when growth stalls. Switching costs from established extraction shooters are
              low in theory but high in practice because genre players have invested hundreds of hours into progression
              systems. Trust remains the single largest barrier: Web3 games must overcome a reputational deficit created
              by years of low-quality cash-grab projects before mainstream FPS players will adopt blockchain mechanics.
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM024
