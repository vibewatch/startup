      - number: '6.3'
        title: Named Customer Proof and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Unlike enterprise SaaS companies, a free-to-play game lacks named customer contracts. However, verifiable
              proof of real users exists through Steam reviews, community engagement, and on-chain data. Steam shows 762
              reviews with a 75/100 Mostly Positive score, indicating real humans played and reviewed the game. However,
              negative recent reviews cite matchmaking timeouts exceeding 20 minutes and describe the game as a "ghost
              town" — players physically cannot find matches due to population collapse. The Player Council initiative,
              documented by Outposts.io, selected community members to provide direct feedback to the development team —
              evidence of an engaged core, albeit a tiny one. On-chain, AlphaGrowth tracks over 31,100 SHRAP token
              holders, though holding a token does not equate to active gameplay. Discord membership stands at
              approximately 65,000, and X followers at roughly 403,000 — but social metrics are notoriously poor proxies
              for active players in gaming. The central proof problem is that no independent source confirms more than
              200 humans simultaneously playing the game at any point since the Steam launch. The 3.7M sessions figure
              from 2024 is company-reported with no third-party verification methodology disclosed.
