      - number: '2.2'
        title: Market Sizing and Estimate Range
        blocks:
          - type: paragraph
            body: >-
              Published market estimates for Web3 gaming diverge significantly depending on scope and methodology. The
              Business Research Company, via Research and Markets and GII Research, sizes the Web3 gaming market at
              $39.65 billion in 2025 growing to $48.55 billion in 2026 at a CAGR of 22.4 percent, projecting $108
              billion by 2030. Straits Research values the same market at only $28.31 billion in 2025 with an 18.1
              percent CAGR to $117 billion by 2034. Future Market Insights estimates $33.7 billion in 2025 and $39.9
              billion in 2026 at 18.5 percent CAGR. Precedence Research sizes the market at $37.55 billion in 2025 with
              a 19.24 percent CAGR. Business Research Insights projects $44.54 billion in 2026. These differences stem
              from varying definitions of what counts as Web3 gaming revenue versus broader blockchain ecosystem
              revenue. A narrower blockchain-gaming-only taxonomy from The Business Research Company yields only $11.22
              billion in 2025 growing to $17.82 billion in 2026 at a much higher 58.8 percent CAGR. The broader
              shooter-games market is $82.02 billion in 2025 per Fortune Business Insights, while the
              first-person-shooter slice is $27.53 billion growing to $30.15 billion in 2026. Shrapnel's realistic
              serviceable addressable market is the intersection of Web3 gaming infrastructure users who play PC
              extraction shooters, which is a small fraction of either headline figure. We preserve the full range of
              contradictory estimates and note that no single source provides a bottom-up sizing for Web3 extraction
              shooters specifically.
