      - number: '7.4'
        title: Operational, Technology, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's technology stack introduces material operational risk through its dependence on custom
              blockchain infrastructure (GalaChain), cross-chain bridge mechanics, and smart-contract-governed asset
              ownership. The OWASP Smart Contract Top 10 for 2025 identifies access-control vulnerabilities and
              business-logic flaws as the two highest-severity categories, collectively responsible for the majority of
              DeFi losses exceeding $1.42 billion in 2024 alone. In 2026, cross-chain bridge exploits have surpassed
              $2.8 billion in cumulative losses, with the Kelp DAO ($292M) and Drift Protocol ($285M) incidents
              demonstrating that bridge architecture remains structurally fragile. Shrapnel's GalaChain-to-TCC bridge
              for China operations, and any future cross-chain integrations, inherit this systemic vulnerability class.
              GalaChain itself is a relatively young, permissioned Layer-1 blockchain without the battle-testing of
              Ethereum or Solana mainnet; a chain-level outage or exploit would halt all in-game transactions,
              marketplace activity, and NFT transfers simultaneously. Operationally, the studio demonstrates execution
              risk through repeated launch delays: the game was originally positioned for a 2023 full launch, shifted to
              paid early access in February 2024, then to Steam Early Access in March 2026, with full free-to-play still
              pending. The Steam Early Access launch attracted a peak of only approximately 255 concurrent players,
              decaying to single-digit concurrency within months — suggesting either a product-market fit problem or
              insufficient marketing investment. Quality risk is further evidenced by mixed Steam reviews citing
              performance issues, bugs, and thin content. The NFT marketplace and in-game economy add attack surface
              beyond the game client: smart-contract exploits could drain player assets, marketplace manipulation could
              destroy trust, and wallet-drainer phishing campaigns targeting Web3 gamers are an industry-wide threat
              vector that Shrapnel has not publicly addressed through bug-bounty or audit disclosures.
            claimRefs:
