            body: >-
              Bull case (~10% probability): Shrapnel achieves mainstream adoption with 100K+ concurrent players, the
              China TCC bridge generates material revenue, marketplace volume drives sustainable fees, and SHRAP token
              recovers to $0.01–$0.05, supporting a $30M–$150M FDV that partially justifies the equity mark via token
              treasury appreciation. Implied valuation: $300M–$800M equity value if game reaches top-10 Web3 title
              status. Key assumptions: UE5 quality attracts traditional gamers, China regulatory framework holds, UGC
              ecosystem produces viral content. Base case (~50% probability): The game survives in niche status with
              5K–20K concurrent players, token remains depressed at $0.0001–$0.001, China revenue is immaterial in year
              one, and the studio requires additional funding at a significant down-round. Implied valuation:
              $50M–$150M, representing a 70–95% haircut from the reported $1.1B. Key assumptions: product quality is
              adequate but insufficient to overcome Web3 gaming stigma; Gala continues strategic support. Bear case
              (~40% probability): Player population remains ghost-town level, token goes to zero or exchanges delist,
              litigation results in adverse judgment, studio runs out of capital and shuts down or sells IP. Implied
              valuation: $0–$30M (recovery value of IP and tools). Key assumptions: Web3 gaming continues secular
              decline, China market entry fails or is revoked, Gala Games itself faces financial distress. The
              probability-weighted expected value is approximately $55M–$120M, an 89–95% discount to the reported $1.1B
