chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage and Business Model
        blocks:
          - type: paragraph
            body: >-
              Shrapnel is the consumer brand and game; the legal operating entity is Neon Machine, Inc., a Seattle,
              Washington game studio. Neon Machine was founded in 2014, but the Shrapnel project itself began in 2020
              with the stated ambition of a "blockbuster-quality" extraction shooter whose players own and trade their
              creations. The product is a free-to-play, team-based first-person shooter built in Unreal Engine 5 and set
              in a post-apocalyptic "Sacrifice Zone" where Operators collect and extract a resource called Sigma. The
              business model is Web3-native: in-game gear, skins and player-designed items are tokenised as NFTs, and a
              Layer-1 utility token, SHRAP, underpins the economy alongside an in-game marketplace and the studio's
              "Moonshot" suite of Web3 game-development and user-generated-content tools. Monetisation is intended to
              come from item sales, marketplace fees, token utility and, in China, a revenue-share repurchase of SHRAP.
              As of the run date the company is a venture-backed private firm at roughly Series A stage, transitioning
              from paid early access into a broader free-to-play launch and a regulated China entry.
