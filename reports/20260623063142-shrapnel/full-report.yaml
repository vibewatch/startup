      - number: '6.5'
        title: Expansion, Concentration, and Channel Risk
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's expansion thesis rests on three pillars: China market entry, UGC-driven content loops, and
              traditional free-to-play growth mechanics (Battle Pass, seasonal events, new Operators). The China
              opportunity via the Trusted Copyright Chain is structurally significant — the first licensed Western Web3
              game in a $49 billion market — but carries acute execution risk. No China concurrent player data or
              marketplace transaction volumes have been disclosed as of the run date, despite the April 30 launch being
              nearly two months prior. Concentration risk is extreme: the entire distribution and China-access strategy
              depends on GalaChain and Gala Games, which also led the Series A. If Gala Games experiences financial
              distress or regulatory action, both the capital structure and the China revenue channel collapse
              simultaneously. Steam is the sole Western distribution platform; Epic Games Store is no longer active for
              Shrapnel. The UGC creator community represents a potential flywheel — player-created content could address
              the content drought that plagued early Web3 games — but creator tools are not yet fully deployed and the
              addressable creator population requires an active player base that does not currently exist. Marketing
              channel dependence favors crypto-native outlets over mainstream gaming media, further limiting reach to
              traditional FPS audiences who represent the larger addressable segment.
