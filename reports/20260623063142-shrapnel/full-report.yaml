      - number: '1.3'
        title: Funding, Investors and Valuation
        blocks:
          - type: paragraph
            body: >-
              Neon Machine has raised more than $38 million to date according to PitchBook data cited by TechCrunch,
              from investors including Gala Games, Griffin Gaming Partners and Polychain Capital. The studio announced a
              $20 million round led by Polychain in October 2023, and in August 2025 disclosed a $19.5 million Series A
              raised across two tranches, the most recent led by Gala Games with participation from Griffin Gaming
              Partners and Polychain Capital. That round carried a reported $1.1 billion valuation, placing Shrapnel on
              TechCrunch's 2025 unicorn list. A separate strategic round disclosed in late 2024 was described as led by
              the Blizzard Avalanche Ecosystem Fund. The valuation is striking against the backdrop of the publicly
              traded SHRAP token, whose market capitalisation sat near $1.1 million in mid-2026 — roughly 99% below its
              December 2023 all-time high — underscoring a wide gap between the private equity mark and the on-chain
              market's assessment of the ecosystem. Investor relationships are also entangled with litigation, including
              GPC3 I, LLC's breach-of-contract claims over a token purchase agreement.
