      - number: '3.2'
        title: Traditional Extraction Shooter Incumbents
        blocks:
          - type: paragraph
            body: >-
              The extraction-shooter genre that Shrapnel targets is dominated by traditional Web2 titles with player
              bases orders of magnitude larger. Escape from Tarkov, the genre originator by Battlestate Games, maintains
              12,000-24,000 concurrent players on Steam alone (with additional players on its proprietary launcher),
              reaching peaks above 47,000 and estimated monthly actives above 900,000 during major wipes. ARC Raiders by
              Embark Studios is the genre's 2025-2026 breakout success, with a peak of approximately 960,000 concurrent
              players across all platforms, over 14 million copies sold, and stabilised Steam concurrents of
              85,000-105,000 — making it roughly 400 times larger than Shrapnel's peak concurrent figure. Delta Force by
              TiMi Studio Group (Tencent) is reported to outperform even ARC Raiders in concurrency, establishing itself
              as the genre king with massive cross-platform engagement. Hunt: Showdown by Crytek is the genre's elder
              statesman, with a peak near 60,000 concurrent and a loyal but smaller stable base. Call of Duty: Warzone
              and its DMZ mode leverage the largest FPS franchise in the world, with hundreds of millions of registered
              accounts across the Activision ecosystem. These incumbents share a critical advantage: none require
              players to interact with tokens, wallets, or blockchain concepts, removing the friction that has
              historically caused Web3 game abandonment.
