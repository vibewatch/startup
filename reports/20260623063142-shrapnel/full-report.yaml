      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's claimed competitive moats are four: AAA production quality via Unreal Engine 5, the Moonshot
              UGC creator toolkit, the SHRAP token economy, and first-mover access to China's Trusted Copyright Chain.
              Each carries material durability questions. The UE5 moat is now table-stakes — both Off The Grid and
              multiple traditional titles use the same engine, so graphical fidelity alone is not defensible. The
              Moonshot toolkit is the most novel asset, but its value depends entirely on whether a critical mass of
              creators adopts it, which is undemonstrated at present. The SHRAP token, trading at approximately $0.0008
              with a market cap near $1.1 million (99% below ATH), represents a potential liability rather than a moat:
              it mirrors the collapse pattern of every other Web3 gaming token, and the gap between the token's public
              market assessment and the studio's $1.1 billion private valuation is the central credibility question. The
              China TCC access is genuinely scarce — no other Western Web3 game has achieved it — but its commercial
              value depends on converting regulated access into paying players, which remains unproven. Displacement
              risks include: ARC Raiders and Delta Force proving that extraction shooters can achieve massive scale
              without blockchain; the Web3 gaming sector's 93% mortality rate eroding investor and player confidence;
              and Off The Grid directly competing for the same Web3-shooter audience with greater capital and
              distribution reach.
