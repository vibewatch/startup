            body: >-
              The SHRAP token is the economic backbone of the Shrapnel ecosystem, operating on Avalanche with a fixed
              maximum supply of 3,000,000,000 tokens. Token generation occurred in late 2023, and by June 2026
              approximately 2.89 billion SHRAP are in circulation — roughly 96% of max supply. Allocation at TGE divided
              tokens among Community Rewards (~27%), Team and Advisors (~27% or 810M SHRAP with a 47-month cliff then
              linear vest), Seed investors (~20% or 600M, now fully unlocked), Strategic investors (~7% or 210M, ~79%
              unlocked by June 2026), and Ecosystem/Liquidity reserves (~19%). The token reached an all-time high of
              approximately $0.44 in December 2023 shortly after TGE, buoyed by speculative demand. Since then, SHRAP
              has declined approximately 99.9% to ~$0.0004 by mid-June 2026, with a market capitalization of roughly
              $1.1M and daily trading volume under $1,000. CryptoSlate records the all-time low at $0.00031 on June 9,
              2026. This collapse — occurring while the private equity valuation was marked at $1.1B in August 2025 —
              creates a gap of roughly 1,000x between the private mark and the public market's assessment of the token
              economy, representing the central adverse financial signal in this diligence.
