  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Core Gameplay
        blocks:
          - type: paragraph
            body: >-
              Shrapnel is a free-to-play, team-based first-person extraction shooter set in a fictional post-apocalyptic
              "Sacrifice Zone" created when asteroid 38 Sigma struck the moon in 2038, bombarding Earth with meteorites.
              Players deploy as elite Operators into hostile zones to locate, collect, and extract a volatile resource
              called Sigma before a rival squad can do the same. The primary launch mode, Stockpile, is a 4v4
              objective-based competitive format where each team races to deposit 300 grav-kilos of Sigma. The core loop
              combines resource gathering, squad-based firefights, dynamic meteor-shower hazards, and extraction
              tension. True digital ownership of in-game assets — Operators, weapon skins, cosmetics — is tokenised as
              NFTs on GalaChain and tradeable on the Shrapnel Marketplace. Operators can be leveled to unlock perks that
              customise playstyle. The Printer crafts mystery rewards from collected items, and the Recycle Depot
              transforms multiple items into new ones. Shrapnel's business model is entirely Web3-native: SHRAP token
              utility sinks, marketplace fees, and a China revenue-share mechanism via the Trusted Copyright Chain
              constitute the monetisation pillars. The game targets PC first (Windows) with Early Access on Steam; no
              console version has been announced.
            claimRefs:
              - CE001
