              infrastructure platform with 680+ games onboarded, carries a market cap of $112M and FDV of $265M. Gala
              Games (GALA), Shrapnel's own lead investor, has a market cap of $119M and FDV of $119M on 48B circulating
              tokens — implying Gala itself is valued below the mark it assigned to its portfolio company. Big Time
              (BIGTIME) trades at $15M market cap with a live AAA-quality game. Star Atlas (ATLAS), another ambitious
              space MMO with blockchain, sits at $2.9M market cap — effectively dead. Illuvium (ILV), a AAA blockchain
              RPG, carries a $26M market cap. On the private side, Gunzilla Games (Off The Grid) has raised $76–120M
              cumulatively but its valuation is undisclosed; it has an actual live game on Steam with meaningful player
              counts. In every case, even the most successful Web3 gaming projects carry public valuations of $15M–$279M
              — one to two orders of magnitude below Shrapnel's $1.1B mark. The valuation premium appears to rely
              entirely on the China-market optionality via the GalaChain-TCC bridge and the assumption of AAA gameplay
