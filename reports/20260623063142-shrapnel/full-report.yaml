      - number: '7.5'
        title: Partner, Dependency, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Shrapnel exhibits critical single-partner concentration risk through its relationship with Gala Games,
              which simultaneously serves as lead equity investor (Series A), blockchain infrastructure provider
              (GalaChain), China market-access enabler (TCC bridge), and token-economy counterparty (GALA as gas token).
              A failure, dispute, or regulatory action against Gala Games would simultaneously impair Shrapnel's
              financing, technology stack, market access, and token economy — a correlation of risks rarely seen outside
              of vertically integrated conglomerates. Beyond Gala, the China market entry depends on Lingjing Game Labs
              (a People's Daily digital subsidiary) for local distribution and NPPA compliance; this relationship
              introduces geopolitical and partner- execution risk that Neon Machine cannot directly control. Leadership
              turnover compounds execution risk: founder and former CEO Mark Long departed in 2025 following the
              governance dispute, leaving CEO Ken Rosman — who joined specifically for the launch phase — as the key
              person. The studio has disclosed no succession plan, no named CFO, and limited public information about
              the depth of its engineering or product leadership bench. The broader competitive environment has
              intensified: Gunzilla Games' Off The Grid launched on Steam in July 2025 with substantially higher player
              counts, and the extraction-shooter genre is now crowded with well-funded entrants including Arc Raiders
              and traditional franchises adding extraction modes. The combination of single-partner dependency, thin
              leadership bench, competitive pressure, and a collapsed token price creates a scenario where any single
              point of failure could cascade into existential risk for the studio.
