evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount and financials
    missingEvidence: Employee headcount, revenue, run-rate and burn figures for Neon Machine.
    whyItMatters: Without scale and financial data, the $1.1B valuation cannot be tied to operating fundamentals.
    diligencePath: Request management accounts, an org chart and a headcount roster under NDA.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: minor
    topic: current stage and launch readiness
    missingEvidence: An authoritative, dated statement of full (non-early-access) launch status and live-service readiness.
    whyItMatters: Launch readiness affects revenue timing and the durability of the valuation.
    diligencePath: Obtain the studio's live roadmap and post-launch retention data.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: Stakeholder or Investor Map cap table
    missingEvidence: Ownership percentages, preference stack and board composition.
    whyItMatters: Preference and control terms drive downside protection and governance risk.
    diligencePath: Obtain the cap table and shareholder agreements; confirm post-settlement equity.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Web3 extraction-shooter TAM
    missingEvidence: >-
      A published bottom-up TAM estimate for the intersection of Web3/blockchain gaming and the PC extraction-shooter
      subgenre.
    whyItMatters: >-
      Without a genre-specific serviceable market figure, any revenue projection for Shrapnel relies on assumption
      stacks about crypto-wallet adoption among hardcore PC gamers.
    diligencePath: >-
      Commission primary research surveying PC extraction-shooter players on Web3 willingness-to-pay and wallet
      adoption, or obtain Shrapnel's internal SAM model.
    relatedQuestionRefs:
      - QM007
      - QM021
  - type: conflicting-data
    severity: material
    topic: Web3 gaming market size disagreement
    missingEvidence: >-
      Reconciliation of the 40% spread between Straits Research ($28.31B) and TBRC/R&M ($39.65B) for the 2025 Web3
      gaming market.
    whyItMatters: The wide range makes any market-share claim or valuation multiple derived from TAM unreliable.
    diligencePath: >-
      Obtain methodology notes from at least two firms to identify definitional boundaries (e.g., does the scope include
      non-gaming blockchain activity, mobile-casual, or crypto-speculation platforms).
    relatedQuestionRefs:
      - QM026
  - type: missing-source
    severity: minor
    topic: China TCC addressable share
    missingEvidence: >-
      The proportion of China's $49.8B gaming market that is addressable by a single Western Web3 FPS through the TCC
      framework.
    whyItMatters: >-
      The headline figure of $49.8B and 683M players vastly overstates the realistic market for one compliant foreign
      title.
    diligencePath: Obtain TCC registered-title data and early Shrapnel China metrics (installs, DAU, marketplace volume) under NDA.
    relatedQuestionRefs:
      - QM021
  - topic: Shrapnel Moonshot UGC creator adoption metrics
    description: >-
      No public data exists on the number of active creators using Moonshot tools, volume of user-generated content
      produced, or creator retention rates. This is critical to validating the claimed UGC moat.
    impact: high
    suggestedResolution: Request management data on creator MAU, content submissions, and marketplace transaction volume from Neon Machine.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - topic: Off The Grid exact concurrent player count and retention data
    description: >-
      While Gunzilla reports 17.3 million wallets, actual concurrent player counts and retention metrics are not
      publicly disclosed for Off The Grid.
    impact: medium
    suggestedResolution: >-
      Monitor Steam Charts after full PC launch; request internal DAU/MAU from Gunzilla if available through investor
      channels.
    relatedQuestionRefs:
      - QP003
  - topic: Shrapnel China TCC revenue and player engagement
    description: >-
      Despite achieving China TCC access in April 2026, no public data exists on Chinese player counts, engagement, or
      revenue generated through the GalaChain-TCC bridge.
    impact: high
    suggestedResolution: >-
      Request China-specific DAU, session metrics, and revenue data from Neon Machine management; verify NPPA compliance
      renewal.
    relatedQuestionRefs:
      - QP017
  - topic: Audited financials and revenue figures
    description: >-
      No audited P&L, balance sheet, or revenue disclosure exists for Neon Machine. All financial underwriting requires
      private data room access.
    severity: high
    relatedQuestionRefs:
      - QI012
      - QI020
      - QI021
    relatedTableRefs:
      - TI003
  - topic: Capital adequacy table partial coverage
    description: >-
      Cash on hand, burn rate, runway, and debt obligations are null in the Capital Adequacy Table due to complete
      non-disclosure by the company.
    severity: high
    relatedQuestionRefs:
      - QI011
      - QI012
    relatedTableRefs:
      - TI004
  - topic: Unit economics table null fields
    description: >-
      CAC, LTV, ARPU, gross margin, and token burn per session are all unavailable. Each requires management accounts or
      internal analytics access.
    severity: high
    relatedQuestionRefs:
      - QI020
      - QI021
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: ugc-maturity
    missingEvidence: Confirmation of live community-created NFTs on the Shrapnel Marketplace and Moonshot SDK documentation
    whyItMatters: >-
      The UGC platform thesis is the primary differentiation claim; without evidence of creator adoption it remains
      aspirational
    diligencePath: Request Moonshot SDK access documentation and marketplace analytics showing community-minted NFT counts
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: smart-contract-security
    missingEvidence: Public smart-contract audit report for SHRAP token and NFT contracts
    whyItMatters: On-chain assets underpin the entire economic model; unaudited contracts carry exploit risk
    diligencePath: Request name of audit firm, scope, and published report URL
    relatedQuestionRefs:
      - QE016
  - type: missing-source
    severity: minor
    topic: server-reliability
    missingEvidence: Public status page, uptime metrics, or SLA for multiplayer servers
    whyItMatters: Competitive multiplayer requires reliable infrastructure; no public commitment exists
    diligencePath: Request server uptime data and incident response documentation
    relatedQuestionRefs:
      - QE026
  - topic: UGC creator community metrics
    description: No public data on number of active creators, content submissions, or per-creator revenue from Moonshot tools.
    severity: medium
    relatedQuestionRefs:
      - QU006
  - topic: China Early Access engagement data
    description: >-
      Despite launching April 30 2026, no concurrent player counts, DAU, transaction volumes, or marketplace activity
      for China have been disclosed.
    severity: high
    relatedQuestionRefs:
      - QU007
  - topic: Internal retention and engagement analytics
    description: >-
      Neon Machine has not disclosed D1/D7/D30 retention, session length, FTUE completion, or DAU/MAU ratios for any
      platform.
    severity: high
    relatedQuestionRefs:
      - QU014
  - topic: Conversion funnel from registered accounts to active players
    description: The 130K+ registered accounts figure cannot be reconciled with peak 200 concurrent without internal funnel data.
    severity: high
    relatedQuestionRefs:
      - QU021
  - topic: Smart-contract audit and bug-bounty programme disclosure
    description: >-
      No public audit reports or bug-bounty programmes have been disclosed for Shrapnel's GalaChain contracts or
      marketplace smart contracts.
    impact: Cannot independently assess smart-contract security posture.
    diligencePath: Request audit reports from Neon Machine management; verify scope covers bridge, marketplace, and token contracts.
    relatedQuestionRefs:
