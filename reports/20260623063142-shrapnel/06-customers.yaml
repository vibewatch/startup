company:
  name: "Shrapnel"
chapter:
  number: 6
  title: "Customers"
  summary: "Shrapnel's customer base reveals a stark contradiction: large social-media followings (~403K X followers, ~65K Discord members) and strong early-access session metrics (3.7M sessions in 27 days on Epic in 2024) coexist with critically low live concurrent players on Steam — peaking at ~200 in March 2026 and decaying to single digits by June 2026. The gap between registered/social audiences and active gameplay engagement is the central traction red flag. China Early Access via the Trusted Copyright Chain (April 2026) theoretically opens ~700M players but remains entirely unproven at the run date."
sections:
  - id: "segmentation"
    title: "Customer Segmentation and Profile"
    body: >-
      Shrapnel's addressable audience divides into four primary segments. First, crypto-native players and
      NFT holders who participated in the 2022-2023 Extraction Pack presales and Operator NFT drops —
      these early supporters formed the backbone of the pre-launch community and include roughly 31,100
      on-chain token/NFT holders as tracked by AlphaGrowth. Second, traditional FPS and extraction-shooter
      players recruited through the free-to-play Steam Early Access launch in March 2026, attracted by
      gameplay quality rather than Web3 economics. Third, UGC creators drawn to the Moonshot tools for
      designing maps, skins, and weapons that can be minted as tradeable NFTs — a segment the studio
      positions as a long-term content supply engine. Fourth, speculators and traders participating in
      SHRAP token markets and the NFT marketplace without necessarily playing the game. The geographic
      split is currently Western-weighted but the China Early Access launch via GalaChain and the Trusted
      Copyright Chain targets an addressable market of nearly 700 million Chinese gamers. User and payer
      are not identical: the free-to-play model means most players are non-paying, while a smaller
      subset participates in NFT purchases, marketplace trading, and token-based transactions. The
      conversion funnel from social follower to registered account to active concurrent player narrows
      drastically, as demonstrated by the Steam data below.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU030"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-trajectory"
    title: "Adoption Trajectory and Traction Metrics"
    body: >-
      Adoption evidence spans three distinct phases. During the paid Early Access window on Epic Games
      Store in February 2024, Neon Machine reported over 3.7 million game sessions across approximately
      27 days — players extracted 141 million Sigma, sold 384,000 items, and fired 37 million shots.
      These figures, sourced from the studio's own Intel page and the Chainwire fundraising announcement,
      represent the strongest quantitative traction signal available. However, the February 2024 period
      was paid access (Extraction Packs at ~$20-50), meaning the audience was self-selected and
      financially committed. The second phase is the free-to-play Steam Early Access launch on March 12,
      2026. Steambase records an all-time peak of 200 concurrent players on launch day, with an average
      of 40 concurrent players in March. By April this dropped to an average of 13, in May to 3, and
      in June 2026 the average sits at 2 with a peak of just 6. SteamCharts corroborates these figures,
      showing the game frequently at 0-2 players online. The third phase, China Early Access via
      GalaChain and the Trusted Copyright Chain beginning April 30, 2026, is too new to produce
      verifiable engagement data. The 27-day Epic metric and the Steam concurrent data cannot be
      reconciled without understanding that sessions ≠ concurrent players, paid ≠ free audiences, and
      the 2024 window may have included bot/repeat session inflation — a common concern in Web3 gaming
      metrics. The decay from peak to near-zero within three months of Steam launch is the paramount
      adverse traction signal.
    claimRefs: ["CU007", "CU008", "CU009", "CU010", "CU011", "CU012", "CU013", "CU031", "CU032"]
    tableRefs: ["TU002"]
    figureRefs: ["FU002"]
  - id: "customer-proof"
    title: "Named Customer Proof and Evidence Quality"
    body: >-
      Unlike enterprise SaaS companies, a free-to-play game lacks named customer contracts. However,
      verifiable proof of real users exists through Steam reviews, community engagement, and on-chain
      data. Steam shows 762 reviews with a 75/100 Mostly Positive score, indicating real humans played
      and reviewed the game. However, negative recent reviews cite matchmaking timeouts exceeding 20
      minutes and describe the game as a "ghost town" — players physically cannot find matches due to
      population collapse. The Player Council initiative, documented by Outposts.io, selected community
      members to provide direct feedback to the development team — evidence of an engaged core, albeit
      a tiny one. On-chain, AlphaGrowth tracks over 31,100 SHRAP token holders, though holding a token
      does not equate to active gameplay. Discord membership stands at approximately 65,000, and X
      followers at roughly 403,000 — but social metrics are notoriously poor proxies for active players
      in gaming. The central proof problem is that no independent source confirms more than 200 humans
      simultaneously playing the game at any point since the Steam launch. The 3.7M sessions figure from
      2024 is company-reported with no third-party verification methodology disclosed.
    claimRefs: ["CU014", "CU015", "CU016", "CU017", "CU018", "CU019", "CU020", "CU033"]
    tableRefs: ["TU003"]
    figureRefs: ["FU003"]
  - id: "retention-satisfaction"
    title: "Retention, Durability, and Player Satisfaction"
    body: >-
      Retention data is catastrophic by any gaming-industry standard. From the March 2026 peak of 200
      concurrent players, average concurrency fell 65% month-over-month in April, 74% in May, and 40%
      in June — leaving the game functionally unplayable due to matchmaking failures. No cohort retention
      data, DAU/MAU ratios, or session-length analytics have been disclosed by Neon Machine. Steam
      review sentiment provides a partial proxy: the overall 75/100 score masks a likely declining
      recent-review trend, with multiple reviews from May-June 2026 explicitly citing inability to find
      matches. Player satisfaction with core gameplay mechanics (gunplay, movement, visuals) appears
      moderate-to-positive based on review text analysis, but satisfaction is irrelevant when there are
      too few players to form a match. The Battle Pass system — launched with non-expiring, tradeable
      rewards — represents an attempt to drive retention through progression, but cannot overcome the
      fundamental population deficit. The NRR/GRR frameworks applicable to SaaS do not map cleanly
      to a free-to-play game, but the closest analogue — returning player percentage — is evidently
      near zero based on concurrent player data. No churn analytics, FTUE completion rates, or D1/D7/D30
      retention figures are publicly available.
    claimRefs: ["CU021", "CU022", "CU023", "CU024", "CU025", "CU034", "CU035"]
    tableRefs: ["TU004"]
    figureRefs: ["FU004"]
  - id: "expansion-concentration"
    title: "Expansion, Concentration, and Channel Risk"
    body: >-
      Shrapnel's expansion thesis rests on three pillars: China market entry, UGC-driven content loops,
      and traditional free-to-play growth mechanics (Battle Pass, seasonal events, new Operators). The
      China opportunity via the Trusted Copyright Chain is structurally significant — the first licensed
      Western Web3 game in a $49 billion market — but carries acute execution risk. No China concurrent
      player data or marketplace transaction volumes have been disclosed as of the run date, despite
      the April 30 launch being nearly two months prior. Concentration risk is extreme: the entire
      distribution and China-access strategy depends on GalaChain and Gala Games, which also led the
      Series A. If Gala Games experiences financial distress or regulatory action, both the capital
      structure and the China revenue channel collapse simultaneously. Steam is the sole Western
      distribution platform; Epic Games Store is no longer active for Shrapnel. The UGC creator
      community represents a potential flywheel — player-created content could address the content
      drought that plagued early Web3 games — but creator tools are not yet fully deployed and the
      addressable creator population requires an active player base that does not currently exist.
      Marketing channel dependence favors crypto-native outlets over mainstream gaming media, further
      limiting reach to traditional FPS audiences who represent the larger addressable segment.
    claimRefs: ["CU026", "CU027", "CU028", "CU029", "CU036", "CU037", "CU038"]
    tableRefs: ["TU005"]
