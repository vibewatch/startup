company:
  name: "Shrapnel"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Shrapnel is the blockchain extraction first-person shooter built by Seattle studio Neon Machine, Inc., which reached a reported $1.1 billion valuation in August 2025 on a $19.5M Series A led by Gala Games against roughly $38M raised in total. The identity is credible on paper but shadowed by a settled founder-control lawsuit, a bankrupt former majority shareholder, fresh securities/NFT litigation, and a SHRAP token trading ~99% below its all-time high."
sections:
  - id: "identity-and-model"
    title: "Identity, Stage and Business Model"
    body: >-
      Shrapnel is the consumer brand and game; the legal operating entity is Neon Machine, Inc.,
      a Seattle, Washington game studio. Neon Machine was founded in 2014, but the Shrapnel project
      itself began in 2020 with the stated ambition of a "blockbuster-quality" extraction shooter
      whose players own and trade their creations. The product is a free-to-play, team-based
      first-person shooter built in Unreal Engine 5 and set in a post-apocalyptic "Sacrifice Zone"
      where Operators collect and extract a resource called Sigma. The business model is Web3-native:
      in-game gear, skins and player-designed items are tokenised as NFTs, and a Layer-1 utility
      token, SHRAP, underpins the economy alongside an in-game marketplace and the studio's "Moonshot"
      suite of Web3 game-development and user-generated-content tools. Monetisation is intended to come
      from item sales, marketplace fees, token utility and, in China, a revenue-share repurchase of
      SHRAP. As of the run date the company is a venture-backed private firm at roughly Series A stage,
      transitioning from paid early access into a broader free-to-play launch and a regulated China entry.
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO007", "CO031", "CO032"]
    figureRefs: ["FO002"]
  - id: "leadership-governance"
    title: "Founders, Leadership and Governance"
    body: >-
      Neon Machine was founded by longtime game-industry entrepreneur Mark Long, who served as CEO
      and public face of Shrapnel through 2024. Ahead of the planned free-to-play launch the studio
      installed Ken Rosman, a 30-year video-game veteran who spent years at Microsoft's Xbox division
      on titles such as Halo Wars and Sunset Overdrive, as chief executive; Long moved to an advisory
      role and subsequently left the company to become CEO of a separate venture. Dave Johnson leads the
      Shrapnel project and former Shrapnel studio head Don Norbury, the CTO, oversees the Moonshot tools.
      Governance has been contentious: in November 2023 studio founders alleged that Cort Javarone,
      then majority shareholder and head of investment firm 4D Factory, had staged a "coup," while
      Javarone countered that leadership had gone rogue. 4D Factory entities filed for bankruptcy in the
      Southern District of New York in October 2023, investor GPC3 I, LLC sued Javarone in January 2025,
      and Neon Machine settled the founder/investor litigation in March 2025. Key-person dependence now
      concentrates on Rosman and on the Gala Games relationship.
    claimRefs: ["CO008", "CO009", "CO010", "CO011", "CO012", "CO013", "CO014", "CO033"]
    tableRefs: ["TO002"]
  - id: "funding-valuation"
    title: "Funding, Investors and Valuation"
    body: >-
      Neon Machine has raised more than $38 million to date according to PitchBook data cited by
      TechCrunch, from investors including Gala Games, Griffin Gaming Partners and Polychain Capital.
      The studio announced a $20 million round led by Polychain in October 2023, and in August 2025
      disclosed a $19.5 million Series A raised across two tranches, the most recent led by Gala Games
      with participation from Griffin Gaming Partners and Polychain Capital. That round carried a
      reported $1.1 billion valuation, placing Shrapnel on TechCrunch's 2025 unicorn list. A separate
      strategic round disclosed in late 2024 was described as led by the Blizzard Avalanche Ecosystem
      Fund. The valuation is striking against the backdrop of the publicly traded SHRAP token, whose
      market capitalisation sat near $1.1 million in mid-2026 — roughly 99% below its December 2023
      all-time high — underscoring a wide gap between the private equity mark and the on-chain market's
      assessment of the ecosystem. Investor relationships are also entangled with litigation, including
      GPC3 I, LLC's breach-of-contract claims over a token purchase agreement.
    claimRefs: ["CO001", "CO002", "CO015", "CO016", "CO017", "CO018", "CO019", "CO020", "CO034", "CO040"]
    tableRefs: ["TO003"]
  - id: "snapshot-metrics"
    title: "Cover Metrics and Disclosure Gaps"
    body: >-
      Public traction metrics are partial and must be read with care. Entering 2025 Neon Machine
      reported more than 130,000 player accounts and over half a million social-media followers, and
      it has cited more than 3.7 million sessions across 27 days of paid early access in 2024. However,
      account and follower counts are not active-user counts: after the March 2026 Steam Early Access
      launch, third-party trackers recorded a peak of only about 255 concurrent players that decayed to
      single digits within months. Core financials — headcount, revenue, run-rate and burn — are not
      disclosed, and the $1.1 billion valuation is an implied private mark rather than an audited figure.
      Unsupported metrics are flagged as gaps with concrete diligence paths rather than estimated, and
      the divergence between the equity valuation and the token market cap is treated as a central
      open question carried into the valuation chapter.
    claimRefs: ["CO001", "CO021", "CO022", "CO023", "CO024", "CO035", "CO036", "CO040"]
    tableRefs: ["TO001"]
    figureRefs: ["FO003"]
  - id: "milestones-chronology"
    title: "Milestone Chronology"
    body: >-
      Shrapnel's history blends genuine product progress with persistent governance and legal turmoil.
      The chronology of record runs from Neon Machine's 2014 founding and the 2020 start of the Shrapnel
      project, through the October 2023 Polychain-led round and the simultaneous distress of former
      majority owner 4D Factory, the February 2024 paid early access on the Epic Games Store, the March
      2025 settlement and Mark Long's departure, the 2025 China Trusted Copyright Chain approval, the
      August 2025 $19.5M Series A and unicorn valuation, the March 2026 Steam Early Access launch and the
      April 2026 Chinese Early Access via GalaChain. Adverse events punctuate the timeline, most recently
      the December 2025 Realm Metaverse Real Estate Inc. complaint against Neon Machine and affiliate
      Oganesson Factory Limited. This single chronology anchors every later chapter; financing details are
      restated as local claims where downstream chapters reuse them.
    claimRefs: ["CO025", "CO026", "CO027", "CO028", "CO029", "CO030", "CO037", "CO038", "CO039"]
    tableRefs: ["TO004"]
    figureRefs: ["FO001"]
