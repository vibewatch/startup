company:
  name: "Shrapnel"
chapter:
  number: 3
  title: "Competitive Landscape"
  summary: "Shrapnel competes simultaneously against a graveyard of failing Web3 game tokens and against massive traditional extraction-shooter incumbents. In the blockchain-gaming lane, Off The Grid (Gunzilla Games) is the most direct comparable — a Web3 AAA shooter with >$100M raised and meaningful player traction. But virtually every Web3 gaming token, including Illuvium, Star Atlas, and Axie Infinity, has collapsed 90-99% from peak, and 93% of Web3 game projects are now effectively dead. In the traditional lane, Escape from Tarkov, ARC Raiders, and Delta Force command player bases orders of magnitude larger than Shrapnel's ~255 Steam peak. Shrapnel's claimed moats — UE5 AAA quality, Moonshot UGC tools, and China TCC access — are genuine differentiators but face existential questions around token-economy viability and player retention in a Web3 sector that has overwhelmingly failed to attract sustainable audiences."
sections:
  - id: "web3-competitors"
    title: "Web3 Blockchain Game Competitors"
    body: >-
      Shrapnel's closest direct competitor is Off The Grid by Gunzilla Games, a Web3 AAA battle-royale
      shooter built in Unreal Engine 5 on the Avalanche-based GUNZ blockchain. Gunzilla has raised over
      $100 million in total funding from investors including CoinFund, Avalanche's Blizzard Fund,
      Republic Capital, and Coinbase Ventures, significantly out-capitalising Shrapnel's reported $38 million.
      Off The Grid launched on PC, PS5, and Xbox in 2024 and reported 17.3 million wallets preparing for
      mainnet migration in 2025, with $13 million in monthly marketplace trading volume and over 413,000
      decoded NFT assets. Its dual-access model — traditional gameplay on Steam, blockchain features
      off-platform — mirrors Shrapnel's Web2/Web3 split but at greater distribution scale.
      Beyond Gunzilla, the broader Web3 gaming landscape is a cautionary tale. Illuvium (ILV), once valued
      near $1 billion at its token peak, trades at a market cap of approximately $27-35 million in June 2026
      with undisclosed active player counts. Star Atlas (ATLAS), the Solana-based space MMO, sits at a
      market cap of roughly $3 million — down 99.96% from its all-time high — with reports of development
      halts and the Solana Foundation president declaring in March 2026 that gaming on blockchain is not
      coming back. Axie Infinity (AXS), the cautionary play-to-earn pioneer, collapsed from 2.8 million
      daily active users to approximately 99,000, with its token down 99% from peak to a market cap near
      $250 million. Big Time (BIGTIME) maintains a modest $16-21 million market cap but discloses no
      player numbers. In aggregate, 93% of Web3 gaming projects launched since 2020 are now effectively
      dead, with $15 billion in capital destroyed across the sector.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP005", "CP006", "CP007", "CP008", "CP009", "CP010", "CP035"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "traditional-incumbents"
    title: "Traditional Extraction Shooter Incumbents"
    body: >-
      The extraction-shooter genre that Shrapnel targets is dominated by traditional Web2 titles with
      player bases orders of magnitude larger. Escape from Tarkov, the genre originator by Battlestate
      Games, maintains 12,000-24,000 concurrent players on Steam alone (with additional players on its
      proprietary launcher), reaching peaks above 47,000 and estimated monthly actives above 900,000
      during major wipes. ARC Raiders by Embark Studios is the genre's 2025-2026 breakout success, with
      a peak of approximately 960,000 concurrent players across all platforms, over 14 million copies
      sold, and stabilised Steam concurrents of 85,000-105,000 — making it roughly 400 times larger than
      Shrapnel's peak concurrent figure. Delta Force by TiMi Studio Group (Tencent) is reported to
      outperform even ARC Raiders in concurrency, establishing itself as the genre king with massive
      cross-platform engagement. Hunt: Showdown by Crytek is the genre's elder statesman, with a peak
      near 60,000 concurrent and a loyal but smaller stable base. Call of Duty: Warzone and its DMZ mode
      leverage the largest FPS franchise in the world, with hundreds of millions of registered accounts
      across the Activision ecosystem. These incumbents share a critical advantage: none require players
      to interact with tokens, wallets, or blockchain concepts, removing the friction that has historically
      caused Web3 game abandonment.
    claimRefs: ["CP011", "CP012", "CP013", "CP014", "CP015", "CP016", "CP017", "CP036"]
    tableRefs: ["TP002"]
    figureRefs: ["FP002"]
  - id: "capability-comparison"
    title: "Capability, Pricing and Distribution Comparison"
    body: >-
      Comparing Shrapnel against both Web3 peers and traditional incumbents across key buying criteria
      reveals a mixed picture. On production quality, Shrapnel and Off The Grid both use Unreal Engine 5
      and employ AAA-credentialed developers, putting them visually on par with traditional shooters.
      However, Shrapnel's actual player experience is limited — its Steam Early Access launched in March
      2026 with a single Tokyo map and a Stockpile extraction mode, whereas ARC Raiders shipped with
      multiple biomes, progression systems, and 15 million copies worth of proven retention. On
      distribution, Shrapnel is available on Steam and Epic but blockchain features are gated; Off The
      Grid adds PlayStation and Xbox. Traditional titles dominate console distribution. On pricing, Shrapnel
      is free-to-play with optional NFT/token purchases; Escape from Tarkov charges $45-150 for editions;
      ARC Raiders uses a premium model at $40. The China TCC access gives Shrapnel a unique regulatory
      advantage unavailable to any competitor, though monetisation in China requires the revenue-repurchase
      mechanism through GalaChain. On user-generated content, Shrapnel's Moonshot tools are its strongest
      claimed differentiator — no other Web3 or traditional extraction shooter offers comparable creator
      infrastructure. However, this capability is unproven at scale, with no public data on creator
      adoption or content volume.
    claimRefs: ["CP018", "CP019", "CP020", "CP021", "CP022", "CP023", "CP024", "CP025", "CP037"]
    tableRefs: ["TP003"]
  - id: "moat-durability"
    title: "Moat Durability and Competitive Risk"
    body: >-
      Shrapnel's claimed competitive moats are four: AAA production quality via Unreal Engine 5, the
      Moonshot UGC creator toolkit, the SHRAP token economy, and first-mover access to China's Trusted
      Copyright Chain. Each carries material durability questions. The UE5 moat is now table-stakes — both
      Off The Grid and multiple traditional titles use the same engine, so graphical fidelity alone is
      not defensible. The Moonshot toolkit is the most novel asset, but its value depends entirely on
      whether a critical mass of creators adopts it, which is undemonstrated at present. The SHRAP token,
      trading at approximately $0.0008 with a market cap near $1.1 million (99% below ATH), represents a
      potential liability rather than a moat: it mirrors the collapse pattern of every other Web3 gaming
      token, and the gap between the token's public market assessment and the studio's $1.1 billion
      private valuation is the central credibility question. The China TCC access is genuinely scarce —
      no other Western Web3 game has achieved it — but its commercial value depends on converting
      regulated access into paying players, which remains unproven. Displacement risks include: ARC
      Raiders and Delta Force proving that extraction shooters can achieve massive scale without blockchain;
      the Web3 gaming sector's 93% mortality rate eroding investor and player confidence; and Off The Grid
      directly competing for the same Web3-shooter audience with greater capital and distribution reach.
    claimRefs: ["CP026", "CP027", "CP028", "CP029", "CP030", "CP031", "CP032", "CP033", "CP034", "CP038"]
    tableRefs: ["TP004"]
    figureRefs: ["FP003"]
