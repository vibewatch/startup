  - calloutType: "risk"
    title: "Traditional incumbents dwarf Shrapnel's traction"
    body: "ARC Raiders at 960K peak concurrent and Delta Force at even higher numbers prove the extraction-shooter TAM is real — but also that blockchain is unnecessary to capture it. Shrapnel's 255-player peak is a rounding error against these figures."
    claimRefs: ["CP013", "CP014", "CP015"]
