companyProfile:
  summary: Shrapnel is the brand and game produced by Neon Machine, Inc., a Seattle game studio founded in 2014, with the Shrapnel project itself beginning in 2020. It is a free-to-play AAA first-person extraction shooter built in Unreal Engine 5, layering NFT asset ownership, the Avalanche-originated SHRAP token (since migrated to GalaChain), and the Moonshot user-generated-content toolset. Backed by Gala Games, Griffin Gaming Partners, and Polychain Capital, the company reported a $1.1 billion valuation on its August 2025 Series A. It is the first licensed Western Web3 game approved on China's government-backed Trusted Copyright Chain. The headline diligence tension is the roughly 1,000x gap between that private equity mark and the company's own ~$1.1M public SHRAP token market capitalization, compounded by near-zero live concurrent players and active litigation.
  foundedDate: '2014-01-01'
  founders:
    - name: Mark Long
      role: Co-founder & former CEO (later advisor, since departed)
      background: Veteran game-industry executive who led the Shrapnel project from 2020 and previously worked on franchises such as HAWKEN and Spec Ops; transitioned to an advisory role and subsequently left the company.
      claimRefs: [CO007, CO010]
  foundingLocation: Seattle, Washington, USA
  headquarters: Seattle, Washington, USA
  productSummary: A free-to-play Unreal Engine 5 team-based extraction first-person shooter set in the "Sacrifice Zone," with on-chain NFT operators and equipment, the SHRAP token economy, an in-game marketplace, and the Moonshot UGC creation toolset that lets players build and monetize content.
  customerFocus: Crypto-native players and NFT holders, traditional FPS and extraction-shooter players, UGC creators, and — via the Trusted Copyright Chain license — China's roughly 600-700 million gamers.
  businessModel: Free-to-play with revenue from NFT and cosmetic item sales, marketplace transaction fees, SHRAP token utility sinks, and a GalaChain-routed China revenue-share/repurchase mechanism; no audited revenue has been disclosed.
  stage: Series A private (venture-backed)
  fundingStatus: Reported $1.1B valuation on a $19.5M Series A in August 2025 led by Gala Games (with Griffin Gaming Partners and Polychain Capital), structured in two tranches, following a ~$20M round led by Polychain in October 2023; total equity raised exceeds $38 million. Current CEO is Xbox veteran Ken Rosman.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO007, CO010, CO025, CO029, CI015, CV001]
