company:
  name: "Shrapnel"
chapter:
  number: 4
  title: "Financials"
  summary: "Neon Machine's revenue model rests on NFT marketplace fees, cosmetic item sales, SHRAP token utility sinks, and a China revenue-share repurchase mechanism via GalaChain, but no audited financials or revenue figures have been disclosed. The SHRAP token — with a 3 billion max supply, ~97% circulating, and a market cap around $1M in June 2026 — has collapsed ~99.9% from its December 2023 ATH of $0.44. Against a reported $1.1B private equity valuation from the August 2025 Series A led by Gala Games, the ~1,000x gap between private mark and public token valuation constitutes the central financial red flag. Capital adequacy is opaque: total equity raised exceeds $38M, but burn rate, headcount, and runway are undisclosed. No SEC Form D filing exists for Neon Machine, and active litigation — including Realm Metaverse Real Estate Inc. v. Neon Machine (SDNY 1:25-cv-10057) — adds contingent liability risk."
sections:
  - id: "revenue-model"
    title: "Revenue Streams and Pricing Model"
    body: >-
      Shrapnel is a free-to-play extraction FPS whose monetization is entirely Web3-native.
      Revenue streams comprise four pillars: first, the Shrapnel Marketplace where players buy,
      sell, and trade NFT items (weapons, cosmetics, Operators, maps) with transaction fees payable
      in SHRAP; second, direct cosmetic and equipment NFT sales by the studio; third, token utility
      sinks where SHRAP is consumed for gameplay actions such as minting user-generated content and
      participating in seasonal events; and fourth, a China-market revenue-share mechanism in which
      GalaChain facilitates renminbi-settled item trading through the Trusted Copyright Chain, with
      resulting revenue used to repurchase SHRAP tokens. Industry-standard NFT marketplace platform
      fees typically range between 2% and 5% of each transaction, though Shrapnel has not publicly
      disclosed its exact fee schedule. Creator royalties on secondary sales — common in the NFT
      ecosystem at 5–10% — may provide additional revenue share. No audited revenue figures have been
      disclosed, and no SEC Form D has been filed for Neon Machine, Inc. on EDGAR, leaving all
      revenue claims unverifiable through public filings.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI037"]
    tableRefs: ["TI001"]
    figureRefs: ["FI001"]
  - id: "token-economics"
    title: "Token Economics and Market Performance"
    body: >-
      The SHRAP token is the economic backbone of the Shrapnel ecosystem, operating on Avalanche
      with a fixed maximum supply of 3,000,000,000 tokens. Token generation occurred in late 2023,
      and by June 2026 approximately 2.89 billion SHRAP are in circulation — roughly 96% of max
      supply. Allocation at TGE divided tokens among Community Rewards (~27%), Team and Advisors
      (~27% or 810M SHRAP with a 47-month cliff then linear vest), Seed investors (~20% or 600M,
      now fully unlocked), Strategic investors (~7% or 210M, ~79% unlocked by June 2026), and
      Ecosystem/Liquidity reserves (~19%). The token reached an all-time high of approximately $0.44
      in December 2023 shortly after TGE, buoyed by speculative demand. Since then, SHRAP has
      declined approximately 99.9% to ~$0.0004 by mid-June 2026, with a market capitalization of
      roughly $1.1M and daily trading volume under $1,000. CryptoSlate records the all-time low at
      $0.00031 on June 9, 2026. This collapse — occurring while the private equity valuation was
      marked at $1.1B in August 2025 — creates a gap of roughly 1,000x between the private mark
      and the public market's assessment of the token economy, representing the central adverse
      financial signal in this diligence.
    claimRefs: ["CI007", "CI008", "CI009", "CI010", "CI011", "CI012", "CI013", "CI014", "CI038"]
    tableRefs: ["TI002"]
    figureRefs: ["FI003"]
  - id: "capital-structure"
    title: "Capital Adequacy and Financing Dependency"
    body: >-
      Neon Machine has raised more than $38 million in equity across multiple rounds, culminating
      in a $19.5M Series A in August 2025 led by Gala Games at a reported $1.1 billion post-money
      valuation. Earlier capital includes an October 2023 round of approximately $20M led by
      Polychain Capital. The Company Overview chronology documents the full funding arc; this
      chapter focuses on forward capital adequacy. Cash on hand, monthly burn rate, and remaining
      runway are entirely undisclosed. Third-party reporting has cited cumulative operating expenses
      exceeding $86M and peak burn rates of $2–3.5M per month, though these figures lack primary
      corroboration and must be treated as unverified estimates. No SEC Form D is filed on EDGAR
      for Neon Machine, constituting a disclosure gap unusual for a US-domiciled venture-backed
      company raising at this scale. The studio's next capital trigger likely depends on
      performance metrics from its Steam Early Access launch (March 2026) and China Early Access
      via GalaChain (April 2026), but no runway guidance has been communicated publicly. Financing
      dependency concentrates on the Gala Games relationship, which provides both equity capital and
      the GalaChain infrastructure for the China revenue model.
    claimRefs: ["CI015", "CI016", "CI017", "CI018", "CI019", "CI020", "CI021", "CI039"]
    tableRefs: ["TI004"]
    figureRefs: ["FI004"]
  - id: "financial-red-flags"
    title: "Financial Red Flags and Litigation Exposure"
    body: >-
      Several red flags emerge from the financial analysis. The paramount concern is the ~1,000x
      divergence between the $1.1B private equity valuation and the ~$1.1M SHRAP token market
      capitalization: if the token economy is meant to underpin user engagement, its effective
      collapse signals market disbelief in the project's economic sustainability. Second, no
      audited financials, revenue figures, or operational metrics (headcount, burn, runway) are
      publicly available, preventing independent underwriting. Third, the absence of an SEC Form D
      filing despite multiple reported rounds exceeding $38M raises a regulatory-disclosure
      question. Fourth, active litigation creates contingent liabilities: Realm Metaverse Real
      Estate Inc. v. Neon Machine (SDNY 1:25-cv-10057, filed December 2025) alleges securities
      and NFT-related claims; GPC3 I, LLC v. Javarone (1:25-cv-00060) involves breach of a token
      purchase agreement linked to the studio's former investor. Fifth, 4D Factory — the former
      majority shareholder — filed for Chapter 11 bankruptcy (SDNY 23-11618/23-11619) in October
      2023, and the adversary proceeding 4D Factory LLC v. Long was closed in May 2025 but left
      residual cap-table complexity. Sixth, token vesting continues with Team and Advisor
      allocations only 40% unlocked as of mid-2026, implying ongoing sell pressure from insider
      unlocks through at least October 2028.
    claimRefs: ["CI022", "CI023", "CI024", "CI025", "CI026", "CI027", "CI028", "CI029", "CI040"]
    tableRefs: ["TI003", "TI005"]
    figureRefs: ["FI002"]
  - id: "financial-verdict"
    title: "Financial Verdict and Diligence Blockers"
    body: >-
      Shrapnel's financial profile presents a pre-revenue, token-dependent Web3 gaming venture
      with an outsized private valuation, minimal public disclosure, and a token economy in severe
      distress. Revenue quality cannot be assessed without management accounts showing marketplace
      transaction volume, fee revenue, and token-sink utilization. The margin path is speculative:
      digital-goods businesses can operate at high gross margins once at scale, but Neon Machine
      has not demonstrated paying users at meaningful volume — Steam Early Access peak concurrent
      players reached only ~255 before decaying. Capital intensity depends on whether the studio
      can sustain development with its post-Series-A cash and China-market revenues, but this
      cannot be verified externally. Diligence blockers include: request management accounts and
      audited financials; confirm post-settlement cap-table and preference stack; verify China
      revenue-share mechanics and SHRAP repurchase volumes; obtain token treasury balances and
      insider unlock schedules; clarify use of proceeds from the $19.5M Series A. Until these
      are addressed, the financial case rests entirely on reported fundraising narrative rather
      than demonstrated commercial traction or sustainable unit economics.
    claimRefs: ["CI030", "CI031", "CI032", "CI033", "CI034", "CI035", "CI036"]
