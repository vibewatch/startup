callouts:
  - calloutType: "risk"
    title: "Acute retention failure despite credible tech"
    body: "Steam concurrent players peaked at 253 and collapsed to single digits within three months of Early Access launch, suggesting that technical competence alone is insufficient — gameplay polish, onboarding, or the blockchain layer may be alienating mainstream FPS players."
    claimRefs: ["CE038", "CE039"]
  - calloutType: "risk"
    title: "Single-vendor blockchain dependency"
    body: "Migrating from Avalanche to GalaChain concentrated all on-chain infrastructure under Gala Games — the same entity that led the $19.5M Series A. This creates correlated risk: if Gala falters, both capital and infrastructure are at stake."
    claimRefs: ["CE012", "CE034"]
  - calloutType: "strength"
    title: "AAA-veteran team with real shipped builds"
    body: "The studio's veterans from Call of Duty, Halo, BioShock, and Ghost of Tsushima have delivered a working UE5 shooter with weekly patch cadence and iterative community-driven development — a rarity in Web3 gaming."
    claimRefs: ["CE024", "CE025", "CE026"]
  - calloutType: "insight"
    title: "UGC as platform play requires proof"
    body: "Moonshot UGC tools are positioned as the core differentiator, but no publicly verifiable community-created NFTs exist on the marketplace as of June 2026. Until creator adoption is demonstrated, the platform thesis is aspirational."
    claimRefs: ["CE020", "CE022", "CE037"]
