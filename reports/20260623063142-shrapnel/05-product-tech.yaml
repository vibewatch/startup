company:
  name: "Shrapnel"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Shrapnel is a free-to-play 4v4 extraction first-person shooter built on Unreal Engine 5 by Neon Machine, a Seattle studio staffed by veterans of Call of Duty, Halo, and BioShock. Version 2.0 launched on Steam Early Access on March 5, 2026, after a year-long technical reset, introducing a Stockpile mode on a dystopian Tokyo map with two playable Operators. The blockchain layer migrated from an Avalanche subnet to GalaChain in 2025–2026 to unlock China market access via the Trusted Copyright Chain. Moonshot UGC tools allow players to create and mint NFT content. Despite credible AAA-veteran talent and real shipped builds, Steam concurrent players peaked at ~253 and decayed to single digits, raising serious questions about gameplay polish, retention, and whether the tech investment translates to product-market fit."
sections:
  - id: "product-definition"
    title: "Product Definition and Core Gameplay"
    body: >-
      Shrapnel is a free-to-play, team-based first-person extraction shooter set in a fictional
      post-apocalyptic "Sacrifice Zone" created when asteroid 38 Sigma struck the moon in 2038,
      bombarding Earth with meteorites. Players deploy as elite Operators into hostile zones to
      locate, collect, and extract a volatile resource called Sigma before a rival squad can do the
      same. The primary launch mode, Stockpile, is a 4v4 objective-based competitive format where
      each team races to deposit 300 grav-kilos of Sigma. The core loop combines resource gathering,
      squad-based firefights, dynamic meteor-shower hazards, and extraction tension. True digital
      ownership of in-game assets — Operators, weapon skins, cosmetics — is tokenised as NFTs on
      GalaChain and tradeable on the Shrapnel Marketplace. Operators can be leveled to unlock perks
      that customise playstyle. The Printer crafts mystery rewards from collected items, and the
      Recycle Depot transforms multiple items into new ones. Shrapnel's business model is entirely
      Web3-native: SHRAP token utility sinks, marketplace fees, and a China revenue-share mechanism
      via the Trusted Copyright Chain constitute the monetisation pillars. The game targets PC first
      (Windows) with Early Access on Steam; no console version has been announced.
    claimRefs: ["CE001", "CE002", "CE003", "CE004", "CE005", "CE006"]
    tableRefs: ["TE001"]
    figureRefs: ["FE002"]
  - id: "tech-stack"
    title: "Technology Stack and Architecture"
    body: >-
      Shrapnel is built on Unreal Engine 5, having undergone a complete migration from its
      earlier UE4 build to UE5 during the year-long technical reset preceding the March 2026
      Steam launch. The studio reports that the UE5 upgrade brought improvements in visual
      fidelity, server responsiveness, and hit-detection reliability. Core technical systems
      include a rebuilt shot-resolution pipeline using bullet pooling (reusing bullet objects in
      firefights rather than creating new instances), fixed curve-based recoil patterns replacing
      random horizontal recoil, adjusted spread mechanics based on player stance (hip-fire, ADS,
      crouching), and a server-authoritative networking model for competitive integrity. The
      backend is assumed to use dedicated servers for match hosting with cloud-based scaling;
      no public documentation confirms the specific cloud provider (AWS, Azure, or GCP). The
      blockchain layer originally ran on an Avalanche subnet (custom L1), with the SHRAP ERC-20
      token deployed on Avalanche C-Chain. In mid-to-late 2025 Neon Machine announced a full
      migration of all NFT assets and the SHRAP token to GalaChain, a custom Layer-1 blockchain
      built by Gala Games for gaming and entertainment. GalaChain offers faster transaction
      finality, lower gas costs, and native integration with Gala's marketplace infrastructure.
      GALA serves as the gas token for all on-chain transactions. The architecture adds a
      cross-chain bridge between GalaChain and China's Trusted Copyright Chain (TCC), scheduled
      for Q1 2026, enabling compliant digital-asset movement. Anti-cheat and security measures
      are not publicly documented; the Steam store page does not list Easy Anti-Cheat or BattlEye
      integration, which is a gap for a competitive multiplayer title.
    claimRefs: ["CE007", "CE008", "CE009", "CE010", "CE011", "CE012", "CE013", "CE035"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "blockchain-architecture"
    title: "Blockchain Architecture and Token Infrastructure"
    body: >-
      The SHRAP token was issued as an ERC-20 on Avalanche with a fixed maximum supply of 3 billion
      tokens, generated at a single Token Generation Event (TGE) in late 2023. Vesting contracts
      were deployed on the Avalanche C-Chain and locked pending subnet activation. The planned
      Shrapnel subnet was intended to serve as a dedicated Layer-1 for gameplay transactions, but
      the migration to GalaChain superseded the original subnet roadmap. On GalaChain, SHRAP
      remains the in-game currency for NFT purchases, marketplace transactions, UGC minting, and
      staking. Up to 10 percent of revenue generated from Chinese players will be used for periodic
      SHRAP buybacks. The GalaChain–TCC cross-chain bridge enables secure, regulation-compliant
      movement of digital assets between the global and Chinese ecosystems. All on-chain activities,
      including cross-border transfers, consume GALA as gas. NFT categories include Operators
      (playable characters), weapon skins, cosmetic items, and user-generated maps/content. The
      Shrapnel Marketplace provides listing, trading, crafting (Printer), and recycling (Recycle
      Depot) functions. Smart-contract security audits have not been publicly disclosed, which
      represents a material gap given that on-chain assets underpin the entire economic model.
    claimRefs: ["CE014", "CE015", "CE016", "CE017", "CE018", "CE019", "CE036"]
    tableRefs: ["TE004"]
  - id: "ugc-tooling"
    title: "User-Generated Content and Moonshot Tools"
    body: >-
      Shrapnel's Moonshot tools are an Unreal-Engine-based user-generated-content creation suite
      led by CTO Don Norbury. The toolset allows players and creators to design skins, maps,
      weapons, sound effects, and other assets which can then be minted as NFTs and traded on the
      marketplace. The economic promise is that creators retain true ownership and can monetize
      their work via the SHRAP token economy when other players acquire their creations. Moonshot
      is positioned as a core differentiator — transforming Shrapnel from a conventional shooter
      into a platform where the community generates and owns content. Technical details of the
      tooling (blueprint templates, plugins, mod SDK version) have not been published in any
      public technical documentation. The roadmap references expanded creator tools and modding
      competitions for 2026, but no concrete release schedule or feature list has been disclosed
      beyond marketing language. The practical maturity of the UGC pipeline cannot be verified
      externally: no community-created maps or items have been independently confirmed as live on
      the marketplace during Steam Early Access as of June 2026.
    claimRefs: ["CE020", "CE021", "CE022", "CE023", "CE037"]
    tableRefs: ["TE002"]
    figureRefs: ["FE004"]
  - id: "launch-state"
    title: "Launch State, Developer Signal, and Roadmap"
    body: >-
      Shrapnel 2.0 entered Steam Early Access on March 5, 2026, after a year-long technical
      reset from the earlier Epic Games Store paid early-access window (February 2024, 27 days,
      3.7 million sessions reported). The Steam launch introduced the Stockpile 4v4 mode, a
      Tokyo-themed map, two Operators, and UE5-rebuilt gunplay. The planned Early Access duration
      is approximately two months, with gameplay content in month one and progression features
      (Missions, Battle Pass) in month two. The studio committed to regular dev blog updates and
      weekly patch cadences. Documented patches include a March 18 stability update (texture
      loading fixes, Sigma pickup bug, Operator-switch on death screen) and a March 25 balance
      patch (Phantom HP reduced 400 to 350, DMR body-shot damage increased, AR2 mag capacity
      reduced 33 to 30, camera shakes removed). Roadmap items include skill-based matchmaking,
      weapon-loadout customization menu, account progression, social features, daily missions,
      more maps, and expansion to five Operators. China Early Access via GalaChain–TCC launched
      April 30, 2026. However, third-party tracking (SteamCharts) records an all-time peak of
      only 253 concurrent players, with the average in March 2026 around 21 and current figures
      in June 2026 at 1–4. This decay from hundreds to single digits within three months signals
      an acute retention problem that the technical improvements have not yet solved.
    claimRefs: ["CE024", "CE025", "CE026", "CE027", "CE028", "CE029", "CE030", "CE038", "CE039"]
    tableRefs: ["TE005"]
    figureRefs: ["FE003"]
  - id: "trust-quality"
    title: "Trust, Quality, Security, and Technical Risk"
    body: >-
      Shrapnel's trust and quality posture is mixed. On the positive side, the development team
      comprises AAA veterans with shipped credits on Call of Duty, Halo, BioShock, and Ghost of
      Tsushima — providing credible technical competence. The game ships real builds, issues
      weekly patches, and maintains an active Steam Community presence. Neon Machine secured
      $37.5 million in funding to finance development. On the negative side, early-access
      reviews cite clunky controls, extraction crashes, inconsistent texture quality (some areas
      "rendered off the Nintendo 64"), and generic/repetitive sound design. The recoil and hit-
      detection overhauls introduced post-launch demonstrate responsiveness but also confirm
      that shipped builds had fundamental gunplay issues. No public smart-contract audit exists
      for the NFT or token contracts. No anti-cheat middleware (EAC, BattlEye, Vanguard) is
      disclosed. No public status page, SLA, or uptime commitment exists for multiplayer servers
      or marketplace. Privacy policy and data-handling documentation is limited to standard Steam
      terms. Regulatory compliance for the China bridge is asserted through the TCC partnership
      but no independent audit confirms adherence. The all-time Steam peak of 253 concurrent
      players — declining to single digits — is itself a quality signal: either the game is not
      retaining players due to polish gaps, the blockchain/NFT layer alienates mainstream gamers,
      or both.
    claimRefs: ["CE031", "CE032", "CE033", "CE034", "CE038", "CE039", "CE040"]
    tableRefs: ["TE006"]
