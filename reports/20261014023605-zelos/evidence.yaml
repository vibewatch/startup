      silicon costs, battery pack procurement expenses, and per-unit LiDAR pricing.
    whyItMatters: >-
      Vehicle manufacturing unit economics determine whether Zelos can sell or lease RoboVans profitably before
      factoring in ongoing software subscription revenues.
    diligencePath: >-
      Review internal procurement schedules, supplier pricing agreements from Hesai and battery cell manufacturers, and
      manufacturing contract terms.
