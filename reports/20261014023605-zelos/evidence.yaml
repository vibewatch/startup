evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: Audited financial statements, revenue run-rate, gross margins, cash burn, and route-level unit economics.
    whyItMatters: >-
      Without audited revenue or route economics, public valuation claims of RMB 10B+ cannot be independently validated
      against fundamentals.
    diligencePath: >-
      Inspect pre-IPO filing disclosures or audited shareholder reports submitted in connection with the planned Hong
      Kong listing.
    relatedQuestionRefs:
      - QO009
  - type: stale
    severity: minor
    topic: historical-press-verification
    missingEvidence: >-
      Archived or primary press release document for the February 2026 National Business Daily valuation article that
      currently returns 404.
    whyItMatters: >-
      Confirms whether the RMB 10B valuation headline originated from an official company disclosure or secondary market
      speculation.
    diligencePath: >-
      Verify Chinese corporate registry (TianYanCha/QiChaCha) capital change filings and official investor press
      releases.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: material
    topic: valuation-and-fleet-reconciliation
    missingEvidence: >-
      Primary audited financial statements or capitalization table reconciliation between the >RMB 10B ($1.4B) funding
      round and the $2B Cainiao transaction valuation.
    whyItMatters: >-
      Conflicting valuation narratives and unverified fleet revenue metrics create valuation uncertainty ahead of the
      reported Hong Kong IPO.
    diligencePath: >-
      Review preliminary prospectus disclosures filed with the Hong Kong Stock Exchange (HKEX) once Jiushi / Zelos
      publicly files.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Audited financial statements and route-by-route gross margin breakdowns for Zelos's commercial robovan operations.
    whyItMatters: >-
      Without disclosed financial statements or realized pricing schedules, reported unit cost savings cannot be
      reconciled against vehicle depreciation, teleoperation costs, and maintenance.
    diligencePath: >-
      Request audited revenue, vehicle gross margins, and teleoperation overhead schedules from management during
      pre-IPO diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: competitor-filings
    missingEvidence: >-
      Granular route economics and peer financial filings for competitor autonomous driving fleets such as WeRide and
      Neolix.
    whyItMatters: >-
      Prevents independent benchmarking of fleet utilization, vehicle production gross margins, and long-term capital
      intensity against private rivals.
    diligencePath: >-
      Obtain private commercial benchmarking data from industry logistics operators and review public prospectus filings
      when available.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: audited-financial-performance
    missingEvidence: >-
      Audited income statements, gross margin by vehicle tier, and recognized annual recurring revenue figures for
      fiscal years 2024 through 2026.
    whyItMatters: >-
      Without verified revenue recognition and gross margin breakdowns, underwriting cannot confirm whether hardware
      sales generate positive unit margins or require software subsidies.
    diligencePath: >-
      Request audited IFRS financial statements and management accounts during pre-IPO prospectus or confidential data
      room access.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Monthly operating cash burn rate, working capital requirements for 20,000 deployed vehicles, and net cash balance
      following the February 2026 financing.
    whyItMatters: >-
      Rapid physical fleet expansion and hardware manufacturing create substantial working capital demands that dictate
      whether the $600M IPO is expansion capital or runway extension.
    diligencePath: >-
      Review monthly cash flow statements, capex schedules, and banking facility letters during management diligence
      sessions.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: teleoperation-disengagement-rates
    missingEvidence: >-
      Audited public reports documenting mean distance between disengagements (MDBD), safety driver takeover rates, and
      remote teleoperator vehicle-to-operator ratios across commercial deployments.
    whyItMatters: >-
      Without audited disengagement frequencies, true Level-4 autonomous delivery operational expenditure and
      driver-replacement labor savings cannot be substantiated.
    diligencePath: >-
      Request municipal autonomous testing audit logs from Chinese provincial transport bureaus, Singapore LTA M1 trial
      reports, or internal fleet telematics dispatch logs.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
