    title: "Valuation Scrutiny and Disclosed Unit Economics Deficit"
    body: "While Zelos is preparing for a Hong Kong IPO targeting $600 million on a $2 billion valuation benchmark, financial analysts emphasize that the company has not published audited revenue or route-level gross margins. Without verifiable operating unit economics, public market valuation remains exposed to roadshow downward revisions."
    claimRefs:
      - "CP008"
      - "CP009"
  - calloutType: "insight"
    title: "Ecosystem Lock-in Reshapes Autonomous Freight Dynamics"
    body: "Cainiao's decision to cease internal vehicle production and transfer autonomous delivery assets to Zelos in exchange for an equity stake creates an entrenched distribution barrier. Embedding Zelos's dual-brand fleet into Cainiao's express dispatch system establishes high switching costs, insulating Zelos against rival robovan makers."
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP015"
