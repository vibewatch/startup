      - number: '6.4'
        title: 留存、耐久性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管业务量快速扩张，Zelos 仍面临明显的交易对手集中度和耐久性不确定性。超过 75% 的活跃车辆部署仍绑定 Cainiao 生态和 China
              Post，使公司面临封闭企业买家带来的利润率压缩，以及与竞争快递网络的渠道冲突。虽然 Zelos 已确认 Cainiao
              不会持有控股股权，但商业排他安排可能阻碍无关联包裹承运商采用该平台。此外，公共道路运营仍有未解决的监管和法律责任：市政试点要求每辆车至少 RMB 3 million
              的商业责任保险，而全国交通框架仍缺乏针对自动驾驶货运车碰撞的明确责任归属标准。
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 平台与生态高度集中
            body: >-
              Zelos 报告的商业车队部署中，超过 75% 直接绑定 Cainiao Network 生态和 China Post 集中采购。虽然这带来了超过 20,000 辆的空前部署规模，却也使 Zelos
              暴露于极端交易对手依赖、封闭合同定价压力，以及 SF Express 或 JD 等第三方快递商将其视为 Alibaba 控制的运输部门后产生的潜在渠道冲突。
