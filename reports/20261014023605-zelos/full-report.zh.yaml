      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >-
              Zelos 自动驾驶车辆的路线级单位经济性，取决于车辆摊销、电力成本、远程驾驶监管和客户收费率之间的平衡。2025 年下半年的关键运营杠杆，是把远程监管人工支出压到月度运营成本的 3%
              以下，标志着业务从劳动密集型试点转向公共道路上更高的车人比。不过，路线级运营盈利不等于公司层面盈亏平衡。行业分析和公司联合创始人评论显示，剔除研发支出后的运营盈亏平衡，需要维持约 50,000
              辆活跃车队。Cainiao 整合后，合并部署订单约 20,000 辆，Zelos 已跨过 10,000 辆的商业验证门槛，但仍低于实现公司自给所需的关键规模，固定研发开支仍依赖外部股权融资。
