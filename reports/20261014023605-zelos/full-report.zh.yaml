      - number: '4.4'
        title: 资本充足性与融资轨迹
        blocks:
          - type: paragraph
            body: >-
              Zelos 积极进行股权融资，为硬件工程、平台软件开发和车队商业化提供资金。2024 年末完成由 CDH BAIFU 和 Blue Lake Capital 领投的 $100 million Series
              B1，随后完成 Ant Group 领投的 Series B4；Cainiao 于 2026 年 1 月深度战略整合，注入自动驾驶车辆部门资产和现金，成为主要股东，同时保留 Zelos 的独立控制权。2026 年
              2 月，Zelos 完成超过 $300 million 的融资，累计公开融资超过 $800 million，公司估值超过 10 billion yuan（约 $1.4
              billion）。在并行公司交易中，Zelos 实体收购了在深圳上市的 Star Five Materials 持股载体的大量股权，并承诺 36 个月不控股锁定期。到 2026 年 4 月，有报道称 Zelos
              正与投行合作筹备潜在香港 IPO，拟募集约 $600 million，但交易时点、估值基准和发行规模仍在变化。
            claimRefs:
