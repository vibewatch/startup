      - number: '5.3'
        title: Cainiao 深度战略整合与双品牌运营模式
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月，Zelos 与 Cainiao 自动配送车辆部门深度战略整合，推动其运营模式发生变革。交易中，Cainiao 停止自动配送车辆的独立制造和直接商业销售，将车辆业务资产注入
              Zelos，并直接现金入股。Cainiao 自动驾驶车辆部门的管理和技术团队转入 Zelos，将 Cainiao 的前沿基础模型——尤其是视觉语言模型和世界模型——与 Zelos 覆盖中国 300 多座城市、近
              100 million km 真实开放道路的海量运营数据结合。在由此形成的双品牌架构下，Zelos 为 Alibaba 履约网络中的深度物流场景授权使用“Cainiao Autonomous
              Vehicles”品牌，同时继续以自有 Zelos 品牌服务公开市场商业客户、市政客户和海外客户。这一产业联合强化了 Zelos 的软件融合、供应链议价能力和客户锁定，也让 Cainiao
              无需在资产负债表上承担资本密集型车辆制造设施，就能标准化承运运输运力。
            claimRefs:
              - CE012
