      - number: '4.2'
        title: 定价机制与客户经济性
        blocks:
          - type: paragraph
            body: >-
              Zelos 围绕多个车辆载荷等级组织变现，包括 Z-series、E-series 和重型 L-series
              RoboVans。硬件单车目录价对企业和车队部署给予折扣；软件和云端车队管理则按经常性平台订阅或结构化分期收费。在高货量的快递枢纽到网点转运环节，客户运营经济性是部署车辆的首要理由。中国快递网络每年处理数百亿件包裹，利润被压缩到几分钱甚至更低，使自动驾驶物流成为有效的降本工具。快递部署的真实商业运营数据表明，用
              Zelos 自动驾驶物流车辆替代传统司机驾驶配送车，可降低 60% 至 66% 的运营成本。这一成本优势推动重复购车，并把业务从包裹快递扩展到超市杂货、生鲜和工业零部件配送。
            claimRefs:
              - CI001
