            body: >-
              每辆车替代 2 至 3 名传统快递员，并把远程驾驶成本降至月度运营支出的 3% 以下，Zelos 为物流运营商带来预计 50% 至 66%
              的运营成本下降。这一快速回本模式帮助公司在中央研发实现盈亏平衡前，就从技术示范走向正向毛运营利润。
