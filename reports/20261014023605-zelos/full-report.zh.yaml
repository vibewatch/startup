      - number: '5.4'
        title: 监管测试、全球道路认证与工程风险因素
        blocks:
          - type: paragraph
            body: >-
              无人物流车辆商业化必须严格遵守跨司法辖区的功能安全和道路适用性标准。2023 年 12 月，Zelos 成为首个通过 ISO 22737 日间和夜间场景评估的自动配送产品，并取得 TÜV Rheinland L4
              自动驾驶系统性能测试中国标认证。在新加坡，公司参与 TR-68 自动驾驶车辆标准的技术修订，通过里程碑式 M1 验证评估，并取得该国首张自动驾驶物流车辆许可，支持与 NTUC FairPrice
              开展城市转运试验。2026 年 9 月，Zelos 在比利时取得官方 Y Test Plate，将 RoboVans 纳入比利时国家车辆评估框架，成为唯一参与其中的欧洲 robovan。在国内运营中，公司与
              NavInfo 合作开展车路云融合和法定地理数据合规。尽管运营里程碑不断，技术风险仍在：关于平均脱离接管距离（MDBD）和远程驾驶接管比例的第三方佐证尚未披露，车辆与远程操作员的配比也未验证。此外，依赖单一来源
              Tier-1 传感器伙伴、各地区无人驾驶道路许可差异，以及严寒天气下性能下降，仍是持续的工程挑战。
            claimRefs:
              - CE015
              - CE016
