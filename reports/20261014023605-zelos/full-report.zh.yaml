      - number: '3.2'
        title: 技术架构与制造差异化
        blocks:
          - type: paragraph
            body: >-
              robovan 行业的技术差异化，取决于自研车规级硬件整合与开放道路算法成熟度之间的取舍。Zelos 自研完整自动驾驶技术栈，部署功耗低于 100 W 的 L4 计算平台，并协调由
              LiDAR、毫米波雷达、高分辨率摄像头和超声波传感器组成的 360 度传感器融合套件 [CP005]。这一能效优势与广泛制造基础设施结合：Zelos 控制六座工厂，合计年产能 45,000
              辆自动驾驶车辆。直接竞争者 White Rhino 于 2026 年 4 月与 Xinyuan Automobile 建立 OEM 合资企业，推出车规级 White Rhino RX 配送车生产，以配合
              Huolala 和 SF Express Same-City 运营，从而回应这一制造领先优势 [CP007]。与此同时，Cainiao 的资产注入把低成本 GT-Lite 车辆平台带入 Zelos，设定低于
              $10,000 的 robovan 制造基准，并利用覆盖中国 200 多个市的监管批准，简化本地商业落地 [CP013]。
            claimRefs:
              - CP005
              - CP007
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: 配送定价模式、路线经济性与成本结构
        blocks:
          - type: paragraph
            body: >-
              用自动驾驶 robovans 替代现有快递网络的经济理由，在于大幅压低可重复路线的支出。商业部署数据显示，在标准化城市邮路上，robovans 可将订单配送费用降低 35% 至 45%，把传统人工快递劳动下约
              ¥0.32 的包裹配送单位成本降至每件 ¥0.126 [CP004]。行业商业包装已转向交钥匙 Transport-as-a-Service
              模式，硬件资本成本在多年运营服务合同中摊销。不过，公开市场分析师强调，Zelos 报告的单位成本指标尚未得到经审计财报或细粒度路线级毛利验证，底层运营经济性仍不清晰 [CP009]。对公开自动驾驶同业
              WeRide 的 SEC 文件自动检索显示，商业自动驾驶物流利润率的已验证监管披露基准仍未出现在公开文件中，合同层面的盈利能力和车队维护成本仍未验证 [CP014]。
            claimRefs:
              - CP004
              - CP009
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP013
      - number: '3.4'
        title: 可防御性、生态锁定与不利监管因素
        blocks:
          - type: paragraph
            body: >-
              Zelos 的竞争壁垒，主要由其与 Alibaba Group 战略交易形成的结构性分销锁定加固。根据合并协议，Cainiao 停止内部自动驾驶车辆制造，并将“Cainiao Autonomous
              Vehicles”品牌授权给 Zelos，同时把技术高管和运营人员直接安排到 Zelos 董事会及执行管理层 [CP006]。这种深度运营协同把 Zelos 双品牌车队直接嵌入 Cainiao
              全国站点调度软件，形成高昂切换成本，使竞争 robovan 运营商难以在 Cainiao 物流枢纽内轻易多归属 [CP015]。不过，Zelos 在推进据报道 $600 million
              的香港首次公开募股时，仍面临重大资本和监管阻力；该 IPO 紧随 2026 年 2 月 $100 million 的 Series B+ 轮融资
              [CP008]。市场观察人士警告，鉴于收入数据尚未公开，自动驾驶出行行业的初步 IPO 估值在路演尽调期间仍容易下调
              [CP009]。此外，中国大陆市政安全治理审查，以及对跨境自动驾驶数据传输的严格监管，会给国际部署带来运营和时程摩擦 [CP010]。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP015
