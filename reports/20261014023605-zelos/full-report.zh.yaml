  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与支出范围
        blocks:
          - type: paragraph
            body: >-
              Zelos 的可服务市场聚焦城市自动驾驶货运，具体是低速 L4（Level-4）配送
              robovans，覆盖社区末端履约，以及配送枢纽与区域配送站之间的城内中程运输。市场边界明确包括城市包裹快递、区域化食品杂货履约和封闭园区货物移动；车辆在指定道路上以低于 50 km/h
              的受控速度运行。相反，市场不包括长途高速公路货运（Class 8 重型卡车）和乘用车
              robotaxi，二者需要不同的监管框架、传感器架构和责任结构。现有替代方案主要是人工驾驶电动两轮车、三轮配送车和有人驾驶轻型商用车（LCVs）。瞄准低速、可重复的城市路线后，自动驾驶 robovans
              把快递运营从劳动密集型变动成本模式转向摊销资本和服务合同模式。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 约束与测算视角
        blocks:
          - type: paragraph
            body: >-
              估算自动配送 robovan 市场需要多个分析视角，依据真实配送量和商用车替换动力，而不是推测性的自上而下估计。根据 China State Post Bureau 发布的统计，快递行业仅 2026
              年第一季度就处理了 47.73 billion 件包裹，同比增长
              5.8%，构成庞大的业务量基线。可服务市场（SAM）包括高密度城市地区及地方政府授予自动驾驶商用车合法上路许可的区域配送走廊。在这一服务范围内，可获得市场（SOM）由主动部署 L4
              车队、以应对快递员工资上涨和人员流失的物流运营商定义。商用车队足迹显示渗透迅速：截至 2024 年年中，Zelos 已在 130 座城市部署超过 1,000 辆自动驾驶车辆，配送订单超过 100 million
              件；与 Cainiao 战略整合后，整合商业车队扩大至超过 20,000 至 25,000 辆。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              自动驾驶物流车辆的商业采用，分化为企业快递网络、电商零售平台和本地园区设施等不同买家画像。主要买家是大型包裹快递承运商和货运聚合商，尤其是 Cainiao 及快递加盟商；它们通过购买车队或
              Robo-as-a-Service（RaaS）交钥匙运营租赁采购自动驾驶车辆。这些组织的预算通常由物流运营副总裁和区域分支机构经理掌握，目标是降低单件配送成本并缓解零售旺季的快递员短缺。第二类客户包括产业园、企业园区和市政机构，它们购买自动化内部运输运力，以提高调度安全性并降低场地运营支出。采用路径通常从本地运营设计域（ODDs）的边界明确试点开始，待路线级成本证明可与人工快递员持平后，再扩大到完整车队部署。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、单位经济性与运营约束
        blocks:
          - type: paragraph
            body: >-
              自动驾驶城市货运的长期扩张由人口结构压力和有利的单位经济性推动。在中国及成熟国际市场，老龄化限制了快递员供给，推高配送工资和人员流失。行业数据表明，自动配送车辆通过持续运行、减少人工成本，可让物流客户的运营配送成本平均下降
              62%。此外，换电架构能实现 24/7
              车辆在线，解决传统电动配送车的续航和充电瓶颈。不过，采用仍受实质性约束：运营域需要预先绘制高精地图，极端天气会削弱光学感知，国际市政监管也比中国支持商业测试的政策更加碎片化。大规模车队部署还需要大量前期资本支出和专业维护基础设施。
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 物流优先自动驾驶的务实转向
            body: >-
              与受复杂责任和监管僵局拖累的乘用车 robotaxi 开发商不同，城市物流自动驾驶受益于较低车速、可重复路线和清晰的运营 ROI。Zelos 估值超过 $1 billion，且与 Cainiao
              战略整合，反映资本正系统性转向货运自动化。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: 市政许可碎片化与车队资本密集度
            body: 中国一线和二线城市的商业道路测试政策高度支持，但向东南亚和中东扩张会面对碎片化市政监管、本地化制图前置要求，以及大量前期车辆制造资本需求。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 商业格局：直接同业、既有厂商与封闭运营商
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月，Zelos Technology 与 Cainiao 自动驾驶部门合并，形成估值约 $2 billion 的合并实体，中国城市自动驾驶物流格局由此发生决定性整合 [CP001]。以
              Cainiao Robovan 名义运营的合并业务，管理着超过 20,000 辆专用于城市快递和末端包裹配送的 robovans [CP002]。Zelos 已占据中国一线快递承运商超过 70% 的市场份额，与
              Neolix 及 SF Express 支持的 Rino.ai 等直接自动驾驶 robovan 同业形成明确商业区隔 [CP003]。企业客户承诺，尤其是 China Post 创纪录采购 7,000
              辆无人厢式车的订单，为市政邮路锚定了高密度配送量 [CP011]。不同于 JD Logistics 和 Meituan 开发、局限于自有配送网络的封闭内部配送系统，Zelos
              是外部承运商技术伙伴。与此同时，Zelos 已在 Abu Dhabi 开始国际运营，并在 Kuala Lumpur 与 Pos Malaysia 达成合作，将 L4 配送架构出口给东南亚和中东邮政运营商
              [CP012]。
            claimRefs:
              - CP001
              - CP002
              - CP003
