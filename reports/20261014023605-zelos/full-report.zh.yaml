chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营规模与商业定位
        blocks:
          - type: paragraph
            body: >-
              Zelos Technology 于 2021 年 8 月成立，总部位于江苏省苏州（正式名称为 Jiushi Suzhou Intelligent Technology Co.,
              Ltd.），开发并制造面向开放道路城市货运的 L4 级自动驾驶物流车辆。不同于商业化周期漫长的乘用车 robotaxi 运营商，Zelos 瞄准快递配送、药品运输、FMCG
              分销和产业园运输等商业物流场景。经过激进的部署节奏，以及 2026 年 1 月与 Alibaba 旗下 Cainiao 物流部门进行的关键战略资产整合，合并后的运营企业管理着超过 20,000 辆自动驾驶
              RoboVans，覆盖国内 300 多座城市及部分国际大都市。公司围绕硬件销售和灵活的车队软件租赁搭建商业化路径，已获得 China Post、Cainiao 及跨国零售分销商等重要企业客户。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
