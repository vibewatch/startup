      - number: '1.2'
        title: 创始人、高管团队与治理结构
        blocks:
          - type: paragraph
            body: >-
              Zelos 由 Baidu Apollo 自动驾驶计划的校友创立；中国工业界常把该计划称为本国机器人领域人才的基础训练营。创始人 Zhuang Li 于 2021 年年中从硅谷回国注册 Jiushi
              Intelligence，先搭建核心技术框架，随后引入首席执行官 Kong Qi。Kong 曾任 Baidu 硅谷首席车辆架构师和 JD.com 自动驾驶副总裁，直接负责消费者自动配送部署。2026 年 1 月
              Cainiao 无人配送部门并入 Zelos 后，Cainiao 高管加入 Zelos，协调末端配送枢纽的运营物流。这一制度性协同加深了与 Alibaba 的生态整合，但执行决策仍高度集中于创始人 Kong
              Qi，技术和战略路线执行均存在关键人依赖。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
