      - number: '1.4'
        title: 运营演进、产品架构与风险因素
        blocks:
          - type: paragraph
            body: >-
              Zelos 持续迭代硬件和算法，已从示范试点转向工业化批量生产。公司于 2024 年年中推出 Z-series 多场景平台，随后在 2025 年推出轻型 E-series 快递车和重型 L-series
              散货车。尤其是在 2025 年初，Zelos 部署无图 Occupancy Network 感知，绕开厘米级高精地图前置条件，加快城市走廊扩张。监管里程碑包括 2024 年 5
              月取得新加坡首张公共道路自动驾驶货运许可。不过，重大运营和财务风险仍在。公司管理层承认，真正实现运营盈亏平衡需要把活跃部署车辆扩至 50,000
              辆，且不计中央研发成本。主要路线级单位经济性、运营利润率及客户留存指标仍未公开，因此快速扩张车队能否转化为可持续运营利润仍未解决。
