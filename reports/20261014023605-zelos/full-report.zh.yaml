            title: 生态锁定重塑自动驾驶货运格局
            body: >-
              Cainiao 停止内部车辆生产、将自动配送资产转移给 Zelos 并换取股权，这一决定构筑了根深蒂固的分销壁垒。将 Zelos 双品牌车队嵌入 Cainiao 快递调度系统后，切换成本高企，Zelos
              得以抵御竞争 robovan 制造商。
