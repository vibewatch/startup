  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 企业物流采用的六阶段生命周期，从封闭园区可行性测试走向数千辆车队租赁铺开。
    data:
      items:
        - label: 阶段 1：封闭园区试点
          detail: 在大学校园、工业园区和微型履约中心等受控环境中测试无地图感知。
          touchpoints:
            - 可行性演示
            - 安全边界验证
            - 仿真台架测试
        - label: 阶段 2：市政许可与车道测试
          detail: 在首批城市取得地方政府道路测试许可、3M RMB 车辆保险，并完成车道级导航验证。
          touchpoints:
            - 市政试点许可
            - 非机动车道试验
            - 安全员配置
        - label: 阶段 3：商业试用与导入
          detail: 在固定的快递员至网点接驳路线上部署 Z 系列轻型车辆，并采用灵活的低成本硬件分期模式。
          touchpoints:
            - 低成本硬件分期
            - 快递网点接驳路线
            - 远程调度设置
        - label: 阶段 4：集中采购
          detail: 赢得中国邮政 7,000 辆车辆租赁采购等企业集中招标，并将客户转为固定定价。
          touchpoints:
            - 竞争性公开招标
            - 固定多年车辆租赁
            - 车队融资担保
        - label: 阶段 5：生态深度整合
          detail: 与 Cainiao 等战略平台全面合并运营，整合物流调度算法和双品牌执行。
          touchpoints:
            - Cainiao 双品牌授权
            - 仓库调度同步
            - 资产注入
        - label: 阶段 6：国际扩张
          detail: 通过 Cainiao 全球分拨枢纽与当地邮政伙伴，在新加坡、马来西亚和中东部署车辆。
          touchpoints:
            - 新加坡邮政试点
            - 马来西亚邮政物流枢纽
            - 欧洲车辆安全认证
    approximationNotes: 阶段演进代表根据企业披露和公开采购时间线综合归一化的商业生命周期。
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU008
