  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 车队与运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2027 年，车队扩大至 50,000 辆并达到盈亏平衡门槛；东南亚和中东试点转为商业化铺开。
        - 港交所 IPO 以 $2.5B 至 $3.0B 估值（10x-12x 收入倍数）完成，较人民币 10B 入场价带来 1.8x 至 2.1x MOIC。
        - 海外监管壁垒和电池供应链成本波动。
        - 概率 25%；取决于国际市场变现和商用车利润率得到验证。
      - - 基准情景
        - 到 2027 年底，车队增至 30,000-35,000 辆；国内 Cainiao 和中国邮政合同支撑基础运营。
        - 在结构化融资中，估值维持在人民币 10B 至 12B（$1.4B-$1.7B），实现 1.0x 至 1.2x MOIC，守住本金。
        - 美团和京东价格竞争挤压利润率；盈亏平衡推迟到 2027 年之后。
        - 概率 55%；与现有企业订单储备和当前车队扩张轨迹一致。
      - - 悲观情景
        - 车队增长停滞在 25,000 辆以下；路线经济性持续严重亏损；港交所上市延迟或折价。
        - 以 $700M 至 $900M 估值进行下轮重组或困境二级出售，导致 40% 至 50% 的资本损失。
        - 现金储备耗尽、Alibaba 生态内包，以及城市公共道路监管收紧。
        - 概率 20%；有港交所公开交易不利先例及行业高现金消耗支撑。
    notes: 情景概率和回报预期反映了人民币 10B（$1.4B）至 $2.0B 的投后估值。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV010
      - CV011
