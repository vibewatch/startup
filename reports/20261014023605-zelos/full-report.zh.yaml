            body: >-
              Cainiao 停止独立车辆制造、将自动驾驶物流部门直接注入 Zelos，构筑了强大的运营和算法壁垒。Zelos 不再以外部供应商身份与 Alibaba
              生态竞争，而是获得封闭商业需求、双品牌身份，以及接入基于全国包裹吞吐量训练的前沿基础模型架构。
            calloutType: insight
