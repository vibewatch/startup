              - CI013
              - CI014
      - number: '4.5'
        title: 财务投资判断与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从机构投资判断看，Zelos 在中国快递和城市物流生态中展现出卓越商业速度和真实的产品市场契合度，并得到国家级采购合同及 Alibaba
              物流生态战略协同的支持。不过，投资案例仍受财务可见性严重不足制约。尽管公司报告超过 20,000 辆车辆部署订单和超过 $800 million
              的累计融资，却尚未公布经审计财报、历史收入确认数据、各车型毛利率或净运营现金消耗率。未来经济轨迹高度取决于计划中的 $600 million 香港 IPO 能否成功，以及活跃部署能否从 20,000 辆扩至
