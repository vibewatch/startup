  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将运营规模、生态支持、单位经济性、估值基准、退出风险与投资建议串联起来的逻辑决策流程。
    data:
      nodes:
        - id: scale-proof
          label: 1. 运营规模：20,000 辆 robovan 已部署于 300+ 座城市，累计配送量达 1.5B+
        - id: ecosystem-backing
          label: 2. 战略整合：Cainiao Robovan 部门合并与 Ant Group 资本投入，打造封闭式物流渠道
        - id: opaque-economics
          label: 3. 单位经济性存在歧义：路线利润率与现金消耗未披露；目标在 50,000 辆时实现盈亏平衡
        - id: valuation-disconnect
          label: 4. 估值差异：已确认的 RMB 10B（$1.4B）与未经佐证的 WSJ 报道 $2.0B
        - id: public-market-drag
          label: 5. 公开市场先例：香港同业 Pony.ai 和 WeRide 的 IPO 首日发行价破发
        - id: recommendation-verdict
          label: 6. 最终立场：建议继续研究，风险评级高，估值判断为合理
