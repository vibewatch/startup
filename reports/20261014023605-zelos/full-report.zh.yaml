  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 车辆平台、货舱模块化与硬件工程
        blocks:
          - type: paragraph
            body: >-
              Zelos 的自动配送产品围绕专门打造的电动底盘设计，专用于无人货运，而非将乘用车改装。旗舰 Z-Series 平台以量产 Z5 城市物流车为核心，并延伸至更大的
              Z8，为零售、包裹配送和医疗系统的末端及中程路线提供标准化货运能力。车辆硬件架构优先提高货舱体积效率：货舱约占整车空间的 60%，额定最大载荷为 1,800 kg。空载续航达到 220 km，满载达到 170
              km；快充能力约两小时充满电池，支持连续多班次调度。为服务不同垂直行业，底盘支持热插拔货舱模块，可配置为标准快递包裹配送、冷链配送、市政环卫、市政监控和城市空气质量检测。2025 年 5 月，Zelos 推出
              E-Series 平台及首款 E6 车型，新增按需全自动驾驶（FSD）订阅模式。2026 年，公司与 CCTEG Changzhou Research Institute 合作推出 T5 Automated
              Transport Unit，进入地下交通自动化，服务专业地下工业运输。
            claimRefs:
              - CE001
