  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与跨境合规风险
        blocks:
          - type: paragraph
            body: >-
              自动驾驶商业配送业务仍暴露于中国大陆碎片化的市政监管：车辆道路测试许可、指定交通车道和无人调度批准，在不同市级交通局之间差异很大。不同于适用标准化区域试验制度的乘用自动驾驶车辆，商用货运 robovans
              行驶于靠近行人的城市配送路线，任何局部交通事故都可能引发更严格的市政审查。在中国以外，国际扩张带来法律复杂性和本地合规摩擦；Zelos 虽通过新加坡 M1 安全测试并取得初始自动驾驶物流许可，但进入
              Malaysia 等邻近市场仍受限于六个月概念验证框架。此外，合并后估值基准的公开披露相互冲突——中国国内报告为 RMB 10 billion，国际媒体估计为 $2
              billion——凸显持续存在的报告歧义，需要与正式监管文件核对。
            claimRefs:
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
      - number: '7.2'
        title: 商业车队经济性与较高盈亏平衡门槛
        blocks:
          - type: paragraph
            body: >-
              Zelos 的商业扩张战略取决于跨过激进的运营规模门槛，以抵消自动驾驶研发的持续资本消耗。2026 年初与 Cainiao 自动驾驶物流部门合并后，公司部署车队扩大至 20,000 多辆 robovans，覆盖
              300 座城市。但公司联合创始人已公开披露，要实现包含软件工程、传感器栈迭代和集中远程驾驶基础设施在内的整体公司盈亏平衡，需要约 50,000 辆 robovans
              的运营车队。在中国市场，快递加盟商报告微观经济性具有吸引力：月度车辆支出降至 RMB 2,000–3,000，包裹转运成本最多下降
              50%。然而，更广泛的行业基准确认，中国自动配送开发商仍背负大量累计亏损，因此向东南亚和中东激进扩张，成为长期财务可持续性的结构性必要条件。
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR012
              - CR013
      - number: '7.3'
        title: 生态集中与 Cainiao 的治理纠缠
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月 Zelos 与 Cainiao 的战略整合改变了行业竞争格局，但也引入了严重的交易对手依赖和公司治理纠缠。Cainiao
              注入自动驾驶车辆业务并直接现金投资，以换取重要股权，同时在双品牌运营模式下将“Cainiao Autonomous Vehicles”品牌授权给 Zelos。尽管公司发言人强调 Cainiao
              不会持有控股股权，但 Cainiao 对中国电商履约的主导影响造成严重平台集中。如果 Alibaba Group 与 Zelos 管理层的战略重点出现分歧，Zelos
              可能在竞争物流生态之间遭遇渠道冲突或商业自由受限。这一平台暴露又叠加了国内客户集中度，2025 年末与 China Post 签署的标志性 7,000 辆集中租赁采购订单便是例证。
            claimRefs:
              - CR003
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR011
      - number: '7.4'
        title: 运营安全、供应链与新兴竞争者威胁
        blocks:
          - type: paragraph
            body: >-
              在多种真实运营场景下保持可靠运行，是 Zelos 面临的首要执行风险。公司的标准 L4 硬件架构由固态 LiDAR、 高分辨率摄像头、毫米波雷达和一套功耗低于 100 W
              的自研计算单元组成。在内蒙古长距离草原环线上的部署， 已证明系统能覆盖 100 公里级路线；但暴雨、浓雾和极寒等恶劣天气会造成边缘场景感知退化，可能迫使车辆
              自动停车，或需要远程操作员介入。在海外司法辖区，Zelos 依赖本地中间商——例如马来西亚独家经销商 Autonomous Logistic
              Solutions——如果当地伙伴难以做好商用车队维护，执行就会卡住。同时，资金充足的 国内物流同行 JD、Meituan 和 SF Express，以及正在商业化竞品城市配送平台的专业汽车零部件供应商
              QCraft、Desay SV，都在加大竞争压力。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR014
              - CR015
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 商业化陷阱：车队扩张与路线经济性
            body: >-
              Zelos 已将合计运营车队迅速扩张至 20,000 辆 robovan 以上，但公司管理层明确承认，若计入研发费用， 全公司要实现盈亏平衡约需 50,000
              辆活跃车辆。在单位盈利能力尚未验证前就进入中国二线城市和东南亚市场， 会形成现金消耗跑步机：车队折旧和本地化成本超过新增快递加盟商带来的利润。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
          - type: callout
            title: 关键治理与监管尽调里程碑
            body: >-
              潜在投资者应把东南亚试点转化和 Cainiao 治理协议正式落地视为必经的闸门里程碑。尽调必须确认 Cainiao 是否拥有清算否决权或客户锁定限制，同时跟踪国际 PoC
              能否在补贴试点阶段之后成功转化为具有约束力的 商业租赁合同。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资主论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Zelos 的核心投资主论点，是它在中国城市自动驾驶货运物流市场的商业领先地位：运营车队已超过 20,000 辆 robovan，覆盖 300 多座城市，累计配送量达 1.5B 单。2026 年 1 月与
              Alibaba 旗下 Cainiao 物流部门 战略整合，以及 2025 年 10 月从 China Post 拿下 7,000 辆车的集中采购订单，带来了无可匹敌的路线密度 和被锁定的企业需求。Z5
              等标准化硬件平台具备 6.5 立方米货容和 1,000 千克载荷能力，已让商业配送客户 的运营成本下降 66%。反论点则集中在经济数据不透明和资本密集度过高。Zelos 尚未披露经审计的收入、
              毛利率或现金消耗率。管理层虽称剔除研发费用后已实现运营盈亏平衡，但公司领导层承认，要实现全面运营 盈亏平衡，活跃车辆数约需达到 50,000 辆。此外，过度依赖 Alibaba 的封闭需求、Meituan 和
              JD 的激烈 竞争，以及硬件制造和车队运营持续高额的资本开支，都可能压缩利润率。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Zelos 于 2026 年 2 月完成了一轮阶段未披露、规模超过 $300 million 的 Series B 增资，使其自 2021 年 创立以来六轮融资的累计披露融资额超过 $800
              million。该交易对 Zelos 的估值为人民币 10 billion （约合 $1.38 billion 至 $1.4 billion），使其成为首家估值跨过百亿元人民币门槛的国内 RoboVan 独角兽。
              其资本结构中的知名机构支持者包括 Ant Group、Blue Lake Capital、CDH Investments、Baidu Ventures、 Meituan
              和地方政府投资基金。与此同时，Alibaba 旗下物流子公司 Cainiao 以其自动驾驶车辆部门和现金 换取股权，完成了一笔战略交易，并确认 Cainiao 不会成为控股股东。然而，尽调发现估值存在重大差异：
              Wall Street Journal 和 Reuters 的报道称，Cainiao 合并后的业务估值约为 $2.0 billion。由于主要资本
              化表和优先权条款仍未披露，潜在投资者必须严格控制估值纪律，将入场估值锚定在已交叉验证的人民币 10 billion，而不是投机性的头条数字。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: 可比公司与公开市场基准
        blocks:
          - type: paragraph
            body: >-
              将 Zelos 与自动驾驶和企业机器人领域的上市及非上市同行比较，可以看到估值倍数分化很大，市场信号也颇为 谨慎。企业人工智能和专业机器人二级市场交易显示，估值倍数从企业平台 C3.ai 的 5.4x
              收入，到中国视觉 服务商 Extreme Vision 的 10.0x，再到 Infleqtion 等资本密集型前沿科技公司的 40x 以上不等。更关键的 估值信号来自中国自动驾驶领军企业 Pony.ai 和
              WeRide 最近在香港交易所进行的 IPO。两家公司上市首日 都跌破发行价；公开市场投资者更看重通往 GAAP 盈利的可验证路径，而不是自动驾驶车辆部署数量。Zelos 据报 正考虑在香港 IPO、募资约
              $600 million；公开可比公司的表现表明，除非路线层面的单位盈利能力得到确证， 私募轮估值人民币 10 billion 进入二级公开市场后可能面临明显的倍数压缩和折价压力。
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 情景分析：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              这套三情景框架沿着不同的运营和资本市场路径，评估 Zelos 的风险调整后回报。乐观情景假设，在国内邮政 持续部署、Cainiao 业务量增长以及东南亚和中东国际扩张加速的推动下，Zelos 到 2027
              年将活跃车队扩至 管理层盈亏平衡目标 50,000 辆 robovan。在这条路径下，若以 $2.5 billion 至 $3.0 billion 的估值成功
              在香港上市，股权回报将颇具吸引力。基准情景中，车队继续以稳定的国内速度增长至 30,000 至 35,000 辆， 但 JD 和 Meituan 的竞争性降价压力会把全面运营盈亏平衡推迟到 2028
              年。估值维持在当前人民币 10 billion（$1.4 billion）基准附近，能够保住本金，但回报上行有限。悲观情景则假设持续亏损、监管 放缓或 Alibaba
              客户集中度引发反弹，导致估值大幅削减。如果公开市场投资者将香港可比公司的折价用于 这一尚未验证的商业模式，估值可能压缩至 $700 million 至 $900 million，相比当前私募估值面临 40% 至
              50% 的下行风险。
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV011
      - number: '8.5'
        title: 退出准备度、尽调要求与最终建议
        blocks:
          - type: paragraph
            body: >-
              Zelos 已展现出强劲的商业牵引力和运营规模，与早期自动驾驶概念项目拉开差距；超过 $800 million 的累计 股权资本、China Post 的标杆客户部署，以及与 Pos Malaysia
              的国际运营试点，都进一步增强了这一点。不过， 投资建议必须对价格敏感、以证据为准，而不能不加批判地认可车辆规模。国内人民币 10 billion 的报道与 Wall Street Journal 的 $2.0
              billion 数字存在差异，加之单位贡献利润率未披露、香港公开市场先例不利， 因此目前不能给出买入建议。我们给出“继续研究”建议，风险评级为高，合理估值锚定人民币 10 billion （$1.4
              billion）。任何 Cainiao 或 China Post 重要客户合同流失、硬件交付出现负毛利的证据，或因治理/
              知识产权争议导致上市延迟，都会触发论点破裂并促使评级下调至“回避”。要升级为买入，必须有经审计的 cohort 财务数据确认路线层面贡献利润为正，并完成主要资本表核验。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 以人民币 10 billion 为基准的审慎“继续研究”立场
            body: >-
              Zelos 将活跃 robovan 车队扩至 20,000 辆，并把 Cainiao 自动驾驶部门与 China Post 的 7,000 辆采购合同
              结合起来，展现了出色的实体执行能力。然而，单位经济性、毛利率和现金消耗均未经审计，香港上市同行又在 上市首日普遍大幅折价；在审计确认路线贡献利润为正之前，投资者应保持“继续研究”立场，不要支付高于 人民币 10
              billion（$1.4 billion）私募基准的价格。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: callout
            title: 公开市场倍数压缩带来的下行敞口
            body: >-
              中国自动驾驶领军企业 Pony.ai 和 WeRide 最近在香港交易所上市，首日均跌破 IPO 发行价，显示公开市场对尚未验证的 L4 单位经济性高度怀疑。如果 Zelos 计划募资 $600 million
              的香港 IPO 在申报前仍无法证明路线盈利，相关传闻将面临二级市场折价或低于上一轮估值定价的重大风险。
            calloutType: risk
            claimRefs:
