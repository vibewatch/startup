            body: >-
              尽管 Zelos 强调大型车队数据（声称中国大陆拥有超过 25,000 辆 robovans）和广泛道路里程，但缺少公开脱离接管报告或远程操作员监管比例，造成尽调不透明。没有每 1,000 km
              人工干预频率的经审计数据，真正的无人驾驶人工成本经济性无法独立验证。
            calloutType: risk
            claimRefs:
