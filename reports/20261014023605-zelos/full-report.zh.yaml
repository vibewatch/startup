      - number: '1.3'
        title: 融资轨迹、战略资本与估值里程碑
        blocks:
          - type: paragraph
            body: >-
              Zelos 获得了商业机器人领域机构和产业资本的强力支持。自成立以来六轮独立融资中，有五轮单笔超过 $100 million，累计披露股权资本超过 $800 million（约 RMB 5.5
              billion）。主要机构支持者包括 Sequoia China、CDH Investments、Legend Capital，以及产业战略巨头 Ant Group 和 Cainiao。2026 年 2
              月，Zelos 完成一轮超过 $300 million 的融资，投后私有估值升至 RMB 10 billion 以上（约 $1.4 billion），成为中国首个官方 RoboVan 独角兽。到 2026 年 4
              月，财经媒体报道称公司已与投行讨论计划中的香港首次公开募股，拟募集约 $600 million 毛收入。
            claimRefs:
