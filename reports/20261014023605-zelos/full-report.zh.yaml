      - number: '6.3'
        title: 具名客户实证与运营部署
        blocks:
          - type: paragraph
            body: >-
              商业验证由中国旗舰企业客户以及东南亚初期跨境部署支撑。2025 年 10 月，Zelos 赢得 China Post 集中采购项目，租赁 7,000 辆无人货运车辆，取得有记录以来最大的公开商业 L4
              货运车辆订单。2026 年 1 月，Zelos 与 Alibaba 物流部门 Cainiao Network 完成变革性战略整合；Cainiao 注入自动驾驶车辆业务和现金，共同打造双品牌运营的 RoboVan
              超级承运商。在中国大陆以外，Zelos 利用 Cainiao 的国际配送中心，与 Singapore Post 和 Malaysia Post 建立商业试点合作；按需配送巨头 Meituan 则作为 Z5
              配送平台的领投方和早期部署伙伴参与其中。
            claimRefs:
              - CU002
