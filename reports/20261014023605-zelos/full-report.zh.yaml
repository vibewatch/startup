  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zelos 采用混合商业模式，结合自动驾驶车辆直接硬件销售、软件平台授权和企业车队租赁。历史上，自动驾驶物流服务商受制于僵化的一次性设备销售，给区域快递加盟商带来难以承受的资本支出。Zelos
              通过低价车辆硬件定价和分期支付的经常性软件许可费降低采用门槛，且经常由金融合作方的信用担保承保。对主要企业客户，变现采用多年期集中运营租赁合同，例如 China Post 于 2025 年 10
              月授予的集中采购项目，覆盖小、中、大容量车型共 7,000 辆无人车辆租赁。2026 年 1 月与 Cainiao 战略整合后，商业变现还包括生态运输运力服务：Cainiao 聚焦核心电商物流场景，Zelos
              提供全场景自动配送运力。
