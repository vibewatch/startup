      - number: '5.2'
        title: 自动驾驶计算、感知栈与传感器供应架构
        blocks:
          - type: paragraph
            body: >-
              核心自动驾驶系统采用自研全栈 L4 架构，覆盖感知、统一神经感知、世界建模和车辆运动控制。在计算层，Zelos 部署自研域计算平台，热耗散低、能耗低于 100
              W，既保留牵引电池容量用于配送续航，也支持无风扇或紧凑型被动式车辆集成。感知栈整合 360 度环视感知，包括远距和近距
              LiDAR、毫米波雷达、高分辨率车载摄像头及超声波传感器。该套件在密集城市环境中提供毫米级空间精度，可解析复杂标志、交通信号、小型道路障碍和动态行人流。为保障商业量产所需的车规级传感器供应，Zelos 与
              Hesai Technology（NASDAQ: HSAI）签订 200,000 个车规级 LiDAR 的独家生产协议，使 Hesai 成为最新一代 RoboVan
              产品线的标准设备。软件执行整合感知到控制的一体化智能，降低架构模块交接延迟，并在跨海大桥、复杂路口、未铺装乡道及多尘或湿雨环境中维持确定性的失效可运行安全边界。
            claimRefs:
              - CE008
