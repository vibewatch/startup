            body: >-
              Zelos 正准备以 $2 billion 估值基准推进目标募资 $600 million 的香港
              IPO，但财务分析师强调，公司尚未公布经审计的收入或路线级毛利。缺少可验证的运营单位经济性，公开市场估值仍面临路演期间下调风险。
            calloutType: risk
