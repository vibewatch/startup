callouts:
  - calloutType: "insight"
    title: "Strategic Asset Injection from Cainiao Shifts Competitive Dynamics"
    body: >
      Cainiao's decision to cease independent vehicle manufacturing and inject its autonomous logistics unit directly into Zelos provides a formidable operational and algorithmic moat. Rather than competing as an external vendor against Alibaba's ecosystem, Zelos secures captive commercial demand, dual-brand identity, and access to frontier foundation model architectures trained on nationwide parcel throughput.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
  - calloutType: "risk"
    title: "Critical Teleoperation and Disengagement Metrics Remain Hidden"
    body: >
      While Zelos highlights large fleet figures (>25,000 robovans claimed across mainland China) and extensive road mileage, the absence of public disengagement reporting or remote teleoperator oversight ratios creates diligence opacity. Without audited data on human intervention frequency per 1,000 km, true driver-out labor economics cannot be independently verified.
    claimRefs:
      - "CE014"
      - "CE015"
      - "CE016"
