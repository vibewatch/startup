chapter:
  number: 5
  title: "Product & Technology"
  summary: "Zelos develops and manufactures Level-4 autonomous delivery RoboVans across the Z-Series and E-Series platforms, operating with in-house compute under 100W, proprietary multi-sensor perception stacks, and a dual-brand operational integration with Cainiao. Supported by 200,000-unit automotive-grade LiDAR commitments from Hesai and international safety certifications from TÜV Rheinland, the company has deployed vehicles across 300 Chinese cities while actively pursuing European road trials and underground automated mining transit."
sections:
  - id: "vehicle-platforms-and-hardware-specs"
    title: "Vehicle Platforms, Cargo Modularity, and Hardware Engineering"
    body: >
      Zelos structures its autonomous delivery offerings around purpose-built electric chassis designed exclusively for unmanned cargo transport rather than retrofitted passenger vehicles. The flagship Z-Series platform, anchored by the mass-produced Z5 urban logistics vehicle and extended via the larger Z8 model, provides standardized freight capacity for last-mile and middle-mile routes across retail, parcel delivery, and healthcare systems. The vehicle hardware architecture prioritizes volumetric cargo efficiency: the cargo compartment occupies approximately 60% of total vehicle space, supporting a rated maximum payload of 1,800 kg. Operational range reaches 220 km unloaded and 170 km fully loaded, supported by fast-charging capabilities that achieve a full battery recharge in approximately two hours for continuous multi-shift dispatch. To serve diverse vertical industries, the chassis supports hot-swappable cargo modules configured for standard express parcel delivery, refrigerated cold-chain distribution, municipal sanitation, municipal surveillance monitoring, and urban air quality detection. In May 2025, Zelos expanded its hardware portfolio with the introduction of the E-Series platform and its debut E6 model, introducing on-demand full self-driving (FSD) subscription models. In 2026, the company entered underground transit automation by partnering with CCTEG Changzhou Research Institute to launch the T5 Automated Transport Unit, addressing specialized subterranean industrial haulage.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
  - id: "autonomous-stack-and-sensor-architecture"
    title: "Autonomous Driving Compute, Perception Stack, and Sensor Supply Architecture"
    body: >
      The core autonomous driving system operates on a proprietary full-stack Level-4 architecture spanning sensing, unified neural perception, world modeling, and vehicle motion control. At the compute layer, Zelos deploys an in-house developed domain computing platform characterized by low thermal dissipation and an energy footprint of below 100 W, preserving traction battery capacity for delivery range and enabling fanless or compact passive vehicle integration. The perception stack integrates 360-degree surround sensing combining long-range and short-range LiDARs, millimeter-wave radars, high-resolution automotive cameras, and ultrasonic sensors. This suite provides millimeter-level spatial precision across dense urban environments, resolving complex signage, traffic signals, small road hazards, and dynamic pedestrian flows. To secure automotive-grade sensor volumes for commercial series production, Zelos entered an exclusive production agreement with Hesai Technology (NASDAQ: HSAI) for 200,000 automotive-grade LiDAR units, establishing Hesai as standard equipment across its latest-generation RoboVan lineup. Software execution integrates seamless perception-to-control unified intelligence, reducing architectural module handoff latency while maintaining deterministic fail-operational safety bounds across sea-crossing bridges, complex intersections, unpaved rural roadways, and dust-heavy or rain-soaked environments.
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "cainiao-integration-and-ecosystem-operating-model"
    title: "Cainiao Deep Strategic Integration and Dual-Brand Operating Model"
    body: >
      A transformative evolution in Zelos's operating model occurred in January 2026 through a deep strategic integration with Cainiao's autonomous delivery vehicle unit. Under this transaction, Cainiao ceased independent manufacturing and direct commercial sales of autonomous delivery vehicles, executing an asset injection of its vehicle business alongside a direct cash equity investment into Zelos. Executive and technical leadership from Cainiao's autonomous vehicle division transitioned into Zelos, uniting Cainiao's frontier foundation models—specifically vision-language models and world models—with Zelos's vast operational dataset spanning nearly 100 million real-world open-road kilometers across more than 300 Chinese cities. Under the resulting dual-brand structure, Zelos licenses the 'Cainiao Autonomous Vehicles' brand for deep logistics scenarios across Alibaba's fulfillment network while continuing to market its proprietary Zelos brand for open-market commercial, municipal, and overseas customers. This industrial union strengthens Zelos's software convergence, supply chain leverage, and customer lock-in, while allowing Cainiao to standardize carrier transport capacity without carrying capital-intensive vehicle manufacturing facilities on its balance sheet.
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
  - id: "regulatory-testing-compliance-and-technical-risks"
    title: "Regulatory Testing, Global Road Certifications, and Engineering Risk Factors"
    body: >
      Commercialization of driverless logistics vehicles requires rigorous adherence to cross-jurisdictional functional safety and roadworthiness standards. In December 2023, Zelos became the first autonomous delivery product to pass ISO 22737 daytime and nighttime scenario evaluations, securing TÜV Rheinland's Level-4 autonomous driving system performance test China-mark certification. In Singapore, the company participated in the technical revision of the TR-68 autonomous vehicle standard, passing the milestone M1 validation assessment and securing the country's first autonomous logistics vehicle permit to support urban transfer trials with NTUC FairPrice. In September 2026, Zelos secured the official Y Test Plate in Belgium, incorporating its RoboVans into Belgium's national vehicle evaluation framework as the sole European robovan participant. In domestic operations, the company collaborates with NavInfo on Vehicle-Road-Cloud integration and statutory geographic data compliance. Despite these operational milestones, technical risks persist: third-party corroboration regarding mean distance between disengagements (MDBD) and remote-teleoperation takeover ratios remains undisclosed, leaving vehicle-to-teleoperator staffing ratios unverified. Furthermore, dependence on single-source Tier-1 sensor partners, regional variations in driverless road permissions, and extreme winter performance degradation present ongoing engineering challenges.
    claimRefs:
      - "CE015"
      - "CE016"
