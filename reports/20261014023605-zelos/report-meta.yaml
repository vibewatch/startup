  topStrengths:
    - Large verified deployment footprint across urban logistics routes and multiple cities.
    - Strong strategic backing from Cainiao and other institutional investors.
    - Clear buyer economics from reported delivery cost reductions and enterprise procurement traction.
  topRisks:
    - Audited revenue, gross margin, and cash burn remain undisclosed.
    - Valuation reporting remains inconsistent across secondary sources.
    - Customer concentration and ecosystem dependence could constrain bargaining power.
    - Breakeven still appears to require much larger fleet scale.
  unresolvedGaps:
    - Primary financing documents or shareholder disclosures reconciling the valuation narratives.
