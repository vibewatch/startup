chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Commercial Positioning
        blocks:
          - type: paragraph
            body: >-
              Founded in August 2021 and headquartered in Suzhou, Jiangsu Province, Zelos Technology (formally Jiushi
              Suzhou Intelligent Technology Co., Ltd.) develops and manufactures Level 4 autonomous logistics vehicles
              designed for open-road urban freight. Unlike passenger robotaxi operators burdened by protracted
              commercialization timelines, Zelos targets commercial logistics segments including express courier
              delivery, pharmaceutical transport, FMCG distribution, and industrial park haulage. Following an
              aggressive deployment schedule and a pivotal January 2026 strategic asset integration with Alibaba's
              Cainiao logistics division, the combined operating enterprise manages a fleet exceeding 20,000 autonomous
              RoboVans operating across more than 300 cities domestically and select international metropolitan hubs.
              The company has structured its commercial go-to-market around hardware sales and flexible fleet software
              leasing, capturing prominent enterprise accounts including China Post, Cainiao, and multinational retail
              distributors.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Zelos was established by alumni of Baidu Apollo's autonomous driving initiative, frequently referred to in
              Chinese industrial circles as the foundational training academy for the nation's robotics talent. Founder
              Zhuang Li returned from Silicon Valley in mid-2021 to register Jiushi Intelligence, establishing the core
              technical framework before bringing on Chief Executive Officer Kong Qi. Kong brought distinguished
              operational pedigree as a former Baidu Silicon Valley chief vehicle architect and Vice President of
              autonomous driving at JD.com, directly steering consumer autonomous delivery deployments. Following the
              January 2026 merger of Cainiao's unmanned delivery unit into Zelos, Cainiao executive leadership joined
              Zelos to coordinate operational logistics across terminal delivery hubs. While this institutional
              alignment deepens ecosystem integration with Alibaba, executive decision-making remains heavily
              concentrated in founder Kong Qi, creating key-person reliance across technical and strategic roadmap
              execution.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO011
      - number: '1.3'
        title: Financing Trajectory, Strategic Capital, and Valuation Milestones
        blocks:
          - type: paragraph
            body: >-
              The capital trajectory of Zelos reflects intense institutional and industrial backing within the
              commercial robotics sector. Across six discrete financing rounds since founding, five tranches have
              individually exceeded $100 million, culminating in cumulative disclosed equity capital surpassing $800
              million (approximately RMB 5.5 billion). Key institutional backers span top-tier venture firms including
              Sequoia China, CDH Investments, and Legend Capital alongside industrial strategic giants Ant Group and
              Cainiao. In February 2026, Zelos completed a financing round exceeding $300 million that lifted its
              post-money private valuation above RMB 10 billion (roughly $1.4 billion), marking it as China's first
              official RoboVan unicorn. By April 2026, financial media reported that the company had initiated
              discussions with investment banks regarding a planned Hong Kong initial public offering seeking
              approximately $600 million in gross proceeds.
            claimRefs:
              - CO003
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
              - CO010
      - number: '1.4'
        title: Operational Evolution, Product Architecture, and Risk Factors
        blocks:
          - type: paragraph
            body: >-
              Operationally, Zelos transitioned from demonstration pilots to serial industrial production through
              iterative hardware and algorithm releases. The enterprise introduced its Z-series multi-scenario platform
              in mid-2024, followed by the lightweight E-series courier van and heavy-duty L-series bulk carrier in
              2025. Crucially, in early 2025 Zelos implemented map-free Occupancy Network perception, bypassing
              centimeter-level high-definition map prerequisites to accelerate municipal corridor expansion. Regulatory
              milestones include securing Singapore's first public road autonomous freight permit in May 2024.
              Nonetheless, material operational and financial risks persist. Company leadership has acknowledged that
              true operational breakeven requires scaling to 50,000 active deployed vehicles excluding central R&D
              costs. Furthermore, primary route-level unit economics, operating margins, and customer retention metrics
              remain private, leaving unresolved whether rapid fleet expansion translates into sustainable operating
              profitability.
            claimRefs:
              - CO002
              - CO009
              - CO011
              - CO013
              - CO014
              - CO015
