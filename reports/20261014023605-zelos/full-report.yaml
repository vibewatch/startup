              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Scope
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Zelos centers on urban autonomous freight delivery, specifically low-speed
              Level-4 (L4) delivery robovans operating across last-mile neighborhood fulfillment and intra-city
              middle-mile transport between distribution hubs and regional delivery stations. The market boundary
              explicitly includes urban parcel express transport, localized food and grocery fulfillment, and
              closed-campus goods movement, where vehicles operate at controlled speeds under 50 km/h on designated
              roadways. Conversely, the market excludes long-haul highway freight (Class 8 heavy trucking) and passenger
              robotaxis, both of which require distinct regulatory frameworks, sensor architectures, and liability
              profiles. Status-quo substitutes consist primarily of human-driven electric two-wheelers, three-wheel
              delivery tricycles, and manned light commercial vehicles (LCVs). By targeting low-speed repeatable urban
              routes, autonomous robovans transition courier operations from labor-heavy variable expense models to
              amortized capital and service contracts.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM Constraints, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the autonomous delivery robovan market requires multiple analytical lenses anchored in empirical
              delivery volumes and commercial vehicle replacement dynamics rather than speculative top-down estimates.
              According to statistics released by China State Post Bureau, the express delivery sector handled 47.73
              billion parcels in the first quarter of 2026 alone, up 5.8% year on year, establishing an enormous volume
              baseline. The serviceable addressable market (SAM) encompasses high-density urban areas and regional
              delivery corridors where municipal authorities grant road-legal autonomous commercial vehicle permits.
              Within this serviceable domain, the serviceable obtainable market (SOM) is defined by logistics operators
              actively deploying L4 fleets to counteract rising courier wages and driver turnover. Commercial fleet
              footprints demonstrate rapid penetration: Zelos has deployed over 1,000 autonomous vehicles across 130
              cities delivering more than 100 million orders by mid-2024, expanding into an integrated commercial
              footprint of over 20,000 to 25,000 vehicles following strategic consolidation with Cainiao.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM011
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of autonomous logistics vehicles bifurcates into distinct buyer profiles across
              enterprise express networks, e-commerce retail platforms, and localized campus facilities. The primary
              buyers are large parcel express carriers and freight aggregators, notably Cainiao and express franchise
              operators, who procure autonomous vehicles through fleet purchase or Robo-as-a-Service (RaaS) turnkey
              operating leases. Budget ownership within these organizations resides with vice presidents of logistics
              operations and regional branch managers focused on lowering unit delivery costs and mitigating acute
              courier shortages during peak retail events. A secondary customer segment comprises industrial parks,
              corporate campuses, and municipal entities purchasing automated internal transport capacity to improve
              dispatch safety and reduce site operating expenses. Adoption pathways typically begin with bounded
              operational pilots in localized operational design domains (ODDs) before scaling into full fleet
              deployments once route-level cost parity against human couriers is demonstrated.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Unit Economics, and Operational Constraints
        blocks:
          - type: paragraph
            body: >-
              The secular expansion of autonomous urban freight is propelled by structural demographic pressures and
              favorable unit economics. In China and mature international markets, courier labor availability is
              constrained by aging demographics, elevating delivery wages and turnover. Industry data indicates
              autonomous delivery vehicles can yield an average reduction of 62% in operational delivery costs for
              logistics clients by operating continuously and reducing human labor overhead. Furthermore,
              battery-swapping architectures enable 24/7 vehicle uptime, resolving the range and charging bottlenecks
              that impede traditional electric delivery vans. However, adoption encounters material constraints:
              operating domains require pre-mapped high-definition environments, extreme weather can degrade optical
              perception, and international municipal regulations remain fragmented compared to China supportive
              commercial testing policies. Additionally, large-scale fleet deployments demand substantial initial
              capital expenditure and specialized maintenance infrastructure.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Pragmatic Turn in Logistics-First Autonomy
            body: >-
              Unlike passenger robotaxi developers burdened by complex liability and regulatory deadlock, urban
              logistics autonomy benefits from lower vehicle speeds, repeatable routes, and clear operational ROI. Zelos
              valuation surpassing $1 billion and strategic integration with Cainiao reflect a systemic capital pivot
              toward freight automation.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: Municipal Permitting Fragmentation and Fleet Capital Intensity
            body: >-
              While China commercial road-testing policies are highly supportive in tier-one and tier-two cities,
              international expansion to Southeast Asia and the Middle East faces fragmented municipal regulations,
              localized mapping prerequisites, and substantial upfront vehicle manufacturing capital requirements.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Commercial Landscape: Direct Peers, Incumbents, and Captive Operators'
        blocks:
          - type: paragraph
            body: >-
              China's urban autonomous logistics landscape underwent decisive consolidation in January 2026 following
              the merger of Zelos Technology with Cainiao's autonomous driving division into a combined entity valued at
              roughly $2 billion [CP001]. The combined operation, deployed under the Cainiao Robovan banner, commands an
              active fleet exceeding 20,000 robovans dedicated to urban express and last-mile package delivery [CP002].
              Zelos has captured over 70% market share among China's Tier-1 express delivery carriers, establishing
              clear commercial separation from direct autonomous robovan peers such as Neolix and SF Express-backed
              Rino.ai [CP003]. Enterprise customer commitments, most prominently a record purchase order of 7,000
              driverless vans from China Post, anchor high-density delivery volumes across municipal postal routes
              [CP011]. In contrast to captive internal delivery systems developed by e-commerce giants JD Logistics and
              Meituan that remain confined to proprietary delivery networks, Zelos functions as an external carrier
              technology partner. Concurrently, Zelos has initiated international operations in Abu Dhabi and executed a
              partnership agreement with Pos Malaysia in Kuala Lumpur to export its L4 delivery architecture to
              Southeast Asian and Middle Eastern postal operators [CP012].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
      - number: '3.2'
        title: Technical Architecture and Manufacturing Differentiation
        blocks:
          - type: paragraph
            body: >-
              Technical differentiation across the robovan landscape is defined by the trade-off between proprietary
              vehicle-grade hardware integration and open-road algorithm maturity. Zelos designs its full autonomous
              vehicle stack in-house, deploying an L4 computing platform that restricts power draw below 100 W while
              orchestrating a 360-degree sensor fusion suite composed of LiDAR, millimeter-wave radar, high-resolution
              cameras, and ultrasonic sensors [CP005]. This energy efficiency is paired with extensive manufacturing
              infrastructure, where Zelos controls six production factories with an aggregate annual capacity of 45,000
              autonomous vehicles. Direct rival White Rhino countered this manufacturing lead in April 2026 by
              establishing a joint-venture OEM with Xinyuan Automobile, launching automotive-grade production for its
              White Rhino RX delivery vans alongside operations with Huolala and SF Express Same-City [CP007].
              Meanwhile, Cainiao's asset contribution injected the low-cost GT-Lite vehicle platform into Zelos, setting
              a sub-$10,000 robovan manufacturing benchmark and leveraging regulatory approvals that span more than 200
              Chinese municipalities to streamline local commercial rollouts [CP013].
            claimRefs:
              - CP005
              - CP007
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP013
      - number: '3.3'
        title: Delivery Pricing Models, Route Economics, and Cost Structures
        blocks:
          - type: paragraph
            body: >-
              The economic justification for replacing status-quo courier networks with autonomous robovans rests on
              drastic reductions in repeatable route expenses. Commercial deployment data indicates that robovans
              decrease order delivery expenses by 35% to 45% on standardized urban postal routes, reducing parcel
              delivery unit costs from approximately ¥0.32 under conventional human courier labor down to ¥0.126 per
              parcel [CP004]. Commercial packaging in the sector has migrated toward turnkey Transport-as-a-Service
              models, where hardware capital costs are amortized over multi-year operational service contracts. However,
              public market analysts emphasize that Zelos's reported unit cost metrics have not been validated by
              audited financial statements or granular route-level gross margins, clouding the underlying operating
              economics [CP009]. Automated SEC filing searches for public autonomous driving peer WeRide illustrate that
              verified regulatory disclosure benchmarks for commercial autonomous logistics margins remain unavailable
              in public filings, leaving contract-level profitability and fleet maintenance overhead unverified [CP014].
            claimRefs:
              - CP004
              - CP009
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP009
              - CP013
      - number: '3.4'
        title: Defensibility, Ecosystem Lock-in, and Adverse Regulatory Vectors
        blocks:
          - type: paragraph
            body: >-
              Zelos's competitive moat is heavily reinforced by structural distribution lock-in resulting from its
              strategic transaction with Alibaba Group. As part of the merger agreement, Cainiao ceased internal
              autonomous vehicle manufacturing and licensed the 'Cainiao Autonomous Vehicles' brand to Zelos, while
              assigning technical executives and operational personnel directly to Zelos's board and executive
              management [CP006]. This deep operational alignment embeds Zelos's dual-brand fleet directly into
              Cainiao's nationwide station dispatch software, creating steep switching costs that prevent rival robovan
              operators from easily multi-homing within Cainiao logistics hubs [CP015]. Nevertheless, Zelos faces
              significant capital and regulatory headwinds as it pursues a reported $600 million Hong Kong initial
              public offering following its $100 million Series B+ round in February 2026 [CP008]. Market observers warn
              that preliminary IPO valuations in the autonomous mobility sector remain vulnerable to downward revisions
              during roadshow due diligence given the absence of published revenue figures [CP009]. Furthermore,
              municipal safety governance reviews in mainland China and strict regulatory scrutiny regarding
              cross-border autonomous driving data transfers introduce operational and timetable friction for
              international deployments [CP010].
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Scrutiny and Disclosed Unit Economics Deficit
            body: >-
              While Zelos is preparing for a Hong Kong IPO targeting $600 million on a $2 billion valuation benchmark,
              financial analysts emphasize that the company has not published audited revenue or route-level gross
              margins. Without verifiable operating unit economics, public market valuation remains exposed to roadshow
              downward revisions.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
          - type: callout
            title: Ecosystem Lock-in Reshapes Autonomous Freight Dynamics
            body: >-
              Cainiao's decision to cease internal vehicle production and transfer autonomous delivery assets to Zelos
              in exchange for an equity stake creates an entrenched distribution barrier. Embedding Zelos's dual-brand
              fleet into Cainiao's express dispatch system establishes high switching costs, insulating Zelos against
              rival robovan makers.
            calloutType: insight
            claimRefs:
              - CP002
              - CP006
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Zelos operates a hybrid commercial model combining direct autonomous vehicle hardware sales, software
              platform licensing, and enterprise fleet leasing. Historically, autonomous logistics providers struggled
              with rigid one-time equipment sales that imposed prohibitive capital expenditures on regional courier
              franchisees. Zelos lowered adoption friction by introducing a low-cost vehicle hardware pricing structure
              paired with recurring software license fees paid in installments, frequently underwritten by financial
              partner credit guarantees. Across key enterprise accounts, monetization is structured through multi-year
              centralized operating lease contracts, exemplified by China Post's centralized procurement project awarded
              in October 2025 for 7,000 driverless vehicle leases across small, medium, and large capacity segments.
              Following the January 2026 strategic integration with Cainiao, commercial monetization also encompasses
              ecosystem transport capacity services operating under a dual-brand framework where Cainiao focuses on core
              e-commerce logistics scenarios while Zelos supplies full-scenario autonomous delivery capacity.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Pricing Mechanisms and Customer Economics
        blocks:
          - type: paragraph
            body: >-
              Zelos structures monetization across multiple vehicle payload tiers including the Z-series, E-series, and
              heavy-duty L-series RoboVans. List pricing for hardware units is discounted for enterprise and fleet
              deployments, while software and cloud fleet management are billed as recurring platform subscriptions or
              structured installments. In high-volume courier hub-to-outlet transfer legs, customer operating economics
              provide the primary justification for vehicle deployment. China's express delivery networks handle tens of
              billions of parcels annually with margins managed down to fractions of a cent, making autonomous logistics
              an effective cost-reduction tool. Real-world commercial operating data from courier deployments indicates
              that replacing traditional driver-operated delivery vans with Zelos autonomous logistics vehicles yields
              an operational cost reduction of 60% to 66%. This cost advantage drives repeat vehicle orders and
              expansion beyond parcel express into supermarket groceries, fresh produce, and industrial parts delivery.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The route-level unit economics of Zelos autonomous vehicles depend on the balance between vehicle
              amortization, power costs, teleoperation oversight, and customer billing rates. A crucial driver of
              operational leverage achieved in the second half of 2025 was the compression of remote supervision labor
              expense to under 3% of monthly operating costs, signaling a transition from labor-intensive pilot
              operations to high vehicle-to-operator ratios on public roadways. However, route-level operational
              profitability does not equal corporate breakeven. Industry analysis and company co-founder commentary
              indicate that operating breakeven excluding research and development expenditures requires maintaining an
              active fleet of approximately 50,000 vehicles. With combined deployment orders at roughly 20,000 vehicles
              following the Cainiao integration, Zelos has crossed the 10,000-unit commercial validation threshold but
              remains below the critical scale required for corporate self-sufficiency, leaving fixed research overhead
              reliant on external equity funding.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
      - number: '4.4'
        title: Capital Adequacy and Financing Trajectory
        blocks:
          - type: paragraph
            body: >-
              Zelos has pursued aggressive equity fundraising to finance hardware engineering, platform software
              development, and fleet commercialization. Following a $100 million Series B1 round led by CDH BAIFU and
              Blue Lake Capital in late 2024 and a subsequent Series B4 round led by Ant Group, Cainiao executed a deep
              strategic integration in January 2026 by contributing its autonomous vehicle unit assets and injecting
              cash to become a major shareholder while leaving Zelos independently controlled. In February 2026, Zelos
              closed a financing round exceeding $300 million, pushing cumulative public financing past $800 million and
              company valuation above 10 billion yuan (approximately $1.4 billion). In parallel corporate transactions,
              Zelos entities acquired substantial equity positions in holding vehicles of Shenzhen-listed Star Five
              Materials while entering into a 36-month non-control lockup commitment. By April 2026, reports emerged
              that Zelos is working with investment banks on a potential Hong Kong initial public offering seeking to
              raise approximately $600 million, although transaction timing, valuation benchmarks, and issue size remain
              fluid.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Financial Underwriting Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Zelos demonstrates exceptional commercial velocity and
              genuine product-market fit within the Chinese express delivery and urban logistics ecosystem, backed by
              state-level procurement contracts and strategic alignment with the Alibaba logistics ecosystem.
              Nevertheless, the investment case remains subject to significant financial visibility constraints. While
              the company reports over 20,000 vehicle deployment orders and cumulative funding exceeding $800 million,
              it has not published audited financial statements, historical revenue recognition figures, gross profit
              margins by vehicle line, or net operating cash burn rates. The forward economic trajectory is highly
              sensitive to the successful execution of the planned $600 million Hong Kong initial public offering and
              the pace at which active deployment scales from 20,000 units toward the 50,000-unit operational breakeven
              threshold. Underwriters must treat private-metric omissions as mandatory diligence blockers prior to firm
              capital commitment.
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
              - CI013
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Model Shift from Upfront Capex to Guaranteed Installments
            body: >-
              Zelos's introduction of low-cost hardware coupled with software installment payments and third-party
              financial guarantees dismantled the primary adoption barrier for courier franchisees, accelerating
              commercial deployment from pilot fleets into multi-thousand unit orders.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
          - type: callout
            title: Scale Thresholds and Sub-Breakeven Operating Fleet
            body: >-
              While Zelos has surpassed 20,000 integrated deployment orders, company leadership and industry analysis
              indicate that operating breakeven requires approximately 50,000 active vehicles, leaving current
              operations dependent on ongoing external equity financing and a successful Hong Kong IPO.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Vehicle Platforms, Cargo Modularity, and Hardware Engineering
        blocks:
          - type: paragraph
            body: >
              Zelos structures its autonomous delivery offerings around purpose-built electric chassis designed
              exclusively for unmanned cargo transport rather than retrofitted passenger vehicles. The flagship Z-Series
              platform, anchored by the mass-produced Z5 urban logistics vehicle and extended via the larger Z8 model,
              provides standardized freight capacity for last-mile and middle-mile routes across retail, parcel
              delivery, and healthcare systems. The vehicle hardware architecture prioritizes volumetric cargo
              efficiency: the cargo compartment occupies approximately 60% of total vehicle space, supporting a rated
              maximum payload of 1,800 kg. Operational range reaches 220 km unloaded and 170 km fully loaded, supported
              by fast-charging capabilities that achieve a full battery recharge in approximately two hours for
              continuous multi-shift dispatch. To serve diverse vertical industries, the chassis supports hot-swappable
              cargo modules configured for standard express parcel delivery, refrigerated cold-chain distribution,
              municipal sanitation, municipal surveillance monitoring, and urban air quality detection. In May 2025,
              Zelos expanded its hardware portfolio with the introduction of the E-Series platform and its debut E6
              model, introducing on-demand full self-driving (FSD) subscription models. In 2026, the company entered
              underground transit automation by partnering with CCTEG Changzhou Research Institute to launch the T5
              Automated Transport Unit, addressing specialized subterranean industrial haulage.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE006
      - number: '5.2'
        title: Autonomous Driving Compute, Perception Stack, and Sensor Supply Architecture
        blocks:
          - type: paragraph
            body: >
              The core autonomous driving system operates on a proprietary full-stack Level-4 architecture spanning
              sensing, unified neural perception, world modeling, and vehicle motion control. At the compute layer,
              Zelos deploys an in-house developed domain computing platform characterized by low thermal dissipation and
              an energy footprint of below 100 W, preserving traction battery capacity for delivery range and enabling
              fanless or compact passive vehicle integration. The perception stack integrates 360-degree surround
              sensing combining long-range and short-range LiDARs, millimeter-wave radars, high-resolution automotive
              cameras, and ultrasonic sensors. This suite provides millimeter-level spatial precision across dense urban
              environments, resolving complex signage, traffic signals, small road hazards, and dynamic pedestrian
              flows. To secure automotive-grade sensor volumes for commercial series production, Zelos entered an
              exclusive production agreement with Hesai Technology (NASDAQ: HSAI) for 200,000 automotive-grade LiDAR
              units, establishing Hesai as standard equipment across its latest-generation RoboVan lineup. Software
              execution integrates seamless perception-to-control unified intelligence, reducing architectural module
              handoff latency while maintaining deterministic fail-operational safety bounds across sea-crossing
              bridges, complex intersections, unpaved rural roadways, and dust-heavy or rain-soaked environments.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
