      - number: '7.2'
        title: Commercial Fleet Economics and High Breakeven Threshold
        blocks:
          - type: paragraph
            body: >-
              Zelos's commercial scaling strategy hinges on crossing an aggressive operating volume threshold to offset
              continuous capital consumption in autonomous driving R&D. Following the merger with Cainiao's autonomous
              logistics unit in early 2026, the company's deployed fleet expanded to over 20,000 robovans across 300
              cities. However, corporate co-founders have openly disclosed that achieving overall corporate
              breakeven—inclusive of software engineering, sensor stack iteration, and centralized teleoperation
              infrastructure—requires an operational fleet of approximately 50,000 robovans. In the Chinese market,
              courier franchisees report attractive micro-level economics, reducing monthly vehicle outlays to RMB
              2,000–3,000 and cutting parcel transfer costs by up to 50%. Nonetheless, broader industry benchmarks
              confirm that Chinese autonomous delivery developers remain encumbered by heavy cumulative losses,
              rendering aggressive international expansion into Southeast Asia and the Middle East a structural
              necessity for long-term financial viability.
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
              - CR014
