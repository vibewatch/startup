      - number: '6.2'
        title: Commercial Adoption Trajectory and Scaling Milestones
        blocks:
          - type: paragraph
            body: >-
              Zelos's deployment trajectory exhibits an inflection point from localized demonstration projects to
              industrial fleet operations. The company's active global fleet expanded to more than 25,000 autonomous
              vehicles across more than 300 cities by early 2026, accumulating over 100 million autonomous driving
              kilometers on public roads and closed campuses. This extensive deployment scale is underpinned by critical
              unit-economic maturity: remote human teleoperation takeover costs declined to below 3% of monthly
              operating expenditure in late 2025, enabling operational break-even excluding central R&D expenditure. The
              commercialization journey progresses through structured operational milestones, beginning with campus
              pilots, transitioning through municipal lane permits, and scaling through centralized multi-year
              enterprise leasing contracts.
            claimRefs:
              - CU001
              - CU003
