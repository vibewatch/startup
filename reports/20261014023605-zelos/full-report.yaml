      - number: '6.4'
        title: Retention, Durability, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite rapid volume expansion, Zelos faces pronounced counterparty concentration and durability
              uncertainties. Over 75% of active vehicle deployments remain tethered to the Cainiao ecosystem and China
              Post, exposing the business to potential margin compression from captive enterprise buyers and channel
              conflict with competing courier networks. Although Zelos confirmed that Cainiao will not hold a
              controlling equity stake, commercial exclusivity arrangements could deter unaffiliated parcel carriers
              from adopting the platform. Furthermore, public road operations carry unresolved regulatory and legal
              liabilities: municipal pilots require minimum RMB 3 million commercial liability insurance per vehicle,
              and national traffic frameworks still lack clear fault-attribution standards for collisions involving
              autonomous freight delivery vans.
            claimRefs:
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Platform and Ecosystem Concentration
            body: >-
              Over 75% of Zelos's reported commercial fleet deployment is tied directly to the Cainiao Network ecosystem
              and China Post centralized procurement. While this provides unprecedented deployment scale of over 20,000
              units, it exposes Zelos to extreme counterparty dependence, captive contract pricing pressure, and
              potential channel conflict if third-party couriers like SF Express or JD perceive Zelos as an
              Alibaba-controlled transport arm.
            calloutType: risk
            claimRefs:
              - CU002
              - CU004
              - CU009
              - CU010
          - type: callout
            title: Disruptive Operating Cost Economics Drive Fast Conversion
            body: >-
              By substituting 2 to 3 traditional courier drivers per vehicle and reducing remote teleoperation costs to
              under 3% of monthly operating expenditure, Zelos offers logistics operators an estimated 50% to 66%
              operating cost reduction. This rapid payback model has allowed the company to move beyond technology
              demonstrations into positive gross operating margins before central R&D.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Cross-Border Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Autonomous commercial delivery operations remain exposed to fragmented municipal oversight across mainland
              China, where vehicle road-testing permits, designated transit lanes, and unmanned dispatch approvals vary
              substantially by municipal transportation bureau. Unlike passenger autonomous vehicles operating under
              standardized regional trial regimes, commercial cargo robovans operate across pedestrian-adjacent urban
              distribution routes that invite heightened municipal scrutiny following any localized transit incident.
              Outside China, international expansion introduces legal complexity and local compliance friction; while
              Zelos successfully passed Singapore's M1 safety tests to secure an initial autonomous logistics license,
              entry into neighboring markets such as Malaysia remains bound to six-month proof-of-concept frameworks.
              Furthermore, conflicting public disclosures regarding post-merger valuation benchmarks—ranging from
              domestic Chinese reports of RMB 10 billion to international media estimates of $2 billion—highlight
              persistent reporting ambiguities that require verification against formal regulatory filings.
            claimRefs:
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
