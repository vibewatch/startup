      - number: '5.4'
        title: Regulatory Testing, Global Road Certifications, and Engineering Risk Factors
        blocks:
          - type: paragraph
            body: >
              Commercialization of driverless logistics vehicles requires rigorous adherence to cross-jurisdictional
              functional safety and roadworthiness standards. In December 2023, Zelos became the first autonomous
              delivery product to pass ISO 22737 daytime and nighttime scenario evaluations, securing TÜV Rheinland's
              Level-4 autonomous driving system performance test China-mark certification. In Singapore, the company
              participated in the technical revision of the TR-68 autonomous vehicle standard, passing the milestone M1
              validation assessment and securing the country's first autonomous logistics vehicle permit to support
              urban transfer trials with NTUC FairPrice. In September 2026, Zelos secured the official Y Test Plate in
              Belgium, incorporating its RoboVans into Belgium's national vehicle evaluation framework as the sole
              European robovan participant. In domestic operations, the company collaborates with NavInfo on
              Vehicle-Road-Cloud integration and statutory geographic data compliance. Despite these operational
              milestones, technical risks persist: third-party corroboration regarding mean distance between
              disengagements (MDBD) and remote-teleoperation takeover ratios remains undisclosed, leaving
              vehicle-to-teleoperator staffing ratios unverified. Furthermore, dependence on single-source Tier-1 sensor
              partners, regional variations in driverless road permissions, and extreme winter performance degradation
              present ongoing engineering challenges.
            claimRefs:
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Asset Injection from Cainiao Shifts Competitive Dynamics
            body: >
              Cainiao's decision to cease independent vehicle manufacturing and inject its autonomous logistics unit
              directly into Zelos provides a formidable operational and algorithmic moat. Rather than competing as an
              external vendor against Alibaba's ecosystem, Zelos secures captive commercial demand, dual-brand identity,
              and access to frontier foundation model architectures trained on nationwide parcel throughput.
            calloutType: insight
            claimRefs:
              - CE012
              - CE013
              - CE014
          - type: callout
            title: Critical Teleoperation and Disengagement Metrics Remain Hidden
            body: >
              While Zelos highlights large fleet figures (>25,000 robovans claimed across mainland China) and extensive
              road mileage, the absence of public disengagement reporting or remote teleoperator oversight ratios
              creates diligence opacity. Without audited data on human intervention frequency per 1,000 km, true
              driver-out labor economics cannot be independently verified.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Zelos segments its customer landscape into national postal operators, e-commerce delivery platforms,
              private express courier networks, and emerging industrial park bulk freight clients. The company's primary
              commercial traction is concentrated in high-frequency municipal courier shuttles between logistics
              distribution hubs and neighborhood pickup stations. In this core urban delivery segment, customers replace
              two to three human courier drivers per deployed vehicle, generating reported operational cost reductions
              between 50% and 66%. For national state-owned operators like China Post, predictable centralized leasing
              removes upfront capital friction and accelerates fleet modernization. Meanwhile, the launch of the
              heavy-duty L5 model with an 1,800 kg payload capacity expands customer reach into bulk commodities and
              manufacturing transit, though adoption beyond parcel logistics remains nascent.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU011
