      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Commercialization Trap: Fleet Scaling vs. Route Economics'
            body: >-
              While Zelos has rapidly scaled its combined operating fleet past 20,000 robovans, corporate leadership
              explicitly acknowledges that company-wide breakeven including R&D requires approximately 50,000 active
              vehicles. Expanding into secondary Chinese cities and Southeast Asian markets without verified unit
              profitability creates a cash burn treadmill where fleet depreciation and localization costs outpace
              incremental courier franchisee margins.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
          - type: callout
            title: Key Governance & Regulatory Diligence Milestones
            body: >-
              Prospective investors should treat the conversion of Southeast Asian pilot trials and the formalization of
              Cainiao governance agreements as mandatory gating milestones. Diligence must establish whether Cainiao
              possesses liquidation vetoes or customer-lock restrictions, while tracking whether international PoCs
              successfully convert into binding commercial lease contracts beyond subsidized pilot phases.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR008
