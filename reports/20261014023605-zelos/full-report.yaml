      - number: '6.3'
        title: Named Customer Proof and Operational Deployments
        blocks:
          - type: paragraph
            body: >-
              Commercial validation is anchored by flagship enterprise accounts in China and initial cross-border
              deployments in Southeast Asia. In October 2025, Zelos won China Post's centralized procurement project to
              lease 7,000 driverless freight vehicles, securing the largest public commercial L4 freight vehicle order
              on record. In January 2026, Zelos completed a transformative strategic integration with Cainiao Network,
              Alibaba's logistics arm, whereby Cainiao contributed its autonomous vehicle business and cash to build a
              joint RoboVan super-carrier operating under a dual-brand structure. Outside mainland China, Zelos has
              established commercial pilot partnerships with Singapore Post and Malaysia Post by utilizing Cainiao's
              international distribution centers, while on-demand food delivery giant Meituan participated as a lead
              investor and early deployment partner for the Z5 delivery platform.
            claimRefs:
