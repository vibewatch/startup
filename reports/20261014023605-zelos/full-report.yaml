      - number: '5.3'
        title: Cainiao Deep Strategic Integration and Dual-Brand Operating Model
        blocks:
          - type: paragraph
            body: >
              A transformative evolution in Zelos's operating model occurred in January 2026 through a deep strategic
              integration with Cainiao's autonomous delivery vehicle unit. Under this transaction, Cainiao ceased
              independent manufacturing and direct commercial sales of autonomous delivery vehicles, executing an asset
              injection of its vehicle business alongside a direct cash equity investment into Zelos. Executive and
              technical leadership from Cainiao's autonomous vehicle division transitioned into Zelos, uniting Cainiao's
              frontier foundation models—specifically vision-language models and world models—with Zelos's vast
              operational dataset spanning nearly 100 million real-world open-road kilometers across more than 300
              Chinese cities. Under the resulting dual-brand structure, Zelos licenses the 'Cainiao Autonomous Vehicles'
              brand for deep logistics scenarios across Alibaba's fulfillment network while continuing to market its
              proprietary Zelos brand for open-market commercial, municipal, and overseas customers. This industrial
              union strengthens Zelos's software convergence, supply chain leverage, and customer lock-in, while
              allowing Cainiao to standardize carrier transport capacity without carrying capital-intensive vehicle
              manufacturing facilities on its balance sheet.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
