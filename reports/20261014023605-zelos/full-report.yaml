      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Alibaba Ecosystem Alignment and Massive Deployment Scale
            body: >-
              By integrating Cainiao's autonomous vehicle division and securing Ant Group capital, Zelos has aligned
              itself with Alibaba's comprehensive logistics and ecommerce infrastructure. The resulting fleet of over
              20,000 units provides real-world open-road operational data that creates a formidable barrier to entry for
              domestic and international competitors.
            calloutType: strength
