  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Zelos rests on its commercial leadership in China's urban autonomous
              freight logistics market, demonstrated by an operational fleet exceeding 20,000 robovans across more than
              300 cities and 1.5 billion cumulative deliveries. The company's strategic integration with Alibaba's
              Cainiao logistics division in January 2026 and its October 2025 centralized procurement win of 7,000
              vehicles from China Post provide unmatched route density and captive enterprise demand. Standardized
              hardware platforms, such as the Z5 featuring 6.5 cubic meters of cargo volume and 1,000 kilogram payload
              capacity, have demonstrated 66% operational cost reductions for commercial delivery clients. Conversely,
              the anti-thesis centers on economic opacity and severe capital intensity. Zelos has not disclosed audited
              revenue, gross margins, or cash burn rates. While management claims operating breakeven excluding research
              and development expenses, company leadership acknowledges that full operational breakeven requires
              reaching approximately 50,000 active vehicles. Furthermore, the company faces potential margin compression
              from captive Alibaba reliance, aggressive competition from Meituan and JD, and substantial ongoing capital
              expenditure across hardware manufacturing and fleet operations.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Zelos closed an undisclosed-stage Series B extension financing round exceeding $300 million in February
              2026, elevating total disclosed funding past $800 million across six funding rounds since its 2021
              inception. The transaction valued Zelos at RMB 10 billion (approximately $1.38 billion to $1.4 billion
              USD), establishing the company as the first domestic RoboVan unicorn to cross the ten-billion-yuan
              valuation mark. Notable institutional backers spanning its capital structure include Ant Group, Blue Lake
              Capital, CDH Investments, Baidu Ventures, Meituan, and municipal government investment funds. In parallel,
              Alibaba logistics subsidiary Cainiao executed a strategic transaction contributing its autonomous vehicle
              unit and cash in exchange for an equity holding, while confirming Cainiao will not become a controlling
              shareholder. However, diligence reveals a meaningful valuation discrepancy: reporting by the Wall Street
              Journal and Reuters indicated the Cainiao combination would create a business valued around $2.0 billion.
              Because primary capitalization tables and preference terms remain undisclosed, prospective investors must
              exercise strict valuation discipline, anchoring entry marks at the corroborated RMB 10 billion level
              rather than speculative headline figures.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV010
              - CV014
      - number: '8.3'
        title: Comparable Company Set and Public Market Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Zelos against public and private autonomous driving and enterprise robotics peers reveals wide
              multiple dispersions and cautionary market signals. Secondary market transactions in enterprise artificial
              intelligence and specialized robotics reflect valuation multiples ranging from 5.4x revenue for enterprise
              platform C3.ai to 10.0x for Chinese vision provider Extreme Vision and over 40x for capital-intensive
              frontier tech plays like Infleqtion. However, the most critical valuation signals emerge from recent
              initial public offerings of Chinese autonomous driving leaders Pony.ai and WeRide on the Hong Kong Stock
              Exchange. Both companies broke their initial public offering issue prices on their debut trading day,
              enduring sustained downward price pressure as public market investors demand demonstrable paths to GAAP
              profitability over autonomous vehicle deployment counts. With Zelos reportedly contemplating a Hong Kong
              initial public offering to raise approximately $600 million, public comparable performance indicates that
              private round valuations at RMB 10 billion may face significant multiple compression and discount pressure
              upon entering secondary public markets unless route-level unit profitability is conclusively proven.
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV013
      - number: '8.4'
        title: 'Scenario Analysis: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              A structured three-case scenario framework evaluates the risk-adjusted return profile of Zelos across
              differing operational and capital market trajectories. The bull case assumes Zelos expands its active
              fleet to reach the management breakeven target of 50,000 robovans by 2027, driven by sustained domestic
              postal deployments, expanding Cainiao volumes, and accelerating international rollouts in Southeast Asia
              and the Middle East. Under this trajectory, a successful Hong Kong listing at $2.5 billion to $3.0 billion
              delivers attractive equity returns. In the base case, fleet growth continues at a steady domestic pace to
              30,000 to 35,000 vehicles, but full operating breakeven is pushed into 2028 due to competitive price
              pressure from JD and Meituan. Valuation holds near the current RMB 10 billion ($1.4 billion) benchmark,
              yielding capital preservation but modest return upside. The bear case models a sharp valuation haircut
              driven by persistent operating losses, regulatory slowdowns, or customer concentration pushback from
              Alibaba. If public market investors apply peer-level Hong Kong discounts to an unproven business model,
              valuation could compress toward $700 million to $900 million, presenting a 40% to 50% downside risk from
              current private valuation marks.
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV011
      - number: '8.5'
        title: Exit Readiness, Diligence Asks, and Final Recommendation
        blocks:
          - type: paragraph
            body: >-
              Zelos displays strong commercial traction and operational scale that separate it from early-stage
              autonomous driving concepts, bolstered by over $800 million in cumulative equity capital, high-profile
              customer deployments with China Post, and operational international trials with Pos Malaysia. Nonetheless,
              an investment recommendation must be price-sensitive and evidence-governed rather than an uncritical
              endorsement of physical vehicle scale. The divergence between domestic RMB 10 billion reports and the Wall
              Street Journal $2.0 billion figure, coupled with undisclosed unit contribution margins and adverse Hong
              Kong public market precedent, precludes a buy recommendation. We assign a research-more recommendation
              with a high risk rating and a fair valuation stance at the RMB 10 billion ($1.4 billion) benchmark.
              Thesis-break triggers that would prompt a downgrade to avoid include any material customer contract loss
              with Cainiao or China Post, evidence of negative gross margins on hardware delivery, or public listing
              delays caused by governance or intellectual property disputes. Upgrading to buy requires audited cohort
              financials confirming route-level positive contribution margins and primary cap-table verification.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Disciplined Research-More Posture at RMB 10 Billion Benchmark
            body: >-
              Zelos has demonstrated exceptional physical execution by scaling its active robovan fleet to 20,000 units
              and integrating Cainiao's autonomous driving division alongside a 7,000-vehicle China Post procurement
              contract. However, without audited unit economics, gross margins, or cash burn visibility—and facing
              severe debut trading discounts among Hong Kong-listed peers—investors should maintain a research-more
              stance and avoid paying above the RMB 10 billion ($1.4 billion) private benchmark until audited route
              contribution margins are confirmed.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV014
          - type: callout
            title: Downside Exposure from Public Market Multiple Compression
            body: >-
              Recent public listings of Chinese autonomous driving leaders Pony.ai and WeRide on the Hong Kong Stock
              Exchange resulted in broken IPO issue prices on debut, demonstrating sharp public market skepticism for
              unproven L4 unit economics. Rumors of a planned $600 million Hong Kong IPO for Zelos face severe risk of
              secondary market discount or down-round pricing if route-level profitability cannot be substantiated prior
              to filing.
            calloutType: risk
