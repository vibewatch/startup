      - number: '7.4'
        title: Operational Safety, Supply Chain, and Emerging Competitor Threats
        blocks:
          - type: paragraph
            body: >-
              Operational reliability across diverse real-world operating domains represents a primary execution hazard
              for Zelos. The company's standard Level 4 hardware architecture combines solid-state LiDAR,
              high-resolution cameras, millimeter-wave radar, and an in-house computing unit operating under 100 W.
              While deployments across long-distance grassland loops in Inner Mongolia demonstrate system versatility
              across 100-kilometer routes, harsh weather conditions such as heavy rainfall, dense fog, and extreme cold
              create edge-case perception degradation that can force automated vehicle stops or require remote operator
              intervention. In overseas jurisdictions, reliance on local intermediaries—such as exclusive Malaysian
              distributor Autonomous Logistic Solutions—creates execution bottlenecks if local partners struggle with
              commercial fleet maintenance. Simultaneously, competitive pressure is mounting from well-capitalized
              domestic logistics peers including JD, Meituan, and SF Express, alongside specialized automotive component
              suppliers such as QCraft and Desay SV that are commercializing rival urban delivery platforms.
            claimRefs:
