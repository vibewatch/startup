      - number: '7.3'
        title: Ecosystem Concentration and Governance Entanglement with Cainiao
        blocks:
          - type: paragraph
            body: >-
              The January 2026 strategic integration between Zelos and Cainiao transformed industry competitive dynamics
              but introduced acute counterparty dependency and corporate governance entanglement. Cainiao contributed
              its autonomous vehicle business and direct cash investment in exchange for a significant equity stake,
              simultaneously licensing the 'Cainiao Autonomous Vehicles' brand to Zelos under a dual-brand operational
              model. Although company spokespersons emphasize that Cainiao will not hold a controlling equity stake,
              Cainiao's dominant influence across Chinese e-commerce fulfillment creates severe platform concentration.
              Should strategic priorities diverge between Alibaba Group and Zelos's executive leadership, Zelos could
              face channel conflict or constrained commercial freedom across competing logistics ecosystems. This
              platform exposure is compounded by domestic customer concentration, as demonstrated by the landmark
              7,000-vehicle centralized lease procurement order signed with China Post in late 2025.
            claimRefs:
              - CR003
              - CR006
