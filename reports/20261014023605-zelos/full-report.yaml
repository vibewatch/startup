              disclosed audited revenue, gross margins, or route-level unit profitability. Management's stated breakeven
              target of 50,000 vehicles indicates that the business remains in an intensive capital-expenditure phase
              vulnerable to financing market volatility.
            calloutType: risk
            claimRefs:
