callouts:
  - calloutType: strength
    title: Alibaba Ecosystem Alignment and Massive Deployment Scale
    body: >-
      By integrating Cainiao's autonomous vehicle division and securing Ant Group capital, Zelos has aligned itself with
      Alibaba's comprehensive logistics and ecommerce infrastructure. The resulting fleet of over 20,000 units provides
      real-world open-road operational data that creates a formidable barrier to entry for domestic and international
      competitors.
    claimRefs:
      - CO003
      - CO004
      - CO009
  - calloutType: risk
    title: Unverified Route Economics and Sizable Breakeven Threshold
    body: >-
      Despite reporting rapid fleet expansion and substantial cost reductions for clients, Zelos has not disclosed
      audited revenue, gross margins, or route-level unit profitability. Management's stated breakeven target of 50,000
      vehicles indicates that the business remains in an intensive capital-expenditure phase vulnerable to financing
      market volatility.
    claimRefs:
      - CO013
      - CO015
