callouts:
  - calloutType: recommendation
    title: "Disciplined Research-More Posture at RMB 10 Billion Benchmark"
    body: "Zelos has demonstrated exceptional physical execution by scaling its active robovan fleet to 20,000 units and integrating Cainiao's autonomous driving division alongside a 7,000-vehicle China Post procurement contract. However, without audited unit economics, gross margins, or cash burn visibility—and facing severe debut trading discounts among Hong Kong-listed peers—investors should maintain a research-more stance and avoid paying above the RMB 10 billion ($1.4 billion) private benchmark until audited route contribution margins are confirmed."
    claimRefs:
