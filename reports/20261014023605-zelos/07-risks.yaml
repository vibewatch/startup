callouts:
  - calloutType: risk
    title: 'Commercialization Trap: Fleet Scaling vs. Route Economics'
    body: While Zelos has rapidly scaled its combined operating fleet past 20,000 robovans, corporate leadership explicitly acknowledges that company-wide breakeven including R&D requires approximately 50,000 active vehicles. Expanding into secondary Chinese cities and Southeast Asian markets without verified unit profitability creates a cash burn treadmill where fleet depreciation and localization costs outpace incremental courier franchisee margins.
    claimRefs:
      - CR001
      - CR002
      - CR012
      - CR013
  - calloutType: recommendation
    title: Key Governance & Regulatory Diligence Milestones
    body: Prospective investors should treat the conversion of Southeast Asian pilot trials and the formalization of Cainiao governance agreements as mandatory gating milestones. Diligence must establish whether Cainiao possesses liquidation vetoes or customer-lock restrictions, while tracking whether international PoCs successfully convert into binding commercial lease contracts beyond subsidized pilot phases.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR011
