  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: breakeven-economics
      missingEvidence: Audited financial statements detailing unit-level depreciation, maintenance costs, charging infrastructure outlays, and route gross margins across Chinese and Southeast Asian deployments.
      whyItMatters: Without verified route economics, investors cannot determine whether operating cash flow can support the business before reaching the 50,000-vehicle breakeven target.
      diligencePath: Request unit economics schedule by operating city, including vehicle amortization periods, remote teleoperation labor allocations, and battery degradation rates.
      relatedQuestionRefs:
        - QR009
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk
      missingEvidence: Comprehensive municipal road test permit disclosures and safety incident records across all 300 Chinese operating cities.
      whyItMatters: Municipal permit revocations or localized traffic accidents could immediately ground regional fleets, while public disclosures only cover selected tier-1 and international permits.
      diligencePath: Examine municipal transportation bureau filings and local commercial operational licenses in top 10 fleet concentration hubs.
      relatedTableRefs:
        - TR001
