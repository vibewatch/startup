figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Six-stage lifecycle of enterprise logistics adoption from closed-park feasibility testing to multi-thousand fleet
    lease rollout.
  data:
    items:
    - label: 'Stage 1: Closed-Park Pilot'
      detail: Testing map-free perception in controlled environments like university campuses, industrial parks, and micro-fulfillment
        centers.
      touchpoints:
      - Feasibility demo
      - Safety boundary verification
      - Simulation bench testing
    - label: 'Stage 2: Municipal Permit & Lane Testing'
      detail: Securing local government road testing licenses, 3M RMB vehicle insurance, and lane-level navigation validation
        across initial cities.
      touchpoints:
      - Municipal pilot permits
      - Non-motorized lane trials
      - Safety officer assignment
    - label: 'Stage 3: Commercial Trial & Onboarding'
      detail: Deploying Z-series light vehicles on fixed courier-to-station shuttle routes with flexible low-cost hardware
        installment models.
      touchpoints:
      - Low-cost hardware installment
      - Courier station shuttle routes
      - Remote dispatch setup
    - label: 'Stage 4: Centralized Procurement'
      detail: Winning centralized enterprise bids, such as China Post's 7,000-vehicle lease procurement, transitioning clients
        to fixed pricing.
      touchpoints:
      - Competitive public tender
      - Fixed multi-year vehicle lease
      - Fleet financing guarantee
    - label: 'Stage 5: Ecosystem Deep Integration'
      detail: Full operational merger with strategic platforms like Cainiao, integrating logistics dispatch algorithms and
        dual-brand execution.
      touchpoints:
      - Cainiao dual-brand licensing
      - Warehouse dispatch synchronization
      - Asset injection
    - label: 'Stage 6: International Expansion'
      detail: Deploying vehicles across Singapore, Malaysia, and the Middle East via Cainiao global distribution hubs with
        local postal partners.
      touchpoints:
      - Singapore Post pilot
      - Malaysia Post logistics hub
      - European vehicle safety certifications
  approximationNotes: Progression stages represent normalized commercial lifecycle synthesized from enterprise disclosures
    and public procurement timelines.
