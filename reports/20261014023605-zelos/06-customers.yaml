callouts:
- calloutType: risk
  title: Severe Platform and Ecosystem Concentration
  body: Over 75% of Zelos's reported commercial fleet deployment is tied directly to the Cainiao Network ecosystem and China
    Post centralized procurement. While this provides unprecedented deployment scale of over 20,000 units, it exposes Zelos
    to extreme counterparty dependence, captive contract pricing pressure, and potential channel conflict if third-party couriers
    like SF Express or JD perceive Zelos as an Alibaba-controlled transport arm.
  claimRefs:
  - CU002
  - CU004
  - CU009
  - CU010
- calloutType: insight
  title: Disruptive Operating Cost Economics Drive Fast Conversion
  body: By substituting 2 to 3 traditional courier drivers per vehicle and reducing remote teleoperation costs to under 3%
    of monthly operating expenditure, Zelos offers logistics operators an estimated 50% to 66% operating cost reduction. This
    rapid payback model has allowed the company to move beyond technology demonstrations into positive gross operating margins
    before central R&D.
  claimRefs:
  - CU006
  - CU007
  - CU011
