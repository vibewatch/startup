company:
  name: Zelos
chapter:
  number: 6
  title: Customers
  summary: Zelos has established an industry-leading deployment scale in Level-4 autonomous delivery, operating over 25,000
    robovans across more than 300 cities and logging 100 million autonomous kilometers. The commercial engine is heavily driven
    by large state and platform ecosystems—headlined by China Post's 7,000-vehicle lease procurement and a deep strategic
    integration with Alibaba's Cainiao Network—delivering reported 50% to 66% operating cost savings versus human couriers.
    However, extreme customer concentration in Chinese express delivery, reliance on ecosystem-subsidized vehicle lease models,
    and early-stage overseas postal pilots leave long-term unit margins and retention durability unverified.
sections:
- id: customer-segmentation-and-economics
  title: Customer Base Segmentation and Buyer Economics
  body: Zelos segments its customer landscape into national postal operators, e-commerce delivery platforms, private express
    courier networks, and emerging industrial park bulk freight clients. The company's primary commercial traction is concentrated
    in high-frequency municipal courier shuttles between logistics distribution hubs and neighborhood pickup stations. In
    this core urban delivery segment, customers replace two to three human courier drivers per deployed vehicle, generating
    reported operational cost reductions between 50% and 66%. For national state-owned operators like China Post, predictable
    centralized leasing removes upfront capital friction and accelerates fleet modernization. Meanwhile, the launch of the
    heavy-duty L5 model with an 1,800 kg payload capacity expands customer reach into bulk commodities and manufacturing transit,
    though adoption beyond parcel logistics remains nascent.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU011
  tableRefs:
  - TU001
- id: adoption-trajectory-and-scaling
  title: Commercial Adoption Trajectory and Scaling Milestones
  body: 'Zelos''s deployment trajectory exhibits an inflection point from localized demonstration projects to industrial fleet
    operations. The company''s active global fleet expanded to more than 25,000 autonomous vehicles across more than 300 cities
    by early 2026, accumulating over 100 million autonomous driving kilometers on public roads and closed campuses. This extensive
    deployment scale is underpinned by critical unit-economic maturity: remote human teleoperation takeover costs declined
    to below 3% of monthly operating expenditure in late 2025, enabling operational break-even excluding central R&D expenditure.
    The commercialization journey progresses through structured operational milestones, beginning with campus pilots, transitioning
    through municipal lane permits, and scaling through centralized multi-year enterprise leasing contracts.'
  claimRefs:
  - CU001
  - CU003
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: named-customer-accounts-and-proof
  title: Named Customer Proof and Operational Deployments
  body: Commercial validation is anchored by flagship enterprise accounts in China and initial cross-border deployments in
    Southeast Asia. In October 2025, Zelos won China Post's centralized procurement project to lease 7,000 driverless freight
    vehicles, securing the largest public commercial L4 freight vehicle order on record. In January 2026, Zelos completed
    a transformative strategic integration with Cainiao Network, Alibaba's logistics arm, whereby Cainiao contributed its
    autonomous vehicle business and cash to build a joint RoboVan super-carrier operating under a dual-brand structure. Outside
    mainland China, Zelos has established commercial pilot partnerships with Singapore Post and Malaysia Post by utilizing
    Cainiao's international distribution centers, while on-demand food delivery giant Meituan participated as a lead investor
    and early deployment partner for the Z5 delivery platform.
  claimRefs:
  - CU002
  - CU004
  - CU005
  - CU008
  - CU009
  tableRefs:
  - TU003
- id: retention-expansion-and-concentration-risks
  title: Retention, Durability, and Concentration Risks
  body: 'Despite rapid volume expansion, Zelos faces pronounced counterparty concentration and durability uncertainties. Over
    75% of active vehicle deployments remain tethered to the Cainiao ecosystem and China Post, exposing the business to potential
    margin compression from captive enterprise buyers and channel conflict with competing courier networks. Although Zelos
    confirmed that Cainiao will not hold a controlling equity stake, commercial exclusivity arrangements could deter unaffiliated
    parcel carriers from adopting the platform. Furthermore, public road operations carry unresolved regulatory and legal
    liabilities: municipal pilots require minimum RMB 3 million commercial liability insurance per vehicle, and national traffic
    frameworks still lack clear fault-attribution standards for collisions involving autonomous freight delivery vans.'
  claimRefs:
  - CU009
  - CU010
  - CU012
  - CU013
  - CU014
