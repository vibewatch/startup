  rows:
  - - National Postal Services
    - China Post, Singapore Post, Malaysia Post
    - Last-mile and hub-to-station mail and parcel transfer
    - Over 7,000 leased units (China Post procurement tender won Oct 2025); pilot fleets in Singapore and Malaysia
    - Anchor recurring lease revenue; critical public validation of L4 road licensing
    - Route-level lease pricing, renewal terms, and contract duration remain undisclosed
  - - E-Commerce & Platform Logistics
    - Cainiao Network (Alibaba Group), Meituan
    - Urban delivery network points to courier stations, campus and park delivery
    - Over 20,000 combined fleet post-integration; operations across 300+ cities
    - Core volume driver; replaces 2-3 human riders per vehicle with 50-66% cost reduction
    - Severe revenue concentration; Cainiao dual-brand exclusivity and IP/asset boundaries
  - - Private Express Couriers
    - SF Express and regional delivery franchisees
    - Branch-to-station express package shuttle and off-peak urban replenishment
    - Sub-scale commercial trials across key Chinese tier-1 and tier-2 distribution hubs
    - Diversification away from Alibaba ecosystem; high-frequency commercial testbed
    - Franchisee capex resistance and local municipal road permit availability by city
  - - Industrial & Bulk Freight
    - Factory park operators, bulk food and commodity distributors
    - Heavy-load palletized transit between manufacturing facilities and regional warehouses
    - Early commercial adoption of L5 1.8-ton model launched late 2025
    - Higher gross margin potential per vehicle; expansion beyond parcel logistics
    - Early deployment stage; lack of multi-quarter utilization and maintenance data
