callouts:
  - calloutType: "insight"
    title: "The Pragmatic Turn in Logistics-First Autonomy"
    body: "Unlike passenger robotaxi developers burdened by complex liability and regulatory deadlock, urban logistics autonomy benefits from lower vehicle speeds, repeatable routes, and clear operational ROI. Zelos valuation surpassing $1 billion and strategic integration with Cainiao reflect a systemic capital pivot toward freight automation."
    claimRefs:
      - "CM001"
      - "CM002"
  - calloutType: "risk"
    title: "Municipal Permitting Fragmentation and Fleet Capital Intensity"
    body: "While China commercial road-testing policies are highly supportive in tier-one and tier-two cities, international expansion to Southeast Asia and the Middle East faces fragmented municipal regulations, localized mapping prerequisites, and substantial upfront vehicle manufacturing capital requirements."
    claimRefs:
      - "CM011"
      - "CM012"
