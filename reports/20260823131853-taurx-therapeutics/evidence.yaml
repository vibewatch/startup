evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board composition, committee structure, independence status, and investor control rights.
    whyItMatters: Governance quality and investor influence affect financing flexibility and risk control.
    diligencePath: Request an updated board list, shareholder rights summary, and governance charter pack from management.
    relatedQuestionRefs:
      - QO008
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-mechanics
    missingEvidence: The exact date, size, share class, and participants of the transaction underlying the $2.5B valuation signal.
    whyItMatters: Entry price and preference-stack risk cannot be underwritten without transaction mechanics.
    diligencePath: >-
      Request the latest financing summary, cap table, and any secondary transfer memo or board-approved valuation
      materials.
    relatedQuestionRefs:
      - QO012
      - QO013
      - QO025
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Reliable public figures for revenue, ARR, headcount, and cash runway.
    whyItMatters: These are core cover metrics needed to assess commercialization readiness and financing risk.
    diligencePath: >-
      Ask management for current KPI dashboard, audited accounts, and staffing plan; keep unsupported fields null in
      public artifacts.
    relatedQuestionRefs:
      - QO014
      - QO015
  - type: private-evidence-only
    severity: minor
    topic: expanded-access
    missingEvidence: Scale, geography, and continuation criteria for the expanded access population after trial completion.
    whyItMatters: >-
      Post-trial use can signal physician confidence and operational readiness, but the public statement is qualitative
      only.
    diligencePath: Request expanded access enrollment numbers, retention, and safety summaries from management.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: treatable-population-sizing
    missingEvidence: >-
      Direct public estimates of the biomarker-confirmed MCI-AD population eligible for an oral disease-modifying
      therapy in TauRx’s intended launch markets.
    whyItMatters: This gap separates burden-based TAM rhetoric from a usable commercial model.
    diligencePath: >-
      Build a bottom-up diagnosis and eligibility model using country-level memory-clinic throughput, biomarker testing
      rates, and stage distribution.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: hmtm-pricing-assumptions
    missingEvidence: TauRx pricing intent, gross-to-net assumptions, and expected payer dossier strategy.
    whyItMatters: Market attractiveness cannot be translated into revenue without price and reimbursement assumptions.
    diligencePath: Request management pricing scenarios, HTA-prep materials, and payer feedback from MHRA/NICE parallel discussions.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: market-forecast-drift
    missingEvidence: >-
      A consistent 2026 third-party market-size forecast specifically for early-stage Alzheimer’s disease-modifying
      therapies rather than broad dementia burden.
    whyItMatters: Generic market reports often mix symptoms management, care services, and disease-modifying drugs.
    diligencePath: Use specialized therapy-market reports only if they isolate diagnosed early AD drug spend.
    relatedQuestionRefs:
      - QM022
  - type: conflicting-data
    severity: material
    topic: reimbursement-spillover-risk
    missingEvidence: >-
      Clear evidence on whether NICE’s anti-amyloid skepticism would relax for an oral tau-targeting drug with similar
      efficacy magnitude.
    whyItMatters: TauRx may solve workflow burden without solving cost-effectiveness thresholds.
    diligencePath: Model NHS scenarios using comparator-effect-size thresholds and seek payer interviews after any MHRA outcome.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: real-world-switching
    missingEvidence: >-
      Direct physician interview data on whether patients would switch from anti-amyloid or symptomatic regimens to an
      oral tau therapy.
    whyItMatters: Competitive win assumptions depend on real clinician behavior not just product attributes.
    diligencePath: Interview memory-clinic neurologists and payer medical directors in the UK and US.
    relatedQuestionRefs:
      - QP017
      - QP018
  - type: missing-source
    severity: material
    topic: head-to-head-positioning
    missingEvidence: No public head-to-head trial comparing HMTM with approved anti-amyloid therapies or symptomatic standards.
    whyItMatters: Relative clinical value remains inferential rather than directly observed.
    diligencePath: Model comparative burden and effect using indirect treatment comparison only as a placeholder.
    relatedQuestionRefs:
      - QP003
      - QP009
  - type: private-evidence-only
    severity: material
    topic: partnering-strategy
    missingEvidence: TauRx’s commercial partnering or licensing strategy versus large-cap incumbents.
    whyItMatters: Distribution weakness is one of TauRx’s biggest competitive vulnerabilities.
    diligencePath: Ask management whether launch is intended solo licensed or co-promoted by territory.
    relatedQuestionRefs:
      - QP016
      - QP024
      - QP025
  - type: conflicting-data
    severity: material
    topic: credibility-gap
    missingEvidence: >-
      A regulator-level explanation of how historical placebo contamination and subgroup controversies will or will not
      limit label and promotion.
    whyItMatters: Evidence credibility is the central variable in moat durability.
    diligencePath: Review MHRA questions and any future public assessment report closely.
    relatedQuestionRefs:
      - QP009
      - QP020
      - QP025
  - type: missing-source
    severity: material
    topic: debt-and-project-finance
    missingEvidence: No public evidence of debt facilities project-finance obligations or structured credit exposure was found.
