  topStrengths:
    - >-
      TauRx has a peer-reviewed phase 3 package and a live MHRA review process rather than only theoretical or
      early-stage promise.
    - HMTM is differentiated as an oral tau-targeting approach in a very large Alzheimer’s disease market.
    - >-
      Approved amyloid therapies demonstrate that disease-modifying Alzheimer’s assets can create substantial strategic
      value if regulators and payers engage.
  topRisks:
    - The investment case is highly binary around MHRA review and the acceptability of TauRx’s evidence package.
    - >-
      The frequently cited ~$2.5B private valuation is supported mainly by tracker-style public references rather than a
      transparent recent priced transaction.
    - >-
      Current cash runway, commercial readiness, payer pathway, and the content of regulator feedback are
      under-disclosed.
  unresolvedGaps:
    - Current cash balance, burn rate, and runway through the MHRA process are not public.
    - The substance of MHRA questions and TauRx’s detailed responses is not public.
    - >-
      The exact basis for the cited ~$2.5B private valuation or any late-2025 secondary price support is not transparent
      in the public record.
    - Launch assumptions around pricing, reimbursement, specialist uptake, and manufacturing readiness remain private.
