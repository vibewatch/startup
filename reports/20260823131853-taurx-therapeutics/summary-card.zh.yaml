  topStrengths:
    - TauRx 拿出了经过同行评议的 3 期数据包，MHRA 审评也在推进，不只是理论故事或早期潜力。
    - HMTM 走口服 tau 靶向路线，在庞大的阿尔茨海默病市场里有差异化。
