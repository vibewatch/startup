      - number: '7.4'
        title: 缓释因素和击穿条件
        blocks:
          - type: paragraph
            body: >-
              TauRx 的风险缓释因素真实存在，但并不完整。公司有同行评议的 3 期论文、活跃的 MHRA
              流程、长期开发历史，并且口服便利性主张比许多竞争对手更清晰。这些因素降低了纯技术新颖性风险。不过，它们不能排除监管方或支付方认为证据太弱、无法支撑所声称获益水平的可能性。

              因此，正确的击穿条件应当能从外部观察。MHRA
              负面决定，或要求新增重大确证证据，是最清晰的投资逻辑击穿。第二个关键触发点，是证据显示现有资金不足以支撑再跑一个监管周期。第三，重大知识产权挑战或有效独占性丧失，会削弱本已狭窄的护城河。第四，任何获批之后若仍无法说明可信的支付方路径，名义上积极的监管结果也会打折。

              风险结论是：TauRx 只适合能承受后期二元监管事件、严重依赖证据解释、且运营和资本公开透明度有限的投资人。
