      - number: '2.3'
        title: 采用驱动因素、约束与竞争语境
        blocks:
          - type: paragraph
            body: >-
              多个结构性因素支撑疾病修饰型阿尔茨海默病疗法的需求。第一，患者和照护者需求庞大且持续，因此即便治疗只能略微延缓衰退，也会支撑尝试意愿。第二，监管机构和支付方已经承认这个类别真实存在：Leqembi 和
              Kisunla 在美国获批，其上市已把“阿尔茨海默病可用疾病修饰疗法处理，而不只是缓解症状”的观念正常化。第三，管线多元化正在提升市场对非淀粉样蛋白路径的信心。Alzheimer’s Association
              2026 年管线综述显示，tau 靶向药物在过去十年里从活跃管线的约 6% 增长到约 20%，按开发投入占比已经接近淀粉样蛋白靶向项目。


              约束同样关键。NICE 对 donanemab 和 lecanemab 的最终草案指南认定，以 NHS 当前成本看，两款药的收益都不足以证明其合理性。这给 TauRx
              释放出重大信号：即使疗效真实，公费体系内的采用也会受到健康经济学审视约束，而不只是未满足需求驱动。抗淀粉样蛋白疗法还面临生物标志物确认、输注负担和 ARIA 风险等运营瓶颈。两款产品的 FDA
              安全措辞都凸显了持续监测需求。


              因此，TauRx 的切入口不是“没有竞争”，而是“只要疗效站得住，就有空间容纳一种给药成本更低、口服、负担更轻的选择”。BioSpace 的 2026 年行业报道和 AC Immune 的管线页面也显示，tau
              赛道正在变拥挤。TauRx 受益于比大多数 tau 竞争者更靠后期，但市场正在走向更好诊断、更早干预和多机制并存的组合。时间优势重要，但前提是获批和报销要赶在下一波 tau 项目成熟之前落地。
