      - number: '4.2'
        title: 成本结构偏临床和监管，而非商业
        blocks:
          - type: paragraph
            body: >-
              TauRx 的成本基础主要由长期临床开发、监管工作，以及横跨新加坡和英国的公司管理费用驱动。公开试验和论文材料显示，LUCIDITY 在 82 个中心纳入 598 名参与者；公司相关材料称，更广泛 HMTM
              证据包涉及超过 3,000 名参与者。这个规模意味着，即便在上市准备之前，也会产生可观的 CRO、中心管理、生物标志物、影像、药物警戒和制造费用。


              当前运营模型还指向相对较低的近期销售和营销支出，至少低于商业化阶段同行。TauRx 可见外部足迹仍偏科学、医学和监管，而不是商业。Qureos
              招聘快照在审查时只显示一个公开职位，并不像大规模上市前商业招聘潮。这不能证明整体运营精简，但确实说明公开证据中，现场销售团队搭建有限。


              由于公司不发布经审计经营报表，毛利率、月度烧钱速度和营运资本需求都只能推断。若获批，小分子口服疗法通常意味着比生物抗体更好的制造经济性，但这是未来毛利率假设，而不是当前财务事实。今天的资本强度仍是临床阶段生物技术公司的资本强度。
