      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              TauRx 的领导架构带有很强的创始人印记。Claude Wischik 仍是联合创始人、董事长兼首席执行官；官方履历清楚显示，公司的科学假设、公共倡导和监管定位都与他个人围绕 tau
              病理的研究紧密相连。John Storey 2002 年加入，2023 年出任首席技术官，在化学发现、放大生产和产业化之间提供连续性。这种组合给 TauRx
              带来可信的技术核心，但也把机构记忆和战略权力集中在一小群从公司早期就存在的人手中。


              更广的领导层页面显示，TauRx 的后期运营配置比早期新闻报道所能呈现的更完整。Glenn Corr 负责跨临床、监管、开发、人力、质量、IT、传播、法务、财务和融资策略的运营。Richard
              Stefanacci 带来支付方政策和 Medicare 准入经验；一旦 TauRx 进入报销讨论，这直接相关。Bjoern Schelter 的职责明确横跨分析、监管、商业和融资工作流，值得注意，因为
              TauRx 的获批策略高度依赖复杂的生物标志物、延迟起始和外部对照分析。领导层名单还包括有姓名的监管、医学、商业、法务、财务、人力和运营负责人。


              即便如此，公开治理细节仍不完整。第三方数据库显示公司拥有较宽的董事会和股东基础，但公司没有公开提供上市生物技术公司通常会披露的委员会、独立性或激励信息。因此，尽调结论是混合的：管理深度好过纯粹创始科学家店，但关键人物依赖、私营公司不透明，以及有限董事会透明度，仍是承销该业务时真实存在的治理约束。
