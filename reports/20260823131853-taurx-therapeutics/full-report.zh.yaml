      - number: '7.2'
        title: 运营、质量和供应风险仍披露不足
        blocks:
          - type: paragraph
            body: >-
              TauRx 的运营复杂度高于其小规模公开足迹所暗示的水平。运行跨国阿尔茨海默病试验、处理生物标志物和影像证据、回应 MHRA
              信息要求，并为潜在上市做准备，都需要高质量运营底盘。但公开记录几乎没有说明商业化生产准备、批次放行流程、供应商集中度、药物警戒基础设施，或上市日医疗支持能力。

              口服便利性只有在供应质量可靠、医生相信公司能支持真实世界使用时，才会变成真正优势。神经慢病治疗里，供应中断、标签混乱或安全沟通失败，都会快速损害信任。公司的政策页面显示，其关注网站安全、分析和个人数据处理，但没有回答药品供应和一线准备执行这个更大的运营问题。

              最强的缓释因素是，TauRx 并非从临床前无名状态直接走向上市；它已经在受控临床环境中运营多年。最弱的一点是，公开的生产和支持细节仍然稀疏，留下了有意义的尽调缺口。
            claimRefs:
              - CR011
              - CR012
