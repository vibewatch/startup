  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              TauRx
              不是低质量公司。产品有差异化，靶向疾病空间大，机制假设在生物学上有分量，公司也已把资产推进到真实监管流程，而不是停留在永远兑现不了的临床前承诺。这意味着该资产确实有非零战略价值。投资人的问题在于入场价格。常被引用的
              ~$2.5B 私有估值，公开证据主要来自追踪数据库，而不是清楚披露条款的 2025 或 2026 定价融资轮。与此同时，公司仍面对二元监管事件，市场准入和融资韧性也有实质不确定性。

              因此，正确判断必须看价格。若入场价格显著更低，或监管验证更清晰，资产可能变得有吸引力。但在当前释放出的估值水平下，公开证据没有提供足够安全边际。实务建议是观察，而不是现在投资。投资逻辑有意思，但价格似乎预支了比当前证据基础更多的确定性。
