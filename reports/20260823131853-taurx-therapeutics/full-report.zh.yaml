      - number: '8.4'
        title: 最终尽调问题和投资逻辑击穿触发点
        blocks:
          - type: paragraph
            body: >-
              真要现在投资，所需私下尽调深度会高于公开市场对同等估值发行人的接受程度。第一个缺口是当前现金和现金跑道。第二个是 MHRA
              对话内容，尤其是仍未解决的问题。第三个是管理层如何考虑任何获批后的定价、报销、专科目标人群和上市顺序。第四个是排他窗口在实践中到底有多强，而不只是纸面上有多强。第五个是究竟有什么二级市场或内部估值证据支撑被引用的私有估值标记。

              这些缺口也定义了投资逻辑击穿触发点。MHRA
              负面结果，或要求开展重大的新确证研究，是最清晰的止损信号。较弱但仍严重的信号，是证据显示公司必须在紧急状态下再融资。即便获批，如果标签范围或支付方准入让药物只能停留在商业利基，获批本身也不够。投资结论因此很简单：TauRx
              值得密切跟踪，但现有公开证据不足以把当前追踪估值视为显然可投资。
