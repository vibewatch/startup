    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of the most decision-relevant public and private valuation references reviewed for TauRx rather than an
        exhaustive universe of Alzheimer's comparables.
    columns:
      - 可比项
      - 指标
      - 倍数或估值状态
      - 参考意义
      - 局限
    rows:
      - - TauRx 追踪页面
        - 私募估值信号
        - ~$2.5B 追踪水平
        - 与当前入场争论直接相关
        - 公开记录中没有透明的近期定价轮作为锚点
      - - Leqembi 产品线背景
        - 已获批抗淀粉样蛋白疗法的商业动能
        - 已获批且销售正在放量的背景
        - 显示监管和市场会奖励 AD 疾病修饰进展
        - 有大型上市合作伙伴支持，且不是单资产公司
      - - Kisunla 上市背景
        - 已获批抗淀粉样蛋白疗法上市，同时存在支付方摩擦
        - 已获批，但准入仍受审视
        - 表明获批有价值，但不足以支撑经济性
        - 输注抗体、且发起方多元，并非贴近的运营可比
      - - AC Immune tau 平台
        - 公开市场上聚焦 tau 的合作平台
        - 当前规模较小，但有里程碑支持的期权性
        - 可作为 tau 信号的同业参照
        - 阶段更早，结构上也不同于临近申报的 TauRx
      - - 行业格局报告
        - 市场增长和竞争者密度
        - 品类规模大且在增长，已有多名进入者
        - 支撑 TauRx 面向的是真实商业赛道
        - 市场报告无法给单资产私有发行人定价
    notes: 可比分析只提供方向，不机械迁移倍数。
    claimRefs:
      - CV012
      - CV016
      - CV022
      - CV023
      - CV024
      - CV029
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - MHRA 决定
        - 驳回或要求开展大型确证性研究
        - 击穿近期商业化逻辑
        - 转向负面立场
      - - 融资压力
        - 出现现金跑道短且缺少催化剂衔接的证据
        - 延迟转化为稀释压力
        - 下调期望价值，并要求重置入场价
      - - 标签和准入
        - 获批但适用范围窄、报销路径弱
        - 将资产从广谱逻辑改写为小众产品
        - 大幅下调估值区间
      - - 专科医生信任
        - 持续的临床医生质疑压过便利性收益
        - 即便获批也拖慢采用
        - 从可投资期权转为仅观察
      - - 独占期韧性
        - 专利或自由实施弱点暴露
        - 降低终值和合作杠杆
        - 大幅打折乐观情景
    notes: 终止触发因素是可观察的外部事件，不是对管理层质量的印象分。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV037
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 现金和现金跑道
        - 当前资产负债表和月度烧钱速度未公开
        - 决定 MHRA 审评期间的稀释风险
        - 索取管理层资金衔接方案和最新账目包
      - - 监管沟通
        - MHRA 问题内容和遗留事项未公开
        - 最直接判断可获批性的材料
        - 索取可提交董事会的监管互动摘要
      - - 商业准入计划
        - 定价、报销和专科医生触达计划未公开
        - 决定获批能否转化为有意义收入
        - 审阅上市模型和支付方工作流
      - - 估值支撑
        - ~$2.5B 标记的依据并不完全透明
        - 判断当前入场价是否反映真实市场出清价所需
        - 索取最新内部标记和老股交易证据
      - - IP 持久性
        - 实际独占期和挑战敞口尚未充分量化
        - 塑造终值和合作杠杆
        - 获取专利律师备忘录和到期图谱
    notes: 主要尽调负担在于获取私有证据，而不是继续做互联网检索。
    claimRefs:
      - CV017
      - CV018
      - CV033
      - CV034
      - CV040
figures:
  - id: FO001
    title: TauRx 里程碑时间线
    type: timeline
    layout: standard
    summary: 从 tau 发现到 2026 年英国审评窗口的时间线。
    data:
      items:
        - date: '1988-01-01'
          label: 识别出 tau 缠结结构
          detail: Claude Wischik 的早期 tau 研究开启了公司背后的科学主线。
          tone: positive
        - date: '1996-01-01'
          label: tau 聚集抑制剂概念
          detail: 据报道，甲基硫堇类分子可溶解 tau 缠结。
          tone: positive
        - date: '2002-01-01'
          label: TauRx 在新加坡成立
          detail: 公司成立，推进聚焦 tau 的神经退行性疾病研究商业化。
          tone: positive
        - date: '2004-01-01'
          label: II 期项目启动
          detail: tau 聚集抑制剂路线首次进入实质性临床测试。
          tone: positive
        - date: '2012-01-01'
          label: III 期阶段开启
          detail: 阿尔茨海默病和 bvFTD 的首批后期研究启动。
          tone: positive
        - date: '2016-12-10'
          label: Lancet 发表 III 期结果
          detail: 围绕疗效和活性安慰剂解读的后期核心争议进入文献，成为固定参照。
          tone: risk
        - date: '2017-12-01'
          label: LUCIDITY 单药治疗试验启动
          detail: TauRx 围绕低剂量单药治疗和淀粉样蛋白阳性人群重置策略。
          tone: positive
        - date: '2022-11-14'
          label: Tracxn 披露 Series E 轮
          detail: 最新浮出公开视野的融资轮总额为 $119M。
          tone: positive
        - date: '2024-07-01'
          label: 英国 MHRA 申请提交
          detail: TauRx 寻求 HMTM 在 MCI-AD 和轻至中度阿尔茨海默病中的首次获批。
          tone: positive
        - date: '2024-12-31'
          label: 监管机构要求补充信息
          detail: 公司确认 MHRA 提问，并与 NICE 持续对话。
          tone: risk
        - date: '2026-01-21'
          label: LUCIDITY 结果发表
          detail: 经同行评议的 JPAD 发表文章突出其生物标志物和延迟启动发现。
          tone: positive
    approximationNotes: null
