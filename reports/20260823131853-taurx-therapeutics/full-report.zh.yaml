      - number: '3.2'
        title: 已获批既有玩家：抗淀粉样蛋白疗法设定证据和准入门槛
        blocks:
          - type: paragraph
            body: >-
              Leqembi 和 Kisunla 重要，是因为它们同时证明了两件事：支付方和医生确实有兴趣采用疾病修饰治疗，但进入这一市场的运营门槛很高。FDA
              材料显示，两款药都绑定早期阿尔茨海默病人群，并带有围绕淀粉样蛋白相关影像异常的安全警示。Kisunla 自身商业材料强调有限疗程治疗和成本案例；Leqembi
              的销售额和收入指引则说明，在大规模上市基础设施支撑下，即使产品使用繁琐，也能产生有意义的收入。


              因此，这些产品同时为 TauRx 制造威胁和机会。威胁在信任和基础设施：大型公司能承受慢采用，开展结局研究，并大规模教育专科医生。机会在减负。TauRx 公司材料反复声称，HMTM
              是口服药，且截至目前试验中未显示 ARIA，因此可以更容易地融入标准护理。如果这一说法站得住，TauRx 就可以把 HMTM 定位在与淀粉样蛋白抗体“输注加监测”负担的对比上，而不只是绝对疗效对比。


              不过，已获批既有玩家也设置了报销现实检查。NICE 以 NHS 成本效果不足为由拒绝 lecanemab 和 donanemab，意味着 TauRx
              不能只依赖便利性。即便药物给药成本更低，如果证据包看上去脆弱，或效果量相对要价显得太小，仍可能失败。
