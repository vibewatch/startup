      - number: '8.3'
        title: 情景分析比直接可比倍数更重要
        blocks:
          - type: paragraph
            body: >-
              直接可比公司并不完美。Biogen 和 Eli Lilly 是多元化成熟公司，拥有已获批阿尔茨海默病产品、销售基础设施和资产负债表；TauRx 没有这些。AC Immune 和其他聚焦 tau
              的同行在科学上更接近，但比 TauRx 更早期，或结构上不同于其接近注册申报的单资产状态。因此，粗暴套用收入或市值倍数不合适。情景框架更站得住。

              乐观情景下，TauRx
              获批、拿到可用标签、守住口服差异化可信度，并证明专科采用加支付方互动能创造真实商业利基。基准情景下，获批继续延迟或更受限制，公司为延迟融资，最终采用窄于热情支持者的预期。悲观情景下，监管方要求实质性新证据，或融资负担在清晰结果出现前上升。在这个框架下，上行空间存在，但概率加权中枢仍低于追踪数据库里的私有估值标记。
