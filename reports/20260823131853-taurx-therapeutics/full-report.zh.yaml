      - number: '2.2'
        title: 买方、用户与护理路径
        blocks:
          - type: paragraph
            body: >-
              任何 TauRx 产品的终端用户都会是早期阿尔茨海默病患者，或阿尔茨海默病所致 MCI
              患者；但经济买方通常是公私支付方，运营买方则是由神经科医生牵头的医疗系统。这一区分已经在抗淀粉样蛋白市场中显现。Leqembi 和 Kisunla 的 FDA
              标签针对轻度认知障碍或阿尔茨海默病轻度痴呆阶段患者，但治疗采用远不只是开出处方。验证性生物标志物检测、记忆服务转诊、输注中心可用性、MRI 监测和支付覆盖都会塑造准入。Lilly
              自己的获批公告明确指出，Medicare 覆盖和患者成本暴露是商业化核心问题。


              这为口服疗法创造了结构性不同的机会。TauRx 的 FAQ 和公司页面反复主张，HMTM 是片剂，按公司说法不需要输注或高强度安全监测，因此可以嵌入现有健康和社会照护系统。GlobalData
              也独立提出同样商业观点：口服 tau 靶向药物比输注型抗淀粉样蛋白抗体更容易纳入标准护理路径，尤其适合面临物流负担的患者和照护者。


              不过，护理路径仍由专科环节中介。患者先因记忆问题就诊，被转入记忆或神经科服务，接受认知测试，并越来越需要面对生物标志物确认预期。TauRx 自己的 MCI
              材料强调，早期诊断至关重要。因此，尽管用户是患者和照护者，真实市场接口是一条诊断与报销链，涉及初级保健转诊、专科检查、监管批准和支付方接受。市场渗透率也就不只取决于原始疗效，同样取决于路径简化。
