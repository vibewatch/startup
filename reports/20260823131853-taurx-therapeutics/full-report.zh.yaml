      - number: '6.3'
        title: 留存、扩张和集中度大多仍未验证
        blocks:
          - type: paragraph
            body: >-
              TauRx 客户图景中最大的缺口是耐久性。HMTM
              尚未上市，因此没有公开的净留存率（NRR）、总留存率（GRR）、流失、续约或处方持续性数据集。任何关于用户留存的说法，都只能用公开参与的连续性、重复试验工作和患者教育生态的持续存在来代理。这有方向性价值，但远弱于真正商业留存证据。


              即使没有收入披露，集中度风险也很清楚。TauRx 当前依赖少数利益相关方渠道：专科记忆门诊研究者、英国及未来可能的英国以外监管机构，最终还会依赖集中的支付方集合。尤其在英国，即便疗法获批，也仍必须在 NICE
              已对抗淀粉样蛋白药物提出异议的市场中穿过成本效果压力。这意味着未来获客不只是医生问题，更是支付方转化问题。


              如果产品获批，扩张逻辑是存在的。TauRx 可以指向 MCI、轻度至中度阿尔茨海默病和其他 tau
              蛋白病中的相邻用户群，也可以强调口服给药路径的优势：它可能把处方医生基础扩展到输注能力中心之外。但在有资金支持的准入路径出现之前，扩张仍是假设。
