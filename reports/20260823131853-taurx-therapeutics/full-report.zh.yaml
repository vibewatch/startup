      - number: '6.4'
        title: TauRx 的客户判断
        blocks:
          - type: paragraph
            body: >-
              和许多临床阶段生物科技公司相比，TauRx
              的商业化前客户验证更扎实，因为核心项目已经触达庞大的跨国患者和研究者网络。患者及照护者教育界面也说明，公司认真在围绕早期阿尔茨海默病干预建立需求和认知。这些都是实打实的优势。

              反面是，所有决定商业成败的客户指标仍然缺失。没有支付方转化证据，没有常规护理中的具名生产部署，没有真实世界持续用药数据，没有收入集中度披露，也看不到获批后的合作伙伴或分销结构。因此，这个产品有采用准备度，但客户模型还不成熟。

              正确结论是：TauRx 在商业化前互动上可评为有前景；若获批，渠道契合度也有前景；但在支付方和处方证据出现之前，持久性风险仍高。
