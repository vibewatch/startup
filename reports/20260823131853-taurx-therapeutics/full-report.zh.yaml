      - number: '7.3'
        title: 依赖、人员和融资风险紧密相连
        blocks:
          - type: paragraph
            body: >-
              TauRx 的依赖结构高度集中。科学解释仍强烈绑定创始人兼长期领导者 Claude
              Wischik；他的观点和论文是公司叙事的核心。由此产生关键人风险：如果领导层可信度走弱，监管和投资人信心也可能随之走弱。公司还依赖专门的记忆门诊研究者、监管方和相对少数的利益相关方渠道，而不是广泛商业网络。

              融资风险会放大这种集中度。公开证据显示股东持续支持，包括配股和权证行权，但没有清晰的当前现金余额。如果 MHRA 审评推迟，TauRx
              可能需要在压力下再次融资，资金来源更可能是现有投资人或战略合作方，而不是广泛公开市场。负面情景不只是稀释，而是监管延迟传导为融资紧迫，再传导为竞争定位转弱。

              最后，合作伙伴和准入风险也重要，因为即便获批也不会消除支付方摩擦。NICE 对抗淀粉样蛋白疗法的怀疑提醒投资人：在阿尔茨海默病里，临床获批和获得支付后的采用是两回事。
