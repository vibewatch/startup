  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和定价大体仍是未来状态
        blocks:
          - type: paragraph
            body: >-
              TauRx 更应被理解为一家商业化前或收入接近为零的生物技术公司，而不是一家正在运营的阿尔茨海默病治疗业务。公司官网、论文材料和监管报道都围绕临床开发、监管申报和商业化抱负展开，而不是当前上市销售。HMTM
              仍是研究性药物，公司相关报道所描述的 MHRA 审评意味着 TauRx 尚未跨过从研发支出到可报销产品收入的界线。这极大限制了对已实现收入质量的判断。


              未来收入模型概念上很直接，但实践中尚未验证。如果 HMTM 获批，TauRx
              很可能通过向专科记忆照护路径销售处方药变现，并可能由区域合作支持。不过，公开市场没有披露价格、总额到净额假设、返利结构或支付方合同模型。因此，当前定价分析必须依赖 Leqembi 和 Kisunla
              等可比对象来理解疾病修饰型阿尔茨海默病疗法的价值区间，同时承认 TauRx 定位的是一种给药负担更低的口服疗法，而不是输注抗体。


              第三方数据聚合器甚至在 TauRx 当前是否有任何有意义收入上意见不一。Seedtable 主要用融资轮次和信号而非运营表现来刻画公司；Tracxn
              以及早期尽调材料引用的其他跟踪平台则暗示收入要么可忽略，要么高度估计。这种不一致强化了关键财务结论：当前报告收入不具备决策级质量，投资判断必须转而承销未来获批概率和资本充足性。
