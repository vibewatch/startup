  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 商业化前生物技术语境下的客户基础分层
        blocks:
          - type: paragraph
            body: >-
              由于 TauRx 目前没有上市产品，其当前客户基础并不是一组经典付费账户。最准确的分层有三层。第一层是终端用户和倡导者：患有轻度认知障碍或早期阿尔茨海默病的患者及其照护者，他们消费公司的教育材料，并在 HMTM
              获批后最终可能使用该药。第二层是处方和试验渠道用户：神经科医生、记忆门诊团队、主要研究者和中心网络，他们决定疗法是否被测试、讨论，并可能被处方。第三层是支付方和准入守门人，例如 NHS、NICE
              以及同类报销机构，它们决定临床兴趣能否转化为有资金支持的使用。


              TauRx
              自己的网站架构支撑这种分层。网站为患者和照护者、医疗专业人士、媒体，以及教育或倡导资源设置了不同入口，说明公司已经在为不同采用受众建立差异化沟通。不过，这些仍是准备度和教育界面，不是经常性收入关系的证据。


              实际含义是，本章应被读作利益相关方参与漏斗，而不是商业规模证明。TauRx 确实有商业化前受众证明，但还没有公开客户账本。
