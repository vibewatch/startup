      - number: '5.3'
        title: 信任、监管质量控制与路线图
        blocks:
          - type: paragraph
            body: >-
              对 TauRx 来说，信任首先是监管和科学问题，然后才是商业问题。公司当前的质量信号不是认证徽章或软件合规报告，而是它已经汇集一套长期临床数据，在同行评议期刊发表
              LUCIDITY，并推进到英国上市许可申请阶段。公司更新称，针对 MHRA 信息请求的回复已最终完成；外部报道则称 MHRA 正在积极评估 HMTM。这让 TauRx
              进入后期信任建立周期，监管机构的看法比任何营销主张都更重要。


              因此，路线图由里程碑驱动。近期里程碑包括 MHRA 审评、潜在英国准入讨论，以及继续用已发表的生物标志物和影像数据支撑产品画像获得更广泛接受。中期开发包括更广司法辖区申报，以及在
              MCI、轻度至中度阿尔茨海默病和相邻 tau 蛋白病上的适应症扩展或主张强化。


              信任挑战在于，早期后期研究仍是证据包的一部分。产品具有多年开发和数千名受试者暴露意义上的成熟度，但不具备一条清晰、无争议注册路径意义上的成熟度。在产品成熟度能被视为商业准备度之前，TauRx
              必须先把一套技术内容丰富的证据包转化为监管认可的标签。
