companyProfile:
  summary: >-
    TauRx Therapeutics 是一家私有后期神经退行性疾病公司，2002 年成立于新加坡，运营重心在苏格兰阿伯丁。公司围绕 hydromethylthionine mesylate（HMTM）搭建业务；HMTM
    是一款面向早期阿尔茨海默病的口服 tau 聚集抑制剂，已走过漫长临床开发周期，最终进入同行评议的 3 期论文发表和仍在进行的英国 MHRA 审评。公开第三方来源显示，TauRx 终身披露融资约 $434 million，并有约
    $2.5 billion 的跟踪式估值信号，但当前现金跑道和该估值的精确依据仍披露不足。
