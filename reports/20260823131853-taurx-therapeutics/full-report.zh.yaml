  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产图谱
        blocks:
          - type: paragraph
            body: >-
              TauRx 不是许多风投支持治疗公司那种多平台生物技术企业。公开材料反复聚焦一个核心产品
              HMTM，并将其定位为一款研究性口服治疗，用于阿尔茨海默病所致轻度认知障碍和轻度至中度阿尔茨海默病痴呆。公司也用相关教育材料铺陈更广泛的 tau
              蛋白病机会，包括额颞叶痴呆和其他神经退行性障碍，但商业价值驱动因素仍是阿尔茨海默病里的 HMTM。


              从工作流看，该产品意图像一种口服慢病疗法一样嵌入记忆门诊护理，而不是像需医院输注的生物制剂。这个产品设计选择有意义。公司和媒体材料强调可及给药、更低医生负担，以及在疾病进展更早阶段使用的可能性。因此，预期用户路径是：通过临床和生物标志物检查识别患者，开具口服
              HMTM，随时间监测认知和生物标志物，并避开抗淀粉样蛋白抗体所需的输注中心和 ARIA 监测组合。


              资产图谱仍然狭窄。HMTM 是核心阿尔茨海默病资产；TauRx 也提到 bvFTD 和更广泛 tau 病理作为相邻机会，但更应将其理解为生命周期延展或机制期权，而不是完全独立的产品线。
