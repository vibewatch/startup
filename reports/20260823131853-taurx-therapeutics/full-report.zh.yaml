  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 横跨直接、既有与替代方案的竞争版图
        blocks:
          - type: paragraph
            body: >-
              TauRx 并不是在真空里竞争。最直接的参照类别不是其他 tau 项目，而是已经打开市场的获批抗淀粉样蛋白疾病修饰疗法。Leqembi 和 Kisunla
              定义了当前早期阿尔茨海默病的临床预期：两者都在美国获批，都面向轻度认知障碍或轻度痴呆阶段患者，也都有大型商业组织背书，能够为上市、教育、诊断合作和上市后研究提供资金。这让它们成为既有疾病修饰竞争者，尽管其靶点是淀粉样蛋白而非
              tau。

              第二层竞争来自不断增长的 tau 导向或相邻疾病修饰项目浪潮。2026 年阿尔茨海默病管线已经明显多元化，BioSpace 也明确把 tau 描述为淀粉样蛋白验证之后的下一个重要机制。Biogen 和 Ionis
              目前在 diranersen 上拥有下一波最可信的 tau 项目之一；2 期 CELIA 顶线数据显示，虽然主要剂量反应终点未达成，但生物标志物有影响，认知也有获益。AC Immune、Oligomerix 和
              reMYND 也说明，tau 或 tau 相邻口服项目已经不再停留在假设层面。

              第三个竞争者是现状本身：对症口服药、照护者应对，以及延迟诊断。这个替代项比看上去更重要，因为很多患者根本没有进入疾病修饰治疗漏斗。对 TauRx
              来说，赢不只是打败竞争资产，还要打破未治疗进展的惯性，以及既有对症方案的熟悉度。
