      - number: '6.2'
        title: 试验入组和利益相关方参与是当前最主要的采用证明
        blocks:
          - type: paragraph
            body: >-
              真实个人和机构愿意使用或支持 TauRx 产品的最强公开证据，来自临床参与。2026 年 LUCIDITY 论文及相关报道描述了一项 3 期试验：598 名参与者，分布在加拿大、欧盟、英国和美国的 82
              个中心。这在商业化前生物技术公司中是有意义的采用证明：它意味着中心同意开展研究，研究者同意招募受试者，患者也同意围绕一种有争议但科学上差异化的阿尔茨海默病疗法进入长期项目。


              TauRx 还提到更广泛的证据基础，涉及 HMTM 试验中超过 3,000
              名参与者。这对客户尽调很重要，因为神经科商业化前信任很大程度取决于产品是否在严格随访下接触过真实患者。此外，公司的患者教育页面、媒体页面和倡导材料说明，它正在主动培养未来用户、照护者和记者的认知。


              这些都不等于商业部署，但比纯临床前故事更强。TauRx 已获得患者、照护者、研究者和外部受众的真实世界参与；只是尚未证明获批后的转化。
