      - number: '1.4'
        title: 进入 2026 年决策窗口前的里程碑与当前状态
        blocks:
          - type: paragraph
            body: >-
              作为一家私有生物技术公司，TauRx 的里程碑弧线长得少见：核心 tau 发现可追溯到 1988 年，tau 聚集抑制剂概念到 1996 年，公司成立到 2002 年，首次 II 期研究到 2004 年，首批
              III 期项目到 2012-2016 年，LUCIDITY 验证性单药治疗项目则从 2017
              年延续至今。公开科学论文页面和临床试验时间线显示，公司在安慰剂设计和临床解读屡受争议后，仍持续发表、修订试验设计并为假设辩护。这种坚持既是优势，也是警示。它证明科学承诺和资本韧性，但也反映公司花了多长时间才走到一个可能可获批的申报包前。


              当前公司状态足够清楚。HMTM 仍是研究性药物，尚未获任何监管机构批准，正在接受英国 MHRA 审评。TauRx FAQ 称，MHRA 决定预计会在 2026 年作出；若获批，NICE 将评估 NHS
              使用。公司还称，部分完成试验的患者通过扩展准入项目用到了该药，意味着商业化启动前，公司仍与已治疗人群保持接触。公开材料反复把 HMTM 定位为一种负担更低的口服选择，用来对比需要输注的抗淀粉样蛋白抗体。


              从尽调角度看，2026 年状态窗口具有决定性。如果 MHRA 审评把 TauRx
              从研究浓度很高的私有生物技术公司转化为首次上市商业公司，过去二十多年的资本和试验投入就可以被重述为漫长但连贯的开发周期。如果审评延长、驳回或要求更多数据，同一段历史也可被解读为在缺乏足够有说服力的主要终点成功下不断重新解释证据。这一二元结果贯穿后续每一章。
