      - number: '2.4'
        title: 规模测算视角及其对 TauRx 的含义
        blocks:
          - type: paragraph
            body: >-
              严谨的规模测算需要多重视角，而不是一个宽口径总可用市场（TAM）数字。最宽的视角从全球痴呆患病率开始，但这只是一种公共卫生负担代理。第二个更窄的视角是把阿尔茨海默病作为痴呆的主导亚型。第三个视角进一步收窄到早期有症状人群，其特征接近已获批抗淀粉样蛋白市场和
              TauRx 自身目标申报人群。第四个视角则追问，这些患者是否处在愿意诊断、监测并报销治疗的医疗系统里。市场被约束到这一层后，近期商业机会远小于“55 million 人”。


              商业先例有助于框定变现。Leqembi 在 2026 年 Q1 全球销售达到 $168 million，Eisai 现在指引 2026 财年收入约 $900
              million，说明即使路径摩擦存在，需求也真实。Kisunla 的标签和定价案例显示，从第一天起，支付方成本和疗程经济性就是活跃议题。这些数据点意味着，成功的 TauRx
              产品不必拿下阿尔茨海默病总患病率中的大份额，就能具备经济意义；但它必须赢得报销信心，并在治疗算法中占据清晰位置。


              对 TauRx
              而言，最现实的市场逻辑不是马上进入大众市场，而是在早期患者、照护者和医生中形成定向采用：他们需要疾病修饰治疗，但更偏好比输注抗体更能适配现有工作流的口服方案。最大的市场风险在于，支付方和监管机构设置的证据门槛仍足够高，以至于患病率无法大规模转化为可报销采用。最大的上行空间在于，首个获批口服
              tau 疗法可降低提供方和患者的运营负担，从而扩大实际可治疗市场。
