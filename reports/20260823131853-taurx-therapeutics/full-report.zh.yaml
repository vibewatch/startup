  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与疾病负担
        blocks:
          - type: paragraph
            body: >-
              TauRx 的相关市场不是“所有痴呆”，而是能够通过受监管临床路径触达、已确诊且可治疗的阿尔茨海默病患者子集。全球疾病负担数据仍然关键，因为它解释了为什么支付方、监管机构和投资者会关注这个领域。World
              Health Organization 称，2021 年全球有 57 million 人罹患痴呆，每年新增病例接近 10 million，全球成本约 $1.3
              trillion。阿尔茨海默病是最主要的底层病因：WHO 估计其贡献了 60% 到 70% 的痴呆病例，而 Alzheimer’s Society 称，英国约三分之二痴呆患者患有阿尔茨海默病。


              这个头部负担数字夸大了 TauRx 的近期商业市场。HMTM
              并不是面向所有痴呆患者，甚至也不是所有阿尔茨海默病患者。它的研究和申报适应症是阿尔茨海默病所致轻度认知障碍，以及轻度至中度阿尔茨海默病；也就是说，相关市场只有在认知症状被识别、临床评估发生，并且——至少在
              TauRx 的关键试验项目中——确认淀粉样蛋白阳性之后才开始。TauRx 自己的患者和医疗专业人士页面强调，MCI 是早期诊断标志，并反复主张，早期干预最可能让疾病修饰获益变得重要。


              因此，现实市场边界分三层：非常大的全球疾病负担池；更小的已诊断阿尔茨海默病人群；以及更窄的治疗人群，他们拥有诊断准入、医生意愿和支付覆盖。这个分层框架至关重要，因为很多宽口径市场规模说法忽略了诊断瓶颈，而这些瓶颈已经拖慢
              Leqembi 和 Kisunla 的采用。对 TauRx 来说，市场机会真实存在，但商业准入取决于能否从流行病学负担跨到可治疗、可报销且能嵌入工作流的使用场景。
