      - number: '8.2'
        title: 公开证据支持期权价值，但不足以支撑坚实定价
        blocks:
          - type: paragraph
            body: >-
              支持估值的最强论点很容易列出。阿尔茨海默病仍是巨大的未满足需求；已获批的淀粉样蛋白疗法已经说明，监管方和市场会奖励哪怕并不完美的疾病修饰进展；如果 TauRx
              以临床可用标签获批，口服路径可能很重要。LUCIDITY 还给出包含生物标志物结果的同行评议 3 期证据包，分量远高于简单的概念阶段故事。

              但估值问题不是 TauRx 有没有价值，而是公开记录是否支撑当前隐含价格。这里的答案更弱。清晰的公开融资事件仍是 2022 年资本注入。本报告检索的公开记录没有发现已完整披露、且条款足以锚定估值的 2025 年
              12 月或 2026 年初融资轮。追踪页面继续把 TauRx 列为独角兽，有时引用 $2.5B
              标记，但这不等同于透明的定价交易。由于当前现金跑道也未公开，投资人无法有把握判断未来任何延迟是否会迫使稀释。这实质削弱了价格支撑。
