      - number: '5.2'
        title: 机制、生物标志物证据包与运营架构
        blocks:
          - type: paragraph
            body: >-
              HMTM 背后的核心技术假设说起来简单，证明起来很难：tau 聚集是神经退行的核心驱动因素，抑制这种聚集应能减缓临床衰退。TauRx 的专业材料把 HMTM 描述为一种 tau
              聚集抑制剂，能够穿过血脑屏障，并靶向病理性 tau 错误折叠的来源。因此，更广义的运营架构不是软件或硬件栈，而是一条转化链，把 tau 生物学、口服给药、血液生物标志物、认知终点和神经影像读数串起来。


              公司越来越依靠生物标志物证据来加固这条链。TauRx 的神经丝轻链及相关材料认为，HMTM 会影响由 NfL 和 tau 相关血液标志物衡量的神经退行；2026 年 LUCIDITY
              论文除认知外，也报告了影像和生物标志物结果。这使产品证据包比早期主要依赖症状终点的阿尔茨海默病项目更现代。


              不过，这套架构有一个薄弱环节：对照臂问题。独立报道和 TauRx 相关材料都承认，methylthioninium chloride
              被用作尿液着色剂以维持盲法，却意外显示出症状活性，进而复杂化了原定主要分析。因此，产品可信度不仅取决于药物机制，也取决于生物标志物加临床证据包能否克服历史设计批评。
