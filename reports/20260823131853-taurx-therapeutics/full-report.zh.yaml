      - number: '4.4'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              财务判断是，TauRx
              还不是一个经营现金流故事，而是一个后期监管转化故事。收入质量当前较弱，因为看不到获批产品销售，定价未披露，第三方收入估计也过于不一致，无法承销。如果一款口服小分子阿尔茨海默病疗法上市，利润率路径理论上可能有吸引力，但这一上行完全取决于获批、采用和支付方条款。


              公司最强的公开财务正面因素，是漫长开发周期中投资者仍持续支持。最弱的特征是不透明。公开审查记录中，没有经审计财务报表，没有清晰现金余额，没有披露月度烧钱速度，没有已实现净定价，也没有披露上市预算。这意味着，与商业化生物技术公司相比，估值或资本计划必须给出更宽区间。


              实际承销姿态应保持谨慎。TauRx
              可能有足够结构性支持，可以撑到下一个监管里程碑，但公开记录无法支持对现金跑道长度或稀释风险的高置信判断。因此，财务尽调应聚焦现金、烧钱速度、上市支出、制造安排，以及任何即将到来的融资或合作流程的具体条款。
