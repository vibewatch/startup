chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、源流与公司版图
        blocks:
          - type: paragraph
            body: >-
              TauRx 将自己定位为一家神经退行性疾病公司，成立目的就是把 Claude Wischik 学术研究中延续数十年的 tau 生物学成果商业化。公司官方材料、临床方案和第三方公司数据库都把起点指向 2002
              年的新加坡，同时也显示科学和运营重心落在苏格兰阿伯丁。这种双地理结构很重要：新加坡看起来承载法律身份、投资者关系，以及 LUCIDITY
              方案里的正式申办方地址；阿伯丁则承载运营地点、与大学相连的研究基础，以及多数可见科学领导层。


              公司的使命异常聚焦，至今没有明显偏离创始假设。TauRx 称自己的目标是发现、开发并商业化针对蛋白聚集所致神经退行性疾病的产品，tau 聚集抑制剂是核心平台。公司材料反复把 HMTM
              描述为阿尔茨海默病潜在首个口服疾病修饰 tau 疗法，相邻页面又把平台概念延伸到额颞叶痴呆和其他 tau 蛋白病。这为后续章节提供了稳定身份锚点：TauRx
              不是多元化生物技术组合公司，而是一家长期押注单一平台的公司；其公司叙事、监管努力和融资故事都绑定在证明“tau 优先”的阿尔茨海默病假设上。


              公开足迹也显示，公司仍像一家私有后期生物技术公司，而不是商业化制药企业。网站有大量医学教育、倡导和投资者关系语言，却很少披露产品收入、商业基础设施指标或正式证券披露。这种不对称与一家接近潜在首次获批节点、但仍依赖私募融资和监管结果而非上市产品现金流的公司相符。
