      - number: '3.4'
        title: 切换成本、分销能力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              从买方角度看，阿尔茨海默病治疗的切换成本更多是临床和声誉成本，而不是纯合同成本。专科医生会偏好标签更清楚、主要终点胜利更强、护理流程更简单的产品。大型既有玩家也通过专科关系、诊断合作，以及资助长期证据生成的能力拥有分销力量。因此，TauRx
              的护城河不是广泛分销网络或稳固处方集位置，而是给药途径和机制差异化有可能解决抗淀粉样蛋白竞争者留下的痛点。


              除非配上可信证据，这条护城河很脆弱。独立怀疑者仍在质疑 TauRx 的历史试验设计，以及缺乏真正非活性安慰剂的问题。即便竞争者自己的给药模式没有那么方便，只要试验叙事更干净，也可以反过来攻击
              TauRx。与此同时，对症口服药这个现状仍然粘性很强，因为它们熟悉、便宜，并已嵌入临床实践，尽管并不能改变疾病进程。


              实际结论是，TauRx 的竞争策略必须把口服便利性与有说服力的监管和报销故事配对。如果做不到两者，买方要么选择已获批抗淀粉样蛋白龙头来进行疾病修饰，要么为简单和成本继续留在对症治疗上。
