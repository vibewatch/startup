  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是击穿投资逻辑的首要因素
        blocks:
          - type: paragraph
            body: >-
              TauRx 面临的最大风险是监管。HMTM 已进入后期，MHRA
              已受理审评，但产品的试验历史仍有争议：原设对照条件显示症状活性，令主要分析复杂化。独立报道持续追问这一问题，而公司近期全部价值都取决于能否说服监管方：尽管存在设计复杂性，长期临床、影像和生物标志物数据等完整证据包仍足够。拒批、重大延迟或标签过窄，都会直接损害商业化时间表，并可能迫使公司再融资。

              法律和知识产权风险是第二层，但也重要。围绕二氨基吩噻嗪和优化剂量的专利文件显示，HMTM
              化学和给药方式仍有活跃知识产权基础。不过，阿尔茨海默病领域商业敏感度高，欧洲生命科学专利诉讼也更活跃，尤其是统一专利法院带来的影响。TauRx
              目前没有公开的紧迫专利诉讼，但一旦成功，资产自然会更容易被挑战者盯上。

              还有一层数据治理和合规风险。TauRx 的隐私声明明确覆盖个人数据、医疗专业人士互动、分析以及类似 GDPR
              制度下的法律依据。这不是隐私失败的证据，但确认了公司处理敏感利益相关方数据，因此承担受监管医疗信息的常规风险。
