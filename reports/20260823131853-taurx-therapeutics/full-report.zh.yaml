      - number: '1.3'
        title: 资本历史、投资者基础与估值可见度
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开融资时间线来自 Tracxn，而不是 TauRx 自身。该数据库记录了六轮已披露融资，合计约 $434 million：2011 年 $20 million 的 Series A 轮起步，随后是
              2012 年和 2013 年两轮 Series B，2015 年和 2016 年两轮大型 Series D，以及 2022 年 11 月 $119 million 的 Series E。Tracxn 还把
              Dundee Corporation 和 Genting Singapore 标注为早期领投方，并将 TauRx 归为具有独角兽状态的 Series E 公司。TauRx
              自己的投资者页面与这一图景方向一致，强调全球投资者的长期支持，也继续欢迎合格投资者接洽，但没有公布股权结构表、轮次定价或资金用途细节。


              估值可见度明显弱于融资可见度。最明确的公开数字是 Tracxn 给出的 $2.5 billion 估值和独角兽标签。不过，TauRx 没有在公司网站上自行披露这一数字，任何 2025
              年末老股交易的确切公开出处也有限。因此，较稳妥的尽调表述是：一个可信第三方数据平台把 TauRx 放在约 $2.5 billion
              的估值位置，但具体轮次机制、股份类别，以及该数字反映的是新股融资、老股转让还是平台推算的投后估值，都无法从公司披露中公开验证。


              这一点重要，因为 TauRx 现在处于后期、私有、商业化前状态。承销者若把 HMTM
              视为接近获批且具备全球期权的平台，公司可能显得便宜；若把它视为仍背负监管和疗效争议的单资产生物技术公司，公司也可能显得昂贵。没有经审计收入、现金、现金跑道或优先股堆叠披露，融资历史能证明韧性和投资者继续支持的意愿，但不能消除融资风险。
