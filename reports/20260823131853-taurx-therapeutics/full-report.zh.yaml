      - number: '3.3'
        title: 新兴 tau 与相邻项目压缩 TauRx 的时间优势
        blocks:
          - type: paragraph
            body: >-
              TauRx 仍有一个真实战略优势：它比多数口服 tau 竞争者走得更远。Oligomerix 最近才把 OLX-07010 推进到 1a 期临床试验。reMYND
              将其阿尔茨海默病项目描述为一种口服路径，目标是恢复突触功能，并随时间降低淀粉样蛋白和 tau 病理，但并未被描述为接近上市。AC Immune 有多个神经退行性疾病项目，包括 anti-pTau
              主动免疫疗法和一个合作的 Morphomer Tau 小分子平台，但这些项目距离上市产品都更早。


              近期最严肃的 tau 竞争威胁看起来是 Biogen/Ionis 的 diranersen，而不是另一个口服小分子。两家公司 2026 年 5 月的顶线公告称，这是首个在早期阿尔茨海默病中显示 tau
              导向疗法带来稳健生物标志物影响和认知获益的随机 2 期研究，尽管研究没有达到主要剂量反应终点。这一画像与 TauRx 自身挑战相呼应：有前景的生物标志物和临床信号，与监管机构将如何解读主要终点故事的争议并存。


              这很重要，因为 TauRx “唯一后期 tau 项目”的叙事正在变得不那么耐用。即便 HMTM 仍是最先进的口服 tau
              疗法，市场也在走向更广泛的机制和模态。拖延会削弱差异化。获批会创造先发优势；又一个漫长审评周期则会缩短这一优势。
