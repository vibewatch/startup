      - number: '5.4'
        title: 关键依赖与差异化耐久性
        blocks:
          - type: paragraph
            body: >-
              HMTM 最强的差异化仍是便利性加机制。市场上还没有其他获批的口服 tau 靶向疾病修饰疗法，TauRx 可以可信地论证，一种温和的口服选择比输注型抗淀粉样蛋白疗法更容易适配记忆门诊工作流。公司也拥有一套围绕
              tau 聚集抑制积累的大型证据基础；如果领域进一步转向 tau，这具备战略价值。


              但依赖图高度集中。TauRx 依赖监管机构接受其非标准证据历史，依赖生物标志物强化机制故事，依赖制造和供应质量来支撑口服慢病疗法，也依赖创始人主导的数据解读继续保持科学可信度。它还依赖更广泛阿尔茨海默病生态接受
              tau 靶向值得报销，尽管当前商业领先位置由淀粉样蛋白方向既有玩家占据。


              从实际角度看，护城河比科学叙事暗示的更窄。如果赢得获批，TauRx 会在口服 tau 疗法中获得有意义的先发优势。如果获批延迟，随着其他 tau
              项目积累生物标志物数据，以及抗淀粉样蛋白公司不断降低给药负担，差异化会被侵蚀。产品耐久性因此取决于及时完成监管转化，而不只是技术新颖性。
