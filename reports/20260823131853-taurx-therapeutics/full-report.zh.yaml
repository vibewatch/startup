      - number: '4.3'
        title: 资本充足性取决于不透明现金余额和里程碑时点
        blocks:
          - type: paragraph
            body: >-
              公开来源确认了若干融资信号，但没有确认投资者最需要的数字：剩余现金。Companies.sg 显示 TauRx Therapeutics Ltd 是一家仍在运营的新加坡股份有限公司，实缴资本超过 $103
              million；英国 Companies House 记录还显示了进一步公司行动，包括 2025 年 TauRx Therapeutics Management Ltd
              的股份配发和股本声明。这些文件证明资本化活动仍在继续，但不能替代合并口径在手现金。


              最清晰的后期融资数据点是 Pharmaphorum 的报道：现有投资者在 2022 年末行权了价值约 $119 million 的认股权证，此前 2021 年还有 $64 million 的供股。本报告早前使用的
              Tracxn 类私募市场监测也显示，累计披露融资约 $434 million，并有独角兽式估值信号。合起来看，这些来源说明在积极数据信号之后，投资者仍愿意继续为项目融资，但并未确认 2026 年的当前现金跑道。


              因此，资本充足性问题是二元的，并与里程碑绑定。如果 MHRA 审评转为获批并带来报销牵引，TauRx
              可能从永久融资风险转向商业化融资。如果审评延迟或被拒，公司很可能重新依赖内部人支持、老股融资或合作资本，而公开证据并未显示它已经拥有广泛商业化所需的资产负债表。
