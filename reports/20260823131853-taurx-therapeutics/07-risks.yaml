  claims:
    - { id: CR001, statement: The dominant risk in the TauRx thesis is whether regulators accept the total HMTM evidence package., type: inferred, topic: regulatory-risk, sourceRefs: [SR001, SR002, SR003, SR004], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR002] }
    - { id: CR002, statement: HMTM is under active MHRA review, which concentrates near-term risk into a single external decision channel., type: observed, topic: regulatory-risk, sourceRefs: [SR001, SR002, SR003], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR016] }
    - { id: CR003, statement: The active-control controversy remains central because it complicated intended primary analyses in the trial program., type: observed, topic: regulatory-risk, sourceRefs: [SR004, SR005, SR006], confidence: high, freshness: current, answersQuestionRefs: [QR003] }
    - { id: CR004, statement: A rejection or major delay would directly impair commercialization timing and increase financing pressure., type: inferred, topic: regulatory-risk, sourceRefs: [SR001, SR015, SR016], confidence: high, freshness: current, answersQuestionRefs: [QR002, QR020] }
    - { id: CR005, statement: A narrow label could still be commercially damaging even if nominal approval is achieved., type: inferred, topic: regulatory-risk, sourceRefs: [SR002, SR003, SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR004] }
    - { id: CR006, statement: Patent documents show that TauRx-related dosing and administration claims remain part of the asset’s protective structure., type: observed, topic: legal-risk, sourceRefs: [SR007, SR008, SR009], confidence: high, freshness: current, answersQuestionRefs: [QR005, QR006] }
    - { id: CR007, statement: No acute public patent litigation against TauRx was found in the reviewed public record., type: observed, topic: legal-risk, sourceRefs: [SR014, SR026], confidence: medium, freshness: current, answersQuestionRefs: [QR007] }
    - { id: CR008, statement: That absence does not remove legal risk because commercial success would make HMTM more visible to challengers., type: inferred, topic: legal-risk, sourceRefs: [SR006, SR007, SR014, SR026], confidence: medium, freshness: current, answersQuestionRefs: [QR005, QR008] }
    - { id: CR009, statement: The European life-sciences patent-litigation environment is active enough that post-approval exclusivity disputes would be unsurprising., type: observed, topic: legal-risk, sourceRefs: [SR014, SR026], confidence: medium, freshness: current, answersQuestionRefs: [QR008] }
    - { id: CR010, statement: TauRx’s privacy notice confirms it handles personal data and healthcare-professional interaction data under regulated frameworks, creating a normal but real compliance risk layer., type: observed, topic: privacy-risk, sourceRefs: [SR010, SR011, SR012], confidence: high, freshness: current, answersQuestionRefs: [QR009, QR010] }
    - { id: CR011, statement: Public evidence on manufacturing and launch operations is much thinner than public evidence on science and publications., type: observed, topic: operational-risk, sourceRefs: [SR018, SR019, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR011, QR012] }
    - { id: CR012, statement: Commercial manufacturing readiness is not clearly visible in the public record., type: observed, topic: operational-risk, sourceRefs: [SR019, SR021], confidence: high, freshness: current, answersQuestionRefs: [QR012] }
    - { id: CR013, statement: Supply quality matters disproportionately because TauRx’s convenience advantage depends on reliable oral delivery in routine care., type: inferred, topic: operational-risk, sourceRefs: [SR002, SR019, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR011, QR013] }
    - { id: CR014, statement: Real-world biomarker and imaging workflows could prove more complex than controlled-trial execution implies., type: inferred, topic: operational-risk, sourceRefs: [SR004, SR019, SR029], confidence: medium, freshness: current, answersQuestionRefs: [QR013] }
    - { id: CR015, statement: There is little public detail on pharmacovigilance or field-support scaling for a potential launch., type: observed, topic: operational-risk, sourceRefs: [SR019, SR021, SR028], confidence: high, freshness: current, answersQuestionRefs: [QR014] }
    - { id: CR016, statement: TauRx’s website policies show awareness of analytics cookies security and inquiry handling, but they are not substitutes for operational launch disclosure., type: inferred, topic: operational-risk, sourceRefs: [SR010, SR011, SR012, SR028], confidence: medium, freshness: current, answersQuestionRefs: [QR011, QR014] }
    - { id: CR017, statement: Operational opacity amplifies risk because investors cannot easily distinguish manageable execution gaps from structural launch unreadiness., type: inferred, topic: operational-risk, sourceRefs: [SR018, SR019, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR011] }
    - { id: CR018, statement: Years of trial operations do mitigate some execution risk because TauRx is not moving directly from concept to launch., type: inferred, topic: operational-risk, sourceRefs: [SR019, SR020, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR024] }
    - { id: CR019, statement: TauRx is highly dependent on a small number of channels including MHRA memory-clinic specialists and future payers., type: inferred, topic: dependency-risk, sourceRefs: [SR002, SR021, SR023], confidence: high, freshness: current, answersQuestionRefs: [QR015, QR016, QR017] }
    - { id: CR020, statement: The scientific narrative is also concentrated around long-time founder and author Claude Wischik., type: observed, topic: people-risk, sourceRefs: [SR004, SR025, SR027], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR019] }
    - { id: CR021, statement: That concentration creates key-person risk because leadership credibility and evidence interpretation are tightly linked in the public narrative., type: inferred, topic: people-risk, sourceRefs: [SR005, SR020, SR025], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR019] }
    - { id: CR022, statement: Public evidence of a large autonomous commercial organization is limited, which increases execution dependence on a small leadership bench., type: inferred, topic: people-risk, sourceRefs: [SR018, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR019] }
    - { id: CR023, statement: Financing risk remains meaningful because public sources confirm historical shareholder support but not current runway adequacy., type: observed, topic: financial-risk, sourceRefs: [SR015, SR016, SR017], confidence: high, freshness: current, answersQuestionRefs: [QR020, QR021] }
    - { id: CR024, statement: If MHRA review takes longer than expected TauRx may need to raise capital again under pressure., type: inferred, topic: financial-risk, sourceRefs: [SR001, SR015, SR017], confidence: high, freshness: current, answersQuestionRefs: [QR020, QR028] }
    - { id: CR025, statement: Payer skepticism in Alzheimer’s disease means approval does not automatically translate into funded uptake or healthy unit economics., type: observed, topic: financial-risk, sourceRefs: [SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR022, QR023] }
    - { id: CR026, statement: Regulatory delay, financing need, and competitive erosion are linked rather than independent risks for TauRx., type: inferred, topic: transmission, sourceRefs: [SR001, SR015, SR023], confidence: high, freshness: current, answersQuestionRefs: [QR023] }
    - { id: CR027, statement: TauRx’s main mitigants are peer-reviewed publication active review status and a differentiated oral route of administration., type: inferred, topic: mitigation, sourceRefs: [SR001, SR002, SR004], confidence: high, freshness: current, answersQuestionRefs: [QR024] }
    - { id: CR028, statement: Those mitigants do not eliminate the possibility of an adverse MHRA outcome or a request for new confirmatory evidence., type: inferred, topic: mitigation, sourceRefs: [SR001, SR005, SR006], confidence: high, freshness: current, answersQuestionRefs: [QR025, QR026] }
    - { id: CR029, statement: A negative MHRA decision is the clearest thesis-break trigger., type: inferred, topic: kill-criteria, sourceRefs: [SR001, SR002, SR003], confidence: high, freshness: current, answersQuestionRefs: [QR026] }
    - { id: CR030, statement: Approval without viable reimbursement traction would also be a partial thesis break because it would cap commercial value sharply., type: inferred, topic: kill-criteria, sourceRefs: [SR003, SR023], confidence: high, freshness: current, answersQuestionRefs: [QR022, QR026] }
    - { id: CR031, statement: A meaningful key-person disruption without visible succession depth would weaken the scientific and commercial story simultaneously., type: inferred, topic: kill-criteria, sourceRefs: [SR018, SR020, SR025], confidence: medium, freshness: current, answersQuestionRefs: [QR018, QR019, QR026] }
    - { id: CR032, statement: A visible IP challenge or loss of effective exclusivity would weaken an already narrow moat., type: inferred, topic: kill-criteria, sourceRefs: [SR007, SR008, SR014], confidence: medium, freshness: current, answersQuestionRefs: [QR027] }
    - { id: CR033, statement: Specialist distrust following continued public skepticism could suppress adoption even if technical approval is won., type: inferred, topic: adoption-risk, sourceRefs: [SR021, SR024, SR027], confidence: medium, freshness: current, answersQuestionRefs: [QR017, QR029] }
    - { id: CR034, statement: Financing strain is a realistic kill signal because late-stage biotech optionality collapses quickly when runway and catalyst timing diverge., type: inferred, topic: kill-criteria, sourceRefs: [SR015, SR016, SR017], confidence: medium, freshness: current, answersQuestionRefs: [QR020, QR028] }
    - { id: CR035, statement: The right risk stance is therefore to watch externally visible triggers rather than rely on company-quality impressions alone., type: inferred, topic: kill-criteria, sourceRefs: [SR001, SR015, SR023], confidence: high, freshness: current, answersQuestionRefs: [QR026, QR030] }
    - { id: CR036, statement: TauRx remains investable only for investors comfortable with a late-stage binary regulatory event., type: inferred, topic: verdict, sourceRefs: [SR001, SR002, SR005], confidence: high, freshness: current, answersQuestionRefs: [QR001, QR030] }
    - { id: CR037, statement: Investors also need comfort with limited public transparency on operations and capital compared with public biotech standards., type: inferred, topic: verdict, sourceRefs: [SR016, SR017, SR018], confidence: high, freshness: current, answersQuestionRefs: [QR011, QR021, QR030] }
    - { id: CR038, statement: If prescriber enthusiasm and payer access both lag after any approval the valuation case should be cut aggressively., type: inferred, topic: verdict, sourceRefs: [SR021, SR023, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR022, QR029] }
    - { id: CR039, statement: The oral route and tau-targeting focus reduce some competitive and workflow risk relative to infused antibody alternatives., type: inferred, topic: verdict, sourceRefs: [SR002, SR013, SR021], confidence: medium, freshness: current, answersQuestionRefs: [QR024] }
    - { id: CR040, statement: But that advantage is not durable enough on its own to offset a negative regulatory or financing signal., type: inferred, topic: verdict, sourceRefs: [SR015, SR023, SR024], confidence: high, freshness: current, answersQuestionRefs: [QR025, QR026, QR030] }
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-manufacturing-readiness
      missingEvidence: No public detail was found on commercial-scale manufacturing partners process validation or supply redundancy for HMTM.
      whyItMatters: Launch reliability and margin both depend on it.
      diligencePath: Request CMO contracts validation status and release-testing framework.
      relatedQuestionRefs: [QR011, QR012, QR030]
    - type: private-evidence-only
      severity: material
      topic: regulator-feedback-content
      missingEvidence: The content of MHRA questions and TauRx’s responses is not public.
      whyItMatters: It is the most direct indicator of remaining approvability risk.
      diligencePath: Request management summary of key regulator questions and unresolved items.
      relatedQuestionRefs: [QR002, QR024, QR025]
    - type: private-evidence-only
      severity: material
      topic: runway-and-financing
      missingEvidence: No current public cash balance or runway disclosure exists.
      whyItMatters: Financing risk cannot be sized accurately without it.
      diligencePath: Request current balance sheet burn bridge and base-case runway.
      relatedQuestionRefs: [QR020, QR021, QR028]
    - type: private-evidence-only
      severity: material
      topic: prescriber-intent
      missingEvidence: No public survey or KOL interview set establishes how neurologists would prescribe HMTM after approval.
      whyItMatters: Prescriber trust is a key transmission channel from approval to revenue.
      diligencePath: Conduct blinded specialist interviews in UK and US memory clinics.
      relatedQuestionRefs: [QR017, QR029]
