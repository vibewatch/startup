company:
  name: TauRx Therapeutics
chapter:
  number: 7
  title: Risks
  summary: >-
    TauRx’s risk profile is concentrated around one central uncertainty: whether regulators will accept
    a clinically and biologically interesting but historically controversial evidence package for
    HMTM. Around that core sit five additional risk clusters: legal and IP durability, privacy and
    external-stakeholder handling, operational and supply execution, capital and financing pressure,
    and key-person concentration around the founder-led scientific narrative. The company’s risk is
    therefore not diversified. A positive MHRA outcome meaningfully reduces several risks at once,
    while a negative or delayed outcome amplifies financing, competitive, and reputational pressure
    simultaneously.
sections:
  - id: regulatory-legal
    title: Regulatory and legal risk is the primary thesis breaker
    body: >-
      The largest risk facing TauRx is regulatory. HMTM is at a late stage and is under review by the
      MHRA, but the product’s trial history remains contested because the intended control condition
      showed symptomatic activity that complicated primary analyses. Independent reporting has kept
      that issue alive, and the company’s entire near-term value depends on persuading regulators that
      the total evidence package — including long-term clinical, imaging, and biomarker data — is
      sufficient despite the design complication. A rejection, major delay, or narrow label would
      directly impair commercialization timing and could force another financing cycle.

      Legal and IP risk is secondary but material. Patent documents tied to diaminophenothiazines and
      optimized dosage show active intellectual-property foundations around HMTM-related chemistry and
      dosing. However, the Alzheimer’s field is commercially sensitive, and life-sciences patent
      litigation in Europe is becoming more active, especially through the Unified Patent Court.
      TauRx does not currently show acute public patent litigation, but success would naturally make
      the asset more visible to challengers.

      There is also a data-governance and compliance layer. TauRx’s privacy notice explicitly covers
      personal data, health-care-professional interactions, analytics, and legal bases under GDPR-like
      regimes. That is not evidence of a privacy failure, but it confirms that the company handles
      sensitive stakeholder data and therefore carries normal regulated-health information risks.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-quality
    title: Operational, quality, and supply risks remain under-disclosed
    body: >-
      TauRx has more operational complexity than its small public footprint suggests. Running
      multinational Alzheimer’s trials, processing biomarker and imaging evidence, responding to MHRA
      information requests, and preparing for potential launch all require a high-quality operating
      backbone. Yet the public record contains little detail on commercial manufacturing readiness,
      batch release processes, supplier concentration, pharmacovigilance infrastructure, or launch-day
      medical-support capacity.

      This under-disclosure matters because oral convenience only becomes a true advantage if supply
      quality is reliable and if physicians are confident the company can support real-world use. In a
      neurological chronic therapy, interruptions, label confusion, or safety communication failures
      would hurt trust quickly. The company’s policy pages show awareness of website security,
      analytics, and personal-data handling, but they do not resolve the bigger operational question
      of drug-supply and field-readiness execution.

      The strongest mitigation is that TauRx is not moving from preclinical obscurity to launch; it
      has spent years operating within controlled clinical settings. The weakest point is that public
      manufacturing and support detail remain sparse, leaving a meaningful diligence gap.
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016, CR017, CR018]
    tableRefs: [TR002]
    figureRefs: [FR002]
  - id: dependency-people-finance
    title: Dependency, people, and financing risks are tightly linked
    body: >-
      TauRx’s dependency structure is concentrated. Scientific interpretation is still strongly tied to
      founder and long-time leader Claude Wischik, whose views and publications are central to the
      company’s narrative. That creates key-person risk: if leadership credibility weakens, regulatory
      and investor confidence could weaken with it. The company also depends on specialist memory-
      clinic investigators, regulators, and a relatively small set of stakeholder channels rather than
      on a broad commercial network.

      Financing risk compounds that concentration. Public evidence shows recurring shareholder support,
      including a rights issue and warrant exercise, but not a clear current cash balance. If MHRA
      review slips, TauRx may need to raise capital again under pressure, potentially from existing
      investors or strategic partners rather than from a broad public market. The negative scenario is
      not just dilution. It is the transmission of regulatory delay into funding urgency, then into
      weaker competitive positioning.

      Finally, partner and access risk matter because even approval would not eliminate payer friction.
      NICE’s skepticism toward anti-amyloid therapies reminds investors that clinical approval and
      funded uptake are separate questions in Alzheimer’s disease.
    claimRefs: [CR019, CR020, CR021, CR022, CR023, CR024, CR025, CR026]
    tableRefs: [TR003, TR004]
    figureRefs: [FR003]
  - id: mitigation-kill-criteria
    title: Mitigations and kill criteria
    body: >-
      TauRx’s risk mitigations are real but incomplete. The company has a peer-reviewed phase 3
      publication, an active MHRA process, a long development history, and a clearer oral-convenience
      proposition than many competitors. Those factors reduce pure technical novelty risk. They do not,
      however, eliminate the possibility that regulators or payers judge the evidence too weak for the
      claimed level of benefit.

      The right kill criteria are therefore externally observable. A negative MHRA decision or a major
      request for new confirmatory evidence is the clearest thesis break. A second critical trigger
      would be evidence that current financing is inadequate to sustain another regulatory cycle.
      Third, meaningful IP challenge or loss of effective exclusivity would weaken the already narrow
      moat. Fourth, failure to articulate a convincing payer pathway after any approval would reduce
      the value of a nominally positive regulatory outcome.

      The risk conclusion is that TauRx remains investable only for investors comfortable with a late-
      stage binary regulatory event, heavy evidence-interpretation dependence, and limited public
      transparency on operations and capital.
    claimRefs: [CR027, CR028, CR029, CR030, CR031, CR032, CR033, CR034, CR035, CR036, CR037, CR038, CR039, CR040]
    tableRefs: [TR005]

