      - [Privacy or HCP-data handling failure, Website and stakeholder-data domain, No known event, Low, Medium, Public privacy notice and legal bases disclosed, Medium, Request incident history and data-protection governance]
    notes: The central legal issue is regulatory acceptability of the dataset; classic litigation risk is secondary but could rise after commercial success.
    claimRefs: [CR001, CR002, CR005, CR006, CR007, CR009, CR010]
