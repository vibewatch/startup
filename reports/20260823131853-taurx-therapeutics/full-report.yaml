              - CV028
      - number: '8.4'
        title: Final diligence asks and thesis break triggers
        blocks:
          - type: paragraph
            body: >-
              A real investment decision now would require more private diligence than public markets would accept for a
              similarly valued issuer. The first missing item is current cash and runway. The second is the content of
              the MHRA dialogue, especially what remains unresolved. The third is how management thinks about pricing,
              reimbursement, specialist targeting, and launch sequencing after any approval. The fourth is how strong
              the exclusivity window really is in practice rather than on paper. The fifth is what secondary-market or
              internal valuation evidence actually supports the cited private mark.

              These gaps also define the thesis-break triggers. A negative MHRA outcome or a requirement for a major new
              confirmatory study is the clearest kill signal. A weaker but still serious signal would be evidence that
              the company must refinance from a position of urgency. Even approval would not be enough if label scope or
              payer access made the drug commercially niche. The investment conclusion is therefore simple. TauRx is
              worth tracking closely, but the existing public evidence does not justify treating the current tracked
              valuation as obviously investable.
            claimRefs:
              - CV031
