      - number: '3.4'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              From a buyer perspective, switching costs in Alzheimer’s therapy are clinical and reputational rather than
              purely contractual. Specialists will favor products with clearer labels, stronger primary-endpoint wins,
              and simpler care logistics. Large incumbents also have distribution power through specialist
              relationships, diagnostics partnerships, and the ability to sponsor long-term evidence generation. TauRx’s
              moat is therefore not a broad distribution network or entrenched formulary position; it is the possibility
              that route of administration and mechanism differentiation solve pain points left open by anti-amyloid
              competitors.

              That moat is fragile unless paired with evidence credibility. Independent skeptics continue to question
              TauRx’s historical trial design and the lack of a true inactive placebo. Competitors with cleaner trial
              narratives can use that against the company even if their own delivery models are less convenient. At the
              same time, the status quo of symptomatic oral drugs remains sticky because they are familiar, cheap, and
              already embedded in clinical practice even though they do not change disease course.

              The practical conclusion is that TauRx’s competitive strategy must be to pair oral convenience with a
              convincing regulatory and reimbursement story. If it cannot do both, buyers may either stay with approved
              anti-amyloid leaders for disease modification or remain with symptomatic care for simplicity and cost.
