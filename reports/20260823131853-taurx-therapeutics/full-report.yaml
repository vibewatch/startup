  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and asset map
        blocks:
          - type: paragraph
            body: >-
              TauRx is not a diversified multi-platform biotech in the way many venture-backed therapeutics companies
              are. Public materials repeatedly center on one lead product, HMTM, positioned as an investigational oral
              treatment for mild cognitive impairment due to Alzheimer’s disease and mild to moderate Alzheimer’s
              dementia. The company also uses related educational materials to frame a broader tauopathy opportunity
              including frontotemporal dementia and other neurodegenerative disorders, but the commercial value driver
              is still HMTM in Alzheimer’s.

              In workflow terms the product is meant to fit into memory-clinic care more like an oral chronic therapy
              than an infused hospital-administered biologic. That is a meaningful product design choice. Company and
              media materials emphasize accessible delivery, lower physician burden, and the possibility of use earlier
              in disease progression. The intended user path is therefore: identify patients through clinical and
              biomarker workup, prescribe oral HMTM, monitor cognition and biomarkers over time, and avoid the
              infusion-center and ARIA-monitoring stack associated with anti-amyloid antibodies.

              The asset map remains narrow. HMTM is the lead Alzheimer’s asset; TauRx also references bvFTD and wider
              tau pathology as adjacent opportunities, but those are better understood as lifecycle-extension or
              mechanistic optionality rather than fully independent product lines.
