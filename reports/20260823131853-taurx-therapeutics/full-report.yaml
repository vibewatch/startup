      - number: '5.2'
        title: Mechanism, biomarker package, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical thesis behind HMTM is simple to state and difficult to prove: tau aggregation is a
              central driver of neurodegeneration, and inhibiting that aggregation should slow clinical decline. TauRx’s
              professional materials describe HMTM as a tau aggregation inhibitor that crosses the blood-brain barrier
              and targets the source of pathological tau misfolding. The broader operating architecture is therefore not
              a software or hardware stack, but a translational chain that links tau biology, oral drug delivery, blood
              biomarkers, cognitive endpoints, and neuroimaging readouts.

              The company has increasingly leaned on biomarker evidence to strengthen that chain. TauRx’s neurofilament
              light chain and related materials argue that HMTM affects neurodegeneration as measured by NfL and
              tau-associated blood markers, while the 2026 LUCIDITY paper reports imaging and biomarker outcomes in
              addition to cognition. That creates a more modern product package than older Alzheimer’s programs that
              relied mostly on symptomatic endpoints.

              Still, the architecture has a weak link: the control-arm problem. Both independent coverage and
              TauRx-linked materials acknowledge that methylthioninium chloride was used as a urinary colorant for
              blinding and unexpectedly showed symptomatic activity, complicating intended primary analyses. Product
              credibility therefore depends not only on the drug’s mechanism but on whether the biomarker-plus-clinical
              package overcomes historical design criticism.
