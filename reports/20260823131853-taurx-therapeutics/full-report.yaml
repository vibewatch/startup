      - number: '7.4'
        title: Mitigations and kill criteria
        blocks:
          - type: paragraph
            body: >-
              TauRx’s risk mitigations are real but incomplete. The company has a peer-reviewed phase 3 publication, an
              active MHRA process, a long development history, and a clearer oral-convenience proposition than many
              competitors. Those factors reduce pure technical novelty risk. They do not, however, eliminate the
              possibility that regulators or payers judge the evidence too weak for the claimed level of benefit.

              The right kill criteria are therefore externally observable. A negative MHRA decision or a major request
              for new confirmatory evidence is the clearest thesis break. A second critical trigger would be evidence
              that current financing is inadequate to sustain another regulatory cycle. Third, meaningful IP challenge
              or loss of effective exclusivity would weaken the already narrow moat. Fourth, failure to articulate a
              convincing payer pathway after any approval would reduce the value of a nominally positive regulatory
              outcome.

              The risk conclusion is that TauRx remains investable only for investors comfortable with a late- stage
              binary regulatory event, heavy evidence-interpretation dependence, and limited public transparency on
              operations and capital.
