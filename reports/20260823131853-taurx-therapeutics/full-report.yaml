      - number: '8.2'
        title: Public evidence supports option value but not firm price support
        blocks:
          - type: paragraph
            body: >-
              The strongest pro-valuation arguments are easy to state. Alzheimer’s disease remains a vast unmet need;
              approved amyloid therapies have already shown that regulators and markets will reward even imperfect
              disease-modifying progress; and TauRx offers an oral route that could matter if it wins approval with a
              clinically usable label. LUCIDITY also provided a peer-reviewed phase 3 package that includes biomarker
              outcomes, which is far more substantial than a simple concept-stage story.

              But the valuation question is not whether TauRx has value. It is whether the public record supports the
              current implied price. Here the answer is weaker. The clear public financing event is still the 2022
              capital infusion. The public record reviewed for this report did not surface a fully disclosed December
              2025 or early 2026 round with terms strong enough to anchor valuation. Tracker pages continue to list
              TauRx as a unicorn and sometimes cite a $2.5B mark, but that is not the same as a transparent priced
              transaction. Because current cash runway is also not public, investors cannot confidently tell whether any
              future delay would force dilution. That weakens price support materially.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV014
              - CV018
              - CV026
              - CV032
      - number: '8.3'
        title: Scenario analysis matters more than direct comparable multiples
        blocks:
          - type: paragraph
            body: >-
              Direct comparables are imperfect. Biogen and Eli Lilly are diversified incumbents with approved
              Alzheimer’s products, sales infrastructure, and balance sheets that TauRx does not have. AC Immune and
              other tau-focused peers are closer scientifically but earlier or structurally different from TauRx’s
              near-registration single-asset posture. This means crude revenue or market-cap multiple transfer is not
              appropriate. A scenario framework is more defensible.

              In the bull case, TauRx wins approval, secures a usable label, preserves oral-differentiation credibility,
              and shows that specialist uptake plus payer engagement can create a commercially real niche. In the base
              case, approval remains delayed or more limited, the company funds through the delay, and ultimate uptake
              is narrower than enthusiastic backers expect. In the bear case, regulators require materially new evidence
              or the financing burden rises before clarity is achieved. Under that framework, upside exists, but the
              probability-weighted center still lands below the tracked private mark.
            claimRefs:
              - CV021
              - CV022
              - CV023
