chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, roots, and corporate footprint
        blocks:
          - type: paragraph
            body: >-
              TauRx presents itself as a neurodegeneration company created specifically to commercialise decades of tau
              biology work that began in Claude Wischik’s academic research. Official company materials, the clinical
              protocol, and third-party company databases consistently place the origin story in Singapore in 2002,
              while also showing that the scientific and operating center of gravity sits in Aberdeen, Scotland. That
              dual geography matters: Singapore appears to anchor legal identity, investor relations, and the formal
              sponsor address in the LUCIDITY protocol, whereas Aberdeen hosts the operational location,
              university-linked research base, and most of the visible scientific leadership.


              The company’s mission is unusually focused and has not drifted far from the founding thesis. TauRx says it
              exists to discover, develop, and commercialise products for neurodegenerative diseases caused through
              protein aggregation, with tau aggregation inhibitors as the core platform. Its materials repeatedly frame
              HMTM as the potential first oral disease-modifying tau therapy for Alzheimer’s disease, and adjacent pages
              extend the platform concept into frontotemporal dementia and other tauopathies. That gives later chapters
              a stable identity anchor: TauRx is not a diversified biotech portfolio company, but rather a long-duration
              single-platform company whose corporate narrative, regulatory effort, and financing story are all tied to
              proving a tau-first Alzheimer’s thesis.


              The public footprint also shows a company still acting like a private late-stage biotech rather than a
              commercial pharmaceutical business. The website is rich in medical-education, advocacy, and
              investor-relations language, yet light on product revenues, commercial infrastructure metrics, or formal
              securities disclosure. That asymmetry is consistent with a company nearing a potential first approval
              event but still dependent on private funding and regulatory outcomes rather than marketed-product cash
              flow.
