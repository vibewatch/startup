companyProfile:
  summary: >-
    TauRx Therapeutics is a private late-stage neurodegeneration company founded in Singapore in 2002 and operationally
    centered in Aberdeen, Scotland. The company is built around hydromethylthionine mesylate or HMTM, an oral tau
    aggregation inhibitor for early Alzheimer’s disease, and has advanced the asset through a long clinical-development
    arc culminating in a peer-reviewed phase 3 publication and a live UK MHRA review process. Public third-party sources
    indicate about $434 million of disclosed lifetime funding and a tracker-style valuation signal around $2.5 billion,
    but current runway and the precise basis of that valuation remain under-disclosed.
