  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the primary thesis breaker
        blocks:
          - type: paragraph
            body: >-
              The largest risk facing TauRx is regulatory. HMTM is at a late stage and is under review by the MHRA, but
              the product’s trial history remains contested because the intended control condition showed symptomatic
              activity that complicated primary analyses. Independent reporting has kept that issue alive, and the
              company’s entire near-term value depends on persuading regulators that the total evidence package —
              including long-term clinical, imaging, and biomarker data — is sufficient despite the design complication.
              A rejection, major delay, or narrow label would directly impair commercialization timing and could force
              another financing cycle.

              Legal and IP risk is secondary but material. Patent documents tied to diaminophenothiazines and optimized
              dosage show active intellectual-property foundations around HMTM-related chemistry and dosing. However,
              the Alzheimer’s field is commercially sensitive, and life-sciences patent litigation in Europe is becoming
              more active, especially through the Unified Patent Court. TauRx does not currently show acute public
              patent litigation, but success would naturally make the asset more visible to challengers.

              There is also a data-governance and compliance layer. TauRx’s privacy notice explicitly covers personal
              data, health-care-professional interactions, analytics, and legal bases under GDPR-like regimes. That is
              not evidence of a privacy failure, but it confirms that the company handles sensitive stakeholder data and
              therefore carries normal regulated-health information risks.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
