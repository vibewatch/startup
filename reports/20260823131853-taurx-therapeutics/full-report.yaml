      - number: '3.3'
        title: Emerging tau and adjacent programs narrow TauRx’s timing advantage
        blocks:
          - type: paragraph
            body: >-
              TauRx still enjoys one real strategic advantage: it is farther along than most oral tau competitors.
              Oligomerix only recently advanced OLX-07010 into Phase 1a clinical trials. reMYND describes its
              Alzheimer’s program as an oral approach aimed at restoring synaptic function and reducing amyloid and tau
              pathology over time, but it is not described as launch-proximate. AC Immune has multiple neurodegeneration
              programs, including anti-pTau active immunotherapy and a partnered Morphomer Tau small-molecule platform,
              but these remain earlier than a marketed product.

              The most serious near-term tau competitive threat appears to be Biogen/Ionis diranersen rather than
              another oral small molecule. The May 2026 topline releases from both companies describe the first
              randomized Phase 2 study to show robust biomarker impact and cognitive benefit from a tau-directed therapy
              in early Alzheimer’s disease, though the study did not meet its primary dose- response endpoint. That
              profile rhymes with TauRx’s own challenge: promising biomarker and clinical signals combined with debate
              over how regulators will interpret the primary endpoint story.

              This matters because TauRx’s narrative as “the only late-stage tau program” is becoming less durable. Even
              if HMTM remains the most advanced oral tau therapy, the market is moving toward a broader field of
              mechanisms and modalities. Delay reduces distinctiveness. Approval would create first-mover advantage;
              another prolonged review cycle would shorten it.
