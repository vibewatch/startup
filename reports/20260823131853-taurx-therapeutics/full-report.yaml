  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape across direct, incumbent, and substitute options
        blocks:
          - type: paragraph
            body: >-
              TauRx does not compete in a vacuum. The most immediate reference class is not other tau programs but the
              approved anti-amyloid disease-modifying therapies that have already opened the market. Leqembi and Kisunla
              define current clinical expectations for early Alzheimer’s disease: both are approved in the United
              States, both are targeted to mild cognitive impairment or mild dementia stage patients, and both are
              backed by large commercial organizations with the ability to fund launch, education, diagnostics
              partnerships, and post-marketing studies. That makes them the incumbent disease-modifying competitors even
              though they target amyloid rather than tau.

              A second competitive layer is the growing wave of tau-directed or adjacent disease-modifying programs. The
              2026 Alzheimer’s pipeline has diversified meaningfully, and BioSpace explicitly frames tau as the next
              important mechanism after amyloid validation. Biogen and Ionis now have one of the most credible next-wave
              tau programs in diranersen, with Phase 2 CELIA topline data showing biomarker impact and cognitive benefit
              even though the primary dose-response endpoint was missed. AC Immune, Oligomerix, and reMYND also show
              that tau or tau-adjacent oral programs are no longer hypothetical.

              The third competitor is the status quo: symptomatic oral drugs, caregiver coping, and delayed diagnosis.
              This substitute is more important than it looks because many patients never enter the disease-modifying
              treatment funnel at all. For TauRx, winning means beating not just rival assets but also the inertia of
              untreated progression and the familiarity of established symptomatic regimens.
            claimRefs:
