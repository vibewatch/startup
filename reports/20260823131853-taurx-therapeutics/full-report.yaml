            body: >-
              Public sources confirm several financing signals but not the number investors most need, which is cash
              remaining. Companies.sg shows TauRx Therapeutics Ltd as a live Singapore public company limited by shares
              with paid-up capital above $103 million, while UK Companies House records show further corporate actions
              including a 2025 allotment of shares and statement of capital for TauRx Therapeutics Management Ltd. Those
              filings prove continuing capitalization activity, but they are not a substitute for consolidated cash on
              hand.

              The clearest late-stage financing datapoint is Pharmaphorum’s report that existing investors exercised
              warrants worth around $119 million in late 2022, following an earlier $64 million rights issue in 2021.
              Tracxn-based private-market monitoring used earlier in this report also indicates about $434 million of
              total disclosed funding and a unicorn-style valuation signal. Together, those sources show investor
              willingness to keep financing the program after positive data signals, but they do not confirm current
              runway in 2026.

              The capital adequacy question is therefore binary and milestone-linked. If MHRA review turns into approval
              and reimbursement traction, TauRx may transition from perpetual financing risk to commercialization
              financing. If review is delayed or rejected, the company likely returns to dependence on insider support,
              secondary financing, or partnership capital without public evidence that a broad commercial balance sheet
