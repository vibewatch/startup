              The largest gap in TauRx’s customer picture is durability. There is no public NRR, GRR, churn, renewal, or
              prescription-persistence dataset because HMTM is not marketed. Any claim about user retention must
              therefore be proxied through continuity of public engagement, repeat trial work, and the persistence of
              the patient-education ecosystem. That is directionally useful but much weaker than true commercial
              retention evidence.

              Concentration risk is clear even without revenue disclosure. TauRx currently depends on a small number of
              stakeholder channels: specialist memory-clinic investigators, UK and likely future ex-UK regulators, and
              eventually a concentrated payer set. In the UK specifically, even an approved therapy must still navigate
              value-for-money pressure in a market where NICE has pushed back on anti-amyloid drugs. That means future
              customer acquisition is not just a clinician problem but a payer-conversion problem.

              Expansion logic exists if the product wins approval. TauRx can point to adjacent user groups in MCI, mild
              to moderate Alzheimer’s disease, and other tauopathies, plus the advantage of an oral route that could
              widen the prescriber base beyond infusion-capable centers. But expansion is still hypothetical until a
