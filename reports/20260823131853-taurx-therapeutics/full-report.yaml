      - number: '5.4'
        title: Critical dependencies and differentiation durability
        blocks:
          - type: paragraph
            body: >-
              HMTM’s strongest differentiation remains convenience plus mechanism. No other approved oral tau-targeting
              disease-modifying therapy exists, and TauRx can credibly argue that a benign oral option would fit
              memory-clinic workflows more easily than infused anti-amyloid therapies. The company also owns a large
              accumulated evidence base specific to tau aggregation inhibition, which is strategically valuable if the
              field shifts further toward tau.

              But the dependency map is concentrated. TauRx depends on regulators to accept a nonstandard evidence
              history, on biomarkers to reinforce the mechanism story, on manufacturing and supply quality for an oral
              chronic therapy, and on continued scientific credibility from founder-led interpretation of the dataset.
              It also depends on the broader Alzheimer’s ecosystem to accept tau-targeting as worth reimbursement
              despite the current commercial lead held by amyloid- focused incumbents.

              In practical terms the moat is narrower than the science narrative implies. If approval is won, TauRx gets
              a meaningful first-mover advantage in oral tau therapy. If approval is delayed, the differentiator erodes
              as other tau programs accumulate biomarker data and as anti-amyloid companies keep reducing administration
              burden. Product durability therefore hinges on timely regulatory conversion, not just technical novelty.
            claimRefs:
