              TauRx has better pre-commercial customer proof than many clinical-stage biotechs because its core program
              has already touched a large, multinational patient and investigator network. Patient and carer education
              surfaces also suggest the company is serious about building demand and comprehension around early
              Alzheimer’s intervention. These are real strengths.

              The counterweight is that every commercially decisive customer metric is still missing. There is no proof
              of payer conversion, no named production deployments in routine care, no real-world persistence data, no
              revenue concentration disclosure, and no visible post-approval partner or distribution structure. The
              product therefore has adoption readiness but not customer-model maturity.

