  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and disease burden
        blocks:
          - type: paragraph
            body: >-
              The relevant market for TauRx is not “all dementia” but the subset of diagnosed and treatable Alzheimer’s
              disease patients who can be reached through regulated clinical pathways. Global burden data are still
              essential because they explain why payers, regulators, and investors care. The World Health Organization
              says 57 million people were living with dementia in 2021, with nearly 10 million new cases each year and
              global costs around $1.3 trillion. Alzheimer’s disease is the dominant underlying cause: WHO estimates it
              contributes to 60% to 70% of dementia cases, while the Alzheimer’s Society says roughly two out of three
              people living with dementia in the UK have Alzheimer’s disease.


              That headline burden overstates the near-term commercial market for TauRx. HMTM is not positioned for all
              dementia or even all Alzheimer’s patients. It is being studied and filed for mild cognitive impairment due
              to Alzheimer’s disease and mild to moderate Alzheimer’s disease, meaning the relevant market begins only
              after cognitive symptoms are recognized, clinical assessment occurs, and—at least in TauRx’s key trial
              program—amyloid positivity is confirmed. TauRx’s own patient and medical-professional pages emphasize MCI
              as an early diagnostic marker and repeatedly argue that earlier intervention is where disease-modifying
              benefit is most likely to matter.


              The practical market boundary therefore has three layers: a very large global burden pool; a smaller
              diagnosed Alzheimer’s population; and a narrower treated population that has diagnostic access, clinician
              willingness, and payer coverage. That layered framing is crucial, because many broad market-size claims
              ignore the diagnostic bottlenecks that already slow uptake of Leqembi and Kisunla. For TauRx, market
              opportunity is real, but commercial access depends on making the jump from epidemiological burden to
              treatable, reimbursable, workflow-compatible use.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
