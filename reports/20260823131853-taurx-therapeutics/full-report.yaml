            body: >-
              The financial verdict is that TauRx is not yet an operating cash-flow story; it is a late- stage
              regulatory conversion story. Revenue quality is currently weak because no approved product sales are
              visible, pricing is undisclosed, and third-party revenue estimates are too inconsistent to underwrite.
              Margin path could be attractive in theory if an oral small- molecule Alzheimer’s therapy reaches market,
              but that upside is entirely contingent on approval, uptake, and payer terms.

              The company’s strongest public financial positive is continued investor support over a long development
              cycle. Its weakest feature is opacity. No public audited financial statements, no clear cash balance, no
              disclosed monthly burn, no realized net pricing, and no disclosed launch budget are available in the
              public record reviewed here. That means a valuation or capital plan must carry a wider range than would be
              acceptable for a commercial biotech.

              The practical underwriting stance is cautious. TauRx may have enough structural support to remain fundable
              into the next regulatory milestone, but the public record does not support a high-confidence view on
              runway length or dilution risk. Financial diligence should therefore focus on cash, burn, launch spend,
