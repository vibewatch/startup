  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              TauRx is not a low-quality company. The product is differentiated, the target disease is large, the
              mechanistic thesis has biological seriousness, and the company has carried the asset into a live
              regulatory process rather than remaining stuck in perpetual preclinical promise. That means the asset
              deserves non-zero strategic value. The problem for investors is entry price. Public evidence for the
              oft-cited ~$2.5B private valuation is mostly tracker-based rather than grounded in a clearly disclosed
              2025 or 2026 priced round. At the same time, the company still faces a binary regulatory event and
              meaningful uncertainty on market access and financing durability.

              The right call is therefore price-sensitive. At a materially lower entry point or after clearer regulatory
              validation, the asset could become attractive. At the currently signaled valuation, however, public
              evidence does not offer enough margin of safety. That makes the practical call track rather than invest
              now. The thesis is interesting, but the price appears to anticipate more certainty than the evidence base
              currently provides.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
