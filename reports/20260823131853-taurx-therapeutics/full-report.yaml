      - number: '2.3'
        title: Adoption drivers, constraints, and competitive context
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers support demand for disease-modifying Alzheimer’s therapies. First, patient and
              caregiver need is enormous and persistent, which supports willingness to try treatments that offer even
              modest delay of decline. Second, regulators and payers now accept the category as real: Leqembi and
              Kisunla are approved in the United States, and their launch has normalized the idea that Alzheimer’s can
              be addressed with disease-modifying therapy rather than symptoms alone. Third, pipeline diversification is
              expanding confidence in non-amyloid approaches. The Alzheimer’s Association’s 2026 pipeline review shows
              tau-targeted agents have grown from roughly 6% to around 20% of the active pipeline over the last decade,
              now rivaling amyloid-targeted programs as a share of development effort.


              The constraints are just as important. NICE’s final draft guidance for donanemab and lecanemab concluded
              that neither drug’s benefits justify NHS costs today. That is a major signal for TauRx: even if efficacy
              is real, adoption in a publicly funded system will be disciplined by health-economic scrutiny, not just
              unmet need. Anti-amyloid therapies also face operational bottlenecks around biomarker confirmation,
              infusion burden, and ARIA risk. FDA safety language for both products underscores ongoing monitoring
              needs.


              TauRx’s opening is therefore not “there is no competition,” but “there is room for a
              cheaper-to-administer, oral, lower-burden option if efficacy stands up.” BioSpace’s 2026 sector coverage
              and AC Immune’s pipeline page also show that tau is increasingly crowded. TauRx benefits from being
              later-stage than most tau competitors, but the market is evolving toward combinations of better
              diagnostics, earlier intervention, and multiple mechanisms. Timing advantage matters, but only if approval
              and reimbursement arrive before the next wave of tau programs matures.
            claimRefs:
