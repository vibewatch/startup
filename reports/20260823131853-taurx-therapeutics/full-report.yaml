      - number: '3.2'
        title: 'Approved incumbents: anti-amyloid therapies set the evidence and access bar'
        blocks:
          - type: paragraph
            body: >-
              Leqembi and Kisunla matter because they prove two things simultaneously: there is real payer and clinician
              appetite for disease-modifying treatment, and the operational bar to participate in that market is high.
              FDA materials show both drugs are tied to early Alzheimer’s populations and carry safety warnings around
              amyloid-related imaging abnormalities. Kisunla’s own commercial materials emphasize limited-duration
              treatment and cost examples, while Leqembi sales and revenue guidance show that a cumbersome product can
              still generate meaningful revenue when backed by large-scale launch infrastructure.

              These products therefore create both a threat and an opening for TauRx. The threat is trust and
              infrastructure: large companies can absorb slow uptake, run outcomes studies, and educate specialists at
              scale. The opening is burden reduction. TauRx’s company materials repeatedly claim HMTM could fit standard
              care more easily because it is oral and has not shown ARIA in trials to date. If that claim stands up,
              TauRx could position HMTM against the infusion-plus- monitoring load of amyloid antibodies rather than
              only on efficacy absolute value.

              Still, the approved incumbents also set a reimbursement reality check. NICE’s rejection of lecanemab and
              donanemab on NHS value-for-money grounds means TauRx cannot rely on convenience alone. A
              cheaper-to-administer medicine can still fail if the evidence package looks fragile or the effect size
              looks too small for the price asked.
