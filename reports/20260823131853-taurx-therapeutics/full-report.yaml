      - number: '7.2'
        title: Operational, quality, and supply risks remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              TauRx has more operational complexity than its small public footprint suggests. Running multinational
              Alzheimer’s trials, processing biomarker and imaging evidence, responding to MHRA information requests,
              and preparing for potential launch all require a high-quality operating backbone. Yet the public record
              contains little detail on commercial manufacturing readiness, batch release processes, supplier
              concentration, pharmacovigilance infrastructure, or launch-day medical-support capacity.

              This under-disclosure matters because oral convenience only becomes a true advantage if supply quality is
              reliable and if physicians are confident the company can support real-world use. In a neurological chronic
              therapy, interruptions, label confusion, or safety communication failures would hurt trust quickly. The
              company’s policy pages show awareness of website security, analytics, and personal-data handling, but they
              do not resolve the bigger operational question of drug-supply and field-readiness execution.

              The strongest mitigation is that TauRx is not moving from preclinical obscurity to launch; it has spent
              years operating within controlled clinical settings. The weakest point is that public manufacturing and
              support detail remain sparse, leaving a meaningful diligence gap.
