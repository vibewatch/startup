  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing remain largely future-state
        blocks:
          - type: paragraph
            body: >-
              TauRx is best understood as a pre-revenue or near-zero-revenue biotech rather than an operating
              Alzheimer’s therapeutics business. The official company site, publication materials, and regulatory
              coverage all center on clinical development, regulatory filing, and commercialization ambition, not
              current marketed sales. HMTM is still investigational, and the MHRA review described in company-linked
              coverage means TauRx has not yet crossed the line from R&D spend to reimbursed product revenue. That
              sharply limits what can be said about realized revenue quality.

              The future revenue model is straightforward in concept but unproven in practice. If HMTM is approved,
              TauRx would likely monetize through prescription drug sales into specialist memory care pathways,
              potentially supported by territorial partnerships. However, no public price, gross-to-net assumption,
              rebate structure, or payer contracting model has been disclosed. This means current pricing analysis must
              rely on analogs such as Leqembi and Kisunla to understand the value band of disease-modifying Alzheimer’s
              therapies, while recognizing that TauRx is positioning an oral therapy with lower administration burden
              rather than an infused antibody.

              Third-party data aggregators disagree on whether TauRx has any meaningful current revenue at all.
              Seedtable frames the company primarily through funding rounds and signals rather than operating
              performance, while Tracxn and other trackers cited in earlier diligence materials imply either negligible
              or highly estimated revenue. That inconsistency reinforces the key financial conclusion: current reported
              revenue is not decision-grade, and the investment case must be underwritten on future approval probability
              and capital adequacy instead.
