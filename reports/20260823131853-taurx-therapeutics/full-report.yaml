      - number: '1.4'
        title: Milestones and current status entering the 2026 decision window
        blocks:
          - type: paragraph
            body: >-
              TauRx’s milestone arc is unusually long for a private biotechnology company: the core tau discovery dates
              back to 1988, the tau-aggregation inhibitor concept to 1996, company formation to 2002, first Phase II
              work to 2004, first Phase III programs to 2012-2016, and the LUCIDITY confirmatory monotherapy program to
              2017 onward. The public scientific-publications page and clinical-trials timeline show a company that has
              continued publishing, revising trial designs, and defending its thesis despite repeated controversy over
              placebo design and clinical interpretation. That persistence is both a strength and a warning sign. It
              demonstrates scientific commitment and capital resilience, but it also reflects how long the company has
              needed to reach a potentially approvable dossier.


              The current corporate status is clear enough. HMTM is still investigational, not licensed by any
              regulator, and under review at the UK MHRA. TauRx’s FAQ says an MHRA decision is expected in 2026 and that
              NICE would assess NHS use after any approval. The company also says some patients from completed trials
              accessed the drug through expanded-access programs, implying ongoing engagement with the treated
              population even before commercial launch. Public materials repeatedly position HMTM as a lower-burden oral
              option versus infusion-based anti-amyloid antibodies.


              From a diligence standpoint, the 2026 status window is decisive. If MHRA review converts TauRx from a
              research-heavy private biotech into a first-launch commercial company, the prior two decades of capital
              and trial spend can be reframed as a long but coherent development cycle. If review extends, rejects, or
              requests more data, the same history can be read as evidence of serial re-interpretation without
              sufficiently convincing primary-endpoint success. That binary is central to every later chapter.
            claimRefs:
              - CO031
              - CO032
              - CO033
