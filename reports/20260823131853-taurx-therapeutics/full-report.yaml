  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation in a pre-commercial biotech context
        blocks:
          - type: paragraph
            body: >-
              Because TauRx has no marketed product today, its current customer base is not a classic set of paying
              accounts. The most accurate segmentation has three layers. First are end users and advocates: patients
              with mild cognitive impairment or early Alzheimer’s disease and their carers, who consume the company’s
              educational materials and would ultimately use HMTM if it is approved. Second are prescriber and
              trial-channel users: neurologists, memory-clinic teams, principal investigators, and site networks that
              decide whether the therapy gets tested, discussed, and potentially prescribed. Third are payers and access
              gatekeepers such as the NHS, NICE, and equivalent reimbursement bodies that determine whether clinical
              interest can convert into funded use.

              TauRx’s own site architecture supports that segmentation. Separate surfaces exist for patients and carers,
              medical professionals, media, and education or advocacy resources, which implies the company is already
              building distinct communications for different adoption audiences. However, these are still readiness and
              education surfaces, not evidence of recurring revenue relationships.

              The practical implication is that the current chapter should be read as a funnel of stakeholder engagement
              rather than as proof of commercial scale. TauRx has real pre-commercial audience proof, but it does not
              yet have a public customer ledger.
