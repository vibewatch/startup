      - number: '5.3'
        title: Trust, regulatory quality controls, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Trust for TauRx is regulatory and scientific before it is commercial. The company’s current quality signal
              is not a certification badge or software compliance report but the fact that it has assembled a long
              clinical dataset, published LUCIDITY in a peer-reviewed outlet, and has advanced to a UK Marketing
              Authorisation Application. Company updates state that responses to an MHRA information request were
              finalized, while external coverage describes HMTM as being actively evaluated by the MHRA. That places
              TauRx in a late-stage trust-building cycle where the regulator’s view matters more than any marketing
              claim.

              The roadmap is therefore milestone driven. Near-term milestones are MHRA review, potential UK access
              discussions, and continued efforts to use published biomarker and imaging data to support broader
              acceptance of the product profile. Medium-term development includes broader jurisdictional filings and any
              expansion or strengthening of claims across MCI, mild to moderate Alzheimer’s disease, and adjacent
              tauopathies.

              The trust challenge is that earlier late-stage studies remain part of the package. The product has
              maturity in the sense of years of development and thousands of exposed participants, but not maturity in
              the sense of a clean undisputed registrational path. TauRx must convert a technically rich evidence
              package into a regulator-endorsed label before product maturity can be treated as commercial readiness.
