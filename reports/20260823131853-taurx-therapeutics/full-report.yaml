      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              TauRx’s leadership structure is highly founder-shaped. Claude Wischik remains co-founder, chairman, and
              chief executive, and the official biographies make clear that the scientific thesis, public advocacy, and
              regulatory positioning of the company are strongly associated with his personal work on tau pathology.
              John Storey, who joined in 2002 and became chief technical officer in 2023, supplies continuity across
              chemistry discovery, scale-up, and industrialisation. That combination gives TauRx a credible technical
              core, but it also concentrates institutional memory and strategic authority in a small group that has been
              present since the company’s earliest years.


              The wider leadership page shows a more complete late-stage operating stack than early press coverage alone
              would suggest. Glenn Corr oversees operations spanning clinical, regulatory, development, HR, quality, IT,
              communications, legal, finance, and financing strategy. Richard Stefanacci adds payer-policy and Medicare
              access experience that is directly relevant if TauRx reaches reimbursement discussions. Bjoern Schelter’s
              remit explicitly bridges analytics, regulatory, commercial, and financing workstreams, which is notable
              because TauRx’s approval strategy depends heavily on complex biomarker, delayed-start, and
              external-control analyses. The leadership roster also includes named regulatory, medical, commercial,
              legal, finance, people, and operations heads.


              Even so, public governance detail remains incomplete. Third-party databases indicate a broad board and
              shareholder base, but the company does not publicly provide the same level of committee, independence, or
              incentive disclosure that public biotechnology companies would. The resulting diligence view is mixed:
              management depth is better than a pure founder-scientist shop, yet key-person dependence, private-company
              opacity, and limited board transparency remain real governance constraints on underwriting the business.
