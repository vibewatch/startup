      - number: '7.3'
        title: Dependency, people, and financing risks are tightly linked
        blocks:
          - type: paragraph
            body: >-
              TauRx’s dependency structure is concentrated. Scientific interpretation is still strongly tied to founder
              and long-time leader Claude Wischik, whose views and publications are central to the company’s narrative.
              That creates key-person risk: if leadership credibility weakens, regulatory and investor confidence could
              weaken with it. The company also depends on specialist memory- clinic investigators, regulators, and a
              relatively small set of stakeholder channels rather than on a broad commercial network.

              Financing risk compounds that concentration. Public evidence shows recurring shareholder support,
              including a rights issue and warrant exercise, but not a clear current cash balance. If MHRA review slips,
              TauRx may need to raise capital again under pressure, potentially from existing investors or strategic
              partners rather than from a broad public market. The negative scenario is not just dilution. It is the
              transmission of regulatory delay into funding urgency, then into weaker competitive positioning.

              Finally, partner and access risk matter because even approval would not eliminate payer friction. NICE’s
              skepticism toward anti-amyloid therapies reminds investors that clinical approval and funded uptake are
              separate questions in Alzheimer’s disease.
            claimRefs:
              - CR019
