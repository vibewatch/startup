companyProfile:
  summary: >-
    TauRx Therapeutics is a private late-stage neurodegeneration company founded in Singapore in 2002
    and operationally centered in Aberdeen, Scotland. The company is built around hydromethylthionine
    mesylate or HMTM, an oral tau aggregation inhibitor for early Alzheimer’s disease, and has advanced
    the asset through a long clinical-development arc culminating in a peer-reviewed phase 3 publication
    and a live UK MHRA review process. Public third-party sources indicate about $434 million of disclosed
    lifetime funding and a tracker-style valuation signal around $2.5 billion, but current runway and the
    precise basis of that valuation remain under-disclosed.
  foundedDate: "2002-01-01"
  founders:
    - name: Claude Wischik
      role: Founder, Chairman, and Chief Executive
      background: Aberdeen-linked neuroscientist whose tau-aggregation work underpins the company’s scientific thesis.
      claimRefs: [CO010]
    - name: John Storey
      role: Long-time technical leader and Chief Technical Officer
      background: Joined TauRx in 2002 and became chief technical officer in 2023.
      claimRefs: [CO011]
  foundingLocation: Singapore
  headquarters: Singapore with major operations in Aberdeen, Scotland
  productSummary: >-
    TauRx’s lead product is HMTM, an oral tau aggregation inhibitor being developed for mild cognitive
    impairment due to Alzheimer’s disease and mild Alzheimer’s disease. The company’s value is highly
    concentrated in this lead asset and its associated biomarker and clinical package.
  customerFocus: Pre-commercial memory-clinic specialists, future Alzheimer’s patients and carers, and national payer or reimbursement systems.
  businessModel: Proprietary drug development funded by private capital with future value creation expected from approval, commercialization, and possible partnering.
  stage: private late-stage biotech
  fundingStatus: >-
    Public third-party sources indicate roughly $434 million of disclosed lifetime funding across six
    rounds, with the latest clearly disclosed round a $119 million Series E in November 2022. Current
    cash runway and any later secondary-price support are not transparently public.
  disclosureProfile: private-undisclosed
