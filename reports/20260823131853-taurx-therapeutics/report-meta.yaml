  the UK MHRA filing process, and long-run disclosed financing history. Public evidence is weaker on
  current cash runway, the content of MHRA feedback, commercialization readiness, payer strategy, and
  the exact basis for the frequently cited ~$2.5B private valuation signal. The recommendation therefore
  relies on public-option-value analysis and scenario framing rather than on a fully transparent pricing record.
