      - [Evidence credibility, Mixed, Historical placebo controversy, Fragile, Review regulator feedback in detail]
      - [Distribution power, Weak relative to big pharma, Biogen/Eisai and Lilly launch scale, Adverse, Map partnership / licensing options]
      - [Reimbursement fit, Unproven, NICE skepticism and payer cost scrutiny, Fragile, Model price-benefit thresholds]
      - [Time-to-market lead in tau, Still meaningful if approval lands soon, Diranersen and other tau programs, Eroding if delays continue, Stress-test launch timing assumptions]
    notes: The moat question is whether TauRx can convert oral convenience into durable buyer preference before larger competitors solve the same problem.
