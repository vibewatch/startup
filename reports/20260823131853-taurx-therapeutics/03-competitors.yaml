      - [Kisunla, Anti-amyloid antibody, IV infusion, Approved, High, Limited-duration amyloid removal strategy, Real-world discontinuation and coverage]
      - [Diranersen, Tau-targeting ASO, Intrathecal, Phase 2 completed, Specialist-administered, Advance to registrational development, Regulatory read-through from missed primary endpoint]
      - [ACI-35.030, Active pTau immunotherapy, Injectable biologic, Phase 1b/2a, Unclear / trial-based, Partnered tau immunotherapy path, Magnitude of clinical efficacy signal]
      - [OLX-07010, Tau self-association inhibitor, Oral small molecule, Phase 1a, Likely lower than biologics, Oral tau competitor for AD and PSP, Human efficacy unproven]
      - [Buntanetap, Multi-protein neurodegeneration approach, Oral, Phase 3 in early AD, Likely lower than biologics, Compete on oral convenience and cognition signals, Regulatory durability of program still uncertain]
    notes: Monitoring burden refers to what is visible from public materials, not a definitive regulatory requirement set.
    claimRefs: [CP003, CP010, CP011, CP016, CP020, CP021, CP022, CP024, CP025, CP026]
  - id: TP003
    title: Capability, pricing, and regulatory comparison table
    columns: [Program, Evidence strength, Route / convenience, Safety / monitoring issue, Pricing or revenue signal, UK / payer posture]
    rows:
      - [HMTM, Contested late-stage evidence with biomarker support, Oral, No ARIA signal claimed; regulatory review ongoing, No public price, Unknown until MHRA/NICE outcomes]
      - [Leqembi, Traditional FDA approval and growing sales, Infusion with newer SC option, ARIA boxed warning and imaging burden, Q1 2026 sales $168M; FY2026 guide ~$900M, NICE negative on value]
      - [Kisunla, FDA approval plus pivotal JAMA data, Monthly infusion; limited-duration concept, ARIA risk; infusion burden, Illustrative course cost $12.5k-$48.7k, NICE negative on value]
      - [Diranersen, Positive Phase 2 biomarkers and cognitive signals, Intrathecal / specialist procedure, Higher-dose SAE signal noted, No public commercial pricing, Too early for payer stance]
      - [OLX-07010 / reMYND class, Very early human or prelaunch data, Potential oral advantage, Unknown clinical safety profile, No commercial signal, Too early for payer stance]
    notes: "This table compares what buyers will actually care about: evidence quality, convenience, monitoring, and payability."
    claimRefs: [CP012, CP013, CP014, CP015, CP016, CP017, CP020, CP021, CP027, CP032]
