  claims:
    - { id: CP001, statement: The most immediate disease-modifying incumbents to TauRx are Leqembi and Kisunla not other tau programs., type: inferred, topic: competitive-landscape, sourceRefs: [SP001, SP004, SP005], confidence: medium, freshness: current, answersQuestionRefs: [QP001, QP002] }
    - { id: CP002, statement: Leqembi and Kisunla are already approved for early Alzheimer’s disease populations giving them current clinical legitimacy that TauRx does not yet have., type: observed, topic: competitive-landscape, sourceRefs: [SP001, SP004], confidence: high, freshness: current, answersQuestionRefs: [QP001, QP002, QP004] }
    - { id: CP003, statement: TauRx’s main direct differentiation versus approved incumbents is oral administration rather than infusion-based delivery., type: inferred, topic: route-differentiation, sourceRefs: [SP005, SP019, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP008] }
    - { id: CP004, statement: A third competitive layer for TauRx is the status quo of symptomatic oral care and untreated progression., type: inferred, topic: substitutes, sourceRefs: [SP014, SP021, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP014] }
    - { id: CP005, statement: BioSpace’s AAIC 2026 coverage says tau is becoming the next major Alzheimer’s target after amyloid validation., type: third-party-reported, topic: tau-wave, sourceRefs: [SP007], confidence: medium, freshness: recent, answersQuestionRefs: [QP023] }
    - { id: CP006, statement: The Alzheimer’s Association pipeline review shows a diversified field in which tau-targeted agents now represent about one-fifth of development activity., type: observed, topic: tau-wave, sourceRefs: [SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP023] }
    - { id: CP007, statement: TauRx’s own neurodegenerative-disorders page argues that HMTM sits within a broader tauopathy opportunity set beyond Alzheimer’s disease., type: company-claimed, topic: adjacent-indications, sourceRefs: [SP016], confidence: medium, freshness: current, answersQuestionRefs: [QP014] }
    - { id: CP008, statement: TauRx completed a late-stage bvFTD study which broadens the company’s mechanistic narrative even though it does not remove Alzheimer’s competition., type: company-claimed, topic: adjacent-indications, sourceRefs: [SP014, SP015], confidence: medium, freshness: historical, answersQuestionRefs: [QP014] }
    - { id: CP009, statement: Competing in Alzheimer’s therefore means competing across approved incumbents next-wave tau programs symptomatic standards and diagnostic inertia., type: inferred, topic: competitive-landscape, sourceRefs: [SP001, SP007, SP014, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP001, QP014] }
    - { id: CP010, statement: Leqembi is a traditionally approved anti-amyloid therapy with boxed safety language around ARIA and use in early Alzheimer’s disease., type: observed, topic: approved-incumbents, sourceRefs: [SP001], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP010] }
    - { id: CP011, statement: Kisunla is an FDA-approved anti-amyloid therapy for early symptomatic Alzheimer’s disease with monthly infusion dosing., type: observed, topic: approved-incumbents, sourceRefs: [SP004, SP005], confidence: high, freshness: current, answersQuestionRefs: [QP003, QP010] }
    - { id: CP012, statement: Lilly markets Kisunla’s limited-duration treatment concept as a commercial differentiator., type: company-claimed, topic: approved-incumbents, sourceRefs: [SP005], confidence: medium, freshness: recent, answersQuestionRefs: [QP003] }
    - { id: CP013, statement: Leqembi generated 168 million dollars of global sales in Q1 2026 showing that a high-burden treatment can still achieve meaningful uptake., type: third-party-reported, topic: approved-incumbents, sourceRefs: [SP002], confidence: medium, freshness: recent, answersQuestionRefs: [QP002, QP016] }
    - { id: CP014, statement: Eisai guides to about 900 million dollars in Leqembi fiscal 2026 sales reinforcing the launch-scale advantage of big-pharma incumbents., type: third-party-reported, topic: approved-incumbents, sourceRefs: [SP003], confidence: medium, freshness: recent, answersQuestionRefs: [QP002, QP016] }
    - { id: CP015, statement: Kisunla’s public cost examples range from roughly 12,522 dollars to 48,696 dollars depending on treatment duration., type: company-claimed, topic: approved-incumbents, sourceRefs: [SP005], confidence: medium, freshness: recent, answersQuestionRefs: [QP003, QP022] }
    - { id: CP016, statement: Both Leqembi and Kisunla carry ARIA-related monitoring burdens that an oral small molecule could potentially avoid., type: inferred, topic: approved-incumbents, sourceRefs: [SP001, SP004, SP025], confidence: high, freshness: current, answersQuestionRefs: [QP003, QP010] }
    - { id: CP017, statement: Approved status alone does not secure payer success in the UK because anti-amyloid therapies have faced value-for-money resistance., type: inferred, topic: approved-incumbents, sourceRefs: [SP005, SP006], confidence: medium, freshness: recent, answersQuestionRefs: [QP022] }
    - { id: CP018, statement: TauRx cannot win simply by being more convenient if payers and regulators view anti-amyloid incumbents as more credible., type: inferred, topic: approved-incumbents, sourceRefs: [SP003, SP017, SP018], confidence: medium, freshness: current, answersQuestionRefs: [QP016, QP022] }
    - { id: CP019, statement: Biogen and Ionis describe diranersen as the first randomized Phase 2 tau-directed therapy to show both robust biomarker impact and cognitive benefit in early Alzheimer’s disease., type: company-claimed, topic: emerging-tau, sourceRefs: [SP009, SP010], confidence: high, freshness: recent, answersQuestionRefs: [QP005, QP006] }
    - { id: CP020, statement: Diranersen did not meet its primary endpoint assessing dose response despite its positive biomarker and cognitive signals., type: observed, topic: emerging-tau, sourceRefs: [SP009, SP010], confidence: high, freshness: recent, answersQuestionRefs: [QP006, QP007] }
    - { id: CP021, statement: Biogen nonetheless plans to advance diranersen to registrational development making it the most credible medium-term tau challenger visible in public sources., type: third-party-reported, topic: emerging-tau, sourceRefs: [SP009, SP010], confidence: high, freshness: recent, answersQuestionRefs: [QP005, QP006, QP021] }
    - { id: CP022, statement: AC Immune’s pipeline includes ACI-35.030 and a partnered Morphomer Tau program showing that larger-platform tau competition is broadening., type: observed, topic: emerging-tau, sourceRefs: [SP008], confidence: medium, freshness: current, answersQuestionRefs: [QP011, QP023] }
    - { id: CP023, statement: Oligomerix says its lead small-molecule tau self-association inhibitor OLX-07010 has entered first-in-human Phase 1a trials., type: observed, topic: emerging-tau, sourceRefs: [SP011], confidence: medium, freshness: current, answersQuestionRefs: [QP012, QP021] }
    - { id: CP024, statement: reMYND presents its Alzheimer’s program as a first-in-class oral treatment intended to restore neuronal function and reduce amyloid and tau pathology over time., type: company-claimed, topic: emerging-tau, sourceRefs: [SP012], confidence: medium, freshness: current, answersQuestionRefs: [QP012, QP023] }
    - { id: CP025, statement: Annovis Bio positions buntanetap as an active Phase 3 oral early-AD program with pTau217-positive entry criteria making it an oral competitor even though it is not a pure tau-aggregation inhibitor., type: observed, topic: emerging-tau, sourceRefs: [SP013], confidence: medium, freshness: current, answersQuestionRefs: [QP013, QP023] }
    - { id: CP026, statement: TauRx’s claim to be uniquely differentiated as an oral tau therapy is strongest against antibodies but weaker against emerging oral neurodegeneration programs., type: inferred, topic: emerging-tau, sourceRefs: [SP011, SP012, SP013, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP012, QP013, QP021] }
    - { id: CP027, statement: Each month of delay in HMTM approval reduces TauRx’s first-mover advantage within the tau field., type: inferred, topic: timing-advantage, sourceRefs: [SP007, SP009, SP011], confidence: medium, freshness: current, answersQuestionRefs: [QP021] }
    - { id: CP028, statement: Switching costs in Alzheimer’s therapy are driven more by trust monitoring pathways and physician comfort than by formal contract lock-in., type: inferred, topic: switching-costs, sourceRefs: [SP001, SP004, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP017] }
    - { id: CP029, statement: Symptomatic oral drugs remain a sticky substitute because they are familiar cheap and embedded in routine care even though they do not alter disease course., type: inferred, topic: substitutes, sourceRefs: [SP014, SP021, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP015] }
    - { id: CP030, statement: Biogen/Eisai and Lilly have far greater commercial distribution power than TauRx through specialist access launch resources and ongoing evidence generation., type: inferred, topic: distribution-power, sourceRefs: [SP002, SP003, SP005], confidence: medium, freshness: current, answersQuestionRefs: [QP016] }
    - { id: CP031, statement: Clinicians may remain willing to multi-home across products but they are likely to concentrate trust quickly in drugs with cleaner trial stories and easier reimbursement., type: inferred, topic: trust-dynamics, sourceRefs: [SP002, SP017, SP019], confidence: medium, freshness: current, answersQuestionRefs: [QP018] }
    - { id: CP032, statement: TauRx’s convenience moat depends on pairing oral administration with a price and effect size that can survive payer review., type: inferred, topic: moat, sourceRefs: [SP005, SP017, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP019, QP022] }
    - { id: CP033, statement: Independent coverage continues to treat TauRx’s placebo and subgroup issues as live credibility problems in the competitive narrative., type: third-party-reported, topic: moat, sourceRefs: [SP017, SP018, SP019, SP020], confidence: medium, freshness: recent, answersQuestionRefs: [QP009, QP020] }
    - { id: CP034, statement: A durable TauRx moat would require both regulatory acceptance and a clear buyer preference for oral simplicity over incumbent trust., type: inferred, topic: moat, sourceRefs: [SP016, SP018, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP019, QP025] }
    - { id: CP035, statement: If TauRx cannot establish that combination of credibility and convenience the market will likely default either to approved anti-amyloid leaders or to symptomatic care., type: inferred, topic: moat, sourceRefs: [SP001, SP005, SP018], confidence: low, freshness: current, answersQuestionRefs: [QP020, QP025] }
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: real-world-switching
      missingEvidence: Direct physician interview data on whether patients would switch from anti-amyloid or symptomatic regimens to an oral tau therapy.
      whyItMatters: Competitive win assumptions depend on real clinician behavior not just product attributes.
      diligencePath: Interview memory-clinic neurologists and payer medical directors in the UK and US.
      relatedQuestionRefs: [QP017, QP018]
    - type: missing-source
      severity: material
      topic: head-to-head-positioning
      missingEvidence: No public head-to-head trial comparing HMTM with approved anti-amyloid therapies or symptomatic standards.
      whyItMatters: Relative clinical value remains inferential rather than directly observed.
      diligencePath: Model comparative burden and effect using indirect treatment comparison only as a placeholder.
      relatedQuestionRefs: [QP003, QP009]
    - type: private-evidence-only
      severity: material
      topic: partnering-strategy
      missingEvidence: TauRx’s commercial partnering or licensing strategy versus large-cap incumbents.
      whyItMatters: Distribution weakness is one of TauRx’s biggest competitive vulnerabilities.
      diligencePath: Ask management whether launch is intended solo licensed or co-promoted by territory.
      relatedQuestionRefs: [QP016, QP024, QP025]
    - type: conflicting-data
      severity: material
      topic: credibility-gap
      missingEvidence: A regulator-level explanation of how historical placebo contamination and subgroup controversies will or will not limit label and promotion.
      whyItMatters: Evidence credibility is the central variable in moat durability.
      diligencePath: Review MHRA questions and any future public assessment report closely.
      relatedQuestionRefs: [QP009, QP020, QP025]
