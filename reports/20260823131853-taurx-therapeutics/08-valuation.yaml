  claims:
    - { id: CV001, statement: "TauRx has real strategic value because it is a late-stage Alzheimer’s company with a live regulatory path rather than a purely conceptual program.", type: inferred, topic: recommendation, sourceRefs: [SV010, SV012, SV013, SV024], confidence: high, freshness: current, answersQuestionRefs: [QV001, QV004] }
    - { id: CV002, statement: "The current public evidence supports tracking TauRx closely but not underwriting a fresh entry at the currently signaled valuation.", type: inferred, topic: recommendation, sourceRefs: [SV002, SV004, SV012, SV025], confidence: high, freshness: current, answersQuestionRefs: [QV024, QV030] }
    - { id: CV003, statement: "The biggest reason for caution is that the valuation signal appears to price in more certainty than the evidence base provides today.", type: inferred, topic: recommendation, sourceRefs: [SV002, SV004, SV025, SV026], confidence: high, freshness: current, answersQuestionRefs: [QV003, QV024] }
    - { id: CV004, statement: "The MHRA filing and response cycle create genuine option value because an external regulatory catalyst is active.", type: observed, topic: recommendation, sourceRefs: [SV012, SV013], confidence: high, freshness: current, answersQuestionRefs: [QV004] }
    - { id: CV005, statement: "The phase 3 publication and biomarker package make TauRx stronger than a simple story-stock biotech.", type: inferred, topic: recommendation, sourceRefs: [SV010, SV011, SV014], confidence: high, freshness: current, answersQuestionRefs: [QV005] }
    - { id: CV006, statement: "The oral route matters because it could lower treatment burden relative to infused Alzheimer’s disease-modifying therapies.", type: inferred, topic: recommendation, sourceRefs: [SV005, SV011, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV006] }
    - { id: CV007, statement: "A price-sensitive track stance is more defensible than a buy-or-pass absolute stance.", type: inferred, topic: recommendation, sourceRefs: [SV002, SV004, SV012], confidence: high, freshness: current, answersQuestionRefs: [QV020, QV024] }
    - { id: CV008, statement: "A materially lower entry point or clearer regulatory validation could move the recommendation positively.", type: inferred, topic: recommendation, sourceRefs: [SV012, SV013, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV025] }
    - { id: CV009, statement: "At the current tracker-like price signal public evidence does not offer enough margin of safety.", type: inferred, topic: recommendation, sourceRefs: [SV002, SV003, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV024, QV030] }
    - { id: CV010, statement: "The practical recommendation is therefore to monitor catalyst progress rather than force entry now.", type: inferred, topic: recommendation, sourceRefs: [SV012, SV025, SV026], confidence: high, freshness: current, answersQuestionRefs: [QV024, QV030] }
    - { id: CV011, statement: "TauRx clearly has public valuation signals but they are mostly tracker-based rather than rooted in a newly disclosed primary financing round.", type: observed, topic: price-support, sourceRefs: [SV002, SV003, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV002, QV007] }
    - { id: CV012, statement: "Tracxn and similar pages are the clearest current public anchors for the oft-cited ~$2.5B mark.", type: observed, topic: price-support, sourceRefs: [SV002, SV003, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV007] }
    - { id: CV013, statement: "The strongest clearly public financing event remains the 2022 capital infusion rather than a transparent 2025 or 2026 priced round.", type: observed, topic: price-support, sourceRefs: [SV006, SV035], confidence: high, freshness: current, answersQuestionRefs: [QV002, QV008] }
    - { id: CV014, statement: "The public record reviewed for this report did not surface a fully disclosed December 2025 or early 2026 financing that can firmly anchor valuation.", type: inferred, topic: price-support, sourceRefs: [SV002, SV004, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV008] }
    - { id: CV015, statement: "Because current cash runway is not public investors cannot confidently size dilution risk if MHRA review extends.", type: observed, topic: price-support, sourceRefs: [SV007, SV008, SV009], confidence: high, freshness: current, answersQuestionRefs: [QV009] }
    - { id: CV016, statement: "Approved amyloid therapies show that the Alzheimer’s market can reward disease-modifying progress and therefore support strategic value for TauRx.", type: inferred, topic: price-support, sourceRefs: [SV020, SV021, SV022, SV023], confidence: high, freshness: current, answersQuestionRefs: [QV010] }
    - { id: CV017, statement: "That precedent does not fully support TauRx’s current price because approval economics depend on label access and commercialization capability.", type: inferred, topic: price-support, sourceRefs: [SV018, SV019, SV022], confidence: high, freshness: current, answersQuestionRefs: [QV011] }
    - { id: CV018, statement: "Payer resistance in the UK is an important valuation discount because approval alone may not translate into broad funded use.", type: observed, topic: price-support, sourceRefs: [SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV011] }
    - { id: CV019, statement: "The Alzheimer’s disease opportunity is undeniably large which limits downside to zero but does not validate today’s entry price.", type: inferred, topic: price-support, sourceRefs: [SV027, SV028, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV001, QV020] }
    - { id: CV020, statement: "Public filings confirm entity continuity and historic capital structure signals but not enough current financial detail to treat TauRx like a public-market underwrite.", type: inferred, topic: price-support, sourceRefs: [SV007, SV008, SV009], confidence: high, freshness: current, answersQuestionRefs: [QV009] }
    - { id: CV021, statement: "Biogen and Lilly are useful regulatory and commercialization precedents but poor direct valuation multiples for TauRx.", type: inferred, topic: comparables, sourceRefs: [SV020, SV021, SV022, SV023], confidence: high, freshness: current, answersQuestionRefs: [QV012, QV021, QV023] }
    - { id: CV022, statement: "Tau-focused public peers such as AC Immune are more useful for optionality framing than for direct mark-to-market comparability.", type: inferred, topic: comparables, sourceRefs: [SV031, SV034, SV036, SV037], confidence: medium, freshness: current, answersQuestionRefs: [QV022] }
    - { id: CV023, statement: "Direct multiple transfer is inappropriate because TauRx combines private-market opacity single-asset concentration and near-registration binary risk.", type: inferred, topic: comparables, sourceRefs: [SV002, SV008, SV021, SV036], confidence: high, freshness: current, answersQuestionRefs: [QV012, QV013, QV023] }
    - { id: CV024, statement: "Scenario analysis is the right framework because value changes non-linearly with approval label breadth access and financing outcomes.", type: inferred, topic: scenarios, sourceRefs: [SV012, SV019, SV025], confidence: high, freshness: current, answersQuestionRefs: [QV013] }
    - { id: CV025, statement: "The bull case requires approval with a usable label and a credible oral-adoption pathway.", type: inferred, topic: scenarios, sourceRefs: [SV005, SV011, SV012, SV013], confidence: high, freshness: current, answersQuestionRefs: [QV014, QV017] }
    - { id: CV026, statement: "The base case assumes some form of delay or constrained uptake combined with another financing step.", type: inferred, topic: scenarios, sourceRefs: [SV006, SV012, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV015, QV018] }
    - { id: CV027, statement: "The bear case is a major new-study requirement rejection or urgent refinancing before strategic clarity.", type: inferred, topic: scenarios, sourceRefs: [SV012, SV025, SV026], confidence: high, freshness: current, answersQuestionRefs: [QV016, QV019] }
    - { id: CV028, statement: "A defensible public bear range is roughly $0.1B to $0.6B because residual asset and IP value would remain but most growth optionality would collapse.", type: estimated, topic: scenarios, sourceRefs: [SV024, SV025, SV026], confidence: medium, freshness: current, answersQuestionRefs: [QV019] }
    - { id: CV029, statement: "A defensible public base range is roughly $0.8B to $1.6B because approval optionality remains but price support is weakened by delay dilution and access risk.", type: estimated, topic: scenarios, sourceRefs: [SV002, SV019, SV024, SV036], confidence: medium, freshness: current, answersQuestionRefs: [QV018] }
    - { id: CV030, statement: "A defensible public bull range is roughly $2.5B to $4.0B but it requires approval label usefulness and real uptake rather than mere regulatory survival.", type: estimated, topic: scenarios, sourceRefs: [SV005, SV012, SV022, SV034], confidence: medium, freshness: current, answersQuestionRefs: [QV017] }
    - { id: CV031, statement: "The probability-weighted center of the public scenario set sits below the current tracked private mark.", type: inferred, topic: diligence, sourceRefs: [SV002, SV025, SV029], confidence: medium, freshness: current, answersQuestionRefs: [QV020] }
    - { id: CV032, statement: "A negative MHRA outcome or a major confirmatory-study requirement is the clearest thesis-break trigger.", type: inferred, topic: diligence, sourceRefs: [SV012, SV013, SV025], confidence: high, freshness: current, answersQuestionRefs: [QV026, QV028] }
    - { id: CV033, statement: "A second key thesis-break signal is evidence of refinancing urgency before regulatory clarity is achieved.", type: inferred, topic: diligence, sourceRefs: [SV006, SV007, SV008], confidence: medium, freshness: current, answersQuestionRefs: [QV026, QV028] }
    - { id: CV034, statement: "Approval without reimbursement traction or without specialist trust would justify a sharp haircut to the bull narrative.", type: inferred, topic: diligence, sourceRefs: [SV018, SV019, SV026], confidence: high, freshness: current, answersQuestionRefs: [QV028, QV029] }
    - { id: CV035, statement: "The main diligence burden is private evidence on runway regulatory dialogue launch planning and valuation support rather than more public background reading.", type: inferred, topic: diligence, sourceRefs: [SV007, SV008, SV012], confidence: high, freshness: current, answersQuestionRefs: [QV027] }
    - { id: CV036, statement: "What would improve the call most is not another narrative source but concrete disclosure on cash runway and regulator feedback.", type: inferred, topic: diligence, sourceRefs: [SV008, SV012, SV013], confidence: high, freshness: current, answersQuestionRefs: [QV025, QV027] }
    - { id: CV037, statement: "If management can demonstrate adequate runway through the MHRA process the valuation debate becomes materially less fragile.", type: inferred, topic: diligence, sourceRefs: [SV006, SV007, SV008], confidence: medium, freshness: current, answersQuestionRefs: [QV025, QV027] }
    - { id: CV038, statement: "If management cannot explain the basis for the ~$2.5B mark the current entry case weakens further even if the science remains interesting.", type: inferred, topic: diligence, sourceRefs: [SV002, SV004, SV006], confidence: medium, freshness: current, answersQuestionRefs: [QV027] }
    - { id: CV039, statement: "After any positive regulatory event investors should still demand evidence on label scope access and uptake before treating TauRx as fully de-risked.", type: inferred, topic: diligence, sourceRefs: [SV019, SV022, SV023], confidence: high, freshness: current, answersQuestionRefs: [QV029] }
    - { id: CV040, statement: "The final investment conclusion is to track TauRx as a high-upside but currently over-supported private valuation story rather than commit at today’s implied mark.", type: inferred, topic: diligence, sourceRefs: [SV002, SV012, SV025], confidence: high, freshness: current, answersQuestionRefs: [QV024, QV030] }
  evidenceGaps:
    - type: private-evidence-only
      severity: critical
      topic: current-runway
      missingEvidence: Current cash balance monthly burn and runway bridge are not public.
      whyItMatters: They determine whether regulatory delay converts into dilution pressure.
      diligencePath: Request latest management accounts runway bridge and downside financing plan.
      relatedQuestionRefs: [QV009, QV027]
    - type: private-evidence-only
      severity: critical
      topic: mhra-dialogue
      missingEvidence: The substance of MHRA questions and the remaining unresolved items is private.
      whyItMatters: It is the best direct input into approval probability.
      diligencePath: Review the regulator Q and A package or a board summary of it.
      relatedQuestionRefs: [QV004, QV025, QV027]
    - type: incomplete-public-record
      severity: material
      topic: comparable-sample-coverage
      missingEvidence: Public comparables for a private near-registration tau company remain imperfect and the comparable table is intentionally a sample.
      whyItMatters: Mechanical multiple transfer would create false precision.
      diligencePath: Expand peer set with paid market data and specialist biotech valuation comparables.
      relatedQuestionRefs: [QV012, QV021, QV022]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: material
      topic: valuation-mark-support
      missingEvidence: The evidence behind the cited ~$2.5B private mark is not fully transparent in the public record.
      whyItMatters: Entry discipline depends on whether that mark reflects a real clearing transaction or a tracker estimate.
      diligencePath: Request latest board valuation pack and any secondary trade references.
      relatedQuestionRefs: [QV002, QV007, QV008, QV027]
