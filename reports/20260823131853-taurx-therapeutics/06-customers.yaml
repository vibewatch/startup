company:
  name: TauRx Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    TauRx is pre-commercial, so its current customer picture is better described as a stakeholder and
    adoption-readiness map than as a revenue-backed installed base. The present ecosystem includes
    trial participants, investigators and site networks, patients and carers consuming educational
    materials, and the future buyer/user/payer triangle of specialists, health systems, and public
    payers. The strongest proof of real adoption is the 82-site LUCIDITY trial and the broader
    evidence base involving more than 3,000 participants, which shows real-world willingness among
    patients and investigators to engage with HMTM. The weakest part of the picture is everything
    after approval: no public data exists on retention, formulary conversion, production deployment,
    or concentration beyond the obvious fact that TauRx currently depends on a small number of
    regulator- and investigator-mediated channels.
sections:
  - id: segmentation
    title: Customer base segmentation in a pre-commercial biotech context
    body: >-
      Because TauRx has no marketed product today, its current customer base is not a classic set of
      paying accounts. The most accurate segmentation has three layers. First are end users and
      advocates: patients with mild cognitive impairment or early Alzheimer’s disease and their
      carers, who consume the company’s educational materials and would ultimately use HMTM if it is
      approved. Second are prescriber and trial-channel users: neurologists, memory-clinic teams,
      principal investigators, and site networks that decide whether the therapy gets tested,
      discussed, and potentially prescribed. Third are payers and access gatekeepers such as the
      NHS, NICE, and equivalent reimbursement bodies that determine whether clinical interest can
      convert into funded use.

      TauRx’s own site architecture supports that segmentation. Separate surfaces exist for patients
      and carers, medical professionals, media, and education or advocacy resources, which implies
      the company is already building distinct communications for different adoption audiences.
      However, these are still readiness and education surfaces, not evidence of recurring revenue
      relationships.

      The practical implication is that the current chapter should be read as a funnel of stakeholder
      engagement rather than as proof of commercial scale. TauRx has real pre-commercial audience
      proof, but it does not yet have a public customer ledger.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Trial enrollment and stakeholder engagement are the main proof of adoption today
    body: >-
      The strongest public evidence that real people and institutions are willing to use or support
      TauRx’s product comes from clinical participation. The 2026 LUCIDITY publication and related
      coverage describe a 598-participant Phase 3 trial conducted across 82 sites in Canada, the
      European Union, the United Kingdom, and the United States. That is meaningful adoption proof
      in a pre-commercial biotech: it means sites agreed to run the study, investigators agreed to
      recruit into it, and patients agreed to enter a long-duration program around a contested but
      scientifically differentiated Alzheimer’s therapy.

      TauRx also points to a broader evidence base involving more than 3,000 participants across HMTM
      trials. That matters for customer diligence because pre-commercial trust in neurology depends
      heavily on whether the product has been exposed to real patients under rigorous follow-up. In
      addition, the company’s patient-education pages, media pages, and advocacy material indicate an
      active effort to cultivate awareness among future users, carers, and journalists.

      None of this equals commercial deployment, but it is stronger than a purely preclinical story.
      TauRx has real-world engagement from patients, carers, investigators, and external audiences;
      it just has not yet proven post-approval conversion.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: durability-and-expansion
    title: Retention, expansion, and concentration remain mostly unproven
    body: >-
      The largest gap in TauRx’s customer picture is durability. There is no public NRR, GRR, churn,
      renewal, or prescription-persistence dataset because HMTM is not marketed. Any claim about user
      retention must therefore be proxied through continuity of public engagement, repeat trial work,
      and the persistence of the patient-education ecosystem. That is directionally useful but much
      weaker than true commercial retention evidence.

      Concentration risk is clear even without revenue disclosure. TauRx currently depends on a small
      number of stakeholder channels: specialist memory-clinic investigators, UK and likely future
      ex-UK regulators, and eventually a concentrated payer set. In the UK specifically, even an
      approved therapy must still navigate value-for-money pressure in a market where NICE has pushed
      back on anti-amyloid drugs. That means future customer acquisition is not just a clinician
      problem but a payer-conversion problem.

      Expansion logic exists if the product wins approval. TauRx can point to adjacent user groups in
      MCI, mild to moderate Alzheimer’s disease, and other tauopathies, plus the advantage of an oral
      route that could widen the prescriber base beyond infusion-capable centers. But expansion is
      still hypothetical until a funded access pathway exists.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
  - id: verdict
    title: Customer verdict for TauRx
    body: >-
      TauRx has better pre-commercial customer proof than many clinical-stage biotechs because its
      core program has already touched a large, multinational patient and investigator network.
      Patient and carer education surfaces also suggest the company is serious about building demand
      and comprehension around early Alzheimer’s intervention. These are real strengths.

      The counterweight is that every commercially decisive customer metric is still missing. There is
      no proof of payer conversion, no named production deployments in routine care, no real-world
      persistence data, no revenue concentration disclosure, and no visible post-approval partner or
      distribution structure. The product therefore has adoption readiness but not customer-model
      maturity.

      The right conclusion is that TauRx should be scored as promising on pre-commercial engagement,
      promising on channel fit if approval is won, and high risk on durability until payer and
      prescription evidence appears.
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]

