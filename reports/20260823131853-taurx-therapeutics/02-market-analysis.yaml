- id: buyers-users-and-care-pathway
  title: Buyers, users, and care pathway
  body: 'The end user of any TauRx product would be an individual living with early-stage Alzheimer’s disease or MCI due to Alzheimer’s disease, but the economic buyer is usually a public or private payer and the operational buyer is a neurologist-led health system. That distinction is already visible in the anti-amyloid market. The FDA labels for Leqembi and Kisunla target patients with mild cognitive impairment or mild dementia stage of Alzheimer’s disease, yet treatment adoption depends on far more than a prescription. Confirmatory biomarker testing, memory-service referral, infusion-center availability, MRI monitoring, and payer coverage all shape access. Lilly’s own approval release is explicit that Medicare coverage and patient cost exposure are central commercialization issues.


    This creates a structurally different opportunity for an oral therapy. TauRx’s FAQ and company pages repeatedly argue that HMTM could fit within existing health and social care systems because it is a tablet and, in the company’s telling, does not require infusions or intensive safety monitoring. GlobalData independently makes the same commercial point: an oral tau-targeting medicine could be easier to incorporate into standard care pathways than infusion-based anti-amyloid antibodies, especially for patients and caregivers facing logistical burden.


    Still, the care pathway remains specialist-mediated. Patients first present with memory concerns, are referred into memory or neurology services, undergo cognitive testing, and increasingly face biomarker confirmation expectations. TauRx’s own MCI materials emphasize that early diagnosis is critical. So while the user is the patient and caregiver, the real market interface is a diagnosis-and-reimbursement chain involving primary care referral, specialist workup, regulator approval, and payer acceptance. That means market penetration depends as much on pathway simplification as on raw efficacy.'
