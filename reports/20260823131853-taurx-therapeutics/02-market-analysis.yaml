- id: sizing-lenses-and-implications-for-taurx
  title: Sizing lenses and implications for TauRx
  body: 'A disciplined sizing view requires multiple lenses rather than one broad TAM number. The broadest lens starts with global dementia prevalence, but that is only a public-health burden proxy. A second, tighter lens is Alzheimer’s disease as the dominant dementia subtype. A third lens narrows again to the early symptomatic population that resembles the labeled anti-amyloid market and TauRx’s own target filing population. A fourth lens asks whether those patients sit inside health systems willing to diagnose, monitor, and reimburse treatment. By the time the market is constrained that far, the near-term commercial opportunity is much smaller than “55 million people.”


    Commercial precedent helps frame monetization. Leqembi sales reached $168 million globally in Q1 2026 and Eisai now guides to roughly $900 million in fiscal 2026 revenue, which shows real demand despite pathway friction. Kisunla’s label and pricing examples show that payer cost and course-of-therapy economics are active issues from day one. These data points imply that a successful TauRx product would not need to capture a large share of total Alzheimer’s prevalence to become economically meaningful, but it would need to earn reimbursement confidence and a distinct place in the treatment algorithm.


    For TauRx specifically, the most realistic market thesis is not immediate mass-market penetration. It is targeted uptake among early-stage patients, caregivers, and clinicians who want disease-modifying treatment but prefer an oral option that may fit existing workflows better than infusion antibodies. The biggest market risk is that the evidence bar set by payers and regulators remains high enough that prevalence never converts into reimbursed adoption at scale. The biggest upside is that a first approved oral tau therapy could expand the practical treatment market by reducing operational burden for both providers and patients.'
