company:
  name: TauRx Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: TauRx Therapeutics is a Singapore-rooted, Aberdeen-operated private biotechnology company built around Claude Wischik’s multi-decade tau-aggregation research program. Its operating story is unusually concentrated around a single clinical asset, hydromethylthionine mesylate (HMTM), a late-stage oral tau aggregation inhibitor now under UK review, while its capital history remains mostly private apart from third-party databases that show $434 million of disclosed funding and a $2.5 billion unicorn valuation. The company’s identity is credible and long-lived, but governance, headcount, current revenue, and the exact provenance of its latest valuation remain materially under-disclosed.
sections:
- id: identity-and-roots
  title: Identity, roots, and corporate footprint
  body: 'TauRx presents itself as a neurodegeneration company created specifically to commercialise decades of tau biology work that began in Claude Wischik’s academic research. Official company materials, the clinical protocol, and third-party company databases consistently place the origin story in Singapore in 2002, while also showing that the scientific and operating center of gravity sits in Aberdeen, Scotland. That dual geography matters: Singapore appears to anchor legal identity, investor relations, and the formal sponsor address in the LUCIDITY protocol, whereas Aberdeen hosts the operational location, university-linked research base, and most of the visible scientific leadership.


    The company’s mission is unusually focused and has not drifted far from the founding thesis. TauRx says it exists to discover, develop, and commercialise products for neurodegenerative diseases caused through protein aggregation, with tau aggregation inhibitors as the core platform. Its materials repeatedly frame HMTM as the potential first oral disease-modifying tau therapy for Alzheimer’s disease, and adjacent pages extend the platform concept into frontotemporal dementia and other tauopathies. That gives later chapters a stable identity anchor: TauRx is not a diversified biotech portfolio company, but rather a long-duration single-platform company whose corporate narrative, regulatory effort, and financing story are all tied to proving a tau-first Alzheimer’s thesis.


    The public footprint also shows a company still acting like a private late-stage biotech rather than a commercial pharmaceutical business. The website is rich in medical-education, advocacy, and investor-relations language, yet light on product revenues, commercial infrastructure metrics, or formal securities disclosure. That asymmetry is consistent with a company nearing a potential first approval event but still dependent on private funding and regulatory outcomes rather than marketed-product cash flow.'
