- id: capital-history-and-investor-base
  title: Capital history, investor base, and valuation visibility
  body: 'The clearest public funding chronology comes from Tracxn rather than from TauRx itself. That database reports six disclosed rounds totaling roughly $434 million, beginning with a $20 million Series A in 2011, followed by two Series B rounds in 2012 and 2013, two large Series D rounds in 2015 and 2016, and a $119 million Series E in November 2022. Tracxn also identifies Dundee Corporation and Genting Singapore as early lead backers and classifies TauRx as a Series E company with unicorn status. TauRx’s own investor page is directionally consistent with that picture, emphasizing longstanding support from global investors and continuing openness to accredited-investor engagement, but it does not publish cap-table, round-pricing, or proceeds detail.


    Valuation visibility is materially weaker than funding visibility. The most explicit public figure is Tracxn’s $2.5 billion valuation and unicorn label. However, TauRx does not itself disclose that figure on the corporate site, and the exact public provenance of any late-2025 secondary transaction remains limited. As a result, the best diligence framing is that a credible third-party data platform places TauRx at approximately $2.5 billion, but the exact round mechanics, share class, and whether the figure reflects a primary round, secondary transfer, or platform-imputed post-money estimate are not publicly verifiable from company disclosures.


    This matters because TauRx is now late-stage, private, and pre-commercial. A company in that position can look inexpensive or expensive depending on whether one underwrites HMTM as an approval-proximate platform with global optionality or as a single-asset biotech still carrying regulatory and efficacy controversy. Without audited revenue, cash, runway, or preference-stack disclosure, the funding history establishes durability and investor willingness to continue support, but it does not remove financing risk.'
