  - id: TI004
    title: Capital adequacy table
    columns: [Signal, Public evidence, What it says, What it does not say, Implication]
    rows:
      - [Singapore paid-up capital, USD 103.25M at TauRx Therapeutics Ltd, Shows substantial formal capitalization, Does not equal current cash, Helpful but insufficient]
      - [UK share allotment, 2025 SH01 statement of capital GBP 470286982, Shows continuing equity actions in UK entity, Does not disclose cash inflow use or cash left, Suggests ongoing financing flexibility]
      - [2021 rights issue, $64M reported by Pharmaphorum, Confirms prior insider support, No detail on burn since then, Positive historical support]
      - [2022 warrant exercise, About $119M reported by Pharmaphorum, Confirms investors funded post-data push, No current runway figure, Key late-stage financing datapoint]
      - [Tracker funding total, About $434M total disclosed funding on Tracxn, Shows long-duration capital base, Not audited and may exclude private terms, Supports view that company has been heavily financed]
      - [Current cash, null, Unknown, Core balance sheet item missing publicly, Primary diligence blocker]
    notes: Filing evidence is useful for capitalization context but not a substitute for consolidated cash and burn disclosure.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024, CI025]
  - id: TI005
    title: Public financial gaps table
    columns: [Missing metric, Why it matters, Current public status, Diligence path]
    rows:
      - [Consolidated cash balance, Determines runway and raise urgency, Not publicly disclosed, Request latest balance sheet]
      - [Monthly burn by function, Distinguishes trial spend from corporate overhead, Not publicly disclosed, Request monthly burn bridge]
      - [HMTM price assumption, Needed for revenue and payer modeling, Not publicly disclosed, Request launch price corridor by territory]
      - [Manufacturing economics, Drives gross margin and working capital, Not publicly disclosed, Request CMO structure and unit cost]
      - [Partnering status, Could reduce financing dependency, Not publicly disclosed, Request active BD discussions and term status]
      - [Any 2025 or 2026 financing after public reports, Central to dilution analysis, Not publicly confirmed, Request cap-table and financing chronology update]
    notes: The chapter’s financial uncertainty is driven more by absent private metrics than by lack of historical fundraising signals.
    claimRefs: [CI026, CI029, CI030, CI031, CI032, CI035]
