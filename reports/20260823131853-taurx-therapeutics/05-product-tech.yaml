  claims:
    - { id: CE001, statement: TauRx’s public product story is centered overwhelmingly on HMTM rather than on a broad multi-asset portfolio., type: observed, topic: product-definition, sourceRefs: [SE001, SE015, SE018], confidence: high, freshness: current, answersQuestionRefs: [QE001, QE002] }
    - { id: CE002, statement: HMTM is positioned for use in mild cognitive impairment due to Alzheimer’s disease and mild to moderate Alzheimer’s dementia., type: observed, topic: product-definition, sourceRefs: [SE010, SE011, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE001] }
    - { id: CE003, statement: TauRx frames HMTM as an accessible oral therapy that could fit routine specialist workflows more easily than infused competitors., type: company-claimed, topic: workflow, sourceRefs: [SE010, SE012, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE003, QE011] }
    - { id: CE004, statement: Public materials also position frontotemporal dementia and wider tauopathies as adjacent opportunity areas., type: observed, topic: asset-map, sourceRefs: [SE017, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE004] }
    - { id: CE005, statement: Those adjacent areas look like lifecycle or platform optionality rather than independent near-term commercial product lines., type: inferred, topic: asset-map, sourceRefs: [SE017, SE025], confidence: medium, freshness: current, answersQuestionRefs: [QE002, QE004] }
    - { id: CE006, statement: The intended use path starts with early patient identification and then oral longitudinal treatment rather than episodic infusion administration., type: inferred, topic: workflow, sourceRefs: [SE010, SE012, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE003] }
    - { id: CE007, statement: TauRx’s product package includes educational surfaces for specialists and patients in addition to the molecule itself., type: observed, topic: product-definition, sourceRefs: [SE012, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE001] }
    - { id: CE008, statement: The company is therefore best viewed as a lead-asset therapeutic program supported by a disease-education and biomarker evidence stack., type: inferred, topic: product-definition, sourceRefs: [SE001, SE002, SE015, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE002] }
    - { id: CE009, statement: Product concentration is high because HMTM in Alzheimer’s remains the central value driver., type: inferred, topic: product-definition, sourceRefs: [SE010, SE011, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE002] }
    - { id: CE010, statement: TauRx describes HMTM as a tau aggregation inhibitor that targets pathological tau biology., type: company-claimed, topic: mechanism, sourceRefs: [SE015, SE016], confidence: high, freshness: current, answersQuestionRefs: [QE005, QE006] }
    - { id: CE011, statement: The product’s technical differentiation is partly route based because it is formulated as an oral therapy rather than an infused antibody., type: observed, topic: mechanism, sourceRefs: [SE010, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE003, QE021] }
    - { id: CE012, statement: TauRx’s operating architecture is an evidence chain linking oral delivery, cognitive endpoints, imaging outcomes, and blood biomarkers., type: inferred, topic: architecture, sourceRefs: [SE002, SE003, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE007, QE008, QE012] }
    - { id: CE013, statement: The company has increasingly emphasized biomarker evidence including NfL and tau-associated measures to support the disease-modification narrative., type: observed, topic: biomarkers, sourceRefs: [SE002, SE003, SE004, SE013], confidence: high, freshness: current, answersQuestionRefs: [QE007, QE020] }
    - { id: CE014, statement: The 2026 LUCIDITY publication adds peer-reviewed imaging and blood biomarker results beyond headline efficacy claims., type: observed, topic: biomarkers, sourceRefs: [SE010, SE013], confidence: high, freshness: recent, answersQuestionRefs: [QE008, QE009, QE014] }
    - { id: CE015, statement: Company biomarker materials report substantial reduction in neurodegeneration markers in treated participants., type: company-claimed, topic: biomarkers, sourceRefs: [SE002, SE003, SE004], confidence: medium, freshness: current, answersQuestionRefs: [QE007] }
    - { id: CE016, statement: Earlier and current TauRx studies used methylthioninium chloride as a urinary colorant control to preserve blinding., type: observed, topic: design-risk, sourceRefs: [SE010, SE013, SE014], confidence: high, freshness: current, answersQuestionRefs: [QE010] }
    - { id: CE017, statement: Unexpected symptomatic activity in that control arm complicated intended primary analyses and remains central to criticism of the product package., type: observed, topic: design-risk, sourceRefs: [SE013, SE019, SE022], confidence: high, freshness: current, answersQuestionRefs: [QE009, QE010] }
    - { id: CE018, statement: Product credibility therefore depends on whether biomarker and long-term outcome evidence can overcome historical design criticism., type: inferred, topic: design-risk, sourceRefs: [SE013, SE019, SE020, SE022], confidence: high, freshness: current, answersQuestionRefs: [QE010, QE025] }
    - { id: CE019, statement: TauRx has progressed the product to a UK Marketing Authorisation Application, which is the strongest current readiness signal in the public record., type: observed, topic: trust, sourceRefs: [SE005, SE010, SE011], confidence: high, freshness: current, answersQuestionRefs: [QE013, QE015] }
    - { id: CE020, statement: TauRx states that it finalized responses to an MHRA information request during the review process., type: company-claimed, topic: trust, sourceRefs: [SE005], confidence: medium, freshness: current, answersQuestionRefs: [QE015, QE016] }
    - { id: CE021, statement: Peer-reviewed publication of LUCIDITY raises trust relative to a press-release-only evidence package., type: inferred, topic: trust, sourceRefs: [SE010, SE013], confidence: high, freshness: current, answersQuestionRefs: [QE013, QE014] }
    - { id: CE022, statement: The product also benefits from a very long development lineage with prior phase 3 studies and registrations still visible in public records., type: observed, topic: roadmap, sourceRefs: [SE008, SE009, SE014, SE021], confidence: medium, freshness: historical, answersQuestionRefs: [QE018] }
    - { id: CE023, statement: ClinicalTrials registrations and TauRx’s trials page together show continuity across historical and current development-stage work., type: observed, topic: roadmap, sourceRefs: [SE001, SE007, SE008, SE009], confidence: high, freshness: current, answersQuestionRefs: [QE018] }
    - { id: CE024, statement: Trust is still regulatory rather than commercial because no approved label yet converts the evidence package into routine-care legitimacy., type: inferred, topic: trust, sourceRefs: [SE005, SE010, SE011], confidence: high, freshness: current, answersQuestionRefs: [QE013, QE017] }
    - { id: CE025, statement: Product maturity is therefore high in accumulated evidence but only moderate in undisputed registrational clarity., type: inferred, topic: maturity, sourceRefs: [SE013, SE014, SE019, SE022], confidence: medium, freshness: current, answersQuestionRefs: [QE017] }
    - { id: CE026, statement: The roadmap is dominated by MHRA review and potential follow-on jurisdictional filings rather than by new product-line launches., type: inferred, topic: roadmap, sourceRefs: [SE005, SE011], confidence: medium, freshness: current, answersQuestionRefs: [QE015, QE017] }
    - { id: CE027, statement: A regulator-endorsed label is the step that would turn scientific maturity into real commercial readiness., type: inferred, topic: roadmap, sourceRefs: [SE010, SE019, SE024], confidence: medium, freshness: current, answersQuestionRefs: [QE017, QE025] }
    - { id: CE028, statement: TauRx’s clearest product differentiators are oral administration, tau-targeting focus, and a long clinical evidence base., type: inferred, topic: differentiation, sourceRefs: [SE010, SE015, SE016, SE021], confidence: high, freshness: current, answersQuestionRefs: [QE021, QE025] }
    - { id: CE029, statement: The route-of-administration advantage directly addresses a real workflow pain point left by infused anti-amyloid therapies., type: inferred, topic: differentiation, sourceRefs: [SE010, SE012, SE015], confidence: medium, freshness: current, answersQuestionRefs: [QE003, QE011, QE021] }
    - { id: CE030, statement: The product system is highly dependent on regulators accepting a nonstandard evidence history., type: inferred, topic: dependencies, sourceRefs: [SE005, SE019, SE022], confidence: high, freshness: current, answersQuestionRefs: [QE019] }
    - { id: CE031, statement: It is also dependent on biomarker interpretation carrying enough persuasive power with clinicians and regulators., type: inferred, topic: dependencies, sourceRefs: [SE002, SE003, SE013], confidence: medium, freshness: current, answersQuestionRefs: [QE019, QE020] }
    - { id: CE032, statement: TauRx has not publicly disclosed detailed real-world adherence or long-term monitoring protocols because the product is not yet marketed., type: observed, topic: dependencies, sourceRefs: [SE012, SE015], confidence: high, freshness: current, answersQuestionRefs: [QE023] }
    - { id: CE033, statement: If HMTM wins approval soon TauRx gains a meaningful first-mover advantage in oral tau-targeted disease modification., type: inferred, topic: durability, sourceRefs: [SE011, SE015, SE021], confidence: medium, freshness: current, answersQuestionRefs: [QE025] }
    - { id: CE034, statement: If approval is delayed the durability of that advantage erodes as other tau programs accumulate data and incumbents reduce administration burden., type: inferred, topic: durability, sourceRefs: [SE019, SE020, SE021, SE022], confidence: medium, freshness: current, answersQuestionRefs: [QE021, QE025] }
    - { id: CE035, statement: Product durability for TauRx therefore hinges more on timely regulatory conversion than on technical novelty alone., type: inferred, topic: durability, sourceRefs: [SE019, SE024], confidence: high, freshness: current, answersQuestionRefs: [QE021, QE025] }
