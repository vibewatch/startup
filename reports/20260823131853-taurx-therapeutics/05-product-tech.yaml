    title: Product architecture map
    type: stack
    layout: standard
    summary: Maps the layers that make HMTM a product rather than only a molecule.
    data:
      layers:
        - label: Mechanism layer
          detail: Tau aggregation inhibitor mechanism aimed at pathological tau biology.
        - label: Delivery layer
          detail: Oral chronic-dosing format positioned for standard specialist prescribing rather than infusion-center administration.
        - label: Evidence layer
          detail: Cognitive endpoints plus imaging and blood biomarkers including NfL and tau-related measures.
        - label: Regulatory layer
          detail: MHRA review package built from LUCIDITY and earlier phase 3 data.
