callouts:
  - calloutType: risk
    title: Execution remains the thesis-breaker
    body: >-
      Botshare is trying to scale from event rentals into industrial operations while the sector still shows
      pilot-like real-world readiness and falling spot pricing, so uptime and service economics matter more
      than top-of-funnel demand.
    claimRefs: [CR008, CR013, CR015]
  - calloutType: risk
    title: Insurance helps, but it is not the same as mature controls
    body: >-
      Public evidence shows insurance, operators, and early claims processing, yet the retained source set
      still lacks direct proof of published certifications, incident reporting, or standardized data-rights controls.
    claimRefs: [CR002, CR004, CR009, CR012]
  - calloutType: recommendation
    title: Diligence should force proof of partner concentration and industrial SLAs
    body: >-
      The round is hard to underwrite without city-level repair coverage, partner fallback terms, industrial
      repeat-use metrics, and margin data at today's lower rental prices.
    claimRefs: [CR005, CR010, CR011, CR014]
