callouts:
  - calloutType: insight
    title: "Operational service, not generic robotics, is the real market wedge"
    body: "The assigned sources consistently describe demand as a bundle of robot access, dispatch, maintenance, insurance, and recovery. That means Botshare competes on fulfillment quality and local service density before it competes on hardware novelty."
    claimRefs: [CM004, CM012, CM013]
  - calloutType: risk
    title: "Headline TAM can hide fast price commoditization"
    body: "Broad robotics growth does not prevent rental-margin compression. The Sohu evidence suggests commercial-performance pricing is falling quickly, so value creation must come from utilization and service operations rather than simple inventory brokerage."
    claimRefs: [CM007, CM011, CM012]
