              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are broadening, but public proof still starts with event-led demand
        blocks:
          - type: paragraph
            body: >-
              The public evidence base points to an adoption path that starts with low-commitment, visible use cases and
              is trying to move toward recurring operating scenarios. Xinhua described Botshare as offering standardized
              rentals across more than 10 scenarios, from weddings to exhibitions, which fits the broader sector
              evidence that short-duration events and commercial activations remain the easiest entry point for buyers
              who do not want to own fast-depreciating hardware. At the same time, Chinese-language financing and
              channel coverage says the company is trying to push beyond one-off event rentals into store service,
              commercial operations, warehousing/logistics, industrial support, and park operations. That means the
              buyer base is widening from marketers and event organizers toward operators who care more about uptime,
              service levels, and repeatable delivery than about novelty alone.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
      - number: '6.2'
        title: Public adoption metrics emphasize network breadth and operating readiness more than realized demand
        blocks:
          - type: paragraph
            body: >-
              Botshare's disclosed traction is strongest on the supply side of the marketplace. Independent reporting
              tied the platform to 50 cities, more than 1,000 devices, and more than 600 service providers by early
              2026, while a separate June 2026 sector article cited another large rental platform with more than 4,000
              schedulable robots across more than 100 cities. Those data points show a market that can assemble
              inventory and service coverage quickly, but they are not the same as a disclosed active-customer, renewal,
              or utilization base. The public operating story therefore leans heavily on the machinery around
              fulfillment—delivery, scheduling, repair, insurance, and recycling—because that is what determines whether
              Botshare can convert episodic demand into repeatable RaaS relationships.
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU004
              - CU006
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU010
              - CU012
              - CU013
      - number: '6.3'
        title: Named proof is concentrated in counterparties and operational plumbing, not end-customer references
        blocks:
          - type: paragraph
            body: >-
              The clearest named public proof around Botshare today comes from counterparties rather than from a roster
              of disclosed enterprise accounts. Chinese-language reporting says JD signed a comprehensive strategic
              cooperation with 擎天租 covering online transactions, offline delivery, supply-chain coordination, and
              operating services, and that the platform opened a JD flagship store for scenarios such as education,
              guidance, and cleaning. The strongest operational validation comes from insurance activity: Jiemian
              reported that Botshare and PICC completed one of China's first embodied-robot insurance claims, with more
              than 1,000 robots on the platform insured and aggregate coverage above RMB 200 million. That is meaningful
              proof of in-field usage, but it is still not the same as public disclosure of named repeat buyers,
              contract duration, or expansion rates.
            claimRefs:
              - CU005
              - CU010
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU011
              - CU012
      - number: '6.4'
        title: Durability is still the main open question because novelty demand and price compression remain visible
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this pool does not show a collapse in demand, but it does show why customer
              durability remains the core diligence issue. Xinhua said repeat customers are still rare in China's
              robot-rental market and that much of today's demand is tied to novelty and entertainment use cases rather
              than stable operational service. The same reporting described sharp price correction, with Botshare
              offering entry rentals from RMB 1,499 per day and some daily rents down more than 40% from earlier peaks.
              The Wuhan-finance-hosted Securities Daily article also stressed that large-scale adoption needs insurance,
              incident handling, and data security controls because rental platforms carry meaningful transport,
              liability, and uptime risk. Public sources reviewed here still do not disclose churn, renewal,
              top-customer concentration, or cohort behavior, so those remain explicit diligence asks rather than
              inferable strengths.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Supply-side readiness is easier to verify than account durability
            body: >-
              The strongest public proof today is a service-and-risk stack—cities covered, devices listed, provider
              count, insured fleet, and named operating partners—rather than a disclosed book of repeat enterprise
              accounts.
            calloutType: insight
            claimRefs:
              - CU002
              - CU012
          - type: callout
            title: Repeat-use economics remain the decisive diligence question
            body: >-
              Independent reporting says repeat customers are still rare and pricing has corrected sharply, so the real
              test is whether Botshare can move beyond event-led demand into recurring operational deployments without
              destroying unit economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked overview
        blocks:
          - type: paragraph
            body: >-
              The core investment risk is execution against an aggressive scope expansion. Independent coverage says
              Botshare is already operating across 50 cities with more than 1,000 devices and wants to reach 200+ cities
              while serving 400,000 rental customers, and Crunchbase says the company reached a $1 billion valuation
              while looking to move from event rentals into warehousing, logistics, and park operations. That is a large
              operating promise layered on top of a business where Sohu reports rental pricing has already compressed
              sharply, while IFR says real-world production scenarios for humanoid robots remain limited to
              demonstrators or pilot projects and wide factory adoption is not imminent. The practical read-through is
              that Botshare must prove repeatable uptime, maintenance turnarounds, and industrial customer ROI faster
              than the market commoditizes event-style rentals. Thesis-break triggers are straightforward: no disclosed
              industrial SLA proof, no evidence that repair coverage scales with deployment density, or further
              valuation inflation without better revenue, utilization, and margin disclosure.
            claimRefs:
              - CR003
              - CR008
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR008
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Controls versus exposure
        blocks:
          - type: paragraph
            body: >-
              The retained public record shows mitigation intent, but it does not yet show a mature control stack.
              Botshare's own published roadmap says it plans a "Safety and Compliance Tracker" and RaaS contract
              management tools, while independent reporting says the platform offers insurance services and trained
              operators and has already completed early embodied-robot insurance claims. Those are useful signals, but
              they are not substitutes for published certifications, incident logs, named regulator approvals, or
              detailed service-level and data-rights controls. The gap matters because Sohu describes robot rental as an
              operationally heavy business where falls, collisions, joint wear, battery faults, and cosmetic damage are
              common enough to require logistics, repair, insurance claims, and asset recovery workflows. The same
              report says data collection is part of the JD cooperation scope and warns that the value of that data
              still depends on collection authorization, task definition, labeling quality, and cleaning standards.
              Until those controls are evidenced directly, safety/liability and data-governance risk should stay near
              the top of the diligence stack.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR009
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Dependency, economics, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Botshare also carries concentrated dependency and business-model risk. Sohu says JD's cooperation spans
              rental, global logistics, repair, insurance, recycling, secondary development, and data collection, while
              TechNode says JD is separately building a robot-ambulance repair network that covers diagnosis, battery
              replacement, testing, certification, and recycling, with planned expansion to 50+ cities. That suggests
              Botshare's service promise may depend materially on third-party infrastructure that it does not fully
              control. Meanwhile, the same Sohu reporting shows daily rental prices have fallen well below 2025 peaks,
              meaning Botshare likely needs higher utilization and faster service recovery just to defend contribution
              margins. Financing coverage from Crunchbase and Sina shows capital availability and a push into
              industrial, warehousing, and park scenarios, but neither retained public source discloses the unit
              economics, loss ratios, top-partner revenue exposure, or customer concentration needed to underwrite that
              pivot confidently. A practical kill criterion is simple: if management cannot show partner concentration,
              repair-response SLAs, and industrial repeat-use metrics, the downside case should assume scale amplifies
              complexity rather than margins.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution remains the thesis-breaker
            body: >-
              Botshare is trying to scale from event rentals into industrial operations while the sector still shows
              pilot-like real-world readiness and falling spot pricing, so uptime and service economics matter more than
              top-of-funnel demand.
            calloutType: risk
            claimRefs:
              - CR008
              - CR013
              - CR015
          - type: callout
            title: Insurance helps, but it is not the same as mature controls
            body: >-
              Public evidence shows insurance, operators, and early claims processing, yet the retained source set still
              lacks direct proof of published certifications, incident reporting, or standardized data-rights controls.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR009
              - CR012
          - type: callout
            title: Diligence should force proof of partner concentration and industrial SLAs
            body: >-
              The round is hard to underwrite without city-level repair coverage, partner fallback terms, industrial
              repeat-use metrics, and margin data at today's lower rental prices.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The financing mark is visible; investable value is not
        blocks:
          - type: paragraph
            body: |-
              Gasgoo and Cover News reported A and A+ financing worth hundreds of
              millions of yuan and a post-financing valuation of RMB 7 billion, while
              Crunchbase separately listed a $1 billion Series A valuation. These are
              financing-round markers, not audited evidence of intrinsic value, cash
              available, or a realizable secondary price. None of the retained sources
              supplies audited revenue, gross margin, utilization, retention, burn, a
              fully diluted cap table, or preference terms. That asymmetry makes the
              decision straightforward: keep Botshare in active diligence, but do not
              issue a buy recommendation or a precise return target from the public
              record. Entry discipline should be tied to verified unit economics and
              financing rights, not to the unicorn label.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Early network proof meets service intensity and price compression
        blocks:
          - type: paragraph
            body: |-
              The thesis is that a young platform has already assembled reported
              network scale, insured deployments, and a path from event rentals toward
              warehousing, logistics, and park operations. Those signals make the RaaS
              model worth investigating. The anti-thesis is equally concrete. Sohu
              reported sharp rental-price compression and argued that logistics,
              on-site service, maintenance, insurance, and recovery increasingly
              determine platform economics. JD's planned repair expansion shows that
              enabling infrastructure is forming, but a three-year rollout also
              indicates that nationwide service density is not a finished asset.
              Botshare therefore has to prove that service attachment and utilization
              can offset falling rental spreads rather than merely add operating cost.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: Scenario upside depends on milestones, not headline peer marks
        blocks:
          - type: paragraph
            body: |-
              Crunchbase's May 2026 robotics cohort supplies context rather than a clean
              comparable set: Hark, Tianji, Agilink, and Botshare had different products,
              stages, round structures, and disclosed operating evidence. Their private
              marks cannot be converted into a defensible revenue multiple for Botshare.
              The bull case requires repeat industrial cohorts and improving service
              economics; the base case leaves fair value indeterminate until those
              metrics appear; the bear case applies a discount to the reported mark if
              price compression and long commercialization timelines persist. IFR's
              warning that real-world humanoid production remains largely at
              demonstrator or pilot stage supports that downside discipline. No precise
              probability-weighted range is supportable from the assigned evidence.
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness is low until identity, economics, and rights are reconciled
        blocks:
          - type: paragraph
            body: |-
              Public evidence does not identify an IPO, strategic-sale, or secondary
              pathway, and it does not disclose the rights needed to model proceeds to
              a new investor. Source identity also needs care: the assigned
              botshare.solutions URL resolves to a robotics R&D studio led by Alex
              Reznichenko, not to the Pudong leasing platform described by Gasgoo and
              Crunchbase, so it cannot be used as target-company operating proof.
              Final diligence should confirm the financed legal entity, reconcile the
              cap table and preference stack, inspect audited cohort economics, and
              obtain customer-level evidence for recurring industrial deployments.
              Thesis-break triggers are sustained rental-price compression without
              service-margin improvement, failure to convert pilots into repeat
              contracts, or financing terms that eliminate venture-scale downside
              protection.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research more. A buy call requires audited unit economics, fully diluted entry terms, and repeat
              industrial deployment evidence, or a price below the reported financing mark that compensates for those
              gaps.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: callout
            title: Do not confuse a round mark with realizable value
            body: >-
              The reported RMB 7 billion and $1 billion figures describe private financing valuations; they do not
              establish cash available, liquidation proceeds, or an executable secondary price.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
