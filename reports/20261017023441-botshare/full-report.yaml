              - CP014
              - CP016
      - number: '3.2'
        title: Capability depth and pricing pressure are moving the market
        blocks:
          - type: paragraph
            body: >-
              Public comparisons show Botshare has early distribution momentum, but the market is becoming harder to
              defend on catalog breadth alone. ChinaBiz Insider says Botshare coordinates more than 600 service
              providers and 1,000 robots across 50 cities, and it has used very low public entry pricing, including
              app-based offers starting at RMB200 per day and a RMB1 flash-rental promotion. Those tactics can
              accelerate adoption, but China Daily and Sohu both indicate the whole market is repricing downward: daily
              rates that had been above RMB10,000 during earlier event spikes are now closer to RMB4,000 for mainstream
              humanoids, with some published quotes even lower for simpler robot categories. That compresses room for
              pure brokerage margins and shifts the basis of competition toward repair coverage, logistics, insurance,
              and the ability to turn one-off event demand into repeat operating contracts.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
      - number: '3.3'
        title: Botshare's moat exists only if neutrality and execution hold
        blocks:
          - type: paragraph
            body: >-
              The strongest disconfirming evidence is not that Botshare lacks demand, but that its moat may narrow as
              the market professionalizes. ChinaBiz Insider argues that Botshare's governance and inventory mix can make
              the platform look like a Zhiyuan-controlled channel rather than neutral infrastructure, which matters if
              Unitree, Fourier, or other OEMs prefer direct channels or competing platforms. At the same time, JD is
              building a repair and recycling network that stretches beyond simple listing aggregation, and both
              Qingtianzu and Botshare are publicly steering toward warehousing, logistics, park operations, and other
              recurring-use scenarios. Xinhua's report on China's new humanoid robotics standards adds another layer: as
              safety, application, and lifecycle requirements become more explicit, the winners should be operators that
              can combine supplier breadth with repeatable compliance and field service, not just those that can clear
              inventory at a low sticker price.
            claimRefs:
              - CP006
              - CP008
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Service stack is becoming the moat
            body: >-
              The decisive contest is moving from "who can list a robot" to "who can keep a robot delivered, repaired,
              insured, and economically useful across repeat scenarios."
            calloutType: insight
            claimRefs:
              - CP007
              - CP008
              - CP016
          - type: callout
            title: Neutrality may cap supplier breadth
            body: >-
              If rival OEMs see Botshare as a Zhiyuan-controlled channel rather than neutral infrastructure, they have
              incentives to prioritize direct channels or other platforms.
            calloutType: risk
            claimRefs:
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >
              Public evidence suggests BotShare is not a thin marketplace so much as a service-heavy robot deployment
              platform. Pandaily reported that the company is using fresh capital to build a nationwide fulfillment and
              service network plus asset-management and dispatch systems, while Sohu said its JD cooperation spans
              rental, logistics, maintenance, insurance, recycling, secondary development, and data collection. That
              means revenue likely comes from the rental transaction plus bundled fulfillment and service layers, not
              just simple listing fees. The public traction signals are real but incomplete: Pandaily reported more than
              5,500 orders, over 3,000 robots available for dispatch, and more than 20,000 applicants for the
              city-partner program, while Crunchbase said the company wants to expand from event rentals into
              warehousing, logistics, and park operations. Those indicators show activity and strategic ambition, but
              not realized revenue quality.
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI014
          - type: table
            tableRef: TI001
