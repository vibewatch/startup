              - CO004
              - CO013
              - CO014
              - CO015
          - type: callout
            title: Public disclosure still lags the valuation step-up
            body: >-
              Public evidence supports a May 2026 unicorn valuation, but not a fully reconciled cap table, audited
              financial profile, disclosed customer base, or visible board structure.
            calloutType: risk
            claimRefs:
