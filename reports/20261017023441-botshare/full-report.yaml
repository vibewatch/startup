  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is narrower than 'robotics' and broader than one-off event rentals.
              Independent reporting frames Botshare as a robot-leasing and RaaS platform that began in event, retail,
              office, and education scenarios, then redirected its expansion thesis toward warehousing, park operations,
              and industrial services. That matters because the buyer is not only paying for a machine; the real product
              includes dispatch, setup, maintenance, insurance, and retrieval. The practical substitute set therefore
              includes temporary staffing, manual on-site operations, and in-house fleet management rather than only
              robot OEM capex.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
