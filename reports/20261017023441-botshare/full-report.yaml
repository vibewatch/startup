              - CI008
              - CI012
              - CI014
      - number: '4.2'
        title: Cost structure and unit economics proxies
        blocks:
          - type: paragraph
            body: >
              The best public clue on BotShare's economics is that robot rental appears operationally heavy. Sohu
              explicitly argued the business does not end when a robot is booked; platforms still need to coordinate
              cross-city dispatch, on-site service, repair, insurance claims, and asset recovery. That matters because
              the same article also described falling market prices: rental demand is rising, but daily pricing has come
              down sharply from earlier scarcity levels. TechNode's reporting on JD's robot ambulance rollout and
              Jiemian's reporting on peer-platform insurance claims both reinforce the same conclusion: cost of service
              includes downtime management, spare parts, field labor, insurance handling, and local coverage, so gross
              profit will hinge on utilization and execution discipline rather than headline demand alone. Publicly
              disclosed unit-economics inputs remain sparse, which makes margin underwriting the central diligence
              blocker.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI012
              - CI013
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI008
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >
              BotShare's financing story is clearer than its operating model economics. Pandaily reported more than RMB
              100 million of angel and angel+ financing within three months of founding, and Crunchbase later described
              Botshare as a May 2026 unicorn after a Series A while it pushed into warehousing, logistics, and park
              operations. Together with peer evidence from Sina showing several-hundred-million-RMB funding being used
              to build RaaS systems and industrial deployments, the implication is that category leaders are financing
              network build-out, service operations, and scenario expansion, not merely marketing. What is still missing
              is the investor's core underwriting pack: no retained public source disclosed BotShare's revenue, gross
              margin, cash balance, burn, CAC, payback, contract length, renewal, or customer concentration. The chapter
              verdict is therefore that demand formation looks credible, but capital adequacy cannot be judged from
              public disclosures alone.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI011
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital is funding operating infrastructure, not just lead generation
            body: >-
              The disclosed use of funds centers on fulfillment, dispatch, service, and expansion into repeat
              operational scenarios, which is consistent with a capital-intensive RaaS rollout rather than a
              software-light listing business.
            calloutType: insight
            claimRefs:
              - CI002
              - CI011
              - CI014
          - type: callout
            title: Public traction does not yet translate into public financeability
            body: >-
              Orders, deployable robots, and valuation are visible, but the retained public evidence still lacks audited
              revenue, margin, cash, and retention disclosures, so underwriting depends on management-room data that is
              not public.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What customers buy today
        blocks:
          - type: paragraph
            body: >-
              BOTSHARE is being sold to the market as an open robot-leasing platform, with a customer entry point
              centered on a WeChat mini program and JD.com distribution rather than a disclosed developer or API
              surface. The strongest public proof is concentrated in short-cycle commercial use cases: exhibitions,
              retail/tourism interactions, brand activations, celebrations, and education-oriented demos. That makes the
              current product definition closer to robot access plus deployment services than to a pure software product
              or vertically integrated robot OEM. Expansion into warehousing, logistics, parks, and industrial
              operations is visible in financing and roadmap coverage, but those heavier-duty scenarios look more like
              next-step expansion targets than a broadly evidenced installed base.
            claimRefs:
