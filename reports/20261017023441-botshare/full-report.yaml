  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and an industrial expansion thesis are outweighed by service intensity, commercialization timing,
      and disclosure gaps at the current mark.
    data:
      nodes:
        - id: financing-mark
          label: Unicorn financing mark
          detail: External reports cite RMB 7 billion and $1 billion round valuations.
        - id: early-scale
          label: Early operating scale
          detail: Gasgoo reports a network of more than 4,000 robots.
        - id: industrial-option
          label: Industrial expansion option
          detail: Coverage describes movement toward logistics, warehousing, and park operations.
        - id: price-pressure
          label: Rental price pressure
          detail: Reported day rates have declined as simple matching spreads narrow.
        - id: adoption-risk
          label: Commercialization timing risk
          detail: IFR says real-world humanoid production remains mostly demonstrator or pilot activity.
        - id: disclosure-gap
          label: Economics and rights undisclosed
          detail: Public evidence lacks audited unit economics, dilution, preferences, and exit terms.
        - id: research-more
          label: Research more
          detail: Require private evidence or a lower entry price before underwriting a return.
      edges:
        - from: financing-mark
          to: early-scale
          label: Price requires proof
        - from: early-scale
          to: industrial-option
          label: Creates expansion potential
        - from: industrial-option
          to: price-pressure
          label: Must overcome
        - from: price-pressure
          to: adoption-risk
          label: Compounds
        - from: adoption-risk
          to: disclosure-gap
          label: Raises evidence threshold
        - from: disclosure-gap
          to: research-more
          label: Determines decision
    approximationNotes: The flow is analytical and non-quantitative; it does not assign probabilities or derive fair value.
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
