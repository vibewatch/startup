        - More deployments without audited unit economics.
      - - Bear
        - Rental-price compression persists while industrial adoption remains pilot-heavy and service costs stay high.
        - Below the reported financing mark; the assigned evidence cannot quantify a downside floor.
        - Down-round, preference overhang, and weak operating leverage.
        - Falling day rates, delayed repeat contracts, or adverse financing terms.
    notes: >-
      These are qualitative underwriting bands anchored to reported financing marks; missing revenue, margin, dilution,
      and exit data preclude precise ranges or probabilities.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows Botshare moving from incorporation to financing, insurance, and JD-linked operating
      partnerships within roughly six months.
    data:
      items:
        - date: 2025-12-09T00:00:00.000Z
          label: Company incorporated
          detail: >-
            Sina reports Qingtianzu was registered on 2025-12-09 and described it as the first open robot-leasing
            platform.
          tone: neutral
          claimRefs:
            - CO001
        - period: 2025-12
          label: Insurance product introduced
          detail: >-
            Jiemian says Botshare and PICC launched embodied-robot insurance covering robot damage and third-party
            liability in December 2025.
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-03-18T00:00:00.000Z
          label: Angel and Angel+ deal logged
          detail: Boncast tracks an Angel plus Angel+ round with $14m disclosed.
          tone: positive
          claimRefs:
            - CO007
        - date: 2026-04-24T00:00:00.000Z
          label: First insurance claims reported
          detail: >-
            Jiemian says Botshare and PICC completed the first embodied-robot insurance claims, with 1,000+ insured
            robots and 200m+ yuan coverage.
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-05-20T00:00:00.000Z
          label: A and A+ financing reported
          detail: >-
            EqualOcean reports recent Series A and A+ rounds totaling several hundred million yuan at a 7bn-yuan
            valuation.
          tone: positive
          claimRefs:
            - CO005
        - date: 2026-05-21T00:00:00.000Z
          label: Industrial RaaS expansion framed
          detail: >-
            Sina says new capital will build the RaaS system and expand into industrial manufacturing, park operations,
            warehousing, logistics, and commercial services.
          tone: positive
          claimRefs:
            - CO004
            - CO005
        - date: 2026-05-25T00:00:00.000Z
          label: Boncast logs latest deal as Pre-A
