            title: The product is orchestration-first
            body: >-
              BOTSHARE's clearest public advantage is packaging access, deployment, and support around robot rentals;
              the evidence does not yet show a deeply disclosed proprietary technical platform underneath that service
              layer.
            calloutType: insight
            claimRefs:
