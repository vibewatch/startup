              - CM014
      - number: '2.2'
        title: Sizing lenses and valuation-relevant demand
        blocks:
          - type: paragraph
            body: >-
              The strongest quantitative lens in the assigned pool is top-down: Market Research Future sizes the
              Asia-Pacific robotics market at $42.33 billion in 2025 and $141.21 billion by 2035, while IFR says China
              already accounts for 54% of annual industrial robot installations worldwide. Those figures establish that
              automation budgets are real and growing, but they do not directly translate into Botshare's serviceable
              market. Botshare's nearer-term wedge appears inside operationally intensive segments where logistics,
              maintenance, and utilization management matter more than a generic robotics multiple. Investor enthusiasm
              also remains high across embodied-intelligence categories, which can support ambitious valuations before
              repeatable unit economics are public. In practice, this chapter treats macro sizing as context and
              operational fit as the investable filter.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM010
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Two forces drive adoption in this pool. First, Chinese policy is explicitly encouraging real-scene
              deployment, with MIIT and SASAC targeting more than 100 high-value scenarios and a 10,000-unit-scale
              deployment capacity by the end of 2026. Second, service infrastructure is improving: JD's maintenance
              network and Botshare's own partner software, dispatch, and device coverage all reduce deployment friction.
              The offset is margin pressure. Sohu reports rapid rental-price declines in commercial-performance use
              cases, implying that pure brokerage economics commoditize quickly. As a result, Botshare's ability to hold
              value depends less on access to robot hardware than on fulfillment quality, local service density, and
              repeatable operating workflows.
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operational service, not generic robotics, is the real market wedge
            body: >-
              The assigned sources consistently describe demand as a bundle of robot access, dispatch, maintenance,
              insurance, and recovery. That means Botshare competes on fulfillment quality and local service density
              before it competes on hardware novelty.
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
              - CM013
          - type: callout
            title: Headline TAM can hide fast price commoditization
            body: >-
              Broad robotics growth does not prevent rental-margin compression. The Sohu evidence suggests
              commercial-performance pricing is falling quickly, so value creation must come from utilization and
              service operations rather than simple inventory brokerage.
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real landscape is service-led, not just app-led
        blocks:
          - type: paragraph
            body: >-
              The most important competitive fact is that buyers can solve the same job through several routes: a
              marketplace such as Botshare, a heavier commerce-and-service stack linked to JD, an open-platform rival
              such as Qingtianzu, direct manufacturer or regional rental brokers, or outright purchase and
              self-operation. Botshare's own positioning is as a platform that matches robotics service providers with
              end clients and coordinates offline deployment through partners, which makes it more asset-light than an
              owner-operator fleet. That matters because Sohu's reporting says many customers still find outright robot
              purchase uneconomic when demand lasts only a few days and hardware is iterating quickly, so the core
              substitute is flexible access rather than permanent ownership. The competitive set is therefore wider than
              "another rental marketplace": buyers can pick whichever route best bundles hardware access, service
              execution, and operating certainty for their use case.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP011
              - CP016
