chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Retained public evidence consistently describes Botshare as a very young Chinese robot-leasing platform
              rather than a robot OEM. Sina says Qingtianzu was registered on 2025-12-09 and calls it the "global first
              open robot leasing platform," while Crunchbase describes Botshare as a less-than-one-year-old Pudong-based
              robot leasing and rental company that is using fresh capital to broaden its operating footprint. The most
              useful official product evidence in the assigned pool is Botshare AI's OpenAMR case-study page, which
              frames the company's offer as reusable robotics infrastructure for customer-specific deployments across
              sanitation, logistics, and manufacturing rather than a one-off event-rental catalog.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is thin. EqualOcean and Sina both quote CEO Li Yiyan on the company's operating
              thesis: robots reach durable real-world adoption only when dispatch, maintenance, and scenario delivery
              are repeatable. That gives a clear picture of the current management narrative, but not of the broader
              bench. Within the retained pool, no public board roster, finance lead, independent director set, or
              broader executive team disclosure appears alongside the valuation step-up. For diligence, this means
              governance risk is less about a proven failure today than about decision concentration around one visible
              executive and the absence of public control artifacts that would let an investor test delegation,
              related-party approvals, and succession coverage.
            claimRefs:
              - CO009
              - CO010
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO015
              - CO016
      - number: '1.3'
        title: Funding, scale signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Funding headlines are strong but not yet fully reconciled. Chinese reporting says Botshare recently
              completed Series A and A+ financings totaling several hundred million yuan at a 7 billion yuan valuation,
              and Crunchbase places the company on its May 2026 unicorn list at a $1 billion valuation. Boncast's
              funding tracker is directionally consistent on unicorn status but much thinner on disclosed detail: it
              shows only two tracked deals since March 2026, with $14 million disclosed and Charoen Pokphand Group named
              among May 25 Pre-A investors. That discrepancy is not enough to reject the unicorn narrative, but it does
              mean the public cap-table story is incomplete and should not be overstated. On disclosed operating scale,
              EqualOcean reports a 100+ person team, Sohu reports 4,000+ dispatchable robots across 100+ cities, and
              Jiemian reports 1,000+ insured robots with more than RMB 200 million of coverage.
            claimRefs:
