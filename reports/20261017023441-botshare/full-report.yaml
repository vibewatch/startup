  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The credible market lens narrows from broad Asia-Pacific robotics spend to China-specific deployment capacity and
      finally to Botshare's current operating footprint.
    data:
      nodes:
        - label: APAC robotics market, 2025
          displayValue: $42.33B
          detail: Top-down regional robotics market estimate from Market Research Future
          claimRefs:
            - CM007
        - label: APAC robotics market, 2035
          displayValue: $141.21B
          detail: Long-range forecast from the same report; useful for direction, not Botshare's near-term SOM
          claimRefs:
            - CM007
        - label: China industrial robot installed base
          displayValue: ~2.0M units
          detail: IFR says China already holds roughly 4.5x the operational stock of Japan
          claimRefs:
            - CM010
        - label: China annual industrial robot install share
          displayValue: 54% of global installs
          detail: IFR data point showing where automation deployment already has scale
          claimRefs:
            - CM010
        - label: MIIT / SASAC deployment ambition
          displayValue: 100+ scenarios; 10k-unit capacity
          detail: End-2026 policy target for embodied-intelligence real-scene deployment
          claimRefs:
            - CM005
        - label: Botshare current network
          displayValue: 50 cities; 1,000+ devices
          detail: Current operating footprint reported by TechNode after the public launch
          claimRefs:
            - CM001
    approximationNotes: >-
      Layers preserve mixed units because the figure is an ordered market lens, not a cumulative bridge or directly
      comparable funnel.
    claimRefs:
      - CM001
      - CM005
      - CM007
      - CM010
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Public evidence places JD-backed service infrastructure and industrial RaaS challengers further up the
      fulfillment-depth curve than Botshare's current marketplace model.
    data:
      xAxis:
        label: Fulfillment depth (1=quote only, 5=repair/logistics/compliance stack)
        min: 1
        max: 5
        lowLabel: Quote-led
        highLabel: Integrated operations
        scale: ordinal
      yAxis:
        label: Scenario breadth (1=event-only, 5=multi-scenario operating stack)
        min: 1
        max: 5
        lowLabel: Narrow use case
        highLabel: Broad operating scope
        scale: ordinal
      points:
        - label: Botshare
          x: 3.4
          'y': 3.1
          note: >-
            Marketplace model with partner-led deployment and insurance coordination, but public evidence still centers
            on events and activations.
        - label: JD-enabled stack
          x: 4.8
          'y': 4
          note: >-
            JD's repair, recycling, logistics, and insurance stack pushes it furthest toward integrated service
            execution across manufacturers.
        - label: Qingtianzu
          x: 4.1
          'y': 4.5
          note: >-
            Publicly positions as an open platform and is explicitly raising capital to push into industrial,
            warehousing, and park operations.
        - label: Direct OEM / local broker
          x: 2.1
          'y': 2.2
          note: >-
            Daily rental quotes are easy to compare, but retained sources show less evidence of nationwide repair and
            operations depth.
        - label: Industrial / park RaaS entrants
          x: 4.3
          'y': 5
          note: >-
            Botshare and Qingtianzu are both steering toward recurring operational scenarios, which raises the bar
            beyond one-off event fulfillment.
        - label: Direct purchase / self-operation
          x: 3.9
          'y': 1.4
          note: >-
            Highest buyer control, but Sohu says outright purchase is often uneconomic for short-duration demand and
            fast-changing hardware.
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP007
      - CP008
      - CP013
      - CP014
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      BotShare's public model looks like a fulfillment-led RaaS flow in which service execution is inseparable from
      revenue realization.
    data:
      nodes:
        - id: demand
          label: Demand capture
          note: Event, retail/property, and emerging warehousing/logistics/park scenarios create initial rental demand.
        - id: matching
          label: Platform matching
          note: >-
            Platform connects manufacturers, service providers, and application scenarios; Pandaily reported 5,500+
            orders.
        - id: dispatch
          label: Robot allocation
          note: Pandaily reported more than 3,000 robots available for dispatch.
        - id: delivery
          label: Delivery and setup
          note: JD cooperation covers equipment rental, logistics, and on-site service preparation.
        - id: service
          label: Maintenance / insurance / recovery
          note: Repair, insurance claims, recycling, and after-sales work continue after the robot is deployed.
        - id: margin
          label: Utilization and gross profit
          note: >-
            Economics depend on price discipline, uptime, local repair coverage, and scenario mix rather than
            software-like incremental margins.
      edges:
        - from: demand
          to: matching
        - from: matching
          to: dispatch
        - from: dispatch
          to: delivery
        - from: delivery
          to: service
        - from: service
          to: margin
    approximationNotes: >-
      The flow shows the public operating logic of the model, not a quantified conversion funnel or disclosed margin
      bridge.
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI012
      - CI014
  - id: FE001
    title: BOTSHARE public operating stack
    type: stack
    summary: >-
      The public architecture reads as a layered service stack from demand intake through field support and data
      feedback.
    data:
      layers:
        - label: Demand intake
          detail: Customer acquisition flows through mobile and commerce storefronts.
          modules:
            - WeChat mini program
            - JD storefront
            - Scenario brief collection
          outputs:
            - Qualified rental request
        - label: Supply pool
          detail: Platform value starts with access to third-party robots and leasing partners.
          modules:
            - Robot manufacturers
            - Leasing/service partners
            - Available robot inventory
          outputs:
            - Schedulable robot options
        - label: Deployment design
          detail: Commercial packaging includes choreography, content, and scene-specific setup.
          modules:
            - Robot selection
            - Scenario deployment
            - Content/choreography planning
          outputs:
            - Configured field deployment
        - label: Field execution
          detail: On-site delivery and operation support turn the listing into a working event or venue service.
          modules:
            - On-site delivery
            - Operator support
            - Customer handoff
          outputs:
            - Live customer usage
        - label: Service & control rails
          detail: The most differentiated public layer is post-sale support rather than disclosed core software.
          modules:
            - Repair and maintenance
            - Insurance claims
            - Recycling / recovery
          outputs:
            - Reduced downtime risk
        - label: Feedback loop
          detail: >-
            Data collection and secondary development are described, but the technical substrate is not publicly
            disclosed.
          modules:
            - Data collection
            - Secondary development
            - Future scene expansion
          outputs:
            - RaaS model iteration
    approximationNotes: Layering is inferred from the public service workflow and partner roles described across the assigned sources.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Botshare's public customer path starts with low-friction trial demand, then depends on delivery, repair, and
      insurance infrastructure to expand into recurring operational use cases.
    data:
      items:
        - label: Event-led discovery
          actor: Event organizer / marketer
          touchpoints:
            - Weddings, exhibitions, galas, store openings, tourism interactions
          note: Public demand signals are still strongest in short-duration, high-visibility scenarios.
        - label: Short-term rental decision
          actor: Buyer avoiding capex
          touchpoints:
            - Rental lowers upfront cost versus buying rapidly evolving robots outright
          note: Early customer logic is trial-first rather than long-term committed ownership.
        - label: Platform matching and booking
          actor: Marketplace user
          touchpoints:
            - Inventory search
            - Booking
            - Payment
          note: Botshare's public story emphasizes an app-like marketplace connecting supply and demand.
        - label: Delivery and on-site support
          actor: Local service partner / operator
          touchpoints:
            - Cross-city dispatch
            - Setup and choreography
            - On-site troubleshooting
          note: Execution quality depends on local service coverage, not just on listing inventory online.
        - label: Insurance and after-sales loop
          actor: Platform, insurer, and repair network
          touchpoints:
            - Liability coverage
            - Claims handling
            - Repair and recycling
          note: Commercial scaling requires risk transfer and distributed maintenance capacity.
        - label: Expansion into recurring operations
          actor: Operations manager
          touchpoints:
            - Logistics
            - Park operations
            - Store service
            - Industrial support
          note: The strategic upside depends on converting event-led discovery into repeat operational accounts.
    approximationNotes: >-
      This figure is qualitative and ordered by the operating journey described in the retained sources; it is not a
      quantified funnel or cohort model.
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU010
      - CU012
      - CU013
