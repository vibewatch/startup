      - number: '5.2'
        title: Operating architecture is service-heavy and partner-dependent
        blocks:
          - type: paragraph
            body: >-
              The public operating model is service-heavy. BOTSHARE describes one-stop support around robot selection,
              deployment, on-site delivery, and operations. Adjacent Chinese robot-rental partnerships show the broader
              rails that a platform of this type must coordinate: logistics, repair, insurance, recycling, secondary
              development, and data collection. The fetched Sohu text does not clearly identify BOTSHARE as the partner
              receiving that full bundle, so those capabilities are operating-model context rather than verified
              BOTSHARE-owned infrastructure. The architecture therefore looks less like a disclosed software stack and
              more like a fulfillment network combining marketplace intake, partner supply, field engineering, and
              post-deployment service layers.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
