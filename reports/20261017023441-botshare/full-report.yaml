              - CO014
      - number: '1.4'
        title: Operating milestones and visible risks
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence suggests real operating progress, not just a paper valuation jump. By May 2026,
              EqualOcean says Botshare had already built Partner SaaS, Global App, intelligent dispatch, and Skill Store
              modules, while Sohu and Technode tie the company to JD-linked delivery and repair infrastructure.
              Jiemian's insurance-claims report also indicates the company has moved from policy design into real claims
              handling. The main adverse signal is economic, not legal: Sohu argues that rental pricing is falling
              quickly enough that simple intermediation margins are narrowing, shifting competition toward logistics,
              maintenance, and service execution. That is consistent with Botshare's own emphasis on delivery
              capability, but it raises the bar for proving durable unit economics.
            claimRefs:
              - CO004
              - CO009
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Service execution is the real moat hypothesis
            body: >-
              The clearest through-line across independent and company-issued material is that Botshare is trying to win
              on dispatch, maintenance, insurance, and scenario delivery instead of on hardware ownership alone.
            calloutType: insight
            claimRefs:
