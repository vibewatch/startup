              - CE008
              - CE010
              - CE012
      - number: '5.3'
        title: Differentiation comes from fulfillment and scenario packaging, not disclosed core tech
        blocks:
          - type: paragraph
            body: >-
              BOTSHARE's differentiation is currently framed around lowering adoption friction: customers can rent
              rather than buy, and the platform bundles choreography, delivery, and operational support around visible
              offline scenarios. Independent and company-linked coverage both point to rapid market formation in China,
              but they also imply that service execution is the real moat because rental pricing is falling and similar
              hardware is becoming easier to source. The business has also raised capital to push beyond event rentals
              into logistics, park, and industrial contexts, which would increase switching value if BOTSHARE can
              convert its current fulfillment rails into repeatable production-grade operations.
            claimRefs:
              - CE002
              - CE004
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Controls are visible at the insurance and service level, but technical diligence is still shallow
        blocks:
          - type: paragraph
            body: >-
              Publicly visible controls are stronger on operations than on core product assurance. BOTSHARE has evidence
              of live robot insurance claims and of partner maintenance capacity, which is meaningful for assets that
              can be damaged in the field. At the same time, category-level evidence still points to stability and
              noisy-environment voice issues, and IFR's policy commentary reinforces that humanoid commercialization is
              still early in real-world production settings. Within the assigned evidence pool there is no retained
              official technical documentation, public developer-signal, or detailed reliability/SLA disclosure, so the
              software/control layer and compliance posture remain diligence gaps rather than verified strengths.
            claimRefs:
              - CE007
              - CE008
              - CE010
