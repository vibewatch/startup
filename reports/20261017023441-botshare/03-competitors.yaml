  - calloutType: insight
    title: Service stack is becoming the moat
    body: >-
      The decisive contest is moving from "who can list a robot" to "who can keep a robot
      delivered, repaired, insured, and economically useful across repeat scenarios."
    claimRefs:
      - CP007
      - CP008
      - CP016
  - calloutType: risk
    title: Neutrality may cap supplier breadth
    body: >-
      If rival OEMs see Botshare as a Zhiyuan-controlled channel rather than neutral
      infrastructure, they have incentives to prioritize direct channels or other platforms.
    claimRefs:
      - CP006
