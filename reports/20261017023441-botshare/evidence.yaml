evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, independent-director list, and broader executive biographies.
    whyItMatters: Governance quality and succession resilience cannot be tested from one visible CEO quote alone.
    diligencePath: Request board materials, executive org chart, and reserved-matters schedule during diligence.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-history
    missingEvidence: A reconciled cap table showing every round, round label, investor, amount, and security type since incorporation.
    whyItMatters: Public sources support unicorn status but do not yet reconcile total raised, investor rights, or round chronology.
    diligencePath: >-
      Obtain financing documents, investor roster, and bridge notes that reconcile Boncast with Sina and EqualOcean
      reporting.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, margin, burn, cash-balance, and customer-concentration data.
    whyItMatters: Valuation, unit economics, and downside resilience cannot be judged from public operating headlines alone.
    diligencePath: Request audited financial statements, management KPIs, and cohort/customer concentration reporting.
    relatedQuestionRefs:
      - QO006
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-concentration
    missingEvidence: Complete investor, partner, and supplier concentration detail behind the public stakeholder map.
    whyItMatters: Economic dependence on JD, PICC, a few investors, or a narrow OEM base could materially change risk.
    diligencePath: >-
      Request partner economics, supplier concentration, and the full investor/partner list with revenue or volume
      share.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Vertical-by-vertical contract counts, average contract value, utilization, renewal, and gross-margin data for
      Botshare's service workflows.
    whyItMatters: >-
      Without operating metrics, the report can frame TAM direction but cannot defend a bottom-up SAM or SOM or test
      whether service intensity offsets falling rental prices.
    diligencePath: >-
      Request cohort-level operating KPIs and customer concentration by scenario, then rebuild the sizing table from
      active contracts rather than top-down robotics forecasts.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      Independent procurement, budget, or case-study evidence that names the paying department and contract structure
      for warehouse, park, or industrial deployments.
    whyItMatters: >-
      Budget ownership determines adoption speed, sales-cycle length, and whether Botshare is selling discretionary
      novelty or recurring operational value.
    diligencePath: >-
      Collect named procurement notices, enterprise pilot summaries, or customer interviews that disclose who signed and
      paid for the deployment.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: missing-source
    severity: minor
