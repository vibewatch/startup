      - [Disclosed funding history, "$14m disclosed on Boncast; Chinese outlets report several hundred million yuan in recent A / A+ financing", "2026-05", low, "Public sources do not reconcile total raised, undisclosed tranches, or investor rights."]
      - [Team size, "100+ employees reported", "2026-05", medium, "No more recent headcount disclosure in retained pool."]
      - [Operational scale, "4,000+ dispatchable robots and 100+ cities reported", "2026-04", medium, "Reported by independent media, not via audited company KPI disclosure."]
      - [Insurance coverage, "1,000+ insured robots; RMB 200m+ aggregate coverage", "2026-04-24", medium, "Coverage does not disclose claims frequency, premium burden, or loss ratios."]
      - [Revenue / run-rate, "Not publicly disclosed in retained source pool", "2026-10-17", low, "Need management reporting or audited statements."]
      - [Customer count, "Not publicly disclosed in retained source pool", "2026-10-17", low, "Need active-customer, repeat-order, and concentration disclosure."]
    notes: >-
      Public snapshot mixes tracker data and media reporting; undisclosed
      private-company metrics are shown as explicit gaps rather than inferred
      values.
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO010, CO011, CO012, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background / public evidence
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Li Yiyan", CEO, "Quoted by Sina and EqualOcean explaining why delivery, dispatch, and maintenance capability matters for real-world robot deployment.", "Publicly visible leadership emphasis is operating execution across industrial and park scenarios.", "High: retained sources do not surface a broader named executive bench."]
      - ["Board / executive bench (undisclosed)", "Not publicly named in retained pool", "No retained source lists directors, CFO, COO, or independent governors.", "Finance, compliance, and succession coverage cannot be validated from public evidence in this pool.", "Medium-to-high: governance diligence must test delegation, approvals, and succession directly."]
    notes: >-
      Enumeration is intentionally partial because the assigned source pool
      surfaces one named executive but no public board roster or fuller
      management lineup.
    enumerationScope:
      coverage: partial
      basis: >-
        Built only from named leadership disclosures visible in the assigned
        public source pool as of the 2026-10-17 run date.
    claimRefs: [CO009, CO015, CO016]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Li Yiyan / management", "Operating control", "CEO is the only publicly named executive in the retained pool, making management concentration a real diligence topic.", "Request cap table, voting control, and succession planning."]
      - ["Charoen Pokphand Group", "Named investor", "Boncast names CP Group among the latest disclosed Pre-A investors, but the wider investor roster remains incomplete.", "Request full shareholder register, board rights, and liquidation preferences."]
      - ["JD.com", "Channel and fulfillment partner", "Sohu says the cooperation spans transactions, delivery, supply chain, after-sales, insurance, recycling, secondary development, and data collection.", "Test exclusivity, SLA dependence, and economics of JD-linked fulfillment."]
      - ["PICC P&C", "Insurance partner", "Jiemian ties Botshare's operating model to embodied-robot insurance and the first reported claim settlements.", "Review policy exclusions, claims history, premium support, and reserve assumptions."]
      - ["Robot OEM / supply network", "Supply-side ecosystem", "4,000+ dispatchable robots imply meaningful OEM and operator participation, but named concentration is not public in this pool.", "Request top supplier list, utilization by fleet type, and concentration limits."]
    notes: >-
      Map is partial because public sources name only one investor, one
      executive, and a limited set of partners; it should not be read as a
      complete cap table or ecosystem census.
    enumerationScope:
      coverage: partial
      basis: >-
        Includes only stakeholders that are explicitly named or strongly implied
        by the assigned public source pool through May and June 2026 reporting.
    claimRefs: [CO007, CO012, CO013, CO014, CO015, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows Botshare moving from incorporation to financing,
      insurance, and JD-linked operating partnerships within roughly six months.
    data:
      items:
        - date: 2025-12-09
          label: Company incorporated
          detail: Sina reports Qingtianzu was registered on 2025-12-09 and described it as the first open robot-leasing platform.
          tone: neutral
          claimRefs: [CO001]
        - period: 2025-12
          label: Insurance product introduced
          detail: Jiemian says Botshare and PICC launched embodied-robot insurance covering robot damage and third-party liability in December 2025.
          tone: positive
          claimRefs: [CO014]
        - date: 2026-03-18
          label: Angel and Angel+ deal logged
          detail: Boncast tracks an Angel plus Angel+ round with $14m disclosed.
          tone: positive
          claimRefs: [CO007]
        - date: 2026-04-24
          label: First insurance claims reported
          detail: Jiemian says Botshare and PICC completed the first embodied-robot insurance claims, with 1,000+ insured robots and 200m+ yuan coverage.
          tone: positive
          claimRefs: [CO014]
        - date: 2026-05-20
          label: A and A+ financing reported
          detail: EqualOcean reports recent Series A and A+ rounds totaling several hundred million yuan at a 7bn-yuan valuation.
          tone: positive
          claimRefs: [CO005]
        - date: 2026-05-21
          label: Industrial RaaS expansion framed
          detail: Sina says new capital will build the RaaS system and expand into industrial manufacturing, park operations, warehousing, logistics, and commercial services.
          tone: positive
          claimRefs: [CO004, CO005]
        - date: 2026-05-25
          label: Boncast logs latest deal as Pre-A
          detail: Boncast labels the latest disclosed round Pre-A and names Charoen Pokphand Group among investors, highlighting unresolved round-label differences.
          tone: warning
          claimRefs: [CO007, CO008]
        - date: 2026-06-11
          label: JD cooperation broadened
          detail: Sohu says JD and Botshare expanded cooperation to delivery, after-sales, insurance, recycling, secondary development, and data collection.
          tone: positive
          claimRefs: [CO013]
        - period: "By 2026-05"
          label: Core platform modules assembled
          detail: EqualOcean says Botshare had already launched Partner SaaS, Global App, intelligent dispatch, and Skill Store within six months of establishment.
          tone: positive
          claimRefs: [CO009]
    claimRefs: [CO001, CO004, CO005, CO007, CO008, CO009, CO013, CO014]
