schemaVersion: report-v2
artifact: company-overview
slug: botshare
runDate: 2026-10-17
company:
  name: Botshare
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Botshare (擎天租 / Qingtianzu) moved from a December 2025 incorporation to
    a May 2026 unicorn valuation unusually quickly, but the public record still
    centers on operating-model claims and funding headlines rather than audited
    company disclosure. The strongest current evidence supports a robot-leasing
    and RaaS positioning that is expanding from event deployments toward
    industrial and logistics use cases, while leaving governance depth, revenue,
    customer counts, and fully reconciled funding history unresolved.
sections:
  - id: identity-positioning
    title: Identity and positioning
    body: >-
      Retained public evidence consistently describes Botshare as a very young
      Chinese robot-leasing platform rather than a robot OEM. Sina says
      Qingtianzu was registered on 2025-12-09 and calls it the "global first
      open robot leasing platform," while Crunchbase describes Botshare as a
      less-than-one-year-old Pudong-based robot leasing and rental company that
      is using fresh capital to broaden its operating footprint. The most useful
      official product evidence in the assigned pool is Botshare AI's OpenAMR
      case-study page, which frames the company's offer as reusable robotics
      infrastructure for customer-specific deployments across sanitation,
      logistics, and manufacturing rather than a one-off event-rental catalog.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Leadership visibility is thin. EqualOcean and Sina both quote CEO Li
      Yiyan on the company's operating thesis: robots reach durable real-world
      adoption only when dispatch, maintenance, and scenario delivery are
      repeatable. That gives a clear picture of the current management
      narrative, but not of the broader bench. Within the retained pool, no
      public board roster, finance lead, independent director set, or broader
      executive team disclosure appears alongside the valuation step-up. For
      diligence, this means governance risk is less about a proven failure today
      than about decision concentration around one visible executive and the
      absence of public control artifacts that would let an investor test
      delegation, related-party approvals, and succession coverage.
    claimRefs: [CO009, CO010, CO015, CO016]
    tableRefs: [TO002]
  - id: funding-scale-stakeholders
    title: Funding, scale signals, and stakeholder map
    body: >-
      Funding headlines are strong but not yet fully reconciled. Chinese
      reporting says Botshare recently completed Series A and A+ financings
      totaling several hundred million yuan at a 7 billion yuan valuation, and
      Crunchbase places the company on its May 2026 unicorn list at a $1
      billion valuation. Boncast's funding tracker is directionally consistent
      on unicorn status but much thinner on disclosed detail: it shows only two
      tracked deals since March 2026, with $14 million disclosed and Charoen
      Pokphand Group named among May 25 Pre-A investors. That discrepancy is
      not enough to reject the unicorn narrative, but it does mean the public
      cap-table story is incomplete and should not be overstated. On disclosed
      operating scale, EqualOcean reports a 100+ person team, Sohu reports
      4,000+ dispatchable robots across 100+ cities, and Jiemian reports 1,000+
      insured robots with more than RMB 200 million of coverage.
    claimRefs: [CO005, CO006, CO007, CO008, CO010, CO011, CO012, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: operating-risks-and-milestones
    title: Operating milestones and visible risks
    body: >-
      The milestone sequence suggests real operating progress, not just a paper
      valuation jump. By May 2026, EqualOcean says Botshare had already built
      Partner SaaS, Global App, intelligent dispatch, and Skill Store modules,
      while Sohu and Technode tie the company to JD-linked delivery and repair
      infrastructure. Jiemian's insurance-claims report also indicates the
      company has moved from policy design into real claims handling. The main
      adverse signal is economic, not legal: Sohu argues that rental pricing is
      falling quickly enough that simple intermediation margins are narrowing,
      shifting competition toward logistics, maintenance, and service
      execution. That is consistent with Botshare's own emphasis on delivery
      capability, but it raises the bar for proving durable unit economics.
    claimRefs: [CO004, CO009, CO013, CO014, CO015]
callouts:
  - calloutType: insight
    title: Service execution is the real moat hypothesis
    body: >-
      The clearest through-line across independent and company-issued material
      is that Botshare is trying to win on dispatch, maintenance, insurance, and
      scenario delivery instead of on hardware ownership alone.
    claimRefs: [CO003, CO004, CO013, CO014, CO015]
  - calloutType: risk
    title: Public disclosure still lags the valuation step-up
    body: >-
      Public evidence supports a May 2026 unicorn valuation, but not a fully
      reconciled cap table, audited financial profile, disclosed customer base,
      or visible board structure.
    claimRefs: [CO005, CO006, CO007, CO008, CO011, CO016]
