companyProfile:
  summary: >-
    Botshare is a Pudong-based robot-leasing and RaaS platform that started operating in late 2025 and has quickly moved
    from event-style rentals toward industrial, logistics, and park-operations use cases. The public record shows real
    operating momentum, including platform modules, insured deployments, and partner-led fulfillment, but it still does
    not disclose enough financial detail to judge the durability of the business model or the economics behind its
    unicorn valuation.
