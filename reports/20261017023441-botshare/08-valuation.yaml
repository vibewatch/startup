  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Audited revenue, gross margin, utilization, downtime, renewal, burn, and cohort contribution margins.
      whyItMatters: These metrics determine whether network scale can support the reported financing mark and a venture return.
      diligencePath: Request audited financials and cohort economics split across event, warehousing, logistics, park, and industrial deployments.
      relatedQuestionRefs: [QV002]
      relatedTableRefs: [TV002, TV003]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Fully diluted ownership, liquidation preferences, option-pool expansion, debt seniority, investor protections, and expected exit proceeds.
      whyItMatters: Dilution and senior claims can materially change investor returns even if the operating company grows.
      diligencePath: Review the latest cap table, term sheets, debt schedules, side letters, and waterfall model before setting an entry price.
      relatedQuestionRefs: [QV002, QV007]
      relatedTableRefs: [TV001, TV003]
    - type: missing-source
      severity: material
      topic: exit-and-comparables
      missingEvidence: Revenue-normalized public-company, private-round, M&A, and secondary references matched to Botshare's business mix and stage.
      whyItMatters: Headline private-company marks do not provide a comparable multiple or an evidence-based exit range.
      diligencePath: Obtain Botshare segment financials, then build a comp set normalized for revenue quality, margin, stage, geography, and financing rights.
      relatedQuestionRefs: [QV002, QV006, QV007]
      relatedTableRefs: [TV003]
