schemaVersion: report-v2
artifact: valuation
slug: botshare
runDate: 2026-10-17
company:
  name: Botshare
chapter:
  number: 8
  title: Valuation
  summary: >-
    Independent coverage reports a 2026 unicorn-level financing mark, but the
    retained public record does not disclose the economics, capital structure,
    or exit evidence needed to underwrite that mark as fair value. The
    price-sensitive recommendation is research-more with high risk and a
    stretched valuation stance.
sections:
  - id: recommendation-and-price
    title: The financing mark is visible; investable value is not
    body: |-
      Gasgoo and Cover News reported A and A+ financing worth hundreds of
      millions of yuan and a post-financing valuation of RMB 7 billion, while
      Crunchbase separately listed a $1 billion Series A valuation. These are
      financing-round markers, not audited evidence of intrinsic value, cash
      available, or a realizable secondary price. None of the retained sources
      supplies audited revenue, gross margin, utilization, retention, burn, a
      fully diluted cap table, or preference terms. That asymmetry makes the
      decision straightforward: keep Botshare in active diligence, but do not
      issue a buy recommendation or a precise return target from the public
      record. Entry discipline should be tied to verified unit economics and
      financing rights, not to the unicorn label.
    claimRefs: [CV001, CV002, CV003, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-antithesis
    title: Early network proof meets service intensity and price compression
    body: |-
      The thesis is that a young platform has already assembled reported
      network scale, insured deployments, and a path from event rentals toward
      warehousing, logistics, and park operations. Those signals make the RaaS
      model worth investigating. The anti-thesis is equally concrete. Sohu
      reported sharp rental-price compression and argued that logistics,
      on-site service, maintenance, insurance, and recovery increasingly
      determine platform economics. JD's planned repair expansion shows that
      enabling infrastructure is forming, but a three-year rollout also
      indicates that nationwide service density is not a finished asset.
      Botshare therefore has to prove that service attachment and utilization
      can offset falling rental spreads rather than merely add operating cost.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario upside depends on milestones, not headline peer marks
    body: |-
      Crunchbase's May 2026 robotics cohort supplies context rather than a clean
      comparable set: Hark, Tianji, Agilink, and Botshare had different products,
      stages, round structures, and disclosed operating evidence. Their private
      marks cannot be converted into a defensible revenue multiple for Botshare.
      The bull case requires repeat industrial cohorts and improving service
      economics; the base case leaves fair value indeterminate until those
      metrics appear; the bear case applies a discount to the reported mark if
      price compression and long commercialization timelines persist. IFR's
      warning that real-world humanoid production remains largely at
      demonstrator or pilot stage supports that downside discipline. No precise
      probability-weighted range is supportable from the assigned evidence.
    claimRefs: [CV006, CV010, CV011, CV012, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness is low until identity, economics, and rights are reconciled
    body: |-
      Public evidence does not identify an IPO, strategic-sale, or secondary
      pathway, and it does not disclose the rights needed to model proceeds to
      a new investor. Source identity also needs care: the assigned
      botshare.solutions URL resolves to a robotics R&D studio led by Alex
      Reznichenko, not to the Pudong leasing platform described by Gasgoo and
      Crunchbase, so it cannot be used as target-company operating proof.
      Final diligence should confirm the financed legal entity, reconcile the
      cap table and preference stack, inspect audited cohort economics, and
      obtain customer-level evidence for recurring industrial deployments.
      Thesis-break triggers are sustained rental-price compression without
      service-margin improvement, failure to convert pilots into repeat
      contracts, or financing terms that eliminate venture-scale downside
      protection.
    claimRefs: [CV005, CV006, CV010, CV011, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision axis
      - Current assessment
      - Decision implication
    rows:
      - ["Recommendation", "research-more", "Continue diligence; public evidence is insufficient for a buy decision."]
      - ["Confidence", "medium", "Multiple independent reports establish the financing mark, but private operating evidence drives the judgment."]
      - ["Risk rating", "high", "A young operating history, price compression, and undisclosed financing rights leave substantial downside."]
      - ["Valuation stance", "stretched", "RMB 7 billion and $1 billion are reported round markers, not independently derived fair value."]
      - ["Target return / hold / exit", "Not supportable from public evidence", "Do not manufacture a return target without entry terms, dilution, cash flows, and an exit path."]
    notes: >-
      Assessments use only the assigned public sources; reported funding is not
      treated as cash available, and no DCF or cap-table-complete return model is implied.
    claimRefs: [CV001, CV002, CV003, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Evidence-based argument
      - What would change the view
    rows:
      - ["Thesis", "Crunchbase reports expansion from event rentals toward warehousing, logistics, and park operations.", "Signed multi-site contracts with disclosed duration, renewal, and service attachment would strengthen the thesis."]
      - ["Thesis", "Gasgoo reports a network of more than 4,000 robots soon after the December 2025 launch.", "Audited utilization and revenue per available robot would convert scale into economic proof."]
      - ["Thesis", "Jiemian reports more than 1,000 insured robots and aggregate insured value above RMB 200 million.", "Loss ratios, claim frequency, and downtime data would show whether insurance improves asset economics."]
      - ["Anti-thesis", "Sohu reports performance-robot day rates falling from about RMB 10,000 in 2025 to about RMB 4,000.", "Stable contribution margin despite lower day rates would weaken this concern."]
      - ["Anti-thesis", "Sohu says logistics, maintenance, insurance, and recovery are becoming core operating requirements.", "Evidence of positive service margins and dense local coverage would turn service intensity into a moat."]
      - ["Anti-thesis", "IFR says real-world humanoid production remains largely at demonstrator or pilot stage.", "Repeat industrial deployments with measured productivity and uptime would shorten the commercialization-risk horizon."]
    notes: >-
      Scale and insurance figures are third-party reports of platform activity;
      they are not audited revenue, utilization, margin, or retention metrics.
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation range / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Repeat warehousing, logistics, and park cohorts scale with improving utilization, service attachment, and contribution margin.", "At or above the reported RMB 7 billion / $1 billion financing mark; no upper bound is supportable without audited economics.", "Execution, service density, and financing dilution.", "Audited cohort margins, renewals, and multi-site contracts."]
      - ["Base", "Network activity grows, but economics and financing rights remain private.", "No defensible fair-value interval; treat the reported mark only as a negotiation reference.", "Narrative growth can outpace cash generation.", "More deployments without audited unit economics."]
      - ["Bear", "Rental-price compression persists while industrial adoption remains pilot-heavy and service costs stay high.", "Below the reported financing mark; the assigned evidence cannot quantify a downside floor.", "Down-round, preference overhang, and weak operating leverage.", "Falling day rates, delayed repeat contracts, or adverse financing terms."]
    notes: >-
      These are qualitative underwriting bands anchored to reported financing
      marks; missing revenue, margin, dilution, and exit data preclude precise ranges or probabilities.
    claimRefs: [CV001, CV002, CV006, CV010, CV011, CV012, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and an industrial expansion thesis are outweighed by
      service intensity, commercialization timing, and disclosure gaps at the current mark.
    data:
      nodes:
        - id: financing-mark
          label: Unicorn financing mark
          detail: External reports cite RMB 7 billion and $1 billion round valuations.
        - id: early-scale
          label: Early operating scale
          detail: Gasgoo reports a network of more than 4,000 robots.
        - id: industrial-option
          label: Industrial expansion option
          detail: Coverage describes movement toward logistics, warehousing, and park operations.
        - id: price-pressure
          label: Rental price pressure
          detail: Reported day rates have declined as simple matching spreads narrow.
        - id: adoption-risk
          label: Commercialization timing risk
          detail: IFR says real-world humanoid production remains mostly demonstrator or pilot activity.
        - id: disclosure-gap
          label: Economics and rights undisclosed
          detail: Public evidence lacks audited unit economics, dilution, preferences, and exit terms.
        - id: research-more
          label: Research more
          detail: Require private evidence or a lower entry price before underwriting a return.
      edges:
        - from: financing-mark
          to: early-scale
          label: Price requires proof
        - from: early-scale
          to: industrial-option
          label: Creates expansion potential
        - from: industrial-option
          to: price-pressure
          label: Must overcome
        - from: price-pressure
          to: adoption-risk
          label: Compounds
        - from: adoption-risk
          to: disclosure-gap
          label: Raises evidence threshold
        - from: disclosure-gap
          to: research-more
          label: Determines decision
    approximationNotes: >-
      The flow is analytical and non-quantitative; it does not assign probabilities or derive fair value.
    claimRefs: [CV005, CV006, CV010, CV011, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Research more. A buy call requires audited unit economics, fully diluted
      entry terms, and repeat industrial deployment evidence, or a price below
      the reported financing mark that compensates for those gaps.
    claimRefs: [CV014, CV015, CV016]
  - calloutType: risk
    title: Do not confuse a round mark with realizable value
    body: >-
      The reported RMB 7 billion and $1 billion figures describe private
      financing valuations; they do not establish cash available, liquidation
      proceeds, or an executable secondary price.
    claimRefs: [CV001, CV002, CV003]
