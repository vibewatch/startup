    title: "Revenue model bridge"
    type: "flow"
    summary: "BotShare's public model looks like a fulfillment-led RaaS flow in which service execution is inseparable from revenue realization."
    data:
      nodes:
        - id: "demand"
          label: "Demand capture"
          note: "Event, retail/property, and emerging warehousing/logistics/park scenarios create initial rental demand."
        - id: "matching"
          label: "Platform matching"
          note: "Platform connects manufacturers, service providers, and application scenarios; Pandaily reported 5,500+ orders."
        - id: "dispatch"
          label: "Robot allocation"
          note: "Pandaily reported more than 3,000 robots available for dispatch."
        - id: "delivery"
          label: "Delivery and setup"
          note: "JD cooperation covers equipment rental, logistics, and on-site service preparation."
        - id: "service"
          label: "Maintenance / insurance / recovery"
          note: "Repair, insurance claims, recycling, and after-sales work continue after the robot is deployed."
        - id: "margin"
          label: "Utilization and gross profit"
          note: "Economics depend on price discipline, uptime, local repair coverage, and scenario mix rather than software-like incremental margins."
      edges:
        - { from: "demand", to: "matching" }
        - { from: "matching", to: "dispatch" }
        - { from: "dispatch", to: "delivery" }
        - { from: "delivery", to: "service" }
        - { from: "service", to: "margin" }
    approximationNotes: "The flow shows the public operating logic of the model, not a quantified conversion funnel or disclosed margin bridge."
    claimRefs: ["CI005", "CI007", "CI008", "CI012", "CI014"]
