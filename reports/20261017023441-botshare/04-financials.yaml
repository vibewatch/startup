    title: "Revenue streams table"
    columns:
      - "Stream"
      - "Mechanism"
      - "Unit"
      - "Current value/status"
      - "Quality"
      - "Diligence ask"
    rows:
      - ["Event and activation rentals", "Short-duration rentals for performances, exhibitions, retail openings, tourism, and brand events", "daily rental / order", "Existing demand base; Sohu says demand is still concentrated in event-style and activation scenarios", "Confirmed demand, but volatile and price-sensitive", "Split completed orders, revenue, and gross margin by event use case versus recurring deployments"]
      - ["Platform dispatch / scenario matching", "Platform connects manufacturers, service providers, and demand scenarios; Pandaily described a third-party ecosystem and public order volume", "orders / robot-days", "5,500+ orders and 3,000+ robots available for dispatch reported by Pandaily", "Useful activity proxy, not revenue", "Provide monthly GMV, take rate, cancellations, and net revenue recognition policy"]
      - ["Fulfillment and on-site services", "Logistics, setup, debugging, maintenance, insurance, recovery, and related service delivery attached to the rental job", "service fee / bundled package", "JD cooperation includes logistics, maintenance, insurance, recycling, secondary development, and data collection", "Likely revenue-enabling but cost-heavy", "Disclose attach rate, labor hours per job, reimbursement terms, and warranty exposure"]
      - ["Industrial / park / logistics deployments", "Longer-duration operational use cases beyond event rentals", "contract / deployment", "Crunchbase says Botshare is expanding into warehousing, logistics, and park operations", "Strategic path, not yet public monetization proof", "Show contract length, deployment volume, renewal, and service-level penalties by scenario"]
    notes: "Public sources establish mechanism and activity, but not realized revenue recognition, take rate, or margin by stream."
    claimRefs: ["CI003", "CI005", "CI010", "CI014"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns:
      - "Price / contract element"
      - "Public signal"
      - "List vs realized"
      - "Implication"
      - "Source"
    rows:
      - ["Event-rental benchmark (historical peak)", "Sohu said single-day event-rental pricing reached above RMB 10,000 in 2025", "Historical spot benchmark, not disclosed BotShare realized price", "Shows willingness to pay existed before price normalization", "Sohu"]
      - ["Current daily market benchmark", "Sohu said rates have fallen to around RMB 4,000/day; Unitree G1 about RMB 2,500-3,500/day; robot dogs about RMB 400-500/day", "Market benchmark only, not BotShare contracted revenue", "Margin will depend on utilization and service attach, not price dispersion alone", "Sohu"]
      - ["BotShare take rate / commission", null, "Unknown", "Order count cannot be translated into revenue without commission or owned-fleet economics", "Public disclosure gap"]
      - ["Industrial / park contracts", "Expansion beyond event rentals is public, but no contract pricing or term length is disclosed", "Unknown", "Needed to judge repeatability, working capital needs, and customer concentration", "Crunchbase / Sina"]
    notes: "These pricing signals are market benchmarks and scenario clues, not disclosed realized pricing or BotShare gross profit."
    claimRefs: ["CI006", "CI010", "CI011", "CI013"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Public value"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Platform orders", ">5,500", "Medium", "Volume proxy for demand formation and dispatch cadence", "Provide monthly completed orders, robot-days, and GMV by scenario"]
      - ["Robots available for dispatch", ">3,000", "Medium", "Supply-side numerator for utilization and maintenance planning", "Break out owned versus partner robots, uptime, and idle time"]
      - ["City partner applicants", ">20,000", "Medium", "Channel-breadth proxy, but not the same as productive supply", "Disclose active partners, productive partners, and partner churn"]
      - ["Current market daily rental benchmark", "~RMB 4,000/day", "Medium", "Shows price normalization after early scarcity", "Provide BotShare realized ASP by robot class and city"]
      - ["JD repair coverage", "8 repair centers today; 50+ cities planned within three years", "Medium", "Repair reach directly affects downtime, SLA performance, and service cost", "Share actual BotShare/JD operating SLA, repair turnaround, and who pays"]
      - ["Insurance / claims benchmark (peer)", ">1,000 insured robots; aggregate coverage >RMB 200 million", "Medium", "Suggests claims handling is part of service delivery economics", "Disclose BotShare insurance penetration, premiums, and claims-loss rate"]
      - ["Revenue / ARR", null, "Low", "No underwriting of revenue quality without this", "Share audited revenue bridge, deferred revenue, and revenue by scenario"]
      - ["Gross margin / service margin", null, "Low", "Determines whether scale improves economics or only absorbs more service cost", "Share gross margin by event, recurring operations, and service add-ons"]
      - ["Burn / runway", null, "Low", "Determines financing dependency and next-round timing", "Share current cash balance, monthly burn, and 12-month runway sensitivity"]
    notes: "Null values mean the retained public evidence does not disclose the metric; each missing field is an explicit diligence request rather than an inferred zero."
    claimRefs: ["CI003", "CI006", "CI008", "CI012", "CI013"]
figures:
