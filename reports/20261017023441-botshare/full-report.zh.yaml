            title: 中立性可能限制供应商广度
            body: 如果竞争 OEM 将 Botshare 视为 Zhiyuan 控制的渠道，而非中立基础设施，它们就有动力优先选择直销渠道或其他平台。
            calloutType: risk
            claimRefs:
              - CP006
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开 traction
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，BotShare 与其说是轻薄的市场平台，不如说是重服务的机器人部署平台。Pandaily 报道公司正用新资金建设全国履约和服务网络，以及资产管理和调度系统；Sohu
              称其与京东的合作涵盖租赁、物流、维护、保险、回收、二次开发和数据收集。因此收入很可能来自租赁交易加上捆绑的履约与服务层，而不只是简单上架费。公开 traction 确实存在但并不完整：Pandaily
              报道订单超过 5,500 单、可调度机器人超过 3,000 台、城市合伙人计划申请者超过 20,000 人；Crunchbase
              称公司希望从活动租赁扩展至仓储、物流和园区运营。这些指标说明有活动和战略野心，却不能证明收入质量。
            claimRefs:
              - CI003
