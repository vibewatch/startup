        title: 展示
        blocks:
          - type: callout
            title: 服务执行才是护城河假设
            body: 独立材料和公司材料最清晰的共同主线是：Botshare 试图靠调度、维护、保险和场景交付取胜，而不是只靠拥有硬件。
