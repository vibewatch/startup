chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              留存的公开证据一致将 Botshare 描述为一家非常年轻的中国机器人租赁平台，而非机器人 OEM。Sina 称 Qingtianzu 于 2025-12-09
              注册，并称其为“全球首个开放式机器人租赁平台”；Crunchbase 则将 Botshare 描述为一家成立不足一年的浦东机器人租赁公司，正利用新资金扩大运营范围。指定来源池中最有用的官方产品证据是
              Botshare AI 的 OpenAMR 案例页面：它将公司定位为可复用的机器人基础设施，面向客户在清洁、物流和制造等领域的定制部署，而不是一次性活动租赁目录。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
