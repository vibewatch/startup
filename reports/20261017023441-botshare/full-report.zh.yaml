      - number: '4.2'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              关于 BotShare 经济性的最佳公开线索是：机器人租赁在运营上很重。Sohu
              明确指出，机器人预订并不意味着业务结束；平台仍需协调跨城调度、现场服务、维修、保险理赔和资产回收。同一文章还描述了市场价格下跌：租赁需求上升，但日租已从此前的稀缺水平大幅下降。TechNode
              关于京东机器人救护车推广的报道，以及界面关于同业平台保险理赔的报道，都强化了同一结论：服务成本包括停机管理、备件、现场人工、保险处理和本地覆盖，因此毛利取决于利用率和执行纪律，而不只是表面需求。公开披露的单位经济输入仍很少，使利润率评估成为核心尽调阻碍。
