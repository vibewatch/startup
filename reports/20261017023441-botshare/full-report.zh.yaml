      - number: '1.4'
        title: 运营里程碑与可见风险
        blocks:
          - type: paragraph
            body: >-
              里程碑顺序显示公司确有运营进展，而不只是估值在纸面上跳升。到 2026 年 5 月，EqualOcean 称 Botshare 已搭建 Partner SaaS、Global App、智能调度和 Skill
              Store 模块；Sohu 与 TechNode 则将公司与京东相关的交付和维修基础设施联系起来。界面的保险理赔报道也表明，公司已从保单设计进入实际理赔处理。主要不利信号来自经济性而非法律：Sohu
              认为租赁价格下降过快，简单中介的利润空间正在收窄，竞争因此转向物流、维护和服务执行。这与 Botshare 自身强调交付能力相符，但也提高了证明单位经济可持续性的门槛。
            claimRefs:
              - CO004
              - CO009
              - CO013
              - CO014
              - CO015
