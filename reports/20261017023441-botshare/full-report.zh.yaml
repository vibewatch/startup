        title: 展示
        blocks:
          - type: callout
            title: 服务体系正在成为护城河
            body: 决胜点正从“谁能把机器人挂上架”转向“谁能让机器人在重复场景中交付、维修、投保并保持经济可用”。
            calloutType: insight
            claimRefs:
