      - number: '3.3'
        title: 只有中立性与执行力守住，Botshare 的护城河才存在
        blocks:
          - type: paragraph
            body: >-
              最有力的反证不是 Botshare 没有需求，而是行业专业化后其护城河可能变窄。ChinaBiz Insider 认为，Botshare 的治理和库存结构可能让平台看起来像 Zhiyuan
              控制的渠道，而非中立基础设施；如果 Unitree、Fourier 或其他 OEM 更偏好直销渠道或竞争平台，这一点就很重要。同时，京东正在建设超越简单信息聚合的维修和回收网络，Qingtianzu 与
              Botshare
              也都在公开转向仓储、物流、园区运营和其他经常使用的场景。新华社关于中国新增人形机器人标准的报道又增加了一层影响：随着安全、应用和全生命周期要求更加明确，赢家应是能把供应商广度、可重复合规和现场服务结合起来的运营商，而不是只会以低标价清库存的平台。
            claimRefs:
              - CP006
              - CP008
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
