        title: 市场规模视角与估值相关需求
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最强的量化视角是自上而下的：Market Research Future 估计亚太机器人市场 2025 年为 423.3 亿美元、2035 年达 1,412.1 亿美元；IFR
              称中国已占全球年度工业机器人安装量的 54%。这些数字说明自动化预算真实且在增长，却不能直接转换成 Botshare 的可服务市场。Botshare
              近期的切入口似乎在运营密集型细分领域，物流、维护和利用率管理的重要性高于泛机器人估值倍数。具身智能各类别的投资热情仍高，在可重复的单位经济公开前也能支撑激进估值。就本章而言，宏观规模只是背景，运营适配性才是可投资筛选器。
