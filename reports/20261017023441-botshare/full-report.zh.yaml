              估值。这些是融资轮定价标记，不是内在价值、可用现金或可实现二级价格的经审计证据。留存来源没有提供经审计收入、毛利率、利用率、留存、烧钱、完全摊薄股权结构表或优先股堆叠条款。这个不对称让决策很明确：继续积极尽调
              Botshare，但不能仅凭公开记录发出买入建议或精确回报目标。入场纪律应绑定经核实的单位经济和融资权利，而不是独角兽标签。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV015
              - CV016
