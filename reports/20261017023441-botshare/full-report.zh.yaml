      - number: '3.2'
        title: 能力深度与价格压力正在改变市场
        blocks:
          - type: paragraph
            body: >-
              公开比较显示 Botshare 已有早期分发势头，但仅凭目录广度越来越难守住市场。ChinaBiz Insider 称 Botshare 协调超过 600 家服务商、50 座城市中的 1,000
              台机器人，并采用很低的公开入门价，包括从每天 200 元起的应用报价和 1 元闪租促销。这些做法能加速采用，但 China Daily 和 Sohu 都显示整个市场正在下调价格：早期活动高峰时超过 10,000
              元的日租，如今主流人形机器人约为 4,000 元，较简单机器人品类的公开报价甚至更低。纯经纪利润空间因此被压缩，竞争基础转向维修覆盖、物流、保险，以及把一次性活动需求转成重复运营合同的能力。
            claimRefs:
