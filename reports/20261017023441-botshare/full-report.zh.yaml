    title: 正题 / 反题表
    columns:
      - 立场
      - 基于证据的论点
      - 哪些信息会改变看法
    rows:
      - - 正题
        - Crunchbase 报道业务从活动租赁扩展到仓储、物流和园区运营。
        - 若签署披露期限、续约和服务附加情况的多场地合同，将强化这一论点。
      - - 正题
        - Gasgoo 报道称，2025 年 12 月推出后不久，网络已有超过 4,000 台机器人。
        - 经审计的利用率和每台可用机器人收入，才能把规模转化为经济证明。
      - - 正题
        - 界面新闻报道超过 1,000 台已投保机器人，累计投保价值超过 RMB 200 million。
        - 损失率、保险理赔频率（此处是理赔指标，并非公司声称）和停机数据将显示保险是否改善资产经济性。
      - - 反方论据
        - Sohu 报道，性能机器人日租价已从 2025 年约 10,000 元降至约 4,000 元。
        - 在日租价下降的情况下仍能保持稳定的贡献利润率，会削弱这一担忧。
      - - 反方论据
        - Sohu 称，物流、维护、保险和回收正逐渐成为核心运营要求。
        - 若能证明服务利润为正且本地覆盖密集，服务强度反而会成为护城河。
      - - 反方论据
        - IFR 表示，真实场景的人形机器人生产仍主要处于演示或试点阶段。
        - 工业场景反复部署，并拿出生产率和正常运行时间数据，会缩短商业化风险的观察周期。
    notes: 规模和保险数据来自第三方对平台活动的报道，并非经审计的收入、利用率、利润率或留存指标。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
