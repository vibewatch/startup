        - 仓储、物流和园区客户群重复扩张，利用率、服务附加率和贡献利润率持续改善。
        - 不低于报道中的 RMB 7 billion / $1 billion 融资估值；没有经审计的经营数据，不足以支持上限判断。
        - 执行、服务密度和融资稀释。
        - 经审计的客户群利润率、续约和多地点合同。
      - - 基准
        - 网络活动增长，但经营数据和融资权利仍未公开。
        - 没有可辩护的公允价值区间；只把报道中的估值当作谈判参考。
        - 叙事增长可能快于现金创造。
        - 部署增加，但仍没有经审计的单位经济模型。
      - - 悲观情景
        - 租赁价格持续承压，工业采用仍以试点为主，服务成本维持高位。
        - 低于报道中的融资估值；现有证据无法量化下行底线。
        - 下轮融资、优先股堆叠悬置和经营杠杆疲弱。
        - 日租价下滑、重复合同延迟或融资条款不利。
    notes: 这些是以报道中的融资估值为锚的定性投资判断区间；收入、利润率、稀释和退出数据缺失，无法给出精确区间或概率。
