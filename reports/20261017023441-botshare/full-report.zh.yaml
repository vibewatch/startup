  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              相关市场边界比“机器人”窄，却比一次性活动租赁宽。独立报道将 Botshare 描述为机器人租赁和 RaaS
              平台：公司最初覆盖活动、零售、办公和教育场景，随后把扩张重点转向仓储、园区运营和工业服务。这一点很重要，因为买方付费的不只是机器；真正的产品还包括调度、安装、维护、保险和回收。因此，实际替代方案还包括临时用工、现场人工运营和自建车队管理，而不只是机器人
              OEM 的资本开支。
