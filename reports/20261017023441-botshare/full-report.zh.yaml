    title: 收入模式桥接
    type: flow
    summary: BotShare 的公开模式看起来像一条以履约为核心的 RaaS 流程，服务执行与收入实现无法分开。
    data:
      nodes:
        - id: demand
          label: 捕捉需求
          note: 活动、零售 / 物业，以及新兴的仓储、物流和园区场景，构成最初的租赁需求。
        - id: matching
          label: 平台撮合
          note: 平台连接制造商、服务商和应用场景；Pandaily 报道订单量超过 5,500 单。
        - id: dispatch
          label: 机器人调配
          note: Pandaily 报道，可调度的机器人超过 3,000 台。
        - id: delivery
          label: 交付与安装
          note: JD 合作覆盖设备租赁、物流和现场服务准备。
        - id: service
          label: 维护 / 保险 / 回收
          note: 机器人部署后，维修、保险理赔、回收和售后工作仍会持续。
        - id: margin
          label: 利用率与毛利
          note: 经济模型取决于价格纪律、正常运行时间、本地维修覆盖和场景组合，而不是类似软件的增量利润率。
      edges:
        - from: demand
          to: matching
        - from: matching
          to: dispatch
        - from: dispatch
          to: delivery
        - from: delivery
          to: service
        - from: service
          to: margin
    approximationNotes: 该流程展示的是公开的运营逻辑，不是量化转化漏斗，也不是披露的利润率桥接。
    claimRefs:
      - CI005
      - CI007
      - CI008
      - CI012
      - CI014
  - id: FE001
    title: BOTSHARE 公开运营体系
    type: stack
    summary: 公开架构呈现出一套分层服务体系，从需求接入一路延伸到现场支持和数据反馈。
    data:
      layers:
        - label: 需求接入
          detail: 客户获取通过移动端和电商店铺完成。
          modules:
            - 微信小程序
            - JD 店铺
            - 场景需求收集
          outputs:
            - 合格租赁请求
        - label: 供给池
          detail: 平台价值首先来自接入第三方机器人和租赁合作伙伴。
          modules:
            - 机器人制造商
            - 租赁 / 服务合作伙伴
            - 可用机器人库存
          outputs:
            - 可调度的机器人选项
        - label: 部署设计
          detail: 商业化打包包含编排、内容和针对具体场景的设置。
          modules:
            - 机器人选择
            - 场景部署
            - 内容 / 编排规划
          outputs:
            - 配置完成的现场部署
        - label: 现场执行
          detail: 现场交付和运营支持，把列表上的商品变成可运行的活动或场馆服务。
          modules:
            - 现场交付
            - 操作员支持
            - 客户交接
          outputs:
            - 客户现场使用
        - label: 服务与控制轨道
          detail: 公开信息中最具差异化的层，来自售后支持，而非已披露的核心软件。
          modules:
            - 维修与维护
            - 保险理赔
            - 回收 / 返还
          outputs:
            - 降低停机风险
        - label: 反馈闭环
          detail: 公开描述了数据采集和二次开发，但技术底座尚无公开披露。
          modules:
            - 数据采集
            - 二次开发
            - 未来场景扩展
          outputs:
            - RaaS 模式迭代
    approximationNotes: 该分层根据公开服务流程及各来源描述的合作伙伴角色推断得出。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Botshare 的公开客户路径从低门槛试用需求开始，随后依靠交付、维修和保险基础设施，拓展到持续运营场景。
    data:
      items:
        - label: 活动驱动的发现
          actor: 活动组织者 / 营销人员
          touchpoints:
            - 婚礼、展览、晚会、门店开业、旅游互动
          note: 公开需求信号仍最集中在短时、高曝光场景。
        - label: 短期租赁决策
          actor: 规避资本开支的买方
          touchpoints:
            - 相比直接买断快速迭代的机器人，租赁能降低前期成本
          note: 早期客户逻辑更偏向先试用，而非长期承诺持有。
        - label: 平台撮合与预订
          actor: 市场平台用户
          touchpoints:
            - 库存搜索
            - 预订
            - 支付
          note: Botshare 对外叙事强调类似 App 的市场平台，连接供需双方。
        - label: 交付与现场支持
          actor: 本地服务伙伴 / 操作员
          touchpoints:
            - 跨城市调度
            - 设置与编排
            - 现场故障排查
          note: 执行质量取决于本地服务覆盖，而不只是在线展示库存。
        - label: 保险与售后闭环
          actor: 平台、保险商和维修网络
          touchpoints:
            - 责任险覆盖
            - 理赔处理
            - 维修与回收
          note: 商业化扩张需要风险转移机制和分布式维护能力。
        - label: 扩展到持续运营
          actor: 运营经理
          touchpoints:
            - 物流
            - 园区运营
            - 门店服务
            - 工业支持
          note: 战略上行空间取决于能否把活动驱动的发现转化为重复运营客户。
    approximationNotes: 该图是定性的，按保留来源描述的运营旅程排序；不是量化漏斗或客户群模型。
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU010
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: Botshare 同时证明工业正常运行时间、合作伙伴韧性和估值支撑的难度最高，因此剩余风险也最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 现场可靠性 / 正常运行时间
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
        - label: 安全 / 责任
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
        - label: 数据权利 / 授权
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
        - label: 对 JD 服务网络的依赖
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 高
              tone: negative
        - label: 价格压缩 / 利用率
          values:
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
        - label: 估值领先于证明
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: negative
            - label: 早期
              tone: warning
            - label: 高
              tone: negative
    approximationNotes: 序数评级综合了保留公开证据中关于部署范围、已披露缓释措施和缺失尽调材料的信息，不是精算概率。
    claimRefs:
      - CR004
      - CR008
      - CR011
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 报道中的规模和工业扩张论点，抵不过当前估值下的服务强度、商业化时点和披露缺口。
    data:
      nodes:
        - id: financing-mark
          label: 独角兽融资估值
          detail: 外部报道提到 RMB 7 billion 和 $1 billion 的融资估值。
        - id: early-scale
          label: 早期运营规模
          detail: Gasgoo 报道，网络中有超过 4,000 台机器人。
        - id: industrial-option
          label: 工业扩张选项
          detail: 报道描述其正向物流、仓储和园区运营拓展。
        - id: price-pressure
          label: 租赁价格压力
          detail: 随着简单撮合的价差收窄，报道中的日租价已经下降。
        - id: adoption-risk
          label: 商业化时点风险
          detail: IFR 表示，真实场景的人形机器人生产仍主要处于演示或试点阶段。
        - id: disclosure-gap
          label: 经营数据和权利未披露
          detail: 公开证据缺少经审计的单位经济模型、稀释、优先权和退出条款。
        - id: research-more
          label: 继续研究
          detail: 在评估回报前，要求提供私下证据或更低的入场价格。
      edges:
        - from: financing-mark
          to: early-scale
          label: 价格需要证明
        - from: early-scale
          to: industrial-option
          label: 创造扩张潜力
        - from: industrial-option
          to: price-pressure
          label: 必须克服
        - from: price-pressure
          to: adoption-risk
          label: 叠加
        - from: adoption-risk
          to: disclosure-gap
          label: 提高证据门槛
        - from: disclosure-gap
          to: research-more
          label: 决定判断
    approximationNotes: 该流程是分析性的、非量化的；不分配概率，也不推导公允价值。
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
