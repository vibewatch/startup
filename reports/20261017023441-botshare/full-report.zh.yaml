      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              来源池显示有两股力量推动采用。第一，中国政策明确鼓励真实场景部署：工信部和国资委计划到 2026 年底覆盖 100 多个高价值场景，并形成 1 万台规模的部署能力。第二，服务基础设施正在改善：京东的维护网络，以及
              Botshare 自身的合作伙伴软件、调度和设备覆盖，都在降低部署摩擦。抵消因素是利润压力。Sohu 报道商业演出场景的租金快速下降，说明纯经纪模式很快会商品化。因此，Botshare
              能否守住价值，取决于履约质量、本地服务密度和可重复的运营流程，而不只是能否获得机器人硬件。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 真正的市场切入口是运营服务，不是泛机器人
            body: 指定来源一致把需求描述为机器人使用权、调度、维护、保险和回收的组合。因此，Botshare 首先要在履约质量和本地服务密度上竞争，之后才是硬件新颖性。
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
              - CM013
          - type: callout
            title: 顶层 TAM 可能掩盖快速的价格商品化
            body: 机器人市场增长并不能阻止租赁利润率被压缩。Sohu 的证据显示商业演出价格正在快速下降，因此价值创造必须来自利用率和服务运营，而不是简单的库存撮合。
            calloutType: risk
            claimRefs:
              - CM007
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 真正的竞争格局由服务主导，而非仅由应用主导
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争事实是，买方可以通过多条路径解决同一需求：选择 Botshare 这样的市场平台、与京东相关的更重型商业和服务体系、Qingtianzu
              这样的开放平台竞争者、直接找制造商或区域租赁经纪商，或者直接购买并自行运营。Botshare 自身的定位，是把机器人服务商与终端客户匹配起来，并通过伙伴协调线下部署，因此比自有车队运营商更轻资产。Sohu
              报道称，当需求只有几天且硬件迭代很快时，许多客户仍认为直接购买机器人不划算，所以核心替代品是灵活使用权，而非永久拥有。竞争范围因此不只是“另一个租赁市场”：买方可以选择最适合自身场景、能把硬件使用权、服务执行和运营确定性打包起来的路径。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP011
