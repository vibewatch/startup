      - number: '8.2'
        title: 早期网络证明遇上服务强度和价格压缩
        blocks:
          - type: paragraph
            body: >-
              投资论点是：年轻平台已经形成有报道的网络规模、有保险的部署，并有从活动租赁走向仓储、物流和园区运营的路径。这些信号值得研究 RaaS 模式。反论同样具体：Sohu
              报道租金大幅压缩，并认为物流、现场服务、维护、保险和回收越来越决定平台经济性。京东计划扩大的维修网络说明支撑基础设施正在形成，但三年 rollout 也说明全国服务密度尚未成为成熟资产。因此 Botshare
              必须证明服务附加和利用率能够抵消下跌的租赁价差，而不是只增加运营成本。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.3'
        title: 场景上行取决于里程碑，而非 headline 同业估值
        blocks:
          - type: paragraph
            body: >-
              Crunchbase 的 2026 年 5 月机器人 cohort 只能提供背景，不能构成干净的可比集合：Hark、Tianji、Agilink 和 Botshare
              的产品、阶段、轮次结构和运营证据都不同。它们的私有估值不能转换成 Botshare 有说服力的收入倍数。乐观情景需要重复工业 cohort
              和改善的服务经济性；基准情景在这些指标出现前无法确定公允价值；悲观情景则在价格压缩和商业化周期漫长持续时，对已报道估值打折。IFR
              关于真实世界人形机器人生产仍大多停留在演示或试点阶段的警告，支持这种下行纪律。指定证据不足以支持精确的概率加权区间。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
