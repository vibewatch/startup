      - number: '8.4'
        title: 在身份、经济性与权利核对前，退出准备度低
        blocks:
          - type: paragraph
            body: >-
              公开证据没有识别 IPO、战略出售或二级交易路径，也没有披露为新投资人建模收益所需的权利。来源身份也需谨慎：指定的 botshare.solutions URL 指向由 Alex Reznichenko
              领导的机器人研发工作室，而不是 Gasgoo 和 Crunchbase 描述的浦东租赁平台，因此不能作为目标公司的运营证明。最终尽调应确认融资主体的法律实体，核对股权结构表和优先股堆叠，检查经审计的 cohort
              经济性，并取得重复工业部署的客户级证据。破题触发器包括：租金持续压缩却没有服务利润率改善、无法把试点转成重复合同，或融资条款消除风险投资所需的下行保护。
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的判断
            body: 继续研究。买入判断需要经审计的单位经济、完全摊薄的入场条款和重复工业部署证据；或者，需要一个低于已报道融资估值、足以补偿这些缺口的价格。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV015
              - CV016
          - type: callout
            title: 不要把融资定价误当可实现价值
            body: 已报道的 RMB 7 billion 和 $1 billion 数字描述的是私募融资估值；它们不能证明可用现金、清算收益或可执行的二级价格。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
