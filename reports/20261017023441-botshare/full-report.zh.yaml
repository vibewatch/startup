      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层信息很少。EqualOcean 和 Sina 都引用 CEO Li Yiyan
              的观点：只有当调度、维护和场景交付可以重复执行，机器人才能在真实世界持续落地。这能说明管理层当前的叙事，却看不出更完整的管理梯队。在留存来源中，估值上升的同时仍未见公开董事会名单、财务负责人、独立董事或更广泛的高管披露。因此，当前治理风险不在于已证实的失败，而在于决策集中于一位可见高管，以及缺少让投资人检验授权、关联方审批和继任安排的公开控制材料。
            claimRefs:
              - CO009
              - CO010
              - CO015
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO015
              - CO016
      - number: '1.3'
        title: 融资、规模信号与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              融资新闻强劲，但尚未完全核对。中国报道说 Botshare 最近完成 Series A 和 A+，总额数亿元人民币，估值 7 billion yuan；Crunchbase 则把公司列入 2026 年 5
              月独角兽名单，估值为 $1 billion。Boncast 的融资追踪器在独角兽状态上方向一致，但披露细节少得多：自 2026 年 3 月以来只追踪到两笔交易，披露金额 $14 million，并称
              Charoen Pokphand Group 是 5 月 25 日 Pre-A 投资者之一。这一差异不足以否定独角兽叙事，却说明公开股权结构表并不完整，不能夸大。运营规模方面，EqualOcean 报道团队超过
              100 人，Sohu 报道有 4,000 多台可调度机器人、覆盖 100 多座城市，界面报道称有 1,000 多台投保机器人，累计保障额超过 RMB 200 million。
