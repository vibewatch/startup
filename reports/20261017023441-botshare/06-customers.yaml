      - ["Education and cleaning channels", "Institutional buyers using JD-linked storefronts and services", "Education, guidance, and cleaning scenarios named in the JD cooperation article", "Public proof is a channel/fulfillment partnership rather than disclosed account counts", "Shows a route into more standardized use cases than stage performances", "Public sources do not quantify Botshare-specific order volumes from these channels"]
      - ["Industrial, warehousing, logistics, and park operations", "Operations managers and site operators", "Industrial manufacturing support, park operations, warehousing/logistics, commercial service", "Botshare's 2026 financing and Crunchbase coverage position these as expansion priorities", "Higher strategic value if demand becomes recurring and service-led", "Public evidence is mostly strategic intent; realized production-scale customers are not named"]
