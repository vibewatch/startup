      - ["Seasonal demand signal in JD channel", "GMV +100% MoM; search volume ~3x; inquiries ~4x; order volume +100%", "2026-01 / Lunar New Year", "Sohu", "Medium", "Shows category interest can spike quickly when humanoid robots become culturally visible", "JD channel data is not Botshare-specific and appears seasonal"]
      - ["Operational risk-plumbing proof", ">1,000 insured robots; >RMB 200m aggregate insured coverage; first claim completed", "2026-04", "Jiemian", "Medium", "Evidence of real deployments moving through a commercial insurance loop", "Insured fleet size is not the same as paying-account count or renewal depth"]
    notes: >-
      These metrics mix Botshare-specific figures, declared targets, and broader channel/category
      signals. They show adoption surfaces and operating readiness, but they do not provide a clean
      cohort view of repeat accounts, contract duration, or customer concentration.
    claimRefs: [CU002, CU004, CU006, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - ["JD.com", "Channel / operating partner", "JD cooperation covers online transaction, offline delivery, supply-chain coordination, operating services, and a flagship-store path into education, guidance, and cleaning scenarios", "Production commercial cooperation", "Provides a route toward standardized fulfillment and distribution rather than one-off brokered rentals", "Public sources do not disclose Botshare GMV, repeat-account count, or customer conversion from the JD channel"]
      - ["PICC", "Insurance / risk partner", "First embodied-robot insurance claim completed with Botshare; platform said to have >1,000 insured robots and >RMB 200m aggregate coverage", "Production claim paid", "Validates at least one real-world incident and a live risk-transfer workflow", "Insurance usage is not equivalent to durable end-customer retention or deployment breadth"]
      - ["China Pacific Property Insurance / sector benchmark", "Insurance / ecosystem partner", "Flexible day-, week-, and month-level robot insurance tied to rental operations and strategic cooperation with another rental platform", "Production sector solution", "Shows the ecosystem is building tools that can lower trial friction for renters and cross-city orders", "Evidence is sector-level and does not substitute for named Botshare end customers"]
    notes: >-
      Named public proof in the assigned pool is skewed toward channel and insurance counterparties.
      Named end-customer references with quantified outcomes remain scarce, so this table is a
      partial proof set rather than an exhaustive account list.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named evidence in the assigned source pool mostly identifies Botshare counterparties
        and sector benchmarks rather than a disclosed list of enterprise end customers or recurring
        deployed accounts.
    claimRefs: [CU005, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Botshare's public customer path starts with low-friction trial demand, then depends on
      delivery, repair, and insurance infrastructure to expand into recurring operational use cases.
    data:
      items:
        - label: Event-led discovery
          actor: Event organizer / marketer
          touchpoints:
            - Weddings, exhibitions, galas, store openings, tourism interactions
          note: Public demand signals are still strongest in short-duration, high-visibility scenarios.
        - label: Short-term rental decision
          actor: Buyer avoiding capex
          touchpoints:
            - Rental lowers upfront cost versus buying rapidly evolving robots outright
          note: Early customer logic is trial-first rather than long-term committed ownership.
        - label: Platform matching and booking
          actor: Marketplace user
          touchpoints:
            - Inventory search
            - Booking
            - Payment
          note: Botshare's public story emphasizes an app-like marketplace connecting supply and demand.
        - label: Delivery and on-site support
          actor: Local service partner / operator
          touchpoints:
            - Cross-city dispatch
            - Setup and choreography
            - On-site troubleshooting
          note: Execution quality depends on local service coverage, not just on listing inventory online.
        - label: Insurance and after-sales loop
          actor: Platform, insurer, and repair network
          touchpoints:
            - Liability coverage
            - Claims handling
            - Repair and recycling
          note: Commercial scaling requires risk transfer and distributed maintenance capacity.
        - label: Expansion into recurring operations
          actor: Operations manager
          touchpoints:
            - Logistics
            - Park operations
            - Store service
            - Industrial support
          note: The strategic upside depends on converting event-led discovery into repeat operational accounts.
    approximationNotes: >-
      This figure is qualitative and ordered by the operating journey described in the retained
      sources; it is not a quantified funnel or cohort model.
    claimRefs: [CU003, CU005, CU007, CU010, CU012, CU013]
callouts:
  - calloutType: insight
    title: Supply-side readiness is easier to verify than account durability
    body: >-
      The strongest public proof today is a service-and-risk stack—cities covered, devices listed,
      provider count, insured fleet, and named operating partners—rather than a disclosed book of
      repeat enterprise accounts.
    claimRefs: [CU002, CU012]
  - calloutType: risk
    title: Repeat-use economics remain the decisive diligence question
    body: >-
      Independent reporting says repeat customers are still rare and pricing has corrected sharply,
      so the real test is whether Botshare can move beyond event-led demand into recurring
      operational deployments without destroying unit economics.
    claimRefs: [CU008, CU009]
