schemaVersion: report-v2
artifact: customers
slug: botshare
runDate: 2026-10-17
company:
  name: Botshare
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Botshare has assembled an early national supply-and-service network:
    by early 2026, reporting tied the platform to 50 cities, more than 1,000 devices, and more
    than 600 service providers. The strongest proof of real usage comes from channel and operating
    infrastructure—JD-linked fulfillment and after-sales support, plus insurance and claims
    activity—while public sources still do not disclose renewals, concentration, or cohort
    durability.
sections:
  - id: customer-segments
    title: Customer segments are broadening, but public proof still starts with event-led demand
    body: >-
      The public evidence base points to an adoption path that starts with low-commitment, visible
      use cases and is trying to move toward recurring operating scenarios. Xinhua described
      Botshare as offering standardized rentals across more than 10 scenarios, from weddings to
      exhibitions, which fits the broader sector evidence that short-duration events and commercial
      activations remain the easiest entry point for buyers who do not want to own fast-depreciating
      hardware. At the same time, Chinese-language financing and channel coverage says the company
      is trying to push beyond one-off event rentals into store service, commercial operations,
      warehousing/logistics, industrial support, and park operations. That means the buyer base is
      widening from marketers and event organizers toward operators who care more about uptime,
      service levels, and repeatable delivery than about novelty alone.
    claimRefs: [CU001, CU002, CU003, CU006, CU007]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Public adoption metrics emphasize network breadth and operating readiness more than realized demand
    body: >-
      Botshare's disclosed traction is strongest on the supply side of the marketplace. Independent
      reporting tied the platform to 50 cities, more than 1,000 devices, and more than 600 service
      providers by early 2026, while a separate June 2026 sector article cited another large rental
      platform with more than 4,000 schedulable robots across more than 100 cities. Those data
      points show a market that can assemble inventory and service coverage quickly, but they are
      not the same as a disclosed active-customer, renewal, or utilization base. The public
      operating story therefore leans heavily on the machinery around fulfillment—delivery,
      scheduling, repair, insurance, and recycling—because that is what determines whether Botshare
      can convert episodic demand into repeatable RaaS relationships.
    claimRefs: [CU002, CU004, CU006, CU012, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named proof is concentrated in counterparties and operational plumbing, not end-customer references
    body: >-
      The clearest named public proof around Botshare today comes from counterparties rather than
      from a roster of disclosed enterprise accounts. Chinese-language reporting says JD signed a
      comprehensive strategic cooperation with 擎天租 covering online transactions, offline
      delivery, supply-chain coordination, and operating services, and that the platform opened a
      JD flagship store for scenarios such as education, guidance, and cleaning. The strongest
      operational validation comes from insurance activity: Jiemian reported that Botshare and PICC
      completed one of China's first embodied-robot insurance claims, with more than 1,000 robots
      on the platform insured and aggregate coverage above RMB 200 million. That is meaningful proof
      of in-field usage, but it is still not the same as public disclosure of named repeat buyers,
      contract duration, or expansion rates.
    claimRefs: [CU005, CU010, CU012, CU013]
    tableRefs: [TU003]
  - id: durability-risks
    title: Durability is still the main open question because novelty demand and price compression remain visible
    body: >-
      The adverse evidence in this pool does not show a collapse in demand, but it does show why
      customer durability remains the core diligence issue. Xinhua said repeat customers are still
      rare in China's robot-rental market and that much of today's demand is tied to novelty and
      entertainment use cases rather than stable operational service. The same reporting described
      sharp price correction, with Botshare offering entry rentals from RMB 1,499 per day and some
      daily rents down more than 40% from earlier peaks. The Wuhan-finance-hosted Securities Daily
      article also stressed that large-scale adoption needs insurance, incident handling, and data
      security controls because rental platforms carry meaningful transport, liability, and uptime
      risk. Public sources reviewed here still do not disclose churn, renewal, top-customer
      concentration, or cohort behavior, so those remain explicit diligence asks rather than
      inferable strengths.
    claimRefs: [CU008, CU009, CU010, CU011]
