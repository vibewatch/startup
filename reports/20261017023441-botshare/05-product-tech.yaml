company:
  name: "Botshare"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Public evidence supports BOTSHARE as a robot-rental orchestration layer rather
    than a disclosed proprietary robotics stack: it packages marketplace demand,
    scenario deployment, and field delivery while relying on external insurance
    and service rails.
    The model has visible traction in event and commercial-interaction scenarios,
    but public proof for industrial-scale deployments, software depth, and formal
    trust/compliance controls remains thin.
sections:
  - id: "product-definition"
    title: "What customers buy today"
    body: >-
      BOTSHARE is being sold to the market as an open robot-leasing platform,
      with a customer entry point centered on a WeChat mini program and JD.com
      distribution rather than a disclosed developer or API surface. The
      strongest public proof is concentrated in short-cycle commercial use
      cases: exhibitions, retail/tourism interactions, brand activations,
      celebrations, and education-oriented demos. That makes the current product
      definition closer to robot access plus deployment services than to a pure
      software product or vertically integrated robot OEM. Expansion into
      warehousing, logistics, parks, and industrial operations is visible in
      financing and roadmap coverage, but those heavier-duty scenarios look more
      like next-step expansion targets than a broadly evidenced installed base.
    claimRefs: ["CE001", "CE003", "CE004", "CE011", "CE012"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "operating-architecture"
    title: "Operating architecture is service-heavy and partner-dependent"
    body: >-
      The public operating model is service-heavy. BOTSHARE describes one-stop
      support around robot selection, deployment, on-site delivery, and
      operations. Adjacent Chinese robot-rental partnerships show the broader
      rails that a platform of this type must coordinate: logistics, repair,
      insurance, recycling, secondary development, and data collection. The
      fetched Sohu text does not clearly identify BOTSHARE as the partner receiving
      that full bundle, so those capabilities are operating-model context rather
      than verified BOTSHARE-owned infrastructure. The architecture therefore
      looks less like a disclosed software stack and more like a fulfillment
      network combining marketplace intake, partner supply, field engineering,
      and post-deployment service layers.
    claimRefs: ["CE005", "CE006", "CE007", "CE012"]
    tableRefs: ["TE003"]
  - id: "maturity-and-differentiation"
    title: "Differentiation comes from fulfillment and scenario packaging, not disclosed core tech"
    body: >-
      BOTSHARE's differentiation is currently framed around lowering adoption
      friction: customers can rent rather than buy, and the platform bundles
      choreography, delivery, and operational support around visible offline
      scenarios. Independent and company-linked coverage both point to rapid
      market formation in China, but they also imply that service execution is
      the real moat because rental pricing is falling and similar hardware is
      becoming easier to source. The business has also raised capital to push
      beyond event rentals into logistics, park, and industrial contexts, which
      would increase switching value if BOTSHARE can convert its current
      fulfillment rails into repeatable production-grade operations.
    claimRefs: ["CE002", "CE004", "CE009", "CE010", "CE011", "CE012"]
  - id: "risk-controls-and-gaps"
    title: "Controls are visible at the insurance and service level, but technical diligence is still shallow"
    body: >-
      Publicly visible controls are stronger on operations than on core product
      assurance. BOTSHARE has evidence of live robot insurance claims and of
      partner maintenance capacity, which is meaningful for assets that can be
      damaged in the field. At the same time, category-level evidence still
      points to stability and noisy-environment voice issues, and IFR's policy
      commentary reinforces that humanoid commercialization is still early in
      real-world production settings. Within the assigned evidence pool there is
      no retained official technical documentation, public developer-signal, or
      detailed reliability/SLA disclosure, so the software/control layer and
      compliance posture remain diligence gaps rather than verified strengths.
    claimRefs: ["CE007", "CE008", "CE010", "CE013"]
