      - ["Scenario deployment and choreography services", "Exhibitions, retail, tourism, brand marketing teams", "Live", "Turns robots into packaged campaign assets instead of raw hardware rentals", "No disclosed playbook for repeatability, staffing ratio, or margin"]
      - ["Industrial / warehouse / park operations expansion", "Operations teams in production and logistics contexts", "Roadmap / early expansion", "Could move the model from promotional usage into recurring operational workflows", "No public installed-base, SLA, or reference deployments in these heavier-duty settings"]
    notes: "Rows synthesize public 2026 coverage; live means publicly evidenced in current materials, while roadmap marks financing-backed expansion without detailed installed-base proof."
    claimRefs: ["CE003", "CE004", "CE005", "CE011", "CE012"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "BOTSHARE solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Create attention at exhibitions and brand activations", "Rent robot for a short campaign, then return it", "Supply robot plus choreography, costume/content packaging, on-site deployment, and operations support", "Faster trial versus outright purchase; public demand signals show current traction", "Use case is episodic and does not prove durable enterprise retention"]
      - ["Run retail / tourism interaction and guided footfall", "Deploy robot greeters or interactive units in offline spaces", "Mini-program and platform catalog support rapid scenario-specific selection and deployment", "Public reports show expansion from one-off shows into store service and tourism interaction", "No public conversion, uptime, or repeat-booking data"]
      - ["Test robots in education / household demo contexts", "Short-term rental for novelty, teaching, or family occasions", "Low-cost access to mainstream robot brands through rental channel", "Broader audience reach and lower try-before-buy barrier", "Low-complexity demand does not validate industrial-grade reliability"]
      - ["Shift robots into logistics / park / industrial operations", "Move from showpiece deployment to recurring operational tasks", "Use new financing and RaaS build-out to extend the service model into higher-frequency scenarios", "Potentially larger recurring use cases if execution works", "Public evidence still reads as expansion intent more than verified scaled delivery"]
    notes: "Benefits are limited to what public usage and financing coverage support; missing repeat-rate, uptime, and renewal metrics stay as diligence gaps."
    claimRefs: ["CE004", "CE005", "CE009", "CE011", "CE012"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Demand capture", "Acquire rental requests through WeChat mini program and JD storefront", "Consumer-facing channel usability and scenario intake quality", "No public API/workflow disclosure makes integration depth hard to underwrite"]
      - ["Supply onboarding", "Aggregate robot manufacturers and service partners into a rentable pool", "Sufficient breadth and availability of third-party robot supply", "Targets are ambitious but partner-quality control is not publicly detailed"]
      - ["Deployment engineering", "Configure robots for greetings, guidance, choreography, and brand interaction", "Field engineers, content planning, and scenario-specific setup", "High manual content load can constrain repeatability and margins"]
      - ["Fulfillment and maintenance", "Ship, install, repair, recharge, test, and recover robots in the field", "Third-party logistics and service-network partners, including JD capabilities described in market reporting", "Service quality becomes the real product bottleneck if response times miss customer windows"]
      - ["Insurance and recovery", "Cover robot loss/third-party liability and process claims", "Carrier cooperation and operational incident reporting", "Insurance presence is helpful but does not prove low failure rates or strong preventive controls"]
      - ["Data feedback / secondary development", "Collect operating data and adapt workflows for future iteration", "Customer authorization, partner tooling, and data quality", "Public evidence does not yet show the software, privacy, or model-governance layer behind this loop"]
    notes: "This is an operating architecture, not a claimed software stack diagram; it reflects public service layers and partner rails rather than verified internal systems."
    claimRefs: ["CE006", "CE007", "CE008", "CE010", "CE012"]
