callouts:
  - calloutType: "insight"
    title: "The product is orchestration-first"
    body: >-
      BOTSHARE's clearest public advantage is packaging access, deployment, and
      support around robot rentals; the evidence does not yet show a deeply
      disclosed proprietary technical platform underneath that service layer.
    claimRefs: ["CE005", "CE006", "CE012"]
  - calloutType: "risk"
    title: "Industrial expansion is still more promise than proof"
    body: >-
      Capital is being deployed to push BOTSHARE into warehousing, logistics,
      parks, and industrial operations, but current public proof still skews
      toward event, retail, tourism, and brand-interaction scenarios.
    claimRefs: ["CE004", "CE011", "CE013"]
  - calloutType: "recommendation"
    title: "Underwrite field operations before underwriting software depth"
    body: >-
      Near-term diligence should focus on deployment economics, downtime,
      maintenance response, and customer repeatability before giving credit for
      a differentiated software or data moat.
    claimRefs: ["CE007", "CE008", "CE010", "CE012"]
