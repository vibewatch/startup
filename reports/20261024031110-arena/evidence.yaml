evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, independent directors, executive bench, succession plans, voting rights, and founder
      vesting.
    whyItMatters: Leadership concentration and investor control cannot be assessed from founder biographies alone.
    diligencePath: >-
      Request the current organization chart, charter, cap table, board and observer roster, voting agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Customer count, headcount, customer concentration, recurring-revenue bridge, recognized revenue, retention, gross
      margin, burn, and cash balance.
    whyItMatters: Annualized revenue and capital raised do not establish revenue quality, efficiency, or runway.
    diligencePath: >-
      Obtain audited or management financials, customer and revenue cohorts, headcount roster, bank statements, and a
      financing-to-cash bridge.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: corporate-formation
    missingEvidence: >-
      Formation documents reconciling TechCrunch's 2022 founding date with the 2023 research launch and April 2025
      independent-company date.
    whyItMatters: A verified chronology is needed to distinguish the research project, legal formation, and commercial launch.
    diligencePath: Review certificate of incorporation, entity history, and founder-approved corporate timeline.
    relatedQuestionRefs:
      - QO001
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A bottom-up count of model labs, enterprise AI teams, and evaluators with annual evaluation budgets, split by
      geography and use case.
    whyItMatters: Without a shared population and spend denominator, adjacent market forecasts cannot establish Arena's SAM or SOM.
    diligencePath: >-
      Request Arena's pipeline, win-rate, average contract value, consumption distribution, and target-account universe
      under NDA.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: Customer-level pricing, paid conversion from the public network, repeat consumption, retention, and concentration.
    whyItMatters: >-
      Consumption revenue can be episodic; reported annualized revenue does not prove recurring demand or durable gross
      margin.
    diligencePath: Obtain anonymized cohort revenue, contract duration, expansion, repeat-purchase, and gross-margin data.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: methodology
    missingEvidence: >-
      Independent benchmark results comparing Arena preference rankings with domain-grounded correctness and customer
      outcomes.
    whyItMatters: >-
      A preference signal may be valuable for product choice but insufficient for regulated or correctness-critical
      workflows.
    diligencePath: >-
      Run a blinded customer-data validation study with ground-truth labels and publish sampling, confidence intervals,
      and disagreement rates.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: buyer-map
    missingEvidence: Named customer procurement records or case studies showing budget ownership and deployment triggers.
    whyItMatters: Buyer roles are evidence-constrained synthesis rather than verified Arena customer segmentation.
    diligencePath: >-
      Collect reference calls and procurement artifacts across model labs, enterprise platform teams, and governance
      functions.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Executed enterprise contracts, realized price bands, gross margin, renewal rates, and repeat private-arena usage.
    whyItMatters: >-
      Without realized commercial evidence, the competitive wedge cannot be translated into durable monetization or
      switching-cost strength.
