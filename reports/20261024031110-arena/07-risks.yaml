        - label: Privacy or permission-control gap
          values:
            - Medium
            - High
            - Unverified
            - High
        - label: Model or community concentration
          values:
            - Medium
            - High
            - Developing
            - High
        - label: Buyer cost or build substitution
          values:
            - Medium
            - Medium
            - Developing
            - Medium
    approximationNotes: >-
      Cell placement is a qualitative analyst judgment based on public evidence, not a measured
      probability or loss estimate; null cells mean no priority risk was assigned from the
      available evidence.
    claimRefs: [CR003, CR006, CR008, CR009, CR012, CR013, CR014]
callouts:
  - calloutType: recommendation
    title: Diligence-led risk posture
    body: >-
      Do not treat funding, usage, or a leaderboard position as mitigation. Require reproducible
      methodology, enterprise control evidence, conflict governance, and revenue-quality data
      before reducing the risk rating.
    claimRefs: [CR005, CR006, CR008, CR010, CR015, CR016]
