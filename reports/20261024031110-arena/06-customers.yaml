      - [Platform sessions, "350 million", "2026-10-08", "Independent report attributing company figure; medium confidence", "Indicates cumulative usage scale", "Definition of session and period covered"]
      - [Votes, "62 million", "2026-10-08", "Independent report attributing company figure; medium confidence", "Indicates preference-signal depth", "Vote-to-session conversion and data quality"]
      - [Agent Arena sessions, "7 million in first five months", "2026-10-08", "Independent report attributing company figure; medium confidence", "Shows early adoption of longer-horizon evaluation surface", "Paid versus free sessions and repeat cohorts"]
