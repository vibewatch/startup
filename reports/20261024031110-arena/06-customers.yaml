company:
  name: Arena
chapter:
  number: 6
  title: Customers
  summary: Arena has visible global usage and strong relevance among model labs, while public evidence is much thinner on paid-account retention, contract durability, and customer concentration. The customer thesis is therefore strongest for demand generation and category authority, not yet for recurring revenue quality.
sections:
  - id: customer-segments
    title: Customer segments and jobs
    body: "Arena serves two linked populations. The first is a broad community of people who submit prompts, compare anonymous model responses, and vote; this population supplies the preference data asset and creates recurring public traffic. The second is the paying evaluation market: model labs, enterprise AI teams, and governance or platform leaders that need comparative evidence before selecting or releasing a model. Public sources describe the buyer as a head of AI or ML platform lead choosing among frontier and open-weight models, and describe use cases spanning chat, coding, search, vision, and agent workflows. That segmentation is commercially coherent because community activity creates the raw signal while paid evaluations monetize analytics, feedback samples, and delivery commitments. It does not, however, establish how many community participants convert to paid accounts or whether the same labs repeatedly purchase evaluations."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and proof of use
    body: The public adoption record is substantial but mixes engagement units that should not be treated as interchangeable customer metrics. A January 2026 company release reported more than 5 million monthly users across 150 countries and more than 60 million conversations per month; a September 2026 independent profile reported more than 5 million monthly active users and tens of millions of votes; and an October 2026 report attributed 350 million sessions, 62 million votes, and 7 million Agent Arena sessions to the company. These figures demonstrate reach and repeated usage, but they do not disclose active paid accounts, conversion, cohort retention, or the denominator for enterprise adoption. The commercial product launched with evaluation analytics, auditable feedback samples, and delivery SLAs, yet pricing remains contact-only and public proof of renewals is absent.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named proof, durability, and expansion
    body: Named proof is strongest at the model-lab and public-benchmark layer. Independent coverage reports that OpenAI and Anthropic use LMArena's evaluation services, while a separate company profile says the leaderboard is cited by OpenAI, Google, Anthropic, and xAI. This is meaningful evidence of relevance and repeated evaluation, but it is not the same as a disclosed production contract, renewal, or customer outcome. Arena also markets private or confidential evaluations and specialized arenas, which could support land-and-expand from public benchmarking into proprietary testing, but no source in the assigned pool discloses contract length, net retention, gross retention, churn, attach rates, revenue by customer, or top-account concentration. The appropriate underwriting stance is to credit demand and reference quality while carrying revenue quality as an unresolved diligence item.
    claimRefs: [CU010, CU011, CU013, CU009]
    tableRefs: [TU003]
  - id: customer-diligence
    title: Customer diligence implications
    body: "Arena's customer moat depends on a feedback loop: real users create preference data, public rankings attract model developers and enterprise evaluators, and paid evaluation products can fund broader coverage and methodology work. The loop is promising, but it has two customer-side failure modes. First, public votes may reward style over correctness and may not represent enterprise-specific populations, so buyers still need internal ground-truth testing. Second, Arena sells evaluation services to companies whose models it ranks, creating a buyer-trust and independence question that can affect procurement and renewal. Independent sources also describe manipulation, sampling, and representativeness concerns. The next diligence step is not another logo count; it is a cohort-level customer schedule showing paid accounts, first contract date, renewal status, annual contract value bands, use case, and concentration, alongside evidence that private evaluations preserve methodological independence."
    claimRefs: [CU015, CU016, CU017, CU018]
