    columns: [Named organization or cohort, Segment, Deployment or use case, Production vs pilot, Outcome or evidence, Limitation]
    rows:
      - ["OpenAI", "Frontier model lab", "Model participation and leaderboard use", "Public evaluation/use; production contract not disclosed", "Independent profile identifies OpenAI as a regular provider user and says the leaderboard is cited by OpenAI", "No contract, spend, or renewal evidence"]
      - ["Anthropic", "Frontier model lab", "Evaluation-service use and leaderboard citation", "Use reported; production contract not disclosed", "OfficeChai reports use of LMArena evaluation services; Zeitgeist reports leaderboard citation", "No contract, spend, or renewal evidence"]
      - ["Google", "Frontier model lab", "Leaderboard citation", "Public evaluation/use; production contract not disclosed", "Zeitgeist reports that Google cites the leaderboard", "No disclosed service contract, spend, or renewal evidence"]
      - ["xAI", "Frontier model lab", "Leaderboard citation/use described by profile", "Public evaluation/use; production contract not disclosed", "Independent profile says the leaderboard is cited by xAI", "No independent renewal or outcome evidence"]
    enumerationScope:
      coverage: partial
      basis: "Four named model-provider relationships visible in assigned independent profiles as of the 2026-10-24 report date"
    notes: "Named participation or citation is retained as proof of relevance, not upgraded to a paid production deployment; no assigned source discloses contract status or customer economics."
    claimRefs: [CU010, CU011, CU013]
figures:
  - id: FU001
    title: Arena customer journey from community signal to paid evaluation
    type: journey-map
    summary: Arena's visible customer loop runs from community interactions through public rankings to model-lab and enterprise evaluation decisions, with retention and expansion still unverified.
    data:
      nodes:
        - id: community
          label: Community interaction
          title: Prompt, compare, vote
          touchpoints: [Blind pairwise responses, User preference votes]
          note: "Reported scale exceeds 5M monthly users and 60M monthly conversations in January 2026."
        - id: signal
          label: Preference data
          title: Aggregate real-world signal
          touchpoints: [Bradley-Terry or Elo-style ranking, Specialized arenas]
          note: "Signal quality depends on sampling, representativeness, and manipulation controls."
        - id: public
          label: Public benchmark
          title: Leaderboard visibility
          touchpoints: [Model comparison, Provider participation]
          note: "Independent sources identify major model providers as regular users or participants."
        - id: lab
          label: Model-lab evaluation
          title: Pre-release or comparative testing
          touchpoints: [Frontier model evaluation, Public and confidential testing]
          note: "Participation is visible; paid contract and renewal status are not disclosed."
        - id: enterprise
          label: Enterprise decision
          title: Model selection and governance
          touchpoints: [Human-preference analytics, Feedback samples, Delivery SLAs]
          note: "Commercial product is sold through contact pricing."
        - id: expansion
          label: Expansion and renewal
          title: Repeat evaluation relationship
          touchpoints: [Private evaluations, Alignment and agent-risk analysis]
          note: "Expansion is a plausible path, but NRR, GRR, churn, and attach rates are unavailable."
    claimRefs: [CU001, CU005, CU010, CU009]
callouts:
  - calloutType: strength
    title: Demand signal is unusually visible
    body: Millions of users, tens of millions of conversations, and named model-provider relevance give Arena stronger observable engagement than a typical private evaluation vendor.
    claimRefs: [CU005, CU006, CU010]
  - calloutType: risk
    title: Engagement is not retention
    body: The assigned evidence does not disclose paid-account cohorts, contract duration, renewals, NRR, GRR, churn, or customer concentration, so recurring revenue quality remains a material gap.
    claimRefs: [CU009, CU015, CU016]
  - calloutType: recommendation
    title: Underwrite the loop, then verify the economics
    body: Credit Arena for community scale and reference quality, but require a customer cohort schedule and independent governance evidence before treating the customer moat as durable.
    claimRefs: [CU017, CU018]
