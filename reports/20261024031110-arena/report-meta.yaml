companyProfile:
  summary: >-
    Arena is a private AI evaluation company that operates a public, user-voted comparison platform and sells evaluation
    analytics to model labs and enterprise teams. Its differentiation is a stream of real-world prompts, pairwise
    preferences, and task-specific research outputs, while the public record leaves commercial conversion, margin,
    governance, and enterprise-control details unresolved.
