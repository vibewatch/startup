  topStrengths:
    - Real-world preference data and task-specific evaluation coverage create a differentiated evidence asset.
    - The public platform and paid AI Evaluations offer a coherent free-to-paid data and distribution model.
    - Fresh financing and reported revenue traction provide resources for product and commercial scaling.
  topRisks:
    - Preference rankings may not reliably represent correctness, safety, or enterprise task performance.
    - Selling evaluations to model labs while ranking their systems creates a material independence and trust risk.
    - >-
      Revenue quality, retention, gross margin, customer concentration, cash burn, and runway are not publicly
      disclosed.
  unresolvedGaps:
    - >-
      Revenue-quality proof needed: NRR/GRR, cohort retention, contract duration, gross margin, and customer
      concentration.
    - >-
      Governance proof needed: anti-gaming controls, privacy posture, methodology oversight, and enterprise trust
      artifacts.
    - >-
      Commercial-structure proof needed: pricing, attach rates from community traffic, and how often customers
      standardize on Arena versus multi-home.
