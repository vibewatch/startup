      - [AI Evaluations, "Freemium / contact for pricing", "Human-preference analytics, tradeoffs, feedback samples and SLAs", "Price, minimum commitment and discounting unknown", "Cannot calculate ACV, price realization or gross profit"]
      - [Specialized arenas, "Included in commercial description; contract terms unknown", "Web, search, vision and coding comparisons", "Packaging and incremental pricing unknown", "Need product-level attach and usage economics"]
      - [Private evaluation work, "Sales-led engagement; terms unknown", "Confidential or proprietary-data testing described by analysts", "Scope, delivery cost and margin unknown", "Need signed contract samples and contribution-margin bridge"]
    notes: "Official terms confirm the service exists and an external product description reports freemium/contact pricing; neither establishes realized prices, discounts, contract duration or revenue recognition."
    claimRefs: [CI004, CI008, CI011]
  - id: TI003
    title: Unit-economics evidence and diligence requests
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Annualized revenue run rate, "$100M reported for June 2026", "Medium; third-party reporting of a company-reported figure", "Signals commercial traction but is not recognized revenue or ARR", "Monthly recognized revenue, bookings, deferred revenue and reconciliation"]
      - [Gross margin, null, "Unavailable", "Evaluation delivery and review intensity determine scalability", "Gross margin by public data, AI Evaluations and services"]
      - [CAC and payback, null, "Unavailable", "Sales-led enterprise growth may consume capital before renewal", "Fully loaded S&M spend, sourced pipeline, ACV, conversion and payback cohorts"]
      - [Net retention / churn, null, "Unavailable", "Repeatability determines whether the data asset becomes durable recurring revenue", "GRR, NRR, logo churn, expansion and cohort retention by product"]
      - ["Cash, burn and runway", null, "Unavailable", "Financing raised is not cash available and cannot establish capital adequacy", "Latest balance sheet, monthly cash burn, debt, covenants and runway case"]
      - ["Mature public-company reference", "Palantir FY2025: $4.475B revenue, 32% GAAP operating margin, 51% adjusted free-cash-flow margin", "High for Palantir; not an Arena metric", "Shows the operating leverage possible at a scaled AI/data software company", "Do not apply to Arena without an Arena-specific cost and revenue bridge"]
      - ["Usage-linked subscription reference", "Datadog subscriptions vary with hosts, data and other monitored resources", "Medium; comparator business-model description", "Illustrates a usage-linked contract structure that Arena could be tested against", "Confirm Arena's actual billing units, commitments and overage terms"]
    notes: "Null means the assigned public evidence did not disclose the Arena metric. The $100M figure is an annualized run rate, not ARR or recognized revenue; comparator rows are context only and no cash-burn estimate is inferred."
    claimRefs: [CI001, CI005, CI007, CI010, CI012]
