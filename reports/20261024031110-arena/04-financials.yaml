callouts:
  - calloutType: risk
    title: Public financial disclosure is insufficient for underwriting
    body: The reported annualized revenue and financing valuation are useful traction signals, but they do not disclose recognized revenue, cash, burn, margin, retention or customer concentration. A finance-grade decision requires the underlying contracts, cohort metrics and cash reconciliation.
    claimRefs: [CI001, CI007, CI012]
  - calloutType: insight
    title: The free-to-paid data flywheel is the central economic hypothesis
    body: The public arena can generate preference data and distribution, while paid evaluations monetize analytics and delivery. That hypothesis is commercially coherent, but conversion, pricing, delivery cost and repeatability remain unverified.
    claimRefs: [CI004, CI006, CI008, CI009]
