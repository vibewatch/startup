company:
  name: Arena
chapter:
  number: 4
  title: Financials
  summary: Arena has disclosed strong top-line signals—a reported $100 million annualized revenue run rate and a $3.1 billion valuation after its October 2026 financing—but public evidence does not disclose recognized revenue, gross margin, retention, customer concentration, or cash runway. The commercial model is credible as a paid evaluation service layered on a free, data-generating public arena, yet underwriting remains dependent on private financial diligence and on resolving methodology and conflict-of-interest risks.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: Arena appears to use a two-layer model. The public arena is a free service in which users compare third-party AI outputs side by side and vote, while AI Evaluations is a paid, sales-led service for model labs and enterprises. The commercial offer is described as analytics on model strengths, weaknesses and tradeoffs, representative feedback samples, specialized arenas and delivery SLAs. This structure can turn community activity into a proprietary data asset, but the available evidence does not separate subscription, project, usage-based, licensing or other revenue streams. A reported $100 million annualized run rate is a company-reported annualization, not a disclosed recognized-revenue figure, and should not be treated as ARR without contract and accounting support.
    claimRefs: [CI001, CI004, CI005, CI006, CI007, CI008, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics
    title: Unit economics and cost drivers
    body: The model has attractive potential operating leverage because the free product creates evaluation data and distribution before a paid engagement is sold, but the public record does not quantify the conversion funnel or delivery cost. Relevant cost centers likely include human-review and judge operations, data quality and moderation, model/API infrastructure, privacy and security controls, customer-specific evaluation work, and enterprise sales. Those are analytical cost categories rather than disclosed amounts. Arena job listings indicate investment in low-latency infrastructure, usage metering, audit logging, customer integrations and pricing or packaging operations. Palantir's reported public-company margins and Datadog's usage-linked subscription model provide reference points, not evidence of Arena's own economics.
    claimRefs: [CI005, CI009, CI010, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: Arena announced a $200 million Series B at a $3.1 billion valuation on October 8, 2026, and external coverage says the company had reached a $100 million annualized run rate by June. FundedIQ records a 51–100 employee band and explains that its financing totals include disclosed amounts rather than estimates. The evidence does not disclose cash, debt, burn, runway, financing covenants, a quantified use-of-proceeds allocation or a next-round trigger. Capital adequacy therefore looks stronger than the prior private-company baseline, but runway and dilution cannot be underwritten from financing raised or annualized revenue alone.
    claimRefs: [CI001, CI002, CI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: Arena has a plausible path to high gross-margin data and evaluation revenue, but the public evidence is not sufficient to determine revenue quality or margin durability. The largest underwriting issue is not whether demand exists; it is whether public-arena activity converts into repeatable, contracted enterprise revenue after the costs of evaluation, review, infrastructure and customer delivery. Public pricing is listed as freemium or contact for pricing, and an external synthesis explicitly identifies the absence of list pricing and the conflict created when Arena evaluates labs that may also buy its services. Methodological criticism that preference voting can reward style over correctness adds a commercial-retention risk if customers require ground-truth correctness. Diligence should prioritize monthly recurring or contracted revenue by cohort, renewal and expansion, gross margin by product, CAC and payback, customer concentration, cash and burn, and the separation of public-ranking governance from paid evaluation work.
    claimRefs: [CI011, CI012, CI013, CI014]
