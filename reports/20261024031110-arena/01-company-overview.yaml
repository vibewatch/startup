company:
  name: Arena
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Arena has progressed from a 2023 UC Berkeley research project to a commercial
    AI-evaluation company that reportedly raised a $200 million Series B at a
    $3.1 billion valuation in October 2026. The financing and company-reported
    annualized-revenue milestone indicate rapid scale, but governance, workforce,
    customer concentration, and revenue-quality evidence remain private.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Arena traces its operating foundation to Chatbot Arena, a UC Berkeley
      research project launched in 2023 around blind, pairwise human-preference
      comparisons. The project became an independent company in April 2025, and
      third-party product research identifies the legal entity as Arena
      Intelligence Inc. in San Francisco. Arena introduced paid AI Evaluations
      in September 2025 for model developers and enterprises, monetizing
      analytics and evaluation services grounded in community comparisons while
      keeping a public comparison surface. This creates a two-sided operating
      model: public users supply interactions and votes, while laboratories and
      enterprises pay for deeper evaluation. The distinction matters because
      company-reported annualized revenue is neither audited revenue nor ARR,
      and reported funding is not equivalent to cash currently available.
    claimRefs: [CO001, CO002, CO003, CO004, CO012, CO013, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public evidence consistently names Anastasios Angelopoulos as co-founder
      and CEO, Wei-Lin Chiang as co-founder and CTO, and UC Berkeley professor
      Ion Stoica as co-founder and adviser. Their research, distributed-systems,
      and company-building backgrounds provide direct founder-market fit for an
      AI-evaluation platform. They also create material key-person dependence:
      the public record reviewed here does not identify a board, independent
      directors, executive bench, voting rights, or succession arrangements.
      The available leadership evidence therefore establishes functional
      coverage, not governance sufficiency. Investor diligence should request a
      current organization chart, board minutes and observer rights, founder
      vesting and voting terms, and named owners for methodology integrity,
      security, privacy, and commercial conflicts.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholders
    body: >-
      Arena's reported financing accelerated from a $100 million seed round in
      May 2025 at a $600 million valuation to a $150 million Series A in January
      2026 at a $1.7 billion post-money valuation, then to a $200 million Series
      B in October 2026 at a reported $3.1 billion valuation. The three disclosed
      rounds imply roughly $450 million raised, not $450 million of available
      cash. The latest round brought two co-leads and several strategic or
      financial investors, but the evidence does not disclose ownership,
      liquidation preferences, board seats, secondary transactions, debt, or
      remaining cash. Those omissions prevent an assessment of control,
      preference overhang, or runway despite the headline valuation step-up.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-credibility
    title: Milestones and credibility
    body: >-
      Arena's timeline combines unusually rapid commercialization with a
      continuing credibility obligation. The 2024 peer-reviewed Chatbot Arena
      paper documented the original pairwise method and more than 240,000 votes;
      by 2026 the company reported 350 million sessions, 62 million votes, and
      more than $100 million in annualized revenue. Conversely, a 2025 research
      paper reported private-testing, selective-disclosure, sampling, and data
      access asymmetries that could distort rankings. A separate TechCrunch
      tracker described Arena as founded in 2022, conflicting with the
      project-to-company chronology in other sources. These issues do not negate
      scale, but they make methodology governance and corporate-history
      verification essential parts of diligence.
    claimRefs: [CO001, CO002, CO008, CO009, CO010, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
