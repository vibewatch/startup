callouts:
  - calloutType: strength
    title: Rapid commercial validation
    body: >-
      The company says annualized revenue exceeded $100 million within eight
      months of launching paid evaluations, while the latest financing valued
      Arena at $3.1 billion.
    claimRefs: [CO010, CO012]
  - calloutType: risk
    title: Neutrality is part of the product
    body: >-
      Arena sells evaluation services to an industry whose models it ranks, and
      independent research has reported unequal private-testing and data-access
      conditions. Methodology governance therefore affects both product trust
      and enterprise value.
    claimRefs: [CO003, CO015]
