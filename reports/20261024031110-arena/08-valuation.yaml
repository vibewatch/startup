        - id: commercial-proof
          label: Commercial proof
          value: "$100M reported annualized run-rate, not audited revenue"
        - id: governance-test
          label: Governance test
          value: "Replication, sampling, judge validation, and conflict controls"
        - id: valuation-test
          label: Entry test
          value: "Reconcile $2.88B-$3.1B and inspect preferences and dilution"
        - id: recommendation
          label: Decision
          value: research-more
      edges:
        - [market-need, platform-scale]
        - [platform-scale, commercial-proof]
        - [commercial-proof, governance-test]
        - [governance-test, valuation-test]
        - [valuation-test, recommendation]
    approximationNotes: "The flow is qualitative and does not imply conversion rates, probabilities, or a derived fair value."
    claimRefs: [CV003, CV007, CV012, CV014, CV015, CV016]

callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: >-
      The category thesis is credible, but the public record cannot support a price-insensitive
      investment at the reported valuation. Require a term-sheet reconciliation, revenue-quality
      bridge, customer cohorts, and independent methodology evidence before underwriting.
    claimRefs: [CV002, CV003, CV015, CV016]
  - calloutType: risk
    title: Revenue is not ARR
    body: >-
      Sources describe $100 million of annualized run-rate revenue. That metric extrapolates a
      recent pace; it is not audited revenue, contracted ARR, cash available, or proof of
      retention.
    claimRefs: [CV003, CV004]

