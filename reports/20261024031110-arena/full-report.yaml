      - number: '5.2'
        title: Architecture signals and operating maturity
        blocks:
          - type: paragraph
            body: >-
              The evidenced architecture is a data-and-ranking pipeline rather than only a leaderboard interface. The
              Search Arena paper documents anonymized side-by-side outputs, multi-turn interactions, votes, conversation
              histories, model identities, retrieved URLs, and system metadata. A company-authored job description
              reposted by Simplify calls for production pipelines that ingest and transform vote data into evaluation
              features and produce dashboards and reports while maintaining integrity, quality, reliability, and scale.
              Its references to SQL, Python, Scala, R, Spark, Ray Data, Databricks, and Snowflake are hiring
              requirements or examples, not proof that any named technology is deployed. The retained evidence does not
              expose model-serving topology, tenancy, observability, or measured uptime.
            claimRefs:
              - CE005
              - CE006
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE010
              - CE011
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
