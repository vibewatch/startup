  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer economics
        blocks:
          - type: paragraph
            body: >-
              Arena's addressable market is narrower than the entire AI software market. The defensible core is paid
              comparative evaluation of foundation models and agents: buyers pay for evidence about capability, task
              fit, safety behavior, and tradeoffs before standardizing a model or approving an agent workflow. Arena's
              free public arena is an acquisition and data-collection surface, while AI Evaluations is the commercial
              layer. TechCrunch reports that the service provides deep-dive analytics from Arena's community and that
              customers are charged for consumption, not a recurring subscription; therefore reported annualized revenue
              should not be treated as ARR. The adjacent spend includes internal evaluation teams, human labeling and
              red-teaming, model-governance platforms, and cloud-provider testing. Arena competes for that budget rather
              than replacing every governance or correctness workflow. The key buyer is a Head of AI, ML-platform
              leader, model lab, or AI-governance team that needs external comparative evidence; the payer is usually an
              enterprise AI or model-development budget owner, while end users include evaluators, developers, and risk
              reviewers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a clean Arena-specific TAM, SAM, or SOM. A decision-intelligence market
              forecast is a broad adjacency, not a direct evaluation-market estimate: Grand View Research reports USD
              17.8 billion in 2025 revenue, USD 20.7 billion in 2026, and USD 53.2 billion by 2033, with a 14.4% CAGR
              from 2026 to 2033. That lens captures a wider set of analytics and automated decision systems than Arena
              sells. A second lens is budget competition: TechCrunch says Arena competes for the same dollar as
              human-labeling providers such as Mercor, Surge, and Scale AI, while ISG lists 33 providers in its agentic
              and generative AI guide and 32 in its AI-agents guide. The third lens is adoption readiness: Forrester
              says three-quarters of enterprise leaders report adopting agentic AI, but only a small minority have
              meaningful production deployments, while Observer describes a gap between vendor promises and operational
              reality. These lenses support a large and expanding budget pool but do not justify converting adjacent
              market values into Arena's obtainable share.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Adoption drivers, constraints, and diligence
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by model proliferation, agentic workflows, and the need to test systems outside static
              benchmarks. Arena says its public process collects prompts, compares anonymous model answers, and uses
              votes to shape leaderboards; the company also publishes open datasets and research. Its commercial
              evidence points to a network effect: TechCrunch reports more than 10 million user evaluations, while the
              October financing coverage reports 350 million platform sessions, 62 million votes, and tens of millions
              of monthly visitors from more than 150 countries. Those are company-reported or reported-company metrics
              and demonstrate scale, not necessarily paid conversion or durable pricing power. Constraints are equally
              material. Preference is not correctness; the independent market commentary flags style-versus-substance
              criticism and a conflict risk because Arena sells evaluations to companies it ranks. Forrester and
              Observer identify governance, data readiness, observability, ROI uncertainty, and operating-model redesign
              as barriers to agent deployment. Arena therefore needs repeatable evidence that its samples represent a
              buyer's workflow, that private evaluations protect confidential data, and that customers renew or expand
              consumption.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM010
