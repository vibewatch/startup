  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and customer alternatives
        blocks:
          - type: paragraph
            body: >-
              Arena competes across several jobs rather than one software category. The public arena and leaderboard
              address rapid model shortlisting through anonymous, head-to-head human preference. The paid AI Evaluations
              service extends that signal to model labs and enterprises, while Agent Arena broadens the unit of
              evaluation to multi-step work. Direct alternatives include internal evaluation harnesses and specialist
              benchmark programs; adjacent alternatives include Langfuse's production tracing and evaluation loop,
              Fiddler's inline controls and governance, and Arthur's runtime security and lifecycle observability.
              Thomson Reuters' Open Arena shows a different substitute: an enterprise can build a no-code
              model-selection and workflow environment inside its own governed platform. Status quo remains manual
              side-by-side testing, vendor demos, and spreadsheet-based decisions. This breadth makes Arena a
              decision-intelligence layer, but it also exposes it to budget owners who may prefer an integrated control
              plane or an internally owned benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Buyer comparison on capabilities, distribution, and trust
        blocks:
          - type: paragraph
            body: >-
              Arena's strongest buying proposition is a common comparison method across commercial and open-weight
              models, using fresh user interactions and a public signal that can attract both evaluators and model
              providers. Independent descriptions emphasize pairwise voting, Bradley-Terry-style ranking, specialized
              arenas, and paid analytics with representative feedback samples. Competitors win on different criteria:
              Langfuse emphasizes open-source portability and production traces; Fiddler emphasizes inline enforcement,
              low latency, and auditable governance; Arthur emphasizes agent inventory, behavioral analytics, policy,
              and cost control; Open Arena emphasizes enterprise security, data separation, and no-code workflow
              deployment. These are not interchangeable scores. A buyer seeking a shortlist may value Arena's breadth,
              while a regulated production team may value enforcement, lineage, or private deployment more. Arena
              therefore needs to prove that preference data changes a production decision beyond what an internal test
              set or an observability platform can provide.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Arena's potential moat is cumulative rather than contractual: a large stream of real prompts, votes, model
              coverage, public visibility, and methodological familiarity can improve the usefulness of its rankings and
              attract more participants. The same network can be weakened if model providers submit specially tuned
              variants, if sampling is skewed, or if buyers require domain-grounded correctness and production telemetry
              that preference votes do not measure. Public evidence also points to a conflict-of-interest risk because
              the evaluation business serves labs whose models appear in public rankings. Switching costs are moderate
              for a buyer that can export prompts and recreate tests, but higher for a provider that values Arena's
              distribution, benchmark visibility, and accumulated comparative history. Internal build and incumbent
              platform responses remain credible because the underlying workflow—collect prompts, run models, judge
              outputs, trace failures, and enforce policy—can be assembled from existing tools.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP014
              - CP015
      - number: '3.4'
        title: Competitive verdict and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Arena appears differentiated as a high-distribution preference and evaluation network, not as a complete
              enterprise AI control plane. Its best defensible wedge is cross-model comparison on realistic
              interactions, especially when a buyer needs a fast shortlist or a model lab wants an external signal. Its
              weakest position is where the buyer needs ground-truth correctness, private deployment, runtime policy
              enforcement, cost telemetry, or audit-ready lineage in one system. The competitive outcome therefore
              depends on product packaging and trust: private arenas, auditable samples, task-specific evaluation, and
              clear methodology could convert community scale into durable enterprise value; vague pricing, overlap with
              observability and governance platforms, or persistent evidence of style-over-correctness could make Arena
              a top-of-funnel feature rather than a system of record. Public evidence does not yet establish customer
              retention, realized pricing, or exclusive data rights, so those are material underwriting gaps.
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Preference data can be displaced by domain truth
            body: >-
              Buyers in high-stakes workflows may prefer labeled internal tests, runtime telemetry, and enforceable
              policy over a general preference leaderboard.
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP012
          - type: callout
            title: Validate the enterprise wedge
            body: >-
              Diligence should request cohort retention, realized pricing, private-arena repeat usage, methodology
              controls, and examples where Arena changed a production model decision.
            calloutType: recommendation
            claimRefs:
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Arena appears to use a two-layer model. The public arena is a free service in which users compare
              third-party AI outputs side by side and vote, while AI Evaluations is a paid, sales-led service for model
              labs and enterprises. The commercial offer is described as analytics on model strengths, weaknesses and
              tradeoffs, representative feedback samples, specialized arenas and delivery SLAs. This structure can turn
              community activity into a proprietary data asset, but the available evidence does not separate
              subscription, project, usage-based, licensing or other revenue streams. A reported $100 million annualized
              run rate is a company-reported annualization, not a disclosed recognized-revenue figure, and should not be
              treated as ARR without contract and accounting support.
            claimRefs:
