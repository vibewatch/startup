        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently names Anastasios Angelopoulos as co-founder and CEO, Wei-Lin Chiang as
              co-founder and CTO, and UC Berkeley professor Ion Stoica as co-founder and adviser. Their research,
              distributed-systems, and company-building backgrounds provide direct founder-market fit for an
              AI-evaluation platform. They also create material key-person dependence: the public record reviewed here
              does not identify a board, independent directors, executive bench, voting rights, or succession
              arrangements. The available leadership evidence therefore establishes functional coverage, not governance
              sufficiency. Investor diligence should request a current organization chart, board minutes and observer
              rights, founder vesting and voting terms, and named owners for methodology integrity, security, privacy,
              and commercial conflicts.
