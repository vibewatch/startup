chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Arena traces its operating foundation to Chatbot Arena, a UC Berkeley research project launched in 2023
              around blind, pairwise human-preference comparisons. The project became an independent company in April
              2025, and third-party product research identifies the legal entity as Arena Intelligence Inc. in San
              Francisco. Arena introduced paid AI Evaluations in September 2025 for model developers and enterprises,
              monetizing analytics and evaluation services grounded in community comparisons while keeping a public
              comparison surface. This creates a two-sided operating model: public users supply interactions and votes,
              while laboratories and enterprises pay for deeper evaluation. The distinction matters because
              company-reported annualized revenue is neither audited revenue nor ARR, and reported funding is not
              equivalent to cash currently available.
