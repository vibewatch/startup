      - number: '4.2'
        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              The model has attractive potential operating leverage because the free product creates evaluation data and
              distribution before a paid engagement is sold, but the public record does not quantify the conversion
              funnel or delivery cost. Relevant cost centers likely include human-review and judge operations, data
              quality and moderation, model/API infrastructure, privacy and security controls, customer-specific
              evaluation work, and enterprise sales. Those are analytical cost categories rather than disclosed amounts.
              Arena job listings indicate investment in low-latency infrastructure, usage metering, audit logging,
              customer integrations and pricing or packaging operations. Palantir's reported public-company margins and
              Datadog's usage-linked subscription model provide reference points, not evidence of Arena's own economics.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI007
              - CI010
              - CI012
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Arena announced a $200 million Series B at a $3.1 billion valuation on October 8, 2026, and external
              coverage says the company had reached a $100 million annualized run rate by June. FundedIQ records a
              51–100 employee band and explains that its financing totals include disclosed amounts rather than
              estimates. The evidence does not disclose cash, debt, burn, runway, financing covenants, a quantified
              use-of-proceeds allocation or a next-round trigger. Capital adequacy therefore looks stronger than the
              prior private-company baseline, but runway and dilution cannot be underwritten from financing raised or
              annualized revenue alone.
            claimRefs:
              - CI001
              - CI002
              - CI003
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Arena has a plausible path to high gross-margin data and evaluation revenue, but the public evidence is
              not sufficient to determine revenue quality or margin durability. The largest underwriting issue is not
              whether demand exists; it is whether public-arena activity converts into repeatable, contracted enterprise
              revenue after the costs of evaluation, review, infrastructure and customer delivery. Public pricing is
              listed as freemium or contact for pricing, and an external synthesis explicitly identifies the absence of
              list pricing and the conflict created when Arena evaluates labs that may also buy its services.
              Methodological criticism that preference voting can reward style over correctness adds a
              commercial-retention risk if customers require ground-truth correctness. Diligence should prioritize
              monthly recurring or contracted revenue by cohort, renewal and expansion, gross margin by product, CAC and
              payback, customer concentration, cash and burn, and the separation of public-ranking governance from paid
              evaluation work.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public financial disclosure is insufficient for underwriting
            body: >-
              The reported annualized revenue and financing valuation are useful traction signals, but they do not
              disclose recognized revenue, cash, burn, margin, retention or customer concentration. A finance-grade
              decision requires the underlying contracts, cohort metrics and cash reconciliation.
            calloutType: risk
            claimRefs:
              - CI001
              - CI007
              - CI012
          - type: callout
            title: The free-to-paid data flywheel is the central economic hypothesis
            body: >-
              The public arena can generate preference data and distribution, while paid evaluations monetize analytics
              and delivery. That hypothesis is commercially coherent, but conversion, pricing, delivery cost and
              repeatability remain unverified.
            calloutType: insight
            claimRefs:
              - CI004
              - CI006
              - CI008
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and module map
        blocks:
          - type: paragraph
            body: >-
              Arena's public workflow begins with a user prompt, presents two anonymous model responses, records a
              preferred answer, and reveals model identities after voting. The official surface lists separate
              experiences for chat, text, web development, search, images, video, direct model use, and side-by-side
              comparison. An independent product review describes a paid AI Evaluations layer for model labs and
              enterprise teams, including strength-and-tradeoff analytics, representative feedback samples, and delivery
              commitments. This creates a coherent product ladder from free interaction and public leaderboards to
              task-specific research assets and commercial analysis, while public contract scope, list pricing, and
              enterprise implementation detail remain thin.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
