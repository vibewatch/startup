  - id: FU001
    title: Arena customer journey from community signal to paid evaluation
    type: journey-map
    summary: >-
      Arena's visible customer loop runs from community interactions through public rankings to model-lab and enterprise
      evaluation decisions, with retention and expansion still unverified.
    data:
      nodes:
        - id: community
          label: Community interaction
          title: Prompt, compare, vote
          touchpoints:
            - Blind pairwise responses
            - User preference votes
          note: Reported scale exceeds 5M monthly users and 60M monthly conversations in January 2026.
        - id: signal
          label: Preference data
          title: Aggregate real-world signal
          touchpoints:
            - Bradley-Terry or Elo-style ranking
            - Specialized arenas
          note: Signal quality depends on sampling, representativeness, and manipulation controls.
        - id: public
          label: Public benchmark
          title: Leaderboard visibility
          touchpoints:
            - Model comparison
            - Provider participation
          note: Independent sources identify major model providers as regular users or participants.
        - id: lab
          label: Model-lab evaluation
          title: Pre-release or comparative testing
          touchpoints:
            - Frontier model evaluation
            - Public and confidential testing
          note: Participation is visible; paid contract and renewal status are not disclosed.
        - id: enterprise
          label: Enterprise decision
          title: Model selection and governance
          touchpoints:
            - Human-preference analytics
            - Feedback samples
            - Delivery SLAs
          note: Commercial product is sold through contact pricing.
        - id: expansion
          label: Expansion and renewal
          title: Repeat evaluation relationship
          touchpoints:
            - Private evaluations
            - Alignment and agent-risk analysis
          note: Expansion is a plausible path, but NRR, GRR, churn, and attach rates are unavailable.
