              - CE003
              - CE004
              - CE012
              - CE014
      - number: '5.3'
        title: Research differentiation and technical proof
        blocks:
          - type: paragraph
            body: >-
              Arena's technical differentiation rests on fresh, real-world human comparisons and reusable interaction
              data. Search Arena reports 24,069 conversations and 12,652 paired judgments from 11,650 users across 136
              countries and 13 models, while the original Berkeley project describes the broader pairwise, crowdsourced
              evaluation method and an early corpus exceeding 240,000 votes. Search Arena extends that foundation into
              search-intensive, multilingual, multi-turn tasks and documents a richer trace surface than static
              benchmarks. The same paper also finds that citation count can influence preferences even when cited
              content is irrelevant, so preference scale is not equivalent to correctness, factual grounding, or
              customer-specific task success.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
      - number: '5.4'
        title: Trust controls, roadmap, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The Search Arena authors report anonymized responses, randomized left-right placement, interaction-time
              consent, and a strict privacy policy for the studied collection period. Those research controls do not
              establish the security posture of private enterprise evaluations. A third-party review characterizes
              deployment as cloud-only and reports no public list price or detailed engagement scope, while another
              report says Arena planned to scale engineering, research, platform operations, and community initiatives.
              The principal product risk is measurement governance: The Leaderboard Illusion reports private-testing and
              sampling asymmetries, and Remio argues that serving model labs while measuring them raises disclosure and
              reproducibility requirements. Security certifications, data isolation, incident history, retention terms,
              and independently audited ranking controls remain diligence gaps rather than presumed capabilities or
              failures.
            claimRefs:
              - CE007
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A research-backed evaluation loop
            body: >-
              Arena combines a public blind-comparison workflow with task-specific datasets, metadata, and commercial
              analysis rather than relying on a static benchmark alone.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
          - type: callout
            title: Preference scale does not settle validity
            body: >-
              Published research shows that user preference can diverge from citation support and that provider access
              and private testing can distort leaderboard comparability.
            calloutType: risk
            claimRefs:
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs
        blocks:
          - type: paragraph
            body: >-
              Arena serves two linked populations. The first is a broad community of people who submit prompts, compare
              anonymous model responses, and vote; this population supplies the preference data asset and creates
              recurring public traffic. The second is the paying evaluation market: model labs, enterprise AI teams, and
              governance or platform leaders that need comparative evidence before selecting or releasing a model.
              Public sources describe the buyer as a head of AI or ML platform lead choosing among frontier and
              open-weight models, and describe use cases spanning chat, coding, search, vision, and agent workflows.
              That segmentation is commercially coherent because community activity creates the raw signal while paid
              evaluations monetize analytics, feedback samples, and delivery commitments. It does not, however,
              establish how many community participants convert to paid accounts or whether the same labs repeatedly
              purchase evaluations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
      - number: '6.2'
        title: Adoption and proof of use
        blocks:
          - type: paragraph
            body: >-
              The public adoption record is substantial but mixes engagement units that should not be treated as
              interchangeable customer metrics. A January 2026 company release reported more than 5 million monthly
              users across 150 countries and more than 60 million conversations per month; a September 2026 independent
              profile reported more than 5 million monthly active users and tens of millions of votes; and an October
              2026 report attributed 350 million sessions, 62 million votes, and 7 million Agent Arena sessions to the
              company. These figures demonstrate reach and repeated usage, but they do not disclose active paid
              accounts, conversion, cohort retention, or the denominator for enterprise adoption. The commercial product
              launched with evaluation analytics, auditable feedback samples, and delivery SLAs, yet pricing remains
              contact-only and public proof of renewals is absent.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU009
      - number: '6.3'
        title: Named proof, durability, and expansion
        blocks:
          - type: paragraph
            body: >-
              Named proof is strongest at the model-lab and public-benchmark layer. Independent coverage reports that
              OpenAI and Anthropic use LMArena's evaluation services, while a separate company profile says the
              leaderboard is cited by OpenAI, Google, Anthropic, and xAI. This is meaningful evidence of relevance and
              repeated evaluation, but it is not the same as a disclosed production contract, renewal, or customer
              outcome. Arena also markets private or confidential evaluations and specialized arenas, which could
              support land-and-expand from public benchmarking into proprietary testing, but no source in the assigned
              pool discloses contract length, net retention, gross retention, churn, attach rates, revenue by customer,
              or top-account concentration. The appropriate underwriting stance is to credit demand and reference
              quality while carrying revenue quality as an unresolved diligence item.
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Customer diligence implications
        blocks:
          - type: paragraph
            body: >-
              Arena's customer moat depends on a feedback loop: real users create preference data, public rankings
              attract model developers and enterprise evaluators, and paid evaluation products can fund broader coverage
              and methodology work. The loop is promising, but it has two customer-side failure modes. First, public
              votes may reward style over correctness and may not represent enterprise-specific populations, so buyers
              still need internal ground-truth testing. Second, Arena sells evaluation services to companies whose
              models it ranks, creating a buyer-trust and independence question that can affect procurement and renewal.
              Independent sources also describe manipulation, sampling, and representativeness concerns. The next
              diligence step is not another logo count; it is a cohort-level customer schedule showing paid accounts,
              first contract date, renewal status, annual contract value bands, use case, and concentration, alongside
              evidence that private evaluations preserve methodological independence.
            claimRefs:
              - CU015
              - CU016
              - CU017
              - CU018
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand signal is unusually visible
            body: >-
              Millions of users, tens of millions of conversations, and named model-provider relevance give Arena
              stronger observable engagement than a typical private evaluation vendor.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU010
          - type: callout
            title: Engagement is not retention
            body: >-
              The assigned evidence does not disclose paid-account cohorts, contract duration, renewals, NRR, GRR,
              churn, or customer concentration, so recurring revenue quality remains a material gap.
            calloutType: risk
            claimRefs:
              - CU009
              - CU015
              - CU016
          - type: callout
            title: Underwrite the loop, then verify the economics
            body: >-
              Credit Arena for community scale and reference quality, but require a customer cohort schedule and
              independent governance evidence before treating the customer moat as durable.
            calloutType: recommendation
            claimRefs:
              - CU017
              - CU018
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and investment implication
        blocks:
          - type: paragraph
            body: >-
              Arena sits in a high-trust position between model suppliers, enterprise buyers, and the users whose
              comparisons generate its data. Public evidence shows both the value and the fragility of that position:
              preference can differ from factual correctness, style can be difficult to separate from substance, and a
              composite alignment score cannot substitute for testing in a buyer's own environment. The qualitative
              heatmap therefore treats methodological credibility and commercial independence as the principal thesis
              risks. Fresh financing and reported annualized run-rate revenue improve capacity to invest, but neither
              establishes cash availability, profitability, control maturity, or durable customer economics. The
              investment posture should remain diligence-led until independent replication, control evidence, and
              financial quality are visible.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR008
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Governance, legal, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              No retained public source establishes a current Arena enforcement action, lawsuit, required license, or
              completed compliance certification. That absence is an evidence gap, not proof that no issue exists. The
              more immediate governance exposure is representational: enterprise buyers may over-read a preference or
              alignment ranking unless Arena discloses sampling, eligibility, scoring, automated-judge validation,
              commercial relationships, and version changes. NIST's voluntary AI risk framework supplies a credible
              control baseline, but it does not certify Arena. Expansion toward tool integrations and personal data
              raises privacy, permission, and security diligence requirements. A thesis break would be a material
              undisclosed conflict, regulator finding, or inability to document data rights and control ownership.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              Arena's operating model depends on converting heterogeneous human choices into stable, interpretable
              comparisons. The sources identify four failure paths: presentation style can dominate substance; rankings
              can be affected by access and strategic testing; automated judging and filtering can introduce opaque
              selection effects; and agent performance can change with prompts, tools, frameworks, and runtime
              configuration. These are not reasons to discard Arena's data, but they limit the scope of any single
              score. Mitigation maturity should be judged through reproducible methods, versioned samples, error
              analyses, abuse controls, and buyer-specific validation. Kill criteria are persistent unexplained sample
              changes, non-reproducible rankings, or a material ranking change tied to undisclosed methodology.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Partner, demand, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Arena's moat and its concentration risk arise from the same network: model labs supply systems and may buy
              evaluations, users supply prompts and votes, and enterprises must continue valuing external comparisons.
              Selective model participation, traffic mix changes, or commercial influence could weaken perceived
              neutrality. Demand is real but not automatic: McKinsey reports broader agent adoption alongside cost
              constraints, flat enterprise-level EBIT attribution, and software being built internally instead of
              bought. Arena's reported Series B and annualized run-rate revenue show access to capital and market pull,
              not margins or runway. Monitoring should focus on model coverage, vote concentration, repeat enterprise
              revenue, customer concentration, gross margin, cash burn, and whether buyers renew after internal
              validation.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence-led risk posture
            body: >-
              Do not treat funding, usage, or a leaderboard position as mitigation. Require reproducible methodology,
              enterprise control evidence, conflict governance, and revenue-quality data before reducing the risk
              rating.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR010
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Independent coverage agrees that Arena raised a $200 million Series B, but the reported post-money
              valuation is not internally consistent: TechCrunch, Superintelligence News, and Konsulteer report $3.1
              billion, while Dealroom reports $2.88 billion. That difference must be reconciled to the signed term sheet
              before setting an entry price. The headline economics are demanding under either figure. Against the
              reported $100 million annualized run-rate, the marks imply roughly 28.8x to 31.0x run-rate, not an
              audited-revenue multiple. Arena's January $1.7 billion Series A mark to the reported October $3.1 billion
              mark is an approximately 82% increase in about ten months. Public evidence does not establish recognized
              revenue, gross margin, retention, concentration, dilution, preferences, or secondary components, so a
              target return and exit value cannot be responsibly specified.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and governance
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Arena can turn broad human-preference activity into a recurring evaluation layer for
              model developers and enterprises. Its official Series A announcement reported more than 5 million monthly
              users and over 60 million monthly conversations, while third-party coverage describes a free public
              comparison product and a paid evaluation service. The anti-thesis is equally important: preference is not
              the same as domain correctness, public list pricing is unavailable, and Arena sells evaluation services
              into the same ecosystem that its leaderboards rank. Beri and Remio both identify independence or
              methodology concerns. Arena's newer alignment categories widen the potential product surface, but they do
              not remove the need for independent replication, transparent sampling, judge validation, conflict
              safeguards, and customer-level renewal evidence.
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framework and comparable signals
        blocks:
          - type: paragraph
            body: >-
              Recent frontier-AI financings show that private markets will fund scarce technical or data assets at
              multi-billion-dollar marks, but they are temperature checks rather than operating comparables for Arena.
              Tech.eu reported Recursive Superintelligence at a $4.65 billion valuation after raising more than $650
              million, while Crunchbase reported $4.5 billion after a $500 million Series A and also reported Ineffable
              Intelligence at $5.1 billion after a $1.1 billion seed. Those sources use different amounts for Recursive
              Superintelligence, reinforcing the need to avoid false precision. None supplies a defensible revenue,
              margin, or retention multiple for Arena. The scenario ranges below therefore use observed Arena financing
              marks as price references, not intrinsic-value estimates: above $3.1 billion requires evidence not public
              today; $2.88 billion to $3.1 billion is the reported current range; and $1.7 billion is a prior-round
              downside reference rather than a fair-value floor.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Recommendation, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence and high risk. Do not treat the reported
              financing mark as a buy signal. First reconcile the valuation definition and obtain the fully diluted cap
              table, liquidation preferences, option-pool treatment, pro rata rights, debt, and secondary details. Then
              bridge annualized run-rate to monthly recognized revenue, bookings, gross margin, contract duration,
              cohort retention, customer concentration, and cash conversion. Product diligence should test whether
              Arena's rankings reproduce across customer workloads and whether commercial relationships affect access,
              sampling, or publication. Thesis-break triggers are verified revenue materially below the reported
              run-rate, weak renewal or concentration economics, preference overhang, failed independent replication, or
              evidence that preference rankings do not support enterprise decisions. Until those tests clear, no public
              evidence supports a precise target return, hold period, or exit valuation.
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The category thesis is credible, but the public record cannot support a price-insensitive investment at
              the reported valuation. Require a term-sheet reconciliation, revenue-quality bridge, customer cohorts, and
              independent methodology evidence before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV015
              - CV016
          - type: callout
            title: Revenue is not ARR
            body: >-
              Sources describe $100 million of annualized run-rate revenue. That metric extrapolates a recent pace; it
              is not audited revenue, contracted ARR, cash available, or proof of retention.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
