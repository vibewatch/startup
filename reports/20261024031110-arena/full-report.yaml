      - - Base
        - Arena grows as one evaluation input alongside customer-specific tests; governance improves gradually.
        - Use the reported $2.88B-$3.1B range only as financing context and seek price or term protection.
        - Run-rate quality, pricing power, and renewal opacity.
        - Most consistent with the mixed public evidence.
      - - Bear
        - >-
          Preference rankings fail to predict customer outcomes, neutrality concerns slow adoption, or revenue quality
          disappoints.
        - >-
          Reversion toward the prior $1.7B financing mark implies roughly 41%-45% downside from the reported current
          range before dilution.
        - Down round, preference overhang, concentration, and weak replication.
        - Material; adverse mechanisms are visible but not quantified.
      - - No-invest trigger
        - Signed terms or diligence reveal heavy preferences, weak retention, or non-reproducible evaluation results.
        - Decline or reprice rather than assign a precise exit target without cash-flow evidence.
        - Private-market illiquidity can delay price discovery.
        - Directly testable in the data room and customer calls.
    notes: >-
      Scenario thresholds use reported Arena financing marks as price references, not intrinsic-value estimates;
      downside percentages are rounded arithmetic before dilution.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV012
      - CV013
      - CV015
