      - [Arena AI Evaluations, "Custom pricing; contact for pricing", "Structured or private evaluations, analytics, feedback samples, and delivery commitments described by retained sources", "Realized price, gross margin, and contract duration unknown", "Enterprise monetization is plausible but not transparent"]
      - [Langfuse, "Self-hosted and commercial plans; exact price not retained", "Tracing, evaluation, experiments, integrations, and open-source platform", "Plan economics not comparable to Arena engagement pricing", "Competes for AI engineering budget"]
      - [Fiddler AI, "Developer plan reported at $0.002 per trace; enterprise custom", "Observability, custom evaluators, guardrails, deployment flexibility", "Unit economics and discounts unknown", "Usage-based pricing makes runtime control measurable"]
      - [Arthur AI, "Pricing not disclosed in retained page", "Inventory, observability, security, policy, and cost controls", "Contract structure and deployment cost unknown", "Enterprise suite may bundle more control-plane functions"]
      - [Open Arena or internal build, "Cloud consumption or internal engineering cost", "No-code workflows, governance, model access, and domain-specific tests", "Total cost varies by architecture and staffing", "Build-versus-buy can cap Arena's pricing power"]
    notes: "Prices and packaging are source-reported snapshots, not realized revenue or directly comparable total cost of ownership."
