    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014]
callouts:
  - calloutType: risk
    title: Preference data can be displaced by domain truth
    body: Buyers in high-stakes workflows may prefer labeled internal tests, runtime telemetry, and enforceable policy over a general preference leaderboard.
    claimRefs: [CP003, CP011, CP012]
  - calloutType: recommendation
    title: Validate the enterprise wedge
    body: Diligence should request cohort retention, realized pricing, private-arena repeat usage, methodology controls, and examples where Arena changed a production model decision.
    claimRefs: [CP014, CP015]
