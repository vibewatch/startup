  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: enterprise-security
      missingEvidence: Customer-facing security documentation, certifications, data-processing terms, tenant-isolation design, and access controls for private evaluations.
      whyItMatters: Research-collection privacy controls do not establish how confidential enterprise prompts, outputs, and evaluation results are protected.
      diligencePath: Request the current security package, architecture review, DPA, subprocessor list, retention schedule, deletion controls, and penetration-test summary.
      relatedQuestionRefs: [QE006, QE007]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Primary uptime, latency, incident, support-response, recovery, and SLA-attainment records for public and commercial evaluation services.
      whyItMatters: A reported delivery SLA and a reliability-oriented job description do not demonstrate operational performance.
      diligencePath: Obtain status history, incident postmortems, support metrics, capacity tests, recovery objectives, and executed customer SLA reports.
      relatedQuestionRefs: [QE004, QE007]
    - type: conflicting-data
      severity: material
      topic: leaderboard-bias
      missingEvidence: Audited policies and data covering private tests, model variants, score retractions, model sampling, bot controls, and provider access.
      whyItMatters: Unequal exposure or selective disclosure can reduce comparability and weaken the commercial value of ranking-derived analytics.
      diligencePath: Review versioned admission and sampling policies, raw audit logs, conflict disclosures, and an independent reproducibility assessment.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: A primary, dated product roadmap with committed integrations, enterprise features, milestones, owners, and deprecation policy.
      whyItMatters: Broad expansion plans do not establish delivery timing or whether product breadth is supportable.
      diligencePath: Request the board-approved roadmap, product telemetry by surface, release criteria, staffing plan, and customer-prioritization process.
      relatedQuestionRefs: [QE008]
