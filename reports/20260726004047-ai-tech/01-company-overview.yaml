callouts:
- calloutType: strength
  title: Founder capital and commercial lineage reduce the need for early outside financing
  body: 'Ai.tech’s bootstrapped status is more credible than a generic self-funding claim because it sits on top of a publicly visible founder record: Directi, Skenzo, and especially the roughly $900 million Media.net exit. That prior liquidity event plausibly explains how Ai.tech could scale fast without a public VC round.'
  claimRefs:
  - CO005
  - CO012
  - CO013
  - CO014
- calloutType: risk
  title: Public-disclosure quality is weak relative to the headline valuation
  body: The company’s website gives a studio description and contact path but no board, no executive bench, no legal-entity map, and no city-level headquarters. Hurun’s valuation is useful as a visibility marker, yet it is explicitly an estimate rather than a disclosed financing round. That combination lowers confidence in any precise holdco valuation or governance assessment.
  claimRefs:
  - CO003
  - CO023
  - CO025
  - CO035
  - CO038
