company:
  name: Ai.tech
chapter:
  number: 1
  title: Company Overview
  summary: Ai.tech is a privately held AI startup studio and holding company founded in January 2022 by serial entrepreneur Divyank Turakhia. The strongest public evidence supports the company’s bootstrapped status, $1.5 billion Hurun-recognized valuation, and portfolio concentration in ad-tech assets such as Advertising.tech and Media.net, but public disclosure on headquarters, legal entities, and leadership depth remains thin.
sections:
- id: identity-and-structure
  title: Identity, scope, and public disclosure posture
  body: 'Ai.tech’s own public website is unusually sparse for a company carrying a 2025 unicorn valuation. The homepage describes the business as a startup studio and holding company dedicated to building AI- and machine-learning-powered businesses, invites both enterprises and builders to “build with us,” and routes most interaction through a generic contact flow and a restricted-access login. That supports a dual model: incubation of new ventures plus direct engagement with enterprise partners, but it does not disclose named executives, product lines, or operating metrics. Independent sources fill in more of the picture. Hurun, CNBC TV18, NewsBytes, and Entrepreneur India all describe Ai.tech as founded in January 2022 by Divyank Turakhia, bootstrapped, and worth roughly USD 1.5 billion by 2025. The same sources identify Media.net and Advertising.tech as the visible operating portfolio. The result is an unusual mix of high external visibility around valuation and founder reputation, paired
    with low first-party transparency on legal structure, governance, and precise operating footprint. For diligence purposes, that means the company can be identified confidently, but not yet fully mapped.'
  claimRefs:
