company:
  name: Ai.tech
chapter:
  number: 8
  title: Valuation
  summary: Ai.tech’s published $1.5 billion valuation is directionally plausible given the founder’s prior Media.net sale and the scale of ad-tech value pools, but public evidence does not disclose the current operating metrics needed to underwrite that mark with high confidence. The most defensible stance is fair-to-stretched with a meaningful transparency discount.
sections:
- id: published-anchor
  title: Published valuation anchor and what it does — and does not — prove
  body: 'The strongest public valuation anchor for Ai.tech is the USD 1.5 billion mark reported by ASK Private Wealth Hurun and repeated by multiple news summaries. That anchor matters because it puts Ai.tech firmly in the unicorn conversation and because it is tied to a specific report rather than vague founder aspiration. However, the same anchor does not provide the kind of proof that a priced financing round or a public market would provide. It is best understood as a recognized external estimate of value, not a transparent price discovery event. The company’s bootstrapped status reinforces that point: founder capital efficiency and historical asset-building are central to the narrative, but external investors have not publicly marked the equity on disclosed terms. That means the published mark is useful, yet insufficient on its own for a high-confidence investment judgment. The gap between recognition and price discovery is especially relevant for later-stage private underwriting.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV035
  - CV036
  tableRefs:
  - TV001
  figureRefs:
  - FV004
- id: historical-and-peer-context
  title: Historical asset context and public comparable frame
  body: The clearest historical support for Ai.tech’s valuation narrative is Media.net’s roughly $900 million 2016 sale. That transaction proves the founder has previously built an ad-tech asset with very large strategic value. But it is an imperfect present-day anchor because the sale happened years ago, the asset was later reacquired privately, and the reacquisition price is undisclosed. Public peer analysis fills part of the gap. The Trade Desk sets the premium benchmark for scaled independent ad-tech quality. DoubleVerify shows how measurement and verification layers can be valued. AppLovin illustrates the much stronger enthusiasm attached to AI-native, fast-growing ad-optimization narratives. Magnite, PubMatic, Criteo, Taboola, Index Exchange, Equativ, and Outbrain show the diversity of economics and market positions inside open-web ad tech. Together these peers validate that billion-dollar outcomes are possible in the category, but they also highlight how much public transparency matters
    when assigning value.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
