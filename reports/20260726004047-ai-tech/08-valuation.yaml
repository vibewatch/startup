  title: Scenario range table
  columns:
  - Scenario
  - Interpretation
  - Implied stance
  - What would need to be true
  rows:
  - - Low case
    - Headline value overstates current earnings power
    - Stretched / expensive
    - Current growth, margin, or concentration prove weaker than assumed
  - - Base case
    - Core assets are real and strategically relevant, but transparency discount remains high
    - Fair-to-stretched
    - Assets have healthy but not category-leading economics
  - - High case
    - Portfolio has stronger hidden growth, synergy, or scarcity than public evidence shows
    - Potentially fair
    - Management proves strong current metrics and strategic integration
  - - Downside trigger
    - Macro, policy, or partner shock compresses value rapidly
    - Negative reset risk
    - High dependence and low visibility combine badly
  - - Upside trigger
    - Current metrics or strategic bids validate hidden quality
    - Positive re-rating
    - Evidence of growth, margins, and buyer scarcity emerges
  notes: These scenarios are qualitative because current revenue, margin, and cash-flow metrics are not public.
