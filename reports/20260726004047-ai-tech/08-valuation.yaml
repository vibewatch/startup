- id: TV005
  title: Transparency gap table
  columns:
  - Missing metric
  - Why it matters
  - Impact on valuation
  - Exact diligence path
  rows:
  - - Current revenue
    - Core anchor for any multiple-based method
    - Very high
    - Request current revenue and gross spend bridge
  - - Gross margin / take rate
    - Determines quality of monetization economics
    - High
    - Request segment margins and take-rate trend
  - - Growth rate
    - Separates mature assets from premium-growth narratives
    - High
    - Request year-over-year revenue and spend growth
  - - NRR / retention
    - Shows durability and wallet share expansion
    - High
    - Request cohort retention and top-account expansion
  - - Cash flow / capital needs
    - Determines self-funding sustainability
    - High
    - Request cash generation, burn, and debt or obligations
  - - Reacquisition economics
    - Affects embedded cost basis and strategic value history
    - High
    - Request 2023 Media.net repurchase terms
  notes: The transparency gap is large enough that it should directly affect valuation confidence and recommendation.
