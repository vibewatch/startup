evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Named Ai.tech executive roster, board composition, and legal entity structure.
    whyItMatters: Governance quality and key-person dependence cannot be assessed cleanly without entity and leadership disclosures.
    diligencePath: Request org chart, board list, and incorporation documents directly from the company.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: A definitive city-level headquarters and legal domicile for Ai.tech.
    whyItMatters: >-
      Public sources point to an overseas HQ pattern but do not converge on one city, which complicates tax, governance,
      and operating-footprint analysis.
    diligencePath: Obtain incorporation records, audited legal-entity list, and management confirmation of headquarters location.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, profitability, customer count, and capital-allocation data for Ai.tech itself.
    whyItMatters: >-
      The company can be valued publicly only through sparse external estimates and portfolio proxies, which weakens
      conviction.
    diligencePath: >-
      Request management accounts, segment KPIs, and budget-to-actual performance for the holdco and each material
      subsidiary.
    relatedQuestionRefs:
      - QO005
      - QO009
  - type: conflicting-data
    severity: material
    topic: valuation-quality
    missingEvidence: Third-party support showing how the USD 1.5B valuation was derived outside Hurun’s minimum-estimate methodology.
    whyItMatters: >-
      The headline valuation is central to investment judgment but is not anchored to a disclosed equity round or
      independent appraisal.
    diligencePath: >-
      Ask for the valuation memo, internal mark methodology, and any secondary transaction reference points used by
      Hurun or management.
    relatedQuestionRefs:
      - QO005
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table
    missingEvidence: A complete list of Ai.tech operating leaders beyond Divyank Turakhia and broad portfolio references.
    whyItMatters: The chapter can only partially enumerate leadership coverage, which limits succession and bench analysis.
    diligencePath: Request biographies for subsidiary CEOs and corporate functional heads.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map TO003 coverage
    missingEvidence: >-
      A complete disclosure-grade stakeholder and ownership map for Ai.tech, including ownership percentages and formal
      governance rights.
    whyItMatters: >-
      The public record supports only a partial stakeholder map, which limits assessment of who controls capital
      allocation and major subsidiary decisions.
    diligencePath: >-
      Request the latest cap table, subsidiary ownership tree, and any governance-rights summary for material
      stakeholders.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table TO004 coverage
    missingEvidence: A fuller chronology of Ai.tech product launches, partnerships, and governance events after founding.
    whyItMatters: >-
      The chapter relies on a mixed founder-history and holdco timeline because direct Ai.tech milestones are
