      - number: '2.3'
        title: 买方图谱与采用逻辑
        blocks:
          - type: paragraph
            body: >-
              买方、用户和付款方格局是碎片化的，不是统一市场。卖方侧的核心客户是优质媒体方和广告运营团队，他们想要更高填充率、更高收益，并接触差异化需求。买方侧，代理商、媒体买手和品牌团队关注可衡量结果、上下文匹配和供应路径效率。广告技术中介和应用伙伴形成另一层：他们可能购买或集成优化与合规服务，而不只是购买库存。碎片化很重要，因为预算很少由一个企业软件负责人统一控制，往往分散在收入、交易、数据、增长和合规职能中。Media.net
              的广告主和媒体方页面显示，Ai.tech
              可见资产在意图信号、上下文匹配或精选优质库存能够改善结果时最强，而不是在普通开放交易所采买中拼纯覆盖。因此，当买方优先考虑精选、第一方信号集成和优质供应，而不是单纯追求覆盖规模时，采用率应当上升。
