  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与平台政策风险
        blocks:
          - type: paragraph
            body: >-
              最可见的外部风险位于浏览器政策、隐私法和反垄断的交叉处。Google 的 cookie 政策反转降低了一类即时冲击，但没有解决未来几年开放网络定向、归因和测量将如何运转。CMA 持续监督 Privacy
              Sandbox 承诺，说明浏览器基础设施仍是活跃监管领域；DOJ 对 Google 的反垄断胜诉，则通过补救措施和市场结构变化引入第二条扰动路径。这对 Ai.tech
              很重要，因为它的可见资产运行在广告业最暴露于外部基础设施规则的部分，而这些规则并不由它控制。Media.net 和 Advertising.tech
              可以通过上下文信号、第一方友好流程或隐私友好型测量适应变化，但无法消除这种依赖。投资判断因此应把浏览器和监管者决策视为核心业务变量，而不是遥远政策噪音。实际含义是，情景规划需要同时覆盖渐进式标准迁移和突发法律补救，因为任一路径都可能改变集成优先级、客户叙事和变现假设。
