  - id: TM006
    title: 结构性市场风险表
    columns:
      - 风险
      - 证据
      - 潜在影响
      - 当前判断
      - 下一步尽调动作
    rows:
      - - 市场报告口径冲突
        - 上下文广告与程序化广告报告定义不一
        - TAM 和估值模型会出现虚假精确
        - 影响重大，但可用区间测算管理
        - 估值前统一所有 TAM 数字口径
      - - Cookie 政策反转
        - Chrome 并未完全淘汰第三方 Cookie
        - 降低部分无 Cookie 叙事的紧迫性
        - 短期压制简单上下文营销
        - 测算无 Cookie 与启用 Cookie 流量的实际收入
      - - 平台集中
        - WARC 和 IAB 摘要显示大平台占主导
        - 预算份额和议价权仍然集中
        - 结构性风险
        - 按平台合作方量化流量和需求依赖
      - - Google 反垄断过渡
        - DOJ 胜诉可能触发救济
        - 基础设施扰动或机会冲击
        - 重要但未解的催化因素
        - 跟踪案件时间线和可能的救济方案
      - - 地域集中
        - Media.net 历史收入大多来自美国
        - 区域下行可能对收入造成不成比例的冲击
        - 很可能仍然成立
        - 索取当前地域收入组合
      - - 商业媒体替代
        - 零售媒体规模大且仍在增长
        - 开放网络支出可能被挤出
        - 真实存在，但不推翻投资假设
        - 建模时同时放入品类增长和预算转移
      - - 周期性
        - 宏观预测认为广告增速会低于 2024 年
        - 收入增长可能迅速收缩
        - 行业长期特征
        - 压力测试下行情景假设
    notes: 风险表几乎和支出表同样重要，因为市场方向比可触达份额更清楚。
