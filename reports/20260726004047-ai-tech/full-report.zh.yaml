  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资姿态与披露边界
        blocks:
          - type: paragraph
            body: >-
              Ai.tech
              的公开财务故事从缺失项开始。公司一贯被描述为自筹资金，已审阅公开来源没有披露定价的风险投资或成长股权融资轮。这很重要，因为它拿掉了私营公司通常给投资者提供的最强外部验证机制。因此，公开估值标记更多说明叙事认可和创始人声誉，而不是当前现金生成或利润率结构。公司是私营状态，也意味着没有公开审计报表、没有披露季度收入更新，也看不到债务或现金续航期披露。财务解读必须从资本结构和业务机制出发，而不是从标准报告指标出发。这种方法仍然有用，但必然降低信心，并提高保守假设的价值。实际后果是，即便是一些简单问题——公司当前是否产生现金、创始人资本是否仍在注入、是否有资产背负隐藏义务——也无法仅靠公开报告回答。
