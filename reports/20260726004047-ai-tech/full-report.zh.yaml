        - 替代变现模式
        - 呈现公开广告技术公司表现分化
        - 第一方数据位置不同
      - - Ai.tech
        - 私有控股公司估值估计
        - Hurun 认定的 $1.5B 估值
        - 要把可比公司质量和不透明折价一起算进去
        - 当前指标未披露
