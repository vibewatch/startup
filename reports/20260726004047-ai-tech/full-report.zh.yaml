  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Ai.tech 的市场不应被框成泛泛的人工智能软件。可见经营资产把公司放在广告技术基础设施层：它连接开放网络上的广告主、媒体方、代理商和变现伙伴。Media.net 将自己定位为同时服务广告主和媒体方的全球
              SSP；Advertising.tech 将自己定位为
              SSP、DSP、媒体方、广告网络和营销方的基础设施。这指向的核心市场包括开放网络媒体方变现、上下文和意图驱动定向、精选交易，以及配套流程或合规工具。广义数字广告支出相关，因为它是最上游的预算池；但其中很大一部分在围墙花园或零售商自有网络里，Ai.tech
              并没有明显拥有这些资产。因此，更合适的市场边界包括开放网络展示广告、原生广告、上下文广告、视频、应用变现，以及配套 SSP 或优化支出；同时排除大块社交广告、平台自有搜索和一般企业 AI 软件。
