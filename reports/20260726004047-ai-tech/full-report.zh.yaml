        blocks:
          - type: paragraph
            body: >-
              本章总体判断平衡但谨慎。Ai.tech
              似乎控制着具有商业相关性的广告技术资产，并且在没有明显外部融资依赖的情况下建立起来。这些都是实质性正面因素。公开记录也支持一个合理的变现模式，以及一位有过战略退出历史的创始人。但这一切都不能替代当前收入、增长、利润率、留存、现金流或集中度数据。实践中，公司应被视为可能有价值、也可能资本效率高，但财务透明度还不足以支撑高信心投资判断。因此，投资者应把公司当前财务质量视为尚未证实，而不是弱或强；在作出激进估值或下行假设前，应优先要求管理层披露当前经营指标。谨慎投资者在管理层以明显更详细的方式打开财务账本之前，应使用很宽的置信区间来评估该业务。审慎是必要的。尤其是现在。
