      - number: '8.4'
        title: 估值立场与信心
        blocks:
          - type: paragraph
            body: >-
              综合来看，证据支持中性但谨慎的立场。Ai.tech
              的估值并非毫无基础：创始人有相关资产创造经历，可见组合位于庞大且仍有价值的广告技术市场，公认的外部观察者也把公司列入独角兽类别。但这些正面因素被透明度缺口抵消，而透明度对估值格外关键。投资人看不到当前收入、留存、增长、现金流，甚至看不到
              Media.net
              回购的经济条件；这些本可锚定成本基础和内含价值。因此，最站得住脚的判断不是明确便宜或明显不成立，而是大致合理但偏高，且信心中低。除非管理层拿出当前财务和组合协同证据，否则仍应保留显著透明度折价。实践中，这意味着投资人若要承销超出公开标题估值的上行，必须要求异常清晰的私有披露。保守测算因此是理性默认选项。不要假装能精确估值。应保持谨慎。
