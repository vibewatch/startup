      - number: '3.4'
        title: 护城河耐久性与竞争结论
        blocks:
          - type: paragraph
            body: >-
              市场正在围绕几类耐久护城河集中：第一方数据和已登录身份、独家或大规模分发、CTV 这样的强渠道位置，以及精选或 AI 优化等差异化软件层。Media.net 看不出在 Yahoo、Amazon 或 Criteo
              那样的规模上拥有前两类资产，也没有像 Magnite 在 CTV
              中那样主导一个高增长渠道。它可能拥有的护城河更具体：上下文和搜索意图相关性、托管变现支持，以及优质媒体方细分市场。这可以防守，但前提是该细分市场持续带来更优结果和低流失。如果这些优势变模糊，商品化风险就会上升，因为媒体方和买方可以快速测试替代方案，公开同行也在持续增加相邻软件层，压缩任何历史差距。因此竞争结论是平衡的：Ai.tech
              不需要成为最大的广告技术平台才有意义，但它必须证明其组合占据了一个差异化角落；在这个市场里，规模和第一方数据每年都更有决定性。
