      - number: '1.2'
        title: 创始人履历、治理依赖与自筹资金背景
        blocks:
          - type: paragraph
            body: >-
              公开证据几乎把 Ai.tech 完全系在 Divyank Turakhia 过往的创始人履历和资本基础上。Rest of World 引述 Turakhia 称，Ai.tech
              是他的第四个互联网业务，他有意把它做成一家控股公司，用来孵化多项业务。Wired、Forbes India、Wikipedia 和 Forbes 都把这条履历追溯到 Directi、Skenzo 和
              Media.net。Media.net 在 2016 年约 $900 million 的出售，是 Ai.tech 自筹资金状态背后最清晰的资本来源；Wired
              也明确指出，两兄弟过去创办早期业务时通常不融资。这段历史强化了创始人与市场的匹配度：Turakhia 多次围绕互联网基础设施、上下文广告和运营效率打造业务。但它也放大了关键人风险，因为 Ai.tech
              的公开身份、战略叙事和隐含资本结构都以创始人为中心。已审阅的 Ai.tech 官方页面没有披露董事会、直接下属高管或子公司
              CEO。外部看，治理更像集中在创始人手里，而非已经制度化；任何投资判断都应假设公司仍依赖创始人判断，直到公司披露更完整的经营团队。
