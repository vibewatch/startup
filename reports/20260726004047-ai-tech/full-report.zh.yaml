  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、范围与公开披露姿态
        blocks:
          - type: paragraph
            body: >-
              Ai.tech 在 2025 年已有独角兽估值，但自家公开网站异常简略。官网把公司描述为一家创业工作室和控股公司，致力于打造 AI
              和机器学习驱动的业务；它邀请企业和建设者「与我们共建」，但大多数交互都导向通用联系入口和受限访问登录。这支持一种双重模式：既孵化新业务，也直接对接企业伙伴；但官网不披露具名高管、产品线或经营指标。独立来源补上了更多轮廓。Hurun、CNBC
              TV18、NewsBytes 和 Entrepreneur India 都称 Ai.tech 由 Divyank Turakhia 于 2022 年 1 月创立，靠自有资金发展，并在 2025 年估值约 USD
              1.5 billion。同一批来源把 Media.net 和 Advertising.tech
              列为可见经营组合。结果是一种不常见的组合：外部对估值和创始人声誉的可见度很高，第一方在法律结构、治理和精确经营足迹上却很不透明。尽调上，公司身份可以较有把握地确认，但还无法完整勾勒。
