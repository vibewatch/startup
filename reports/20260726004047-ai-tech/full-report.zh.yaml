      - number: '8.3'
        title: 折价、溢价与情景估值推演
        blocks:
          - type: paragraph
            body: >-
              正确的分析动作，不是一步接受或否定公开估值，而是在它周围逐层叠加溢价和折价。利好包括创始人履历、历史资产价值、庞大的数字广告市场，以及私有资产里可能藏着公开可比公司看不到的战略选择权。负面因素包括缺少当前财务指标、没有定价融资轮验证、私有资产流动性差、治理围绕创始人、行业波动受宏观和政策变化牵动。负面因素足够重，因此即便还没讨论运营资产本身质量，用公开可比公司视角估值也应先纳入透明度折价。这自然导向情景区间。低情景强调不透明、周期风险或平台风险。基准情景承认资产真实且具备战略相关性，但仍给予明显折价。高情景则需要看到当前增长、利润率或协同质量远高于公开来源现阶段展示的证据。
