      - number: '2.2'
        title: 规模口径与增长画像
        blocks:
          - type: paragraph
            body: >-
              多组第三方口径都确认周边广告市场很大，但它们不会自动收敛成一个清晰的 Ai.tech 可服务市场。IAB 2024 年数据显示，美国数字广告收入为 $258.6
              billion，其中搜索仍是最大预算池，零售媒体快速增长，数字视频是增长最快的主要格式。WARC 摘要把视角扩展到全球，估计 2025 年广告支出约 $1.17
              trillion，数字渠道吸收了大多数新增美元。商业媒体又增加了一层复杂性：它属于数字广告，却也争夺本来可能进入开放网络上下文广告或 SSP 路由库存的预算。最佳判断是，Ai.tech
              处在一个巨大且仍在增长的数字生态中，但它能直接服务的份额取决于渠道、库存类型和买方流程。
