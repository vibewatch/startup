      - number: '2.4'
        title: 约束、替代与投资判断含义
        blocks:
          - type: paragraph
            body: >-
              最强的市场风险是结构性的，不是生死存亡式的。Google 决定不在 Chrome 中彻底移除第三方 cookie，降低了最简单的纯上下文叙事的紧迫性；但 Safari 和 Firefox 仍然无
              cookie，隐私义务也仍然重要。平台集中度依旧很高，主要平台拿走了大多数新增支出。零售媒体和商业媒体正在快速增长，但这类增长可能把预算从开放网络抽走，而不只是扩大总盘子。2025 年 4 月 DOJ 在
              Google 反垄断案中获胜，带来一个二阶不确定变量：补救措施可能改善独立公司的条件，也可能在过渡期扰动市场管线。最后，Media.net
              过往美国收入集中度的公开记录说明，印度或全球市场增长不会自动转化为均衡收入暴露。合在一起，这些因素支持用区间估算 SAM，对精确 SOM
              主张保持适度信心，并把差异化供应、精选、合规和意图数据视为价值捕获的主要杠杆。
