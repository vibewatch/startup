      - number: '1.4'
        title: 里程碑、足迹模糊与负面信号
        blocks:
          - type: paragraph
            body: >-
              Ai.tech 有日期的里程碑在标题层面清楚，在经营细节层面却记录较弱。创始人履历从 1998 年的 Directi 延伸到 2010 年的 Media.net、2016 年 Media.net 出售，再到
              2022 年 1 月 Ai.tech 创立，以及 2025 年获 Hurun 认定为独角兽。Media.net 自己的网站还补充了 2023
              年重新收购的里程碑。更尖锐的尽调问题不是庆祝性叙事，而是负面事项。第一，USD 1.5 billion 估值没有披露的股权融资轮支撑；Hurun 给 Ai.tech
              标注了最低估算星号，说明这个标题有能见度价值，但方法论上弱于定价融资。第二，Hurun 的地域表把 Ai.tech 放在印度 /
              阿联酋格局中，并提到印度起源创业公司海外设总部的行为；而官网根本没有给出城市级总部。第三，前身资产历史显示集中风险：TechCrunch 报道称，Media.net 出售时约 90% 收入来自美国；Domain
              Name Wire 引用了 Ashmore 先前 39% 的减记，原因是经营表现和多元化担忧。第四，Advertising.tech
              发布的伙伴规则意味着公司主动暴露在广告技术网络常见的欺诈、隐私和执法风险中。这些问题都不否定业务本身；它们意味着本章最有力的判断是：Ai.tech
              真实、有规模、由创始人资本支撑，但相对于其声称估值，外部披露仍然不足。
