      - number: '4.2'
        title: 收入机制与单位经济假设
        blocks:
          - type: paragraph
            body: >-
              可见经营资产支持一个连贯的收入假设。Media.net 同时服务媒体方和广告主，意味着它可能靠 SSP 式经济性、需求入口和信号打包变现。Advertising.tech
              通过基础设施和应用变现流程，增加了一层运营更重的变现能力。评论和规则显示，客户管理强度和伙伴运营可能在财务上很重要；因此，即使该组合相对于工业公司偏轻资产，也未必像纯低触达 SaaS
              业务那样运转。公开来源支持一个观点：更高流量质量、更好信号质量和更强支持能够提升变现质量；但它们没有披露抽成率、毛利率、伙伴费用或服务成本。单位经济结论只能是方向性的：优质定位可能改善经济性，但成本端仍严重披露不足。这一点重要，因为广告技术业务在顶层流程上常常相似，但会因流量质量、支持负担和伙伴经济性不同，产生完全不同的利润率画像。
