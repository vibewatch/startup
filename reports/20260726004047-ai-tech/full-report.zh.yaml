            body: >-
              公开同行在规模和价值链位置上差异很大。The Trade Desk 拥有数十亿美元收入基础和深厚买方流程能力，是需求聚合和估值的最强独立基准，但不是最干净的产品类比。Magnite 和 PubMatic
              更接近产品类比，因为它们变现媒体方库存，并越来越强调 CTV、精选和全渠道视频。Taboola 在收入和媒体方触达上明显更大；它的分发模式和向效果广告转向，使其在开放网络媒体方想要「变现 +
              推荐或效果工具」的场景下构成直接威胁。Criteo 转向商业媒体，展示了预算如何迁向第一方商业数据。Media.net
              可见差异化更窄：搜索意图信号、上下文相关性、托管服务、优质开放网络关系，以及愿意支持那些需要手把手变现帮助、而不是纯自助工具的媒体方。
