  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与类别拆分
        blocks:
          - type: paragraph
            body: >-
              Ai.tech 周边竞争格局不是一组完全相同的同行构成的单一市场。它拆成几类：The Trade Desk 这样的独立 DSP，Magnite 和 PubMatic 这样的独立 SSP，Taboola 和
              Teads 这样的开放网络变现及原生广告平台，Criteo 这样的商业媒体和效果平台，以及 Yahoo DSP 这样的第一方数据或买方混合平台。Media.net
              最接近堆栈中的卖方和开放网络变现部分；Advertising.tech
              则把范围扩展到面向媒体方、广告网络和营销方的服务密集型基础设施，覆盖运营更复杂的变现流程。功能比较比标签更重要，因为标签会掩盖平台到底控制需求、供应还是两者，也会掩盖它到底靠数据、流程、客户经理服务、地域覆盖还是合同结构取胜。The
              Trade Desk 是规模化广告技术执行的优质公开基准，但它主要是买方平台。Magnite 和 PubMatic 是最接近的卖方类比。Taboola、Teads 和 Criteo
              重要，是因为它们争夺媒体方关系、内容邻近广告位，或本可能流向开放网络的预算。
