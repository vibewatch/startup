        - label: 留存考验
          detail: 结果、支持质量和政策韧性决定客户是否留下并扩张。
          tone: neutral
    claimRefs:
      - CU014
      - CU019
      - CU023
      - CU024
      - CU028
      - CU031
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据从宽泛的细分市场主张，收窄到更小的一组具名客户标识，再收窄到更少的量化结果。
    approximationNotes: 数值是本章审阅的不同证据类别数量，而非公司披露数量。
    data:
      items:
        - stage: 可见细分市场
          value: 5
          label: 发行商、广告主、基础设施、应用变现、数据 / 衡量用户
        - stage: 具名证据点
          value: 5
          label: 三个具名发行商，加两个具名合作伙伴证据
        - stage: 独立评价渠道
          value: 3
          label: G2、MonetizeMore、Publisher Collective
        - stage: 量化结果证据
          value: 1
          label: 公开量化 ROI 细节非常有限
    claimRefs:
      - CU006
      - CU022
      - CU029
      - CU035
      - CU036
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 官方证据和独立评价同时存在时，证据质量最强；只有宽泛细分市场主张时，证据质量最弱。
    data:
      columns:
        - 具名证据
        - 结果具体度
        - 留存可见度
        - 证据质量
      rows:
        - label: 优质出版方
          values:
            - 高
            - 低-中
            - 低
            - 中-高
        - label: 广告主 / 代理商
          values:
            - 低
            - 低
            - 低
            - 中-低
        - label: 基础设施客户
          values:
            - 低
            - 低
            - 低
            - 低-中
        - label: 受众数据 / 衡量用户
          values:
            - 中
            - 低
            - 低
            - 中
    approximationNotes: 单元格只是基于已保留证据作出的定性判断。
    claimRefs:
      - CU003
      - CU006
      - CU009
      - CU022
      - CU035
      - CU036
  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: 没有公开留存指标时，示意性连续性代理指标可帮助判断不同客户关系的耐久度可能如何分化。
    approximationNotes: 这些百分比是分析师的启发式估算，不是公司披露的留存率；它们只是把公开证据的可见强度转成尽调视角下的耐久度框架。
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU023
      - CU024
      - CU034
    data:
      columns:
        - 第 1 年
        - 第 2 年
        - 第 3 年
        - 第 5 年
      rows:
        - label: 优质出版方关系（示意）
          values:
            - 100
            - 88
            - 76
            - 62
        - label: 受众数据赋能的买方关系（示意）
          values:
            - 100
            - 82
            - 68
            - 55
        - label: 托管基础设施客户（示意）
          values:
            - 100
            - 79
            - 63
            - 47
        - label: 合规负担较重的 App 变现关系（示意）
          values:
            - 100
            - 74
            - 56
            - 38
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 平台依赖、隐私复杂度与信任敏感型变现重叠的地方，剩余风险最高。
    data:
      columns:
        - 发生可能性
        - 严重性
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 浏览器政策 / Cookie
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 隐私法规碎片化
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 欺诈 / IVT 泄漏
          values:
            - 高
            - 高
            - 低-中
            - 高
        - label: 宏观广告支出下行
          values:
            - 中-高
            - 中-高
            - 低
            - 中-高
        - label: 合作伙伴 / 数据依赖
          values:
            - 中
            - 中-高
            - 中
            - 中-高
        - label: 治理不透明
          values:
            - 中-高
            - 高
            - 低
            - 高
    approximationNotes: 单元格是按证据加权的定性判断，不是模型测算的概率。
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR009
      - CR017
      - CR019
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 政策、信任与宏观冲击会经由合作伙伴和客户传导到收入、利润率和估值。
    data:
      nodes:
        - id: policy
          label: 政策 / 监管
        - id: platform
          label: 浏览器 + 平台变化
        - id: trust
          label: 欺诈 / 隐私信任
        - id: demand
          label: 需求侧接入
        - id: supply
          label: 出版方供给
        - id: financials
          label: 收入 / 利润率 / 估值
      edges:
        - from: policy
          to: platform
        - from: policy
          to: trust
        - from: platform
          to: demand
        - from: trust
          to: demand
        - from: trust
          to: supply
        - from: demand
          to: financials
        - from: supply
          to: financials
    approximationNotes: 该图强调传导逻辑，而非测得的弹性。
    claimRefs:
      - CR004
      - CR023
      - CR025
      - CR028
      - CR034
      - CR038
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Ai.tech 可见资产同时依赖浏览器、需求管道、数据伙伴、衡量伙伴和出版方。
    data:
      nodes:
        - id: google
          label: Google / Chrome
        - id: buyers
          label: 需求侧买方
        - id: experian
          label: 受众数据伙伴
        - id: symitri
          label: 衡量伙伴
        - id: publishers
          label: 优质出版方
        - id: medianet
          label: Media.net / Advertising.tech 组合
      edges:
        - from: google
          to: medianet
        - from: buyers
          to: medianet
        - from: experian
          to: medianet
        - from: symitri
          to: medianet
        - from: publishers
          to: medianet
    approximationNotes: 这里把依赖关系简化为最可见的公开交易对手和系统层。
    claimRefs:
      - CR017
      - CR018
      - CR022
      - CR028
      - CR030
  - id: FV001
    title: 估值桥
    type: flow
    layout: wide
    summary: 解读已披露估值不能把它当成孤立事实，而要看锚点质量、同业语境、折价和未解缺口。
    data:
      nodes:
        - id: hurun
          label: 公开披露的 $1.5B 估值
        - id: history
          label: 历史资产价值
        - id: peers
          label: 公开 AdTech 同业参照
        - id: discounts
          label: 透明度 + 治理折价
        - id: range
          label: 区间化估值立场
      edges:
        - from: hurun
          to: history
        - from: hurun
          to: peers
        - from: history
          to: range
        - from: peers
          to: discounts
        - from: discounts
          to: range
    claimRefs:
      - CV001
      - CV004
      - CV013
      - CV022
      - CV031
  - id: FV002
    title: 同业收入柱状图
    type: bar
    layout: wide
    summary: 公开同业显示，AdTech 内部规模跨度很大；没有当前收入披露的私营公司估值很难精确对标。
    data:
      items:
        - label: The Trade Desk 2025 年收入
          value: 2896
        - label: DoubleVerify 2024 年收入
          value: 666
        - label: AppLovin 2025 年收入
          value: 4710
        - label: Criteo 2024 年收入
          value: 1930
        - label: Taboola 2024 年收入
          value: 1770
    approximationNotes: 数值已四舍五入，仅用于提供同业规模参照。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV018
      - CV026
  - id: FV003
    title: 估值区间
    type: range
    layout: standard
    summary: 现有证据只能支持围绕公开独角兽标记设一个较宽的估值置信区间。
    data:
      items:
        - label: 低位情景
          low: 700
          mid: 900
          high: 1100
        - label: 基准情景
          low: 1100
          mid: 1500
          high: 1700
        - label: 高位情景
          low: 1700
          mid: 2100
          high: 2600
        - label: 置信区间
          low: 0.3
          mid: 0.45
          high: 0.6
    approximationNotes: 情景值是分析师判断区间，以公开估值为中心，并按透明度风险调整。
    claimRefs:
      - CV013
      - CV017
      - CV031
      - CV032
      - CV033
      - CV038
      - CV039
  - id: FV004
    title: 估值背景 KPI
    type: kpi
    layout: standard
    summary: 最有决策价值的公开事实，是已报道估值、自筹发展状态、历史资产出售，以及当前私营指标缺失。
    data:
      items:
        - label: 公开披露估值
          value: $1.5B
        - label: 成立年份
          value: '2022'
        - label: 历史 Media.net 出售
          value: ~$900M
        - label: 自筹发展状态
          value: 'Yes'
        - label: 公开披露的定价融资轮
          value: 'No'
        - label: 当前收入披露
          value: 'No'
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV015
      - CV035
      - CV036
