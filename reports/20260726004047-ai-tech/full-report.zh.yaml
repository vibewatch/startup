      - number: '1.3'
        title: 组合业务与商业足迹
        blocks:
          - type: paragraph
            body: >-
              Ai.tech 公开可见的足迹，从组合公司入手，比从控股公司本身更容易看清。Media.net
              目前把自己定位为服务广告主和媒体方的全球开放网络卖方平台。它的广告主产品强调精选市场采买、第一方数据激活、SearchSignals 和 ContextGraph。媒体方产品强调托管 prebid、AI
              驱动的收益优化、竖屏视频和变现支持，并展示 TIME、Kobe Shimbun、U.S. News 等客户背书。Advertising.tech 将自己定位为
              SSP、DSP、媒体方、广告网络和营销方的基础设施提供商，借助机器学习支持收入和效果优化。它的应用变现规则展示了业务中更重运营的一面：反欺诈控制、卸载义务、隐私要求，以及诉讼或政府调查的快速通知义务。合在一起，两家具名组合公司表明，Ai.tech
              真正的经营重心是广告技术和媒体方变现，而不是横向基础模型软件。这与 Turakhia 过去的上下文广告背景一致，也与官网简略但宽泛的 AI 和机器学习叙事一致。它还解释了为什么第三方来源引用的是整个组合超过
              1,600 名员工，而不是单独针对控股公司。
