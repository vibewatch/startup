  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: A full current customer list or even a larger verified sample of production customers across publishers, advertisers, and infrastructure clients.
    whyItMatters: The named-proof table is a sample of the strongest public evidence, not a comprehensive roster.
    diligencePath: Request current logo list, top-customer breakdown, and segmented case studies.
    relatedQuestionRefs:
    - QU006
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Current customer counts, NRR, top-account concentration, geo mix, and churn data by segment.
    whyItMatters: These are the core metrics needed to judge durability, concentration, and scalability of the customer base.
    diligencePath: Review customer cohorts, concentration tables, and renewal or churn analyses from management.
    relatedQuestionRefs:
    - QU009
    - QU016
    - QU019
    - QU024
  - type: private-evidence-only
    severity: material
    topic: cross-portfolio-sellthrough
    missingEvidence: Evidence that Ai.tech as a holdco systematically shares customers, cross-sells modules, or integrates GTM across assets.
    whyItMatters: Public evidence is much stronger for Media.net than for a unified portfolio customer motion.
    diligencePath: Request cross-sell metrics, common-account analysis, and shared GTM documentation.
    relatedQuestionRefs:
    - QU022
    - QU025
