  - FU004
- id: expansion-and-risk
  title: Expansion loops, concentration, and competitive context
  body: The most credible expansion loops begin from a narrow entry point and deepen over time. A publisher relationship can expand from initial monetization into yield tools, data packaging, and additional workflow support. A buyer-side relationship can move from inventory access into richer audience and measurement layers. At the same time, competitive expectations are rising because rivals such as Taboola, PubMatic, and Criteo pair inventory or monetization with performance, commerce, and data products. That raises the bar for Ai.tech’s portfolio to prove that customers should deepen their relationships rather than route more spend or workflows to scaled alternatives. Concentration risk is the other side of this expansion story. Premium-publisher businesses often derive significant value from relatively concentrated accounts, but no public concentration table is available here. The absence of churn, concentration, and cross-sell evidence prevents a higher-confidence durability judgment.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU023
  - CU024
  - CU025
  - CU032
  - CU033
  - CU037
  - CU038
  tableRefs:
  - TU005
  figureRefs:
  - FU003
- id: holdco-caveats-and-verdict
  title: Holdco caveats and customer verdict
  body: The chapter’s most important caution is analytical, not factual. The best public customer evidence belongs to Media.net and its immediate workflow partners, not necessarily to every business inside the Ai.tech portfolio. Holdco-level coverage confirms ad-tech orientation and meaningful operating scale, but does not reveal how many customers are shared across assets, how much cross-sell exists, or whether Advertising.tech contributes a large or small share of customer relationships today. As a result, the customer verdict is moderately positive but bounded. The portfolio likely serves real publishers, buyers, and infrastructure customers in production; however, public disclosure is not specific enough to underwrite concentration, retention, or unified portfolio GTM with confidence. Investors should therefore rely on the public evidence to confirm existence and segment fit, while reserving judgment on durability until management provides customer-mix and renewal data. Until that evidence
    is produced, the customer thesis should be treated as credible but incompletely measured.
  claimRefs:
  - CU005
  - CU010
  - CU011
  - CU029
  - CU036
  - CU039
  - CU040
