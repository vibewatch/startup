chapter:
  number: 6
  title: Customers
  summary: Ai.tech’s clearest public customer evidence comes from Media.net’s two-sided publisher and advertiser workflows, especially its premium-publisher positioning and named publisher proof. Public evidence supports real production usage and segment fit, but remains too thin to quantify current customer count, retention, or concentration with confidence.
sections:
- id: segments-and-proof
  title: Customer segments and strongest public proof
  body: 'The visible customer footprint is clearest on the Media.net side of the portfolio. Public pages and reviews consistently describe a two-sided market: publishers on one side, advertisers and agencies on the other. Within that mix, the strongest public proof sits with premium publishers. Media.net’s publisher page includes named customer-style references such as TIME, Kobe Shimbun, and U.S. News, and independent review sources repeatedly describe the network as best suited to English-language or higher-quality traffic rather than the broadest long tail of smaller sites. That combination of official proof and independent fit commentary makes the publisher segment more legible than other customer categories. The advertiser side is still visible, especially through contextual, audience, and search-signal positioning, but public evidence is less logo-specific. The resulting picture is that Ai.tech owns a real ad-tech customer base, yet the clearest proof is concentrated in one operating
    asset and one side of the market. That asymmetry matters for underwriting.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU007
  - CU009
  - CU030
  - CU039
  tableRefs:
  - TU001
  - TU003
  figureRefs:
  - FU001
- id: adoption-and-satisfaction
  title: Adoption logic, repeat usage, and satisfaction signals
  body: 'Public evidence suggests customers buy more than raw software access. Publishers appear to buy managed monetization support, premium demand access, and workflow help around yield improvement. Buyers appear to buy contextual reach, signal packaging, and increasingly privacy-aware optimization surfaces. Advertising.tech’s rules show that some relationships are operationally intensive enough that compliance handling and partner quality are part of the product experience. That operating model supports repeat usage if outcomes and support quality remain strong, but it also increases execution sensitivity. Public retention metrics are absent, so the chapter relies on indirect indicators: continued partner announcements, mixed but useful review evidence, and a workflow design that naturally encourages ongoing usage once integrated. Those signals are informative, but they are still weaker than disclosed NRR, cohort, or churn data. Satisfaction should therefore be viewed as plausible but
    not fully proved. That gap is especially important because high-touch monetization relationships can look healthy in testimonials while hiding concentration or support-cost issues.'
  claimRefs:
  - CU004
  - CU008
  - CU012
  - CU013
  - CU019
  - CU020
  - CU021
  - CU028
  - CU031
  - CU034
