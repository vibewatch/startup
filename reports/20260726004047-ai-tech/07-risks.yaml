chapter:
  number: 7
  title: Risks
  summary: 'Ai.tech’s visible portfolio inherits the core structural risks of open-web ad tech: privacy-law fragmentation, browser-policy uncertainty, fraud control, macro-sensitive ad demand, and dependence on larger platforms and partners. The business may have mitigation levers, but public disclosure on control maturity and concentration remains thinner than the risk surface warrants.'
sections:
- id: regulatory-platform
  title: Regulatory and platform-policy risk
  body: The most visible external risks sit at the intersection of browser policy, privacy law, and antitrust. Google’s cookie-policy reversal reduced one kind of immediate shock but did not settle how open-web targeting, attribution, and measurement will operate over the next several years. The CMA’s continuing supervision of Privacy Sandbox commitments makes clear that browser infrastructure remains an active regulatory domain, while the DOJ’s antitrust win against Google introduces a second path of disruption through remedies and market-structure change. For Ai.tech, this matters because its visible assets operate in the part of advertising most exposed to infrastructure rules it does not control. Media.net and Advertising.tech can adapt through contextual signals, first-party-friendly workflows, or privacy-aware measurement, but they cannot eliminate the dependence itself. Underwriting should therefore treat browser and regulator decisions as core business variables, not distant policy
    noise. The practical implication is that scenario planning needs to cover both gradual standards migration and abrupt legal remedies, because either path can change integration priorities, customer messaging, and monetization assumptions.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR024
  - CR030
  - CR034
  - CR035
  tableRefs:
  - TR001
  figureRefs:
