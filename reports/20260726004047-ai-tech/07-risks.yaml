- id: dependencies-and-transmission
  title: Partner dependence and risk transmission
  body: 'Ai.tech’s visible portfolio depends on a web of counterparties: browsers, demand platforms, audience-data vendors, measurement partners, and publishers. That dependency map is normal for ad tech, but it also means risks can cascade. If browser policy changes reduce signal quality, buyers may retrench. If privacy or fraud concerns reduce advertiser trust, demand can shift to commerce-media or walled-garden channels. If publishers perceive lower monetization quality, supply quality falls at the same time demand becomes harder to win. Media.net’s Experian and Symitri partnerships illustrate the dual edge of this model: partnerships can improve targeting and measurement, yet they also add data-governance, pricing, and operational dependency. The result is a transmission model where small upstream changes can influence revenue, gross margin, and valuation faster than in a less intermediated software business. Investors should assume that dependency diversification is strategically valuable
    even if it is operationally expensive.'
  claimRefs:
  - CR011
  - CR012
  - CR017
  - CR018
  - CR022
  - CR023
  - CR025
  - CR026
  - CR028
  - CR039
