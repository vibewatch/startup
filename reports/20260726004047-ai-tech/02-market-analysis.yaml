- id: TM005
  title: Channel and format economics table
  columns:
  - Channel / format
  - Growth signal
  - Why buyers care
  - Why publishers care
  - Ai.tech relevance
  rows:
  - - Search / intent-led ads
    - Largest spend pool in US digital
    - High intent and measurable ROI
    - Stable monetization when intent is strong
    - Media.net contextual and search roots align closely
  - - Digital video
    - Fast growth in 2024
    - Storytelling and performance mix
    - Higher CPM potential
    - Programmatic video can pull spend from simple display
  - - Retail / commerce media
    - Strong double-digit growth
    - Purchase-proximate attribution
    - Alternative to open-web display
    - Budget competitor more than owned product today
  - - CTV
    - Rapid SSP growth and share concentration
    - Premium screens and brand budgets
    - High-value inventory pathways
    - Growth adjacency for SSP-style assets
  - - Open-web display / native
    - Mature but still large
    - Scaled reach outside walled gardens
    - Core publisher revenue engine
    - Direct center of gravity for Media.net and Advertising.tech
  - - Mobile app monetization
    - Growing within omnichannel supply
    - Performance-friendly formats
    - Alternative inventory growth surface
    - Relevant through Advertising.tech’s app monetization rules
  notes: Economic attractiveness varies more by channel than by generic “digital advertising” labels.
