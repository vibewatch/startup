chapter:
  number: 2
  title: Market Analysis
  summary: Ai.tech’s visible opportunity sits inside the open-web ad-tech stack rather than the broad AI market. Public evidence supports a large digital advertising backdrop with strong growth in video, commerce media, and premium curated supply, but also shows that independent platforms face heavy concentration, privacy-policy volatility, and substitution pressure from dominant platforms and retailer media.
sections:
- id: market-boundary
  title: Market boundary and included spend
  body: Ai.tech’s market should not be framed as generic artificial intelligence software. The visible operating assets instead place the company inside the ad-tech infrastructure layer that connects advertisers, publishers, agencies, and monetization partners across the open web. Media.net positions itself as a global SSP serving both advertisers and publishers, while Advertising.tech positions itself as infrastructure for SSPs, DSPs, publishers, ad networks, and marketers. That points to a core market made up of open-web publisher monetization, contextual and intent-led targeting, curation, and supporting workflow or compliance tooling. Broad digital ad spend is relevant as the top-of-funnel budget pool, but much of that spend sits inside walled gardens or retailer-owned networks that Ai.tech does not visibly own. The right market boundary therefore includes open-web display, native, contextual, video, app monetization, and related SSP or optimization spend, while excluding large chunks
    of social, platform-owned search, and general enterprise AI software.
  claimRefs:
  - CM013
  - CM014
  - CM017
  - CM025
  - CM026
  - CM027
  - CM035
  tableRefs:
  - TM001
  - TM003
  figureRefs:
  - FM002
- id: sizing-and-growth
  title: Sizing lenses and growth profile
  body: 'Multiple third-party lenses confirm that the surrounding ad market is large, but they do not collapse into one clean serviceable market for Ai.tech. IAB’s 2024 data show US digital ad revenue at $258.6 billion, with search still the largest pool, retail media growing quickly, and digital video the fastest-growing major format. WARC summaries extend the picture globally, putting 2025 ad spend around $1.17 trillion with digital channels absorbing the majority of incremental dollars. Grand View Research and Market Research Future offer large top-down views of programmatic and contextual advertising, but their methodologies differ enough that the prudent approach is to use a range, not a single-point TAM. Commerce media adds another complication: it is part of digital advertising, yet it also competes for budgets that might otherwise land in open-web contextual or SSP-routed inventory. The best read is that Ai.tech operates inside a very large and still-growing digital ecosystem, but
    its directly serviceable share depends on channel, inventory type, and buyer workflow.'
  claimRefs:
