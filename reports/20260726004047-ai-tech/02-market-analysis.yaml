  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: A clean public SAM for Ai.tech that isolates open-web contextual, SSP, and optimization software layers without double counting media spend.
    whyItMatters: Top-down ad-spend figures are too broad while vendor software TAMs are too narrow, making single-point underwriting fragile.
    diligencePath: Request management’s internal market map with segment revenue bridges and customer-category mix.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: current-mix
    missingEvidence: Current revenue mix by channel, geography, and buyer class across the Ai.tech portfolio.
    whyItMatters: Public sources describe the market and predecessor assets but do not show what fraction of the opportunity Ai.tech can actually serve today.
    diligencePath: Ask for gross spend, revenue, and customer mix by publisher, advertiser, app, and geography segment.
    relatedQuestionRefs:
    - QM021
    - QM024
