- id: TM006
  title: Structural market risk table
  columns:
  - Risk
  - Evidence
  - Potential effect
  - Current read
  - Next diligence step
  rows:
  - - Methodology conflict in market reports
    - Contextual and programmatic reports use inconsistent definitions
    - False precision in TAM and valuation models
    - Material but manageable with range-based sizing
    - Normalize all TAM figures before valuation use
  - - Cookie-policy reversal
    - Chrome did not fully eliminate third-party cookies
    - Reduces urgency of some cookieless narratives
    - Near-term headwind to simple contextual marketing
    - Measure actual revenue from cookieless vs cookie-enabled traffic
  - - Platform concentration
    - WARC and IAB summaries show major-platform dominance
    - Budget share and bargaining power remain concentrated
    - Structural risk
    - Quantify traffic and demand dependency by platform partner
  - - Google antitrust transition
    - DOJ win could prompt remedies
    - Infrastructure disruptions or opportunity shocks
    - Important unresolved catalyst
    - Track case timeline and likely remedy scenarios
  - - Geography concentration
    - Media.net historical revenue was mostly US-sourced
    - Regional downturns could hit revenue disproportionately
    - Likely still relevant
    - Request current geo revenue mix
  - - Commerce-media substitution
    - Retail media is large and growing
    - Open-web spend can be crowded out
    - Real but not thesis-breaking
    - Model category growth alongside budget diversion
  - - Cyclicality
    - Macro forecasters see slower ad growth than 2024
    - Revenue growth could compress rapidly
    - Persistent sector trait
    - Stress-test downside assumptions
  notes: The risk table matters almost as much as the spend tables because market direction is clearer than accessible share.
