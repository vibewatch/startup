callouts:
- calloutType: insight
  title: Ai.tech’s true market is narrower than “AI,” but still very large
  body: 'The visible assets point to a specific applied market: open-web ad-tech infrastructure, contextual and intent-led targeting, and publisher monetization tooling. That market is smaller than a generic AI TAM but large enough to support multi-billion-dollar incumbents and meaningful niche leaders.'
  claimRefs:
  - CM013
  - CM014
  - CM026
  - CM038
- calloutType: risk
  title: Market growth does not guarantee value capture for independents
  body: Digital spend, CTV, and commerce media are all growing, yet the largest platforms still take most incremental dollars. Ai.tech therefore needs differentiated data, curated inventory access, or service leverage to translate market growth into durable economics.
  claimRefs:
  - CM006
  - CM022
  - CM024
  - CM037
