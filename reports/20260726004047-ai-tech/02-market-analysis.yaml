- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters to Ai.tech
  rows:
  - - Open-web publisher monetization
    - Display, native, video, contextual, and SSP-mediated open-web demand
    - Walled-garden social and closed app-store media spend
    - Publishers and revenue teams
    - Matches Media.net and Advertising.tech’s visible operating footprint
  - - Contextual and intent-led targeting
    - Contextual, search-signal, audience-plus-context, and curation-driven spend
    - Pure social-graph targeting
    - Advertisers and agencies
    - Aligns with Media.net SearchSignals and contextual positioning
  - - Commerce / retail media adjacency
    - Retail and commerce-media demand seeking measurable outcomes
    - In-store trade spend and non-digital shopper marketing
    - Retail media teams and advertisers
    - Competes for the same budget pool even if not directly owned by Ai.tech
  - - CTV and omnichannel supply
    - CTV, mobile-app, and omnichannel inventory monetized programmatically
    - Broadcast-only or direct-sold offline media
    - Streaming publishers and ad-tech vendors
    - Important because SSP growth is shifting toward CTV and mobile
  - - Ad-tech infrastructure services
    - Publisher services, demand integrations, compliance tooling, optimization layers
    - General enterprise AI software unrelated to advertising
    - Publishers, marketers, ad networks
    - Captures the infrastructure layer where Advertising.tech operates
  - - Status-quo substitutes
    - Google Ad Manager, direct sales, internal build, retailer-owned media networks
    - N/A
    - Large publishers and advertisers
    - Defines the practical baseline beyond startup peers
  notes: Ai.tech’s relevant market is narrower than all AI software and wider than a single contextual-advertising niche.
