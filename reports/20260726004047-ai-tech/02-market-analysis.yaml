- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Digital-share expansion
    - Positive
    - Ongoing
    - Keeps the total spend pool growing
    - Confirm mix between open-web and platform-only growth
  - - Retail / commerce media growth
    - Mixed
    - Near term
    - Creates larger digital market but diverts budget from open-web publishers
    - Model substitution not just growth
  - - CTV and omnichannel growth
    - Positive
    - Ongoing
    - Creates higher-value inventory opportunities for SSPs
    - Test Media.net exposure to CTV or mobile-app channels
  - - Cookie-policy uncertainty
    - Mixed
    - Current
    - Weakens simple contextual marketing story but keeps compliance need alive
    - Check how much revenue depends on cookie-enabled browsers
  - - Platform concentration
    - Negative
    - Structural
    - Makes demand access expensive and compresses independent take rates
    - Quantify dependency on Google, Amazon, and other major pipes
  - - Antitrust remedies against Google
    - Mixed
    - Medium term
    - Could loosen incumbency but disrupt infrastructure during transition
    - Track remedy timing and likely industry effects
  - - Brand safety and curation demand
    - Positive
    - Current
    - Supports premium, filtered, and signal-rich inventory models
    - Verify fraud controls and curation quality
  - - Macro cyclicality
    - Negative
    - Always on
    - Spend growth can decelerate quickly in weak environments
    - Stress-test revenue under slower global ad growth
  notes: The same structural changes that expand digital ad markets also compress generic inventory economics.
