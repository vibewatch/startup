  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current revenue, gross spend, gross margin, growth, retention, cash flow, and debt metrics for the portfolio and holdco.
    whyItMatters: These are the essential inputs for assessing financial quality, runway, and valuation support.
    diligencePath: Request management reporting, monthly or quarterly KPI packs, and a consolidated financial bridge.
    relatedQuestionRefs:
    - QI003
    - QI008
    - QI020
    - QI023
    - QI029
  - type: private-evidence-only
    severity: material
    topic: reacquisition-economics
    missingEvidence: The terms, funding structure, and ownership implications of the Media.net reacquisition.
    whyItMatters: The reacquisition affects cost basis, embedded asset value, and capital-efficiency interpretation.
    diligencePath: Request transaction summary, financing details, and post-reacquisition cap table context.
    relatedQuestionRefs:
    - QI004
    - QI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Take rates, partner economics, cost-to-serve, and concentration by top account or geography.
    whyItMatters: The public record shows what the products do, but not whether they generate attractive unit economics.
    diligencePath: Request gross-to-net bridges, customer concentration data, and service-cost breakdowns.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI014
    - QI015
    - QI028
