      - number: '1.4'
        title: Milestones, footprint ambiguity, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Ai.tech’s dated milestones are clear at the headline level but weakly documented at the operating-detail
              level. The founder track record runs from Directi in 1998 through Media.net in 2010 and the Media.net sale
              in 2016, then to Ai.tech’s January 2022 founding and Hurun-recognized unicorn status in 2025. Media.net’s
              own site adds a 2023 reacquisition milestone. The sharper diligence issues are adverse, not celebratory.
              First, the USD 1.5 billion valuation is not backed by a disclosed equity round; Hurun marks Ai.tech with a
              minimum-estimate asterisk, making the headline useful but methodologically softer than a priced financing.
              Second, Hurun’s geography tables place Ai.tech in an India/UAE pattern and note overseas headquarters
              behavior for India-origin startups, while the official site names no city-level headquarters at all.
              Third, predecessor-asset history shows concentration risk: TechCrunch reported that about 90% of
              Media.net’s revenue was in the U.S. at sale, and Domain Name Wire cited a prior 39% Ashmore mark-down
              driven by operating-performance and diversification concerns. Fourth, Advertising.tech’s published partner
              rules imply active exposure to fraud, privacy, and legal-enforcement risk typical of ad-tech networks.
              None of these issues invalidate the business; they do mean the chapter’s strongest judgment is that
              Ai.tech is real, scaled, and founder-capitalized, but still externally under-disclosed for its stated
              valuation.
