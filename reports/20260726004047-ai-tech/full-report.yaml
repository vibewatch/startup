      - number: '3.2'
        title: Peer profiles and capability comparisons
        blocks:
          - type: paragraph
            body: >-
              The public peers differ sharply in scale and in where they sit in the value chain. The Trade Desk’s
              multi-billion-dollar revenue base and buy-side workflow depth make it the strongest independent benchmark
              for demand aggregation and valuation, but not the cleanest product analog. Magnite and PubMatic are closer
              product analogs because they monetize publisher inventory and increasingly emphasize CTV, curation, and
              omnichannel video. Taboola is materially larger on revenue and publisher reach, with a distribution model
              and performance-ad pivot that make it a direct threat wherever open-web publishers want monetization plus
              recommendation or performance tooling. Criteo’s pivot into commerce media shows how budgets migrate toward
              first-party commerce data. Media.net’s visible differentiation is narrower: search-intent signal,
              contextual relevance, managed service, premium open-web relationships, and a willingness to support
              publishers that want hands-on monetization help rather than purely self-serve tooling.
