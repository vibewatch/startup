  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category splits
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape around Ai.tech is not a single market of identical peers. It breaks into
              independent DSPs like The Trade Desk, independent SSPs like Magnite and PubMatic, open-web monetization
              and native platforms like Taboola and Teads, commerce-media and performance platforms like Criteo, and
              first-party data or buy-side hybrids like Yahoo DSP. Media.net sits closest to the sell-side and open-web
              monetization portion of the stack, while Advertising.tech widens the field toward service-heavy
              infrastructure for publishers, ad networks, and marketers across more operationally complex monetization
              workflows. Functional comparison matters more than labels, because labels hide whether a platform controls
              demand, supply, or both and whether it wins through data, workflow, account-managed service, geographic
              reach, or contract structure. The Trade Desk is the premium public benchmark for scaled ad-tech execution,
              but it is primarily a buy-side platform. Magnite and PubMatic are the closest sell-side analogs. Taboola,
              Teads, and Criteo matter because they compete for publisher relationships, content-adjacent placements, or
              budget that might otherwise route through the open web.
            claimRefs:
