            title: Ai.tech’s true market is narrower than “AI,” but still very large
            body: >-
              The visible assets point to a specific applied market: open-web ad-tech infrastructure, contextual and
              intent-led targeting, and publisher monetization tooling. That market is smaller than a generic AI TAM but
              large enough to support multi-billion-dollar incumbents and meaningful niche leaders.
