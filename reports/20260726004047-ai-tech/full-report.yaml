  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding posture and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Ai.tech’s public financial story starts with what is absent. The company is consistently described as
              bootstrapped, and no reviewed public source disclosed a priced venture or growth-equity financing round.
              That matters because it removes the strongest external validation mechanism that private companies
              normally provide to investors. The public valuation mark therefore tells us more about narrative
              recognition and founder reputation than about current cash generation or margin structure. The company’s
              private status also means there are no public audited statements, no disclosed quarterly revenue updates,
              and no visible debt or runway disclosures. Financial interpretation must therefore proceed from capital
              structure and business mechanics rather than from standard reporting metrics. That approach can still be
              useful, but it necessarily lowers confidence and raises the value of conservative assumptions. The
              practical consequence is that even simple questions such as whether the company is currently
              cash-generative, whether founder capital is still being injected, or whether any asset carries hidden
              obligations cannot be answered from public reporting alone.
