      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Risk is structural, not episodic
            body: >-
              The key risks are embedded in the ad-tech model itself: privacy-law fragmentation, browser-policy change,
              platform concentration, fraud control, and macro-sensitive demand. Ai.tech is not uniquely immune to any
              of them.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
              - CR038
          - type: callout
            title: Public disclosure is thinner than the risk surface warrants
            body: >-
              Public evidence establishes the categories of risk clearly, but does not quantify current exposure by
              customer concentration, partner dependence, or control maturity. That disclosure gap is a real
              underwriting risk in its own right.
            calloutType: insight
            claimRefs:
              - CR020
              - CR029
