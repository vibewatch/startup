  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Ai.tech’s market should not be framed as generic artificial intelligence software. The visible operating
              assets instead place the company inside the ad-tech infrastructure layer that connects advertisers,
              publishers, agencies, and monetization partners across the open web. Media.net positions itself as a
              global SSP serving both advertisers and publishers, while Advertising.tech positions itself as
              infrastructure for SSPs, DSPs, publishers, ad networks, and marketers. That points to a core market made
              up of open-web publisher monetization, contextual and intent-led targeting, curation, and supporting
              workflow or compliance tooling. Broad digital ad spend is relevant as the top-of-funnel budget pool, but
              much of that spend sits inside walled gardens or retailer-owned networks that Ai.tech does not visibly
              own. The right market boundary therefore includes open-web display, native, contextual, video, app
              monetization, and related SSP or optimization spend, while excluding large chunks of social,
              platform-owned search, and general enterprise AI software.
