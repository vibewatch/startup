      - number: '8.3'
        title: Discounts, premiums, and scenario-based valuation reasoning
        blocks:
          - type: paragraph
            body: >-
              The correct analytical move is not to accept or reject the published mark in one step, but to layer
              premiums and discounts around it. On the positive side are founder pedigree, historical asset value, a
              large digital-advertising market, and the possibility that privately held assets contain strategic
              optionality not visible in public comps. On the negative side are missing current financial metrics, no
              priced-round validation, private illiquidity, founder-centered governance, and sector volatility tied to
              macro and policy shifts. Those negatives are substantial enough that a public-comp lens should incorporate
              a transparency discount even before debating the quality of the operating assets themselves. This leads
              naturally to scenario ranges. A low case emphasizes opacity and cyclical or platform risk. A base case
              accepts that the assets are real and strategically relevant while still discounting them meaningfully. A
              high case would require evidence of current growth, margin, or synergy quality well above what public
              sources presently show.
