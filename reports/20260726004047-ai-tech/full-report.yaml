      - number: '2.4'
        title: Constraints, substitution, and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The strongest market risks are structural rather than existential. Google’s decision not to fully remove
              third-party cookies in Chrome reduced the urgency of the simplest contextual-only narrative, even though
              Safari and Firefox remain cookieless and privacy obligations still matter. Platform concentration remains
              acute, with major platforms taking the majority of incremental spend. Retail and commerce media are
              growing quickly, but that growth can substitute away from open-web budgets instead of simply enlarging
              them. The April 2025 DOJ win against Google creates a second-order wildcard: remedies could improve
              conditions for independents, but they could also destabilize market plumbing during any transition.
              Finally, the public record on Media.net’s historical US revenue concentration suggests that market growth
              in India or globally does not automatically translate into balanced revenue exposure. Together these
              factors argue for a range-based SAM, modest confidence in precise SOM claims, and a focus on
              differentiated supply, curation, compliance, and intent data as the main levers of value capture.
            claimRefs:
