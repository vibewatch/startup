      - number: '1.2'
        title: Founder pedigree, governance dependence, and self-funding context
        blocks:
          - type: paragraph
            body: >-
              Public evidence ties Ai.tech almost entirely to Divyank Turakhia’s prior founder track record and capital
              base. Rest of World quotes Turakhia saying Ai.tech is his fourth internet business and that he
              intentionally built it as a holding company from which to incubate multiple businesses. Wired, Forbes
              India, Wikipedia, and Forbes all trace that track record through Directi, Skenzo, and Media.net.
              Media.net’s roughly $900 million 2016 sale is the clearest source of the capital base behind Ai.tech’s
              bootstrapped status, and Wired explicitly notes that the brothers historically did not raise venture
              funding for their earlier businesses. That history strengthens founder-market fit: Turakhia has repeatedly
              built businesses around internet infrastructure, contextual advertising, and operational efficiency. It
              also heightens key-person risk because Ai.tech’s public identity, strategic narrative, and implied capital
              stack are all founder-centered. No reviewed official Ai.tech page names a board, lists direct reports, or
              describes subsidiary CEOs. Governance therefore looks concentrated rather than institutionalized from the
              outside, and any investment case should assume dependence on founder judgment until a fuller operating
              bench is disclosed.
            claimRefs:
