  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Published valuation anchor and what it does — and does not — prove
        blocks:
          - type: paragraph
            body: >-
              The strongest public valuation anchor for Ai.tech is the USD 1.5 billion mark reported by ASK Private
              Wealth Hurun and repeated by multiple news summaries. That anchor matters because it puts Ai.tech firmly
              in the unicorn conversation and because it is tied to a specific report rather than vague founder
              aspiration. However, the same anchor does not provide the kind of proof that a priced financing round or a
              public market would provide. It is best understood as a recognized external estimate of value, not a
              transparent price discovery event. The company’s bootstrapped status reinforces that point: founder
              capital efficiency and historical asset-building are central to the narrative, but external investors have
              not publicly marked the equity on disclosed terms. That means the published mark is useful, yet
              insufficient on its own for a high-confidence investment judgment. The gap between recognition and price
              discovery is especially relevant for later-stage private underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV035
              - CV036
          - type: table
