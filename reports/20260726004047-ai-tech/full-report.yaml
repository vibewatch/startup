      - number: '2.2'
        title: Sizing lenses and growth profile
        blocks:
          - type: paragraph
            body: >-
              Multiple third-party lenses confirm that the surrounding ad market is large, but they do not collapse into
              one clean serviceable market for Ai.tech. IAB’s 2024 data show US digital ad revenue at $258.6 billion,
              with search still the largest pool, retail media growing quickly, and digital video the fastest-growing
              major format. WARC summaries extend the picture globally, putting 2025 ad spend around $1.17 trillion with
              digital channels absorbing the majority of incremental dollars. Grand View Research and Market Research
              Future offer large top-down views of programmatic and contextual advertising, but their methodologies
              differ enough that the prudent approach is to use a range, not a single-point TAM. Commerce media adds
              another complication: it is part of digital advertising, yet it also competes for budgets that might
              otherwise land in open-web contextual or SSP-routed inventory. The best read is that Ai.tech operates
              inside a very large and still-growing digital ecosystem, but its directly serviceable share depends on
              channel, inventory type, and buyer workflow.
