              - CV036
      - number: '8.2'
        title: Historical asset context and public comparable frame
        blocks:
          - type: paragraph
            body: >-
              The clearest historical support for Ai.tech’s valuation narrative is Media.net’s roughly $900 million 2016
              sale. That transaction proves the founder has previously built an ad-tech asset with very large strategic
              value. But it is an imperfect present-day anchor because the sale happened years ago, the asset was later
              reacquired privately, and the reacquisition price is undisclosed. Public peer analysis fills part of the
              gap. The Trade Desk sets the premium benchmark for scaled independent ad-tech quality. DoubleVerify shows
              how measurement and verification layers can be valued. AppLovin illustrates the much stronger enthusiasm
              attached to AI-native, fast-growing ad-optimization narratives. Magnite, PubMatic, Criteo, Taboola, Index
              Exchange, Equativ, and Outbrain show the diversity of economics and market positions inside open-web ad
              tech. Together these peers validate that billion-dollar outcomes are possible in the category, but they
              also highlight how much public transparency matters when assigning value.
