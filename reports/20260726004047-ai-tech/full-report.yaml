      - number: '7.2'
        title: Trust, privacy, and operational control risk
        blocks:
          - type: paragraph
            body: >-
              Fraud control and privacy compliance are operational requirements for open-web monetization businesses,
              not optional add-ons. TAG’s fraud-savings data quantify how expensive invalid traffic can become when
              controls fail, while IAPP’s legal analysis shows why state-by-state US privacy obligations and GDPR-style
              rules create ongoing interpretation and execution risk. Media.net’s own privacy and legal pages confirm
              that the platform processes identifiers, device data, and related advertising information;
              Advertising.tech’s program requirements confirm operational exposure to fraud, partner conduct, and
              investigations. The public evidence does not prove weak controls, but it does show a large risk surface
              and leaves meaningful blind spots around certification, incident history, and audit rigor. That asymmetry
              matters: when trust-sensitive markets rely on many intermediaries, investors need stronger evidence of
              controls than a sparse public posture currently provides.
