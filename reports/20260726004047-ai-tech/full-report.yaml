      - number: '7.4'
        title: Governance opacity and overall risk verdict
        blocks:
          - type: paragraph
            body: >-
              The holdco-level risk picture is intensified by limited disclosure. Public reporting confirms Ai.tech’s
              bootstrapped unicorn status and founder association, but does not provide the type of governance, audit,
              concentration, or risk-control detail that many investors would want for a business operating in a
              sensitive, cyclical, and regulation-exposed sector. That does not make the business unattractive; it does
              mean the confidence band on any risk-adjusted underwriting judgment should stay wider than for a public
              peer. Historical coverage of Media.net’s sale-era US concentration adds a reminder that concentration risk
              is not hypothetical. In practical terms, the report’s risk verdict is balanced but cautious: the visible
              portfolio likely has real capability and commercial relevance, yet it appears exposed to the same
              structural shocks as the broader ad-tech sector while offering less public evidence about current
              mitigation maturity. That wider confidence band should directly influence the recommendation, valuation
              stance, and the amount of downside protection required before treating the reported unicorn status as
