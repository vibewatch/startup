      - number: '3.4'
        title: Moat durability and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The market is consolidating around a few durable moat types: first-party data and logged-in identity,
              exclusive or large-scale distribution, strong channel positions like CTV, and differentiated software
              layers such as curation or AI optimization. Media.net does not visibly own the first two at the scale of
              Yahoo, Amazon, or Criteo, nor does it dominate a high-growth channel the way Magnite does in CTV. Its
              plausible moat is more specific: contextual and search-intent relevance, managed monetization support, and
              a premium publisher niche. That can be defensible, but only if the niche consistently commands superior
              outcomes and low churn. If those advantages blur, commoditization risk rises because publishers and buyers
              can test alternatives quickly and because public peers keep adding adjacent software layers that narrow
              any historical gap. The competitive verdict is therefore balanced: Ai.tech does not need to be the largest
              ad-tech platform to matter, but it does need to prove that its portfolio occupies a differentiated corner
              of a market where scale and first-party data are becoming more decisive every year.
