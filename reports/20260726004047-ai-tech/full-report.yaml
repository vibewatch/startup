      - number: '3.3'
        title: Switching costs, distribution power, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Competitive durability in ad tech often comes from distribution, data, and workflow entrenchment rather
              than hard technical lock-in. Publishers can multi-home across SSPs or monetization partners, especially
              when setups are tag-based or header-bidding-enabled. Independent reviews suggest Media.net wins with
              Tier-1 English-language traffic and dedicated support, but can be outmatched on ease of setup or broader
              fit for smaller publishers. That implies service quality helps retention, yet does not eliminate
              RPM-driven switching. On the buy side, large DSPs and commerce-media platforms benefit from workflow
              entrenchment, audience tools, or first-party data that are difficult to replicate. Meanwhile, long
              publisher contracts or wide content distribution networks give Taboola- and Teads-style players a
              different kind of moat. Those rivals can absorb experimentation on one surface because they own broader
              traffic relationships.
            claimRefs:
              - CP014
              - CP015
              - CP024
              - CP025
              - CP026
              - CP027
              - CP036
              - CP037
          - type: table
            tableRef: TP005
