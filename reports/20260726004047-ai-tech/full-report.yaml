            body: >-
              The chapter’s overall judgment is balanced but cautious. Ai.tech appears to control commercially relevant
              ad-tech assets and to have been built without obvious external fundraising dependence. Those are real
              positives. The public record also supports a plausible monetization model and a founder with prior
              strategic-exit history. But none of that substitutes for current revenue, growth, margin, retention,
