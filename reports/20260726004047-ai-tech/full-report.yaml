      - number: '1.3'
        title: Portfolio businesses and commercial footprint
        blocks:
          - type: paragraph
            body: >-
              The publicly visible Ai.tech footprint is more legible through its portfolio companies than through the
              holdco itself. Media.net currently presents itself as a global sell-side platform serving both advertisers
              and publishers on the open web. Its advertiser product set emphasizes curated marketplace buying,
              first-party data activation, SearchSignals, and ContextGraph. Its publisher product set emphasizes managed
              prebid, AI-driven yield optimization, vertical video, and monetization support, including customer
              testimonials from TIME, Kobe Shimbun, and U.S. News. Advertising.tech positions itself as an
              infrastructure provider to SSPs, DSPs, publishers, ad networks, and marketers, with
              machine-learning-supported revenue and performance optimization. Its app monetization rules show a more
              operationally intensive side of the business: anti-fraud controls, uninstall obligations, privacy
              requirements, and rapid notice obligations for lawsuits or government investigations. Taken together, the
              two named portfolio businesses suggest Ai.tech’s real operating center of gravity is ad-tech and publisher
              monetization rather than horizontal foundation-model software. That is consistent with Turakhia’s prior
              contextual-advertising background and with the official site’s minimal but broad AI-and-ML framing. It
              also helps explain why third-party sources cite more than 1,600 employees across the portfolio rather than
              for the holdco alone.
