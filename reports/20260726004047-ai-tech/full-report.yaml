      - number: '8.4'
        title: Valuation stance and confidence
        blocks:
          - type: paragraph
            body: >-
              On balance, the evidence supports a moderate but cautious stance. Ai.tech’s valuation does not appear
              baseless: the founder has a relevant asset-creation history, the visible portfolio sits in a large and
              still valuable ad-tech market, and recognized external observers have placed the company in the unicorn
              category. Yet those positives are offset by a transparency gap that is unusually important for valuation.
              Investors cannot see current revenue, retention, growth, cash flow, or even the economics of the Media.net
              reacquisition that could anchor cost basis and embedded value. For that reason, the most defensible stance
              is fair-to-stretched with medium-to-low confidence rather than clearly attractive or clearly impossible. A
              meaningful transparency discount remains warranted until management provides current financial and
              portfolio-synergy evidence. In practice, that means investors should demand unusually clear private
              disclosure before underwriting upside beyond the published headline. Conservative underwriting is
              therefore the rational default. Precision should not be pretended. Cautiously.
            claimRefs:
              - CV024
              - CV025
