      - [Ivy League offers, "1,490", "Undated job repost", "Bebee job listing repeating company claims; low-to-medium confidence", "Not independently audited; cohort and period absent"]
      - [CGA students, "2,000", "Review accessed 2026-10-25; period not stated", "Good Schools Guide; high confidence for its reviewed school snapshot", "School enrollment, not admissions customers; retention absent"]
      - [CGA live-group lesson take-up, "50%", "Review accessed 2026-10-25; period not stated", "Good Schools Guide; high confidence for its reviewed snapshot", "Channel utilization; denominator and cohort vintage need confirmation"]
      - [CGA one-to-one tutoring take-up, "45%", "Review accessed 2026-10-25; period not stated", "Good Schools Guide; high confidence for its reviewed snapshot", "Channel utilization; denominator and cohort vintage need confirmation"]
    notes: Values retain each source's population, vintage, and uncertainty; no admissions retention, churn, renewal, or conversion denominator was found in the assigned pool.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or cohort, Segment, Deployment or use case, Production vs pilot, Outcome signal, Limitation]
    enumerationScope:
      coverage: partial
      basis: Publicly named or described customer evidence retained in the assigned pool, covering admissions reviews and Crimson Global Academy school operations as of the 2026-10-25 refresh.
    rows:
      - ["Crimson Global Academy students", "Online-school families", "Full-time online schooling with American, British, and international curricula", "Production enrollment", "2,000 students; 70+ countries; 2025 IGCSE and A-level results reported", "Independent review snapshot; no cohort retention or student-level outcome file"]
      - ["Trustpilot reviewers", "Admissions and tutoring families", "Strategy, essays, tutoring, application support, and platform use", "Customer-reported completed or ongoing use", "Positive reviews cite responsiveness, structure, tutoring, and repeat-family purchase", "Platform permits reviews and describes incentives/verification; sample is self-selected"]
      - ["Reddit reviewers", "Prospective and current admissions users/tutors", "Admissions consulting, mentor allocation, and tutoring", "Customer- or worker-reported use", "Reports include both platform usefulness and complaints about cost, coach quality, and contracts", "Anonymous and anecdotal; not a representative customer sample"]
    notes: Enumeration is partial because the assigned sources do not provide a complete customer list or independently verified named deployment register; logos and offer totals are not treated as deployments.
    claimRefs: [CU007, CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Crimson customer journey
    type: journey-map
    summary: The public evidence supports a multi-step, human-service customer journey, but the paid-account and renewal stages remain unmeasured.
    data:
      nodes:
        - id: parent-intent
          label: Parent / family intent
          title: Parent-led purchase trigger
          details: Admissions anxiety, university ambition, or search for an online-school alternative initiates the relationship.
          touchpoints: ["Parent-facing marketing", "School or university planning"]
        - id: consultation
          label: Consultation and matching
          title: Package and people selection
          details: Families are matched to strategists, essay mentors, tutors, or school pathways.
          touchpoints: ["Strategy consultation", "Tutor or mentor allocation", "CGA admissions"]
        - id: active-service
          label: Active service
          title: Mentoring, tutoring, or schooling
          details: Delivery includes timelines, lesson plans, application feedback, progress tracking, or live and asynchronous classes.
          touchpoints: ["One-to-one or group sessions", "Platform tasks", "CGA curriculum"]
        - id: outcome
          label: Outcome and expansion
          title: Offer, progression, renewal, or cross-sell
          details: Public evidence shows offers and school results, but not a complete conversion or retention chain.
          touchpoints: ["University offer", "School progression", "Renewal", "Additional product"]
        - id: evidence-boundary
          label: Evidence boundary
          title: What remains unmeasured
          details: The assigned pool supports the first three stages and selected outcomes; it does not establish conversion rates, churn, or attach rates.
          touchpoints: ["Paid-account conversion", "Renewal and churn", "Product attach"]
        - id: diligence
          label: Diligence
          title: Cohort and concentration file
          details: Customer-level billing and service records are needed to test retention, concentration, and cross-sell economics.
          touchpoints: ["Cohort export", "Reference interviews", "Revenue concentration"]
    claimRefs: [CU002, CU005, CU007, CU009, CU014]
