        title: Exhibits
        blocks:
          - type: callout
            title: Scale and balance-sheet signals
            body: >-
              Management reports more than $420M in prior-year sales, $400M described as organic, more than 500 schools
              using a teacher product, and no debt; each remains a management statement rather than an audited financial
              metric in the assigned pool.
            calloutType: strength
            claimRefs:
