  - id: FU001
    title: Crimson customer journey
    type: journey-map
    summary: >-
      The public evidence supports a multi-step, human-service customer journey, but the paid-account and renewal stages
      remain unmeasured.
    data:
      nodes:
        - id: parent-intent
          label: Parent / family intent
          title: Parent-led purchase trigger
          details: >-
            Admissions anxiety, university ambition, or search for an online-school alternative initiates the
            relationship.
          touchpoints:
            - Parent-facing marketing
            - School or university planning
        - id: consultation
          label: Consultation and matching
          title: Package and people selection
          details: Families are matched to strategists, essay mentors, tutors, or school pathways.
          touchpoints:
            - Strategy consultation
            - Tutor or mentor allocation
            - CGA admissions
        - id: active-service
          label: Active service
          title: Mentoring, tutoring, or schooling
          details: >-
            Delivery includes timelines, lesson plans, application feedback, progress tracking, or live and asynchronous
            classes.
          touchpoints:
            - One-to-one or group sessions
            - Platform tasks
            - CGA curriculum
        - id: outcome
          label: Outcome and expansion
          title: Offer, progression, renewal, or cross-sell
          details: Public evidence shows offers and school results, but not a complete conversion or retention chain.
