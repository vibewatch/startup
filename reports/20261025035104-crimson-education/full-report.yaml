              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Customer journey and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The observable journey begins with a parent-facing promise around elite admissions or a school
              alternative, then moves through consultation and matching, scheduled mentoring or tutoring, and an outcome
              that may be an application, university offer, or school progression. The journey is operationally
              people-intensive: the job listing requires tutors to create lesson plans and track progress, while
              customer reviews describe strategist, essay-mentor, subject-tutor, and success-manager roles. The main
              diligence risk is that the journey can look successful at the top of the funnel while remaining opaque at
              the paid-account and renewal stages. Crimson should provide customer-level evidence separating inquiry,
              paid enrollment, active use, completed service, offer, matriculation, renewal, and cross-sell. Until then,
              named logos and offer totals are evidence of reach or marketing claims, not proof of retention, unit
              economics, or concentration.
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU014
