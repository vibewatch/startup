              - CU009
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-product customer surface
            body: >-
              Crimson can serve the same family through admissions strategy, tutoring, and online schooling, creating
              plausible cross-sell opportunities across distinct education needs.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
              - CU014
          - type: callout
            title: Retention is not publicly evidenced
            body: >-
              Public materials show offers, reviews, and school enrollment signals, but not customer cohorts, renewal
              rates, churn, or a denominator for conversion claims.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU009
