  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is execution quality: two unverified user discussions describe poor value,
              weak responsiveness, or mismatched expertise, while Crimson's own recruiting copy depicts a remote
              tutoring model operating across 21 markets. These anecdotes cannot establish complaint incidence, but they
              identify failure modes that matter because the service is expensive, personalized, and outcome-sensitive.
              Privacy and consumer-contract risk rank next because the business handles student information and
              standard-form service relationships across markets; New Zealand regulators describe affirmative
              notification, security, overseas-disclosure, and unfair-term obligations. Integration risk is also
              material: a delivery partner documented earlier scaling bottlenecks, and a company-issued release
              describes school acquisitions and charter expansion. The investment case should pause if verified
              complaint or refund rates rise, privacy controls fail testing, or acquired schools miss board-approved
              integration milestones.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
