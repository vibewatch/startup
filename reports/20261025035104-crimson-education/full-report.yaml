  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Crimson's product is a coordinated service workflow for students and families. Its admissions offering
              combines strategy, application support, extracurricular or research mentoring, and standardized-test
              tutoring, while Crimson Global Academy (CGA) is a separate online-school product with live classes and
              recognized curricula. A job description describes consultants creating and maintaining roadmaps, leading
              expert teams, selecting activities, and working with parents; this is evidence of an operating workflow,
              not proof that every step is automated. Third-party descriptions likewise identify personalized plans,
              mentoring, essays, and application support. The product therefore appears best understood as
              software-enabled expert services, with outcomes depending on matching, quality control, and execution by
              people.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE009
      - number: '5.2'
        title: CGA operating model and maturity
        blocks:
          - type: paragraph
            body: >-
              CGA provides a more standardized product surface than admissions consulting. A school profile describes
              live, real-time classes, small typical class sizes, flexible pacing, multiple curricula, and students
              across more than 65 countries. A separate school account describes weekly live sessions, group and
              individual meetings, a virtual badging system, community features, clubs, meetups, and university
              guidance. These sources support a layered virtual-school operating model, but they are not a technical
              architecture specification. Reported examination outcomes and pupil counts are publisher or school-profile
              figures with denominators and methodology that require diligence before being treated as operating KPIs.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE009
