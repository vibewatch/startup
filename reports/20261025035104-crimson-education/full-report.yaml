      - number: '7.2'
        title: Legal, regulatory, and consumer exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest primary legal evidence is New Zealand-wide rather than company-specific. The Privacy
              Commissioner states that IPP 3A took effect on 1 May 2026 and requires notification when personal
              information is collected indirectly; the same framework covers storage and security, retention, use,
              disclosure, and transfers outside New Zealand. The Commerce Commission says it can ask a court to declare
              an unfair term in a standard-form consumer contract, after which that term is not binding. Crimson's
              21-market footprint and coordinated team model therefore create a meaningful compliance surface, but the
              assigned evidence contains no current contracts, privacy notices, regulator correspondence, litigation
              register, or cross-border control testing. Diligence should sample executed agreements and notices by
              jurisdiction, test consent and deletion workflows, and reconcile marketing claims to documented cohorts
              before underwriting low residual exposure.
            claimRefs:
              - CR002
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
