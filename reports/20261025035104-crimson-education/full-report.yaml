  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with low confidence and high risk. Crimson's company-reported scale
              and a substantial 2024 Series D support the existence of a valuable operating platform, yet the
              entry-price evidence is internally inconsistent. Independent databases report nominal marks from $590M to
              $1B, while a company-issued job repost states a USD $640M valuation and AFR describes a roughly $1B
              transaction. Currency, post-money definitions, security rights, and transaction timing are not reconciled
              in the retained evidence. That prevents a reliable current equity value, target return, or
              dilution-adjusted ownership case. Investment consideration should remain conditional on an executed term
              sheet, current cap table, and audited financial denominator rather than treating any headline mark as cash
              value available to holders.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Financing benchmarks and scenarios
        blocks:
          - type: paragraph
            body: >-
              Multiples records $100M of revenue alongside a $590M valuation and a 5.9x revenue multiple in November
              2024. That observation is not ARR, and the source notes that its round-linked revenue field may represent
              run-rate revenue or reported LTM revenue. Broad benchmarks are materially lower: Finerva reports a 1.6x
              median public EdTech revenue multiple for Q4 2024, while Berkery Noyes reports a 1.8x median across 2025
              education transactions. These cohorts are not direct comparables to Crimson's mixed admissions-services
              and online-education model, so they establish price discipline rather than a mechanical value. A 5.9x
              outcome requires verified growth, retention, margin quality, and recurring revenue; absent those proofs,
              downside should be tested toward the broad benchmark band rather than converted into a precise enterprise
              value.
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Crimson has converted a premium advisory product into global scale: its official site
              claims more than 6,000 students supported and more than 10,000 offers, and multiple sources record a large
              institutional financing. The anti-thesis is that scale does not establish durable unit economics or fair
              entry price. Anonymous customer commentary on Reddit and Quora describes high cost and uneven service
              value; those accounts are adverse anecdotes, not prevalence estimates, but they identify concrete
              diligence risks around pricing, refunds, mentor quality, and repeat purchase. The view would improve with
              independently sampled outcomes, cohort retention, contribution margin, refund and complaint data. It would
              weaken if those metrics show that headline admissions outcomes are not representative or that premium
              pricing does not sustain profitable retention.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.4'
        title: Exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not establish an executable liquidity path. Multiples says Crimson has
              indicated readiness for an ASX IPO, but no filing, timetable, audited public financial package, current
              secondary mark, or strategic-sale process appears in the assigned evidence. A stated intention is
              therefore a readiness signal, not proof of an exit. Final diligence should obtain the current
              capitalization table, liquidation preferences, option-pool and dilution schedule, debt and cash balances,
              audited segment results, revenue recognition policy, cohort retention, customer concentration, refund
              rates, and board-approved exit plan. Thesis-break triggers are a down-round, a material failure to
              reconcile the 2024 valuation marks, weak cash conversion or retention, or verified customer-quality
              problems that constrain pricing. Until those items are resolved, no target hold period or return multiple
              is supportable.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry discipline
            body: >-
              Treat all public valuation marks as financing context, not a current fair-value quote. Advance only after
              reconciling currency, security rights, dilution, and audited economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV014
              - CV016
          - type: callout
            title: Thesis-break test
            body: >-
              A down-round, weak retention or cash conversion, or verified service-quality problems would remove the
              basis for a premium to broad education-sector multiples.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
