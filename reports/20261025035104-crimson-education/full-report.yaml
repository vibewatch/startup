  - id: FM001
    title: Evidence-constrained market sizing lenses
    summary: >-
      The available evidence spans a third-party market estimate, observed premium prices, company client scale, and an
      admissions-demand proxy; these are ordered lenses, not a mathematically additive TAM/SAM/SOM.
    type: pyramid
    data:
      nodes:
        - label: College-consulting market estimate
          value: ~$2.9B
          unit: USD
          detail: Sherwood citing IBISWorld; geography and methodology not shown in fetched text
        - label: Premium program price
          value: $25,000-$200,000
          unit: USD per family program
          detail: Price observations, not market volume
        - label: Crimson reported client scale
          value: ~8,000
          unit: clients in 2024
          detail: Wikipedia summary; denominator and current retention unavailable
        - label: Admission-demand proxy
          value: 76.8%
          unit: of 185 surveyed colleges
          detail: Considerable importance assigned to college-prep grades by NACAC in Fall 2023
        - label: Online-school adjacency
          value: Accredited
          unit: teacher-led school
          detail: CGA describes recognized academic outcomes; this is not consulting-market volume
        - label: Executive-function adjacency
          value: New service
          unit: company-described
          detail: Focus is positioned as accountability and leadership support
    approximationNotes: >-
      Values are not comparable units and are not additive; the ordering is an evidence hierarchy from broad market lens
      to company scale and demand proxy, not proportional magnitude.
    claimRefs:
      - CM002
      - CM005
      - CM007
      - CM008
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Crimson sits in the high-breadth, high-coordination corner of the reviewed alternatives, while specialists and
      status-quo options trade breadth for lower cost or embedded trust.
    data:
      xAxis: Breadth of services (ordinal, low to high)
      yAxis: Coordination intensity (ordinal, low to high)
      points:
        - label: Crimson Education
          x: 5
          'y': 5
          note: Integrated admissions, mentoring, testing, research, and education described across assigned sources
        - label: Boutique advisor
          x: 3
          'y': 5
          note: Competitor describes individualized, high-touch comprehensive advising
        - label: School counseling
          x: 3
          'y': 4
          note: School-based support can be embedded but varies by institution
        - label: DIY / free resources
          x: 2
          'y': 1
          note: Family coordinates the process directly
        - label: Targeted test prep
          x: 2
          'y': 2
          note: Narrower academic or testing scope than holistic consulting
        - label: Online learning platform
          x: 4
          'y': 2
          note: Digital scale can broaden content access without high-touch admissions coordination
