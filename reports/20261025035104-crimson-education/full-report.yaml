      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              Crimson's operating model combines admissions advice, tutoring, specialist mentoring, and an online
              school. Its official description presents a coordinated, data-driven team spanning academics, testing,
              extracurriculars, research, competitions, and essays; an independent directory separately identifies
              Crimson Global Academy as an online school offering A-Levels and AP courses. Scale is visible but control
              maturity is not: Tracxn reports 2,011 employees as of September 2026, while GravityLab says it was engaged
              during 2019-2021 to address scaling bottlenecks and move mobile-app notification logic into a Salesforce
              integration layer. The partner work is evidence of remediation, not proof that current reliability, access
              control, or handoffs are effective. Management should provide coach-level QA, replacement and complaint
              rates, platform incidents, penetration tests, subprocessor inventories, and service continuity results.
            claimRefs:
