              - CU009
      - number: '6.3'
        title: Named proof, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is more visible in the school segment than in admissions consulting. The Good Schools
              Guide gives an independently reviewed CGA profile, including curriculum pathways, outcomes, student
              geography, and parent/teacher quotations, while the other retained sources are mostly reviews, directory
              descriptions, or company-issued recruiting material. Trustpilot includes positive accounts of structured
              guidance, tutoring, application support, and a repeat-family purchase, but it also includes complaints
              alleging strategist changes, delayed responses, and incentivized reviews; these are user statements, not
              audited findings. Adverse commentary from Medium and Reddit raises concerns about fear-based marketing,
              high prices, variable coaching quality, and refund/contract friction; the claims are anecdotal and should
              not be generalized to the full base. Expansion may come from cross-selling tutoring, admissions mentoring,
              and CGA, but the public record does not disclose attach rates, customer concentration, contract length, or
              channel dependence. The next diligence step is a segmented cohort file linking payer, product, geography,
              start date, renewal, gross retention, and outcome.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
