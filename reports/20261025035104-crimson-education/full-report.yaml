    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Crimson Education was founded in 2013 and is headquartered in Auckland, New Zealand. Tracxn describes the
              company as a provider of application consulting for students seeking higher education, covering university
              strategy, school selection, deadlines, extracurricular and leadership mentoring, essay development, and
              feedback from former admissions officers. Independent review material describes a team-based model
              spanning admissions strategy, essays, research, competitions, test preparation, and an accredited online
              high school, Crimson Global Academy. The broader group therefore looks less like a single-cycle counseling
              practice and more like a multi-product education platform, although the available evidence does not
              disclose segment revenue, margins, retention, or contribution economics.
