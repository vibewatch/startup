              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Obtain current contracts, privacy-control tests, complaint and refund cohorts, coach-quality metrics,
              audited segment cash flow, and acquisition integration dashboards before treating the residual-risk
              ratings as mitigated.
            calloutType: risk
            claimRefs:
