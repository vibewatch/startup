              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Partner, capital, and expansion dependencies
        blocks:
          - type: paragraph
            body: >-
              Delivery depends on a distributed specialist workforce, internal applications, Salesforce-linked
              workflows, and continued trust in the admissions brand. Capital is a separate exposure: Tracxn reports
              $114 million raised across four rounds, including $40.1 million in July 2024, while the Australian
              Financial Review reported an approximately NZ$67 million transaction valuing the company near NZ$1
              billion. Those amounts are funding and valuation evidence, not revenue, cash available, burn, or runway.
              Expansion adds execution load: company-issued coverage describes 2025 school acquisitions, a hybrid model,
              and a charter-school launch, but provides no purchase consideration or integration KPIs. Investment
              approval should require audited segment cash flow, acquisition budgets, workforce capacity, vendor
              concentration, and board dashboards; a financing shortfall or acquisition overrun that compresses service
              quality should be a thesis-break trigger.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
          - type: table
