              - CE012
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE014
      - number: '5.3'
        title: Technology, trust, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence is specific about user-facing delivery but sparse about backend controls. The available
              sources do not document an API, integration catalog, uptime history, incident register, encryption design,
              privacy certifications, penetration testing, data-retention policy, or formal support SLAs. A community
              discussion does describe a platform with progress tracking, monthly suggestions, materials, and timelines,
              while another account describes inconsistent adviser expertise and the need to look up admissions rules
              during meetings. These are useful signals about product experience, not proof of systemic failure. The
              underwriting implication is that implementation risk sits at the boundary between software workflow and
              distributed human delivery: diligence should test permissions, auditability, safeguarding, quality
              assurance, matching, escalation, and continuity when a tutor or adviser leaves.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Crimson's defensible surface is a bundled network of specialist advisers, educators, mentors, curricula,
              and a global delivery footprint. A company job posting claims former admissions officers, professors,
              research mentors, and competition specialists are brought together; this is company-issued positioning and
              should not be treated as independently validated differentiation. CGA's live, small-class,
              multi-curriculum model and flexible pacing are more concrete product attributes, but they remain
              replicable operating choices unless supported by proprietary data, accreditation depth, outcomes, or
              retention. The public record does not establish a proprietary technical moat. Priority diligence is to
              obtain architecture and security documentation, product and service-level metrics, customer-support and
              safeguarding controls, staff utilization and matching data, and evidence connecting product usage to
              verified educational outcomes.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              Crimson's customer is usually a family purchasing high-stakes education support, while the student is the
              primary user and the parent is often the economic decision-maker. The product surface spans admissions
              strategy, essay and extracurricular mentoring, standardized-test tutoring, and the separate Crimson Global
              Academy online-school offer. A job listing describes one-to-one and small-group SAT/ACT tutoring,
              personalized lesson plans, progress tracking, and support across regions, which indicates a service model
              dependent on distributed human labor rather than a purely self-serve product. Independent
              company-directory evidence likewise describes personalized plans, project or research mentoring, and
              application support. CGA serves a different payer/use case: a full-time online school with students in 70+
              countries, multiple curricula, and listed annual fees of NZ$13,900–NZ$18,000. These are adjacent but not
              interchangeable customer cohorts, so admissions-package sales, tutoring utilization, and school enrollment
              should be analyzed separately. Sherwood reports that admissions-consulting clients can pay tens of
              thousands of dollars or as much as $200,000, indicating a premium family-funded segment but not a
              representative average selling price.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU016
      - number: '6.2'
        title: Adoption, outcomes, and durability
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest for the existence of a broad service footprint and named educational
              use cases, not for recurring revenue or retention. A current company job repost repeats claims of more
              than 1,490 Ivy League offers and 2,410 offers to the US Top 15, while an independent education directory
              says the company reports more than 10,000 leading-university offers and more than 1,300 Ivy League offers;
              the differing counts are not reconciled and are not customer counts. CGA provides a more concrete
              operating snapshot: the independent Good Schools Guide reports 2,000 students, 50% live-group-lesson
              take-up, 45% one-to-one tutoring take-up, and 2025 IGCSE/A-level results. Review-platform excerpts show
              both high satisfaction and complaints about strategist turnover, bureaucracy, and responsiveness. There is
              no public cohort table for admissions customers, no churn or renewal denominator, and no verified
              conversion from offers to paid accounts; those gaps limit confidence in durability and expansion.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
