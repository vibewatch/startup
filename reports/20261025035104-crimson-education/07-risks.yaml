    title: Regulatory / legal risk register
    columns: [Rule or issue, Jurisdiction, Evidence status, Likelihood, Severity, Mitigation and diligence path, Residual exposure]
    rows:
      - ["Indirect collection notification under IPP 3A", "New Zealand", "Effective from 1 May 2026; company implementation not evidenced", "Medium", "High", "Test notices, data-source records, consent exceptions, and deletion workflows on sampled student files", "High until controls are tested"]
      - ["Storage, security, retention, use, and overseas disclosure of personal information", "New Zealand with cross-border operating implications", "Regulatory duties are documented; company control attestations are absent", "Medium", "High", "Review privacy impact assessments, subprocessors, access controls, retention schedules, incidents, and transfer safeguards", "High"]
      - ["Unfair terms in standard-form consumer contracts", "New Zealand", "Commerce Commission enforcement pathway is documented; current Crimson contracts were not available", "Medium", "High", "Obtain current templates and refund records, then commission jurisdiction-specific legal review", "Medium-high"]
      - ["Outcome-claim substantiation and service representations", "Multi-market", "Crimson publishes large outcome counts; assigned evidence lacks complete denominators and causal comparison", "Medium", "High", "Maintain substantiation files by cohort, period, product, geography, and comparator before publishing claims", "High"]
    notes: "Partial public-law register as of 2026-10-25; ratings are analytical, no breach or enforcement action is asserted, and absent incident records do not prove incident absence."
    enumerationScope:
      coverage: partial
      basis: "New Zealand regulator guidance and company-specific evidence successfully prefetched for this chapter; other operating jurisdictions were not exhaustively reviewed."
    claimRefs: [CR002, CR003, CR004, CR009, CR011, CR012, CR013, CR014, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Monitoring indicator or unresolved gap]
    rows:
      - ["Coach, tutor, or strategist quality varies across a distributed workforce", "Medium-high", "High", "Unknown: role requirements are public, but QA outcomes are not", "High", "Complaint, replacement, refund, response-time, and outcome rates by coach and market"]
      - ["CRM, mobile-app, or staff-handoff failure interrupts service", "Medium", "High", "Partial: a partner documented Salesforce integration and workflow remediation", "Medium-high", "Incident frequency, recovery time, failed handoffs, access reviews, and continuity-test results"]
      - ["Expansion across admissions consulting and online schooling stretches controls", "Medium", "High", "Unknown: operating breadth is disclosed without control testing", "High", "Segment-level service levels, safeguarding audits, regulator findings, and management spans"]
      - ["Acquired schools or new education models miss integration milestones", "Medium", "High", "Early: acquisitions and launches are disclosed, but integration KPIs are not", "High", "Enrollment retention, teacher retention, curriculum outcomes, integration spend, and milestone variance"]
    notes: "Likelihood and severity are evidence-anchored analyst ratings rather than measured incident probabilities; public evidence does not disclose current control-test results."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR009, CR010, CR014, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Specialist delivery capacity", "Remote tutors, mentors, counselors, and admissions specialists", "No supplier or workforce concentration percentage disclosed", "Insufficient capacity or uneven quality increases complaints and weakens outcomes", "High", "Credential checks, capacity plans, QA sampling, replacement SLAs, and retention dashboards", "High"]
      - ["Core workflow technology", "Internal applications and Salesforce-linked processes", "GravityLab documents integration work, not current vendor concentration", "Integration or access-control failure disrupts student and staff workflows", "High", "Architecture review, vendor exit plan, least-privilege testing, and recovery exercises", "Medium-high"]
      - ["Growth capital", "Private investors and board", "Funding rounds are public; cash balance, preferences, and runway are not", "A funding gap constrains service investment or forces adverse financing terms", "High", "Audited cash flow, cap table, preference waterfall, runway covenant, and downside budget", "High"]
      - ["Acquisition execution", "Schools, management teams, and education regulators", "Acquisitions are disclosed without consideration or integration economics", "Integration overruns consume cash and management attention while quality deteriorates", "High", "Board-approved integration milestones, ring-fenced budgets, and stop-loss criteria", "High"]
    notes: "The assigned evidence does not quantify workforce, vendor, investor, or acquisition concentration; null concentration is a gap rather than evidence of diversification."
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR010, CR014]
figures:
  - id: FR001
    title: Risk heatmap
    summary: Service quality, privacy, consumer contracts, and acquisition integration carry the highest residual ratings because exposure is visible while control effectiveness remains unverified.
    type: matrix
    data:
      columns: ["Likelihood (1-4)", "Impact (1-4)", "Mitigation maturity (1-4)", "Residual severity (1-4)"]
      rows:
        - label: "Distributed service-quality variance"
          values: [3, 4, 1, 4]
        - label: "Privacy and cross-border data governance"
          values: [2, 4, 1, 4]
        - label: "Consumer contract and outcome-claim exposure"
          values: [2, 4, 1, 4]
        - label: "Technology integration and handoff failure"
          values: [2, 3, 2, 3]
        - label: "Acquisition and school integration"
          values: [2, 4, 1, 4]
        - label: "Capital availability and financing terms"
          values: [2, 4, 1, 4]
    approximationNotes: "Ordinal analyst scale: 1=low/early and 4=high/mature as applicable; values rank evidence-backed exposure and disclosure gaps, not measured probabilities."
    claimRefs: [CR001, CR003, CR004, CR007, CR008, CR010, CR011, CR012, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain current contracts, privacy-control tests, complaint and refund cohorts, coach-quality metrics, audited segment cash flow, and acquisition integration dashboards before treating the residual-risk ratings as mitigated.
    claimRefs: [CR003, CR004, CR007, CR008, CR011, CR012, CR013, CR015]
  - calloutType: recommendation
    title: Thesis-break triggers
    body: Pause or reprice if verified complaint or refund rates rise, a material privacy-control failure occurs, service-level performance deteriorates after acquisitions, or downside cash needs cannot be funded without punitive terms.
    claimRefs: [CR003, CR004, CR007, CR008, CR010, CR014, CR015]
