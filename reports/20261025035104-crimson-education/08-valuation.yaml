  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-quality
      missingEvidence: Audited revenue, gross margin, EBITDA, cash flow, cash balance, and product-level retention for the latest fiscal periods.
      whyItMatters: Revenue quality and cash conversion determine whether a premium revenue multiple is sustainable.
      diligencePath: Obtain audited statements and management accounts under NDA, then reconcile revenue to contracts, receipts, and product cohorts.
      relatedQuestionRefs: [QV001, QV002, QV004, QV005]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Executed Series D documents that reconcile the $590M, USD $640M, and approximately $1B public marks.
      whyItMatters: Currency, post-money definition, security class, and timing materially change the implied entry multiple.
      diligencePath: Review the executed term sheet, capitalization table, foreign-exchange basis, option pool, and preferred-share rights.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Current cap table, liquidation preferences, anti-dilution rights, debt, transfer restrictions, and secondary pricing.
      whyItMatters: Headline valuation does not establish common-equity proceeds, ownership, or downside protection.
      diligencePath: Obtain counsel-verified financing documents and model proceeds across financing and exit outcomes.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: customer-economics
      missingEvidence: Representative independent data on outcomes, satisfaction, refunds, complaints, repeat purchase, and customer concentration.
      whyItMatters: Anonymous adverse accounts identify risks but cannot establish frequency or economic impact.
      diligencePath: Sample customer cohorts, inspect refund and complaint logs, and conduct independent references using disclosed denominators.
      relatedQuestionRefs: [QV001, QV008]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: IPO filing, audited public-company-ready financial package, board-approved timetable, or active strategic-sale process.
      whyItMatters: A stated readiness signal does not establish timing, probability, or proceeds from liquidity.
      diligencePath: Review board materials, auditor readiness work, exchange-adviser engagement, and any documented buyer or underwriter process.
      relatedQuestionRefs: [QV006, QV007]
