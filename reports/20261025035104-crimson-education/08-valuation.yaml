      - [Thesis, "Institutional financing validation", "Sources record a large 2024 Series D led by Movac.", "Executed terms reconcile currency, security class, and post-money valuation."]
      - [Anti-thesis, "Price exceeds broad sector anchors", "Multiples records 5.9x versus 1.6x and 1.8x broad benchmarks.", "Audited growth, margins, and recurring revenue justify a durable premium."]
      - [Anti-thesis, "Customer value may be uneven", "Anonymous Reddit and Quora accounts describe high cost and disappointing service.", "Representative refund, complaint, satisfaction, and repeat-purchase data rebut the anecdotes."]
    notes: "Customer commentary is anecdotal and is used to frame diligence questions, not to estimate complaint prevalence."
    claimRefs: [CV002, CV004, CV007, CV008, CV009, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited growth, strong margins, durable retention, repeatable revenue, and clean preferences.", "Near the source-recorded 5.9x revenue multiple may be defensible; no equity-value range is issued without debt, cash, and terms.", "Low until diligence verifies every assumption.", "Growth, retention, or margin evidence fails to support the premium."]
      - [Base, "Scale is real but revenue mix and economics remain only partly disclosed.", "Above the 1.6x-1.8x broad benchmark band but below 5.9x; exact value remains a gap.", "Medium.", "Current financing terms imply greater dilution or preference overhang than expected."]
      - [Bear, "Weak retention or cash conversion, service-quality problems, or sector multiple compression.", "At or below the 1.6x-1.8x broad benchmark band; no precise floor is supportable.", "Medium while private evidence is unavailable.", "Down-round, liquidity stress, or verified customer harm."]
      - [Exit case, "A new financing, strategic sale, or IPO supplies verified price discovery.", "Target return and hold period remain unavailable until current entry price and exit timetable are known.", "Unresolved.", "No credible liquidity process or no audited IPO-ready financial package."]
    notes: "Multiple bands are analytical anchors, not direct comparable valuations; public EdTech and education M&A cohorts differ from Crimson's business mix."
    claimRefs: [CV002, CV011, CV012, CV013, CV015, CV016]
