callouts:
  - calloutType: recommendation
    title: Entry discipline
    body: >-
      Treat all public valuation marks as financing context, not a current fair-value quote.
      Advance only after reconciling currency, security rights, dilution, and audited economics.
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV014, CV016]
  - calloutType: risk
    title: Thesis-break test
    body: >-
      A down-round, weak retention or cash conversion, or verified service-quality problems
      would remove the basis for a premium to broad education-sector multiples.
    claimRefs: [CV009, CV010, CV011, CV012, CV015, CV016]
