      - [Tutoring and test preparation, "One-to-one and small-group remote instruction", "Session, course, or package", "Service described; realized price unavailable", "Variable labor input; utilization and take rate unavailable", "Tutor cost, utilization, cancellations, and contribution margin"]
      - [Crimson Global Academy, "Online high-school courses including A-Levels and AP", "Student tuition or course enrollment", "Offering confirmed; tuition revenue unavailable", "Potentially recurring but teacher and support intensity unknown", "Enrollment, re-enrollment, tuition, teacher utilization, and school gross margin"]
      - [Revision Village and teacher software, "Digital exam preparation and teacher workflow tools", "Student or school license", "CEO reported use in more than 500 schools", "Scalable potential; ARR, renewal, and implementation cost unavailable", "ARR, school count definition, ACV, churn, hosting, and support cost"]
      - [Executive-function and research support, "Mentoring, accountability, and guided projects", "Coaching or project package", "Service scope described; economics unavailable", "Expert-led delivery may constrain margin", "Realized price, mentor hours, attach rate, and contribution margin"]
    notes: "Rows describe evidenced mechanisms and public status, not audited segment revenue; null economics remain diligence gaps."
    claimRefs: [CI001, CI002, CI005, CI015]
  - id: TI002
    title: Pricing and delivery-cost signals
    columns: [Signal, Reported amount or term, Metric classification, Evidence limitation, Underwriting use]
    rows:
      - ["2019 consulting contracts", "Up to $60,000", "Historical reported customer contract price", "Independent investigation; not a current distribution", "Test realized net price, discounts, refunds, and geography mix"]
      - ["Quora customer account", "About $12,000 and described as non-refundable", "Anecdotal realized payment", "Single unidentified user and undated account", "Verify package scope, refund policy, and outcome"]
      - ["Tutor competitive bid", "$13.55 in one instance; usually $20-$25", "Anecdotal supplier-side rate", "Single former-tutor comment; unit and representativeness unclear", "Reconcile tutor cost, billed price, utilization, and take rate"]
      - ["Contract continuation", "Payment obligations reportedly continued despite changed plans", "Historical contract-risk signal", "2019 terms may not reflect current contracts", "Sample current agreements and quantify cancellations, refunds, and complaints"]
    notes: "Amounts retain the source's currency notation and are not converted, averaged, or treated as company-wide ASP or margin."
    claimRefs: [CI011, CI012, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns: [Metric, Public value, Period or denominator, Confidence, Why it matters, Diligence ask]
    rows:
      - [Sales, "More than $420M", "Prior year relative to an undated fetched interview", "Medium; management statement", "Scale signal, but not identified as recognized revenue or ARR", "Audited revenue reconciliation and segment mix"]
      - [Organic activity, "$400M described as organic", "Same prior-year interview context", "Medium; management statement", "Could distinguish operating growth from acquisitions if defined", "Definition and reconciliation to acquired and reported sales"]
      - [Debt, "No debt", "As of the undated fetched interview", "Medium; management statement", "Relevant to solvency and financing flexibility", "Debt, leases, guarantees, earn-outs, and security schedule"]
      - [Funding, "$114M over four rounds per Tracxn", "Through the July 2024 round on the page", "Medium; third-party database", "Financing access does not show cash remaining", "Primary round documents, use of funds, and cap table"]
      - [Valuation transaction, "About $1B after an NZ$67M raise", "Reported November 2024", "Medium; independent news", "Reference point, not present fair value or liquidity", "Share price, dilution, preferences, and secondary terms"]
      - [Employee count, "2,011", "As of September 30, 2026", "Medium; third-party database", "Cost-base proxy without compensation or productivity data", "FTE and contractor mix, payroll, and revenue per employee"]
      - ["Cash, burn, and runway", null, "No usable public denominator", "Unavailable", "Determines capital adequacy and next-round dependency", "Current cash, monthly burn, working-capital bridge, and downside runway"]
      - ["Gross margin, CAC, payback, and retention", null, "No usable public denominator", "Unavailable", "Determines revenue quality and scalability by segment", "Cohort economics with definitions and ledger reconciliation"]
    notes: "Null means no supportable value in the assigned prefetched evidence; funding raised, sales, valuation, and cash are intentionally kept distinct."
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009, CI010, CI015, CI016]

