    claimRefs: [CI001, CI002, CI005, CI006, CI015]

callouts:
  - calloutType: strength
    title: Scale and balance-sheet signals
    body: "Management reports more than $420M in prior-year sales, $400M described as organic, more than 500 schools using a teacher product, and no debt; each remains a management statement rather than an audited financial metric in the assigned pool."
    claimRefs: [CI003, CI004, CI005]
  - calloutType: risk
    title: Public evidence cannot establish runway
    body: "Funding records and valuation references do not disclose cash available, burn, working-capital needs, acquisition obligations, or the next-round trigger."
    claimRefs: [CI006, CI007, CI008, CI010, CI016]
  - calloutType: recommendation
    title: Gate investment underwriting on segment accounts
    body: "Require audited statements and reconciled cohort economics before converting reported sales, offer counts, or transaction valuations into a revenue-quality conclusion."
    claimRefs: [CI014, CI015, CI016]

