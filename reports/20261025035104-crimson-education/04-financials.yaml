company:
  name: Crimson Education
chapter:
  number: 4
  title: Financials
  summary: Crimson has multiple monetization paths and management reports substantial sales, organic activity, and no debt, but the assigned public evidence does not establish recognized revenue, margins, profitability, cash, or runway. High-touch delivery, variable anecdotal pricing, and incomplete financing disclosure make audited segment economics the central underwriting requirement.
sections:
  - id: revenue-architecture
    title: Revenue architecture and public scale
    body: |
      Crimson is not evidenced as a pure software company. Company-issued materials describe admissions strategy, research mentoring, tutoring, online-school offerings, and software-assisted education, while an independent directory also identifies Crimson Global Academy as an online high school. The CEO separately said that a Revision Village teacher product had reached more than 500 schools. These surfaces support a diversified portfolio, but none provides segment revenue, revenue recognition, contract duration, renewal, or gross-profit contribution. Management's strongest scale statement is more than $420 million in sales in the year preceding an interview, with $400 million described as organic; the fetched interview does not identify the publication date or accounting basis. Accordingly, sales should not be relabeled as revenue or ARR, and product breadth should not be mistaken for proven recurring quality.
    claimRefs: [CI001, CI002, CI003, CI005, CI015]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-delivery
    title: Pricing, GTM, and service-delivery economics
    body: |
      Public pricing evidence is fragmented and anecdotal. A 2019 investigation reported contracts as high as $60,000 and terms that could continue payment obligations even when a student stopped pursuing an overseas application. A Quora contributor reported paying about $12,000 and described the payment as non-refundable. These observations are neither a current list price nor a representative realized-price distribution. On the cost side, a former tutor's Reddit comment cited a $13.55 competitive bid and typical bids of $20-$25, while company recruitment copy describes one-to-one and small-group tutoring. The combination suggests a labor-mediated delivery model with potential spread between customer price and tutor compensation, but it cannot establish take rate, utilization, CAC, payback, contribution margin, or service quality at company scale.
    claimRefs: [CI002, CI011, CI012, CI013, CI015]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: |
      Management said Crimson had no debt and funded activity from operating free cash flow plus fundraising, but no balance sheet or cash-flow statement in the pool corroborates that posture. Financing references also require careful attribution: a company-issued job repost cites a USD $40 million Series D at a USD $640 million valuation; Tracxn reports $114 million raised across four rounds and a $40.1 million July 2024 Series D; and the Australian Financial Review reported an NZ$67 million transaction that valued the company at about $1 billion. These can describe different dates, currencies, and transaction conventions rather than a single reconcilable metric. Forge, meanwhile, displayed limited market activity and no available funding-round details, total funding, or post-money valuation. Funding raised is not cash available, and the sources do not establish burn, runway, debt-like obligations, or the next financing trigger.
    claimRefs: [CI004, CI006, CI007, CI008, CI010]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: |
      The financial case is promising but not underwritable from public evidence. Reported sales scale, software adoption, and a claimed no-debt posture are positive signals; a Tracxn headcount of 2,011 as of September 30, 2026 also points to a substantial operating base. Yet the business appears to combine labor-intensive services, school delivery, software, and acquisition-led expansion, making blended sales an especially weak substitute for segment economics. A public discussion also questioned admissions-result claims because no denominator or cross-admit rate was supplied, limiting the ability to connect outcomes to pricing power or retention. Investment diligence should therefore prioritize audited statements, product-level revenue and gross margin, cohort retention, CAC/payback, working capital, cash and runway, acquisition obligations, and the preference stack before using sales or valuation as evidence of financial quality.
    claimRefs: [CI003, CI004, CI005, CI009, CI010, CI014, CI015, CI016]

