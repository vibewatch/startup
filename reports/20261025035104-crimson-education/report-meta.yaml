  topStrengths:
    - Multi-product platform spanning admissions consulting, online schooling, tutoring, and education software.
    - International delivery footprint and reported operating scale.
    - Meaningful financing and governance signals, including a broadened board.
  topRisks:
    - Audited revenue, margin, cash-flow, and segment economics are not publicly available.
    - Public valuation and financing records conflict on currency, timing, and transaction terms.
    - High-touch service delivery creates exposure to quality variance, labor intensity, and consumer-contract risk.
  unresolvedGaps:
    - Audited FY2023-FY2026 financial statements with revenue, gross margin, EBITDA, cash flow, and segment detail.
    - >-
      Cohort retention, churn, attach-rate, CAC, payback, and utilization data across counseling, CGA, and Revision
      Village.
    - Current cap table, liquidation preferences, dilution terms, and secondary-transfer restrictions.
    - Evidence on school-unit economics, teacher utilization, student retention, and exam-centre completion outcomes.
    - Governance and IPO-readiness materials establishing whether a near-term public-listing path is realistic.
