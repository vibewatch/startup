figures:
  - id: FM001
    title: Evidence-constrained market sizing lenses
    summary: The available evidence spans a third-party market estimate, observed premium prices, company client scale, and an admissions-demand proxy; these are ordered lenses, not a mathematically additive TAM/SAM/SOM.
    type: pyramid
    data:
      nodes:
        - label: "College-consulting market estimate"
          value: "~$2.9B"
          unit: "USD"
          detail: "Sherwood citing IBISWorld; geography and methodology not shown in fetched text"
        - label: "Premium program price"
          value: "$25,000-$200,000"
          unit: "USD per family program"
          detail: "Price observations, not market volume"
        - label: "Crimson reported client scale"
          value: "~8,000"
          unit: "clients in 2024"
          detail: "Wikipedia summary; denominator and current retention unavailable"
        - label: "Admission-demand proxy"
          value: "76.8%"
          unit: "of 185 surveyed colleges"
          detail: "Considerable importance assigned to college-prep grades by NACAC in Fall 2023"
        - label: "Online-school adjacency"
          value: "Accredited"
          unit: "teacher-led school"
          detail: "CGA describes recognized academic outcomes; this is not consulting-market volume"
        - label: "Executive-function adjacency"
          value: "New service"
          unit: "company-described"
          detail: "Focus is positioned as accountability and leadership support"
    approximationNotes: "Values are not comparable units and are not additive; the ordering is an evidence hierarchy from broad market lens to company scale and demand proxy, not proportional magnitude."
    claimRefs: [CM002, CM005, CM007, CM008]
callouts:
  - calloutType: insight
    title: Premium demand is real but not yet a SAM
    body: "A large cited market estimate and high observed program prices establish a plausible premium category, but no assigned source supplies the geography, eligible-household count, conversion funnel, or product-level economics required for a defensible Crimson SAM or SOM."
    claimRefs: [CM002, CM005, CM009]
  - calloutType: risk
    title: Outcome attribution and trust are the key constraints
    body: "NACAC's evidence indicates that grades and curriculum dominate admission decisions, while public complaints and light-regulation commentary raise trust questions; Crimson therefore needs verified, product-level outcome and retention evidence before the market opportunity can support a higher-confidence valuation."
    claimRefs: [CM009, CM015, CM016, CM017, CM018]
