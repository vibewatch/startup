      - ["Community and engagement", "Support clubs, meetups, badges, and student participation", "Moderation and safeguarding operations", "Test child safety, moderation, and escalation"]
      - ["AI-enabled learning support", "Provide inquiry support and teacher insights", "EMI platform as described by school profile", "Validate model governance, privacy, accuracy, and human review"]
      - ["Quality and outcomes", "Monitor service quality and educational progress", "Distributed staff and outcome data", "Obtain QA sampling, complaints, tutor turnover, and outcome denominators"]
    notes: "This is an evidence-bounded operating model, not a disclosed software architecture; dependencies and controls are diligence questions where the pool lacks technical documentation."
