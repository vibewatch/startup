company:
  name: Crimson Education
chapter:
  number: 1
  title: Company Overview
  summary: Crimson Education is an Auckland-founded, privately held education group combining premium university-admissions consulting with online schooling and related academic services. Current evidence supports a 2013 founding and a late-2024 Series D described as NZ$67 million at more than NZ$1 billion and, in a company-issued job repost, as USD $40 million at USD $640 million; audited economics, cap-table detail, and consistent service quality remain insufficiently disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Crimson Education was founded in 2013 and is headquartered in Auckland, New Zealand. Tracxn describes the company as a provider of application consulting for students seeking higher education, covering university strategy, school selection, deadlines, extracurricular and leadership mentoring, essay development, and feedback from former admissions officers. Independent review material describes a team-based model spanning admissions strategy, essays, research, competitions, test preparation, and an accredited online high school, Crimson Global Academy. The broader group therefore looks less like a single-cycle counseling practice and more like a multi-product education platform, although the available evidence does not disclose segment revenue, margins, retention, or contribution economics.
    claimRefs: [CO001, CO002, CO003, CO004, CO015]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance-and-scale
    title: Leadership, governance, and scale
    body: >-
      The evidence identifies co-founders Jamie Beaton, Sharndre Kushor, and Fangzhou Jiang, with Beaton also identified as chief executive in funding coverage. Tracxn lists nine active board members, including the three founders, investor representative Janine Manning, and five independent board members; a separate 2026 company-issued announcement names former New Zealand prime minister Sir John Key as group chair and Sundeep Jain as an independent director. The board and leadership footprint appears to have broadened as the group scaled, but the source set does not establish the exact effective date of every current appointment or quantify key-person dependence. Reported employee counts vary by source and date, so headcount should remain a diligence item rather than a settled cover metric.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: capital-milestones-and-diligence
    title: Capital, milestones, and unresolved diligence
    body: >-
      Tracxn labels aggregate funding as "$114M" across four rounds, including a "$40.1M" Series D on July 23, 2024, but its fetched text does not expose the currency convention. Startup Daily reports the late-2024 financing as NZ$67 million at more than NZ$1 billion, while a company-issued job repost expresses the same round as USD $40 million at USD $640 million; those stated currencies must not be collapsed into one currency-free value. Startup Daily also reports 22 offices across five continents and FY2024 revenue above US$100 million, but revenue is not ARR, cash balance, or cash generation. User accounts alleging inconsistent adviser quality and high cost make service controls, audited segment economics, outcome denominators, and current cap-table terms the priority diligence asks.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
