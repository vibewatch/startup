callouts:
  - calloutType: strength
    title: Founder-controlled compounding of capital and catalog
    body: >
      Create has paired a data-driven monetization wedge with an aggressive, well-funded acquisition engine, more than doubling its valuation to
      $2.2 billion in under two years while keeping founders in majority control.
    claimRefs:
      - CO022
      - CO024
      - CO033
      - CO036
  - calloutType: risk
    title: Financial opacity and legal exposure sit under the valuation
    body: >
      The public record does not disclose audited financials, exact headcount, or full ownership, and rights-claiming at Create's scale has
      generated recurring copyright litigation that must be underwritten before trusting the $2.2 billion mark.
    claimRefs:
      - CO030
      - CO042
      - CO043
      - CO021
