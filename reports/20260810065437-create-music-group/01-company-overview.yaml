  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current board roster, committee structure, and precise founder/investor ownership percentages.
      whyItMatters: Governance transparency is limited for a company at a $2.2 billion valuation with debt and multiple institutional minorities.
      diligencePath: Request the shareholder agreement, cap table, and board/governance appendix from management.
      relatedQuestionRefs:
        - QO009
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: Audited revenue, gross margin, EBITDA, cash on hand, and the equity/debt split of the March 2026 raise.
      whyItMatters: Valuation underwriting is impossible without clean financials, and the $2.2B mark rests on undisclosed economics.
      diligencePath: Request audited financial statements, a use-of-proceeds schedule, and the facility terms from Truist and Banc of California.
      relatedQuestionRefs:
        - QO020
    - type: enumeration-incomplete
      severity: minor
      topic: headcount
      missingEvidence: A verified current employee count and geographic distribution.
      whyItMatters: Headcount signals operating scale and integration capacity for the acquisition roll-up.
      diligencePath: Request an HR headcount report by function and location as of the latest month.
      relatedQuestionRefs:
        - QO024
    - type: conflicting-data
      severity: minor
      topic: scale-metrics
      missingEvidence: A management-approved definitions table for clients, artists, labels, and streams.
      whyItMatters: Company-sourced scale metrics use overlapping labels that can be misread in later analysis.
      diligencePath: Ask management for a single glossary and audited figures for headline operating metrics.
      relatedTableRefs:
        - TO001
        - TO004
