company:
  name: Create Music Group
chapter:
  number: 1
  title: Company Overview
  summary: >
    Create Music Group is a Los Angeles-headquartered, digitally native music, media and technology company founded in 2015 (originally
    CreateTV) by Jonathan Strauss, Alexandre Williams, and Wayne Hampton. Public evidence consistently supports its evolution from a
    YouTube Content ID royalty-recovery startup into a vertically integrated, acquisitive owner-operator spanning distribution, rights
    management, publishing, sync, marketing, data analytics, and strategic capital. In March 2026 Create completed a $450 million equity-and-debt
    fundraise at a $2.2 billion valuation with Ares Management, 2 Mile, and Flexpoint Ford as minority investors, roughly two years after a
    $165 million round valued it at $1 billion. The story is strong on capital, M&A momentum, and founder control, but leaves material gaps
    around audited financials, exact headcount, and unresolved copyright litigation.
sections:
  - id: identity-product-and-model
    title: Identity, product scope, and business model
    body: >
      Create Music Group (CMG) presents itself as a digitally native music, media, and technology platform rather than a traditional record
      label, and the public record broadly supports that framing. The company was founded in 2015 in Los Angeles under the original name
      CreateTV, initially built to recover unclaimed royalties for electronic and hip-hop artists inside YouTube's Content ID system, where
      incomplete metadata left independent creators' user-generated-content revenue uncollected. From that wedge it expanded into a vertically
      integrated stack that today spans music distribution (through its Label Engine arm), YouTube and UGC monetization, rights management,
      music publishing administration, sync licensing, marketing, content production, data analytics, and strategic capital deployment. The
      company's own homepage describes an all-in-one platform combining technology, data, marketing, and capital to power independent label
      growth, and cites scale signals of 17,000+ clients supported, 100+ countries reached, 9+ label brands, and 10+ years operating. Third-party
      profiles describe distribution for over 75,000 artists and more than 4,000 labels via Label Engine, and by early 2026 company-linked
      coverage placed platform-facilitated volume at more than 200 billion monthly streams across DSPs. The central differentiation, repeated
      across official and independent sources, is that Create aims to give independent artists and labels major-label-grade monetization
      infrastructure while letting them keep ownership and independence — a data-driven, owner-operator model that Strauss contrasts with the
      traditional "golden ear" A&R approach of the majors.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
