      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >
      The founding team is consistently documented. Create was launched in 2015 by Chief Executive Officer Jonathan Strauss, Chief Operating
      Officer Alexandre Williams, and Chief Business Officer Wayne Hampton. Strauss, an American entrepreneur raised in Palos Verdes,
      California, holds a UCLA B.S. in Mathematics and Statistics and is the dominant public voice of the company; his father worked in music
      management, and his data-driven approach to royalty collection is a recurring theme in Billboard, Forbes, and Rolling Stone coverage.
      Williams, a childhood friend and former music producer, had previously worked at the distribution platform Label Engine that Create later
      acquired, giving the founding team direct distribution-infrastructure expertise. The leadership bench has deepened as the company scaled:
      Will Smith serves as Chief Financial Officer, and in February 2026 Create appointed Mitchell Shymansky — former head of data and analytics
      at Universal Music Group — as Chief Data and Technology Officer. The M&A strategy has also brought operator-executives into the group, with
      Nirvana Digital co-founder Manu Kaushish joining as President, India, and Cr2 founder Mark Brown staying on as a President after that
      acquisition. On control, the most important governance fact is that founders remain the majority owners even after the 2026 raise, with
      institutional investors holding only minority stakes; however, the reviewed public record does not disclose a detailed board roster,
      committee structure, or precise ownership percentages, which is a governance-transparency gap for a company at this valuation.
    claimRefs:
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
