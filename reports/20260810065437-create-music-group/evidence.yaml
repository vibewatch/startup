evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and precise founder/investor ownership percentages.
    whyItMatters: >-
      Governance transparency is limited for a company at a $2.2 billion valuation with debt and multiple institutional
      minorities.
    diligencePath: Request the shareholder agreement, cap table, and board/governance appendix from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, cash on hand, and the equity/debt split of the March 2026 raise.
    whyItMatters: Valuation underwriting is impossible without clean financials, and the $2.2B mark rests on undisclosed economics.
    diligencePath: >-
      Request audited financial statements, a use-of-proceeds schedule, and the facility terms from Truist and Banc of
      California.
    relatedQuestionRefs:
      - QO020
  - type: enumeration-incomplete
    severity: minor
    topic: headcount
    missingEvidence: A verified current employee count and geographic distribution.
    whyItMatters: Headcount signals operating scale and integration capacity for the acquisition roll-up.
    diligencePath: Request an HR headcount report by function and location as of the latest month.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A management-approved definitions table for clients, artists, labels, and streams.
    whyItMatters: Company-sourced scale metrics use overlapping labels that can be misread in later analysis.
    diligencePath: Ask management for a single glossary and audited figures for headline operating metrics.
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      CMG's internal revenue split across distribution, YouTube/UGC monetization, publishing administration, sync,
      artist services, and catalog, plus paying-client counts by segment.
    whyItMatters: >-
      Without internal segment data, external market estimates can only bound the opportunity loosely and cannot produce
      a decision-grade CMG SAM or SOM.
    diligencePath: >-
      Request cohort-level revenue by product line, client counts by segment, and catalog underwriting assumptions from
      management and reconcile against pipeline data.
    relatedQuestionRefs:
      - QM014
      - QM026
  - type: conflicting-data
    severity: material
    topic: music-publishing
    missingEvidence: >-
      A high-quality, transparent third-party benchmark that reconciles the roughly USD 7.3 billion to USD 12.4 billion
      spread in 2026 music publishing estimates.
    whyItMatters: >-
      A 40%-plus gap between reputable-sounding publishers makes any single publishing TAM unreliable for valuation
      work.
    diligencePath: >-
      Obtain IFPI/NMPA primary publishing revenue data and paid analyst reports that disclose methodology and
      segmentation.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: music-distribution
    missingEvidence: >-
      A reconciled estimate of the music distribution services market, which ranges from about USD 1.25 billion to more
      than USD 3 billion across publishers.
    whyItMatters: >-
      The service-fee layer is where CMG's distribution product competes, so its true size affects competitive and
      margin analysis.
    diligencePath: >-
      Triangulate distributor-disclosed take rates and volumes with independent analyst segmentation of the distribution
      market.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: minor
    topic: ugc-monetization
    missingEvidence: >-
      A primary YouTube or IFPI disclosure isolating the UGC/Content ID share of music payouts rather than blog-tier
      estimates.
    whyItMatters: >-
      UGC monetization is CMG's founding competency, so a precise UGC pool size materially informs its core-market
      thesis.
    diligencePath: Pull YouTube's official music-payout disclosures and IFPI's platform-revenue breakdowns for the latest period.
    relatedQuestionRefs:
      - QM011
  - type: private-evidence-only
    severity: material
    topic: commoditized distribution price-floor risk to CMG economics
    missingEvidence: >-
      CMG's revenue split by layer (distribution vs Content ID vs publishing/sync vs catalog) and gross margin exposure
      to the sub-$25 distribution price floor.
    whyItMatters: >-
      Public pricing shows the distribution floor is commoditized, but without CMG's internal mix it is impossible to
      quantify how much of its economics is exposed to that price pressure.
    diligencePath: >-
      Request CMG revenue and gross-margin breakdown by service layer and the share of revenue tied to flat-fee
      distribution versus rights and catalog.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitor private funding ARR and churn for underwriting
    missingEvidence: >-
      Current ARR, funding, headcount efficiency, and churn for DistroKid, Stem, Symphonic, ONErpm, Vydia, and CMG's
      catalog-acquisition returns.
    whyItMatters: >-
      Public scale signals are uneven, so the competitive set can only be ranked directionally rather than on audited
      financial strength.
    diligencePath: >-
      Refresh capitalization, audited revenue, and retention for each shortlisted competitor via paid market
      intelligence and management diligence.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: content-id-moat durability and claim legitimacy
    missingEvidence: >-
      Independent audit of CMG's Content ID claim legitimacy, dispute rates, and payout durability under tightening
      anti-fraud enforcement.
    whyItMatters: >-
      The Content ID moat is central to the thesis, but abuse scrutiny and AI-fraud filtering could erode payouts in
      ways public sources cannot quantify.
    diligencePath: >-
      Obtain CMG's Content ID claim-dispute metrics, revenue concentration, and compliance controls, and benchmark
      against platform policy changes.
    relatedQuestionRefs:
      - QP019
      - QP020
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin and cost-to-serve by revenue stream (distribution, Content ID, publishing, sync, catalog, financing).
    whyItMatters: >-
      Without margin data the capital-intensity of catalog and advance activity cannot be separated from asset-light
      distribution economics, blocking any revenue-quality judgment.
    diligencePath: >-
      Request an audited or management gross-margin bridge segmented by stream, including cost-to-serve and catalog
      amortization.
    relatedQuestionRefs:
      - QI019
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash on hand, monthly net burn, runway, and drawn/undrawn debt under the Truist and Banc of California
      facilities.
    whyItMatters: >-
      The large raise does not prove long runway without burn and debt-term context, and leverage could constrain future
      capacity.
    diligencePath: Request the latest balance sheet, monthly net burn, debt schedule, covenants, and maturities.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: advance-risk
    missingEvidence: The Create Capital advance book and Create Carbon loss/recoupment data.
    whyItMatters: Advance products drive working-capital intensity and credit risk that directly affect cash conversion and margins.
    diligencePath: Request advance-book aging, recoupment percentages, default/write-off history, and financing spreads.
    relatedQuestionRefs:
      - QI013
    relatedTableRefs:
