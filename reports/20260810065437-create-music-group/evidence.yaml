    severity: material
    topic: revenue-estimate
    missingEvidence: Company-confirmed audited revenue and ARR to validate the $87.6M 2024 and $150M–$200M 2026 estimates.
    whyItMatters: Valuation and growth analysis rest on third-party estimates that could be materially wrong.
