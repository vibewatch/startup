- id: capital-structure-and-adequacy
  title: Capital structure and forward capital adequacy
  body: 'CMG''s balance-sheet capacity is unusually strong for an independent music company, which is the single clearest fact in its financial profile. The March 2026 financing added more than $450M of new equity and debt capital, explicitly earmarked for continued acquisitions, strategic investments, technology development, and global expansion, and was struck at a $2.2B mark while founders retained majority control—evidence of investor appetite to fund an acquisition-led strategy. The 2024 Flexpoint Ford round had earlier supplied $165M at a $1B valuation, an earlier layer of the same capacity. Critically, the 2026 round introduced bank debt: Truist Securities and Banc of California acted as joint lead arrangers on expanded facilities, so leverage now sits inside the capital structure alongside heavy M&A spend. Create disclosed deploying more than $500M across acquisitions and advances in the trailing twelve months, including a $300M-plus Create Capital investment into Nettwerk and a $50M artist-investment pledge tied to Monstercat. That deployment pace is the flip side of the strong raise: it consumes capital quickly and ties returns to catalog performance and advance recoupment. Cash on hand, monthly burn, runway, and debt terms are all undisclosed, so near-term capacity looks ample while cash-conversion risk stays unquantified.'
