callouts:
- calloutType: insight
  title: A diversified, capital-backed rights platform—not a single-stream distributor
  body: CMG stacks distribution fees, Content ID revenue-share, publishing, sync, owned labels, acquired catalogs, and a financing arm. That breadth reduces single-stream dependence and creates multiple monetization surfaces, but it also makes capital deployment and advance recoupment central to the model, so the business behaves more like a capital-intensive rights owner-operator than an asset-light distributor.
  claimRefs:
  - CI001
  - CI006
  - CI032
  - CI037
- calloutType: risk
  title: Bank debt plus aggressive M&A and advances concentrate cash-conversion risk
  body: The March 2026 round layered Truist and Banc of California facilities onto more than $500M of trailing-year deployment into acquisitions and advances. Leverage, covenants, and refinancing exposure now sit inside the structure, and Create Capital and Create Carbon add recoupment risk. With cash, burn, runway, and recoupment rates undisclosed, the very capacity that funds growth is also the least transparent part of the financial profile.
  claimRefs:
  - CI012
  - CI019
  - CI031
  - CI033
- calloutType: assumption
  title: Revenue figures are external estimates, not audited disclosure
  body: The $87.6M 2024 figure and the $150M–$200M 2026 band come from third-party aggregators and industry estimates, not company financials. They are directionally useful for scale but cannot anchor valuation or margin analysis. Treat them as estimates pending audited revenue, net take-rate, and gross-margin data.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI034
