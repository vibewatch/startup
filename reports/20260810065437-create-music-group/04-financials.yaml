tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Music distribution (Label Engine)
    - Digital distribution, royalty accounting, and promotion for artists and labels in exchange for distribution/administration fees
    - Fee plus percentage of royalties per release/label
    - 26M+ tracks delivered, 1B+ royalties processed; reaches 75,000+ artists and 4,000+ labels
    - Core recurring rights flow
    - Request blended take-rate, net vs gross royalties, and label churn
  - - YouTube Content ID monetization
    - Revenue-share on ad monetization of claimed user-generated and catalog uploads
    - Percentage of Content ID ad revenue
    - Origin business; taps a pool YouTube says exceeds $12B paid to rightsholders
    - Durable but rate-pressured and dispute-prone
    - Request Content ID net revenue, payout share, and claim-dispute rates
  - - Publishing administration
    - Collects mechanical and performance royalties on compositions for an admin fee
    - Percentage admin fee on collections
    - Part of rights mix (Enhanced, Nettwerk IP)
    - Recurring, annuity-like
    - Request admin roster size, collection percentage, and pipeline backlog
  - - Sync licensing
    - Places masters and compositions into film, TV, ads, and games
    - Per-deal fee or revenue split
    - Part of rights mix; episodic
    - High-margin but lumpy
    - Request sync revenue, active pipeline, and repeat-client mix
  - - Owned labels and label services (broke., Monstercat, !K7)
    - Recording revenue plus marketing and A&R services for owned and partner labels
    - Per-release and catalog economics
    - 9+ label brands; Monstercat carries a $50M two-year artist-investment pledge
    - Capital-intensive, advance-heavy
    - Request P&L by label and advance-recoupment status
  - - Catalog and master income
    - Ongoing royalties from acquired catalogs and masters
    - Recurring royalty streams
    - Funded by $500M+ deployed (Cr2 Records, Deadmau5, Nettwerk IP)
    - Annuity-like but acquired with capital
    - Request catalog ROI, multiples paid, and impairment testing
  - - Create Capital advances / royalty financing
    - Advances royalty-backed capital into labels and catalogs, earning financing spread against recoupment
    - Financing spread and recoupment schedule
    - $300M+ invested into Nettwerk plus follow-on commitments
    - Working-capital intensive; recoupment risk
    - Request advance book, recoupment rates, and default/write-off history
  - - Create Carbon card / artist advances
    - Royalty-linked credit card that fronts earned royalties in real time using CMG's analytics
    - Fees, interest, and float on prepaid royalties
    - Beta since 2021; nascent, fintech-like
    - Least proven commercially
    - Request adoption, loss rates, and revenue contribution
  notes: Streams are mapped from official and third-party sources; the ordering does not rank present revenue contribution because net revenue by stream is undisclosed. Null-equivalent economics are captured in the unit-economics and gaps tables.
