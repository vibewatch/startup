  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Gross margin and cost-to-serve by revenue stream (distribution, Content ID, publishing, sync, catalog, financing).
    whyItMatters: Without margin data the capital-intensity of catalog and advance activity cannot be separated from asset-light distribution economics, blocking any revenue-quality judgment.
    diligencePath: Request an audited or management gross-margin bridge segmented by stream, including cost-to-serve and catalog amortization.
    relatedQuestionRefs:
    - QI019
    - QI006
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash on hand, monthly net burn, runway, and drawn/undrawn debt under the Truist and Banc of California facilities.
    whyItMatters: The large raise does not prove long runway without burn and debt-term context, and leverage could constrain future capacity.
    diligencePath: Request the latest balance sheet, monthly net burn, debt schedule, covenants, and maturities.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: advance-risk
    missingEvidence: The Create Capital advance book and Create Carbon loss/recoupment data.
    whyItMatters: Advance products drive working-capital intensity and credit risk that directly affect cash conversion and margins.
    diligencePath: Request advance-book aging, recoupment percentages, default/write-off history, and financing spreads.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-estimate
    missingEvidence: Company-confirmed audited revenue and ARR to validate the $87.6M 2024 and $150M–$200M 2026 estimates.
    whyItMatters: Valuation and growth analysis rest on third-party estimates that could be materially wrong.
    diligencePath: Obtain audited consolidated financials and monthly recurring revenue by stream directly from the company.
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: catalog
    missingEvidence: Acquisition multiples, royalty yield, and impairment testing on the $500M+ deployed into catalogs and labels.
    whyItMatters: Returns on deployed capital determine whether the acquisition-led strategy compounds or destroys value.
    diligencePath: Request per-deal multiples, expected and realized royalty yield, and impairment tests for acquired catalogs.
    relatedTableRefs:
    - TI005
