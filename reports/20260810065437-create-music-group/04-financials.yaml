- id: diligence-blockers-and-verdict
  title: Diligence blockers and financial verdict
  body: 'The financial verdict is split. On revenue quality, CMG has a genuinely diversified, capital-backed rights business with a durable Content ID origin engine, a large distribution footprint, and a growing catalog and financing arm—but the retained public record discloses none of the metrics needed to grade that quality. Missing items include audited revenue and ARR, gross margin by stream, the advance and recoupment book behind Create Capital and Create Carbon, catalog acquisition multiples and yield on the $500M-plus deployed, and cash, burn, and runway. The capital structure adds a specific risk: bank debt from the Truist and Banc of California facilities layered onto aggressive M&A raises leverage and refinancing exposure if catalog cash flows underperform, and advance products expose the company to recoupment shortfalls. There is also a reputational overhang from denied allegations that CMG collected YouTube royalties it was not entitled to, which matters because per-stream monetization is being pressured by streaming-fraud crackdowns and rising independent supply. The net read is positive on capital access and monetization breadth, but incomplete on margin path and capital intensity; the next diligence layer must move from financing announcements into take-rate, recoupment, and cash-conversion data.'
