runDate: '2026-08-10'
company:
  name: Create Music Group
chapter:
  number: 4
  title: Financials
  summary: 'Create Music Group (CMG) runs a diversified music-rights business that monetizes through distribution and administration fees, YouTube Content ID revenue-share, publishing administration, sync licensing, owned labels, acquired catalogs, and a capital arm (Create Capital advances and the Create Carbon royalty-linked card). Public evidence supports strong capital access—over $450M of new equity and debt raised in March 2026 and more than $500M deployed into acquisitions and advances in the trailing year—but almost every underwriting metric (net take-rate, gross margin, advance-recoupment rates, cash on hand, burn, runway) is undisclosed. External estimates put 2024 revenue near $87.6M and 2026 revenue in a $150M–$200M range, but these are unverified. The investable read is a capital-backed, acquisition-led rights platform whose revenue quality and margin durability cannot yet be underwritten from public data.'
sections:
- id: revenue-model-and-streams
  title: Revenue model and monetization streams
  body: 'Create Music Group monetizes music rights across several stacked streams rather than a single subscription or take-rate. The origin engine is YouTube Content ID: CMG began in 2015 by collecting unclaimed royalties on user-generated uploads and earning a revenue-share of the ad monetization that Content ID enables, a pool that YouTube says has paid rightsholders more than $12 billion since launch. On top of that, Label Engine—CMG''s distribution and accounting arm—delivers digital distribution, royalty processing, and promotion for tens of thousands of artists and thousands of labels, taking distribution and administration fees on the flows it manages. The rights mix also spans publishing administration, sync licensing, owned label brands (broke., Monstercat, !K7), and income from acquired catalogs and masters (Cr2 Records, Deadmau5, Nettwerk IP). A distinguishing feature is CMG''s capital layer: Create Capital advances royalty-backed capital into labels and catalogs, and the Create Carbon card lets artists draw earned royalties in real time. That converts CMG''s daily royalty-analytics data into advance and financing products, but it also means capital deployment and recoupment sit at the center of the financial model rather than at the edge.'
