- id: pricing-monetization-and-take-rate
  title: Pricing, monetization, and take-rate proxies
  body: 'CMG''s pricing is deal-led and largely opaque, which is normal for a rights aggregator but limits public underwriting. Unlike flat-fee distributors such as DistroKid, CMG''s economics resemble a percentage take of client royalties across distribution, Content ID, publishing, and sync, so its true revenue base is net take-rate on gross flows rather than the gross royalties passing through the platform. Label Engine advertises "point-and-click royalty management" and reports more than 1 billion in royalties processed and 26 million-plus tracks delivered, but the realized fee percentage is never disclosed. The Content ID business historically settled the large majority of competing-claim conflicts in CMG''s favor—an efficiency the company touts but that competitors have criticized as aggressive. On the capital side, Create Capital''s $300M-plus Nettwerk investment and the Create Carbon card carry recoupment schedules and financing spreads that are entirely private. The practical implication is that public list terms cannot reveal blended take-rate, gross margin, or advance economics; the monetization surface is visible, but the unit economics behind each surface are not. Investors must therefore treat every pricing datapoint here as a directional proxy, not a realized-revenue figure.'
