artifact: customers
slug: create-music-group
runDate: '2026-08-10'
company:
  name: Create Music Group
chapter:
  number: 6
  title: Customers
  summary: 'Create Music Group''s (CMG) customers are independent artists, labels, catalog owners, and creators, with digital service providers (Spotify, Apple Music, and above all YouTube) acting as the payers that route streaming and ad royalties back through CMG''s platform. The strongest customer proof is inorganic and production-grade: whole label rosters — Monstercat, !K7, and Nettwerk — now sit on CMG''s platform, alongside distributed labels such as Insomniac Music Group and Disciple and historical distribution/publishing clients like 6ix9ine. Adoption breadth is real (17,000+ clients, a 200B+ monthly-stream owned audience), but durability is largely unproven: there is no public NRR, GRR, or churn, and the customer record carries unusually heavy adverse signal — the APG poaching lawsuit, the earlier Cinq and DigiGlo suits, Billboard''s YouTube Content ID over-claiming investigation, and sharply negative Label Engine reviews. Logos and acquired rosters are abundant; audited retention and concentration data are the central diligence gaps.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'CMG''s customer base is best read on three axes at once: who uses the product, who buys it, and who ultimately pays. The users and buyers are independent artists, independent labels, label groups, and catalog owners; the payers are the digital service providers — most importantly YouTube, whose Content ID ad revenue is the historical core, plus Spotify and Apple Music streaming. That buyer/payer split matters because CMG''s original business was collecting money from platforms on behalf of rightsholders, not selling software to end users. By vertical, the center of gravity is electronic/EDM: Monstercat, !K7, deadmau5/mau5trap, Enhanced, and Disciple are all dance-music franchises, while hip-hop and rap form the heritage vertical seeded by early distribution and publishing clients such as 6ix9ine and YNW Melly. By size, the base spans the full range from long-tail DIY artists using Label Engine self-service tooling, through established independent labels with thousands of releases, up to catalog owners and forty-year-old label groups like Nettwerk. Geographically the footprint is global, spanning 100+ countries with offices reaching Berlin, London, New York, and Vancouver through acquired companies. The recurring limitation is that CMG discloses aggregate reach but not a segment-level revenue or account census, so segment economics remain inferred rather than verified.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
