  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Public NRR, GRR, logo churn, renewal rates, cohort-retention tables, and artist/roster retention post-acquisition by segment.
    whyItMatters: Without durability metrics it is impossible to distinguish healthy expansion from captive-but-dissatisfied rosters or high DIY-tier churn.
    diligencePath: Request cohort-retention schedules, NRR/GRR by client type, roster retention 12-24 months post-close, and churn reasons.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Revenue by acquired entity, top-catalog and top-roster revenue share, and organic-vs-inorganic client-growth split.
    whyItMatters: A few anchor rosters or catalogs could contribute an outsized share of revenue and churn risk, but CMG discloses no concentration data.
    diligencePath: Request revenue by acquired entity, top-10 client/catalog revenue share, and organic-vs-inorganic growth before underwriting durability.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A fuller census of CMG's distributed and acquired clients with consistent fields for roster size, deployment depth, outcome, and recency.
    whyItMatters: The retained proof table is representative rather than exhaustive, so it supports pattern recognition more than segment-mix precision.
    diligencePath: Expand the customer set with additional press releases, distribution disclosures, procurement records, and customer-operated sites, then normalize into one census.
