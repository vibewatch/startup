callouts:
- calloutType: insight
  title: Customer proof is deep on embedding but shallow on durability
  body: CMG can point to more production-grade named rosters than most companies its age — Monstercat, !K7, Nettwerk, Insomniac, Disciple, and historical hip-hop clients. Yet nearly all of that proof is acquisition-based or vendor-authored, and none of it discloses roster retention, renewal, or churn. Investors should treat the customer base as broad and embedded, but not yet demonstrably durable.
  claimRefs:
  - CU015
  - CU017
  - CU018
  - CU033
- calloutType: risk
  title: The customer record carries unusually heavy adverse signal
  body: For a customers chapter, the volume of disputes is striking — the APG poaching lawsuit, the pending DigiGlo suit, the dismissed Cinq suit, the settled 6ix9ine matter, sharply negative Label Engine reviews, and Billboard's Content ID over-claiming investigation. Individually each is contestable; together they raise a real question about customer trust and about the durability of the YouTube Content ID revenue that underpins the model.
  claimRefs:
  - CU023
  - CU026
  - CU028
  - CU030
  - CU039
- calloutType: assumption
  title: Growth depends on the acquisition flywheel continuing to work
  body: The strongest evidence for customer expansion is capital-and-acquisition driven — $50M into Monstercat, $300M into Nettwerk, $55M for deadmau5 masters. This assumes CMG can keep sourcing, funding, and retaining anchor rosters while its artist-services flywheel holds low-switching-cost DIY clients. If either the deal pipeline or Content ID monetization falters, the concentration risk the company does not disclose becomes the dominant variable.
  claimRefs:
  - CU035
  - CU037
  - CU038
  - CU041
