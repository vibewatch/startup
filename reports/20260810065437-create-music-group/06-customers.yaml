  - - Litigation / reputational overhang
    - Counterparty concentration in active disputes
    - Reputational risk can impede winning label clients
    - Request legal reserves and claim win-rate history
  notes: Expansion logic is well evidenced from press releases and acquisition disclosures, but every concentration cell is undisclosed publicly; the diligence paths convert each unknown into a specific data request.
