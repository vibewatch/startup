- id: expansion-and-concentration
  title: Expansion loops and concentration risk
  body: 'CMG''s expansion logic is a capital-and-acquisition flywheel: buy or bankroll a label or catalog, onboard its roster onto the platform, monetize it through distribution and YouTube Content ID, and recycle the cash and the owned audience into the next deal. The mechanism is well evidenced — the $50 million Monstercat commitment, the $300 million Nettwerk investment through Create Capital, and the $55 million deadmau5 masters purchase all fit the pattern — and the artist-services positioning (artists keep ownership while getting major-label-grade monetization) is the organic complement that keeps indie clients on the platform. But the same structure creates concentration and dependency risk that the public record cannot size. A handful of anchor rosters and catalogs may drive an outsized share of revenue, yet CMG discloses no revenue-by-entity or top-catalog contribution. The business also depends heavily on a narrow set of payers — YouTube Content ID above all — which is precisely the channel most exposed to the over-claiming allegations and litigation; an adverse ruling or a YouTube policy change would strike the core monetization engine. At the DIY tier, switching costs are low and competitors like DistroKid and UnitedMasters are one click away, so organic retention is unproven. Expansion is therefore credible and capital-backed, but its durability hinges on concentration, channel, and litigation variables that remain undisclosed.'
