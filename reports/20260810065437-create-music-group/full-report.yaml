      - number: '6.2'
        title: Adoption trajectory and platform scale
        blocks:
          - type: paragraph
            body: >-
              The adoption story is unusually inorganic. Rather than compounding a single self-serve funnel, CMG has
              bought adoption by acquiring whole customer rosters and centralizing them onto one platform, which the
              company describes as encompassing 17,000+ clients and generating a 200B+ monthly-stream owned audience
              across digital service providers. On top of that base, the trailing year added an aggressive cadence of
              roster onboardings: the deadmau5 and mau5trap catalogs and !K7 in spring 2025, Monstercat in May 2025, and
              the Nettwerk management buyout in February 2026. The acquired assets carry their own adoption depth —
              Monstercat alone has released more than 8,000 recordings and extends into gaming (Rocket League, Fortnite,
              Roblox) and creator sync via Monstercat Gold on YouTube and Twitch. The distribution back end, Label
              Engine, reports 26M+ tracks delivered and 1B+ in royalties processed, evidence of real B2B throughput
              beneath the label brands. What the public record does not provide is the denominator behind any of these
              numbers: how many clients are active versus dormant, how many of the 75,000+ distributed artists transact
              regularly, or how much of the 200B+ streams is attributable to owned catalog versus administered
              third-party rights. Adoption breadth is therefore well evidenced; adoption intensity per client is not.
            claimRefs:
