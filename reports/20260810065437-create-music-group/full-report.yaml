      - number: '3.3'
        title: Moats, switching costs, and distribution power
        blocks:
          - type: paragraph
            body: >-
              CMG's most defensible asset is its rights-management infrastructure. YouTube's Content ID has paid
              rightsholders more than $12 billion cumulatively, and over 90% of rightsholders choose to monetize rather
              than block, so a partner that reliably claims and clears unmatched revenue at scale earns a recurring,
              hard-to-replicate position with DSPs and UGC platforms. Catalog ownership adds a second, capital-intensive
              moat: unlike a distributor that merely rents shelf space, CMG owns masters and publishing income streams
              that persist regardless of which distributor an artist later chooses. But the layers underneath are weak
              on lock-in. Distribution is close to a commodity — flat-fee, non-exclusive, and easy to leave — so artists
              routinely multi-home and switching costs are low. Partner and DSP relationships are shared: Content ID
              access is available to AdRev, Audiam, Vydia, and every major distributor, so it is table stakes rather
              than an exclusive channel. Distribution power ultimately sits with the DSPs and with YouTube, not with any
              one aggregator, which caps how much pricing leverage a middle-layer platform can extract. The durable
              question for CMG is whether integration plus catalog ownership converts into retention and pricing power
              that a single-layer rival cannot match.
