        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is deep on embedding but shallow on durability
            body: >-
              CMG can point to more production-grade named rosters than most companies its age — Monstercat, !K7,
              Nettwerk, Insomniac, Disciple, and historical hip-hop clients. Yet nearly all of that proof is
              acquisition-based or vendor-authored, and none of it discloses roster retention, renewal, or churn.
              Investors should treat the customer base as broad and embedded, but not yet demonstrably durable.
