            body: >-
              The public traction signals are directionally strong but rest on estimates and company scale claims rather
              than audited disclosure. Third-party aggregator Growjo estimates CMG's 2024 revenue at $87.6M, with
              revenue per employee around $315,000 across roughly 278 people, while industry estimates place 2026
              revenue or ARR in a wide $150M–$200M band that the company has not confirmed. Company-side scale markers
              include 17,000-plus clients supported across 100-plus countries, 9-plus label brands, distribution
              reaching 75,000-plus artists and 4,000-plus labels, and 200 billion-plus monthly streams across DSPs in
              early 2026. Those volume signals underpin the size of the royalty pool CMG monetizes, but volume is not
              the same as net revenue or margin. The estimate range itself implies rapid growth off the 2024 base, yet
              the spread is so wide that it cannot anchor a valuation without underlying figures. Because much of CMG's
              activity funds advances and acquisitions, reported "revenue" also understates the gross flows moving
              through the platform—the underwriting-relevant number is net take-rate revenue, which remains unavailable.
              Every unit-economics cell in this chapter that reads null is a real diligence blocker, not a clerical
