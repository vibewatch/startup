  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Create Music Group does not sit in a single competitive lane; it straddles four buyer-solvable jobs that
              different rivals attack separately. The first is pure self-serve distribution, where DistroKid, TuneCore,
              Amuse, CD Baby, and UnitedMasters push a low, flat annual fee to get an independent artist onto Spotify,
              Apple Music, TikTok, and 150+ platforms while returning most or all royalties. The second is YouTube
              Content ID and broader user-generated-content rights management — CMG's founding wedge — now contested by
              AdRev/FUGA, Audiam, Identifyy, Vydia, and the in-house teams at every major distributor. The third is full
              label services and catalog/IP acquisition, where the major-owned arms (AWAL and The Orchard at Sony,
              Virgin Music Group/Ingrooves at Universal, ADA at Warner) and independent owner-operators and catalog
              buyers (Concord, HYBE, Primary Wave, Reservoir Media, Recognition Music Group, Believe) compete for the
              same masters and advances. The fourth is the status-quo substitute: a direct major-label deal, or a
              self-assembled DIY stack. Because CMG spans all four, its true competitive set is far broader than the
              handful of indie distributors it is usually benchmarked against, and each layer carries a different
              margin, moat, and threat profile.
            claimRefs:
