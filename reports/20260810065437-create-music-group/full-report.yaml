      - number: '8.4'
        title: Anti-thesis and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is about price and evidence sufficiency, not company quality. First, the multiple is rich:
              at ~11x-25x revenue CMG is priced well above listed comparables that grow slower but disclose fully, so
              any deceleration or margin disappointment transmits directly into a lower mark. Second, the monetization
              base is exposed to structural royalty pressure; Deezer's demonetization of AI-generated uploads and DOJ
              streaming-fraud actions underline that a meaningful slice of streaming volume is fraudulent or
              low-quality, and per-stream rates remain under pressure, which threatens the YouTube-rights and
              distribution economics that anchor CMG's cash flow. Third, there is a live copyright-litigation overhang:
              Artist Publishing Group and affiliates sued CMG in the Central District of California alleging "massive
              willful copyright infringement," and prior Billboard and Variety reporting on YouTube royalty-claiming
              practices raises reputational and legal-cost risk that a premium multiple does not price. Fourth, the
              capital structure carries a debt component and undisclosed preference terms, so the effective entry price
              for common-equivalent economics may exceed the headline $2.2B. Each of these is a monitorable trigger:
              growth below plan, a royalty-rate or AI-fraud shock, an adverse litigation outcome, or public-market
              multiple compression would each justify moving from track toward pass or demanding a materially lower
              entry.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV042
              - CV043
          - type: table
            tableRef: TV005
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV042
              - CV043
      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is a genuine part of the CMG story because three credible paths exist, but none is
              underwriteable from public evidence today. An IPO is plausible given the scale signals, the capital arm,
              and the precedent of UMG and HYBE as listed music platforms, yet CMG has disclosed nothing resembling
              IPO-grade financials. A strategic sale to a major -- Universal, Sony, Warner or HYBE -- is conceivable
              given persistent consolidation and the Sony/Recognition and Believe precedents, but antitrust and price
              expectations complicate it. A sponsor-to-sponsor or continuation outcome is the most mechanical path given
              Ares, Flexpoint Ford and 2 Mile are already in the structure. Converting any of these from narrative to
              bankable requires a defined diligence agenda: consolidated financials that reconcile revenue, margin, burn
              and the split between organic and acquired growth; the exact equity-versus-debt composition of the $450M
              and the covenants attached; the current cap table, preference stack and dilution mechanics; and the status
              and exposure of the APG copyright litigation. Those asks are decision-critical rather than cosmetic --
              they determine whether the $2.2B mark is an attractive entry, a fair one, or a stretched one that breaks
              on the first growth or royalty disappointment. Until they are answered, the disciplined verdict is to stay
              engaged, keep tracking, and require private confirmation before upgrading to buy.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV044
