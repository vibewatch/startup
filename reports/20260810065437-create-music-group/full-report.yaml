        title: Exhibits
        blocks:
          - type: callout
            title: Rights recovery plus label-grade back office is the real product
            body: >-
              CMG's edge is not a cheaper upload button but an integrated engine that recovers YouTube UGC revenue,
              distributes to hundreds of DSPs, computes royalty statements, and pays artists in seconds — at a scale
              (200B+ monthly streams, 26M+ tracks delivered through Label Engine) that single-artist tools do not
              operate.
