      - number: '2.2'
        title: Multi-lens sizing and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Because CMG straddles several pools, sizing requires multiple lenses rather than one headline number. On
              the recorded-music lens, IFPI's Global Music Report put 2025 revenue at roughly USD 31.7 billion, up 6.4%
              year on year, with streaming about 69.6% of the total and 837 million paid subscription accounts; MIDiA
              reports a larger USD 39.5 billion because it folds in segments IFPI excludes, an immediate reminder that
              even the "recorded" figure is definition-dependent. Goldman Sachs' Music in the Air frames the whole music
              economy (recorded, publishing, and live) rising from about USD 104.9 billion in 2024 toward nearly USD 200
              billion by 2035. The publishing lens is genuinely contradictory: Mordor Intelligence models about USD
              12.37 billion for 2026 while Global Growth Insights models only about USD 7.33 billion, a gap too wide to
              treat any single figure as ground truth. Total music licensing (sync, performance, mechanical) is near USD
              9.73 billion for 2026, and music distribution services are modeled at roughly USD 1.25 billion. The UGC
              lens is material for CMG's Content-ID heritage: YouTube paid the music industry about USD 8 billion in the
              year to June 2025, of which roughly USD 2.4 billion came from UGC and Content ID, and Content ID has paid
              more than USD 12 billion cumulatively. Catalog acquisition is a multi-billion capital market, with more
              than USD 20 billion deployed since 2019 and multiples resetting to roughly 12-18x. No single external
              number is decision-grade, so the honest read is a layered range, not a point TAM.
