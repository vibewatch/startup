          - type: callout
            title: The monetization engine and the biggest liability are the same system
            body: >-
              The Content ID capability that recovers unclaimed revenue is exactly what a 2022 Billboard/Variety
              investigation and the 2025 APG lawsuit allege is used to over-claim rights that are not CMG's. Because
              value is created at the claiming step, weak metadata discipline is simultaneously a revenue driver and a
              legal/reputational exposure.
            calloutType: risk
            claimRefs:
              - CE033
              - CE034
              - CE036
              - CE037
          - type: callout
            title: Trust posture must be verified, not inferred from scale
            body: >-
              No public evidence surfaced for security certifications, uptime SLAs, Content ID false-positive rates, or
              an independent claim-accuracy audit. Investors should treat these as open items and demand direct
              materials rather than reading trust into the company's size or acquisition pace.
            calloutType: assumption
            claimRefs:
              - CE039
              - CE040
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              CMG's customer base is best read on three axes at once: who uses the product, who buys it, and who
              ultimately pays. The users and buyers are independent artists, independent labels, label groups, and
              catalog owners; the payers are the digital service providers — most importantly YouTube, whose Content ID
              ad revenue is the historical core, plus Spotify and Apple Music streaming. That buyer/payer split matters
              because CMG's original business was collecting money from platforms on behalf of rightsholders, not
              selling software to end users. By vertical, the center of gravity is electronic/EDM: Monstercat, !K7,
              deadmau5/mau5trap, Enhanced, and Disciple are all dance-music franchises, while hip-hop and rap form the
              heritage vertical seeded by early distribution and publishing clients such as 6ix9ine and YNW Melly. By
              size, the base spans the full range from long-tail DIY artists using Label Engine self-service tooling,
              through established independent labels with thousands of releases, up to catalog owners and forty-year-old
              label groups like Nettwerk. Geographically the footprint is global, spanning 100+ countries with offices
              reaching Berlin, London, New York, and Vancouver through acquired companies. The recurring limitation is
              that CMG discloses aggregate reach but not a segment-level revenue or account census, so segment economics
              remain inferred rather than verified.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
