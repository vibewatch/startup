            body: >-
              Every layer CMG occupies has a stronger specialist — DistroKid on distribution price, AdRev on Content ID,
              AWAL on major-backed services, Concord and Primary Wave on catalog. CMG's thesis is that owning
              distribution, rights management, publishing, sync, and catalog under one artist-first roof compounds into
              retention and pricing power no single-layer rival can match. That thesis is plausible but unproven from
              public data.
