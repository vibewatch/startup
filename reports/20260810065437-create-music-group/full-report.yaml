              - CV039
              - CV040
              - CV041
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: High-quality platform, unresolved price
            body: >-
              The public record supports treating CMG as a serious, fast-scaling independent-music platform. It does not
              yet support paying up at ~11x-25x revenue without private confirmation of consolidated economics, the
              equity/debt split of the $450M, the preference stack, and a clean read on the APG litigation. Track and
              diligence before upgrading to buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV031
              - CV044
          - type: callout
            title: The premium prices in growth that is not yet disclosed
            body: >-
              At ~11x-25x revenue CMG sits far above listed comps that grow slower but disclose fully. Any growth
              deceleration, margin disappointment, royalty-rate shock, or adverse litigation outcome transmits directly
              into a lower mark and real down-round risk.
            calloutType: risk
            claimRefs:
              - CV002
              - CV028
              - CV029
              - CV030
          - type: callout
            title: The capital arm is upside only if it clears its cost of capital
            body: >-
              The bull case leans on the $500M+ of trailing deployment and the catalog/investment arm compounding into
              durable royalty streams. That is a justified possibility, not a bankable base case, until deal-level
              returns versus the debt cost are disclosed.
            calloutType: assumption
            claimRefs:
              - CV020
              - CV032
              - CV041
