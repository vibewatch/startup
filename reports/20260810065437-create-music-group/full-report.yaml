      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying center shifts with the client's scale and rights position. Independent solo artists frequently
              act as buyer, user, and payer at once, while independent labels, catalog owners, and creators introduce
              specialized budget owners for distribution, rights administration, and financing. Crucially, the DSPs
              (Spotify, Apple Music, Amazon, YouTube, Deezer) are the ultimate payers of royalties, but they are not the
              customers; CMG's customers are the rights holders who need major-grade monetization infrastructure while
              retaining ownership. Demand is being pulled by a structural shift toward the independent and artist-direct
              segment: independent and artist-direct distribution captured roughly 38% of streaming consumption in Q1
              2026, MIDiA-style ownership estimates put the independent share above 40% of recorded revenue, and the
              broad independent-artists market is modeled around USD 170.9 billion for 2026 as income diversifies across
              streaming, live, merch, and sync. Streaming volume keeps climbing, with Luminate counting 2.8 trillion
              on-demand audio streams in the first half of 2026, and deep-catalog listening dominating consumption. The
              adoption path is a widening ladder: an artist or label onboards for distribution, then layers on rights
              management and Content ID, then publishing administration and sync, and at the top of the ladder a catalog
              owner sells or refinances rights into CMG's capital arm. That laddering is exactly why professionalization
              and multi-rights complexity, not raw stream counts, drive CMG's serviceable demand.
            claimRefs:
              - CM014
