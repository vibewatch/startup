        - id: onboard
          label: Sign / onboard
          actor: Artist, label, or catalog owner
          description: >-
            The client signs a distribution, publishing, Content ID, or catalog deal and migrates rights onto CMG's
            platform.
          channels:
            - Distribution contracts
            - Publishing administration
            - Content ID registration
            - Catalog acquisition
        - id: monetize
          label: Distribute and monetize
          actor: CMG platform + DSP payers
          description: >-
            CMG delivers to DSPs and collects streaming and ad royalties, with YouTube Content ID as the core revenue
            engine.
          channels:
