      - number: '8.3'
        title: Scenario ranges and return logic
        blocks:
          - type: paragraph
            body: >-
              Because the consolidated picture is incomplete, scenario work is more honest than a single point estimate.
              In the bull case CMG sustains triple-digit revenue growth toward and beyond the $200M estimate, the
              YouTube-rights and services engine proves genuinely high-margin, and the Nettwerk, Monstercat, !K7 and
              catalog investments compound into durable royalty streams; under that set of assumptions a valuation
              meaningfully above the $2.2B mark and an eventual multi-billion exit are reasonable, supporting a
              ~$3.0B-$4.5B range. The base case is more conservative: CMG remains a category winner, 2026 revenue lands
              inside the $150M-$200M estimate, margins are good-not-great, and the multiple compresses modestly as
              growth normalizes, which broadly validates the current mark and supports a ~$2.0B-$2.6B range. The bear
              case is not company collapse; it is a repricing in which growth decelerates, AI-driven streaming fraud and
              per-stream royalty compression squeeze the monetization engine, the APG litigation or comparable copyright
              claims impose cost, and public-market multiple compression drags private marks lower, supporting a
              ~$1.0B-$1.6B range and real down-round risk. Weighting these paths roughly 25/50/25 leaves expected value
              near the current mark, which is precisely why the call is track rather than buy: the probability-weighted
              upside does not yet clear the premium with an adequate margin of safety.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV028
              - CV029
              - CV030
