  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth deceleration
        - 2026 revenue below the ~$150M floor of the estimate, or growth falling out of triple digits
        - Undercuts the growth premium embedded in ~11x-25x revenue
        - Move toward pass or demand a lower entry mark
      - - Royalty / AI-fraud shock
        - Material per-stream rate cut or DSP demonetization affecting CMG-administered volume
        - Compresses the monetization engine and margin base
        - Reduce valuation range and confidence
      - - Adverse litigation outcome
        - APG (or comparable) copyright claim resolved against CMG with material damages or injunctive terms
        - Raises legal cost and challenges the rights-claiming model
        - Re-rate downside; reassess rights practices before investing
      - - Capital-arm underperformance
        - Advances/catalog buys demonstrably earning below the debt cost of capital
        - Turns the investment arm from compounder into balance-sheet drag
        - Demand structural discount and covenant review
      - - Public-multiple compression
        - Listed music comps de-rate further on rates or sentiment
        - Drags private marks and next-round pricing lower
        - Widen required margin of safety; delay entry
    notes: >-
      These are the events most likely to change the call after deeper diligence; thresholds are monitorable rather than
      intuition-based.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV042
      - CV043
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Consolidated financials
        - Group revenue, gross margin, EBITDA, burn, cash and free cash flow reconciled to the $150M-$200M 2026 estimate
        - Needed to bridge from qualitative strength to price support at ~11x-25x revenue
        - Finance diligence with management and data room
      - - Organic vs. acquired growth
        - Split of growth between organic and the $500M+ of trailing acquisitions/advances
        - Determines whether the multiple reflects a durable engine or bought revenue
        - FP&A and M&A diligence
      - - Capital structure
        - Exact equity-versus-debt composition of the $450M raise and debt covenants/maturities
        - Fixes the true entry economics and downside sensitivity to leverage
        - Corporate finance and lender diligence
      - - Cap table and preferences
        - Current cap table, preference stack, liquidation waterfall and dilution mechanics
        - Even if quality is high, unfavourable structure can destroy new-investor returns
        - Legal and corporate-finance diligence
      - - Litigation exposure
        - Status, terms and financial exposure of the APG copyright litigation and any similar claims
        - Directly affects legal cost, rights-model durability, and reputational risk
        - Legal diligence and docket review
      - - Monetization durability
        - AI-fraud screening, per-stream rate sensitivity, and YouTube-rights renewal terms
        - Tests the cash-flow base that anchors the valuation
        - Product/operations and platform-partnership diligence
    notes: Every ask here is decision-critical; none are cosmetic, and several are gating for any upgrade to buy.
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
