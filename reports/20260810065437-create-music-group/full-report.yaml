              - CU028
              - CU030
              - CU039
          - type: callout
            title: Growth depends on the acquisition flywheel continuing to work
            body: >-
              The strongest evidence for customer expansion is capital-and-acquisition driven — $50M into Monstercat,
              $300M into Nettwerk, $55M for deadmau5 masters. This assumes CMG can keep sourcing, funding, and retaining
              anchor rosters while its artist-services flywheel holds low-switching-cost DIY clients. If either the deal
              pipeline or Content ID monetization falters, the concentration risk the company does not disclose becomes
              the dominant variable.
            calloutType: assumption
