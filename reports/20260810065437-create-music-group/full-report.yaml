      - number: '7.2'
        title: YouTube / DSP platform dependency and regulatory posture
        blocks:
          - type: paragraph
            body: >-
              Create's economics are built on privileged access to YouTube's Content Management System and Content ID, a
              platform it does not control and whose rules it must follow. YouTube grants Content ID only to owners of
              "a substantial body of original material" and explicitly prohibits manually adding ownership to assets in
              which the claimant has no legitimate interest, "even temporarily"; YouTube says it terminates tens of
              thousands of accounts a year for abusing its copyright tools. That concentration cuts two ways: Content ID
              has paid rightsholders over $12 billion cumulatively, so access is enormously valuable, but a suspension,
              policy change, or CMS-access revocation would strike at the heart of Create's original business. Create
              operates inside a dense regulatory lattice — the US DMCA §512 notice-and-takedown regime, the Music
              Modernization Act and the Mechanical Licensing Collective for mechanical royalties, and the EU's
              Collective Rights Management Directive (2014/26/EU), which imposes transparency, accountability and
              equitable-distribution duties on entities that collect and distribute rightsholder revenue across member
              states. Because Create both collects and distributes third-party royalties at scale, these transparency
              regimes are a live compliance surface, not background noise.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR042
