      - number: '6.3'
        title: Named customer proof and deployment depth
        blocks:
          - type: paragraph
            body: >-
              The named-customer set is dense and, importantly, production-grade rather than pilot logos — but almost
              all of it is acquisition-based or vendor-authored. Monstercat continues to operate under its own
              leadership on CMG's platform with a pledged $50 million artist-investment package, which is a concrete
              production deployment of CMG's capital and infrastructure. !K7 similarly moved its Berlin-based label
              group, the DJ-Kicks series, and Strut Records onto CMG's services. Nettwerk's move is subtler: its CEO
              framed the $300 million Create Capital commitment as a "classic distribution deal" in which Create takes
              no equity, meaning Nettwerk's roster — Passenger, SYML, Paris Paloma, Leisure — becomes a distributed
              client rather than a subsidiary. Beneath the acquired brands, Label Engine publishes named client
              testimonials from Insomniac Music Group (which credits it across 20+ imprints), Disciple, and Kannibalen
              Records, and CMG's own history includes distributing and publishing 6ix9ine, whose "Trollz" gave the
              company its first Billboard Hot 100 number one. The consistent caveat is evidentiary: the strongest
              outcomes are self-reported by CMG, the acquired label executives, or the vendor's own marketing, and none
              of them disclose renewal terms, roster retention post-close, or independent financial outcomes. The proof
              shows real embedding; it does not yet show durable, independently verified success.
