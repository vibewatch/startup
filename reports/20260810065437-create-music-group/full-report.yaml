              artist-first, ownership-retaining posture that Sony- and Universal-owned arms structurally cannot fully
              match. The capability matrix therefore shows CMG strong on rights management, catalog acquisition, and
              services breadth, and merely at-parity on raw distribution — the layer where price competition is fiercest
              and differentiation thinnest.
