  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization streams
        blocks:
          - type: paragraph
            body: >-
              Create Music Group monetizes music rights across several stacked streams rather than a single subscription
              or take-rate. The origin engine is YouTube Content ID: CMG began in 2015 by collecting unclaimed royalties
              on user-generated uploads and earning a revenue-share of the ad monetization that Content ID enables, a
              pool that YouTube says has paid rightsholders more than $12 billion since launch. On top of that, Label
              Engine—CMG's distribution and accounting arm—delivers digital distribution, royalty processing, and
              promotion for tens of thousands of artists and thousands of labels, taking distribution and administration
              fees on the flows it manages. The rights mix also spans publishing administration, sync licensing, owned
              label brands (broke., Monstercat, !K7), and income from acquired catalogs and masters (Cr2 Records,
              Deadmau5, Nettwerk IP). A distinguishing feature is CMG's capital layer: Create Capital advances
              royalty-backed capital into labels and catalogs, and the Create Carbon card lets artists draw earned
              royalties in real time. That converts CMG's daily royalty-analytics data into advance and financing
              products, but it also means capital deployment and recoupment sit at the center of the financial model
              rather than at the edge.
