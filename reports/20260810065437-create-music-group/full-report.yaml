      - number: '1.4'
        title: Milestones, scale, and visible diligence flags
        blocks:
          - type: paragraph
            body: >
              The milestone record shows a company compounding on multiple fronts. After the 2015 founding and the
              pivotal 2016 acquisition of Label Engine (which coincided with the CreateTV-to-Create Music Group
              rebrand), the company built a distribution and publishing business, scored an early Billboard Hot 100
              number one with 6ix9ine and Nicki Minaj's "Trollz," and by January 2019 said it was monetizing roughly
              nine billion streams a month. It ranked #2 on the 2019 Inc. 5000 list of fastest-growing U.S. companies —
              described as the highest placement ever for a music company — and Strauss has since appeared on
              Billboard's Power 100. From late 2021 the company executed a rapid, global acquisition program: Nirvana
              Digital in India (2021), viral marketing agency VRTCL (2022), a 50% stake in UK label and publisher
              Enhanced Music (December 2024), the Deadmau5 and mau5trap catalogs (March 2025), Berlin label group !K7
              Music (April 2025), Canadian electronic label Monstercat (May 2025, with a pledged additional $50 million
              of artist investment), UK dance label Cr2 Records (December 2025), and the Nettwerk investment (2026).
              This M&A intensity is the company's defining strength and, simultaneously, its defining risk. The clearest
              adverse flags are reputational and legal: a September 2022 Billboard investigation reported that YouTube's
              royalty system was "ripe for abuse" and cited industry sources alleging Create claimed royalties on
              content it did not own — including a temporary, erroneous claim on Louis Armstrong's "What a Wonderful
              World" that Create said it corrected — while a 2025 federal copyright suit from Artist Publishing Group
              and an earlier Cinq Music dispute show that rights-claiming at Create's scale generates recurring
              litigation. Underwriting the $2.2 billion valuation therefore requires reconciling genuine capital and
              catalog momentum against undisclosed audited financials and open legal exposure.
