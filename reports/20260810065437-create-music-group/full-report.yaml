            body: >-
              The financial verdict is split. On revenue quality, CMG has a genuinely diversified, capital-backed rights
              business with a durable Content ID origin engine, a large distribution footprint, and a growing catalog
              and financing arm—but the retained public record discloses none of the metrics needed to grade that
              quality. Missing items include audited revenue and ARR, gross margin by stream, the advance and recoupment
              book behind Create Capital and Create Carbon, catalog acquisition multiples and yield on the $500M-plus
              deployed, and cash, burn, and runway. The capital structure adds a specific risk: bank debt from the
