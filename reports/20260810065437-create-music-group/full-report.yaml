            body: >-
              For a customers chapter, the volume of disputes is striking — the APG poaching lawsuit, the pending
              DigiGlo suit, the dismissed Cinq suit, the settled 6ix9ine matter, sharply negative Label Engine reviews,
              and Billboard's Content ID over-claiming investigation. Individually each is contestable; together they
              raise a real question about customer trust and about the durability of the YouTube Content ID revenue that
              underpins the model.
            calloutType: risk
            claimRefs:
              - CU023
