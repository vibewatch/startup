      - number: '6.4'
        title: Retention, satisfaction, and adverse signal
        blocks:
          - type: paragraph
            body: >-
              This is where the customer thesis is most exposed. On the positive side, acquired-label leadership speaks
              warmly — Monstercat's Daniel Turcotte and Nettwerk's Terry McBride both publicly endorsed the partnerships
              — and Label Engine surfaces satisfied B2B labels. But the independent and adverse record is unusually
              heavy for a customer chapter. Label Engine's Trustpilot profile sits near 1.9 out of 5, with reviewers
              describing unexplained account bans, denied releases citing "vision," email-only support with delayed or
              absent responses, and, most seriously, false YouTube Content ID claims against unaffiliated creators whose
              revenue was withheld through 29-to-30-day dispute windows. Those complaints echo Billboard's 2022
              investigation, in which more than a dozen industry sources alleged CMG systematically claimed royalties it
              did not own; CMG denied this, saying roughly 90% of more than 26,000 conflicts resolved in its favor and
              blaming "bad data." The litigation record compounds the picture: APG's January 2025 suit alleges "brazen
              thievery" and inducing artists to break APG contracts with "bogus" deals; DigiGlo's 2023 suit over 400+
              works remained pending; the Cinq Music suit was dismissed with prejudice in February 2023; and 6ix9ine's
              "Gooba" dispute, with CMG among the parties, settled. Crucially, none of this resolves into a retention
              number — there is no public NRR, GRR, logo churn, or cohort schedule — so durability must be treated as an
              open question rather than a proven strength.
