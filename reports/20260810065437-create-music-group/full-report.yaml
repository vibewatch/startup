  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and core thesis
        blocks:
          - type: paragraph
            body: >-
              Create Music Group (CMG) earns serious investor attention because the public record describes a genuine,
              fast-compounding independent-music platform rather than a promotional shell. It pairs a cash-generative
              YouTube Content ID and rights-management engine with distribution, publishing administration, sync, artist
              services, and a growing catalog/investment arm, and it has translated that model into a March 2026
              valuation of $2.2B alongside a $450M equity-and-debt raise. The qualitative thesis is therefore strong.
              The problem is price discipline. CMG's $2.2B mark sits on roughly $87.6M of disclosed 2024 revenue and an
              unofficial $150M-$200M 2026 revenue/ARR estimate, implying about 11x-25x revenue depending on which line
              you underwrite. That is a decisive premium to every listed music comparable, and it can only be justified
              if growth stays triple-digit, the acquisition machine converts deployed capital into durable royalty
              streams, and the capital arm earns above its cost of debt. Because the consolidated economics, the
              equity/debt split, the preference stack, and the APG copyright litigation are not public, the honest
              recommendation is track / research-more with medium confidence, a high risk rating, and a valuation stance
              best described as stretched but not indefensible.
            claimRefs:
