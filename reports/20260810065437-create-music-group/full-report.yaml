      - number: '7.5'
        title: Risk transmission, mitigations and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The way these risks connect is what turns them from headlines into thesis breaks. A rights-integrity
              failure — an adverse merits ruling, a regulator inquiry, or a YouTube CMS-access sanction — would transmit
              directly into revenue (claimed royalties clawed back), into client trust (artists leaving), and into
              valuation (the multiple that APG itself argued was "built off" contested practices). Create's mitigations
              are real but mostly private: it has won or settled every closed case without a merits loss, says more than
              90% of conflicts resolve in its favor, points to over 26,000 settled conflicts, and has professionalized
              with a new Chief Data & Technology Officer and audited-style rights infrastructure. But the investor
              cannot yet independently verify claim-accuracy rates, clawback history, partner-contract terms, debt
              covenants, or key-person succession. The monitorable kill criteria are therefore specific: a merits loss
              or large settlement in a rights case, loss or restriction of YouTube CMS access, a regulatory transparency
              enforcement action, a covenant breach or forced catalog markdown, or the departure of Strauss without a
              credible successor. Each has a public early-warning signal, which is what makes this a trackable rather
              than un-underwritable risk.
            claimRefs:
