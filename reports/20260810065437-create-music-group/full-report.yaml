        - ~2.7x price/sales
        - Listed, fast-growing, platform-plus-content music company
        - K-pop concert/artist concentration and margin volatility differ from CMG's rights model
      - - Believe SA (2024 take-private)
        - ~EUR 1.5B deal value; ~EUR 15/share; ~44% premium; near-EUR 1B revenue
        - ~1.7x revenue; take-private completed
        - Closest digital-first distribution/services analogue; private-market clearing price
        - Lower-margin distribution mix; European market and 2024 vintage
      - - DistroKid (2021 round)
        - $1.3B valuation; Insight Partners investment
        - Private round; distribution pure-play
        - Direct DIY-distribution competitor benchmark
        - 2021 vintage and no public financials; pricing predates rate/multiple reset
      - - Songtradr (2023 Series E)
        - ~$530M post-money valuation; ~$70M raised
        - Private round; B2B licensing/marketplace
        - Adjacent sync/licensing platform reference
        - Smaller scale and different revenue mix; 2023 vintage
      - - Music catalogs (2026 market)
        - Sony/Recognition ~$3.5B-$4B; catalog multiples ~12x-18x net publisher's share
        - Transaction multiples; scarcity-driven
        - Anchors the value of CMG's catalog/investment arm
        - NPS multiples are not revenue multiples and are rate-sensitive
    enumerationScope:
