            - YouTube ad revenue
            - Royalty accounting
            - Sync and licensing
        - id: scale
          label: Scale with services and capital
          actor: Growing labels and rosters
          description: Larger clients add marketing, advances, capital, and cross-catalog services as trust and volume grow.
          channels:
