  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              CMG should be analyzed as a full-stack independent music company operating across several adjacent rights
              and services pools, not as a proxy for any one "music market." Its revenue surfaces span recorded-music
              distribution, YouTube and user-generated-content (UGC) monetization through Content ID, publishing
              administration, sync licensing, artist and label services, and catalog/IP acquisition backed by a growing
              capital arm. The relevant included spend is therefore the royalty flow and service fees generated when
              independent artists, labels, and catalog owners monetize masters and compositions across digital service
              providers (DSPs), plus the deal flow of catalog acquisitions. Excluded spend is the money that never
              reaches a rights holder in a form CMG can service: live touring and ticketing gross, merchandise
              manufacturing, hardware, and the DSPs' own consumer-subscription revenue, which is the payer pool rather
              than CMG's take. The status-quo substitutes are the ways an artist can solve the same monetization job
              without CMG: self-distribution and DIY uploading through tools like DistroKid or TuneCore, a traditional
              major-label deal that trades ownership for scale, or an incumbent distributor. Framing matters because
              calling all of recorded music CMG's TAM overstates the opportunity: CMG monetizes independent,
              artist-direct, and UGC complexity, and buys catalog, rather than capturing the gross value of every
              stream.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM022
              - CM023
