      - number: '1.3'
        title: Funding history, valuation, and stakeholders
        blocks:
          - type: paragraph
            body: >
              Create's capital history is a clear signal of its trajectory. Strauss initially invested roughly $1
              million of his own money and raised a seed round of about $2.25 million for a minority share in the early
              years, keeping the company founder-controlled. The first major institutional inflection came in June 2024,
              when private-equity firm Flexpoint Ford led a $165 million minority investment that valued Create at $1
              billion and conferred "unicorn" status. The company then pursued an aggressive acquisition strategy and,
              on March 4, 2026, confirmed a new fundraise of more than $450 million in combined equity and debt that
              valued it at $2.2 billion. Ares Management, 2 Mile, and Flexpoint Ford each took minority stakes, founders
              retained majority ownership, and Truist Securities and Banc of California served as joint lead arrangers
              on expanded bank facilities, cumulatively bringing disclosed capital raised to roughly $615 million.
              Create said the new capital would fund continued acquisitions, strategic investments, technology
              development, and global expansion, and that it had deployed more than $500 million across acquisitions,
              advances, and growth initiatives in the prior twelve months alone. Around the same period the company
              launched a capital arm — Create Capital — that is investing over $300 million into Vancouver-based
              Nettwerk Music Group as part of a management buyout, and it is linked to a $500 million-plus music
              investment fund via The Circuit Group. The stakeholder set therefore spans founder-owners, three
              institutional minority investors, senior bank lenders, and the many labels, catalog owners, and
              entrepreneurs whose businesses Create co-owns and operates on its platform.
