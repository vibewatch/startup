    type: journey-map
    layout: wide
    summary: >-
      CMG's customer journey runs from an independent artist or label discovering monetization gaps, through
      distribution and Content ID onboarding, to platform-scale services and, for the largest, capital-backed
      acquisition or anchoring.
    data:
      items:
        - id: discover
