      - number: '3.2'
        title: Capability, integration, and differentiation
        blocks:
          - type: paragraph
            body: >-
              On any single capability, CMG faces a credible specialist, but few rivals combine the full stack.
              Self-serve distributors win on price and simplicity: DistroKid charges $24.99/year for unlimited uploads
              at a 0% royalty cut, TuneCore matches unlimited distribution from $24.99/year (taking roughly 20% on
              social/Content ID and 50% on sync under Believe), and UnitedMasters undercuts services with brand and sync
              deals while advertising 1.9M+ artists and $480M+ paid out. What distinguishes CMG is integration — it
              pairs distribution with a mature YouTube Content ID monetization engine (the business it was founded on,
              recovering unclaimed royalties), publishing administration, sync, and, increasingly, catalog ownership via
              acquisitions of labels such as !K7, Monstercat, and the Nettwerk buyout. That bundle is closer to a
