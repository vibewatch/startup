              Distribution has collapsed toward a sub-$25 annual price with 0% royalty cuts and no lock-in, so CMG
              cannot rely on distribution scale as a moat. Its defensibility depends on the Content ID rights engine and
              owned catalog — both of which face abuse scrutiny, AI-fraud dilution, and richly capitalized catalog
