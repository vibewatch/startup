      - number: '5.3'
        title: Deployment, integration, reliability, support, and roadmap
        blocks:
          - type: paragraph
            body: >-
              CMG delivers its stack as a hosted, multi-tenant B2B platform: labels and distributors log into Label
              Engine rather than installing software, and the company operates the delivery pipes into DSPs and YouTube
              on their behalf. Integration depth is the deployment story — direct delivery relationships to hundreds of
              stores, DDEX-based metadata exchange, YouTube Content ID access as an approved partner, and payout rails
              through Tipalti/PayPal. Practitioner signals on reliability are mixed: review aggregators and Trustpilot
              describe fast royalty processing and strong support for large clients like Insomniac Music Group, but also
              delayed support responses, opaque application gatekeeping, and abrupt catalog removals for smaller labels.
              The public roadmap is unusually legible for 2026: the CDTO hire signals a build-out of scalable,
              intelligent data systems and an explicit push into AI and "agentic" automation for analytics and marketing
              workflows, layered on top of continued catalog and label acquisitions (Monstercat, !K7, Nettwerk) that
              feed more assets into the same pipeline. What is not publicly disclosed — uptime SLAs, security
              certifications, infrastructure topology, and Content ID false-positive rates — is exactly what diligence
              must request, because the platform's reliability and trust posture are asserted rather than externally
              verified.
