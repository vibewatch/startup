      - number: '3.4'
        title: Adverse evidence and durability
        blocks:
          - type: paragraph
            body: >-
              The disconfirming evidence is material. First, the majors are reclaiming ground: MIDiA and Forbes data put
              the independent sector at roughly 38% of the global recorded-music market, but Universal, Sony, and Warner
              are aggressively expanding artist-friendly, low-lock indie arms (AWAL, The Orchard, ADA) and outbidding on
              catalogs, compressing the very white space CMG is buying into. Second, the distribution layer is
              commoditizing toward a sub-$25 annual price floor, which pressures the economics of any player that relies
              on distribution as a wedge. Third, the Content ID moat faces two threats: documented abuse and
              fraudulent-claim scrutiny that raises compliance burden and reputational risk, and a flood of AI-generated
              music and streaming fraud — Deezer said it demonetized about 85% of detected AI-generated tracks — that
              both dilutes payouts and invites tighter DSP filtering. Fourth, catalog-acquisition multiples have been
              bid up by well-capitalized rivals (Concord, Primary Wave, Reservoir, Believe, plus PE-backed vehicles), so
              CMG's capital advantage is not unique. None of this displaces CMG today, but it argues against treating
              any one layer as a durable, standalone moat; the investment case depends on the integrated bundle and on
              execution in catalog M&A, not on distribution scale alone.
            claimRefs:
