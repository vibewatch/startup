      - number: '5.5'
        title: 信任、安全、质量、合规，以及 Content ID 的负面角度
        blocks:
          - type: paragraph
            body: >-
              支撑变现的同一个 Content ID 引擎，也是 CMG 最严重产品风险的来源。2022 年 9 月，Billboard 调查（Variety 亦有呼应）称 YouTube
              权利管理系统“错误百出”且“很容易被滥用”，并援引十多名匿名行业人士，称 CMG 有一种模式：对并不拥有权利的内容主张版税；有记录的例子是 2017 年对 Louis Armstrong《What a
              Wonderful World》约 $468 的错误权利主张，CMG 称这是错误并已纠正。CMG 否认系统性不当行为，将争议归因于“坏数据”，并称约 26,000 起冲突中超过 90%
              以对其有利的方式解决，且它代表约 1.4 million 项资产。争议模式不只存在于新闻报道：Cinq Music 2022 年因版权警告起诉 CMG（2023 年 2 月带偏见驳回，显示已和解）；Artist
              Publishing Group 2025 年 1 月提起联邦版权诉讼，索赔 $30M+，指控其在 YouTube 上虚假主张所有权，并向 Spotify 错误上传。Trustpilot
              和专业评论网站的一线评论记录了针对非关联创作者的虚假 Content ID 权利主张、30 天争议窗口内收入被扣留，以及曲库移除不透明。控制侧，公开证据中没有安全认证、正式质量指标、正常运行时间披露或独立
              Content ID 准确率审计。对一家核心资产是他人权利信任的基础设施公司，这是重大透明度缺口。
