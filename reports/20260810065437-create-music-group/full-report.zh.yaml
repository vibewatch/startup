      - number: '5.3'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              CMG 以托管、多租户 B2B 平台交付技术栈：厂牌和发行商登录 Label Engine，而不是安装软件；公司代他们运营通往 DSP 和 YouTube
              的分发管道。集成深度就是部署故事——直连数百家商店的交付关系、基于 DDEX 的元数据交换、作为获批伙伴接入 YouTube Content ID，以及通过 Tipalti/PayPal
              走付款轨道。可靠性的一线信号混杂：评论聚合器和 Trustpilot 描述版税处理快、对 Insomniac Music Group
              等大客户支持强，但也提到支持响应延迟、申请准入不透明、小厂牌曲库被突然移除。2026 年公开路线图异常清楚：CDTO 任命释放出信号，公司要搭建可扩展、智能化数据系统，并明确进入 AI
              和“智能体式”自动化，用于分析与营销工作流；其上还叠加持续曲库和厂牌收购（Monstercat、!K7、Nettwerk），让更多资产进入同一管线。公开未披露的内容——正常运行时间
              SLA、安全认证、基础设施拓扑和 Content ID 误报率——正是尽调必须索取的，因为平台可靠性与信任姿态目前只是由公司声称，尚未被外部验证。
