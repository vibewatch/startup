        - ~4x EV/sales；~18x EV/EBITDA（约）
        - 全球主流唱片巨头，也是耐久音乐经济性和利润率结构的基准
        - 规模、曲库深度和厂牌权力会高估它与扩张中独立平台的相似度
      - - 'HYBE (KRX: 352820)'
        - ~$2.0B 收入；~$5.5B 市值
        - ~2.7x price/sales 倍数
        - 上市、高增长、平台 + 内容型音乐公司
        - K-pop 演唱会 / 艺人集中度和利润率波动，与 CMG 的权利模型不同
      - - Believe SA（2024 年私有化）
        - ~EUR 1.5B 交易价值；约 EUR 15 / 股；~44% 溢价；收入接近 EUR 1B
        - ~1.7x 收入；私有化已完成
        - 最接近的数字优先发行 / 服务类比；私人市场出清价格
        - 发行收入组合利润率较低；欧洲市场、2024 年样本
      - - DistroKid（2021 年融资轮）
        - $1.3B 估值；Insight Partners 投资
        - 私募融资轮；纯发行平台
        - 直接 DIY 发行竞争对手基准
        - 2021 年样本且无公开财务；定价早于利率 / 倍数重置
      - - Songtradr（2023 年 Series E 轮）
        - ~$530M 投后估值；融资 ~$70M
        - 私募融资轮；B2B 授权 / 市场
        - 邻近同步授权 / 授权平台参照
        - 规模更小，收入组合不同；2023 年样本
      - - 音乐曲库（2026 年市场）
        - Sony / Recognition 约 $3.5B-$4B；曲库倍数约 12x-18x 净出版方份额
        - 交易倍数；稀缺性驱动
        - 锚定 CMG 曲库 / 投资部门的价值
        - NPS 倍数不是收入倍数，而且对利率敏感
    enumerationScope:
      coverage: sample
      basis: >-
        Representative listed, take-private and private-round music comparables plus 2026 catalog-transaction multiples
        accessible from retained filings and analyst market-data sources as of 2026-08-10; not an exhaustive census of
        every music-sector comparable.
    notes: 由于公开资料没有干净的 CMG EV/ARR 桥接，本表使用 EV/sales、EV/EBITDA、P/S、收入倍数和 NPS 倍数作为代理； 这组样本只提供方向，不可机械可比，且混合了 2021-2026 年不同年份。
    claimRefs:
