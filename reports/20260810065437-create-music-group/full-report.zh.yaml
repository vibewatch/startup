        title: 建议与核心论点
        blocks:
          - type: paragraph
            body: >-
              Create Music Group (CMG) 值得投资人认真关注，因为公开记录描述的是一个真实、快速复利的独立音乐平台，而不是宣传壳。它把能产生现金的 YouTube Content ID
              和权利管理引擎，与分发、出版管理、同步授权、艺人服务以及不断增长的曲库 / 投资部门结合起来，并在 2026 年 3 月把这个模式转化为 $2.2B 估值和 $450M
              股债融资。因此，定性论点很强。问题在价格纪律。CMG 的 $2.2B 估值对应公开披露的 2024 年收入约 $87.6M，以及非官方 $150M-$200M 2026 年收入 / ARR
              估计，取决于承销哪条线，约为 11x-25x
              收入。这相对所有上市音乐可比公司都是决定性溢价；只有在增长保持三位数、收购机器把已部署资本转化为可持续版税流，且资本部门赚到高于债务成本的回报时，才说得通。由于合并经济性、股债拆分、优先权结构和 APG
              版权诉讼均未公开，诚实建议是跟踪 / 继续研究，置信度中等、风险评级高，估值态度可概括为偏贵但并非不可辩护。
            claimRefs:
              - CV001
              - CV002
              - CV003
