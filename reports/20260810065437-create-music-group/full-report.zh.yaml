      - number: '4.5'
        title: 尽调阻塞项与财务判断
        blocks:
          - type: paragraph
            body: >-
              财务判断是分裂的。收入质量上，CMG 确实拥有一个多元、资本支持的权利业务：耐久的 Content ID
              起点引擎、大发行覆盖，以及不断增长的曲库和融资部门。但留存的公开记录没有披露任何足以给这种质量打分的指标。缺失项包括审计收入与 ARR、按流分拆的毛利率、Create Capital 和 Create
              Carbon 背后的预支与回收账本、超过 $500M 部署的曲库收购倍数和收益率，以及现金、消耗和续航。资本结构增加了具体风险：Truist 和 Banc of California
              融资额度带来的银行债务叠加在激进 M&A 上；若曲库现金流低于预期，杠杆和再融资敞口会上升，预支产品也让公司暴露于回收不足。另有声誉阴影：关于 CMG 收取无权获得的 YouTube
              版税的指控虽被否认，但单次播放变现正受流媒体欺诈打击和独立供给增加挤压。净读法是，资本可得性和变现广度为正，但利润率路径和资本强度仍不完整；下一层尽调必须从融资公告推进到抽成率、回收和现金转化数据。
