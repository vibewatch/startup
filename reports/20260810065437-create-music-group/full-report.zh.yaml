      - number: '4.4'
        title: 资本结构与前瞻资本充足性
        blocks:
          - type: paragraph
            body: >-
              CMG 对一家独立音乐公司而言资产负债表容量异常强，这是其财务画像中最清晰的事实。2026 年 3 月融资增加超过 $450M 新股权与债务资本，明确用于持续收购、战略投资、技术开发和全球扩张；交易估值
              $2.2B，创始人保留多数控制权，显示投资人愿意资助收购驱动策略。2024 年 Flexpoint Ford 轮此前已按 $1B 估值提供 $165M，这是同一能力的早一层。关键在于，2026
              年轮引入银行债务：Truist Securities 和 Banc of California 担任扩展融资额度的联合牵头安排方，因此杠杆如今与高强度 M&A 支出一同进入资本结构。Create 披露，过去 12
              个月在收购和预支上部署超过 $500M，包括 Create Capital 对 Nettwerk 的 $300M+ 投资，以及与 Monstercat 相关的 $50M
              艺人投资承诺。部署速度是强融资的另一面：它快速消耗资本，并把回报绑定在曲库表现和预支回收上。现金余额、月度消耗、现金续航和债务条款均未披露，因此短期容量看似充足，现金转化风险仍无法量化。
