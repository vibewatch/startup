        - 未公布自助定价；经济条款随艺人和交易而变
        - 定位是服务与 IP 合作伙伴，而非拿来比价的发行商
      - - DistroKid
        - $24.99/年，不限量；0% 版税抽成；附加项另计
        - 不限量上传、分账、Spotify 资料页、快速交付
        - 作品持续上线需要续费；加购项会增加成本
        - 把商品化发行的低价地板打到这里
      - - TuneCore（Believe）
        - $24.99/年，不限量；社交 / Content ID 约 20%；同步授权 50%
        - 发行、Content ID、出版管理、分析
        - 单作品和点数选项并存；必须续费
        - 发行便宜，但 Believe 靠权利和同步授权层变现
      - - UnitedMasters
        - 免费层和 SELECT（约 $19.99/年）；品牌 / 同步授权交易
        - 发行、品牌合作、同步授权市场、每日付款
        - 免费层条款不同于付费层；交易经济性不一
