  - id: TV005
    title: 论点破裂与否决触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 增长放缓
        - 2026 年收入低于估计区间约 $150M 的下限，或增速跌出三位数
        - 削弱约 ~11x-25x 收入中隐含的增长溢价
        - 转向放弃，或要求更低进入估值
      - - 版税 / AI 欺诈冲击
        - 单次播放费率大幅下调，或 DSP 取消变现影响 CMG 管理的播放量
        - 压缩变现引擎和利润率底座
        - 下调估值区间和信心
      - - 不利诉讼结果
        - APG（或可比）版权索赔以 CMG 败诉告终，且包含重大赔偿或禁令条款
        - 推高法律成本，并挑战权利主张模型
        - 重估下行情景；投资前重新评估权利实践
      - - 资本部门表现不及预期
        - 预付款 / 曲库收购有明确证据显示收益低于债务资金成本
        - 投资部门从复合器变成资产负债表拖累
        - 要求结构性折价并审查债务契约
      - - 公开市场倍数压缩
        - 上市音乐可比公司因利率或情绪进一步降估值
        - 拖低私募估值标记和下一轮定价
        - 扩大所需安全边际；推迟进入
    notes: 这些事件最可能在深度尽调后改变判断；阈值可以监控，而不是凭直觉。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV042
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并财务
        - 集团收入、毛利率、EBITDA、烧钱、现金和自由现金流，并与 2026 年 $150M-$200M 估计值对齐
        - 要把定性强项桥接到约 ~11x-25x 收入的价格支撑，这些数据不可缺
        - 管理层和资料室财务尽调
      - - 内生增长 vs. 收购增长
        - 内生增长与过去 12 个月 $500M+ 收购 / 预付款带来的增长拆分
        - 判断该倍数反映的是耐久引擎，还是买来的收入
        - FP&A 和 M&A 尽调
      - - 资本结构
        - $450M 融资中股权与债务的准确构成，以及债务契约 / 到期日
        - 锁定真实进入经济性，以及杠杆带来的下行敏感性
        - 公司财务和贷款方尽调
      - - 股权结构和优先权
        - 当前股权结构、优先权层级、清算顺序和稀释机制
        - 即使公司质量高，不利结构也会毁掉新投资人的回报
        - 法律和公司财务尽调
      - - 诉讼敞口
        - APG 版权诉讼及任何类似索赔的状态、条款和财务敞口
        - 直接影响法律成本、权利模型耐久性和声誉风险
        - 法律尽调和案卷审查
      - - 变现耐久性
        - AI 欺诈筛查、单次播放费率敏感性和 YouTube 权利续约条款
        - 检验支撑估值的现金流底座
        - 产品 / 运营和平台合作尽调
    notes: 这里每个问题都影响决策；没有一个只是形式项，其中数项是上调为买入前的门槛。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
