chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品边界与商业模式
        blocks:
          - type: paragraph
            body: >
              Create Music Group（CMG）把自己定位为数字原生的音乐、媒体与技术平台，而非传统唱片公司；公开记录大体支撑这一说法。公司 2015 年在洛杉矶以 CreateTV
              名义创立，起初为电子和嘻哈艺人在 YouTube Content ID 系统内追回无人认领版税。当时元数据不完整，独立创作者的 UGC 收入常无人收取。借这个切口，CMG
              扩成一套垂直整合栈：如今覆盖音乐发行（通过 Label Engine 业务）、YouTube 和 UGC
              变现、权利管理、音乐出版管理、同步授权、营销、内容制作、数据分析和战略资本部署。公司官网称，这是一体化平台，用技术、数据、营销和资本推动独立厂牌增长，并列出规模信号：服务 17,000+ 客户、覆盖 100+
              国家、拥有 9+ 厂牌品牌、运营 10+ 年。第三方画像称，Label Engine 为超过 75,000 名艺人和 4,000 多个厂牌做发行；到 2026 年初，公司相关报道称平台促成的跨 DSP
              月度播放量超过 2000 亿次。官方和独立来源反复强调的核心差异化是：Create 想让独立艺人和厂牌拿到大厂牌级变现基础设施，同时保留所有权与独立性。这是一套数据驱动的所有者兼运营者模式，Strauss
              将其与大厂牌传统“金耳朵”A&R 方法相区分。
