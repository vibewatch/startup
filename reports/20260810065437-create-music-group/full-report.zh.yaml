              公开牵引信号方向上强，但基于估计和公司规模主张，而非审计披露。第三方聚合商 Growjo 估计 CMG 2024 年收入为 $87.6M，员工约 278 人，人均收入约 $315,000；行业估计把 2026
              年收入或 ARR 放在 $150M–$200M 的宽区间，公司尚未确认。公司侧规模标记包括：服务 17,000+ 客户、覆盖 100+ 国家、拥有 9+ 厂牌品牌，发行触达 75,000+ 艺人和 4,000+
              厂牌，2026 年初跨 DSP 月度播放 200 billion+。这些量级信号支撑 CMG 所变现版税池的大小，但播放量不等于净收入或利润率。估计区间本身意味着相对 2024
              年基数快速增长，但区间太宽，不能在没有底层数字时锚定估值。由于 CMG 大量活动用于预支和收购，报告中的“收入”也低估了平台流经的总流水——承销真正相关的是净抽成率收入，而该数字仍不可得。本章任何读作 null
