  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现流
        blocks:
          - type: paragraph
            body: >-
              Create Music Group 不是靠单一订阅或抽成率赚钱，而是在多层音乐权利上叠加变现流。起点引擎是 YouTube Content ID：CMG 2015 年从收取用户生成上传中的无人认领版税起步，赚取
              Content ID 广告变现带来的收入分成；YouTube 称该池子自推出以来已向权利人支付超过 $12 billion。在此之上，Label Engine——CMG
              的发行和核算部门——为数万名艺人和数千个厂牌提供数字发行、版税处理和推广，并对其管理的资金流收取发行与管理费用。权利组合还包括出版管理、同步授权、自有厂牌品牌（broke.、Monstercat、!K7），以及来自已收购曲库和母带（Cr2
              Records、Deadmau5、Nettwerk IP）的收入。CMG 的资本层是一个差异点：Create Capital 向厂牌和曲库投放以版税为支持的资本，Create Carbon
              卡则让艺人实时提取已赚版税。这把 CMG 的每日版税分析数据转成预支和融资产品，也意味着资本部署与回收位于财务模型中心，而不是边缘。
