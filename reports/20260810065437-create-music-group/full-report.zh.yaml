      - number: '6.5'
        title: 扩张飞轮与集中风险
        blocks:
          - type: paragraph
            body: >-
              CMG 的扩张逻辑是资本与收购飞轮：买下或资助一家厂牌或曲库，把它的名册导入平台，通过分发和 YouTube Content ID 变现，再把现金和自有受众投入下一笔交易。机制证据充足——$50 million
              Monstercat 承诺、Create Capital 对 Nettwerk 的 $300 million 投资、$55 million deadmau5
              母带收购都符合这个模式——艺人服务定位（艺人保留所有权，同时获得大厂牌级变现）则是把独立客户留在平台上的有机补充。但同一结构也制造了公开记录无法量化的集中和依赖风险。少数锚定名册和曲库可能贡献了过大的收入份额，CMG
              却不披露按实体划分的收入或头部曲库贡献。业务还高度依赖少数付款方，尤其是 YouTube Content ID，而这正是最暴露在过度认领指控和诉讼下的渠道；不利判决或 YouTube
              政策变化会打击核心变现引擎。在 DIY 层，切换成本低，DistroKid、UnitedMasters
              一键可去，有机留存尚未证明。因此，扩张可信且有资本托底，但其耐久性取决于集中度、渠道和诉讼变量，而这些仍未披露。
