      - number: '8.5'
        title: 退出就绪度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出就绪确实是 CMG 故事的一部分，因为存在三条可信路径，但今天没有一条能靠公开证据承销。鉴于规模信号、资本部门以及 UMG、HYBE 作为上市音乐平台的先例，IPO 具有可能性，但 CMG 没有披露任何接近
              IPO 级别的财务。出售给大型战略方——Universal、Sony、Warner 或 HYBE——也可想象，持续整合和 Sony/Recognition、Believe
              先例提供支撑，但反垄断和价格预期会增加复杂度。鉴于 Ares、Flexpoint Ford 和 2 Mile
              已在资本结构中，财务赞助方之间交易或延续基金交易是最机械的路径。要把任一路径从叙事变成可投，需要清晰尽调清单：能够对齐收入、利润率、烧钱，以及有机增长和收购增长拆分的合并财务；$450M
              的股权与债务精确构成及附带契约；当前股权结构表、优先权结构和稀释机制；APG 版权诉讼的状态和敞口。这些问题影响投资决策，不是装饰性问题——它们决定 $2.2B
              估值是有吸引力的入场价、公允价，还是一旦增长或版税令人失望就会破裂的拉伸价。在答案出现前，纪律性结论是保持接触、继续跟踪，并在升级为买入前要求私下确认。
