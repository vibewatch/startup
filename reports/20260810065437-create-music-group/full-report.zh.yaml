      - number: '6.4'
        title: 留存、满意度与负面信号
        blocks:
          - type: paragraph
            body: >-
              客户论点在这里最暴露。积极面是，被收购厂牌管理层公开表达支持——Monstercat 的 Daniel Turcotte 和 Nettwerk 的 Terry McBride 都认可合作——Label
              Engine 也展示了满意的 B2B 厂牌。但独立记录和负面记录对一个客户章节来说异常沉重。Label Engine 的 Trustpilot 评分约为
              1.9/5，评论提到原因不明的账号封禁、以“愿景”为由拒绝发行、仅靠邮件且回复延迟或缺席的支持；最严重的是，对无关联创作者发起错误 YouTube Content ID 认领，并在 29 到 30
              天争议窗口内扣留收入。这些投诉呼应了 Billboard 2022 年调查：十多名行业消息人士称 CMG 系统性认领并不属于自己的版税；CMG 否认，并称超过 26,000 起冲突中约 90%
              以其胜诉告终，将问题归因于“坏数据”。诉讼记录进一步加重了图景：APG 2025 年 1 月诉讼称存在“公然盗窃”，并诱导艺人用“虚假”交易违反 APG 合同；DigiGlo 2023 年围绕 400+
              件作品的诉讼仍在进行；Cinq Music 诉讼在 2023 年 2 月以不得再诉方式驳回；6ix9ine 的《Gooba》纠纷中 CMG 是当事方之一，后已和解。关键是，这些都没有汇成留存数字——没有公开
              NRR、GRR、客户标识流失或同期群表——所以耐久性必须视为开放问题，而不是已证明的强项。
