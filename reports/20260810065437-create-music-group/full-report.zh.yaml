  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、模块与艺人 / 厂牌工作流
        blocks:
          - type: paragraph
            body: >-
              Create Music Group
              卖的不是单一功能，而是一套端到端权利与收入基础设施，让独立艺人和厂牌保留所有权，同时接入大厂牌级变现。公司官网用四个支柱框定产品：Technology（发行、权利管理、核算和实时洞察）、Investment（增长资本和预支）、Creative（内部
              A&R、发行网络，以及通过 Flighthouse、VRTCL 等品牌做社交优先策略）和 Expertise。技术支柱的运营核心是 Label Engine，这个 CMG 2016
              年收购的厂牌服务平台，为数千个厂牌和发行商处理多 DSP 发行、点选式版税核算、推广工具和 demo 管理。这个核心周围，是 YouTube Content ID 权利管理和 UGC
              变现、出版管理、同步授权、数据分析层和 Create Capital 预支部门。因此，模块图从发行和权利登记开始，延伸到收款和核算，再进入营销、分析和融资——这种宽度让厂牌能把发行、YouTube
              变现、版税报表和资本集中在一个运营方关系内，而不用拼接多个供应商。本节表格和图示列出这张模块 / 资产地图，以及它自动化的日常工作流。
