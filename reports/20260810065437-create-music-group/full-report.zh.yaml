      - number: '2.2'
        title: 多口径测算与互相矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              CMG 横跨多个池子，市场规模不能只看一个总括数字，必须分镜头。录制音乐口径下，IFPI《Global Music Report》给出的 2025 年收入约 USD 31.7 billion，同比增长
              6.4%，流媒体约占总量 69.6%，付费订阅账户 837 million；MIDiA 报告的 USD 39.5 billion 更高，因为它纳入了 IFPI
              排除的部分，这立即提醒投资人：即便“录制音乐”数字也取决于定义。Goldman Sachs《Music in the Air》把整个音乐经济（录制、出版和现场）框定为从 2024 年约 USD 104.9
              billion 增至 2035 年近 USD 200 billion。出版口径确实矛盾：Mordor Intelligence 对 2026 年建模约 USD 12.37 billion，而 Global
              Growth Insights 只有约 USD 7.33 billion，差距大到不能把任何单一数字当作真值。整体音乐授权（同步、表演、机械）2026 年接近 USD 9.73 billion，音乐发行服务约
              USD 1.25 billion。UGC 口径对有 Content ID 基因的 CMG 很关键：截至 2025 年 6 月的一年里，YouTube 向音乐行业支付约 USD 8 billion，其中约 USD
              2.4 billion 来自 UGC 和 Content ID；Content ID 累计支付已超过 USD 12 billion。曲库收购是数十亿美元级资本市场，2019 年以来已部署超过 USD 20
              billion，倍数回落到约 12-18x。没有任何单一外部数字达到决策级标准，诚实读法是一组分层区间，而不是一个点状 TAM。
