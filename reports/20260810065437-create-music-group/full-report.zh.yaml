        title: 差异化：自有权利技术、数据与规模
        blocks:
          - type: paragraph
            body: >-
              CMG 的差异化不是单一杀手级功能，而是自有 YouTube 权利 / 变现工具、数据分析层和纯粹发行规模的组合。权利侧，CMG 早期业务就是变现无人认领的 YouTube 版税，如今运营着较大的独立
              Content ID 权利主张业务之一；它与 AdRev/FUGA、Vydia 处在同一竞争通道，后两者也营销内部 UGC 权利主张管理和音频检测技术。规模侧，CMG 发行网络触达 75,000+ 艺人和
              4,000+ 厂牌，跨 DSP 月度播放 200B+，足以压过自助工具，并用专有收入数据喂给分析和资本产品。Label Engine 自身报告已交付 26M+ 曲目、处理 1B+ 版税，让 CMG
              拥有多数单艺人发行商（DistroKid、TuneCore）不具备的厂牌级核算与付款引擎。竞争读法是，CMG 不是靠单次发行价格竞争，而是靠整合权利追回、捆绑资本和厂牌级后台。只要底层 Content ID
              和元数据技术准确，这个位置可防守；若不准确，就会暴露。关于专有匹配准确率和分析优越性的未验证说法，在这里按证据缺口处理，而不是当作事实。
