      - number: '8.2'
        title: 估值背景、可比公司与入场纪律
        blocks:
          - type: paragraph
            body: >-
              融资背景亮眼，但不能自证合理。CMG 从 2024 年 6 月约 $1B 估值，走到 2026 年 3 月 $2.2B，低于两年完成约 2.2x 重估，同时以股权和债务组合融资
              $450M；创始人保留多数控制权，Ares、Flexpoint Ford 和 2 Mile 拿少数股权。这些都是真实的财务赞助方兴趣信号，但可比公司提示谨慎。Reservoir Media 是纯出版 /
              录制音乐整合商，基于 $175.7M fiscal-2026 收入，交易约 ~6x EV/sales、~15x EV/OIBDA；Universal Music Group 在稳定约 ~22.5%
              adjusted-EBITDA 利润率上约 ~4x EV/sales；HYBE 约 ~2.7x price/sales；Believe 2024 年私有化价格约 €1.5B，约为接近 €1B 收入的
              1.7x。私募市场参照同样冷静：DistroKid 2021 年估值 $1.3B，Songtradr 2023 年约 $530M。放在这个背景下，CMG 的 ~11x-25x
              收入倍数是增长和期权溢价，不是曲库算术结果。曲库资产本身在 2026 年反弹中以 12x-18x 净出版商份额成交，Sony/Recognition 交易也以 $3.5B-$4B 价格完成，稀缺性价值真实存在；但
              CMG 是技术服务和曲库混合运营商，可比框架只能给方向，不能给精确答案。因此入场纪律取决于私下披露：没有股债拆分、优先权结构和合并利润率，新投资人无法判断 $2.2B 是可投价格，还是只是表面上站得住。
