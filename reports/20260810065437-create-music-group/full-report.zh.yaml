      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              购买中心随客户规模和权利位置变化。独立单人艺人常常同时是买方、用户和付款方；独立厂牌、曲库所有者和创作者则会引入专门预算负责人，分别负责发行、权利管理和融资。关键在于，DSP（Spotify、Apple
              Music、Amazon、YouTube、Deezer）是版税的最终付款方，却不是客户；CMG
              的客户是需要大厂牌级变现基础设施、同时想保留所有权的权利人。需求受到结构性转向独立和艺人直连板块的拉动：独立和艺人直连发行在 2026 年 Q1 拿下约 38% 的流媒体消费，MIDiA
              风格的所有权估计把独立份额放在录制收入的 40% 以上，广义独立艺人市场 2026 年约为 USD 170.9 billion，收入在流媒体、现场、周边和同步之间分散。流媒体量还在上升，Luminate 统计
              2026 年上半年点播音频播放 2.8 trillion 次，深曲库收听主导消费。采用路径是一架越爬越宽的梯子：艺人或厂牌先接入发行，再叠加权利管理和 Content
              ID，然后接入出版管理和同步；梯子顶端，曲库所有者把权利出售给 CMG 的资本部门，或在那里再融资。正因这种阶梯式扩展，推动 CMG 可服务需求的不是原始播放次数，而是专业化和多权利复杂度。
