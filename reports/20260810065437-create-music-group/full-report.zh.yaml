        title: 护城河、切换成本与发行权力
        blocks:
          - type: paragraph
            body: >-
              CMG 最可防守的资产是权利管理基础设施。YouTube Content ID 累计向权利人支付超过 $12 billion，超过 90% 的权利人选择变现而非屏蔽；因此，一个能在 DSP 和 UGC
              平台上稳定大规模主张并清理未匹配收入的伙伴，会获得持续、难复制的位置。曲库所有权增加第二道资本密集型护城河：发行商只是租货架空间，CMG
              则拥有无论艺人日后选择哪家发行商都持续存在的母带和出版收入流。但底层锁定很弱。发行接近商品化——固定费、非独家、容易离开——艺人经常多平台并行，切换成本低。伙伴和 DSP
              关系也是共享的：AdRev、Audiam、Vydia 和每家大型发行商都可接入 Content ID，因此这是标配而非独家渠道。发行权力最终在 DSP 和 YouTube
              手中，不在任何单一聚合商手中，这限制了中间层平台可提取的定价杠杆。CMG 的长期问题是，整合加曲库所有权能否转化为留存和定价权，且强到单层对手无法匹配。
