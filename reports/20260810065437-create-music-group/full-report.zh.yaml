      - number: '2.4'
        title: 增长驱动、约束与采用风险
        blocks:
          - type: paragraph
            body: >-
              2026 年背景有利，但只利好一部分玩家。四个驱动因素与 CMG 模型同向：新兴市场流媒体渗透率仍低，Goldman 将其列为 837 million 付费账户背后的主要增长引擎；短视频和 UGC 变现继续扩大
              Content ID 式池子，CMG 正是为收割这个池子而生；曲库金融化持续把机构资本吸入权利资产，2019 年以来部署超过 USD 20 billion；AI
              工具和数据正在降低艺人直连运营成本。同步是次级顺风，2026 年初估计同比增长 12%。但同一市场也有真实约束。单次播放费率压缩和 ARPU 压力意味着，量的增长不会一比一转成权利人收入；DSP
              集中让少数付款方对版税率和播放列表拥有结构性议价权；2026 年最尖锐的风险是 AI 生成音乐过剩，Deezer 报告称其每日上传中超过 50% 完全由 AI 生成，这些曲目的播放约 85%
              为欺诈，而全音乐范围欺诈率约 8%。围绕 AI 训练权利和“artist-centric”版税模型的监管与版权不确定性又加一层阴影。净影响是不对称的：独立转向、UGC 变现和曲库需求强化 CMG
              论点，但版税压缩、付款方集中和合成内容欺诈可能侵蚀 CMG 正在变现的单次播放池。因此，增长质量取决于可防守的权利和干净、由人验证的曲库。
