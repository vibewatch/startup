  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - CMG 是真正能快速复合的独立音乐平台：现金产出的 YouTube 权利引擎，叠加发行、词曲版权、 同步授权、服务，以及曲库 / 投资部门。
        - 如果证据显示权利引擎利润率低于假设，或收购增长压过内生增长，公司质量论点就会削弱。
      - - $2.2B 估值标记约等于收入 ~11x-25x，显著高于上市可比公司（Reservoir EV/sales 约 ~6x、 UMG 约 ~4x、HYBE P/S 约 ~2.7x），价格已押注持续三位数增长。
        - 如果公司披露合并利润率，并跑出可持续自由现金流路径，溢价会更站得住。
      - - 资本 / 投资部门过去 12 个月投出 $500M+，如果交易回报跑赢资金成本，版税流可以继续复合。
        - 如果预付款和曲库收购收益低于债务成本，资本部门就会从资产变成拖累。
      - - 结构性版税压力——AI 生成的流媒体欺诈、单次播放费率压缩——威胁 CMG 现金流所依托的变现底座。
        - 如果 CMG 的权利主张和欺诈筛查足够抗压，这一担忧会下降。
      - - APG 版权诉讼仍未落地，加上此前 YouTube 版税申领遭审视，带来法律成本和声誉风险； 溢价倍数未必计入这些风险。
        - 如果 APG 事项以低成本、干净方式解决，并厘清权利实践，投资论点会明显降险。
    notes: 反论点讨论的是价格是否足够便宜、披露证据是否足够，不是说 CMG 是低质量公司。
