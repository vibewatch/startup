      - number: '7.3'
        title: 运营、整合与数据质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Create 最大敞口是支撑每一次版税认领的元数据和权利数据质量；异常快的收购节奏会放大这个风险。Create 联合创始人 Jonathan Strauss
              自己说过，错误认领常被归因于“坏数据”，且某个时点 Billboard Hot 100 前 20 首歌中有一半“存在冲突”；Create 2017 年对 Louis Armstrong《What a
              Wonderful World》的临时认领——公司称那是错误——就是整合和数据错误如何变成声誉与法律事件的原型。过去一年，Create 在收购和预付款上部署超过 $500M，并吸收了 !K7（2025 年 4
              月）、Monstercat（2025 年 5 月）、Cr2 Records、Enhanced，以及 $300M+ Nettwerk 买断（2026 年 2 月）。每笔交易都会导入曲库、合同、分账数据和系统，必须与
              YouTube CMS 和 DSP 登记系统对齐，同时不能引入虚假或冲突认领。失效模式很具体：错误或重复认领、分账延迟、所有权映射错误，以及监管超过 1.4 million 个资产的运营负荷。全行业 AI
              生成音乐和流媒体欺诈打击也提高了门槛——Deezer 报告每日上传约三分之一为 AI，DOJ 也推进 AI 流媒体欺诈起诉——Create 必须证明自己的权利数据卫生达标。
