  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Create Music Group 不在单一竞争赛道里；它横跨四类买方可解决任务，不同对手分别攻击这些任务。第一类是纯自助发行，DistroKid、TuneCore、Amuse、CD Baby 和
              UnitedMasters 用低价固定年费把独立艺人送上 Spotify、Apple Music、TikTok 和 150+ 平台，同时返还大部分或全部版税。第二类是 YouTube Content ID
              和更广义 UGC 权利管理——CMG 的创始切口——如今由 AdRev/FUGA、Audiam、Identifyy、Vydia 以及每家大型发行商内部团队竞争。第三类是全套厂牌服务和曲库 / IP
              收购，大厂牌旗下业务（Sony 的 AWAL 和 The Orchard，Universal 的 Virgin Music Group/Ingrooves，Warner 的
              ADA）以及独立所有者兼运营者和曲库买家（Concord、HYBE、Primary Wave、Reservoir Media、Recognition Music
              Group、Believe）争夺同样的母带和预付款。第四类是现状替代：直接签大厂牌合约，或自组 DIY 技术栈。CMG
              横跨四类，因此真实竞争集远比通常拿来对标的少数独立发行商宽得多；每一层都有不同的利润率、护城河和威胁画像。
