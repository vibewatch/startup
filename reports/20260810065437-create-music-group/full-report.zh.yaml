            - 同步授权与许可
        - id: scale
          label: 借服务和资本放大
          actor: 成长中的厂牌和艺人阵容
          description: 大客户随着信任和体量提升，叠加营销、预付款、资本和跨曲库服务。
          channels:
            - 营销服务
            - Create Capital 预付款
            - 数据与分析
            - 游戏 / 创作者同步授权
        - id: anchor
          label: 收购 / 锚定
          actor: CMG 企业发展
          description: 最大机会转化为收购或锚定发行交易，把完整的受控艺人阵容带到平台上。
          channels:
            - 厂牌收购
            - 管理层收购
            - 曲库购买
            - 股权 / 债务资本
    claimRefs:
      - CU001
      - CU005
      - CU040
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据在可触达创作者、集中化客户和具名生产艺人阵容上较强，最弱的是最后一层经审计留存披露。
    data:
      items:
        - label: 可触达的独立创作者和厂牌
          value: 100
          description: CMG 面向 100+ 个国家的独立艺人、厂牌和曲库所有者这一全球大池。
        - label: 集中到平台上的客户
          value: 68
          description: 公司称，17,000+ 客户已集中到一个技术、数据和资本平台上。
        - label: 活跃发行的艺人和厂牌
          value: 44
          description: 发行覆盖 75,000+ 艺人和 4,000+ 厂牌，但活跃与休眠的拆分未披露。
        - label: 具名生产艺人阵容和客户
          value: 24
          description: Monstercat、!K7、Nettwerk、Insomniac、Disciple 和历史客户都是具体生产部署。
        - label: 经审计的留存披露
          value: 6
          description: 公开资料基本缺少 NRR、GRR、队列留存和集中度数据。
    approximationNotes: 漏斗数值是相对比例，用来说明证据在何处变薄，不是披露的转化率。
    claimRefs:
      - CU007
      - CU008
      - CU014
      - CU022
      - CU033
  - id: FU003
    title: 客户证明质量矩阵
    type: matrix
    layout: wide
    summary: CMG 的客户证明在具名艺人阵容同时具备规模和平台嵌入时最强，但留存可见性普遍偏弱，独立佐证强弱不一。
    data:
      columns:
        - 结果具体度
        - 生产深度
        - 独立佐证
        - 留存可见性
      rows:
        - label: Monstercat
          values:
            - 中 — 提到发行和触达，未给收入
            - 高 — 完整收购并接入平台
            - 中 — 多家行业媒体确认
            - 低 — 无交割后留存数据
        - label: '!K7 / DJ-Kicks'
          values:
            - 中 — 描述子厂牌和网络
            - 高 — 厂牌集团已接入
            - 中 — 行业媒体和公司确认
            - 低 — 无流失或续约数据
        - label: Nettwerk
          values:
            - 中 — 艺人阵容和 $300M 交易细节
            - 高 — 锚定发行客户
            - 高 — 公司、MBW 和 BIV 确认
            - 低 — ROI 和耐久度未验证
        - label: Insomniac / Disciple (Label Engine)
          values:
            - 低-中 — 有推荐语，无指标
            - 高 — 活跃发行和核算
            - 低 — 供应商撰写的推荐语
            - 低 — 无留存统计
        - label: 6ix9ine（历史）
          values:
            - 高 — 榜单结果有记录
            - 高 — 发行和出版
            - 高 — Billboard、Wikipedia、Complex
            - 低 — 关系已到期
    claimRefs:
      - CU015
      - CU016
      - CU017
      - CU018
      - CU021
      - CU022
  - id: FU004
    title: 获客与扩张飞轮
    type: flow
    layout: wide
    summary: CMG 通过收购或资助厂牌和曲库扩张：接入其艺人阵容，靠发行和 Content ID 变现，再把现金和自有受众滚入下一笔交易；艺人服务则带来自然客户。
    data:
      nodes:
        - id: acquire
          label: 收购 / 资助厂牌或曲库
          description: 收购或投资厂牌、曲库或经纪管理集团（Monstercat、!K7、Nettwerk、deadmau5）。
        - id: onboard
          label: 将艺人阵容接入平台
          description: 受控艺人和曲库迁移到 CMG 的发行、Content ID 和核算栈。
        - id: monetize
          label: 发行并变现
          description: DSP 流媒体和 YouTube Content ID 把艺人阵容转化为经常性版税收入。
        - id: recycle
          label: 循环使用资本和受众
          description: 现金流加上 200B+ 月流媒体播放的自有受众，为下一笔收购供资。
        - id: services
          label: 艺人服务吸引力
          description: 保留所有权、达到大型唱片公司级别的变现能力，在交易之间吸引自然独立客户。
        - id: concentration
          label: 集中度与渠道风险
          description: 增长依赖少数锚定艺人阵容，并高度依赖 YouTube Content ID。
      edges:
        - from: acquire
          to: onboard
        - from: onboard
          to: monetize
        - from: monetize
          to: recycle
        - from: recycle
          to: acquire
        - from: services
          to: onboard
        - from: monetize
          to: concentration
        - from: recycle
          to: concentration
    claimRefs:
      - CU035
      - CU037
      - CU038
      - CU039
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Create 按严重度排序的风险集中在高残余风险带：控制措施存在，但认领准确性、契约和整合结果无法由公开资料验证。
    data:
      columns:
        - 可能性低
        - 可能性中等
        - 可能性高
      rows:
        - label: 权利完整性诉讼 / 虚假申索指控
          values:
            - label: —
              tone: neutral
            - label: 反复出现，但未在实体层面败诉
              tone: negative
            - label: 一旦败诉，核心模式暴露风险
              tone: negative
        - label: YouTube CMS / Content ID 依赖
          values:
            - label: —
              tone: neutral
            - label: 政策 / 准入变化风险
              tone: negative
            - label: 原有业务压在单一平台上
              tone: negative
        - label: 并购整合与数据质量
          values:
            - label: —
              tone: neutral
            - label: 每年投入超过 $500M；曲库众多
              tone: warning
            - label: 脏数据错误变成申索争议
              tone: negative
        - label: 杠杆与曲库估值
          values:
            - label: —
              tone: neutral
            - label: 结构中新加债务；倍数已压缩
              tone: warning
            - label: —
              tone: neutral
        - label: 关键人物（Strauss）依赖
          values:
            - label: —
              tone: neutral
            - label: 创始人主导；新设 CDTO
              tone: warning
            - label: —
              tone: neutral
    claimRefs:
      - CR001
      - CR010
      - CR018
      - CR026
      - CR031
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Create 的权利、平台和融资风险，会先传导到客户信任和收入，再以估值压缩体现出来。
    data:
      nodes:
        - id: rights
          label: 权利完整性失守
          detail: 不利判决、大额和解或 CMS 制裁
        - id: platform
          label: YouTube / DSP 政策风险
          detail: 准入受限或单次播放收入压缩
        - id: integration
          label: 并购整合 / 脏数据
          detail: 错误申索、分账延迟、权属映射错误
        - id: leverage
          label: 杠杆与曲库估值
          detail: 债务偿付压力与利率敏感估值相撞
        - id: trust
          label: 客户 / 艺人信任流失
          detail: 艺人质疑申索或出走
        - id: revenue
          label: 收入 / 版税受损
          detail: 追回款、可计费播放量下降、客户流失
        - id: valuation
          label: 估值压缩
          detail: 倍数建在有争议的做法和合同上
      edges:
        - from: rights
          to: trust
          label: 声誉和法律后果
        - from: platform
          to: revenue
          label: 可变现 / 可支付播放量减少
        - from: integration
          to: rights
          label: 数据错误变成申索争议
        - from: trust
          to: revenue
          label: 客户流失，新客户流入减少
        - from: revenue
          to: leverage
          label: 现金流挤压债务偿付
        - from: leverage
          to: valuation
          label: 契约压力 / 被迫减记
        - from: revenue
          to: valuation
          label: 盈利质量和持续性下降
    claimRefs:
      - CR002
      - CR013
      - CR020
      - CR027
      - CR034
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Create 的版税收取和融资引擎，靠平台、DSP、贷款方和收购来的团队、艺人运转，但这些环节它都无法完全控制。
    data:
      nodes:
        - id: create
          label: Create Music Group
          detail: 版税收取、发行、出版版权管理、曲库资本
        - id: youtube
          label: YouTube CMS / Content ID
          detail: 特权申索和变现权限
        - id: dsps
          label: DSP 平台
          detail: Spotify、Apple Music、Amazon、Deezer 发行
        - id: lenders
          label: Truist / Banc of California 银行
          detail: 银行授信和杠杆
        - id: investors
          label: Ares / Flexpoint Ford / 2 Mile
          detail: 少数股权资本
        - id: labels
          label: 收购来的厂牌与艺人阵容
          detail: K7、Monstercat、Nettwerk、Cr2、Enhanced 等厂牌
        - id: clients
          label: 艺人与厂牌（17,000+ 客户）
          detail: 依赖准确收款的权利人
      edges:
        - from: youtube
          to: create
          label: 申索权限和版税流
        - from: dsps
          to: create
          label: 流媒体发行和支付
        - from: lenders
          to: create
          label: 用于并购的举债能力
        - from: investors
          to: create
          label: 支撑增长的股权资本
        - from: labels
          to: create
          label: 曲目资产和品牌资产
        - from: create
          to: clients
          label: 变现和付款（信任）
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR026
      - CR028
      - CR036
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: CMG 得到「跟踪 / 继续研究」建议：平台质量和增长都强，但溢价倍数缺少已披露经济性支撑，还压着诉讼阴影。
    data:
      nodes:
        - id: platform
          label: 平台质量 + 规模
          detail: YouTube 权利引擎、发行、出版、同步授权、服务、资本部门；月播放量 200B+
        - id: growth
          label: 增长 + 融资信号
          detail: 2024 年收入 $87.6M、2026 年估算 $150M-$200M，支撑 $2.2B 标记估值；已融资 $450M；财务买家有兴趣
        - id: price
          label: 价格 / 倍数缺口
          detail: 收入倍数约 11x-25x，上市可比公司约 2.7x-6x；经济性和股债拆分未披露
        - id: risk
          label: 残余风险堆叠
          detail: APG 诉讼、AI 欺诈 / 版税压缩、倍数压缩和下轮融资降估值风险
        - id: decision
          label: 建议：跟踪 / 继续研究
          detail: 资产质量高，但没有私下确认关键经济性前，这个倍数下不是干净买点
      edges:
        - from: platform
          to: decision
        - from: growth
          to: decision
        - from: price
          to: decision
        - from: risk
          to: decision
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV025
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    subtitle: 收入规模和倍数假设下的示意估值结果（百万美元）
    approximationNotes: 柱形展示假设性的「收入 × 倍数」组合，以已披露的 2024 年收入和非官方 $150M-$200M 的 2026 年收入 / ARR 估算为锚；这些不是公司披露。
    summary: CMG 的估值高度取决于投资人按哪条收入线做测算、给什么倍数；当前 $2.2B 标记估值，在两项假设上都偏激进。
    data:
      items:
        - label: 87.6M 收入 @ 6x（类似 Reservoir）
          value: 526
        - label: 150M 收入 @ 8x
          value: 1200
        - label: 175M 收入 @ 10x
          value: 1750
        - label: 200M 收入 @ 11x
          value: 2200
        - label: 200M 收入 @ 15x
          value: 3000
        - label: 250M 收入 @ 18x
          value: 4500
    claimRefs:
      - CV005
      - CV006
      - CV011
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    subtitle: 基于情景的估值结果（百万美元）
    approximationNotes: 区间较宽，且基于情景推演，因为合并经济性、股债拆分和优先权结构未公开；概率加权行使用 25/50/25 权重。
    summary: 最能站得住的区间，把基准情景放在当前 $2.2B 标记估值附近；只有持续增长和利润率得到确认，才给更大上行；一旦增长或版税不及预期，下行也真实存在。
    data:
      items:
        - label: 悲观情景（25%）
          low: 1000
          mid: 1300
          high: 1600
        - label: 基准情景（50%）
          low: 2000
          mid: 2200
          high: 2600
        - label: 乐观情景（25%）
          low: 3000
          mid: 3600
          high: 4500
        - label: 概率加权预期值
          low: 2000
          mid: 2325
          high: 2825
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    subtitle: 供 IC 审议的 Create Music Group 评分卡 —— 2026 年 8 月
    approximationNotes: 评分为基于本尽调报告证据的 0-10 分定性评估。
    summary: CMG 在市场、增长和平台上得分强，但经济性未披露、诉讼阴影未消，财务模型清晰度和估值纪律只能算中等。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: 独立音乐份额提升、曲库需求、流媒体增长带来顺风
          score: 8
        - label: 增长和规模证明
          value: 8
          detail: $2.2B 标记估值、$450M 融资、月播放量 200B+、激进收购节奏
          score: 8
        - label: 平台和技术护城河
          value: 7
          detail: YouTube Content ID 权利引擎，加上发行、出版和服务栈
          score: 7
        - label: 财务模型清晰度
          value: 4
          detail: 合并利润率、烧钱情况，以及 $450M 的股债拆分均未披露
          score: 4
        - label: 估值纪律
          value: 4
          detail: 收入倍数约 11x-25x，明显高于约 2.7x-6x 的上市可比公司
          score: 4
        - label: 风险画像
          value: 4
          detail: APG 诉讼、AI 欺诈 / 版税压缩、下轮融资降估值敞口
          score: 4
        - label: 退出准备度
          value: 6
          detail: IPO、战略买家和财务买家路径都可信，但没有一条能仅凭公开数据支撑投资测算
          score: 6
        - label: 证据质量
          value: 5
          detail: 定性证据和融资记录强；已披露量化数据对投资测算支撑弱
          score: 5
    claimRefs:
      - CV002
      - CV003
      - CV031
      - CV044
