      - number: '7.5'
        title: 风险传导、缓释与终止标准
        blocks:
          - type: paragraph
            body: >-
              这些风险的连接方式，才会把它们从标题变成打破投资论点的变量。一次权利完整性失败——实体败诉、监管问询，或 YouTube CMS
              访问制裁——会直接传导到收入（已认领版税被追回）、客户信任（艺人离开）和估值（APG 自己称倍数“建立在”争议做法之上）。Create
              的缓释真实存在，但大多是私有信息：它在所有已结案件中胜诉或和解且没有实体败诉，称超过 90% 的冲突以其胜诉告终，指向超过 26,000 起已解决冲突，并通过新任 Chief Data & Technology
              Officer 和类似审计的权利基础设施完成专业化。但投资人还不能独立验证认领准确率、追回历史、合作伙伴合同条款、债务契约或关键人继任。可监控的终止标准因此很具体：权利案件实体败诉或大额和解、YouTube
              CMS 访问丧失或受限、监管透明度执法行动、违反契约或被迫下调曲库估值，或 Strauss 离职且没有可信继任者。每一项都有公开早期预警信号，所以这是可跟踪风险，不是无法承销的风险。
