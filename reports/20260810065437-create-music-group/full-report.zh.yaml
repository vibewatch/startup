      - number: '7.2'
        title: YouTube / DSP 平台依赖与监管姿态
        blocks:
          - type: paragraph
            body: >-
              Create 的经济性建立在对 YouTube Content Management System 和 Content ID 的特权访问上；这个平台不受它控制，规则也必须遵守。YouTube
              只向拥有“大量原创素材”的所有者授予 Content ID，并明确禁止手动向认领方没有合法权益的资产添加所有权，“即便只是临时”；YouTube
              称每年会因滥用版权工具而终止数万个账号。这种集中有两面：Content ID 已累计向权利人支付超过 $12 billion，因此访问权价值巨大；但一旦暂停、政策变化或 CMS 访问被撤销，就会打中 Create
              原始业务的心脏。Create 运行在密集监管网格内——美国 DMCA §512 通知与删除机制、Music Modernization Act 及负责机械版税的 Mechanical Licensing
              Collective、欧盟 Collective Rights Management Directive
              (2014/26/EU)。后者要求跨成员国收集并分配权利人收入的实体履行透明、问责和公平分配义务。Create 既大规模收集又分发第三方版税，这些透明制度就是活的合规界面，不是背景噪音。
