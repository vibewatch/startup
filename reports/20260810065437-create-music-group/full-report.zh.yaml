      - number: '5.2'
        title: 运营架构：从接入到付款，以及数据层
        blocks:
          - type: paragraph
            body: >-
              CMG 的运营模型是一条装配线，把音频资产从接入送到艺人付款。内容和元数据通过 Label Engine 接入，按数字供应链权利标准登记（DDEX 消息族规定发行和使用数据如何在发行商、DSP
              和著作权协会之间流动），在 YouTube Content ID 系统内生成指纹并匹配，同时分发到全球数百家流媒体商店，包括 Spotify、Apple Music、Beatport、Amazon、TikTok
              和 YouTube。下游，Content ID 权利主张和 DSP 报告进入收款与核算引擎，由该引擎处理报表并向艺人付款，付款则通过 Tipalti、PayPal
              等处理商路由。这条管线之上是一层数据分析，展示每日 YouTube、Spotify 和 Apple 收入，接近实时洞察。CMG 正明确加码这一层：2026 年 2 月 11 日任命 Mitchell
              Shymansky 为首席数据与技术官；他曾在 Universal Music Group 工作近 20 年，搭建云原生、多 PB 数据平台，并推出 Universal Music Artists
              分析应用。架构的力量和脆弱性来自同一个事实：价值产生在权利登记和 Content ID 匹配环节，元数据准确性和权利主张纪律同时决定能捕获多少收入，以及会错误捕获多少收入。
