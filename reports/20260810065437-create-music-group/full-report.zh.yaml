      - number: '6.2'
        title: 采用轨迹与平台规模
        blocks:
          - type: paragraph
            body: >-
              采用路径异常非有机。CMG 不是让单一自助漏斗复利，而是通过收购整批客户名单买来采用，再集中到同一平台上。公司称平台覆盖 17,000+ 个客户，并在数字服务提供商上生成 200B+
              月流媒体播放的自有受众。在这个底座上，过去一年又密集导入名册：2025 年春季的 deadmau5 和 mau5trap 曲库、!K7，2025 年 5 月的 Monstercat，以及 2026 年 2 月的
              Nettwerk 管理层买断。被收购资产自身有采用深度——仅 Monstercat 就发行超过 8,000 条录音，并通过 Rocket League、Fortnite、Roblox 延伸进游戏，也借
              YouTube 和 Twitch 上的 Monstercat Gold 进入创作者同步授权。分发后台 Label Engine 报告已交付 26M+ 首曲目、处理 1B+ 版税，证明厂牌品牌下面有真实 B2B
              吞吐。公开记录没有给出这些数字的分母：客户中有多少活跃、多少休眠，75,000+ 分发艺人中有多少定期交易，200B+
