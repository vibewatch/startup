              CMG 定价由交易驱动且大多不透明；这对权利聚合商很正常，但限制公开承销。不同于 DistroKid 这类固定费发行商，CMG 的经济性更像对客户在发行、Content
              ID、出版和同步中的版税抽百分比。因此，真实收入基础是总流水上的净抽成率，而不是流经平台的总版税。Label Engine 宣传“点选式版税管理”，并报告处理超过 1 billion 版税、交付 26
              million+ 曲目，但从未披露实际费率。Content ID 业务历史上把大多数竞争性权利主张冲突解决在 CMG 有利一方——公司称这是效率，竞争对手则批评其激进。资本侧，Create Capital 超过
              $300M 的 Nettwerk 投资和 Create Carbon
              卡都有回收计划与融资利差，但全部保密。实际含义是，公开挂牌条款无法揭示混合抽成率、毛利率或预付款经济性；变现表面可见，每个表面背后的单位经济模型不可见。因此，投资人必须把这里每个定价数据点都当作方向性代理，而不是已实现收入数字。
