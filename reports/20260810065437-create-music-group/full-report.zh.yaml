      - number: '1.3'
        title: 融资历史、估值与利益相关方
        blocks:
          - type: paragraph
            body: >
              Create 的资本历史清楚显示轨迹。早年 Strauss 先投入约 $1 million 自有资金，又以少数股权融资约 $2.25 million 种子轮，使公司保持创始人控制。第一次重要机构拐点出现在
              2024 年 6 月：私募股权机构 Flexpoint Ford 领投 $165 million 少数股权投资，Create 估值 $1 billion，并获得“独角兽”身份。随后公司推进激进收购战略，并于
              2026 年 3 月 4 日确认新融超过 $450 million 股权与债务资金，对应估值 $2.2 billion。Ares Management、2 Mile 和 Flexpoint Ford
              各自持有少数股权，创始人保留多数所有权，Truist Securities 与 Banc of California 担任扩展银行融资额度的联合牵头安排方，累计披露融资额约 $615 million。Create
              称，新资金将用于持续收购、战略投资、技术开发和全球扩张；仅此前 12 个月，公司已在收购、预支和增长项目上部署超过 $500 million。同期，公司推出资本部门 Create
              Capital，作为管理层收购的一部分，向温哥华的 Nettwerk Music Group 投资超过 $300 million；公司还通过 The Circuit Group 与一个超过 $500
              million 的音乐投资基金相关。因此，利益相关方包括创始人股东、三家机构少数股权投资者、高级银行贷款方，以及众多由 Create 共同持有并在其平台上运营的厂牌、曲库所有者和创业者。
