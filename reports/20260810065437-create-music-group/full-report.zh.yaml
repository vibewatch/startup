  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Create 的模型把 YouTube 变现切入点、发行 / 权利平台、收购引擎和战略资本接在一起， 形成所有者-运营者飞轮。
    data:
      nodes:
        - id: wedge
          label: YouTube Content ID 切入点
          detail: 追回无人认领的 UGC 版税，建立起最早的数据和权利能力。
        - id: platform
          label: 发行与权利平台
          detail: Label Engine 发行、权利管理、词曲版权、同步授权，以及实时版税核算。
        - id: data
          label: 数据与营销
          detail: 分析、Flighthouse / VRTCL 营销，以及数据驱动的 A&R 和变现方法。
        - id: mna
          label: 收购引擎
          detail: 整合厂牌、曲库和服务（Monstercat、!K7、Nettwerk、Cr2、Enhanced）。
        - id: capital
          label: 战略资本
          detail: Create Capital 以预付款、股权和债务为收购及艺人投资提供资金。
        - id: independence
          label: 艺人独立性
          detail: 艺人和厂牌保留所有权，同时获得主流厂牌级基础设施。
      edges:
