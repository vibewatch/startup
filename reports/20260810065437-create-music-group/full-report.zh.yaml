        title: 反向证据与耐久性
        blocks:
          - type: paragraph
            body: >-
              反证材料很实质。第一，大厂牌正在夺回阵地：MIDiA 和 Forbes 数据把独立板块放在全球录制音乐市场约 38%，但 Universal、Sony 和 Warner
              正激进扩张艺人友好、低锁定的独立业务（AWAL、The Orchard、ADA），并在曲库竞标中出更高价，压缩 CMG 正在买入的空白地带。第二，发行层正商品化到低于 $25
              的年费底线，压迫任何以发行为切口的玩家经济性。第三，Content ID 护城河面临两类威胁：有记录的滥用和欺诈性权利主张审查抬高合规负担与声誉风险；AI 生成音乐和流媒体欺诈洪水——Deezer 称其对检测到的
              AI 生成曲目中约 85% 去变现——既稀释分成，也招致更严格的 DSP 过滤。第四，资本充足的对手（Concord、Primary Wave、Reservoir、Believe 以及 PE
              支持的载体）已把曲库收购倍数抬高，CMG 的资本优势并不独特。这些都不会在今天取代 CMG，但它反对把任何单一层当成耐久、独立的护城河；投资论点取决于整合组合，以及曲库 M&A 执行，而不是单靠发行规模。
