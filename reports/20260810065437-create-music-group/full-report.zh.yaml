        title: 能力、整合与差异化
        blocks:
          - type: paragraph
            body: >-
              单看任何一项能力，CMG 都会遇到可信的专业对手，但少有对手能把全栈组合起来。自助发行商靠价格和简单赢：DistroKid 对无限上传收 $24.99/year，版税抽成为 0%；TuneCore 也从
              $24.99/year 起提供无限发行（在 Believe 旗下，对社交 / Content ID 约抽 20%，同步约抽 50%）；UnitedMasters 用品牌和同步交易压低服务门槛，同时宣传 1.9M+
              艺人和 $480M+ 已支付。CMG 的差异在整合——它把发行与成熟的 YouTube Content ID 变现引擎（公司创立时就是为追回无人认领版税）、出版管理、同步，以及越来越多通过收购
              !K7、Monstercat 和 Nettwerk 管理层收购获得的曲库所有权配在一起。这套组合更像 AWAL 或 The Orchard 这样的厂牌所属服务部门，而不是付费即走的发行商；但 CMG
              又营销艺人优先、保留所有权的姿态，这是 Sony 和 Universal 旗下业务在结构上很难完全匹配的。能力矩阵因此显示：CMG
              在权利管理、曲库收购和服务广度上强，在原始发行上只是持平；发行这一层价格竞争最激烈，差异化也最薄。
