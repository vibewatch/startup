  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代
        blocks:
          - type: paragraph
            body: >-
              分析 CMG 时，应把它看成横跨几个相邻权利与服务池的全栈独立音乐公司，而不是任何单一“音乐市场”的代理。它的收入面覆盖录制音乐发行、通过 Content ID 做 YouTube
              和用户生成内容（UGC）变现、出版管理、同步授权、艺人与厂牌服务，以及由不断扩大的资本部门支持的曲库 / IP
              收购。因此，相关纳入支出是独立艺人、厂牌和曲库所有者在各数字服务平台（DSP）上变现母带和词曲作品时产生的版税流与服务费，加上曲库收购的交易流。排除支出则是那些不会以 CMG
              可服务形式进入权利人手中的钱：现场巡演与票务流水、周边商品制造、硬件，以及 DSP 自身的消费者订阅收入；后者是付款池，不是 CMG 的抽成。现状替代方案，是艺人不用 CMG 也能完成同一变现任务的路径：借
              DistroKid 或 TuneCore 等工具自助发行和 DIY 上传；用所有权换规模的传统大厂牌合约；或选择既有发行商。边界定义很重要，因为把整个录制音乐都称作 CMG 的 TAM 会高估机会：CMG
              变现的是独立、艺人直连和 UGC 的复杂度，并购买曲库，而不是攫取每一次播放的总价值。
