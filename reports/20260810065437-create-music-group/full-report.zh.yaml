      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              创始团队有稳定记录可查。Create 由 CEO Jonathan Strauss、COO Alexandre Williams 和 CBO Wayne Hampton 于 2015 年创立。Strauss
              是在加州 Palos Verdes 长大的美国创业者，拥有 UCLA B.S. 数学与统计学学位，也是公司最主要的公开发声者；其父曾从事音乐管理工作，他用数据驱动收取版税的方法，是
              Billboard、Forbes 和 Rolling Stone 报道中的反复主题。Williams 是童年好友和前音乐制作人，曾在发行平台 Label Engine 工作，Create
              后来收购了该平台，这让创始团队直接具备发行基础设施经验。公司扩张后，管理层也加厚：Will Smith 担任 CFO；2026 年 2 月，Create 任命 Universal Music Group
              前数据与分析负责人 Mitchell Shymansky 为首席数据与技术官。M&A 策略也把运营型高管带入集团：Nirvana Digital 联合创始人 Manu Kaushish 加入后担任印度总裁，Cr2
              创始人 Mark Brown 在该收购后继续担任总裁。控制权上，最重要的治理事实是，2026
              年融资后创始人仍保有多数股权，机构投资者只持少数股权；但已审阅公开记录没有披露详细董事会名单、委员会结构或精确持股比例。对一家处在该估值水平的公司，这是治理透明度缺口。
