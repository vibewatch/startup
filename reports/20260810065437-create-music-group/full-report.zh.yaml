  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              CMG 的客户基础要同时看三条轴：谁使用产品、谁购买产品、谁最终付款。使用者和购买者是独立艺人、独立厂牌、厂牌集团和曲库所有者；付款方是数字服务提供商，尤其是 YouTube。YouTube 的 Content
              ID 广告收入是历史核心，Spotify 和 Apple Music 流媒体收入也在其中。买方和付款方分离很关键，因为 CMG 最初的业务是代表权利人向平台收款，而不是向终端用户卖软件。按垂直领域看，重心是电子乐
              / EDM：Monstercat、!K7、deadmau5/mau5trap、Enhanced 和 Disciple 都是舞曲厂牌；嘻哈和说唱则是早期分发和出版客户 6ix9ine、YNW Melly
              播下的传统线。按规模看，客户覆盖完整光谱：从使用 Label Engine 自助工具的长尾 DIY 艺人，到拥有数千个发行项目的成熟独立厂牌，再到 Nettwerk 这类已有 40
              年历史的厂牌集团和曲库所有者。地域上，它是全球足迹，覆盖 100+ 个国家，并借被收购公司延伸到 Berlin、London、New York 和 Vancouver。反复出现的限制是：CMG
              披露总量覆盖，却不披露分层收入或账户普查，分部经济性只能推断，不能验证。
