          to: data
          label: 变现数据
        - from: data
          to: mna
          label: 标的挖掘
        - from: capital
          to: mna
          label: 资助交易
        - from: mna
          to: platform
          label: 曲库上平台
        - from: platform
          to: independence
          label: 价值主张
    approximationNotes: |
      这是一张战略逻辑图，不是系统架构图；它突出变现、平台、M&A 与资本之间的飞轮。
