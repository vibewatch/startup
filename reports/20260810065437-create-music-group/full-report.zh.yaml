      - number: '7.4'
        title: 财务模型、人员与市场风险
        blocks:
          - type: paragraph
            body: >-
              Create 的融资画像已经变形：2026 年 3 月资本包在股权之外加入债务，由 Truist Securities 和 Banc of California
              安排银行融资，因此杠杆进入了此前靠股权和再投资版税现金增长的资本结构。这一点重要，因为 Create 的增长重度依赖预付款和收购——一年部署超过 $500M——而曲库资产估值对利率敏感；行业倍数已经从 2021
              年的 18–25x 净出版商份额压缩到约 12–18x。如果单次播放费率压缩、DSP 组合变化，或预付款表现不及预期，债务服务和曲库估值可能同时收紧。执行风险集中在人上：Create 仍与 CEO
              Jonathan Strauss 深度绑定，他是战略和诉讼辩护的公开面孔；M&A
              机器也依赖留住被收购厂牌管理层和整合人才。市场风险进一步叠加——独立分发已经是商品化、价格竞争激烈的领域（DistroKid、TuneCore/Believe、UnitedMasters、AWAL），单次播放版税压缩和超级粉丝
              / 涨价动态会挤压中间层。这些都没有按投资人需要的颗粒度披露，本身就是风险。
