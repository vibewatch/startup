      - number: '8.3'
        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              合并图景不完整，用情景分析比单点估值更诚实。牛市情景下，CMG 将三位数收入增长维持到 $200M 估计值及以上，YouTube 权利和服务引擎被证明是真正高利润，Nettwerk、Monstercat、!K7
              与曲库投资复利成可持续版税流；在这组假设下，估值显著高于 $2.2B，并最终实现数十亿美元退出是合理的，对应 ~$3.0B-$4.5B 区间。基准情景更保守：CMG 仍是品类赢家，2026 年收入落在
              $150M-$200M 估计范围内，利润率不错但不惊艳，增长常态化后倍数温和压缩，大体验证当前估值，并支撑 ~$2.0B-$2.6B 区间。熊市情景不是公司崩塌，而是重定价：增长减速，AI
              驱动的流媒体欺诈和单次播放版税压缩挤压变现引擎，APG 诉讼或类似版权索赔带来成本，公开市场倍数压缩拖低私募估值，对应 ~$1.0B-$1.6B 区间和真实估值下调融资风险。把这些路径粗略按 25/50/25
              加权，期望值接近当前估值，这正是结论为跟踪而非买入的原因：按概率加权的上行还没有以足够安全边际覆盖溢价。
