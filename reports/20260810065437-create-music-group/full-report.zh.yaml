      - number: '1.4'
        title: 里程碑、规模与可见尽调信号
        blocks:
          - type: paragraph
            body: >
              里程碑记录显示，公司在多条线上复利。2015 年创立后，2016 年收购 Label Engine（同时完成从 CreateTV 到 Create Music Group
              的更名）是关键节点。公司随后搭建发行和出版业务，凭 6ix9ine 与 Nicki Minaj 的《Trollz》早早拿到 Billboard Hot 100 冠军，并在 2019 年 1 月称每月变现约 90
              亿次播放。它在 2019 年 Inc. 5000 美国增长最快公司榜单中排名 #2——被描述为音乐公司有史以来最高名次——Strauss 此后也登上 Billboard Power 100。自 2021
              年底起，公司启动快速全球收购：印度 Nirvana Digital（2021）、病毒营销机构 VRTCL（2022）、英国厂牌与出版商 Enhanced Music 50% 股权（2024 年 12
              月）、Deadmau5 与 mau5trap 曲库（2025 年 3 月）、柏林厂牌集团 !K7 Music（2025 年 4 月）、加拿大电子厂牌 Monstercat（2025 年 5 月，并承诺追加 $50
              million 艺人投资）、英国舞曲厂牌 Cr2 Records（2025 年 12 月）以及 Nettwerk 投资（2026）。M&A
              强度既是公司最鲜明的优势，也是最鲜明的风险。最清晰的负面信号来自声誉和法律：Billboard 2022 年 9 月调查称 YouTube 版税系统“很容易被滥用”，并援引行业人士说法，指 Create
              曾对其不拥有的内容主张版税——包括 Louis Armstrong《What a Wonderful World》上的一次临时错误权利主张，Create 称已纠正——而 Artist Publishing
              Group 2025 年发起的联邦版权诉讼，以及更早 Cinq Music 纠纷，都表明 Create 这种规模的权利主张会反复引发诉讼。因此，承销 $2.2 billion
              估值，必须把真实资本和曲库动能，与未披露审计财务和未结法律敞口一起对账。
