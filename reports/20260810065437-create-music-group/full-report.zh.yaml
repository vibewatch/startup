  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与诉讼敞口
        blocks:
          - type: paragraph
            body: >-
              Create 最值得承销关注的单一风险是法律风险，核心围绕一个反复出现的问题：Create 的权利管理引擎是否在并不实际拥有或控制的作品上认领版税。2025 年 1 月，Artist Publishing
              Group、Artist Partner Group 和 Release Global 在加州中区起诉 Create（No. 2:25-cv-00509），指控“大规模、故意的版权侵权”——Create 提交虚假
              YouTube 所有权认领，把 APG 拥有的录音上传至 Spotify、Apple Music 和 YouTube，并诱导签约 APG 的艺人签署“虚假”合同。起诉书附上 143 条录音和 31
              首作品，要求返还所得，并赔偿 APG 所称建立在被指盗取行为上的估值收益。Create 称该诉讼是“法律作秀”。该案在 2025 年 12 月以提交 Report of Determination
              终结，公开记录没有不利判决，Create 此前也提出了反诉。这不是孤例：Cinq Music 2022 年的侵权干扰诉讼以不得再诉方式驳回告终，结果有利于 Create，并判给 Create
              律师费；DigiGlo 2023 年围绕 400 件 YouTube 作品的诉讼据称仍在进行；Create 还是《Fuk Sumn》（Vultures 1）采样诉讼的被告，直到 2025 年 7
              月初步和解将其移出。这个模式——反复出现、性质严重，但迄今没有实体败诉——就是核心尽调问题。
