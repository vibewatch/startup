      - number: '8.4'
        title: 反论点与下行触发器
        blocks:
          - type: paragraph
            body: >-
              反论点关于价格和证据是否充分，不是公司质量。第一，倍数很贵：CMG 以 ~11x-25x
              收入定价，明显高于增长更慢但披露完整的上市可比公司，任何减速或利润率失望都会直接传导为估值下调。第二，变现基础暴露在结构性版税压力下；Deezer 对 AI 生成上传的去变现、DOJ
              流媒体欺诈行动都说明相当一部分流媒体量是欺诈或低质量，单次播放费率也持续承压，威胁锚定 CMG 现金流的 YouTube 权利和分发经济性。第三，版权诉讼阴影仍在：Artist Publishing Group
              及关联方在加州中区起诉 CMG，指称“大规模故意版权侵权”；此前 Billboard 和 Variety 对 YouTube
              版税认领做法的报道，也带来声誉和法律成本风险，而溢价倍数并未计入这些风险。第四，资本结构包含债务部分，优先权条款也未披露，因此普通股等价经济性的有效入场价格可能高于表面
              $2.2B。每一项都是可监控触发器：增长低于计划、版税费率或 AI 欺诈冲击、不利诉讼结果，或公开市场倍数压缩，都足以让判断从跟踪转向放弃，或要求明显更低的入场价。
