      - number: '6.3'
        title: 具名客户证明与落地深度
        blocks:
          - type: paragraph
            body: >-
              具名客户集很密，而且重要的是生产级客户，不是试点标识——但几乎全部来自收购，或由供应商自己书写。Monstercat 在 CMG 平台上继续由原管理层运营，并获得承诺的 $50 million 艺人投资包，这是
              CMG 资本和基础设施的一次具体生产部署。!K7 也把 Berlin 的厂牌集团、DJ-Kicks 系列和 Strut Records 迁到 CMG 服务上。Nettwerk 的迁移更微妙：其 CEO 把
              $300 million Create Capital 承诺称为一笔“经典分发交易”，Create 不拿股权，意味着 Nettwerk 的名册——Passenger、SYML、Paris
              Paloma、Leisure——变成分发客户，而不是子公司。在被收购品牌之下，Label Engine 发布了 Insomniac Music Group（称 20+ 个厂牌用它）、Disciple 和
              Kannibalen Records 的具名客户证言；CMG 自身历史也包括分发和出版 6ix9ine，其《Trollz》让公司拿到第一个 Billboard Hot 100
              冠军。贯穿其中的限制是证据属性：最强结果由 CMG、被收购厂牌高管或供应商营销材料自报，且没有披露续约条款、并购后名册留存或独立财务结果。证据说明它嵌入真实业务；还没有说明成功可持续并经过独立验证。
