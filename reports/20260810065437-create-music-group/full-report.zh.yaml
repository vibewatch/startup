      - - Amuse
        - 免费层；付费方案 $1.99/月起
        - 移动端发行，付费方案 100% 保留版税
        - 免费层功能受限；服务深度有限
        - 用激进入门价切入移动优先的自助发行艺人
      - - CD Baby（Downtown）
        - 一次性 $9.99 单曲 / $14.99 专辑 + 流媒体收入 9%
        - 发行加出版管理
        - 一次性收费，但持续抽成 9%；工具老旧
        - 适合低频发行者的性价比选项；仍保留收入分成
      - - Symphonic
        - 固定费率发行，需申请；服务另行收费
        - 发行、版税收款、推广、Content ID
