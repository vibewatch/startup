callouts:
- calloutType: insight
  title: CMG competes on integration, not on any single layer
  body: Every layer CMG occupies has a stronger specialist — DistroKid on distribution price, AdRev on Content ID, AWAL on major-backed services, Concord and Primary Wave on catalog. CMG's thesis is that owning distribution, rights management, publishing, sync, and catalog under one artist-first roof compounds into retention and pricing power no single-layer rival can match. That thesis is plausible but unproven from public data.
  claimRefs:
  - CP005
  - CP018
  - CP024
  - CP032
- calloutType: risk
  title: The distribution wedge is commoditized and the moat sits elsewhere
  body: Distribution has collapsed toward a sub-$25 annual price with 0% royalty cuts and no lock-in, so CMG cannot rely on distribution scale as a moat. Its defensibility depends on the Content ID rights engine and owned catalog — both of which face abuse scrutiny, AI-fraud dilution, and richly capitalized catalog bidders.
  claimRefs:
  - CP006
  - CP019
  - CP027
  - CP028
  - CP034
- calloutType: assumption
  title: Artist-first independence is a real but contestable differentiator
  body: CMG's independence lets it credibly promise ownership retention that Sony-owned AWAL and The Orchard cannot fully replicate. But the majors are countering with low-lock, artist-friendly indie arms and are reclaiming indie market share, so this edge must be defended with better terms, service, and Content ID performance rather than assumed.
  claimRefs:
  - CP013
  - CP018
  - CP036
  - CP037
