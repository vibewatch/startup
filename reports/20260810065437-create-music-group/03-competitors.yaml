- id: capability-and-differentiation
  title: Capability, integration, and differentiation
  body: 'On any single capability, CMG faces a credible specialist, but few rivals combine the full stack. Self-serve distributors win on price and simplicity: DistroKid charges $24.99/year for unlimited uploads at a 0% royalty cut, TuneCore matches unlimited distribution from $24.99/year (taking roughly 20% on social/Content ID and 50% on sync under Believe), and UnitedMasters undercuts services with brand and sync deals while advertising 1.9M+ artists and $480M+ paid out. What distinguishes CMG is integration — it pairs distribution with a mature YouTube Content ID monetization engine (the business it was founded on, recovering unclaimed royalties), publishing administration, sync, and, increasingly, catalog ownership via acquisitions of labels such as !K7, Monstercat, and the Nettwerk buyout. That bundle is closer to a major-owned services arm like AWAL or The Orchard than to a pay-and-go distributor, yet CMG markets an artist-first, ownership-retaining posture that Sony- and Universal-owned arms structurally cannot fully match. The capability matrix therefore shows CMG strong on rights management, catalog acquisition, and services breadth, and merely at-parity on raw distribution — the layer where price competition is fiercest and differentiation thinnest.'
