  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commoditized distribution price-floor risk to CMG economics
    missingEvidence: CMG's revenue split by layer (distribution vs Content ID vs publishing/sync vs catalog) and gross margin exposure to the sub-$25 distribution price floor.
    whyItMatters: Public pricing shows the distribution floor is commoditized, but without CMG's internal mix it is impossible to quantify how much of its economics is exposed to that price pressure.
    diligencePath: Request CMG revenue and gross-margin breakdown by service layer and the share of revenue tied to flat-fee distribution versus rights and catalog.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: competitor private funding ARR and churn for underwriting
    missingEvidence: Current ARR, funding, headcount efficiency, and churn for DistroKid, Stem, Symphonic, ONErpm, Vydia, and CMG's catalog-acquisition returns.
    whyItMatters: Public scale signals are uneven, so the competitive set can only be ranked directionally rather than on audited financial strength.
    diligencePath: Refresh capitalization, audited revenue, and retention for each shortlisted competitor via paid market intelligence and management diligence.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: content-id-moat durability and claim legitimacy
    missingEvidence: Independent audit of CMG's Content ID claim legitimacy, dispute rates, and payout durability under tightening anti-fraud enforcement.
    whyItMatters: The Content ID moat is central to the thesis, but abuse scrutiny and AI-fraud filtering could erode payouts in ways public sources cannot quantify.
    diligencePath: Obtain CMG's Content ID claim-dispute metrics, revenue concentration, and compliance controls, and benchmark against platform policy changes.
