  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: CMG's internal revenue split across distribution, YouTube/UGC monetization, publishing administration, sync, artist services, and catalog, plus paying-client counts by segment.
    whyItMatters: Without internal segment data, external market estimates can only bound the opportunity loosely and cannot produce a decision-grade CMG SAM or SOM.
    diligencePath: Request cohort-level revenue by product line, client counts by segment, and catalog underwriting assumptions from management and reconcile against pipeline data.
    relatedQuestionRefs:
    - QM014
    - QM026
  - type: conflicting-data
    severity: material
    topic: music-publishing
    missingEvidence: A high-quality, transparent third-party benchmark that reconciles the roughly USD 7.3 billion to USD 12.4 billion spread in 2026 music publishing estimates.
    whyItMatters: A 40%-plus gap between reputable-sounding publishers makes any single publishing TAM unreliable for valuation work.
    diligencePath: Obtain IFPI/NMPA primary publishing revenue data and paid analyst reports that disclose methodology and segmentation.
    relatedQuestionRefs:
    - QM007
    - QM008
  - type: conflicting-data
    severity: minor
    topic: music-distribution
    missingEvidence: A reconciled estimate of the music distribution services market, which ranges from about USD 1.25 billion to more than USD 3 billion across publishers.
    whyItMatters: The service-fee layer is where CMG's distribution product competes, so its true size affects competitive and margin analysis.
    diligencePath: Triangulate distributor-disclosed take rates and volumes with independent analyst segmentation of the distribution market.
    relatedQuestionRefs:
    - QM010
  - type: missing-source
    severity: minor
    topic: ugc-monetization
    missingEvidence: A primary YouTube or IFPI disclosure isolating the UGC/Content ID share of music payouts rather than blog-tier estimates.
    whyItMatters: UGC monetization is CMG's founding competency, so a precise UGC pool size materially informs its core-market thesis.
    diligencePath: Pull YouTube's official music-payout disclosures and IFPI's platform-revenue breakdowns for the latest period.
    relatedQuestionRefs:
    - QM011
