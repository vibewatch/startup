callouts:
- calloutType: insight
  title: CMG monetizes independent and UGC complexity, not raw stream volume
  body: The most useful market read is that CMG sits on the independent, artist-direct, and UGC layer of a large music economy and buys catalog on top. Recorded music is tens of billions, publishing and licensing are high single-digit billions, and the distribution-service layer is only low single-digit billions, so the value is in servicing complexity and owning rights rather than capturing gross streaming spend.
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM022
- calloutType: risk
  title: AI-generated-music glut and streaming fraud threaten the royalty pool
  body: The sharpest 2026 constraint is synthetic content. Deezer reports that more than half of its daily uploads are fully AI-generated and that about 85% of streams on those tracks are fraudulent, against roughly 8% fraud across all music. Combined with per-stream rate compression and DSP concentration, this could erode the very per-stream pool CMG monetizes if platforms respond by demonetizing or reweighting royalties.
  claimRefs:
  - CM033
  - CM034
  - CM035
  - CM036
- calloutType: assumption
  title: Public sizing is too contradictory to isolate a precise CMG SAM/SOM
  body: Reviewed publishing estimates alone range from about USD 7.3 billion to USD 12.4 billion for 2026, recorded music from USD 31.7 billion to USD 39.5 billion depending on scope, and distribution-service figures diverge by multiples. Investors should treat external market numbers as bounding evidence and request CMG's internal revenue split across distribution, UGC, publishing, sync, and catalog before anchoring valuation.
  claimRefs:
  - CM004
  - CM006
  - CM008
  - CM009
  - CM040
