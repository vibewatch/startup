- id: growth-drivers-and-constraints
  title: Growth drivers, constraints, and adoption risk
  body: >-
    The 2026 backdrop is constructive but selective. Four drivers line up behind CMG's model: streaming penetration is still low
    in emerging markets, which Goldman flags as the primary growth engine behind 837 million paid accounts; short-form video and
    UGC monetization keep expanding the Content-ID-style pool that CMG was built to harvest; catalog financialization continues to
    pull institutional capital into rights, with more than USD 20 billion deployed since 2019; and AI tooling plus data are
    lowering the cost of artist-direct operations. Sync is a secondary tailwind, growing an estimated 12% year on year in early
    2026. But the same market carries real constraints. Per-stream rate compression and ARPU pressure mean volume growth does not
    translate one-for-one into rights-holder revenue; DSP concentration gives a handful of payers structural bargaining power over
    royalty rates and playlisting; and the most acute 2026 risk is an AI-generated-music glut, with Deezer reporting that more
    than 50% of its daily uploads are fully AI-generated and that about 85% of streams on those tracks are fraudulent, versus roughly
    8% fraud across all music. Regulatory and copyright uncertainty around AI training rights and "artist-centric" royalty models
    adds a further overhang. The net implication is asymmetric: the independent shift, UGC monetization, and catalog demand
    strengthen CMG's thesis, but royalty compression, payer concentration, and synthetic-content fraud could erode the very
    per-stream pool CMG monetizes, so growth quality depends on defensible rights and clean, human-verified catalog.
