company:
  name: Create Music Group
chapter:
  number: 2
  title: Market Analysis
  summary: Create Music Group (CMG) sells rights-management, distribution, publishing administration, YouTube/UGC monetization, sync, and catalog/IP capital into the independent and artist-direct layer of the music economy rather than into any single clean market. Global recorded music reached roughly USD 31.7 billion in 2025 (IFPI), with streaming at about 69.6%; publishing is estimated between USD 7.3 billion and USD 12.4 billion for 2026, total music licensing near USD 9.7 billion, YouTube paid the industry about USD 8 billion (with roughly USD 2.4 billion from UGC/Content ID), and more than USD 20 billion of catalog capital has been deployed since 2019. The market is expanding on emerging-market streaming, short-form/UGC monetization, and catalog financialization, but is constrained by per-stream rate compression, DSP concentration, and an AI-generated-music glut that is now more than half of daily uploads on some platforms with most streams flagged as fraudulent. Public sizing is fragmented and internally contradictory, so a precise CMG SAM/SOM cannot be isolated from external data alone.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and status-quo substitutes
  body: >-
    CMG should be analyzed as a full-stack independent music company operating across several adjacent rights and services
    pools, not as a proxy for any one "music market." Its revenue surfaces span recorded-music distribution, YouTube and
    user-generated-content (UGC) monetization through Content ID, publishing administration, sync licensing, artist and label
    services, and catalog/IP acquisition backed by a growing capital arm. The relevant included spend is therefore the royalty
    flow and service fees generated when independent artists, labels, and catalog owners monetize masters and compositions across
    digital service providers (DSPs), plus the deal flow of catalog acquisitions. Excluded spend is the money that never reaches
    a rights holder in a form CMG can service: live touring and ticketing gross, merchandise manufacturing, hardware, and the DSPs'
    own consumer-subscription revenue, which is the payer pool rather than CMG's take. The status-quo substitutes are the ways an
    artist can solve the same monetization job without CMG: self-distribution and DIY uploading through tools like DistroKid or
    TuneCore, a traditional major-label deal that trades ownership for scale, or an incumbent distributor. Framing matters because
    calling all of recorded music CMG's TAM overstates the opportunity: CMG monetizes independent, artist-direct, and UGC
    complexity, and buys catalog, rather than capturing the gross value of every stream.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM022
  - CM023
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: multi-lens-sizing-and-contradictions
  title: Multi-lens sizing and contradictory estimates
  body: >-
    Because CMG straddles several pools, sizing requires multiple lenses rather than one headline number. On the recorded-music
    lens, IFPI's Global Music Report put 2025 revenue at roughly USD 31.7 billion, up 6.4% year on year, with streaming about
    69.6% of the total and 837 million paid subscription accounts; MIDiA reports a larger USD 39.5 billion because it folds in
    segments IFPI excludes, an immediate reminder that even the "recorded" figure is definition-dependent. Goldman Sachs' Music in
    the Air frames the whole music economy (recorded, publishing, and live) rising from about USD 104.9 billion in 2024 toward
    nearly USD 200 billion by 2035. The publishing lens is genuinely contradictory: Mordor Intelligence models about USD 12.37
    billion for 2026 while Global Growth Insights models only about USD 7.33 billion, a gap too wide to treat any single figure as
    ground truth. Total music licensing (sync, performance, mechanical) is near USD 9.73 billion for 2026, and music distribution
    services are modeled at roughly USD 1.25 billion. The UGC lens is material for CMG's Content-ID heritage: YouTube paid the
    music industry about USD 8 billion in the year to June 2025, of which roughly USD 2.4 billion came from UGC and Content ID, and
    Content ID has paid more than USD 12 billion cumulatively. Catalog acquisition is a multi-billion capital market, with more
    than USD 20 billion deployed since 2019 and multiples resetting to roughly 12-18x. No single external number is decision-grade,
    so the honest read is a layered range, not a point TAM.
