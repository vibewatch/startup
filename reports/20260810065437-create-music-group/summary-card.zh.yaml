  topStrengths:
    - Create 把发行、YouTube Content ID 变现、出版管理、同步授权、自有厂牌和曲库收购整合成一个纵向一体化的独立音乐平台。
    - 头部规模很大：公司相关来源称平台服务 17,000+ 客户、75,000+ 艺人、4,000+ 厂牌，并促成每月超过 200 billion 次流播放。
    - >-
      资本获取能力在同类公司里异常强：2024 年 6 月以约 $1B 估值融资 $165M，2026 年 3 月又以 $2.2B 估值从 Ares Management、Flexpoint Ford 和银行安排方拿到超过 $450M
      的股债融资。
    - >-
      收购项目（Label Engine、Nirvana Digital、VRTCL、Enhanced、Deadmau5/mau5trap、!K7、Monstercat、Cr2）叠加 Create
      Capital，带来自有曲库收入和经常性版权收入。
    - 「所有者兼运营者、艺人保留所有权」模式与传统大厂牌不同，也区别于 DistroKid、TuneCore 这类轻资产发行商。
  topRisks:
    - Create 没有公开披露经审计收入、毛利率、ARR 或现金状况，仅凭公开数据无法承销 $2.2B 估值。
    - 多数规模指标（客户、艺人、流播放、员工数）都来自公司披露，缺少独立审计；运营规模存在被高估的真实风险。
    - 以债务支持的快速曲库并购抬高资本强度和杠杆风险；高级银行贷款人如今与预付款、版税融资一起嵌入资本结构。
    - 负面报道和多起权利纠纷带来声誉与法律敞口，其中 Billboard 2022 年 9 月调查称 YouTube 版税系统「ripe for abuse」。
    - 公司曝光和控制高度集中在 CEO Jonathan Strauss 身上，形成关键人风险；详细董事会和治理结构也未公开。
  unresolvedGaps:
    - 经审计的合并收入、按收入流拆分的毛利率、ARR、现金状况，以及它们与公司披露规模指标的对应关系。
    - Truist 和 Banc of California 授信下的债务排期、契约、到期日、已提取 / 未提取余额，以及 2026 年 3 月融资的股债拆分。
    - 2024 和 2026 两轮融资后的股权结构、优先权堆栈、老股 / 新股比例和稀释机制。
    - 客户、艺人、厂牌、月度流播放次数的独立核验，以及干净的审计员工总数。
    - 未决权利和版税纠纷的结果及财务敞口，以及 YouTube Content ID 收入分成条款的耐久性。
