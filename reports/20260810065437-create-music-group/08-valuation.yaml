- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - 'Reservoir Media (NASDAQ: RSVR)'
    - $175.7M FY2026 revenue; $73.6M adjusted EBITDA; ~$660M market cap; ~$1.09B EV
    - ~6x EV/sales; ~15x EV/OIBDA
    - Listed pure-play publisher and recorded-music consolidator; cleanest public rights-catalog read
    - Slower-growth, catalog-weighted model; lacks CMG's tech-services and YouTube-rights mix
  - - 'Universal Music Group (Euronext AMS: UMG)'
    - EUR 12,507M FY2025 revenue; EUR 2,810M adjusted EBITDA; ~22.5% margin
    - ~4x EV/sales; ~18x EV/EBITDA (approx.)
    - Global major and benchmark for durable music economics and margin structure
    - Scale, catalog depth and label power overstate similarity to a scaling independent
  - - 'HYBE (KRX: 352820)'
    - ~$2.0B revenue; ~$5.5B market cap
    - ~2.7x price/sales
    - Listed, fast-growing, platform-plus-content music company
    - K-pop concert/artist concentration and margin volatility differ from CMG's rights model
  - - Believe SA (2024 take-private)
    - ~EUR 1.5B deal value; ~EUR 15/share; ~44% premium; near-EUR 1B revenue
    - ~1.7x revenue; take-private completed
    - Closest digital-first distribution/services analogue; private-market clearing price
    - Lower-margin distribution mix; European market and 2024 vintage
  - - DistroKid (2021 round)
    - $1.3B valuation; Insight Partners investment
    - Private round; distribution pure-play
    - Direct DIY-distribution competitor benchmark
    - 2021 vintage and no public financials; pricing predates rate/multiple reset
  - - Songtradr (2023 Series E)
    - ~$530M post-money valuation; ~$70M raised
    - Private round; B2B licensing/marketplace
    - Adjacent sync/licensing platform reference
    - Smaller scale and different revenue mix; 2023 vintage
  - - Music catalogs (2026 market)
    - Sony/Recognition ~$3.5B-$4B; catalog multiples ~12x-18x net publisher's share
    - Transaction multiples; scarcity-driven
    - Anchors the value of CMG's catalog/investment arm
    - NPS multiples are not revenue multiples and are rate-sensitive
  enumerationScope:
    coverage: sample
    basis: Representative listed, take-private and private-round music comparables plus 2026 catalog-transaction multiples accessible from retained filings and analyst market-data sources as of 2026-08-10; not an exhaustive census of every music-sector comparable.
  notes: Uses EV/sales, EV/EBITDA, P/S, revenue-multiple and NPS-multiple proxies because a clean CMG EV/ARR bridge is not public; the set is directional, not mechanically comparable, and mixes vintages (2021-2026).
