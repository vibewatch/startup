- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - CMG is a genuine, fast-compounding independent-music platform pairing a cash-generative YouTube-rights engine with distribution, publishing, sync, services and a catalog/investment arm.
    - Evidence that the rights engine is lower-margin than assumed, or that acquired growth dominates organic growth, would weaken the quality thesis.
  - - The $2.2B mark is priced at ~11x-25x revenue, a decisive premium to listed comps (Reservoir ~6x EV/sales, UMG ~4x, HYBE ~2.7x P/S), so the price already embeds continued triple-digit growth.
    - Disclosed consolidated margins and a demonstrable path to durable free cash flow would help justify the premium.
  - - The capital/investment arm and $500M+ of trailing deployment can compound royalty streams if deals clear their cost of capital.
    - Proof that advances and catalog buys earn below the debt cost would turn the capital arm from an asset into a drag.
  - - Structural royalty pressure -- AI-generated streaming fraud and per-stream rate compression -- threatens the monetization base that anchors CMG's cash flow.
    - Evidence that CMG's rights-claiming and fraud-screening are resilient would reduce this concern.
  - - A live copyright-litigation overhang (APG) plus prior YouTube royalty-claiming scrutiny creates legal-cost and reputational risk a premium multiple does not price.
    - A clean, low-cost resolution of the APG matter and clarified rights practices would materially de-risk the thesis.
  notes: The anti-thesis is about price sufficiency and disclosed evidence, not about CMG being a low-quality company.
