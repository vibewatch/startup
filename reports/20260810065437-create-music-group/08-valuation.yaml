- id: valuation-context-comparables-and-entry-discipline
  title: Valuation context, comparables and entry discipline
  body: 'The financing context is impressive but not self-justifying. CMG stepped from a ~$1B mark in June 2024 to $2.2B in March 2026, roughly a 2.2x re-rate in under two years, while raising $450M as a mix of equity and debt with founders retaining majority control and Ares, Flexpoint Ford and 2 Mile taking minority stakes. Those are real signals of sponsor appetite, but the comparable set counsels caution. Reservoir Media, a pure-play publisher/recorded-music consolidator, trades near ~6x EV/sales and ~15x EV/OIBDA on $175.7M of fiscal-2026 revenue; Universal Music Group runs near ~4x EV/sales on a stable ~22.5% adjusted-EBITDA margin; HYBE trades near ~2.7x price/sales; and Believe was taken private in 2024 at roughly €1.5B, about 1.7x its near-billion-euro revenue. Private-market references are similarly sobering: DistroKid was valued at $1.3B in 2021 and Songtradr at roughly $530M in 2023. Against that backdrop CMG''s ~11x-25x revenue multiple is a growth-and-optionality premium, not a catalog-arithmetic result. Catalog assets themselves changed hands at 12x-18x net publisher''s share in the 2026 rebound, and the Sony/Recognition deal cleared a $3.5B-$4B price, so scarcity value is real; but CMG is a hybrid technology-services-and-catalog operator, which makes the comparable frame directional rather than precise. Entry discipline therefore hinges on private disclosure: without the equity/debt split, the preference stack, and consolidated margins, a new investor cannot know whether the $2.2B is investable or merely optically supported.'
