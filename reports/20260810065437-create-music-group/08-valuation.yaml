- id: thesis-anti-thesis-and-downside-triggers
  title: Anti-thesis and downside triggers
  body: 'The anti-thesis is about price and evidence sufficiency, not company quality. First, the multiple is rich: at ~11x-25x revenue CMG is priced well above listed comparables that grow slower but disclose fully, so any deceleration or margin disappointment transmits directly into a lower mark. Second, the monetization base is exposed to structural royalty pressure; Deezer''s demonetization of AI-generated uploads and DOJ streaming-fraud actions underline that a meaningful slice of streaming volume is fraudulent or low-quality, and per-stream rates remain under pressure, which threatens the YouTube-rights and distribution economics that anchor CMG''s cash flow. Third, there is a live copyright-litigation overhang: Artist Publishing Group and affiliates sued CMG in the Central District of California alleging "massive willful copyright infringement," and prior Billboard and Variety reporting on YouTube royalty-claiming practices raises reputational and legal-cost risk that a premium multiple does not price. Fourth, the capital structure carries a debt component and undisclosed preference terms, so the effective entry price for common-equivalent economics may exceed the headline $2.2B. Each of these is a monitorable trigger: growth below plan, a royalty-rate or AI-fraud shock, an adverse litigation outcome, or public-market multiple compression would each justify moving from track toward pass or demanding a materially lower entry.'
