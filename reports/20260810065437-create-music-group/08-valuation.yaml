- id: exit-readiness-and-final-diligence
  title: Exit readiness and final diligence asks
  body: 'Exit readiness is a genuine part of the CMG story because three credible paths exist, but none is underwriteable from public evidence today. An IPO is plausible given the scale signals, the capital arm, and the precedent of UMG and HYBE as listed music platforms, yet CMG has disclosed nothing resembling IPO-grade financials. A strategic sale to a major -- Universal, Sony, Warner or HYBE -- is conceivable given persistent consolidation and the Sony/Recognition and Believe precedents, but antitrust and price expectations complicate it. A sponsor-to-sponsor or continuation outcome is the most mechanical path given Ares, Flexpoint Ford and 2 Mile are already in the structure. Converting any of these from narrative to bankable requires a defined diligence agenda: consolidated financials that reconcile revenue, margin, burn and the split between organic and acquired growth; the exact equity-versus-debt composition of the $450M and the covenants attached; the current cap table, preference stack and dilution mechanics; and the status and exposure of the APG copyright litigation. Those asks are decision-critical rather than cosmetic -- they determine whether the $2.2B mark is an attractive entry, a fair one, or a stretched one that breaks on the first growth or royalty disappointment. Until they are answered, the disciplined verdict is to stay engaged, keep tracking, and require private confirmation before upgrading to buy.'
