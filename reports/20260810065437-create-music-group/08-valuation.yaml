slug: create-music-group
runDate: '2026-08-10'
company:
  name: Create Music Group
chapter:
  number: 8
  title: Valuation
  summary: Create Music Group's March 2026 mark of $2.2B on ~$87.6M of 2024 revenue and a $150M-$200M 2026 revenue/ARR estimate implies roughly 11x-25x revenue, a clear premium to listed music comparables (Reservoir ~6x EV/sales, UMG ~4x, HYBE ~2.7x P/S) that only holds if triple-digit growth, a profitable YouTube-rights engine, and the capital arm compound as advertised. Public evidence supports a high-quality, fast-scaling independent-music platform but not a clean buy at this multiple without private disclosure on consolidated economics, the equity/debt split of the $450M, the preference stack, and resolution of the APG copyright litigation. The disciplined stance is track / research-more, medium confidence, high risk rating, valuation stance stretched.
sections:
- id: recommendation-and-core-thesis
  title: Recommendation and core thesis
  body: 'Create Music Group (CMG) earns serious investor attention because the public record describes a genuine, fast-compounding independent-music platform rather than a promotional shell. It pairs a cash-generative YouTube Content ID and rights-management engine with distribution, publishing administration, sync, artist services, and a growing catalog/investment arm, and it has translated that model into a March 2026 valuation of $2.2B alongside a $450M equity-and-debt raise. The qualitative thesis is therefore strong. The problem is price discipline. CMG''s $2.2B mark sits on roughly $87.6M of disclosed 2024 revenue and an unofficial $150M-$200M 2026 revenue/ARR estimate, implying about 11x-25x revenue depending on which line you underwrite. That is a decisive premium to every listed music comparable, and it can only be justified if growth stays triple-digit, the acquisition machine converts deployed capital into durable royalty streams, and the capital arm earns above its cost of debt. Because the consolidated economics, the equity/debt split, the preference stack, and the APG copyright litigation are not public, the honest recommendation is track / research-more with medium confidence, a high risk rating, and a valuation stance best described as stretched but not indefensible.'
