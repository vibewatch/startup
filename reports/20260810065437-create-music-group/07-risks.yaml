  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: apg-resolution
    missingEvidence: The confidential settlement or dismissal terms of APG v. Create, including any releases, admissions, monetary payments, or practice changes.
    whyItMatters: The case terminated without a public merits ruling, so whether Create prevailed, settled, or changed its claim practices is central to sizing the rights-integrity risk.
    diligencePath: Request the settlement agreement, stipulated dismissal, and any consent terms from Create's counsel; pull the final docket entries and any post-2025 filings.
    relatedQuestionRefs:
