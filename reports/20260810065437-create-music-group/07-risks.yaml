- id: operational-integration-and-data-quality-risk
  title: Operational, integration and data-quality risk
  body: >-
    Operationally, Create's biggest exposure is the metadata and rights-data quality that underpins every royalty claim, amplified by an unusually fast acquisition cadence. Create co-founder Jonathan Strauss has himself said that mistaken claims are often attributed to "bad data," and that at one point half of the top 20 Billboard Hot 100 tracks were "in conflict"; Create's temporary 2017 claim on Louis Armstrong's "What a Wonderful World," which it called an error, is the archetype of how integration and data errors become reputational and legal events. Over the trailing year Create deployed more than $500M across acquisitions and advances and absorbed !K7 (April 2025), Monstercat (May 2025), Cr2 Records, Enhanced and a $300M+ Nettwerk buyout (February 2026). Each deal imports catalogs, contracts, split data and systems that must be reconciled against YouTube's CMS and DSP registries without introducing false or conflicting claims. The failure modes are concrete: wrongful or duplicated claims, delayed splits, mis-mapped ownership, and the operational load of policing 1.4 million-plus assets. Industry-wide AI-generated music and streaming-fraud crackdowns — Deezer reporting roughly a third of daily uploads as AI and a DOJ AI-streaming-fraud prosecution — raise the bar for the rights-data hygiene Create must demonstrate.
