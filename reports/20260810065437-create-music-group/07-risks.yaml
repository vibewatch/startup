    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: digiglo-lawsuit
    missingEvidence: The current status, surviving claims, and quantified exposure of the DigiGlo suit reported as ongoing.
    whyItMatters: An active contract/monetization dispute represents unquantified legal exposure that could crystallize into damages or precedent.
    diligencePath: Obtain the DigiGlo docket, complaint, and any dispositive-motion rulings; confirm insurance and reserve coverage.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: claim-accuracy
    missingEvidence: Create's internal claim-accuracy rate, wrongful-claim clawback/refund history, and CMS dispute-resolution metrics.
    whyItMatters: These metrics would convert the recurring over-claiming allegations from inference into a measurable operating risk (or exonerate Create).
    diligencePath: Request an audited claim-accuracy report, refund log, and YouTube CMS dispute statistics under NDA.
