company:
  name: Create Music Group
chapter:
  number: 7
  title: Risks
  summary: Create Music Group's risk profile is dominated by rights-integrity litigation and platform-dependency exposure rather than by a single catastrophic failure. The most serious signal is a repeated, on-record allegation — a 2022 Billboard investigation and the 2025 Artist Publishing Group federal complaint — that Create claimed YouTube royalties on works it did not control; Create denies wrongdoing and its two closed suits (Cinq, and the APG case) both terminated without an adverse judgment. Layered on top are acquisition-integration risk from a rapid M&A run, debt now inside the capital structure, catalog-valuation and per-stream compression, key-person dependence on CEO Jonathan Strauss, and industry-wide AI/streaming-fraud crackdowns that raise Content ID scrutiny.
sections:
- id: legal-and-litigation-exposure
  title: Legal and litigation exposure
  body: >-
    Create's single most underwriting-relevant risk is legal, and it clusters around one recurring theme: whether Create's rights-management engine claims royalties on works it does not actually own or control. In January 2025 Artist Publishing Group, Artist Partner Group and Release Global sued Create in the Central District of California (No. 2:25-cv-00509), alleging "massive, willful copyright infringement" — that Create filed false YouTube ownership claims, uploaded APG-owned recordings to Spotify, Apple Music and YouTube, and induced APG-signed artists to sign "bogus" contracts. The complaint appended 143 recordings and 31 compositions and demanded disgorgement plus compensation for the valuation gains APG says were built on the alleged theft. Create called the suit "legal theatrics." That case terminated in December 2025 with a Report of Determination filed and no public adverse judgment, and Create had filed a counterclaim. It is not an isolated matter: Cinq Music's 2022 tortious-interference suit was dismissed with prejudice in Create's favor with attorney fees awarded to Create; a 2023 DigiGlo suit over 400 YouTube works was reported still ongoing; and Create was a defendant in the "Fuk Sumn" (Vultures 1) sample suit before a July 2025 preliminary settlement removed it. The pattern — recurring, serious, but so far resolved without a merits loss — is the core diligence question.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
