- id: financial-model-people-and-market-risk
  title: Financial-model, people and market risk
  body: >-
    Create's financing profile has changed shape: the March 2026 capital package added debt alongside equity, with Truist Securities and Banc of California arranging bank facilities, so leverage now sits in a capital structure that previously grew on equity and reinvested royalty cash. That matters because Create's growth is advance- and acquisition-intensive — more than $500M deployed in a year — against catalog assets whose valuations are interest-rate-sensitive; industry multiples have already compressed to roughly 12–18x net publisher's share from 18–25x in 2021. If per-stream rates compress, DSP mix shifts, or advances underperform, debt service and catalog marks could tighten simultaneously. Execution risk is concentrated in people: Create remains closely identified with CEO Jonathan Strauss, who is the public face of both its strategy and its litigation defense, and the M&A machine depends on retaining acquired-label leadership and integration talent. Market risk compounds it — indie distribution is now a commoditizing, price-competitive field (DistroKid, TuneCore/Believe, UnitedMasters, AWAL) where per-stream royalty compression and superfan/price-rise dynamics squeeze the middle. None of these are disclosed with the granularity an investor would want, which is itself the risk.
  claimRefs:
