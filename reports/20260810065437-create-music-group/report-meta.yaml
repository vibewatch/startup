companyProfile:
  summary: Create Music Group is a Los Angeles-headquartered music, media, and technology company founded in 2015 (originally CreateTV) by Jonathan Strauss, Alexandre Williams, and Wayne Hampton. It began by recovering unclaimed YouTube royalties and has grown into a vertically integrated platform spanning distribution, YouTube Content ID monetization, publishing administration, sync licensing, owned labels, and an aggressive catalog-acquisition program. Public evidence supports large monetization scale, broad independent-artist reach, and unusual access to growth and debt capital via Ares Management, Flexpoint Ford, and bank arrangers. The business appears commercially strong and strategically relevant, but audited financials remain undisclosed relative to its $2.2B valuation narrative.
