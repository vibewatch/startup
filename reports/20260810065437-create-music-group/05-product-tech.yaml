- id: trust-safety-and-compliance
  title: Trust, safety, quality, compliance — and the Content ID adverse angle
  body: >-
    The same Content ID engine that powers monetization is the source of CMG's most serious product risk. In September 2022, a Billboard investigation (echoed by Variety) reported that YouTube's rights-management system is "full of errors" and "ripe for abuse," citing more than a dozen anonymous industry sources who alleged CMG had a pattern of claiming royalties it did not have rights to; a documented example was a roughly $468 erroneous claim on Louis Armstrong's "What a Wonderful World" in 2017, which CMG called an error and rectified. CMG denies systemic wrongdoing, attributing disputes to "bad data" and stating that over 90% of some 26,000 conflicts were resolved in its favor and that it represented about 1.4 million assets. The dispute pattern is not only journalistic: Cinq Music sued CMG in 2022 over copyright strikes (dismissed with prejudice in February 2023, indicating settlement), and Artist Publishing Group filed a January 2025 federal copyright suit seeking $30M+, alleging false ownership claims on YouTube and wrongful uploads to Spotify. Practitioner reviews on Trustpilot and specialist review sites document false Content ID claims against unaffiliated creators, revenue withheld through the 30-day dispute window, and opaque catalog removals. On the control side, public evidence of security certifications, formal quality metrics, uptime disclosure, or an independent Content ID accuracy audit is absent — a material transparency gap for an infrastructure business whose core asset is trust over other people's rights.
