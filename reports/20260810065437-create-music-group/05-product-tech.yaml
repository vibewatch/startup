company:
  name: Create Music Group
chapter:
  number: 5
  title: Product & Technology
  summary: Create Music Group (CMG) is best read as a vertically integrated rights-and-royalty operating system for independent artists and labels, not a single app. Its strongest, best-evidenced surfaces are YouTube Content ID rights management and UGC monetization, multi-DSP distribution, and royalty accounting delivered through the Label Engine platform. Newer data-analytics and capital layers — reinforced by the February 2026 hire of ex-UMG data chief Mitchell Shymansky as CDTO — expand the ambition, but the same Content ID engine that drives monetization is also the source of the most serious trust risk, with a 2022 Billboard investigation and multiple lawsuits alleging over-claiming and false ownership assertions.
sections:
- id: product-scope-and-modules
  title: Product scope, modules, and the artist/label workflow
  body: >-
    Create Music Group does not sell one feature; it sells an end-to-end rights-and-revenue infrastructure that lets independent artists and labels keep ownership while accessing major-label-grade monetization. The company's own homepage frames the offer around four pillars — Technology (distribution, rights management, accounting, and real-time insights), Investment (growth capital and advances), Creative (in-house A&R, distribution networks, and social-first strategy via brands like Flighthouse and VRTCL), and Expertise. The operational heart of the technology pillar is Label Engine, the label-services platform CMG acquired in 2016, which handles multi-DSP distribution, point-and-click royalty accounting, promotional tooling, and demo management for thousands of labels and distributors. Around that core sit YouTube Content ID rights management and UGC monetization, publishing administration, sync licensing, a data-analytics layer, and a Create Capital advances arm. The module map therefore begins with distribution and rights registration, extends into collection and accounting, and then reaches into marketing, analytics, and financing — a breadth that lets a label centralize distribution, YouTube monetization, royalty statements, and capital inside one operator relationship rather than stitching together separate vendors. This section's tables and figures enumerate that module/asset map and the day-to-day workflow it automates.
  claimRefs:
