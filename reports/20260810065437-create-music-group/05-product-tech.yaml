  evidenceGaps:
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: A public trust center, security certification (SOC 2 / ISO), uptime SLA, or status page for CMG's platform and Label Engine.
    whyItMatters: For an infrastructure business handling other parties' rights and royalties, the absence of verifiable security and reliability assurance is a diligence blocker.
    diligencePath: Request CMG's security packet, certification reports, uptime/incident history, and DR architecture directly from the company.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: content-id
    missingEvidence: Independent measurement of CMG's Content ID matching accuracy, claim false-positive rate, and dispute-resolution times.
    whyItMatters: The company's core monetization advantage and its biggest legal exposure both hinge on claim accuracy that is currently only self-reported.
    diligencePath: Request internal claim/dispute audit logs, false-positive metrics, and third-party review of the Content ID operation.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: architecture
    missingEvidence: CMG's actual cloud infrastructure topology, data-platform design, and internal SLOs behind the analytics layer.
    whyItMatters: The CDTO-led data build-out is central to the roadmap but its scalability is asserted, not demonstrated.
    diligencePath: Request architecture diagrams, capacity metrics, and engineering roadmaps from the CDTO's organization.
    relatedQuestionRefs:
    - QE009
    relatedTableRefs:
