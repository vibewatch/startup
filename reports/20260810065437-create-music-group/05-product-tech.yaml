callouts:
- calloutType: strength
  title: Rights recovery plus label-grade back office is the real product
  body: CMG's edge is not a cheaper upload button but an integrated engine that recovers YouTube UGC revenue, distributes to hundreds of DSPs, computes royalty statements, and pays artists in seconds — at a scale (200B+ monthly streams, 26M+ tracks delivered through Label Engine) that single-artist tools do not operate.
  claimRefs:
  - CE011
  - CE013
  - CE014
  - CE028
- calloutType: risk
  title: The monetization engine and the biggest liability are the same system
  body: The Content ID capability that recovers unclaimed revenue is exactly what a 2022 Billboard/Variety investigation and the 2025 APG lawsuit allege is used to over-claim rights that are not CMG's. Because value is created at the claiming step, weak metadata discipline is simultaneously a revenue driver and a legal/reputational exposure.
  claimRefs:
  - CE033
  - CE034
  - CE036
  - CE037
- calloutType: assumption
  title: Trust posture must be verified, not inferred from scale
  body: No public evidence surfaced for security certifications, uptime SLAs, Content ID false-positive rates, or an independent claim-accuracy audit. Investors should treat these as open items and demand direct materials rather than reading trust into the company's size or acquisition pace.
