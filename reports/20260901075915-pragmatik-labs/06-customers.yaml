callouts:
  - calloutType: insight
    title: Traction today is mostly latent demand, not converted demand
    body: >-
      The financing round and founder reputation show that sophisticated stakeholders believe demand
      could exist, but public evidence has not yet moved from attention into observable customer proof.
    claimRefs:
      - CU005
      - CU006
      - CU029
  - calloutType: risk
    title: No named design partner means adoption risk remains untested
    body: >-
      Even for a young frontier company, the absence of a public customer or pilot reference leaves a
      major hole in the diligence picture. The first real customer proof could materially change the
      investment view in either direction.
    claimRefs:
      - CU006
      - CU030
      - CU033
  - calloutType: assumption
    title: The first customers are likely to be high-context design partners
    body: >-
      Given the product stage, Pragmatik is more likely to land a small number of collaborative pilot
      accounts than a broad self-serve customer base. That raises both concentration risk and learning
      value.
    claimRefs:
      - CU010
      - CU018
      - CU021
