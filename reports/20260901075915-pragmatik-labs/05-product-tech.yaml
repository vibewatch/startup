callouts:
  - calloutType: insight
    title: Pragmatik looks more like a systems research lab than an application wrapper
    body: >-
      The founder's writing and the company's dual digital-plus-physical framing point toward a
      systems problem—training, control, and long-horizon execution—rather than a thin UI layer on
      top of existing models.
    claimRefs:
      - CE003
      - CE010
      - CE017
  - calloutType: risk
    title: No public release means the market cannot yet distinguish ambition from execution
    body: >-
      Publicly, Pragmatik has a coherent technology thesis but no external artifact that lets buyers,
      developers, or recruits verify product quality, architecture choices, or speed of progress.
    claimRefs:
      - CE006
      - CE019
      - CE030
  - calloutType: assumption
    title: Digital workflows are the likely first commercialization step
    body: >-
      Embodied agents fit the long-run story, but software-based digital workflows offer faster
      iteration and lower safety burden. That makes them the most plausible first public product.
    claimRefs:
      - CE016
      - CE018
      - CE021
