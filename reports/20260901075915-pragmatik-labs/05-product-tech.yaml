  evidenceGaps:
    - type: missing-source
      severity: material
      topic: api-release
      missingEvidence: Public API, SDK, demo, or benchmark release.
      whyItMatters: >-
        Without an external artifact, it is impossible to validate capability quality or developer
        readiness beyond the founder's thesis.
      diligencePath: Request product preview, sandbox access, and evaluation materials.
      relatedQuestionRefs: [QE022]
    - type: private-evidence-only
      severity: material
      topic: model-strategy
      missingEvidence: Internal model choice, training approach, and infrastructure design.
      whyItMatters: >-
        Model ownership and training strategy shape both differentiation and cost structure.
      diligencePath: Review technical architecture deck and internal model roadmap.
      relatedQuestionRefs: [QE023]
    - type: private-evidence-only
      severity: material
      topic: evaluation
      missingEvidence: Internal metrics, test environments, and pass/fail gates for agent quality.
      whyItMatters: >-
        Agent products fail in subtle ways; without evaluation discipline, demo quality says little
        about production reliability.
      diligencePath: Request eval suite, red-team plan, and observability instrumentation.
      relatedQuestionRefs: [QE024]
    - type: missing-source
      severity: material
      topic: physical-partners
      missingEvidence: Public or private evidence of hardware, simulation, or deployment partners for the physical-agent track.
      whyItMatters: >-
        Embodied ambitions are difficult to assess without knowing the environments, interfaces, and
        partner dependencies involved.
      diligencePath: Request partner list, pilot environments, and embodied roadmap milestones.
      relatedQuestionRefs: [QE025]
