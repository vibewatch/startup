    rows:
      - - Broad AI agent software
        - Agent platforms, orchestration layers, workflow applications, deployment services
        - Generic chatbot seats with no delegated action
        - CIO, COO, functional software owners
        - Sets headline category growth and investor narrative
      - - Enterprise digital-agent workflows
        - Knowledge work automation, support ops, business process execution, industrial software workflows
        - Simple SaaS copilots and pure analytics tools
        - Operations leaders, IT, transformation budgets
        - Most credible near-term SAM for Pragmatik
      - - Agent infrastructure and orchestration
        - Memory, tool-calling, workflow control, evaluation, observability
        - Raw base-model training revenue
        - Platform engineering, AI platform teams
        - Likely margin-rich layer if Pragmatik productizes system infrastructure
      - - Physical-agent software
        - Embodied planning, real-world task control, simulation, perception-action loops
        - Robotics hardware, actuators, and manufacturing equipment sales
        - Factory automation and robotics leaders
        - Expands long-run upside but increases deployment friction
      - - Status-quo substitutes
        - BPO, offshore ops teams, RPA, workflow SaaS, systems integrators
        - N/A
        - Existing budget owners already funding labor and software
        - Defines the real displacement pool that agents must win
    notes: >-
      The boundary is intentionally layered because public sources use different definitions for
      "AI agents." Pragmatik's official positioning spans both digital and physical domains.
