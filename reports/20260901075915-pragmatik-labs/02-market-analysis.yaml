callouts:
  - calloutType: insight
    title: The real market is service replacement, not model API spend
    body: >-
      Pragmatik's upside depends on buyers paying for completed work, throughput, or workflow
      ownership, not on reselling base models. That is why buyer economics and operational substitution
      matter more than the broadest generative-AI market numbers.
    claimRefs:
      - CM005
      - CM009
      - CM018
  - calloutType: risk
    title: A broad vision can hide an unchosen entry wedge
    body: >-
      Digital agents plus physical agents is strategically ambitious, but it risks sounding like a
      research manifesto rather than a commercial plan until Pragmatik discloses which workflow or
      customer segment comes first.
    claimRefs:
      - CM001
      - CM014
      - CM030
  - calloutType: assumption
    title: China-resident deployment could be a genuine go-to-market advantage
    body: >-
      If Pragmatik can offer high-end agent capability with domestic data handling and trusted
      enterprise deployment, Shanghai location and local investor backing could become a market-entry
      asset rather than just a corporate fact.
    claimRefs:
      - CM017
      - CM023
      - CM027
