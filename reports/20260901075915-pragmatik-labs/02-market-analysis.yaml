  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-model
      missingEvidence: Public pricing, pilot commercial terms, or even a stated billing basis for the first Pragmatik product.
      whyItMatters: >-
        Without a pricing basis it is impossible to translate broad market demand into revenue density,
        payback, or a credible SOM model.
      diligencePath: Request pilot proposals, draft order forms, or founder guidance on seat, workflow, usage, or outcome-based pricing.
      relatedQuestionRefs: [QM021]
    - type: missing-source
      severity: material
      topic: vertical-priority
      missingEvidence: Public disclosure of the first vertical, workflow family, or named design-partner segment.
      whyItMatters: >-
        Segment choice determines the relevant buyer map, sales cycle, implementation burden, and
        whether the business should be valued as infrastructure or application software.
      diligencePath: Request product roadmap, design-partner pipeline, and internal market-selection memo.
      relatedQuestionRefs: [QM022, QM023]
    - type: missing-source
      severity: material
      topic: physical-agent-spend
      missingEvidence: Evidence showing how much embodied-agent demand can be captured as software-only spend versus hardware-tied budgets.
      whyItMatters: >-
        Physical-agent upside may enlarge the vision while contributing little to near-term software
        revenue if the economics sit mainly with hardware and field integration.
      diligencePath: Review partner strategy, target deployment architecture, and any simulation or robotics-stack commercialization plan.
      relatedQuestionRefs: [QM024]
    - type: missing-source
      severity: material
      topic: willingness-to-pay
      missingEvidence: Evidence from pilot budgets, paid proofs of concept, or procurement benchmarks for agent systems.
      whyItMatters: >-
        Category excitement does not guarantee that buyers will pay platform-level prices before
        reliability is proven in a narrow workflow.
      diligencePath: Collect customer interview transcripts, pilot pricing benchmarks, and lost-deal notes from comparable vendors.
      relatedQuestionRefs: [QM025]
