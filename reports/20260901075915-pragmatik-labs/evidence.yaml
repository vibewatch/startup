evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: governance
    missingEvidence: Full cap table, shareholder agreement, board composition, and investor rights
    whyItMatters: >-
      Without governance documents, it is impossible to assess investor protections, liquidation preferences,
      anti-dilution rights, or founder lockup provisions.
    diligencePath: Request cap table and SHA from company during formal due diligence
    relatedQuestionRefs:
      - QO004
      - QO003
      - QO007
      - QO012
      - QO019
      - QO025
  - type: private-evidence-only
    severity: material
    topic: team
    missingEvidence: Headcount, team composition, co-founders, and key hires beyond Lin Junyang
    whyItMatters: >-
      A seed-stage AI research company with one publicly named person is difficult to evaluate on execution capability;
      team is the most critical input to success at this stage.
    diligencePath: Request organizational chart and LinkedIn profiles of current team
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: product
    missingEvidence: Any product specification, technical architecture document, or research preview
    whyItMatters: >-
      Without any public technical artifact, it is impossible to verify that the research thesis described in Lin's blog
      is being operationalised into a buildable product.
    diligencePath: Request internal research roadmap and technical architecture during diligence
  - type: access-blocked
    severity: minor
    topic: legal
    missingEvidence: Company registration details from China SAMR/Tianyancha
    whyItMatters: Formal corporate registration confirms legal entity name, registration date, and registered capital
    diligencePath: Obtain SAMR print-out or Tianyancha report through local counsel
  - type: missing-source
    severity: material
    topic: pricing-model
    missingEvidence: Public pricing, pilot commercial terms, or even a stated billing basis for the first Pragmatik product.
    whyItMatters: >-
      Without a pricing basis it is impossible to translate broad market demand into revenue density, payback, or a
      credible SOM model.
    diligencePath: >-
      Request pilot proposals, draft order forms, or founder guidance on seat, workflow, usage, or outcome-based
      pricing.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: vertical-priority
    missingEvidence: Public disclosure of the first vertical, workflow family, or named design-partner segment.
    whyItMatters: >-
      Segment choice determines the relevant buyer map, sales cycle, implementation burden, and whether the business
      should be valued as infrastructure or application software.
    diligencePath: Request product roadmap, design-partner pipeline, and internal market-selection memo.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: missing-source
    severity: material
    topic: physical-agent-spend
    missingEvidence: >-
      Evidence showing how much embodied-agent demand can be captured as software-only spend versus hardware-tied
      budgets.
    whyItMatters: >-
      Physical-agent upside may enlarge the vision while contributing little to near-term software revenue if the
      economics sit mainly with hardware and field integration.
    diligencePath: >-
      Review partner strategy, target deployment architecture, and any simulation or robotics-stack commercialization
      plan.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: willingness-to-pay
    missingEvidence: Evidence from pilot budgets, paid proofs of concept, or procurement benchmarks for agent systems.
    whyItMatters: >-
      Category excitement does not guarantee that buyers will pay platform-level prices before reliability is proven in
      a narrow workflow.
    diligencePath: Collect customer interview transcripts, pilot pricing benchmarks, and lost-deal notes from comparable vendors.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: wedge-gap
    missingEvidence: Public disclosure of the first target vertical, workflow, and buyer segment.
    whyItMatters: >-
      Without a defined wedge, it is impossible to know which competitor group matters most or whether Pragmatik will be
      judged as infrastructure, application software, or embodied AI.
    diligencePath: Request roadmap, design-partner pipeline, and internal prioritization memo.
    relatedQuestionRefs:
      - QP021
      - QP024
  - type: missing-source
    severity: material
    topic: developer-gap
    missingEvidence: API, SDK, docs, or developer preview showing how Pragmatik expects builders to adopt its platform.
    whyItMatters: >-
      Developer tooling is a major distribution and ecosystem moat in agent markets, and Pragmatik's public posture is
      silent on this dimension.
    diligencePath: Request product preview materials, API plan, and ecosystem strategy deck.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: compute
    missingEvidence: Details on compute access, cloud support, and internal infrastructure budget.
    whyItMatters: >-
      Competitive capacity in frontier agents depends partly on compute, but public sources do not quantify Pragmatik's
      ability to keep pace with better-established labs.
    diligencePath: Review supplier contracts, GPU plan, and capex/opex forecast.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: buyer-risk
    missingEvidence: >-
      Paid pilot data or buyer interviews showing willingness to add a new vendor instead of extending incumbent
      contracts.
    whyItMatters: >-
      The central competitive question is whether Pragmatik can overcome bundle and trust advantages held by large
      platforms.
    diligencePath: Request customer interview notes, pilot pricing, and lost-deal analysis from comparable vendors.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cash-balance
    missingEvidence: Current cash balance net of any round expenses and post-close commitments.
    whyItMatters: >-
      Gross capital raised is not the same as deployable cash, and runway judgments depend on the actual balance
      available today.
    diligencePath: Request bank balance, treasury summary, and post-close uses of proceeds.
    relatedQuestionRefs:
      - QI021
  - type: private-evidence-only
    severity: material
    topic: burn
    missingEvidence: Actual monthly burn by compensation, compute, facilities, and any external programs.
    whyItMatters: >-
      Scenario ranges are only placeholders until real expense data reveals whether Pragmatik is tracking like software,
      infrastructure, or embodied-AI hardware.
    diligencePath: Request monthly management accounts and board budget packs.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: Investor rights, preferences, board composition, and founder vesting.
    whyItMatters: Downside protection and governance rights matter as much as headline valuation in a pre-revenue financing.
    diligencePath: Review financing documents, cap table, and shareholder agreement.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: compute-contracts
    missingEvidence: Public or private disclosure of compute-capacity agreements, reserved cloud credits, or hardware access.
    whyItMatters: Compute access determines both burn and product velocity for a frontier-agent startup.
    diligencePath: Review supplier contracts and any investor-linked infrastructure agreements.
    relatedQuestionRefs:
      - QI024
  - type: missing-source
    severity: material
    topic: first-commercial-step
    missingEvidence: Evidence showing whether early commercialization will be paid pilots, subscriptions, or strategic programs.
    whyItMatters: >-
      The first commercial form determines cash-conversion timing and whether gross margins will look like software or
      services.
    diligencePath: Request pipeline report, proposal templates, and customer interview notes.
    relatedQuestionRefs:
      - QI025
  - type: missing-source
    severity: material
    topic: api-release
    missingEvidence: Public API, SDK, demo, or benchmark release.
    whyItMatters: >-
      Without an external artifact, it is impossible to validate capability quality or developer readiness beyond the
      founder's thesis.
    diligencePath: Request product preview, sandbox access, and evaluation materials.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: model-strategy
    missingEvidence: Internal model choice, training approach, and infrastructure design.
    whyItMatters: Model ownership and training strategy shape both differentiation and cost structure.
    diligencePath: Review technical architecture deck and internal model roadmap.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: evaluation
    missingEvidence: Internal metrics, test environments, and pass/fail gates for agent quality.
    whyItMatters: >-
      Agent products fail in subtle ways; without evaluation discipline, demo quality says little about production
