            body: >-
              评估 Pragmatik 的买方会把它与不止前沿 AI 实验室比较。直接替代包括通用企业智能体平台、带智能体能力的模型 API、工作流编排框架，以及中国本土自主任务产品。间接替代包括 Microsoft 365
              Copilot 式套件、AWS Bedrock 和 Amazon Q、Google Workspace 与 Cloud
              产品，甚至包括降低单一供应商锁定的多模型路由器。只有当买方把智能体接入记录系统、权限、评估循环和人工审批链之后，切换成本才会出现。关键在于，Pragmatik
