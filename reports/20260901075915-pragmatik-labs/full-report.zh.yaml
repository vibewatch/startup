  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Pragmatik Labs 要看的市场不是“全部 AI”，甚至不是“全部生成式 AI”。公司公开材料和 Lin Junyang
              的文章指向一个更窄但更重要的市场边界：能够感知语境、调用工具、协调步骤，并持续行动以完成业务或现实任务的软件系统。这个边界内包括用于研究、运营、支持、内部工作流执行和工业协同的数字智能体；相邻但部分排除的支出，则包括独立聊天机器人席位、没有工作流自主性的模型
              API 使用，以及纯机器人硬件收入。今天的实际替代集合很大，也解释了为什么采用会逐步推进：企业仍在用离岸服务、业务流程外包（BPO）、RPA 脚本、工作流
              SaaS、系统集成商和高度手工的分析师运营来完成这些工作。因此，Pragmatik 不仅要与新兴智能体平台竞争，也要与“人 + 旧软件”吸收劳动的现有运营模式竞争。
