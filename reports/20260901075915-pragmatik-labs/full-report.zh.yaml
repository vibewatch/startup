  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              Pragmatik 的竞争集合不能压缩成一张同行名单，因为公司公开覆盖数字和物理两类智能体。数字侧，直接参照对象包括 OpenAI、Anthropic、Google、Manus 和
              Mistral，它们已经在提供模型、工作流工具、企业控制或面向用户的智能体产品中的某种组合。物理侧，Figure AI 和 Physical Intelligence
              是最清晰的概念同行，因为它们把基础模型式推理接到真实世界行动。间接竞争来自 Microsoft、AWS 以及 Meta
              对齐的生态，这些玩家可以把智能体能力打包进更大的软件或基础设施套件。实际教训是，Pragmatik
              不是只在与其他创业公司赛跑；它进入的是一个由既有巨头控制分发、合规姿态、企业信任、开发者心智，甚至在若干案例中控制底层模型的技术栈。公司因此需要一个能在工作流结果上产生实质差异的楔子，而不只是笼统宣称要做智能体。
