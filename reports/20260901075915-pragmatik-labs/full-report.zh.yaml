            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV024
      - number: '8.4'
        title: 乐观、基准、悲观和敏感性
        blocks:
          - type: paragraph
            body: >-
              估值敏感性集中在少数变量上：Pragmatik
              多快能拿出真实产品产物、能否展示初始客户验证、有意义收入出现前还需要多少额外资本，以及市场是否继续用当前倍数奖励前沿智能体叙事。收入时点重要，但验证时点更重要。一家公司只要展示清晰切入点、可信试点转化和强招聘，即便近期收入不多，也能守住或抬高较高早期估值。相反，如果公司一边延迟验证、一边扩大烧钱，即使叙事仍令人兴奋，有效价值也会快速压缩。因此，情景分析比点估计更有信息量。当前轮价在乐观分支下仍可能合理；在基准和悲观分支下，若没有更多证据，会越来越难辩护。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV005
            claimRefs:
              - CV026
              - CV027
              - CV031
              - CV036
              - CV038
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV025
              - CV033
      - number: '8.5'
        title: 估值结论和核心不确定性
        blocks:
          - type: paragraph
            body: >-
              估值结论不是 Pragmatik
              不能投，而是当前公开证据更清楚地支持强创始人和市场命题，支持本轮价格的力度较弱。对既有内部投资人或战略支持者来说，为选择权付费可能合理。对只依赖公开信息的新投资人来说，除非伴随特权访问、内部尽调或差异化战略价值，当前估值看起来偏高。最重要的不确定性是推进顺序：如果
              Pragmatik 很早拿出产品和客户验证，估值会显得有远见；如果太久停留在逻辑很重、证据很轻的状态，$2 billion
              估值可能从实力信号变成阻碍未来融资的锚。因此，这里的建议倾向继续研究，而不是直接买入或回避。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV020
              - CV021
              - CV028
              - CV037
              - CV040
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 在公开估值下，继续研究是最有完整性的立场
            body: 这个建议不是摇摆，而是强上行潜力与极高初始估值下缺少产品和客户验证相撞后的结果。
            calloutType: recommendation
            claimRefs:
              - CV033
              - CV039
              - CV040
          - type: callout
            title: 当前估值是押注验证的期权，不是当前基本面的反映
            body: Pragmatik 当前估值更多定价创始人质量、品类时点和未来战略价值，而不是当下经济性。它可能极其成功，也可能迅速失败。
            calloutType: insight
            claimRefs:
              - CV005
              - CV017
              - CV031
          - type: callout
            title: 如果验证继续延迟，轮价会变成负担
            body: 高早期估值可以强化动量，也会抬高之后每一轮融资的门槛，让中等进展看起来像失败。
            calloutType: risk
            claimRefs:
              - CV027
              - CV035
              - CV038
