      - number: '7.2'
        title: 市场和竞争风险
        blocks:
          - type: paragraph
            body: >-
              市场风险不是 AI 智能体没有前景，而是赛道变化太快，产品发布前的进入者可能在上线前就失去战略空间。前沿实验室和云厂商已经在训练买方期待更好的工具、更强的合规和更紧的集成，而「AI
              智能体」这个词本身仍足够宽，容易诱发品类漂移和过度承诺。Pragmatik 如果切得太宽，就会到处竞争却哪里都赢不了；如果切得太窄，又可能撑不起初始融资规模及其估值预期。中国具身 AI
              热潮有助于提高认知度，但也会加剧人才竞争、抬高客户预期。严肃的市场风险判断不能只看产品-市场匹配，还要看叙事-市场匹配：公司必须选择一个市场能理解、也愿意付费的切入点，否则热度或竞争对手捆绑会先跑到前面。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
