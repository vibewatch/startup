              - CV040
      - number: '8.2'
        title: 基于市场的估值视角
        blocks:
          - type: paragraph
            body: >-
              基于市场的估值可以从私有可比融资和公开市场披露锚点出发，但不应假装输入比实际更干净。公开前沿 AI
              可比公司交易时，收入、算力获取、分发和战略选择权的组合差异很大；私有轮次也常常像反映稀缺性和动量一样反映现金流逻辑。Pragmatik 本轮融资就处在这个世界里。和超大前沿轮相比，$2 billion
              这个标记在绝对值上并不荒唐；和典型产品发布前软件公司相比，它显然很极端。因此，正确的市场问题不是这一轮是否可能——它显然已经发生——而是当前证据集是否足以让新投资人维持这个估值。仅看今天可得的公开证据，答案只能是部分支持：创始人溢价真实存在，但证据折价也应该真实存在。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
