            body: >-
              Lin Junyang 曾负责中国最具全球影响力的开源 LLM，在中国大型科技公司拿到最高技术职级（P10），并在创办 Pragmatik 前写下智能体 AI 逻辑。这种组合很少见：既有亲手搭建 LLM
