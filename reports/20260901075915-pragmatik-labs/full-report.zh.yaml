              技术负责人带队的前沿智能体创业公司，大概率会在三类成本上重投入：顶尖技术人才薪酬、模型和推理基础设施，以及训练和评估长周期智能体行为所需的工具或数据管线。如果公司实质进入物理智能体，而不是先停留在软件优先，新的烧钱类别会出现：机器人合作、现场测试、具身数据采集、仿真和更慢的迭代周期。相比之下，传统
              SaaS 的销售和营销等科目在这个阶段可能很小，因为公司没有公开产品可规模化。可能的结果是，烧钱曲线高于普通种子期软件创业公司，但仍明显低于垂直整合的机器人制造商。这个区别很重要，因为它决定 $220M
