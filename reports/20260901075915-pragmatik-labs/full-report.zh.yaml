          - type: callout
            title: 强治理可以抵消部分创始人集中度
            body: 如果公司能快速补上可信运营者、厘清决策权，并按顺序推进路线图、降低创始人过载，关键人风险就不致命。
            calloutType: assumption
            claimRefs:
              - CR026
