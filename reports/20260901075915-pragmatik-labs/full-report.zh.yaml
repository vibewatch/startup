      - number: '8.3'
        title: 内在价值和里程碑推理
        blocks:
          - type: paragraph
            body: >-
              传统 DCF 对 Pragmatik
              并不真正有意义，因为没有可观察收入流可供折现。最接近内在价值的方法，是按里程碑加权的期权价值：如果公司推出切入点、招到顶尖团队、锁定算力、赢得设计合作伙伴，并穿过拥挤竞争场，最终成为重要智能体系统平台，它的现值是多少？这个结构仍允许有纪律地推理。悲观情景假设公司无法把叙事转成产品验证，最终从更弱位置再次融资。基准情景假设首个产品成功、早期客户验证可信，但还不是品类领导者。乐观情景假设
              Pragmatik 把创始人履历转成跨高价值工作流、也可能延伸到具身方向的持久系统优势。由于每条分支都取决于里程碑，而不是当前现金流，正确折扣率本质上是对执行打一个概率折扣，不是追求电子表格洁癖。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: table
            tableRef: TV003
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: figure
