      - number: '2.5'
        title: 公开证据仍无法回答什么
        blocks:
          - type: paragraph
            body: >-
              最大的尽调缺口不是 AI 智能体 TAM 的顶层数字，而是缺少产品范围选择；没有这些选择，投资人无法把宽类别判断转成真实收入模型。公开来源尚未显示 Pragmatik
              的首个工作流、计价基础、目标垂直行业、部署模型、实施负担，也没有说明初始楔子是纯软件、软件加服务，还是软件配合硬件伙伴。因此，互相矛盾的市场叙事必须保留下来，不能被抹平。一种叙事认为，公司可以抓住一个周期级平台转移，拿下高毛利编排或智能体系统支出。另一种叙事认为，“AI
              智能体”仍是一个伞状类别，定义不稳定、既有玩家位置不清晰，且在少数标杆试点之外，付费意愿仍不确定。因此，好的尽调应把市场视为有前景但定义不足，直到 Pragmatik 选择并发布第一个进入产品。
