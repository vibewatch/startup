  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值语境和可比交易
        blocks:
          - type: paragraph
            body: >-
              即便按前沿 AI 标准看，Pragmatik 的起点也很少见：在没有公开产品、公开收入或客户引用之前，据报道就完成约 $220 million 天使轮，投后估值约 $2
              billion。公司因此立刻进入更成熟前沿模型或具身 AI 融资的讨论集合，尽管底层证据更薄。最相关的可比对象不是传统 SaaS 公司，而是私有 AI 实验室和具身 AI
              初创公司；这些公司的估值通常由团队质量、模型野心、资本强度和战略稀缺性驱动。这既有帮助也很危险。有帮助，是因为市场已经愿意很早给可信前沿团队注资。危险在于，许多可比公司定价时已经有更强产品验证、更完整团队或更清晰战略资产。因此，Pragmatik
              既要放进可比交易里看，也要按证据厚度打折。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV004
