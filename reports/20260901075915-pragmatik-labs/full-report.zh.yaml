      - number: '2.2'
        title: 不靠单一 TAM 标题，改用多重视角估市场
        blocks:
          - type: paragraph
            body: >-
              Pragmatik 处在多个仍被分析师拆开讨论的类别交汇处——AI 智能体、企业 AI 应用、编排软件，以及具身或物理 AI——因此只引用一个市场规模数字会误导判断。MarketsandMarkets
              给出的宽口径 AI 智能体标题数字是 2030 年 $52.62B、CAGR 46.3%；a16z
              和近期调研则认为，价值池横跨应用软件、编排和服务替代，而不只是模型收入。更有用的估算栈应当分层看。宽口径总可用市场（TAM）是全球智能体软件及相关部署服务支出。更窄的可服务市场（SAM）是企业知识工作、商业运营和工业工作流自动化，前提是智能体能在软件环境中执行有边界的动作。近期可获取市场（SOM）还要更小：愿意与一家尚未发布产品、总部在上海、由顶级创始人带队但没有生产引用客户的创业公司做试点的中国及跨国早期采用者。
