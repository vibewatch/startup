      - number: '1.2'
        title: 创始人 Lin Junyang
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang（Justin Lin，林俊旸）出生于 1993 年，是 Pragmatik Labs
              目前唯一公开披露的创始人。他的学术背景在语言方向上格外深：本科就读于国际关系学院英语系，同时学习日语、俄语、德语和法语；随后在北京大学取得外国语言学及应用语言学硕士学位，并于 2019 年毕业。

              毕业后，Lin 加入 Alibaba 达摩院，从事 NLP 研究，任高级算法工程师。他在 Alibaba 内部职级体系中升得很快：到 2022 年底 Alibaba 将 AI 团队并入 Tongyi Lab
              时，Lin 接手 Tongyi Qwen 系列并担任技术负责人。在他的带领下，Qwen 家族从内部项目成长为全球下载量最高的开源 LLM 系列之一，拥有数十万月活开发者，并多次取得领先基准测试成绩。2024 年
              8 月，前 Qwen 负责人 Zhou Chang 离职加入 ByteDance 后，Lin 晋升 P9；2025 年 5 月，伴随 Qwen3 发布，他成为 Alibaba 史上最年轻的 P10
              级技术负责人。2025 年 10 月，他亲自在 Qwen 内部组建机器人与具身智能团队；2026 年 3 月初离职创办 Pragmatik Labs。

              Lin 是第一次担任 CEO，此前没有创办和经营公司的经历。他公开呈现的形象是一名深度技术研究者，长期思考 AI 架构。2026 年 3 月 26
              日发布的“智能体思维”博客文章——写在公司公开发布之前——最清楚地阐明了他的创始逻辑：下一波 AI 价值创造不只来自能力更强的模型，而来自嵌入环境中的模型；这些模型能在真实世界中感知、行动并接收反馈。
