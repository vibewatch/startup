      - number: '1.4'
        title: 融资与投资方
        blocks:
          - type: paragraph
            body: >-
              Pragmatik Labs 完成了约 $220M 天使轮融资，并于 2026 年 8 月 12 日公开宣布。该轮由 Gaorong Ventures 和 HongShan（Sequoia
              China）共同领投，两家各出资约 $100M。Tencent 作为战略投资方投入约 $20M。Shanghai Future Industry
              Fund——一家聚焦先进技术和产业转型的政府背景基金——也提供支持；金额未披露。

              天使轮后，外部投资者合计持有公司约 12%，Lin Junyang 仍保留控股权，持股估计约 88%。$220M 融资对应 $2B
              投后估值，本质上是在极早期阶段押注创始人履历——该轮宣布时，公司还没有产品，成立时间也只有约五个月。

              Gaorong Ventures（高榕创投）是中国主要早期 VC 机构，早期投过 Alibaba、Bytedance 等公司。HongShan（红杉中国）是 Sequoia China 在 2023 年与全球
              Sequoia 品牌分离后的新名称，在中国科技投资中拥有最深厚的历史业绩之一。Tencent 参投增加了重要战略维度：作为中国最大的社交和游戏公司，Tencent 既有分发渠道，也有企业关系，未来可能与
              Pragmatik 的智能体平台相关。
