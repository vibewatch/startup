            body: >-
              公开层面看，Pragmatik 的定位作为一套逻辑比作为一个产品更强。官网和 Lin Junyang
              的文章描述了从推理系统走向智能体系统、从数字工作流走向物理执行的迁移。这个叙事在野心上有差异化，但还没有披露公司将先拥有哪个具体工作流、买方或部署模式。因此，市场主要通过创始人可信度来评估
              Pragmatik。Lin 曾负责 Qwen，他也写明智能体基础设施必须作为系统来训练，而不是只训练一个模型；这暗示公司可能在系统层形成差异，尤其是 rollout
