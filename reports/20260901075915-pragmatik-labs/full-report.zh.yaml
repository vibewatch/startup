      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Pragmatik 的买方地图可能很杂，因为“智能体”产品会切到多个预算负责人。在数字工作流中，经济买方通常是
              CIO、COO、共享服务负责人，或负责成本、吞吐、错误率的职能主管；日常用户可能是运营分析师、知识工作者、调度员或工程师；付款预算则可能在
              IT、运营或转型部门，取决于部署范围。在物理智能体场景中，买方会转向工厂自动化、工业数字化、机器人或运营负责人，用户则是主管和一线团队。这一区分很重要，因为采用很少一开始就是全公司平台销售。它通常从一个工作流、一条工具链或一个站点开始，先看到
              ROI；如果可靠性、治理和集成负担可接受，再继续扩张。Pragmatik 没有公开产品，因此仍需选择哪个买方分层作为进入楔子，而不是一次性出售完整愿景。
