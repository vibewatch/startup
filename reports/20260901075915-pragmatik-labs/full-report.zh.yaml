      - number: '5.4'
        title: 技术风险、限制与失效模式
        blocks:
          - type: paragraph
            body: >-
              最重要的技术风险，恰恰落在智能体系统仍然脆弱的地方。长周期执行漂移、工具误用、不可靠规划、隐藏状态错误和弱评估，都可能让一个看似惊艳的演示在生产中失败。如果 Pragmatik
              进入物理智能体，这些风险会被放大：安全、感知、控制延迟和具身数据稀缺，会制造纯软件产品不会遇到的失效模式。即便在数字侧，生产级智能体也需要护栏、回滚路径、可审计性、权限边界和运营人员接管设计。公开生态资料显示，这些担忧已经成为严肃智能体建设者的设计原语。考虑到创始人背景，Pragmatik
              很可能在理念上理解这些问题；但公开证据尚未显示公司已经把必要的评估、可观测性或信任控制做进产品界面。
