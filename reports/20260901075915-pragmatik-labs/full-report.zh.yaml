  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 核心风险类别在发生可能性、严重性、缓解成熟度和残余暴露上的序数热力图。
    data:
      columns:
        - 可能性
        - 严重性
        - 缓解成熟度
        - 残余暴露
      rows:
        - label: 长程可靠性
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 物理智能体安全
          values:
            - 中
            - 极高
            - 低
            - 高
        - label: 监管与法律
          values:
            - 中
            - 高
            - 中
            - 中
        - label: 创始人集中度
          values:
            - 高
            - 极高
            - 低
            - 高
        - label: 融资与烧钱
          values:
            - 中
            - 高
            - 中
            - 中
    claimRefs:
      - CR001
      - CR004
      - CR018
      - CR026
      - CR034
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 展示技术、监管和人员风险如何传导到客户证明、融资和估值结果。
    data:
      nodes:
        - id: tech
          label: 技术可靠性
          description: 产品质量和安全
        - id: legal
          label: 法律与监管
          description: 数据、责任和跨境暴露
        - id: people
          label: 创始人与团队
          description: 关键人和招聘风险
        - id: customers
          label: 客户证明
          description: 试点、客户背书和重复使用
        - id: finance
          label: 融资
          description: 现金跑道和下一轮杠杆
        - id: valuation
          label: 估值
          description: 守住当前估值标记的能力
      edges:
        - from: tech
          to: customers
          label: 产品证明
        - from: legal
          to: customers
          label: 部署摩擦
        - from: people
          to: tech
          label: 执行带宽
        - from: customers
          to: finance
          label: 里程碑可信度
        - from: finance
          to: valuation
          label: 下一轮条款
        - from: tech
          to: valuation
          label: 信心
    claimRefs:
      - CR003
      - CR019
      - CR025
      - CR033
      - CR036
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: standard
    summary: 关键外部依赖横跨算力、模型、客户系统，以及可能的物理伙伴。
    data:
      nodes:
        - id: compute
          label: 算力供给
          description: GPU 和云资源获取
        - id: models
          label: 模型策略
          description: 内部或第三方模型
        - id: integrations
          label: 客户系统
          description: API、权限和数据访问
        - id: data
          label: 数据权利
          description: 训练和评估数据
        - id: partners
          label: 物理伙伴
          description: 机器人或仿真合作关系
        - id: deployment
          label: 产品部署
          description: 可运行的客户系统
      edges:
        - from: compute
          to: models
          label: 容量
        - from: models
          to: deployment
          label: 能力
        - from: integrations
          to: deployment
          label: 访问
        - from: data
          to: models
          label: 改进
        - from: partners
          to: deployment
          label: 具身路径
    claimRefs:
      - CR011
      - CR012
      - CR021
      - CR037
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 建议链条：从创始人和市场优势出发，经由证明缺口，落到风险调整后的估值判断。
    data:
      nodes:
        - id: founder
          label: 创始人质量
          description: 强前沿 AI 履历
        - id: market
          label: 大市场
          description: AI 智能体和相邻具身系统具备战略重要性
        - id: proof
          label: 证明有限
          description: 没有产品、收入或客户证据
        - id: price
          label: 入场价格高
          description: 天使阶段投后估值约 $2B
        - id: verdict
          label: 继续研究
          description: 投资逻辑有吸引力，公开估值偏高
      edges:
        - from: founder
          to: verdict
          label: 支撑上行
        - from: market
          to: verdict
          label: 支撑上行
        - from: proof
          to: verdict
          label: 压低确信度
        - from: price
          to: verdict
          label: 限制当前估值下的上行空间
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV033
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 影响估值判断的关键变量相对重要性，按 1 到 10 打分。
    data:
      items:
        - label: 产品证明时点
          value: 10
        - label: 客户证明时点
          value: 9
        - label: 烧钱与稀释
          value: 8
        - label: 算力获取
          value: 7
        - label: 市场倍数环境
          value: 7
        - label: 创始人留任与团队搭建
          value: 8
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV029
      - CV031
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 概率加权估值区间，均以百万美元计，反映按证据调整后的乐观、基准和悲观分支。
    data:
      items:
        - label: 悲观估值
          low: 500
          mid: 900
          high: 1300
        - label: 基准估值
          low: 1300
          mid: 2000
          high: 2800
        - label: 乐观估值
          low: 2800
          mid: 4500
          high: 7000
    approximationNotes: 这些不是市场报价，而是基于可比融资背景、里程碑不确定性和预期证明折价搭出的判断区间。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的七个影响估值的维度评分，5 分为最强。
    data:
      items:
        - label: 市场机会
          value: 5
        - label: 创始人质量
          value: 5
        - label: 产品证明
          value: 1
        - label: 客户证明
          value: 1
        - label: 资本充足性
          value: 4
        - label: 风险画像
          value: 2
        - label: 估值吸引力
          value: 2
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV025
      - CV033
