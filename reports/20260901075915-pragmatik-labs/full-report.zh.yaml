chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >-
              Pragmatik Labs，也写作 p7k（由九个字母的 “pragmatik” 压缩而来），大约于 2026 年 3 月在中国上海注册成立。公司英文名来自
              “pragmatics”，即研究语境如何塑造意义的语用学；创始人 Lin Junyang 拥有外国语言学硕士学位，因此选择了这个名字。在公司发布公告中，Lin
              解释称，这个名字意味着“回到一切真正发生的地方”，也指向他认为 AGI 应追求的实用主义方向。

              Pragmatik 在 pragmatik.com
              上发布的首个公开产品简介，把公司研究方向分成四块：（1）面向知识工作、商业运营和工业级工作流的通用数字智能体；（2）物理智能体，即能适应环境、采取行动，并在真实世界完成长周期任务的具身智能；（3）用真实世界信号塑造各研究方向的“研究到产品”反馈环；（4）长期科学探索，目标是打造能打破既有范式、加速科学进步的系统。

              截至 2026-09-01 的运行日，Pragmatik Labs 尚未发布产品、宣布客户，也没有公布模型权重或基准测试结果。公司处在深度研究模式，这与一支直接来自全球顶级 LLM
              项目之一的创始团队相符。公司选择隐身运作、先研究后产品，类似 Anthropic 早期路径，也反映了创始人的判断：智能体时代需要新的训练和基础设施原语，而不只是应用封装层。
