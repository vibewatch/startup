  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术和执行风险
        blocks:
          - type: paragraph
            body: >-
              Pragmatik
              近期最大风险，是能否兑现异常宽泛的技术野心。数字智能体在长周期任务、工具使用、隐藏状态管理和评估纪律上仍然脆弱。物理智能体还叠加了感知、安全、真实世界数据和部署延迟风险。公开层面，Pragmatik
              还没有发布产品、基准测试、API 或信任控制框架，外部观察者无法判断团队是否已把创始人命题转成一套能支撑智能体可靠性的工作系统。这不是边缘问题：对智能体公司来说，细微产品故障摧毁信任的速度，远快于削弱
              演示吸引力的速度。一家公司若想同时打通数字和物理两个领域，也会面临路线图摊得过散的风险：太多难题被同时推进，却没有一个足够快地达到生产可用阈值来验证业务。
