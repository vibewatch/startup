      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 最高的即时风险仍是缺少产品验证
            body: 监管和资本风险都重要，但主风险更简单：Pragmatik 还没有展示能验证其宏大命题的外部产品产物。
            calloutType: risk
            claimRefs:
              - CR001
              - CR033
              - CR034
          - type: callout
            title: 宽泛野心既是投资逻辑，也是危险源
            body: 公司「数字 + 物理」的框架在战略上令人兴奋，但相比狭窄应用切入点，也更容易带来路线图失焦和验证延迟。
