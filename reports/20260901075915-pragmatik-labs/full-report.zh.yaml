      - number: '7.5'
        title: 财务和运营风险
        blocks:
          - type: paragraph
            body: >-
              财务和运营风险来自已披露资本与未披露运营证据之间的错配。$220 million
              融资给了公司时间，也制造了压力：公司必须拿出配得上超高初始估值的进展。如果公司无法在合理时间内发布清晰产品、招到正确团队、锁定算力，或验证设计合作伙伴切入点，下一轮融资可能会从更弱的谈判位置发生。如果公司更重地转向具身项目，这一点尤其重要，因为具身项目会加快烧钱、放慢商业化。运营上，最重要的依赖是算力、数据权利、集成访问、潜在硬件伙伴，以及围绕首次担任
              CEO 的创始人吸引资深运营者的能力。因此，正确的风险立场不是 Pragmatik 注定失败，而是从一开始就要明确终止标准和里程碑纪律。
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
