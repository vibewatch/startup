              - CR038
      - number: '7.3'
        title: 监管、法律和地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              Pragmatik 是一家中国公司，又希望把智能体部署到数字环境、甚至潜在的物理环境里，因此监管和法律风险不低。中国 PIPL 以及更广泛的 AI
              规则环境，会影响个人数据、工业数据和模型输出如何被收集与处理。跨境商业野心可能触发 EU AI Act 问题、合同义务和特定行业客户尽调要求。智能体产品还会提出普通 AI
              副驾有时可以绕开的合同和法律问题：智能体动作由谁承担责任、能给出什么保证条款、日志和审计轨迹如何留存、客户数据如何隔离。如果公司日后触及具身或关键工业工作流，监管审查还会进一步升高。从地缘政治看，算力获取和先进芯片供应仍是中国任何前沿
              AI 公司的战略依赖。
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
          - type: table
            tableRef: TR001
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
      - number: '7.4'
        title: 团队、治理和组织风险
        blocks:
          - type: paragraph
            body: >-
              团队和治理风险已经摆在眼前，因为公开记录几乎全部围绕 Lin
              Junyang。他是一位很强的创始人，但也是产品愿景、技术领导、招聘、外部可信度以及可能的大客户关系中最大的集中点。公开信息看不到共同创始人、董事会构成或资深运营班底。年轻实验室如此并不反常，却让投资逻辑异常暴露在一个人的判断力和体力之下。第二个问题是组织设计：一家试图横跨数字工作流和物理智能体的公司，需要决定多少中央平台工作共享、多少工作转成领域专属。如果结构不清，早期招聘可能造出单个都很优秀、合起来却失焦的团队。治理不透明也意味着投资人还无法评估董事会权利、升级路径，或关键里程碑延误时会发生什么。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: table
