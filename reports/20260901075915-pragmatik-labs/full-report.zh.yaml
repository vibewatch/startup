      - number: '1.5'
        title: 公司阶段与里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2026-09-01 的运行日，Pragmatik Labs
              成立约五个月。公司处于深度研究模式：尚未发布产品、公布模型权重、宣布基准测试结果，也未披露客户或设计伙伴。公司网站（pragmatik.com）上线时只是一个极简落地页，描述研究方向，并列出 Lin
              Junyang 为创始人。

              当前运营状态符合顶级 AI 研究实验室第一年的样子。Anthropic 在 2021 年 9 月成立后隐身运作约 18 个月，才发布 Claude。OpenAI 最早几年也以研究发布为主，商业产品还在之后。考虑到
              $220M 融资，Pragmatik 的现金跑道以年计，而不是以月计。未来 12-18 个月最需要跟踪的指标，是公司是否拿出任何公开技术贡献——论文、模型发布或 GitHub 仓库——来验证创始人的基础设施逻辑。

              未知项很长：Lin Junyang
              之外的员工数未知；如果有联合创始人，其身份也未知；没有公开点名的联合创始人；没有发布产品、模型或研究论文；资金用途未披露；治理文件和股东条款不公开；也没有披露客户管线、意向书或战略合作。这些缺口对一家成立五个月的隐身研究公司来说正常，但也意味着当前尽调图景几乎完全是在押注
              Lin Junyang 的个人履历。

