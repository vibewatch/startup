      - number: '2.4'
        title: 增长驱动、信任摩擦与采用约束
        blocks:
          - type: paragraph
            body: >-
              智能体系统的采用理由很强，因为多股长期力量同时对齐：模型质量在提升，编排工具在成熟，人工和服务成本仍高，买方也越来越想要能真正干活的软件，而不只是辅助生成文本。约束也不是表面问题。买方担心幻觉、静默失败、权限蔓延、数据泄露和可审计性。切换成本同样真实，因为智能体产品必须嵌入既有记录系统并继承企业控制，才可能替代人工劳动。Pragmatik
              这类中国公司做跨境部署，还会遇到数据所在地和合规摩擦；物理智能体野心又增加了安全、资本强度和更慢的现场部署循环。竞争噪音是一把双刃剑：OpenAI、Anthropic、Google、Manus、Figure
              等玩家在教育市场，但也抬高了可靠性预期，并压缩后来者建立差异化平台的时间。
