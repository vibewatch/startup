              财务证据质量分化明显。关于融资存在及大致规模，多个新闻报道和投资方信号相互印证，置信度高。关于运营指标，公开域几乎没有任何数据，置信度低。因此，严肃的财务尽调应从资料清单开始，而不是从电子表格模型开始。首批应索取项目包括：交割时现金余额和当前现金余额、按类别拆分的月度和季度烧钱、员工数和薪酬计划、期权池和归属、算力合同、任何债务或设备承诺、商业化时间表、定价实验、试点预算，以及基于里程碑的融资计划。公共云文件、基础设施
