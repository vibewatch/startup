      - number: '1.3'
        title: 研究逻辑与智能体思维
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang 于 2026 年 3 月 26 日在 justinlin610.github.io 发布的基础文章「From Reasoning Thinking to Agentic
              Thinking」，构成了公司的完整战略逻辑。文章认为，大模型投资的第一波由推理思维主导——在数学、代码等答案封闭的问题上扩大 RL，训练出会“先思考再回答”的模型。Lin
              认为，下一波是智能体思维：模型为了行动而思考，并被嵌入真实世界环境，接入工具、反馈环和多步骤任务周期。

              Lin 提出 Pragmatik 想解决三类核心技术挑战。第一，智能体 RL 基础设施从根本上比经典推理 RL
              更难，因为策略被嵌入更大的外层执行框架——工具服务器、浏览器、模拟器、执行沙箱——如果没有清晰的训练与服务解耦，rollout
              吞吐会塌掉。第二，环境设计变成一等研究产物：训练环境必须稳定、真实、抗利用且足够多样，才能防止模型钻奖励函数空子；一旦模型能调用工具，这种风险远高于封闭式推理。第三，多智能体协同需要新的架构模式：编排器、专用子智能体，以及规划层和执行层之间有原则的接口边界。

              这不是对现有框架的小修小补。Lin 的逻辑是，当前一代智能体框架（LangChain、CrewAI、AutoGen、OpenAI
              Swarm）增加了抽象层，却没有解决底层基础设施问题；任何人要打造可靠的生产级智能体，都必须先走研究优先路线。这把 Pragmatik 定位成深度研究实验室，而不是应用封装层。
