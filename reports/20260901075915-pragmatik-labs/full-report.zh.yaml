            body: >-
              Pragmatik 没有披露收入，因此无法用 burn multiple、CAC
              回本周期或净留存率等常规软件指标判断资本效率。真正的问题只有一个：现有现金是否足以支撑下一次融资事件所需的里程碑。如果按软件优先路线理解，$220M
              余额可以支持一支小型前沿研究团队和可观算力运行数年。如果按更偏具身的路线理解，当公司扩张到机器人合作、数据采集项目和漫长现场验证周期时，同一笔资金会很快缩水。因此，不能把头部轮次规模误读成无限战略自由。相对种子期同行，资本充足度很强；但相对全球
              AI 实验室正在展开的前沿基础设施竞赛，它又算不上夸张。下一轮融资触发点很可能不是 ARR 规模，而是产品演示、招聘成功、算力获取，以及设计伙伴证明研究逻辑能转化为可部署系统。
