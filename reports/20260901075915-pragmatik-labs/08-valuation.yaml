      type: inferred
      topic: scenarios
      sourceRefs: [SV014, SV015, SV016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV011, QV017]
    - id: CV020
      statement: The base branch assumes a credible first product and some early customer validation, but not category dominance.
      type: inferred
      topic: scenarios
      sourceRefs: [SV018, SV019, SV025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV012, QV023]
    - id: CV021
      statement: The bull branch assumes Pragmatik converts founder pedigree into a durable systems advantage and meaningful customer proof.
      type: inferred
      topic: scenarios
      sourceRefs: [SV018, SV020, SV025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV013, QV021]
    - id: CV022
      statement: Execution probability should be reflected as a probability haircut on each milestone branch rather than as a false-precision discount rate.
      type: inferred
      topic: intrinsic
      sourceRefs: [SV014, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV014]
    - id: CV023
      statement: The current mark is easiest to justify only under a branch where proof arrives relatively quickly.
      type: inferred
      topic: scenarios
      sourceRefs: [SV015, SV016, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV013, QV021]
    - id: CV024
      statement: Without timely proof, downside valuation compression can be large even if the category remains exciting.
      type: inferred
      topic: scenarios
      sourceRefs: [SV014, SV017, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV011, QV017]
    - id: CV025
      statement: Product-proof timing is the single most important variable in Pragmatik's valuation sensitivity.
      type: inferred
      topic: sensitivity
      sourceRefs: [SV014, SV015, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV015, QV016]
    - id: CV026
      statement: Customer-proof timing is nearly as important as product-proof timing because the valuation depends on evidence of monetizable demand.
