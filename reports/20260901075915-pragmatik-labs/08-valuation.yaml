  claims:
    - id: CV001
      statement: Pragmatik's public valuation context starts with a reported roughly $2 billion post-money angel round.
      type: third-party-reported
      topic: current-valuation
      sourceRefs: [SV001, SV002]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV001]
    - id: CV002
      statement: Public evidence shows no product, customer, or revenue proof that would normally anchor such a valuation.
      type: observed
      topic: proof-gap
      sourceRefs: [SV001, SV002, SV003]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV001, QV020]
    - id: CV003
      statement: The most relevant comparable set for Pragmatik is private frontier and embodied AI companies rather than ordinary SaaS startups.
      type: inferred
      topic: comps
      sourceRefs: [SV005, SV007, SV008, SV010, SV012]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002, QV003]
    - id: CV004
      statement: Public frontier-AI financings demonstrate that the market is willing to price strategic scarcity aggressively.
      type: third-party-reported
      topic: market-based
      sourceRefs: [SV005, SV006, SV007, SV010]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV004]
    - id: CV005
      statement: Pragmatik's current mark prices founder quality and future strategic optionality more than present-day fundamentals.
      type: inferred
      topic: founder-premium
      sourceRefs: [SV001, SV002, SV014, SV015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV005]
    - id: CV006
      statement: Compared with a typical pre-product software startup, a $2 billion angel-stage valuation is extreme.
      type: inferred
      topic: founder-premium
      sourceRefs: [SV014, SV015, SV016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV006]
    - id: CV007
      statement: Compared with frontier AI scarcity financings, the valuation is understandable in absolute terms even if proof remains thin.
      type: inferred
      topic: comps
      sourceRefs: [SV005, SV006, SV007]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV004]
    - id: CV008
      statement: Pragmatik should therefore be valued with both a comparable-transaction premium and a proof discount.
      type: inferred
      topic: methodology
      sourceRefs: [SV003, SV014, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV005]
    - id: CV009
      statement: Anthropic, Mistral, Figure AI, Skild AI, Physical Intelligence, and OpenAI form the most useful public comparable frame.
      type: inferred
      topic: comps
      sourceRefs: [SV005, SV007, SV008, SV010, SV012, SV026]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV002]
    - id: CV010
      statement: A founder premium is justified when a scarce technical leader enters a strategically important category.
      type: inferred
      topic: founder-premium
      sourceRefs: [SV018, SV019, SV025]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV005]
    - id: CV011
      statement: Figure AI and Physical Intelligence are especially relevant because they translate AI ambition into embodied-system valuation context.
      type: inferred
      topic: embodied-comps
      sourceRefs: [SV008, SV009, SV012, SV013]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV008]
    - id: CV012
      statement: Mistral is relevant because it shows how regional sovereignty narratives can support strong AI valuations outside the largest US labs.
      type: third-party-reported
      topic: sovereignty-comps
      sourceRefs: [SV007]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV008]
    - id: CV013
      statement: OpenAI and Anthropic are more mature than Pragmatik and therefore function more as upper-bound scarcity anchors than as true peers.
      type: inferred
      topic: comp-limits
      sourceRefs: [SV005, SV026, SV027]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV003, QV004]
    - id: CV014
      statement: Public filings from CoreWeave, Amazon, Tencent, and other public companies provide disclosure and capital-intensity benchmarks that Pragmatik itself lacks.
      type: third-party-reported
      topic: filing-anchors
      sourceRefs: [SV004, SV022, SV023, SV024]
      confidence: high
      freshness: current
      answersQuestionRefs: [QV007]
    - id: CV015
      statement: The market-based question is no longer whether a $2 billion round is possible, but whether it remains investable for a new entrant at the same mark.
      type: inferred
      topic: current-valuation
      sourceRefs: [SV014, SV015, SV016]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV006]
    - id: CV016
      statement: On public evidence alone, the round looks strategically plausible but financially hard to underwrite without a proof discount.
      type: inferred
      topic: current-valuation
      sourceRefs: [SV001, SV002, SV014, SV029]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QV005, QV020]
    - id: CV017
      statement: A classical DCF is not meaningful for Pragmatik because no current revenue stream exists to discount.
