      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Anthropic
        - Frontier AI platform with major strategic partners
        - $380B post-money (reported official round)
        - Shows market willingness to price frontier AI aggressively
        - Much larger scale, product proof, and enterprise traction
      - - Mistral
        - Frontier model and platform company
        - $14B valuation (reported)
        - Regional sovereignty and enterprise-AI comparable
        - More product proof and European positioning
      - - Figure AI
        - Embodied AI / humanoid systems
        - $39B valuation (reported)
        - Physical-agent comp for long-run ambition
        - Hardware component and different capital stack
      - - Skild AI
        - General-purpose robotic brain / embodied AI
        - $14B valuation (reported)
        - Helpful embodied and platform-style comp
        - More visibly tied to robotics category and separate timing
      - - Physical Intelligence
        - Robot foundation model / embodied AI
        - Multi-billion private valuation (reported)
        - Conceptual peer on software-for-embodiment thesis
        - Different disclosed proof set and partnership context
      - - OpenAI
        - Frontier AI platform benchmark
        - Revenue and capital benchmark, not a true stage peer
        - Frames upper boundary of frontier-AI strategic scarcity
        - Vastly different scale and maturity
    notes: >-
      Comparables are relevance anchors, not clean trading comps. Pragmatik's stage and proof profile
      make direct multiple transfer unreliable.
    enumerationScope:
      coverage: exhaustive
      basis: >-
        The table includes every major public private-market comp repeatedly used to frame frontier AI
        or embodied AI valuation context most relevant to Pragmatik's thesis and stage.
    claimRefs:
      - CV003
      - CV009
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - No public product artifact
        - No credible demo, API, or benchmark within planned milestone window
        - Weakens thesis that founder edge is compounding into product
        - Reduce valuation confidence sharply
      - - No design-partner traction
        - No credible customer proof after initial product milestone
        - Weakens demand and GTM assumptions
        - Treat valuation as narrative-only
      - - Burn accelerates without proof
        - Higher spend with no customer or product milestone
        - Raises dilution and financing risk
        - Apply larger downside haircut
      - - Governance opacity persists
        - No board or cap table clarity in diligence
        - Raises downside protection concerns
        - Demand structural protections or pass
      - - Market sentiment cools
        - Frontier AI multiples compress materially
        - Removes scarcity premium
        - Reprice with stronger proof discount
    notes: >-
      Triggers convert abstract uncertainty into monitorable events that can change the valuation
      stance quickly.
    claimRefs:
      - CV026
      - CV027
      - CV031
      - CV036
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Product proof
        - Demo, benchmark, or API access
        - Most direct reducer of proof discount
        - Product and technical diligence
      - - Customer proof
        - Design partners, pilots, and paid budgets
        - Converts market thesis into monetization probability
        - Customer diligence
      - - Capital plan
        - Current cash, burn, and next-round trigger
        - Determines dilution and survival path
        - Financial diligence
      - - Cap table and terms
        - Rights, preferences, board seats
        - Needed for downside and control analysis
        - Legal and financing diligence
      - - Compute and infrastructure
        - Supply commitments and cost profile
        - Shapes capital intensity and roadmap speed
        - Technical and financial diligence
    notes: >-
      Each item above would materially narrow the range between the bull, base, and bear branches.
    claimRefs:
      - CV020
      - CV021
      - CV028
      - CV037
      - CV040
