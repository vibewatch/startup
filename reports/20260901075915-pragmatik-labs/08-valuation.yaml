        - Public product proof and first customer references would strengthen the positive case
      - - Large starting capital base can fund a real frontier push
        - Evidence of burn discipline and milestone sequencing would improve confidence
      - - Dual digital-plus-physical thesis creates large upside optionality
        - A narrower first wedge would reduce execution discount
      - - No public product, revenue, or customer proof makes current price hard to underwrite
        - API, benchmark, or paid pilot disclosure would reduce the proof discount
      - - Future dilution and capital intensity remain uncertain
        - Cap table, terms, and compute plan would narrow downside uncertainty
    notes: >-
      The thesis is strongest on founder and category; the anti-thesis is strongest on proof and
      operating opacity.
    claimRefs:
      - CV001
      - CV010
      - CV018
      - CV030
      - CV036
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Pragmatik ships a clear wedge, recruits elite team, wins early design partners, and preserves frontier narrative
        - Current round looks cheap versus future strategic value
        - Competition and execution still matter
        - Low but real
      - - Base
        - Company shows partial proof but not category dominance and raises again before major revenue
        - Current round can be defended only weakly without internal edge
        - Dilution and slower proof
        - Most likely
      - - Bear
        - Product proof is slow, burn rises, and financing sentiment cools
        - Effective value compresses below current mark
        - No wedge, no traction, high burn
        - Material
    notes: >-
      Scenarios are milestone-driven because conventional DCF inputs do not yet exist.
