  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Actual cap table, option pool, secondary sales, and investor rights.
      whyItMatters: >-
        The public mark says little about downside protection or future dilution without the underlying
        financing structure.
      diligencePath: Review financing docs and cap table.
      relatedQuestionRefs: [QV025]
    - type: private-evidence-only
      severity: material
      topic: burn-plan
      missingEvidence: Current burn, compute commitments, and budgeted path to the next financing event.
      whyItMatters: >-
        Valuation sensitivity is heavily driven by how much capital must be consumed before proof
        arrives.
      diligencePath: Review budget, monthly burn, and supplier agreements.
      relatedQuestionRefs: [QV026, QV029]
    - type: missing-source
      severity: material
      topic: milestone-deadline
      missingEvidence: Public or private product-proof deadline with milestone owners.
      whyItMatters: >-
        Without a concrete timetable, investors cannot know when the current proof discount should
        tighten or when the thesis should be downgraded.
      diligencePath: Request roadmap with dates and accountable leaders.
      relatedQuestionRefs: [QV027]
    - type: missing-source
      severity: material
      topic: early-pilots
      missingEvidence: Any design-partner or pilot proof that already reduces the current proof discount.
      whyItMatters: >-
        Even limited customer proof would materially affect the valuation judgment at this stage.
      diligencePath: Review pipeline, pilot budgets, and customer references.
      relatedQuestionRefs: [QV028]
