callouts:
  - calloutType: recommendation
    title: Research-more is the highest-integrity stance at the public mark
    body: >-
      The recommendation is not a hedge; it is the result of strong upside potential colliding with a
      lack of product and customer proof at a very high starting valuation.
    claimRefs:
      - CV033
      - CV039
      - CV040
  - calloutType: insight
    title: This valuation is an option on proof, not a reflection of current fundamentals
    body: >-
      Pragmatik's current mark prices founder quality, category timing, and future strategic value
      more than present-day economics. That can work spectacularly or fail quickly.
    claimRefs:
      - CV005
      - CV017
      - CV031
  - calloutType: risk
    title: The round price becomes a burden if proof stays delayed
    body: >-
      A high early mark can strengthen momentum, but it can also raise the bar for every subsequent
      financing and make middling progress look like failure.
    claimRefs:
      - CV027
      - CV035
      - CV038
