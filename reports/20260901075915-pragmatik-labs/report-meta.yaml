companyProfile:
  summary: >-
    Pragmatik Labs (p7k, 语用科技) is a Shanghai-based AI agent research startup founded in
    March 2026 by Lin Junyang, the former technical lead of Alibaba's Tongyi Qwen LLM series
    and the youngest P10-level engineer in Alibaba's history. The company raised $220 million
    in an angel round in August 2026 at a ~$2 billion post-money valuation, co-led by Gaorong
    Ventures and HongShan (Sequoia China), with Tencent and the Shanghai Future Industry Fund
    as additional backers. Pragmatik is building next-generation AI agents across digital workflows
    and physical embodied intelligence. As of the report date, no product, model, or research
    paper has been released.
  foundedDate: '2026-03-01'
  founders:
    - name: Lin Junyang
      role: Founder & CEO
      background: >-
        Former Alibaba Tongyi Qwen P10 tech lead; co-author of Qwen3 Technical Report;
        youngest P10-level engineer at Alibaba; MA Foreign Linguistics, Peking University.
      claimRefs: [CO007, CO010, CO013]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Research-phase AI agent company with no product released as of 2026-09-01. Research
    directions include general-purpose digital agents for knowledge work and industrial
    workflows, and physical agents for embodied intelligence and long-horizon real-world tasks.
    Founding thesis is that the agent era requires new agentic RL infrastructure, train-serve
    decoupling, environment design, and multi-agent coordination — not application wrappers.
  customerFocus: >-
    Enterprise knowledge workers, industrial automation operators, and long-horizon task
    completion use cases across digital and physical domains (target; no customers yet).
  businessModel: >-
    Not yet disclosed. Pre-revenue, pre-product research phase. Likely B2B API / platform
    licensing upon eventual product launch; inference and enterprise deployment fees anticipated.
  stage: Seed / Angel
  fundingStatus: >-
    $220M angel round at ~$2B valuation (August 2026). Co-led by Gaorong Ventures (~$100M)
    and HongShan (~$100M); Tencent ~$20M strategic; Shanghai Future Industry Fund (undisclosed).
  disclosureProfile: stealth
  claimRefs: [CO001, CO003, CO005, CO016, CO022]
summary:
