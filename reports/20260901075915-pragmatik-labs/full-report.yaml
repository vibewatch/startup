      - number: '2.2'
        title: Sizing with multiple lenses instead of one headline TAM
        blocks:
          - type: paragraph
            body: >-
              A single market-size citation is misleading for Pragmatik because the company sits at the intersection of
              several categories that analysts still separate: AI agents, enterprise AI applications, orchestration
              software, and embodied or physical AI. MarketsandMarkets provides a broad AI agent headline of $52.62
              billion by 2030 with 46.3% CAGR, while a16z and recent surveys argue the value pool spans application
              software, orchestration, and service replacement rather than model revenue alone. For Pragmatik, the
              useful sizing stack is layered. The broad TAM is global spend on agent software and related deployment
              services. The narrower SAM is enterprise knowledge-work, business-operations, and industrial workflow
              automation where an agent can take bounded action inside software environments. The near-term SOM is
              smaller still: a limited set of Chinese and multinational early adopters willing to run pilots with an
              unlaunched Shanghai startup led by a top-tier founder but without production references.
