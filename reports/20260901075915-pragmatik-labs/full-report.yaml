      - number: '7.2'
        title: Market and competitive risks
        blocks:
          - type: paragraph
            body: >-
              The market risk is not that AI agents lack promise; it is that the field is moving fast enough that a
              pre-product entrant can lose strategic room before it launches. Frontier labs and cloud vendors are
              already training buyers to expect better tooling, stronger compliance, and tighter integration, while the
              term "AI agents" itself remains broad enough to encourage category drift and overpromising. If Pragmatik
              launches too broadly, it risks competing everywhere and winning nowhere. If it launches too narrowly, it
              may not justify the scale of the initial financing or the valuation expectations attached to it. Adjacent
              embodied AI excitement in China is helpful for awareness but can also intensify talent competition and
              inflate customer expectations. A serious market-risk read therefore has to consider not only
              product-market fit but also narrative-market fit: the company must choose a wedge that the market
              understands and values before hype or competitor bundling outruns it.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
