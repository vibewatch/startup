          - type: callout
            title: Broad ambition is both the thesis and the hazard
            body: >-
              The company's digital-plus-physical framing is strategically exciting, but it also creates a higher risk
              of roadmap sprawl and delayed proof than a narrow application wedge would.
            calloutType: insight
