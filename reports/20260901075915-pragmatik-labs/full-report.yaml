  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology and execution risks
        blocks:
          - type: paragraph
            body: >-
              Pragmatik's biggest near-term risk is execution against an unusually broad technical ambition. Digital
              agents already remain fragile on long-horizon tasks, tool use, hidden state management, and evaluation
              discipline. Physical agents add another layer of risk around sensing, safety, real-world data, and
              deployment latency. Publicly, Pragmatik has not yet released a product, benchmark, API, or trust-control
              framework, so external observers cannot judge whether the team has converted the founder thesis into a
              working operating system for agent reliability. This is not a marginal issue: for agent companies, subtle
              product failures can destroy trust far faster than they destroy demo appeal. A company trying to bridge
              both digital and physical domains also risks roadmap sprawl, where too many hard problems are pursued
              simultaneously and none reach a production threshold quickly enough to validate the business.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
