      - number: '7.3'
        title: Regulatory, legal, and geopolitical risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is meaningful because Pragmatik is a China-based company that aspires to agent
              deployments across digital and potentially physical environments. The China PIPL and broader AI-rule
              environment affect how personal data, industrial data, and model outputs can be collected and processed.
              Cross-border commercial ambitions can trigger EU AI Act concerns, contract obligations, and
              sector-specific customer diligence requirements. Agent products also raise contractual and legal questions
              that ordinary copilots can sometimes avoid: who bears liability for an agent action, what warranties are
              feasible, how logs and audit trails are retained, and how customer data is isolated. If the company later
              touches embodied or critical industrial workflows, regulatory scrutiny can increase further.
              Geopolitically, compute access and advanced-chip supply remain strategic dependencies for any frontier AI
              company in China.
            claimRefs:
              - CR017
