  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Pragmatik Labs is not "all AI" and not even "all generative AI." Public company
              materials and Lin Junyang's essay point to a narrower but more consequential market boundary: software
              systems that can perceive context, call tools, coordinate steps, and act over time in order to complete
              business or real-world tasks. Inside that boundary sit digital agents for research, operations, support,
              internal workflow execution, and industrial coordination; adjacent but partially excluded spend includes
              standalone chatbot seats, model API usage without workflow autonomy, and pure robotics hardware revenue.
              The practical substitute set today is large and explains why adoption will be gradual: enterprises still
              solve these jobs with offshore services, BPO, RPA scripts, workflow SaaS, systems integrators, and highly
              manual analyst operations. Pragmatik therefore competes both against emerging agent platforms and against
              the status quo operating model that absorbs labor through people plus legacy software.
            claimRefs:
