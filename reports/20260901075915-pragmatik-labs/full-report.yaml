      - number: '1.3'
        title: Research Thesis and Agentic Thinking
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang's foundational essay "From Reasoning Thinking to Agentic Thinking," published March 26, 2026
              at justinlin610.github.io, frames the company's entire strategic thesis. The essay argues that the first
              wave of large model investment was dominated by reasoning thinking — scaling RL on closed-form problems
              like math and code, producing models that "think before answering." The next wave, Lin argues, is agentic
              thinking: models that think in order to act, embedded inside real-world environments with tools, feedback
              loops, and multi-step task horizons.

              Lin identifies three core technical challenges that Pragmatik aims to solve. First, agentic RL
              infrastructure is fundamentally harder than classical reasoning RL because the policy is embedded in a
              larger harness — tool servers, browsers, simulators, execution sandboxes — making rollout throughput
              collapse without clean train-serve decoupling. Second, environment design becomes a first-class research
              artifact: the training environment must be stable, realistic, exploit-resistant, and diverse enough to
              prevent reward hacking, which is far more dangerous with tool access than in closed-form reasoning. Third,
              multi-agent coordination requires new architectural patterns: orchestrators, specialized sub-agents, and
              principled interfaces between planning and execution layers.

              These are not incremental improvements to existing frameworks. Lin's thesis is that the current generation
              of agent frameworks (LangChain, CrewAI, AutoGen, OpenAI Swarm) add abstraction without solving the
              fundamental infrastructure problems, and that a research-first approach is necessary before anyone can
              build reliable production agents. This positions Pragmatik as a deep-research lab, not an application
              wrapper.
