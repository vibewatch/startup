      - number: '3.4'
        title: Moats, entry barriers, and likely countermoves
        blocks:
          - type: paragraph
            body: >-
              In agent markets, moats rarely begin with raw model quality alone. Durable advantages usually come from
              distribution, integration depth, proprietary workflow data, evaluation infrastructure, developer ecosystem
              gravity, or a hardware-software loop that newcomers cannot cheaply copy. Today Pragmatik does not yet have
              public evidence of any of those except founder reputation and access to capital. That still matters: a
              founder with frontier-model lineage can recruit talent and open doors with early design partners faster
              than an unknown team can. But it is not enough against incumbents that can bundle agents into existing
              contracts, discount pricing, extend free credits, or route traffic through compliant enterprise platforms.
              If Pragmatik tries to compete broadly, it risks being squeezed between well-capitalized frontier platforms
              and faster product-layer startups. Its most plausible moat path is to own a narrow system problem that
              stronger incumbents do not solve elegantly, then compound data and workflow lock-in from there.
