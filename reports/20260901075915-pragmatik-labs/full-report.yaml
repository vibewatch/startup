  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape map
        blocks:
          - type: paragraph
            body: >-
              Pragmatik's competitive set cannot be reduced to one peer list because the company publicly spans both
              digital and physical agents. On the digital side, the direct reference set includes OpenAI, Anthropic,
              Google, Manus, and Mistral, each of which is already offering some combination of models, workflow
              tooling, enterprise controls, or user-facing agent products. On the physical side, Figure AI and Physical
              Intelligence are the clearest conceptual peers because they connect foundation-model style reasoning to
              real-world action. Indirect competition comes from Microsoft, AWS, and Meta-aligned ecosystems that can
              bundle agent capabilities into broader software or infrastructure suites. The practical lesson is that
              Pragmatik is not merely racing other startups; it is entering a stack where incumbents control
              distribution, compliance postures, enterprise trust, developer mindshare, and in several cases the
              underlying models themselves. The company therefore needs a wedge that matters on workflow outcomes, not
              just a general claim to build agents.
