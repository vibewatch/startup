      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The highest immediate risk is still absence of product proof
            body: >-
              Regulatory and capital risks matter, but the main risk remains simpler: Pragmatik has not yet shown an
              external product artifact that validates execution against its ambitious thesis.
            calloutType: risk
            claimRefs:
              - CR001
