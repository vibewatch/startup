      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Pragmatik's buyer map is likely to be heterogeneous because "agent" products cut across several budget
              owners. In digital workflows, the economic buyer is usually a CIO, COO, head of shared services, or
              functional leader responsible for cost, throughput, or error reduction; the daily user may be an
              operations analyst, knowledge worker, dispatcher, or engineer; the payer can sit in IT, operations, or
              transformation budgets depending on deployment scope. In physical agent settings, the buyer shifts toward
              factory automation, industrial digitalization, robotics, or operations leaders, while users are
              supervisors and frontline teams. This distinction matters because adoption rarely starts as a
              corporate-wide platform sale. It normally begins with one workflow, one tool chain, or one site where ROI
              can be observed, then expands if reliability, governance, and integration burdens are acceptable.
              Pragmatik's lack of a public product means it still needs to pick which buyer segment becomes the entry
              wedge rather than selling the whole vision at once.
