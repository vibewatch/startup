      - number: '7.5'
        title: Financial and operational risks
        blocks:
          - type: paragraph
            body: >-
              Financial and operational risk follows from the mismatch between disclosed capital and undisclosed
              operating proof. A $220 million raise offers time, but it also creates pressure to show progress worthy of
              a very large starting valuation. If the company fails to ship a clear product, hire the right team, secure
              compute, or validate a design-partner wedge on a reasonable timeline, the next financing could happen from
              a weaker negotiating position. This is especially relevant if the company leans harder into embodied
              programs, which can accelerate burn and slow commercialization. Operationally, the most important
              dependencies are compute, data rights, integration access, possible hardware partners, and the ability to
              attract senior operators around a first-time CEO. The right risk stance is therefore not that Pragmatik is
              doomed, but that kill criteria and milestone discipline should be explicit from the start.
            claimRefs:
