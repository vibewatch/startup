      - number: '2.4'
        title: Growth drivers, trust frictions, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The adoption case for agent systems is strong because multiple secular forces line up at once: model
              quality is improving, orchestration tooling is maturing, labor and service costs remain high, and buyers
              increasingly want software that performs work rather than merely assisting with text generation. At the
              same time, the constraints are not cosmetic. Buyers worry about hallucinations, silent failure,
              permissions sprawl, data leakage, and auditability. Switching cost is also real because an agent product
              must sit inside existing systems of record and inherit enterprise controls before it can replace manual
              labor. For China-based companies like Pragmatik, cross-border deployments introduce another layer of
              friction around data location and compliance, while physical-agent ambitions add safety, capital
              intensity, and slower field deployment loops. Competitive noise is a double-edged sword: OpenAI,
              Anthropic, Google, Manus, Figure, and others educate the market, but they also raise expectations for
              reliability and compress time available for a newcomer to establish a differentiated platform.
            claimRefs:
