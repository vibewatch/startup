              right starting point is a null model: revenue today is effectively zero, and any forward revenue bridge
              must be hypothetical. Still, the likely monetization paths are legible from the market: software
              subscriptions for bounded workflow agents, usage-based or task-based pricing for delegated execution,
              platform licensing for orchestration or control layers, and potentially higher-touch deployment services
              for enterprise or industrial environments. The absence of public pricing is itself informative because it
