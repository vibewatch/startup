chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Mission
        blocks:
          - type: paragraph
            body: >-
              Pragmatik Labs, stylised as p7k (a compression of the nine-letter word "pragmatik"), was incorporated in
              Shanghai, China in approximately March 2026. The company's English name derives from "pragmatics," the
              linguistic study of how context shapes meaning, chosen by founder Lin Junyang who holds a master's degree
              in Foreign Linguistics. On the company's launch announcement, Lin explained that the name means "returning
              to the place where everything really happens" and points to pragmaticism as the direction he believes AGI
              should pursue.

              The public product brief published at pragmatik.com at launch divides the company's research direction
              into four areas: (1) general-purpose Digital Agents for knowledge work, business operations, and
              industrial-level workflows; (2) Physical Agents — embodied intelligence that can adapt to environments,
              take actions, and complete long-horizon tasks in the real world; (3) a research-to-product feedback loop
              that shapes each research direction through real-world signals; and (4) long-term scientific exploration
              to build systems that break existing paradigms and accelerate scientific progress.

              At the run date of 2026-09-01, Pragmatik Labs had released no product, announced no customers, and
              published no model weights or benchmark results. The company is in deep research mode, consistent with a
              founding team coming directly from one of the world's top LLM programmes. The strategic choice to operate
              in stealth with a research-first posture mirrors Anthropic's early approach and reflects the founder's
              conviction that the agent era requires new training and infrastructure primitives, not just application
              wrappers.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: Founder Lin Junyang
        blocks:
          - type: paragraph
            body: >-
              Lin Junyang (Justin Lin, 林俊旸), born 1993, is the sole publicly disclosed founder of Pragmatik Labs. His
              academic background is unusually deep in language: he completed his undergraduate studies in the English
              department of the University of International Relations, where he also studied Japanese, Russian, German,
              and French, then earned a master's degree in Foreign Linguistics and Applied Linguistics from Peking
              University, graduating in 2019.

              After graduating, Lin joined Alibaba's Damo Academy as a senior algorithm engineer in NLP research. He
              quickly rose through Alibaba's internal ranking system: by end of 2022, when Alibaba merged its AI teams
              into the Tongyi Lab, Lin took over the Tongyi Qwen series as technical lead. Under his leadership, the
              Qwen family grew from an internal project into one of the world's most downloaded open-source LLM series,
              with hundreds of thousands of monthly active developers and multiple state-of-the-art benchmark
              achievements. In August 2024, after the prior Qwen lead Zhou Chang departed for ByteDance, Lin was
              promoted to P9; in May 2025, with the Qwen3 release, he became the youngest P10-level technical lead in
              Alibaba's history. In October 2025 he personally set up a robotics and embodied intelligence team inside
              Qwen before departing in early March 2026 to found Pragmatik Labs.

              Lin is a first-time CEO with no prior company-building experience. His public persona is that of a deeply
              technical researcher who thinks carefully about long-term AI architecture. The "agentic thinking" blog
              essay published on March 26, 2026 — written before the company was publicly announced — is the clearest
              articulation of his founding thesis: that the next wave of AI value creation comes not from more capable
              models alone, but from models embedded in environments that can perceive, act, and receive feedback in the
              real world.
