      - number: '1.4'
        title: Funding and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Pragmatik Labs raised approximately $220 million in an angel round, announced publicly on August 12, 2026.
              The round was co-led by Gaorong Ventures and HongShan (Sequoia China), each contributing approximately
              $100 million. Tencent invested approximately $20 million as a strategic backer. The Shanghai Future
              Industry Fund — a government-backed fund focused on advanced technology and industrial transformation —
              provided additional support; the amount was not disclosed.

              At the angel round, external investors collectively hold approximately 12% of the company, with Lin
              Junyang retaining a controlling stake estimated at approximately 88%. The $220 million post-money
              valuation of $2 billion represents a conviction bet on founder pedigree at an extremely early stage — the
              company had no product and had been in existence for approximately five months when the round was
              announced.

              Gaorong Ventures (高榕创投) is a major Chinese early-stage VC firm that has backed companies including Alibaba
              and Bytedance at early stages. HongShan (红杉中国) is the rebranded name for Sequoia China, which separated
              from the global Sequoia brand in 2023 and has one of the deepest track records in Chinese technology
              investing. Tencent's participation adds a major strategic dimension: as China's largest social and gaming
              company, Tencent has both distribution channels and enterprise relationships that could be relevant to
              Pragmatik's agent platform.
