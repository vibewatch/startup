        title: Technical risks, limitations, and failure modes
        blocks:
          - type: paragraph
            body: >-
              The most important technical risks are exactly the places where agent systems remain fragile. Long-horizon
              execution drifts, tool misuse, unreliable planning, hidden state errors, and weak evaluation can make an
              apparently impressive demo fail in production. These risks are magnified if Pragmatik moves into physical
              agents, where safety, sensing, control latency, and embodied data scarcity create failure modes that pure
              software products do not face. Even on the digital side, production agents need guardrails, rollback
              paths, auditability, permissions boundaries, and operator handoff design. Public ecosystem sources show
              how these concerns have become design primitives for serious agent builders. Pragmatik likely understands
              this intellectually given the founder's background, but there is no public evidence yet that the company
              has built the necessary evaluation, observability, or trust controls into a product surface.
