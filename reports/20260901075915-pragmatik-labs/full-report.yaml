        title: Direct substitutes, indirect substitutes, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Buyers evaluating Pragmatik will compare it against more than frontier labs. The direct substitute set
              includes general-purpose enterprise agent platforms, agent-enabled model APIs, workflow orchestration
              frameworks, and China-native autonomous task products. The indirect substitute set includes Microsoft 365
              Copilot style bundles, AWS Bedrock and Amazon Q, Google Workspace and Cloud offerings, and even
              multi-model routers that reduce lock-in to any single vendor. Switching costs emerge only after a buyer
              has integrated agents into systems of record, permissions, evaluation loops, and human approval chains.
              That matters because Pragmatik currently has no public product, which means it cannot yet claim the
              installed-base advantages that incumbents already possess. Its challenge is to create enough
              differentiated workflow value that a buyer will accept the setup and governance cost of adopting a new
              vendor rather than extending an existing cloud or productivity relationship.
