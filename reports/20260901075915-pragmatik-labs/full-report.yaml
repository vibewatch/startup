            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV029
              - CV031
      - number: '8.3'
        title: Intrinsic and milestone-based reasoning
        blocks:
          - type: paragraph
            body: >-
              A classical DCF is not truly meaningful for Pragmatik because there is no observed revenue stream to
              discount. The closest intrinsic approach is milestone-weighted option value: what is the present value of
              a company that could become an important agent systems platform if it ships a wedge, recruits a top team,
              secures compute, wins design partners, and survives a crowded competitive field? That structure still
              allows disciplined reasoning. The bear case assumes the company fails to convert narrative into product
              proof and ends up raising again from a weaker position. The base case assumes a successful first product
              and credible early customer validation, but not category leadership. The bull case assumes Pragmatik turns
              founder pedigree into a durable systems advantage across high-value workflows and possibly embodied
              extensions. Because each branch is contingent on milestones rather than current cash flow, the correct
              discount rate is effectively a probability haircut on execution, not a spreadsheet purity exercise.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: table
            tableRef: TV003
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV024
      - number: '8.4'
        title: Bull, base, bear, and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Valuation sensitivity is highest on a small set of variables: how quickly Pragmatik produces a real
              product artifact, whether it can show initial customer proof, how much additional capital will be required
              before meaningful revenue, and whether the market continues to reward frontier agent narratives at current
              multiples. Revenue timing matters, but proof timing matters even more. A company that demonstrates a clear
              wedge, credible pilot conversion, and strong hiring can preserve or grow a high early valuation without
              much near-term revenue. A company that delays proof while expanding burn can see its effective value
              compress quickly, even if the narrative remains exciting. For this reason, scenario analysis is more
              informative than point estimates. The current round price can still be rational under a bull branch; under
              the base and bear branches, it becomes progressively harder to defend without more evidence.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
          - type: table
            tableRef: TV005
            claimRefs:
              - CV026
              - CV027
              - CV031
              - CV036
              - CV038
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV025
              - CV033
      - number: '8.5'
        title: Valuation verdict and core uncertainty
        blocks:
          - type: paragraph
            body: >-
              The valuation verdict is not that Pragmatik is uninvestable; it is that the current public evidence
              supports a strong founder and market thesis more clearly than it supports the round price. For an existing
              insider or strategic backer, paying for optionality may be rational. For a new investor relying only on
              public information, the current mark appears stretched unless it comes with privileged access, internal
              diligence, or differentiated strategic value. The most important uncertainty is sequencing: if Pragmatik
              produces early product and customer proof, the valuation can look farsighted. If it stays thesis-heavy and
              proof-light for too long, the $2 billion mark can become an anchor that hinders future financing rather
              than a signal of strength. That is why the recommendation here tilts toward research-more rather than an
              outright buy or avoid call.
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV020
              - CV021
              - CV028
              - CV037
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more is the highest-integrity stance at the public mark
            body: >-
              The recommendation is not a hedge; it is the result of strong upside potential colliding with a lack of
              product and customer proof at a very high starting valuation.
            calloutType: recommendation
            claimRefs:
              - CV033
              - CV039
              - CV040
          - type: callout
            title: This valuation is an option on proof, not a reflection of current fundamentals
            body: >-
              Pragmatik's current mark prices founder quality, category timing, and future strategic value more than
              present-day economics. That can work spectacularly or fail quickly.
            calloutType: insight
            claimRefs:
              - CV005
              - CV017
              - CV031
          - type: callout
            title: The round price becomes a burden if proof stays delayed
            body: >-
              A high early mark can strengthen momentum, but it can also raise the bar for every subsequent financing
              and make middling progress look like failure.
            calloutType: risk
            claimRefs:
              - CV027
              - CV035
              - CV038
