      - number: '6.5'
        title: Evidence gaps and what traction diligence should request
        blocks:
          - type: paragraph
            body: >-
              The main traction diligence gap is simple: there is no public named customer or design-partner evidence
              for Pragmatik Labs. That makes almost every traditional customer metric unavailable: logo count, pipeline
              stage, ACV, renewal rate, NRR, churn, deployment duration, and implementation burden. The correct
              diligence response is to request a structured demand packet: current pipeline by stage, pilot LOIs,
              design-partner names, use-case descriptions, workflow economics, deployment timeline, paid versus unpaid
              pilots, and any user-observation notes from internal experiments. Without that, investors are effectively
              underwriting demand by analogy. The analogy may be reasonable given the founder and the market's interest
              in agent systems, but it is still analogy, not proof. For a pre-product company, that distinction should
              stay visible in every traction discussion.
            claimRefs:
