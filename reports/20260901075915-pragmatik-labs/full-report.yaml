      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction today is mostly latent demand, not converted demand
            body: >-
              The financing round and founder reputation show that sophisticated stakeholders believe demand could
              exist, but public evidence has not yet moved from attention into observable customer proof.
            calloutType: insight
            claimRefs:
