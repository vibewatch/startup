      - number: '7.4'
        title: Team, governance, and organizational risks
        blocks:
          - type: paragraph
            body: >-
              Team and governance risk is immediate because the public record still centers almost entirely on Lin
              Junyang. He is a very strong founder, but he is also the single largest concentration point across product
              vision, technical leadership, recruiting, external credibility, and likely major customer relationships.
              No co-founder, board composition, or senior operating bench is publicly visible. That can be normal in a
              young lab, yet it makes the investment case unusually exposed to one person's judgment and stamina. A
              second issue is organizational design: a company trying to span digital workflows and physical agents
              needs to decide how much central platform work is shared versus how much becomes domain-specific. Without
              a clear structure, early hiring can create teams that are individually excellent but collectively
              unfocused. Governance opacity also means investors cannot yet assess board rights, escalation paths, or
              what would happen if key milestones slip.
            claimRefs:
