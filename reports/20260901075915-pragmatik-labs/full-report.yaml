      - number: '2.5'
        title: What remains unknowable from public evidence
        blocks:
          - type: paragraph
            body: >-
              The largest diligence gap is not the top-line AI agent TAM; it is the absence of product-scope choices
              that would let an investor convert a broad category view into a real revenue model. Public sources do not
              yet reveal Pragmatik's first workflow, pricing basis, target vertical, deployment model, implementation
              burden, or whether the initial wedge is software-only, software-plus-services, or software paired with
              hardware partners. That means contradictory market narratives must be preserved rather than flattened. One
              narrative says the company can exploit a once-in-a-cycle platform shift and capture high-margin
              orchestration or agent-system spend. The competing narrative says "AI agents" is still an umbrella
              category with unstable definitions, unclear incumbency, and uncertain willingness-to-pay outside a handful
              of flagship pilots. Good diligence should therefore treat the market as promising but under-specified
              until Pragmatik chooses and ships an entry product.
