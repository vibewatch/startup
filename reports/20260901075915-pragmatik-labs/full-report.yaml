  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation context and comparable transactions
        blocks:
          - type: paragraph
            body: >-
              Pragmatik's starting point is unusual even by frontier AI standards: a reported angel round of roughly
              $220 million at about a $2 billion post-money valuation before a public product, public revenue, or
              customer references exist. That instantly places the company in the same discussion set as much more
              mature frontier-model or embodied-AI financings, even though the underlying evidence is thinner. The most
              relevant comparables are not traditional SaaS companies; they are private AI labs and embodied-AI startups
              where valuation has been driven by team quality, model ambition, capital intensity, and strategic
              scarcity. This is both helpful and dangerous. It helps because the market has shown a willingness to
              capitalize credible frontier teams early. It is dangerous because many of those comparables had stronger
              product proof, broader teams, or clearer strategic assets when their valuations were set. Pragmatik
              therefore deserves to be viewed through both comparable transactions and a proof-adjusted discount.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV004
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV033
              - CV040
      - number: '8.2'
        title: Market-based valuation lenses
        blocks:
          - type: paragraph
            body: >-
              A market-based valuation approach can start with private comparable financings and public-market
              disclosure anchors, but it should not pretend the inputs are cleaner than they are. Public frontier AI
              comps trade on very different mixes of revenue, compute access, distribution, and strategic optionality,
              while private rounds often reflect scarcity and momentum as much as cash flow logic. Pragmatik's round
              sits in that world. Compared with very large frontier rounds, the $2 billion mark is not absurd in
              absolute terms. Compared with a typical pre-product software company, it is obviously extreme. The right
              market-based question is therefore not whether the round is possible—it clearly was—but whether the
              current proof set justifies preserving that mark for a new investor. On the public evidence available
              today, the answer is only partially: the founder premium is real, but the proof discount should also be
              real.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
