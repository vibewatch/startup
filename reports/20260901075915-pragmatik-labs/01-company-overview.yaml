- id: company-stage-and-milestones
  title: Company Stage and Milestones
  body: >-
    As of the run date of 2026-09-01, Pragmatik Labs is approximately five months old. The company
    is in deep research mode: no product has been released, no model weights have been published,
    no benchmark results have been announced, and no customers or design partners have been disclosed.
    The company website (pragmatik.com) at launch was a minimal landing page describing the research
    directions and listing Lin Junyang as founder.

    The current operational state is consistent with a top-tier AI research lab in its first year.
    Anthropic operated in stealth for approximately 18 months after its September 2021 founding
    before releasing Claude. OpenAI's earliest years were primarily research publication before
    commercial products. Given the $220 million raise, Pragmatik has runway measured in years
    rather than months. The key metric to track over the next 12-18 months is whether the company
    makes any public technical contribution — a paper, a model release, a GitHub repository — that
    validates the founder's infrastructure thesis.

    The list of what is NOT known is extensive: headcount beyond Lin Junyang, co-founders if any,
    beyond Lin Junyang are unknown; no co-founder has been publicly named; no product, model, or
    research paper has been released; the use of funds has not been disclosed; governance documents
    and shareholder terms are not public; and there is no disclosed customer pipeline, letter of
    intent, or strategic partnership. These are normal gaps for a five-month-old stealth research
    company, but they mean that the current diligence picture is almost entirely a bet on Lin
    Junyang's personal track record.

    The milestone table below documents the full chronology of record from Lin's career through
    to the Pragmatik Labs announcement. The KPI snapshot table captures the current state of
    measurable indicators, with explicit gaps.
