- id: research-thesis-and-agentic-thinking
  title: Research Thesis and Agentic Thinking
  body: >-
    Lin Junyang's foundational essay "From Reasoning Thinking to Agentic Thinking," published
    March 26, 2026 at justinlin610.github.io, frames the company's entire strategic thesis.
    The essay argues that the first wave of large model investment was dominated by reasoning
    thinking — scaling RL on closed-form problems like math and code, producing models that
    "think before answering." The next wave, Lin argues, is agentic thinking: models that think
    in order to act, embedded inside real-world environments with tools, feedback loops, and
    multi-step task horizons.

    Lin identifies three core technical challenges that Pragmatik aims to solve. First, agentic
    RL infrastructure is fundamentally harder than classical reasoning RL because the policy is
    embedded in a larger harness — tool servers, browsers, simulators, execution sandboxes —
    making rollout throughput collapse without clean train-serve decoupling. Second, environment
    design becomes a first-class research artifact: the training environment must be stable,
    realistic, exploit-resistant, and diverse enough to prevent reward hacking, which is far more
    dangerous with tool access than in closed-form reasoning. Third, multi-agent coordination
    requires new architectural patterns: orchestrators, specialized sub-agents, and principled
    interfaces between planning and execution layers.

    These are not incremental improvements to existing frameworks. Lin's thesis is that the
    current generation of agent frameworks (LangChain, CrewAI, AutoGen, OpenAI Swarm) add
    abstraction without solving the fundamental infrastructure problems, and that a research-first
    approach is necessary before anyone can build reliable production agents. This positions
    Pragmatik as a deep-research lab, not an application wrapper.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO028
  - CO040
  - CO041
  - CO042
  tableRefs: []
  figureRefs:
  - FO002

- id: funding-and-investors
  title: Funding and Investor Base
  body: >-
    Pragmatik Labs raised approximately $220 million in an angel round, announced publicly on
    August 12, 2026. The round was co-led by Gaorong Ventures and HongShan (Sequoia China),
    each contributing approximately $100 million. Tencent invested approximately $20 million as
    a strategic backer. The Shanghai Future Industry Fund — a government-backed fund focused on
    advanced technology and industrial transformation — provided additional support; the amount
    was not disclosed.

    At the angel round, external investors collectively hold approximately 12% of the company,
    with Lin Junyang retaining a controlling stake estimated at approximately 88%. The $220 million
    post-money valuation of $2 billion represents a conviction bet on founder pedigree at an
    extremely early stage — the company had no product and had been in existence for approximately
    five months when the round was announced.

    Gaorong Ventures (高榕创投) is a major Chinese early-stage VC firm that has backed companies
    including Alibaba and Bytedance at early stages. HongShan (红杉中国) is the rebranded name
    for Sequoia China, which separated from the global Sequoia brand in 2023 and has one of the
    deepest track records in Chinese technology investing. Tencent's participation adds a major
    strategic dimension: as China's largest social and gaming company, Tencent has both distribution
    channels and enterprise relationships that could be relevant to Pragmatik's agent platform.
