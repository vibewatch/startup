callouts:
- calloutType: strength
  title: Exceptional Founder-Market Fit
  body: >-
    Lin Junyang is the former technical lead of China's most globally recognised open-source LLM,
    holds the highest technical rank (P10) at a major Chinese tech company, and published his
    agentic AI thesis before founding Pragmatik. This combination of hands-on LLM training
    infrastructure experience and a coherent written thesis for the agent era is rare among
    AI founders.
  claimRefs:
  - CO010
  - CO012
  - CO025

- calloutType: risk
  title: Single-Founder Concentration Risk
  body: >-
    Only one person — Lin Junyang — is publicly identified at Pragmatik Labs. There is no
    disclosed co-founder, no named executive team, and no known board of directors. This
    concentrates technical, strategic, and operational risk in a first-time CEO with no prior
    company-building track record.
  claimRefs:
  - CO015
  - CO031

- calloutType: insight
  title: Pre-Product Stealth Stage Is Consistent With Thesis
  body: >-
    Pragmatik's research-first approach is deliberate. Lin's blog argues that the agentic era
    requires new training infrastructure primitives, not application wrappers, suggesting the
    company is building foundational infrastructure that would take 12-24 months before a
    product-facing launch. Investors appear to have priced this into the five-year time horizon
    implied by the $220M raise.
  claimRefs:
  - CO025
  - CO026
  - CO027

- calloutType: assumption
  title: Valuation Assumes Successful Execution
  body: >-
    The $2 billion valuation is a conviction bet on founder pedigree, not an asset-based or
    revenue-multiple valuation. The same investor logic applies as it did to Anthropic's early
    rounds: if the founder executes, the round will look cheap; if not, the valuation cannot be
    sustained.
  claimRefs:
  - CO022
  - CO023
  - CO032

