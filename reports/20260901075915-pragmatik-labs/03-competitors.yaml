callouts:
  - calloutType: insight
    title: Pragmatik's current moat is a founder moat, not yet a product moat
    body: >-
      Public evidence suggests the company's strongest asset is Lin Junyang's frontier-AI track
      record and the credibility that comes with it. Until a shipped wedge exists, most other moat
      categories remain potential rather than demonstrated.
    claimRefs:
      - CP017
      - CP019
      - CP022
  - calloutType: risk
    title: Broad ambition creates comparison against the strongest players in two markets
    body: >-
      Because Pragmatik publicly spans digital and physical agents, it invites comparison with both
      frontier software labs and embodied-AI specialists. That widens the aspiration set but also
      raises the execution bar.
    claimRefs:
      - CP001
      - CP003
      - CP028
  - calloutType: assumption
    title: A narrow workflow wedge could turn current weakness into future lock-in
    body: >-
      Pragmatik does not need to beat every incumbent everywhere. It needs one workflow or one system
      problem where founder insight produces a meaningfully better result than bundled alternatives.
    claimRefs:
      - CP014
      - CP021
      - CP029
