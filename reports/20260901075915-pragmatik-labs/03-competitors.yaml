  evidenceGaps:
    - type: missing-source
      severity: material
      topic: wedge-gap
      missingEvidence: Public disclosure of the first target vertical, workflow, and buyer segment.
      whyItMatters: >-
        Without a defined wedge, it is impossible to know which competitor group matters most or
        whether Pragmatik will be judged as infrastructure, application software, or embodied AI.
      diligencePath: Request roadmap, design-partner pipeline, and internal prioritization memo.
      relatedQuestionRefs: [QP021, QP024]
    - type: missing-source
      severity: material
      topic: developer-gap
      missingEvidence: API, SDK, docs, or developer preview showing how Pragmatik expects builders to adopt its platform.
      whyItMatters: >-
        Developer tooling is a major distribution and ecosystem moat in agent markets, and Pragmatik's
        public posture is silent on this dimension.
      diligencePath: Request product preview materials, API plan, and ecosystem strategy deck.
      relatedQuestionRefs: [QP022]
    - type: private-evidence-only
      severity: material
      topic: compute
      missingEvidence: Details on compute access, cloud support, and internal infrastructure budget.
      whyItMatters: >-
        Competitive capacity in frontier agents depends partly on compute, but public sources do not
        quantify Pragmatik's ability to keep pace with better-established labs.
      diligencePath: Review supplier contracts, GPU plan, and capex/opex forecast.
      relatedQuestionRefs: [QP023]
    - type: missing-source
      severity: material
      topic: buyer-risk
      missingEvidence: Paid pilot data or buyer interviews showing willingness to add a new vendor instead of extending incumbent contracts.
      whyItMatters: >-
        The central competitive question is whether Pragmatik can overcome bundle and trust advantages
        held by large platforms.
      diligencePath: Request customer interview notes, pilot pricing, and lost-deal analysis from comparable vendors.
      relatedQuestionRefs: [QP025]
