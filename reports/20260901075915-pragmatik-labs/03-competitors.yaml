  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Dimension
      - Why it matters
      - Incumbent advantage
      - Pragmatik opening
      - Risk
    rows:
      - - Identity, permissions, and audit
        - Agents need trusted access to tools and data
        - Suite and cloud vendors already sit in the control plane
        - Offer cleaner bounded-action workflows
        - Buyers default to incumbent trust anchors
      - - Existing vendor contracts
        - Procurement favors extensions of current relationships
        - Large vendors can bundle pricing
        - Sell into unmet workflows that bundles handle poorly
        - Price pressure compresses gross margin
      - - Workflow data and feedback loops
        - Real deployment data compounds product quality
        - Established vendors collect more usage data
        - Win focused design-partner accounts with better iteration
        - Slow data accumulation if launches are delayed
      - - Developer ecosystem
        - Integrators and builders influence adoption
        - Large ecosystems have more docs and examples
        - Open-source adjacent tooling can narrow the gap
        - Mindshare deficit makes distribution expensive
      - - Physical deployment capability
        - Embodied systems require field validation
        - Specialists already focus on robotics loops
        - Stay asset-light through partners
        - Overbroad roadmap dilutes execution
      - - Talent market
        - Frontier agent talent is scarce
        - Incumbents offer brand and scale
        - Founder pedigree helps recruiting
        - Compensation and mission competition stay intense
    notes: >-
      The highest switching-cost dimensions are operational rather than purely technical. Incumbent
      control of trust surfaces and contracts is the biggest structural barrier.
