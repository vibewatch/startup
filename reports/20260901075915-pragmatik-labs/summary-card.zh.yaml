  topStrengths:
    - 世界级创始人：Lin Junyang 3 年内把 Alibaba Qwen 从零带到全球一线开源 LLM；创始阶段就亲手搭过智能体 RL 基础设施的人很少。
    - 市场巨大且增长很快：AI 智能体总可用市场（TAM）预计到 2030 年达 $52.6B（CAGR 46%）；数字智能体和物理智能体都还早，既有玩家尚未形成压倒性统治。
    - $220M 资本：即便按激进烧钱速度，也能撑五年以上现金跑道；资金足够招募世界级研究团队，搭出生产级智能体基础设施。
    - 书面投资逻辑连贯：Lin 2026 年 3 月关于 agentic thinking 的文章早于公司官宣；投资人押的是一位把问题想清楚的创始人。
    - 一线投资人联合背书：Gaorong、HongShan 与 Tencent 入局，可打开中国最好的企业分发和人才网络。
  topRisks:
    - 没有产品、没有团队、没有技术产物：成立五个月后仍无公开成果；任何尽调判断里，执行风险都是主导因素。
    - 单一创始人关键人风险：全部价值都集中在 Lin Junyang 身上；公司未披露联合创始人、管理团队或董事会，缺少治理制衡。
    - 中国监管风险：AI Act（EU）、PIPL 和 CAC 算法监管，让一家有全球智能体野心的公司面临复杂跨境合规。
    - 竞争拥挤：OpenAI、Anthropic、Google DeepMind、Manus 和 Physical Intelligence 在数字智能体与物理智能体研发上都已领先多年。
    - 估值偏高：一家尚无产品、尚无团队的隐身研究公司估到 $2B，意味着市场给创始人可选性打了极高溢价，少有公司撑得住。
