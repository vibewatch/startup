callouts:
  - calloutType: risk
    title: The highest immediate risk is still absence of product proof
    body: >-
      Regulatory and capital risks matter, but the main risk remains simpler: Pragmatik has not yet
      shown an external product artifact that validates execution against its ambitious thesis.
    claimRefs:
      - CR001
      - CR033
      - CR034
  - calloutType: insight
    title: Broad ambition is both the thesis and the hazard
    body: >-
      The company's digital-plus-physical framing is strategically exciting, but it also creates a
      higher risk of roadmap sprawl and delayed proof than a narrow application wedge would.
    claimRefs:
      - CR007
      - CR010
      - CR029
  - calloutType: assumption
    title: Strong governance can offset some founder concentration
    body: >-
      Key-person risk is not fatal if the company quickly adds trusted operators, clarifies decision
      rights, and sequences the roadmap in a way that reduces founder overload.
    claimRefs:
      - CR026
      - CR028
      - CR032
