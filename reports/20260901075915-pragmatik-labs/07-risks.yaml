  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: compute-supply
      missingEvidence: Actual compute contracts, reserved capacity, and contingency plans.
      whyItMatters: >-
        Geopolitical and supplier concentration risks cannot be assessed seriously without knowing how
        the company plans to secure and diversify compute.
      diligencePath: Review cloud, GPU, and infrastructure agreements.
      relatedQuestionRefs: [QR026]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Board composition, investor rights, and decision-making structure.
      whyItMatters: >-
        Governance quality determines how effectively the company can manage key-person risk and adapt
        if milestones slip.
      diligencePath: Review financing documents, board pack, and org chart.
      relatedQuestionRefs: [QR027]
    - type: private-evidence-only
      severity: material
      topic: legal-contracts
      missingEvidence: Draft customer MSA, DPA, liability language, and audit-log commitments.
      whyItMatters: >-
        Legal exposure for agent actions depends heavily on what the company promises customers in
        contract.
      diligencePath: Review legal templates and security architecture notes.
      relatedQuestionRefs: [QR028]
    - type: missing-source
      severity: material
      topic: milestone-deadline
      missingEvidence: Internal milestone calendar that defines when a proof artifact should exist.
      whyItMatters: >-
        Investors need a concrete timeline to decide whether lack of progress reflects deliberate
        research or failed execution.
      diligencePath: Request board-approved roadmap with milestone owners and dates.
      relatedQuestionRefs: [QR029]
    - type: missing-source
      severity: material
      topic: physical-partners
      missingEvidence: Evidence of physical-agent or simulation partners, if any.
      whyItMatters: >-
        The embodied roadmap cannot be risk-assessed properly without knowing the environments and
        counterparties involved.
      diligencePath: Request partner list, pilot environments, and safety governance plan.
      relatedQuestionRefs: [QR030]
