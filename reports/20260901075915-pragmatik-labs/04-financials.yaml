  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cash-balance
      missingEvidence: Current cash balance net of any round expenses and post-close commitments.
      whyItMatters: >-
        Gross capital raised is not the same as deployable cash, and runway judgments depend on the
        actual balance available today.
      diligencePath: Request bank balance, treasury summary, and post-close uses of proceeds.
      relatedQuestionRefs: [QI021]
    - type: private-evidence-only
      severity: material
      topic: burn
      missingEvidence: Actual monthly burn by compensation, compute, facilities, and any external programs.
      whyItMatters: >-
        Scenario ranges are only placeholders until real expense data reveals whether Pragmatik is
        tracking like software, infrastructure, or embodied-AI hardware.
      diligencePath: Request monthly management accounts and board budget packs.
      relatedQuestionRefs: [QI022]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Investor rights, preferences, board composition, and founder vesting.
      whyItMatters: >-
        Downside protection and governance rights matter as much as headline valuation in a
        pre-revenue financing.
      diligencePath: Review financing documents, cap table, and shareholder agreement.
      relatedQuestionRefs: [QI023]
    - type: missing-source
      severity: material
      topic: compute-contracts
      missingEvidence: Public or private disclosure of compute-capacity agreements, reserved cloud credits, or hardware access.
      whyItMatters: >-
        Compute access determines both burn and product velocity for a frontier-agent startup.
      diligencePath: Review supplier contracts and any investor-linked infrastructure agreements.
      relatedQuestionRefs: [QI024]
    - type: missing-source
      severity: material
      topic: first-commercial-step
      missingEvidence: Evidence showing whether early commercialization will be paid pilots, subscriptions, or strategic programs.
      whyItMatters: >-
        The first commercial form determines cash-conversion timing and whether gross margins will
        look like software or services.
      diligencePath: Request pipeline report, proposal templates, and customer interview notes.
      relatedQuestionRefs: [QI025]
