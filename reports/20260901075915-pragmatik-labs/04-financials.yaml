callouts:
  - calloutType: insight
    title: The financing buys time, not proof
    body: >-
      A $220 million angel round is extraordinary for a company with no public product, but it does
      not eliminate execution risk. It mainly extends the time available to translate a founder thesis
      into a product and a commercial story.
    claimRefs:
      - CI015
      - CI023
      - CI027
  - calloutType: risk
    title: Physical-agent expansion is the hidden burn accelerant
    body: >-
      If Pragmatik's physical-agent ambitions become an operating program rather than a long-dated
      research track, the cash profile can shift faster than investors anchored on software-like
      economics may expect.
    claimRefs:
      - CI010
      - CI012
      - CI026
  - calloutType: assumption
    title: The next financing trigger is likely milestone-based, not revenue-based
    body: >-
      For a pre-product frontier-agent startup, investors will probably fund the next round on
      demonstrated system capability, team formation, and design-partner proof before conventional
      software metrics exist.
    claimRefs:
      - CI021
      - CI024
      - CI028
