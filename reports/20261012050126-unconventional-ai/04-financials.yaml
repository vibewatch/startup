    title: Revenue streams and disclosure status
    columns:
      - Stream or hypothesis
      - Mechanism
      - Unit
      - Current value or status
      - Revenue quality
      - Diligence ask
    rows:
      - [AI accelerator hardware, Chip or system sale, Per chip or system, Not publicly disclosed, Hypothetical, Product roadmap and signed purchase commitments]
      - [Silicon and model platform, Hardware-software bundle, License or deployment, Not publicly disclosed, Hypothetical, Contract structure and revenue-recognition policy]
      - [Technology licensing, IP or architecture license, License or royalty, Not publicly disclosed, Hypothetical, License pipeline and royalty economics]
      - [Research collaboration, Sponsored research or development, Contract or milestone, No commercial contract disclosed, Unproven, Counterparties milestones and payment terms]
    notes: >-
      All rows are underwriting hypotheses derived from the disclosed technical direction;
      no reviewed source establishes an active commercial revenue stream or realized price.
    claimRefs: [CI006, CI009, CI010, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Offering
      - List price
      - Realized price
      - Contract model
      - Discounts or unknowns
      - Source status
    rows:
      - [AI accelerator hardware, null, null, Not disclosed, Volume and qualification terms unknown, No public pricing evidence]
      - [Software or model layer, null, null, Not disclosed, Support and licensing rights unknown, No public pricing evidence]
      - [Integrated system, null, null, Not disclosed, Hosting deployment and warranty terms unknown, No public pricing evidence]
    notes: >-
      Null means no value was found in the eight assigned prefetched sources; it does not
      mean the company offers the item for free or has selected that packaging.
    claimRefs: [CI009, CI010]
  - id: TI003
    title: Unit economics and capital-efficiency gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue or ARR, null, High confidence in nondisclosure, Establishes commercial scale, Audited revenue and revenue-recognition schedule]
      - [Gross margin, null, High confidence in nondisclosure, Tests hardware and service economics, Product-level COGS and gross-margin bridge]
      - [CAC and payback, null, High confidence in nondisclosure, Tests GTM efficiency, Pipeline cohort CAC sales cycle and payback]
      - [Cash burn and runway, null, High confidence in nondisclosure, Tests financing dependency, Monthly cash bridge and board-approved operating plan]
      - [Capex and tape-out commitments, null, Medium confidence in nondisclosure, Tests capital intensity and milestone risk, Foundry packaging EDA IP and prototype commitments]
    notes: >-
      Null means the assigned public evidence contains no quantified company metric; the
      confidence label concerns nondisclosure, not the underlying economics.
    claimRefs: [CI011, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from research to gross profit
    type: flow
    summary: >-
      A conceptual underwriting sequence showing the evidence milestones required before
      Unconventional AI can support a revenue and margin thesis.
    data:
      nodes:
        - id: research
          label: Research program
          detail: Public work spans circuits systems memory models and packaging.
        - id: architecture
          label: Architecture selection
          detail: Management reportedly expects multiple ideas and prototypes.
        - id: silicon
          label: Working silicon
          detail: Analog silicon and system-on-chip development remain execution steps.
        - id: benchmark
          label: Independent validation
          detail: System-level efficiency and workload relevance require external proof.
        - id: adoption
          label: Customer adoption
          detail: Named pilots contracts volumes and deployment economics are undisclosed.
        - id: monetization
          label: Revenue and gross profit
          detail: Pricing revenue recognition COGS and margin are not publicly disclosed.
    approximationNotes: >-
      Conceptual sequence only; it is not a company forecast, conversion funnel, or
      quantified financial model.
    claimRefs: [CI004, CI005, CI008, CI013, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      The $475 million financing headline does not disclose cash received, cash remaining,
      burn, debt, commitments, or the timing and conditions of any follow-on financing.
    claimRefs: [CI001, CI004, CI011, CI012]
  - calloutType: recommendation
    title: Gate underwriting on primary financial data
    body: >-
      Require the financing documents, current cash balance, monthly burn, milestone plan,
      product-level COGS, commercial pipeline, and signed customer evidence before assigning
      revenue, margin, or runway assumptions.
    claimRefs: [CI009, CI010, CI011, CI013, CI016]
