    approximationNotes: "Ordinal risk labels are analytical judgments, not measured probabilities; unknowns are not scored as zero risk."
    claimRefs: [CR002, CR003, CR004, CR006, CR007, CR009, CR012, CR013, CR016]
callouts:
  - calloutType: risk
    title: "Primary kill criterion"
    body: >-
      Treat the core thesis as unvalidated if independently benchmarked silicon and a credible
      manufacturing qualification path do not emerge before the reported five-year chip target.
    claimRefs: [CR003, CR005, CR011, CR016]
  - calloutType: insight
    title: "Funding does not close the operating-evidence gap"
    body: >-
      The $475 million seed round demonstrates financing access, but public evidence does not
      disclose cash available, burn, runway, production customers, or commercial revenue.
    claimRefs: [CR008, CR009, CR012]
