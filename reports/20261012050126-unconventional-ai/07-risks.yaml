schemaVersion: "report-v2"
artifact: risks
slug: unconventional-ai
runDate: 2026-10-12
company:
  name: "Unconventional AI"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    The dominant risk is technical and manufacturing feasibility: public evidence shows an
    ambitious analog and mixed-signal research program, but not independently benchmarked
    production silicon. A long prototype horizon, TSMC and third-party-IP dependencies, and
    missing public runway, customer, legal, and compliance detail keep residual exposure high.
sections:
  - id: risk-posture
    title: "Risk posture and thesis-break conditions"
    body: >-
      Unconventional AI is best treated as a research-stage hardware program rather than a
      de-risked semiconductor supplier. The company frames biology-scale efficiency as its
      objective, while outside reporting describes a five-year chip-development horizon and
      experimentation across multiple prototypes. The evidence therefore places feasibility
      before go-to-market risk: a large financing round can fund experiments, but it cannot
      establish manufacturability, system-level efficiency, reliability, or commercial demand.
      The central thesis-break condition is failure to show independently benchmarked silicon
      and a credible qualification plan before the reported five-year target. Secondary kill
      criteria are a materially slipping prototype schedule, no disclosed production design
      partners, or an inability to document foundry, packaging, memory, and IP-license paths.
    claimRefs: [CR001, CR003, CR005, CR011, CR014, CR016]
    figureRefs: [FR001]
  - id: technical-operational
    title: "Technical, manufacturing, and reliability exposure"
    body: >-
      Analog efficiency is not itself the disputed point; scalability and repeatability are.
      BigDATAwire recounts manufacturing variability as the historical reason analog computers
      lost ground, while reporting that the planned first prototype could be among the largest
      analog chips built. SiliconANGLE adds a heterogeneous SoC, mixed-signal circuitry,
      third-party IP, and possible RRAM to the integration surface. It also notes that RRAM's
      technical shortcomings have limited data-center adoption. These are interacting risks:
      process variation, memory endurance and yield, tool-chain maturity, packaging, thermal
      behavior, and model accuracy must work at system level. Current public research outputs
      are useful technical signals but do not replace silicon benchmarks, qualification data,
      or reliability evidence.
    claimRefs: [CR002, CR004, CR005, CR006, CR007, CR010, CR011, CR014]
    tableRefs: [TR002]
  - id: dependencies-capital
    title: "Partner, capital, and commercialization dependencies"
    body: >-
      The reported plan depends on TSMC for fabrication and on licensed third-party IP for parts
      of the SoC, creating schedule, economics, export-control, and change-of-control exposure
      outside the startup's direct control. The academic grant program broadens the research
      funnel, but its high-risk, theory-and-simulation orientation also shows how much discovery
      remains upstream of a product. The company says it raised $475 million at a $4.5 billion
      valuation; that is funding raised, not disclosed cash available, and the assigned public
      evidence does not quantify burn, runway, committed foundry capacity, or financing terms.
      It also identifies no named production customers or commercial revenue. Governance should
      therefore monitor cash milestones against tape-out, validated silicon, and customer
      qualification rather than infer runway or adoption from the round size.
    claimRefs: [CR004, CR006, CR008, CR009, CR010, CR012, CR015]
    tableRefs: [TR003]
  - id: legal-regulatory-diligence
    title: "Legal, regulatory, and diligence gaps"
    body: >-
      The assigned public evidence does not disclose the company's certification roadmap,
      export-control analysis, patent or freedom-to-operate position, third-party-IP license
      terms, litigation posture, or incident history. That limited record is not evidence that
      no obligation, dispute, or incident exists; it is a diligence gap. Before underwriting a
      production path, investors should obtain the IP schedule and license agreements, foundry
      and packaging commitments, sanctions and export-control analysis, product-safety and
      security plans, insurance coverage, and legal representations. The conflicting $500
      million valuation entry in TBPN Digest, against the company's $4.5 billion figure and
      several corroborating reports, also illustrates why secondary database fields should not
      be used without primary-document confirmation.
    claimRefs: [CR006, CR008, CR009, CR012, CR013, CR015]
    tableRefs: [TR001]
