      - ["SoC building blocks", "Undisclosed IP licensors", "Third-party processor or interface modules", "Unknown", "License, roadmap, integration, or change-of-control terms constrain product", "High", "Audit licenses and substitution options", "High"]
      - ["Research pipeline", "Universities and grant recipients", "Explore unconventional circuits, systems, models, and 3D integration", "Five grants disclosed", "Research outputs do not translate into manufacturable architecture", "Medium-high", "Stage gates tied to reproducible prototypes", "Medium-high"]
