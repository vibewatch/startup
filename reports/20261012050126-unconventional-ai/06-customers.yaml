chapter:
  number: 6
  title: "Customers"
  summary: "The retained evidence supports plausible datacenter, embedded, and mission-critical edge use cases, but it does not identify a commercial Unconventional AI customer, paid pilot, deployment outcome, or retention metric. The only quantified external engagement is an academic grant funnel, so customer traction remains a material diligence gap rather than a demonstrated operating asset."
sections:
  - id: "segments-and-buying-centers"
    title: "Addressable users are visible, but actual buyers are not"
    body: >-
      Unconventional AI describes a new computing substrate aimed at biology-scale
      energy efficiency, while third-party market material places the potential
      workloads in datacenter inference, generative models, and power-constrained
      edge systems. Independent demand-side evidence makes the edge segment more
      concrete: local inference matters in medical devices, autonomous vehicles,
      rescue drones, and defense settings where latency, battery life, or weak
      connectivity constrain cloud processing. An incumbent benchmark also shows
      how buyers are organized: AMD addresses OEMs, tier-one suppliers, and system
      and software developers in automotive and industrial markets. These sources
      support a segment hypothesis, not proof that any of those organizations is
      evaluating Unconventional AI. Buyer, user, payer, qualification criteria,
      and expected commercial value therefore remain inferred or unknown.
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-and-named-proof"
    title: "Academic participation is the only quantified adoption signal"
    body: >-
      The strongest named-relationship evidence is a research program rather than
      a sales program. Unconventional AI offered up to five one-year, $100,000
      university grants, and its company-issued site later reported nearly 100
      submissions and five projects associated with Stanford, UT Austin, Yale,
      MIT, and UC Berkeley. Those institutions are research recipients or
      collaborators; the evidence does not establish that they buy, deploy, or
      renew an Unconventional AI product. Separately, reporting characterizes the
      company as being in deep R&D and says several years may be spent testing
      multiple architectures. Across the assigned evidence set, no named
      commercial customer, paid pilot, production deployment, customer outcome,
      or customer-count denominator is disclosed. This is an evidence boundary,
      not proof that no confidential engagement exists.
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU009"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "commercial-journey-and-durability"
    title: "Commercial durability cannot be assessed before design-partner proof"
    body: >-
      Customer underwriting is still upstream of ordinary retention analysis.
      SiliconANGLE reports that the company plans to co-design chips and AI models,
      which implies a demanding adoption path spanning workload fit, developer
      tooling, prototype validation, system integration, qualification, and
      production procurement. The same report flags technical shortcomings and
      weak datacenter adoption for RRAM, one technology referenced in company
      recruiting, while AMD says its embedded portfolio was already sampling with
      early-access customers and targeting production shipments. That comparison
      is not an independent benchmark of Unconventional AI, but it illustrates the
      evidence sophisticated buyers can expect before volume adoption. With no
      disclosed contracts or cohorts in the retained pool, NRR, GRR, churn,
      renewal, contract duration, expansion, and customer concentration all remain
      unmeasurable.
    claimRefs:
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU013"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
