  topStrengths:
    - Exceptional founder-market fit and a tier-one investor syndicate with strong follow-on capital access.
    - Clear technical differentiation and a coherent biology-inspired compute thesis.
    - Potentially large power-efficiency upside if the substrate validates physically.
  topRisks:
    - No public silicon benchmarks, shipped product, or commercial customer proof.
    - Stretched valuation before tape-out or revenue creates poor risk-reward asymmetry.
    - Multi-year fabrication, tooling, and commercialization risk could outlast the thesis window.
  unresolvedGaps:
    - Independent physical-silicon benchmarks on standard workloads.
    - Named design partners or production customers plus contract terms.
    - Foundry, packaging, and reliability plan plus financing terms and runway.
