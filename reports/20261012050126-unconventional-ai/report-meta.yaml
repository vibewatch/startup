companyProfile:
  summary: >-
    Unconventional AI is a seed-stage AI infrastructure and semiconductor startup building analog and neuromorphic
    compute hardware with co-designed software for datacenter inference. The company combines a high-profile founder and
    investor base with a biology-inspired technical thesis, but the public record still looks like a research program:
    no shipped product, no disclosed commercial customers, and no observable revenue or margin profile.
  founders:
    - name: Naveen Rao
      role: Founder and CEO
      background: Former head of AI at Databricks; previously founded Nervana Systems and MosaicML.
  foundingLocation: California, United States
