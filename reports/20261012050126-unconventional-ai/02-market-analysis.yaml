        - Core target market for Unconventional AI high-efficiency silicon
      - - Edge AI and Embedded Accelerators
        - Low-power on-device inference chips, sensor-adjacent neural coprocessors
        - General microcontroller units, radio frequency modules, battery packs
        - Director of Embedded Engineering, Edge Systems Lead
        - Secondary expansion market for ultra-low-power neuromorphic architectures
      - - AI Memory & Interconnect Subsystems
        - Near-memory compute IP, nonvolatile analog memory arrays (RRAM/PCM)
        - Commodity bulk DDR5/HBM DRAM modules, standard PCIe switches
        - Silicon Architect, Hardware Systems Engineering
        - Critical co-design dependency for overcoming von Neumann data movement
      - - AI Compiler & Runtime Software Stack
        - Dynamical system instruction sets (DS-ISA), neural mapping compilers
        - General cloud orchestration software, higher-level SaaS applications
        - VP of AI Software, Developer Platform Lead
        - Essential software enablement layer required to unlock hardware efficiency
    notes: Boundary definitions delineate core accelerator silicon replacement from adjacent software, networking, and memory spend. Unconventional AI targets inference acceleration directly.
