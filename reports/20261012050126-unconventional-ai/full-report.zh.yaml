  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与资本联盟动态
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 建立在一个根本论点上：运行 Transformer
              架构的现有数字硅片，从热力学上不可能满足大规模人工智能的长期能源需求。公司希望让神经网络运算直接运行在硅电路的模拟动力学中，而不是以数字方式模拟，从而达到以人脑 20
              瓦功耗为参照的生物尺度能效。这一激进计算命题吸引了 2025 年 12 月宣布的创纪录 $475M 种子轮，投后估值 $4.5B。交易由 Andreessen Horowitz 和 Lightspeed
              Venture Partners 联合领投，Lux Capital、DCVC、Future Ventures、Databricks 和 Jeff Bezos 参与。创始人 Naveen Rao
              按相同轮次条款个人投入 $10M，也给出了较强的一致利益和积极信号。$475M 融资是计划最高 $1B 总资金目标的首期，用于打造多种实验性芯片架构原型。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
      - number: '8.2'
        title: 估值架构与市场定价纪律
        blocks:
          - type: paragraph
            body: >-
              在芯片流片前将半导体初创公司定价为 $4.5 billion，创下现代风险投资中罕见的估值基准。作为参照，Unconventional AI
              尚未完成集成电路流片、交付可用加速器或产生商业收入，就已经获得顶级基础模型实验室级别的估值倍数。一家二级追踪机构误将交易记为 $500 million 估值，但领投机构和全国媒体的一手确认支持 $4.5
              billion。这个价格反映了显著的创始人溢价：Nervana Systems 曾被 Intel 以超过 $400 million 收购，MosaicML 曾被 Databricks 以 $1.3 billion
              收购；同时也反映投资人解决数据中心能源瓶颈的紧迫性。不过从机构投资判断角度看，估值过高，且脱离有形里程碑。在没有独立硬件基准、验证过的编译器运行时或生产客户试点前，以种子轮估值或更高价格进行二级进入或后续投资，面临不利的不对称下行风险。
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV013
              - CV014
      - number: '8.3'
        title: 情景建模、下行触发器与稀释风险
        blocks:
          - type: paragraph
            body: >-
              在结构化经营情景下评估 Unconventional AI，会看到回报高度分散，并明显受资本强度和技术执行风险影响。基准情景中，公司用三至五年评估混合信号原型，并需要完整的 $1B
              资本计划；随着推理市场倍数正常化，最终收购结果可能在 $3B–$6B 之间。悲观情景中，模拟器件噪声、热漂移和编译器集成瓶颈让架构无法达到生产级 LLM 精度或数据中心扩展进度，导致股权严重减值，或以低于 $1B
              的价格清算知识产权。独立市场分析强调，如果模拟论点无法在前沿实验室要求的运营窗口内兑现，早期资本实际上是在承保一项高成本研究项目，最终归零。第二笔 $500M
              轮次带来的稀释和潜在优先权悬置，会进一步加剧普通股风险。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV012
      - number: '8.4'
        title: 技术里程碑、尽调要求与否决标准
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 的公开技术进展仍限于理论框架、模拟研究和学术社群建设。公司在 Stanford、MIT 等机构向五个大学研究项目各提供 $100,000 资助，共计
              $500,000，用于研究动力学神经架构；同时发布基于模拟耦合振荡器的算法图像生成器 Un-0，在 ImageNet 64x64 上取得 6.74 的
              FID。模拟模型展现了理论活力，却不能替代实体硅验证。由于公司当前没有实体芯片、经验证的采购价格或客户承诺，机构投资者必须设立严格尽调闸门。首要否决标准应包括：24 个月内未完成测试硅片流片；无法在标准
              Transformer 工作负载上证明至少 10x 的实测能效优势；或无法吸引非稀释性的超大规模云联合开发承诺。
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 芯片流片前的计算投资，应重耐心而非势头
            body: >-
              Unconventional AI 的创始团队和投资人联盟虽属基础设施领域顶级阵容，但在流片前以 $4.5B
              估值投资，颠倒了传统风险收益关系。投资者应保持“继续研究”的立场，先要求硅片验证和编译器基准，再判断是否参与股权投资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
          - type: callout
            title: $1B 资本悬置
            body: 原型阶段计划最高获得 $1B 资本，意味着 Unconventional AI 面临结构性稀释和清算优先权悬置。若市场环境转差或模拟扩展出现问题，后续轮次可能遭遇倍数大幅压缩或下轮重组。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
