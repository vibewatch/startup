  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理从 2025 年末到 2026 年末的创立、种子融资、研究规格和资助项目进展。
    approximationNotes: 里程碑日期来自公司公告和媒体发布记录；精确到日是因为采用了公开发布日期。
