      - number: '5.4'
        title: 制造依赖、晶圆厂经济性与商业风险
        blocks:
          - type: paragraph
            body: >-
              尽管以 $500M 投前、$4.5B 投后估值完成了 $475M 种子融资，Unconventional AI
              仍面临严峻的技术、制造和市场阻力。开发定制模拟混合信号硅片，需要算法、电路设计和物理布局之间极深的协同设计。模拟电路很容易受到半导体工艺波动、热噪声、电压漂移和环境变化影响，扩展到商业规模时制造良率风险极高。与拥有成熟编译器生态（如
              NVIDIA CUDA）的数字 GPU 不同，基于振荡器的架构需要全新的软件和运行时工具链，才能通过 DS-ISA 编译、优化并执行任意 Transformer
              或生成式模型。公司还高度依赖外部商业晶圆厂、先进封装设施和专业混合信号工程师。没有第三方验证的硅基准、可证明的系统级每 token
              焦耳数指标或已承诺的企业设计伙伴，该技术仍是未经证实的研究假设，而不是可量产的计算平台。
            claimRefs:
              - CE013
