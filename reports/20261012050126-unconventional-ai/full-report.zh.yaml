  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 技术可行性和制造执行带来最高的剩余暴露，因为缓释措施仍处于研究或规划阶段。
    data:
      columns:
        - key: likelihood
          label: 可能性
          detail: 基于指定证据的分析师评估
        - key: impact
          label: 影响
          detail: 风险实现后对投资论点的影响
        - key: mitigation
          label: 缓释成熟度
          detail: 有公开证据支持的成熟度，不是管理层口径
      rows:
        - label: 模拟可行性与制程波动
          values:
            - value: High
            - value: Critical
            - value: Early research
          note: 需要可重复的硅片和工作负载基准。
        - label: 原型进度与认证
          values:
            - value: Medium-high
            - value: Critical
            - value: Reported plan
          note: 五年期限留下了很长的执行周期。
        - label: 晶圆厂与封装依赖
          values:
            - value: Medium
            - value: Critical
            - value: Single named foundry
          note: 商业条款和备选路径未披露。
        - label: 内存与第三方 IP 集成
          values:
            - value: Medium-high
            - value: High
            - value: Architecture stage
          note: RRAM 和授权模块增加了集成接口。
        - label: 资本与融资模型
          values:
            - value: Medium
            - value: High
            - value: Large seed round
          note: 资金消耗、现金跑道和未来资本需求均未公开。
        - label: 法律、合规与客户证明
          values:
            - value: Unknown
            - value: High
            - value: Not publicly disclosed
          note: 需要开展一手尽调，不能从沉默中推断。
    approximationNotes: 序数风险标签是分析判断，不是实测概率；未知项不按零风险计分。
