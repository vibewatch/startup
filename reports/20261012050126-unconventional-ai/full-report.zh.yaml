        - 测试芯片成功流片；编译器使数据中心推理效率提升 50 倍；赢得 Tier-1 超大规模云厂商设计订单
        - 商业发布时估值 $15B–$25B，或在五年内被超大规模云厂商战略收购
        - 先进封装或领先半导体晶圆厂产能分配延迟
      - - 基准情景
        - 45%
        - 模拟加速器已在仿真中验证，但流片耗时 4 年以上；需要完成 $1B 融资
        - 估值 $3B–$6B；随着推理平台倍数压缩，进行温和的战略收购或资本重组
        - 随着数字 GPU 和专用数字 ASIC 提高能效，基底优势收窄
      - - 悲观情景
        - 40%
        - 硬件噪声和器件级良率问题令实体硅片项目停滞；学术仿真无法转化到数据中心规模
        - $0–$1B 清算或将 IP 出售给战略收购方，普通股严重减值
        - 无法募集第二笔 $500M 分期资金；团队离职或放弃模拟计算路线
    notes: 面向未来的情景概率分布、运营催化剂与预估股权结果。
