  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 计算架构与运行基底
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 通过用硅电路的非线性物理动力学替代确定性的数字抽象，回应大规模 AI 推理即将面临的能源约束。传统 GPU 和 CPU
              架构压制晶体管的自然物理行为以维持严格的数字确定性，因此在执行本质上带概率性的神经网络时付出巨大能耗。Unconventional AI
              希望构建接近生物尺度的计算基底，让神经网络动力学直接运行在硅的物理特性上，而不是通过冯·诺依曼数字抽象模拟数学运算。核心架构是耦合非线性振荡器网络，它们无需中央时钟即可异步运行。硬件利用物理共振和连续时间动力学状态，以极低功耗执行推理。公司还在模拟振荡器核心之上设计了动力学系统指令集架构（DS-ISA），为在物理动力学基底上编程
              AI 工作负载提供标准软件接口和执行词汇。总体工程目标是相较当代数字加速器将每单位推理能耗降低 1,000x，复现约 20 瓦运行的人脑的生物能效。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE011
      - number: '5.2'
        title: 原型验证、软件栈与路线图
        blocks:
          - type: paragraph
            body: >-
              公司的商业与架构路线目前处于模拟和初步设计阶段。2026 年 6 月，Unconventional AI 发布首个软件原型 Un-0，这是一种由拟议耦合振荡器架构的软件模拟驱动的图像生成模型。在 ImageNet
              64x64 基准上，Un-0 取得 6.74 的 Fréchet Inception Distance（FID），首次发布时达到传统扩散模型的生成质量。随后 2026 年 8
              月的研究显示，在耦合振荡器网络中引入结构稀疏性，可在 Un-0 中消除最高 98.4% 的振荡器间连接，同时让生成性能提升 1.9 个 FID
              点。为克服内存带宽限制和冯·诺依曼数据移动瓶颈，该架构将模拟振荡器核心与异构存储技术配对，利用相变存储器（PCM）和嵌入式
              DRAM（eDRAM）较宽松的误差容忍度。不过实体流片仍未完成：实体芯片示意图虽已被承诺，却尚未在硅上验证；管理层估计，要实现完整商业化，需要在多轮迭代原型中累计约 $1.5B 资本开支。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
