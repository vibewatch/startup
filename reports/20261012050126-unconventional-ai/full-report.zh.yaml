chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 创立、架构与使命
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 由资深技术人 Naveen Rao 于 2025
              年末创立，使命是突破人工智能计算即将触及的功耗墙。公司没有继续做晶体管渐进缩放或传统数字处理器优化，而是打造一种新型计算基底，让神经网络运算直接运行在硅的非线性物理特性上。这一路线以生物神经回路为根本灵感，目标是逼近人脑的极高能效——人脑总功耗约为
              20 瓦。已披露的公司材料显示其在加州有两个区域据点：技术资料将旧金山列为主要总部，早期融资记录则提到在圣迭戈设有运营机构。公司的长期目标是通过紧密的软硬件协同设计，在数据中心推理工作负载中实现最高 1,000x
              的能效优势，方案包括定制混合信号动力学电路和新型编程抽象。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
