  - id: FE001
    title: Unconventional AI 动力计算架构栈
    type: stack
    summary: 分层呈现拟议的动力系统计算栈，从应用模型一路到底层物理硅片基底。
    data:
      layers:
        - label: 应用与工作负载层
          detail: 针对稀疏动力计算配置的生成式 AI 和推理模型（例如 Un-0 图像生成）。
        - label: 指令集架构（DS-ISA）
          detail: 动力系统指令集架构，为控制连续物理系统提供词汇。
        - label: 编译器与数值仿真运行时
          detail: 神经协同进化环境、数字孪生和数值 ODE 仿真工具。
        - label: 模拟振荡器核心阵列
          detail: 在非线性硅片动力学上异步运行的模拟混合信号耦合振荡器网络。
        - label: 异构内存子系统
          detail: 使用 PCM 和 eDRAM、具备较宽松容错能力的集成多技术内存。
        - label: 物理硅片与 3D 封装基底
          detail: 采用 3D 异构封装、将核心与内存结合起来的商业晶圆厂硅片基底。
    approximationNotes: 基于 Unconventional AI 技术出版物综合得出的六层计算栈概念图。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE011
  - id: FU001
    title: 证据门控的客户旅程
    type: journey-map
    summary: 只有研究参与阶段有量化证据；之后每个商业阶段仍未获验证。
    data:
      nodes:
        - id: segment-demand
          label: 细分需求
          detail: 数据中心和边缘工作负载存在有记录的功耗、延迟和连接性约束。
          touchpoints:
            - Independent use-case evidence
        - id: research-engagement
          label: 研究参与
          detail: 据报道，收到近 100 份资助申请并推进五个项目。
          touchpoints:
            - University grant program
        - id: prototype-validation
          label: 原型验证
          detail: 指定证据池中没有公司专属的外部基准证据。
          touchpoints:
            - 'Gap: customer-relevant benchmark'
        - id: design-partner
          label: 设计合作伙伴或试点
          detail: 没有发现具名的 Unconventional AI 设计合作伙伴或试点。
          touchpoints:
            - 'Gap: agreement and evaluation scope'
        - id: production-procurement
          label: 生产采购
          detail: 没有发现合格的生产部署或合同。
          touchpoints:
            - 'Gap: shipment and deployment proof'
        - id: renewal-and-expansion
          label: 续约与扩张
          detail: 留存率、合同期限、扩张和集中度指标均不可得。
          touchpoints:
            - 'Gap: cohort and contract data'
    approximationNotes: 概念性尽调路径，不是有日期的路线图或转化漏斗；未验证阶段明确标为证据缺口。
    claimRefs:
