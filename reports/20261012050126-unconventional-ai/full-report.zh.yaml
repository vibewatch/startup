              $475M；这是已募集资金，不是已披露可用现金，指定公开证据也没有量化烧钱、现金跑道、已承诺晶圆厂产能或融资条款。证据同样没有具名生产客户或商业收入。因此治理层应将现金里程碑与流片、验证硅片和客户资格认证挂钩，而不应从轮次规模推断跑道或采用。
            claimRefs:
