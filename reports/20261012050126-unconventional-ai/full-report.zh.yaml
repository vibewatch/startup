    data:
      items:
        - date: 2025-10
          label: 公司创立
          detail: Naveen Rao 离开 Databricks，在加州创立 Unconventional AI。
          tone: neutral
        - date: '2025-12-08'
          label: 公开启动与论点发布
          detail: Unconventional AI 宣布打造生物级模拟计算和神经形态计算的使命。
          tone: positive
        - date: '2025-12-08'
          label: 历史性的 $475M 种子融资
          detail: 完成由 Lightspeed 和 a16z 领投、估值 $4.5B 的 $475M 轮融资，Rao 投资 $10M。
          tone: positive
        - date: '2026-04-02'
          label: 神经协同进化框架
          detail: 发布物理模拟系统与神经网络协同设计的基础论点。
          tone: neutral
        - date: '2026-05-14'
          label: 非常规资助项目启动
