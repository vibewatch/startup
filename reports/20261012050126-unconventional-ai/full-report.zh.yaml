      - number: '1.2'
        title: 领导层、团队与治理
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 的战略定位和融资势头，建立在创始人兼 CEO Naveen Rao 的高管履历之上。Rao 曾共同创办 Nervana Systems，这家深度学习硬件先驱于 2016 年被
              Intel 以约 $350M–$400M 收购；他随后担任 Intel 人工智能平台部门的公司副总裁。2021 年，Rao 又共同创办高效模型训练与基础设施平台 MosaicML，该公司于 2023 年 7 月被
              Databricks 以 $1.3B–$1.4B 收购，之后他负责 Databricks 的 AI 工作。Unconventional AI 的创始核心还汇集了 MIT 教授 Michael
              Carbin、斯坦福助理教授兼模拟编译器研究者 Sara Achour，以及资深半导体高管 MeeLan
              Lee，学术与硬件能力互补。领导团队横跨神经科学、编译器系统和实体芯片实现，具备罕见的多学科可信度；但公司在外部融资、战略视野和人才招募上，对 Rao 存在明显的关键人物依赖。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本结构、估值与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月，Unconventional AI 完成创纪录的 $475M 种子轮融资，建立 $4.5B 投后估值基准，成为科技史上资本最充足的种子期半导体企业之一。融资由顶级风投 Lightspeed
              Venture Partners 和 Andreessen Horowitz 联合领投，Sequoia Capital、Lux Capital、DCVC、Future Ventures、Databricks
              及知名科技天使 Jeff Bezos 参与。为表明个人投入，Naveen Rao 按与机构投资者相同的条款投入了 $10M 自有资金。主流金融和科技媒体持续确认 $4.5B 估值，但行业数据库 TBPN
              Digest 刊出异常的 $500M 估值，显示数据报道仍有分歧。科技媒体进一步称，这笔 $475M 融资只是计划累计 $1B 资本规模的首期，用于多年密集流片和并行架构原型开发。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
      - number: '1.4'
        title: 经营规模、商业化与战略风险
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 10 月，Unconventional AI
              严格来说仍是零收入、未商业化的研究机构：没有活跃客户账户、没有部署中的量产硅片，内部员工人数也未公开。商业模式设想未来直接向企业销售硬件、与超大规模云厂商联合开发并许可云软件，但公开商业化里程碑仍要多年后才可能出现。非标准半导体开发本身就存在重大执行阻力，包括打造能处理多样前沿工作负载、同时抗噪且可编程的模拟架构这一根本技术难题。多年硅开发周期还让公司暴露于
              NVIDIA、AMD 等 GPU 巨头的激进反击；这些公司的年度经营现金流和研发预算，按数量级远超 Unconventional AI
              的全部种子轮资产负债表。若要持续推进多轮制造迭代，公司必须严格管控资本，并拿出经过验证的实体硅原型。
            claimRefs:
              - CO012
              - CO014
              - CO015
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 顶级创始人履历与资本厚度
            body: >-
              联合创始人 Naveen Rao 连续退出 Nervana Systems（$350M–$400M+）和 MosaicML（$1.3B–$1.4B），立即带来结构性可信度，也帮助公司完成创纪录的 $475M
              种子轮，为高资本密集型半导体原型开发提供资金。
            calloutType: strength
            claimRefs:
