          detail: 模拟硅片与片上系统开发仍是待执行步骤。
        - id: benchmark
          label: 独立验证
          detail: 系统级效率和工作负载相关性需要外部证明。
        - id: adoption
          label: 客户采用
          detail: 具名试点、合同、规模和部署经济性均未披露。
        - id: monetization
          label: 收入与毛利润
          detail: 定价、收入确认、COGS 和利润率均未公开披露。
    approximationNotes: 仅为概念性路径，不是公司预测、转化漏斗或量化财务模型。
