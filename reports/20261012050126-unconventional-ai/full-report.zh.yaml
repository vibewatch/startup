        blocks:
          - type: paragraph
            body: >-
              为加速模拟计算、动力学算法和先进半导体封装的基础探索，Unconventional AI 启动了 $500,000 的 Unconventional Academic Research Grant
              Program。2026 年 9 月，公司向 Stanford University、University of Texas at Austin、Yale University、Massachusetts
              Institute of Technology（MIT）和 University of California, Berkeley 的学术团队各发放一笔
              $100,000、用途不受限的研究资助，共五笔。资助项目聚焦六个核心研究领域：模拟混合信号与定制数字电路、异构非常规系统架构、动力学神经网络建模、数据复用率超过 99%
              的循环权重驻留架构、人工智能物理学，以及目标在五年内实现量产可行性的 3D 异构封装。通过吸引顶尖机构的学术研究者，公司试图降低高不确定性的理论瓶颈，同时围绕 DS-ISA 接口建立早期开发者和研究者心智份额。
            claimRefs:
