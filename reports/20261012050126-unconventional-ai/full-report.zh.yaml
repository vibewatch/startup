  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 支柱
      - 投资论点
      - 反论点风险
      - 转向触发条件 / 尽调测试
    rows:
      - - 计算基底
        - 基于物理的模拟计算以 20W 生物效率运行，从而突破 GPU 的热力学极限
        - 模拟电路差异、热噪声和精度衰减会阻碍其在现代 LLM 推理中的扩展
        - 在量产神经架构上证明精度相当，同时实测能耗降低 >10 倍
      - - 软件工具链
        - MIT 与 Stanford 专家共同设计编译器，解决模拟计算长期存在的可编程性瓶颈
        - 定制指令集（DS-ISA）无法接入 PyTorch 和行业标准推理编排
        - 独立开发者采用该编译器工具链，并能无缝部署热门模型检查点
      - - 创始人执行力
        - Naveen Rao 此前通过基础设施公司退出累计实现 $1.7B+ 价值（Nervana 被 Intel 收购、MosaicML 被 Databricks 收购）
        - 硬件基底的翻盘需要 5–8 年和 $1B+ 资本，超过其此前软件公司的生命周期
        - 按计划完成测试芯片流片，不需要紧急下调轮次重组资本
      - - 资本结构
        - 高知名度投资者联合体（a16z、Lightspeed、Bezos）带来异常强的后续融资能力
        - 巨额 $4.5B 种子轮估值造成严重的优先权悬垂，压缩可行的战略并购退出路径
        - 落实与战略超大规模云厂商设计导入伙伴的承诺，并配套非稀释性共同融资
    notes: 核心投资假设与不利反论点相配对，并列出可观察的验证标准。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 核心运营假设
      - 估值 / 退出逻辑
      - 下行触发条件 / 关键风险
