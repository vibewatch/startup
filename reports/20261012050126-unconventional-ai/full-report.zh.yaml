  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、支出边界与结构性范式
        blocks:
          - type: paragraph
            body: >-
              人工智能硬件市场正在模型训练与持续推理执行之间发生结构性分化。早期基础模型扩展依靠大规模 GPU 集群进行并行批量训练，而推理工作负载是持续发生的运营支出，主要由连续功耗和电价驱动。Unconventional
              AI 明确位于推理加速领域，目标是解决电力供应已成为运营约束的数据中心环境。其可服务市场包括专用推理加速器硅、混合信号处理器子系统和软硬件协同设计的算法运行时层；不包括通用工作负载的传统冯·诺依曼数字
              CPU、标准商品 DRAM 模块及超大规模设施配电设备。替代方案包括运行量化低精度模型的主流 Nvidia GPU 集群、Google TPU 或 Groq LPU
              等专用数字张量处理器，以及超大规模云运营商自研的 ASIC。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 可服务市场测算视角与能源约束
        blocks:
          - type: paragraph
            body: >-
              测算替代型 AI 计算的可服务市场，需要从多个互补视角分析，而不是依赖单一的自上而下预测。最宽口径看，全球加速计算硅支出已超过 one hundred billion dollars
              annually，增长动力来自超大规模数据中心扩张。其中，专用数据中心推理硅片构成约 forty-five billion dollars
              且快速扩张的细分市场，因为已部署模型正从初始训练转向持续的多用户生产。更具体地说，Unconventional AI 瞄准电力受限的高密度推理场景，数据中心在此面临硬性的电气互连上限。人脑能够以持续约 20
              瓦的功耗完成复杂认知处理，为相较传统数字架构提升最高 a one-thousand-fold efficiency improvement
              提供了生物学上的存在性证明。不过，神经形态和模拟计算基底仍大多处于商业化前阶段，近期可服务收入只能来自研究资助、学术探索和探索性概念验证原型。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM013
              - CM014
      - number: '2.3'
        title: 目标买家分层、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              AI 计算硅的采购逻辑随客户群体显著不同，决定了不同的采用路径和预算归属。超大规模云服务商是主要的长期客户群，其基础设施工程负责人和数据中心设施主管控制着受兆瓦供电能力约束的资本预算。对这些运营商而言，降低每个
              token 的推理焦耳数，就能在不新建变电站的情况下直接扩大可用数据中心容量。前沿 AI 研究实验室和基础模型开发者构成第二类买家，关注算法效率和对时延敏感的生成式应用，由 CTO 和 AI 基础设施 VP
              负责。二线企业云平台及受监管的本地部署运营商构成第三类，更看重总拥有成本和硬件可靠性，而不是尚属推测的前沿架构。目前，Unconventional AI 主要通过学术资助项目与学术及机构研究实验室接触，在
              Stanford、MIT、Yale、UT Austin 和 UC Berkeley 等顶尖机构中建立基础软件范式。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 采用驱动、技术瓶颈与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              关注非常规 AI
              计算基底的核心催化剂，是未来十年全球电网容量不可能跟上预期推理需求的物理现实。传统数字半导体依靠离散时钟周期和模拟数字抽象，在存储器与处理核心之间持续搬运数据，因此遭遇严重的冯·诺依曼瓶颈和散热限制。但快速商业采用仍有很大阻力。以
              Nvidia CUDA 生态为核心的主流 GPU 架构，拥有超过 15
              年打磨的软件库、编译器优化和广泛的开发者锁定。新型模拟或动力学系统架构不仅要证明实体硅的能效，还要提供无缝的软件编译器、稳健的抗噪能力和可预测的数值稳定性。公开数据还显示资本条款存在重大尽调缺口：二手报道给出的种子期估值互相冲突，一个是五亿美元，另一个是四十五亿美元，凸显审阅原始条款清单和经审计资本表的必要性。
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 能源供给是 AI 扩展的硬上限
            body: AI 推理扩展正从单纯的计算密度问题转为热力学约束，数据中心可用电力决定总吞吐量。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 产品前研究阶段与基准缺口
            body: Unconventional AI 仍处于流片前研究阶段，没有商业流片、第三方基准或付费客户来验证其 1000x 能效论点。
            calloutType: risk
            claimRefs:
              - CM001
              - CM005
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局横跨架构与采购选择
        blocks:
          - type: paragraph
            body: >-
              可见竞争格局远不止神经形态初创公司。独立公司资料将 Cerebras、Groq、SambaNova、Graphcore 和 Untether 列为专用 AI 计算替代方案；Mythic、BrainChip 和
              SynSense 位于模拟或神经形态赛道；Celestial AI 解决相邻的互连基础设施问题；Intel 则代表在位的神经形态项目。买家也可以继续使用传统 GPU
              集群，或围绕内部硅片搭建方案，尽管指定证据没有量化这些现状选项。Unconventional AI
              因而同时争夺架构可信度、软件采用、供应获取和采购信心。现有资料足以做竞争者分类和阶段标注，却不足以比较收入、出货、客户或部署数量。
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
