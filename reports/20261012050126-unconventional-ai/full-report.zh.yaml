            body: >-
              指定公开证据没有披露公司的认证路线图、出口管制分析、专利或自由实施地位、第三方 IP 许可条款、诉讼态势或事故历史。记录有限并不证明不存在义务、争议或事故；它只是尽调缺口。在投资判断生产路径前，投资者应取得 IP
              清单与许可协议、晶圆厂和封装承诺、制裁与出口管制分析、产品安全和安保计划、保险覆盖及法律陈述。TBPN Digest 给出的 $500M 估值与公司 $4.5B
              数字及多篇佐证报道冲突，也说明二手数据库字段不能脱离原始文件确认而使用。
