      - CR012
      - CR013
      - CR016
  - id: FV001
    title: 建议决策流程
    type: flow
    summary: 将资本规模、基底验证、执行风险和估值纪律串成系统化决策流程，导向“继续研究”的立场。
    data:
      nodes:
        - id: capital-scale
          label: 资本规模与投资者联合体
          detail: a16z 和 Lightspeed 领投的 $475M 种子轮验证了论点吸引力，并确保多年现金跑道。
        - id: unconventional-thesis
          label: 基底论点
          detail: 受生物学启发的模拟计算瞄准 20W 大脑能效，打破数据中心 GPU 的功耗瓶颈。
        - id: hardware-reality
          label: 硬件现实检验
          detail: 截至 2026 年末仍处于流片前阶段，没有已流片芯片或独立数据中心基准。
        - id: execution-risks
          label: 下行与基底风险
          detail: 开发周期有较高概率达到 5–8 年，同时面临数千兆瓦级散热障碍和极高资本密集度。
        - id: valuation-discipline
          label: 估值进入纪律
          detail: $4.5B 进入估值已计入完美执行，对新资本形成负面的风险调整后不对称性。
        - id: final-recommendation
          label: 建议立场
          detail: 保持“继续研究”立场；在获得经验证的实体硅片遥测数据前，暂缓投入资本。
    approximationNotes: 流程图展示定性决策推进；各阶段体现相对风险权重，而非量化财务概率。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV013
      - CV014
