      - number: '3.2'
        title: 技术差异清晰，但尚未达到基准可比
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI 描述了一种向神经网络软件暴露非线性物理动力学的硅基底，而不是用传统确定性抽象复现这些动力学。其公开技术证据包括模拟的 Un-0 图像生成器、据报道在 ImageNet
              64x64 上取得 6.74 的 FID、最多削减 98.4% 连接的稀疏化结果，以及动力学系统指令集研究。第三方报道还提到 SoC、CPU、第三方 IP 模块、混合信号电路和 RRAM
              等新型非易失性存储器。这些披露确立了独特的设计方向，却不等于生产级加速器已经具备同等水平：保留来源没有提供实体硅吞吐量、每 token 焦耳数、可靠性或工作负载可移植性数据。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP016
      - number: '3.3'
        title: 商业比较受制于缺少封装与定价信息
        blocks:
          - type: paragraph
            body: >-
              指定证据没有披露 Unconventional AI 的标价、合同结构、折扣、服务等级或量产封装，也没有提供所列替代方案的同口径价格，因此数值化总拥有成本比较会是编造。公司转而通过 $500,000
              学术项目进行生态投入，最多发放五笔 $100,000 资助；独立报道则提到 $475M 种子融资和 $4.5B 估值。一份摘要给出相冲突的 $500M 估值，不应与其他一致的 $4.5B
              数字混用。融资说明公司有能力推进原型，却不能证明商业规模、定价能力、供应可得性或买家切换。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP013
      - number: '3.4'
        title: 护城河能否持久取决于跨过模拟商业化鸿沟
        blocks:
          - type: paragraph
            body: >-
              护城河有两点可能持久：覆盖模型、指令集、电路、存储器和封装的协同设计；以及横跨非常规电路、循环数据移动、动力学架构和 3D 集成的研究网络。但目前没有证据表明二者能形成买家锁定。独立报道将 1,000x
              能效目标描述为目标或承诺，而负面报道强调模拟精度和制造良率挑战。另一篇报道称，公司预计要在多个原型上实验数年，才能确定哪种架构能实现经济化扩展。在 Unconventional AI
              量产前，数字加速器、公开的神经形态厂商、在位研究项目和现状方案都有较大机会继续改进。关键尽调事项是独立硅基准、客户试点、工具链兼容性、晶圆厂与封装计划，以及切换成本证据。
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示
        blocks:
