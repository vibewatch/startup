              Unconventional AI's founding core brings complementary academic and hardware depth, featuring MIT
              professor Michael Carbin, Stanford assistant professor and analog compiler researcher Sara Achour, and
              veteran semiconductor executive MeeLan Lee. While the leadership roster provides rare multidisciplinary
              credibility spanning neuroscience, compiler systems, and physical chip implementation, the enterprise
              carries pronounced key-person dependency on Rao for external capital formation, strategic vision, and
              talent acquisition.
