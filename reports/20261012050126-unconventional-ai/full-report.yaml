      - number: '6.2'
        title: Academic participation is the only quantified adoption signal
        blocks:
          - type: paragraph
            body: >-
              The strongest named-relationship evidence is a research program rather than a sales program.
              Unconventional AI offered up to five one-year, $100,000 university grants, and its company-issued site
              later reported nearly 100 submissions and five projects associated with Stanford, UT Austin, Yale, MIT,
              and UC Berkeley. Those institutions are research recipients or collaborators; the evidence does not
              establish that they buy, deploy, or renew an Unconventional AI product. Separately, reporting
              characterizes the company as being in deep R&D and says several years may be spent testing multiple
              architectures. Across the assigned evidence set, no named commercial customer, paid pilot, production
              deployment, customer outcome, or customer-count denominator is disclosed. This is an evidence boundary,
