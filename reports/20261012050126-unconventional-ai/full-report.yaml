      - number: '6.3'
        title: Commercial durability cannot be assessed before design-partner proof
        blocks:
          - type: paragraph
            body: >-
              Customer underwriting is still upstream of ordinary retention analysis. SiliconANGLE reports that the
              company plans to co-design chips and AI models, which implies a demanding adoption path spanning workload
              fit, developer tooling, prototype validation, system integration, qualification, and production
              procurement. The same report flags technical shortcomings and weak datacenter adoption for RRAM, one
              technology referenced in company recruiting, while AMD says its embedded portfolio was already sampling
