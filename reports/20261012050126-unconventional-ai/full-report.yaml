  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI is best treated as a research-stage hardware program rather than a de-risked
              semiconductor supplier. The company frames biology-scale efficiency as its objective, while outside
              reporting describes a five-year chip-development horizon and experimentation across multiple prototypes.
              The evidence therefore places feasibility before go-to-market risk: a large financing round can fund
              experiments, but it cannot establish manufacturability, system-level efficiency, reliability, or
              commercial demand. The central thesis-break condition is failure to show independently benchmarked silicon
              and a credible qualification plan before the reported five-year target. Secondary kill criteria are a
              materially slipping prototype schedule, no disclosed production design partners, or an inability to
              document foundry, packaging, memory, and IP-license paths.
            claimRefs:
              - CR001
              - CR003
