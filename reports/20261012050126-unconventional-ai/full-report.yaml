        title: Partner, capital, and commercialization dependencies
        blocks:
          - type: paragraph
            body: >-
              The reported plan depends on TSMC for fabrication and on licensed third-party IP for parts of the SoC,
              creating schedule, economics, export-control, and change-of-control exposure outside the startup's direct
              control. The academic grant program broadens the research funnel, but its high-risk, theory-and-simulation
              orientation also shows how much discovery remains upstream of a product. The company says it raised $475
              million at a $4.5 billion valuation; that is funding raised, not disclosed cash available, and the
              assigned public evidence does not quantify burn, runway, committed foundry capacity, or financing terms.
              It also identifies no named production customers or commercial revenue. Governance should therefore
              monitor cash milestones against tape-out, validated silicon, and customer qualification rather than infer
