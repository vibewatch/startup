      - number: '2.3'
        title: Target Buyer Segmentation, Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics for AI compute silicon vary sharply across customer segments, dictating distinct
              adoption pathways and budget ownership structures. Hyperscale cloud service providers represent the
              primary long-term customer class, where infrastructure engineering leads and datacenter facilities
              directors control capital budgets constrained by megawatt availability. For these operators, reducing
              inference joules per token directly expands usable datacenter capacity without requiring new power
              substations. Frontier AI research labs and foundation model developers form a secondary buyer segment
              focused on algorithmic efficiency and latency-critical generative applications, controlled by chief
              technology officers and VP of AI infrastructure. Tier-two enterprise cloud platforms and regulated
              on-premise operators comprise a third category, prioritizing total cost of ownership and hardware
              reliability over speculative bleeding-edge architectures. At present, Unconventional AI engages primarily
              with academic and institutional research laboratories through its academic grant program, establishing
              foundational software paradigms across leading institutions including Stanford, MIT, Yale, UT Austin, and
              UC Berkeley.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Technical Bottlenecks, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The central catalyst driving interest in unconventional AI computing substrates is the physical
              impossibility of expanding global electrical grid capacity at the pace of projected inference demand over
              the next decade. Conventional digital semiconductors rely on discrete clock cycles and simulated digital
              abstractions that shuttle data continuously between memory and processing cores, encountering severe von
              Neumann bottlenecks and thermal dissipation limits. However, substantial friction impedes rapid commercial
              adoption. Incumbent GPU architectures, anchored by Nvidia CUDA ecosystem, benefit from over fifteen years
              of hardened software libraries, compiler optimizations, and pervasive developer lock-in. A novel analog or
              dynamical system architecture must not only demonstrate physical silicon efficiency but also deliver
              seamless software compilers, robust noise tolerance, and predictable numerical stability. Furthermore,
              public data reveals significant diligence gaps regarding capitalization terms, with conflicting secondary
              reporting stating seed valuations of both five hundred million dollars and four point five billion
              dollars, underscoring the necessity of reviewing primary term sheets and audited cap tables.
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM012
