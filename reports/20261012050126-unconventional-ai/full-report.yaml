chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Founding, Architecture, and Mission
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI was founded in late 2025 by veteran technologist Naveen Rao with the ambitious mission
              of overcoming the impending power wall in artificial intelligence computing. Rather than pursuing
              incremental transistor scaling or traditional digital processor optimizations, the company is engineering
              a novel computational substrate that executes neural network operations directly on the non-linear physics
              of silicon. This architectural approach draws foundational inspiration from biological neural circuits,
              specifically targeting the extreme energy efficiency of the human brain, which operates on approximately
              twenty watts of total power. Disclosed corporate materials indicate dual regional footholds in California,
              with technology profiles citing primary headquarters in San Francisco while early financing records also
              referenced operational establishment in San Diego. The company's long-term objective is to unlock up to a
              1,000x efficiency advantage in datacenter inference workloads through tight hardware-software co-design,
              including custom mixed-signal dynamical circuits and novel programming abstractions.
