      - number: '1.2'
        title: Leadership, Team, and Governance
        blocks:
          - type: paragraph
            body: >-
              The strategic positioning and fundraising momentum of Unconventional AI are anchored by the executive
              track record of founder and Chief Executive Officer Naveen Rao. Rao previously co-founded Nervana Systems,
              an early deep learning hardware pioneer acquired by Intel in 2016 for approximately $350 million to $400
              million, where he subsequently served as corporate vice president of the artificial intelligence platforms
              group. In 2021, Rao co-founded MosaicML, an efficient model training and infrastructure platform acquired
