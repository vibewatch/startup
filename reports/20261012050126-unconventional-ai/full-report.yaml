  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of founding, seed financing, research specifications, and grant programs from late 2025
      through late 2026.
    approximationNotes: >-
      Milestone dates derived from company announcements and press publication records; day-level precision reflects
      public release dates.
    claimRefs:
      - CO001
      - CO008
      - CO013
    data:
      items:
        - date: 2025-10
          label: Company Inception
          detail: Naveen Rao departs Databricks to found Unconventional AI in California.
          tone: neutral
        - date: '2025-12-08'
          label: Public Launch and Thesis Announcement
          detail: Unconventional AI announces mission to build biology-scale analog and neuromorphic compute.
          tone: positive
        - date: '2025-12-08'
          label: Historic $475M Seed Financing
          detail: Closes $475M round at $4.5B valuation led by Lightspeed and a16z with Rao investing $10M.
          tone: positive
        - date: '2026-04-02'
          label: Neural Co-Evolution Framework
          detail: Publishes foundational thesis on co-designing physical analog systems and neural networks.
          tone: neutral
        - date: '2026-05-14'
          label: Unconventional Grant Program Launch
          detail: Announces $500K academic research fund to sponsor high-risk unconventional computing research.
          tone: positive
        - date: '2026-06-25'
          label: Un-0 Model Release
          detail: Releases simulated coupled-oscillator image model reaching 6.74 FID on ImageNet 64x64.
          tone: positive
        - date: '2026-06-30'
          label: DS-ISA Architecture Release
          detail: Introduces dynamical system instruction set architecture for physics-based computing.
          tone: positive
        - date: '2026-09-10'
          label: Inaugural Academic Grant Awards
          detail: Awards five $100K grants to researchers across Stanford, MIT, Berkeley, Yale, and UT Austin.
          tone: positive
  - id: FM001
    title: Market Sizing Lens and Addressable Spend Layers
    type: pyramid
    summary: >-
      Constrained sizing layers from total AI accelerator spend down to accessible pre-commercial neuromorphic inference
      workloads.
    approximationNotes: >-
      Values and percentages represent directional proxy sizing layers based on reported compute market dynamics and
      pre-commercial accelerator status.
    data:
      items:
        - label: Total Datacenter Compute Infrastructure Spend
          value: 200
          unit: USD B
          detail: Total global server, facility, and datacenter hardware capital expenditure baseline.
        - label: Accelerated AI Compute Silicon Market
          value: 100
          unit: USD B
          detail: Total GPU, ASIC, and specialized accelerator silicon spend across training and inference.
        - label: Dedicated Datacenter AI Inference Accelerator TAM
          value: 45
          unit: USD B
          detail: Inference-specific silicon accelerators deployed in cloud and enterprise datacenters.
        - label: Power-Constrained High-Density Inference SAM
          value: 15
          unit: USD B
          detail: Datacenter deployments operating under severe megawatt caps and high electricity opex.
        - label: Neuromorphic & Analog Architecture Early Addressable Market
          value: 3
          unit: USD B
          detail: Specialized, non-von-Neumann workloads and edge/datacenter co-processors.
        - label: Pre-Commercial Silicon & Pilot Validation SOM
          value: 0.1
          unit: USD B
          detail: Early research grants, academic prototypes, and exploratory pilot deployments.
    claimRefs:
      - CM004
      - CM005
      - CM013
      - CM014
  - id: FP001
    title: Architectural novelty versus organizational stage signal
    type: quadrant
    summary: >-
      Ordinal positioning separates distance from conventional GPU design (x-axis, 1–5) from public organizational-stage
      signal (y-axis, 1–5); it is not a performance benchmark.
    data:
      points:
        - label: Unconventional AI
          x: 5
          'y': 1
          detail: Physics-first mixed-signal architecture; seed-financed and publicly described as multi-prototype research.
        - label: Mythic
          x: 4
          'y': 2
          detail: Analog AI chip company; private and venture-backed in the assigned profile.
        - label: BrainChip
          x: 4
          'y': 4
          detail: Neuromorphic AI hardware company; public-company stage signal.
        - label: SynSense
          x: 4
          'y': 2
          detail: Neuromorphic AI chip company; private and venture-backed in the assigned profile.
        - label: Groq
          x: 2
          'y': 4
          detail: Digital inference hardware and systems company; late-stage private / venture-backed.
        - label: Intel neuromorphic program
          x: 4
          'y': 5
          detail: Neuromorphic processor effort within a large incumbent semiconductor company.
    approximationNotes: >-
      Analyst ordinal scores use only architecture descriptions and public/private stage labels from the assigned
      evidence. They do not represent measured performance, revenue, adoption, readiness, or valuation.
    claimRefs:
      - CP002
      - CP007
      - CP008
      - CP009
      - CP016
  - id: FI001
    title: Revenue model bridge from research to gross profit
    type: flow
    summary: >-
      A conceptual underwriting sequence showing the evidence milestones required before Unconventional AI can support a
      revenue and margin thesis.
    data:
      nodes:
        - id: research
          label: Research program
          detail: Public work spans circuits systems memory models and packaging.
        - id: architecture
          label: Architecture selection
          detail: Management reportedly expects multiple ideas and prototypes.
        - id: silicon
          label: Working silicon
          detail: Analog silicon and system-on-chip development remain execution steps.
        - id: benchmark
          label: Independent validation
          detail: System-level efficiency and workload relevance require external proof.
        - id: adoption
          label: Customer adoption
          detail: Named pilots contracts volumes and deployment economics are undisclosed.
        - id: monetization
          label: Revenue and gross profit
          detail: Pricing revenue recognition COGS and margin are not publicly disclosed.
    approximationNotes: Conceptual sequence only; it is not a company forecast, conversion funnel, or quantified financial model.
    claimRefs:
      - CI004
      - CI005
      - CI008
      - CI013
      - CI015
      - CI016
  - id: FE001
    title: Unconventional AI Dynamical Computing Architecture Stack
    type: stack
    summary: >-
      Layered architecture representing the proposed dynamical system compute stack from application models down to the
      physical silicon substrate.
    data:
      layers:
        - label: Application & Workload Layer
          detail: >-
            Generative AI and inference models (such as Un-0 image generation) configured for sparse dynamical
            computation.
        - label: Instruction Set Architecture (DS-ISA)
          detail: >-
            Dynamical System Instruction Set Architecture providing the vocabulary to control continuous physical
            systems.
        - label: Compiler & Numerical Simulation Runtime
          detail: Neural co-evolution environment, digital twins, and numerical ODE simulation tools.
        - label: Analog Oscillator Core Array
          detail: Analog mixed-signal coupled oscillator networks operating asynchronously on nonlinear silicon dynamics.
        - label: Heterogeneous Memory Subsystem
          detail: Integrated multi-technology memory utilizing PCM and eDRAM with relaxed error tolerance.
        - label: Physical Silicon & 3D Packaging Substrate
          detail: Commercial foundry silicon substrate with 3D heterogeneous packaging combining cores and memory.
    approximationNotes: >-
      Conceptual representation of the six-layer computing stack synthesized from Unconventional AI technical
      publications.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE011
  - id: FU001
    title: Evidence-gated customer journey
    type: journey-map
    summary: Only the research-engagement stage has quantified evidence; every later commercial stage remains unverified.
    data:
      nodes:
        - id: segment-demand
          label: Segment demand
          detail: Datacenter and edge workloads have documented power, latency, and connectivity constraints.
          touchpoints:
            - Independent use-case evidence
        - id: research-engagement
          label: Research engagement
          detail: Nearly 100 grant submissions and five projects are reported.
          touchpoints:
            - University grant program
        - id: prototype-validation
          label: Prototype validation
          detail: Company-specific external benchmark evidence is not in the assigned pool.
          touchpoints:
            - 'Gap: customer-relevant benchmark'
        - id: design-partner
          label: Design partner or pilot
          detail: No named Unconventional AI design partner or pilot is identified.
          touchpoints:
            - 'Gap: agreement and evaluation scope'
        - id: production-procurement
          label: Production procurement
          detail: No qualified production deployment or contract is identified.
          touchpoints:
            - 'Gap: shipment and deployment proof'
        - id: renewal-and-expansion
          label: Renewal and expansion
          detail: Retention, contract duration, expansion, and concentration metrics are unavailable.
          touchpoints:
            - 'Gap: cohort and contract data'
    approximationNotes: >-
      Conceptual diligence sequence, not a dated roadmap or conversion funnel; unverified stages are explicit evidence
      gaps.
    claimRefs:
      - CU008
      - CU010
      - CU011
      - CU015
      - CU016
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Technical feasibility and manufacturing execution carry the highest residual exposure because mitigation remains
      at research or planning stage.
    data:
      columns:
        - key: likelihood
          label: Likelihood
          detail: Analyst assessment from the assigned evidence
        - key: impact
          label: Impact
          detail: Effect on the investment thesis if realized
        - key: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced maturity, not management assertion
      rows:
        - label: Analog feasibility and process variability
          values:
            - value: High
            - value: Critical
            - value: Early research
          note: Requires repeatable silicon and workload benchmarks.
        - label: Prototype schedule and qualification
          values:
            - value: Medium-high
            - value: Critical
            - value: Reported plan
          note: Five-year horizon leaves substantial execution duration.
        - label: Foundry and packaging dependency
          values:
            - value: Medium
            - value: Critical
            - value: Single named foundry
          note: Commercial terms and backup paths are undisclosed.
        - label: Memory and third-party IP integration
          values:
            - value: Medium-high
            - value: High
            - value: Architecture stage
          note: RRAM and licensed modules add integration surfaces.
        - label: Capital and financing model
          values:
            - value: Medium
            - value: High
            - value: Large seed round
          note: Burn, runway, and future capital needs are not public.
        - label: Legal, compliance, and customer proof
          values:
            - value: Unknown
            - value: High
            - value: Not publicly disclosed
          note: Requires primary diligence rather than inference from silence.
    approximationNotes: Ordinal risk labels are analytical judgments, not measured probabilities; unknowns are not scored as zero risk.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR007
      - CR009
      - CR012
      - CR013
      - CR016
  - id: FV001
    title: Recommendation decision flow
    type: flow
    summary: >-
      Systematic decision flow connecting capital scale, substrate validation, execution risks, and valuation discipline
      to the research-more posture.
    data:
      nodes:
        - id: capital-scale
          label: Capital Scale & Syndicate
          detail: $475M seed round led by a16z and Lightspeed validates thesis gravity and ensures multi-year runway.
        - id: unconventional-thesis
          label: Substrate Thesis
          detail: Biology-inspired analog computing targets 20W brain efficiency to break datacenter GPU power bottlenecks.
        - id: hardware-reality
          label: Hardware Reality Check
          detail: Pre-silicon status with no taped-out chip or independent datacenter benchmarks as of late 2026.
        - id: execution-risks
          label: Downside & Substrate Risk
          detail: >-
            High probability of 5-8 year development horizon, multi-gigawatt thermal hurdles, and severe capital
            intensity.
        - id: valuation-discipline
          label: Valuation Entry Discipline
          detail: >-
            $4.5B entry valuation prices in flawless execution, creating negative risk-adjusted asymmetry for new
            capital.
        - id: final-recommendation
          label: Recommendation Posture
          detail: Maintain research-more stance; defer capital deployment pending verified physical silicon telemetry.
    approximationNotes: >-
      Flow illustrates qualitative decision progression; stages reflect comparative risk weightings rather than
      quantitative financial probabilities.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV013
      - CV014
