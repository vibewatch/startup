            body: >-
              The assigned public evidence does not disclose the company's certification roadmap, export-control
              analysis, patent or freedom-to-operate position, third-party-IP license terms, litigation posture, or
              incident history. That limited record is not evidence that no obligation, dispute, or incident exists; it
