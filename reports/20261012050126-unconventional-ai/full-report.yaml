  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Spend Boundaries, and Structural Paradigms
        blocks:
          - type: paragraph
            body: >-
              The market for artificial intelligence hardware is undergoing a structural bifurcation between model
              training and persistent inference execution. While initial foundation model scaling centered on massive
              GPU clusters for parallelized batch training, inference workloads represent an ongoing operational
              expenditure dominated by continuous power consumption and electricity tariffs. Unconventional AI positions
              itself squarely within the inference acceleration domain, explicitly targeting datacenter environments
              where power availability has become the binding operational constraint. The boundaries of this addressable
              market encompass specialized inference accelerator silicon, mixed-signal processor subsystems, and
              co-designed algorithmic runtime layers. Excluded from this boundary are legacy von Neumann digital CPUs
              for general-purpose workloads, standard commodity DRAM modules, and hyper-scale facility power
              distribution equipment. Substitutes include incumbent Nvidia GPU clusters operating with quantized
              low-precision models, specialized digital tensor processors such as Google TPUs or Groq LPUs, and in-house
              ASIC initiatives from hyperscale cloud operators.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Addressable Market Sizing Lenses and Energy Constraints
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for alternative AI compute requires analyzing multiple complementary lenses
              rather than relying on a monolithic top-down projection. At the broadest level, global accelerated compute
              silicon spending represents a market exceeding one hundred billion dollars annually, driven by hyperscale
              datacenter expansion. Within that envelope, dedicated datacenter inference silicon forms a rapidly
              expanding segment estimated at forty-five billion dollars, as deployed models transition from initial
              training into continuous multi-user production. More specifically, Unconventional AI targets the
              power-constrained high-density inference segment, where datacenters face hard electrical interconnect
              limits. The biological existence proof established by the human brain, which performs complex cognitive
              processing on a mere twenty watts of continuous power, motivates the pursuit of up to a one-thousand-fold
              efficiency improvement over conventional digital architectures. However, because neuromorphic and analog
              computing substrates remain largely pre-commercial, near-term addressable revenue is constrained to
              research grants, academic exploration, and exploratory proof-of-concept prototype validation.
            claimRefs:
              - CM004
