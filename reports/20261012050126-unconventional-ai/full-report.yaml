  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Computing Architecture and Operating Substrate
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI addresses the impending energy constraint of large-scale AI inference by replacing
              deterministic digital abstractions with the nonlinear physical dynamics of silicon circuits. Traditional
              GPU and CPU architectures suppress the natural physical behavior of transistors to enforce strict digital
              determinism, incurring severe energy penalties when executing inherently probabilistic neural networks.
              Unconventional AI aims to construct a biological-scale computational substrate that executes neural
              network dynamics directly on silicon physics rather than simulating mathematical operations through von
              Neumann digital abstractions. The core architecture centers on networks of coupled nonlinear oscillators,
              which operate asynchronously without a central clock. By utilizing physical resonance and continuous-time
              dynamical states, the hardware executes inference with minimal power dissipation. Complementing the analog
              oscillator cores, the company formulated the Dynamical System Instruction Set Architecture (DS-ISA), which
              provides a standard software interface and execution vocabulary for programming AI workloads on physical
              dynamical substrates. The overarching engineering target is to achieve a 1,000x reduction in energy
              consumption per unit of inference relative to contemporary digital accelerators, mirroring the biological
              energy efficiency of the human brain operating at approximately 20 watts.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE011
      - number: '5.2'
        title: Prototype Validation, Software Stack, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              The company's commercial and architectural roadmap is currently in the simulation and preliminary design
              phase. In June 2026, Unconventional AI released its debut software prototype, Un-0, an image-generation
              model powered by a software simulation of the proposed coupled oscillator architecture. On the ImageNet
              64x64 benchmark, Un-0 achieved a Fréchet Inception Distance (FID) score of 6.74, matching the generative
              fidelity of conventional diffusion models when first published. Subsequent research in August 2026
              demonstrated that introducing structural sparsity into coupled oscillator networks eliminates up to 98.4%
              of inter-oscillator connections in Un-0 while improving generative performance by 1.9 FID points. To
              overcome memory bandwidth limitations and the von Neumann data movement bottleneck, the architecture pairs
              analog oscillator cores with heterogeneous memory technologies, exploiting relaxed error tolerances across
              phase-change memory (PCM) and embedded DRAM (eDRAM). Nevertheless, physical tape-outs remain pending:
              physical chip schematics have been promised but unverified in silicon, and full commercial realization is
              estimated by leadership to require approximately $1.5 billion in cumulative capital expenditure across
              multiple iterative prototype generations.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Academic Grant Pipeline and Ecosystem Seeding
        blocks:
          - type: paragraph
            body: >-
              To accelerate fundamental exploration across analog computing, dynamical algorithms, and advanced
              semiconductor packaging, Unconventional AI launched the $500,000 Unconventional Academic Research Grant
              Program. In September 2026, the company awarded five unrestricted research grants of $100,000 each to
              academic research teams at Stanford University, the University of Texas at Austin, Yale University, the
              Massachusetts Institute of Technology (MIT), and the University of California, Berkeley. The grant
              initiatives focus on six core research domains: analog mixed-signal and custom digital circuits,
              heterogeneous unconventional system architectures, dynamical neural network formulations, recurrent
              weight-stationary architectures exhibiting greater than 99% data reuse, the physics of artificial
              intelligence, and 3D heterogeneous packaging targeting volume manufacturing viability within five years.
              By engaging academic researchers at elite institutions, the company attempts to de-risk high-uncertainty
              theoretical bottlenecks while establishing an early developer and researcher mindshare around its DS-ISA
              interface.
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.4'
        title: Fabrication Dependencies, Foundry Economics, and Commercial Risks
        blocks:
          - type: paragraph
            body: >-
              Despite substantial seed capitalization of $475 million at a $500 million pre-money ($4.5 billion
              post-money) valuation, Unconventional AI faces severe technical, fabrication, and market headwinds.
              Developing custom analog mixed-signal silicon requires extreme co-design across algorithms, circuit
              design, and physical layout. Analog circuits are notoriously vulnerable to semiconductor process
              variations, thermal noise, voltage drift, and environmental fluctuations, presenting immense manufacturing
              yield risks when scaling to commercial volumes. Furthermore, unlike digital GPUs supported by mature
              compiler ecosystems such as NVIDIA CUDA, an oscillator-based architecture demands an entirely new software
              and runtime toolchain to compile, optimize, and execute arbitrary transformer or generative models via
              DS-ISA. The venture is also heavily reliant on external commercial foundries, advanced packaging
              facilities, and specialized mixed-signal engineers. Without third-party verified silicon benchmarks,
              demonstrable system-level joules-per-token metrics, or committed enterprise design partners, the
              technology remains an unproven research thesis rather than a production-ready compute platform.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE007
              - CE011
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Algorithmic Validation vs Silicon Execution
            body: >-
              The successful demonstration of Un-0 on ImageNet 64x64 establishes that coupled oscillator dynamics can
              theoretically match the output quality of conventional diffusion models. However, because Un-0 was
              evaluated purely through software simulation on digital clusters, it provides zero experimental validation
              of silicon-level energy efficiency, noise tolerance, or manufacturing yield.
            calloutType: insight
            claimRefs:
              - CE005
              - CE015
          - type: callout
            title: Capital Intensity of Hardware Paradigm Resets
            body: >-
              Rebuilding AI computing from physical silicon dynamics requires an estimated $1.5 billion in cumulative
              capital expenditure to reach a first commercial product. Despite a massive $475 million seed round,
              Unconventional AI faces extreme capital burn and multi-year execution timelines before producing revenue
              or competitive silicon.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Addressable users are visible, but actual buyers are not
        blocks:
          - type: paragraph
            body: >-
              Unconventional AI describes a new computing substrate aimed at biology-scale energy efficiency, while
              third-party market material places the potential workloads in datacenter inference, generative models, and
              power-constrained edge systems. Independent demand-side evidence makes the edge segment more concrete:
              local inference matters in medical devices, autonomous vehicles, rescue drones, and defense settings where
              latency, battery life, or weak connectivity constrain cloud processing. An incumbent benchmark also shows
              how buyers are organized: AMD addresses OEMs, tier-one suppliers, and system and software developers in
              automotive and industrial markets. These sources support a segment hypothesis, not proof that any of those
              organizations is evaluating Unconventional AI. Buyer, user, payer, qualification criteria, and expected
              commercial value therefore remain inferred or unknown.
