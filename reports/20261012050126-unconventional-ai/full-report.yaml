      - number: '7.2'
        title: Technical, manufacturing, and reliability exposure
        blocks:
          - type: paragraph
            body: >-
              Analog efficiency is not itself the disputed point; scalability and repeatability are. BigDATAwire
              recounts manufacturing variability as the historical reason analog computers lost ground, while reporting
              that the planned first prototype could be among the largest analog chips built. SiliconANGLE adds a
              heterogeneous SoC, mixed-signal circuitry, third-party IP, and possible RRAM to the integration surface.
              It also notes that RRAM's technical shortcomings have limited data-center adoption. These are interacting
              risks: process variation, memory endurance and yield, tool-chain maturity, packaging, thermal behavior,
              and model accuracy must work at system level. Current public research outputs are useful technical signals
              but do not replace silicon benchmarks, qualification data, or reliability evidence.
            claimRefs:
