        title: Exhibits
        blocks:
          - type: callout
            title: Energy Supply as the Hard Ceiling on AI Scaling
            body: >-
              AI inference scaling is shifting from a pure compute density problem to a thermodynamic constraint, where
              datacenter power availability governs total throughput.
