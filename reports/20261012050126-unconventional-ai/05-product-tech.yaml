callouts:
  - calloutType: "insight"
    title: "Algorithmic Validation vs Silicon Execution"
    body: "The successful demonstration of Un-0 on ImageNet 64x64 establishes that coupled oscillator dynamics can theoretically match the output quality of conventional diffusion models. However, because Un-0 was evaluated purely through software simulation on digital clusters, it provides zero experimental validation of silicon-level energy efficiency, noise tolerance, or manufacturing yield."
    claimRefs:
      - "CE005"
      - "CE015"
  - calloutType: "risk"
    title: "Capital Intensity of Hardware Paradigm Resets"
    body: "Rebuilding AI computing from physical silicon dynamics requires an estimated $1.5 billion in cumulative capital expenditure to reach a first commercial product. Despite a massive $475 million seed round, Unconventional AI faces extreme capital burn and multi-year execution timelines before producing revenue or competitive silicon."
    claimRefs:
      - "CE013"
      - "CE014"
