evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: >-
      Formal board of directors composition, investor voting rights, and liquidation preference terms for the $475M seed
      round.
    whyItMatters: >-
      Determines whether lead venture investors hold blocking governance control over future chip architecture choices
      and capitalization tranches.
    diligencePath: >-
      Review certificate of incorporation filings in Delaware, venture voting agreements, and investor rights
      disclosures in prospective diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: blocking
    topic: silicon-benchmarks
    missingEvidence: >-
      Third-party audited physical silicon energy-efficiency measurements and formal foundry tape-out schedules for
      production chips.
    whyItMatters: >-
      Validating the 1,000x efficiency hypothesis requires physical chip testing rather than simulated dynamical models
      like Un-0.
    diligencePath: >-
      Obtain engineering test bench data, foundry shuttle reservation records, and design partner pilot logs under
      non-disclosure agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      Full operational executive roster including Chief Operating Officer, VP of Silicon Engineering, and commercial
      software leads.
    whyItMatters: >-
      Assesses organizational bench depth beyond founder Naveen Rao and university researchers across complex tape-out
      cycles.
    diligencePath: Request company organizational chart and employment agreement records during management reference calls.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table share allocation percentages, founder equity vesting terms, and debt or secondary financing
      details.
    whyItMatters: >-
      Identifies whether seed round dilution leaves sufficient equity pool for top semiconductor recruiting across a
      multi-year pre-revenue runway.
    diligencePath: Inspect cap table ledgers, capitalization models, and 409A valuation reports during formal data-room review.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Commercial Customer and Revenue Traction
    missingEvidence: >-
      Public disclosures of commercial pilot customers, named enterprise design partners, or contracted proof-of-concept
      deployments.
    whyItMatters: >-
      Without customer proof points or commercial contracts, adoption velocity and revenue potential cannot be modeled
      beyond speculative assumptions.
    diligencePath: >-
      Request customer advisory board access, pipeline review, and signed letter-of-intent documentation during
      confidential management diligence.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: Seed Valuation Discrepancies
    missingEvidence: >-
      Official certificate of incorporation or financing term sheets resolving whether the seed valuation was $4.5
      billion or $500 million.
    whyItMatters: A 9x valuation discrepancy impacts entry valuation discipline, dilution models, and expected exit multiples.
    diligencePath: Examine corporate filings and cap table records via confidential investor data room.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: switching-distribution-and-supply
    missingEvidence: >-
      Named customer pilots, workload migration results, multi-homing behavior, channel or cloud distribution
      agreements, and foundry, memory, packaging, and supply commitments.
    whyItMatters: >-
      Without buyer and supply-chain evidence, the analysis cannot determine whether performance would create switching
      costs or whether the company can deliver systems at production scale.
    diligencePath: >-
      Request pilot contracts and test reports, interview design partners, and review foundry, packaging, memory,
      cloud-channel, and support agreements.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: efficiency-validation
    missingEvidence: >-
      Independent fabricated-silicon measurements for throughput, joules per token or image, precision, reliability,
      yield, and full-system power on a common production-relevant workload.
    whyItMatters: >-
      The central efficiency claim cannot be compared fairly with digital or neuromorphic alternatives without a shared
      workload, denominator, system boundary, and measurement method.
    diligencePath: >-
      Obtain third-party laboratory reports and raw test data for fabricated silicon, then rerun every alternative under
      the same workload, precision, and system boundary.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP002
