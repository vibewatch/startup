  - id: capital-adequacy-and-liquidity
    title: Capital Adequacy, Burn, and Financing Dependency
    body: >-
      Forter has raised $525M across six rounds, with the latest being a $300M Series F led by
      Tiger Global Management in May 2021 at a $3B valuation. No new primary equity round has been
      disclosed since then—a gap of over five years as of the run date. The company has not released
      its cash balance, monthly burn rate, or runway estimate. For context, late-stage venture-backed
      fintech companies at comparable scale typically run monthly net cash outflows of $5–15M. If
      Forter deployed capital at this rate since 2021, meaningful portions of the Series F proceeds
      could be consumed. The appointment of Jim Lejeal—a CFO who shepherded Splunk, Absolute
      Software, and Rally Software through IPOs—in March 2025 is a strong signal that Forter is
      actively preparing for a liquidity event. Secondary market activity on Forge Global as of 2025
      implied discounts of approximately 20–30% below the $3B headline valuation, narrowing toward
      single digits in early 2026 as the private secondary market recovered. No confirmed down round
      or bridge financing has been reported. Forter's CEO noted at the Forbes Cloud 100 announcement
      in September 2025 that the absence of an IPO market has made the Cloud 100 competition fiercer
      among private companies—an implicit acknowledgment of the delayed liquidity timeline.
      Debt financing is not publicly evidenced. Regulatory capital requirements do not directly
      apply as Forter is not a licensed financial institution, but the chargeback guarantee creates
      a contingent liability that would require either insurance backstop or capital reserves,
      neither of which is disclosed.
    claimRefs:
      - CI028
      - CI029
      - CI030
      - CI031
      - CI032
