company:
  name: Forter

chapter:
  number: 4
  title: Financials
  summary: >-
    Forter operates a GMV-based SaaS subscription model for fraud prevention with an estimated
    ~$103M ARR (2024, third-party estimate), growing ~25% YoY but decelerating sharply from
    100%+ in 2021. The company is private and does not disclose gross margin, burn rate, or
    profitability. Appointment of a four-time public company CFO in March 2025 signals IPO
    preparation. The $3B valuation from its 2021 Series F now implies ~29x revenue—a multiple
    that appears stretched absent evidence of strong margin expansion or re-acceleration. Critical
    financial metrics remain inaccessible to outside investors.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Forter monetizes through a GMV-based SaaS subscription: merchants pay a percentage of
      approved gross merchandise value (GMV) or on a per-approved-transaction basis, scaled by
      monthly transaction volume and augmented by premium module add-ons. The platform is
      modular—core fraud prevention, account protection, payment optimization, abuse prevention,
      and a chargeback guarantee each carry separate pricing. Forter does not publish per-transaction
      or percentage-of-GMV rates; all contracts are custom quotes negotiated with the sales team.
      Annual contract values span from low five-figures (smaller merchants) to mid-six figures or
      higher for large-scale enterprise clients. GetLatka estimates average ACV at $10.3K across
      Forter's reported ~10,000 customers, reflecting a long-tail SMB customer base alongside a
      smaller roster of high-ACV enterprise accounts. Multi-year commitments and prepayment typically
      unlock discounts. Implementation, onboarding, and dedicated support are separately scoped costs
      that affect total contract value. The chargeback guarantee module is distinctive: Forter assumes
      direct financial liability for approved transactions subsequently disputed as fraudulent,
      shifting the risk exposure from merchant to Forter. This creates a contingent liability on
      Forter's balance sheet whose magnitude is undisclosed. Pricing for the guarantee module is
      expected to carry higher margins as a risk-premium, but the reserve methodology and actuarial
      assumptions are private.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI001
      - TI002

  - id: financial-scale-signals
    title: Financial Scale Signals and Third-Party Traction Estimates
    body: >-
      Forter processed over $2 trillion in cumulative e-commerce transactions as of late 2024,
      serving more than 10,000 merchants. In 2024 Forter's platform drove more than $9 billion in
      incremental revenue for its customers by reducing false-decline rates, and cut customer costs
      by over $1 billion. Its enterprise NPS exceeded 75 and customer retention was 99%, making
      it the only fraud prevention company on the Forbes Cloud 100 for five consecutive years
      (2021-2025). Revenue estimates from third-party databases (GetLatka, Growjo) converge around
      $103-$111M ARR for 2024. This represents 25.3% year-over-year growth from $82.3M in 2023,
      down sharply from the ~100% growth Forter claimed at the time of its May 2021 Series F.
      Revenue per employee approximates $165K at ~625 average headcount—a metric below best-in-class
      enterprise SaaS peers. By comparison, public competitor Riskified (NYSE: RSKD) reported
      $344.6M in full-year 2025 revenue with ~617 employees, implying $559K revenue per employee.
      The gap underscores Forter's lower revenue scale relative to its ostensibly comparable
      competitor, raising questions about Forter's operational leverage and sales efficiency.
      None of the ARR or growth estimates have been confirmed by Forter directly; the company
      does not publish quarterly or annual financial results.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
