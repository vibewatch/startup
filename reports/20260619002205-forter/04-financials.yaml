      - CI022

  - id: FI002
    title: Unit Economics Bridge — Revenue per Customer to Payback
    type: flow
    layout: standard
    summary: Illustrates the known and unknown links in Forter's unit economics chain from ACV to CAC payback.
    data:
      nodes:
        - id: avg-acv
          label: "Average ACV: $10.3K (all clients)"
          detail: "Third-party estimate from GetLatka; enterprise ACVs significantly higher ($100K–$1M+)"
        - id: gross-margin-per-customer
          label: Gross Margin per Customer (unknown)
          detail: Estimated gross margin × ACV; actual gross margin undisclosed
        - id: cac
          label: CAC (undisclosed)
          detail: Fully-loaded customer acquisition cost including sales, marketing, and onboarding; not disclosed
        - id: payback-period
          label: CAC Payback Period (undisclosed)
          detail: "CAC ÷ (ACV × gross margin); cannot be computed without CAC and gross margin data"
        - id: ltv
          label: LTV (undisclosed)
          detail: "Gross margin per customer × average contract life; 99% logo retention implies long average life"
        - id: ltv-cac
          label: LTV:CAC (undisclosed)
          detail: Cannot compute; both LTV and CAC are private evidence gaps
      edges:
        - from: avg-acv
          to: gross-margin-per-customer
          label: Gross margin × ACV
        - from: gross-margin-per-customer
          to: payback-period
          label: GM contribution per year
        - from: cac
          to: payback-period
          label: CAC is the payback numerator
        - from: payback-period
          to: ltv
          label: Payback anchors LTV horizon
        - from: ltv
          to: ltv-cac
          label: LTV:CAC ratio requires both inputs
    approximationNotes: >-
      All nodes marked "undisclosed" are genuine private-company evidence gaps; actual values
      may differ materially. $10.3K average ACV is a third-party estimate that includes a large
      SMB tail, likely significantly understating enterprise-segment economics.
    claimRefs:
      - CI005
      - CI024
      - CI025
      - CI023

  - id: FI003
    title: Financial Estimate Ranges — ARR, Valuation Multiple, and Burn Scenarios
    type: range
    layout: wide
    summary: Source-backed and benchmark-derived low/high ranges for key Forter financial inputs.
    data:
