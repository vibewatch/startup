  - id: unit-economics-and-cost-structure
    title: Unit Economics, Margins, and Cost Structure
    body: >-
      Forter's gross margin is not publicly disclosed. Based on peer benchmarks, fraud-decisioning
      SaaS platforms typically run 60–80% non-GAAP gross margins, driven by high automation
      and low marginal cost per decision. Riskified, the most direct public comparable, reported
      a 52–57% non-GAAP gross margin in 2025, constrained by its chargeback guarantee loss
      provision. Forter's chargeback guarantee similarly creates a cost-of-revenue drag whose
      scale depends on approved-transaction fraud rates. Customer acquisition cost (CAC),
      CAC payback period, and net revenue retention (NRR) are all undisclosed. Forter's 99%
      logo retention implies strong gross revenue retention, but NRR (which captures expansion
      and contraction within the existing customer base) is unknown. Enterprise fraud-prevention
      sales cycles typically run six to twelve months for contracts above $100K, and Forter's
      custom-quote model adds further complexity. The revenue-per-employee metric of approximately
      $165K is low relative to mature SaaS norms; however, this reflects Forter's concurrent
      investment phase. Operating expenses—split across R&D, sales and marketing, and G&A—are
      entirely undisclosed. Forter has likely not reached operating profitability: the company
      hired a four-time public company CFO with two prior IPO completions in March 2025, suggesting
      it is in the pre-IPO efficiency optimization phase rather than post-profitability. There is
      no public evidence of breakeven or positive EBITDA.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
