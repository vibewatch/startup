  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "Forter's audited GAAP gross margin and cost-of-revenue breakdown including chargeback guarantee loss provision"
      whyItMatters: "Gross margin is the single most important input for underwriting the business; without it, revenue quality and operating leverage are unknowable"
      diligencePath: "Obtain audited GAAP income statement from data room; request COGs breakdown showing chargeback loss reserve separately"
      relatedQuestionRefs:
        - QI005

    - type: private-evidence-only
      severity: blocking
      topic: operating-loss
      missingEvidence: "Forter's operating income/loss and adjusted EBITDA for FY 2024 and any available FY 2025 management accounts"
      whyItMatters: "Determines profitability timeline, capital dependency, and burn rate; cannot assess if five-year fundraising gap is strength or distress signal"
      diligencePath: "Request full GAAP income statement and adjusted EBITDA bridge; probe whether company is cash-flow neutral"
      relatedQuestionRefs:
        - QI013
        - QI021

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Current cash balance, monthly operating cash burn, and estimated runway"
      whyItMatters: "Five-year gap since last equity raise creates uncertainty about whether next equity event is fundraise, IPO, or distress scenario"
      diligencePath: "Request board-level financial model and bank statements confirming cash balance and burn trajectory"
      relatedQuestionRefs:
        - QI006
        - QI014

    - type: private-evidence-only
      severity: material
      topic: ARR
      missingEvidence: "Company-confirmed ARR or revenue figure for FY 2024 and FY 2025"
      whyItMatters: "All revenue data is third-party estimated; actual ARR could differ by 20%+, making valuation multiple analysis unreliable"
      diligencePath: "Obtain signed management confirmation of ARR as of most recent quarter; request monthly/quarterly subscription revenue schedule"
      relatedQuestionRefs:
        - QI003
        - QI004

    - type: private-evidence-only
      severity: material
      topic: chargeback-guarantee
      missingEvidence: "Actuarial loss rate on the guarantee book, outstanding contingent liability balance, and any reinsurance or backstop structure"
      whyItMatters: "An unquantified contingent liability can materially impair reported gross margin and represents tail risk in fraud spikes"
      diligencePath: "Request guarantee reserve schedule, loss history by quarter, fraud-loss rate on approved transactions, and any insurance backstop terms"
      relatedQuestionRefs:
        - QI008
        - QI019
        - QI022

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: "CAC, CAC payback, NRR, and LTV:CAC by customer cohort and segment"
      whyItMatters: "Cannot determine if Forter's growth motion is capital-efficient; 99% logo retention ≠ high NRR if expansion revenue is limited"
      diligencePath: "Request cohort-level retention analysis, S&M spend by segment, and new logo vs. expansion split in ARR growth"
      relatedQuestionRefs:
        - QI009
        - QI011

    - type: private-evidence-only
      severity: minor
      topic: geographic-mix
      missingEvidence: "Revenue breakdown by geography (US vs. international) and FX currency exposure"
      whyItMatters: "Riskified derives 46% of revenue internationally and reports FX headwinds; Forter's profile is unknown"
      diligencePath: "Request geographic revenue breakdown from management; assess USD vs. local-currency contract proportion"
      relatedQuestionRefs:
        - QI025

