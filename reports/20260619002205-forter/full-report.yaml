  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Forter's core value proposition is replacing binary fraud-versus-legitimate decisions with a continuous
              identity-trust assessment that covers every stage of the customer lifecycle — account creation, login,
              checkout, post-purchase returns, dispute filing, and promotion redemption. The platform is marketed as the
              "Trust Platform for digital commerce," reflecting a deliberate positioning away from a narrow fraud-tool
              framing toward a broader revenue-enablement and customer experience narrative. In practice, a merchant
              embeds Forter's JavaScript SDK and mobile SDKs into its storefront; the SDK collects approximately 2 KB
              behavioral events in real time and streams them to Forter's decision engine. At checkout, the engine
              queries the global identity graph, combines session behavior with historical profile data, and returns an
              approve/decline/review decision within a target latency of under 100 milliseconds. The chargeback
              guarantee model — where Forter bears financial liability for approved transactions that later chargeback —
              aligns Forter's revenue directly with merchant outcomes and establishes commercial trust. Merchants can
              query decisions through the portal or API and receive machine-readable rationale explaining which identity
              and behavioral signals drove the outcome, supporting audit, policy tuning, and customer service workflows.
              False declines — where legitimate transactions are incorrectly blocked — are the dominant adverse
              limitation; Forter's 2023 Trust Premium Report found 76% of consumers reported a negative online shopping
              experience, with false declines particularly affecting younger shoppers and eroding long-term loyalty.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
