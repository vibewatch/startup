  - id: FV001
    title: 'Recommendation Logic: Evidence Chain to Research-More'
    type: flow
    layout: standard
    summary: >-
      Chain of evidence from market scale, network moat, and revenue proof through valuation headwinds and disclosure
      gaps to the research-more recommendation.
    data:
      nodes:
        - id: market-scale
          label: Large TAM ($67–89B)
          detail: FDP market at 17–21% CAGR; e-commerce fraud losses $48B in 2025 alone
        - id: moat
          label: Identity Network Moat
          detail: 1.5B+ shopper profiles; 400K+ merchants; compounding cross-merchant network effects
        - id: proof
          label: Revenue Proof
          detail: $103M ARR (est.); 99% logo retention; Adobe, Nordstrom, Instacart anchor accounts
        - id: valuation-headwind
          label: Stretched Valuation
          detail: $3B mark = 29× ARR; Riskified public peer at 1.7× EV/TTM Revenue; 5-year-old mark
        - id: disclosure-gap
          label: Disclosure Gaps
          detail: No gross margin, NRR, profitability, or chargeback reserve disclosed publicly
        - id: ipo-signal
          label: IPO Signal
          detail: 'CFO Lejeal: 4× public company CFO; 2 IPO completions (Rally Software + Splunk era)'
        - id: recommendation
          label: Research-More
          detail: Await IPO filing, gross margin >60%, NRR >105%, or M&A announcement before committing
      edges:
        - from: market-scale
          to: recommendation
          label: supports
        - from: moat
          to: recommendation
          label: supports
        - from: proof
          to: recommendation
          label: partially supports
        - from: valuation-headwind
          to: recommendation
          label: constrains
        - from: disclosure-gap
          to: recommendation
          label: constrains
        - from: ipo-signal
          to: recommendation
          label: conditions
    approximationNotes: Flow weights are qualitative; no quantitative edge weightings applied.
    claimRefs:
