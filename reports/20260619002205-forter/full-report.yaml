chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Forter is a New York-headquartered SaaS company operating as the "Trust Platform for digital commerce."
              Founded in 2013, Forter provides real-time AI-driven fraud prevention, identity intelligence, and payment
              optimization for enterprise e-commerce, retail, fintech, food-and-beverage, and travel merchants. The
              company's core value proposition is allowing merchants to approve more legitimate transactions while
              blocking fraud — turning what has historically been a cost centre into a revenue enabler. Forter operates
              additional offices in Tel Aviv, London, and Paris, reflecting its global footprint and Israeli technology
              roots. The business model is subscription-SaaS with per-transaction components, anchored by chargeback
              guarantees that align Forter's economics directly with client outcomes. As of January 2026, Forter's
              platform is powered by a global network of over 400,000 online businesses and more than two billion
              shoppers, having processed in excess of $2 trillion in digital commerce transactions cumulatively. The
              company remains privately held; its last known valuation of $3 billion was set at the May 2021 Series F
              and no IPO filing or public-offering announcement had been made as of June 2026. Forter's 2026 "Agentic
              Intelligence" repositioning — including the Prism AI copilot and autonomous chargeback-response agents —
              marks a strategic pivot toward AI-native fraud operations for enterprise clients navigating increasingly
              automated commerce environments.
