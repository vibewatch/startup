              retention at 99% is consistent with high gross revenue retention but does not indicate whether existing
              customers are expanding module usage, reducing contract scope, or flat-renewing.

              Third-party review platforms corroborate satisfaction: FeaturedCustomers aggregates 4.8/5 from 3,364
              reference ratings; G2 shows 4.5/5 from 29 reviews (62% five-star; 0% below three stars); Capterra shows
