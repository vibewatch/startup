      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Network-Effect Identity Moat
            body: >-
              Forter's identity graph of 2 billion+ shopper profiles and 400,000+ business nodes constitutes a
              self-reinforcing network moat: each new merchant adds transaction data that improves decisioning accuracy
              for all merchants, while each incremental data point on a shopper identity increases approval confidence
              globally. Competitors launching from zero face a multi-year data-accumulation deficit that is difficult to
              bridge by technology alone. The January 2026 McDonald's partnership further extends the network into the
              world's largest QSR digital ecosystem, deepening the dataset with high-frequency, high-volume transaction
              signals in the food-delivery vertical. The chargeback guarantee model reinforces this moat by economically
              incentivising Forter to maintain high accuracy, not merely high throughput.
            calloutType: strength
            claimRefs:
