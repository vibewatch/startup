  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Alternatives
        blocks:
          - type: paragraph
            body: >-
              Forter operates in the e-commerce fraud prevention and identity intelligence market, where buyers can
              address the same job-to-be-done through several distinct paths: specialized fraud vendors,
              payment-processor-bundled tools, incumbent identity-data firms, open-source or internal rules engines, and
              manual review teams. Direct competitors offering guaranteed chargeback-liability models comparable to
              Forter include Signifyd (private, $1.34B valuation) and Riskified (NYSE: RSKD, $350M TTM revenue).
              AI-driven workflow platforms such as Sift round out the direct peer set for merchants seeking
              configurable, multi-use-case fraud management. Incumbent identity-data players — Kount (acquired by
              Equifax for $640M in 2021) and LexisNexis ThreatMetrix (5,000+ brands, 130M+ daily transactions) — compete
              primarily at financial institutions and large omnichannel retailers. Adjacent substitutes include Stripe
              Radar, which is bundled inside Stripe's payment stack and trained on $1.9T in annual payment volume, as
              well as Adyen's RevenueProtect and Visa's CyberSource, both embedded within their respective processor
              platforms. For mid-market and smaller merchants, SEON and NoFraud offer lower-cost, whitebox API-driven
              alternatives. The most underappreciated substitute remains the internal rules engine: many large
              enterprise merchants with dedicated fraud operations teams use rules-based systems as a baseline and view
              third-party vendors as optional enhancements. New AI-native entrants from well-funded fintechs and
              hyperscalers represent a latent threat that has not yet materialized into material market share
              displacement.
