  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - No IPO filing by Q4 2026
        - No S-1 or F-1 filed and macroeconomic conditions deteriorate through year-end 2026
        - Liquidity pathway narrows; down-round capital raise becomes more likely; $3B mark ages further
        - Pause new investment; monitor for fresh primary round or M&A announcement
      - - Down-round primary capital raise
        - New equity priced below $3B; Tiger Global or Sequoia marks down position
        - Confirms overvaluation; triggers liquidation preference reordering; common-share dilution materialises
        - 'Thesis break: exit any secondary position held; do not initiate new investment'
      - - ARR growth decelerates below 15% YoY
        - Disclosed or independently estimated ARR growth falls below 15% for two consecutive reporting periods
        - Multiple compression from mid-tier to floor (3–4×); valuation converges toward $375–500M range
        - Re-examine thesis; probe management for NRR, chargeback loss rate, and forward sales pipeline
      - - CFO Jim Lejeal departs within 18 months
        - Lejeal exits Forter before June 2026 with no IPO filed
        - IPO preparation signal reverses; governance concerns emerge; morale and hiring impact likely
        - Immediate diligence escalation; seek board and successor explanation before any commitment
      - - Chargeback reserve shortfall disclosed
        - >-
          Guarantee triggers a reserve shortfall reported at IPO or through a financing data room in recessionary or
          fraud-spike scenario
        - Cost-of-revenue drag materialises; P&L worse than estimated; revenue quality severely impaired
        - Re-evaluate gross margin; adjust base-case valuation down 30–50%; reconsider recommendation
    notes: >-
      Triggers are forward-looking and qualitative; thresholds are illustrative, not contractual. Down-round trigger
      assumes standard 1× non-participating liquidation preference for Series F preferred, which is typical but not
      confirmed for Forter.
    claimRefs:
