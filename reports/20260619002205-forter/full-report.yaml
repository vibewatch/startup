  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Forter monetizes through a GMV-based SaaS subscription: merchants pay a percentage of approved gross
              merchandise value (GMV) or on a per-approved-transaction basis, scaled by monthly transaction volume and
              augmented by premium module add-ons. The platform is modular—core fraud prevention, account protection,
              payment optimization, abuse prevention, and a chargeback guarantee each carry separate pricing. Forter
              does not publish per-transaction or percentage-of-GMV rates; all contracts are custom quotes negotiated
              with the sales team. Annual contract values span from low five-figures (smaller merchants) to mid-six
              figures or higher for large-scale enterprise clients. GetLatka estimates average ACV at $10.3K across
              Forter's reported ~10,000 customers, reflecting a long-tail SMB customer base alongside a smaller roster
              of high-ACV enterprise accounts. Multi-year commitments and prepayment typically unlock discounts.
              Implementation, onboarding, and dedicated support are separately scoped costs that affect total contract
              value. The chargeback guarantee module is distinctive: Forter assumes direct financial liability for
              approved transactions subsequently disputed as fraudulent, shifting the risk exposure from merchant to
              Forter. This creates a contingent liability on Forter's balance sheet whose magnitude is undisclosed.
              Pricing for the guarantee module is expected to carry higher margins as a risk-premium, but the reserve
              methodology and actuarial assumptions are private.
