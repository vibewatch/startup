      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Forter's exit readiness has improved materially since mid-2024 but retains critical gaps relative to
              IPO-stage expectations. On the positive side: Jim Lejeal's March 2025 appointment brings direct IPO
              execution experience (two completions, including Rally Software); Cyndy Lobb's simultaneous hire as CPO
              (formerly Square Commerce Platform) provides a product narrative suited for public investors; the company
              is listed on Forge Global and UpMarket secondary market platforms, signalling institutional awareness; and
              pre-IPO watchlist placement at ipos.fyi confirms tracker coverage. Secondary market indications near
              $3–3.5B with a typical 15–35% discount imply that sophisticated secondary buyers see real but uncertain
              upside from the current mark.

              Against this, key diligence blockers remain. Audited gross margin is unavailable and the chargeback
              guarantee reserve has never been publicly quantified. NRR has never been disclosed — 99% logo retention is
              gross retention, not net expansion, and NRR below 100% would recast Forter's revenue quality thesis. The
              Series F preferred stock liquidation preference and participation rights are not publicly available and
              could create material common-share dilution in a sub-$3B exit event. No IPO filing has been confirmed as
              of June 2026. The CFO's comment about leading finance operations through "the next stage of growth" could
              signal a multi-year IPO runway rather than an imminent offering. Revenue per employee of ~$154K versus
              Riskified's ~$559K also points to pre-IPO operational restructuring ahead. The strategic acquisition
              pathway is viable — Equifax, FIS, Visa, PayPal, and Mastercard have all historically acquired fraud and
              identity data assets — but a sale at below $3B would activate liquidation preference protection,
              potentially concentrating proceeds with late-stage preferred holders at the expense of common shareholders
              and employees.
