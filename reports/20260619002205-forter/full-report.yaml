      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The primary demand driver is the rapid escalation of fraud sophistication enabled by AI. Juniper Research
              documents that deepfakes and synthetic identities allow fraudsters to scale attacks and overwhelm
              rules-based systems; global e-commerce fraud is projected to rise from $48B in 2025 to $107B by 2029.
              Synthetic identity document fraud surged 311% between Q1 2024 and Q1 2025 (Sumsub). The emergence of AI
              shopping agents — autonomous software acting on behalf of consumers — eliminates many behavioral cues used
              by legacy fraud engines, creating structural demand for identity-graph-based decisioning. At NRF 2026,
              Forter documented that item-not-received claims at one major retailer had grown to roughly 1% of total
              sales volume, indicating how AI-assisted coordinated fraud is scaling.


              Regulatory tailwinds are a second structural driver. The EU PSD2 Strong Customer Authentication mandate
              achieved approximately 55% reduction in card-not-present fraud in compliant markets; liability shifted to
              issuers for authenticated transactions. The forthcoming EU PSD3 framework extends this regulatory
              pressure. First-party or friendly fraud now accounts for 36% of all global fraud cases (MRC 2026), more
              than doubling year-on-year, expanding the protection budget beyond payment fraud into policy and dispute
              management.


              Adoption constraints are material. Forty-one percent of North American merchants still rely on manual
              processes for fraud prevention as of 2025 (LexisNexis). Data fragmentation across issuers, merchants, and
              PSPs limits signal quality for any single vendor. Integration and switching costs for enterprise platforms
              typically require 6–12 month deployment cycles and dedicated engineering resources. A persistent paradox
              flagged by multiple independent observers (PYMNTS, LexisNexis, Entersekt) is that fraud prevention systems
              can erode customer experience through false declines: 64% of North American merchants report that fraud
              controls hurt customer conversion rates, and poor user experience is the primary abandonment driver at
              new-account creation for 36–37% of respondents. These constraints favor incumbents and PSP-bundled tools
              over challenger platforms, even where challenger performance data is superior.
