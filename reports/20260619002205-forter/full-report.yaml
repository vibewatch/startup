      - number: '5.4'
        title: Data and ML Flywheel
        blocks:
          - type: paragraph
            body: >-
              Forter's primary competitive moat is the data network effect created by its shared merchant consortium
              model. Every merchant that joins the network contributes anonymized behavioral and identity signals back
              into the global graph, improving detection accuracy for all participants. With 400,000+ merchants and 2
              billion+ consumer profiles, a single fraudster who attacks one merchant triggers enriched risk signals
              across the entire network instantly. The platform stores approximately 25 billion small behavioral events
              — roughly 2 KB each — captured during shopper sessions; when a purchase is initiated, the engine pulls
              session history, historical profile data, and cross-merchant signals in milliseconds to construct a trust
              score. Machine-learning models cover device fingerprinting, behavioral anomaly detection, buyer-seller
              collusion, address manipulation, card testing, and social-engineering proxy patterns. Model refresh cycles
              are continuous; the October 2024 release documented measurable accuracy improvements without a named model
              version, suggesting an MLOps pipeline with frequent shadow deployments and gradual traffic shifts. A
              critical dependency of the flywheel is that the quality of the identity graph degrades without continued
              merchant onboarding and that the network's signal richness is most concentrated in North American
              e-commerce; European and emerging-market coverage breadth remains an unverified gap. With AI-driven fraud
              automation up 202% year-over-year as of December 2025, the model refresh cadence and adversarial
              robustness of the underlying models are material to the platform's value retention.
            claimRefs:
              - CE021
              - CE022
              - CE023
              - CE024
              - CE025
      - number: '5.5'
        title: Integrations, Ecosystem, and Partnerships
        blocks:
          - type: paragraph
            body: >-
              Forter participates in a multi-tier integration ecosystem spanning e-commerce platforms, payment
              infrastructure, and strategic technology partners. On the e-commerce platform side, Forter joined the
              Shopify Plus Certified App Program in October 2023, enabling native integration for Shopify Plus merchants
              with reported outcomes of 72% chargeback reduction and 46% false-decline reduction. Forter is a Salesforce
              Commerce Cloud certified partner, with documented fast-implementation deployments at merchants including
              SNIPES. Adobe Commerce (Magento) integration is available natively. On the payment and security layer,
              Forter expanded its partnership with Very Good Security (VGS) in 2026 to build trusted agentic-commerce
              credentials combining Forter's real-time identity intelligence with VGS's neutral tokenization
              infrastructure, enabling trust signals to travel with payment tokens across agent-to-merchant flows.
              Forter has engaged with Google on the Agent Payments Protocol to establish industry standards for agentic
              commerce security. The AWS Global Partnership gives Forter access to co-sell motions in the AWS
              Marketplace and the ISV Accelerate go-to-market program. Forter's Partner Program, formally launched in
              prior years, now covers financial institutions, marketplace operators, ISVs, payment service providers,
              system integrators, and consultancies. The developer surface includes REST APIs, iOS/Android/JavaScript
              SDKs, a developer portal at docs.forter.com, and open-source platform plugins for Magento2 and Salesforce
              B2C on GitHub (github.com/forter).
