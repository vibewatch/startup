      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Chargeback Guarantee — Unquantified Balance Sheet Liability
            body: >-
              Forter's chargeback guarantee is its most distinctive product feature and its most opaque financial risk.
              The aggregate reserve held against guarantee obligations is not disclosed. An AI model accuracy decline or
              new fraud vector (e.g., AI-generated synthetic identity attacks) could trigger a rapid reserve increase
              that strains the balance sheet without external visibility. Any investor or enterprise client diligence
              process should require full actuarial reserve methodology disclosure as a pre-condition for commitment.
            calloutType: risk
            claimRefs:
              - CR032
              - CR015
              - CR036
          - type: callout
            title: EU AI Act — Material Compliance Risk for EU Deployments
            body: >-
              Forter's fraud-scoring AI is almost certainly classified as a high-risk system under EU AI Act Annex III.
              Full conformity obligations are enforceable December 2027, but the preparatory work—risk management
              system, data governance, human oversight controls, third-party audit, and EU database registration—must be
              completed substantially in advance. Forter has not publicly disclosed any EU AI Act readiness assessment.
              Failure to comply exposes Forter and its EU merchant clients to fines of up to €35M or 7% of global
              turnover. EU-deployed clients should require Forter to produce an EU AI Act readiness roadmap with
              milestone dates before contract renewal.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR016
          - type: callout
            title: Diligence Priority — Four Non-Negotiable Information Requests
            body: >-
              Four items are thesis-critical and require direct management disclosure before any capital commitment: (1)
              chargeback guarantee reserve methodology and aggregate exposure as of the most recent quarter; (2) EU AI
              Act conformity assessment status and roadmap; (3) co-founder succession plan and key-person insurance
              coverage for all three founders; (4) cloud infrastructure architecture and business continuity plan
              including cloud provider identity, RTO/RPO commitments, and DR test results. All four are resolvable
              through a structured management interview and data-room access; their absence from public disclosures is
              not itself a red flag but does make off-market independent assessment impossible.
