      - number: '7.5'
        title: People, Execution, and Strategic Risk
        blocks:
          - type: paragraph
            body: >-
              Forter's co-founder cluster represents a material key-person dependency. Michael Reitblat (CEO), Liron
              Damri (President), and Alon Shemesh (Chief Analyst) have served continuously since the company's 2013
              founding, hold the strategic, commercial, and technical knowledge that defines the product and culture,
              and collectively represent the primary investor-relationship interface. No succession plan has been
              publicly disclosed for any of the three positions. The concentration of founding-team leadership in three
              individuals who are childhood friends and military intelligence alumni from the same unit creates a unique
              correlated departure risk: events that affect one co-founder's motivation (IPO disappointment, strategic
              disagreement, outside opportunity) may affect all three simultaneously.

              The 2026 Agentic Intelligence pivot expands execution risk. Shipping autonomous AI agent products (Prism
              copilot, autonomous chargeback-response agents) requires capabilities—agent orchestration, safety
              evaluation, governance frameworks—that are distinct from core fraud-decisioning competency. Gartner's
              forecast that 40% of agentic AI enterprise projects will fail or be abandoned by 2027 frames the execution
              risk: if Forter fails to deliver on the agentic narrative, it risks both market credibility and potential
              client disappointment among early adopters who entered expanded contracts based on future-product
              commitments.

              Governance opacity is a structural strategic risk. Board composition, individual director identities,
              committee structures, investor rights agreements, and anti-dilution provisions are all private. The
              absence of public governance information makes it impossible for clients, partners, or co-investors to
              assess whether effective oversight of management and capital allocation is in place. A contested IPO
              process or investor disagreement over timing or valuation could surface latent governance tensions.

              The financial engineering risk of an IPO exit path adds complexity. If Forter pursues an IPO in a market
              environment where comparable public companies trade at 5–6x revenue, a haircut of 70%–80% from the $3
              billion private mark is mathematically plausible. Such a scenario could affect employee equity motivation,
              trigger option plan restructuring, and create retention risk in technical and sales talent—precisely at
              the moment when the agentic AI pivot requires the most focused execution.
