  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication
      - Diligence Ask
    rows:
      - - AI-powered fraud escalation (deepfakes, synthetic IDs, credential automation)
        - Driver
        - Active and accelerating 2025–2026
        - Demand for network-effect-based AI decisioning over static rules; drives platform over point-solution adoption
        - >-
          Quantify Forter attack-type coverage breadth vs. AI-generated fraud vectors; ask for win-rate on AI-fraud
          incidents
      - - First-party / friendly fraud growth (36% of all fraud by 2026)
        - Driver
        - Active and accelerating
        - >-
          Expands total protection budget beyond payment fraud into dispute management, return policy, and post-purchase
          tools
        - Validate Forter win rates and contract penetration in friendly-fraud-heavy verticals (e.g. retail, travel)
      - - PSD2 / SCA regulatory mandate (EU enforcement fully active)
        - Driver
        - Fully enforced; PSD3 approaching
        - >-
          Structural compliance budget line; ~55% reduction in CNP fraud in EU; liability shift to issuers for SCA
          transactions
        - Assess Forter Smart 3DS and PSD3 readiness; ask for EU merchant win-rate and renewal rate data
      - - Agentic commerce — AI shopping agents replacing human interactions
        - Driver
        - Emerging and growing in 2026
        - >-
          Eliminates behavioral cues; creates new fraud surface requiring identity-graph-level trust for agent-driven
          transactions
        - >-
          Assess Forter's agent-traffic detection capabilities; request evidence of customer demand and deployed use
          cases
      - - False-decline cost awareness ($443B/year globally, 9x actual fraud losses)
        - Driver
        - Growing awareness 2025–2026
        - >-
          Expands ROI framing from fraud-prevention cost center to revenue-maximization platform; supports premium
          pricing
        - Request Forter's false-decline rate guarantee terms and merchant contract data showing revenue uplift
      - - High switching costs and integration complexity for enterprise platforms
        - Constraint
        - Persistent structural
        - Incumbent stickiness; favors PSP-bundled tools and any vendor with an existing platform footprint
        - Map Forter's time-to-value vs. incumbent; compare integration cost to Stripe Radar or Adyen bundled tools
      - - Manual process incumbency (41% of NA merchants in 2025)
        - Constraint
        - Declining slowly
        - >-
          Large share of market not yet automated; but Forter's enterprise focus means this segment is secondary
          priority
        - >-
          Understand how Forter addresses onboarding cost and migration risk for enterprises switching from manual
          processes
      - - Data fragmentation (issuers, merchants, PSPs operate in separate silos)
        - Constraint
        - Structural; collaborative models nascent
        - >-
          Limits individual-vendor signal quality; Forter's consortium model is a partial solution but cannot solve
          issuer-side gaps alone
        - Evaluate size and coverage of Forter's merchant consortium; ask about issuer data-sharing agreements
    notes: >-
      Timing assessments based on public evidence as of June 2026. Driver/constraint severity is an analytical judgment
      informed by cited sources; diligence asks are required to validate Forter-specific positioning for each item.
