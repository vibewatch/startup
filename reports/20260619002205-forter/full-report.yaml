            body: >-
              Forter's $3B last-known valuation (May 2021) implies ~29× 2024E ARR. The closest public peer, Riskified
              (RSKD), currently trades at approximately 1.7× EV/TTM Revenue. Even applying the premium AI-native
              fraud-platform multiple of 8–15× ARR to Forter's $103M estimate yields $820M–$1.55B — a 48–73% discount to
