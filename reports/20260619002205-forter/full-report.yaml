  - id: FI001
    title: Revenue Model Bridge — GMV to Gross Profit
    type: flow
    layout: standard
    summary: >-
      How merchant transaction volume converts into Forter's SaaS subscription revenue and estimated gross profit
      contribution.
    data:
      nodes:
        - id: merchant-gmv
          label: Merchant GMV
          detail: Total e-commerce orders processed through Forter decisioning engine
        - id: decisioning-engine
          label: AI Decisioning Engine
          detail: Real-time approve/decline decision per transaction; chargeback guarantee attaches to approved transactions
        - id: subscription-revenue
          label: Subscription Revenue
          detail: '% of approved GMV or per-transaction fee; tiered by volume'
        - id: module-revenue
          label: Module Add-on Revenue
          detail: Account protection, abuse prevention, payment optimization — additional fees beyond core fraud module
        - id: cogs
          label: Cost of Revenue
          detail: Infrastructure, data costs, model training, chargeback loss provisions (guarantee module)
        - id: gross-profit
          label: Gross Profit
          detail: Estimated 60–80% gross margin range based on peer benchmarks; actual undisclosed
        - id: opex
          label: Operating Expenses
          detail: R&D, sales & marketing, G&A; undisclosed; likely exceeds gross profit at current scale
        - id: operating-loss
          label: Operating Loss (est.)
          detail: Forter not confirmed profitable; operating loss magnitude unknown
      edges:
        - from: merchant-gmv
          to: decisioning-engine
          label: Transaction volume feed
        - from: decisioning-engine
          to: subscription-revenue
          label: Volume-tiered fee applies to approved transactions
        - from: decisioning-engine
          to: module-revenue
          label: Add-on modules activate additional pricing layers
        - from: subscription-revenue
          to: cogs
          label: Revenue recognized; COGS deducted
        - from: module-revenue
          to: cogs
          label: Module revenue; guarantee loss provision in COGS
        - from: cogs
          to: gross-profit
          label: Gross margin residual
        - from: gross-profit
          to: opex
          label: OpEx funded from gross profit
        - from: opex
          to: operating-loss
          label: Excess OpEx over gross profit = operating loss
    approximationNotes: >-
      Gross margin estimate of 60–80% is based on Riskified (52–57%) and general fraud-SaaS benchmarks; actual Forter
      gross margin is undisclosed. Operating loss is inferred; Forter has not confirmed profitability.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI020
      - CI022
  - id: FI002
    title: Unit Economics Bridge — Revenue per Customer to Payback
    type: flow
    layout: standard
    summary: Illustrates the known and unknown links in Forter's unit economics chain from ACV to CAC payback.
    data:
      nodes:
        - id: avg-acv
          label: 'Average ACV: $10.3K (all clients)'
          detail: Third-party estimate from GetLatka; enterprise ACVs significantly higher ($100K–$1M+)
        - id: gross-margin-per-customer
          label: Gross Margin per Customer (unknown)
          detail: Estimated gross margin × ACV; actual gross margin undisclosed
        - id: cac
          label: CAC (undisclosed)
          detail: Fully-loaded customer acquisition cost including sales, marketing, and onboarding; not disclosed
        - id: payback-period
          label: CAC Payback Period (undisclosed)
          detail: CAC ÷ (ACV × gross margin); cannot be computed without CAC and gross margin data
        - id: ltv
          label: LTV (undisclosed)
          detail: Gross margin per customer × average contract life; 99% logo retention implies long average life
        - id: ltv-cac
          label: LTV:CAC (undisclosed)
          detail: Cannot compute; both LTV and CAC are private evidence gaps
      edges:
        - from: avg-acv
          to: gross-margin-per-customer
          label: Gross margin × ACV
        - from: gross-margin-per-customer
          to: payback-period
          label: GM contribution per year
        - from: cac
          to: payback-period
          label: CAC is the payback numerator
        - from: payback-period
          to: ltv
          label: Payback anchors LTV horizon
        - from: ltv
          to: ltv-cac
          label: LTV:CAC ratio requires both inputs
    approximationNotes: >-
      All nodes marked "undisclosed" are genuine private-company evidence gaps; actual values may differ materially.
      $10.3K average ACV is a third-party estimate that includes a large SMB tail, likely significantly understating
      enterprise-segment economics.
