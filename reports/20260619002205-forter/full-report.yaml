      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Forter's buyer universe is anchored in enterprise-grade digital commerce operators processing high volumes
              of card-not-present transactions. Documented customer verticals include branded retail (Otto Group,
              Revolve, thredUP), luxury and fashion (Yoox Net-a-Porter), digital marketplaces (The Hut Group), travel
              and ticketing platforms, and financial services companies. The platform's contractual fraud guarantee and
              network-effect pricing model are most economically viable for merchants transacting at scale — typically
              above $100M GMV — making large enterprises the primary commercial target.


              Budget ownership for fraud prevention sits primarily with VP or Director of Fraud and Risk, with secondary
              influence from the Chief Revenue Officer (revenue-protection framing), CFO (cost-reduction framing), and
              CTO or VP Engineering (integration and infrastructure framing). Procurement is a multi-stakeholder process
              typically requiring 3–9 months at the enterprise tier. LexisNexis survey data from 569 fraud and risk
              executives confirms that fraud teams, finance teams, and technology departments are all involved in vendor
              selection.


              Adoption triggers include a material fraud incident such as an account-takeover event or chargeback ratio
              breach, a platform migration, a competitive RFP triggered by loss of confidence in incumbent tools, or
              recognition of the false-decline cost paradox — that overly conservative rule engines cost more in lost
              revenue than the fraud they prevent. Riskified estimates that false declines cost global retailers $443B
              annually, nine times the direct cost of fraud, which represents a compelling ROI argument for automated
              trust platforms. Mobile commerce, accounting for approximately 59% of global e-commerce GMV and 33% of US
              fraud costs, is creating additional adoption pressure as legacy rule engines trained on desktop behavioral
              signals underperform on mobile traffic.
