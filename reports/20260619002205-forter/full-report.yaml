      - number: '5.6'
        title: Security, Privacy, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Forter holds four major security and privacy certifications audited by independent third parties: PCI DSS
              Level 1 (highest level for payment data handlers), SOC 2 Type II (operational effectiveness for security,
              availability, confidentiality, and privacy controls), ISO 27001 (information security management system),
              and ISO 27701 (privacy information management, GDPR-aligned). ISO 27001 and ISO 27701 were granted in
              April 2023 following a rigorous audit covering risk management, business continuity, access controls,
              incident management, and compliance with GDPR and CCPA. The company also achieved the AWS Retail
              Competency certification, which requires passing security and performance standards tailored for retail
              workloads. The European data center in Ireland provides GDPR-compliant data residency for EU customers.
              External penetration testing is conducted continuously by third-party partners, with verified
              vulnerabilities remediated and retested. Forter's Privacy and Security Hub publishes certification status,
              but the hub page is rendered client-side with minimal crawlable content, limiting independent verification
              of current scope. Key compliance gaps include no publicly disclosed SOC 3 report, no named penetration
              testing firms, and no published SLA or uptime commitment outside the AWS partnership page. CCPA compliance
              is claimed but not independently certified. The combination of PCI Level 1, SOC 2 Type II, and ISO 27701
              covers the requirements of most enterprise e-commerce merchants and financial institutions.
