      - number: '3.3'
        title: Capability, Pricing, and GTM Comparison
        blocks:
          - type: paragraph
            body: >-
              The core buying criteria for enterprise fraud-prevention decisions are: real-time decisioning latency,
              chargeback guarantee (financial liability shift), explainable AI and audit trail, coverage across fraud
              types (payment fraud, account takeover, policy abuse, promo abuse), payment-processor independence, and
              integration complexity. Forter and Signifyd both offer fully automated real-time decisioning with
              chargeback guarantees; Riskified matches this model and has invested explicitly in explainable AI to serve
              compliance-heavy buyers. Sift covers the widest use-case set (payment fraud through content integrity) but
              has historically provided less financial guarantee than the top three. Kount and ThreatMetrix are strong
              on device intelligence and identity data but lag the specialists on out-of-the-box chargeback guarantees
              for e-commerce. Stripe Radar excels on ease of setup and network scale but lacks payment-processor
              independence — merchants who do not use Stripe cannot access it. On pricing, Forter operates on a fully
              custom, negotiated model with no published per-transaction rate; the median contract is cited at
              approximately $8,000/year with enterprise deployments reaching six figures. Signifyd similarly negotiates
              per-volume pricing across three modules. Riskified charges a GMV percentage that aligns platform
              incentives with merchant revenue. Stripe Radar is embedded in Stripe's processing fees with no separate
              fraud-detection charge. SEON starts at a published API price, making it more transparent and accessible to
              mid-market buyers. From a GTM standpoint, Forter, Signifyd, and Riskified all pursue direct enterprise
              sales, while Stripe Radar grows through Stripe's developer-led adoption flywheel — a fundamentally
              different and harder-to-replicate distribution motion.
