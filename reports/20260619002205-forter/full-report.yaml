  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >
              Forter operates within the digital commerce trust market, a focused segment of the broader fraud detection
              and prevention (FDP) industry defined by real-time decisioning at the point of digital interaction —
              checkout, account creation, login, promotions, returns, and loyalty redemptions. The core market includes
              payment fraud prevention, account takeover (ATO) protection, policy and return abuse management, loyalty
              fraud mitigation, and identity verification for online merchants. Excluded from the core scope are offline
              point-of-sale fraud, traditional anti-money-laundering for banks, and enterprise identity governance for
              workforce access management.


              Forter's total addressable market encompasses any digital commerce operator that processes
              card-not-present transactions or manages consumer accounts online across e-commerce, marketplace, travel,
              digital goods, and financial services verticals. Adjacent markets include chargeback management services,
              payment orchestration, buy-now-pay-later risk, and the broader cybersecurity perimeter. Status-quo
              alternatives include in-house rule engines maintained by internal fraud teams, network-level tools bundled
              by payment processors (Stripe Radar, Adyen RevenueProtect), and standalone identity-verification vendors.


              The digital commerce trust market is a subsegment of the full FDP universe. Broader FDP market figures
              cited by most analysts encompass banking AML, insurance fraud, and government fraud — inflating the
              headline TAM. Forter's serviceable space is the e-commerce and digital-commerce layer, estimated by
              analysts at $73–89B in 2026 at the e-commerce scope and $40–70B at the narrower product-scope definitions,
              as documented in the market definition and sizing tables below.
            claimRefs:
              - CM001
              - CM002
