      - number: '5.7'
        title: Implementation Complexity, Roadmap, and Adverse Considerations
        blocks:
          - type: paragraph
            body: >-
              Forter's implementation model relies on JavaScript SDK embedding plus API integration, with
              platform-specific connectors available for Shopify, Salesforce, and Magento reducing engineering lift for
              merchants on those platforms. For mid-sized merchants, integration typically takes several weeks; for
              complex multi-PSP, multi-channel enterprise deployments, the timeline extends to two to three months,
              according to procurement intelligence data from Vendr. Annual contract values range from approximately
              $8,000 for smaller deployments to $375,000+ for large enterprise agreements, structured around approved
              transaction volume or GMV rather than a per-transaction fee. Roadmap highlights through 2026 include: the
              European data center (October 2024), ML model expansion for address manipulation and ATO detection
              (October 2024), Agentic Activity dashboards, Forter Prism AI copilot (December 2025), expanded VGS agentic
              commerce partnership (2026), and Trusted Agentic Commerce Protocol development (ongoing 2026). The most
              significant adverse consideration is that Forter's 2023 consumer research found 76% of respondents
              experienced a negative online shopping experience attributable partly to false declines, and Forter's own
              industry data frames false declines as a "silent liability" costing 9–30x the value of fraud losses. While
              Forter positions this as a market opportunity, independent analysts and competitive reviews note that
              implementation tuning and policy calibration require sustained merchant effort, and the improving
              false-decline rate is a competitive battleground where Signifyd and Riskified actively compete. The lack
              of a published sub-SLA or public status page is a minor gap for enterprise buyers evaluating service
