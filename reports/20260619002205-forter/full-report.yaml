              dynamic: it generates new fraud surface requiring new identity-infrastructure capabilities, while also
              potentially challenging the human-behavioral-signal foundation of Forter's identity graph. Forter has
              positioned this as a core opportunity, but the pace and direction of agentic commerce adoption introduce
              material uncertainty into near-term market sizing and product-fit arguments that due diligence should
              stress-test.
