            body: >-
              A track or buy recommendation requires at minimum: (a) audited ARR > $130M, (b) gross margin > 60%, (c)
              NRR > 105%, (d) confirmed IPO filing or M&A letter of intent, and (e) Series F liquidation preference
              disclosed and manageable relative to exit scenarios. Without these disclosures, the $3B mark cannot be
