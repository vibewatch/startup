      - number: '2.2'
        title: Market Sizing and Forecasting
        blocks:
          - type: paragraph
            body: >
              Multiple independent analyst firms have published 2026 market size estimates for the fraud detection and
              prevention space, with values ranging from $40.4B (Grand View Research, narrowest product scope) to
              $88.77B (Business Research Company, e-commerce-specific FDP). The dispersion is methodological rather than
              factual error: broader estimates include banking AML and insurance fraud, while narrower estimates
              restrict to e-commerce payment fraud tooling. Fortune Business Insights places the broad FDP market at
              $67.12B for 2026, growing to $243.72B by 2034 at a 17.5% CAGR. Mordor Intelligence's $70.19B and Straits
              Research's $81.62B span the mid-range. The e-commerce-specific Business Research Company estimate of
              $88.77B at 20.8% CAGR captures the layer most directly relevant to Forter.


              Below the full FDP market, adjacent sub-pools add context without double-counting: the digital identity
              verification market is estimated at $14B in 2026 at a 14.6% CAGR (Market.us), and the account takeover
              protection segment reaches $7.46B in 2026 at an 18.89% CAGR (Global Growth Insights). These pools
              partially overlap with core FDP but confirm deep enterprise investment across the trust stack.


              Forter's serviceable addressable market (SAM) has not been published by any independent analyst. An
              evidence-constrained estimate based on Forter's disclosed $500B+ annual GMV processing and market-average
              fraud-prevention spend of 0.3–1% of GMV yields an indicative SAM of $1.5–5B in annual contracted revenue
              at Forter's current network size, scaling toward $8–15B as adoption expands to the full enterprise
              e-commerce tier. This estimate carries low confidence and functions as a reasoning floor, not a sourced
              datum. Diligence should obtain verified SAM sizing from Forter management directly. The underlying
              e-commerce GMV total market reached $6.88 trillion in 2026, establishing the scale of the transaction pool
              subject to fraud risk. Global e-commerce fraud losses hit $48B in 2025 alone, and are on a trajectory
              toward $107B annually by 2029, with cumulative 2023–2027 losses estimated at $343–362B.
