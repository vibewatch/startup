  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR and revenue disclosure
        - Audited ARR for 2024 and 2025 with cohort-level breakdown
        - >-
          All current estimates are third-party; ARR could be materially different; gross vs. net ARR distinction
          unverifiable
        - Request from Forter management under NDA; confirm with external audit firm
      - - Gross margin and unit economics
        - Disclosed COGS including chargeback reserve charges, data infrastructure costs, and guarantee claims paid
        - True gross margin unknown; chargeback guarantee creates actuarial cost that could suppress margins to 50–60%
        - Management disclosure; benchmark against Riskified's disclosed 52% non-GAAP gross margin
      - - Net Revenue Retention
        - Cohort-level NRR by vintage year, ideally 2020–2025
        - >-
          99% logo retention is gross retention, not expansion; NRR below 100% recasts Forter as contraction risk rather
          than expansion asset
        - Forter management data room; validate via customer interviews with key accounts
      - - Series F cap-table waterfall
        - 'Preferred stock terms: liquidation preference multiples, participation rights, anti-dilution provisions'
        - At a sub-$3B exit, preferred investor recovery could leave common shareholders with near-zero proceeds
        - Cap table from Forter legal counsel; independent term-sheet review by legal due diligence firm
      - - IPO timeline and process
        - S-1/F-1 draft or confidential filing status; underwriter selection; path to public markets timeline
        - >-
          CFO hire is constructive signal but insufficient; a 2–3 year IPO runway changes the risk/return calculus
          materially
        - Board and management discussion; monitor SEC EDGAR for S-1 filings under Forter Inc.
      - - Chargeback reserve actuarial data
        - >-
          Reserve methodology, historical chargeback loss rates, stress-test scenarios for recession and fraud-spike
          conditions
        - Guarantee is Forter's core differentiator but also its largest unquantified contingent liability
        - >-
          Management actuarial report; review by independent loss-reserve specialist; compare to Riskified's gross
          margin trend
    notes: >-
      Items 1–3 are prerequisite to any valuation model; items 4–6 are prerequisite to underwriting any exit scenario.
      Without these, the research-more recommendation cannot advance to track or buy.
    claimRefs:
      - CV046
      - CV040
      - CV041
