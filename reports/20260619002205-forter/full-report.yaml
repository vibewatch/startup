      - number: '8.2'
        title: Valuation Context and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Forter last raised $300M in a Series F led by Tiger Global Management in May 2021 at a $3B post-money
              valuation — a round in which the company's valuation tripled from the Series E six months earlier. The
              investor syndicate includes Bessemer Venture Partners, Sequoia Capital, Third Point Ventures, Adage
              Capital Management, March Capital, NewView Capital, and Salesforce Ventures. Total capital raised across
              six rounds stands at $525M. No new primary equity round has been closed since May 2021, meaning the $3B
              mark has neither been confirmed nor reset for over five years. Secondary market data from Forge Global and
              UpMarket indicates trading indications in the $3.0–3.5B range, with typical 15–35% discounts reflecting
              illiquidity and IPO-delay risk rather than a market-discovered price discovery process.

              The most directly comparable publicly traded peer is Riskified (NYSE: RSKD). In Q1 2026, Riskified
              reported $88.3M in revenue (+7% YoY), TTM revenue of $350.5M, and raised full-year 2026 revenue guidance
              to $376–384M. The company achieved its first GAAP profitability milestone in Q4 2025 and trades at
              approximately $4.97/share with a market cap near $850–900M and an enterprise value of approximately
              $570–620M (net of $276M cash, zero debt). This equates to an EV/TTM Revenue of roughly 1.7× — a multiple
              reflecting Riskified's slower growth (~7% YoY), improving-but-not-yet-validated profitability, and the
              sector-wide multiple reset of 2022–2025. Riskified operates at 3.4× Forter's revenue scale; even granting
              Forter a 2× growth premium over Riskified's implied multiple, the resulting $3–4× EV/Revenue would yield
              $309–412M — well below the $3B mark.

              The fraud decisioning and orchestration sub-sector benchmarked by Windsor Drake commands 8–15× public
              EV/Revenue and 10–20× private ARR multiples for AI-native platforms. Comparable M&A transactions from
              2024–2025 calibrate exit floors: Thoma Bravo's $5.3B acquisition of Darktrace at ~8.1× revenue, Permira's
              $1.3B stake in BioCatch at ~8.1× ARR, and Feedzai's $2B Series E valuation (October 2025). At the lower
              end, Experian's $350M acquisition of ClearSale implied ~3.5× revenue and Entrust's purchase of Onfido at
              $400–650M implied 3–4.5× — consistent with regional leaders or data-asset acquisitions rather than
              category-leader exits. Applied to Forter's $103M 2024E ARR, the comparable M&A floor of 8.1× yields
              ~$835M, and the premium private-tier ceiling of 15× yields ~$1.55B — both substantially below $3B.
