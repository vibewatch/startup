          - type: callout
            title: Stale Valuation and Founder Key-Person Concentration
            body: >-
              Two structural risks require diligence attention. First, Forter's $3 billion valuation was set in May 2021
              at peak post-pandemic e-commerce SaaS multiples; with no subsequent disclosed round and 2024 ARR of ~$103
              million, the implied 29x ARR multiple today is substantially compressed relative to public-market comps
              for fraud-prevention software. No credible current-mark anchor exists in the public record. Second, all
              three co-founders — Reitblat, Damri, and Shemesh — have served continuously since 2013 and no succession
              or key-person risk-mitigation plan has been publicly communicated. While founder tenacity and
              institutional knowledge are competitive advantages, an unplanned departure or incapacitation event without
              preparation would create material strategic, technical, and investor-confidence uncertainty.
            calloutType: risk
