  - id: retention-satisfaction-durability
    title: Retention, Satisfaction, and Durability
    body: >-
      Forter publicly claims a 99% customer retention rate and an enterprise NPS above 75 as of
      2024, both self-reported through official company channels. These are logo-retention metrics:
      the percentage of customers that renew, not a net revenue retention figure capturing
      expansion, contraction, or upsell within the base. NRR is not publicly disclosed, which is
      the material gap in the retention story—logo retention at 99% is consistent with high gross
      revenue retention but does not indicate whether existing customers are expanding module
      usage, reducing contract scope, or flat-renewing.

      Third-party review platforms corroborate satisfaction: FeaturedCustomers aggregates 4.8/5
      from 3,364 reference ratings; G2 shows 4.5/5 from 29 reviews (62% five-star; 0% below three
      stars); Capterra shows 4.7/5 from 15 verified reviews; Gartner Peer Insights rates Forter
      4.3/5 from 27 reviews with 5-to-10 experience ratings; PeerSpot scores Forter 9/10 and ranks
      it #6 in fraud detection. Across platforms, the most common themes are fast automated
      decisions, reduced manual review burden, and responsive customer support. The most common
      criticism is limited transparency into Forter's decision logic—a concern Forter has been
      addressing through its enhanced decision explainability portal and generative-AI insights
      capability launched in 2024.

      Stickiness drivers include deep technical integration into payment flows (typically six to
      twelve months to replace), chargeback guarantee alignment of Forter's economics with client
      revenue, multi-module cross-sell, and consortium network effects that mean switching to a
      competitor loses access to the cross-merchant intelligence Forter provides.
