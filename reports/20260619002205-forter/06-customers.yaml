  - id: TU005
    title: Expansion and Concentration Risk Assessment
    columns:
      - Expansion Driver / Risk
      - Type
      - Evidence / Signal
      - Impact
      - Diligence Path
    rows:
      - - Multi-module product expansion
        - Expansion driver
        - ASOS (fraud + PSD2), Deckers (fraud + Salesforce), McDonald's (fraud + loyalty + payments)
        - High — multi-module attach drives NRR above logo retention and raises switching cost
        - Obtain module attach rate and expansion revenue % from data room
      - - QSR vertical entry (McDonald's, 2026)
