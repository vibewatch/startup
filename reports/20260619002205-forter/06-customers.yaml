  - id: named-customer-proof
    title: Named Customer Proof and Case Studies
    body: >-
      Forter's named customer evidence is materially stronger than logo-only validation. At least
      seven customers have published quantified outcomes in case studies or press releases verified
      during this review; a further five are named officially by Forter with use-case descriptions
      but without public outcome metrics.

      McDonald's—announced as a global partnership in January 2026—is Forter's most strategically
      significant recent win. It extends the platform into the QSR vertical at global scale, with
      Helen Jorski, VP & Treasurer of McDonald's, quoted affirming the selection: "As our digital
      ecosystem grows and evolves, we also invest in solutions that protect our restaurants and
      Franchisees from new fraud risks. Forter helps us deliver on both fronts." ASOS, the global
      fashion platform, deployed Forter for PSD2/3DS compliance and achieved an 83% reduction in
      transactions sent to 3DS with failure and abandonment contained to 3%—a direct conversion-rate
      gain confirmed in ASOS's own published case study. Deckers (UGG, HOKA) achieved a 98%+
      approval rate after a four-week deployment via Salesforce Commerce Cloud integration, enabling
      international expansion into EMEA and Japan. Wayfair and Priceline each won Forter's inaugural
      IMPACT Awards in November 2025—Wayfair for higher approval rates, revenue uplift and cost
      savings; Priceline for friction-free travel booking with improved approval rates at scale. Burrow,
      a DTC furniture brand, reported a 6,557% gross ROI, with approval rate rising to 99.83% from
      89% and chargeback rate falling to 0.033% from 0.45%. HelloFresh reoriented its fraud strategy
      around a company-wide CLV (customer lifetime value) metric in partnership with Forter.

      Reference quality ranges from production deployments with numeric KPIs (ASOS, Deckers, Burrow)
      to production deployments with executive testimonials but no specific metrics (McDonald's,
      Wayfair, Priceline). No case studies document failed deployments or de-implementations.
