chapter:
  number: 6
  title: Customers
  summary: >-
    Forter's customer proof is strong by enterprise-SaaS standards: an official network of 400,000+
    businesses, 12+ named reference logos including McDonald's, ASOS, Nordstrom, and Priceline,
    seven published case studies with quantified outcomes (ASOS 83% 3DS reduction; Deckers 98%
    approval rate; Burrow 6,557% ROI), and 99% logo retention confirmed in official statements.
    Concentration risk and NRR remain undisclosed, and enterprise pricing is opaque, but third-party
    review-platform ratings (FeaturedCustomers 4.8/5 from 3,364 references; Gartner 4.3/5) validate
    broad satisfaction. The January 2026 McDonald's global partnership marks QSR vertical entry.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Target Verticals
    body: >-
      Forter's customer base divides into two distinct tiers. The broader network—400,000+ online
      businesses as of January 2026—encompasses indirect participants who contribute transaction
      signals and benefit from collective fraud-intelligence via integrations with payment providers
      and commerce platforms. The direct commercial segment is estimated at approximately 10,000
      businesses (GetLatka estimate; not officially disclosed), skewed toward enterprise and
      upper-mid-market merchants for whom Forter's premium economics make sense.

      Six primary verticals anchor Forter's go-to-market. Enterprise e-commerce and retail is the
      largest segment, anchored by named accounts such as ASOS, Nordstrom, Wayfair, Deckers
      (UGG/HOKA), Puma, and Eddie Bauer. The travel vertical features high-volume transaction
      environments where false declines are especially costly; Priceline, Kiwi.com, and similar OTA
      clients rely on Forter for real-time booking decisioning. The fintech and digital-banking
      segment includes Green Dot, which uses Forter to secure digital payments and account
      integrity. The QSR and food-delivery vertical gained its highest-profile client in January
      2026 with a global McDonald's partnership covering online orders, payment flows, and loyalty;
      HelloFresh and EatStreet also represent the food vertical. Marketplace and platform customers—
      Instacart, eBay, Fiverr—face dual-sided fraud and leverage Forter's identity graph breadth.
      The direct-to-consumer and luxury segment, including Burrow, Kurt Geiger, and James Allen,
      skews toward chargeback guarantee products.

      Geographically, the customer base is concentrated in North America and Western Europe, with
      accelerating APAC presence following 2024 office openings in Singapore and Tokyo to serve
      high-growth markets with localized data residency requirements. Forter's Ireland data center
      (launched 2024) satisfies EU GDPR compliance for European customers. Across all segments,
      decision-makers are typically fraud managers, CROs, and digital payments leads at mid-to-large
      organizations—buyers who can justify Forter's premium, chargeback-guarantee pricing model
      against measurable revenue outcomes. SMB penetration is limited; the company's public case
      study roster and product positioning both favor large, transaction-intensive businesses.
    claimRefs:
      - CU001
      - CU007
