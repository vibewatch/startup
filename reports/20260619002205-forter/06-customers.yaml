  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-NRR
      missingEvidence: >-
        Net revenue retention (NRR) rate broken down by cohort year, expansion revenue from existing
        customers, and contraction or downgrade rates within the commercial base.
      whyItMatters: >-
        Logo retention (99%) confirms customers do not cancel but does not reveal whether ACV is
        growing (NRR >100%), flat, or contracting within renewals. NRR is the primary indicator of
        revenue-quality durability for an enterprise SaaS platform and is essential for validating
        Forter's expansion economics.
      diligencePath: >-
        Request cohort-level NRR and GRR by vintage year and module in the data room; supplement
        with module attach-rate data and ACV change at renewal.
      relatedQuestionRefs: [QU006]

    - type: missing-source
      severity: minor
      topic: churn-events
      missingEvidence: >-
        Any publicly documented customer churn events, de-implementations, or contract
        non-renewals from Forter's direct commercial base.
      whyItMatters: >-
        The absence of documented adverse churn is consistent with the 99% retention claim, but
        may also reflect limited public visibility rather than zero churn. Identifying churn
        patterns (e.g., mid-market price-driven, competitor-driven, integration failures) would
        sharpen retention quality assessment.
      diligencePath: >-
        Search for de-implementation announcements, competitor win announcements citing Forter
        displacement, or customer announcements of fraud-vendor switches. Obtain churned-customer
        list from data room if available.
      relatedQuestionRefs: [QU010]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Top-10 customer revenue concentration percentage and contractual protections on anchor
        accounts such as McDonald's, Nordstrom, and ASOS.
      whyItMatters: >-
        If a small number of enterprise reference accounts represent a disproportionate share of
        ARR, loss of any single anchor customer would create both revenue risk and reference-value
        degradation affecting the pipeline. Revenue concentration is a critical durability metric
        for a platform that competes partly on reference-brand credibility.
      diligencePath: >-
        Request top-10 and top-20 customer ARR concentration from the data room; review contract
        term lengths, renewal history, and any change-of-control or exclusivity provisions.
      relatedQuestionRefs: [QU026]
      relatedTableRefs: [TU003, TU005]

