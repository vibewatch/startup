callouts:
  - calloutType: strength
    title: Production-Proof Enterprise Roster with Quantified Outcomes
    body: >-
      Forter has published or facilitated at least seven case studies with measurable, company-
      specific outcomes—a materially higher bar than logo-only customer validation typical of
      enterprise SaaS. ASOS's 83% 3DS reduction, Deckers' 98% approval rate with four-week
      deployment, and Burrow's 6,557% ROI are anchored on verifiable operational metrics. The
      January 2026 McDonald's partnership adds a tier-1 global brand in a new vertical. This
      level of customer proof is strong evidence of product-market fit and implementation
      capability across multiple verticals and geographies.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU029
      - CU021

  - calloutType: risk
    title: NRR and Revenue Concentration Are Undisclosed Diligence Blockers
    body: >-
      Forter has not disclosed net revenue retention, top-10 customer revenue concentration,
      or per-segment churn rates. The 99% logo retention metric is a lagging gross indicator
      that does not capture whether customers are expanding module usage, flat-renewing, or
      contracting within their commitments. Revenue concentration among high-reference-value
      enterprise accounts (McDonald's, Nordstrom, ASOS) is structurally likely but cannot be
      quantified without data-room access. These are material gaps for assessing revenue
      durability and expansion quality.
    claimRefs:
      - CU011
      - CU013
      - CU035
      - CU047

  - calloutType: insight
    title: Premium Pricing Limits TAM but Anchors High-ACV Relationships
    body: >-
      Forter's contact-sales, custom-pricing model with chargeback guarantees and approval-rate
      SLAs is explicitly premium and enterprise-targeted. ToolRadar's 2026 analysis identifies
      minimum transaction volume thresholds, integration complexity for legacy systems, and
      potential long-term lock-in as buyer risks. This pricing posture creates an effective
      mid-market floor that limits addressable direct-customer TAM but structurally anchors
      the existing base in deep, multi-year relationships with high switching costs—consistent
      with the 99% logo-retention claim.
    claimRefs:
      - CU033
      - CU034
      - CU035
      - CU011

