    figureRefs: [FU001]

  - id: adoption-trajectory-network-scale
    title: Adoption Trajectory and Network Scale
    body: >-
      Forter's headline adoption metrics are driven by the cumulative weight of its global network.
      As of January 2026, the platform has processed more than $2 trillion in digital commerce
      transactions and holds over two billion shopper identity profiles, giving it one of the
      broadest identity graphs in e-commerce fraud prevention. Decision speed is claimed at 99% of
      decisions delivered in under one second, a performance SLA critical to checkout conversion.

      Named reference counts provide a qualitative adoption signal: FeaturedCustomers aggregates
      115 Forter customer references (65 testimonials, 37 case studies, 13 customer videos) as of
      mid-2026, reflecting multi-year deployment depth across verticals. Platform outcome data
      published by Forter reports a 72% average reduction in chargeback rates and 46% average
      reduction in false declines across its customer base—company-claimed aggregate statistics that
      reflect deployed customers rather than prospects.

      The McDonald's partnership announced in January 2026 is the most significant recent adoption
      signal: a global rollout across McDonald's digital ecosystem (online orders, payments, loyalty)
      with production deployment scope spanning hundreds of countries. Forter's participation at
      NRF 2026 alongside AWS, PwC, and Salesforce, with executive roundtables on agentic retail and
      loyalty fraud, reflects enterprise marketing depth and partner-validated market position.
      Forter also exhibited at NRF Nexus 2026, confirming continued investment in North American
      retail enterprise sales. AWS Retail Competency status—requiring rigorous technical validation
      against the AWS Well-Architected framework—adds independent implementation quality signals.
    claimRefs:
