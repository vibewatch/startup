      - TP001
    figureRefs:
      - FP001

  - id: competitor-profiles-and-scale
    title: Competitor Profiles, Scale, and Strategic Direction
    body: >-
      Signifyd is Forter's closest strategic analog: both offer chargeback-guarantee models for
      enterprise e-commerce, share similar integration patterns, and compete head-to-head for
      top-tier retail logos. Signifyd has raised $394M–$411M across seven rounds (Series E $205M,
      April 2021), achieving a $1.34B post-money valuation; it remains private with no publicly
      confirmed IPO timeline. Riskified (NYSE: RSKD) is the only publicly traded direct peer,
      reporting $344.64M in 2025 revenue (+5.2% YoY) and achieving its first profitable GAAP
      quarter (Q4 2025, $5.8M net profit) with $298M in cash and zero debt as of year-end 2025.
      Riskified's Q1 2026 revenue of $88.27M (+7.1% YoY) confirms its trajectory toward positive
      free cash flow. Sift has raised $162M from 24 investors (latest round October 2025), targets
      a $1B valuation (last estimated 2021), serves 700+ direct brands and over 5,700 organizations
      that have deployed its API, and projects ~$54M in 2026 revenue. Kount, operating under Equifax
      since the $640M acquisition, leverages Equifax's credit and identity data assets across 9,000+
      brands and analyzes 32B+ digital interactions annually. LexisNexis ThreatMetrix — part of
      LexisNexis Risk Solutions — serves 5,000+ brands including 9 of the 10 largest US banks,
      processes 2B+ API transactions monthly from 4.5B+ devices, and holds approximately 4.1%
      fraud-prevention market share. Both Kount and ThreatMetrix are institutionally owned and
      unlikely to pursue a standalone IPO, which limits strategic flexibility relative to
      Forter and its pure-play peers.
    claimRefs:
      - CP011
      - CP012
