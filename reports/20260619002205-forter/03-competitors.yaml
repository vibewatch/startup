callouts:
  - calloutType: risk
    title: Payment-Processor Bundling Is the Primary Displacement Risk
    body: >-
      Adyen and Stripe both deepened AI fraud integration into their core processing stacks in May 2026,
      and the broader market is trending toward fraud prevention as an embedded processor feature rather
      than a standalone purchase. This commoditization pressure is most acute for mid-market merchants
      who have less differentiated fraud profiles and lower willingness to pay for a premium
      chargeback-guarantee overlay. Forter's enterprise focus provides partial insulation, but the
      long-run risk is meaningful margin compression if processors achieve comparable accuracy at
      zero incremental cost to merchants.
    claimRefs:
      - CP033
      - CP034
      - CP035

  - calloutType: strength
    title: Identity Graph Network Effect Creates a Durable Data Barrier
    body: >-
      Forter's cross-merchant identity graph — tracking 1.5B+ shopper profiles across $250B+ in annual
      transaction volume — compounds with each new merchant deployment. New entrants face a cold-start
      problem: without comparable merchant data-sharing agreements, they cannot match the signal density
      that enables Forter's sub-second decisioning accuracy. This moat is shared with Signifyd and
      Riskified to varying degrees, but Forter's integration depth and tenure in the market means its
      graph is meaningfully ahead of smaller pure-play peers.
    claimRefs:
      - CP016
      - CP017
      - CP032
      - CP040

  - calloutType: insight
    title: Riskified's Explainable-AI Investment May Differentiate in Regulated Verticals
    body: >-
      As financial services, insurance, and regulated e-commerce verticals face increasing compliance
      pressure to explain automated decisioning, Riskified's explicit investment in explainable AI
      provides a potential wedge against Forter's blackbox approach. Forter's lack of decision
      transparency is the most-cited customer frustration in 2026 reviews. If compliance mandates spread
      to online fraud decisioning, this could be a structural disadvantage for Forter in financial
      services expansion without a product investment response.
    claimRefs:
      - CP026
      - CP030
      - CP037

