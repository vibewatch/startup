  - id: operational-technical-risk
    title: Operational and Technical Risk
    body: >-
      Forter's operational risk profile is moderate to high. Its platform is real-time
      infrastructure for checkout decisioning across 400,000+ merchants; any extended
      platform outage during a peak commerce event (Cyber Monday, Prime Day) could
      cause merchant revenue disruption and reputational damage at scale. Forter holds
      SOC 2 Type II, PCI DSS Level 1, ISO 27001, and ISO 27701 certifications and conducts
      continuous third-party penetration testing, providing meaningful but not conclusive
      evidence of operational maturity. No publicly reported data breach or security
      incident has been identified as of June 2026.

      The AI model risk is structurally significant. Fraud model accuracy is subject to
      adversarial drift: as fraudsters adapt tactics in real time, models must be
      continuously retrained to maintain accuracy. Forter has not disclosed its model
      drift detection methodology, retraining frequency, or accuracy degradation thresholds.
      An undisclosed accuracy erosion could manifest as either a sudden increase in
      approved fraudulent transactions (chargeback liability spike) or a surge in false
      declines (merchant revenue loss and client churn risk), with the former directly
      impacting Forter's own balance sheet through its guarantee exposure.

      Forter's 2026 "Agentic Intelligence" product pivot—introducing the Prism AI copilot
      and autonomous chargeback-response agents—adds new operational risk. Agentic AI
      systems operating autonomously in enterprise workflows face unique governance and
      accountability challenges. Gartner predicts up to 40% of agentic AI projects will
      fail or be abandoned by 2027 due to governance gaps, and the EU AI Act's August 2026
      transparency obligations and December 2027 conformity requirements will apply to
      these autonomous agent products if deployed in EU jurisdictions. Forter has not
      published a conformity assessment or governance framework for its agentic products.

      Forter processes data on two billion+ consumer profiles. A breach of this dataset
      would constitute a systemic event triggering multi-jurisdiction disclosure obligations
      under GDPR, CCPA, and US state breach notification laws. The aggregate liability
      exposure from a systemic identity breach has not been quantified by Forter.

      Forter also faces potential AI bias risk. AI fraud detection systems face emerging
      legal scrutiny over disparate impact on protected classes; Forter has not published
      any fairness testing or disparate-impact audit results, leaving this a material
      unresolved compliance item.
