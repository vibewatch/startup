    - type: enumeration-incomplete
      severity: material
      topic: regulatory and legal risk register coverage
      missingEvidence: >-
        The regulatory/legal risk register covers five publicly identifiable exposure
        areas but cannot enumerate jurisdiction-specific licensing requirements, potential
        export-control obligations from Forter's Israeli development centers, or any
        non-public regulatory correspondence Forter may have received. Forter has not
        disclosed whether it has received supervisory inquiries from EU data protection
        authorities regarding its 2B+ profile identity network.
      whyItMatters: >-
        Unidentified licensing gaps or undisclosed regulatory correspondence could represent
        material compliance liabilities not surfaced by external research; partial coverage
        of the regulatory landscape may understate the true regulatory risk burden.
      diligencePath: >-
        Request Forter's comprehensive regulatory compliance schedule and list of all
        jurisdictions where it operates as a data controller or regulated service provider;
        confirm no pending DPA inquiries or supervisory review in EU member states.
      relatedQuestionRefs:
        - QR001
        - QR029
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: blocking
      topic: IP and patent litigation exposure
      missingEvidence: >-
        No public patent filings, IP licensing agreements, trade secret litigation, or
        infringement claims involving Forter have been identified. The absence of public
        records does not confirm no IP exposure exists; direct management disclosure and
        legal counsel review are required.
      whyItMatters: >-
        Forter's AI model architecture and identity network methodology may overlap with
        patents held by competitors or by Fraud Sciences/PayPal, which retained IP from
        the company where all three founders worked prior to founding Forter.
      diligencePath: >-
        Request IP ownership schedule from Forter; conduct FTO (freedom-to-operate) search
        on core fraud AI and identity-network patents; review any founder non-compete
        or IP assignment agreements from the Fraud Sciences/PayPal era.
      relatedQuestionRefs:
        - QR018

    - type: missing-source
      severity: material
      topic: AI model disparate impact and bias testing
      missingEvidence: >-
        No published fairness testing methodology, disparate-impact analysis, ECOA
        compliance review, or algorithmic audit has been identified for Forter's fraud
        scoring AI as of June 2026. It is unknown whether Forter conducts internal bias
        testing.
      whyItMatters: >-
        AI fraud scoring models have been demonstrated in academic literature to produce
        disparate false-decline rates by demographic group; under ECOA/Regulation B and
        emerging state AI laws, discriminatory outcomes from automated fraud decisions
        could expose Forter and its merchant clients to fair lending or civil rights claims.
      diligencePath: >-
        Request Forter's model fairness testing results and methodology; require disclosure
        of any ECOA impact analysis performed on the fraud scoring model; review whether
        adverse action notices adequately explain model-based decline rationales.
      relatedQuestionRefs:
        - QR023

    - type: private-evidence-only
      severity: material
      topic: chargeback guarantee reserve adequacy
      missingEvidence: >-
        Forter does not disclose the aggregate reserve held against chargeback guarantee
        obligations, the actuarial reserve methodology, the reserve-to-GMV ratio, or
        stress test assumptions. This information is only accessible to current investors
        through data-room access.
      whyItMatters: >-
        An undisclosed reserve adequacy gap creates material financial risk. An AI model
        accuracy decline, new fraud vector, or economic downturn increasing first-party
        fraud could require a rapid reserve increase that strains Forter's balance sheet
        without external visibility. This is the single most financially consequential
        undisclosed item in the diligence set.
      diligencePath: >-
        Request chargeback guarantee reserve schedule as of most recent quarter; require
        actuarial methodology disclosure; compare reserve-to-GMV ratio against Riskified
        or other public guarantee-program precedents; obtain representation that reserves
        meet any contractual adequacy requirements in merchant agreements.
      relatedQuestionRefs:
        - QR004
        - QR021
        - QR027
