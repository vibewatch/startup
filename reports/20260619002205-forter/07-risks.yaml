chapter:
  number: 7
  title: Risks
  summary: >-
    Forter's risk profile is dominated by four clusters: (1) a rapidly evolving regulatory
    burden driven by the EU AI Act, CCPA 2026 amendments, and FCRA fragmentation that
    directly affects its automated fraud-scoring product; (2) an unquantified and undisclosed
    financial liability from its chargeback guarantee model combined with a five-year-stale
    $3 billion valuation mark; (3) intensifying competitive pressure from embedded payment
    platforms (Stripe, PayPal) and publicly traded peers (Riskified); and (4) concentrated
    key-person dependency in three co-founders with no public succession plan. No material
    litigation, data breach, or regulatory enforcement action against Forter has been
    identified as of June 2026; the principal residual risks are regulatory non-compliance
    at scale and financial opacity.

sections:
  - id: regulatory-legal-risk
    title: Regulatory and Legal Risk
    body: >-
      Forter faces a multi-layered and accelerating regulatory burden that directly
      intersects with its core product—automated AI fraud scoring of consumer identity at
      scale. The EU AI Act classifies automated fraud-scoring and consumer-profiling systems
      as high-risk under Annex III; for systems Forter deploys in EU jurisdictions on behalf
      of merchant clients, full conformity obligations (risk management, data governance,
      human oversight, third-party audit, and EU database registration) will be enforceable
      by December 2027. Penalties for non-compliance can reach €35 million or 7% of global
      annual turnover. Critically, preparation is required now—Forter's EU AI Act readiness
      posture has not been publicly disclosed as of June 2026, creating a material compliance gap.

      In the United States, seven new CCPA/CPRA regulations took effect on January 1, 2026,
      requiring businesses that use automated decision-making technologies to conduct formal
      privacy risk assessments before processing sensitive personal information. As a data
      controller under GDPR and a "Business" under CCPA, Forter and its merchant clients
      must satisfy increasingly rigorous consent, transparency, opt-out, and data minimization
      requirements. Forter's identity network holds profiles on over two billion shoppers;
      any failure to demonstrate adequate legal basis for this processing scale creates
      substantial regulatory exposure across jurisdictions.

      CFPB Regulation V (12 CFR Part 1022, amended January 2026) requires that users of
      automated decision systems provide adverse action notices under FCRA, adding a
      compliance layer for any Forter deployment that influences a credit-adjacent decisioning
      outcome. While the CFPB itself has reduced enforcement to historic lows under the
      current administration, FCRA litigation is rising in civil courts and state attorneys
      general in California, New York, and Colorado are expanding enforcement independently.
      The result is a patchwork of approximately 20 state-level AI and privacy laws that
      require ongoing compliance monitoring across all Forter deployment geographies.

      No public record of litigation, regulatory enforcement action, or data breach involving
      Forter has been identified as of June 2026. The company has not disclosed any IP
      infringement or patent litigation. IP and disparate-impact bias litigation remain
      unresolved diligence items requiring direct management disclosure.
