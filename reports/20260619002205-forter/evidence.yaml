evidenceGaps:
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: >-
      A current-year independent valuation mark or secondary transaction establishing Forter's fair-value multiple as of
      2025 or 2026.
    whyItMatters: >-
      The $3B valuation is five years old; with ~$103M in 2024 ARR and compressed SaaS multiples post-2021, the current
      enterprise value could differ materially, affecting investment framing.
    diligencePath: >-
      Request a current cap-table and any board-approved 409A valuation or secondary transaction pricing; cross-check
      against public-market revenue multiples for fraud-prevention SaaS peers.
    relatedQuestionRefs:
      - QO018
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-enforcement
    missingEvidence: >-
      Any regulatory investigation, enforcement action, consent order, or material litigation naming Forter as a
      respondent or defendant.
    whyItMatters: >-
      As a fraud-prevention platform processing payment and identity data for millions of consumers, Forter is subject
      to GDPR, CCPA, PCI DSS, and financial-regulation regimes; undisclosed incidents would affect risk rating.
    diligencePath: >-
      Search SEC EDGAR for any affiliated entity filings; search CFPB, FTC, and ICO enforcement databases; run legal
      docket search for Forter, Inc. in US federal and state courts.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: competitive-benchmarks
    missingEvidence: >-
      Comparative ARR growth, headcount efficiency, and gross-margin data for closest public peers (Riskified, Kount /
      Equifax, NICE Actimize) to contextualise Forter's metrics.
    whyItMatters: >-
      Without peer benchmarks it is impossible to assess whether Forter's ~25% ARR growth and $103M run-rate represents
      outperformance or lagging execution relative to the market.
    diligencePath: >-
      Pull Riskified (RSKD) 10-K, NICE Actimize parent (NICE Systems) disclosures, and Sift / Kount analyst reports;
      build a comparable-company revenue-multiple table.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: Forter-SAM
    missingEvidence: >-
      A verified, Forter-disclosed or independent-analyst-published serviceable addressable market figure for Forter's
      enterprise digital commerce trust sub-segment.
    whyItMatters: >-
      Without a verified SAM, market-sizing arguments rest on low-confidence bottom-up derivations that could materially
      overstate or understate Forter's opportunity.
    diligencePath: >-
      Request Forter's internal market sizing model and compare to at least two independent analyst estimates of the
      enterprise e-commerce trust sub-segment during management diligence.
    relatedQuestionRefs:
      - QM013
  - type: enumeration-incomplete
    severity: material
    topic: enterprise-penetration-rate
    missingEvidence: >-
      The penetration rate of enterprise-grade automated fraud prevention platforms among merchants above $100M GMV
      globally as of 2026.
    whyItMatters: >-
      Knowing the current penetration rate frames the remaining market opportunity and indicates whether the enterprise
      tier is already consolidated or still in early adoption.
    diligencePath: >-
      Source from MRC 2026 full paid report, Gartner fraud prevention survey data, or Forter competitor customer-count
      disclosures.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: AI-fraud-prevention-penetration
    missingEvidence: >-
      A verified penetration rate for AI-native (non-rule-based) fraud prevention among enterprise e-commerce merchants
      as of 2026.
    whyItMatters: >-
      Quantifying how many enterprises have migrated from rule engines to AI-native platforms sizes the remaining
      conversion opportunity and validates the market timing thesis.
    diligencePath: >-
      Source from MRC 2026 full report, Gartner market data, or Forter win-rate analysis against rule-based incumbent
      tools.
    relatedQuestionRefs:
      - QM018
  - type: missing-source
    severity: material
    topic: forter-explainability
    missingEvidence: >-
      Independent benchmark comparing Forter's AI explainability metrics versus Riskified and Signifyd from a neutral
      research firm or regulatory body
    whyItMatters: >-
      As compliance requirements spread to fraud decisioning, the explainability gap could affect Forter's ability to
      compete in financial services and regulated e-commerce without measurable third-party validation.
    diligencePath: >-
      Request Gartner Magic Quadrant or Forrester Wave positioning for Online Fraud Detection; verify whether Forter has
