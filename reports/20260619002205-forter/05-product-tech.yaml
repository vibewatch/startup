callouts:
  - calloutType: strength
    title: Data Network Effect Creates Durable Moat
    body: >-
      Forter's 400,000+ merchant consortium and 2B+ consumer identity graph create a compounding
      network effect that is structurally difficult for single-merchant fraud tools to replicate.
      Each new merchant improves detection accuracy for all others in real time, and the 25-billion
      behavioral-event store underpins model quality that cannot be bootstrapped quickly by competitors
      starting with less data.
    claimRefs:
      - CE021
      - CE022
      - CE023

  - calloutType: risk
    title: False Decline Problem Remains Platform's Central Adverse Signal
    body: >-
      Forter's own 2023 consumer research found 76% of shoppers had a negative online shopping
      experience, with false declines disproportionately affecting younger consumers. Independent
      industry analysis suggests false declines cost 9–30x more revenue than actual fraud losses.
      While Forter markets its platform as a false-decline reducer, the tuning burden remains with
      the merchant post-implementation, and competitive products (Signifyd, Riskified) target the
      same claim. This is an enduring technical and commercial risk.
    claimRefs:
      - CE041
      - CE042
      - CE043

  - calloutType: insight
    title: Agentic Intelligence Pivot Is Strategically Credible But Early
    body: >-
      The 2,107% surge in agentic activity recorded in Forter's network in the 180 days preceding
      December 2025 is a compelling data signal supporting the pivot to agentic commerce security.
      The VGS partnership and Google Agent Payments Protocol collaboration demonstrate first-mover
      positioning. However, the Trusted Agentic Commerce Protocol is still in development, and both
      Prism and agentic dashboards are early GA; the ultimate revenue contribution of this strategy
      remains unproven.
    claimRefs:
      - CE024
      - CE029
      - CE030
      - CE031

