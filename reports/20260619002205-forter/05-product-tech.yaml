  - id: security-compliance
    title: Security, Privacy, and Compliance Controls
    body: >-
      Forter holds four major security and privacy certifications audited by independent third parties:
      PCI DSS Level 1 (highest level for payment data handlers), SOC 2 Type II (operational effectiveness
      for security, availability, confidentiality, and privacy controls), ISO 27001 (information security
      management system), and ISO 27701 (privacy information management, GDPR-aligned). ISO 27001 and
      ISO 27701 were granted in April 2023 following a rigorous audit covering risk management, business
      continuity, access controls, incident management, and compliance with GDPR and CCPA. The company
      also achieved the AWS Retail Competency certification, which requires passing security and
      performance standards tailored for retail workloads. The European data center in Ireland provides
      GDPR-compliant data residency for EU customers. External penetration testing is conducted
      continuously by third-party partners, with verified vulnerabilities remediated and retested.
      Forter's Privacy and Security Hub publishes certification status, but the hub page is rendered
      client-side with minimal crawlable content, limiting independent verification of current scope.
      Key compliance gaps include no publicly disclosed SOC 3 report, no named penetration testing
      firms, and no published SLA or uptime commitment outside the AWS partnership page. CCPA compliance
      is claimed but not independently certified. The combination of PCI Level 1, SOC 2 Type II, and
      ISO 27701 covers the requirements of most enterprise e-commerce merchants and financial
      institutions.
    claimRefs:
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037
    tableRefs: [TE004]

  - id: implementation-roadmap
    title: Implementation Complexity, Roadmap, and Adverse Considerations
    body: >-
      Forter's implementation model relies on JavaScript SDK embedding plus API integration, with
      platform-specific connectors available for Shopify, Salesforce, and Magento reducing engineering
      lift for merchants on those platforms. For mid-sized merchants, integration typically takes
      several weeks; for complex multi-PSP, multi-channel enterprise deployments, the timeline extends
      to two to three months, according to procurement intelligence data from Vendr. Annual contract
      values range from approximately $8,000 for smaller deployments to $375,000+ for large enterprise
      agreements, structured around approved transaction volume or GMV rather than a per-transaction
      fee. Roadmap highlights through 2026 include: the European data center (October 2024), ML model
      expansion for address manipulation and ATO detection (October 2024), Agentic Activity dashboards,
      Forter Prism AI copilot (December 2025), expanded VGS agentic commerce partnership (2026), and
      Trusted Agentic Commerce Protocol development (ongoing 2026). The most significant adverse
      consideration is that Forter's 2023 consumer research found 76% of respondents experienced a
      negative online shopping experience attributable partly to false declines, and Forter's own
      industry data frames false declines as a "silent liability" costing 9–30x the value of fraud
      losses. While Forter positions this as a market opportunity, independent analysts and competitive
      reviews note that implementation tuning and policy calibration require sustained merchant effort,
      and the improving false-decline rate is a competitive battleground where Signifyd and Riskified
      actively compete. The lack of a published sub-SLA or public status page is a minor gap for
      enterprise buyers evaluating service reliability.
    claimRefs:
      - CE038
      - CE039
      - CE040
      - CE041
      - CE042
      - CE043
