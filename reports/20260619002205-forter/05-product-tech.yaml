chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Forter's Trust Platform is a globally distributed, real-time identity-intelligence and fraud-prevention
    SaaS built on a 2B+ consumer identity graph, 25B behavioral events, and a sub-100ms Aerospike-backed
    decision engine deployed across a hub-and-spoke multi-region architecture. Five integrated product
    modules — fraud management, account protection, payment optimization, dispute management, and abuse
    prevention — are complemented by the December 2025 Prism AI copilot and an agentic-commerce readiness
    layer that has already recorded a 2,107% surge in agentic activity signals. Certifications include
    PCI DSS Level 1, SOC 2 Type II, ISO 27001, and ISO 27701; integrations span Shopify Plus, Salesforce
    Commerce Cloud, Adobe Commerce, and AWS. Implementation complexity remains material for multi-stack
    enterprise merchants, and the industry-wide false-decline challenge is Forter's most cited adverse
    limitation.

sections:
  - id: product-service-overview
    title: Product Definition and Customer Workflow
    body: >-
      Forter's core value proposition is replacing binary fraud-versus-legitimate decisions with a
      continuous identity-trust assessment that covers every stage of the customer lifecycle — account
      creation, login, checkout, post-purchase returns, dispute filing, and promotion redemption. The
      platform is marketed as the "Trust Platform for digital commerce," reflecting a deliberate
      positioning away from a narrow fraud-tool framing toward a broader revenue-enablement and customer
      experience narrative. In practice, a merchant embeds Forter's JavaScript SDK and mobile SDKs into
      its storefront; the SDK collects approximately 2 KB behavioral events in real time and streams
      them to Forter's decision engine. At checkout, the engine queries the global identity graph,
      combines session behavior with historical profile data, and returns an approve/decline/review
      decision within a target latency of under 100 milliseconds. The chargeback guarantee model —
      where Forter bears financial liability for approved transactions that later chargeback — aligns
      Forter's revenue directly with merchant outcomes and establishes commercial trust. Merchants can
      query decisions through the portal or API and receive machine-readable rationale explaining which
      identity and behavioral signals drove the outcome, supporting audit, policy tuning, and customer
      service workflows. False declines — where legitimate transactions are incorrectly blocked — are
      the dominant adverse limitation; Forter's 2023 Trust Premium Report found 76% of consumers
      reported a negative online shopping experience, with false declines particularly affecting younger
      shoppers and eroding long-term loyalty.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: platform-architecture
    title: Platform Architecture and Data Infrastructure
    body: >-
      Forter's technical architecture is organized around three interlocking layers: an identity data
      layer (the global consumer profile graph), a real-time decision engine, and an API/SDK integration
      tier. The identity graph aggregates signals from 400,000+ merchants covering more than 2 billion
      consumer profiles across 180 countries. The decision engine was rebuilt on Aerospike, a
      distributed in-memory-plus-persistent NoSQL database, replacing an earlier Elasticsearch and
      Couchbase stack that produced erratic latency spikes of up to 750 ms at P99. The Aerospike
      migration achieved a 10x P99 latency improvement and a 40% infrastructure cost reduction while
      enabling globally consistent sub-100ms reads against the 25-billion-event behavioral session store.
      Multi-region availability is achieved through Aerospike's Cross Datacenter Replication (XDR), which
      replicates data across geographically distributed data centers without sacrificing latency. In
      October 2024 Forter launched a dedicated European data center in Ireland, ensuring GDPR-compliant
      data residency for EU merchants and reducing cross-border data-transfer risk. The platform runs
      on AWS infrastructure under the ISV Accelerate Program and holds the AWS Retail Competency
      designation. Explainability has been progressively enhanced: as of October 2024 the portal
      surfaces the key data dimensions behind each trust decision, and the December 2025 release
      added Forter Prism, a generative-AI copilot that lets analysts query those decisions in natural
      language and auto-generate dashboards.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: product-modules
    title: Product Modules and Capabilities
    body: >-
      Forter's commercial product is structured as five modular protection categories that merchants
      license independently or as a bundle. Fraud Management covers payment fraud prevention, chargeback
      reduction, and false-decline minimization — the original core offering. Account Protection
      addresses account-takeover (ATO) prevention and fake-account detection at login and registration.
      Payment Optimization includes smart 3DS/PSD2 routing, issuer optimization to boost authorization
      rates, and tokenization. Dispute Management automates chargeback representment with AI-generated
      evidence packages and centralized claim consolidation. Abuse Prevention targets returns and
      item-not-received abuse, promotion and coupon abuse, and reseller/reshipper exploitation. In
      October 2024 Forter expanded its machine-learning models to detect 15% more instances of address
      manipulation and over 6% more ATO attempts at login, reflecting ongoing model iteration rather
      than a new module release. The December 2025 Prism AI copilot is positioned as a cross-module
      workflow layer, providing conversational access to transaction investigation, performance
      dashboards, and agentic-activity visibility without requiring engineering support. Forter also
      introduced an Agentic Activity dashboard tracking AI-agent-initiated commerce traffic — a
      distinct new capability reflecting the 2026 strategic repositioning toward "Agentic Intelligence."
    claimRefs:
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
    tableRefs: [TE001]
    figureRefs: [FE004]

  - id: data-ml-flywheel
    title: Data and ML Flywheel
    body: >-
      Forter's primary competitive moat is the data network effect created by its shared merchant
      consortium model. Every merchant that joins the network contributes anonymized behavioral and
      identity signals back into the global graph, improving detection accuracy for all participants.
      With 400,000+ merchants and 2 billion+ consumer profiles, a single fraudster who attacks one
      merchant triggers enriched risk signals across the entire network instantly. The platform stores
      approximately 25 billion small behavioral events — roughly 2 KB each — captured during shopper
      sessions; when a purchase is initiated, the engine pulls session history, historical profile
      data, and cross-merchant signals in milliseconds to construct a trust score. Machine-learning
      models cover device fingerprinting, behavioral anomaly detection, buyer-seller collusion,
      address manipulation, card testing, and social-engineering proxy patterns. Model refresh cycles
      are continuous; the October 2024 release documented measurable accuracy improvements without a
      named model version, suggesting an MLOps pipeline with frequent shadow deployments and gradual
      traffic shifts. A critical dependency of the flywheel is that the quality of the identity graph
      degrades without continued merchant onboarding and that the network's signal richness is most
      concentrated in North American e-commerce; European and emerging-market coverage breadth remains
      an unverified gap. With AI-driven fraud automation up 202% year-over-year as of December 2025,
      the model refresh cadence and adversarial robustness of the underlying models are material to
      the platform's value retention.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025

  - id: integrations-partnerships
    title: Integrations, Ecosystem, and Partnerships
    body: >-
      Forter participates in a multi-tier integration ecosystem spanning e-commerce platforms,
      payment infrastructure, and strategic technology partners. On the e-commerce platform side,
      Forter joined the Shopify Plus Certified App Program in October 2023, enabling native
      integration for Shopify Plus merchants with reported outcomes of 72% chargeback reduction and
      46% false-decline reduction. Forter is a Salesforce Commerce Cloud certified partner, with
      documented fast-implementation deployments at merchants including SNIPES. Adobe Commerce
      (Magento) integration is available natively. On the payment and security layer, Forter
      expanded its partnership with Very Good Security (VGS) in 2026 to build trusted agentic-commerce
      credentials combining Forter's real-time identity intelligence with VGS's neutral tokenization
      infrastructure, enabling trust signals to travel with payment tokens across agent-to-merchant
      flows. Forter has engaged with Google on the Agent Payments Protocol to establish industry
      standards for agentic commerce security. The AWS Global Partnership gives Forter access to
      co-sell motions in the AWS Marketplace and the ISV Accelerate go-to-market program. Forter's
      Partner Program, formally launched in prior years, now covers financial institutions, marketplace
      operators, ISVs, payment service providers, system integrators, and consultancies. The developer
      surface includes REST APIs, iOS/Android/JavaScript SDKs, a developer portal at docs.forter.com,
      and open-source platform plugins for Magento2 and Salesforce B2C on GitHub (github.com/forter).
    claimRefs:
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
