  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: platform accuracy metrics
      missingEvidence: "Third-party or merchant-audited false-positive and false-negative rates per module, disaggregated by vertical and transaction type."
      whyItMatters: "All accuracy claims are company-reported or based on switching-effect comparisons; independently verified detection rates are the standard diligence ask for underwriting a fraud-platform investment."
      diligencePath: "Request merchant reference calls with access to pre/post accuracy metrics; ask Forter for SOC 2 bridge letters covering latest period and any third-party accuracy attestation."
      relatedQuestionRefs: [QE022, QE023]

    - type: private-evidence-only
      severity: material
      topic: chargeback guarantee terms
      missingEvidence: "Full contractual terms of the chargeback guarantee, including eligibility exclusions, implementation-compliance requirements, and liability caps."
      whyItMatters: "The chargeback guarantee is central to Forter's commercial differentiation; conditional terms could materially limit its value to merchants."
      diligencePath: "Obtain a redacted sample Master Service Agreement or data sheet describing guarantee scope, exclusion clauses, and dispute resolution mechanism."
      relatedQuestionRefs: [QE027]

    - type: missing-source
      severity: minor
      topic: IP protection
      missingEvidence: "Patent filings or IP portfolio information for Forter's identity graph construction, ML model methods, or real-time scoring architecture."
      whyItMatters: "Unprotected core technology may be replicable by well-funded competitors; IP moat assessment is incomplete without patent landscape review."
      diligencePath: "Search USPTO, EPO, and Google Patents for Forter Inc. assignee filings; review CTO's academic or conference publication history for prior art."
      relatedQuestionRefs: [QE030]

    - type: stale
      severity: minor
      topic: security certifications
      missingEvidence: "Current certification dates, certifying body names, and recertification cadence for PCI DSS Level 1, SOC 2 Type II, ISO 27001, and ISO 27701."
      whyItMatters: "Certifications lapse; the most recent public statement (ISO announcement April 2023) does not confirm active recertification in 2025–2026."
