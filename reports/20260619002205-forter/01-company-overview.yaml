  - id: funding-and-investors
    title: Funding History and Investor Roster
    body: >-
      Forter has raised $525 million across six equity rounds from 2014 through May 2021. The funding
      trajectory spans from a $3 million Series A in 2014 to the landmark $300 million Series F led
      by Tiger Global Management in May 2021, which valued Forter at $3 billion and made it the most
      valuable privately held fraud-prevention company at the time. The Series E in 2020 raised
      $125 million, pushing Forter's valuation to approximately $1.2–1.3 billion and establishing
      unicorn status; the Series F arrived only six months later. No further equity rounds have been
      publicly announced since May 2021. The investor base is a high-quality institutional roster
      anchored by Sequoia Capital, Bessemer Venture Partners, New Enterprise Associates, and Tiger
      Global, with strategic backing from Salesforce Ventures and financial participation from March
      Capital, Scale Venture Partners, NewView Capital, Third Point Ventures, and Adage Capital
      Management. No publicly disclosed secondary transactions or debt financings appear in Forter's
      capital record. The five-year gap since the last equity round raises a material diligence
      question: whether the $3 billion valuation accurately reflects current market conditions, the
      company's post-Series-F revenue trajectory, and compressed valuation multiples in the
      fraud-prevention sector since 2021.
