  - id: scale-traction-and-milestones
    title: Scale, Traction, and Milestones
    body: >-
      Forter's financial traction shows consistent ARR growth: the company reached $103.1 million
      in 2024, up from $82.3 million in 2023, $63.7 million in 2022, and $51.7 million in 2021 —
      implying a compound annual growth rate of approximately 26 percent from 2021 to 2024. Headcount
      reached an estimated 731 employees by late 2025, up from 290 at year-end 2020 and 399 at
      year-end 2021, reflecting rapid post-Series-F hiring. The customer base is estimated at
      approximately 10,000 companies in the direct commercial segment, with the broader merchant
      network — including indirect participants via integrations and payment providers — exceeding
      400,000 online businesses. Revenue metrics are sourced from GetLatka's self-reported ARR
      database and have not been independently audited; figures represent management-disclosed ARR
      and should be treated as company estimates rather than audited financials. The milestone
      timeline begins with the 2013 founding and includes six funding rounds, the January 2023
      acquisition of Israeli bot-detection startup Immue, the July 2024 launch of a European data
      centre in Ireland, and the January 2026 McDonald's global partnership. The most recent 2026
      milestones include the Prism AI copilot launch and a formal "Agentic Intelligence" brand
      repositioning.
