company:
  name: Forter
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Forter is an enterprise fraud-prevention and digital-identity SaaS company founded in 2013 in New York
    by three Israeli military-intelligence and fraud-science alumni. The company has raised $525 million
    across six rounds at a $3 billion valuation (Series F, May 2021), processed over $2 trillion in
    digital commerce transactions, and serves 400,000+ businesses — including Adobe, McDonald's,
    Nordstrom, and Instacart — through an AI-powered identity network of more than two billion
    shopper profiles. With $103.1 million in self-reported 2024 ARR and a 2026 pivot to
    "Agentic Intelligence," Forter is the leading privately held fraud-prevention platform, though its
    $3 billion mark is now five years stale and no IPO has been announced.

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: >-
      Forter is a New York-headquartered SaaS company operating as the "Trust Platform for digital commerce."
      Founded in 2013, Forter provides real-time AI-driven fraud prevention, identity intelligence, and
      payment optimization for enterprise e-commerce, retail, fintech, food-and-beverage, and travel
      merchants. The company's core value proposition is allowing merchants to approve more legitimate
      transactions while blocking fraud — turning what has historically been a cost centre into a revenue
      enabler. Forter operates additional offices in Tel Aviv, London, and Paris, reflecting its global
      footprint and Israeli technology roots. The business model is subscription-SaaS with per-transaction
      components, anchored by chargeback guarantees that align Forter's economics directly with client
      outcomes. As of January 2026, Forter's platform is powered by a global network of over 400,000
      online businesses and more than two billion shoppers, having processed in excess of $2 trillion
      in digital commerce transactions cumulatively. The company remains privately held; its last known
      valuation of $3 billion was set at the May 2021 Series F and no IPO filing or public-offering
      announcement had been made as of June 2026. Forter's 2026 "Agentic Intelligence" repositioning —
      including the Prism AI copilot and autonomous chargeback-response agents — marks a strategic pivot
      toward AI-native fraud operations for enterprise clients navigating increasingly automated
      commerce environments.
