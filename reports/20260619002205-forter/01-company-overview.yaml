  - id: product-platform-and-technology
    title: Product Platform and Technology
    body: >-
      Forter's platform is an AI-native identity and fraud-prevention engine that processes digital
      commerce interactions in real time — 99 percent of decisions are delivered in under one second.
      The core technical architecture centres on an identity graph containing more than two billion
      shopper profiles that continuously learns behavioural signals, device data, payment patterns,
      and network relationships to score the trustworthiness of any given commerce interaction. Unlike
      rules-based or manual-review systems, Forter's model inverts the presumption of guilt: it seeks
      to approve the maximum number of legitimate transactions while targeting only confirmed fraudulent
      patterns. Key product modules include fraud management, account protection, payment optimisation,
      chargeback automation, policy-abuse prevention, and — since the January 2023 Immue acquisition
      — bot detection. Forter offers clients a chargeback guarantee, taking on financial responsibility
      for approved transactions that later result in chargebacks, which aligns its economics directly
      with client outcomes. The company reports an average 72 percent reduction in chargeback rates
      and 46 percent reduction in false declines across its customer base. Security certifications
      include PCI Level 1, SOC2 Type II, ISO 27001, and ISO 27701 (privacy extension); the Ireland
      data centre is also covered under the EU–US Data Privacy Framework. Industry analysts and
      independent payment commentators have flagged that over-cautious fraud controls — a risk
      inherent in any fraud-prevention platform — can produce false declines that are potentially
      five to ten times more costly than actual fraud losses, and that algorithmic models may
      disproportionately affect legitimate customers from under-represented demographic groups,
      creating both commercial and reputational risk for Forter's clients.
    claimRefs:
