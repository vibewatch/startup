  - id: founding-team-and-leadership
    title: Founding Team and Leadership
    body: >-
      Forter was co-founded by Michael Reitblat (CEO), Liron Damri (President), and Alon Shemesh
      (Chief Analyst) — three childhood friends who served together in Israeli Army Intelligence before
      building careers at Fraud Sciences, an Israeli anti-fraud firm acquired by PayPal in 2008. At
      PayPal, the founders ran experiments replacing rules-based fraud detection with AI models,
      achieving significant accuracy gains; Liron Damri later recalled overhearing customers ask
      whether they could buy the new fraud solution as a standalone product, which became the founding
      insight for Forter. Michael Reitblat continues to serve as CEO as of 2026 and is the primary
      strategic and investor-relationship face of the company. Liron Damri leads commercial and
      product strategy as President, while Alon Shemesh oversees the analytical and data science
      functions as Chief Analyst. The Chief Revenue Officer role is held by Ozge Ozcan, who was
      publicly named in Forter's January 2026 McDonald's partnership announcement. Aaron Barfoot
      serves as Chief Financial Officer based on publicly available management profiles. The
      concentration of strategic and technical leadership among the three co-founders represents a
      material key-person dependency: all three have served continuously since 2013 and no formal
      succession or key-person risk mitigation plan has been publicly communicated. Board composition
      is not individually disclosed; standard VC governance conventions imply board representation
      from Tiger Global, Bessemer Venture Partners, and Sequoia Capital, but specific names and seat
      counts are unconfirmed in public sources.
