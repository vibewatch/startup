      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >-
              Forter 由 Michael Reitblat（CEO）、Liron Damri（总裁）和 Alon
              Shemesh（首席分析师）联合创立。三人是儿时好友，曾一起服役于以色列陆军情报部队，之后在以色列反欺诈公司 Fraud Sciences 工作；Fraud Sciences 于 2008 年被 PayPal
              收购。在 PayPal，创始团队尝试用 AI 模型替代规则式欺诈检测，显著提升准确率；Liron Damri 后来回忆说，他听到客户询问是否可以单独购买这套新反欺诈方案，这成为 Forter 的创立洞察。截至
              2026 年，Michael Reitblat 继续担任 CEO，也是公司战略和投资者关系的主要面孔。Liron Damri 以总裁身份负责商业和产品战略，Alon Shemesh
              以首席分析师身份掌管分析和数据科学职能。首席营收官由 Ozge Ozcan 担任；Forter 在 2026 年 1 月宣布 McDonald's 合作时公开提及了她。根据公开管理层资料，Aaron
              Barfoot 担任首席财务官。三位联合创始人集中掌握战略和技术领导权，构成实质关键人依赖：三人自 2013 年以来持续任职，且公司未公开沟通正式接班或关键人风险缓释计划。董事会构成未逐一披露；按标准 VC
              治理惯例，Tiger Global、Bessemer Venture Partners 和 Sequoia Capital 可能拥有董事会席位，但具体姓名和席位数量未在公开来源中确认。
