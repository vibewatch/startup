      - number: '3.2'
        title: 竞争对手画像、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              Signifyd 是 Forter 最接近的战略类比：二者都为企业电商提供拒付担保模式，集成模式相似，并在顶级零售 logo 上正面竞争。Signifyd 已通过七轮融资筹集 $394M–$411M（2021 年
              4 月 Series E $205M），实现 $1.34B post-money 估值；公司仍为私营，IPO 时间表没有公开确认。Riskified（NYSE: RSKD）是唯一上市的直接同业，2025 年收入
              $344.64M（同比 +5.2%），并在 2025 年 Q4 实现首个 GAAP 盈利季度（净利润 $5.8M），截至 2025 年底持有 $298M 现金、零债务。Riskified 2026 年 Q1 收入
              $88.27M（同比 +7.1%），确认其正迈向正自由现金流。Sift 从 24 位投资者处融资 $162M（最新一轮为 2025 年 10 月），目标估值 $1B（上次估计为 2021 年），服务 700+
              直接品牌和超过 5,700 家已部署其 API 的组织，并预计 2026 年收入约 $54M。Kount 在 $640M 收购后隶属于 Equifax，借助 Equifax 的信用和身份数据资产覆盖 9,000+
              品牌，每年分析 32B+ 数字交互。LexisNexis ThreatMetrix 是 LexisNexis Risk Solutions 的一部分，服务 5,000+ 品牌，包括美国 10 大银行中的 9
              家，每月处理来自 4.5B+ 设备的 2B+ API 交易，并拥有约 4.1% 反欺诈市场份额。Kount 和 ThreatMetrix 都由机构所有，不太可能追求独立 IPO，因此相较 Forter
              及其纯反欺诈同业，战略灵活性受限。
