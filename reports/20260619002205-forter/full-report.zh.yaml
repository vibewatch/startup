          - type: callout
            title: Agentic Commerce 带来结构性市场和产品不确定性
            body: >-
              AI 购物 agent 的兴起——Forter 在 NRF 2026 与 AWS 和 PwC 一同讨论过这一议题——带来双重动态：一方面生成新的欺诈攻击面，需要新的身份基础设施能力；另一方面也可能挑战
              Forter 身份图谱所依赖的人类行为信号基础。Forter 已把这视为核心机会，但 agentic commerce 采用的速度和方向，会给近期市场规模和产品契合论证引入实质不确定性，尽调应进行压力测试。
