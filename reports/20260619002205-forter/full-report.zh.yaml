      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              企业反欺诈采购的核心标准包括：实时决策延迟、拒付担保（财务责任转移）、可解释 AI 和审计轨迹、欺诈类型覆盖（支付欺诈、账户接管、政策滥用、促销滥用）、支付处理商独立性，以及集成复杂度。Forter 和
              Signifyd 都提供全自动实时决策和拒付担保；Riskified 匹配这一模式，并明确投入可解释 AI，以服务合规要求高的买方。Sift
              覆盖最广用例集合（从支付欺诈到内容完整性），但历史上提供的财务担保弱于前三者。Kount 和 ThreatMetrix 在设备情报和身份数据上较强，但在电商开箱即用的拒付担保上落后于专业厂商。Stripe
              Radar 的优势是易设置和网络规模，但缺少支付处理商独立性——不用 Stripe 的商户无法使用。定价上，Forter 采用完全定制、谈判式模型，不公开每笔交易费率；中位合同被引用为约
              $8,000/年，企业部署可达六位数。Signifyd 同样围绕三个模块协商按量定价。Riskified 按 GMV 百分比收费，使平台激励与商户收入对齐。Stripe Radar 嵌入 Stripe
              处理费，不另收欺诈检测费。SEON 公布 API 起价，对中端买方更透明、更易获得。从 GTM 看，Forter、Signifyd 和 Riskified 都走直接企业销售；Stripe Radar 则通过
              Stripe 的开发者驱动采用飞轮增长——这是一种根本不同且更难复制的分发动作。
