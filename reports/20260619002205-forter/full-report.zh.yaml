      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              2024 年中以来，Forter 的退出准备度明显改善，但相对 IPO 阶段预期仍有关键缺口。正面因素包括：Jim Lejeal 2025 年 3 月上任， 带来直接 IPO 执行经验（完成过两次，包括
              Rally Software）；Cyndy Lobb 同期出任 CPO（曾任 Square Commerce Platform）， 能提供适合公开市场投资人的产品叙事；公司已在 Forge Global 和
              UpMarket 二级市场平台挂牌，显示机构关注度；ipos.fyi 的 pre-IPO 观察名单也确认已有跟踪覆盖。二级市场意向接近 $3–3.5B，典型折价
              15–35%，说明成熟二级买家认为当前标记仍有真实但不确定的上行空间。

              但关键尽调阻碍仍在。经审计毛利率不可得，拒付保证准备金从未公开量化。NRR 从未披露——99% logo 留存是总留存，不是净扩张； 如果 NRR 低于 100%，Forter
              的收入质量论点会被改写。Series F 优先股的清算优先权和参与权没有公开，若退出价值低于 $3B， 可能对普通股造成实质性稀释。截至 2026 年 6 月，没有确认 IPO 申报。CFO
              关于带领财务运营进入「下一阶段增长」的表述，可能意味着 IPO 还要多年准备，而不是即将发行。收入 / 员工约 $154K，相比 Riskified 的约 $559K，也指向 IPO 前仍需运营重组。
              战略收购路径可行——Equifax、FIS、Visa、PayPal 和 Mastercard 历来都收购过欺诈和身份数据资产——但如果出售价格低于 $3B，
              清算优先权保护会被触发，退出收益可能向后期优先股持有人集中，牺牲普通股股东和员工。
