      - number: '5.2'
        title: 平台架构与数据基础设施
        blocks:
          - type: paragraph
            body: >-
              Forter 的技术架构围绕三层咬合：身份数据层（全球消费者画像图谱）、实时决策引擎，以及 API / SDK 集成层。身份图谱汇聚 400,000+ 商户的信号，覆盖 180 个国家超过 20
              亿个消费者画像。决策引擎重构到 Aerospike 之上；Aerospike 是分布式内存加持久化 NoSQL 数据库，替代了早期 Elasticsearch 和 Couchbase 组合，后者在 P99
              曾出现最高 750 ms 的不稳定延迟尖峰。迁移到 Aerospike 后，P99 延迟改善 10 倍，基础设施成本下降 40%，同时可对 250 亿条行为会话事件库提供全球一致的低于 100ms
              读取。多区域可用性靠 Aerospike 的 Cross Datacenter Replication（XDR）实现，在不牺牲延迟的前提下，将数据复制到地理分散的数据中心。2024 年 10 月，Forter
              在爱尔兰上线专用欧洲数据中心，为欧盟商户提供符合 GDPR 的数据驻留，并降低跨境数据传输风险。平台运行在 AWS 基础设施上，纳入 ISV Accelerate Program，并获得 AWS Retail
              Competency 认证。可解释性持续增强：截至 2024 年 10 月，门户已展示每个信任决策背后的关键数据维度；2025 年 12 月的版本又加入 Forter Prism，这是一款生成式 AI
              copilot，可让分析师用自然语言查询这些决策并自动生成仪表盘。
