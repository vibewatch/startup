          - type: callout
            title: 网络效应与战略数据资产构成可防守的并购溢价底线
            body: >-
              Forter 的 1.5B+ 购物者身份图谱和 400K+ 商户网络无法靠自然增长复制。AI-native 欺诈平台的可比收购——BioCatch 估值 $1.3B（约 8.1× ARR）、Darktrace
              交易价 $5.3B（约 8.1× 收入）——为品类龙头退出建立底线。Equifax、FIS、PayPal 和 Visa 等战略买家已有支付 8–15× 收购防御性欺诈与身份数据资产的记录。
            calloutType: strength
