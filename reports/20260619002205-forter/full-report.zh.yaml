          to: Merchant Fraud Decisions
        - from: Forter Trust Platform
          to: Chargeback Guarantee Liability
    approximationNotes: 云服务商身份（AWS）是按行业惯例推断，Forter 未确认。监管依赖反映当前适用法律，不代表存在主动执法行动。
    claimRefs:
      - CR002
      - CR004
      - CR018
      - CR028
      - CR032
  - id: FV001
    title: 建议逻辑：证据链如何指向继续研究
    type: flow
    layout: standard
    summary: 证据链从市场规模、网络护城河和收入证明出发，经过估值逆风与披露缺口，最终指向继续研究建议。
    data:
      nodes:
        - id: market-scale
          label: 大 TAM（$67–89B）
          detail: FDP 市场 CAGR 为 17–21%；仅 2025 年电商欺诈损失就达 $48B
        - id: moat
          label: 身份网络护城河
          detail: 1.5B+ 购物者画像；400K+ 商户；跨商户网络效应持续复利
        - id: proof
          label: 收入证明
          detail: $103M ARR（估算）；99% logo 留存；Adobe、Nordstrom、Instacart 为锚定客户
        - id: valuation-headwind
          label: 估值偏紧
          detail: $3B 标记 = 29× ARR；上市可比公司 Riskified 为 1.7× EV/TTM Revenue；该标记已有 5 年
        - id: disclosure-gap
          label: 披露缺口
          detail: 毛利率、NRR、盈利能力、拒付准备金均未公开披露
        - id: ipo-signal
          label: IPO 信号
          detail: CFO Lejeal：4 次担任上市公司 CFO；完成 2 次 IPO（Rally Software + Splunk 时期）
        - id: recommendation
          label: 继续研究
          detail: 提交 IPO 文件、毛利率 >60%、NRR >105% 或发布 M&A 公告之前，先不投入
      edges:
        - from: market-scale
          to: recommendation
          label: 支持
        - from: moat
          to: recommendation
          label: 支持
        - from: proof
          to: recommendation
          label: 部分支持
        - from: valuation-headwind
          to: recommendation
          label: 约束
        - from: disclosure-gap
          to: recommendation
          label: 约束
        - from: ipo-signal
          to: recommendation
          label: 构成条件
    approximationNotes: 流向权重为定性判断；未采用定量边权重。
    claimRefs:
      - CV046
      - CV048
      - CV051
  - id: FV002
    title: 估值敏感性 — 按 EV/ARR 倍数推导的隐含企业价值
    type: bar
    layout: wide
    summary: 以 2024E ARR $103M 为基数，套用一组 EV/ARR 倍数推导 Forter 的隐含企业价值，并以当前 $3B 标记和欺诈赛道可比基准作锚。
    data:
      items:
        - label: 3× ARR（欺诈 / 合规上市公司下限）
          value: 309
          detail: 3× × $103M；Windsor Drake 欺诈 / 合规上市公司区间下沿
        - label: 6× ARR（上市市场中位）
          value: 618
          detail: 6× × $103M；欺诈防护上市公司区间中高位；相当于 Riskified 市值 / 收入
        - label: 8× ARR（M&A 下限 — AI-native）
          value: 824
          detail: 8× × $103M；BioCatch 和 Darktrace M&A 对 AI-native 欺诈平台隐含的下限
        - label: 10× ARR（高端私募）
          value: 1030
          detail: 10× × $103M；私募市场高端层级；需要可证明符合 Rule of 40
        - label: 15× ARR（最佳 AI-native）
          value: 1545
          detail: 15× × $103M；按 Windsor Drake 2025 基准，AI-native 欺诈决策平台的上限
        - label: 当前 $3B 标记（29× ARR）
          value: 3000
          detail: 最后已知估值；隐含 29× 2024E ARR；2021 年 5 月设定；当前无可比公司支撑该水平
    approximationNotes: 所有数值单位为百万美元。$103M ARR 是 GetLatka 对 2024 年的第三方估算，Forter 未确认。 倍数是代表性基准，不保证实际可交易区间。
    claimRefs:
      - CV008
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间：牛市 / 基准 / 熊市情景
    type: range
    layout: standard
    summary: 牛市、基准和熊市情景下的 Forter 隐含企业价值区间，反映 ARR 增长轨迹及适用倍数假设。
    data:
      items:
        - label: 熊市情景（2028+ 或估值下调融资）
          low: 375
          mid: 500
          high: 625
          detail: 熊市：$125M ARR × 3–5× 倍数；估值下调融资或较晚 IPO；新优先股带来显著稀释
        - label: 基准情景（2027 IPO）
          low: 840
          mid: 1050
          high: 1260
          detail: 基准：$140M ARR × 6–9× 倍数；中档欺诈 SaaS 可比；远低于 $3B 标记
        - label: 牛市情景（2028 IPO，AI 重估）
          low: 1500
          mid: 2100
          high: 2800
          detail: 牛市：$185M ARR × 8–15× 倍数；AI-native 重估需要达到 Rule of 40
    approximationNotes: 区间单位为百万美元。每个情景内的低 / 中 / 高值反映倍数在该情景带内压缩或扩张。 ARR 预测是受证据约束的外推；Forter 不披露 ARR 或前瞻指引。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV015
  - id: FV004
    title: 投资 KPI 记分卡 — Forter 估值维度
    type: kpi
    layout: standard
    summary: 基于截至 2026 年 6 月的公开证据，对八个投资维度按 0–10 分打分，可直接供 IC 使用。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: $67–89B FDP TAM，CAGR 为 17–21%；AI 推升欺诈强度，带来强劲长期需求；电商增长托住基础盘
        - label: 产品与技术护城河
          value: 7
          detail: 1.5B+ 身份图谱；400K 商户；Agentic Intelligence 重新定位增加 AI-native 溢价信号
        - label: 客户证据
          value: 7
          detail: 400K+ 商户；99% logo 留存；Adobe、Nordstrom、Instacart、eBay 为锚定客户；处理 $250B GMV
        - label: 财务质量
          value: 4
          detail: $103M ARR（第三方估算）；增长 25% 且放缓；盈利能力、毛利率、NRR 均未披露
        - label: 竞争位置
          value: 6
          detail: 面对 Riskified 和 Signifyd 仍是品类领导者；支付处理商内嵌欺诈工具带来既有玩家威胁
        - label: 风险画像
          value: 3
          detail: $3B 标记估值偏高；无财务披露；5 年资本缺口；拒付保证尾部风险；估值下调融资环境
        - label: 估值吸引力
          value: 2
          detail: $3B 标记 = 29× ARR，而上市可比公司为 1.7× EV/Revenue；按所有可得可比指标都偏贵
        - label: 证据质量
          value: 4
          detail: 无经审计财务；所有 ARR 估算均来自第三方；公司完全未披露 NRR 和毛利率
    approximationNotes: 分数是 0–10 分制的定性判断；0 = 严重失败，10 = 同类最佳。分数反映相较于同阶段欺诈防护 SaaS 公司的证据质量和业务基本面。
    claimRefs:
      - CV049
      - CV005
      - CV007
      - CV039
      - CV040
