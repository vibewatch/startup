      - number: '1.5'
        title: 产品平台与技术
        blocks:
          - type: paragraph
            body: >-
              Forter 的平台是 AI 原生的身份和反欺诈引擎，实时处理数字商务交互——99% 的决策在一秒内交付。核心技术架构围绕一个身份图谱，包含超过 2B
              个购物者画像，持续学习行为信号、设备数据、支付模式和网络关系，以评估任一商务交互的可信度。不同于规则式或人工审核系统，Forter
              反转了默认有罪的假设：它追求最大化批准真实交易，同时只瞄准已确认的欺诈模式。关键产品模块包括欺诈管理、账户保护、支付优化、拒付自动化、政策滥用防护，以及自 2023 年 1 月收购 Immue 后加入的 bot
              检测。Forter 向客户提供拒付担保，对后来产生拒付的已批准交易承担财务责任，使其经济性与客户结果直接对齐。公司称，其客户群平均拒付率下降 72%，误拒下降 46%。安全认证包括 PCI Level
              1、SOC2 Type II、ISO 27001 和 ISO 27701（隐私扩展）；Ireland 数据中心也纳入 EU–US Data Privacy
              Framework。行业分析师和独立支付评论人士指出，任何反欺诈平台都内生存在一个风险：过度谨慎的欺诈控制会带来误拒，其潜在成本可能是实际欺诈损失的五到十倍；算法模型也可能对代表性不足的人群中的真实客户产生不成比例影响，为
              Forter 客户带来商业和声誉风险。
