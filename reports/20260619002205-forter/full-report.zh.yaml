      - number: '5.7'
        title: 实施复杂度、路线图与不利考量
        blocks:
          - type: paragraph
            body: >-
              Forter 的实施模式依赖嵌入 JavaScript SDK 加 API 集成；面向 Shopify、Salesforce 和 Magento
              的平台专用连接器，可降低这些平台商户的工程投入。中型商户通常需要数周完成集成；根据 Vendr 的采购情报数据，复杂的多 PSP、多渠道企业部署会拉长到两到三个月。年度合同额从较小部署的约
              $8,000，到大型企业协议的 $375,000+ 不等，计价围绕已批准交易量或 GMV，而非单笔交易费。到 2026 年的路线图重点包括：欧洲数据中心（2024 年 10 月）、地址操纵和 ATO 检测的 ML
              模型扩展（2024 年 10 月）、Agentic Activity 仪表盘、Forter Prism AI copilot（2025 年 12 月）、扩大的 VGS 智能体商业合作（2026 年），以及
              Trusted Agentic Commerce Protocol 开发（2026 年持续）。最重要的不利考量是，Forter 的 2023 年消费者研究发现，76%
              的受访者经历过负面线上购物体验，部分可归因于误拒；Forter 自身行业数据也把误拒称为「无声负债」，成本为欺诈损失价值的 9–30 倍。Forter
              将其包装成市场机会，但独立分析师和竞争评测指出，实施后的调优和政策校准仍需要商户持续投入；误拒率改善也是 Signifyd 和 Riskified 正在激烈争夺的竞争战场。没有发布 sub-SLA
              或公开状态页，是企业买家评估服务可靠性时的一个小缺口。
