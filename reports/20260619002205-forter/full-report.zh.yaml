      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              Forter 的买方群体以处理大量 CNP 交易的企业级数字商务运营商为核心。已记录的客户垂直包括品牌零售（Otto Group、Revolve、thredUP）、奢侈品和时尚（Yoox
              Net-a-Porter）、数字市场平台（The Hut Group）、旅游和票务平台，以及金融服务公司。平台的合同欺诈担保和网络效应定价模型，只有在大规模交易商户上才最具经济可行性——通常 GMV 高于
              $100M——因此大型企业是主要商业目标。


              欺诈防护预算主要由欺诈与风险 VP 或总监掌握，首席营收官（收入保护框架）、CFO（降本框架）以及 CTO 或工程 VP（集成和基础设施框架）也会产生次级影响。企业级采购是多利益相关方流程，通常需要 3–9
              个月。LexisNexis 对 569 名欺诈和风险高管的调研确认，欺诈团队、财务团队和技术部门都会参与供应商选择。


              采用触发因素包括重大欺诈事件，例如账户接管事件或拒付率突破阈值；平台迁移；因对现有工具失去信心而启动的竞争性
              RFP；或意识到误拒成本悖论——过度保守的规则引擎造成的收入流失，比其阻止的欺诈更贵。Riskified 估计，误拒每年给全球零售商造成 $443B 成本，是直接欺诈成本的九倍，这为自动化信任平台提供了有力
              ROI 论证。移动商务约占全球电商 GMV 的 59% 和美国欺诈成本的 33%，也在制造额外采用压力，因为基于桌面行为信号训练的传统规则引擎在移动流量上表现不足。
