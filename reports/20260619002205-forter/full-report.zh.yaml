  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Forter 的核心价值，是把「欺诈 /
              合法」二元判断，改成贯穿客户生命周期的连续身份信任评估——从开户注册、登录、结账，到购后退货、争议提交和优惠兑换。公司把平台包装成「数字商业信任平台」，刻意避开狭义反欺诈工具的定位，转向更宽的收入增长和客户体验叙事。落地时，商户把
              Forter 的 JavaScript SDK 和移动端 SDK 嵌入店铺前端；SDK 实时采集约 2 KB 的行为事件，并流入 Forter
              决策引擎。结账时，引擎查询全球身份图谱，把会话行为与历史画像数据合并，在目标低于 100 毫秒的延迟内返回批准 / 拒绝 / 复核决策。拒付担保模式——Forter
              对其批准、但后来发生拒付的交易承担财务责任——把 Forter 的收入直接绑到商户结果上，也建立商业信任。商户可通过门户或 API
              查询决策，并收到机器可读的理由，说明哪些身份和行为信号驱动了结果，用于审计、政策调校和客服流程。误拒——合法交易被错误拦截——是最主要的不利限制；Forter 的 2023 Trust Premium
              Report 发现，76% 的消费者报告过负面线上购物体验，误拒对年轻购物者影响尤其明显，并侵蚀长期忠诚度。
