  - id: FO002
    title: Forter 平台架构——信任决策流
    type: flow
    layout: standard
    summary: Forter 的身份网络、AI 决策引擎和产品模块如何连接起来，在端到端数字商务旅程中保护企业商户。
    data:
      nodes:
        - id: data-network
          label: 身份网络
          detail: 20 亿+ 购物者画像和 40 万+ 企业；持续吸收商户网络中的交易信号、设备指纹和行为模式
        - id: ai-engine
          label: AI 决策引擎
          detail: 实时信任评分；99% 的决策在 <1 秒内交付；把默认判断从可疑反转为可信；Prism AI copilot 从 2026 年起增强团队决策
        - id: fraud-mgmt
          label: 欺诈管理
          detail: 阻断欺诈交易；对获批交易提供拒付担保；报告平均拒付率下降 72%
        - id: acct-protection
          label: 账户保护
          detail: 防护登录、注册和资料变更，抵御账户接管和合成身份欺诈
        - id: payment-opt
          label: 支付优化
          detail: 提高授权率和 SCA 豁免（PSD2 / PSD3）；优化支付方式路由
        - id: bot-detection
          label: 机器人检测（Immue）
          detail: 通过 2023 年 1 月收购 Immue 加入高级机器人缓解能力；覆盖黄牛机器人、凭证填充和闪购滥用
        - id: chargeback-auto
          label: 拒付自动化
          detail: 自动分诊、组装证据和响应；降低人工成本；拒付担保让 Forter 的经济利益与客户结果对齐
        - id: merchant
          label: 企业商户
          detail: Adobe、McDonald's、Nordstrom、Instacart、Priceline、ASOS、eBay；约 1 万直接客户；更广网络中 40 万+
      edges:
