            title: $3B 估值标记已过时五年，当前可比公司无法支撑
            body: >-
              Forter 最近一次已知估值 $3B（2021 年 5 月）隐含约 29× 2024E ARR。最接近的上市同业 Riskified（RSKD）目前交易倍数约为 1.7× EV/TTM Revenue。即便把
              AI-native 欺诈平台的优质倍数 8–15× ARR 套用到 Forter 估算的 $103M，也只得到 $820M–$1.55B——较当前标记折价 48–73%。没有公开财务披露能支撑按 $3B
              承销，除非采用现有证据无法支持的溢价假设。
