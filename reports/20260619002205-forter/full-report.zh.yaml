  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Forter 所处的是电商反欺诈和身份情报市场，买方可以沿几条不同路径完成同一个 job-to-be-done：专业反欺诈供应商、支付处理商捆绑工具、既有身份数据公司、开源或内部规则引擎，以及人工审核团队。提供与
              Forter 类似拒付责任担保模式的直接竞争对手包括 Signifyd（私营，估值 $1.34B）和 Riskified（NYSE: RSKD，TTM 收入 $350M）。AI 驱动的工作流平台如
              Sift，也补全了面向需要可配置、多场景欺诈管理商户的直接同业集合。既有身份数据玩家——Kount（2021 年被 Equifax 以 $640M 收购）和 LexisNexis
              ThreatMetrix（5,000+ 品牌、每日 130M+ 交易）——主要在金融机构和大型全渠道零售商场景竞争。相邻替代品包括嵌在 Stripe 支付栈内、以 $1.9T 年支付量训练的 Stripe
              Radar，以及 Adyen 的 RevenueProtect 和 Visa 的 CyberSource，二者都嵌在各自处理商平台中。面向中端和较小商户，SEON 和 NoFraud 提供成本更低、白盒 API
              驱动的替代方案。最容易被低估的替代品仍是内部规则引擎：许多拥有专门欺诈运营团队的大型企业商户，把规则式系统作为基线，并把第三方供应商视为可选增强。来自资金充足的 fintech 和 hyperscaler 的
              AI 原生新进入者，是尚未转化为实质份额流失的潜在威胁。
