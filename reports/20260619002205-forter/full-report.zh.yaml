      - number: '6.2'
        title: 采用轨迹与网络规模
        blocks:
          - type: paragraph
            body: >-
              Forter 的头部采用指标由其全球网络的累积体量驱动。截至 2026 年 1 月，平台已处理超过 $2 trillion 的数字商业交易，并持有超过 20
              亿个购物者身份画像，使其拥有电商反欺诈领域最广的身份图谱之一。公司声称 99% 的决策在一秒内交付，这一性能 SLA 对结账转化至关重要。

              命名客户引用数量提供了定性采用信号：截至 2026 年中，FeaturedCustomers 汇总了 115 条 Forter 客户引用（65 条推荐语、37 个案例研究、13
              个客户视频），反映其在多个垂直的多年部署深度。Forter 发布的平台结果数据称，其客户基础的拒付率平均降低 72%、误拒平均降低 46%——这是公司声称的聚合统计，反映已部署客户，而非潜在客户。

              2026 年 1 月宣布的 McDonald's 合作，是最近最重要的采用信号：在 McDonald's 数字生态（线上订单、支付、会员）全球推出，生产部署范围覆盖数百个国家。Forter 与 AWS、PwC 和
              Salesforce 一同参加 NRF 2026，并围绕智能体零售和会员欺诈举办高管圆桌，体现企业级营销深度和伙伴验证过的市场位置。Forter 还参展 NRF Nexus
              2026，确认其继续投入北美零售企业销售。AWS Retail Competency 状态——要求通过 AWS Well-Architected framework 的严格技术验证——补充了独立实施质量信号。
