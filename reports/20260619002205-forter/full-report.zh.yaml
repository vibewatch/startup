      - number: '1.3'
        title: 融资历史与投资人名单
        blocks:
          - type: paragraph
            body: >-
              Forter 在 2014 年至 2021 年 5 月之间完成六轮股权融资，累计融资 $525M。融资轨迹从 2014 年 $3M Series A 起步，到 2021 年 5 月由 Tiger Global
              Management 领投的标志性 $300M Series F；该轮把 Forter 估值推至 $3B，也使其当时成为估值最高的私营反欺诈公司。2020 年 Series E 融资 $125M，把 Forter
              估值推至约 $1.2–1.3B，并确立独角兽地位；仅六个月后，Series F 到来。2021 年 5 月后，公司未公开宣布新的股权融资。投资人阵容质量较高，以 Sequoia Capital、Bessemer
              Venture Partners、New Enterprise Associates 和 Tiger Global 为核心，并获得 Salesforce Ventures 的战略支持，以及 March
              Capital、Scale Venture Partners、NewView Capital、Third Point Ventures 和 Adage Capital Management
              的财务参与。Forter 的资本记录中未见公开披露的二级交易或债务融资。距上一轮股权融资已有五年，这提出了一个实质尽调问题：$3B 估值是否仍能准确反映当前市场环境、公司 Series F 后的收入轨迹，以及
              2021 年以来反欺诈板块估值倍数的压缩。
