            body: >-
              Forter 的财务牵引力显示 ARR 持续增长：公司 2024 年达到 $103.1M，高于 2023 年的 $82.3M、2022 年的 $63.7M 和 2021 年的 $51.7M，意味着
              2021–2024 年复合年增长率约 26%。员工数到 2025 年末估计达到 731 人，高于 2020 年底的 290 人和 2021 年底的 399 人，反映 Series F
              后快速扩张招聘。直接商业客户群估计约 10,000 家公司；更广义的商户网络——包括经由集成和支付提供商接入的间接参与者——超过 400,000 家在线企业。收入指标来自 GetLatka 的自报 ARR
              数据库，未经独立审计；这些数字代表管理层披露的 ARR，应视为公司估计而非经审计财务。里程碑从 2013 年创立开始，包括六轮融资、2023 年 1 月收购以色列 bot 检测初创公司 Immue、2024 年
              7 月在 Ireland 启用欧洲数据中心，以及 2026 年 1 月 McDonald's 全球合作。最近的 2026 年里程碑还包括 Prism AI copilot 发布和正式转向「Agentic
