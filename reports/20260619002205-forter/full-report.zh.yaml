      - number: '5.6'
        title: 安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              Forter 持有四项由独立第三方审计的主要安全和隐私认证：PCI DSS Level 1（支付数据处理方最高级别）、SOC 2 Type II（安全性、可用性、保密性和隐私控制的运行有效性）、ISO
              27001（信息安全管理体系）和 ISO 27701（隐私信息管理，贴合 GDPR）。ISO 27001 和 ISO 27701 于 2023 年 4
              月授予，审计严格覆盖风险管理、业务连续性、访问控制、事件管理，以及 GDPR 和 CCPA 合规。公司还取得 AWS Retail Competency
              认证，该认证要求通过面向零售工作负载的安全和性能标准。爱尔兰欧洲数据中心为欧盟客户提供符合 GDPR 的数据驻留。第三方合作伙伴持续开展外部渗透测试，已验证漏洞会修复并复测。Forter 的 Privacy
              and Security Hub 发布认证状态，但该页面由客户端渲染，可抓取内容很少，限制了对当前范围的独立核验。关键合规缺口包括：没有公开披露 SOC 3 报告、没有点名渗透测试公司、除 AWS
              合作页面外没有发布 SLA 或正常运行时间承诺。CCPA 合规由公司声称，但没有独立认证。PCI Level 1、SOC 2 Type II 和 ISO 27701
              的组合，覆盖了多数企业级电商商户和金融机构的要求。
