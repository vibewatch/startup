      - number: '5.3'
        title: 产品模块与能力
        blocks:
          - type: paragraph
            body: >-
              Forter 的商业产品拆成五类模块化保护能力，商户可单独授权，也可打包购买。Fraud Management 覆盖支付欺诈预防、拒付降低和误拒最小化，是最早的核心产品。Account Protection
              处理登录和注册环节的账号接管（ATO）防护与假账号识别。Payment Optimization 包括智能 3DS / PSD2 路由、用于提升授权率的发卡行优化，以及代币化。Dispute Management
              用 AI 生成证据包并集中整合索赔，自动化拒付申诉。Abuse Prevention 针对退货和未收到商品滥用、促销和优惠券滥用，以及经销商 / 转运商套利。2024 年 10 月，Forter
              扩展机器学习模型，多识别 15% 的地址操纵实例和超过 6% 的登录 ATO 尝试；这反映的是持续模型迭代，而非新模块发布。2025 年 12 月的 Prism AI copilot
              被定位成跨模块工作流层，分析师无需工程支持，就能用对话方式进入交易调查、绩效仪表盘和智能体活动可视化。Forter 还推出 Agentic Activity 仪表盘，跟踪 AI
              智能体发起的商业流量——这是一个明确的新能力，也呼应公司 2026 年转向「Agentic Intelligence」的战略再定位。
