  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              Forter
              所处的是数字商务信任市场，这是更广义欺诈检测与防护（FDP）行业中的一个聚焦分支，定义为在数字交互发生点做实时决策——结账、开户、登录、促销、退货和忠诚度兑换。核心市场包括面向在线商户的支付欺诈防护、账户接管（ATO）保护、政策和退货滥用管理、忠诚度欺诈缓释，以及身份验证。线下
              POS 欺诈、银行传统反洗钱、企业员工访问管理中的身份治理，不在核心范围内。


              Forter 的总可寻址市场覆盖所有处理 CNP
              交易或在线管理消费者账户的数字商务运营商，横跨电商、市场平台、旅游、数字商品和金融服务垂直领域。相邻市场包括拒付管理服务、支付编排、先买后付风险和更广义的网络安全边界。现状替代方案包括内部欺诈团队维护的自建规则引擎、支付处理商打包提供的网络级工具（Stripe
              Radar、Adyen RevenueProtect），以及独立身份验证供应商。


              数字商务信任市场是完整 FDP 宇宙的一个子板块。多数分析机构引用的更广义 FDP 市场数字包含银行 AML、保险欺诈和政府欺诈，因此抬高了标题 TAM。Forter
              的可服务空间是电商和数字商务层；如下方市场定义和规模表所示，分析师估计 2026 年电商范围为 $73–89B，较窄产品范围为 $40–70B。
