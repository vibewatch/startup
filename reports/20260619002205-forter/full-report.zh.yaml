      - number: '4.2'
        title: 财务规模信号与第三方牵引力估计
        blocks:
          - type: paragraph
            body: >-
              截至 2024 年末，Forter 已累计处理超过 $2T 电商交易，服务超过 10,000 家商户。2024 年，Forter 平台通过降低误拒率，为客户带来超过 $9B 增量收入，并为客户削减超过 $1B
              成本。其企业 NPS 超过 75，客户留存率 99%，是唯一连续五年（2021-2025）入选 Forbes Cloud 100 的反欺诈公司。第三方数据库（GetLatka、Growjo）的收入估计收敛在
              2024 年 ARR $103-$111M 左右。这意味着收入较 2023 年 $82.3M 同比增长 25.3%，显著低于 Forter 在 2021 年 5 月 Series F 时声称的约 100%
              增长。以约 625 名平均员工计算，人均收入约 $165K，低于一流企业 SaaS 同业。相比之下，上市竞争对手 Riskified（NYSE: RSKD）2025 全年收入 $344.6M，员工约 617
              人，意味着人均收入 $559K。这一差距凸显 Forter 相较表面可比竞争对手收入规模更低，也引发对其运营杠杆和销售效率的疑问。所有 ARR 或增长估计均未由 Forter
              直接确认；公司不发布季度或年度财务业绩。
