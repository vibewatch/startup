  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Forter 通过 GMV 挂钩的 SaaS 订阅变现：商户按已批准 GMV
              的一定比例或按已批准交易笔数付费，并随月交易量放大，同时叠加高级模块。平台是模块化的——核心反欺诈、账户保护、支付优化、滥用防护和拒付担保分别定价。Forter 不公开每笔交易费率或 GMV
              百分比费率；所有合同都是与销售团队谈判的定制报价。年合同额从低五位数（较小商户）到大型企业客户的中六位数或更高不等。GetLatka 估计 Forter 报告的约 10,000 个客户平均 ACV 为
              $10.3K，反映长尾 SMB 客户群与较小一组高 ACV 企业账户并存。多年承诺和预付款通常可换取折扣。实施、上线和专属支持单独界定成本，会影响总合同价值。拒付担保模块具有辨识度：Forter
              对之后被争议为欺诈的已批准交易承担直接财务责任，把风险敞口从商户转移给 Forter。这在 Forter
              资产负债表上形成或有负债，但规模未披露。担保模块定价预计因风险溢价而具备更高利润率，但准备金方法和精算假设是私有信息。
