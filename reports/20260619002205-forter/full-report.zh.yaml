chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Forter 是一家总部位于纽约的 SaaS 公司，定位为「数字商务信任平台」。公司成立于 2013 年，为企业级电商、零售、金融科技、餐饮和旅游商户提供实时 AI
              驱动的反欺诈、身份情报和支付优化。核心价值主张是帮助商户批准更多真实交易、挡住欺诈，把过去的成本中心变成收入推动器。Forter 还在 Tel Aviv、London 和 Paris
              设有办公室，体现其全球布局和以色列技术根基。商业模式是订阅式 SaaS 加按交易计费，由拒付担保托底，使 Forter 的经济性直接绑定客户结果。截至 2026 年 1 月，Forter 平台由全球超过
              400,000 家在线企业和超过 2B 名购物者构成的网络驱动，累计处理数字商务交易超过 $2T。公司仍为私营；最后已知估值 $3B 来自 2021 年 5 月 Series F，截至 2026 年 6
              月尚未提交 IPO 文件或宣布公开发行。Forter 在 2026 年转向「Agentic Intelligence」定位——包括 Prism AI copilot 和自主拒付回复
              agent——标志着公司面向企业客户的 AI 原生反欺诈运营战略转向，以应对日益自动化的商务环境。
