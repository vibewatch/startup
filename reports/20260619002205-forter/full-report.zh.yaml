          - type: callout
            title: 继续研究：投入前等待财务披露和 IPO 清晰度
            body: >-
              至少满足以下条件，才足以给出跟踪或买入建议：（a）经审计 ARR > $130M，（b）毛利率 > 60%，（c）NRR > 105%，（d）确认 IPO 申报或并购意向书，（e）披露 Series F
              清算优先权，且相对退出情景可控。在这些披露缺失时，当前可比倍数无法可靠支撑 $3B 标记。CFO 到任和二级市场活跃提供了建设性底线，但不能替代财务透明度。
