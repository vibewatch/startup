      - number: '2.5'
        title: 图表要点
        blocks:
          - type: callout
            title: 误拒悖论：隐藏收入破坏远超欺诈损失
            body: >-
              Riskified 估计，误拒——被反欺诈系统错误拒绝的真实订单——每年让全球零售商损失 $443B，是直接欺诈成本的九倍。LexisNexis 数据确认，64%
              的北美商户称欺诈控制主动伤害客户转化率。这个结构性悖论意味着，如果商户只优化欺诈下降而不控制误报率，常常会得到净负收入结果。Forter
              的合同欺诈担保模式直接回应了这一点：它把供应商激励对齐到同时最小化欺诈损失和误拒，这可能是其最重要的企业级差异化。
            calloutType: insight
            claimRefs:
              - CM019
              - CM033
              - CM040
          - type: callout
            title: 分析师估计分散，限制精确市场规模测算
            body: >-
              可信分析师对 2026 年全球 FDP 市场给出的 $40–89B 区间，反映的是真实范围分歧，而不是数据错误。Forter 的 SAM 无法从公开来源精确推导；受证据约束的 $1.5–15B 估计置信度低，应由
              Forter 管理层验证。若投资备忘录直接采用高端 $88B 数字而不调整范围，将相较企业级数字商务子板块把直接可寻址机会夸大 2–4x。
            calloutType: risk
