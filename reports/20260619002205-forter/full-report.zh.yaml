      - number: '8.2'
        title: 估值背景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Forter 上一次融资是在 2021 年 5 月，由 Tiger Global Management 领投 Series F，融资 $300M，投后估值 $3B——这轮融资让公司估值较六个月前的 Series
              E 翻了三倍。投资方还包括 Bessemer Venture Partners、Sequoia Capital、Third Point Ventures、Adage Capital
              Management、March Capital、NewView Capital 和 Salesforce Ventures。六轮累计融资达到 $525M。2021 年 5
              月之后，公司没有再完成新的一级股权融资，也就是说，$3B 估值已经 超过五年没有被确认或重估。Forge Global 和 UpMarket 的二级市场数据显示，交易意向落在 $3.0–3.5B 区间，典型
              折价为 15–35%，更多反映流动性不足和 IPO 延迟风险，而不是市场充分发现价格后的结果。

              最直接可比的上市公司是 Riskified（NYSE: RSKD）。2026 年 Q1，Riskified 报告收入 $88.3M（同比 +7%），TTM 收入 $350.5M，并把 2026 全年收入指引上调至
              $376–384M。公司在 2025 年 Q4 首次达到 GAAP 盈利里程碑，目前股价 约 $4.97/股，市值接近 $850–900M，企业价值约 $570–620M（扣除 $276M 现金，零债务）。对应
              EV/TTM Revenue 约 1.7×——这个倍数反映的是 Riskified 增速较慢（同比约 7%）、盈利能力改善但尚未被验证，以及 2022–2025 年整个板块的倍数重置。 Riskified
              的收入规模是 Forter 的 3.4×；即便给 Forter 相当于 Riskified 隐含倍数 2× 的增长溢价，得到的 $3–4× EV/Revenue 也只对应 $309–412M，远低于 $3B
              标记。

              Windsor Drake 对欺诈决策与编排子板块的基准显示，AI-native 平台的上市公司 EV/Revenue 为 8–15×，私人公司 ARR 倍数为 10–20×。2024–2025
              年的可比并购给退出底价定标：Thoma Bravo 以 $5.3B 收购 Darktrace，约 8.1× 收入；Permira 以 $1.3B 入股 BioCatch，约 8.1× ARR；Feedzai 在
              2025 年 10 月 Series E 估值 $2B。低端样本中， Experian 以 $350M 收购 ClearSale，隐含约 3.5× 收入；Entrust 收购 Onfido 的价格为
              $400–650M，隐含 3–4.5×—— 更像区域龙头或数据资产收购，而不是品类龙头退出。套用到 Forter 2024E ARR $103M，可比并购底线 8.1× 对应约 $835M，优质私人公司上限
              15× 对应约 $1.55B，两者都显著低于 $3B。
