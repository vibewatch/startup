  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入披露
        - 2024 和 2025 年经审计 ARR，并按 cohort 层级拆分
        - 当前所有估算均来自第三方；ARR 可能有重大差异；gross ARR 与 net ARR 的区别无法核实
        - 向 Forter 管理层在 NDA 下索取；由外部审计所确认
      - - 毛利率和单位经济
        - 披露 COGS，包括拒付准备金费用、数据基础设施成本和已支付担保索赔
        - 真实毛利率未知；拒付担保带来精算成本，可能把毛利率压到 50–60%
        - 管理层披露；对标 Riskified 已披露的 52% non-GAAP 毛利率
      - - Net Revenue Retention
        - 按 vintage year 划分的 cohort 层级 NRR，理想覆盖 2020–2025
        - 99% 标识留存率是 gross retention，不是扩张；若 NRR 低于 100%，Forter 会从扩张资产改写为收缩风险
        - Forter 管理层数据室；通过关键客户访谈验证
      - - Series F 股权结构瀑布
        - 优先股条款：清算优先权倍数、参与权、反稀释条款
        - 若退出估值低于 $3B，优先投资人回收可能让普通股股东几乎没有收益
        - Forter 法律顾问提供 cap table；由法律尽调机构独立复核 term sheet
      - - IPO 时间线和流程
        - S-1/F-1 草案或保密申报状态；承销商选择；通往公开市场的时间线
        - CFO 入职是建设性信号，但还不够；2–3 年 IPO 跑道会显著改变风险 / 回报测算
        - 与董事会和管理层讨论；在 SEC EDGAR 监控 Forter Inc. 名下 S-1 申报
      - - 拒付准备金精算数据
        - 准备金方法、历史拒付损失率、经济衰退和欺诈激增条件下的压力测试情景
        - 担保是 Forter 的核心差异化，也是不确定性最大的未量化或有负债
        - 管理层精算报告；由独立损失准备金专家复核；与 Riskified 毛利率趋势比较
    notes: 第 1–3 项是任何估值模型的前提；第 4–6 项是承销任何退出情景的前提。缺少这些，继续研究建议不能上调为跟踪或买入。
    claimRefs:
      - CV046
      - CV040
      - CV041
      - CV047
