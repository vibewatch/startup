      - - 行为分析层
        - 每个事件采集约 2KB 数据；存储 25B 事件用于重建会话
        - 商户店面的 JavaScript SDK + 移动 SDK；浏览器 / App 兼容性
        - 商户 SDK 版本分化；注重隐私的浏览器阻断 JavaScript，会削弱信号质量
      - - 数据基础设施（Aerospike + XDR）
        - 分布式 NoSQL 数据库；用 Cross Datacenter Replication 保持多区域一致性
        - 底层计算跑在 AWS；区域数据中心覆盖美国、欧盟爱尔兰
        - AWS 基础设施依赖；区域故障会先影响本地复制，直到 XDR 故障切换
      - - 生成式 AI Insights / Prism
        - 用对话式查询追溯欺诈决策；生成仪表盘；识别智能体活动
        - 大语言模型推理（未披露供应商）；访问 Forter 网络数据
        - 未说明 LLM 供应商；交易调查存在幻觉风险；早期 GA 成熟度
      - - API / SDK 集成层
        - REST API、JS/iOS/Android SDK、平台连接器（Shopify、Salesforce、Magento）
        - 依赖商户工程团队完成集成；维护连接器版本
        - 商户侧连接器版本滞后；定制结账流程与旧 PSP 兼容存在缺口
