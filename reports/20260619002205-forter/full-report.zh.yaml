          label: 身份置信度门控账户事件
        - from: ai-engine
          to: payment-opt
          label: 风险评分影响支付路由和 SCA 豁免
        - from: fraud-mgmt
          to: chargeback-auto
          label: 已批准交易进入拒付工作流
        - from: bot-detection
          to: ai-engine
          label: 机器人信号丰富实时风险评分
        - from: fraud-mgmt
          to: merchant
          label: 向商户交付实时批准 / 拒绝决策
        - from: acct-protection
          to: merchant
          label: 交付账户信任决策
        - from: payment-opt
          to: merchant
          label: 交付支付路由建议
        - from: merchant
          to: data-network
          label: 新交易信号回流身份网络（网络效应）
