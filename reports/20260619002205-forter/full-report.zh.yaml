      - number: '5.4'
        title: 数据与机器学习飞轮
        blocks:
          - type: paragraph
            body: >-
              Forter 最主要的竞争护城河，是共享商户联盟模式带来的数据网络效应。每个加入网络的商户，都会把匿名化行为和身份信号回流到全球图谱，提升所有参与者的检测准确率。依托 400,000+ 商户和 20 亿+
              消费者画像，一个欺诈者攻击某个商户后，风险信号会立刻在整个网络中被丰富。平台存储约 250 亿条小型行为事件——每条约 2
              KB——这些事件在购物者会话中捕获；购买发起时，引擎在毫秒内拉取会话历史、历史画像数据和跨商户信号，拼出信任评分。机器学习模型覆盖设备指纹、行为异常检测、买卖双方串通、地址操纵、盗刷测试和社会工程代理模式。模型刷新是连续的；2024
              年 10 月发布记录了可量化的准确率提升，但没有命名模型版本，说明其 MLOps
              管线可能频繁做影子部署和渐进流量切换。飞轮的关键依赖在于：如果商户持续入网放缓，身份图谱质量会下降；同时，网络信号最丰富的区域集中在北美电商，欧洲和新兴市场覆盖广度仍是未验证缺口。截至 2025 年 12
              月，AI 驱动的欺诈自动化同比上升 202%，因此底层模型的刷新节奏和对抗鲁棒性，对平台价值留存至关重要。
            claimRefs:
              - CE021
              - CE022
              - CE023
              - CE024
              - CE025
      - number: '5.5'
        title: 集成、生态与合作伙伴
        blocks:
          - type: paragraph
            body: >-
              Forter 参与的是一个多层集成生态，横跨电商平台、支付基础设施和战略技术伙伴。电商平台侧，Forter 于 2023 年 10 月加入 Shopify Plus Certified App Program，让
              Shopify Plus 商户可原生集成；公司报告的结果包括拒付降低 72%、误拒降低 46%。Forter 是 Salesforce Commerce Cloud 认证伙伴，并记录了 SNIPES
              等商户的快速实施部署。Adobe Commerce（Magento）也提供原生集成。支付和安全层面，Forter 在 2026 年扩大与 Very Good
              Security（VGS）的合作，打造可信的智能体商业凭证，把 Forter 的实时身份智能与 VGS 的中立代币化基础设施结合，使信任信号可随支付代币在智能体到商户流程中流转。Forter 已与 Google
              围绕 Agent Payments Protocol 开展合作，推动智能体商业安全行业标准。AWS Global Partnership 让 Forter 可进入 AWS Marketplace 的联合销售动作和
              ISV Accelerate go-to-market 计划。Forter 的 Partner Program
              早年正式推出，如今覆盖金融机构、市场平台运营商、ISV、支付服务提供商、系统集成商和咨询公司。开发者界面包括 REST API、iOS / Android / JavaScript
              SDK、docs.forter.com 开发者门户，以及 GitHub（github.com/forter）上的 Magento2 和 Salesforce B2C 开源平台插件。
