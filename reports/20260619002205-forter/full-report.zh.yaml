            title: Riskified 的可解释 AI 投资或在受监管垂直形成差异化
            body: >-
              金融服务、保险和受监管电商垂直领域面临越来越强的自动化决策解释压力，Riskified 对可解释 AI 的明确投入为其提供了对 Forter 黑箱路径的潜在楔子。Forter 缺乏决策透明度，是 2026
