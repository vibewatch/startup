      - number: '4.3'
        title: 单位经济、利润率与成本结构
        blocks:
          - type: paragraph
            body: >-
              Forter 不公开毛利率。参考同业基准，反欺诈决策 SaaS 平台通常实现 60–80% 非 GAAP 毛利率，来自高自动化和每次决策低边际成本。最直接的上市可比 Riskified 在 2025 年报告
              52–57% 非 GAAP 毛利率，受拒付担保损失准备拖累。Forter 的拒付担保同样会形成收入成本拖累，规模取决于已批准交易中的欺诈率。客户获取成本（CAC）、CAC
              回收期和净收入留存（NRR）均未披露。Forter 99% 的 logo 留存意味着总收入留存强，但 NRR（反映现有客户群内扩张和收缩）未知。企业反欺诈销售周期通常对 $100K
              以上合同需要六到十二个月，Forter 的定制报价模型进一步增加复杂度。约 $165K 的人均收入相对成熟 SaaS 标准偏低；不过，这也反映 Forter 仍处于投入期。运营费用——R&D、销售与营销、G&A
              的拆分——完全未披露。Forter 可能尚未达到经营盈利：公司在 2025 年 3 月聘请一位曾四次担任上市公司 CFO、两次完成 IPO 的高管，说明公司处于 IPO
              前效率优化阶段，而非盈利后阶段。公开证据中没有 breakeven 或正 EBITDA。
