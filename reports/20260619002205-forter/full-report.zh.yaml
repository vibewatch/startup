      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Forter 的运营风险画像为中到高。其平台是覆盖 400,000+ 商户结账决策的实时基础设施；如果在交易高峰事件（Cyber Monday、Prime
              Day）期间发生长时间平台宕机，将在规模上造成商户收入中断和声誉损害。Forter 持有 SOC 2 Type II、PCI DSS Level 1、ISO 27001 和 ISO 27701
              认证，并持续开展第三方渗透测试，这些都提供了有意义但非决定性的运营成熟度证据。截至 2026 年 6 月，未识别到公开报告的数据泄露或安全事件。

              AI 模型风险在结构上重要。欺诈模型准确率受对抗漂移影响：欺诈者实时调整手法时，模型必须持续再训练才能保持准确。Forter
              未披露模型漂移检测方法、再训练频率或准确率退化阈值。未披露的准确率侵蚀，可能表现为获批欺诈交易突然增加（拒付责任激增），也可能表现为误拒激增（商户收入损失和客户流失风险）；前者会通过担保敞口直接冲击 Forter
              自身资产负债表。

              Forter 2026 年「Agentic Intelligence」产品转向——推出 Prism AI copilot 和自主拒付响应智能体——增加了新的运营风险。自主运行在企业工作流中的 Agentic AI
              系统，面临独特的治理和问责挑战。Gartner 预测，到 2027 年高达 40% 的 Agentic AI 项目会因治理缺口失败或被放弃；如果这些自主智能体产品在欧盟辖区部署，EU AI Act 的 2026
              年 8 月透明度义务和 2027 年 12 月合规要求也将适用。Forter 尚未为其智能体产品发布合规评估或治理框架。

              Forter 处理 20 亿+ 消费者画像数据。若该数据集发生泄露，将构成系统性事件，触发 GDPR、CCPA 和美国州级泄露通知法律下的多司法辖区披露义务。Forter
              尚未量化系统性身份泄露带来的合计责任敞口。

              Forter 还面临潜在 AI 偏见风险。AI 欺诈检测系统正因对受保护群体的差别影响受到更多法律审视；Forter 未发布任何公平性测试或差别影响审计结果，使其成为一个实质未解决合规事项。
