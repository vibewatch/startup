          - type: callout
            title: 误拒问题仍是平台最核心的不利信号
            body: >-
              Forter 自身 2023 年消费者研究发现，76% 的购物者有过负面线上购物体验，误拒对年轻消费者影响尤其大。独立行业分析显示，误拒造成的收入损失是实际欺诈损失的 9–30 倍。Forter
              将平台营销为误拒降低工具，但实施后的调优负担仍在商户一侧，竞争产品（Signifyd、Riskified）也在争夺同一主张。这是一个长期技术和商业风险。
