      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              主要需求驱动来自 AI 推动的欺诈复杂度快速升级。Juniper Research 记录显示，deepfake 和合成身份让欺诈者能够规模化攻击并压垮规则式系统；全球电商欺诈预计从 2025 年 $48B 升至
              2029 年 $107B。合成身份证件欺诈在 2024 年 Q1 至 2025 年 Q1 之间激增 311%（Sumsub）。AI 购物 agent
              的出现——代表消费者行动的自主软件——消除了传统欺诈引擎使用的许多行为线索，为基于身份图谱的决策创造结构性需求。在 NRF 2026，Forter 记录到一家大型零售商的未收到商品索赔已增长至总销售额约
              1%，显示 AI 辅助的协同欺诈正在放大。


              监管顺风是第二个结构性驱动。EU PSD2 Strong Customer Authentication 要求在合规市场实现了约 55% 的 CNP 欺诈下降；认证交易的责任转移给发卡方。即将到来的 EU
              PSD3 框架会延续这种监管压力。第一方或友好欺诈目前占全球全部欺诈案例的 36%（MRC 2026），同比超过翻倍，把保护预算从支付欺诈扩展到政策和争议管理。


              采用约束同样实质存在。截至 2025 年，41% 的北美商户仍依赖人工流程防范欺诈（LexisNexis）。发卡方、商户和 PSP 之间的数据碎片化限制了任何单一供应商的信号质量。企业平台的集成和切换成本通常需要
              6–12 个月部署周期和专门工程资源。多个独立观察者（PYMNTS、LexisNexis、Entersekt）指出一个持续悖论：反欺诈系统会通过误拒侵蚀客户体验。64%
              的北美商户称欺诈控制损害客户转化率，36–37% 的受访者认为糟糕用户体验是新账户创建时的主要放弃驱动。这些约束会偏向在位供应商和 PSP 捆绑工具，即便挑战者的表现数据更好。
