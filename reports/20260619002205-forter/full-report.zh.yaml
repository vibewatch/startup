      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              Forter 公开声称，截至 2024 年客户留存率为 99%，企业 NPS 超过 75；两者都来自官方公司渠道的自报。这些是 logo
              留存指标：即续约客户占比，不是反映存量内扩张、收缩或追加销售的净收入留存。NRR 没有公开披露，这是留存叙事中的实质缺口——99% 的 logo
              留存与高毛收入留存一致，但不能说明现有客户是在扩大模块使用、缩小合同范围，还是平续。

              第三方评价平台佐证了满意度：FeaturedCustomers 汇总 3,364 个引用评分，得分 4.8/5；G2 29 条评论得分 4.5/5（62% 五星；低于三星为 0%）；Capterra 15
              条已验证评论得分 4.7/5；Gartner Peer Insights 27 条评论给 Forter 4.3/5，并有 5 到 10 条体验评分；PeerSpot 给 Forter
              9/10，并将其列为欺诈检测第 #6。跨平台最常见主题是快速自动化决策、降低人工审核负担，以及响应及时的客户支持。最常见批评是 Forter 决策逻辑透明度有限——Forter 已通过 2024
              年推出的增强版决策可解释性门户和生成式 AI 洞察能力处理这一担忧。

              粘性驱动因素包括：深度嵌入支付流程的技术集成（替换通常需要六到十二个月）、拒付担保让 Forter 经济利益与客户收入对齐、多模块交叉销售，以及联盟网络效应——转向竞争对手意味着失去 Forter
              提供的跨商户情报。
