  - id: FI001
    title: 收入模型桥 — 从 GMV 到毛利
    type: flow
    layout: standard
    summary: 商户交易量如何转化为 Forter 的 SaaS 订阅收入和估计毛利贡献。
    data:
      nodes:
        - id: merchant-gmv
          label: 商户 GMV
          detail: 通过 Forter 决策引擎处理的电商订单总额
        - id: decisioning-engine
          label: AI 决策引擎
          detail: 针对每笔交易实时批准 / 拒绝；拒付担保附着在获批交易上
        - id: subscription-revenue
          label: 订阅收入
          detail: 获批 GMV 的百分比或按笔收费；按交易量分层
        - id: module-revenue
          label: 模块加购收入
          detail: 账户保护、滥用防控、支付优化——核心欺诈模块之外的额外收费
        - id: cogs
          label: 收入成本
          detail: 基础设施、数据成本、模型训练、拒付损失准备（担保模块）
        - id: gross-profit
          label: 毛利
          detail: 基于同业基准估计毛利率为 60–80%；实际未披露
        - id: opex
          label: 运营费用
          detail: R&D、销售与营销、G&A；未披露；当前规模下可能超过毛利
        - id: operating-loss
          label: 经营亏损（估计）
          detail: Forter 未确认盈利；经营亏损规模未知
      edges:
        - from: merchant-gmv
          to: decisioning-engine
          label: 交易量输入
        - from: decisioning-engine
          to: subscription-revenue
          label: 按量分层费率适用于获批交易
        - from: decisioning-engine
          to: module-revenue
          label: 加购模块激活额外定价层
        - from: subscription-revenue
          to: cogs
          label: 确认收入；扣除 COGS
        - from: module-revenue
          to: cogs
          label: 模块收入；担保损失准备计入 COGS
        - from: cogs
          to: gross-profit
          label: 毛利率剩余
        - from: gross-profit
          to: opex
          label: OpEx 由毛利支撑
        - from: opex
          to: operating-loss
          label: 超出毛利的 OpEx = 经营亏损
    approximationNotes: 60–80% 的毛利率估计基于 Riskified（52–57%）和一般欺诈 SaaS 基准；Forter 实际毛利率未披露。经营亏损为推断；Forter 未确认盈利。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI020
      - CI022
  - id: FI002
    title: 单位经济桥 — 从单客户收入到回本周期
    type: flow
    layout: standard
    summary: 展示 Forter 单位经济链条中从 ACV 到 CAC 回本的已知与未知环节。
    data:
      nodes:
        - id: avg-acv
          label: 平均 ACV：$10.3K（所有客户）
          detail: GetLatka 第三方估计；企业 ACV 显著更高（$100K–$1M+）
        - id: gross-margin-per-customer
          label: 单客户毛利（未知）
          detail: 估计毛利率 × ACV；实际毛利率未披露
        - id: cac
          label: CAC（未披露）
          detail: 全口径获客成本，包括销售、营销和上线支持；未披露
        - id: payback-period
          label: CAC 回本周期（未披露）
          detail: CAC ÷（ACV × 毛利率）；缺少 CAC 和毛利率数据，无法计算
        - id: ltv
          label: LTV（未披露）
          detail: 单客户毛利 × 平均合同寿命；99% logo 留存意味着平均寿命长
        - id: ltv-cac
          label: LTV:CAC（未披露）
          detail: 无法计算；LTV 和 CAC 都是私营公司证据缺口
      edges:
        - from: avg-acv
          to: gross-margin-per-customer
          label: 毛利率 × ACV
        - from: gross-margin-per-customer
          to: payback-period
          label: 每年毛利贡献
        - from: cac
          to: payback-period
          label: CAC 是回本分子
        - from: payback-period
          to: ltv
          label: 回本周期锚定 LTV 时间范围
        - from: ltv
          to: ltv-cac
          label: LTV:CAC 比率需要两个输入
    approximationNotes: 所有标注为「未披露」的节点都是真实的私营公司证据缺口；实际数值可能有重大差异。$10.3K 平均 ACV 是第三方估计，包含大量 SMB 长尾，可能显著低估企业段经济性。
    claimRefs:
      - CI005
      - CI024
      - CI025
      - CI023
