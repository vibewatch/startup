      - number: '7.3'
        title: 伙伴、竞争与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Forter 的竞争位置已有轻微侵蚀。最接近的上市同业 Riskified（NYSE: RSKD）在欺诈检测和预防市场拥有约 3.4% 份额，高于 Forter 的 3.0%；并报告 2025 年收入
              $344.6 million——约为 Forter 估算 ARR 的三倍——且作为上市公司具备完整财务透明度。Forter 的私有状态意味着，企业采购团队在比较两者时必须接受供应商不透明这一风险，而
              Riskified 提供可审计财务和公开披露的 SLA。Signifyd、SEON 和 Kount 也在拒付担保和 AI 决策领域竞争，功能差异各不相同。

              结构上最具威胁的竞争风险，是支付平台内嵌反欺诈的兴起。Stripe Radar 背靠 4M+ 商户网络，并把深度集成的反欺诈作为支付栈一部分提供——消除独立集成步骤，降低商户切换摩擦。PayPal
              内置欺诈保护对其庞大商户基础也是类似的捆绑替代。商户为简单和成本而整合技术栈时，独立反欺诈品类会逐步受到支付原生巨头挤压。Forter 通过行为 AI
              和拒付担保形成差异化，部分缓解风险，但对成本敏感或正在整合支付的客户，这一风险并未消失。

              AI 模型透明度正成为越来越重要的买家标准。Forter 的黑箱模型设计，在受监管部署中可能成为采购障碍，因为 EU AI Act 或行业特定规则可能要求可解释性，尤其是在金融服务和政府垂直。SEON
              等竞争对手提供透明的 whitebox 模型，可能拿下必须具备可解释性的账户。

              云和数据基础设施集中度带来未验证但实质的运营依赖风险。Forter 平台需要实时 ML 推理和海量数据吞吐；如果主要托管在单一 hyperscaler 上（行业惯例普遍推测为
              AWS，但未确认），长时间云宕机会同时中断所有商户客户的实时欺诈评分。支付网络依赖（Visa / Mastercard 交易数据流作为模型输入）同样集中；卡组织任何 API 政策变化都可能削弱模型信号质量。

              少数企业锚定客户的收入集中，是 Forter 未确认但结构上合理的风险。公司未披露客户集中度；Forter 声称的 99% 客户留存尚未被独立验证，也没有发布 cohort 数据。
