        - 驱动因素
        - 2025–2026 年已活跃且加速
        - 市场需求从静态规则转向基于网络效应的 AI 决策，推动客户采用平台而非单点工具
        - 量化 Forter 覆盖的攻击类型宽度，并对照 AI 生成欺诈向量；询问 AI 欺诈事件中的赢单率
      - - 第一方 / 友好欺诈增长（到 2026 年占全部欺诈的 36%）
        - 驱动因素
        - 已活跃且加速
        - 总体防护预算从支付欺诈扩展到争议管理、退货政策和购后工具
        - 验证 Forter 在友好欺诈高发垂直行业（如零售、旅行）的赢单率和合同渗透率
      - - PSD2 / SCA 监管强制要求（欧盟执法全面生效）
        - 驱动因素
        - 已全面执行；PSD3 临近
        - 合规预算成为结构性支出；欧盟 CNP 欺诈约下降 55%；SCA 交易责任转移给发卡方
        - 评估 Forter Smart 3DS 和 PSD3 准备度；索取欧盟商户赢单率和续约率数据
      - - Agentic commerce——AI 购物代理替代人工交互
        - 驱动因素
        - 2026 年兴起并增长
        - 行为线索被抹掉，新的欺诈面随之出现；代理驱动交易需要身份图谱级信任
        - 评估 Forter 检测代理流量的能力；要求提供客户需求和已部署用例证据
      - - 误拒成本认知提升（全球每年 $443B，为实际欺诈损失的 9 倍）
        - 驱动因素
        - 2025–2026 年认知提升
        - ROI 叙事从反欺诈成本中心扩展为收入最大化平台，支撑溢价定价
        - 索取 Forter 误拒率保证条款，以及证明收入提升的商户合同数据
      - - 企业平台切换成本高、集成复杂
        - 约束
        - 持续存在的结构性问题
        - 存量系统粘性强；利好 PSP 捆绑工具和已有平台足迹的供应商
        - 梳理 Forter 相比存量方案的价值实现时间；对比 Stripe Radar 或 Adyen 捆绑工具的集成成本
      - - 手工流程仍占主导（2025 年北美商户 41%）
        - 约束
        - 缓慢下降
        - 大片市场仍未自动化；但 Forter 聚焦企业客户，该细分市场优先级较低
        - 了解 Forter 如何处理企业从手工流程迁移时的入驻成本和迁移风险
      - - 数据碎片化（发卡方、商户、PSP 各自孤岛运营）
        - 约束
        - 结构性问题；协作模式仍处早期
        - 单一供应商的信号质量被限制；Forter 的联盟模式只能部分缓解，无法单独补上发卡方数据缺口
        - 评估 Forter 商户联盟的规模和覆盖；询问发卡方数据共享协议
    notes: 时间判断基于截至 2026 年 6 月的公开证据。驱动因素 / 约束的严重性是结合引用来源得出的分析判断；每项尽调问题都用于验证 Forter 的具体定位。
