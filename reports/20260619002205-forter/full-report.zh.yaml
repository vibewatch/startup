      - number: '7.5'
        title: 人员、执行与战略风险
        blocks:
          - type: paragraph
            body: >-
              Forter 的联合创始人集群构成实质关键人依赖。Michael Reitblat（CEO）、Liron Damri（President）和 Alon Shemesh（Chief Analyst）自公司 2013
              年创立以来持续任职，掌握定义产品和文化的战略、商业和技术知识，并共同构成主要投资人关系界面。三人任何职位都没有公开披露继任计划。创始团队领导权集中在三个人身上，而他们又是童年朋友、同属一个军事情报单位校友，这带来独特的相关离职风险：影响一位联合创始人动机的事件（IPO
              失望、战略分歧、外部机会）可能同时影响三人。

              2026 年 Agentic Intelligence 转向扩大了执行风险。交付自主 AI 智能体产品（Prism
              copilot、自主拒付响应智能体）需要智能体编排、安全评估和治理框架等能力，这些能力不同于核心欺诈决策能力。Gartner 预测，到 2027 年 40% 的企业 Agentic AI
              项目会失败或被放弃，这框定了执行风险：如果 Forter 无法兑现智能体叙事，它既会损害市场可信度，也可能让基于未来产品承诺签下扩展合同的早期采用者失望。

              治理不透明是结构性战略风险。董事会构成、个别董事身份、委员会结构、投资人权利协议和反稀释条款全都未公开。缺少公开治理信息，使客户、伙伴或共同投资人无法评估，管理层监督和资本配置是否有效。若 IPO
              进程出现争议，或投资人围绕时机和估值产生分歧，潜在治理张力可能浮出水面。

              IPO 退出路径中的财务工程风险增加了复杂度。如果 Forter 在可比上市公司以 5–6x 收入交易的市场环境下推进 IPO，从 $3 billion 私有估值打 70%–80%
              折扣在数学上是可能的。这种情境可能影响员工股权激励，触发期权计划重组，并在技术和销售人才中制造留存风险——而智能体 AI 转向恰恰需要最聚焦的执行。
