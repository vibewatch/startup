            title: 数据网络效应形成持久护城河
            body: >-
              Forter 的 400,000+ 商户联盟和 20 亿+ 消费者身份图谱，形成复利式网络效应，单商户反欺诈工具在结构上很难复制。每增加一个新商户，都会实时提升所有其他商户的检测准确率；250
