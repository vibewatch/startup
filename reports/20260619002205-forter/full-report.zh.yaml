      - number: '2.2'
        title: 市场规模与预测
        blocks:
          - type: paragraph
            body: >
              多家独立分析机构发布了 2026 年欺诈检测与防护市场规模估计，数值从 $40.4B（Grand View Research，最窄产品范围）到 $88.77B（Business Research
              Company，电商特定 FDP）不等。差异来自方法，而不是事实错误：更宽的估计纳入银行 AML 和保险欺诈，更窄的估计限定在电商支付欺诈工具。Fortune Business Insights 估计广义 FDP
              市场 2026 年为 $67.12B，并以 17.5% CAGR 增至 2034 年 $243.72B。Mordor Intelligence 的 $70.19B 和 Straits Research 的
              $81.62B 位于中段。Business Research Company 给出的电商特定估计为 $88.77B、CAGR 20.8%，覆盖与 Forter 最直接相关的层。


              在完整 FDP 市场之下，相邻子池提供背景但不能重复计算：数字身份验证市场 2026 年估计为 $14B，CAGR 14.6%（Market.us）；账户接管保护板块 2026 年达到 $7.46B，CAGR
              18.89%（Global Growth Insights）。这些池子与核心 FDP 有部分重叠，但确认企业在整个信任栈上投入很深。


              Forter 的可服务可寻址市场（SAM）没有任何独立分析机构发布。基于 Forter 披露的 $500B+ 年度 GMV 处理量，以及市场平均欺诈防护支出占 GMV 的 0.3–1%，一个受证据约束的估计是：以
              Forter 当前网络规模计算，年度合同收入 SAM 约 $1.5–5B；若采用扩展至完整企业级电商层，则可向 $8–15B 放大。该估计置信度低，只是推理底线，不是有来源的数据点。尽调应直接向 Forter
              管理层获取经验证的 SAM 规模。底层电商 GMV 总市场在 2026 年达到 $6.88T，确立了承受欺诈风险的交易池规模。全球电商欺诈损失仅 2025 年就达到 $48B，并正沿着到 2029 年每年
              $107B 的路径上升；2023–2027 年累计损失估计为 $343–362B。
