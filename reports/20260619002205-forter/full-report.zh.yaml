  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与目标垂直
        blocks:
          - type: paragraph
            body: >-
              Forter 的客户基础分成两个清晰层级。更大的网络——截至 2026 年 1 月为 400,000+
              家线上企业——包括通过支付提供商和商业平台集成参与的间接成员；它们贡献交易信号，也受益于集体欺诈情报。直接商业客户估计约 10,000 家企业（GetLatka
              估算；公司未正式披露），更偏企业级和中高端市场商户，因为 Forter 的高端经济账对这些客户才成立。

              六个主要垂直支撑 Forter 的市场进入。企业电商和零售是最大板块，由 ASOS、Nordstrom、Wayfair、Deckers（UGG / HOKA）、Puma 和 Eddie Bauer
              等命名客户锚定。旅游垂直具备高交易量环境，误拒成本尤其高；Priceline、Kiwi.com 和类似 OTA 客户依赖 Forter 做实时预订决策。金融科技和数字银行板块包括 Green Dot，其用
              Forter 保障数字支付和账号完整性。QSR 与外卖垂直在 2026 年 1 月拿到最具知名度的客户：与全球 McDonald's 合作，覆盖线上订单、支付流程和会员；HelloFresh 和
              EatStreet 也代表食品垂直。市场平台和平台型客户——Instacart、eBay、Fiverr——面临双边欺诈，并利用 Forter 身份图谱的广度。DTC 和奢侈品板块包括 Burrow、Kurt
              Geiger 和 James Allen，更偏拒付担保产品。

              地理上，客户基础集中在北美和西欧；2024 年新加坡和东京办公室开设后，APAC 布局加速，以服务有本地化数据驻留要求的高增长市场。Forter 的爱尔兰数据中心（2024 年上线）满足欧洲客户的欧盟 GDPR
              合规。各细分市场中，决策者通常是中大型组织的欺诈经理、CRO 和数字支付负责人——这些买家能用可衡量收入结果，证明 Forter 的高端拒付担保定价模式合理。SMB
              渗透有限；公司的公开案例名单和产品定位都偏向大型、高交易密度企业。
