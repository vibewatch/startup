          - type: callout
            title: 身份图谱网络效应形成耐久数据壁垒
            body: >-
              Forter 的跨商户身份图谱——跟踪 1.5B+ 购物者画像、覆盖 $250B+ 年交易量——会随每个新商户部署而复利。新进入者面临冷启动问题：没有可比的商户数据共享协议，就无法匹配支撑 Forter
              亚秒级决策准确率的信号密度。Forter 与 Signifyd、Riskified 在不同程度上共享这类护城河，但 Forter 的集成深度和市场年限意味着其图谱明显领先较小的纯反欺诈同业。
