      - number: '6.3'
        title: 命名客户证明与案例研究
        blocks:
          - type: paragraph
            body: >-
              Forter 的命名客户证据，实质上强于只展示 logo 的验证。本次审查核验到，至少七家客户在案例研究或新闻稿中发布了量化结果；另有五家由 Forter 正式点名并附带用例描述，但没有公开结果指标。

              McDonald's——2026 年 1 月宣布的全球合作——是 Forter 最近最具战略意义的胜利。它把平台扩展到全球规模的 QSR 垂直；McDonald's VP & Treasurer Helen
              Jorski 的引述确认了选择：「随着我们的数字生态不断增长和演进，我们也在投资解决方案，保护餐厅和加盟商免受新的欺诈风险。Forter 帮助我们同时兑现这两点。」全球时尚平台 ASOS 为 PSD2 / 3DS
              合规部署 Forter，将送入 3DS 的交易减少 83%，失败和放弃控制在 3%——这是 ASOS 自身发布案例确认的直接转化率收益。Deckers（UGG、HOKA）通过 Salesforce
              Commerce Cloud 集成，四周部署后达到 98%+ 批准率，并推动向 EMEA 和日本的国际扩张。Wayfair 和 Priceline 分别在 2025 年 11 月赢得 Forter 首届
              IMPACT Awards——Wayfair 因更高批准率、收入提升和成本节约获奖；Priceline 因大规模提升批准率的无摩擦旅游预订获奖。DTC 家具品牌 Burrow 报告毛 ROI 为
              6,557%，批准率从 89% 升至 99.83%，拒付率从 0.45% 降至 0.033%。HelloFresh 与 Forter 合作，将欺诈策略转向公司级 CLV（customer lifetime
              value）指标。

              引用质量从带数字 KPI
              的生产部署（ASOS、Deckers、Burrow），到有高管推荐语但没有具体指标的生产部署（McDonald's、Wayfair、Priceline）不等。没有案例研究记录失败部署或下线。
