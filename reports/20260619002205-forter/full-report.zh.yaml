      - number: '4.4'
        title: 资本充足性、烧钱与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Forter 已完成六轮融资，累计 $525M，最新一轮是 2021 年 5 月由 Tiger Global Management 领投的 $300M Series F，估值
              $3B。此后没有披露新的一级股权融资；截至报告日期，间隔已超过五年。公司未公布现金余额、月烧钱率或 runway 估计。作为背景，规模可比的后期风投支持 fintech 公司通常每月净现金流出 $5–15M。如果
              Forter 自 2021 年以来以这一速度消耗资本，Series F 募资可能已有相当部分被用掉。2025 年 3 月聘任 Jim Lejeal 是一个强信号：这位 CFO 曾带领
              Splunk、Absolute Software 和 Rally Software 完成 IPO，说明 Forter 正积极准备流动性事件。Forge Global 上截至 2025 年的二级市场活动显示，较
              $3B 标题估值约有 20–30% 折价；2026 年初随着私营二级市场复苏，折价收窄至个位数。没有确认的 down round 或过桥融资被报道。Forter CEO 在 2025 年 9 月 Forbes
              Cloud 100 公告中提到，IPO 市场缺席让 Cloud 100 私营公司之间的竞争更激烈——这等于间接承认流动性时间表被推迟。公开证据中没有债务融资。由于 Forter
              不是持牌金融机构，监管资本要求不直接适用；但拒付担保形成或有负债，需要保险后盾或资本准备金，二者均未披露。
