  - id: TV005
    title: 论点失效与终止触发条件
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - Q4 2026 前未提交 IPO 申报
        - 未提交 S-1 或 F-1，且宏观条件到 2026 年底持续恶化
        - 流动性路径收窄；降估值融资更可能发生；$3B 估值标记进一步老化
        - 暂停新增投资；跟踪新一级轮或 M&A 公告
      - - 一级资本降估值融资
        - 新股权定价低于 $3B；Tiger Global 或 Sequoia 下调持仓估值
        - 证实估值过高；触发清算优先权重新排序；普通股稀释落地
        - 论点失效：退出任何已持有二级仓位；不发起新投资
      - - ARR 增速降至 15% YoY 以下
        - 披露或独立估算 ARR 增长连续两个报告期低于 15%
        - 倍数从中档压缩到底部（3–4×）；估值向 $375–500M 区间收敛
        - 重新审视论点；向管理层追问 NRR、拒付损失率和前瞻销售管线
      - - CFO Jim Lejeal 在 18 个月内离任
        - Lejeal 在 2026 年 6 月前离开 Forter，且未提交 IPO
        - IPO 准备信号反转；治理担忧浮现；士气和招聘可能受影响
        - 立即升级尽调；任何承诺前先获取董事会和继任者说明
      - - 披露拒付准备金缺口
        - 在经济衰退或欺诈激增情景下，担保在 IPO 或融资数据室中暴露准备金缺口
        - 收入成本拖累落地；P&L 弱于估算；收入质量严重受损
        - 重新评估毛利率；将基准估值下调 30–50%；重新考虑建议
    notes: 触发条件具有前瞻性且为定性判断；阈值仅作示例，不具合同约束。降估值触发条件假设 Series F 优先股采用 标准 1× 非参与清算优先权，这很常见，但 Forter 尚未确认。
