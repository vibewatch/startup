              - CO023
              - CO031
              - CO033
              - CO034
              - CO047
          - type: callout
            title: 陈旧估值与创始人关键人集中
            body: >-
              两个结构性风险需要尽调重点关注。第一，Forter 的 $3B 估值定于 2021 年 5 月，当时正值后疫情电商 SaaS 倍数高峰；公司之后未披露新融资，2024 年 ARR 约 $103M，按今天计算隐含
              29x ARR 倍数，相较反欺诈软件公开市场可比公司已明显压缩。公开记录中没有可信的当前市场锚。第二，三位联合创始人 Reitblat、Damri 和 Shemesh 自 2013
              年以来持续任职，公司未公开沟通接班或关键人风险缓释计划。创始人的韧性和组织知识是竞争优势，但如果没有准备，任何意外离任或失能事件都会带来实质战略、技术和投资者信心不确定性。
