  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Forter 面临多层且加速加重的监管负担，直接触及其核心产品——面向消费者身份的大规模自动化 AI 欺诈评分。EU AI Act 将自动化欺诈评分和消费者画像系统列为 Annex III
              下的高风险系统；Forter 代表商户客户在欧盟辖区部署的系统，到 2027 年 12 月将被要求履行完整合规义务（风险管理、数据治理、人类监督、第三方审计和欧盟数据库注册）。违规罚款最高可达 €35
              million 或全球年营业额的 7%。关键在于准备工作现在就必须开始——截至 2026 年 6 月，Forter 尚未公开披露 EU AI Act 准备状态，形成实质合规缺口。

              美国方面，七项新的 CCPA / CPRA 规则于 2026 年 1 月 1 日生效，要求使用自动化决策技术的企业，在处理敏感个人信息前开展正式隐私风险评估。作为 GDPR 下的数据控制者、CCPA
              下的「Business」，Forter 及其商户客户必须满足日益严格的同意、透明度、退出和数据最小化要求。Forter 的身份网络持有超过 20
              亿购物者画像；如果无法证明这一处理规模具备充分法律基础，将在多个司法辖区造成重大监管敞口。

              CFPB Regulation V（12 CFR Part 1022，2026 年 1 月修订）要求自动化决策系统使用方按照 FCRA 提供不利行动通知，为任何影响类信贷决策结果的 Forter
              部署增加一层合规要求。虽然在现任政府下，CFPB 本身执法降至历史低位，但 FCRA 诉讼在民事法院上升，加州、纽约和科罗拉多州总检察长也在独立扩大执法。结果是，约 20 项州级 AI
              和隐私法律拼成了补丁式监管格局，要求 Forter 在所有部署地域持续跟踪合规。

              截至 2026 年 6 月，未识别到涉及 Forter 的诉讼、监管执法行动或数据泄露公开记录。公司未披露任何 IP 侵权或专利诉讼。IP 与差别影响偏见诉讼仍是未解决尽调事项，需要管理层直接披露。
