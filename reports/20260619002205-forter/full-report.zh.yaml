      - number: '1.6'
        title: 图表要点
        blocks:
          - type: callout
            title: 网络效应身份护城河
            body: >-
              Forter 由 2B+ 购物者画像和 400,000+
              企业节点构成的身份图谱，形成自我强化的网络护城河：每新增一个商户，都会带来交易数据，提升所有商户的决策准确率；每新增一个购物者身份数据点，也会在全球范围内提高批准信心。从零起步的竞争者会面临多年数据积累差距，单靠技术很难补上。2026
              年 1 月 McDonald's 合作进一步把网络延伸进全球最大的 QSR 数字生态，向食品配送垂直领域注入高频、高量交易信号。拒付担保模式也强化了这条护城河，因为它在经济上激励 Forter
              维持高准确率，而不只是追求高吞吐。
            calloutType: strength
            claimRefs:
