callouts:
  - calloutType: risk
    title: "$3B Valuation Mark Is Five Years Stale and Unsupported by Current Comparables"
    body: >-
      Forter's $3B last-known valuation (May 2021) implies ~29× 2024E ARR. The closest public peer,
      Riskified (RSKD), currently trades at approximately 1.7× EV/TTM Revenue. Even applying the
      premium AI-native fraud-platform multiple of 8–15× ARR to Forter's $103M estimate yields
      $820M–$1.55B — a 48–73% discount to the current mark. No public financial disclosure supports
      underwriting at $3B without premium assumptions that are unsupported by available evidence.
    claimRefs:
      - CV039
      - CV020
      - CV008
      - CV031

  - calloutType: strength
    title: "Network Effects and Strategic Data Asset Create Defensible M&A Premium Floor"
    body: >-
      Forter's 1.5B+ shopper identity graph and 400K+ merchant network cannot be replicated
      organically. Comparable acquisitions of AI-native fraud platforms — BioCatch at $1.3B
      (~8.1× ARR) and Darktrace at $5.3B (~8.1× revenue) — establish a floor for category-leader
      exits. Strategic acquirers including Equifax, FIS, PayPal, and Visa have a demonstrated track
      record of paying 8–15× for defensive fraud and identity data assets.
    claimRefs:
      - CV049
      - CV027
      - CV028
      - CV032

  - calloutType: recommendation
    title: "Research-More: Await Financial Disclosure and IPO Clarity Before Committing"
    body: >-
      A track or buy recommendation requires at minimum: (a) audited ARR > $130M, (b) gross margin
      > 60%, (c) NRR > 105%, (d) confirmed IPO filing or M&A letter of intent, and (e) Series F
      liquidation preference disclosed and manageable relative to exit scenarios. Without these
      disclosures, the $3B mark cannot be reliably underwritten at current comparable multiples.
      The CFO hire and secondary market activity provide a constructive floor but do not substitute
      for financial transparency.
    claimRefs:
      - CV046
      - CV047
      - CV048

