chapter:
  number: 8
  title: Valuation
  summary: >-
    Forter's $3B last-known valuation (Series F, May 2021) implies ~29× estimated 2024 ARR—a
    multiple that has compressed sharply against its closest public peer Riskified (NYSE: RSKD),
    which trades at roughly 1.7× EV/TTM Revenue as of Q1 2026. The fraud-decisioning premium tier
    (8–15× ARR for AI-native platforms) establishes a more defensible range of $820M–$1.55B on
    current revenue estimates, well below the current mark. The March 2025 appointment of a
    four-time public company CFO with two IPO completions is the clearest exit signal yet, but no
    IPO has been announced. The overall recommendation is research-more: Forter's category
    leadership, network moat, and IPO optionality warrant continued monitoring, but the $3B mark
    is not underwriteable at current comparables without independent financial disclosure, gross
    margin visibility, and NRR confirmation.

sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      Forter's investment thesis rests on four pillars: category leadership in a large and growing
      market, a defensible identity-network moat that compounds with scale, proven enterprise revenue
      quality anchored by 99% logo retention, and a credible IPO pathway signalled by the March 2025
      appointment of Jim Lejeal as CFO — a four-time public company CFO who completed two IPOs,
      including at Rally Software and in senior roles at Splunk. The fraud detection and prevention
      market spans $67–89B annually in 2026 (Fortune Business Insights to Business Research Company
      estimates) at a 17–21% CAGR, underpinned by AI-escalating fraud, PSD2/SCA mandates, and a
      structurally growing e-commerce base. Forter's identity network of 1.5B+ shopper profiles
      across 400K+ merchants processing $250B+ in annual GMV is not replicable from scratch; each
      incremental merchant adds signal that improves decisioning accuracy for all existing clients,
      creating a winner-take-more dynamic characteristic of data-network-effect businesses.

      The anti-thesis is equally compelling. The $3B valuation from May 2021 is now five years stale
      and was set at peak-ZIRP multiples when Forter was growing at 100%+ YoY. By 2024, growth had
      decelerated to an estimated 25% YoY on $103.1M ARR. The closest public peer Riskified trades at
      an enterprise value of approximately $570–620M against $350.5M in TTM revenue — roughly 1.7×
      EV/Revenue, and that is for a company that achieved its first GAAP profitability milestone in
      Q4 2025. Even applying the premium AI-native fraud-platform private multiple of 8–15× ARR to
      Forter's $103M 2024 estimate yields only $820M–$1.55B — a 48–73% discount to the current mark.
      With no disclosed gross margin, no confirmed profitability, and a chargeback guarantee that
      creates an undisclosed cost-of-revenue drag, the financial case for the current price requires
      significant leap-of-faith assumptions. Approximately 30% of all US VC deals in 2024 were flat or
      down rounds — the highest in a decade — placing Forter squarely in the universe of 2021-vintage
      marks at high re-pricing risk.
