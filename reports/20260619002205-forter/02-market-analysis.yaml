chapter:
  number: 2
  title: "Market Analysis"
  summary: "Forter addresses a digital commerce trust market anchored by $67–89B in annual fraud-detection and prevention spend growing at 17–21% CAGR, underpinned by $48B in 2025 fraud losses projected to reach $107B by 2029. Enterprise retail, marketplace, travel, and digital-goods verticals are the primary buyer segments; AI-powered fraud escalation, PSD2/SCA regulation, and the $443B false-decline cost paradox are the dominant structural demand drivers, while data fragmentation, high switching costs, and 41% manual-process incumbency among merchants moderate near-term penetration velocity."

sections:
  - id: "market-boundary"
    title: "Market Boundary and Scope"
    body: |
      Forter operates within the digital commerce trust market, a focused segment of the broader fraud detection and prevention (FDP) industry defined by real-time decisioning at the point of digital interaction — checkout, account creation, login, promotions, returns, and loyalty redemptions. The core market includes payment fraud prevention, account takeover (ATO) protection, policy and return abuse management, loyalty fraud mitigation, and identity verification for online merchants. Excluded from the core scope are offline point-of-sale fraud, traditional anti-money-laundering for banks, and enterprise identity governance for workforce access management.

      Forter's total addressable market encompasses any digital commerce operator that processes card-not-present transactions or manages consumer accounts online across e-commerce, marketplace, travel, digital goods, and financial services verticals. Adjacent markets include chargeback management services, payment orchestration, buy-now-pay-later risk, and the broader cybersecurity perimeter. Status-quo alternatives include in-house rule engines maintained by internal fraud teams, network-level tools bundled by payment processors (Stripe Radar, Adyen RevenueProtect), and standalone identity-verification vendors.

      The digital commerce trust market is a subsegment of the full FDP universe. Broader FDP market figures cited by most analysts encompass banking AML, insurance fraud, and government fraud — inflating the headline TAM. Forter's serviceable space is the e-commerce and digital-commerce layer, estimated by analysts at $73–89B in 2026 at the e-commerce scope and $40–70B at the narrower product-scope definitions, as documented in the market definition and sizing tables below.
    claimRefs: [CM001, CM002, CM003, CM011, CM012, CM013]
    tableRefs: [TM001]

  - id: "market-sizing"
    title: "Market Sizing and Forecasting"
    body: |
      Multiple independent analyst firms have published 2026 market size estimates for the fraud detection and prevention space, with values ranging from $40.4B (Grand View Research, narrowest product scope) to $88.77B (Business Research Company, e-commerce-specific FDP). The dispersion is methodological rather than factual error: broader estimates include banking AML and insurance fraud, while narrower estimates restrict to e-commerce payment fraud tooling. Fortune Business Insights places the broad FDP market at $67.12B for 2026, growing to $243.72B by 2034 at a 17.5% CAGR. Mordor Intelligence's $70.19B and Straits Research's $81.62B span the mid-range. The e-commerce-specific Business Research Company estimate of $88.77B at 20.8% CAGR captures the layer most directly relevant to Forter.

      Below the full FDP market, adjacent sub-pools add context without double-counting: the digital identity verification market is estimated at $14B in 2026 at a 14.6% CAGR (Market.us), and the account takeover protection segment reaches $7.46B in 2026 at an 18.89% CAGR (Global Growth Insights). These pools partially overlap with core FDP but confirm deep enterprise investment across the trust stack.

      Forter's serviceable addressable market (SAM) has not been published by any independent analyst. An evidence-constrained estimate based on Forter's disclosed $500B+ annual GMV processing and market-average fraud-prevention spend of 0.3–1% of GMV yields an indicative SAM of $1.5–5B in annual contracted revenue at Forter's current network size, scaling toward $8–15B as adoption expands to the full enterprise e-commerce tier. This estimate carries low confidence and functions as a reasoning floor, not a sourced datum. Diligence should obtain verified SAM sizing from Forter management directly. The underlying e-commerce GMV total market reached $6.88 trillion in 2026, establishing the scale of the transaction pool subject to fraud risk. Global e-commerce fraud losses hit $48B in 2025 alone, and are on a trajectory toward $107B annually by 2029, with cumulative 2023–2027 losses estimated at $343–362B.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM012, CM013, CM014, CM029, CM030]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: "buyer-segmentation"
    title: "Buyer Segmentation and Adoption Path"
    body: |
      Forter's buyer universe is anchored in enterprise-grade digital commerce operators processing high volumes of card-not-present transactions. Documented customer verticals include branded retail (Otto Group, Revolve, thredUP), luxury and fashion (Yoox Net-a-Porter), digital marketplaces (The Hut Group), travel and ticketing platforms, and financial services companies. The platform's contractual fraud guarantee and network-effect pricing model are most economically viable for merchants transacting at scale — typically above $100M GMV — making large enterprises the primary commercial target.

      Budget ownership for fraud prevention sits primarily with VP or Director of Fraud and Risk, with secondary influence from the Chief Revenue Officer (revenue-protection framing), CFO (cost-reduction framing), and CTO or VP Engineering (integration and infrastructure framing). Procurement is a multi-stakeholder process typically requiring 3–9 months at the enterprise tier. LexisNexis survey data from 569 fraud and risk executives confirms that fraud teams, finance teams, and technology departments are all involved in vendor selection.

      Adoption triggers include a material fraud incident such as an account-takeover event or chargeback ratio breach, a platform migration, a competitive RFP triggered by loss of confidence in incumbent tools, or recognition of the false-decline cost paradox — that overly conservative rule engines cost more in lost revenue than the fraud they prevent. Riskified estimates that false declines cost global retailers $443B annually, nine times the direct cost of fraud, which represents a compelling ROI argument for automated trust platforms. Mobile commerce, accounting for approximately 59% of global e-commerce GMV and 33% of US fraud costs, is creating additional adoption pressure as legacy rule engines trained on desktop behavioral signals underperform on mobile traffic.
    claimRefs: [CM015, CM019, CM033, CM036, CM037, CM038, CM039, CM040]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: "growth-and-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: |
      The primary demand driver is the rapid escalation of fraud sophistication enabled by AI. Juniper Research documents that deepfakes and synthetic identities allow fraudsters to scale attacks and overwhelm rules-based systems; global e-commerce fraud is projected to rise from $48B in 2025 to $107B by 2029. Synthetic identity document fraud surged 311% between Q1 2024 and Q1 2025 (Sumsub). The emergence of AI shopping agents — autonomous software acting on behalf of consumers — eliminates many behavioral cues used by legacy fraud engines, creating structural demand for identity-graph-based decisioning. At NRF 2026, Forter documented that item-not-received claims at one major retailer had grown to roughly 1% of total sales volume, indicating how AI-assisted coordinated fraud is scaling.

      Regulatory tailwinds are a second structural driver. The EU PSD2 Strong Customer Authentication mandate achieved approximately 55% reduction in card-not-present fraud in compliant markets; liability shifted to issuers for authenticated transactions. The forthcoming EU PSD3 framework extends this regulatory pressure. First-party or friendly fraud now accounts for 36% of all global fraud cases (MRC 2026), more than doubling year-on-year, expanding the protection budget beyond payment fraud into policy and dispute management.

      Adoption constraints are material. Forty-one percent of North American merchants still rely on manual processes for fraud prevention as of 2025 (LexisNexis). Data fragmentation across issuers, merchants, and PSPs limits signal quality for any single vendor. Integration and switching costs for enterprise platforms typically require 6–12 month deployment cycles and dedicated engineering resources. A persistent paradox flagged by multiple independent observers (PYMNTS, LexisNexis, Entersekt) is that fraud prevention systems can erode customer experience through false declines: 64% of North American merchants report that fraud controls hurt customer conversion rates, and poor user experience is the primary abandonment driver at new-account creation for 36–37% of respondents. These constraints favor incumbents and PSP-bundled tools over challenger platforms, even where challenger performance data is superior.
    claimRefs: [CM016, CM017, CM018, CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM031, CM032, CM033, CM034, CM035, CM040, CM041, CM042]
    tableRefs: [TM004]
    figureRefs: [FM004]

