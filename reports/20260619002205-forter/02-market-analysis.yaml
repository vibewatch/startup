callouts:
  - calloutType: "insight"
    title: "The False-Decline Paradox: Hidden Revenue Destruction Dwarfs Fraud Losses"
    body: "Riskified estimates that false declines — legitimate orders incorrectly rejected by fraud prevention systems — cost global retailers $443B per year, nine times the direct cost of fraud. LexisNexis data confirms that 64% of NA merchants report fraud controls actively hurt customer conversion rates. This structural paradox means that merchants optimizing solely for fraud reduction without controlling false-positive rates often achieve a net negative revenue outcome. Forter's contractual fraud-guarantee model directly addresses this by aligning vendor incentives toward minimizing both fraud losses and false declines simultaneously, which may be its most important enterprise differentiation."
    claimRefs: [CM019, CM033, CM040]

  - calloutType: "risk"
    title: "Analyst Estimate Dispersion Limits Precise Market Sizing"
    body: "The $40–89B range across credible analyst estimates for the 2026 global FDP market reflects genuine scope disagreement, not data error. Forter's SAM cannot be precisely derived from public sources; the evidence-constrained estimate of $1.5–15B carries low confidence and should be validated with Forter management. Investment memos relying on the high-end $88B figure without scope adjustment would overstate the directly addressable opportunity by a factor of 2–4x compared to the enterprise digital-commerce sub-segment."
    claimRefs: [CM003, CM004, CM005]

  - calloutType: "risk"
    title: "Agentic Commerce Creates Structural Market and Product Uncertainty"
    body: "The rise of AI shopping agents, discussed at NRF 2026 by Forter alongside AWS and PwC, creates a dual dynamic: it generates new fraud surface requiring new identity-infrastructure capabilities, while also potentially challenging the human-behavioral-signal foundation of Forter's identity graph. Forter has positioned this as a core opportunity, but the pace and direction of agentic commerce adoption introduce material uncertainty into near-term market sizing and product-fit arguments that due diligence should stress-test."
    claimRefs: [CM027, CM020, CM021]

