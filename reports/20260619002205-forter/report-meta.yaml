companyProfile:
  summary: 'Forter is a New York-based private fraud-prevention and digital-commerce trust platform founded in 2013 by Michael Reitblat, Liron Damri, and Alon Shemesh. The company sells real-time identity-based decisioning, chargeback guarantees, abuse prevention, account protection, and payment optimization to large merchants, marketplaces, and digital-commerce platforms. Public evidence supports meaningful scale: more than 400,000 businesses in its network, more than two billion shopper profiles, more than $2 trillion in cumulative transaction volume, and estimated 2024 ARR of roughly $103 million. The main underwriting tension is not market relevance but disclosure quality: Forter remains private, the $3 billion valuation dates back to May 2021, and core SaaS efficiency metrics such as gross margin, NRR, reserve ratios, and profitability remain undisclosed.'
