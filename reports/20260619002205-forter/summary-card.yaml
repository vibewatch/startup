summary:
  headline: >-
    Forter appears to be a real category leader in enterprise commerce fraud prevention, but the combination of stale
    valuation, private-company opacity, and unresolved unit-economics questions supports only a research-more stance.
  overallScore: 5.8
  recommendation: research-more
