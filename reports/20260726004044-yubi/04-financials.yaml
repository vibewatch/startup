    - Medium as tracker datapoint
    - Helps frame growth range if comparable to 2025 figure
    - Confirm whether tracker uses ARR, run rate, or recognized revenue
  - - Gross margin
    - ~75% per TechStory
    - Low to medium
    - Would materially improve quality of the model if true
    - Provide audited gross margin and segment contribution
  - - Net loss
    - ~₹60 crore FY25 per TechStory
    - Medium
    - Shows company may still be investing ahead of profitability
    - Provide EBITDA, PAT, and operating cash flow
  - - Profitability timing
    - Management reportedly targets March 2027 profitability
    - Medium
    - Critical to late-stage valuation and capital planning
    - Provide monthly path to breakeven and key assumptions
  - - CAC / payback
    - Not publicly disclosed
    - High that it is undisclosed
    - Needed to underwrite GTM efficiency
    - Provide segment-level CAC, payback, and sales cycle data
  - - NRR / churn
    - Not publicly disclosed
    - High that it is undisclosed
    - Needed to test recurring quality and wallet expansion
    - Provide lender, adviser, and borrower cohort retention
  - - Implementation cost to serve
    - Not publicly disclosed
    - High that it is undisclosed
    - Important for enterprise workflow businesses with integrations
    - Provide deployment cost and time to go-live by module
