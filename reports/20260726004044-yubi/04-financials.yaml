- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Quality view
  - Diligence ask
  rows:
  - - Enterprise debt origination
    - Marketplace or workflow fee around borrower-lender matching and execution
    - Transaction / platform fee
    - Visible from product positioning, but exact take rate undisclosed
    - Potentially attractive if embedded into lender workflow
    - Provide realized take rate and repeat usage by borrower cohort
  - - Co-lending infrastructure
    - Program or workflow fee tied to regulated lender collaboration
    - Program fee / servicing or platform fee
    - Regulated workflow is visible; economics are not
    - Higher switching-cost potential than simple lead-gen
    - Show revenue share, servicing fees, and compliance cost by partner
  - - Supply-chain finance / Yubi Flow
    - Workflow and trade-finance enablement fee
    - Transaction / SaaS / hybrid unknown
    - Product exists publicly, but no segment revenue is disclosed
    - Could be recurring if embedded deeply into AP/AR flows
    - Disclose SCF GMV, active programs, and software attach rate
  - - Yubi Invest / fixed-income distribution
    - Institutional-grade bond access and tooling for advisers and wealth channels
    - Distribution / platform fee
    - FY26 bond throughput is public, take rate is not
    - Promising because throughput and buyer class are both visible
    - Provide monetization per bond volume and adviser account
  - - Aspero retail bond platform
    - Retail bond access under OBPP structure
    - Retail distribution or platform fee
    - Product is public; standalone economics are not
    - Potentially strategic but compliance-heavy
    - Provide active investors, ticket economics, and cost to serve
  - - Collections / underwriting adjacencies
    - Risk, collections, and decisioning support around debt lifecycle
    - Service / software hybrid
    - Adjacency exists via group narrative, but segment P&L absent
    - Can deepen wallet share if margins hold
    - Break out revenue and gross margin by adjacent module
  notes: The public file supports revenue surfaces and probable mechanisms better than it supports realized pricing or segment mix.
