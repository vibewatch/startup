- id: cost-structure-unit-economics-and-capital-needs
  title: Cost Structure, Unit Economics, and Capital Needs
  body: Yubi appears structurally lighter than a direct lender because it does not publicly position itself as the principal balance-sheet risk holder across its core marketplace products, yet it is not a pure low-touch SaaS company either. Growth into MENA, the United States, and South or Southeast Asia, plus deeper investment-distribution infrastructure, compliance, and trust operations, all imply meaningful spend on product, integration, risk, customer success, and regional operations. If the TechStory-reported 75 percent gross margin is directionally correct, the business may have strong software and workflow economics before overhead. But the same source still points to an FY25 loss, and public sources do not disclose CAC, payback, NRR, segment margin, implementation cost, or cash burn. The November 2025 financing and earlier founder infusion reduce near-term capital stress, yet part of the fresh capital was structured debt rather than clean equity. That means capital adequacy improved,
    but with obligations that investors still cannot fully map from public evidence alone.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
