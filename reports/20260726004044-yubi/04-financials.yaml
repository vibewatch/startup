company:
  name: Yubi
chapter:
  number: 4
  title: Financials
  summary: Yubi has enough public evidence to prove scale, multiple monetization surfaces, and continued capital access, but not enough to underwrite revenue quality precisely. Third-party trackers and media disagree on FY25 revenue, while the company discloses throughput metrics far more clearly than audited income, margin, or cash data. The strongest financial conclusion is that Yubi looks operationally real and strategically well funded, yet still materially under-disclosed on segment economics, retention, burn, and debt terms.
sections:
- id: revenue-model-and-monetization-surfaces
  title: Revenue Model and Monetization Surfaces
  body: Yubi's public evidence supports a multi-surface revenue model rather than one uniform subscription business. Historical coverage describes the platform charging fees to both parties depending on the product, which fits a marketplace and workflow-enablement model across enterprise borrowing, co-lending, supply-chain finance, collections, and investment distribution. The newer fixed-income business adds another monetization surface because Yubi now serves wealth managers, IFAs, MFDs, and family offices with bond access and tooling, while partnership-lending and MENA deployments indicate institution-led program revenue opportunities rather than only one-off borrower matching fees. The financial upside of this model is diversification across several debt workflows; the underwriting downside is that the public file does not disclose which surfaces are recurring software, transaction-linked, service-heavy, or balance-sheet-adjacent. Revenue quality therefore has to be inferred from product
    architecture and customer workflows, not from a management-segment P&L.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI034
  - CI035
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: public-traction-and-conflicting-financial-signals
  title: Public Traction and Conflicting Financial Signals
  body: 'Public traction is real, but the financial numbers are inconsistent enough to remain a diligence issue. Inc42 Datalabs lists FY25 revenue at about ₹394.7 crore and total funding above $303 million. Latka states 2025 revenue at $79 million and 2024 revenue at $58 million. TechStory, citing Moneycontrol and Financial Express reporting, says Yubi closed FY25 with a topline around ₹705 crore, a loss around ₹60 crore, and gross margin near 75 percent. Those figures are directionally compatible in the sense that they all describe a scaled private company, but they are not cleanly reconcilable from public documents. What is consistent is operating throughput: Yubi says it facilitated over ₹45,000 crore of bonds in FY26, more than 10 lakh loans and over ₹12,000 crore of partnership-lending disbursals in April-December 2025, plus a lender and borrower network measured in the thousands. The public conclusion is not that Yubi lacks scale, but that revenue, margin, and conversion from throughput
    to income remain under-disclosed.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
