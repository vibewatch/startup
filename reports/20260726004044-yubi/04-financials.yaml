- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited FY25 revenue reconciliation
    - Without this, valuation ranges and margin analysis remain unstable
    - Request audited FY24-FY25 P&L with management bridge across tracker numbers
  - - Segment revenue mix by Loans, Co.Lend, Invest or Aspero, Flow, and Pools
    - Investors cannot tell which surface drives quality or concentration
    - Request revenue and gross profit by product line
  - - Gross margin and contribution margin by segment
    - Software-like story is unprovable without audited margin disclosure
    - Request segment gross margin and service-cost allocation
  - - CAC, payback, sales cycle, and implementation cost
    - Enterprise GTM efficiency is unknown
    - Request board metrics for customer acquisition and go-live timing
  - - NRR, logo churn, and module attach rates
    - Expansion durability is unknown
    - Request cohort retention for lenders, borrowers, and advisers
  - - Cash balance, burn, and runway
    - Capital adequacy remains assumption-heavy
    - Request monthly treasury reporting and covenant package
  - - Debt terms on EvolutionX financing
    - Structured debt could change downside materially
    - Request debt documents and amortization schedule
  - - International revenue contribution by region
    - Global expansion quality cannot be tested
    - Request India vs MENA vs other market revenue split
  notes: These are the specific blockers preventing a stronger verdict on revenue quality and capital efficiency.
