      - number: '5.2'
        title: 工作流、架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开架构大多需要推断，但推断已经足够有用。Yubi 位于借款方、贷款方、投资者、顾问和服务团队之间， 核心系统很可能充当开户、匹配、政策执行、放款或结算，以及发起后服务的控制平面。公开界面从两方面支持上述判断。
              第一，Ajman Bank 合作明确点名 Yubi Enterprise Credit Market，用于企业贷款和供应链金融的数字流程。
              第二，投资解决方案公告描述了收益仪表盘、专属关系经理支持、数字开户、品牌内容工作室，以及 AI 驱动、基于目标的固定收益分销商辅助。
              两条线索合在一起，指向模块化基础设施堆栈，而不是一个单体点产品。模块化堆栈也意味着显著的数据模型和权限复杂度， 因为同一平台必须同时支持机构贷款方、借款方、分销方和交易后运营团队，同时不破坏工作流完整性。
              缺口在于 API、云架构、正常运行时间和精确集成模式等底层文档；底层文档仍是重要产品尽调缺口。
