  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与购买中心
        blocks:
          - type: paragraph
            body: >-
              Yubi 并不是卖给一个简单客户原型。公开界面指向至少五类经济上不同的群体：寻求贷款或营运资金的企业借款方； 提供资产负债表容量的银行和 NBFCs；购买债务机会的投资者；分销固定收益产品的财富中介；以及使用
              Yubi 工作流基础设施、 服务自身 SME 或贸易金融客户的区域银行伙伴。实际含义是，买方、用户和付款方经常不同。 银行可能为工作流基础设施付费，而 SMEs 才是信用旅程中的运营终端用户；开发商可能使用
              Yubi 的发行堆栈， 投资者最终出资购买工具；顾问可能使用分销工具，终端客户购买产品。多边结构扩大了可服务需求， 也让客户质量更难评分，因为账户数、参与者数和终端用户贷款数位于价值链和定价逻辑的不同层。
