      - number: '2.4'
        title: 增长驱动、监管顺风与真实约束
        blocks:
          - type: paragraph
            body: >-
              市场背景有支撑，但并非没有摩擦。增长驱动包括 RBI 和 SEBI 持续正式化、债券票面规模变小、 RFQ 结算规范、联合贷款规则更清晰、TReDS 运营标准收紧，以及贷款方更高效服务 SMEs
              和财富渠道的需求。 Yubi 自身增长材料也指向财富分销需求上升、HNI 数量增加，以及资本市场参与从最大机构向外扩展。
              但约束同样显著。零售参与债券仍然偏低，二级市场流动性不均；联合贷款现在明确带有留存、托管和披露义务； TReDS 平台必须验证 MSME 卖方，并在运营上管理转让和结算。SEBI 关于 OBPPs
              的咨询以及对未注册平台的执法说明， 分销创新只能在收紧的监管边界内扩张。Yubi 的机会之所以大，是因为市场正在被组织起来； 但变现取决于它能否在合规负担重、多方参与的生态中把执行质量做稳。
            claimRefs:
              - CM027
              - CM028
              - CM029
