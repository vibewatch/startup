  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Yubi 拥有多界面收入模式，而不是单一订阅业务。历史报道描述平台会按产品向交易双方收费， 收费方式契合一个横跨企业借款、联合贷款、供应链金融、催收和投资分销的市场与工作流赋能模式。
              新的固定收益业务又增加了一块变现界面，因为 Yubi 现在为财富管理机构、IFAs、MFDs 和家族办公室提供债券入口和工具； 同时，伙伴放贷和 MENA
              部署指向由机构主导的项目收入机会，而不只是一次性借款方匹配费。 财务上行来自多条债务工作流的分散覆盖；承销下行在于，公开档案没有说明哪些界面是经常性软件收入、
              哪些与交易挂钩、哪些服务负担重，哪些贴近资产负债表。收入质量只能从产品架构和客户工作流推断， 而不能从管理层分部 P&L 里直接读出。
