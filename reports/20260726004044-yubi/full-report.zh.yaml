      - number: '1.2'
        title: 更名、产品架构与集团范围
        blocks:
          - type: paragraph
            body: >-
              2022 年 6 月从 CredAvenue 更名为 Yubi，并非一次表面改名。Moneycontrol 和 Mint 都将其描述为转向统一的债务基础设施品牌， 目标是在信用生态中无处不在，并从 UAE
              起步支撑全球扩张。更名时，公司公开描述了五个债务产品： 面向企业借款的 YubiLoans、面向联合贷款的 YubiCo.Lend、面向债券发行和投资的 YubiInvest、 面向供应链金融的 YubiSCF
              或 YubiFlow，以及面向证券化或结构化金融的 YubiPool。后续投资者和公司邻近描述， 又把集团版图扩展到 Yubi、Accumn、Spocto X、YuCollect 和
              Aspero，共同覆盖发起、信审、履约、 投资分销和催收。Finovate 的 2026 年演示描述和 TVS Capital 的投资组合页面都进一步印证： Yubi 卖的是基础设施，而不是单一狭窄的贷款产品。
