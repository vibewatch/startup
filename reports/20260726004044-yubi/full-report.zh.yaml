            body: >-
              Yubi 客户档案中最弱的一块，是耐久度披露。保留来源中没有公开 NRR、GRR、流失、续约率、合同期限或客户满意度数据集， 因此任何留存判断都只能保持启发式。证据确实显示出潜在耐久驱动：嵌入银行信贷工作流，
              对营运资金和发行的重复需求，以及从发起扩展到分销或催收的多产品扩张。但正面因素被集中和执行风险抵消。 具名客户证明集中在受监管机构、开发商融资和伙伴放贷生态，意味着依赖银行、NBFC 和资本市场交易对手。
              如果围绕 Aspero 的监管担忧或更广的产品治理问题加剧，客户信任也可能受影响。正确读法是： 采用宽度看起来强，具名证明可信，但留存和集中质量没有公开透明到足以在没有直接数据室证据的情况下高信心承销。
