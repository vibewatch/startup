      - number: '2.2'
        title: 测算视角：债券市场、工作流轨道和相邻领域
        blocks:
          - type: paragraph
            body: >-
              最可见、数字基础最扎实的视角，是印度企业债市场。Economic Times 和 Yubi 邻近的 2026 年报道引用了 FY25 创纪录的企业债发行额，约 ₹9.9 lakh crore；未偿企业债约
              ₹53.6 lakh crore，整体债券市场约 ₹226 lakh crore。第二个视角是 Yubi 自身更近端的固定收益分销切口：Business News This Week 称， 其投资解决方案部门在
              FY26 撮合超过 ₹45,000 crore 债券。第三个视角来自应收账款融资。RBI 的 TReDS 指引定义了一个技术赋能、多资金方的 MSME 贸易应收账款市场；RBI 还持续发布到 2026
              年的月度、分机构 TReDS 统计， 证明这是活跃的受监管市场，而不是概念市场。第四个视角是结构化金融：CareEdge 和 Business Standard 显示， 即便零售放缓，FY26 证券化规模仍保持在
              ₹2.5 lakh crore 以上；证券化信号很关键，因为 Yubi 的产品范围明确包括证券化和资产池。 没有任何单一视角是完美 TAM，但合在一起显示，可服务市场按多个 lakh-crore
              资金池计量，而不是一个小众软件类别。
