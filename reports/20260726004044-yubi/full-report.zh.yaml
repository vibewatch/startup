      - number: '7.2'
        title: 运营、安全与合规执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Yubi 强于其法律表层，但仍带有重要失效模式。信任中心呈现出严肃的企业级姿态： 24/7 SOC 覆盖、威胁情报源、特权访问控制、EDR、连续性手册，以及面向审计的文档界面。
              上述控制是可信缓释项，不是空口号。但它们无法抹掉一个多边平台带来的挑战：平台横跨银行、NBFCs、投资者、 发行人、分销方，以及催收或服务工作流。CERT-In 的网络指引、RBI 的 IT 外包框架和
              Digital Personal Data Protection Act 叠在一起，意味着任何重大网络或数据处理事件，都会同时变成运营、法律、监管和客户信任问题。 公开风险被进一步放大，因为 Yubi
              的商业网站比信任中心更难检查，本次运行也没有完全读到单项信任文件。 换句话说，Yubi 看起来已经搭建了真实控制，但外部投资者没有数据室仍很难测试其深度。
