      - number: '3.4'
        title: 护城河耐久度与不利竞争信号
        blocks:
          - type: paragraph
            body: >-
              Yubi 竞争位置中最耐久的元素，是工作流宽度、参与者密度和对监管流程的熟悉度。公开来源仍显示其贷款方、 企业和交易规模强劲；更新的固定收益和伙伴放贷动态也说明，公司正更深地进入分销，而不是退回单一小众领域。
              但护城河并非牢不可破。围绕在线债券平台的监管压力显示，产品扩张越快，合规拖拽可能越大。 Oxyzo、Northern Arc 等竞争对手可以把技术和资产负债表资本打包，客户更重视资金确定性而不是平台选择性时，
              技术加资本的组合可能更容易赢。CredAble 的银行和 ERP 取向也提醒，靠集成驱动的工作流供应商不必复制 Yubi 的完整市场野心，
              也能捕捉价值。因此，反命题很直接：如果买方偏好更窄的专门公司，或银行把关键工作流的编排内化， Yubi 的宽度就会从防御力变成执行风险来源。
