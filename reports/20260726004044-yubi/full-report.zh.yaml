        title: 法律身份与创始人脉络
        blocks:
          - type: paragraph
            body: >-
              Yubi 的公开身份比创始人叙事更清楚。品牌背后的运营公司是 Credavenue Private Limited， 2020 年 8 月 21 日成立，在 Chennai 注册，CIN 为
              U72900TN2020PTC137251。Company Check 和其他档案页面显示，注册地址在 Chennai 的 Anna Salai、Prestige Polygon；档案页面还显示， 公司同时使用
              Yubi 和 Aspero 作为关联品牌。创始人 Gaurav Kumar 的履历解释了为什么部分市场评论会把 Yubi 和 Vivriti 非正式地混在一起：2020 年创办 CredAvenue/Yubi
              之前，他已经打造过 Vivriti Capital、Vivriti Asset Management 等债务市场业务。因此，最稳妥的表述不是“2017 年成立”，而是 Kumar 更早进入债务基础设施赛道，并在
              2020 年推出独立的 Yubi/CredAvenue 平台。区分两段历史会影响后续财务和估值分析， 因为平台的股权结构、运营历史和当前披露都与 Vivriti 不同。
