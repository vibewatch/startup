  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 界定可服务的债务基础设施市场
        blocks:
          - type: paragraph
            body: >-
              Yubi 的真实市场不是狭义消费金融科技语境里的“数字贷款”。公司位于连接多个债务子市场的工作流层： 企业借款、联合贷款、供应链金融、债券发行与分销、证券化，以及催收或风险决策。市场边界很重要，
              因为机会规模不能被简化成年度企业债发行额或某一个贷款发起池。TVS Capital、Finovate、CB Insights 以及 Yubi 2022
              年更名报道都指向一个覆盖发现、信审、履约和发起后运营的平台。监管来源也强化了更宽的框架。 RBI 的 2025 年联合贷款指引、2026 年 TReDS 指引，以及 SEBI 的 2026 年 OBPP
              咨询显示， 债务堆栈不只在资本市场边缘走向正式化，中小企业应收账款和贷款方伙伴分销也在被纳入规则。因此， 合理市场边界应是“印度债务生命周期的技术基础设施”，每个子市场都提供一块独立但相连的变现界面。
