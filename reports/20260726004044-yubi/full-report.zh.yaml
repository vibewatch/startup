  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与模块地图
        blocks:
          - type: paragraph
            body: >-
              Yubi 更应被理解为横跨多条相连产品的债务工作流运营层，而不是单一贷款方或零售投资应用。 公开更名材料和投资者材料持续描述五条核心轨道：企业贷款、联合贷款、投资分销、供应链金融，以及资产池或证券化。
              后续公司邻近报道又通过 Aspero 扩展到零售债券和固定收益分销，并纳入 Accumn、Spocto X、YuCollect
              等集团实体来覆盖信审和催收。产品宽度很关键，因为产品承诺不只是发现资本，而是编排开户、决策、执行、服务和回收。 架构上的取舍在于，Yubi
              的真实产品是一个带有多个模块的多边操作系统；买方更看重成熟度和集成深度，而不是任何一个营销标签。
