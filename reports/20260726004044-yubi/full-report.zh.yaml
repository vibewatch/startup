        title: 采用轨迹与规模信号
        blocks:
          - type: paragraph
            body: >-
              公开采用证据最强的地方，是汇总的平台活动，而不是 SaaS 队列式披露。到 2025 年末，Yubi 称平台上有超过 17,000 家企业借款方和 6,200
              家贷款方，明显高于更名时期可见的旧借款方和贷款方数量。 另外，Yubi 的 2026 年伙伴放贷报告描述，2025 年 4 月至 12 月期间完成超过 10 lakh 笔贷款、 超过 ₹12,000 crore
              放款，以及超过 2 crore 端到端交易。报告还称，88 percent 信贷需求来自非一线城市， 平均票面约 ₹1.2 lakh，并且没有人工覆盖决策。上述指标都是工作流层面运营采用和重复使用的有意义信号。
              指标也表明 Yubi 嵌入的是日常或经常性信贷运营，而不是只用于偶发交易寻源。保留点是分母质量： 公开档案仍未披露活跃账户率、单客户收入、续约率，或汇总流量中有多少属于少数大型机构。
