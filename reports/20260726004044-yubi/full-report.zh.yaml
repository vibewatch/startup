        title: 公开牵引力与冲突财务信号
        blocks:
          - type: paragraph
            body: >-
              公开牵引力真实存在，但财务数字不一致到足以成为尽调问题。Inc42 Datalabs 列示 FY25 收入约 ₹394.7 crore， 总融资超过 $303 million。Latka 称 2025 年收入为
              $79 million，2024 年收入为 $58 million。 TechStory 援引 Moneycontrol 和 Financial Express 报道称，Yubi FY25 收入约 ₹705
              crore， 亏损约 ₹60 crore，毛利率接近 75 percent。上述数字在方向上兼容，因为它们都描述一家已具规模的私营公司； 但公开文件无法把它们干净对齐。一致的是运营吞吐：Yubi 称 FY26
              撮合超过 ₹45,000 crore 债券， 2025 年 4 月至 12 月期间完成超过 10 lakh 笔贷款和超过 ₹12,000 crore 伙伴放贷放款， 贷款方和借款方网络以数千计。公开结论不是
              Yubi 缺规模，而是收入、利润率以及从吞吐转化为收入的效率仍披露不足。
