      - number: '1.4'
        title: 规模、参与者与不利开放问题
        blocks:
          - type: paragraph
            body: >-
              最清晰的规模信号来自债务吞吐、参与者数量，以及 Yubi 投资和海外足迹的扩张。当前 2025-2026 年报道称， 平台已撮合超过 ₹3.2 lakh crore 债务，处理超过 48 lakh
              笔交易，并服务超过 17,000 家企业和 6,200 家贷款方或投资者。2026 年投资解决方案公告补充称，Yubi 在 FY26 撮合超过 ₹45,000 crore 债券， 并将 Aspero
              定位为独立运营、受 SEBI 监管的在线债券平台提供商，服务零售和顾问主导的分销。 官方信任中心文本也显示了成熟的安全姿态：引用 ISO 22301、ISO 27001、ISO 27701 和 SOC 2，
              并明确表示 CrowdStrike 中断未影响服务。最大的保留点在别处：不同来源给出的员工数差异很大， 公开报道中的董事会构成仍高度不透明；VCCircle 关于债券投资业务受到监管审视的报道也提醒，
              即便总体增长强劲，平台复杂度仍会制造合规风险。
