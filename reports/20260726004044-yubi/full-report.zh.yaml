      - number: '3.2'
        title: 同行画像与差异化
        blocks:
          - type: paragraph
            body: >-
              直接同行可分为三种模式。Northern Arc 和 Oxyzo 把技术与自身信贷资产负债表或结构化信贷能力结合。 CredAble 更聚焦营运资金和银行 SaaS 基础设施，公开信息强调 ERP
              连接、发票验证和贸易金融项目。 Recur Club 面向寻求非稀释债务的创业公司和成长型公司，明确使用 AI 主导的匹配和灵活还款结构。 InCred 更宽，也更面向消费者，但其 MSME
              和专项贷款存在感意味着，它仍能吸收本可能流向市场式债务基础设施的需求。 与上述同行相比，Yubi 更加多边，因为其公开产品地图覆盖贷款、联合贷款、资产池、债券分销和催收相邻能力。
              代价是战略复杂度：每一条相邻产品线都会扩大 TAM，也会引来更强的既有玩家回应，并让执行质量比单纯讲类别故事更重要。
