      - number: '4.3'
        title: 成本结构、单位经济与资本需求
        blocks:
          - type: paragraph
            body: >-
              Yubi 看起来比直接贷款方结构更轻，因为它没有公开把自己定位为核心市场产品中的主要资产负债表风险承担者； 但它也不是纯低接触 SaaS 公司。向 MENA、United States、South or
              Southeast Asia 扩张， 加上更深的投资分销基础设施、合规和信任运营，都意味着它要在产品、集成、风险、客户成功和区域运营上投入不少。 如果 TechStory 报道的 75 percent
              毛利率方向正确，扣除总部费用前，业务可能具备较强的软件和工作流经济性。 但同一来源仍指向 FY25 亏损；公开来源也没有披露 CAC、回本期、NRR、分部利润率、实施成本或现金消耗。 2025 年 11
              月融资和更早的创始人注资降低了短期资本压力，但新增资本的一部分是结构化债务，而不是干净股权。 也就是说，资本充足性改善了，但伴随的义务仍无法仅凭公开证据被投资者完整测绘。
