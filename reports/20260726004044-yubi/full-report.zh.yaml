  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Yubi 并不是在一个干净的软件类别里竞争，而是在多个重叠战场里竞争。最直接的重叠来自债务市场和嵌入式信贷基础设施提供商， 它们在发起或分销工作流中连接借款方、贷款方和投资者。Northern
              Arc、CredAble 和 Oxyzo 各自证明， 机构债务入口、贸易金融和 SME 信贷已经拥挤到足以容纳规模化专门公司；Recur Club 和 InCred 则说明， 相邻的债务入口和信审轨道即便不复刻
              Yubi 的完整市场架构，也能赢得客户。买方有多种替代路径，因为可以通过资产负债表贷款方、 供应链金融方、债券分销专门机构，或内部司库和银行关系工作流，解决同一个问题。客户需要一个横跨企业贷款、
              联合贷款、供应链金融、资产池和固定收益分销的平台时，Yubi 的主张最宽；买方只想要单一狭窄信贷产品，
              或已经有偏好的贷款交易对手时，它最弱。因此，格局应被看作一组相互竞争的解决方案类别，而不是单点工具之间的比拼。
