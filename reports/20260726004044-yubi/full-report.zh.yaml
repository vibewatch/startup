companyProfile:
  summary: >
    Yubi 是总部位于 Chennai 的债务市场基础设施公司，前身为 CredAvenue。公司以 Credavenue Private Limited 注册成立，2022 年 6 月更名；现在呈现为覆盖
    Yubi、Accumn、Spocto X、YuCollect 和 Aspero 的更宽集团。 平台横跨多个债务工作流，连接借款方、贷款方、投资者和分销方，包括贷款、联合贷款、投资分销、供应链金融、
    资产池或证券化，以及催收相邻运营。公开证据支持它仍围绕约 $1.5 billion、>17,000 家企业借款方、 >6,200 家贷款方或投资者，以及可观的债券和伙伴放贷吞吐，讲述独角兽估值叙事；但股权结构精度、
    单位经济和经审计盈利仍披露不足。
  foundedDate: '2020-08-21'
  founders:
    - name: Gaurav Kumar
      role: 创始人兼 CEO
      background: |
        印度债务市场创业者，曾创办 Vivriti Capital；Yubi 的融资、合作伙伴和扩张叙事中，他仍是最核心的公开面孔。
      claimRefs:
        - CO005
        - CO006
  foundingLocation: Chennai, Tamil Nadu, India
  headquarters: Chennai, India
  productSummary: |
    多边债务工作流基础设施，覆盖企业借款、联合贷款、固定收益和债券分销、Aspero 提供的零售债券入口、 供应链金融、结构化信贷 / 资产池工作流，以及催收相邻运营。
  customerFocus: |
    银行、NBFCs、投资者、财富中介、企业发行人、开发商、中小企业和企业借款方；它们需要数字化债务市场工作流和分销基础设施。
  businessModel: |
    基础设施与工作流编排模式：Yubi 把资本侧机构和投资者资金池，与借款方和发行人需求连接起来， 围绕多类债务产品的发起、分销、执行和服务工作流变现。
  stage: Late-stage private (unicorn)
  fundingStatus: >
    私营独角兽：2022 年 Series B 融资 $137M，估值约 $1.3B；2024 年创始人主导 ₹250 crore 支持轮， 延续 ~$1.5B 的私募估值叙事；2025 年又完成 ₹411 crore
    融资，由结构化债务和创始人股权组成。 公开来源尚无法完全对齐定价股权、创始人支持、结构化债务和任何二级交易之间的累计资本。
