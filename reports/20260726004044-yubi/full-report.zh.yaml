      - number: '2.3'
        title: 买方、用户与预算所有者
        blocks:
          - type: paragraph
            body: >-
              买方地图以机构为主，而且是多边结构。一边是银行、NBFCs 和其他受监管贷款方，它们需要提升发起效率、
              接入联合贷款轨道、获得信审支持、打通证券化退出，并使用催收工具。另一边是使用企业贷款、营运资金融资和债务资本市场入口的企业与 MSMEs。
              第三边是投资分销渠道：财富管理机构、IFAs、MFDs、家族办公室，最终还有通过 Aspero 等 OBPP 结构进入的零售债券买方。 付款方并不总是终端用户。联合贷款和 TReDS
              中，贷款方往往出资，借款方体验工作流；债券分销中， 顾问和平台居中提供入口，发行人和投资者最终承担经济结果。多边结构对 Yubi 有吸引力，因为每一边都有信任、数据或流程摩擦。
              难点也来自多边结构：采用共享工作流，需要法务、司库、信贷、运营和合规团队同时接受，而不是买一个简单的 SaaS 点工具。
