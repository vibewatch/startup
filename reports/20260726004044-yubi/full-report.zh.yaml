      - - Yubi
        - 私募估值锚
        - 当前公开叙事中的私募市场估值约 ~$1.5B
        - 入场纪律的直接锚
        - 公开支撑主要来自跟踪器和媒体，不到招股书级别
      - - InCred Holdings / InCred Finance
        - IPO 估值背景
        - 2025-2026 年报道中潜在估值最高达 ₹15,000 crore
        - 晚期印度贷款平台 / NBFC 相邻可比对象，具备真实公开 IPO 背景
        - 比 Yubi 有更多资产负债表贷款机构暴露
      - - Northern Arc Capital
        - 公开市场交易框架
        - 引用券商报告中约为 FY27 估计账面价值 ~0.9x、FY27 估计盈利 ~6.8x
        - 显示即使 ROE 改善，公开市场仍可能折价信用模型
        - 上市 NBFC 可比对象不是纯基础设施平台
      - - Vivriti Capital
        - 私募市场战略相邻对象
        - 商业模式相邻度相关，但本轮估值表面信息稀疏
        - 对理解债务科技 / NBFC 相邻性有概念帮助
        - 官方页面受阻，无法精确
      - - Mintifi
        - SME 信贷 / 供应链相邻对象
        - 运营相邻度相关，但本轮公开估值表面信息稀疏
        - 有助于理解渠道和产品相邻性
        - 官方页面受阻，无法精确
    notes: 可比组混合了直接锚、公开市场信用代理和私募贷款平台参照，因为不存在单一干净可比公司。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: TV005
    title: 论点破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - Aspero / OBPP 整改恶化
        - 重大未解决监管行动或产品限制
        - 削弱债务市场准入和合规准备度溢价
        - 转入下行情景或暂停投资
      - - 盈利时间表明显后移
        - 没有可信的 FY27 盈利路径，或亏损随规模扩大而上升
        - 削弱从叙事走向运营证据的转变
        - 下调可接受入场价
      - - 客户集中度被证实偏高
        - Top-10 账户占比或续约数据暴露经济性脆弱
        - 广泛参与方叙事价值下降
        - 重估为带集中度折价的基准或悲观情景
      - - 国际扩张仍然狭窄
        - UAE/MENA 收入仍集中在少数银行或低利润率工作流
        - 多元化论点走弱
        - 移除全球扩张上行溢价
      - - 抽成率或毛利率不及预期
        - 平台宽度未能产出有吸引力的经济性
        - 基础设施溢价不再成立
        - 估值靠近低端情景
    notes: 否决触发项围绕尽调中确实可以索取的证据来设置。
    claimRefs:
      - CV028
      - CV029
      - CV033
      - CV036
      - CV039
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计趋势财务
        - 三年经审计收入、毛利率、EBITDA 和现金流桥
        - 用来检验平台宽度能否转化为持久经济性
        - 财务尽调室 / CFO
      - - 收入构成
        - 抽成率、模块组合和地域组合
        - 决定 Yubi 应享受类软件估值，还是按类金融中介估值处理
        - FP&A 和产品 P&L 审查
      - - 客户持久性
        - NRR、GRR、头部账户集中度和合同期限
        - 检验参与方规模是否具备经济粘性
        - 销售运营和客户成功审查
      - - 监管姿态
        - 监管通信、整改跟踪表，以及 Aspero 和联合贷模块的法律意见
        - 风险调整后估值溢价的核心
        - 合规和法务尽调
      - - 国际业务经济性
        - MENA / 其他扩张的国家级贡献利润率和伙伴集中度
        - 区分多元化和补贴式扩张
        - 区域运营审查
      - - 控制证据
        - SOC 2、VAPT、BCP/DR、事件历史和供应商治理包
        - 用来向公开市场或晚期投资人守住基础设施溢价
        - 安全和风险尽调
    notes: 如果管理层回应强，这些问题足以显著改变推荐。
    claimRefs:
      - CV031
      - CV032
      - CV034
      - CV035
      - CV037
      - CV038
      - CV040
