            body: >-
              Yubi 的商业模式也把风险集中在它无法完全控制的交易对手上。客户证明可信，但具名引用集中在少数银行和发行人关系， 如 Ajman Bank、National Bank of Fujairah 和 DRA
              Homes。具名客户证明验证了产品真实存在，也凸显其对锚定机构、 发行人管线和资本市场条件的依赖。印度国内同样如此：伙伴放贷规模和广泛参与者数量令人印象深刻， 但公开披露仍没有显示头部账户集中度、留存或 take
              rates。财务上，公司有规模，也有持续投资者支持； 但外部观察者仍高度依赖追踪器和媒体估计来判断收入、估值标记和盈利轨迹。冲突收入数字和稀疏单位经济制造了模型风险：
              平台可能早已对贷款方具有战略重要性，但其利润率或收入耐久度还没有独立显现。围绕宽度和基础设施地位建立的估值叙事， 因而可能跑在公开变现质量证据前面。
