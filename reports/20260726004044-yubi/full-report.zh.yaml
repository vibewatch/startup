      - number: '5.4'
        title: 成熟度、路线图与产品风险
        blocks:
          - type: paragraph
            body: >-
              Yubi 的产品成熟度在宽度和商业化上看起来真实，但透明度参差不齐。Finovate 的 2026 年演示、 顾问分销建设、伙伴放贷数据和 MENA 银行部署都显示产品已经上线，而不是试点。TechStory
              也把公司描述为深度嵌入的基础设施平台， 在欺诈检测、信贷决策和对话界面中使用 AI，并提出中期目标：国际收入约占组合的四分之一。 但三项风险仍居核心。第一，Yubi
              的主网站、用例、隐私和条款页面在本环境下被阻断，降低了对核心产品文档的直接验证。 第二，公开路线图细节大多来自扩张公告，而不是发布说明。第三，公司面对复杂度风险：每增加一个模块，
              实施、安全和监管负担都会上升。如果跨境部署、零售固定收益分销、催收和联合贷款同时继续加深，负担还会再次增加。 目前，产品质量明显领先于披露质量。
