      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              剩下的估值功课异常清晰。投资人若要从有条件兴趣走到确信，需要拿到关于收入结构、抽成率、毛利率、头部账户集中度、续约行为、监管沟通往来，以及国际扩张真实经济性的硬答案。还要把 Yubi
              集团中值得按软件或基础设施给溢价的部分，与仍应更接近受监管金融中介或交易驱动分销业务估值的部分清楚分开。因此，尽调最有价值的产出不是又一份泛泛市场材料，而是一组压缩的证据包：经审计的趋势财务、客户分群、产品级毛利、未解决的合规事项，以及逐国贡献利润率。如果材料显示参与方规模没有转化为持久经济性，受监管模块整改混乱，或跨境扩张获得的补贴比公开叙事暗示得更重，投资论点应当很快破裂。若没有这些失败，最新估值仍可被辩护为合理，但还不能说显然便宜。
