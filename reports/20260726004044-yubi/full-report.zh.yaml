  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Yubi 做的是债务市场基础设施，而不是狭义贷款机构，因此可以支撑战略溢价。
        - 如果产品宽度没有转化为稳定抽成率或重复经济性，溢价就应压缩。
      - - 可见的银行、发行人和分销方证据显示，平台确有采用度。
        - 如果头部账户集中度极高或续约率偏弱，广泛参与方数量的意义会下降。
      - - 到 2027 年 3 月实现盈利的路径，可以让 Yubi 从故事走向运营证据。
        - 如果盈利时间明显推迟，或依赖不可持续的低投入，当前估值就失去支撑。
      - - 国际扩张可以分散收入，降低印度单一市场集中。
        - 如果 MENA 增长仍集中在少数银行，或需要重补贴，估值上行空间会下降。
      - - 围绕债务市场准入的监管改革带来结构性顺风。
        - 如果 Aspero 或相邻模块受到整改拖累，顺风就会变成折价因素。
    notes: 反论点基于证据，而不是泛泛的宏观下行故事。
