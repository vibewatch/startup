            body: >-
              最可辩护的锚点是 Yubi 自身融资历史，而不是精确倍数计算。公开报道和追踪器将 2022 年 3 月 Series B 放在独角兽门槛附近；后续评论指向约 $1.5 billion 估值，2024
              年强调的创始人主导注资和 2025 年追加融资又强化了估值锚点。 可比框架有帮助，但没有一个完美。Northern Arc 是上市信贷平台或 NBFC 风格代理，其公开市场交易显示，
              即便改善中的信贷业务也可能仍低于 1x 远期账面价值，并以个位数远期盈利倍数交易。InCred 是印度贷款基础设施或 NBFC 相邻领域更好的后期私募估值参照；2025-2026 年报道显示，其 IPO
              前可能估值约 ₹15,000 crore。 Vivriti 和 Mintifi 是商业模式相近的公司，但本次运行中，它们的公开估值界面过于受阻或稀疏，无法支持精确可比计算。 实际读法是：如果 Yubi
              的工作流基础设施叙事属实，它理应相对普通贷款方享有溢价；但在收入质量和监管风险仍只部分透明时， 溢价大概率不应无限扩大。
