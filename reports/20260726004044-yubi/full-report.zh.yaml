      - number: '1.3'
        title: 融资、估值与资本支持
        blocks:
          - type: paragraph
            body: >-
              Yubi 的资本历史足以确立独角兽身份和内部人持续支持，尽管还不足以完整还原每一层证券和所有权。 TechCrunch、VCCircle 和 Moneycontrol 对 2022 年 3 月约 $137
              million 的 Series B 口径一致， 该轮将公司估值推至约 $1.3 billion。后续关于创始人投资的报道显示，Kumar 于 2024 年 8 月注入 ₹250 crore，并在 2025
              年融资中追加 ₹75 crore，使其披露的股权支持超过 ₹330 crore。 2025 年 11 月轮由 EvolutionX Debt Capital 的 ₹336 crore 结构化债务和 ₹75
              crore 新增创始人股权组成， 合计 ₹411 crore。多篇报道还指向二级交易后 $1.5 billion 的后续估值锚点，但公开档案并未完全说明， $1.5 billion
              标记是否应被视为所有后续内部人融资事件的确定估值。稳固的结论是：到 2025 年，Yubi 仍维持独角兽估值并得到创始人支持， 新资本更多投向扩张和产品深化，而不是紧急修复资产负债表。
