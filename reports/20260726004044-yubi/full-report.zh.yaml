      - number: '3.3'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >-
              同业组合的公开定价披露都有限，定价不透明本身就有信息量。Yubi 历史上会根据产品向双方收费， 而 Recur Club 对收入分成融资和风险债结构异常直白，包括还款倍数，以及债务规模占上一轮股权融资的比例。
              Oxyzo 推广低息和无抵押选项，但没有可审计的公开价目表。CredAble 强调基础设施价值，而不是公开费率。 因此，买方通常不是按标价比较这些产品，而是按周转时间、贷款方入口、合规支持和集成负担来比较。
              切换成本真实存在，但并不均匀。单一产品借款方可以相对容易地在贷款方或安排方之间迁移；但一家银行或 NBFC
              如果把发起、联合贷款治理、催收或债券分销工作流嵌入同一个平台，就会面对运营再培训、数据迁移、交易对手重新接入和控制重新验证。 Yubi
              真正受益的时刻，是它成为受监管运营流程的一部分，而不只是一个线索生成器。在这里，嵌入式流程所有权比表层功能一致更重要。
