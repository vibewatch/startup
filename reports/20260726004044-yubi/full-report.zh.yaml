          - type: paragraph
            body: >-
              牛市情景取决于公开档案完成三项相连升级。第一，盈利能力从目标变成交付结果，并接近 2025 年报道中的利润率。 第二，UAE 和更广的国际扩张带来多元收入，而不只是更多伙伴复杂度。第三，围绕 Aspero
              和其他核心模块的监管摩擦保持可控， 让 Yubi 能在基础贷款方可比公司之上赚取基础设施溢价。基准情景假设当前宽叙事方向正确但不完整：
              公司继续扩张，变现改善，但披露质量和合规复杂度让投资者不会在现有估值上支付大幅跃升。熊市情景不是破产， 而是证据压缩：如果估值保持高位，而公开或尽调室数据揭示经济性集中、take rates 偏弱、盈利放缓，
              或整改负担比当前故事暗示的更重，下行情景就会出现。届时，市场很可能把 Yubi 重新定价到更低的战略溢价， 更接近金融机构可比公司，并叠加执行折价。
            claimRefs:
              - CV021
