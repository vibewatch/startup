  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险堆栈
        blocks:
          - type: paragraph
            body: >-
              Yubi 最大、不可压缩的风险是监管相邻性。公司不是在金融边缘运营的简单软件供应商；其可见模块触及联合贷款、 伙伴放贷、在线债券分销、证券化式工作流、贸易或供应链金融、催收，以及跨境银行集成。由此，
              即便底层资产负债表或发行敞口由受监管伙伴承担，Yubi 仍会继承规则变化风险。公共政策证据显示， 监管负担真实存在，而且越来越密，不是越来越轻。SEBI 仍在 2026 年就 Online Bond
              Platform Provider 框架修改进行咨询， RBI 的 2025 年联合贷款指引则从 2026 年 1 月起扩大并正式化运营预期。VCCircle 关于 Aspero 遭遇监管不满的报道，
              把抽象制度风险转化成公司特定下行。法律尽调也弱于应有水平：Yubi 的公开隐私和条款页面在本环境下被阻断， 信任端点披露了存在性，却没有给出足够合同细节。结果是一门上行依赖深度嵌入受监管流程的业务，
              但下行也与同一批流程紧密绑定。
