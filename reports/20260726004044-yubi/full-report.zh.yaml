  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Yubi 看起来是一家真实公司，也具备真实战略价值，但还不像一个干净的公开股票式承销案例。最强的支撑事实是： 债务工作流覆盖宽，机构和银行部署可见，交易活动规模大；融资历史也让公司在 2024
              年创始人主导轮之后仍留在独角兽区间。 最弱的事实同样重要：公开变现细节很薄，盈利仍是前瞻目标而非经审计结果，零售债券监管仍是活变量，
              客户耐久度和集中度也没有公开披露到高信心定价所需的层级。事实组合导向一个价格敏感、而不是公司敏感的结论。 Yubi 应被视为有条件投资或跟踪候选，而不是任何估值下都明确买入的标的。在最新私募标记或略低位置，
              现有公开证据支持中性到谨慎正面的立场。真正上行需要证明：收入质量、合规韧性和国际扩张能跟上基础设施叙事。
