        title: 财务结论与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务结论在运营上偏正面，但披露质量仍弱。Yubi 有足够公开证据证明真实需求、多产品变现界面、创始人支持和持续融资能力。
              如果高毛利报道大体准确，它也可能比许多贷款相邻金融科技更接近软件型经济结构。不过，本章最大的结论是， 承销方仍缺少能自信定价这门生意的指标：没有经审计的公开分部收入，没有清晰 runway
              或现金余额，没有单位经济堆栈， 没有留存指标，追踪器和媒体之间的一线收入总额还互相冲突。因此，合理立场更接近“继续研究”，而不是对收入质量或资本效率作出高信心判断。
              历史融资时间线支持连续性，但在形成耐久估值判断前，仍需要管理层级别财务披露。缺失数据对承销是实质问题，不是表面瑕疵。
