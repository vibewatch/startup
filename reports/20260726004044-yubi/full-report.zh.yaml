        - 如果基础设施溢价扩张、证据质量改善，$1.8B-$2.0B 具备合理性
        - 执行和合规滑坡
        - 需要多项尽调结论上修，而不只是继续融资
      - - 基准
        - 规模继续扩张，变现逐步改善，但集中度和产品经济性仍有证据缺口
        - ~$1.4B-$1.6B 支撑估值停留在最新标记附近，并留有适度弹性
        - 叙事跑在证据前面，或利润率可见度低于预期
        - 最符合当前公开证据
      - - 悲观
        - 监管摩擦上升，盈利时间推迟，伙伴集中度或续约质量不及预期
        - 如果战略溢价压缩到有折价的金融机构可比公司附近，则为 ~$0.9B-$1.2B
        - 控制失效、扩张放慢、抽成率偏弱
        - 更可能来自尽调失望，而不是单纯宏观冲击
    notes: 区间是情景输出，不是机械推导的交易倍数。
