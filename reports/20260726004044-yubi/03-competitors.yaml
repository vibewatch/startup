- id: pricing-distribution-and-switching-costs
  title: Pricing, Distribution, and Switching Costs
  body: Public pricing disclosure is limited across the set, which is itself informative. Yubi historically charged fees to both sides depending on product, while Recur Club is unusually explicit about revenue-based financing and venture-debt structures, including repayment multiples and debt sizing as a share of the last equity round. Oxyzo markets low-interest and collateral-free options but not an auditable public price card. CredAble markets infrastructure value rather than public tariffs. That means buyers often compare these products through turnaround time, lender access, compliance support, and integration burden rather than through headline list prices. Switching costs are real but uneven. A single-product borrower can move between lenders or arrangers relatively easily, but a bank or NBFC that embeds origination, co-lending governance, collections, or bond-distribution workflows into one platform will face operational retraining, data migration, counterparty re-onboarding, and
    control re-validation. Yubi benefits when it becomes part of the regulated operating process, not just a lead generator. Embedded process ownership matters more here than superficial feature parity.
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
