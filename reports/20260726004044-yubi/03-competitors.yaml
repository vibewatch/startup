  - - Northern Arc
    - Credit platform plus capital partner
    - 15+ years in underserved retail credit with proprietary tech suite
    - Retail credit originators and underserved borrowers
    - Sector depth and integrated tech for six lending sectors
    - Less visibly broad in bond-distribution and wealth infrastructure
  - - CredAble
    - Working-capital and banking SaaS
    - Claims $21Bn enabled and global institutional partners
    - Banks, corporates, SMEs
    - ERP connectivity, invoice validation, trade-finance workflows
    - Public messaging is concentrated on working capital rather than full debt lifecycle
  - - Oxyzo
    - B2B lender and credit platform
    - 5000+ SMEs served; AUM ₹8,500+ crore
    - SMEs and supply-chain borrowers
    - Balance-sheet lending, curated structuring, and marketplace ambitions
    - Closer to credit provider model than neutral market infrastructure
  - - Recur Club
    - Non-dilutive debt marketplace
    - ₹3,000 crore+ funded; 2,000+ customers; 100+ lending partners
    - Startups and growing SMEs
    - Fast AI-led matching for venture debt and revenue-based finance
    - Narrower customer scope than Yubi enterprise and institutional rails
  - - InCred
    - Broad lending platform
    - AA-/Stable ratings, borrower and branch footprint
    - Consumer, student, property, and MSME lending
    - Brand and underwriting reach across several loan products
    - Not positioned as a full multi-party debt-market operating system
  notes: The table compares buyer choices that can solve overlapping debt-access jobs even when the business models are not identical.
