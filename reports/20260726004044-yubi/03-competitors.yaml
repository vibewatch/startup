    severity: material
    topic: realized-pricing
    missingEvidence: Auditable realized pricing, take-rates, discounting policies, or fee splits across Yubi's product lines and key peers.
    whyItMatters: Commercial defensibility cannot be fully underwritten from public packaging cues alone.
