    whyItMatters: Competitive breadth is more durable if customers actually deepen usage rather than merely transact once.
    diligencePath: Request cohort data by lender, borrower, and adviser segment including module attach rates and churn.
    relatedQuestionRefs:
    - QP017
    - QP023
