- id: peer-profiles-and-differentiation
  title: Peer Profiles and Differentiation
  body: 'The direct-peer set separates into three models. Northern Arc and Oxyzo combine technology with their own credit balance-sheet or structured credit capability. CredAble focuses heavily on working-capital and banking SaaS infrastructure, with public messaging around ERP connectivity, invoice validation, and trade-finance programs. Recur Club targets startups and growth companies seeking non-dilutive debt, explicitly using AI-led matching and flexible repayment structures. InCred is broader and more consumer-facing, but its MSME and specialty-loan presence means it can still absorb demand that might otherwise flow to marketplace-style debt infrastructure. Yubi is more multi-sided than these peers because its public product map spans loans, co-lending, pools, bond distribution, and collections-adjacent capabilities. The trade-off is strategic complexity: each adjacent product line expands TAM, but also invites stronger incumbent responses and makes execution quality more important
    than category storytelling alone.'
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP013
