    title: Market definition table
    columns: [Segment or category, Included spend / activity, Excluded spend / activity, Buyer / payer, Why relevant to Yubi]
    rows:
      - [Corporate bond issuance and distribution, 'Primary and secondary corporate bond access plus adviser distribution', 'Equities, sovereign-only dealing, pure asset management', 'Issuers, investors, distributors', 'Matches YubiInvest or Aspero and fixed-income rails']
      - [Enterprise debt origination, 'Corporate and SME borrowing workflows across banks and NBFCs', 'Direct balance-sheet lending without platform mediation', 'Borrowers and lenders', 'Matches YubiLoans marketplace logic']
      - [Co-lending infrastructure, 'Joint funding, borrower onboarding, servicing, settlement, and disclosures', 'Pure bilateral referral models with no shared funding', 'Banks and NBFCs', 'Matches YubiCo.Lend']
      - [Supply-chain or receivables finance, 'Invoice discounting and TReDS-style trade receivables workflows', 'Unregulated informal trade credit', 'MSMEs, buyers, financiers', 'Matches Yubi Flow or SCF']
      - [Securitisation and pool management, 'PTCs, direct assignments, structured pools, and servicing support', 'Standalone bond custody without pool workflow', 'Banks, NBFCs, investors', 'Matches Yubi Pools']
      - [Collections and underwriting infrastructure, 'Risk scoring, monitoring, and post-disbursal recovery operations', 'Standalone consumer CRM without credit workflow', 'Lenders and collection agencies', 'Matches Accumn and YuCollect or Spocto X']
    notes: The market boundary is workflow-oriented rather than product-only because Yubi participates across multiple debt stages with different counterparties.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM019, CM020]
  - id: TM002
    title: TAM or sizing lens table
    columns: [Publisher or lens, Year / period, Geography, Value, Methodology, Confidence, Limitation]
    rows:
