      - [Economic Times market lens, 'June 2025', India, '₹53.6 lakh crore outstanding corporate bonds', 'Outstanding stock cited from RBI-linked market coverage', High, 'Stock overstates immediately monetisable workflow revenue']
      - [Economic Times market lens, 'June 2025', India, '₹226 lakh crore overall bond market', 'Overall bond-market stock reported in 2026 market coverage', Medium, 'Includes government and other debt not directly addressable by Yubi']
      - [Business News This Week / Yubi lens, FY26, India, '₹45,000 crore bonds facilitated', 'Yubi investment-solutions business throughput', Medium, 'Single-company activity, not category TAM']
      - [CareEdge securitisation lens, FY26, India, '₹2.53 lakh crore retail securitisation; ₹2.74 lakh crore including wholesale', 'Ratings estimate from FY26 market review', Medium, 'Structured-finance activity overlaps only part of Yubi Pools']
      - [Business Standard / CRISIL lens, H1 FY26, India, '₹1.24 trillion securitisation volumes', 'Half-year market activity from CRISIL coverage', Medium, 'Half-year figure not directly comparable to full-year estimates']
      - [RBI TReDS lens, 2026, India, 'Monthly entity-wise TReDS statistics published', 'Regulated-market activity evidence rather than one headline value', Medium, 'Fetched index page does not expose the monthly numeric totals inline']
      - [NITI policy lens, 2026, India, 'Deepening corporate bond market remains a live policy objective', 'Policy paper framing market headroom', Medium, 'Policy report is strategic and not Yubi-specific']
    notes: These lenses intentionally mix stock, flow, and throughput views because Yubi touches multiple debt rails; they should be interpreted as boundary checks rather than one merged TAM.
    claimRefs: [CM009, CM010, CM011, CM012, CM013, CM014, CM015, CM016, CM017, CM018]
