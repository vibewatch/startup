      - ['RBI TReDS master directions', Positive, 'Current', 'Standardises receivables-finance operations and MSME protection', 'Assess whether Yubi has meaningful traction in regulated receivables rails']
      - ['Corporate bond issuance growth', Positive, 'Current', 'Expands addressable issuance and distribution activity', 'Separate structural growth from one-year rate-cycle boost']
      - ['Secondary-market liquidity remains low', Negative, 'Current', 'Retail bond adoption can remain shallow despite better access', 'Check whether platform usage is concentrated in primary issuance and hold-to-maturity buyers']
      - ['Securitisation volumes remain large but cyclical', Mixed, 'Current', 'Yubi Pools can benefit, but timing depends on bank and NBFC balance-sheet conditions', 'Ask which asset classes and originators drive Yubi pool activity']
      - ["Regulatory action against non-compliant bond platforms", Negative, 'Current', "Raises downside if execution outruns compliance", "Review Yubi or Aspero's control posture against current SEBI expectations"]
    notes: The same regulatory changes that increase market legitimacy also raise product, operations, and compliance requirements for participants and infrastructure providers.
    claimRefs: [CM027, CM028, CM029, CM030, CM031, CM032, CM033, CM034, CM035, CM036]
figures:
  - id: FM001
    title: Market sizing lens pyramid
    type: pyramid
    layout: wide
    summary: Yubi's market narrows from the full Indian bond market into corporate-bond stock and then into the platform-level fixed-income throughput it already references publicly.
    data:
      items:
        - label: Overall Indian bond market
          value: '₹226 lakh crore'
          note: Broad debt-market stock including government and state instruments
        - label: Corporate bond stock
          value: '₹53.6 lakh crore'
          note: Relevant public-company and private-credit market stock cited in 2025-2026 sources
        - label: Yubi FY26 bond throughput
          value: '₹45,000 crore+'
          note: Company-adjacent distribution activity already facilitated by Yubi investment solutions
    approximationNotes: The pyramid mixes stock and company throughput to show boundary contraction rather than a single comparable denominator.
    claimRefs: [CM009, CM010, CM012, CM037]
  - id: FM002
    title: Market estimate range
    type: range
    layout: standard
    summary: The securitisation submarket alone is large enough to matter, with FY26 estimates clustered in the ₹2.4-₹2.74 lakh crore range depending on scope.
    data:
      items:
        - label: Low FY26 retail securitisation view
          low: 2.4
          high: 2.4
          unit: INR lakh crore
        - label: Base FY26 retail securitisation view
          low: 2.53
          high: 2.53
          unit: INR lakh crore
        - label: High FY26 including wholesale
          low: 2.74
          high: 2.74
          unit: INR lakh crore
    approximationNotes: The low, base, and high items align different FY26 securitisation scope definitions rather than forecasting three separate scenarios for the same exact pool.
    claimRefs: [CM016, CM017]
  - id: FM003
    title: Buyer and adoption map
    type: matrix
    layout: wide
    summary: The most valuable Yubi segments are the ones where multiple regulated parties must coordinate around one debt workflow.
    data:
      columns: [Workflow complexity, Compliance load, Revenue potential, Adoption friction]
      rows:
        - label: Banks and NBFCs in co-lending
          values: [High, High, High, High]
        - label: Corporate borrowers in enterprise debt
          values: [Medium, Medium, Medium-High, Medium]
        - label: MSMEs in receivables finance
          values: [Medium, Medium-High, Medium, Medium]
        - label: Wealth managers and IFAs in bond distribution
          values: [Medium, Medium, Medium-High, Medium]
        - label: Retail bond investors via OBPPs
          values: [Low, Medium, Low-Medium, Low]
    approximationNotes: The matrix is an ordinal synthesis from regulatory documents and Yubi-adjacent market coverage rather than a direct survey.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026]
  - id: FM004
    title: Adoption funnel or value-chain map
    type: flow
    layout: wide
    summary: Debt-market adoption depends on moving from regulatory eligibility and data setup to funding, distribution, and servicing across multiple actors.
    data:
      nodes:
        - id: issuer
          label: Borrower or issuer enters
          detail: Corporate, MSME, or lender-originated opportunity begins the workflow
        - id: data
          label: Data and validation layer
          detail: KYC, MSME validation, risk review, and product fit checks occur here
        - id: match
          label: Match with financiers or investors
          detail: Platform connects the opportunity to lenders, co-lenders, or bond buyers
        - id: execute
          label: Execution and settlement
          detail: Disbursal, assignment, RFQ or bond settlement, and escrow rules apply
        - id: service
          label: Servicing and monitoring
          detail: Repayments, collections, and ongoing compliance continue after origination
      edges:
        - {from: issuer, to: data, label: submits transaction}
        - {from: data, to: match, label: becomes eligible for}
        - {from: match, to: execute, label: converts into}
        - {from: execute, to: service, label: flows into}
    claimRefs: [CM003, CM005, CM014, CM021, CM027, CM030]
callouts:
  - calloutType: insight
    title: Yubi's addressable market is best framed as workflow share, not just debt volume share
    body: A platform can monetise origination, distribution, underwriting, settlement, and servicing even when it does not own the loans or bonds on balance sheet, so the relevant market is the set of debt processes that need coordination.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
  - calloutType: risk
    title: Regulatory formalisation is a tailwind only for platforms that can absorb compliance complexity
    body: Co-lending, TReDS, and OBPP rules are making the market more legible, but they also codify retention, escrow, validation, reporting, and disclosure obligations that can slow weak operators.
    claimRefs: [CM027, CM028, CM029, CM030, CM035, CM036]
