    title: Segment or buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Bank lending team, 'Treasury / credit / business heads', 'Origination and servicing ops', 'Bank credit budget', 'Co-lending, underwriting, collections, bond distribution', 'Need to expand reach without rebuilding workflow stack']
      - [NBFC or HFC lender, 'Management and credit heads', 'Risk, collections, and operations teams', 'Lending P&L', 'Co-lending, securitisation, receivables, collections', 'Need lower funding friction and scale distribution']
      - [Corporate borrower, CFO / treasury, 'Finance team', 'Corporate treasury budget', 'Enterprise loans or bond issuance', 'Need faster access to multiple lenders or investors']
      - [MSME seller on receivables rails, Founder or finance lead, 'Accounts receivable team', 'Working-capital budget', 'Invoice upload and discounting', 'Need quicker receivables conversion into cash']
      - [Wealth manager or IFA, 'Practice owner', 'Relationship managers', 'Distribution and advisory budget', 'Fixed-income product discovery and settlement', 'Need institutional-grade bond access with simpler execution']
      - [Retail bond investor, Individual saver, 'Self-directed user', 'Personal savings pool', 'OBPP-based bond access', 'Lower ticket size and easier settlement improve accessibility']
    notes: Buyer, user, and payer split differently across lending and investment rails, so the same platform can sell infrastructure to institutions while influencing borrower or investor experience indirectly.
    claimRefs: [CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026]
