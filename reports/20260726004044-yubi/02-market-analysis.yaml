  evidenceGaps:
    - type: missing-source
      severity: material
      topic: full-market-tam
      missingEvidence: A single authoritative cross-segment dataset that unifies bond distribution, co-lending workflows, TReDS throughput, and securitisation activity into one comparable TAM.
      whyItMatters: The market is clearly large, but underwriting Yubi's exact share-of-wallet opportunity needs a cleaner stitched denominator than public sources currently provide.
      diligencePath: Build a bottoms-up TAM model from product-level GMV, software-fee take rates, and segment-specific debt volumes.
      relatedQuestionRefs: [QM024, QM025]
    - type: missing-source
      severity: material
      topic: yubi-segment-revenue
      missingEvidence: Revenue or GMV split by Yubi product line such as Loans, Co.Lend, Invest or Aspero, Flow, and Pools.
      whyItMatters: Market attractiveness differs materially by segment, and current public sources do not show where Yubi is already strongest economically.
      diligencePath: Request management metrics for segment GMV, revenue contribution, active institutions, and attach rates.
      relatedQuestionRefs: [QM007, QM024]
    - type: missing-source
      severity: minor
      topic: treds-size-gap
      missingEvidence: Inline numeric totals from the RBI TReDS statistics pages sufficient to build a dated throughput trend directly from fetched primary text.
      whyItMatters: The category is clearly active, but a stronger public chapter would chart monthly TReDS value growth rather than only proving market existence.
      diligencePath: Pull the linked monthly RBI TReDS tables into a structured time series for turnover, participants, and financier mix.
      relatedQuestionRefs: [QM010, QM025]
