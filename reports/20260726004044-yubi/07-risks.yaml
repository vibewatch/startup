- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Aspero / OBPP regulatory risk
    - Adverse regulator action or unresolved remediation
    - Restriction, censure, or major control finding
    - Downgrade valuation stance and pause retail-distribution upside credit
  - - Bank-partner concentration
    - Top-partner churn or stalled go-lives
    - Loss of anchor UAE bank or weak expansion pipeline
    - Reduce international expansion assumptions
  - - Cyber or privacy control failure
    - Reportable incident, enforcement action, or audit failure
    - Material incident or unremediated high-severity finding
    - Re-rate operational risk and downside case
  - - Revenue-quality uncertainty
    - Weak monetization versus platform breadth
    - Low take rate, weak margins, or poor repeat economics
    - Shift thesis from scale premium to evidence-gap discount
  - - Customer concentration and retention opacity
    - Top-10 share too high or renewal data weak
    - High concentration plus low renewal visibility
    - Treat participant-count narrative as overstated
  - - Founder-key-person risk
    - Loss of key leader without bench depth
    - Unexpected departure or slow delegation
    - Raise governance discount and execution risk premium
  notes: These are investment kill criteria, not company survival criteria.
  claimRefs:
