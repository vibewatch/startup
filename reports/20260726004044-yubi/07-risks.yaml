- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: sample
    basis: Rows capture the highest-salience regime and legal risks visible in retained public evidence, not every applicable statute or contract.
  columns:
  - Rule or issue
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - OBPP framework changes / Aspero exposure
    - India / SEBI
    - Active 2026 consultation plus adverse company-specific report
    - Medium-High
    - High
    - Track consultation outcomes and remediation evidence
    - Retail bond distribution may face product or process friction
    - Obtain Aspero compliance pack, regulator correspondence, and product control map
  - - Co-lending directions 2025
    - India / RBI
    - Effective from Jan 1 2026
    - High
    - High
    - Formal compliance programs and partner process alignment
    - Workflow exceptions or slower partner onboarding if rules change
    - Request module-level co-lending compliance review and partner audits
  - - Digital lending / partner-governance obligations
    - India / RBI / CERT-In
    - Ongoing
    - Medium
    - High
    - System-enforced policy controls and incident reporting readiness
    - Missteps can become supervisory as well as operational issues
    - Request control testing, incident logs, and governance committee minutes
  - - Privacy and personal-data obligations
    - India / DPDP Act / IT Act
    - In force
    - Medium
    - High
    - Data governance, lawful processing controls, and breach readiness
    - Blocked public legal pages limit outside verification of policy quality
    - Request privacy policy pack, DPA terms, consent flows, and deletion workflow
  - - Cross-border banking rollout
    - UAE and India
    - Scaling via named bank partners
    - Medium
    - Medium-High
    - Local legal review and bank-side compliance ownership
    - Regional regulatory change or partner interpretation can slow rollout
    - Request country-by-country compliance matrix and legal-owner map
  notes: Severity ranks residual business impact, not just the likelihood of a rule existing.
