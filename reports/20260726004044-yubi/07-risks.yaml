  title: Partner or dependency risk register
  columns:
  - Dependency
  - Counterparty
  - Role
  - Concentration
  - Failure scenario
  - Severity
  - Mitigation
  - Residual exposure
  rows:
  - - Anchor bank partners in UAE
    - Ajman Bank, NBF, future banks
    - Distribution and rollout channel
    - Potentially concentrated early market entry
    - Delayed rollout or partner churn slows international revenue and proof points
    - High
    - Expand partner roster and local operating bench
    - Still exposed while the roster is small
  - - Indian lender ecosystem
    - Banks, NBFCs, fintech originators
    - Capital supply and regulated workflow counterparties
    - Broad network but economic concentration unknown
    - Top institutions reduce activity, squeeze pricing, or demand custom compliance work
    - High
    - Diversify product and institution mix
    - Unknown top-account share remains a material gap
  - - Issuer and structured-credit pipeline
    - Developers and capital-market issuers
    - Deal flow for debt distribution
    - Likely episodic
    - Fewer issuance mandates hurt volume and fee visibility
    - Medium-High
    - Broaden issuer verticals and repeat issuance accounts
    - Cyclicality remains
  - - Investors and distributor channels
    - UHNI, HNI, family offices, advisers
    - Demand-side liquidity and distribution
    - Unknown productivity concentration
    - Investor confidence weakens after regulation or market stress
    - Medium-High
    - Improve controls, transparency, and product curation
    - Retail or distributor channel quality is not public
  - - Regulators and policy architecture
    - RBI, SEBI, CERT-In, privacy regime
    - Permissioned operating environment
    - Structural
    - Rule changes reshape workflow economics or increase cost-to-comply
    - High
    - Maintain adaptable control architecture
    - Cannot be diversified away
  notes: Partner risk is partly strategic and partly regulatory because many dependencies are themselves regulated entities.
