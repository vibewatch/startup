  topStrengths:
    - >-
      Real platform breadth across lending, co-lending, bond distribution, supply-chain finance, structured-credit, and
      collections-adjacent workflows makes Yubi more strategic than a single-product lender or marketplace.
    - >-
      Public partner and customer proof from Ajman Bank, National Bank of Fujairah, DRA Homes, and adviser/distributor
      infrastructure supports real production adoption rather than concept-stage storytelling.
    - >-
      Scale signals are substantial: public 2025-2026 sources point to 17,000+ enterprises, 6,200+ lenders or investors,
      ₹3.2 lakh crore+ debt facilitated, and large partnership-lending throughput.
    - >-
      The trust hub, security posture, and bank-grade counterparty focus support an infrastructure premium if diligence
      confirms the underlying control evidence.
  topRisks:
    - >-
      Public monetization evidence is still thin: audited trend financials, product-level take rates, gross margins, and
      durable renewal data are not publicly available.
    - >-
      Regulatory density is high across OBPP, co-lending, privacy, cyber-reporting, and partner-bank workflows;
      Aspero-specific regulatory friction is the clearest downside trigger.
    - >-
      Customer and partner economics may still be concentrated even though participant counts are broad, and public
      disclosure does not show top-account share or contract durability.
    - >-
      International and multi-module expansion raises execution complexity while the public legal and disclosure surface
      remains weaker than the product and partner surface.
  unresolvedGaps:
    - Audited three-year financials with clear revenue bridges, gross margins, cash flow, and product-level economics.
    - >-
      Top-account concentration, NRR/GRR, contract lengths, and repeat-usage cohorts across banks, issuers, and
      distributors.
    - >-
      Regulator correspondence, remediation status, and legal-control mapping for Aspero, co-lending, privacy, and
      cross-border bank deployments.
    - Country-level contribution margins and partner concentration for MENA and other international expansion markets.
