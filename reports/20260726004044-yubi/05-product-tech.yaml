company:
  name: Yubi
chapter:
  number: 5
  title: Product & Technology
  summary: Yubi's public product file supports a broad, commercially real debt-infrastructure stack spanning origination, co-lending, supply-chain finance, bond distribution, retail bond access, and post-origination adjacencies. The clearest technical strengths are workflow breadth, bank or adviser deployment evidence, and a relatively visible trust and security posture. The clearest weaknesses are blocked commercial pages, missing API or reliability detail, and trust-document endpoints whose existence is clearer than their inspectable contents in this environment.
sections:
- id: product-scope-and-module-map
  title: Product Scope and Module Map
  body: 'Yubi is best understood as a debt-workflow operating layer that spans several linked products rather than as a single lender or retail investing app. Public rebrand and investor materials consistently describe five core rails: enterprise loans, co-lending, investment distribution, supply-chain finance, and pools or securitisation. Later company-adjacent coverage expands that map through Aspero on retail bonds and fixed-income distribution, plus group entities such as Accumn, Spocto X, and YuCollect for underwriting and collections. This breadth matters because the product promise is not just discovery of capital, but orchestration across onboarding, decisioning, execution, servicing, and recovery. The architectural trade-off is that Yubi''s real product is a multi-sided operating system with several modules, making maturity and integration depth more important than any one marketing label for buyers.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE034
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: workflow-architecture-and-operating-model
  title: Workflow, Architecture, and Operating Model
  body: The public architecture is mostly inferential, but the inference is strong enough to be useful. Yubi sits between borrowers, lenders, investors, advisers, and service teams, so the core system likely functions as a control plane for onboarding, matching, policy enforcement, disbursal or settlement, and post-origination servicing. Public surfaces support this view in two ways. First, the Ajman Bank partnership explicitly names Yubi Enterprise Credit Market for corporate loans and supply-chain finance in a digital flow. Second, the investment-solutions announcement describes an earnings dashboard, dedicated relationship-manager support, digital onboarding, a branded content studio, and AI-powered goal-based assistance for fixed-income distributors. Together these cues imply a modular infrastructure stack rather than one monolithic point product. They also imply significant data-model and permissions complexity, because the same platform has to support institutional lenders, borrowers,
    distributors, and post-trade operating teams without breaking workflow integrity. What is missing is low-level documentation on APIs, cloud architecture, uptime, and exact integration patterns, which remains a major product diligence gap.
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE035
