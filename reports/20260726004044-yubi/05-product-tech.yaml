  - FE003
- id: trust-security-and-compliance-controls
  title: Trust, Security, and Compliance Controls
  body: Trust and control posture are unusually visible compared with Yubi's commercial pages. The trust hub and its document endpoints show a company that wants enterprise counterparties to see security, continuity, and audit posture as product features rather than back-office checkboxes. The strongest readable signals are the live security-team note describing 24/7 SOC monitoring with 14 or more threat-intelligence feeds, zero-trust VPN tunnels, privileged access management, EDR with CrowdStrike Falcon Complete, vendor reviews, and rehearsed business-continuity and incident-response playbooks. Earlier overview work also established references to SOC 2 and ISO 22301, ISO 27001, and ISO 27701. However, the item-specific trust URLs for SOC 2, VAPT, BCP and DR, audit rights, and related materials did not render deeper public detail in this environment, so their existence is clearer than their contents. For enterprise buyers, that means the sales narrative on trust is substantially stronger
    than the self-serve diligence packet. That still supports a differentiated enterprise-sales posture, while leaving technical verification incomplete.
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE036
