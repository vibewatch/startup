evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated company-controlled disclosure of total Yubi Group and entity-level employee counts.
    whyItMatters: Workforce scale is a common maturity proxy and the current public file contains materially conflicting numbers.
    diligencePath: Request the latest audited employee count split between Credavenue Private Limited and the wider Yubi Group.
    relatedQuestionRefs:
      - QO019
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A reliable public roster of board members, independent directors, and governance committees.
    whyItMatters: Private-unicorn governance quality cannot be underwritten confidently without board visibility.
    diligencePath: Ask management for the current board list, observer rights, and post-secondary ownership structure.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: capital-stack
    missingEvidence: >-
      A full cap-table and round-by-round reconciliation of primary equity, secondary transfers, founder infusions, and
      structured debt.
    whyItMatters: >-
      Valuation stance and dilution analysis depend on understanding what capital actually entered the business and at
      what terms.
    diligencePath: >-
      Request a financing schedule with dates, instruments, lead investors, primary versus secondary split, and current
      preference stack.
    relatedQuestionRefs:
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: fy25-financial-detail
    missingEvidence: A fuller FY25 financial pack including gross margin, burn, and cash runway beyond topline and net-loss snippets.
    whyItMatters: Later financial underwriting is possible only at medium confidence without a fuller operating statement.
    diligencePath: >-
      Obtain audited FY25 statements or investor materials showing expense mix, EBITDA bridge, and balance-sheet
      liquidity.
  - type: missing-source
    severity: material
    topic: full-market-tam
    missingEvidence: >-
      A single authoritative cross-segment dataset that unifies bond distribution, co-lending workflows, TReDS
      throughput, and securitisation activity into one comparable TAM.
    whyItMatters: >-
      The market is clearly large, but underwriting Yubi's exact share-of-wallet opportunity needs a cleaner stitched
      denominator than public sources currently provide.
    diligencePath: Build a bottoms-up TAM model from product-level GMV, software-fee take rates, and segment-specific debt volumes.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: yubi-segment-revenue
    missingEvidence: Revenue or GMV split by Yubi product line such as Loans, Co.Lend, Invest or Aspero, Flow, and Pools.
    whyItMatters: >-
      Market attractiveness differs materially by segment, and current public sources do not show where Yubi is already
      strongest economically.
    diligencePath: Request management metrics for segment GMV, revenue contribution, active institutions, and attach rates.
    relatedQuestionRefs:
      - QM007
      - QM024
  - type: missing-source
    severity: minor
    topic: treds-size-gap
    missingEvidence: >-
