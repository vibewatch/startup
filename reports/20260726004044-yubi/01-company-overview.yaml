          detail: Global expansion to SEA, US, Middle East and AI investment
        - id: caveat
          label: Disclosure caveat
          detail: Public sources do not fully reconcile cap table, secondary mix, or exact cumulative funding
      edges:
        - {from: early, to: b2022, label: scaled into}
        - {from: b2022, to: sec2024, label: followed by}
        - {from: sec2024, to: fin2025, label: continued into}
        - {from: fin2025, to: uses, label: funds}
        - {from: uses, to: caveat, label: still leaves}
    approximationNotes: The bridge simplifies multiple rounds and secondary events into the major public valuation anchors rather than a full security-by-security cap-table model.
    claimRefs: [CO013, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022]
callouts:
  - calloutType: insight
    title: Yubi is best understood as debt-market infrastructure, not a lender with one balance-sheet product
    body: The overview sources consistently describe Yubi as connecting borrowers, lenders, investors, and advisers across origination, underwriting, bond access, securitisation, and collections, which makes platform breadth a core strength but also broadens execution and compliance complexity.
    claimRefs: [CO009, CO010, CO011, CO012, CO027, CO034]
  - calloutType: risk
    title: Public scale is strong, but governance and valuation mechanics remain under-disclosed for a private unicorn
    body: The platform has credible capital and throughput signals, yet public sources still leave board composition, exact cumulative capital, post-secondary ownership, and even employee count imperfectly reconciled.
    claimRefs: [CO017, CO021, CO035, CO039, CO040]
