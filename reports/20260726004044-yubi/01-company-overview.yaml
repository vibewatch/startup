  - id: FO003
    title: Product-stack snapshot KPIs
    type: kpi
    layout: wide
    summary: Yubi's overview scorecard shows strong category breadth and transaction scale, but weaker disclosure quality around valuation mechanics and workforce count.
    data:
      items:
        - label: Product breadth
          score: 8/10
          note: Five core debt products at rebrand plus later group companies spanning origination to collections
        - label: Investor support
          score: 8/10
          note: Tier-one growth investors backed the 2022 unicorn round and founder support continued in 2024-2025
        - label: Platform scale
          score: 8/10
          note: Public reports cite ₹3.2 lakh crore facilitated, 48 lakh transactions, and 17,000+ enterprises
        - label: International expansion
          score: 6/10
          note: MENA partnership and overseas funding use are clear, but contribution by region is undisclosed
        - label: Disclosure completeness
          score: 4/10
          note: Exact headcount, cap-table mechanics, and board-level governance remain thinly disclosed
        - label: Regulatory complexity
          score: 5/10
          note: Bond-platform and debt-infrastructure breadth create compliance surface area, as the Aspero scrutiny suggests
    claimRefs: [CO009, CO013, CO018, CO023, CO024, CO025, CO032, CO038, CO039, CO040]
