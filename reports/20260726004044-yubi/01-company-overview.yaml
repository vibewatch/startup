company:
  name: Yubi
chapter:
  number: 1
  title: Company Overview
  summary: Yubi is the Chennai-headquartered debt-infrastructure platform that grew out of CredAvenue, which was incorporated in August 2020 and rebranded in June 2022. Public sources consistently support the core debt-platform identity, the 2022 $137 million unicorn round, the 2024 founder-led valuation support, and the 2025 ₹411 crore financing for expansion and AI; they are less consistent on exact workforce scale and cumulative capital. The strongest verified overview facts are the legal entity, founder lineage, product architecture, recent funding chronology, and transaction/participant scale, while board-level governance detail and precise cap-table mechanics remain under-disclosed.
sections:
  - id: legal-identity-and-founder-lineage
    title: Legal Identity and Founder Lineage
    body: >-
      Yubi's public identity is cleaner than its founder narrative. The operating company behind
      the brand is Credavenue Private Limited, incorporated on 21 August 2020 and registered in
      Chennai under CIN U72900TN2020PTC137251. The Company Check and related profile surfaces
      place the registered office at Prestige Polygon on Anna Salai in Chennai and also show that
      the company uses both Yubi and Aspero as associated brands. Founder Gaurav Kumar's career
      explains why some market commentary informally blends Yubi with Vivriti: before setting up
      CredAvenue/Yubi in 2020, he had already built debt-market businesses such as Vivriti Capital
      and Vivriti Asset Management. The safest framing is therefore not “founded in 2017,” but
      rather that Kumar entered the debt-infrastructure category earlier and launched the separate
      Yubi/CredAvenue platform in 2020. That distinction matters for later financial and valuation
      analysis because the platform's cap table, operating history, and current disclosures are
      distinct from Vivriti's.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO039, CO040]
    tableRefs: [TO001, TO002]
    figureRefs: [FO002]
  - id: rebrand-product-architecture-and-group-scope
    title: Rebrand, Product Architecture, and Group Scope
    body: >-
      The June 2022 rebrand from CredAvenue to Yubi was not presented as a cosmetic rename.
      Moneycontrol and Mint both describe it as a shift toward a unified debt-infrastructure brand
      intended to be ubiquitous across the credit ecosystem and to support global expansion
      beginning with the UAE. At rebrand, the company publicly described five debt products:
      YubiLoans for enterprise borrowing, YubiCo.Lend for co-lending, YubiInvest for bond
      issuance and investment, YubiSCF or YubiFlow for supply-chain finance, and YubiPool for
      securitisation or structured finance. Later investor and company-adjacent descriptions
      expand the group map to Yubi, Accumn, Spocto X, YuCollect, and Aspero, which together cover
      origination, credit decisioning, fulfilment, investment distribution, and collections.
      Finovate's 2026 demo description and TVS Capital's portfolio page both reinforce that Yubi
      is selling infrastructure rather than a single narrow lending product.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO027, CO034, CO036, CO037]
    tableRefs: [TO003]
    figureRefs: [FO003]
  - id: funding-valuation-and-capital-support
    title: Funding, Valuation, and Capital Support
    body: >-
      Yubi's capital history is strong enough to establish unicorn status and continued insider
      support, even if it is not strong enough to fully reconstruct every security and ownership
      layer. TechCrunch, VCCircle, and Moneycontrol align on the March 2022 Series B of roughly
      $137 million that valued the company at about $1.3 billion. Later founder-investment
      coverage shows Kumar injecting ₹250 crore in August 2024 and an additional ₹75 crore inside
      the 2025 financing, taking his disclosed equity support above ₹330 crore. The November 2025
      round combined ₹336 crore of structured debt from EvolutionX Debt Capital with ₹75 crore of
      fresh founder equity for a total of ₹411 crore. Multiple reports also point to a later $1.5
      billion valuation anchor after a secondary transaction, but the public file does not fully
      reconcile whether that mark should be treated as the definitive valuation for every
      subsequent insider financing event. The durable conclusion is that Yubi remained
      unicorn-valued and founder-supported through 2025, with fresh capital aimed more at
      expansion and product deepening than at emergency balance-sheet repair.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO004]
    figureRefs: [FO001, FO004]
  - id: scale-participants-and-adverse-open-questions
    title: Scale, Participants, and Adverse Open Questions
    body: >-
      The clearest scale signals relate to debt throughput, participant counts, and the expansion
      of Yubi's investment and overseas footprint. Current 2025-2026 coverage states that the
      platform has facilitated more than ₹3.2 lakh crore in debt, processed over 48 lakh
      transactions, and works with more than 17,000 enterprises and 6,200 lenders or investors. A
      2026 investment-solutions announcement adds that Yubi facilitated more than ₹45,000 crore of
      bonds in FY26 and positions Aspero as an independently operated, SEBI-regulated online bond
      platform provider serving retail and adviser-led distribution. Official trust-hub language
      also shows a mature security posture with ISO 22301, ISO 27001, ISO 27701, and SOC 2
      references, plus an explicit statement that services were unaffected by the CrowdStrike
      outage. The biggest caveats are elsewhere: workforce figures conflict materially across
      sources, board composition remains largely opaque in public coverage, and VCCircle's report
      about regulatory scrutiny around the bond-investing business is a reminder that platform
      complexity can create compliance risk even while overall growth remains strong.
    claimRefs: [CO023, CO024, CO025, CO026, CO028, CO029, CO030, CO031, CO032, CO033, CO035, CO038, CO039, CO040]
    tableRefs: []
    figureRefs: []
