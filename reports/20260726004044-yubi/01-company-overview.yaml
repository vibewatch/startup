    title: Funding and valuation bridge
    type: flow
    layout: wide
    summary: Yubi's capital story moved from early venture backing to a unicorn round and then to founder-supported insider capital plus structured debt for global scaling.
    data:
      nodes:
        - id: early
          label: Early venture backing
          detail: TVS Capital and other early investors support pre-unicorn buildout
        - id: b2022
          label: 2022 Series B
          detail: ~$137M round creates $1.3B unicorn valuation
        - id: sec2024
          label: 2024 founder support
          detail: ₹250 crore founder infusion and later $1.5B valuation references
        - id: fin2025
