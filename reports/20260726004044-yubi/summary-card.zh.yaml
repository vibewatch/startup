  topStrengths:
    - Yubi 的平台宽度真实覆盖放贷、联合放贷、债券分销、供应链金融、结构化信贷和催收相邻流程，战略价值高于单一产品的放贷方或撮合市场。
    - Ajman Bank、National Bank of Fujairah、DRA Homes 以及顾问 / 分销基础设施提供了公开伙伴和客户证据，说明产品已进入真实生产环境，不只是概念叙事。
    - 规模信号很重：2025-2026 年公开来源显示，Yubi 覆盖 17,000+ 家企业、6,200+ 家放贷方或投资人，撮合债务规模超过 ₹3.2 lakh crore，伙伴放贷吞吐量也很大。
    - 信任中心、安全姿态和银行级交易对手重点，若能在尽调中拿到底层控制证据，就能支撑基础设施溢价。
  topRisks:
    - 公开变现证据仍薄：审计后的趋势财务、产品级 take rate、毛利率和可持续续约数据都没有公开。
    - OBPP、联合放贷、隐私、网络安全报告和伙伴银行流程都压着高监管密度；Aspero 特定监管摩擦是最清晰的下行触发点。
    - 参与方数量虽广，客户和伙伴经济性仍可能集中；公开披露看不到头部账户占比或合同耐久性。
    - 国际化和多模块扩张抬高执行复杂度，而公开法律与披露表面仍弱于产品和伙伴表面。
  unresolvedGaps:
    - 审计后的三年财务，需清楚列出收入桥、毛利率、现金流和产品级经济性。
    - 银行、发行人和分销方的头部账户集中度、NRR/GRR、合同期限和重复使用队列。
    - Aspero、联合放贷、隐私和跨境银行部署的监管往来、整改状态和法律控制映射。
    - MENA 及其他国际扩张市场的国家级贡献利润率和伙伴集中度。
