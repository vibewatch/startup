schemaVersion: report-v2
artifact: customers
slug: yubi
runDate: '2026-07-26'
company:
  name: Yubi
chapter:
  number: 6
  title: Customers
  summary: 'Yubi has credible customer reality: current public evidence shows large aggregate platform activity, production-grade deployments with Ajman Bank, National Bank of Fujairah, and DRA Homes, and an expanding distribution-side customer set across advisers and investors. The weakest part of the customer story is not whether adoption exists, but whether the economics are durable and diversified. Public sources do not disclose retention cohorts, contract lengths, or concentration data, so the right underwriting stance is that adoption breadth is proven while durability and concentration remain material diligence asks.'
sections:
- id: customer-segments-and-buying-centers
  title: Customer Segments and Buying Centers
  body: 'Yubi does not sell to one simple customer archetype. Its public surfaces point to at least five economically distinct constituencies: enterprise borrowers seeking loans or working capital; banks and NBFCs supplying balance-sheet capacity; investors buying debt opportunities; wealth intermediaries distributing fixed-income products; and regional bank partners using Yubi''s workflow infrastructure to serve their own SME or trade-finance clients. The practical implication is that buyer, user, and payer often differ. A bank may pay for workflow infrastructure while SMEs are the operating end-users of the credit journey; a developer may use Yubi''s issuance stack while investors ultimately fund the instrument; advisers may use distribution tooling while end clients purchase the products. This multi-sided structure broadens addressable demand but also makes customer quality harder to score because account counts, participant counts, and end-user loan counts sit at different layers of
    the value chain and pricing logic.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU032
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-scale-signals
  title: Adoption Trajectory and Scale Signals
  body: 'Public adoption evidence is strongest in aggregate platform activity rather than in cohort-style SaaS disclosure. By late 2025 Yubi said it had more than 17,000 enterprise borrowers and 6,200 lenders on the platform, materially above the older borrower and lender counts visible around the rebrand period. Separately, Yubi''s 2026 partnership-lending report described more than 10 lakh loans, over ₹12,000 crore of disbursals, and more than 2 crore end-to-end transactions during April to December 2025. It also reported that 88 percent of credit demand came from non-metros, with average ticket size around ₹1.2 lakh and zero manual overrides. These are meaningful signs of operational adoption and repeat usage at the workflow level. They also suggest that Yubi is embedded in daily or recurring credit operations rather than being used only for occasional deal sourcing. The caveat is denominator quality: the public file still does not disclose active-account rates, revenue per customer,
    renewal rates, or how much of the aggregate traffic belongs to a concentrated subset of large institutions.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU033
