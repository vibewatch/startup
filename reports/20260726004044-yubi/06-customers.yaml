  - TU003
  figureRefs:
  - FU003
- id: durability-retention-and-concentration-risks
  title: Durability, Retention, and Concentration Risks
  body: 'The weakest part of Yubi''s customer file is durability disclosure. There is no public NRR, GRR, churn, renewal-rate, contract-length, or customer-satisfaction dataset in the retained sources, so any retention view has to remain heuristic. The evidence does suggest potential durability drivers: integration into bank credit workflows, repeat need for working capital and issuance, and multi-product expansion from origination into distribution or collections. But these positives are offset by concentration and execution risks. Named customer proof clusters around regulated institutions, developer financing, and partnership-lending ecosystems, implying dependence on bank, NBFC, and capital-market counterparties. Customer trust may also be affected if regulatory concerns around Aspero or broader product-governance issues intensify. The correct reading is that adoption breadth appears strong, named proof is credible, but retention and concentration quality are not publicly transparent
    enough to underwrite at high confidence without direct data-room evidence today.'
