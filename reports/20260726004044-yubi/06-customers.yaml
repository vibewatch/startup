tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Strategic value or revenue logic
  - Gap
  rows:
  - - Enterprise borrowers and SMEs
    - User = borrowing enterprise; buyer/payer may be enterprise or sponsoring financial institution
    - Corporate loans, working capital, SCF, partnership-lending end demand
    - 17,000+ enterprise borrowers by late 2025
    - Drives transaction flow and data density across the ecosystem
    - No active-borrower or revenue-per-borrower disclosure
  - - Banks and NBFCs
    - Buyer and payer = financial institution; users = credit, ops, and distribution teams
    - Origination workflow, co-lending, partnership lending, SCF, bank channel expansion
    - 6,200+ lenders by late 2025
    - Institutional counterparties anchor supply and monetization
    - No disclosed top-account concentration or ARR mix
  - - Investors and bond buyers
    - Buyer = investor or treasury; user = investment desk or retail buyer
    - Debt investments, NCD participation, structured credit access
    - Retail to UHNI/family-office reach through Aspero and Yubi distribution
    - Supports capital-market depth and fee opportunity
    - No public repeat-investor metrics
  - - Wealth intermediaries
    - Buyer/user = IFAs, MFDs, wealth managers, family-office teams
    - Fixed-income product distribution and portfolio execution
    - 2026 investment-solutions buildout targets this segment explicitly
    - Creates high-frequency distribution workflow beyond direct lending
    - No public account or productivity data
  - - Bank partners in MENA
    - Buyer/payer = bank partner; users = business-banking and trade teams
    - Digital trade finance, supply-chain finance, SME working capital
    - Ajman Bank and NBF named publicly
    - Shows geographic portability and enterprise-grade sales motion
    - Public partner roster is still small
  - - Corporate issuers / developers
    - Buyer/user = issuer treasury or promoter team
    - Secured debt issuance and distribution for land or project finance
    - DRA Homes debt platform is the clearest example
    - Shows Yubi can monetize structuring and investor distribution, not just matching
    - No disclosed repeat issuance or renewal history
  notes: Segmentation separates marketplace participants, channel partners, and end-demand users because each layer implies different monetization and retention dynamics.
