  - - Aspero-linked investor distribution base
    - Investor / wealth-distribution channel
    - Access to broad investor base including UHNI, HNI, family offices, and retail investors
    - Commercial product, exact customer roster undisclosed
    - Shows Yubi can serve issuer and investor-side customer sets simultaneously
    - Not a named single-customer deployment
  notes: Named proof is strongest where customer-quoted announcements exist; broader channel evidence is separated from named enterprise deployments.
