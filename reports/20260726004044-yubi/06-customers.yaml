- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from loans into SCF, co-lending, and collections
    - Large institutions may still dominate economics
    - High revenue concentration could hide beneath broad participant counts
    - Request top-10 account share by revenue and volume
  - - Geographic expansion via UAE bank partnerships
    - Regional rollout may depend on a small number of anchor banks
    - Lost anchor partner could slow non-India scaling
    - Request pipeline and active-account count for MENA partners
  - - Issuer-side capital-markets workflows
    - Deal-driven revenue may be episodic rather than recurring
    - Growth can look strong even if retention is uneven
    - Request repeat issuance history and fee mix
  - - Wealth/distributor channel buildout
    - Channel productivity may vary widely by adviser type
    - Expansion economics may depend on a handful of productive distributors
    - Request distributor activation and retention cohorts
  - - Partnership-lending scale
    - Platform throughput can mask low monetization per transaction
    - Valuation risk rises if volume growth outpaces revenue capture
    - Request take-rate and gross-margin disclosure
  - - Regulatory trust in retail-bond surfaces
    - Compliance friction could impair customer acquisition or partner confidence
    - Could slow distribution expansion and weaken cross-sell
    - Request regulator correspondence and remediation status for Aspero-related issues
  notes: The table separates expansion vectors from the concentration mechanisms that could cap their economic value.
  claimRefs:
