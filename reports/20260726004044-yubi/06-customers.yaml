    - UAE bank partner
    - Yubi Enterprise Credit Market for SME trade working capital, corporate loans, and supply-chain finance
    - Production launch publicly announced
    - Customer quote confirms the collaboration enhances SME finance and uses a 100 percent digital process
    - No disclosed utilization, renewals, or revenue contribution
  - - National Bank of Fujairah
    - UAE bank partner
    - Dedicated digitally enabled supply-chain-financing platform and working-capital workflow
    - Production launch publicly announced at GITEX 2025
    - Bank quote says the partnership digitizes customer journeys end-to-end for business customers
    - No public live-volume or customer-count disclosure
  - - DRA Homes
    - Indian real-estate developer / issuer
    - ₹250 crore secured NCD platform for land acquisition with issuance and distribution via Yubi
