- id: named-customer-proof-and-expansion-patterns
  title: Named Customer Proof and Expansion Patterns
  body: Named customer proof is real but still concentrated in a few visible categories. The cleanest 2025-2026 references are Ajman Bank, National Bank of Fujairah, and DRA Homes. Ajman Bank publicly said the Yubi partnership would enhance SME finance for customers through Yubi Enterprise Credit Market and a fully digital process. NBF later announced a dedicated digitally enabled supply-chain-financing platform using Yubi to speed working-capital access for UAE businesses. DRA Homes announced a ₹250 crore secured-debt platform where Yubi would structure, issue, and distribute NCDs while Aspero broadened investor reach. Together these cases matter because they show Yubi serving both financial institutions and corporate issuers, and doing so in India and the UAE across different financing motions. Still, named proof remains narrower than the company's aggregate participant counts. The strongest evidence today is production-grade workflow deployment, not broad public disclosure of a large
    roster of referenceable customers with quantified outcomes.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU034
