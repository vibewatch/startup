company:
  name: Yubi
chapter:
  number: 8
  title: Valuation
  summary: Yubi’s public evidence supports a serious business and a plausible unicorn valuation, but not yet a high-confidence “buy at any price” conclusion. The company earns a strategic premium for debt-workflow infrastructure breadth, named institutional proof, and visible scaling, yet that premium should remain capped by incomplete visibility into monetization, retention, concentration, and regulatory cleanliness. A sensible IC posture is conditional invest / track with disciplined entry around the latest private mark, bull/base/bear ranges of roughly $1.8–2.0B, $1.4–1.6B, and $0.9–1.2B respectively, and a short list of diligence items that could move the call quickly.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: 'Yubi looks like a real company with real strategic value, but not yet like a clean public-equity-style underwriting case. The strongest supporting facts are breadth of debt-workflow coverage, visible institutional and bank deployments, large transaction activity, and a financing history that kept the company in unicorn territory after the 2024 founder-led round. The weakest facts are equally important: public monetization detail is thin, profitability remains a forward target rather than an audited outcome, retail-bond regulation is still a live variable, and customer durability and concentration are not publicly disclosed at the level needed for high-conviction pricing. That combination leads to a price-sensitive, not company-sensitive, conclusion. Yubi should be treated as a conditional invest or track candidate rather than a clear buy at any valuation. At or slightly below the latest private mark, the available public evidence supports a neutral-to-cautiously-positive stance.
    Material upside requires proof that revenue quality, compliance resilience, and international scaling can catch up with the infrastructure narrative.'
