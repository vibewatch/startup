- id: final-diligence-asks-and-thesis-breakers
  title: Final Diligence Asks and Thesis-Breakers
  body: 'The remaining valuation work is unusually crisp. To move from conditional interest to conviction, investors need hard answers on revenue composition, take rates, gross margins, top-account concentration, renewal behavior, regulator correspondence, and the real economics of international expansion. They also need clean separation between the parts of the Yubi group that deserve software-style or infrastructure-style premiums and the parts that should still be valued closer to regulated financial intermediaries or deal-driven distribution businesses. The best use of diligence is therefore not another generic market deck, but a compact evidence package: audited trend financials, customer cohorts, product-level gross profit, open compliance issues, and country-by-country contribution margins. The thesis should break quickly if those materials reveal that participant scale is not translating into durable economics, if remediation on regulated modules is messy, or if cross-border expansion
    is being subsidized more heavily than the public story suggests. Absent those failures, the latest valuation can still be defended as plausible, but not yet as obviously cheap.'
