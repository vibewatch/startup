- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Yubi is building debt-market infrastructure rather than a narrow lender, which can justify a strategic premium.
    - If product breadth is not translating into durable take rates or repeat economics, the premium should compress.
  - - Visible bank, issuer, and distributor proofs suggest real platform adoption.
    - If top-account concentration is extreme or renewal rates are weak, broad participant counts would be less meaningful.
  - - A pathway to profitability by March 2027 could move Yubi from story to operating proof.
    - If profitability slips materially or depends on unsustainably low investment, the current mark loses support.
  - - International expansion could diversify revenue and reduce India-specific concentration.
    - If MENA growth remains concentrated in a few banks or requires heavy subsidy, valuation upside falls.
  - - Regulatory reform around debt-market access creates structural tailwinds.
    - If Aspero or adjacent modules face remediation drag, the tailwind becomes a discount factor.
  notes: The anti-thesis is evidence-based rather than a generic macro downside story.
