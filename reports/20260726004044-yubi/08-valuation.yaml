    - SME credit / supply-chain neighbor
    - Relevant operating neighbor, public valuation surface sparse in this run
    - Helpful for channel and product adjacency
    - Blocked official surface prevents precision
  notes: The comp set mixes direct anchor, public-market credit proxy, and private lending-platform references because no single clean peer exists.
