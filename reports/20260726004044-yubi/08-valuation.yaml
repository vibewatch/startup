  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation or return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Profitability delivered by FY27, international revenue approaches target, regulation remains manageable, customer concentration acceptable
    - $1.8B-$2.0B plausible if infrastructure premium expands and evidence quality improves
    - Execution and compliance slippage
    - Needs multiple diligence upgrades, not just continued fundraising
  - - Base
    - Scale continues, monetization improves gradually, but evidence gaps remain on concentration and product economics
    - ~$1.4B-$1.6B supports staying around latest mark with modest flexibility
    - Narrative outruns proof or margins stay less visible than hoped
    - Most consistent with current public evidence
  - - Bear
    - Regulatory friction rises, profitability timing slips, partner concentration or renewal quality disappoints
    - ~$0.9B-$1.2B if strategic premium compresses toward discounted financial-institution comps
    - Control failures, slower expansion, weak take rates
    - Would follow from diligence disappointment more than macro shock alone
  notes: Ranges are scenario outputs rather than mechanically derived trading multiples.
