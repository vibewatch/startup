- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Aspero / OBPP remediation deteriorates
    - Major unresolved regulatory action or product restriction
    - Weakens premium around debt-market access and compliance readiness
    - Move to downside case or pause investment
  - - Profitability timeline slips materially
    - No credible path to FY27 profitability or rising losses against scale
    - Undermines transition from narrative to operating proof
    - Lower acceptable entry price
  - - Customer concentration proves high
    - Top-10 account share or renewal data reveals fragile economics
    - Broad participant narrative becomes less valuable
    - Re-rate to concentration-discounted base or bear case
  - - International expansion stays narrow
    - UAE/MENA revenue remains concentrated in a few banks or low-margin workflows
    - Diversification thesis weakens
    - Remove upside premium for global expansion
  - - Take rates or gross margins disappoint
    - Platform breadth fails to produce attractive economics
    - Infrastructure premium no longer deserved
    - Value closer to lower-end scenario
  notes: Kill triggers are framed around evidence that can actually be requested in diligence.
  claimRefs:
  - CV028
  - CV029
  - CV033
  - CV036
  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited trend financials
    - Three-year audited revenue, gross margin, EBITDA, and cash-flow bridge
    - Needed to test whether platform breadth converts into durable economics
    - Finance diligence room / CFO
  - - Revenue composition
    - Take rates, module mix, and geography mix
    - Determines whether Yubi deserves software-like or financial-intermediary-like valuation treatment
    - FP&A and product P&L review
  - - Customer durability
    - NRR, GRR, top-account concentration, and contract lengths
    - Tests whether participant scale is economically sticky
    - Sales ops and customer-success review
  - - Regulatory posture
    - Regulator correspondence, remediation tracker, and legal opinions for Aspero and co-lending modules
    - Core to risk-adjusted valuation premium
    - Compliance and legal diligence
  - - International economics
    - Country-level contribution margins and partner concentration for MENA / other expansion
    - Separates diversification from subsidized expansion
    - Regional operating review
  - - Control evidence
    - SOC 2, VAPT, BCP/DR, incident history, and vendor governance pack
    - Needed to defend infrastructure premium to public or late-stage investors
    - Security and risk diligence
  notes: These asks are sufficient to move the recommendation materially if management responses are strong.
