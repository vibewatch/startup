            body: >-
              Yubi's commercial model also concentrates risk in counterparties it does not fully control. Customer proof
              is credible, but named references cluster around a small number of bank and issuer relationships such as
              Ajman Bank, National Bank of Fujairah, and DRA Homes. That validates product reality while also
              underscoring dependency on anchor institutions, issuer pipelines, and capital-market conditions. The same
              applies inside India: partnership-lending volumes and broad participant counts are impressive, yet public
              disclosure still does not show top-account concentration, retention, or take rates. Financially, the
              company has scale and continued investor support, but outside observers still rely heavily on tracker and
              media estimates for revenue, valuation marks, and profitability trajectory. Conflicting revenue figures
              and sparse public unit economics create a model risk: the platform may be strategically important to
              lenders long before its margins or revenue durability are independently obvious. A valuation narrative
              built on breadth and infrastructure status can therefore outrun the public evidence on monetization
