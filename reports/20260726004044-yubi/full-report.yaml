  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Stack
        blocks:
          - type: paragraph
            body: >-
              Yubi's largest irreducible risk is regulatory adjacency. The company is not a simple software vendor
              operating on the periphery of finance; its visible modules touch co-lending, partnership lending, online
              bond distribution, securitisation-style workflows, trade or supply-chain finance, collections, and
              cross-border bank integrations. That means Yubi inherits rule-change risk even when the underlying
              balance-sheet or issuance exposure sits with a regulated partner. Public policy evidence shows this burden
              is real and getting denser, not lighter. SEBI is still consulting on modifications to the Online Bond
              Platform Provider framework in 2026, while RBI's 2025 co-lending directions broaden and formalise
              operating expectations from January 2026 onward. VCCircle's report on regulatory ire around Aspero
              converts this from abstract regime risk into company-specific downside. Legal diligence is also weaker
              than it should be: Yubi's public privacy and terms pages were blocked in this environment, and the trust
              endpoints disclosed existence better than contractual detail. The result is a business whose upside
              depends on being deeply embedded in regulated flows, but whose downside is also tightly coupled to those
              same flows.
