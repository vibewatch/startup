  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >-
              Yubi's public evidence supports a multi-surface revenue model rather than one uniform subscription
              business. Historical coverage describes the platform charging fees to both parties depending on the
              product, which fits a marketplace and workflow-enablement model across enterprise borrowing, co-lending,
              supply-chain finance, collections, and investment distribution. The newer fixed-income business adds
              another monetization surface because Yubi now serves wealth managers, IFAs, MFDs, and family offices with
              bond access and tooling, while partnership-lending and MENA deployments indicate institution-led program
              revenue opportunities rather than only one-off borrower matching fees. The financial upside of this model
              is diversification across several debt workflows; the underwriting downside is that the public file does
              not disclose which surfaces are recurring software, transaction-linked, service-heavy, or
              balance-sheet-adjacent. Revenue quality therefore has to be inferred from product architecture and
              customer workflows, not from a management-segment P&L.
