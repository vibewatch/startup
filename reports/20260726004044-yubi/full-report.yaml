      - number: '2.2'
        title: 'Sizing Lenses: Bond Market, Workflow Rails, and Adjacencies'
        blocks:
          - type: paragraph
            body: >-
              The most visible and numerically grounded lens is India's corporate bond market. Economic Times and
              Yubi-adjacent 2026 reporting cite record FY25 corporate-bond issuance of about ₹9.9 lakh crore and roughly
              ₹53.6 lakh crore of outstanding corporate bonds, inside an overall bond market of about ₹226 lakh crore. A
              second lens is Yubi's own nearer-term fixed-income distribution wedge: Business News This Week says its
              investment-solutions arm facilitated more than ₹45,000 crore of bonds in FY26. A third lens comes from
              receivables finance. RBI's TReDS directions define a technology-enabled, multi-financier market for MSME
              trade receivables, and RBI continues publishing monthly entity-wise TReDS statistics through 2026,
              confirming an active regulated market rather than a conceptual one. A fourth lens is structured finance:
              CareEdge and Business Standard show securitisation volumes remaining above ₹2.5 lakh crore in FY26 even
              after a retail slowdown, which matters because Yubi's product scope explicitly includes securitisation and
              pools. No single lens is a perfect TAM, but together they show an addressable market measured in multiple
              lakh-crore pools rather than in a niche software category.
            claimRefs:
