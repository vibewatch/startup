  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Yubi looks like a real company with real strategic value, but not yet like a clean public-equity-style
              underwriting case. The strongest supporting facts are breadth of debt-workflow coverage, visible
              institutional and bank deployments, large transaction activity, and a financing history that kept the
              company in unicorn territory after the 2024 founder-led round. The weakest facts are equally important:
              public monetization detail is thin, profitability remains a forward target rather than an audited outcome,
              retail-bond regulation is still a live variable, and customer durability and concentration are not
              publicly disclosed at the level needed for high-conviction pricing. That combination leads to a
              price-sensitive, not company-sensitive, conclusion. Yubi should be treated as a conditional invest or
              track candidate rather than a clear buy at any valuation. At or slightly below the latest private mark,
              the available public evidence supports a neutral-to-cautiously-positive stance. Material upside requires
              proof that revenue quality, compliance resilience, and international scaling can catch up with the
              infrastructure narrative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
