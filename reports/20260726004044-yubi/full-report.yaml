        title: Funding, Valuation, and Capital Support
        blocks:
          - type: paragraph
            body: >-
              Yubi's capital history is strong enough to establish unicorn status and continued insider support, even if
              it is not strong enough to fully reconstruct every security and ownership layer. TechCrunch, VCCircle, and
              Moneycontrol align on the March 2022 Series B of roughly $137 million that valued the company at about
              $1.3 billion. Later founder-investment coverage shows Kumar injecting ₹250 crore in August 2024 and an
              additional ₹75 crore inside the 2025 financing, taking his disclosed equity support above ₹330 crore. The
              November 2025 round combined ₹336 crore of structured debt from EvolutionX Debt Capital with ₹75 crore of
              fresh founder equity for a total of ₹411 crore. Multiple reports also point to a later $1.5 billion
              valuation anchor after a secondary transaction, but the public file does not fully reconcile whether that
              mark should be treated as the definitive valuation for every subsequent insider financing event. The
              durable conclusion is that Yubi remained unicorn-valued and founder-supported through 2025, with fresh
              capital aimed more at expansion and product deepening than at emergency balance-sheet repair.
