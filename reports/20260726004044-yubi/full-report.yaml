            body: >-
              Execution and governance risk should not be treated as background noise. Gaurav Kumar remains the central
              public face across fundraising, product, global expansion, and partner announcements, which is powerful
              commercially but still creates founder concentration. The operating footprint is also broadening across
              domestic lending infrastructure, retail fixed-income distribution, collections adjacencies, and UAE
              expansion, all while disclosure remains uneven. The mitigants are real: enterprise trust controls,
              credible investors, serious bank partners, and evidence that the company can win reference accounts in
              different workflows. But the investment case should still include explicit kill criteria. If Aspero's
              regulatory position deteriorates, if major bank partners stall or churn, if customer concentration proves
              extreme, if cyber or privacy compliance weakens, or if revenue quality materially lags the infrastructure
              narrative, the thesis should downgrade quickly. Yubi's risk profile is therefore manageable only if
              diligence converts control posture and partner proof into measurable evidence on compliance resilience,
