        title: Scale, Participants, and Adverse Open Questions
        blocks:
          - type: paragraph
            body: >-
              The clearest scale signals relate to debt throughput, participant counts, and the expansion of Yubi's
              investment and overseas footprint. Current 2025-2026 coverage states that the platform has facilitated
              more than ₹3.2 lakh crore in debt, processed over 48 lakh transactions, and works with more than 17,000
