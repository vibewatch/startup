            body: >-
              Public traction is real, but the financial numbers are inconsistent enough to remain a diligence issue.
              Inc42 Datalabs lists FY25 revenue at about ₹394.7 crore and total funding above $303 million. Latka states
              2025 revenue at $79 million and 2024 revenue at $58 million. TechStory, citing Moneycontrol and Financial
              Express reporting, says Yubi closed FY25 with a topline around ₹705 crore, a loss around ₹60 crore, and
              gross margin near 75 percent. Those figures are directionally compatible in the sense that they all
              describe a scaled private company, but they are not cleanly reconcilable from public documents. What is
              consistent is operating throughput: Yubi says it facilitated over ₹45,000 crore of bonds in FY26, more
              than 10 lakh loans and over ₹12,000 crore of partnership-lending disbursals in April-December 2025, plus a
