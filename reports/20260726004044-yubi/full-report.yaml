            body: >-
              Operationally, Yubi looks stronger than its legal surface but still carries meaningful failure modes. The
              trust hub presents a serious enterprise posture: 24/7 SOC coverage, threat-intelligence feeds,
              privileged-access controls, EDR, continuity playbooks, and audit-oriented documentation surfaces. Those
              are credible mitigants, not empty slogans. But they do not erase the challenge created by a multi-sided
              platform spanning banks, NBFCs, investors, issuers, distributors, and collection or servicing workflows.
              CERT-In's cyber directions, RBI's IT-outsourcing framework, and the Digital Personal Data Protection Act
              together mean that any material cyber or data-handling incident can become simultaneously an operational,
              legal, supervisory, and customer-trust problem. Public risk is heightened because Yubi's commercial
              website remains harder to inspect than its trust hub, and because the item-level trust documents were not
              fully readable in this run. In other words, Yubi appears to have built real controls, but outside
              investors still cannot easily test their depth without a data room.
