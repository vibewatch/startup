      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on three linked upgrades to the public file. First, profitability moves from target
              to delivered outcome on something close to the margins described in 2025 coverage. Second, the UAE and
              broader international expansion produces diversified revenue rather than simply more partner complexity.
              Third, regulatory friction around Aspero and other core modules stays manageable, allowing Yubi to earn an
              infrastructure premium above basic lender comps. The base case assumes the current broad narrative is
              directionally correct but incomplete: the company continues scaling, monetization improves, yet disclosure
              quality and compliance complexity keep investors from paying a dramatic step-up over the existing mark.
              The bear case is not bankruptcy; it is evidence compression. That happens if valuation stays high while
              public or diligence-room data reveal concentrated economics, weak take rates, slower profitability, or
              heavier remediation burden than the current story implies. In that downside, the market would likely
              re-rate Yubi toward a lower strategic premium and closer to financial-institution comparables with
              execution discounts.
