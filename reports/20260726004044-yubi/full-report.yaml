  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Defining the Addressable Debt-Infrastructure Market
        blocks:
          - type: paragraph
            body: >-
              Yubi's true market is not “digital lending” in the narrow consumer-fintech sense. The company sits in the
              workflow layer connecting multiple debt submarkets: enterprise borrowing, co-lending, supply-chain
              finance, bond issuance and distribution, securitisation, and collections or risk decisioning. That matters
              because the size of the opportunity should not be reduced to one narrow metric such as annual corporate
              bond issuance or one loan-origination pool. TVS Capital, Finovate, CB Insights, and Yubi's 2022 rebrand
              coverage all point to a platform that spans discovery, underwriting, fulfilment, and post-origination
              operations. Regulatory sources reinforce this broader framing. RBI's 2025 co-lending directions, 2026
              TReDS directions, and SEBI's 2026 OBPP consultation show that the debt stack is being formalised not only
              at the capital-market edge but also in SME receivables and lender-partner distribution. The right market
              boundary is therefore “technology infrastructure for India's debt lifecycle,” with each submarket
              supplying a separate but connected monetisation surface.
            claimRefs:
