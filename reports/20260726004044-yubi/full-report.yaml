      - number: '2.4'
        title: Growth Drivers, Regulatory Tailwinds, and Real Constraints
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is supportive but not frictionless. Growth drivers include continuing RBI and SEBI
              formalisation, smaller bond ticket sizes, RFQ settlement norms, clearer co-lending rules, tighter TReDS
              operating standards, and the need for lenders to serve SMEs and wealth channels more efficiently. Yubi's
              own growth materials also point to rising wealth-distribution demand, increasing HNI counts, and expanding
              capital-market participation beyond the largest institutions. But the constraints are substantial. Retail
              participation in bonds is still low, secondary-market liquidity remains uneven, co-lending now carries
              explicit retention, escrow, and disclosure obligations, and TReDS platforms must validate MSME sellers and
              operationally manage assignment and settlement. SEBI's consultation on OBPPs and enforcement against
              unregistered platforms show that distribution innovation can expand only inside a tightening regulatory
              perimeter. For Yubi, the opportunity is therefore large because the market is being organised, but
              monetisation depends on execution quality inside a compliance-heavy, multi-party ecosystem.
            claimRefs:
