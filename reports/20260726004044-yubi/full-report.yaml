        title: Legal Identity and Founder Lineage
        blocks:
          - type: paragraph
            body: >-
              Yubi's public identity is cleaner than its founder narrative. The operating company behind the brand is
              Credavenue Private Limited, incorporated on 21 August 2020 and registered in Chennai under CIN
              U72900TN2020PTC137251. The Company Check and related profile surfaces place the registered office at
              Prestige Polygon on Anna Salai in Chennai and also show that the company uses both Yubi and Aspero as
              associated brands. Founder Gaurav Kumar's career explains why some market commentary informally blends
              Yubi with Vivriti: before setting up CredAvenue/Yubi in 2020, he had already built debt-market businesses
              such as Vivriti Capital and Vivriti Asset Management. The safest framing is therefore not “founded in
              2017,” but rather that Kumar entered the debt-infrastructure category earlier and launched the separate
              Yubi/CredAvenue platform in 2020. That distinction matters for later financial and valuation analysis
              because the platform's cap table, operating history, and current disclosures are distinct from Vivriti's.
