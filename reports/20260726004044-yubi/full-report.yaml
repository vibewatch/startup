            body: >-
              The financial verdict is mixed-positive operationally and still weak on disclosure quality. Yubi has
              enough public evidence to show meaningful demand, multi-product monetization surfaces, founder support,
              and continued access to capital. It may also be approaching a more software-like economic profile than
              many lending-adjacent fintechs if the higher-margin reporting is broadly accurate. However, the chapter's
