  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Yubi competes in several overlapping arenas rather than in one clean software category. The most direct
              overlaps are debt-market and embedded-credit infrastructure providers that connect borrowers, lenders, and
              investors across origination or distribution workflows. Northern Arc, CredAble, and Oxyzo each prove that
              institutional debt access, trade finance, and SME credit are crowded enough to support scaled specialists,
              while Recur Club and InCred show that adjacent debt access and underwriting rails can win customers
              without reproducing Yubi's full marketplace architecture. This matters because buyers can solve the same
              problem through balance-sheet lenders, supply-chain financiers, bond-distribution specialists, or internal
              treasury and bank relationship workflows. Yubi's pitch is broadest when the customer needs one platform
              across enterprise loans, co-lending, supply-chain finance, pools, and fixed-income distribution; it is
              weakest when the buyer wants only one narrow credit product or already has a preferred lending
              counterparty. The landscape should therefore be read as a portfolio of competing solution classes, not a
              single point-solution bakeoff.
