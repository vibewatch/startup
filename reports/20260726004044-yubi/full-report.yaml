companyProfile:
  summary: >
    Yubi is the Chennai-headquartered debt-market infrastructure business behind the former CredAvenue brand.
    Incorporated as Credavenue Private Limited and rebranded in June 2022, it now presents a broader group spanning
    Yubi, Accumn, Spocto X, YuCollect, and Aspero. The platform sits between borrowers, lenders, investors, and
    distributors across multiple debt workflows including loans, co-lending, investment distribution, supply-chain
    finance, pools or securitisation, and collections-adjacent operations. Public evidence supports a continuing unicorn
    valuation narrative around roughly $1.5 billion, >17,000 enterprise borrowers, >6,200 lenders or investors, and
    meaningful bond and partnership-lending throughput, while still leaving cap-table precision, unit economics, and
    audited profitability under-disclosed.
  foundedDate: '2020-08-21'
  founders:
    - name: Gaurav Kumar
      role: Founder & CEO
      background: >
        Indian debt-market entrepreneur who previously built Vivriti Capital and remains the central public face for
        Yubi's fundraising, partner, and expansion narrative.
      claimRefs:
        - CO005
        - CO006
  foundingLocation: Chennai, Tamil Nadu, India
  headquarters: Chennai, India
  productSummary: >
    Multi-sided debt-workflow infrastructure spanning enterprise borrowing, co-lending, fixed-income and bond
    distribution, retail bond access via Aspero, supply-chain finance, structured-credit / pools workflows, and
    collections-adjacent operations.
  customerFocus: >
    Banks, NBFCs, investors, wealth intermediaries, corporate issuers, developers, SMEs, and enterprise borrowers that
    need digital debt-market workflows and distribution infrastructure.
  businessModel: >
    Infrastructure and workflow orchestration model: Yubi connects capital-side institutions and investor pools to
    borrower and issuer demand, monetizing origination, distribution, execution, and servicing workflows across multiple
    debt products.
  stage: Late-stage private (unicorn)
  fundingStatus: >
    Private unicorn with a $137M Series B in 2022 at roughly $1.3B valuation, a 2024 founder-led ₹250 crore support
    round that preserved a ~$1.5B private valuation narrative, and a ₹411 crore 2025 financing mix of structured debt
    and founder equity. Public sources do not fully reconcile cumulative capital across priced equity, founder support,
    structured debt, and any secondary activity.
