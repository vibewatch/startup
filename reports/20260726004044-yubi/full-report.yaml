  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Buying Centers
        blocks:
          - type: paragraph
            body: >-
              Yubi does not sell to one simple customer archetype. Its public surfaces point to at least five
              economically distinct constituencies: enterprise borrowers seeking loans or working capital; banks and
              NBFCs supplying balance-sheet capacity; investors buying debt opportunities; wealth intermediaries
              distributing fixed-income products; and regional bank partners using Yubi's workflow infrastructure to
              serve their own SME or trade-finance clients. The practical implication is that buyer, user, and payer
              often differ. A bank may pay for workflow infrastructure while SMEs are the operating end-users of the
              credit journey; a developer may use Yubi's issuance stack while investors ultimately fund the instrument;
              advisers may use distribution tooling while end clients purchase the products. This multi-sided structure
              broadens addressable demand but also makes customer quality harder to score because account counts,
              participant counts, and end-user loan counts sit at different layers of the value chain and pricing logic.
