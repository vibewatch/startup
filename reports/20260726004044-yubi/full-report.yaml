      - number: '8.2'
        title: Valuation Context and Comparable Frame
        blocks:
          - type: paragraph
            body: >-
              The most defensible anchor is Yubi's own financing history, not a precision multiple exercise. Public
              reporting and trackers place the March 2022 Series B around the unicorn threshold and later commentary
              points to a roughly $1.5 billion valuation, reinforced by the founder-led capital infusion highlighted in
              2024 and additional 2025 fundraising. Comparable frames help, but none is perfect. Northern Arc is a
              listed credit platform or NBFC-style proxy whose public-market trading shows that even improving credit
              businesses can still trade below 1x forward book and single-digit forward earnings. InCred is a better
              late-stage private-market valuation reference for Indian lending infrastructure or NBFC adjacency, with
              2025-2026 reporting indicating a possible valuation around ₹15,000 crore heading into IPO. Vivriti and
              Mintifi are relevant business-model neighbors, but their public valuation surfaces were too blocked or
              sparse in this run to support precise comp math. The practical read is that Yubi deserves a premium to
              plain lenders if its workflow-infrastructure narrative is true, but probably not an unlimited premium
              while revenue quality and regulatory risk remain only partially transparent.
