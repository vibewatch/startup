      - number: '1.2'
        title: Rebrand, Product Architecture, and Group Scope
        blocks:
          - type: paragraph
            body: >-
              The June 2022 rebrand from CredAvenue to Yubi was not presented as a cosmetic rename. Moneycontrol and
              Mint both describe it as a shift toward a unified debt-infrastructure brand intended to be ubiquitous
              across the credit ecosystem and to support global expansion beginning with the UAE. At rebrand, the
              company publicly described five debt products: YubiLoans for enterprise borrowing, YubiCo.Lend for
              co-lending, YubiInvest for bond issuance and investment, YubiSCF or YubiFlow for supply-chain finance, and
              YubiPool for securitisation or structured finance. Later investor and company-adjacent descriptions expand
              the group map to Yubi, Accumn, Spocto X, YuCollect, and Aspero, which together cover origination, credit
              decisioning, fulfilment, investment distribution, and collections. Finovate's 2026 demo description and
              TVS Capital's portfolio page both reinforce that Yubi is selling infrastructure rather than a single
              narrow lending product.
