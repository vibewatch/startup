              between borrowers, lenders, investors, advisers, and service teams, so the core system likely functions as
              a control plane for onboarding, matching, policy enforcement, disbursal or settlement, and
              post-origination servicing. Public surfaces support this view in two ways. First, the Ajman Bank
              partnership explicitly names Yubi Enterprise Credit Market for corporate loans and supply-chain finance in
              a digital flow. Second, the investment-solutions announcement describes an earnings dashboard, dedicated
              relationship-manager support, digital onboarding, a branded content studio, and AI-powered goal-based
              assistance for fixed-income distributors. Together these cues imply a modular infrastructure stack rather
              than one monolithic point product. They also imply significant data-model and permissions complexity,
              because the same platform has to support institutional lenders, borrowers, distributors, and post-trade
