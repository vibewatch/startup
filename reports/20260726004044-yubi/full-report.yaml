        title: Exhibits
        blocks:
          - type: callout
            title: Yubi's addressable market is best framed as workflow share, not just debt volume share
            body: >-
              A platform can monetise origination, distribution, underwriting, settlement, and servicing even when it
              does not own the loans or bonds on balance sheet, so the relevant market is the set of debt processes that
              need coordination.
            calloutType: insight
