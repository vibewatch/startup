      - number: '4.3'
        title: Cost Structure, Unit Economics, and Capital Needs
        blocks:
          - type: paragraph
            body: >-
              Yubi appears structurally lighter than a direct lender because it does not publicly position itself as the
              principal balance-sheet risk holder across its core marketplace products, yet it is not a pure low-touch
              SaaS company either. Growth into MENA, the United States, and South or Southeast Asia, plus deeper
              investment-distribution infrastructure, compliance, and trust operations, all imply meaningful spend on
              product, integration, risk, customer success, and regional operations. If the TechStory-reported 75
              percent gross margin is directionally correct, the business may have strong software and workflow
              economics before overhead. But the same source still points to an FY25 loss, and public sources do not
              disclose CAC, payback, NRR, segment margin, implementation cost, or cash burn. The November 2025 financing
              and earlier founder infusion reduce near-term capital stress, yet part of the fresh capital was structured
