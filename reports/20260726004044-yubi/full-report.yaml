      - number: '2.3'
        title: Buyers, Users, and Budget Owners
        blocks:
          - type: paragraph
            body: >-
              The buyer map is institution-heavy and multi-sided. On one side are banks, NBFCs, and other regulated
              lenders that need origination efficiency, co-lending rails, underwriting support, securitisation exits,
              and collections tooling. On another side are corporates and MSMEs using enterprise loans, working-capital
              finance, and debt capital-market access. A third side is the investment-distribution channel: wealth
              managers, IFAs, MFDs, family offices, and eventually retail bond buyers through OBPP structures such as
              Aspero. The payer is not always the same as the end user. In co-lending and TReDS, lenders often fund the
              credit while borrowers experience the workflow; in bond distribution, advisers and platforms mediate
              access while issuers and investors ultimately carry the economics. This is attractive for Yubi because
              each side faces a trust, data, or process-friction problem. It is also challenging because adoption
              requires legal, treasury, credit, operations, and compliance teams to accept a shared workflow rather than
              a simple SaaS point solution.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
