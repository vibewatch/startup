        title: Product Scope and Module Map
        blocks:
          - type: paragraph
            body: >-
              Yubi is best understood as a debt-workflow operating layer that spans several linked products rather than
              as a single lender or retail investing app. Public rebrand and investor materials consistently describe
              five core rails: enterprise loans, co-lending, investment distribution, supply-chain finance, and pools or
              securitisation. Later company-adjacent coverage expands that map through Aspero on retail bonds and
              fixed-income distribution, plus group entities such as Accumn, Spocto X, and YuCollect for underwriting
              and collections. This breadth matters because the product promise is not just discovery of capital, but
              orchestration across onboarding, decisioning, execution, servicing, and recovery. The architectural
              trade-off is that Yubi's real product is a multi-sided operating system with several modules, making
