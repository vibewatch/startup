evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Final pricing range, cornerstone investor commitments, dilution bridge, and liquidation preference terms for the
      Hong Kong IPO.
    whyItMatters: >-
      Prevents definitive pre-money equity underwriting and determination of post-listing public market enterprise
      value.
    diligencePath: Review final SEHK prospectus publication and regulatory allotment disclosures once pricing is formalized.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Comprehensive executive committee roster, independent director appointments, and committee charters.
    whyItMatters: >-
      Public governance readiness and committee oversight structures remain partially undisclosed outside top executive
      bios.
    diligencePath: Inspect corporate governance section in formal HKEX IPO listing documents upon completion of listing hearing.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: capitalization
    missingEvidence: >-
      Full cap table capitalization breakdown detailing exact equity percentage ownership, liquidation preferences, and
      debt facilities across all financing series.
    whyItMatters: >-
      Prevents exact determination of voting control, preference overhang, and minority shareholder dilution across
      early vs late venture investors.
    diligencePath: Request shareholding registry and restructuring agreements from listing sponsors during pre-IPO diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Disaggregated market sizing isolating pure-play ACR hardware shipments from accompanying software licenses,
      structural racking, installation labor, and ongoing maintenance SLA contracts.
    whyItMatters: >-
      Third-party estimates from Frost & Sullivan bundle overall project contract values into ACR solutions TAM, making
      it difficult to isolate the recurring software and hardware replacement run-rate for standalone underwriting.
    diligencePath: >-
      Review subsequent HKEX prospectus disclosures, product catalog price lists, and customer RFP procurement schedules
      to verify standalone robot unit economics and maintenance attach rates.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-slas
    missingEvidence: >-
      Granular, itemized pricing schedules, multi-year software maintenance terms, and warranty SLA penalties across
      competing ACR and AMR vendors are not publicly disclosed.
    whyItMatters: >-
      Without contractual pricing transparency, direct Total Cost of Ownership (TCO) comparisons between HaiPick systems
      and alternative goods-to-person automation remain sensitive to unverified sales discounts.
    diligencePath: >-
      Request customer procurement RFP bid sheets, master service agreements, and vendor pricing proposals under
      non-disclosure during technical diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: recurring-revenue-and-nrr
    missingEvidence: >-
      Clean breakout of recurring software subscription licenses, annual maintenance contract retention (GRR/NRR), and
      warranty economics.
    whyItMatters: >-
      Without recurring revenue visibility, long-term customer lifetime value (LTV) cannot be separated from one-time
      project delivery.
    diligencePath: Review prospectus annexes or underwriter analyst models for cohort-level repeat purchasing and SLA renewal rates.
    relatedQuestionRefs:
      - QI001
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: minor
    topic: headcount-reconciliation
    missingEvidence: >-
      Reconciliation between Revelio Labs global estimate of 2,668 staff and regional corporate directory snapshots
      (e.g. LeadIQ 501-1000).
    whyItMatters: Staffing figures drive sales productivity and R&D capital intensity calculations.
    diligencePath: >-
      Obtain official prospectus headcount table detailing regional and functional division as of the latest practicable
      date.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: firmware-and-software-architecture
    missingEvidence: >-
      Detailed technical architecture documentation on HaiQ fleet scheduling algorithms, real-time wireless latency
      thresholds, and API protocols connecting robots to third-party WMS/WES platforms.
    whyItMatters: >-
      System stability in ultra-dense 100+ robot deployments depends heavily on wireless packet drop resilience and
