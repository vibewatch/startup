callouts:
  - calloutType: insight
    title: "Category Creation vs. Long-Term Delivery Weight"
    body: "Hai Robotics pioneered the autonomous case-handling robotics category and commands over 30% global market share in ACR picking systems. However, warehouse automation remains fundamentally an infrastructure deployment business rather than a pure software sale: system acceptance, on-site commissioning, and multi-year project management dictate revenue realization and cash conversion."
    claimRefs:
      - CM001
      - CM006
      - CM010
  - calloutType: risk
    title: "Domestic Price Wars Drive Overseas Margin Reliance"
    body: "Fierce domestic competition among hundreds of Chinese warehouse robotics vendors has compressed mainland gross margins. While expanding into international markets yields gross margins above 40%, it introduces substantial overhead for overseas sales channels, local system integrators, and global field support infrastructure."
    claimRefs:
      - CM011
      - CM012
      - CM013
