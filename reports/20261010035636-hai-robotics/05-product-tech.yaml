callouts:
  - calloutType: strength
    title: Commercial Scalability of the HaiPick Climb Architecture
    body: Hai Robotics has validated the commercial appeal of its climbing robot architecture, scaling HaiPick Climb to over 10,000 units deployed globally and generating 13.3% of 1H2026 revenue ($20.69M) with premium gross margins, providing a flexible alternative to rigid AS/RS systems.
    claimRefs:
      - CE006
      - CE007
  - calloutType: risk
    title: Manufacturing Concentration and Geopolitical Supply Chain Vulnerability
    body: Core robotic manufacturing remains concentrated in Chinese facilities (Dongguan and Yancheng), exposing the business to cumulative Section 301 tariffs reaching up to 37.5% in the United States and driving capital expenditures toward establishing local assembly footprints abroad.
    claimRefs:
      - CE010
      - CE011
