chapter:
  number: 5
  title: Product & Technology
  summary: Hai Robotics delivers modular Automated Case-handling Mobile Robot (ACR) and climbing robot systems designed for high-density goods-to-person warehouse intralogistics. Its core hardware architecture spans the legacy HaiPick System 1 through the high-density HaiPick System 3 and rack-climbing HaiPick Climb, coordinated by proprietary software, an in-house PSIRT security framework, and expanding OEM/channel integration partnerships.
sections:
  - id: product-overview-workflow
    title: Product Line Architecture and Warehouse Workflow
    body: >
      Hai Robotics develops autonomous case-handling mobile robots (ACRs) and specialized automated storage and retrieval systems (ASRS) engineered to transform manual carton and tote handling into high-density goods-to-person (G2P) automation. Rather than transporting entire heavy racking structures like traditional Kiva-style autonomous mobile robots or relying on rigid floor-bolted grid rails like classic automated storage and retrieval shuttles, HaiPick robots navigate open warehouse floor layouts while extending vertical telescopic extractors up to 10 meters into standard industrial shelving. The company's hardware portfolio has evolved across four distinct architectural generations, transitioning from single-deep container picking to multi-deep consolidation and rack-climbing mobility. HaiPick System 1 established the baseline Autonomous Case-handling Mobile Robot concept using telescopic mast robots, followed by HaiPick System 2, HaiPick System 3 for higher density operations, and the recently commercialized HaiPick Climb rack-climbing robotic system. In a typical customer order fulfillment workflow, the system receives outbound orders, orchestrates robotic routing, autonomously retrieves designated totes or cartons from double-deep or tall vertical racking, and delivers inventory directly to ergonomic pick stations or conveyor integration loops, substantially reducing human walking travel and accelerating fulfillment velocity.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
  - id: modular-offerings-use-cases
    title: Modular System Generations and Operational Use Cases
    body: >
      The commercial maturity of the HaiPick portfolio reflects a multi-generation platform strategy addressing diverse facility profiles across apparel, e-commerce, third-party logistics (3PL), and manufacturing intralogistics. While legacy HaiPick System 1 deployments historically represented the vast majority of revenue, customer adoption has shifted rapidly toward advanced generations. HaiPick System 3 emerged as the principal revenue contributor in FY2025 and 1H2026, delivering optimized storage density, while the high-margin HaiPick Climb system reached significant commercial deployment scale with over 10,000 climbing robots deployed across worldwide projects. Operational use cases span e-commerce omnichannel fulfillment, where rapid promotional order surges demand high-throughput tote retrieval, to 3PL and fast-fashion distribution, where seasonal SKU volatility and compact facility footprints necessitate vertical space optimization up to 10 meters. Key operational trade-offs center on floor levelness and facility ceiling clearance, as well as capital expenditure considerations compared to low-cost autonomous carts or permanent ultra-dense grid automation.
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
    tableRefs:
      - TE002
    figureRefs:
      - FE001
  - id: manufacturing-integrations-security
    title: Manufacturing Footprint, Integration Partnerships, and Governance Controls
    body: >
      Hai Robotics executes a hybrid manufacturing and partner-led delivery model supported by a 566-person internal research and development organization and 2,495 global patent filings. Robotic assembly and integration take place primarily across specialized Chinese manufacturing facilities, including the leased Dongguan plant and the recently commissioned Yancheng facility, complemented by selected external OEM/ODM manufacturing partners. To accelerate overseas deployment across North American and European distribution networks, the company increasingly relies on certified systems integrators, including formal integration agreements with Dematic, Maveneer, and global material handling providers. Software orchestration and fleet management integrate with enterprise warehouse management systems (WMS) and warehouse execution systems (WES). In response to international infrastructure scrutiny and mission-critical customer reliability requirements, Hai Robotics maintains an internal Product Security Incident Response Team (PSIRT) that actively coordinates vulnerability assessments, CVSS impact scoring, and responsible security disclosures, although public security advisories remain limited to date.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
    tableRefs:
      - TE003
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / Product Line
      - Target User / Workflow Role
      - Status / Maturity
      - Key Technical Differentiation
      - Diligence Gap
    rows:
      - - HaiPick System 1 (A42 Series)
        - Warehouse operators handling standard carton/tote retrieval
        - Mature / legacy core; represented 92.8% of FY2023 revenue, contracting to 29.7% in 1H2026
        - Pioneered autonomous case-handling mobile robot (ACR) category; telescopic mast reaching up to 10m
        - Exact hardware end-of-life schedule and long-term legacy maintenance cost structure
      - - HaiPick System 2
        - Specialized distribution centers needing double-deep case picking
        - Commercialized / niche tier; generated 2.1% of 1H2026 revenue ($3.33M)
        - Extended reach mechanisms for double-deep carton extraction without full grid infrastructure
        - Granular margin breakdown and customer migration roadmap to System 3
      - - HaiPick System 3
        - High-density e-commerce and retail fulfillment distribution centers
        - Scaled commercial core; generated 54.3% of 1H2026 revenue ($84.43M)
        - High-density multi-case handling, dynamic tote sequencing, and flexible brownfield fit
        - Proprietary versus third-party software orchestration boundaries in large-scale deployments
      - - HaiPick Climb
        - High-throughput omnichannel facilities and ultra-dense vertical warehouses
        - Rapidly commercializing; reached 13.3% of 1H2026 revenue with >10,000 robots deployed
        - Innovative rack-climbing mobility eliminating dedicated external vertical lift infrastructure
        - Track wear rates, climbing motor MTBF, and long-term mechanical maintenance costs under high duty cycles
    notes: "Product revenue attribution, commercial maturity, and system deployment metrics reflect official HKEX IPO prospectus data audited by HDIN Research and company disclosures."
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE014
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow Baseline
      - Hai Robotics Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Omnichannel E-Commerce Fulfillment
        - Manual cart picking across expansive multi-tier shelving mezzanines
        - HaiPick System 3 autonomous case retrieval delivering totes directly to picking stations
        - 3x to 4x efficiency improvement, up to 75% storage footprint reduction, and 99%+ order accuracy
        - Requires certified floor levelness and standard tote dimensions; cannot pick loose odd-sized items directly
      - - Fast-Fashion High-Density Storage
        - Static pallet racking and narrow-aisle forklifts with extensive travel latency
        - HaiPick Climb rack-climbing robots navigating vertical racking up to 10 meters
        - Up to 250% to 300% storage density increase; rapid SKU turnaround during sales spikes
        - High vertical racking structural tolerances required; mechanical maintenance increases with climbing cycles
      - - 3PL Multi-Tenant Warehousing
        - Fixed heavy AS/RS cranes requiring 10-year facility commitments
        - Modular HaiPick mobile robot fleets integrated with partner WxS/WES software
        - Rapid 3 to 6 month commissioning and asset portability between contracted facilities
        - Dependent on external systems integrator software orchestration and facility network connectivity
    notes: "Performance metrics reflect customer case studies, official marketing disclosures, and industry benchmarking."
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE008
      - CE013
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Operational Role
      - Underlying Dependency
      - Technical / Execution Risk
    rows:
      - - Mobile Robotic Chassis & Mast
        - Structural platform and vertical case extraction mechanism
        - Precision mechanical components, chassis structural parts (61% BOM), and battery systems
        - Component supply chain disruption and mechanical wear under continuous multi-shift operations
      - - Motion, Control & Perception
        - Autonomous navigation, obstacle avoidance, and precise tote picking
        - Embedded motion controllers (15% BOM), control system (10% BOM), and perception sensors (7% BOM)
        - Sensor calibration drift in dusty environments and optical sensor blinding from warehouse glare
      - - Fleet Coordination & WxS
        - Task allocation, dynamic routing, and integration with customer WMS
        - Centralized software scheduling algorithms and certified partner orchestration platforms (e.g. Maveneer WxS)
        - Software integration friction with legacy enterprise systems and network latency during peak robot density
      - - Manufacturing & Testing
        - Production, sub-assembly integration, and quality assurance
        - Leased Dongguan plant and commissioned Yancheng plant (84% utilization), plus external OEM/ODMs
        - Cross-border manufacturing exposure, import tariffs (Section 301 up to 37.5%), and factory consolidation risks
    notes: "BOM distribution, manufacturing utilization, and system dependencies sourced from audited IPO filings and technical specifications."
    claimRefs:
      - CE002
      - CE010
      - CE011
      - CE012
      - CE013
