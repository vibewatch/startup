callouts:
  - calloutType: "insight"
    title: "Architectural Differentiation: The Bin-Level Vertical Wedge"
    body: "Hai Robotics carved out its competitive wedge by rejecting the standard shelf-moving AMR paradigm in favor of rack-climbing case-handling robots. By accessing individual bins up to 12 meters in height rather than hauling entire racks across open warehouse floors, Hai delivers up to 75% storage footprint reductions and 4x efficiency gains for high-SKU omnichannel facilities."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP007"
  - calloutType: "risk"
    title: "Erosion of Technological Lead and Emerging Price Pressures"
    body: "The historical moat established by Hai Robotics as a first mover in ACR technology is facing natural commoditization. As Asian competitors like Geekplus secure public capital and develop competing tote-handling robots, buyer conversations are shifting from technical novelty to price per pick, deployment timeline guarantees, and channel partner execution."
    claimRefs:
      - "CP003"
      - "CP014"
      - "CP015"
