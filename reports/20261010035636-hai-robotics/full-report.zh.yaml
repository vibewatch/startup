      - number: '4.3'
        title: 营运资金优势、现金消耗与 IPO 前偿付能力缺口
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 受益于结构性负营运资金周期：客户预付款加上 193 天的应付账款周转天数，使 2026 年上半年现金转换周期达到 -148 天；供应链高度分散，前五大供应商仅占采购总额 16.5%
              [CI007]。存货周转天数从 2023 年的 311 天改善至 2026 年上半年的 207 天 [CI007]。但营运资金改善并未止住经营现金消耗，也未带来净盈利 [CI008]。2023 年至 2026
              年上半年累计净亏损达到 RMB 3.523 billion；尽管收入增长 70.2%，2026 年上半年净亏损 RMB 431 million，仅较 2025 年上半年的 RMB 441 million
              亏损小幅改善（收窄 -2.4%）[CI008]。2026 年上半年经营现金流出恶化至 -RMB 360 million（2025 年上半年为 -RMB 289 million），融资现金转为净流出（-RMB 36
              million），六个月内现金储备减少 RMB 552 million 至 RMB 1.417 billion [CI008]。截至 June 30, 2026，优先股赎回负债达到 RMB 5.254
              billion，仅 2026 年上半年就产生 RMB 198 million 的非现金应计利息费用（占收入 17.7%），净负债为 RMB 4.371 billion
              [CI009]。员工人数估算在企业一手劳动力情报（2026 年 3 月工程和运营部门全球员工 2,668 人）与目录快照之间差异很大，而单位层面的经常性 SLA 留存率仍属私有信息 [CI010, CI011,
              CI012, CI013, CI014, CI015]。
