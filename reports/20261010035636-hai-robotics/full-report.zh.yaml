      - CR011
      - CR012
  - id: TR003
    title: 合作方／依赖风险登记表
    columns:
      - 依赖项
      - 交易对手方
      - 角色
      - 集中度
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余风险敞口
    rows:
      - - 核心客户需求
        - 前五大企业客户
        - 直接采购仓储拣选方案的客户
        - 2026 年上半年收入的 50.3%
        - 订单延期、转为自营，或转向竞争对手 ACR 供应商
        - 高
        - 覆盖服装、零售和电子行业的地域与行业多元化
        - 较大；失去一个锚定客户就会实质性影响收入增长
      - - 系统集成商与渠道中间商
        - 全球渠道合作伙伴（例如 FORTNA）
        - 方案营销、集成和交付
        - 2026 年上半年收入的 58.6%
        - 渠道合作伙伴优先推广竞争对手的自动化仓储供应商，或管理客户交付不善
        - 高
        - 全球合作伙伴认证、联合工程开发和模块化 HaiPick Climb 架构
        - 直接定价能力下降，并依赖中间商关系的健康度
      - - 海外毛利率依赖
        - 国际部署客户
        - 高毛利地域收入基础
        - 2026 年上半年收入的 50.2%
        - 关税、贸易摩擦或监管阻力压缩超过 40% 的海外毛利
        - 高
        - 槟城制造中心在中国大陆以外建立本地组装布局
        - 易受西方地缘政治贸易政策变化或本地化内容要求影响
      - - 零部件供应商集中度
        - 前五大材料供应商
        - 核心机器人底盘和电子零部件供应商
        - 2026 年上半年采购额的 14.1%
        - 供应商配额上限，或精密传动组件成本上涨
        - 中等
        - 扩大采购基础，并签订长期供应框架合同
        - 可控，因为前五大供应商集中度已从 2024 年的 19.0% 降至 2026 年上半年的 14.1%
    notes: 检视商业、合作方和供应交易对手方的关键风险敞口；集中度数据取自港交所申报文件中的历史披露。
