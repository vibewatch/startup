      - number: '1.2'
        title: 创始人、管理层与治理架构
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 的管理层由创始人兼 CEO Richie Chen 主导。Chen 毕业于香港理工大学电子工程专业，早期对物流设施的现场研究奠定了 HaiPick
              系统的核心架构。他同时掌舵公司的战略和技术，是典型的技术型创始人兼经营者。为加快国际商业化并应对西方企业销售周期，公司引入了经验丰富的区域高管；例如，2025 年 8 月任命自动化物流老将 Adrian
              Stoch 为美洲 CEO。联合创始人 Bing Fang 和 Shengdong Xu
              历来分别负责硬件工程和软件算法协同，让机械箱式搬运机构与实时车队调度紧密配合。香港上市计划推进之际，公司治理正向公开市场标准靠拢，但核心产品路线和战略投资者关系仍高度依赖 Richie
              Chen。独立董事监督和正式委员会章程仍是持续尽调的重点。
            claimRefs:
              - CO002
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
              - CO007
      - number: '1.3'
        title: 资本化历程、估值轨迹与投资者阵容
        blocks:
          - type: paragraph
            body: >-
              为支持激进的产品开发、海外子公司设立和制造扩张，Hai Robotics 通过多轮融资获得了大量机构资本。2019 至 2022 年，公司连续完成融资；2021 年 9 月连续完成 C 轮和 D 轮注资，金额超过
              $200 million，随后在 2022 年 6 月完成超过 $100 million 的 D+ 轮融资。投资者阵容包括全球和国内一线私募股权及风险投资机构，Capital Today 和 5Y Capital
              领投，Source Code Capital、Sequoia Capital China (HongShan)、01VC、Walden International 和 Legend Star
              持续参与。风险投资数据库估算，D+ 轮交易后公司投后股权估值约为 $2.0 billion。二级市场上，私募股权曾通过 Clarity 和 Hiive
              等平台间歇性交易，但没有持续公开报价。虽然这条融资轨迹为全球扩张提供了有力的资产负债表支持，历史融资条款、优先权层级和股东协议仍待最终 IPO 前文件确认。
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO014
