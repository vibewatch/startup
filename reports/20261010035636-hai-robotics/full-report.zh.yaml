      - number: '8.4'
        title: 下行触发因素、治理与尽调要求
        blocks:
          - type: paragraph
            body: >-
              投资人在投入资金前，必须密切关注几项可能击穿投资论点的触发因素和治理脆弱点。首要下行触发因素，是管理投资人赎回权的 18
              个月上市窗口被延长或未能按期完成，这会迫使公司立即应对现金索取。运营层面，公司近年超过一半的收入依赖第三方系统集成商， 这既带来中间渠道风险，也使公司与直接客户保持距离。此外，2025
              年底子公司现场发生、但未公开披露的致命工作场所事故， 暴露出公司进一步进入严格西方企业供应链时可能面临的 ESG 和安全合规障碍。尽调应重点审阅未经删节的 HKEX 招股书补充文件，
              核实国际市场毛利率的稳定性，审计 2026 年经营现金流走势，并确认盐城和槟城新增产能能转化为正向的单位层面经营杠杆，而不是 变成闲置的固定开支。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.5'
        title: 证据材料
        blocks:
          - type: callout
            title: 估值立场：等待 IPO 定价发现，维持 Track
            body: >-
              Hai Robotics 在自主箱式搬运机器人领域保持令人印象深刻的领先地位，全球已部署超过 1,700 套系统；但按此前 $2 billion
              估值参与私募二级交易，风险回报仍不划算。投资人应等待香港公开发行建立透明的市场定价，并将类似债务的赎回负债转换为股权。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
          - type: callout
            title: 结构性资本风险：5.2 billion yuan 赎回倒计时
            body: >-
              核心投资风险在于投资人赎回权的倒计时。截至 2026 年年中，赎回负债已超过 RMB 5.2 billion，而现金储备约为 RMB 1.4 billion； 如果香港 IPO
              明显延迟或未能完成，就会造成迫在眉睫的偿付能力风险，压过公司底层技术领先地位。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
