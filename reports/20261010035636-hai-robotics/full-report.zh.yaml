  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本结构、债务赎回倒计时与流动性约束
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 的核心风险在于资本结构和历史估值调整机制带来的资产负债表及流动性压力。早期机构融资赋予投资者强制赎回权，到 2026 年中扩大至超过 5.2 billion yuan。若公司未能在 18
              个月里程碑窗口内完成合资格香港 IPO，投资者有合同权利要求立即现金回购。由于 2026 年中公司现金储备约为 1.4 billion yuan，这一赎回压力形成严重结构性脆弱点：在非 IPO
              情景下，资金缺口将达到数十亿元。因此，计划中的上市更像强制性的债转股重组，而非完全自主的融资。持续经营亏损进一步加剧资产负债表压力。公司 2023 年、2024 年、2025 年和截至 June 30, 2026
              的六个月净亏损分别为 RMB1,009.0 million、RMB1,255.7 million、RMB827.5 million 和 RMB430.9 million，累计亏损超过 RMB3.52
              billion。整个业绩记录期经营现金流持续为负，现金流出分别为 RMB482.2 million、RMB195.7 million、RMB34.3 million 和 2026 年上半年的 RMB359.8
              million。截至 June 30, 2026，净流动负债达到 RMB4,378.4 million，总净负债为 RMB4,371.0
              million。此外，公司采用加权投票权（WVR）结构，使创始人投票控制权高于其股权比例，并在治理争议中令公众股东处于从属地位。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
      - number: '7.2'
        title: 监管合规、劳动缴费与法律责任
        blocks:
          - type: paragraph
            body: >-
              监管与合规风险涵盖国内雇佣义务、跨境数据安全要求和国际知识产权防御。在中国大陆，Hai Robotics
              过去通过采用低于法定月平均工资的缴费基数，少缴部分员工的社会保险和住房公积金。根据中国劳动法规，主管机关可以要求全额追溯整改，并处以每日 0.05%
              的滞纳金，以及相当于欠缴差额一至三倍的法定罚款。尽管公司中国法律顾问认为，在没有员工投诉的情况下主动行政执法的可能性较低，最高人民法院仍于 July 31, 2025
              发布《关于审理劳动争议案件适用法律问题的解释（二）》，使雇佣双方的缴费豁免协议失效。劳动争议申报增加可能触发重大追溯现金流出。全球范围内，仓储部署扩展至欧洲和美国，使公司暴露于严格的数据保护制度，包括欧盟《通用数据保护条例》（GDPR）及监管仓库传感器和遥测数据的州级隐私法规。Hai
              Robotics 已建立庞大的专利组合，截至 June 30, 2026 全球专利申请 2,495 项（其中中国 1,178 项、海外司法辖区 1,166
              项），                            并已彻底解决历史侵权索赔；但进入成熟物流市场仍面临专利无效挑战、竞争者诉讼和非实施实体提出的法律主张等持续风险，可能限制商业分销。
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: 运营执行、工作场所安全与制造韧性
        blocks:
          - type: paragraph
            body: >-
              运营可靠性和工作场所安全，是企业客户采用仓储系统时的关键门槛。在往绩期间，Hai Robotics 一家子公司涉及上海一处项目实施现场的致命工作场所事故，该现场由第三方终端客户运营。事故造成 1 人死亡、1
              人受伤， 当地安全监管部门因此对该子公司处以 RMB600,000 行政罚款。公司虽已加强内部控制并完成安全整改，但这起事故暴露出现场
              机器人安装、重物搬运和窄巷道系统调试所固有的执行风险。安全事故会带来严重声誉风险，使公司失去竞争性企业采购招标资格， 也可能被 ESG
              筛选严格的全球供应链排除。为提升制造能力、降低地缘政治带来的运输脆弱性，Hai Robotics 在中国盐城和 马来西亚槟城新建两座工厂，将 HaiPick
              系统产能提升至原来的十倍。但多工厂协同也会带来供应链执行风险，尤其是专用 光学传感器、精密控制器和半导体模块；这些部件一旦交付延迟，就可能拖慢部署里程碑。在软件端，Hai Robotics 设有产品
              安全事件响应团队（PSIRT），执行 24 小时评估标准，迄今未发布任何公开公告；但联网仓储车队管理软件仍可能因企业网络 中断而出现运营停机。
            claimRefs:
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR011
              - CR012
      - number: '7.4'
        title: 客户集中度、渠道中间商与利润率动态
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 的商业结构显示，收入正同时向大型企业客户账户和间接渠道合作伙伴集中。公司五大客户贡献的收入占比从 2023 年 的 32.1%、2024 年的 36.7%、2025 年的
              43.2%，升至截至 2026 年 6 月 30 日六个月的 50.3%。这一上升趋势意味着， 零售和电商领域的核心客户一旦削减预算、推迟资本开支或更换供应商，公司营收就会高度承压。与此同时，公司越来越依赖
              第三方系统集成商和分销商来扩大部署规模。渠道合作伙伴销售额占收入的比例从 2023 年的 36.3% 和 2024 年的 39.5%，升至 2026 年上半年的 58.6%。与 FORTNA
              等成熟物流集成商合作，确实能加快 HaiPick Climb 在北美和欧洲设施中的部署；但对 中间商的高度依赖会削弱直接客户关系、引发渠道冲突，并稀释软件定价权。从地域看，Hai Robotics
              依靠国际市场守住毛利率。 2026 年上半年，非中国市场贡献了 50.2% 的收入，毛利率超过 40%；中国内地市场则面临激烈价格竞争，毛利率更低。海外
              渠道执行受阻或国际贸易壁垒加剧，都会直接威胁公司的整体盈利能力。
            claimRefs:
              - CR006
              - CR007
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
