        - 高
        - 本地网络固件故障时仓库分拣会暂时停摆
        - 第三方渗透测试报告和 SLA 正常运行时间保证属于非公开资料
    notes: 评估制造和仓库部署环节的物理、技术及供应链失效模式；缓释措施反映已披露的运营规程。
    claimRefs:
