              - CM005
              - CM006
      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              自主箱式搬运机器人系统主要由高吞吐量物流运营商采购，这些运营商 SKU
              数量多，季节性需求波动大。主要客户包括第三方物流（3PL）服务商、全渠道电商零售商、鞋服企业、消费电子制造商以及医疗和医药分销商。企业买方委员会通常由供应链副总裁或首席物流官，与仓库总经理、设施履约负责人组成；前者掌管资本开支预算和运营转型要求，后者评估日拣选吞吐量、平均无故障时间和软件调度可靠性。公司披露的重点企业客户包括
              Anta、Xtep、Bosideng 等服装品牌，Lenovo、Philips 等跨国科技公司，以及 SF Express、SF-DHL
              等物流巨头。客户留存仍然强劲：随着设施扩建，客户会在既有软件部署中追加机器人，客户复购率达到 89%。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: 采用驱动因素、结构性执行约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              货到人 ACR
              系统的采用主要由严重的劳动力短缺、时薪上涨，以及在商业地产租金高企时提升现有仓库垂直空间利用率的需求驱动。但资本密集度、较长的实施周期和项目集成复杂度限制了采用速度。部署仓储机器人需要大量现场安装、仓库管理系统（WMS）API
              集成和客户验收，收入确认周期往往因此延长至六至十二个月。与此同时，中国数百家移动机器人厂商之间的激烈价格战压缩了大陆毛利率，迫使 Hai Robotics 大举转向海外市场；海外毛利率超过 40%，并贡献了
              2026 年上半年超过 50%
              的收入。更关键的是，超过一半的项目收入通过第三方系统集成商而非直接合同实现，削弱了直接定价控制力。一个核心投资判断缺口是：公司没有分拆披露纯机器人硬件出货与配套结构货架、定制工程和持续维护服务收入。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 品类创造与长期交付权重
            body: >-
              Hai Robotics 开创了自主箱式搬运机器人品类，在 ACR 拣选系统中占有超过 30%
              的全球市场份额。但仓储自动化本质上仍是基础设施部署生意，而不是纯软件销售：系统验收、现场调试和多年项目管理决定收入实现与现金转换。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM010
          - type: callout
            title: 国内价格战推高对海外利润率的依赖
            body: 中国数百家仓储机器人厂商之间的激烈竞争压缩了大陆毛利率。拓展海外市场虽可带来超过 40% 的毛利率，却也增加了海外销售渠道、当地系统集成商和全球现场支持基础设施的运营开销。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与架构分类
        blocks:
          - type: paragraph
            body: >-
              全球仓储自动化生态由多种库存存储和订单履约架构构成。Hai Robotics 2016 年成立时，主流移动机器人范式是搬货架的自动移动机器人（AMR），把整套立体货架在开放地面上运送给固定拣选员
              [CP002]。Hai Robotics 则另辟蹊径，开发能在窄巷道行驶、攀爬立体货架并取出标准料箱和纸箱的自主箱式搬运机器人（ACR）[CP001]。这一架构差异帮助公司在 2024 年取得 ACR
              细分市场超过 30% 的全球份额，并与数百家仓储机器人同行竞争 [CP001, CP015]。如今竞争者包括 Geekplus、GreyOrange、Addverb
              等直接机器人同行，传统固定基础设施自动存取系统（AS/RS）厂商、自动叉车供应商和传统人工推车拣选业务 [CP014, CP015]。Geekplus
              等直接竞争者已在香港交易所上市，同行机器人厂商的资本获取能力趋于接近，行业也从技术新奇物转为高度拥挤的商业赛道 [CP014]。
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
              - CP013
      - number: '3.2'
        title: 技术能力与垂直差异化
        blocks:
          - type: paragraph
            body: >-
              随着全渠道零售挤压运营利润，仓储履约中心的差异化越来越取决于密度和适应性 [CP006]。传统供应链把电商订单、零售补货和逆向物流分隔管理，现代设施则必须用统一库存池处理波动的多渠道流量 [CP006]。Hai
              Robotics 因此开发 HaiPick Climb，可攀爬最高 12 米的货架，额定取料速度达到每小时 4,000 个料箱 [CP007]。HaiPick System 3
              采用双机器人履约机制，将垂直箱式搬运 ACR 与水平运输解耦，并以最高每秒 4 米运行的 Companion AMR 将容器运到工作站，以应对高吞吐量限制 [CP008]。为满足受监管企业的 IT
              治理和运营技术安全要求，Hai Robotics 于 2026 年 4 月取得 IEC 62443-4-1 工业网络安全认证，并设有专门的产品安全事件响应团队（PSIRT），在 24 小时内评估漏洞披露
              [CP010, CP012]。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: 商业打包、定价与经济取舍
        blocks:
          - type: paragraph
            body: >-
              货到人自动化的商业评估在前期资本强度、部署灵活性和运营风险之间存在明显取舍。Hai Robotics 不要求物流运营商一次性承诺数百万美元的整体固定基础设施 AS/RS
              投资，而是将方案拆成模块化、分阶段投资，让设施先自动化单个作业区，再逐步扩张 [CP011]。八个客户将最初的 HaiPick Climb
              系统扩展到后续设施，证明了这种分阶段部署既能降低中断风险，也能带来重复资本投入 [CP005]。分销和交付主要依托全球战略系统集成合作，包括与 TGW Logistics、Maveneer、LX Pantos
              的联盟；HaiPick 硬件作为核心引擎嵌入 TGW LivePick 等集成系统
              [CP009]。但随着同行机器人厂商寻求上市并把新资本投入国际物流枢纽，商业谈判越来越集中在单价让利、延长保修条款和激进的部署保证上 [CP003]。
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP011
