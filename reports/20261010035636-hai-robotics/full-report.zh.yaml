      - number: '3.4'
        title: 护城河持久性与商品化风险
        blocks:
          - type: paragraph
            body: >-
              评估 Hai Robotics 的长期护城河，需要在早期品类领先与激烈的商品化压力之间权衡。全球项目签约超过 10,000 台 HaiPick Climb 机器人，证明公司已有运营牵引力和集成成熟度
              [CP004]。此外，ACR 网格一旦装进客户设施，机械切换成本、定制货架集成和停机损失都会形成真实的客户锁定
              [CP001]。但结构性护城河风险仍然突出：首先，资金充足的国内外竞争者正在开发类似的爬升和双机器人系统，箱式搬运的知识产权与机械设计面临复制风险 [CP003, CP015]；其次，Geekplus
              等已获公开资本支持的竞争者具备多年价格战的资产负债表能力，尤其是在历史毛利率更高的海外市场 [CP003, CP014]。因此，Hai Robotics
              的竞争持久性将取决于持续的软件编排表现、全球集成商协同和可靠的全生命周期服务执行，而不只是硬件规格 [CP003]。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 架构差异化：箱级垂直切入点
            body: >-
              Hai Robotics 放弃标准的搬货架 AMR 范式，转而采用爬架式箱式搬运机器人，建立了自己的竞争切入点。相比把整套货架拖过开放仓库地面，Hai 可取出最高 12 米处的单个料箱，为 SKU
              众多的全渠道设施减少最高 75% 的存储占地，并实现 4x 效率提升。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: 技术领先优势减弱与新出现的价格压力
            body: >-
              Hai Robotics 作为 ACR 技术先行者建立的历史护城河正自然走向商品化。随着 Geekplus
              等亚洲竞争者获得公开资本并开发竞品料箱机器人，买方讨论正从技术新奇性转向每次拣选价格、部署进度保证和渠道合作伙伴执行力。
            calloutType: risk
            claimRefs:
              - CP003
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与产品线结构
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 通过交钥匙、按项目部署的模式实现仓储自动化收入，而不是依靠经常性软件订阅 [CI001]。完整部署包括三大核心组件：HaiPick 或 HaiClimber
              机器人本体、HaiStation 取放工作站，以及自有 HaiQ 智能仓储执行管理平台，并配套精密货架、充电站和潜在的自动移动机器人
              [CI001]。客户主要是服装品牌、电商零售商、第三方物流（3PL）运营商和离散制造企业，需预先投入资本购买整套系统 [CI001]。Hai Robotics
              负责从设施设计、硬件交付和安装到软件调试的端到端流程，收入确认严格以客户正式里程碑验收为准 [CI001]。后续生命周期收入包括维护合同、备件、软件升级 / 订阅和既有仓库扩容
              [CI001]。不同硬件代际的商业轨迹变化很快：老款 HPS1 占总收入的比重从 2023 年的 92.8%（RMB 748 million）降至 2025 年的 35.5%（RMB 716
              million），并降至 2026 年上半年的 29.7%（RMB 332 million）[CI002]。旗舰 HPS3 则成为主要增长引擎，2025 年收入 RMB 1.135 billion（占收入
              56.3%），2026 年上半年收入 RMB 607 million（占 54.3%）[CI002]。2025 年商业化、支持 15 米货架的 Climb 系列，2025 年收入增至 RMB 136
              million（6.7%），2026 年上半年增至 RMB 149 million（13.3%）；HPS2 则缩至微不足道的规模（占 2026 年上半年收入 2.1%）[CI002]。
            claimRefs:
              - CI001
              - CI002
