            body: >
              Hai Robotics 采用混合制造与合作伙伴交付模式，背后是 566 人的内部研发团队和 2,495
              项全球专利申请。机器人组装和集成主要在中国专用制造设施完成，包括租赁的东莞工厂和近期投产的盐城工厂，并辅以精选 OEM/ODM 制造伙伴。为加快北美和欧洲分销网络的海外部署，公司越来越依赖认证系统集成商，包括与
              Dematic、Maveneer 及全球物料搬运供应商签署正式集成协议。软件编排和车队管理可接入企业仓库管理系统（WMS）及仓库执行系统（WES）。面对国际基础设施审查和关键任务客户的可靠性要求，Hai
              Robotics 设有内部产品安全事件响应团队（PSIRT），负责协调漏洞评估、CVSS 影响评分和负责任的安全披露，但截至目前公开安全公告仍然有限。
