      - number: '6.4'
        title: 客户生命周期、留存韧性与渠道集中度
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 初始部署牵引力强，但客户留存韧性、渠道依赖和回款动态存在重大结构性风险。公司近期超过 50%
              的商业收入通过第三方系统集成商和物流伙伴流入，而非来自直接企业客户。依赖渠道中间商能加快进入欧洲和美洲市场，却同时削弱直接定价能力和终端客户关系掌控，并让毛利率暴露于伙伴让利要求。独立分析还显示，新签客户项目的速度已放缓，迫使公司更多从存量客户争取更大的扩容合同。商业模式资本密集，并容易受到客户里程碑验收延迟影响，因为运营依赖客户预付款和延长供应商应付账款。更关键的是，公开披露没有提供经审计的客户群留存表，如净收入留存率（NRR）和毛收入留存率（GRR），多年经常性软件与维护收入的韧性仍是核心尽调问题。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
