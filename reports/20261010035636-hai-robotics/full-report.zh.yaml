      - number: '8.2'
        title: 资本结构、历史融资轮与估值背景
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 的历史资本结构体现出六轮融资带来的大规模风险投资支持，总额为 $215 million；其中 2022 年 6 月的 $100 million Series D
              融资最为突出，该轮将公司投后估值定为 $2 billion。历史投资人包括 Capital Today、5Y Capital、Source Code Capital、 01VC 和 HSG。公司收入从 2023
              年的 807 million yuan 快速增长至 2024 年的 1.36 billion yuan，并在 2025 年前九个月达到 1.26 billion
              yuan。但持续高企的销售及分销费用拖累经营表现，2023 年、2024 年和 2025 年前九个月的净亏损分别为 1.00 billion yuan、1.26 billion yuan 和 589
              million yuan。随着总负债升至 3.88 billion yuan、赎回负债在 2026 年年中 达到 5.2 billion
              yuan，公司必须尽快完成香港公开发行，将可赎回股份转换为股权，避免资产负债表陷入严重困境。
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景投资判断与可比倍数
        blocks:
          - type: paragraph
            body: >-
              情景投资判断根据公开市场反应和流动性兑现时间，展示投资人回报的三条路径。乐观情景假设香港上市成功、赎回债务转为股权， 同时收入每年增长超过 35%，公司按 5x 至 6x 的远期倍数达到 $2.5 billion
              至 $3.0 billion 的估值。基准情景的概率为 50%，假设公司以更克制的 $1.5 billion 至 $1.8 billion 估值上市，相当于收入的 3.5x 至 4.5x；稳定的国际部署将抵消
              中国内地激烈的价格竞争。悲观情景假设 IPO 执行停滞，估值大幅跌破 $800 million，投资人提出现金赎回回购要求，现有 1.4 billion yuan 现金储备将不堪重负。香港联交所仓储机器人同行
              Geekplus 的公开市场表现——股价稳定在 HK$16.80 发行价上方约 50%——印证了公众投资人对该领域的兴趣，但也凸显了审慎定价入场的必要性。
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
