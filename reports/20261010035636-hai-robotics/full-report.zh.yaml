      - number: '4.2'
        title: 毛利率动态、区域结构与运营成本杠杆
        blocks:
          - type: paragraph
            body: >-
              集团综合毛利率从 2023 年的 16.0% 大幅升至 2025 年的 31.2%，并在 2026 年上半年进一步升至 34.4% [CI003]。结构性改善来自三项相互作用的因素：高毛利产品升级（从 HPS1
              转向价格更高的 HPS3 和 Climb）、规模效应将平均项目规模从 2023 年的 RMB 3.3 million 提升至 2025 年的 RMB 7.9 million 和 2026 年上半年的 RMB
              10.2 million，以及积极转向海外市场 [CI003]。海外市场的实际定价和项目利润率明显高于中国大陆：2025 年中国大陆以外市场毛利率为 46.9%，中国大陆仅为 20.8% [CI004]。2026
              年上半年海外收入占总销售额 50.2%（2023 年为 24.2%），使公司免受国内激烈价格竞争的影响 [CI003, CI004]。按行业看，流通物流（服装、电商、3PL）占 2025 年收入的
              83.8%（RMB 1.693 billion）；高毛利工业制造收入约为 RMB 326 million，但 2026 年上半年毛利率从 41.8% 压缩至 36.4%
              [CI005]。运营费用方面，销售与营销费用占收入比重从 2023 年的 52.7% 降至 2026 年上半年的 29.9%，行政费用从 23.7% 降至 10.1%，研发费用从 38.3% 降至
              22.3%，调整后 EBITDA 利润率从 -78.7% 收窄至 -17.4% [CI006]。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
