              尽管 2026 年上半年收入激增 70.2%、毛利率升至 34.4%，经营现金流出仍恶化 24.6%，达到 -RMB 360 million；现金储备在六个月内减少 RMB 552 million 至 RMB
              1.417 billion。招股书警告 2026 全年将继续净亏损且经营现金流出加剧，Hai Robotics 高度依赖完成 HKEX IPO，以补充营运资金并偿还 RMB 5.254 billion
