              - CR007
              - CR013
              - CR014
      - number: '7.5'
        title: 证据材料
        blocks:
          - type: callout
            title: 估值调整倒计时与债务重组风险
            body: >-
              早期融资轮赋予投资人强制赎回权，截至 2026 年年中，相关金额已增至 5.2 billion yuan，而现金储备仅为 1.4 billion yuan。
              如果未能在规定期限内完成香港上市，投资人将立即获得现金回购权，IPO 也就变成一次关键的债转股事件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: callout
            title: 客户与渠道合作伙伴收入集中度持续上升
            body: 2026 年上半年，Hai Robotics 的客户和渠道集中度大幅上升：前五大客户贡献 50.3% 的收入，渠道合作伙伴贡献 58.6%。任何重要客户取消合同，或主要系统集成商转投他家，都会立即威胁营收规模。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 海外扩张是唯一的毛利率支柱
            body: >-
              中国市场的毛利率受价格竞争压制，Hai Robotics 因而高度依赖非中国销售（占 2026 年上半年收入的 50.2%），并要求其毛利率 高于
              40%。槟城工厂能提供一定供应链缓冲，但地缘政治关税或海外渠道摩擦会直接威胁合并口径的单位经济效益。
            calloutType: insight
            claimRefs:
              - CR012
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 已在自主箱式搬运移动机器人（ACR）领域建立领先地位，全球 40 个国家已部署超过 1,700 套系统，并获得 LPP Logistics 等国际物流运营商的有力验证。不过，投资建议为
              Track，风险评级为高，当前估值也偏高。核心商业逻辑确实 得到营收快速增长和国际市场毛利率超过 40% 的支撑，但反方逻辑在于累计会计亏损超过 3.5 billion yuan，且经营现金持续流出。
              更关键的是，早期投资协议形成了类似债务的沉重负担：强制赎回负债超过 5.2 billion yuan，而现金储备约为 1.4 billion yuan。
              这项投资判断承认公司的商业牵引力真实存在，但如果没有香港上市带来的资产负债表修复，接近 $2 billion 的私募轮估值就难以 持续。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
