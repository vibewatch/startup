  - id: TV001
    title: 建议总结与投资立场
    columns:
      - 维度
      - 评级／立场
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 观察
        - ACR 市场领先地位被巨额累计亏损和赎回负债抵消
        - 在 IPO 条款和现金创造能力得到验证前，维持观察名单状态
      - - 信心度
        - 中等
        - 招股说明书申报文件披露了财务指标，但缺少最终 IPO 定价和优先权清偿顺序
        - 要求提供承销商配售详情及发行后的资本结构
      - - 风险评级
        - 高
        - 经营现金流为负，且 RMB 5.2B 赎回负债对应的现金仅为 RMB 1.4B
        - 在投入资本前评估下行保护和契约触发条件
      - - 估值立场
        - 偏高
        - 收入为 RMB 1.36b-2.02b，却持续亏损超过 RMB 589m，并依赖海外毛利
        - 等待倍数压缩，或等待香港公开市场发现价格
    notes: 投资总结评估综合自香港 IPO 申报文件、Tracxn 财务数据和第三方风险分析。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV002
    title: 投资论点与反论点
    columns:
      - 支柱
      - 论点（看多）
      - 反论点（看空）
      - 证伪／尽调触发条件
    rows:
      - - 市场与产品
        - 全球 ACR 龙头，市场份额超过 30%，模块化 HaiPick 架构持续向海外扩张
        - 重硬件商业模式易受国内价格下滑和产品同质化影响
        - 海外毛利率降至 35% 以下，或海外项目新增速度放缓
      - - 运营执行
        - 覆盖超过 40 个国家，已部署超过 1,700 套系统，产能扩张 10 倍
        - 高度依赖第三方系统集成商，带来渠道风险并削弱客户控制力
        - 渠道合作伙伴转投竞争机器人 OEM，或项目交付周期拉长
      - - 财务模型
        - 收入从 RMB 807m 快速增长至超过 RMB 2b，海外毛利率超过 40%
        - 累计净亏损超过 RMB 3.5b，经营现金流持续为负
        - 上市后 18 个月内未能实现经营现金流盈亏平衡
      - - 资本与治理
        - 香港 IPO 注入资本，将赎回负债转化为永久性股权
        - 若公开发行失败，RMB 5.2B 赎回负债将引发严重流动性危机
        - IPO 时间表延后至保荐人禁售期之后，或撤回港交所上市
    notes: 论点与反论点驱动因素依据历史运营表现和港交所招股说明书披露校准。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: 乐观／基准／悲观估值情景
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值与回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 香港 IPO 成功；收入年增长超过 35%；国际业务占比达到 60% 以上；经营现金流在 2027 年转正
        - 按未来 12 个月收入的 5–6 倍计算，估值达到 $2.5B–$3.0B；公开市场倍数扩张具有吸引力
        - Geekplus 和 GreyOrange 竞争加剧；全球供应链出现瓶颈
        - 25%（需要海外毛利率持续稳定，并快速减少现金消耗）
      - - 基准情景
        - 上市将优先股转换为股权；收入增长 20–25%；毛利率稳定在约 30%；现金消耗温和延续
        - 按收入的 3.5–4.5 倍计算，估值为 $1.5B–$1.8B；入场回报中性
        - 销售及分销费用持续拖累；中国国内毛利率下滑
        - 50%（反映已验证的交付记录与结构性成本负担之间的平衡）
      - - 悲观情景
        - IPO 延迟触发赎回条款；海外销售面临贸易／关税摩擦；现金储备耗尽
        - 严重折价融资重组，或清算估值低于 $800M（现金救助条款）
        - 投资者立即行使 RMB 5.2B 赎回权，耗尽 RMB 1.4B 现金
        - 25%（受成功进入股权资本市场这一二元依赖驱动）
    notes: 远期情景倍数和概率权重是作者根据可比物流机器人估值作出的尽调估计。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
