chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics Innovation Group Co., Ltd. 于 2016 年末在中国深圳成立，开创了面向自动化仓储和配送环境的自主箱式搬运机器人（ACR）品类。联合创始人 Richie
              Chen（Yuqi Chen）、Bing Fang 和 Shengdong Xu 在 2015 年启动系统开发，此前曾在北京 30 多座物流仓库进行大量现场观察。Hai Robotics
              没有采用搬运整套货架的传统自动导引车，也没有采用刚性的自动存取系统（ASRS）堆垛机，而是以 HaiPick 品牌打造模块化货到人移动机器人，直接从最高 12
              米的立体货架上取出单个料箱、纸箱和容器。公司既是硬件制造商，也是软件平台提供商，交付箱式搬运机器人、自动移动机器人（AMR）、自有工作站拣选台和仓储编排软件。公司在北美、欧洲、日本、新加坡和大中华区的商业枢纽开展全球运营，可将存储密度提高
              80% 至 400%，同时显著减少高吞吐量履约设施中的人工行走时间。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
