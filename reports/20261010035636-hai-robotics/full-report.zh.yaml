  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线架构与仓储工作流
        blocks:
          - type: paragraph
            body: >
              Hai Robotics 开发自主箱式搬运移动机器人（ACR）和专用自动存取系统（ASRS），把人工搬运纸箱和料箱改造成高密度货到人（G2P）自动化。HaiPick 不像传统 Kiva 式 AMR
              那样搬运整套重型货架，也不依赖固定在地面的网格轨道，而是在开放仓库地面布局中行驶，并将垂直伸缩取料器伸入最高 10
              米的标准工业货架。硬件产品经历四代架构，从单深位容器拣选发展到多深位合并和爬架移动。HaiPick System 1 以伸缩桅杆机器人确立自主箱式搬运移动机器人概念，随后推出 HaiPick System
              2、面向更高密度作业的 HaiPick System 3，以及近期商业化的 HaiPick Climb
              爬架机器人系统。典型履约流程中，系统接收出库订单、编排机器人路径，从双深位或高位立体货架中自主取出指定料箱或纸箱，再将库存直接送到符合人体工学的拣选工位或输送机环线，显著减少人工行走并提升履约速度。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE014
      - number: '5.2'
        title: 模块化系统迭代与运营用例
        blocks:
          - type: paragraph
            body: >
              HaiPick 产品组合的商业成熟度体现为多代平台战略，覆盖服装、电商、第三方物流（3PL）和制造业厂内物流等不同设施。过去老款 HaiPick System 1
              占据绝大多数收入，但客户采用已快速转向新一代产品。HaiPick System 3 在 FY2025 和 1H2026 成为主要收入贡献者，提升了存储密度；高毛利 HaiPick Climb
              也已达到商业部署规模，全球项目部署超过 10,000 台爬升机器人。应用场景从电商全渠道履约（促销订单激增要求高吞吐量料箱拣选），到 3PL 和快时尚配送（季节性 SKU 波动与紧凑场地要求将垂直空间优化至 10
              米），覆盖广泛。关键运营取舍包括地面平整度、设施净高，以及与低成本自主推车或永久超高密度网格自动化相比的资本开支。
