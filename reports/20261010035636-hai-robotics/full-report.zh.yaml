            body: HaiPick Climb 在 12 个国家快速签约超过 10,000 台机器人，至少八个大型企业客户已确认重复扩容。尽管宏观环境整体趋于谨慎，早期客户部署仍成功转化为后续设施承诺。
            calloutType: strength
            claimRefs:
