            figureRef: FU001
            claimRefs:
              - CU002
              - CU011
              - CU015
      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 中间渠道集中削弱客户归属
            body: 近期超过 50% 的收入通过第三方系统集成商而非直接企业客户实现。系统集成商虽能加快覆盖欧洲和北美，但过度依赖中间商会引入渠道风险、压缩实际定价利润，并让 Hai Robotics 远离部署后的直接客户关系。
            calloutType: risk
