  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics
              将客户市场策略分为八个行业垂直领域，优先服务仓库面积受限、劳动力短缺最严重的高周转供应链运营。核心客户覆盖鞋服、专业零售、第三方物流（3PL）、电商履约、工业电子、杂货、汽车和医疗供应链。鞋服及 3PL
              分销网络是早期采用支点，通常具有季节性库存激增、SKU
              快速增加和货到人拣选需求强等特点。这些行业的企业买方通常包括供应链工程副总裁、配送中心总经理和企业物流负责人，他们会以严格的回收期要求和运营连续性风险评估自动存取系统。现代企业买方不再购买实验性机器人硬件，而是要求可量化的投资回报、可预测的安装周期，以及能保护既有履约流程免受灾难性停机影响的软件编排能力。
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU010
      - number: '6.2'
        title: 采用轨迹、车队规模与市场份额
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 的自主箱式搬运系统已从中国国内试点设施大幅扩展至多洲部署。公司已在超过 40 个国家完成 1,800 多个自动化仓库项目，按收入和台数计算在自主箱式搬运机器人中占据超过 30%
              的全球市场份额，成为主导品类的龙头。近期采用速度的核心催化剂是 HaiPick Climb 的商业推出和规模化，该系统可覆盖最高 12 米的立体仓储。到 2026 年 8 月，HaiPick Climb
              全球推出仅 15 个月，签约客户承诺已覆盖 12 个国家、超过 10,000
              台机器人。商业势头还越来越依靠后续系统扩容：至少八个大型企业客户重复下单，或将初始设施扩展至更多配送中心，验证了模块化架构的基本可扩展性。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
      - number: '6.3'
        title: 具名客户验证与生产成果
        blocks:
          - type: paragraph
            body: >-
              公开客户证据显示，Hai Robotics 已进入多种供应链环境中的一线跨国企业和国内市场龙头。在北美零售配送领域，Boot Barn 在中央配送设施采用 Hai Robotics 技术，为全国 400
              家门店提升履约速度和库存吞吐；Win.IT America 在洛杉矶履约中心实现超过每平方米 32 个料箱的存储密度、每小时最高 1,200 个料箱的拣选吞吐量和超过 99%
              的订单准确率。在制造物流领域，全球管道和家居产品制造商 Kohler 在中央仓储运营中部署 HaiPick System 3，使存储容量提升 3.7x、订单吞吐量提升 2x、拣选人工成本降低 80%。Anta
              Sports、Xtep、Bosideng、Panasonic、Lenovo、Philips、Mettler Toledo 和 SF Express 等知名企业客户进一步印证了其跨行业运营可行性。
            claimRefs:
