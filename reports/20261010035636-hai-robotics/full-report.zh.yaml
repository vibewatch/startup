  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、解决方案架构与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 将核心市场定义为更广泛仓储自动化生态中的自主箱式搬运移动机器人（ACR）和模块化货到人拣选系统。与需要大型刚性起重机和建筑结构改造的重型托盘自动存取系统（ASRS）不同，ACR
              以自主爬升机器人车队在标准仓储货架间运行，把单个料箱和纸箱直接送到固定拣选工位。该架构边界排除了大型土建基础设施和重型整托盘搬运，专注于箱级存储密度和动态拆零拣选。ACR
              面临的现有替代方案从低资本开支的人工拣选车、手持 RF 条码扫描器，到资本密集型固定输送机环线和传统旋转货架不等。ACR 无需专门的地面平整度或永久建筑连接，即可提供最高 10
              米或更高的可扩展立体存储，因此能在传统高位起重机自动化无法适配的既有仓库中进行改造部署。
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
      - number: '2.2'
        title: 可寻址市场规模、增长轨迹与渗透动态
        blocks:
          - type: paragraph
            body: >-
              Frost & Sullivan 编制并在香港上市文件中披露的市场规模数据表明，ACR 是全球仓储拣选自动化中增长最快的细分领域。2024 年全球 ACR 市场规模约为 RMB 4.4
              billion，在整体仓储拣选自动化解决方案市场中的渗透率仍约为 2.6%。全渠道履约订单增加、人工成本上升和仓库面积紧张推动行业预测：到 2030 年，可寻址市场将扩大至 RMB 86 billion 至
              RMB 91 billion，预计复合年增长率为 65.7% 至 70.0%。同期，ACR 在仓储拣选解决方案中的渗透率预计从 2025 年的 3.2% 飙升至 2030 年的 22.7%。Hai
              Robotics 已取得早期品类领导地位，2024–2025 年按收入和出货量均占据超过 30% 的全球市场份额；2025 年收入为 RMB 2.017 billion，并根据 2026 年上半年披露的 RMB
              1.118 billion 达到 RMB 2.24 billion 的年化运行率。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
