      - number: '1.4'
        title: 商业运营规模、香港 IPO 申请与烧钱动态
        blocks:
          - type: paragraph
            body: >-
              到 2024 年，Hai Robotics 已成为全球领先的自主箱式搬运机器人供应商，按收入和出货量计算在 ACR 解决方案中占有超过 30%
              的全球市场份额。公司客户覆盖服装、第三方物流、医药、消费电子和零售等多个垂直市场，Philips、Anta 和 SF Express 等全球品牌均已部署其产品。2026 年 2
              月，公司向香港联交所提交上市申请，披露 2025 年前九个月收入为 1.26 billion yuan，同比增长 36%。但商业快速增长伴随着持续的会计亏损和现金消耗。公司 2023 年、2024 年及 2025
              年前九个月的净亏损分别为 1.00 billion yuan、1.26 billion yuan 和 589 million yuan（9m），主要由高企的销售、分销和工程费用推动。到 2025 年末，总负债升至
              3.88 billion yuan，经营现金流为负 286 million yuan，说明公司急需上市所得来维持流动性，并为 Zion Solutions Group 等国际合作伙伴整合提供资金。
            claimRefs:
