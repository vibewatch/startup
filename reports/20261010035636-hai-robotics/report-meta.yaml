companyProfile:
  summary: >-
    Hai Robotics designs and sells autonomous case-handling warehouse automation systems that move totes and cartons to
    pick stations using its HaiPick and HaiClimb product families. The company is a Shenzhen-founded category leader
    with a broad global deployment footprint, especially in apparel, 3PL, retail, e-commerce, and industrial logistics.
  foundedDate: '2016-12-01'
