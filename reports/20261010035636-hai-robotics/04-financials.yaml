chapter:
  number: 4
  title: "Financials"
  summary: "Hai Robotics achieved RMB 2.017 billion in 2025 revenue (+48.3% YoY) and RMB 1.118 billion in H1 2026 (+70.2% YoY), driven by international expansion and its HPS3/Climb systems, but remains deeply loss-making with RMB 3.523 billion in cumulative losses and negative operating cash flow (-RMB 360 million in H1 2026) ahead of its refiled Hong Kong IPO."
sections:
  - id: "revenue-model-and-streams"
    title: "Revenue Model, Pricing Mechanics, and Product-Line Mix"
    body: "Hai Robotics monetizes warehouse automation through a turnkey, project-based deployment model rather than recurring software subscriptions [CI001]. A complete deployment integrates three core components: HaiPick or HaiClimber robotic bodies, HaiStation pick/put workstations, and the proprietary HaiQ intelligent warehouse execution management platform, augmented with precision racking, charging stations, and latent autonomous mobile robots [CI001]. Customers—primarily apparel brands, e-commerce retailers, third-party logistics (3PL) operators, and discrete manufacturing enterprises—make an upfront capital commitment to purchase the integrated system [CI001]. Hai Robotics executes end-to-end facility design, hardware delivery, installation, and software commissioning, with revenue recognition strictly tied to formal customer milestone acceptance [CI001]. Subsequent lifecycle revenue streams include maintenance contracts, replacement spare parts, software upgrades/subscriptions, and brownfield capacity expansions [CI001]. The commercial trajectory has shifted rapidly across hardware generations: the legacy HPS1 system dropped from 92.8% of total revenue in 2023 (RMB 748 million) to 35.5% in 2025 (RMB 716 million) and 29.7% in H1 2026 (RMB 332 million) [CI002]. Meanwhile, the flagship HPS3 platform became the primary growth engine, delivering RMB 1.135 billion in 2025 (56.3% of revenue) and RMB 607 million in H1 2026 (54.3%) [CI002]. The Climb series, commercially introduced in 2025 supporting 15-meter racking, expanded to RMB 136 million in 2025 (6.7%) and RMB 149 million in H1 2026 (13.3%), while HPS2 contracted to negligible scale (2.1% of H1 2026 revenue) [CI002]."
    claimRefs:
      - "CI001"
      - "CI002"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "margin-structure-and-gtm"
    title: "Gross Margin Dynamics, Regional Mix, and Operating Cost Leverage"
    body: "The group's consolidated gross margin expanded significantly from 16.0% in 2023 to 31.2% in 2025, climbing further to 34.4% in H1 2026 [CI003]. This structural improvement stems from three interlocking drivers: higher-margin product upgrades (transitioning from HPS1 to higher-priced HPS3 and Climb systems), economies of scale that expanded average project size from RMB 3.3 million in 2023 to RMB 7.9 million in 2025 and RMB 10.2 million in H1 2026, and an aggressive geographical pivot toward overseas markets [CI003]. International markets yield substantially higher pricing realization and project margins than mainland China: in 2025, markets outside mainland China delivered a 46.9% gross margin, compared to just 20.8% in mainland China [CI004]. Overseas revenue reached 50.2% of total sales in H1 2026 (up from 24.2% in 2023), insulating the company from intense domestic price competition [CI003, CI004]. Sectorally, circulation logistics (apparel, e-commerce, 3PL) represents 83.8% of 2025 revenue (RMB 1.693 billion), whereas high-margin industrial manufacturing plateaued around RMB 326 million (gross margin compressed from 41.8% to 36.4% in H1 2026) [CI005]. On operating expenses, corporate operating leverage improved as sales and marketing dropped from 52.7% of revenue in 2023 to 29.9% in H1 2026, administrative costs declined from 23.7% to 10.1%, and R&D expenses declined from 38.3% to 22.3%, narrowing the adjusted EBITDA margin from -78.7% to -17.4% [CI006]."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy-and-cash-burn"
    title: "Working Capital Advantage, Cash Burn, and Pre-IPO Solvency Gaps"
    body: "Hai Robotics benefits from a structurally negative working capital cycle: customer upfront deposits combined with 193 trade payable turnover days yielded a cash conversion cycle of -148 days in H1 2026, supported by a highly diversified supply chain where the top five vendors account for only 16.5% of total procurement [CI007]. Inventory turnover days improved from 311 days in 2023 to 207 days in H1 2026 [CI007]. Nevertheless, working capital gains have not stemmed operational cash burn or generated net profitability [CI008]. Cumulative net losses reached RMB 3.523 billion from 2023 through H1 2026, with H1 2026 net loss of RMB 431 million barely improving over the RMB 441 million loss in H1 2025 (-2.4% narrowing) despite 70.2% revenue growth [CI008]. Operating cash outflow worsened to -RMB 360 million in H1 2026 (vs -RMB 289 million in H1 2025), and total cash reserves dropped by RMB 552 million in six months to RMB 1.417 billion as financing cash turned to a net outflow (-RMB 36 million) [CI008]. On the balance sheet, preferred share redemption liabilities reached RMB 5.254 billion as of June 30, 2026, generating RMB 198 million in non-cash accrued interest expense in H1 2026 alone (17.7% of revenue) and leaving net liabilities of RMB 4.371 billion [CI009]. Headcount estimates vary widely between primary corporate workforce intelligence (2,668 global employees in March 2026 across engineering and operations) and directory snapshots, while unit-level recurring SLA retention rates remain private [CI010, CI011, CI012, CI013, CI014, CI015]."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
