callouts:
  - calloutType: "risk"
    title: "Operating Cash Outflow Diverges from Top-Line Growth"
    body: "Despite a 70.2% surge in H1 2026 revenue and an expanding gross margin (34.4%), operating cash outflow worsened by 24.6% to -RMB 360 million, while cash reserves fell by RMB 552 million in six months to RMB 1.417 billion. With the prospectus warning of continued full-year 2026 net losses and heightened operating cash outflows, Hai Robotics remains highly dependent on completing its HKEX IPO to replenish working capital and extinguish RMB 5.254 billion in preferred share redemption liabilities."
    claimRefs:
      - "CI008"
      - "CI009"
  - calloutType: "insight"
    title: "Overseas Expansion Reshapes Margin Profile"
    body: "Hai Robotics has successfully decoupled its unit economics from domestic Chinese hardware pricing pressure by lifting overseas revenue to 50.2% in H1 2026. Because overseas deployments yield a 46.9% gross margin compared to 20.8% in mainland China, geographic mix shift is the single most potent lever for the group's trajectory toward break-even, though it increases international execution risk and requires sustained overseas sales staffing."
    claimRefs:
      - "CI003"
      - "CI004"
