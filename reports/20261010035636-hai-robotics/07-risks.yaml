    body: "Hai Robotics experienced a sharp increase in customer and channel concentration in the first half of 2026, with top-five clients generating 50.3% of revenue and channel partners accounting for 58.6%. Any contract cancellation by key accounts or defection by major system integrators poses an immediate threat to top-line volume."
