  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Demographics
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics structures its customer go-to-market strategy across eight distinct industry verticals,
              prioritizing high-velocity supply chain operations where warehouse floor constraints and labor shortages
              are most severe. The company's core client footprint spans footwear and apparel, specialized retail,
              third-party logistics (3PL), e-commerce fulfillment, industrial electronics, grocery, automotive, and
              healthcare supply chains. In particular, apparel and 3PL distribution networks represent early
              foundational adoption anchors, characterized by seasonal inventory spikes, intensive SKU proliferation,
              and rapid goods-to-person picking demands. Enterprise buyers within these sectors typically consist of
              vice presidents of supply chain engineering, distribution center general managers, and corporate logistics
              directors who evaluate automated storage and retrieval systems against strict payback hurdles and
              operational continuity risks. Rather than purchasing experimental robotics hardware, modern enterprise
              buyers demand quantifiable return on investment, predictable installation timelines, and demonstrated
              software orchestration capabilities that protect existing fulfillment workflows from catastrophic
              downtime.
