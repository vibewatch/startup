      - number: '6.4'
        title: Customer Lifecycle, Retention Durability, and Channel Concentration
        blocks:
          - type: paragraph
            body: >-
              While Hai Robotics demonstrates strong initial deployment traction, significant structural risks surround
              customer retention durability, channel dependency, and cash collection dynamics. Over 50% of the company's
              recent commercial revenue flows through third-party system integrators and logistics partners rather than
              direct enterprise accounts. This reliance on channel intermediaries accelerates international market entry
              across Europe and the Americas, but simultaneously reduces direct pricing power, weakens end-customer
              relationship ownership, and exposes gross margins to partner concession demands. Furthermore, independent
              analysis reveals that the velocity of newly signed customer projects has slowed, forcing the business to
              rely heavily on extracting larger expansion contracts from existing accounts. The commercial model remains
              capital intensive and vulnerable to customer milestone acceptance delays, as operations depend on customer
              prepayments and extended supplier payables. Crucially, public disclosures omit audited cohort retention
              schedules such as Net Revenue Retention (NRR) and Gross Revenue Retention (GRR), leaving multi-year
              recurring software and maintenance durability an essential diligence question.
