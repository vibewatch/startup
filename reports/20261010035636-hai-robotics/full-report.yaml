      - number: '6.2'
        title: Adoption Trajectory, Fleet Scale, and Market Share
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of Hai Robotics' autonomous case-handling systems has expanded significantly from
              domestic Chinese pilot facilities into a multi-continent deployment footprint. The enterprise has
              completed more than 1,800 automated warehouse projects across upwards of 40 countries, positioning the
              vendor as the dominant category leader with over 30% global market share in autonomous case-handling
              robotics by both revenue and unit volume. A central catalyst of recent adoption velocity has been the
              commercial introduction and scale-up of the HaiPick Climb system, which addresses vertical warehouse
              storage up to 12 meters in height. By August 2026, contracted customer commitments for HaiPick Climb
              surpassed 10,000 robots across 12 countries within just 15 months of its global rollout. Furthermore,
              commercial momentum is increasingly supported by follow-on system expansions, with at least eight major
              enterprise accounts placing repeat orders or expanding initial facility footprints to additional
              distribution centers, validating the fundamental scalability of the modular architecture.
