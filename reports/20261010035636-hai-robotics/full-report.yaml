      - number: '8.4'
        title: Downside Triggers, Governance, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Investors evaluating Hai Robotics must closely monitor several critical thesis-break triggers and
              governance vulnerabilities before committing capital. The primary downside trigger is any extension or
              failure of the 18-month listing window that governs investor redemption rights, which would force
              immediate cash calls. Operationally, reliance on third-party system integrators for over half of recent
              revenues introduces intermediary channel risk and buffers the company from direct customer relationships.
              Furthermore, an undisclosed fatal workplace incident at a subsidiary site in late 2025 highlights
              potential ESG and safety compliance hurdles as the company expands deeper into strict Western enterprise
              supply chains. Diligence priorities require reviewing the unredacted HKEX prospectus supplement, verifying
              international gross margin stability, auditing operating cash flow trajectory across 2026, and confirming
              that newly expanded factory capacity across Yancheng and Penang translates into positive unit-level
              operating leverage rather than underutilized overhead.
