  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Structure, Debt Redemption Clock, and Liquidity Constraints
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics faces critical balance sheet and liquidity exposure centered on its capital structure and
              historical valuation adjustment mechanisms. Early-stage institutional funding rounds granted investors
              mandatory redemption rights that expanded to over 5.2 billion yuan by mid-2026. If the company fails to
              complete a qualified initial public offering in Hong Kong within the eighteen-month milestone window,
              investors hold contractual rights to demand immediate cash buybacks. This redemption overhang creates an
              acute structural vulnerability because Hai Robotics held approximately 1.4 billion yuan in cash reserves
              as of mid-2026, leaving a multi-billion-yuan funding deficit in any non-IPO scenario. Consequently, the
              planned listing functions as a mandatory debt-to-equity restructuring rather than a purely discretionary
              capital raise. This balance sheet stress is exacerbated by ongoing operational losses. The company
              incurred net losses of RMB1,009.0 million in 2023, RMB1,255.7 million in 2024, RMB827.5 million in 2025,
              and RMB430.9 million for the six months ended June 30, 2026, resulting in cumulative losses of over
              RMB3.52 billion. Operating cash flows remained consistently negative throughout the Track Record Period,
              with cash outflows of RMB482.2 million in 2023, RMB195.7 million in 2024, RMB34.3 million in 2025, and
              RMB359.8 million in the first half of 2026. As of June 30, 2026, net current liabilities reached
              RMB4,378.4 million and total net liabilities stood at RMB4,371.0 million. Furthermore, Hai Robotics
              operates under a Weighted Voting Rights (WVR) structure, granting founders voting control disproportionate
              to equity ownership and subordinating public shareholders during governance disputes.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR007
      - number: '7.2'
        title: Regulatory Compliance, Labor Contributions, and Legal Liabilities
        blocks:
          - type: paragraph
            body: >-
              Regulatory and compliance risks span domestic employment obligations, cross-border data security mandates,
              and international intellectual property defense. In mainland China, Hai Robotics historically underpaid
              social insurance and housing provident fund contributions for certain employees by utilizing contribution
              bases below statutory average monthly wages. Under PRC labor statutes, competent authorities can order
              full retroactive rectification, accompanied by daily late payment surcharges of 0.05% and statutory fines
              between one and three times the overdue shortfall. Although the company's PRC legal advisor concluded that
              proactive administrative enforcement is remote absent employee complaints, the Supreme People's Court
              promulgated Judicial Interpretation (II) on Labor Dispute Cases on July 31, 2025, invalidating
              employer-employee contribution waiver pacts. Any increase in labor dispute filings could trigger material
              retroactive cash outflows. Globally, expanding warehouse deployments across Europe and the United States
              exposes the company to stringent data protection regimes, including the EU General Data Protection
              Regulation (GDPR) and state privacy statutes governing warehouse sensor and telemetry data. While Hai
              Robotics has built a sizable patent portfolio of 2,495 worldwide patent applications (including 1,178 in
              China and 1,166 in overseas jurisdictions as of June 30, 2026) and fully settled all historical
              infringement claims, expanding into mature logistics markets brings persistent risks of patent
              invalidation challenges, competitor litigation, and non-practicing entity claims that could restrict
              commercial distribution.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Operational Execution, Workplace Safety, and Manufacturing Resilience
        blocks:
          - type: paragraph
            body: >-
              Operational reliability and workplace safety represent key gatekeeping criteria for enterprise warehouse
              adoption. During the Track Record Period, a Hai Robotics subsidiary was involved in a fatal workplace
              accident at a project implementation site operated by a third-party end customer in Shanghai. The incident
              resulted in one death and one injury, prompting local safety regulators to levy an administrative fine of
              RMB600,000 on the subsidiary. While internal control enhancements and safety rectifications were executed,
              the event highlights physical execution risks inherent in on-site robotic installation, heavy lifting, and
              narrow-aisle system commissioning. Safety incidents create severe reputational exposure that can
              disqualify the company from competitive enterprise procurement tenders and ESG-screened global supply
              chains. To bolster manufacturing capacity and reduce geopolitical shipping vulnerabilities, Hai Robotics
              expanded its production footprint through two new factories in Yancheng, China and Penang, Malaysia,
              achieving a tenfold increase in HaiPick system capacity. However, multi-facility coordination introduces
              supply chain execution risks, particularly regarding specialized optical sensors, precision controllers,
              and semiconductor modules where lead-time delays can stall deployment milestones. On the software front,
              Hai Robotics maintains a Product Security Incident Response Team (PSIRT) operating a 24-hour assessment
              standard and has issued zero public advisories to date, though networked warehouse fleet management
              software remains vulnerable to operational downtime from enterprise network disruptions.
            claimRefs:
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR008
              - CR011
              - CR012
      - number: '7.4'
        title: Customer Concentration, Channel Intermediaries, and Margin Dynamics
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics' commercial structure exhibits intensifying revenue concentration across both enterprise
              customer accounts and indirect channel partners. Revenue generated from the company's five largest
              customers accounted for 32.1% in 2023, 36.7% in 2024, 43.2% in 2025, and reached 50.3% in the six months
              ended June 30, 2026. This upward trajectory leaves the top line highly vulnerable to budget cuts, capital
              expenditure deferrals, or vendor switching by anchor clients in retail and e-commerce. In parallel, the
              company has increasingly relied on third-party system integrators and distributors to scale deployments.
              Channel partner sales grew from 36.3% of revenue in 2023 and 39.5% in 2024 to 58.6% in the first half of
              2026. While partnerships with established logistics integrators like FORTNA accelerate deployment of
              systems like HaiPick Climb into North American and European facilities, heavy intermediary dependency
              diminishes direct customer relationships, introduces channel conflict, and dilutes software pricing power.
              Geographically, Hai Robotics relies on international markets to protect its gross margins. Non-domestic
              markets contributed 50.2% of revenue in 1H 2026 and delivered gross margins exceeding 40%, whereas the
              domestic Chinese market suffered from intense price competition and lower gross margins. Any disruption to
              overseas channel execution or heightened international trade barriers would directly threaten company-wide
              profitability.
            claimRefs:
              - CR006
              - CR007
              - CR013
              - CR014
