      - number: '8.3'
        title: Scenario Underwriting and Comparable Multiples
        blocks:
          - type: paragraph
            body: >-
              Scenario underwriting illustrates three distinct paths for investor returns based on public market
              reception and liquidity timing. The bull case projects that a successful Hong Kong debut converts
              redemption debt into equity while revenue expands over 35% annually, enabling valuation to reach $2.5
              billion to $3.0 billion on forward multiples of 5x to 6x. The base case, assigned a 50% probability,
              assumes listing occurs at a more measured valuation of $1.5 billion to $1.8 billion, representing 3.5x to
              4.5x revenue, where steady international deployment offsets severe domestic Chinese pricing competition.
              The bear case models a severe valuation contraction below $800 million if IPO execution stalls, triggering
              investor cash redemption buyback demands that overwhelm existing cash reserves of 1.4 billion yuan. Public
              market performance of warehouse robotics peer Geekplus on the Hong Kong Stock Exchange, which stabilized
              roughly 50% above its HK$16.80 offer price, confirms public investor interest but underscores the
              necessity of disciplined valuation entry.
            claimRefs:
              - CV009
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
