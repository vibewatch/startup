      - number: '5.2'
        title: Modular System Generations and Operational Use Cases
        blocks:
          - type: paragraph
            body: >
              The commercial maturity of the HaiPick portfolio reflects a multi-generation platform strategy addressing
              diverse facility profiles across apparel, e-commerce, third-party logistics (3PL), and manufacturing
              intralogistics. While legacy HaiPick System 1 deployments historically represented the vast majority of
              revenue, customer adoption has shifted rapidly toward advanced generations. HaiPick System 3 emerged as
              the principal revenue contributor in FY2025 and 1H2026, delivering optimized storage density, while the
              high-margin HaiPick Climb system reached significant commercial deployment scale with over 10,000 climbing
              robots deployed across worldwide projects. Operational use cases span e-commerce omnichannel fulfillment,
              where rapid promotional order surges demand high-throughput tote retrieval, to 3PL and fast-fashion
              distribution, where seasonal SKU volatility and compact facility footprints necessitate vertical space
              optimization up to 10 meters. Key operational trade-offs center on floor levelness and facility ceiling
              clearance, as well as capital expenditure considerations compared to low-cost autonomous carts or
              permanent ultra-dense grid automation.
