      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement of autonomous case-handling robotic systems is concentrated among high-throughput logistics
              operations characterized by extensive SKU counts and volatile seasonal demand profiles. Primary customer
              verticals comprise third-party logistics (3PL) providers, omnichannel e-commerce retailers, footwear and
              apparel enterprises, consumer electronics manufacturers, and healthcare/pharmaceutical distributors.
              Within these enterprise organizations, the buying committee typically pairs the Vice President of Supply
              Chain or Chief Logistics Officer—who controls capital expenditure budgets and operational transformation
              mandates—with warehouse general managers and facility fulfillment directors who evaluate daily picking
              throughput, mean time between failures, and software dispatch reliability. Key enterprise references
              across company disclosures include major fashion brands like Anta, Xtep, and Bosideng, multinational
              technology corporations including Lenovo and Philips, and logistics titans such as SF Express and SF-DHL.
              Customer retention remains strong, evidenced by an 89% client repurchase rate as expanding facilities
              deploy follow-on robot units within existing software deployments.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: Adoption Drivers, Structural Execution Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of goods-to-person ACR systems is primarily driven by acute labor availability shortages, rising
              hourly wage rates, and the imperative to maximize existing warehouse vertical volume amid elevated
              commercial real estate lease rates. However, adoption velocity is constrained by capital intensity,
              extended implementation horizons, and project integration complexities. Deploying warehouse robotics
              requires extensive on-site installation, warehouse management system (WMS) API integration, and customer
              acceptance procedures that frequently extend revenue recognition cycles over six to twelve months.
              Furthermore, intense domestic price wars among hundreds of Chinese mobile robotics vendors have compressed
              mainland gross margins, compelling Hai Robotics to pivot aggressively toward international markets where
              overseas gross margins exceed 40% and generated over 50% of H1 2026 revenue. Crucially, over half of
              project revenue flows through third-party system integrators rather than direct contracts, diluting direct
              pricing control. A central underwriting gap remains the lack of segmented disclosures isolating pure-play
              robot hardware shipments from bundled structural shelving, custom engineering, and ongoing maintenance
              service revenue.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category Creation vs. Long-Term Delivery Weight
            body: >-
              Hai Robotics pioneered the autonomous case-handling robotics category and commands over 30% global market
              share in ACR picking systems. However, warehouse automation remains fundamentally an infrastructure
              deployment business rather than a pure software sale: system acceptance, on-site commissioning, and
              multi-year project management dictate revenue realization and cash conversion.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM010
          - type: callout
            title: Domestic Price Wars Drive Overseas Margin Reliance
            body: >-
              Fierce domestic competition among hundreds of Chinese warehouse robotics vendors has compressed mainland
              gross margins. While expanding into international markets yields gross margins above 40%, it introduces
              substantial overhead for overseas sales channels, local system integrators, and global field support
              infrastructure.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The global warehouse automation ecosystem is characterized by distinct architectural approaches to
              inventory storage and order fulfillment. When Hai Robotics was founded in 2016, the dominant mobile
              robotics paradigm relied on shelf-moving Autonomous Mobile Robots (AMRs) that transported entire vertical
              storage shelving units across open floor space to stationary pickers [CP002]. Hai Robotics deliberately
              departed from this model by developing Autonomous Case-handling Robots (ACRs) designed to navigate narrow
              aisles, climb vertical racking, and retrieve individual standardized totes and cartons [CP001]. This
              architectural divergence enabled the company to achieve over 30% global market share in the ACR segment by
              2024, operating alongside hundreds of warehouse robotics peers [CP001, CP015]. Today, the competitive
              landscape spans direct robotics peers such as Geekplus, GreyOrange, and Addverb, traditional
              fixed-infrastructure Automated Storage and Retrieval System (AS/RS) incumbents, autonomous forklift
              providers, and legacy manual cart-picking operations [CP014, CP015]. With direct rivals like Geekplus
              already trading on public exchanges in Hong Kong, capital access across peer robotics manufacturers is
              equalizing, transforming what was once a technical novelty into a heavily contested commercial arena
              [CP014].
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
              - CP013
      - number: '3.2'
        title: Technical Capabilities and Vertical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Differentiation in warehouse fulfillment centers increasingly hinges on density and adaptability as
              omnichannel retail dynamics compress operating margins [CP006]. Traditional supply chain architectures
              managed e-commerce orders, retail replenishment, and reverse logistics in segregated silos, but modern
              facilities must process volatile multi-channel flows from consolidated inventory pools [CP006]. In
              response, Hai Robotics developed the HaiPick Climb system, which achieves vertical rack climbing up to 12
              meters with rated retrieval velocities reaching 4,000 totes per hour [CP007]. To address high-throughput
              velocity constraints, HaiPick System 3 introduces a dual-robot fulfillment mechanism that decouples
              vertical case-handling ACRs from horizontal transit, deploying Companion AMRs operating at speeds up to 4
              meters per second to shuttle retrieved containers to workstations [CP008]. To satisfy enterprise IT
              governance and operational technology security requirements in regulated corporate environments, Hai
              Robotics obtained IEC 62443-4-1 industrial cybersecurity certification in April 2026 and operates a
              dedicated Product Security Incident Response Team (PSIRT) that evaluates vulnerability disclosures within
              24 hours [CP010, CP012].
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Commercial Packaging, Pricing, and Economic Trade-offs
        blocks:
          - type: paragraph
            body: >-
              Commercial evaluation of goods-to-person automation reflects stark trade-offs between upfront capital
              intensity, deployment agility, and operational risk. Rather than forcing logistics operators into
              multi-million dollar monolithic fixed-infrastructure AS/RS commitments, Hai Robotics packages its
              solutions as modular, phased investments that allow facilities to automate single operational zones before
              scaling [CP011]. This phased deployment model mitigates disruption risk and facilitates repeat capital
              deployment, demonstrated by eight customer accounts expanding initial HaiPick Climb systems into follow-on
              facilities [CP005]. Distribution and delivery execution are heavily mediated through strategic global
              system integration partnerships, including alliances with TGW Logistics, Maveneer, and LX Pantos,
              embedding HaiPick hardware as the core engine within integrated systems such as TGW's LivePick [CP009].
              However, as peer robotics vendors seek public listings and deploy fresh capital across international
              logistics hubs, commercial negotiations increasingly center on unit pricing concessions, extended warranty
              terms, and aggressive deployment guarantees [CP003].
            claimRefs:
              - CP003
              - CP005
              - CP009
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP011
      - number: '3.4'
        title: Moat Durability and Commoditization Risks
        blocks:
          - type: paragraph
            body: >-
              Assessing Hai Robotics' long-term moat durability requires balancing its early category lead against acute
              commoditization pressures. Contracting over 10,000 HaiPick Climb robots across global projects
              demonstrates proven operational traction and integration maturity [CP004]. Furthermore, once an ACR grid
              is engineered into a customer's facility, mechanical switching costs, custom racking integration, and
              operational downtime create tangible customer lock-in [CP001]. Nevertheless, structural moat risks remain
              prominent. First, intellectual property and mechanical designs in case handling face replication from
              well-capitalized domestic and international competitors who are developing comparable climbing and
              dual-robot systems [CP003, CP015]. Second, publicly funded competitors like Geekplus possess the balance
              sheet capacity to wage multi-year price competition, particularly in international markets where gross
              margins have historically remained higher [CP003, CP014]. Consequently, Hai Robotics' competitive
              durability will depend on ongoing software orchestration performance, global integrator alignment, and
              dependable lifecycle service execution rather than hardware specifications alone [CP003].
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Differentiation: The Bin-Level Vertical Wedge'
            body: >-
              Hai Robotics carved out its competitive wedge by rejecting the standard shelf-moving AMR paradigm in favor
              of rack-climbing case-handling robots. By accessing individual bins up to 12 meters in height rather than
              hauling entire racks across open warehouse floors, Hai delivers up to 75% storage footprint reductions and
              4x efficiency gains for high-SKU omnichannel facilities.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: Erosion of Technological Lead and Emerging Price Pressures
            body: >-
              The historical moat established by Hai Robotics as a first mover in ACR technology is facing natural
              commoditization. As Asian competitors like Geekplus secure public capital and develop competing
              tote-handling robots, buyer conversations are shifting from technical novelty to price per pick,
              deployment timeline guarantees, and channel partner execution.
            calloutType: risk
            claimRefs:
              - CP003
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanics, and Product-Line Mix
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics monetizes warehouse automation through a turnkey, project-based deployment model rather than
              recurring software subscriptions [CI001]. A complete deployment integrates three core components: HaiPick
              or HaiClimber robotic bodies, HaiStation pick/put workstations, and the proprietary HaiQ intelligent
              warehouse execution management platform, augmented with precision racking, charging stations, and latent
              autonomous mobile robots [CI001]. Customers—primarily apparel brands, e-commerce retailers, third-party
              logistics (3PL) operators, and discrete manufacturing enterprises—make an upfront capital commitment to
              purchase the integrated system [CI001]. Hai Robotics executes end-to-end facility design, hardware
              delivery, installation, and software commissioning, with revenue recognition strictly tied to formal
              customer milestone acceptance [CI001]. Subsequent lifecycle revenue streams include maintenance contracts,
              replacement spare parts, software upgrades/subscriptions, and brownfield capacity expansions [CI001]. The
              commercial trajectory has shifted rapidly across hardware generations: the legacy HPS1 system dropped from
              92.8% of total revenue in 2023 (RMB 748 million) to 35.5% in 2025 (RMB 716 million) and 29.7% in H1 2026
              (RMB 332 million) [CI002]. Meanwhile, the flagship HPS3 platform became the primary growth engine,
              delivering RMB 1.135 billion in 2025 (56.3% of revenue) and RMB 607 million in H1 2026 (54.3%) [CI002].
              The Climb series, commercially introduced in 2025 supporting 15-meter racking, expanded to RMB 136 million
              in 2025 (6.7%) and RMB 149 million in H1 2026 (13.3%), while HPS2 contracted to negligible scale (2.1% of
              H1 2026 revenue) [CI002].
            claimRefs:
              - CI001
              - CI002
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI007
              - CI011
      - number: '4.2'
        title: Gross Margin Dynamics, Regional Mix, and Operating Cost Leverage
        blocks:
          - type: paragraph
            body: >-
              The group's consolidated gross margin expanded significantly from 16.0% in 2023 to 31.2% in 2025, climbing
              further to 34.4% in H1 2026 [CI003]. This structural improvement stems from three interlocking drivers:
              higher-margin product upgrades (transitioning from HPS1 to higher-priced HPS3 and Climb systems),
              economies of scale that expanded average project size from RMB 3.3 million in 2023 to RMB 7.9 million in
              2025 and RMB 10.2 million in H1 2026, and an aggressive geographical pivot toward overseas markets
              [CI003]. International markets yield substantially higher pricing realization and project margins than
              mainland China: in 2025, markets outside mainland China delivered a 46.9% gross margin, compared to just
              20.8% in mainland China [CI004]. Overseas revenue reached 50.2% of total sales in H1 2026 (up from 24.2%
              in 2023), insulating the company from intense domestic price competition [CI003, CI004]. Sectorally,
              circulation logistics (apparel, e-commerce, 3PL) represents 83.8% of 2025 revenue (RMB 1.693 billion),
              whereas high-margin industrial manufacturing plateaued around RMB 326 million (gross margin compressed
              from 41.8% to 36.4% in H1 2026) [CI005]. On operating expenses, corporate operating leverage improved as
              sales and marketing dropped from 52.7% of revenue in 2023 to 29.9% in H1 2026, administrative costs
              declined from 23.7% to 10.1%, and R&D expenses declined from 38.3% to 22.3%, narrowing the adjusted EBITDA
              margin from -78.7% to -17.4% [CI006].
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: Working Capital Advantage, Cash Burn, and Pre-IPO Solvency Gaps
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics benefits from a structurally negative working capital cycle: customer upfront deposits
              combined with 193 trade payable turnover days yielded a cash conversion cycle of -148 days in H1 2026,
              supported by a highly diversified supply chain where the top five vendors account for only 16.5% of total
              procurement [CI007]. Inventory turnover days improved from 311 days in 2023 to 207 days in H1 2026
              [CI007]. Nevertheless, working capital gains have not stemmed operational cash burn or generated net
              profitability [CI008]. Cumulative net losses reached RMB 3.523 billion from 2023 through H1 2026, with H1
              2026 net loss of RMB 431 million barely improving over the RMB 441 million loss in H1 2025 (-2.4%
              narrowing) despite 70.2% revenue growth [CI008]. Operating cash outflow worsened to -RMB 360 million in H1
              2026 (vs -RMB 289 million in H1 2025), and total cash reserves dropped by RMB 552 million in six months to
              RMB 1.417 billion as financing cash turned to a net outflow (-RMB 36 million) [CI008]. On the balance
              sheet, preferred share redemption liabilities reached RMB 5.254 billion as of June 30, 2026, generating
