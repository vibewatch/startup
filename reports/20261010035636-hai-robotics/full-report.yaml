  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics occupies an established category leadership position in autonomous case-handling mobile
              robots (ACR), supported by more than 1,700 deployed systems across 40 countries and strong validation from
              international logistics operators like LPP Logistics. However, the investment recommendation is Track with
              a high risk rating and a stretched valuation posture. While the core commercial thesis is supported by
              rapid top-line expansion and superior international gross margins exceeding 40%, the anti-thesis centers
              on heavy cumulative accounting losses of over 3.5 billion yuan and chronic operating cash outflows.
              Crucially, early-stage investor agreements have created an acute debt-like overhang with over 5.2 billion
              yuan in mandatory redemption liabilities compared against roughly 1.4 billion yuan in cash reserves. The
              investment stance reflects that while commercial traction is genuine, private round valuation marks near
              $2 billion are unsustainable without the balance sheet repair afforded by a successful Hong Kong listing.
