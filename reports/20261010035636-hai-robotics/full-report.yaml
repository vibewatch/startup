chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in late 2016 in Shenzhen, China, Hai Robotics Innovation Group Co., Ltd. established the
              autonomous case-handling robot (ACR) category for automated warehouse and distribution environments.
              Co-founders Richie Chen (Yuqi Chen), Bing Fang, and Shengdong Xu initiated system development in 2015
              following extensive operational observations across more than thirty logistics warehouses in Beijing.
              Instead of relying on conventional automated guided vehicles that transport entire storage racks or rigid
              automated storage and retrieval system (ASRS) cranes, Hai Robotics engineered modular goods-to-person
              mobile robots under the HaiPick brand that retrieve individual totes, cartons, and containers directly
              from vertical shelving up to twelve meters in height. The company operates as a hardware manufacturer and
              software platform provider, delivering case-handling robots, autonomous mobile robots (AMRs), proprietary
              workstation picking stations, and warehouse orchestration software. Operating globally across commercial
              hubs in North America, Europe, Japan, Singapore, and Greater China, the company delivers storage density
              improvements between 80% and 400% while significantly reducing human travel time in high-throughput
              fulfillment facilities.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO007
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO008
              - CO010
              - CO012
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics' executive leadership is anchored by founder and Chief Executive Officer Richie Chen, an
              electronic engineering alumnus of the Hong Kong Polytechnic University whose early field research across
              logistics facilities informed the core architecture of the HaiPick system. Chen maintains primary
              strategic and technical stewardship of the enterprise, representing a classic technical founder-operator.
              To accelerate international commercialization and navigate Western enterprise sales cycles, the company
              has supplemented its founder core with seasoned regional executives, notably appointing automated
              logistics veteran Adrian Stoch as CEO Americas in August 2025. Co-founders Bing Fang and Shengdong Xu have
              historically directed hardware engineering and software algorithmic coordination, ensuring tight coupling
              between mechanical case-handling mechanisms and real-time fleet scheduling. Governance structures continue
              to evolve toward public market standards ahead of the planned Hong Kong listing, though key-person
              dependency on Richie Chen remains pronounced across core product roadmap decisions and strategic investor
              relationships. Independent board oversight and formal committee charters remain key areas for ongoing
              diligence review.
            claimRefs:
              - CO002
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization History, Valuation Trajectory, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics has raised substantial institutional capital across multiple financing rounds to support
              aggressive product development, international subsidiary formation, and manufacturing expansion. Between
              2019 and 2022, the company completed consecutive financing rounds, culminating in a September 2021
              continuous Series C and D injection of over $200 million, followed swiftly by a June 2022 Series D+
              financing exceeding $100 million. The investor syndicate comprises top-tier global and domestic private
              equity and venture capital institutions, led prominently by Capital Today and 5Y Capital, with continued
              participation from Source Code Capital, Sequoia Capital China (HongShan), 01VC, Walden International, and
              Legend Star. Venture database evaluations placed the post-money equity valuation at approximately $2.0
              billion following the Series D+ transaction. In secondary markets, private equity shares have traded
              intermittently through platforms like Clarity and Hiive without continuous public quotation. While this
              capital trajectory provided robust balance sheet support during global rollout, historical financing
              terms, preference tiers, and shareholder agreements remain subject to confirmation in finalized pre-IPO
              documentation.
            claimRefs:
              - CO003
              - CO008
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO008
              - CO009
      - number: '1.4'
        title: Commercial Operational Scale, Hong Kong IPO Filing, and Burn Dynamics
        blocks:
          - type: paragraph
            body: >-
              By 2024, Hai Robotics emerged as the world's leading autonomous case-handling robotics provider, securing
              more than 30% global market share in ACR solutions across revenue and shipment metrics. The company's
              customer base spans diverse vertical markets including apparel, third-party logistics, pharmaceuticals,
              consumer electronics, and retail, with prominent deployments for global brands such as Philips, Anta, and
              SF Express. In February 2026, the company submitted its listing application to the Hong Kong Stock
              Exchange, disclosing 1.26 billion yuan in revenue for the first nine months of 2025, representing 36%
              year-on-year expansion. However, rapid commercial growth has been accompanied by sustained accounting
              losses and cash burn. The business generated net losses of 1.00 billion yuan in 2023, 1.26 billion yuan in
              2024, and 589 million yuan in 9M 2025, driven by elevated sales, distribution, and engineering overhead.
              Total liabilities climbed to 3.88 billion yuan by late 2025 alongside negative operating cash flows of 286
              million yuan, underscoring that public listing proceeds are urgently needed to maintain liquidity and fund
              international partner integrations like Zion Solutions Group.
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
              - CO013
