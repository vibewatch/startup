      - number: '8.2'
        title: Capital Structure, Historical Rounds, and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The historical capital structure of Hai Robotics reflects substantial venture backing across six funding
              rounds totaling $215 million, highlighted by a $100 million Series D financing in June 2022 that priced
              the business at a post-money valuation of $2 billion. Historical backers include Capital Today, 5Y
              Capital, Source Code Capital, 01VC, and HSG. Revenue grew briskly from 807 million yuan in 2023 to 1.36
              billion yuan in 2024, reaching 1.26 billion yuan in the first nine months of 2025. However, operating
              performance has been burdened by persistent sales and distribution overhead, resulting in net losses of
              1.00 billion yuan in 2023, 1.26 billion yuan in 2024, and 589 million yuan in the first nine months of
              2025. With total liabilities mounting to 3.88 billion yuan and redemption liabilities reaching 5.2 billion
              yuan by mid-2026, the company faces an urgent requirement to complete its Hong Kong public offering to
              convert redeemable shares into equity and prevent severe balance sheet distress.
            claimRefs:
