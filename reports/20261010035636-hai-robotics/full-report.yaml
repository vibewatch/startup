            body: >-
              While Hai Robotics maintains impressive category leadership in autonomous case-handling robotics with over
              1,700 deployed systems worldwide, the risk/reward profile remains unfavorable for private secondary entry
              at prior $2 billion marks. Investors should wait for the Hong Kong public offering to establish
              transparent market pricing and convert debt-like redemption liabilities into equity.
