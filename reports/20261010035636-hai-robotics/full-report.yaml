  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Solution Architecture, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics defines its core market within the broader warehouse automation ecosystem as autonomous
              case-handling mobile robotics (ACR) and modular goods-to-person picking systems. Unlike heavy
              pallet-handling automated storage and retrieval systems (ASRS) that require massive rigid cranes and
              structural building alterations, ACR solutions deploy fleets of autonomous climbing robots navigating
              standard warehouse racking to retrieve individual totes and cartons directly to fixed worker picking
              stations. This architectural boundary excludes macro civil infrastructure and heavy unit-load pallet
              movers while focusing directly on case-level storage density and dynamic split-case order picking.
              Status-quo substitutes against which ACR solutions compete range from low-capex manual picking carts and
              handheld RF barcode scanners to capital-intensive fixed conveyor loops and legacy carousel systems. By
              providing scalable vertical storage up to 10 meters or higher without requiring specialized floor flatness
              or permanent building tie-ins, ACR technology enables brownfield retrofit installations that traditional
              high-bay crane automation cannot accommodate.
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
      - number: '2.2'
        title: Addressable Market Sizing, Growth Trajectory, and Penetration Dynamics
        blocks:
          - type: paragraph
            body: >-
              Market sizing data compiled by Frost & Sullivan and disclosed in Hong Kong listing documents positions ACR
              solutions as the fastest-growing niche within global warehousing picking automation. In 2024, the global
              ACR market was estimated at approximately RMB 4.4 billion, representing a nascent penetration rate of
              roughly 2.6% within the overall warehouse picking automation solutions market. Driven by escalating order
              volumes across omnichannel fulfillment, rising labor costs, and urgent warehouse floor space constraints,
              industry projections model the addressable market expanding to RMB 86 billion to RMB 91 billion by 2030,
              reflecting a projected compound annual growth rate of 65.7% to 70.0%. Over the same forecast horizon, ACR
              penetration within warehouse picking solutions is expected to surge from 3.2% in 2025 to 22.7% by 2030.
              Hai Robotics established early category leadership, capturing over 30% global market share in 2024–2025 by
              both revenue and shipment volume, generating RMB 2.017 billion in 2025 revenue and reaching an annualized
              run-rate of RMB 2.24 billion based on RMB 1.118 billion reported in H1 2026.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
