        title: Manufacturing Footprint, Integration Partnerships, and Governance Controls
        blocks:
          - type: paragraph
            body: >
              Hai Robotics executes a hybrid manufacturing and partner-led delivery model supported by a 566-person
              internal research and development organization and 2,495 global patent filings. Robotic assembly and
              integration take place primarily across specialized Chinese manufacturing facilities, including the leased
              Dongguan plant and the recently commissioned Yancheng facility, complemented by selected external OEM/ODM
              manufacturing partners. To accelerate overseas deployment across North American and European distribution
              networks, the company increasingly relies on certified systems integrators, including formal integration
              agreements with Dematic, Maveneer, and global material handling providers. Software orchestration and
              fleet management integrate with enterprise warehouse management systems (WMS) and warehouse execution
              systems (WES). In response to international infrastructure scrutiny and mission-critical customer
              reliability requirements, Hai Robotics maintains an internal Product Security Incident Response Team
              (PSIRT) that actively coordinates vulnerability assessments, CVSS impact scoring, and responsible security
