  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Line Architecture and Warehouse Workflow
        blocks:
          - type: paragraph
            body: >
              Hai Robotics develops autonomous case-handling mobile robots (ACRs) and specialized automated storage and
              retrieval systems (ASRS) engineered to transform manual carton and tote handling into high-density
              goods-to-person (G2P) automation. Rather than transporting entire heavy racking structures like
              traditional Kiva-style autonomous mobile robots or relying on rigid floor-bolted grid rails like classic
              automated storage and retrieval shuttles, HaiPick robots navigate open warehouse floor layouts while
              extending vertical telescopic extractors up to 10 meters into standard industrial shelving. The company's
              hardware portfolio has evolved across four distinct architectural generations, transitioning from
              single-deep container picking to multi-deep consolidation and rack-climbing mobility. HaiPick System 1
              established the baseline Autonomous Case-handling Mobile Robot concept using telescopic mast robots,
              followed by HaiPick System 2, HaiPick System 3 for higher density operations, and the recently
              commercialized HaiPick Climb rack-climbing robotic system. In a typical customer order fulfillment
              workflow, the system receives outbound orders, orchestrates robotic routing, autonomously retrieves
              designated totes or cartons from double-deep or tall vertical racking, and delivers inventory directly to
              ergonomic pick stations or conveyor integration loops, substantially reducing human walking travel and
              accelerating fulfillment velocity.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE006
