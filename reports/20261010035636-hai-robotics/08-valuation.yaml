callouts:
  - calloutType: "recommendation"
    title: "Valuation Stance: Track Pending IPO Price Discovery"
    body: "While Hai Robotics maintains impressive category leadership in autonomous case-handling robotics with over 1,700 deployed systems worldwide, the risk/reward profile remains unfavorable for private secondary entry at prior $2 billion marks. Investors should wait for the Hong Kong public offering to establish transparent market pricing and convert debt-like redemption liabilities into equity."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV012"
  - calloutType: "risk"
    title: "Structural Capital Risk: The 5.2 Billion Yuan Redemption Clock"
    body: "The central investment risk is the ticking clock on investor redemption rights. With redemption liabilities reaching over RMB 5.2 billion by mid-2026 against cash reserves of approximately RMB 1.4 billion, any significant delay or failure in completing the Hong Kong IPO creates an acute solvency hazard that overrides underlying technology leadership."
    claimRefs:
      - "CV010"
      - "CV011"
      - "CV012"
