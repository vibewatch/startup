  topStrengths:
    - 高端产品工程获奖且有口碑：DirtSense AI、自清洁热水拖布基站、Tri-Laser / LIDAR 导航和 Flow 履带拖布获得独立评测认可，也拿到 CES、Red Dot、iF、Edison 设计奖。
    - 商业动能快：2024 年收入约 US$200M，同比约 130%，海外增长约 7 倍；30+ 国家有 3M+ 用户，并在 Amazon 高端扫地机器人品类占据 Best Seller 位置。
    - >-
      资本背书亮眼：独角兽估值约 US$1.4B，2025 年 4 月 Tencent 领投约 US$100M pre-IPO 轮，并有 Beijing Robot Industry Development Investment
      Fund 等国资支持；早期投资人包括 ByteDance 和 Source Code Capital。
    - 拖布清洁卫生 IP 有差异，公司声称约 800 项专利；多品类路线图（Flow 2、V50 手持、U50 床垫）把品牌延伸到家庭清洁生态。
  topRisks:
    - 估值偏高：约 US$200M 收入对应约 US$1.4B 私募估值（约 7x），明显高于上市可比 Roborock（约 1.1x EV / 收入）和 Dreame 约 1.7x 的 pre-IPO 标记，定价脆弱且依赖增长。
    - >-
      地缘与贸易敞口大：中国制造硬件出口商面对美国 Section 301 关税（7.5-25%+）、2025 年小额豁免取消，以及带摄像头中国智能家居设备受到更严审视（Korea Consumer Agency 曾指出 Freo Z
      Ultra 安全缺陷）。
    - 经济性薄且未披露，商品化竞争激烈：Roborock、Dreame、Ecovacs、Xiaomi 挤压高端硬件利润率；烧钱速度、现金跑道、毛利率和股权结构表仍不透明。
    - 运营和关键人风险并存：2025 年大规模产品「变砖」可靠性事件、中国供应链集中、Amazon 渠道依赖，以及对创始人兼 CEO Junbin Zhang 的高度依赖；治理披露有限。
  unresolvedGaps:
    - 没有审计财务：作为私人公司，收入确认、毛利率、烧钱速度、现金跑道，以及股权结构表 / 优先股堆叠都未经验证。
    - 融资历史互相冲突：数据库显示累计融资约 US$114-138M，但市场叙事称「$200M+」；Series D 精确规模和投后估值披露也不一致。
    - 单位经济和留存未验证：缺少流失 / 复购、CAC / 回本周期、活跃用户定义或保修索赔数据，难以判断持续性。
    - IPO 时间表、治理，以及 2025 年可靠性事件和设备安全发现的长期解决方案都不透明。
