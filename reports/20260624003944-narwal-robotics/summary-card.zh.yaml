summary:
  headline: Narwal 是靠创新突围的高端扫拖机器人挑战者，产品口碑强、收入增长快、估值约 $1.4B；但它也是估值偏贵、信息不透明的中国制造硬件出口商，暴露于关税、商品化和关键人风险。
