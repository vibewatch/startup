  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代品
        blocks:
          - type: paragraph
            body: >-
              Narwal 的相关市场不是所有家用机器人。可投资边界是住宅扫拖机器人组合品类：自主地面清洁机器人、自集尘 / 补水 / 清洗基站、app
              和云控制、固件智能，以及替换刷、滤网、拖布和依附于经常性地面清洁的配件。该边界纳入 Narwal Flow 2 和 Freo
              系列等高端混合产品，因为买家买的是省时间的家庭清洁电器，不是通用机器人。它排除传统无线手持吸尘器、立式 / 卧式吸尘器、洗地机、手持除螨仪、泳池 /
              擦窗机器人、商用洗地机、家用人形机器人和付费清洁服务。这些排除项很重要，因为许多市场页面混合了地面、泳池和窗户机器人，或混合住宅与商用设备，导致 TAM
              数字不一致。现状替代仍然是人工清洁或更便宜的非机器人吸尘器，因此渗透取决于便利性、信任、清洁效果和家庭支付意愿，而不是监管刚需。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM044
