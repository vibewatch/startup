          'y': 7
          rationale: Strong mop-hygiene differentiation but weaker scale proof and adverse carpet evidence.
        - label: Roborock
          x: 9
          'y': 8
          rationale: Public revenue scale and Saros Z70 feature frontier.
        - label: Ecovacs
          x: 8
          'y': 7
          rationale: Large listed China incumbent with broad OMNI lineup but profit pressure.
        - label: Dreame
          x: 9
          'y': 8
          rationale: Reported IPO valuation, revenue scale and IDC 2026 leadership claims.
        - label: Xiaomi
          x: 7
          'y': 6
          rationale: Ecosystem distribution with less specialist premium proof.
        - label: iRobot
          x: 6
          'y': 6
          rationale: Roomba trust persists but Amazon termination and layoffs reduce momentum.
        - label: Dyson
          x: 4
          'y': 7
          rationale: Premium cleaning brand with narrower robot-vacuum line.
        - label: Shark / Eufy / 性价比品牌
          x: 5
          'y': 4
          rationale: Buyer-guide alternatives pressure price but are less documented in retained sources.
        - label: 手动 / 手持吸尘器
          x: 3
          'y': 5
          rationale: Flexible status quo with low technology risk.
        - label: 清洁服务
          x: 2
          'y': 5
          rationale: Human service substitute broader than floor cleaning but not automated.
        - label: 自有品牌家电新进入者
