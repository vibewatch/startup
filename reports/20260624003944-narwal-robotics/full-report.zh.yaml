              700%、零售分销广、高端产品阶梯完整。弱点同样清楚：收入大多来自一次性硬件；耗材复购看起来真实但未量化；毛利率、净利率、CAC、退货率、保修负担、渠道贡献利润率和库存周转都未披露。Roborock
              的公开画像是警示基准：规模化后可实现约 42% 毛利率和 7-8% 净利率，但 2025 年也显示收入增长伴随利润压缩。关税和零售商费用可能迫使提价或吞噬利润率。最重要的尽调阻断项是按渠道划分的月度管理
              P&L、队列级换机 / 耗材数据、现金和债务明细、库存账龄、保修准备金，以及 IPO 准备度披露。
