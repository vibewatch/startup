      - 观察到的包装 / 价格信号
      - 包含能力
      - 未知项 / 折扣
      - 竞争含义
    rows:
      - - Narwal
        - 高端扫拖机器人产品和买方指南价格带；实际成交价随型号和促销变化
        - 自清洁基站、以拖布为核心的自动化、高端型号避障
        - 零售商利润率、促销深度和渠道经济性未公开
