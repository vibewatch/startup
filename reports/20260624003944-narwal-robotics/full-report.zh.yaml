            body: >-
              负面证据具有实质性。Korea Consumer Agency 和 KISA 在 2025 年 9 月报告称，多款中国扫地机器人存在安全或隐私弱点，其中包括 Narwal Freo Z
              Ultra；独立报纸将问题聚焦在摄像头 / 照片访问和认证风险上。这直接挑战 Narwal 对带摄像头机器人的隐私友好定位。修复可能来自固件、app
              认证和云政策加固，但本章没有找到独立补救审计。产品质量风险比安全更宽：RTINGS 和 Modern Castle 指出 Freo X Ultra 相比硬地板清洁，在地毯表现上更弱；KR Asia 描述了
              2025 年涉及设备故障或变砖的危机；保修和支持细节仍比产品参数更难衡量。投资者应把 Narwal 产品视为有差异化，但在承销高端利润率前，必须尽调安全补救、故障率、退货、零件和区域服务深度。
