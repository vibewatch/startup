        - 私有公司；据报 pre-IPO 轮估值 ~$9.6B，2025 年收入超过 RMB 40B
        - 全球高端家庭，尤其是欧洲和高端细分
        - 激进的功能节奏、吸力、全球份额主张、IPO 动能
        - 依赖私有来源；地面护理之外的战略扩张可能分散注意力
      - - Xiaomi
        - 生态竞争者
        - 大型上市电子生态；扫地机器人产品线是智能家居延伸
        - 已在 Xiaomi 生态内、重视性价比的智能家居买方
        - 分销、App 生态、硬件性价比定价
        - 高端地面护理专门化证据少于 Roborock / Dreame
      - - iRobot / Roomba
        - 老牌品牌
        - Amazon 收购在 2024 年终止；据报裁员；Roomba 历史信任仍在
        - 主流家庭和 Roomba 忠实用户
        - 品牌传承和熟悉的产品体验
        - 独立发展轨迹转弱，功能 - 价格节奏慢于中国同行
      - - Dyson
        - 相邻高端家电竞争者
        - 大型私有高端家电品牌；360 Vis Nav 机器人是小众高端入局产品
        - 高端吸尘器买方和 Dyson 忠实用户
        - 对吸力 / 清洁工程和高端品牌的信任
        - 扫地机器人产品线窄于中国专门厂商
      - - Shark/Eufy 和白牌品牌
        - 性价比挑战者 / 替代品
        - 留存来源未完整刻画规模；买方指南中以替代选项出现
        - 价格敏感家庭
        - 更低入门价格和零售商可得性
        - Narwal 式拖布卫生差异化的直接证据较少
      - - 人工清洁和手持吸尘器
        - 现状替代品
        - 普遍装机基础；无需风险融资
        - 所有已有清洁习惯的家庭
        - 信任门槛低、无建图 / 摄像头顾虑、深度清洁更灵活
        - 劳动密集，自动化程度较低
      - - 清洁服务
        - 服务替代品
        - 本地服务市场；无产品锁定
        - 外包家务的家庭
        - 人工判断和超出地面的广泛清洁范围
        - 经常性成本和排期摩擦
    notes: 规模和融资数字混合了公开申报、官方发布、市场数据聚合器和新闻报道；私有公司数值为近似值，不应视为经审计数据。
