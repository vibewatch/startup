      - number: '2.5'
        title: 约束、负面证据和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并非没有摩擦。高端价格是第一道约束：高端 AI / 自清洗设备仍是可选消费，容易受促销、弱消费信心和传统吸尘器替代影响。第二，品类有商品化风险。Research and Markets
              描述了中国头部品牌之间的高度集中和参数堆料；当许多厂商都宣传热水洗、AI 物体识别和高吸力时，差异化可能从硬件参数转向服务、可靠性和品牌信任。第三，电子元件、电池和传感器关税会改变到岸成本，或迫使中国总部厂商转向
              China-plus-one 组装。第四，随着扫地机器人加入摄像头和云端 AI，隐私和安全审查变得重要；消费者机构的负面报道为带摄像头产品制造了信任门槛。最大证据缺口是高端自动清洗拖布 SAM
              的精确规模、Narwal 在该细分中的已验证份额，以及可比渠道毛利率。
