companyProfile:
  summary: >-
    Narwal Robotics 是云鲸智能旗下消费品牌。公司位于深圳，由张峻彬在 2016 年从李泽湘 / xBotPark 机器人生态中创办，设计并销售高端 AI 扫拖机器人系统，包括 Freo X Ultra、Freo Z10
    / Z Ultra、Freo Pro、S-series，以及履带式拖布旗舰 Flow 和 Flow 2。其差异化来自自清洁基站、DirtSense 脏污感知、热水洗拖布、Tri-Laser/LIDAR 导航和 NarMind Pro
    AI 系统。Narwal 报告 2024 年收入约 US$200M（同比增长约 130%，海外增长约 7 倍），累计用户超过 300 万，覆盖 30+ 国家，员工超过 1,000 人，并声称拥有约 800
    项专利。公司仍为未上市后期企业，2024 年 12 月完成约 US$70M 融资，据报估值约 US$1.4B；2025 年 4 月又完成约 US$100M 的 Series E / pre-IPO 融资，由 Tencent
    和北京机器人产业发展投资基金领投，早期投资方包括 ByteDance 和 Source Code Capital。
