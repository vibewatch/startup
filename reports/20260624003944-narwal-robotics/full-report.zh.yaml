      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Roborock (688169.SH)
        - 2026E EV / 收入、EV / EBITDA、P/E
        - ~0.84-1.1x EV / 收入；~9-11x EV / EBITDA；~12-18x P/E
        - 最接近的中国公开市场扫地机器人龙头，且有盈利市场数据
        - 已上市、规模更大且已盈利；不是私人成长轮
      - - Ecovacs (603486.SH)
        - 2026E EV / 收入、EV / EBITDA、P/E
        - ~1.1x EV/Revenue；~9x EV/EBITDA；十几倍中段 P/E
        - 公开家用机器人同业，也是中国消费机器人基准
        - 家电品类组合更宽，且是成熟上市公司
      - - Dreame Technology
        - Pre-IPO 估值 / 收入
        - 2025 年收入 >400 亿元，对应约 700 亿元（$9.6B）估值；约 1.7x 收入
        - 最佳私营 IPO 路径可比对象，也是品类动能指标
        - 规模远大于 Narwal，报道中的全球份额也更强
      - - iRobot / Roomba
        - M&A 和困境状态
        - $1.7B Amazon 交易终止；随后成为重组 / 下行情景先例
        - 消费机器人战略退出和下行参照
        - 美国老牌公司，成本基础不同，且已走向困境
      - - Narwal Robotics
        - 报道的私募估值 / 收入
        - 约 $200M 收入对应约 $1.4B 估值；隐含约 7x 收入
        - 标的公司估值锚
        - 收入、利润率和股权结构条款未经公开审计
    notes: 可比组并不完整，但有意覆盖已盈利上市同业、私营 pre-IPO 同业和战略退出下行案例；倍数估算已四舍五入，使用抓取的 2026 年市场数据或报道的私募轮估值。
    enumerationScope:
      coverage: partial
      basis: >-
        Representative valuation comparables in robotic vacuum, home robotics, and consumer robotics with fetched public
        data as of runDate 2026-06-24.
