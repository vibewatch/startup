            body: >-
              投资流程应把 Narwal 的风险画像转成可监控触发器，而不是泛泛的观察清单。危机中创始人带队响应是一项优势，因为速度重要；但这也是关键人和流程风险信号：真正耐久的问题是，Narwal
              是否把发布管理、安全治理、供应商冗余和客服升级机制制度化。最重要的缓释要求包括：第三方安全认证和渗透测试历史、详细事故复盘、头部供应商和头部渠道收入结构、SKU 级 HTS 分类、法律准备金和 Cadence
              案件姿态、保修 / 退货指标，以及按地区拆分的月度毛利桥。否决条件应当客观：有名监管机构就摄像头 / 隐私采取行动、再次发生全车队变砖事件、Cadence 诉讼出现重大不利进展、关税负担升至超过定价能力，或
