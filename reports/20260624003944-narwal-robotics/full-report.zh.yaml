  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序和投资含义
        blocks:
          - type: paragraph
            body: >-
              Narwal Robotics 应按高风险高端消费硬件公司承销，而不是简单家电厂商。负面证据异常具体：据报的全队列变砖危机、韩国监管方关于摄像头 / 隐私漏洞的发现、ADA 网站无障碍诉讼、Cadence 针对
              Narwal 品牌中国关联方的 IP 诉讼、中国原产关税敞口，以及依赖平台的美国分销。最高残余风险是隐私 / 安全、IP /
              出口管制尾部风险和可靠性可重复性，因为每一项都可能损害联网家庭产品的信任。关税和扫地机器人价格竞争略低一档，因为它们主要压缩利润率和转化率，而不是立即阻断运营。缓释成熟度不均衡：危机响应看起来可信，但独立安全认证、云架构、经审计财务、供应商地图和
              SKU 级关税分类并未公开。投资上，这一风险画像支持估值折价、分阶段尽调，以及在形成确信前设定明确 kill criteria。
