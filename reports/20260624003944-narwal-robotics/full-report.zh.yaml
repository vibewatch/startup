              Narwal 的锁定真实存在，但不是堡垒。家庭完成房间建图、设置禁区、购买耗材并信任机器人的摄像头或传感器之后，切换会有摩擦；但它也很容易用手持吸尘器、人工拖把、清洁服务或第二台机器人多归属。除非 Narwal
              的湿拖自动化对买家的地面组合明显更优，否则定价权有限。因此，最强护城河是使用场景的具体性——重视卫生和低维护的硬地板家庭——而不是泛化的机器人吸尘霸权。最弱护城河是通用高端基站硬件，因为同业正在向自集尘、热水或拖布清洗基站、防缠绕系统和
