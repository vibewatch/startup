      - number: '8.4'
        title: 牛市、基准、熊市和可比估值组
        blocks:
          - type: paragraph
            body: >-
              估值框架应基于收入倍数，而不是盈利倍数，因为 Narwal 没有公开审计利润序列，仍处在 pre-IPO 路径上。牛市情形下，Narwal 证明公开数据已经滞后：审计收入接近 $800 million 到 $1
              billion，国际增长保持异常强劲，尽管有关税毛利仍守住，IPO 市场给出 3-4x 收入倍数。这可以支撑 $3-4 billion
              退出，但属于高执行情形。基准情形假设收入扩张、可比公司倍数保持克制；在更被证明的收入基础上给 2-3x 倍数，得到约 $1.0-1.6 billion，接近媒体所称估值，不足以产生 venture
              回报。熊市情形严峻但合理：产品可靠性、隐私整改、关税成本或竞争性定价，把倍数压向公开同业，带来 $300-700 million 的重定价。可比表刻意纳入 Roborock、Ecovacs、Dreame 和
