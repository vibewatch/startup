      - number: '2.3'
        title: 买方、用户、付款方和渠道分层
        blocks:
          - type: paragraph
            body: >-
              Narwal 的经济买方通常是家庭，但影响力分散在付款者、承受清洁结果的人、零售信任和平台便利性之间。高收入业主和租户是最明显的付款方，因为功能最完整的设备价格在 USD 500
              以上；用户包括负责日常地面清洁的成年人、处理毛发和猫砂的宠物主人、有幼儿的家庭，以及希望减少体力清洁负担的老人或照护者。渠道塑造购买路径。Mordor 称线上平台是 2025 年主导分销路径，Future
              Market Insights 预计线上零售商在 2026 年仍居核心，Narwal 也通过 Amazon、Best Buy 和 DTC 店铺可见。Amazon 和 Best Buy
              用评论、分期、退货和比价降低搜索摩擦；DTC 让 Narwal 推新机型并捆绑耗材。这一组合降低分销门槛，也降低切换成本，因为消费者几分钟内就能比较
              Roborock、Ecovacs、Dreame、SharkNinja 和 Narwal 的吸力、基站功能和促销。
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
