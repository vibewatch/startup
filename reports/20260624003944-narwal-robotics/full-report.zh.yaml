      - number: '8.3'
        title: 融资背景、稀释阴影，以及价格是否站得住
        blocks:
          - type: paragraph
            body: >-
              Narwal 的融资记录在赞助方质量上有吸引力，但可投资精度不足。Narwal 2025 年 pre-IPO 轮被一致描述为 $100 million、Tencent
              支持，私人数据库也指向后期融资和独角兽估值。但公开市场没有 cap table、没有优先权安排、没有 primary / secondary 拆分、没有审计后的 2025
              年收入，也没有已提交的招股书。这些缺项很重要，因为以高价进入后期轮的投资人，可能被下一轮 pre-IPO primary 融资稀释，被更强优先条款压后，或被锁进疲弱的 IPO 窗口。核心价格测试很简单：如果
              Narwal 2024 年收入约 $200 million，$1.4 billion 的估值就等于约 7x 收入。相比 Roborock 约 0.8-1.1x EV/Revenue、Ecovacs 约
              1.1x、Dreame 尽管收入大得多也约 1.7x，这一水平偏贵。因此，除非 2025-2026 年收入显著高于现有数据库暗示，公开证据并不支持该价格。
