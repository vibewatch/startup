  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Narwal 是一家可信的高端消费机器人公司，但估值证据指向的是价格问题，而不是公司质量问题。2024 年末接近 $1.4 billion 的独角兽语境，以及 2025 年 $100 million
              pre-IPO 轮，说明成熟投资人仍想配置这一品类，尤其是 Tencent 支持、拥有国际分销的 AI 硬件。约束在于，公开收入证据仍停留在 2024 年约 $200
              million，因此在任何优先清算权、primary 稀释、IPO 折价或锁定期风险之前，隐含入场倍数约为 7x 收入。公开扫地机器人同业不支撑这一倍数：Roborock 和 Ecovacs 的远期
              EV/Revenue 约 1x，盈利倍数在低到中双位数；规模更大的 Dreame pre-IPO 进程据称更接近 1.7x 收入。建议为跟踪 /
              继续研究，信心中等、风险高。现有持有人若成本或优先权保护有利，可以继续持有；新投资人应要求更低入场价格，或要求经过审计的 2025-2026 年数字，把远期倍数压到 3x 以下。
