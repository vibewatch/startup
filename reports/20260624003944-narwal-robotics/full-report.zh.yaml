        - 官方 Saros Z70 高端产品页和公开规模证据
        - OmniGrip 机械臂、一体式基站、导航和高端 App 体验
        - 实际折扣和区域组合未知
        - 功能旗舰可能把消费者预期抬到 Narwal 之上
      - - Ecovacs
        - 官方 X8 Pro OMNI 页面，定位为自动集尘扫拖产品
        - 高吸力、边角清洁、防缠绕、OMNI 基站
        - 公开页面未披露单机利润率
        - 在旗舰基站自动化和频繁促销上直接竞争
      - - Dreame
        - IPO 和 IDC 报道暗示高端领先；留存来源没有可用的具体型号页面
        - 评测和市场来源显示高吸力和广泛高端型号口碑
        - 私有折扣和具体型号毛利率未知
        - 全球扩张时可用更低价格或更多功能压过 Narwal
      - - Xiaomi
        - 官方 X20 Max 页面，把产品打包为生态扫地机器人
        - 扫拖自动化绑定 Xiaomi 智能家居界面
        - 区域定价和补贴策略不完全可见
        - 生态捆绑会挤压独立高端品牌
      - - iRobot
        - 官方 Roomba Combo 10 Max plus AutoWash Dock 页面
        - Roomba 品牌、扫拖组合、AutoWash 基站
        - 交易后战略和折扣不确定
        - 品牌信任仍在，但动能转弱可能限制反应
      - - Dyson
