        title: 退出准备度、论点破裂触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Narwal 的退出准备度只是部分到位。pre-IPO 轮、Tencent 参与、高端产品发布，以及 2026 年 Dreame IPO 基准，都让香港或 STAR
              类上市具备可能性，但可能性不等于准备就绪。可投资的问题在于，Narwal 能否披露审计财务，缩小私人估值与公开可比公司纪律之间的差距。战略退出不应作为基准情形：Amazon-iRobot
              说明，即使大型且逻辑清晰的收购方，也可能在反垄断压力下无法交割；iRobot 后来的重组也凸显，消费机器人可以多快从标志性品牌变成困境先例。因此，最终尽调要求聚焦把 Track 转成 Buy
              所需的证据：审计收入、按渠道和地区拆分的毛利、退货和保修率、安全整改证据、cap-table 优先权、IPO 申报时间表，以及管理层应对关税和数据本地化敞口的计划。论点破裂触发器包括：收入滞后且低于 $300
