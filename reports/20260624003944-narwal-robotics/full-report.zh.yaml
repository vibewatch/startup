  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入证明失败
        - 经审计的 2025 年收入低于 $300M，或 2026 年运行收入低于 $400M
        - 上一轮私募估值仍 > 远期收入 4x
        - 退出或拒绝新的一级投资
      - - 毛利率不及预期
        - 毛利率低于 30%，或保修 / 退货成本上升
        - 高端硬件逻辑变成商品硬件逻辑
        - 将估值倍数降至公开同业区间
      - - 安全修复未完成
        - 类似 KCA / KISA 的认证缺口未由独立方修复
        - 信任和国际扩张折价上升
        - 第三方审计前，不给买入建议
      - - 可靠性复发
        - 再次出现机队级宕机或大范围变砖事件
        - 云架构风险变成结构性风险
        - 除非公司拨备并发布 RCA，否则退出
      - - IPO 定价过高
        - IPO 或 pre-IPO 轮缺少经审计支撑，却高于远期收入 4x
        - 公开可比公司缺口扩大，锁定期风险上升
        - 卖出二级份额，或等上市后再看
      - - 战略退出受阻
        - 收购方路径依赖平台买方，但存在反垄断或数据主权顾虑
        - M&A 底价不可靠
        - 只按 IPO 退出承销，并下调终局倍数
    notes: 阈值是作者基于已抓取估值和风险证据设定的尽调触发项；不是公司指引。
    claimRefs:
      - CV010
      - CV011
      - CV023
      - CV036
      - CV039
      - CV047
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入
        - 2024-2026 年按地区、产品和渠道拆分的收入
        - 决定 7x 历史倍数是陈旧口径还是真实估值
        - 公司 CFO；IPO 招股书；审计师工作底稿
      - - 毛利率和保修经济性
        - 产品毛利率、退货率、保修准备金、运费 / 关税负担
        - 区分高端硬件与补贴驱动增长
        - 财务团队；渠道访谈；保修台账
      - - 股权结构和优先权
        - 清算优先权、反稀释、二级销售、期权池、债务
        - 决定真实下行和收益分配瀑布
        - 领投方律师；股权结构导出；融资文件
      - - 安全修复
        - Freo Z Ultra 认证、云端数据路径和 KISA / KCA 修复的独立报告
        - 隐私风险影响海外扩张和公开市场折价
        - CISO；第三方渗透测试；韩国修复往来函件
      - - 运营可靠性
        - 机队级变砖风险的根因分析和复发控制
        - 可靠性故障会摧毁消费者信任和毛利率
        - CTO / COO；事故复盘；支持工单队列
      - - IPO 路径
        - 交易所、保荐人、申报时间表、预期一级 / 二级配比、锁定期条款
        - 退出路径和稀释是后期回报的核心
        - 公司董事会；IPO 律师；保荐银行
    notes: 尽调问题按估值敏感度排序：先看经审计规模，再看经济性、条款、风险修复和退出机制。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV037
      - CV038
      - CV044
