      - number: '8.2'
        title: 围绕市场、产品、客户与风险的正反论点
        blocks:
          - type: paragraph
            body: >-
              多头论点是，Narwal 已经从单一产品小工具故事，走向高端家用机器人平台：Flow 和 Freo 反复推出，AI 清洁功能落地，国际渠道可见，后期投资人愿意为 pre-IPO 推进买单。如果 Narwal
              证明留存高、毛利强、全球零售份额扩大，产品节奏和品牌差异化可以支撑其相对普通消费硬件可比公司的溢价。反方同样直接：公司是私人公司，收入和累计融资额来自聚合数据库，缺少审计毛利，品类竞争残酷。Roborock
              的公开经验显示，收入增长可以和市值压缩并存；Korea Consumer Agency 的报道和 KrASIA
              的变砖危机叙事，也说明隐私、云可靠性和运营质量为什么必须压低干净的增长倍数。客户证明也大多是间接证据——渠道、装机量说法和产品发布——而不是签署的企业式经常性合同。这样的组合支持跟踪，不支持按公共软件式收入倍数承销一个
