            body: >-
              Narwal 的竞争集合比简单的扫地机器人同业列表更宽。直接的高端地面清洁对手是 Roborock、Ecovacs、Dreame 和 Xiaomi，因为它们都销售 app
              连接的扫拖机器人系统，基站自动化程度越来越高，消费者使用场景也重叠。iRobot / Roomba 仍是既有品牌参照点，即便 Amazon 交易失败削弱了其战略轨迹；Dyson
              则是相邻的高端清洁品牌，其机器人产品线争夺同一批高收入家庭清洁预算。替代品仍然强势：人工吸尘和拖地、手持吸尘器、定期清洁服务和家庭现状，都可能推迟高端基站购买。潜在进入者包括家电和智能家居生态公司，它们可以借既有渠道捆绑地面清洁硬件。因此，格局同时承受两股压力：中国专业玩家在功能广度和价格上竞速，既有品牌和替代品又压制支付意愿。这个基准很关键。
