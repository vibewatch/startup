  - id: TR005
    title: 缓释措施与终止标准
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 摄像头 / 隐私安全
        - 新监管方或零售商问询点名 Narwal
        - 任何正式执法、类似召回通知、强制补丁或产品下架要求
        - 暂停投资；要求独立安全审计和修复证明
      - - Cadence 知识产权诉讼
        - 案卷出现重大不利进展
        - 禁令、不利实体裁决、限制性和解或重大准备金
        - 重新评估法律风险；资金到账前由律师复核
      - - 可靠性 / 变砖
        - 联网机队宕机或大规模缺陷
        - '>7 天未解决、>5% 活跃设备受损，或再次出现全机队变砖'
        - 根因和控制措施未证实前，视为投资逻辑破裂
      - - 关税 / 到岸成本
        - 美国关税负担或海关摩擦上升
        - 核心 SKU 到岸成本上升 >15 个百分点，且没有定价权
        - 重做单位经济模型；要求中国以外缓释方案
      - - 渠道依赖
        - Amazon 或 Best Buy 中断
        - 下架、排名受压、退货激增，或单一渠道销售集中度 >30%
        - 下调收入质量；要求渠道多元化证明
      - - 私营财务不透明
        - 跑道 / 利润率证据缺失
        - 管理层无法提供现金跑道、SKU 利润率、保修准备金和营运资本桥
        - 不按超过继续研究 / 跟踪的口径承销估值
      - - 执行 / 关键人
        - 创始人或 QA / 安全负责人动荡
        - CEO 离职、QA / 安全负责人变动，或没有具名责任人
        - 要求复核治理后备梯队和运营节奏
    notes: 阈值是投资人尽调触发项，不是公司指引；其中多项需要管理层私有数据才能精确监测。
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR040
      - CR041
      - CR042
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 产品和融资证据可信，但公开可比公司不支撑该估值
        - 没有经审计的 2025-2026 年财务数据前，不按披露估值入场
      - - 置信度
        - 中
        - 已抓取 39 个来源，但 Narwal 财务仍是私有且由聚合方报告
        - 足以设定价格纪律；不足以精确承销
      - - 风险评级
        - 高
        - 隐含收入倍数 7x，叠加隐私、可靠性风险，以及中国监管 / 关税敞口
        - 要求更低入场价、强优先权保护，或公开申报文件证明
      - - 估值立场
        - 偏高
        - Narwal 估值约 $1.4B / 收入约 $200M；Roborock / Ecovacs 接近约 1x EV/Revenue，Dreame 约 1.7x
        - 价格必须回落，或收入必须远高于公开证据
      - - 目标回报
        - 新创投入场至少需要 3x 净回报
        - 按约 $1.4B 入场，稀释后可能需要 $5-7B 退出
        - 仅凭当前公开证据无法承销
      - - 持有 / 退出观点
        - 仅低成本基准或有优先权保护的投资人可持有；若估值高于远期收入 4x，应减持
        - 优先权条款和锁定期未知
        - 若 IPO 定价激进，现有投资人应寻求二级流动性
    notes: 建议来自作者对已抓取融资、私募市场和公开可比公司证据的分析；所有回报目标仅作示意，并假设承担创投式后期风险。
    claimRefs:
      - CV025
      - CV027
      - CV028
      - CV029
      - CV030
      - CV046
      - CV047
  - id: TV002
    title: 投资逻辑 / 反逻辑表
    columns:
      - 立场
      - 论点
      - 证据基础
      - 观点改变条件
    rows:
      - - 投资逻辑
        - 高端产品迭代节奏和 AI 功能可支撑硬件平台溢价
        - CES 2025 和 CES 2026 Narwal 发布材料
        - 经审计数据若显示复购弱、退货率高或毛利率缺乏差异化
      - - 投资逻辑
        - 后期投资人支持验证 IPO 路径仍有可选性
        - 报道称 $100M pre-IPO 轮有 Tencent 和 Beijing Robot Fund 参与
        - 2026 年底前没有招股书，或申报前出现 down-round
      - - 投资逻辑
        - 消费机器人品类有战略和公开市场可比样本
        - Roborock、Ecovacs、Dreame 和 iRobot 提供参照案例
        - 可比公司倍数继续压缩，或 IPO 窗口关闭
      - - 投资逻辑
        - 国际增长可把收入基准抬到陈旧公开数据库之上
        - 36Kr / CB Insights 指向 2024 年高速增长和约 $200M 收入
        - 经审计的 2025 年收入低于 $300M
      - - 反逻辑
        - 披露估值隐含约 7x 收入，远高于可比公司
        - Narwal $1.4B 估值除以约 $200M 收入；Roborock / Ecovacs 约 1x
        - 经审计收入高于 $500M，且估值低于远期收入 3x
      - - 反逻辑
        - 隐私和可靠性事件足以压低估值
        - KCA / KISA 报道 Freo Z Ultra 安全问题，KrASIA 报道变砖危机
        - 独立认证、修复报告，以及低保修 / 退货证据
      - - 反逻辑
        - 战略退出路径风险高
        - Amazon-iRobot 交易在欧盟压力下失败，iRobot 随后陷入困境
        - 多个可信买方，且没有反垄断或数据主权冲突
      - - 反逻辑
        - 优先权和稀释条款未知
        - 私营公司股权结构未披露
        - 交付完整股权结构、优先权清算瀑布和二级参与时间表
    notes: 论点按估值重要性筛选，并非穷尽公司评估；各行直接对应会推动建议变化的因素。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV023
      - CV025
      - CV037
      - CV040
      - CV041
      - CV043
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 收入接近 $800M-$1B；毛利率能守住；IPO 市场按 3-4x 收入给高端机器人定价
        - $3.0-$4.0B 退出；按 $1.4B 入场、稀释前毛回报约 2.0-2.8x
        - 关税、隐私、竞争和 IPO 窗口风险
        - 2025/26 年经审计收入 >$500M，已提交招股书，且利润率扩大
      - - 基准
        - 收入增长，但公开可比公司倍数守在 2-3x 收入；没有重大宕机或安全复发
        - $1.0-$1.6B 公允价值；稀释前持平到小幅上行
        - 新资金回报不足；优先权堆栈可能吸收价值
        - 经审计收入 $350M-$500M，且估值低于远期收入 3x
      - - 熊市
        - 增长放缓；隐私 / 可靠性问题未解决；公开可比公司仍接近约 1x 收入
        - $300M-$700M 重新定价；较披露估值减值 50-80%
        - Down-round、IPO 延后，或被迫战略出售
        - 2025 年收入 < $300M、再次出现机队宕机，或 IPO 推迟到 2026 年以后
    notes: 估值区间是企业价值结果估算，不是公司指引；收入倍数由公开 Roborock / Ecovacs 数据和 Dreame 私募市场报道交叉推算。
    claimRefs:
