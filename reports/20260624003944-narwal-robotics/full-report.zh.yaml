        title: 差异化、IP 和设计验证
        blocks:
          - type: paragraph
            body: >-
              Narwal 最强技术差异化集中在拖布卫生和自主维护：热水洗拖布、自动烘干、DirtSense 复拖逻辑、FlowWash
              滚动拖布机制，以及把令人不快的维护任务从用户身上移开的基站。这是对通用扫地机器人的真实切口，因为拖地质量、异味控制和基站清洁度，是用户在建图新鲜感退去后会持续感知的任务。IP
              故事方向上可信——外部公司资料和买家指南描述其拥有数百项专利，共享尽调简报则把组合框定在约 800 项专利——但本章没有完成公开专利族分析。第三方验证包括 Freo Z Ultra 获得 CES
              Innovation Awards 可见度，以及 Flow 据报获得 iF Design Award 认可。在功能接近品类标准的地方，护城河更窄：吸力、LiDAR、app
              地图和语音控制在中国高端竞争者中已广泛可得。
