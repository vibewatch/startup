        title: 客户工作流和 SKU 地图
        blocks:
          - type: paragraph
            body: >-
              Narwal 提供的是消费者家庭清洁工作流，而不是单一用途电器：买家用移动 app 或语音助手建图、选择日程或分区，然后让机器人吸尘、拖地、回基站、清洗并烘干拖布；部分配置还可低干预处理水和尘。SKU 地图已从
              Freo X Ultra、Freo Z Ultra 等高端扫拖机器人系统，扩展到 Freo Z10 Ultra、Freo Pro 和 S-series 机型，以及 Flow / Flow 2 履带式拖布架构和
              2026 年展示的相邻 V50 手持吸尘器、U50 除螨仪。战略含义是，Narwal 正围绕拖布卫生搭建家庭清洁平台，而不只是追逐吸力参数。这一重点在硬地板家庭有价值，但也意味着重地毯家庭和区域 SKU
              可得性仍是尽调问题。
