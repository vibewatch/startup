      - number: '7.3'
        title: 运营、质量、召回与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Narwal 的运营故事有两面信号。负面信号是媒体称曾发生大规模变砖事件，影响约一半设备和数十万用户；对联网机器人车队来说，这是严重可靠性事故，因为软件或云端缺陷可能同时让大批设备失效。缓释信号是 Narwal
              据称快速维修或退回设备，并借此重塑团队、流程和产品策略。这一缓释真实存在，但不足以定论：持久的质量控制需要看到发布门禁、分阶段
              rollout、回滚流程、事故报告、保修准备金和现场故障率证据。所审阅的公开美国召回数据库未显示 Narwal 召回，这是积极信号，但召回缺席只能持续监控，不能当作安全证明。以中国为中心的制造、芯片 /
              LiDAR / 摄像头供应商不透明，以及物流敞口，都留下了公开证据无法量化的残余风险。
