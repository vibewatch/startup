    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              Narwal Robotics 是与云鲸智能关联的消费品牌，卖的不是工业机器人，而是高端机器人清洁电器：自清洗扫拖机器人、旗舰 Freo 和 Flow 系列、无线手持吸尘器和除螨产品。公司自称 2016
              年成立、总部位于深圳，商业重点是家庭智能清洁设备，通过官方 DTC 网站、Amazon、Best Buy
              类零售渠道和国际分销商销售。部分公开资料提到东莞或更宽泛的大湾区孵化历史，因此本章把深圳作为主要总部表述，同时保留地点模糊性，将其列为尽调缺口，而不是强行贴合某一份资料。一句话概括：Narwal 是一家高端 AI
              家庭清洁硬件公司，收入来自专有导航、拖地、基站自清洁和 app 生态，并靠全球零售分销支撑，而非经常性 SaaS 合同模式。
