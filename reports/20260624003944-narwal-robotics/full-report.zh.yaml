      - number: '7.2'
        title: 监管、法律、隐私和安全风险
        blocks:
          - type: paragraph
            body: >-
              法规 / 法律台账是本章负面证据的核心。Korea Consumer Agency 的材料是一手监管证据，说明扫地机器人可能被当作带摄像头的 IoT 隐私设备处理，而不只是地面清洁家电。后续媒体报道点名了包括
              Narwal Freo Z Ultra 在内的中国机型，抬高了未来任何安全失误的严重性。Lopez v. Narwal 范围更窄，但仍然相关，因为 Narwal
              通过消费电商渠道销售，网站无障碍问题可能在结账和支持流程中反复出现。Cadence 在加州北区针对 Narwal 品牌中国实体提起的诉讼带来更深的法律阴影，尤其是 Cadence
              另有出口管制和解，显示半导体设计软件流向中国的敏感性。最后，Section 301 关税和小额豁免调整会在 2026 年增加到岸成本摩擦；即便美国尚未针对 Narwal 执法，美国对智能家居 /
              摄像头的审查仍是合理的前瞻风险。
