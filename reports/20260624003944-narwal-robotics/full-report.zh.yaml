              产品问题据称导致大批设备变砖或失效，之后管理层将事件转化为流程改进案例。韩国媒体援引消费者机构和安全机构测试，报道含摄像头的中国扫地机器人存在漏洞，其中包括 Narwal Freo Z Ultra。2025
              年，Narwal Robotics Corporation 在纽约南区法院遭遇 ADA 网站无障碍诉讼，后续中止或驳回。这些事项不否定牵引力，但把尽调重心推向固件发布控制、隐私架构、客户支持和法律运营成熟度。
