        title: 创始人、领导层和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Narwal 的创始人叙事异常居中。公开履历显示，张峻彬是创始人兼 CEO，约 1990 年出生，曾就读于华中科技大学和上海交通大学，在 xBotPark / 李泽湘机器人生态中受指导，并于 2019 年入选
              Forbes China 30 Under 30。独立领导层名单在张之外披露很薄，只能看到 Gloria Sun 等营销 /
              传播负责人，以及若干运营或区域角色；这些角色的公开可见度远弱于创始人。这带来关键人尽调问题：Narwal 的品牌故事、产品策略、融资叙事和危机响应都与张峻彬紧密绑定，而公开记录中缺少独立董事会、CFO、CTO
              或可接班运营团队的充分证据。因此，领导层表格只能给出部分覆盖，并要求后续尽调拿到当前组织架构、董事会构成、创始人持股和决策权，再判断治理质量。
