            body: >-
              Narwal 的 land-and-expand 是消费者生态循环：家庭通过评论或零售搜索发现品牌，购买一台扫拖机器人，再购买专有耗材或配件套件，之后可能升级到更高端的
              Freo、Flow、S-series，或手持 / 除螨设备。这创造了一定扩张潜力，却没有企业锁定，也让业务依赖产品节奏、平台算法、评分、促销、退货政策和客户支持。渠道集中度无法公开量化；Amazon、Best
