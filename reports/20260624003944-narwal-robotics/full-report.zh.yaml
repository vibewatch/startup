      - number: '7.4'
        title: 伙伴、渠道依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Narwal 可见的 go-to-market 足迹依赖 DTC、Amazon 和 Best
              Buy，战略上有用，运营上却脆弱。平台排名、零售选品、评价质量、退货率和平台政策变化，都可能比公司自有渠道补位更快地拉动需求。在成本端，公司很可能是中国来源的硬件结构；除非能转嫁给价格敏感的消费者，关税、海关手续、零部件成本和汇率都会侵蚀毛利。竞争压力也已经可见：独立报道显示
              Roborock 和 Ecovacs 收入增长但利润下滑，支撑了扫地机器人走向商品化的更大判断。专有配件和耗材可能改善复购经济性，但如果用户感到被锁定，也会变成声誉风险。Narwal 是私人公司，烧钱速度、现金
              runway、SKU 毛利、渠道集中度和营运资本强度仍是重大尽调缺口，而不是有审计支撑的模型输入。
