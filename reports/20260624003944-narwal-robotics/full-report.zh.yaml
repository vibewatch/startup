            body: >-
              运营模型是一套分层硬件软件栈。在地面层，吸尘电机、防缠绕刷、拖布或 FlowWash 履带拖布、水泵、水箱、电池和自清洁基站负责物理清洁与维护。在感知层，高端产品把 LiDAR 或 Tri-Laser 式导航与双
              RGB 摄像头、AI 芯片结合；Narwal 将这种高层决策能力命名为 NarMind Pro，并用 DirtSense 在检测到残留脏污时调整清洁或洗拖布行为。在控制层，Narwal
