      - number: '2.2'
        title: TAM、SAM 和 SOM：多套测算口径
        blocks:
          - type: paragraph
            body: >-
              公开的 2026 年市场规模估计异常分散。Mordor 修正后的扫地机器人 URL 给出保留样本中最低的 2026 年估计，为 USD 7.05B；IndustryResearch.biz 给出最高点估计，为
              USD 14.023B；Research and Markets、The Business Research Company 和 Future Market Insights 集中在约 USD
              12.5-12.7B。Fortune 和 Business Research Insights 偏低，约 USD 8-9B，但仍指向双位数增长。因此，本报告采用的基础 TAM 为 USD 12-14B，低情形约
              USD 7-9B，高情形约 USD 14B（2026 年）。SAM 更窄：面向住宅家庭、通过线上、零售和 DTC
              渠道销售的高端自动清洗扫拖机器人系统。由于保留样本中没有发布方直接拆出“高端自清洗拖地组合”收入，SAM 必须从 USD 500+ 高端、智能联网、扫拖一体和线上渠道占比建模。Narwal SOM
              最适合作为该高端细分中的 8-10% 情景，而非已验证的份额披露。
