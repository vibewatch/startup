  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Alternatives
        blocks:
          - type: paragraph
            body: >-
              Narwal’s competitive set is broader than a simple robot-vacuum peer list. The direct premium floor-care
              rivals are Roborock, Ecovacs, Dreame and Xiaomi, because all sell app-connected robot vacuum/mop systems
              with increasingly automated base stations and overlapping consumer use cases. iRobot/Roomba is the
              incumbent brand reference point even after the failed Amazon transaction weakened its strategic
              trajectory, and Dyson is an adjacent premium-cleaning brand whose robot product line competes for the same
              high-income household cleaning budget. Substitutes remain powerful: manual vacuuming and mopping, stick
              vacuums, periodic cleaning services and the household status quo can all delay a premium dock purchase.
              Likely entrants include appliance and smart-home ecosystem companies that can bundle floor-care hardware
              through existing channels. The landscape therefore has two simultaneous pressures: Chinese specialist
              peers are racing on feature breadth and price, while incumbents and substitutes constrain willingness to
              pay. That benchmark matters.
