      - number: '8.2'
        title: Thesis and Anti-thesis Across Market, Product, Customers, and Risk
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is that Narwal has moved beyond a single-product gadget story into a premium home-robotics
              platform with repeated Flow and Freo launches, AI cleaning features, international channel visibility, and
              late-stage investors willing to fund a pre-IPO push. Product cadence and brand differentiation could
              justify a premium to ordinary consumer-hardware comps if Narwal proves high retention, strong gross
              margin, and expanding global retail share. The anti-thesis is equally direct: the company is private,
              revenue and total capital raised are aggregator-reported, audited margins are absent, and the category is
              harshly competitive. Roborock’s public experience shows that revenue growth can coexist with market-value
              compression, while Korea Consumer Agency coverage and KrASIA’s bricking-crisis narrative show why privacy,
              cloud reliability, and operational quality must reduce a clean growth multiple. Customer proof is also
              mostly indirect—channels, installed base claims, and product launches—not signed enterprise-style
              recurring contracts. That mix supports tracking, not underwriting a venture mark at public-software-like
              revenue multiples.
            claimRefs:
              - CV009
              - CV010
