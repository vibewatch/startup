      - number: '7.3'
        title: Operational, Quality, Recall and Supply-Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Narwal’s operational story has two opposing signals. The adverse signal is a reported mass bricking event
              that affected roughly half the fleet and hundreds of thousands of users; for a connected robot fleet, that
              is a severe reliability incident because a software or cloud-side defect can simultaneously disable
              devices at scale. The mitigating signal is that Narwal reportedly repaired or returned units rapidly and
              used the event to overhaul people, processes and product strategy. That mitigation is real but not
              dispositive: durable quality control requires evidence of release gates, staged rollouts, rollback
              procedures, incident reporting, warranty reserves, and field-failure rates. Public US recall databases did
              not show a Narwal recall in the sources reviewed, which is positive, but recall absence should be
              monitored rather than treated as proof of safety. China-centric manufacturing, chip/LiDAR/camera supplier
              opacity, and logistics exposure add residual risks that are not quantifiable from public evidence.
