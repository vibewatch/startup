              right top-line signals—about $200 million of 2024 revenue, reported 130% growth, nearly 700% overseas
              growth, broad retail distribution and a premium product ladder. The weaknesses are equally clear: revenue
              is mostly one-time hardware; recurring consumables appear real but unsized; gross margin, net margin, CAC,
