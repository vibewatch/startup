      - number: '7.5'
        title: People, Execution, Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The investment process should convert Narwal’s risk profile into monitorable triggers instead of a generic
              watchlist. Founder-led crisis response is a strength when speed matters, but it is also a key-person and
              process-risk signal: the durable question is whether Narwal institutionalized release management, security
              governance, supplier redundancy and customer-support escalation. The most important mitigation asks are
              third-party security certifications and penetration-test history, detailed incident postmortems,
              top-supplier and top-channel revenue mix, SKU-level HTS classifications, legal reserves and Cadence case
              posture, warranty/return metrics, and monthly gross-margin bridge by geography. Kill criteria should be
              objective: named regulator action on camera/privacy, another fleet-wide bricking incident, material
              adverse Cadence litigation development, tariff burden rising beyond price power, or channel delisting on
              Amazon/Best Buy. If these appear, the thesis shifts from “premium hardware scale-up with risks” to
              “connected-home trust and margin impairment.”
