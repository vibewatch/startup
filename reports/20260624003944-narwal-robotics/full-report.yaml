              Chinese robot vacuums, including Narwal Freo Z Ultra, had security or privacy weaknesses; independent
              newspapers framed the issue around camera/photo access and authentication risk. That directly challenges
              Narwal’s privacy-forward positioning for camera-equipped robots. The fix may be firmware, app
              authentication and cloud-policy hardening, but this chapter did not find an independent remediation audit.
