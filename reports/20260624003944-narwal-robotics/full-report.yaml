companyProfile:
  summary: >-
    Narwal Robotics is the consumer brand of Yunjing Intelligent Technology, a Shenzhen-based robotics company founded
    in 2016 by Junbin Zhang out of the Li Zexiang / xBotPark robotics ecosystem. It designs and sells premium AI-powered
    robot vacuum-and-mop systems—including the Freo X Ultra, Freo Z10 / Z Ultra, Freo Pro, S-series and the track-mop
    Flow and Flow 2 flagships—distinguished by self-cleaning base stations, DirtSense dirt-sensing, hot-water mop
    washing, Tri-Laser/LIDAR navigation and the NarMind Pro AI system. Narwal reports ~US$200M of 2024 revenue (up ~130%
    YoY with ~7x overseas growth), more than 3 million cumulative users across 30+ countries, over 1,000 employees and
    roughly 800 claimed patents. The company is privately held and late-stage, having raised a ~US$70M December 2024
    round at a reported ~US$1.4B unicorn valuation and a ~US$100M April 2025 Series E / pre-IPO round led by Tencent and
    the Beijing Robot Industry Development Investment Fund, with prior backers including ByteDance and Source Code
    Capital.
  foundedDate: '2016-01-01'
  founders:
    - name: Junbin Zhang (张峻彬)
      role: Founder & CEO
      background: >-
        Engineering graduate linked to Huazhong University of Science and Technology and Shanghai Jiao Tong University;
        incubated in the Li Zexiang / xBotPark robotics ecosystem and named a Forbes China 30 Under 30 honoree.
      claimRefs:
        - CO007
        - CO008
  foundingLocation: Shenzhen, China (xBotPark / Greater Bay Area ecosystem)
  headquarters: Shenzhen, China; US office in Irvine, CA
  productSummary: >-
    Premium robot vacuum-and-mop systems with self-cleaning, auto-refill/drain base stations: Freo X Ultra, Freo Z10 / Z
    Ultra, Freo Pro, S-series, the track-mop Flow and Flow 2 flagships, plus cordless stick (V50) and mattress (U50)
    vacuums, featuring DirtSense AI, hot-water mop washing, Tri-Laser/LIDAR navigation, dual RGB AI cameras and the
    NarMind Pro system.
  customerFocus: >-
    Mid-to-high-income households (pet owners, hard-floor and time-constrained homes, smart-home adopters and
    aging-population segments) in the US, Europe and China, reached through Amazon, Best Buy and direct-to-consumer
    channels.
  businessModel: >-
    Predominantly one-time premium hardware sales (~US$400-1,500 price band) through online marketplaces and retail,
    with limited recurring revenue from proprietary cleaning solution, accessories and replacement parts.
  stage: Private, late-stage (Series E / pre-IPO)
  fundingStatus: >-
