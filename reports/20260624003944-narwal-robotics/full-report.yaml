        title: Identity, Headquarters and Business Model
        blocks:
          - type: paragraph
            body: >-
              Narwal Robotics is the consumer brand associated with Yunjing Intelligent Technology and sells premium
              robotic cleaning appliances rather than industrial robots: self-washing robot vacuums and mops, flagship
              Freo and Flow lines, cordless stick vacuums and mattress-cleaning products. The company presents itself as
              founded in 2016, headquartered in Shenzhen, and commercially focused on household smart-cleaning devices
              sold through official direct-to-consumer sites, Amazon, Best Buy-style retail channels and international
              distributors. Some public profiles describe Dongguan or broader Greater Bay Area incubation history, so
              this chapter treats Shenzhen as the primary headquarters claim while preserving location ambiguity as a
              diligence gap rather than overfitting one profile. The one-line model is premium AI-enabled home-cleaning
              hardware with proprietary navigation, mopping, base-station self-cleaning and app ecosystem revenue,
