        title: Exhibits
        blocks:
          - type: callout
            title: Track, Do Not Chase the Unicorn Mark
            body: >-
              Narwal looks like a real premium robotics asset, but a roughly 7x revenue mark is not supported by public
              robotic-vacuum peers or Dreame’s private pre-IPO benchmark. The investable path is to wait for audited
              revenue and a lower forward multiple.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV029
