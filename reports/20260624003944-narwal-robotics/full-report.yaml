              same household, not a procurement department or named enterprise account. The highest-confidence segments
              are premium households with hard floors, pet owners dealing with hair, families with children and mixed
              messes, tech-forward early adopters comfortable with app-led navigation, and seniors or
              mobility-constrained users seeking low-effort floor care. Geography is broad but retail evidence is
              strongest in the United States and other online-heavy markets; official copy says Narwal has entered 30+
              markets, while company-profile research reports >1.8 million users and a 2025/2026 goal of >3 million
              global users. Channels are fragmented: Narwal's DTC site offers returns, financing, and support; Amazon
              provides discovery and social proof; Best Buy supplies big-box credibility; Costco search creates
              membership-retail discovery, although live product detail evidence is thin. This framing limitation
