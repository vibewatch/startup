  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Narwal’s relevant market is not all home robotics. The investable boundary is the residential robot vacuum
              and mop combo category: autonomous floor-cleaning robots, self-empty/refill/wash docking stations, app and
              cloud control, firmware intelligence, replacement brushes/filters/mop pads, and accessories that attach to
              recurring floor-cleaning use. This boundary includes premium hybrid products such as Narwal Flow 2 and
              Freo lines because the buyer is purchasing a time-saving household cleaning appliance, not a
              general-purpose robot. It excludes conventional cordless sticks, upright/canister vacuums, wet/dry
              vacuums, handheld mattress cleaners, pool/window robots, commercial scrubbers, humanoid home robots, and
              paid cleaning services. Those exclusions matter because many market pages mix floor, pool and window
              robots or residential and commercial devices, creating inconsistent TAM numbers. The status quo remains
              manual cleaning or a cheaper non-robot vacuum, so adoption depends on convenience, trust, cleaning
              performance and household willingness to pay rather than regulatory necessity.
