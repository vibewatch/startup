          - type: callout
            title: Valuation Risk Is the Primary Risk
            body: >-
              Privacy, reliability, tariffs, and IPO timing are important, but the dominant issue is price: at $200
              million of reported revenue, each turn of revenue multiple equals about $200 million of enterprise value.
            calloutType: risk
            claimRefs:
              - CV006
              - CV028
