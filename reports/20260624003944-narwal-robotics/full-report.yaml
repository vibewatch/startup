      - number: '6.4'
        title: Expansion, Channel Dependence, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Narwal's land-and-expand motion is a consumer ecosystem loop: a household discovers the brand through
              reviews or retail search, buys one robot vacuum/mop, buys proprietary consumables or accessory kits, and
              may later upgrade to higher-end Freo, Flow, S-series, or handheld/mattress-vacuum devices. This creates
              some expansion potential without enterprise lock-in, but it also makes the business dependent on product
              cadence, platform algorithms, ratings, promotions, return policies, and customer support. Channel
              concentration cannot be quantified publicly; Amazon, Best Buy, Narwal DTC, and possibly Costco each matter
              for discovery, but no channel revenue split is disclosed. Procurement friction is consumer-oriented:
              premium prices around $700-$1,500, heavy docks, replacement detergent/dust bags, privacy concerns from
              camera-enabled models, and support complaints can slow conversion or push buyers toward Roborock, Dreame,
              Ecovacs, eufy, iRobot, or cheaper white-label alternatives. The most important diligence ask is a
              channel-level cohort view: warranty claims, return rates, attach rates for consumables, repeat-device
              purchases, and review-score trend by model and geography.
            claimRefs:
