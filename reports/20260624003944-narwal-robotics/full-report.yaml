      - number: '3.4'
        title: Switching Cost, Moats and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Narwal’s lock-in is real but not fortress-like. A household that maps rooms, configures no-go zones, buys
              consumables and trusts a robot’s cameras or sensors faces friction when switching, yet it can multi-home
              easily with a stick vacuum, manual mop, cleaning service or second robot. That limits Narwal’s pricing
              power unless its wet-mopping automation is clearly superior for the buyer’s floor mix. The strongest moat
              is therefore use-case specificity — hard-floor households that value hygiene and low maintenance — not
              generalized robotic vacuum dominance. The weakest moat is generic premium-dock hardware, because peers are
              converging on self-emptying, hot-water or mop-washing docks, anti-tangle systems and AI obstacle
              avoidance. Adverse evidence is material: independent comparisons can point carpet-heavy buyers to Dreame
              or Roborock, while public scale and supply access may favor larger Chinese competitors. The risk register
              frames durability as a set of testable diligence items rather than a presumed winner-take-most outcome. In
              underwriting terms, Narwal should be valued as a strong premium contender in a fast-moving hardware
              category, not as an unassailable platform, until management proves repeat purchase, replacement-cycle
              retention, and sustained benchmark leadership across both wet and dry cleaning jobs.
