      - number: '7.4'
        title: Partner, Channel Dependency and Financial Model Risk
        blocks:
          - type: paragraph
            body: >-
              Narwal’s visible go-to-market footprint depends on DTC, Amazon and Best Buy, which is strategically useful
              but operationally fragile. Marketplace ranking, retail assortment, review quality, return rates and
              platform policy changes can move demand faster than company-owned channels can compensate. On the cost
              side, the company likely faces a China-origin hardware structure where tariffs, customs formalities,
              component costs and FX can erode gross margin unless passed through to price-sensitive consumers.
              Competitive pressure is also visible: independent reporting that Roborock and Ecovacs grew revenue while
              profits slipped supports the broader robot-vacuum commoditization thesis. Proprietary accessories and
              consumables may improve repeat economics but can become a reputational risk if customers perceive lock-in.
              Because Narwal is private, burn, runway, SKU margin, channel concentration and working-capital intensity
              remain material diligence gaps rather than model inputs with audited support.
