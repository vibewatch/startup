      - number: '8.3'
        title: Financing Context, Dilution Overhang, and Whether the Price Is Supported
        blocks:
          - type: paragraph
            body: >-
              The financing record is attractive on sponsor quality but weak on investable precision. Narwal’s 2025
              pre-IPO round is consistently described as $100 million and Tencent-backed, and private databases point to
              late-stage funding and a unicorn valuation. However, there is no public cap table, no preference schedule,
              no primary-versus-secondary split, no audited 2025 revenue, and no filed prospectus. Those missing items
              matter because an investor entering a high-priced late-stage round can be diluted by another pre-IPO
              primary raise, subordinated to stronger preference terms, or locked into a weak IPO window. The central
              price test is simple: if Narwal was roughly $200 million of revenue in 2024, a $1.4 billion mark equals
              about 7x revenue. That is rich versus Roborock at roughly 0.8-1.1x EV/Revenue, Ecovacs near 1.1x, and
              Dreame around 1.7x despite much larger revenue. Public evidence therefore does not support the price
              unless 2025-2026 revenue is materially higher than available databases imply.
            claimRefs:
