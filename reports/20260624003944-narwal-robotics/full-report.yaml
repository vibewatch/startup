      - number: '8.5'
        title: Exit Readiness, Thesis-break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Narwal’s exit readiness is partial. A pre-IPO round, Tencent participation, premium product launches, and
              the 2026 Dreame IPO benchmark all make a Hong Kong or STAR-style listing plausible, but plausibility is
              not readiness. The investable question is whether Narwal can publish audited financials that narrow the
              gap between private valuation and public comp discipline. Strategic exit should not be the base case:
              Amazon-iRobot shows that even a large, logical acquirer can fail to close under antitrust pressure, and
              iRobot’s later restructuring underscores how quickly consumer robotics can move from iconic brand to
              distressed precedent. The final diligence asks therefore focus on the proof needed to convert Track into
              Buy: audited revenue, gross margin by channel and geography, return and warranty rates, security
              remediation evidence, cap-table preferences, IPO filing timetable, and management’s plan for tariff and
              data-localization exposure. Thesis-break triggers include stale revenue below $300 million, another
              fleet-level outage, unresolved privacy remediation, or any new round above 4x forward revenue without
              audited support.
            claimRefs:
