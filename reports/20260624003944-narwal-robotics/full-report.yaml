      - number: '8.4'
        title: Bull, Base, Bear, and Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              The valuation frame should be revenue-multiple based, not earnings-based, because Narwal has no public
              audited profit series and is still on a pre-IPO path. In the bull case, Narwal proves that the public data
              are stale: audited revenue approaches $800 million to $1 billion, international growth remains
              exceptional, gross margin holds despite tariffs, and the IPO market awards a 3-4x revenue multiple. That
              can support a $3-4 billion exit, but it is a high-execution scenario. The base case assumes revenue scales
              but comps stay sober; a 2-3x multiple on a better-proven revenue base yields roughly $1.0-1.6 billion,
              close to the reported mark and not enough for venture returns. The bear case is severe but plausible:
              product reliability, privacy remediation, tariff costs, or competitive pricing compress the multiple
              toward public peers, producing a $300-700 million repricing. The comparable table deliberately includes
              Roborock, Ecovacs, Dreame, and iRobot because together they define public multiples, private IPO optimism,
              and strategic-exit downside.
