  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity Ranking and Investment Implication
        blocks:
          - type: paragraph
            body: >-
              Narwal Robotics should be underwritten as a high-risk premium consumer-hardware company rather than as a
              simple appliance vendor. The adverse evidence is unusually concrete: a reported fleet-wide bricking
              crisis, Korean regulator findings on camera/privacy vulnerabilities, an ADA website-accessibility lawsuit,
              Cadence IP litigation against Narwal-branded Chinese affiliates, China-origin tariff exposure, and
              platform-dependent US distribution. The highest residual risks are privacy/security, IP/export-control
              overhang, and reliability repeatability because each can impair trust in a connected-home product. Tariffs
              and robot-vacuum price competition sit just below them because they primarily compress margin and
              conversion rather than immediately block operations. Mitigation maturity is uneven: crisis response
              appears credible, but independent security certifications, cloud architecture, audited financials,
              supplier maps, and SKU-level tariff classifications are not public. For investment purposes, the risk
              profile argues for a valuation discount, staged diligence, and explicit kill criteria before any
              conviction call.
            claimRefs:
