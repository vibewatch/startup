          - type: callout
            title: Scenario Math Uses Publicly Available Revenue Only
            body: >-
              The bull case can improve sharply if audited 2025-2026 revenue is already far above public database
              figures. Until then, the report treats $200 million as the only supportable public revenue anchor.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV031
