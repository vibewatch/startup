- id: gtm-and-sales-efficiency-proxies
  title: GTM and Sales Efficiency Proxies
  body: 'Narwal''s go-to-market motion appears hybrid: official DTC, Amazon marketplace, Best Buy and Costco-type key accounts,
    plus offline stores in China and Europe. That breadth supports rapid overseas growth but pushes the business into channel
    economics that are hard to underwrite from public data. Amazon''s published compact-appliance referral fee schedule (15%
    up to $300 and 8% above $300) is a useful proxy for marketplace tolls before fulfillment, advertising, returns and promotions.
    Best Buy results show financing offers and deep markdowns, implying retail sell-through support rather than clean direct
    gross revenue. Sales cycles are consumer-retail cycles—Prime Day, Double 11, replenishment and store expansion—not long
    enterprise cycles; that helps velocity but creates promotion seasonality. Narwal''s 2024 Double 11 RMB 1.7 billion sales
    figure is impressive, yet it also highlights event concentration and the need to separate channel GMV from recognized
    net revenue.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI034
  - CI003
  - CI032
  tableRefs:
  - TI003
  figureRefs:
