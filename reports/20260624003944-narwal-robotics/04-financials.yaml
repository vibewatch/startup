- id: cost-structure-margin-and-working-capital
  title: Cost Structure, Margin Path and Working Capital
  body: 'Narwal''s cost structure should be treated as hardware-heavy. The likely drivers are BOM for suction motors, LiDAR/laser
    navigation, dual cameras, sensors, batteries, water tanks, self-cleaning docks, detergent systems, packaging, freight,
    warranty service and channel returns. Roborock provides the most relevant public benchmark: it delivered FY2025 gross
    margin of about 41.9% and net margin of about 7.3%, but those margins fell sharply from FY2024 despite 56% revenue growth.
    Industry commentary attributes the compression to price wars, heavy online traffic acquisition, subsidies and diversification
    costs. Narwal could eventually approach a low-40s gross-margin benchmark if premium pricing and scale hold, but its current
    global expansion, offline rollout and embodied-intelligence product investment likely depress near-term operating margins.
    Working capital is an equal diligence item: inventory, retailer stocking, returns and promotional receivables can absorb
    cash even when reported revenue grows.'
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI028
  - CI029
  - CI035
