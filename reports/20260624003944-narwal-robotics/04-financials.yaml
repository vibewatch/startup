  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited income statement, revenue recognition note and channel-level revenue bridge for 2023-2026.
    whyItMatters: Without audited figures, public revenue growth and margin path cannot be precisely underwritten.
    diligencePath: Request data-room financial statements, monthly management accounts and auditor comfort around revenue
      recognition.
    relatedQuestionRefs:
    - QI003
    - QI020
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: SKU and channel gross margin waterfall including ASP, discounts, BOM, freight, tariffs, returns and warranty.
    whyItMatters: Gross margin is the central question for a hardware-led company facing price competition.
    diligencePath: Build SKU-level contribution margin model from ERP exports and retailer settlement statements.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt, credit facilities, inventory financing and 24-month cash-flow forecast.
    whyItMatters: The $100 million financing cannot be translated into runway without burn and working-capital data.
    diligencePath: Request bank statements, cap table, debt agreements, board budget and cash runway plan.
    relatedQuestionRefs:
    - QI025
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: Reconciled total capital raised and primary-versus-secondary proceeds.
    whyItMatters: Public databases conflict between $114 million, $116 million and $138.3 million, affecting dilution and
      adequacy analysis.
    diligencePath: Reconcile financing documents and cap table with investor counsel and company CFO.
    relatedQuestionRefs:
