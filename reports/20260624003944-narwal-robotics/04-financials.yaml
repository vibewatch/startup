company:
  name: Narwal Robotics
chapter:
  number: 4
  title: Financials
  summary: Narwal shows strong public traction—about $200M 2024 revenue, >130% reported growth, nearly 700% overseas growth
    and a $100M April 2025 financing—but its economics remain private. Revenue is hardware-led with a limited accessories
    tail; the margin path should be benchmarked cautiously against Roborock’s ~42% gross and ~7% net margin, with tariffs,
    promotions, marketplace fees and working capital as diligence blockers.
sections:
- id: revenue-model-and-pricing-mix
  title: Revenue Model and Pricing Mix
  body: 'Narwal''s financial model is primarily a one-time hardware model, not SaaS. Public surfaces and retail pages point
    to robot vacuums/mops, floor washers and self-cleaning base stations as the monetized units; accessories, detergent, dust
    bags and replacement kits create a limited recurring tail but no disclosed subscription revenue. The company has public
    traction: CB Insights lists about $200 million of 2024 revenue, and 36Kr/SCMP-syndicated coverage says 2024 revenue grew
    more than 130% while overseas revenue rose nearly 700%. Pricing spans mainstream discounted units to premium flagships:
    Amazon showed Freo X Plus around $322, Flow 2 at $1,049.99 versus a $1,499.99 list price, and Best Buy exposed roughly
    $299.99-$1,299.99 retail points. The quality issue is realized ASP: list prices are visible, but discounts, bundle economics,
    retailer margin, returns and warranty reserves are not.'
  claimRefs:
