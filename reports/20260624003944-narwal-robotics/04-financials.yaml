tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism / unit
  - Current value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - Robot vacuums / mops
    - One-time hardware unit sale through DTC/retail/marketplace
    - Core revenue engine; $200M 2024 company revenue reported by CB Insights
    - High growth but hardware-led and promotion-sensitive
    - Request net revenue by SKU, geography and channel after returns/retailer allowances
  - - Floor washers / S-series
    - One-time hardware unit sale; China price band RMB 1,000-3,000 reported by 36Kr
    - Product expansion beyond robot vacuum dock systems
    - Potentially additive but may dilute margin if lower ASP
    - Request revenue share and gross margin by category
  - - Premium flagship Flow/Freo Z/Freo X
    - Premium robot + base-station bundles; Amazon/Best Buy list and deal prices
    - Visible price ladder from ~$300 discounted units to $1,500 list flagships
    - Better ASP potential but discounting is visible
    - Request realized ASP and discount waterfalls
  - - Accessories and consumables
    - Detergent, dust bags, filters, brushes, accessory packs
    - Official accessories storefront and Amazon accessory listings observed
    - Recurring but likely small and unquantified
    - Request attach rate, repeat frequency, gross margin and subscription share
  - - Retail financing / bundles
    - Financing, coupons, Prime deals, holiday promos
    - Best Buy monthly payments and Amazon Prime deals visible
    - Supports conversion but masks net price
    - Request gross-to-net bridge by campaign
  - - Future embodied household robot
    - New robotic-arm / 3D cleaning product under development
    - Funded by April 2025 round; expected within ~two years per media
    - Strategic option, not current revenue
    - Request capex/R&D budget, launch readiness and bill-of-material forecast
  notes: Revenue streams are public-source estimates and observations; Narwal does not disclose audited segment revenue, gross
    margin, returns, or realized ASP.
