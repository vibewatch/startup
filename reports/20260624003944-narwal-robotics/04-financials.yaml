  - FI004
- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: 'The Company Overview funding chronology should be read as background: Narwal has moved through multiple venture rounds
    and is now in a pre-IPO window. For this financial chapter, the local evidence is that Narwal closed a $100 million round
    in April 2025 led by Tencent Investment and the Beijing Robot Industry Development Investment Fund, with proceeds targeted
    at R&D, global expansion and multi-category strategy. Total-raised figures conflict across databases—$114 million at CB
    Insights, $116 million at Tracxn and $138.3 million at Premier Alternatives—so the prudent local range is $114-$138 million.
    That capital is meaningful relative to a reported $200 million 2024 revenue base, but public sources do not disclose cash
    balance, burn, debt, inventory financing or runway. The pre-IPO strategy reduces near-term financing uncertainty but does
    not remove dependency: a hardware company expanding into 70+ markets and new robotic-arm products can consume cash through
    inventory, tooling, marketing and warranty reserves.'
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI039
  tableRefs:
  - TI004
- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial verdict is attractive but not underwritable without private-company data. Narwal shows the right top-line
    signals—about $200 million of 2024 revenue, reported 130% growth, nearly 700% overseas growth, broad retail distribution
    and a premium product ladder. The weaknesses are equally clear: revenue is mostly one-time hardware; recurring consumables
    appear real but unsized; gross margin, net margin, CAC, return rate, warranty burden, channel contribution margin and
    inventory turns are undisclosed. Roborock''s public profile is the cautionary benchmark: roughly 42% gross margin and
    7-8% net margin are achievable at scale, but 2025 also showed revenue growth with profit compression. Tariffs and retailer
    fees can force price increases or margin absorption. The most important diligence blockers are a monthly management P&L
    by channel, cohort-level replacement/consumables data, cash and debt schedules, inventory aging, warranty reserves, and
    IPO-readiness disclosures.'
  claimRefs:
