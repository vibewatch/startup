companyProfile:
  summary: "Narwal Robotics is the consumer brand of Yunjing Intelligent Technology, a Shenzhen-based robotics company founded in 2016 by Junbin Zhang out of the Li Zexiang / xBotPark robotics ecosystem. It designs and sells premium AI-powered robot vacuum-and-mop systems—including the Freo X Ultra, Freo Z10 / Z Ultra, Freo Pro, S-series and the track-mop Flow and Flow 2 flagships—distinguished by self-cleaning base stations, DirtSense dirt-sensing, hot-water mop washing, Tri-Laser/LIDAR navigation and the NarMind Pro AI system. Narwal reports ~US$200M of 2024 revenue (up ~130% YoY with ~7x overseas growth), more than 3 million cumulative users across 30+ countries, over 1,000 employees and roughly 800 claimed patents. The company is privately held and late-stage, having raised a ~US$70M December 2024 round at a reported ~US$1.4B unicorn valuation and a ~US$100M April 2025 Series E / pre-IPO round led by Tencent and the Beijing Robot Industry Development Investment Fund, with prior backers including ByteDance and Source Code Capital."
