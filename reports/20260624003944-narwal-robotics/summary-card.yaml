summary:
  headline: >-
    Innovation-led premium robot vacuum-mop challenger with strong product reviews, fast revenue growth and a ~$1.4B
    unicorn tag, but a richly priced, opaque, China-manufactured hardware exporter exposed to tariff, commoditization
    and key-person risk.
