  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: supplier and manufacturing dependencies
    missingEvidence: BOM, named sensor/chip/dock suppliers, manufacturing yield, contract-manufacturing sites and quality
      escape rates.
    whyItMatters: Hardware gross margin, reliability and tariff exposure depend on suppliers and factory quality, not only
      product specs.
    diligencePath: Request supplier list, manufacturing sites, yield dashboards, return rates and top component lead-time
      analysis from management.
    relatedQuestionRefs:
    - QE010
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: security remediation
    missingEvidence: Independent security audit or regulator confirmation that the Freo Z Ultra camera/app vulnerabilities
      were remediated.
    whyItMatters: Camera-equipped home robots create privacy exposure and can damage premium-brand trust if remediation is
      unverified.
    diligencePath: Ask Narwal for KCA/KISA correspondence, firmware patch notes, penetration-test reports and current data-flow
      diagrams.
    relatedQuestionRefs:
    - QE017
    - QE018
    - QE030
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: award and patent detail
    missingEvidence: Award-by-award primary records for Red Dot/Edison claims and patent-family analysis separating granted
      patents from applications.
    whyItMatters: Design awards and patent counts support differentiation but can be overstated without primary records.
    diligencePath: Pull WIPO/CNIPA/USPTO families and award database entries; reconcile to Narwal’s claimed patent count.
    relatedQuestionRefs:
    - QE021
    - QE022
  - type: private-evidence-only
    severity: material
    topic: support and reliability
    missingEvidence: Warranty claim rates, return rates, repair turnaround, spare-parts availability and root-cause analysis
      for the 2025 device-failure incident.
    whyItMatters: Premium hardware businesses can lose margin and brand trust through support costs even when reviews are
      positive.
    diligencePath: Request cohort-level failure/return data by SKU and region, plus postmortem and corrective-action documentation.
    relatedQuestionRefs:
    - QE015
    - QE025
    - QE030
    relatedTableRefs:
    - TE004
    - TE005
