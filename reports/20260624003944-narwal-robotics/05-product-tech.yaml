- id: architecture-and-operating-model
  title: Architecture, AI and Operating Model
  body: The operating model is a layered hardware-software stack. At the floor layer, vacuum motors, tangle-resistant brushes,
    mop pads or the FlowWash track mop, pumps, water tanks, batteries and the self-cleaning base station do the physical cleaning
    and maintenance. At the perception layer, premium products combine LiDAR or Tri-Laser-style navigation with dual RGB cameras
    and AI chips; Narwal brands this higher-level decisioning as NarMind Pro and uses DirtSense to adapt cleaning or mop-wash
    behavior when residual dirt is detected. At the control layer, the Narwal app, firmware channel, maps, schedules, Alexa
    skill and delayed Matter/Google Home roadmap create the daily operating interface. The dependency map matters because
    any weak link — camera authentication, firmware quality, water-pump durability, dock reliability, or component supply
    — can turn a household convenience product into a support burden.
