chapter:
  number: 5
  title: Product & Technology
  summary: Narwal’s product architecture is a premium autonomous vacuum-and-mop platform built around self-cleaning base stations,
    mop-hygiene IP, AI perception and app-controlled home workflows. The strongest differentiation is hard-floor mop automation
    — Flow/Flow 2, DirtSense, NarMind Pro and hot-water dock maintenance — but diligence must resolve camera-security remediation,
    carpet-performance limits, 2025 reliability caveats, and manufacturing/support opacity.
sections:
- id: customer-workflow-and-product-map
  title: Customer Workflow and SKU Map
  body: 'Narwal delivers a consumer home-cleaning workflow rather than a single-purpose appliance: the buyer uses the mobile
    app or voice assistant to map rooms, choose schedules or zones, and then lets the robot vacuum, mop, return to the base,
    wash and dry its mop, and in some configurations handle water and dust with little intervention. The SKU map has widened
    from premium robot vacuum/mop systems such as Freo X Ultra and Freo Z Ultra to Freo Z10 Ultra, Freo Pro and S-series models,
    plus the Flow/Flow 2 track-mop architecture and the adjacent V50 stick and U50 mattress cleaners shown in 2026. The strategic
    implication is that Narwal is building a home-cleaning platform around mop hygiene, not just chasing suction specifications.
    That focus is valuable in hard-floor households, but it also means carpet-heavy homes and regional SKU availability remain
    diligence questions.'
