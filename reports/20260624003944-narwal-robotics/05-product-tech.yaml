- id: TE003
  title: Technology / Operating Architecture
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Vacuum module
    - Debris pickup; suction ranges from mid-thousands Pa to Flow 2 flagship claims
    - Motors, brush design, airflow path, filters
    - Suction claims do not guarantee embedded-carpet performance
  - - Mop module / FlowWash
    - Wet cleaning, stain removal and mop refresh
    - Mop textile, water pump, heater, track or pad mechanism
    - Wear, odor, clogging and replacement-part economics
  - - Self-cleaning dock
    - Mop washing/drying, water/dust handling and charging
    - Dock pumps, tanks, heater, seals, dust bag, power
    - Single point of failure for hands-free value proposition
  - - Navigation sensors
    - Mapping and localization
    - LiDAR/Tri-Laser-style ranging, bump sensors, SLAM software
    - Supplier dependency; reflective/black surfaces can challenge robots
  - - Dual RGB cameras
    - Object recognition and clutter avoidance
    - Camera modules, edge AI chips, image pipeline
    - Privacy/security risk if authentication or storage controls fail
  - - NarMind Pro / AI decisioning
    - Recognize objects, choose route and cleaning mode
    - On-device compute, training data, firmware updates
    - Model claims hard to audit externally
  - - DirtSense
    - Detect residual dirt and trigger retouch or mop washing
    - Dirty-water sensing, algorithms, pump loop
    - Marketing vs sensor thresholds not independently disclosed
  - - App/cloud/firmware
    - Maps, schedules, updates, support and voice integration
    - Mobile app, account auth, cloud services, firmware pipeline
    - Bricking, outage, Matter delay and security-remediation risk
  notes: Architecture layers are inferred from official product descriptions and reviewer teardown-level observations; supplier
    names and BOM are not public.
