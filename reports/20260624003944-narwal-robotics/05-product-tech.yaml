- id: deployment-support-and-roadmap
  title: Deployment, Integration, Support and Roadmap
  body: 'Deployment is lightweight compared with industrial robotics because the customer installs a dock, pairs the robot
    through the Narwal app, maps the home and configures zones. Yet integration is still strategically important: firmware
    updates, app reliability, cloud/account security, Alexa commands and future Matter support shape the daily experience.
    CES 2026 evidence supports an active roadmap: Narwal showcased Flow 2 as the flagship, plus V50 and U50, and independent
    reviewers later treated Flow 2 as a released 2026 product. Public support surfaces include manuals, troubleshooting and
    firmware policies, but warranty outcomes, repair turnaround, replacement-part availability and post-incident remediation
    are not transparent. The 2025 bricking or fleet-crash narrative reported by KR Asia and the Matter delay both make reliability
    and software operations diligence items, not footnotes.'
