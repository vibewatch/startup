    - Dual RGB cameras, AI obstacle avoidance, camera-enabled edge cases
    - Security remediation after Sept 2025 KCA finding
  - - Freo Z10 Ultra
    - Busy family or pet home seeking higher suction and AI cleaning
    - Current official SKU
    - AI-enhanced deep cleaning, hot-water wash, advanced base station
    - Independent long-term reliability and privacy audit
  - - Freo Pro / S-series
    - Value or smaller-home buyer
    - Commercial but less central to flagship narrative
    - Lower price tiers with core vacuum/mop automation
    - Precise regional specs and margin contribution
  - - Flow
    - Hard-floor user prioritizing deep mopping
    - Launched/shown in 2025; transition generation
    - FlowWash rolling/track mop and autonomous deep-cleaning positioning
    - Matter/Google Home roadmap slippage and regional availability
  - - Flow 2
    - Premium 2026 flagship buyer
    - CES 2026 headliner and reviewed launch product
    - Up to 31,000Pa suction, VLM-style AI, FlowWash track mop, stronger dock automation
    - Independent durability data on track-mop mechanism
  - - V50 cordless stick
    - Manual spot-cleaning user
    - CES 2026 adjacent product; review depth limited
    - Extends Narwal beyond robots into manual cordless cleaning
    - SKU economics and channel traction unknown
  - - U50 mattress cleaner
    - Allergy or bedding hygiene user
    - CES 2026 adjacent product; review depth limited
    - Adds mattress/upholstery cleaning surface to ecosystem
