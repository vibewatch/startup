- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Narwal solution
  - Measurable / claimed benefit
  - Limitation
  rows:
  - - Daily hard-floor maintenance
    - Manual vacuum then wet mop
    - Scheduled robot vacuum/mop with self-wash dock
    - Reduces routine floor-cleaning labor and dirty mop handling
    - Still needs prep for cables, small objects and maintenance consumables
  - - Kitchen spills and sticky stains
    - Spot mop by hand
    - DirtSense plus hot-water mop washing and repeated cleaning
    - Adaptive retouch logic and cleaner mop pads between passes
    - Independent stain-test results vary by reviewer and model
  - - Pet household clutter
    - Pick up toys, run vacuum carefully
    - Dual-camera AI obstacle avoidance on Freo Z line
    - Avoids many objects and pet hazards in reviewer tests
    - Cameras increase privacy/security diligence burden
  - - Carpeted rooms
    - Manual upright vacuum or strong robot vacuum
    - Narwal robot vacuum suction and mop lift
    - Convenient maintenance for mixed homes
    - RTINGS/Modern Castle indicate Freo X Ultra is weaker on carpet
  - - Deep hard-floor mopping
    - Spin mop or manual scrub
    - Flow/Flow 2 track-style FlowWash mop
    - Continuous rolling-mop refresh and high-end suction positioning
    - Track mechanism durability and parts cost not proven
  - - Hands-free maintenance
    - Empty dustbin and wash pads manually
    - Base station wash/dry/refill/empty features by SKU
    - Less frequent dirty maintenance and better hygiene
    - Autonomy varies by SKU; dock failures could be costly
  notes: Benefits are product-claimed or review-observed rather than controlled laboratory guarantees across all models; carpet
    weakness is model-specific and adverse.
