- id: constraints-and-evidence-gaps
  title: Constraints, Adverse Evidence and Diligence Gaps
  body: 'The market is attractive but not frictionless. Premium price is the first constraint: high-end AI/self-wash devices
    remain discretionary purchases and are vulnerable to promotions, weak consumer confidence and substitution by conventional
    vacuums. Second, the category risks commoditization. Research and Markets describes hyper-consolidation and specification
    dumping among leading Chinese brands; when many vendors advertise hot-water washing, AI object recognition and high suction,
    differentiation can migrate from hardware specs to service, reliability and brand trust. Third, tariffs on electronics,
    batteries and sensors can shift landed cost or force China-plus-one assembly, especially for China-headquartered vendors.
    Fourth, privacy and security scrutiny matters as robot vacuums add cameras and cloud AI; adverse consumer-agency reporting
    creates a trust hurdle for camera-equipped products. The largest evidence gaps are the exact premium auto-wash mop SAM,
    Narwal’s verified share within that segment, and comparable gross margin by channel.'
