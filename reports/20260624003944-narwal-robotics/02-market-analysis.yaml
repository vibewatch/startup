company:
  name: Narwal Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: Narwal operates in the residential robot vacuum/mop combo market, with a defensible 2026 TAM base case of roughly
    USD 12-14B but a wide published range of USD 7.05-14.02B because market-report scopes differ. The premium auto-wash mop
    SAM and Narwal SOM are not directly disclosed; this chapter models Narwal at an 8-10% scenario share of that premium segment
    while flagging price, tariff, privacy and commoditization risks.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend and Substitutes
  body: 'Narwal’s relevant market is not all home robotics. The investable boundary is the residential robot vacuum and mop
    combo category: autonomous floor-cleaning robots, self-empty/refill/wash docking stations, app and cloud control, firmware
    intelligence, replacement brushes/filters/mop pads, and accessories that attach to recurring floor-cleaning use. This
    boundary includes premium hybrid products such as Narwal Flow 2 and Freo lines because the buyer is purchasing a time-saving
    household cleaning appliance, not a general-purpose robot. It excludes conventional cordless sticks, upright/canister
    vacuums, wet/dry vacuums, handheld mattress cleaners, pool/window robots, commercial scrubbers, humanoid home robots,
    and paid cleaning services. Those exclusions matter because many market pages mix floor, pool and window robots or residential
    and commercial devices, creating inconsistent TAM numbers. The status quo remains manual cleaning or a cheaper non-robot
    vacuum, so adoption depends on convenience, trust, cleaning performance and household willingness to pay rather than regulatory
    necessity.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM044
  tableRefs:
  - TM001
- id: market-sizing
  title: 'TAM, SAM and SOM: Multiple Sizing Lenses'
  body: 'Published 2026 sizing is unusually dispersed. Mordor’s corrected robot-vacuum URL gives the lowest retained 2026
    estimate at USD 7.05 billion, while IndustryResearch.biz gives the highest point estimate at USD 14.023 billion; Research
    and Markets, The Business Research Company and Future Market Insights cluster near USD 12.5-12.7 billion. Fortune and
    Business Research Insights sit lower, around USD 8-9 billion, but still imply double-digit growth. The base TAM used here
    is therefore USD 12-14 billion, with a low case around USD 7-9 billion and a high case around USD 14 billion in 2026.
    SAM is narrower: premium auto-wash robot vacuum/mop systems sold to residential households through online, retail and
    DTC channels. Because no retained publisher directly isolates “premium self-washing mop combo” revenue, SAM must be modeled
    from premium USD 500-plus, smart-connected, hybrid vacuum-mop and online channel splits. Narwal SOM is best treated as
    an 8-10% scenario inside that premium segment, not a verified share disclosure.'
