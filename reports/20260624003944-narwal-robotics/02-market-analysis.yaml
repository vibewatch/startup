- id: buyer-user-payer
  title: Buyer, User, Payer and Channel Segmentation
  body: The economic buyer for Narwal is normally the household, but influence is split among the person paying, the people
    living with cleaning outcomes, retail-channel trust and platform convenience. Premium-income homeowners and renters are
    the most obvious payers because the best-featured devices sit above USD 500; users include adults doing routine floor
    care, pet owners managing hair and litter, families with young children, and seniors or caregivers avoiding physical cleaning
    load. Channels shape the purchase path. Mordor reports online marketplaces as the dominant distribution route in 2025,
    Future Market Insights expects online retailers to remain central in 2026, and Narwal is visible through Amazon, Best
    Buy and its DTC store. Amazon and Best Buy reduce search friction through reviews, financing, returns and price comparison,
    while DTC lets Narwal launch new models and bundle consumables. This mix lowers distribution barriers but also lowers
    switching costs because consumers can compare suction, dock features and promotions across Roborock, Ecovacs, Dreame,
    SharkNinja and Narwal in minutes.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
