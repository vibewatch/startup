callouts:
- calloutType: insight
  title: Base TAM is USD 12-14B, but underwriting should sensitize a much wider range
  body: The most useful 2026 market view is not a single TAM. Research and Markets, TBRC, FMI and IndustryResearch cluster
    around USD 12-14B, while Mordor, Fortune and BRI produce USD 7-9B lower cases. The conflict is methodological and should
    flow into valuation sensitivity.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
- calloutType: risk
  title: Premium features are becoming table stakes
  body: Narwal’s AI and self-washing dock claims fit the strongest growth vectors, but adverse consolidation evidence suggests
    Roborock, Ecovacs, Dreame, Xiaomi and Narwal are racing on similar specifications, increasing margin and differentiation
    risk.
  claimRefs:
  - CM027
  - CM029
  - CM034
  - CM035
- calloutType: assumption
  title: Narwal SOM is scenario-based, not disclosed
  body: The 8-10% SOM frame is a diligence scenario inside premium auto-wash mop systems. It requires validation with Narwal
    sell-through, ASP, geography and channel-margin data before it can support a valuation model.
  claimRefs:
  - CM038
  - CM039
