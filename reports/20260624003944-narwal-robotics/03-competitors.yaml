  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: narwal-scale-gap
    missingEvidence: Audited Narwal revenue, unit shipments, gross margin and market share by geography for 2024-2026.
    whyItMatters: Without private metrics, Narwal cannot be scaled against public Roborock and Ecovacs or reported
      Dreame figures with precision.
    diligencePath: Request management data room with audited financials, marketplace sell-through and distributor
      reconciliation.
    relatedQuestionRefs:
    - QP028
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Actual retailer margin, marketplace fees, discount depth, returns and warranty reserve by channel.
    whyItMatters: Pricing pages do not reveal realized net revenue or whether premium positioning survives promotions.
    diligencePath: Ask for SKU-level channel P&L and reconcile to Amazon/Best Buy/DTC order exports.
    relatedQuestionRefs:
    - QP029
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: likely-entrants
    missingEvidence: Confirmed launch plans from appliance OEMs, retailer private labels and smart-home ecosystem
      companies for the next product cycle.
    whyItMatters: Future entrants could compress price or acquire distribution before Narwal reaches durable scale.
    diligencePath: Monitor CES/IFA launches, retailer line reviews, import records and supplier design-win announcements.
    relatedQuestionRefs:
    - QP030
    relatedTableRefs:
    - TP001
  - type: access-blocked
    severity: minor
    topic: blocked-seed-sources
    missingEvidence: Readable versions of Inf.news and CompWorth seed pages that returned 403 or 404 during fetch.
    whyItMatters: The blocked pages were not needed for core claims, but full seed coverage would improve redundancy.
    diligencePath: Retry via alternate profile or replace with primary filings and official pages in a later refresh.
