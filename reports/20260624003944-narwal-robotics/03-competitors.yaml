- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat or risk item
  - Threat vector
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Mop-hygiene differentiation
    - Peers add hot-water wash, mop drying and automated docks
    - High
    - Test Narwal Flow/Freo against Roborock, Dreame and Ecovacs on hard-floor hygiene and odor over multi-week
      use
  - - Carpet-performance weakness
    - Dreame and Roborock win carpet-heavy or pet-hair households
    - High
    - Require current independent benchmark pack for newest Narwal models and thick-carpet scenarios
  - - Public scale credibility
    - Roborock/Ecovacs public filings and Dreame IPO coverage overshadow Narwal private metrics
    - High
    - Obtain audited revenue, units, cohort repeat purchase and geography mix
  - - Distribution power
    - Xiaomi ecosystem, review sites and large retailers steer discovery
    - Medium
    - Quantify Amazon, Best Buy, DTC and marketplace CAC/payback by cohort
  - - Supply and manufacturing access
    - Larger Chinese peers may source components and amortize tooling better
    - Medium
    - Diligence bill of materials, supplier concentration, lead times and tariff exposure
  - - Hardware commoditization
    - Self-empty, mop wash, AI obstacle avoidance become table stakes
    - High
    - Verify patent defensibility and software/data differentiation beyond dock hardware
  - - Multi-homing and low lock-in
    - Consumers keep manual vacuums, stick vacuums or cleaning services
    - Medium
    - Measure attach, consumable reorder rates and active-app retention
  - - Incumbent brand trust
    - Roomba/Dyson remain trusted household cleaning names
    - Medium
    - Track review rankings, NPS, warranty outcomes and return rates against brand incumbents
  notes: Severity is an ordinal diligence judgment based on retained evidence, not a model output; each mitigation
    is phrased as a diligence workplan item.
