- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Competitor
  - Observed package / price signal
  - Included capabilities
  - Unknowns / discounting
  - Competitive implication
  rows:
  - - Narwal
    - Premium robot-vacuum/mop products and buyer-guide price bands; exact realized price varies by model and promotion
    - Self-cleaning base, mop-focused automation, obstacle avoidance on high-end models
    - Retailer margin, promotion depth and channel economics not public
    - Must justify premium with mop hygiene and maintenance advantage
  - - Roborock
    - Official Saros Z70 premium product page and public scale evidence
    - OmniGrip arm, all-in-one dock, navigation and premium app experience
    - Realized discounts and regional mix unknown
    - Feature flagship can reset consumer expectations above Narwal
  - - Ecovacs
    - Official X8 Pro OMNI page with self-emptying vacuum/mop positioning
    - High suction, edge cleaning, anti-tangle, OMNI dock
    - Public page does not reveal unit margins
    - Directly competes on flagship dock automation and frequent promotions
  - - Dreame
    - IPO and IDC coverage imply premium leadership; exact model page retained source was unavailable
    - High suction and broad premium model reputation from review and market sources
    - Private discounts and model-specific gross margin unknown
    - Can undercut or out-feature Narwal while scaling globally
  - - Xiaomi
    - Official X20 Max page as ecosystem robot-vacuum package
    - Vacuum/mop automation tied to Xiaomi smart-home surface
    - Regional pricing and subsidy strategy not fully visible
    - Ecosystem bundling can pressure standalone premium brands
  - - iRobot
    - Official Roomba Combo 10 Max plus AutoWash Dock page
    - Roomba brand, vacuum/mop combo, AutoWash dock
    - Post-transaction strategy and discounting uncertain
    - Brand trust remains, but weaker momentum may limit response
  - - Dyson
    - Official 360 Vis Nav premium robot page
    - Premium suction/navigation brand promise
    - Narrow robot lineup and conversion from stick-vacuum customers unknown
    - Adjacent premium threat more than volume leader
  - - Status quo / services
    - Manual labor, stick vacuum or cleaning service; no robot dock upfront purchase
    - Human flexibility and low technical risk
    - Time cost and service recurrence vary by household
    - Constrains Narwal’s conversion and price ceiling
  notes: The table uses public list-price/product-page and package signals, not realized net revenue; private discounting
    and retailer terms are open diligence items.
