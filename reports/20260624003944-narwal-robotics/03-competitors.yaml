- id: scale-profiles-and-direction
  title: Competitor Scale, Funding and Direction
  body: 'The scale comparison is asymmetric. Roborock and Ecovacs publish public-company financial signals, while
    Narwal and Dreame require triangulation from press, databases and market rankings. Roborock’s official 2025
    and Q1 2026 release and StockAnalysis pages support a revenue and market-cap profile far above Narwal’s disclosed
    scale. Ecovacs similarly benefits from listed-company revenue and market-cap visibility, but multiple sources
    describe revenue growth with profit pressure, which is consistent with price-war economics. Dreame is the most
    aggressive private challenger: multiple sources report a pre-IPO round at about a $9.6 billion valuation, 2025
    revenue above RMB 40 billion and IDC-linked claims of Q1 2026 leadership. iRobot’s strategic direction is defensive
    after the Amazon deal termination and layoffs. Xiaomi’s direction is ecosystem leverage, and Dyson’s is premium-brand
    differentiation rather than broad robotic-floor-care share. For Narwal, the missing public share and revenue
    proof is itself a competitive weakness.'
