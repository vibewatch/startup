- id: capability-pricing-gtm-and-trust
  title: Capability, Pricing, GTM and Trust Comparison
  body: 'Feature comparison shows rapid convergence at the premium end. Official product pages for Roborock, Ecovacs,
    Xiaomi and iRobot all describe automated docks, and review/benchmark sources show self-emptying, mop care, obstacle
    avoidance and anti-tangle systems becoming expected rather than novel. Narwal still has a credible wedge in
    low-maintenance wet-mopping hygiene and convenience, but adverse review evidence indicates weaker carpet-heavy
    performance against Dreame and Roborock in some tests. Pricing evidence is mainly list-price and package-level:
    public sources disclose product pages, sale pages and review prices, not realized retailer margin or promotion
    depth. GTM and trust are similarly mixed. Public-company peers have investor visibility; review leaders shape
    consumer discovery; Xiaomi has smart-home distribution; and Narwal must lean on DTC, marketplaces and product-specific
    review wins without the same public scale proof.'
  claimRefs:
