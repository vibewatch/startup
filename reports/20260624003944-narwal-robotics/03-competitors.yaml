tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor
  - Category
  - Scale / Funding
  - Target Segment
  - Primary Differentiation
  - Key Limitation vs Narwal
  rows:
  - - Narwal Robotics
    - Reference company / direct premium robot vacuum-mop
    - Private; disclosed scale less transparent than public peers; reported strong premium-product momentum in retained
      reviews
    - Premium households, hard-floor and pet-owner buyers seeking hands-off mop care
    - Mop hygiene, self-cleaning base station, low-maintenance user experience
    - Private scale/share evidence is less visible; adverse carpet-performance evidence versus Dreame/Roborock
  - - Roborock
    - Direct premium specialist
    - Public SHA:688169; 2025 revenue RMB 18.695B; market cap around mid-$3B range in retained sources
    - Premium global robot-vacuum buyers
    - Broad lineup, navigation reputation, Saros Z70 mechanical-arm innovation
    - Premium pricing and public evidence of margin pressure in the category
  - - Ecovacs
    - Direct specialist / China incumbent
    - Public SHA:603486; revenue and market-cap data available; China share leadership cited in sources
    - China and global premium/midrange households
    - Large OMNI lineup, China channel depth, listed-company scale
    - Profit pressure and red-ocean price competition reduce moat quality
  - - Dreame
    - Direct high-growth challenger
    - Private; reported pre-IPO round at ~$9.6B valuation and 2025 revenue above RMB 40B
    - Premium global households, especially Europe and high-end segments
    - Aggressive feature pace, suction, global share claims, IPO momentum
    - Private-source dependence; strategic sprawl beyond floor care could distract
  - - Xiaomi
    - Ecosystem competitor
    - Large public electronics ecosystem; robot-vacuum product line as smart-home extension
    - Value-conscious smart-home buyers already in Xiaomi ecosystem
    - Distribution, app ecosystem, hardware value pricing
    - Less evidence of premium floor-care specialization than Roborock/Dreame
  - - iRobot / Roomba
    - Incumbent brand
    - Amazon acquisition terminated in 2024; layoffs reported; legacy Roomba trust remains
    - Mainstream households and Roomba loyalists
    - Brand heritage and familiar product experience
    - Weakened independent trajectory and slower feature-price cadence versus Chinese peers
  - - Dyson
    - Adjacent premium appliance competitor
    - Large private premium appliance brand; 360 Vis Nav robot as niche premium entrant
    - Premium vacuum buyers and Dyson loyalists
    - Trust in suction/cleaning engineering and premium brand
    - Narrow robot-vacuum lineup versus Chinese specialists
  - - Shark/Eufy and white-label brands
    - Value challengers / substitutes
    - Scale not fully profiled in retained sources; visible in buyer guides as alternatives
    - Price-sensitive households
    - Lower entry price and retailer availability
    - Less direct evidence of Narwal-like mop-hygiene differentiation
  - - Manual cleaning and stick vacuums
    - Status quo substitute
    - Universal installed base; no venture funding needed
    - All households with existing cleaning routines
    - Low trust barrier, no mapping/camera concerns, flexible deep cleaning
    - Labor-intensive and less automated
  - - Cleaning services
    - Service substitute
    - Local service market; no product lock-in
    - Households outsourcing chores
    - Human judgment and broad cleaning scope beyond floors
    - Recurring cost and scheduling friction
  notes: Scale and funding figures mix public filings, official releases, market-data aggregators and news reports;
    private-company values are approximate and should not be treated as audited.
