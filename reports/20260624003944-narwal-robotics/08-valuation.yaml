  - - Target return
    - At least 3x net for new venture entry
    - Entry near $1.4B likely needs $5-7B exit after dilution
    - Not underwriteable from public evidence today
  - - Hold / exit view
    - Hold only for low-basis or preference-protected investors; trim if mark is above 4x forward revenue
    - Preference terms and lock-up unknown
    - Existing investors should seek secondary liquidity if IPO prices aggressively
