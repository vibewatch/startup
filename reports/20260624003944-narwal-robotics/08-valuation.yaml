  rows:
  - - Recommendation
    - Track / research-more
    - Credible product and financing proof, but valuation unsupported by public comps
    - Do not initiate at the reported mark without audited 2025-2026 financials
  - - Confidence
    - Medium
    - Thirty-nine fetched sources but Narwal financials remain private and aggregator-reported
    - Enough to set price discipline; not enough for precise underwriting
  - - Risk rating
    - High
    - 7x implied revenue multiple, privacy and reliability risk, China-linked regulatory/tariff exposure
    - Require lower entry price, strong preference protection, or public filing proof
  - - Valuation stance
    - Stretched
    - Narwal ~$1.4B / ~$200M revenue versus Roborock/Ecovacs near ~1x EV/Revenue and Dreame ~1.7x
