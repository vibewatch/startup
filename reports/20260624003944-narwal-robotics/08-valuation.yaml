- id: TV002
  title: Thesis / Anti-thesis Table
  columns:
  - Side
  - Argument
  - Evidence Basis
  - What Would Change the View
  rows:
  - - Thesis
    - Premium product cadence and AI features can support a hardware-platform premium
    - CES 2025 and CES 2026 Narwal launch materials
    - Audited data show weak repeat purchase, high return rates, or undifferentiated gross margin
  - - Thesis
    - Late-stage investor support validates IPO pathway optionality
    - $100M pre-IPO round reports with Tencent and Beijing Robot Fund participation
    - No prospectus by 2026 year-end or a down-round before filing
  - - Thesis
    - Consumer robotics category has strategic and public-market comparables
    - Roborock, Ecovacs, Dreame, and iRobot provide reference cases
    - Comparable multiples compress further or IPO window closes
  - - Thesis
    - International growth can reset revenue base above stale public databases
    - 36Kr/CB Insights point to rapid 2024 growth and revenue around $200M
    - Audited 2025 revenue below $300M
  - - Anti-thesis
    - Reported valuation implies roughly 7x revenue, far above comps
    - Narwal $1.4B mark divided by ~$200M revenue; Roborock/Ecovacs around ~1x
    - Audited revenue above $500M and valuation below 3x forward revenue
  - - Anti-thesis
    - Privacy and reliability incidents justify a discount
    - KCA/KISA coverage of Freo Z Ultra security and KrASIA bricking crisis
    - Independent certification, remediation reports, and low warranty/return evidence
  - - Anti-thesis
    - Strategic-exit route is risky
    - Amazon-iRobot failed under EU pressure and iRobot later distressed
    - Multiple credible acquirers with no antitrust or data-sovereignty conflict
  - - Anti-thesis
    - Preference and dilution terms are unknown
    - Private-company cap table not disclosed
    - Full cap table, preference waterfall, and secondary participation schedule delivered
