- id: TV005
  title: Thesis-break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold / Event
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Revenue proof fails
    - Audited 2025 revenue below $300M or 2026 run-rate below $400M
    - Last private mark remains >4x forward revenue
    - Exit or refuse new primary investment
  - - Gross margin disappointment
    - Gross margin below 30% or rising warranty/return costs
    - Premium-hardware thesis becomes commodity hardware thesis
    - Reduce valuation multiple to public-peer range
  - - Security remediation incomplete
    - KCA/KISA-type authentication gaps not independently remediated
    - Trust and international expansion discount rises
    - Block Buy recommendation until third-party audit
  - - Reliability relapse
    - Another fleet-level outage or broad bricking incident
    - Cloud architecture risk becomes structural
    - Exit unless company funds reserve and publishes RCA
  - - IPO overpricing
    - IPO or pre-IPO round above 4x forward revenue without audited support
    - Public comp gap widens and lock-up risk rises
    - Sell secondary or wait post-listing
  - - Strategic exit blocked
    - Acquirer path depends on platform buyer with antitrust or data-sovereignty concerns
    - M&A floor is unreliable
    - Underwrite IPO-only exit and lower terminal multiple
  notes: Thresholds are author diligence triggers built from fetched valuation and risk evidence; they are not company guidance.
  claimRefs:
  - CV010
  - CV011
  - CV023
  - CV036
  - CV039
  - CV047
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Audited revenue
    - 2024-2026 revenue by geography, product, and channel
    - Determines whether 7x trailing multiple is stale or real
    - Company CFO; IPO prospectus; auditor workpapers
  - - Gross margin and warranty economics
    - Product gross margin, return rate, warranty reserve, freight/tariff burden
    - Separates premium hardware from subsidy-driven growth
    - Finance team; channel checks; warranty ledger
  - - Cap table and preferences
    - Liquidation preference, anti-dilution, secondary sales, option pool, debt
    - Determines true downside and proceeds waterfall
    - Lead investor counsel; cap-table export; financing documents
  - - Security remediation
    - Independent report on Freo Z Ultra authentication, cloud data path, and KISA/KCA remediation
    - Privacy risk affects overseas expansion and public-market discount
    - CISO; third-party penetration test; Korean remediation correspondence
  - - Operational reliability
    - Root-cause analysis and recurrence controls for fleet-level bricking risk
    - Reliability failures can destroy consumer trust and gross margin
    - CTO/COO; incident postmortem; support ticket cohort
  - - IPO path
    - Exchange, sponsor, filing timetable, expected primary/secondary mix, lock-up terms
    - Exit route and dilution are central to late-stage return
    - Company board; IPO counsel; sponsor bank
  notes: 'Diligence asks are ordered by valuation sensitivity: audited scale first, then economics, terms, risk remediation,
    and exit mechanics.'
