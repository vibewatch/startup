    - Audited revenue $350M-$500M and valuation below 3x forward revenue
  - - Bear
    - Growth slows; unresolved privacy/reliability issue; public comps remain near ~1x revenue
    - $300M-$700M repricing; 50-80% impairment from reported mark
    - Down-round, delayed IPO, or forced strategic sale
    - 2025 revenue < $300M, another fleet outage, or IPO postponed beyond 2026
