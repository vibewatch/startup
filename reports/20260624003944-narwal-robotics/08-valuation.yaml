- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / Return Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bull
    - Revenue approaches $800M-$1B; gross margin durable; IPO market values premium robotics at 3-4x revenue
    - $3.0-$4.0B exit; roughly 2.0-2.8x gross on $1.4B entry before dilution
    - Tariffs, privacy, competition, and IPO-window risk
    - Audited revenue >$500M by 2025/26 and filed prospectus with expanding margins
  - - Base
    - Revenue grows but public comps stay disciplined at 2-3x revenue; no major outage or security relapse
