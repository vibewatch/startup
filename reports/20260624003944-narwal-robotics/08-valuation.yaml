company:
  name: Narwal Robotics
chapter:
  number: 8
  title: Valuation
  summary: 'Narwal Robotics is a credible premium consumer-robotics asset, but the reported ~$1.4B private mark looks stretched
    against public and private robotic-vacuum comparables. The recommendation is Track / research-more: require audited 2025-2026
    financials and an entry below roughly 3x forward revenue before supporting new money.'
sections:
- id: verdict-and-entry-discipline
  title: Recommendation, Confidence, and Entry Discipline
  body: 'Narwal is a credible premium consumer-robotics company, but the valuation evidence points to a price problem rather
    than a company-quality problem. The reported late-2024 unicorn context near $1.4 billion and the 2025 $100 million pre-IPO
    round show that sophisticated investors still want exposure to the category, especially Tencent-backed AI hardware with
    international distribution. The constraint is that public revenue evidence remains around $200 million for 2024, so the
    implied entry multiple is roughly 7x revenue before any preference stack, primary dilution, IPO discount, or lock-up risk.
    Public robotic-vacuum peers do not support that multiple: Roborock and Ecovacs trade around 1x forward EV/Revenue with
    low-to-mid-teens earnings multiples, and the larger Dreame pre-IPO process is reported closer to 1.7x revenue. The recommendation
    is Track / research-more, with medium confidence and high risk. Existing holders can hold if their basis or preference
    protection is favorable; new investors should require a lower entry price or audited 2025-2026 numbers that compress the
    forward multiple below 3x.'
