- id: TV004
  title: Comparable Valuation Table
  columns:
  - Comparable
  - Metric
  - Multiple / Valuation / Status
  - Relevance
  - Limitation
  rows:
  - - Roborock (688169.SH)
    - 2026E EV/Revenue, EV/EBITDA, P/E
    - ~0.84-1.1x EV/Revenue; ~9-11x EV/EBITDA; ~12-18x P/E
    - Closest public China robotic-vacuum leader with profitable market data
    - Public, larger, and already profitable; not a private growth round
  - - Ecovacs (603486.SH)
    - 2026E EV/Revenue, EV/EBITDA, P/E
    - ~1.1x EV/Revenue; ~9x EV/EBITDA; mid-teens P/E
    - Public home-robotics peer and China consumer-robotics benchmark
    - Broader appliance mix and mature public-company profile
  - - Dreame Technology
    - Pre-IPO valuation / revenue
    - ~70B yuan ($9.6B) on >40B yuan 2025 revenue; ~1.7x revenue
    - Best private IPO-path comparable and category momentum indicator
    - Much larger scale and stronger reported global share than Narwal
  - - iRobot / Roomba
    - M&A and distress status
    - $1.7B Amazon deal terminated; later restructuring/downside precedent
    - Strategic-exit and downside reference for consumer robotics
    - U.S. incumbent with different cost base and distressed trajectory
  - - Narwal Robotics
    - Reported private valuation / revenue
    - ~$1.4B valuation on ~$200M revenue; ~7x revenue implied
    - Subject company valuation anchor
    - Revenue, margin, and cap-table terms are not publicly audited
  notes: Comparable set is partial but intentionally spans public profitable peers, private pre-IPO peer, and strategic-exit
    downside; multiple estimates are rounded and use fetched 2026 market data or reported private-round values.
