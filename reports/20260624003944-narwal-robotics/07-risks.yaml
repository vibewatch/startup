- id: TR005
  title: Mitigation and Kill Criteria
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Camera/privacy security
    - New regulator or retailer inquiry naming Narwal
    - Any formal enforcement, recall-like notice, mandatory patch, or product-withdrawal request
    - Pause investment; require independent security audit and remediation proof
  - - Cadence IP litigation
    - Material docket adverse development
    - Injunction, adverse merits ruling, restrictive settlement, or material reserve
    - Re-rate legal risk; counsel review before proceeds
  - - Reliability / bricking
    - Connected-fleet outage or mass defect
    - '>7 days unresolved, >5% active devices impaired, or repeat fleet-wide bricking'
    - Treat as thesis break until root cause and controls are proven
  - - Tariffs / landed cost
    - US duty burden or customs friction rises
    - '>15 percentage-point landed-cost increase on core SKUs without price power'
    - Rebuild unit economics; require non-China mitigation plan
  - - Channel dependence
    - Amazon or Best Buy disruption
    - Delisting, suppressed ranking, return spike, or >30% sales concentration in one channel
    - Discount revenue quality; require channel-diversification proof
  - - Private financial opacity
    - Runway/margin evidence unavailable
    - Management cannot provide cash runway, SKU margin, warranty reserve and working-capital bridge
    - Do not underwrite valuation beyond research-more / track
  - - Execution/key person
    - Founder or QA/security leadership disruption
    - CEO departure, QA/security head turnover, or no named accountable owner
    - Require governance bench and operating cadence review
  notes: Thresholds are investor diligence triggers, not company guidance; several require private management data to monitor
    precisely.
