- id: regulatory-legal-and-security-risk
  title: Regulatory, Legal, Privacy and Security Risk
  body: The regulatory/legal register is the canonical adverse-evidence core of this chapter. The Korea Consumer Agency source
    is primary regulatory evidence that robot vacuums can be treated as camera-enabled IoT privacy devices, not merely floor-cleaning
    appliances. Media follow-on coverage named Chinese models including Narwal’s Freo Z Ultra, raising the severity of any
    future security lapse. Lopez v. Narwal is narrower but still relevant because Narwal sells through consumer e-commerce
    channels and website-accessibility failures can recur across checkout and support workflows. Cadence’s Northern District
    of California lawsuit against Narwal-branded Chinese entities creates a deeper legal overhang, especially because separate
    Cadence export-control resolutions show the sensitivity of semiconductor-design software flows to China. Finally, Section
    301 tariffs and de minimis changes increase landed-cost friction in 2026, while US smart-home/camera scrutiny remains
    a plausible forward risk even without a Narwal-specific US enforcement action.
