  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-risk
    missingEvidence: Audited gross margin, SKU-level contribution margin, burn, runway, cash, working capital, warranty reserve
      and debt data were not available in public sources reviewed.
    whyItMatters: The downside case cannot quantify whether tariffs, returns or promotions consume the unit economics of premium
      robot vacuums.
    diligencePath: Request audited or management financials, SKU margin bridges, warranty reserve roll-forward and cash runway
      by month.
    relatedQuestionRefs:
    - QR020
    - QR030
    - QR032
  - type: missing-source
    severity: material
    topic: privacy-security
    missingEvidence: No public SOC 2, ISO 27001, third-party penetration test, vulnerability-disclosure program, data-residency
      map or post-KCA patch validation was found.
    whyItMatters: Security posture is central after camera/privacy findings and determines whether retailer or regulator scrutiny
      is remediable.
    diligencePath: Request security certifications, pen-test reports, vulnerability management policy, firmware patch notes
      and cloud data-flow diagrams.
    relatedQuestionRefs:
    - QR010
    - QR031
  - type: private-evidence-only
    severity: material
    topic: channel-dependency
    missingEvidence: Public sources confirm DTC, Amazon and Best Buy presence but not sell-through mix, return rates, ratings
      impact, or channel concentration.
    whyItMatters: A platform shock is only thesis-breaking if channel concentration is high; public evidence cannot quantify
      the exposure.
    diligencePath: Request channel revenue split, top-retailer terms, return rates, review trends, and marketplace ranking
      history.
    relatedQuestionRefs:
    - QR012
    - QR021
    - QR026
  - type: missing-source
    severity: material
    topic: IP-litigation
    missingEvidence: The public docket sources reviewed do not provide a final merits outcome, settlement terms, legal reserves,
      or management assessment of Cadence litigation exposure.
    whyItMatters: An injunction or restrictive settlement could impair Narwal-branded affiliates and partner confidence.
    diligencePath: Obtain full docket, pleadings, counsel memo, insurance coverage and legal reserve schedule.
    relatedQuestionRefs:
    - QR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk
    missingEvidence: The legal/regulatory register is partial and does not enumerate every possible jurisdiction, state privacy
      law, retailer compliance rule, or customs classification.
    whyItMatters: Narwal sells cross-border connected consumer devices; additional local rules could add friction.
    diligencePath: Commission jurisdiction-by-jurisdiction privacy, customs, product-safety and accessibility review.
    relatedQuestionRefs:
    - QR002
    - QR018
    relatedTableRefs:
    - TR002
