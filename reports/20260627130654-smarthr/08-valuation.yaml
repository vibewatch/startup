- id: scenarios
  title: Valuation context, scenarios, and sensitivity
  body: Scenario work is more honest than a single-point answer. The last confirmed valuation anchor is old enough that investors
    should not simply roll it forward mechanically. Instead, they should test what different combinations of growth, retention,
    module attach, and market multiples would imply for value. The bull case assumes SmartHR behaves more like a broadening
    workflow platform with improving economics and stronger enterprise proof. The base case assumes good but not extraordinary
    growth, a transparency discount, and some multiple pressure from public comps. The bear case assumes that the ARR headline
    overstates underlying quality and that public-market multiple compression outweighs operating progress. Public filings
    from Workday, Paylocity, Dayforce, and Japanese peers are enough to anchor ranges, but not enough to eliminate uncertainty.
    That is why the valuation conclusion remains explicitly sensitive to evidence quality, scenario discipline, and the final
    private-company diligence package. That is why the valuation conclusion remains explicitly sensitive to evidence quality,
    scenario discipline, and the final private-company diligence package.
