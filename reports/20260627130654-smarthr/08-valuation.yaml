  evidenceGaps:
  - type: missing-source
    severity: material
    topic: multiple-sensitivity
    missingEvidence: Current private-market mark sensitivity to public multiple moves is not directly disclosed.
    whyItMatters: Entry discipline depends on how much valuation already prices in upside.
    diligencePath: Request recent secondary pricing and board valuation materials.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: comparables
    missingEvidence: Domestic and global comps each have structural flaws for SmartHR.
    whyItMatters: Poor comp choice can create false confidence in value.
    diligencePath: Pressure-test both local and global comp sets with management.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Cap-table dilution, preferences, and secondary terms remain private.
    whyItMatters: These terms can materially change effective entry value.
    diligencePath: Request full cap table, preferences, and option-pool assumptions.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Gross margin, NRR, and runway remain the highest-priority missing economic inputs.
    whyItMatters: These determine whether fair valuation could become attractive.
    diligencePath: Request audited KPI pack.
    relatedQuestionRefs:
    - QV025
