company:
  name: SmartHR, Inc.
chapter:
  number: 8
  title: Valuation
  summary: SmartHR looks investable on strategic position and disclosed traction, but not transparent enough to justify a
    maximalist valuation view. The most defensible call on current public evidence is buy with medium confidence and a fair
    valuation stance, subject to confirming private-company economics in diligence.
sections:
- id: thesis
  title: Investment thesis and anti-thesis
  body: 'The positive case is straightforward. SmartHR appears to hold a strong position in a Japan-specific compliance software
    category, has proven meaningful recurring revenue, and is broadening from a narrow labor-administration wedge toward a
    richer workflow platform. That combination can compound well if the company keeps retention high and lifts product attach.
    The anti-thesis is just as clear: investors still cannot see enough of the economic engine. Margins, cohort retention,
    and cash conversion remain private, while competition from domestic peers and larger suites is real. In other words, SmartHR
    may be a strong company at the wrong price if the market pays for perfect execution too early. The right valuation posture
    must therefore stay grounded in evidence quality as much as in company quality. That is why the valuation conclusion remains
    explicitly sensitive to evidence quality, scenario discipline, and the final private-company diligence package. That is
    why the valuation conclusion remains explicitly sensitive to evidence quality, scenario discipline, and the final private-company
    diligence package.'
  claimRefs:
  - CV001
  - CV002
  - CV014
  - CV026
  - CV036
  - CV037
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: recommendation
  title: Recommendation, confidence, and valuation stance
  body: 'Given the current evidence set, a buy recommendation is supportable, but it should be framed with medium confidence
    and a fair—not attractive—valuation stance. The reason is simple: public traction is good enough to stay constructive,
    but the missing private-company economics are too important to ignore. Investors can justify taking the meeting and doing
    the work because the strategic position is real. They cannot justify treating the asset as fully de-risked because the
    underwrite still depends on information management has not published. Risk should therefore sit in the medium range. That
    balances the strength of the category and installed base against the still-material uncertainties around margin quality,
    retention depth, and execution breadth. A strong-buy label would imply a better evidence set than currently exists. That
    is why the valuation conclusion remains explicitly sensitive to evidence quality, scenario discipline, and the final private-company
    diligence package. That is why the valuation conclusion remains explicitly sensitive to evidence quality, scenario discipline,
    and the final private-company diligence package.'
