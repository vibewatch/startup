- id: exit-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'The final IC posture should be disciplined. SmartHR likely deserves investor attention because it sits in a durable
    category with visible platform optionality. It does not deserve a premium-growth valuation on trust alone. Before paying
    up, investors should require current ARR, NRR, gross margin, cash runway, module attach by segment, and cap-table terms
    including any preference overhang. The most important downside triggers are equally clear: privacy incidents, reliability
    failures during statutory deadlines, and evidence that public peers or global suites are taking integrated accounts faster.
    If diligence resolves the economic gaps positively, the recommendation can strengthen. If it does not, the correct move
    is not necessarily “avoid,” but “research more” or “lower price discipline.” Valuation here is explicitly evidence-sensitive.
    That is why the valuation conclusion remains explicitly sensitive to evidence quality, scenario discipline, and the final
    private-company diligence package. That is why the valuation conclusion remains explicitly sensitive to evidence quality,
    scenario discipline, and the final private-company diligence package.'
