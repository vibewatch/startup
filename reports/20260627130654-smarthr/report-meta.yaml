companyProfile:
  summary: SmartHR is a Japan-native cloud HR platform built around labor-administration compliance, employee data workflows,
    and adjacent talent modules. Its core strategic value comes from embedding itself in regulated recurring workflows that
    are painful to manage manually in Japan.
  foundedDate: '2013-01-01'
  founders:
  - name: Naoya Kubo
