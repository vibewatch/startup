  headquarters: Tokyo, Japan
  productSummary: SmartHR sells cloud software for labor administration, employee records, year-end adjustment, onboarding,
    and adjacent HR workflows, with partner ecosystem and API signals that support a broader platform narrative.
  customerFocus: Japanese employers across SMB, mid-market, and selected enterprise accounts that need compliance-heavy employee
    workflow automation.
  businessModel: B2B SaaS subscription, likely per-employee and module-led, with expanding ecosystem and add-on monetization
