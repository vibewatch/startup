  evidenceGaps:
  - type: missing-source
    severity: material
    topic: daily-usage
    missingEvidence: Public sources do not quantify employee-level DAU/MAU or workflow frequency.
    whyItMatters: Daily usage is central to expansion and moat quality.
    diligencePath: Request module-level activity metrics by segment.
    relatedQuestionRefs:
    - QU023
  - type: missing-source
    severity: material
    topic: cohorts
    missingEvidence: No public cohort NRR, GRR, or concentration schedule is available.
    whyItMatters: These are the core missing durability metrics.
    diligencePath: Request cohort retention, top-10 account mix, and attach by module.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: representativeness
    missingEvidence: Named references may overstate the median customer experience.
    whyItMatters: Selective references can bias quality judgments.
    diligencePath: Request randomized customer references and churn interviews.
    relatedQuestionRefs:
    - QU017
