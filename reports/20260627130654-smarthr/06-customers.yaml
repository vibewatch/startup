chapter:
  number: 6
  title: Customers
  summary: Public customer evidence supports a real, multi-segment installed base built on recurring compliance workflows
    and concrete operational benefits. The biggest open questions are not whether SmartHR has customers, but how retention,
    concentration, and module attach look by segment beneath the strong headline narrative.
sections:
- id: segments
  title: Customer segments, buyer roles, and use cases
  body: 'Public evidence suggests SmartHR is not trapped in a single niche. Review and named-customer signals point to use
    across small businesses, mid-market firms, and larger organizations, with visible verticals including food service, manufacturing,
    and IT services. The common denominator is not industry but workflow pain: employers that repeatedly handle employee records,
    year-end adjustment, onboarding, and other compliance-heavy processes appear most likely to adopt. That is important because
    it means SmartHR''s best segment definition is job-based rather than purely vertical. Buyers still differ by company size,
    but the underlying value proposition—replace manual and error-prone administration with recurring workflow software—travels
    well. The result is a customer base that looks broad in logo type, while still clustering around organizations where compliance
    repetition makes software sticky. The customer chapter should therefore be read as strong proof of real adoption, paired
    with explicit requests for deeper cohort and concentration evidence. The customer chapter should therefore be read as
    strong proof of real adoption, paired with explicit requests for deeper cohort and concentration evidence.'
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU018
  - CU028
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof
  title: Named customer proof and observable outcomes
  body: 'The strongest customer-proof comes from independent review pages and named references that imply production usage
    rather than casual trials. Review evidence highlights recurring tasks such as year-end adjustment and employee information
    handling, which suggests customers depend on the product in moments that matter. Named-customer domains like Ore no, Tokyo
    Ink, and ProVision do not, on their own, prove SmartHR product depth, but they improve confidence that the product reaches
    across very different operating contexts. Public outcomes are operational rather than grandiose: less paperwork, fewer
    errors, and faster completion of regulated workflows. That pattern is exactly what investors want from a compliance-led
    system. It indicates real value, even if public evidence is still too thin to quantify how much of the overall customer
    base has adopted expansion modules or how many references are representative of the median account. The customer chapter
    should therefore be read as strong proof of real adoption, paired with explicit requests for deeper cohort and concentration
    evidence.'
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU007
  - CU017
  - CU018
  - CU027
  - CU029
  - CU032
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU002
  - FU003
- id: durability
  title: Retention, durability, and review-based quality signals
  body: 'Customer durability appears directionally good, but it is still only partially observable. The product sits inside
    annual and monthly administrative workflows that employers cannot ignore, which should support repeat usage and make churn
    less attractive. Review evidence also suggests users experience real convenience gains, which helps retention beyond mere
    switching cost. At the same time, the absence of public NRR, GRR, or churn disclosure means investors should not confuse
    recurring workflow importance with fully proven cohort quality. Reviews introduce a useful balance here: they confirm
    genuine user value but also surface recurring complaints on mobile performance and customization limits. That combination
    supports a nuanced view. SmartHR looks sticky for the right reasons, yet still has product-quality issues that could matter
    more as customers scale or expand usage across more workflows. The customer chapter should therefore be read as strong
    proof of real adoption, paired with explicit requests for deeper cohort and concentration evidence. The customer chapter
    should therefore be read as strong proof of real adoption, paired with explicit requests for deeper cohort and concentration
    evidence.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU012
  - CU022
  - CU023
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion
  title: Expansion vectors, concentration, and diligence gaps
  body: 'The expansion story is credible but not fully measured in public. SmartHR likely has a classic land-and-expand motion:
    win on compliance, become part of the employee system of record, then sell adjacent modules or ecosystem apps. Public
    evidence supports the logic of that motion, but it does not reveal module attach by segment, revenue concentration, or
    whether the best customers materially outgrow the average. That is the key remaining customer diligence task. Public references
    are selective, and while they are better than logo walls, they still leave open whether the most enthusiastic stories
    reflect the median deployment. Investors should therefore ask directly for retention and concentration schedules, product
    attach by cohort, and public-sector or highly regulated customer proof. The customer base looks real and broad; the remaining
    work is to prove how economically durable the best cohorts really are. The customer chapter should therefore be read as
    strong proof of real adoption, paired with explicit requests for deeper cohort and concentration evidence.'
  claimRefs:
