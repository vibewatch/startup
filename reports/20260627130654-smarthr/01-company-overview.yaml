  - id: milestones-timeline
    title: Key Milestones and Timeline
    body: |
      SmartHR's development has been marked by several significant milestones across founding, product development, financing, and scale achievements.

      Founding milestones include the company's legal incorporation on January 23, 2013, and the launch of the SmartHR product in November 2015. The initial product focused on automating social insurance procedures, addressing one of the most time-consuming aspects of Japanese HR administration.

      Financing milestones demonstrate the company's growth trajectory: Series A funding in 2016 established early growth capital, Series B ($13.3M) and Series C ($54.9M) rounds in 2018-2019 funded product expansion, and the Series D ($142.5M) in June 2021 achieved unicorn valuation. The Series E ($140M) in June 2024 and General Atlantic secondary ($96M) in November 2025 represent the most recent capital events.

      Product milestones include expansion from core HR paperwork automation to a comprehensive talent management platform. The company has added performance management, training management, employee surveys, and workforce analytics capabilities. API integrations with major payroll and accounting systems have extended the platform's utility.

      Scale milestones include reaching 10,000 customers, then 30,000, 50,000, and most recently over 60,000 companies using the platform. ARR milestones passed ¥10 billion in February 2023, ¥15 billion ($100M USD) in February 2024, and exceeded ¥20 billion ($130M+) by 2025-2026.

      The company is currently preparing for a potential IPO on the Tokyo Stock Exchange, representing the next major milestone in its corporate development.
