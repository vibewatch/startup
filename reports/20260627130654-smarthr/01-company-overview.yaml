sections:
  - id: corporate-identity
    title: Corporate Identity and Business Model
    body: |
      SmartHR, Inc. (株式会社SmartHR) is a Tokyo-based HR technology company that develops and operates Japan's leading cloud-based human resources management platform. Founded on January 23, 2013, the company provides software-as-a-service (SaaS) solutions that automate complex Japanese HR administrative procedures, including social insurance paperwork, employment contracts, payroll integration, and talent management.

      The company's core product, SmartHR, addresses a significant pain point in the Japanese market: the highly complex and paper-intensive HR compliance requirements mandated by Japanese labor laws. Traditional HR administration in Japan involves extensive paperwork for social insurance enrollment, labor standards reporting, and other regulatory submissions. SmartHR digitizes these processes, enabling companies to complete in minutes what previously required hours of manual paperwork.

      SmartHR operates on a subscription-based SaaS business model, charging monthly or annual fees based on the number of employees managed through the platform. The company targets both small-to-medium enterprises (SMEs) and large enterprises across Japan, with pricing tiers that scale with organizational size and feature requirements.

      As of 2026, SmartHR has grown to serve over 60,000 companies and achieved annual recurring revenue (ARR) exceeding ¥20 billion (approximately $130 million USD). The company is headquartered in the Roppongi district of Tokyo and employs approximately 700-1,100 staff members across its operations.
