  - id: leadership-governance
    title: Leadership and Governance
    body: |
      SmartHR was founded by Kensuke Naito, who serves as the company's Chief Information Officer (CIO) and remains actively involved in the company's strategic direction. The founding team developed the initial product based on firsthand experience with the inefficiencies of Japanese HR paperwork systems.

      The company's current Chief Executive Officer is Masato Serizawa, who assumed the role in January 2022. Serizawa brought extensive experience in scaling technology companies in Japan and has led SmartHR through its rapid growth phase, including multiple funding rounds and expansion of the product portfolio.

      The executive leadership team includes Yuji Mori as Chief Financial Officer, Takafumi Kurahashi as Chief Operating Officer, and Takashi Adachi as Chief Product Officer. This experienced management team has guided the company through significant milestones including achieving unicorn status and preparing for a potential initial public offering.

      SmartHR's board and governance structure includes representation from key investors including KKR, Ontario Teachers' Pension Plan (through its Technology Venture Group), Coral Capital, Light Street Capital, and other institutional backers. The company maintains a professional governance framework appropriate for a late-stage private company preparing for public markets.

      Key-person risk is moderated by the depth of the executive team, though founder Kensuke Naito's continued involvement as CIO provides important continuity and institutional knowledge. The transition from founder-CEO to professional management under Serizawa demonstrates organizational maturity.
