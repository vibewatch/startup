  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Exact current valuation following Series E and secondary transactions is not publicly disclosed.
      whyItMatters: Precise valuation affects investment entry point analysis and comparables.
      diligencePath: Request cap table or latest 409A valuation from company during due diligence.
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: Profitability metrics, unit economics, and path to profitability are not publicly disclosed.
      whyItMatters: Understanding margin profile is critical for assessing IPO readiness and sustainable growth.
      diligencePath: Request audited financials or management presentation during data room access.
      relatedQuestionRefs:
        - QO018
    - type: missing-source
      severity: minor
      topic: financials
      missingEvidence: Net revenue retention rate (NRR) is not publicly disclosed.
      whyItMatters: NRR is a key SaaS metric that indicates customer expansion and churn dynamics.
      diligencePath: Request SaaS metrics dashboard or customer cohort analysis from company.
    - type: enumeration-incomplete
      severity: minor
      topic: leadership
      missingEvidence: Complete executive biographies, board composition, and advisory roles not fully documented.
      whyItMatters: Full leadership visibility needed for key-person risk assessment and governance evaluation.
      diligencePath: Request organizational chart and board deck from company.
      relatedTableRefs:
