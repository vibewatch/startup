  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cash-burn
    missingEvidence: No public cash-burn bridge or runway disclosure is available.
    whyItMatters: Runway drives financing risk and negotiating leverage.
    diligencePath: Request monthly burn, net cash, and scenario runway schedule.
    relatedQuestionRefs:
    - QI022
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, and NRR remain private.
    whyItMatters: Without unit economics, valuation cannot be underwritten confidently.
    diligencePath: Request cohort revenue, margin, CAC, and retention by segment.
    relatedQuestionRefs:
    - QI023
  - type: missing-source
    severity: minor
    topic: revenue-mix
    missingEvidence: Public sources do not disclose ARR split by module or customer size.
    whyItMatters: Upsell quality and concentration shape durability.
    diligencePath: Request product-level ARR mix and attach rates.
    relatedQuestionRefs:
    - QI024
    - QI025
