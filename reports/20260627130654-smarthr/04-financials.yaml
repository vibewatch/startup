company:
  name: SmartHR, Inc.
chapter:
  number: 4
  title: Financials
  summary: SmartHR has enough public disclosure to prove real scale—most importantly about $100M of ARR disclosed in 2024
    and category-leadership claims in Japan labor-management cloud. But the company remains financially opaque on gross margin,
    burn, CAC, payback, and cash balance, so underwriting still depends heavily on peer benchmarks and explicit diligence
    asks.
sections:
- id: revenue-model
  title: Revenue model and visible monetization
  body: 'The cleanest public read-through is that SmartHR monetizes as a subscription software business tied to employee and
    workflow usage rather than to one-time implementation fees or payment volume. The disclosed ARR figure, combined with
    the company''s market position in labor-management cloud and its large customer base, strongly supports a recurring-revenue
    model. Expansion vectors also appear visible: SmartHR Plus broadens the ecosystem, and later product modules create potential
    for higher attach per account. What remains hidden is the exact pricing ladder, the split between core labor administration
    and newer products, and how much enterprise customers differ from SMBs in ACV. That means the right framing is not “pricing
    is known,” but “the monetization architecture is visible while realized revenue mix remains private.” This financial framing
    intentionally distinguishes between what public evidence proves today and what still requires direct management disclosure
    in diligence. This financial framing intentionally distinguishes between what public evidence proves today and what still
    requires direct management disclosure in diligence.'
  claimRefs:
  - CI001
  - CI002
  - CI006
  - CI007
  - CI011
  - CI012
  - CI023
  - CI033
  tableRefs:
  - TI001
  - TI002
