- id: verdict
  title: Financial verdict and diligence blockers
  body: 'Financially, SmartHR screens as a real software asset with meaningful scale, market leadership, and credible recurring
    revenue. It does not yet screen as fully underwritable on public evidence alone. Revenue quality is promising but not
    fully observable; margin path is plausible but not disclosed; capital dependency looks manageable in the near term but
    not auditable. The company therefore deserves a positive but qualified financial view: strong enough to stay on the buy
    side of the diligence funnel, not transparent enough to skip management requests. The most important asks are simple and
    specific—cash balance, burn, gross margin, NRR, CAC, payback, ARR mix by module and segment, and enterprise-vs-SMB cohort
    behavior. Without those, valuation work can only be approximate. This financial framing intentionally distinguishes between
    what public evidence proves today and what still requires direct management disclosure in diligence. This financial framing
    intentionally distinguishes between what public evidence proves today and what still requires direct management disclosure
    in diligence.'
