- id: efficiency
  title: Traction and efficiency proxies
  body: 'Public data prove scale, but only through selected signals. The disclosed ARR and prior-year revenue estimate show
    meaningful commercial traction. Market-share reports reinforce that the company is not a niche experiment. From there,
    investors are forced into proxies: implied ACV, likely revenue per employee, and comparison against public HR SaaS peers.
    Those proxies suggest SmartHR still monetizes at a lower level than mature enterprise HCM platforms, which is not surprising
    given its domestic compliance roots and large likely SMB footprint. They also suggest upside if the company can move upmarket
    or lift attach through talent, analytics, and AI modules. The challenge is that without segment-level customer mix or
    NRR, investors cannot cleanly separate healthy expansion from simple top-of-funnel growth. This financial framing intentionally
    distinguishes between what public evidence proves today and what still requires direct management disclosure in diligence.
    This financial framing intentionally distinguishes between what public evidence proves today and what still requires direct
    management disclosure in diligence.'
