- id: costs-capital
  title: Cost structure, capital adequacy, and peer context
  body: 'SmartHR looks like a capital-light software company in model, but not in operating ambition. Hiring, community, and
    product-expansion signals all point to ongoing investment in engineering, ecosystem, and AI-enabled features. That supports
    the strategic case, but it also means investors should not assume near-term margin optimization. Because the company remains
    private, the most important missing bridge is cash and burn. The 2024 primary round clearly improved near-term capital
    adequacy, but there is no public basis to calculate runway or to judge how aggressively management is investing. Public
    peers are therefore essential context: filings from Workday, Dayforce, and Paylocity show what good software margins can
    look like, while also reminding investors that broad product suites and efficient go-to-market execution are what convert
    growth into durable economics. This financial framing intentionally distinguishes between what public evidence proves
    today and what still requires direct management disclosure in diligence. This financial framing intentionally distinguishes
    between what public evidence proves today and what still requires direct management disclosure in diligence.'
