      - number: '7.2'
        title: 运营、安全与产品质量风险
        blocks:
          - type: paragraph
            body: >-
              运营质量是第二个主要风险桶。SmartHR
              嵌在与薪资相邻且对截止日期敏感的工作流中，因此可靠性在这里比许多横向协作工具更重要。公开评论证据已经暴露应用质量和边缘场景行为上的痛点，尤其是在高频使用时段。这不能证明系统性弱点，但证明风险并非纯粹假设。安全义务同样更高，因为云端
              HR 平台触及身份、税务和员工主数据。日本外部安全和事件响应指引提供了衡量优秀控制应有形态的强基准，但 SmartHR
              的公开披露没有给出足够细节，无法检验真实运营是否匹配这些预期。因此，投资者应把运营质量作为核心风险承销，而不是增长脚注。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。
