    summary: 隐私、法律合规准确性和高峰运营位于风险栈顶部。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 隐私 / APPI
          values:
            - 高
            - 高
            - 低到中
        - label: 高峰运营质量
          values:
            - 中
            - 高
            - 低
        - label: 竞争 / 利润率
          values:
            - 中
            - 中到高
            - 中
        - label: AI 治理
          values:
            - 中
            - 中
            - 低
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR009
      - CR012
      - CR022
      - CR030
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律或运营失误会迅速传导到信任、留存和估值。
    data:
      nodes:
        - id: privacy
          label: 隐私失误
        - id: ops
          label: 运营失误
        - id: trust
          label: 客户信任
        - id: ret
          label: 留存质量
        - id: val
          label: 估值
      edges:
        - from: privacy
          to: trust
        - from: ops
          to: trust
        - from: trust
          to: ret
        - from: ret
          to: val
    claimRefs:
      - CR001
      - CR006
      - CR012
      - CR022
      - CR027
      - CR030
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: SmartHR 同时依赖法律制度、云安全态势和资本市场环境。
    data:
      nodes:
        - id: smarthr
          label: SmartHR
        - id: law
          label: APPI / 劳动法 / 税务规则
        - id: cloud
          label: 云与 AI 提供商
        - id: market
          label: 公开资本市场
        - id: peers
          label: 上市和私营同业
      edges:
        - from: law
          to: smarthr
        - from: cloud
          to: smarthr
        - from: peers
          to: smarthr
        - from: market
          to: smarthr
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR015
      - CR018
      - CR022
      - CR035
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议同时取决于市场位置、证据质量和估值纪律。
    data:
      nodes:
        - id: position
          label: 战略位置
        - id: evidence
          label: 证据质量
        - id: risk
          label: 风险画像
        - id: rec
          label: 买入 / 公允 / 中等信心
      edges:
        - from: position
          to: rec
        - from: evidence
          to: rec
        - from: risk
          to: rec
    claimRefs:
      - CV001
      - CV008
      - CV015
      - CV016
      - CV030
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 价值对增长质量、留存质量和市场倍数最敏感。
    data:
      items:
        - label: 增长 / ARR 规模
          value: 9
        - label: 留存质量
          value: 10
        - label: 毛利率
          value: 8
        - label: 公开市场倍数环境
          value: 9
        - label: 股权结构条款
          value: 7
    approximationNotes: 条形表示序位敏感度分数，不是预测百分比变化。
    claimRefs:
      - CV010
      - CV013
      - CV019
      - CV020
      - CV021
      - CV029
      - CV035
  - id: FV003
    title: 估值与回报区间
    type: range
    layout: standard
    summary: 在现有证据下，用区间法比给出单点估值更站得住脚。
    data:
      items:
        - label: 熊市情景隐含 EV（USD bn）
          low: 1
          mid: 1.2
          high: 1.4
        - label: 基准情景隐含 EV（USD bn）
          low: 1.4
          mid: 1.8
          high: 2.2
        - label: 牛市情景隐含 EV（USD bn）
          low: 2.2
          mid: 2.8
          high: 3.4
    approximationNotes: 区间是方向性的情景包络，锚定公开可比公司和公开 ARR 语境，不是管理层指引。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV009
      - CV010
      - CV011
      - CV022
      - CV023
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的评分卡更看重战略位置，而非披露质量。
    data:
      items:
        - label: 市场位置
          value: 8/10
        - label: 产品 / 护城河
          value: 7/10
        - label: 客户证据
          value: 7/10
        - label: 财务透明度
          value: 5/10
        - label: 综合评分
          value: 7.5/10
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV027
      - CV030
      - CV031
