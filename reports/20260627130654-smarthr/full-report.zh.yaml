  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案集合
        blocks:
          - type: paragraph
            body: >-
              SmartHR 并不是在一维市场里竞争。jinjer、HRBrain 等直接同业在日本本土云端 HR 模块上重叠，WHI/COMPANY 仍是大型企业部署中最强的本土既有厂商。低端市场，Jobcan
              和类似考勤导向工具施加价格压力。高端市场，Workday、Oracle 和 SAP 带来广套件和深 ERP
              关系。公司还要继续同非软件替代方案竞争，例如电子表格、薪资服务机构和内部拼接的工作流。关键在于，买方选择高度取决于公司规模和既有系统。因此，正确框架是一组竞争栈：低端的简单性、本土套件广度、企业级治理、全球套件集成，都在争夺同一预算的不同部分。所以，这里的竞争对手分析应被读作一张动态战略地图，而不是静态市场份额记分牌。所以，这里的竞争对手分析应被读作一张动态战略地图，而不是静态市场份额记分牌。
