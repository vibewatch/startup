  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是投资者首先应关注的地方。SmartHR 在一个隐私义务、税务处理、劳动记录和身份号码规则都很重要的国家处理高度敏感的员工信息。APPI、My Number
              义务、劳动法记录保存，以及围绕跨境传输不断演变的指引，共同构成密集法律边界。正面解释是，这种复杂性保护了本土专家。更硬的事实是，同样的复杂性也会急剧提高出错成本。如果 SmartHR
              处理员工数据不当，或未能足够快反映法定工作流变化，产品可能很快从「护城河」变成「负债」。公开法律来源很多，但关于 SmartHR
              公司特定控制的公开证据很少。因此，隐私和法律运营成为最重要的尽调工作流。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。
