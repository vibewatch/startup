      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              自成立以来，SmartHR 已通过九到十轮融资累计筹集约 $328–453 million。公司在 2021 年成为独角兽（估值超过 $1 billion），并在后续融资中维持了这一地位。


              最近最重要的融资事件是 2024 年 6 月 30 日完成的 $140 million Series E。本轮由全球投资机构 KKR 领投，Ontario Teachers' Pension Plan 通过其
              Technology Venture Group（TVG）共同参与。Coral Capital、WiL 和 DNX Ventures 等老股东也参与了本轮融资。本轮融资使 SmartHR 的估值与其 2021
              年约 $1.6 billion 的估值保持一致。


              2025 年 11 月，SmartHR 通过一笔二级交易获得额外 $96 million，General Atlantic 从现有投资者 Coral Capital 手中收购股份。这笔交易是一项战略投资，把
              General Atlantic 扩张全球 SaaS 公司的运营经验带入 SmartHR 的投资者阵容。


              更早的融资节点包括 2021 年 6 月由 Light Street Capital 领投的 $142.5 million Series D、2019 年 4 月的 $54.9 million Series
              C，以及 $13.3 million Series B。公司的融资轨迹反映出投资者对日本 HR 科技市场机会的强信心。


              SmartHR 的估值自早期以来大幅增长，并在 2021 年达到 $1.6 billion 的独角兽门槛。据报道，公司正准备在东京证券交易所进行 IPO，时间最早可能在 2026 年，公开市场目标估值为 $1
              billion 或以上。
