      - number: '6.2'
        title: 具名客户证明与可观察结果
        blocks:
          - type: paragraph
            body: >-
              最强的客户证明来自独立评论页面和具名引用，它们暗示的是生产环境使用，而不是随意试用。评论证据突出了年末调整和员工信息处理等重复任务，说明客户在关键时刻依赖产品。Ore no、Tokyo Ink 和
              ProVision 等具名客户域名本身不能证明 SmartHR
              产品深度，但会提高我们对产品能够进入非常不同运营场景的信心。公开结果偏运营，而非宏大叙事：减少文书、降低错误、更快完成受监管工作流。这种模式正是投资者希望从合规导向系统中看到的。它指向真实价值，即便公开证据仍太薄，无法量化整体客户基础中有多少采用了扩展模块，或多少客户引用能代表中位账户。因此，客户章节应被读作真实采用的强证据，同时配套提出对更深入
              cohort 和集中度证据的明确要求。
