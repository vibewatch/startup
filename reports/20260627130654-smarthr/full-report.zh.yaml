      - number: '2.4'
        title: 增长驱动、约束与未解缺口
        blocks:
          - type: paragraph
            body: >-
              需求有强监管和结构性支撑。工作方式改革、电子申报、My Number 义务、压力检查要求，以及更广的人力资本报告预期，都抬高了继续手工处理的成本。劳动力短缺进一步改善自动化 ROI，尤其对精简 HR
              团队更明显。与此同时，创造需求的法律复杂性也会拖慢采用。买方担心实施准确性、隐私，以及新供应商能否跟上法规变化。SME 可能因缺少 IT
              能力而推迟采购；企业客户可能因集成和安全审查而推迟。面向日本本地化的全球供应商也会限制市场高端的长期上行空间。净结果是：品类有利，但执行风险不小。主要公开数据缺口在细分层面的渗透率：独立来源仍无法清楚回答，云端劳动管理按公司规模或模块组合到底渗透到什么程度。投资者应把这个品类视为有吸引力，但仍取决于信任、实施质量，以及按细分市场逐步渗透的审慎假设。
