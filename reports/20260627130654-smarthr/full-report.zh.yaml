      - number: '7.3'
        title: 依赖、市场与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              依赖风险贯穿基础设施、公共政策和资本市场。SmartHR 依赖外部云、安全，以及可能的 AI-service 层来交付较新功能。公司也处在一个市场里，上市同业和更大套件厂商可能加剧定价和功能压力。这很重要，因为
              SmartHR 更广平台论点还没有被公开财务完全证明：如果模块 attach 和利润率质量成熟前竞争先压缩定价，业务对公开市场投资者的吸引力可能下降。退出时点还叠加了另一层风险。软件 IPO
              窗口、日本成长股偏好和公开 HR-software
              倍数，都可能独立于产品质量波动。公司可以执行得很好，仍遇到糟糕市场时点。这些因素单独看并不会杀死论点，但会压缩执行出错空间。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。实际承销中，投资者应假设风险画像只有在公司特定控制被展示之后才会改善，而不是仅仅因为品类需求仍然健康。
