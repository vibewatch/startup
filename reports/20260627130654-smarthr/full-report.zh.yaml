      - number: '8.4'
        title: 退出准备度、破坏论点触发项和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终 IC 立场应当克制。SmartHR 值得投资人关注，因为它处在一个韧性强的品类里，平台化空间也看得见。但仅凭信任资产，还不足以支撑高增长溢价。投资人支付溢价之前，应要求公司披露当前
              ARR、NRR、毛利率、现金续航、各客群模块绑定情况，以及包含任何优先权累积压力的股权结构条款。最重要的下行触发点同样清楚：隐私事件、法定申报截止期内的可靠性故障，以及公开可比公司或全球套件更快拿下集成账户的证据。如果尽调能正面填补经济性缺口，建议可以上调。否则，正确动作未必是「回避」，而是「继续研究」或「压低价格纪律」。这里的估值明确取决于证据。因此，估值结论仍然明确受证据质量、情景纪律和最终私营公司尽调资料包影响。因此，估值结论仍然明确受证据质量、情景纪律和最终私营公司尽调资料包影响。
