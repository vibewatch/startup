      - number: '3.3'
        title: 定价、切换成本与分发能力
        blocks:
          - type: paragraph
            body: >-
              日本 HCM 公开定价透明度普遍较差，因此比较采购往往取决于打包方式、伙伴建议和感知实施难度，而不是公开标价。低端供应商会压低入门价格，尤其是员工少于 100 人的企业；而拥有 ERP
              关系的既有厂商在大客户中享有分发和信任优势。当买方想要一个实施摩擦更低、以本土合规为先的系统时，SmartHR 受益；但当采购中心是财务或 IT，且已标准化到 Oracle、SAP 或 Workday
              上时，SmartHR
              面临更难的战斗。切换成本也不是线性的。小公司从电子表格迁出时成本不高；一旦审批、身份、薪资规则和员工数据深度嵌入，成本会高得多。这种结构支撑留存，但如果更广套件厂商解决了足够多的相邻任务，也不能让 SmartHR
              免于被替代。所以，这里的竞争对手分析应被读作一张动态战略地图，而不是静态市场份额记分牌。
