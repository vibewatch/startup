      - number: '3.2'
        title: 同业画像与细分重叠
        blocks:
          - type: paragraph
            body: >-
              本土同业集合说明，SmartHR 不能永远只依赖单一切口。WHI 强调重企业支持和治理；jinjer 正向集成 HR 数据库和 AI 信息能力收敛；HRBrain
              攻击人力资本管理和上市公司披露需求；TeamSpirit 来自内部控制和工时跟踪。ERP 集成重要的场景里，全球既有厂商仍更难被替代，但它们在自助部署和日本本土中端市场 UX 上较弱。因此，SmartHR
              今天处在一个有用的中间位置：在广度上强于低端工具，在本地易用性上强于企业级既有厂商。承销问题在于，这个中间位置会演变成持久平台优势，还是同时被市场两端挤压。所以，这里的竞争对手分析应被读作一张动态战略地图，而不是静态市场份额记分牌。所以，这里的竞争对手分析应被读作一张动态战略地图，而不是静态市场份额记分牌。
