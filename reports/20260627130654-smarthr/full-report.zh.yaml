    rows:
      - - 牛市
        - 附加销售高、留存强、利润率改善
        - 更大 ARR 基础上取同业倍数区间上沿
        - 执行宽度
        - 需要强 KPI 披露
      - - 基准
        - 增长良好、留存尚可、透明度折价
        - 经济性扎实但不完美，取中段倍数
        - 不透明持续存在
        - 当前最符合证据
      - - 熊市
        - 队列质量弱、倍数压缩、平台可选性落空
        - 低质量增长配低倍数
        - ARR 标题高估耐久性
        - 尽调若令人失望，该情景就变得相关
    notes: 情景是方向性框架，不是点预测。
