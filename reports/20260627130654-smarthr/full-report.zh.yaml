      - number: '2.2'
        title: TAM、SAM 与采用视角
        blocks:
          - type: paragraph
            body: >-
              公开来源更支持用区间估算，而不是用一个标题数字定论。分析师估算日本 HRM 软件市场处于低个位数十亿美元区间，但不同估算对是否纳入人才管理、薪资处理、分析，或只纳入云端 HR
              套件并不一致。更好的框架是把机构数量、员工数量和软件支出基准结合起来。日本有数百万个商业机构和庞大就业人口，足以支撑按员工订阅产品的大型漏斗顶部 TAM。但 SmartHR 真正的 SAM
              更小，因为产品深度绑定日本特定雇佣流程，也因为部分公司仍更适合由传统企业套件或手工外包服务。因此，市场有吸引力但并非无限：可信承销问题不是「HR tech
              是否足够大？」，而是「未来五年，日本合规负担重的雇主群体中，会有多少比例标准化到本土云平台上？」投资者应把这个品类视为有吸引力，但仍取决于信任、实施质量，以及按细分市场逐步渗透的审慎假设。
