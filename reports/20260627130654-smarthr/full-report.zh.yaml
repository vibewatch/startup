        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务上，SmartHR
              看起来是一项真实的软件资产，具备有意义的规模、市场领导地位和可信经常性收入。但仅凭公开证据，它还不能被完整承销。收入质量有希望但尚未完全可见；利润率路径可信但未披露；资本依赖近期看可控但无法审计。因此，公司值得一个正面但带限定的财务判断：强到应留在尽调漏斗的买方一侧，但透明度还不足以跳过管理层信息请求。最重要的要求简单而具体——现金余额、烧钱、毛利率、NRR、CAC、回本周期、按模块和细分市场拆分的
              ARR，以及企业客户与 SMB 的 cohort
              行为。没有这些，估值工作只能近似。这一财务框架有意区分两件事：公开证据今天能证明什么，以及尽调中仍需管理层直接披露什么。这一财务框架有意区分两件事：公开证据今天能证明什么，以及尽调中仍需管理层直接披露什么。
