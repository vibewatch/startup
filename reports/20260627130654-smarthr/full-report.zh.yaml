      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >
              SmartHR 由 Kensuke Naito 创立；他担任公司首席信息官（CIO），并继续深度参与公司战略方向。创始团队基于自己处理日本 HR 纸质系统低效问题的经历，开发了最初产品。


              公司现任首席执行官是 Masato Serizawa，他于 2022 年 1 月接任。Serizawa 拥有在日本扩张科技公司的丰富经验，带领 SmartHR 进入快速增长阶段，包括多轮融资和产品组合扩张。


              高管团队包括首席财务官 Yuji Mori、首席运营官 Takafumi Kurahashi 和首席产品官 Takashi Adachi。这个经验丰富的管理团队推动公司跨过多个重要节点，包括成为独角兽，并为潜在
              IPO 做准备。


              SmartHR 的董事会和治理结构纳入了 KKR、Ontario Teachers' Pension Plan（通过其 Technology Venture Group）、Coral Capital、Light
              Street Capital 等关键投资者及其他机构支持方的代表。公司维持了符合后期私营公司、并为公开市场做准备的专业治理框架。


              核心人物风险因高管团队厚度而有所缓和，不过创始人 Kensuke Naito 继续担任 CIO，提供了重要的连续性和组织记忆。从创始人 CEO 过渡到 Serizawa 领导下的职业管理层，也体现了组织成熟度。
