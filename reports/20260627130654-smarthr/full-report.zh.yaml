chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              SmartHR, Inc.（株式会社SmartHR）总部位于东京，是一家 HR 科技公司，开发并运营日本领先的云端人力资源管理平台。公司成立于 2013 年 1 月 23
              日，提供软件即服务（SaaS）方案，自动化复杂的日本 HR 行政流程，包括社会保险文件、雇佣合同、薪资集成和人才管理。


              SmartHR 的核心产品 SmartHR 解决了日本市场一个明显痛点：日本劳动法要求下，HR 合规高度复杂且严重依赖纸质流程。日本传统 HR
              管理需要大量文书，覆盖社会保险登记、劳动基准报告和其他监管提交。SmartHR 把这些流程数字化，让企业用几分钟完成过去需要数小时手工文书的工作。


              SmartHR 采用订阅制 SaaS 商业模式，按平台管理的员工数量收取月费或年费。公司面向日本的中小企业（SMEs）和大型企业，定价层级随组织规模和功能需求扩展。


              截至 2026 年，SmartHR 已服务超过 60,000 家公司，年化经常性收入（ARR）超过 ¥20 billion（约 $130 million）。公司总部位于东京六本木，员工约 700–1,100 人。
