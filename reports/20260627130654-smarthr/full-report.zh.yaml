      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采购中心会随客户细分而变化。小公司里，HR
              或综合行政通常先推动采用，因为文书、年末调整和社会保险申报会吃掉稀缺人手。大客户中，IT、财务和共享服务会更深介入，因为安全审查、主数据集成和流程治理更重要。入职、文件签署和自助服务功能扩展后，员工也会成为直接用户。这形成了熟悉的
              land-and-expand 动作：先从合规和员工档案切入，证明运营
              ROI，再销售额外的人才、分析或员工体验模块。员工数据库一旦沉淀，会增强粘性，因此这套动作可能有效；但买方从单点解决方案转向更广的记录系统定位时，也会带来实施摩擦。SmartHR
              受益于这种结构，但前提是它能让部署比既有企业级替代方案更轻。投资者应把这个品类视为有吸引力，但仍取决于信任、实施质量，以及按细分市场逐步渗透的审慎假设。投资者应把这个品类视为有吸引力，但仍取决于信任、实施质量，以及按细分市场逐步渗透的审慎假设。
