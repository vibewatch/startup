  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正面判断很直接。SmartHR 似乎在日本特定合规软件品类中占据强位置，已证明有意义的经常性收入，并正从狭窄的劳动管理切口扩展为更丰富的工作流平台。如果公司保持高留存并提升产品
              attach，这组组合可以很好地复利。反论点同样清楚：投资者仍看不到足够多的经济引擎。利润率、cohort
              留存和现金转换仍属私有，同时来自本土同业和更大套件的竞争真实存在。换句话说，如果市场过早为完美执行付费，SmartHR
              可能是一家好公司，但价格不对。因此，正确估值姿态必须像重视公司质量一样，重视证据质量。所以，估值结论仍明确取决于证据质量、情景纪律和最终私营公司尽调包。所以，估值结论仍明确取决于证据质量、情景纪律和最终私营公司尽调包。
