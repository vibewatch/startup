      - number: '1.4'
        title: 关键里程碑与时间线
        blocks:
          - type: paragraph
            body: >
              SmartHR 的发展经历了创立、产品开发、融资和规模扩张等多个重要节点。


              创立里程碑包括公司于 2013 年 1 月 23 日完成法人设立，以及 2015 年 11 月推出 SmartHR 产品。最初产品聚焦自动化社会保险流程，切中日本 HR 管理中最耗时的环节之一。


              融资里程碑展示了公司的成长轨迹：2016 年 Series A 提供早期增长资本；2018–2019 年的 Series B（$13.3M）和 Series C（$54.9M）为产品扩张提供资金；2021 年 6
              月 Series D（$142.5M）使公司达到独角兽估值。2024 年 6 月 Series E（$140M）和 2025 年 11 月 General Atlantic 二级交易（$96M）是最近的资本事件。


              产品里程碑包括从核心 HR 文书自动化扩展为综合人才管理平台。公司新增了绩效管理、培训管理、员工调研和劳动力分析能力。与主要薪资和会计系统的 API 集成也扩展了平台效用。


              规模里程碑包括客户数先后达到 10,000 家、30,000 家、50,000 家，最近超过 60,000 家公司使用该平台。ARR 在 2023 年 2 月超过 ¥10 billion，2024 年 2 月达到
              ¥15 billion（$100M），并在 2025–2026 年超过 ¥20 billion（$130M+）。


              公司目前正在为可能在东京证券交易所进行的 IPO 做准备，这将是其公司发展中的下一个重大节点。
