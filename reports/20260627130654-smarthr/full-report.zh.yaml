      - number: '6.3'
        title: 留存、耐久性与基于评论的质量信号
        blocks:
          - type: paragraph
            body: >-
              客户耐久性方向上不错，但仍只能部分观察。产品嵌在雇主无法忽视的年度和月度行政流程里，这应支撑重复使用，并降低流失吸引力。评论证据也显示用户获得了真实便利性提升，这让留存不只依赖切换成本。与此同时，公开
              NRR、GRR 或流失披露缺位，意味着投资者不能把经常性工作流的重要性误认为已完全证明的 cohort
              质量。评论在这里提供了有用平衡：它们确认真实用户价值，也暴露移动端性能和定制限制上的重复抱怨。这组组合支撑一个更细的判断。SmartHR
              的粘性来自正确原因，但仍有产品质量问题；随着客户扩张规模或把使用扩展到更多工作流，这些问题可能更重要。因此，客户章节应被读作真实采用的强证据，同时配套提出对更深入 cohort
              和集中度证据的明确要求。因此，客户章节应被读作真实采用的强证据，同时配套提出对更深入 cohort 和集中度证据的明确要求。
