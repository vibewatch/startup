      - number: '6.4'
        title: 扩张向量、集中度与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              扩张故事可信，但公开资料没有完全量化。SmartHR 可能拥有典型 land-and-expand
              动作：先拿下合规，成为员工记录系统的一部分，再销售相邻模块或生态应用。公开证据支撑这套逻辑，但没有披露按细分市场的模块
              attach、收入集中度，或最优客户是否明显跑赢平均客户。这是剩余客户尽调的关键任务。公开引用带有选择性；虽然它们比 logo
              墙更好，但仍无法回答最热情的故事是否代表中位部署。投资者因此应直接索取留存和集中度明细、按 cohort 拆分的产品 attach，以及公共部门或高度监管客户的证明。客户基础看起来真实且宽；剩余工作是证明最佳
              cohort 到底有多强的经济耐久性。因此，客户章节应被读作真实采用的强证据，同时配套提出对更深入 cohort 和集中度证据的明确要求。
