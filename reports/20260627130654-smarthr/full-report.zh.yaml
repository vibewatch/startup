  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              SmartHR 所处市场比泛泛的「HR tech」更窄。核心采购任务不是广义员工敬业度软件，而是受监管的劳动管理、与薪资相邻的申报、员工主数据管理，以及帮助日本雇主保持合规的相邻流程工具。这个边界很关键，因为全球
              HR-tech 支出中很大一部分并不在 SmartHR 的当前覆盖范围内，包括招聘撮合平台、BPO-heavy
              薪资外包、消费者健康应用和独立学习工具。在日本，现状仍有很强惯性：许多雇主继续依赖纸质表格、电子表格、劳务顾问和传统本地部署软件包。这留下了可观的替换市场，但也意味着买方会把 SmartHR
              拿来同「什么都不做」和碎片化单点工具比较，而不只是同其他云套件比较。因此，真正的竞争场是合规负担重的云端 HR
              软件，加上可以叠到可信员工记录系统上的相邻人才模块。投资者应把这个品类视为有吸引力，但仍取决于信任、实施质量，以及按细分市场逐步渗透的审慎假设。
            claimRefs:
