- id: deployment-roadmap
  title: Deployment dependencies, ecosystem, and roadmap signals
  body: 'The app-store and partner-program evidence implies SmartHR wants to extend into customer workflows through a controlled
    ecosystem rather than build every adjacent feature itself. That can accelerate deployment fit and let the company cover
    more use cases without carrying every engineering burden in-house. It also creates dependencies. Customer value increasingly
    depends on partner quality, API usability, and the consistency of documentation and support. Public AI-related dependency
    signals are especially important: Microsoft services for search and document understanding appear to sit behind at least
    part of the company''s newer feature set. That is a reasonable build choice, but it introduces vendor concentration risk
    and governance obligations. Product roadmap quality should therefore be evaluated not only by the number of new features
    but also by whether SmartHR can keep integrations, support, and explainability coherent as the platform broadens. For
    underwriting purposes, that means product breadth is promising, but operational transparency still needs to catch up with
    the platform narrative.'
  claimRefs:
  - CE006
  - CE011
  - CE013
  - CE014
  - CE020
  - CE027
  - CE033
  - CE034
  tableRefs:
  - TE004
  - TE005
  figureRefs:
  - FE004
- id: differentiation-trust
  title: Differentiation, trust, and technical diligence gaps
  body: 'SmartHR''s best-supported differentiation today is operational and workflow-driven: domestic fit, embedded employee-data
    workflows, and a growing developer and partner footprint. Public evidence does not yet prove a unique underlying technology
    moat, nor does it expose enough detail to treat trust and reliability as fully verified strengths. That does not invalidate
    the product; it simply means the product-tech case is stronger on execution momentum than on public technical transparency.
    The correct diligence posture is therefore balanced. Investors can be constructive on the platform trajectory while still
    asking for concrete artifacts: richer API docs, sandbox completeness, reliability commitments, module-level adoption,
    and governance around partner quality and AI explainability. Those asks are normal for a late-stage private SaaS platform,
    and they are still necessary here. For underwriting purposes, that means product breadth is promising, but operational
    transparency still needs to catch up with the platform narrative. For underwriting purposes, that means product breadth
    is promising, but operational transparency still needs to catch up with the platform narrative.'
  claimRefs:
  - CE015
  - CE016
  - CE018
  - CE021
  - CE025
