- id: buyers-and-adoption
  title: Buyer, user, payer, and adoption path
  body: 'The buying center changes by customer segment. In smaller firms, HR or general administration often initiates adoption
    because paperwork, year-end adjustment, and social-insurance filing consume scarce staff time. In larger accounts, IT,
    finance, and shared services become more involved because security review, master-data integration, and workflow governance
    matter more. Employees also become direct users when onboarding, document signing, and self-service features expand. This
    creates a familiar land-and-expand motion: start with compliance and employee records, prove operational ROI, then sell
    additional talent, analytics, or employee-experience modules. That motion can be effective because the employee database
    becomes sticky, but it also creates implementation friction as buyers move from a point solution toward a broader system-of-record
    position. SmartHR benefits from this structure, but only if it can make deployment feel lighter than incumbent enterprise
    alternatives. Investors should therefore treat this category as attractive but still dependent on trust, implementation
    quality, and disciplined segment-by-segment penetration assumptions. Investors should therefore treat this category as
    attractive but still dependent on trust, implementation quality, and disciplined segment-by-segment penetration assumptions.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM027
  - CM031
  tableRefs:
  - TM003
  figureRefs:
  - FM002
  - FM004
- id: drivers-constraints
  title: Growth drivers, constraints, and unresolved gaps
  body: 'Demand has strong regulatory and structural support. Work-style reform, electronic filing, My Number obligations,
    stress-check requirements, and broader human-capital reporting expectations all raise the cost of staying manual. Labor
    scarcity further improves the ROI of automation, especially for lean HR teams. At the same time, the same legal complexity
    that creates demand also slows adoption. Buyers worry about implementation accuracy, privacy, and whether a new vendor
    can keep up with statutory change. SMEs may delay purchases because they lack IT capacity; enterprises may delay because
    of integration and security review. Global vendors localizing for Japan also cap long-term upside at the upper end of
    the market. The net result is a favorable category with meaningful execution risk. The main public-data gap is segment-level
    penetration: independent sources still do not provide a clean answer for how far cloud labor administration has penetrated
    by company size or module mix. Investors should therefore treat this category as attractive but still dependent on trust,
    implementation quality, and disciplined segment-by-segment penetration assumptions.'
