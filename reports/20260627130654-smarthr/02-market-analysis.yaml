company:
  name: SmartHR, Inc.
chapter:
  number: 2
  title: Market Analysis
  summary: SmartHR sells into a Japan-specific HR software market shaped by statutory labor administration, e-filing rules,
    and ongoing cloud migration. Public evidence supports a mid-growth, still-underpenetrated market, but TAM claims vary
    by scope and adoption remains constrained by trust, integration, and change-management friction.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'SmartHR participates in a narrower market than generic “HR tech.” The core buying job is not broad employee engagement
    software; it is regulated labor administration, payroll-adjacent filing, employee master-data management, and adjacent
    workflow tooling that help Japanese employers stay compliant. That boundary matters because a large share of global HR-tech
    spending sits outside SmartHR''s immediate scope, including staffing marketplaces, BPO-heavy payroll outsourcing, consumer
    wellness apps, and standalone learning tools. In Japan, the status quo is still powerful: many employers continue to rely
    on paper forms, spreadsheets, labor consultants, and legacy on-premise packages. That leaves a meaningful replacement
    market, but it also means buyers compare SmartHR against “do nothing” and against fragmented point tools, not just against
    other cloud suites. The relevant competitive arena is therefore compliance-heavy cloud HR software plus adjacent talent
    modules that can be layered onto a trusted employee system of record. Investors should therefore treat this category as
    attractive but still dependent on trust, implementation quality, and disciplined segment-by-segment penetration assumptions.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM018
  - CM019
  - CM028
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses
  title: TAM, SAM, and adoption lenses
  body: 'Public sources support sizing by range, not by one headline number. Analyst estimates place Japan HRM software in
    the low-single-digit billions of US dollars, but they differ on whether they include talent management, payroll processing,
    analytics, or only cloud HR suites. A better frame combines establishment count, employee count, and software-spend benchmarks.
    Japan has millions of business establishments and a large employed population, which supports a large top-of-funnel TAM
    for per-employee subscription products. Yet SmartHR''s real SAM is smaller because the product is deeply tied to Japan-specific
    employment workflows and because some companies remain better served by legacy enterprise suites or manual outsourcing.
    The market is therefore attractive but not limitless: the credible underwriting question is less “is HR tech large?” and
    more “how much of Japan''s compliance-heavy employer base will standardize on a domestic cloud platform over the next
    five years?” Investors should therefore treat this category as attractive but still dependent on trust, implementation
    quality, and disciplined segment-by-segment penetration assumptions.'
  claimRefs:
