evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact current valuation following Series E and secondary transactions is not publicly disclosed.
    whyItMatters: Precise valuation affects investment entry point analysis and comparables.
    diligencePath: Request cap table or latest 409A valuation from company during due diligence.
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Profitability metrics, unit economics, and path to profitability are not publicly disclosed.
    whyItMatters: Understanding margin profile is critical for assessing IPO readiness and sustainable growth.
    diligencePath: Request audited financials or management presentation during data room access.
    relatedQuestionRefs:
      - QO018
  - type: missing-source
    severity: minor
    topic: financials
    missingEvidence: Net revenue retention rate (NRR) is not publicly disclosed.
    whyItMatters: NRR is a key SaaS metric that indicates customer expansion and churn dynamics.
    diligencePath: Request SaaS metrics dashboard or customer cohort analysis from company.
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete executive biographies, board composition, and advisory roles not fully documented.
    whyItMatters: Full leadership visibility needed for key-person risk assessment and governance evaluation.
    diligencePath: Request organizational chart and board deck from company.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Full cap table and investor ownership percentages not publicly disclosed.
    whyItMatters: Understanding ownership structure critical for governance and exit scenario modeling.
    diligencePath: Request cap table from company during due diligence.
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Complete milestone history including failed products, pivots, or internal challenges not publicly documented.
    whyItMatters: Full corporate history needed for pattern recognition and risk assessment.
    diligencePath: Request company timeline and board presentation history.
    relatedTableRefs:
      - TO005
  - type: missing-source
    severity: material
    topic: sam-sizing
    missingEvidence: Public SAM splits by company size and module remain undisclosed.
    whyItMatters: Without segment-level penetration, valuation upside remains range-bound.
    diligencePath: Obtain MIC or IDC segment tables or investor data-room segmentation.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: adoption-benchmarks
    missingEvidence: Independent penetration rates for cloud labor administration by employee band are still missing.
    whyItMatters: Penetration determines how much greenfield growth remains.
    diligencePath: Request analyst extracts or channel-partner conversion data.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: Realized vendor win-loss and churn data remain private.
    whyItMatters: Without win-loss data, moat strength may be overstated.
    diligencePath: Request CRM cohort data and competitive displacement analysis.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: pricing-transparency
    missingEvidence: Public competitor pricing remains incomplete in Japan HCM.
    whyItMatters: Pricing opacity limits apples-to-apples gross-margin and CAC assumptions.
    diligencePath: Collect partner quotes or redacted proposals from customers.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: cash-burn
    missingEvidence: No public cash-burn bridge or runway disclosure is available.
    whyItMatters: Runway drives financing risk and negotiating leverage.
    diligencePath: Request monthly burn, net cash, and scenario runway schedule.
    relatedQuestionRefs:
      - QI022
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, and NRR remain private.
    whyItMatters: Without unit economics, valuation cannot be underwritten confidently.
    diligencePath: Request cohort revenue, margin, CAC, and retention by segment.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: minor
    topic: revenue-mix
    missingEvidence: Public sources do not disclose ARR split by module or customer size.
    whyItMatters: Upsell quality and concentration shape durability.
    diligencePath: Request product-level ARR mix and attach rates.
    relatedQuestionRefs:
      - QI024
      - QI025
  - type: missing-source
    severity: material
    topic: technical-docs
    missingEvidence: Public docs do not expose full webhook, sandbox, and SLO detail.
    whyItMatters: Enterprise diligence needs these to price implementation risk correctly.
    diligencePath: Request API reference, sandbox coverage list, and uptime commitments.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: minor
    topic: module-maturity
    missingEvidence: Module-level maturity and attach by feature remain private.
    whyItMatters: Product breadth only matters if modules are production-grade and used.
    diligencePath: Request feature adoption and release-quality metrics.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: daily-usage
    missingEvidence: Public sources do not quantify employee-level DAU/MAU or workflow frequency.
    whyItMatters: Daily usage is central to expansion and moat quality.
    diligencePath: Request module-level activity metrics by segment.
    relatedQuestionRefs:
      - QU023
  - type: missing-source
    severity: material
    topic: cohorts
    missingEvidence: No public cohort NRR, GRR, or concentration schedule is available.
    whyItMatters: These are the core missing durability metrics.
    diligencePath: Request cohort retention, top-10 account mix, and attach by module.
    relatedQuestionRefs:
      - QU024
      - QU025
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: representativeness
    missingEvidence: Named references may overstate the median customer experience.
    whyItMatters: Selective references can bias quality judgments.
    diligencePath: Request randomized customer references and churn interviews.
    relatedQuestionRefs:
      - QU017
  - type: private-evidence-only
    severity: blocking
    topic: privacy-controls
    missingEvidence: Company-specific privacy controls and DPA terms are not publicly detailed.
    whyItMatters: Privacy is the highest-severity risk and needs direct control evidence.
    diligencePath: Request DPA, incident playbook, subprocessor list, and breach SLA.
    relatedQuestionRefs:
      - QR026
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: operational-controls
    missingEvidence: Peak-period uptime, incident response, and rollback evidence are private.
    whyItMatters: Reliability failures during statutory deadlines would directly damage the thesis.
    diligencePath: Request uptime history, incident log, and DR metrics.
    relatedQuestionRefs:
      - QR027
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Cap-table incentives, board oversight, and control-scaling processes remain private.
    whyItMatters: Governance quality shapes exit and risk response.
    diligencePath: Request board materials on privacy, AI, and risk governance.
    relatedQuestionRefs:
      - QR028
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: Public AI-governance disclosures are thin relative to feature expansion.
    whyItMatters: AI feature risk could outpace controls.
    diligencePath: Request model-risk governance and explainability policies.
    relatedQuestionRefs:
      - QR030
  - type: missing-source
    severity: material
    topic: multiple-sensitivity
    missingEvidence: Current private-market mark sensitivity to public multiple moves is not directly disclosed.
    whyItMatters: Entry discipline depends on how much valuation already prices in upside.
    diligencePath: Request recent secondary pricing and board valuation materials.
    relatedQuestionRefs:
      - QV027
  - type: missing-source
    severity: material
    topic: comparables
    missingEvidence: Domestic and global comps each have structural flaws for SmartHR.
    whyItMatters: Poor comp choice can create false confidence in value.
    diligencePath: Pressure-test both local and global comp sets with management.
    relatedQuestionRefs:
      - QV028
    relatedTableRefs:
      - TV004
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Cap-table dilution, preferences, and secondary terms remain private.
    whyItMatters: These terms can materially change effective entry value.
    diligencePath: Request full cap table, preferences, and option-pool assumptions.
    relatedQuestionRefs:
      - QV029
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Gross margin, NRR, and runway remain the highest-priority missing economic inputs.
    whyItMatters: These determine whether fair valuation could become attractive.
    diligencePath: Request audited KPI pack.
    relatedQuestionRefs:
      - QV025
