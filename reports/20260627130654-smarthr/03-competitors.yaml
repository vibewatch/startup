- id: buyer-economics
  title: Pricing, switching cost, and distribution power
  body: Public pricing transparency is poor across Japanese HCM, which means comparative buying often hinges on packaging,
    partner guidance, and perceived implementation effort rather than a posted list price. Low-end vendors can push down entry
    pricing, especially for sub-100 employee businesses, while incumbents with ERP relationships enjoy distribution and trust
    advantages in large accounts. SmartHR benefits when a buyer wants a domestic compliance-first system with lower implementation
    friction, but it faces a harder fight when the buying center is finance or IT and already standardizes on Oracle, SAP,
    or Workday. Switching costs are also nonlinear. They are modest for a small company leaving spreadsheets, but much higher
    once approvals, identity, payroll rules, and employee data are deeply embedded. That structure supports retention, but
    not immunity from displacement if a broader suite vendor solves enough adjacent jobs. That is why competitor analysis
    here should be read as a live strategic map rather than as a static market-share scoreboard.
  claimRefs:
  - CP012
  - CP015
  - CP018
  - CP021
  - CP025
  - CP028
  - CP029
  - CP030
  - CP034
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: moat
  title: Moat durability and displacement risk
  body: 'The positive case is clear: SmartHR appears to have real brand and UX strength in Japan-native compliance software,
    and independent user reviews suggest customers genuinely value its ease-of-use. The risk case is equally clear: labor
    administration features can commoditize, and the next battle is increasingly about analytics, AI, enterprise controls,
    and ecosystem depth. That favors vendors with larger installed bases, larger R&D budgets, or a broader suite story. SmartHR
    still looks differentiated in its original wedge, but the moat is best described as operational and market-fit driven
    rather than structurally unassailable. Investors should therefore focus less on static “leader” status and more on whether
    SmartHR can turn a trusted compliance core into a broader daily-use HR platform before peers collapse the differentiation
    gap. That is why competitor analysis here should be read as a live strategic map rather than as a static market-share
    scoreboard. That is why competitor analysis here should be read as a live strategic map rather than as a static market-share
    scoreboard.'
