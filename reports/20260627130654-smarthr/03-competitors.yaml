company:
  name: SmartHR, Inc.
chapter:
  number: 3
  title: Competitors
  summary: 'SmartHR faces a layered competitive set: domestic cloud HR suites, talent specialists, low-end attendance tools,
    and global HCM incumbents. The company appears strongest in Japan-native compliance workflows and ease of deployment,
    but its moat narrows as peers add AI, analytics, and deeper suite breadth.'
sections:
- id: landscape
  title: Competitive landscape and substitute set
  body: 'SmartHR is not competing in a one-dimensional market. Direct peers such as jinjer and HRBrain overlap in domestic
    cloud HR modules, while WHI/COMPANY remains the strongest domestic incumbent in large-enterprise deployments. At the low
    end, Jobcan and similar attendance-focused tools exert price pressure. At the high end, Workday, Oracle, and SAP bring
    broad suites and deep ERP relationships. The company also still competes against non-software substitutes such as spreadsheets,
    payroll bureaus, and internally stitched-together workflows. That matters because buyer choice depends heavily on company
    size and existing systems. The right frame is therefore a competitive stack: low-end simplicity, domestic suite breadth,
    enterprise-grade governance, and global suite integration all compete for different parts of the same budget. That is
    why competitor analysis here should be read as a live strategic map rather than as a static market-share scoreboard. That
    is why competitor analysis here should be read as a live strategic map rather than as a static market-share scoreboard.'
  claimRefs:
