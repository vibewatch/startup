- id: profiles
  title: Peer profiles and segment overlap
  body: 'The domestic peer set shows why SmartHR cannot rely on a single wedge forever. WHI emphasizes heavy enterprise support
    and governance; jinjer is converging toward an integrated HR database with AI messaging; HRBrain attacks human-capital
    management and listed-company disclosure needs; TeamSpirit comes from internal controls and time-tracking. Global incumbents
    remain harder to displace where ERP integration matters, but they are weaker in self-serve deployment and Japan-native
    mid-market UX. SmartHR therefore occupies a useful middle position today: stronger than low-end tools on breadth and stronger
    than enterprise incumbents on local ease-of-use. The underwriting question is whether that middle position evolves into
    a durable platform advantage or gets squeezed by both ends of the market at once. That is why competitor analysis here
    should be read as a live strategic map rather than as a static market-share scoreboard. That is why competitor analysis
    here should be read as a live strategic map rather than as a static market-share scoreboard.'
