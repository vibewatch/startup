              approximately $1.6 billion.


              In November 2025, SmartHR received an additional $96 million through a secondary transaction in which
              General Atlantic acquired shares from existing investor Coral Capital. This transaction represented a
              strategic investment that brought General Atlantic's operational expertise in scaling global SaaS
              companies to SmartHR's investor base.


              Earlier funding milestones include a $142.5 million Series D round in June 2021 led by Light Street
              Capital, a $54.9 million Series C round in April 2019, and a $13.3 million Series B round. The company's
              funding trajectory reflects strong investor confidence in the Japanese HR technology market opportunity.


              SmartHR's valuation has grown substantially since its early stages, reaching the $1.6 billion unicorn
              threshold in 2021. The company is reportedly preparing for an initial public offering on the Tokyo Stock
              Exchange, potentially as early as 2026, with a target valuation of $1 billion or more in public markets.
