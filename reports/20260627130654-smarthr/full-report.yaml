        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              SmartHR should be read as a workflow platform built around regulated employee administration and extended
              through partner apps and adjacent employee workflows. The strongest public evidence is not a giant vendor
              feature sheet; it is the combination of an integration surface, an app marketplace, and a partner program
              that all assume a central employee-data layer. That means the product is best understood as a
              system-of-record plus workflow surface, not as one monolithic app. Public signals also show a widening
              module perimeter—core administrative workflows, partner-delivered extensions, and newer employee-facing
              experiences. This matters for diligence because SmartHR's product value increasingly depends on breadth
              and attach, not only on its original paperwork-automation wedge. Breadth is a strength, but it also means
              maturity may vary materially by module, so underwriting should stay modular rather than generic. For
