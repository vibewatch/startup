              Given the current evidence set, a buy recommendation is supportable, but it should be framed with medium
              confidence and a fair—not attractive—valuation stance. The reason is simple: public traction is good
              enough to stay constructive, but the missing private-company economics are too important to ignore.
              Investors can justify taking the meeting and doing the work because the strategic position is real. They
              cannot justify treating the asset as fully de-risked because the underwrite still depends on information
              management has not published. Risk should therefore sit in the medium range. That balances the strength of
              the category and installed base against the still-material uncertainties around margin quality, retention
              depth, and execution breadth. A strong-buy label would imply a better evidence set than currently exists.
