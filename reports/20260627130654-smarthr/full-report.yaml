      - number: '2.2'
        title: TAM, SAM, and adoption lenses
        blocks:
          - type: paragraph
            body: >-
              Public sources support sizing by range, not by one headline number. Analyst estimates place Japan HRM
              software in the low-single-digit billions of US dollars, but they differ on whether they include talent
              management, payroll processing, analytics, or only cloud HR suites. A better frame combines establishment
              count, employee count, and software-spend benchmarks. Japan has millions of business establishments and a
              large employed population, which supports a large top-of-funnel TAM for per-employee subscription
              products. Yet SmartHR's real SAM is smaller because the product is deeply tied to Japan-specific
              employment workflows and because some companies remain better served by legacy enterprise suites or manual
              outsourcing. The market is therefore attractive but not limitless: the credible underwriting question is
              less “is HR tech large?” and more “how much of Japan's compliance-heavy employer base will standardize on
              a domestic cloud platform over the next five years?” Investors should therefore treat this category as
              attractive but still dependent on trust, implementation quality, and disciplined segment-by-segment
              penetration assumptions.
