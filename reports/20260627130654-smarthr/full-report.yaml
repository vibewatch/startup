  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the first place investors should focus. SmartHR handles highly sensitive
              employee information in a country where privacy obligations, tax handling, labor records, and
              identity-number rules all matter. APPI, My Number obligations, labor-law recordkeeping, and evolving
              guidance around cross-border transfers create a dense legal perimeter. The positive interpretation is that
              such complexity protects domestic specialists. The harder truth is that the same complexity sharply
              increases the cost of error. If SmartHR mishandles employee data or fails to reflect a statutory workflow
              change fast enough, the product can move from “moat” to “liability” very quickly. Public legal sources are
              abundant, but public evidence on SmartHR's company-specific controls is sparse. This makes privacy and
              legal operations the most important diligence workstream. In practical terms, investors should assume the
              risk profile can improve only when company-specific controls are shown, not merely when category demand
              remains healthy. In practical terms, investors should assume the risk profile can improve only when
              company-specific controls are shown, not merely when category demand remains healthy.
