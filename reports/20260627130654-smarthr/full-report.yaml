  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              SmartHR participates in a narrower market than generic “HR tech.” The core buying job is not broad
              employee engagement software; it is regulated labor administration, payroll-adjacent filing, employee
              master-data management, and adjacent workflow tooling that help Japanese employers stay compliant. That
              boundary matters because a large share of global HR-tech spending sits outside SmartHR's immediate scope,
              including staffing marketplaces, BPO-heavy payroll outsourcing, consumer wellness apps, and standalone
              learning tools. In Japan, the status quo is still powerful: many employers continue to rely on paper
              forms, spreadsheets, labor consultants, and legacy on-premise packages. That leaves a meaningful
              replacement market, but it also means buyers compare SmartHR against “do nothing” and against fragmented
              point tools, not just against other cloud suites. The relevant competitive arena is therefore
              compliance-heavy cloud HR software plus adjacent talent modules that can be layered onto a trusted
              employee system of record. Investors should therefore treat this category as attractive but still
              dependent on trust, implementation quality, and disciplined segment-by-segment penetration assumptions.
            claimRefs:
              - CM001
              - CM002
              - CM003
