              community, and product-expansion signals all point to ongoing investment in engineering, ecosystem, and
              AI-enabled features. That supports the strategic case, but it also means investors should not assume
              near-term margin optimization. Because the company remains private, the most important missing bridge is
              cash and burn. The 2024 primary round clearly improved near-term capital adequacy, but there is no public
              basis to calculate runway or to judge how aggressively management is investing. Public peers are therefore
              essential context: filings from Workday, Dayforce, and Paylocity show what good software margins can look
