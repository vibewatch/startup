  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward. SmartHR appears to hold a strong position in a Japan-specific
              compliance software category, has proven meaningful recurring revenue, and is broadening from a narrow
              labor-administration wedge toward a richer workflow platform. That combination can compound well if the
              company keeps retention high and lifts product attach. The anti-thesis is just as clear: investors still
              cannot see enough of the economic engine. Margins, cohort retention, and cash conversion remain private,
              while competition from domestic peers and larger suites is real. In other words, SmartHR may be a strong
              company at the wrong price if the market pays for perfect execution too early. The right valuation posture
              must therefore stay grounded in evidence quality as much as in company quality. That is why the valuation
              conclusion remains explicitly sensitive to evidence quality, scenario discipline, and the final
              private-company diligence package. That is why the valuation conclusion remains explicitly sensitive to
