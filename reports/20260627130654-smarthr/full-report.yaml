      - number: '2.4'
        title: Growth drivers, constraints, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Demand has strong regulatory and structural support. Work-style reform, electronic filing, My Number
              obligations, stress-check requirements, and broader human-capital reporting expectations all raise the
              cost of staying manual. Labor scarcity further improves the ROI of automation, especially for lean HR
              teams. At the same time, the same legal complexity that creates demand also slows adoption. Buyers worry
              about implementation accuracy, privacy, and whether a new vendor can keep up with statutory change. SMEs
              may delay purchases because they lack IT capacity; enterprises may delay because of integration and
              security review. Global vendors localizing for Japan also cap long-term upside at the upper end of the
              market. The net result is a favorable category with meaningful execution risk. The main public-data gap is
              segment-level penetration: independent sources still do not provide a clean answer for how far cloud labor
              administration has penetrated by company size or module mix. Investors should therefore treat this
              category as attractive but still dependent on trust, implementation quality, and disciplined
              segment-by-segment penetration assumptions.
