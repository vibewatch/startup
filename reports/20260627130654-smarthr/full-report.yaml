      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The positive case is clear: SmartHR appears to have real brand and UX strength in Japan-native compliance
              software, and independent user reviews suggest customers genuinely value its ease-of-use. The risk case is
              equally clear: labor administration features can commoditize, and the next battle is increasingly about
              analytics, AI, enterprise controls, and ecosystem depth. That favors vendors with larger installed bases,
              larger R&D budgets, or a broader suite story. SmartHR still looks differentiated in its original wedge,
              but the moat is best described as operational and market-fit driven rather than structurally unassailable.
              Investors should therefore focus less on static “leader” status and more on whether SmartHR can turn a
              trusted compliance core into a broader daily-use HR platform before peers collapse the differentiation
              gap. That is why competitor analysis here should be read as a live strategic map rather than as a static
              market-share scoreboard. That is why competitor analysis here should be read as a live strategic map
