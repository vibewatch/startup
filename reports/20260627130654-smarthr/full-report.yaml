            body: >
              SmartHR has raised approximately $328-453 million in total funding across nine to ten rounds since its
              founding. The company achieved unicorn status (valuation exceeding $1 billion) in 2021 and has maintained
              this status through subsequent funding rounds.


              The most significant recent financing event was a $140 million Series E round that closed on June 30,
              2024. This round was led by KKR, the global investment firm, alongside Ontario Teachers' Pension Plan
              through its Technology Venture Group (TVG). Existing investors including Coral Capital, WiL, and DNX
