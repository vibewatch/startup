      - number: '3.3'
        title: Pricing, switching cost, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is poor across Japanese HCM, which means comparative buying often hinges on
              packaging, partner guidance, and perceived implementation effort rather than a posted list price. Low-end
              vendors can push down entry pricing, especially for sub-100 employee businesses, while incumbents with ERP
              relationships enjoy distribution and trust advantages in large accounts. SmartHR benefits when a buyer
              wants a domestic compliance-first system with lower implementation friction, but it faces a harder fight
              when the buying center is finance or IT and already standardizes on Oracle, SAP, or Workday. Switching
              costs are also nonlinear. They are modest for a small company leaving spreadsheets, but much higher once
              approvals, identity, payroll rules, and employee data are deeply embedded. That structure supports
              retention, but not immunity from displacement if a broader suite vendor solves enough adjacent jobs. That
              is why competitor analysis here should be read as a live strategic map rather than as a static
              market-share scoreboard.
