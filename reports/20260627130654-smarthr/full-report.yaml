      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying center changes by customer segment. In smaller firms, HR or general administration often
              initiates adoption because paperwork, year-end adjustment, and social-insurance filing consume scarce
              staff time. In larger accounts, IT, finance, and shared services become more involved because security
              review, master-data integration, and workflow governance matter more. Employees also become direct users
              when onboarding, document signing, and self-service features expand. This creates a familiar
              land-and-expand motion: start with compliance and employee records, prove operational ROI, then sell
              additional talent, analytics, or employee-experience modules. That motion can be effective because the
              employee database becomes sticky, but it also creates implementation friction as buyers move from a point
              solution toward a broader system-of-record position. SmartHR benefits from this structure, but only if it
              can make deployment feel lighter than incumbent enterprise alternatives. Investors should therefore treat
              this category as attractive but still dependent on trust, implementation quality, and disciplined
              segment-by-segment penetration assumptions. Investors should therefore treat this category as attractive
              but still dependent on trust, implementation quality, and disciplined segment-by-segment penetration
              assumptions.
