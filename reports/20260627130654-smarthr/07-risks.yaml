- id: mitigation-kill
  title: Mitigations, monitoring, and kill criteria
  body: 'The good news is that SmartHR has one meaningful visible mitigation: embedded workflow necessity. Customers depend
    on the product for recurring regulated tasks, which should buy management time to fix issues and preserve stickiness.
    The bad news is that embedded importance does not protect the company from trust failure. The right monitoring posture
    is therefore very concrete: watch for any privacy incident, any visible failure during year-end or statutory deadlines,
    any evidence that public-capital-backed peers are taking integrated accounts faster, and any regulatory change that increases
    AI or data-governance burdens without matching control disclosure. Those are real thesis-break triggers. Investors should
    also insist on company-specific evidence for privacy operations, incident response, data portability, AI governance, and
    board-level oversight before treating the risk profile as fully mature. In practical terms, investors should assume the
    risk profile can improve only when company-specific controls are shown, not merely when category demand remains healthy.
    In practical terms, investors should assume the risk profile can improve only when company-specific controls are shown,
    not merely when category demand remains healthy.'
