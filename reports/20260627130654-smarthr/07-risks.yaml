  - TR001
  figureRefs:
  - FR001
- id: operational-security
  title: Operational, security, and product-quality risk
  body: Operational quality is the second major risk bucket. SmartHR sits inside payroll-adjacent and deadline-sensitive workflows,
    so reliability matters more here than in many horizontal collaboration tools. Public review evidence already surfaces
    pain around app quality and edge-case behavior, especially during heavy-use periods. That does not prove systemic weakness,
    but it does prove the risk is not merely hypothetical. Security obligations are similarly elevated because a cloud HR
    platform touches identity, tax, and employee master data. External security and incident-response guidance in Japan provides
    a strong benchmark for what good controls should look like, yet SmartHR's public disclosures do not expose enough detail
    to test whether real operations match those expectations. Investors should therefore underwrite operational quality as
    a core risk, not as a footnote to growth. In practical terms, investors should assume the risk profile can improve only
    when company-specific controls are shown, not merely when category demand remains healthy. In practical terms, investors
    should assume the risk profile can improve only when company-specific controls are shown, not merely when category demand
    remains healthy.
  claimRefs:
  - CR006
  - CR007
  - CR013
  - CR016
  - CR023
  - CR025
  - CR033
  - CR039
  tableRefs:
  - TR002
