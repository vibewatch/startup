  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: privacy-controls
    missingEvidence: Company-specific privacy controls and DPA terms are not publicly detailed.
    whyItMatters: Privacy is the highest-severity risk and needs direct control evidence.
    diligencePath: Request DPA, incident playbook, subprocessor list, and breach SLA.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: operational-controls
    missingEvidence: Peak-period uptime, incident response, and rollback evidence are private.
    whyItMatters: Reliability failures during statutory deadlines would directly damage the thesis.
    diligencePath: Request uptime history, incident log, and DR metrics.
    relatedQuestionRefs:
    - QR027
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Cap-table incentives, board oversight, and control-scaling processes remain private.
    whyItMatters: Governance quality shapes exit and risk response.
    diligencePath: Request board materials on privacy, AI, and risk governance.
    relatedQuestionRefs:
    - QR028
  - type: missing-source
    severity: material
    topic: ai-governance
    missingEvidence: Public AI-governance disclosures are thin relative to feature expansion.
    whyItMatters: AI feature risk could outpace controls.
    diligencePath: Request model-risk governance and explainability policies.
    relatedQuestionRefs:
    - QR030
