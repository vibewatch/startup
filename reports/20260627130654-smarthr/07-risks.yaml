- id: dependency-financial
  title: Dependency, market, and financial-model risk
  body: 'Dependency risk is meaningful across infrastructure, public policy, and capital markets. SmartHR depends on external
    cloud, security, and possibly AI-service layers to deliver newer functionality. It also competes in a market where public
    peers and larger suite vendors can intensify pricing and feature pressure. That matters because SmartHR''s broader-platform
    case is not fully proven on public financials: if competition compresses pricing before module attach and margin quality
    mature, the business could look less attractive to public-market investors. Exit timing adds another layer. Software IPO
    windows, Japanese growth-stock appetite, and public HR-software multiples all move independently of product quality. A
    company can execute well and still face poor market timing. These are not thesis-killers alone, but they reduce the margin
    for execution error. In practical terms, investors should assume the risk profile can improve only when company-specific
    controls are shown, not merely when category demand remains healthy. In practical terms, investors should assume the risk
    profile can improve only when company-specific controls are shown, not merely when category demand remains healthy.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR015
  - CR018
  - CR019
  - CR020
  - CR035
