  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: Audited 2025 or 2026 revenue, gross profit, operating expense, and cash-flow statements.
    whyItMatters: Without audited operating statements, no serious judgment can be made on revenue quality, margin path, or true burn.
    diligencePath: Obtain audited statements, a prospectus draft, or lender / investor reporting packs.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI025
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway / TI004
    missingEvidence: Cash on hand, monthly burn, runway, and any debt or working-capital facilities.
    whyItMatters: Funding history alone does not show whether the company is adequately financed today.
    diligencePath: Request treasury snapshot, debt schedule, and board liquidity materials.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Product-line revenue split across API/software, hardware, services, and public-sector projects.
    whyItMatters: The business model appears heterogeneous, so aggregate revenue would hide very different margin and collection profiles.
    diligencePath: Request revenue by segment, bookings mix, and AR aging.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI017
  - type: stale
    severity: material
    topic: current-valuation
    missingEvidence: 2025 round size, valuation, and liquidation-preference terms.
    whyItMatters: A late-stage company with sanctions overhang cannot be valued confidently off a 2019 round marker alone.
    diligencePath: Request the 2025 term sheet or investor-side summary.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI018
