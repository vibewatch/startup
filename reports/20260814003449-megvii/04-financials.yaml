- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited 2025 revenue and gross profit
    - Prevents any reliable valuation multiple or margin bridge
    - Obtain audited statements or draft prospectus financials.
  - - Cash, burn, and runway
    - Prevents judgment on financing urgency
    - Request board or investor materials covering liquidity.
  - - Product-line revenue mix
    - Prevents separation of software economics from project economics
    - Request bookings and revenue by major business line.
  - - Customer concentration and payment terms
    - Prevents working-capital and collection-risk analysis
    - Request AR aging, top-customer exposure, and contract terms.
  - - Debt and off-balance-sheet obligations
    - Prevents full capital-structure analysis
    - Request debt schedule, guarantees, and project liabilities.
  notes: These gaps are the minimum financial asks needed before any confident investment view.
