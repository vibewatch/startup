- id: capital-adequacy-and-financing-dependence
  title: Capital adequacy and financing dependence
  body: Megvii has clearly raised enough capital to build a substantial company, but public evidence is still weak on whether it has enough capital to reach self-sustaining economics. Tracxn and The Company Check converge on $1.98 billion raised across 10 rounds, with an undisclosed Series D recorded in April 2025 and a best-supported last public valuation marker slightly above $4 billion from the 2019 round. The company's own 2019 release says the cash was intended for deep-learning technology, commercialization, talent, and global expansion, which is consistent with a capital-intensive AIoT buildout. The 2021 STAR Market filing also shows that Megvii continued to seek public-market access after the Hong Kong process stalled. The problem is that cash, burn, runway, debt, and working-capital obligations remain opaque. The delayed Hong Kong IPO, later STAR path, and Entity List restrictions matter financially because they reduce financing flexibility even if domestic investors are still supportive.
    Viewed conservatively, the 2025 round proves capital access is not closed, but it does not prove capital adequacy.
