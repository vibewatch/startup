  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue
    - 'null'
    - low
    - No accessible public revenue figure means no topline baseline.
    - Obtain audited 2025 and trailing-12-month revenue.
  - - ARR
    - 'null'
    - low
    - Necessary to separate recurring software from project revenue.
    - Request recurring revenue by product line.
  - - Gross margin
    - 'null'
    - low
    - Required to judge whether API and project layers are economically attractive.
    - Request gross margin by software, hardware, and services mix.
  - - Burn / cash use
    - 'null'
    - low
    - Needed to translate funding history into runway.
    - Request monthly burn and opex structure.
  - - CAC / payback
    - 'null'
    - low
    - Needed to judge go-to-market efficiency.
    - Request cohort economics or sales-efficiency proxy.
  - - Brain++ productivity impact
    - 80% faster dev / 55% lower algorithm-production cost
    - medium
    - Only public efficiency datapoint in reviewed sources.
    - Validate whether the claim is internal-only or visible in financial outcomes.
  notes: Most unit-economics cells are genuinely unavailable in public sources; Brain++ productivity claims are the only direct efficiency datapoints reviewed.
