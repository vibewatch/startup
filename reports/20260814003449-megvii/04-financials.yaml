- id: cost-structure-and-unit-economics
  title: Cost structure and unit-economics visibility
  body: 'The reviewed sources give much better visibility into product architecture than into financial efficiency. Brain++ is financially relevant because Megvii says the commercial platform can reduce algorithm-production cost by 55% and shorten development time by 80%, suggesting a real internal-efficiency layer rather than pure marketing language. Even so, none of the public sources reviewed here disclose the unit economics investors would normally want for a late-stage private company: no ARR, gross margin, burn, CAC, payback, NRR, or churn metrics appear in the accessible public evidence. Product mix also suggests margin heterogeneity. API or software-led identity products should have structurally different gross-margin behavior from smart-city and warehouse projects that require deployment services, hardware, or customization. The result is a chapter where the business model is visible, but the economic quality of each layer is not. That is a meaningful analytical limitation because
    Megvii could look attractive on topline deployment activity while still being difficult to scale efficiently.'
  claimRefs:
