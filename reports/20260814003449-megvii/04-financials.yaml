- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Status
  - Why it matters
  - Public evidence
  - Diligence ask
  rows:
  - - Total capital raised
    - Visible
    - Shows ability to fund a large AIoT buildout
    - $1.98B across 10 rounds in profile databases
    - Reconcile exact cap-table and round chronology.
  - - Latest financing
    - Partially visible
    - Signals continued domestic investor support
    - Undisclosed April 2025 Series D in Tracxn
    - Request amount, valuation, and liquidation terms.
  - - Cash on hand
    - Not visible
    - Core runway metric
    - No public disclosure reviewed
    - Request current cash balance.
  - - Monthly burn
    - Not visible
    - Determines financing urgency
    - No public disclosure reviewed
    - Request burn and opex composition.
  - - Debt / project finance
    - Not visible
    - Could materially change risk profile
    - No public disclosure reviewed
    - Request debt schedule and covenant summary.
  - - IPO / liquidity path
    - Delayed / redirected
    - Affects financing flexibility
    - 2019 HKEX setback followed by 2021 STAR filing
    - Request current listing plan and banker mandates.
  notes: Capital raised is visible, but capital adequacy is not; the table separates what public data shows from what remains essential but missing.
