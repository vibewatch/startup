company:
  name: Megvii Technology
chapter:
  number: 3
  title: Competitors
  summary: 'Megvii competes across multiple archetypes: China-native AI platform peers such as SenseTime and YITU, surveillance incumbents such as Hikvision and Dahua, globally trusted video vendors such as Axis and Hanwha, and narrower facial-recognition specialists such as Clearview AI. The company''s best relative edge is full-stack AIoT breadth and Face++ developer distribution, while its largest competitive handicap is trust-sensitive international distribution under the Entity List overhang.'
sections:
- id: landscape
  title: 'Landscape: direct peers, incumbents, and specialist substitutes'
  body: 'Megvii competes in a fragmented field that cannot be described by one peer list. The closest China-native platform peers are SenseTime, YITU, and CloudWalk, all of which overlap on vision AI, public-sector workloads, and enterprise deployments. Hardware-heavy incumbents such as Hikvision and Dahua compete from the opposite direction: they start with installed cameras, security channels, and integrated surveillance infrastructure, then layer AI onto that footprint. Global enterprise-trust incumbents such as Axis and Hanwha Vision define buyer expectations outside China around channel quality, long operating history, and trusted physical-security distribution. Clearview AI sits in still another bucket as a narrower facial-recognition specialist built around law-enforcement identification rather than a broad AIoT operating stack. Tracxn and The Company Check both reinforce the point that Megvii faces a very large and diverse peer set, not a neat single market. Diligence should therefore
    classify competitors by archetype before comparing them on product or economics.'
