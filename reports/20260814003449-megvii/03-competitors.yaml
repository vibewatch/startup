- id: pricing-and-switching-cost
  title: Pricing opacity, switching cost, and multi-homing dynamics
  body: Direct public pricing comparison is weak across almost every relevant competitor. The reviewed sources largely market solutions rather than publish list prices, which is consistent with a market where deployment scope, hardware mix, accuracy thresholds, and compliance needs vary sharply by customer. That opacity matters because it means competitive outcomes often depend more on project design and installed-base economics than on simple price-per-seat comparisons. Once cameras, access control, software rules, visitor flows, warehouse processes, or identity workflows are integrated into a site, switching cost rises meaningfully. Hikvision, Dahua, Axis, and Hanwha benefit from this dynamic through installed devices and channel relationships; Megvii and SenseTime benefit when their platform software and model layers become hard to replace without redesigning the workflow. Multi-homing remains possible at the evaluation stage, but it becomes harder after scaled deployment. For investors,
    the missing piece is hard proof on win rates, ACVs, and renewals, which public evidence does not disclose cleanly today.
