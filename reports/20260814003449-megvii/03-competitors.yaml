- id: capabilities-and-distribution
  title: Capabilities, distribution, and where each competitor wins
  body: 'Capability comparison breaks along two axes: platform breadth and channel reach. SenseTime is the clearest China-native platform comparator because it explicitly combines infrastructure with multiple application categories, echoing Megvii''s Brain++ plus solution-stack logic. YITU is more focused in the public-sector and healthcare narratives visible in reviewed sources. Hikvision and Dahua remain formidable not because they necessarily outperform Megvii on core model research, but because they sell into a hardware footprint and procurement channel that buyers already trust. Axis and Hanwha similarly illustrate how much global enterprise buyers value distribution, reliability, and long-lived device ecosystems. Face++ is one of Megvii''s distinctive counters to that structure because it gives the company a developer and identity surface that pure camera incumbents do not obviously match. Clearview, meanwhile, reminds investors that a narrower specialist can still be dangerous in
    one niche even if it lacks Megvii''s broader AIoT ambition. The competitive battle is therefore not accuracy alone; it is breadth, trust, bundling, and route-to-market.'
