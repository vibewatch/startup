  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency / TP003
    missingEvidence: A clean public apples-to-apples price benchmark across Megvii and its main direct peers.
    whyItMatters: Without pricing comparability, it is hard to judge whether Megvii wins on economics, bundling, or only bespoke project scope.
    diligencePath: Collect live quotes, partner bids, or channel interviews across at least one smart-building, smart-city, and identity workflow.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: renewals-and-win-rates
    missingEvidence: Peer-level win-rate, churn, and renewal data across the main vendor set.
    whyItMatters: Competitive durability is much easier to assert than to prove without retention and displacement evidence.
    diligencePath: Interview customers and integrators, and request backlog or renewal data directly from management.
    relatedQuestionRefs:
    - QP025
  - type: conflicting-data
    severity: minor
    topic: public-market-optionality
    missingEvidence: A cleaner public comparison of how SenseTime, CloudWalk, and Megvii differ today on capital-markets readiness and liquidity.
    whyItMatters: Public-market status can influence customer trust and financing optionality as much as product features do.
    diligencePath: Add exchange filings and market-cap data in the next refresh cycle.
    relatedQuestionRefs:
    - QP019
