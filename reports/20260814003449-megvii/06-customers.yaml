- id: where-the-customers-come-from
  title: 'Where the customers come from: verticals, channels, and buyer archetypes'
  body: The reviewed source set suggests Megvii’s customer motion is strongly verticalized. Smart city pages point toward government and public-space operators; warehouse materials point toward large industrial or logistics accounts; Smart Park, Pangu, and hardware pages point toward property operators, campuses, and enterprise-entry workflows. China Telecom demonstrates that distribution can also run through large platform or channel partners, while Face++ and related identity assets show a separate developer or integrator pathway. This means Megvii should not be understood as having one unified go-to-market motion. Instead, it appears to combine direct enterprise selling, public-sector solution selling, hardware-attached building deployments, and partner-enabled distribution. That diversity is strategically positive because it widens the reachable customer base, but it also complicates any attempt to generalize one average contract type, average sales cycle, or average retention pattern
    across the whole company.
  claimRefs:
  - CU006
  - CU007
