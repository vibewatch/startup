- id: deployment-quality-and-repeatability
  title: Deployment quality, repeatability, and what the named references really prove
  body: 'The named references that matter most are the ones that show repeatability or deployment complexity. The Beijing supermarket rollout is useful because nearly 200 sites imply operational replication rather than a one-off pilot. The Singapore project is useful because it demonstrates exportability and international deployment credibility. China Telecom and Jinyu matter because they suggest Megvii can be embedded in larger property, community, or ecosystem channels rather than always having to win every site one by one. The warehouse case-study material adds another important point: some of Megvii’s customer value is tied to workflow redesign and automation, not just recognition accuracy. Still, these references do not answer the core investor questions. They do not reveal ACVs, renewals, contract durations, revenue share by sector, or whether the most visible deployments are typical or exceptional. Publicly, the chapter can prove traction and technical fit far more easily than it
    can prove durable customer economics.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU027
  - CU030
  - CU036
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU003
- id: customer-risks-and-gaps
  title: 'Customer risks and gaps: concentration, trust sensitivity, and missing metrics'
  body: The main analytical weakness in Megvii’s customer chapter is not lack of activity but lack of disclosure quality. Public sources do not identify top customers by revenue, do not break down concentration by sector, and do not disclose churn, expansion, or renewal behavior. That matters because Megvii’s visible sectors — especially smart city, property, and industrial projects — could be lumpy or policy-sensitive even if they look impressive in case-study form. Trust and privacy scrutiny also matter. A company can have clear technical fit for identity or access workflows while still facing resistance in overseas or politically sensitive accounts because of sanctions or surveillance concerns. Developer-facing distribution through public hubs may widen reach, but it still does not solve the underlying transparency gap on who pays, renews, and scales. The prudent conclusion is that Megvii’s customer base looks real, diverse, and operationally serious, but not transparent enough to underwrite
    customer quality with the confidence expected for a late-stage investment case.
  claimRefs:
  - CU024
  - CU025
  - CU028
  - CU029
  - CU034
  - CU035
  - CU036
  - CU037
