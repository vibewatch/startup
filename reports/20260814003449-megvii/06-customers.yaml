company:
  name: Megvii Technology
chapter:
  number: 6
  title: Customers
  summary: 'Megvii’s public record supports real commercial traction across smart-city, logistics, property, retail, telecom-channel, and developer-facing customer motions, with named references including Singapore access infrastructure, China Telecom, Koala supermarkets, and Jinyu property management. What remains missing is the investor-grade layer: customer concentration, renewals, ACVs, and sector revenue mix are not publicly disclosed, so the chapter can prove deployment activity more confidently than customer quality.'
sections:
- id: customer-footprint
  title: 'Customer footprint: what is visible publicly'
  body: 'Megvii’s public customer evidence is meaningful but uneven. The company clearly operates across multiple buyer types: government and city operators, logistics and warehouse users, building and campus operators, telecom-linked ecosystems, retail sites, and developer or integration channels exposed through Face++. Named public references include the Singapore smart-access deployment, China Telecom cooperation, a Beijing supermarket rollout, and Jinyu property-management cooperation. These references matter because they prove the company is not just selling abstract AI models; it is landing real physical-world deployments. At the same time, the evidence is not organized like a conventional SaaS customer page with logos, case studies, and quantifiable ROI by account. Much of what is visible is deployment proof or partner proof rather than investor-grade customer analytics. The right reading is therefore that Megvii has real customer traction across several sectors, but public evidence
    only partially reveals who the most economically important customers actually are. Even the developer-facing layer is visible more through platform surfaces than through named public accounts.'
  claimRefs:
