  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration / TU005
    missingEvidence: Top-customer concentration, sector revenue split, and named reference revenue contribution.
    whyItMatters: The chapter can prove traction but not customer-quality concentration risk.
    diligencePath: Request customer concentration tables, sector mix, and top-20 account revenue by year.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: Renewal, churn, expansion, and contract-duration data across major customer cohorts.
    whyItMatters: Named deployments do not prove durability or economics without retention evidence.
    diligencePath: Request cohort retention, renewal rates, and contract term summaries by segment.
    relatedQuestionRefs:
    - QU018
    - QU024
    - QU025
