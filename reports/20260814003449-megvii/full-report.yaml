      - number: '8.3'
        title: Discounts, upside drivers, and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The biggest analytical mistake in valuing Megvii would be to treat the company either as a pure
              surveillance asset or as a clean software platform. Public evidence supports a more complicated picture.
              Brain++, Face++, warehouse automation, smart-building workflows, telecom channels, and retail or
              international deployment proof all suggest real commercial breadth. That breadth supports a valuation
              floor above zero and argues against treating the business as politically untouchable. At the same time,
              the Entity List, surveillance controversy, failed IPO path, and absence of audited public operating
              metrics all justify heavy discounting to the stale 2019 anchor. In practical terms, the valuation case is
              a tug-of-war between product breadth and policy drag. That is why the right public-evidence output is a
              scenario range: a downside case where the policy and liquidity discount dominates, a middle case where
              commercial breadth offsets part of it, and an upside case that only works if future disclosure and exit
              optionality improve materially.
            claimRefs:
