      - number: '1.4'
        title: Entity List exposure and the still-unfinished IPO path
        blocks:
          - type: paragraph
            body: >-
              The central adverse fact in Megvii's company overview is that its capital-markets story has been shaped by
              sanctions and human-rights scrutiny since 2019. The Federal Register notice that took effect on October 9,
              2019 added 28 China-based entities to the U.S. Entity List, and contemporaneous Reuters reporting carried
              by CNBC and Yahoo Finance identified Megvii as one of the affected AI companies. Human Rights Watch's
              reporting on Xinjiang surveillance explains why this designation continues to matter: the company sits
              inside a broader facial-recognition and public-security ecosystem that Western investors and regulators
              treat as politically sensitive. Reuters also reported that HKEX regulators asked Megvii additional
              questions during its November 2019 listing hearing rather than approving the deal, leaving a targeted $500
              million to $1 billion Hong Kong IPO in limbo. Later profile sources continue to describe Megvii's Hong
              Kong and Shanghai listing pushes as stalled rather than completed. Taken together, the evidence supports a
              simple company-overview conclusion: Megvii built a real, heavily funded AIoT business, but one whose
              public-exit path and international investability remain meaningfully constrained by sanctions,
              surveillance stigma, and incomplete disclosure.
