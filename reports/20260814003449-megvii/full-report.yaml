      - number: '1.3'
        title: Funding history, valuation markers, and commercial proof points
        blocks:
          - type: paragraph
            body: >-
              Megvii's financing history shows why it remains strategically relevant even after sanctions pressure. In
              2019 the company closed a $750 million Series D, with public coverage naming BOCGI, an ADIA subsidiary,
              Macquarie, ICBC Asset Management (Global), and Alibaba among the syndicate; Reuters said the round valued
              the company at slightly above $4 billion. More recent database-style sources now converge around $1.98
              billion of cumulative funding across 10 rounds, while Tracxn also records an additional undisclosed Series
              D on April 8, 2025 with Ant Group, Legend Holdings, and Chongqing Industrial Investment Fund
              participating. Commercial proof is also visible in the company's own releases: Koala reached 191 Beijing
              supermarkets including Chaoshifa and Wumart, then expanded to Thailand, Brazil, and the UAE; Megvii also
              cites a smart-access deployment in a 280-meter Singapore mixed-use landmark and intelligent-venue work at
              major Beijing Winter Olympics sites. These proof points do not substitute for audited revenue or margin
              disclosure, but they do show the company still has deployment relevance across retail, enterprise access,
              public venues, telecom ecosystems, and supply-chain workflows.
