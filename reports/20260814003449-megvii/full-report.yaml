      - number: '2.2'
        title: 'Sizing lenses: broad TAM, narrower SAM, and the biometric subsegment'
        blocks:
          - type: paragraph
            body: >-
              The public market data support a large but highly inconsistent opportunity envelope. IMARC places global
              computer vision at $21.7 billion in 2025, while Fortune Business Insights puts 2025 at $20.75 billion and
              Mordor at $27.39 billion. Verified Market Research sits still lower on a 2024 base, underscoring how
              sensitive the estimates are to market definition and included spend. Growth rates are even more dispersed:
              IMARC shows a mid-single-digit CAGR, while Fortune, Mordor, and MarketsandMarkets imply mid-teens to
              low-twenties growth depending on whether the lens is all computer vision or AI-enhanced computer vision.
              Facial recognition is clearly only a subset of that universe, with TBRC and Mordor placing it around $7.9
              billion to $8.6 billion in 2025. That gap matters for Megvii. If investors underwrite the company only as
              a facial-recognition vendor, the addressable market looks meaningfully smaller; if they underwrite Megvii
              as a city-plus-logistics-plus-identity platform, the ceiling is much larger. Because sanctions and
              surveillance stigma narrow Megvii's practical reach, the best diligence posture is to use a range-based
              TAM and an even more conservative sanctions-adjusted SAM rather than a single heroic market number.
