      - number: '8.4'
        title: 'Valuation verdict: a range around stale anchors, not a precision mark'
        blocks:
          - type: paragraph
            body: >-
              From public evidence alone, Megvii looks like a company whose valuation should be bracketed rather than
              pinpointed. The last clean funding anchor is old, the private-company disclosure gap is large, and the
              sanctions overhang is real. Those factors make a public-like premium multiple difficult to defend. Still,
              the company’s capital history, continued commercial activity, and exposure to large AI markets mean it
              also cannot be dismissed as a stranded asset. The most defensible interpretation is a risk-adjusted
              valuation range centered below the 2019 mark, with upside only if investors gain confidence on revenue
              quality, compliance posture, and realistic exit routes. In other words, Megvii’s value is not primarily a
              function of TAM; it is a function of whether private diligence can narrow the trust and disclosure
              discount enough to let the market believe the rest of the story. Until that happens, scenario discipline
              matters more than spreadsheet precision, and patience matters more than theoretical upside today.
            claimRefs:
