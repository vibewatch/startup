      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The most useful segmentation for Megvii is by operational workflow rather than by raw industry code.
              Municipal and public-sector buyers purchase for traffic, public safety, and city-management use cases;
              enterprise security and facilities teams buy for access, smart-building, and property workflows; logistics
              operators buy for warehouse efficiency and safety; consumer-device or digital-service teams buy Face++ and
              identity modules for onboarding, fraud control, and device features. The economic buyer differs across
              each segment. Municipal IT offices and public-security budgets matter in city projects, while security
              chiefs, facility managers, and property operators matter in building access. In warehouses the operational
              buyer is closer to logistics or supply-chain leadership, and in digital identity it is often a product or
              risk leader. This segmentation also helps explain why Megvii competes against different archetypes in each
              segment: AI peers in city intelligence, hardware incumbents in physical security, and developer-tool
              competitors in identity. It also clarifies why public evidence on procurement cycles is still incomplete:
              Megvii's selling motion is fragmented across multiple buyer classes rather than concentrated in one
              repeatable SaaS motion.
