      - number: '7.3'
        title: Privacy, biometric regulation, and market-access risk
        blocks:
          - type: paragraph
            body: >-
              Megvii’s product surface sits in exactly the categories regulators are tightening around the world:
              biometrics, public-space imaging, identity verification, and AI-driven decision support. China’s PIPL
              already treats biometrics as sensitive personal information, and the 2025 face-recognition measures raise
              the compliance bar further for public-place and face-recognition deployments. Europe moves from another
              direction, but the practical implication is similar: biometric AI will face heavier scrutiny,
              documentation, and deployment constraints. These rules matter even if Megvii remains China-centric,
              because they influence how products must be designed, sold, and explained to customers. They also make
              export expansion harder for a company whose brand is already controversial. Translated legal references
              and European political debate point the same way: policymakers are converging on tighter oversight rather
              than a permissive reset. In risk terms, privacy regulation is not merely a compliance detail for Megvii;
              it is a strategic limiter on market access and customer trust.
