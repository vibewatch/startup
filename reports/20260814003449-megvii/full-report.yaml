      - number: '7.2'
        title: Capital-markets and liquidity risk
        blocks:
          - type: paragraph
            body: >-
              Megvii’s financing history proves that capital access exists, but its listing history proves that exit
              certainty does not. Reuters and related coverage show that the 2019 Hong Kong process was disrupted after
              the blacklist, while the later STAR Market filing shows the company kept pursuing public-market
              optionality without completing the journey. That combination raises three risks. The first is pure
              liquidity risk: investors do not know when a clean public exit becomes feasible. The second is financing
              risk: a private company with policy controversy may remain dependent on supportive domestic capital rather
              than broad global capital. The third is valuation risk: without a public listing or current disclosed
              round terms, outside investors are left triangulating value from stale markers. The wider 2026
              export-control environment also remains fluid, which increases the difficulty of betting that policy
              pressure will simply fade. Viewed conservatively, Megvii is funded enough to continue operating, but not
              transparent enough to dismiss capital-markets risk.
