  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation anchors: what the public record actually gives us'
        blocks:
          - type: paragraph
            body: >-
              Megvii’s public valuation record is anchored far more by funding history than by operating disclosure. The
              strongest historical marker remains the 2019 financing round that Reuters reported valued the company at
              slightly above $4 billion. Tracxn and The Company Check still show a very large cumulative funding base —
              about $1.98 billion across 10 rounds — and Tracxn records an additional undisclosed domestic round in
              2025. These facts matter because they establish that Megvii once commanded strong late-stage
              private-market support and has not been cut off from capital entirely. But they do not solve the central
              valuation problem: public investors still do not know the company’s current revenue, margin, growth
              quality, or 2025 round pricing. As a result, the 2019 mark is useful as an anchor, but dangerous as an
              estimate. It is an old datapoint, not a current clearing price.
