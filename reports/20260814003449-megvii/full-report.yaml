      - number: '3.4'
        title: Moat durability, commoditization risk, and Megvii-specific weakness
        blocks:
          - type: paragraph
            body: >-
              Megvii's moat is strongest when it is sold as a full-stack AIoT and vision-infrastructure platform rather
              than as a stand-alone facial-recognition feature. That is the strategic logic behind comparing it more
              closely with SenseTime than with pure camera vendors. But the moat is also under pressure from two
              directions. First, facial recognition and access control can commoditize when buyers view them as one
              feature inside a broader bundle sold by hardware incumbents. Second, Megvii carries a trust and regulatory
              overhang that many overseas alternatives do not: the U.S. Entity List, Xinjiang-linked scrutiny, and a
              stalled IPO path all weaken the company's positioning in sensitive export markets. Those issues do not
              erase Megvii's technical depth, but they raise the threshold for winning on trust-sensitive deals and make
              global expansion harder than for Axis, Hanwha, or other non-sanctioned vendors. Competitive diligence
              should therefore underwrite Megvii as a technically credible but trust-constrained player whose best
              relative edge remains software-defined, integrated physical-world AI workloads.
