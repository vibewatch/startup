  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Sanctions and human-rights overhang
        blocks:
          - type: paragraph
            body: >-
              Megvii’s highest-confidence risk is the one already formalized by governments and repeated in major
              reporting: the company sits on the U.S. Entity List and carries a surveillance-related human-rights
              overhang. That matters in two separate ways. First, it creates technology-supply friction by limiting
              access to certain U.S. items and components. Second, it creates trust friction with banks, partners, and
              customers that are sensitive to sanctions, export controls, or reputational scrutiny. Human Rights Watch’s
              Xinjiang reporting gives that overhang moral and policy weight beyond normal geopolitical noise. Even
              where the exact technical role of Megvii in any one surveillance workflow may be debated, the diligence
              consequence is straightforward: the company’s brand is linked to a politically charged category of AI that
              many institutions would rather avoid. Commercial sanctions databases now echo that status as well, showing
              that the risk is embedded not only in policy but in day-to-day compliance workflows. This is why sanctions
              and rights scrutiny should be treated as structural constraints on Megvii’s upside, not one-time press
              noise.
