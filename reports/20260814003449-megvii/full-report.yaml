              buyer types: government and city operators, logistics and warehouse users, building and campus operators,
              telecom-linked ecosystems, retail sites, and developer or integration channels exposed through Face++.
              Named public references include the Singapore smart-access deployment, China Telecom cooperation, a
              Beijing supermarket rollout, and Jinyu property-management cooperation. These references matter because
              they prove the company is not just selling abstract AI models; it is landing real physical-world
              deployments. At the same time, the evidence is not organized like a conventional SaaS customer page with
              logos, case studies, and quantifiable ROI by account. Much of what is visible is deployment proof or
              partner proof rather than investor-grade customer analytics. The right reading is therefore that Megvii
              has real customer traction across several sectors, but public evidence only partially reveals who the most
              economically important customers actually are. Even the developer-facing layer is visible more through
