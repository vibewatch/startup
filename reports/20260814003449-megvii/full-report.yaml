              Public sources also show why the case is not simply uninvestable. Megvii’s products extend beyond the most
              controversial smart-city narratives into warehouse automation, building software, developer tools, telecom
              channels, and retail deployments. That breadth mitigates the risk that the company is a one-product or
              one-customer story. Still, it does not close the most important unknowns. Public evidence does not provide
              current customer concentration, audited operating metrics, fine history, or a clear map of how much
              revenue comes from the most policy-sensitive categories. Project-heavy AIoT deployments also imply
              execution and working-capital risk that are hard to price without internal data. The appropriate synthesis
              is that Megvii has real mitigation vectors, but the downside remains difficult to quantify — which is
              itself a risk. The chapter therefore ends in a familiar place for controversial infrastructure AI: enough
