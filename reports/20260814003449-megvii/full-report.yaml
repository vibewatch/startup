      - number: '4.4'
        title: 'Financial verdict: visible commercialization, opaque economics'
        blocks:
          - type: paragraph
            body: >-
              The clearest conclusion from public sources is not that Megvii lacks commercial activity, but that its
              economic quality is under-disclosed. Official and partner releases show real deployments in retail,
              telecom-linked digital-life channels, smart-city settings, and warehouse or building workflows.
              Database-style profiles also show that the company has continued to attract capital. But the most basic
              investor questions remain unanswered in public: current revenue, profit, gross margin, burn, runway, and
              financing terms are all absent or incomplete. That forces a cautious verdict. Megvii looks financially
              more like a well-funded but still opaque AIoT integrator than a transparently scalable software company.
              In practical diligence terms, that means even bullish product evidence should be haircut until management
              opens the books on segment mix, cash, and margin trajectory. Until audited revenue-quality and
              capital-adequacy metrics are available, any underwriting case should assume higher execution and financing
              risk than the product footprint alone would suggest.
