      - number: '1.2'
        title: Research strengths, founder dependence, and responsible-AI posture
        blocks:
          - type: paragraph
            body: >-
              Megvii's public self-description emphasizes research depth and founder-led execution more than formal
              public-company governance. The company says it operates the world's largest computer-vision research
              institute and has won 49 international AI competition titles since 2017, including a third consecutive
              COCO challenge win in 2019. Those claims help explain why the company could build both a consumer-facing
              developer platform and a deeper internal AI infrastructure layer. Brain++ and MegEngine matter because
              they indicate Megvii is not merely packaging third-party models; it has invested in its own compute, data,
              and framework stack. Governance quality, however, is harder to verify from public sources. Megvii does
              provide some comfort signals: it says it published an AI Ethics Code in 2019 and set up both an AI Ethics
              Committee and an AI Ethics Research Institute. Even so, the public evidence is much stronger on technical
              leadership than on current board composition, independent oversight, or 2026 leadership changes. The
              result is a founder-centric company with a credible research engine and a partially articulated ethics
              framework, but still an incomplete public governance record by late-stage investor standards.
