  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and specialist substitutes'
        blocks:
          - type: paragraph
            body: >-
              Megvii competes in a fragmented field that cannot be described by one peer list. The closest China-native
              platform peers are SenseTime, YITU, and CloudWalk, all of which overlap on vision AI, public-sector
              workloads, and enterprise deployments. Hardware-heavy incumbents such as Hikvision and Dahua compete from
              the opposite direction: they start with installed cameras, security channels, and integrated surveillance
              infrastructure, then layer AI onto that footprint. Global enterprise-trust incumbents such as Axis and
              Hanwha Vision define buyer expectations outside China around channel quality, long operating history, and
              trusted physical-security distribution. Clearview AI sits in still another bucket as a narrower
              facial-recognition specialist built around law-enforcement identification rather than a broad AIoT
              operating stack. Tracxn and The Company Check both reinforce the point that Megvii faces a very large and
              diverse peer set, not a neat single market. Diligence should therefore classify competitors by archetype
              before comparing them on product or economics.
