          - type: paragraph
            body: >-
              Megvii needs public comparables, but every comparator answers a different question. SenseTime is the
              closest public China AI platform analogue because it combines large-scale AI ambitions with still-visible
              losses and disclosure from a public listing. Hikvision shows what a mature trusted AIoT and security
              incumbent looks like at scale, but its valuation framework is shaped by profitability and entrenched
              hardware channels that Megvii does not match. Palantir is useful from the opposite direction: it
              demonstrates how much valuation support audited growth, profitability, and U.S. market access can create
              for an AI platform, even though the product set is very different. Axis is less about multiple math and
              more about trust and route-to-market quality. The lesson is that Megvii cannot be valued by blindly
              porting one peer multiple; investors need a cross-check basket and a large haircut for differences in
              disclosure, trust, business mix, and policy burden.
            claimRefs:
