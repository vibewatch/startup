  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Megvii's public record supports a hybrid monetization model rather than a clean single-product SaaS story.
              Face++ indicates one software or API-like surface for identity and developer workflows. Device
              Authentication and related verification products imply another monetization surface around liveness,
              verification, and fraud-related workflows. Pangu and its open API positioning show the company also sells
              software layers for access, attendance, visitor management, and regional security operations. At the same
              time, the Smart City Management and Smart Warehouse solution pages imply project, integration, and
              operations revenue that depends on deployment scope, hardware mix, and customer workflow redesign. China
              Telecom and supermarket case studies add evidence that Megvii also monetizes through channel and
              deployment partnerships. The Smart Identity Verification Device page further suggests dedicated hardware
              sales attached to identity workflows. This mix is strategically helpful because it widens the addressable
              revenue pool, but it also means Megvii should be analyzed less like a pure recurring software vendor and
              more like an AIoT company whose revenue quality differs materially by product line.
