- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, and sanctions-adjusted implications
  body: 'Across the reviewed sources, five growth drivers recur: automation demand, edge-compute improvements, security and fraud-reduction needs, smart-city digitization, and the expansion of AI into logistics and quality-control workflows. But the same sources show why Megvii cannot capture the full headline upside. Mordor explicitly links future growth in facial recognition and computer vision to stricter consent rules and data-sovereignty design choices, while the Entity List and Xinjiang-linked criticism add a Megvii-specific penalty on top of generic regulatory friction. For a China-based company already on the U.S. Entity List, growth is not constrained only by technology or customer ROI; it is also constrained by procurement optics, cross-border component access, and limits on Western institutional capital. That makes Megvii''s practical market opportunity less about total computer-vision spend and more about how much domestic and politically neutral demand can be won in smart city,
    enterprise access, and logistics use cases. The key diligence implication is straightforward: use public market reports as broad ceiling indicators, but anchor underwriting on narrower buyer segments where Megvii still has visible product fit and less direct geopolitical exclusion.'
