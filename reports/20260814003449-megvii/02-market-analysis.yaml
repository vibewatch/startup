  name: Megvii Technology
chapter:
  number: 2
  title: Market Analysis
  summary: Public market reports support a large global computer-vision opportunity, but they disagree sharply on current size and growth, and Megvii's practical serviceable market is materially narrower than headline TAM because of sanctions, privacy friction, and surveillance stigma. The best-supported diligence view is that Megvii participates in a layered AIoT market spanning urban governance, building access, identity, and logistics automation, with buyer economics that differ substantially by workflow.
sections:
- id: market-boundary
  title: Market boundary and adjacencies
  body: 'Megvii does not participate in a single clean software market. Its own official pages show it selling into three overlapping layers: city-management systems, logistics and warehouse automation, and developer or enterprise identity workflows built on Face++ and Brain++. That means the relevant market boundary is broader than stand-alone facial recognition but narrower than all AI. A useful diligence definition is AI-enabled computer vision for physical-world workflows, where models, edge hardware, deployment services, and operations software are bundled into one buying motion. On that definition, Megvii sits at the intersection of urban AI, security and identity, and supply-chain automation. Official competitor sites reinforce that framing: SenseTime also spans infrastructure plus application layers, YITU still foregrounds smart city AI, and incumbents such as Hikvision, Dahua, Axis, and Hanwha train buyers to expect integrated hardware-software solutions instead of pure SaaS. Megvii''s
    market is therefore best analyzed as a layered AIoT and computer-vision stack rather than as an isolated facial-recognition API niche.'
  claimRefs:
