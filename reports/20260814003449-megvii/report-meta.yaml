companyProfile:
  summary: "Megvii Technology is a Beijing-founded private AI company that evolved from facial-recognition roots into a broader AIoT stack spanning Brain++, Face++, smart-building software, smart-city management, warehouse automation, and identity products. Public evidence supports substantial historical capital formation and real commercial deployments, but also shows that sanctions, surveillance controversy, and limited current disclosure sharply constrain investability and valuation confidence."
