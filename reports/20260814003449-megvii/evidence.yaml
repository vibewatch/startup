evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current 2026 employee count or verified current staffing range.
    whyItMatters: >-
      Headcount helps investors assess burn, scale, and whether the company has resized after sanctions and failed IPO
      attempts.
    diligencePath: >-
      Request a current organizational snapshot or audited payroll range from management, or find a fresh domestic
      filing or hiring disclosure.
    relatedQuestionRefs:
      - QO009
      - QO025
  - type: private-evidence-only
    severity: material
    topic: board-governance / TO002
    missingEvidence: A full current board roster, committee structure, and any independent-director information.
    whyItMatters: Late-stage governance quality matters more once a company has sanctions exposure and repeated listing delays.
    diligencePath: Obtain current articles of association, board list, or listing-preparation materials directly from the company.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: stale
    severity: material
    topic: valuation / TO003
    missingEvidence: A post-2019 disclosed valuation or terms for the April 2025 financing.
    whyItMatters: >-
      The last clear public valuation is years old and may overstate present fundability after sanctions and delayed
      exits.
    diligencePath: Request the 2025 round term sheet or cap-table summary from management or investors.
    relatedQuestionRefs:
      - QO008
      - QO019
      - QO021
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: ipo-status
    missingEvidence: A current 2026 statement on Hong Kong or Shanghai listing plans after the 2025 financing.
    whyItMatters: Exit timing is central to late-stage valuation and affects how to interpret fresh capital and investor patience.
    diligencePath: Request management commentary, pre-IPO mandate letters, or the latest exchange correspondence.
    relatedQuestionRefs:
      - QO010
      - QO017
  - type: conflicting-data
    severity: minor
    topic: total-funding
    missingEvidence: >-
      A company-verified cumulative funding number that reconciles profile-database totals with older narrative
      articles.
    whyItMatters: Current databases converge at $1.98B but some newer summaries still cite only $1.5B+ or the older $4B/2019 frame.
    diligencePath: Reconcile the cap-table with each financing close and secondary transaction history.
    relatedQuestionRefs:
      - QO006
      - QO021
  - type: private-evidence-only
    severity: material
    topic: china-only-sam
    missingEvidence: A clean China-only or sanctions-adjusted SAM estimate for Megvii's actual reachable market.
    whyItMatters: Headline global TAM overstates what a sanctioned surveillance-linked vendor can plausibly serve.
    diligencePath: >-
      Build a bottoms-up model from China smart-city, enterprise access, and warehouse workloads instead of relying on
      global topline reports.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: budget-owners / TM003
    missingEvidence: Current procurement-cycle length, ACV, and precise budget-owner detail by segment.
    whyItMatters: >-
      The market is fragmented across public-sector, enterprise, logistics, and identity motions, so GTM efficiency
      depends on buyer specificity.
    diligencePath: Interview customers or channel partners by segment and request pipeline-stage metrics from management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: forecast-spread
    missingEvidence: A reconciled reason why current-size and CAGR estimates differ so widely across market-report vendors.
    whyItMatters: Model spread can create false precision in TAM-driven valuation arguments.
    diligencePath: Normalize which spend layers each market report includes before comparing them directly.
    relatedQuestionRefs:
      - QM021
  - type: stale
    severity: material
    topic: privacy-regulation
    missingEvidence: A current jurisdiction-by-jurisdiction compliance map for Megvii biometric exports in 2026.
    whyItMatters: Privacy and biometric-consent rules are now part of the market-access equation, not a side issue.
    diligencePath: Map product lines against China, EU, Southeast Asia, and Middle East biometric requirements.
    relatedQuestionRefs:
      - QM018
      - QM023
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency / TP003
    missingEvidence: A clean public apples-to-apples price benchmark across Megvii and its main direct peers.
    whyItMatters: >-
      Without pricing comparability, it is hard to judge whether Megvii wins on economics, bundling, or only bespoke
      project scope.
    diligencePath: >-
      Collect live quotes, partner bids, or channel interviews across at least one smart-building, smart-city, and
      identity workflow.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: renewals-and-win-rates
    missingEvidence: Peer-level win-rate, churn, and renewal data across the main vendor set.
    whyItMatters: Competitive durability is much easier to assert than to prove without retention and displacement evidence.
    diligencePath: Interview customers and integrators, and request backlog or renewal data directly from management.
    relatedQuestionRefs:
      - QP025
  - type: conflicting-data
    severity: minor
    topic: public-market-optionality
    missingEvidence: >-
      A cleaner public comparison of how SenseTime, CloudWalk, and Megvii differ today on capital-markets readiness and
      liquidity.
    whyItMatters: Public-market status can influence customer trust and financing optionality as much as product features do.
    diligencePath: Add exchange filings and market-cap data in the next refresh cycle.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: blocking
    topic: audited-financial-statements
    missingEvidence: Audited 2025 or 2026 revenue, gross profit, operating expense, and cash-flow statements.
    whyItMatters: >-
      Without audited operating statements, no serious judgment can be made on revenue quality, margin path, or true
      burn.
    diligencePath: Obtain audited statements, a prospectus draft, or lender / investor reporting packs.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI025
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway / TI004
    missingEvidence: Cash on hand, monthly burn, runway, and any debt or working-capital facilities.
    whyItMatters: Funding history alone does not show whether the company is adequately financed today.
    diligencePath: Request treasury snapshot, debt schedule, and board liquidity materials.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Product-line revenue split across API/software, hardware, services, and public-sector projects.
    whyItMatters: >-
      The business model appears heterogeneous, so aggregate revenue would hide very different margin and collection
      profiles.
    diligencePath: Request revenue by segment, bookings mix, and AR aging.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI017
  - type: stale
    severity: material
    topic: current-valuation
    missingEvidence: 2025 round size, valuation, and liquidation-preference terms.
    whyItMatters: A late-stage company with sanctions overhang cannot be valued confidently off a 2019 round marker alone.
    diligencePath: Request the 2025 term sheet or investor-side summary.
    relatedQuestionRefs:
      - QI002
      - QI003
