company:
  name: Megvii Technology
chapter:
  number: 1
  title: Company Overview
  summary: Megvii is a Beijing-founded private AIoT company built around Face++ and Brain++, with public sources still supporting a late-stage capital base of roughly $1.98B raised but no completed IPO. The strongest evidence shows real technical depth, large-scale historical deployments, and continued domestic financing support, while the U.S. Entity List and Xinjiang-linked human-rights scrutiny remain the defining adverse facts shaping disclosure and investability.
sections:
- id: identity-and-scope
  title: Identity, product scope, and current stage
  body: Megvii Technology sits at the intersection of computer vision, AI infrastructure, and physical-world deployment. The company was founded in Beijing in October 2011 by Yin Qi, Tang Wenbin, and Yang Mu, and public profiles consistently describe the founders as Tsinghua-linked engineers who built the company around large-scale visual-recognition systems. The company is still private as of the 2026 run date, with no completed Hong Kong or Shanghai listing despite multiple filing attempts. On the product side, Megvii still organizes its business around three core verticals — Personal IoT, City IoT, and Supply Chain IoT — and says it commercializes those verticals through a full-stack stack of algorithms, software, hardware, and AI-enabled IoT devices. Face++ remains the best-known front door for outside developers and identity workflows, while Brain++ is described as the internal and commercial AI productivity layer that underpins training, deployment, and operation. Megvii's current-stage
    story is therefore not that of a pure API vendor or a pure surveillance contractor; it is a late-stage private AIoT company trying to convert computer-vision excellence into multiple physical-world revenue lines while carrying a still-unfinished capital-markets process.
