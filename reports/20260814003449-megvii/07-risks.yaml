chapter:
  number: 7
  title: Risks
  summary: Megvii’s risk profile is dominated by a durable sanctions-and-surveillance overhang, layered with privacy regulation, unfinished capital-markets optionality, and limited public disclosure on customer and operating quality. Product breadth and continued domestic commercial activity mitigate some downside, but they do not erase the structural constraints imposed by trust-sensitive demand and tighter biometric regulation.
sections:
- id: sanctions-and-rights-overhang
  title: Sanctions and human-rights overhang
  body: 'Megvii’s highest-confidence risk is the one already formalized by governments and repeated in major reporting: the company sits on the U.S. Entity List and carries a surveillance-related human-rights overhang. That matters in two separate ways. First, it creates technology-supply friction by limiting access to certain U.S. items and components. Second, it creates trust friction with banks, partners, and customers that are sensitive to sanctions, export controls, or reputational scrutiny. Human Rights Watch’s Xinjiang reporting gives that overhang moral and policy weight beyond normal geopolitical noise. Even where the exact technical role of Megvii in any one surveillance workflow may be debated, the diligence consequence is straightforward: the company’s brand is linked to a politically charged category of AI that many institutions would rather avoid. Commercial sanctions databases now echo that status as well, showing that the risk is embedded not only in policy but in day-to-day
    compliance workflows. This is why sanctions and rights scrutiny should be treated as structural constraints on Megvii’s upside, not one-time press noise.'
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR006
  - CR016
