  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-compliance-status / TR001
    missingEvidence: Current litigation, regulator inquiries, fine history, remediation programs, and internal compliance governance for biometric products.
    whyItMatters: The public record proves category-level risk, but only private diligence can show whether Megvii is actively reducing it.
    diligencePath: Request legal diligence memo, regulator correspondence, and internal compliance program materials.
    relatedQuestionRefs:
    - QR021
    - QR025
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-and-segment-exposure
    missingEvidence: Revenue concentration by smart city, property, warehouse, API, and overseas segments.
    whyItMatters: Risk severity depends on how exposed Megvii actually is to the most controversial and regulated end markets.
    diligencePath: Request segment revenue, backlog, and top-customer concentration tables.
    relatedQuestionRefs:
    - QR008
    - QR009
    - QR020
    - QR021
  - type: stale
    severity: material
    topic: current-listing-optionality
    missingEvidence: Management’s current listing plan, banker status, and timetable after earlier failed paths.
    whyItMatters: Exit optionality is central to valuation but remains weakly disclosed in public evidence.
    diligencePath: Request current board materials on listing strategy and financing plan.
    relatedQuestionRefs:
    - QR014
    - QR024
  - type: partial-enumeration
    severity: minor
    topic: international-footprint
    missingEvidence: A complete current list of live international deployments and active non-China channels.
    whyItMatters: Overseas market-access risk is hard to price when Singapore is the clearest public proof point.
