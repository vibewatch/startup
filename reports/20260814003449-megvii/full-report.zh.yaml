      - number: '4.4'
        title: 财务结论：商业化可见，经济性不透明
        blocks:
          - type: paragraph
            body: >-
              公开来源给出的最清晰结论，不是 Megvii
              缺少商业活动，而是其经济质量披露不足。官方和伙伴发布显示，公司在零售、电信相关数字生活渠道、智慧城市场景，以及仓储或楼宇流程中有真实部署。数据库式画像也显示，公司继续吸引资本。但投资者最基础的问题仍未在公开层面得到回答：当前收入、利润、毛利率、烧钱、跑道和融资条款都缺失或不完整。这迫使结论保持谨慎。财务上，Megvii
              更像一家资金充足但仍不透明的 AIoT
              集成商，而不是一家可透明规模化的软件公司。落到实际尽调中，即便产品证据偏乐观，也应先打折，直到管理层打开分部组合、现金和利润率轨迹账本。在经审计的收入质量和资本充足性指标可用前，任何承销案例都应假设执行和融资风险高于单看产品足迹会给出的水平。
