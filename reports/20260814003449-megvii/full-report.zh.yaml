      - number: '2.4'
        title: 增长驱动、采用约束与制裁调整后的影响
        blocks:
          - type: paragraph
            body: >-
              所审阅来源反复出现五个增长驱动：自动化需求、边缘计算改善、安全与反欺诈需求、智慧城市数字化，以及 AI 向物流和质检流程扩展。但同一批来源也说明，Megvii 无法吃到全部标题式上行空间。Mordor
              明确把人脸识别和计算机视觉的未来增长，与更严格的同意规则和数据主权设计选择联系起来；Entity List 和涉及新疆的批评，则在通用监管摩擦之上叠加了 Megvii 专属惩罚。对一家已经列入美国 Entity
              List 的中国公司来说，增长不只受技术或客户 ROI 限制，也受采购观感、跨境组件获取和西方机构资本限制约束。因此，Megvii
              的实际市场机会重点不是计算机视觉总支出，而是它能在智慧城市、企业通行和物流场景中赢下多少国内及政治中性需求。关键尽调含义很直接：把公开市场报告当作宽口径天花板指标，但承销要锚定更窄的买方分层——Megvii
              在这些分层仍有可见产品匹配，也较少遭遇直接地缘政治排除。
