      - number: '3.2'
        title: 能力、分销与各类竞争者的胜场
        blocks:
          - type: paragraph
            body: >-
              能力比较沿两条轴展开：平台宽度和渠道触达。SenseTime 是最清晰的中国本土平台参照，因为它明确把基础设施和多类应用结合起来，呼应 Megvii 的 Brain++ + 解决方案栈逻辑。YITU
              在已审阅来源中更聚焦公共部门和医疗叙事。Hikvision 和 Dahua 仍然强大，并不一定因为它们在核心模型研究上胜过 Megvii，而是因为它们卖进了买方已经信任的硬件足迹和采购渠道。Axis 和
              Hanwha 同样说明，全球企业买方多么看重分销、可靠性和长生命周期设备生态。Face++ 是 Megvii
              应对这种结构的一个独特反击点，因为它给了公司开发者和身份表层，纯摄像头既有厂商未必能明显匹配。与此同时，Clearview 提醒投资者：即便缺少 Megvii 更宽的 AIoT
              野心，较窄的专家也能在单一细分里构成威胁。因此，竞争战不只是准确率之争，而是宽度、信任、打包能力和进入市场路径之争。
