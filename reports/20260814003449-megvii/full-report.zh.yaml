      - number: '3.4'
        title: 护城河耐久性、商品化风险与 Megvii 特定弱点
        blocks:
          - type: paragraph
            body: >-
              Megvii 的护城河在按全栈 AIoT 和视觉基础设施平台出售时最强，而不是作为单独人脸识别功能出售。这也是为何应更接近 SenseTime
              而非纯摄像头厂商来比较它的战略逻辑。但护城河也受两头挤压。第一，当买方把人脸识别和门禁控制看作硬件既有厂商更大捆绑包中的一个功能时，它们可能商品化。第二，Megvii 背着许多海外替代者没有的信任和监管包袱：美国
              Entity List、涉及新疆的审查、停滞的 IPO 路径，都会削弱公司在敏感出口市场中的定位。这些问题不会抹掉 Megvii 的技术深度，但会抬高赢下信任敏感交易的门槛，也让全球扩张比 Axis、Hanwha
              或其他未受制裁供应商更难。因此，竞争尽调应把 Megvii 承销为技术可信但受信任约束的玩家；其最佳相对优势仍在软件定义、集成式的物理世界 AI 工作负载。
