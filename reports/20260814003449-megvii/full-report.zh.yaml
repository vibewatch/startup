  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: wide
    summary: Megvii 的研究内核、平台和垂直解决方案，直接连到客户验证，也连到制裁阴影。
    data:
      nodes:
        - id: research
          label: 研究内核
          detail: 内部计算机视觉研究能力强，竞赛战绩也突出。
        - id: brainpp
          label: Brain++
          detail: Megvii 自有 AI 生产力平台。
        - id: facepp
          label: Face++
          detail: 面向开发者的人脸识别和 CV 平台。
        - id: verticals
          label: 三条 AIoT 垂直线
          detail: 个人 IoT、城市 IoT、供应链 IoT。
        - id: deployments
          label: 部署案例
          detail: 零售、智能门禁、电信、奥运场馆和城市运营。
        - id: capital
          label: 资本基础
          detail: 累计融资 $1.98B，投资人包括国资相关和战略投资方。
        - id: constraint
          label: 约束
          detail: 实体清单和监控污名压低全球投资人的期权价值。
      edges:
        - from: research
          to: brainpp
          label: 支撑
        - from: research
          to: facepp
          label: 支撑
        - from: brainpp
          to: verticals
          label: 驱动
        - from: facepp
          to: verticals
          label: 导入身份识别和 CV 用例
        - from: verticals
          to: deployments
          label: 商业化进入
        - from: capital
          to: research
          label: 提供资金
        - from: constraint
          to: capital
          label: 限制 IPO 路径
        - from: constraint
          to: deployments
