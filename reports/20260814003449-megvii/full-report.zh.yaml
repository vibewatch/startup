    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点：公开记录实际给了什么
        blocks:
          - type: paragraph
            body: >-
              Megvii 的公开估值记录更多由融资历史锚定，而不是运营披露。最强历史标尺仍是 2019 年融资轮；Reuters 报道称，该轮公司估值略高于 $4B。Tracxn 和 The Company Check
              仍显示非常大的累计融资底子——10 轮约 $1.98B——Tracxn 还记录了 2025 年另一笔未披露金额的国内轮。这些事实重要，因为它们证明 Megvii
              曾获得强劲后期私募市场支持，也并未被资本完全切断。但它们没有解决核心估值问题：公开投资者仍不知道公司的当前收入、利润率、增长质量或 2025 年轮次定价。因此，2019
              年标尺可作为锚点，但作为估算很危险。它是旧数据点，不是当前清算价。
