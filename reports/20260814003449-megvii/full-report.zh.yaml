            body: >-
              仅凭公开证据，Megvii
              更像一家应被框定区间、而不是精确点估的公司。最后一个干净融资锚点已经很旧，私营公司披露缺口很大，制裁包袱也真实存在。这些因素让类公开市场溢价倍数难以自圆其说。不过，公司资本历史、持续商业活动和对大型 AI
              市场的暴露，也意味着它不能被简单视为搁浅资产。最可辩护的解读，是以低于 2019 年标尺为中心的风险调整估值区间；只有当投资者对收入质量、合规姿态和现实退出路径更有信心时，上行才成立。换句话说，Megvii
              的价值主要不是 TAM 函数，而是私下尽调能否把信任和披露折价收窄到足以让市场相信剩余故事。在那之前，情景纪律比表格精确更重要，耐心也比理论上行更重要。
