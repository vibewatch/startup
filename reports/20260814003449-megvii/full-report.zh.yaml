      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Megvii 显然已经融到足够资本，足以搭出一家规模可观的公司；但公开证据仍不足以判断它是否有足够资本迈向自我维持的经济性。Tracxn 和 The Company Check 在 10 轮累计融资 $1.98B
              上趋于一致，并记录 2025 年 4 月一笔未披露金额的 Series D；最有支撑的最后公开估值标尺来自 2019 年那轮略高于 $4B 的估值。公司 2019
              年自己的新闻稿称，资金将用于深度学习技术、商业化、人才和全球扩张，这符合资本密集型 AIoT 建设路径。2021 年 STAR Market 申报也显示，在香港进程停滞后，Megvii
              继续寻求公开市场准入。问题在于，现金、烧钱、跑道、债务和营运资本义务仍不透明。延后的香港 IPO、后续 STAR 路径和 Entity List
              限制在财务上都重要，因为即便国内投资者仍支持，它们也会降低融资灵活性。保守看，2025 年融资证明资本入口并未关闭，但不能证明资本充足。
