  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台：Brain++、MegEngine 与研究深度
        blocks:
          - type: paragraph
            body: >-
              Megvii 的技术身份不止人脸识别。栈的核心是 Brain++，公司将其描述为专有 AI 生产力平台，覆盖算法生产、模型训练、部署和支持流程。商业版 Brain++
              发布重要，因为它不只是被包装成基础设施，还被描述成可衡量的效率层，声称算法开发加快 80%、算法生产成本降低 55%。Megvii 还把人脸识别技术直接连到 MegEngine
              深度学习框架，说明公司掌握了模型开发底座的有意义部分。MegEngine 和 MegFlow 的公开 GitHub 仓库强化了这一点：栈的一部分可被外部查看，而不只是黑箱营销。2015 年 LFW
              工作、RepVGG 等学术论文进一步支持 Megvii 具备真实计算机视觉研究血统；CVF 发表页面也确认 RepVGG 进入重要会议。技术结论是，Megvii 最适合被理解为纵向一体化的视觉 AI
              栈，既有内部基础设施，也有对外研究产出。
