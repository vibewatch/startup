  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 制裁与人权包袱
        blocks:
          - type: paragraph
            body: >-
              Megvii 置信度最高的风险，已经被政府正式化，也被主流报道反复提及：公司位于美国 Entity List
              上，并背负与监控相连的人权包袱。这件事有两层影响。第一，它通过限制获取某些美国物项和组件，制造技术供应摩擦。第二，它在对制裁、出口管制或声誉审查敏感的银行、伙伴和客户那里制造信任摩擦。Human Rights
              Watch 的新疆报道让这项包袱超出普通地缘政治噪音，具备道德和政策重量。即使 Megvii 在某个具体监控流程中的确切技术角色仍可争论，尽调后果也很直接：公司品牌与一个政治高压的 AI
              类别相连，许多机构宁愿回避。商业制裁数据库如今也呼应了这一状态，说明风险不仅嵌在政策里，也嵌进日常合规流程。因此，制裁和人权审查应被视为 Megvii 上行空间的结构性约束，而不是一次性媒体噪音。
