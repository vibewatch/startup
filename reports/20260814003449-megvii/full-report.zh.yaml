            body: >-
              Megvii 的公开产品表层显示，公司试图控制计算机视觉栈的多层。Face++ 和企业 FaceID 资产清楚展示了开发者与身份产品分销；Face++ 中国站则暗示 API 和 SDK 覆盖较广。Pangu
              为考勤、门禁、访客和区域安全运营增加了更高一层软件；开放 API 定位也意味着 Megvii
              希望第三方把其算法嵌入自身系统。硬件页面又把同一栈延伸到设备和边缘：门禁终端支持大规模端侧识别库，身份设备宣传快速验证，网络摄像机把云 - 边 - 端算法直接连到传感器产品。这种架构有战略意义，因为 Megvii
              可以通过 API、企业软件和专用硬件，变现同一套底层模型。它也让公司不只是纯模型供应商，但也没那么资产轻。Papers With Code、Hugging Face、Replicate
              等外部开发者平台也显示，至少有一部分栈正在进入更广的开发者发现渠道。因此，产品故事是栈控制，而不是一个旗舰应用。
