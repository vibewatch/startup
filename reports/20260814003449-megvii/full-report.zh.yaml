      - number: '1.2'
        title: 研究实力、创始人依赖与负责任 AI 姿态
        blocks:
          - type: paragraph
            body: >-
              Megvii 的公开自我描述更强调研究深度和创始人带队执行，而不是正式的公众公司治理。公司称其运营全球最大的计算机视觉研究院，自 2017 年以来拿下 49 个国际 AI 竞赛冠军，其中包括 2019
              年连续第三次赢得 COCO 挑战。这些说法解释了公司为何既能搭出面向消费者的开发者平台，也能沉到内部 AI 基础设施层。Brain++ 和 MegEngine 重要，因为它们说明 Megvii
              不只是包装第三方模型；公司在自己的算力、数据和框架栈上投入了资源。但公开来源更难验证治理质量。Megvii 给出了一些安慰信号：公司称 2019 年发布 AI Ethics Code，并设立 AI Ethics
              Committee 和 AI Ethics Research Institute。即便如此，公开证据在技术领导力上明显更强，在现任董事会构成、独立监督或 2026
              年领导层变化上则不足。结果是一家创始人中心的公司：研究引擎可信，伦理框架已有部分表述，但按后期投资者标准，公开治理记录仍不完整。
