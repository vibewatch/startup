              的部分客户价值与流程重设计和自动化有关，不只是识别准确率。尽管如此，这些参考没有回答核心投资者问题。它们没有披露
              ACV、续约、合同期限、按行业划分的收入占比，也没有说明最可见的部署到底是典型案例还是例外。公开层面，本章证明牵引和技术匹配要容易得多，证明持久客户经济性则难得多。
