      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              分析
              Megvii，最有用的分层不是原始行业代码，而是运营流程。市政和公共部门买方为交通、公共安全和城市管理场景采购；企业安防和设施团队为门禁、智慧楼宇和物业流程采购；物流运营方为仓储效率和安全采购；消费设备或数字服务团队购买
              Face++ 和身份模块，用于注册、欺诈控制和设备功能。每个分层的经济买方不同。城市项目里，市政 IT
              部门和公共安全预算重要；楼宇通行里，安防负责人、设施经理和物业运营方重要；仓储场景的运营买方更接近物流或供应链负责人；数字身份场景则常常是产品或风控负责人。这个分层也解释了 Megvii
              为何在每个板块面对不同竞争原型：城市智能里是 AI 同行，物理安防里是硬件既有厂商，身份流程里是开发者工具竞争者。它也说明，公开证据对采购周期仍不完整：Megvii
              的销售动作分散在多类买方中，而不是集中在一个可重复的 SaaS 动作里。
