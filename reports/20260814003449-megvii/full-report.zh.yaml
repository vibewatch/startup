            body: >-
              已审阅来源显示，Megvii 的客户动作高度垂直化。智慧城市页面指向政府和公共空间运营方；仓储材料指向大型工业或物流账户；Smart Park、Pangu 和硬件页面指向物业运营方、园区和企业入口流程。China
              Telecom 证明，分销也可以通过大型平台或渠道伙伴推进；Face++ 和身份资产则显示出另一条开发者或集成商路径。这意味着，不应把 Megvii
              理解为只有一个统一进入市场动作。相反，它似乎把直接企业销售、公共部门解决方案销售、绑定硬件的楼宇部署和伙伴驱动分销组合在一起。这种多样性在战略上是正面的，因为它扩大了可触达客户基础；但它也让人很难把一种平均合同类型、平均销售周期或平均留存模式推广到全公司。
