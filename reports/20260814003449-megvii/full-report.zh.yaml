      - number: '7.2'
        title: 资本市场与流动性风险
        blocks:
          - type: paragraph
            body: >-
              Megvii 的融资历史证明资本入口存在，但上市历史也证明退出确定性不存在。Reuters 及相关报道显示，2019 年香港流程在黑名单之后受阻；后续 STAR Market
              申报则显示，公司继续追求公开市场选择权，却没有走完。这种组合带来三类风险。第一是纯流动性风险：投资者不知道干净的公开退出何时可行。第二是融资风险：一家带政策争议的私营公司，可能继续依赖有支持意愿的国内资本，而不是广泛全球资本。第三是估值风险：没有公开上市或当前披露的轮次条款，外部投资者只能用过时标尺三角定位价值。更宽的
              2026 年出口管制环境仍在变化，也提高了押注政策压力会简单消退的难度。保守看，Megvii 资金足以继续运营，但透明度不足以排除资本市场风险。
