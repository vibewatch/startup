      - number: '1.3'
        title: 融资历史、估值标尺与商业证明点
        blocks:
          - type: paragraph
            body: >-
              Megvii 的融资历史说明，哪怕承受制裁压力，它仍具战略相关性。2019 年，公司完成 $750M Series D，公开报道点名 BOCGI、ADIA 子公司、Macquarie、ICBC Asset
              Management (Global) 和 Alibaba 等参与；Reuters 称该轮估值略高于 $4B。更新的数据库式来源如今大致汇合在 10 轮累计融资约 $1.98B；Tracxn 还记录了 2025
              年 4 月 8 日另一笔未披露金额的 Series D，参与方包括 Ant Group、Legend Holdings 和 Chongqing Industrial Investment
              Fund。商业证明也能在公司自有发布中看到：Koala 覆盖北京 191 家超市，包括 Chaoshifa 和 Wumart，随后扩展到泰国、巴西和阿联酋；Megvii 还提到在新加坡一座 280
              米高的混合用途地标部署智慧通行，并在北京冬奥会主要场馆做智能场馆项目。这些证明点不能替代经审计收入或利润率披露，但确实显示公司在零售、企业通行、公共场馆、电信生态和供应链流程中仍有部署相关性。
