      - number: '2.2'
        title: 规模测算视角：广义 TAM、较窄 SAM 和生物识别子赛道
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个很大、但口径高度不一致的机会区间。IMARC 估算 2025 年全球计算机视觉市场为 $21.7B，Fortune Business Insights 给出的 2025 年规模为
              $20.75B，Mordor 为 $27.39B。Verified Market Research 以 2024 年为基准，数值更低，凸显估算对市场定义和纳入支出的敏感度。增速分歧更大：IMARC 显示中个位数
              CAGR，而 Fortune、Mordor 和 MarketsandMarkets 随口径是全部计算机视觉还是 AI 增强计算机视觉，隐含中双位数到 20% 出头的增长。人脸识别显然只是这个大市场的子集，TBRC
              和 Mordor 将其 2025 年规模放在约 $7.9B 至 $8.6B。这个差距对 Megvii 很关键。如果投资者只把公司按人脸识别供应商承销，可服务市场明显更小；如果把 Megvii 按城市 + 物流 +
              身份平台承销，天花板就高得多。由于制裁和监控污名收窄了 Megvii 的实际触达，更合适的尽调姿态是使用区间化 TAM，并采用更保守、经制裁调整的 SAM，而不是押一个英雄式单点市场规模。
