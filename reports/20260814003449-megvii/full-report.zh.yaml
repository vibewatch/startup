              Megvii 需要公开可比公司，但每个参照物回答的都是不同问题。SenseTime 是最接近的中国公开 AI 平台类比，因为它把大规模 AI 野心、仍可见亏损和公开上市后的披露结合在一起。Hikvision
              展示的是成熟可信的 AIoT 和安防既有厂商在规模化时是什么样，但其估值框架由盈利能力和根深蒂固的硬件渠道塑造，Megvii 并不具备同样条件。Palantir
              从相反方向有用：它展示了经审计增长、盈利能力和美国市场准入能给 AI 平台带来多少估值支撑，尽管产品集差异很大。Axis 更多说明信任和进入市场路径质量，而不是倍数数学。教训是，Megvii
              不能盲目套用某一个同行倍数；投资者需要交叉校验篮子，并对披露、信任、业务组合和政策负担差异给出大幅折价。
