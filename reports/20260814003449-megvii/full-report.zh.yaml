  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有厂商与专业替代者
        blocks:
          - type: paragraph
            body: >-
              Megvii 所处赛道很碎片化，不能用一张同业名单概括。最接近的中国本土平台同行是 SenseTime、YITU 和 CloudWalk，它们在视觉
              AI、公共部门工作负载和企业部署上都有重叠。Hikvision、Dahua 等硬件重型既有厂商从相反方向竞争：它们先拥有已安装摄像头、安防渠道和一体化监控基础设施，再把 AI
              叠到这片基础上。Axis、Hanwha Vision 等全球企业信任型既有厂商，则在中国以外用渠道质量、长运营历史和可信的物理安防分销来定义买方预期。Clearview AI
              又属于另一类：更窄的人脸识别专家，围绕执法识别而建，不是广义 AIoT 运营栈。Tracxn 和 The Company Check 也强化了同一点：Megvii
              面对的是庞大且多样的同业集合，而不是整齐单一市场。因此，尽调应先按原型给竞争者分类，再比较产品或经济性。
