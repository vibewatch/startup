chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Megvii Technology 处在计算机视觉、AI 基础设施和物理世界部署的交汇处。公司 2011 年 10 月在北京成立，创始人为 Yin Qi、Tang Wenbin 和 Yang
              Mu；公开画像一致把三位创始人描述为 Tsinghua 背景工程师，他们围绕大规模视觉识别系统搭起公司。截至 2026
              年本次报告生成日，公司仍是私营状态，虽多次递交上市文件，但香港或上海上市都未完成。产品侧，Megvii 仍按三条核心垂直线组织业务——Personal IoT、City IoT 和 Supply Chain
              IoT——并称自己用算法、软件、硬件和 AI 赋能 IoT 设备组成的全栈，将这些垂直场景商业化。Face++ 仍是外部开发者和身份流程最熟悉的入口；Brain++ 则被描述为支撑训练、部署和运营的内部及商业
              AI 生产力层。因此，Megvii 当前阶段的故事既不是纯 API 供应商，也不是纯监控承包商，而是一家后期私营 AIoT 公司：它试图把计算机视觉优势转成多条物理世界收入线，同时背着尚未完成的资本市场进程。
