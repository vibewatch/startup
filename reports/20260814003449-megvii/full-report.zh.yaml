      - number: '5.4'
        title: 技术结论：栈宽、研究真实，独立验证仍不完整
        blocks:
          - type: paragraph
            body: >-
              Megvii
              产品和技术位置最强的公开论点，是宽度。公司似乎掌握了有意义的基础设施，开放了外部开发者表层，出货边缘硬件，并把计算机视觉能力包进多类垂直解决方案。开源仓库和学术论文让技术故事比普通纯营销供应商叙事更可信。Papers
              With Code、Hugging Face、Replicate 和 ModelScope 等外部平台还提供了另一种有用信号：Megvii
              资产出现在开发者实际发现和运行模型的生态中。但公开证据也有清晰边界：最有利的性能表述仍有不少来自 Megvii
              自身。已审阅来源中，当前独立证据不足以回答公司是否仍处在基准领先、专利深度、推理经济性或产品线部署规模等问题。因此，技术案例应被视为可信，但尚未完全经过独立审计。投资者可以相信 Megvii
              是真实的栈构建者；若没有更深的客户、基准和工程尽调，就不应同样确信每一层今天到底有多可防御。
