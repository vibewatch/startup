  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻领域
        blocks:
          - type: paragraph
            body: >-
              Megvii 不是在一个边界清晰的单一软件市场里竞争。其官方页面显示，公司卖进三层重叠场景：城市管理系统、物流和仓储自动化，以及基于 Face++ 和 Brain++
              的开发者或企业身份流程。也就是说，这个市场边界宽于单独的人脸识别，但窄于全部 AI。更有用的尽调定义，是用于物理世界流程的 AI
              赋能计算机视觉：模型、边缘硬件、部署服务和运营软件被打包进一次采购。在这个定义下，Megvii 处在城市 AI、安全与身份、供应链自动化的交汇处。官方竞争者网站也强化了这个框架：SenseTime
              同样横跨基础设施和应用层，YITU 仍突出智慧城市 AI，Hikvision、Dahua、Axis、Hanwha 等既有厂商也教育买方期待硬件 + 软件一体化方案，而不是纯 SaaS。因此，Megvii
              的市场最好按分层 AIoT 和计算机视觉栈来分析，而不是当作孤立的人脸识别 API 小众市场。
