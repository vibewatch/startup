  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户足迹：公开可见内容
        blocks:
          - type: paragraph
            body: >-
              Megvii 的公开客户证据有意义，但不均衡。公司显然横跨多类买方：政府和城市运营方、物流和仓储用户、楼宇和园区运营方、电信生态、零售点位，以及通过 Face++
              暴露的开发者或集成渠道。具名公开参考包括新加坡智慧通行部署、China Telecom 合作、北京超市铺设和 Jinyu 物业管理合作。这些参考重要，因为它们证明公司卖的不是抽象 AI
              模型，而是在落地真实物理世界部署。与此同时，这些证据并不像传统 SaaS 客户页那样组织，有客户标识、案例研究和按账户量化的
              ROI。可见内容更多是部署证明或伙伴证明，而不是投资级客户分析。因此，正确解读是：Megvii
              在多个行业有真实客户牵引，但公开证据只部分揭示谁才是真正最重要的经济客户。即便开发者侧表层，也更多通过平台表面可见，而不是通过具名公开账户可见。
