      - number: '1.4'
        title: Entity List 暴露与仍未完成的 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              Megvii 公司概览里最核心的不利事实，是其资本市场故事自 2019 年以来一直受制裁和人权审查塑形。2019 年 10 月 9 日生效的 Federal Register 通知把 28 家中国实体加入美国
              Entity List；CNBC 和 Yahoo Finance 转发 / 刊载的同期 Reuters 报道将 Megvii 列为受影响的 AI 公司之一。Human Rights Watch
              关于新疆监控的报道解释了这次列名为何持续重要：公司处在更广的人脸识别和公共安全生态里，西方投资者和监管者把这类生态视为政治敏感。Reuters 还报道，HKEX 监管方在 Megvii 2019 年 11
              月上市聆讯中提出了额外问题，而不是批准交易，使目标融资 $500M 至 $1B 的香港 IPO 陷入停滞。后续画像来源仍把 Megvii
              的香港和上海上市推进描述为停滞，而非完成。合在一起，证据支持一个简单的公司概览结论：Megvii 确实搭出了一家融资雄厚的 AIoT 业务，但其公开退出路径和国际可投性仍被制裁、监控污名和披露不足实质性限制。
