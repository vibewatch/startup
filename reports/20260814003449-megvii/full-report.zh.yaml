companyProfile:
  summary: >-
    Megvii Technology 是一家创立于北京的私营 AI 公司，最早从人脸识别起家，后来扩展成更宽的 AIoT 栈，覆盖
    Brain++、Face++、智慧楼宇软件、智慧城市管理、仓储自动化和身份产品。公开证据支持其历史融资规模很大、商业部署也真实存在，但制裁、监控争议和当前披露有限，也明显压住了可投性和估值置信度。
