            body: >-
              已审阅来源对产品架构的可见度，远好于对财务效率的可见度。Brain++ 具备财务相关性，因为 Megvii 称商业平台可降低 55% 的算法生产成本、缩短 80%
              的开发时间，说明它可能是真实的内部效率层，而不只是营销话术。即便如此，公开来源都没有披露后期私营公司投资者通常想看的单位经济：可获取公开证据中没有 ARR、毛利率、烧钱、CAC、回本期、NRR
              或流失指标。产品组合也暗示利润率异质性。API
              或软件主导的身份产品，毛利结构应与需要部署服务、硬件或定制的智慧城市和仓储项目明显不同。因此，本章能看清商业模式，却看不清每一层的经济质量。这是有意义的分析限制，因为 Megvii
              可能在表面部署活动上显得有吸引力，却仍难以高效规模化。
