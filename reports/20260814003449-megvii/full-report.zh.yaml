  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现表层
        blocks:
          - type: paragraph
            body: >-
              Megvii 的公开记录支持的是混合变现模式，而不是边界干净的单一产品 SaaS 故事。Face++ 显示了身份和开发者流程中的一个软件或 API 式表层。Device Authentication
              及验证产品暗示，公司围绕活体检测、验证和反欺诈流程还有另一层变现。Pangu 及其开放 API 定位表明，Megvii 也销售用于门禁、考勤、访客管理和区域安全运营的软件层。同时，Smart City
              Management 和 Smart Warehouse 解决方案页面意味着，公司还有项目、集成和运营收入，这些收入取决于部署范围、硬件组合和客户流程重设计。China Telecom
              与超市案例又证明，Megvii 也通过渠道和部署伙伴变现。Smart Identity Verification Device
              页面进一步显示，身份流程还绑定专用硬件销售。这种组合在战略上有帮助，因为它扩大了可触达收入池；但也意味着分析 Megvii 时，不应把它看成纯经常性软件供应商，而应看成一家 AIoT
              公司，不同产品线的收入质量差异很大。
