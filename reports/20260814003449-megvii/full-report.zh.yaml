      - number: '3.3'
        title: 定价不透明、切换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              几乎所有这些竞争者的直接公开定价对比都很弱。已审阅来源大多推广解决方案，而不是发布标价；这符合该市场特征，因为部署范围、硬件组合、准确率门槛和合规需求会随客户大幅变化。这种不透明很重要，因为竞争结果往往更多取决于项目设计和已安装基础经济性，而不是简单的每席价格比较。摄像头、门禁控制、软件规则、访客流、仓库流程或身份流程一旦被集成进某个场地，切换成本就会明显上升。Hikvision、Dahua、Axis
              和 Hanwha 通过已安装设备和渠道关系受益；Megvii 和 SenseTime
              则在平台软件和模型层变得难以不重构流程就替换时受益。评估阶段仍可以多供应商并用，但规模化部署后会更难。对投资者来说，缺失的关键是胜率、ACV 和续约的硬证据，而公开证据目前没有清晰披露。
