    layout: wide
    summary: 融资、制裁和平台商业化里程碑解释了 Megvii 从 2011 年创立，到 2025 年仍未上市却完成融资的路径。
    data:
      items:
        - label: 在北京成立
          date: 2011-10
          detail: Megvii 由 Yin Qi、Tang Wenbin 和 Yang Mu 创立。
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - label: Face++ 发布
          date: '2012'
          detail: 公司推出视觉平台，后来成为最知名品牌。
          tone: positive
          claimRefs:
            - CO005
        - label: $750M Series D 轮
          date: '2019-05-08'
          detail: Megvii 完成大额后期融资，估值超过 $4B。
          tone: positive
          claimRefs:
            - CO018
            - CO022
        - label: AI 伦理准则
          date: '2019-07-08'
          detail: Megvii 发布内部 AI 应用原则。
          tone: neutral
          claimRefs:
            - CO015
        - label: 被列入实体清单
          date: '2019-10-09'
          detail: 美国将 Megvii 加入实体清单。
          tone: warning
          claimRefs:
            - CO027
            - CO028
        - label: HKEX 受挫
          date: '2019-11-22'
          detail: 监管机构没有批准上市，而是提出更多问题。
          tone: warning
          claimRefs:
            - CO030
            - CO031
        - label: MegEngine 开源
          date: '2020-03-25'
          detail: Megvii 开放自有深度学习框架。
          tone: positive
          claimRefs:
            - CO013
        - label: Brain++ 商业化
          date: '2020-09-21'
          detail: Brain++ 面向企业部署商业化发布。
          tone: positive
          claimRefs:
