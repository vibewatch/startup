            body: >-
              给 Megvii
              估值时，最大的分析错误是把公司要么当成纯监控资产，要么当成干净的软件平台。公开证据支持的是更复杂的图景。Brain++、Face++、仓储自动化、智慧楼宇流程、电信渠道，以及零售或国际部署证明，都指向真实商业宽度。这个宽度支撑了高于零的估值底线，也反对把业务视为政治上完全不可触碰。与此同时，Entity
              List、监控争议、失败的 IPO 路径，以及缺少经审计公开运营指标，都足以让过时的 2019
              年锚点承受重折价。实际来看，估值案例是在产品宽度和政策拖累之间拉扯。因此，基于公开证据更合适的输出是情景区间：下行情景里，政策和流动性折价占主导；中性情景里，商业宽度抵消一部分折价；上行情景只有在未来披露和退出选择权显著改善时才成立。
