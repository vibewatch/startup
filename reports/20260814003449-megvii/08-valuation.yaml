  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-operating-disclosure
    missingEvidence: Audited 2025 or 2026 revenue, gross margin, burn, and segment mix.
    whyItMatters: Without audited operating numbers, public valuation can only produce a range around stale anchors.
    diligencePath: Obtain audited statements, prospectus drafts, or lender / investor reporting packs.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV030
  - type: private-evidence-only
    severity: material
    topic: current-round-terms
    missingEvidence: 2025 round size, valuation, liquidation preferences, and investor rights.
    whyItMatters: The newest financing event is the best possible valuation anchor, yet its economics remain undisclosed.
    diligencePath: Request the 2025 term sheet or investor-side summary.
    relatedQuestionRefs:
    - QV004
    - QV021
  - type: partial-enumeration
    severity: minor
    topic: comparable-valuation-table / TV002
    missingEvidence: A complete peer set with directly comparable disclosure, margin profile, geography, and policy risk.
    whyItMatters: The reviewed public comparables are useful but incomplete because each solves only one part of Megvii’s valuation problem.
    diligencePath: Expand the comp set with more listed AIoT, identity, and workflow-software names and normalize for trust and disclosure differences.
    relatedQuestionRefs:
    - QV009
    - QV028
    relatedTableRefs:
    - TV002
  - type: private-evidence-only
    severity: material
    topic: strategic-acquirer-logic / TV005
    missingEvidence: Actual inbound buyer interest, synergies, and buyer appetite under sanctions constraints.
    whyItMatters: Strategic optionality is easy to imagine and hard to underwrite without real buyer evidence.
    diligencePath: Interview management and top investors on prior inbound interest and blocked alternatives.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV005
  - type: stale
    severity: material
    topic: current-mark-vs-2019
    missingEvidence: Any public 2026 transaction or tender signal that updates the old 2019 valuation marker.
    whyItMatters: A company with Megvii’s policy profile can rerate materially over time, in either direction.
    diligencePath: Look for employee tender activity, secondary trades, or new lead-investor pricing.
    relatedQuestionRefs:
    - QV001
    - QV021
    - QV030
