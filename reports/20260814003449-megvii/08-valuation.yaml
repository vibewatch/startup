company:
  name: Megvii Technology
chapter:
  number: 8
  title: Valuation
  summary: Megvii’s valuation is best framed as a scenario range around a stale 2019 private-market anchor rather than as a precise current mark. The company’s large historical funding base, product breadth, and continuing domestic commercial activity support real residual value, but sanctions, surveillance controversy, failed listing paths, and missing audited operating disclosure justify a heavy discount to clean public AI or security comparables.
sections:
- id: valuation-anchors
  title: 'Valuation anchors: what the public record actually gives us'
  body: 'Megvii’s public valuation record is anchored far more by funding history than by operating disclosure. The strongest historical marker remains the 2019 financing round that Reuters reported valued the company at slightly above $4 billion. Tracxn and The Company Check still show a very large cumulative funding base — about $1.98 billion across 10 rounds — and Tracxn records an additional undisclosed domestic round in 2025. These facts matter because they establish that Megvii once commanded strong late-stage private-market support and has not been cut off from capital entirely. But they do not solve the central valuation problem: public investors still do not know the company’s current revenue, margin, growth quality, or 2025 round pricing. As a result, the 2019 mark is useful as an anchor, but dangerous as an estimate. It is an old datapoint, not a current clearing price.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
