- id: product-stack-from-api-to-device
  title: 'Product stack: from APIs and SDKs to hardware and edge deployment'
  body: 'Megvii’s public product surfaces show a company trying to control multiple layers of the computer-vision stack. Face++ and the enterprise FaceID assets show clear developer and identity-product distribution, while the Face++ China site suggests broad API and SDK reach. Pangu adds a higher software layer for attendance, access, visitors, and regional security operations, and the open API positioning implies Megvii wants third parties to embed its algorithms into their own systems. Hardware pages then extend the same stack to devices and the edge: access-control terminals support large on-device recognition libraries, identity devices advertise fast verification, and network cameras tie cloud-edge-device algorithms directly to sensor products. This architecture matters strategically because it lets Megvii monetize the same underlying models through APIs, enterprise software, and purpose-built hardware. It also makes the company more than a pure model vendor, but less asset-light than
    one. External developer platforms such as Papers With Code, Hugging Face, and Replicate also show at least some of this stack leaking into broader developer discovery channels. The product story is therefore one of stack control rather than one flagship application.'
