  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: benchmark-and-inference-economics
    missingEvidence: Current third-party benchmark results, latency, inference-cost, and deployment-performance data by product line.
    whyItMatters: The public tech story is broad, but the most investable questions concern repeatable performance and unit cost in live deployments.
    diligencePath: Run side-by-side bake-offs and request deployment telemetry or engineering scorecards.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: product-adoption-by-line / TE004
    missingEvidence: Current customer counts, active sites, and revenue contribution by product family.
    whyItMatters: Without adoption detail, it is hard to tell which products are flagship engines versus showcase assets.
    diligencePath: Request product-line KPIs, active deployments, and attach metrics.
