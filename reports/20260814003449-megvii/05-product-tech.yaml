- id: TE005
  title: Independent-validation gaps table
  columns:
  - Missing external proof
  - Why it matters
  - Next diligence step
  rows:
  - - Current benchmark leadership
    - Technical moat claims require third-party comparison
    - Run live bake-offs against peer systems.
  - - Patent depth and ownership map
    - Needed to judge IP defensibility
    - Collect patent-family list and assign to product lines.
  - - Inference economics by product line
    - Needed to judge cost advantage at scale
    - Request deployment-level compute and hardware cost data.
  - - Commercial adoption by product
    - Needed to separate flagship products from edge cases
    - Request live deployments, ARR, and customer counts by product.
  - - Independent accuracy audits
    - Needed to validate fast/accurate marketing claims
    - Obtain customer validation reports or partner test data.
  notes: These are the main reasons the chapter stops short of calling Megvii’s tech stack fully verified.
