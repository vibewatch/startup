evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-round-terms
    missingEvidence: Exact size, close date, instrument terms, and investor allocations for the Tencent-linked late-stage round.
    whyItMatters: >-
      Valuation and dilution analysis remain approximate until the actual round mechanics are public or privately
      diligenced.
    diligencePath: Request the term sheet, cap-table waterfall, and board consent package directly from the company or lead investor.
    relatedQuestionRefs:
      - QO020
      - QO024
  - type: conflicting-data
    severity: material
    topic: valuation-conflict
    missingEvidence: Primary confirmation resolving the ~$10B rumor versus the KrASIA/36Kr English USD 100B outlier.
    whyItMatters: Using the wrong valuation anchor would distort both the financials and valuation chapters.
    diligencePath: Obtain the primary 36Kr Chinese article or direct investor confirmation and reconcile translation differences.
    relatedQuestionRefs:
      - QO020
      - QO023
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and executive org chart beyond the founder trio.
    whyItMatters: Key-person risk and governance quality cannot be fully assessed from product and media pages alone.
    diligencePath: Request board materials, management bios, and corporate governance summaries from the company.
    relatedQuestionRefs:
      - QO024
      - QO030
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount-disclosure
    missingEvidence: A credible current headcount figure and geography split after the early 150-person / 300-person milestones.
    whyItMatters: Hiring scale and operating leverage are useful sanity checks against reported revenue and profitability.
    diligencePath: Ask management for current headcount and department mix or obtain payroll / HR system exports in diligence.
    relatedQuestionRefs:
      - QO030
  - type: conflicting-data
    severity: material
    topic: revenue-corroboration
    missingEvidence: Primary financial materials or tax / statutory filings supporting the RMB 10B+ revenue claim.
    whyItMatters: The company-overview cover metrics should not overstate scale without a traceable primary underpinning.
    diligencePath: Request 2025 management accounts, statutory filings, or investor deck pages showing revenue and net profit.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: broad-market-estimates
    missingEvidence: A harmonized bottom-up methodology explaining why public 2026 TAM estimates differ by more than USD 7 billion.
    whyItMatters: Using the highest broad estimate without adjustment would overstate Bambu’s practical market opportunity.
    diligencePath: >-
      Rebuild TAM from printer, materials, software, and services subsegments using one methodology instead of mixing
      syndicated reports.
    relatedQuestionRefs:
      - QM002
      - QM004
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: consumer-only-som
    missingEvidence: A clean public revenue estimate for global consumer and prosumer desktop FDM ecosystems, excluding industrial AM.
    whyItMatters: >-
      Bambu’s serviceable market is narrower than broad additive manufacturing, but current public sources stop short of
      a precise SOM.
    diligencePath: Construct a bottom-up model from shipment volumes, ASP bands, consumables, and software/content attach rates.
    relatedQuestionRefs:
      - QM007
      - QM026
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: TM003 segment coverage
    missingEvidence: More precise spending or buyer-share splits between hobbyists, schools, SMEs, and print farms.
    whyItMatters: The chapter can map buyers qualitatively, but not yet allocate revenue share by segment with confidence.
    diligencePath: Collect channel data, retailer mix, education procurement data, and seller interviews.
    relatedQuestionRefs:
      - QM020
      - QM027
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: bambu-specific-sam
    missingEvidence: Bambu’s internal sales mix by region, customer type, and price band.
    whyItMatters: >-
      The market chapter can show category structure but cannot precisely quantify Bambu’s customer-weighted SAM without
      internal data.
    diligencePath: Request revenue mix, unit mix, and region mix directly from management or investor materials.
    relatedQuestionRefs:
      - QM007
      - QM027
  - type: stale
    severity: minor
    topic: forecast-vintage
    missingEvidence: A single 2026-vintage desktop market model with consistent assumptions through 2030+.
    whyItMatters: >-
      Some retained forecasts are 2025/2030, others 2026/2031 or 2033/2035, which reduces apples-to-apples
      comparability.
    diligencePath: Update the chapter on the next refresh with a matched-vintage desktop-market data pack.
    relatedQuestionRefs:
      - QM003
      - QM005
  - type: missing-source
    severity: material
    topic: private-pricing-consistency
    missingEvidence: Normalized street pricing and channel discounting across all competitor models on one date.
    whyItMatters: >-
      Public product pages mix promo pages, enterprise positioning, and category pages, so price-to-performance
