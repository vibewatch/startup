    severity: material
    topic: data-routing-and-retention-architecture
    missingEvidence: A region-by-region map of where MakerWorld, Bambu Handy, live-view traffic, and analytics data are stored, processed, and retained.
    whyItMatters: Privacy compliance risk cannot be properly underwritten from broad trust-center language alone.
    diligencePath: Request data-flow diagrams, retention schedules, subprocessor list, and China-versus-international hosting logic.
