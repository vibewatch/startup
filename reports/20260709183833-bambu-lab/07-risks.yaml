  evidenceGaps:
  - type: missing-source
    severity: material
    topic: warranty-and-failure-rates
    missingEvidence: Product-family warranty claims, return rates, field-failure distributions, and recall-adjusted quality trends.
    whyItMatters: Without failure-rate math, investors cannot tell whether the A1 recall was isolated or a signal of broader hardware fragility.
    diligencePath: Request warranty reserve policy, failure-rate dashboard, return reasons, and H-series defect data by SKU and region.
    relatedQuestionRefs:
