- id: TR008
  title: Trade and market-access scenario table
  columns:
  - Scenario
  - Mechanism
  - Revenue / margin effect
  - Preparedness question
  rows:
  - - Status quo tariffs persist
    - Section 301 burden continues as part of baseline import math
    - Margins stay sensitive to pricing discipline and promotions
    - How much cost is already baked into current MSRP?
  - - Tariff burden worsens
    - New or expanded duties on relevant printer imports
    - US price increases or gross-margin compression likely
    - Can Bambu shift production, routing, or pricing fast enough?
  - - ITC exclusion order
    - Patent dispute becomes a customs-style market-access event
    - US availability, parts, and warranty operations could be disrupted
    - What products or modules are most at risk?
  - - Settlement with royalties or design changes
    - IP issue resolves without outright ban but with economic cost
    - Margin drag or launch delay instead of full block
    - What royalty or redesign range is tolerable?
  - - Regional diversification succeeds
    - Bambu develops partial production or routing alternatives
    - Lowers long-run geopolitics exposure
    - Is there a credible timeline for diversification?
  notes: The key point is not predicting the exact policy path; it is recognizing that multiple policy paths hit the same US margin and access variables.
