- id: TR007
  title: Product safety and quality signal table
  columns:
  - Signal
  - Public evidence
  - Risk interpretation
  - Mitigation note
  rows:
  - - A1 recall
    - CPSC and Bambu both describe heatbed-cable short-circuit/fire risk
    - Fast growth has already produced a regulator-visible hardware defect
    - Bambu executed a formal refund-or-repair process
  - - 19 damaged-cable reports / one spark
    - Official recall detail from Bambu and CPSC
    - Incident count was contained but still serious enough to justify recall action
    - No injuries reported in official disclosures
  - - H2D first-unit failure in review
    - The Verge says its first review unit failed tests a cheaper printer passed
    - Early complex-product execution remains a real risk
    - Bambu replaced the review unit
  - - H2C TPU / workflow friction
    - PCMag highlights non-intuitive TPU workflow and workaround burden
    - Premium flagship complexity can exceed mass-market ease-of-use promise
    - Strong print quality does not eliminate setup burden
  - - Current forum bug traffic
    - Latest and German forum pages show firmware, AMS, and print-quality issues in July 2026
    - Support and QA burden is ongoing, not historical
    - Forum skew is negative by nature but still operationally useful
  notes: A single public recall should not be exaggerated into inevitability, but it should permanently remove any assumption of near-zero safety risk.
