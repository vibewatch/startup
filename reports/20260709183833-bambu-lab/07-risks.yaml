- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Stratasys / ITC overhang
    - Court or ITC decision
    - Exclusion order, injunction, or settlement requiring economically important redesign
    - Pause or re-underwrite US growth, margin, and valuation
  - - Product-safety recurrence
    - Regulator or company notice
    - Second broad recall, injury report, or widespread heat/electrical issue
    - Treat quality narrative as broken until field data improve
  - - Ecosystem trust erosion
    - Developer/community behavior
    - Another major workflow restriction or legal threat that triggers creator exodus
    - Assume advocacy moat weakens and CAC/brand elasticity worsens
  - - Tariff and customs pressure
    - Trade-policy event
    - Meaningful incremental Section 301 burden or customs friction without price offset
    - Cut gross-margin assumptions or require manufacturing diversification
  - - Cloud / control-plane fragility
    - Outage or incident pattern
    - Repeated auth/connectivity outages that impede printing or monitoring
    - Apply platform-discount logic rather than pure hardware multiple logic
  - - Execution overload
    - Review and support signals
    - Persistent H-series reliability complaints, high return indicators, or support backlog escalation
    - Delay underwriting of premium-line expansion economics
  notes: Kill criteria are phrased as observable events rather than vague concerns so the report can be revisited as facts change.
