  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the right sizing lens
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab does not operate against the whole additive-manufacturing universe. The broad global 3D printing
              market includes industrial metal systems, service bureaus, enterprise software, materials, and specialized
              verticals such as aerospace and medical devices. Public 2026 estimates for that broad market already range
              from roughly USD 27.7 billion to USD 34.9 billion, depending on the research house and how far the analyst
              extends the boundary. The company’s real addressable space is much narrower: desktop and
              entry-level/prosumer printers plus the software, content, and accessory layers that make those machines
              useful after purchase. That distinction matters because the narrower desktop market is several times
              smaller. Mordor places desktop 3D printing at USD 7.51 billion in 2026, while another research house
              projects a roughly USD 4.86 billion base in 2025 growing to USD 10.29 billion by 2030. In other words,
              Bambu’s opportunity is attractive precisely because it sits inside the fastest-growing and most
              consumerized layer of additive manufacturing, not because it can claim every industrial or medical
              3D-printing dollar as serviceable demand.
