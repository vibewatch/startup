      - number: '1.3'
        title: Scale metrics, funding narrative, and unicorn recognition
        blocks:
          - type: paragraph
            body: >-
              Bambu’s scale signals now exceed what most desktop-printer companies have historically achieved.
              Independent reporting tied to Bambu’s own data says the firm overtook Creality in 2025 entry-level
              shipments and captured 37% of the sub-$2,500 market according to Context, while creator-ecosystem metrics
              suggest a user base large enough to support meaningful recurring software and commerce behavior. Funding
              disclosure is much murkier. Call3D’s reproduction of the LatePost interview says IDG backed three rounds
              and that Bambu became profitable unusually quickly, which fits the company’s sparse public fundraising
              trail. Rumor-driven financing coverage is directionally consistent around a late-stage round with Tencent
              and a valuation of about USD 10 billion, but not fully settled: Fabbaloo cites 36Kr for that figure, while
              KrASIA/36Kr English contains an obvious outlier at USD 100 billion that this report does not accept. What
              can be said with confidence is that Hurun’s Global Unicorn Index 2026 already classifies Bambu as a newly
              added Chinese unicorn, meaning the company has crossed the external symbolic threshold even if the exact
              financing mechanics remain opaque. The combination of strong growth, profitability reports, and limited
              disclosure is attractive, but it also means later financial and valuation chapters must separate hard
              evidence from rumor very carefully.
