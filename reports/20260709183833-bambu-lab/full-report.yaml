  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: standard
    summary: >-
      Bambu converts consumer interest into revenue through a layered hardware, upsell, consumables, and channel system
      rather than through a single printer sale.
    data:
      nodes:
        - id: n1
          label: Entry demand
          detail: Consumers, makers, schools, and print farms enter through branded printers across A1, P1, and X1 tiers
        - id: n2
          label: Base hardware sale
          detail: A retail printer sale establishes the installed base and initial gross profit
        - id: n3
          label: Premium ladder
          detail: X1 and P1 families keep ASP above the entry floor
        - id: n4
          label: Combo attach
          detail: AMS bundles increase order value at checkout
        - id: n5
          label: Standalone upsell
          detail: AMS can also be sold as a later upgrade to compatible owners
        - id: n6
          label: Recurring consumables
          detail: Filament, refill, accessories, and replacement parts monetize usage over time
        - id: n7
          label: Promotional events
          detail: Sale campaigns and price protection help drive sell-through but can affect realized ASP
        - id: n8
          label: Ecosystem traffic
          detail: MakerWorld and creator incentives reduce discovery friction and can lower traffic cost
        - id: n9
          label: DTC channel
          detail: First-party commerce preserves more data ownership and likely higher margin
        - id: n10
          label: Retail channel
          detail: Amazon, Micro Center, and offline stores expand reach with partner economics
        - id: n11
          label: Installed-base monetization
          detail: Upsell and consumables keep revenue flowing after the first printer sale
        - id: n12
          label: Reported revenue pool
          detail: The combined stack is what enables CNY 10B-plus annual revenue and strong implied unit economics
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
