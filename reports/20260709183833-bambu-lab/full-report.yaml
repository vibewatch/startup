  - id: FM003
    title: Buyer / segment map
    type: flow
    layout: wide
    summary: >-
      Buyer segmentation shows who actually adopts desktop printers, while the distinct lens versus the table is the
      software- and ease-of-use-driven movement toward repeat workflows.
    data:
      nodes:
        - id: n1
          label: Home hobbyists
          description: DIY, collectibles, household fixes, maker experimentation.
        - id: n2
          label: Education buyers
          description: Schools and labs purchasing for STEM and project-based learning.
        - id: n3
          label: SME prototyping teams
          description: Design, engineering, and product teams seeking faster iteration.
        - id: n4
          label: Print farms / side-hustle operators
          description: Small local manufacturing and batch customization workflows.
        - id: n5
          label: Desktop FDM platform
          description: Affordable, automated, multicolor-capable printers with slicer and app stack.
        - id: n6
          label: Adjacent substitutes
          description: Outsourced prototyping, CNC, laser cutting, resin specialists, traditional fabrication.
      edges:
        - from: n1
          to: n5
          label: creativity and affordability
        - from: n2
          to: n5
          label: STEM and ease of use
        - from: n3
          to: n5
          label: rapid prototyping ROI
        - from: n4
          to: n5
          label: local production economics
        - from: n5
          to: n6
          label: switching boundary when throughput or detail demands change
    approximationNotes: >-
      This is a workflow and buyer relationship map, not a revenue-share chart. It visualizes who buys, who uses, and
