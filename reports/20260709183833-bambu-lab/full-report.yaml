  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The top residual risks cluster around law, trust, safety, and market access rather than raw demand
        blocks:
          - type: paragraph
            body: >-
              Bambu’s demand story is powerful enough that the real underwriting question has shifted from “Will people
              buy the printers?” to “What can interrupt an already successful platform?” The answer is a layered risk
              stack. First, the company has a real legal overhang in Stratasys’s patent campaign and related import-ban
              pathway. Second, it has created a self-inflicted trust risk by tightening control over printer access and
              cloud workflows, then defending those changes through security arguments that many advanced users view as
              ecosystem enclosure. Third, it has already experienced a material product-safety event through the A1
              recall, proving that fast-scaling hardware complexity can become a real cost center. Fourth, it remains
              exposed to U.S.–China trade policy and any future customs or exclusion action that constrains imports into
              its most important Western markets.

                          Those risks are not all equal. The patent/import path and product-safety path are the most directly economic because they can hit availability, warranty cost, or forced redesign. The ecosystem-control and open-source path is more reputational, but that matters disproportionately for Bambu because power users, slicer contributors, creators, and review channels are part of the growth engine. Operationally, the move from single-purpose printers into dual-nozzle, laser, blade, pen, app, slicer, and community software surfaces also increases the number of ways the experience can degrade. The result is a risk profile that deserves respect even if the bull thesis remains intact.
