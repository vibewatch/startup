  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from strong operating proof into premium justification, then gets capped by risk and
      evidence-quality limits at today’s rumored price.
    data:
      nodes:
        - id: v1
          label: Hypergrowth operating proof
          detail: 2025 revenue, profit, market share, and unit scale are all unusually strong for hardware.
        - id: v2
          label: Ecosystem signal
          detail: MakerWorld, app usage, creator tools, and print-farm adoption suggest platform-like behavior.
        - id: v3
          label: Premium justified
          detail: Bambu deserves to trade above struggling public additive peers.
        - id: v4
          label: Rumored price anchor
          detail: The public narrative centers on a roughly $10B valuation.
        - id: v5
          label: Comp check
          detail: Public peers cluster around roughly 1–1.5x sales, far below Bambu’s implied multiple.
        - id: v6
          label: Risk discount
          detail: ITC, tariff, recall, and trust risks still matter.
        - id: v7
          label: Disclosure discount
          detail: Round terms, audit quality, recurring revenue mix, and reserves are still not public.
        - id: v8
          label: Base value below rumor
          detail: A strong but not software-like premium looks more supportable today.
        - id: v9
          label: Track recommendation
          detail: Monitor, diligence harder, and wait for lower price or better evidence.
        - id: v10
          label: Upgrade trigger
          detail: Audited proof, better entry, or confirmed recurring economics could move the call.
        - id: v11
          label: Downgrade trigger
          detail: Legal, recall, tariff, or trust shocks could break the premium case.
        - id: v12
          label: Recommendation discipline
          detail: Company quality is high; entry quality is the open question.
      edges:
        - from: v1
          to: v3
        - from: v2
          to: v3
        - from: v3
          to: v4
        - from: v4
          to: v5
        - from: v5
          to: v8
        - from: v6
          to: v8
        - from: v7
          to: v8
        - from: v8
          to: v9
        - from: v9
          to: v10
        - from: v9
          to: v11
        - from: v9
          to: v12
    claimRefs:
