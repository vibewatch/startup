      - number: '1.2'
        title: Products, software, and platform expansion
        blocks:
          - type: paragraph
            body: >-
              The most important overview takeaway is that Bambu is no longer just a printer SKU vendor. Official pages
              and independent reviews show a vertically integrated stack: printers, filaments, software, mobile control,
              model sharing, creator tooling, and branded accessories all reinforce one another. The company’s official
              software page describes Bambu Studio as open-source slicing software, while MakerWorld acts as the
              user-generated distribution layer for models, projects, and creator activity. By 2025, independent
              coverage of Bambu’s own statistics said MakerWorld had reached about 10 million monthly active users, 2.6
              million original models, 280,000 creators, and 290 million print hours. Those figures matter because they
              imply Bambu’s moat is becoming ecosystem usage rather than only printer unit economics. The printer lineup
              itself has also expanded up-market and sideways: official comparison pages show the company now spanning
              accessible consumer systems, premium enclosed printers, and multifunction manufacturing hubs such as the
              H2D/H2C family, while The Verge, CNET, PCMag, and TIME collectively frame Bambu as one of the most
              influential consumer-hardware brands in its category. That combination of hardware polish plus
              software/community gravity is why Bambu’s market position looks more like a platform company than a
              single-product Kickstarter alumnus.
