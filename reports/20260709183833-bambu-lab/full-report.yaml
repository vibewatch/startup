      - number: '2.2'
        title: Buyers, users, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              The customer map is wider than “makers” but still more consumer-like than industrial AM. Market and review
              sources consistently split desktop demand across hobbyists, education/STEM programs, designers and
              prototypers, small businesses, and increasingly print farms or side-hustle operators. Bambu’s own homepage
              emphasizes everyday products, hobby and DIY, education, and art or fashion. Xinhua/People.cn shows a
              similar real-world pattern inside China, where schools, families, enthusiasts, and entrepreneurial users
              all appear in the same adoption narrative. On the technology side, FDM remains the dominant desktop
              modality because it balances affordability, reliability, and material familiarity; education and
              prototyping are especially important because they create repeat usage without requiring enterprise
              procurement. The buyer can differ from the user: schools buy for students, households buy for hobbyists,
              print farms buy for operators, and engineering teams buy for prototypers. That mix helps explain why
              Bambu’s mix of easy setup, multicolor capability, and first-party software matters. The product is often
              adopted by users who do not want to behave like calibration-first tinkerers.
