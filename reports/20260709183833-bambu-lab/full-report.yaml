      - number: '2.4'
        title: China-dominant supply, barbell structure, and what it means for Bambu
        blocks:
          - type: paragraph
            body: >-
              The most consequential structural fact for Bambu is that consumer 3D printing now looks like a
              China-dominated, barbell-shaped market. CONTEXT’s 2026 data says the entry-level category alone generated
              54% of total system revenue in the quarter and that the top four players—Bambu, Creality, Elegoo, and
              Anycubic—held 88% of unit shipments. State-media-linked reporting and independent summaries go further,
              describing Shenzhen as the center of gravity for nearly 90% of global consumer-grade printer supply and
              reporting millions of Chinese exports in just the first months of 2026. At the same time, industrial
              additive manufacturing has started to rebound on the back of defence, drone, aerospace, and 3C electronics
              demand. That is good for the category’s narrative, but it is not Bambu’s main wedge. Bambu benefits most
              from the “Bambu effect” cited by Formnext and CONTEXT: demand migrating downward into cheaper machines
              that have become good enough for prototyping, education, side businesses, and print-farm workflows. Market
              share, therefore, should be analyzed against entry-level and desktop layers first, not against industrial
              metal leaders.
            claimRefs:
              - CM017
              - CM018
              - CM020
              - CM021
