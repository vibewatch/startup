companyProfile:
  summary: >-
    Bambu Lab is a Shenzhen-based hardware startup founded in 2020 by ex-DJI engineers that has become the world's
    leading consumer desktop 3D printer company. Its flagship X1 Carbon and P1 series combine Core XY motion, automatic
    multi-axis calibration, and a modular Automated Material System for multi-color prints at speeds up to 350 mm/s. The
    company captured approximately 29% of the global desktop FDM printer market in 2025, generating over CNY 10 billion
    (≈$1.4 billion) in revenue and approaching RMB 2 billion (≈$280 million) in net profit — the first 3D-printer
    company to cross the CNY 10 billion revenue milestone.
  foundedDate: '2020-01-01'
  founders:
    - name: Ye Tao
      role: CEO and Co-founder
      background: >-
        Former senior engineer and project lead at DJI, where he led development of several flagship drone product
        lines.
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Consumer and professional desktop FDM 3D printers (X1 Carbon, P1S, P1P, A1, A1 Mini, H2D), proprietary AMS
    multi-color system, Bambu Studio slicer software, MakerWorld model marketplace, and branded filament consumables.
  customerFocus: Hobbyist makers, prosumer engineers, small businesses, print farms, and educational institutions globally.
  businessModel: >-
    Hardware sales (printers, upgrades), branded filament consumables, MakerWorld marketplace, and emerging
    subscription/cloud services.
  stage: Late-stage VC
  fundingStatus: >-
    Late-stage VC round reportedly discussed in November 2025 with Tencent Investment; earlier rounds from 5Y Capital,
    Temasek Holdings, True Light Capital, and IDG Capital; frequently cited valuation reference point is ~$10B, though
    public reporting remains partially disputed.
