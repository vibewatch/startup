      - number: '7.2'
        title: Regulatory, legal, and trust risks are unusually intertwined for a desktop-hardware company
        blocks:
          - type: paragraph
            body: >-
              Bambu’s January 2025 authorization-control episode turned a security update into a governance test. The
              official blog post made clear that critical printer operations—including print-job initiation, firmware
              upgrades, and certain LAN-mode actions—would require official authorization, and that unauthorized
              third-party software would be blocked from critical operations. Bambu later clarified that developer mode
              would keep MQTT, livestream, and FTP open for advanced users willing to accept reduced support. That
              clarification helped, but it did not erase the core signal: Bambu wants future printers to default toward
              controlled access, and its chosen compromise still leaves the company mediating how third-party tools
              connect to its ecosystem.

                          The legal layer makes that trust issue sharper. Bambu Studio and OrcaSlicer both sit on AGPL foundations, so the community expects openness around derivative workflows. Yet the 2026 OrcaSlicer fork dispute shows Bambu asserting terms-of-use, reverse-engineering, and authorization arguments around cloud-connected behavior on top of that open-source substrate. Parallel to this, Stratasys’s patent attack is not speculative theater; it targets core desktop-printing features and includes a U.S. import-ban vector. Add privacy obligations under China’s PIPL for cross-border or service-linked data handling, and Bambu starts to look like a company whose legal and reputational surfaces are much wider than its original hobbyist brand might suggest.
