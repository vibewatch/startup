chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, structure, and founding path
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab’s origin story is unusually coherent for a young hardware company. The company was founded in
              2020 by Ye Tao and other ex-DJI engineers after they spent roughly a year debating what category offered a
              credible path to becoming a world-class product business rather than a copycat manufacturer.
              LatePost-derived interviews translated on Bambu’s official forum, and republished in English by Call3D,
              describe the team rejecting many ideas before returning to desktop 3D printing because existing machines
              were too fragile, manual, and difficult for mainstream users. That framing is reinforced by Bambu’s own
              May 2022 team profile, which says the first five crew members used a three-day retreat to define the X1’s
              architecture around LiDAR, CoreXY motion, multicolor printing, and embedded software. Official commerce
              disclosures also reveal a multi-entity structure rather than a single plainly disclosed operating company:
              BAMBULAB LIMITED is listed as the Hong Kong head office, Maylerescape Limited as the EU operating and
              marketing office, and Shenzhen Tuozhu Technology as the brand registration owner. In practice, the report
              should treat Shenzhen as the operational center, Hong Kong as an administrative/holding location, and
              Bambu as a private, engineer-led consumer hardware company whose legal presentation is more
              commerce-oriented than investor-oriented.
