figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Bambu’s path from 2020 founding to 2026 unicorn recognition mixes stealth hardware execution, ecosystem build-out,
      and a visible 2025 policy backlash.
    data:
      items:
        - date: '2020'
          label: Founded
          detail: Ye Tao and ex-DJI colleagues commit to desktop 3D printing as the company’s category.
          tone: positive
        - date: 2020-Q4
          label: Stealth R&D starts
          detail: Team begins development in Shenzhen and optimizes for automated, consumer-friendly printing.
          tone: positive
        - date: '2022-05-19'
          label: First team profile
          detail: Bambu says the company has 150+ people and 120 in R&D.
          tone: positive
        - date: 2022-06
          label: First X1C shipped
          detail: Initial commercial launch follows roughly 22 months of development.
          tone: positive
        - date: '2023-06-26'
          label: First anniversary review
          detail: Bambu publicly reflects on support issues, logistics pain, and the need for stronger security.
          tone: neutral
        - date: '2025-01-16'
          label: Authorization control announced
          detail: Critical printer functions become auth-gated, igniting ecosystem backlash.
          tone: negative
        - date: '2025'
          label: MakerWorld breakout year
          detail: Company-reported stats point to 10M MAUs, 290M print hours, and 83% retention.
          tone: positive
        - date: '2026-06-25'
          label: Hurun unicorn recognition
          detail: Hurun names Bambu one of China’s new unicorns in the 2026 index.
          tone: positive
    approximationNotes: Quarter-level dates are used when the public source did not provide a precise day.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO014
      - CO016
      - CO020
      - CO030
      - CO033
