      - number: '5.4'
        title: Trust and compliance features are real, but so is closed-ecosystem risk
        blocks:
          - type: paragraph
            body: >-
              Bambu is not merely adding controls for cosmetic reasons. Official pages for the P1S and A1 mini
              explicitly reference EU RED Article 3.3 and ETSI EN 303 645 compliance, the Bambu Connect announcement
              frames authorization as a response to security concerns, and the support center documents remote control,
              live view, troubleshooting, release notes, and printer binding in a way that looks closer to a
              consumer-electronics software company than a garage-tool vendor. The community-maintained MQTT
              documentation also shows that there is real infrastructure underneath the cloud and LAN story; the company
              is not pretending the problem is trivial.

                          But the same features create product risk. Press and community sources show that the 2025 authorization-control rollout was read by many users as a lock-in move, not merely a hardening move. Critics objected to the need for Bambu Connect, the optional but unsupported developer mode, the effect on Panda Touch and OrcaSlicer workflows, and broader concerns around proprietary accessories, RFID-enabled material handling, and the legal posture toward open-source forks. The practical diligence conclusion is that Bambu’s trust story is two-sided: it can credibly market safety, security, and compliance to mainstream buyers, while simultaneously alienating the advanced users who amplify credibility inside the maker ecosystem.
