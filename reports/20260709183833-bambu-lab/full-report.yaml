  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Bambu’s customer journey runs from inspiration and printer selection into app usage, MakerWorld participation,
      repeat printing, and potential upsell into higher-end machines or print-farm behavior.
    data:
      nodes:
        - id: u1
          label: Discover Bambu
          description: Customer hears about the brand through media, friends, social feeds, or retail exposure
        - id: u2
          label: Compare families
          description: Buyer chooses between A, P, X, or H family based on skill and use case
        - id: u3
          label: Buy printer
          description: Purchase happens through DTC, Amazon, specialty retail, or other channels
        - id: u4
          label: Install app
          description: Owner downloads Bambu Handy for remote control and live view
        - id: u5
          label: Browse models
          description: MakerWorld or app browsing provides printable models and inspiration
        - id: u6
          label: First successful print
          description: Preset profiles and easy setup reduce early failure risk
        - id: u7
          label: Repeat printing
          description: Owner begins regular hobby, school, or side-business usage
        - id: u8
          label: Community participation
          description: User likes, shares, downloads, uploads, or comments inside the ecosystem
        - id: u9
          label: Consumables demand
          description: More printing creates filament, accessory, and AMS pull-through
        - id: u10
          label: Advanced workflow
          description: Power users add remote monitoring, farms, or multicolor setups
        - id: u11
          label: Hybrid upgrade path
          description: Some users graduate into H-series studio tools
        - id: u12
          label: Trust test
          description: Firmware, cloud policy, and support quality determine whether advocacy or backlash follows
    approximationNotes: >-
      The map blends consumer, prosumer, and creator loops into one journey to show where repeat behavior and backlash
      can both emerge.
