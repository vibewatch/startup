  - id: FV002
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull present-value bands for Bambu Lab under today’s public evidence set.
    data:
      items:
        - label: Bear
          low: 3500
          mid: 5000
          high: 6000
          detail: Hardware multiple compression, risk setbacks, or slower growth.
        - label: Base
          low: 6500
          mid: 8000
          high: 9000
          detail: Premium hardware-platform leader, but not fully software-multiple worthy yet.
        - label: Bull
          low: 10000
          mid: 12000
          high: 14000
          detail: Current rumor price only makes sense if ecosystem monetization and premium durability are sustained.
    approximationNotes: >-
      Values are current-value bands in USD millions and not precise fund-return forecasts because dilution and
      preference structure are not public.
    claimRefs:
