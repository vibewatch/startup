      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The key growth driver is the same theme repeated across almost every retained source: the capability once
              associated with expensive or fussy machines has dropped into consumer-electronics price points. CONTEXT,
              Mordor, and product reviewers all point to easier software, better automation, multicolor handling, and
              lower prices as the unlocks. For Bambu specifically, that has translated into category growth for
              entry-level and prosumer systems while more expensive professional systems get squeezed from below. Yet
              the market is not frictionless. Higher-end buyers still face capital-cost scrutiny, materials still fall
              short for some functional end-use cases, and IP or regulatory concerns matter when distributed
              manufacturing becomes easy. Trade policy also distorts behavior: CONTEXT’s Q1 2025 analysis explicitly
              said buyers rushed to purchase low-cost systems ahead of anticipated U.S. tariffs. On the industrial side,
              inflation, interest rates, and geopolitical conflict kept many capital budgets frozen through 2025. This
              means the desktop market can grow very fast without the whole additive-manufacturing stack moving in sync.
            claimRefs:
              - CM015
