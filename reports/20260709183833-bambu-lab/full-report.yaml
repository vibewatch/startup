  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape structure and direct peer set
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is best understood as a layered market rather than a flat brand list. Bambu,
              Creality, Elegoo, Anycubic, Flashforge, and Prusa occupy the consumer and prosumer FDM battlefield where
              price, speed, multicolor support, and ease of use matter most. UltiMaker, MakerBot, and Formlabs sit
              closer to professional, education, or specialized-technology workflows, while Stratasys/MakerBot and resin
              specialists remain important substitutes for some buyers even when they are not direct price-point peers.
              Current market data strongly favors Bambu’s slice of the landscape: by late 2025 and early 2026 the
              entry-level category was not only the fastest-growing price class, it was also highly concentrated around
              Chinese vendors. That concentration is what makes the competitor set asymmetric. Western players can still
              matter a great deal in classroom, open-source, or resin niches, but the category’s revenue and shipment
              momentum increasingly come from the ecosystem-led consumer hardware vendors, led by Bambu. Scale matters.
            claimRefs:
