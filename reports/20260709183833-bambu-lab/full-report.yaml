  - id: FM004
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      Consumer desktop adoption typically narrows from awareness to ownership to repeated production-style usage, with
      the last step most relevant for Bambu’s premium systems.
    data:
      items:
        - label: Awareness of 3D printing use cases
          value: 100
          detail: Broad interest driven by education, media, and social content.
        - label: First machine purchase
          value: 62
          detail: Enabled by falling prices and easier setup.
        - label: Successful first projects
          value: 48
          detail: Automation and software reduce dropout after unboxing.
        - label: Repeat weekly use
          value: 31
          detail: Users graduate into hobby, classroom, or prototyping routines.
        - label: Commercial or fleet-style usage
          value: 16
          detail: Print farms, side hustles, and small-batch local production create durable utilization.
    approximationNotes: >-
      Stage values are ordinal indices showing narrowing, not measured conversion rates. The value-chain logic is
      grounded in retained sources describing education, hobby, prototyping, and print-farm use cases.
    claimRefs:
      - CM025
      - CM026
      - CM028
      - CM029
