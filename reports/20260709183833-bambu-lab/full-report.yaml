      - number: '7.4'
        title: Mitigations exist, but investors still need crisp kill criteria and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the risk picture is that Bambu is not asleep. It documented the security rationale
              for authorization control, created a developer-mode escape hatch, ran a formal A1 recall with the CPSC,
              and publicized more of its security and cloud-control posture in 2026. Those are signs of
              institutionalization. But mitigation maturity is uneven. A recall playbook is not the same as low future
              failure rates. Developer mode is not the same as ecosystem trust. Security architecture is not the same as
              regulator-proof privacy operations. And active litigation is not the same as manageable litigation.

                          The right underwriting stance is therefore conditional. If the Stratasys matter evolves toward an injunction, import restriction, or a high-cost settlement that touches core printer features, that is thesis-damaging. If the company suffers another meaningful recall or a visible H-series reliability stumble, the “DJI-quality hardware culture” narrative weakens. If Bambu keeps alienating power users, creators, and tool developers, the brand may remain strong with casual buyers but lose part of the advocacy moat that accelerated its rise. Investors should track those monitorable triggers directly instead of treating risk as a hand-wavy discount rate.
