      - number: '3.4'
        title: Moat durability and who can actually hurt Bambu
        blocks:
          - type: paragraph
            body: >-
              No single rival attacks Bambu on every axis. Prusa is strongest on openness and community trust. Creality
              remains dangerous on scale and pricing breadth. Elegoo gains strategic interest because DJI-backed capital
              could accelerate its climb. Flashforge is a credible fast follower in multicolor FDM. UltiMaker, MakerBot,
              and Formlabs each defend niches where Bambu is less obviously superior: professional dual-material
              workflow, classroom safety and procurement packaging, and professional resin output. The most important
              question is therefore not whether any competitor can match one Bambu feature, but whether any can combine
              enough hardware, software, distribution, and community strength to narrow Bambu’s consumer-electronics
              lead. Today the answer appears to be “partially, but not fully.” Bambu still owns the most commercially
              attractive portion of the market, yet its policy controversies and closed-stack posture create a
              vulnerability that a better-trusted rival could exploit if hardware parity converges. The competitive
              bottom line is therefore not that Bambu is unassailable, but that each rival still attacks a narrower
              slice of the workflow than Bambu currently does. That keeps displacement risk real, yet fragmented.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP031
