      - number: '4.3'
        title: Profitability appears real, but capital adequacy and accounting quality remain the hard blockers
        blocks:
          - type: paragraph
            body: >-
              Public reporting increasingly portrays Bambu as profitable rather than capital-hungry. Multiple sources
              repeat net profit around RMB 2 billion, and both Fabbaloo and 36Kr-linked reports argue that such
              profitability gives the company unusual R&D freedom relative to other desktop-printer vendors. If those
              numbers are broadly right, Bambu is funding growth from operating earnings as much as from outside
              capital. That is important because it lowers obvious near-term financing dependency.


              But the chapter cannot underwrite balance-sheet risk from public evidence alone. No reviewed official page
              publishes audited financial statements, segment revenue, gross margin, operating cash flow, cash on hand,
              monthly burn, inventory turns, warranty reserve, or debt covenants. Financing disclosure is similarly
              noisy. Rumor-driven coverage repeatedly clusters around a Tencent-linked round and a valuation near $10
              billion, yet both Bambu and Tencent denied that the round had happened as reported. Older public reporting
              names investors such as 5Y Capital, Temasek, True Light Capital, and IDG-linked backers, but exact round
              sizes, dates, and current cap-table ownership remain only partially public. The right conclusion is
              therefore that Bambu probably has strong capital access, but the exact amount, cost, and necessity of
              external capital are still unverified.
