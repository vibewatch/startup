  - id: FE001
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Bambu’s workflow turns a model-discovery step into an increasingly integrated printer, material, monitoring, and
      community loop.
    data:
      nodes:
        - id: f1
          label: Discover model
          detail: User finds a file or inspiration inside MakerWorld or elsewhere
        - id: f2
          label: Choose printer profile
          detail: Preset profile or device selection matches X1, P1, A1, or H family
        - id: f3
          label: Slice in Studio
          detail: Bambu Studio prepares the job with first-party defaults and painting tools
        - id: f4
          label: Authenticate network path
          detail: User prints via cloud, authorized LAN mode, or developer-mode local route
        - id: f5
          label: Calibrate automatically
          detail: Printer uses leveling, cameras, lidar, or other sensors to reduce manual tuning
        - id: f6
          label: Load materials
          detail: AMS, AMS Lite, AMS 2 Pro, or direct feed handles material and color setup
        - id: f7
          label: Execute print
          detail: Hardware motion system and chamber controls run the job
        - id: f8
          label: Monitor remotely
          detail: Bambu Studio, app, or live view observe print progress
        - id: f9
          label: Swap or finish materials
          detail: Multi-material or support workflows complete with less manual intervention
        - id: f10
          label: Share outcome
          detail: User can upload results, profiles, or feedback back into the community
        - id: f11
          label: Repeat or upsell
          detail: Good outcomes drive repeat prints, consumables, AMS, or higher-tier printers
        - id: f12
          label: Expand workflow
          detail: Advanced users graduate into print farms or hybrid H-series fabrication
