      - number: '5.2'
        title: The technical architecture mixes open-source roots with a controlled networking layer
        blocks:
          - type: paragraph
            body: >-
              Bambu’s architecture has two distinct personalities. On the product-performance side, it looks
              aggressively user-friendly: high-speed motion systems, auto bed leveling, lidar or camera-based
              monitoring, AMS-assisted material switching, and slicer defaults that reduce the need for manual tuning.
              On the software side, Bambu Studio is explicitly open-source and the GitHub repository says it is based on
              PrusaSlicer, itself derived from the RepRap/Slic3r lineage. The same repository also makes the trade-off
              explicit: the networking plugin is optional and based on non-free libraries, which means the slicing front
              end is open while the richest cloud and network behaviors remain partly proprietary.

                          The networking stack shows why this matters. Community MQTT documentation describes both a cloud broker and a printer-local broker, while Bambu’s January 2025 Bambu Connect post says standard LAN mode now includes authorization, and developer mode can leave MQTT, livestream, and FTP open at the cost of unsupported security responsibility. That is a clear architectural choice: Bambu wants the convenience and security posture of a brokered, authenticated network layer, while advanced users want direct device control. The result is a product architecture that is technically sophisticated and commercially rational, but also unusually sensitive to community trust.
