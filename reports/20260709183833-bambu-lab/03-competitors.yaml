  evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-pricing-consistency
    missingEvidence: Normalized street pricing and channel discounting across all competitor models on one date.
    whyItMatters: Public product pages mix promo pages, enterprise positioning, and category pages, so price-to-performance comparisons remain imperfect.
    diligencePath: Snapshot reseller and direct-store pricing on the same day for representative SKUs in each segment.
    relatedQuestionRefs:
    - QP016
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-data
    missingEvidence: Measured churn, cross-shop behavior, or fleet migration data between leading desktop brands.
    whyItMatters: Switching-cost conclusions are currently structural and anecdotal, not cohort-based.
    diligencePath: Interview resellers, fleet operators, and community moderators or request platform migration data.
    relatedQuestionRefs:
    - QP023
    - QP025
  - type: missing-source
    severity: minor
    topic: stratasys-makerbot-overlap
    missingEvidence: A fresh Stratasys/MakerBot channel or product strategy update that cleanly separates enterprise and classroom motions.
    whyItMatters: MakerBot is included as a school-focused substitute, but the wider Stratasys umbrella is not deeply explored here.
    diligencePath: Fetch Stratasys investor or product materials in a future refresh.
    relatedQuestionRefs:
    - QP012
  - type: conflicting-data
    severity: minor
    topic: consumer-share-by-brand
    missingEvidence: One neutral source that publishes the same-period share for Bambu, Creality, Prusa, Elegoo, and Flashforge together.
    whyItMatters: Current competitive share data comes from a mix of CONTEXT and media summaries rather than one clean vendor league table.
    diligencePath: Acquire the full CONTEXT or AM Research brand-share table.
    relatedQuestionRefs:
    - QP001
    - QP021
  - type: private-evidence-only
    severity: material
    topic: rival-financial-health
    missingEvidence: Comparable margins, burn, and working-capital data for private rivals such as Prusa, Elegoo, and Flashforge.
    whyItMatters: The chapter can compare product and positioning better than underlying financial resilience.
    diligencePath: Request private financials or use credit / customs / supplier data in a future refresh.
    relatedQuestionRefs:
    - QP022
