- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Motion system
    - CoreXY or appliance-style gantry delivers speed and precision
    - Mechanical tuning, firmware, calibration sensors
    - Marketing speeds may overstate real-world across-print performance
  - - Calibration stack
    - Auto bed leveling, lidar, cameras, and printer-side logic reduce manual tuning
    - Sensors, firmware logic, user-environment quality
    - Failures or false detections can degrade trust quickly
  - - Material handling
    - AMS-family loading, switching, and drying systems reduce friction for multicolor work
    - RFID, feeders, sealed paths, and accessory availability
    - Increases ecosystem lock-in and replacement-part dependence
  - - Slicer layer
    - Bambu Studio creates, profiles, monitors, and can network print jobs
    - Open-source codebase plus optional networking plugin
    - Open-source lineage clashes with proprietary plugin boundaries
  - - Network layer
    - Cloud broker, LAN authorization, MQTT, livestream, FTP, developer mode
    - Bambu Connect, cloud auth, local codes, printer firmware
    - Cloud policy changes can break third-party workflows
  - - Community layer
    - MakerWorld supplies models and print profiles
    - Content moderation, profile quality, creator incentives
    - Community moat can turn into governance or copyright conflict
  - - Hybrid toolhead stack
    - H2D/H2C add dual nozzles, laser, blade, pen, cameras, and heaters
    - Extra sensors, safety systems, software modules
    - More capability also means more potential failure points
  - - Support layer
    - Release notes, troubleshooting, live view docs, printer binding, remote control help
    - Ongoing software and documentation maintenance
    - Thin or changing docs raise support burden for advanced users
  notes: Architecture rows combine official descriptions with community documentation and independent reviews; they are functional layers, not a literal schematic.
