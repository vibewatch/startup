    - Still depends on first-party software defaults
  - - Prosumer multicolor printing
    - Print faster with fewer manual swaps
    - X1 / P1 + AMS
    - Official multicolor workflow and community presets make multi-material more accessible
    - Waste, attach-rate economics, and proprietary dependency remain concerns
  - - Print-farm throughput
    - Run repeatable fleets with remote oversight
    - P1S / X1 + remote monitoring + local/cloud modes
    - Particle and official posts point to heavy print-farm usage and remote tooling
    - Authorization-control changes can disrupt established workflows
  - - Classroom or education creativity
    - Get students from model to object quickly
    - A-series + MakerWorld categories + quieter operation
    - Lower learning curve and education-facing content surfaces
    - Open-tooling educators may dislike cloud dependence
  - - Designer or engineer prototyping
    - Fast enclosed printer with better defaults
    - P1S or X1 with Bambu Studio
    - 500 mm/s class hardware and preset profiles shrink iteration time
    - Material/certification depth is still limited versus industrial tools
  - - Hybrid fabrication / maker studio
    - 3D print, laser cut, and plot on one machine
    - H2D / H2C plus Bambu Suite or Studio surfaces
    - One platform can replace multiple bench tools for some users
    - Not all hybrid functions are equally mature yet
