  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fleet-reliability-metrics
    missingEvidence: A public uptime, MTBF, or fleet failure-rate dataset by printer family.
    whyItMatters: Reviews and marketing copy suggest reliability, but underwriting product maturity is stronger with objective field metrics.
    diligencePath: Request internal reliability dashboards by printer family, warranty claims, and support-ticket rates.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE001
    - TE004
  - type: missing-source
    severity: material
    topic: data-retention-boundaries
    missingEvidence: A single public document that reconciles what data Studio, Connect, MakerWorld, and live view retain across cloud and LAN modes.
    whyItMatters: Privacy and enterprise trust questions cannot be fully closed while data handling remains fragmented across posts and support articles.
    diligencePath: Request the current data-flow map, retention schedule, and privacy design review from product and security teams.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
    - TE007
  - type: conflicting-data
    severity: minor
    topic: third-party-material-boundaries
    missingEvidence: A precise public statement distinguishing what is unsupported, what is technically blocked, and what merely loses convenience features in AMS workflows.
    whyItMatters: The difference between “closed ecosystem” and “preferred ecosystem” matters for antitrust, customer trust, and platform durability.
    diligencePath: Request an official compatibility matrix for third-party filament, AMS behavior, and network-plugin-independent workflows.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE008
  - type: missing-source
    severity: minor
    topic: hybrid-platform-maturity
    missingEvidence: Longer-horizon field data on H2D and H2C laser, cutting, and dual-nozzle reliability across months of use.
    whyItMatters: The hybrid-manufacturing thesis is compelling, but early review enthusiasm is not the same as mature field reliability.
    diligencePath: Request post-launch support metrics, return reasons, and firmware issue logs for H-series hybrid functions.
    relatedQuestionRefs:
    - QE006
    - QE021
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: makerworld-direct-monetization
    missingEvidence: A public explanation of how MakerWorld monetizes directly versus how it mainly lowers traffic cost and improves retention.
    whyItMatters: The software and community moat is clear, but its standalone economics remain under-described.
    diligencePath: Request product P&L or KPI snapshots for MakerWorld and creator incentive programs.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
