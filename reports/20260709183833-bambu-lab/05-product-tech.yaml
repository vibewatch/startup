- id: TE008
  title: Open versus closed ecosystem tension table
  columns:
  - Tension point
  - Evidence
  - Why users care
  - What would reduce the risk
  rows:
  - - Open-source slicer vs optional closed network plugin
    - BambuStudio GitHub states the slicer is AGPL while the networking plugin is non-free and optional
    - Users want rich features without surrendering protocol openness
    - Publish stable APIs or make the plugin boundary less contentious
  - - LAN mode vs authorization control
    - Official forum and blog posts describe authorization and developer mode
    - Advanced users want local autonomy and future-proof workflows
    - Keep LAN mode functional without degraded usability
  - - OrcaSlicer compatibility
    - Fabbaloo, 3D Printing Industry, and How-To Geek describe rejection of Bambu Connect or later legal fights
    - Third-party workflows amplify credibility in the maker ecosystem
    - Sustain direct, documented, and stable third-party access
  - - Accessory and protocol lock-in
    - Backlash coverage cites Panda Touch and API breakage
    - Users dislike losing freedom over hardware they already own
    - Offer migration periods and clearer protocol commitments
  - - RFID-enabled or tightly integrated material handling
    - PCMag praises RFID convenience while critics frame it as lock-in risk
    - Convenience can become dependence if third-party options narrow
    - Be explicit about support boundaries for third-party materials
  - - Community-governance control
    - MakerWorld growth and legal/copyright enforcement raise governance questions
    - A platform moat only helps if creators trust the rules
    - Clarify creator economics, licensing, and moderation processes
  notes: This table captures the product-governance tensions that arise specifically because Bambu’s integrated ecosystem is commercially effective.
