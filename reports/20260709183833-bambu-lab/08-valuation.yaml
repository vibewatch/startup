  - CV035
  - CV038
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Round confirmation and terms
    - Actual post-money valuation, investor list, liquidation preferences, and employee/common dilution
    - Return math is meaningless without knowing structure
    - Request data room cap table, term sheet, and board-approved financing summary
  - - Audited financial statements
    - Audited 2025 income statement, balance sheet, cash flow, and notes
    - Need to validate profit quality, working capital, and reserve adequacy
    - Request audited statements or audit-ready management accounts
  - - Recurring revenue mix
    - Consumables reorder rates, software or subscription revenue, marketplace take rates, and community monetization
    - Determines whether Bambu deserves a platform premium or just a hardware premium
    - Request segment revenue bridge and cohort reorder data
  - - Legal and tariff sensitivity
    - ITC exposure by product, settlement scenarios, tariff codes, and margin sensitivity
    - These are the fastest paths to multiple compression
    - Request counsel memo and sensitivity model
  - - Warranty and field quality
    - Return rates, failure rates, warranty reserve methodology, and H-series service burden
    - High quality is central to the bull thesis
    - Request quality dashboard and reserve schedules
  - - Geography and channel mix
    - Revenue split by China, North America, Europe, DTC, retail, and farms/business users
    - Needed to test durability and policy exposure
    - Request geography/channel cube with gross margin by region
  notes: These asks are the shortest path to moving the recommendation, positively or negatively.
  claimRefs:
