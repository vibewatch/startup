- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Bambu Lab (rumored round context)
    - 2025 revenue >CNY 10B and net profit ~RMB 2B; valuation widely discussed around $10B but publicly disputed
    - ~7.1x revenue and ~35.7x net profit at $10B
    - Direct anchor for current entry debate
    - Round terms, confirmation, and structure remain ambiguous
  - - Stratasys
    - July 2026 market cap ~$0.76B; 2025 revenue $551.1M
    - ~1.4x trailing revenue
    - Public additive peer with scale, materials, software, and services
    - Mature industrial peer, slower growth, and different end-market mix
  - - 3D Systems
    - July 2026 market cap ~$0.50B; 2025 revenue ~ $387M
    - ~1.3x trailing revenue
    - Public peer showing how weak sentiment can stay in additive manufacturing
    - Business under restructuring and not a close consumer-platform analog
  - - Materialise
    - July 2026 market cap ~$0.40B; 2025 revenue €267.6M (~$290M equivalent ballpark)
    - ~1.4x sales on rough USD conversion
    - Shows how software/medical/service mix still trades at a modest public multiple
    - FX and business mix reduce direct comparability
  notes: The public comp set does not prove Bambu should trade at 1–1.5x sales, but it does show how aggressive a 7x sales mark really is.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most useful publicly observable additive-manufacturing valuation anchors and Bambu’s own rumored price context; richer private comp data is limited and often stale.
