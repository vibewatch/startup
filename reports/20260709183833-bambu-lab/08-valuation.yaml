- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Bambu sustains category leadership, keeps taking share, preserves profitability, expands recurring ecosystem monetization, and avoids major legal or recall damage.
    - $10B–$14B current-value band can be defended if Bambu behaves more like a hardware-plus-platform compounder than like a premium printer OEM.
    - Requires unusually clean execution, stronger disclosure, and no major policy or IP shock.
    - Possible, but not yet fully proven by public evidence.
  - - Base
    - Bambu remains the leader, but growth moderates and investors apply a premium hardware multiple rather than a software-platform multiple.
    - $6.5B–$9.0B looks more consistent with strong fundamentals plus real opacity and risk discounts.
    - Can still compress if legal or tariff issues worsen.
    - Most evidence currently points here.
  - - Bear
    - Growth slows, risks bite, or the market re-rates Bambu closer to high-quality hardware peers.
    - $3.5B–$6.0B would reflect multiple compression toward strong-hardware-but-not-platform territory.
    - Market-share loss, import restriction, recall recurrence, or trust shock.
    - Not the base case, but very plausible if current narrative loses momentum.
  notes: These are present-value bands, not future exit targets, because dilution, preferences, and cap-table detail are not public.
