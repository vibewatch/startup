- id: thesis-premium-and-comp-set
  title: Bambu deserves a premium to public peers, but the gap is currently extreme
  body: "A premium to public additive peers is justified. Stratasys, 3D Systems, and Materialise are useful anchors because they show how the market prices established 3D-printing exposure, but none of them matches Bambu’s consumer speed, profitability narrative, or momentum in entry-level/prosumer systems. CONTEXT data cited by 3D Printing Industry and Tom’s Hardware shows Bambu reshaping the low end of the market and pulling demand away from higher-priced categories. MakerWorld usage, app activity, creator tools, and print-farm penetration all suggest a business that is broader than a one-time machine sale. In that sense, Bambu should not trade like a legacy public peer on 1–1.5x sales.\n\n            The problem is the size of the premium. Public comps cluster around low-single-digit revenue multiples even when they have meaningful software or service components, and some still generate losses or restructuring headlines. Bambu can reasonably argue that it is several years ahead on execution\
    \ and category energy, but a 7x revenue multiple is still five-plus turns above those comps. That gap would be easier to underwrite if public evidence showed a large recurring-software layer, audited free cash flow, or a clearly confirmed round with institutional terms. Today, it mostly shows that Bambu is an exceptional hardware winner being priced more like a platform company than like a hardware manufacturer."
