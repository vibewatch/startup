company:
  name: Bambu Lab
chapter:
  number: 8
  title: Valuation
  summary: 'Bambu Lab looks like one of the rare hardware startups that may deserve a real premium: it is profitable, category-leading, and increasingly platform-like. But the currently discussed ~$10B price still looks stretched against public additive-manufacturing comparables and too dependent on rumor-grade financing data, so the correct call is track rather than buy until price or disclosure improves.'
sections:
- id: valuation-context-and-multiple-math
  title: The central question is not company quality but what today’s rumored price already assumes
  body: "Bambu is easy to like and harder to price. On the positive side, few hardware startups have reached its combination of scale, profitability, and market-share leadership this quickly. Public reporting points to more than RMB 10 billion of 2025 revenue, roughly RMB 2 billion of net profit, over 1.2 million printers shipped, and global category share that is now large enough to force a structural reset in desktop 3D printing. On the negative side, the public valuation context is still messy. The market has mostly seen rumor, denial, and speculation around a Tencent-linked financing, not a clean priced round with full terms. That matters because valuation discipline becomes more important, not less, when the business is impressive.\n\n            At the often-cited ~$10 billion price, Bambu would sit at roughly 7.1x 2025 revenue and about 35.7x 2025 net profit. Those are not impossible multiples for a hypergrowth platform, but they are far above public additive-manufacturing trading\
    \ levels. The simplest way to think about the price is this: a $10B mark already assumes Bambu is not just a successful printer company, but a category-defining hardware-and-software ecosystem that can maintain superior growth, defend margin, and avoid the kinds of legal, quality, and policy setbacks that compress most hardware multiples. That may eventually prove right; current public evidence does not prove it cleanly enough yet."
