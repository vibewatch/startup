- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ITC or court loss
    - Import restriction, injunction, or expensive forced redesign touching core products
    - Would directly attack US availability and the clean-growth narrative
    - Pause or reset valuation case immediately
  - - Second serious recall / safety event
    - Broad product notice, injuries, or recurring electrical/thermal defect pattern
    - Would weaken the “premium quality” moat and hit margin via support/warranty costs
    - Move from track to avoid unless price resets hard
  - - Ecosystem trust collapse
    - Another major policy shock that drives creators, reviewers, or tool developers away
    - Would shrink the premium platform narrative toward plain hardware
    - Cut justified premium multiple
  - - Tariff step-up
    - Material incremental China-import burden without price pass-through
    - Would reduce hardware gross margin and cap valuation support
    - Lower fair-value band
  - - Growth deceleration with no recurring monetization proof
    - Market-share gains stall while revenue mix stays mostly hardware
    - Would undermine the software-platform premium case
    - Re-rate toward premium hardware, not platform, multiples
  notes: These triggers come from the risk chapter but are restated here because valuation is only as strong as its fragility analysis.
  claimRefs:
