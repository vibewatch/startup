- id: diligence-gaps-and-exit-readiness
  title: A better price or better disclosure would move the call faster than more storytelling
  body: "The most important missing pieces are not philosophical; they are mechanical. Investors still need the actual round terms, whether Tencent really participated, what liquidation preferences or structure exist, how much recurring consumables and software revenue exists, what warranty and recall reserves look like, and how sensitive margin is to tariffs or litigation outcomes. None of those items is fatal to the company, but all of them are fatal to precise return underwriting if left unanswered. That is why the appropriate confidence level is only medium despite Bambu’s obvious operating strength.\n\n            Exit readiness is therefore conditional. If the company can confirm a cleaner cap table, show audited statements, document sustained profitability, and prove that MakerWorld and consumables create durable repeat economics, investors could justify paying far more than public-peer multiples. If instead the next evidence shows continued rumor ambiguity, legal overhang, or weaker-than-expected\
    \ recurring economics, then the current valuation conversation is ahead of the facts. The fastest way to improve the recommendation is either to lower the entry price or to raise the evidence quality."
