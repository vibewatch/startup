- id: TV008
  title: Public-peer quality and margin check table
  columns:
  - Comparable
  - Latest operating signal
  - What it says about the sector
  - Read-through for Bambu
  rows:
  - - Stratasys
    - Q1 2026 revenue of $132.7M, tariff drag, and low-margin outlook despite no debt and strong cash
    - Public additive investors remain skeptical even when balance sheets are decent
    - Bambu should not assume the market will overlook tariffs or cyclical margin pressure forever
  - - 3D Systems
    - 2025 revenue down 12.1%; 2026 Q1 revenue only modestly above prior year with concentrated-customer risk still visible
    - Turnarounds can stay cheap for a long time in additive manufacturing
    - Bambu’s premium is real, but so is the risk of public-market multiple compression
  - - Materialise
    - 2025 revenue up 0.3% with Q1 2026 stable and profitable, yet valuation remains modest
    - Better software/medical mix helps quality but not enough to create huge public multiples
    - Even strong execution does not automatically create software-like public valuation
  - - Bambu versus peers
    - Faster growth, clearer consumer pull, and stronger profitability narrative than all three public anchors
    - Explains why Bambu deserves a premium
    - Does not prove the current premium is fully justified
  notes: The table is not about saying Bambu equals legacy peers; it is about showing what the broader market pays for adjacent exposure.
