tables:
- id: TM001
  title: Market definition table
  columns:
  - market layer
  - included spend
  - excluded spend
  - why it matters for Bambu
  rows:
  - - Broad global 3D printing TAM
    - Hardware, materials, software, services across industrial and desktop segments
    - None; this is the widest public lens
    - Useful macro context but too broad for direct Bambu underwriting
  - - Desktop 3D printing market
    - Desktop hardware plus related desktop use cases across prototyping, education, and healthcare
    - Industrial >$100K systems and large service-bureau economics
    - Closest public market lens for Bambu hardware
  - - Entry-level consumer/pr prosumer hardware
    - Printers below roughly $2,500 and adjacent use cases such as home, school, and small print-farm adoption
    - Industrial and much of professional resin/metal spend
    - Fastest-growing revenue pool for Bambu
  - - Bambu ecosystem wedge
    - Printers plus Bambu Studio, Bambu Handy, MakerWorld, accessories, and content flywheel
    - Third-party industrial software and high-end metal systems
    - Best reflects how Bambu monetizes beyond unit sales
  - - Status-quo substitutes
    - Manual fabrication, outsourced prototyping, CNC/laser workflows, traditional manufacturing for scale
    - Direct printer-to-printer competition only
    - Explains why ease of use and speed matter more than specs alone
  - - Adjacencies
    - Education tools, creator economy, print farms, small-batch local production
    - Industrial aerospace/medical implants at scale
    - Shows how Bambu can expand without becoming an industrial OEM
  notes: The chapter intentionally separates the broad additive-manufacturing TAM from the narrower desktop and entry-level wedges that better map to Bambu.
