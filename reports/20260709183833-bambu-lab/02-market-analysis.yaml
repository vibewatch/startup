- id: TM004
  title: Growth drivers and constraints table
  columns:
  - factor
  - type
  - evidence
  - impact on adoption
  rows:
  - - Falling hardware prices
    - driver
    - Entry-level systems under $2,500 are now good enough for serious use
    - Expands buyer pool
  - - Plug-and-play software and automation
    - driver
    - Auto-leveling, multicolor, app workflows, and better slicers reduce setup pain
    - Raises conversion and retention
  - - STEM / education adoption
    - driver
    - Mordor and Xinhua both highlight education as a major use path
    - Creates durable pipeline of new users
  - - Rapid prototyping ROI
    - driver
    - Design teams shorten iteration cycles with desktop printers
    - Supports SME and professional demand
  - - Print-farm local production
    - driver
    - CONTEXT explicitly cites print farms as a demand vector
    - Creates quasi-commercial fleet demand
  - - Capital cost / budget scrutiny
    - constraint
    - Higher-end systems remain harder to justify in a tight macro environment
    - Slows professional and industrial recovery
  - - Material-performance limits
    - constraint
    - Desktop systems are still not ideal for every functional end-use part
    - Keeps substitutes relevant
  - - IP / regulatory concerns
    - constraint
    - Distributed manufacturing raises copying and compliance issues
    - Can slow enterprise adoption
  - - Tariffs / trade barriers
    - constraint
    - CONTEXT says buyers pulled purchases forward ahead of U.S. tariff fears
    - Creates volatile quarter-to-quarter demand
  - - Supply chain / e-waste / components
    - constraint
    - Mordor notes electronics bottlenecks and environmental regulation pressure
    - May compress margins and availability
  notes: This register mixes macro factors and workflow-specific barriers because both matter to a desktop category still shifting from hobbyist to mainstream use.
