- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - primary use case
  - budget logic
  - fit for Bambu
  rows:
  - - Home hobbyists
    - Individual maker / household
    - DIY, collectibles, repairs, creativity
    - Personal discretionary spend
    - Very strong; ease of use and multicolor matter
  - - Education / STEM
    - Schools, teachers, labs
    - Project-based learning and prototyping
    - Departmental or school equipment budgets
    - Strong; Bambu explicitly markets education
  - - Side-hustle sellers / print farms
    - Small operators and entrepreneurs
    - Batch production of custom goods
    - Capex paid back through local production volume
    - Strong and rising according to CONTEXT
  - - Design / engineering teams
    - SMEs or corporate product teams
    - Rapid prototyping and iteration
    - Tooling / design budget
    - Moderate to strong for desktop workflows
  - - Detail-focused professional users
    - Studios, dentists, resin specialists
    - High-detail parts and models
    - Professional equipment budgets
    - Mixed; resin specialists can substitute away
  - - Enterprise industrial buyers
    - Aerospace, defense, 3C, medical manufacturing
    - Production-scale additive manufacturing
    - Capex-heavy industrial budgets
    - Low direct fit; mostly outside Bambu’s core wedge
  notes: The same user can move between hobby, side-hustle, and professional use over time; Bambu’s value is strongest where setup friction and iteration speed matter.
