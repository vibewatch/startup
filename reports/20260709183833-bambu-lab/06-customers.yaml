tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof of activity
  - Strategic value
  - Gap
  rows:
  - - Beginners and casual hobbyists
    - Buyer=user=payer=individual consumer
    - Low-friction first printer and household creativity
    - A1 mini app-store surfaces, MakerWorld, and consumer review coverage
    - Expands total funnel and app/community usage
    - No disclosed conversion from beginner purchase to long-term high-value cohort
  - - Prosumer makers
    - Buyer=user=payer=individual enthusiast or semi-professional maker
    - Faster multicolor printing and better defaults
    - X1/P1 review comparisons, MakerWorld activity, app control surfaces
    - Core brand advocates and premium-margin buyers
    - No disclosed ARPU by printer family
  - - Print farms and side-business operators
    - Buyer=user=payer=small operator or maker business
    - Repeatable fleet production and remote oversight
    - P1S page says trusted by professional print farms; official forum addresses print-farm owners
    - High-usage installed-base and strong consumables demand
    - No public fleet count, churn, or revenue share
  - - Educators and institutions
    - Buyer=payer=school, lab, club, or instructor; users=students and teachers
    - Project-based learning and maker access
    - MakerWorld includes education category; A-series usability lowers classroom friction
    - Broadens adoption and brand familiarity early
    - No public institution count or procurement history
  - - Designers and creators
    - Buyer=user=payer=designer or maker creator
    - Upload, share, iterate, and monetize model ideas
    - MakerWorld creator counts and model volumes
    - Supplies the community moat and content inventory
    - Creator earnings distribution and retention are undisclosed
  - - Workshop or studio users
    - Buyer=user=payer=advanced hobby studio or small workshop
    - Hybrid fabrication beyond pure FDM
    - H2D/H2C reviews and official positioning
    - Opens higher-value workflow expansion
    - Installed base is early and still maturing
  - - Retail shoppers
    - Buyer=user=payer=consumer through Amazon, Micro Center, or DTC
    - Buy ready-to-ship printers and accessories
    - Amazon and Micro Center surfaces plus Tom’s market-share article
    - Scales beyond niche forums into mainstream commerce
    - No channel mix or repeat-purchase split disclosed
  notes: Segments overlap; the point is to map buyer-user-payer roles and usage patterns visible in public evidence rather than to force a clean internal CRM taxonomy.
