  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: A segment-by-segment and geography-by-geography revenue mix with top-customer exposure where relevant.
    whyItMatters: Without concentration data, investors cannot tell whether the visible engagement base maps cleanly to diversified revenue.
    diligencePath: Request revenue and gross margin by customer segment, region, and top-customer cohort.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU005
    - TU008
  - type: missing-source
    severity: material
    topic: clean-customer-count
    missingEvidence: A current active-printer or active-paying-customer count rather than only community-user and print-hour metrics.
    whyItMatters: Usage and MAU data are helpful, but they are not a substitute for installed-base or account-level counts.
    diligencePath: Request active-printer counts, active linked app accounts, and monthly transacting customer totals.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: segment-retention-math
    missingEvidence: Cohort retention by revenue, consumables reorder rates, and repeat-printer purchase curves by segment.
    whyItMatters: High community retention does not automatically prove strong economic retention across every cohort.
    diligencePath: Request GRR/NRR-style proxies, consumables reorder dashboards, and repeat-purchase data for major cohorts.
    relatedQuestionRefs:
    - QU013
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: education-and-institution-counts
    missingEvidence: A public count of schools, labs, libraries, or institutions using Bambu printers.
    whyItMatters: Education may be strategically important even if it is not yet a major revenue driver.
    diligencePath: Request institutional-customer counts, reseller program data, and regional education case studies.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU001
    - TU007
  - type: conflicting-data
    severity: minor
    topic: power-user-versus-mainstream-balance
    missingEvidence: A clean split between mainstream owners and high-intensity print-farm or side-business users within the headline print-hour metrics.
    whyItMatters: A tiny cohort of extreme users can distort platform-usage statistics if not separated from the broad installed base.
    diligencePath: Request distribution curves for print hours and active usage by cohort type.
    relatedQuestionRefs:
    - QU008
    - QU021
    relatedTableRefs:
    - TU002
    - TU005
