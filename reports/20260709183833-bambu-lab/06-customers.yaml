- id: channels-geography-and-public-customer-proof
  title: Public proof skews toward retail and community surfaces rather than named enterprise accounts
  body: "Bambu’s public customer proof is unusually strong for a consumer hardware company, but it is mostly marketplace and community proof rather than named-enterprise proof. Amazon search results, Micro Center search results, and Tom’s Hardware’s market-share coverage all show that the company has moved well beyond a DTC-only enthusiast brand. BigGo’s long-form writeup describes a dual-channel strategy through the DTC site and Amazon plus offline stores, which fits the idea that Bambu is widening its customer acquisition channels as the category mainstreams. Tom’s Hardware goes further by saying Bambu overtook Creality in 2025 entry-level shipments and captured 37% of the sub-$2,500 segment.\n\n            Geography is also broader than China alone. Europe shows up in 3Druck-style channel stories and in the global app-store footprint, while North America is visible through retail search surfaces and English-language media traction. But this is still not the same thing as a clean geographic\
    \ revenue split. Public evidence can prove a lot about where customers are showing up and how they buy, yet it still does not reveal the share of active accounts by region, cohort, or buyer type. That is the difference between strong customer proof and full customer-underwriting transparency."
  claimRefs:
