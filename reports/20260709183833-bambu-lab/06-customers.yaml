- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - MakerWorld community growth
    - No public split between owners, non-owners, and low-value browsers
    - Can overstate monetizable customer breadth
    - Request active-owner ratio and model-to-print conversion data
  - - Retail-channel expansion
    - Channel sell-through could be concentrated in a few flagship SKUs or regions
    - Makes revenue more sensitive to promo cycles and reseller relationships
    - Request sell-through by channel and top-region contribution
  - - Print-farm usage
    - Power users may drive outsized print hours without representing a broad customer base
    - Can distort usage metrics upward if a small cohort dominates activity
    - Request print-hour distribution by user cohort
  - - Institutional / education adoption
    - Education category visibility is not the same as real classroom deployment
    - Can mislead on non-consumer penetration
    - Request school, library, and institution account counts
  - - Hybrid H-series expansion
    - Advanced workshop buyers may be smaller and more demanding than the core hobbyist base
    - Could increase support burden faster than customer count
    - Request H-series return, warranty, and activation data
  - - Community backlash risk
    - Advanced users who shape reputation may churn faster than casual owners
    - Could weaken the broader trust moat even if total unit sales remain strong
    - Track forum sentiment, refunds, and third-party-tool usage trends
  notes: This table focuses on where great usage metrics can still hide commercial concentration or reputation fragility.
  claimRefs:
