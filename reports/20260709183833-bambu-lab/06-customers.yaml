  - CU045
- id: TU006
  title: Community and channel evidence table
  columns:
  - Evidence surface
  - What it shows
  - Segment signal
  - Limitations
  rows:
  - - Bambu Handy iOS / Android
    - Owners remotely control printers, view live feeds, browse MakerWorld, and troubleshoot inside the app
    - Installed-base engagement and cross-platform reach
    - App copy and ratings do not equal paid conversion data
  - - Forum home
    - Separate sections for H, X, P, A, AMS, software, MakerWorld, and community meetings
    - Broad active owner base across product families
    - Forum activity can skew toward problems
  - - Forum latest topics
    - Current July 2026 posts on H2C slicing, AMS feed issues, firmware bugs, and print quality
    - Shows live day-to-day use of the machines
    - A support forum is not a random sample of all users
  - - Amazon search surface
    - Bambu-branded items visibly sell in mainstream ecommerce
    - Accessible mass-market discovery channel
    - Search results do not reveal sales volume or repeat purchase
  - - Micro Center search surface
    - Bambu products are sold in a US specialty retail channel
    - Physical retail availability beyond DTC
    - Search visibility is not the same as store sell-through
  - - Tom’s Hardware market-share coverage
    - Bambu led entry-level shipments in 2025 and held 37% of the sub-$2,500 segment
    - Confirms mass-market uptake, not just community buzz
    - Entry-level dominance is not the same as full-customer-profit mix
  notes: Channel and community surfaces are imperfect, but taken together they provide unusually strong public adoption proof for a private hardware company.
