- id: durability-and-customer-risks
  title: Durability looks promising, but trust and concentration questions remain open
  body: "The most constructive retention signal is that Bambu’s community and print behavior do not look one-and-done. 3D Printing Industry cites an 83% one-year continuation rate for downloading and printing, while app-store descriptions center persistent behaviors like remote monitoring, saved prints, learning resources, and MakerWorld discovery. These are all features that matter more after purchase than before it. The official forum also shows a live installed base dealing with firmware, AMS, print quality, and H-series questions in real time, which is a good sign for installed-base breadth even when the content is negative.\n\n            But customer risk is real. The 2025 authorization-control controversy showed that Bambu can alienate precisely the advanced users who most influence reputation, troubleshooting culture, and third-party ecosystem development. Independent coverage framed the change as a lock-in risk, and forum traffic shows the complaints did not vanish. Concentration\
    \ risk is harder to quantify because Bambu does not disclose top-customer exposure, geography mix, classroom penetration, or the split between hobbyist and business revenue. So the customer verdict is attractive but incomplete: strong usage, clear community gravity, and broad channel reach, yet still no clean answer on revenue concentration or how much backlash could translate into churn among vocal power users."
