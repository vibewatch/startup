company:
  name: Bambu Lab
chapter:
  number: 6
  title: Customers
  summary: 'Bambu Lab’s customer proof is broad, global, and usage-heavy rather than enterprise-account-specific: app surfaces, MakerWorld metrics, retail channels, and active community forums all show a large installed base spanning hobbyists, prosumers, print farms, classrooms, and small business makers. The strongest durability evidence is behavioral—millions of community users, hundreds of millions of print hours, app-based remote control, and heavy weekly printing—while the biggest gaps are classic private-company ones: no clean customer count, no cohort retention by revenue, no concentration disclosure, and no audited geography split.'
sections:
- id: segments-and-user-roles
  title: The customer base is wider than hobbyists and includes several overlapping user roles
  body: "Bambu’s customer map is best described as a layered consumer-prosumer ecosystem. The core audience is still hobbyists and serious makers, but official product and app pages show that the company is deliberately serving at least four adjacent groups: beginners who want low-friction setup, advanced users who care about multicolor or material flexibility, print-farm operators who need repeatability and remote monitoring, and institutions or educators that benefit from turnkey workflows and model libraries. The Bambu Handy app description is revealing because it explicitly speaks to experts, hobbyists, and newcomers in the same breath while tying remote control, live view, troubleshooting, and MakerWorld discovery into one user experience.\n\n            Product positioning reinforces the segmentation. The A-series reduces complexity for entry users, the P1S page explicitly invokes print farms, the X1 family remains the premium prosumer flagship, and the H2D expands into a higher-end\
    \ studio or workshop user that wants more than filament printing alone. None of that proves revenue by segment, but it clearly shows Bambu is not only selling to tinkerers on weekends. It is building a customer stack that spans creativity, side-business production, and increasingly semi-professional workflows."
  claimRefs:
