- id: TU007
  title: Geographic and route-to-market map
  columns:
  - Geography / route
  - Visible proof
  - Customer implication
  - Gap
  rows:
  - - China domestic base
    - MakerWorld activity, BigGo reporting, and national attention around the brand
    - Still likely the largest single-country installed base and culture center
    - No clean revenue split by region
  - - North America
    - Amazon and Micro Center surfaces plus English-language app-store footprint
    - Strong availability for mainstream hobbyists and prosumers
    - No disclosed active-account count
  - - Europe
    - Global app stores, English-language media, and active forum participation suggest broad reach
    - Meaningful cross-border adoption outside China
    - No country-by-country sales data
  - - Direct-to-consumer web
    - BigGo says DTC remains core for brand and user operations
    - Higher-margin first-party acquisition and data ownership
    - DTC share of revenue is undisclosed
  - - Amazon and third-party retail
    - Amazon and Micro Center visibly carry Bambu products
    - Improves convenience and mass reach
    - Channel margin and reseller concentration are not public
  - - Offline stores
    - BigGo says Bambu is opening flagship stores in major Chinese cities
    - Adds experiential acquisition and brand presence
    - Store-level economics and customer mix are not public
  notes: The map is directional; public evidence proves route diversity more clearly than exact regional economics.
