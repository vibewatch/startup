- id: TU008
  title: Adverse sentiment and trust-friction table
  columns:
  - Issue
  - Public evidence
  - Customer risk
  - Diligence ask
  rows:
  - - Authorization control backlash
    - 3D Printing Industry, 3Dnatives, and How-To Geek all document customer anger and open-source criticism
    - Can push advanced users to alternatives or reduce advocacy
    - Request refund rates, churn by firmware cohort, and support-volume impact
  - - Cloud and privacy concern
    - Independent coverage says some users fear reduced autonomy and more data dependence
    - Could slow institutional or privacy-sensitive adoption
    - Request privacy-retention summaries and enterprise objections logged by sales
  - - Third-party tool disruption
    - Coverage of Panda Touch and OrcaSlicer friction shows workflow breakage risk
    - Can alienate print farms and power users who amplify community sentiment
    - Request adoption share of third-party workflows before and after policy changes
  - - Forum-visible frustration
    - Latest and language-specific forum sections include complaints about updates, AMS feed issues, and firmware bugs
    - Shows real-world support burden and reputational drag
    - Request support-ticket resolution times and repeat-defect rates
  - - Lack of concentration disclosure
    - Bambu does not publicly separate hobbyists, creators, print farms, or institutions by revenue
    - Could hide reliance on a narrow high-usage cohort
    - Request revenue mix by segment, geography, and channel
  - - No public account-level retention math
    - High app and community engagement may still mask uneven economic retention
    - Difficult to translate enthusiasm into revenue durability
    - Request repeat-printer purchase, consumables reorder, and GRR/NRR proxies
  notes: Adverse customer evidence matters here because Bambu’s reputation with power users influences the wider ecosystem far beyond their direct revenue share.
