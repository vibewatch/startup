- id: milestones-controversy-and-open-gaps
  title: Milestones, controversy, and the main diligence gaps
  body: 'Bambu’s corporate narrative is powerful, but it is not risk-free. The clearest adverse event in the public record is the January 2025 authorization-control change. Bambu’s own post makes clear that print initiation, firmware upgrades, motion control, remote video, and other critical operations became authorization-gated, with future models expected to ship this way by default. Independent coverage then documented backlash from users who believed the change tightened cloud dependence, reduced third-party freedom, and deepened the company’s closed ecosystem. Bambu softened the immediate operational impact by allowing SD-card printing, older firmware, and a Bambu Connect bridge for some workflows, yet the incident still matters: it showed how quickly product-security decisions can turn into governance and community trust issues for a company whose ecosystem increasingly depends on first-party software and services. The other major limitation is disclosure. Official sources reviewed
    here do not provide headcount, audited financials, or a clean board/governance roster, and even some of the most widely repeated scale and valuation numbers still route through translated Chinese reporting rather than directly released investor materials. That leaves Bambu looking impressive on execution, but still somewhat opaque on structure and finance.'
