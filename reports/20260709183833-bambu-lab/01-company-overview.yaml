  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding-round-terms
    missingEvidence: Exact size, close date, instrument terms, and investor allocations for the Tencent-linked late-stage round.
    whyItMatters: Valuation and dilution analysis remain approximate until the actual round mechanics are public or privately diligenced.
    diligencePath: Request the term sheet, cap-table waterfall, and board consent package directly from the company or lead investor.
    relatedQuestionRefs:
    - QO020
    - QO024
  - type: conflicting-data
    severity: material
    topic: valuation-conflict
    missingEvidence: Primary confirmation resolving the ~$10B rumor versus the KrASIA/36Kr English USD 100B outlier.
    whyItMatters: Using the wrong valuation anchor would distort both the financials and valuation chapters.
    diligencePath: Obtain the primary 36Kr Chinese article or direct investor confirmation and reconcile translation differences.
    relatedQuestionRefs:
    - QO020
    - QO023
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and executive org chart beyond the founder trio.
    whyItMatters: Key-person risk and governance quality cannot be fully assessed from product and media pages alone.
    diligencePath: Request board materials, management bios, and corporate governance summaries from the company.
