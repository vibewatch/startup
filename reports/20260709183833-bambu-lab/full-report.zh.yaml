      - number: '1.3'
        title: 规模指标、融资叙事与独角兽认定
        blocks:
          - type: paragraph
            body: >-
              Bambu 现在释放出的规模信号，已经超过多数桌面打印机公司历史上能达到的水平。基于 Bambu 自有数据的独立报道称， 公司在 2025 年入门级出货量上超过 Creality；按 CONTEXT
              口径，公司拿下 $2,500 以下市场 37% 份额。 创作者生态指标也说明，用户基数已经大到足以支撑有意义的经常性软件和商业行为。融资披露则模糊得多。Call3D 转载的 LatePost 访谈称 IDG
              支持了三轮融资，且 Bambu 异常快速地实现盈利，这与公司稀疏的公开募资轨迹相吻合。 由传闻驱动的融资报道，在方向上都指向一轮由 Tencent 参与的后期融资和约 USD 10 billion
              的估值，但并未完全坐实： Fabbaloo 引用 36Kr 给出该数字，而 KrASIA/36Kr English 又出现一个明显异常的 USD 100 billion，本报告不采信。 可以确定的是，Hurun
              Global Unicorn Index 2026 已将 Bambu 列为新增中国独角兽；也就是说，即便具体融资机制仍不透明，
              公司已经跨过外部象征门槛。强增长、盈利报道和有限披露的组合很有吸引力，但也意味着后续财务和估值章节必须非常仔细地区分硬证据和传闻。
