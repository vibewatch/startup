  - id: TV005
    title: 论点破裂与止损触发器表
    columns:
      - 触发器
      - 阈值
      - 传导到论点
      - 行动含义
    rows:
      - - ITC 或法院败诉
        - 进口限制、禁令，或触及核心产品、代价高昂的被迫重设计
        - 会直接攻击美国可得性和干净增长叙事
        - 立即暂停或重置估值案例
      - - 第二次严重召回 / 安全事件
        - 大范围产品通知、伤害，或反复出现电气 / 热缺陷模式
        - 会削弱“高端品质”护城河，并通过支持 / 保修成本冲击利润率
        - 除非价格大幅重置，否则从跟踪转为回避
      - - 生态信任崩塌
        - 又一次重大政策冲击，导致创作者、评测者或工具开发者离开
        - 会把高溢价平台叙事压回普通硬件
        - 下调合理溢价倍数
      - - 关税上台阶
        - 中国进口负担实质增加，且无法转嫁价格
        - 会降低硬件毛利率，并压住估值支撑
        - 下调公允价值区间
      - - 增长减速，且经常性变现尚未跑出证据
        - 市占率提升停滞，收入结构仍主要靠硬件
        - 会削弱软件平台溢价逻辑
        - 估值重回高端硬件倍数，而非平台倍数
    notes: 这些触发因素来自风险章节；这里重述，是因为估值能否站住脚，取决于脆弱性分析是否经得起检验。
    claimRefs:
      - CV030
      - CV031
      - CV035
      - CV038
      - CV044
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 融资轮次确认与条款
        - 实际投后估值、投资人名单、清算优先权，以及员工 / 普通股稀释
        - 不知道结构，回报测算没有意义
        - 索取数据室股权结构表、条款清单和董事会批准的融资摘要
      - - 经审计财务报表
        - 经审计的 2025 年利润表、资产负债表、现金流量表及附注
        - 需要验证利润质量、营运资本和准备金充足性
        - 索取审计报告，或已按审计口径准备的管理账
      - - 经常性收入结构
        - 耗材复购率、软件或订阅收入、市场抽成率和社区变现
        - 决定 Bambu 配得上平台溢价，还是只能拿硬件溢价
        - 索取分部收入桥接和分群复购数据
      - - 法律与关税敏感性
        - 按产品拆分的 ITC 敞口、和解情景、关税编码和利润率敏感性
        - 这些是估值倍数压缩最快的通道
        - 索取律师备忘录和敏感性模型
      - - 保修与现场质量
        - 退货率、故障率、保修准备金方法，以及 H 系列服务负担
        - 高质量是多头逻辑的核心
        - 索取质量看板和准备金明细表
      - - 地域和渠道结构
        - 按中国、北美、欧洲、DTC、零售、打印农场 / 商业用户拆分的收入
        - 用来检验耐久性和政策敞口
        - 索取地域 / 渠道数据立方，并按地区列示毛利率
    notes: 这些问题是推动建议上调或下调的最短路径。
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV039
      - CV044
  - id: TV007
    title: 估值测算桥接表
    columns:
      - 输入
      - 数值
      - 来源依据
      - 含义
    rows:
      - - 传闻参考估值
        - ~$10.0B
        - Fabbaloo / 3Druck / 更广泛传闻集
        - 这是多数人做回报测算时默认的标价
      - - 2025 年收入锚点
        - ~$1.4B 等值
        - 公开报道称收入约 CNY 10B+
        - 决定隐含收入倍数
      - - 2025 年净利润锚点
        - ~$280M 等值
        - 公开报道称净利润约 RMB 2B
        - 决定隐含盈利倍数
      - - 隐含收入倍数
        - ~7.1x
        - 简单按当前估值计算
        - 相比上市增材制造同业偏贵
      - - 隐含净利润倍数
        - ~35.7x
        - 简单按当前估值计算
        - 偏高；但如果之后证明平台经济性可持续，也不离谱
      - - 上市同业收入倍数区间
        - ~1.3x–1.5x 销售额
        - CompaniesMarketCap + Stratasys、3D Systems、Materialise 的收入来源
        - 显示 Bambu 已经拿到多少溢价
    notes: 桥接表刻意做得简单透明，因为真正的问题在证据质量，不在表格复杂度。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV011
      - CV014
      - CV017
  - id: TV008
    title: 上市同业质量与利润率校验表
    columns:
      - 可比公司
      - 最新经营信号
      - 对行业的说明
      - 对 Bambu 的映射
    rows:
      - - Stratasys
        - 2026 Q1 收入 $132.7M；无债务、现金强劲，但关税拖累、利润率展望偏低
        - 即使资产负债表不错，上市增材制造投资者仍然谨慎
        - Bambu 不能假设市场会永远忽略关税和周期性利润率压力
      - - 3D Systems
        - 2025 年收入下滑 12.1%；2026 Q1 收入仅略高于上年，客户集中风险仍然可见
        - 增材制造里的扭亏 / 转型标的可以长期便宜
        - Bambu 的溢价真实存在，上市市场倍数压缩风险也同样真实
      - - Materialise
        - 2025 年收入增长 0.3%，2026 Q1 稳定且盈利，但估值仍然不高
        - 更好的软件 / 医疗结构能提升质量，但不足以撑起很高的上市倍数
        - 即便执行强，也不会自动换来软件式公开市场估值
      - - Bambu 与同业对比
        - 增长更快、消费端拉力更清晰、盈利能力叙事强于上述三家上市锚点
        - 解释了为什么 Bambu 应获得溢价
        - 但不能证明当前溢价已经完全合理
    notes: 这张表不是在说 Bambu 等同于传统同业；它展示的是，更广泛市场愿意为相邻敞口支付什么价格。
    claimRefs:
      - CV012
      - CV013
      - CV015
      - CV016
      - CV017
      - CV021
      - CV031
      - CV032
      - CV033
      - CV034
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Bambu 从 2020 年创立走到 2026 年获独角兽认可，靠的是隐身期硬件执行和生态搭建，也遭遇了 2025 年清晰可见的政策反弹。
    data:
      items:
        - date: '2020'
          label: 创立
          detail: Ye Tao 和前 DJI 同事把桌面 3D 打印定为公司的主攻品类。
          tone: positive
        - date: 2020-Q4
          label: 隐身研发启动
          detail: 团队在深圳启动开发，围绕自动化、消费者友好的打印体验优化。
          tone: positive
        - date: '2022-05-19'
          label: 首次团队画像
          detail: Bambu 称公司已有 150+ 人，其中 120 人在研发。
          tone: positive
        - date: 2022-06
          label: 首台 X1C 发货
          detail: 约 22 个月开发后，首款产品开始商业化交付。
          tone: positive
        - date: '2023-06-26'
          label: 一周年复盘
          detail: Bambu 公开复盘支持问题、物流痛点，以及加强安全的必要性。
          tone: neutral
        - date: '2025-01-16'
          label: 授权控制发布
          detail: 关键打印机功能改为授权门控，引发生态反弹。
          tone: negative
        - date: '2025'
          label: MakerWorld 爆发年
          detail: 公司披露的数据指向 10M MAU、290M 打印小时和 83% 留存率。
          tone: positive
        - date: '2026-06-25'
          label: 胡润独角兽认可
          detail: 胡润在 2026 年榜单中将 Bambu 列为中国新晋独角兽之一。
          tone: positive
    approximationNotes: 公开来源没有给出精确到日的日期时，采用季度级日期。
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO014
      - CO016
      - CO020
      - CO030
      - CO033
  - id: FO002
    title: KPI 快照
    type: kpi
    layout: compact
    summary: 当前 Bambu 最强的信号来自生态规模、后期私募市场兴趣和高端产品认可，而不是广泛的公开公司披露。
    data:
