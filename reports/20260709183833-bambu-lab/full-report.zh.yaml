      - number: '4.4'
        title: 财务结论：收入质量信号强，但仍是私人公司尽调案
        blocks:
          - type: paragraph
            body: >-
              财务结论对经营动能有利，对披露质量不利。Bambu 的公开证据支撑这样一个业务判断：公司已经逃出常见的业余打印机陷阱。
              它横跨多个价格层销售，变现配件和耗材，看起来拥有溢价品牌，并很可能在少数硬件创业公司才能达到的规模上实现了有意义的盈利。 如果能被独立验证，CNY 10 billion 以上收入、强市场份额和看似约 20%
              的净利率，会让 Bambu 成为本周期最亮眼的私人消费硬件公司之一。


              同时，投资人应把公司视作财务资料不足。毛利率仍是估算值，不是披露值；Tencent 轮是传闻，不是确认；现金可用期和债务义务也无法从公开来源测试。
              上市可比公司的公告和市值页面凸显了差距：上市同行提供正式持续披露，Bambu 不提供。承销判断上，正确说法不是「业务质量不足」，
              而是「财务透明度不足」。严肃融资或老股购买决策仍需要经审计报表、渠道结构、附加率、保修经济性和股权结构文件。
