      - number: '4.2'
        title: 规模、隐含单机经济性和渠道代理指标都指向上行
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务信号是规模。KR Asia、BigGo Finance 以及 2025 年末到 2026 年中的相关报道，都指向 Bambu 已跨过 CNY 10 billion 收入线，出货约 1.2
              million 台打印机，并占据全球消费级或桌面 3D 打印机市场约 29%。 这些数字与 36Kr 相关报道给出的早期 2024 锚点方向一致；当时报导称收入约 RMB 5.5–6.0 billion，
              暗示公司首次重大突破后又经历了一年超高速增长。如果收入超过 CNY 10 billion，而出货约 1.2 million 台， 粗略单台出货收入约为每台 CNY
              8,300，远高于最低端零售硬件价格带。这强烈说明，业务变现来自高端打印机、AMS 向上销售、 耗材、配件，甚至可能包括更高价值的区域 / 渠道组合，而不只是入门级机器。


              销售效率指标没有公开披露，但渠道证据仍有价值。BigGo 的长篇行业文章称，Bambu 采用双腿模式：DTC 网站负责品牌和用户运营， Amazon
              扩大触达；文章还称公司正在铺设线下旗舰店和更广泛零售合作。Micro Center 和 Amazon 的搜索界面也确认， Bambu 产品在美国拥有有意义的第三方零售存在。这些证据不能证明 CAC
              或回本周期，但说明公司已经用不止一条路径推动出货并变现品牌。
