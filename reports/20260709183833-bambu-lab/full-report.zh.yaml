      - number: '8.2'
        title: Bambu 应该享有高于上市同行的溢价，但当前差距过大
        blocks:
          - type: paragraph
            body: >-
              给 Bambu 相对上市增材制造同行的溢价是合理的。Stratasys、3D Systems 和 Materialise 是有用锚点，因为它们显示市场如何给成熟 3D 打印敞口定价，但它们没有一家能匹配
              Bambu 在消费端的速度、盈利叙事，或入门级 / 准专业系统里的势头。3D Printing Industry 和 Tom’s Hardware 引用的 CONTEXT 数据显示，Bambu
              正在重塑低端市场，并把需求从更高价品类拉走。MakerWorld 使用、App 活跃、创作者工具和打印农场渗透，都指向一个比一次性卖机器更宽的业务。因此，Bambu 不该像传统上市同行那样按 1–1.5
              倍收入交易。

              问题在于溢价太大。上市可比公司即便有有意义的软件或服务组件，收入倍数也集中在低个位数；有些公司仍在亏损，或背着重组新闻。Bambu 完全可以说自己在执行力和品类热度上领先数年，但 7 倍收入仍比这些可比公司高出
              5 个以上倍数点。如果公开证据能显示大规模重复性软件层、经审计自由现金流，或机构条款明确确认的一轮融资，估值差距会更容易被投资测算撑住。现在，它主要说明 Bambu
              是一个异常出色的硬件赢家，却被按更接近平台公司的方式定价，而不是按硬件制造商定价。
