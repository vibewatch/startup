  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高残余风险集中在法律、信任、安全和市场准入，而非原始需求
        blocks:
          - type: paragraph
            body: >-
              Bambu 的需求故事已经足够强，真正的承销问题已从「人们会买这些打印机吗？」转为「什么会打断一个已经成功的平台？」 答案是一套分层风险栈。第一，公司在 Stratasys
              专利攻势和相关进口禁令路径上存在真实法律悬顶。第二， 它通过收紧打印机访问和云工作流控制，又用安全论证为这些变化辩护，制造了自我造成的信任风险；许多高级用户把这视为生态封闭。 第三，公司已通过 A1
              召回经历过重大产品安全事件，证明快速放大的硬件复杂度会变成真实成本中心。第四，公司仍暴露在美中 贸易政策，以及任何未来限制其进入最重要西方市场的海关或排除行动之下。

                          这些风险并不等权。专利 / 进口路径和产品安全路径最直接影响经济性，因为它们会打到可得性、保修成本或强制重新设计。生态控制和开源路径更多是声誉风险，但对 Bambu 的影响不成比例，因为高级用户、切片器贡献者、创作者和评测渠道都是增长引擎的一部分。运营上，公司从单一用途打印机走向双喷嘴、激光、刀片、笔、app、切片器和社区软件界面，也增加了体验变差的方式。结果是，即便看多论点仍成立，这组风险也值得认真对待。
