      - number: '4.3'
        title: 盈利看起来真实，但资本充足性和会计质量仍是硬门槛
        blocks:
          - type: paragraph
            body: >-
              公开报道越来越把 Bambu 描述为盈利公司，而不是依赖资本输血的公司。多个来源反复提到约 RMB 2 billion 的净利润； Fabbaloo 和 36Kr
              相关报道都认为，这种盈利能力让公司相较其他桌面打印机供应商拥有少见的 R&D 自由度。如果这些数字大体正确， Bambu 的增长资金来自经营利润和外部资本的程度相当。这一点重要，因为它降低了显性的近期融资依赖。


              但仅凭公开证据，本章无法为资产负债表风险背书。已审阅的官方页面没有发布经审计财务报表、分部收入、毛利率、
              经营现金流、账面现金、月度现金消耗、库存周转、保修准备金或债务契约。融资披露同样嘈杂。传闻驱动的报道反复指向一轮 Tencent 相关融资和接近 $10 billion 的估值，但 Bambu 和 Tencent
              都否认该轮融资按报道所述发生。更早公开报道列出的投资方包括 5Y Capital、Temasek、True Light Capital 和 IDG 相关支持方，但确切轮次规模、日期和当前股权结构仍只有部分公开。
              因此，正确结论是 Bambu 很可能有很强资本可得性，但外部资本的确切金额、成本和必要性仍未验证。
