chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、架构与创立路径
        blocks:
          - type: paragraph
            body: >-
              作为一家年轻硬件公司，Bambu Lab 的起点罕见地清晰。2020 年，Ye Tao 和几名前 DJI 工程师创立公司； 在此之前，他们花了约一年讨论哪个品类既能通向世界级产品公司，又不会沦为复制型制造商。源自
              LatePost 访谈、 翻译发布在 Bambu 官方论坛并由 Call3D 以英文转载的内容显示，团队否掉许多想法后回到桌面 3D 打印， 原因是当时的机器太脆弱、太依赖手工，主流用户也难以上手。Bambu
              2022 年 5 月的团队介绍也强化了这一叙事： 最初 5 名成员用一场三天闭门会，围绕 LiDAR、CoreXY 运动、多色打印和嵌入式软件定义了 X1 架构。
              官方商务披露还显示，公司不是一个清晰披露的单一运营主体，而是多实体结构：BAMBULAB LIMITED 被列为香港总部， Maylerescape Limited 是欧盟运营和营销办公室，Shenzhen
              Tuozhu Technology 是品牌注册所有人。实际分析时， 本报告应把深圳视作运营中心，香港视作行政 / 控股地点，Bambu 视作一家私人、工程师主导的消费硬件公司；
              其法律呈现更像面向电商合规，而不是面向投资人披露。
