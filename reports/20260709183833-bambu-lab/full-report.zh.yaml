      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              客户地图比「创客」更宽，但仍比工业 AM 更接近消费市场。市场与评测来源通常把桌面需求拆成几类： 业余爱好者、教育 / STEM 项目、设计师和原型开发者、小企业，以及越来越多的打印农场或副业经营者。Bambu
              自己的首页强调日常产品、 兴趣和 DIY、教育，以及艺术或时尚。Xinhua/People.cn 展示的中国真实场景类似：学校、家庭、爱好者和创业型用户出现在同一个采用叙事里。 技术侧，FDM
              仍是桌面端主流形态，因为它在可负担性、可靠性和材料熟悉度之间取得平衡；教育和原型尤其重要，因为它们能带来重复使用，
              又不需要企业采购流程。买方和用户可以不同：学校为学生购买，家庭为爱好者购买，打印农场为操作员购买，工程团队为原型开发者购买。 这种组合解释了为什么 Bambu
              的易设置、多色能力和第一方软件重要。很多采用者并不想先当一个以校准为中心的折腾型玩家。
