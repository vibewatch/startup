  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐从强劲经营证据出发，推导出溢价合理性；但在今天的传闻价格下，又被风险和证据质量上限压住。
    data:
      nodes:
        - id: v1
          label: 超高速增长经营证据
          detail: 放在硬件公司里，2025 年收入、利润、市场份额和出货规模都异常强。
        - id: v2
          label: 生态信号
          detail: MakerWorld、App 使用、创作者工具和打印农场采用，显示出平台化迹象。
        - id: v3
          label: 溢价有支撑
          detail: Bambu 应该相对经营吃力的上市增材制造同行享有更高估值。
        - id: v4
          label: 传闻价格锚
          detail: 公开叙事围绕约 $10B 估值展开。
        - id: v5
          label: 可比公司校验
          detail: 上市同行大致集中在约 1–1.5x 销售额，远低于 Bambu 隐含倍数。
        - id: v6
          label: 风险折价
          detail: ITC、关税、召回和信任风险仍然重要。
        - id: v7
          label: 披露折价
          detail: 融资条款、审计质量、经常性收入结构和准备金仍未公开。
        - id: v8
          label: 基准价值低于传闻
          detail: 强劲但不像软件公司的溢价，在今天更站得住。
        - id: v9
          label: 跟踪建议
          detail: 持续监测、加深尽调，等待更低价格或更好证据。
        - id: v10
          label: 上调触发因素
          detail: 审计证据、更好入场价或经确认的经常性经济性，可能推动观点上调。
        - id: v11
          label: 下调触发因素
          detail: 法律、召回、关税或信任冲击，可能打破溢价逻辑。
        - id: v12
          label: 推荐纪律
          detail: 公司质量高；入场质量仍是悬而未决的问题。
      edges:
