      - number: '2.4'
        title: 中国主导的供给、杠铃结构及其对 Bambu 的含义
        blocks:
          - type: paragraph
            body: >-
              对 Bambu 最有影响的结构性事实是，消费级 3D 打印如今看起来像一个由中国主导、呈杠铃型的市场。CONTEXT 的 2026 年数据显示，仅入门级品类就在该季度贡献了系统总收入的
              54%，前四大玩家——Bambu、Creality、Elegoo 和 Anycubic—— 占据 88% 的出货量。与国家媒体相关的报道和独立摘要更进一步，把深圳描述为全球近 90% 消费级打印机供给的重心，
              并称 2026 年最初几个月中国出口量就达到数百万台。与此同时，工业增材制造开始受国防、无人机、航空航天和 3C 电子需求推动而反弹。 这有利于品类叙事，但不是 Bambu 的主要楔子。Bambu 最大受益来自
              Formnext 和 CONTEXT 所说的「Bambu effect」： 需求向下迁移到更便宜的机器，而这些机器已经足以服务原型、教育、副业和打印农场流程。因此，分析市场份额时，应先看入门级和桌面层，
              而不是拿它对标工业金属领导者。
