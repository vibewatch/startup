  - id: TR007
    title: 产品安全与质量信号表
    columns:
      - 信号
      - 公开证据
      - 风险解读
      - 缓释说明
    rows:
      - - A1 召回
        - CPSC 和 Bambu 都描述了热床线缆短路 / 起火风险
        - 高速增长已经带来监管可见的硬件缺陷
        - Bambu 执行了正式退款或维修流程
      - - 19 起线缆损坏报告 / 1 起火花
        - Bambu 与 CPSC 的官方召回细节
        - 事故数量受控，但严重性足以支撑召回
        - 官方披露中没有伤害报告
      - - H2D 首台评测机故障
        - The Verge 称，首台评测机未通过一台更便宜打印机通过的测试
        - 复杂产品早期执行仍是真实风险
        - Bambu 更换了评测机
      - - H2C TPU / 工作流摩擦
        - PCMag 强调 TPU 工作流不直观，绕行负担高
        - 高端旗舰的复杂度可能超出大众市场易用性承诺
        - 打印质量强，不等于设置负担消失
      - - 当前论坛问题流量
        - 最新页和德国论坛页显示，2026 年 7 月仍有固件、AMS 和打印质量问题
        - 支持和 QA 负担仍在发生，不是历史问题
        - 论坛天然偏负面，但对运营判断仍有用
    notes: 单次公开召回不应被夸大成必然性，但足以永久移除“安全风险接近为零”的假设。
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR027
      - CR028
      - CR030
      - CR031
  - id: TR008
    title: 贸易与市场准入情景表
    columns:
      - 情景
      - 机制
      - 收入 / 利润率影响
      - 准备度问题
    rows:
      - - 现有关税持续
        - Section 301 负担继续纳入进口基准账
        - 利润率仍受定价纪律和促销牵动
        - 当前 MSRP 已吸收多少成本？
      - - 关税负担加重
        - 打印机进口新增或扩大关税
        - 美国市场可能涨价，或毛利率受压
        - Bambu 能否足够快地调整生产、出货路径或定价？
      - - ITC 排除令
        - 专利争议变成海关式市场准入事件
        - 美国供货、备件和保修运营可能被扰乱
        - 哪些产品或模块风险最高？
      - - 以特许权使用费或设计变更和解
        - IP 问题不走向直接禁令，但以经济成本解决
        - 不是完全封锁，而是利润率拖累或发布延迟
        - 可承受的特许权使用费或重设计区间是多少？
      - - 区域多元化成功
        - Bambu 建立部分生产或出货路径替代方案
        - 降低长期地缘政治敞口
        - 有没有可信的多元化时间表？
    notes: 关键不在于预测确切政策路径，而是看到多条政策路径都会打到同一组美国利润率和准入变量。
    claimRefs:
      - CR016
      - CR021
      - CR022
      - CR023
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 信心
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 跟踪
        - 中
        - 高
        - 偏高
        - 公司强、也是品类领导者，但只有价格下调或披露质量显著改善时才值得接触
      - - 不买
        - 中
        - 高
        - 偏高
        - 当前公开证据不足以证明应按完整传闻溢价买单，仿佛轮次条款和经常性经济性已经被验证
      - - 上调路径
        - 中
        - 中高
        - 只有更低入场价才算合理到有吸引力
        - 如果确认经审计数字、经常性收入证据，或价格显著改善，立场可更积极
      - - 下调路径
        - 中
        - 高
        - 昂贵
        - 如果法律、召回或生态信任风险恶化，而价格仍高，立场会转负
    notes: 建议刻意对价格和证据敏感，而不是给产品质量一个泛泛分数。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
      - CV043
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Bambu 已成为定义消费级 / 准专业级桌面 3D 打印品类的平台，而不只是另一家打印机 SKU 厂商。
        - 如果生态使用走弱或社区信任受损，平台叙事可信度会下降。
      - - Bambu 盈利、增长快，并在市场最强板块抢份额，因此相对公开增材制造同行应享有溢价。
        - 如果增长很快回归常态，或同行在多色 / 易用性上追上，合理溢价会收缩。
      - - MakerWorld、Bambu Handy 和创作者工具指向重复使用与内容飞轮，这是公开硬件同行缺少的。
        - 如果重复经济性仍主要由硬件和耗材驱动，软件变现很少，飞轮溢价就应收窄。
      - - 当前约 $10B 估值已经计入接近最佳情景的业务持续性和利润率假设。
        - 如果出现经审计业绩、更干净的股权结构条款，或更低入场价，当前反论点会变弱。
      - - 法律、关税和召回风险可管，但并不轻。
        - 如果出现 ITC 挫败、第二次重大召回或更严厉关税制度，反论点会立即变强。
    notes: 表格把“好公司”逻辑和“好入场价”逻辑拆开，因为报告建议同时看两者。
    claimRefs:
      - CV018
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Bambu 维持品类领导地位，继续抢份额，守住盈利能力，扩大生态的经常性变现，并避开重大法律或召回损伤。
        - $10B–$14B 当前价值区间可以站住脚，前提是 Bambu 更像硬件 + 平台复合增长公司，而不是高端打印机 OEM。
        - 这要求执行异常干净、披露更强，而且没有重大政策或 IP 冲击。
        - 可能，但公开证据尚未完全证明。
      - - 基准
        - Bambu 仍是领导者，但增长放缓，投资者给的是带溢价的硬件倍数，而非软件平台倍数。
        - $6.5B–$9.0B 更符合强基本面叠加实质信息不透明和风险折价的组合。
        - 法律或关税问题恶化时仍会被压缩。
        - 当前大多数证据指向这里。
      - - 悲观
        - 增长放缓、风险兑现，或市场把 Bambu 重估到更接近高质量硬件同行。
        - $3.5B–$6.0B 反映倍数向“强硬件但不是平台”区间压缩。
        - 市场份额流失、进口限制、召回复发或信任冲击。
        - 不是基准情景，但如果当前叙事失去动能，非常可能。
    notes: 这些是现值区间，不是未来退出目标，因为稀释、优先权和股权结构细节不公开。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV034
      - CV038
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Bambu Lab（传闻轮次背景）
        - 2025 年收入 >CNY 10B、净利润约 RMB 2B；估值被广泛讨论在 $10B 左右，但公开存在争议
        - 按 $10B 计算，约 7.1x 收入、约 35.7x 净利润
        - 直接锚定当前入场价争论
        - 轮次条款、确认情况和结构仍模糊
      - - Stratasys
        - 2026 年 7 月市值约 $0.76B；2025 年收入 $551.1M
        - 约 1.4x 往绩收入
        - 有规模、材料、软件和服务的公开增材制造同行
        - 成熟工业同行，增长更慢，终端市场组合不同
      - - 3D Systems
        - 2026 年 7 月市值约 $0.50B；2025 年收入约 $387M
        - 约 1.3x 往绩收入
        - 显示增材制造的弱情绪可以持续多久
        - 业务在重组中，也不是接近的消费平台类比对象
      - - Materialise
        - 2026 年 7 月市值约 $0.40B；2025 年收入 €267.6M（约 $290M 等值的粗略量级）
        - 按粗略美元换算，约 1.4x 销售额
        - 显示即便有软件 / 医疗 / 服务组合，公开市场倍数仍不高
        - 汇率和业务组合降低直接可比性
    notes: 公开可比组合并不能证明 Bambu 应按 1–1.5x 销售额交易，但它确实说明 7x 销售额估值标记有多激进。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most useful publicly observable additive-manufacturing valuation anchors and Bambu’s own rumored
        price context; richer private comp data is limited and often stale.
