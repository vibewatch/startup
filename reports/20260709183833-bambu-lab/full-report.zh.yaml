      - number: '8.3'
        title: 正确判断是跟踪：优质公司、估值偏高，证据仍不完整
        blocks:
          - type: paragraph
            body: >-
              建议应当对价格敏感，而不是二选一。Bambu 不是需要避开的标的；它是中国当前制造体系里最强的消费级 /
              准专业硬件公司之一。但证据不足以支持在当前传闻区间直接买入。融资语境仍有太多模糊处，法律和政策风险依旧真实；即便给 Bambu 很高溢价，可比公司样本也要求纪律。如果投资者只能在讨论中的 100
              亿美元附近进入，正确姿态是跟踪：持续观察，要求更好披露，等待价格松动，或等待更强证据证明 Bambu 生态确实配得上软件式经济性。

              按情景看，基准情景低于传闻估值，因为 Bambu
              应得高于上市同行的溢价，但完整平台倍数仍显得过早。乐观情景需要公司继续拿份额、持续盈利，从社区和耗材中形成有意义的重复变现，并且没有重大法律或监管挫折。悲观情景不是「Bambu 失败」，而是 Bambu
              仍是一家很好公司，但市场不再愿意为高端桌面硬件支付英雄式倍数。区分两者很重要。伟大公司如果轮次价格已经假设完美，仍可能是糟糕入口。
