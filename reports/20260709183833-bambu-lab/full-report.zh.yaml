      - number: '5.4'
        title: 信任和合规功能真实存在，封闭生态风险也一样真实
        blocks:
          - type: paragraph
            body: >-
              Bambu 并不是为了表面功夫而加控制。P1S 和 A1 mini 官方页面明确提到符合 EU RED Article 3.3 和 ETSI EN 303 645， Bambu Connect
              公告把授权描述为对安全担忧的回应；支持中心对远程控制、实时画面、故障排查、发布说明和打印机绑定的记录方式， 更像一家消费电子软件公司，而不是车库工具供应商。社区维护的 MQTT 文档也显示，云和 LAN
              故事下方确实有基础设施； 公司并没有假装问题很简单。

                          但同一批功能也制造产品风险。媒体和社区来源显示，许多用户把 2025 年授权控制推出解读为锁定动作，而不只是加固动作。批评者反对必须使用 Bambu Connect、可选但不受支持的开发者模式、对 Panda Touch 和 OrcaSlicer 工作流的影响，以及围绕专有配件、RFID 材料处理、开源 fork 法律姿态的更广泛担忧。实际尽调结论是，Bambu 的信任故事有两面：它可以可信地向主流买方营销安全、安保和合规，同时也可能疏远那些在创客生态中放大可信度的高级用户。
