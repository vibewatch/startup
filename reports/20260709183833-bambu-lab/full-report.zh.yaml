      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              关键增长驱动，在几乎所有保留来源里都反复出现：过去只有昂贵或难伺候机器才具备的能力，已经下探到消费电子价格带。 CONTEXT、Mordor
              和产品评测者都把更易用的软件、更好的自动化、多色处理和更低价格视为打开市场的关键。落到 Bambu 身上，
              这推动了入门级和准专业系统的品类增长，也让更昂贵的专业系统从下方承压。但市场并非没有摩擦。高端买方仍会审视资本支出， 一些功能性终端用途对材料仍不满意；当分布式制造变得容易，IP
              或监管担忧也会变得重要。贸易政策同样扭曲行为：CONTEXT 的 Q1 2025 分析明确称，买方为抢在预期美国关税前购买低成本系统而提前下单。工业侧，通胀、利率和地缘冲突让许多资本预算在 2025
              年仍处于冻结状态。这意味着桌面市场可以高速增长，而整个增材制造栈未必同步移动。
