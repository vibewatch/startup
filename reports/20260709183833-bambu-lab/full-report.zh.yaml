  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础不止业余爱好者，并包含多个重叠用户角色
        blocks:
          - type: paragraph
            body: >-
              Bambu 的客户地图，最好描述为一个分层的消费级 / 准专业生态。核心受众仍是业余爱好者和严肃创客，但官方产品和 app 页面显示，
              公司有意服务至少四个相邻群体：想要低摩擦设置的新手、看重多色或材料灵活性的高级用户、需要可重复性和远程监控的打印农场运营者、 以及受益于交钥匙流程和模型库的机构或教育者。Bambu Handy app
              的描述很有信息量，因为它同时面向专家、爱好者和新手， 并把远程控制、实时画面、故障排查和 MakerWorld 发现整合进同一个用户体验。

                          产品定位强化了这一分层。A 系列为入门用户降低复杂度，P1S 页面明确提到打印农场，X1 家族仍是高端准专业旗舰，H2D 则扩展到更高端的工作室或工坊用户，他们想要的不只是线材打印。这些都不能证明分部收入，但清楚显示 Bambu 不只是卖给周末折腾者。公司正在搭建一套客户栈，横跨创意、副业生产和越来越半专业化的工作流。
