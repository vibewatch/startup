  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 即便审计后的收入结构不可见，收入模型和定价仍可观察
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab 的变现引擎，在私人硬件公司里罕见地可读，因为公司直接在类似零售的界面上销售。官方商店页面显示出一条价格梯： 从 X1、P1S 这类高端封闭式打印机，到价格更低的 A1 硬件，再向上销售 AMS
              多色系统、品牌线材、备件、配件和周期性促销套装。 线材页面尤其重要：它们展示了明确的批量折扣、补充装形式，以及围绕重复购买而不是一次性硬件附着设计的价格架构。 这让 Bambu 的模型不太像单纯打印机
              OEM，更像一套剃刀-刀片式栈：装机量增长可以反哺经常性耗材和配件需求。


              公开标价仍不等于实际成交价，也不等于披露后的收入结构。商店页面显示零售售价、积分、促销和价格保护， 但看不到按 SKU 的销售穿透、AMS
              附加率、各渠道套装折扣，或公司收入中有多少来自线材、配件、MakerWorld、 或软件相邻服务。即便如此，公开界面已经足以说明收入并不依赖单一打印机 SKU。Bambu 已搭出多产品变现栈，
              由硬件、多色升级、耗材和流量效率较高的第一方渠道共同支撑。
