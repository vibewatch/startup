        - 传感器、固件逻辑、用户环境质量
        - 故障或误检会迅速削弱信任
      - - 材料处理
        - AMS 系列的装载、换料和干燥系统降低多色打印门槛
        - RFID、送料器、封闭料路和配件可得性
        - 加深生态锁定和备件依赖
      - - 切片层
        - Bambu Studio 负责创建、配置、监控，也能通过网络下发打印任务
        - 开源代码库 + 可选网络插件
        - 开源血统与专有插件边界发生冲突
      - - 网络层
        - 云端中介、LAN 授权、MQTT、直播、FTP、开发者模式
        - Bambu Connect、云端认证、本地代码、打印机固件
        - 云端策略一变，第三方工作流可能被打断
      - - 社区层
        - MakerWorld 供给模型和打印配置
        - 内容审核、配置质量、创作者激励
        - 社区护城河也可能变成治理或版权冲突
      - - 混合工具头栈
        - H2D/H2C 增加双喷嘴、激光、刀片、画笔、摄像头和加热器
        - 更多传感器、安全系统和软件模块
        - 能力更强，也意味着潜在故障点更多
      - - 支持层
        - 发布说明、故障排查、实时视图文档、打印机绑定、远程控制帮助
        - 持续维护软件和文档
        - 文档薄或频繁变化，会抬高高级用户的支持负担
    notes: 表中架构行结合官方描述、社区文档和独立评测；这些是功能层，不是字面意义上的架构图。
