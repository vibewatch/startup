  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与正确测算口径
        blocks:
          - type: paragraph
            body: >-
              Bambu Lab 竞争的不是整个增材制造宇宙。广义全球 3D 打印市场包括工业金属系统、服务机构、企业软件、材料， 以及航空航天、医疗器械等专业垂直领域。对这一广义市场的 2026 年公开估算，已经从约 USD
              27.7 billion 到 USD 34.9 billion 不等，取决于研究机构以及分析师把边界拉到多远。公司真正可触达的空间窄得多：桌面、 入门级 /
              准专业打印机，加上让机器在购买后持续有用的软件、内容和配件层。这一区分很关键，因为较窄的桌面市场要小好几倍。 Mordor 将 2026 年桌面 3D 打印市场估在 USD 7.51
              billion；另一家研究机构预计，2025 年约 USD 4.86 billion 的基数会在 2030 年增至 USD 10.29 billion。换句话说，Bambu
              的机会之所以有吸引力，是因为它位于增材制造增长最快、 最消费化的一层，而不是因为公司可以把每一个工业或医疗 3D 打印美元都算作可服务需求。
