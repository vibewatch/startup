  - id: FV002
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 在当前公开证据下，Bambu Lab 的悲观、基准、乐观三种现值区间。
    data:
      items:
        - label: 悲观
          low: 3500
          mid: 5000
          high: 6000
          detail: 硬件估值倍数压缩、风险事件或增长放缓。
        - label: 基准
          low: 6500
          mid: 8000
          high: 9000
          detail: 高溢价硬件平台龙头，但尚未完全配得上软件估值倍数。
        - label: 乐观
          low: 10000
          mid: 12000
          high: 14000
          detail: 只有生态变现和溢价韧性持续，当前传闻价格才说得通。
    approximationNotes: 这些数值是以百万美元计的当前价值区间，不是精确的基金回报预测，因为稀释和优先权结构并未公开。
    claimRefs:
      - CV006
      - CV018
      - CV027
      - CV028
      - CV029
      - CV044
