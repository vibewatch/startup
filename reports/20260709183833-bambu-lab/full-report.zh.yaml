  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 这套栈围绕多类买家的首次成功时间设计
        blocks:
          - type: paragraph
            body: >-
              Bambu 的产品形态最好理解为一套工作流栈，而不是一串打印机清单。X1 系列仍是高端标杆产品：高速 CoreXY 运动、 lidar
              辅助校准、多色支持，以及一种能卖出「严肃创客」性能、但不要求用户持续折腾的设计语言。P1S 把这套承诺压缩进更便宜的封闭平台， A
              系列则通过更安静的运行、全自动校准和更像家电的设置方式，再次降低门槛。基础打印机周围是 AMS 家族， 它把多色和多材料打印从高级爱好者技巧，变成可陈列、可销售的向上销售项。硬件层之上，是 Bambu
              Studio、远程控制和监控功能、 Bambu Connect 桥接，以及 MakerWorld 模型社区。

                          这一点重要，因为客户任务不只是「拥有一台打印机」。业余爱好者或课堂买方要的是尽量少校准失败、直接跑出打印；准专业用户或打印农场要的是可靠、可重复的吞吐量，配合远程监控和简单多色操作；偏设计的创客，现在还可以借 H2D 和 H2C 进入混合制造，它们加入了激光、刀片和绘图工具。Bambu 的产品策略，就是把这些任务压缩进一个整合品牌旅程，让更多工作流发生在第一方硬件和软件内部。
