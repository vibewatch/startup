      - number: '1.2'
        title: 产品、软件与平台扩张
        blocks:
          - type: paragraph
            body: >-
              最重要的概览结论是：Bambu 已不再只是卖打印机 SKU。官方页面和独立评测显示，公司已经搭出一套垂直整合栈： 打印机、线材、软件、移动控制、模型分享、创作者工具和品牌配件彼此强化。公司官方软件页把 Bambu
              Studio 描述为 开源切片软件，MakerWorld 则承担模型、项目和创作者活动的用户生成分发层。到 2025 年，独立报道引用 Bambu 自有统计称，MakerWorld 已达到约 10 million
              月活用户、2.6 million 个原创模型、280,000 名创作者和 290 million 小时打印时长。这些数字重要，是因为它们说明 Bambu 的护城河已不只靠单台打印机经济性，而是转向生态使用。
              打印机产品线本身也在向上和横向扩张：官方对比页显示，公司如今覆盖入门消费级系统、高端封闭式打印机， 以及 H2D/H2C 家族这类多功能制造中枢；The Verge、CNET、PCMag 和 TIME 也共同把
              Bambu 描述为该品类中最有影响力的 消费硬件品牌之一。硬件完成度叠加软件 / 社区引力，使 Bambu 的市场位置更像一家平台公司，而不是单品 Kickstarter 校友。
