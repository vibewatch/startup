      - number: '6.2'
        title: 最好的采用证据是行为：app 活跃、打印时长、创作者和周使用
        blocks:
          - type: paragraph
            body: >-
              Bambu 拥有真实客户采用的最强证据，不是 logo 墙，也不是融资新闻稿，而是行为使用。3DPrint.com 和 3D Printing Industry 都报道称，MakerWorld 在 2025
              年达到约 10 million 月活用户，拥有约 2.6 million 个原创模型，每天新增超过 7,000 个模型， 并有约 280,000 名设计师贡献。如果其中哪怕一小部分活跃，这些都不是虚荣注册数。3D
              Printing Industry 还补充称， 超过 30,000 名用户平均每天打印超过 7 小时，超过 130,000 名用户每周至少打印 6 小时，合计打印时长超过 290 million
              小时。这类参与画像，通常对应真正被使用的装机基础。

                          app 界面从另一个角度讲了同一个故事。Bambu Handy 的 iOS 和 Google Play 页面把 app 定位为远程控制、实时画面和 MakerWorld 入口，而不只是设置助手。应用商店文案还显示，社区循环包括故障排查、学习资源和一键从模型到打印的行为。结合官方论坛在打印机家族、软件、AMS 和 MakerWorld 上的活跃度，证据说明客户不是买完一个盒子就消失。他们进入的是一种重复的软件和社区节奏。
