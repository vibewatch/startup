  - id: TE008
    title: 开放与封闭生态张力表
    columns:
      - 张力点
      - 证据
      - 用户为什么在意
      - 降低风险的做法
    rows:
      - - 开源切片软件 vs 可选闭源网络插件
        - BambuStudio GitHub 称切片软件采用 AGPL，网络插件非自由且可选
        - 用户想要丰富功能，但不想交出协议开放性
        - 发布稳定 API，或降低插件边界争议
      - - LAN 模式 vs 授权控制
        - 官方论坛和博客文章说明了授权与开发者模式
        - 高级用户想要本地自主权和面向未来的工作流
        - 保持 LAN 模式可用，且不牺牲易用性
      - - OrcaSlicer 兼容性
        - Fabbaloo、3D Printing Industry 和 How-To Geek 记述了对 Bambu Connect 的拒绝以及后续法律争端
        - 第三方工作流会放大 Bambu 在创客生态中的可信度
        - 维持直接、有文档且稳定的第三方访问
      - - 配件和协议锁定
        - 反弹报道提到 Panda Touch 和 API 破坏
        - 用户不喜欢失去对已购硬件的自由度
        - 提供迁移期，并给出更清晰的协议承诺
      - - 启用 RFID 或高度集成的材料管理
        - PCMag 称赞 RFID 的便利，批评者则将其视为锁定风险
        - 第三方选择变窄后，便利可能变成依赖
        - 明确第三方材料的支持边界
      - - 社区治理控制
        - MakerWorld 增长与法律 / 版权执行引发治理问题
        - 创作者信任规则，平台护城河才有用
        - 讲清创作者经济、许可和审核流程
    notes: 这张表抓住了 Bambu 集成生态在商业上有效之后自然冒出的产品治理张力。
    claimRefs:
      - CE034
      - CE035
      - CE042
      - CE043
      - CE045
      - CE046
      - CE047
      - CE048
