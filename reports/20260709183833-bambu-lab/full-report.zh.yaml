      - number: '1.4'
        title: 里程碑、争议与主要尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Bambu 的公司叙事很有力量，但并非没有风险。公开记录中最清晰的负面事件，是 2025 年 1 月的授权控制变更。 Bambu
              自己的帖子明确说明，打印发起、固件升级、运动控制、远程视频等关键操作开始需要授权，未来机型预计默认采用这一方式。
              随后，独立报道记录了用户反弹：许多用户认为该变更强化了云依赖，压缩了第三方自由，也加深了公司的封闭生态。Bambu 通过允许 SD-card 打印、旧固件和部分流程中的 Bambu Connect
              桥接，缓和了短期操作影响；但这次事件仍然重要。它说明，当一家公司的生态越来越依赖第一方软件和服务时，
              产品安全决策可以很快演变为治理和社区信任问题。另一个主要限制是披露。本文审阅的官方来源没有提供员工数、经审计财务、 或清晰的董事会 /
              治理名单；一些传播最广的规模和估值数字，也仍然来自翻译后的中文报道，而不是公司直接发布的投资人材料。 因此，Bambu 的执行看起来很强，但结构和财务仍有一定不透明度。
