      - number: '8.4'
        title: 比起更多故事，更低价格或更好披露会更快改变判断
        blocks:
          - type: paragraph
            body: >-
              最重要的缺口不是理念，而是机制。投资者仍需要实际轮次条款、Tencent
              是否真的参与、清算优先权或结构安排、耗材和软件重复收入规模、保修与召回准备金，以及利润率对关税或诉讼结果的敏感度。这些项目没有一个会单独毁掉公司；但如果没有答案，它们都会毁掉精确的回报测算。因此，尽管 Bambu
              运营实力明显，合适的信心等级也只能是中等。

              退出准备度因此有条件。如果公司能确认更干净的股权表、拿出经审计报表、证明盈利可持续，并证明 MakerWorld
              和耗材能创造可持续复购经济性，投资者就可以为它支付远高于上市同行的倍数。反过来，如果下一批证据仍是传闻含混、法律悬而未决，或重复经济性弱于预期，那么当前估值讨论就跑在事实前面。改善建议最快的办法，要么是降低进入价格，要么是提高证据质量。
