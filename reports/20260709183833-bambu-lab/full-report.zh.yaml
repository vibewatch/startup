companyProfile:
  summary: >-
    Bambu Lab 是一家总部在深圳的硬件创业公司，由前 DJI 工程师在 2020 年创立，如今已成为全球领先的消费级桌面 3D 打印机公司。旗舰 X1 Carbon 和 P1 系列把 Core XY 运动、自动多轴校准和模块化
    Automated Material System 组合在一起，支持最高 350 mm/s 的多色打印。2025 年，公司拿下全球桌面 FDM 打印机市场约 29% 份额， 收入超过 CNY 10 billion（≈$1.4
    billion），净利润逼近 RMB 2 billion（≈$280 million）——成为第一家跨过 CNY 10 billion 收入门槛的 3D 打印机公司。
  foundedDate: '2020-01-01'
  founders:
    - name: Ye Tao
      role: CEO 兼联合创始人
      background: 曾任 DJI 高级工程师和项目负责人，主导过多条旗舰无人机产品线的开发。
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: 面向消费级和专业桌面的 FDM 3D 打印机（X1 Carbon、P1S、P1P、A1、A1 Mini、H2D）、自有 AMS 多色系统、Bambu Studio 切片软件、MakerWorld 模型市场和品牌耗材线材。
  customerFocus: 全球的业余创客、准专业工程师、小企业、打印农场和教育机构。
  businessModel: 硬件销售（打印机、升级件）、品牌线材耗材、MakerWorld 市场，以及正在萌芽的订阅 / 云服务。
  stage: Late-stage VC
  fundingStatus: >-
    据报道，公司在 2025 年 11 月与 Tencent Investment 讨论过后期 VC 轮；早期轮次投资方包括 5Y Capital、Temasek Holdings、True Light Capital 和 IDG
    Capital；市场高频引用的估值锚点是 ~$10B，但公开报道仍存在部分争议。
