  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局结构与直接同行
        blocks:
          - type: paragraph
            body: >-
              竞争格局最好理解为分层市场，而不是一张扁平品牌清单。Bambu、Creality、Elegoo、Anycubic、Flashforge 和 Prusa 占据消费级和准专业 FDM
              战场，价格、速度、多色支持和易用性最关键。UltiMaker、MakerBot 和 Formlabs 更接近专业、 教育或专门技术流程；即便 Stratasys/MakerBot
              和树脂专家并不是直接价格带同行，对一些买方来说仍是重要替代。当前市场数据明显偏向 Bambu 所在的这一层：到 2025 年末和 2026 年初，入门级不仅是增长最快的价格级别，也高度集中在中国供应商手中。
              这种集中度让竞争者组合变得不对称。西方玩家在课堂、开源或树脂细分领域仍可能很重要，但品类收入和出货动能越来越来自以生态驱动的消费硬件供应商， 其中 Bambu 领跑。规模很重要。
