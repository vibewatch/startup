  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心问题不是公司质量，而是今天传闻价格已经预设了什么
        blocks:
          - type: paragraph
            body: >-
              Bambu 很容易让人喜欢，却更难定价。正面看，很少有硬件创业公司能这么快同时拿到规模、盈利能力和市场份额领先。公开报道指向 2025 年收入超过人民币 100 亿元、净利润约 20 亿元人民币、打印机出货超过
              120 万台，全球品类份额已经大到足以迫使桌面 3D 打印结构性重置。负面看，公开估值语境仍然混乱。市场看到的大多是围绕 Tencent
              参与融资的传闻、否认和猜测，而不是条款完整、定价清晰的一轮融资。这很关键，因为业务越亮眼，估值纪律越重要，而不是相反。

              按常被引用的约 100 亿美元价格，Bambu 对应约 7.1 倍 2025 年收入、约 35.7 倍 2025
              年净利润。高速增长平台并非完全承受不了这些倍数，但它们远高于上市增材制造公司的交易水平。最简单的理解是：100 亿美元标记已经假设 Bambu 不只是一家成功的打印机公司，而是一个定义品类的硬件 +
              软件生态，既能维持更高增长、守住利润率，也能避开法律、质量和政策挫折——这些挫折通常会压缩多数硬件倍数。平台化判断未来可能成立；但当前公开证据还没有把它证明得足够干净。
