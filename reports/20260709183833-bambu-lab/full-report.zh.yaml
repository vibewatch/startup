      - number: '7.2'
        title: 监管、法律和信任风险在桌面硬件公司中异常交织
        blocks:
          - type: paragraph
            body: >-
              Bambu 2025 年 1 月的授权控制事件，把一次安全更新变成了治理测试。官方博客明确表示，关键打印机操作——包括打印任务发起、 固件升级和部分 LAN
              模式动作——需要官方授权，未经授权的第三方软件会被挡在关键操作之外。Bambu 后来澄清，愿意接受支持减少的高级用户， 可以通过开发者模式保持 MQTT、livestream 和 FTP
              开放。这个澄清有帮助，但没有抹掉核心信号：Bambu 希望未来打印机默认走向受控访问， 而其选择的折中方案，仍让公司居中调停第三方工具如何连接其生态。

                          法律层让这个信任问题更尖锐。Bambu Studio 和 OrcaSlicer 都建立在 AGPL 基础上，因此社区期待衍生工作流保持开放。但 2026 年 OrcaSlicer fork 争议显示，Bambu 在这个开源基底之上，围绕云连接行为主张使用条款、逆向工程和授权论证。与此同时，Stratasys 的专利攻击不是虚张声势；它瞄准核心桌面打印功能，并带有美国进口禁令路径。再加上跨境或服务相关数据处理要承担中国 PIPL 下的隐私义务，Bambu 开始像一家法律和声誉界面远比最初业余品牌形象更宽的公司。
