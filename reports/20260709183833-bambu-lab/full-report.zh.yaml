      - number: '5.2'
        title: 技术架构混合开源根基与受控联网层
        blocks:
          - type: paragraph
            body: >-
              Bambu 的架构有两种鲜明性格。产品性能侧，它强烈偏向用户友好：高速运动系统、自动调平、基于 lidar 或摄像头的监控、 AMS 辅助换料，以及降低手工调参需求的切片器默认设置。软件侧，Bambu
              Studio 明确开源，GitHub 仓库称其基于 PrusaSlicer， 而 PrusaSlicer 又来自 RepRap/Slic3r 脉络。同一个仓库也把取舍讲得很清楚：联网插件是可选项，且基于非自由库；
              这意味着切片前端开放，但最丰富的云和网络行为仍部分专有。

                          联网栈说明了为什么这一点重要。社区 MQTT 文档同时描述了云代理和打印机本地代理；Bambu 2025 年 1 月的 Bambu Connect 帖子则称，标准 LAN 模式现在包含授权，开发者模式可以保留 MQTT、livestream 和 FTP 开放，但用户要承担不受支持的安全责任。这是一个清晰的架构选择：Bambu 想要经代理中转、经过认证的联网层带来的便利和安全姿态，高级用户则想直接控制设备。结果是一套技术上复杂、商业上合理的产品架构，同时也异常依赖社区信任。
