- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue and profit statements
    - Without them, scale and margin claims remain corroborated but unaudited
    - Request 2024-2025 audited financial statements and auditor letters
  - - Gross-margin bridge by printers versus consumables
    - Needed to test whether profitability is structural or promo-driven
    - Request gross margin by product family and channel
  - - Cash, working capital, and runway
    - Needed to distinguish self-funded growth from hidden financing dependence
    - Request monthly cash-flow model and inventory schedule
  - - AMS attach rate and installed-base monetization
    - Key to testing recurring accessory economics
    - Request attach, repeat-purchase, and active-printer cohort data
  - - Channel mix and realized ASP
    - Retail list pricing does not prove net realized price or reseller dilution
    - Request DTC versus Amazon versus offline revenue split and discount ladders
  - - Round terms and current cap table
    - Needed to validate valuation, dilution, and investor control
    - Request term sheet, cap-table waterfall, and shareholder register
  notes: These are the highest-value missing disclosures for a serious financing or secondary-market underwriting process.
