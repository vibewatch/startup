  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: A gross-margin bridge by printers, AMS, filament, and channel mix.
    whyItMatters: Reported profitability cannot be stress-tested without knowing whether margin comes from premium hardware, consumables, or temporary pricing conditions.
    diligencePath: Request audited gross margin by product family and by DTC versus reseller channel.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, operating cash flow, and runway under base and downside plans.
    whyItMatters: The absence of burn and runway data prevents a true capital-adequacy conclusion even if profit rumors are directionally correct.
    diligencePath: Request the latest balance sheet, monthly cash-flow statement, and board-approved operating plan.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Signed term sheet, exact round size, investor allocations, liquidation preferences, and board rights for the Tencent-linked financing discussion.
    whyItMatters: Valuation, dilution, and control cannot be underwritten from rumor-driven reporting or denials alone.
    diligencePath: Request the term sheet, shareholder register, and post-money cap-table waterfall directly from management or lead investors.
    relatedQuestionRefs:
    - QI016
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Any debt schedule, covenant package, equipment financing, or contingent liability disclosure.
    whyItMatters: Hidden leverage could materially change equity value and downside protection even for a profitable business.
    diligencePath: Request debt agreements, lender schedules, and a contingent-liability memo from finance counsel.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: minor
    topic: installed-base-economics
    missingEvidence: AMS attach rate, filament reorder cadence, and installed-printer cohort revenue by year of purchase.
    whyItMatters: Those numbers would convert an attractive recurring-revenue story into a measurable lifetime-value model.
    diligencePath: Request cohort-level installed-base dashboards with attach, reorder, and active-printer utilization metrics.
    relatedQuestionRefs:
    - QI003
    - QI023
    relatedTableRefs:
    - TI001
    - TI003
    - TI007
