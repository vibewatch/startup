- id: TI008
  title: Public-comparable context table
  columns:
  - Comparable / source
  - Public disclosure surface
  - Why it matters for Bambu
  - Limitation
  rows:
  - - 3D Systems filings page
    - Listed peer provides continuous SEC-facing disclosure
    - Highlights the transparency gap between public peers and Bambu
    - Does not by itself prove DDD is a close operating analog
  - - Stratasys filings page
    - Another major listed AM peer with regular filings and annual reports
    - Shows that public 3D-printing investors typically receive audited updates
    - Different geography and product mix
  - - Materialise filings page
    - Public software-plus-AM peer also publishes formal filings
    - Useful reminder that ecosystem businesses can still disclose more than Bambu does
    - Not a pure desktop-printer comparable
  - - CompaniesMarketCap pages for DDD, SSYS, and MTLS
    - Standalone public market caps sit well below Bambu's rumored private valuation
    - Supports the view that Bambu is seeking a premium multiple versus listed peers
    - Market cap is not EV and comparability is imperfect
  notes: Comparable context is used here to frame disclosure and valuation discipline, not to claim these businesses are one-for-one comparables.
