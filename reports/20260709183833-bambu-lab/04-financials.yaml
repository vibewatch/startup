- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Consumer and prosumer printers
    - Direct sale of X1, P1, A1, and related systems
    - Per printer / bundle
    - Clearly active through official store and third-party retail surfaces
    - Largest visible stream, but product-level mix is undisclosed
    - Request revenue by printer family and region
  - - AMS multicolor systems
    - Upgrade and bundle attachment to compatible printers
    - Per AMS unit / combo
    - Officially merchandised with standalone and combo pricing
    - Good upsell logic; actual attach rate is undisclosed
    - Request AMS attach rate by installed base cohort
  - - Branded filament
    - Repeat purchase of PLA, PETG, ABS, and refill SKUs
    - Per spool / refill
    - Bulk pricing and refill structure are public
    - Best evidence of recurring consumables revenue
    - Request annual consumables revenue and reorder frequency
  - - Accessories and spare parts
    - Hotends, cameras, hubs, maintenance parts, tools
    - Per part / kit
    - Large catalog visible on official store
    - Supports aftermarket gross profit and installed-base retention
    - Request aftermarket revenue, margin, and warranty replacement ratio
  - - Marketplace and creator ecosystem
    - MakerWorld traffic, creator incentives, and ecosystem services
    - Not publicly disclosed
    - Community scale is public but direct monetization is opaque
    - Likely reduces traffic costs before it proves direct revenue
    - Request MakerWorld revenue, CAC impact, and creator payout policy
  - - Retail and channel programs
    - Amazon, Micro Center, and offline stores broaden distribution
    - Indirect retail / resale
    - Channel presence is visible, economics are not
    - Helps reach and sell-through, but can compress gross margin
    - Request DTC versus channel mix and channel gross margin
  notes: The public record makes the monetization lanes visible, but not the audited revenue split across them.
