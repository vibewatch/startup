      role: CEO and Co-founder
      background: "Former senior engineer and project lead at DJI, where he led development of several flagship drone product lines."
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: "Consumer and professional desktop FDM 3D printers (X1 Carbon, P1S, P1P, A1, A1 Mini, H2D), proprietary AMS multi-color system, Bambu Studio slicer software, MakerWorld model marketplace, and branded filament consumables."
  customerFocus: "Hobbyist makers, prosumer engineers, small businesses, print farms, and educational institutions globally."
  businessModel: "Hardware sales (printers, upgrades), branded filament consumables, MakerWorld marketplace, and emerging subscription/cloud services."
