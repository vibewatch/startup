companyProfile:
  summary: "Bambu Lab is a Shenzhen-based hardware startup founded in 2020 by ex-DJI engineers that has become the world's leading consumer desktop 3D printer company. Its flagship X1 Carbon and P1 series combine Core XY motion, automatic multi-axis calibration, and a modular Automated Material System for multi-color prints at speeds up to 350 mm/s. The company captured approximately 29% of the global desktop FDM printer market in 2025, generating over CNY 10 billion (≈$1.4 billion) in revenue and approaching RMB 2 billion (≈$280 million) in net profit — the first 3D-printer company to cross the CNY 10 billion revenue milestone."
  foundedDate: "2020-01-01"
  founders:
