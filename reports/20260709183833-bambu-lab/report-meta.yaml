  fundingStatus: "Late-stage VC round reportedly discussed in November 2025 with Tencent Investment; earlier rounds from 5Y Capital, Temasek Holdings, True Light Capital, and IDG Capital; frequently cited valuation reference point is ~$10B, though public reporting remains partially disputed."
