chapter:
  number: 2
  title: "Market Analysis"
  summary: "The available evidence supports a narrow market definition around technical workflow automation and AI-agent orchestration, sold through managed cloud and self-hosted deployment paths. Public pricing and product packaging show how n8n segments buyers, but the assigned evidence does not support a monetary TAM, n8n-specific SAM/SOM, or community-to-paid conversion rate."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      n8n's evidenced market boundary is technical workflow automation: connecting applications,
      proprietary data, APIs, and AI models into observable workflows that can run on n8n's
      infrastructure or the customer's. The official product page claims more than 500
      integrations, custom API connectivity, human-in-the-loop controls, and enterprise
      governance features. Included spend therefore sits in integration and workflow tooling,
      managed automation hosting, self-hosted automation infrastructure, and the governance
      layer needed to operate AI-enabled workflows. Raw foundation-model training, generic
      compute, and applications that do not orchestrate workflows are outside this boundary.
      Status-quo substitutes include custom scripts and internal integration services; the
      retained pricing sources also frame per-task automation products and self-managed
      Community Edition deployments as alternatives. This is a product-defined boundary, not
      a verified estimate of category revenue.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM001"
  - id: "evidence-constrained-sizing"
    title: "Evidence-Constrained Sizing"
    body: >-
      The retained source set does not contain a defensible monetary TAM, geographic market
      total, growth rate, or n8n-specific SAM/SOM. The usable sizing lenses are consequently
      operational rather than monetary. Starter and Pro expose self-serve demand at 2,500 and
      10,000 monthly executions, while Business exposes a governance-oriented tier at 40,000
      executions and Enterprise adds custom capacity and support. Community Edition broadens
      potential adoption because software usage is not metered, but shifts cost into hosting
      and operations. These plan thresholds describe packaging and workload capacity; they must
      not be summed or treated as customer counts, revenue, market shares, or conversion rates.
      A bottom-up market model requires internal paid-account cohorts, execution distributions,
      win rates, and regional pricing that are absent from the assigned evidence.
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      Product packaging implies a two-track adoption path. Technical users can begin with a
      managed Starter or Pro plan, or operate the free Community Edition on their own
      infrastructure. As deployment importance rises, the buying center plausibly expands from
      an engineering or operations team to platform, security, and procurement stakeholders:
      Business adds SSO, LDAP, multiple environments, queue mode, and Git-based version control,
      while Enterprise adds external secret stores, log streaming, longer insights, and
      dedicated support. This buyer mapping is an inference from packaging rather than disclosed
      customer research. The legal index also shows separate self-serve, enterprise, reseller,
      AI, credit, acceptable-use, privacy, data-processing, and security documents, which
      indicates that contracting and control requirements become part of the adoption path.
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM008"
      - "CM015"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Growth Drivers and Adoption Constraints"
    body: >-
      Two mechanisms can support adoption. First, charging per completed workflow run rather
      than per step can improve the relative economics of long, multi-step automations, although
      the comparison must be made on each buyer's actual workload. Second, deployment choice
      addresses organizations that prefer managed operations as well as those that require more
      infrastructure control. The same mechanisms create constraints. A workflow triggered
      every five minutes produces about 8,640 monthly executions, enough to exceed Starter and
      consume most of Pro, so polling and agentic workloads can move buyers rapidly through
      quotas. Self-hosting removes the Community Edition execution meter but adds servers,
      backups, patching, monitoring, and engineering time. Community discussion also indicates
      that internal use and consulting are treated differently from externally managed,
      multi-business access, making definitive license review a diligence requirement rather
      than a sales assumption.
    claimRefs:
      - "CM002"
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
