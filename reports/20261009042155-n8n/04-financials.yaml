    body: "n8n's headline $5.2 billion valuation from May 2026 was established through an SAP secondary share purchase of roughly $60 million rather than a primary equity infusion. While validating enterprise alignment and Joule Studio distribution, this transaction added zero cash to n8n's balance sheet and established a 130x ARR multiple on last-disclosed $40 million ARR that heavily prices future execution."
