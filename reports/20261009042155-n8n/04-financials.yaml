company:
  name: "n8n"
chapter:
  number: 4
  title: "Financials"
  summary: "n8n has demonstrated rapid commercial expansion, scaling from a developer-focused workflow utility to an enterprise orchestration platform valued at $5.2B with roughly $40M in disclosed ARR. While bottom-up adoption across 1.7M+ monthly builders drives low-friction enterprise conversion, absent public unit economics—including gross margins, NRR, and net burn—alongside an implied 130x ARR multiple necessitate strict data-room verification for investment underwriting."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams and Pricing Architecture"
    body: "n8n operates a multi-tier commercial model anchored on its open, source-available workflow automation engine. The business has successfully transitioned beyond pure self-serve cloud subscriptions into high-value enterprise licenses and OEM distribution agreements. According to research estimates by Sacra, n8n's revenue mix in 2026 stands at approximately 55% cloud subscriptions, 30% enterprise software licenses, and 15% embedded partnerships. This distribution reflects an expanding monetization surface: entry-level developers and technical operators adopt managed cloud tiers (Starter and Pro) to avoid infrastructure maintenance, while scaling corporations license dedicated self-hosted or virtual private cloud instances to satisfy compliance, security, and administrative mandates.\n\nThe company's monetization framework relies on a fair-code Sustainable Use License for its Community Edition, allowing free self-hosted execution for internal automation while legally prohibiting commercial hosting and unauthorized software embedding. This strategic licensing architecture preserves bottom-up developer adoption as an unencumbered top-of-funnel discovery engine. As customer usage scales across enterprise departments, n8n monetizes through advanced operational capabilities rather than arbitrary task counts alone. Enterprise tiers gate essential corporate governance features, including Single Sign-On (SSO) and LDAP integration, external secret store management, real-time log streaming to corporate SIEM systems, multiple isolated staging environments, and custom high-concurrency execution queues. Consequently, n8n monetizes organizational governance, auditability, and infrastructure control rather than merely workflow volume."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs: []
  - id: "monetization-conversion-and-gtm-motion"
    title: "Monetization Conversion and GTM Dynamics"
    body: "n8n's go-to-market motion functions as a classic developer-led expansion flywheel accelerated by recent enterprise demand for agentic artificial intelligence. With over 1.7 million monthly active builders and more than 1,400 enterprise customers, the platform benefits from broad organic distribution. Adoption routinely begins with an individual software engineer or technical operations specialist deploying the self-hosted Community Edition to automate bespoke internal workflows or prototype AI agents connecting LLMs to internal tools and databases. Because developers can inspect node logic, execute local code in JavaScript or Python, and maintain complete control over data privacy, initial product adoption bypasses traditional corporate procurement friction.\n\nThe inflection from free developer experiment to commercial contract occurs when departmental usage expands and triggers corporate governance scrutiny. Field evidence demonstrates that once multi-user corporate deployments surpass dozens of active workflow creators, organizations encounter operational bottlenecks regarding credential rotation, endpoint whitelisting, corporate proxy routing, and Model Context Protocol (MCP) server approval. At this juncture, central IT and security teams mandate enterprise-grade oversight. n8n leverages this transition to upsell organizations from unmanaged Community instances to paid Business and Enterprise plans. Furthermore, n8n claims that 34% of Fortune 500 corporations utilize its platform for business-critical AI workflows, underscoring substantial penetration within large enterprises seeking unified orchestration infrastructure across diverse model providers and internal systems."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs: []
    figureRefs:
      - "FI001"
  - id: "traction-benchmarks-and-private-metric-realities"
    title: "Traction Benchmarks and Private-Metric Realities"
    body: "Financial visibility into n8n is characterized by verified commercial milestones juxtaposed against opaque private software economics. The company disclosed annual recurring revenue of approximately $40 million when closing its Series C term sheet in August 2025, representing roughly tenfold year-over-year revenue growth over the preceding twelve-month period. This rapid revenue acceleration was subsequently reinforced in May 2026 when enterprise software giant SAP acquired a minority equity stake under 1.3% through a secondary transaction valuing n8n at $5.2 billion. This transaction established an implied trailing ARR multiple of approximately 130x on last-disclosed revenue, positioning n8n at a marked valuation premium compared to mature automation peers such as Zapier (valued at ~12x ARR in historical secondary trades) and Make.com.\n\nDespite compelling top-line expansion, n8n maintains strict confidentiality regarding fundamental software unit economics. Standard institutional underwriting metrics—including gross margin percentage, net revenue retention (NRR), customer acquisition cost (CAC) payback velocity, and customer churn—remain completely undisclosed in public records. In particular, the cost structure underlying n8n's managed cloud hosting versus self-hosted license delivery is unverified. While enterprise license tiers generate near-software gross margins, cloud subscription tiers bear server infrastructure and managed execution overhead that may compress gross profitability if compute-heavy agentic workflows proliferate without proportionate execution pricing adjustments. Comprehensive investment diligence requires granular audit of cohort retention, expansion trajectories, and infrastructure gross margins."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI006"
      - "CI014"
    tableRefs:
      - "TI003"
    figureRefs: []
  - id: "capital-adequacy-and-diligence-verdict"
    title: "Capital Adequacy and Diligence Verdict"
    body: "A rigorous analysis of n8n's capital structure highlights critical distinctions between strategic enterprise validation and primary balance-sheet capitalization. Although SAP's May 2026 investment established a headline valuation of $5.2 billion, the transaction comprised approximately $60 million in secondary share purchases from existing cap-table holders rather than primary capital injected into the company. Consequently, n8n's operational balance sheet received zero fresh cash from the headline transaction, leaving its capital runway anchored primarily on the $180 million primary capital raised in its October 2025 Series C financing led by Accel. While this capital cushion appears substantial, n8n's actual net monthly cash burn, headcount expansion velocity, and runway duration cannot be confirmed from public filings.\n\nFrom an underwriting perspective, n8n represents an exceptional developer platform navigating an aggressive growth multiple. The company's developer-led moat, open-source mindshare, and enterprise penetration provide formidable defensive moats against conventional no-code incumbents. However, the business faces structural risks from hyperscale cloud providers (AWS, Microsoft Azure, Google Cloud) that possess the architectural incentive to bundle and subsidize workflow orchestration layers directly inside their proprietary foundation model ecosystems. Given the 130x multiple implied by the SAP benchmark and the absence of verified gross margin and net retention metrics, underwriters cannot validate standalone valuation sustainability without direct access to data-room management accounts."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI013"
      - "CI014"
    tableRefs: []
    figureRefs: []
