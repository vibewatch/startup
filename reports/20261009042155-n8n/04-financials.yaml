    title: "Developer Wedge as Low-CAC Enterprise Distribution"
    body: "n8n's Sustainable Use License allows free self-hosted deployment, driving over 1.7 million monthly active builders. This organic developer community acts as an efficient top-of-funnel acquisition engine, converting into enterprise contracts as organizations mandate centralized credential management, SSO, audit logging, and proxy controls."
