  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              n8n's evidenced market boundary is technical workflow automation: connecting applications, proprietary
              data, APIs, and AI models into observable workflows that can run on n8n's infrastructure or the
              customer's. The official product page claims more than 500 integrations, custom API connectivity,
              human-in-the-loop controls, and enterprise governance features. Included spend therefore sits in
              integration and workflow tooling, managed automation hosting, self-hosted automation infrastructure, and
              the governance layer needed to operate AI-enabled workflows. Raw foundation-model training, generic
              compute, and applications that do not orchestrate workflows are outside this boundary. Status-quo
              substitutes include custom scripts and internal integration services; the retained pricing sources also
              frame per-task automation products and self-managed Community Edition deployments as alternatives. This is
              a product-defined boundary, not a verified estimate of category revenue.
            claimRefs:
