  - id: FE001
    title: n8n Full-Stack System Architecture & Orchestration Layers
    type: stack
    summary: >-
      Structural breakdown of n8n across client interfaces, orchestration runtime, execution nodes, and infrastructure
      hosting tiers.
    data:
      layers:
        - label: Interface & Assistant Surface
          detail: Web Canvas UI, Form Webhook triggers, and Model Context Protocol (MCP) endpoints for Claude and Codex
        - label: Behavioral & Cognitive Layer
          detail: AI Agent node managing Tool Use, ReAct iterative reasoning loops, reflection passes, and planning logic
        - label: Topological Workflow Engine
          detail: >-
            Event-driven DAG orchestrator supporting sequential chains, sub-workflow delegation, and parallel
            fan-out/fan-in
        - label: Integration & Connector Fabric
          detail: 500+ application nodes, custom HTTP/REST connectors, binary file handlers, and vector database stores
        - label: Execution Runtime & Security
          detail: Node.js core process, task queue, SQLite/PostgreSQL persistence, and local/S3 binary file storage
        - label: Hosting & Infrastructure Modalities
          detail: Customer-managed Docker/npm self-hosted environments and fully managed multi-tenant n8n Cloud
    approximationNotes: >-
      Architecture layers generalized from official documentation, blog architecture patterns, and security disclosure
      models.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
  - id: FU001
    title: Customer Adoption Journey & Expansion Loop
    type: journey-map
    summary: >-
      Multi-stage progression from open-source self-hosted discovery to mission-critical enterprise expansion and
      retention.
    data:
      items:
        - label: 'Phase 1: Discovery & Local Prototype'
          stage: Discovery & Local Testing
          persona: Individual Software Developer / Hacker
          touchpoints:
            - GitHub open-source repository exploration
            - Community workflow template library download
            - Local Docker / npm container spin-up
          painPoints:
            - Frustration with restrictive SaaS per-task pricing models
            - Data privacy limitations on proprietary cloud automation tools
        - label: 'Phase 2: Departmental Deployment'
          stage: Departmental Production
          persona: RevOps / Engineering Squad Lead
          touchpoints:
            - Departmental n8n Cloud subscription ($24/mo base)
            - Webhook connection into internal CRM, Slack, and database
            - Internal approval of departmental automation script
          painPoints:
            - Execution volume caps and concurrency limits on starter cloud plans
            - Single-engineer dependency and unmonitored script failures
        - label: 'Phase 3: Scaling & Reliability Friction'
          stage: Scaling Bottleneck
          persona: Director of IT / DevOps Architect
          touchpoints:
            - Production failure of unversioned duct-tape workflows
            - Security audit flagging unauthenticated API tokens and webhooks
            - Engagement with specialized automation partners (e.g. Goodspeed)
          painPoints:
            - Managing infrastructure, database queuing, and CVE patch cycles
            - Lack of native SSO/SAML and centralized audit logging on free tiers
        - label: 'Phase 4: Commercial Evaluation & POC'
          stage: Enterprise Procurement & POC
          persona: Enterprise Security & Architecture Review Board
          touchpoints:
            - Evaluation of self-hosted vs cloud enterprise terms
            - Verification of Sustainable Use License boundaries
            - Execution of trial enterprise license key in sandbox
          painPoints:
            - OpSec vetting of Docker container security and SQLite vs Postgres backing
            - Internal stakeholder coordination between security, legal, and engineering
        - label: 'Phase 5: Enterprise Standardization'
          stage: Enterprise Standardization
          persona: VP IT Infrastructure / Chief Information Security Officer
          touchpoints:
            - Procurement of Self-Hosted Enterprise license with SLA
            - Integration with Okta/SAML SSO and SIEM log streaming
            - Establishment of centralized Git-controlled automation library
          painPoints:
            - Multi-year commercial lock-in vs. sustaining internal hosting overhead
            - Compliance monitoring under the Sustainable Use License for partner services
        - label: 'Phase 6: Multi-Departmental Expansion'
          stage: Company-Wide Rollout & Center of Excellence
          persona: Head of Digital Transformation / CoE Lead
          touchpoints:
            - Cross-departmental deployment (HR, Finance, Support, IT Ops)
            - Expansion into agentic AI orchestration and LLM RAG pipelines
            - Standardization of automated employee onboarding and offboarding
          painPoints:
            - Governance of decentralized citizen-developer workflows
            - API rate limiting and token consumption across external LLM providers
    approximationNotes: >-
      Journey stages modeled from technical implementation reviews, enterprise case study progression, and partner
      deployment audits.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU016
  - id: FR001
    title: Enterprise Risk Assessment Matrix
    type: matrix
    summary: >-
      Evaluation of n8n institutional risks across operational, strategic, legal, and financial dimensions comparing
      likelihood and impact.
    data:
      columns:
        - 'Impact: Low'
        - 'Impact: Moderate'
        - 'Impact: Significant'
        - 'Impact: High'
        - 'Impact: Severe'
        - 'Impact: Critical'
      rows:
        - label: 'Likelihood: High'
          values:
            - label: Minor Node Glitches
              detail: Transient UI misalignments during fast-paced builder workflow edits
              tone: neutral
            - label: Visual Schema Drift
              detail: Upstream API changes cause cascading node maintenance overhead
              tone: neutral
            - label: Execution DB Bloat
              detail: Unpruned executions and binary data exhaust self-hosted disk capacity
              tone: risk
            - label: SUL Reseller Friction
              detail: Non-OSI license restricts third parties from embedding workflows in SaaS
              tone: risk
            - label: Procurement Security Gate
              detail: Gating SSO and RBAC behind expensive tiers halts enterprise pilot expansion
              tone: risk
            - label: Worker Process Starvation
              detail: Concurrency limits cause silent workflow backpressure and stalled execution
              tone: risk
        - label: 'Likelihood: Medium'
          values:
            - label: Connector Tail Gaps
              detail: Long-tail commodity SaaS requires manual HTTP Request configuration
              tone: neutral
            - label: Queue Mode Redis Drops
              detail: Worker crashes or distributed queue desynchronization under load
              tone: risk
            - label: Statutory Compliance Breach
              detail: RAG automation without deterministic guards triggers audit penalties
              tone: risk
            - label: Valuation Multiple Overhang
              detail: 130x ARR multiple creates massive down-round vulnerability if growth stalls
              tone: risk
            - label: Multi-Main Split Brain
              detail: Desynchronized orchestration states across enterprise multi-main deployments
              tone: risk
            - label: Telemetry & Privacy Scrutiny
              detail: Enterprise friction over instance diagnostic data collection and GDPR telemetry
              tone: risk
        - label: 'Likelihood: Low'
          values:
            - label: Minor Release Regressions
              detail: Editor UI glitches and patch release bugs in rapid release cycles
              tone: neutral
            - label: GDPR DPA Disputes
              detail: Contractual disputes over international data processing terms
              tone: neutral
            - label: Worker Key Compromise
              detail: Shared symmetric encryption key exposed across worker instances
              tone: risk
            - label: SAP Strategic Platform Pivot
              detail: Key enterprise distribution partner pivots from Joule Studio embedding
              tone: risk
            - label: Credential Store Corruption
              detail: Loss or rotation failure of master encryption key in distributed clusters
              tone: risk
            - label: Complete Vendor Insolvency
              detail: Severe capital structure failure despite $240M+ institutional funding
              tone: risk
    approximationNotes: >-
      Likelihood and severity assessments synthesized from technical hosting constraints, pricing gates, and valuation
      multiples.
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A decision chain that converts public operating proof and transaction quality into a gated Track stance.
    data:
      nodes:
        - id: adoption
          label: Adoption signal
          detail: Company-reported 6x user growth and 10x revenue growth
          tone: positive
        - id: product
          label: Enterprise product
          detail: Self-hosting, governance, observability, and human oversight
          tone: positive
        - id: strategic
          label: Strategic validation
          detail: SAP stake and commercial agreement improve distribution optionality
          tone: positive
        - id: transaction
          label: Transaction quality
          detail: Small, partly secondary strategic deal is not broad primary price discovery
          tone: warning
        - id: valuation
          label: Valuation burden
          detail: Indicative ~52x to ~130x ARR depending on period and evidence source
          tone: negative
        - id: recommendation
          label: Track / research more
          detail: Require audited KPIs, deal economics, cap table, and a price margin of safety
          tone: warning
      edges:
        - from: adoption
          to: product
          label: supports
        - from: product
          to: strategic
          label: enables
        - from: strategic
          to: transaction
          label: must be qualified by
        - from: transaction
          to: valuation
          label: limits confidence in
        - from: valuation
          to: recommendation
          label: determines
    approximationNotes: >-
      ARR multiples pair transaction marks with period-specific third-party ARR evidence and are indicative, not
      audited.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
