chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Fair-Code Architecture
        blocks:
          - type: paragraph
            body: >-
              n8n was founded in Berlin, Germany in 2019 by Jan Oberhauser, who serves as Chief Executive Officer and
              sole listed executive director [CO001, CO002]. Originally conceived under the working name
              'nodemation'—combining 'node' for its visual graph representation and 'automation'—the name was contracted
              to the numeronym 'n8n' representing the eight characters between the initial and terminal letters [CO003].
              Oberhauser initiated development in 2018 to resolve recurring engineering friction in workflow scripting,
              releasing the first public version on GitHub in June 2019 followed by a formal launch in October 2019
              [CO003, CO004].


              A foundational differentiator for n8n is its source-available fair-code licensing architecture,
              distributed under the Sustainable Use License (SUL) [CO004, CO005]. Unlike traditional open-source
              licenses or closed proprietary SaaS platforms, the SUL grants users the right to inspect, modify, and
              self-host n8n internally at zero software license cost, while explicitly prohibiting third parties from
              offering n8n as a managed commercial service or embedding it in competitive commercial software without a
              commercial agreement [CO005, CO008]. This posture enabled bottom-up developer adoption across
              privacy-sensitive enterprises while protecting n8n's commercial monetization model [CO004, CO008].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
