      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The retained source set does not contain a defensible monetary TAM, geographic market total, growth rate,
              or n8n-specific SAM/SOM. The usable sizing lenses are consequently operational rather than monetary.
              Starter and Pro expose self-serve demand at 2,500 and 10,000 monthly executions, while Business exposes a
              governance-oriented tier at 40,000 executions and Enterprise adds custom capacity and support. Community
              Edition broadens potential adoption because software usage is not metered, but shifts cost into hosting
              and operations. These plan thresholds describe packaging and workload capacity; they must not be summed or
              treated as customer counts, revenue, market shares, or conversion rates. A bottom-up market model requires
              internal paid-account cohorts, execution distributions, win rates, and regional pricing that are absent
              from the assigned evidence.
