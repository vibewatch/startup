      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Two mechanisms can support adoption. First, charging per completed workflow run rather than per step can
              improve the relative economics of long, multi-step automations, although the comparison must be made on
              each buyer's actual workload. Second, deployment choice addresses organizations that prefer managed
              operations as well as those that require more infrastructure control. The same mechanisms create
              constraints. A workflow triggered every five minutes produces about 8,640 monthly executions, enough to
              exceed Starter and consume most of Pro, so polling and agentic workloads can move buyers rapidly through
              quotas. Self-hosting removes the Community Edition execution meter but adds servers, backups, patching,
              monitoring, and engineering time. Community discussion also indicates that internal use and consulting are
              treated differently from externally managed, multi-business access, making definitive license review a
              diligence requirement rather than a sales assumption.
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
