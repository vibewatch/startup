      - number: '1.2'
        title: Capitalization History, Ownership Structure, and Strategic Backing
        blocks:
          - type: paragraph
            body: >-
              n8n has raised $240 million in institutional equity financing across five distinct funding rounds [CO006].
              Following an initial $1.5 million seed round co-led by Sequoia Capital in March 2020 and a $12 million
              Series A led by Felicis Ventures in April 2021, the company accelerated institutional capitalization with
              a €55 million ($60 million) Series B led by Highland Europe in March 2025 [CO006, CO007]. In October 2025,
              Accel led a $180 million Series C financing valuing n8n at $2.5 billion post-money, supported by Meritech,
              Redpoint Ventures, and strategic vehicles including NVentures (NVIDIA) and T.Capital (Deutsche Telekom)
              [CO006, CO007].


              In May 2026, European enterprise software bellwether SAP executed a milestone strategic investment that
              doubled n8n's post-money valuation to $5.2 billion [CO006, CO007]. Under this partnership, n8n's workflow
              engine is being embedded directly into SAP Joule Studio, positioning n8n as an enterprise-grade
              orchestration layer for global corporate workflows [CO006, CO012]. While n8n benefits from tier-one
              venture syndication, public corporate disclosures reveal a concentrated governance structure: founder Jan
              Oberhauser remains the sole listed board director, leaving outside investor board observer rights and
              preference share terms unconfirmed in public records [CO002, CO006].
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO012
      - number: '1.3'
        title: Operational Scale, Revenue Traction, and Diligence Caveats
        blocks:
          - type: paragraph
            body: >-
              n8n monetizes through a multi-tier commercial model comprising self-hosted Community Edition (free
              internal use), hosted n8n Cloud subscriptions, paid on-premises Business and Enterprise licenses, and
              embedded commercial OEM distribution agreements [CO008, CO012]. Following the introduction of AI agent
              orchestration capabilities via LangChain and native node primitives, n8n experienced rapid commercial
              inflection: the company expanded its user base 6-fold and grew top-line revenue 10-fold during calendar
              2025 [CO009]. By May 2026, n8n reported a community of 1.7 million monthly active builders and over 1,400
              enterprise customers, with investor HV Capital reporting that the platform crossed €100 million in annual
              recurring revenue (ARR) [CO009, CO010].


              Independent industry research by Sacra estimates n8n's commercial revenue composition at approximately 55%
              cloud subscriptions, 30% enterprise self-hosted licenses, and 15% embedded partnerships [CO012].
              Enterprise case studies demonstrate significant organizational deployments: telecommunications operator
              Vodafone reported £2.2 million in threat intelligence savings, e-commerce platform Trendyol scaled to
              1,000 users and 700 workflows within 12 months, and recruitment portal Stepstone expanded from 4 initial
              users to an enterprise-wide rollout across 3,000 employees [CO011]. However, rigorous diligence requires
              noting that n8n's headline €100M figure represents self-reported ARR rather than audited GAAP/IFRS
              revenue, while fundamental unit economics—including gross margins, net revenue retention (NRR), and cash
              burn rate—remain private and undisclosed [CO009, CO010, CO013].
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
