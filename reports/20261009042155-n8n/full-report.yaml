        - Do not underwrite at the $5.2B strategic mark on public evidence
      - - Confidence
        - Medium
        - >-
          Multiple independent reports corroborate transaction marks; current operating metrics remain unaudited or
          estimated
        - Make the decision conditional on data-room verification
      - - Risk rating
        - High
        - Valuation, disclosure, preference, and commercialization risks dominate product-quality signals
        - Require a larger evidence and price margin of safety
      - - Valuation stance
        - Stretched
        - Indicative multiple is ~52x even using Sacra's higher April 2026 ARR estimate
        - Treat strategic pricing as an upper reference, not intrinsic value
      - - Entry discipline
        - Conditional
        - Use the $2.5B Series C and $5.2B SAP marks only as transaction references
        - Price after verifying ARR, NRR, margins, cash, dilution, and preferences
    notes: >-
      Judgments use public transaction references and third-party ARR estimates; they are not a priced term sheet,
      audited valuation, or investment return forecast.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV014
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - Rapid commercial momentum
        - Company reported 6x user growth and 10x revenue growth around the Series C
        - Audited current ARR, durable NRR, and efficient growth would strengthen
      - - Thesis
        - Enterprise deployment flexibility
        - Official product material describes self-hosting, governance, observability, and human oversight
        - Weak enterprise renewal or security outcomes would weaken
      - - Thesis
        - Strategic distribution
        - SAP acquired a small stake alongside a reported license agreement
        - Contracted minimums and measurable SAP-sourced ARR would strengthen
      - - Anti-thesis
        - Extreme valuation basis
        - Value Add VC reports ~130x trailing ARR on the older ~$40M disclosure
        - A verified current ARR base near or above the newer estimate would reduce
      - - Anti-thesis
        - Signal-quality mismatch
        - The latest mark reflects a strategic, partly secondary transaction rather than a broad primary round
        - An independent priced round with substantial primary proceeds would reduce
      - - Anti-thesis
        - License and platform pressure
        - Public discussion and Sacra identify friction for some external-facing or white-label uses
        - Clear scalable OEM terms and sustained ecosystem conversion would reduce
    notes: >-
      Company growth and product statements are issuer claims; valuation critiques and ARR estimates are third-party
      analyses with differing periods and methods.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited ARR meets or exceeds Sacra's April 2026 $100M estimate; NRR and margins are strong; SAP drives
          material paid volume
        - >-
          Value above the $5.2B strategic reference is supportable only if verified growth rapidly closes the multiple
          gap
        - Execution, strategic concentration, and multiple compression
        - Turns positive only with audited KPI and SAP-contract evidence
      - - Base
        - Growth remains strong but current ARR, margins, retention, and cash are not publicly verified
        - >-
          $2.5B Series C to $5.2B SAP marks form a reference corridor, not an intrinsic-value range; require a discount
          to the strategic mark
        - Information asymmetry, dilution, and preference overhang
        - Current public evidence supports Track rather than an assigned probability
      - - Bear
        - ARR is closer to the older ~$40M disclosure, growth normalizes, or SAP distribution under-converts
        - A financial-investor price could fall below the $2.5B prior-round reference as the revenue multiple compresses
        - Down-round, weak unit economics, license friction, and common-stock impairment
        - Triggered by weak audited cohorts, cash runway, or commercial commitments
    notes: >-
      No precise probability, target return, or hold period is assigned because current audited operating metrics,
      cap-table terms, and primary/secondary proceeds are unavailable.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV015
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Chronology of n8n's trajectory from open-source side project to a $5.2B enterprise AI orchestration platform.
    data:
      items:
        - date: '2018-01-01'
          label: Initial Prototyping
          detail: Jan Oberhauser begins development of 'nodemation' to solve workflow automation friction.
        - date: '2019-06-23'
          label: First Public Release
          detail: Public code repository launched on GitHub under fair-code licensing architecture.
        - date: '2019-10-15'
          label: Public Launch
          detail: Featured launch on Hacker News and Product Hunt, driving initial viral developer adoption.
        - date: '2020-03-13'
          label: Seed Financing
          detail: Raises $1.5M seed financing co-led by Sequoia Capital to establish commercial operations.
        - date: '2021-01-15'
          label: Cloud Launch
          detail: Commercial rollout of n8n Cloud managed SaaS, complementing self-hosted instances.
        - date: '2021-04-15'
          label: Series A Financing
          detail: Raises $12M Series A round led by Felicis Ventures with community surpassing 16,000 developers.
        - date: '2023-10-18'
          label: LangChain & AI Bet
          detail: Releases native LangChain integration, pivoting platform to AI agent orchestration.
        - date: '2025-03-24'
          label: Series B Financing
          detail: Secures €55M ($60M) Series B led by Highland Europe with user base topping 200,000.
        - date: '2025-10-09'
          label: Series C Unicorn Round
          detail: Raises $180M led by Accel at a $2.5B valuation following 10x annual revenue growth.
        - date: '2026-05-13'
          label: SAP Strategic Investment
          detail: Valuation doubles to $5.2B on SAP strategic investment and Joule Studio embedding partnership.
    approximationNotes: >-
      Dates represent confirmed calendar months and announcement dates from primary corporate records and financial
      press.
    claimRefs:
      - CO003
      - CO004
      - CO006
      - CO007
      - CO009
      - CO010
