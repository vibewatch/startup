              - CU016
      - number: '6.2'
        title: Adoption Trajectory & Operational Expansion Signals
        blocks:
          - type: paragraph
            body: >-
              Operational adoption metrics indicate substantial organic expansion across technical workflows, as
              demonstrated by public npm package distributions and internet-scale traffic data. Public npm installations
              reached 1,295,036 downloads in Q3 2026, marking a 30.0% increase over Q2 2026 and 55.1% growth
              year-over-year from Q3 2025. Although a temporary spike of 567,348 installs in August 2026 distorted
              quarterly totals, normalized run rates in July and September (averaging approximately 363,844 monthly
              installs) demonstrate compounding organic adoption across CI/CD pipelines and local developer instances.
              Concurrently, web traffic monitoring shows n8n.io sustaining approximately 10.7 million monthly visits,
              with roughly 39.6% of outbound site traffic routing directly into the hosted n8n.cloud service. However,
              because npm counts CI/CD runs and automated rebuilds, download volume functions as a proxy for developer
              activity rather than verified commercial account growth, leaving production workload conversion
              unmeasured.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Enterprise Deployment Proof, Outcomes & Implementation Friction
        blocks:
          - type: paragraph
            body: >-
              Production deployment case studies confirm that n8n delivers substantial operational velocity gains when
              replacing fragile legacy automations and bespoke scripts, but complex implementations reveal meaningful
              organizational hurdles. At Delivery Hero, n8n automated account lockout recovery across 53,000 employees,
              reducing manual handling time from 35 to 20 minutes and removing 200 hours of monthly IT downtime. At
              StepStone, engineering teams migrated more than 200 production workflows from SaaS automation tools to
              self-hosted n8n, accelerating candidate data feed prototyping from two weeks of bespoke coding to two
              hours. Similarly, Musixmatch recovered 47 days of developer capacity in four months by replacing manual
              data pipelines, and Unbabel eliminated 51% of manual translation operational tasks. Nevertheless,
              implementation partners emphasize that self-hosted instances encounter a severe 'scaling wall' when
              organizations transition from departmental pilots to high-volume production: without professional workflow
              architecture, error handling, and versioning, automation pipelines risk cascading failures and
              administrative lockout overhead.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production Scaling Wall & Self-Hosted Maintenance Debt
            body: >-
              While n8n's self-hosted model provides total data sovereignty, implementation partners observe that
              organizations frequently hit a scaling wall when automations expand beyond initial prototypes. Lacking
              enterprise observability and disciplined error handling, complex workflows degrade into fragile
              single-point-of-failure architectures that require dedicated DevOps resources or agency retainers to
              maintain.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal Structure, Fair-Code Commercial Constraints, and Enterprise Governance Deficits
        blocks:
          - type: paragraph
            body: >-
              Evaluating n8n from an institutional diligence perspective requires disentangling its popular open-source
              branding from its binding legal constraints. The company operates under a proprietary Sustainable Use
              License rather than an OSI-approved open-source license such as Apache 2.0 or MIT. This fair-code
              framework explicitly forbids commercial exploitation, specifically barring third-party teams and managed
              service providers from hosting n8n as a commercial service or embedding it into multi-tenant SaaS products
              without an Enterprise license. Community threads reveal recurring friction among commercial builders who
              encounter ambiguity when embedding n8n workflows behind customer-facing webhooks or consulting deliveries.
              Beyond intellectual property terms, n8n relies on formal legal instruments including its Master Enterprise
              Terms, AI Terms, Credit Terms, and Data Processing Agreement to govern enterprise liability. In
              high-compliance verticals such as financial services, enterprise deployments require extensive
              deterministic guardrails to prevent regulatory liability. Autonomous workflows handling statutory filings
              must enforce rigid compliance gates and human-in-the-loop approvals to mitigate risks under FINRA and SEC
              regimes where automated processing errors trigger direct penalties.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Complexity, Distributed Scaling Bottlenecks, and Self-Hosting Burden
        blocks:
          - type: paragraph
            body: >-
              The core operational risk in n8n stems from an architectural divide: simple visual prototypes run in a
              single container, but production-grade workloads demand operating a complex distributed system. Moving
              past single-instance limits requires n8n's queue mode, mandating an operational stack consisting of a
              primary instance, Redis broker, PostgreSQL database, and distributed worker nodes. Independent engineering
              analyses document that this topology introduces severe failure modes, including silent task dropouts,
              encryption key synchronization mismatches across worker nodes, and rapid execution database bloat.
              Furthermore, queue mode prohibits local filesystem binary storage, forcing teams to architect, secure, and
              maintain external S3-compatible object stores. Database growth presents an immediate operational hazard;
              unpruned execution tables exhaust storage capacity, while SQLite deployments fail to reclaim disk space
              without explicit database vacuuming routines. Technical changelogs demonstrate intense engineering
              velocity with bug fixes addressing task runner crashes on unhandled promise rejections, agent message
              deduplication, and worker shutdown drains. While enterprise plans provide observability through log
              streaming, self-hosted community operators absorb the full burden of infrastructure maintenance, patching,
              and disaster recovery.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Enterprise Commercial Gating, Counterparty Concentration, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              n8n's enterprise commercial strategy introduces acute procurement friction through aggressive feature
              gating across pricing tiers. Critical enterprise controls—including SAML SSO, LDAP directory
              synchronization, isolated workspace environments, external secrets manager integration, and Git version
              control—are withheld from the Community Edition. Gating baseline identity controls behind the €667 monthly
              Business tier or custom-quoted Enterprise tier creates a treacherous pilot-to-production cliff, frequently
              causing internal security reviews to block production rollouts. Additionally, n8n's commercial health is
              increasingly tethered to counterparty concentration and strategic dependencies. The multi-year commercial
              agreement embedding n8n's workflow canvas inside SAP Joule Studio provides massive ecosystem distribution,
              but also exposes n8n to platform pivot risks should SAP alter its native agent builder strategy.
              Financially, n8n's valuation expanded from $2.5 billion in its Series C to $5.2 billion following SAP's
              May 2026 secondary purchase against a disclosed ARR baseline of roughly $40 million. This multiple
              exceeding 130x trailing ARR leaves zero margin for execution missteps, especially as agentic code
              generation platforms begin lowering the barrier for developers to build custom workflows without no-code
              orchestration middleware.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Enterprise Feature Cliff and Operational Debt Dilemma
            body: >-
              n8n's viral open-source popularity conceals an institutional trap: bottom-up developer adoption regularly
              stalls at the enterprise security boundary because foundational IAM and governance controls are paywalled.
              Concurrently, scaling self-hosted deployments transforms automation projects into distributed systems
              engineering burdens that require dedicated DevOps overhead.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision summary and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is Track / research more, not Buy. n8n combines company-reported rapid growth, a
              self-hostable enterprise product, and strategic distribution through SAP, but public evidence does not
              establish an investable price-to-return equation. The May 2026 $5.2 billion mark was attached to a small
              strategic stake and a commercial agreement, while the most decision-relevant public ARR references are an
              approximately $40 million August 2025 disclosure reported by Value Add VC and Sacra's unaudited estimate
              of $100 million for April 2026. Even the higher estimate implies an indicative multiple near 52x when
              paired with the May strategic mark. Entry should therefore require audited current ARR, retention, gross
              margin, burn and cash, plus a complete preference stack and a material discount for strategic-price and
              information-quality risk.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV014
      - number: '8.2'
        title: Financing context and scenario boundaries
        blocks:
          - type: paragraph
            body: >-
              The October 2025 Series C provides the cleanest public primary financing reference: n8n announced $180
              million raised, $240 million of total funding, and a $2.5 billion valuation. The May 2026 SAP transaction
              more than doubled the headline mark, but reporting says the commitment included secondary purchases and a
              license agreement; it should not be treated as equivalent to fresh balance-sheet cash or a broadly
              syndicated primary round. Public totals also conflict, with Tracxn reporting $254 million against the
              company's $240 million statement. The scenario framework therefore uses the $2.5 billion and $5.2 billion
              transaction marks as reference boundaries, not intrinsic-value endpoints. A precise target return, hold
              period, or ownership outcome is not supportable until the primary/secondary split, fully diluted
              capitalization, liquidation preferences, and current operating base are disclosed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.3'
        title: Thesis, anti-thesis, and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on three observable signals: management reported 6x user growth and 10x revenue growth
              around the Series C; the product combines model choice, self-hosting, human oversight, and enterprise
              governance; and SAP's investment can improve distribution and strategic optionality. The anti-thesis is
              primarily valuation and conversion risk. Value Add VC's historical ARR reference implies an extreme
              multiple, Sacra's newer ARR figure is an estimate rather than audited disclosure, and a strategic buyer
              may pay for commercial synergies unavailable to financial investors. Licensing also creates a boundary
              around some externally managed or white-label uses. The view turns materially worse if current audited ARR
              is closer to the older disclosure, growth normalizes before margins and retention mature, SAP does not
              generate measurable paid deployment volume, or license friction weakens ecosystem-led distribution.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              SAP's willingness to buy a stake and sign a commercial agreement is evidence of strategic relevance and
              could expand future acquisition or public-market optionality. It is not proof of IPO readiness: a small
              secondary transaction does not establish a broad market-clearing price, provide known primary proceeds, or
              disclose the metrics public investors would require. Before underwriting an exit, diligence should obtain
              monthly ARR and recognized-revenue bridges, gross margin by cloud and self-hosted product, NRR and cohort
              retention, burn and unrestricted cash, customer concentration, the SAP agreement's minimum commitments and
              revenue share, and a fully diluted cap table with liquidation preferences. The thesis breaks if those
              materials show strategic revenue concentration, weak conversion from builders to paid enterprises,
              preference overhang that impairs common returns, or insufficient cash runway despite the headline funding
              history.
            claimRefs:
              - CV005
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Track n8n and pursue data-room diligence; do not treat a strategic secondary mark as sufficient evidence
              for a financial-investor entry at $5.2 billion.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV014
          - type: callout
            title: Main thesis-break condition
            body: >-
              The downside case activates if audited ARR and retention do not close the gap between the historical $40
              million disclosure and the newer $100 million estimate, especially if SAP-related revenue lacks minimum
              commitments.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV015
