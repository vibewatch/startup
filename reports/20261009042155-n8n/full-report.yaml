      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Product packaging implies a two-track adoption path. Technical users can begin with a managed Starter or
              Pro plan, or operate the free Community Edition on their own infrastructure. As deployment importance
              rises, the buying center plausibly expands from an engineering or operations team to platform, security,
              and procurement stakeholders: Business adds SSO, LDAP, multiple environments, queue mode, and Git-based
              version control, while Enterprise adds external secret stores, log streaming, longer insights, and
              dedicated support. This buyer mapping is an inference from packaging rather than disclosed customer
              research. The legal index also shows separate self-serve, enterprise, reseller, AI, credit,
              acceptable-use, privacy, data-processing, and security documents, which indicates that contracting and
              control requirements become part of the adoption path.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
