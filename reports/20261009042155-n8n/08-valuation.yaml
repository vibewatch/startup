company:
  name: n8n
chapter:
  number: 8
  title: Valuation
  summary: >-
    n8n has strong growth and strategic-validation signals, but the latest $5.2 billion
    mark came from a small SAP stake tied to a commercial agreement and implies a very
    demanding multiple on public ARR evidence. The appropriate stance is Track / research
    more with medium confidence, high valuation-and-evidence risk, and no underwriting at
    the strategic mark until current operating metrics and preference terms are verified.
sections:
  - id: decision-summary
    title: Decision summary and entry discipline
    body: >-
      The recommendation is Track / research more, not Buy. n8n combines company-reported
      rapid growth, a self-hostable enterprise product, and strategic distribution through
      SAP, but public evidence does not establish an investable price-to-return equation.
      The May 2026 $5.2 billion mark was attached to a small strategic stake and a commercial
      agreement, while the most decision-relevant public ARR references are an approximately
      $40 million August 2025 disclosure reported by Value Add VC and Sacra's unaudited
      estimate of $100 million for April 2026. Even the higher estimate implies an indicative
      multiple near 52x when paired with the May strategic mark. Entry should therefore
      require audited current ARR, retention, gross margin, burn and cash, plus a complete
      preference stack and a material discount for strategic-price and information-quality
      risk.
    claimRefs: [CV006, CV007, CV008, CV014]
    tableRefs: [TV001]
  - id: financing-and-scenarios
    title: Financing context and scenario boundaries
    body: >-
      The October 2025 Series C provides the cleanest public primary financing reference:
      n8n announced $180 million raised, $240 million of total funding, and a $2.5 billion
      valuation. The May 2026 SAP transaction more than doubled the headline mark, but
      reporting says the commitment included secondary purchases and a license agreement;
      it should not be treated as equivalent to fresh balance-sheet cash or a broadly
      syndicated primary round. Public totals also conflict, with Tracxn reporting $254
      million against the company's $240 million statement. The scenario framework therefore
      uses the $2.5 billion and $5.2 billion transaction marks as reference boundaries, not
      intrinsic-value endpoints. A precise target return, hold period, or ownership outcome
      is not supportable until the primary/secondary split, fully diluted capitalization,
      liquidation preferences, and current operating base are disclosed.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV013]
    tableRefs: [TV003]
  - id: thesis-and-antithesis
    title: Thesis, anti-thesis, and downside triggers
    body: >-
      The thesis rests on three observable signals: management reported 6x user growth and
      10x revenue growth around the Series C; the product combines model choice, self-hosting,
      human oversight, and enterprise governance; and SAP's investment can improve
      distribution and strategic optionality. The anti-thesis is primarily valuation and
      conversion risk. Value Add VC's historical ARR reference implies an extreme multiple,
      Sacra's newer ARR figure is an estimate rather than audited disclosure, and a
      strategic buyer may pay for commercial synergies unavailable to financial investors.
      Licensing also creates a boundary around some externally managed or white-label uses.
      The view turns materially worse if current audited ARR is closer to the older
      disclosure, growth normalizes before margins and retention mature, SAP does not
      generate measurable paid deployment volume, or license friction weakens ecosystem-led
      distribution.
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV015]
    tableRefs: [TV002]
  - id: exit-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      SAP's willingness to buy a stake and sign a commercial agreement is evidence of
      strategic relevance and could expand future acquisition or public-market optionality.
      It is not proof of IPO readiness: a small secondary transaction does not establish a
      broad market-clearing price, provide known primary proceeds, or disclose the metrics
      public investors would require. Before underwriting an exit, diligence should obtain
      monthly ARR and recognized-revenue bridges, gross margin by cloud and self-hosted
      product, NRR and cohort retention, burn and unrestricted cash, customer concentration,
      the SAP agreement's minimum commitments and revenue share, and a fully diluted cap
      table with liquidation preferences. The thesis breaks if those materials show
      strategic revenue concentration, weak conversion from builders to paid enterprises,
      preference overhang that impairs common returns, or insufficient cash runway despite
      the headline funding history.
    claimRefs: [CV005, CV012, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current judgment
      - Evidence basis
      - Investment implication
    rows:
      - [Recommendation, "Track / research more", "Strong growth and strategic signals, but incomplete price support", "Do not underwrite at the $5.2B strategic mark on public evidence"]
      - [Confidence, Medium, "Multiple independent reports corroborate transaction marks; current operating metrics remain unaudited or estimated", "Make the decision conditional on data-room verification"]
      - [Risk rating, High, "Valuation, disclosure, preference, and commercialization risks dominate product-quality signals", "Require a larger evidence and price margin of safety"]
      - [Valuation stance, Stretched, "Indicative multiple is ~52x even using Sacra's higher April 2026 ARR estimate", "Treat strategic pricing as an upper reference, not intrinsic value"]
      - [Entry discipline, Conditional, "Use the $2.5B Series C and $5.2B SAP marks only as transaction references", "Price after verifying ARR, NRR, margins, cash, dilution, and preferences"]
    notes: "Judgments use public transaction references and third-party ARR estimates; they are not a priced term sheet, audited valuation, or investment return forecast."
    claimRefs: [CV002, CV004, CV006, CV007, CV008, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - [Thesis, Rapid commercial momentum, "Company reported 6x user growth and 10x revenue growth around the Series C", "Audited current ARR, durable NRR, and efficient growth would strengthen"]
      - [Thesis, Enterprise deployment flexibility, "Official product material describes self-hosting, governance, observability, and human oversight", "Weak enterprise renewal or security outcomes would weaken"]
      - [Thesis, Strategic distribution, "SAP acquired a small stake alongside a reported license agreement", "Contracted minimums and measurable SAP-sourced ARR would strengthen"]
      - [Anti-thesis, Extreme valuation basis, "Value Add VC reports ~130x trailing ARR on the older ~$40M disclosure", "A verified current ARR base near or above the newer estimate would reduce"]
      - [Anti-thesis, Signal-quality mismatch, "The latest mark reflects a strategic, partly secondary transaction rather than a broad primary round", "An independent priced round with substantial primary proceeds would reduce"]
      - [Anti-thesis, License and platform pressure, "Public discussion and Sacra identify friction for some external-facing or white-label uses", "Clear scalable OEM terms and sustained ecosystem conversion would reduce"]
    notes: "Company growth and product statements are issuer claims; valuation critiques and ARR estimates are third-party analyses with differing periods and methods."
    claimRefs: [CV005, CV006, CV007, CV009, CV010, CV011]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited ARR meets or exceeds Sacra's April 2026 $100M estimate; NRR and margins are strong; SAP drives material paid volume", "Value above the $5.2B strategic reference is supportable only if verified growth rapidly closes the multiple gap", "Execution, strategic concentration, and multiple compression", "Turns positive only with audited KPI and SAP-contract evidence"]
      - [Base, "Growth remains strong but current ARR, margins, retention, and cash are not publicly verified", "$2.5B Series C to $5.2B SAP marks form a reference corridor, not an intrinsic-value range; require a discount to the strategic mark", "Information asymmetry, dilution, and preference overhang", "Current public evidence supports Track rather than an assigned probability"]
      - [Bear, "ARR is closer to the older ~$40M disclosure, growth normalizes, or SAP distribution under-converts", "A financial-investor price could fall below the $2.5B prior-round reference as the revenue multiple compresses", "Down-round, weak unit economics, license friction, and common-stock impairment", "Triggered by weak audited cohorts, cash runway, or commercial commitments"]
    notes: "No precise probability, target return, or hold period is assigned because current audited operating metrics, cap-table terms, and primary/secondary proceeds are unavailable."
    claimRefs: [CV002, CV004, CV006, CV007, CV008, CV015]
