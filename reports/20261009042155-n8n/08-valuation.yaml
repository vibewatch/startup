callouts:
  - calloutType: recommendation
    title: Price-sensitive recommendation
    body: >-
      Track n8n and pursue data-room diligence; do not treat a strategic secondary mark as
      sufficient evidence for a financial-investor entry at $5.2 billion.
    claimRefs: [CV005, CV014]
  - calloutType: risk
    title: Main thesis-break condition
    body: >-
      The downside case activates if audited ARR and retention do not close the gap between
      the historical $40 million disclosure and the newer $100 million estimate, especially
      if SAP-related revenue lacks minimum commitments.
    claimRefs: [CV006, CV007, CV015]
