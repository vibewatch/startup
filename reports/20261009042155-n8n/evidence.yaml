evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited GAAP/IFRS revenue breakdown, gross margin percentage, net revenue retention (NRR), and cash burn rate.
    whyItMatters: >-
      Publicly cited €100M figure is self-reported ARR; actual profitability and margin structure cannot be validated
      without financial data-room access.
    diligencePath: Request audited financial statements, historical cash-flow statements, and cohort NRR analyses under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent category revenue, growth, geography, and segment data plus a documented mapping from those categories
      to n8n's product boundary.
    whyItMatters: >-
      Without category denominators and boundary reconciliation, a monetary TAM, SAM, or SOM would be an unsupported
      precision claim.
    diligencePath: >-
      Obtain current independent iPaaS and workflow-automation datasets, reconcile definitions, and build a bottom-up
      model using eligible accounts and workload volumes.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: community-conversion
    missingEvidence: >-
      Cohort counts linking active Community Edition deployments to paid Starter, Pro, Business, and Enterprise
      accounts.
    whyItMatters: Conversion and retention determine how much of broad free adoption can become obtainable paid demand.
    diligencePath: >-
      Request anonymized activation cohorts, paid-conversion curves, execution distributions, retention, and expansion
      by deployment type from the data room.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: sap-oem-commercial-terms
    missingEvidence: >-
      Detailed revenue-share percentage, minimum licensing commitments, and hosting margin distribution between SAP and
      n8n for Joule Studio deployments.
    whyItMatters: >-
      Directly impacts forward revenue quality, cash flow margins, and commercial defensibility of n8n's flagship
      enterprise distribution channel.
    diligencePath: Review confidential OEM commercial agreements and partner schedules during data room diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited gross margin percentage, net revenue retention (NRR), and customer acquisition cost (CAC) payback periods.
    whyItMatters: >-
      Without audited margins and retention figures, underwriting n8n's long-term unit economics and operating leverage
      is impossible.
    diligencePath: Request confidential management accounts and cohort retention data in data room review.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Audited balance sheet detailing cash and cash equivalents, monthly burn rate, and committed credit facilities.
    whyItMatters: >-
      The May 2026 SAP transaction was a secondary share purchase of existing equity that provided zero primary cash to
      n8n's balance sheet.
    diligencePath: Verify post-Series C cash balance, monthly operating burn, and forward runway in diligence data room.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: deployment-telemetry
    missingEvidence: >-
      Granular production telemetry differentiating active self-hosted enterprise deployments from community hobbyist
      instances.
    whyItMatters: Affects assessment of true enterprise operational exposure and support burden under critical CVE patching cycles.
    diligencePath: Request customer deployment breakdown by license tier and self-hosted vs managed cloud mix from n8n data room.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: minor
    topic: npm-supply-chain
    missingEvidence: >-
      Detailed internal audit logs on whether recent historical npm supply-chain attempts compromised production
      customer credentials.
    whyItMatters: Directly resolves whether historical security disclosures resulted in secondary downstream credential leaks.
    diligencePath: Review third-party penetration test reports and forensic incident summaries in enterprise compliance repository.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited figures for Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn rates across Cloud
      and Enterprise tiers.
    whyItMatters: >-
      Without retention and churn data, it is impossible to verify whether n8n's rapid top-of-funnel adoption translates
      into durable enterprise lifetime value.
    diligencePath: Request confidential cohort retention tables and renewal rates by customer size from n8n's management data room.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table-coverage
    missingEvidence: Comprehensive roster of all 1,400+ enterprise accounts and their full contract values.
    whyItMatters: >-
      Public case studies in table TU003 represent a curated sample of successful production deployments, leaving the
      broader enterprise cohort unobserved.
    diligencePath: Obtain the anonymized or named enterprise customer master list and ARR distribution from company management.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: enterprise-governance
    missingEvidence: >-
      Audited SOC2 Type II examination reports, ISO 27001 certificates, and historical penetration testing remediation
      summaries are restricted to private data room access.
    whyItMatters: >-
      Independent security audits determine whether enterprise infosec teams will grant production deployment approval
      for self-hosted or cloud-hosted instances.
    diligencePath: >-
      Request n8n's complete SOC2 Type II report, Trust Center compliance package, and latest third-party penetration
      test results under NDA.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-risk
    missingEvidence: >-
      Contractual revenue-share percentages, minimum annual revenue commitments, and exclusivity clauses in the SAP
      Joule Studio OEM agreement remain confidential.
    whyItMatters: >-
      High concentration of valuation support and enterprise distribution in a single corporate partner creates critical
      revenue durability exposure.
    diligencePath: >-
      Review the full text of the SAP multi-year commercial agreement, revenue recognition terms, and
      termination-for-convenience provisions in the legal data room.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: current-unit-economics
    missingEvidence: Audited current ARR, recognized revenue, NRR, gross margin by product, burn, unrestricted cash, and cash runway.
    whyItMatters: >-
      These inputs determine whether growth can close the valuation-multiple gap and whether additional financing is
      likely.
    diligencePath: >-
      Obtain audited financials, monthly KPI bridges, cohort schedules, bank statements, and the board-approved
      operating plan.
    relatedQuestionRefs:
      - QV004
      - QV008
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: transaction-structure
    missingEvidence: >-
      Primary-versus-secondary proceeds, fully diluted capitalization, option pool, liquidation preferences,
      anti-dilution rights, and SAP commercial economics.
    whyItMatters: >-
      Headline valuation and funding raised do not establish cash available or common-stock proceeds under downside
      outcomes.
    diligencePath: >-
      Review the capitalization table, financing documents, waterfall, shareholder register, and complete SAP investment
      and license agreements.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Audited public-company-quality controls, forecast history, concentration, legal readiness, and a defensible IPO or
      acquisition timetable.
    whyItMatters: >-
      A strategic investment signals relevance but does not establish readiness, timing, or a supportable hold-period
      return.
    diligencePath: >-
      Interview the CFO and board, review audit and control-readiness materials, and test strategic-buyer and
      public-comparable assumptions.
    relatedQuestionRefs:
      - QV010
    relatedTableRefs:
      - TV001
