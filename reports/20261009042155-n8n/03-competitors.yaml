callouts:
  - calloutType: "insight"
    title: "Execution-Based Metering Creates Structural Defensibility Against iPaaS Giants"
    body: "Because n8n charges per complete workflow run rather than per individual node action, complex agentic workflows—which frequently execute dozens of LLM calls, RAG retrievals, and data transforms—cost identical platform fees on n8n while causing bill shock on step-metered competitors like Zapier and Make."
    claimRefs:
      - "CP003"
      - "CP007"
  - calloutType: "risk"
    title: "AI Agent Usability Bottleneck Leaves Flank Exposed to Native Builders"
    body: "n8n's architecture treats foundation models as API nodes requiring external API keys, rate limit management, and custom JSON parsing. Platforms like MindStudio that offer unified access to 200+ models with built-in reasoning threaten to displace n8n among non-technical and operations teams building autonomous workflows."
    claimRefs:
      - "CP005"
      - "CP006"
