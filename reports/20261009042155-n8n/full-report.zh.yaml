      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 企业功能断崖与运营债务困境
            body: >-
              n8n 病毒式的开源热度掩盖了一个机构陷阱：自下而上的开发者采用经常在企业安全边界处停滞，因为基础 IAM 和治理控制需要付费。同时，自托管部署扩展会把自动化项目变成分布式系统工程负担，需要专门的 DevOps
              开销。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策摘要与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，而不是买入。n8n 兼具公司自报的快速增长、可自托管的企业产品，以及 SAP 带来的战略分销，但公开证据尚未建立可投资的价格—回报方程。2026 年 5 月的 $5.2B
              估值对应的是一笔小额战略股权和商业协议；与决策最相关的公开 ARR 参考，一项是 Value Add VC 报告的 2025 年 8 月约 $40M，另一项是 Sacra 对 2026 年 4 月 $100M
              的未经审计估计。即使采用较高估计，结合 5 月战略估值，指示性倍数仍接近 52x。因此，入场前必须取得经审计的当前
              ARR、留存、毛利率、现金消耗和现金余额、完整优先股堆叠，并针对战略定价和信息质量风险要求明显折价。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
