        - label: 企业运营
          value: 200+ concurrent executions
          detail: 官方 Enterprise 功能门槛；价格和配额定制
        - label: 可获得的付费市场
          value: Not disclosed
          detail: 需要付费客户群、转化、留存和赢单率证据
    approximationNotes: 各层使用不同单位，不能相加，也不成比例。它们展示证据可得性和封装筛选条件，而非 TAM/SAM/SOM 数值、市场份额或转化漏斗。
