        - 过高
        - 即便采用 Sacra 较高的 2026 年 4 月 ARR 估算，指示性倍数仍约为 52 倍
        - 将战略定价视为上限参考，而非内在价值
      - - 入场纪律
        - 有条件
        - 仅将 $2.5B Series C 和 $5.2B SAP 估值作为交易参考
