      - number: '1.2'
        title: 资本化历程、所有权结构与战略支持
        blocks:
          - type: paragraph
            body: >-
              n8n 通过五轮不同融资累计获得 $240M 机构股权融资 [CO006]。公司先后完成 2020 年 3 月由 Sequoia Capital 联合领投的 $1.5M 种子轮，以及 2021 年 4 月由
              Felicis Ventures 领投的 $12M A 轮；随后于 2025 年 3 月由 Highland Europe 领投 €55M（$60M）B 轮，机构资本化明显提速 [CO006,
              CO007]。2025 年 10 月，Accel 领投 $180M C 轮，使 n8n 投后估值达到 $2.5B；Meritech、Redpoint Ventures，以及 NVentures（NVIDIA）和
              T.Capital（Deutsche Telekom）等战略投资工具也参与其中 [CO006, CO007]。


              2026 年 5 月，欧洲企业软件龙头 SAP 完成一笔里程碑式战略投资，将 n8n 投后估值翻倍至 $5.2B [CO006, CO007]。在这项合作下，n8n 的工作流引擎正被直接嵌入 SAP Joule
              Studio，使 n8n 成为面向全球企业工作流的企业级编排层 [CO006, CO012]。n8n 虽拥有一线创投联合投资，但公开公司披露显示其治理结构高度集中：创始人 Jan Oberhauser
              仍是唯一列名的董事，外部投资人的董事会观察员权利和优先股条款尚未在公开记录中得到确认 [CO002, CO006]。
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO012
