              - CV011
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              SAP 愿意购买股份并签署商业协议，证明 n8n 具有战略相关性，也可能扩大未来收购或公开市场选择权。但这不能证明已具备 IPO
              准备度：小额二级交易没有建立广泛市场出清价格，没有带来已知一级资金，也没有披露公开市场投资人所需的指标。在判断退出前，尽调应取得月度 ARR 与确认收入桥接、云端和自托管产品的毛利率、NRR 与 cohort
              留存、现金消耗和不受限制现金、客户集中度、SAP 协议的最低承诺和收入分成，以及包含清算优先权的完全稀释股权结构表。如果这些材料显示战略收入过度集中、构建者向付费企业转化弱、优先股堆叠侵蚀普通股回报，或尽管
              headline 融资历史亮眼却现金 runway 不足，投资论点就会失效。
            claimRefs:
              - CV005
              - CV012
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
