      - number: '5.3'
        title: 安全架构与漏洞爆炸半径
        blocks:
          - type: paragraph
            body: >-
              n8n 实例充当保存 API token、OAuth 凭证和数据库连接器的中央自动化枢纽，因此一旦被攻破，影响会沿着集成的企业基础设施大范围扩散。2026 年 1 月 7 日，安全研究人员披露
              CVE-2026-21858（CVSS 10.0），这是一个名为 Ni8mare 的严重未认证远程代码执行漏洞，影响 1.65.0 至 1.121.0 之前的自托管版本。漏洞源于 webhook 请求处理器中的
              Content-Type 混淆：攻击者向 Form Webhook 端点提交 application/json 时，解析器未强制执行 multipart/form-data 约束，从而允许任意读取 SQLite
              数据库和加密密钥，随后伪造会话 cookie，并通过管理节点执行命令。尽管 n8n 发布了修复版本（1.121.0），该漏洞仍暴露出 webhook 信任边界的根本风险。
