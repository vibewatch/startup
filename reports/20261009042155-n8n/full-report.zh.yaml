      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 牛市、基准与熊市情景框架
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 牛市
        - 经审计 ARR 达到或超过 Sacra 2026 年 4 月 $100M 的估算；NRR 和利润率强劲；SAP 带来可观的付费规模
        - 只有经核实的增长迅速填平倍数缺口，$5.2B 战略参考值以上的估值才有支撑
        - 执行、战略集中和倍数压缩
        - 只有拿到经审计 KPI 和 SAP 合同证据后，信号才转为正面
      - - 基准
        - 增长仍然强劲，但当前 ARR、利润率、留存和现金尚未得到公开核实
        - $2.5B Series C 到 $5.2B SAP 估值构成参考区间，而非内在价值范围；需要相对战略估值打折
        - 信息不对称、稀释和优先权悬置
        - 当前公开证据支持“跟踪”，而不是给出概率
      - - 熊市
        - ARR 更接近较早的约 $40M 披露，增长趋于正常，或 SAP 分销转化不足
        - 随着收入倍数压缩，金融投资者愿意支付的价格可能跌破 $2.5B 上一轮参考值
        - 下调轮、单位经济性疲弱、许可证摩擦和普通股减值
        - 弱势经审计客户群、现金 runway 或商业承诺将触发该情景
    notes: 由于当前经审计运营指标、股权结构条款以及新股 / 老股交易所得均不可得，未设定精确概率、目标回报或持有期。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: n8n 从开源副项目走向 $5.2B 企业 AI 编排平台的历程。
    data:
      items:
        - date: '2018-01-01'
          label: 初始原型开发
          detail: Jan Oberhauser 开始开发 “nodemation”，解决工作流自动化摩擦。
        - date: '2019-06-23'
          label: 首次公开发布
          detail: 以 fair-code 许可架构在 GitHub 上发布公开代码仓库。
        - date: '2019-10-15'
          label: 公开上线
          detail: 在 Hacker News 和 Product Hunt 上重点发布，推动开发者最初的病毒式采用。
        - date: '2020-03-13'
          label: 种子融资
          detail: 获得 Sequoia Capital 共同领投的 $1.5M 种子融资，建立商业运营。
        - date: '2021-01-15'
          label: 云服务上线
          detail: n8n Cloud 托管 SaaS 商业化推出，与自托管实例互补。
        - date: '2021-04-15'
          label: Series A 融资
          detail: 获 Felicis Ventures 领投的 $12M Series A，社区开发者超过 16,000 名。
        - date: '2023-10-18'
          label: LangChain 与 AI 押注
          detail: 发布原生 LangChain 集成，将平台转向 AI 智能体编排。
        - date: '2025-03-24'
          label: Series B 融资
          detail: 获 Highland Europe 领投的 €55M（$60M）Series B，用户数超过 200,000。
        - date: '2025-10-09'
          label: Series C 独角兽轮
          detail: 在年收入增长 10 倍后，以 $2.5B 估值获得 Accel 领投的 $180M 融资。
        - date: '2026-05-13'
          label: SAP 战略投资
          detail: SAP 战略投资及 Joule Studio 嵌入合作使估值翻倍至 $5.2B。
    approximationNotes: 日期代表来自公司一手记录和财经媒体的已确认日历月份及公告日期。
