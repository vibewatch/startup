      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              两种机制可以支持采用。第一，按完整工作流运行收费，而不是按步骤收费，可以改善长链路、多步骤自动化的相对经济性，但比较必须基于每位买方的实际工作负载。第二，部署选择同时满足偏好托管运维的组织，以及需要更多基础设施控制权的组织。这些机制也会带来约束。每五分钟触发一次的工作流每月约产生
              8,640 次执行，足以超过 Starter 并消耗 Pro 的大部分额度，因此轮询和代理型工作负载会让买方很快穿越配额。自托管取消了 Community Edition
              的执行计量，却增加服务器、备份、补丁、监控和工程时间。社区讨论还表明，内部使用和咨询服务与对外托管、多业务访问的处理方式不同，因此明确审阅许可是尽调要求，而不是销售假设。
            claimRefs:
              - CM002
