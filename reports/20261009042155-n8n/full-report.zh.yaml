  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              n8n 围绕其开放、源码可见的工作流自动化引擎，采用多层商业模式。公司已从纯自助云订阅，扩展到高价值企业许可和 OEM 分销协议。根据 Sacra 的研究估计，n8n 2026 年收入构成为：云订阅约
              55%、企业软件许可 30%、嵌入式合作 15%。这一分布反映出不断扩大的变现面：入门级开发者和技术运营人员采用托管云层级（Starter 和
              Pro），以避免基础设施维护；扩大规模的企业则购买专属自托管或虚拟私有云实例，以满足合规、安全和管理要求。


              公司的变现框架依靠 fair-code Sustainable Use License 支撑 Community
              Edition，允许内部自动化免费自托管执行，同时依法禁止商业托管和未经授权的软件嵌入。这种战略许可架构保留了自下而上的开发者采用，把它作为无阻碍的漏斗顶端发现引擎。客户使用扩展到企业部门后，n8n
              通过高级运营能力，而不只是任意任务数来变现。企业层级把关键公司治理能力设为门槛，包括 Single Sign-On（SSO）和 LDAP 集成、外部密钥存储管理、实时日志流入企业 SIEM
              系统、多个隔离的预发布环境，以及高并发自定义执行队列。因此，n8n 变现的是组织治理、可审计性和基础设施控制，而不只是工作流数量。
