      - number: '3.3'
        title: 差异化持久性、护城河演化与龙头回应
        blocks:
          - type: paragraph
            body: >-
              n8n 的可持续竞争优势建立在两道架构护城河上：数据驻留主权和按执行计价的效率。对金融服务、医疗和政府等受监管行业而言，n8n 免费的自托管 Community Edition
              和企业本地部署提供绝对的数据主权，确保客户 payload 不离开企业 VPC 边界；这是一条门槛，使 Zapier 和 Make 这类纯 SaaS 平台失去资格 [CP002, CP003]。n8n
              按完整工作流执行计费，而不是按节点或步骤计费，因此复杂 RAG 管道和多步骤代理循环的成本远低于按步骤计费的竞争者，商业持久性也由此增强 [CP003, CP007]。SAP 以 $5.2B
              估值进行少数股权投资，并将 n8n 直接嵌入 SAP 全球企业 ERP 体系中的 Joule Studio，显著扩大了战略分销 [CP008, CP009]。但平台商品化、开发者上手曲线陡峭，以及
              Microsoft Power Automate 等龙头捆绑原生企业套件，都在对这一定位施压 [CP001, CP005]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
