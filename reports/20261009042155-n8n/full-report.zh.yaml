        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 跟踪 n8n 并推进 data room 尽调；不要把战略二级交易估值视作财务投资人在 $5.2B 入场的充分证据。
            calloutType: recommendation
