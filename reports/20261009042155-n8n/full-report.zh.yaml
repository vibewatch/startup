      - number: '7.3'
        title: 企业商业门槛、交易对手集中与估值悬置
        blocks:
          - type: paragraph
            body: >-
              n8n 的企业商业策略通过各定价层级的激进功能门槛，制造了明显采购摩擦。关键企业控制能力，包括 SAML SSO、LDAP 目录同步、隔离工作区、外部密钥管理器集成和 Git 版本控制，都不提供给
              Community Edition。把基础身份控制放在每月 €667 的 Business 层级或定制报价的 Enterprise
              层级后，试点到生产之间形成危险断崖，内部安全审查经常因此阻止生产上线。此外，n8n 的商业健康越来越依赖交易对手集中和战略依赖。把 n8n 工作流画布嵌入 SAP Joule Studio
              的多年商业协议带来了巨大的生态分销，但如果 SAP 改变原生代理构建策略，也会让 n8n 暴露于平台转向风险。财务上，n8n 估值从 C 轮的 $2.5B，随着 SAP 2026 年 5 月二级购买、在约
              $40M ARR 披露基准上升至 $5.2B。这一超过 130x trailing ARR 的倍数几乎没有给执行失误留下空间，尤其是代理型代码生成平台开始降低开发者无需无代码编排中间件即可构建定制工作流的门槛。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
