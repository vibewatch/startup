              保留的来源集合没有足以支撑的货币化 TAM、地域市场总额、增长率，或 n8n 特定的 SAM / SOM。因此，可用的规模视角是运营性的，而非货币性的。Starter 和 Pro 分别提供每月 2,500 次和
