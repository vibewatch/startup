      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 按执行计量，形成抵御 iPaaS 巨头的结构性防御
            body: >-
              n8n 按完整工作流运行收费，而不是按单个节点动作收费；复杂代理工作流通常会执行数十次 LLM 调用、RAG 检索和数据转换，在 n8n 上平台费不变，却会让 Zapier、Make
              等按步骤计费的竞争者产生账单冲击。
            calloutType: insight
            claimRefs:
              - CP003
              - CP007
          - type: callout
            title: AI 代理易用性瓶颈，使侧翼暴露给原生构建平台
            body: >-
              n8n 的架构把基础模型当作 API 节点，需要外部 API 密钥、速率限制管理和自定义 JSON 解析。MindStudio 等平台提供内置推理能力并统一访问 200
              多个模型，可能在构建自主工作流的非技术和运营团队中取代 n8n。
            calloutType: risk
            claimRefs:
              - CP005
