              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.3'
        title: 投资论点、反论点与下行触发器
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在三个可观察信号上：管理层在 C 轮前后报告用户增长 6 倍、收入增长 10 倍；产品兼具模型选择、自托管、人类监督和企业治理；SAP
              投资能够改善分销和战略选择权。反论点主要是估值和转化风险。Value Add VC 的历史 ARR 参考意味着极高倍数，Sacra 较新的 ARR
              数字是估计而非经审计披露，而战略买方可能为商业协同支付财务投资人无法获得的溢价。许可也给部分对外托管或白标使用划出边界。如果当前经审计 ARR 更接近旧披露、增长在毛利和留存成熟前归一化、SAP
              没有带来可量化的付费部署量，或许可摩擦削弱生态驱动的分销，这一观点会明显恶化。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
