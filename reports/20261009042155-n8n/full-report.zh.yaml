              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 竞争者画像、定价形态与战略能力
        blocks:
          - type: paragraph
            body: >-
              对 n8n 主要商业竞争者的详细分析显示，它们在平台范围、单位经济和目标买方画像上差异明显。Zapier 是根深蒂固的消费者及小企业基准，依靠 8,000 多个连接器和直观的两步触发—动作流程，起价 $19.99
              / 月；但其按任务计费，每一步都会消耗配额，因此会惩罚高用量企业自动化 [CP001, CP003]。Make 提供可视化流程图画布、3,000 多个连接器和高级分支逻辑，起价 $9 /
              月，价格较为亲民；但按操作和 credit 计量的定价模式同样会随着工作流扩展而不可预测地增长 [CP001, CP003, CP007]。在开源领域，Activepieces 采用宽松的 MIT
              许可，按每条活跃流程 $5 / 月的可预测模式收费，直接挑战 n8n，并吸引严格要求开源许可、拒绝 n8n Sustainable Use License 的团队 [CP001,
              CP004]。与此同时，MindStudio 等原生 AI 代理平台无需用户管理不同的外部 API 凭证，即可直接访问 200 多个基础模型；这回应了市场对 n8n 以 API 为中心的 AI
              节点带来运维负担的抱怨 [CP005, CP006]。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
