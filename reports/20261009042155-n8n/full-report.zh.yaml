chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立根基与 fair-code 架构
        blocks:
          - type: paragraph
            body: >-
              n8n 于 2019 年在德国柏林由 Jan Oberhauser 创立，他现任 CEO，也是唯一列名的执行董事 [CO001, CO002]。项目最初以工作名 “nodemation”
              构思——“node”代表可视化图结构，“automation”代表自动化——随后缩写为数字命名 “n8n”，指首尾字母之间的八个字符 [CO003]。Oberhauser 于 2018
              年启动开发，着手解决工作流脚本中的反复工程摩擦，并于 2019 年 6 月在 GitHub 发布首个公开版本，随后于 2019 年 10 月正式上线 [CO003, CO004]。


              n8n 的根本差异化在于其 source-available 的 fair-code 许可架构，采用 Sustainable Use License（SUL）分发 [CO004,
              CO005]。不同于传统开源许可或封闭式专有 SaaS 平台，SUL 允许用户检查、修改并在内部自托管 n8n，且无需支付软件许可费；同时明确禁止第三方在没有商业协议的情况下将 n8n
              作为托管商业服务提供，或嵌入具有竞争关系的商业软件 [CO005, CO008]。这一定位推动了隐私敏感型企业中的自下而上开发者采用，同时保护了 n8n 的商业变现模式 [CO004, CO008]。
            claimRefs:
