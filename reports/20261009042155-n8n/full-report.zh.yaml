    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              有证据支持的 n8n 市场边界是技术型工作流自动化：把应用、专有数据、API 和 AI 模型连接成可观察的工作流，并运行在 n8n 或客户自己的基础设施上。官方产品页宣称拥有 500 多个集成、自定义 API
              连接、人机协同控制和企业治理能力。因此，纳入的支出包括集成与工作流工具、托管自动化、自动化自托管基础设施，以及运行 AI
              工作流所需的治理层。基础模型训练、通用算力和不负责编排工作流的应用均在边界之外。现状替代方案包括自建脚本和内部集成服务；保留的定价来源还将按任务计费的自动化产品及自管 Community Edition
              部署列为替代方案。这是按产品定义的边界，并非经过验证的品类收入估算。
            claimRefs:
