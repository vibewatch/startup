  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律结构、fair-code 商业约束与企业治理缺口
        blocks:
          - type: paragraph
            body: >-
              从机构尽调角度评估 n8n，必须把其流行的开源品牌与具有约束力的法律限制拆开看。公司采用专有的 Sustainable Use License，而不是 Apache 2.0 或 MIT 等 OSI
              批准的开源许可。这套 fair-code 框架明确禁止商业利用：没有 Enterprise 许可，第三方团队和托管服务商不得把 n8n 托管成商业服务，也不得把它嵌入多租户 SaaS
              产品。社区讨论显示，商业构建者在把 n8n 工作流嵌入面向客户的 webhook 或咨询交付时，经常遇到边界不清的问题。除知识产权条款外，n8n 还依靠 Master Enterprise Terms、AI
              Terms、Credit Terms 和 Data Processing Agreement
              等正式法律文件来约束企业责任。在金融服务等高合规行业，企业部署必须建立广泛的确定性护栏，以避免监管责任。处理法定申报的自主工作流必须强制执行严格的合规门槛和人机协同审批，以降低 FINRA 和 SEC
              监管体系下自动处理错误直接引发处罚的风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营复杂度、分布式扩展瓶颈与自托管负担
        blocks:
          - type: paragraph
            body: >-
              n8n 的核心运营风险来自架构分化：简单的可视化原型可以在单个容器中运行，但生产级工作负载要求运营复杂的分布式系统。突破单实例限制后，需要启用 n8n 的队列模式，并运营由主实例、Redis
              broker、PostgreSQL 数据库和分布式 worker 节点组成的技术栈。独立工程分析记录了这一拓扑的严重故障模式，包括任务静默丢失、worker
              节点之间加密密钥同步不一致，以及执行数据库迅速膨胀。此外，队列模式禁止使用本地文件系统存储二进制文件，迫使团队设计、保护和维护外部兼容 S3
              的对象存储。数据库增长构成即时运营风险：未清理的执行表会耗尽存储容量，而 SQLite 部署如果没有显式数据库 vacuum 流程，就无法回收磁盘空间。技术变更日志显示工程迭代非常密集，修复内容包括未处理
              promise rejection 导致的任务运行器崩溃、代理消息去重和 worker 关闭排空。企业计划通过日志流提供可观测性，但自托管社区运营者仍要承担基础设施维护、打补丁和灾难恢复的全部负担。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
