  - id: FE001
    title: n8n 全栈系统架构与编排层
    type: stack
    summary: 从客户端界面、编排运行时、执行节点和基础设施托管层级拆解 n8n 的结构。
    data:
      layers:
        - label: 界面与助手层
          detail: Web Canvas UI、Form Webhook 触发器，以及面向 Claude 和 Codex 的 Model Context Protocol（MCP）端点
        - label: 行为与认知层
          detail: AI Agent 节点管理工具调用、ReAct 迭代推理循环、反思轮次和规划逻辑
        - label: 拓扑工作流引擎
          detail: 事件驱动的 DAG 编排器，支持顺序链、子工作流委派以及并行扇出 / 扇入
        - label: 集成与连接器织物层
          detail: 500+ 个应用节点、自定义 HTTP/REST 连接器、二进制文件处理器和向量数据库存储
        - label: 执行运行时与安全
          detail: Node.js 核心进程、任务队列、SQLite/PostgreSQL 持久化以及本地 / S3 二进制文件存储
        - label: 托管与基础设施形态
          detail: 客户管理的 Docker/npm 自托管环境和完全托管的多租户 n8n Cloud
    approximationNotes: 架构层根据官方文档、博客架构模式和安全披露模型概括而成。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
  - id: FU001
    title: 客户采用旅程与扩张循环
    type: journey-map
    summary: 从发现开源自托管，到扩展并留存关键任务型企业客户的多阶段进程。
    data:
      items:
        - label: 阶段 1：发现与本地原型
          stage: 发现与本地测试
          persona: Individual Software Developer / Hacker
          touchpoints:
            - 探索 GitHub 开源代码仓库
            - 下载社区工作流模板库
            - 启动本地 Docker / npm 容器
          painPoints:
            - Frustration with restrictive SaaS per-task pricing models
            - Data privacy limitations on proprietary cloud automation tools
        - label: 阶段 2：部门部署
          stage: 部门生产环境
          persona: RevOps / Engineering Squad Lead
          touchpoints:
            - 部门 n8n Cloud 订阅（基础价格 $24/mo）
            - 通过 Webhook 接入内部 CRM、Slack 和数据库
            - 内部批准部门自动化脚本
          painPoints:
            - Execution volume caps and concurrency limits on starter cloud plans
            - Single-engineer dependency and unmonitored script failures
        - label: 阶段 3：扩展与可靠性摩擦
          stage: 扩展瓶颈
          persona: Director of IT / DevOps Architect
          touchpoints:
            - 未做版本管理的临时拼接工作流在生产环境中失败
            - 安全审计发现未认证的 API 令牌和 Webhook
            - 与专业自动化合作伙伴接洽（例如 Goodspeed）
          painPoints:
            - Managing infrastructure, database queuing, and CVE patch cycles
            - Lack of native SSO/SAML and centralized audit logging on free tiers
        - label: 阶段 4：商业评估与 POC
          stage: 企业采购与 POC
          persona: Enterprise Security & Architecture Review Board
          touchpoints:
            - 评估自托管与云企业条款
            - 核验 Sustainable Use License 的边界
            - 在沙盒中执行试用企业许可证密钥
          painPoints:
            - OpSec vetting of Docker container security and SQLite vs Postgres backing
            - Internal stakeholder coordination between security, legal, and engineering
        - label: 阶段 5：企业标准化
          stage: 企业标准化
          persona: VP IT Infrastructure / Chief Information Security Officer
          touchpoints:
            - 采购带 SLA 的自托管 Enterprise 许可证
            - 接入 Okta/SAML SSO 和 SIEM 日志流
            - 建立由 Git 管控的集中式自动化库
          painPoints:
            - Multi-year commercial lock-in vs. sustaining internal hosting overhead
            - Compliance monitoring under the Sustainable Use License for partner services
        - label: 阶段 6：跨部门扩张
          stage: 全公司推广与卓越中心
          persona: Head of Digital Transformation / CoE Lead
          touchpoints:
            - 跨部门部署（HR、财务、支持、IT 运维）
            - 拓展到智能体 AI 编排和 LLM RAG 流程
            - 将员工自动入职与离职流程标准化
          painPoints:
            - Governance of decentralized citizen-developer workflows
            - API rate limiting and token consumption across external LLM providers
    approximationNotes: 旅程阶段参考技术实施评审、企业案例进展和合作伙伴部署审计建模。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU016
  - id: FR001
    title: 企业风险评估矩阵
    type: matrix
    summary: 从运营、战略、法律和财务维度评估 n8n 的机构风险，并比较各项风险的发生可能性与影响。
    data:
      columns:
        - 影响：低
        - 影响：中等
        - 影响：显著
        - 影响：高
        - 影响：严重
        - 影响：关键
      rows:
        - label: 可能性：高
          values:
            - label: 节点轻微故障
              detail: 快速编辑构建器工作流时，UI 会短暂错位
              tone: neutral
            - label: 可视化架构漂移
              detail: 上游 API 变更引发连锁节点维护负担
              tone: neutral
            - label: 执行数据库膨胀
              detail: 未清理的执行记录和二进制数据耗尽自托管磁盘容量
              tone: risk
            - label: SUL 转售商摩擦
              detail: 非 OSI 许可证限制第三方将工作流嵌入 SaaS
              tone: risk
            - label: 采购安全门槛
              detail: 将 SSO 和 RBAC 锁在高价层级，导致企业试点扩张停滞
              tone: risk
            - label: 工作进程资源耗尽
              detail: 并发限制造成工作流无提示地积压，执行停滞
              tone: risk
        - label: 可能性：中
          values:
            - label: 连接器长尾缺口
              detail: 长尾通用 SaaS 需要手动配置 HTTP Request
              tone: neutral
            - label: 队列模式 Redis 丢失
              detail: 负载下工作进程崩溃，或分布式队列失去同步
              tone: risk
            - label: 法定合规违规
              detail: RAG 自动化缺少确定性防护措施，触发审计处罚
              tone: risk
            - label: 估值倍数压力
              detail: 130 倍 ARR 估值倍数意味着一旦增长停滞，就极易遭遇大幅下调轮次
              tone: risk
            - label: 多主脑裂
              detail: 企业多主部署之间的编排状态失去同步
              tone: risk
            - label: 遥测与隐私审查
              detail: 企业客户对实例诊断数据收集和 GDPR 遥测存在摩擦
              tone: risk
        - label: 可能性：低
          values:
            - label: 小版本发布回归
              detail: 快速发布周期中的编辑器 UI 故障和补丁版本缺陷
              tone: neutral
            - label: GDPR DPA 争议
              detail: 围绕国际数据处理条款的合同争议
              tone: neutral
            - label: 工作进程密钥泄露
              detail: 多个工作进程实例共用的对称加密密钥暴露
              tone: risk
            - label: SAP 战略平台转向
              detail: 关键企业分销合作伙伴不再推进 Joule Studio 嵌入
              tone: risk
            - label: 凭证存储损坏
              detail: 分布式集群中的主加密密钥丢失或轮换失败
              tone: risk
            - label: 供应商完全资不抵债
              detail: 尽管获得 $240M+ 机构资金，资本结构仍严重失效
              tone: risk
    approximationNotes: 可能性与严重程度评估综合了技术托管约束、定价门槛和估值倍数。
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条决策链将公开运营证明和交易质量转化为有门槛的跟踪判断。
    data:
      nodes:
        - id: adoption
          label: 采用信号
          detail: 公司报告的用户增长 6 倍、收入增长 10 倍
          tone: positive
        - id: product
          label: 企业产品
          detail: 自托管、治理、可观测性和人工监督
          tone: positive
        - id: strategic
          label: 战略验证
          detail: SAP 持股和商业协议提升分销选择空间
          tone: positive
        - id: transaction
          label: 交易质量
          detail: 这笔规模较小且部分为老股的战略交易，并不能广泛发现一级市场价格
          tone: warning
        - id: valuation
          label: 估值负担
          detail: 取决于期间和证据来源，指示性 ARR 倍数约为 52 倍至 130 倍
          tone: negative
        - id: recommendation
          label: 跟踪 / 继续研究
          detail: 需要经审计的 KPI、交易经济条款、股权结构表，以及安全边际价格
          tone: warning
      edges:
        - from: adoption
          to: product
          label: 支持
        - from: product
          to: strategic
          label: 促成
        - from: strategic
          to: transaction
          label: 必须结合……限定
        - from: transaction
          to: valuation
          label: 限制对……的信心
        - from: valuation
          to: recommendation
          label: 决定
    approximationNotes: ARR 倍数将交易估值与特定期间的第三方 ARR 证据配对，仅具指示性，未经审计。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
