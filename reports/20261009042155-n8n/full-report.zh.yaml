  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 论点
      - 证据
      - 哪些因素会改变判断
    rows:
      - - 正方
        - 商业动能迅猛
        - 公司报告称 Series C 前后用户增长 6 倍、收入增长 10 倍
        - 经审计的当前 ARR、持久的 NRR 和高效增长会强化论点
      - - 正方
        - 企业部署灵活
        - 官方产品材料介绍了自托管、治理、可观测性和人工监督
        - 企业续约或安全结果疲弱会削弱论点
      - - 正方
        - 战略分销
        - SAP 在一份据报道的许可证协议之外还收购了少数股权
        - 合同最低承诺和可量化的 SAP 来源 ARR 会强化论点
      - - 反方
        - 估值基础极端
        - Value Add VC 根据较早的约 $40M 披露报告过去 ARR 约 130 倍倍数
        - 若核实当前 ARR 基础接近或高于新估算，风险会降低
      - - 反方
        - 信号质量错配
        - 最新估值反映的是战略性、部分为老股转让的交易，而非广泛的增发轮
        - 独立定价且大部分资金为新股融资的轮次会降低风险
      - - 反方
        - 许可证与平台压力
        - 公开讨论和 Sacra 指出，某些面向外部或白标用途存在摩擦
        - 清晰且可扩展的 OEM 条款和持续的生态转化会降低风险
    notes: 公司增长和产品陈述属于发行方主张；估值批评和 ARR 估算来自期间和方法各异的第三方分析。
    claimRefs:
