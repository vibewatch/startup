      - number: '4.3'
        title: 牵引力基准与私有指标现实
        blocks:
          - type: paragraph
            body: >-
              n8n 的财务披露一边有可核实的商业里程碑，一边仍遮蔽着私营软件公司的经营底层。公司在 2025 年 8 月敲定 C 轮投资条款时披露，ARR 约为 $40 million，过去十二个月同比增长约十倍。2026
              年 5 月，企业软件巨头 SAP 通过二级交易收购 n8n 不到 1.3% 的少数股权，交易估值为 $5.2 billion，再次印证收入快速增长。按最近披露的收入计算，该交易隐含的过去十二个月 ARR 倍数约为
              130x；相比成熟自动化同行，n8n 估值溢价显著，例如 Zapier 历史二级交易估值约为 12x ARR，另一个可比对象是 Make.com。


              尽管收入增长亮眼，n8n 对软件单位经济仍严格保密。机构投资通常关注毛利率、净收入留存率（NRR）、客户获取成本（CAC）回收速度和客户流失率，但公开记录完全没有披露这些指标。尤其是，n8n
              托管云与自托管许可证交付的成本结构尚未得到验证。企业许可证层级可产生接近纯软件业务的毛利率；云订阅则要承担服务器基础设施和托管执行开销。若计算密集型代理工作流不断增加，而执行定价没有同步调整，云订阅可能压低整体毛利率。完整投资尽调还需细查
              cohort 留存、扩张轨迹和基础设施毛利率。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI014
