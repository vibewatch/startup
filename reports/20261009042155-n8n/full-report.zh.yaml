      - number: '1.3'
        title: 运营规模、收入牵引与尽调注意事项
        blocks:
          - type: paragraph
            body: >-
              n8n 采用多层商业模式，包括自托管 Community Edition（内部免费使用）、托管 n8n Cloud 订阅、付费本地部署 Business 和 Enterprise 许可，以及嵌入式商业 OEM
              分销协议 [CO008, CO012]。随着通过 LangChain 和原生节点原语引入 AI 代理编排能力，n8n 的商业曲线快速拐升：2025 日历年内，用户基础扩大 6 倍，营收增长 10 倍
              [CO009]。截至 2026 年 5 月，n8n 报告拥有 170 万月活跃构建者和超过 1,400 家企业客户；投资方 HV Capital 报告称，平台 ARR 已突破 €100M [CO009,
              CO010]。


              Sacra 的独立行业研究估计，n8n 的商业收入构成为：云订阅约 55%、企业自托管许可 30%、嵌入式合作 15% [CO012]。企业案例显示出大规模组织部署：电信运营商 Vodafone
              报告威胁情报成本节省 £2.2M；电商平台 Trendyol 在 12 个月内扩展到 1,000 名用户和 700 条工作流；招聘门户 Stepstone 则从最初 4 名用户扩展到覆盖 3,000
              名员工的全企业部署 [CO011]。但严谨尽调必须指出，n8n 的 headline €100M 数字是公司自报 ARR，而非经审计的 GAAP / IFRS
              收入；毛利率、净收入留存率（NRR）和现金消耗率等基本单位经济指标仍属私有且未披露 [CO009, CO010, CO013]。
