  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局分类与替代架构
        blocks:
          - type: paragraph
            body: >-
              2026 年的工作流自动化与集成平台市场，在用户技术成熟度、部署拓扑和定价理念上呈现明显结构分层。n8n 面对五类不同替代方案：大众无代码 SaaS
              龙头（Zapier、Make）、开源及开发者优先框架（Activepieces、Pipedream）、企业集成生态（Microsoft Power Automate、Tray.io）、原生 AI
              代理编排平台（MindStudio、Serenities AI），以及内部工程自建方案。Zapier 等大众龙头凭借超过 8,000
              个集成的目录，在非技术用户的漏斗顶端占据主导，但按步骤计量的商业模式会让多步骤工作流成本严重膨胀。n8n 则将自己定位为开源、fair-code 自动化引擎，提供基于节点的可视化编排，并能在 JavaScript
              和 Python 中原生执行代码；既可作为完全隔离的本地容器部署，也可运行在托管云基础设施上 [CP001, CP002, CP003, CP004]。不过，传统工作流工具在从确定性的 if-then
              数据管道转向依赖上下文的 AI 代理决策时会遇到结构性摩擦，这为原生 AI 编排架构打开了竞争空间 [CP005]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
