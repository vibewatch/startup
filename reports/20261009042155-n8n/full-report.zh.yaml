            body: 如果经审计 ARR 和留存无法弥合历史 $40M 披露与较新的 $100M 估计之间的差距，下行情景就会启动；如果 SAP 相关收入没有最低承诺，风险尤其高。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
