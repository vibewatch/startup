      - number: '4.4'
        title: 资本充足性与尽调结论
        blocks:
          - type: paragraph
            body: >-
              严谨分析 n8n 的资本结构，必须区分战略企业验证与资产负债表的一级资本化。SAP 2026 年 5 月的投资确立了 $5.2B headline 估值，但交易约 $60M
              来自向现有资本表持有人购买二级股份，而非注入公司的一级资本。因此，这笔交易没有给 n8n 的运营资产负债表带来任何新增现金；公司的资本 runway 主要仍由 Accel 领投、2025 年 10 月 C
              轮筹得的 $180M 一级资本支撑。虽然这层现金缓冲看起来充足，但公开申报无法确认 n8n 实际每月净现金消耗、员工数量扩张速度和 runway 时长。


              从投资判断角度看，n8n 是一家处于激进增长倍数中的出色开发者平台。公司的开发者驱动护城河、开源心智份额和企业渗透率，为抵御传统无代码龙头提供了强大防御。但 AWS、Microsoft Azure、Google
              Cloud 等超大规模云厂商拥有结构性风险：它们有动力把工作流编排层直接捆绑并补贴进自己的专有基础模型生态。鉴于 SAP 基准隐含的 130x
              倍数，以及缺少经验证的毛利率和净留存指标，投资人若无法直接访问数据室管理账目，就无法验证独立估值能否持续。
            claimRefs:
              - CI002
