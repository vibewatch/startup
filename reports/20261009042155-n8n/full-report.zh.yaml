  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 展示开发者自下而上采用，经过变现层级，最终形成毛利率的模型。
    data:
      nodes:
        - id: community-builders
          label: 1.7m+ 月活跃构建者
          detail: fair-code 许可下免费自托管 Community Edition 的采用
        - id: commercial-funnel
          label: 商业转化漏斗
          detail: 开发者会遇到基础设施开销、规模限制或团队需求
        - id: cloud-subscriptions
          label: 云订阅（55%）
          detail: Starter、Pro 和 Business 托管层级将执行量变现
        - id: enterprise-licenses
          label: 企业许可证（30%）
          detail: 带 SSO、LDAP 和审计日志的自托管及专用企业实例
        - id: embedded-partnerships
          label: 嵌入式 OEM 合作（15%）
          detail: 包括 SAP Joule Studio AI 平台在内的战略分销嵌入
        - id: gross-margin-generation
