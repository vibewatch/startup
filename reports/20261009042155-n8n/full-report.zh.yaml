              - CV014
      - number: '8.2'
        title: 融资背景与情景边界
        blocks:
          - type: paragraph
            body: >-
              2025 年 10 月 C 轮是最清晰的公开一级融资参考：n8n 宣布募资 $180M，累计融资 $240M，估值 $2.5B。2026 年 5 月 SAP 交易让 headline
              估值翻了一倍以上，但报道显示承诺包括二级购买和许可协议；不能把它等同于资产负债表新增现金，也不能视作广泛联合承销的一级轮次。公开总额也存在冲突，Tracxn 报告为 $254M，而公司口径为
              $240M。因此，情景框架把 $2.5B 和 $5.2B 交易估值作为参考边界，而不是内在价值端点。在一级 /
              二级拆分、完全稀释资本结构、清算优先权和当前运营基础披露前，无法有依据地给出精确目标回报、持有期或所有权结果。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
