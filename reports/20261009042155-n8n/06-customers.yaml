figures:
  - id: "FU001"
    title: "Customer Adoption Journey & Expansion Loop"
    type: "journey-map"
    summary: "Multi-stage progression from open-source self-hosted discovery to mission-critical enterprise expansion and retention."
    data:
      items:
        - label: "Phase 1: Discovery & Local Prototype"
          stage: "Discovery & Local Testing"
          persona: "Individual Software Developer / Hacker"
          touchpoints:
            - "GitHub open-source repository exploration"
            - "Community workflow template library download"
            - "Local Docker / npm container spin-up"
          painPoints:
            - "Frustration with restrictive SaaS per-task pricing models"
            - "Data privacy limitations on proprietary cloud automation tools"
        - label: "Phase 2: Departmental Deployment"
          stage: "Departmental Production"
          persona: "RevOps / Engineering Squad Lead"
          touchpoints:
            - "Departmental n8n Cloud subscription ($24/mo base)"
            - "Webhook connection into internal CRM, Slack, and database"
            - "Internal approval of departmental automation script"
          painPoints:
            - "Execution volume caps and concurrency limits on starter cloud plans"
            - "Single-engineer dependency and unmonitored script failures"
        - label: "Phase 3: Scaling & Reliability Friction"
          stage: "Scaling Bottleneck"
          persona: "Director of IT / DevOps Architect"
          touchpoints:
            - "Production failure of unversioned duct-tape workflows"
            - "Security audit flagging unauthenticated API tokens and webhooks"
            - "Engagement with specialized automation partners (e.g. Goodspeed)"
          painPoints:
            - "Managing infrastructure, database queuing, and CVE patch cycles"
            - "Lack of native SSO/SAML and centralized audit logging on free tiers"
        - label: "Phase 4: Commercial Evaluation & POC"
          stage: "Enterprise Procurement & POC"
          persona: "Enterprise Security & Architecture Review Board"
          touchpoints:
            - "Evaluation of self-hosted vs cloud enterprise terms"
            - "Verification of Sustainable Use License boundaries"
            - "Execution of trial enterprise license key in sandbox"
          painPoints:
            - "OpSec vetting of Docker container security and SQLite vs Postgres backing"
            - "Internal stakeholder coordination between security, legal, and engineering"
        - label: "Phase 5: Enterprise Standardization"
          stage: "Enterprise Standardization"
          persona: "VP IT Infrastructure / Chief Information Security Officer"
          touchpoints:
            - "Procurement of Self-Hosted Enterprise license with SLA"
            - "Integration with Okta/SAML SSO and SIEM log streaming"
            - "Establishment of centralized Git-controlled automation library"
          painPoints:
            - "Multi-year commercial lock-in vs. sustaining internal hosting overhead"
            - "Compliance monitoring under the Sustainable Use License for partner services"
        - label: "Phase 6: Multi-Departmental Expansion"
          stage: "Company-Wide Rollout & Center of Excellence"
          persona: "Head of Digital Transformation / CoE Lead"
          touchpoints:
            - "Cross-departmental deployment (HR, Finance, Support, IT Ops)"
            - "Expansion into agentic AI orchestration and LLM RAG pipelines"
            - "Standardization of automated employee onboarding and offboarding"
          painPoints:
            - "Governance of decentralized citizen-developer workflows"
            - "API rate limiting and token consumption across external LLM providers"
    approximationNotes: "Journey stages modeled from technical implementation reviews, enterprise case study progression, and partner deployment audits."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU016"
callouts:
  - calloutType: "risk"
    title: "Production Scaling Wall & Self-Hosted Maintenance Debt"
    body: "While n8n's self-hosted model provides total data sovereignty, implementation partners observe that organizations frequently hit a scaling wall when automations expand beyond initial prototypes. Lacking enterprise observability and disciplined error handling, complex workflows degrade into fragile single-point-of-failure architectures that require dedicated DevOps resources or agency retainers to maintain."
    claimRefs:
      - "CU015"
      - "CU016"
