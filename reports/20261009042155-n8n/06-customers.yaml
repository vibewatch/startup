chapter:
  number: 6
  title: "Customers"
  summary: "n8n's customer base exhibits a dual structure spanning over 1.7 million monthly active builders and 1,400 to 3,000 enterprise accounts, driven by self-hosted data sovereignty and execution-based pricing; however, net revenue retention and churn remain undisclosed while commercial deployment boundaries under its Sustainable Use License require continuous monitoring."
sections:
  - id: "customer-segmentation-landscape"
    title: "Customer Segmentation & Buyer Profile Analysis"
    body: "n8n's customer landscape divides across distinct technical personas and deployment architectures, primarily determined by regulatory constraints, integration volume, and infrastructure management capabilities. The base spans technical founders, developer teams, marketing agencies, and mid-market to enterprise IT operations across North America and Europe. Enterprise accounts—reported at over 1,400 by n8n alongside SAP's May 2026 strategic investment and tracked upwards of 3,000 accounts in independent market estimates—standardize on self-hosted Enterprise editions behind corporate firewalls to ensure strict data residency and compliance. In parallel, managed n8n Cloud subscriptions serve agile development groups, public sector contractors like Euna Solutions, and revenue analytics teams at mid-market firms like Personio who prioritize iteration speed over infrastructure maintenance. While enterprise license tiers grant access to SAML/SSO, audit logging, and role-based permissions, the vast majority of non-paying builders operate the free community edition, creating a wide funnel where commercial conversion rates remain opaque."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-signals"
    title: "Adoption Trajectory & Operational Expansion Signals"
    body: "Operational adoption metrics indicate substantial organic expansion across technical workflows, as demonstrated by public npm package distributions and internet-scale traffic data. Public npm installations reached 1,295,036 downloads in Q3 2026, marking a 30.0% increase over Q2 2026 and 55.1% growth year-over-year from Q3 2025. Although a temporary spike of 567,348 installs in August 2026 distorted quarterly totals, normalized run rates in July and September (averaging approximately 363,844 monthly installs) demonstrate compounding organic adoption across CI/CD pipelines and local developer instances. Concurrently, web traffic monitoring shows n8n.io sustaining approximately 10.7 million monthly visits, with roughly 39.6% of outbound site traffic routing directly into the hosted n8n.cloud service. However, because npm counts CI/CD runs and automated rebuilds, download volume functions as a proxy for developer activity rather than verified commercial account growth, leaving production workload conversion unmeasured."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "enterprise-production-proof"
    title: "Enterprise Deployment Proof, Outcomes & Implementation Friction"
    body: "Production deployment case studies confirm that n8n delivers substantial operational velocity gains when replacing fragile legacy automations and bespoke scripts, but complex implementations reveal meaningful organizational hurdles. At Delivery Hero, n8n automated account lockout recovery across 53,000 employees, reducing manual handling time from 35 to 20 minutes and removing 200 hours of monthly IT downtime. At StepStone, engineering teams migrated more than 200 production workflows from SaaS automation tools to self-hosted n8n, accelerating candidate data feed prototyping from two weeks of bespoke coding to two hours. Similarly, Musixmatch recovered 47 days of developer capacity in four months by replacing manual data pipelines, and Unbabel eliminated 51% of manual translation operational tasks. Nevertheless, implementation partners emphasize that self-hosted instances encounter a severe 'scaling wall' when organizations transition from departmental pilots to high-volume production: without professional workflow architecture, error handling, and versioning, automation pipelines risk cascading failures and administrative lockout overhead."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
