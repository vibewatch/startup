- id: retention-durability-and-satisfaction-gaps
  title: Retention, durability, and satisfaction gaps
  body: 'No public source discloses net revenue retention, gross revenue retention, churn, contract duration, renewal rate, utilization, or customer satisfaction scores for Wujie. That means durability has to be inferred from structural clues rather than measured directly. The most positive structural clues are: export delivery beginning rather than stopping at demo stage; ZF’s willingness to pursue a strategic cooperation around real manufacturing problems; the founder’s statement that a Beijing coffee deployment had already been trialed for a period; and the stated plan to continue operating before moving into Korea. Those signals suggest that at least some customers or reference partners find the robot safe and useful enough to keep testing or scaling. But the absence of hard retention metrics is material, not cosmetic. We do not know whether the Envision order is recognized as revenue, what portion is binding versus framework volume, whether the coffee partner will extend beyond demonstration,
    or how often on-site support is required to maintain performance. In practice, this means the public record proves demand formation and scenario validation more clearly than it proves repeat economics or satisfaction durability.'
