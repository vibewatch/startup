- id: adoption-trajectory-and-deployment-status
  title: Adoption trajectory and deployment status
  body: 'The commercial trajectory visible in public starts with named order formation, then moves into export shipment, live factory collaboration, and open-scene pilot operation. Multiple sources reported by April–June 2026 that Wujie had accumulated more than US$200 million in angel financing and had signed meaningful global orders, including an Envision market order valued above RMB 500 million according to several reports. By July 2026, Shanghai Securities News reported that K15 had entered global batch delivery and that the first batch was shipped to Europe, which is a stronger customer signal than a prototype unveiling because it implies some combination of customer acceptance, export compliance, and manufacturing readiness. By December 2025, Wujie and ZF LIFETEC were already publicly describing work inside ZF’s China plant. By August 2026, Wujie was also demonstrating a HOLLYS-branded coffee-space pilot at WRC and the founder said a separate Beijing coffee site had already completed
    a period of trial operation, with a further four months of operation planned before a Korea entry in Q4 2026. The pattern is notable: Wujie is not claiming mass consumer scale; it is moving through a staged industrial-to-service adoption path.'
