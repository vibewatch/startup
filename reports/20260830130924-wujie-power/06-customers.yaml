- id: named-customer-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'The quality of Wujie’s named customer proof differs sharply by account. Envision is the strongest strategic commercial proof because multiple sources describe a large global market order, overseas deployment intent, and a customer profile tied to renewable energy, batteries, and global operations. ZF LIFETEC is the strongest workflow-specific manufacturing proof because the cooperation is described in concrete terms: passive-safety components, flexible parts, precision assembly, industrial-grade reliability targets, and active work inside a China factory. HOLLYS is the clearest public-service proof because the WRC installation showed a branded operating environment and the founder described prior trial operations plus planned continuation; however, it remains a pilot and should not be read as chainwide rollout. OMOWAY is the weakest of the named counterparties from a disclosure standpoint: it appears in the list of deep-cooperation partners and is a plausible mobility reference,
    but public sources do not yet expose the exact workflow, contract size, or deployment metrics. Overall, Wujie’s customer proof is better than logo-only marketing, but it is still early and uneven across accounts.'
