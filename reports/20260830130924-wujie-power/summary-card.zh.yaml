  topStrengths:
    - 超过 US$200 million 的天使轮融资，对这么早期的具身 AI 公司来说少见
    - Envision 超过 RMB 500M 的订单，是中国人形机器人少见的已披露 B2B 需求证明
    - K15 已从发布叙事推进到符合出口要求、并发往欧洲
    - MWA 以及本体加大脑全栈定位，暗示其软件差异化比纯硬件同行更深
    - 北京区位叠加国资背景资本，能加快试点、生态接入和政策对齐
  topRisks:
    - 收入、毛利率、烧钱速度和股权结构条款仍未披露
    - Envision 看起来既是战略投资人，也是已披露的锚定客户，验证集中在单一关系上
    - 作为独角兽级公司，公开治理和更宽管理层梯队披露偏薄
    - 人形机器人的可靠性、服务负担和安全表现还没有在 fleet 规模上得到验证
    - 供应链和出口管制依赖可能限制具身 AI 部署
  unresolvedGaps:
