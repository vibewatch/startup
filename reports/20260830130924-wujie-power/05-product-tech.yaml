    - Positive for tight industrial cells
    - Suggests real task design rather than broad humanoid theater
    - Request more end-effector and payload specs
  - - Industrial compliance
    - CE-MD, RED, EMC, EN ISO 13849 cited in public delivery coverage
    - Positive
    - Improves exportability and customer trust
    - Validate certification scope and issuing bodies
  - - Cyber / network safety
    - EN 18031 and OTA/security discussion appear in retained coverage
    - Positive but still thinly documented
    - Important for connected deployments
    - Request formal security architecture docs
  - - Public-scene safety priority
    - Founder said speed may lag expectations because safety comes first
    - Positive on risk culture
    - Shows management is not overselling replacement today
    - Request incident and near-miss reporting
  - - Generalization maturity
    - Few-shot stronger than zero-shot per founder
    - Mixed
    - Clarifies present technical ceiling
    - Request adaptation time and success-rate metrics
  - - Hardware reliability maturity
    - Founder said broad industry still lags industrial-grade life targets for some joints/hands
    - Mixed / early
    - Reliability governs TCO and renewal
    - Request MTBF and replacement-cycle data
  notes: Trust in embodied AI requires both certification and engineering honesty about current limits.
