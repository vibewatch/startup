  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deep technical specs
    missingEvidence: No full public sensor, compute, payload, battery-life, or component BOM disclosure comparable to the best peer product sheets.
    whyItMatters: Institutional technical diligence needs deeper hardware and systems details than media summaries provide.
    diligencePath: Request full engineering spec sheet and field-performance data.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: material
    topic: independent benchmark replication
    missingEvidence: The retained evidence preserves Wujie’s benchmark claim for MWA but not independent reproduction or neutral benchmark audit.
    whyItMatters: Model-comparison claims can materially overstate product advantage if methodology is narrow or self-selected.
    diligencePath: Request benchmark code, task definitions, and third-party validation.
    relatedQuestionRefs:
    - QE027
  - type: private-evidence-only
    severity: material
    topic: reliability metrics
    missingEvidence: No public MTBF, maintenance cadence, component-failure, or uptime metrics for deployed K15 units.
    whyItMatters: Reliability, not demo quality, determines whether customers expand deployments.
    diligencePath: Obtain fleet telemetry, maintenance logs, and warranty data.
    relatedQuestionRefs:
    - QE028
  - type: private-evidence-only
    severity: minor
    topic: security architecture detail
    missingEvidence: Retained sources mention OTA and EN 18031-linked security posture but do not expose the actual product security architecture.
    whyItMatters: Connected robot deployments create cyber and safety attack surfaces that should be reviewed directly.
    diligencePath: Request security design review and penetration-test materials.
    relatedQuestionRefs:
    - QE018
