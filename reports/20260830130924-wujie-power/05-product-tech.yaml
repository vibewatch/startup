- id: TE003
  title: Technology / operating architecture table
  columns:
  - Architecture layer
  - What public sources say
  - Why it matters
  - Risk if weak
  rows:
  - - Scenario layer
    - Product is built around real industrial and commercial tasks rather than abstract humanoid ability
    - Keeps R&D tied to customer value
    - Can become overfit to narrow pilots
  - - World-model / planning layer
    - MWA runs unified latent-space reasoning with long-sequence causal structure
    - Central to generalization and data efficiency
    - Weak planning collapses cross-scene performance
  - - Control / execution layer
    - Chunk-level inverse dynamics connects plans to multi-step action groups
    - Turns cognition into repeatable action
    - Any mismatch creates failure or safety risk
  - - Perception / communication layer
    - Industrial certifications and public descriptions imply integrated sensing and wireless operation
    - Needed for human-robot coexistence and OTA lifecycle support
    - Poor sensing or comms harms reliability
  - - Embodiment layer
    - K15 focuses on tight-space manipulation rather than only full-biped locomotion
    - Improves practical deployment odds in current use cases
    - May cap use cases if body choice mismatches customer needs
  - - Iteration layer
    - Pilots, data loop, and mid-stage platform close the engineering cycle
    - Creates compounding learning advantage
    - Without sufficient deployment data, moat remains shallow
  notes: This is a logical architecture synthesis, not a reverse-engineered internal schematic.
