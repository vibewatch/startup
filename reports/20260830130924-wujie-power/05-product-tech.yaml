- id: workflow-fit-and-real-scene-iteration
  title: Workflow fit and real-scene iteration
  body: 'Wujie’s strongest product signal is how management explains where the robot should learn. In Zhang Yufeng’s August 2026 interview, the company describes industrial scenes as places to train skills and commercial scenes as places to train generalization. That distinction is technically important. It implies the product is being developed around real workflows where economic value is identifiable, then stress-tested in more dynamic public environments such as coffee retail. The disclosed industrial use cases are not random. Zhang specifically highlighted tasks that fixed automation handles poorly, such as manipulating deformable automotive safety-belt materials and placing them into fixtures or test equipment where force, shape, and position vary. The HOLLYS coffee-space pilot then becomes a second training ground: fewer SKUs than a household, but moving humans, changing tabletops, and safety-sensitive interaction. The product therefore evolves through a staged workflow map—tight
    industrial tasks, bounded commercial tasks, then broader generalization—rather than by jumping straight to the home. That staged learning logic is one of the clearest technical strategy statements in the retained source base.'
