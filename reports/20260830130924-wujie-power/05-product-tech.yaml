company:
  name: Wujie Power
chapter:
  number: 5
  title: Product & Technology
  summary: 'Wujie Power is building more than a robot body; its retained public evidence describes a full embodied-intelligence system spanning a wheeled semi-humanoid hardware platform, a latent-space world model called MWA™, industrial safety/compliance layers, and a deployment loop that uses real customer scenarios to drive iteration. The K15 platform is explicitly optimized for tight industrial and commercial spaces rather than for showy full-biped locomotion, while management’s own public framing is pragmatic: industrial scenes train task skill, commercial scenes train generalization, and safety outranks demo speed. Product strength today comes from scenario fit, compliance effort, and real-scene iteration. Product risk comes from still-limited zero-shot generalization, unclear long-term reliability, and thinner public technical documentation than some competitors publish.'
sections:
- id: system-architecture-and-core-product
  title: System architecture and core product
  body: 'The public evidence supports reading Wujie as a layered embodied-intelligence stack rather than as a single robot SKU. At the embodiment layer, K15 is described as a general-purpose wheeled semi-humanoid or wheel-based mobile-manipulation robot built for full-scene dexterous work. At the model layer, MWA is presented as a latent-space world model using long-sequence bidirectional physical causal chains and chunk-level inverse dynamics to generate multi-step latent action sequences. Around those layers sit perception, communication, safety, and deployment systems that make the robot suitable for industrial and semi-open commercial environments. This architecture matters because it explains why financing coverage repeatedly mentions world models, data pipelines, and infrastructure rather than only hardware manufacturing. Wujie is trying to own the decision stack, data loop, and physical platform together. The K15 design details retained in shipment and delivery coverage also reinforce
    that this is a task-first product, not a generic humanoid spectacle: the platform is optimized for constrained workspaces, with a 30 mm wrist flip radius and operation in omnidirectional work areas not exceeding 800 mm in width. That geometry is a direct clue that the company is optimizing for line-side and service-space practicality.'
