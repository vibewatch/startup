- id: milestones-and-commercialization
  title: Commercial milestones and current stage
  body: 'Public milestones point to a company that is still early but moving faster than a typical robotics seed-stage venture. In 2026 alone Wujie announced oversized angel funding, launched the MWA world model, topped a Stanford-linked RoboCasa benchmark, opened batch delivery for K15 after industrial-grade CE clearance, completed a Haidian pilot-production platform, and used WRC 2026 to demonstrate commercial-service workflows with HOLLYS. The most important milestone remains commercialization rather than demos: Wujie said it had a global order book near $100 million, first shipments were sent to Europe, and reporting tied the initial overseas deployment to Envision’s France battery factory. The evidence does not yet prove scaled recognized revenue or steady production volumes, but it does show that Wujie is already trying to convert model architecture, financing, and partnerships into real operational deployments across industrial and commercial settings.'
