- id: founders-and-governance
  title: Founders, leadership, and governance opacity
  body: The clearest public leadership facts center on two executives. Zhang Yufeng is named repeatedly as founder and CEO and is described as a former senior Horizon Robotics executive who left autonomous-driving leadership to start Wujie in 2025. Xia Zhongpu formally joined as co-founder and co-CTO in March 2026 after prior roles at Li Auto and Baidu Apollo and after research work on world models and reinforcement learning at the Chinese Academy of Sciences. This leadership mix matters because it explains Wujie’s emphasis on “native world model + reinforcement learning” and on engineering for long-horizon real-world deployment, not only lab demos. At the same time, reviewed sources do not publish a board roster, shareholder control map, liquidation preferences, or other financing-governance details. That leaves meaningful key-person risk concentrated in a young company whose commercial narrative still depends heavily on founder interviews and media disclosures. Until a registry pull or
    investor materials surface, governance analysis has to remain conservative and gap-aware.
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
  - CO015
  - CO037
  tableRefs:
  - TO002
  figureRefs: []
- id: capital-and-stakeholders
  title: Capital formation, investors, and strategic stakeholders
  body: 'Wujie has raised unusually large capital for such an early-stage humanoid robotics company. Multiple April-to-June 2026 sources agree that cumulative angel financing exceeded $200 million, while June reporting also said a roughly $200 million Pre-A was nearing completion. The capital base spans state-linked, industrial, and top-tier financial investors: Envision Group and the Beijing AI Industry Investment Fund co-led the Angel++ round, while follow-on investors included Sequoia China, Linear Capital, Hillhouse Ventures, BV Baidu Ventures, and several China-based institutions. By late June, Shanghai Securities News added JD-associated funds, C Capital, Hony, Shengyu, and Fengyuan to the investor roster. This breadth matters strategically because Wujie’s story is not just about financing volume; it is about scenario access, industrial validation, and overseas go-to-market leverage. The same investor/customer overlap is visible in Envision’s deployment agreement and in customer-oriented
    relationships with ZF LIFETEC, OMOWAY, and commercial-service partners.'
  claimRefs:
