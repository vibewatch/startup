company:
  name: Wujie Power
chapter:
  number: 1
  title: Company Overview
  summary: Wujie Power (无界动力) is a Beijing embodied-AI robotics startup founded in 2025 around the thesis that a latent-space world model plus reinforcement learning can generalize robot behavior across industrial and commercial tasks. Public materials confirm founder-CEO Zhang Yufeng, co-founder/co-CTO Xia Zhongpu, more than $200 million of angel financing with a near-$200 million Pre-A in progress, and signed global orders near $100 million led by Envision’s CNY 500 million-plus overseas contract. What remains opaque is governance, exact legal-entity formation date, and any audited revenue or unit-economics disclosure.
sections:
- id: identity-and-scope
  title: Identity, positioning, and scope of business
  body: 'Wujie Power is consistently described in reviewed 2026 reporting as a Beijing-based company building general-purpose embodied AI robots and a “general brain” for physical-world operation. The company positions itself as a full-stack supplier rather than a component vendor: its public materials pair the MWA embodied general-brain architecture with self-developed robot bodies, a central compute platform, sensing devices, and production infrastructure. Reporting around the K15 product line shows that Wujie is not targeting research-only robotics. Instead, it is prioritizing industrial manipulation, overseas factory deployment, and commercial-service environments where robots must work around people, dynamic objects, and production equipment. The June-to-August 2026 news flow also shows a progression from financing, to model launch, to CE-certified batch delivery, to a WRC coffee-shop showcase, implying a deliberate march from thesis validation to visible commercialization. That sequencing
    matters for later chapters: the company is not yet proven as a scaled manufacturer, but it has disclosed enough about products, partners, and delivery motion to treat it as an operating startup with real commercialization intent rather than as a pure concept lab.'
  claimRefs:
  - CO001
  - CO006
  - CO017
  - CO022
  - CO025
  - CO031
  - CO039
