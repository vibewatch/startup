company:
  name: Wujie Power
chapter:
  number: 4
  title: Financials
  summary: Wujie Power’s public financial picture is driven far more by fundraising and order-book signals than by disclosed operating statements. Across Beijing government, Shanghai Securities News, Embodied Global, 36Kr, RobotToday, and C114Pro reporting, the company appears to have raised more than US$200 million at the angel stage in rapid successive tranches during 2026, with an additional follow-on round reported as near completion. The largest visible commercial signal is the Envision agreement, reported at more than CNY 500 million and linked to a broader global order pipeline near US$100 million, but those figures should be treated as backlog or signed-order indicators rather than recognized revenue. No public ARR, gross margin, cash balance, debt schedule, or audited statements were found. The best underwriting view is therefore that Wujie has unusually strong early-stage capital access and credible customer-backed financing momentum, but still carries substantial uncertainty on
    revenue conversion, burn, and unit economics.
sections:
- id: funding-history-and-capital-formation
  title: Funding history and capital formation
  body: 'Wujie’s 2026 financing pace is the clearest financial fact pattern in the retained evidence set. Multiple sources converge on the point that cumulative angel-stage funding exceeded US$200 million, with rounds moving quickly enough that some reports describe Angel++, Angel+++, or a Pre-A / near-Pre-A progression rather than one cleanly disclosed round structure. That ambiguity is itself meaningful: it suggests fast-moving financing momentum and strong investor demand, but also means the public record is not yet tidy enough to support a precise priced-round chronology. The investor set is unusually strong for such an early commercial stage. Reported participants include Envision Group, the Beijing AI Industry Investment Fund, Sequoia China, Linear Capital, Hillhouse-linked capital, BV/Baidu Ventures, and additional RMB and dollar funds. Strategically, that mix matters because it combines industrial pull-through with venture endorsement. Financially, it means Wujie did not have to
    rely on one capital source or one headline investor to establish momentum. The capital-formation story is therefore a positive signal, but the absence of disclosed security terms, liquidation preferences, board rights, or post-money ownership percentages limits how precisely that signal can be converted into cap-table quality.'
