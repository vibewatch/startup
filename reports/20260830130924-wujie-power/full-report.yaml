        title: Peer profiles, pricing, and capability benchmarks
        blocks:
          - type: paragraph
            body: >-
              The most visible pricing benchmark in the retained set comes from Unitree, whose G1 page gives unusually
              concrete mechanical and sensor details and whose coverage points to a much lower entry price than premium
              Western humanoids. That makes Unitree an anchor for cost and developer accessibility rather than for
              enterprise production proof. AgiBot, Astribot, Galaxea, and UBTech show a different competitive pattern
              inside China: each is using a different mix of AI narrative, hardware breadth, and commercialization
              message to chase mindshare. Astribot emphasizes operation and human-tool interaction, while Galaxea
              emphasizes wheeled dual-arm manipulation and packaged VLA experiences that sound closer to real industrial
              workflows. On the Western side, Figure and Tesla set the benchmark for AI ambition, while Boston Dynamics
              sets the benchmark for robotics brand legitimacy and embodied-mechanics credibility. Agility, although not
              the user’s main requested peer, is useful because it represents one of the few companies in the retained
              set with named commercial facilities and a sustained enterprise deployment narrative. Together these peers
              define the competitive bar Wujie must clear across price, reliability, deployment evidence, and AI
              marketing.
