      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The challenge is that most of Wujie’s apparent strengths are still early enough to be copied or
              neutralized. Hardware form-factor differences can narrow quickly. AI narratives around world models or
              embodied brains are spreading across the field. And the stronger the category becomes, the easier it is
              for buyers to demand proof on uptime, safety, support, and price rather than on vision alone. Wujie also
              carries a public-transparency handicap. Several peers provide more visible official product pages, pricing
              cues, investor disclosures, or long-running brand recognition, while Wujie still lacks a clearly confirmed
              public website in the retained set. That weakens developer ecosystem formation and can slow buyer
              diligence. The more durable moat candidates are harder to fake: actual industrial orders, integration
              know-how, export execution, and scenario-specific data. If Wujie can turn those into repeated deployments,
              it can defend a meaningful niche. If not, it risks being compressed between cheaper Chinese hardware and
              better-capitalized global AI brands.
