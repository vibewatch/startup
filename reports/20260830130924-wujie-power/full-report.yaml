      - number: '4.3'
        title: Capital intensity, unit economics, and runway
        blocks:
          - type: paragraph
            body: >-
              Embodied-AI robotics is structurally capital intensive even when fundraising is abundant. Wujie is not
              only building models and data pipelines; it is also qualifying industrial hardware, supporting
              international compliance, funding pilot deployments, and maintaining a production-validation platform in
              Beijing. The retained sources show that the company has already built a mid-stage production and
              validation platform and has started Europe-bound delivery, both of which imply real working-capital and
              support burdens that pure software startups do not carry. This supports two simultaneous conclusions.
              First, Wujie’s capital adequacy is likely stronger than most early-stage robotics peers simply because a
              US$200 million-plus angel pool is unusually large. Second, that same capital can be consumed quickly if
              the company staffs globally, subsidizes pilots, absorbs warranty or field-service costs, or carries
              inventory ahead of confirmed cash collections. Without public gross-margin or cash-balance disclosure, any
              runway estimate is illustrative only. The most defensible public view is that Wujie has enough financing
              to pursue aggressive commercialization through 2026 and likely beyond, but not enough disclosed economics
              to conclude that it has solved the classic robotics problem of converting technical progress into
              profitable deployment.
