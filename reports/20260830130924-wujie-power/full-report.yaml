  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: System architecture and core product
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports reading Wujie as a layered embodied-intelligence stack rather than as a
              single robot SKU. At the embodiment layer, K15 is described as a general-purpose wheeled semi-humanoid or
              wheel-based mobile-manipulation robot built for full-scene dexterous work. At the model layer, MWA is
              presented as a latent-space world model using long-sequence bidirectional physical causal chains and
              chunk-level inverse dynamics to generate multi-step latent action sequences. Around those layers sit
              perception, communication, safety, and deployment systems that make the robot suitable for industrial and
              semi-open commercial environments. This architecture matters because it explains why financing coverage
              repeatedly mentions world models, data pipelines, and infrastructure rather than only hardware
              manufacturing. Wujie is trying to own the decision stack, data loop, and physical platform together. The
              K15 design details retained in shipment and delivery coverage also reinforce that this is a task-first
              product, not a generic humanoid spectacle: the platform is optimized for constrained workspaces, with a 30
              mm wrist flip radius and operation in omnidirectional work areas not exceeding 800 mm in width. That
              geometry is a direct clue that the company is optimizing for line-side and service-space practicality.
