      - number: '2.2'
        title: Growth drivers, constraints, and policy context
        blocks:
          - type: paragraph
            body: >-
              The market tailwind is real. China’s MIIT released its first national humanoid-robot and
              embodied-intelligence standard system in early 2026, and reviewed sources show China moving from
              fragmented demos toward a more coordinated industrial stack. Shipment data from IDC-linked and analyst
              reporting suggest 2025 was the breakout year for volume, while the funding environment accelerated again
              in H1 2026 as unicorn formation and IPO channels expanded. Labor and automation economics also support
              demand: IFR highlights robotics as a response to labor shortages and the “dirty, dull, dangerous, and
              delicate” tasks where human staffing is hard to sustain. But the same sources also point to the main
              commercial brakes. Entertainment and research still account for a large share of current shipments,
              demonstrating that shipment growth is ahead of mature industrial revenue. Precision components, AI
              manipulation, safety certification, integration standards, and customer ROI remain unresolved enough that
              market share can move quickly among vendors. For Wujie, that means strong category momentum but little
              room for sloppy execution. Put differently, the category is transitioning from policy-supported
              exploration to procurement-tested execution. A vendor can benefit from a rising market and still fail if
              it cannot prove safety cases, fit into customer change-management processes, and keep field service costs
              under control. That is why the same sector statistics can support both a bullish market view and a
              cautious underwriting stance.
