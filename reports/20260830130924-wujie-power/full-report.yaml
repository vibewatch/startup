      - number: '7.5'
        title: Financial / model risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The financial risk is not that Wujie lacks capital today; it is that humanoid-robot scaling can absorb
              capital faster than early deployments convert into durable cash flow. More than US$200 million of
              angel-stage financing gives Wujie more runway than many peers, but the sector’s own observers keep warning
              that 2027–2028 will likely be the first major shakeout period. Wujie is still early in delivery, public
              revenue quality is opaque, and backlog should not be mistaken for recognized revenue. Hardware
              manufacturing, warranty exposure, field service, customer-specific adaptation, and inventory financing all
              pull cash forward. The broader market context cuts both ways: Goldman sees strong demand in structured
              environments, but multiple market summaries also describe a valuation surge that could outpace commercial
              proof. In that environment, diligence should focus less on headline financing and more on the conditions
              that would break the thesis: missed anchor-customer rollout, a serious safety incident, evidence that
              maintenance cost overwhelms economics, export restrictions that materially narrow growth channels, or a
              financing step-down before Wujie proves repeatable deployment quality. These are the risks that matter
              because each one can rerate both revenue expectations and valuation at the same time.
            claimRefs:
              - CR036
              - CR037
