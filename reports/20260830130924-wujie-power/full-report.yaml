      - number: '5.4'
        title: Roadmap, maturity, and comparative readiness
        blocks:
          - type: paragraph
            body: >-
              Wujie’s roadmap appears to be advancing on two tracks at once: K15 is entering global delivery while
              third-generation bodies—including both biped and wheel-arm variants—are moving through the mid-stage
              platform for production validation. That matters because it shows the company is not betting on one
              embodiment forever; it is testing which form factors best match real workloads. Relative to peers, Wujie’s
              retained product evidence is stronger on scenario-linked readiness than on public documentation depth.
              Unitree publishes more explicit hardware and developer surfaces. AgiBot publishes more visible
              product-line assets and deployment-oriented announcements. 1X, Boston Dynamics, and Apptronik set a
              premium benchmark for global product storytelling. But Wujie’s combination of world-model narrative,
              industrial CE/export evidence, and customer-linked iteration creates a product maturity profile that is
              more applied than many show-floor demos. The bottom line is that Wujie’s technology looks directionally
              strong for early industrial and bounded-service commercialization, but its generality, long-run
              reliability, and documentation depth remain incomplete relative to what institutional diligence would
