chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and scope of business
        blocks:
          - type: paragraph
            body: >-
              Wujie Power is consistently described in reviewed 2026 reporting as a Beijing-based company building
              general-purpose embodied AI robots and a “general brain” for physical-world operation. The company
              positions itself as a full-stack supplier rather than a component vendor: its public materials pair the
              MWA embodied general-brain architecture with self-developed robot bodies, a central compute platform,
              sensing devices, and production infrastructure. Reporting around the K15 product line shows that Wujie is
              not targeting research-only robotics. Instead, it is prioritizing industrial manipulation, overseas
              factory deployment, and commercial-service environments where robots must work around people, dynamic
              objects, and production equipment. The June-to-August 2026 news flow also shows a progression from
              financing, to model launch, to CE-certified batch delivery, to a WRC coffee-shop showcase, implying a
              deliberate march from thesis validation to visible commercialization. That sequencing matters for later
              chapters: the company is not yet proven as a scaled manufacturer, but it has disclosed enough about
              products, partners, and delivery motion to treat it as an operating startup with real commercialization
              intent rather than as a pure concept lab.
