      - number: '1.3'
        title: Capital formation, investors, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Wujie has raised unusually large capital for such an early-stage humanoid robotics company. Multiple
              April-to-June 2026 sources agree that cumulative angel financing exceeded $200 million, while June
              reporting also said a roughly $200 million Pre-A was nearing completion. The capital base spans
              state-linked, industrial, and top-tier financial investors: Envision Group and the Beijing AI Industry
              Investment Fund co-led the Angel++ round, while follow-on investors included Sequoia China, Linear
              Capital, Hillhouse Ventures, BV Baidu Ventures, and several China-based institutions. By late June,
              Shanghai Securities News added JD-associated funds, C Capital, Hony, Shengyu, and Fengyuan to the investor
              roster. This breadth matters strategically because Wujie’s story is not just about financing volume; it is
              about scenario access, industrial validation, and overseas go-to-market leverage. The same
              investor/customer overlap is visible in Envision’s deployment agreement and in customer-oriented
              relationships with ZF LIFETEC, OMOWAY, and commercial-service partners.
