  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              Humanoid robotics is not a single monolithic market with one clean peer set. Wujie faces at least four
              competitive layers at once: direct embodied-AI peers building general-purpose or semi-general-purpose
              humanoids; incumbent robotics brands with stronger engineering heritage and installed enterprise trust;
              automotive or platform giants such as Tesla that can self-fund learning loops; and status-quo substitutes
              such as human labor, fixed industrial arms, AMRs, cobots, and custom automation cells. This matters
              because enterprise buyers rarely choose among humanoids alone. They ask whether a flexible mobile robot is
              materially better than redesigning the workflow around cheaper conventional automation. In that landscape,
              Wujie’s true battle is for the subset of tasks where dexterous mobile manipulation creates enough value to
              beat both people and legacy robots. The peer field itself is also splitting geographically and
              strategically. Chinese companies are increasingly pushing fast iteration, volume, and price visibility,
              while several Western leaders focus on premium AI positioning, enterprise pilots, or internal
              manufacturing deployment. Wujie sits closer to the Chinese commercialization wave but is trying to
              separate itself from pure developer-hardware stories through named industrial customers and overseas
              delivery signals.
