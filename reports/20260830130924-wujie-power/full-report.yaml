      - number: '4.4'
        title: Valuation opacity and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Wujie is widely described inside the 2026 embodied-AI funding wave as a unicorn or unicorn-class company,
              which is directionally useful but not equivalent to a disclosed valuation term sheet. The user’s canonical
              fact set, 36Kr’s robotics-unicorn coverage, and broader sector reporting all support the view that the
              market perceives Wujie as a billion-dollar-plus business. What remains unresolved is the exact valuation
              attached to which round, the dilution incurred in successive financings, and whether customer-linked or
              policy-linked investors received any structural privileges. That distinction matters because early-stage
              humanoid valuations can look impressive while still embedding aggressive revenue assumptions and
              protective terms. Comparable capital signals from Figure and Unitree show how heated the sector has
              become, but they do not solve Wujie’s own opacity. For diligence, the critical missing data are
              straightforward: current cash on hand, monthly burn, signed collections schedule, pricing by deployment
              type, margin by robot generation, and the precise legal structure of angel versus follow-on capital. Until
              those are known, Wujie’s financial story should be read as strongly financed and commercially promising,
              but not yet auditable in a conventional venture or growth-equity sense.
