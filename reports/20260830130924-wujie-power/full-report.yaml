            body: >-
              Wujie’s current strengths are also dependencies. Envision is both a strategic backer and the most
              economically significant public customer reference. ZF LIFETEC is both manufacturing proof and a
              concentration point for industrial validation. HOLLYS and the Beijing coffee pilots help diversify scene
              evidence, but they are still pilots rather than durable multi-site contracts. That makes Wujie vulnerable
              to slippage by a small number of counterparties. The company is also dependent on broader ecosystem
              variables: embodied-model training infrastructure, compute availability, industrial parts, overseas
              compliance acceptance, and the service capacity needed to support customers after shipment. China’s
              standards push could improve domestic acceptance, yet it may also widen the gap with Western certification
              philosophies, forcing Wujie to navigate multiple assurance regimes. Abroad, procurement politics can
              strike earlier than end-market demand does. Even if private-sector industrial customers remain open,
              public-sector or sensitive-facility channels could close first. The result is a dependency profile where
              customer concentration, investor-customer overlap, and supply-plus-compliance complexity all transmit
              directly into revenue risk.
