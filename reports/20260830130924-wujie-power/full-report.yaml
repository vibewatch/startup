  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer map
        blocks:
          - type: paragraph
            body: >-
              Wujie’s current customer base should be read as a narrow enterprise-launch book rather than as a broad
              horizontal market. The retained public evidence points to four segment clusters. First are large
              industrial or energy-transition buyers represented by Envision Group, where the robot is framed as part of
              overseas renewable-energy, AI-data-center, and adjacent industrial deployment. Second are
              advanced-manufacturing customers represented by ZF LIFETEC, where Wujie is being evaluated for complex
              passive-safety-component manufacturing tasks that conventional fixed automation handles poorly. Third are
              mobility or smart-device ecosystem partners represented by OMOWAY, which suggests a route into
              smart-riding operations, showrooms, or light-manufacturing workflows. Fourth are bounded
              commercial-service partners represented by HOLLYS and an additional unnamed Beijing coffee partner, where
              the product is tested in open scenes with human traffic, real demand variation, and safety constraints.
              Across those segments, the buyer is usually an operations, manufacturing, or innovation owner; the user is
              the on-site operator or service environment; and the payer is almost certainly an enterprise procurement
              budget rather than a consumer. Public evidence does not support a home-robot customer story today.
