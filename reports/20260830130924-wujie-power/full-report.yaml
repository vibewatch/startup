        title: Founders, leadership, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              The clearest public leadership facts center on two executives. Zhang Yufeng is named repeatedly as founder
              and CEO and is described as a former senior Horizon Robotics executive who left autonomous-driving
              leadership to start Wujie in 2025. Xia Zhongpu formally joined as co-founder and co-CTO in March 2026
              after prior roles at Li Auto and Baidu Apollo and after research work on world models and reinforcement
              learning at the Chinese Academy of Sciences. This leadership mix matters because it explains Wujie’s
              emphasis on “native world model + reinforcement learning” and on engineering for long-horizon real-world
              deployment, not only lab demos. At the same time, reviewed sources do not publish a board roster,
              shareholder control map, liquidation preferences, or other financing-governance details. That leaves
              meaningful key-person risk concentrated in a young company whose commercial narrative still depends
              heavily on founder interviews and media disclosures. Until a registry pull or investor materials surface,
              governance analysis has to remain conservative and gap-aware.
