      - number: '2.3'
        title: Wujie-specific accessible market and adoption path
        blocks:
          - type: paragraph
            body: >-
              Wujie’s disclosed partnerships make its addressable market easier to frame than many earlier-stage
              humanoid startups. Envision anchors the renewable-energy and battery-manufacturing wedge; ZF LIFETEC
              anchors high-complexity auto-safety manufacturing; OMOWAY adds a mobility-adjacent counterparty; and the
              HOLLYS / coffee pilot shows that management is simultaneously testing generalization and human-robot
              interaction in commercial service. Together, those references suggest Wujie is chasing scenarios where
              flexible manipulation, navigation, and long-horizon reasoning matter more than spectacle. The right
              adoption model is likely staged: paid or subsidized pilots, data gathering and task tuning, repeat
              deployment at one site, then expansion across similar facilities or stores. Europe and Korea matter
              because they combine higher labor cost, stronger standards expectations, and willingness to experiment
              with automation in branded environments. Even so, Wujie’s near-term SOM is small relative to sector TAM,
              and real commercial conversion will depend on whether K15 can deliver reliable cycle times and safe
              operations, not just certification and fundraising headlines. This staged framing also explains why
              customer references matter more than abstract unit forecasts. If Wujie can convert one large industrial
              counterparty into repeat, multi-site adoption, the resulting proof can unlock adjacent buyers much faster
              than another generic financing headline. If those pilots stall, then even a strong standards backdrop and
              favorable macro narrative will not automatically produce revenue.
