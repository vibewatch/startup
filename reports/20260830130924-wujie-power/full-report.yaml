      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Durability, not novelty, is the decisive risk
            body: >-
              Public evidence shows Wujie can win attention and counterparties. The unresolved question is whether its
              robots can sustain uptime, safety, and support economics once customer novelty fades.
