            title: Order headlines are not the same as investable revenue quality
            body: >-
              Until investors can inspect contract terms, acceptance milestones, and service economics, backlog should
              be treated as a positive signal—not a clean revenue multiple input.
            calloutType: risk
            claimRefs:
              - CV008
              - CV020
