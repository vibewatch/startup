  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and thesis summary
        blocks:
          - type: paragraph
            body: >-
              Wujie earns a TRACK recommendation with medium confidence, a high risk rating, and a valuation stance best
              described as “interesting, but only with disciplined entry.” The thesis for being constructive is
              straightforward. Wujie is not merely a lab concept: multiple sources support cumulative angel-stage
              financing above US$200 million, a near-Pre-A or follow-on financing process, a named global order with
              Envision, industrial cooperation with ZF LIFETEC, export shipment of K15 to Europe, and bounded
              commercial-scene pilots. These are stronger signals than many robotics startups have at the same age. The
              anti-thesis is equally straightforward. Public disclosures do not reveal revenue, gross margin, burn, cash
              runway, cap-table preferences, customer-level contract terms, or real fleet reliability. In other words,
              the company has enough traction to justify unicorn status, but not enough disclosure to justify buying the
              narrative at any price. For investors, that means the right question is not “is Wujie good?” but “at what
              valuation, with what protections, and after which diligence items clear?”
            claimRefs:
              - CV001
              - CV002
