  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding history and capital formation
        blocks:
          - type: paragraph
            body: >-
              Wujie’s 2026 financing pace is the clearest financial fact pattern in the retained evidence set. Multiple
              sources converge on the point that cumulative angel-stage funding exceeded US$200 million, with rounds
              moving quickly enough that some reports describe Angel++, Angel+++, or a Pre-A / near-Pre-A progression
              rather than one cleanly disclosed round structure. That ambiguity is itself meaningful: it suggests
              fast-moving financing momentum and strong investor demand, but also means the public record is not yet
              tidy enough to support a precise priced-round chronology. The investor set is unusually strong for such an
              early commercial stage. Reported participants include Envision Group, the Beijing AI Industry Investment
              Fund, Sequoia China, Linear Capital, Hillhouse-linked capital, BV/Baidu Ventures, and additional RMB and
              dollar funds. Strategically, that mix matters because it combines industrial pull-through with venture
              endorsement. Financially, it means Wujie did not have to rely on one capital source or one headline
              investor to establish momentum. The capital-formation story is therefore a positive signal, but the
              absence of disclosed security terms, liquidation preferences, board rights, or post-money ownership
              percentages limits how precisely that signal can be converted into cap-table quality.
