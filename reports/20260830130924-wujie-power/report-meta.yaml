companyProfile:
  summary: >-
    Wujie Power (无界动力) is a Beijing-based embodied-AI robotics startup that
    emerged in 2025 and positions itself as a full-stack builder of robot body,
    world-model software, control, and deployment workflows. Public sources name
    Zhang Yufeng as founder and CEO and Xia Zhongpu as co-founder and co-CTO,
    tying the company to autonomous-driving and embodied-intelligence execution
    experience. The company stands out because public reporting already links it
    to more than US$200 million of angel financing, a near-complete Pre-A, a
    disclosed RMB 500 million-plus Envision order, and first-batch K15 shipment
    into Europe. What remains missing is precise revenue recognition,
    contract-economics detail, cash-flow disclosure, and governance visibility.
