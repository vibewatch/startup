- id: comparables-adverse-case-and-thesis-breakers
  title: Comparables, adverse case, and thesis-breakers
  body: Comparable analysis argues for humility. Figure’s US$39 billion post-money valuation is a different universe driven by mega-consortium capital and a category-leader narrative; it is useful mainly as a reminder of how much global capital can chase embodied AI. Apptronik’s roughly US$5–5.5 billion valuation range, Unitree’s reported US$9 billion IPO pricing, and UBTech’s public market capitalization around US$5.36 billion are closer reference points, but each sits on more mature commercial or public-market evidence than Wujie currently provides. Agility’s roughly US$2.12 billion valuation and industrial-logistics focus may be the philosophically closest external comp, though even that remains an imperfect match. The adverse case for Wujie is that investors treat it like a scaled peer before it has disclosed the things that scaled peers eventually must disclose. The most important thesis-breakers are not stylistic misses; they are structural. If Envision does not turn into realized
    deployment, if ZF-style references do not multiply, if support or reliability economics are poor, or if the next financing step reprices the story down before the company proves revenue quality, then even a superficially impressive current narrative can compress quickly.
