- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - No public revenue, margin, or collections disclosure
    - Impossible to validate revenue multiple or working-capital quality
    - CFO / lead investor data room
  - - Contract economics
    - No public duration, pricing, or cancellation terms for Envision, ZF, or pilots
    - Backlog quality cannot be underwritten
    - Customer-contract review
  - - Reliability and service burden
    - No MTBF, MTTR, warranty, or spare-part data
    - Service economics may decide whether scale is attractive
    - Ops and field-service review
  - - Cap table and preference stack
    - No public liquidation, anti-dilution, or related-party detail
    - Return outcomes depend on structure, not only enterprise value
    - Legal / financing diligence
  - - Burn and runway
    - No public cash-burn or reserve profile
    - Need to know if next round is optional or mandatory
    - Finance diligence
  - - Exit route realism
    - IPO, strategic sale, or later private round not yet evidenced
    - Exit path determines acceptable entry price today
    - Board / investor strategy review
  notes: Until these asks are resolved, valuation should be treated as a range with a meaningful uncertainty discount.
