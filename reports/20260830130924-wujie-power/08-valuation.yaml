- id: financing-context-and-current-valuation-stance
  title: Financing context and current valuation stance
  body: 'Public evidence supports a broad current-valuation anchor better than a precise point estimate. The strongest anchor is categorical rather than contractual: Wujie is repeatedly described in 2026 sources as part of China’s new embodied-AI unicorn cohort, which by definition places it above US$1 billion. The company’s more than US$200 million cumulative angel financing and near-Pre-A momentum also imply a valuation well above ordinary seed or Series A hardware companies. At the same time, the public record lacks the priced round terms that would justify a cleaner point estimate. That forces a milestone-based rather than spreadsheet-pure valuation approach. Wujie appears meaningfully below the global top tier represented by Figure’s US$39 billion round and below Chinese scale leaders such as Unitree’s reported US$9 billion IPO pricing, but clearly above subscale concept-stage robotics teams. The most defensible current fair-value lens is therefore a supportable band rather than a single
    mark, anchored by unicorn confirmation, order proof, industrial deployment freshness, and a discount for opacity. On that basis, a roughly US$1.0B–US$1.8B current supportable range, centered near the low-to-mid US$1B area, is defensible as an analyst construct rather than a confirmed transaction price.'
