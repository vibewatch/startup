- id: bull-base-bear-scenarios-and-return-logic
  title: Bull / base / bear scenarios and return logic
  body: 'Because Wujie’s public financial disclosure is sparse, the most honest way to think about valuation is through milestone scenarios. The bull case assumes Envision, ZF, and follow-on industrial references convert into repeatable multi-site programs; service pilots prove safe and replicable; support burden remains manageable; and the company reaches meaningful industrial revenue by 2028 while staying fundable. Under that path, a valuation in the US$2.5B–US$4.0B range is plausible. The base case assumes Wujie remains a real but still early industrial robotics company: customer proof expands, but revenue recognition and support economics remain mixed. That path supports something more like US$1.5B–US$2.5B over the next 24–36 months. The bear case assumes order-to-revenue conversion disappoints, maintenance or reliability burden rises, geopolitical channels narrow, or financing sentiment reverses before durable economics are visible. That path can force Wujie back toward or even below
    the unicorn threshold. Probability weight should sit with the base case, not the bull, because Wujie has proven interest faster than it has proven durable cash-generation. From a current entry around the low-US$1B area, that creates a return profile that is interesting but not obviously sufficient for undisciplined venture pricing.'
