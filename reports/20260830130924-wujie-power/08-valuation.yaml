- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Early warning sign
  - Implication
  rows:
  - - Envision order fails to convert into realized deployment
    - Anchor customer underpins much of the commercial narrative
    - Delayed shipments, vague milestones, no revenue recognition clues
    - Current range compresses sharply
  - - ZF-style industrial references do not multiply
    - Repeatability is the core question for industrial humanoids
    - No second serious factory reference after extended time
    - Narrative remains single-account dependent
  - - Support / reliability burden overwhelms labor-value case
    - Service cost can erase hardware margin quickly
    - High maintenance cadence, low uptime, field-engineer intensity
    - Base case breaks toward bear case
  - - Next financing step prices below implied unicorn level
    - Would reveal sentiment outrunning evidence
    - Down-round language, structure-heavy terms, or insider-only bridging
    - Narrative discount widens
  - - Geopolitical or procurement restrictions narrow attractive channels
    - Reduces TAM for cross-border growth
    - Buyer hesitation in sensitive markets or new restrictions
    - Multiple compression even if product works
  - - Serious safety incident in mixed human environment
    - Damages trust across industrial and service scenes
    - Public pause in pilots or emergency retrofits
    - Commercial proof resets backward
  notes: These triggers focus on events that would reprice Wujie, not merely delay its roadmap.
