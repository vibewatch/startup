chapter:
  number: 8
  title: Valuation and Investment Recommendation
  summary: 'Wujie Power deserves a TRACK recommendation with medium confidence and high risk. The company has unusually strong momentum for a very young humanoid-robot startup: cumulative angel-stage financing above US$200M, unicorn status supported by multiple 2026 market summaries, a meaningful named Envision order, export shipment into Europe, and industrial-plus-service reference customers. Those positives argue the business should be valued above a generic pre-revenue robotics concept. But public evidence still leaves crucial underwriting questions unanswered: there is no disclosed revenue, gross margin, burn, cap-table preference stack, or customer-level contract economics. Against better-disclosed comparables such as UBTech’s public market cap and large private rounds at Figure, Apptronik, and Unitree, Wujie looks directionally valuable but still too opaque for aggressive pricing. The most supportable stance is to watch entry discipline carefully, underwrite only a range rather than
    a point estimate, and demand proof that backlog converts into durable, supportable deployment economics.'
sections:
- id: recommendation-and-thesis-summary
  title: Recommendation and thesis summary
  body: 'Wujie earns a TRACK recommendation with medium confidence, a high risk rating, and a valuation stance best described as “interesting, but only with disciplined entry.” The thesis for being constructive is straightforward. Wujie is not merely a lab concept: multiple sources support cumulative angel-stage financing above US$200 million, a near-Pre-A or follow-on financing process, a named global order with Envision, industrial cooperation with ZF LIFETEC, export shipment of K15 to Europe, and bounded commercial-scene pilots. These are stronger signals than many robotics startups have at the same age. The anti-thesis is equally straightforward. Public disclosures do not reveal revenue, gross margin, burn, cash runway, cap-table preferences, customer-level contract terms, or real fleet reliability. In other words, the company has enough traction to justify unicorn status, but not enough disclosure to justify buying the narrative at any price. For investors, that means the right question
    is not “is Wujie good?” but “at what valuation, with what protections, and after which diligence items clear?”'
