- id: exit-readiness-and-final-diligence-asks
  title: Exit readiness and final diligence asks
  body: 'Wujie is not yet exit-ready by public-market standards, and that is not a criticism—it is a stage fact. Public listings and mature growth rounds require defensible disclosure on revenue, margin structure, customer concentration, support burden, governance, and risk controls. UBTech’s filing and Tesla’s SEC reporting show how far the disclosure bar rises once a robotics company is valued publicly. For Wujie, the final diligence agenda should therefore focus on what would convert an intriguing story into an investable one at scale. First, confirm the real economics of the Envision backlog and ZF-style industrial work: contract duration, pricing model, acceptance milestones, and cancellation rights. Second, quantify reliability and service burden: MTBF, MTTR, uptime, spare-part churn, and warranty reserve logic. Third, inspect the cap table, preferences, and any investor-customer related-party terms. Fourth, verify burn, runway, and whether the next financing step is being priced off
    revenue evidence or only market heat. Fifth, decide what exit route is actually plausible—China IPO, strategic industrial buyer, or later-stage private round—and whether that route can absorb a still-opaque hardware business. Until those items clear, Wujie should remain on the watchlist rather than in the “pay up and hope” bucket.'
