- id: people-and-execution-risk
  title: People and execution risk
  body: 'Wujie remains a founder-led execution story. Public materials identify Zhang Yufeng as founder and CEO and Xia Zhongpu as co-founder and co-CTO, both with strong autonomous-driving and systems backgrounds. That is an asset because the company is trying to solve a full-stack embodied problem spanning world models, data pipelines, hardware, and industrial deployment. It is also a risk because the public bench beneath them is not deeply disclosed. In an early-stage humanoid company, technical leaders carry product vision, investor trust, customer credibility, and recruiting magnetism simultaneously. Founder commentary also shows management understands the difficulty of crossing from demo to mass production; Zhang explicitly frames that transition as vastly harder than building the demo itself. The company’s first full delivery year is still measured in only “a few hundred units,” which means execution risk now centers on sequencing: how fast to ship, how much customization to allow,
    how to prioritize industrial versus commercial scenes, and whether support and supply maturity can keep pace with financing momentum. If Wujie scales ambition faster than process discipline, people risk becomes operational risk very quickly.'
