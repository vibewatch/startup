company:
  name: Wujie Power
chapter:
  number: 7
  title: Risks
  summary: 'Wujie Power’s risk profile is high but intelligible. The company has real product, real named counterparties, and more financing than many peers, yet most downside vectors are the classic early-stage humanoid-robot hazards concentrated into a shorter time window: rules are still moving, product reliability data is thin, key people carry disproportionate technical and commercial load, customer concentration is high, and capital needs will likely remain large even after a US$200M+ angel stage. The strongest positive mitigants are pragmatic go-to-market choices—industrial scenes first, bounded commercial scenes second, safety-first rhetoric, and a mid-stage platform built for engineering validation. The strongest unresolved risks are durability, geopolitical channel loss, support burden, and the possibility that public valuation momentum in Chinese embodied AI outruns actual cash-generating deployment.'
sections:
- id: regulatory-legal-and-safety-risk
  title: Regulatory, legal, and safety risk
  body: 'Wujie operates in a category where capability is advancing faster than settled legal doctrine. China moved quickly in 2026 to publish a humanoid-robot and embodied-AI standard system spanning data, deployment, application, and safety. That is helpful domestically because it gives buyers and regulators a clearer path than a rules vacuum would. But it does not eliminate risk. U.S. and European frameworks are still developing different philosophies for certifying embodied systems, and the U.S. Humanoid ROBOT Act shows how quickly geopolitical concerns can turn into procurement restrictions for robots tied to countries of concern. At the same time, U.S. workplace safety guidance still says there are no robotics-specific OSHA standards, meaning deployers lean on broader machine-guarding, lockout, and consensus standards rather than a purpose-built humanoid rulebook. Hill Dickinson’s legal analysis underscores the core unresolved issue: if an embodied system causes harm, responsibility
    may sit with the manufacturer, operator, integrator, software stack, or some combination. Wujie’s move into coffee-service scenes and mixed human environments raises that question from theory to practice. The company’s safety-first posture is directionally good, but compliance, privacy, and liability frameworks remain incomplete across borders.'
