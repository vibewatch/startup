  - type: private-evidence-only
    severity: material
    topic: reliability metrics
    missingEvidence: No public MTBF, uptime, field-failure, maintenance-cadence, or repair-cost disclosures were found for Wujie deployments.
    whyItMatters: Reliability and maintenance determine whether pilots expand into profitable fleets.
    diligencePath: Request fleet telemetry, service logs, and warranty claims by model and customer.
