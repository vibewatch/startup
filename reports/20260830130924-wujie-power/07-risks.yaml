  - type: private-evidence-only
    severity: material
    topic: TR001 / TR002 cross-border compliance and security architecture detail
    missingEvidence: Public sources do not expose Wujie’s security architecture, update policy detail, penetration testing, or incident record.
    whyItMatters: Connected embodied systems turn cyber weaknesses into physical and reputational risk.
    diligencePath: Request architecture review, security policy, and incident-response documentation.
