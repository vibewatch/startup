      - number: '1.2'
        title: 创始人、领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开领导层事实集中在两名高管身上。Zhang Yufeng 多次被称为创始人兼 CEO；他曾是 Horizon Robotics 高管，后来离开自动驾驶领导岗位，于 2025 年创办 Wujie。Xia
              Zhongpu 在 2026 年 3 月正式加入，担任联合创始人兼联席 CTO； 此前他在 Li Auto 和 Baidu Apollo 任职，并在中国科学院做过世界模型和强化学习研究。这样的领导层组合很关键，
              因为它解释了 Wujie 为什么强调“原生世界模型 + 强化学习”，以及为什么工程重心放在长时程真实世界部署，而不只是实验室演示。
              但与此同时，受检来源没有披露董事会名单、股东控制图、清算优先权或其他融资治理细节。 这让一家年轻公司的关键人物风险变得实质性；它的商业叙事仍高度依赖创始人访谈和媒体披露。
              在工商登记调取或投资人材料出现前，治理分析必须保持保守，并明确缺口。
