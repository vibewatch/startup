        title: 财务 / 商业模式风险与放弃标准
        blocks:
          - type: paragraph
            body: >-
              财务风险不在于 Wujie 今天缺钱，而在于人形机器人规模化可能比早期部署转化为稳定现金流更快吃掉资金。超过 US$200 million 的天使轮融资让 Wujie
              比许多同业有更长现金跑道，但行业观察者不断提醒，2027–2028 年很可能是第一轮大洗牌窗口。Wujie
              仍处在交付早期，公开收入质量不透明，在手订单不能等同于已确认收入。硬件制造、质保敞口、现场服务、客户定制适配和库存融资都会提前占用现金。更大的市场背景有利有弊：Goldman
              看好结构化环境里的强需求，但多份市场摘要也写到估值飙升可能跑在商业验证前面。在这种环境下，尽调不应盯着融资标题，而要盯住会击穿投资逻辑的条件：锚定客户落地失约、发生严重安全事故、维护成本压过经济性、出口限制实质收窄增长渠道，或
              Wujie 尚未证明可重复交付质量之前融资降价。这些才是关键风险，因为任何一项都会同时重估收入预期和估值。
