  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 系统架构与核心产品
        blocks:
          - type: paragraph
            body: >-
              公开证据支持把 Wujie 看成分层具身智能栈，而不是单一机器人 SKU。在本体层，K15 被描述为通用轮式半人形机器人， 或基于轮式的移动操作机器人，面向全场景灵巧作业。在模型层，MWA
              被呈现为一个潜空间世界模型，使用长序列双向物理因果链和 chunk 级逆动力学，生成多步潜在动作序列。围绕这些层，还有感知、通信、安全和部署系统，让机器人适用于工业和半开放商业环境。
              这种架构很关键，因为它解释了为什么融资报道反复提到世界模型、数据管线和基础设施，而不只是硬件制造。Wujie 试图同时掌握决策栈、 数据闭环和物理平台。发货和交付报道中保留下来的 K15
              设计细节也强化了这一点：它是任务优先产品，不是泛化人形机器人秀场。 平台针对受限工作空间优化，手腕翻转半径为 30 mm，可在宽度不超过 800 mm 的全向工作区域内运行。
              这个几何细节直接说明，公司在为产线边和服务空间的实用性做优化。
