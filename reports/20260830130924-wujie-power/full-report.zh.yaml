              公开里程碑显示，公司仍处早期，但推进速度快过典型机器人种子期项目。仅在 2026 年，Wujie 就宣布了超大额天使轮融资， 发布 MWA 世界模型，在 Stanford 相关 RoboCasa
              基准上登顶，在工业级 CE 放行后开启 K15 批量交付，完成海淀中试生产平台， 并在 WRC 2026 借 HOLLYS 展示商业服务流程。最关键的里程碑不是演示，而是商业化：Wujie 称全球订单簿接近
