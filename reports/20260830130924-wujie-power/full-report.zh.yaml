    title: 估值敏感性
    type: bar
    layout: standard
    summary: 用参考条对比当前分析师区间，以及公开或报道的同业估值信号。
    data:
      items:
        - label: 悲观底线 / 下轮降价融资风险
          value: 600
        - label: 当前区间低端
          value: 1000
        - label: 当前中点判断
          value: 1300
        - label: 当前区间高端
          value: 1800
        - label: Agility 式参考
          value: 2120
        - label: UBTech 公开市值
          value: 5360
        - label: Apptronik 估值区间中点
          value: 5250
        - label: Unitree IPO 定价报道
          value: 9000
        - label: Figure 投后估值
          value: 39000
    approximationNotes: Wujie 估值是分析师构建值；同业参考条混合了保留来源中的公开市场市值、报道的私营公司估值和报道的 IPO 定价锚点。
    claimRefs:
