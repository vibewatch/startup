      - number: '4.3'
        title: 资本强度、单位经济性与现金跑道
        blocks:
          - type: paragraph
            body: >-
              即便融资充足，具身 AI 机器人在结构上仍然吃资本。Wujie 不只是在做模型和数据管线；它还要验证工业硬件、支撑国际合规、
              资助试点部署，并在北京维持生产验证平台。保留来源显示，公司已经建成中试生产和验证平台，并开始发往欧洲， 两者都意味着真实营运资金和支持负担，这些是纯软件初创公司不用承担的。由此可以同时得出两个结论。第一，
              Wujie 的资本充足度很可能强于多数早期机器人同业，原因很简单：超过 US$200 million 的天使轮资金池异常大。
              第二，如果公司全球招人、补贴试点、吸收保修或现场服务成本，或者在现金回款确认前持有库存，同一笔资金也可能很快被吃掉。 没有公开毛利率或现金余额披露，任何现金跑道估计都只能是示意。最稳妥的公开判断是：Wujie
              有足够融资在 2026 年乃至之后积极推进商业化， 但披露的经济性还不足以断言它已经解决机器人行业的经典难题——把技术进步转成盈利部署。
