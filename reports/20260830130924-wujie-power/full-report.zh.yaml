companyProfile:
  summary: >-
    Wujie Power（无界动力）是一家 2025 年浮出水面的北京具身 AI 机器人初创公司，定位为全栈玩家，自己搭机器人本体、世界模型软件、控制系统和部署流程。 公开资料称 Zhang Yufeng 为创始人兼 CEO、Xia
    Zhongpu 为联合创始人兼联席 CTO，把公司与自动驾驶和具身智能落地经验连接起来。 它之所以突出，是因为公开报道已经把它同超过 US$200 million 的天使轮融资、接近完成的 Pre-A、已披露的超过 RMB 500
    million Envision 订单，以及 K15 首批发往欧洲联系在一起。缺口仍在：收入确认、合同经济性、现金流和治理可见度都还不精确。
