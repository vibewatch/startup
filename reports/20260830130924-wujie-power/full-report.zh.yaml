      - number: '5.2'
        title: 流程匹配与真实场景迭代
        blocks:
          - type: paragraph
            body: >-
              Wujie 最强的产品信号，来自管理层对机器人应该在哪里学习的解释。在 Zhang Yufeng 2026 年 8 月访谈中，公司把工业场景称为训练技能的地方，
              把商业场景称为训练泛化的地方。这个区分在技术上很重要。它意味着产品围绕经济价值可识别的真实流程开发， 再放到咖啡零售这类更动态的公共环境中做压力测试。披露的工业用例并不随机。Zhang
              特别提到固定自动化难以处理的任务， 例如操作可变形汽车安全带材料，并把它们放入夹具或测试设备；这些任务的力、形状和位置都会变化。HOLLYS 咖啡空间试点则成为第二个训练场： SKU
              少于家庭场景，但有人移动、桌面变化，也有安全敏感交互。因此，产品不是直接跳向家庭，而是沿着分阶段流程图演进：
              紧约束工业任务、有边界商业任务，再到更广泛泛化。这套分阶段学习逻辑，是保留来源中最清晰的技术战略表述之一。
