        - 事故频率、险肇事件、客户安全签核
        - 重大现场安全事故，且故障隔离不清
        - 投资逻辑立即受损，销售摩擦上升
      - - 可靠性 / 支持
        - 中试平台、工业优先顺序、场景迭代学习
        - MTBF、MTTR、备件消耗、支持人员配置
        - 维护负担压过节省人工逻辑的证据
        - 规模化前经济账先断
      - - 客户集中度
        - 增加工业背书，推动试点转为多站点项目
        - 最大客户在积压订单和已确认收入中的占比
        - 锚定客户落地明显延迟或取消
        - 估值和融资定价下调
      - - 地缘政治渠道风险
        - 优先进入私营部门需求可落地的市场
        - 立法进展、出口管制变化、买方尽调周期
        - 限制措施切掉关键海外垂直，比国内需求补位更快
        - 增长渠道被压缩
      - - 资本密集度
        - 提前融资，并把部署限制在经济账最清楚的场景
        - 现金跑道、保修准备金、营运资本占用
        - 可复制单元经济尚未验证，融资条款已经恶化
        - 降估值融资或战略依赖
      - - 人员 / 执行
        - 收窄路线图，补强运营梯队
        - 高管留任、交付质量、定制项目负荷
        - 战线太多，创始人精力成为瓶颈
        - 产品和 GTM 同时失速
    notes: 这些叫停标准聚焦会打断商业验证的事件，而不是临时噪音。
    claimRefs:
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
      - CR044
  - id: TV001
    title: 建议摘要表
    columns:
