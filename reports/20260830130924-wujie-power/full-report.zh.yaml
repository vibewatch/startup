      - 反向逻辑
      - 综合判断
    rows:
      - - 市场
        - 具身 AI 和工业人形机器人正在吸引巨额资本和买方关注
        - 赛道热度可能跑在短期变现前面
        - 正面，但拥挤
      - - 产品
        - K15、MWA 和真实场景试点说明不只是概念演示
        - 长期可靠性和支持数据仍缺失
        - 有潜力，但未验证
      - - 客户
        - Envision、ZF 和 HOLLYS 提供的证明强于单纯 logo
        - 客户账本仍窄，经济性也不透明
        - 证明不错，分散度弱
      - - 财务
        - 超过 US$200M 的天使轮融资降低了短期资金压力
        - 收入、毛利率、烧钱速度和优先股堆叠未披露
        - 融资强，透明度弱
      - - 竞争
        - Wujie 有可信的工业优先细分位
        - Unitree、Apptronik、Figure 和 UBTech 等同行把证据门槛抬得更高
        - 有竞争力，但应打折
      - - 风险
        - 创始人的务实取向和限定场景策略是缓释信号
        - 监管分化、客户集中和支持负担可能迅速打断叙事
        - 高风险 / 高期权性
