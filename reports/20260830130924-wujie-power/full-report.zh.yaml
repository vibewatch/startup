      - number: '6.2'
        title: 采用轨迹与部署状态
        blocks:
          - type: paragraph
            body: >-
              公开可见的商业轨迹先是形成具名订单，随后进入出口发货、现场工厂协作和开放场景试点运营。2026 年 4 月至 6 月， 多个来源报道 Wujie 已累计超过 US$200 million
              天使轮融资，并签下有意义的全球订单；其中几篇报道称 Envision 市场订单价值超过 RMB 500 million。到 2026 年 7 月，Shanghai Securities News 报道 K15
              已进入全球批量交付，首批发往欧洲。 这比原型发布更强，因为它意味着一定程度的客户验收、出口合规和制造就绪。到 2025 年 12 月，Wujie 与 ZF LIFETEC 已经公开描述在 ZF
              中国工厂内开展的工作。到 2026 年 8 月，Wujie 又在 WRC 展示 HOLLYS 品牌咖啡空间试点； 创始人称另一处北京咖啡点位已经完成一段时间试运营，并计划再运行四个月，然后在 2026 Q4
              进入韩国。 这个模式值得注意：Wujie 并未声称大众消费级规模，而是在沿工业到服务的分阶段采用路径推进。
