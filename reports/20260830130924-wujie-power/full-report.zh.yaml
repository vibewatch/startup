  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方地图
        blocks:
          - type: paragraph
            body: >-
              Wujie 当前客户基础应被理解为狭窄的企业启动订单簿，而不是广泛横向市场。保留公开证据指向四类客户集群。 第一类是 Envision Group 代表的大型工业或能源转型买家；机器人被放进海外可再生能源、AI
              数据中心和相邻工业部署叙事中。 第二类是 ZF LIFETEC 代表的先进制造客户；Wujie 正被评估用于复杂被动安全零部件制造任务，这些任务是传统固定自动化的弱项。 第三类是 OMOWAY
              代表的出行或智能设备生态伙伴，暗示公司可能进入智能骑行运营、展厅或轻制造流程。 第四类是 HOLLYS
              以及另一家未具名北京咖啡合作方代表的有边界商业服务伙伴；产品在开放场景中接受人流、真实需求波动和安全约束测试。
              跨这些细分场景，买家通常是运营、制造或创新负责人；使用者是现场操作员或服务环境；付款方几乎肯定是企业采购预算，而不是消费者。 公开证据目前不支持家庭机器人客户故事。
