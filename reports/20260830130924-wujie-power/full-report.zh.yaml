      - number: '8.4'
        title: 可比公司、反向情景与击穿逻辑
        blocks:
          - type: paragraph
            body: >-
              可比分析提示要谦逊。Figure 的 US$39 billion 投后估值是另一个宇宙，靠超大财团资本和品类领导者叙事驱动；它主要提醒我们，全球资本会为具身 AI 追得多凶。Apptronik 大约
              US$5–5.5 billion 的估值区间、Unitree 据报道 US$9 billion 的 IPO 定价、以及 UBTech 约 US$5.36 billion 的公开市值更接近，但每一家都有比
              Wujie 目前更成熟的商业或公开市场证据。Agility 大约 US$2.12 billion 的估值和工业物流聚焦，在理念上或许是最接近的外部可比，但仍不完全匹配。Wujie
              的反向情景是：公司尚未披露规模化同业最终必须披露的东西，投资人就先把它当成规模化同业定价。最重要的击穿逻辑不是风格失误，而是结构性问题。如果 Envision 不能变成实际部署，如果 ZF
              式背书没有复制，如果支持或可靠性经济性很差，或者下一轮融资在公司证明收入质量前就下调故事定价，那么当前看似亮眼的叙事也会很快压缩。
