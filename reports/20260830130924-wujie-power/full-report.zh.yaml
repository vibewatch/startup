chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与业务边界
        blocks:
          - type: paragraph
            body: >-
              2026 年受检报道一致把 Wujie Power 描述为一家北京公司，做通用具身 AI 机器人，以及面向物理世界作业的“通用大脑”。 公司把自己定位为全栈供应商，而不是零部件厂商：公开材料把 MWA
              具身通用大脑架构，与自研机器人本体、中央计算平台、传感设备和生产基础设施放在一起。 围绕 K15 产品线的报道显示，Wujie 并不只盯着科研机器人。它优先切入工业操作、海外工厂部署和商业服务环境，
              这些场景里的机器人必须与人、动态物体和生产设备共处。2026 年 6 月至 8 月的新闻流还呈现出一条推进线： 融资、模型发布、CE 认证后的批量交付，再到 WRC
              咖啡店展示，意味着公司在有意从逻辑验证走向可见商业化。 这条顺序会影响后文判断：Wujie 还没有证明自己能规模化制造，但围绕产品、合作伙伴和交付动作披露的信息已经足够，
              可以把它视为一家有真实商业化意图的运营型初创公司，而不是纯概念实验室。
