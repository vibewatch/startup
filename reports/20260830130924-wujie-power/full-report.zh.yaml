      - number: '3.3'
        title: Wujie 的相对位置与差异化
        blocks:
          - type: paragraph
            body: >-
              把 Wujie 放在企业移动操作框架下，而不是通用人形机器人人气赛里，它的定位最可信。K15 被呈现为一款轮式半人形平台，
              适合狭小工作空间操作；公司的公开叙事把这种本体设计，与可出口工业用途、基于世界模型的控制，以及 Envision 和 ZF LIFETEC 等具名交易方连接起来。这个组合很关键，因为它让 Wujie
              区别于至少两类常见同业原型：开发者优先的低价厂商， 以及演示很强、但在保留证据中具名工业参照更薄的 AI 前置厂商。HOLLYS 试点把叙事扩展到开放商业环境，
              但最强的护城河候选仍是来自工厂或运营流程的工业数据积累和重复部署学习。因此，相比消费吸引力或公开参数表密度， Wujie 更适合按企业就绪度指标来比较，比如客户具体性、交付证据和工业集成叙事。
