      - number: '2.2'
        title: 增长驱动、约束与政策背景
        blocks:
          - type: paragraph
            body: >-
              市场顺风是真实的。中国工信部在 2026 年初发布首个人形机器人与具身智能国家标准体系；受检来源显示，中国正从碎片化演示走向更协调的产业栈。 IDC 相关及分析师报道里的出货数据表明，2025
              年是放量突破之年；随着独角兽形成和 IPO 通道扩展，2026 H1 的融资环境再次提速。 劳动力和自动化经济性也支撑需求：IFR
              将机器人视为应对劳动力短缺，以及“脏、枯燥、危险、精细”任务人力难以维持的一种答案。 但同一批来源也指出了主要商业刹车。娱乐和研究仍占当前出货很大比例，说明出货增长走在成熟工业收入之前。 精密部件、AI
              操作、安全认证、集成标准和客户 ROI 仍未充分解决，足以让市场份额在厂商之间快速流动。 对 Wujie 来说，这意味着品类动能强，但执行不能粗糙。换句话说，这个品类正在从政策支持的探索，转向采购检验的执行。
              厂商可以受益于上升市场，却仍会失败，只要它无法证明安全案例、嵌入客户变革管理流程，并压住现场服务成本。 因此，同一组行业统计既能支持乐观市场判断，也能支撑谨慎承销立场。
