      - number: '8.2'
        title: 融资背景与当前估值立场
        blocks:
          - type: paragraph
            body: >-
              公开证据更适合支撑一个宽泛的当前估值锚，而不是精确点估。最强锚点不是合同条款，而是类别判断：2026 年多份来源反复把 Wujie 列入中国新一批具身 AI 独角兽，因此按定义高于 US$1
              billion。累计超过 US$200 million 的天使轮融资和接近 Pre-A 的动能，也意味着估值显著高于普通种子轮或 Series A
              硬件公司。与此同时，公开记录缺少能给出更干净点估的定价轮条款。因此估值只能靠里程碑，而不是纯表格模型。Wujie 明显低于 Figure 的 US$39 billion 轮次所代表的全球第一梯队，也低于
              Unitree 据报道 US$9 billion IPO
              定价这样的中国规模化龙头，但又显著高于未成规模的概念阶段机器人团队。眼下最站得住脚的公允价值视角，是一个可支撑区间，而不是单一标记；它由独角兽确认、订单证明、工业部署新鲜度支撑，同时因不透明打折。按这个框架，当前可支撑区间大约
              US$1.0B–US$1.8B，中心在 US$1B 低位至中位区间附近；这更像分析师构造，不是已确认交易价格。
