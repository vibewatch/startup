      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的公司特定风险，不是 Wujie 能否做出吸引人的演示，而是它能否在真实工业和半开放商业环境中持续保持可靠。 公开证据显示 K15
              进入欧洲、北京中试平台开放，工厂和咖啡空间都有现场试验。这令人鼓舞，但也缩短了原型野心和现场责任之间的距离。 创始人评论少见地坦诚：行业的 zero-shot 能力仍弱于 few-shot
              适应，手、关节及相关子系统的工业级可靠性还没达到传统自动化买家的预期。 没有公开来源提供 Wujie 的
              MTBF、支持负担、现场故障或安全事故数据。产品还依赖一个把模型质量、数据闭环、云仿真、通信和安全冗余耦合在一起的栈。 任何一层表现不佳，失败就不只是技术问题，还可能变成客户信任或工人安全问题。出口合规和 CE
              相关认证有帮助，但不能证明长期正常运行时间。 从运营看，风险在于 Wujie 抵达客户现场的速度，可能快过维护、支持和安全架构成熟到可重复规模化的速度。
