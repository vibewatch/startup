      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              难点在于，Wujie 表面上的优势大多仍处早期，足以被复制或抵消。硬件形态差异可能很快收窄。围绕世界模型或具身大脑的 AI
              叙事正在全行业扩散。品类越强，买家越容易要求厂商证明正常运行时间、安全、支持和价格，而不是只看愿景。 Wujie 还背着公开透明度短板。几家同业提供了更可见的官方产品页、价格线索、投资方披露或长期品牌认知，而
              Wujie 在保留证据中仍缺少明确确认的公开网站。这样的缺口会削弱开发者生态形成，也可能放慢买家尽调。更耐久的护城河候选更难伪造： 真实工业订单、集成 know-how、出口执行和场景特定数据。如果 Wujie
              能把这些转成重复部署，它可以守住一个有意义的细分市场。 如果做不到，它可能被更便宜的中国硬件和资本更雄厚的全球 AI 品牌夹在中间。
