      - number: '5.3'
        title: 质量、安全与依赖
        blocks:
          - type: paragraph
            body: >-
              K15 的产品故事对信任、安全和运营就绪度着墨异常多。交付报道称 K15 通过了 CE-MD、CE-RED、CE-EMC、EN ISO 13849 和 EN 18031
              相关检查；公开文章反复把这些认证与真实工业部署连接起来，而不是只当营销话术。创始人评论也强调，开放场景里安全是第一约束， 速度和替代主张排在后面。这个框架与产品更广的依赖画像一致。Wujie
              系统依赖可靠关节和灵巧硬件、工业通信、具身模型训练基础设施、 数据管线、云仿真，以及足够的安全冗余，确保模型错误不会直接变成不安全动作。同一篇支撑 Wujie 技术野心的创始人访谈，
              也坦诚谈到行业边界：zero-shot 仍弱于 few-shot，更广泛的人形机器人行业在硬件成熟度和一致性上仍有困难，
              夹爪和关节的工业级可靠性标准仍领先于许多具身产品。这些评论让产品章节更强，而不是更弱，因为它们说明管理层明白： 稳健产品化远不止演示。
