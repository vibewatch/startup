  - id: TV005
    title: 逻辑破裂与叫停触发器表
    columns:
      - 触发器
      - 重要性
      - 早期预警信号
      - 影响
    rows:
      - - Envision 订单未能转为实际部署
        - 锚定客户支撑了大部分商业叙事
        - 出货延迟、里程碑模糊、没有收入确认线索
        - 当前区间急剧压缩
      - - ZF 式工业背书没有复制
        - 可复制性是工业人形机器人核心问题
        - 很长时间后仍没有第二个严肃工厂背书
        - 叙事仍依赖单一客户
      - - 支持 / 可靠性负担压过劳动力价值逻辑
        - 服务成本会迅速吃掉硬件毛利
        - 维护频率高、可用时间低、现场工程师投入重
        - 基准情景滑向悲观情景
      - - 下一轮融资价格低于隐含独角兽水平
        - 会暴露市场情绪跑在证据前面
        - 降估值表述、结构性条款偏重，或仅内部桥接
        - 叙事折价扩大
      - - 地缘政治或采购限制收窄有吸引力的渠道
        - 降低跨境增长的 TAM
        - 敏感市场买家犹豫，或出现新限制
        - 即便产品跑通，倍数也会压缩
      - - 混合人机环境发生严重安全事故
        - 工业和服务场景的信任都会受损
        - 公开暂停试点或紧急改造
        - 商业化证明倒退
    notes: 这些触发因素聚焦会让 Wujie 重新定价的事件，而不只是拖慢路线图。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
