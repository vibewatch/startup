  - id: TV004
    title: 可比估值表
    columns:
      - 公司 / 参照
      - 估值信号
      - 重要性
      - Wujie 对比
    rows:
      - - Figure AI
        - 投后 US$39B
        - 显示全球具身 AI 热情的上限
        - Wujie 阶段早得多、披露少得多，定价应大幅折价
      - - Unitree
        - IPO 定价报道约 US$9B
        - 中国硬件优先规模化龙头基准
        - Wujie 缺少 Unitree 的规模和市场能见度
      - - UBTech Robotics
        - 公开市场市值约 US$5.36B（2026 年 8 月）
        - 中国人形机器人敞口的公开市场基准
        - 披露成熟前，Wujie 可能需要承担非上市折价
      - - Apptronik
        - 估值区间约 US$5.0B–US$5.5B
        - 有重要战略投资方和试点的工业人形机器人同行
        - 有用的中档非上市可比；Wujie 目前估值应低于它
      - - Agility Robotics
        - 行业摘要确认估值约 US$2.12B
        - 工业优先路径上理念最接近的同行
        - 说明 Wujie 不必靠超大盘炒作，估值也可能超过 US$1B
      - - 1X Technologies
        - 资本充裕的消费 / 家庭叙事，估值野心高于基本面
        - 提醒我们，市场故事可能跑在当前收入前面
        - 对 Wujie 的工业优先路径参考价值较弱
    notes: 可比估值来自留存公开报道，可能是公开市场市值、已确认融资轮、目标 IPO 定价或行业数据库，而不是完全同步的估值标记。
