      - number: '2.3'
        title: Wujie 可触达市场与采用路径
        blocks:
          - type: paragraph
            body: >-
              Wujie 披露的合作关系，让它的可服务市场比许多更早期人形机器人初创公司更容易界定。Envision 锚定可再生能源和电池制造切口； ZF LIFETEC 锚定高复杂度汽车安全制造；OMOWAY
              增加了一个出行相邻交易方；HOLLYS / 咖啡试点则说明管理层同时在商业服务中测试泛化和人机交互。 这些参照合在一起表明，Wujie
              追逐的是灵活操作、导航和长时程推理比展示效果更重要的场景。正确的采用模型大概率是分阶段的：
              付费或补贴试点、数据采集和任务调优、单点重复部署，再扩张到相似设施或门店。欧洲和韩国重要，是因为它们同时具备更高劳动力成本、 更强标准预期，以及在品牌化环境中试验自动化的意愿。即便如此，相对于行业
              TAM，Wujie 的近期 SOM 仍然很小； 真正的商业转化取决于 K15 能否交付可靠节拍和安全运行，而不只是认证和融资头条。这个分阶段框架也解释了为什么客户参照比抽象出货预测更重要。 如果 Wujie
              能把一个大型工业交易方转成重复、多站点采用，形成的验证会比又一个普通融资头条更快打开相邻买家。 如果这些试点停滞，强标准背景和有利宏观叙事也不会自动转成收入。
