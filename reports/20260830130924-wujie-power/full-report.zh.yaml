      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Wujie 仍是创始人驱动的执行故事。公开材料将 Zhang Yufeng 识别为创始人兼 CEO，将 Xia Zhongpu 识别为联合创始人兼联席 CTO；
              两人都有很强的自动驾驶和系统背景。这是资产，因为公司要解决的是横跨世界模型、数据管线、硬件和工业部署的全栈具身问题。
              这也是风险，因为他们之下的公开团队厚度披露不深。在早期人形机器人公司里，技术领导者同时承载产品愿景、投资人信任、客户可信度和招聘磁力。 创始人评论还显示，管理层理解从演示走向量产的难度；Zhang
              明确把这个转变描述为远比做出演示本身更难。 公司第一个完整交付年度仍只以“几百台”计量，这意味着执行风险现在集中在排序上：发货多快、允许多少定制、如何在工业和商业场景之间排序，
              以及支持和供应成熟度能否跟上融资势能。如果 Wujie 扩张野心快过流程纪律，人员风险会很快变成运营风险。
