      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              由于 Wujie 公开财务披露稀疏，最诚实的估值方式是看里程碑情景。乐观情景假设 Envision、ZF 以及后续工业客户背书能转化为可重复的多站点项目；服务试点证明安全且可复制；支持负担保持可控；公司到
              2028 年跑出有意义的工业收入，并仍能融资。沿这条路径，US$2.5B–US$4.0B 估值是可能的。基准情景假设 Wujie
              仍是一家真实但早期的工业机器人公司：客户证明继续扩大，但收入确认和支持经济性仍好坏参半。这条路径在未来 24–36 个月更像支撑
              US$1.5B–US$2.5B。悲观情景假设订单到收入转化不及预期，维护或可靠性负担上升，地缘政治渠道收窄，或在可持续经济性可见前融资情绪反转。这条路径会把 Wujie
              拉回独角兽门槛附近，甚至跌破。概率权重应放在基准情景而不是乐观情景，因为 Wujie 证明市场兴趣的速度快于证明持久造血能力。从当前 US$1B 低位附近进入，回报曲线有看点，但不足以支撑无纪律的风险投资定价。
