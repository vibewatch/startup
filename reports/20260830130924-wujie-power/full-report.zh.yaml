  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资逻辑摘要
        blocks:
          - type: paragraph
            body: >-
              Wujie 获得观察（TRACK）建议，信心中等，风险评级高；估值立场可以概括为“有吸引力，但只有纪律性入场才成立”。看多逻辑很直接。Wujie 不只是实验室概念：多方信息支撑其累计天使轮融资超过 US$200
              million、正推进接近 Pre-A 或后续融资流程、拥有 Envision 具名全球订单、与 ZF LIFETEC 开展工业合作、K15
              已出口发往欧洲，并有边界清晰的商业场景试点。这些信号强于许多同龄机器人创业公司。反向逻辑同样直接：公开披露没有给出收入、毛利率、烧钱速度、现金跑道、股权结构表优先权、客户级合同条款或真实机队可靠性。换句话说，公司已有足够牵引力支撑独角兽身份，但披露不足以支撑投资人在任何价格买单。投资人该问的不是“Wujie
              好不好”，而是“什么估值、配什么保护条款、哪些尽调项通过之后才值得进”。
