      - number: '4.2'
        title: 收入信号与变现
        blocks:
          - type: paragraph
            body: >-
              最强的商业信号不是已报告收入，而是已签需求。公开来源把 Wujie 与一份超过 CNY 500 million 的 Envision 协议联系起来， 也与一个接近 US$100 million、并在 2026
              年年中开始进入交付的全球订单簿联系起来。这很关键，因为它说明公司还未披露成熟装机基础之前， 真实客户已经愿意承诺资本。但这些数字不能误读为已入账收入。保留来源没有披露付款节点、取消权、部署验收标准、收入确认政策，
              也没有说明订单簿中多少对应硬件销售、集成、支持或未来服务。Wujie 的变现逻辑看起来不是单靠硬件，而是软硬一体：
              融资报道反复提到具身大脑、数据管线、技术基础设施和全球交付；产品和客户报道则暗示，未来变现可能包括部署、集成、支持、 OTA /
              安全合规功能，甚至软件层价值。但这些收入组成没有一个被公开量化。正确解读是：Wujie 有可信的收入意图和异常早期的客户验证， 但仍缺少把合同转成已确认财务表现所需的公开报告。
