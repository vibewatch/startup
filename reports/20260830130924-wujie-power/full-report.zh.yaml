      - number: '6.3'
        title: 具名客户验证与参照质量
        blocks:
          - type: paragraph
            body: >-
              Wujie 的具名客户验证质量，在不同账户之间差异很大。Envision 是最强的战略商业验证，因为多个来源描述了大型全球市场订单、 海外部署意图，以及与可再生能源、电池和全球运营绑定的客户画像。ZF
              LIFETEC 是最强的流程特定制造验证，因为合作被描述得很具体： 被动安全部件、柔性零件、精密装配、工业级可靠性目标，以及在中国工厂内的实际工作。HOLLYS 是最清晰的公共服务验证， 因为 WRC
              装置展示了品牌化运营环境，创始人也描述了此前试运营和后续延续计划；但它仍是试点，不能解读为全门店铺开。 从披露角度看，OMOWAY 是具名交易方中最弱的：它出现在深度合作伙伴名单中，也是一个合理的出行参照，
              但公开来源尚未给出确切流程、合同规模或部署指标。总体看，Wujie 的客户验证强过只有 logo 的营销，但仍处早期，且各账户不均衡。
