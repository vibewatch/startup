      - number: '3.2'
        title: 同业画像、价格与能力基准
        blocks:
          - type: paragraph
            body: >-
              保留证据中最清晰的价格基准来自 Unitree：其 G1 页面给出了少见具体的机械和传感细节，相关报道也指向远低于高端西方人形机器人的入门价格。 因此，Unitree
              更适合作为成本和开发者可及性的锚点，而不是企业生产验证的锚点。AgiBot、Astribot、Galaxea 和 UBTech 展现了中国市场里的另一种竞争图谱：每家公司都用不同的 AI
              叙事、硬件宽度和商业化信息抢占心智。 Astribot 强调操作和人与工具交互；Galaxea 强调轮式双臂操作，以及听起来更接近真实工业流程的打包 VLA 体验。 西方一侧，Figure 和 Tesla 设定了
              AI 野心的基准，Boston Dynamics 则设定了机器人品牌合法性和具身机械可信度的基准。 虽然 Agility
              不是用户要求的主要同业，但它有参考价值，因为在保留证据中，它是少数拥有具名商业设施和持续企业部署叙事的公司之一。 这些同业合在一起，定义了 Wujie 必须跨过的竞争门槛：价格、可靠性、部署证据和 AI 营销。
