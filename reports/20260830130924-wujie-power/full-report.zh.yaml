  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代方案
        blocks:
          - type: paragraph
            body: >-
              人形机器人不是一个单一、清晰同业集合的市场。Wujie 至少同时面对四层竞争：做通用或半通用人形机器人的直接具身 AI 同业； 工程积累更深、企业信任基础更强的传统机器人品牌；Tesla
              这类可以自筹资金跑学习闭环的汽车或平台巨头；以及人工、固定工业机械臂、 AMR、协作机器人和定制自动化单元等现状替代方案。这一点很关键，因为企业买家很少只在人形机器人之间做选择。
              他们会问：一台灵活移动机器人，是否真的比围绕更便宜的传统自动化重构流程更好？在这样的版图里，Wujie 真正争夺的是一小类任务：
              灵巧移动操作创造的价值，足以同时胜过人工和传统机器人。同业本身也在按地域和战略分化。中国公司越来越强调快速迭代、放量和价格可见性； 几家西方头部则聚焦高端 AI 定位、企业试点或内部制造部署。Wujie
              更靠近中国商业化浪潮，但试图借具名工业客户和海外交付信号， 与纯开发者硬件故事拉开距离。
