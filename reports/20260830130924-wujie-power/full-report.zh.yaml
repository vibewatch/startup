      - number: '6.5'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Wujie 的扩张逻辑看起来是：先拿下一个高价值工业锚点，深化工厂用例，在有边界商业场景证明安全，然后用这些参照做跨境扩张。 这在战略上连贯，但会带来集中度风险，因为公开具名订单簿仍然很小。Envision
              很可能在公开记录中主导战略价值， 因为它是唯一拥有已披露大额订单规模和明确海外足迹的账户。ZF 在技术上可能同样重要，但收入权重未披露。 HOLLYS
              和北京咖啡伙伴提高了参照多样性，却无法单独解决集中度问题，因为它们看起来是试点或受控运营，而不是规模化连锁。
              采购摩擦也很高：制造和能源企业买家在多站点铺开前，需要安全验证、部署支持和场景特定调优。监管和地缘政治又叠加一层。
              中国标准化推进可能帮助企业接受，但美国国会针对来自关注国家人形机器人的法案显示，海外公共部门或敏感设施需求可能变得更有争议。 结论是，Wujie
              有可信的早期扩张路径，但投资逻辑仍高度依赖于能否把少数战略参照转成可重复的多站点项目。
