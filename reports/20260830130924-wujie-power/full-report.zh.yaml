            body: >-
              对如此早期的人形机器人公司来说，Wujie 融到的资金异常大。多家 2026 年 4 月至 6 月来源一致称，公司累计天使轮融资超过 $200 million；6 月报道还称一笔约 $200 million 的
              Pre-A 接近完成。资本来源横跨国资关联、产业和一线财务投资人： Envision Group 与 Beijing AI Industry Investment Fund 共同领投 Angel++
              轮，后续投资方包括 Sequoia China、Linear Capital、Hillhouse Ventures、BV Baidu Ventures，以及多家中国机构。到 6 月下旬，Shanghai
              Securities News 又把 JD 相关基金、C Capital、Hony、Shengyu 和 Fengyuan 加入投资方名单。这种广度在战略上很重要，因为 Wujie 的故事不只是融资额，
              还包括场景入口、产业验证和海外市场进入杠杆。同样的投资人 / 客户重叠，也体现在 Envision 的部署协议，以及面向客户的 ZF LIFETEC、OMOWAY 和商业服务合作伙伴关系中。
