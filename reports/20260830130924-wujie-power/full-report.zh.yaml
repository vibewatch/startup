      - number: '4.4'
        title: 估值不透明与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              在 2026 年具身 AI 融资浪潮中，Wujie 被广泛描述为独角兽或独角兽级公司；这个方向性信息有用，但不等于披露了估值条款清单。 用户给定的标准事实集、36Kr
              的机器人独角兽报道，以及更广泛的行业报道，都支持市场把 Wujie 视为十亿美元以上公司的判断。 尚未解决的是：哪一轮对应什么精确估值，连续融资带来多少稀释，以及客户关联或政策关联投资人是否拿到了结构性特权。
              这个差别很重要，因为早期人形机器人估值可以看起来很亮眼，同时仍内嵌激进收入假设和保护性条款。 Figure 和 Unitree 的可比资本信号显示行业有多热，但不能解决 Wujie
              自身的不透明。尽调里最关键的缺失数据很直接： 当前账上现金、月度烧钱速度、已签回款排期、按部署类型划分的价格、按机器人世代划分的毛利，以及天使轮与后续资本的精确法律结构。 在这些信息明确之前，Wujie
              的财务故事应被理解为融资能力很强、商业前景有希望，但还不能按常规创投或成长股权标准审计。
