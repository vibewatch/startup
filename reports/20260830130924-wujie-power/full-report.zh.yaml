  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与资本形成
        blocks:
          - type: paragraph
            body: >-
              Wujie 2026 年的融资速度，是保留证据中最清晰的财务事实模式。多家来源共同指向一点：公司累计天使阶段融资超过 US$200 million； 融资推进太快，以至于部分报道用
              Angel++、Angel+++，或 Pre-A / 接近 Pre-A 的进展来描述，而不是一轮结构披露干净的融资。
              这种模糊本身就有意义：它说明融资动能快、投资人需求强，但也意味着公开记录还不够整洁，无法支撑精确的定价轮时间线。 对如此早期商业阶段的公司来说，投资方阵容异常强。报道参与方包括 Envision
              Group、Beijing AI Industry Investment Fund、 Sequoia China、Linear Capital、Hillhouse 相关资本、BV/Baidu
              Ventures，以及其他人民币和美元基金。 战略上，这个组合很重要，因为它把产业拉动和创投背书结合在一起。财务上，它意味着 Wujie 不必依赖单一资本来源或一个头条投资人来建立势能。
              因此，资本形成故事是正向信号；但证券条款、清算优先权、董事会权利和投后持股比例没有披露，限制了这个信号能多精确地转成股权结构质量判断。
