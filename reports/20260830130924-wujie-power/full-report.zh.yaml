  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              Wujie 所在品类的能力进展快过既定法律规则。中国在 2026 年快速发布了覆盖数据、部署、应用和安全的人形机器人与具身 AI 标准体系。
              这对国内有帮助，因为相比规则真空，它给买家和监管方更清晰的路径。但它不能消除风险。美国和欧洲框架仍在形成不同的具身系统认证思路； 美国 Humanoid ROBOT Act
              也显示，地缘政治担忧可以多快转成针对关注国家相关机器人的采购限制。与此同时，美国工作场所安全指引仍称没有机器人专用 OSHA
              标准，意味着部署方依赖更广泛的机器防护、上锁挂牌和共识标准，而不是专门为人形机器人定制的规则手册。 Hill Dickinson
              的法律分析点出了核心未解问题：如果具身系统造成伤害，责任可能落在制造商、运营方、集成商、软件栈或它们的组合身上。 Wujie
              进入咖啡服务场景和人机混合环境，把这个问题从理论推到了实践。公司安全优先的姿态方向正确， 但跨境合规、隐私和责任框架仍不完整。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
