    approximationNotes: 没有公开的 Wujie 队列数据。百分比是分析情景，反映深度集成的工业部署预期粘性高于品牌服务试点；它们不是公司披露指标。
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Wujie 主要风险向量的发生概率 / 严重程度定位。
    data:
      columns:
        - 严重程度：中
        - 严重程度：高
        - 严重程度：极高
      rows:
        - label: 发生概率：高
          values:
            - OSHA / 规则缺口摩擦
            - 零样本与支持负担风险；客户集中
            - 无公开可靠性披露；责任分配不清
        - label: 发生概率：中
          values:
            - 标准演进
            - 跨境认证错配；出口渠道流失
            - 重大现场安全事故
        - label: 发生概率：中低
          values:
            - 人才梯队深度不透明
            - 算力 / 供应瓶颈；融资重估
            - 创始人流失或锚定客户长期失败
    claimRefs:
      - CR001
      - CR004
      - CR010
      - CR011
      - CR019
      - CR028
      - CR036
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 展示法律、产品、支持和供应风险如何传导为收入与估值压力。
    data:
      nodes:
        - id: n1
          label: 监管分化
        - id: n2
          label: 责任不确定性
        - id: n3
          label: 可靠性缺口
        - id: n4
          label: 服务负担
        - id: n5
          label: 供应 / 算力约束
        - id: n6
          label: 客户集中
        - id: n7
          label: 销售周期拉长
        - id: n8
          label: 部署表现不达预期
        - id: n9
          label: 收入质量恶化
        - id: n10
          label: 估值压缩
      edges:
        - from: n1
          to: n7
        - from: n2
          to: n7
        - from: n3
          to: n8
        - from: n4
          to: n8
        - from: n5
          to: n8
        - from: n6
          to: n9
        - from: n7
          to: n9
        - from: n8
