    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 未公开收入、毛利率或回款披露
        - 无法验证收入倍数或营运资本质量
        - CFO / 主投方数据室
      - - 合同经济性
        - 未公开 Envision、ZF 或试点的期限、定价、取消条款
        - 无法给在手订单质量背书
        - 客户合同审查
      - - 可靠性与服务负担
        - 未公开 MTBF、MTTR、保修或备件数据
        - 服务经济性可能决定规模化是否有吸引力
        - 运营与现场服务审查
      - - 股权结构表与优先股堆叠
        - 未公开清算、反稀释或关联方细节
        - 回报结果取决于条款结构，不只看企业价值
        - 法务 / 融资尽调
      - - 烧钱速度与现金跑道
        - 未公开现金消耗或储备情况
        - 需判断下一轮是可选项还是硬需求
        - 财务尽调
      - - 退出路径现实性
        - IPO、战略出售或后续私募轮尚无证据支撑
        - 退出路径决定今天可接受的进入价格
        - 董事会 / 投资人策略审查
    notes: 这些问题解决前，估值应按区间看，并施加有意义的不确定性折价。
