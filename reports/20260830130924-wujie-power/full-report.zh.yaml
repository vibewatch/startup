          high: 1000
        - label: 基准
          low: 1500
          value: 2000
          high: 2500
        - label: 乐观
          low: 2500
          value: 3200
          high: 4000
    approximationNotes: 情景区间来自里程碑逻辑、当前品类估值带，以及对 Wujie 披露缺口的折价。
