      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              按公开市场标准，Wujie 还没有退出准备度；这不是批评，而是阶段事实。公开上市和成熟成长轮都要求公司在收入、利润率结构、客户集中度、支持负担、治理和风险控制上给出可防守披露。UBTech 的备案文件和
              Tesla 的 SEC 报告显示，机器人公司一旦公开估值，披露门槛会抬多高。Wujie 的最终尽调议程应聚焦如何把一个有意思的故事变成可大规模投资的公司。第一，确认 Envision 在手订单和 ZF
              式工业项目的真实经济性：合同期限、定价模型、验收里程碑和取消权。第二，量化可靠性和服务负担：MTBF、MTTR、开机率、备件消耗和质保准备金逻辑。第三，检查股权结构表、优先权以及任何投资人—客户关联交易条款。第四，核实烧钱速度、现金跑道，以及下一轮融资究竟按收入证据定价，还是只靠市场热度。第五，判断实际可行的退出路径——中国
              IPO、战略工业买家或后期私募轮——以及这条路径能否容纳一个仍不透明的硬件业务。在这些事项清掉之前，Wujie 应留在观察名单，而不是进入“高价买入然后祈祷”篮子。
