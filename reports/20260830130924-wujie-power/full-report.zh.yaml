  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              宽泛的“人形机器人市场”被讲得过热，不能直接拿来给 Wujie Power 定位。分析师估算从当前年收入个位数十亿美元，
              一直延伸到远大得多的长期劳动力替代叙事，核心原因是不同发布方混在一起算的东西并不一样：机器人出货收入、AI 软件价值、 工业自动化替代，甚至整个人类可复制作业的未来。尽调时，Wujie
              的可用市场应收得更紧。公司当前公开证据指向三个可触达切口： 复杂生产环境里的工业移动操作；需要灵巧和柔性零件处理的汽车及出行相邻制造任务；以及咖啡零售这类有人在环的有边界商业服务环境。 这些切口属于更大的具身
              AI 叙事，但并不等同于通用家庭消费机器人市场。因此，Wujie 的规模测算应从场景匹配向外推， 而不是从最乐观的全球人形机器人 TAM 往下切。第二个边界问题是替代品集合：Wujie
              盯上的很多任务仍由人工、推车、 定制夹具或固定机器人单元完成，所以它既在和其他人形机器人竞争，也在和流程重构及更便宜的自动化竞争。
              这个替代逻辑很关键，因为企业买家通常只有在机器人能干净地解决替代方案解决不了的流程时，才会扩大预算。
