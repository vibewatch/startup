      - number: '6.4'
        title: 留存、耐久性与满意度缺口
        blocks:
          - type: paragraph
            body: >-
              没有公开来源披露 Wujie 的净收入留存率、总收入留存率、流失率、合同期限、续约率、利用率或客户满意度分数。
              因此，耐久性只能从结构性线索推断，而不能直接测量。最正面的结构性线索包括：出口交付已经开始，而不是停在演示阶段； ZF
              愿意围绕真实制造问题推进战略合作；创始人称北京咖啡部署已试运行一段时间；公司还计划在进入韩国之前继续运营。
              这些信号说明，至少部分客户或参照伙伴认为机器人足够安全、有用，愿意继续测试或扩大。但硬留存指标缺失是实质问题，不是外观问题。 我们不知道 Envision
              订单是否已经确认收入，多少比例是有约束力的订单、多少只是框架量，咖啡合作方是否会超过展示阶段， 也不知道现场支持需要多高频才能维持表现。实践中，这意味着公开记录更清楚地证明了需求形成和场景验证，
              但还不能证明重复经济性或满意度耐久性。
