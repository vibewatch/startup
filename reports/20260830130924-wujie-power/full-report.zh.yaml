        - US$2.5B–US$4.0B
        - US$1B 出头入场价对应 2x–3.5x
      - - 基准
        - ~50%
        - 工业背书逐步增加，收入开始出现但披露仍参差，支持负担可控但并不轻
        - US$1.5B–US$2.5B
        - US$1B 出头入场价对应 1.2x–2.0x
      - - 悲观
        - ~25%
        - 积压订单转化不及预期，可靠性 / 服务成本开始反噬，融资或渠道情绪反转
        - US$0.6B–US$1.0B
        - 视入场价和交易结构而定，为 0.5x–1.0x
