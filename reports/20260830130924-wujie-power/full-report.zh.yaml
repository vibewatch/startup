      - number: '7.3'
        title: 伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Wujie 当前的优势同时也是依赖。Envision 既是战略支持者，也是公开信息中经济意义最大的客户参照。ZF LIFETEC 既是制造验证，也是工业验证的集中点。HOLLYS
              和北京咖啡试点有助于分散场景证据，但它们仍是试点，不是耐久的多站点合同。 这让 Wujie 容易受到少数交易方节奏滑坡的影响。公司还依赖更广泛的生态变量：具身模型训练基础设施、算力可得性、工业零部件、
              海外合规接受度，以及发货后支持客户所需的服务能力。中国标准推进可能改善国内接受度，但也可能拉大与西方认证哲学的距离， 迫使 Wujie
              应对多套保证体系。海外市场里，采购政治可能比终端需求更早落下。即使私营工业客户仍然开放，公共部门或敏感设施渠道也可能先关闭。 结果是，客户集中、投资人 / 客户重叠，以及供应加合规复杂性，都会直接传导到收入风险。
