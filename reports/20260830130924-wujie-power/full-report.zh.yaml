      - - 置信度
        - 中
        - 估值区间有支撑，但精确定价公开不可见
      - - 风险评级
        - 高
        - 执行、集中度、可靠性和融资风险仍然重大
      - - 当前估值立场
        - 只能以区间形式支撑
        - 独角兽地位有支撑；具体定价轮条款没有公开支撑
      - - 分析师当前区间
