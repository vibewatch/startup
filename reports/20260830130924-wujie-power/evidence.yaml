evidenceGaps:
  - type: missing-source
    severity: material
    topic: exact incorporation date
    missingEvidence: >-
      A registry filing or official company profile stating Wujie Power’s exact legal entity name and incorporation
      date.
    whyItMatters: >-
      Founding date precision matters for benchmarking capital efficiency, hiring ramp, and the speed from incorporation
      to orders.
    diligencePath: Pull the enterprise registry record or a company-issued profile with full legal-entity details.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: governance terms
    missingEvidence: Board composition, cap-table control, liquidation preferences, and investor rights.
    whyItMatters: >-
      Governance and preference structure materially affect downside protection, dilution, and decision control in a
      pre-revenue company.
    diligencePath: Request term sheets, shareholder agreements, and an updated board list from management or lead investors.
    relatedQuestionRefs:
