chapter:
  number: 2
  title: Market Analysis
  summary: The humanoid and embodied-AI market is growing quickly, but Wujie Power’s practical addressable market is much narrower than top-down TAM headlines suggest. The most defensible near-term demand zones are structured industrial environments, mobility-linked manufacturing tasks, and tightly bounded commercial-service pilots where flexible manipulation beats fixed automation and where labor, safety, or uptime pain is measurable. China’s 2026 standards push, shipment leadership, and capital surge create a strong supply-side tailwind, but reliability, ROI, integration, and commercialization discipline remain the gating factors that determine whether Wujie captures a meaningful share.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing lenses
  body: 'The broad “humanoid robot market” is too inflated to use directly for Wujie Power. Analyst estimates span from single-digit billions in current annual revenue to much larger long-run labor-substitution narratives, largely because different publishers mix very different things: shipped robot revenue, AI software value, industrial automation displacement, or even the entire future of human-replicable labor. For diligence purposes, Wujie’s usable market should be bounded much more tightly. The company’s current public proof points point to three reachable wedges: industrial mobile manipulation inside complex production environments, auto and mobility-adjacent manufacturing tasks requiring dexterity and flexible part handling, and bounded commercial-service environments such as coffee retail where people remain in the loop. Those wedges sit inside the larger embodied-AI story, but they are not the same as a general consumer-home robot market. Wujie therefore should be sized from scenario
    fit outward, not from the most optimistic global humanoid TAM downward. A second boundary issue is the substitute set: many tasks Wujie targets are still done by humans, carts, bespoke jigs, or fixed robotic cells, so the company competes as much against process redesign and cheaper automation as it does against other humanoids. That substitute logic matters because enterprise buyers usually expand budget only when a robot solves a workflow that alternatives cannot solve cleanly.'
