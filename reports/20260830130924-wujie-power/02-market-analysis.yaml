  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: vertical-level SAM
    missingEvidence: Pricing, labor savings, cycle times, and site counts needed to size renewable-energy, auto-safety, and retail service SAM precisely.
    whyItMatters: Without bottom-up operational data, any Wujie SAM remains a scenario estimate instead of a diligence-grade market model.
    diligencePath: Collect pilot task metrics, deployment counts, and pricing proposals from management and counterparties.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: procurement cycle and payback
    missingEvidence: Actual enterprise procurement timelines, approval steps, and ROI thresholds in Wujie’s target workflows.
    whyItMatters: Conversion timing determines both revenue recognition and how much capital Wujie must burn before repeat deployments materialize.
    diligencePath: Interview Envision, ZF, and commercial-service pilot operators on buying process and economic hurdles.
    relatedQuestionRefs:
    - QM025
  - type: private-evidence-only
    severity: material
    topic: pilot-to-rollout conversion
