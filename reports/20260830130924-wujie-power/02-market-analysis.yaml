- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for market
  - Diligence ask
  rows:
  - - MIIT standards framework
    - Positive
    - Immediate to medium term
    - Reduces fragmentation and helps procurement/compliance framing
    - Track how standards map to customer buying criteria
  - - China shipment and supply-chain lead
    - Positive
    - Immediate
    - Supports component availability and iteration speed
    - Determine whether scale converts into reliable service economics
  - - Labor shortages / dangerous-dull tasks
    - Positive
    - Medium term
    - Makes flexible mobile manipulation economically relevant
    - Quantify customer payback by workflow
  - - Europe / Korea certification and export window
    - Positive
    - Immediate
    - Expands market beyond domestic pilots if compliance is real
    - Verify country-specific approvals and service support
  - - Reliability and uptime uncertainty
    - Negative
    - Immediate
    - Can block conversion from pilot to production purchase
    - Request cycle-time, MTBF, and maintenance data
  - - Integration and change-management burden
    - Negative
    - Immediate to medium term
    - Slows procurement even when robots work technically
    - Review deployment time and integration staffing
  - - Capital bubble / IPO rush
    - Negative
    - Immediate
    - Can create oversupply of capital before revenue quality is proven
    - Stress-test valuation against real deployments
  - - Competition from cheaper or more mature peers
    - Negative
    - Immediate
    - Compresses margins and weakens differentiation if Wujie lacks proof
    - Benchmark Wujie against Unitree, AgiBot, Figure, Atlas
  notes: The same conditions driving category excitement also raise execution thresholds for every vendor in the market.
