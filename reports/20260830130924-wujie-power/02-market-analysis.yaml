tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Wujie
  rows:
  - - Industrial mobile manipulation
    - Robots, integration, safety setup, support, software tuning for factories and logistics-like sites
    - Traditional fixed-arm cells that solve the task without mobility or dexterity
    - Plant operations, manufacturing engineering, capex / automation budget owners
    - Core near-term market
  - - Automotive and passive-safety manufacturing
    - Flexible handling, precision loading, line-side material movement, test-fixture interaction
    - Commodity robotics for static repetitive tasks
    - Auto OEMs, Tier 1 suppliers, factory innovation leads
    - Core near-term market via ZF
  - - Renewable-energy / battery / AIDC industrial operations
    - Factory-floor deployment, inspection, kitting, materials handling, AI-data-center operations
    - Pure energy-generation equipment capex unrelated to robots
    - Industrial operations leaders, digital transformation teams
    - Core near-term market via Envision
  - - Commercial service in bounded stores
    - Store labor support, delivery, cleanup, light reconfiguration, software supervision
    - Full consumer-home assistant narratives and general household robotics
    - Retail operators, franchise owners, brand innovation budgets
    - Adjacent expansion market
  - - General home humanoids
    - Large consumer replacement thesis for household labor
    - Near-term B2B deployments
    - Consumers
    - Excluded from near-term Wujie SAM
  - - Humanoid AI software-only valuation layer
    - Foundation-model platform value not tied to deployed robot revenue
    - Recognized current robot-service revenue
    - Strategic investors rather than enterprise buyers
    - Relevant for capital narrative, not near-term demand
  notes: The table separates broad humanoid narratives from the deployable spend buckets that Wujie’s current product and partner set plausibly touch by the run date.
