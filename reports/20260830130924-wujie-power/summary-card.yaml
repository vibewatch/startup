  topStrengths:
    - Angel financing above US$200 million is unusually large for such an early embodied-AI company
    - The RMB 500M+ Envision order is rare disclosed B2B demand proof for Chinese humanoid robotics
    - K15 has advanced from launch messaging to export-compliant shipment into Europe
    - >-
      MWA and the full-stack body-plus-brain positioning suggest deeper software differentiation than hardware-only
      peers
    - Beijing location plus state-backed capital can accelerate pilots, ecosystem access, and policy alignment
  topRisks:
    - Revenue, gross margin, burn, and cap-table terms remain undisclosed
    - >-
      Envision appears to be both a strategic investor and the anchor disclosed customer, concentrating validation on
      one relationship
    - Public governance and broader leadership-bench disclosure are thin for a unicorn-class company
    - Humanoid reliability, service burden, and safety performance remain unproven at fleet scale
    - Supply-chain and export-control dependence could constrain embodied-AI deployments
  unresolvedGaps:
