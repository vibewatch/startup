evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, gross margin, burn, and profitability metrics are not publicly disclosed.
    whyItMatters: >-
      These metrics are necessary to assess whether the $15B valuation is supported by durable software economics or
      mainly by strategic-option value.
    diligencePath: Request audited financials, board materials, and cohort-level customer revenue data during management diligence.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: The full current board roster, committee structure, and succession planning details are not public.
    whyItMatters: Governance quality and leadership redundancy are central to underwriting key-person risk in a private company.
    diligencePath: Request the current board list, board observer rights, committee memberships, and executive succession materials.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Investor ownership percentages, board rights, information rights, and any secondary-sale history are not publicly
      disclosed.
    whyItMatters: Cap-table control, liquidation preferences, and secondary activity materially affect governance and exit outcomes.
    diligencePath: >-
      Request the cap table, financing documents, pro rata arrangements, and any secondary transaction history from
      counsel and finance.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: early-round precision
    missingEvidence: >-
      Exact Series A and Series B closing dates, share classes, and valuation mechanics are only partially visible in
      accessible public sources.
    whyItMatters: >-
      Early-round economics are less material than late-round terms but still useful for dilution and governance
      reconstruction.
    diligencePath: Request early financing documents or a management-certified capitalization history.
    relatedQuestionRefs:
      - QO026
  - type: private-evidence-only
    severity: material
    topic: Embark integration economics
    missingEvidence: >-
      Public sources do not fully disclose the liabilities assumed, retained employees, and integration costs tied to
      the Embark asset purchase.
    whyItMatters: >-
      Understanding the real economic impact of the transaction is necessary to judge whether it was primarily
      accretive, defensive, or opportunistic.
    diligencePath: Review the asset purchase agreement, integration budget, and post-close operating plan for the Embark assets.
    relatedQuestionRefs:
      - QO027
  - type: missing-source
    severity: material
    topic: exact-market-share
    missingEvidence: >-
      No accessible public source quantifies Applied Intuition's exact share of the AV simulation or autonomy-software
      tooling market.
    whyItMatters: >-
      Without market-share data, investors cannot tell whether Applied Intuition's strong narrative position reflects
      dominant revenue capture or simply premium branding in a fragmented category.
    diligencePath: >-
      Request management's internal share estimate by segment, third-party customer-count benchmarking, and win/loss
      analysis against direct tooling peers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: defense-contract-values
    missingEvidence: >-
      Public spending databases show autonomy-relevant government activity, but they do not cleanly isolate exact
      defense-contract dollars attributable to Applied Intuition's addressable tooling layer.
    whyItMatters: >-
      Defense is one of the key reasons the market may be larger and more resilient than commercial AV alone, so
      contract-value precision matters for sizing and forecasting.
    diligencePath: >-
      Request the current defense pipeline, booked contract values, option-year structure, and revenue concentration
      across Army, Air Force, and other programs.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Applied Intuition does not publicly disclose revenue, ARR, gross margin, or segment mix that would let investors
      map TAM/SAM lenses to current company scale.
    whyItMatters: >-
      A large market does not prove execution; valuation underwriting requires evidence of actual revenue capture,
      retention, and segment-level monetization.
    diligencePath: >-
      Request audited financials, segment revenue by automotive versus defense, and customer concentration data during
      management diligence.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: bottom-up-som
    missingEvidence: >-
      The public record lacks pipeline, win-rate, average contract value, and renewal data needed to convert the
      top-down market model into a bottom-up SOM.
    whyItMatters: >-
      The difference between an attractive SAM and a realistically obtainable market often depends on sales-cycle
      length, budget ownership, and renewal behavior rather than category size alone.
    diligencePath: >-
      Request pipeline stage data, win/loss cohorts, ACV by segment, and time-to-close metrics for OEM, trucking, and
      defense accounts.
    relatedQuestionRefs:
      - QM007
      - QM030
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
    severity: minor
    topic: competitor-comparison-table coverage
    missingEvidence: >-
      TP001 is intentionally a selected competitor set rather than a full census of every OEM internal build, regional
      simulation vendor, or testing niche.
    whyItMatters: >-
      The chapter is meant to compare the most decision-relevant competitors, but investors should know that the
      universe is broader than the ten profiled rows.
    diligencePath: >-
      Extend the map with OEM internal programs and smaller regional vendors if the investment thesis depends on
      exhaustive market-share analysis.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: exact-competitor-revenues
    missingEvidence: >-
      Public competitor pages do not disclose exact revenue, ARR, gross margin, or realized ACV for most direct peers,
      including dSPACE-class point tools and smaller simulation startups.
    whyItMatters: >-
      Without comparable financial scale, investors cannot tell whether Applied's differentiation is translating into
      superior commercial performance or merely broader narrative positioning.
    diligencePath: >-
      Request management win/loss files, pricing decks, estimated competitor pricing benchmarks, and any third-party
      procurement data showing competitor ACV and renewal behavior.
    relatedQuestionRefs:
      - QP009
      - QP028
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: dspace-market-share
    missingEvidence: >-
      No source retained for this chapter quantifies dSPACE's exact share of automotive simulation, HIL, or SIL budgets
      by OEM or region.
    whyItMatters: >-
      dSPACE looks like the strongest direct incumbent, so market-share precision would materially affect how investors
      rank Applied's real replacement opportunity.
    diligencePath: >-
      Request internal competitive-intelligence estimates, OEM account penetration by region, and third-party
      benchmarking on simulation-tool incumbency.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: oem-contract-exclusivity
    missingEvidence: >-
      Public materials do not establish whether Applied's OEM relationships are exclusive, mission-critical systems of
      record, or simply one tool among several in multi-homed programs.
    whyItMatters: >-
      A company can cite marquee OEM logos and still have weak renewal power if buyers continue to split workflows
      across incumbents, open source, and internal tools.
    diligencePath: >-
      Request top-account contract terms, seat or program expansion history, replacement evidence against incumbents,
      and explicit sole-source versus multi-vendor status.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited or management-confirmed revenue history by year and segment.
    whyItMatters: Without revenue, valuation support and growth durability cannot be modeled.
    diligencePath: Request audited P&L plus revenue bridge by automotive, trucking, defense, and services under NDA.
    relatedQuestionRefs:
