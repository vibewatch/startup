callouts:
  - calloutType: strength
    title: "Simulation demand survives even if robotaxi timelines disappoint"
    body: "Applied Intuition does not need immediate mass-market autonomy deployment to have a real market. AV simulation, ADAS validation, and software-defined vehicle workflows already represent multi-billion-dollar spend categories, and RAND-style safety logic still supports simulation as a necessary complement to physical testing."
    claimRefs: [CM001, CM016, CM039]

  - calloutType: risk
    title: "Regulation slows deployment even while it expands the tooling workload"
    body: "The same fragmented regulatory structure that makes simulation and reporting more necessary also stretches customer timelines. NHTSA's guidance-heavy regime, incomplete FMCSA trucking clarity, and cross-jurisdictional requirements all delay scaled commercialization and lengthen procurement cycles."
    claimRefs: [CM012, CM013, CM028]

  - calloutType: insight
    title: "Defense materially broadens the market beyond commercial AV cycles"
    body: "Defense gives Applied Intuition access to a budget pool that is not driven primarily by consumer acceptance of self-driving cars. Program-based government demand can offset some of the cyclicality created by commercial AV slowdowns, even if exact contract values remain opaque."
    claimRefs: [CM030, CM032, CM033, CM041]

  - calloutType: recommendation
    title: "Do not underwrite on market share or SOM without private data"
    body: "Public evidence is sufficient to show the market is important and growing, but not sufficient to pin down Applied Intuition's exact share, segment mix, or revenue capture. Investors should request pipeline, win-rate, pricing, and defense-contract detail before treating the $3B SOM lens as more than a rough analytical boundary."
    claimRefs: [CM029, CM036, CM044]

