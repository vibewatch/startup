  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >
              对 Applied Intuition 核心市场来说，最干净的外部代理不是泛化的“自动驾驶”类别，而是自动驾驶车辆仿真与验证软件。MarketsandMarkets、Grand View
              Research、Allied Market Research、Mordor Intelligence 和 Business Research Insights 的口径汇总后，仿真细分市场大致聚集在 2024
              年约 $2.5 billion 的规模，增长率从高个位数到高十几位数不等，2030-2035 年终点约 $7-8 billion。这个区间有方向性价值，因为 Applied Intuition
              的产品栈围绕仿真、测试、验证和车辆软件工作流，而不是运营 robotaxi 车队或制造传感器。更宽的相邻市场大得多：Mordor 将 2024 年 ADAS 市场放在约 $33 billion，2030
              年展望超过 $80 billion；MarketsandMarkets 预计自动驾驶软件到 2035 年约 $7 billion。


              承销时，正确的规模测算应分层看。宽口径 TAM 可以合理合并 AV 仿真、自动驾驶软件、ADAS 相邻工具和防务自动驾驶预算，形成 $40-45 billion
              的视角，但这会夸大近期可被外部工具消化的需求。更现实的 SAM 应围绕 OEM 项目、商用卡车和防务工具，接近 $10-12 billion。汽车 OEM 工具大概率占可服务池的大头，因为即便 Level 4
              全面部署继续推迟，车企也必须验证软件定义车辆和越来越高级的驾驶辅助。第三方自动驾驶工具供应商的 SOM 约 $3 billion
              是一个低置信度但说得通的规划启发式，直到管理层提供管线、胜率和合同金额数据之前，都不应把它视为硬结论。
