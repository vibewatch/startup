  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 仿真与测试工具竞争者
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 最直接的竞争对手，仍是向汽车工程团队销售仿真、测试和验证工具的既有厂商与初创公司。dSPACE 是最重要的既有厂商，因为它通过 ASM、VEOS 等产品，已经贴近 HIL /
              SIL 预算和长期 OEM 工作流。ANSYS 带来另一类威胁：它不像 dSPACE 那样汽车原生，但 AVxcelerate 叠加广泛工程软件信用和企业采购触达。IPG Automotive 的
              CarMaker 在车辆动力学、ADAS 和场景验证流程中尤其重要，这意味着买家可以继续拼装模块化工具链，而不必把 Applied 作为主平台供应商。Cognata 更多在合成场景和云仿真上竞争，Metamoto
              和 VectorCAST 则代表仿真与嵌入式测试层中更窄但仍相关的替代方案。


              实际含义是，Applied 不是在防守一个单一巨型对手。它面对的是一组点状工具：即使没有任何一家能覆盖 Applied
              全栈的宽度，也可能在某个工作流里“够用”。这对采购很重要，因为汽车买家常常同时使用多套工具，而不是立即标准化到一家供应商。Applied
              的优势因此在客户想要打通仿真、验证、数据和车辆软件开发时最强；如果客户只要某个狭窄技术任务的最佳单点工具，优势会弱一些。
