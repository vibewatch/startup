  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合概览
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 现在把产品呈现为面向所有移动机器的统一平台，而不是狭窄的自动驾驶工具供应商。公开表述反复把 Self-Driving System（SDS）、Vehicle OS 和
              Tools for Vehicle Intelligence 放在更宽的 Physical AI
              伞下，并将同一套堆栈专门化到汽车、卡车、采矿、农业、建筑和防务。这很重要，因为买家不是被要求授权单个仿真器；他们被要求采用一套集成软件底座，它可以从 ADAS
              走向自动驾驶，从道路走向非道路，从商用走向防务。第二个值得注意的变化是品牌纪律。当前产品页面不再突出 Simian、Spectral 等旧名称，但底层仿真 / 评估和数据 / 质量控制功能，在 Tools for
              Vehicle Intelligence 叙事中仍清晰可见。从尽调角度看，产品组合宽、模块化且多领域，但各个表面的成熟度并不一致，部分最新层级读起来仍更像快速推进的平台叙事，而不是已被独立基准验证的产品证明。
