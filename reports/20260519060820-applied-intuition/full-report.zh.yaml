      - number: '6.3'
        title: 商用卡车与特种车辆客户
        blocks:
          - type: paragraph
            body: >
              商用卡车提供了 Applied Intuition 在乘用车 OEM 之外最清晰的一部分客户证据。PACCAR 在 2020 年公开选择 Applied Intuition
              用于自动驾驶卡车开发，给了公司来自大型商用车制造商客户侧的验证。Volvo Group 后来发布自己的合作公告，又增加了一个不依赖 Applied 自写营销的重卡参考客户。这两个账户重要，因为它们说明
              Applied 的客户证据已经从软件验证实验室延伸到货运和工业车队运营商；在这些场景里，自动驾驶经济性绑定的是生产率、劳动力约束和正常运行时间，而不只是 ADAS 功能开发。


              当前垂直页面进一步拓宽了这幅图。Applied 现在营销面向卡车、采矿、农业和建筑自主系统的专门方案，卡车和采矿页面也包含 Isuzu 与 Komatsu
              的具名引述。这释放出一个信号：公司确实在向特种车队和工业自主系统扩展市场触达。与此同时，公开证据仍不均衡。这些页面证明 Applied
              能在新车辆类别中赢得参考账户，但仍没有披露合同金额、车队数量、部署规模，或关系到底是试点、平台标准还是长期经常性软件项目。Nuro 作为历史案例研究出现，但现有客户文章 URL
              已无法访问，削弱了证据的新鲜度和深度。
