      - number: '6.4'
        title: 客户集中度与收入依赖分析
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 的公开客户名单显示客户标识分散度很高，但收入仍可能集中。实践中，价值最高的关系很可能只是全球 OEM
              平台、重卡项目和国防账户中的一小部分。这在企业基础设施业务里很常见：一个客户标识可能只代表一张很窄的评估许可证，另一个则可能代表横跨多个项目、年度价值大得多的部署。公开材料没有披露这种分布。因此，投资人不应假设
              17/20 的 OEM 覆盖会自动转化为收入均匀分布或低集中度风险。


              最可能的集中格局是杠铃。一端是少数大型汽车和卡车 OEM，它们很可能代表最大的商业软件机会；另一端是美国政府业务，战略意义和技术验证价值可能很高，但也会带来项目节奏和预算暴露。公开证据没有披露
              NRR、流失、GRR、平均合同期限、采购摩擦或最大客户占比。因此，正确的尽调结论不是集中度必然很高，而是仅凭公开数据无法排除集中度风险。客户标识覆盖面和跨行业拓展是正面因素；缺失的分母是收入权重。
