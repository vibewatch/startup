      - number: '4.3'
        title: 财务表现与披露指标
        blocks:
          - type: paragraph
            body: >
              对一家估值 $15 billion 的公司而言，Applied Intuition 披露的常规经营数据很少。公开材料中最强的正面事实，是管理层在 Series E
              文章中称公司已经盈利，并以可持续的三位数百分比同比增速增长。如果准确，这一组合对于资本密集型自动驾驶相邻软件公司而言并不常见，也有助于解释为什么投资者愿意在下一轮以高得多的价格为业务融资。公开规模代理指标也存在：公司称拥有
              1,000+ 名工程师，并服务全球前 20 大汽车 OEM 中的 17 家。


              但这些信号没有解决核心承销问题。收入、ARR、毛利率、现金余额、客户集中度、NRR 和烧钱率，在已审阅公开来源中均缺席。PitchBook 和 CB Insights
              有助于框定估值和融资历史，却无法补上经审计收入质量或利润率路径的空白。因此，Applied Intuition
              从叙事和投资者质量看像一家强大的私营软件基础设施公司，但在支撑详细财务模型所需的确切指标上，仍异常不透明。
