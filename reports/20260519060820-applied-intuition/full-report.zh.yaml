      - number: '3.5'
        title: 竞争风险与被替代场景
        blocks:
          - type: paragraph
            body: >
              主要替代风险不是某个对手一次性复制 Applied Intuition 的所有产品，而是客户判断自己不需要完整套件。dSPACE 或 ANSYS 可以在验证密集型项目中继续盘踞；CARLA
              可以给早期团队的价格封顶；Scale AI 可以拿下数据与评估层；Mobileye、Wayve、Aurora 或 Waabi 可以说服 OEM：更宽的平台关系比采用模块化工具更具战略价值。公开证据也没有显示
              Applied 拥有排他性 OEM 合同或持久单一来源地位，因此多供应商并用风险看起来真实存在。在大型车辆项目中，买家通常会同时保留不止一条仿真、数据或验证路径。


              另一个承销问题是不透明。竞争对手的准确收入、已实现 ACV 和 OEM 账户份额大多不公开，因此威胁排序本来就是近似的。这意味着关键尽调问题不是 Applied
              是否抽象地具有差异化——它显然有——而是这种差异化能否撑过续约周期、在账户内拓宽，并防止采购重新碎片化，流向既有厂商、开源或端到端平台替代方案。因此，投资者应索取胜 / 负数据、替换 dSPACE
              级既有厂商的证据，以及合同细节，以判断 Applied 正在成为系统记录层，还是只是更大堆栈中的一个工具。
