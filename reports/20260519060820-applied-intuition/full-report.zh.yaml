companyProfile:
  summary: >
    Applied Intuition, Inc.（2017 年成立于加州 Sunnyvale）是一家私营技术公司，搭建自动驾驶和智能车辆所需的软件基础设施。其产品包括仿真工具（Simian）、数据管理平台（Spectral）、全栈
    Self-Driving System（SDS）和 Vehicle OS，客户覆盖汽车 OEM、商用卡车公司和美国国防部。公司称已服务全球前 20 大汽车 OEM 中的 17 家，并确认美国陆军和空军为防务客户。Series F
    轮由 BlackRock 和 Kleiner Perkins 共同领投，估值 $15 billion；此后 Applied Intuition 还宣布与 OpenAI 达成战略合作，把自己定位为 Physical AI
    基础设施公司。
