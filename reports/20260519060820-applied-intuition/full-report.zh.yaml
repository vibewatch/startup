            body: >
              公司领导层仍带有很强的创始人印记。Qasar Younis 是 CEO，也是业务的公众面孔，履历横跨 Google 和 Y Combinator；Balasubramanian Narayanan
              则作为联合创始人和创始 CTO，奠定了公司早期技术架构。公开材料显示 Peter Ludwig 现任 CTO，说明公司扩张后，工程组织已经从原始创始结构向外拓宽。Applied Intuition 还在 2020
