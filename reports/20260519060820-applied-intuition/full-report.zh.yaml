      - number: '2.2'
        title: 监管环境
        blocks:
          - type: paragraph
            body: >
              监管环境之所以影响 Applied Intuition，不是因为它设置了单一联邦“放行 / 不放行”闸门，而是因为它在多个司法辖区持续制造验证负担。NHTSA
              当前框架仍没有独立的联邦自动驾驶车辆上市前认证制度；市场通过既有安全标准、缺陷权力、常设命令和各州许可结构运转。这种碎片化具有商业意义。它会拖慢商业化，因为客户必须处理不一致的法律和运营要求；但它也强化了仿真和基于场景验证的必要性，因为
              OEM 和开发者在部署前需要证明车辆覆盖大量运行条件。


              在商用卡车上，面向 FMCSA 的规则清晰度仍不完整，即便高速公路自动驾驶仍是行业中最清楚的运行设计域之一，全国范围去驾驶员部署的时间也仍不确定。对全球 OEM 项目而言，EU 和 UNECE
              路径又增加了一层型式认证工作和时间复杂度。防务则完全走另一条路：采购不是围绕一套民用 AV 规则书，而是由项目特定的安全、互操作和测试要求塑造。结果是，监管不只是逆风。它既是延迟因素，也是 Applied
              Intuition 所在品类的需求驱动器；每新增一层报告要求、安全命令或辖区差异，测试覆盖、场景管理和验证证据的工作量都会增加。
