      - number: '2.3'
        title: 市场动态与竞争格局
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 竞争的是一个碎片化工具市场，而不是边界清晰的软件类别。客户通常不会购买“一个 AV
              平台”；他们会拼装仿真、数据管理、地图、感知开发、验证和安全论证工具的组合。这种碎片化给覆盖广泛工作流的基础设施供应商创造机会，但也意味着采购可以保持模块化，并对价格敏感。开源工具和内部工程栈会在堆栈低端施压，成熟买家也可能同时使用多家供应商。因此，Applied
              Intuition 的战略优势不在于垄断式市场份额，而在于跨汽车、卡车和防务解决最难的集成与验证工作流。


              多个顺风因素支撑品类增长。OEM 数字化转型和软件定义车辆项目，会在实体原型完成前把更多验证工作前移到软件中。ADAS 强制要求和安全预期会扩大相邻支出，即便纯 robotaxi
              时间线继续滑坡。传感器成本下降和数据量增长，会改善自动驾驶开发经济性；数据飞轮也让高保真仿真随时间变得更有价值。同时，市场逆风是真实存在的：漫长商业化周期拖慢收入确认，安全事故已经压低投资者热情，不同市场报告按范围和地域给出的结果差异很大。因此，这个市场有吸引力，但并不自动容易。品类需求具备结构性，但从技术相关性走到快速收入增长，仍卡在采购周期、监管清晰度和客户项目存活率上。
