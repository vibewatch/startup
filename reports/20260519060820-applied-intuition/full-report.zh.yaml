      - number: '6.2'
        title: 国防与政府客户关系
        blocks:
          - type: paragraph
            body: >
              国防是 Applied Intuition 客户基础中最能被独立佐证的一部分。公司的国防页面和面向 Army 的文章描述了它在军事自主系统和任务系统中的实际工作，但更关键的是，客户侧和政府侧页面也提到了
              Applied Intuition。Army.mil 发表过 Army 与 Applied Intuition 合作的文章，Defense.gov 后来又重点引用 Secretary of the Army
              Daniel Driscoll 的表述，称 Applied 很快就把军用车辆做到了全自主，用于士兵测试。这个组合比普通创业公司的客户标识墙强得多，因为关系证据来自公司自有营销体系之外。


              政府业务也改变了客户质量的形态。国防客户可以在很高层级验证产品能力和采购可信度，但公开证据仍让收入质量不透明。已审阅公开来源均未披露 Army 或 Air Force
              业务的合同金额、上限金额、期权年限、项目范围或续约机制。因此，国防关系提高了 Applied
              能销售任务关键系统的信心，但并未消除客户集中或采购周期风险。它按终端市场分散了客户基础，同时又带来了对政府预算和项目节奏的另一层依赖。
