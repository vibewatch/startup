      - number: '6.5'
        title: 证据质量与尽调缺口
        blocks:
          - type: paragraph
            body: >
              本章最好的客户证据，来自 Applied Intuition 并非唯一叙事者的来源。PACCAR 投资者关系、Volvo Group、Army.mil 和 Defense.gov 都从外部确认 Applied
              确有真实客户或项目关系。这些来源显著提高了卡车和国防账户的可信度。相比之下，乘用车 OEM 叙事仍主要由 Applied
              自写页面和合作公告驱动。这仍是有用证据，但证据质量低于客户发布的案例研究、采购文件或独立报道的生产部署。前 20 大 OEM 中 17 家这一数字方向上很亮眼，但它仍是锚定较早公开材料的汇总说法，而不是 2026
              年新鲜的具名账户披露。


              因此，主要尽调缺口集中在合同深度，而不是 Applied 是否真的有客户。投资人仍需要当前的具名账户清单、按 ARR 或 ACV 划分的最大客户集中度、续约时间表、各主要 OEM 的生产与试点状态，以及 Army
              和 Air Force 业务的详细合同条款。他们还需要一份仍可访问且新鲜的 Nuro
              客户证据，或确认该关系已从公开营销中撤下。简言之，公开证据足以支持“客户真实存在”的结论，但还不足以完整支撑收入耐久性或集中度风险。
