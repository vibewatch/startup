          - type: paragraph
            body: >
              投资者名单现在比原始融资金额更具战略意义。Lux Capital 看起来是跨多个轮次最持久的支持者之一，Andreessen Horowitz 和 General Catalyst
              则支撑了早期机构融资叙事。2024 年轮次加入 Porsche Investments，重要性在于它更容易被解读为战略汽车信任票，而不是纯财务支票。2025 年轮次意义更大：BlackRock、Kleiner
              Perkins、Fidelity 和 Lux 一起出现，说明 Applied Intuition 不再只是按专业自动驾驶工具初创公司的方式融资。它正被作为更宽的基础设施资产融资，对跨界投资者和机构资金都有吸引力。


              与最新融资同期宣布的 OpenAI 合作，进一步强化了这种解读。它暗示投资者正在承销一个可能从仿真延伸到更宽 Physical AI
              软件层的平台，覆盖汽车、卡车、防务系统和其他机器。这并没有消除尽调问题；它增加了问题。投资者仍需要所有权比例、董事会或观察员权利、按比例跟投条款、二级出售历史，以及最新资本提供方的预期退出期限。
