      - number: '4.4'
        title: Embark 收购与并购策略
        blocks:
          - type: paragraph
            body: >
              Embark 收购在财务上重要，原因有两点。第一，它是一笔困境资产购买，而不是传统高溢价增长型收购。Applied Intuition 宣布交易价值约 $71 million，以股票支付，并随后在 2023 年
              8 月 2 日宣布完成。公开材料把这笔交易描述为在行业失败之后获取有用的卡车软件、数据和人员，而不是为了大规模购买收入。这很重要，因为它意味着在许多自动驾驶公司难以为商业化融资的时点，Applied
              可以不用投入大量现金就扩展产品范围。


              第二，Embark 也是本章最清晰的负面信号。Embark 的代理与投资者材料显示，即便是一家公开上市、由风险资本支持的 AV 卡车公司，也无法撑过商业化缺口。对 Applied Intuition
              而言，正面解读是它低价买到了战略资产。负面解读是，周边市场仍很残酷，Applied 自身估值也必须放在一个已经出现知名资本毁灭案例的行业中审视。
            claimRefs:
              - CI022
              - CI023
              - CI024
              - CI025
              - CI026
