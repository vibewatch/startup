    sections:
      - number: '1.1'
        title: 身份与使命
        blocks:
          - type: paragraph
            body: >
              Applied Intuition, Inc. 由 Qasar Younis 和 Balasubramanian Narayanan 于 2017 年在加州 Sunnyvale
              创立，目标是搭建开发自动驾驶和越来越软件定义化车辆所需的软件基础设施。公司现在把使命说得更宽：“推动世界运转的 Physical
              AI”。这表明它不想只被理解为仿真供应商，而是要成为汽车、卡车、防务系统乃至未来其他机器人平台的核心操作层。其产品栈围绕 Self-Driving System（SDS）、Vehicle OS
              和车辆智能工具展开，反复强调仿真、测试、数据工作流和安全验证。这个定位重要，因为 Applied Intuition
              站在价值链中杠杆很高的位置：它不是押注某一个车辆项目，而是销售可在多个项目、客户和车型之间复用的基础设施。
