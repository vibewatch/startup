        - 上市公司崩盘 / 资产出售
        - 第三方报道融资数亿美元，另有 SPAC 资金
        - 2023-08
        - 资金消耗、卡车商业化延迟和市场融资窗口疲弱
        - Applied 可以低价买资产，但拖垮 Embark 的行业经济账仍然重要
