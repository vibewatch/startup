      - number: '8.5'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition
              比大多数自动驾驶创业公司更值得给信用。公司看起来已经盈利，拿到了顶级投资人的钱，定位已从仿真拓宽出去，也有足够的国防相关性，可以获得许多出行同行从未拿到过的基础设施溢价。这是乐观逻辑，也解释了为什么投资人愿意把
              Applied 当作 physical-AI 平台，而不是狭义车辆开发工具。若管理层最终披露的收入水平能匹配最新价格，这一轮可能显得有先见之明，而不是虚高。


              但仅基于公开证据，建议仍是观察，中等信心、高风险、估值偏高。问题不是 Applied 看起来弱；问题在于，支撑 150
              亿美元所需的基本面仍是私有信息，而可比公司集合仍指向估值纪律。反向逻辑是：市场在充分验证收入基数之前，已经为叙事、不透明度和 AI 稀缺性付了高价。最重要的尽调请求很简单：披露
              ARR、毛利率、收入结构、留存和国防合同规模，然后再重新判断 150 亿美元标记是公平，还是只是雄心勃勃。
