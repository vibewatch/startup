      - number: '7.5'
        title: 风险缓释评估
        blocks:
          - type: paragraph
            body: >-
              Applied 确实有实质缓释因素。它不是以单一项目车队运营商的方式进入市场；它有广泛的 OEM 相关性、军民两用的国防角度，以及一套工作流级产品叙事，这比单点仿真器更难替代。Embark
              收购给了它卡车资产，又不必承接 Embark
              的公开市场烧钱压力；国防业务也增加了第二条需求向量，且不与乘用车周期完全相关。公司的公开定位还显示，它理解合规导向流程的重要性：它公开谈国防用例，为受控环境构建产品，并销售给本身就必须关心安全案例、验证证据和采购纪律的客户。这些都是有意义的优势。


              但剩余风险仍只被部分缓释，因为最难的问题恰恰披露最少。仅凭公开来源，投资人看不到客户集中度、合同结构、诉讼准备金假设、出口分类流程、DoD 合同工具细节，或 Applied
              合规基础设施的真实深度。这意味着公司内部可能把这些风险管得很好，但外部承销人仍无法核验。实际含义是，Applied 应被视为强劲但尚未去风险化的基础设施公司。最可信的投资逻辑破裂信号包括：公开 AV 责任诉讼点名
              Applied、重大监管收紧放慢客户部署却没有创造强制需求、失去大型国防或 OEM 关系，或出现证据表明 150
              亿美元叙事跑在未披露经营基本面之前。在收入质量和合规深度披露更充分之前，风险缓释应评为混合，而不是完整。
