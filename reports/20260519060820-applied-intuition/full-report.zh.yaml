      - number: '4.5'
        title: 财务风险画像与资本效率
        blocks:
          - type: paragraph
            body: >
              主要财务风险不是明显资不抵债，而是估值与披露不匹配。Applied Intuition 的公开估值从 2020 年 $3.6 billion 升至 2024 年 $6 billion，再到 2025 年 $15
              billion，但公开 KPI
              披露并未同步扩张。最新融资在估值和投资者名称上更容易核实，在确切现金金额或当前经营结果上则难得多。这不代表公司弱；它代表外部投资者被要求主要根据投资者质量、伙伴证明、盈利表述和规模代理指标来承销一个溢价，而不是根据完整经营数据包。


              因此，资本效率比较只能近似处理。按披露风格看，Applied 比 Aurora 这类公司更像软件公司；但由于累计融资估计约 $1.5 billion
              或以上，它又比许多纯工具供应商资本化程度更高。正确结论不是公司必然被高估，而是即便公开叙事很强，承销仍需要对 Series F
              确切现金到账、客户集中度、NRR、董事会权利、稀释、现金余额和下一轮触发因素开展私人尽调。
