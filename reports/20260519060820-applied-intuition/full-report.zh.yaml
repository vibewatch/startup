  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与市场背景
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 已从后期汽车工具创业公司，转向范围更宽的 physical-AI 叙事；估值轨迹也反映了这次重新定位。公开轮次数据在历史后段很清楚：2020 年 Series D 据报道融资
              1.75 亿美元、估值 36 亿美元；2024 年 10 月轮次据报道融资 2.5 亿美元、估值 60 亿美元；最新 Series F 被广泛报道为融资 2.5 亿美元、估值 150 亿美元。这意味着，从
              Series D 到最新轮的公开估值上调约 4.2 倍，其中从 60 亿美元到 150 亿美元的跃升尤其陡峭，在约一年内提升了 2.5 倍。


              更难判断的是，市场背景能否支撑这种加速。管理层把最新轮与盈利、三位数增长、BlackRock 支持和 OpenAI
              合作绑定在一起，这些都把故事从狭义仿真软件倍数推向战略基础设施框架。不过，分析师市场报告仍显示，纯 AV 仿真如今只是低个位数十亿美元市场。因此，估值要求投资人相信 Applied
              正在汽车和国防领域变现更宽的自动驾驶技术栈，而不只是赢下仿真细分市场份额。
