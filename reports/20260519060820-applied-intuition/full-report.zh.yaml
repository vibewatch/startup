      - number: '5.2'
        title: 仿真与数据管理平台
        blocks:
          - type: paragraph
            body: >
              最清晰的技术重心，仍是仿真、验证和数据运营的组合。Applied 的 Physical AI 和自动驾驶页面描述了 PB
              级摄取、整理、标注、评估，以及真实世界传感器数据的闭环复用；研究页面则把这个故事延伸到神经仿真、合成数据和大规模 ML
              基础设施。落到实践中，这像是一种企业级尝试：把开放研究栈常常分开的数据采集、整理、模型训练、仿真、评估和生产反馈连接起来。与 CARLA 的比较在这里最有用。CARLA 是一个真正的开源仿真器，具备 Python
              API、场景工具、ROS 桥接和 OpenDrive 支持，但本质上仍是一个仿真器，客户必须把它装配进更宽工作流。Applied
              的公开卖点是：工作流本身就是护城河。限制在于，公开页面仍缺少投资者最想看到的具体吞吐指标：每小时场景数、标注吞吐量、合成到真实迁移统计，或相对既有验证套件的硬基准差异。
