      - number: '5.3'
        title: Physical AI 与智能体开发
        blocks:
          - type: paragraph
            body: >
              故事中最新的一层，是从车辆智能工具转向更宽的 Physical AI 平台。当前公开页面明确表示，这套堆栈要在云端、本地和气隙环境中编排自动驾驶工作流，也声称可通过标记化 UI 设计和支持 MCP
              的接口实现智能体驱动操作。这不只是泛泛的品牌语言。研究页面讨论世界-动作模型、强化学习后训练、4D 重建和闭环仿真；Series F 文章则把这些能力连接到开发者工具、AI
              智能体，以及面向汽车、防务和非道路领域的具身 AI 部署。由此形成一个说得通的产品论点：仿真和数据基础设施成为智能体式开发循环运行的操作环境。但这一层仍早。公开材料尚未给出具名 SDK 包、已发布 REST
              参考文档，或智能体层的具体基准证据。本轮调研中，AWS Marketplace 路径甚至只观察到一个损坏的公开页面，这进一步说明开发者生态方向上可信，但透明文档还不足以支持外部无摩擦评估。
