  - id: A
    title: Applied Intuition 融资轮次摘要
    blocks:
      - type: paragraph
        body: >
          Applied Intuition 已知完成六轮融资：Series A（约 $2M，2017，a16z）、Series B（约 $40M，2018， General Catalyst）、Series
          C（$125M，2019）、Series D（$175M，估值 $3.6B，2020）、Series E（$250M，估值 $6B，约 2024）， 以及 Series F（估值 $15B，约
          2025）。累计融资估计超过 $1.5B；Series A、B 和 F 的确切融资额未公开披露。
        claimRefs:
          - CO017
          - CO018
      - type: paragraph
        body: >
          Series F 由 BlackRock 和 Kleiner Perkins 共同领投，Fidelity 与 Lux Capital 参投。同时，OpenAI 宣布与 Applied Intuition
          建立战略合作，释放出 Physical AI 与 LLM 基础设施两条投资逻辑正在汇合的信号。
        claimRefs:
          - CO017
