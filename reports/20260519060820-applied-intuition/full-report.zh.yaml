  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户概览与 OEM 渗透
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 的公开客户叙事，强在覆盖面，弱在具名账户深度。公司仍持续对投资人和客户强调，它服务全球前 20 大汽车 OEM 中的 17 家；公开页面也点名
              Toyota、Volkswagen Group、General Motors 和 Hyundai
              等汽车客户。这很重要，因为它意味着公司已经触达了全球乘用车买方群体中，对仿真、验证和自动驾驶工具最关键的大多数。它也说明 Applied
              已足够嵌入汽车软件工作流，不只是在某个区域工程市场赢得关注，而是在北美、欧洲和亚洲都拿到心智份额。


              尽调难点在于，覆盖面不等于深度。公开来源没有说明 17/20 说法中剩下的 OEM
              是谁，也没有标明这些关系究竟是试点项目还是生产级工具链，更没有披露哪些账户贡献了有意义的经常性软件收入。因此，客户叙事显然真实，但只露出一部分。公开客户标识证据支撑了强市场渗透；但要有把握判断客户质量，还需要看到
              ACV、续约韧性和生产绑定程度。
