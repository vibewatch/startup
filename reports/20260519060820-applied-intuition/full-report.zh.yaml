  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管环境与合规风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 切入的交通和国防软件，是监管最未定型的类别之一。美国联邦 AV 政策仍更依赖指南、缺陷管辖权、事故报告和 FMVSS
              渐进更新，而不是一套针对无人驾驶系统的单一上市前认证制度。这给 Applied 带来混合结果：没有联邦安全强制要求 OEM 采用它的技术栈，但也没有稳定的全国审批路径来缩短客户采购周期。CRS、NHTSA
              政策页面、进行中的规则制定案卷和待审众议院立法都指向同一个状态：框架仍未完成，而非已经定稿。对投资人而言，Applied 的商业节奏部分受制于它无法控制的监管演进。


              州层面和卡车层面的碎片化风险更尖锐。NCSL 立法数据库显示，自动驾驶车辆法律现在已覆盖许可、测试、保险、隐私以及在公共道路运营等议题，涉及大量州；FMCSA 的 2023 年补充 ANPRM 也确认，搭载
              ADS 的卡车所适用的商业机动车规则仍在推进中。因此，每当卡车客户或 OEM 必须在联邦卡车框架落定前逐州处理运营假设时，Applied
              都会面临二阶暴露。美国之外，情况不是更简单，而是更复杂。公开政策来源和法律评论仍描述美国体系与欧洲 UNECE 式型式批准逻辑之间的方法分歧；NIST 的 AI RMF 虽然仍属自愿，但随着 NIST 增加
              2026 年关键基础设施剖面，它正明显成为采购参考点。再加上国防暴露，合规栈进一步扩张：EAR 出口管制、国防业务可能邻近 ITAR、FAR/DFARS
              采购条款、外国收购限制和涉密项目处理，都会提高执行成本，却不保证带来收入拉动。
