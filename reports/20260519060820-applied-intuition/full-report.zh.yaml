      - number: '8.4'
        title: 估值情景与敏感性分析
        blocks:
          - type: paragraph
            body: >-
              对一家质量看起来真实、财务披露却稀疏的公司，情景分析是最好的处理方式。乐观情景下，Applied 已经走在 ARR 达到 5 亿美元或更高的路径上，反复赢得 OEM
              标准化决策，把国防可信度转化为实质合同规模，并证明车辆智能或自动驾驶栈模块正在旧式仿真工具之外变现。在这种结果下，更大收入基数上的低到中十几倍倍数，可以支撑甚至超过当前 150
              亿美元标记。基准情景下，公司仍很优秀，但规模低于市场期待，ARR 或许在 2.5 亿到 4 亿美元，倍数仍有溢价但不狂热。这个结果支撑一家有意义的公司，但其最新轮看起来仍有些偏高。


              悲观情景更直接。如果 Applied 经常性收入仍低于大约 2 亿美元，如果 OEM 预算放缓，或仿真与自动驾驶工具更加商品化，倍数压缩可能非常严重。Embark
              不是直接可比对象，但它提醒市场：商业化不达预期时，这个行业可以出现剧烈减记。按概率加权看，公开数据支持的区间更接近低双位数十亿美元，而不是一个明显打折的入场点。
