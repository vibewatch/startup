            title: 监管一边拖慢部署，一边扩大工具工作量
            body: 同一个碎片化监管结构，让仿真和报告更必要，也拉长客户时间线。NHTSA 以指导为主的制度、FMCSA 卡车规则不完整，以及跨辖区要求，都会推迟规模化商业化并拉长采购周期。
            calloutType: risk
