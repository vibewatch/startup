      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 没有完美的上市可比公司，因此估值纪律只能靠三角测量。Mobileye 是最干净的公开参照，因为它是有规模的自动驾驶和 ADAS 软件平台，具备公开文件和市值；如果
              Applied 配得上 Mobileye 式的头部估值，投资人就应期待看到远多于当前公开证据的收入披露。Aurora 是有用的公开反例，因为它展示了公开市场会如何严厉对待 AV
              故事，即便公司有监管文件、商业化进展和公开透明度。Scale AI 是最相关的私营跨界可比公司，因为它处在更广义 AI 基础设施主题之内，在公开财务细节有限的情况下仍获得了高溢价私募估值。


              其余样本有信息量但并不完美。Waymo 由母公司持有且偏 robotaxi；Waabi 和 Wayve 更早期、商业证明更窄；Palantir 更宽、更成熟，但可用于观察国防 AI 溢价；Luminar
              则提醒投资人，硬件相邻的自动驾驶公司可能以很深折扣交易。关键结论不是某一行能给出精确倍数，而是：除非 Applied 已经比公开证据显示的规模大得多、变现好得多，否则 150 亿美元价格处在同业集合的高端。
