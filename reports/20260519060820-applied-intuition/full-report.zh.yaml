      - number: '8.3'
        title: 收入模型与倍数分析
        blocks:
          - type: paragraph
            body: >-
              核心估值问题是分母不透明。公开来源反复披露估值、投资人质量、盈利能力和战略合作，但没有披露收入、ARR、毛利率或留存，外部投资人无法有把握地计算历史倍数。因此，正确方法是倒推出一个合理软件倍数所隐含的收入基数。在这个基础上，如果
              Applied 在 2024 年按高溢价软件假设已有约 1.5 亿到 2.5 亿美元的 ARR，60 亿美元估值就算合理。相比之下，150 亿美元估值很可能需要大约 5 亿到 7.5 亿美元的
              ARR，除非投资人在承销一个更高的基础设施式倍数。


              商业模式细节正是在这里变得重要。OEM 工程工具最可能是核心收入驱动，但高溢价情景取决于国防项目、车辆智能授权和更宽技术栈变现，在仿真之外贡献可观增量。盈利能力支持一种判断：Applied 可能已经比失败的 AV
              同行经济性更强；BlackRock 加 OpenAI 也强化了溢价叙事。即便如此，如果收入仍低于约 2 亿美元，最新轮相对公开自动驾驶和软件参照会隐含极度拉伸的倍数。
