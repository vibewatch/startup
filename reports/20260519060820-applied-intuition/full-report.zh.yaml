      - number: '5.4'
        title: 防务技术平台
        blocks:
          - type: paragraph
            body: >
              防务并不是副业。Applied 的防务页面称，公司为争议环境构建自动驾驶软件、仿真基础设施和任务系统，支持 mesh 网络上的协同自动驾驶，以及跨域多机器协同。最强的公开证明是 Army ISV
              故事：Applied 称其用 10 天让 Infantry Squad Vehicle 实现自主化，将其与 Humvee 移动指挥所配对，并用 Vehicle OS
              加越野自动驾驶软件，在实地作业中支持路线定义、进度监控和危险警报。这对产品尽调很重要，因为它说明公司可以把同一套软件底座适配到比乘用车更严苛、更不标准化的运行环境。承销限制同样重要。公开来源不披露这些环境中的涉密部分、确切认证边界或具名安全架构。因此，防务强化了差异化叙事，但尚未提供完整公开记录，足以在没有管理层访问的情况下承销任务关键场景所需的信任、认证和部署证据。
            claimRefs:
              - CE019
              - CE020
              - CE021
              - CE022
              - CE023
              - CE036
      - number: '5.5'
        title: 技术架构与开发者生态
        blocks:
          - type: paragraph
            body: >
              公开证据最能支撑的架构叙事，是代码优先、模块化、面向集成。Vehicle OS 被描述为一层软件，横跨感知、规划、控制、车载软件、车外服务和云端工具；工程师用 Python 建模行为，用 pull request
              管理变更。相比许多汽车买家仍然联想到的旧式、GUI 很重的验证链，这套形象更现代，也更软件原生。与此同时，竞争对手在一些领域披露得更细。CARLA 写明了 Python API、ROS bridge 和
              OpenDrive 支持；Ansys 明确营销 SiL/HiL、ASAM 对齐、认证和传感器级准确仿真；CarMaker 披露 MIL/SIL/HIL/VIL、支持标准和 UN/ECE 审批流程；Mobileye
              公开点名 RSS 和 ISO 9001。Applied 的公开页面则更强调监管标准合规、虚拟化测试、代码优先带来的速度和广泛互操作等结果。这足以证明它的技术栈有差异化，但还不足以核验 AUTOSAR 覆盖、具名
              ISO 工作流、精确 HIL 集成，或基准级认证支持。若要把这套架构叙事视为已充分去风险化，上述问题仍是核心尽调项。
