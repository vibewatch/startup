  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 的融资历史，更适合理解为一连串越来越强的验证点，而不是一组披露完整、干净的轮次。公开证据支持：2017 年由 Andreessen Horowitz 支持的一笔小额
              Series A；2018 年由 General Catalyst 领投的约 $40 million Series B；2019 年 $125 million Series C，使披露融资总额约达 $175
              million；2020 年估值 $3.6 billion 的 $175 million Series D；2024 年估值 $6 billion 的 $250 million Series E；以及 2025
              年按 $15 billion 估值定价的 Series F。关键限制在于披露质量。Series A、Series B 和 Series F 的确切现金到账并未完全公开，因此累计融资额应仍被视为约 $1.5
              billion 或以上的估计，而不是硬事实。


              这种模糊性会影响承销，因为估值信号远比现金流信号清楚。SEC EDGAR Form D 搜索结果显示，Applied Intuition
              至少在部分融资中使用了私募备案，但这些通知不能替代经审计财务报表、详细股权结构披露或当前现金余额。因此，公司呈现出一个看似资金极其充足、却仍难以建模稀释、剩余流动性和所有权集中度的资本结构。
