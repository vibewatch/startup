      - number: '3.2'
        title: 平台与数据竞争者
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 还面临来自相邻平台的显著压力，这些平台控制数据、开发者工作流或低成本替代品，而不只是传统仿真软件。Scale AI
              是最清楚的相邻竞争者，因为现代自动驾驶买家不会孤立地给仿真做预算；他们也会购买数据标注、整理、评估和模型反馈基础设施。拥有这些工作流的供应商可以向上游移动，进入验证和分析，即使起点并不是仿真器。因此，Scale
              AI 是一个新兴竞争面，而非传统正面同业。


              CARLA 制造的是另一种压力。它不是 Applied OEM 级工作流的交钥匙企业替代品，但对研究团队、初创公司、大学和价格敏感试点而言，它是有效的零授权费基准。因此，CARLA
              会压缩基础仿真能力的支付意愿，并给内部工程团队一个可信的“围绕开源自建”选项。Applied 在支持、集成、企业部署和流程适配上看起来仍占优；但 CARLA
              的存在意味着，公司不能只靠软件稀缺性卖价。它必须把保真度、工作流集成和价值兑现速度，卖到免费或数据中心化替代方案之上。
