      - number: '3.3'
        title: 端到端 AV 竞争者
        blocks:
          - type: paragraph
            body: >
              Applied Intuition 面临的一些最重要竞争压力，来自根本不想销售点状工具的公司。Waymo、Mobileye、Wayve、Aurora 和 Waabi
              会塑造客户对“胜出”自动驾驶架构应是什么样的预期。Waymo 最重要，因为它是技术可信度、数据集、仿真成熟度和人才吸引力的基准，尽管它目前不销售通用外部工具栈。Mobileye 重要，是因为它已经拥有深厚 OEM
              关系和可授权的车辆智能姿态，在某些账户中可能降低客户对独立第三方工具供应商的需求。Wayve、Aurora 和 Waabi 重要，是因为它们围绕一个想法争夺 OEM
              心智：买家也许更偏好端到端自动驾驶平台或战略伙伴，而不是模块化工具环境。


              因此，这些公司是间接但具有战略意义的竞争对手。它们可以改变客户预算去向、技术路线图形态，以及仿真是作为独立类别采购，还是被捆进更宽的车辆软件决策中。Applied
              的挑战，是证明基础设施宽度和集成速度，比押注任何一种端到端自动驾驶论点更有价值。
