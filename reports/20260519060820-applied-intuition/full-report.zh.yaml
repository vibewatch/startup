      - number: '2.4'
        title: 防务与政府板块
        blocks:
          - type: paragraph
            body: >
              防务不是 Applied Intuition 可有可无的相邻业务；公开公司材料显示，它正被定位为公司的核心扩张向量之一。逻辑很有说服力。民用 AV
              支出仍受商业化延迟和公共安全审视约束，但防务自动驾驶预算可以用任务效果、后勤韧性、训练和生存性来证明合理性。这会改变买方行为。政府项目以项目为单位、重视安全敏感性和验证，天然更贴近仿真、测试和车辆软件基础设施，而不是面向消费者的网约车经济学。公开联邦支出数据也显示，自动驾驶相关项目已代表每年数十亿美元义务支出，即便仅从搜索结果仍难把精确工具层支出单独剥离出来。


              对 Applied Intuition 来说，防务在战略上做了两件事。第一，它把可触达市场扩到乘用车项目之外，降低公司对单一 AV
              商业化时间线的依赖。第二，它提升了软件栈的定性价值，因为防务用户高度重视场景生成、数字测试和任务特定验证。限制在于透明度。确切项目金额、合同时间、以及自动驾驶预算中哪些部分真正可由 Applied
              Intuition 触达，都很难从公开来源锁定。因此，防务应被视为有意义的顺风和战略对冲；但没有管理层级别披露之前，它还不是一个已完全量化的收入桥。
            claimRefs:
              - CM008
              - CM019
              - CM030
              - CM031
              - CM032
              - CM033
              - CM041
      - number: '2.5'
        title: 市场风险与行业逆风
        blocks:
          - type: paragraph
            body: >
              这个市场的主要风险不是自动驾驶软件是否重要，而是商业化能否按投资者时间线到来。工具供应商可以在客户规模化部署前很多年就赢得项目，这会拉长销售周期，并把收入兑现推到很远。RAND 长期以来的安全论点和更近期的 AV
              覆盖，都强化了同一结论：证明安全既昂贵又缓慢，也不太可能只靠道路里程解决。这支撑仿真需求，但也意味着客户往往多年停留在评估或有限部署状态。安全事故和公开 AV 挫折，已经把市场叙事从普遍 robotaxi
              热情转向 ADAS、高速卡车和防务等更窄领域。


              另一个关键尽调风险是不透明。公开来源不披露 Applied Intuition 在仿真和自动驾驶工具中的确切收入、ARR
              或市场份额，因此投资者无法把公司估值直接连接到某个已知品类支出占比。第三方市场估计也会因衡量对象不同而出现重大差异：只看仿真、看更宽的自动驾驶软件，还是纳入相邻 ADAS
              和数字孪生预算，结果都不一样。结论是，这个市场显然重要且在增长，但仅凭公开证据仍难精确承销。投资者应把本章市场测算视为有边界的分析镜头，而不是替代私人管线、定价、胜率和分部收入数据。
