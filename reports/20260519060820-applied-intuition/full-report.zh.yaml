      - number: '7.2'
        title: 法律与责任风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 的法律风险，核心在于自动驾驶软件从开发工具进入运营栈后，责任会落到哪里。Greenberg Traurig 的 2026
              年责任综述把要点说得很清楚：在没有专门联邦责任法的情况下，AV 事故仍会回到州法拼图、过失诉讼和产品责任理论。这很关键，因为 Applied 在自己的公开叙事中已不再只是仿真器供应商；它现在谈 Vehicle
              OS、SDS、国防自主系统和 physical-AI 工作流，这些都可能更接近客户部署。严重事故发生时，原告不需要像上市公司披露那样完整的证据链，就可以把每一个看似可能的被告都列入诉讼。OEM、ADS
              供应商、远程运营商、软件供应商和组件合作伙伴都可能进入同一个案件，再由法院分配责任。


              知识产权与执法侧同样值得重视。Waymo v. Uber 商业秘密案持续提醒市场：前员工、模型诀窍或自研开发工具发生争议时，自动驾驶软件会以很高金额进入诉讼。已审阅来源没有发现 Applied 公开具名的 AV
              事故诉讼或政府同意令；这好过已披露诉讼，但缺席本身不消除风险。Husch Blackwell 对已关闭 Waymo
              调查的总结显示，监管方可能花很长时间调查安全问题，最后在没有系统性发现的情况下结案。与此同时，出口管制暴露不是一次性打勾：BIS 和 Trade.gov 都描述了 EAR
              下持续的许可、筛查和最终用途审查义务；国防项目还可能对数据共享、外籍人员访问和技术转让提出类似限制。一家公司若同时服务全球 OEM 和美国国防买方，法律边界可能比收入披露扩张得更快。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: 技术与产品风险
        blocks:
          - type: paragraph
            body: >-
              最重要的产品风险，是再复杂的仿真也无法完全弥合真实世界边缘案例缺口。RAND 的安全研究仍是经典警示：要证明 AV 安全性在统计上显著优于基准，可能需要数千万到数百亿英里的里程，取决于被衡量的事件。这不是说
              Applied 的仿真产品没有价值；而是说自动驾驶的举证负担内生地巨大，任何供应商都不应被按“合成环境和回放环境已经消除真实验证风险”来承销。NHTSA 自己的 ADS
              研究和安全页面仍强调测试、评估、监督和事故报告，而不是暗示验证问题已经解决。对 Applied 来说，任何看似穿过仿真工作流的高知名度客户失败，都会重击信誉，即便最终法律责任落在 OEM 身上。


              开源和执行风险叠加在这条技术基线之上。CARLA 为开发者提供了可信的零许可证仿真环境，带 API、场景工具和大型公共社区，因此 Applied
              必须靠工作流集成、企业支持、安全流程严谨度和领域覆盖来守住价格与差异化，而不能只靠仿真本身。这是一条有意义的护城河，但并非坚不可摧。关键人物依赖是另一项主要产品执行风险。Applied 在资本市场和战略叙事中仍与
              CEO Qasar Younis
              高度绑定；招聘页面也显示，它仍在争夺稀缺的自动驾驶、机器人和具备国防许可背景的工程人才。国防项目还带来纯商业同行没有的约束，包括安全许可瓶颈和出口管制下的协作限制。随着公司从工具扩展到更广义的机器软件，路线图排序失误或高级领导层流失会比它还是一家更窄的仿真供应商时更重要。
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
      - number: '7.4'
        title: 市场与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition 受益于向自动驾驶卖“铲子”，而不是直接给 robotaxi 或自动驾驶卡车车队烧钱，但行业风险并未消失。AV
              行业史上不缺资金雄厚、最后仍在经济性跑通前失败、重组或被出售的项目。Embark 是最接近的警示案例，因为 Applied 自己是在这家独立卡车公司耗尽现金跑道后买下其资产。IEEE Spectrum
              更广泛的行业报道和 RAND 对商业化的谨慎判断指向同一个方向：商业化耗时长于乐观投资人的预期，安全事故可以重置时间表，即便技术可信的项目也可能走向整合，而非成为独立赢家。Argo
              AI、Motional、TuSimple 和 Zoox 分别展示了不同失效模式——关停、收缩、治理压力或战略吸收。


              Applied 还背负公开来源无法解答的商业模式不确定性。公司宣传了广泛 OEM 覆盖、国防进展、盈利能力和 150
              亿美元估值，却仍未公开披露收入、ARR、毛利率、最大客户集中度或合同期限。因此，外部无法判断公司是真的不受漫长 AV 采用曲线拖累，还是只是资本更充足、能更久地对抗它。即便客户标识很多，客户集中度仍是真实风险：前
              20 大 OEM 中 17 家并不说明是否有 3 个账户主导经济性。政府业务又叠加第二层集中度，因为项目节奏取决于预算、采购周期和国家安全优先级。地缘政治冲击——从出口限制到汽车供应链扰动——也可能影响
              Applied 依赖的同一批客户，而这些客户最终要贡献生产级收入。相比失败的车队运营商，这门生意更有韧性；但它仍显著高于普通企业软件的风险。
