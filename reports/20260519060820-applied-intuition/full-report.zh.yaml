            title: 即使 robotaxi 时间线令人失望，仿真需求仍会存在
            body: >-
              Applied Intuition 不需要大众市场自动驾驶立即规模化部署，也可以拥有真实市场。AV 仿真、ADAS 验证和软件定义车辆工作流已经是数十亿美元支出类别；RAND
              式安全逻辑也仍支持仿真成为实体测试的必要补充。
            calloutType: strength
