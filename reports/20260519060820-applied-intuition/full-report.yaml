      - number: '5.5'
        title: Technical Architecture and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >
              The architecture story that is best supported by public evidence is code-first, modular, and
              integration-oriented. Vehicle OS is described as a software layer spanning perception, planning, controls,
              on-board software, off-board services, and cloud tooling, with engineers modeling behavior in Python and
              managing changes through pull requests. That is more modern and more software-native than the image many
              automotive buyers still associate with legacy GUI-heavy validation chains. At the same time, competitor
              disclosures remain sharper in some areas. CARLA documents Python APIs, ROS bridges, and OpenDrive support;
              Ansys explicitly markets SiL/HiL, ASAM alignment, homologation, and sensor-accurate simulation; CarMaker
              discloses MIL/SIL/HIL/VIL, supported standards, and UN/ECE approval workflows; Mobileye publicly names RSS
              and ISO 9001. Applied's public pages instead emphasize outcomes such as compliance with regulatory
              standards, virtualized testing, code-first speed, and broad interoperability. That is enough to establish
              a differentiated stack, but not enough to verify AUTOSAR coverage, named ISO workflows, exact HIL
              integrations, or benchmark-level certification support. Those remain central diligence asks before
              treating the architecture story as fully de-risked.
