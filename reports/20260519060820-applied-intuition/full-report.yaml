  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio Overview
        blocks:
          - type: paragraph
            body: >
              Applied Intuition now presents its offering as one platform for all moving machines rather than as a
              narrow autonomy-tool vendor. The public surface repeatedly groups Self-Driving System (SDS), Vehicle OS,
              and Tools for Vehicle Intelligence under a broader Physical AI umbrella, with the same stack then
              specialized for automotive, trucking, mining, agriculture, construction, and defense. That matters because
              buyers are not being asked to license a single simulator; they are being asked to adopt an integrated
              software substrate that can move from ADAS into autonomy, from on-road into off-road, and from commercial
              into defense contexts. A second notable shift is branding discipline. Current product pages no longer
              foreground older names such as Simian and Spectral, but the underlying simulation/evaluation and
              data/quality-control functions remain plainly visible inside the Tools for Vehicle Intelligence narrative.
              From a diligence perspective, the portfolio looks broad, modular, and multi-domain, but maturity is not
              uniform across every surface and some of the newest layers still read more like fast-moving platform
              narrative than independently benchmarked product proof.
