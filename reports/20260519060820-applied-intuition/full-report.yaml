      - number: '2.2'
        title: Regulatory Environment
        blocks:
          - type: paragraph
            body: >
              The regulatory environment matters to Applied Intuition less because it creates a single federal
              “go/no-go” gate and more because it creates an ongoing validation burden across multiple jurisdictions.
              NHTSA's current framework still lacks a standalone federal pre-market certification regime for autonomous
              vehicles; instead, the market operates through existing safety standards, defect authorities, standing
              orders, and state-by-state permitting structures. That fragmentation is commercially important. It slows
              commercialization because customers must navigate inconsistent legal and operational requirements, but it
              also strengthens the case for simulation and scenario-based validation because OEMs and developers need
              evidence across many operating conditions before deployment.


              For commercial trucking, FMCSA-facing rule clarity remains incomplete, which leaves national driver-out
              deployment timing uncertain even as highway autonomy retains one of the clearest operational design
              domains in the sector. For global OEM programs, EU and UNECE pathways add another layer of homologation
              work and timing complexity. Defense sits in a different lane entirely: instead of one civilian AV
              rulebook, procurement is shaped by program-specific safety, interoperability, and testing requirements.
              The result is a market in which regulation is not simply a headwind. It is simultaneously a delay factor
              and a demand driver for Applied Intuition's category, because every new reporting layer, safety order, and
              jurisdictional difference increases the workload around test coverage, scenario management, and validation
              evidence.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM028
              - CM045
