      - number: '4.5'
        title: Financial Risk Profile and Capital Efficiency
        blocks:
          - type: paragraph
            body: >
              The principal financial risk is not obvious insolvency; it is valuation and disclosure mismatch. Applied
              Intuition's public valuation went from $3.6 billion in 2020 to $6 billion in 2024 and then to $15 billion
              in 2025, but public KPI disclosure did not expand at the same pace. The latest financing is much easier to
              corroborate on valuation and investor names than on exact cash amount or current operating results. That
              does not mean the company is weak. It means outside investors are being asked to underwrite a premium
              price mostly from investor quality, partner proof, profitability language, and scale proxies rather than
              from a full operating-data package.


              Capital-efficiency comparison therefore has to be approximate. Applied appears more software-like than a
              company such as Aurora in disclosure style, yet more capitalized than many pure tools vendors because
              cumulative funding is estimated at roughly $1.5 billion or more. The right conclusion is not that the
              company is overvalued by definition. It is that underwriting still requires private diligence on exact
              Series F cash proceeds, customer concentration, NRR, board rights, dilution, cash balance, and the
