  - id: TE003
    title: Technology Standards Compliance
    columns:
      - Standard
      - Relevance
      - AI Coverage
      - Competitor Coverage
      - Diligence Ask
    rows:
      - - ISO 26262
        - Functional-safety backbone for automotive software and tool qualification
        - >-
          Public pages say compliance with regulatory standards and safety validation, but no named ISO 26262 coverage
          was reviewed
        - Ansys and CarMaker market safety justification, homologation, and approval workflows more explicitly
        - Request ASIL allocation, tool-chain qualification, safety case artifacts, and assessor reports
      - - ISO 21448 (SOTIF)
        - Critical for validating safe behavior in perception-heavy ADAS/AV systems
        - Not named in reviewed Applied product pages
        - >-
          Competitors disclose more explicit safety-validation workflows, though not always SOTIF by name on the
          reviewed pages
        - Request scenario-coverage methodology, edge-case closure metrics, and SOTIF work products
      - - MISRA C++
        - Relevant for production vehicle software quality and static-analysis discipline
        - No public MISRA statement reviewed
        - No reviewed competitor page made MISRA a homepage-level claim either
        - Request coding-standard policy, static-analysis stack, and exception handling process
      - - AUTOSAR Adaptive
        - Important for OEM integration, middleware reuse, and vehicle-software portability
        - Public code-first OS messaging implies integration intent, but no named AUTOSAR support was reviewed
        - >-
          Competitor pages emphasize open architecture and toolchain integration more than AUTOSAR-specific statements
          in the reviewed set
        - Request named AUTOSAR interfaces, supported versions, and reference integrations
      - - ASAM OpenSCENARIO
        - Common scenario-exchange standard for simulation portability
        - No named Applied statement reviewed
        - Ansys says AVxcelerate follows ASAM standards; CarMaker emphasizes supported standards and interfaces
        - Request import/export support, scenario-library compatibility, and customer evidence
      - - ASAM OpenDRIVE
        - Road-network interoperability matters for simulator and map portability
        - No named Applied statement reviewed
        - CARLA docs explicitly mention OpenDrive support
        - Request OpenDRIVE support details and translation limitations
      - - SAE J3016
        - Defines ADAS/AV automation levels used in customer and regulatory discussions
        - Applied publicly frames automotive SDS as a path from L2+ to L4
        - Mobileye and industry peers also use explicit ADAS-to-AV level framing
        - Request exact feature boundary by level, fallback assumptions, and customer deployment status by level
    notes: >-
      This table distinguishes between explicit named standards evidence and broader safety/compliance language.
      Applied's public materials support a serious safety posture, but they do not function as a certification register,
      so many rows remain diligence asks rather than verified compliance conclusions.
