appendices:
  - id: A
    title: Applied Intuition Funding Round Summary
    blocks:
      - type: paragraph
        body: >
          Applied Intuition has raised across six known rounds: Series A (~$2M, 2017, a16z), Series B (~$40M, 2018,
          General Catalyst), Series C ($125M, 2019), Series D ($175M at $3.6B, 2020), Series E ($250M at $6B, ~2024),
          and Series F ($15B valuation, ~2025). Total raised is estimated at $1.5B+; exact Series A, B, and F raise
          amounts are not publicly disclosed.
        claimRefs:
          - CO017
          - CO018
      - type: paragraph
        body: >
          The Series F was co-led by BlackRock and Kleiner Perkins with Fidelity and Lux Capital participating.
          Simultaneously, OpenAI announced a strategic partnership with Applied Intuition, signaling a convergence of
          the Physical AI and LLM infrastructure theses.
        claimRefs:
          - CO017
