  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Overview and OEM Penetration
        blocks:
          - type: paragraph
            body: >
              Applied Intuition's public customer story is strongest on breadth and weakest on named-account depth. The
              company continues to point investors and customers to a broad assertion that it serves 17 of the top 20
              global automotive OEMs, and its public surfaces name Toyota, Volkswagen Group, General Motors, and Hyundai
              as specific automotive references. That matters because it implies the company has reached most of the
              global passenger-vehicle buying set that matters for simulation, validation, and autonomy tooling. It also
              suggests Applied has become embedded enough in automotive software workflows to win mindshare across North
              America, Europe, and Asia rather than only in one regional engineering market.


              The diligence problem is that breadth is not the same as depth. Public sources do not identify the
              remaining OEMs inside the 17-of-20 claim, do not map whether those relationships are pilot programs or
              production-scale toolchains, and do not disclose which accounts generate meaningful recurring software
              revenue. The result is a customer story that is clearly real, but only partially legible. Public logo
              proof supports strong market penetration; it does not yet reveal the ACV, renewal durability, or
              production attachment needed to underwrite customer quality with confidence.
