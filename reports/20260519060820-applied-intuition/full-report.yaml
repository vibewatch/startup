        title: Scale and Global Footprint
        blocks:
          - type: paragraph
            body: >
              The current company snapshot is notable for breadth even though core financial metrics remain private.
              Applied Intuition says it has 1,000+ engineers, including 40 former CTOs and 30 former founders, and lists
              offices across North America, Europe, and Asia to support multinational OEM programs. Its customer page
