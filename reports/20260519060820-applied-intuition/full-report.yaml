companyProfile:
  summary: >
    Applied Intuition, Inc. (founded 2017, Sunnyvale CA) is a private technology company that builds the software
    infrastructure for autonomous and intelligent vehicles. Its products—simulation tools (Simian), a data management
    platform (Spectral), a full Self-Driving System (SDS), and Vehicle OS—are used by automotive OEMs, commercial
    trucking companies, and the US Department of Defense. The company claims to supply 17 of the top 20 global
    automotive OEMs and has confirmed defense customers in the US Army and Air Force. Following its Series F at a $15
    billion valuation co-led by BlackRock and Kleiner Perkins, Applied Intuition also announced a strategic partnership
    with OpenAI, positioning itself as a Physical AI infrastructure company.
