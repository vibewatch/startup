  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Size and Growth
        blocks:
          - type: paragraph
            body: >
              The cleanest external proxy for Applied Intuition's core market is autonomous vehicle simulation and
              validation software rather than a generic “autonomy” category. Across MarketsandMarkets, Grand View
              Research, Allied Market Research, Mordor Intelligence, and Business Research Insights, the simulation
              segment clusters around a roughly $2.5 billion 2024 market with a high-single-to-high-teens growth profile
              and a $7-8 billion endpoint by 2030-2035. That range is directionally useful because Applied Intuition's
              product stack is centered on simulation, testing, validation, and vehicle-software workflows rather than
              operating a robotaxi fleet or manufacturing sensors. The broader adjacency is substantially larger: Mordor
              places ADAS at roughly $33 billion in 2024 with an $80 billion-plus 2030 outlook, while MarketsandMarkets
              projects autonomous driving software to roughly $7 billion by 2035.


              For underwriting, the right sizing approach is layered. A broad TAM can reasonably combine AV simulation,
              autonomy software, ADAS-adjacent tooling, and defense autonomy budgets for a $40-45 billion lens, but that
              overstates near-term spendable demand for external tools. A more practical SAM centered on OEM programs,
              commercial trucking, and defense tools is closer to $10-12 billion. Automotive OEM tooling likely
              represents the majority of this serviceable pool because automakers must validate software-defined
              vehicles and increasingly advanced driver assistance even when full Level 4 deployment slips. A
              low-confidence SOM around $3 billion is plausible for third-party autonomy tooling vendors, but it should
              be treated as a planning heuristic until management provides pipeline, win-rate, and contract-value data.
            claimRefs:
