  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Environment and Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition sells into one of the least-settled regulatory categories in transportation and defense
              software. U.S. federal AV policy still leans more heavily on guidance, defect authority, crash reporting,
              and incremental FMVSS updates than on a single pre-market certification regime for driverless systems.
              That creates a mixed outcome for Applied: there is no federal safety mandate forcing OEMs to adopt its
              stack, but there is also no stable national approval path that shortens customer buying cycles. CRS, NHTSA
              policy pages, active rulemaking dockets, and pending House legislation all point to a framework that
              remains incomplete rather than finalized. For investors, that means Applied's commercial timing is partly
              hostage to regulatory evolution that it does not control.


              The fragmentation risk is sharper at the state and trucking levels. NCSL's legislation database shows that
              autonomous-vehicle laws now span topics including licensing, testing, insurance, privacy, and operation on
              public roads across a large number of states, while FMCSA's 2023 supplemental ANPRM confirms that
              commercial motor-carrier rules for ADS-equipped trucks are still being worked through. Applied therefore
              faces second-order exposure whenever trucking customers or OEMs must navigate state-by-state operating
              assumptions before any federal trucking framework settles. Outside the U.S., the picture gets more complex
              rather than simpler. Public policy sources and legal commentary still describe divergent approaches
              between the U.S. system and UNECE-style type-approval logic in Europe, while NIST's AI RMF remains
              voluntary but is visibly becoming a procurement reference point as NIST adds a 2026
              critical-infrastructure profile. Add defense exposure and the compliance stack expands again: EAR export
              controls, possible ITAR adjacency for defense work, FAR/DFARS procurement clauses, foreign-acquisition
              restrictions, and classified-program handling all raise execution cost without guaranteeing revenue
              pull-through.
