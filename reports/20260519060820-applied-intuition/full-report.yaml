      - number: '8.4'
        title: Valuation Scenarios and Sensitivity Analysis
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the best way to handle a company whose quality appears real but whose financial
              disclosure is sparse. In the bull case, Applied is already on a path toward 500 million dollars or more of
              ARR, wins repeated OEM standardization decisions, converts defense credibility into material contract
              scale, and proves that vehicle intelligence or self-driving stack modules are monetizing beyond legacy
              simulation tooling. Under that outcome, a low-to-mid-teen multiple on a larger revenue base can support or
              exceed the current 15 billion dollar mark. In the base case, the company is still excellent but smaller
              than the market hopes, with perhaps 250 million to 400 million dollars of ARR and a multiple that remains
              premium but not euphoric. That outcome supports a meaningful company, but one whose latest round still
              looks somewhat stretched.


              The bear case is more straightforward. If Applied remains below roughly 200 million dollars of recurring
              revenue, if OEM budgets slow, or if simulation and autonomy tooling become more commoditized, multiple
              compression could be severe. Embark is not a direct comparable, but it is a reminder that this sector has
              produced dramatic write-downs when commercialization disappoints. Probability-weighted, the public-data
              range looks closer to low-double-digit billions than to a clearly discounted entry point.
