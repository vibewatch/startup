            title: Simulation demand survives even if robotaxi timelines disappoint
            body: >-
              Applied Intuition does not need immediate mass-market autonomy deployment to have a real market. AV
              simulation, ADAS validation, and software-defined vehicle workflows already represent multi-billion-dollar
              spend categories, and RAND-style safety logic still supports simulation as a necessary complement to
              physical testing.
            calloutType: strength
