      - number: '3.5'
        title: Competitive Risks and Displacement Scenarios
        blocks:
          - type: paragraph
            body: >
              The main displacement risk is not that one rival copies all of Applied Intuition's products at once. It is
              that customers decide they do not need the full bundle. dSPACE or ANSYS can remain entrenched for
              validation-heavy programs; CARLA can cap pricing for early-stage teams; Scale AI can capture the data and
              evaluation layer; and Mobileye, Wayve, Aurora, or Waabi can persuade OEMs that a broader platform
              relationship is more strategic than adopting modular tooling. Public evidence also does not show that
              Applied has exclusive OEM contracts or durable sole-source positions, so multi-homing risk appears real.
              In large vehicle programs, buyers often keep more than one simulation, data, or validation pathway alive.


              Another underwriting issue is opacity. Exact competitor revenues, realized ACV, and OEM account share are
              mostly not public, which makes threat ranking inherently approximate. That means the key diligence
              question is not whether Applied has differentiation in the abstract—it clearly does—but whether that
              differentiation survives renewal cycles, broadens inside accounts, and prevents procurement from
              fragmenting back toward incumbents, open source, or end-to-end platform alternatives. Investors should
              therefore ask for win/loss data, replacement evidence against dSPACE-class incumbents, and contract detail
              on whether Applied is becoming a system of record or merely one tool in a larger stack.
