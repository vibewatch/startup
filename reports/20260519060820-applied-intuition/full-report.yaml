          - type: callout
            title: Defense materially broadens the market beyond commercial AV cycles
            body: >-
              Defense gives Applied Intuition access to a budget pool that is not driven primarily by consumer
              acceptance of self-driving cars. Program-based government demand can offset some of the cyclicality
              created by commercial AV slowdowns, even if exact contract values remain opaque.
            calloutType: insight
            claimRefs:
