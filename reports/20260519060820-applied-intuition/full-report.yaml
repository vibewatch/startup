      - number: '5.3'
        title: Physical AI and Agentic Development
        blocks:
          - type: paragraph
            body: >
              The newest layer of the story is the shift from vehicle-intelligence tooling to a broader Physical AI
              platform. The current public pages are explicit that the stack is intended to orchestrate autonomy
              workflows across cloud, on-prem, and air-gapped environments, and they also claim agent-driven operation
              through tokenized UI designs and MCP-ready interfaces. That language is not just generic branding. The
              research page discusses world-action models, reinforcement-learning post-training, 4D reconstruction, and
