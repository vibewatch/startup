            title: Regulation slows deployment even while it expands the tooling workload
            body: >-
              The same fragmented regulatory structure that makes simulation and reporting more necessary also stretches
              customer timelines. NHTSA's guidance-heavy regime, incomplete FMCSA trucking clarity, and
              cross-jurisdictional requirements all delay scaled commercialization and lengthen procurement cycles.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
