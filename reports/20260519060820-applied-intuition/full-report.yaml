      - number: '5.4'
        title: Defense Technology Platform
        blocks:
          - type: paragraph
            body: >
              Defense is not presented as a side project. Applied's defense pages say the company builds autonomy
              software, simulation infrastructure, and mission systems for contested environments, with collaborative
              autonomy over mesh networks and multi-machine coordination across domains. The strongest public proof is
              the Army ISV story: Applied says it made an Infantry Squad Vehicle autonomous in 10 days, paired it with a
              Humvee mobile command post, and then used Vehicle OS plus off-road autonomy software to support route
              definition, progress monitoring, and hazard alerts during live field work. This is important for product
              diligence because it suggests the company can adapt the same software substrate to harsher, less
              standardized operating environments than passenger automotive alone. The underwriting caveat is equally
              important. Public sources do not disclose the classified portions of these environments, exact
              accreditation boundaries, or named security architectures. Defense therefore strengthens the
              differentiation narrative, but it does not yet provide a full public record of the trust, certification,
              and deployment evidence needed to underwrite mission-critical durability without management access.
