  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Applied Intuition's financing history is best understood as a sequence of increasingly strong validation
              points rather than a clean set of fully disclosed rounds. Public evidence supports a small 2017 Andreessen
              Horowitz-backed Series A, an approximately $40 million 2018 Series B led by General Catalyst, a $125
              million 2019 Series C that brought total disclosed funding to roughly $175 million, a $175 million 2020
              Series D at a $3.6 billion valuation, a $250 million 2024 Series E at a $6 billion valuation, and a 2025
              Series F priced at a $15 billion valuation. The important caveat is disclosure quality. Exact Series A,
              Series B, and Series F cash proceeds are not fully public, so cumulative funds raised should remain an
              estimate of roughly $1.5 billion or more rather than a hard fact.


              That ambiguity matters for underwriting because valuation signals are much clearer than cash-flow signals.
              SEC EDGAR Form D search results indicate that Applied Intuition used private-placement filings for at
              least some financings, but those notices do not substitute for audited financial statements, detailed
              cap-table disclosure, or a current cash balance. The company therefore presents a capital structure that
              appears very well funded but still difficult to model for dilution, remaining liquidity, and ownership
              concentration.
