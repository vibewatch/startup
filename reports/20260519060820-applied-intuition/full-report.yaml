      - number: '3.3'
        title: End-to-End AV Competitors
        blocks:
          - type: paragraph
            body: >
              Some of the most important competitive pressure on Applied Intuition comes from companies that are not
              trying to sell point tools at all. Waymo, Mobileye, Wayve, Aurora, and Waabi shape customer expectations
              around what the “winning” autonomy architecture should look like. Waymo matters most as a benchmark for
              technical credibility, datasets, simulation maturity, and talent attraction, even though it does not
              currently sell a general-purpose external tooling stack. Mobileye matters because it already has deep OEM
              relationships and a licensable vehicle-intelligence posture, which can reduce the need for a separate
              third-party tool vendor in some accounts. Wayve, Aurora, and Waabi matter because they compete for OEM
              mindshare around the idea that buyers may prefer an end-to-end autonomy platform or strategic partner over
              a modular tooling environment.


              In that sense, these companies are indirect but strategically important competitors. They can shift where
              customer budgets go, what technical roadmaps look like, and whether simulation is procured as an
              independent category or bundled into a broader vehicle-software decision. Applied's challenge is to prove
              that infrastructure breadth and integration speed are more valuable than betting on any one end-to-end
              autonomy thesis.
            claimRefs:
