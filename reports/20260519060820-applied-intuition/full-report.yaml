      - number: '2.3'
        title: Market Dynamics and Competitive Landscape
        blocks:
          - type: paragraph
            body: >
              Applied Intuition competes in a fragmented tools market rather than a neatly bounded software category.
              Customers typically do not buy “one AV platform”; they assemble combinations of simulation, data
              management, mapping, perception-development, validation, and safety-case tools. That fragmentation creates
              opportunity for an infrastructure vendor with broad workflow coverage, but it also means procurement can
              stay modular and price sensitive. Open-source tools and internal engineering stacks create pressure at the
              low end of the stack, while sophisticated buyers may multi-home across several vendors. Applied
              Intuition's strategic advantage is therefore less about monopoly market share and more about solving the
              hardest integration and validation workflows across automotive, trucking, and defense.


              Several tailwinds support category growth. OEM digital transformation and software-defined vehicle
              programs move more validation work into software before physical prototypes are complete. ADAS mandates
              and safety expectations expand adjacent spend even if pure robotaxi timelines keep slipping. Sensor cost
              declines and growing data volumes improve the economics of autonomy development, while the data flywheel
              makes high-fidelity simulation more valuable over time. At the same time, the market's headwinds are real:
              long commercialization timelines slow revenue recognition, safety incidents have reduced investor
              exuberance, and market reports vary meaningfully by scope and geography. This is why the market is
              attractive but not automatically easy. Category demand is structural, yet the path from technical
              relevance to fast revenue growth is still gated by procurement cycles, regulatory clarity, and customer
              program survival.
            claimRefs:
