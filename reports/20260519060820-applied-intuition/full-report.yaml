      - number: '3.2'
        title: Platform and Data Competitors
        blocks:
          - type: paragraph
            body: >
              Applied Intuition also faces meaningful pressure from adjacent platforms that control data, developer
              workflows, or low-cost substitutes rather than classic simulation software alone. Scale AI is the clearest
              adjacent competitor because modern autonomy buyers do not budget simulation in isolation; they also buy
              data labeling, curation, evaluation, and model-feedback infrastructure. A vendor that owns those workflows
              can move upstream into validation and analytics, even if it does not start as a simulator. That makes
              Scale AI an emerging competitive surface rather than a traditional head-to-head peer.


              CARLA creates a different kind of pressure. It is not a turnkey enterprise replacement for Applied's
              OEM-grade workflow, but it is an effective zero-license benchmark for research teams, startups,
              universities, and price-sensitive pilots. CARLA therefore compresses willingness to pay for basic
              simulation capabilities and gives internal engineering teams a credible “build around open source” option.
              Applied still appears advantaged on support, integrations, enterprise deployment, and process fit, yet the
              presence of CARLA means the company cannot rely on software scarcity alone. It has to sell fidelity,
              workflow integration, and time-to-value above what free or data-centric alternatives can provide.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
