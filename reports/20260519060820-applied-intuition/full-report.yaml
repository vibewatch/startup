      - number: '4.3'
        title: Financial Performance and Disclosed Metrics
        blocks:
          - type: paragraph
            body: >
              Applied Intuition discloses very little conventional operating data for a company carrying a $15 billion
              valuation. The strongest positive fact in public materials is management's statement in the Series E post
              that the company is profitable and growing at a sustainable triple-digit percentage year-over-year rate.
              If accurate, that combination is unusual for a capital-intensive autonomy-adjacent software company and
              helps explain why investors were willing to finance the business at a much higher price in the following
              round. Public scale proxies also exist: the company says it has 1,000+ engineers and serves 17 of the top
              20 global automotive OEMs.


              But those signals do not solve the core underwriting problem. Revenue, ARR, gross margin, cash balance,
              customer concentration, NRR, and burn rate are all absent from reviewed public sources. PitchBook and CB
              Insights help frame valuation and funding history, but neither closes the gap on audited revenue quality
              or margin path. As a result, Applied Intuition looks like a strong private software infrastructure company
