chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Mission
        blocks:
          - type: paragraph
            body: >
              Applied Intuition, Inc. was founded in 2017 in Sunnyvale, California, by Qasar Younis and Balasubramanian
              Narayanan to build the software infrastructure needed to develop autonomous and increasingly
              software-defined vehicles. The company now describes its mission in broader terms as “physical AI that
              moves the world,” signaling that it wants to be understood not merely as a simulation vendor but as a core
              operating layer for cars, trucks, defense systems, and eventually other robotic platforms. Its product
              stack centers on Self-Driving System (SDS), Vehicle OS, and tools for vehicle intelligence, with recurring
              emphasis on simulation, testing, data workflows, and safety validation. That positioning matters because
              it places Applied Intuition in a high-leverage part of the value chain: instead of betting on one vehicle
              program, it sells enabling infrastructure that can be reused across many programs, customers, and vehicle
              classes.
