              Applied Intuition’s milestone record shows the company expanding from AV development tooling into a
              broader autonomy infrastructure platform. Financing milestones are only part of the story. The company won
              a notable commercial-vehicle validation when PACCAR selected it for autonomous trucking development, later
              added independent evidence via Volvo Group, and publicly highlighted partnerships with Volkswagen, Toyota,
