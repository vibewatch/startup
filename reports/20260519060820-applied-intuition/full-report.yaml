      - number: '8.5'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Applied Intuition deserves more credit than most autonomy startups. The company appears profitable, has
              raised from elite investors, has broadened its positioning beyond simulation, and has enough defense
              relevance to attract an infrastructure premium that many mobility peers never earned. That is the bull
              thesis, and it explains why investors are willing to treat Applied as a physical-AI platform rather than a
              narrow vehicle-development tool. If management eventually discloses revenue at a level commensurate with
              the latest price, the round could look prescient rather than inflated.


              On public evidence alone, however, the recommendation remains track with medium confidence, high risk, and
              a stretched valuation stance. The problem is not that Applied looks weak; the problem is that the
              fundamentals needed to justify 15 billion dollars remain private while the comparable set still points to
              valuation discipline. The anti-thesis is that the market is paying up for narrative, opacity, and AI
              scarcity before fully validating the revenue base. The most important diligence asks are simple: disclose
              ARR, gross margin, revenue mix, retention, and defense contract scale, then revisit whether the 15 billion
              dollar mark is fair or merely ambitious.
