      - number: '6.4'
        title: Customer Concentration and Revenue Dependency Analysis
        blocks:
          - type: paragraph
            body: >
              Applied Intuition's public customer roster suggests broad logo diversification, but the revenue picture
              could still be concentrated. In practice, the highest-value relationships are likely a relatively small
              subset of global OEM platforms, heavy-vehicle programs, and defense accounts. That is common in enterprise
              infrastructure businesses: one customer logo can represent a narrow evaluation license, while another can
              represent a multi-program deployment with much larger annual value. Public materials do not disclose that
              distribution. As a result, investors should not assume that 17-of-20 OEM breadth translates into evenly
              distributed revenue or low concentration risk.


              The most plausible concentration pattern is a barbell. On one side sit a handful of major automotive and
              trucking OEMs that likely represent the largest commercial software opportunities. On the other sits U.S.
              government work, which may be strategically important and technically validating but can also create
              program timing and budget exposure. Public evidence does not disclose NRR, churn, GRR, average contract
              length, procurement friction, or top-customer share. That means the correct diligence conclusion is not
              that concentration is necessarily high, but that concentration cannot be ruled out from public data. Logo
              breadth and cross-sector expansion are positive; the missing denominator is revenue weight.
