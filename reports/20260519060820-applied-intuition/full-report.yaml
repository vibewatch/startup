      - number: '6.2'
        title: Defense and Government Customer Relationships
        blocks:
          - type: paragraph
            body: >
              Defense is the most independently corroborated part of Applied Intuition's customer base. The company's
              own defense page and Army-focused posts describe active work with military autonomy and mission systems,
              but the more important fact is that customer-side and government-side surfaces also mention Applied
              Intuition. Army.mil published an article on the Army partnering with Applied Intuition, and Defense.gov
              later highlighted Secretary of the Army Daniel Driscoll describing how quickly Applied made military
              vehicles fully autonomous for soldier testing. That combination is materially stronger than a standard
              startup logo wall because it shows the relationship from outside the company's own marketing stack.


              Government work also changes the shape of customer quality. A defense customer can validate product
              capability and procurement credibility at a very high level, but public evidence still leaves revenue
              quality opaque. None of the reviewed public sources disclose contract values, ceiling amounts, option
              years, program scope, or renewal mechanics for Army or Air Force work. So the defense relationships
              improve confidence that Applied can sell mission-critical systems, but they do not eliminate concentration
              or procurement-cycle risk. They diversify the customer base by end market while introducing a separate
              dependence on government budgets and program timing.
