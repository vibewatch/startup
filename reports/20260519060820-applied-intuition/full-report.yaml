        - Core operating KPIs needed for valuation support are absent from public sources
        - Profitability and triple-digit growth claim are directionally positive but incomplete
      - - Valuation pace
        - high
        - Price moved from $6B to $15B in roughly one year before expanded KPI disclosure
        - Investor quality and profitability language partially explain willingness to pay
      - - Founder dilution and governance unknown
