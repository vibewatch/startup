      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Leadership remains heavily founder-shaped. Qasar Younis is the CEO and public face of the business, with a
              background spanning Google and Y Combinator, while Balasubramanian Narayanan served as co-founder and
              founding CTO, anchoring the company’s early technical architecture. Public materials indicate Peter Ludwig
              is the current CTO, suggesting the engineering organization has broadened beyond the original founding
              structure as the company scaled. Applied Intuition also pulled high-profile automotive operators into its
              orbit during the 2020 Series D, including former GM CEO Rick Wagoner and former Daimler CEO Dieter Zetsche
              as advisory figures. That combination gives the company unusual automotive credibility, but it does not
              eliminate governance opacity: the company is private, does not publish a full current board roster or
              ownership map, and still appears meaningfully dependent on a small number of senior leaders for investor
              relationships, OEM trust, and strategic direction.
