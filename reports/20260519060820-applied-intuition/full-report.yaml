  - id: FR003
    title: AV sector failure timeline
    type: timeline
    layout: wide
    summary: Sector history shows repeated shutdowns, restructurings, and strategic absorptions before mass commercialization.
    data:
      items:
        - label: Waymo v. Uber settlement
          date: '2018-02-09'
          detail: Trade-secret dispute ends in a large settlement and highlights IP fragility in autonomy
          tone: warning
          claimRefs:
            - CR015
            - CR036
        - label: Zoox acquired by Amazon
          date: '2020-06-26'
          detail: A technically credible AV company exits into a strategic parent instead of scaling independently
          tone: neutral
          claimRefs:
            - CR036
        - label: Argo AI shutdown
          date: '2022-10-26'
          detail: Ford and Volkswagen-backed program winds down despite deep-pocketed sponsors
          tone: negative
          claimRefs:
            - CR032
        - label: Embark collapse / asset sale
