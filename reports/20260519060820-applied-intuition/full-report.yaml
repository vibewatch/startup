            body: >-
              Public evidence is sufficient to show the market is important and growing, but not sufficient to pin down
              Applied Intuition's exact share, segment mix, or revenue capture. Investors should request pipeline,
              win-rate, pricing, and defense-contract detail before treating the $3B SOM lens as more than a rough
