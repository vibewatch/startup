        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Applied Intuition’s capital history shows a rapid climb from an early seed-scale round into one of the
              most richly valued private autonomy software companies. Publicly accessible evidence points to an
              approximately $2 million 2017 seed/Series A, a roughly $40 million Series B in 2018, a $125 million Series
              C in 2019, and a $175 million Series D in 2020 at a $3.6 billion valuation. The company then disclosed a
              $250 million Series E at a $6 billion valuation and later a Series F valuing the business at $15 billion
              with BlackRock and Kleiner Perkins as lead names, plus Fidelity and Lux Capital participation. The
              investor progression is strategically important: earlier venture backers such as Andreessen Horowitz,
              General Catalyst, Lux Capital, Elad Gil, BOND, and Coatue are now joined by global asset managers and
              blue-chip franchise investors. Total capital raised is best treated as an estimate of roughly $1.5 billion
              or more because exact early-round sizing and the latest round’s cash amount are not fully disclosed in
              accessible public sources.
