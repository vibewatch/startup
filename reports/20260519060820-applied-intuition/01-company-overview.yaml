company:
  name: "Applied Intuition"

chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Applied Intuition is a private Sunnyvale-based autonomy software company founded in 2017 that provides simulation,
    testing, validation, and vehicle-software infrastructure for automotive and defense customers. The company says it
    now serves 17 of the top 20 global automotive OEMs, employs 1,000+ engineers across a global footprint, and most
    recently reached a $15 billion valuation in its latest BlackRock and Kleiner Perkins-led financing.

sections:
  - id: identity-and-mission
    title: "Identity and Mission"
    body: |
      Applied Intuition, Inc. was founded in 2017 in Sunnyvale, California, by Qasar Younis and Balasubramanian Narayanan to build the software infrastructure needed to develop autonomous and increasingly software-defined vehicles. The company now describes its mission in broader terms as “physical AI that moves the world,” signaling that it wants to be understood not merely as a simulation vendor but as a core operating layer for cars, trucks, defense systems, and eventually other robotic platforms. Its product stack centers on Self-Driving System (SDS), Vehicle OS, and tools for vehicle intelligence, with recurring emphasis on simulation, testing, data workflows, and safety validation. That positioning matters because it places Applied Intuition in a high-leverage part of the value chain: instead of betting on one vehicle program, it sells enabling infrastructure that can be reused across many programs, customers, and vehicle classes.
    claimRefs: [CO001, CO002, CO003, CO004, CO040]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: leadership-and-governance
    title: "Leadership and Governance"
    body: |
      Leadership remains heavily founder-shaped. Qasar Younis is the CEO and public face of the business, with a background spanning Google and Y Combinator, while Balasubramanian Narayanan served as co-founder and founding CTO, anchoring the company’s early technical architecture. Public materials indicate Peter Ludwig is the current CTO, suggesting the engineering organization has broadened beyond the original founding structure as the company scaled. Applied Intuition also pulled high-profile automotive operators into its orbit during the 2020 Series D, including former GM CEO Rick Wagoner and former Daimler CEO Dieter Zetsche as advisory figures. That combination gives the company unusual automotive credibility, but it does not eliminate governance opacity: the company is private, does not publish a full current board roster or ownership map, and still appears meaningfully dependent on a small number of senior leaders for investor relationships, OEM trust, and strategic direction.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO032, CO034]
    tableRefs: [TO002]
    figureRefs: []

  - id: funding-history-and-capital-structure
    title: "Funding History and Capital Structure"
    body: |
      Applied Intuition’s capital history shows a rapid climb from an early seed-scale round into one of the most richly valued private autonomy software companies. Publicly accessible evidence points to an approximately $2 million 2017 seed/Series A, a roughly $40 million Series B in 2018, a $125 million Series C in 2019, and a $175 million Series D in 2020 at a $3.6 billion valuation. The company then disclosed a $250 million Series E at a $6 billion valuation and later a Series F valuing the business at $15 billion with BlackRock and Kleiner Perkins as lead names, plus Fidelity and Lux Capital participation. The investor progression is strategically important: earlier venture backers such as Andreessen Horowitz, General Catalyst, Lux Capital, Elad Gil, BOND, and Coatue are now joined by global asset managers and blue-chip franchise investors. Total capital raised is best treated as an estimate of roughly $1.5 billion or more because exact early-round sizing and the latest round’s cash amount are not fully disclosed in accessible public sources.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO030, CO041, CO042, CO045]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: business-milestones
    title: "Business Milestones"
    body: |
      Applied Intuition’s milestone record shows the company expanding from AV development tooling into a broader autonomy infrastructure platform. Financing milestones are only part of the story. The company won a notable commercial-vehicle validation when PACCAR selected it for autonomous trucking development, later added independent evidence via Volvo Group, and publicly highlighted partnerships with Volkswagen, Toyota, GM, and Hyundai. In August 2023, it acquired Embark’s assets at a $71 million equity value, gaining distressed but strategically useful trucking assets and data after a sector failure. The company has also emphasized defense momentum, including the U.S. Army and broader positioning toward U.S. military autonomy use cases. The OpenAI partnership is the clearest recent strategic signal: together with the latest financing, it suggests Applied Intuition wants investors and customers to view it less as a point-tool vendor and more as a foundational software layer for physical AI deployment.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO036, CO046]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: scale-and-global-footprint
    title: "Scale and Global Footprint"
    body: |
      The current company snapshot is notable for breadth even though core financial metrics remain private. Applied Intuition says it has 1,000+ engineers, including 40 former CTOs and 30 former founders, and lists offices across North America, Europe, and Asia to support multinational OEM programs. Its customer page claims penetration into 17 of the top 20 global automotive OEMs, while public references extend into trucking and defense via PACCAR, Volvo Group, and the U.S. Army. Taken together, those signals imply infrastructure-scale relevance inside the vehicle software stack. At the same time, the available public evidence still leaves major diligence holes. Revenue, ARR, gross margin, customer concentration, and profitability are undisclosed, which means valuation underwriting depends disproportionately on scale proxies such as hiring density, partner logos, investor quality, and milestone announcements rather than audited operating performance.
    claimRefs: [CO005, CO006, CO007, CO008, CO031, CO033, CO035, CO039, CO043, CO044]
    tableRefs: []
    figureRefs: []

