callouts:
  - calloutType: strength
    title: "Deep OEM penetration is the core strategic asset"
    body: "Applied Intuition's claim that it serves 17 of the top 20 global automotive OEMs is supported by a broad set of named public partner references across passenger auto and trucking. Even if some programs are pilots or tooling deployments rather than full production revenue, the company appears embedded across much of the industry's autonomy and software-defined-vehicle roadmap."
    claimRefs: [CO007, CO021, CO022, CO039, CO044]

  - calloutType: risk
    title: "Private-company opacity limits underwriting quality"
    body: "The public record gives strong visibility into financing rounds, headline valuation, and selected customer logos, but not into revenue, ARR, gross margin, burn, or customer concentration. That makes it difficult to determine how much of the $15B valuation rests on repeatable software economics versus strategic-option value."
    claimRefs: [CO018, CO031, CO033, CO035]

  - calloutType: insight
    title: "BlackRock plus OpenAI reframes the story as physical-AI infrastructure"
    body: "The latest financing and the OpenAI partnership together change how Applied Intuition is best understood. Rather than remaining only an AV simulation vendor, the company is increasingly presenting itself as a foundational software and systems layer for physical AI deployment across automotive, trucking, and defense."
    claimRefs: [CO017, CO029, CO030, CO040]

  - calloutType: risk
    title: "Founder and key-person dependency remains meaningful"
    body: "Qasar Younis remains the public and strategic center of gravity, while technical credibility still appears concentrated among a small senior leadership bench. A disruption affecting the CEO or top product/engineering leadership would likely have outsized effects on recruiting, investor confidence, and customer trust."
    claimRefs: [CO009, CO011, CO034]

  - calloutType: risk
    title: "Embark shows autonomy-sector consolidation risk"
    body: "The Embark asset purchase added useful trucking assets, but it also underlines that the autonomy market has produced notable failures. Applied Intuition has so far been a consolidator rather than a casualty, yet the sector backdrop remains volatile and capital intensive."
    claimRefs: [CO019, CO036, CO046]

