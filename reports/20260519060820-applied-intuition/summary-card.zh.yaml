summary:
  headline: |
    Applied Intuition 是自动驾驶开发基础设施里占主导地位的私营平台，深度打入 OEM，并在国防业务上扩张；基于现有证据，$15B 估值偏高，但若未披露收入能证实其声称的盈利能力和三位数增长轨迹，这个估值仍可辩护。
