company:
  name: Applied Intuition
chapter:
  number: 4
  title: Financials
  summary: >
    Applied Intuition has raised an estimated $1.5B+ across six funding rounds reaching a $15B
    valuation in 2025, claims profitability with triple-digit YoY growth, yet discloses no revenue
    or margin data; the BlackRock and OpenAI participation signals a strategic pivot to physical AI
    infrastructure, while private financial opacity remains the primary diligence risk.

sections:
  - id: funding-history-and-capital-structure
    title: Funding History and Capital Structure
    body: |
      Applied Intuition's financing history is best understood as a sequence of increasingly strong validation points rather than a clean set of fully disclosed rounds. Public evidence supports a small 2017 Andreessen Horowitz-backed Series A, an approximately $40 million 2018 Series B led by General Catalyst, a $125 million 2019 Series C that brought total disclosed funding to roughly $175 million, a $175 million 2020 Series D at a $3.6 billion valuation, a $250 million 2024 Series E at a $6 billion valuation, and a 2025 Series F priced at a $15 billion valuation. The important caveat is disclosure quality. Exact Series A, Series B, and Series F cash proceeds are not fully public, so cumulative funds raised should remain an estimate of roughly $1.5 billion or more rather than a hard fact.

      That ambiguity matters for underwriting because valuation signals are much clearer than cash-flow signals. SEC EDGAR Form D search results indicate that Applied Intuition used private-placement filings for at least some financings, but those notices do not substitute for audited financial statements, detailed cap-table disclosure, or a current cash balance. The company therefore presents a capital structure that appears very well funded but still difficult to model for dilution, remaining liquidity, and ownership concentration.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI001]
    figureRefs: [FI001, FI004]

  - id: key-investors-and-strategic-significance
    title: Key Investors and Strategic Significance
    body: |
      The investor roster is now strategically more important than the raw amount raised. Lux Capital appears as one of the most durable supporters across multiple rounds, while Andreessen Horowitz and General Catalyst anchored the early institutional story. The 2024 round added Porsche Investments, which matters because it is easier to interpret as a strategic automotive vote of confidence than a purely financial check. The 2025 round matters even more: BlackRock, Kleiner Perkins, Fidelity, and Lux together indicate that Applied Intuition is no longer funded only like a specialist autonomy-tool startup. It is being financed as a broader infrastructure asset with crossover and institutional appeal.

      The OpenAI partnership announced alongside the latest financing sharpens that interpretation. It suggests investors are underwriting a platform that could extend beyond simulation into a broader physical-AI software layer for cars, trucks, defense systems, and other machines. That does not eliminate diligence questions; it increases them. Investors still need ownership percentages, board or observer rights, pro-rata terms, secondary-sale history, and expected exit horizons for the newest capital providers.
    claimRefs: [CI011, CI012, CI013, CI014, CI034, CI037, CI041]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: financial-performance-and-disclosed-metrics
    title: Financial Performance and Disclosed Metrics
    body: |
      Applied Intuition discloses very little conventional operating data for a company carrying a $15 billion valuation. The strongest positive fact in public materials is management's statement in the Series E post that the company is profitable and growing at a sustainable triple-digit percentage year-over-year rate. If accurate, that combination is unusual for a capital-intensive autonomy-adjacent software company and helps explain why investors were willing to finance the business at a much higher price in the following round. Public scale proxies also exist: the company says it has 1,000+ engineers and serves 17 of the top 20 global automotive OEMs.

      But those signals do not solve the core underwriting problem. Revenue, ARR, gross margin, cash balance, customer concentration, NRR, and burn rate are all absent from reviewed public sources. PitchBook and CB Insights help frame valuation and funding history, but neither closes the gap on audited revenue quality or margin path. As a result, Applied Intuition looks like a strong private software infrastructure company on narrative and investor quality, yet remains unusually opaque on the exact metrics needed to support a detailed financial model.
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI035, CI036, CI042]
    tableRefs: [TI002]
    figureRefs: [FI003]

  - id: embark-acquisition-and-mna-strategy
    title: Embark Acquisition and M&A Strategy
    body: |
      The Embark acquisition is financially important for two reasons. First, it was a distressed asset purchase, not a conventional premium-growth acquisition. Applied Intuition announced a transaction valued at roughly $71 million in stock and then announced completion on August 2, 2023. Public materials frame the deal as a way to acquire useful trucking software, data, and personnel after a sector failure rather than as a move to buy revenue at scale. That matters because it implies Applied could expand product scope without committing large amounts of cash at a moment when many autonomy companies were struggling to finance commercialization.

      Second, Embark is also the clearest adverse signal in this chapter. Proxy and investor materials from Embark show that even a public, venture-backed AV trucking company could not sustain itself through the commercialization gap. For Applied Intuition, the positive reading is that it bought strategic assets cheaply. The negative reading is that the surrounding market remains unforgiving, and that Applied's own valuation must be judged against a sector that has already produced prominent capital-destruction examples.
    claimRefs: [CI022, CI023, CI024, CI025, CI026, CI032, CI033]
    tableRefs: []
    figureRefs: []

  - id: financial-risk-profile-and-capital-efficiency
    title: Financial Risk Profile and Capital Efficiency
    body: |
      The principal financial risk is not obvious insolvency; it is valuation and disclosure mismatch. Applied Intuition's public valuation went from $3.6 billion in 2020 to $6 billion in 2024 and then to $15 billion in 2025, but public KPI disclosure did not expand at the same pace. The latest financing is much easier to corroborate on valuation and investor names than on exact cash amount or current operating results. That does not mean the company is weak. It means outside investors are being asked to underwrite a premium price mostly from investor quality, partner proof, profitability language, and scale proxies rather than from a full operating-data package.

      Capital-efficiency comparison therefore has to be approximate. Applied appears more software-like than a company such as Aurora in disclosure style, yet more capitalized than many pure tools vendors because cumulative funding is estimated at roughly $1.5 billion or more. The right conclusion is not that the company is overvalued by definition. It is that underwriting still requires private diligence on exact Series F cash proceeds, customer concentration, NRR, board rights, dilution, cash balance, and the next-round trigger despite the strength of the public narrative.
    claimRefs: [CI027, CI028, CI029, CI030, CI031, CI038, CI039, CI040, CI041, CI042]
    tableRefs: [TI004, TI005]
    figureRefs: []

