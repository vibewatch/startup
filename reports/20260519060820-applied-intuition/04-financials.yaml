callouts:
  - calloutType: risk
    title: Public KPI opacity is the central underwriting issue
    body: Applied Intuition's valuation and investor roster are easier to verify than its operating results. Revenue, ARR, gross margin, cash balance, concentration, and NRR are all still missing from reviewed public evidence.
    claimRefs: [CI017, CI018, CI019, CI036, CI042]

  - calloutType: strength
    title: Profitability plus triple-digit growth is a rare signal if accurate
    body: The Series E statement that Applied Intuition is profitable and growing at a sustainable triple-digit percentage year over year is unusually strong for an autonomy-adjacent infrastructure company and helps explain later valuation support.
    claimRefs: [CI015, CI016, CI027]

  - calloutType: insight
    title: The latest round looks like a physical-AI platform bet
    body: BlackRock, Kleiner Perkins, Fidelity, and OpenAI together make the latest financing look broader than an automotive simulation round. The capital base is being positioned around physical-AI infrastructure.
    claimRefs: [CI012, CI014, CI034, CI037]

  - calloutType: risk
    title: Embark shows how unforgiving the AV capital cycle can be
    body: Applied Intuition likely bought strategic assets from Embark at an attractive price, but the transaction also reminds investors that well-funded AV companies can still fail before commercialization produces durable economics.
    claimRefs: [CI022, CI025, CI026]

