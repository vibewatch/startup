callouts:
  - calloutType: strength
    title: Full-stack breadth is the core moat
    body: Applied Intuition's best competitive defense is not one feature; it is the ability to span simulation, data, validation,
      SDS, Vehicle OS, and defense use cases inside one account. That is a stronger position than any direct point-tool vendor appears
      to offer publicly.
    claimRefs: [CP009, CP024, CP035]

  - calloutType: insight
    title: OEM penetration matters more than point-feature parity
    body: The company-claimed 17-of-top-20 OEM footprint is strategically important because automotive buyers often default to
      known suppliers. Distribution and workflow incumbency may matter more than any one simulator benchmark.
    claimRefs: [CP016, CP027, CP028]

  - calloutType: risk
    title: CARLA and data vendors can compress pricing without replacing the full stack
    body: Applied does not need to lose an account entirely to face competitive damage. Free open-source tools and adjacent data
      platforms can cap price realization, slow standardization, and keep customers multi-homed.
    claimRefs: [CP011, CP013, CP030, CP031, CP038]

  - calloutType: recommendation
    title: Underwrite on replacement evidence, not branding
    body: Before underwriting moat durability, request named examples where Applied displaced dSPACE-class incumbents, expanded from
      one workflow into several, and won despite CARLA or data-platform alternatives being available.
    claimRefs: [CP027, CP030, CP037, CP038]

