companyProfile:
  summary: >
    Applied Intuition, Inc. (founded 2017, Sunnyvale CA) is a private technology company
    that builds the software infrastructure for autonomous and intelligent vehicles. Its
    products—simulation tools (Simian), a data management platform (Spectral), a full
    Self-Driving System (SDS), and Vehicle OS—are used by automotive OEMs, commercial
    trucking companies, and the US Department of Defense. The company claims to supply
    17 of the top 20 global automotive OEMs and has confirmed defense customers in the
    US Army and Air Force. Following its Series F at a $15 billion valuation co-led by
    BlackRock and Kleiner Perkins, Applied Intuition also announced a strategic partnership
    with OpenAI, positioning itself as a Physical AI infrastructure company.
  foundedDate: "2017-01-01"
  founders:
    - name: "Qasar Younis"
      role: "Co-Founder & CEO"
      background: "Former Partner at Y Combinator; previously at Google."
      claimRefs: [CO001, CO009]
    - name: "Balasubramanian Narayanan"
      role: "Co-Founder & Founding CTO"
      background: "Former Google engineer; founding technical lead at Applied Intuition."
      claimRefs: [CO001, CO010]
  foundingLocation: "Sunnyvale, CA"
  headquarters: "Sunnyvale, CA"
  productSummary: >
    Applied Intuition sells a suite of autonomous vehicle development tools (simulation,
    data management, safety validation) bundled with a full-stack Self-Driving System (SDS)
    and Vehicle OS for production deployment. Its Physical AI platform includes MCP-ready
    agentic interfaces for AI-driven development workflows.
  customerFocus: >
    Automotive OEMs (passenger cars and trucks), commercial trucking companies, US defense
    agencies (Army, Air Force), and AV/mobility startups.
  businessModel: >
    Enterprise software licensing (simulation, data management, OS, SDS), professional
    services for OEM integration, and defense program contracts. Management claims the
    business is profitable with triple-digit percentage year-over-year growth.
  stage: "Series F (Private)"
  fundingStatus: >
    Series F at $15B valuation (2025), co-led by BlackRock and Kleiner Perkins with
    participation from Fidelity and Lux Capital. Estimated total raised ~$1.5B+.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO017, CO018]
summary:
  headline: >
    Applied Intuition is the dominant private platform for autonomous vehicle development
    infrastructure, with deep OEM penetration and a growing defense franchise; its $15B
    valuation is stretched on available evidence but defensible if undisclosed revenue
    confirms the claimed profitability and triple-digit growth trajectory.
