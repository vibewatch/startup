- id: legal-and-liability-risks
  title: Legal and Liability Risks
  body: |-
    Applied Intuition's legal risk is fundamentally about where responsibility lands once autonomy software moves from development tooling into operational stacks. Greenberg Traurig's 2026 liability review makes the core point clearly: absent a dedicated federal liability statute, AV crashes still flow back into patchwork state law, negligence claims, and product-liability theories. That matters because Applied is no longer just a simulator vendor in its own public narrative; it now talks about Vehicle OS, SDS, defense autonomy, and physical-AI workflows that can sit much closer to customer deployment. In a serious crash, plaintiffs do not need a public-company-style disclosure trail to name every plausible defendant. OEMs, ADS vendors, remote operators, software suppliers, and component partners can all end up in the same case while courts sort allocation.

    The IP and enforcement side also deserves weight. The Waymo v. Uber trade-secret case remains a durable reminder that autonomy software is litigated at high dollar values when former employees, model know-how, or proprietary development tools are in dispute. Applied has no publicly identified AV-incident lawsuit or government consent order in the reviewed sources, which is better than having disclosed litigation, but that absence does not remove the risk. Husch Blackwell's summary of the closed Waymo investigation shows regulators can spend extended periods investigating safety questions before closing without systemic findings. Meanwhile, export-control exposure is not a one-time box-check: BIS and Trade.gov both describe continuing licensing, screening, and end-use review obligations under the EAR, and defense programs can raise similar restrictions on data sharing, foreign-national access, and technology transfer. For a company trying to serve both global OEMs and U.S. defense buyers, the legal perimeter can expand faster than revenue disclosure.
  claimRefs:
  - CR011
  - CR012
