  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: litigation-history
    missingEvidence: No public docket-level review confirms whether Applied has ever been named in customer indemnity disputes, pre-litigation demand matters, or sealed/autonomy-adjacent claims that never reached press coverage.
    whyItMatters: Public silence is not the same as zero legal exposure; hidden dispute history would change how investors think about reserve needs and contract risk allocation.
    diligencePath: Request litigation and claims schedules, outside-counsel summaries, and insurance-loss runs in formal diligence.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: material
    topic: export-control-compliance
    missingEvidence: The public record does not disclose Applied's product-classification matrix, DDTC registration status, license history, denied jurisdictions, or foreign-national access controls for defense programs.
    whyItMatters: Export-control readiness determines how broadly Applied can serve global OEMs and defense buyers without creating delivery or hiring bottlenecks.
    diligencePath: Ask for EAR/ITAR classifications by product, export-control policies, denied-party screening procedures, and any external compliance opinions.
    relatedQuestionRefs:
    - QR009
    - QR027
    - QR028
  - type: private-evidence-only
    severity: material
    topic: dod-contract-vehicles
    missingEvidence: Public sources do not reveal the specific DoD contract vehicles, clearance environments, option-year structures, or recompete schedules attached to Applied's defense work.
    whyItMatters: Without program-level detail, investors cannot judge how sticky defense revenue is or how quickly a budget or procurement change could hit bookings.
    diligencePath: Request program-by-program revenue, contract vehicle documentation, classified/unclassified split, and recompete calendars.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: blocking
    topic: customer-economics-opacity
    missingEvidence: No public source reviewed for this chapter discloses revenue, ARR, gross margin, NRR, top-customer concentration, or contract duration for Applied Intuition.
    whyItMatters: This is the single largest blocker to underwriting whether the company's diversification story is economically real or mainly narrative and logo-based.
    diligencePath: Obtain segment revenue, top-10 customer exposure, cohort retention, gross-margin bridge, and contract term data in formal diligence.
    relatedQuestionRefs:
    - QR023
    - QR024
    - QR030
  - type: missing-source
    severity: minor
    topic: europe-china-specificity
    missingEvidence: Public evidence is directionally strong on cross-border regulatory divergence but thin on a source-by-source map of how much Applied revenue is exposed to UNECE-specific or China-specific compliance constraints.
    whyItMatters: Regional exposure determines whether these risks are strategic edge cases or material near-term revenue constraints.
    diligencePath: Request regional pipeline and revenue mix, including China-related restrictions, EEA homologation programs, and export-controlled defense opportunities.
    relatedQuestionRefs:
    - QR007
    - QR028
