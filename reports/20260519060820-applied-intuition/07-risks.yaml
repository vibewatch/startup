  claims:
  - id: CR001
    statement: NHTSA's federal AV policy remains guidance-heavy rather than a binding federal certification mandate for autonomous-vehicle deployment.
    type: third-party-reported
    topic: regulatory-structure
    sourceRefs:
    - SR001
    - SR004
    confidence: medium
    freshness: current
  - id: CR002
    statement: CRS and NCSL both indicate that autonomous-vehicle governance is still split across federal and state layers, leaving material state-by-state fragmentation in testing, licensing, insurance, and operations.
    type: third-party-reported
    topic: state-fragmentation
    sourceRefs:
    - SR004
    - SR008
    confidence: high
    freshness: current
  - id: CR003
    statement: The continued relevance of H.R. 3935 and related federal AV legislation underscores that Congress has not yet settled a comprehensive national framework for driverless systems.
    type: third-party-reported
    topic: federal-legislation
    sourceRefs:
    - SR005
    - SR017
    confidence: medium
    freshness: current
  - id: CR004
    statement: NHTSA and related legal commentary show that U.S. AV policy is still evolving through incremental FMVSS updates and rulemakings rather than through one complete autonomous-vehicle approval regime.
    type: inferred
    topic: rulemaking-path
    sourceRefs:
    - SR006
    - SR015
    - SR016
    confidence: medium
    freshness: current
  - id: CR005
    statement: FMCSA's 2023 SANPRM confirms that the agency is still considering how to amend motor-carrier rules for ADS-equipped commercial vehicles, so trucking compliance costs and timing remain unsettled.
    type: third-party-reported
    topic: trucking-regulation
    sourceRefs:
    - SR007
    - SR004
    confidence: high
    freshness: current
  - id: CR006
    statement: For a vendor like Applied Intuition, the U.S. framework remains materially different from Europe's more type-approval-oriented approach, increasing cross-region compliance complexity for global OEM programs.
    type: inferred
    topic: us-eu-divergence
    sourceRefs:
    - SR004
    - SR015
    - SR017
    confidence: medium
    freshness: current
  - id: CR007
    statement: NIST's AI Risk Management Framework is still voluntary, but the 2026 critical-infrastructure profile shows it is becoming a more concrete reference point for safety-sensitive AI procurement.
    type: third-party-reported
    topic: ai-governance
    sourceRefs:
    - SR009
    - SR012
    confidence: medium
    freshness: current
  - id: CR008
    statement: BIS and Trade.gov make clear that U.S. export controls on software and technology are recurring licensing and screening obligations, not a one-time classification exercise.
    type: third-party-reported
    topic: export-controls
    sourceRefs:
    - SR010
    - SR011
    confidence: high
    freshness: current
  - id: CR009
    statement: FAR and DFARS add procurement, foreign-acquisition, privacy, and data-rights burdens to defense software programs, raising the compliance load on Applied's defense business.
    type: inferred
    topic: defense-procurement
    sourceRefs:
    - SR012
    - SR013
    confidence: medium
    freshness: current
  - id: CR010
    statement: China-related market access for advanced autonomy software is likely harder than Western-market deployment because export-control scrutiny and local regulatory expectations can both constrain delivery models.
    type: inferred
    topic: china-risk
    sourceRefs:
    - SR010
    - SR011
    - SR004
    confidence: low
    freshness: current
  - id: CR011
    statement: Absent a dedicated federal AV liability statute, autonomous-vehicle crashes still default to patchwork state law and conventional tort and product-liability theories.
    type: third-party-reported
    topic: liability-framework
    sourceRefs:
    - SR014
    - SR004
    confidence: high
    freshness: current
  - id: CR012
    statement: In Level 4-style deployments, OEMs, ADS providers, remote operators, and component suppliers can all be named in litigation, so a software stack vendor like Applied could be pulled into multi-defendant suits.
    type: third-party-reported
    topic: multi-defendant-liability
    sourceRefs:
    - SR014
    - SR019
    confidence: medium
    freshness: current
  - id: CR013
    statement: Applied's public expansion from tooling into Vehicle OS, SDS, and defense autonomy increases its potential legal exposure relative to a narrower simulation-only vendor.
    type: inferred
    topic: scope-expansion
    sourceRefs:
    - SR014
    - SR026
    - SR034
    confidence: medium
