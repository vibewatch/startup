company:
  name: Applied Intuition
chapter:
  number: 6
  title: Customers
  summary: >
    Applied Intuition claims relationships with 17 of the top 20 global automotive OEMs and
    confirmed defense customers including the U.S. Army and Air Force, with named partners including
    Toyota, Volkswagen Group, GM, Hyundai, PACCAR, and Volvo Group; however, the depth of most OEM
    relationships (POC vs. production deployment) is not publicly disclosed, creating a material
    diligence gap around customer concentration and revenue quality.

sections:
  - id: customer-overview-and-oem-penetration
    title: Customer Overview and OEM Penetration
    body: |
      Applied Intuition's public customer story is strongest on breadth and weakest on named-account depth. The company continues to point investors and customers to a broad assertion that it serves 17 of the top 20 global automotive OEMs, and its public surfaces name Toyota, Volkswagen Group, General Motors, and Hyundai as specific automotive references. That matters because it implies the company has reached most of the global passenger-vehicle buying set that matters for simulation, validation, and autonomy tooling. It also suggests Applied has become embedded enough in automotive software workflows to win mindshare across North America, Europe, and Asia rather than only in one regional engineering market.

      The diligence problem is that breadth is not the same as depth. Public sources do not identify the remaining OEMs inside the 17-of-20 claim, do not map whether those relationships are pilot programs or production-scale toolchains, and do not disclose which accounts generate meaningful recurring software revenue. The result is a customer story that is clearly real, but only partially legible. Public logo proof supports strong market penetration; it does not yet reveal the ACV, renewal durability, or production attachment needed to underwrite customer quality with confidence.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU024, CU026, CU031, CU032, CU035]
    tableRefs: [TU001]
    figureRefs: [FU004, FU005]

  - id: defense-and-government-customer-relationships
    title: Defense and Government Customer Relationships
    body: |
      Defense is the most independently corroborated part of Applied Intuition's customer base. The company's own defense page and Army-focused posts describe active work with military autonomy and mission systems, but the more important fact is that customer-side and government-side surfaces also mention Applied Intuition. Army.mil published an article on the Army partnering with Applied Intuition, and Defense.gov later highlighted Secretary of the Army Daniel Driscoll describing how quickly Applied made military vehicles fully autonomous for soldier testing. That combination is materially stronger than a standard startup logo wall because it shows the relationship from outside the company's own marketing stack.

      Government work also changes the shape of customer quality. A defense customer can validate product capability and procurement credibility at a very high level, but public evidence still leaves revenue quality opaque. None of the reviewed public sources disclose contract values, ceiling amounts, option years, program scope, or renewal mechanics for Army or Air Force work. So the defense relationships improve confidence that Applied can sell mission-critical systems, but they do not eliminate concentration or procurement-cycle risk. They diversify the customer base by end market while introducing a separate dependence on government budgets and program timing.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU030, CU034]
    tableRefs: []
    figureRefs: []

  - id: commercial-trucking-and-specialty-vehicle-customers
    title: Commercial Trucking and Specialty Vehicle Customers
    body: |
      Commercial trucking provides some of Applied Intuition's clearest customer proof outside passenger-car OEMs. PACCAR publicly selected Applied Intuition for autonomous truck development in 2020, giving the company customer-side validation from a major commercial-vehicle manufacturer. Volvo Group later published its own partnership announcement, adding a second heavy-vehicle reference that does not depend on Applied-authored marketing alone. Those two accounts matter because they show that Applied's customer proof extends beyond software validation labs into freight and industrial fleet operators where autonomy economics are tied to productivity, labor constraints, and uptime rather than only ADAS feature development.

      Current vertical pages broaden the picture further. Applied now markets dedicated trucking, mining, agricultural, and construction autonomy solutions, and its trucking and mining pages include named quotes from Isuzu and Komatsu. That signals real go-to-market expansion into specialty fleets and industrial autonomy. At the same time, the public evidence remains uneven. These pages show that Applied can win reference accounts across new vehicle classes, but they still do not disclose contract values, fleet counts, deployment scale, or whether the relationship is a pilot, platform standard, or long-term recurring software program. Nuro appears as a historical case-study reference, but the live customer-post URL no longer resolves, which weakens freshness and proof depth.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU029, CU035, CU038, CU039]
    tableRefs: [TU002]
    figureRefs: [FU001]

  - id: customer-concentration-and-revenue-dependency-analysis
    title: Customer Concentration and Revenue Dependency Analysis
    body: |
      Applied Intuition's public customer roster suggests broad logo diversification, but the revenue picture could still be concentrated. In practice, the highest-value relationships are likely a relatively small subset of global OEM platforms, heavy-vehicle programs, and defense accounts. That is common in enterprise infrastructure businesses: one customer logo can represent a narrow evaluation license, while another can represent a multi-program deployment with much larger annual value. Public materials do not disclose that distribution. As a result, investors should not assume that 17-of-20 OEM breadth translates into evenly distributed revenue or low concentration risk.

      The most plausible concentration pattern is a barbell. On one side sit a handful of major automotive and trucking OEMs that likely represent the largest commercial software opportunities. On the other sits U.S. government work, which may be strategically important and technically validating but can also create program timing and budget exposure. Public evidence does not disclose NRR, churn, GRR, average contract length, procurement friction, or top-customer share. That means the correct diligence conclusion is not that concentration is necessarily high, but that concentration cannot be ruled out from public data. Logo breadth and cross-sector expansion are positive; the missing denominator is revenue weight.
    claimRefs: [CU024, CU025, CU026, CU027, CU028, CU030, CU036, CU037, CU040]
    tableRefs: [TU004]
    figureRefs: [FU002]

  - id: evidence-quality-and-diligence-gaps
    title: Evidence Quality and Diligence Gaps
    body: |
      The best customer evidence in this chapter comes from sources where Applied Intuition is not the only narrator. PACCAR investor relations, Volvo Group, Army.mil, and Defense.gov all provide outside confirmation that Applied has real customer or program relationships. Those sources substantially improve confidence in trucking and defense accounts. By contrast, the passenger-car OEM story is still driven primarily by Applied-authored pages and partnership announcements. That is still useful evidence, but it is lower-quality proof than a customer-issued case study, procurement filing, or independently reported production deployment. The 17-of-top-20 OEM figure is directionally impressive, yet it remains an aggregate claim anchored to older public materials rather than a fresh 2026 named-account disclosure.

      The main diligence gaps therefore cluster around contract depth, not around whether Applied has customers at all. Investors still need a current named-account list, top-customer concentration by ARR or ACV, renewal schedules, production-vs-pilot status for each major OEM, and detailed contract terms for Army and Air Force work. They also need a live, fresh customer-proof source for Nuro or confirmation that the relationship has lapsed from public marketing. In short, public evidence is strong enough to support a real-customer conclusion, but not yet strong enough to fully underwrite revenue durability or concentration risk.
    claimRefs: [CU014, CU022, CU024, CU025, CU026, CU030, CU031, CU032, CU036, CU037, CU040]
    tableRefs: [TU003]
    figureRefs: [FU003]

