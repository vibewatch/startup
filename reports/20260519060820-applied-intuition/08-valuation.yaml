chapter:
  number: 8
  title: Valuation
  summary: |-
    Applied Intuition's 15 billion dollar Series F valuation rests on an undisclosed revenue base, a stated profitability claim, and a BlackRock plus OpenAI strategic endorsement. Comparable analysis against Mobileye, Scale AI, and public autonomy peers suggests the multiple is stretched absent roughly 500 million dollars or more of ARR, but the defense infrastructure thesis and potential platform franchise could justify the premium if disclosed financials support it.
sections:
- id: valuation-history-and-market-context
  title: Valuation History and Market Context
  body: |-
    Applied Intuition has moved from a late-stage automotive tooling startup into a much broader physical-AI narrative, and the valuation trajectory reflects that repositioning. Public round data points are clear at the back end of the history: Series D in 2020 was reported at 175 million dollars raised and a 3.6 billion dollar valuation, the October 2024 round was reported at 250 million dollars and 6 billion dollars, and the latest Series F was widely reported at 250 million dollars and 15 billion dollars. That means the public valuation mark-up from Series D to the latest round is roughly 4.2 times, with a particularly sharp 2.5 times step-up from 6 billion dollars to 15 billion dollars over roughly a year.

    The harder part is whether market context supports that acceleration. Management tied the latest round to profitability, triple-digit growth, BlackRock support, and an OpenAI partnership, all of which push the story away from a narrow simulation-software multiple and toward a strategic infrastructure framing. Analyst market reports, however, still show that pure AV simulation is only a low-single-digit-billion market today. The valuation therefore requires investors to believe that Applied is monetizing a much wider autonomy stack across automotive and defense rather than simply winning share inside a simulation niche.
