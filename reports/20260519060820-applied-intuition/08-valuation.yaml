- id: comparable-company-analysis
  title: Comparable Company Analysis
  body: |-
    Applied Intuition does not have a perfect public comparable, so valuation discipline depends on triangulation. Mobileye is the cleanest public reference because it is a scaled autonomy and ADAS software platform with public filings and market capitalization; if Applied deserves a Mobileye-like headline value, investors should expect materially more disclosed revenue than public evidence currently shows. Aurora is a useful public counterpoint because it demonstrates how harsh public markets can be on AV stories even when the company has filings, commercialization progress, and public transparency. Scale AI is the most relevant private cross-over comparable because it sits inside the broader AI infrastructure theme and has attracted premium private valuations despite limited public financial detail.

    The rest of the set is informative but imperfect. Waymo is parent-owned and robotaxi-heavy, Waabi and Wayve are earlier and narrower in commercial proof, Palantir is broader and more mature but useful on defense-AI premium, and Luminar reminds investors that hardware-adjacent autonomy names can trade at deep discounts. The key conclusion is not that any single row gives a precise multiple; it is that a 15 billion dollar price sits at the high end of the peer set unless Applied is already much larger and better monetized than public evidence reveals.
  claimRefs:
