  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: A current ARR or revenue run-rate figure broken out by automotive, defense, and other segments.
    whyItMatters: Without a denominator the 15 billion dollar price cannot be converted into a directly testable revenue multiple.
    diligencePath: Request the latest board package, trailing-twelve-month revenue, ARR bridge, and segment mix by product line.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV015
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, and customer retention metrics for the software and defense businesses.
    whyItMatters: Premium software multiples depend on margin quality and retention, not just top-line growth and investor quality.
    diligencePath: Request gross margin by segment, logo and dollar retention, and cohort expansion by major customer class.
    relatedQuestionRefs:
    - QV017
    - QV028
    - QV030
  - type: private-evidence-only
    severity: material
    topic: secondary-pricing
    missingEvidence: Secondary transaction prices, option strike history, and preference stack details across the late-stage rounds.
    whyItMatters: A clean share-price history would show whether the latest round is a true markup or a structure-driven headline value.
    diligencePath: Request cap table detail, recent tender or secondary data, and liquidation preference terms for the last two rounds.
    relatedQuestionRefs:
    - QV003
    - QV028
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable-company-universe
    missingEvidence: A complete comp sheet with daily market caps, growth rates, and revenue bases for every candidate peer.
    whyItMatters: The comparable table is intentionally partial because public and private peers are heterogeneous and valuations move daily.
    diligencePath: Refresh the comp set with market-data terminals and extend it to adjacent software, defense, and autonomy peers.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV011
    - QV027
    relatedTableRefs:
    - TV002
  - type: private-evidence-only
    severity: material
    topic: defense-revenue
    missingEvidence: Named defense contract values, option years, classified versus unclassified revenue, and pipeline conversion assumptions.
    whyItMatters: Defense is one of the main arguments for a premium multiple, so investors need to know whether it is strategic narrative or material revenue.
    diligencePath: Request contract abstracts, backlog, revenue recognition policy, and upcoming recompete schedule for the defense book.
    relatedQuestionRefs:
    - QV018
    - QV021
    - QV025
    - QV030
  - type: private-evidence-only
    severity: material
    topic: product-monetization
    missingEvidence: Booked revenue and deployment counts for vehicle intelligence, self-driving stacks, and simulation usage beyond core OEM tool contracts.
    whyItMatters: The platform thesis only works if new products are monetizing as real recurring revenue rather than broad but low-value experimentation.
    diligencePath: Request product-level ARR, active deployments, attach rates, and expansion history for vehicle OS and related products.
