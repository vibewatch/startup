  topStrengths:
    - 17 of the top 20 global automotive OEMs use Applied Intuition tools, creating a deeply embedded distribution moat.
    - >-
      Confirmed US Army and Air Force defense customers provide sticky government revenue and a classified technology
      moat.
    - >-
      BlackRock and OpenAI co-investment signals a strategic physical AI infrastructure thesis beyond AV simulation
      tools.
    - >-
      Stated profitability with triple-digit YoY growth, if accurate, distinguishes AI from AV sector peers that burned
      capital without revenue.
    - >-
      Full-stack offering (simulation + data + SDS + Vehicle OS) enables deeper OEM integration than point-tool
      competitors.
  topRisks:
    - >-
      Revenue and ARR are not publicly disclosed, making independent valuation assessment at $15B impossible without
      access to financials.
    - >-
      The $15B valuation requires $500M+ ARR or a premium defense/infrastructure multiple that cannot be verified
      externally.
    - >-
      AV sector has seen major failures (Argo AI shutdown, Embark bankruptcy) even with OEM backing; sector timing risk
      remains.
    - >-
      ITAR and export control restrictions limit TAM in China and some international markets; classified software
      creates compliance overhead.
    - Open-source AV simulation (CARLA) applies long-term pricing pressure on simulation tool licensing revenue.
  unresolvedGaps:
    - 'Annual recurring revenue and gross margin: the single most important unknown for valuation underwriting.'
    - 'OEM contract depth: production deployment vs. pilot/POC status for the claimed 17 of 20 OEM relationships.'
    - Series F exact raise amount and post-money cap table with investor governance rights.
    - 'DoD contract vehicles and classified program values: total defense revenue not publicly estimable.'
    - >-
      Competitive displacement risk: no public evidence that any OEM has switched away from Applied Intuition to a
      competitor.
