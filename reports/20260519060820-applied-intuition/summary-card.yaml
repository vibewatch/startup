summary:
  headline: >
    Applied Intuition is the dominant private platform for autonomous vehicle development infrastructure, with deep OEM
    penetration and a growing defense franchise; its $15B valuation is stretched on available evidence but defensible if
    undisclosed revenue confirms the claimed profitability and triple-digit growth trajectory.
