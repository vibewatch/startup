      - number: '3.3'
        title: 切换成本、多栖使用与分销权力
        blocks:
          - type: paragraph
            body: >-
              Viam 的锁定有意义，但并非绝对。当客户围绕其注册表、部署模型、远程运营和开发者工具形成标准，尤其是应用和机器配置已经跑在平台上之后，粘性会上升。即便如此，审阅来源仍指向一个相对可多栖使用的市场。ROS2
              仍是成熟工程团队的现状替代方案，Viam 自身也把自己定位为更易用的软件层，而不是封闭的机器人操作系统。这降低了迁移摩擦，因为一些团队可以保留 ROS2 组件，同时用 Viam
              做编排或应用。分销是另一个弱点。AWS 和 Google Cloud 可以把机器人相邻功能挂到更广的基础设施合同上，NVIDIA 则可能在控制平面选择定型前，先拿下仿真和训练预算。Universal Robots
              通过证明与已知工业硬件兼容，帮助 Viam 对冲这种动态；但这项合作本身无法抵消 hyperscaler 捆绑，也无法抵消高级买方继续自组堆栈的意愿。
