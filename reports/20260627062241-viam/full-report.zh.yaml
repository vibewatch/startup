        - 交付定制设备软件，并手工收集现场数据
        - 使用 fragments、OTA 更新、定时数据采集、离线队列和云同步
        - 以边缘感知数据采集支撑集中管理
        - 公开文档未披露已验证的最大机群规模或同步 SLO
      - - 构建 Web 或移动端机器应用
        - 为浏览器或手机客户端另建连接层
        - 使用 TypeScript、Flutter 和共享连接模型
        - 让现有 Web / 移动团队用熟悉工具构建机器界面
        - 未按客户端类型披露公开采用指标
      - - 部署工业自动化工作流
