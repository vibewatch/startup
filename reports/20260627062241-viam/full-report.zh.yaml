      - number: '3.2'
        title: 能力与买方比较
        blocks:
          - type: paragraph
            body: >-
              最重要的比较维度是范围，而不是品牌。Viam 自身页面描述的平台横跨车队管理、部署、更新、应用构建和硬件抽象。这种宽度重要，因为 Foxglove 和 Formant
              各自在具体子问题上看起来更强，而不是覆盖完整生命周期。Foxglove 审阅材料强调面向机器人和 physical AI 团队的数据记录、回放、搜索和数据集工作流；Formant
              材料强调已部署车队的运营可见性。Intrinsic 的野心更接近 Viam，因为它打包了一个一体化开发者环境和工业自动化能力，但可见重点仍偏向工业机器人工作流。AWS、Google Cloud 和 NVIDIA
              各自拥有强大的相邻能力，不过审阅的公开材料仍显示，买方需要围绕这些工具自行组装更多应用工作流。结果是，Viam 的产品故事凭集成宽度形成差异化，而几个竞争对手仍能凭更窄技术楔子的深度，或已有云关系赢单。
