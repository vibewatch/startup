      - number: '1.2'
        title: 领导层、治理与业务足迹
        blocks:
          - type: paragraph
            body: >-
              公开来源里的领导层故事仍高度以创始人为中心。Eliot Horowitz 不只是 Viam 的公众门面，也是创始人—市场匹配最强的证据：他有在 MongoDB
              建设基础设施平台的经历，如今把同一套打法用于机器软件。关于页面和融资公告把公司定位在纽约市，并设有机器人实验室，同时也描述了一支分布在美国和欧洲的团队。相较于其余治理记录，投资人背书异常可见。Union
              Square Ventures 的 Albert Wenger 反复出现在官方和投资人材料中，他的评论把 Viam
              定位为一个开放架构层，可能释放更广泛的机器可编程性。不过，治理透明度仍不完整。公开材料没有公布完整董事会名单、委员会结构，或多轮投资参与附带的具体监督权，因此后续尽调应把关键人物风险和董事会构成视为未解问题。
