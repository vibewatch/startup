  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Viam 的投资论点很直接：一家由可信创始人带队的机器人软件平台已经融到有分量的资本，交付了宽控制平面架构，并有足够公开证据说明产品不只是演示。官方材料确认累计披露融资 $117 million，2025 年 3
              月完成 $30 million Series C；公开客户和伙伴引用覆盖 Viking Yachts、UBS Arena、CompScience、Tech Mahindra 和 Universal
              Robots。这一组合支撑真实的期权价值，因为公司仍可能成为异构机器上的标准编排层。反论点同样重要。Viam
              没有公开披露收入、ARR、毛利率、客户数、NRR、烧钱速度或最新一轮投后估值。这意味着投资人可以欣赏架构和市场叙事，却不知道这门生意是在按软件平台、重集成的应用自动化公司，还是两者之间的形态运行。落到 IC
              语境，问题不是 Viam 是否有意思，而是公开证据是否支持现在溢价买入。今天还不支持。
