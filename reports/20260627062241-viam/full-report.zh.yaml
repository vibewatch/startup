        title: 资本历史与股东图谱
        blocks:
          - type: paragraph
            body: >-
              对一家私有基础设施公司而言，Viam 的融资历史异常清晰。官方材料确认：2021 年 6 月完成 $12 million 种子轮，2022 年 2 月完成 $30 million Series A，2024 年
              3 月完成 $45 million Series B，2025 年 3 月完成 $30 million Series C，累计披露资本达到 $117 million。同样重要的是，投资人名单呈现连续性。Union
              Square Ventures 出现在种子轮，并在 Series C 再次成为领投方；Battery Ventures 参与多轮后续融资。Tiger Global 验证了 Series A，Neurone
              则在最新一轮加入一个偏欧洲的战略渠道。这种连续性重要，因为 Viam 仍在同时搭建产品宽度和商业动作。融资历史支持这样一个判断：支持者承保的是长期平台建设，而不是快速资产倒手。主要未解点是估值。官方 Series
              C 材料没有给出投后数字，二级市场数据库也只提供可信度较低的估计。这个缺口并不否定资本历史，但在把公司动能转换成投资进入价格时，会显著限制精度。
