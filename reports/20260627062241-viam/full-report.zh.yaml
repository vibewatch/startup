        title: 资本充足性与 burn 背景
        blocks:
          - type: paragraph
            body: >-
              资本充足性方面，本章可以依赖本地重述的融资事实，而不重复公司概览里已经有的轮次编年。2025 年 3 月官方材料支持 $30 million Series C 和 $117 million
              累计披露融资，但没有提供投后估值、现金余额、债务表或管理层 burn 指引。这让投资人只能推断 runway，而不是验证它。合理的公开情景框架是，如果年化 burn
              落在许多同等团队规模的风险投资支持基础设施公司可承受的 $15 million 至 $20 million 附近，Series C 可能买来约 18 至 24
              个月运营时间；但这仍是估计，不是公司披露指标。成本侧也混杂。TechCrunch 2024 年约 100 名员工的信号、Viam 分布式足迹、伙伴赋能和实体自动化部署，都指向一个比轻量级 API
              初创公司更重的成本基础，尽管按使用定价的云产品应具备有利的增量软件经济性。因此，资本故事足以支撑继续执行，但还不够透明，无法精确承保。
