      - number: '5.4'
        title: 信任、安全与部署模型
        blocks:
          - type: paragraph
            body: >-
              信任图景是混合的。正面看，Viam 的部署模型在运营上务实：WebRTC 连接和基于浏览器的远程访问，拿掉了通常拖慢分布式机器部署的大量 VPN
              与端口转发摩擦；离线排队和带宽感知数据同步也承认真实边缘条件。公司还发布正式条款、隐私披露、定价和多份技术文档，这比许多更年轻的机器人初创公司更好。但企业尽调仍会发现重大缺口。本章审阅的公开材料没有披露 SOC
              2 报告、ISO 27001 认证、公开 uptime 仪表盘，或针对 viam-server、app.viam.com 或注册表的正式
              SLA。条款和隐私政策确认了法律脚手架和标准分析收集，但它们不能替代可审计安全控制。这意味着 Viam
              看起来已可支持开发者实验和部分工业部署，但仍要求大型买方通过直接尽调，而不是仅凭公开证据，来承保一部分信任和可靠性验证。
