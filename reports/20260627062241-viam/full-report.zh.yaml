      - number: '7.5'
        title: 人员、执行与否决标准
        blocks:
          - type: paragraph
            body: >-
              以这家公司野心之大来看，人员风险异常集中。Eliot Horowitz 不只是创始人兼 CEO；他也是公开战略叙事者，把 Viam 的产品故事连接到他此前在 MongoDB
              参与打造的基础设施打法。这是正面的创始人—市场匹配证据，但也意味着 Viam 的外部可信度与一个人紧密绑定。本章审阅的公开记录没有显示宽厚的具名高管梯队、继任计划，也很少说明除 Horowitz
              之外谁负责销售、财务或平台可靠性。这一缺口重要，因为 Viam 下一阶段需要的不只是产品愿景：还要在硬件相邻环境里扩张企业分销、管理风险、顶住运营韧性考验。因此，实际否决标准可以监测。Horowitz
              离任、下一轮缺少老股东支持、重大控制平面宕机，或更大对手给出清晰平台平价，都会迫使投资人重新评估护城河和融资耐久性。今天看不到这些事件，但它们都足够可信，应该列为明确尽调监测项，而不是尾部风险。
