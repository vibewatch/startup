  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Viam 的收入设计比收入规模更清楚。官方页面显示，公司以免费增值切入，无需信用卡，每月只包含前 $5 的云服务，之后开始按用量计费；这支持的是开发者主导的 land-and-expand
              动作，而不是纯自上而下的席位销售模式。价目表变现具体机器工作负载，包括二进制存储、同步存储、计算时间、导出量和通知，因此云产品表现得像基础设施软件，账单随使用扩张。同时，Viam
              在实践中不只是软件公司。同一定价页面宣传机器人表面精加工系统，标准双臂单元起价为每年 $120,000，形成第二条更接近应用自动化或 robotics-as-a-service
              的收入流。这种混合对承保重要。云层可能拥有更清晰的长期利润率路径，而硬件相关部署可以加速价值证明和 ACV，但也带来实施、支持和利用率风险，让混合收入质量不如纯 SaaS 可预测。
