      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管图景有风险，较少是因为 Viam 自身是受监管设备制造商，更多是因为其客户把软件部署到会产生安全、隐私和跨境合规义务的机器上。OSHA
              的机器人材料尤其重要，因为它们同时展示问题两面：机器人安全足够真实，OSHA 文档列出编程、维护、测试、设置和调整中的反复伤害模式；但 OSHA
              也表示不存在机器人专属联邦标准。这种模糊性会拖慢企业采购，因为客户仍需内部安全、法律和保险团队决定什么算足够好的合规。Viam 自身法律姿态符合 SaaS
              常规，但仍与风险相关。服务条款包含仲裁和集体诉讼豁免语言，隐私政策确认标准数据收集和处理做法。这些页面不显示不当行为，但确实说明争议解决和隐私治理对产品重要。欧洲进一步抬高门槛。公开公司材料称 Viam
              在欧洲各地有团队成员，并在意大利和更广区域有牵引，这意味着增长越来越多地与 GDPR 式预期和更异质的伙伴环境相交。
