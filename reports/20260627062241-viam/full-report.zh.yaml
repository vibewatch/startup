      - number: '8.4'
        title: 建议、信心与退出准备度
        blocks:
          - type: paragraph
            body: >-
              合适的公开建议是跟踪。给出买入判断，等于确信当前私募估值有吸引力，但最新估值并未公开。给出回避判断，等于确信公司已经被高估或已经坏掉，证据同样不支持。相反，公开记录支持一个低信心的观察仓位：Viam
              有足够资本、产品深度和客户证明，能保持相关性；但披露不足以支撑价格承销。信心低，因为核心估值输入仍是私有信息。风险评级高，因为披露不透明、竞争压力和可能偏服务型的收入组合，都会在规模化慢于预期时提高失望概率。退出准备度也有限。现实的近端终点是另一轮私募融资，或在
              ARR 证据更清楚后被云、工业或自动化玩家战略收购；若没有披露收入历史、利润率质量和治理透明度，IPO 式准备门槛还很远。
