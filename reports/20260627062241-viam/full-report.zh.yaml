    approximationNotes: 这是概念性的依赖流程，不是合同关系图；箭头表示外部因素在公开证据中最直接塑造 Viam 当前风险画像的位置。
    claimRefs:
      - CR013
      - CR014
      - CR027
      - CR031
      - CR033
      - CR038
      - CR039
      - CR040
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 证据从平台证明和资本基础出发，经过披露缺口与竞争风险，最终落到“跟踪”建议。
    data:
      nodes:
        - id: n1
          label: 真实平台证据
          detail: 客户和合作伙伴证据显示，Viam 已有商业活动，不是产品前阶段。
        - id: n2
          label: 资本和创始人匹配
          detail: 已融资 $117M，创始人与市场高度匹配，支撑继续执行。
        - id: n3
          label: 披露缺口
          detail: 收入、ARR、毛利率、烧钱速度和估值均未公开。
        - id: n4
          label: 可比框架
          detail: UiPath 和自动化同业给出一个合理但很宽的估值区间。
        - id: n5
          label: 竞争风险
          detail: 如果证据停滞，Intrinsic、超大云厂商和既有厂商可能压缩上行空间。
        - id: n6
          label: 建议：跟踪
          detail: 公司有潜力，但公开数据不足以支撑价格承销。
      edges:
        - from: n1
          to: n4
          label: 证据支撑期权价值
        - from: n2
          to: n4
          label: 资本延长现金续航
        - from: n3
          to: n6
          label: 阻挡买入信心
        - from: n4
          to: n6
          label: 框定宽估值区间
        - from: n5
          to: n6
          label: 推高风险评级
        - from: n1
          to: n6
          label: 避免直接回避结论
    approximationNotes: 流程从公开证据中抽象投资委员会逻辑，并不意味着存在数值评分模型。
    claimRefs:
      - CV012
      - CV017
      - CV018
      - CV025
      - CV026
      - CV027
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示例企业价值结果主要取决于 ARR 规模，以及公开或私募市场能接受的倍数。
    data:
