      - number: '2.2'
        title: 测算可服务市场
        blocks:
          - type: paragraph
            body: >-
              最站得住脚的自上而下锚点，是先看更广义的机器人市场，再用更窄的软件占比镜头收束。Benchmark International 估计全球机器人市场 2023 年约为 $46 billion，并以 15.1%
              CAGR 增至 2032 年的 $169.8 billion；StartUs 预计 2026 年达到 $88.3 billion，并强调年安装量超过 540,000 台。IFR
              提供了另一个同样有用的镜头：年度工业机器人安装价值达到 $16.7 billion，2024 年安装 542,000 台，运营存量达到 4.664 million
              台。这些数字同时显示支出和已部署基数密度，但仍会高估 Viam
              的直接收入池，因为软件编排只是机器人经济中的一部分。云机器人细分方向上的增速快于整体机器人市场，但最好的显性市场报告被付费墙挡住，也没有发布仅针对编排软件的清晰共识。合理综合下来，Viam
              可触达的是一个数十亿美元级的软件层 TAM，但精确 TAM、SAM 和 SOM 必须被视为区间，而不是单点事实。
