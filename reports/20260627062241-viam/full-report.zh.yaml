  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              Viam 面对的不是一组干净的单一竞争对手，因为买方可以用几种方式解决同一个机器软件工作。最直接的同业是 Foxglove 和
              Formant，二者都销售面向开发者的机器人软件，但强调工作流中更窄的切片：Foxglove 侧重多模态数据、可视化和可观测性，Formant
              侧重车队运营、遥测和远程监控。下一圈是更广的平台挑战者和相邻玩家。Intrinsic 是最清晰的直接平台威胁，因为它把工作流软件、机器人能力和 Google 背书结合在一起。AWS、Google Cloud 和
              NVIDIA 在审阅材料中还不像端到端替代方案那么完整，但它们可以在仿真、AI、云管理和捆绑基础设施上激进竞争。替代层仍是 ROS2 和内部自建。也就是说，Viam
              真正的竞争不只是供应商对供应商；也是完整平台采用，与客户是否愿意自己组装点工具和开源中间件之间的竞争。
