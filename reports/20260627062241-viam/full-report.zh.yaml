chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台与起源故事
        blocks:
          - type: paragraph
            body: >-
              理解 Viam，首先应把它看作面向机器的软件基础设施公司，而不是机器人
              OEM。其官网、文档和投资人材料一贯把产品描述为一套平台，用于在异构硬件上构建、部署和管理机器人应用。这个概念模型对现代软件团队并不陌生：设备运行 viam-agent 和
              viam-server，云端配置提供系统记录，中央注册表分发模块和模型，工程师用熟悉的语言编写控制逻辑，而不是拼接一堆定制中间件。这套架构是公司故事的核心，因为 Eliot Horowitz 明确把 Viam
              视为他在 MongoDB 规模化之前见过的问题模式的重演：工具割裂、基础设施劳动过重，太多有前景的想法还没发货就夭折。Viam 的叙事也在逐步拓宽。到 2024 年，TechCrunch
              已描述公司有意从自认为是机器人公司的企业，扩展到 IoT、智能家居、工业自动化和其他传感器—执行器系统；这说明管理层现在认为，可服务的问题不只是传统机器人，而是任何软件栈太脆弱或维护成本太高的联网机器。
