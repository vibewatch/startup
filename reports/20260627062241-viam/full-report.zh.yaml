      - number: '7.3'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Viam 的产品架构确实能撬动运营杠杆，但运营风险也被集中到一处。公开文档把平台描述成由云端托管的运行时：机器集中接收配置，使用通用连接模式，并通过 Viam
              自己的软件分发界面拉取模块。这提升了部署速度，也意味着一旦宕机或控制平面出错，许多机器可能同时受影响。文档只能缓和这一担忧，不能消除它：离线排队和事后同步说明公司考虑过网络恶劣场景，但这些功能仍指向延迟后的云端对账，而不是完全脱离托管系统独立运行。车队管理里也是同一模式。版本固定、发布和回滚控制都是审慎的缓释工具；反过来，它们也说明
              Viam 能协调分布式车队的变更，坏 fragment、坏模块或错误配置的下行影响因此更大。硬件无关性也是双刃剑。它是产品核心价值主张，但支持大量设备会抬高 QA 负担，可靠性也比垂直整合栈更难泛化。最后，RDK
              以 Apache-2.0 开源分发，有助于采用和伙伴信任；若其他供应商或集成商想分叉运行时核心组件，硬锁定也会降低。
