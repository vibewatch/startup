      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 已安装机器密度是 Viam 需求论点最强的公开锚点
            body: IFR 的装机基数统计不能直接测算 Viam 的软件收入，但它确实证明，已有数百万台机器处在可将远程管理、编排和数据采集变现的环境中。相比泛泛的 TAM 幻灯片，这个起点更好，因为它把问题锚定在真实车队上。
            calloutType: insight
            claimRefs:
              - CM004
              - CM030
              - CM038
          - type: callout
            title: 巨大的机器人市场不会自动转化为高软件 attach 率
            body: 广义机器人预测令人鼓舞，但 Viam 只在买方已经为硬件和集成付费之后，变现其中的软件切片。高 capex、垂直行业特定 ROI，以及云机器人软件规模缺少公开共识，都让软件 attach 率成为核心市场风险变量。
            calloutType: risk
