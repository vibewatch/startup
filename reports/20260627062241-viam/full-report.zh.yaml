  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与运行时模型
        blocks:
          - type: paragraph
            body: >-
              Viam 的产品最好理解为机器软件控制平面，而不是单一机器人应用。文档化的运行时模型从 viam-agent 在目标机器上安装、监督和更新 viam-server 开始；之后，机器从 app.viam.com
              拉取 JSON 配置，并从 Viam 注册表取回模块。这个设计重要，因为它把异构硬件设置从定制驱动和手工维护中间件，转向声明式配置、内置服务和集中管理的车队运营。硬件层为摄像头、电机、机械臂和传感器暴露一致组件
              API；更高层则加入运动规划、数据采集、远程访问和部署控制。车队文档把同一模型扩展到可复用片段、版本固定、空中更新、浏览器排障和单机覆盖。结果是一个云管理的边缘运行时，比通用 SDK 包更有主张；但也更依赖
              Viam 自身控制平面和注册表保持可用并值得信任。
