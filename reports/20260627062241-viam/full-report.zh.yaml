  - id: TV005
    title: 打破投资论点与叫停触发因素表
    columns:
      - 触发因素
      - 门槛 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 融资轮持平或下调
        - 下一轮新股融资价格等于或低于此前隐含水平。
        - 会说明牵引力或投资人胃口低于预期。
        - 暂停所有投资工作，重新评估下行空间。
      - - 客户背书偏弱
        - 具名客户描述的是定制集成，而非可复用的平台价值。
        - 会削弱软件倍数的投资理由。
        - 将判断转向服务占比更高的结局。
      - - 合作伙伴经济性恶化
        - 渠道条款显示让渡利润率，或丢失客户所有权。
        - 分销会扩大，但价值捕获会收缩。
        - 下调战略溢价假设。
      - - 被竞争对手替代
        - Intrinsic、超大云厂商或既有厂商拿下 Viam 本应赢得的标杆客户。
        - 会降低成为品类标准的概率，并压缩退出倍数。
        - 大幅下调牛市情景概率。
      - - 领导层或治理疑虑
        - 尽调发现创始人意外离职，或投资人权利形成悬置风险。
        - 关键人物风险和控制风险会急剧上升。
        - 继续推进前，要求先修复治理问题。
    notes: 这些是可监控的论点破裂信号，不是预测；其中几项需要私下尽调，因为公开披露可能滞后。
    claimRefs:
      - CV021
      - CV022
      - CV027
      - CV033
      - CV036
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 尽调问题
      - 优先级
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 索取 ARR、收入和毛利率。
        - 关键
        - 决定 Viam 应该套用软件式估值框架，还是应用自动化估值框架。
        - 管理层财务包和董事会报告。
      - - 索取客户数、NRR 和前 10 大客户集中度。
        - 关键
        - 检验可复用性、依赖风险和增长质量。
        - 收入分群材料和客户集中度明细。
      - - 索取董事会构成和股权结构表。
        - 高
        - 治理和清算优先权决定真实下行空间与控制权。
        - 法务尽调和股权结构表导出。
      - - 索取烧钱率和现金 runway。
        - 高
        - 总融资额看不出公司多快需要下一轮融资。
        - 财务模型、现金余额和预算复核。
      - - 获取 Viking、UBS Arena 和 CompScience 的客户访谈。
        - 高
        - 区分真正的软件价值和定制实施工作。
        - 访谈三家具名客户，并给可复用性打分。
      - - 审查 Tech Mahindra 主协议条款。
        - 高
        - 只有经济性和客户所有权仍然有吸引力，渠道规模才有价值。
        - 由法务和运营合伙人审查商业合同。
    notes: 这些问题是让建议能够负责任地脱离「继续跟踪」所需的最低证据集。
    enumerationScope:
