  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 牛市、基准、熊市和融资反推区间显示，只靠公开信息得到的估值包络仍然很宽。
    data:
      items:
        - label: 熊市情景
          low: 0
          high: 200
          unit: USDm
        - label: 基准情景
          low: 250
          high: 480
          unit: USDm
        - label: 融资反推
          low: 150
          high: 600
          unit: USDm
        - label: 牛市情景
          low: 1200
          high: 1500
          unit: USDm
    approximationNotes: 区间是尽调估算；在收入和投后估值仍未披露时，不应把它们当作可交易标记。
    claimRefs:
