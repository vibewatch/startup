      - number: '5.3'
        title: 模块注册表与 ML 能力
        blocks:
          - type: paragraph
            body: >-
              Viam 的注册表和 ML
              表面把平台从连接层变成可复用应用基底。文档把注册表描述为模块、机器学习模型和训练脚本的分发点，并全部带有语义版本控制；这意味着客户可以通过同一个用于运行时部署的控制模型来固定或更新依赖。训练和视觉文档展示了两段式机器学习故事：团队可以从已部署机器采集数据，用捕获数据训练模型，或引入外部
              TensorFlow、PyTorch 和 ONNX 模型，再把这些模型重新部署回车队做端侧推理。视觉服务和运动规划服务表明，Viam 已经在原始设备 API
              之上打包更高层能力。空气质量教程在这里很有价值，因为它展示了一个具体多传感器模式——采集、同步、分析，并在车队规模上管理——而不只是抽象产品主张。最大的未解问题是生态深度：公开文档讲清了注册表概念，但没有量化模块数量、Viam
              维护与社区模块的拆分，或第三方采用规模。
