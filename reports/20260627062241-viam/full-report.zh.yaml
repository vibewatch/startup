  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 风格评分显示，产品和市场潜力强，但公开财务证据与价格透明度薄弱，抵消了部分吸引力。
    data:
      items:
        - label: 市场机会
          value: Large robotics and automation software spend
          score: 7/10
        - label: 产品广度
          value: Broad control-plane architecture
          score: 8/10
        - label: 客户 / 合作伙伴证据
          value: Real but still selective named references
          score: 6/10
        - label: 财务透明度
          value: Revenue, ARR, and margin undisclosed
          score: 2/10
        - label: 估值支撑
          value: Only directional comparable support
          score: 3/10
        - label: 竞争定位
          value: Strong vision but credible strategic rivals
          score: 5/10
        - label: 尽调就绪度
          value: Needs core private-company data pack
          score: 3/10
    approximationNotes: 评分是定性 IC 辅助，不是加权量化模型的输出。
    claimRefs:
