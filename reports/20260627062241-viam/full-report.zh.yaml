  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类别
      - 2026 年 6 月市值
      - 收入背景
      - 重要性
      - 相比 Viam 的限制
    rows:
      - - UiPath
        - 自动化软件 / 工作流 SaaS
        - $5.45B
        - 年收入 $1.43B；约 3.8x 收入
        - 平台经济性和开发者主导采用方面，最好的主要软件型可比公司。
        - 不是机器人控制平面公司。
      - - Rockwell Automation
        - 工业自动化老牌厂商
        - $53.05B
        - FY2025 收入 $8.342B
        - 展示成熟龙头在大得多的规模下如何被估值。
        - 硬件 / 工业属性过重，也过于成熟。
      - - Teradyne
        - 自动化 + 测试设备 + UR 所有者
        - $68.38B
        - 2024 年收入约 2.82B；TTM 背景约 2.86B
        - 相关性来自其拥有 Universal Robots，并代表战略自动化价值。
        - 收入组合包含测试设备和硬件暴露，不同于 Viam。
      - - Symbotic
        - 仓储自动化 + AI
        - $24.89B
        - FY2025 收入增长至约 $2.25B
        - 当规模变得可见时，可用于支撑高溢价机器人 / AI 叙事。
        - 比 Viam 更偏部署重、垂直聚焦。
      - - Intuitive Surgical
        - 定义品类的机器人平台
        - 很大的公开市场龙头
        - 品类领导力和手术量支撑的高溢价机器人估值
        - 说明战略品类所有权可以拿到持久溢价。
        - 医疗机器人经济性与 Viam 市场差异很大。
      - - 二级私营公司标记
        - 私营公司数据库
        - 仅低置信度
        - PremierAlts 和 Oryndex 提供方向性、未经审计的私募估值标记
        - 可作为外部观察者估值猜测的弱信号。
        - 可靠性太低，无法支撑公允或偏高的判断。
    notes: 覆盖范围有意保持部分样本，重点放在最影响决策的公开和准公开参考，而不是穷尽所有自动化公司。
