      - number: '8.2'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              传统 DCF 在这里无法成立，因为 Viam 不披露收入、利润率或现金流数据。因此，更好的公开市场锚点是可比倍数，先从最干净的主要参照 UiPath 开始。UiPath
              不是机器人公司，但它是一个工作流自动化平台，具备开发者驱动采用和软件式经济性，因此比纯工业在位厂商更相关。按约 $5.45 billion 市值和 $1.43 billion 年收入计算，UiPath 交易在约
              3.8x 收入。Rockwell Automation、Teradyne 和 Symbotic 拉宽参照框架。Rockwell 展示市场如何给大型、低增长工业自动化在位厂商定价；Teradyne
              展示规模化自动化加硬件平台能拿到什么估值；Symbotic 展示当 AI 叙事和部署规模都可见时，自动化公司能获得的溢价。没有任何一家是完美类比，但合在一起给讨论划出边界：在可重复软件收入证据更清晰之前，Viam
              既不该拿商品化工业倍数，也不该拿英雄式溢价。
