      - number: '8.5'
        title: 论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              监测框架和建议本身一样重要。最快打破论点的证据，是 Viam 无法把伙伴和客户 logo 转化为可重复的软件经济性：平轮或下轮、疲弱客户背书，或企业伙伴主要把 Viam
              视为定制集成层的迹象，都会迅速压缩估值。正向版本同样具体。若公司披露 ARR、收入增长、毛利率、客户多元化和下一轮条款，并显示业务更像软件而不是项目制工作，Viam
              就可以从跟踪走向买入。因此，第一批尽调问题是财务问题，不是架构问题。投资人需要收入、毛利率、烧钱速度、现金跑道、客户集中度、董事会构成、股权结构表条款和直接客户背书。Tech Mahindra
              主协议也重要，因为只有在扩大分销、同时不让渡经济性或客户关系控制权时，渠道杠杆才是增量。
