      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Viam 的需求逻辑真实存在，但并非没有摩擦。正面看，劳动力成本、AI 集成、远程管理需求，以及关键区域和垂直行业中不断上升的机器密度，都在推动机器人采用。StartUs 和 The Robot Report
              都指出，physical AI、人形机器人和云连接车队管理是 2025-2026 年的活跃主题，这与 Viam 架构吻合。反向约束同样重要。硬件 capex 仍是许多买家的第一道门槛，因此软件 attach
              可能要等底层机器人或智能机器部署已经证明回本后才发生。熟练机器人工程师仍然稀缺，这提高了易用工具的价值，但也拖慢实施。中国供应链集中让硬件生态分布不均，而 OSHA
              缺少机器人专属标准，让买方只能在一般机器安全义务的拼图中前进。这些约束不会否定市场，但意味着采用节奏、预算归属和实际软件支出会随工作流显著分化。
