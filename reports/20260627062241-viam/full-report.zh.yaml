        - $1.2B-$1.5B
      - - 基准
        - 从公开证据看最可信
        - Viam 达到 $50-80M ARR，软件收入混有部分实施较重的部署，并通过收购或 Series D 退出。
        - 中速增长企业平台按 5-6x 收入倍数。
        - $250M-$480M
      - - 熊市
        - 实质下行情景
        - 公司未能突破小众部署，竞争加剧，下一轮持平或下行轮。
        - 采用过桥轮或战略低价出售逻辑，而不是高溢价软件倍数。
