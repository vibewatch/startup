            body: >-
              公开证据支持这样一个判断：Viam 是一个真实发货的平台，正从以机器人为中心的根部，成熟为更广的物理世界软件层。到 2024 年，TechCrunch 已描述公司有意从机器人扩展到自动化和 IoT；到 2025
              年，Series C 材料明确把故事放在物理世界的数据与 AI 上。当前文档集——运行时文档、SDK 文档、定价、训练、视觉、注册表、CLI 和应用教程——显示的产品有实质宽度，而不是单一狭窄功能。这种宽度是
              Viam
              最清晰的差异化：客户可以通过一个平台声明硬件、管理车队、采集数据、训练或导入模型，并构建应用。不过，成熟度并不均衡。文档质量和产品宽度领先于生态规模、发布节奏、可靠性指标和安全认证的公开证明。因此，投资人应把平台视为技术上可信、商业上有前景，同时承认部分企业就绪证据仍在私下或尚未发布。
