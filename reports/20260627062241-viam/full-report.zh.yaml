        - 仅方向性
        - 已累计融资 $117M 的 Series C 平台公司，定价通常是融资规模的数倍，但离散度很大。
        - 启发式按最新轮次规模的 5-20x 区间，且受到缺失收入数据强烈约束。
        - $150M-$600M
