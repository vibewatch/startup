      - number: '5.2'
        title: SDK 与开发者生态
        blocks:
          - type: paragraph
            body: >-
              对一个机器人相邻平台而言，开发者表面异常宽。Viam 为 Python、TypeScript、C++、Java、Rust、Flutter 和 Go 导向工作流维护一手文档或仓库，公开文档也一贯把这些 SDK
              定位为同一机器 API 之上的不同客户端表面，而不是彼此断开的点工具。Python 看起来是文档最完整的入口，但应用构建和连接文档明确显示，浏览器和移动端体验也是预期产品形态的一部分。商业上这很重要，因为
              Viam 试图在客户现有团队已经工作的地方与他们相遇：Web 团队可以用 TypeScript，嵌入式团队可以用 C++ 或 Rust，企业集成团队可以用 Java。公开 GitHub
              组织、CLI、定价和托管文档合在一起，显示出有意设计的自助漏斗，而不只是定制咨询。开放问题是采用深度：仓库存在证明了宽度，但公开记录对下载量、按语言划分的生产部署或比较性生态使用指标仍然很薄。
