      - number: '7.4'
        title: 财务、模式与伙伴风险
        blocks:
          - type: paragraph
            body: >-
              Viam 的财务风险主要来自不透明叠加高野心。公开来源确认公司已完成有分量的融资，但没有披露收入、毛利率、烧钱速度或通向盈利的具体路径。因此外部投资人只能推断：$30 million Series C
              究竟是增长轮、类似过桥的延展，还是只是为下一个证明点争取时间的资金。定价模式也增加不确定性，因为与用量挂钩的经济模型可随已部署车队扩张而漂亮放大；但若客户限制数据量、放慢上线，或把部分工作流留在开源工具上，增长也可能变平甚至反转。伙伴侧同样好坏交织。Universal
              Robots 验证了工业相关性，但这一证明嵌在 Teradyne 旗下生态里，而 Teradyne 近期机器人业务结果偏软。Tech Mahindra 和 Neurone
              可能拓宽渠道，但从公开证据看，两段关系都比投资人希望看到的更早期。换句话说，Viam
              的伙伴动能足以支撑关注，但披露的转化数据还不足以把伙伴关系视作已去风险的收入机器。若执行周期拉长，公司可能需要在平台商业耐久性清晰可见之前再融资。
