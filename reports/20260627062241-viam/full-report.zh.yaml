      - number: '8.3'
        title: 情景分析与敏感性
        blocks:
          - type: paragraph
            body: >-
              对 Viam 而言，情景分析比虚假精确更诚实。牛市情景下，Viam 成为机器人和联网机器的默认控制平面，借 Tech Mahindra 获得渠道杠杆，通过 Universal Robots 和 Viking
              式部署取得硬件相关性，到 2028 年 ARR 至少达到 $150 million。给这一软件结果 8-10x 收入倍数，价值约为 $1.2-1.5
              billion。基准情景下，公司成长为有意义但更窄的企业平台，ARR 达到约 $50-80 million，并通过并购或后续私募轮退出，收入倍数约 5-6x，隐含价值约 $250-480
              million。熊市情景下，Viam 难以把公开证明点转化为广泛经常性收入，Intrinsic 和在位厂商的竞争压力压缩热情，公司面临平轮或下轮，最终走向低于 $200 million
              的战略结果或人才收购逻辑。由于当前收入未披露，假设 ARR 的小变化会主导每一个估值输出。
