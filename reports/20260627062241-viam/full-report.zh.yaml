            body: >-
              财务结论方向上建设性，但证据有限。收入质量看起来好于一次性机器人集成店，因为官方产品模型围绕经常性云使用、车队管理、数据工作流和免费到付费扩张。软件层的利润率路径也显得积极，受益于开源采用入口和按使用挂钩的变现。但公开记录仍挡住核心承保问题。没有披露
              ARR、当前收入 run rate、客户数量 cohort、毛利率、净留存、合同集中度细节。Series C
              估值仍未在官方材料中披露，而二级数据库和私募市场页面彼此过于不一致，不能替代经审计证据。条款和隐私页面还增加了另一层谨慎：企业尽调仍需检查责任上限、服务承诺，以及规模化支持机器数据的成本。在管理层提供收入结构、burn
              和单位经济的内部报告之前，投资人应把 Viam 视为一家资本充足但财务不透明的平台公司；其最强公开证明是设计质量和合作动能，而非已披露经营表现。
