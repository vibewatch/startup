      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 最大风险是战略挤压，而不是技术不存在
            body: 公开记录强力支持 Viam 确实有一个真实平台。更难的问题是，在资本更充足的对手或免费替代品补上足够多工作流缺口、压平定价权和融资杠杆之前，这个平台能否复利成持久杠杆。
