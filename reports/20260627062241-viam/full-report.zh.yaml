      - number: '2.3'
        title: 买方、细分市场与 go-to-market
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Viam
              已经卖进一组广泛的机器密集型环境，而不是单一机器人细分。其客户和合作伙伴材料在制造、海洋、餐饮服务、场馆运营、气候或工业系统、教育和更广泛的开发者工具中都给出证明点。这些用例指向不同的预算所有者。制造业部署通常需要工程和运营共同支持，因为正常运行时间、安全性和与遗留设备集成，和原始自动化能力一样重要。海洋和工业传感器工作流更偏向需要远程可见性和边缘智能的产品、创新或现场运营团队。餐饮服务和场馆安装把运营负责人拉近决策，因为价值主张集中在工作流可重复性和劳动力杠杆上。Viam
              的定价、文档和招聘信号合在一起，支持一种混合 go-to-market 动作：低摩擦开发者 onboarding
              扩大漏斗，再由企业销售和解决方案工程转化生产部署。这很有吸引力，因为它降低漏斗顶部获客成本；但公司跨越多个垂直行业时，面对不同合规、集成和 ROI 标准，销售周期也可能拉长。
