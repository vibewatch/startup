  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争框架
        blocks:
          - type: paragraph
            body: >-
              给 Viam 定市场规模，应对标联网机器的软件基础设施预算，而不是每台售出机器人的完整物料清单。独立来源把机器人定义为结合硬件、感知、自主、控制和软件的广义系统；Viam
              自身平台材料则描述了一层能力，用于配置设备、部署模型、集成组件，并在机器人、智能机器和 IoT 端点之间运营车队。这一点重要，因为现状替代方案不是另一家机器人制造商而已，而是割裂的内部工具、OEM 专属软件栈和
              hyperscaler 边缘服务。因此，相关市场边界包括机器运营方的编排、车队管理、远程监控、数据采集和应用开发。它排除大部分硬件 capex、组件收入，以及从未触及实体设备的通用云支出。这个框架也解释了为什么
              IFR 安装统计有用但不完整：它们锚定已安装机器密度和买方准备度，但 Viam 最终上行空间取决于能在这些车队上叠加多少经常性软件价值。
            claimRefs:
