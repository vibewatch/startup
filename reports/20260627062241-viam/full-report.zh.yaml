        - 压缩还是扩张，更多取决于披露的基本面，而不是 TAM 叙事。
        - 可能向任一方向大幅移动
    notes: 情景概率带有判断性，主要取决于收入规模、收入结构和融资条款；这些今天仍是私有信息。
