  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 重要性
      - 缓释 / 尽调问题
    rows:
      - - 硬件抽象 + 模块注册表
        - ROS2 和既有厂商可逐步补齐连接器缺口
        - 高
        - 只有在集成仍明显比 DIY 更容易时，连接器广度才有用
        - 要求提供胜负单数据，显示相对 ROS2 和既有栈的部署时间节省
      - - 统一工作流广度
        - 买方可拆成 Foxglove、Formant、云服务和内部代码
        - 高
        - 如果客户分别购买单点工具，Viam 就失去平台溢价
        - 要求提供多产品挂载率，以及初始试点后平台扩张的证据
      - - 开发者友好入门
        - Intrinsic 和超大规模云厂商可用更大工程预算改善入门体验
        - 中高
        - 易用性有价值，但比生态位置更容易被复制
        - 要求提供首次连上机器所需时间，以及免费转付费的产品遥测
      - - 已部署机队的数据飞轮
        - Foxglove 或 Formant 可在 Viam 之前掌握可观测性或遥测层
        - 中
        - 掌握数据平面会削弱 Viam 的学习和追加销售循环
        - 询问有多少客户把 Viam 用作机器数据的记录系统
      - - 云中立控制平面
        - AWS 和 Google 可把相邻机器人能力打包进更大的合同
        - 高
        - 在企业采购中，分发杠杆可能压过产品优雅度
        - 要求按客户披露云集中度，并提供击败打包方案的替换成交证据
      - - 工业伙伴证明
        - 既有 OEM 和 OT 渠道仍可把买方导向熟悉供应商
        - 中
        - 兼容性证明有帮助，但渠道归属仍重要
        - 询问来自 Universal Robots 或其他生态伙伴的管线来源
      - - 透明价值获取
        - 该品类公开定价不透明，让 ROI 对比变难
        - 中
        - 价格发现弱，会拖慢买方信心和投资人对标
        - 要求按细分披露实际定价区间、毛利率范围和交易审批门槛
    notes: 这份清单把已观察到的竞争证据转成尽调优先级；严重程度是序数，用于承销分诊，不是经审计的概率。
