  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >-
              Viam 最严重的外部风险，不是机器人软件需求消失，而是公司试图在一个买方仍可从巨头供应商或开源中组装更窄替代方案的市场里，建设一个宽机器软件控制平面。Intrinsic
              是最干净的直接平台威胁，因为它把相似的开发者平台野心、Google 所有权和资产负债表耐心配在一起。NVIDIA 的重要性来自另一个原因：即便不逐项匹配 Viam 功能，其 physical-AI
              工具、仿真能力和资本基础，也足以补贴可先捕获预算的相邻工作流。AWS 和 Google 可以靠分销竞争，而不只是靠产品形态，方式是把机器人相邻功能折进既有基础设施合同。ROS 2
              仍是顽固的基线替代方案，因为高级团队已经熟悉它，也可以继续投入工程人力，而不是付费给平台供应商。市场结构又增加一层风险。The Robot Report 的 2026
              年展望强调，机器人部分领域近期出现失败和销售放缓，同时也显示亚太主导安装；而 Viam 的可见牵引仍集中在美国和欧洲。这种组合意味着 Viam 同时面对竞争压缩和地理集中。
