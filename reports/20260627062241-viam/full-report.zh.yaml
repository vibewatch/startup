companyProfile:
  summary: >-
    Viam 是一家总部位于纽约的软件基础设施公司，由 MongoDB 联合创始人、前 CTO Eliot Horowitz 于 2020
    年创立。公司打造一套连接云端的平台，让工程师可以用熟悉的软件开发流程，在任何硬件上构建、部署和管理机器人与自动化应用。Viam 已在 2025 年 3 月完成 Series C，累计融资 $117
    million；具名客户覆盖船舶制造（Viking Yachts、Kongsberg Discovery）、场馆技术（UBS Arena）、餐饮服务自动化（Appetronix）、工作场所安全（CompScience），并通过
    2026 年 6 月与 Tech Mahindra 的合作进入企业分销渠道。
  foundedDate: '2020-01-01'
  founders:
    - name: Eliot Horowitz
      role: 创始人兼 CEO
      background: MongoDB 联合创始人、前 CTO；曾用 13 年规模化建设开发者基础设施。
      claimRefs:
        - CO002
        - CO003
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >-
    云端机器人与自动化平台，包含 viam-server（边缘运行时）、viam-agent（设备管理器）、车队管理、数据采集与同步、ML 模型训练与部署、计算机视觉服务、运动规划、模块注册表，以及
    Python、TypeScript、Go、C++、Flutter、Rust 和 Java SDK。也为制造业提供硬件集成的机器人表面精加工系统。
  customerFocus: 企业工程团队、机器人初创公司，以及希望在不自建专用基础设施的情况下构建并管理智能机器车队的制造业运营方。
  businessModel: 免费增值云 SaaS，采用按用量计费（数据存储、计算、通知），同时提供机器人表面精加工硬件解决方案包，起价为每年 $120,000。
  stage: Series C
  fundingStatus: 2025 年 3 月完成 $30M Series C，由 Union Square Ventures 领投，Battery Ventures 和 Neurone 参投；累计披露融资 $117M。投后估值未公开披露。
