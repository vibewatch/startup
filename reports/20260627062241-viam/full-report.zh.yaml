  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Viam 的相关性
    rows:
      - - 联网机器软件基础设施
        - 车队管理、设备配置、远程监控、数据管道、模型部署、开发者工具
        - 机械臂、传感器、计算模块、合同制造、与机器无绑定的通用公有云
        - 企业工程团队、运营负责人、机器人产品负责人
        - Viam 试图占据的核心市场，因为它的产品把异构硬件抽象成一个运营层。
      - - 工业机器人应用软件
        - 产线编排、机器视觉工作流、uptime 和 telemetry 工具、跨工厂集成
        - 随封闭 OEM 软件包销售的独立工业机器人
        - 制造工程、工厂运营、自动化团队
        - 重要近端切入口，因为 IFR 数据显示装机基础密集，且有反复车队管理需求。
      - - 服务、现场与智能机器运营
        - 远程支持、移动或分布式设备管理、多站点工作流自动化、传感器到动作应用
        - 纯消费电子设备和没有软件控制平面的非联网机械
        - 现场运营、场馆运营方、船舶产品团队、餐饮服务运营
        - 对应 Viam 从经典机器人向更广泛自动化和 IoT 环境扩张的公开路径。
      - - 相邻硬件与组件生态
        - 直接 TAM 口径不纳入；仅作背景
        - 执行器、摄像头、芯片、电池、集成劳务、大多数硬件 capex
        - OEM 采购和硬件供应链买方
        - 这些类别影响采用时点，但不应计入 Viam 收入机会。
    notes: 这条边界把 Viam 可能变现的软件层，与只会影响采用条件的更大硬件和组件经济区分开。
    claimRefs:
      - CM012
      - CM013
      - CM019
      - CM030
