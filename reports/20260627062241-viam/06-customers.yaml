    {
      "id": "retention-expansion-and-concentration-risks",
      "title": "Retention, expansion, and concentration risks",
      "body": "The central diligence issue is not whether Viam has named users; it is whether those deployments compound into durable recurring revenue. Public materials do not disclose customer count, ARR by customer, renewal rate, NRR, GRR, churn, or average contract length. That leaves the strongest expansion evidence indirect. Pricing, fleet-management docs, data-sync docs, and module-distribution docs all support a land-and-expand model in which a first machine deployment can grow into OTA updates, data collection, model management, and larger fleet operations. But the same evidence also points to concentration and delivery risk. Marine is the most overrepresented named vertical, some marquee stories still look pilot-like, and a portion of commercial value appears tied to implementation-heavy deployments such as robotic sanding cells rather than pure cloud consumption. Investors can therefore underwrite commercial promise, but not yet retention quality, from the public record alone.",
