    "number": 6,
    "title": "Customers",
    "summary": "Viam has credible public customer proof across marine, manufacturing, venue, food-service, safety, and education use cases, with the strongest corroboration in Viking Yachts and Kongsberg. The chapter\u2019s main weakness is not logo quality but commercial opacity: public sources still do not disclose total customer count, retention, or customer-level revenue concentration, so adoption breadth is clearer than durability."
