    {
      "id": "named-customer-proof-depth-and-breadth",
      "title": "Named customer proof: depth and breadth",
      "body": "The quality of Viam\u2019s customer proof is uneven but directionally strong. Viking Yachts has the best independent corroboration because both the original PR Newswire release and Marine Business coverage describe robotic sanding at a more-than-one-million-square-foot New Jersey facility, tying Viam to a concrete production workflow rather than a logo page. Kongsberg Discovery also stands out because Viam and Kongsberg publicly described a cloud-connected AI sonar initiative for commercial fishing, though the Series C materials still frame at least part of that work as a pilot. UBS Arena is commercially useful because it shows Viam can ship quickly into a high-traffic venue environment, but the public evidence emphasizes a 10-day deployment and live wait-time visibility more than long-term contract depth. The rest of the customer set is real enough to support breadth, yet many examples remain company-described case studies without independent revenue, duration, or expansion data.",
