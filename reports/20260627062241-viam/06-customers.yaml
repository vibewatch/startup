  "sections": [
    {
      "id": "customer-base-segmentation-and-vertical-coverage",
      "title": "Customer base segmentation and vertical coverage",
      "body": "Public evidence suggests that Viam sells into a wide mix of physical-world software and automation buyers, but the visible customer set is not evenly distributed. Marine and marine-adjacent accounts form the densest named cluster, including Viking Yachts, Kongsberg Discovery, Canyon Runner, Digital Yacht, and GOST. Outside marine, the company shows proof in venue operations through UBS Arena, food automation through Appetronix and Sbarro, workplace safety through CompScience, consumer kitchen automation through Gambit, sports robotics through Tennibot, and educational pipeline building through FIRST Robotics and Viam Education. That breadth matters because it supports the thesis that Viam is a horizontal control-and-data layer rather than a single-vertical application. At the same time, the pattern of named logos implies that Viam\u2019s most concrete commercial traction still skews toward hard deployment environments where connectivity, fleet management, and edge intelligence matter more than pure SaaS seat expansion.",
