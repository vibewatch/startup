  "callouts": [
    {
      "calloutType": "risk",
      "title": "The biggest risk is strategic compression, not technology inexistence",
      "body": "The public record strongly supports that Viam has a real platform. The harder question is whether that platform can compound into durable leverage before better-capitalized rivals or free substitutes close enough of the workflow gap to flatten pricing power and fundraising leverage.",
      "claimRefs": [
        "CR005",
        "CR006",
        "CR007",
        "CR022",
        "CR039"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Cloud architecture is a strength and a shared-point-of-failure",
      "body": "Viam's remote management story only works because configuration, data, and update workflows are centralized. The same centralization means a material outage or bad rollout can become a trust event faster than it would in a more fragmented self-managed stack.",
      "claimRefs": [
        "CR018",
        "CR019",
        "CR020",
        "CR034",
        "CR036"
      ]
    },
    {
      "calloutType": "insight",
      "title": "Founder concentration is investable only if bench depth is stronger than the public record shows",
      "body": "Horowitz's background is a real asset, but the chapter's people risk comes from missing evidence on delegated leadership rather than from any visible founder weakness. That gap is fixable in diligence, but until it is fixed, it should be priced as real concentration risk.",
      "claimRefs": [
        "CR031",
        "CR032",
        "CR033",
        "CR040"
      ]
    }
  ],
