    "number": 7,
    "title": "Risks",
    "summary": "Viam's risk profile is dominated by a familiar startup-platform mix of competition, founder concentration, cloud-control-plane dependency, and financial opacity rather than by a single fatal flaw. The most important diligence tension is that Viam appears technically credible and commercially relevant, yet many of the facts needed to underwrite durability\u2014profitability path, succession depth, security attestations, and large-scale operating resilience\u2014remain private while far larger competitors and open-source substitutes keep the market structurally unforgiving."
  },
  "sections": [
    {
      "id": "competitive-and-market-risks",
      "title": "Competitive and market risks",
      "body": "Viam's most serious external risk is not that robotics software demand disappears; it is that the company is trying to build a broad machine-software control plane in a market where buyers can still assemble narrower alternatives from giant vendors or open source. Intrinsic is the cleanest direct platform threat because it pairs a similar developer-platform ambition with Google ownership and balance-sheet patience. NVIDIA matters for a different reason: even without matching Viam feature for feature, its physical-AI tooling, simulation, and capital base let it subsidize adjacent workflows that can capture budget first. AWS and Google can compete through distribution, not only product shape, by folding robotics-adjacent functionality into existing infrastructure contracts. ROS 2 remains the stubborn baseline substitute because advanced teams already know it and can keep spending engineering labor instead of paying a platform vendor. Market structure adds another layer of risk. The Robot Report's 2026 outlook highlights recent failures and slower sales in parts of robotics while also showing Asia-Pacific dominates installations, whereas Viam's visible traction remains concentrated in the US and Europe. That combination means Viam faces both competitive compression and geographic concentration at the same time.",
