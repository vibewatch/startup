    {
      "id": "people-execution-and-kill-criteria",
      "title": "People, execution, and kill criteria",
      "body": "The people risk is unusually concentrated for a company this ambitious. Eliot Horowitz is not just the founder and CEO; he is also the public strategic narrator linking Viam's product story to the infrastructure playbook he previously helped build at MongoDB. That is positive founder-market-fit evidence, but it also means Viam's external credibility is tightly coupled to one person. The public record reviewed for this chapter does not show a broad named executive bench, a succession plan, or much detail on who besides Horowitz owns sales, finance, or platform reliability. That absence matters because Viam's next stage requires more than product vision: it requires scaling enterprise distribution, risk management, and operational resilience in a hardware-adjacent environment. The practical kill criteria are therefore monitorable. A Horowitz departure, a next round without repeat-investor support, a material control-plane outage, or clear platform parity from a much larger rival would each force a reassessment of moat and financing durability. None of those events is visible today, but all are credible enough that they should be treated as explicit diligence monitors rather than tail risks.",
