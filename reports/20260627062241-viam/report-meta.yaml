  topStrengths:
    - Founder-market fit is exceptional — Horowitz previously scaled a developer infrastructure platform at MongoDB and is applying the same architectural playbook to machine software.
    - Diversified named customer proof across marine, manufacturing, QSR, venue technology, and workplace safety reduces the single-vertical dependency risk typical of early-stage platforms.
    - Freemium developer on-ramp combined with enterprise sales motion and a hardware-solutions revenue stream provides multiple paths to revenue scale.
    - $117M in disclosed capital and repeat participation from Union Square Ventures and Battery Ventures signals durable investor conviction in the platform thesis.
    - Tech Mahindra partnership (June 2026) provides a global enterprise distribution channel reaching 1,100+ enterprise clients across 90+ countries.
  topRisks:
    - Revenue, ARR, and post-money valuation are entirely undisclosed, preventing any quantitative underwriting of growth rate, capital efficiency, or entry price.
    - Google Intrinsic, NVIDIA Isaac, and AWS/GCP cloud robotics represent well-capitalized incumbents with distribution advantages that could commoditize Viam's core platform layer.
    - Key-person dependency on Eliot Horowitz is acute — all public narrative, fundraising, and strategy are centered on the founder with no named co-CEO or succession path visible.
    - Usage-based pricing and a free-tier on-ramp make revenue unpredictable and create challenges in forecasting burn and runway without internal financial data.
    - ROS2 ecosystem (millions of deployed robots, zero license cost) represents a deeply entrenched status-quo substitute that limits Viam's addressable greenfield opportunity.
  unresolvedGaps:
    - Revenue and ARR remain completely undisclosed — obtain this data from management before any investment decision.
    - Post-money valuation for the March 2025 Series C is not in any primary source; secondary databases provide only low-confidence estimates.
    - Board composition, governance structure, and investor protective provisions are not publicly disclosed.
    - Net revenue retention, churn, and customer lifetime value metrics have not been disclosed.
    - The June 2026 Tech Mahindra partnership was announced but contract terms, exclusivity, and revenue-share arrangements are not public.
