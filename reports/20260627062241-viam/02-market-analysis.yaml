- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Physical AI and cloud-connected fleet management
    - Driver
    - 2025-2026
    - Makes software abstraction and remote operations more valuable as machine fleets become smarter and more distributed
    - How often do buyers explicitly budget for orchestration software rather than bundling it into hardware projects?
  - - Labor cost pressure and remote-management need
    - Driver
    - Ongoing
    - Supports the case for automation and for software that reduces scarce expert intervention per site
    - Which verticals show the fastest payback once remote operations are enabled?
  - - High hardware capex and integration spend
    - Constraint
    - Ongoing
    - Can delay software attach until the underlying machine deployment already clears ROI hurdles
    - What percentage of Viam wins attach to greenfield deployments versus retrofit projects?
  - - Scarcity of robotics engineers
    - Mixed
    - Ongoing
    - Raises the value of easier tooling but can still slow customer implementation capacity
    - Does Viam shorten deployment time enough to offset the talent bottleneck?
  - - China-centric hardware ecosystem and safety uncertainty
    - Constraint
    - Ongoing
    - Supply-chain concentration and patchwork safety rules can slow deployment in regulated or operationally conservative environments
    - Which customer segments require the heaviest compliance and supplier-diversification work before rollout?
  notes: 'The same factor can be both a driver and a drag: engineer scarcity increases demand for better tooling, yet the shortage also limits how fast customers can deploy it.'
