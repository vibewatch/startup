  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cloud-robotics-software-tam
    missingEvidence: A public, non-paywalled market study that isolates orchestration and fleet-management software revenue within cloud robotics.
    whyItMatters: Without a clean software-layer denominator, TAM and SAM remain directional and are easy to overstate.
    diligencePath: Request Viam management's internal TAM model and compare it with any accessible analyst datasets or customer-budget bottoms-up cuts.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: viam-sam-penetration
    missingEvidence: Current customer count, deployed-machine count, annual recurring revenue, and vertical mix for production deployments.
    whyItMatters: These metrics are required to convert market attractiveness into a credible share and growth model.
    diligencePath: Ask management for cohort data by vertical, average contract value, retention, and the number of active paid accounts and deployed machines.
    relatedQuestionRefs:
    - QM025
  - type: missing-source
    severity: material
    topic: labor-substitution-roi
    missingEvidence: Comparable public ROI benchmarks by vertical for machine-software deployments similar to Viam's customer examples.
    whyItMatters: ROI timing is one of the main adoption gates, but public case studies rarely disclose denominator costs or realized payback periods.
    diligencePath: Collect customer references with quantified before-and-after labor, uptime, and utilization outcomes for manufacturing, marine, and food-service deployments.
    relatedQuestionRefs:
    - QM024
