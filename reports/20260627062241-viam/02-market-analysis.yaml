tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Viam
  rows:
  - - Connected machine software infrastructure
    - Fleet management, device configuration, remote monitoring, data pipelines, model deployment, developer tooling
    - Robot arms, sensors, compute modules, contract manufacturing, generic public cloud not tied to machines
    - Enterprise engineering teams, operations leaders, robotics product owners
    - Core market Viam is trying to own because its product abstracts heterogeneous hardware into one operating layer
  - - Industrial robotics application software
    - Production-line orchestration, machine vision workflows, uptime and telemetry tools, integrations across plants
    - Standalone industrial robots sold with closed OEM software bundles
    - Manufacturing engineering, plant operations, automation teams
    - Important near-term wedge because IFR data show dense installed bases and repeat fleet-management needs
  - - Service, field, and smart-machine operations
    - Remote support, mobile or distributed device management, multi-site workflow automation, sensor-to-action applications
    - Pure consumer gadgets and non-connected machinery with no software control plane
    - Field operations, venue operators, marine product teams, food-service operations
    - Matches Viam's public expansion beyond classic robotics into broader automation and IoT environments
  - - Adjacent hardware and component ecosystem
    - None for direct TAM purposes; treated as context only
    - Actuators, cameras, chips, batteries, integration labor, most hardware capex
    - OEM procurement and hardware supply-chain buyers
    - These categories influence adoption timing but should not be counted as Viam revenue opportunity
  notes: This boundary separates Viam's likely monetizable software layer from the much larger hardware and component economy that merely conditions adoption.
