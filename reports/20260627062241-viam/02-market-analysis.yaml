callouts:
- calloutType: insight
  title: Installed-machine density is the strongest public anchor for Viam's demand thesis
  body: IFR's installed-base statistics do not size Viam's software revenue directly, but they do prove that millions of machines already exist in environments where remote management, orchestration, and data capture can be monetized. That is a better starting point than generic TAM slides because it anchors the problem to real fleets.
  claimRefs:
  - CM004
  - CM030
  - CM038
- calloutType: risk
  title: A large robotics market does not automatically translate into a large software attach rate
  body: Broad robotics forecasts are encouraging, but Viam monetizes only the software slice after buyers have already funded hardware and integration. High capex, vertical-specific ROI, and weak public consensus on cloud-robotics software sizing all make the software attach rate the central market-risk variable.
  claimRefs:
  - CM011
  - CM024
  - CM031
  - CM034
  - CM040
- calloutType: recommendation
  title: Pressure-test Viam with deployment metrics, not only TAM narratives
  body: Before underwriting aggressive growth assumptions, investors should ask for active-customer count, deployed-machine count, average contract value, retention, and time-to-production by vertical. Those metrics would convert the current market thesis from a plausible narrative into a measurable penetration model.
  claimRefs:
  - CM017
  - CM033
  - CM037
  - CM040
