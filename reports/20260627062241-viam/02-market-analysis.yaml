- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: The demand case for Viam is real, but it is not frictionless. On the positive side, robotics adoption is being pushed by labor costs, AI integration, remote-management needs, and rising machine density in the regions and verticals that matter most. StartUs and The Robot Report both point to physical AI, humanoids, and cloud-connected fleet management as active 2025-2026 themes, which fits Viam's architecture. The counterweights are equally important. Hardware capex remains the first hurdle for many buyers, so software attach can be delayed until the underlying robot or smart-machine deployment already shows payback. Skilled robotics engineers remain scarce, which increases the value of easier tooling but also slows implementations. Supply-chain concentration in China keeps hardware ecosystems unevenly distributed, and OSHA's lack of robot-specific standards leaves buyers navigating a patchwork of general machine-safety obligations. These constraints do not invalidate the market,
    but they do mean adoption timing, budget ownership, and realized software spend will vary sharply by workflow.
