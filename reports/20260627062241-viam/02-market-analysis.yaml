chapter:
  number: 2
  title: Market Analysis
  summary: 'Independent market data support a large and still fast-growing robotics opportunity, with the broad market anchored around $46 billion in 2023 and multiple sources pointing to strong 2026-2032 expansion. For Viam, the most relevant opportunity is narrower than total robotics hardware spend: it is the software layer that manages heterogeneous connected machines, where public evidence shows real demand drivers but far weaker consensus sizing. That makes market direction favorable, while exact software-layer TAM and Viam''s current penetration remain material diligence gaps.'
sections:
- id: market-boundary-and-competitive-frame
  title: Market Boundary and Competitive Frame
  body: 'Viam should be sized against the software infrastructure budget for connected machines, not against the full bill of materials for every robot sold. Independent sources define robotics as a broad system that combines hardware, sensing, autonomy, control, and software, while Viam''s own platform materials describe a layer for configuring devices, deploying models, integrating components, and operating fleets across robots, smart machines, and IoT endpoints. That matters because the status quo substitutes are fragmented internal tooling, OEM-specific software stacks, and hyperscaler edge services rather than only another robot maker. The relevant market boundary therefore includes orchestration, fleet management, remote monitoring, data capture, and application development for machine operators. It excludes most hardware capex, component revenue, and general-purpose cloud spend that never touches a physical device. This framing also explains why IFR installation statistics are useful
    but incomplete: they anchor installed-machine density and buyer readiness, yet Viam''s eventual upside depends on how much recurring software value can be layered onto those fleets.'
  claimRefs:
  - CM004
  - CM012
  - CM013
  - CM014
  - CM019
  - CM030
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-the-addressable-market
  title: Sizing the Addressable Market
  body: 'The most defensible top-down anchor is the broader robotics market, then a narrower software-share lens. Benchmark International places global robotics at about $46 billion in 2023 with a 15.1% CAGR to $169.8 billion by 2032, while StartUs projects $88.3 billion by 2026 and highlights more than 540,000 annual installations. IFR adds a different but highly useful lens: the value of annual industrial robot installations hit $16.7 billion, 542,000 units were installed in 2024, and operational stock reached 4.664 million robots. These figures show both spending and deployed-base density, but they still overstate Viam''s direct revenue pool because software orchestration is only one slice of total robotics economics. The cloud robotics niche is directionally growing faster than robotics overall, yet the best explicit market reports are paywalled and do not publish a clean consensus for orchestration software alone. A reasonable synthesis is that Viam has access to a multibillion-dollar
    software-layer TAM, but exact TAM, SAM, and SOM must be treated as ranges rather than single-point facts.'
