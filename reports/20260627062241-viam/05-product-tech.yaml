      "id": "sdk-and-developer-ecosystem",
      "title": "SDK and developer ecosystem",
      "body": "The developer surface is unusually broad for a robotics-adjacent platform. Viam maintains first-party documentation or repositories for Python, TypeScript, C++, Java, Rust, Flutter, and Go-oriented workflows, and the public docs consistently position those SDKs as alternate client surfaces over the same machine API rather than as disconnected point tools. Python appears to be the most fully documented entry point, but the build-apps and connectivity documentation make clear that browser and mobile experiences are part of the intended product shape as well. This matters commercially because Viam is trying to meet customers where their existing teams already work: web teams can use TypeScript, embedded teams can use C++ or Rust, and enterprise integration teams can use Java. The public GitHub organization, CLI, pricing, and hosted docs together suggest a deliberate self-serve funnel, not just bespoke consulting. The open question is adoption depth: repository presence proves breadth, but the public record is still thin on downloads, production deployments by language, or comparative ecosystem usage metrics.",
