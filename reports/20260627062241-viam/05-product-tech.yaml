    {
      "id": "product-roadmap-and-maturity-assessment",
      "title": "Product roadmap and maturity assessment",
      "body": "Public evidence supports a view of Viam as a real, shipping platform that is still maturing from robotics-centric roots into a broader physical-world software layer. By 2024, TechCrunch was already describing the company as intentionally expanding beyond robotics into automation and IoT; by 2025, Series C materials explicitly framed the story around data and AI in the physical world. The present documentation set—runtime docs, SDK docs, pricing, training, vision, registry, CLI, and applied tutorials—shows a product with meaningful breadth rather than a single narrow feature. That breadth is Viam’s clearest differentiation: a customer can declare hardware, manage fleets, capture data, train or import models, and build applications through one platform. Still, maturity is uneven. Documentation quality and product breadth are ahead of the public proof on ecosystem scale, release cadence, reliability metrics, and security certifications. Investors should therefore treat the platform as technically credible and commercially promising, while recognizing that some enterprise-readiness evidence remains private or not yet published.",
