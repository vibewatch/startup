    "number": 5,
    "title": "Product & Technology",
    "summary": "Viam has assembled a technically coherent machine-software stack that spans edge runtime, cloud fleet management, higher-level services, and a multi-language SDK surface, with especially strong public evidence in documentation quality and developer onboarding. The main diligence tension is not whether a real platform exists—it does—but whether the public record is yet rich enough on reliability, security certifications, and ecosystem scale to satisfy procurement-heavy enterprise buyers."
  },
  "sections": [
    {
      "id": "platform-architecture-and-runtime-model",
      "title": "Platform architecture and runtime model",
      "body": "Viam’s product is best understood as a machine-software control plane rather than a single robot application. The documented runtime model starts with viam-agent installing, supervising, and updating viam-server on a target machine, after which the machine pulls JSON configuration from app.viam.com and retrieves modules from the Viam registry. That design matters because it moves heterogeneous hardware setup away from bespoke drivers and hand-maintained middleware toward declarative configuration, built-in services, and centrally managed fleet operations. The hardware layer exposes consistent component APIs for cameras, motors, arms, and sensors, while higher layers add motion planning, data capture, remote access, and deployment controls. Fleet documentation extends the same model to reusable fragments, version pinning, over-the-air updates, browser-based troubleshooting, and per-machine overrides. The result is a cloud-managed edge runtime that is materially more opinionated than a generic SDK bundle, but also more dependent on Viam’s own control plane and registry remaining available and trusted.",
