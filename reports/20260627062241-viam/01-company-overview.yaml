- id: capital-history-and-stakeholder-map
  title: Capital history and the stakeholder map
  body: Viam’s financing history is unusually legible for a private infrastructure company. Official materials establish a $12 million seed in June 2021, a $30 million Series A in February 2022, a $45 million Series B in March 2024, and a $30 million Series C in March 2025, taking disclosed lifetime capital to $117 million. Just as important, the investor roster shows continuity. Union Square Ventures appears at seed and re-emerges as the Series C lead, while Battery Ventures participates across multiple later rounds. Tiger Global validated the Series A, and Neurone added a Europe-oriented strategic channel in the latest round. That continuity matters because Viam is still building both product breadth and a commercial motion. The funding history supports the view that backers are underwriting a long-duration platform build rather than a quick asset flip. The main unresolved point is valuation. Official Series C materials omit a post-money figure, while secondary-market databases provide
    only lower-confidence estimates. That gap does not negate the capital history, but it materially limits precision when translating company momentum into an investment entry price.
