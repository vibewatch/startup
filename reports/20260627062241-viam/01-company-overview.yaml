- id: leadership-governance-and-footprint
  title: Leadership, governance, and footprint
  body: 'The leadership story in open sources remains highly founder-centric. Eliot Horowitz is not only the public face of Viam but also the strongest piece of founder-market-fit evidence: he brings a history of building an infrastructure platform at MongoDB and now applies that playbook to machine software. The about page and financing announcements place the company in New York City with a robotics lab, while also describing a distributed team across the United States and Europe. Investor endorsement is unusually visible relative to the rest of the governance record. Albert Wenger of Union Square Ventures appears repeatedly across official and investor materials, and his comments frame Viam as an open architecture layer that could unlock broader machine programmability. Still, governance transparency is incomplete. Public materials do not publish a full board roster, committee structure, or the exact oversight rights that come with repeated investor participation, so later diligence should
    treat key-person risk and board composition as unresolved.'
  claimRefs:
