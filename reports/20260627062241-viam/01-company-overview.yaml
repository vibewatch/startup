company:
  name: Viam
chapter:
  number: 1
  title: Company Overview
  summary: Viam is a New York-founded robotics-software platform company built by MongoDB co-founder Eliot Horowitz to make hardware programmable with modern developer workflows. Public sources support a well-documented funding path from a $12 million seed in 2021 to a $30 million Series C in March 2025 and show real customer traction in marine, manufacturing, venue tech, and food-service automation, but they do not disclose a board roster beyond marquee backers or a definitive post-money valuation for the latest round.
sections:
- id: identity-platform-and-origin
  title: Identity, platform, and origin story
  body: 'Viam should be understood first as a software infrastructure company for machines rather than as a robot OEM. Its official website, documentation, and investor materials consistently describe the product as a platform for building, deploying, and managing robotics applications across heterogeneous hardware. The conceptual model is familiar to modern software teams: a device runs viam-agent and viam-server, cloud configuration supplies the system of record, a central registry distributes modules and models, and engineers write control logic in familiar languages instead of stitching together bespoke middleware. That architecture is central to the company story because Eliot Horowitz explicitly frames Viam as a repeat of the problem pattern he saw before MongoDB scaled: fragmented tooling, too much infrastructure labor, and too many promising ideas dying before they ship. Viam’s message has also broadened over time. By 2024, TechCrunch described the company as deliberately expanding
    beyond firms that self-identify as robotics companies into IoT, smart home, industrial automation, and other sensor-actuator systems, which suggests management now sees the total addressable problem as any connected machine whose software stack is too brittle or too expensive to maintain.'
  claimRefs:
