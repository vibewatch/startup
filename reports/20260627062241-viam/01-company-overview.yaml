- calloutType: strength
  title: Infrastructure founder fit is unusually strong
  body: 'The strongest qualitative asset in the chapter is founder-market fit: Horowitz previously scaled developer infrastructure at MongoDB and is again attacking a fragmented technical stack with an abstraction-first product.'
  claimRefs:
