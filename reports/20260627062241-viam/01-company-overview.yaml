- id: traction-milestones-and-what-is-still-missing
  title: Traction milestones and what is still missing
  body: Public evidence is now strong enough to treat Viam as a real commercial platform company, not just a founder narrative. The March 2025 Series C announcement and the current customer-stories page together show named deployments or partnerships across marine technology, yacht manufacturing, venue operations, restaurant automation, workplace safety, and developer education. Kongsberg Discovery and Viking Yachts matter because they demonstrate Viam working in complex industrial environments with safety, sensor, and hardware-integration burdens. UBS Arena and Appetronix matter because they broaden the use-case set beyond factory automation into consumer-facing or service environments. The remaining limitation is not the absence of all customer proof; it is the absence of public operating metrics. Open sources still do not disclose revenue, ARR, active-customer count, or a current precise headcount. That means the company overview chapter can establish identity, capital, and traction anchors
    for later chapters, but it cannot by itself prove commercial scale efficiency or justify any particular valuation benchmark.
