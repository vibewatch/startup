  - CO046
- calloutType: insight
  title: Viam is selling a machine-software control plane, not a robot
  body: The company’s own materials and third-party coverage consistently position Viam as the software layer that standardizes machine behavior across hardware categories, which is why adjacent automation markets matter as much as traditional robotics.
  claimRefs:
