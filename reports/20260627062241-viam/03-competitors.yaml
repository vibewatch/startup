- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public pricing signal
  - Contract pattern visible in reviewed sources
  - Included scope signal
  - Implication
  rows:
  - - Viam
    - Public pricing page plus free entry point
    - Self-serve developer start with enterprise demo motion
    - Platform breadth across build, fleet, apps, and management
    - Viam is the clearest reviewed option for developer-led trial followed by enterprise sales
  - - Foxglove
    - Reviewed core surfaces emphasize product and docs more than normalized list pricing
    - Likely team and enterprise packaging, but exact public comparison terms were not normalized here
    - Observability, playback, search, and dataset workflow
    - Procurement may start as a point-tool purchase rather than a platform standardization decision
  - - Formant
    - Reviewed official surfaces do not expose simple list pricing
    - Enterprise or contact-sales pattern appears more visible than self-serve
    - Fleet operations, telemetry, and remote monitoring
    - Sales motion likely depends on operational ROI rather than developer experimentation
  - - Intrinsic
    - Reviewed official surfaces emphasize platform vision over public list pricing
    - Enterprise or strategic automation engagement pattern
    - Developer environment plus industrial capabilities
    - Commercial comparison is hard because buyer economics are not publicly simplified
  - - AWS / RoboMaker
    - Cloud-service pricing logic is adjacent, but a simple robotics bundle was not visible in reviewed sources
    - Usage-based cloud contracting inside broader AWS relationship
    - Simulation and robotics-adjacent cloud services
    - Bundling can mask true comparison because robotics cost rides inside a wider cloud agreement
  - - NVIDIA Isaac
    - Reviewed public surface prioritizes product access over normalized platform pricing
    - Platform and infrastructure economics likely tied to NVIDIA ecosystem choices
    - Simulation, AI training, and robotics software components
    - Budget may attach to GPU and AI spend rather than a direct fleet-operations line item
  - - ROS 2
    - Open-source access with no vendor license headline
    - Internal engineering labor replaces software subscription
    - Middleware and package ecosystem
    - Lowest nominal license cost, but highest integration burden
  - - PTC Kepware
    - Public industrial-software packaging is not normalized to robotics use cases in reviewed sources
    - Enterprise software contract pattern
    - Connectivity and OT integration
    - Incumbent alternatives can enter through existing industrial software budgets rather than a net-new robotics platform line item
