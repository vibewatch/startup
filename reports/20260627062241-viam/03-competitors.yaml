callouts:
- calloutType: strength
  title: Viam is broader than the pure point-solution peers
  body: The strongest competitive argument supported by public sources is not that Viam beats every rival on every feature, but that it spans more of the machine-software workflow than Foxglove or Formant while still remaining developer oriented.
  claimRefs:
  - CP013
  - CP025
  - CP029
  - CP030
- calloutType: risk
  title: The hardest threats come from adjacent giants, not only startups
  body: Intrinsic, AWS, Google Cloud, and NVIDIA can each attack one side of the stack with far deeper capital and channel power than Viam, which makes adjacency pressure as important as direct startup competition.
  claimRefs:
  - CP021
  - CP022
  - CP023
  - CP031
- calloutType: insight
  title: ROS2 keeps this market more multi-homeable than classic enterprise software
  body: Because sophisticated teams can still assemble a ROS2-centric stack and selectively add vendor tools, Viam’s lock-in depends more on workflow convenience and speed than on irreversibly proprietary infrastructure.
  claimRefs:
  - CP024
  - CP032
- calloutType: recommendation
  title: Ask management for win-loss and realized pricing data before underwriting moat strength
  body: Public materials are good enough to map the field, but not good enough to prove that Viam’s breadth is already winning commercially against Foxglove, Formant, Intrinsic, or DIY alternatives at attractive pricing.
  claimRefs:
  - CP033
  - CP038
  - CP039
  - CP040
