- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Hardware abstraction + module registry
    - ROS2 and incumbents can close connector gaps over time
    - High
    - Connector breadth is useful only while integration remains meaningfully easier than DIY
    - Request win/loss data showing deployment-time savings versus ROS2 and incumbent stacks
  - - Unified workflow breadth
    - Buyers can unbundle into Foxglove, Formant, cloud services, and internal code
    - High
    - If customers buy point tools separately, Viam loses the platform premium
    - Ask for multi-product attach rates and evidence of platform expansion after initial pilot
  - - Developer-friendly onboarding
    - Intrinsic and hyperscalers can improve onboarding with larger engineering budgets
    - Medium-High
    - Ease of use is valuable but easier to copy than ecosystem position
    - Request product telemetry on time-to-first-machine and conversion from free to paid
  - - Data flywheel from deployed fleets
    - Foxglove or Formant can own observability or telemetry layers before Viam does
    - Medium
    - Owning the data plane can weaken Viam’s learning and upsell loop
    - Ask which percentage of customers use Viam as the system of record for machine data
  - - Cloud-neutral control plane
    - AWS and Google can bundle adjacent robotics capability into larger contracts
    - High
    - Distribution leverage can trump product elegance in enterprise procurement
    - Request cloud concentration by customer and evidence of displacement wins against bundled offers
  - - Industrial partner proof
    - Incumbent OEM and OT channels can still steer buyers toward familiar vendors
    - Medium
    - Compatibility proof helps, but channel ownership still matters
    - Ask for pipeline sourced through Universal Robots or other ecosystem partners
  - - Transparent value capture
    - Public pricing opacity across the category makes ROI comparison hard
    - Medium
    - Weak price discovery slows buyer conviction and investor benchmarking
    - Request realized pricing bands, gross-margin ranges, and deal-approval thresholds by segment
  notes: This register translates observed competitor evidence into diligence priorities; severity is ordinal and meant for underwriting triage, not audited probability.
