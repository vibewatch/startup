summary:
  headline: >-
    Viam offers a credible and differentiated machine-software control plane backed by strong founder-market fit and
    growing enterprise proof points, but undisclosed revenue and valuation make it a track rather than buy at this
    stage.
  overallScore: 6.5
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: unknown
