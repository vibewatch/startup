      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real but still developing moat. Viam appears strongest where customers
              value one layer that can unify heterogeneous hardware, remote operations, updates, applications, and data
              collection without forcing a ROS2-heavy internal build. That is a defensible position against point tools.
              The weakness is that much of the moat remains behavioral rather than regulatory or structurally locked.
              Foxglove can own the data and debugging layer, Formant can own fleet operations, NVIDIA can own simulation
              and AI training, and hyperscalers can commoditize cloud plumbing. Intrinsic is the most credible
              single-vendor displacement risk because Google can fund platform depth for years while targeting
              industrial automation buyers that already tolerate complex deployments. The hardest analytical gap is
              scale opacity: Foxglove, Formant, and Intrinsic do not publicly disclose enough customer, revenue, or
              usage data to prove whether Viam’s breadth is already a durable commercial advantage or simply a broader
              product surface in an early market.
