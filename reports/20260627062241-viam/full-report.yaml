      - number: '8.2'
        title: Comparable valuation framework
        blocks:
          - type: paragraph
            body: >-
              A conventional DCF is impossible here because Viam does not disclose revenue, margin, or cash-flow data.
              The better public-market anchor is therefore comparable multiples, starting with UiPath as the cleanest
              primary reference. UiPath is not a robotics company, but it is a workflow-automation platform with
              developer-led adoption and software-style economics, making it more relevant than pure industrial
              incumbents. At roughly $5.45 billion of market capitalization and $1.43 billion of annual revenue, UiPath
              trades around 3.8x revenue. Rockwell Automation, Teradyne, and Symbotic widen the frame. Rockwell shows
              how the market prices large, slower-growth industrial automation incumbents; Teradyne shows what a scaled
              automation-plus-hardware platform can command; Symbotic shows the premium available to automation
              companies when AI narrative and deployment scale are both visible. None is a perfect analogue, but
              together they bound the discussion: Viam deserves neither a commodity industrial multiple nor a heroic
              premium without clearer proof of repeatable software revenue.
            claimRefs:
              - CV004
