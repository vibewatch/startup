chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and origin story
        blocks:
          - type: paragraph
            body: >-
              Viam should be understood first as a software infrastructure company for machines rather than as a robot
              OEM. Its official website, documentation, and investor materials consistently describe the product as a
              platform for building, deploying, and managing robotics applications across heterogeneous hardware. The
              conceptual model is familiar to modern software teams: a device runs viam-agent and viam-server, cloud
              configuration supplies the system of record, a central registry distributes modules and models, and
              engineers write control logic in familiar languages instead of stitching together bespoke middleware. That
              architecture is central to the company story because Eliot Horowitz explicitly frames Viam as a repeat of
              the problem pattern he saw before MongoDB scaled: fragmented tooling, too much infrastructure labor, and
              too many promising ideas dying before they ship. Viam’s message has also broadened over time. By 2024,
              TechCrunch described the company as deliberately expanding beyond firms that self-identify as robotics
              companies into IoT, smart home, industrial automation, and other sensor-actuator systems, which suggests
              management now sees the total addressable problem as any connected machine whose software stack is too
              brittle or too expensive to maintain.
