  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Viam’s revenue design is clearer than its revenue scale. Official pages show a freemium entry point with
              no credit card required and only the first $5 of monthly cloud services included before usage pricing
              begins, which supports a developer-led land-and-expand motion rather than a pure top-down seat-sale model.
              The price card monetizes concrete machine workloads including binary storage, synchronized storage,
              compute time, export volume, and notifications, so the cloud product behaves like infrastructure software
              whose bill expands with usage. At the same time, Viam is not only a software company in practice. The same
              pricing surface advertises robotic surface finishing systems starting at $120,000 per year for a standard
              two-arm cell, creating a second stream that looks closer to applied automation or robotics-as-a-service.
              That blend matters for underwriting. The cloud layer likely carries the cleaner long-term margin path,
              while hardware-linked deployments can accelerate proof of value and ACV but introduce implementation,
              support, and utilization risk that make blended revenue quality less predictable than pure SaaS.
