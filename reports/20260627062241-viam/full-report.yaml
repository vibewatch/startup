          - type: callout
            title: A large robotics market does not automatically translate into a large software attach rate
            body: >-
              Broad robotics forecasts are encouraging, but Viam monetizes only the software slice after buyers have
              already funded hardware and integration. High capex, vertical-specific ROI, and weak public consensus on
              cloud-robotics software sizing all make the software attach rate the central market-risk variable.
            calloutType: risk
            claimRefs:
