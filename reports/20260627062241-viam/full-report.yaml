      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory picture is risky less because Viam itself is a regulated device maker and more because its
              customers deploy software onto machines that create safety, privacy, and cross-border compliance
              obligations. OSHA's robotics materials are especially important because they show both sides of the issue
              at once: robot safety is real enough that OSHA documents recurring injury modes during programming,
              maintenance, testing, setup, and adjustment, yet OSHA also states that there are no robotics-specific
              federal standards. That ambiguity can slow enterprise buying because customers still need internal safety,
              legal, and insurance teams to decide what good-enough compliance looks like. Viam's own legal posture is
              conventional for SaaS but still relevant to risk. The Terms of Service include arbitration and
              class-action-waiver language, and the Privacy Policy confirms standard data collection and processing
              practices. Those pages do not signal misconduct, but they do show that dispute resolution and privacy
              governance matter to the product. Europe raises the bar further. Public company materials say Viam has
              team members across Europe and traction in Italy and the broader region, which means growth increasingly
              intersects with GDPR-style expectations and more heterogeneous partner environments.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR023
              - CR024
          - type: table
