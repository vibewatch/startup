      - number: '2.3'
        title: Buyers, Segments, and Go-to-Market
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Viam is already selling into a wide mix of machine-intensive environments rather
              than a single robotics niche. Its customer and partner materials show proof points in manufacturing,
              marine, food service, venue operations, climate or industrial systems, education, and broader developer
              tooling. Those use cases imply different budget owners. Manufacturing deployments usually require
              engineering and operations sponsorship because uptime, safety, and integration with legacy equipment
              matter as much as raw automation. Marine and industrial sensor workflows skew toward product, innovation,
              or field-operations teams that need remote visibility and edge intelligence. Food-service and venue
              installations pull operations leaders closer to the decision because the value proposition centers on
              workflow repeatability and labor leverage. Viam's pricing, documentation, and hiring signals together
              support a hybrid go-to-market motion: low-friction developer onboarding expands the funnel, then
              enterprise sales and solution engineering convert production deployments. That is attractive because it
              lowers top-of-funnel acquisition cost, but it also means sales cycles can lengthen as the company crosses
              verticals with different compliance, integration, and ROI standards.
