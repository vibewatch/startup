      - number: '2.2'
        title: Sizing the Addressable Market
        blocks:
          - type: paragraph
            body: >-
              The most defensible top-down anchor is the broader robotics market, then a narrower software-share lens.
              Benchmark International places global robotics at about $46 billion in 2023 with a 15.1% CAGR to $169.8
              billion by 2032, while StartUs projects $88.3 billion by 2026 and highlights more than 540,000 annual
              installations. IFR adds a different but highly useful lens: the value of annual industrial robot
              installations hit $16.7 billion, 542,000 units were installed in 2024, and operational stock reached 4.664
              million robots. These figures show both spending and deployed-base density, but they still overstate
              Viam's direct revenue pool because software orchestration is only one slice of total robotics economics.
              The cloud robotics niche is directionally growing faster than robotics overall, yet the best explicit
              market reports are paywalled and do not publish a clean consensus for orchestration software alone. A
              reasonable synthesis is that Viam has access to a multibillion-dollar software-layer TAM, but exact TAM,
              SAM, and SOM must be treated as ranges rather than single-point facts.
