      - number: '8.3'
        title: Scenario analysis and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more honest than false precision for Viam. In the bull case, Viam becomes a default
              control plane for robotics and connected machines, benefits from channel leverage through Tech Mahindra
              and hardware relevance through Universal Robots and Viking-style deployments, and reaches at least $150
              million of ARR by 2028. Applying an 8-10x revenue multiple to that software outcome yields roughly
              $1.2-1.5 billion of value. In the base case, the company grows into a meaningful but narrower enterprise
              platform, reaches around $50-80 million of ARR, and exits through acquisition or a later private round at
              roughly 5-6x revenue, implying about $250-480 million of value. In the bear case, Viam struggles to
              convert public proof points into broad recurring revenue, competitive pressure from Intrinsic and
              incumbents compresses enthusiasm, and the company faces a flat or down round, leading to a sub-$200
              million strategic outcome or acqui-hire logic. Because current revenue is undisclosed, small changes in
              assumed ARR dominate every valuation output.
            claimRefs:
              - CV013
