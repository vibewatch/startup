      - number: '5.4'
        title: Trust, security, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The trust picture is mixed. On the positive side, Viam’s deployment model is operationally pragmatic:
              WebRTC connectivity and browser-based remote access remove much of the VPN and port-forwarding friction
              that normally slows distributed machine deployments, while offline queueing and bandwidth-aware data sync
              acknowledge real edge conditions. The company also publishes formal terms, privacy disclosures, pricing,
              and multiple technical docs, which is better than many younger robotics startups. But enterprise diligence
              would still find material gaps. Public materials reviewed for this chapter do not disclose a SOC 2 report,
              ISO 27001 certification, a public uptime dashboard, or a formal SLA for viam-server, app.viam.com, or the
              registry. The terms and privacy policy confirm legal scaffolding and standard analytics collection, yet
              they are not substitutes for auditable security controls. This means Viam appears ready for developer
              experimentation and selected industrial deployments, but still asks larger buyers to underwrite some trust
              and reliability verification through direct diligence rather than public evidence alone.
