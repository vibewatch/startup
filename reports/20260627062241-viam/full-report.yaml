      - number: '8.5'
        title: Thesis-break triggers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The monitoring framework matters as much as the recommendation. The fastest way to break the thesis would
              be evidence that Viam cannot translate partner and customer logos into repeatable software economics: a
              flat or down round, weak customer references, or signs that enterprise partners view Viam mainly as a
              bespoke integration layer would all compress valuation sharply. The positive version is equally concrete.
              The company can move from track toward buy if it discloses ARR, revenue growth, gross margin, customer
              diversification, and next-round terms that show the business is scaling more like software than like
              project work. That is why the first diligence asks are financial, not architectural. Investors need
              revenue, gross margin, burn, runway, customer concentration, board composition, cap-table terms, and
              direct customer references. The Tech Mahindra master agreement also matters because channel leverage is
              only additive if it expands distribution without giving away economics or control over the customer
              relationship.
