      - number: '3.3'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Viam’s lock-in is meaningful but not absolute. It gains stickiness when a customer standardizes on its
              registry, deployment model, remote operations, and developer tooling, especially once applications and
              machine configurations are already running on the platform. Even so, the reviewed sources point to a
              relatively multi-homeable market. ROS2 remains the status-quo substitute for sophisticated engineering
              teams, and Viam itself positions as an easier software layer rather than a closed robotics operating
              system. That lowers migration friction because some teams can keep ROS2 components while using Viam for
              orchestration or applications. Distribution is another weak point. AWS and Google Cloud can attach
              robotics-adjacent functionality to broader infrastructure contracts, while NVIDIA can win the simulation
              and training budget before control-plane choices are finalized. Universal Robots helps Viam counter that
              dynamic by proving compatibility with known industrial hardware, but the partnership does not by itself
              neutralize hyperscaler bundling or the willingness of advanced buyers to keep assembling their own stack.
            claimRefs:
