  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Directed map showing how architecture, competition, and financing risks can cascade into slower adoption and
      weaker fundraising leverage.
    data:
      nodes:
        - id: n1
          label: Cloud-managed control plane
          description: >-
            Centralized config, connectivity, registry, and fleet workflows create leverage and shared points of
            failure.
        - id: n2
          label: Operational outage or bad rollout
          description: A control-plane issue or flawed fleet update disrupts remote operations across more than one machine.
        - id: n3
          label: Customer trust erosion
          description: Downtime, QA mistakes, or security concerns increase diligence friction and slow expansion.
        - id: n4
          label: Slower deployment growth
          description: Customers defer broader rollout, keep more work on ROS or point tools, or demand deeper proof first.
        - id: n5
          label: Weaker revenue visibility
          description: Usage-based economics look less durable when fleets expand more slowly than expected.
        - id: n6
          label: More financing dependence
          description: If growth lags while infrastructure spend continues, the next raise matters more.
        - id: n7
          label: Strategic vulnerability
          description: Larger rivals can use time, distribution, and capital to narrow Viam's differentiation.
      edges:
        - from: n1
          to: n2
          label: shared architecture amplifies blast radius
        - from: n2
          to: n3
          label: visible incident undermines trust
        - from: n3
          to: n4
          label: buyers slow rollout
        - from: n4
          to: n5
          label: usage growth weakens
        - from: n5
          to: n6
          label: cash needs stay external
        - from: n6
          to: n7
          label: time advantage shifts to larger rivals
        - from: n3
          to: n7
          label: trust gaps strengthen substitutes
    approximationNotes: >-
      The graph is simplified to highlight the most plausible risk cascades visible from public product and financing
      materials; actual transmission would depend on customer concentration, uptime performance, and internal response
      quality.
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR027
      - CR034
      - CR036
      - CR037
      - CR038
      - CR039
