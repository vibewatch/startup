  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Viam does not face a single clean competitor set because buyers can solve the same machine-software job in
              several ways. The most direct peers are Foxglove and Formant, which both sell developer-facing robotics
              software but emphasize narrower slices of the workflow: Foxglove on multimodal data, visualization, and
              observability, and Formant on fleet operations, telemetry, and remote monitoring. The next ring is made up
              of broader platform challengers and adjacencies. Intrinsic is the clearest direct platform threat because
              it combines workflow software with robotics capabilities and Google sponsorship. AWS, Google Cloud, and
              NVIDIA are less complete as end-to-end alternatives in the reviewed materials, but they can compete
              aggressively in simulation, AI, cloud management, and bundled infrastructure. The substitute layer is
              still ROS2 and internal build. That means Viam’s real contest is not only vendor versus vendor; it is also
              full-platform adoption versus customer willingness to assemble point tools and open-source middleware
              themselves.
