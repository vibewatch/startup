        title: Exhibits
        blocks:
          - type: callout
            title: Installed-machine density is the strongest public anchor for Viam's demand thesis
            body: >-
              IFR's installed-base statistics do not size Viam's software revenue directly, but they do prove that
              millions of machines already exist in environments where remote management, orchestration, and data
              capture can be monetized. That is a better starting point than generic TAM slides because it anchors the
              problem to real fleets.
            calloutType: insight
            claimRefs:
