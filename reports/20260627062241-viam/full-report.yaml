    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Founder concentration
        - Leadership announcement or role change
        - >-
          Eliot Horowitz departs, becomes materially less involved, or a successor appears without clear continuity
          evidence
        - Immediate thesis review focused on product ownership, fundraising capacity, and key-customer confidence
      - - Financing dependency
        - Next primary round or insider participation
        - Repeat lead investors decline to support the next raise or financing occurs at obviously stressed terms
        - Raise risk rating and discount moat claims until customer and revenue proof improve
      - - Cloud/control-plane outage
        - Public incident, customer complaint cluster, or disclosed service interruption
        - A material outage disrupts config, deployment, or remote operations across multiple fleets
        - Reassess operational resilience and demand formal uptime/incident controls before more capital
      - - Competitive parity
        - Major rival launch or customer-switch evidence
        - Intrinsic, NVIDIA, AWS, Google, or a ROS-centered integrator reaches near-parity on core fleet/app workflow
        - Downgrade differentiation thesis and revisit pricing power assumptions
      - - Channel underperformance
        - Partnership proof cadence
        - >-
          No meaningful customer or expansion proof emerges from Tech Mahindra, UR, or Europe channel relationships over
          the next 12-18 months
        - Treat partner narrative as soft signal rather than revenue engine and tighten growth assumptions
    notes: >-
      These kill criteria are intentionally observable from the outside so an investor can track them without access to
      Viam's internal dashboards or board materials.
