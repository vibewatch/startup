            body: >-
              The developer surface is unusually broad for a robotics-adjacent platform. Viam maintains first-party
              documentation or repositories for Python, TypeScript, C++, Java, Rust, Flutter, and Go-oriented workflows,
              and the public docs consistently position those SDKs as alternate client surfaces over the same machine
