  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Viam is straightforward: a credible founder-led robotics software platform has already
              raised meaningful capital, ships a broad control-plane architecture, and has enough public proof to show
              the product is not just a demo. Official materials confirm $117 million of total disclosed funding and a
              $30 million Series C in March 2025, while public customer and partner references span Viking Yachts, UBS
              Arena, CompScience, Tech Mahindra, and Universal Robots. That combination supports real option value
              because the company could still become a standard orchestration layer across heterogeneous machines. The
              anti-thesis is equally important. Viam does not publicly disclose revenue, ARR, gross margin, customer
              count, NRR, burn, or the post-money valuation of its latest round. That means investors can admire the
              architecture and market narrative without knowing whether the business is tracking like a software
              platform, an integration-heavy applied automation company, or something in between. In practical IC terms,
              the call is not whether Viam is interesting. It is whether public evidence supports paying up now. Today
              it does not.
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV017
              - CV018
              - CV019
