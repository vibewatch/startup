  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Competitive Frame
        blocks:
          - type: paragraph
            body: >-
              Viam should be sized against the software infrastructure budget for connected machines, not against the
              full bill of materials for every robot sold. Independent sources define robotics as a broad system that
              combines hardware, sensing, autonomy, control, and software, while Viam's own platform materials describe
              a layer for configuring devices, deploying models, integrating components, and operating fleets across
              robots, smart machines, and IoT endpoints. That matters because the status quo substitutes are fragmented
              internal tooling, OEM-specific software stacks, and hyperscaler edge services rather than only another
              robot maker. The relevant market boundary therefore includes orchestration, fleet management, remote
              monitoring, data capture, and application development for machine operators. It excludes most hardware
              capex, component revenue, and general-purpose cloud spend that never touches a physical device. This
              framing also explains why IFR installation statistics are useful but incomplete: they anchor
              installed-machine density and buyer readiness, yet Viam's eventual upside depends on how much recurring
              software value can be layered onto those fleets.
            claimRefs:
              - CM004
              - CM012
              - CM013
              - CM014
              - CM019
              - CM030
