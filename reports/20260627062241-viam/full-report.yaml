          - type: callout
            title: Founder concentration is investable only if bench depth is stronger than the public record shows
            body: >-
              Horowitz's background is a real asset, but the chapter's people risk comes from missing evidence on
              delegated leadership rather than from any visible founder weakness. That gap is fixable in diligence, but
              until it is fixed, it should be priced as real concentration risk.
            calloutType: insight
