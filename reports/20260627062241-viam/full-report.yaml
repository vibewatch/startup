      - number: '5.3'
        title: Module registry and ML capabilities
        blocks:
          - type: paragraph
            body: >-
              Viam’s registry and ML surfaces turn the platform from a connectivity layer into a reusable application
              substrate. The registry is documented as the distribution point for modules, machine-learning models, and
              training scripts, all with semantic versioning, which means customers can pin or update dependencies
              through the same control model used for runtime deployment. Training and vision documentation show a
              two-part machine-learning story: teams can collect data from deployed machines, train models on captured
              data or bring external TensorFlow, PyTorch, and ONNX models, then redeploy those models back to the fleet
              for on-device inference. The vision service and motion-planning service indicate that Viam already bundles
              higher-level capabilities above raw device APIs. The air-quality tutorial is valuable here because it
              demonstrates a concrete multi-sensor pattern—capture, sync, analyze, and manage at fleet scale—rather than
              only abstract product claims. The biggest unresolved issue is ecosystem depth: public docs make the
              registry concept clear, but they do not quantify the number of modules, the split between Viam-maintained
              and community modules, or the size of third-party adoption.
