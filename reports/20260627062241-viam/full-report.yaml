    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Flat or down financing round
        - Next primary round prices at or below the implied prior level.
        - Would signal weaker-than-expected traction or investor appetite.
        - Pause any investment work and reassess downside.
      - - Weak customer references
        - Named customers describe bespoke integration rather than repeatable platform value.
        - Would undermine the software-multiple case.
        - Shift view toward services-heavy outcome.
      - - Partner economics deteriorate
        - Channel terms show margin giveaway or customer ownership loss.
        - Distribution would expand while value capture shrinks.
        - Discount strategic premium assumptions.
      - - Competitive displacement
        - Intrinsic, hyperscalers, or incumbents win lighthouse accounts Viam should win.
        - Would reduce category-standard odds and compress exit multiples.
        - Lower bull-case probability materially.
      - - Leadership or governance concern
        - Unexpected founder departure or investor-rights overhang emerges in diligence.
        - Key-person and control risk would rise sharply.
        - Require governance remediation before proceeding.
    notes: >-
      These are monitorable thesis-break signals rather than predictions; several require private diligence because
      public disclosure may lag.
