  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Key assumptions
      - Valuation logic
      - Indicative value
    rows:
      - - Bull
        - Low but real
        - >-
          Viam becomes a ROS-replacement standard, ARR exceeds $150M by 2028, and partner channels accelerate enterprise
          adoption.
        - 8-10x revenue multiple on software-style ARR plus strategic scarcity premium.
        - $1.2B-$1.5B
      - - Base
        - Most plausible from public evidence
        - >-
          Viam reaches $50-80M ARR, mixes software with some implementation-heavy deployments, and exits via acquisition
          or Series D.
        - 5-6x revenue multiple on moderate-growth enterprise platform.
        - $250M-$480M
      - - Bear
        - Material downside path
        - Company fails to scale beyond niche deployments, competition intensifies, and next round is flat or down.
        - Bridge-round or strategic-fire-sale logic rather than premium software multiple.
        - <$200M
      - - Funding-backsolve range
        - Directional only
        - >-
          Series C platform companies with $117M total raised often price several multiples above round size, but
