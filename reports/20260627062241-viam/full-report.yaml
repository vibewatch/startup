      - number: '7.4'
        title: Financial, model, and partner risks
        blocks:
          - type: paragraph
            body: >-
              Financial risk at Viam comes mostly from opacity plus ambition. Public sources confirm meaningful
              fundraising, but they do not disclose revenue, gross margin, burn, or a concrete path to profitability.
              That leaves outside investors inferring whether a $30 million Series C was a growth round, a bridge-like
              extension, or simply enough capital to buy time for the next proof point. The pricing model adds
              uncertainty because usage-linked economics can expand nicely with deployed fleets but can also flatten or
              reverse if customers limit data volumes, slow rollouts, or keep part of the workflow on open-source
              tooling. The partner side is similarly mixed. Universal Robots validates industrial relevance, yet that
              proof sits inside a Teradyne-owned ecosystem that has recently shown softer robotics results. Tech
              Mahindra and Neurone potentially expand channels, but both relationships are earlier-stage from a
              public-evidence standpoint than investors would like. In other words, Viam has enough partner momentum to
              justify interest, but not enough disclosed conversion data to treat partnerships as de-risked revenue
              machinery. If execution stretches, the company may need another financing event before the platform's
              commercial durability is clearly visible.
            claimRefs:
