  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive and market risks
        blocks:
          - type: paragraph
            body: >-
              Viam's most serious external risk is not that robotics software demand disappears; it is that the company
              is trying to build a broad machine-software control plane in a market where buyers can still assemble
              narrower alternatives from giant vendors or open source. Intrinsic is the cleanest direct platform threat
              because it pairs a similar developer-platform ambition with Google ownership and balance-sheet patience.
              NVIDIA matters for a different reason: even without matching Viam feature for feature, its physical-AI
              tooling, simulation, and capital base let it subsidize adjacent workflows that can capture budget first.
              AWS and Google can compete through distribution, not only product shape, by folding robotics-adjacent
              functionality into existing infrastructure contracts. ROS 2 remains the stubborn baseline substitute
              because advanced teams already know it and can keep spending engineering labor instead of paying a
              platform vendor. Market structure adds another layer of risk. The Robot Report's 2026 outlook highlights
              recent failures and slower sales in parts of robotics while also showing Asia-Pacific dominates
              installations, whereas Viam's visible traction remains concentrated in the US and Europe. That combination
              means Viam faces both competitive compression and geographic concentration at the same time.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR025
