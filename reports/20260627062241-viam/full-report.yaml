      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The biggest risk is strategic compression, not technology inexistence
            body: >-
              The public record strongly supports that Viam has a real platform. The harder question is whether that
              platform can compound into durable leverage before better-capitalized rivals or free substitutes close
              enough of the workflow gap to flatten pricing power and fundraising leverage.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR022
              - CR039
          - type: callout
            title: Cloud architecture is a strength and a shared-point-of-failure
            body: >-
              Viam's remote management story only works because configuration, data, and update workflows are
              centralized. The same centralization means a material outage or bad rollout can become a trust event
              faster than it would in a more fragmented self-managed stack.
            calloutType: risk
            claimRefs:
              - CR018
              - CR019
              - CR020
