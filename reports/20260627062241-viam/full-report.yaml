      - number: '7.3'
        title: Operational and technical risks
        blocks:
          - type: paragraph
            body: >-
              Viam's product architecture creates real operational leverage, but it also concentrates operational risk.
              The platform is documented as a cloud-managed runtime in which machines receive configuration centrally,
              use common connectivity patterns, and pull modules through Viam's own software distribution surfaces. That
              helps with deployment speed, yet it also means an outage or control-plane error can affect many machines
              at once. The documentation softens that concern rather than eliminating it: offline queueing and later
              synchronization show the company has thought about bad network conditions, but those features still imply
              delayed cloud reconciliation instead of full independence from the hosted system. The same pattern appears
              in fleet management. Version pinning, rollout, and rollback controls are prudent mitigation tools, but
              they also reveal that Viam can coordinate changes across distributed fleets, which raises the downside of
              a bad fragment, bad module, or mistaken configuration. Hardware agnosticism is another two-sided risk. It
              is the product's core value proposition, yet supporting many devices increases QA burden and makes
              reliability harder to generalize than in a vertically integrated stack. Finally, open-source RDK
              distribution under Apache-2.0 helps adoption and partner trust while lowering hard lock-in if another
              vendor or integrator wants to fork core pieces of the runtime.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
