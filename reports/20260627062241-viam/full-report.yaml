companyProfile:
  summary: >-
    Viam is a New York-based software infrastructure company founded in 2020 by MongoDB co-founder and former CTO Eliot
    Horowitz. The company builds a cloud-connected platform that enables engineers to build, deploy, and manage robotics
    and automation applications across any hardware using familiar software development workflows. Viam has raised $117
    million through a Series C in March 2025 and counts named customers across marine manufacturing (Viking Yachts,
    Kongsberg Discovery), venue technology (UBS Arena), food service automation (Appetronix), workplace safety
    (CompScience), and enterprise distribution through a June 2026 Tech Mahindra partnership.
  foundedDate: '2020-01-01'
  founders:
    - name: Eliot Horowitz
      role: Founder and CEO
      background: Co-founder and former CTO of MongoDB; 13 years building developer infrastructure at scale.
      claimRefs:
        - CO002
        - CO003
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >-
    Cloud-based robotics and automation platform comprising viam-server (edge runtime), viam-agent (device manager),
    fleet management, data capture and sync, ML model training and deployment, computer vision services, motion
    planning, a module registry, and SDKs in Python, TypeScript, Go, C++, Flutter, Rust, and Java. Also offers
    hardware-integrated robotic surface-finishing systems for manufacturing.
  customerFocus: >-
    Enterprise engineering teams, robotics startups, and manufacturing operators seeking to build and manage fleets of
    intelligent machines without bespoke infrastructure.
  businessModel: >-
    Freemium cloud SaaS with usage-based pricing (data storage, compute, notifications) plus hardware solution packages
    for robotic surface finishing starting at $120,000 per year.
  stage: Series C
  fundingStatus: >-
    $30M Series C closed March 2025 led by Union Square Ventures with Battery Ventures and Neurone; $117M total
    disclosed. Post-money valuation not publicly disclosed.
  disclosureProfile: private-undisclosed
