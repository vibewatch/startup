  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Platform quality
        - Viam has a broad machine-software stack with real partner and customer proof.
        - Breadth does not prove scalable software economics or durable lock-in.
        - Disclose ARR growth and customer retention by cohort.
      - - Capital base
        - $117M raised gives management time to execute and iterate.
        - Large funding without disclosed revenue can also mask weak capital efficiency.
        - Share burn, runway, and cash balance.
      - - Distribution
        - Tech Mahindra and Universal Robots expand reach into enterprise automation channels.
        - Channel-heavy growth can compress margin or turn Viam into an integration layer.
        - Show partner-sourced pipeline and blended gross margin.
      - - Comparable support
        - UiPath, Symbotic, and automation peers show public markets will reward category leaders.
        - Those peers are far larger and better disclosed than Viam.
        - Show Viam’s actual ARR and customer diversification.
      - - Exit pathways
        - Strategic acquirers exist across cloud, industrial, and automation ecosystems.
        - IPO readiness is distant and M&A value could be capped if revenue remains niche.
        - Demonstrate repeatable enterprise software adoption.
      - - Current price discipline
        - Uncertain price argues for patience, not dismissal.
        - Unknown price means investors may already be paying for upside that is not yet proven.
        - Disclose Series C terms and current round expectations.
    notes: >-
      Thesis and anti-thesis are synthesized from public sources across funding, product, partners, and valuation
      comparables rather than taken from a single document.
