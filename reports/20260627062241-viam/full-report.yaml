              founder narrative. The March 2025 Series C announcement and the current customer-stories page together
              show named deployments or partnerships across marine technology, yacht manufacturing, venue operations,
              restaurant automation, workplace safety, and developer education. Kongsberg Discovery and Viking Yachts
