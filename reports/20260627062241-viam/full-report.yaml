      - number: '3.2'
        title: Capability and buyer comparison
        blocks:
          - type: paragraph
            body: >-
              The most important comparison is scope, not branding. Viam’s own surfaces describe a platform that spans
              fleet management, deployment, updates, app building, and hardware abstraction. That breadth matters
              because Foxglove and Formant each look stronger in specific sub-problems than in the full lifecycle.
              Foxglove’s reviewed materials emphasize data logging, playback, search, and dataset workflows for robotics
              and physical AI teams, while Formant’s materials emphasize operational visibility for deployed fleets.
              Intrinsic sits closer to Viam in ambition because it packages an all-in-one developer environment and
              industrial automation capabilities, but its visible focus remains tilted toward industrial robot
              workflows. AWS, Google Cloud, and NVIDIA each bring strong adjacent capabilities, yet the reviewed public
              materials still suggest buyers would assemble more of their own application workflow around those tools.
              The result is a market where Viam’s product story is differentiated by integration breadth, while several
              rivals still win on depth in a narrower technical wedge or on pre-existing cloud relationships.
