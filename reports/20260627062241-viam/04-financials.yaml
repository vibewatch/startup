    {
      "id": "financial-gaps-and-diligence-blockers",
      "title": "Financial gaps and diligence blockers",
      "body": "The financial verdict is directionally constructive but evidence-limited. Revenue quality appears better than a one-off robotics integration shop because the official product model centers on recurring cloud usage, fleet management, data workflows, and free-to-paid expansion. Margin path also appears positive at the software layer, helped by open-source adoption surfaces and usage-linked monetization. But the public record still blocks core underwriting questions. There is no disclosed ARR, no current revenue run rate, no customer-count cohort, no gross margin, no net retention, and no contract concentration detail. Series C valuation remains undisclosed in official materials, while secondary databases and private-market pages are too inconsistent to stand in for audited evidence. The terms and privacy pages add another caution: enterprise diligence still needs to inspect liability caps, service commitments, and the cost of supporting machine data at scale. Until management provides internal reporting on revenue mix, burn, and unit economics, investors should treat Viam as a well-capitalized but financially opaque platform company whose strongest public proof is design quality and partnership momentum rather than disclosed operating performance.",
