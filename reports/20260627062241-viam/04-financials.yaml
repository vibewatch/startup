      "id": "capital-adequacy-and-burn-context",
      "title": "Capital adequacy and burn context",
      "body": "For capital adequacy, the chapter can rely on the locally re-stated funding facts while avoiding a replay of the round chronology that already lives in Company Overview. Official March 2025 materials support a $30 million Series C and $117 million cumulative disclosed funding, but they do not provide a post-money valuation, cash balance, debt schedule, or management burn guide. That leaves investors inferring runway rather than verifying it. A reasonable public-case frame is that the Series C likely bought roughly 18 to 24 months of operating time if annualized burn sits near the $15 million to $20 million range that many venture-backed infrastructure companies of comparable team size can absorb, but this remains an estimate rather than a disclosed company metric. The cost side is also mixed. TechCrunch’s roughly 100-employee signal from 2024, Viam’s distributed footprint, partner enablement, and physical automation deployments all point to a cost base that is heavier than a lightweight API startup, even if the usage-priced cloud product should have favorable incremental software economics. The capital story is therefore adequate for continued execution but not yet transparent enough for precise underwriting.",
