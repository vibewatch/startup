    {
      "id": "recommendation-confidence-and-exit-readiness",
      "title": "Recommendation, confidence, and exit readiness",
      "body": "The right published recommendation is track. A buy call would imply conviction that the current private valuation is attractive, but the latest valuation is not public. An avoid call would imply confidence that the company is already overvalued or broken, which the evidence also does not support. Instead, the public record supports a lower-confidence monitor position: Viam has enough capital, product depth, and customer proof to stay relevant, but not enough disclosure to justify underwriting price. Confidence is low because the core valuation inputs remain private. Risk rating is high because disclosure opacity, competitive pressure, and possible services-heavy revenue mix all raise the odds of disappointment if scale takes longer than expected. Exit readiness is also limited. The realistic near-term endpoints are another private round or a strategic acquisition by a cloud, industrial, or automation player after clearer ARR proof emerges; an IPO-style readiness bar is far away without disclosed revenue history, margin quality, and governance transparency.",
