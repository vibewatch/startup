  topStrengths:
    - Founder-market fit 很强——Horowitz 曾在 MongoDB 放大开发者基础设施平台，如今把同一套架构打法搬到机器软件。
    - 海事、制造、QSR、场馆技术和工作场所安全都有具名客户证据，分散度降低了早期平台常见的单一垂直行业依赖。
    - 免费增值开发者入口、企业销售动作和硬件解决方案收入流并行，给收入放大留下多条路径。
    - 已披露融资 $117M，Union Square Ventures 和 Battery Ventures 多次参与，说明投资人对平台逻辑有持续信心。
    - Tech Mahindra 合作（2026 年 6 月）带来全球企业分销渠道，可触达 90+ 个国家的 1,100+ 家企业客户。
  topRisks:
    - 收入、ARR 和投后估值完全不披露，无法量化承销增长率、资本效率或入场价格。
    - Google Intrinsic、NVIDIA Isaac 和 AWS/GCP cloud robotics 都是资本充足且有分发优势的既有玩家，可能把 Viam 的核心平台层商品化。
    - 对 Eliot Horowitz 的关键人依赖很重——公开叙事、融资和战略都围绕创始人展开，看不到具名 co-CEO 或接班路径。
    - 用量计费和免费层入口让收入更难预测；缺少内部财务数据时，烧钱速度和现金跑道也难以判断。
    - ROS2 生态（数百万台已部署机器人、零许可成本）是根深蒂固的现状替代方案，会限制 Viam 可触达的绿地机会。
  unresolvedGaps:
    - 收入和 ARR 仍完全未披露——任何投资决定前都应向管理层取得这些数据。
    - 2025 年 3 月 Series C 的投后估值不见于任何一手来源；二级数据库只给出低置信估计。
    - 董事会构成、治理结构和投资人保护条款均未公开披露。
    - 净收入留存、流失率和客户终身价值指标均未披露。
    - 2026 年 6 月 Tech Mahindra 合作已经官宣，但合同条款、排他性和收入分成安排均未公开。
