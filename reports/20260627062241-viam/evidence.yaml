evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A cap-table level valuation history or board-approved post-money valuation for the March 2025 Series C.
    whyItMatters: >-
      The best official financing documents disclose total raised but not the price paid for the latest round, making
      underwriting difficult.
    diligencePath: >-
      Request the Series C term sheet, cap table, or a management-confirmed post-money valuation; cross-check with
      investor LP letters.
    relatedQuestionRefs:
      - QO012
      - QO013
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A full current board roster and governance committee structure.
    whyItMatters: Public materials highlight investors and founder leadership but do not show how formal oversight is distributed.
    diligencePath: Request current board materials and board observer rights from management or lead investors.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: education
    missingEvidence: Named institutional education customers or a direct FIRST Robotics partnership announcement.
    whyItMatters: >-
      Education appears strategically important for developer pipeline creation, but the public record does not quantify
      traction.
    diligencePath: Ask Viam for customer references, program metrics, and any FIRST or university memoranda.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A current precise employee count and hiring plan by function and geography.
    whyItMatters: >-
      Open sources show only a historical 100-person reference and broad team bands, which is not enough for current
      efficiency analysis.
    diligencePath: Request a current headcount by function, geography, and recent hiring/attrition from management.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cloud-robotics-software-tam
    missingEvidence: >-
      A public, non-paywalled market study that isolates orchestration and fleet-management software revenue within
      cloud robotics.
    whyItMatters: Without a clean software-layer denominator, TAM and SAM remain directional and are easy to overstate.
    diligencePath: >-
      Request Viam management's internal TAM model and compare it with any accessible analyst datasets or
      customer-budget bottoms-up cuts.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: viam-sam-penetration
    missingEvidence: >-
      Current customer count, deployed-machine count, annual recurring revenue, and vertical mix for production
      deployments.
    whyItMatters: These metrics are required to convert market attractiveness into a credible share and growth model.
    diligencePath: >-
      Ask management for cohort data by vertical, average contract value, retention, and the number of active paid
      accounts and deployed machines.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: labor-substitution-roi
    missingEvidence: Comparable public ROI benchmarks by vertical for machine-software deployments similar to Viam's customer examples.
    whyItMatters: >-
      ROI timing is one of the main adoption gates, but public case studies rarely disclose denominator costs or
      realized payback periods.
    diligencePath: >-
      Collect customer references with quantified before-and-after labor, uptime, and utilization outcomes for
      manufacturing, marine, and food-service deployments.
    relatedQuestionRefs:
      - QM024
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      A fuller market map with comparable public scale data for every serious robotics software platform and incumbent
      alternative.
    whyItMatters: >-
      The competitor profile table is intentionally partial because private-company disclosures are uneven and the
      market boundary spans platform, point-tool, and DIY options.
    diligencePath: >-
      Request Viam win-loss files, pipeline competitor tags, and analyst long-lists to test whether any material rival
      class is missing from the public map.
    relatedQuestionRefs:
      - QP001
      - QP005
      - QP018
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Normalized realized pricing, average contract values, and discounting data for Viam, Foxglove, Formant, and
      Intrinsic.
    whyItMatters: >-
      Public packaging surfaces are too incomplete to compare economic competitiveness or switching cost on a
      like-for-like basis.
    diligencePath: >-
      Ask management for pricing sheets, recent quote examples, discount approvals, and competitor pricing intelligence
      from sales operations.
    relatedQuestionRefs:
      - QP017
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: intrinsic-commercial-scale
    missingEvidence: Intrinsic customer-count, revenue, and production deployment data.
    whyItMatters: >-
      Intrinsic is strategically important because of Google backing, but public scale opacity makes it hard to separate
