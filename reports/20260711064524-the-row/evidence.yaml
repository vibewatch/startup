    severity: material
    topic: brand-level peer revenues
    missingEvidence: >-
      Direct current revenue and margin disclosures for The Row, Celine, Loro Piana, and other intra-group or private
      peers on an apples-to-apples basis.
    whyItMatters: >-
      Without comparable brand-level revenue and margin data, competitive ranking can use only proxy signals such as
      store footprint, group ownership, and public price architecture.
    diligencePath: >-
