evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and any independent-director or observer rights at The Row.
    whyItMatters: >-
      The brand now carries a unicorn valuation and outside minority investors, so governance opacity limits judgment on
      control, oversight, and succession risk.
    diligencePath: >-
      Request a current board list, governance chart, and investor-rights summary directly from management or deal
      counsel.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: deal-structure
    missingEvidence: >-
      Exact percentage stake sold, security type, governance rights, and use of proceeds from the September 2024
      transaction.
    whyItMatters: >-
      Minority-sale structure determines whether the $1B headline reflects growth capital, liquidity, or strategic
      alignment, and it affects ownership-underwriting quality.
    diligencePath: Obtain cap-table excerpts, term sheets, or management confirmation covering the 2024 investor round.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-organization
    missingEvidence: >-
      Current employee count by function and region, plus confirmation of the present executive bench beyond the
      founders.
    whyItMatters: >-
      Headcount and management depth are necessary to judge operating leverage, succession resilience, and whether the
      business is being managed as a scaled luxury house or a lean founder atelier.
    diligencePath: Request an org chart, headcount snapshot, and executive biographies in management materials.
    relatedQuestionRefs:
      - QO010
      - QO017
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, channel mix, gross margin, EBITDA/cash burn, and 2025/2026 trading updates.
    whyItMatters: >-
      The $250M-$300M revenue figure is only a secondary estimate, so profitability, valuation, and channel-quality
      conclusions remain underdetermined.
    diligencePath: >-
      Request audited or reviewed financial statements and a channel bridge covering owned retail, e-commerce, and
      wholesale.
    relatedQuestionRefs:
      - QO016
      - QO024
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: >-
      A fully official company-issued chronology covering early launches, store openings, governance changes, and
      post-2024 milestones.
    whyItMatters: >-
      The milestone table is robust enough for chapter analysis but still relies on secondary and partner sources for
      several early events because The Row does not publish a full corporate timeline.
    diligencePath: >-
      Request an official company chronology or archival press pack covering major launch, retail, and financing
      milestones.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: quiet-luxury niche sizing
    missingEvidence: >-
      A public third-party dataset that isolates understated ultra-premium ready-to-wear and leather-goods demand as a
      standalone market segment.
    whyItMatters: >-
      Without a direct quiet-luxury or stealth-wealth market dataset, The Row SAM must be bounded analytically rather
      than cited as a published market fact.
    diligencePath: >-
      Request proprietary sell-through studies from luxury retailers or paid analyst datasets that segment ultra-premium
      apparel and leather goods by buyer profile and aesthetic.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM024
  - type: private-evidence-only
    severity: material
    topic: the-row regional mix
    missingEvidence: The Row’s revenue split by geography, channel, and customer tier.
    whyItMatters: >-
      Market opportunity matters only insofar as it maps to the brand’s actual footprint; without channel and geography
      mix, market sizing cannot be tied tightly to execution reality.
    diligencePath: Request channel and geographic revenue mix directly from management or investor materials.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: customer-tier exposure
    missingEvidence: The share of The Row sales coming from top-tier/VIC clients versus aspirational buyers.
    whyItMatters: >-
      Several market sources say aspirational demand is the weak point in 2026, so customer-tier mix is critical for
      judging resilience.
