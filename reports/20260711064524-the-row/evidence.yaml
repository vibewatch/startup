    severity: minor
    topic: growth-ranges
    missingEvidence: >-
      A single apples-to-apples forecast methodology for 2026 luxury growth across Bain, McKinsey, Morgan Stanley, and
      BCG.
    whyItMatters: >-
      Forecasts are directionally aligned but use different scopes and horizons, so averaging them would create false
      precision.
    diligencePath: >-
      Preserve multiple lenses and reconcile them only after selecting a single category definition and time horizon for
      valuation work.
