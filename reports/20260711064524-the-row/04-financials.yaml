- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 minority financing
    - Confirmed at ~$1B valuation with luxury-family investors
    - High
    - Shows access to strategic capital and lowers immediate financing stress
    - Request primary cash raised, secondary mix, and board/information rights
  - - Cash on hand
    - 'null'
    - Low
    - Without cash balance, runway cannot be underwritten
    - Request month-end cash and liquidity policy
  - - Burn / free cash flow
    - 'null'
    - Low
    - Needed to determine whether growth is self-funded or financing-dependent
    - Request monthly burn, operating cash flow, and capex cadence
  - - Debt / credit facilities
    - 'null'
    - Low
    - Debt could materially change downside risk and covenant flexibility
    - Request debt schedule, collateral, and covenant package
  - - Planned use of funds
    - Undisclosed publicly
    - Low
    - Need to know whether capital is aimed at inventory, stores, digital, or other uses
    - Request management use-of-proceeds plan and next-round trigger
  notes: Company Overview established the existence of the minority transaction; this table focuses on the forward capital question rather than repeating the chronology.
  claimRefs:
