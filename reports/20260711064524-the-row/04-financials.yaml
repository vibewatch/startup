- id: capital-adequacy-and-diligence-blockers
  title: Capital Adequacy and Diligence Blockers
  body: The 2024 minority financing meaningfully changes the financing discussion, but not enough to eliminate diligence risk. Public reporting supports that the brand raised outside capital at about a $1 billion valuation from investors with deep luxury expertise, and that the founders retained majority control. That reduces immediate concern that The Row needed emergency funding, yet no public source says how much primary cash entered the company, whether secondaries dominated the transaction, or how proceeds are being allocated between inventory, store expansion, digital operations, or working capital. Public peers publish cash flow, debt, and margin documents annually; The Row does not. Even the brand’s returns policy matters here, because it shows that DTC growth comes with real reverse-logistics and refund obligations in many major markets. The result is a financial verdict that is cautiously positive on revenue quality and brand pricing power, but explicitly blocked on cash-generation
    visibility, working-capital intensity, and balance-sheet resilience. The disclosure gap remains material.
