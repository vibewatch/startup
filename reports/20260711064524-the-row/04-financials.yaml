  - CI035
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Channel-level net revenue and gross margin
    - Prevents assessment of whether DTC expansion is materially accretive vs wholesale
    - Request channel P&L with returns, discounts, and shipping cost
  - - Inventory aging and seasonal markdown data
    - Blocks working-capital and fashion-risk analysis
    - Request inventory aging ladder and markdown cadence by season
  - - Cash, debt, and runway
    - Blocks solvency and financing dependency analysis
    - Request latest balance sheet and 12-month liquidity forecast
  - - Store-level contribution economics
    - Blocks evaluation of expansion quality and owned-retail return on capital
    - Request same-store sales, four-wall EBITDA, capex, and payback by location
  - - Top-customer / top-door concentration
    - Blocks assessment of wholesale dependency and demand concentration
    - Request revenue concentration by customer, retailer, and geography
  notes: These are the minimum private metrics needed to convert The Row from a strong-brand story into an underwritable operating company.
