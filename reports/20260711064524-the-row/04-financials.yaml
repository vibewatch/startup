- id: pricing-public-traction-and-estimate-range
  title: Pricing, Public Traction, and Estimate Range
  body: 'List-price evidence strongly supports ultra-premium positioning. Official The Row pages showed bag and outerwear prices spanning roughly $1,350 to $12,500 on the fetch date, while partner pages surfaced four-figure knitwear, tailoring, and accessories. Independent coverage and investor-oriented summaries consistently cluster around a $1 billion September 2024 valuation and estimated annual revenue of roughly $250 million to $300 million, with Particl explicitly framing the deal at about 4x estimated revenue and around 16x estimated EBITDA. None of those figures is audited The Row disclosure, but they are directionally consistent with a luxury label whose average ticket is high, whose online sales have expanded quickly, and whose product ladder leaves meaningful room for premium gross profit per order. The challenge is that public traction is still estimate-driven: there is no published annual report, no management discussion of channel profitability, and no verified unit-level sell-through
    or markdown data.'
