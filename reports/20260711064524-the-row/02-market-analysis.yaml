  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quiet-luxury niche sizing
    missingEvidence: A public third-party dataset that isolates understated ultra-premium ready-to-wear and leather-goods demand as a standalone market segment.
    whyItMatters: Without a direct quiet-luxury or stealth-wealth market dataset, The Row SAM must be bounded analytically rather than cited as a published market fact.
    diligencePath: Request proprietary sell-through studies from luxury retailers or paid analyst datasets that segment ultra-premium apparel and leather goods by buyer profile and aesthetic.
    relatedQuestionRefs:
    - QM007
    - QM008
    - QM024
  - type: private-evidence-only
    severity: material
    topic: the-row regional mix
    missingEvidence: The Row’s revenue split by geography, channel, and customer tier.
    whyItMatters: Market opportunity matters only insofar as it maps to the brand’s actual footprint; without channel and geography mix, market sizing cannot be tied tightly to execution reality.
    diligencePath: Request channel and geographic revenue mix directly from management or investor materials.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: private-evidence-only
    severity: material
    topic: customer-tier exposure
    missingEvidence: The share of The Row sales coming from top-tier/VIC clients versus aspirational buyers.
    whyItMatters: Several market sources say aspirational demand is the weak point in 2026, so customer-tier mix is critical for judging resilience.
    diligencePath: Request customer segmentation, cohort spending bands, and repeat-purchase data by client tier.
    relatedQuestionRefs:
    - QM011
    - QM020
    - QM025
  - type: conflicting-data
    severity: minor
    topic: growth-ranges
    missingEvidence: A single apples-to-apples forecast methodology for 2026 luxury growth across Bain, McKinsey, Morgan Stanley, and BCG.
    whyItMatters: Forecasts are directionally aligned but use different scopes and horizons, so averaging them would create false precision.
    diligencePath: Preserve multiple lenses and reconcile them only after selecting a single category definition and time horizon for valuation work.
    relatedQuestionRefs:
    - QM005
    - QM006
    - QM023
