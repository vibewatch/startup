- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Why it matters to The Row
  rows:
  - - Personal luxury goods
    - Fashion, leather goods, watches, jewelry, beauty inside Bain/Altagamma definition
    - Autos, hospitality, fine art, real estate, yachts and other experiential luxury
    - Affluent individual buyer
    - Top-down category umbrella that contains The Row but is broader than its real addressable market
  - - Ultra-premium ready-to-wear and leather goods
    - Luxury apparel, shoes, bags, and accessories bought for craftsmanship and timelessness
    - Mass premium apparel, cosmetics, and conspicuous-logo entry products
    - Affluent individual buyer / household discretionary budget
    - Directly relevant competitive set for The Row
  - - Experiential luxury
    - Travel, wellness, hospitality, events and private experiences competing for the same wallet share
    - Physical product wardrobes themselves
    - Affluent individual buyer
    - Important substitute because clients increasingly trade off goods against experiences
  - - Certified pre-owned / resale luxury
    - Brand-run CPO, resale platforms, authenticated secondhand luxury
    - Counterfeit gray market and unauthenticated informal resale
    - Value-conscious luxury buyer
    - Shapes primary-market demand by improving or redirecting perceived value
  - - Brand-owned retail and e-commerce
    - Mono-brand boutiques, brand stores, direct online
    - Mass marketplace distribution
    - Luxury brand and affluent end buyer
    - Critical because The Row relies on controlled environments and full-price sell-through
  - - Curated multi-brand retail
    - Department stores, luxury e-tailers, concessions and selective wholesale
    - Broad discount wholesale and undifferentiated retail doors
    - Retail merchant buyer plus end customer
    - Still relevant for discovery, tourism, and channel reach without mass distribution
  notes: The definition deliberately narrows from broad luxury to the wardrobe-centric, ultra-premium slice where The Row actually competes, while preserving experiences and resale as substitute budget destinations.
