- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Several market drivers work in The Row’s favor. Bain says the Americas are surging, younger U.S. luxury consumers are spending faster than older cohorts, and Chinese online luxury sales have rebounded in early 2026. Knight Frank shows wealth creation continuing globally, especially in the U.S. and Asia-Pacific. EY, ThredUp, and BCG all show that consumers increasingly value craftsmanship, heritage, and durability while also normalizing certified pre-owned and AI-assisted discovery. Brunello Cucinelli’s 2026 update suggests the most exclusive end of luxury remains resilient even in a choppy macro backdrop, and Kering’s numbers show North America can still outperform even when group-level conditions are mixed. Together, those data points support continued demand for a brand like The Row that sells product-led, high-price, low-logo luxury.


    The constraints are just as important. McKinsey argues that more than 80% of luxury’s 2019-2023 growth came from price increases, and both McKinsey and Morgan Stanley warn that price tolerance has weakened, especially among aspirational buyers. Bain and J.P. Morgan both flag Europe as softer, tourism-sensitive, and less supportive than before, while Morgan Stanley sees China stabilizing without returning to its old double-digit expansion pattern. VML’s trends work even suggests some consumers are tiring of ‘quiet luxury’ as a monolithic aesthetic, preferring either spectacle or wellbeing-oriented status signals instead. The implication is that The Row benefits from secular appetite for craft and discretion, but not from a frictionless macro market. Growth exists, yet it is uneven, wealth-tiered, channel-sensitive, and increasingly intolerant of brands that raise price faster than perceived value.'
