  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Mechanism
  - Diligence ask
  rows:
  - - U.S. wealth creation and resilient spending
    - Driver
    - Current / 2026
    - Supports demand in the world’s largest luxury market and helps affluent buyers absorb high price points
    - How much of The Row’s growth is local-U.S. versus tourist-led?
  - - UHNWI expansion and Asia-Pacific wealth growth
    - Driver
    - 2021-2026 trend
    - Expands the global pool of buyers able to sustain ultra-premium wardrobes
    - Which geographies matter most for The Row full-price demand?
  - - Experiences and emotional luxury
    - Driver + Constraint
    - Structural
    - Pushes brands to create stronger retail theatre and service, but also competes for wallet share
    - Can The Row monetize experiences without diluting scarcity?
  - - Resale normalization and CPO adoption
    - Driver + Constraint
    - Structural
    - Supports value retention and entry discovery, but can redirect spend away from primary-market product
    - What is The Row’s resale liquidity and how should it influence pricing?
  - - Price fatigue among aspirational clients
    - Constraint
    - Current / structural
    - More than price hikes are needed; unjustified increases reduce demand and brand trust
    - How exposed is The Row to aspirational buyers versus top-tier clients?
  - - China slowdown and Europe tourism softness
    - Constraint
    - '2026'
    - Core luxury regions are no longer universal growth engines
    - How dependent is The Row on Chinese tourists and European travel retail?
  - - Exclusive-segment resilience
    - Driver
    - '2026'
    - The highest tier of luxury can still outperform in mixed markets
    - Is The Row truly capturing this resilient top tier or still partially reliant on aspiration?
  - - Wholesale vs. direct-channel tension
    - Constraint + Driver
    - '2026'
    - Retail experience-led growth favors controlled channels, while wholesale remains important but uneven
    - What channel mix best preserves brand heat and gross margin for The Row?
  notes: Direction labels preserve mixed effects where a trend helps the market overall but complicates execution for a tightly positioned brand like The Row.
