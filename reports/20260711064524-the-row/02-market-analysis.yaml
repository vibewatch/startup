- id: sizing-lenses-and-bounded-sam
  title: Sizing Lenses and a Bounded Serviceable Market
  body: 'The top-down numbers are useful only if their limitations are preserved. Bain and Altagamma put personal luxury goods at €358 billion in 2025 and €365 billion to €373 billion in their 2026 base case, while McKinsey expects only 1% to 3% annual growth from 2024 to 2027 and Morgan Stanley now models roughly 2.5% for 2026. BCG’s consumer-insight work is directionally consistent, with 2% to 5% FY26 growth and a healthier medium-term base, but it also argues that the revenue mix is shifting away from heavy dependence on aspirational buyers. None of these figures is a clean The Row TAM. They are category umbrellas.


    To make the numbers useful for diligence, the market has to be filtered. BCG says traditional personal-luxury wardrobe categories rebalance from about 80% of mix toward roughly 60% as experiences and broader lifestyle luxury take share. Applying that lens to Bain’s €358 billion 2025 personal-luxury base implies a wardrobe-centric slice around €215 billion before any filtering for product tier, geography, or aesthetic. The Row clearly does not address all of that. After narrowing for ultra-premium positioning, selective distribution, and the understated subset of luxury apparel and leather goods, the realistic serviceable market should be thought of as a tens-of-billions opportunity rather than a hundreds-of-billions one. That bounded frame is less exciting than quoting the full luxury universe, but it is much more decision-useful.'
