  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: The Row 的客户旅程从静奢发现开始，经由高声望渠道购买，走向带有转售意识的复购行为。
    data:
      nodes:
        - id: inspiration
          label: 编辑内容 / 名人启发
          detail: Hailey Bieber、Sofia Richie Grainge、Kendall Jenner 和 CBK 风格编辑参照带来认知。
        - id: consideration
          label: 高声望渠道考虑
          detail: Bergdorf、NET-A-PORTER、SSENSE 和 Mytheresa 提供可信的奢侈品语境。
        - id: purchase
          label: 直营或伙伴购买
          detail: 客户通过 therow.com、旗舰店、专柜或高端电商完成转化。
        - id: service
          label: 退货与客户服务
          detail: 跨区域退货和门店退货降低购买摩擦。
        - id: repeat
          label: 衣橱扩展
          detail: 客户增加 RTW、手袋、鞋履，或 Marcel、Barn 等较新的标志性包款。
        - id: resale-loop
          label: 转售可见度循环
          detail: The RealReal 和 Vestiaire 让标志性单品保持可识别，也支撑价格记忆。
