            body: >-
              2024 年少数股权融资显著改变了融资讨论，但不足以消除尽调风险。公开报道支持以下事实：品牌以约 $1B 估值从深具奢侈品经验的投资者处引入外部资本，创始人保留多数控制权。这降低了 The Row
              需要紧急融资的即时担忧，但没有公开来源说明有多少新资金进入公司、交易是否以老股转让为主，或所得资金如何在库存、门店扩张、数字运营和营运资本之间分配。公开同业每年发布现金流、债务和利润率文件；The Row
              不发布。品牌的退货政策在这里也很重要，因为它显示 DTC
              增长会在许多主要市场带来真实的逆向物流和退款义务。最终财务判断是：收入质量和品牌定价权谨慎正面，但现金生成能见度、营运资本强度和资产负债表韧性明确受阻。披露缺口仍然重大。
