  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群画像与买方经济性
        blocks:
          - type: paragraph
            body: >-
              The Row 面向的不是单一客户。公开记录指向三层同心圆。核心层是富裕终端客户，他们直接在 therow.com 和自营门店购买，用于搭建衣橱、购买皮具和传递低调身份。核心外围是高端批发层——Bergdorf
              Goodman、NET-A-PORTER、SSENSE 和
              Mytheresa——既变现需求，也验证需求，因为这些不是广泛折扣渠道，而是高度精选的奢侈品场景。再外围是品味放大层，包括造型师、编辑、名人和转售买家；他们虽未被正式披露为客户，却放大了品牌。外部奢侈品消费者数据也有助于框定这类受众的可能经济性。BCG
              称，顶级奢侈品客户现在贡献行业支出的
              24%，也是最稳定的增长引擎；向往型需求则成为市场中最波动的部分。对一个拥有四位数手袋、低调品牌标识和精选分销的品牌来说，这意味着它的客户组合相较主流奢侈品时装屋，在财富层级上更上移，在广度上更收窄。
