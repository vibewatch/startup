      - number: '1.3'
        title: 资本、门店与规模信号
        blocks:
          - type: paragraph
            body: >-
              近期最重要的公司事件，是 2024 年 9 月的少数股权投资；该交易把 The Row 估值约定在 $1B。多家独立时尚商业来源识别出同一组投资者：Chanel 的 Wertheimer 家族通过 Mousse
              Partners 参与，Françoise Bettencourt Meyers 家族通过 Tethys Invest 参与，另有 Imaginary Ventures 和 StDominique
              Capital。这些名字不只是面子。Mousse 自称为直接与管理团队合作的长期投资机构，因此 2024 年财团更像是战略奢侈品背书资本，而不是传统成长股权的财务工程。公开报道还称 Olsen
              姐妹保留多数股权，在引入极强人脉的少数股东同时保住控制权。


              但规模只披露了一部分。Femfounded 综合 Financial Times 和分析师评论，把 2024 年收入放在约 $250M 到 $300M 区间；Yahoo 转发的 WWD
              报道也指出，收入即便在较早估算显示历史销售额更低时，也仍难以公开确认。门店证据比财务证据更硬：目前 The Row 直接列出的自营零售地点至少覆盖五处，且到 WWD 评论 Spring 2025
              系列时，Paris 精品店已经开业。因此，这家公司看起来足够大，能够吸引蓝筹奢侈品投资者并支撑多城市旗舰店策略；但它仍足够私密，收入、利润率、员工人数和 2024 年出售的确切股权比例都留在公开记录之外。
