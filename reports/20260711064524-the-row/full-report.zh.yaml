  - id: FU002
    title: 采用与证明流
    type: flow
    layout: wide
    summary: 公开客户证明靠发现、稀缺性和转售层层叠加，而不是靠披露的客户数量 KPI。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 风格媒体、秀场报道和名人上身让品牌浮出水面。
        - id: validate
          label: 在高声望零售中验证
          detail: 精英伙伴进货并将它与顶级奢侈品牌并列策展。
        - id: convert
          label: 转化
          detail: 直营电商和旗舰店捕获购买意愿。
        - id: scarcity
          label: 稀缺信号
          detail: 低库存、畅销和售罄标记强化渴望度。
        - id: aftermarket
          label: 售后市场支持
          detail: 转售活动让明星包款保持可见，并在价值感上接近零售价格。
      edges:
