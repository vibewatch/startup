      - number: '2.2'
        title: 规模测算视角与有边界的可服务市场
        blocks:
          - type: paragraph
            body: >-
              自上而下的数字只有在保留限制条件时才有用。Bain 和 Altagamma 估算，2025 年个人奢侈品规模为 €358B，2026 年基准情境为 €365B 到 €373B；McKinsey 预计 2024 至
              2027 年年增长仅 1% 到 3%，Morgan Stanley 现在对 2026 年建模约 2.5%。BCG 的消费者洞察方向一致，给出 FY26 2% 到 5%
              增长和更健康的中期基础；但它也认为，收入组合正在减少对向往型买家的重度依赖。这些数字没有一个是干净的 The Row TAM。它们只是品类大伞。


              为了让数字对尽调有用，市场必须经过过滤。BCG 称，传统个人奢侈品衣橱品类的组合占比会从约 80% 再平衡至约 60%，因为体验和更广义的生活方式奢侈品在拿走份额。把这个视角套到 Bain 2025 年
              €358B 的个人奢侈品基数上，意味着在按产品层级、地理或审美过滤前，衣橱中心切片约为 €215B。The Row
              显然无法覆盖全部。再按超高端定位、精选分销，以及奢侈服装和皮具中低调审美子集收窄后，现实可服务市场应被视为数百亿美元机会，而不是数千亿美元机会。这个有边界的框架不如引用完整奢侈品宇宙那么刺激，但对决策有用得多。
