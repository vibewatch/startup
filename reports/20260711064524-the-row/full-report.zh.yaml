      - number: '8.4'
        title: 退出路径与建议
        blocks:
          - type: paragraph
            body: >-
              退出逻辑同样不支持用动量式估值判断。IPO 是近期最不可能的路径。Golden Goose 撤回上市计划，是一个新近提醒：即便有吸引力的奢侈品牌，也需要配合的市场窗口；The Row
              比通常选择上市生活的公司更小、更不透明，也更依赖创始人。战略交易更可能发生：LVMH、Kering
              或另一个有耐心的奢侈品资本平台，如果看重稀缺性、品类邻接和创始人可信度，可能愿意为品牌付费。但这条路仍取决于创始人是否愿意让出部分控制权，以及买方能否接受当前有限披露。因此，估值立场应是合理，而不是便宜。合适环境里，品牌完全可以支撑独角兽身份；但证据还不足以说明当前标记是明确便宜货。最有纪律的姿态，是跟踪公司、持续更新可比公司，并把更激进的立场留到经审计经营明细或更清晰退出路径出现之后。
