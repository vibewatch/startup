  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 相比治理已高度制度化的上市奢侈品集团，创始人与治理风险会更快传导到客户吸引力、收入质量和估值。
    data:
      nodes:
        - id: founders
          label: 创始人集中度
          detail: Mary-Kate 和 Ashley Olsen 仍是品牌权威的核心。
        - id: creativity
          label: 创意连续性风险
          detail: 创作主线一旦断档，产品一致性就会走弱。
        - id: customers
          label: 客户吸引力
          detail: 顶级买家和品味风向标会看重可感知的主理人印记与稀缺性。
        - id: sales
          label: 收入质量
          detail: 品类组合、正价售罄率和复购需求都可能快速走软。
        - id: valuation
          label: 估值支撑
          detail: 增长和吸引力若走弱，私募市场溢价会被压缩。
        - id: governance
          label: 治理可见度
          detail: 披露不透明会拖慢反应，也会抬高投资者风险。
      edges:
        - from: founders
          to: creativity
        - from: creativity
          to: customers
        - from: customers
          to: sales
        - from: sales
          to: valuation
        - from: governance
          to: valuation
        - from: governance
          to: sales
    claimRefs:
