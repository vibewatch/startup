            body: >-
              最强的公开客户需求证明不是披露的客户数，而是同一批产品家族反复出现的稀缺性和二级市场活动。NET-A-PORTER 的 The Row 页面显示「COMING SOON」「BESTSELLER」和「LOW
              STOCK」标记，Bergdorf 的 2026 年货品也出现「Best Seller」和「New Arrival」标签。Particl 估算年线上销售额为 $50M 到 $75M，并称品牌前五大畅销产品全部来自
              Margaux 和 Park Tote 手袋家族；这与时尚报道谈论 The Row 的方式一致。Augustman 报道称，曾经追逐 Margaux 的客户已经转向 Marcel 和 Marlo
              等后继款，并明确把 Hailey Bieber 与 2026 年的 Marcel 联系起来。Yahoo 的时尚联合报道补充说，Sofia Richie Grainge 携带已售罄的 Astra Bowling
              Canvas Bag，Kendall Jenner 穿着已售罄的 The Row 人字拖，并搭配 $1,350 Barn tote；Sofia 最近也被拍到穿同款凉鞋。二级市场强化了同一画面。抓取当天，The
              RealReal 返回 223 件 Margaux 商品，要价经常处于 $4,000 到 $6,000 区间；Vestiaire 则列出从 United States 到 Hong Kong 的全球
              Margaux 供给，价格点常常接近或高于一手市场参考水平。零售商稀缺、名人携带和流动转售结合起来，对一个私营品牌来说，是异常强的客户证明。
