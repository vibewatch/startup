      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              多个市场驱动因素对 The Row 有利。Bain 称，美洲正在加速，年轻美国奢侈品消费者的支出增速快于年长群体，中国线上奢侈品销售在 2026 年初已经反弹。Knight Frank
              显示，全球财富创造继续推进，尤其在美国和 Asia-Pacific。EY、ThredUp 和 BCG 都显示，消费者越来越重视工艺、传承和耐用性，同时也在常态化接受认证二手和 AI 辅助发现。Brunello
              Cucinelli 的 2026 年更新说明，即便宏观背景震荡，奢侈品最排他的端点仍有韧性；Kering 的数据也显示，即便集团层面状况参差，North America
              仍可跑赢。合在一起，这些数据点支持一种持续需求：像 The Row 这样销售产品驱动、高价格、低标识奢侈品的品牌仍有市场。


              约束同样关键。McKinsey 认为，2019-2023 年奢侈品增长的 80% 以上来自涨价；McKinsey 和 Morgan Stanley 都警告，价格容忍度已经减弱，向往型买家尤其如此。Bain 和
              J.P. Morgan 都提示 Europe 更疲软、更依赖旅游且支撑力不如从前；Morgan Stanley 则认为 China 正在企稳，但不会回到过去的两位数扩张模式。VML
              的趋势研究甚至提示，一些消费者正在厌倦把「静奢」当成单一审美，转而偏好更具戏剧性或康养导向的身份信号。结论是，The Row
              受益于对工艺和克制的长期偏好，但不是身处无摩擦的宏观市场。增长存在，却不均衡，受财富层级、渠道和价格价值感影响，也越来越不能容忍品牌涨价快过感知价值。
