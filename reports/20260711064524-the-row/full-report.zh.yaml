            body: >-
              The Row 与许多同业之间最大的结构性差距，不是品味，而是平台规模。Kering 报告 2026 年一季度收入 €3.568B，并称 Saint Laurent 和 Bottega Veneta
              都实现同比增长；LVMH 2025 年收入达到 €80.8B，覆盖 75 多个品牌和 6,280 多家门店。LVMH 单独展示的 Celine 拥有 178 家门店和 2,500 名员工，Loro Piana
              拥有约 180 家门店和十处自有意大利生产基地。Brunello Cucinelli 虽远小于 Kering 或 LVMH，但 2026 年 Q1 仍产生 €369.1M 收入，并称零售、批发、美洲、Europe
              和 Asia 均衡增长。在这个背景下，The Row 的精选批发伙伴和少数旗舰店在战略上连贯，却无可否认更窄。独立性保护纯度，但也让品牌比周围欧洲时装屋更缺资产负债表火力、更少门店、更少披露的经营杠杆。
