      - number: '7.3'
        title: 竞争、规模与宏观周期性
        blocks:
          - type: paragraph
            body: >-
              The Row 不是在真空里竞争。它面对的是规模更大、资金更厚、披露也充分得多的品牌集团。Kering 报告 2025 年收入为 €14.7 billion，仅 Bottega Veneta 就有 €1.706
              billion；Yahoo Finance 显示，Moncler 近 12 个月收入约 €3.13 billion，Zegna 近 12 个月收入约 $1.92 billion，Brunello
              Cucinelli 2025 年销售额超过 €1.4 billion，且 2026 年仍保持强劲增长。这些同业还配有公开市场基础设施：定期业绩、分部明细、投资者沟通，以及更清晰的资本配置。The Row
              没有这些。按 Particl 估算，The Row 收入约 $250 million、估值 $1 billion，规模差距很直观。即便 The Row
              的品牌声望处在顶级，它的运营平台仍只是欧洲竞争者的一小部分；后者可以用更大的门店网络、媒体预算和供应链摊薄固定成本。宏观背景又放大了劣势。Morgan Stanley 预计 2026 年奢侈品增长仅约
              2.5%；Bain 基准情形是在 2025 年下滑后增长 2% 至 4%；McKinsey 仍在谈 1% 至 3% 的年增长，以及 aspirational consumers
              持续承压。市场偏软时，大集团比一个杠杆更少的独立品牌更容易吸收波动。
