      - number: '6.4'
        title: 耐久性、复购与集中度未知
        blocks:
          - type: paragraph
            body: >-
              The Row 的客户耐久性看起来有潜力，但披露精度达不到投资者想要的水平。外部奢侈品研究显示，品牌定位方向有利：EY 称，当品牌提供免费体验时，75% 的向往型奢侈品客户更可能复购；73%
              愿意为独家体验付费；62% 对品牌运营二手开放。BCG 称，顶级客户比向往型客户更有韧性，也更关注创意方向；这适配一家围绕克制设计作者性建立的时装屋。但这些是行业代理，不是 The Row
              专属留存指标。公开证据仍未披露活跃客户数、复购率、头部客户集中度、预约销售依赖或区域收入组合。McKinsey
              的奢侈品研究是关键警示对照：行业在放缓，客户在商品、旅行和康养之间取舍，过度定价已开始伤害更脆弱的奢侈品客群需求。对 The Row
              来说，可读出的结论是客户质量可能很高但集中，而未披露留存数据本身就是尽调问题。市场能看见需求；还看不见账本形式的耐久性。
