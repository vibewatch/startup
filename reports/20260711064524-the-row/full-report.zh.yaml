      - number: '7.4'
        title: 透明度、监管负担与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              最后一项风险不是某个离散事件，而是不透明不断叠加后的结果。SEC 材料和 DFIN
              的私营公司指引都说得很清楚：除非触发特定门槛，私营企业不适用上市公司的公开报告制度；少数股东往往靠谈判取得信息权，而不是自动收到定期披露。Miller Law 和 Angel Investors Network
              都强调，没有董事席位的少数股东可能面对能见度差、流动性弱，并依赖股东协议安排。The Row 眼下尤其需要重视这一点，因为有声望的少数股东已经进入 cap
              table，但外界仍不知道精确出让比例、董事会权利、否决权组合，或后续融资的更新条款。与此同时，欧洲正在收紧产品可持续要求。European Commission 的 ESPR FAQ 称，Ecodesign
              for Sustainable Products Regulation 已于 2024 年 7 月生效，并会把 Digital Product Passport 和更广泛的产品可持续预期带入市场。The Row
              在 London 和 Paris 销售，又依赖高端材料；合规摩擦、文件要求或可持续审查一旦增加，都会抬高执行负担。私营公司不透明与监管 /
              运营要求上升叠加，意味着尽调不能只看品牌神话，而要更多盯住具体控制权、报告节奏，以及业务在不丢失稀缺性和利润率纪律的前提下扩张的证据。
