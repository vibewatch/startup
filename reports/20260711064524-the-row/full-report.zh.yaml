companyProfile:
  summary: >
    The Row 是 Mary-Kate 和 Ashley Olsen 在纽约创立的奢侈品牌。它公开呈现的不是醒目标识，而是安静、高工艺的设计。官方和合作方证据显示，公司刻意维持精选模型：自营精品店只覆盖 New
    York、Amagansett、Los Angeles、London 和 Paris 等少数地点；在高端百货设专柜；并通过 Bergdorf Goodman、NET-A-PORTER、SSENSE 和 Mytheresa
    做精选全球批发。公开财务能见度有限，但独立报道和财务章节估计显示，年收入约为 $250M-$300M；2024 年少数股权投资报道则给出品牌估值约 $1B。
