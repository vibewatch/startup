      - number: '1.4'
        title: 里程碑与负面信号
        blocks:
          - type: paragraph
            body: >-
              The Row 的时间线显示，一个品牌慢速但连贯地扩大。二手历史称，这家时装屋于 2005 年因对完美 T 恤的执念萌生，2006
              年商业化推出；零售商和编辑部描述仍引用这一起源故事。之后的里程碑路径清晰可读：早期 CFDA 认可验证了设计主张，Los Angeles 和随后 London
              加深直营零售，男装在疫情前推出，外部资本进入时，Paris 既成为门店，也成为象征性升级点。WWD 持续的评论页面还显示，2025 年和 2026 年，The Row 仍在塑造而不只是跟随静奢讨论。


              负面记录真实存在，但不至于推翻投资命题。The Fashion Law 和 UniCourt 记录了 David Schulte 2020 年 3
              月针对品牌及其负责人提起的诉讼；起诉书密封提交，后续动议聚焦于保持记录保密。The Fashion Law 还保留了品牌实习生诉讼的结果：约 $140,000 和解金分给一大批前实习生。Femfounded
              补充称，公司据报道在 2020 年裁掉约半数员工，当时同时应对 COVID 冲击和 Barneys 破产敞口。合在一起，这些事件说明 The Row 并非免疫于运营冲击、劳资纠纷或领导层摩擦。但品牌随后开出
              Paris 门店、完成投资轮并继续维持高端定价，也显示它在不放弃稀缺性定位的情况下恢复了过来。
