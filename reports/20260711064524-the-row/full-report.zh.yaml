  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人、治理与法律脆弱性
        blocks:
          - type: paragraph
            body: >-
              The Row 最根本的风险，是品牌与创始人实际上不可分割。官方品牌页面仍把这家时装屋围绕 Mary-Kate 和 Ashley Olsen 的审美使命展开；WWD 的 2026
              年秀场评论也从「姐妹」在做什么的角度书写，而不是从更宽的管理系统角度书写。这不只是品牌语言。BCG 2026 年奢侈品研究称，顶级消费者异常关注创意总监，四分之一明确因为创意领导层选择某个品牌。对 The Row
              这样的时装屋来说，这意味着创始人接班风险并不抽象。如果 Olsen 姐妹退居幕后，品牌可能失去让客户基础和产品权威保持连贯的一大部分信号。法律记录也显示过往压力。The Fashion Law 记录了 2020
              年 David Schulte 针对 Olsen 姐妹、The Row 和 Dualstar 的诉讼，以及此前一宗实习生案件；后者以约 $140,000 分给 185
              名实习生和解。两案本身都不摧毁投资命题，但都重要，因为它们揭示公开治理层有多薄。官方材料没有呈现董事会名单、委员会结构或接班计划，因此外部人能看见创始人，却看不见她们之下的梯队。
