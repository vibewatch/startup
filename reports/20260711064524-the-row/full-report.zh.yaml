        title: 利润率结构与单位经济代理
        blocks:
          - type: paragraph
            body: >-
              The Row 是私营公司，公开承销只能靠代理指标，而不能靠已报告利润率条线。Kering 2025 年业绩显示，Saint Laurent 经常性经营利润率为 20.0%，Bottega Veneta 为
              15.6%；LVMH 报告集团层面经营利润率 22%、毛利率 66%。Deloitte 2026 年奢侈品高管调查称，定价权、品牌吸引力、clienteling 和门店优化仍是守住利润率的核心；这在方向上支持
              The Row 这样的品牌。但同业利润率不能直接套到独立品牌身上。The Row
              的较小规模、精选门店策略，以及可能更高的人工产品策展依赖，既可能通过稀缺性支撑更高毛利率，也可能因固定成本吸收不足压缩经营利润率。Particl
              的产品组合证据显示，手袋可能是最佳经济引擎；但同一来源也提示产品停产和近期产品质量失误，这正是如果扩散就会摧毁奢侈品库存效率的问题。
