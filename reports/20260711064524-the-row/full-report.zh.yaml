          label: 标价
          detail: 四位数价位的服装和手袋创造毛利潜力。
        - id: mix
          label: 品类组合
          detail: 服装推动销量，手袋很可能有更强经济性。
        - id: returns
          label: 退货 / 逆向物流
          detail: 许多地区由品牌承担退货面单，可能压低贡献利润率。
        - id: grossprofit
          label: 毛利率
          detail: 公开渠道未知；取决于材料、降价和渠道组合。
        - id: opex
          label: 门店 + 客户经营 + 公司运营开支
          detail: 奢侈品服务、门店和商品运营会吃掉经营利润。
        - id: ebitda
          label: 经营收益
          detail: 经审计 EBITDA 和现金转化未公开披露。
