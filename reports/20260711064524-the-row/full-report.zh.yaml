      - number: '2.3'
        title: 买方、付款方与渠道路径
        blocks:
          - type: paragraph
            body: >-
              The Row 的买方地图横跨真正顶级客户和更挑剔的向往型消费者，但市场明显在向前者移动。Knight Frank 显示财富创造继续集中在最顶端，UHNWI 人群从 2021 年到 2026 年大幅增加；BCG
              则称顶级客户已成为最稳定的增长引擎，而向往型消费者贡献了大部分波动。EY 补充说，向往型奢侈品买家仍极其重要，但他们越来越想要体验、AI 驱动的个性化、二手选项，以及更充分的价格理由。J.P. Morgan 和
              Morgan Stanley 从宏观侧强化了同一点：在 K 型环境里，对向往型消费者敞口更重的品牌承压更大，最排他的时装屋韧性更强。


              渠道行为同样重要。EY 称，品牌门店仍是受访向往型客户的主导最终购买渠道；在 Japan 等市场，百货仍有影响力。Bain
              认为，单品牌零售会继续以体验为核心，直营线上趋稳，多品牌零售商则夹在品牌回撤和消费者需求之间。这幅渠道图很适配 The
              Row。它的旗舰店、紧密专柜网络和精选线上批发伙伴，映射了奢侈品市场的走向：更少无差异门店，更多受控环境，更强调服务和实体剧场感，同时转售循环越来越影响一手市场购买决策。
