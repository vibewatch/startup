  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: The Row 依赖少数彼此强化的外部节点：顶级渠道、少数股投资者、欧洲高端市场，以及富裕客群。
    data:
      nodes:
        - id: elite-doors
          label: 顶级批发 / 专柜渠道
          detail: 高端合作伙伴为品牌背书并负责分销。
        - id: minority-capital
          label: 少数股投资者群
          detail: 高端投资者带来资本，也可能带来治理预期。
        - id: uhnw
          label: 顶级奢侈品客户
          detail: 富裕买家韧性最强，但客群也很窄。
        - id: europe
          label: London / Paris 生态
          detail: 旗舰店和专柜撑起欧洲高端叙事。
        - id: regulation
          label: EU 可持续规则
          detail: 市场准入越来越需要文件留痕和合规能力。
        - id: peer-scale
          label: 更大奢侈品同行
          detail: Kering、Moncler、Brunello 和 Zegna 设定资源投入标尺。
      edges:
        - from: elite-doors
          to: uhnw
        - from: minority-capital
          to: peer-scale
        - from: europe
          to: elite-doors
        - from: regulation
          to: europe
        - from: peer-scale
          to: uhnw
