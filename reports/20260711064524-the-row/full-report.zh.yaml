      - number: '8.3'
        title: 情景区间与少数股权调整
        blocks:
          - type: paragraph
            body: >-
              处理 The Row，一个有用方法是把企业质量和股权机制拆开看。企业质量上，公司确实可能比大众奢侈品牌享受更高交易倍数，因为品牌有真实稀缺性、手袋经济性强，少数股东阵容也异常有声望。但股权机制上，2024 年 9
              月价格仍是私营公司的少数股权估值。少数股权融资可能带有稀缺溢价、信号溢价和关系价值，并不会自动转移到 100%
              控制权估值上。它们也可能掩盖治理不对称，因为外部人不知道谈判出的具体信息权、保护性条款或未来稀释条款。因此，正确答案应是区间，而不是单点估计。牛市情形下，如果收入扩到高 $200
              millions，手袋仍占主导，投资者光环继续拉动需求，那么接近 Brunello 的溢价倍数可以被辩护。基准情形下，围绕当前 $1 billion 标记的区间是合理的。熊市情形下——quiet-luxury
              疲劳、销售消化走弱或利润率不及预期——倍数可能很快压缩到 Zegna / Kering 区间。关键在于，下行不是破产风险，而是一家已经按顶级品牌交易的公司发生倍数压缩。
