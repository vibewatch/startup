figures:
  - id: FO001
    title: The Row 里程碑时间线
    type: timeline
    layout: wide
    summary: The Row 从 2005-2006 年的起源故事缓慢长大，到 2024 年完成独角兽估值的少数股权交易，同时仍牢牢控制零售和曝光。
    data:
      items:
        - date: '2005'
          label: 品牌成立
          detail: 官方与合作伙伴页面把品牌成立时间定在 2005 年，围绕完美 T 恤的起源故事展开。
          tone: positive
          claimRefs:
            - CO001
        - date: '2006'
          label: 商业发布
          detail: 二手历史资料和合作伙伴页面将 2006 年列为品牌发布年份。
          tone: positive
          claimRefs:
            - CO002
        - date: 2012-06
          label: CFDA 突破
          detail: Olsen 姐妹在 CFDA Awards 获得年度女装设计师奖。
          tone: positive
          claimRefs:
            - CO014
        - date: '2014'
          label: 洛杉矶零售
          detail: The Row 通过 Melrose Place 开始放大自有零售网络。
          tone: positive
          claimRefs:
            - CO008
        - date: '2018'
          label: 男装扩展
