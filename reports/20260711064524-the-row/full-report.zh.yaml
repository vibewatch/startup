  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与渠道组合
        blocks:
          - type: paragraph
            body: >-
              The Row 的变现靠经典奢侈品时装屋组合，而不是订阅或交易平台模型。公开证据显示，它有高客单价 DTC 电商、小规模自营精品店基础，以及通过 Bergdorf Goodman、NET-A-PORTER 和
              Mytheresa 等零售商做精选批发。Particl 的线上销售分析显示，仅电商一年可能贡献约 $50M 到 $75M 销售额，约占业务
              30%；对一个强调触感的奢侈服装品牌来说，这一比例很高。同一报告称，服装贡献约四分之三销售额，手袋贡献约四分之一；不过手袋主导畅销 SKU 榜单，并可能拥有最强单位经济性。运营含义是，The Row
              的收入质量取决于同时平衡三个相互拉扯的目标：守住批发稀缺性，在不廉价化品牌的前提下扩大直营数字需求，并保持足够产品宽度来支撑奢侈品衣橱支出，同时避免滑向过度铺货。
