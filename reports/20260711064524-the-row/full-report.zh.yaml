      - number: '8.2'
        title: 公开市场与战略可比公司
        blocks:
          - type: paragraph
            body: >-
              对照公开可比公司，The Row 的表观倍数显得进取，但仍在奢侈品市场区间内。Yahoo Finance 给出的企业价值 / 收入倍数分别是：Brunello Cucinelli 约 4.60x，Moncler
              约 4.27x，Zegna 约 2.02x，Kering 约 3.00x。Brunello 2025 年收入为 €1.408 billion，Moncler 近 12 个月收入约 €3.13
              billion；这些品牌规模大得多、更多元、披露也充分得多，却只以相近或略高的收入倍数交易。这是反对为 The Row 付太高价格的最强论据。支持它的最强论据则是：The Row
              出售的是稀缺私有资产，而不是已规模化的公开平台。Golden Goose 2024 年推迟 IPO，原计划以 2023 年 €587 million 销售额冲击最高 €1.86 billion
              市值，这意味着在更艰难的市场窗口，一个高热度奢侈品牌约为 3.2x 销售额。战略先例也重要：Kering 持有 Valentino 30% 股权，Loro Piana 将 80% 股权出售给
              LVMH，都说明奢侈品买家常通过部分股权或战略性稀缺交易进入，而不只按干净的公开市场倍数逻辑出价。
