      - number: '1.2'
        title: 创始人、领导层与品牌可信度
        blocks:
          - type: paragraph
            body: >-
              The Row 至今离不开 Mary-Kate 和 Ashley Olsen
              的创意控制，但公开记录足以把这种集中度视为有意为之的运营选择，而不是粗疏报道造成的信息缺口。官方品牌页面把姐妹二人标为创始人；独立资料和时尚评论仍把她们视为品牌静奢身份的定义者。WWD
              的奖项报道显示，品牌很早就赢得行业可信度：Olsen 姐妹在 2012 年获得 CFDA 年度女装设计师，到 2015 年 The Row
              已被认真视为女装和配饰两条线的有力竞争者。这条长期轨迹对尽调很重要，因为它把 The Row 与依赖一时名气的明星授权项目区分开来。


              同时，外部可见的领导梯队很窄。围绕前总裁 David Schulte 2020 年诉讼的公开报道，以及 Yahoo 对纠纷的联合报道显示，The Row 拥有比公关形象更正式的执行层，包括 Schulte
              以及后来的 COO Fabrizio Fabbro；后者曾任职
              Burberry。但官方页面和已审阅的独立报道都没有发布当前董事会名单、委员会结构、财务负责人梯队或详细治理框架。正确解读不是治理缺失，而是治理透明度明显低于创始人的创意权威和品牌商品叙事。Olsen
              双胞胎因此构成有意义的关键人依赖，管理层深度尽调仍是现实议题。
