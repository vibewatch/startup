  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与同业分组
        blocks:
          - type: paragraph
            body: >-
              The Row 面对的不是一个单一竞争集合。最接近的重叠来自那些向富裕客户销售低调、超高端衣橱的时装屋；这些客户比起醒目标识，更在意面料、廓形和克制。在这个框架里，竞争场分成三类。第一类是 Bottega
              Veneta、Saint Laurent 和 Celine 等规模化时装屋，它们把成衣可信度与更大的配饰引擎、更多产品上新和更广门店网络结合起来。第二类是 Brunello Cucinelli 和 Loro
              Piana 等材料优先的奢侈品专家，它们少靠秀场声量，多靠羊绒、剪裁和深度富裕客户信任竞争。第三类是 Jil Sander 和 Lemaire 等哲学上相邻的极简主义者，即便规模和价格阶梯不同，设计语言也与
              The Row 重叠。这一点很重要，因为选择 The Row 的买家，往往是在多种静奢口味之间选择，而不是在高调品牌和无品牌之间选择。
