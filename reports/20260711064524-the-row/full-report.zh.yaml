  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: The Row 的产品系统堆叠的是美学语法、材料、制作、产品品类和服务，而不是软件模块。
    data:
      layers:
        - label: 品牌语法
          detail: 极简、克制、合身，以及稀缺性驱动的奢侈品信号。
        - label: 材料
          detail: 高端皮革、丝绸、天鹅绒、针织纱线和其他精细面料。
        - label: 制作
          detail: 意大利制造、手工收尾和精细结构细节。
        - label: 产品线
          detail: RTW、外套、手袋、鞋履和男装。
        - label: 服务层
          detail: 选择性分销、退货流程和客户关怀。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: The Row 卖的是一段衣橱旅程：从系列发现，到高客单购买，再到退货机制带来的安心感。
    data:
      nodes:
        - id: discover
          label: 发现系列
          detail: 官方 lookbook、伙伴策展、秀场报道和静奢声誉激发兴趣。
        - id: filter
          label: 选择品类
          detail: 客户按衣橱任务选择 RTW、包袋、鞋履或男装。
        - id: evaluate
          label: 评估材料与合身度
          detail: 产品页面和零售语境提供结构、颜色和廓形线索。
        - id: purchase
          label: 通过直营或精选伙伴渠道购买
          detail: 自有网店、门店和选择性零售商把意愿转成购买。
        - id: support
          label: 支持 / 退货
          detail: 退货流程降低昂贵线上购买的风险。
      edges:
        - from: discover
          to: filter
        - from: filter
          to: evaluate
        - from: evaluate
          to: purchase
        - from: purchase
          to: support
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE014
      - CE020
      - CE021
      - CE031
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: wide
    summary: The Row 依赖少数相互强化的资产：设计领导力、高端材料获取、手工制作、选择性渠道和客户关怀执行。
    data:
      nodes:
        - id: design
          label: 创始人 / 设计领导力
          detail: 对合身度、廓形和品牌一致性至关重要。
        - id: materials
          label: 高端材料
          detail: 奢侈品定位依赖持续获得精细面料和皮革。
        - id: making
          label: 意大利 / 手工制作
          detail: 执行质量把设计变成高端产品。
        - id: channels
          label: 选择性零售网络
          detail: 语境控制支撑定价和品牌呈现。
        - id: service
          label: 退货与客户关怀
          detail: 高客单线上订单需要这层 DTC 信任。
      edges:
        - from: design
          to: materials
        - from: materials
          to: making
        - from: making
          to: channels
        - from: channels
          to: service
