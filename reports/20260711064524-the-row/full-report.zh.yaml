chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与分销
        blocks:
          - type: paragraph
            body: >-
              The Row
              面向官方和合作伙伴的品牌语言，对于一家私营时装屋来说异常一致。公司把自己描述为建立在卓越面料、精准剪裁、微妙态度和不妥协品质之上的时装屋；零售商页面也用同一套叙事，把品牌放在安静精致而非醒目标识的框架里。当前货品也印证了这种定位：品牌官网主动销售女装、男装、手袋、鞋履和配饰；产品页呈现的是超高端价格结构，而不是入门产品阶梯。抓取当天，Soft
              Margaux 15 手袋标价 $4,700，Soft Margaux 12 标价 $4,350，女式外套价格从约 $2,850 延伸至 $12,500。上述可见价格很关键，因为它们确认 The Row
              在实践中站在美国奢侈品市场顶端，而不只是媒体速记里的高端标签。


              分销同样体现刻意稀缺，而不是追求大众规模。官方门店查询显示，自营门店位于 New York、Amagansett、Los Angeles、London 和 Paris；同时列出 Saks Fifth
              Avenue、Dover Street Market、Harrods、Galeries Lafayette、Le Bon Marché 和 Selfridges 内的受控点位。Bergdorf
              Goodman、NET-A-PORTER、SSENSE 和 Mytheresa 的第三方伙伴页面确认，The Row
              通过精选全球奢侈品批发商销售，而不是铺进广泛百货网络。因此，公开证据支持一种混合模型：在高端街区严控直营零售，配合精选专柜和精选电商伙伴，守住定价权和品牌隔离度。
