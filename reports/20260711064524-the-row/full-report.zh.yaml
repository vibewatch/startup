  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 交易锚点与 $1B 标记定价了什么
        blocks:
          - type: paragraph
            body: >-
              最干净的估值锚点，就是这轮少数股权融资本身。Oui Speak 报道，Wertheimer family、Bettencourt Meyers family、Imaginary Ventures 和
              StDominique Capital 以约 $1 billion 的估值投资 The Row。Particl 的后续分析，是公开资料里最有用的一次把标题估值转成经营数字的尝试：它把该业务框定为约 $250
              million 收入、约 $65 million EBITDA，以及 $50 million 至 $75 million 年电商销售额，约占总营业额的 30%。按这个口径，本轮给 The Row 的定价约为 4x
              收入、约 16x EBITDA。对于一家只有 5 家直营店、披露有限的公司，这个倍数偏高，但并不随机。同一份 Particl 工作称，线上收入大幅增长，前五大畅销产品全是手袋；这支持的是「稀缺 +
              利润率」故事，而不是规模故事。换句话说，$1 billion 标记承销的是品牌力、产品盈利能力，以及投资者为进入稀有奢侈资产而付费的意愿；它并未承销大规模分销或传统上市公司式透明度。
