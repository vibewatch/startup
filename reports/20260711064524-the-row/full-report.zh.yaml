      - number: '6.2'
        title: 渠道、地理与可获得性
        blocks:
          - type: paragraph
            body: >-
              The Row 的客户触达是全球性的，但不是大众奢侈品意义上的广泛。官方门店查询列出 New York、Amagansett、Los Angeles、London 和 Paris 的直营门店，以及 Saks
              Fifth Avenue、Dover Street Market、Harrods、Galeries Lafayette、Le Bon Marché 和 Selfridges
              内的受控点位。退货政策更有信息量：The Row 明确为一长串地区提供退货运费，覆盖 United States、United Kingdom、European Union、Canada、Japan、Hong
              Kong、South Korea、Singapore、Australia 和其他 Asia-Pacific 市场，同时允许门店退货。Mytheresa 另称其配送至 130
              多个国家。合在一起，这些数据点支持一张非常具体的客户地图：品牌想要全球需求，但希望这些需求通过严控的直营和高端伙伴体验流入。这与 EY 的发现一致：品牌门店仍是奢侈品整体尤其是 Mainland China 和
              Italy 的主导最终购买渠道，即便 Japan 仍让百货扮演更大角色。因此，The Row 看起来是为国际高端客户架构的；这些客户重视可信零售语境，程度不亚于产品本身。
