      - number: '7.2'
        title: 趋势周期、客户与分销边界
        blocks:
          - type: paragraph
            body: >-
              The Row 自身定位里也埋着结构性增长取舍。它的 quiet-luxury 美学，正好踩中去 Logo、重工艺的周期；但文化风向一变，同一套聚焦也会变成软肋。Morgan Stanley 称，2026
              年消费者已出现对 quiet luxury 疲劳的迹象；McKinsey 认为，奢侈品行业不能再只靠涨价托住需求。Bain 还指出，体验型消费增速超过实物商品，皮具和鞋履即便在整体市场企稳时仍承压。The Row
              有意收窄直营网点——New York、Amagansett、Los Angeles、London、Paris，再加精选
              concessions——守住了稀缺性，也压低了分销密度，使增长更依赖顶级客群持续主动寻找品牌。Particl 的反向观点在这里有参考价值：报告认为，该业务依赖一小群超高净值客户，上一年停掉了 10
              个以上产品类别，哪怕只是 viral jelly shoes 这类小质量失误，也可能威胁盈利能力。说到底，稀缺在变成天花板之前，才是护城河。
