  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              The Row 最清晰的市场边界不是「全部奢侈品」，甚至也不是所有个人奢侈品。Bain 和 Altagamma
              把广义个人奢侈品市场定义为时装、皮具、腕表、珠宝和美妆；它们处在一个更大的全球奢侈品宇宙里，后者还包括酒店、汽车和其他体验。对 The Row
              来说，真正相关的支出池还要更窄：富裕消费者购买的超高端成衣、鞋履、手袋和配饰；这些消费者明确重视工艺、永恒感和低标识表达。因此，真实替代集合包括 Hermès、Brunello Cucinelli、Loro
              Piana、Celine、Bottega Veneta，以及相邻的静奢衣橱；它们远比大众高端时装更相关。


              现状也比直接品牌竞争更宽。消费者可以把同一笔可自由支配预算转向多品牌零售商、百货探索、体验式旅行、康养、珠宝，甚至认证二手奢侈品。Bain、McKinsey、EY 和 BCG
              指向同一方向：消费者更挑剔、更价格敏感，也更在意体验；标识可见度的重要性低于设计、工艺和持久吸引力。这对 The Row
              很关键，因为它的市场在结构上高端，在心理上却竞争激烈。它竞争的不只是其他衣服，也是在与富裕和向往型买家表达品味、同时不做显性身份展示的其他方式竞争。
