  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: supplier-and-traceability-architecture
    missingEvidence: No public supplier list, sourcing concentration map, traceability dashboard, or animal-material standard surfaced in fetched sources.
    whyItMatters: Luxury product quality depends on the resilience and ethics of supply, not just on finished-product marketing.
    diligencePath: Request supplier concentration, sourcing geographies, material standards, and audit cadence by category.
    relatedQuestionRefs:
    - QE018
    - QE022
    - QE025
  - type: private-evidence-only
    severity: material
    topic: quality-kpis-and-repair-data
    missingEvidence: No public defect rate, repair incidence, return-by-size data, or post-purchase quality KPI disclosure.
    whyItMatters: Category expansion into footwear and broader accessories is only durable if defect and return rates remain controlled.
    diligencePath: Request QA pass rates, return reasons, repair frequency, and warranty / remake policy by category.
    relatedQuestionRefs:
    - QE021
    - QE023
    - QE025
  - type: missing-source
    severity: minor
    topic: formal-product-roadmap
    missingEvidence: No public roadmap with dated milestones beyond collection releases and seasonal drops.
    whyItMatters: Investors cannot distinguish planned expansion from ad hoc collection iteration without a clearer category-development plan.
    diligencePath: Request internal roadmap by category, launch objectives, and post-launch performance review process.
    relatedQuestionRefs:
    - QE012
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: menswear-scale
    missingEvidence: No public menswear revenue, sell-through, or contribution margin disclosure.
    whyItMatters: Menswear looks active and coherent, but public evidence does not show whether it is strategically meaningful or still experimental.
    diligencePath: Request menswear revenue share, store/door coverage, and repeat purchase by season.
    relatedQuestionRefs:
    - QE005
    - QE014
  - type: missing-source
    severity: minor
    topic: public-developer-signal-equivalent
    missingEvidence: No official engineering, code, API, or public technical-ops surface exists because The Row is a luxury fashion house rather than a software platform.
    whyItMatters: The workflow requires a developer-signal analogue, but product-and-supply-chain recruiting is the closest public practitioner proxy available.
    diligencePath: Supplement with sourcing, production, and operations hiring interviews or trade-fair presence if deeper operational proof is needed.
    relatedQuestionRefs:
    - QE019
    - QE020
