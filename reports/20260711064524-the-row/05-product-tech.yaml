- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - The Row solution
  - Observed benefit
  - Limitation
  rows:
  - - Build a signature minimalist work wardrobe
    - Mix separate luxury pieces across multiple brands
    - Seasonal RTW collections plus outerwear and shoes create full-look coherence
    - High aesthetic consistency across categories
    - No public evidence on capsule conversion or repeat-rate
  - - Buy a status-signaling but logo-light handbag
    - Search for iconic but understated carry goods
    - Hero leather bags and new-arrival handbag cadence
    - Quiet status and high-ticket accessory option
    - No public waitlist or repair-policy data
  - - Dress for travel / summer luxury
    - Combine light tailoring with comfortable flats or sandals
    - Summer 2026 women’s and menswear pages show lightweight fabrics and flat-soled shoes
    - Supports casual-sartorial use cases without brand dilution
    - No public durability or wear-test data
  - - Purchase in a controlled luxury environment
    - Shop direct or through curated high-end retailers
    - Own webstore, stores, Bergdorf, NET-A-PORTER, Mytheresa, FWRD
    - High brand-context control relative to broad wholesale
    - Partner economics and markdown support remain undisclosed
  - - Resolve fit or post-purchase issues
    - Return, exchange, or contact customer care
    - 14-day returns with many regions covered by The Row shipping label
    - Reduces purchase friction for expensive items
    - Returns cost and approval rates are not disclosed
  notes: Benefits are observable from assortment and policy evidence, not measured company KPIs.
