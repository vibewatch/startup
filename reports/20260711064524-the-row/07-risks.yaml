- id: competition-scale-and-macro-cyclicality
  title: Competition, Scale, and Macro Cyclicality
  body: 'The Row is not competing in a vacuum. It is competing against houses that are larger, richer, and much more disclosed. Kering reported €14.7 billion of 2025 revenue, with Bottega Veneta alone at €1.706 billion, while Yahoo Finance shows Moncler at about €3.13 billion of trailing revenue, Zegna near $1.92 billion of trailing revenue, and Brunello Cucinelli above €1.4 billion of 2025 sales with strong growth continuing in 2026. Those peers also come with public-market infrastructure: regular results, segment detail, investor communications, and more visible capital allocation. The Row does not. Particl’s estimate of roughly $250 million of revenue against a $1 billion valuation makes the scale gap obvious. Even if The Row’s brand prestige is elite, its operating platform is still a fraction of European competitors that can spread fixed costs across far larger store networks, media budgets, and supply chains. The macro backdrop compounds that disadvantage. Morgan Stanley expects only
    about 2.5% luxury-goods growth in 2026; Bain’s base case is 2% to 4% growth after a 2025 dip; McKinsey is still talking about 1% to 3% annual growth and ongoing pressure on aspirational consumers. In a soft market, larger groups can absorb volatility more easily than an independent brand with fewer levers.'
