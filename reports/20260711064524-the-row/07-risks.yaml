callouts:
- calloutType: risk
  title: The single biggest risk is institutional, not aesthetic
  body: The Row clearly has aesthetic power. The harder question is whether that power can survive or scale beyond a founder-centric and opaque operating structure.
  claimRefs:
  - CR001
  - CR004
  - CR005
  - CR016
  - CR043
- calloutType: insight
  title: Scarcity cuts both ways
  body: Selective distribution is the source of The Row’s allure, but it also means fewer shock absorbers if demand wobbles or partners slow.
  claimRefs:
  - CR017
  - CR018
  - CR042
- calloutType: recommendation
  title: Underwrite like a luxury company, not like a myth
  body: Before increasing conviction, investors need founder-succession evidence, reporting cadence, board rights, and proof that growth can occur without brand dilution.
  claimRefs:
  - CR016
  - CR036
  - CR043
