  rows:
  - - The Row
    - Independent direct peer
    - Founder-controlled; ~$1B valuation disclosed in 2024; selective store base
    - Ultra-affluent minimalist luxury buyer
    - Purest American minimalist aesthetic; tightly edited assortment
    - Smaller balance sheet and store network than European groups
  - - Bottega Veneta
    - Direct peer / incumbent house
    - Kering house; group FLG segment at €2.852B in Q1 2026
    - Affluent global accessories + RTW customer
    - Intrecciato leather identity, strong bag engine, global luxury reach
    - Broader fashion cycle and bigger accessory exposure reduce The Row-like purity
  - - Brunello Cucinelli
    - Direct peer / craft specialist
    - €369.1M Q1 2026 revenue; public Italian luxury company
    - UHNW and affluent clients prioritizing knitwear, tailoring, and lifestyle luxury
    - Cashmere credibility, balanced retail/wholesale growth, exclusive-luxury positioning
    - Leans more relaxed Italian luxury than sharp minimalist fashion
  - - Loro Piana
    - Direct peer / material specialist
    - LVMH house; ~180 stores; 10 Italian production sites
    - Top-tier fabric connoisseur and wealthy traveler
    - Vertical control, fiber leadership, quiet wealth credibility
    - More material-led than silhouette-led; less American-fashion distinctiveness
  - - Celine
    - Adjacent direct peer / incumbent house
    - LVMH house; 178 stores; 2,500 employees
    - Global luxury client seeking Parisian RTW + leather goods
    - Large store base, strong RTW/accessory reach, Paris prestige
    - More scaled and trend-sensitive than The Row’s tighter edit
  - - Jil Sander
    - Philosophical direct peer
    - OTB-owned; ~70 boutiques plus multibrand retail
    - Minimalist fashion buyer across women and men
    - Closest overlap on modern minimalism and precision
    - Smaller cultural aura and lower public scale signals than top groups
  - - Lemaire
    - Adjacent minimalist substitute
    - Independent Paris label with meaningful multibrand presence
    - Creative/intellectual luxury buyer at a lower perceived threshold
    - Architectural shapes and loyal wardrobe framing
    - Lower scale and generally more accessible than The Row’s ultra-premium posture
  notes: Selected peer set focused on brands most likely to compete with The Row for understated luxury wardrobe spend, not the entire global luxury industry.
