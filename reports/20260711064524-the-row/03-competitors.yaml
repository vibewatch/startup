- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Purity of minimalist design language
    - Quiet luxury becomes crowded or cyclical
    - High
    - If understatement stops feeling scarce, bigger houses can imitate the look with more scale
    - Test repeat-purchase behavior and client retention across product categories
  - - Selective distribution and scarcity
    - Incumbent houses expand controlled retail and clienteling faster
    - Medium
    - The Row’s scarcity helps brand heat but can also limit reach relative to Kering/LVMH doors
    - Request door productivity, waitlist, and appointment-conversion data
  - - Founder aura and cultural cachet
    - Key-person dependency on Mary-Kate and Ashley Olsen
    - High
    - Creative concentration is part of the moat and part of the fragility
    - Assess succession depth, design bench, and merchandising autonomy
  - - High-ticket wardrobe credibility
    - Multi-homing across luxury wardrobes
    - Medium
    - Buyers can mix The Row with Loro, Bottega, Saint Laurent, or Jil Sander with little friction
    - Request cross-category repeat rate and top-client wallet-share evidence
  - - Independence and clean brand codes
    - Capital asymmetry versus group-owned rivals
    - High
    - Larger groups can outspend on stores, marketing, leather goods, and talent while keeping quiet-luxury exposure diversified
    - Request capex plan, store economics, and wholesale concentration by partner
  notes: Risk severities reflect researcher judgment grounded in fetched sources rather than public market-share disclosures.
