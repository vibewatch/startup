  topStrengths:
    - 'Rare brand with genuine scarcity: global demand evidence exists despite intentionally limited distribution'
    - Founder-market fit is unusually strong, with Mary-Kate and Ashley Olsen functioning as enduring creative anchors
    - Handbag-led brand equity and strong e-commerce signals support premium unit economics
    - Prestige validation from investors and wholesale partners confirms real luxury-market relevance
  topRisks:
    - 'Founder concentration is extreme: the brand identity remains tightly bound to Mary-Kate and Ashley Olsen'
    - The current valuation already assumes continued scarcity, pricing power, and quiet-luxury durability
    - The Row remains far smaller and less disclosed than premium public peers such as Brunello Cucinelli or Moncler
    - Minority-round terms, governance rights, and detailed financial metrics remain private
