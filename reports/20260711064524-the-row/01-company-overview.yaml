- id: milestones-and-adverse-signals
  title: Milestones and Adverse Signals
  body: 'The Row’s chronology shows a brand that scaled slowly but coherently. Secondary histories say the house was conceived in 2005 and commercially launched in 2006 from an obsession with the perfect T-shirt; retailer and editorial descriptions still cite that origin story. From there, the milestone path is legible: early CFDA recognition validated the design proposition, Los Angeles and then London deepened direct retail, menswear arrived before the pandemic, and Paris became both a storefront and symbolic escalation point as outside capital came in. WWD’s ongoing review pages also show that The Row continues to shape, rather than merely follow, the quiet-luxury conversation in 2025 and 2026.


    The adverse record is real but not thesis-breaking. The Fashion Law and UniCourt document David Schulte’s March 2020 suit against the brand and its principals, with the complaint filed under seal and later motions focused on keeping records confidential. The Fashion Law also preserved the brand’s internship-litigation outcome, where a roughly $140,000 settlement was split across a large class of former interns. Femfounded adds that the company reportedly laid off about half its staff in 2020 while grappling with COVID disruption and Barneys’ bankruptcy exposure. Taken together, those events suggest The Row is not immune to operating shocks, labor disputes, or leadership friction. But the brand’s subsequent Paris-store opening, investor round, and continued premium pricing also show it recovered without abandoning its scarcity-led positioning.'
