          detail: Brand-funded return labels in many regions can reduce contribution margin.
        - id: grossprofit
          label: Gross margin
          detail: Unknown publicly; depends on materials, markdowns, and channel mix.
        - id: opex
          label: Store + clienteling + corporate opex
          detail: Luxury service, stores, and merchandising absorb operating profit.
        - id: ebitda
          label: Operating earnings
          detail: Audited EBITDA and cash conversion are not publicly disclosed.
      edges:
        - from: list
          to: mix
