  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder, Governance, and Legal Fragility
        blocks:
          - type: paragraph
            body: >-
              The Row’s most fundamental risk is that its brand and its founders are effectively inseparable. Official
              brand pages still center the house around Mary-Kate and Ashley Olsen’s aesthetic mission, and WWD’s 2026
              runway review is written through the lens of what “the sisters” are doing rather than through a broader
              management system. That is not just branding language. BCG’s 2026 luxury research says top-tier consumers
              are unusually attentive to creative directors, with one in four specifically choosing a brand because of
              its creative leadership. For a house like The Row, that means founder succession risk is not abstract. If
              the Olsens stepped back, the brand could lose a meaningful part of the signal that makes its customer base
              and product authority coherent. The legal record also shows prior strain. The Fashion Law documented the
              2020 David Schulte suit against the Olsens, The Row, and Dualstar, along with a prior internship case that
              settled for about $140,000 across 185 interns. Neither case destroys the thesis by itself, but both matter
              because they reveal how thin the public governance layer is. Official materials do not surface a board
              roster, committee structure, or succession plan, so outsiders can see the founders but not the bench
              underneath them.
            claimRefs:
