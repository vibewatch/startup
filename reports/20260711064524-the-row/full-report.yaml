      - number: '3.4'
        title: Moat Durability, Switching Cost, and Adverse View
        blocks:
          - type: paragraph
            body: >-
              The Row’s moat is real but softer than the moats of vertically integrated or publicly capitalized rivals.
              Its advantages are aesthetic consistency, founder aura, careful distribution, and the fact that its
              logo-free codes remain difficult to imitate without looking derivative. Those strengths create meaningful
              preference and clienteling stickiness, yet luxury wardrobes are inherently multi-homed: a customer can buy
              The Row coats, Bottega bags, Loro Piana knitwear, and Saint Laurent shoes in the same season. That makes
              switching cost psychological and lifestyle-based rather than contractual. The adverse view is equally
              important. VML’s 2026 trend work suggests that some consumers are tiring of quiet luxury as a monolithic
              trend, while McKinsey argues the sector can no longer rely on price increases alone to drive growth. If
              understatement becomes crowded or cyclically less resonant, larger houses with stronger accessory
              franchises and marketing infrastructure may capture more of the profit pool than an independent minimalist
              specialist. Public data also do not provide apples-to-apples revenue or share figures for several private
              or intra-group competitors, which limits precision in ranking The Row by market share.
