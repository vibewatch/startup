      - number: '2.3'
        title: Buyers, Payers, and the Channel Path
        blocks:
          - type: paragraph
            body: >-
              The Row’s buyer map spans both true top-tier clients and more selective aspirational consumers, but the
              market is clearly shifting toward the former. Knight Frank shows wealth creation continuing at the very
              top, with the UHNWI population rising sharply from 2021 to 2026, while BCG says top-tier clients have
              become the most stable growth engine and aspirational consumers are driving most volatility. EY adds that
              aspirational luxury buyers still matter enormously, but they increasingly want experiences, AI-enabled
              personalization, pre-owned options, and better justification for price. J.P. Morgan and Morgan Stanley
              reinforce the same point from the macro side: brands with heavier exposure to aspirational shoppers face
              more strain in a K-shaped environment, while the most exclusive houses remain more resilient.


              Channel behavior also matters. EY says brand stores remain the dominant final purchase channel for
              surveyed aspirational clients, while department stores are still influential in markets like Japan. Bain
              sees mono-brand retail remaining experience-led, direct online stabilizing, and multi-brand retailers
              caught between brand pullback and consumer demand. That channel picture fits The Row well. Its flagship
              stores, tight concession network, and curated online wholesale partners mirror where the luxury market is
              going: fewer undifferentiated doors, more controlled environments, more emphasis on service and physical
              theatre, and a resale loop that increasingly influences primary-market purchase decisions.
