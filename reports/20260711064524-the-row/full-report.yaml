  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Peer Buckets
        blocks:
          - type: paragraph
            body: >-
              The Row does not face one monolithic competitor set. The closest overlap comes from houses selling
              understated, ultra-premium wardrobes to affluent clients who care more about fabric, silhouette, and
              discretion than visible logos. Inside that frame, the competitive field splits into three buckets. First
              are scale fashion houses like Bottega Veneta, Saint Laurent, and Celine, which combine ready-to-wear
              credibility with far larger accessory engines, more product drops, and broader store networks. Second are
              material-first luxury specialists such as Brunello Cucinelli and Loro Piana, which compete less on runway
              noise and more on cashmere, tailoring, and deep wealthy-client trust. Third are philosophically adjacent
              minimalists like Jil Sander and Lemaire, whose design language overlaps with The Row even if their scale
              and price ladders differ. This matters because a buyer choosing The Row is often choosing among multiple
              flavors of quiet luxury rather than between loud branding and no branding.
