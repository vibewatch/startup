  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product-Line Map and Customer Jobs
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to understand The Row’s product surface is as a quiet-luxury wardrobe system rather than
              a set of isolated SKUs. Official and partner pages show women’s ready-to-wear, handbags, footwear,
              outerwear, and menswear as the main delivery layers, with seasonal lookbooks stitching them into complete
              wardrobes. The customer job is not simply to buy a coat or bag; it is to assemble a restrained but
              status-rich uniform for work, travel, evening, and everyday use. The women’s Summer 2026 collection page,
              handbags-new-arrivals page, official outerwear assortment, and Summer 2026 menswear coverage all point to
              the same operating pattern: the brand sells full-look coherence, not logo spectacle. That coherence
              matters because it explains why The Row can stretch across categories without seeming broad in the
              mass-luxury sense. The assortment is large enough to complete a wardrobe, but edited enough to preserve
              scarcity and price integrity. Public sources consistently show the house thinking in looks, not isolated
              commodities. Very deliberately.
