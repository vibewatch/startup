      - number: '3.2'
        title: Price Architecture and Assortment Breadth
        blocks:
          - type: paragraph
            body: >-
              Observed assortment snapshots show that The Row sits at the top of an already premium peer set. On the
              2026-07-11 fetch date, The Row showed hero bags around $4,700 and women’s outerwear roughly from $2,850 to
              $12,500. Bottega Veneta and Saint Laurent spanned broad ready-to-wear, footwear, and handbag assortments
              with visible prices reaching into the mid-four to low-five figures, but also showed lower visible entry
              points than The Row. Loro Piana likewise reached jacket and bag prices that sustain ultra-premium
              positioning, though its selling story leans more heavily on fiber quality and vertical control.
              Valentino’s visible assortment was somewhat lower in the sampled price band but broader and more
              fashion-seasoned. The practical implication is that The Row is not the cheapest minimalist option nor the
              most industrially scaled one; it competes by keeping the assortment edited and the average perceived taste
              signal high.
