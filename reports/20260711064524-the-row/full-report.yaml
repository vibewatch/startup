  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Founder dependency
        - Creative-director change or prolonged absence
        - Named founder steps back without clearly credible successor
        - Escalate to thesis-break review
      - - Trend fatigue
        - Search, low-stock, or reorder signals weaken across hero bags
        - Two or more seasons of weaker desirability without replacement icon
        - Reduce conviction on growth durability
      - - Distribution ceiling
        - Store / partner network remains flat while peers keep outgrowing
        - No meaningful productivity proof despite selective scarcity story
        - Treat exclusivity as a growth cap, not a moat
      - - Quality / assortment risk
        - Category discontinuations rise or a second viral quality issue emerges
        - Repeated visible product errors in a 12-month window
        - Re-underwrite margin and brand resilience assumptions
      - - Minority-rights opacity
        - Investors receive limited information or governance surprises surface
