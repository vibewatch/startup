  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Channel Mix
        blocks:
          - type: paragraph
            body: >-
              The Row monetizes through a classic luxury-house mix rather than a subscription or marketplace model.
              Public evidence shows high-ticket direct-to-consumer e-commerce, a small owned-boutique base, and curated
              wholesale through retailers such as Bergdorf Goodman, NET-A-PORTER, and Mytheresa. Particl’s online-sales
              analysis suggests e-commerce alone may represent roughly $50 million to $75 million of annual sales and
              about 30% of the business, which is high for a tactile luxury apparel brand. That same report says apparel
              drives about three quarters of sales while handbags drive roughly one quarter, even though handbags
              dominate the top-selling SKU list and likely carry the strongest unit economics. The operational
              implication is that The Row’s revenue quality depends on balancing three competing goals at once:
              preserving wholesale scarcity, growing direct digital demand without cheapening the brand, and keeping
              enough product breadth to support luxury wardrobe spend without slipping into over-assortment.
