companyProfile:
  summary: |
    The Row is a New York luxury label founded by Mary-Kate and Ashley Olsen and publicly defined
    by quiet, high-craft design rather than overt logo signaling. Official and partner evidence
    shows a deliberately selective model: a small owned-boutique footprint in New York, Amagansett,
    Los Angeles, London, and Paris; concessions in prestige department stores; and curated global
    wholesale distribution through Bergdorf Goodman, NET-A-PORTER, SSENSE, and Mytheresa. Public
    financial visibility is limited, but independent reporting and the financial chapter’s estimate
    place annual revenue around $250M-$300M, while 2024 minority-investment reporting put the brand
    at approximately a $1B valuation.
