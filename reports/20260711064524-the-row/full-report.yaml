      - number: '3.3'
        title: Incumbent Scale and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              The biggest structural gap between The Row and much of its peer set is not taste but platform scale.
              Kering reported €3.568 billion of first-quarter 2026 revenue and said both Saint Laurent and Bottega
              Veneta grew year over year, while LVMH ended 2025 at €80.8 billion of revenue across more than 75 brands
              and over 6,280 stores. Celine alone is presented by LVMH with 178 stores and 2,500 employees, and Loro
              Piana with about 180 stores and ten owned Italian production sites. Brunello Cucinelli, while much smaller
              than Kering or LVMH, still generated €369.1 million in Q1 2026 and described balanced growth across
              retail, wholesale, the Americas, Europe, and Asia. Against that backdrop, The Row’s selective wholesale
              partners and handful of flagships look strategically coherent but undeniably narrower. Independence
              protects purity, but it also leaves the brand with less balance-sheet firepower, fewer doors, and less
              disclosed operating leverage than the European houses surrounding it.
