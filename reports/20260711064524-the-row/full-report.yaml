      - number: '7.2'
        title: Trend-Cycle, Customer, and Distribution Limits
        blocks:
          - type: paragraph
            body: >-
              The Row also faces a structural growth trade-off embedded in its own positioning. Its quiet-luxury
              aesthetic has been exceptionally well matched to the post-logo, craftsmanship-first moment, but the same
              focus becomes a vulnerability if culture shifts. Morgan Stanley says there are already signs of consumer
              fatigue with quiet luxury in 2026, and McKinsey argues that the luxury sector can no longer rely on price
              increases alone to carry demand. Bain adds that experiences are outgrowing tangible goods and that leather
              goods and footwear remain under pressure even as the overall market stabilizes. The Row’s intentionally
              narrow direct footprint—New York, Amagansett, Los Angeles, London, and Paris plus selective
              concessions—protects exclusivity, but it also caps distribution density and makes growth more dependent on
              the continued willingness of top-tier shoppers to seek the brand out. Particl’s adverse view is useful
              here: the report argues that the business relies on a small ultra-wealthy customer base, that more than
              ten product categories were discontinued in the prior year, and that even a small quality miss like the
              viral jelly shoes issue can threaten profitability. Put simply, scarcity is a moat until it becomes a
              ceiling.
            claimRefs:
