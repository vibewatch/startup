      - number: '8.2'
        title: Public and Strategic Comparables
        blocks:
          - type: paragraph
            body: >-
              Against public comparables, The Row’s headline multiple looks ambitious but still within luxury-market
              range. Yahoo Finance puts Brunello Cucinelli at about 4.60x enterprise value to revenue, Moncler at about
              4.27x, Zegna at about 2.02x, and Kering at about 3.00x. Brunello’s 2025 revenue was €1.408 billion and
              Moncler’s trailing revenue is about €3.13 billion, which means those houses trade at similar or only
              modestly higher top-line multiples despite being much larger, more diversified, and far more disclosed.
              That is the strongest argument against overpaying for The Row. The strongest argument in favor is that The
              Row’s brand is being sold as a scarce private asset, not a scaled public platform. Golden Goose’s
              postponed 2024 IPO, which targeted up to €1.86 billion of market capitalization on €587 million of 2023
              sales, points to roughly 3.2x sales for a high-heat luxury name in a tougher market window. Strategic
              precedents also matter: Kering’s 30% Valentino stake and Loro Piana’s 80% sale to LVMH show that luxury
              buyers often enter through partial stakes or strategic scarcity deals rather than through clean,
              public-market multiple logic alone.
