  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Deal Anchor and What the $1B Mark Prices In
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchor is the minority round itself. Oui Speak reported that the Wertheimer family,
              the Bettencourt Meyers family, Imaginary Ventures, and StDominique Capital invested in The Row at an
              approximately $1 billion valuation. Particl’s follow-up analysis is the most useful public attempt to
              translate that headline into operating math: it frames the business at roughly $250 million of revenue,
              about $65 million of EBITDA, and $50 million to $75 million of annual e-commerce sales, or roughly 30% of
              total turnover. On that view, the round priced The Row at roughly 4x revenue and about 16x EBITDA. That is
              a rich multiple for a company with only five direct stores and limited disclosure, but it is not random.
              The same Particl work says online revenue grew sharply and that the top five best-selling products were
              all handbags, which supports a scarcity-plus-margin story rather than a scale story. In other words, the
              $1 billion mark is underwriting brand power, product profitability, and investor willingness to pay for
              access to a rare luxury asset—not underwriting mass distribution or conventional public-company
              transparency.
            claimRefs:
