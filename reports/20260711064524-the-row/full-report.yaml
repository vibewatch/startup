      - number: '7.4'
        title: Transparency, Regulatory Burden, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The last risk is not one discrete event but the compounding effect of opacity. SEC materials and DFIN’s
              private-company guidance make clear that private businesses do not live under the same public-reporting
              regime as listed companies unless specific thresholds are crossed, and minority investors often rely on
              negotiated information rights rather than automatic periodic disclosures. Miller Law and Angel Investors
              Network both emphasize that minority holders without board seats can be exposed to poor visibility, weak
              liquidity, and contractual dependence on shareholder agreements. That matters directly for The Row because
              prestigious minority money is now on the cap table, yet the public still does not know the exact stake
              sold, the board rights granted, the veto package, or the refresh terms on future capital. At the same
              time, Europe is tightening product sustainability expectations. The European Commission’s ESPR FAQ says
              the Ecodesign for Sustainable Products Regulation entered into force in July 2024 and will bring Digital
              Product Passport and broader product-sustainability expectations into the market. For a brand that sells
              in London and Paris and depends on premium materials, any increase in compliance friction, documentation
              needs, or sustainability scrutiny creates execution burden. The combination of private-company opacity and
              rising regulatory/operational demands means diligence must focus less on brand mythology and more on
              concrete control rights, reporting cadence, and proof that the business can scale without losing
              exclusivity or margin discipline.
            claimRefs:
              - CR010
