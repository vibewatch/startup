        title: Margin Structure and Unit-Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Because The Row is private, public underwriting has to lean on proxies rather than reported margin lines.
              Kering’s 2025 results show Saint Laurent at a 20.0% recurring operating margin and Bottega Veneta at
              15.6%, while LVMH reported a 22% operating margin and 66% gross margin at group level. Deloitte’s 2026
              luxury executive survey says pricing power, brand desirability, clienteling, and store optimization remain
              central to defending margins, which is directionally supportive for a label like The Row. Still, peer
              margins are not plug-and-play for an independent brand. The Row’s smaller scale, selective-door strategy,
              and likely higher dependence on manual product curation could either support superior gross margin through
              scarcity or compress operating margin through lower fixed-cost absorption. Particl’s product-mix evidence
              suggests handbags are likely the best economic engine, but the same source also flags product
              discontinuations and a recent product-quality miss, which is exactly the kind of issue that can destroy
              luxury inventory efficiency if it spreads.
