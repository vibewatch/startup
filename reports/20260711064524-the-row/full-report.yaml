  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment Profile and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              The Row does not sell to one monolithic customer. The public record points to three concentric groups. At
              the core are wealthy end customers buying directly from therow.com and from owned stores for
              wardrobe-building, leather goods, and quiet status signaling. Around that core sits a prestige wholesale
              layer—Bergdorf Goodman, NET-A-PORTER, SSENSE, and Mytheresa—that both monetizes demand and validates it,
              because these are not broad discount doors but highly selective luxury contexts. Around both sits a
              tastemaker layer that includes stylists, editors, celebrities, and resale buyers who amplify the brand
              without being formally disclosed as customers. External luxury-consumer data also helps frame the likely
              economics of that audience. BCG says top-tier luxury clients now account for 24% of sector spend and are
              the most stable growth engine, while aspirational demand has become the most volatile part of the market.
              For a brand with four-figure handbags, discreet branding, and selective distribution, that implies a
              customer mix tilted upward in wealth and downward in breadth versus mainstream luxury houses.
