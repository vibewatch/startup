  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest market boundary for The Row is not ‘all luxury’ and not even all personal luxury goods. Bain
              and Altagamma define the broad personal luxury goods market as fashion, leather goods, watches, jewelry,
              and beauty inside a much larger global luxury universe that also includes hospitality, autos, and other
              experiences. For The Row, the practically relevant spend pool is narrower still: ultra-premium
              ready-to-wear, shoes, handbags, and accessories purchased by affluent consumers who explicitly care about
              craftsmanship, timelessness, and low-logo signaling. That is why the real substitute set includes Hermès,
              Brunello Cucinelli, Loro Piana, Celine, Bottega Veneta, and adjacent quiet-luxury wardrobes far more than
              mass premium fashion.


              The status quo is also broader than direct brand competition. Consumers can route the same discretionary
              budget into multi-brand retailers, department-store discovery, experiential travel, wellness, jewelry, or
              even certified pre-owned luxury. Bain, McKinsey, EY, and BCG all point in the same direction: consumers
              are becoming more selective, price-sensitive, and experience-aware, while logo visibility matters less
              than design, craftsmanship, and lasting appeal. That matters for The Row because its market is
              structurally premium but psychologically competitive. It is competing not only against other clothes, but
              against other ways affluent and aspirational buyers express taste without obvious status display.
            claimRefs:
