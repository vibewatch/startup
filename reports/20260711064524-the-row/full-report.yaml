chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Positioning, and Distribution
        blocks:
          - type: paragraph
            body: >-
              The Row’s official and partner-facing brand language is unusually consistent for a private fashion house.
              The company describes itself as a house built on exceptional fabrics, precise tailoring, subtle attitude,
              and uncompromising quality; retailer pages echo the same message by framing the label around quiet
              refinement rather than overt logos. That positioning is visible in the current assortment: the brand’s own
              site actively merchandises womenswear, menswear, handbags, shoes, and accessories, while product pages
              show an ultra-premium price architecture rather than a ladder of entry products. On the fetch date, the
              Soft Margaux 15 bag was listed at $4,700, the Soft Margaux 12 at $4,350, and women’s outerwear stretched
              from roughly $2,850 to $12,500. Those observed prices matter because they confirm The Row’s place at the
              top of the American luxury market in practice, not just in editorial shorthand.


              Distribution also reflects deliberate scarcity rather than mass scale. The official store finder shows
              owned locations in New York, Amagansett, Los Angeles, London, and Paris, while also listing controlled
              placements inside Saks Fifth Avenue, Dover Street Market, Harrods, Galeries Lafayette, Le Bon Marché, and
              Selfridges. Third-party partner pages at Bergdorf Goodman, NET-A-PORTER, SSENSE, and Mytheresa confirm
              that The Row is sold through select global luxury wholesalers rather than broad department-store networks.
              Public evidence therefore supports a hybrid model: tightly controlled direct retail in prestige
              neighborhoods, selective concessions, and curated e-commerce partners that preserve pricing power and
              brand insulation.
