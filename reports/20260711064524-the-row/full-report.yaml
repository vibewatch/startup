      - number: '1.2'
        title: Founders, Leadership, and Brand Credibility
        blocks:
          - type: paragraph
            body: >-
              The Row remains inseparable from Mary-Kate and Ashley Olsen’s creative control, but the public record
              gives enough evidence to treat that concentration as a deliberate operating choice rather than a gap
              created by sloppy reporting. Official brand pages identify the sisters as founders, while independent
              references and editorial reviews still position them as the defining authors of the label’s quiet-luxury
              identity. WWD’s awards coverage shows the brand’s industry credibility was earned early: the Olsens won
              CFDA Womenswear Designer of the Year in 2012, and by 2015 The Row was being treated as a serious contender
              across both womenswear and accessories. That long arc matters for diligence because it separates The Row
              from celebrity-licensing projects that depend on transient fame.


              At the same time, the leadership bench that is visible to outsiders is narrow. Public reporting around
              former president David Schulte’s 2020 lawsuit and Yahoo’s syndicated coverage of the dispute indicate that
              The Row had a more formal executive layer than its publicity profile suggested, including Schulte and
              later COO Fabrizio Fabbro, formerly of Burberry. But neither official pages nor the reviewed independent
              coverage publishes a current board roster, committee structure, finance-lead bench, or detailed governance
              framework. The right read is not that governance is absent; it is that governance is materially less
              transparent than the founders’ creative authority and the brand’s merchandising narrative. That leaves
              meaningful key-person dependency on the Olsen twins and makes management-depth diligence a live issue.
            claimRefs:
