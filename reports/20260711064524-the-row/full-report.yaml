      - number: '8.3'
        title: Scenario Ranges and Minority Adjustments
        blocks:
          - type: paragraph
            body: >-
              A useful way to handle The Row is to separate enterprise quality from stake mechanics. On enterprise
              quality, the company plausibly deserves to trade above mass luxury because the brand has genuine scarcity,
              strong handbag economics, and unusually prestigious minority investors. On stake mechanics, however, the
              September 2024 price is still a minority valuation in a private company. Minority rounds can carry
              scarcity premiums, signaling premiums, and relationship value that do not automatically transfer to a 100%
              control valuation. They can also hide governance asymmetries because outsiders do not know the exact
              information rights, protective provisions, or future-dilution terms that were negotiated. That is why the
              right answer is a range, not a point estimate. In a bull case, if revenue expands into the high-$200
              millions, handbags remain dominant, and investor cachet continues to pull demand, a premium multiple
              closer to Brunello’s can be defended. In a base case, a range around the current $1 billion mark is fair.
              In a bear case—quiet-luxury fatigue, weaker sell-through, or margin disappointment—the multiple can
              compress quickly toward Zegna/Kering territory. The key is that the downside is not bankruptcy risk; it is
              multiple compression on a company that already trades like an elite house.
            claimRefs:
