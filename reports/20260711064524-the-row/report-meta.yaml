companyProfile:
  summary: |
    The Row is a New York luxury label founded by Mary-Kate and Ashley Olsen and publicly defined
    by quiet, high-craft design rather than overt logo signaling. Official and partner evidence
    shows a deliberately selective model: a small owned-boutique footprint in New York, Amagansett,
    Los Angeles, London, and Paris; concessions in prestige department stores; and curated global
    wholesale distribution through Bergdorf Goodman, NET-A-PORTER, SSENSE, and Mytheresa. Public
    financial visibility is limited, but independent reporting and the financial chapter’s estimate
    place annual revenue around $250M-$300M, while 2024 minority-investment reporting put the brand
    at approximately a $1B valuation.
  foundedDate: "2006-01-01"
  founders:
    - name: "Mary-Kate Olsen"
      role: "Co-Founder & Co-Creative Director"
      background: |
        Mary-Kate Olsen co-founded The Row and remains one of the two public creative identities most
        closely associated with the brand’s design authority and market positioning.
      claimRefs: [CO013]
    - name: "Ashley Olsen"
      role: "Co-Founder & Co-Creative Director"
      background: |
        Ashley Olsen co-founded The Row and remains one of the two public creative identities most
        closely associated with the brand’s design authority and market positioning.
      claimRefs: [CO013]
  foundingLocation: "New York, NY, USA"
  headquarters: "New York, NY, USA"
  productSummary: |
    Ultra-premium ready-to-wear, handbags, shoes, and accessories sold at four-figure and, for some
    categories, five-figure price points. Public evidence particularly highlights handbags such as
    the Margaux line and premium outerwear as core markers of the brand’s pricing power.
  customerFocus: >
    Ultra-high-net-worth and affluent luxury customers globally, especially women seeking
    understated, craftsmanship-led fashion; served through own boutiques, e-commerce, concessions,
    and a curated set of top-tier wholesale partners.
  businessModel: >
    Scarcity-led luxury brand model combining direct-to-consumer e-commerce, a very small owned
    boutique network, selective concessions, and curated global wholesale distribution rather than
    broad-scale wholesale expansion.
  stage: "Growth / private"
  fundingStatus: >
    Minority investment round reported in September 2024 at roughly a $1B valuation, with investors
    including the Wertheimer family, Bettencourt Meyers family vehicles, Imaginary Ventures, and
    StDominique Capital.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO006, CO012, CO013, CO017, CO018, CO019, CO020, CO021, CO031, CI001]

