- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - UHNW wardrobe buyer
    - Affluent individual buyer purchasing for herself
    - Build a long-horizon, logo-light luxury wardrobe
    - Top-tier spend growth in BCG; four-figure bags and apparel in prestige channels
    - Highest fit with price architecture and brand codes
    - No disclosed customer count or spend-per-client
  - - Celebrity tastemaker
    - Celebrity end user with public visibility
    - Signal taste, create copycat demand, accelerate product heat
    - Hailey Bieber, Sofia Richie Grainge, Kendall Jenner, and CBK-style references
    - Amplifies desirability without paid-logo marketing
    - No conversion data from celebrity exposure
  - - Prestige wholesale shopper
    - Retail buyer plus end luxury customer
    - Discover and purchase through Bergdorf, NET-A-PORTER, SSENSE, Mytheresa
    - Active assortments and bestseller / low-stock markers
    - Validates demand in elite third-party contexts
    - Wholesale sell-through and markdown support undisclosed
  - - Flagship / concession shopper
    - Direct client served in-store
    - Experience, fitting, appointment-style purchase, trusted returns
    - Store finder footprint across NY, LA, London, Paris and concessions
    - Supports high-touch conversion and full-price context
    - No disclosed appointment share or store productivity
  - - Resale-led entrant
    - Secondary-market buyer
    - Access icons such as Margaux below or near retail while testing brand fit
    - The RealReal and Vestiaire depth
    - Keeps The Row visible to newer customers and supports price memory
    - Resale-to-primary conversion is not disclosed
  - - Aspirational luxury client
    - Selective but budget-constrained luxury buyer
    - Occasional purchase in accessories or seasonal fashion
    - EY and BCG show aspirationals still matter but are more volatile
    - Can widen awareness at the margin
    - Most exposed to macro softness and price rejection
  notes: Rows mix Row-specific customer proof with sector-level luxury segmentation because The Row does not publish its own customer demographic stack.
