- id: channel-geography-and-access
  title: Channel, Geography, and Access
  body: 'The Row’s customer reach is global, but not broad in a mass-luxury sense. The official store finder lists direct stores in New York, Amagansett, Los Angeles, London, and Paris, plus controlled placements inside Saks Fifth Avenue, Dover Street Market, Harrods, Galeries Lafayette, Le Bon Marché, and Selfridges. The returns policy is even more revealing: The Row explicitly funds return shipping across a long list of regions spanning the United States, the United Kingdom, the European Union, Canada, Japan, Hong Kong, South Korea, Singapore, Australia, and other Asia-Pacific markets, while also allowing store returns. Mytheresa separately says it delivers to over 130 countries. Together, those datapoints support a very specific customer map: the brand wants global demand, but it wants that demand routed through tightly controlled direct and prestige-partner experiences. That is consistent with EY’s finding that brand stores remain the dominant final purchase channel in luxury overall
    and especially strong in Mainland China and Italy, even while Japan still gives department stores a larger role. The Row therefore looks architected for international high-end customers who value trusted retail context as much as the product itself.'
