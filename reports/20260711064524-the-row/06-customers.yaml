  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Active customer count, order frequency, and cohort table by channel and region.
    whyItMatters: Without customer count and order-frequency disclosure, demand can be seen but retention quality cannot be underwritten.
    diligencePath: Request an anonymized three-year customer cohort deck covering DTC, stores, and partner-led acquisition.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: repeat-rate
    missingEvidence: Repeat purchase rate, time-to-second-purchase, and top-client share of sales.
    whyItMatters: A luxury brand can look culturally hot while still relying too heavily on one-time icon-bag demand.
    diligencePath: Request repeat-rate by category and spend band plus the top 1%, 5%, and 10% client contribution to revenue.
    relatedQuestionRefs:
    - QU022
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: minor
    topic: demographics
    missingEvidence: Company-specific age, gender, and income mix for The Row customers.
    whyItMatters: Current demographic conclusions are inferred from sector studies and product/channel signals rather than Row disclosures.
    diligencePath: Request CRM segmentation by gender, age band, geography, and client tier.
    relatedQuestionRefs:
    - QU005
    - QU006
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: asia-mix
    missingEvidence: Regional sales split, especially China, Hong Kong, Japan, and South Korea exposure.
    whyItMatters: The operational footprint clearly reaches Asia, but the revenue dependence and growth quality by market remain opaque.
