- id: demand-proof-celebrities-and-resale
  title: Demand Proof, Celebrity Adoption, and Resale
  body: The strongest public proof of customer demand is not a disclosed customer count; it is the repeated appearance of scarcity and aftermarket activity around the same families of products. NET-A-PORTER’s Row pages show “COMING SOON,” “BESTSELLER,” and “LOW STOCK” markers, and Bergdorf’s 2026 assortments surface “Best Seller” and “New Arrival” tags. Particl estimates $50 million to $75 million of annual online sales and says the brand’s top five best-selling products are all handbags from the Margaux and Park Tote families, which is consistent with how fashion coverage talks about The Row. Augustman reports that customers who once chased the Margaux are already rotating toward successors like the Marcel and Marlo, and it explicitly links Hailey Bieber to the Marcel in 2026. Yahoo’s fashion syndications add that Sofia Richie Grainge carried the sold-out Astra Bowling Canvas Bag and that Kendall Jenner wore sold-out The Row flip-flops alongside a $1,350 Barn tote, with Sofia recently seen
    in the same sandals. Secondary markets reinforce the same picture. The RealReal returned 223 Margaux items on the fetch date and showed asking prices frequently in the $4,000 to $6,000 range, while Vestiaire listed global Margaux supply from the United States to Hong Kong at price points that often sit near or above primary-market reference levels. That combination of retailer scarcity, celebrity carriage, and liquid resale is unusually strong customer proof for a private label.
