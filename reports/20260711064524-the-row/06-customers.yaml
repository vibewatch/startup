- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More direct e-commerce conversion
    - High dependence on a narrow wealth tier
    - Growth may remain healthy but capped by intentional exclusivity
    - Request customer count by spend band and first-to-repeat conversion
  - - Prestige wholesale reach
    - Door concentration in a few elite partners
    - Partner pullback or markdown pressure could hurt visibility
    - Request revenue share by Bergdorf, NET-A-PORTER, SSENSE, Mytheresa and concessions
  - - Celebrity amplification
    - Style heat may be trend-cyclical
    - Customer acquisition could cool if quiet luxury loses cultural momentum
    - Track waitlists, search, and reorder velocity by icon bag
  - - International expansion
    - Asia mix is visible operationally but not disclosed financially
    - Underinvestment or overexposure in one region could distort growth quality
    - Request regional sales split and China/HK strategy
  - - Resale visibility
    - Secondary-market depth may divert some primary demand
    - Could either support brand memory or cannibalize entry purchases
    - Request how management interprets resale and whether it monitors price floors
  notes: Public evidence is strong on channels and geography but thin on concentration math, so the register emphasizes diligence asks over false precision.
