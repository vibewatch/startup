- id: durability-repeat-and-concentration-unknowns
  title: Durability, Repeat, and Concentration Unknowns
  body: 'The Row’s customer durability appears promising, but it is not disclosed with the precision an investor would want. External luxury studies suggest that the brand’s positioning is directionally favorable: EY says 75% of aspirational luxury clients are more likely to repurchase when brands offer complimentary experiences, 73% would pay for exclusive experiences, and 62% are open to brand-run pre-owned. BCG says top-tier clients are both more resilient and more aware of creative direction than aspirational customers, which fits a house built around disciplined design authorship. But these are sector proxies, not Row-specific retention metrics. Public evidence still does not disclose active customer count, repeat purchase rate, top-client concentration, appointment-selling dependence, or regional revenue mix. McKinsey’s luxury work is the key cautionary counterweight: the sector is slowing, clients are trading off goods against travel and wellness, and overpricing has started to damage
    demand among more fragile luxury cohorts. For The Row, the read-through is that customer quality is likely high but concentrated, and the absence of disclosed retention data is itself a diligence issue. The market can see demand; it cannot yet see durability in ledger form.'
