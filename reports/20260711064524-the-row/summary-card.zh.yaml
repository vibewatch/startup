  topStrengths:
    - 真正稀缺的罕见品牌：即便刻意限制分销，全球需求仍有证据支撑
    - 创始人与市场高度契合，Mary-Kate 和 Ashley Olsen 长期担任创意锚点
    - 手袋带动的品牌资产和强劲电商信号，支撑高端单件经济性
