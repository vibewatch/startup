      - ["Covariant", "Direct robotics-AI specialist", "$222M raised; April 2023 Series C reportedly valued at $625M; 160+ employees per LinkedIn", "Warehouse and fulfillment operators in apparel, health and beauty, grocery, and pharmaceuticals", "Focused Covariant Brain platform for picking, sortation, induction, and depalletization", "Narrower workflow scope than PFN and founders plus ~25% of staff moved to Amazon"]
