        - label: "SoftBank Group"
          x: 5
          y: 1
          tone: warning
          detail: "Caplight surfaces SoftBank Group as an adjacent comparable, implying incumbent adjacency and capital reach rather than a direct product twin."
        - label: "Sakana AI"
          x: 2
          y: 1
          tone: neutral
          detail: "Caplight surfaces Sakana AI as a nearby startup peer, but evidence on packaging and deployment depth is absent from this pool."
        - label: "Partner-led co-development route"
          x: 4
          y: 3
          tone: medium
          detail: "PFN's own internal-use, joint-business, JV, and licensing models show that partner-mediated adoption is a real substitute path versus standalone software buying."
    approximationNotes: "Coordinates are ordinal placements authored from cited scope and commercialization evidence; they should not be read as market-share, revenue, or benchmark scores."
    claimRefs: [CP001, CP002, CP004, CP005, CP009, CP010, CP011, CP012]
