      - ["Industry scope", "Manufacturing, materials, pharmaceuticals, energy, healthcare, retail, entertainment, education", "Apparel, health and beauty, grocery, pharmaceuticals fulfillment", "Unknown in assigned pool", "PFN appears more horizontal, while Covariant is narrower but more concrete"]
      - ["Framework or control layer", "Chainer ended in 2019; PFN shifted to PyTorch while keeping hardware and application layers", "Covariant retains a named application brain", "Unknown in assigned pool", "PFN's moat looks more system-level than framework-level"]
    notes: "Cells marked unknown reflect missing evidence in the assigned pool, not a claim that the capability does not exist."
    claimRefs: [CP001, CP002, CP006, CP007, CP009, CP010]
  - id: TP003
    title: "Pricing / packaging comparison"
    columns:
      - Offering
