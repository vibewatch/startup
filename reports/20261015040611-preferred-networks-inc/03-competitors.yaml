      - ["Covariant", "No public list price surfaced in assigned source pool", "Warehouse deployments plus non-exclusive model licensing to Amazon", "Covariant Brain for picking, sortation, item induction, and depalletization", "Real production traction is visible, but pricing comparability remains weak"]
      - ["SambaNova Systems", "No public pricing surfaced in assigned source pool", "Unknown in assigned source pool", "Comparable status only", "The pool proves peer adjacency but not buyer economics"]
      - ["Sakana AI", "No public pricing surfaced in assigned source pool", "Unknown in assigned source pool", "Comparable status only", "Further diligence is needed before using Sakana AI as a pricing comp"]
    notes: "This table tracks the public evidence actually retained for pricing and packaging; unknown cells should be treated as diligence gaps, not zero values."
    claimRefs: [CP002, CP003, CP009, CP010, CP011]
