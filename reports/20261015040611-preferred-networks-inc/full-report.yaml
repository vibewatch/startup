      - number: '1.3'
        title: Milestones, current stage, and execution constraints
        blocks:
          - type: paragraph
            body: >-
              The technical milestone pattern is credible: Reuters said PFN started first-generation chip development in
              2016 and had finished the second generation's design by late 2023; official materials say MN-3 topped
              Green500 three times in 2020 and 2021; Top500 records show the system still appearing in mid-2024; and PFN
              announced both its L1000 inference processor in November 2024 and a security-oriented joint venture in
              March 2026. These are meaningful markers of an expanding platform, not just a research lab. The
              counterweight is execution speed: CNBC reported that management still frames some real-world programs as
              three-to-five-year commercialization cycles and openly acknowledged both intense autonomy competition and
              the need to look beyond Japan for scale. That combination makes PFN look strategically ambitious but still
              hard to underwrite with conventional private-company efficiency metrics.
            claimRefs:
