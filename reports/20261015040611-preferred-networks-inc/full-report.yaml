  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization is visible as a commercialization model, not as a disclosed price card
        blocks:
          - type: paragraph
            body: >-
              PFN's own business page frames commercialization through four co-creation models: internal use by partner
              organizations, joint business launches, joint ventures or spin-outs, and licensing. That tells an investor
              how PFN gets technologies into the market, but not how much each stream contributes or how revenue is
              recognized across chips, compute, models, and services. The same pattern shows up in current product news:
              PFN is still pushing commercialization across MN-Core chips, Matlantis, Toyota physical-AI research, and a
              GMO cybersecurity joint venture, while official surfaces still do not disclose numeric list pricing,
              realized discounts, or contract terms. Public revenue quality is therefore visible mainly through partner
              structure and product scope, not through disclosed monetization detail.
