      - number: '2.3'
        title: Buyers, drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              PFN's disclosed go-to-market path is structurally different from a standard seat-based SaaS motion. The
              company's business page emphasizes internal use, joint business, joint venture or spin-out, and licensing
              models, which suggests budget ownership can sit with research, operations, industrial engineering, or
              corporate venture programs depending on the use case. The disclosed price points for MN-Core 2 hardware
              also imply that early adoption often begins with a pilot or infrastructure decision rather than a
              mass-market software subscription.


              That design creates both upside and friction. The upside is that PFN can attach to large enterprise or
              national-infrastructure programs when buyers care about performance, power efficiency, or domestic supply.
              The friction is that these deals appear domain-specific, capital intensive, and dependent on
              commercialization cycles across several layers of the stack. The 2024 financing announcement and the
              2024-2026 chip-news archive both reinforce that interpretation: PFN is funding chip production,
              infrastructure, models, and applied deployments in parallel, which broadens the opportunity set but makes
              adoption timing, budget ownership, and repeatability harder to read from public evidence alone.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure is the strongest public budget bridge
            body: >-
              Among retained sources, the clearest scale argument for PFN comes from AI infrastructure demand rather
              than from application-specific or model-only markets.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM013
          - type: callout
            title: No public PFN-specific SAM or SOM
            body: >-
              The retained evidence supports macro demand and selected vertical wedges, but it does not disclose a
              methodology that converts those signals into a PFN-specific revenue opportunity by product, segment, or
              geography.
            calloutType: risk
            claimRefs:
