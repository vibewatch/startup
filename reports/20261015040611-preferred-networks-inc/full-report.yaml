      - number: '3.4'
        title: Durability depends on execution speed because incumbents can absorb emerging specialists
        blocks:
          - type: paragraph
            body: >-
              The most useful adverse evidence in the assigned pool is not a direct critique of PFN but the
              Covariant/Amazon transaction. Amazon hired Covariant's founders and part of its team while taking a
              non-exclusive license to the startup's robotics models, showing one way an incumbent can compress a
              startup threat without a formal acquisition. PFN's recent financing and ongoing chip, computing, and
              partner announcements suggest it is trying to widen its strategic footprint before that kind of platform
              pressure arrives, but the chapter still points to a real risk of commoditization or displacement in any
              wedge where PFN does not control distribution.
            claimRefs:
              - CP004
