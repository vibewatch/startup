  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The top risk is that PFN is trying to commercialize too many coupled bets at once: AI chips, computing
              infrastructure, foundation models, applied products, and partner-led deployments. The assigned sources
              show real momentum across 2026, but they also show that the company is stretching across hardware, cloud,
              security, and sector-specific applications at the same time. That breadth can be a strength if PFN proves
              repeatable commercialization, yet it also raises the odds that one delay in chip rollout, compliance
              readiness, or partner execution cascades into slower revenue conversion. The most monitorable thesis-break
              signals are delayed paid deployments outside PFN's own platform, missing compliance ownership for model
              launches, or another financing cycle without clearer public economics on MN-Core production and usage.
            claimRefs:
              - CR001
              - CR006
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and security exposure
        blocks:
          - type: paragraph
            body: >-
              PFN's public positioning now reaches generative AI models, AI chips, and industry-facing applications, so
              compliance risk is no longer theoretical. The EU AI Act is already in force as a real regulatory regime,
              and PFN's own product mix implies that model governance, data controls, and customer assurance will matter
              before international scale can be underwritten. PFN has disclosed one useful mitigation step — a 2026
              security joint venture — but the assigned pool does not show independent evidence of security
              certifications, incident-response metrics, model-governance ownership, or product-by-product AI Act
              readiness. Until that evidence appears, legal and security posture should be treated as a diligence
              workstream with explicit kill criteria rather than as a cleared checkbox.
            claimRefs:
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.3'
        title: Operational scale-up and platform dependence
        blocks:
          - type: paragraph
            body: >-
              PFN's operating risk is not just technical performance; it is the coordination problem of scaling a hybrid
              stack that still depends on general-purpose GPUs while also bringing MN-Core processors, PFCP cloud
              services, and application businesses to market. The company has publicly said financing proceeds are
              earmarked for hiring plus development, production, and sales of MN-Core L1000, which means
              commercialization is still absorbing capital and execution bandwidth rather than harvesting a mature,
              low-touch product base. Because the assigned pool offers no public utilization, unit-economics, or on-time
              production evidence for PFCP and MN-Core, investors should treat schedule slips, weak third-party
              adoption, or elevated hiring needs as leading indicators of operational strain.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR012
      - number: '7.4'
        title: Partner, capital, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              PFN's go-to-market pattern is structurally partner-dependent. Its own business materials emphasize joint
              research, joint commercialization, new ventures, and licensing, while independent J-Startup coverage
              highlights a relatively small set of flagship collaborators such as Toyota, FANUC, and the National Cancer
              Center Japan. That design can accelerate access to real-world deployments, but it also means delays at a
              few strategic counterparties can affect multiple sectors at once. The same logic applies to capital: the
              last quantified financing disclosure was explicitly tied to chip development and commercialization, so any
              slowdown in partner rollout, capital-provider appetite, or infrastructure buildout should be read as both
              a growth risk and a financing-risk signal.
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR011
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              The risk case becomes thesis-breaking if PFN cannot show paid external demand for MN-Core/PFCP,
              product-level AI-governance ownership, and a wider customer-partner base before the next major financing
              or strategic alliance cycle.
            calloutType: risk
            claimRefs:
              - CR003
              - CR009
              - CR011
              - CR012
          - type: callout
            title: Mitigations are visible but still ecosystem-stage
            body: >-
              PFN is not ignoring risk — the assigned pool shows a security JV, infrastructure alliances, and prior
              financing — but public evidence still stops short of proving mature compliance, concentration control, or
              chip economics.
            calloutType: insight
            claimRefs:
              - CR007
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence in this pool supports a price-sensitive research-more recommendation rather than an
              unconditional buy. PFN can point to a real financing event, a vertically integrated stack, and at least
              one product line with broad customer adoption, so the company is not a concept-stage story. But the same
              pool still leaves the current post-money valuation, liquidation preferences, dilution profile, and audited
              monetization largely undisclosed, which means the public record is much stronger on strategic promise than
              on investable entry discipline. In practice, that means underwriting PFN only if diligence can close the
              term-sheet and revenue gaps or if entry terms compensate for the remaining uncertainty.
            claimRefs:
              - CV005
              - CV008
              - CV012
              - CV013
              - CV014
          - type: table
