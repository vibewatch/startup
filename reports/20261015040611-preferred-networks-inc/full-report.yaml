      - number: '6.3'
        title: Public adoption signals exist, but durability and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              PFN's public materials provide enough evidence to show commercial relevance, yet they do not provide the
              retention or concentration metrics needed for a clean durability read-through. The best adoption signals
              in this pool are proxies: a 2019 teaching-case preview describing more than 200 employees and global
              partners, recent robot and pilot milestones from Preferred Robotics, and third-party profile language
              about enterprise and research-institution clients across Japan, North America, and Europe. Those are
              useful for direction, but they stop short of customer-count, cohort, renewal, churn, contract-length, or
              top-customer disclosures. As a result, the customer story is best read as broad relationship proof with
              limited quantitative verification of stickiness or account concentration.
            claimRefs:
