chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating scope
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks (PFN) presents itself as a Tokyo-founded AI company that tries to own more of the stack
              than a typical model-only startup. Company materials consistently describe an integrated offer that covers
              AI chips, computing infrastructure, generative AI foundation models, and solutions or products, while
              adjacent public profiles still place the company in late-stage private territory rather than the
              public-market disclosure regime. The same official sources also show that PFN is not positioning around
              one end market: it ties the stack to manufacturing, transportation, healthcare, entertainment, education,
              and other industrial workflows. That breadth is strategically useful, but it also means later diligence
              must distinguish between proven deployed businesses and adjacency narratives that are still primarily
              company-described.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO009
      - number: '1.2'
        title: Founders, capital formation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Public evidence still centers the company on its two co-founders, Toru Nishikawa and Daisuke Okanohara,
              with CNBC's March 2025 profile describing Nishikawa as chief executive officer and Okanohara as chief
              executive researcher. The financing record in the assigned pool is clearer on strategic relationships than
              on ownership economics: PFN disclosed a 19 billion yen first close in December 2024, named both equity
              investors and lending institutions, and CNBC separately highlighted Toyota's earlier 2015 and 2017
              investments. J-Startup adds evidence of longstanding operating relationships with Toyota, FANUC, and the
              National Cancer Center Japan. What remains opaque is the current cap table, board composition, liquidation
              preferences, and how much control the newest investors or strategic partners actually gained.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
              - CO011
