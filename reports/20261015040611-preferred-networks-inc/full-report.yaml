            title: Breadth is PFN's clearest differentiation
            body: >-
              The retained evidence repeatedly shows PFN competing as a vertically integrated AI platform, not as a
              single-application tool, which is why narrower specialists like Covariant are more useful foils than
              perfect operating comps.
            calloutType: insight
