      - number: '3.3'
        title: Commercialization is partner-mediated, which deepens integration but obscures price comparability
        blocks:
          - type: paragraph
            body: >-
              PFN's business page describes four commercialization routes: internal use by partner companies, joint
              business, joint ventures or spin-outs, and licensing. That model can increase switching costs once PFN is
              embedded into a partner's workflow or spun into a joint vehicle, but it also means the public evidence
              pack does not expose a clean, repeatable list-price benchmark. Covariant's reporting shows a similarly
              non-self-serve enterprise motion, with warehouse deployments and a model-licensing transaction with Amazon
              rather than public card pricing, so pricing remains one of the weakest apples-to-apples comparison
