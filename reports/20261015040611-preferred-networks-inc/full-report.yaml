  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and practical substitutes
        blocks:
          - type: paragraph
            body: >-
              PFN should be analyzed as a vertically integrated AI-stack supplier, not as a single software or
              semiconductor category. Company and independent descriptions consistently place PFN across chips,
              computing infrastructure, foundation models, and applied solutions, which means its real market boundary
              spans several layers of AI spending and several end-vertical workflows. That breadth matters because a
              large generic AI TAM can overstate relevance if it includes layers PFN does not monetize directly, while a
              narrow chip-only lens misses the company's model and application exposure.


              The more realistic boundary is enterprise and research spending on high-performance AI compute,
              domain-specific model deployment, and joint commercialization in industries where PFN can pair its
              hardware and models with applied workflows. The retained sources point to transportation, manufacturing,
              bio-health or pharma, materials discovery, energy, security, and robotics as recurring target areas. They
              also imply several status-quo substitutes: GPU-based AI infrastructure, internal AI development by the
              partner, and incumbent industrial or research tooling that can absorb AI features without buying PFN's
              full stack.
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: Sizing lenses and market scale
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens is not a PFN-specific TAM but a set of layered market proxies. Gartner's
              2026 forecast shows AI infrastructure as the largest adjacent spend pool, which fits PFN's chip and
              compute narrative better than a generic AI-software multiple. Gartner's software and model layers are
              still large, but they are materially smaller than infrastructure and therefore should not be treated as
              the primary valuation anchor for PFN's hardware-led strategy.


              A second, narrower lens comes from application-specific categories such as AI in drug discovery, where
              Grand View Research estimates a 2026 market of USD 2.9 billion. That kind of niche estimate helps explain
              why PFN can win meaningful programs in life sciences or materials without implying that every industry
              wedge scales like the total AI market. Put differently, the public record supports a layered-lens market
              thesis: very large compute tailwinds, smaller model or software pools, and much smaller vertical pockets.
              No retained independent source provides a PFN-specific SAM or SOM methodology detailed enough to bridge
              those lenses into a single source-backed revenue opportunity.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
