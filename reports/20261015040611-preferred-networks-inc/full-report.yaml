              - CV005
              - CV007
              - CV008
              - CV012
              - CV013
      - number: '8.2'
        title: Financing context and what is actually known
        blocks:
          - type: paragraph
            body: >-
              The cleanest disclosed financing datapoint remains PFN's December 2024 announcement of a 19 billion yen
              first close that combined equity financing led by SBI Group with debt from Japanese banks, alongside an
              explicit plan to keep raising capital through spring 2025. TheBridge added a headline that total known
              funding reached roughly 36 billion yen and that valuation exceeded 300 billion yen, but the assigned
              sources still do not provide the cap-table mechanics that would let an investor test whether that headline
              fairly reflects today's ownership economics. The only later financing signal in this pool comes from a
              paywalled Preqin preview, and even that preview is internally inconsistent on the August 2026 Mitsubishi
              Heavy Industries amount, reinforcing that financing continuation is visible while pricing precision is
              not.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario framing and market reference points
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis therefore has to lean on milestone logic instead of false precision. The bullish case is
              that PFN turns its chip, model, and solution stack into a broader commercial platform, using recent
              financing to accelerate both productization and enterprise adoption. The base case is that PFN remains
              important strategically but still too opaque financially to justify paying more than the last public
              headline valuation anchor. The bear case is that AI capital markets keep rewarding only the very largest
              and cleanest stories while software multiples and deal appetite stay selective, leaving PFN exposed to
              down-round or structured-capital risk if commercialization proof lags. PwC's 2026 M&A outlook and
              TechCrunch's reporting on OpenAI both support that caution: capital is abundant for frontier AI, but
              governance terms, cash burn, and valuation discipline matter more than broad enthusiasm alone.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Closing the investment case now requires evidence that is still missing from the public record, not
              another round of narrative validation. The highest-value asks are a current cap table with preference
              stack, audited revenue and gross-margin detail by product line, and proof that 2026 strategic alliances
              converted into booked demand rather than ecosystem signaling. If that material shows repeatable revenue,
              healthy economics, and clean terms, PFN could justify a premium private-market entry despite today's
              opacity. If it instead shows heavy dilution, venture debt dependence, contingent governance, or weak
              conversion from chip and model announcements into revenue, the thesis should break quickly because the
              public evidence already tells us the company can raise money but does not yet prove that the market price
              is conservative.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research more; do not pay a premium to the public >300 billion yen headline until PFN discloses current
              round terms, audited monetization, and evidence that 2026 financing improved commercial conversion rather
              than only extending runway.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV013
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a weak or highly structured 2026 financing package, or audited revenue that fails to validate PFN's
              vertically integrated commercialization story, as a fast reason to step away from the deal at anything
              close to a headline-unicorn price.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
