          - type: callout
            title: Incumbent absorption risk is real
            body: >-
              Covariant's licensing-and-talent deal with Amazon shows that a focused robotics-AI startup can lose
              strategic independence before a conventional acquisition, which is relevant whenever PFN goes head-to-head
              with larger distribution owners.
            calloutType: risk
            claimRefs:
