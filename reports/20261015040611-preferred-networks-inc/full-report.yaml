      - number: '4.2'
        title: Public scale proxies exist, but they mix stale reported data with low-confidence estimates
        blocks:
          - type: paragraph
            body: >-
              The best historical financial proxy in the assigned pool is Craft's FY2023 snapshot, which lists revenue
              of ¥7.7B and gross profit of ¥5.2B, alongside positive EBIT and net income for that year. That is useful
              as a last-known public scale marker, but it is not a substitute for current segment reporting.
              Current-state proxies are weaker: Growjo estimates annual revenue at $49.5M, 275 employees, and 5%
              employee growth, while Preqin adds investor names and 2026 financing references but also contains
              inconsistent round-size language. Taken together, the pool supports a view that PFN has real commercial
              activity and a non-trivial operating base, but not a precise current revenue, margin, or efficiency
              baseline.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
