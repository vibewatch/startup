      - number: '6.2'
        title: Named proof is credible, but much of it is partner-led or still pre-scale
        blocks:
          - type: paragraph
            body: >-
              The named proof in the assigned pool is stronger on logos and use-case specificity than on scaled
              production metrics. PFN's own examples cover internal use at Fanuc, plant automation with ENEOS, licensing
              with Chugai Pharmaceutical, and a spin-out path with Matlantis, while government and case-study sources
              add Toyota and the National Cancer Center Japan to the collaboration map. The freshest operational proof
              is the JR East rail-maintenance work disclosed by Preferred Robotics, where the text is explicit that
              development began in 2024 and that proof-of-concept work has run across six rail lines. That is meaningful
              field validation, but it is still not the same as disclosing fleet size, contracted revenue, renewal
              behavior, or broad production rollouts.
            claimRefs:
