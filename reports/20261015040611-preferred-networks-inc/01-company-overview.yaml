  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: A current priced financing document, cap table, or investor-confirmed post-money valuation.
      whyItMatters: Public valuation is still a secondary estimate, which weakens any underwriting of stage, dilution, or return potential.
      diligencePath: Request the latest term sheet, cap table, and any spring-2025 follow-on financing documents from management or lead investors.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: A current board roster, officer list, and investor-rights summary for PFN itself and major subsidiaries or JVs.
      whyItMatters: The chapter can name founders and counterparties, but cannot judge governance quality, succession planning, or control concentration from public evidence alone.
      diligencePath: Request board materials, shareholder agreements, and a current org chart that identifies directors, observers, and reserved matters.
      relatedQuestionRefs: [QO003, QO008]
      relatedTableRefs: [TO002, TO003]
    - type: missing-source
      severity: material
      topic: cover-metrics
      missingEvidence: Current revenue, headcount, customer count, and product-level commercial metrics.
      whyItMatters: Without these metrics, the company overview cannot convert PFN's strategic narrative into operating-scale evidence.
      diligencePath: Request audited financial statements, a headcount report, and product-by-product customer or deployment metrics.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: commercialization-risk
      missingEvidence: Independent post-deployment evidence on chip, robotics, and model adoption beyond partner announcements and interviews.
      whyItMatters: Execution risk is visible, but the current pool does not show enough outside evidence to separate pilot activity from scaled commercial adoption.
      diligencePath: Ask for customer references, deployment counts, retention data, and third-party case studies for MN-Core, PFCP, PLaMo, Matlantis, and robotics offerings.
      relatedQuestionRefs: [QO007]
