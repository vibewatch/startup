      - ["Daisuke Okanohara", "Co-founder; CNBC called him chief executive researcher in Mar 2025", "Quoted on the company's 'real-world problems' orientation and technical positioning", "Anchors product and research credibility across AI applications and infrastructure", "High; public technical narrative remains tightly linked to a founding researcher."]
    notes: >-
      This is a sample of the leadership surface visible in the assigned evidence
      pool, not an exhaustive governance roster; the pool does not provide a current
      board list or a clean 2026 officer roster.
    enumerationScope:
      coverage: sample
      basis: >-
