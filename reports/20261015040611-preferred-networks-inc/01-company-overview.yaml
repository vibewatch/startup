company:
  name: Preferred Networks, Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Preferred Networks remains a capital-intensive private AI platform built around a
    vertically integrated stack spanning chips, computing infrastructure, foundation
    models, and applied products. Public evidence supports the strategic breadth,
    longstanding Toyota-linked stakeholder base, and continuing infrastructure
    roadmap, but current valuation, total capital raised, revenue, customer count,
    headcount, and governance rights still rely on incomplete or secondary evidence.
sections:
  - id: identity-and-scope
    title: Identity, headquarters, and operating scope
    body: >-
      Preferred Networks (PFN) presents itself as a Tokyo-founded AI company that
      tries to own more of the stack than a typical model-only startup. Company
      materials consistently describe an integrated offer that covers AI chips,
      computing infrastructure, generative AI foundation models, and solutions or
      products, while adjacent public profiles still place the company in late-stage
      private territory rather than the public-market disclosure regime. The same
      official sources also show that PFN is not positioning around one end market:
      it ties the stack to manufacturing, transportation, healthcare, entertainment,
      education, and other industrial workflows. That breadth is strategically
      useful, but it also means later diligence must distinguish between proven
      deployed businesses and adjacency narratives that are still primarily
      company-described.
    claimRefs: [CO001, CO002, CO003, CO009]
    tableRefs: [TO001]
  - id: founders-capital-and-stakeholders
    title: Founders, capital formation, and stakeholder map
    body: >-
      Public evidence still centers the company on its two co-founders, Toru
      Nishikawa and Daisuke Okanohara, with CNBC's March 2025 profile describing
      Nishikawa as chief executive officer and Okanohara as chief executive
      researcher. The financing record in the assigned pool is clearer on strategic
      relationships than on ownership economics: PFN disclosed a 19 billion yen first
      close in December 2024, named both equity investors and lending institutions,
      and CNBC separately highlighted Toyota's earlier 2015 and 2017 investments.
      J-Startup adds evidence of longstanding operating relationships with Toyota,
      FANUC, and the National Cancer Center Japan. What remains opaque is the current
      cap table, board composition, liquidation preferences, and how much control the
      newest investors or strategic partners actually gained.
    claimRefs: [CO006, CO007, CO008, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-current-stage-and-execution-constraints
    title: Milestones, current stage, and execution constraints
    body: >-
      The technical milestone pattern is credible: Reuters said PFN started
      first-generation chip development in 2016 and had finished the second
      generation's design by late 2023; official materials say MN-3 topped
      Green500 three times in 2020 and 2021; Top500 records show the system still
      appearing in mid-2024; and PFN announced both its L1000 inference processor in
      November 2024 and a security-oriented joint venture in March 2026. These are
      meaningful markers of an expanding platform, not just a research lab. The
      counterweight is execution speed: CNBC reported that management still frames
      some real-world programs as three-to-five-year commercialization cycles and
      openly acknowledged both intense autonomy competition and the need to look
      beyond Japan for scale. That combination makes PFN look strategically ambitious
      but still hard to underwrite with conventional private-company efficiency
      metrics.
    claimRefs: [CO004, CO005, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
