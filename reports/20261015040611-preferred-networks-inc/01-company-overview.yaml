  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Public role
      - Evidence
      - Control or economic importance
      - Diligence ask
    rows:
      - ["Toyota Motor Corporation", "Early investor and strategic collaborator", "CNBC says Toyota invested 1 billion yen in 2015 and 10.5 billion yen in 2017; J-Startup lists Toyota among collaborators", "Signals industrial validation and likely long-dated strategic influence", "Need current ownership, board rights, and any exclusivity around mobility or Physical AI programs."]
      - ["SBI Group", "Lead participant in the Dec 2024 first close", "PFN's Dec 2024 financing release says the latest equity financing round was led by SBI Group", "Appears central to the latest capital formation and semiconductor push", "Need exact equity versus structured financing terms and follow-on commitments after spring 2025."]
      - ["Development Bank of Japan", "Named equity investor in the Dec 2024 first close", "Listed in PFN's Dec 2024 financing release", "Adds institutional support for a capital-intensive infrastructure roadmap", "Need investment size, instrument type, and governance rights."]
      - ["Mitsubishi Corporation", "Named investor and commercial support partner", "Listed in PFN's Dec 2024 financing release; PFN quotes Mitsubishi on global expansion support", "Potentially important for go-to-market and compute or materials channels", "Need commercial revenue contribution and whether the relationship includes preferential rights."]
      - ["FANUC", "Longstanding collaborator and prior investor cohort participant", "Reuters names Fanuc among PFN investors; J-Startup lists FANUC as a world-leading collaborator", "Supports the industrial-automation credibility of the platform", "Need current commercial scope, ownership stake, and contract duration."]
      - ["GMO Preferred Security", "New JV platform with PFN as 49.0% owner", "PFN's March 2026 release discloses PFN's ownership and scope from chip security to software operations", "Shows continued ecosystem expansion rather than a pure chip roadmap", "Need JV capitalization, revenue model, and whether PFN consolidates or equity-accounts the vehicle."]
    notes: >-
      Rows mix investors, lenders, collaborators, and a joint venture because the
      assigned pool is stronger on named counterparties than on share ownership,
      control rights, or economic exposure.
    enumerationScope:
      coverage: partial
      basis: >-
