  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pfn-specific-market-sizing
    missingEvidence: A PFN-specific TAM, SAM, and SOM bridge by product line, customer segment, geography, and time horizon.
    whyItMatters: Without a company-specific sizing bridge, valuation has to lean on broad AI market proxies that may overstate what PFN can actually monetize.
    diligencePath: Request management's internal market model with segment assumptions, pipeline conversion rates, and the revenue split across chips, infrastructure, models, and applications.
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Customer-level contract values, budget owners, and deployment scale across PFN's chip, compute, model, and applied-solution programs.
    whyItMatters: The public record shows several routes to market, but not which one dominates revenue or how repeatable the buyer motion is.
    diligencePath: Ask for recent customer cohorts by product line, average contract size, buyer title, deployment stage, and renewal or expansion behavior.
  - type: enumeration-incomplete
    severity: minor
    topic: segment-buyer-map
    missingEvidence: An exhaustive list of customer segments and named buyer types across every active PFN commercial program.
    whyItMatters: The current segment map is sufficient for market framing, but it cannot show concentration risk or segment mix from public evidence alone.
    diligencePath: Reconcile customer references, procurement records, and management disclosures into a product-to-buyer matrix by vertical.
