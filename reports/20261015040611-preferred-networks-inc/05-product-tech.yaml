      - ["Materials simulation and discovery", "Chemistry and materials teams need faster simulation than general-purpose compute alone", "PFP + Matlantis + MN-Core acceleration", "AI-chip news says 2026 Matlantis execution can be up to 4x faster than GPUs for selected simulation tasks; Nature shows PFP reproducing multiple materials tasks", "4x claim is company-issued and scoped to selected tasks; no third-party customer case in the pool"]
      - ["Enterprise AI cloud operations", "Organizations need secure and stable compute capacity for AI workloads", "PFCI joint venture infrastructure", "Mitsubishi says the venture will provide secure and stable computational infrastructure", "No public SLA, uptime, or incident-history evidence in the assigned sources"]
      - ["Partner-led applied AI commercialization", "Enterprises often adopt AI through joint development rather than buying raw models", "Internal use, joint business, JV / spin-out, and licensing motions", "PFN business page names Fanuc, ENEOS, Matlantis, and Chugai as examples of these commercialization paths", "Examples prove motion types, not repeatable sales efficiency or attach rates"]
    notes: "Benefits are copied from public source language and remain limited to the stated scope; absence of a broader metric should not be read as disproving the workflow."
    claimRefs: ["CE002", "CE003", "CE006", "CE009", "CE010", "CE012", "CE015", "CE016"]
