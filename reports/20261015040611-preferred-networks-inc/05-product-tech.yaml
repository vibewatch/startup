      - ["Preferred Computing Infrastructure (PFCI)", "Enterprises needing Japanese AI cloud capacity", "JV-backed infrastructure buildout rather than a broadly documented public cloud product", "Mitsubishi says PFN, MC and IIJ formed an AI cloud computing joint venture for secure and stable infrastructure", "Need commercial terms, live regions, utilization, and named external customers"]
      - ["PLaMo and related model services", "Enterprise AI application teams", "Integrated into partner solutions; direct standalone product detail is limited in the assigned pool", "Mitsubishi says MC Digital equipped Tachyon with PFN's PLaMo model", "Need model SKUs, pricing, benchmarks, and customer production references"]
      - ["Matlantis / materials discovery stack", "Materials and chemistry R&D teams", "Most concrete application-layer surface in the pool", "PFN business page cites Matlantis as a joint venture / spin-out example; AI-chip news ties MN-Core acceleration to Matlantis", "Need retention, seat count, and deployment depth outside flagship references"]
    notes: "Rows summarize the assigned prefetched evidence set; 'status / maturity' reflects public disclosure depth rather than a verified revenue contribution."
