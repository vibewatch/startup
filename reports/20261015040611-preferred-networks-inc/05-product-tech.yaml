      - ["ONNX + mncore software stack", "Lets existing PyTorch-centric workflows target MN-Core with limited code changes", "Model conversion and compiler support for supported operators", "OpenACC and OpenCL support are still described as under development in the white paper"]
      - ["PFP model layer", "Universal neural-network potential used in materials discovery workloads", "Large DFT-derived training data and PFN-owned SaaS delivery through Matlantis", "Nature says PFP itself is proprietary software delivered through Matlantis rather than open-source code"]
