  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Customer count, NRR, GRR, churn, renewal cadence, and contract-length data by major PFN product line or customer
      segment.
    whyItMatters: >-
      Without retention and renewal metrics, the current evidence proves relationship breadth better than durability or
      recurring revenue quality.
    diligencePath: >-
      Request customer KPI disclosures, cohort views, and renewal summaries by product or vertical during management
      diligence.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
