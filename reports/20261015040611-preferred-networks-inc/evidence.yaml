evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A current priced financing document, cap table, or investor-confirmed post-money valuation.
    whyItMatters: >-
      Public valuation is still a secondary estimate, which weakens any underwriting of stage, dilution, or return
      potential.
    diligencePath: >-
      Request the latest term sheet, cap table, and any spring-2025 follow-on financing documents from management or
      lead investors.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, officer list, and investor-rights summary for PFN itself and major subsidiaries or JVs.
    whyItMatters: >-
      The chapter can name founders and counterparties, but cannot judge governance quality, succession planning, or
      control concentration from public evidence alone.
    diligencePath: >-
      Request board materials, shareholder agreements, and a current org chart that identifies directors, observers, and
      reserved matters.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: Current revenue, headcount, customer count, and product-level commercial metrics.
    whyItMatters: >-
      Without these metrics, the company overview cannot convert PFN's strategic narrative into operating-scale
      evidence.
    diligencePath: Request audited financial statements, a headcount report, and product-by-product customer or deployment metrics.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: commercialization-risk
    missingEvidence: >-
      Independent post-deployment evidence on chip, robotics, and model adoption beyond partner announcements and
      interviews.
    whyItMatters: >-
      Execution risk is visible, but the current pool does not show enough outside evidence to separate pilot activity
      from scaled commercial adoption.
    diligencePath: >-
      Ask for customer references, deployment counts, retention data, and third-party case studies for MN-Core, PFCP,
      PLaMo, Matlantis, and robotics offerings.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: pfn-specific-market-sizing
    missingEvidence: A PFN-specific TAM, SAM, and SOM bridge by product line, customer segment, geography, and time horizon.
    whyItMatters: >-
      Without a company-specific sizing bridge, valuation has to lean on broad AI market proxies that may overstate what
      PFN can actually monetize.
    diligencePath: >-
      Request management's internal market model with segment assumptions, pipeline conversion rates, and the revenue
      split across chips, infrastructure, models, and applications.
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Customer-level contract values, budget owners, and deployment scale across PFN's chip, compute, model, and
      applied-solution programs.
    whyItMatters: >-
      The public record shows several routes to market, but not which one dominates revenue or how repeatable the buyer
      motion is.
    diligencePath: >-
      Ask for recent customer cohorts by product line, average contract size, buyer title, deployment stage, and renewal
      or expansion behavior.
  - type: enumeration-incomplete
    severity: minor
    topic: segment-buyer-map
    missingEvidence: An exhaustive list of customer segments and named buyer types across every active PFN commercial program.
    whyItMatters: >-
      The current segment map is sufficient for market framing, but it cannot show concentration risk or segment mix
      from public evidence alone.
    diligencePath: >-
      Reconcile customer references, procurement records, and management disclosures into a product-to-buyer matrix by
      vertical.
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list pricing, contract duration, discount ranges, and deployment minimums for PFN and the closest startup
      peers.
    whyItMatters: >-
      Without public packaging or price points, the chapter cannot normalize PFN's economics against narrower
      competitors or internal alternatives.
    diligencePath: >-
      Request customer contracts, price sheets, or procurement records for PFN and the surfaced peers, then rebuild the
      pricing comparison with realized contract structures.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: peer-detail-depth
    missingEvidence: >-
      Customer counts, revenue scale, and deployment counts for the Caplight-named peers that appear only as similarity
      comps in the assigned pool.
    whyItMatters: >-
      Those fields would sharpen the difference between PFN's broad platform posture and the narrower specialist or
      adjacent peers now shown mostly by name.
    diligencePath: >-
      Pull company disclosures, credible interviews, or customer references for SambaNova Systems and Sakana AI before
      treating them as full operating comps.
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, unrestricted liquidity, and management runway assumptions.
    whyItMatters: Without cash and burn disclosure, the next-round trigger and insolvency cushion cannot be underwritten.
    diligencePath: Request the latest board or lender reporting pack with cash, burn, covenant, and runway schedules.
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Realized pricing, discounting, customer concentration, renewal behavior, and gross margin by revenue stream.
    whyItMatters: >-
      Revenue quality depends on whether growth comes from repeatable software-like streams or labor- and capex-heavy
      bespoke work.
    diligencePath: >-
      Request top-customer revenue cohorts, contract templates, renewal data, and margin by chips / cloud / models /
      services.
  - type: missing-source
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Audited FY2024-FY2026 segment revenue, COGS, and gross margin bridge from chips, compute, models, and applied
      solutions.
    whyItMatters: >-
      Historical proxy data does not show whether the current mix is improving margins or merely increasing capital
      needs.
    diligencePath: Request audited financial statements plus a management bridge from FY2023 public metrics to the current period.
  - type: conflicting-data
    severity: material
    topic: financing-disclosure
    missingEvidence: >-
      Signed financing documents and a clean post-2024 cap-table bridge covering the spring 2025 continuation and
      MHI-linked 2026 funding.
    whyItMatters: >-
      Conflicting third-party database summaries make it impossible to pin down exact round size, investor economics,
      and dilution from public evidence alone.
    diligencePath: >-
      Request the cap table, term sheets, liquidation preferences, and board-approved financing chronology for every
      post-2024 raise.
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public security certifications, status pages, uptime commitments, privacy/compliance documentation, or
      incident-response disclosures for PFN-operated products and infrastructure.
    whyItMatters: >-
      Without operating-control evidence, diligence can underwrite the architecture story but not the supportability and
      enterprise readiness of the deployed stack.
    diligencePath: >-
      Request trust-center materials, SOC/ISO scope, incident runbooks, and service-availability reporting for PFCI,
      PLaMo services, and any PFN-operated application surfaces.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: commercial-maturity
    missingEvidence: >-
      Deployed MN-Core unit counts, external cloud customers, Matlantis production seat counts, and product-specific
      support / adoption metrics.
    whyItMatters: >-
      The current product thesis depends on repeatable commercialization beyond named alliances, and the public pool
      does not quantify that adoption.
    diligencePath: >-
      Ask management for product-level deployment counts, revenue mix by chip/cloud/model/application line, and customer
      reference calls for live production users.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Current repository activity, package adoption, community-forum traffic, or other up-to-date developer-signal
      metrics tied to PFN's present technology stack.
    whyItMatters: >-
