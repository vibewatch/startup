companyProfile:
  summary: >-
    Preferred Networks is a Tokyo-based late-stage private AI company that presents itself as vertically integrated
    across AI chips, compute infrastructure, foundation models, and applied software. The public record points to real
    industrial relationships and a broad commercialization surface, but the company still does not disclose enough about
    ownership, pricing, revenue quality, or customer concentration to underwrite it like a fully transparent public
    software business.
