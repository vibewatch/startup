      - number: '4.2'
        title: 公开规模代理存在，但混杂过时报道数据和低置信度估计
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最好的历史财务代理是 Craft 的 FY2023 快照：该快照列出 ¥7.7B 收入、¥5.2B 毛利，以及当年的正 EBIT
              和净利润。这可以作为最后一个已知的公开规模标记，但不能替代当前分部报告。当前代理更弱：Growjo 估计年收入为 $49.5m、员工 275 人、员工增速 5%；Preqin 补充了投资者名称和 2026
              年融资参考，但对轮次规模的表述也不一致。合起来看，来源池支持 PFN 确有商业活动、经营基础不小，但不足以给出精确的当前收入、利润率或效率基线。
