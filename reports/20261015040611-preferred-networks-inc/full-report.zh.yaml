  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与实际替代方案
        blocks:
          - type: paragraph
            body: >-
              PFN 应被分析为垂直整合的 AI 技术栈供应商，而不是单一软件或半导体品类。公司和独立资料都将 PFN 放在芯片、计算基础设施、基础模型及应用解决方案之间，因此其真实市场边界横跨多层 AI
              支出和多个终端行业流程。广泛的边界很重要：若通用 AI TAM 包含 PFN 无法直接变现的层级，相关数字会高估其实际相关性；若只从芯片角度观察，又会漏掉公司的模型和应用敞口。

              更现实的边界，是企业和科研机构在高性能 AI 计算、领域模型部署，以及 PFN
              能将硬件和模型与应用流程结合起来的行业联合商业化上的支出。保留的来源反复指向交通、制造、生物健康或制药、材料发现、能源、安全和机器人等目标领域。来源还暗示了几类现状替代方案：基于 GPU 的 AI
              基础设施、合作伙伴内部开发 AI，以及能够在不购买 PFN 全栈的情况下吸收 AI 功能的现有工业或科研工具。
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
      - number: '2.2'
        title: 规模测算视角与市场规模
        blocks:
          - type: paragraph
            body: >-
              最干净的公开测算视角不是 PFN 特有的 TAM，而是一组分层的市场代理指标。Gartner 的 2026 年预测显示，AI 基础设施是相邻支出池中规模最大的部分，这比泛 AI 软件倍数更符合 PFN
              以芯片和计算为主的叙事。Gartner 对软件和模型层的预测仍然很大，但明显小于基础设施，因此不应成为 PFN 硬件主导战略的主要估值锚。

              第二个、更窄的视角来自 AI 药物发现等特定应用品类，Grand View Research 预计该市场在 2026 年达到 USD 2.9b。这样的细分市场估计有助于解释 PFN
              如何在生命科学或材料领域赢得有意义的项目，但不意味着每个行业切入口都能按整个 AI
              市场的规模增长。换句话说，公开记录支持分层市场判断：计算需求的长期顺风很大，模型和软件池更小，垂直领域的细分机会则小得多。没有任何保留的独立来源提供足够详细的 PFN 特定 SAM 或 SOM
              方法，能把这些视角桥接成一个有来源支撑的收入机会。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM012
              - CM013
