        blocks:
          - type: paragraph
            body: >-
              PFN 最强的公开融资披露来自 2024 年 12 月公告：公司称最近一轮股权融资首轮交割加债务融资共筹得 19 billion yen，并计划持续融资至 2025
              年春季。资金用途并非补充增量营运资本，而是覆盖人才、芯片开发、生产和销售、PLaMo 模型开发、解决方案以及大规模计算基础设施。这与 Mitsubishi Heavy Industries 2026 年 6
              月关于双方可深化为资本联盟的表态，以及 Bloomberg 2026 年 9 月关于 PFN 寻求 IPO
              以量产芯片的报道相吻合。公开证据因此指向一家仍在为商业化和产能扩张筹资的公司，而不是已经产生足够可披露现金流、可以自我融资下一阶段增长的公司。
