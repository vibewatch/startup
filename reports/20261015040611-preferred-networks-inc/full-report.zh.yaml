      - number: '3.3'
        title: 商业化由合作伙伴推动，深化整合的同时也遮蔽了价格可比性
        blocks:
          - type: paragraph
            body: >-
              PFN 的业务页面描述了四条商业化路径：合作公司内部使用、联合业务、合资或分拆，以及授权。一旦 PFN
              嵌入合作伙伴流程，或被分拆进联合实体，这种模式可以提高切换成本；但它也意味着公开证据包没有呈现干净、可重复的挂牌价格基准。Covariant 的报道同样显示其并非自助式企业销售模式：公司通过仓库部署和向
              Amazon 授权模型完成交易，而不是公开卡式定价，因此价格仍是本章最弱的同口径比较维度之一。
