      - - 反论
        - 当前公开证据对投后估值、优先权条款和合并单位经济学仍过于薄弱，不足以支持支付溢价。
        - 清晰的股权结构表条款、利润率披露和经过核对的估值历史，能够降低不透明折价。
      - - 摇摆因素
