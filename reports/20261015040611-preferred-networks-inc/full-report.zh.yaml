      - number: '3.4'
        title: 持久性取决于执行速度，因为现有巨头可以吸收新兴专业公司
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最有用的反向证据并非直接批评 PFN，而是 Covariant 与 Amazon 的交易。Amazon 招募了 Covariant
              的创始人和部分团队，同时取得该初创公司机器人模型的非独家授权，展示了现有巨头无需正式收购也能压缩初创公司威胁的一种方式。PFN
              最近的融资以及持续发布的芯片、计算和合作伙伴公告，显示它正试图在类似平台压力到来前扩大自己的战略版图；但在 PFN 无法控制分发的任何切口上，商品化或被替代的风险仍然真实存在。
            claimRefs:
              - CP004
              - CP007
              - CP009
              - CP012
              - CP013
