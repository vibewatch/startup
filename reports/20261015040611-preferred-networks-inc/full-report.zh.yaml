      - number: '3.2'
        title: PFN 的护城河在跨层范围，而不是单一主导应用切口
        blocks:
          - type: paragraph
            body: >-
              PFN 的官方内容一贯将公司描述为从 AI 芯片和计算基础设施延伸至基础模型，再进入解决方案和产品的一体化技术栈。相较于 Covariant 这样的初创公司，PFN 的架构故事更有差异化；保留的独立报道将
              Covariant 描述为专注仓储机器人流程。相较于 Caplight 列出的可比公司，PFN 的详细产品范围也更清楚，而那些公司的产品边界在本来源池中并未公开。代价是，PFN
              的广度也让竞争定位更难用一张标准化功能表或一个透明的软件包衡量。
