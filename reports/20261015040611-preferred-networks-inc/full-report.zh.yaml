        title: 展示项
        blocks:
          - type: callout
            title: 广度是 PFN 最清晰的差异化
            body: 保留的证据反复显示，PFN 以垂直整合的 AI 平台参与竞争，而不是作为单一应用工具；因此，Covariant 这类更窄的专业公司比完美的经营可比对象更有参考价值。
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP010
          - type: callout
            title: 现有巨头吸收的风险真实存在
            body: Covariant 与 Amazon 的授权加人才交易表明，一家专注的机器人 AI 初创公司可能在传统收购前就失去战略独立性；每当 PFN 与拥有更大分发能力的公司正面竞争时，这一点都值得关注。
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现以商业化模式可见，而非以公开价目表可见
        blocks:
          - type: paragraph
            body: >-
              PFN 自己的业务页面通过四种共同创造模式描述商业化：合作机构内部使用、联合业务启动、合资或分拆，以及授权。这能告诉投资者 PFN
              如何把技术推向市场，却不能说明各条业务流贡献多少收入，或芯片、计算、模型和服务如何确认收入。当前产品新闻也呈现同样模式：PFN 仍在推动 MN-Core 芯片、Matlantis、Toyota Physical
              AI 研究和 GMO 网络安全合资企业的商业化；官方内容仍未披露数字化挂牌价格、实际折扣或合同条款。因此，公开收入质量主要通过合作伙伴结构和产品范围可见，而不是通过变现细节可见。
