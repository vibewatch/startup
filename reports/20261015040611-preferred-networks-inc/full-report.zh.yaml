chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与经营范围
        blocks:
          - type: paragraph
            body: >-
              Preferred Networks（PFN）将自己定位为一家总部在东京、成立于东京的 AI 公司，试图比典型的单一模型初创公司掌握更多技术栈。公司材料一贯描述一套覆盖 AI 芯片、计算基础设施、生成式 AI
              基础模型以及解决方案或产品的一体化方案；相邻的公开资料则仍将其归入后期私营公司，而不是遵循上市市场披露制度的企业。同一批官方来源也表明，PFN
              并未只押注一个终端市场：它把这套技术栈连接到制造、交通、医疗、娱乐、教育和其他工业流程。广度有战略价值，但后续尽调必须区分已经验证的交付业务，与仍主要由公司描述的邻近场景叙事。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO009
      - number: '1.2'
        title: 创始人、资本形成与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              公开证据仍以两位联合创始人 Toru Nishikawa 和 Daisuke Okanohara 为核心；CNBC 2025 年 3 月的报道将 Nishikawa 称为首席执行官，将 Okanohara
              称为首席研究官。指定来源池对战略关系的记录，比对所有权经济性的记录更清楚：PFN 披露 2024 年 12 月完成 19 billion yen 首轮交割，列出了股权投资者和贷款机构；CNBC 另提到
              Toyota 在 2015 年和 2017 年的早期投资。J-Startup 还证明 PFN 与 Toyota、FANUC
              和日本国立癌症中心长期合作。当前股权结构表、董事会构成、清算优先权，以及新投资者或战略伙伴实际获得了多少控制权，仍不透明。
