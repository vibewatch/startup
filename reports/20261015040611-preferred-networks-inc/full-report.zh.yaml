  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - MN-Core、PLaMo 和解决方案产品线把 2024-2026 年融资转化为可见增长，并拿出超越视觉检测的更广泛客户验证。
        - 如果经审计收入、利润率和条款支撑平台溢价倍数，估值可能超过公开的 300 billion yen 锚点。
        - 商业化进度拖延，或战略联盟仍未实现货币化。
        - 需要公开确认当前轮次条款，并披露产品线财务信息。
      - - 基准
        - PFN 的战略可信度和资金状况仍然良好，但变现和股权结构披露仍然有限。
        - 在投资者核实稀释、优先权和收入质量前，估值应按接近或低于最近一次公开估值口径处理。
        - 没有价格保护结构，投资者却为故事溢价买单。
        - 与当前分配到的证据最一致。
      - - 悲观
        - AI 融资仍然挑剔，软件估值重置持续，PFN 还需要更多资本才能证明经济模型可持续。
        - 独角兽的市场标杆估值收缩，可能落入平价或结构化融资轮次，新资金的回报前景更弱。
        - 资本密集度、治理条款，或联盟转化为收入的能力不足。
        - 如果尽调发现利润率薄、优先权激进或需求疲软，则触发该情景。
    notes: 这些区间按里程碑设定，因为当前材料没有足够可靠的可比公司集合、经审计收入基数或当前投后估值，无法推导精确的倍数区间。
    claimRefs:
      - CV003
      - CV004
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
