      - number: '1.3'
        title: 里程碑、当前阶段与执行约束
        blocks:
          - type: paragraph
            body: >-
              技术里程碑模式可信：Reuters 称 PFN 于 2016 年启动第一代芯片开发，并在 2023 年底前完成第二代芯片设计；官方材料称 MN-3 在 2020 年和 2021 年三次登上 Green500
              榜首；Top500 记录显示该系统在 2024 年年中仍在榜；PFN 又分别于 2024 年 11 月发布 L1000 推理处理器、于 2026 年 3
              月宣布成立面向安全的合资企业。这些都是平台不断扩张的实质标志，而不只是研究实验室成果。制约因素在于执行速度：CNBC
              报道称，管理层仍将部分真实世界项目定义为三至五年的商业化周期，并公开承认自动驾驶领域竞争激烈、需要走出日本寻找规模。这样的组合让 PFN 显得雄心勃勃，但仍难以用传统私营公司效率指标进行投资评估。
