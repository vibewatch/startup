            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV008
              - CV012
              - CV014
      - number: '8.3'
        title: 情景框架与市场参考点
        blocks:
          - type: paragraph
            body: >-
              因此，情景分析必须依赖里程碑逻辑，而不是制造虚假的精确度。乐观情景是，PFN 将芯片、模型和解决方案技术栈变成更广泛的商业平台，利用近期融资同时加速产品化和企业采用。基准情景是，PFN
              在战略上仍然重要，但财务上仍过于不透明，不足以支持支付高于最近公开标题估值锚的价格。悲观情景是，AI 资本市场继续只奖励最大、最清晰的故事，而软件倍数和交易意愿保持挑剔；若商业化验证落后，PFN
              可能暴露于下轮融资或结构化资本风险。PwC 2026 年并购展望和 TechCrunch 对 OpenAI 的报道都支持这种谨慎态度：前沿 AI 的资本充足，但治理条款、现金烧钱和估值纪律比单纯的广泛热情更重要。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              现在要完成投资论点，需要的是公开记录仍缺失的证据，而不是再来一轮叙事验证。价值最高的要求包括：带优先股堆叠的当前股权结构表、按产品线拆分的经审计收入和毛利率明细，以及证明 2026
              年战略联盟转化为已签订单，而不只是生态系统信号。如果材料显示收入可重复、经济性健康、条款干净，PFN
              即使在今天仍不透明，也可能值得私募市场溢价入场。若材料反而显示稀释严重、依赖创投债务、治理带有或有条件，或芯片与模型公告转化为收入的能力弱，论点就应迅速失效，因为公开证据已经说明公司能够融资，却尚未证明市场价格保守。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 继续研究；在 PFN 披露当前轮次条款、经审计的变现情况，并证明 2026 年融资改善了商业转化而不只是延长现金跑道前，不要为公开报道的超过 300 billion yen 标题估值支付溢价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV009
              - CV012
              - CV013
          - type: callout
            title: 论点破坏触发因素
            body: 如果 2026 年融资方案疲弱或高度结构化，或经审计收入无法验证 PFN 垂直整合的商业化故事，就应把它视为在接近标题独角兽价格时迅速退出交易的理由。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
