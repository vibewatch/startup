  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 产品和合作伙伴验证支持继续尽调，但估值不透明以及更严格的 AI 资本市场纪律，仍使结论停留在继续研究。
    data:
      nodes:
        - label: 2024 年融资确实存在
          detail: PFN 公开披露了 19 billion yen 首轮交割，并表示将持续融资至 2025 年春季。
          tone: positive
        - label: 商业化验证存在
          detail: PFN 称 Preferred Networks Visual Inspection 自推出以来已被 300 多家客户采用。
          tone: positive
        - label: 战略技术栈可信
          detail: 公司材料和第三方官方名录描述了芯片、计算、模型及联合商业化路径。
          tone: positive
        - label: AI 资本市场更加严苛
          detail: 当前分配到的独立来源称，软件估值倍数降温，前沿 AI 融资轮次的治理要求也更严格。
          tone: warning
        - label: 价格发现尚不完整
          detail: 公开材料显示估值超过 300 billion yen，但没有当前投后估值、稀释或清算优先权结构。
          tone: risk
        - label: 建议仍是继续研究
          detail: 只有折价或结构化进入，或者新增经审计披露，才足以支持转向偏买入判断。
          tone: risk
      edges:
        - from: 2024 financing is real
          to: Commercial proof exists
          label: 说明公司能够吸引资本
        - from: Commercial proof exists
          to: Strategic stack is credible
          label: 支持继续尽调
        - from: Strategic stack is credible
          to: AI capital markets are tougher
          label: 必须放在挑剔的市场中评估
        - from: AI capital markets are tougher
          to: Price discovery is incomplete
          label: 但不能证明进入价格公允
        - from: Price discovery is incomplete
          to: Recommendation stays research-more
          label: 因此保持进入纪律
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV012
      - CV013
