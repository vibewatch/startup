              - CM013
      - number: '2.3'
        title: 买方、驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              PFN 披露的市场进入路径，与标准的按席位 SaaS 模式有结构性差异。公司业务页面强调内部使用、联合业务、合资或分拆，以及授权模式；预算归属会随场景落在科研、运营、工业工程或企业创投部门。MN-Core 2
              硬件披露的价格点也暗示，早期采用往往从试点或基础设施决策开始，而不是从大众软件订阅开始。

              这种设计既带来上行空间，也带来摩擦。上行空间在于，当买方看重性能、能效或本土供应时，PFN
              可以接入大型企业或国家级基础设施项目。摩擦则在于，这些交易似乎具有明确领域属性、资本密集度高，并依赖技术栈多个层面的商业化周期。2024 年融资公告和 2024—2026 年芯片新闻档案都强化了这一判断：PFN
              正在并行投入芯片生产、基础设施、模型和应用部署，机会面更广，却也让仅凭公开证据更难判断采用时点、预算归属和模式能否复制。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 基础设施是最强的公开预算桥梁
            body: 在保留的来源中，PFN 最清晰的规模论据来自 AI 基础设施需求，而不是特定应用或单一模型市场。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM013
          - type: callout
            title: 没有 PFN 特定的公开 SAM 或 SOM
            body: 保留的证据支持宏观需求和若干垂直切入口，但没有披露一种方法，能按产品、细分市场或地域把这些信号换算为 PFN 特定的收入机会。
            calloutType: risk
            claimRefs:
              - CM009
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 浮现的竞争版图很广，但只有一家直接专业公司被充分描述
        blocks:
          - type: paragraph
            body: >-
              指定来源池无法为 PFN 提供一个整齐的单品类同行集合，而是呈现直接流程专业公司、相邻 AI 平台和替代路径的混合版图。Caplight 以嵌入相似度识别 SambaNova Systems、SoftBank
              Group 和 Sakana AI 为最接近的公开可比对象；本来源池的独立报道则对机器人 AI 专业公司 Covariant 提供了最丰富的经营细节。PFN
              覆盖的层级比来源池中其他点名实体都多，因此买方可以把它与更窄的点解决方案比较，也可以与由合作伙伴牵引、部分内部化的替代方案比较，而不是寻找一个明显的一比一竞争者。
