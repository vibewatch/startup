schemaVersion: report-v2
artifact: financials
slug: preferred-networks-inc
runDate: 2026-10-15
company:
  name: Preferred Networks, Inc.
chapter:
  number: 4
  title: Financials
  summary: >-
    Preferred Networks publicly presents a partner-led revenue model across chips,
    compute, models, and applied solutions, but the public financial record is
    still too thin to underwrite revenue quality or runway with confidence. The
    strongest hard datapoints in the assigned pool are a historical FY2023 Craft
    profile, PFN's December 2024 financing use-of-funds disclosure, and
    Bloomberg's September 2026 report that PFN was seeking an IPO to fund chip
    mass production.
sections:
  - id: monetization-model
    title: Monetization is visible as a commercialization model, not as a disclosed price card
    body: >-
      PFN's own business page frames commercialization through four co-creation
      models: internal use by partner organizations, joint business launches,
      joint ventures or spin-outs, and licensing. That tells an investor how PFN
      gets technologies into the market, but not how much each stream contributes
      or how revenue is recognized across chips, compute, models, and services.
      The same pattern shows up in current product news: PFN is still pushing
      commercialization across MN-Core chips, Matlantis, Toyota physical-AI
      research, and a GMO cybersecurity joint venture, while official surfaces
      still do not disclose numeric list pricing, realized discounts, or contract
      terms. Public revenue quality is therefore visible mainly through partner
      structure and product scope, not through disclosed monetization detail.
    claimRefs: [CI001, CI002, CI003, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: public-scale-proxies
    title: Public scale proxies exist, but they mix stale reported data with low-confidence estimates
    body: >-
      The best historical financial proxy in the assigned pool is Craft's
      FY2023 snapshot, which lists revenue of ¥7.7B and gross profit of ¥5.2B,
      alongside positive EBIT and net income for that year. That is useful as a
      last-known public scale marker, but it is not a substitute for current
      segment reporting. Current-state proxies are weaker: Growjo estimates
      annual revenue at $49.5M, 275 employees, and 5% employee growth, while
      Preqin adds investor names and 2026 financing references but also contains
      inconsistent round-size language. Taken together, the pool supports a view
      that PFN has real commercial activity and a non-trivial operating base, but
      not a precise current revenue, margin, or efficiency baseline.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy is inferred from financing behavior and commercialization ambition
    body: >-
      PFN's strongest public financing disclosure is its December 2024 release,
      which said the company raised a total of 19 billion yen in the first close
      of its latest equity round plus debt financing, and planned to keep raising
      capital through spring 2025. The stated use of proceeds was not incremental
      working capital; it covered talent, chip development, production and sales,
      PLaMo model development, solutions, and large-scale computing
      infrastructure. That is consistent with Mitsubishi Heavy Industries'
      June 2026 statement that the companies could deepen their relationship into
      a capital alliance, and with Bloomberg's September 2026 report that PFN was
      seeking an IPO to mass-produce chips. Public evidence therefore points to a
      company still funding commercialization and capacity build-out, not one
      already throwing off enough disclosed cash flow to self-finance the next
      leg of growth.
    claimRefs: [CI004, CI005, CI006, CI007, CI014]
  - id: verdict-and-blockers
    title: "Financial verdict: credible strategic assets, weak public underwriting visibility"
    body: >-
      The financial picture is directionally constructive but still difficult to
      underwrite from public evidence. PFN appears to have multiple revenue paths
      and serious strategic backers, yet the assigned pool does not disclose
      current cash on hand, monthly burn, runway, customer concentration, segment
      mix, realized pricing, or CAC and payback. That means the investment case
      depends on believing in commercialization of a capital-intensive AI stack
      before public evidence proves durable gross margins or efficient cash
      conversion. Until management provides audited segment economics and a clean
      post-2024 financing bridge, the prudent conclusion is that public sources
      show strategic promise and financing access, but not enough current
      financial transparency for full underwriting.
    claimRefs: [CI003, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Joint research / internal-use deployments
        - Partner uses joint research output inside its own operations.
        - project / deployment
        - Active model; PFN cites Fanuc as an example.
        - Official but qualitative; no revenue mix disclosed.
        - Revenue split between research services and production deployments.
      - - Joint business commercialization
        - PFN and a partner commercialize the outcome to outside customers.
        - solution / contract
        - Active model; PFN cites ENEOS as an example.
        - Official but qualitative.
        - Customer count, ACV, renewal terms, and channel economics.
      - - Joint venture / spin-out
        - PFN forms a new vehicle and can take external investment around the asset.
        - equity + operating revenue
        - Active model; PFN cites Matlantis as an example.
        - Official model, but contribution to PFN revenue is undisclosed.
        - Ownership, consolidation treatment, and PFN cash realization.
      - - Licensing
        - PFN licenses joint-research output to third parties.
        - license / royalty / support
        - Active model; PFN cites Chugai Pharmaceutical experiment automation.
        - Official model, but no pricing or royalty terms.
        - Minimum commitments, pricing tiers, and gross margin by contract.
      - - AI chip / compute commercialization
        - Chips, compute infrastructure, models, and solutions are commercialized together.
        - processor / cloud / model / solution
        - 2024-2026 disclosures emphasize build-out and launches, not disclosed realized pricing.
        - High strategic relevance but limited public monetization detail.
        - Booked pipeline, shipped units, utilization, and segment revenue mix.
    notes: >-
      Data source is PFN official commercialization and funding disclosures plus
      partner announcements; row values describe disclosed models and examples,
      not audited revenue contribution or recognized accounting treatment.
    claimRefs: [CI001, CI002, CI008]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering / motion
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - MN-Core processors
        - No public list price in assigned sources.
        - Realized pricing unknown.
        - Customer quotes, volume discounts, and service bundle are undisclosed.
        - PFN funding/news disclosures and Bloomberg chip-capex coverage.
      - - PFCP / AI computing infrastructure
        - No public list price in assigned sources.
        - Realized pricing unknown.
        - Billing basis, utilization pricing, and gross margin are undisclosed.
        - MHI alliance release and PFN official surfaces.
      - - PLaMo / foundation-model services
        - No public list price in assigned sources.
        - Realized pricing unknown.
        - Paid usage, seat, token, or support economics are undisclosed.
        - PFN funding release and official business positioning.
      - - Vertical solutions / co-created applications
        - Contract structure not publicly disclosed.
        - Realized pricing unknown.
        - Discounting, implementation fees, and renewal behavior are undisclosed.
        - PFN business page examples.
    notes: >-
      This is a disclosure-gap table: the retained public sources describe
      commercialization paths and use of funds but do not publish numeric list
      pricing or realized contract terms for chips, compute, models, or
      partner-built solutions.
    claimRefs: [CI003, CI005, CI008]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - FY2023 revenue
        - ¥7.7B (Craft profile)
        - Medium
        - Best public historical scale datapoint in the assigned pool.
        - Audited FY2024-FY2026 consolidated revenue and segment bridge.
      - - FY2023 gross profit
        - ¥5.2B (Craft profile)
        - Medium
        - Only public gross-profit proxy in the pool; useful for framing margin potential.
        - Audited COGS and gross margin by chips / cloud / models / services.
      - - Current revenue estimate
        - $49.5M annual revenue estimate (Growjo)
        - Low
        - Directional current-scale proxy only; methodology is undisclosed.
        - Management definition of current annualized revenue and bridge from FY2023.
      - - Headcount proxy
        - 275 employees; 5% employee growth (Growjo)
        - Low
        - Helps triangulate operating-cost burden and hiring intensity.
        - Audited headcount, function mix, and hiring plan by business line.
      - - Capital dependency proxy
        - 2024 financing earmarked for chip/computing build-out; 2026 disclosures point to further capital needs.
        - High
        - Indicates capex and commercialization still require external financing.
        - Cash balance, monthly burn, capex commitments, debt terms, and minimum runway.
    notes: >-
      Craft and Growjo provide public proxy data with different periods and
      methodologies; use them as directional indicators, not as audited current
      unit economics. The capital-dependency row synthesizes multiple public
      disclosures rather than a reported runway figure.
    claimRefs: [CI009, CI010, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how partner demand appears to move into revenue, but
      the bridge from revenue to gross profit and cash conversion still contains
      material undisclosed steps.
    data:
      nodes:
        - id: demand
          label: Partner demand / joint research
          detail: Named examples include Fanuc, ENEOS, Chugai, Toyota, and MHI-linked programs.
        - id: model
          label: Commercialization model
          detail: Internal use, joint business, joint venture / spin-out, and licensing.
        - id: offering
          label: Product / service layer
          detail: MN-Core chips, PFCP compute, PLaMo models, and applied solutions.
        - id: revenue
          label: Revenue capture
          detail: Project, license, hardware, cloud, and support revenue types are implied, but no public price card is disclosed.
        - id: cost
          label: Cost stack
          detail: Talent, chip development, production, sales, and computing infrastructure absorb capital.
        - id: profit
          label: Gross profit / cash conversion
          detail: Historical FY2023 gross profit is public, but current margin, burn, and runway are undisclosed.
      edges:
        - from: demand
          to: model
          label: co-create
        - from: model
          to: offering
          label: package
        - from: offering
          to: revenue
          label: sell / license
        - from: revenue
          to: cost
          label: fund
        - from: cost
          to: profit
          label: convert
    approximationNotes: >-
      This is a qualitative flow assembled from official commercialization,
      funding, and independent reporting; it does not imply disclosed conversion
      rates or margin percentages between steps.
    claimRefs: [CI001, CI003, CI005, CI009, CI014]
callouts:
  - calloutType: risk
    title: Underwriting still hinges on undisclosed cash economics
    body: >-
      Public sources support a real commercialization effort and access to
      financing, but they do not disclose cash on hand, monthly burn, runway,
      or realized pricing. That makes the next-round trigger and self-funding
      capacity a diligence question, not a public fact.
    claimRefs: [CI003, CI013, CI014]
  - calloutType: insight
    title: Revenue quality is more legible through structure than through numbers
    body: >-
      PFN's disclosures make its commercialization architecture visible: partner
      co-creation, licensing, spin-outs, chips, compute, and models. What they
      do not yet make visible is which stream scales cleanly, carries the best
      margins, or repeats with low acquisition cost.
    claimRefs: [CI001, CI002, CI003, CI009]
