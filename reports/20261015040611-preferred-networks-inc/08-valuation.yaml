      tougher AI capital-market discipline still force a research-more conclusion.
    data:
      nodes:
        - label: "2024 financing is real"
          detail: "PFN publicly disclosed a 19 billion yen first close and said it would keep raising capital through spring 2025."
          tone: positive
        - label: "Commercial proof exists"
          detail: "PFN says Preferred Networks Visual Inspection has been adopted by over 300 customers since launch."
          tone: positive
        - label: "Strategic stack is credible"
          detail: "Company materials and third-party official listings describe chips, compute, models, and joint commercialization pathways."
          tone: positive
        - label: "AI capital markets are tougher"
          detail: "Assigned independent sources describe cooler software valuation multiples and tighter governance around frontier-AI rounds."
          tone: warning
        - label: "Price discovery is incomplete"
          detail: "The public pool shows a >300 billion yen valuation headline but not the current post-money, dilution, or liquidation preference structure."
          tone: risk
        - label: "Recommendation stays research-more"
          detail: "Only a discounted or structured entry, or new audited disclosure, would justify moving toward a buy-style call."
          tone: risk
      edges:
        - from: "2024 financing is real"
          to: "Commercial proof exists"
          label: "shows the company can attract capital"
        - from: "Commercial proof exists"
          to: "Strategic stack is credible"
          label: "supports continued diligence"
        - from: "Strategic stack is credible"
          to: "AI capital markets are tougher"
          label: "must be judged against a selective market"
        - from: "AI capital markets are tougher"
          to: "Price discovery is incomplete"
          label: "but does not prove fair entry price"
        - from: "Price discovery is incomplete"
          to: "Recommendation stays research-more"
          label: "therefore maintain entry discipline"
    claimRefs: [CV004, CV005, CV007, CV008, CV012, CV013]
