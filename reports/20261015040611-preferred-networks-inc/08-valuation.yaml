  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: Current cap table, liquidation preferences, conversion terms, and any secondary transactions from the 2024-2026 financing sequence.
      whyItMatters: Entry economics can look very different from a headline valuation once preferences, debt, and dilution are incorporated.
      diligencePath: Request the latest term sheet, cap table, and a board-approved financing summary before setting price.
      relatedQuestionRefs: [QV008]
      relatedTableRefs: [TV001, TV003]
    - type: missing-source
      severity: material
      topic: monetization
