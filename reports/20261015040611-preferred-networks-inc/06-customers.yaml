company:
  name: Preferred Networks, Inc.
chapter:
  number: 6
  title: Customers
  summary: >-
    PFN shows real but heterogeneous customer proof across manufacturing, materials, pharma, rail infrastructure, and adjacent sectors, with commercialization paths that range from internal-use partnerships to licensing and spin-outs. The stronger public evidence is broad named-partner coverage and recent pilot/commercialization activity, while customer count, retention, contract duration, and concentration remain undisclosed in the assigned source pool.
sections:
  - id: segment-mix-and-commercialization
    title: Segment mix is broad, but the commercialization path changes by vertical
    body: >-
      PFN's assigned public evidence supports a broad enterprise and institutional customer map rather than a narrow single-product buyer profile. Company and third-party sources consistently place PFN in manufacturing, transportation, healthcare, materials, and related research workflows, but the route to monetization varies by use case. PFN's own business page frames four commercialization modes, and the named examples attached to those modes indicate that PFN sells through a mix of internal-use deployments, joint businesses, spin-outs, and licensing relationships rather than one standardized recurring SaaS motion. That breadth is strategically useful because it shows multiple entry points into large accounts, but it also makes customer quality harder to compare because the public record mixes end users, joint-development partners, and commercialization vehicles.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-deployment-stage
    title: Named proof is credible, but much of it is partner-led or still pre-scale
    body: The named proof in the assigned pool is stronger on logos and use-case specificity than on scaled production metrics. PFN's own examples cover internal use at Fanuc, plant automation with ENEOS, licensing with Chugai Pharmaceutical, and a spin-out path with Matlantis, while government and case-study sources add Toyota and the National Cancer Center Japan to the collaboration map. The freshest operational proof is the JR East rail-maintenance work disclosed by Preferred Robotics, where the text is explicit that development began in 2024 and that proof-of-concept work has run across six rail lines. That is meaningful field validation, but it is still not the same as disclosing fleet size, contracted revenue, renewal behavior, or broad production rollouts.
    claimRefs: [CU003, CU004, CU005, CU006, CU008, CU009, CU010, CU011, CU012, CU015]
    tableRefs: [TU003]
  - id: adoption-durability-and-concentration
    title: Public adoption signals exist, but durability and concentration remain under-disclosed
    body: >-
      PFN's public materials provide enough evidence to show commercial relevance, yet they do not provide the retention or concentration metrics needed for a clean durability read-through. The best adoption signals in this pool are proxies: a 2019 teaching-case preview describing more than 200 employees and global partners, recent robot and pilot milestones from Preferred Robotics, and third-party profile language about enterprise and research-institution clients across Japan, North America, and Europe. Those are useful for direction, but they stop short of customer-count, cohort, renewal, churn, contract-length, or top-customer disclosures. As a result, the customer story is best read as broad relationship proof with limited quantitative verification of stickiness or account concentration.
    claimRefs: [CU009, CU011, CU013, CU014, CU016]
    tableRefs: [TU002]
