  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Customer count, NRR, GRR, churn, renewal cadence, and contract-length data by major PFN product line or customer segment.
      whyItMatters: Without retention and renewal metrics, the current evidence proves relationship breadth better than durability or recurring revenue quality.
      diligencePath: Request customer KPI disclosures, cohort views, and renewal summaries by product or vertical during management diligence.
      relatedQuestionRefs: [QU008]
    - type: private-evidence-only
      severity: material
      topic: concentration-disclosure
      missingEvidence: Top-customer revenue share, channel-partner dependence, and any single-partner concentration by business line.
      whyItMatters: PFN's public proof is heavily partner-oriented, so concentration could be materially higher than the public evidence implies.
      diligencePath: Request revenue concentration schedules, top-account history, and partner contribution splits for the last two fiscal years.
      relatedQuestionRefs: [QU007, QU008]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: A fuller ledger of named deployments distinguishing paid production use, pilot programs, and collaboration-only relationships.
      whyItMatters: The current public sample shows breadth but does not establish how much of PFN's named proof converts into scaled, retained usage.
      diligencePath: Build a customer-reference list with stage, contract type, launch date, and measurable outcome for each named account.
      relatedTableRefs: [TU003]
