      - ["ENEOS", "Energy / industrial operations", "Plant automation joint business", "Commercialization path stated; production status not disclosed", "PFN explicitly lists ENEOS as its joint-business example", "No deployment volume, users, or customer outcomes disclosed"]
      - ["Chugai Pharmaceutical", "Pharma", "Experiment automation licensing", "Licensing example; deployment status not disclosed", "PFN explicitly lists Chugai Pharmaceutical as its licensing example", "No customer-count or ongoing-usage data disclosed"]
      - ["JR East", "Rail infrastructure", "Remote inspection robot development and field validation", "Pilot / POC", "Preferred Robotics says the teams ran two POC stages across six rail lines", "Evidence stops short of paid rollout or scaled production operations"]
