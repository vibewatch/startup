callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      The risk case becomes thesis-breaking if PFN cannot show paid external
      demand for MN-Core/PFCP, product-level AI-governance ownership, and a
      wider customer-partner base before the next major financing or strategic
      alliance cycle.
    claimRefs:
      - CR003
      - CR009
      - CR011
      - CR012
  - calloutType: insight
    title: Mitigations are visible but still ecosystem-stage
    body: >-
      PFN is not ignoring risk — the assigned pool shows a security JV,
      infrastructure alliances, and prior financing — but public evidence still
      stops short of proving mature compliance, concentration control, or chip
      economics.
    claimRefs:
      - CR007
      - CR013
