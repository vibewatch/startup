company:
  name: Preferred Networks, Inc.
chapter:
  number: 7
  title: Risks
  summary: >-
    PFN's biggest underwritten risks are execution breadth, chip-and-compute
    commercialization, and partner-led scaling rather than a single known legal
    event. Public mitigations exist — notably a security JV, infrastructure
    alliances, and prior financing — but the assigned evidence pool still lacks
    hard public proof on AI-governance ownership, concentration, and MN-Core
    unit economics.
sections:
  - id: ranked-risk-stack
    title: Ranked risk stack
    body: >-
      The top risk is that PFN is trying to commercialize too many coupled bets
      at once: AI chips, computing infrastructure, foundation models, applied
      products, and partner-led deployments. The assigned sources show real
      momentum across 2026, but they also show that the company is stretching
      across hardware, cloud, security, and sector-specific applications at the
      same time. That breadth can be a strength if PFN proves repeatable
      commercialization, yet it also raises the odds that one delay in chip
      rollout, compliance readiness, or partner execution cascades into slower
      revenue conversion. The most monitorable thesis-break signals are delayed
      paid deployments outside PFN's own platform, missing compliance ownership
      for model launches, or another financing cycle without clearer public
      economics on MN-Core production and usage.
    claimRefs:
      - CR001
      - CR006
      - CR011
      - CR012
    figureRefs:
      - FR001
  - id: regulatory-and-security
    title: Regulatory and security exposure
    body: >-
      PFN's public positioning now reaches generative AI models, AI chips, and
      industry-facing applications, so compliance risk is no longer theoretical.
      The EU AI Act is already in force as a real regulatory regime, and PFN's
      own product mix implies that model governance, data controls, and customer
      assurance will matter before international scale can be underwritten. PFN
      has disclosed one useful mitigation step — a 2026 security joint venture
      — but the assigned pool does not show independent evidence of security
      certifications, incident-response metrics, model-governance ownership, or
      product-by-product AI Act readiness. Until that evidence appears, legal
      and security posture should be treated as a diligence workstream with
      explicit kill criteria rather than as a cleared checkbox.
    claimRefs:
      - CR008
      - CR009
      - CR013
    tableRefs:
      - TR001
  - id: operational-and-platform
    title: Operational scale-up and platform dependence
    body: >-
      PFN's operating risk is not just technical performance; it is the
      coordination problem of scaling a hybrid stack that still depends on
      general-purpose GPUs while also bringing MN-Core processors, PFCP cloud
      services, and application businesses to market. The company has publicly
      said financing proceeds are earmarked for hiring plus development,
      production, and sales of MN-Core L1000, which means commercialization is
      still absorbing capital and execution bandwidth rather than harvesting a
      mature, low-touch product base. Because the assigned pool offers no public
      utilization, unit-economics, or on-time production evidence for PFCP and
      MN-Core, investors should treat schedule slips, weak third-party adoption,
      or elevated hiring needs as leading indicators of operational strain.
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR012
    tableRefs:
      - TR002
  - id: partner-capital-and-concentration
    title: Partner, capital, and concentration risk
    body: >-
      PFN's go-to-market pattern is structurally partner-dependent. Its own
      business materials emphasize joint research, joint commercialization, new
      ventures, and licensing, while independent J-Startup coverage highlights a
      relatively small set of flagship collaborators such as Toyota, FANUC, and
      the National Cancer Center Japan. That design can accelerate access to
      real-world deployments, but it also means delays at a few strategic
      counterparties can affect multiple sectors at once. The same logic applies
      to capital: the last quantified financing disclosure was explicitly tied
      to chip development and commercialization, so any slowdown in partner
      rollout, capital-provider appetite, or infrastructure buildout should be
      read as both a growth risk and a financing-risk signal.
    claimRefs:
      - CR004
      - CR005
      - CR007
      - CR011
    tableRefs:
      - TR003
