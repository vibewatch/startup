- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Profitability signal
    - Profitable per company statement; TechCrunch cites 280% profit growth
    - Medium
    - Directionally positive evidence that gross profit is not being fully reinvested away
    - Request audited EBITDA, operating income, and margin bridge
  - - Customer count
    - 15,000+ companies
    - Medium
    - Shows meaningful installed base and a real subscription footprint
    - Request paid customer count, enterprise account count, and seat count
  - - Team size
    - ~80 employees
    - Medium
    - Useful proxy for capital efficiency when compared with customer scale
    - Request fully loaded headcount cost and hiring plan
  - - ARR or revenue
    - null
    - Low
    - Core underwriting metric for sales efficiency and valuation is not public
    - Request trailing 12-month ARR and revenue recognition policy
  - - CAC / payback
    - null
    - Low
    - Needed to judge GTM efficiency as Linear pushes further into enterprise
    - Request CAC by segment, sales cycle, and payback by channel
  - - Gross margin / NRR / churn
    - null
    - Low
    - Essential to assess quality of recurring revenue and expansion durability
    - Request gross margin bridge, NRR, gross retention, and logo churn
  notes: Public signals are better for trajectory than for precise unit-economics reconstruction.
  claimRefs:
  - CI006
  - CI007
- id: TI004
  title: Capital adequacy table
  columns:
  - Line item
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest disclosed capital
    - 'Series C: $82M at $1.25B valuation'
    - Medium
    - Fresh capital materially reduces near-term funding pressure
    - Request cap table, primary versus secondary split, and current cash bridge
  - - Total raised
    - ~$134.2M reported by TechCrunch
    - Medium
    - Frames the cumulative equity cushion behind current operations
    - Request board-approved funding history with cash received and fees
  - - Cash on hand
    - null
    - Low
    - Determines actual runway and downside resilience
    - Request current cash, restricted cash, and short-term investments
  - - Monthly burn
    - null
    - Low
    - Needed to convert the raise into runway months
    - Request net burn, gross burn, and burn by function
  - - Debt or project finance
    - No public disclosure found
    - Low
    - Off-balance-sheet financing can materially change risk
    - Request debt schedule, covenants, and any vendor financing
  - - Next-round trigger
    - Unknown publicly
    - Low
    - Needed to understand whether financing is strategic or required
    - Request management triggers for next primary, secondary, or IPO path
  notes: The disclosed raise and profitability signal are positive, but runway remains impossible to calculate from public
    sources alone.
  claimRefs:
  - CI005
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Current public substitute
  - Why substitute is insufficient
  - Exact diligence path
  rows:
  - - Cash balance
    - Blocks runway analysis
    - Fresh funding amount
    - Capital raised does not equal cash remaining
    - Request latest balance sheet and monthly cash report
  - - Monthly burn
    - Blocks capital adequacy under downside scenarios
    - Profitability statement
    - Profitability does not reveal cash burn or working-capital swings
    - Request 12-month burn and budget versus actual
  - - ARR / revenue by segment
    - Blocks revenue-mix underwriting
    - 15,000+ customer count and public pricing
    - Customer count does not reveal monetized seats or ARPU
    - Request ARR bridge by self-serve, enterprise, and geography
  - - NRR / churn / retention
    - Blocks revenue-quality verdict
    - Customer proofs and profitability signal
    - References say nothing about cohort durability
    - Request cohort tables by plan, logo churn, and seat expansion
  - - Gross margin / CAC / payback
    - Blocks margin-path and GTM-efficiency view
    - Public-company filings for comps
    - "Comp filings only show what good disclosure looks like, not Linear\u2019s actual metrics"
    - Request gross margin bridge, sales efficiency metrics, and CAC by channel
  notes: "The public record is good enough to describe Linear\u2019s monetization shape, but not good enough to complete a\
    \ real financial underwrite."
  claimRefs:
  - CI001
