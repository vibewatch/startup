- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Self-serve seat subscriptions
    - Recurring SaaS plan sales
    - Per active user seat
    - Confirmed via Free/Basic/Business public pricing
    - 'High: recurring and transparent list pricing'
    - Request ARR split by plan and monthly versus annual mix
  - - Enterprise contracts
    - Custom pricing and managed procurement
    - Per seat / contract
    - Confirmed by contact-sales path and Stripe case study
    - 'High: likely longer commitment and larger accounts'
    - Request average contract value, minimum terms, and renewal rates
  - - Expansion from seat changes
    - Automated true-ups and credits
    - Net seat adds or suspensions
    - Confirmed in billing docs for yearly plans
    - 'Medium-high: expands with adoption inside paid accounts'
    - Request cohort expansion by seat growth and plan upgrades
  - - Legacy self-serve model
    - Free tier plus earlier pay-what-you-want path
    - Subscription
    - Historical per Stripe case study
    - Low current relevance but useful for pricing evolution
    - Request timeline of monetization changes and conversion impact
  - - Other streams
    - Publicly undisclosed
    - Unknown
    - No reviewed evidence of material non-subscription revenue
    - Unknown
    - Request whether services, partner resale, or implementation revenue exists
  notes: Public sources show how Linear charges, but not the revenue mix among the listed streams.
  claimRefs:
  - CI001
  - CI002
  - CI008
  - CI010
