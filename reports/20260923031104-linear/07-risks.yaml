slug: linear
runDate: '2026-09-23'
company:
  name: Linear
chapter:
  number: 7
  title: Risks
  summary: "Linear\u2019s public risk profile is more about dependency density than a single existential defect. The company\
    \ shows a mature security and privacy posture for its size\u2014SOC 2, GDPR-oriented documents, enterprise access controls,\
    \ and a visible DPA\u2014but it also routes key workflows through a long stack of third-party AI, cloud, monitoring, support,\
    \ and communication vendors. That creates a compound residual exposure: outages or policy changes at Google Cloud, OpenAI,\
    \ Anthropic, Cohere, Slack, GitHub, Sentry, or other counterparties can directly affect issue intake, triage, automation,\
    \ and customer trust. The absence of public enterprise SLA details, cap-table terms, customer concentration data, and\
    \ a verified revenue bridge keeps underwriting confidence below what the June 2025 unicorn mark would otherwise suggest."
tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - rule / case / obligation
  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  rows:
  - - EU AI Act obligations for AI workflows and agent deployments
    - EU
    - Applicable to AI use cases; GPAI obligations already in force and high-risk / transparency duties phase in from Aug
      2026
    - medium
    - high
    - Linear says data is not used to train models and keeps a documented security / DPA stack
    - medium-high
    - "Confirm where Linear\u2019s agent features are deployed in regulated workflows and whether enterprise controls map\
      \ to AI Act transparency and record-keeping duties."
  - - GDPR and cross-border transfer exposure from U.S.-centric processing and subprocessor sprawl
    - EU / UK / Switzerland
    - Ongoing
    - medium
    - high
    - DPA uses SCC-based safeguards, customer objection rights, regional storage options, and documented processor terms
    - medium
    - Review actual enterprise DPA schedules, subprocessor notices, and any supervisory authority correspondence or customer
      transfer-impact assessments.
  - - Contractual liability cap and no-interruption warranty in core terms
    - Delaware / global contracts
    - Current terms in force
    - high
    - moderate
    - Enterprise negotiations may improve terms; security and access controls reduce some loss frequency
    - medium-high
    - Request standard enterprise MSA, SLA credits, indemnity carve-outs, and any negotiated exceptions for larger customers.
  - - Third-party AI and integration confidentiality / IP risk
