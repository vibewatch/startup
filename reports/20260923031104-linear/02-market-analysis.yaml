- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Hybrid and remote work complexity
    - driver
    - current
    - Supports demand for structured async coordination and visibility
    - Ask for retention and expansion by distributed-team customers.
  - - Cloud delivery and SaaS integrations
    - driver
    - current
    - Favors subscription workflow platforms over installed legacy stacks
    - Request integration attach rates and ecosystem dependency data.
  - - AI-assisted planning and agent workflows
    - driver
    - current to medium-term
    - Expands Linear beyond manual issue tracking into workflow automation budgets
    - Request usage and monetization split for AI and agent features.
  - - Large-enterprise coordination needs
    - driver
    - current
    - Creates willingness to replace fragmented legacy reporting stacks
    - Request pipeline mix by SMB, mid-market, and enterprise.
  - - Data security and privacy concerns
    - constraint
    - current
    - Can slow adoption for regulated buyers and increase diligence burden
    - Request security review results and enterprise objection data.
  - - Migration and implementation cost
    - constraint
    - current
    - Makes rip-and-replace harder when legacy customization is deep
    - Request average migration effort and time-to-value metrics.
  - - Incumbent configurability and integration breadth
    - constraint
    - current
    - Jira and broader suites remain strong where custom process wins over speed
    - Request win/loss data versus Jira, Asana, and Monday.
  - - No clean public SAM / SOM
    - constraint
    - current
    - Limits external precision in market-underwriting models
    - Request internal market segmentation and enterprise ACV ranges.
  notes: Drivers and constraints are tied to the adoption path, not just abstract market narrative.
  claimRefs:
  - CM001
- id: TM005
  title: Sizing / adoption diligence gaps table
  columns:
  - Gap
  - Current public state
  - Why it matters
  - Exact diligence path
  rows:
  - - Linear-specific SAM
    - No retained public source isolates a developer-first SAM for Linear
    - Without SAM, penetration assumptions can become arbitrary
    - Request management segmentation by company size, seat count, and workflow type.
  - - Linear-specific SOM
    - No retained public source established public market share or realistic near-term share ceiling
    - SOM is required for disciplined valuation modeling
    - Request customer counts and win rates by segment and region.
  - - Buyer economics
    - Public sources imply likely budgets but do not disclose ACV, contract length, or seat density
    - Sales efficiency and expansion analysis depend on this
    - Request ACV distribution, expansion cohorts, and enterprise seat counts.
  - - Segment mix
    - Public sources do not disclose customer mix by vertical, geography, or company size
    - Mix affects market portability beyond tech-forward users
    - Request customer mix and NRR by segment.
  notes: This table captures the specific market-model inputs that remain missing even after broad market and customer workflow
    research.
  claimRefs:
  - CM001
