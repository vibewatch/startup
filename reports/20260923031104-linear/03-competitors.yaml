company:
  name: Linear
chapter:
  number: 3
  title: Competitors
  summary: Linear competes most directly with Jira, GitHub, ClickUp, Monday Dev, Asana, Notion, GitLab, Shortcut, and open-source
    substitutes such as Plane; its advantage is engineering-native speed, while its main risk is suite bundling and rapid
    feature imitation.
sections:
- id: SEC301
  title: Landscape and competitor classes
  body: "Linear competes in a crowded workflow market where buyers can choose a dedicated engineering-first tool, a broader\
    \ work-management suite, a developer platform with embedded planning, or a lightweight substitute. The most direct proprietary\
    \ rivals are Jira, ClickUp, Shortcut, and monday dev, all of which sell task or issue tracking to software teams. Asana\
    \ and Notion are more cross-functional than Linear, but they still compete whenever product, design, and operations leaders\
    \ want one system to cover planning beyond engineering. GitHub and GitLab matter because they package planning directly\
    \ next to code review, CI/CD, and repository workflows, which lowers adoption friction for engineering organizations that\
    \ prefer fewer vendors. Plane represents the open-source/self-hosted lane for cost-sensitive teams that want modern issue\
    \ tracking without a long-term SaaS commitment. Internal build, spreadsheets, and lightweight GitHub Issues workflows\
    \ remain the status quo substitutes for smaller teams that do not yet need a full product-development system of record.\
    \ Review ecosystems such as The Digital Project Manager, Zapier, Capterra, and G2 still present the category as broad\
    \ and substitutable in 2026, which reinforces that Linear does not sell into an uncontested niche. The competitive frame\
    \ is therefore not just \u201CLinear versus Jira\u201D; it is \u201CLinear versus bundled suites, cheaper substitutes,\
    \ and broader work platforms\u201D across multiple buyer archetypes."
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP012
  tableRefs:
  - TP001
  figureRefs:
  - FP001
  - FP002
- id: SEC302
  title: Capability, pricing, and distribution comparison
  body: "On list pricing, Linear sits in a relatively competitive middle position. Its Basic plan at $10 per user per month\
    \ billed yearly is close to Asana Starter at $10.99 and below Notion Business at $20 and GitLab Premium at $29. ClickUp\u2019\
    s Unlimited tier is cheaper at $7, while monday.com\u2019s published 10-seat examples imply Basic around $9 per seat and\
    \ Standard around $12. This means Linear is not winning by being structurally cheaper than every rival; instead, it appears\
    \ to be asking buyers to pay for workflow fit, speed, and a product-development-first experience. Capability breadth is\
    \ where the trade-off becomes clearer. Linear markets an end-to-end workflow from customer discovery to planning and execution,\
    \ but broader suites still span more adjacent work outside engineering. Asana and Notion lean into cross-functional coordination,\
    \ GitHub and GitLab attach planning to code, and Jira benefits from Atlassian\u2019s larger enterprise footprint. Customer-proof\
    \ pages across incumbents show that sophisticated teams already run these alternatives at scale, which limits any claim\
    \ that Linear is uniquely enterprise-ready. The strongest comparison case for Linear is therefore not maximum breadth;\
    \ it is focused depth for teams that value faster execution and a more opinionated product workflow than legacy suites\
    \ typically provide."
  claimRefs:
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP002
  - TP003
- id: SEC303
  title: Durability, switching costs, and displacement risk
  body: "The best public evidence for Linear\u2019s moat is not proprietary data or a visible cost advantage; it is adoption\
    \ by teams that actively wanted to leave heavier systems. Linear\u2019s customer page highlights OpenAI at 3,000 users\
    \ and an Oscar story explicitly framed around leaving a complex Jira estate, which suggests the product can replace legacy\
    \ tooling when UX, speed, and engineering fit matter enough. Its security page also shows that enterprise trust controls\
    \ are no longer a barrier to consideration. But those positives do not create a cleanly durable moat. Atlassian, GitHub,\
    \ and GitLab all combine planning with broader ecosystems that can reduce buying friction, while Asana, Notion, ClickUp,\
    \ and monday continue to push product and AI workflow narratives into adjacent use cases. Plane adds an open-source pressure\
    \ point for teams that want modern issue tracking without a premium SaaS contract. In practice, Linear\u2019s position\
    \ looks strongest for software organizations that want a focused system of record for product development and are willing\
    \ to keep docs, CRM, or other operational workflows elsewhere. Its position is weaker where procurement prefers suite\
    \ consolidation, where buyers are satisfied with bundled GitHub/GitLab planning, or where price-sensitive teams can multi-home\
    \ across lightweight substitutes. The central competitive risk is therefore imitation and bundling pressure, not lack\
    \ of product quality."
  claimRefs:
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP010
