            body: >-
              The correct financial verdict is positive on revenue quality and scale, but still incomplete on
              resilience. Public evidence strongly supports a recurring, enterprise-oriented software business with
              premium valuation support: the company reports 803 paying customers, TechCrunch reported $100M ARR, Series
              D priced at $2.75B, and customer case studies show measurable commercial outcomes that should support real
              willingness to pay. The composable, warehouse-native architecture also suggests Hightouch is structurally
              better positioned than a storage-heavy CDP on infrastructure burden, while the Series C and Series D
              financings materially lower near-term refinancing pressure. But none of that converts into a finished
              underwrite without the private metrics that matter most. Gross margin, CAC, payback, NRR, churn, cash,
              burn, runway, realized enterprise pricing, module attach rates, debt, and direct filing visibility all
              remain absent or incomplete in the reviewed public record. The consequence is that investors can
              underwrite demand and momentum, but not durability with precision. Hightouch therefore looks like a
              high-quality, fast-growing software asset whose downside still depends on unseen retention, margin, and
              cash-flow behavior rather than on a lack of top-line proof.
