  - id: TV001
    title: Recommendation summary table
    description: >-
      Summary recommendation, confidence, risk rating, valuation stance, and entry discipline for Hightouch as of June
      2026.
    columns:
      - Dimension
      - Assessment
      - Basis
      - Decision implication
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV021
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
    notes: >-
      Public evidence is adequate to judge the financing event and current price sensitivity, but not adequate to
      underwrite common-equity upside at the Series D mark.
    rows:
      - - Overall recommendation
        - TRACK / PASS ON CURRENT PRICE
        - Real company quality, but the $2.75B mark implies ~27.5x ARR on the disclosed $100M run rate.
        - Reopen only if diligence materially upgrades revenue quality or terms lower effective entry.
      - - Confidence level
        - Medium
        - >-
          Round facts, ARR snapshot, comp data, and market structure are well corroborated; margin, NRR, burn, and
          cap-table detail are not.
        - Confidence would rise if private diligence confirms elite retention and favorable preference terms.
      - - Risk rating
        - High
        - >-
          Primary risk is price risk layered on top of disclosure gaps, warehouse dependence, and category
          consolidation.
        - Do not treat current mark as a low-risk growth round.
      - - Valuation stance
        - Overextended relative to public proof
        - Public martech comp band is roughly 3.3x-6.5x revenue, far below the current implied multiple.
        - Assume the round embeds strategic or preferred economics not visible in public sources.
      - - Current mark support
        - Not supported by public evidence alone
        - The company could grow into the price, but current disclosures do not independently justify it.
        - Require private data before treating the Series D as fair value.
      - - Entry discipline
        - $1.0-1.5B effective entry or structured downside protection
        - That range still grants a premium to public comps while leaving room for strong execution.
        - At $2.75B, insist on ratchets, preferences, or wait.
  - id: TV002
    title: Thesis / anti-thesis table
    description: Core bullish and bearish arguments for Hightouch, plus the diligence gates that would change the recommendation.
    columns:
      - Dimension
      - Thesis
      - Anti-thesis
      - What would change the view
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV014
      - CV016
      - CV017
      - CV018
      - CV019
      - CV033
      - CV034
      - CV041
      - CV042
    notes: >-
      The strongest argument for Hightouch is operating momentum; the strongest argument against an investment is that
      most of the upside may already be priced in.
    rows:
      - - AI-led growth
        - Hightouch reached $100M ARR and added $70M ARR in roughly 20 months after launching AI products.
        - >-
          The AI wave is recent and may prove cyclical or easier for larger platforms to copy than current enthusiasm
          suggests.
        - Show sustained 2026-2027 ARR growth with durable AI attach rates and low churn.
      - - Enterprise credibility
        - Gartner 2026 CDP leader status, 300+ integrations, and visible enterprise logos support category leadership.
        - Leader status improves procurement credibility but does not by itself justify a 27.5x ARR valuation.
        - Confirm that leader placement translates into higher win rates, larger ACVs, and faster expansions.
      - - Customer proof
        - >-
          Customer stories show 70M+ loyalty-member scale, double-digit lifts, and named brands across retail, fintech,
          and media.
        - Most proof is vendor-produced and may overstate generalizable ROI.
        - Request top-20 customer cohort data, contract tenure, logo churn, and expansion history.
      - - Strategic backing
        - Goldman, Bain, Databricks Ventures, YC, and TD7 reduce financing risk and expand ecosystem relevance.
        - Strategic sponsorship can raise the round price without improving return potential for a new investor.
        - Clarify whether strategic investors received economics or access rights that distort the headline mark.
      - - Market structure
        - Warehouse-native and agentic positioning can make Hightouch a strategic platform asset.
        - >-
          Fivetran’s Census acquisition and category-collapse commentary show the market may consolidate around broader
          stacks before Hightouch captures full standalone upside.
        - Prove Hightouch can remain differentiated even if reverse ETL and CDP categories keep collapsing together.
