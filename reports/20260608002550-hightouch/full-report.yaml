      - number: '4.3'
        title: Cost structure, gross-margin drivers, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Public sources reveal more about the shape of Hightouch’s cost base than about its actual margins. The
              most useful structural clue is architectural: Hightouch’s security page says the platform connects
              directly to the customer’s warehouse and never stores the customer’s data. That warehouse-native posture
              should reduce Hightouch’s own storage burden versus a legacy CDP that maintains a large vendor-hosted
              customer database, and it likely improves gross margin quality relative to a more storage-heavy
              architecture. But the same public record also points to variable-cost drivers that can still matter. The
              pricing page charges on usage; the AI Decisioning docs say the system automates campaign decisions at the
              individual-user level and uses reinforcement learning; and external reverse-ETL analysis highlights
              warehouse compute and downstream API limits as real cost components at scale. In other words, Hightouch
              probably trades storage-heavy economics for a mix of control-plane software costs, support and security
              overhead, warehouse-query orchestration, destination-API consumption, and increasing AI inference or
              content-generation costs as agentic workflows expand. Customer ROI evidence supports pricing power, but it
              does not reveal service-delivery gross margin. The core diligence blocker is therefore not whether
              Hightouch has cost drivers—it clearly does—but how those costs split across infrastructure, AI, support,
              services, and sales, and whether gross margin remains strong as AI Decisioning becomes a bigger revenue
              contributor.
