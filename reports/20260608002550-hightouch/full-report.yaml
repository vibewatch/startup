      - - Management operating cadence
        - Public disclosures still omit concentration, NRR, SLA, burn, and gross margin despite a high-growth valuation
        - Medium
        - Critical
        - Fresh capital and strong ARR growth buy time
        - >-
          Request board KPI pack, cohort retention, concentration, support-cost trend, and burn multiple before
          underwriting valuation durability
    notes: >-
      The table mixes classic people risk with execution and operating-model gaps because public disclosure is thinner
      on org design than on top-line growth.
