        - label: 'Gate 2: Price test'
          detail: >-
            Current mark implies ~27.5x ARR versus public martech comps of roughly 3.3x-6.5x. Public evidence fails the
            price screen.
          tone: risk
        - label: 'Gate 3: Disclosure test'
          detail: >-
            NRR, gross margin, burn, concentration, and preference stack are not publicly disclosed. Valuation cannot be
            fully underwritten.
          tone: risk
        - label: Conditional upside path
          detail: >-
            If diligence proves much stronger revenue quality or if effective entry falls toward $1.0-1.5B, the company
            becomes investable.
          tone: neutral
        - label: TRACK / PASS ON CURRENT PRICE
          detail: Current public evidence supports admiration, not purchase, at the April 2026 headline mark.
          tone: risk
      edges:
        - from: Hightouch investment decision
          to: 'Gate 1: Operating proof'
          label: evaluate company quality
        - from: 'Gate 1: Operating proof'
          to: 'Gate 2: Price test'
          label: quality passes
        - from: 'Gate 2: Price test'
          to: 'Gate 3: Disclosure test'
          label: price remains aggressive
        - from: 'Gate 3: Disclosure test'
          to: TRACK / PASS ON CURRENT PRICE
          label: if key economics remain opaque
        - from: 'Gate 3: Disclosure test'
          to: Conditional upside path
          label: if diligence upgrades fundamentals
        - from: Conditional upside path
          to: TRACK / PASS ON CURRENT PRICE
          label: until terms or evidence improve
