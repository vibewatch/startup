            body: >
              No public comparable is perfect, but the direction of the market is still clear. Braze and Klaviyo are the
              closest public reads on marketing-execution and customer-data monetization; HubSpot is much broader and
              more mature; Twilio includes communications infrastructure and Segment, making it the least clean but
              still informative customer-data-platform benchmark. All four trade at revenue multiples dramatically below
              Hightouch’s current private mark. That gap does not prove the round is wrong—private AI winners can
              temporarily outrun public comps—but it does mean the burden of proof is on Hightouch to grow into the
              valuation rather than on skeptics to explain why the public market is missing something obvious. The right
              comparable conclusion is not “Hightouch should trade exactly at Braze.” It is “public benchmarks imply
              that Hightouch’s present valuation already prices in a premium strategic outcome that has not yet been
