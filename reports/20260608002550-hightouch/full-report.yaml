      - number: '8.2'
        title: Valuation Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Public sources support the existence of the round, not its fairness for a fresh investor. Using the
              disclosed $100M ARR snapshot from April 2026, the $2.75B Series D implies approximately 27.5x ARR. That is
              far above June 2026 public martech benchmarks: Braze and Klaviyo sit near 3.5x revenue, HubSpot near 3.3x,
              and Twilio near 6.5x. Hightouch deserves some premium to those names because its growth is faster, its AI
              narrative is newer, and its warehouse-native position can create strong switching value in data-mature
              accounts. Even so, public evidence alone supports something closer to a premium private-growth framework
              than to the current round mark. A disciplined outside investor should therefore treat $2.75B as a
              strategic late-stage financing reference, not an independently proven fair-value floor. To move off a
              pass, diligence would need to show revenue already well above the public $100M run rate, NRR and margins
              strong enough to support a double-digit long-duration multiple, and cap-table terms that do not hide
              downside behind preferred protections unavailable to new common-like money.
