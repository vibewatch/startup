            body: >-
              The financial and execution risk is less about visible distress than about how much expectation is already
              priced into a still-under-disclosed company. TechCrunch reports $100 million of ARR, $70 million of ARR
              added within 20 months of the AI launch, and roughly 380 employees. Business Wire then says the Series D
              raised $150 million at a $2.75 billion valuation after more than 100% growth in each of the prior two
              years. Those are strong numbers, but they create a narrower margin for error. Y Combinator still lists
              team size at 200, which suggests public people-count drift at the same moment that Hightouch is expanding
              from reverse ETL into agentic marketing, multi-channel execution, and AI-driven content orchestration.
