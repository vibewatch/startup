    title: Sizing / adoption contradictions and diligence gaps table
    columns:
      - Gap / contradiction
      - Current public state
      - Why it matters
      - Exact diligence path
    rows:
      - - 2026 CDP market size
        - Fortune says $4.07B in 2026; Mordor says $4.58B in 2026.
        - >-
          Base-size assumptions can move TAM and growth sensitivity materially even before any Hightouch-specific
          narrowing.
        - Request management’s internal TAM framework and exact market-definition bridge used in board materials.
      - - Regional concentration
        - Fortune gives North America 59.6% of 2025 share; Mordor gives 47.32%.
        - Affects assumptions about geographic concentration, expansion runway, and which buyers matter most.
        - Request current revenue mix by region and pipeline mix by geography.
      - - Category label
        - >-
          Official framing spans reverse ETL, composable CDP, and agentic marketing; external commentary still often
          treats the company as activation middleware.
        - Valuation and competitive set change depending on which label buyers actually use in procurement.
        - Request current positioning by segment, win-loss reasons, and product-line revenue or pipeline split.
      - - Architecture uniqueness
        - >-
          Hightouch says warehouse-native and zero-copy are differentiators, but Salesforce, RudderStack, Tealium, and
          mParticle now advertise overlapping claims.
        - If the architecture is becoming table stakes, moat must come from workflow, governance, and GTM execution.
        - >-
          Request comparative win rates and proof of differentiated retention or expansion versus warehouse-connected
          rivals.
      - - Hightouch-specific SAM / SOM
        - No retained public source isolates a warehouse-mature activation submarket or Hightouch share ceiling.
        - Without SAM/SOM, public valuation work risks false precision.
        - Request segment counts, ACV by segment, and management’s share assumptions by buyer class.
