  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and the substitute set
        blocks:
          - type: paragraph
            body: >-
              Hightouch should be underwritten as a warehouse-native customer-data activation platform that now spans
              four overlapping layers: reverse ETL, composable CDP, identity resolution, and AI decisioning. Official
              surfaces no longer describe the company as only a reverse-ETL utility. The homepage and pricing page frame
              it as a customer data and AI platform for marketers across marketing, advertising, data, and operations,
              while the product pages package Customer Studio, Identity Resolution, Reverse ETL, Hightouch Events, and
              AI Decisioning as adjacent modules rather than separate businesses. The included spend is therefore the
              software budget used to turn first-party warehouse data into audiences, customer profiles, journeys, ad
              suppressions, conversion signals, next-best-action decisions, and governed syncs into downstream tools.
              The excluded spend is upstream ingestion, warehouse storage and compute itself, media inventory, and owned
              message delivery by systems such as Salesforce Marketing Cloud or Iterable. That boundary matters because
              the substitute set is broad: traditional packaged CDPs, manual CSV exports, point-to-point automation,
              warehouse-native challengers such as RudderStack and post-acquisition Census/Fivetran Activations, and
              large suites such as Salesforce Data 360, Segment, mParticle, and Tealium. The market is real, but the
              label attached to it changes depending on whether the buyer is emphasizing data activation, customer 360,
              or agentic marketing.
