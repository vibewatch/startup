          - type: paragraph
            body: >
              Hightouch looks strategically relevant, but not publicly IPO-ready. The company has the ingredients that
              make buyers pay attention—rapid growth, a current AI narrative, enterprise logos, warehouse and channel
              integrations, and deep backing from investors and ecosystem partners. What it lacks in public evidence are
              the variables that decide whether a late-stage price is durable: retention quality, gross-margin
              structure, burn efficiency, customer concentration, preference stack, and secondary or liquidation
              dynamics. Those missing inputs matter more than the quality of the product demo. The most plausible exits
              today are a strategic sale to a broader data, cloud, or martech platform; a late-stage recap; or a delayed
              IPO only after much deeper disclosure. Investors should not frame the next step as “buy or don’t buy
              Hightouch.” The better frame is “what specific evidence would convert a very good company from an
              expensive strategic round into an investable risk-adjusted entry?” Until those diligence asks are
              answered, price discipline should dominate enthusiasm.
