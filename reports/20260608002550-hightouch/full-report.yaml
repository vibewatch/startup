      - number: '6.3'
        title: Durability, repeat-use proxies, and review quality
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is directionally positive but materially incomplete. PetSmart’s case study
              shows unusually strong repeat-use proxies: more than 95% of sales are attached to Treats Rewards members,
              the company powers 1,000+ audiences, and campaign tests produced incremental sales lift. Grammarly says
              its weekly insights emails are a major reason for a high retention rate, and Docusign says Hightouch data
              is core to workflows that identify expansion opportunities and reduce churn. Fundrise explicitly frames
              higher invested amounts as creating investor stickiness. Those are meaningful signals that customers embed
              the product in recurring systems, but none of the reviewed sources disclose NRR, GRR, paid churn, renewal
              rates, contract length, or logo-retention cohorts.

              Independent sentiment is also less clean than the raw rating numbers suggest. Integrate.io reports strong
              third-party ratings, and Slashdot includes one enthusiastic enterprise review, but both direct G2 and
              Gartner review pages were bot-blocked in this run, so the current review mix could not be inspected
              firsthand. The best evidence-backed conclusion is that buyers appear satisfied with implementation speed,
              support, and warehouse-native flexibility, but the public record does not underwrite long-term retention
              economics or prove that the positive review surface is evenly distributed across customer sizes and use
              cases.
