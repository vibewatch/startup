  - id: TV005
    title: Thesis-break and kill triggers table
    description: Monitorable thresholds that would break the Hightouch investment case at the current valuation.
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV024
      - CV025
      - CV026
      - CV027
      - CV029
      - CV033
      - CV037
      - CV038
    notes: >-
      These are decision triggers, not forecast certainties. They are framed around the current public valuation, where
      downside tolerance is low.
    rows:
      - - Revenue quality disappoints
        - NRR below ~115% or material logo churn in core enterprise cohorts
        - Eliminates the argument for paying a premium private multiple well above public comps.
        - Pass unless valuation resets materially.
      - - AI attach proves shallow
        - AI-led products fail to keep adding meaningful ARR through 2026-2027
        - Bull case depends on AI extending Hightouch beyond classic reverse ETL and composable CDP.
        - Re-rate to base/bear framework and avoid the current price.
      - - Gross margin or burn underwhelm
        - Gross margin structurally below premium software levels or burn remains elevated
        - High current multiple assumes software-like incremental economics.
        - Require structured downside or defer investment.
      - - Category consolidation accelerates
        - Broader data platforms absorb reverse ETL/CDP functionality faster than Hightouch differentiates
        - Compresses strategic scarcity and standalone exit optionality.
        - Lower multiple assumptions and reduce valuation support.
      - - Cap-table protections are unfavorable
        - >-
          Senior preferences, participating structures, or significant secondary overhang distort true common-equity
          entry
        - Headline post-money may not represent fair economics for a new investor.
        - Do not underwrite off the headline price.
      - - IPO path remains opaque
        - No credible path to public-company disclosure and durability metrics by 2027-2028
        - Leaves only strategic or recap exits, which may clear at lower multiples.
        - Treat IPO upside as speculative, not base-case.
