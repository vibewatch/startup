  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor
      - Published pricing logic
      - Contract model
      - Included capabilities
      - Unknowns / caveats
      - Implication
    rows:
      - - Hightouch
        - Destination-oriented, value-based framing rather than volume-based pricing
        - Sales-led subscription with tiering and add-on modules
        - Warehouse-native activation, Customer Studio, and AI Decisioning surfaces
        - Public pricing detail is limited; realized enterprise discounting is undisclosed
        - The pitch is predictable for marketers, but true budget shape still needs diligence
      - - Fivetran Activations
        - Usage charged on monthly active rows; 14-day trial per activation
        - Platform contract that can span connectors, transformations, and activations
        - Reverse ETL, Audience Hub, AI Columns, datasets, and broader Fivetran platform
        - Audience Hub is reserved for Enterprise and overall spend depends on broader platform use
        - The nearest peer now arrives through bundle economics, not a narrow point solution
      - - RudderStack
        - Free / Starter / Growth / Enterprise with usage-based pricing and no MTUs
        - Cloud subscription or self-hosted deployment
        - Event stream, reverse ETL, identity resolution, audience builder, propensity scores
        - Self-hosted TCO depends on internal engineering capacity and support needs
        - Lowest-commitment credible warehouse-native alternative for technical buyers
      - - Twilio Segment
        - Connections uses MTU pricing; CDP plans move to contact sales
        - Suite contract across Connections, Unify, and Engage
        - Event collection, identity resolution, profiles, audiences, journeys, and reverse ETL
        - CDP and reverse-ETL-only pricing are custom rather than transparent
        - Broader suite can win when buyers want one vendor for multiple data layers
      - - Salesforce Data 360
        - Consumption credits, storage, and premium add-ons
        - Broader Salesforce platform contract
        - Zero-copy data unification, activation, and Agentforce context engine
        - Customers can need extra products and can exhaust credits unpredictably
        - A serious procurement threat where Salesforce is already the system of action
      - - Tealium
        - Primarily demo-led enterprise pricing
        - Enterprise CDP contract often wrapped with partner, compliance, and vertical bundles
        - Identity, consent, cloud activations, real-time orchestration, and AI context routing
        - Public list pricing is thin and implementation scope can be large
        - Best positioned when privacy, integration breadth, and regulated use cases dominate
      - - Braze
        - Custom enterprise packaging; public list pricing not central to the data-platform pitch
        - Engagement-platform contract with data and AI capabilities inside it
        - Warehouse audiences, real-time triggers, segmentation, and BrazeAI
        - Activation is sold as part of a broader engagement workflow rather than a clean standalone layer
        - Braze can make the separate activation budget disappear inside execution spend
    notes: >-
      This table compares pricing logic and packaging structure rather than forcing apples-to-oranges list prices across
      vendors that publish very different degrees of detail.
