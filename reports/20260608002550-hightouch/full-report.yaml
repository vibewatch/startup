      - number: '8.3'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              Scenario analysis is unusually important here because the current mark leaves little room for normal
              execution variance. In the bull case, Hightouch sustains AI-led expansion, compounds ARR toward $275-325M
              by 2028, keeps enterprise buyers engaged, and exits at roughly 9x-11x revenue. That case allows investors
              at the current mark to preserve or modestly grow capital, but not to earn the sort of outsized multiple
              typically sought in private growth investing. The base case is more plausible: growth normalizes, ARR
              reaches roughly $190-230M, and exit multiples settle into a 6x-8x band, which yields a valuation well
              below today’s round. The bear case pairs slower AI monetization with category consolidation, pricing
              friction, or broader multiple compression, leaving Hightouch dramatically overvalued versus realizable
              exits. Said differently, the current valuation is not being underwritten against downside; it is being
              underwritten against a continuation of best-case operating momentum. That is too aggressive for a
              public-evidence-only recommendation.
