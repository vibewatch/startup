companyProfile:
  summary: >-
    Hightouch is a San Francisco-founded private software company that started in warehouse-native reverse ETL and has
    expanded into a broader composable CDP and agentic marketing platform. The company is still founder-led by Kashish
    Gupta, Tejas Manohar, and Josh Curl, sells recurring software modules across reverse ETL, Customer Studio, identity
    resolution, and AI Decisioning, and has built visible enterprise traction with 803 paying customers, 300+
    integrations, and named customers such as PetSmart, Ramp, Grammarly, and Warner Music Group. By April 2026 it had
    reached $100M ARR and raised a $150M Series D at a $2.75B valuation, but the public record still leaves key
    retention, margin, burn, and cap-table questions unresolved.
