  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              The competitive frame is no longer just Hightouch versus Census. The closest reverse-ETL peer set still
              exists in product terms, but the Census brand has effectively become Fivetran Activations, which means the
              former duopoly now competes against a broader data-movement platform rather than another venture-backed
              standalone. Around that direct lane sit several larger classes of rivals. RudderStack is the low-cost,
              warehouse-native, self-hosted-minded alternative for teams that want more data-team control and less
              marketer-first workflow. Twilio Segment, mParticle, and Tealium remain packaged or hybrid CDP incumbents
              that combine identity, audienceing, and real-time data flows with broader execution or governance
              surfaces. Salesforce Data 360 is the dominant destination-side incumbent because it can activate zero-copy
              customer data inside the broader Salesforce suite and tie it to Agentforce. Braze is the key adjacent
              substitute from the execution layer because it increasingly offers its own data platform, warehouse
              audiences, and AI. Independent 2026 coverage reinforces that the market has split between platformization
              and agentification, while category-level analysis argues reverse ETL itself has become table stakes. In
              other words: Hightouch still has a real category, but the buyers it wants are increasingly choosing
              between a specialist layer and a broader suite.
