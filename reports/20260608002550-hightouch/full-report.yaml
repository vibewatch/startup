    title: Investment KPIs
    type: kpi
    description: >-
      Publicly visible underwriting KPIs for Hightouch and the metrics still missing before the valuation can be
      endorsed.
    layout: wide
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV015
      - CV018
      - CV021
      - CV042
    data:
      items:
        - label: Current ARR
          value: $100M
          detail: Public snapshot from April 2026. Good scale, but small relative to a $2.75B mark.
          tone: positive
        - label: Current valuation / ARR
          value: ~27.5x
          detail: Implied by the April 2026 round; far above public martech comparables.
          tone: risk
        - label: Public comp band
          value: ~3.3x-6.5x
          detail: Braze, Klaviyo, HubSpot, and Twilio provide the practical June 2026 benchmark range.
          tone: neutral
        - label: Growth signal
          value: '>100% for 2 years'
          detail: Strong growth is real and is the main reason the current mark cannot be dismissed outright.
          tone: positive
        - label: Gartner status
          value: 2026 CDP Leader
          detail: Independent procurement credibility signal, but not enough by itself to underwrite the valuation.
          tone: positive
        - label: Integration breadth
          value: 300+ tools
          detail: Supports switching value and distribution breadth across marketing and data stacks.
          tone: positive
        - label: Pricing model
          value: Composable / usage-based
          detail: Land-and-expand friendly, but can create cost predictability concerns for customers and investors.
          tone: neutral
        - label: Disclosure gap
          value: High
          detail: NRR, gross margin, burn, concentration, and preference stack remain the key missing variables.
          tone: risk
