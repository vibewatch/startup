      - number: '1.5'
        title: Milestones, partnerships, and adverse market markers
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that kept widening its scope while staying anchored to warehouse
              activation. The early period runs from 2019 founding and YC S19 participation, to the July 2021 Series A,
              to a November 2021 Series B that pushed valuation to $450 million and sharpened the reverse-ETL story. The
              next major turning point was the 2023 Databricks investment, because it both validated the lakehouse
              partnership and showed Hightouch becoming strategically relevant to platform vendors. Product scope
              broadened again when AI Decisioning entered the market in 2024, and the funding story accelerated quickly
              after that: Series C in February 2025, then $100 million ARR and a $2.75 billion Series D in April 2026.
              The most important adverse external marker is not a public Hightouch-specific scandal but peer-set
              compression: Fivetran’s May 2025 agreement to acquire Census and Benn Stancil’s category-collapse critique
              both point to a world where customers may prefer fewer, broader vendors and where Hightouch must keep
              proving it deserves to stay independent.
