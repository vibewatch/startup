  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Hightouch’s public pricing and product surfaces describe a modular software business rather than a single
              fixed SKU. The free entry point is the Reverse ETL Platform, where the pricing page says teams can start
              with up to two active syncs and unlimited destination count. Paid plans are not exposed as transparent
              seat bundles; instead, Hightouch says pricing is composable, usage-based, and free of Monthly Tracked User
              caps, with no caps on sources, destinations, or user seats. The same page also says products can be
              purchased separately, which matters because it implies monetization can expand from basic reverse ETL into
              higher-value Customer Data Platform and AI Decisioning workflows without forcing a full-platform
              rip-and-replace. Third-party comparison pages reinforce that pattern: PostHog characterizes paid Hightouch
              CDP and AI plans as custom-priced usage contracts, while Basedash frames Hightouch as a dedicated
              reverse-ETL vendor that can become expensive at enterprise scale when sync volume and destination count
              grow. Customer proof strengthens the willingness-to-pay case. Hightouch’s customer page and the PetSmart
              case study show the product being used by enterprise marketing teams to drive measurable revenue and
              activation outcomes, which supports a recurring, value-based software model. What remains unknown is the
              realized mix across free conversion, reverse ETL, Customer Studio, AI Decisioning, services, discounts,
              and multi-product enterprise contracts.
