  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and who actually buys Hightouch
        blocks:
          - type: paragraph
            body: >-
              Hightouch’s public customer footprint is broad in industry terms but narrow in workflow terms. The visible
              proof clusters around companies that already run a serious warehouse stack and want marketing, sales, or
              lifecycle teams to act on modeled data without waiting on engineers for every activation. The customers
              page explicitly spans retail and eCommerce, financial services, travel and hospitality, media and
              entertainment, quick service restaurants, healthcare, and B2B SaaS, while individual stories show
              buyer/user patterns that repeat: data teams and marketing operations leaders usually buy, marketers,
              growth teams, sales teams, or CRM operators are the daily users, and the payer is usually an enterprise
              software or growth-technology budget. Independent commentary reinforces the same filter. Integrate.io and
