      - number: '3.3'
        title: Switching costs, distribution power, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Hightouch benefits from a useful kind of non-lock-in: because the warehouse stays the system of record,
              customers are not trapped by a vendor-owned customer database the way they often are with monolithic CDPs.
              That is a real advantage and lowers the deepest storage-layer switching cost. But it does not make the
              category frictionless. What has to be rebuilt is the operational layer: field mappings into CRMs and ad
              platforms, audience logic, suppression rules, identity joins, sync observability, governance policies, and
              marketer muscle memory inside the workflow tool. That makes switching costs meaningful, but mostly
              operational rather than structural. The same dynamic also makes multi-homing easier than in older CDP
              categories. Buyers can keep the warehouse constant while testing Segment audiences, Braze execution,
              Salesforce Data 360 workflows, or internal build scripts in parallel. This is why distribution power
              matters so much. Fivetran can sell activations into an installed ELT base. Salesforce can wrap activation
              into a sales-service-marketing platform. Twilio can package collection, profiles, and journeys. Braze can
              ask why the buyer needs a separate activation layer at all if the engagement tool now owns audiences and
              AI. Hightouch therefore needs workflow adoption and outcome ownership to be sticky, not just architecture
              purity.
            claimRefs:
