            body: >-
              Hightouch's trust and governance story is stronger than its public roadmap transparency. The security docs
              disclose a credible enterprise baseline: SOC 2 Type 2, ISO 27001, HIPAA/GDPR/CCPA support, TLS 1.2+,
              private networking on major clouds, SSO/SCIM, granular RBAC, approval workflows, audit logs, BYO bucket
              support, and region-specific deployment. The status page adds a useful operational signal by openly
              describing maintenance windows and the product functions that pause during them. For a private company,
              that is a reasonably concrete public trust surface.


              The remaining gaps are still material. Reviewed public sources do not publish a public SLA or
              service-credit policy, do not document a full self-hosted or private-control-plane deployment model, and
              do not expose the deeper attestation package a regulated buyer would ultimately request. Public
              documentation depth is also asymmetric: reverse ETL, sync mechanics, warehouse integrations, and security
              are well documented, while the broader agentic-marketing family is marketed more aggressively than it is
              technically explained. The diligence conclusion is therefore positive but qualified: Hightouch looks most
              mature as a governed warehouse-activation platform with expanding AI optimization, not yet as a fully
