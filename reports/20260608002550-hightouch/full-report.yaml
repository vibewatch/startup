              Manohar, and Josh Curl appear across YC, Forbes, TechCrunch, and Business Insider as the founding trio,
              with Gupta and Manohar serving as co-CEOs in recent coverage and Curl serving as CTO. The founders’
              backgrounds matter: Manohar and Curl came from Segment, while Gupta brought machine-learning and investing
