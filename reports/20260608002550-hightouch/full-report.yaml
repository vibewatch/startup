      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat is real but thin-walled. Hightouch has the best public story among the warehouse-native
              independents: it pairs warehouse control with marketer-facing audiences and AI decisioning, and
              independent category analysis explicitly credits the company with chasing the bigger marketing buyer while
              Census stayed closer to analytics engineering. That helps explain why Hightouch can show up as a 2026
              leader while Census disappears inside Fivetran, Tealium slides to challenger, and mParticle falls out of
              the latest leader set. But the adverse evidence is equally strong. Fivetran/Census upgrades the direct
              peer into a more broadly bundled rival. Salesforce Data 360 combines zero-copy data access, Agentforce,
              and native suite distribution. Braze pushes warehouse audiences and AI directly inside the engagement
              platform. Tealium still brings enormous integration and consent breadth. TextQL's category map argues that
              reverse ETL itself is becoming plumbing that platforms absorb. The durable verdict is therefore not that
              Hightouch is losing today; it is that the company must keep proving its marketer control plane, identity
              layer, and AI decisioning are valuable enough that customers will continue paying for an independent layer
              even as bigger suites try to collapse the stack.
