  - id: FV003
    title: Valuation / return range
    type: range
    description: >-
      Exit-value and gross-return ranges for Hightouch across bear, base, and bull outcomes versus the April 2026
      post-money valuation.
    layout: standard
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV031
    data:
      items:
        - label: Bear outcome
          low: 600
          mid: 800
          high: 1000
          displayValue: 0.22x-0.36x vs $2.75B
          detail: ARR stalls near $130-160M and multiples compress to 4x-6x. Severe markdown risk.
          tone: risk
        - label: Base outcome
          low: 1300
          mid: 1600
          high: 1900
          displayValue: 0.47x-0.69x vs $2.75B
          detail: Healthy but normalizing growth still leaves current investors below par.
          tone: risk
        - label: Bull outcome
          low: 2700
          mid: 3150
          high: 3600
          displayValue: 0.98x-1.31x vs $2.75B
          detail: Only the bull case preserves or modestly grows capital at the current mark.
          tone: positive
        - label: Probability-weighted view
          low: 1500
          mid: 1780
          high: 2050
          displayValue: ~0.65x expected value
          detail: Using the bull/base/bear framework, expected value remains below the Series D reference.
          tone: risk
