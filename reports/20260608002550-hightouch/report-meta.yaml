  productSummary: >-
    Hightouch sells a warehouse-native customer data and marketing stack spanning
    Reverse ETL, Customer Studio, Identity Resolution, Hightouch Events, Match
    Booster, and AI Decisioning, with newer agentic-marketing surfaces layered on
    top. The product is designed to let data teams keep governance in Snowflake,
    Databricks, BigQuery, or similar warehouses while marketers and operators build
    audiences, journeys, syncs, and next-best-action workflows across 300+
    downstream tools.
  customerFocus: >-
