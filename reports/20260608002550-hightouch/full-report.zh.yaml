        title: 身份、总部与当前产品面
        blocks:
          - type: paragraph
            body: >-
              Hightouch 最适合被视为一家 2019 年创立于 San Francisco 的私有软件公司：它从反向 ETL 工具扩展成了更宽的客户数据和 AI 平台。公司自有表述里，主页和 About
              页面给出的当下定位最清楚：Hightouch 是一个建在企业现有数据栈之上的可组合 CDP 和智能体营销平台，而不是传统打包式 CDP。这个定位与 YC 档案一致，也与 2025-2026
              年的报道相互印证；这些报道把产品称为可组合 CDP、AI Decisioning 平台，并且越来越像完整的智能体营销层。官方页面还给出私营公司少见的具体规模信号：803 个付费客户、300
              多个集成、同步过数万亿条记录。这些是公司口径，不是审计指标，但与公司的具名客户清单和后续媒体报道相符，证据强度足以让本章成为后续市场、产品和估值分析的标准身份引用。
