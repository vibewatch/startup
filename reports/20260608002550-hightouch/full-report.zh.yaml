      - number: '5.2'
        title: 运营架构、数据仓库执行与数据移动模型
        blocks:
          - type: paragraph
            body: >-
              公开架构足够具体，可以把 Hightouch 承销为以数据仓库为中心的控制平面。模型由表、SQL 或 dbt 资产定义；同步决定目标端、排期、映射、批处理、删除行为和可观测性路径；变更检测则根据同步引擎，发生在
              Hightouch 基础设施中或数据仓库内部。安全文档异常明确地指出，标准 Reverse ETL、Events 和可组合 CDP 工作负载不会在 Hightouch
              内部创建一份独立、长期存在的主客户表副本。相反，平台存储日志、差异状态和部分 AI 产物等运营元数据；企业更偏好的模式则是数据仓库内驻留 CDC，加上客户自有存储桶做存储。


              Databricks 文档让架构更具体。Hightouch 支持 OAuth 或 PAT 认证，可以在批量和交互式 HTTP 路径之间拆分流量，并建议对超过大约 100,000 行的模型使用 Lightning
              引擎。在该模式下，Hightouch 会写入专用的 hightouch_audit 和 hightouch_planner schema，并可与 Unity Catalog 托管存储集成。Identity
              Resolution 延续同一数据仓库优先设计：它把身份图写回客户数据仓库，而不是迫使客户进入供应商托管的画像存储。这是真正的架构差异化，但也让数据仓库权限、模型质量管理和合作平台 API
              成为基础依赖，而不是实现细节。
