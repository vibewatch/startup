        - 索取按产品划分的毛利率、托管成本、AI 推理成本和服务毛利率
      - - CAC / 回本期 / NRR / 流失率
        - null
        - 低
        - GTM 效率和收入耐久性的核心指标仍缺失
        - 索取 CAC、回本期、NRR、总留存、客户标识流失率和销售周期长度
      - - 现金消耗和跑道
