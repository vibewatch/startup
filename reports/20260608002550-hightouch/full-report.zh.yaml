companyProfile:
  summary: >-
    Hightouch 是一家创立于 San Francisco 的私有软件公司，起步于数据仓库原生反向 ETL，之后扩展为更宽的可组合 CDP 和智能体营销平台。公司仍由 Kashish Gupta、Tejas Manohar 和
    Josh Curl 三位创始人带队，围绕反向 ETL、Customer Studio、Identity Resolution 和 AI Decisioning 出售经常性软件模块，并已拿出可见的企业客户牵引力：803
    个付费客户、300+ 个集成，以及 PetSmart、Ramp、Grammarly、Warner Music Group 等具名客户。到 April 2026，公司已达到 $100M ARR，并以 $2.75B 估值完成 $150M
    Series D；但公开记录仍留下留存、利润率、烧钱速度和股权结构表等关键问题。
