  - id: TE003
    title: 技术 / 运营架构表
    description: Publicly visible operating layers rather than hidden internal microservice topology.
    columns:
      - 层 / 组件
      - 作用
      - 依赖
      - 风险
    enumerationScope:
      coverage: partial
      basis: >-
        Hightouch does not publish a full backend system diagram, so this table models the external operating
        architecture buyers actually interact with.
    rows:
      - - 源数据层
        - Snowflake、Databricks 等数据仓库、数据湖和源系统提供权威数据
        - 数据仓库凭证、权限和查询性能
        - 源模型薄弱或访问出错，会立刻拉低产品效果
      - - 建模层
        - 表、SQL 和 dbt 资产决定 Hightouch 能激活什么
        - 数据团队负责模型质量和语义
        - 模型治理差会把错误特征、受众和同步载荷传到下游
      - - 同步编排层
        - 同步任务定义目标端、调度、映射、批处理、删除行为和运行状态
        - 目标端 API、调度设计和 CDC 选择
        - 同步模式或删除行为选错，可能造成重复或漂移
      - - 变更数据捕获层
        - Basic 引擎在 Hightouch 基础设施中做差分；Lightning 在数据仓库中做差分
        - 读写权限、hightouch_audit 和 hightouch_planner 状态，以及存储选择
        - Lightning 配置更复杂；Basic 在超大数据量下可能更慢
      - - 档案 / 受众层
        - Customer Studio 和 Identity Resolution 将数据仓库数据转成可行动的受众和档案
        - 干净的身份输入、营销人员工作流和权限控制
        - 公开材料未提供图谱质量或受众延迟的独立基准数据
      - - 优化层
        - AI Decisioning 智能体优化消息、渠道、时机和抑制决策
        - 事件反馈、已连接的消息工具和明确护栏
        - 表现取决于目标端覆盖和高质量事件数据
      - - 交付层
        - HubSpot、Salesforce Marketing Cloud、Braze、Iterable 和广告平台等下游工具接收数据
        - 合作伙伴 API、应用权限和市场健康度
        - Hightouch 能编排交付，但无法消除下游平台约束
      - - 治理和存储层
        - SSO/SCIM、角色、审批流、审计日志、BYO bucket、私有网络和区域选择共同限定风险
        - 身份提供商配置、云网络和存储策略归属
        - 公开证据对控制项覆盖较好，但买方面向的 SLA 和认证深度较薄
    notes: 架构行描绘外部可见的运营模式，而非 Hightouch 未公开的内部微服务或基础设施组件。
