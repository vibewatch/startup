      - CV031
    data:
      items:
        - label: 悲观结果
          low: 600
          mid: 800
          high: 1000
          displayValue: 0.22x-0.36x vs $2.75B
          detail: ARR 停滞在 $130-160M 附近，倍数压缩至 4x-6x。存在严重减记风险。
          tone: risk
        - label: 基准结果
          low: 1300
          mid: 1600
          high: 1900
          displayValue: 0.47x-0.69x vs $2.75B
          detail: 增长健康但回归常态，当前投资者仍低于面值。
          tone: risk
        - label: 乐观结果
          low: 2700
          mid: 3150
          high: 3600
          displayValue: 0.98x-1.31x vs $2.75B
          detail: 按当前估值，只有乐观情景能保住资本或带来小幅增长。
          tone: positive
        - label: 概率加权视角
          low: 1500
          mid: 1780
          high: 2050
          displayValue: ~0.65x expected value
          detail: 按乐观 / 基准 / 悲观框架看，期望价值仍低于 Series D 参考估值。
          tone: risk
  - id: FV004
    title: 投资 KPI
    type: kpi
    description: Hightouch 公开可见的承销 KPI，以及认可估值前仍缺失的指标。
    layout: wide
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV015
      - CV018
      - CV021
      - CV042
    data:
      items:
        - label: 当前 ARR
          value: $100M
          detail: 2026 年 4 月的公开快照。规模不错，但相对于 $2.75B 估值仍偏小。
          tone: positive
        - label: 当前估值 / ARR
          value: ~27.5x
          detail: 由 2026 年 4 月融资轮隐含；远高于公开营销科技可比公司。
          tone: risk
        - label: 公开可比区间
          value: ~3.3x-6.5x
          detail: Braze、Klaviyo、HubSpot 和 Twilio 提供了 2026 年 6 月的实际基准区间。
          tone: neutral
        - label: 增长信号
          value: '>100% for 2 years'
          detail: 强劲增长真实存在，也是当前估值不能被直接否定的主要原因。
          tone: positive
        - label: Gartner 地位
          value: 2026 CDP Leader
          detail: 独立采购可信度信号，但单靠这一点不足以承销估值。
          tone: positive
        - label: 集成广度
          value: 300+ tools
          detail: 支撑营销和数据栈里的切换价值与分发广度。
          tone: positive
        - label: 定价模式
          value: Composable / usage-based
          detail: 有利于先落地再扩张，但可能让客户和投资者担心成本可预测性。
          tone: neutral
        - label: 披露缺口
          value: High
          detail: NRR、毛利率、烧钱速度、集中度和优先股堆叠仍是关键缺失变量。
          tone: risk
