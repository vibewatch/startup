  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据支持的理由
      - 缓释措施 / 尽调问题
    rows:
      - - 数据仓库原生营销控制平面
        - 平台套件在同一批数据仓库上复刻受众构建和 AI
        - 高
        - Salesforce、Braze、Segment 和 Tealium 现在主打数据仓库访问、受众构建和 AI 的不同组合
        - 索取近期赢单/输单数据，证明套件已安装时 Hightouch 仍能胜出
      - - 独立激活层
        - Fivetran/Census 打包后，直接竞品变成资本更充足的平台
        - 高
        - Census 不再独立，Fivetran 现在把激活与 ELT 和转换一起出售
        - 衡量 2025 年 5 月后相对 Fivetran 的附加销售率和替换率
      - - 低存储锁定
        - 运营切换成本可能比传统 CDP 锁定更容易拆掉
        - 中
        - 客户保留自己的数据仓库，主要重建项是映射、受众逻辑、身份规则和工作流采用
        - 索取证据，证明 Customer Studio 和 AI 工作流能带来扩张和粘性
      - - AI Decisioning 切入口
        - 既有厂商和邻近厂商都在营销自己的 AI 决策或智能体层
        - 高
        - BrazeAI、Agentforce、Segment predictive AI、mParticle Cortex 和 Tealium AI 都在削弱故事的新鲜度
        - 索取 AI Decisioning 客群的附加销售、留存和结果指标
      - - 目的地广度和运营细节
        - 即使 Hightouch 的激活 UX 更干净，既有厂商也可能靠套装广度或集成数量赢单
        - 中
        - Tealium 声称有 1,300+ 个集成，Segment 有 700+ 个，Fivetran 将 700+ 个连接器与 200+ 个激活打包
        - 验证目的地广度是否仍能赢单，还是已经变成标配
      - - 品类领导叙事
        - Reverse ETL 管道能力正在变成会被平台吸收的基础设施
        - 高
        - TextQL 认为到 2026 年 Reverse ETL 将成为标配，独立市场报道也把这个空间放进更大的 AI 和平台决策中
        - 应把 Hightouch 按营销控制平面和 AI 层来承销，而不是同步工具
    notes: 风险清单强调的是会改变续约结果的持久威胁，而不是只列某个供应商下季度就能补上的产品缺口。
