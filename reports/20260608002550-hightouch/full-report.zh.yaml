      - number: '8.4'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >
              没有一家公开可比公司是完美参照，但市场方向仍很清楚。Braze 和 Klaviyo 是营销执行和客户数据变现最接近的公开参照；HubSpot 更宽、更成熟；Twilio 包含通信基础设施和
              Segment，作为客户数据平台基准最不干净，但仍有信息量。四家公司收入倍数都显著低于 Hightouch 当前私有估值。这个差距不能证明本轮错误——私有 AI 胜者可以暂时跑赢公开可比——但它意味着举证责任在
              Hightouch 身上，需要长进估值，而不是由怀疑者解释为什么公开市场漏掉了显而易见的机会。正确的可比结论不是「Hightouch 应该完全按 Braze 交易」，而是「公开基准意味着，Hightouch
              当前估值已经计入一个高溢价战略结果，但该结果尚未被充分披露的经济性验证」。
