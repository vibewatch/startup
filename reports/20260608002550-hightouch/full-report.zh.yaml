        - 索取同期员工数、薪酬支出和按部门划分的每 FTE ARR
      - - Series D 估值 / ARR 倍数
        - 按 $2.75B 估值和 $100M ARR 计算，约 27.5x
        - 中
        - 勾勒投资者在 2026 年 4 月承销了多少增长和毛利耐久性
        - 索取支持本轮定价、留存和毛利假设的董事会材料
      - - 毛利率
        - null
        - 低
