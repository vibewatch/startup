      - number: '2.4'
        title: 增长驱动、采用约束与估值关键点
        blocks:
          - type: paragraph
            body: >-
              官方和独立来源都显示，若干增长驱动具有耐久性。Fortune 和 Mordor 都把实时个性化、第一方数据投入、AI/ML 和全渠道编排视为品类顺风。Mordor 还加入第三方 cookie
              退场、零拷贝经济性，以及 AI 智能体需要统一画像。这些主题与 Hightouch 从反向 ETL 走向可组合 CDP 和 AI Decisioning
              的产品弧线一致。但同一批来源也解释了为什么采用并非无摩擦。隐私监管、客户信任、遗留系统集成复杂度、数据本地化规则和反向 ETL 人才短缺都会拖慢上线。Hightouch 自己的反向 ETL
              解释也强调，激活在运营上比数据仓库 ETL 更难，因为第三方 API 脆弱、回滚选项有限，治理失败还会影响关键业务工具。竞争压力也在增强。Salesforce Data
              360、Tealium、mParticle、RudderStack 和 Segment 都在营销实时激活、AI、身份和数据仓库连接的重叠组合，这意味着 Hightouch
              的架构有差异化，但已不再独一无二。Fivetran 同意收购 Census 后，战略风险进一步上升：整合奖励更宽的套件；Benn Stancil
              的品类坍缩论点则认为，买家越来越会把现有供应商横向拉伸到多个品类，而不是继续为狭窄专家付费。对估值而言，这意味着机会足够大，但买家范围更窄；护城河必须来自工作流执行、治理和营销人员可用性，而不只是“反向
