            body: >-
              公开材料中的持续性证据方向上偏正面，但关键处仍明显缺口。PetSmart 案例研究给出少见的高复用迹象：95% 以上销售关联 Treats Rewards 会员，公司运营 1,000+
              个受众，营销测试带来增量销售提升。Grammarly 称，每周洞察邮件是高留存率的重要原因；Docusign 称，Hightouch 数据是识别扩张机会、降低流失的工作流核心。Fundrise
              明确把更高投资金额描述为提升投资者粘性的因素。这些信号说明客户把产品嵌入重复系统，但所审资料没有披露 NRR、GRR、付费流失、续约率、合同期限或 logo 留存队列。

              独立口碑也没有原始评分数字看起来那么干净。Integrate.io 报告了很强的第三方评分，Slashdot 也收录了一条热情的企业评价，但本轮直接访问 G2 和 Gartner
              评论页都被反爬拦截，当前评论组合无法一手核验。最稳妥的证据结论是：买家似乎认可实施速度、支持和仓库原生灵活性，但公开记录不足以支撑长期留存经济性，也不能证明正面评论在不同客户规模和用例之间分布均匀。
