      - CM044
  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标客户
      - 差异化
      - 相比 Hightouch 的局限
    rows:
      - - Hightouch
        - 数据仓库原生专家
        - 私营成长型公司；覆盖 300+ 工具的激活面和 AI Decisioning 叠加层
        - 数据成熟的营销、生命周期、增长和数据团队
        - 公开信息中最强的数据仓库之上营销人员自助层
        - 捆绑能力弱于大型套件和平台
      - - Fivetran Activations / Census
        - 更宽数据移动平台内的直接同业
        - 700+ 连接器平台；200+ 激活目的地；Census 出售前已有数百家客户
        - 想要单一托管数据移动栈的既有 Fivetran 客户
        - 最接近的直接反向 ETL 替代方案，并带平台捆绑
        - 激活现在嵌在更宽的基于 MAR 的平台经济模型中
      - - RudderStack
        - 低成本数据仓库原生替代方案
        - Free / Starter / Growth / Enterprise；可自托管；最高同步档为 5 分钟
        - 想要控制权和更低 TCO、由数据团队主导的买方
        - 数据仓库原生、可自托管，并明确不是数据孤岛
        - 面向营销人员优先的控制平面弱于 Hightouch
      - - Twilio Segment
        - 打包型 CDP 既有厂商
        - 25,000+ 家公司；700+ 集成；每日同步 400B 行
        - 希望由一个供应商承接采集、身份和旅程的团队
        - 在事件采集、画像和旅程编排上的覆盖最广
        - 数据仓库原生姿态不够纯粹，包装更偏销售驱动
      - - mParticle
        - 混合型 CDP 既有厂商
        - 300+ 集成；每月处理数十亿事件
        - 需要实时能力叠加数据仓库原生规模的消费品牌
        - 混合架构，带无代码受众和下一最佳动作
        - 定价和运营模型不如 Hightouch 透明
      - - Tealium
        - 企业级 CDP 既有厂商
        - 850+ 企业客户；1,300+ 集成
        - 大型受监管企业和跨职能买方群体
        - 同意、身份和集成广度，加上实时激活
        - 增长动能看起来弱于新一代领先者
      - - Salesforce Data 360
        - 平台型既有厂商
        - Agentforce 和更广 Salesforce 云的核心数据引擎
        - 以 Salesforce 为中心的企业
        - 原生分发到销售、服务、营销和 AI 智能体
        - 消耗型定价和对更宽套件的依赖会抬高复杂度
      - - Braze 数据平台
        - 相邻执行层替代方案
        - Braze 互动平台，加上数据仓库受众和 BrazeAI
        - 已以 Braze 执行为中心的生命周期和 CRM 团队
        - 能在互动工具内吸收数据、受众构建和 AI
        - 作为跨技术栈控制平面，中立性不如 Hightouch
      - - 内部自建 / CSV 工作流
        - 现状替代方案
        - 既有数据仓库、脚本和分析师产能
        - 内部数据工程强、用例较窄的场景
        - 没有新增供应商成本，并完全控制边缘逻辑
        - 可观测性脆弱、治理弱，营销人员自助体验差
    notes: 各行混合了直接同业、既有厂商、相邻替代方案和维持现状的内部自建路径，因为买方可以通过很不一样的控制平面完成同一个激活任务。
