        - 中
        - 员工数是最干净的公开烧钱和效率代理指标，但当前数值互相冲突
        - 索取按职能划分的全成本员工数和季度招聘历史
      - - 隐含每付费客户 ARR
        - 用 $100M ARR 和 803 名付费客户计算，约 $125k
        - 中
        - 如果指标时间对齐，说明企业账户价值可观
        - 索取 ACV 中位数、ACV 分布和按客户十分位划分的收入集中度
      - - 隐含每员工 ARR
        - 用 $100M ARR 和 380 名员工计算约 $263k；如果 YC 的 200 人仍是当前数值，则可能约 $500k
        - 低
