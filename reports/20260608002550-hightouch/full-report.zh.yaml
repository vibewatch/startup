      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家地图比市场份额地图更清楚。反复出现的经济买家不是抽象采购“数据基础设施”的通用 CIO，而通常是营销、生命周期、个性化或营销技术负责人；其团队已经依赖数据仓库数据，需要更快激活。PetSmart
              的具名负责人是 Loyalty and Personalized Marketing VP，底层有 Snowflake 和 Databricks 数据基础设施支持。Grammarly
              的用例落在营销技术和付费媒体团队：它们想抑制用户、训练广告算法，并发起个性化生命周期活动，而不想为工单或 CSV 等数周。WHOOP 和 Fundrise
              把买家视角进一步推向生命周期和增长团队；这些团队想要下一最佳动作能力，但不希望员工数线性扩张。跨这些案例看，终端用户常常是营销人员或生命周期运营人员，技术赋能方是数据或分析团队，付款方通常是中心化的营销技术、增长、忠诚度或个性化预算。采用通常始于痛苦的现状：僵硬的打包式
              CDP schema、过期的受众导出、薄弱的跨渠道协同，或无法以 1:1 规模个性化的手工实验。只有当买家看到营销人员可以自助，同时数据治理仍留在数据仓库里，采用才会扩张。
