        - 付费转化率未披露
        - Hightouch 定价页
        - 为小型用例和评估提供清晰落地动作
      - - Hightouch 付费平台计划
        - 按用量定价，不设 MTU 上限，也不限制来源、目的地或用户席位
        - 官方定价理念，不是公开价目表
        - 实际企业起价、超额费用和折扣未披露
        - Hightouch 定价页
        - 收入随用量和部署广度扩张，而不只是席位数
      - - AI Decisioning 和 CDP 模块
        - 可单独购买，也可混入可组合套装
        - 官方打包信号
        - 模块附加销售、打包方式和提价幅度均未公开
        - Hightouch 定价页和 AI 文档
        - 如果企业需求真实，可支撑 Reverse ETL 之外的加售
      - - 外部市场描述
        - PostHog 称付费 CDP 和 AI 计划按用量定制定价
        - 第三方方向性代理指标
        - 不是合同数据库，不应当作经审计定价
        - PostHog 对比
        - 印证市场认为 Hightouch 是企业定制型，而非透明标价 SaaS
      - - 企业 Reverse ETL TCO 代理指标
        - Basedash 称，在企业层级、每月 500k 条记录和 5 个目的地下，Hightouch 或 Census 年费可达 $36k+
        - 仅为第三方基准
        - 供应商排序和实际合同条款仍未经审计
        - Basedash 对比
        - 同步量和目的地广度上升后，价格压力可能快速增大
      - - 客户价值证明
        - PetSmart 案例称，新活动带来 15-25% 的增量销售提升和 150% 的会员激活增长
        - 结果证据，不是标价
        - 没有说明 PetSmart 实际支付多少
        - Hightouch 客户证明
        - 即便没有公开价格披露，强 ROI 叙事也可能支撑企业付费意愿
    notes: 公开定价透明的是结构，不是实际合同价值。第三方价格引用只是低置信度方向性代理，不能误当合同真相。
