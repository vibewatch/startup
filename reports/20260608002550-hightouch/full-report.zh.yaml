      - number: '5.3'
        title: 部署规模、开发者工具与生态触达
        blocks:
          - type: paragraph
            body: >-
              公开部署证据最强的地方，是 Hightouch 把数据仓库模型转化为高量级营销执行。PetSmart 描述了一套横跨 Snowflake、Databricks 和 Salesforce Marketing
              Cloud 的技术栈，每天同步超过 15 million 条记录，拥有超过 1,000 个受众，每年发送超过 four billion 封邮件。Grammarly 描述了一个类似的数据成熟 Databricks
              环境：Hightouch 支持九位数广告预算、每年 five billion 封邮件、动态受众增长和转化 API
              工作流。这些是公司自行制作的客户案例，不是独立性能审计；但合在一起，它们显示产品已在企业规模、多个数据仓库、多个目标端和多种营销活动类型上运行。


              与许多营销 SaaS 同业相比，产品也暴露出更多运营者工具。公开文档和 GitHub 页面显示，Hightouch 支持版本控制配置、dbt 关联模型创建、数据仓库同步日志分析、公开 CLI、Airflow
              provider 和 dbt package。这很重要，因为 Hightouch
              卖的不是纯无代码简单性；它卖的是共享运营模型，让平台团队可以自动化来源、同步和治理，同时让营销人员在其上自助。反面是，Hightouch 的触达高度依赖合作伙伴生态。Snowflake 和 Databricks
              驱动 source 端性能和分发；HubSpot、Braze、Iterable、Salesforce Marketing Cloud 和其他下游 API 则决定激活层能否真正触达业务工作流。
