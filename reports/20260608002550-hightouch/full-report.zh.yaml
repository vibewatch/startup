  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商
      - 公开定价逻辑
      - 合同模式
      - 包含能力
      - 未知项 / 注意事项
      - 影响
    rows:
      - - Hightouch
        - 以目的地为导向、按价值表述，而不是按量定价
        - 销售主导的分层订阅，带附加模块
        - 数据仓库原生激活、Customer Studio 和 AI Decisioning 界面
        - 公开定价细节有限；实际企业折扣未披露
        - 面向营销人员的推销口径是可预测的，但真实预算形态仍需尽调
      - - Fivetran Activations
        - 按月活跃行收费；每个激活有 14 天试用
        - 平台合同可覆盖连接器、转换和激活
        - 反向 ETL、Audience Hub、AI Columns、数据集和更宽的 Fivetran 平台
        - Audience Hub 仅面向 Enterprise；总支出取决于更宽平台使用量
        - 最近的同业现在靠捆绑经济性进入，而不是狭窄单点方案
      - - RudderStack
        - Free / Starter / Growth / Enterprise，基于用量定价且没有 MTU
        - 云订阅或自托管部署
        - 事件流、反向 ETL、身份解析、受众构建器、倾向评分
        - 自托管 TCO 取决于内部工程产能和支持需求
        - 技术买方可选择的可信数据仓库原生替代方案中，承诺门槛最低
      - - Twilio Segment
        - Connections 使用 MTU 定价；CDP 套餐转为联系销售
        - 覆盖 Connections、Unify 和 Engage 的套件合同
        - 事件采集、身份解析、画像、受众、旅程和反向 ETL
        - CDP 和仅反向 ETL 的定价是定制化的，不透明
        - 买方想用一个供应商覆盖多层数据时，更宽套件可能胜出
      - - Salesforce Data 360
        - 消耗积分、存储和高级附加项
        - 更宽的 Salesforce 平台合同
        - 零拷贝数据统一、激活和 Agentforce 上下文引擎
        - 客户可能需要额外产品，也可能以不可预测的速度用完积分
        - Salesforce 已经是行动系统时，会构成严重采购威胁
      - - Tealium
        - 主要靠演示驱动的企业定价
        - 企业 CDP 合同常和合作伙伴、合规、垂直行业套件打包
        - 身份、同意管理、云端激活、实时编排和 AI 上下文路由
        - 公开标价信息很少，实施范围可能很大
        - 隐私、集成广度和监管场景主导时，Tealium 胜算最高
      - - Braze
        - 企业定制打包；公开标价不是数据平台叙事的核心
        - 互动平台合同内嵌数据和 AI 能力
        - 数据仓库受众、实时触发、分群和 BrazeAI
        - 激活作为更广互动工作流的一部分出售，而不是干净的独立层
        - Braze 能把单独的激活预算吃进执行支出里
    notes: 本表比较的是定价逻辑和打包结构，而不是强行把公开细节差异很大的供应商拉到同一张标价表上横比。
