  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价与货币化架构
        blocks:
          - type: paragraph
            body: >-
              Hightouch 的公开定价和产品页面描述的是模块化软件业务，而不是单一固定 SKU。免费入口是 Reverse ETL
              Platform；定价页称，团队可以从最多两个活跃同步和无限目标端数量开始。付费计划没有以透明席位包形式暴露；相反，Hightouch 称定价可组合、基于用量，且没有 Monthly Tracked User
              上限，也不限制来源、目标端或用户席位。同一页面还称产品可以分开购买，这很重要，因为它意味着货币化可以从基础反向 ETL 扩展到更高价值的客户数据平台（CDP）和 AI Decisioning
              工作流，而不强迫客户整个平台替换。第三方对比页强化了这一模式：PostHog 把付费 Hightouch CDP 和 AI 计划描述为按用量定制定价的合同；Basedash 则把 Hightouch
              定位为专注反向 ETL 的供应商，并称同步量和目标端数量在企业规模上升时会变贵。客户验证增强了付费意愿案例。Hightouch 客户页和 PetSmart
              案例显示，企业营销团队用该产品推动可衡量收入和激活结果，支撑经常性、基于价值的软件模型。仍然未知的是，免费转付费、反向 ETL、Customer Studio、AI
              Decisioning、服务、折扣和多产品企业合同之间的实际组合。
