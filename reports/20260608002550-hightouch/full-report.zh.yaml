      - CV031
    notes: 公开证据足以判断融资事件和当前价格敏感性，但不足以在 Series D 估值上承销普通股上行。
    rows:
      - - 总体建议
        - 跟踪 / 当前价格放弃
        - 公司质量真实，但 $2.75B 估值意味着按披露的 $100M ARR 年化口径约 27.5x ARR。
        - 仅在尽调显著提升收入质量，或条款降低有效入场价时重启。
      - - 信心水平
        - 中
        - 轮次事实、ARR 快照、可比公司数据和市场结构都有充分交叉印证；毛利率、NRR、烧钱和股权结构表 细节没有。
        - 如果私下尽调确认顶级留存和有利优先权条款，信心会上升。
      - - 风险评级
        - 高
        - 核心风险是在披露缺口、仓库依赖和品类整合之上叠加价格风险。
        - 不要把当前估值当成低风险成长轮。
      - - 估值立场
        - 相对公开证据偏高
        - 公开营销科技可比公司区间约为 3.3x-6.5x 收入，远低于当前隐含倍数。
        - 假设本轮包含公开来源看不到的战略价值或优先股经济性。
      - - 当前估值支撑
        - 仅凭公开证据无法支撑
        - 公司可能靠增长消化价格，但当前披露无法独立证明。
        - 先拿到私有数据，再把 Series D 视为公允价值。
      - - 入场纪律
        - $1.0-1.5B 有效入场价，或结构化下行保护
        - 该区间仍给公开可比公司之上一定溢价，也给强执行留下空间。
        - 在 $2.75B 价格下，必须有 ratchet 条款、优先权，或者等待。
  - id: TV002
    title: 投资论点 / 反论点表
    description: Core bullish and bearish arguments for Hightouch, plus the diligence gates that would change the recommendation.
    columns:
      - 维度
      - 论点
      - 反论点
      - 什么会改变判断
    claimRefs:
      - CV003
      - CV012
      - CV013
      - CV014
      - CV016
      - CV017
      - CV018
      - CV019
      - CV033
      - CV034
