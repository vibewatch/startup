      - number: '3.3'
        title: 切换成本、分发力量与替代品
        blocks:
          - type: paragraph
            body: >-
              Hightouch 受益于一种有用的非锁定效应：因为数据仓库仍是记录系统，客户不像使用单体 CDP
              时那样被供应商自有客户数据库困住。这是真优势，也降低了最深层存储层切换成本。但它并不让品类无摩擦。真正要重建的是运营层：进入 CRM 和广告平台的字段映射、受众逻辑、抑制规则、身份
              join、同步可观测性、治理政策，以及营销人员在工作流工具里的肌肉记忆。这让切换成本有意义，但主要是运营性的，而不是结构性的。同一动态也让多栖部署比旧 CDP 品类更容易。买家可以保持数据仓库不变，同时并行测试
              Segment 受众、Braze 执行、Salesforce Data 360 工作流或内部构建脚本。这就是分发力量为何如此重要。Fivetran 可以把激活卖进既有 ELT 客户底座。Salesforce
              可以把激活包进销售-服务-营销平台。Twilio 可以打包采集、画像和旅程。Braze 可以反问：如果互动工具现在已经拥有受众和 AI，买家为什么还需要单独的激活层？因此，Hightouch
              需要靠工作流采用和结果归属来形成粘性，而不只是架构纯度。
