        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              情景分析在这里格外重要，因为当前估值几乎不给正常执行波动留空间。牛市情景下，Hightouch 维持 AI 驱动扩张，ARR 到 2028 年复合增长至 $275-325M，企业买家持续投入，并以约 9x-11x
              收入退出。这个情景能让按当前估值进入的投资人保本或小幅增值，但赚不到私募成长投资通常追求的超额倍数。基准情景更可信：增长正常化，ARR 达到约 $190-230M，退出倍数落在 6x-8x
              区间，对应估值明显低于今天这一轮。熊市情景把 AI 变现放缓与品类整合、定价摩擦或整体倍数压缩叠在一起，使 Hightouch
              相比可实现退出显著高估。换句话说，当前估值不是按下行承销，而是按最佳运营动能延续来承销。只靠公开证据给投资建议，这太激进。
