      - number: '7.3'
        title: 伙伴、平台与生态依赖是投资论点变量
        blocks:
          - type: paragraph
            body: >-
              Hightouch 的伙伴网络足以帮助增长，也危险到必须进入投资判断。正面看，Databricks 在 AWS、Google Cloud 和 Azure 上提供 Hightouch 连接指南，Snowflake
              把 Hightouch 列入伙伴网络，Databricks Ventures 也直接投资。这些事实说明分发强、生态相关性高。但它们也说明，Hightouch
              的产品承诺有很大一部分压在自己不控制的交易对手上。仓库提供底层数据、计算、认证和买方入口。Meta 与 Google 掌握自定义受众资格、合法依据预期和名单新鲜度。Hightouch 自身集成与 AI
              Decisioning 材料显示，产品现在通过广告、邮件、SMS 和 Web 端点执行，而这些端点都在第三方平台上。子处理方名单又加了一层，涉及
              AWS、Google、Anthropic、OpenAI、Snowflake 和 Microsoft。最后，品类结构对独立激活供应商也在变差：Fivetran 收购 Census 证明，更宽的数据流转平台已经在内化
              reverse ETL 功能。正确读法不是「伙伴关系很好」，而是「伙伴杠杆和平台依赖现在已经分不开」。
