  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、客户任务与可见模块面
        blocks:
          - type: paragraph
            body: >-
              Hightouch 现在应被定义为数据仓库原生的客户数据与营销运营层，而不只是一个点状反向 ETL 连接器。当前文档主页称，平台帮助团队用数据仓库数据做营销和个性化，同时不制造新的孤岛；它把产品面组织为一个
              Composable CDP 家族，加上更宽的 Agentic Marketing
              Platform。这很重要，因为当前产品承诺覆盖多个不同客户任务：数据团队定义受治理模型，营销人员构建受众和旅程，运营人员把画像和事件同步到下游工具，AI
              决策智能体则在有边界的营销活动规则内优化渠道、内容和时机。


              可见模块地图已经足够宽，“反向 ETL”现在只是更大栈中的一行。Customer Studio 覆盖营销人员自助受众、切分、重叠分析和固定序列旅程。Identity Resolution
              增加确定性和概率性拼接，并写回数据仓库。AI Decisioning 在数据仓库受众和已连接消息系统之上增加自适应智能体。Hightouch Events、Real-Time
              Personalization、Match Booster 以及更新的智能体营销页面进一步扩大范围；不过，公开技术深度在核心激活和治理层上仍远比每个较新的营销界面丰富。
