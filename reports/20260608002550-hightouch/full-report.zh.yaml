  - id: TV005
    title: 论点破裂与终止触发器表
    description: Monitorable thresholds that would break the Hightouch investment case at the current valuation.
    columns:
      - 触发器
      - 阈值
      - 对投资论点的传导
      - 行动含义
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV024
      - CV025
      - CV026
      - CV027
      - CV029
      - CV033
      - CV037
      - CV038
    notes: 这些是决策触发器，不是预测确定性。它们围绕当前公开估值设定；在该估值下，下行容忍度很低。
    rows:
      - - 收入质量不及预期
        - NRR 低于约 115%，或核心企业分群出现重大 logo 流失
        - 支付显著高于公开可比公司的私募溢价倍数这一理由消失。
        - 除非估值大幅重置，否则放弃。
      - - AI 绑定深度不足
        - AI 驱动产品到 2026-2027 年无法继续贡献有意义 ARR
        - 牛情景依赖 AI 把 Hightouch 带出经典 reverse ETL 和 composable CDP。
        - 重新按基准 / 熊框架定价，避开当前价格。
      - - 毛利率或烧钱不达预期
        - 毛利率结构性低于优质软件水平，或烧钱仍然高企
        - 当前高倍数假设其增量经济性接近软件模式。
        - 要求结构化下行保护，或推迟投资。
      - - 品类整合加速
        - 更宽的数据平台吸收 reverse ETL / CDP 功能的速度快过 Hightouch 做出差异化
        - 战略稀缺性和独立退出可选性被压缩。
        - 下调倍数假设，降低估值支撑。
      - - 股权结构表保护条款不利
        - 高级优先权、参与型结构或显著二级出售压力扭曲真实普通股入场价
        - 名义投后估值可能不代表新投资者的公允经济性。
        - 不要按名义价格承销。
      - - IPO 路径仍不透明
        - 到 2027-2028 年仍看不到可信路径，无法达到上市公司披露和耐久性指标
        - 只剩战略出售或重组退出，成交倍数可能更低。
        - 把 IPO 上行视为投机，不作为基准情景。
