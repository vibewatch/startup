      - number: '7.2'
        title: 运营、可靠性与安全风险可控，但仍有实质影响
        blocks:
          - type: paragraph
            body: >-
              运营层面，Hightouch 的风险缓释已经相当成熟，但证据也显示，可靠性不只取决于 Hightouch 自身应用代码。网络与 PrivateLink
              文档展示了严肃的企业级姿态：客户可以通过私有网络路径连接仓库和内部服务，让部分流量避开公共互联网。Databricks 自己的集成指南也强化了这一点：Hightouch 正被用于安全敏感环境，并配合 OAuth
              和服务主体最佳实践。但同一套配置也增加了依赖和实施复杂度。私有网络、仓库权限、伙伴认证和手工集群配置都会制造失效模式；即便 Hightouch
              控制平面本身健康，也可能拖慢上线或打断生产工作流。公开事故证据并不灾难性，但也不轻。IsDown 记录了多次中断，包括 2026 年 5 月短暂的 AWS us-east-1 降级，以及 2026 年 4
              月一次造成下游事件重复的延迟。Hightouch 有官方状态历史，但仍没有给投资人足够深入的 SLA、服务抵扣和事故率基线，无法精确承销可靠性。
