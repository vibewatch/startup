        - 面向受众、旅程和用户画像工作流的付费可组合 CDP 层
        - 模块订阅 / 用量
        - 官方作为可单独购买产品提供；无公开标价
        - 如果在企业账户内附加销售强劲，质量高
        - 索取附加销售率、相对仅 Reverse ETL 客户的 ACV 提升和续约数据
      - - AI Decisioning / 智能体营销计划
        - 基于第一方数据的付费决策和个性化行动层
        - 按用量计费的行动 / 计划合同
        - 官方单独出售；公开来源把 AI 描述为当前增长引擎
        - 潜在价值高，但可变算力成本可能更高
        - 索取 AI Decisioning ARR、毛利率、推理成本和群组留存
      - - 企业安全、可观测性和支持附加项
        - 大型合同中的 SLA、访问控制、上线和专属支持
        - 合同打包
        - 功能公开可见，但定价和服务组合未公开
        - 如果能高效打进企业合同，质量中高
        - 索取服务收入占比、支持毛利和高级功能附加销售率
      - - 专业服务 / 实施
        - 上线、集成、数据建模和激活设置支持
        - 项目或合同服务
        - 公开页面暗示白手套上线，但未披露服务收入
        - 至多中等，因为服务收入不如软件 ARR 持久
        - 索取服务收入占比和服务毛利率
      - - 免费层漏斗
        - Reverse ETL 免费层限制活跃同步数，但目的地数量不限
        - 免费的产品驱动入口
        - 已明确公开；变现取决于付费转化和扩张
        - 战略价值高，但本身不产生收入
        - 索取免费到付费转化率、转化时点和按细分市场划分的升级路径
    notes: 公开证据强在变现架构，弱在收入结构。Hightouch 展示了模块地图和计费理念，但没有披露实际合同经济性。
