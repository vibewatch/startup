      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Hightouch 最可信的扩张路径，是从 reverse ETL 走向更宽的激活、自助受众构建和 AI Decisioning。公司材料明确把 AI Decisioning
              定位在复购、交叉销售、赢回和降低流失等用例；客户故事也显示这条动作已经落地：Fundrise、WHOOP、PetSmart 和 Salomon 都是在最初的仓库激活层跑通后，再使用 AI
              式个性化或强化学习工作流。Docusign、CircleCI 和 Ramp 也显示了跨职能扩张，产品从营销延伸到销售运营、产品合格线索路由、流失预测、承保和数据可观测性。

              主要风险在于，扩张仍依赖狭窄客户画像和集中生态。CDP.com 与 Benn Stancil 的独立批评都认为，仓库原生激活带着不小的工程税，Snowflake 和 Databricks
              等仓库厂商最终可能把更多功能内化。战略伙伴证据有助于分发，但如果少数仓库生态成为 Hightouch
              最佳客户的守门人，集中度风险也会更尖锐。公开资料也没有披露头部客户集中度、头部垂直行业集中度，或续约对少数大型零售与 SaaS
              账户的依赖。因此本章底线是「落地再扩张的产品拉力清晰」，不是「持续性已完全去风险化」。
