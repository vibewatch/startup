            body: >
              公开资料支持这轮融资存在，但不支持它对新投资人一定公平。按 2026 年 4 月披露的 $100M ARR 快照，$2.75B Series D 估值约等于 27.5x ARR。这远高于 2026 年 6 月公开
              martech 基准：Braze 和 Klaviyo 约 3.5x 收入，HubSpot 约 3.3x，Twilio 约 6.5x。Hightouch 应该比这些公司享受一定溢价，因为增长更快、AI
              叙事更新，仓库原生位置也能在数据成熟账户中创造强切换价值。即便如此，仅凭公开证据，更接近能支撑一个高溢价私募成长框架，而不是当前轮次估值。纪律严格的外部投资人应把 $2.75B
              视作战略性后期融资参照，而非独立证明的公允价值底部。若要从放弃转为进入，尽调需要证明收入已经明显高于公开 $100M run rate，NRR 和利润率足以支撑两位数、长久期倍数，cap table
