  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品集合
        blocks:
          - type: paragraph
            body: >-
              Hightouch 应按数据仓库原生客户数据激活平台来承销；它现在横跨四个重叠层：反向 ETL、可组合 CDP、身份解析和 AI 决策。官方页面已经不再把公司描述为单一反向 ETL
              工具。主页和定价页把它定位为面向营销、广告、数据和运营人员的客户数据与 AI 平台；产品页则把 Customer Studio、Identity Resolution、Reverse ETL、Hightouch
              Events 和 AI Decisioning
              打包成相邻模块，而不是不同业务。因此，纳入支出是把第一方数据仓库数据转化为受众、客户画像、旅程、广告抑制、转化信号、下一最佳动作决策，并受治理地同步到下游工具的软件预算。排除支出包括上游采集、数据仓库存储与计算本身、媒体库存，以及
              Salesforce Marketing Cloud 或 Iterable 等系统承载的自有消息投递。这个边界很重要，因为替代品集合很宽：传统打包式 CDP、手工 CSV
              导出、点对点自动化、RudderStack 等数据仓库原生挑战者、被收购后的 Census/Fivetran Activations，以及 Salesforce Data
              360、Segment、mParticle、Tealium 等大型套件。市场真实存在，但买家强调的是数据激活、customer 360 还是智能体营销，会决定市场标签。
