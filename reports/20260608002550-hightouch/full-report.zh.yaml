      - number: '2.2'
        title: 规模口径：大赛道、估算矛盾，且没有干净的公开 SAM
        blocks:
          - type: paragraph
            body: >-
              公开规模证据支持一个有意义的市场，但不能拼出干净的 Hightouch 专属 TAM/SAM/SOM 栈。Fortune Business Insights 估计全球 CDP 市场在 2025 年为 $3.28
              billion、2026 年为 $4.07 billion，并有望到 2034 年达到 $17.03 billion。Mordor Intelligence 用不同方法估计同一市场在 2026 年为 $4.58
              billion、2031 年为 $13.14 billion。这些估计在增长方向上相互一致，在基数上并不一致，正因如此，本章保留区间，而不是给单点数字。更宽的 martech
              环境更大，但作为直接承销口径不太有用：ChiefMartec 统计 2026 年有 15,505 个 martech 产品，并称市场净增长基本持平，底层流失很强。对 Hightouch
              而言，部署规模代理指标往往比抽象 TAM 更有决策价值。PetSmart 已经每天从基于数据仓库的受众同步 15 million-plus 条记录，并每年发送超过 four billion
              封邮件；Grammarly 则在同一数据仓库原生模型上运行九位数广告预算和数十亿封生命周期邮件。结论是，Hightouch 销售进入的是一个庞大且增长中的 CDP/激活机会，但可观察 SAM
              更窄：那些已经信任数据仓库作为运营记录系统，并愿意在其上继续为激活、身份和 AI 付费的数据成熟企业。
