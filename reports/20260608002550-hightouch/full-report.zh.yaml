  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 受众激活合规
        - 伙伴政策或运营商行动
        - 任何因同意、退出或合法依据失败而导致的 Meta、Google 或消息服务商暂停
        - 暂停继续推进判断，直到根因、客户影响和补救控制经过独立审阅
      - - AI 透明度和内容治理
        - 监管方或客户质疑 AI 主导的营销输出
        - 任何可信投诉、法律通知或内部尽调发现，只要显示受监管市场存在未标注 AI 互动或合成内容误用
        - 从押注增长上行转为先要求治理证据，再支持估值
      - - 数据仓库与云依赖
        - 云相关事件或认证故障反复出现
        - 短期内出现多起重大交付事件，或有证据显示，单一仓库生态主导订单或生产 ARR
        - 把业务判断从“定义平台”下调为“对伙伴更脆弱”，并收紧价格纪律
      - - 定价可预测性与客户 ROI
        - 用量意外费用上升或实施拖慢
        - 证据显示，定价或技术复杂度跑在实际价值前面，导致客户预算超支、上线延后或模块采用不足
        - 在实际 ACV 与续约数据证明前，把自助和扩张假设视为受损
      - - 增长耐久性不透明
        - 私下尽调无法补齐关键披露缺口
        - 管理层拿不出可信的集中度、NRR、SLA、事故纪律、毛利率和烧钱指标
        - 不要把当前估值承销为耐久增长基础设施
      - - 支持与执行带宽
        - 支持负荷增速快过产品范围扩张
        - 客户访谈或尽调材料显示，入职质量下滑、RCA 循环变慢，或 AI 部署高度依赖支持
        - 在经营杠杆得到证明前，假设利润率承压、流失风险更高
    notes: 这些阈值是投资监控规则，并非公司披露目标；它们把保留证据转成实际可用的论点破裂事件。
