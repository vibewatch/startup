  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 机制
      - 计费单位
      - 当前数值或状态
      - 质量
      - 尽调问题
    rows:
      - - Reverse ETL 平台
        - 按用量计费的经常性软件，以可组合模块出售
        - 活跃同步 / 用量
        - 官方定价含免费入门层；付费价格按用量定制
