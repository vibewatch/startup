  - id: TM005
    title: 规模测算 / 采用矛盾与尽调缺口表
    columns:
      - 缺口 / 矛盾
      - 当前公开状态
      - 重要性
      - 具体尽调路径
    rows:
      - - 2026 年 CDP 市场规模
        - Fortune 称 2026 年为 $4.07B；Mordor 称 2026 年为 $4.58B。
        - 即便还没做 Hightouch 专属收窄，基准规模假设也会显著改变 TAM 和增长敏感性。
        - 要求管理层提供内部 TAM 框架，以及董事会材料中使用的精确市场定义桥接。
      - - 区域集中度
        - Fortune 给出的北美 2025 年份额为 59.6%；Mordor 为 47.32%。
        - 影响对地域集中度、扩张跑道和关键买方的假设。
        - 要求披露当前按区域拆分的收入结构和按地域拆分的销售管线结构。
      - - 品类标签
        - 官方表述横跨反向 ETL、可组合 CDP 和智能体营销；外部评论仍常把公司视作激活中间件。
        - 估值和竞争集合会随买方采购时实际使用的标签而变化。
        - 要求按细分市场披露当前定位、赢单 / 输单原因，以及按产品线拆分的收入或销售管线。
      - - 架构独特性
        - Hightouch 称数据仓库原生和零拷贝是差异点，但 Salesforce、RudderStack、Tealium 和 mParticle 现在也在宣传重叠主张。
        - 如果架构正在变成入场筹码，护城河就必须来自工作流、治理和 GTM 执行。
        - 要求披露相对数据仓库连接型对手的对比赢率，并证明留存或扩张有差异化。
      - - Hightouch 专属 SAM / SOM
        - 保留的公开来源没有单独切出数据仓库成熟型激活子市场，也没有给出 Hightouch 份额上限。
        - 没有 SAM/SOM，公开估值工作容易制造虚假精确。
        - 要求披露细分市场数量、按细分市场拆分的 ACV，以及管理层按买方类别设定的份额假设。
    notes: 本表保留矛盾和未解决的市场模型输入，而不是强行给出虚假精确。
