    notes: 支持 Hightouch 的最强理由是经营动能；反对投资的最强理由是大部分上行可能已经计入价格。
    rows:
      - - AI 驱动增长
        - Hightouch 在推出 AI 产品后约 20 个月内达到 $100M ARR，并新增 $70M ARR。
        - AI 浪潮刚开始，可能呈周期性；大平台复制起来也可能比当前热情暗示的更容易。
        - 展示 2026-2027 年 ARR 持续增长，AI 绑定率稳定、流失率低。
      - - 企业级可信度
        - Gartner 2026 CDP 领导者地位、300+ 集成和可见企业 logo 支撑品类领导力。
        - 领导者地位提高采购可信度，但单凭这一点无法证明 27.5x ARR 估值合理。
        - 确认领导者位置能转化为更高赢率、更大 ACV 和更快扩张。
      - - 客户证明
        - 客户案例显示，忠诚会员规模超过 70M、指标有双位数提升，零售、金融科技和媒体都有具名品牌。
        - 多数证据由供应商制作，可能夸大可复制 ROI。
        - 索要前 20 大客户分群数据、合同年限、logo 流失和扩张历史。
      - - 战略背书
        - Goldman、Bain、Databricks Ventures、YC 和 TD7 降低融资风险，并扩大生态相关性。
        - 战略赞助可能抬高本轮价格，却不改善新投资者的回报潜力。
        - 厘清战略投资者是否拿到会扭曲账面估值的经济条款或访问权。
      - - 市场结构
        - 仓库原生与代理式定位可能让 Hightouch 成为战略平台资产。
        - Fivetran 收购 Census 和品类塌缩评论显示，市场可能先围绕更宽的技术栈整合，然后 Hightouch 才拿到完整独立上行。
        - 证明即便 reverse ETL 与 CDP 品类继续合并，Hightouch 仍能保持差异化。
