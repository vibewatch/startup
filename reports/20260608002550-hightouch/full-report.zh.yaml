              D。这些数字很强，但也压窄了容错空间。Y Combinator 仍列示团队规模为 200 人，说明公开员工数口径在漂移；同一时间，Hightouch 正从 reverse ETL 扩张到代理式营销、多渠道执行和
              AI
              驱动内容编排。独立评论证据也指向同一方向：支持很强，但产品仍假设客户已有成熟仓库栈，规模扩大后定价可能变得不可预测，非技术团队仍依赖技术模型构建者。公开资料也没有披露投资人做下行情景最需要的变量——客户集中度、续约质量、毛利率、烧钱情况或量化公开
