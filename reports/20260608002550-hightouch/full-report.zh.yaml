  - id: FV001
    title: 推荐逻辑
    type: flow
    description: 从运营证据和市场结构通往最终投资建议的决策路径。
    layout: wide
    claimRefs:
      - CV003
      - CV005
      - CV013
      - CV018
      - CV021
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV040
    data:
      nodes:
        - label: Hightouch 投资决策
          detail: 先看 2026 年 4 月 Series D 轮估值、已披露的 $100M ARR 快照，再判断公开证据是否既支撑公司质量，也支撑价格。
          tone: neutral
        - label: 关口 1：运营证据
          detail: $100M ARR、连续两年 >100% 增长、Gartner 领导者地位、300+ 集成和可见企业客户标识，都通过质量筛查。
          tone: positive
        - label: 关口 2：价格测试
          detail: 当前估值隐含约 27.5x ARR，而公开营销科技可比公司的倍数约为 3.3x-6.5x。公开证据没有通过价格筛查。
          tone: risk
        - label: 关口 3：披露测试
          detail: NRR、毛利率、烧钱速度、集中度和优先股堆叠均未公开披露。证据还不足以完整支撑估值判断。
          tone: risk
        - label: 有条件的上行情景
          detail: 如果尽调证明收入质量强得多，或有效入场估值降到 $1.0-1.5B 区间，公司就具备可投性。
          tone: neutral
        - label: 观察 / 按当前价格放弃
          detail: 在 2026 年 4 月的名义估值下，当前公开证据支持欣赏这家公司，而不是买入。
          tone: risk
      edges:
        - from: Hightouch investment decision
          to: 'Gate 1: Operating proof'
          label: 评估公司质量
        - from: 'Gate 1: Operating proof'
          to: 'Gate 2: Price test'
          label: 质量过关
        - from: 'Gate 2: Price test'
          to: 'Gate 3: Disclosure test'
          label: 价格仍然激进
        - from: 'Gate 3: Disclosure test'
          to: TRACK / PASS ON CURRENT PRICE
          label: 如果关键经济指标仍不透明
        - from: 'Gate 3: Disclosure test'
          to: Conditional upside path
          label: 如果尽调上调基本面判断
        - from: Conditional upside path
          to: TRACK / PASS ON CURRENT PRICE
          label: 直到条款或证据改善
