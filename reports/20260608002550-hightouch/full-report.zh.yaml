            body: >-
              公开来源更多揭示 Hightouch 成本基础的形态，而不是实际利润率。最有用的结构线索来自架构：Hightouch 安全页称，平台直接连接客户数据仓库，并且从不存储客户数据。与维护大型供应商托管客户数据库的传统
              CDP 相比，这种数据仓库原生姿态应当降低 Hightouch 自身存储负担，也可能让毛利率质量优于更重存储的架构。但同一公开记录也指向仍可能重要的可变成本驱动。定价页按用量收费；AI Decisioning
              文档称系统在单个用户层面自动化营销活动决策，并使用强化学习；外部反向 ETL 分析则强调数据仓库计算和下游 API 限额在规模化时是真实成本组成。换句话说，Hightouch
              可能是用控制平面软件成本、支持和安全开销、数据仓库查询编排、目标端 API 消耗，以及随着智能体工作流扩张而上升的 AI 推理或内容生成成本，替代了重存储经济性。客户 ROI
              证据支持定价权，但没有揭示服务交付毛利率。因此，核心尽调障碍不是 Hightouch 有没有成本驱动——显然有——而是这些成本如何分布在基础设施、AI、支持、服务和销售之间，以及当 AI Decisioning
              成为更大收入贡献项时，毛利率是否仍然强劲。
