      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Hightouch 看起来有战略相关性，但公开证据还不足以说明它已经准备好 IPO。公司具备让买家注意的要素：快速增长、当前 AI 叙事、企业
              logo、仓库与渠道集成，以及投资人和生态伙伴的深度支持。公开证据缺的是决定后期价格能否持续的变量：留存质量、毛利率结构、烧钱效率、客户集中度、优先股堆栈，以及二级交易或清算动态。这些缺失输入比产品演示质量更重要。今天最可能的退出，是卖给更宽的数据、云或
              martech 平台；做后期资本重组；或者等更深披露后再推迟 IPO。投资人不应把下一步框定为「买不买
              Hightouch」。更好的问题是：「哪些具体证据能把一家很好但处在昂贵战略轮里的公司，转化成风险调整后可投的入口？」在这些尽调问题得到回答前，价格纪律应压过热情。
