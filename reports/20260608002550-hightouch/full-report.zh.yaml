  - id: TE004
    title: 信任 / 质量 / 合规表
    description: Publicly disclosed trust controls and the main diligence gaps that remain open.
    columns:
      - 控制项 / 认证
      - 状态
      - 范围
      - 缺口
    enumerationScope:
      coverage: partial
      basis: >-
        Table captures the key public controls visible in product, docs, and trust-adjacent sources; it is not a
        substitute for NDA diligence materials.
    rows:
      - - 最小化客户数据存储模型
        - 公开声明
        - 标准反向 ETL、Events 和可组合 CDP 工作负载避免长期保存主表副本
        - AI 产物、日志和 CDC 状态仍会存在，需要精确审阅保留期限
      - - BYO bucket 和区域部署
        - 公开声明
        - 客户控制的存储，并支持在选定区域的 AWS、GCP 或 Azure 部署
        - 公开文档未描述完整自托管或私有控制平面运行
      - - 私有网络和 TLS 1.2+
        - 公开声明
        - 通过 PrivateLink / PSC / Azure Private Link 连接数据仓库和存储，并加密传输
        - 公开文档未发布覆盖每种部署模式的详细网络架构矩阵
      - - SSO、SCIM、RBAC、审批流、审计日志
        - 公开声明
        - 组织 / 工作区治理和变更控制
        - 买方采购仍需要精确角色矩阵和审计保留政策
      - - SOC 2 Type 2
        - 公开声明
        - 核心企业安全保证
        - 报告范围和例外项需经授权获取，不能公开下载
      - - ISO 27001
        - 公开声明
        - 额外正式安全认证
        - 已审阅页面未完整披露公开证书细节和控制项映射
      - - HIPAA、GDPR 和 CCPA 支持
        - 公开声明
        - 企业客户处理受监管数据时的合规姿态
        - 公开来源未提供按功能拆分的子处理方或数据驻留矩阵
      - - 状态页透明度
        - 公开可见
        - 影响应用、API、事件同步和实时受众评估的维护与事故沟通
        - 状态界面没有配套公开 SLA 或服务抵扣政策
    notes: 信任行结合产品控制披露和运营信号，不应替代 NDA 尽调资料包。
