  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与法律风险是首要公开风险类别
        blocks:
          - type: paragraph
            body: >-
              Hightouch 公开风险中严重度最高的，已经不再是简单的 reverse ETL 可靠性，而是营销 AI、受众激活、消息触达和第三方数据丰富共同撑大的法律暴露面。公司 2026
              年法律文件组合把这一点说得很清楚。隐私政策现在承认，广告伙伴共享在某些隐私法下可能构成出售；平台隐私通知则称，Match Booster
              使用可信第三方数据提供商丰富一方数据，并存储部分提供商数据以改善匹配。DPA 方向上成熟，但也确认了真实暴露：客户仍是控制者，Hightouch 是处理者，子处理方可在较短通知窗口后新增，客户数据也可能流向
              Hightouch 或其子处理方运营的任何地点。外部规则也在同步收紧。Meta 和 Google 的受众产品要求合法依据、退出处理和名单新鲜度纪律；EU AI Act 与 FTC AI 执法则抬高了披露和非欺骗性
              AI 营销的门槛。本轮没有发现公司特定执法，但公开证据仍支持高严重度合规判断，因为 Hightouch 现在已经直接嵌入受监管的定向与消息工作流。
