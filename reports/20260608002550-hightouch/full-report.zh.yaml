  - id: TV001
    title: 建议摘要表
    description: >-
      Summary recommendation, confidence, risk rating, valuation stance, and entry discipline for Hightouch as of June
      2026.
    columns:
      - 维度
      - 评估
      - 依据
      - 决策含义
    claimRefs:
      - CV001
      - CV003
      - CV005
