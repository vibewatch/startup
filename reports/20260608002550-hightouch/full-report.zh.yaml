        - 将建模后的仓库数据同步到 CRM、广告、生命周期、支持、产品、财务和运营工具
        - 一手数据摄取、仓库存储 / 计算，以及自有投放渠道本身
        - 营销、生命周期、RevOps、产品运营和数据团队
