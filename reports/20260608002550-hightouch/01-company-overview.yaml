company:
  name: Hightouch
chapter:
  number: 1
  title: Company Overview
  summary: Hightouch is a San Francisco-founded, YC-backed private software company that has evolved from reverse ETL into
    a composable CDP and agentic marketing platform. Public evidence supports a July 2021 Series A, a November 2021 $40M Series
    B, a 2023 Databricks-linked strategic financing, an $80M Series C at $1.2B in February 2025, and a $150M Series D at $2.75B
    in April 2026. Current scale signals include 803 paying customers, TechCrunch-reported $100M ARR, and named enterprise
    references, while key diligence gaps remain around full board composition, exact headcount, and complete capital-structure
    disclosure.
sections:
- id: identity-product-scope
  title: Identity, headquarters, and current product surface
  body: 'Hightouch is best treated as a private San Francisco software company founded in 2019 that has expanded from a reverse-ETL
    utility into a broader customer-data and AI platform. The cleanest current company-owned framing comes from the homepage
    and About page, which position Hightouch as a composable CDP and agentic marketing platform built on top of an enterprise’s
    existing data stack rather than as a legacy packaged CDP. That framing lines up with the YC profile and with 2025-2026
    coverage that describes the product as a composable CDP, AI Decisioning platform, and increasingly a full agentic marketing
    layer. Official surfaces also give unusually concrete scale signals for a private company: 803 paying customers, 300-plus
    integrations, and trillions of records synced. Those are company claims, not audited metrics, but they are consistent
    with the company’s named-customer list and later press coverage, which is strong enough to make this chapter the canonical
    identity reference for later market, product, and valuation work.'
  claimRefs:
