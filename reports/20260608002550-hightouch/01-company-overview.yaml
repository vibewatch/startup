- id: founders-leadership-governance
  title: Founders, leadership bench, and governance visibility
  body: 'Public founder attribution is consistent even if the broader executive bench is not. Kashish Gupta, Tejas Manohar,
    and Josh Curl appear across YC, Forbes, TechCrunch, and Business Insider as the founding trio, with Gupta and Manohar
    serving as co-CEOs in recent coverage and Curl serving as CTO. The founders’ backgrounds matter: Manohar and Curl came
    from Segment, while Gupta brought machine-learning and investing exposure, which helps explain why Hightouch attacked
    the legacy-CDP pain point from a warehouse-first angle and later moved aggressively into AI decisioning. Governance visibility
    is thinner. TechCrunch reported that Sapphire Ventures partner Rajeev Dham joined the board at Series C, but reviewed
    public sources did not provide a full board roster, observer list, or rights summary. That leaves Hightouch looking founder-led
    and founder-dependent in public, with governance quality still something that would need direct diligence materials rather
    than open-web inference.'
