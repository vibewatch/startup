  evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A current board roster, observer list, and voting-rights summary for Hightouch.
    whyItMatters: Board composition and control rights determine founder dependence, investor leverage, and escalation pathways.
    diligencePath: Request the current board deck appendix, cap-table governance schedule, and board/observer list from management.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: A full financing ledger showing seed detail, debt, secondaries, and exact ownership by round.
    whyItMatters: Public announcements establish headline rounds, but they do not reveal dilution, debt obligations, or whether
      the 2023 financing was fully incremental.
    diligencePath: Request the cap table, financing timeline, debt schedule, and any tender or secondary documentation.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-footprint
    missingEvidence: A current employee count with geography split and legal-entity footprint.
    whyItMatters: Headcount and location mix are core efficiency and compliance inputs, but current public signals conflict
      and do not disclose the broader footprint.
    diligencePath: Request an HR snapshot showing full-time employees, contractors, office/legal entities, and regional distribution.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing-contracts
    missingEvidence: Published enterprise pricing bands, discount policy, and average contract size by product module.
    whyItMatters: The company talks about transparent or value-based pricing, but valuation work still needs real contract
      economics and module attach rates.
    diligencePath: Request current pricing sheets, average deal size by segment, and module-level attach/expansion data.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
    - TO005
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: An internal milestone ledger covering private product releases, governance actions, and any regulatory
      milestones not publicly announced.
    whyItMatters: The public chronology is strong on financing and positioning shifts but weaker on private governance and
      internal product milestones.
    diligencePath: Ask management for the company timeline used in board or annual planning materials and reconcile it against
      the public chronology.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TO004
