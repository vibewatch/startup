- id: TO005
  title: Public disclosure and diligence gaps table
  columns:
  - Missing item
  - Current public evidence
  - Why it matters
  - Exact diligence path
  rows:
  - - Full board roster and governance rights
    - One public board seat is visible, but no complete board or observer list was found.
    - Needed to assess founder control, investor leverage, and escalation paths.
    - Request the current board list, observer rights, voting agreements, and committee structure.
  - - Complete capital structure
    - Public round headlines are recoverable, but debt, secondaries, and ownership percentages are not.
    - Capital structure affects dilution, downside protection, and later valuation sensitivity.
    - Request the cap table, debt schedule, and any tender or secondary documentation.
  - - Current headcount and geography split
    - YC shows 200 people while TechCrunch reported approximately 380 in April 2026.
    - Headcount is a core efficiency metric and a proxy for operating scope and burn.
    - Request a current HR snapshot with full-time, contractor, and regional breakdowns.
  - - Enterprise pricing and contract bands
    - Public pages discuss transparent or value-based pricing without publishing enterprise contract levels.
    - Needed to test monetization quality, attach rates, and revenue durability.
    - Request pricing sheets, median ACV, module attach rates, and recent renewal metrics.
  - - Legal-entity and office footprint
    - San Francisco headquarters is public, but the broader footprint is not.
    - Entity structure and geography matter for compliance, tax, and hiring assumptions.
    - Request legal-entity list, office footprint, and employee distribution by region.
  notes: This table intentionally captures what the open web still does not resolve so later chapters do not overstate precision.
