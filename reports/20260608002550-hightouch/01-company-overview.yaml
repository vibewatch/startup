- id: capital-formation-and-stakeholders
  title: Capital formation, valuation step-up, and stakeholder map
  body: The financing record is now strong enough to anchor later valuation analysis. Hightouch publicly announced a $12.1
    million Series A in July 2021 and a $150 million Series D in April 2026, while independent coverage supports a $40 million
    Series B at a $450 million valuation in November 2021 and an $80 million Series C at a $1.2 billion valuation in February
    2025. A separate 2023 strategic financing surfaced through Databricks-related materials, which tied Databricks Ventures
    to Hightouch’s recent $38 million round and deepened the product partnership around the lakehouse ecosystem. Using only
    the amounts clearly recoverable from reviewed sources implies at least $322.2 million of disclosed capital by 2026, but
    that is still not a full cap-table view because public materials do not disclose debt, secondaries, or precise ownership
    by round. The most important current price setter is the April 2026 Series D, which lifted Hightouch’s valuation to $2.75
    billion and more than doubled the February 2025 mark.
