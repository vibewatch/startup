- id: operating-metrics-and-disclosure-limits
  title: Public operating metrics, business model, and disclosure limits
  body: 'Hightouch discloses enough to show real commercial traction, but not enough to remove underwriting gaps. The strongest
    current scale markers are company-reported paying customers, official claims about 300-plus integrations, and TechCrunch’s
    April 2026 report that the business had reached $100 million in ARR. That same article pegged headcount at roughly 380
    people, but YC’s 2026 profile still listed the team at 200, so headcount should be treated as a conflicting public range
    rather than a settled KPI. The business model is much clearer than the exact economics: Hightouch is selling enterprise
    software modules around data activation, composable CDP, and AI-driven campaign optimization, not advertising inventory
    or agency labor. Pricing pages and comparison pages talk about transparent or value-based pricing, but they stop short
    of publishing enterprise contract bands, attach rates, or expansion metrics. Later valuation work should therefore treat
    ARR as supportable, customer count as company-reported, and headcount, pricing, and capital structure as open diligence
    items.'
