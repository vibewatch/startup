callouts:
- calloutType: insight
  title: Scale is real, but some of the cleanest numbers are still point estimates or company claims
  body: 'By April 2026, Hightouch had a credible public scale narrative: a $2.75B valuation, TechCrunch-reported $100M ARR,
    and an official claim of 803 paying customers. The remaining issue is not whether the company has scale, but which operating
    metrics are sufficiently corroborated for underwriting without management materials.'
  claimRefs:
  - CO010
  - CO030
  - CO035
  - CO058
- calloutType: risk
  title: Peer consolidation raises the strategic bar for staying independent
  body: Fivetran’s agreement to buy Census and the broader category-collapse critique both suggest that warehouse-activation
    buyers may increasingly favor broader suites over narrow category leaders. Hightouch’s response has been to widen into
    composable CDP and agentic marketing, which raises both opportunity and execution risk.
  claimRefs:
  - CO039
  - CO046
  - CO047
  - CO048
- calloutType: risk
  title: Founder concentration remains a live diligence issue
  body: The public record is still dominated by the founding trio for product vision, technical architecture, and company
    narrative. That concentration is not a flaw by itself, but it does mean later diligence should test succession depth,
    delegated operating ownership, and governance independence.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO007
  - CO009
