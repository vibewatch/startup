  evidenceGaps:
    - type: missing-source
      severity: material
      topic: geography mix
      missingEvidence: Company-disclosed customer mix by geography, industry, and customer tier.
      whyItMatters: >-
        The chapter can only cite a third-party estimate for regional mix, which is not enough to
        underwrite regional concentration or expansion depth.
      diligencePath: Ask management for customer count, ARR, and gross retention by region and vertical.
      relatedQuestionRefs:
        - QU005
      relatedTableRefs:
        - TU001
        - TU002
    - type: access-blocked
      severity: minor
      topic: review verification
      missingEvidence: Direct access to current G2 and Gartner review pages or exported review evidence.
      whyItMatters: >-
        Secondary review roundups are directionally helpful, but they do not let diligence verify
        current review recency, enterprise mix, or complaint clustering firsthand.
      diligencePath: Obtain authenticated screenshots or exported review reports from management or a licensed analyst seat.
      relatedQuestionRefs:
        - QU016
      relatedTableRefs:
        - TU004
        - TU006
    - type: private-evidence-only
      severity: material
      topic: retention economics
      missingEvidence: NRR, GRR, paid churn, logo retention, renewal timing, and contract length by segment.
      whyItMatters: >-
        Public proof shows adoption and workflow value, but not whether customers renew, expand,
        or churn at attractive rates.
      diligencePath: Request cohort retention tables, renewal calendars, and churn drivers for the last eight quarters.
      relatedQuestionRefs:
        - QU018
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: customer concentration
      missingEvidence: Top-customer ARR, top-10 customer share, and vertical concentration by revenue.
      whyItMatters: >-
        Large public logos can create a false sense of diversification if a handful of customers or
        one warehouse-aligned vertical account for a disproportionate share of revenue.
      diligencePath: Ask for customer concentration, ARR by top 10 accounts, and revenue by vertical and warehouse ecosystem.
      relatedQuestionRefs:
        - QU019
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: material
      topic: failed deployments
      missingEvidence: Independent documentation of churned accounts, failed implementations, or large procurement losses.
      whyItMatters: >-
        The current public record is curated toward success stories and review summaries, which can
        overstate durability and hide implementation friction.
      diligencePath: Review churned-account postmortems, loss analyses, and support escalations with named examples.
      relatedQuestionRefs:
        - QU026
      relatedTableRefs:
        - TU006
    - type: enumeration-incomplete
      severity: material
      topic: TU003 named customer proof coverage
      missingEvidence: Broader named-customer coverage outside the currently fetchable curated case-study set.
      whyItMatters: >-
        TU003 is intentionally partial because Hightouch publishes a curated proof set. Without a
        wider roster, the chapter cannot test whether the strongest public logos are representative
        of the entire customer base.
      diligencePath: Request a full current customer roster by stage and vertical, then test a sample of non-featured accounts.
      relatedQuestionRefs:
        - QU007
      relatedTableRefs:
        - TU003
