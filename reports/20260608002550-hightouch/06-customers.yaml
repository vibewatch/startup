  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver / risk
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - AI Decisioning upsell from CDP base
        - Expansion currently appears concentrated in a small set of marquee case studies such as Fundrise, WHOOP, PetSmart, and Salomon
        - Strong ACV-expansion path if attach rates are real; weak if pilots do not convert to durable contracts
        - Ask for AI Decisioning attach rate, ACV uplift, and renewal outcomes by cohort
      - - Cross-functional expansion into sales, CS, and ops
        - Proof is concentrated in a few sophisticated operators such as Docusign, CircleCI, and Ramp
        - Improves wallet share and stickiness when Hightouch becomes operational middleware, not just marketing plumbing
        - Ask for share of ARR from non-marketing use cases and number of active non-marketing destinations per customer
      - - Warehouse maturity dependency
        - Narrows fit to teams with Snowflake, BigQuery, Databricks, or Redshift and real data engineering capacity
        - Limits SMB penetration and can extend implementation for immature buyers
        - Ask for win rates and gross retention by warehouse maturity, company size, and industry
      - - Pricing and troubleshooting friction
        - Independent reviewers flag usage-based pricing, vague error messages, and opaque enterprise pricing
        - Could slow procurement, compress NDR, or create churn among faster-growing customers
        - Ask for pricing-related churn, support-ticket volume, and gross margin by deployment size
      - - Platform partner concentration
        - Strategic reliance on Snowflake and Databricks can aid distribution but may reduce independence if those ecosystems internalize activation features
        - Concentrated ecosystem exposure can weaken long-term differentiation
        - Ask for ARR mix tied to each warehouse ecosystem and contingency plans if a platform partner competes directly
      - - Customer concentration
        - Public sources do not disclose top-customer ARR, top-10 customer share, or vertical concentration
        - Largest public logos may overstate customer diversification
        - Request top-customer, top-10, and top-vertical revenue concentration plus renewal calendar
    notes: >-
      This table mixes observed expansion paths with evidence-backed risk inferences from
      independent critiques and missing disclosure. The biggest unclosed gap is customer and
      ecosystem concentration.
