chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof shows Hightouch serving warehouse-mature retail, fintech, media,
    hospitality, and B2B SaaS operators, with the clearest production evidence coming from
    PetSmart, Fundrise, Ramp, Warner Music Group, Salomon, Calendly, Grammarly, and Docusign.
    The public record is strong on deployment speed and activation outcomes, but weak on true
    retention, renewal, and concentration disclosure; direct G2 and Gartner review pages were
    also bot-blocked during this run, limiting first-hand review verification.
sections:
  - id: customer-segmentation
    title: Customer segmentation and who actually buys Hightouch
    body: >-
      Hightouch’s public customer footprint is broad in industry terms but narrow in workflow
      terms. The visible proof clusters around companies that already run a serious warehouse
      stack and want marketing, sales, or lifecycle teams to act on modeled data without waiting
      on engineers for every activation. The customers page explicitly spans retail and
      eCommerce, financial services, travel and hospitality, media and entertainment, quick
      service restaurants, healthcare, and B2B SaaS, while individual stories show buyer/user
      patterns that repeat: data teams and marketing operations leaders usually buy, marketers,
      growth teams, sales teams, or CRM operators are the daily users, and the payer is usually
      an enterprise software or growth-technology budget. Independent commentary reinforces the
      same filter. Integrate.io and PostHog both describe Hightouch as strongest for teams with
      mature Snowflake, BigQuery, Databricks, or Redshift environments rather than companies that
      still need an all-in-one data foundation. That means the addressable market is real and
      enterprise-grade, but it is not the whole martech universe; it is the warehouse-ready slice
      of it.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU006
      - CU007
      - CU039
      - CU048
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-proof
    title: Adoption trajectory and named production proof
    body: >-
      The strongest part of Hightouch’s customer evidence is not a logo wall but a set of named,
      quantified deployments. PetSmart says Hightouch supports journeys for 65+ million loyalty
      members, syncs more than 15 million records to Salesforce Marketing Cloud daily, powers
      more than four billion personalized emails per year, and helped drive 15%–25% incremental
      sales lift in tested campaigns. Fundrise says it serves 400,000+ customers and saw a 4x
      increase in invested amount in a dormant-user AI Decisioning pilot. Ramp says its
      Hightouch-enabled personalization engine drives 25% of sales pipeline. Warner Music Group
      says it implemented Hightouch on Snowflake in six weeks and got hundreds of audiences live,
      later scaling to 1,000+ syndicated audiences. Salomon, Calendly, Grammarly, Docusign,
      CircleCI, Veronica Beard, Nando’s, WHOOP, and Cars.com add more evidence across retail,
      SaaS, financial services, and consumer-audience businesses. The important distinction is
      that some of this proof is clearly production-grade and ongoing, while some of the AI
      Decisioning evidence is still pilot or campaign scoped. Hightouch can credibly claim real
      production deployment, but investors should not confuse a successful named campaign with a
      disclosed renewal-quality customer cohort.
    claimRefs:
