  topStrengths:
    - >-
      Warehouse-native architecture plus composable CDP and AI Decisioning gives Hightouch a differentiated product
      story beyond point reverse ETL.
    - >-
      Public traction is unusually concrete for a private company: 803 paying customers, $100M ARR, and named enterprise
      deployments.
    - AI-led growth appears real, with $70M of ARR added in roughly 20 months after the AI launch.
    - >-
      Gartner's 2026 CDP leader status and a 300+ integration footprint improve enterprise credibility and switching
      value.
    - >-
      Goldman, Bain, Databricks Ventures, Sapphire, and other backers reduce near-term financing risk and reinforce
      ecosystem relevance.
  topRisks:
    - The April 2026 Series D implies roughly 27.5x ARR, far above public martech revenue multiples.
    - >-
      Public sources still do not disclose NRR, churn, gross margin, burn, or customer concentration, so downside
      durability is not underwritable.
    - Hightouch depends heavily on warehouse partners and downstream APIs that it does not control.
    - >-
      Category consolidation and suite bundling from Fivetran, Salesforce, Braze, Segment, and others can compress the
      standalone moat.
    - >-
      Privacy, AI-governance, and audience-activation compliance risk rise as the company expands deeper into marketing
      decisioning.
  unresolvedGaps:
    - Current ARR bridge by product, NRR, GRR, logo churn, and top-customer concentration.
    - Gross margin, burn, CAC efficiency, payback, and runway by major product line.
    - Series D preference stack, participation rights, liquidation waterfall, and any secondary or ratchet economics.
    - AI Decisioning revenue mix, attach rates, cohort retention, and durability beyond campaign- or pilot-level proof.
    - Top-20 customer contract quality, renewal calendars, and exposure to warehouse or platform concentration.
