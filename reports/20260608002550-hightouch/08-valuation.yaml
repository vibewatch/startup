  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: current-unit-economics-and-retention
      missingEvidence: Public sources do not disclose Hightouch’s NRR, GRR, gross margin, CAC efficiency, burn, or customer concentration.
      whyItMatters: Those are the core variables that determine whether a 2026 late-stage software premium is durable or fragile.
      diligencePath: Request the current ARR bridge, retention waterfall, gross-margin bridge, burn history, and customer concentration summary from the finance team.
      relatedTableRefs: [TV001, TV003]
      relatedQuestionRefs: [QV019, QV020, QV022]

    - type: private-evidence-only
      severity: material
      topic: series-d-preference-stack
      missingEvidence: Public materials do not reveal the Series D preference stack, participation rights, secondary mix, or any strategic side-letter economics.
      whyItMatters: The headline post-money can materially overstate the attractiveness of an equivalent new-money entry if existing investors hold asymmetric protections.
      diligencePath: Review the cap table, liquidation waterfall, side letters, and purchase agreement economics before using the round as a valuation anchor.
      relatedTableRefs: [TV001, TV006]
      relatedQuestionRefs: [QV018, QV032]

    - type: missing-source
      severity: informational
      topic: TV004-comparable-valuation-table
      missingEvidence: The comparable table uses public market-cap and revenue snapshots as practical proxies and does not include fully adjusted EV data or high-quality private-market price discovery for peer rounds.
      whyItMatters: EV adjustments, cash balances, debt, and private secondary marks could tighten or widen the apparent valuation gap versus Hightouch.
      diligencePath: Add banker-grade EV bridges and any available private secondary pricing before making a final pricing decision.
      relatedTableRefs: [TV004]
      relatedQuestionRefs: [QV009, QV020]

