    - id: QV019
      type: adverse
      question: Which valuation-critical financial metrics remain undisclosed in public sources?
      targets: [contentRequirements/2, plannedTables/final-diligence-asks-table]
      status: answered
      answer: Public sources do not provide NRR, gross margin, burn, customer concentration, or preference-stack detail, which are the most important missing underwriting variables.
      sourceRefs: [SV002, SV004, SV020, SV025]
      claimRefs: [CV021]

    - id: QV020
      type: quantification
      question: What current value range is supportable from public comparables alone?
      targets: [contentRequirements/2, plannedFigures/valuation-sensitivity]
      status: answered
      answer: On the disclosed $100M ARR snapshot, public-like comp math implies roughly $0.5B-$0.8B; even a generous private-growth premium only begins to argue toward roughly $1.0B-$1.5B.
      sourceRefs: [SV024, SV028, SV030, SV032, SV034, SV039, SV040, SV041, SV042]
      claimRefs: [CV022, CV031]

    - id: QV021
      type: quantification
      question: What bull-case operating path could justify something close to the current mark?
      targets: [contentRequirements/3, plannedTables/bull-base-bear-scenario-table]
      status: answered
      answer: Hightouch likely needs roughly $275M-$325M ARR by 2028 and a sustained premium 9x-11x exit multiple to defend or modestly exceed today’s valuation.
      sourceRefs: [SV002, SV004, SV024]
      claimRefs: [CV023, CV024]

    - id: QV022
      type: quantification
      question: What does the base case imply for capital preservation at the current price?
      targets: [contentRequirements/3, plannedFigures/valuation-return-range]
      status: answered
      answer: A base case of roughly $190M-$230M ARR at a 6x-8x exit multiple yields $1.3B-$1.9B, or only about 0.47x-0.69x on the current mark.
      sourceRefs: [SV024, SV032, SV034, SV041, SV042]
