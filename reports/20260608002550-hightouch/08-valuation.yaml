      claimRefs: [CV012, CV042]

    - id: QV011
      type: verification
      question: Does independent 2026 evidence support Hightouch’s enterprise credibility?
      targets: [contentRequirements/0, plannedFigures/investment-kpis]
      status: answered
      answer: Yes. Hightouch is represented as a 2026 Gartner CDP Leader and official materials repeatedly cite that position.
      sourceRefs: [SV001, SV046]
      claimRefs: [CV013, CV041]

    - id: QV012
      type: mechanism
      question: Does Hightouch’s architecture also create a customer-burden or implementation risk?
      targets: [contentRequirements/0, plannedTables/thesis-anti-thesis-table]
      status: answered
      answer: Yes. Both product docs and external reviews indicate that warehouse-native architecture shifts modeling and data maturity requirements onto the customer.
      sourceRefs: [SV012, SV018, SV020, SV046]
      claimRefs: [CV014]

    - id: QV013
      type: mechanism
      question: What pricing model is publicly visible and how does it affect underwriting?
      targets: [contentRequirements/2, plannedFigures/investment-kpis]
      status: answered
      answer: Hightouch uses composable, usage-based pricing with a free Reverse ETL tier, which helps land-and-expand but can reduce spend predictability.
      sourceRefs: [SV043, SV020, SV021]
      claimRefs: [CV015]

    - id: QV014
      type: enumeration
      question: What public customer proof supports Hightouch’s scale story?
