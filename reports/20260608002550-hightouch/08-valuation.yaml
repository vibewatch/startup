callouts:
  - calloutType: risk
    title: The company may be premium; the price is still richer than the proof
    body: Hightouch’s product, growth, and customer signals are strong. The underwriting problem is that the current mark assumes years of successful execution before the public evidence reveals whether that durability exists.
    claimRefs: [CV003, CV005, CV006, CV021, CV027, CV030]
  - calloutType: insight
    title: Strategic rounds can be true without being investable for everyone
    body: The April 2026 financing can simultaneously be a valid market-clearing round for insiders and strategic capital while remaining an unattractive risk-adjusted entry for a new investor without special terms.
    claimRefs: [CV001, CV017, CV020, CV031, CV040]

