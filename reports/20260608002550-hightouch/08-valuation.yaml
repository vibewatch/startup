      sourceRefs: [SV004, SV012, SV001]
      claimRefs: [CV033]

    - id: QV026
      type: mechanism
      question: How do integrations and partners contribute to valuation support?
      targets: [contentRequirements/4, plannedFigures/investment-kpis]
      status: answered
