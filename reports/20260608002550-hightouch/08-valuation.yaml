      sourceRefs: [SV014, SV015, SV044]
      claimRefs: [CV042]

    - id: QV027
      type: verification
      question: Do customer stories prove enough to underwrite the current valuation?
      targets: [contentRequirements/0, plannedTables/thesis-anti-thesis-table]
      status: answered
      answer: They prove product-market fit and enterprise relevance, but because they are vendor-produced they do not by themselves justify a 27.5x ARR valuation.
      sourceRefs: [SV001, SV045]
      claimRefs: [CV041]

    - id: QV028
      type: verification
      question: Does public evidence support the April 2026 price for a new investor?
      targets: [contentRequirements/2, plannedTables/recommendation-summary-table]
      status: answered
      answer: No. Public evidence supports admiration for the company and belief in continued upside, but not an unstructured entry at the current mark.
      sourceRefs: [SV002, SV004, SV024, SV028, SV032, SV034]
      claimRefs: [CV027, CV028, CV030]

    - id: QV029
      type: verification
      question: What recommendation, confidence level, and risk rating follow from the current evidence set?
      targets: [contentRequirements/1, plannedTables/recommendation-summary-table]
      status: answered
      answer: The appropriate public-evidence recommendation is TRACK / PASS ON CURRENT PRICE with medium confidence and a high risk rating.
      sourceRefs: [SV002, SV004, SV017, SV020, SV024]
      claimRefs: [CV027, CV028, CV029]

    - id: QV030
      type: verification
      question: Is Hightouch publicly IPO-ready today?
      targets: [contentRequirements/5, plannedTables/final-diligence-asks-table]
      status: answered
      answer: No. There is no public evidence yet of the disclosure depth or operating durability required to support a near-term IPO case.
      sourceRefs: [SV025, SV026, SV002, SV004]
      claimRefs: [CV037]

    - id: QV031
      type: enumeration
      question: What exit paths are most plausible from the current position?
      targets: [contentRequirements/5, plannedTables/final-diligence-asks-table]
      status: answered
      answer: Strategic sale or private recap are more plausible than near-term IPO because strategic relevance is visible while public-company disclosure readiness is not.
      sourceRefs: [SV016, SV017, SV046]
      claimRefs: [CV038]

    - id: QV032
      type: enumeration
      question: Which diligence asks would most quickly change the recommendation?
      targets: [contentRequirements/5, plannedTables/final-diligence-asks-table]
      status: answered
      answer: Priorities are the ARR bridge and retention stack, gross margin and burn, preference waterfall, AI revenue mix, customer-concentration durability, and strategic side-letter rights.
      sourceRefs: [SV020, SV025, SV026]
      claimRefs: [CV039, CV031]

