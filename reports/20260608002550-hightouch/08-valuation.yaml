    - id: QV016
      type: adverse
      question: Is the reverse-ETL and composable-CDP category consolidating in a way that could hurt Hightouch’s standalone premium?
      targets: [contentRequirements/3, plannedTables/thesis-break-and-kill-triggers-table]
