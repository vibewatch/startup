  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: durability metrics
    missingEvidence: Top-customer concentration, NRR, GRR, renewal schedules, and logo-retention cohorts.
    whyItMatters: These metrics determine whether Hightouch’s high valuation is supported by durable demand or only by recent growth and ecosystem momentum.
    diligencePath: Request board KPI materials, cohort retention by segment, and top-10 customer ARR share before underwriting durability.
    relatedQuestionRefs:
    - QR022
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: sla and incident discipline
    missingEvidence: A quantitative SLA, service-credit policy, incident-frequency baseline, and recent RCA package.
    whyItMatters: Public incident examples show that delivery defects can propagate into customer campaigns, but investors still cannot size the expected reliability or support burden.
    diligencePath: Obtain the customer-facing SLA, incident metrics by product and region, and two recent RCAs including customer-impact summaries.
    relatedQuestionRefs:
    - QR023
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: material
    topic: company-specific legal exposure
    missingEvidence: Court-docket, regulator-docket, and outside-counsel confirmation on any Hightouch-specific investigations, claims, or threatened disputes.
    whyItMatters: This run did not retain company-specific enforcement or litigation, but legal absence claims are weak without direct docket verification.
    diligencePath: Run direct PACER, state court, and regulator-docket checks or request a litigation schedule from counsel.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: ai governance
    missingEvidence: Prompt-logging, human-override, content-labeling, model-evaluation, and data-supplier review artifacts for AI Decisioning and Match Booster.
    whyItMatters: The public AI story is ambitious and channel-wide, so governance evidence is necessary to distinguish mature enterprise controls from marketing narrative.
    diligencePath: Request the AI governance policy, model-risk review cadence, vendor-review process, and examples of disclosure or approval flows in regulated campaigns.
    relatedQuestionRefs:
    - QR027
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: unit economics and pricing predictability
    missingEvidence: Realized ACV, usage overage patterns, support-cost trends, gross margin by module, and burn multiple.
    whyItMatters: Public growth proof is strong, but investors still cannot tell whether AI-led expansion improves economics or merely increases support, cloud, and content costs.
    diligencePath: Request finance model outputs showing gross margin, module attach, overage incidence, and support-to-ARR leverage by cohort.
    relatedQuestionRefs:
    - QR017
    - QR020
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
