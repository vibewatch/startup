  title: Risks
summary: Hightouch’s top public risks are compliance compounding, ecosystem dependence, and under-disclosed operating durability rather than simple demand weakness. The company’s 2026 legal stack, public incident record, and partner surfaces show credible mitigations, but they also show that audience activation, AI-led marketing, warehouse partners, and customer-value realization now carry enough external dependency to affect revenue quality and valuation.
sections:
- id: regulatory-privacy-and-legal-risk
  title: Regulatory, privacy, and legal risk is the first public-risk category
  body: 'Hightouch’s highest-severity public risk is no longer simple reverse-ETL reliability; it is the widening legal surface created by marketing AI, audience activation, messaging, and third-party data enrichment. The company’s 2026 legal stack makes that clear. The Privacy Policy now acknowledges advertising-partner sharing that may count as a sale under some privacy laws, while the Platform Privacy Notice says Match Booster enriches first-party data using trusted third-party data providers and stores some of that provider data to improve matching. The DPA is directionally mature, but it also confirms the real exposure: customers remain controllers, Hightouch acts as processor, subprocessors can be added with short notice windows, and customer data may move anywhere Hightouch or its subprocessors operate. External rules are tightening at the same time. Meta and Google audience products require lawful basis, opt-out handling, and list-freshness discipline, while the EU AI Act and FTC
    AI enforcement show a rising bar for disclosure and non-deceptive AI marketing. No company-specific enforcement was surfaced in this run, but the public evidence still supports a high-severity compliance posture because Hightouch now sits directly inside regulated targeting and messaging workflows.'
