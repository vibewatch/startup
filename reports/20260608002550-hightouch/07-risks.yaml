- id: operational-reliability-and-security-risk
  title: Operational, reliability, and security risk is manageable but still material
  body: 'Operationally, Hightouch shows real mitigation maturity, but the evidence also shows that reliability depends on more than Hightouch’s own application code. The networking and PrivateLink docs document a serious enterprise posture: customers can connect warehouses and internal services over private network paths and keep some traffic off the public internet. Databricks’ own integration guide reinforces that Hightouch is being used in security-sensitive environments with OAuth and service-principal best practices. But the same setup also increases dependency and implementation complexity. Private networking, warehouse permissions, partner auth, and manual cluster configuration all create failure modes that can delay onboarding or break production workflows even if the Hightouch control plane itself is healthy. Public incident evidence is not catastrophic, yet it is not trivial either. IsDown records repeated outages over time, including a short May 2026 AWS us-east-1 degradation
    and an April 2026 delay that created duplicate downstream events. Hightouch’s official status history exists, but it still does not give investors the deeper SLA, service-credit, and incident-rate baseline needed to underwrite reliability precisely.'
