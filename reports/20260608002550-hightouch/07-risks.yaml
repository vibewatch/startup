- id: partner-and-dependency-risk
  title: Partner, platform, and ecosystem dependence is a thesis variable
  body: 'Hightouch’s partner graph is valuable enough to help growth and dangerous enough to matter to underwriting. On the positive side, Databricks exposes Hightouch connection guides across AWS, Google Cloud, and Azure, Snowflake lists Hightouch in its partner network, and Databricks Ventures has invested directly. Those facts show strong distribution and ecosystem relevance. But they also show how much of Hightouch’s product promise rests on counterparties it does not control. Warehouses provide the underlying data, compute, auth, and buyer access. Meta and Google govern custom-audience eligibility, lawful-basis expectations, and list freshness. Hightouch’s own integrations and AI Decisioning materials show that the product now executes through advertising, email, SMS, and web endpoints that live on third-party platforms. The subprocessor roster adds yet another layer through AWS, Google, Anthropic, OpenAI, Snowflake, and Microsoft. Finally, category structure is moving in the wrong
    direction for a stand-alone activation vendor: Fivetran’s Census acquisition proves that broader data-movement platforms are already internalizing reverse-ETL functionality. The right read is not “partnerships are good,” but “partnership leverage and platform dependence are now inseparable.”'
