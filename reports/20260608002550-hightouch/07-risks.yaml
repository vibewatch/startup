- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Audience activation compliance
    - Partner-policy or carrier action
    - Any Meta, Google, or messaging-provider suspension tied to consent, opt-out, or lawful-basis failures
    - Pause go-forward conviction until the root cause, customer impact, and remediation controls are independently reviewed
  - - AI transparency and content governance
    - Regulator or customer challenge on AI-led marketing outputs
    - Any credible complaint, legal notice, or internal diligence finding showing unlabeled AI interactions or synthetic-content misuse in regulated markets
    - Move from underwriting growth upside to demanding governance proof before supporting valuation
  - - Warehouse and cloud dependency
    - Repeat cloud-linked incidents or auth failures
    - Multiple material delivery incidents in a short period, or evidence that a single warehouse ecosystem dominates bookings or production ARR
    - Re-rate the business as more partner-fragile than platform-defining and tighten price discipline
  - - Pricing predictability and customer ROI
    - Escalating usage surprise or implementation drag
    - Evidence that customers hit budget overruns, delayed launches, or module under-adoption because pricing or technical complexity outruns realized value
    - Treat self-serve and expansion assumptions as impaired until realized ACV and renewal data prove otherwise
  - - Durability opacity
    - Private diligence fails to close key disclosure gaps
    - Management cannot produce credible concentration, NRR, SLA, incident-discipline, gross-margin, and burn metrics
    - Do not underwrite the current valuation as durable growth infrastructure
  - - Support and execution bandwidth
    - Support load rises faster than product scope
    - Customer references or diligence materials show slipping onboarding quality, slow RCA loops, or support-heavy AI deployments
    - Assume margin pressure and higher churn risk until operating leverage is demonstrated
  notes: Thresholds are investment-monitoring rules rather than disclosed company targets; they translate the retained evidence into practical thesis-break events.
