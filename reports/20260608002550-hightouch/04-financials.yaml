  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value or status
      - Quality
      - Diligence ask
    rows:
      - - Reverse ETL platform
        - Usage-based recurring software sold as a composable module
        - Active syncs / usage
        - Officially priced with a free entry tier; paid pricing custom and usage-based
        - High core quality, but realized ASP is private
        - Request ARR split for standalone reverse ETL versus broader platform contracts
      - - Customer Data Platform / Customer Studio
        - Paid composable CDP layer for audiences, journeys, and profile workflows
        - Module subscription / usage
        - Officially offered as a separately purchasable product; no public list price
        - High if attach is strong inside enterprise accounts
        - Request attach rate, ACV uplift versus reverse-ETL-only customers, and renewal data
      - - AI Decisioning / agentic marketing plans
        - Paid decisioning and personalized-action layer on top of first-party data
        - Usage-based actions / plan contract
        - Officially sold separately; public sources frame AI as the current growth engine
        - Potentially high-value, but likely higher variable compute cost
        - Request AI Decisioning ARR, gross margin, inference cost, and cohort retention
      - - Enterprise security, observability, and support add-ons
        - SLA, access control, onboarding, and dedicated support inside larger contracts
        - Contract bundle
        - Features are visible publicly, but pricing and services mix are private
        - Medium-high if bundled efficiently into enterprise contracts
        - Request services revenue mix, support margin, and premium feature attach rates
      - - Professional services / implementation
        - Onboarding, integration, data-modeling, and activation setup support
        - Project or contract services
        - Public pages imply white-glove onboarding but do not disclose services revenue
        - Medium at best because services are less durable than software ARR
        - Request services share of revenue and services gross margin
      - - Free tier funnel
        - Reverse ETL free tier with limited active syncs and unlimited destination count
        - Free product-led entry
        - Explicitly public; monetization depends on paid conversion and expansion
        - Strategically valuable, but not revenue by itself
        - Request free-to-paid conversion, conversion timing, and upgrade paths by segment
    notes: >-
      Public evidence is strong on monetization architecture and weak on revenue mix. Hightouch shows the module map and
      billing philosophy, but not realized contract economics.
