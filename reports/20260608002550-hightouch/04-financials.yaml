  - id: capital-adequacy-and-financing-dependency
    title: Capital adequacy and financing dependency
    body: >-
      Financially, Hightouch looks well capitalized directionally but not underwritable precisely. The best-supported
      public anchors are the disclosed rounds themselves: a $12.1M Series A, a $40M Series B at a $450M valuation, a
      Databricks-linked 2023 investment tied to a recent $38M fundraise, an $80M Series C at a $1.2B valuation in
      February 2025, and a $150M Series D at a $2.75B valuation in April 2026. Using only the clearly disclosed A/B/C/D
      rounds implies at least $282.1M of public financing since 2021; treating the Databricks-linked $38M as incremental
      pushes the total to roughly $320.1M, though that incremental assumption still needs cap-table confirmation. The
      latest financing context is constructive. Business Wire, Goldman Sachs, and Hightouch all frame the Series D as a
      growth round for an AI marketing platform that had grown more than 100% in each of the prior two years, while the
      Wall Street Journal says the valuation stepped up from $1.2B just fourteen months earlier. That sharply reduces the
      probability of immediate financing distress. But public-company-style adequacy analysis remains blocked because no
      reviewed source disclosed cash on hand, monthly burn, runway, debt, or covenant structure. Filing visibility is
      also incomplete: SEC guidance says Form D must be filed within 15 days after first sale, but the SEC datasets page
      reviewed here only publishes released quarterly Form D files through 2026 Q1, so public filing-based cross-checking
      does not yet close the April 2026 financing loop.
