        - Official list surface
        - Conversion rate to paid is undisclosed
        - Hightouch pricing page
        - Clear land motion for small use cases and evaluations
      - - Paid Hightouch platform plans
        - Usage-based pricing with no MTU caps and no caps on sources, destinations, or user seats
        - Official pricing philosophy, not a public price card
        - Realized enterprise floor, overages, and discounts are undisclosed
        - Hightouch pricing page
        - Revenue scales with usage and breadth of deployment, not just seat count
      - - AI Decisioning and CDP modules
        - Purchased separately or mixed into a composable package
        - Official packaging signal
        - Module attach, bundling, and price uplift are private
        - Hightouch pricing page and AI docs
        - Supports upsell beyond reverse ETL if enterprise demand is real
      - - External market characterization
        - PostHog describes paid CDP and AI plans as custom-priced based on usage
        - Third-party directional proxy
        - Not a contract database; should not be treated as audited pricing
        - PostHog comparison
        - Confirms market perception that Hightouch is enterprise-custom rather than transparent list-price SaaS
      - - Enterprise reverse-ETL TCO proxy
        - Basedash says Hightouch or Census can reach $36k+ annually at enterprise tier for 500k records per month and 5 destinations
        - Third-party benchmark only
        - Vendor order and realized contract terms remain unaudited
        - Basedash comparison
        - Pricing pressure likely grows quickly with sync volume and destination breadth
      - - Customer value proof
        - PetSmart case cites 15-25% incremental sales lift and 150% member-activation growth from new campaigns
        - Outcome evidence, not list pricing
        - Says nothing about what PetSmart actually pays
        - Hightouch customer proof
        - Strong ROI narratives likely support enterprise willingness to pay even without public price disclosure
    notes: >-
      Public pricing is transparent on structure, not on realized contract values. Third-party pricing references are only
      low-confidence directional proxies and should not be mistaken for contract truth.
