  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: databricks-38m-classification
      missingEvidence: Proof of whether the Databricks-linked recent $38M fundraising round was entirely incremental capital or part of a broader financing already counted elsewhere.
      whyItMatters: Cumulative capital raised and dilution analysis change meaningfully depending on whether that $38M is incremental.
      diligencePath: Request the 2023 financing ledger, investor allocations, security type, and cap-table bridge tied to the Databricks announcement.
      relatedQuestionRefs:
        - QI012
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: gross-margin-disclosure
      missingEvidence: Actual gross margin, hosting cost, AI inference cost, support cost, and services margin by product line.
      whyItMatters: Architecture hints at margin quality, but only direct COGS and gross-margin detail can test whether AI growth is accretive or dilutive.
      diligencePath: Request product-level gross margin, COGS bridge, and AI infrastructure spend as a percentage of revenue.
      relatedQuestionRefs:
        - QI016
      relatedTableRefs:
        - TI003
        - TI005
    - type: missing-source
      severity: material
      topic: direct-form-d-link
      missingEvidence: A direct Hightouch Form D URL or filing identifier covering the company’s private financing rounds, especially the April 2026 Series D.
      whyItMatters: SEC process pages explain what should exist, but a real filing URL is needed to confirm legal entity, timing, and securities details.
      diligencePath: Request direct Form D links, filing dates, and supporting securities-law documents from management or counsel.
      relatedQuestionRefs:
        - QI022
      relatedTableRefs:
        - TI004
        - TI005
