  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Current public substitute
      - Why substitute is insufficient
      - Exact diligence path
    rows:
      - - Cash balance
        - Blocks runway analysis and downside planning
        - Latest financing amounts
        - Raised capital does not equal cash remaining after operating spend
        - Request latest balance sheet, monthly cash report, and restricted-cash detail
      - - Monthly burn
        - Blocks capital-adequacy modeling
        - Headcount and fundraising proxies
        - Workforce size and financing history cannot convert to actual burn without spend detail
        - Request 12-month burn bridge and budget-versus-actual reporting
      - - Gross margin
        - Blocks software quality and FCF analysis
        - Warehouse-native architecture and no-data-storage claims
        - Architecture suggests direction but not actual hosting, support, and AI cost load
        - Request gross margin by product, services margin, and COGS bridge
      - - CAC / payback / sales efficiency
        - Blocks disciplined GTM underwriting
        - ARR, customer count, and customer stories
        - Top-line scale says nothing about customer-acquisition cost or payback length
        - Request CAC by segment, sales cycle, funnel conversion, and quota attainment
      - - NRR / churn / retention
        - Blocks durability verdict on recurring revenue
        - Customer case studies and marquee logos
        - Logos prove adoption, not renewal or expansion behavior
        - Request 24-month cohort retention tables and churn by segment
      - - Realized pricing and discounts
        - Blocks true revenue-quality analysis
        - Official usage-based pricing philosophy and free tier
        - Public list structure does not reveal negotiated enterprise economics
        - Request price book, median discount, floor pricing, and overage policies
      - - Revenue mix by module and services
        - Blocks analysis of attach rates and contribution margin
        - Composable product map and separate-purchase option
        - Public packaging does not reveal how much ARR comes from AI versus CDP versus reverse ETL
        - Request ARR by module, services share, and attach rates by cohort
      - - Direct filing and capital-structure detail
        - Blocks legal confirmation of securities terms and downside protections
        - SEC Form D guidance and datasets page
        - Process documentation does not replace actual company filing URLs and security terms
        - Request Form D links, charter documents, investor rights, and debt/warrant schedules
    notes: >-
      Public evidence is good enough to describe Hightouch’s financial shape and momentum, but not good enough to finish a
      rigorous credit or equity underwrite.
