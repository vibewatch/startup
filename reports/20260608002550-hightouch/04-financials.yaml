  - id: TI004
    title: Capital adequacy table
    columns:
      - Line item
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Latest primary capital
        - $150M Series D at $2.75B valuation in April 2026
        - High
        - Strongest current cushion against immediate refinancing risk
        - Request cap table, primary-versus-secondary split, and closing date cash bridge
      - - Prior valuation anchor
        - $80M Series C at $1.2B valuation in February 2025
        - High
        - Gives the most relevant prior mark for analyzing financing momentum
        - Request investor rights, liquidation preferences, and board changes from Series C
      - - Valuation step-up
        - ~2.3x from Series C to Series D in roughly 14 months
        - High
        - Shows aggressive investor confidence and high expectations for continued growth
        - Request internal operating plan and assumptions used to support the step-up
      - - Growth context around latest round
        - Company said it grew more than 100% in each of the past two years and TechCrunch reported $100M ARR
        - Medium
        - Suggests the round was raised from strength, not obvious distress
        - Request audited ARR trend and 24-month cohort expansion data
      - - Public cumulative financing
        - At least $282.1M from disclosed 2021-2026 rounds; about $320.1M if the Databricks-linked $38M was incremental
        - Medium
        - Directionally frames total capital support behind the business
        - Request board-approved financing chronology and all actual cash proceeds received
      - - Planned use of funds
        - Build out the AI platform for marketers and broader agentic workflows
        - Medium
        - Signals capital is being aimed at product expansion rather than basic survival
        - Request use-of-funds budget by R&D, sales, marketing, and infrastructure
      - - Cash on hand / monthly burn / runway
        - Not publicly disclosed
        - Low
        - Core capital-adequacy metrics remain blocked
        - Request current cash, monthly burn, burn by function, and base/bear runway cases
      - - Debt, project finance, or covenant exposure
        - No reviewed public disclosure found
        - Low
        - Hidden leverage could materially change downside risk
        - Request debt schedule, covenants, warrants, and any venture debt or receivables financing
      - - Filing visibility
        - SEC guidance says Form D is due within 15 days after first sale; the reviewed SEC datasets page publishes released quarterly Form D data through 2026 Q1
        - Medium
        - Explains why public filing cross-check is incomplete for the April 2026 round
        - Request direct Form D URLs, filed dates, and all securities-law supporting documents
    notes: >-
      The round history is directionally positive, but public adequacy analysis still stops short of cash, burn, and
      balance-sheet truth.
