  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value or null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR
        - $100M ARR reported April 2026
        - Medium
        - Best public top-line anchor for valuation and sales-efficiency proxies
        - Request monthly ARR bridge, reported revenue, and growth by product line
      - - Paying customers
        - '803 paying customers'
        - Medium
        - Allows a rough average revenue-per-customer proxy
        - Request paying-customer definition, cohorting, and enterprise-count split
      - - Headcount
        - ~380 employees per TechCrunch; YC profile still shows 200
        - Medium
        - Headcount is the cleanest public burn and efficiency proxy, but current value is conflicted
        - Request fully loaded headcount by function and quarterly hiring history
      - - Implied ARR per paying customer
        - ~$125k using $100M ARR and 803 paying customers
        - Medium
        - Suggests meaningful enterprise account value if the metrics are time-aligned
        - Request ACV median, ACV distribution, and revenue concentration by customer decile
      - - Implied ARR per employee
        - ~$263k using $100M ARR and 380 employees; could be ~$500k if YC's 200 figure were current
        - Low
        - Indicates directionally decent capital efficiency, but is very sensitive to stale headcount inputs
        - Request contemporaneous headcount, payroll, and ARR per FTE by department
      - - Series D valuation / ARR multiple
        - ~27.5x using $2.75B valuation and $100M ARR
        - Medium
        - Frames how much growth and margin durability investors were underwriting in April 2026
        - Request board materials supporting round pricing, retention, and margin assumptions
      - - Gross margin
        - null
        - Low
        - Most important missing driver of free-cash-flow potential and pricing durability
        - Request gross margin by product, hosting cost, AI inference cost, and services margin
      - - CAC / payback / NRR / churn
        - null
        - Low
        - Core indicators of GTM efficiency and revenue durability remain absent
        - Request CAC, payback, NRR, gross retention, logo churn, and sales-cycle length
      - - Cash burn and runway
        - null
        - Low
        - Necessary to judge financing dependency under downside scenarios
        - Request cash balance, monthly burn, budget, and next-round trigger thresholds
    notes: Public proxies are unusually usable for a private startup, but still not enough to replace management financials.
