  rows:
  - - Hightouch
    - Warehouse-native specialist
    - Private growth company; 300+ tool activation surface and AI Decisioning overlay
    - Data-mature marketing, lifecycle, growth, and data teams
    - Best public marketer self-serve layer on top of the warehouse
    - Less bundle power than larger suites and platforms
  - - Fivetran Activations / Census
    - Direct peer inside broader data-movement platform
    - 700+ connectors platform; 200+ activation destinations; Census had hundreds of customers before sale
    - Existing Fivetran customers wanting one managed movement stack
    - Closest direct reverse-ETL alternative plus platform bundle
    - Activation now arrives inside broader MAR-based platform economics
  - - RudderStack
    - Low-cost warehouse-native alternative
    - Free / Starter / Growth / Enterprise; self-hosted option; 5-minute top sync tier
    - Data-team-led buyers who want control and lower TCO
    - Warehouse-native, self-hostable, and explicitly not a data silo
    - Weaker marketer-first control plane than Hightouch
  - - Twilio Segment
    - Packaged CDP incumbent
    - 25,000+ companies; 700+ integrations; 400B rows synced per day
    - Teams wanting one vendor for collection, identity, and journeys
    - Strongest breadth across event collection, profiles, and journey orchestration
    - Less pure warehouse-native posture and more sales-led packaging
  - - mParticle
    - Hybrid CDP incumbent
    - 300+ integrations; processes billions of events monthly
    - Consumer brands needing real-time plus warehouse-native scale
    - Hybrid architecture with no-code audiences and next best action
    - Pricing and operating model are less transparent than Hightouch
  - - Tealium
    - Enterprise CDP incumbent
    - 850+ enterprise customers; 1,300+ integrations
    - Large regulated enterprises and cross-functional buyer groups
    - Consent, identity, and integration breadth with real-time activation
    - Growth momentum looks weaker than the newer leaders
  - - Salesforce Data 360
    - Platform incumbent
    - Core data engine for Agentforce and broader Salesforce clouds
    - Salesforce-centric enterprises
    - Native distribution into sales, service, marketing, and AI agents
    - Consumption pricing and broader suite dependence can raise complexity
  - - Braze Data Platform
    - Adjacent execution-layer substitute
    - Braze engagement platform plus warehouse audiences and BrazeAI
    - Lifecycle and CRM teams already centered on Braze execution
    - Can absorb data, audienceing, and AI inside the engagement tool
    - Less neutral as a cross-stack control plane than Hightouch
  - - Internal build / CSV workflows
    - Status-quo substitute
    - Existing warehouse, scripts, and analyst capacity
    - Narrow use cases with strong in-house data engineering
    - No new vendor cost and full control over edge logic
    - Brittle observability, weak governance, and poor marketer self-serve
  notes: Rows mix direct peers, incumbents, adjacent substitutes, and the status-quo internal-build path because buyers can solve the same activation job through very different control planes.
