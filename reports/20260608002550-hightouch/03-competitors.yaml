  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-pricing
    missingEvidence: Realized ASPs, discount bands, term lengths, and required add-ons across Hightouch, Fivetran Activations, Segment CDP, and Tealium.
    whyItMatters: List pages only show pricing models, not true budget impact or how hard bundled rivals discount at renewal.
    diligencePath: Request recent order forms or anonymized redlines, then compare minimum commitments, included modules, and overage mechanics.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: post-census-win-loss
    missingEvidence: Current win-loss data after Census became part of Fivetran, including displacement rates and proof of whether Hightouch still beats the closest direct peer.
    whyItMatters: The direct peer set changed structurally in 2025, so historical Hightouch-vs-Census anecdotes may no longer describe the live market.
    diligencePath: Request 2025-2026 sales win-loss summaries segmented by Fivetran/Census, RudderStack, Segment, Salesforce, and Braze.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: ai-decisioning-adoption
    missingEvidence: Attach rate, active customer count, renewal behavior, and outcome durability for AI Decisioning versus the core activation product.
    whyItMatters: The moat case increasingly depends on AI decisioning being a real product layer rather than a persuasive go-to-market story.
    diligencePath: Request product attach metrics, cohort retention, and three current customer references using AI Decisioning in production.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - FP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing-rates
    missingEvidence: Quantified overlap showing how often customers keep Hightouch alongside Segment, Braze, Salesforce, or internal pipelines instead of consolidating.
    whyItMatters: Multi-homing reduces switching-cost arguments and changes how much bundle pressure actually threatens net retention.
    diligencePath: Request anonymized account-level overlap data and recent examples where Hightouch coexists with a major suite or execution platform.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: competitive-retention
    missingEvidence: Net retention, churn, expansion, and competitive replacement rates for Hightouch and the closest private peers.
    whyItMatters: Public vendor pages show product breadth, but retention metrics are the clearest test of whether the independent layer remains worth paying for.
    diligencePath: Request board or investor materials with NRR, logo churn, and displacement reasons by competitor cohort.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - FP003
