- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Warehouse-native marketer control plane
    - Platform suites reproduce audienceing and AI on top of the same warehouses
    - High
    - Salesforce, Braze, Segment, and Tealium all now market some combination of warehouse access, audienceing, and AI
    - Request recent win-loss data proving Hightouch still wins when a suite is already installed
  - - Independent activation layer
    - Fivetran/Census bundle compresses the direct peer set into a better-capitalized platform
    - High
    - Census no longer stands alone and Fivetran now sells activations next to ELT and transformations
    - Measure attach and displacement rates against Fivetran after May 2025
  - - Low storage lock-in
    - Operational switching costs may be easier to unwind than historical CDP lock-in
    - Medium
    - Customers keep their warehouse, so the main rebuild is mappings, audience logic, identity rules, and workflow adoption
    - Ask for evidence that Customer Studio and AI workflows drive expansion and stickiness
  - - AI Decisioning wedge
    - Incumbents and adjacents all market their own AI decisioning or agentic layers
    - High
    - BrazeAI, Agentforce, Segment predictive AI, mParticle Cortex, and Tealium AI all challenge the novelty of the story
    - Request attach, retention, and outcome metrics for AI Decisioning cohorts
  - - Destination breadth and operational detail
    - Incumbents can win on bundle breadth or integration count even if Hightouch has cleaner activation UX
    - Medium
    - Tealium claims 1,300+ integrations, Segment 700+, and Fivetran bundles 700+ connectors with 200+ activations
    - Validate whether destination breadth still wins deals or has become table stakes
  - - Category leadership narrative
    - Reverse ETL plumbing is becoming infrastructure that platforms absorb
    - High
    - TextQL describes reverse ETL as table stakes by 2026 and independent market coverage frames the space around larger AI and platform decisions
    - Underwrite Hightouch as a marketer control plane and AI layer, not as a sync utility
  notes: The risk register emphasizes durable threats that can change renewal outcomes rather than merely listing product gaps one vendor could ship in the next quarter.
