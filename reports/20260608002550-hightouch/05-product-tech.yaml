  - id: deployment-scale-developer-tooling-and-ecosystem
    title: Deployment scale, developer tooling, and ecosystem reach
    body: >-
      Public deployment proof is strongest where Hightouch turns warehouse models into high-volume
      marketing execution. PetSmart describes a stack spanning Snowflake, Databricks, and Salesforce
      Marketing Cloud with more than 15 million records synced daily, over 1,000 audiences, and more than
      four billion annual emails. Grammarly describes a similarly data-mature environment on Databricks,
      with Hightouch supporting a 9-figure ad budget, five billion annual emails, dynamic audience growth,
      and conversion-API workflows. These are company-produced stories, not independent performance audits,
      but together they show the product operating at enterprise scale and across multiple warehouses,
      destinations, and campaign types.


      The product also exposes more operator tooling than many marketing SaaS peers. Public docs and
      GitHub surfaces show version-controlled configuration, dbt-linked model creation, warehouse sync-log
      analytics, a public CLI, an Airflow provider, and a dbt package. That matters because Hightouch is
      not selling pure no-code simplicity; it is selling a shared operating model where platform teams can
      automate sources, syncs, and governance while marketers self-serve on top. The flip side is that
      Hightouch's reach depends materially on partner ecosystems. Snowflake and Databricks drive source-side
      performance and distribution, while HubSpot, Braze, Iterable, Salesforce Marketing Cloud, and other
      downstream APIs determine whether the activation layer can actually reach business workflows.
    claimRefs:
      - CE022
