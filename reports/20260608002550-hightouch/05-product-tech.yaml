  - id: operating-architecture-and-data-movement
    title: Operating architecture, warehouse execution, and data movement model
    body: >-
      The public architecture is specific enough to underwrite Hightouch as a warehouse-centric control
      plane. Models are defined from tables, SQL, or dbt assets; syncs decide the destination, schedule,
      mapping, batching, delete behavior, and observability path; and change detection happens either in
      Hightouch infrastructure or inside the warehouse depending on the sync engine. The security docs are
      unusually explicit that standard Reverse ETL, Events, and composable-CDP workloads do not create a
      separate long-lived copy of primary customer tables inside Hightouch. Instead, the platform stores
      operational metadata such as logs, diff state, and some AI artifacts, with an enterprise-preferred
      pattern of warehouse-resident CDC plus a customer-owned bucket for storage.


      The Databricks docs make the architecture more concrete. Hightouch supports OAuth or PAT
      authentication, can split traffic between batch and interactive HTTP paths, and recommends the
      Lightning engine for models above roughly 100,000 rows. In that mode, Hightouch writes to dedicated
      hightouch_audit and hightouch_planner schemas and can integrate with Unity Catalog managed storage.
      Identity Resolution extends the same warehouse-first design by writing identity graphs back into the
      customer warehouse rather than forcing the customer into a vendor-hosted profile store. That is a
      real architectural differentiator, but it also makes warehouse permissions, model hygiene, and partner
      platform APIs fundamental dependencies rather than implementation details.
