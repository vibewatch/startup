      - TE004
    figureRefs:
      - FE004
tables:
  - id: TE001
    title: Product module / asset matrix
    description: Publicly visible Hightouch modules and adjacent product assets as of 2026-06-08.
    columns:
      - Module / asset
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the major public modules and product assets visible in Hightouch's current docs,
        product pages, case studies, and partner materials, but not every plan-gated feature,
        sub-feature, or internal beta surface.
    rows:
      - - Reverse ETL
        - Data and operations teams
        - Mature core workflow
        - Warehouse-native sync engine with SQL/dbt model support, CDC, debugger, and logs
        - Public materials do not disclose destination-specific throughput ceilings or detailed SLA terms
      - - Customer Studio
        - Lifecycle, CRM, and growth marketers
        - Mature commercial surface
        - Self-serve audiences, journeys, splits, overlaps, and activation on top of warehouse data
        - Public docs reviewed here do not quantify every journey limitation or branching constraint
      - - Identity Resolution
        - Data + marketing teams
        - Scaling commercial capability
        - Deterministic + probabilistic matching with warehouse writeback and golden-record controls
        - Public materials do not benchmark probabilistic match quality or false-positive tradeoffs
      - - AI Decisioning
        - Lifecycle and retention marketers
        - Scaling / commercially deployed
        - Reinforcement-learning agents choose message, channel, and timing within explicit guardrails
        - Public evidence is still mostly company-reported and lighter on independent benchmarking
      - - Hightouch Events
        - Product, growth, and data teams
        - Commercial but lighter public technical depth
        - Adds real-time behavioral capture into the broader CDP stack
        - Public technical docs reviewed here are less detailed than sync and security docs
      - - Agentic marketing surfaces
        - Marketing leadership and creative/performance teams
        - Emerging public surface
        - Docs now package Agents and Ad Studio alongside AI Decisioning rather than as isolated add-ons
        - Public architectural detail is thin relative to the mature activation core
      - - Developer / operator extensions
        - Platform engineering and analytics engineering
        - Mature ecosystem layer
        - Public CLI, Airflow provider, dbt integration, dbt package, Git-linked workflows
        - Long-term support expectations for each public extension are not deeply documented
      - - Destination and partner ecosystem
        - GTM, lifecycle, RevOps, and customer-success teams
        - Mature distribution layer
        - Partner Connect, certified marketplace apps, and deep destination coverage expand reach
        - External APIs, permissions, and partner outages are meaningful operating dependencies
    notes: Rows reflect the observable commercial surface rather than every internal model, template, or preview feature.
