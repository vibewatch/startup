slug: hightouch
company:
  name: Hightouch
chapter:
  number: 5
  title: Product & Technology
summary: >-
  Hightouch is no longer just a reverse-ETL utility. Public 2026 documentation shows a warehouse-native
  product stack spanning Reverse ETL, Customer Studio, Identity Resolution, Events, and AI Decisioning,
  plus a broader agentic-marketing layer. The strongest evidence supports mature data-activation
  mechanics, enterprise governance, and real customer scale on Snowflake and Databricks; the main open
  diligence items are public SLA depth, the exact maturity of the newer agentic-marketing surfaces, and
  whether large regulated buyers can get deployment and attestation options beyond cloud-region choice,
  BYO bucket, and private networking.
runDate: '2026-06-08'
sections:
  - id: product-definition-and-module-surface
    title: Product definition, customer jobs, and visible module surface
    body: >-
      Hightouch should now be framed as a warehouse-native customer data and marketing operating layer,
      not just a point reverse-ETL connector. The current docs homepage says the platform helps teams use
      warehouse data for marketing and personalization without creating a new silo, and it organizes the
      surface into a Composable CDP family plus a broader Agentic Marketing Platform. That matters because
      the current product promise spans several distinct customer jobs: data teams define governed models,
      marketers build audiences and journeys, operators sync profiles and events into downstream tools,
      and AI decisioning agents optimize channel, content, and timing inside bounded campaign rules.


      The visible module map is already broad enough that “reverse ETL” is now only one row in a larger
      stack. Customer Studio covers marketer self-serve audiences, splits, overlaps, and fixed-sequence
      journeys. Identity Resolution adds deterministic and probabilistic stitching with warehouse writeback.
      AI Decisioning adds adaptive agents on top of warehouse audiences and connected messaging systems.
      Hightouch Events, Real-Time Personalization, Match Booster, and newer agentic-marketing pages widen
      the scope further, although the public technical depth remains much richer on the core activation and
      governance layers than on every newer marketing surface.
    claimRefs:
