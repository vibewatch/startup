  - id: TE002
    title: Workflow / use-case table
    description: Representative customer jobs and how Hightouch maps them into product workflow.
    columns:
      - User job
      - Current workflow
      - Hightouch solution
      - Measurable benefit
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Rows summarize the most defensible user jobs visible in docs and case studies, not every
        channel- or destination-specific implementation pattern.
    rows:
      - - Sync modeled warehouse data into operational tools
        - SQL models, dbt assets, or selected warehouse tables
        - Reverse ETL syncs with field mapping, scheduling, CDC, and destination-specific modes
        - Replaces manual CSVs or brittle custom pipelines with governed repeatable syncs
        - Value depends on clean source models and destination API behavior
      - - Give marketers self-serve audience creation and holdouts
        - Warehouse attributes and events owned by data teams
        - Customer Studio audiences, splits, holdouts, overlaps, and journeys
        - Faster campaign setup without handing every segment request to engineering
        - Marketer self-serve still requires prior platform setup and governance
      - - Unify fragmented customer identity
        - Disconnected identifiers across channels and business objects
        - Adaptive Identity Resolution with deterministic/probabilistic matching and warehouse writeback
        - Creates reusable profiles and entity graphs without adopting a vendor-owned data store
        - Public evidence does not benchmark match precision at enterprise scale
      - - Optimize lifecycle message, channel, and timing decisions
        - Fixed rules and manual experimentation
        - AI Decisioning agents over audiences, goals, messages, and guardrails
        - Learns from performance data and can reduce wasted sends via smart suppression
        - Public proof is still concentrated in company case studies rather than independent audits
      - - Industrialize sync operations inside a data stack
        - Schedules, API calls, and orchestration managed across ops tools
        - CLI, Airflow provider, dbt-linked models, and warehouse sync logs
        - Lets platform teams automate and observe data activation outside the web UI
        - Requires API keys, orchestrator setup, and platform-team ownership
      - - Push warehouse data into sales and customer-success workflows
        - CRM / HubSpot / downstream SaaS applications
        - Certified HubSpot app plus destination docs and partner ecosystem integrations
        - Extends activation beyond paid media into CRM, CS, and lifecycle operations
        - External marketplace and destination support varies by object, mode, and permission scope
    notes: Rows summarize representative operating jobs visible in docs and case studies; actual customer implementations add more destination- and approval-specific detail.
