  - id: TE004
    title: Trust / quality / compliance table
    description: Publicly disclosed trust controls and the main diligence gaps that remain open.
    columns:
      - Control / certification
      - Status
      - Scope
      - Gap
    enumerationScope:
      coverage: partial
      basis: >-
        Table captures the key public controls visible in product, docs, and trust-adjacent sources; it
        is not a substitute for NDA diligence materials.
    rows:
      - - Minimal customer-data storage model
        - Publicly stated
        - Standard Reverse ETL, Events, and composable CDP workloads avoid long-lived primary-table copies
        - AI artifacts, logs, and CDC state still exist and need exact retention review
      - - BYO bucket and regional deployment
        - Publicly stated
        - Customer-controlled storage plus supported deployment on AWS, GCP, or Azure in chosen region
        - Public docs do not describe full self-hosted or private-control-plane operation
      - - Private networking and TLS 1.2+
        - Publicly stated
        - Warehouse and storage connectivity through PrivateLink / PSC / Azure Private Link and encrypted transit
        - Public docs do not publish a detailed network-architecture matrix for every deployment mode
      - - SSO, SCIM, RBAC, approval flows, audit logs
        - Publicly stated
        - Organization/workspace governance and change control
        - Buyers still need exact role matrices and audit retention policies for procurement
      - - SOC 2 Type 2
        - Publicly stated
        - Core enterprise security assurance
        - Public report scope and exceptions are gated, not publicly downloadable
      - - ISO 27001
        - Publicly stated
        - Additional formal security certification
        - Public cert details and control mapping are not fully exposed in reviewed pages
      - - HIPAA, GDPR, and CCPA support
        - Publicly stated
        - Regulated data-handling posture for enterprise customers
        - Public sources do not provide a detailed subprocessor-by-feature or residency matrix
      - - Status-page transparency
        - Publicly visible
        - Maintenance and incident communications affecting app, API, event syncs, and realtime audience evaluation
        - No public SLA or service-credit policy accompanies the status surface
    notes: Trust rows combine product-control disclosures with operational signals and should not be treated as a substitute for NDA diligence packets.
    claimRefs:
      - CE014
      - CE015
      - CE028
      - CE030
      - CE034
