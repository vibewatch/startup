  - id: TE003
    title: Technology / operating architecture table
    description: Publicly visible operating layers rather than hidden internal microservice topology.
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    enumerationScope:
      coverage: partial
      basis: >-
        Hightouch does not publish a full backend system diagram, so this table models the external
        operating architecture buyers actually interact with.
    rows:
      - - Source layer
        - Warehouses, lakes, and source systems such as Snowflake and Databricks provide the authoritative data
        - Warehouse credentials, permissions, and query performance
        - Weak source modeling or access errors immediately degrade the product
      - - Modeling layer
        - Tables, SQL, and dbt assets define what Hightouch can activate
        - Data-team ownership of model quality and semantics
        - Poor model hygiene propagates bad traits, audiences, and sync payloads downstream
      - - Sync orchestration layer
        - Syncs define destination, schedule, mapping, batching, delete behavior, and run state
        - Destination APIs, schedule design, and CDC choice
        - Wrong sync mode or delete behavior can create duplicates or drift
      - - Change-data-capture layer
        - Basic engine diffs in Hightouch infrastructure; Lightning diffs in the warehouse
        - Read/write permissions, hightouch_audit and hightouch_planner state, and storage choices
        - Lightning setup is more involved, while Basic can be slower at very large volume
      - - Profile / audience layer
        - Customer Studio and Identity Resolution turn warehouse data into actionable audiences and profiles
        - Clean identity inputs, marketer workflows, and permission controls
        - Public materials do not provide independent benchmark data for graph quality or audience latency
      - - Optimization layer
        - AI Decisioning agents optimize message, channel, timing, and suppression decisions
        - Event feedback, connected messaging tools, and explicit guardrails
        - Performance depends on destination coverage and high-quality event data
      - - Delivery layer
        - Downstream tools such as HubSpot, Salesforce Marketing Cloud, Braze, Iterable, and ad platforms receive data
        - Partner APIs, app permissions, and marketplace health
        - Hightouch can orchestrate delivery, but cannot remove downstream platform constraints
      - - Governance and storage layer
        - SSO/SCIM, roles, approval flows, audit logs, BYO bucket, private networking, and region selection bound risk
        - Identity provider setup, cloud networking, and storage policy ownership
        - Public evidence is good on controls but thinner on buyer-facing SLA and attestation depth
    notes: Architecture rows model the externally visible operating pattern rather than internal microservices or infrastructure components that Hightouch does not publish.
    claimRefs:
