  evidenceGaps:
    - type: private-evidence-only
      severity: medium
      topic: amp-roadmap-granularity
      missingEvidence: >-
        Public materials show that Hightouch now packages an Agentic Marketing Platform, but they do not
        expose a detailed shipped-versus-preview matrix, attach rates, or future release calendar for
        Agents, Ad Studio, or related AMP surfaces.
      whyItMatters: >-
        Product-underwriting risk now hinges on whether the newer agentic-marketing layer becomes a real
        moat or remains a marketing wrapper around the mature activation core.
      diligencePath: >-
        Request a dated roadmap, shipped/preview feature matrix, usage data by AMP module, and customer
        references that are specifically using Agents or Ad Studio in production.
      relatedQuestionRefs:
        - QE024
        - QE025
      relatedTableRefs:
        - TE001
        - TE005
    - type: private-evidence-only
      severity: medium
      topic: deployment-model-depth
      missingEvidence: >-
        Reviewed public sources describe cloud-region choice, BYO bucket, and private networking, but they
        do not disclose a fully self-hosted deployment option, a detailed residency matrix by feature, or a
        buyer-facing subprocessor and customer-managed-key matrix.
      whyItMatters: >-
        Highly regulated buyers may need stronger guarantees on data boundary, operational ownership, and
        deployment isolation before standardizing on Hightouch globally.
      diligencePath: >-
        Request deployment-option documentation, regional support matrix, subprocessor list by product area,
        CMK roadmap or current support, and examples of highly regulated customer deployments.
      relatedQuestionRefs:
        - QE018
        - QE022
        - QE025
      relatedTableRefs:
        - TE003
        - TE004
    - type: private-evidence-only
      severity: medium
      topic: sla-and-attestation-depth
      missingEvidence: >-
        The public trust surface is good enough to show enterprise intent, but it does not publish a public
        SLA, service-credit policy, full attestation packet, or a richer historical incident archive.
      whyItMatters: >-
        Reliability commitments and attestation depth directly affect procurement friction, especially when
        Hightouch sits in business-critical lifecycle, CRM, and advertising workflows.
      diligencePath: >-
        Request SOC 2 and ISO artifacts, penetration-test summaries, security questionnaire responses, SLA
        terms, incident-history exports, and support-escalation commitments.
