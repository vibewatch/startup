chapter:
  number: 2
  title: Market Analysis
  summary: 'Hightouch sells into a real and growing customer-data software market, but the relevant boundary is narrower than generic martech or even generic CDP. The strongest frame is warehouse-native customer-data activation: reverse ETL, composable CDP, identity resolution, and AI decisioning layered on existing Snowflake, Databricks, BigQuery, or similar infrastructure. Public analyst estimates put the global CDP market at roughly $4.1B-$4.6B in 2026 with strong double-digit growth, while customer cases show that the real budget lives with loyalty, lifecycle, performance-marketing, and martech teams at data-mature enterprises. Adoption drivers are first-party data, zero-copy economics, and AI-led personalization; the main brakes are privacy, implementation complexity, talent scarcity, usage-based cost scaling, and rising consolidation pressure after Fivetran agreed to acquire Census.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and the substitute set
  body: 'Hightouch should be underwritten as a warehouse-native customer-data activation platform that now spans four overlapping layers: reverse ETL, composable CDP, identity resolution, and AI decisioning. Official surfaces no longer describe the company as only a reverse-ETL utility. The homepage and pricing page frame it as a customer data and AI platform for marketers across marketing, advertising, data, and operations, while the product pages package Customer Studio, Identity Resolution, Reverse ETL, Hightouch Events, and AI Decisioning as adjacent modules rather than separate businesses. The included spend is therefore the software budget used to turn first-party warehouse data into audiences, customer profiles, journeys, ad suppressions, conversion signals, next-best-action decisions, and governed syncs into downstream tools. The excluded spend is upstream ingestion, warehouse storage and compute itself, media inventory, and owned message delivery by systems such as Salesforce Marketing
    Cloud or Iterable. That boundary matters because the substitute set is broad: traditional packaged CDPs, manual CSV exports, point-to-point automation, warehouse-native challengers such as RudderStack and post-acquisition Census/Fivetran Activations, and large suites such as Salesforce Data 360, Segment, mParticle, and Tealium. The market is real, but the label attached to it changes depending on whether the buyer is emphasizing data activation, customer 360, or agentic marketing.'
