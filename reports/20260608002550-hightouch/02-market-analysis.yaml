  evidenceGaps:
  - type: missing-source
    severity: material
    topic: hightouch-specific-sam
    missingEvidence: No retained public source isolates a warehouse-native activation SAM that cleanly matches Hightouch’s current product scope.
    whyItMatters: Without a scoped SAM, valuation models can over-apply broad CDP or martech TAM figures to a much narrower buyer universe.
    diligencePath: Request management segmentation by warehouse maturity, use case, industry, and buyer team; reconcile this segmentation to pipeline and current ARR.
    relatedTableRefs:
    - TM005
    relatedQuestionRefs:
    - QM010
  - type: missing-source
    severity: material
    topic: hightouch-specific-som
    missingEvidence: No retained public source establishes Hightouch’s current share of the warehouse-native CDP / activation segment or a credible near-term share ceiling.
    whyItMatters: SOM is required to translate broad category growth into disciplined underwriting assumptions for Hightouch specifically.
    diligencePath: Request customer counts, ARR, win rates, and pipeline by segment plus management’s share assumptions versus Salesforce, RudderStack, Segment, Tealium, and Fivetran Activations.
    relatedTableRefs:
    - TM005
    relatedQuestionRefs:
    - QM011
  - type: private-evidence-only
    severity: material
    topic: segment-economics-and-expansion
    missingEvidence: Public sources do not disclose Hightouch’s ACV distribution, attach rates across reverse ETL / CDP / AI Decisioning, or expansion behavior by segment.
    whyItMatters: Market attractiveness depends not just on TAM, but on whether Hightouch can expand from activation into higher-value decisioning and identity budgets with durable economics.
    diligencePath: Request ACV by segment, gross margin by product line, AI Decisioning attach and renewal rates, and cohort-level expansion from activation into broader CDP modules.
    relatedTableRefs:
    - TM004
    - TM005
    relatedQuestionRefs:
    - QM025
