- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Third-party cookie retirement and first-party data urgency
    - driver
    - current
    - Pushes enterprises toward warehouse-based identity, consent, and activation layers.
    - Request pipeline exposure to retail, BFSI, and other first-party-data-sensitive verticals.
  - - AI-driven next-best-action and context engineering
    - driver
    - current to medium-term
    - Expands Hightouch from audience export into higher-value decisioning and orchestration budgets.
    - Request AI Decisioning adoption, attach rates, and proof that outcomes persist beyond pilots.
  - - Zero-copy / warehouse-native economics
    - driver
    - current
    - Improves fit for buyers that want to avoid duplicate storage and vendor lock-in.
    - Request average time-to-value, implementation effort, and data-egress savings by customer class.
  - - Marketer self-serve on top of governed data
    - driver
    - current
    - Creates ROI when marketers can act without waiting on analysts or engineers.
    - Request usage split between data teams and business users, plus retention by self-serve adoption.
  - - Privacy, consent, and data-localization burdens
    - constraint
    - current
    - Raises diligence cost and can narrow the reachable customer set in regulated verticals.
    - Request win/loss analysis by regulated vertical and details on regional deployment requirements.
  - - Reverse-ETL talent and implementation complexity
    - constraint
    - current
    - Can delay deployments when buyers lack data-modeling, identity, or integration skills.
    - Request services burden, average onboarding duration, and product-led mitigation features.
  - - Usage-based pricing and scale creep
    - constraint
    - current
    - May make departmental buyers cautious if sync breadth or personalized actions expand quickly.
    - Request median ACV, overage behavior, and pricing objections in mid-market versus enterprise.
  - - Category consolidation and platform absorption
    - constraint
    - current to medium-term
    - Broader suites can bundle activation, putting pressure on standalone architecture narratives.
    - Request win/loss data versus Fivetran Activations, Salesforce Data 360, Segment, and RudderStack.
  notes: Drivers and constraints are tied to adoption timing and buyer economics rather than abstract category narrative.
