    - Most common packaged substitute
  - - Status-quo workflow patchwork
    - Manual CSV exports, point-to-point automations, analyst tickets, bespoke pipelines, and one-off suppressions
    - Purpose-built governed activation platforms
    - Existing owners of marketing and data operations budgets
    - Often the pre-Hightouch baseline in customer stories
