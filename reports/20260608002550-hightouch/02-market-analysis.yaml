- id: sizing-lenses
  title: 'Sizing lenses: large category, contradictory estimates, and no clean public SAM'
  body: 'Public sizing evidence supports a meaningful market, but not a clean Hightouch-specific TAM/SAM/SOM stack. Fortune Business Insights values the global CDP market at $3.28 billion in 2025 and $4.07 billion in 2026, with a path to $17.03 billion by 2034. Mordor Intelligence, using a different methodology, values the same market at $4.58 billion in 2026 and $13.14 billion by 2031. Those estimates are directionally consistent on growth and inconsistent on base size, which is exactly why this chapter preserves a range instead of a single number. The broader martech environment is even larger but less useful as a direct underwriting lens: ChiefMartec counted 15,505 martech products in 2026 and described the market as effectively flat on net growth, with strong churn underneath. For Hightouch, deployment-scale proxies are often more decision-useful than abstract TAM. PetSmart is already syncing 15 million-plus records per day and over four billion emails annually from warehouse-based audiences,
    while Grammarly runs a nine-figure ad budget and billions of lifecycle emails through the same warehouse-native model. The conclusion is that Hightouch sells into a large and growing CDP/activation opportunity, but the observable SAM is narrower: data-mature enterprises that already trust a warehouse as the operational system of record and are willing to fund activation, identity, and AI on top of it.'
