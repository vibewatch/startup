          value: ">500m people lacking reliable electricity in historical context"
          detail: "Broad need lens; not an M-KOPA revenue estimate"
        - id: asset-finance
          label: "PAYG and financed essential or productive assets"
          value: "Solar, smartphones, mobility and related financed goods"
          detail: "Category boundary supported by product descriptions"
        - id: addressable-countries
          label: "M-KOPA operating footprint"
          value: "Five reported markets"
          detail: "Kenya, Nigeria, Ghana, Uganda and South Africa"
        - id: observed-scale
          label: "Reported customer and credit scale"
          value: "10m customers; >$2bn credit in selected 2026 coverage"
          detail: "Reported operating indicators, not market share"
        - id: investable-sam
          label: "Country/product SAM"
          value: "Not publicly isolated"
          detail: "Requires product, country, affordability and repayment cohorts"
        - id: obtainable-som
          label: "M-KOPA SOM"
          value: "Not publicly isolated"
          detail: "Requires share, capacity, funding and competitive conversion data"
    approximationNotes: "The pyramid is an ordered evidence lens, not a proportional area chart. Values are not converted into comparable units or widths."
    claimRefs: [CM005, CM007, CM008, CM012, CM017]
