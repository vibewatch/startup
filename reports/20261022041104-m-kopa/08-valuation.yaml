callouts:
  - calloutType: recommendation
    title: Research-more, not premium entry
    body: Public evidence supports a scaled and potentially valuable platform, but not a precise or premium valuation. The underwriting decision should remain conditional on audited financials, cohort loss data, financing terms, and governance resolution.
    claimRefs: [CV001, CV007, CV013, CV014, CV015]
  - calloutType: risk
    title: The key risk is not only growth
    body: A large customer and revenue footprint can coexist with funding, credit, FX, preference, and governance risks. The current record does not establish risk-adjusted cash returns to new equity.
    claimRefs: [CV005, CV008, CV009, CV010, CV011, CV016]
