      - [Core technology control, "KilpiTek acquired for $8 million with cash and equity/deferred consideration", "Post-acquisition integration and measured loss-rate impact"]
      - [Financing opacity, "SetterVC warns that its funding and valuation marks may be incomplete or unverified", "Fully diluted cap table, preferences, debt and cash reconciliation"]
      - [Governance overhang, "Series F reporting coincided with an employee-shareholder legal challenge", "Docket resolution and independent board-process evidence"]
      - [Market demand, "Growth spans Kenya, Nigeria, Ghana, Uganda and South Africa", "Retention, repeat-product and unit-economics disclosure by market"]
    notes: "Arguments are directional investment drivers, not a substitute for a priced transaction model."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Reported growth persists; digital-finance cohorts are profitable; losses and funding costs remain controlled", "Premium to the 2025 primary/secondary reference could be justified, but no numeric target is supportable", "Low-to-medium until audited cohort data", "Credit losses, FX or funding costs rise faster than contribution profit"]
      - [Base, "Growth continues with a disclosure discount and no confirmed change to preference or debt terms", "Value around the latest public pricing band only after cap-table and cash verification", "Most defensible public-evidence case", "Audited revenue or cash conversion materially trails reported scale"]
      - [Bear, "Multiple compression, adverse governance outcome, constrained funding, or weak repeat-product economics", "Downside is unquantifiable without fully diluted shares and liabilities; avoid new capital", "Material tail risk", "Down-round, covenant stress, litigation loss, or persistent portfolio deterioration"]
    notes: "Scenario ranges are qualitative because the assigned evidence does not disclose audited margins, cash flow, fully diluted shares, preference terms, or loss curves."
    claimRefs: [CV007, CV008, CV010, CV011, CV013, CV014, CV015, CV016]
