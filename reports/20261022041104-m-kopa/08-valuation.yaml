chapter:
  number: 8
  title: Valuation
  summary: M-KOPA shows unusually strong reported scale and growth, but the public valuation record remains incomplete and conflicted. The evidence supports research-more rather than a premium entry until audited financials, portfolio quality, cap-table terms, and governance disclosures are available.
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      M-KOPA's thesis rests on scale, growth, and a financing model that uses device repayment data to expand into digital credit and adjacent products. The company reported 10 million customers and $600 million of 2025 revenue in one October 2026 account, while TechCabal described more than $2 billion of credit deployed and a smartphone-led path into lending and insurance. The acquisition of KilpiTek for $8 million also suggests management is investing to control a core device-locking capability rather than merely reselling third-party infrastructure. These are material operating signals, but most figures are company-reported or reported by outlets quoting company management rather than audited public filings. The anti-thesis is therefore disclosure and financing risk: ImpactAlpha described a $160 million Series F term sheet with roughly half fresh capital and half shareholder liquidity while reporting a shareholder-rights lawsuit alleging irregular dilution. That combination makes headline funding totals and implied equity value poor substitutes for a fully diluted, preference-adjusted valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV011]
    tableRefs: [TV001, TV002]
  - id: valuation-context
    title: Financing context and entry discipline
    body: >-
      The latest identifiable primary/secondary pricing context is the 2025 Series F process: ImpactAlpha reported that M-KOPA was nearing a close on a roughly $160 million term sheet led by Sumitomo, with exit pricing between $26 and $27.15 depending on share class. The same report said about half of the financing would provide fresh capital and the other half would offer early holders an exit, which creates a materially different interpretation from treating the entire amount as growth capital. SetterVC separately labels its secondary signals unverified, lists an approximately $37.02 new-share price and $26-$27.15 secondary band, and describes a potential $30 million debt facility as pending rather than closed. The public record therefore supports an indeterminate valuation stance, not a precise mark or evidence that the present price is attractive. Entry should be conditional on a cap table, preference stack, debt covenants, audited revenue-to-cash reconciliation, and portfolio loss data; without them, a buyer cannot distinguish operating scale from financing leverage or shareholder liquidity.
    claimRefs: [CV005, CV007, CV008, CV009, CV010, CV011, CV013, CV014]
    tableRefs: [TV003]
  - id: scenarios-and-diligence
    title: Scenario logic, exit readiness, and diligence
    body: >-
      A bull case is possible if reported customer and revenue growth converts into durable cash generation, repeat product adoption, and controlled credit losses across five operating markets. A base case assumes continued growth but applies a disclosure discount until management supplies lender-grade portfolio vintages, recoveries, country mix, and audited statements. The bear case is driven by multiple compression, funding or warehouse constraints, adverse governance outcomes, and evidence that customer growth or reported revenue does not translate into attractive risk-adjusted returns. The available evidence does not justify a target return or exit multiple: there is no public, audited basis here for gross margin, cash burn, net retention, portfolio delinquency, or fully diluted share count. Recommendation logic should therefore be treated as a gated diligence decision rather than a precise intrinsic-value output. The most decision-relevant next steps are to verify Series F terms and current marks, reconcile funding with cash available, obtain the legal docket and board materials, and test whether device-led acquisition produces profitable digital-finance cohorts after losses, servicing, funding costs, and FX.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
