      Portfolio quality, cash generation, funding costs and warehouse or liquidity constraints are not disclosed at
      lender-grade depth.
    - Governance, dilution and shareholder-rights questions remain unresolved.
    - FX, customer-treatment, hardware and multi-country execution risks could weaken risk-adjusted returns.
  unresolvedGaps:
    - Audited 2025 financial statements with country mix, segment economics and a clean revenue-to-cash bridge.
    - Lender-grade portfolio vintages covering delinquencies, charge-offs, recoveries and repeat borrowing.
