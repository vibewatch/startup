schemaVersion: "report-v2"
artifact: financials
slug: m-kopa
runDate: 2026-10-22
company:
  name: M-KOPA
chapter:
  number: 4
  title: Financials
  summary: M-KOPA's public evidence describes an asset-finance model that converts device and solar repayments into repeat financial-services relationships. Recent reported revenue and profitability figures are promising, but audited statements, portfolio quality, realized pricing, cash generation, and financing covenants remain unavailable for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      M-KOPA finances productive assets through an upfront deposit followed by digital micropayments, with smartphones functioning as both a financed product and an entry point to later loans, insurance, and other services. Public descriptions support a layered monetization model rather than a pure software subscription: the company earns from financed devices and lending-related services, while repayment data can support repeat customer eligibility. A 2026 company-reported account says revenue reached $600 million in fiscal 2025, up 45% from 2024, while another 2026 account reports $416 million of 2024 revenue; the differing periods and evidence quality require reconciliation before either figure is used in a model. List or contract pricing, realized take rates, revenue recognition by product, and the split between device revenue, finance income, insurance, and other services are not publicly established in the assigned evidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-and-costs
    title: Capital structure, cost drivers, and operating leverage
    body: The model is capital intensive because M-KOPA must finance receivables and inventory while maintaining distribution and service operations. IFC reported a $50 million equivalent multicurrency loan to the Kenyan subsidiary and a $15 million equivalent local-currency loan to the Ugandan subsidiary in 2023, as part of a wider initial $202 million five-year financing facility. The same source describes customer deposits and instalments, but does not disclose borrowing costs, warehouse advance rates, delinquency triggers, or cash available to the parent. Public descriptions point to mobile-money collection, remote device controls, field sales, service centers, and local assembly as major cost and risk drivers; however, gross margin, servicing cost per account, credit losses, and working-capital turns remain private. The reported first profit is encouraging but does not substitute for cash-flow and portfolio-level evidence.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: Public traction supports a credible revenue engine, but the evidence is not sufficient to underwrite durability or capital adequacy. IFC reported more than $1 billion of cumulative credit in 2023, but cumulative deployment is not outstanding principal, collected cash, or current liquidity. A 2026 independent fact-check records criticism of financed-phone cost and delays unlocking devices after payment completion; this is relevant to collections, customer trust, and operational cost even though it does not establish a financial loss. ImpactAlpha reported that M-KOPA was nearing a close on roughly $160 million of Series F equity financing in July 2025, but the company had not disclosed final terms. The investment case therefore merits further research, contingent on audited accounts, receivables vintages, loss and recovery data, liquidity, facility covenants, realized pricing, and final financing terms.
    claimRefs: [CI010, CI011, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or driver, Current public value/status, Quality, Diligence ask]
    rows:
      - [Financed smartphones and productive assets, Deposit plus digital instalments, Asset financed and repayment schedule, Publicly described; no realized price disclosed, Company/third-party reported, Obtain cohort revenue and cash collection bridge]
      - [Digital loans, Eligibility based partly on repayment behavior, Loan principal and finance income, Product described; no portfolio yield disclosed, Company/third-party reported, Obtain APR or equivalent yield net of losses]
      - [Insurance and adjacent financial services, Cross-sell after repayment history, Policy or service fee, Mentioned as an expansion area; value not disclosed, Partial, Obtain product-level revenue and contribution margin]
      - [Solar and other connected assets, Pay-as-you-go asset finance, Installed asset and instalment plan, Historical and ongoing product category; current mix unavailable, Third-party reported, Obtain product mix and remaining receivables]
    notes: Public sources describe mechanisms but do not provide audited segment revenue or realized pricing; null or qualitative cells are not estimates.
    claimRefs: [CI001, CI002]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Metric, Public evidence, Status, Why it matters, Diligence ask]
    rows:
      - [Customer deposit, Small deposit before access is described, Not quantified, Determines initial affordability and loss exposure, Obtain country and product schedule]
      - [Repayment cadence, Daily weekly or monthly payments are described, Mechanism only, Drives collection cost and customer cash-flow fit, Obtain realized cadence by cohort]
      - [Financed-phone total cost, Fact-check reports criticism of overall cost, No validated price or benchmark, Pricing pressure may affect demand and conduct risk, Obtain list versus realized price and competitor benchmark]
      - [Revenue take rate, No public percentage found in assigned sources, Unavailable, Needed to separate volume growth from monetization, Obtain contract-level revenue recognition policy]
    notes: Official or reported product descriptions are not a price list and do not establish realized revenue, margin, or customer-level economics.
    claimRefs: [CI001, CI011, CI014]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [2024 revenue, 416 million USD, medium, Indicates scale but conflicts in period and issuer basis with another 2026 report, Provide audited statement and revenue bridge]
      - [2025 revenue, 600 million USD, medium, Company-reported growth signal but not independently audited here, Provide audited statement and segment mix]
      - [2024 annual profit, 9.2 million USD, low, Suggests reported accounting profitability but not cash generation, Provide income statement and cash-flow reconciliation]
      - [2023 annual loss, -24.7 million USD, low, Shows recent profitability transition in one reported account, Reconcile with audited historical accounts]
      - [Initial five-year financing facility, 202 million USD, high, Indicates external funding dependency and debt capacity, Provide facility agreements covenants and maturity ladder]
      - [Gross margin, null, unavailable, Needed to assess hardware versus finance economics, Provide product and country gross-margin bridge]
      - [CAC payback, null, unavailable, Needed to test whether cross-sell amortizes acquisition cost, Provide cohort CAC payback and retention]
      - [Delinquency charge-off recovery, null, unavailable, Core credit-risk and cash-availability inputs, Provide vintage portfolio data]
    notes: Values are reported by the cited sources and are not normalized across fiscal periods; null fields are explicit diligence requests, not zeroes.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI010, CI012, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: M-KOPA's public model links financed assets and repayment data to repeat financial services, but public evidence does not quantify conversion or margins.
    data:
      nodes:
        - id: financed-assets
          label: Financed smartphones, solar and other productive assets
          detail: Deposit plus digital micropayments
        - id: customer-payments
          label: Customer deposits and instalments
          detail: Payment cadence is described but not quantified
        - id: repayment-data
          label: Repayment behavior data
          detail: Used to assess eligibility over time
        - id: repeat-services
          label: Digital loans, insurance and other services
          detail: Cross-sell is described; realized mix is unavailable
        - id: capital-funding
          label: Debt and external financing facilities
          detail: IFC reported a wider initial $202 million five-year facility
        - id: reported-revenue
          label: Reported revenue
          detail: 2024 and 2025 figures differ by source and period basis
      edges:
        - from: financed-assets
          to: customer-payments
          label: Assets are sold with deposits and instalments
        - from: customer-payments
          to: repayment-data
          label: Instalments generate repayment history
        - from: repayment-data
          to: repeat-services
          label: Repayment history can support eligibility
        - from: capital-funding
          to: financed-assets
          label: External facilities support receivable growth
        - from: repeat-services
          to: reported-revenue
          label: Product and finance activity contributes to revenue
    approximationNotes: No conversion rates, gross margins, or proportional revenue shares are inferred because the assigned sources do not disclose them.
    claimRefs: [CI001, CI002, CI006]
callouts:
  - calloutType: strength
    title: Credible asset-finance engine
    body: The assigned evidence supports a repeatable mechanism in which deposits, instalments, and repayment data support access to additional products.
    claimRefs: [CI001, CI002, CI005]
  - calloutType: risk
    title: Capital and portfolio data remain underwriting blockers
    body: Public evidence does not disclose cash generation, receivables vintages, delinquency, charge-offs, recovery, realized pricing, or facility covenants.
    claimRefs: [CI006, CI007, CI008, CI014]
  - calloutType: recommendation
    title: Research more before underwriting
    body: Treat reported growth and profitability as promising but provisional until audited accounts and lender-grade portfolio and liquidity evidence are supplied.
    claimRefs: [CI009, CI010, CI014]
