  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Audited statements with segment revenue, gross margin, cash flow, credit losses, and working-capital detail.
      whyItMatters: Reported revenue and profit do not establish cash generation or the economics of each financed product.
      diligencePath: Request audited 2024-2025 financial statements, management accounts, and a revenue-to-cash bridge by country and product.
      relatedQuestionRefs: [QI002, QI006, QI008]
    - type: private-evidence-only
      severity: blocking
      topic: portfolio-quality
      missingEvidence: Receivables vintages, delinquency, charge-offs, recoveries, restructurings, and active-loan balances.
      whyItMatters: The repayment portfolio determines whether reported growth converts into durable cash and capital efficiency.
      diligencePath: Request lender-grade portfolio tapes and cohort performance by product, country, origination month, and repayment status.
      relatedQuestionRefs: [QI007, QI008, QI009]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Country-level list and realized pricing, discounts, fees, customer total cost, and complaint-resolution metrics.
      whyItMatters: Pricing affects demand, conduct risk, collection performance, and revenue quality.
      diligencePath: Request product price books, customer contracts, discount schedules, and complaints/unlock service-level data.
      relatedQuestionRefs: [QI003, QI007]
      relatedTableRefs: [TI002]
    - type: missing-source
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash, debt maturity ladder, warehouse or project-finance covenants, and next-round trigger.
      whyItMatters: A growing receivables book can require fresh capital even when accounting profit is positive.
      diligencePath: Request latest balance sheet, liquidity forecast, facility agreements, covenant headroom, and board-approved funding plan.
      relatedQuestionRefs: [QI005, QI009, QI010]
