  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's customer workflow starts with an asset that would otherwise require a large upfront payment,
              followed by a deposit and daily, weekly, or monthly repayments through mobile-money rails. Public
              descriptions cover solar systems, smartphones, televisions, refrigerators, clean cookstoves, electric
              motorcycles, data bundles, loans, and insurance, but the evidence is uneven by product line. The
              smartphone is increasingly a gateway into financial services rather than only a financed handset:
              TechCabal reports that repayment data is used to qualify customers for additional credit and services. A
              customer-facing limitation is that missed payments can trigger remote device restriction, while public
              reporting also mentions complaints about delays in unlocking after completed payments. The operating model
              therefore depends on accurate payment state, device state, agent support, and fair recovery processes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
