      - number: '4.3'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Public traction supports a credible revenue engine, but the evidence is not sufficient to underwrite
              durability or capital adequacy. IFC reported more than $1 billion of cumulative credit in 2023, but
              cumulative deployment is not outstanding principal, collected cash, or current liquidity. A 2026
              independent fact-check records criticism of financed-phone cost and delays unlocking devices after payment
              completion; this is relevant to collections, customer trust, and operational cost even though it does not
              establish a financial loss. ImpactAlpha reported that M-KOPA was nearing a close on roughly $160 million
              of Series F equity financing in July 2025, but the company had not disclosed final terms. The investment
              case therefore merits further research, contingent on audited accounts, receivables vintages, loss and
              recovery data, liquidity, facility covenants, realized pricing, and final financing terms.
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
