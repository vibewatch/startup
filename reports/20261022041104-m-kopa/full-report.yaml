              - CM006
              - CM007
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's relevant competitive set spans several jobs rather than one software category. It finances
              smartphones and other assets through daily or installment payments, then uses repayment history to extend
              digital credit and adjacent services. That puts it in competition with traditional banks and lenders for
              credit access, device retailers and handset-finance providers for smartphone acquisition, pay-as-you-go
              energy and appliance financiers for asset access, and electric-mobility financiers for productive-asset
              financing. Its reported scale is meaningful: sources describe nearly 10 million customers, more than $2
              billion in deployed credit, operations across five African markets, and a large direct-agent network.
              These are company-reported or media-reported operating indicators, not proof that M-KOPA wins every
              segment. The strategic advantage is the combination of financed hardware, repayment data, distribution,
              and cross-sell; the strategic risk is that a customer can unbundle those needs and choose a cheaper
              device, a bank loan, a retailer installment plan, or a specialist mobility lender.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
              - CP015
