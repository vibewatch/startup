    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Scale and growth
        - 10 million customers and $600 million 2025 revenue were reported
        - Audited statements and country-level revenue bridge
      - - Embedded finance expansion
        - Devices are described as a gateway to lending and insurance
        - Cohort contribution margin after losses and funding costs
      - - Core technology control
        - KilpiTek acquired for $8 million with cash and equity/deferred consideration
        - Post-acquisition integration and measured loss-rate impact
      - - Financing opacity
        - SetterVC warns that its funding and valuation marks may be incomplete or unverified
        - Fully diluted cap table, preferences, debt and cash reconciliation
      - - Governance overhang
        - Series F reporting coincided with an employee-shareholder legal challenge
        - Docket resolution and independent board-process evidence
      - - Market demand
        - Growth spans Kenya, Nigeria, Ghana, Uganda and South Africa
        - Retention, repeat-product and unit-economics disclosure by market
    notes: Arguments are directional investment drivers, not a substitute for a priced transaction model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Reported growth persists; digital-finance cohorts are profitable; losses and funding costs remain controlled
        - Premium to the 2025 primary/secondary reference could be justified, but no numeric target is supportable
        - Low-to-medium until audited cohort data
        - Credit losses, FX or funding costs rise faster than contribution profit
      - - Base
        - Growth continues with a disclosure discount and no confirmed change to preference or debt terms
        - Value around the latest public pricing band only after cap-table and cash verification
        - Most defensible public-evidence case
        - Audited revenue or cash conversion materially trails reported scale
      - - Bear
        - Multiple compression, adverse governance outcome, constrained funding, or weak repeat-product economics
        - Downside is unquantifiable without fully diluted shares and liabilities; avoid new capital
        - Material tail risk
        - Down-round, covenant stress, litigation loss, or persistent portfolio deterioration
    notes: >-
      Scenario ranges are qualitative because the assigned evidence does not disclose audited margins, cash flow, fully
      diluted shares, preference terms, or loss curves.
    claimRefs:
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    summary: >-
      M-KOPA progressed from a 2011 founding and 2012 Kenyan solar launch to multi-product financing and reported 2025
      scale.
    type: timeline
    data:
      items:
        - date: '2011'
          label: Founded
          detail: M-KOPA founded as a fintech platform for underbanked consumers.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2012'
          label: Commercial launch
          detail: Historical account says the first commercial solar home kit launched in Kenya.
          tone: positive
          claimRefs:
            - CO002
        - date: '2015'
          label: Early solar scale
          detail: Historical account reports 150,000 homes powered in Kenya, Uganda and Tanzania.
          tone: positive
          claimRefs:
            - CO002
        - date: '2020'
          label: Smartphone financing
          detail: Later coverage says M-KOPA expanded into smartphone financing in 2020.
          tone: positive
          claimRefs:
            - CO004
        - date: '2023'
          label: Development-finance expansion
          detail: IFC announced $65m equivalent loans inside a wider $202m five-year facility.
          tone: positive
          claimRefs:
            - CO006
        - date: '2025'
          label: Reported scale
          detail: >-
            Coverage reports 10m cumulative customers and $600m revenue, while another analysis reports 3.4m active
            customers and $363.4m contracts-with-customers revenue.
          tone: warning
          claimRefs:
            - CO010
            - CO011
        - date: 2025-07
          label: Series F and legal challenge
          detail: >-
            ImpactAlpha reported more than $590m of debt, equity and grants raised since 2011, a roughly $160m Series F
            term sheet and an employee-shareholder lawsuit.
          tone: adverse
          claimRefs:
            - CO007
            - CO008
            - CO012
        - date: 2026-10
          label: Ten-million-customer milestone
          detail: Syndicated company reporting marked M-KOPA's 15th anniversary and claimed ten million cumulative customers.
          tone: positive
          claimRefs:
            - CO010
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
      - CO007
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Evidence-supported market layers move from broad unmet need to M-KOPA’s observable operating footprint, while the
      investable SAM and SOM remain unquantified.
    data:
      nodes:
        - id: broad-need
          label: African households with unmet energy, device, and financial-access needs
          value: '>500m people lacking reliable electricity in historical context'
          detail: Broad need lens; not an M-KOPA revenue estimate
        - id: asset-finance
          label: PAYG and financed essential or productive assets
          value: Solar, smartphones, mobility and related financed goods
          detail: Category boundary supported by product descriptions
        - id: addressable-countries
          label: M-KOPA operating footprint
          value: Five reported markets
          detail: Kenya, Nigeria, Ghana, Uganda and South Africa
        - id: observed-scale
          label: Reported customer and credit scale
          value: 10m customers; >$2bn credit in selected 2026 coverage
          detail: Reported operating indicators, not market share
        - id: investable-sam
          label: Country/product SAM
          value: Not publicly isolated
          detail: Requires product, country, affordability and repayment cohorts
        - id: obtainable-som
          label: M-KOPA SOM
          value: Not publicly isolated
          detail: Requires share, capacity, funding and competitive conversion data
    approximationNotes: >-
      The pyramid is an ordered evidence lens, not a proportional area chart. Values are not converted into comparable
      units or widths.
    claimRefs:
      - CM005
      - CM007
      - CM008
      - CM012
      - CM017
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      M-KOPA is positioned as a high-access, high-breadth alternative, while other options trade off reach, product
      breadth, or financing convenience.
    data:
      points:
        - label: M-KOPA
          x: 5
          'y': 5
          detail: Reported multi-country asset financing, digital lending, and adjacent products
        - label: Traditional bank
          x: 3
          'y': 4
          detail: Formal credit breadth, but access for thin-file borrowers is less established
        - label: Cash purchase
          x: 2
          'y': 1
          detail: High ownership simplicity, but no financing access for liquidity-constrained buyers
        - label: Informal borrowing
          x: 4
          'y': 1
          detail: Potentially accessible, but limited formal product breadth and protections
        - label: Device-finance specialist
          x: 4
          'y': 3
          detail: Strong device focus, with cross-product breadth not established
        - label: Mobility financier
          x: 3
          'y': 2
          detail: Vertical depth in vehicles, with broader asset and credit scope not established
      xAxis: Relative access for thin-file customers (ordinal)
      yAxis: Relative product breadth across financed assets and financial services (ordinal)
    approximationNotes: >-
      Coordinates are analyst ordinal assessments from the retained evidence, not market-share, price, or performance
      measurements; they should not be read as a quantitative benchmark.
    claimRefs:
      - CP001
      - CP003
      - CP005
      - CP008
      - CP010
      - CP013
      - CP014
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      M-KOPA's public model links financed assets and repayment data to repeat financial services, but public evidence
      does not quantify conversion or margins.
    data:
      nodes:
        - id: financed-assets
          label: Financed smartphones, solar and other productive assets
          detail: Deposit plus digital micropayments
        - id: customer-payments
          label: Customer deposits and instalments
          detail: Payment cadence is described but not quantified
        - id: repayment-data
          label: Repayment behavior data
          detail: Used to assess eligibility over time
        - id: repeat-services
          label: Digital loans, insurance and other services
          detail: Cross-sell is described; realized mix is unavailable
        - id: capital-funding
          label: Debt and external financing facilities
          detail: IFC reported a wider initial $202 million five-year facility
        - id: reported-revenue
          label: Reported revenue
          detail: 2024 and 2025 figures differ by source and period basis
      edges:
        - from: financed-assets
          to: customer-payments
          label: Assets are sold with deposits and instalments
        - from: customer-payments
          to: repayment-data
          label: Instalments generate repayment history
        - from: repayment-data
          to: repeat-services
          label: Repayment history can support eligibility
        - from: capital-funding
          to: financed-assets
          label: External facilities support receivable growth
        - from: repeat-services
          to: reported-revenue
          label: Product and finance activity contributes to revenue
    approximationNotes: >-
      No conversion rates, gross margins, or proportional revenue shares are inferred because the assigned sources do
      not disclose them.
    claimRefs:
      - CI001
      - CI002
      - CI006
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      M-KOPA's public evidence supports a layered PAYG financing and support model, while detailed infrastructure and
      control specifications remain undisclosed.
    data:
      layers:
        - label: Customer and asset layer
          detail: Financed products are the customer-facing endpoints and source of repayment relationships.
          items:
            - label: Financed smartphones
              detail: Customer-facing endpoint; payment-linked controls are described.
            - label: Solar and other financed assets
              detail: PAYG products include solar systems, appliances, and electric motorcycles.
        - label: Payment and control layer
          detail: Mobile-money events and device controls connect asset access to repayment status.
          items:
            - label: Mobile-money repayments
              detail: Daily, weekly, or monthly payment events.
            - label: Device-locking capability
              detail: KilpiTek acquisition brought a critical capability in-house in 2026.
        - label: Data and service layer
          detail: >-
            Repayment history supports risk assessment while agents and financial products support the customer
            relationship.
          items:
            - label: Repayment data and risk analytics
              detail: Payment history is described as a basis for credit assessment.
            - label: Agents and financial services
              detail: Distribution, support, loans, insurance, and data services.
        - label: Distribution layer
          detail: Local agents and partners extend reach beyond bank branches and provide customer touchpoints.
          items:
            - label: Agents and partner channels
              detail: Sales, education, maintenance, and support are described as locally delivered.
        - label: Control and compliance layer
          detail: Payment-linked controls create consumer-protection and operational obligations.
          items:
            - label: Unlock and exception handling
              detail: The assigned sources identify unlock-delay concerns but do not quantify service performance.
        - label: Undisclosed infrastructure layer
          detail: The assigned sources do not establish cloud, API, security, or recovery implementation details.
          items:
            - label: Technical diligence boundary
              detail: Architecture, security certification, model governance, and reliability evidence remain gaps.
    approximationNotes: >-
      Layer order is an analytical presentation of the source-described workflow, not a disclosed implementation
      diagram.
    claimRefs:
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey from financed device to expanded services
    type: journey-map
    summary: >-
      The public evidence supports a sequential acquisition and expansion hypothesis, while leaving the retention and
      concentration stages unquantified.
    data:
      items:
        - stage: 1. Discover
          label: Agent-led access
          title: Affordability-led acquisition
          description: A consumer encounters a financed smartphone or other asset through a local distribution network.
          touchpoints:
            - Sales agent
            - Financed device offer
        - stage: 2. Acquire
          label: Daily instalments
          title: Asset access without full upfront payment
          description: The customer pays in small instalments aligned with daily or irregular income.
          touchpoints:
            - Deposit
            - Daily repayment
        - stage: 3. Use
          label: Device and services
          title: Connectivity and embedded benefits
          description: The smartphone can provide connectivity, device protection, and insurance alongside the financed asset.
          touchpoints:
            - Data
            - Device protection
            - Health insurance
        - stage: 4. Repay
          label: Payment history
          title: Controlled repayment relationship
          description: Repayment data accumulates, while missed payments can trigger remote device locking until payments resume.
          touchpoints:
            - Payment record
            - Remote lock
        - stage: 5. Qualify
          label: Eligibility
          title: Additional financial products
          description: >-
            A completed or seasoned payment relationship can support qualification for loans, insurance, or another
            financed asset.
          touchpoints:
            - Credit decision
            - Follow-on offer
        - stage: 6. Expand
          label: Multi-product use
          title: Longer customer relationship
          description: >-
            Reporting describes customers taking smartphones, digital loans, and mobility products during multi-year
            relationships.
          touchpoints:
            - Digital loan
            - Insurance
            - Mobility asset
        - stage: 7. Verify
          label: Durability diligence
          title: Unproven retention and concentration
          description: >-
            Cohort retention, repeat borrowing, contract completion, and concentration must be verified before treating
            reach as durable value.
          touchpoints:
            - Cohort pack
            - Concentration schedule
    approximationNotes: >-
      Conceptual sequence only. The stages do not share a disclosed population or period, and the figure does not imply
      conversion rates or value-proportional spacing.
    claimRefs:
      - CU005
      - CU011
      - CU012
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Credit and legal risks remain highest because public evidence supplies baselines and controls but not current
      outcome or stress data.
    data:
      columns:
        - label: Likelihood
          detail: Qualitative likelihood supported by reported events or structural exposure
        - label: Impact
          detail: Potential effect on customers, operations, financing, or ownership
        - label: Mitigation maturity
          detail: Publicly evidenced control maturity, not an audit conclusion
      rows:
        - label: Portfolio credit quality
          note: Disclosed default baseline is unaudited and lacks vintage or stress detail
          values:
            - Medium-high
            - High
            - Partial
        - label: Employee-equity litigation
          note: Case exists in reporting; current disposition is unavailable
          values:
            - Unknown
            - High
            - Disputed
        - label: FX and import costs
          note: Company identifies the cost pressures; treasury protection is not disclosed
          values:
            - Medium-high
            - High
            - Partial
        - label: Customer treatment and device access
          note: Complaints and safeguards are both documented
          values:
            - Medium
            - High
            - Partial
        - label: Agent and operating controls
          note: Training is described, while incident and quality outcomes are unavailable
          values:
            - Medium
            - Medium-high
            - Partial
        - label: Supplier and embedded-service partners
          note: Important roles are visible, but concentration and substitution evidence is absent
          values:
            - Medium
            - High
            - Early
    approximationNotes: Cells are qualitative, evidence-bounded judgments; they are not measured probabilities or company risk ratings.
    claimRefs:
      - CR001
      - CR005
      - CR009
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported operating scale and financing signals support further diligence, while disclosure and governance gaps cap
      the recommendation at research-more.
    data:
      nodes:
        - id: scale
          label: Reported scale
          detail: 10 million customers and $600 million 2025 revenue were reported
        - id: model
          label: Financing model
          detail: Device repayment data supports lending and adjacent services
        - id: price
          label: Price context
          detail: 2025 primary and secondary share-price references exist
        - id: gaps
          label: Material gaps
          detail: Audited economics, cap table, portfolio quality, and governance remain incomplete
        - id: decision
          label: Research-more
          detail: Require lender-grade and shareholder-grade diligence before entry
        - id: verify
          label: Verify
          detail: Reassess price after the requested evidence is delivered
      edges:
        - - scale
          - model
        - - model
          - price
        - - price
          - gaps
        - - gaps
          - decision
        - - decision
          - verify
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV013
      - CV014
