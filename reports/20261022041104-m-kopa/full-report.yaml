      - number: '3.2'
        title: Buyer comparison and capability trade-offs
        blocks:
          - type: paragraph
            body: >-
              For an underserved consumer, the buying decision is likely to center on upfront affordability, approval
              access, product availability, repayment convenience, and trust in collections and device controls.
              M-KOPA's reported proposition is strongest where a customer lacks formal credit and needs an asset
              immediately: a financed phone can serve as both the product and the source of repayment data for later
              lending. Its agent footprint and local assembly efforts may also improve reach. The trade-off is
              total-cost and conduct risk: reporting describes concerns that cumulative payments can exceed retail
              prices, complaints about delayed unlocking, and questions about aggressive collection. Banks may offer
              lower-cost credit to qualified borrowers but have stricter underwriting and less product distribution;
              cash purchase avoids financing and lock-in but requires liquidity; specialist providers may offer deeper
              product expertise but less cross-product data. Unsupported competitor pricing or default comparisons
              remain evidence gaps rather than filled matrix cells.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.3'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's moat is plausible but not yet demonstrated as durable by the available public evidence. Repayment
              histories and device-control infrastructure can lower information barriers for first-time borrowers, while
              agents and local operations create distribution density. A customer who has built a payment record or
              depends on an active financed device may face practical switching costs. However, these are not the same
              as contractual lock-in: customers can use other lenders, buy phones for cash, or choose rival
              asset-finance products when alternatives are available. The model also has exposure to credit losses,
              currency volatility, debt funding costs, consumer-protection rules, and reputational damage from
              collection practices. The June 2026 misinformation episode shows that device-locking and enforcement
              narratives can spread rapidly even when fact-checkers find no evidence of mass arrests; it does not
              establish that the underlying customer complaints are false. Durability therefore depends on responsible
              underwriting, transparent pricing, and continued distribution execution, not only on customer count.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Data-plus-distribution differentiation
            body: >-
              The combination of financed devices, repayment data, agents, and adjacent products is more differentiated
              than a standalone handset loan, provided portfolio quality and customer trust hold.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP005
          - type: callout
            title: Affordability and conduct can erase the moat
            body: >-
              A cheaper cash alternative or a customer-protection failure could weaken retention and invite banks,
              telecoms, or specialist lenders to compete for the same job.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              M-KOPA finances productive assets through an upfront deposit followed by digital micropayments, with
              smartphones functioning as both a financed product and an entry point to later loans, insurance, and other
              services. Public descriptions support a layered monetization model rather than a pure software
              subscription: the company earns from financed devices and lending-related services, while repayment data
              can support repeat customer eligibility. A 2026 company-reported account says revenue reached $600 million
              in fiscal 2025, up 45% from 2024, while another 2026 account reports $416 million of 2024 revenue; the
              differing periods and evidence quality require reconciliation before either figure is used in a model.
              List or contract pricing, realized take rates, revenue recognition by product, and the split between
              device revenue, finance income, insurance, and other services are not publicly established in the assigned
              evidence.
