              - CE009
      - number: '5.3'
        title: Differentiation, deployment, and scale
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's differentiation is the combination of asset financing, mobile payments, device-level control,
              local distribution, and subsequent financial services. Current sources describe operations across Kenya,
              Uganda, Nigeria, Ghana, and South Africa, while older descriptions document the model's evolution from
              solar kits to smartphones and other assets. Company-issued figures reproduced by Africa Fintech Network
              claim 10 million cumulative customers, 23 micropayments processed per second, and approximately 10,000 new
              customers onboarded daily. These figures are not independently audited in the assigned pool, and they do
              not reveal per-country uptime, device mix, repayment latency, or service-level performance. The system's
              practical scalability appears credible, but public technical disclosures are insufficient to measure
              reliability.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, safety, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The product's technical controls are also credit and consumer-protection controls. Remote locking can
              protect financed assets, but it creates operational and reputational exposure if payment records, identity
              matching, device status, or unlock workflows are wrong. AllAfrica's fact-checking reports that financed
              phones can be remotely locked when payments are missed and notes complaints about delays in unlocking
              after customers complete payments; it found no evidence for a viral claim of mass arrests. CTOL separately
              reports concerns about cumulative repayment cost and aggressive debt collection, but that account is not a
              primary investigation and should be treated as a reported concern rather than a verified incident rate.
              The assigned sources do not establish security certification, breach history, privacy architecture, model
              fairness testing, recovery performance, or independent quality audits. These are material diligence
              requests before treating the platform as lender-grade infrastructure.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical control of a critical component
            body: >-
              The KilpiTek acquisition gives M-KOPA direct control over a device-locking capability that is central to
              its smartphone-financing workflow, although integration outcomes remain unreported.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Lender-grade technical evidence is incomplete
            body: >-
              Public sources describe the workflow and reported scale but do not establish security controls, model
              governance, reliability metrics, or unlock-service performance.
            calloutType: risk
            claimRefs:
              - CE008
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, payers, and use cases
        blocks:
          - type: paragraph
            body: >-
              M-KOPA primarily addresses consumers whose irregular income or limited access to conventional credit makes
              the upfront price of a smartphone or other asset difficult to absorb. Company-linked reporting places the
              platform across Kenya, Nigeria, Ghana, Uganda, and South Africa, while the strongest segment detail comes
              from Ghana. There, M-KOPA's impact-report figures describe more than 550,000 customers receiving over GHS
              1.2 billion of credit since 2021; 44% reportedly accessed a formal financial product for the first time
              and 36% said the financed smartphone was their first phone. These disclosures support a
              financial-inclusion use case, but they do not provide revenue, repayment, or active-customer denominators
              by segment.
            claimRefs:
              - CU001
              - CU006
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU010
      - number: '6.2'
        title: Adoption scale and trajectory
        blocks:
          - type: paragraph
            body: >-
              The disclosed acquisition trajectory is substantial but definition-sensitive. ImpactAlpha reported more
              than five million credit customers in July 2025, while company-syndicated coverage in October 2026
              reported a cumulative 10 million customers, three million additions over the preceding 12 months, and
              approximately 10,000 daily onboardings. The figures point to rapid expansion, yet the sources do not
              reconcile "served," "joined," and "active" customers or provide comparable period-end populations. Ghana
              adds a market-level signal: sales reportedly grew fourfold after the More than a Phone rollout reached all
              16 regions through more than 3,000 agents. That is evidence of distribution momentum, not a retention
              rate.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Customer proof and customer-experience signals
        blocks:
          - type: paragraph
            body: >-
              The retained evidence is cohort-based rather than customer-specific. Ghana survey figures report that 54%
              of customers earned more after acquiring a smartphone and 76% experienced improved quality of life, while
              more than one million Kenyan customers reportedly received embedded health insurance in one year. Those
              are useful outcome signals, but they are company- or partner-reported aggregates without named-user
              verification, sampling detail, renewal data, or claims experience. On the adverse side, independent
              fact-checking notes criticism of financed-phone costs and occasional unlock delays after repayment, while
              finding no evidence for viral claims that millions of customers faced arrest. The distinction matters:
              documented complaints warrant diligence, but unsupported mass-arrest claims do not.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Expansion mechanics and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Public reporting supports a plausible land-and-expand mechanism. Customers may become eligible for other
              financed assets after completing an initial plan, smartphone repayment data can support later lending or
              insurance offers, and company-linked reporting says multi-product use increased during multi-year
              relationships. Device locking strengthens payment enforcement for financed phones, but it does not
              establish that customers will remain, renew, or repay unsecured products when the collateral mechanism
              changes. A low-quality independent analysis reports Nigeria defaults below a company-reported 10% average,
              which is directionally useful but not lender-grade evidence. No retained source supplies GRR, NRR, churn,
              completed-contract cohorts, repeat-borrowing rates, contract length, or customer and channel
              concentration.
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU011
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled acquisition with measurable Ghana outcomes
            body: >-
              M-KOPA's cumulative reach is supported by current company-linked reporting, while Ghana adds concrete
              first-phone, first-finance, and self-reported income outcomes.
            calloutType: strength
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU009
          - type: callout
            title: Reach is not retention
            body: >-
              The assigned evidence does not disclose comparable active-customer, renewal, churn, repeat-borrowing, or
              concentration metrics, so customer durability remains a material underwriting gap.
            calloutType: risk
            claimRefs:
              - CU002
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and residual exposure
        blocks:
          - type: paragraph
            body: >-
              The risk posture is driven by the interaction of credit scale, hardware, and multi-country execution
              rather than by one isolated event. TechCabal reported M-KOPA's statement that it had served nearly 10
              million customers and deployed more than $2 billion in credit by June 2026. A syndicated company update
              later described onboarding of about 10,000 customers per day and payment processing at 23 transactions per
              second. Those figures indicate operating leverage, but they also make weak portfolio performance, payment
              disruption, customer-service failures, or funding constraints capable of propagating quickly. The heatmap
              therefore ranks credit, legal, customer-treatment, foreign-exchange, agent, and supplier risks using
              observed dependencies and disclosed gaps; it does not treat cumulative credit or customer counts as
              evidence of current credit quality.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and customer-protection exposure
        blocks:
          - type: paragraph
            body: >-
              ImpactAlpha reported that a case filed in May 2025 in Kenya's Employment and Labor Relations Court
              challenges M-KOPA's 2019-2022 share restructuring and alleges disproportionate dilution of ordinary
              shareholders, including employee-plan participants. M-KOPA called the allegations baseless and denied
              racial disparities, but the assigned evidence does not provide a current docket outcome. Customer
              treatment is a separate risk surface. Africa Check reported criticism of financed-phone total cost and
              occasional complaints about delayed unlocking after full repayment. M-KOPA says customers face no late
              fees or penalties and can return products for a full deposit refund and release from further payments.
              Those safeguards mitigate exposure, but company-described terms do not replace country-level licensing,
              complaint, unlock-time, privacy, and enforcement records.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.3'
        title: Portfolio, operational, and technology execution
        blocks:
          - type: paragraph
            body: >-
              Portfolio quality is the central unquantified financial risk. Startup Reality Check characterized M-KOPA's
              disclosed 10% average default rate as unaudited and not a stress test, while Today Africa identifies
              irregular and seasonal household income as a structural repayment risk for the PAYG model. Import taxes,
              foreign-exchange shortages, and distribution markups add pressure before credit losses: M-KOPA's impact
              report says those factors materially inflate smartphone retail prices. Execution also relies on a network
              of more than 35,000 agents, payment processing, remote device controls, customer support, and physical
              quality assurance. Company-reported governance, training, and compliance resources are meaningful
              mitigants, but they do not reveal country and product vintages, delinquency, charge-offs, recoveries,
              fraud losses, uptime, security incidents, or complaint outcomes.
            claimRefs:
              - CR005
              - CR006
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Dependencies, mitigations, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's product is an ecosystem: Ghana coverage describes daily instalments bundling devices, data,
              insurance, and device protection, and the company identifies HMD as its largest supplier. The same
              coverage says M-KOPA attributed fourfold Ghana sales growth to deployment through more than 3,000 agents
              across all 16 regions, illustrating how distribution and partner performance can amplify both growth and
              failure. The investment case should break if an employee-equity judgment materially changes ownership
              economics, the disclosed default baseline deteriorates materially, post-payment device access failures
              become systemic, or a material supplier or embedded-service partner cannot be replaced without disrupting
              originations or customers. Management should substantiate mitigations with current court records,
              portfolio and treasury data, incident logs, partner SLAs, concentration schedules, business-continuity
              tests, and country-specific regulatory approvals.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR008
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment kill criteria
            body: >-
              Break the thesis on a material adverse employee-equity judgment, a material deterioration from the
              disclosed default baseline, systemic post-payment device-access failures, or non-substitutable disruption
              at a material supplier or embedded-service partner.
            calloutType: risk
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              M-KOPA's thesis rests on scale, growth, and a financing model that uses device repayment data to expand
              into digital credit and adjacent products. The company reported 10 million customers and $600 million of
              2025 revenue in one October 2026 account, while TechCabal described more than $2 billion of credit
              deployed and a smartphone-led path into lending and insurance. The acquisition of KilpiTek for $8 million
              also suggests management is investing to control a core device-locking capability rather than merely
              reselling third-party infrastructure. These are material operating signals, but most figures are
              company-reported or reported by outlets quoting company management rather than audited public filings. The
              anti-thesis is therefore disclosure and financing risk: ImpactAlpha described a $160 million Series F term
              sheet with roughly half fresh capital and half shareholder liquidity while reporting a shareholder-rights
              lawsuit alleging irregular dilution. That combination makes headline funding totals and implied equity
              value poor substitutes for a fully diluted, preference-adjusted valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest identifiable primary/secondary pricing context is the 2025 Series F process: ImpactAlpha
              reported that M-KOPA was nearing a close on a roughly $160 million term sheet led by Sumitomo, with exit
              pricing between $26 and $27.15 depending on share class. The same report said about half of the financing
              would provide fresh capital and the other half would offer early holders an exit, which creates a
              materially different interpretation from treating the entire amount as growth capital. SetterVC separately
              labels its secondary signals unverified, lists an approximately $37.02 new-share price and $26-$27.15
              secondary band, and describes a potential $30 million debt facility as pending rather than closed. The
              public record therefore supports an indeterminate valuation stance, not a precise mark or evidence that
              the present price is attractive. Entry should be conditional on a cap table, preference stack, debt
              covenants, audited revenue-to-cash reconciliation, and portfolio loss data; without them, a buyer cannot
              distinguish operating scale from financing leverage or shareholder liquidity.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario logic, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              A bull case is possible if reported customer and revenue growth converts into durable cash generation,
              repeat product adoption, and controlled credit losses across five operating markets. A base case assumes
              continued growth but applies a disclosure discount until management supplies lender-grade portfolio
              vintages, recoveries, country mix, and audited statements. The bear case is driven by multiple
              compression, funding or warehouse constraints, adverse governance outcomes, and evidence that customer
              growth or reported revenue does not translate into attractive risk-adjusted returns. The available
              evidence does not justify a target return or exit multiple: there is no public, audited basis here for
              gross margin, cash burn, net retention, portfolio delinquency, or fully diluted share count.
              Recommendation logic should therefore be treated as a gated diligence decision rather than a precise
              intrinsic-value output. The most decision-relevant next steps are to verify Series F terms and current
              marks, reconcile funding with cash available, obtain the legal docket and board materials, and test
              whether device-led acquisition produces profitable digital-finance cohorts after losses, servicing,
              funding costs, and FX.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not premium entry
            body: >-
              Public evidence supports a scaled and potentially valuable platform, but not a precise or premium
              valuation. The underwriting decision should remain conditional on audited financials, cohort loss data,
              financing terms, and governance resolution.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV014
              - CV015
          - type: callout
            title: The key risk is not only growth
            body: >-
              A large customer and revenue footprint can coexist with funding, credit, FX, preference, and governance
              risks. The current record does not establish risk-adjusted cash returns to new equity.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
