      - number: '1.1'
        title: Identity, product model and operating footprint
        blocks:
          - type: paragraph
            body: >-
              M-KOPA was founded in 2011 as a fintech platform for underbanked consumers, combining digital
              micropayments with Internet-of-Things technology. IFC describes its model as a small deposit followed by
              digital micropayment instalments for productive assets, while Sumitomo describes smartphones, solar home
              systems and electric motorbikes as the core financed products. The company's evolution is therefore better
              understood as an asset-financing and data-enabled credit platform than as a single-product solar business.
              Public sources place its operating footprint in Kenya, Uganda, Nigeria and Ghana in 2023, and later
              reporting adds South Africa. Current sources apply different headquarters lenses: one calls M-KOPA
              UK-headquartered, while another calls it Nairobi-headquartered, consistent with a possible
              corporate-versus-operating distinction that remains unverified. The 2025 operating narrative says
              smartphones, digital loans and electric mobility increasingly sit alongside the original solar
              proposition, but the public record does not provide a current country-by-country revenue or portfolio
              split.
