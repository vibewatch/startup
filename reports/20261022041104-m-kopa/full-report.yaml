      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic user is an underbanked or thin-file consumer seeking an essential or productive asset; the
              payer is usually that same customer, making small recurring payments from volatile income. The budget
              owner is therefore household cash flow rather than a formal procurement department. Distribution partners,
              agents, manufacturers, telcos, and mobile-money providers influence acquisition and trust, while M-KOPA or
              its funding partners bear underwriting, inventory, and collections exposure. Adoption begins with a
              concrete asset need and a small deposit, then can expand into additional assets, digital loans, or
              insurance after repayment behavior is observed. This is a different path from a conventional software
              sale: affordability, availability, device utility, payment convenience, and confidence that service will
              continue all matter before a customer can become a repeat borrower.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include the affordability gap for smartphones and other assets, limited access to bank
              credit, mobile-money familiarity, and the ability to build a repayment record through an asset already
              valued by the customer. M-KOPA’s reported scale and product expansion suggest that the same financing
              architecture can be reused across asset classes. Constraints are equally structural: local-currency
              repayment against imported or dollar-linked costs, hardware and logistics intensity, dependence on agents
              and payment partners, affordability and consumer-protection scrutiny, and uncertainty over whether asset
              repayment predicts unsecured-credit performance. Public sources use different vintages and distinguish
              active customers from cumulative customers served, while disclosing no lender-grade vintage, delinquency,
              charge-off, recovery, or product-level margin pack. Valuation should therefore reward distribution and
              data-network optionality without treating reported customer growth as proof of a fully separable SAM,
              durable take rate, or stress-tested credit book.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is a financing architecture, not one product category
            body: >-
              M-KOPA’s strongest market evidence is the reuse of installment collection, distribution, and repayment
              data across assets; the unresolved question is how much of the resulting economics remains company-owned
              after funding, partner, credit, and hardware costs.
            calloutType: insight
            claimRefs:
              - CM010
              - CM014
              - CM018
          - type: callout
            title: Scale metrics are not interchangeable
            body: >-
              The 2025 impact-report figures distinguish active customers from cumulative customers served, while
              October 2026 coverage reports a later cumulative total. Customer, credit-deployed, and ecosystem-funding
              values should retain their periods and denominators rather than being blended into market share.
            calloutType: risk
            claimRefs:
