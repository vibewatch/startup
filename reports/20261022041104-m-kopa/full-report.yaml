      - number: '4.2'
        title: Capital structure, cost drivers, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The model is capital intensive because M-KOPA must finance receivables and inventory while maintaining
              distribution and service operations. IFC reported a $50 million equivalent multicurrency loan to the
              Kenyan subsidiary and a $15 million equivalent local-currency loan to the Ugandan subsidiary in 2023, as
              part of a wider initial $202 million five-year financing facility. The same source describes customer
              deposits and instalments, but does not disclose borrowing costs, warehouse advance rates, delinquency
              triggers, or cash available to the parent. Public descriptions point to mobile-money collection, remote
              device controls, field sales, service centers, and local assembly as major cost and risk drivers; however,
              gross margin, servicing cost per account, credit losses, and working-capital turns remain private. The
              reported first profit is encouraging but does not substitute for cash-flow and portfolio-level evidence.
            claimRefs:
