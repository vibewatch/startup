  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not “African fintech” in the abstract. M-KOPA’s observable wedge is financed access
              to essential or income-enabling assets for consumers who often lack conventional bank credit, with
              repayment collected in small installments through mobile-money rails. The included spend therefore covers
              financed smartphones, solar and other energy products, electric mobility assets, and adjacent digital
              credit or insurance that can be underwritten from repayment history. It excludes general-purpose banking,
              unfinanced handset retail, utility generation sold to commercial customers, and unrelated remittance or
              payments volume. The status quo is a mix of cash purchase, informal credit, mobile-money lenders, telco or
              retailer installment plans, and simply remaining unserved. This boundary matters because headline customer
              counts describe reach, not the value of financed assets or the profitability of the credit relationship.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a clean, independently audited TAM/SAM/SOM for M-KOPA’s exact product
              boundary. The evidence supports several narrower sizing lenses instead. Company-issued coverage in October
              2026 reports 10 million cumulative customers, while TechCabal describes more than $2 billion of credit
              deployed and nearly 10 million customers; these are operating-scale indicators, not market size. A
              historical market-development lens describes over half a billion Africans lacking reliable electricity,
              while current operating evidence shows five-country reach and rapid customer additions. A capital-market
              lens shows that the surrounding African startup ecosystem can attract substantial funding, but ecosystem
              funding is not M-KOPA’s addressable revenue. The defensible conclusion is that the opportunity is material
              and multi-asset, while the investable SAM and obtainable SOM remain diligence gaps requiring cohort,
              country, product, and repayment data.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
