      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The public operating architecture is best understood as a connected financing workflow rather than a
              disclosed software stack. Mobile-money integrations carry repayments; a financed device or other asset
              supplies the controlled endpoint; payment events create a customer history; analytics and AI models are
              described as inputs to lending decisions; and agents provide distribution, education, maintenance, and
              support. The March 2026 KilpiTek acquisition is the clearest current signal of vertical integration:
              M-KOPA said it was bringing in-house a critical device-locking capability to strengthen control of a key
              technology-stack component and support product and sourcing strategy. This may reduce third-party
              dependency, but the available source does not disclose APIs, cloud architecture, model governance, uptime,
              recovery objectives, or controls for erroneous lockouts.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
