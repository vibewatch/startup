company:
  name: M-KOPA
chapter:
  number: 3
  title: Competitors
  summary: M-KOPA competes through a bundled asset-financing and digital-credit model rather than a single device product. Its scale, repayment data, agent network, and product expansion create differentiation, but the same model remains exposed to cheaper cash or bank alternatives, customer affordability concerns, and competitor responses in lending and mobility.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: "M-KOPA's relevant competitive set spans several jobs rather than one software category. It finances smartphones and other assets through daily or installment payments, then uses repayment history to extend digital credit and adjacent services. That puts it in competition with traditional banks and lenders for credit access, device retailers and handset-finance providers for smartphone acquisition, pay-as-you-go energy and appliance financiers for asset access, and electric-mobility financiers for productive-asset financing. Its reported scale is meaningful: sources describe nearly 10 million customers, more than $2 billion in deployed credit, operations across five African markets, and a large direct-agent network. These are company-reported or media-reported operating indicators, not proof that M-KOPA wins every segment. The strategic advantage is the combination of financed hardware, repayment data, distribution, and cross-sell; the strategic risk is that a customer can unbundle those needs and choose a cheaper device, a bank loan, a retailer installment plan, or a specialist mobility lender."
    claimRefs: [CP001, CP002, CP003, CP004, CP013, CP014, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Buyer comparison and capability trade-offs
    body: "For an underserved consumer, the buying decision is likely to center on upfront affordability, approval access, product availability, repayment convenience, and trust in collections and device controls. M-KOPA's reported proposition is strongest where a customer lacks formal credit and needs an asset immediately: a financed phone can serve as both the product and the source of repayment data for later lending. Its agent footprint and local assembly efforts may also improve reach. The trade-off is total-cost and conduct risk: reporting describes concerns that cumulative payments can exceed retail prices, complaints about delayed unlocking, and questions about aggressive collection. Banks may offer lower-cost credit to qualified borrowers but have stricter underwriting and less product distribution; cash purchase avoids financing and lock-in but requires liquidity; specialist providers may offer deeper product expertise but less cross-product data. Unsupported competitor pricing or default comparisons remain evidence gaps rather than filled matrix cells."
    claimRefs: [CP005, CP006, CP007, CP008, CP013, CP014, CP015]
    tableRefs: [TP002]
  - id: durability-risks
    title: Moat durability, switching costs, and displacement risk
    body: "M-KOPA's moat is plausible but not yet demonstrated as durable by the available public evidence. Repayment histories and device-control infrastructure can lower information barriers for first-time borrowers, while agents and local operations create distribution density. A customer who has built a payment record or depends on an active financed device may face practical switching costs. However, these are not the same as contractual lock-in: customers can use other lenders, buy phones for cash, or choose rival asset-finance products when alternatives are available. The model also has exposure to credit losses, currency volatility, debt funding costs, consumer-protection rules, and reputational damage from collection practices. The June 2026 misinformation episode shows that device-locking and enforcement narratives can spread rapidly even when fact-checkers find no evidence of mass arrests; it does not establish that the underlying customer complaints are false. Durability therefore depends on responsible underwriting, transparent pricing, and continued distribution execution, not only on customer count."
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
