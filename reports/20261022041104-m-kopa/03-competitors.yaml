      - [Sun King, PAYG energy, "Not established in the assigned evidence", "Off-grid households; solar products financed through PAYG", "Named as an energy peer, but no normalized pricing, funding, or portfolio metric is available"]
      - [d.light, PAYG energy, "Not established in the assigned evidence", "Off-grid households; solar kits, lanterns, and home systems", "Named as an energy peer; comparative scale and credit performance remain unsupported"]
      - [Bboxx, PAYG energy, "Not established in the assigned evidence", "Households and communities; solar systems, clean cooking, and mini-grids", "Government partnerships and smart-meter positioning are reported, but no like-for-like economics are available"]
      - [Zola Electric, Energy systems, "Not established in the assigned evidence", "Residential and commercial users; solar and battery systems", "Higher-capacity energy focus differs from M-KOPA's smartphone-led acquisition model"]
      - [ENGIE Energy Access, Energy incumbent / PAYG, "Not established in the assigned evidence", "Off-grid households and communities; solar PAYG and mini-grids", "Parent backing may support distribution, while fintech breadth is not established here"]
      - [Lumos, PAYG energy, "Not established in the assigned evidence", "Off-grid households; telecom-distributed solar systems", "Telecom distribution is strategically relevant, but current breadth and economics are unknown"]
      - [Branch, Digital lender, "Not established in the assigned evidence", "Underbanked borrowers; mobile microloans", "Digital underwriting competes for credit demand without M-KOPA's reported asset bundle"]
      - [Tala, Digital lender, "Not established in the assigned evidence", "Underbanked borrowers; mobile microloans", "Fast digital credit competes for the same borrower but does not establish financed-device distribution"]
      - [Jumo, Financial-services platform, "Not established in the assigned evidence", "Banks and telecoms serving borrowers; lending infrastructure", "An enablement model could help incumbents reproduce parts of M-KOPA's credit stack"]
      - ["Cash purchase, formal lending, or informal borrowing", Status quo / substitute, "No comparable market shares retained", "Customers solving device access or liquidity without M-KOPA's bundled contract", "These alternatives can unbundle ownership from M-KOPA, but affordability and protections vary"]
    notes: "Partial landscape based primarily on one comparative overview plus M-KOPA-focused reporting; competitor funding, current scale, pricing, and portfolio performance were not independently verified in the assigned pool."
    claimRefs: [CP001, CP002, CP003, CP004, CP013, CP014, CP015]
  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, M-KOPA, PAYG energy peers, Digital lenders, Status quo / substitute, Evidence status and implication]
    rows:
      - [Upfront affordability, "Daily or installment payments for financed assets", "PAYG financing reported, exact peer terms unknown", "Cash credit where approved; exact terms unknown", "Cash requires liquidity; informal terms vary", "Only M-KOPA's contract structure is directly described in multiple retained sources"]
      - [Access for thin-file borrowers, "Repayment behavior is used to build a credit profile", "Asset-backed access is reported at category level", "Mobile underwriting targets underbanked borrowers", "Personal trust, collateral, or cash substitutes", "Approval rates and borrower overlap were not retained"]
      - [Distribution, "Nearly 50,000 sales agents reported for 2025", "Field, government, or telecom channels reported for selected peers", "Primarily mobile or bank / telecom infrastructure", "Retailers, banks, and personal networks", "No like-for-like agent productivity or acquisition-cost benchmark is available"]
      - [Product breadth, "Smartphones, loans, insurance or data, mobility, and earlier solar", "Energy products and, for some peers, mini-grids or clean cooking", "Loans or lending infrastructure", "One-off purchase or general-purpose credit", "M-KOPA's breadth supports cross-sell but raises execution complexity"]
      - [Repayment controls, "Financed devices can be remotely locked after missed payments", "Remote PAYG controls are a category capability", "Collections and account controls; device control not established", "No lender device control for cash purchases", "Control can support recovery while increasing conduct and trust sensitivity"]
      - [Trust and total cost, "Access benefit versus reported cumulative-cost and collection concerns", "Comparable total cost not retained", "Comparable APR and collection outcomes not retained", "Cash avoids finance charges; informal protection varies", "Unsupported values remain unknown rather than scored"]
    notes: "Cells distinguish reported capabilities from unknown competitor benchmarks; no unsupported competitor price, default rate, or service-level value is supplied."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP013, CP014, CP015, CP016]
  - id: TP003
    title: Pricing, packaging, and switching-cost comparison
    columns: [Alternative, Price / contract model visible in retained evidence, Included capability, Switching or lock-in mechanism, Diligence implication]
    rows:
      - [M-KOPA financed asset, "Installment or daily micropayment model; exact customer APR and realized price not retained", "Asset access plus repayment record and possible adjacent financial services", "Device may be remotely locked when payments are missed", "Obtain representative contracts, total-cost disclosures, delinquency cure rates, and unlocking SLAs"]
      - [M-KOPA digital lending, "Digital loan product reported; rate and fee schedule not retained", "Credit extension based partly on repayment data", "Data relationship and repayment history may reduce friction", "Separate device-finance economics from cash-loan economics and test repeat-borrower profitability"]
      - [Bank or formal lender, "Customer-specific loan pricing; comparable public price not retained", "Cash credit without financed-device dependency", "Underwriting relationship and account switching costs", "Benchmark approval rates, APR, collateral, and turnaround for thin-file customers"]
      - [Cash purchase, "Retail price paid upfront", "Immediate ownership without lender controls", "Low financing lock-in; liquidity is the constraint", "Compare total cost against financed alternatives for the same devices"]
      - [Informal borrowing, "Negotiated or relationship-based terms", "Flexible access where formal credit is unavailable", "Social relationship or collateral", "Measure consumer protection and effective cost rather than assume it is cheaper"]
      - [Specialist asset or mobility financier, "Product-specific financing; public comparable terms not retained", "Deeper vertical expertise or supplier access", "Product ecosystem and servicing relationship", "Test whether M-KOPA's cross-product data advantage offsets specialist pricing and service"]
    notes: "The retained pool supports the contract-model distinctions but not a comparable price sheet; unknown values are intentionally left as diligence requests."
    claimRefs: [CP006, CP008, CP009, CP010, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: M-KOPA is positioned as a high-access, high-breadth alternative, while other options trade off reach, product breadth, or financing convenience.
    data:
      points:
        - {label: M-KOPA, x: 5, y: 5, detail: "Reported multi-country asset financing, digital lending, and adjacent products"}
        - {label: Traditional bank, x: 3, y: 4, detail: "Formal credit breadth, but access for thin-file borrowers is less established"}
        - {label: Cash purchase, x: 2, y: 1, detail: "High ownership simplicity, but no financing access for liquidity-constrained buyers"}
        - {label: Informal borrowing, x: 4, y: 1, detail: "Potentially accessible, but limited formal product breadth and protections"}
        - {label: Device-finance specialist, x: 4, y: 3, detail: "Strong device focus, with cross-product breadth not established"}
        - {label: Mobility financier, x: 3, y: 2, detail: "Vertical depth in vehicles, with broader asset and credit scope not established"}
      xAxis: "Relative access for thin-file customers (ordinal)"
      yAxis: "Relative product breadth across financed assets and financial services (ordinal)"
    approximationNotes: "Coordinates are analyst ordinal assessments from the retained evidence, not market-share, price, or performance measurements; they should not be read as a quantitative benchmark."
    claimRefs: [CP001, CP003, CP005, CP008, CP010, CP013, CP014, CP015, CP016]
callouts:
  - calloutType: strength
    title: Data-plus-distribution differentiation
    body: "The combination of financed devices, repayment data, agents, and adjacent products is more differentiated than a standalone handset loan, provided portfolio quality and customer trust hold."
    claimRefs: [CP001, CP003, CP005]
  - calloutType: risk
    title: Affordability and conduct can erase the moat
    body: "A cheaper cash alternative or a customer-protection failure could weaken retention and invite banks, telecoms, or specialist lenders to compete for the same job."
    claimRefs: [CP008, CP009, CP011]
