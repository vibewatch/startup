company:
  name: M-KOPA
chapter:
  number: 1
  title: Company Overview
  summary: >-
    M-KOPA is a pan-African asset-financing fintech founded in 2011 that moved from
    pay-as-you-go solar into smartphones, digital credit, insurance and electric
    mobility. Current reporting describes rapid 2025 scale, but the evidence base
    contains material differences between active-customer, cumulative-customer and
    revenue definitions, as well as unresolved governance and lending-risk questions.
sections:
  - id: identity-and-model
    title: Identity, product model and operating footprint
    body: >-
      M-KOPA was founded in 2011 as a fintech platform for underbanked consumers,
      combining digital micropayments with Internet-of-Things technology. IFC describes
      its model as a small deposit followed by digital micropayment instalments for
      productive assets, while Sumitomo describes smartphones, solar home systems and
      electric motorbikes as the core financed products. The company's evolution is
      therefore better understood as an asset-financing and data-enabled credit
      platform than as a single-product solar business. Public sources place its
      operating footprint in Kenya, Uganda, Nigeria and Ghana in 2023, and later
      reporting adds South Africa. Current sources apply different headquarters
      lenses: one calls M-KOPA UK-headquartered, while another calls it
      Nairobi-headquartered, consistent with a possible corporate-versus-operating
      distinction that remains unverified. The 2025 operating narrative says
      smartphones, digital loans and electric mobility increasingly sit alongside
      the original solar proposition, but the public record does not provide a current
      country-by-country revenue or portfolio split.
    claimRefs: [CO001, CO002, CO003, CO004, CO016]
    tableRefs: [TO001]
  - id: leadership-funding-and-stakeholders
    title: Leadership, capital and stakeholder structure
    body: >-
      Jesse Moore is identified by IFC as M-KOPA's CEO and co-founder; a historical
      account names Nick Hughes and Chad Larson as the other founders. The current
      public evidence does not enumerate a complete executive committee, board,
      ownership table or control rights, so key-person dependence and governance
      should be treated as open diligence items rather than inferred from investor
      names. Capital evidence is also heterogeneous: IFC records a $50 million
      equivalent Kenya loan and a $15 million Uganda loan within a wider initial
      $202 million, five-year financing facility in 2023, while ImpactAlpha reported
      a roughly $160 million Series F term sheet in 2025 and a shareholder-rights
      lawsuit. These are financing events, not a single comparable measure of cash
      available, total raised or post-money valuation.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO012]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-gaps
    title: Scale, milestones and evidence limits
    body: >-
      Recent coverage reports a sharp expansion in scale: ten million cumulative
      customers and $600 million of 2025 revenue, with three million customers added
      in the prior twelve months. A separate 2025 financial analysis reports 3.4
      million active customers, $363.4 million of revenue from contracts with
      customers, and a $4.8 million net profit, while also describing a $69.0 million
      operating cash outflow and a material expected-credit-loss provision. These
      figures may reflect different scopes or reporting bases, so they should not be
      collapsed into one KPI without the underlying accounts and definitions. The
      evidence supports a milestone sequence from founding and solar deployment to
      smartphone financing, development-finance debt, expanded product lines and
      2025 scale; it does not support a verified current valuation, ARR, cap table,
      full board roster or complete leadership-change history.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
