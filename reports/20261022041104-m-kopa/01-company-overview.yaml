    columns: [Metric, Value/status, Date/period, Confidence, Gap]
    rows:
      - [Founded, "2011", "Founded in 2011", high, "No incorporation record retained in this pool"]
      - [Headquarters, "UK-headquartered in one source; Nairobi-headquartered in another", "2026 reporting", medium, "Verify legal domicile and principal operating headquarters"]
      - [Stage, "Late-stage private; reported Series F term sheet not confirmed closed", "July 2025", medium, "Executed closing documents unavailable"]
      - [Operating footprint, "Kenya, Uganda, Nigeria, Ghana; later coverage adds South Africa", "2023-2026 reporting", medium, "Current country-level revenue mix unavailable"]
      - [Cumulative customers, "10 million", "2025 financial year / October 2026 coverage", medium, "Definition and deduplication not independently audited"]
      - [Active customers, "3.4 million", "End-2025", medium, "Reconcile with cumulative-customer count"]
      - [Revenue, "$600 million reported; $363.4 million contracts-with-customers figure also reported", "2025", low, "Obtain audited statements and accounting bridge"]
      - [Customer additions, "3 million", "Prior 12 months to October 2026 coverage", medium, "Clarify active versus cumulative additions"]
      - [Employees, "More than 2,500 full-time staff", "2025", medium, "Current audited headcount and geography unavailable"]
      - [Capital raised, "More than $590 million in debt, equity and grants reported since 2011", "As reported July 2025", medium, "Mixed capital types are not cash available or equity raised"]
      - [Valuation, null, "Current", low, "Post-money valuation and cap table not disclosed in retained sources"]
    notes: >-
      Sources report different populations and accounting scopes: cumulative customers
      are not the same as active customers, and reported revenue is not ARR. Null means
      that no supportable value was retained in the assigned evidence pool.
    claimRefs: [CO001, CO003, CO007, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Background or coverage, Founder-market fit or functional coverage, Key-person dependency]
    rows:
      - [Jesse Moore, "CEO and co-founder", "Named by IFC in 2023", "Co-founded the fintech and represents the operating model publicly", "Leadership continuity and succession plan not disclosed"]
      - [Nick Hughes, "Co-founder", "Historical account identifies him as formerly of Vodafone's M-Pesa team", "Payments and mobile-money experience is relevant to the micropayment model", "Current role and involvement not disclosed"]
      - [Chad Larson, "Co-founder", "Historical account identifies him as a founding team member", "Founding contribution is documented, but current functional coverage is not", "Current role and involvement not disclosed"]
    notes: >-
      This is a partial public enumeration, not a complete executive or board roster.
      Each listed person should be verified against current corporate filings, governance
      materials or a management diligence pack.
    enumerationScope:
      coverage: partial
      basis: Publicly named founders and executives in the assigned 2023-2026 source set
    claimRefs: [CO005, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [IFC, "Lender and development-finance partner", "Provided $50m Kenya and $15m Uganda equivalent loans", "Review covenants, sustainability-linked targets and repayment status"]
      - [Standard Bank of South Africa, "Arranger and lender in wider facility", "Arranged the initial $202m five-year financing facility", "Obtain full lender syndicate, maturities and security package"]
      - [Sumitomo Corporation, "Strategic investor", "Reported lead investor in 2025 Series F term sheet and 2023 capital increase", "Verify final equity terms, board rights and post-round ownership"]
      - [British International Investment, "Lender / financing participant", "Listed by IFC as participating in wider facility", "Confirm amount, seniority and reporting obligations"]
      - [FMO, "Development-finance lender", "Listed by IFC as participating in the wider 2023 facility", "Verify executed amount, portfolio ring-fencing and covenants"]
      - [M-KOPA employees / ESOP holders, "Ordinary or employee shareholders", "ImpactAlpha reported a shareholder-rights dispute and proposed secondary exits", "Review share classes, dilution history and settlement status"]
    notes: >-
      The map distinguishes lenders, strategic equity and employee shareholders; it is
      not a cap table. Financing announcements do not establish current ownership,
      control, available cash or final Series F close terms.
    enumerationScope:
      coverage: partial
      basis: Named capital and governance stakeholders appearing in retained public announcements
    claimRefs: [CO006, CO007, CO008, CO009]
