callouts:
  - calloutType: strength
    title: Multi-product distribution platform
    body: >-
      The strongest company-level evidence is the combination of a repeatable
      micropayment model, multiple financed asset categories and development-finance
      participation across several African markets.
    claimRefs: [CO002, CO003, CO004, CO006]
  - calloutType: risk
    title: Definition and governance uncertainty
    body: >-
      A diligence-grade view still needs reconciled customer and revenue definitions,
      final financing terms, a current leadership and board roster, and resolution or
      status of the employee-shareholder litigation.
    claimRefs: [CO007, CO008, CO011, CO013, CO014]
