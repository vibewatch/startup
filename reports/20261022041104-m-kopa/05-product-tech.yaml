      - [Device-control capability, "Restrict or shut down a financed smartphone after missed payments", "KilpiTek capability acquired in March 2026", "Need integration plan, code ownership, testing, and operational separation"]
      - [Data and risk layer, "Turn repayment history into credit profiles and lending decisions", "Historical payment data and AI-driven risk models", "Need consent, explainability, drift monitoring, fairness, and validation evidence"]
      - [Distribution and support layer, "Sell, educate, maintain, and resolve customer issues", "Local agents, distributors, telcos, and service centers", "Need quality assurance, escalation controls, and cost-to-serve by market"]
