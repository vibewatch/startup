callouts:
  - calloutType: strength
    title: Vertical control of a critical component
    body: The KilpiTek acquisition gives M-KOPA direct control over a device-locking capability that is central to its smartphone-financing workflow, although integration outcomes remain unreported.
    claimRefs: [CE005, CE006]
  - calloutType: risk
    title: Lender-grade technical evidence is incomplete
    body: Public sources describe the workflow and reported scale but do not establish security controls, model governance, reliability metrics, or unlock-service performance.
    claimRefs: [CE008, CE012, CE014]
