company:
  name: M-KOPA
chapter:
  number: 5
  title: Product & Technology
  summary: M-KOPA delivers financed assets through a PAYG operating model that combines mobile-money repayments, device controls, agents, and repayment-data underwriting. The strongest current technical evidence is the company's acquisition of KilpiTek's device-locking capability and reporting on payment-data and AI-driven lending; public evidence remains thin on detailed architecture, security controls, reliability, and integration performance.
sections:
  - id: customer-workflow
    title: Customer workflow and product surface
    body: >-
      M-KOPA's customer workflow starts with an asset that would otherwise require a large upfront payment, followed by a deposit and daily, weekly, or monthly repayments through mobile-money rails. Public descriptions cover solar systems, smartphones, televisions, refrigerators, clean cookstoves, electric motorcycles, data bundles, loans, and insurance, but the evidence is uneven by product line. The smartphone is increasingly a gateway into financial services rather than only a financed handset: TechCabal reports that repayment data is used to qualify customers for additional credit and services. A customer-facing limitation is that missed payments can trigger remote device restriction, while public reporting also mentions complaints about delays in unlocking after completed payments. The operating model therefore depends on accurate payment state, device state, agent support, and fair recovery processes.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and maturity
    body: >-
      The public operating architecture is best understood as a connected financing workflow rather than a disclosed software stack. Mobile-money integrations carry repayments; a financed device or other asset supplies the controlled endpoint; payment events create a customer history; analytics and AI models are described as inputs to lending decisions; and agents provide distribution, education, maintenance, and support. The March 2026 KilpiTek acquisition is the clearest current signal of vertical integration: M-KOPA said it was bringing in-house a critical device-locking capability to strengthen control of a key technology-stack component and support product and sourcing strategy. This may reduce third-party dependency, but the available source does not disclose APIs, cloud architecture, model governance, uptime, recovery objectives, or controls for erroneous lockouts.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-deployment
    title: Differentiation, deployment, and scale
    body: M-KOPA's differentiation is the combination of asset financing, mobile payments, device-level control, local distribution, and subsequent financial services. Current sources describe operations across Kenya, Uganda, Nigeria, Ghana, and South Africa, while older descriptions document the model's evolution from solar kits to smartphones and other assets. Company-issued figures reproduced by Africa Fintech Network claim 10 million cumulative customers, 23 micropayments processed per second, and approximately 10,000 new customers onboarded daily. These figures are not independently audited in the assigned pool, and they do not reveal per-country uptime, device mix, repayment latency, or service-level performance. The system's practical scalability appears credible, but public technical disclosures are insufficient to measure reliability.
    claimRefs: [CE009, CE010, CE011, CE015, CE016]
  - id: trust-and-technical-gaps
    title: Trust, safety, and diligence blockers
    body: The product's technical controls are also credit and consumer-protection controls. Remote locking can protect financed assets, but it creates operational and reputational exposure if payment records, identity matching, device status, or unlock workflows are wrong. AllAfrica's fact-checking reports that financed phones can be remotely locked when payments are missed and notes complaints about delays in unlocking after customers complete payments; it found no evidence for a viral claim of mass arrests. CTOL separately reports concerns about cumulative repayment cost and aggressive debt collection, but that account is not a primary investigation and should be treated as a reported concern rather than a verified incident rate. The assigned sources do not establish security certification, breach history, privacy architecture, model fairness testing, recovery performance, or independent quality audits. These are material diligence requests before treating the platform as lender-grade infrastructure.
    claimRefs: [CE012, CE013, CE014]
    tableRefs: []
