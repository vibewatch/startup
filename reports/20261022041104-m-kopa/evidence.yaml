evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board, executive roster, ownership schedule and final Series F cap table.
    whyItMatters: >-
      Leadership concentration, control rights and dilution determine governance risk and the economic value of the
      reported financing.
    diligencePath: >-
      Request the latest board materials, shareholder register, option/ESOP schedule and executed Series F closing
      documents.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled bridge between 10 million cumulative customers, 3.4 million active customers, $600 million reported
      revenue and $363.4 million contracts-with-customers revenue.
    whyItMatters: >-
      Different denominators or accounting scopes could materially change the interpretation of growth, monetization and
      valuation.
    diligencePath: Obtain audited 2025 accounts, KPI definitions, country schedules and a customer deduplication methodology.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: Executed terms, post-money valuation and investor rights for the reported Series F financing.
    whyItMatters: A term sheet is not proof of a closed round, cash received or current valuation.
    diligencePath: Request executed financing documents, cap table, use-of-proceeds schedule and closing confirmation.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited financial statements with portfolio quality, cash-flow bridge and country-level economics.
    whyItMatters: The company is a credit business whose accounting profit, cash generation and credit losses may diverge.
    diligencePath: >-
      Request audited statements, ECL methodology, receivables vintages, charge-offs, recoveries, liquidity schedule and
      lender covenants.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, independently defined market dataset for financed smartphones, PAYG energy, electric mobility, and
      embedded consumer credit by country and product.
    whyItMatters: Without a common denominator, reported revenue and customer counts cannot be translated into SAM or SOM.
    diligencePath: >-
      Obtain a country-by-country market model with product definitions, eligible households, annual spend, and
      competing channels.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: scale-definitions
    missingEvidence: >-
      An independently reviewed metric dictionary and period bridge for active customers, cumulative customers served,
      additions, and retained borrowers.
    whyItMatters: >-
      Different vintages and denominators can distort adoption, retention, and market-share conclusions when treated as
      interchangeable.
    diligencePath: >-
      Request audited customer definitions, active-account cohorts, and a dated bridge from cumulative served to active
      and repeat borrowers.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: credit-quality
    missingEvidence: Product- and country-level vintage, delinquency, charge-off, recovery, repeat-borrowing, and margin data.
    whyItMatters: The financing model’s valuation depends on whether repayment data converts into durable risk-adjusted economics.
    diligencePath: Request a lender-grade portfolio pack and cohort economics under currency, inflation, and unemployment stress.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable APR, total-cost, fee, approval-rate, and repayment-performance data for M-KOPA and its direct
      alternatives.
    whyItMatters: >-
      Without normalized competitor economics, the positioning and switching-cost assessment cannot distinguish
      convenience from durable customer value.
    diligencePath: >-
      Collect representative customer contracts and lender offers for the same devices and borrower profiles, then
      compare effective cost and approval outcomes.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: >-
      Cohort-level retention, repeat borrowing, delinquency, charge-off, recovery, and multi-homing data by product and
      country.
    whyItMatters: Customer count and product breadth do not prove that repayment data lowers losses or prevents displacement.
    diligencePath: >-
      Request lender-grade cohort and portfolio analytics plus customer interviews covering alternative providers and
      switching behavior.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP002
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A reconciled definition of served customers, active customers, and customers with multiple products across the
      2025 and 2026 reports.
    whyItMatters: >-
      Reported customer totals and active-customer figures use different denominators and can overstate comparable
      competitive scale.
    diligencePath: Obtain a dated KPI dictionary and audited or board-level reconciliation by country and product.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited statements with segment revenue, gross margin, cash flow, credit losses, and working-capital detail.
