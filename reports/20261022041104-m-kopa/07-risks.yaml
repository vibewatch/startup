        - "HMD, identified by M-KOPA as its largest supplier"
        - "M-KOPA attributes about one-quarter of total emissions to HMD; commercial concentration is undisclosed"
        - "Component interruption, quality failure, or repricing slows originations and raises device cost"
        - High
        - "Nairobi assembly, supplier engagement, product testing, and refurbishment"
        - "High until spend, sole-source parts, inventory cover, and alternate suppliers are disclosed"
      - - 2
        - Mobile-money and data connectivity
        - "Payment and network partners"
        - "Bundled data and daily payments are core to the product; provider shares are unavailable"
        - "Collection, settlement, or connectivity disruption interrupts payment and customer access"
        - High
        - "Multi-market operations and negotiated data bundles"
        - "Medium-high without rail concentration, failover, and outage testing"
      - - 3
        - Embedded insurance and device protection
        - "Insurers and protection providers"
        - "Insurance and protection are bundled with devices; partner economics and claims performance are unavailable"
        - "Claims, pricing, licensing, or service failure damages trust and product economics"
        - "Medium-high"
        - "Integrated offering and customer support"
        - "Medium-high pending claims ratios, SLAs, termination rights, and replacement plans"
      - - 4
        - Equity and growth capital
        - "Series F investors and selling shareholders"
        - "ImpactAlpha reported roughly $160 million, split about equally between fresh capital and shareholder liquidity"
        - "A delayed close or greater secondary allocation leaves less capital for growth and risk absorption"
        - High
        - "Longstanding investors and optional shareholder liquidity were reported"
        - "High until final terms, cash proceeds, preferences, and conditions are verified"
    notes: "Public sources identify important roles but not commercial concentration, substitutability, SLAs, or final financing terms; funding raised is not treated as cash available."
    claimRefs: [CR003, CR007, CR008, CR009, CR014, CR015]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: "Credit and legal risks remain highest because public evidence supplies baselines and controls but not current outcome or stress data."
    data:
      columns:
        - label: Likelihood
          detail: "Qualitative likelihood supported by reported events or structural exposure"
        - label: Impact
          detail: "Potential effect on customers, operations, financing, or ownership"
        - label: Mitigation maturity
          detail: "Publicly evidenced control maturity, not an audit conclusion"
      rows:
        - label: Portfolio credit quality
          note: "Disclosed default baseline is unaudited and lacks vintage or stress detail"
          values: ["Medium-high", "High", "Partial"]
        - label: Employee-equity litigation
          note: "Case exists in reporting; current disposition is unavailable"
          values: ["Unknown", "High", "Disputed"]
        - label: FX and import costs
          note: "Company identifies the cost pressures; treasury protection is not disclosed"
          values: ["Medium-high", "High", "Partial"]
        - label: Customer treatment and device access
          note: "Complaints and safeguards are both documented"
          values: ["Medium", "High", "Partial"]
        - label: Agent and operating controls
          note: "Training is described, while incident and quality outcomes are unavailable"
          values: ["Medium", "Medium-high", "Partial"]
        - label: Supplier and embedded-service partners
          note: "Important roles are visible, but concentration and substitution evidence is absent"
          values: ["Medium", "High", "Early"]
    approximationNotes: "Cells are qualitative, evidence-bounded judgments; they are not measured probabilities or company risk ratings."
    claimRefs: [CR001, CR005, CR009, CR011, CR012, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Investment kill criteria
    body: >-
      Break the thesis on a material adverse employee-equity judgment, a material
      deterioration from the disclosed default baseline, systemic post-payment
      device-access failures, or non-substitutable disruption at a material
      supplier or embedded-service partner.
    claimRefs: [CR016]
