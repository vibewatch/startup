company:
  name: M-KOPA
chapter:
  number: 6
  title: Customers
  summary: M-KOPA has credible evidence of scaled acquisition, including a company-reported 10 million cumulative customers and detailed Ghana cohort outcomes. The public evidence is much weaker on named customer references, retention, repeat use, and concentration, so cumulative reach should not be treated as proof of durable customer economics.
sections:
  - id: customer-segments
    title: Customer segments, payers, and use cases
    body: >-
      M-KOPA primarily addresses consumers whose irregular income or limited access to conventional credit makes the upfront price of a smartphone or other asset difficult to absorb. Company-linked reporting places the platform across Kenya, Nigeria, Ghana, Uganda, and South Africa, while the strongest segment detail comes from Ghana. There, M-KOPA's impact-report figures describe more than 550,000 customers receiving over GHS 1.2 billion of credit since 2021; 44% reportedly accessed a formal financial product for the first time and 36% said the financed smartphone was their first phone. These disclosures support a financial-inclusion use case, but they do not provide revenue, repayment, or active-customer denominators by segment.
    claimRefs: [CU001, CU006, CU008]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption scale and trajectory
    body: >-
      The disclosed acquisition trajectory is substantial but definition-sensitive. ImpactAlpha reported more than five million credit customers in July 2025, while company-syndicated coverage in October 2026 reported a cumulative 10 million customers, three million additions over the preceding 12 months, and approximately 10,000 daily onboardings. The figures point to rapid expansion, yet the sources do not reconcile "served," "joined," and "active" customers or provide comparable period-end populations. Ghana adds a market-level signal: sales reportedly grew fourfold after the More than a Phone rollout reached all 16 regions through more than 3,000 agents. That is evidence of distribution momentum, not a retention rate.
    claimRefs: [CU002, CU003, CU004, CU007]
    tableRefs: [TU002]
  - id: customer-proof
    title: Customer proof and customer-experience signals
    body: >-
      The retained evidence is cohort-based rather than customer-specific. Ghana survey figures report that 54% of customers earned more after acquiring a smartphone and 76% experienced improved quality of life, while more than one million Kenyan customers reportedly received embedded health insurance in one year. Those are useful outcome signals, but they are company- or partner-reported aggregates without named-user verification, sampling detail, renewal data, or claims experience. On the adverse side, independent fact-checking notes criticism of financed-phone costs and occasional unlock delays after repayment, while finding no evidence for viral claims that millions of customers faced arrest. The distinction matters: documented complaints warrant diligence, but unsupported mass-arrest claims do not.
    claimRefs: [CU009, CU010, CU013, CU014, CU016]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Expansion mechanics and durability gaps
    body: >-
      Public reporting supports a plausible land-and-expand mechanism. Customers may become eligible for other financed assets after completing an initial plan, smartphone repayment data can support later lending or insurance offers, and company-linked reporting says multi-product use increased during multi-year relationships. Device locking strengthens payment enforcement for financed phones, but it does not establish that customers will remain, renew, or repay unsecured products when the collateral mechanism changes. A low-quality independent analysis reports Nigeria defaults below a company-reported 10% average, which is directionally useful but not lender-grade evidence. No retained source supplies GRR, NRR, churn, completed-contract cohorts, repeat-borrowing rates, contract length, or customer and channel concentration.
    claimRefs: [CU005, CU011, CU012, CU015]
    figureRefs: [FU001]
