figures:
  - id: FU001
    title: Customer journey from financed device to expanded services
    type: journey-map
    summary: The public evidence supports a sequential acquisition and expansion hypothesis, while leaving the retention and concentration stages unquantified.
    data:
      items:
        - stage: "1. Discover"
          label: "Agent-led access"
          title: "Affordability-led acquisition"
          description: "A consumer encounters a financed smartphone or other asset through a local distribution network."
          touchpoints: ["Sales agent", "Financed device offer"]
        - stage: "2. Acquire"
          label: "Daily instalments"
          title: "Asset access without full upfront payment"
          description: "The customer pays in small instalments aligned with daily or irregular income."
          touchpoints: ["Deposit", "Daily repayment"]
        - stage: "3. Use"
          label: "Device and services"
          title: "Connectivity and embedded benefits"
          description: "The smartphone can provide connectivity, device protection, and insurance alongside the financed asset."
          touchpoints: ["Data", "Device protection", "Health insurance"]
        - stage: "4. Repay"
          label: "Payment history"
          title: "Controlled repayment relationship"
          description: "Repayment data accumulates, while missed payments can trigger remote device locking until payments resume."
          touchpoints: ["Payment record", "Remote lock"]
        - stage: "5. Qualify"
          label: "Eligibility"
          title: "Additional financial products"
          description: "A completed or seasoned payment relationship can support qualification for loans, insurance, or another financed asset."
          touchpoints: ["Credit decision", "Follow-on offer"]
        - stage: "6. Expand"
          label: "Multi-product use"
          title: "Longer customer relationship"
          description: "Reporting describes customers taking smartphones, digital loans, and mobility products during multi-year relationships."
          touchpoints: ["Digital loan", "Insurance", "Mobility asset"]
        - stage: "7. Verify"
          label: "Durability diligence"
          title: "Unproven retention and concentration"
          description: "Cohort retention, repeat borrowing, contract completion, and concentration must be verified before treating reach as durable value."
          touchpoints: ["Cohort pack", "Concentration schedule"]
    approximationNotes: "Conceptual sequence only. The stages do not share a disclosed population or period, and the figure does not imply conversion rates or value-proportional spacing."
    claimRefs: [CU005, CU011, CU012, CU015]
callouts:
  - calloutType: strength
    title: Scaled acquisition with measurable Ghana outcomes
    body: M-KOPA's cumulative reach is supported by current company-linked reporting, while Ghana adds concrete first-phone, first-finance, and self-reported income outcomes.
    claimRefs: [CU001, CU006, CU008, CU009]
  - calloutType: risk
    title: Reach is not retention
    body: The assigned evidence does not disclose comparable active-customer, renewal, churn, repeat-borrowing, or concentration metrics, so customer durability remains a material underwriting gap.
    claimRefs: [CU002, CU015, CU016]
