company:
  name: Cambridge Mobile Telematics
chapter:
  number: 1
  title: Company Overview
  summary: Cambridge Mobile Telematics combines mobile and connected-vehicle sensing with AI-driven risk, crash, claims, and driver-improvement workflows for insurers and other mobility organizations. Its 2026 strategic investment and commercial partnerships evidence strategic demand, but reported transaction value, private-market funding totals, and user-reach figures do not establish cash proceeds, company valuation, recurring revenue, or customer economics.
sections:
  - id: identity-product
    title: Identity, product, and reach
    body: >-
      Tracxn identifies CMT as a Cambridge, Massachusetts-based company founded in
      2010 and labels it a Series D company. MIT CSAIL traces the company's
      academic precursor to its CarTel mobile-sensing research project. CMT
      describes its DriveWell Fusion platform as combining
      telematics and AI to identify driving risk, detect crashes, support claims,
      and encourage safer driving. The company says it serves insurers,
      automakers, commercial mobility companies, and public-sector organizations;
      this is a multi-sided software and data-services proposition rather than a
      disclosed stand-alone hardware business. Its March 2026 release reports
      55 million drivers across 25 countries; Fortune separately reports more
      than 55 million. Those are driver/program measures, not a count of paying
      customer accounts. Tracxn
      lists 466 employees "as of Apr 26" without stating a year in the fetched
      text, so the figure is not a current audited headcount. MIT CSAIL and
      Tracxn identify Samuel Madden as a co-founder; Tracxn also lists him as
      chief scientist. CMT, Fortune, and Tracxn identify William V. Powers as
      co-founder and CEO. Tracxn displays a six-person board roster, but its
      "independent" labels are not corroborated by a primary source; board
      control and succession coverage remain diligence gaps.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO002
  - id: financing-and-stakeholders
    title: Financing, stakeholders, and economic visibility
    body: >-
      On March 24, 2026, CMT announced a $350 million strategic investment led by
      TPG and Allianz X with State Farm participating; Fortune independently
      described the transaction as all-secondary and quoted CEO Powers saying
      that none of it was primary capital. The headline amount therefore signals
      investor interest and strategic alignment, not new cash available to CMT.
      Tracxn labels CMT a Series D company and reports $852 million of cumulative
      funding across four rounds, but neither database field should be
      substituted for primary proceeds or cash-on-hand: the public transaction
      descriptions do not reconcile those measures. Fortune also cites third-party valuation estimates above $1
      billion without publishing a transaction valuation or methodology. CMT
      makes no revenue, ARR, margin, or runway figure available in the reviewed
      sources. The stakeholder map records disclosed roles, not ownership
      percentages, board control, or current cap-table economics.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO010
    tableRefs:
      - TO001
      - TO003
  - id: milestones-and-adverse-evidence
    title: Milestones and adverse evidence
    body: >-
      The source-supported chronology starts with MIT CSAIL's 2004-2010 CarTel
      research project, followed by Tracxn's 2010 founding date and funding
      records beginning in 2014, a 2018 SoftBank Vision Fund transaction, and
      the 2026 strategic investment. CMT's newsroom page also lists an
      October 2026 StreetVision announcement, but the prefetched page provides
      only headline-level detail. Separately, two law-firm solicitation pages
      report that the ransomware group CoinbaseCartel claimed a June 2026 attack
      against CMT. Those pages are not incident forensics or regulatory records:
      their assertions do not verify compromise, affected-person count,
      notification status, or remediation. The first page itself says the
      compromised-data volume was not yet known. No CMT incident statement,
      regulator notice, or independently verified impact assessment is present
      in this assigned evidence set, so the allegation remains an open diligence
      item rather than an established breach finding.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO008
      - CO016
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
