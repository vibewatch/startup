    - name: Samuel Madden
      role: Co-founder; Tracxn also lists Chief Scientist
      claimRefs:
        - CO009
  foundingLocation: Cambridge, Massachusetts, USA
  headquarters: Cambridge, Massachusetts, USA
  productSummary: >-
    DriveWell Fusion uses smartphone, vehicle, and other connected-device signals with contextual data to support risk
    assessment, crash response, claims, and driver-safety programs.
  customerFocus: >-
    Auto insurers are the clearest enterprise buyers in the reviewed evidence; automakers, fleets, commercial-mobility
    companies, public agencies, and drivers are also identified as partners, users, or beneficiaries.
  businessModel: >-
