evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-financial-disclosure
    missingEvidence: >-
      Dated company or audited disclosures for valuation, revenue, ARR, margins, runway, and the amount of primary
      proceeds from the 2026 transaction.
    whyItMatters: >-
      Without these measures, investor interest and user reach cannot establish current financial scale, liquidity, unit
      economics, or an investable valuation.
    diligencePath: >-
      Request the latest audited financial statements, management accounts, transaction allocation schedule, cap table,
      and definitions for recurring revenue and cash runway.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      A company-confirmed executive and board roster, director roles, voting/control rights, and documented succession
      coverage; Tracxn lists six board members but its independence labels are uncorroborated.
    whyItMatters: >-
      The assigned sources identify the CEO and a research co-founder but do not verify board oversight, decision
      rights, or key-person concentration.
    diligencePath: >-
      Obtain the current organization chart, board materials, cap table, governance documents, and succession plans from
      management.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      A current full cap table, beneficial ownership and control rights, and a complete register of material strategic
      and commercial counterparties.
    whyItMatters: >-
      The named investors and announced partners are a sample, not proof of ownership, governance rights, contract
      value, or customer concentration.
    diligencePath: >-
      Request the current cap table, financing documents, ownership schedule, board rights, and material customer and
      partner contract register.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: cyber-incident-allegation
    missingEvidence: >-
      An incident-response statement or authoritative forensic, regulatory, or customer record establishing whether the
      alleged June 2026 event occurred, its scope, notification status, and remediation.
    whyItMatters: >-
      Telematics data can include location and driving behavior; verified exposure and customer impact could materially
      affect trust, regulatory risk, and retention.
    diligencePath: >-
      Request the incident timeline, forensic report, affected-record counts, regulator/customer notifications,
      remediation evidence, and any material customer or legal notices.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: company-specific-sizing-gap
    missingEvidence: >-
      A verified CMT revenue and contract bridge by product and buyer segment, eligible buyer or vehicle counts, and
      adoption assumptions that support an independent SAM/SOM calculation.
    whyItMatters: >-
      Broad market estimates do not identify CMT's serviceable buyer base, monetization, addressable software spend, or
      realistic adoption ceiling.
    diligencePath: >-
      Request revenue and contract cohorts by insurer, fleet, OEM, and public-sector use case, then reconcile eligible
      spending and deployment counts to paid contracts.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Segment-level pricing, deployment costs, pilot-to-production conversion, renewal, and independently validated
      customer ROI or loss-ratio outcomes.
    whyItMatters: >-
      The sources describe use cases and potential benefits but do not establish repeatable customer economics across
      buyer types.
    diligencePath: >-
      Review anonymized customer contracts, conversion and renewal cohorts, implementation costs, and audited outcome
      studies by segment.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: privacy-and-deployment-friction
    missingEvidence: >-
      Measured opt-in, consent withdrawal, privacy-related churn, compliance costs, and deployment friction by device or
      region.
    whyItMatters: >-
      Driving and location data can be sensitive, while privacy concerns and installation costs are identified as
      adoption constraints.
    diligencePath: >-
      Obtain privacy impact assessments, consent and opt-out metrics, security-control evidence, and deployment-cost
      comparisons across phone, OEM, and installed-device programs.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      CMT and competitor list prices, realized rates, discounts, contract structure, deployment costs, and product-level
      gross economics.
    whyItMatters: >-
      Without comparable buyer cost and contract data, pricing power and the relative value of analytics, hardware, and
      services cannot be underwritten.
    diligencePath: >-
      Request redacted customer contracts, price schedules, renewal cohorts, implementation fees, and product-level
      gross-margin bridges from CMT and reference buyers.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer retention, portability rights, switching costs, multi-homing, integration dependencies, and renewal terms
      by product.
    whyItMatters: >-
      The presence of partnerships and data does not demonstrate durable lock-in or exclude buyers from replacing or
      combining vendors.
    diligencePath: >-
      Interview insurer and fleet buyers; review renewal cohorts, data export clauses, integration maps, and
      multi-vendor deployments.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: status-quo-alternatives
    missingEvidence: >-
      Evidence on insurer internal builds, navigation and OEM substitutes, procurement choices, likely entrants, and
      comparative deployment cost.
    whyItMatters: An incomplete substitute set may overstate vendor differentiation and understate buyer bargaining power.
    diligencePath: >-
      Obtain insurer procurement comparisons and buyer interviews covering build-versus-buy, incumbent systems, and
      multi-homing alternatives.
    relatedQuestionRefs:
      - QP009
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Contract-level prices and units, revenue and ARR reconciliations, customer/module/geography mix, recognition
      policy, renewal cohorts, and gross-margin and delivery-cost history.
    whyItMatters: >-
      Without these inputs, program scale and announced partnerships cannot be translated into recurring revenue
      quality, customer economics, or a credible margin trajectory.
    diligencePath: >-
      Request audited financial statements, monthly revenue bridge, executed customer contracts, billing schedules,
      retention cohorts, and product-level cost allocations.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, operating cash flow and burn by period, debt and covenant schedules, working-capital
      needs, forecast runway, and the next financing trigger.
    whyItMatters: >-
      The reported $350 million transaction was secondary and does not establish cash proceeds to CMT; an unquantified
      statement that the company generates cash is not a runway measure.
    diligencePath: >-
      Obtain a current balance sheet, cash-flow statements, debt documents, liquidity forecast, and management's
      downside and base-case financing plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: potential-financial-exposure
    missingEvidence: >-
      Independent verification of the alleged incident, any legally required notices, remediation costs, insurance
      coverage, claims, and customer or regulatory consequences.
    whyItMatters: >-
      A plaintiff-side investigation page is not proof of an incident or liability, but a verified event could affect
      cost, retention, contract obligations, and cash needs.
    diligencePath: >-
      Request the company's incident assessment, regulator correspondence, notification records, insurance notices, and
      any filed legal claims, then corroborate through primary records.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Current security-control documentation, independent audit or certification scope, incident investigation findings,
      and any remediation or notification records.
    whyItMatters: >-
      The platform processes driving and potentially location-linked data, while the pool contains only unverified
      law-firm reporting of a ransomware allegation.
    diligencePath: >-
      Request the current security overview, SOC 2 or equivalent audit report and scope, penetration-test summary,
