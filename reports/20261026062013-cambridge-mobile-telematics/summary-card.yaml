  topStrengths:
    - >-
      DriveWell Fusion spans risk, crash, claims, and driver-improvement workflows across mobile, vehicle, and
      connected-device signals.
    - >-
      Public evidence includes historical State Farm deployment evidence, reported international program reach, and
      named insurer and mobility relationships.
    - >-
      The 2026 transaction and announced Allianz commercial agreements show strategic engagement, although they do not
      establish revenue or company cash proceeds.
  topRisks:
    - >-
      Current revenue, ARR, margins, cash runway, valuation, paid customer count, renewal, and customer concentration
      are not established by the reviewed public sources.
    - >-
      The June 2026 ransomware claim remains unverified; incident scope, notifications, remediation, and customer or
      regulatory impact are unknown.
    - >-
      Fortune describes the USD 350 million strategic transaction as all-secondary, so its size is not evidence of
      primary operating capital or an investor entry price.
    - Reported driver reach and safety outcomes lack disclosed denominators or independent customer-level validation.
  unresolvedGaps:
    - >-
      Obtain current financial statements, cash flow and runway, primary versus secondary transaction proceeds, current
      valuation, cap table, and security terms.
    - >-
      Obtain a dated customer roster with production, pilot, and planned status, pricing, renewal cohorts, and revenue
      concentration by customer and product.
    - >-
      Obtain primary incident and forensic records, notification analysis, remediation status, independent control
      testing, and any regulator or customer impact findings.
