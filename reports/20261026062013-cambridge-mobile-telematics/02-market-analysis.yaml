callouts:
  - calloutType: insight
    title: Broad market forecasts do not establish CMT's obtainable market
    body: >-
      Insurance telematics and usage-based insurance overlap but are not
      reconciled in the assigned estimates. Without CMT-specific contract
      pricing, segment revenue, eligible buyer counts, and adoption evidence,
      neither publisher's global forecast establishes CMT's SAM or SOM.
    claimRefs: [CM005, CM015, CM016]
acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      Available estimates use different scopes and units, so a pyramid would
      falsely imply nested TAM, SAM, and SOM layers; separate bars are intentional.
