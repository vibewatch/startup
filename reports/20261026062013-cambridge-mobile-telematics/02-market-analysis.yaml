  - id: TM001
    title: Market boundary and adjacent spend
    columns: [Category, Included or excluded scope, Buyer or payer evidence, Status quo or substitute, Relevance and limitation]
    rows:
      - ["Insurer-facing telematics", "Included: data, analytics, risk assessment, crash detection, claims, and driver-engagement services", "Insurers are the described enterprise counterpart; budget owner and vendor terms are not disclosed", "Conventional underwriting, claims, and driver-engagement workflows; displacement is not quantified", "Core insurance-telematics scope"]
      - ["Usage- or behavior-based insurance", "Included as an application of driving-data-based risk assessment and personalized coverage; premiums are excluded from vendor spend", "Insurer program sponsor is described; policyholder premium payments are not evidence of CMT revenue", "Traditional rating and policy design; no substitution rate is reported", "Overlaps with telematics, but DBMR's UBI total is not additive to GMI's category"]
      - ["Automakers and connected mobility", "Adjacent: vehicle and driver insights for OEM or mobility workflows", "OEM or mobility-partner budget owner is not named", "Embedded vehicle data or other mobility systems may be alternatives; no comparison is provided", "CMT lists these users, but their spend is not isolated in the market estimates"]
      - ["Commercial mobility and fleets", "Adjacent: risk, claims, and safety applications for commercial operators", "Operator or fleet-safety sponsor is plausible; procurement evidence is absent", "Existing fleet systems and internal processes are not quantified", "Distinct buyer economics should not be folded into insurance telematics without overlap data"]
      - ["Public road-safety programs", "Adjacent: road-risk and driver-safety programs for public agencies", "City or transportation agency is the reported program counterpart; contract payer is not established", "Conventional public road-safety activity is not quantified", "Relevant deployment path, but not insurer-funded market spend"]
      - ["Insurance premiums and general mobility spend", "Excluded: policy premiums, general vehicle purchases, and broad road-infrastructure budgets", "Policyholders, vehicle buyers, or public authorities", "Not applicable to the vendor-market boundary", "The assigned evidence does not equate these larger flows with CMT platform revenue"]
    notes: >-
      Boundary follows the assigned market sources and reported use cases.
      Adjacent categories and potential substitutes are separated because
      sources do not disclose their spend overlap, buyer budget, or displacement.
    claimRefs: [CM001, CM002, CM008, CM009, CM010, CM011]
  - id: TM002
    title: Published market-sizing lenses
    columns: [Publisher, Market metric, Geography and vintage, Published value, Published CAGR, Methodology disclosed, Confidence and limitation]
    rows:
      - ["Global Market Insights", "Insurance telematics", "Global; 2025 estimate and 2034 forecast", "USD 7.7bn (2025); USD 30.9bn (2034)", "19.7% (2026–2034)", "Page describes a bottom-up model using company revenue and deployment inputs; the accessible extract does not provide a reproducible segment bridge", "Medium; provider estimate, not CMT-specific addressable spend"]
      - ["Data Bridge Market Research", "Usage-based insurance", "Global; 2022 estimate and 2030 forecast", "USD 24.83bn (2022); USD 164.44bn (2030)", "26.66% (2023–2030)", "Accessible release lists categories and forecast scope but does not disclose a comparable vendor-spend model", "Medium-low; distinct category and older base year, not reconciled to insurance telematics"]
      - ["Global Market Insights", "U.S. insurance telematics", "United States; 2025", "Around USD 2.4bn revenue; source also states 81.6% share in North America", "Not stated for U.S.", "Regional summary; the 81.6% denominator is not unambiguous in the accessible text", "Medium-low; do not interpret as U.S. share of global market or as CMT share"]
    notes: >-
      Values, units, and forecast periods are reproduced as reported; no
      conversion or CAGR recalculation is applied. The providers' category
      boundaries, vintages, and methods are not harmonized. GMI's U.S. figure
      is retained with its ambiguous North American share wording rather than
      converted into a company share.
    claimRefs: [CM003, CM004, CM005, CM006, CM015]
  - id: TM003
    title: Buyer, user, payer, and adoption map
    columns: [Segment, Enterprise buyer or budget owner, User or beneficiary, Payer evidence, Adoption path and diligence limit]
    rows:
      - ["Auto insurers", "Insurer program sponsor; exact underwriting, claims, or product budget owner is not identified", "Risk, claims, or program teams; participating drivers provide data and receive feedback", "Fortune describes insurer use; Allianz reports long-term commercial agreements, without contract economics", "Integrate risk, crash, claims, or engagement workflows; verify pricing, renewal, and loss outcomes"]
      - ["Automakers and OEMs", "OEM or vehicle-partner function not named", "Drivers, vehicle users, and partner teams", "CMT and partner releases describe use cases but not segment-specific payment", "Vehicle-data and risk/safety applications; verify procurement and spend"]
      - ["Commercial mobility and fleets", "Operator or fleet-safety budget owner not named", "Professional drivers and fleet managers", "Company materials identify the segment; no contract terms are provided", "Safety and risk workflows; verify deployment cost and buyer ROI"]
      - ["Public agencies", "City or transportation-agency program owner is reported; public procurement budget is not disclosed", "Road users and participating drivers", "GovTech names Boston and Los Angeles deployments but no contract value", "Safe-driving and road-safety programs; verify procurement cycle and renewal"]
      - ["Drivers and policyholders", "Not shown as the enterprise software buyer in the cited examples", "Data subjects, program participants, and potential recipients of feedback or assistance", "Potential insurance benefits are described, but not measured as CMT customer economics", "Participation and consent matter; verify opt-in, retention, and privacy effects"]
    notes: >-
      Reported use cases identify customer segments, not verified budget owners.
      Payer, contract value, program conversion, and repeatability remain
      unproven for several buyer groups.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013, CM014]
