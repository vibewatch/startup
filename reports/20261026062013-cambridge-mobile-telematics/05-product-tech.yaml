      severity: material
      topic: product-validation
      missingEvidence: Independent validation of crash-detection accuracy, risk-model performance, retention outcomes, AI Total Loss timing, and the stated per-claim savings.
      whyItMatters: Public numerical outcomes are company claims without sample sizes, denominators, baselines, or independently reproducible methodology.
      diligencePath: Obtain customer-level deployment cohorts, metric definitions, validation design, false-positive and false-negative rates, and referenceable insurer outcomes.
