      severity: material
      topic: security-controls
      missingEvidence: Current security-control documentation, independent audit or certification scope, incident investigation findings, and any remediation or notification records.
      whyItMatters: The platform processes driving and potentially location-linked data, while the pool contains only unverified law-firm reporting of a ransomware allegation.
      diligencePath: Request the current security overview, SOC 2 or equivalent audit report and scope, penetration-test summary, incident-response timeline, and customer/regulator notices directly from CMT.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
