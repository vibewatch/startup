chapter:
  number: 5
  title: Product & Technology
  summary: Public materials describe DriveWell Fusion as a sensor-and-context telematics platform supporting driving-risk, crash-response, and claims workflows, with recent product additions spanning roadside assistance, hail alerts, driver engagement, and AI-assisted total-loss handling. The product surface is concrete, but public sources do not establish production reliability, independently measured performance, internal architecture, or the technical controls protecting sensitive location and driving data.
sections:
  - id: product-surface
    title: Product surface and customer workflows
    body: >-
      CMT's public product material positions DriveWell Fusion as the shared platform
      behind insurer, automaker, commercial-mobility, and public-sector use cases. Its
      June 2025 release described product updates across driver safety, emergency
      assistance, engagement, and claims rather than a single standalone application.
      Those descriptions identify a wide workflow footprint, but are company claims:
      the materials do not provide customer-level deployment counts, contractual
      service levels, or independently audited outcome data. The stated claims
      workflow combines telematics data with AI-driven photo analysis; its claimed
      speed and savings figures should not be treated as realized customer economics
      without a disclosed sample and methodology. [CE001, CE002]
    claimRefs: [CE001, CE002]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: Documented operating model, not a disclosed software architecture
    body: >-
      The most supportable technical picture is a high-level signal-to-workflow
      model. Public descriptions name smartphones, proprietary Tags, connected
      vehicles, dashcams, and third-party devices as signal sources; they describe
      contextual data being combined with those signals to inform risk, crash, and
      claims workflows. An MIT CSAIL account traces the underlying lineage to CarTel
      research on cleaning noisy mobile-sensor data and making inferences about
      device activity, while CMT's recruiting listing describes production machine
      learning for sequential and multimodal data across cloud and edge. These sources
      do not disclose model design, data schemas, deployment topology, integration
      APIs, or validation benchmarks, so a layer diagram here represents documented
      functions and dependencies rather than an asserted internal stack. CMT also
      says Tag+ uses its proprietary mesh network to keep drivers connected when
      phone-app permissions are off; this is a company-described capability, not
      independently characterized network architecture. [CE003, CE004, CE005,
      CE006, CE007, CE014]
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity signals and differentiation
    body: >-
      The company and MIT account describe a product lineage from mobile-sensing
      research into insurance and safety applications, and CMT's release describes
      white-label crash-assistance apps and program enhancements. A third-party
      patent index lists titles concerning trip scoring, sensor-based alerts, crash
      detection, and driving-event visualization; this is evidence of listed
      intellectual-property topics, not proof of enforceable coverage, current
      ownership, technical novelty, or defensibility. A current job-board copy of a
      CMT role calls for production ML work on sequential and multimodal data. That is
      a company hiring signal—not independent verification of deployed capability.
      Differentiation therefore appears to rest on a combination of sensing,
      inference, program workflows, and deployment experience, with comparative
      performance and IP scope still unproven in this pool. [CE008, CE009, CE010]
    claimRefs: [CE008, CE009, CE010]
  - id: trust-and-validation
    title: Trust, safety, and validation remain diligence items
    body: >-
      CMT's product descriptions concern driving behavior, crash events, and
      location-linked assistance, making data governance and reliable event handling
      material product requirements. Two law-firm pages in the assigned pool repeat
      a ransomware group's June 2026 claim of an attack and describe potentially
      exposed data; neither page supplies forensic evidence, a company confirmation,
      or a regulator finding, and their repetition is not independent confirmation
      of the underlying allegation. One page explicitly says the data volume was
      pending investigation. The available material does not establish whether an
      incident occurred, what data may have been accessed, or the company's
      remediation and notification status. Obtain primary incident and security
      evidence before underwriting the control environment. [CE011, CE012, CE013]
    claimRefs: [CE011, CE012, CE013]
