  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-concentration
      missingEvidence: Customer-level renewal and cohort retention data, contract durations, and revenue concentration by customer, module, geography, and channel.
      whyItMatters: Without these denominators and time series, reported program reach cannot show durable paid adoption or quantify dependence on a small number of insurer or partner accounts.
      diligencePath: Request anonymized cohort renewal and churn schedules, contract terms, and top-customer revenue shares by module and geography, reconciled to reported active programs.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-coverage
      missingEvidence: A current, dated roster of named customers and partners with production, pilot, planned, and discontinued deployments distinguished by product and geography.
      whyItMatters: The public examples are a historical pilot, an education collaboration, announced agreements, and investor-attributed reach; without a deployment census, paid adoption and customer concentration cannot be assessed.
      diligencePath: Request a customer and partner schedule listing contract status, deployment dates, product scope, renewal status, geography, and customer-level revenue bands, with permission to validate selected references.
      relatedTableRefs: [TU003]
