      - [Commercial fleets and mobility, Fleet or rideshare operators, Drivers and passengers, "The 2022 Travelers Institute/CMT profile lists personal and commercial auto and rideshare among platform sectors.", "No account count, fleet deployment status, utilization, or segment economics are disclosed."]
      - [Public sector and smart cities, Public agencies or city partners, Road users and transportation planners, "Fortune describes public-agency use of mobility insights; the 2022 company profile lists smart cities as a platform sector.", "No current city contract list, renewal evidence, or public-sector revenue is reported."]
    notes: >-
      Segment descriptions combine company-published or reported use cases; they are not an
      exhaustive customer census, and no segment revenue or current account counts are
      disclosed in the assigned evidence.
    claimRefs: [CU001, CU002]
  - id: TU002
    title: Publicly reported adoption and outcomes
    columns: [Metric, Reported value, Attribution and period, What it does not establish]
    rows:
      - [Program snapshot, "80 programs; 18 countries; 21 of the top 25 U.S. auto insurers", "CMT company profile in the Travelers Institute/CMT release, November 21, 2022.", "Company statement; criteria and definitions are not provided, so this is not directly comparable with later figures."]
      - ["Safe-driving programs", "More than 140", "Fortune reports the figure citing Frost & Sullivan and CMT; described in March 2026 coverage.", "Not a count of paying accounts, live deployments, or active programs."]
      - [Drivers reached, "Over 55 million", "Fortune reports the figure citing Frost & Sullivan and CMT; across 25 countries.", "No active-user definition, unique-user method, or time series is stated."]
      - [Geographic reach, "25 countries", "Reported with the driver/program figures in 2026 Fortune coverage.", "Does not show revenue or deployment depth by geography."]
      - [Customer count, "More than 20", "EquityZen profile; publication date not stated.", "The profile does not name accounts or define active customer status."]
      - [Top U.S. insurers, "Nearly all of the top 25", "Fortune attributes this statement to TPG.", "No named insurer-by-insurer deployment status or denominator detail is provided."]
      - [Crashes prevented, "More than 100,000", "Fortune reports the figure citing Frost & Sullivan and CMT.", "No method, baseline, observation window, or independent causal validation is provided."]
      - [Serious injuries prevented, "54,000", "Fortune reports the figure citing Frost & Sullivan and CMT.", "No method, baseline, observation window, or independent causal validation is provided."]
    notes: >-
      Figures retain their stated attribution and qualifiers. The 2022 and 2026 snapshots
      use different sources and do not define comparable program or insurer criteria; do
      not infer a growth rate. The assigned sources do not define active-user denominators or
      outcome methodologies, so these are reported reach and impact claims, not audited
      operating metrics.
    claimRefs: [CU004, CU005, CU006, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Organization, Evidence and date, Relationship / deployment signal, Limitation]
    rows:
      - [State Farm, "MIT account: contract in late 2011 and pilot version in 2012; Fortune separately reports State Farm's participation in CMT's 2026 investment.", "Historical insurer contract and pilot, plus later investor participation.", "The investment is not proof of a current contract; historical pilot evidence does not establish present deployment or economics."]
      - [Travelers Institute, "Educational guide published with CMT on November 21, 2022.", "Named collaboration on driver-safety education; includes CMT-attributed telematics program claims.", "The guide partnership is not itself proof of an insurance product deployment or paid contract."]
      - [Allianz entities, "Company-aligned 2026 coverage describes long-term commercial agreements with Allianz Partners and Allianz Versicherungs-AG.", "Announced expansion of data-driven insurance products, assistance, and mobility services in Europe.", "The reviewed evidence does not establish rollout completion, customer adoption, or realized revenue."]
      - [Broader insurer base, "Fortune reports CMT serves nearly all of the top 25 U.S. auto insurers, attributing the statement to TPG.", "Reported breadth of insurer relationships.", "No named current account roster or production-vs-pilot breakdown is provided."]
    enumerationScope:
      coverage: sample
      basis: Named relationships surfaced in assigned sources from 2011 through 2026; this is not a comprehensive current customer roster or deployment census.
    notes: >-
      This partial public sample mixes a historical contract and pilot, co-published
      education, announced commercial agreements, and investor-attributed reach; none alone
      proves current paid deployment.
    claimRefs: [CU003, CU005, CU007, CU009, CU010]
