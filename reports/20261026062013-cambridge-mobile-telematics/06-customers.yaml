company:
  name: Cambridge Mobile Telematics
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports an insurer-led model in which insurers sponsor programs and drivers are end users, but most adoption metrics are company- or investor-attributed reach rather than paid accounts or active users. A historical State Farm contract and pilot, a 2022 Travelers Institute/CMT guide, and 2026 Allianz expansion announcements show named relationships; current deployment status, renewal, retention, and concentration remain unverified in the assigned sources.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      The evidence points to an insurer-led buying model, with drivers as the end users:
      Fortune describes insurers using CMT insights for risk pricing, crash detection, and
      safer-driving nudges, while a 2022 Travelers Institute/CMT guide lists auto insurance,
      automotive, rideshare, smart-city, and related sectors. These are described use cases
      and buyer categories, not a named account census. Public materials support insurers as
      the clearest buyer group, with automakers, fleets, public agencies, and other sectors as
      adjacent channels, but do not allocate revenue or show who pays for each program. A
      logo, investor, or alliance should not be counted as an active customer without
      deployment evidence.
    claimRefs: [CU001, CU002]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption scale and outcome claims
    body: >-
      Public reach claims are large but are not audited customer counts. Fortune reported
      more than 140 programs reaching over 55 million drivers in 25 countries, citing Frost
      & Sullivan and CMT, and attributed the "nearly all" of the 25 largest U.S. auto
      insurers statement to TPG. A November 2022 Travelers Institute/CMT release had earlier
      described 80 programs in 18 countries and 21 of the top 25 U.S. auto insurers. The
      snapshots have different dates, attributions, and undefined program or insurer
      criteria, so they do not establish growth in unique active users or paying contracts.
      An undated EquityZen profile separately reports more than 20 customers in 14 countries,
      but it names no accounts and does not define active customer status. Reported crash and
      injury-prevention figures likewise lack a stated measurement window, counterfactual, or
      independent causal validation.
    claimRefs: [CU004, CU005, CU006, CU015]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named relationships and deployment status
    body: >-
      Named evidence varies in maturity. MIT CSAIL Alliances recounts CMT's State Farm
      contract in late 2011 and a 2012 pilot; this is historical evidence, not proof of a
      current deployment. A 2022 Travelers Institute/CMT educational guide shows a named
      collaboration, not by itself a paid telematics contract. Fortune reported a $350
      million strategic investment led by TPG and Allianz X with State Farm participating;
      separate company-aligned 2026 coverage describes long-term commercial agreements with
      Allianz Partners and Allianz Versicherungs-AG for European expansion. Financing
      participation is not customer proof, and announced agreements do not establish
      completed rollouts, active users, or realized revenue.
    claimRefs: [CU003, CU007, CU009, CU010]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Durability, expansion, and customer risk
    body: >-
      The assigned evidence does not provide cohort retention, renewal rates, contract
      duration, customer-level revenue, or top-customer concentration, so expansion and
      durability cannot be quantified. The 2022 Travelers Institute/CMT guide attributes an
      association between frequent app opening and safer, less distracted driving to CMT
      data, but gives no methodology or observation window; this is not retention evidence
      or verified causal impact. Schubert Jonckheer & Kolbe, a plaintiff-side law firm, says
      a ransomware group claimed a June 2026 attack and states that CMT had not confirmed the
      incident or notified affected individuals as of the firm's writing. This is an
      unverified solicitation allegation, not confirmation of a breach, data loss, or
      customer impact. NHTSA's 2024 distracted-driving figures establish safety context, not
      CMT demand or outcomes. Diligence should request current deployments, cohort renewal,
      customer concentration, outcome methodology, and any incident-response findings.
    claimRefs: [CU008, CU011, CU012, CU013]
    figureRefs: [FU001]
