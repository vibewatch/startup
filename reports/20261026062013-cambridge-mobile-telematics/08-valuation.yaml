company:
  name: Cambridge Mobile Telematics
chapter:
  number: 8
  title: Valuation
  summary: Public sources report a $350 million transaction but describe its financing character differently, and do not establish a verified company valuation or current operating economics. The defensible recommendation is research-more; a numeric entry range or target return would require current financials, priced transaction terms, and the fully diluted capitalization.
sections:
  - id: financing-evidence
    title: Transaction size is not an entry price
    body: >-
      Multiples.vc lists a $350 million undisclosed-stage round in March 2026,
      while Fortune reports a $350 million strategic investment and describes it
      as entirely secondary (CV001). Fortune quotes CEO Bill Powers saying none
      of the transaction was primary capital, so its size should not be treated
      as cash added to CMT's balance sheet (CV002). The distinction matters:
      secondary proceeds may provide liquidity to selling shareholders, but do
      not establish a new-issue price available to an incoming investor or
      capital available to fund operations. Fortune also relays an above-$1
      billion private valuation estimate from unnamed third parties, without
      identifying the estimator, date, method, or security terms (CV003).
      Caplight's public CMT profile displays an estimated-valuation heading but
      no visible valuation amount (CV003). VCBacked's captured page gives a
      March 24, 2026 update date, but its fetched text contains no financing-row
      or operating metric detail (CV004). These records are useful signals of
      transaction activity, not a verified valuation mark, price per share, or
      company cash balance.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: business-thesis-and-comparables
    title: Historical scale and adjacent-company data do not supply a multiple
    body: >-
      The positive thesis is a subscription-oriented telematics platform with
      reported historical reach: Multiples.vc labels the revenue model
      subscription, and an MIT CSAIL profile says CMT supported over 6.5 million
      drivers in 25 countries at the time of that undated profile (CV005, CV006).
      Those descriptions do not reveal current paid users, revenue per customer,
      renewal behavior, or unit economics. The available adjacent-company
      references are not a matched valuation set. Craft lists Octo Telematics
      revenue of EUR 134 million for FY2020, while CompaniesMarketCap reports a
      $4.51 billion market capitalization for CCC Intelligent Solutions as of
      October 2026 (CV007, CV008). The figures use different companies, periods,
      and measures; neither yields a current CMT EV/revenue or EV/EBITDA
      multiple (CV009). A plaintiff-side law firm also repeats a ransomware
      group's claim of a June 2026 cyberattack, but the retrieved page does not
      independently verify an incident or its impact (CV010). This is a
      diligence risk, not a confirmed loss estimate.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
    tableRefs:
      - TV001
  - id: scenario-analysis
    title: Bull, base, and bear cases remain conditional
    body: >-
      A bull case would require current evidence that reported platform reach
      converts into paid adoption, durable renewals, attractive gross margins,
      and cash generation, alongside an entry price and security class that
      leave room for investor returns. A base case is to defer a price decision:
      the sources reviewed do not provide CMT revenue or ARR, growth, margins,
      retention, cash generation, or a verified valuation basis (CV011). A bear
      case would arise if monetization fails to support the proposed price, if
      preference or transfer terms constrain proceeds, or if a currently
      unverified privacy allegation is substantiated and harms customer
      retention or raises remediation costs (CV010, CV014). No probability
      percentages or numeric valuation bands are assigned because the necessary
      denominators, operating history, and security-level terms are missing
      (CV012). The cases are therefore conditional decision tests, not forecasts;
      any future range should be calculated only after the missing inputs are
      reconciled to dated primary documents and customer cohorts.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV014
    tableRefs:
      - TV003
  - id: recommendation-and-diligence
    title: Research-more until price, economics, and liquidity are verified
    body: >-
      The recommendation is research-more, with low confidence in any numerical
      value and no defensible target return; the current valuation stance is
      unassessable rather than fair or cheap (CV012, CV013). The evidence supports
      a high valuation-and-terms uncertainty rating, not a finding that the
      alleged cyber incident is confirmed. Current sources do not establish the
      latest share price, fully diluted share count, preference waterfall,
      transfer restrictions, or a prospective investor's exit path (CV014).
      Before an entry decision, request dated transaction documents that split
      primary issuance from secondary transfers; a class-by-class cap table and
      liquidation waterfall; current revenue and ARR definitions, growth, gross
      margin, retention cohorts, cash flow and runway; and a documented incident
      response with confirmed scope and customer or regulatory impact. Reprice
      the case if these records fail to reconcile. Do not infer a company
      valuation from gross transaction size, market capitalization of a
      different company, or historical usage reach.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
    tableRefs:
      - TV002
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence and limitation
      - What would change the view
    rows:
      - - Platform thesis
        - Multiples.vc describes a subscription model and MIT reports historical reach; neither provides current revenue, paid-user, or retention economics.
        - Obtain current paid adoption, customer concentration, renewal cohorts, revenue per customer, and gross-margin data.
      - - Financing and price counterweight
        - The $350 million transaction is described as all-secondary by Fortune; a third-party above-$1 billion estimate is not a priced or method-disclosed mark.
        - Reconcile primary and secondary proceeds, dated price, share class, fully diluted shares, and preferences.
      - - Comparable-company limitation
        - Octo's FY2020 revenue and CCC's October 2026 market capitalization are not a matched period or a CMT valuation multiple.
        - Build a model-matched set with current enterprise values, revenue, margins, growth, and transaction dates.
      - - Adverse evidence
        - A plaintiff-side law firm reports a ransomware group's claim; the captured page does not independently establish an incident, scope, or loss.
        - Seek company or regulator confirmation, remediation records, affected-customer counts, and measured financial impact.
    notes: >-
      Qualitative comparison only. The MIT scale reference is historical and
      undated in the fetched text; Octo revenue is FY2020 EUR; CCC is market
      capitalization as of October 2026. None is a direct CMT valuation metric.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV002
    title: Recommendation summary
    columns:
      - Decision item
      - Current assessment
      - Investment implication
    rows:
      - - Recommendation
        - Research-more
        - Do not make a price-cleared entry decision from transaction size alone.
      - - Confidence
        - Low on numerical value; high that the accessible sources do not establish one
        - Wait for primary transaction documents and current operating data.
      - - Risk rating
        - High valuation-and-terms uncertainty; alleged incident impact unquantified
        - Treat the cyber report as a diligence item, not a confirmed liability.
      - - Valuation stance
        - Unassessable; no defensible public price anchor
        - Do not label the company fair, cheap, or expensive without a verified denominator and price.
      - - Target return / hold / exit
        - Not quantifiable from the retained evidence
        - Require entry price, share-class waterfall, dilution, and liquidity terms before modeling returns.
      - - Thesis-break trigger
        - A proposed price cannot be reconciled to verified company economics and security-level proceeds.
        - Reassess or decline until the valuation basis and return path are supported.
    notes: >-
      Analyst judgment from the cited public-source record. "Unassessable" means
      the available evidence does not support a numeric CMT valuation; it is not
      a zero-value conclusion.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation range and probability signal
      - Downside trigger / decision discipline
    rows:
      - - Bull
        - Verified paid adoption, durable retention, attractive gross margin and cash generation; investor-aligned entry terms.
        - No numeric range is supportable; upside probability is unweighted until operating inputs and price are verified.
        - Fails if adoption does not convert into revenue or the entry price absorbs the return potential.
      - - Base
        - Platform reach persists, but current monetization and transaction valuation remain unverified in the reviewed evidence.
        - No numeric range or probability assigned; research-more is the evidence-based action, not a forecast.
        - Reassess after receiving current financials, priced terms, and fully diluted capitalization.
      - - Bear
        - Monetization or growth disappoints, security terms constrain proceeds, or the unverified privacy allegation is substantiated with material effects.
        - Downside range and probability cannot be quantified without an entry price, financial baseline, and preference waterfall.
        - Reprice or decline if verified economics do not support the proposed price, or if incident diligence reveals material customer or regulatory impact.
      - - Exit / liquidity
        - A realizable exit depends on transfer rights, security class, buyer liquidity, and a supported enterprise value.
        - No exit window, hold period, or target return is disclosed in the retained sources.
        - Obtain current transfer restrictions, shareholder liquidity terms, and a security-level proceeds waterfall.
    notes: >-
      Conditional analyst scenarios, not forecasts. Numeric valuation ranges and
      probability percentages are withheld because the retained evidence lacks
      current CMT financials, a verified price, and security-level terms.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
