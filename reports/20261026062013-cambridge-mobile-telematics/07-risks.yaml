    claimRefs: [CR004, CR005, CR009, CR010, CR011, CR013, CR016]
  - id: TR003
    title: Partner, dependency, and financing risk register
    columns:
      - Dependency
      - Public evidence and concentration
      - Failure scenario
      - Likelihood and severity
      - Mitigation visibility and residual exposure
      - Diligence path
    rows:
      - ["Allianz commercial relationship", "CMT's announcement describes long-term agreements with Allianz entities; volume, exclusivity, and revenue share are not stated.", "Deployment slows, terms change, or a material agreement is not renewed.", "Likelihood unknown; potentially high if concentration is material.", "No concentration or replacement evidence; residual exposure is unquantified.", "Obtain contract duration, renewal and termination rights, deployment volumes, and revenue and gross-profit share."]
      - ["Strategic investor and insurer relationships", "TPG, Allianz X, and State Farm are named in the transaction; public sources do not establish customer concentration or governance rights.", "A strategic counterparty changes investment or commercial priorities.", "Likelihood unknown; impact depends on commercial and governance dependencies.", "Relationship is disclosed, but conflict protections and alternative counterparties are not.", "Review governance, exclusivity, conflicts, customer overlap, and portability to other insurers."]
      - ["Operating liquidity and private-market price discovery", "Fortune reports an all-secondary $350 million deal; Forge's valuation is historical and Caplight omits current round terms from its public page.", "The company needs primary capital or an investor relies on stale, non-executable market indicators.", "Cash runway and likelihood unknown; downside could be material.", "No company cash, debt, runway, or current valuation evidence; residual exposure is high but unquantified.", "Obtain cash flow, debt, cap table, current financing proceeds to CMT, preferences, and independent valuation support."]
    notes: >-
      Public transaction value, secondary shareholder liquidity, historical funding raised, and
      cash available to CMT are distinct measures; marketplace data are not audited company
      financial statements.
    claimRefs: [CR001, CR002, CR003, CR006, CR007, CR008]
