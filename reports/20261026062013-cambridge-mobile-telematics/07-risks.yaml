company:
  name: Cambridge Mobile Telematics
chapter:
  number: 7
  title: Risks
  summary: >-
    Public evidence identifies potentially material privacy, service-reliability, partner, and
    financing risks, but does not verify the reported ransomware incident or quantify CMT's
    exposure. The $350 million strategic transaction was reported as all-secondary, while current
    operating cash, partner concentration, and control effectiveness remain undisclosed.
sections:
  - id: privacy-legal
    title: Privacy, legal exposure, and an unverified incident allegation
    body: >-
      CMT's mobile-app license describes a connected telematics data-processing service and
      incorporates a privacy policy by reference, but the assigned text is a consumer license,
      not an enterprise control or data-retention schedule. California's Attorney General
      identifies precise geolocation as sensitive personal information and describes rights and
      notice duties for businesses covered by the CCPA; the evidence does not establish CMT's
      statutory scope, role in each data flow, or jurisdiction-specific compliance. FTC guidance
      similarly sets general expectations for privacy promises and security appropriate to data
      held, not a finding about CMT. Two plaintiff-side law-firm pages repeat a ransomware group's
      claim of a June 2, 2026 attack and describe possible driver, location, and insurance data
      exposure. One says the compromised-data volume is still under investigation. These are
      allegations, not company or regulator notices or forensic confirmation. Treat the potential
      impact as high but occurrence and affected population as unknown; seek primary incident,
      notification, and remediation records before estimating loss.
    claimRefs: [CR009, CR010, CR011, CR012, CR014, CR015]
    tableRefs: [TR001]
  - id: operations-safety
    title: Service continuity, model performance, and safety accountability
    body: >-
      Fortune describes CMT's use of smartphone, vehicle-sensor, and dashcam signals in insurer,
      automaker, and public-agency workflows. It also attributes substantial crash-prevention and
      driver-reach figures to CMT and Frost & Sullivan, but the assigned sources provide no
      validation method, error rates, or customer-level outcomes. Traffic Safety Marketing's
      2024 distracted-driving figures establish the serious public-safety context, not CMT's
      impact. CMT's consumer license states that software may not be error-free and that use may
      be interrupted; it does not document an actual outage and does not establish enterprise
      uptime commitments. A failure in data capture, risk scoring, crash detection, or service
      recovery could affect customer workflows, but likelihood and current mitigation maturity
      cannot be measured from this pool. Request deployment-specific validation, service-level
      history, recovery exercises, and escalation outcomes before treating safety claims as proven
      risk reduction.
    claimRefs: [CR004, CR005, CR013, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partner-capital
    title: Partner dependence and financing transparency
    body: >-
      CMT's March 2026 company announcement names long-term commercial agreements with Allianz
      entities, and both the announcement and Fortune identify TPG, Allianz X, and State Farm in
      the strategic transaction. Neither source quantifies partner revenue, gross-profit
      concentration, renewal economics, exclusivity, or replacement capacity. Fortune reports
      that the $350 million investment was all-secondary and quotes CMT's CEO saying it was not
      primary capital; the headline therefore does not establish cash available to CMT or runway.
      Forge's reported $1.53 billion post-money valuation and $505 million Series B amount refer
      to 2018, while Forge disclaims audit and executable-market-price status for its private
      data. Caplight lists a 2026 strategic round but does not show its amount or valuation on
      the public page reviewed. These limitations signal opacity, not proof of financial
      distress. Obtain company cash-flow and cap-table records plus partner-level economics, and
      monitor renewals and funding needs against verified operating requirements.
    claimRefs: [CR001, CR002, CR003, CR006, CR007, CR008]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring indicators and thesis-break triggers
    body: >-
      Prioritize confirmed exposure of identifiable driver or precise-location data, missed
      notification obligations, or a regulator inquiry as immediate legal and customer-risk
      escalations; the current alerts alone do not establish any of these outcomes. For
      operations, track severity-weighted incidents, recovery against contractual service
      levels, and independently measured false-positive and false-negative rates for each
      deployed use case. For safety claims, require reproducible methods and customer-level
      evidence rather than relying on aggregate company-attributed results. For partner and
      financing risk, request renewal calendars, exclusivity and termination clauses, revenue
      concentration, cash, debt, and any primary proceeds separately from secondary shareholder
      liquidity. A confirmed material breach, repeated contractual service failures, a partner
      exit that impairs a material deployment, or insufficient verified resources for compliance
      and product obligations should trigger a thesis review. Public evidence does not yet support
      numeric probabilities or loss estimates.
    claimRefs: [CR002, CR003, CR005, CR007, CR008, CR011, CR013, CR014, CR015, CR016]
