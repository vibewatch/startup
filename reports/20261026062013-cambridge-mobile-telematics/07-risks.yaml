      - ["Risk-score or crash-detection error", "No false-positive or false-negative rates are supplied.", "Potentially high for insurance, claims, and safety decisions.", "Public materials describe capabilities and outcomes, not validation controls.", "Unknown until performance is independently tested by use case.", "Obtain model validation, drift monitoring, error analysis, and customer-level outcomes."]
