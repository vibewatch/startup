company:
  name: Cambridge Mobile Telematics
chapter:
  number: 3
  title: Competitors
  summary: >
    CMT competes across insurer risk analytics, crash and claims workflows, and
    adjacent fleet-safety tools; its observable edge is a multi-signal product
    and strategic insurer access, not a demonstrated pricing or switching-cost
    moat. Arity, Netradyne, and insurer-data integrations address overlapping
    but non-identical jobs, while public evidence does not establish relative
    performance, realized pricing, or internal-build economics.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >
      The relevant contest is not a single vendor-versus-vendor category.
      CMT's sources place it in mobile and vehicle telematics for insurer risk
      scoring, crash detection, claims support, and road-safety programs.
      Arity markets driving-behavior data, a lead platform, crash detection,
      and geographic risk tools; Netradyne is a fleet-safety alternative built
      around multi-camera dashcams and driver monitoring. Verisk's fetched
      page title is narrower: it announces an available Data Exchange
      integration for insurance telematics, making it
      evidence of an adjacent data-distribution route rather than proof of a
      like-for-like CMT platform. GHSA's directory calls CMT a telematics
      service provider, but its fetched profile provides no comparison
      methodology. The competitor list is therefore a partial sample of
      evidenced substitutes, not an exhaustive market census. Insurer-built
      programs, navigation apps, OEM tools, and manual claims workflows remain
      plausible status-quo alternatives, but the assigned sources do not
      establish their scale, economics, or feature parity.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP006
      - CP007
      - CP009
      - CP010
      - CP016
    tableRefs:
      - TP001
  - id: capabilities-and-distribution
    title: Capability overlap and distribution
    body: >
      CMT's evidence-backed product bundle connects driving signals to insurer
      risk and service workflows: a partner listing describes behavior scoring
      and driver engagement, while the 2026 TPG announcement describes real-time
      risk assessment, crash detection, and commercial agreements with Allianz
      entities. That combination can make insurer relationships and data
      integration more consequential than a standalone scoring feature.
      Arity's own site describes driving-behavior insights, lead acquisition,
      crash detection, and geographic risk; these are company descriptions,
      not independent proof of customer outcomes. Netradyne's fleet use case
      is more visibly hardware- and video-centered, with road- and
      driver-facing cameras and additional fleet monitoring features. Verisk's
      integration announcement signals that data access is itself a route to
      distribution, but its fetched text does not disclose the integration's
      functionality or customer adoption. None of these sources establishes
      comparative accuracy, retention, or price-performance.
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: economics-and-switching
    title: Pricing, switching, and moat durability
    body: >
      The most decision-relevant competitive variables remain private in the
      assigned evidence: no reviewed product or integration page states
      realized prices, contract duration, discounts, renewal rates, or
      customer-level deployment costs. The available descriptions identify
      smartphone and optional-tag approaches, camera hardware, data products,
      and marketplace distribution, but they do not show whether a buyer can
      multi-home, export historical data, or replace one workflow without
      rebuilding integrations. CMT's long-term Allianz agreements and insurer
      partnerships are evidence of access, not proof of exclusive distribution
      or lock-in. Likewise, broad data-volume statements published by vendors
      are not directly comparable: the sources use different units, scopes,
      and definitions, and none supplies an independent benchmark. The moat
      case should therefore remain conditional on diligence into outcomes,
      portability, contract terms, and customer concentration.
    claimRefs:
      - CP001
      - CP005
      - CP011
      - CP012
      - CP013
    tableRefs:
      - TP003
  - id: adverse-evidence
    title: Trust risk and unresolved alternatives
    body: >
      One plaintiff-side law-firm page reports that a ransomware group claimed
      responsibility for an attack against CMT in June 2026 and alleges
      potentially exposed driver, location, and insurance information. The
      fetched page is a solicitation for prospective claimants; it does not
      provide independent incident confirmation, a verified affected-person
      count, or a company response. This is a diligence signal, not a
      confirmed-breach finding. Because telematics products depend on sensitive
      location and driving data, buyers may weigh security assurances and
      remediation alongside risk-model performance, but the assigned sources
      do not establish the incident's status or its customer impact. Internal
      insurer builds, navigation-platform substitutes, and likely entrants
      also remain uncharacterized; their capabilities and economics should not
      be inferred from the presence of public alternatives.
    claimRefs:
      - CP014
    tableRefs: []
    figureRefs: []
