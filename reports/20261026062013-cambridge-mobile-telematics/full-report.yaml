      - number: '4.4'
        title: Underwriting verdict and adverse exposure
        blocks:
          - type: paragraph
            body: >-
              The financing and Allianz agreements demonstrate strategic investor and partner commitment, but they do
              not resolve whether CMT converts program scale into recurring, profitable revenue or how much capital the
              business consumes to deliver each program. A plaintiff-side law firm states that a ransomware group
              claimed a June 2026 attack and that CMT had not confirmed the incident or notified affected individuals as
              of that firm's page; this is an allegation by an interested source, not proof of a breach, liability, or
              loss. No quantified remediation cost, claim, insurance recovery, or customer impact is available in the
              assigned evidence. The financial stance is therefore strategic validation with material disclosure risk:
              require audited revenue and margin history, contract economics, working-capital and debt schedules,
              current cash and burn, and verified incident-loss information before underwriting.
            claimRefs:
              - CI014
              - CI015
              - CI016
