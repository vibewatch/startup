companyProfile:
  summary: >-
    Cambridge Mobile Telematics is a private telematics platform founded in Cambridge in 2010 with academic roots in
    MIT's CarTel mobile-sensing work. Its DriveWell Fusion platform combines mobile and vehicle sensor data with
    contextual information for driving-risk assessment, crash detection, claims, and driver-improvement workflows.
    Public materials describe insurer, automaker, commercial-mobility, and public-sector use cases, while current
    financial performance and customer-level economics remain undisclosed in the reviewed evidence.
