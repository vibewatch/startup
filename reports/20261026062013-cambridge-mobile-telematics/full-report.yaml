              - CM014
      - number: '2.4'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Market-research commentary identifies UBI adoption, connected vehicles and sensors, personalized
              insurance, and analytics or AI as demand drivers. Real adoption still depends on insurer integration,
              driver participation, and trust in how driving data is used. GMI lists privacy and security concerns and
              high installation and maintenance costs as challenges; the Allianz announcement says driving data is used
              with driver consent. These sources establish categories of friction, not CMT-specific opt-in rates,
              privacy-related churn, deployment cost, or compliance burden.

              Public partnership and program announcements demonstrate use cases but do not quantify pilot-to-production
              conversion, renewal, contract pricing, or independently validated loss-ratio improvement by segment.
              Diligence should obtain buyer-specific contracts and deployment cohorts, then reconcile eligible insurer
              software spend to CMT revenue before translating broad market forecasts into a valuation case.
            claimRefs:
              - CM007
              - CM014
              - CM015
