        title: Capability overlap and distribution
        blocks:
          - type: paragraph
            body: >
              CMT's evidence-backed product bundle connects driving signals to insurer risk and service workflows: a
              partner listing describes behavior scoring and driver engagement, while the 2026 TPG announcement
              describes real-time risk assessment, crash detection, and commercial agreements with Allianz entities.
              That combination can make insurer relationships and data integration more consequential than a standalone
              scoring feature. Arity's own site describes driving-behavior insights, lead acquisition, crash detection,
              and geographic risk; these are company descriptions, not independent proof of customer outcomes.
              Netradyne's fleet use case is more visibly hardware- and video-centered, with road- and driver-facing
              cameras and additional fleet monitoring features. Verisk's integration announcement signals that data
              access is itself a route to distribution, but its fetched text does not disclose the integration's
