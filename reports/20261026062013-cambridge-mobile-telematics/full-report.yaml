  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The core category is narrower than total motor-insurance premiums or all connected-mobility spending: it
              comprises telematics products and services used to capture driving signals and support insurer risk
              assessment, claims, safety, and driver engagement. Usage-based insurance (UBI) and behavior-based
              insurance are applications in which driving data informs pricing or coverage; the insurance premium pool
              is not equivalent to telematics-vendor revenue and should not be added to it. CMT's described work also
              reaches automakers, commercial mobility, and public agencies. These adjacencies matter to the company's
              product scope, but assigned market reports do not disclose separate values or overlap rules for them.

              Non-telematics underwriting, claims, and driver-engagement processes are plausible status-quo
              alternatives, but the available sources do not quantify their spend or displacement. The boundary
              therefore separates insurer-facing platform spend from policy premiums, vehicle hardware, general fleet
              systems, and road-infrastructure budgets unless a source explicitly includes those categories. That
              distinction prevents a broad mobility narrative from becoming an unsupported CMT revenue pool.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.2'
        title: Published estimates and sizing limits
        blocks:
          - type: paragraph
            body: >-
              Global Market Insights (GMI) estimates the global insurance-telematics market at USD 7.7 billion in 2025
              and forecasts USD 30.9 billion in 2034, with a stated 19.7% CAGR for 2026–2034. Data Bridge Market
              Research (DBMR) separately estimates the global usage-based-insurance market at USD 24.83 billion in 2022
              and forecasts USD 164.44 billion by 2030, with a stated 26.66% CAGR for 2023–2030. The publishers use
              different category labels, base years, and forecast windows; the assigned excerpts provide no common
              denominator or reconciliation. These estimates are directional references, not nested TAM/SAM layers or a
              direct growth comparison.

              GMI also reports around USD 2.4 billion of U.S. insurance-telematics revenue for 2025 and describes an
              81.6% share in North America. The wording does not make the 81.6% denominator unambiguous, so it is not
              used as a U.S. share of global market or as CMT market share. Neither report isolates CMT's serviceable
              buyer base, paid software spend, pricing, adoption ceiling, or obtainable share; a company-specific
              SAM/SOM cannot be derived from these totals.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
