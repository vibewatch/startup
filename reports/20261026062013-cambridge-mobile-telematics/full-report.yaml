  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              CMT's public product material positions DriveWell Fusion as the shared platform behind insurer, automaker,
              commercial-mobility, and public-sector use cases. Its June 2025 release described product updates across
              driver safety, emergency assistance, engagement, and claims rather than a single standalone application.
              Those descriptions identify a wide workflow footprint, but are company claims: the materials do not
              provide customer-level deployment counts, contractual service levels, or independently audited outcome
              data. The stated claims workflow combines telematics data with AI-driven photo analysis; its claimed speed
              and savings figures should not be treated as realized customer economics without a disclosed sample and
              methodology. [CE001, CE002]
