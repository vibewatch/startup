            body: >-
              The source-supported chronology starts with MIT CSAIL's 2004-2010 CarTel research project, followed by
              Tracxn's 2010 founding date and funding records beginning in 2014, a 2018 SoftBank Vision Fund
              transaction, and the 2026 strategic investment. CMT's newsroom page also lists an October 2026
