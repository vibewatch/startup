        title: Documented operating model, not a disclosed software architecture
        blocks:
          - type: paragraph
            body: >-
              The most supportable technical picture is a high-level signal-to-workflow model. Public descriptions name
              smartphones, proprietary Tags, connected vehicles, dashcams, and third-party devices as signal sources;
              they describe contextual data being combined with those signals to inform risk, crash, and claims
              workflows. An MIT CSAIL account traces the underlying lineage to CarTel research on cleaning noisy
              mobile-sensor data and making inferences about device activity, while CMT's recruiting listing describes
              production machine learning for sequential and multimodal data across cloud and edge. These sources do not
              disclose model design, data schemas, deployment topology, integration APIs, or validation benchmarks, so a
              layer diagram here represents documented functions and dependencies rather than an asserted internal
              stack. CMT also says Tag+ uses its proprietary mesh network to keep drivers connected when phone-app
              permissions are off; this is a company-described capability, not independently characterized network
              architecture. [CE003, CE004, CE005, CE006, CE007, CE014]
