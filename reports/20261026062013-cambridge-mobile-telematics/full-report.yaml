chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and reach
        blocks:
          - type: paragraph
            body: >-
              Tracxn identifies CMT as a Cambridge, Massachusetts-based company founded in 2010 and labels it a Series D
              company. MIT CSAIL traces the company's academic precursor to its CarTel mobile-sensing research project.
              CMT describes its DriveWell Fusion platform as combining telematics and AI to identify driving risk,
              detect crashes, support claims, and encourage safer driving. The company says it serves insurers,
              automakers, commercial mobility companies, and public-sector organizations; this is a multi-sided software
              and data-services proposition rather than a disclosed stand-alone hardware business. Its March 2026
              release reports 55 million drivers across 25 countries; Fortune separately reports more than 55 million.
              Those are driver/program measures, not a count of paying customer accounts. Tracxn lists 466 employees "as
              of Apr 26" without stating a year in the fetched text, so the figure is not a current audited headcount.
              MIT CSAIL and Tracxn identify Samuel Madden as a co-founder; Tracxn also lists him as chief scientist.
              CMT, Fortune, and Tracxn identify William V. Powers as co-founder and CEO. Tracxn displays a six-person
              board roster, but its "independent" labels are not corroborated by a primary source; board control and
              succession coverage remain diligence gaps.
