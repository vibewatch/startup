      - number: '3.4'
        title: Trust risk and unresolved alternatives
        blocks:
          - type: paragraph
            body: >
              One plaintiff-side law-firm page reports that a ransomware group claimed responsibility for an attack
              against CMT in June 2026 and alleges potentially exposed driver, location, and insurance information. The
              fetched page is a solicitation for prospective claimants; it does not provide independent incident
              confirmation, a verified affected-person count, or a company response. This is a diligence signal, not a
              confirmed-breach finding. Because telematics products depend on sensitive location and driving data,
              buyers may weigh security assurances and remediation alongside risk-model performance, but the assigned
              sources do not establish the incident's status or its customer impact. Internal insurer builds,
              navigation-platform substitutes, and likely entrants also remain uncharacterized; their capabilities and
              economics should not be inferred from the presence of public alternatives.
            claimRefs:
              - CP014
