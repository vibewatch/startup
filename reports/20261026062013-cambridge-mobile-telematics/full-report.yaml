        title: Exhibits
        blocks:
          - type: callout
            title: Broad market forecasts do not establish CMT's obtainable market
            body: >-
              Insurance telematics and usage-based insurance overlap but are not reconciled in the assigned estimates.
              Without CMT-specific contract pricing, segment revenue, eligible buyer counts, and adoption evidence,
              neither publisher's global forecast establishes CMT's SAM or SOM.
