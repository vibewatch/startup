      - number: '2.3'
        title: Buyer, user, and adoption map
        blocks:
          - type: paragraph
            body: >-
              Insurers are the clearest enterprise counterpart in the reviewed evidence: Fortune describes insurers
              using telematics insights to price risk, detect crashes, and coach drivers. CMT and partner materials also
              identify automakers, commercial-mobility companies, and the public sector. The buyer is not always the
              data user: drivers generate data and may receive feedback or assistance, while insurer underwriting,
              claims, or program teams are the likely platform users. The sources do not identify budget ownership or
              vendor payment terms for every segment.

              The March 2026 Allianz announcement describes long-term commercial agreements with Allianz operating
              entities for data-driven insurance and service offerings across Europe, including retail customers, OEMs,
              and mobility partners. GovTech reports that Boston and Los Angeles public agencies used CMT technology in
              safe-driving programs. EquityZen's profile reports more than 20 customers in 14 countries but is undated
              and does not define the customer count. CMT's October 2025 release reports 140 programs across six
              continents and more than 55 million people measured or protected; those are company-reported reach
              measures, not paying-customer counts or contract values.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
