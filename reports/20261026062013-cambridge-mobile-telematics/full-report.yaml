      - number: '3.3'
        title: Pricing, switching, and moat durability
        blocks:
          - type: paragraph
            body: >
              The most decision-relevant competitive variables remain private in the assigned evidence: no reviewed
              product or integration page states realized prices, contract duration, discounts, renewal rates, or
              customer-level deployment costs. The available descriptions identify smartphone and optional-tag
              approaches, camera hardware, data products, and marketplace distribution, but they do not show whether a
              buyer can multi-home, export historical data, or replace one workflow without rebuilding integrations.
              CMT's long-term Allianz agreements and insurer partnerships are evidence of access, not proof of exclusive
              distribution or lock-in. Likewise, broad data-volume statements published by vendors are not directly
              comparable: the sources use different units, scopes, and definitions, and none supplies an independent
              benchmark. The moat case should therefore remain conditional on diligence into outcomes, portability,
              contract terms, and customer concentration.
