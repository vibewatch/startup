  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >
              The relevant contest is not a single vendor-versus-vendor category. CMT's sources place it in mobile and
              vehicle telematics for insurer risk scoring, crash detection, claims support, and road-safety programs.
              Arity markets driving-behavior data, a lead platform, crash detection, and geographic risk tools;
              Netradyne is a fleet-safety alternative built around multi-camera dashcams and driver monitoring. Verisk's
              fetched page title is narrower: it announces an available Data Exchange integration for insurance
              telematics, making it evidence of an adjacent data-distribution route rather than proof of a like-for-like
              CMT platform. GHSA's directory calls CMT a telematics service provider, but its fetched profile provides
              no comparison methodology. The competitor list is therefore a partial sample of evidenced substitutes, not
              an exhaustive market census. Insurer-built programs, navigation apps, OEM tools, and manual claims
              workflows remain plausible status-quo alternatives, but the assigned sources do not establish their scale,
              economics, or feature parity.
