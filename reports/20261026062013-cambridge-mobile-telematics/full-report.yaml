      - number: '1.2'
        title: Financing, stakeholders, and economic visibility
        blocks:
          - type: paragraph
            body: >-
              On March 24, 2026, CMT announced a $350 million strategic investment led by TPG and Allianz X with State
              Farm participating; Fortune independently described the transaction as all-secondary and quoted CEO Powers
              saying that none of it was primary capital. The headline amount therefore signals investor interest and
              strategic alignment, not new cash available to CMT. Tracxn labels CMT a Series D company and reports $852
              million of cumulative funding across four rounds, but neither database field should be substituted for
              primary proceeds or cash-on-hand: the public transaction descriptions do not reconcile those measures.
              Fortune also cites third-party valuation estimates above $1 billion without publishing a transaction
              valuation or methodology. CMT makes no revenue, ARR, margin, or runway figure available in the reviewed
              sources. The stakeholder map records disclosed roles, not ownership percentages, board control, or current
              cap-table economics.
