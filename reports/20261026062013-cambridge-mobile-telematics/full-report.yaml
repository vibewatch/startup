      - number: '4.3'
        title: Strategic financing is not evidence of new operating cash
        blocks:
          - type: paragraph
            body: >-
              Computer Weekly described CMT's March 2026 $350 million strategic investment as a cash injection to scale
              development. Fortune's exclusive, however, quotes CEO William Powers saying none of the transaction was
              primary capital and that it was all-secondary. The conflicting descriptions mean the announced amount does
              not establish proceeds to CMT; verify the transaction documents before treating it as operating cash.
              CMT's announcement names platform expansion, AI-model development, and Universal Driving Score adoption as
              intended uses. Powers also said the company continues to generate cash, but neither that statement nor the
              reported transaction quantifies cash on hand, operating burn, debt, restricted cash, or runway. An
              independent article relays unnamed third-party valuation estimates above $1 billion, but discloses no
              method or transaction valuation. Liquidity and financing dependence remain un-underwritable without
              management accounts and the underlying transaction documents.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI012
