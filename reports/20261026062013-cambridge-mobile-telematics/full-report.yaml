      - Investment implication
    rows:
      - - Recommendation
        - Research-more
        - Do not make a price-cleared entry decision from transaction size alone.
      - - Confidence
        - Low on numerical value; high that the accessible sources do not establish one
        - Wait for primary transaction documents and current operating data.
      - - Risk rating
        - High valuation-and-terms uncertainty; alleged incident impact unquantified
        - Treat the cyber report as a diligence item, not a confirmed liability.
      - - Valuation stance
        - Unassessable; no defensible public price anchor
        - Do not label the company fair, cheap, or expensive without a verified denominator and price.
      - - Target return / hold / exit
        - Not quantifiable from the retained evidence
        - Require entry price, share-class waterfall, dilution, and liquidity terms before modeling returns.
      - - Thesis-break trigger
        - A proposed price cannot be reconciled to verified company economics and security-level proceeds.
        - Reassess or decline until the valuation basis and return path are supported.
    notes: >-
      Analyst judgment from the cited public-source record. "Unassessable" means the available evidence does not support
      a numeric CMT valuation; it is not a zero-value conclusion.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns:
      - Case
      - Explicit assumptions
      - Valuation range and probability signal
      - Downside trigger / decision discipline
    rows:
      - - Bull
        - >-
          Verified paid adoption, durable retention, attractive gross margin and cash generation; investor-aligned entry
          terms.
        - >-
          No numeric range is supportable; upside probability is unweighted until operating inputs and price are
          verified.
        - Fails if adoption does not convert into revenue or the entry price absorbs the return potential.
      - - Base
        - >-
          Platform reach persists, but current monetization and transaction valuation remain unverified in the reviewed
          evidence.
        - No numeric range or probability assigned; research-more is the evidence-based action, not a forecast.
        - Reassess after receiving current financials, priced terms, and fully diluted capitalization.
      - - Bear
        - >-
          Monetization or growth disappoints, security terms constrain proceeds, or the unverified privacy allegation is
          substantiated with material effects.
        - >-
          Downside range and probability cannot be quantified without an entry price, financial baseline, and preference
          waterfall.
        - >-
          Reprice or decline if verified economics do not support the proposed price, or if incident diligence reveals
          material customer or regulatory impact.
      - - Exit / liquidity
        - >-
          A realizable exit depends on transfer rights, security class, buyer liquidity, and a supported enterprise
          value.
        - No exit window, hold period, or target return is disclosed in the retained sources.
        - Obtain current transfer restrictions, shareholder liquidity terms, and a security-level proceeds waterfall.
    notes: >-
      Conditional analyst scenarios, not forecasts. Numeric valuation ranges and probability percentages are withheld
      because the retained evidence lacks current CMT financials, a verified price, and security-level terms.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
