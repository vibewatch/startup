schemaVersion: "report-v2"
artifact: financials
slug: cambridge-mobile-telematics
runDate: 2026-10-26
company:
  name: Cambridge Mobile Telematics
chapter:
  number: 4
  title: Financials
  summary: >-
    CMT announced a $350 million strategic investment and commercial agreements
    with Allianz, but reporting differs on whether the transaction delivered
    cash to the company. Fortune describes it as all-secondary, while Computer
    Weekly calls it a cash injection. Public materials reviewed here do not
    establish revenue, realized pricing, margins, cash, or runway, so
    underwriting still depends on private financial and contract data.
sections:
  - id: commercial-model
    title: Commercial model and revenue visibility
    body: >-
      CMT describes a B2B platform serving insurers, automakers, commercial-mobility
      companies, and the public sector with telematics, risk assessment, crash
      detection, and claims workflows. Its March 2026 announcement adds long-term
      commercial agreements with Allianz entities for data-driven insurance and
      service offerings across Europe. These disclosures establish a commercial
      route to market, not a disclosed fee schedule or a measured revenue stream.
      The reviewed company materials and reporting do not identify contract
      units, minimum commitments, implementation charges, renewal terms, realized
      discounts, or revenue-recognition policy. CMT's consumer-facing claim that
      participating drivers can save up to 50% on auto insurance describes a
      driver benefit, not CMT's own price, take rate, or revenue.
    claimRefs: [CI004, CI005, CI006, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: efficiency-and-margins
    title: Sales efficiency and unit economics remain private
    body: >-
      The available evidence is insufficient to calculate customer acquisition
      cost, sales cycle, implementation cost, payback, retention, gross margin,
      or contribution margin. Public statements about program reach and safer
      driving outcomes are operating or impact claims; they are not substitutes
      for recognized revenue, paid customer counts, utilization, or renewal
      cohorts. AskCyborg's AI-generated overview says detailed financials are
      proprietary, but provides no underlying sources or metrics and should be
      treated only as a low-confidence indication of the disclosure gap.
      Caplight's public page identifies a March 2026 strategic round while
      leaving amount and valuation fields blank and gating its filing records.
      The resulting diligence priority is a contract-level bridge from customer
      activity to recognized revenue and service-delivery cost.
    claimRefs: [CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: capital-position
    title: Strategic financing is not evidence of new operating cash
    body: >-
      Computer Weekly described CMT's March 2026 $350 million strategic
      investment as a cash injection to scale development. Fortune's
      exclusive, however, quotes CEO William Powers saying none of the
      transaction was primary capital and that it was all-secondary. The
      conflicting descriptions mean the announced amount does not establish
      proceeds to CMT; verify the transaction documents before treating it as
      operating cash. CMT's announcement names platform expansion, AI-model
      development, and Universal Driving Score adoption as intended uses.
      Powers also said the company continues to generate cash, but neither that
      statement nor the reported transaction quantifies cash on hand, operating
      burn, debt, restricted cash, or runway.
      An independent article relays unnamed third-party valuation estimates
      above $1 billion, but discloses no method or transaction valuation.
      Liquidity and financing dependence remain un-underwritable without
      management accounts and the underlying transaction documents.
    claimRefs: [CI001, CI002, CI003, CI009, CI012, CI013]

  - id: financial-risk-and-verdict
    title: Underwriting verdict and adverse exposure
    body: >-
      The financing and Allianz agreements demonstrate strategic investor and
      partner commitment, but they do not resolve whether CMT converts program
      scale into recurring, profitable revenue or how much capital the business
      consumes to deliver each program. A plaintiff-side law firm states that
      a ransomware group claimed a June 2026 attack and that CMT had not
      confirmed the incident or notified affected individuals as of that
      firm's page; this is an allegation by an interested source, not proof of
      a breach, liability, or loss. No quantified remediation cost, claim,
      insurance recovery, or customer impact is available in the assigned
      evidence. The financial stance is therefore strategic validation with
      material disclosure risk: require audited revenue and margin history,
      contract economics, working-capital and debt schedules, current cash and
      burn, and verified incident-loss information before underwriting.
    claimRefs: [CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and monetization visibility
    columns: [Customer or stream, Disclosed mechanism, Public financial detail, Underwriting follow-up]
    rows:
      - [Insurers, "Telematics risk and insurance workflows; Allianz commercial agreements are disclosed", "Contract price, unit, term, and recognized revenue not disclosed", "Review signed agreements, billing basis, minimums, renewals, and revenue recognition"]
      - [Automakers and mobility partners, "Risk assessment, crash detection, and data-driven services", "No customer-level revenue or realized pricing disclosed", "Request partner-level revenue, deployment cost, and renewal data"]
      - [Commercial mobility and public sector, "CMT says it serves these partner groups with safety and claims capabilities", "No separate stream mix or public-sector contract economics disclosed", "Reconcile contracts, implementation fees, service levels, and collections"]
      - [Driver-facing programs, "CMT says programs can help drivers save up to 50% on auto insurance", "Driver savings are not CMT pricing or revenue", "Separate insurer-funded discounts from CMT fees and incentive costs"]
    notes: Public sources describe customers, capabilities, and a partner agreement but do not disclose fees, realized prices, revenue mix, or accounting treatment; driver savings are not CMT revenue.
    claimRefs: [CI004, CI005, CI006, CI010]
  - id: TI002
    title: Pricing and revenue-quality evidence
    columns: [Metric or term, Public value, Evidence status, Diligence request]
    rows:
      - [List price and realized price, null, "No price schedule or realized contract rate in assigned evidence", "Obtain price cards, discounts, contract-level billings, and renewal terms"]
      - [Revenue and ARR, null, "No CMT revenue or ARR figure in assigned evidence", "Obtain audited annual and quarterly revenue with ARR definition and reconciliation"]
      - [Revenue recognition, null, "No contract or accounting-policy detail in assigned evidence", "Review revenue-recognition policy, contract liabilities, and services versus software mix"]
      - [Customer concentration and retention, null, "No cohort, renewal, or concentration data disclosed in assigned evidence", "Request customer/module/geography cohorts, churn, expansion, and top-customer exposure"]
    notes: Null values mean the assigned public sources do not provide the metric or term; they are not zero, and no revenue estimate is inferred.
    claimRefs: [CI004, CI010]
  - id: TI003
    title: Capital, unit economics, and diligence gaps
    columns: [Input, Public value or statement, What it establishes, What remains unknown]
    rows:
      - ["March 2026 strategic investment", "$350 million; TPG and Allianz X led, State Farm participated", "A reported strategic transaction", "Primary proceeds, cash available to CMT, and detailed transaction allocation"]
      - [Transaction structure, "Computer Weekly called it a cash injection; Fortune quoted the CEO saying it was all-secondary with no primary capital", "The sources differ; the announced amount does not establish cash proceeds to CMT", "Confirm primary/secondary allocation from transaction documents, plus current cash, debt, liquidity restrictions, and next-round trigger"]
      - [Cash generation, "CEO William Powers told Fortune that CMT continues to generate cash", "An unquantified company statement reported by Fortune", "Operating cash flow, burn, working capital, runway, and forecast"]
      - [Valuation, "Fortune relayed unnamed third-party estimates above $1 billion; Caplight displays no public valuation figure", "A reported estimate, not an independently established transaction value", "Method, date, fully diluted capitalization, and preferred-security terms"]
      - [Cost to serve and gross margin, null, "No company-specific cost or margin figure in assigned evidence", "Gross margin by product, cloud/data costs, support, implementation, and claims operations"]
      - [Potential incident exposure, "A plaintiff-side firm describes an alleged June 2026 attack; no amount is reported", "An unverified allegation is a diligence lead, not a booked liability", "Verify incident, notifications, remediation, claims, insurance, and customer loss"]
    notes: The announced financing amount does not establish cash available to CMT; conflicting press descriptions, CEO statements, third-party valuation estimates, and allegations retain their original attribution and uncertainty.
    claimRefs: [CI001, CI002, CI009, CI012, CI013, CI015]
figures:
  - id: FI001
    title: "Revenue model bridge: disclosed relationships to unreported economics"
    type: flow
    summary: Conceptual path from customer relationships to revenue and gross profit; public evidence does not quantify contract economics or margins.
    data:
      nodes:
        - id: buyers
          label: Insurers, automakers, mobility and public-sector partners
          detail: CMT identifies these as partner or customer groups.
        - id: agreement
          label: Commercial agreement or program
          detail: Long-term Allianz agreements are disclosed; other contract terms are not.
        - id: offering
          label: Telematics, risk, crash and claims services
          detail: Company-described platform and service capabilities.
        - id: price
          label: Contract unit and realized price unavailable
          detail: No fee schedule or customer-level price is disclosed in assigned evidence.
        - id: revenue
          label: Recognized revenue unavailable
          detail: No revenue, ARR, or revenue-recognition data is disclosed in assigned evidence.
        - id: gross-profit
          label: Cost to serve and gross profit unavailable
          detail: No gross-margin or delivery-cost data is disclosed in assigned evidence.
      edges:
        - from: buyers
          to: agreement
        - from: agreement
          to: offering
        - from: offering
          to: price
        - from: price
          to: revenue
        - from: revenue
          to: gross-profit
    approximationNotes: This is an analytical sequence, not a measured revenue bridge; the undisclosed terms and values are deliberately not estimated.
    claimRefs: [CI004, CI005, CI010, CI011]
callouts:
