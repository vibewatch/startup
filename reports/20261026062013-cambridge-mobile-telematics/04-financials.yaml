    title: The $350 million amount does not establish cash available to CMT
    body: Computer Weekly called the transaction a cash injection, while Fortune quoted CMT's CEO saying it was all-secondary with no primary capital; verify transaction documents and obtain current cash and operating-cash-flow records separately.
    claimRefs: [CI001, CI002, CI013]
