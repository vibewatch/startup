chapter:
  number: 8
  title: Valuation
  summary: >-
    Public secondary transactions moved La Renon's indicated valuation from about
    Rs 6,500 crore in April 2024 to nearly Rs 11,000 crore in September 2025,
    but the operating proof that is publicly visible remains thin and partly
    inconsistent. The result is a price-sensitive track call rather than an
    underwritten buy until audited financials, cap-table rights, and current
    IPO-readiness evidence are available.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The public record supports a quality business with meaningful chronic-therapy
      scale, but not a clean buy at the latest visible private mark. Medical
      Dialogues reports FY24 revenue of Rs 1,400 crore and EBITDA of Rs 300 crore,
      while MedicinMan reports a later 7% transaction at nearly Rs 11,000 crore.
      That valuation step-up shows investor demand, yet the public evidence set is
      still built from snippets, company pages, and data aggregators rather than a
      recent audited package. Entry discipline therefore matters more than the
      company-quality story: without cleaner evidence on earnings durability,
      leverage, investor rights, and exit timing, the prudent stance is to track
      and engage only if diligence closes the gaps or price resets.
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV011, CV014, CV015, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenario-framework
    title: Scenario framework and valuation sensitivity
    body: >-
      The upside case rests on La Renon converting niche chronic-therapy
      positioning into sustained earnings growth that can justify the 2025 mark.
      Official pages still describe nephrology leadership, export reach, and a
      40-plus-country footprint, while the 2024 and 2025 secondary transactions
      show repeated institutional appetite. The problem is that public valuation
      context outruns public disclosure: one data service shows a Rs 1,250-1,500
      crore revenue band, Medical Dialogues cites Rs 1,400 crore revenue and
      Rs 300 crore EBITDA, and there is no public audited FY25 or FY26 package in
      this pool to prove that the higher mark is already earned. That makes the
      current setup asymmetrical: upside needs fresh proof, while downside can
      revert toward earlier transaction anchors if execution or liquidity slips.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV014, CV015]
    tableRefs: [TV003]
  - id: diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-break triggers
    body: >-
      The most important diligence work is around what public sources do not
      settle cleanly. LinkedIn still shows a 501-1,000 employee band, while
      TheCompanyCheck reports 2,727 employees as of February 2025, a useful
      reminder that public disclosures are not synchronized. TheCompanyCheck also
      shows Rs 85.65 crore of open charges and a nominee director appointment in
      2024, both signals that financing structure and governance deserve direct
      review rather than inference. VCCircle's public preview of a 2022 IPO plan
      is too stale to underwrite an exit path in 2026. Thesis-break triggers are
      straightforward: audited earnings that fail to scale into the latest mark,
      investor-rights terms that subordinate new money, or a delayed IPO/liquidity
      path that leaves the 2025 valuation without an obvious monetization route.
    claimRefs: [CV007, CV008, CV010, CV011, CV012, CV013, CV015, CV016]
