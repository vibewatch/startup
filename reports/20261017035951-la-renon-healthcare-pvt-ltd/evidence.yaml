evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Current audited employee count or management-certified HR headcount as of the latest fiscal close.
    whyItMatters: Headcount is a core scale and productivity anchor for later operating and valuation analysis.
    diligencePath: >-
      Request the latest audited annual report or board pack with employee census and reconcile it to public profile
      counts.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current active customer, prescriber, distributor, or institutional-account count with definition and date.
    whyItMatters: Customer density affects commercial quality, concentration risk, and revenue durability.
    diligencePath: >-
      Ask management for the KPI pack defining customer count, channel mix, and active-account thresholds used
      internally.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: >-
      Shareholders agreement, board composition memo, and reserved-matters or veto-rights schedule for current
      investors.
    whyItMatters: Late-stage investor rights can materially alter control, liquidity, and downside protection.
    diligencePath: >-
      Request the latest cap table, shareholders agreement, and board observer or nomination rights summary from counsel
      or management.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: access-blocked
    severity: minor
    topic: ipo-timing
    missingEvidence: Current, non-paywalled company or investor disclosure on financing or IPO timing.
    whyItMatters: Exit expectations influence valuation framing and should not rest on a stale 2022 preview.
    diligencePath: Obtain current management commentary, banker materials, or investor updates on financing and listing plans.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent market report or filing that isolates addressable spend for La Renon's chronic-therapy niches in
      India and export markets.
    whyItMatters: >-
      Without an external TAM/SAM/SOM anchor, valuation can overstate market headroom from company positioning and
      realized revenue alone.
    diligencePath: >-
      Request paid analyst market reports or management's segment sizing deck with third-party citations, then reconcile
      it to therapy-level revenue mix.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-payer-structure
    missingEvidence: >-
      Segment-level disclosure of who prescribes, who procures, and who ultimately pays across domestic and export
      channels.
    whyItMatters: >-
      Buyer and payer concentration drive adoption speed, pricing power, and working-capital risk, but the public pool
      does not disclose them.
    diligencePath: >-
      Obtain therapy-level channel mix, top-customer concentration, and reimbursement exposure from management and test
      it with customer interviews.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: export-productivity
    missingEvidence: Country-by-country export revenue, margin, and registration-conversion data for the 40+ country footprint.
    whyItMatters: >-
      Registrations show reach potential, but valuation needs evidence on how efficiently those approvals translate into
      durable sales.
    diligencePath: >-
      Request an export dashboard showing registrations, approvals, launches, and revenue by country and by therapy
      franchise.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: named-competitors
    missingEvidence: >-
      Direct competitor primary surfaces or independent profiles for nephrology-focused peers, diversified incumbents,
      and export registrants.
    whyItMatters: >-
      The retained pool supports competitor classes but not a clean named peer set with validated overlap, scale, and
      target segments.
    diligencePath: >-
      Collect competitor product pages, company profiles, or independent coverage for at least five named peers that
      sell into the same chronic-therapy workflows.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Molecule-level list prices, trade discounts, tender outcomes, and realized channel pricing for La Renon and direct
      alternatives.
    whyItMatters: >-
      Without price and packaging data, the chapter cannot distinguish value-led differentiation from ordinary
      branded-generic price competition.
    diligencePath: >-
      Request distributor invoices, pharmacy price checks, tender sheets, or price books across at least three
      overlapping molecules and two geographies.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: employee-scale
    missingEvidence: A reconciled current employee count across official and third-party surfaces.
    whyItMatters: >-
      Headcount is only a proxy for competitive scale, but the conflict reduces confidence in public operating-size
      comparisons.
    diligencePath: >-
      Confirm current employee count from payroll, EPFO, or management disclosure and align it against the LinkedIn
      company page.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: audited-current-financials
    missingEvidence: >-
      Audited FY24-FY26 income statement, cash flow statement, balance sheet, and management bridge from FY22/9MFY23 to
      current performance.
    whyItMatters: >-
      Public traction and valuation narratives outpace the last hard audited dataset in the assigned pool, so recent
      growth and margin claims cannot be fully underwritten.
    diligencePath: >-
      Obtain the latest audited financial statements and monthly management accounts, then reconcile them to the
      private-market revenue and EBITDA figures.
    relatedQuestionRefs:
      - QI003
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized pricing, rebates, distributor credit notes, tender pricing, and gross-to-net waterfalls by therapy and
      geography.
    whyItMatters: The public record supports SKU breadth and channel structure, but not pricing power or true margin quality.
    diligencePath: Request product-level or therapy-level pricing realization reports and sample distributor or hospital contracts.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: export-mix
    missingEvidence: Audited export revenue share by fiscal year, geography, and entity.
    whyItMatters: >-
      Export contribution is a major determinant of growth quality, FX exposure, and valuation, yet the assigned sources
      conflict sharply on the underlying percentage.
    diligencePath: >-
      Reconcile audited domestic versus export sales for FY22 through FY26 and tie them to registration and
      country-level shipment data.
    relatedQuestionRefs:
      - QI001
      - QI007
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, net debt, covenant headroom, ELPL turnaround funding plan, and explicit use of proceeds from
      recent ownership transactions.
    whyItMatters: >-
      Secondary-share deals do not automatically provide operating cash, so liquidity resilience cannot be inferred from
      headline valuation alone.
    diligencePath: Obtain the latest treasury schedule, debt covenant package, and board-approved capex plus subsidiary-funding plan.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      CAC, payback period, MR productivity trend after the 9MFY23 field-force expansion, and cohort conversion by
      therapy.
    whyItMatters: >-
      Without these metrics, the public record cannot distinguish durable GTM efficiency from volume gained through
      higher selling intensity.
    diligencePath: >-
      Request therapy-level sales productivity dashboards and monthly MR productivity trends for the last eight
      quarters.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: technical-documentation-gap
    missingEvidence: Product-level dossiers, validation data, release history, and quality metrics by major formulation or brand.
    whyItMatters: >-
      Without SKU-level proof, investors cannot separate a broad catalog from defensible high-franchise products or
      judge whether R&D and manufacturing scale is translating into reliable launches.
    diligencePath: >-
      Request the top-20 SKU list, product registration dossiers, internal launch calendar, deviation trends, and
      plant-level quality KPI packs from management.
    relatedQuestionRefs:
      - QE002
      - QE003
  - type: private-evidence-only
    severity: material
    topic: quality-systems
    missingEvidence: >-
      Plant-level audit outcomes, batch-failure rates, complaint rates, CAPA metrics, and post-market surveillance
      reporting.
    whyItMatters: >-
      Public approvals and expansion announcements do not prove that quality systems are keeping pace with portfolio
      breadth and manufacturing complexity.
    diligencePath: >-
      Obtain recent GMP audit findings, CAPA summaries, recall logs, and pharmacovigilance dashboards for domestic and
      export markets.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: adverse-proof-gap
    missingEvidence: >-
      Independent or regulatory evidence on recalls, warning letters, product-quality incidents, or significant
      complaints tied to La Renon's portfolio.
    whyItMatters: >-
      Product-tech underwriting is incomplete without knowing whether the visible scale and filings are accompanied by
      hidden quality or compliance failures.
    diligencePath: >-
      Expand diligence into regulator databases, pharmacovigilance records, and specialized pharma trade coverage beyond
      the assigned evidence pool.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: durability-metrics-gap
    missingEvidence: >-
      Customer count, NRR, GRR, churn, renewal rates, contract duration, and customer satisfaction disclosures by
      therapy or geography.
    whyItMatters: >-
      Without durability metrics, the chapter can support commercial reach but not revenue persistence or cohort
      quality.
    diligencePath: >-
      Request cohort and renewal data from management, including therapy-level and export-vs-domestic retention
      breakdowns.
    relatedQuestionRefs:
      - QU005
      - QU008
  - type: enumeration-incomplete
