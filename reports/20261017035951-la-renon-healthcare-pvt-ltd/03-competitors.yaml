        - Specific competitor breadth is not directly evidenced in the assigned pool
        - Supported for La Renon; unknown for named peers
        - Breadth is a real company strength, but not a benchmarked market lead
      - - Nephrology depth
        - Nephrology was the entry wedge and is still framed as a leadership area
        - Direct nephrology specialist alternatives are implied, but not named with primary sources here
        - Supported for La Renon; partial for competitor set
        - Specialty credibility is likely the cleanest direct overlap axis
      - - Export / registration reach
        - More than 40 countries, 269 registrations, and 90 applications under evaluation
        - Competitor registration depth is not directly surfaced in retained sources
        - Supported for La Renon; unknown for named peers
        - Export filings and approvals raise replication cost
      - - Manufacturing and API control
        - Two manufacturing units, two API units, one USFDA-approved API unit, and in-house R&D
        - No equivalent competitor asset maps are retained in this pool
        - Supported for La Renon; unknown for named peers
        - Vertical control is visible and potentially differentiating
      - - Public pricing transparency
        - Brand names are visible, but retained fetched text does not surface actual list prices
        - No direct competitor price sheet is retained
        - Weak for both sides in the assigned pool
        - Pricing competition likely matters, but public comparison is not yet investable
    notes: Unsupported competitor cells are intentionally marked unknown or partial because the assigned pool contains no competitor primary surfaces or tender catalogs; this table compares what is actually evidenced, not what could be guessed.
