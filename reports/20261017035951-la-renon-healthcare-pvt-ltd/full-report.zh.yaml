  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - FY24 收入和 EBITDA 证明具备可重复性，出口 / 全球注册转化为额外增长，且 IPO 准备工作变得清晰可见。
        - 只有在新的经审计盈利和流动性准备工作确认估值重估合理的情况下，才应维持或超过约 Rs 11,000 crore 的私募市场估值。
        - 新市场执行、披露拖延以及私募市场倍数压缩。
        - 需要经审计的 FY24 之后增长数据，以及正式退出准备。
      - - 基准
        - 公司仍是强劲的慢性治疗复合增长者，但关于权利、杠杆和最新经审计盈利的公开尽调仍不完整。
        - 按当前价格观察；要形成有吸引力的入场点，需要相对最新可见估值打折，或获得明显更好的证据。
        - 在权利和盈利质量得到验证前，就先为增长付费。
        - 与今天的证据集合最一致。
      - - 悲观
        - IPO 时点延后、披露持续薄弱，或盈利跟不上估值重估。
        - 下行可能回到 2024-2023 区间附近较早的公开交易锚点，而不是 2025 年的高点。
        - 老股流动性枯竭、杠杆影响加大，或投资者保护条款偏向现有持有人。
        - 如果尽调无法补齐当前证据缺口，这一情景最可能发生。
    notes: 这些区间只反映方向，因为该来源池有交易锚点，却没有足够的最新经审计细节来建立精确的 DCF 或交易倍数模型。
