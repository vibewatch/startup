    columns:
      - 方向
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 聚焦慢性治疗、且在肾脏科领域占据领导地位，支撑持久的细分需求。
        - 公司来源描述了慢性治疗业务的广度和肾脏科领导地位；Preqin 的预览资料还称其拥有覆盖全国的品牌仿制药分销网络。
        - 若第三方市场份额或渠道数据能够独立确认其领导地位，信心会增强。
      - - 投资逻辑
        - 机构投资者多次愿意以溢价买入少数股权。
        - Medical Dialogues 报道了 2024 年 ChrysCapital 交易；MedicinMan 和 Preqin 指向更高的 2025 年估值以及更广泛的投资者联盟。
        - 若新一轮以高于 2025 年水平的价格、按新股条款完成，将进一步强化乐观情景。
      - - 反向逻辑
        - 估值跃升跑在公开运营披露质量之前。
        - 公开证据仍依赖 FY24 收入 / EBITDA 的片段信息，以及聚合平台的区间数据，而不是最新的经审计财务报表。
        - 若经审计的 FY25/FY26 报表显示利润率持续扩张，这一担忧会减轻。
      - - 反向逻辑
        - 退出时点和披露准备度仍未经证明。
        - 这一来源池中唯一明确的 IPO 时间信息来自 2022 年 VCCircle 预览资料，且不同来源的公开员工数相互冲突。
        - 官方 IPO 准备、权利披露和经过核对的运营数据将改变判断。
    notes: 这些论点都有证据支撑，但在公开记录不完整处刻意保持保守。
