chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              研究过的来源一致将 La Renon 定位在 Ahmedabad，并将其注册时间定为 2007 年；官方材料补充称，公司于 2008 年开始运营，最初聚焦慢性肾病患者的肾脏科治疗。官网和 Preqin
              共同将其描述为一家慢性治疗品牌制剂公司，覆盖肾脏科、重症监护、中枢神经系统、胃肠科、泌尿科、心脏代谢、呼吸科和妇科。就尽调而言，公司应被视为专科品牌仿制药平台，而非单一产品资产：当前身份较为稳定，但若干商业规模指标仍须保留限定，不能当作经审计事实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO008
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.2'
        title: 领导层与治理表面
        blocks:
          - type: paragraph
            body: >-
              领导层证据分散在公司简介和注册信息聚合网站之间。创始人仍是核心人物：官方材料确认 Pankaj Singh
              为创始人，注册信息页面仍显示其担任董事总经理。在他之下，公开领导层更像一支长期运营团队，而不是完全透明的私营公司董事会体系；Vivek Gupta 负责肾脏科业务，Yashwant Singh
              则与数项国内治疗业务相关。注册数据还显示，随着时间推移，董事会增加了其他代名董事及看似独立的董事席位，表明机构监督正在加强；但公司没有公布股东权利安排或完整治理文件，因而无法判断控制权保护。
            claimRefs:
              - CO002
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO008
      - number: '1.3'
        title: 资本、股权与规模指标
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最近最有力的外部融资数据点来自 Preqin 2025 年 9 月的资料：由 White Oak、Siguler Guff、Creador 和 Avendus 牵头的财团以 INR 110
              billion 估值收购 La Renon 约 10% 股权。Medical Dialogues 提供了更早的指标：ChrysCapital 于 2024 年 4 月以 $800 million 估值购买约 8%
              老股，交易后股权快照显示创始人家族仍持有接近
              80%。这些交易确认了投资者兴趣，也说明公司已是后期私营资产；但证据集没有披露累计融资额、当前股权结构表及其中的权利，或两笔交易完成后的经核对当前股权台账。CompanyCheck 和 Tofler
              补充了实收资本、未结押记等接近资产负债表的信息，这对尽调有用，但不能替代经审计报表。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO011
              - CO015
      - number: '1.4'
        title: 里程碑与未解决的公开缺口
        blocks:
          - type: paragraph
            body: >-
              当前来源池中的时间线足以勾勒出连贯的公司轨迹：2007 年成立、2008 年开始运营、截至 2020 年 4 月已出现可见的市场规模里程碑、2024 年和 2025 年融资及治理变化，以及管理层称已覆盖超过 40
              个国家的当前出口版图。真正明显不完整的不是公司身份，而是披露质量。来源池中唯一关于 IPO 时间的资料是 VCCircle 2022 年 8
              月的预览；由于公开代理数据存在重大分歧，当前确切员工数仍无法得到支持。研究过的公开来源也没有披露客户数。这些缺口很重要，因为后续章节需要据此判断经营杠杆、商业密度和退出准备度。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
