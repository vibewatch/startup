        blocks:
          - type: paragraph
            body: >-
              近期交易显示，股权结构表仍在变化，而不是一个稳定的创始人持有的私营公司。Medical Dialogues 报道了 2024 年 ChrysCapital 的老股交易，Preqin 则记录了由 White
              Oak、Siguler Guff、Creador 和 Avendus PE Investment Advisors 牵头的财团在 2025 年 9 月以 INR 110 billion
              估值进行的另一笔少数股权投资。注册数据如今显示两名代名董事，公司 LinkedIn
              动态也提到印度竞争委员会批准一笔股权交易；但公开材料仍没有披露保留事项、流动性预期或这些投资者进入股权结构表所附带的经济条款。同时，国际扩张似乎依赖分销商、当地商业团队和注册维护，而不是一个完全披露的自有网络。这种组合形成了可信的终止标准：押记增加但现金透明度没有改善、审批停滞，或在治理披露改善前出现由发起方主导的退出压力。
            claimRefs:
              - CR004
