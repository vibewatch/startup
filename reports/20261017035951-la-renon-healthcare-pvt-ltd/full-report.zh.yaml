      - number: '4.2'
        title: 效率、利润率与现金转化
        blocks:
          - type: paragraph
            body: >-
              指定来源池中最强的经审计经济数据来自 CARE 的 FY22 和 9MFY23 发布文件。文件显示 PBILDT 和 PAT 利润率健康，但经销商信用和库存支撑增长也使业务消耗营运资金。CARE
              明确表示，公司采用超级分销商模式，向经销商提供更高信用额度，并向客户收回票据贴现费用。这解释了为什么总现金应计额明显高于经营现金流。GTM 动作看起来更依赖销售队伍，而不是数字化自助服务：CARE 提到覆盖超过
              16,000 名医生和规模庞大的 MR 团队，公司也强调面向客户的营销团队。这种模式可能适合印度慢性治疗市场；但没有 CAC、回本周期、按治疗领域拆分的毛利率或 MR
              扩张后的生产率趋势，公开记录无法证明近期规模来自持久的单位经济性，还是来自暂时加重的线下投入。
            claimRefs:
              - CI001
