  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据指向一种由地推团队驱动的品牌仿制药模式，但收入增长仍需跨过营运资金和子公司融资约束。
    data:
      nodes:
        - label: 产品组合广度
          displayValue: 357 formulations in FY22
          detail: 历史 CARE 产品组合基础，加上当前官方 SKU 覆盖片剂、胶囊、输液和注射剂。
        - label: 需求生成
          displayValue: More than 16,000 doctors covered
          detail: 专科营销团队和庞大的 MR 团队在慢性治疗领域拉动处方需求。
        - label: 渠道结构
          displayValue: Super-distributor plus export registrations
          detail: 国内回款依赖经销商赊销；出口扩张依赖注册和审批。
        - label: 已披露的经审计收入
          displayValue: FY22 TOI Rs 835.86 crore
          detail: 本来源池中可信度最高的公开收入基础。
        - label: 私募市场增长叙事
          displayValue: FY25 revenue Rs 1,685-1,700 crore
          detail: 老股交易来源暗示规模快速扩大，但尚未提供经审计的当前期间验证。
        - label: 现金留存和再投资
          displayValue: FY22 CFO Rs 52.85 crore versus GCA Rs 137.53 crore
          detail: 收入入账后，营运资金、资本开支和对子公司的支持会占用流动性。
      edges:
        - from: Portfolio breadth
          to: Demand generation
          label: 通过治疗领域覆盖推广
        - from: Demand generation
          to: Channel structure
          label: 医生拉动转化为分销商订单
        - from: Channel structure
          to: Reported audited revenue
          label: 只有渠道执行并完成回款后才确认销售
        - from: Reported audited revenue
          to: Private-market growth narrative
          label: 后续交易根据更新期间外推规模
        - from: Private-market growth narrative
          to: Cash retention and reinvestment
          label: 估值取决于能否把增长转化为现金
