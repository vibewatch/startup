      - number: '8.3'
        title: 最终尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              尽调重点是公开来源仍无法清晰解决的事项。LinkedIn 仍显示 501–1,000 名员工，而 TheCompanyCheck 报告截至 2025 年 2 月有 2,727
              名员工，这提醒我们公开披露并不同步。TheCompanyCheck 还显示 Rs 85.65 crore 未结押记及 2024
              年一项代名董事任命；这两个信号都表明融资结构和治理应直接审查，而非推断。VCCircle 对 2022 年 IPO 计划的公开预览过于陈旧，无法用于判断 2026
              年退出路径。论点破坏触发器很直接：经审计盈利无法支撑最新估值、投资者权利条款使新资金处于次要地位，或 IPO／流动性路径延迟，使 2025 年估值缺乏明显的变现路线。
