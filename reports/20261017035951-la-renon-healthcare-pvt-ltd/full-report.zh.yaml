  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个拥有可观慢性治疗规模的优质业务，但不足以在最新可见私募市场估值上干净地买入。Medical Dialogues 报告 FY24 收入为 Rs 1,400 crore、EBITDA 为 Rs 300
              crore，MedicinMan 则报告后续一笔 7% 交易的估值接近 Rs 11,000
              crore。估值上升说明投资者有需求，但公开证据集仍由摘要、公司页面和数据聚合商构成，而不是近期经审计资料包。因此，入场纪律比公司的质量叙事更重要：如果没有更清晰的盈利持久性、杠杆、投资者权利和退出时点证据，审慎做法是继续观察，只有在尽调填补缺口或价格重新调整时才参与。
