  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这一建议沿着运营证明和投资者需求，走向披露摩擦和价格纪律。
    data:
      nodes:
        - id: scale-proof
          label: 规模证明
          note: Medical Dialogues 引用 FY24 收入 Rs 1,400 crore、EBITDA Rs 300 crore。
        - id: market-position
          label: 细分定位
          note: 公司页面描述了慢性治疗业务广度、肾脏科领导地位和覆盖 40+ 个国家。
        - id: private-demand
          label: 私募市场需求
          note: 公开老股交易估值从 2024 年约 Rs 6,500 crore 上升至 2025 年接近 Rs 11,000 crore。
        - id: disclosure-friction
          label: 披露摩擦
          note: FY24 之后经审计的运营证明、权利条款和同步的员工规模披露仍然缺失。
        - id: scenario-skew
          label: 情景偏斜
          note: 上行需要新的证明；若流动性或执行下滑，下行可以依靠较早的交易锚点。
        - id: recommendation
          label: 建议：观察
          note: 保持跟进，但在尽调补齐影响估值的关键缺口前，坚持价格纪律。
      edges:
        - from: scale-proof
          to: market-position
          label: 支持
        - from: market-position
          to: private-demand
          label: 帮助吸引
        - from: private-demand
          to: disclosure-friction
          label: 受到……约束
        - from: disclosure-friction
          to: scenario-skew
          label: 造成
        - from: scenario-skew
          to: recommendation
          label: 驱动
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV014
      - CV015
      - CV016
