  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，公司先从国内专科切入点出发，通过地推覆盖扩张，再进入依靠出口注册和部委审批的海外市场。
    data:
      nodes:
        - label: 肾脏科切入点
          detail: 公司称，La Renon 通过肾脏科和 CKD 聚焦的慢性护理应用场景进入市场。
          touchpoints:
            - Early-stage CKD treatment focus
            - Specialty prescribers and chronic patients
        - label: 面向客户的营销团队
          detail: 官方文案描述了一种专科营销架构，以面向客户的团队和广泛产品组合为组织基础。
          touchpoints:
            - Segment-specific field coverage
            - Portfolio-led physician engagement
        - label: 国内多治疗领域扩张
          detail: 产品组合从肾脏科扩展到 CNS、重症监护、消化科、呼吸科、心血管代谢和其他相关专科。
          touchpoints:
            - Cross-therapy expansion inside chronic care
            - Nationwide domestic footprint proxy
        - label: 收入规模显现
          detail: 独立报道指向 FY24 收入规模和可观的出口贡献。
          touchpoints:
            - INR 1,400 crore FY24 revenue
            - Exports at 40-45% of net sales
        - label: 出口注册和申请
          detail: 官方全球业务证明强调注册和待审申请，而不是具名客户账户。
          touchpoints:
            - 40+ countries
            - 269 registrations
            - 90 applications under evaluation
        - label: 具名客户证明之前的部委审批
          detail: 公开出口证明在市场准入阶段最强；持续采购的具名买家仍未披露。
          touchpoints:
            - Kenya, Uganda, Tanzania, Cambodia, Nepal, Ethiopia and others
            - Named approvals
            - Customer concentration still undisclosed
