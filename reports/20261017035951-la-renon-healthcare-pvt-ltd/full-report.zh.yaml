  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开增长
        blocks:
          - type: paragraph
            body: >-
              对 La Renon 变现模式最稳妥的判断，是一个慢性治疗品牌仿制药产品组合，而非合同制造商、平台或订阅业务。CARE 记录截至 2022 年 3 月有 357 个制剂；公司当前产品 PDF
              仍列出心脏科、肾脏科、重症监护、胃肠科和神经科产品线中的片剂、胶囊、输液及注射剂 SKU。这支持按 SKU
              销售产品的模式，但不能形成清晰的实际定价模型：指定的官方目录展示分子和规格，没有包装价格、返利或从总额到净额的条款。公开增长也有两层：更可靠的 FY22／9MFY23 信贷评级数据，以及指向 FY24–FY25
              收入增长和更高估值的更新私募市场交易数据。业务看起来已经具备规模，但公开披露仍不足以让投资者按治疗领域、地域和渠道验证收入质量。
