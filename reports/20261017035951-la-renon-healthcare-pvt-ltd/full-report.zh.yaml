      - number: '8.2'
        title: 情景框架与估值敏感性
        blocks:
          - type: paragraph
            body: >-
              上行情景建立在 La Renon 将细分慢性治疗定位转化为持续盈利增长之上，只有这样才能支撑 2025 年估值。官方页面仍描述其肾脏科领先地位、出口覆盖和超过 40 个国家的版图；2024 年和 2025
              年的老股交易也显示机构投资者持续感兴趣。问题在于，公开估值背景跑在公开披露之前：一个数据服务显示收入区间为 Rs 1,250-1,500 crore，Medical Dialogues 引用 Rs 1,400
              crore 收入和 Rs 300 crore EBITDA，而来源池中没有公开经审计的 FY25 或 FY26
              资料包证明更高估值已经兑现。因此，当前设置是不对称的：上行需要新的证明，而如果执行或流动性滑坡，下行可能回到更早的交易锚点。
