            title: 首要投资判断风险是披露速度落后于运营范围
            body: 公开来源显示，公司规模和国际化程度都超过典型的私营仿制药企业，但披露质量仍更接近私营、创始人主导的资产。这种错配提高了回款、契约或合规方面出现意外的概率。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR016
          - type: callout
            title: 为增长付费前的终止标准
            body: 如果尽调无法核对未结押记、营运资金质量、投资者权利和各国审批维护，就应停止推进。当前公开记录足以支持尽调，但不足以让投资者凭假设完成这些事项的投资判断。
            calloutType: recommendation
