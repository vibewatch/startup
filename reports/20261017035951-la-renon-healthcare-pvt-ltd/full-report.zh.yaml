      - CI004
      - CI007
      - CI008
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，公司形成了从治疗领域聚焦，到研发、生产、监管申报和出口分销的分层制药运营体系。
    data:
      layers:
        - label: 治疗领域聚焦
          detail: 慢性治疗特许经营业务构成对外呈现的产品版图。
          modules:
            - 肾脏科 / CKD
            - 重症监护
            - CNS / 神经科
            - 泌尿科 / 消化科 / 心血管代谢
        - label: 产品组合基础
          detail: 公开报告将产品描述为广泛的品牌仿制药目录。
          modules:
            - 约 340 种配方
            - 以品牌仿制药慢性治疗为导向
        - label: 开发引擎
          detail: 内部研发是产品开发的核心层。
          modules:
            - 内部研发中心
            - 配方和工艺开发
        - label: 制造和专用资产
          detail: 专业化子公司和工厂把配方转化为可销售产品。
          modules:
            - Stanford Labs 配方
            - Enaltec Labs API 研究
            - Rusoma 小容量注射剂
            - 2024 年披露的两座生产基地 / 两座 API 工厂
        - label: 监管层
          detail: 注册和审批支持逐个市场推出产品。
          modules:
            - 269 项注册
            - 90 项申请正在评估
            - 非洲和亚洲多个国家的指定部委 / 监管机构审批
        - label: 规模扩张和分销
          detail: 出口覆盖和产能扩张构成规模扩张层。
          modules:
            - 覆盖 40+ 个国家
            - Rajasthan 固体口服制剂扩产目标为每月 400 million tablets or capsules
    approximationNotes: 产品分层和数量来自混合的官方及第三方来源，描述的是公开运营体系，而不是各项资产经审计的产量。
