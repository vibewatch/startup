      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开视角下看起来更持久的部分
            body: 可见护城河来自执行：肾脏科专科覆盖、面向客户的营销团队、出口注册，以及制造和 API 基础设施。
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP013
          - type: callout
            title: 仍显得商品化的部分
            body: 公开证据指向成熟仿制分子，而公开价格可见度较弱；如果没有竞争者报价和渠道数据，很难证明实际差异化。
            calloutType: risk
            claimRefs:
