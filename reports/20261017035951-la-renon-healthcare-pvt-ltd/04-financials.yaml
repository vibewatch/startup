  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-current-financials
      missingEvidence: Audited FY24-FY26 income statement, cash flow statement, balance sheet, and management bridge from FY22/9MFY23 to current performance.
      whyItMatters: Public traction and valuation narratives outpace the last hard audited dataset in the assigned pool, so recent growth and margin claims cannot be fully underwritten.
      diligencePath: Obtain the latest audited financial statements and monthly management accounts, then reconcile them to the private-market revenue and EBITDA figures.
      relatedQuestionRefs: [QI003, QI007, QI008]
    - type: private-evidence-only
      severity: material
      topic: pricing-realization
      missingEvidence: Realized pricing, rebates, distributor credit notes, tender pricing, and gross-to-net waterfalls by therapy and geography.
      whyItMatters: The public record supports SKU breadth and channel structure, but not pricing power or true margin quality.
      diligencePath: Request product-level or therapy-level pricing realization reports and sample distributor or hospital contracts.
      relatedQuestionRefs: [QI002, QI008]
      relatedTableRefs: [TI002]
    - type: conflicting-data
      severity: material
      topic: export-mix
      missingEvidence: Audited export revenue share by fiscal year, geography, and entity.
      whyItMatters: Export contribution is a major determinant of growth quality, FX exposure, and valuation, yet the assigned sources conflict sharply on the underlying percentage.
      diligencePath: Reconcile audited domestic versus export sales for FY22 through FY26 and tie them to registration and country-level shipment data.
      relatedQuestionRefs: [QI001, QI007, QI008]
      relatedTableRefs: [TI001]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current cash balance, net debt, covenant headroom, ELPL turnaround funding plan, and explicit use of proceeds from recent ownership transactions.
      whyItMatters: Secondary-share deals do not automatically provide operating cash, so liquidity resilience cannot be inferred from headline valuation alone.
      diligencePath: Obtain the latest treasury schedule, debt covenant package, and board-approved capex plus subsidiary-funding plan.
      relatedQuestionRefs: [QI006, QI008]
