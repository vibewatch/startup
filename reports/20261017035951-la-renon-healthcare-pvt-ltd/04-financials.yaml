      - ["Export formulations", "Sales into registered overseas markets", "Per registered SKU / market", "Officially 40+ countries and 269 registrations but export share is publicly inconsistent", "Quality reduced by unresolved 4-5 percent versus 40-45 percent export-mix conflict", "Reconcile audited export revenue by geography and fiscal year"]
      - ["Injectables and hospital products", "Own brands with some historical loan-license or contract-manufactured supply", "Per vial / ampoule / infusion unit", "Existing category with planned deeper manufacturing footprint via RHPL", "Commercial relevance is visible but plant economics are not public", "Provide plant-wise gross margin, utilization, and transfer-pricing policy"]
      - ["Adjacencies and subsidiaries", "Nutraceutical or adjacent product sales through subsidiaries such as Frimline and other units", "Per SKU", "Present but not disclosed as a separate revenue line in the assigned pool", "Secondary to core chronic formulations and not model-ready", "Disclose revenue and EBITDA share by subsidiary and adjacency"]
    notes: Revenue status combines audited FY22/9MFY23 credit data with newer secondary-market disclosures; export share and subsidiary contribution are not yet reconciled.
    claimRefs: [CI003, CI007, CI009, CI010, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / channel
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
      - Implication
    rows:
      - ["Chronic oral formulations", "Public pack price not disclosed", "Official catalog shows molecule and dosage form but not realized pricing", "Rebates, trade schemes, and gross-to-net are undisclosed", "Official product PDF", "Public evidence supports SKU breadth not pricing power"]
      - ["Injectables and renal/critical-care SKUs", "Public pack price not disclosed", "Company shows multiple injectable strengths but not contract economics", "Hospital/tender mix and cold-chain cost recovery are unknown", "Official product PDF plus CARE product commentary", "Margin modeling remains incomplete"]
      - ["Export markets", "Registration-led access rather than disclosed tender pricing", "Official global page emphasizes registrations and approvals instead of contract values", "Geography mix, distributor margin, and FX exposure are undisclosed", "Global page plus private-market articles", "Export growth may be real but revenue quality is hard to verify"]
      - ["Domestic super-distributor channel", "Commercial terms include higher dealer credit and recovered bill-discounting charges", "Realized pricing is affected by collections and channel support rather than list price alone", "Credit notes, payment terms, and returns are undisclosed", "CARE Ratings", "Cash conversion matters as much as nominal selling price"]
    notes: The assigned pool shows units and channel structure, but not list prices, gross-to-net waterfalls, or realized discounting by therapy.
    claimRefs: [CI004, CI009, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["PBILDT margin", "20.66 percent in FY22 with CARE expecting 20-23 percent steady-state", "Medium", "Best public proxy for gross-profit resilience in the branded-generic model", "Provide gross margin and contribution margin by therapy and plant"]
      - ["Working-capital cycle", "134 days in FY22", "Medium", "Long cash conversion can force financing despite accounting profit", "Provide monthly receivables aging and inventory turns by channel"]
      - ["Cash conversion", "FY22 CFO Rs 52.85 crore versus GCA Rs 137.53 crore", "Medium", "Tests whether growth produces free cash for capex and subsidiary support", "Provide FY23-FY26 operating cash flow and free cash flow bridge"]
      - ["Sales efficiency / payback", null, "Low", "MR expansion is visible but CAC and payback are not", "Provide CAC, payback, MR productivity, and doctor coverage conversion by therapy"]
    notes: Null means the assigned public pool did not disclose a reliable metric; the table separates audited proxies from private-data asks rather than forcing SaaS-style unit economics.
    claimRefs: [CI002, CI004, CI008]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence suggests a field-force-led branded-formulation model whose revenue growth still has to clear working-capital and subsidiary-funding constraints.
    data:
      nodes:
        - label: Portfolio breadth
          displayValue: 357 formulations in FY22
          detail: Historical CARE portfolio base with current official SKU breadth across tablets, capsules, infusions, and injectables.
        - label: Demand generation
          displayValue: More than 16,000 doctors covered
          detail: Specialty marketing teams and a large MR base drive prescription demand in chronic therapies.
        - label: Channel structure
          displayValue: Super-distributor plus export registrations
          detail: Domestic collections rely on dealer credit while export expansion relies on registrations and approvals.
        - label: Reported audited revenue
          displayValue: FY22 TOI Rs 835.86 crore
          detail: Highest-confidence public revenue base in the assigned pool.
        - label: Private-market growth narrative
          displayValue: FY25 revenue Rs 1,685-1,700 crore
          detail: Secondary-market sources imply strong scale-up but not audited current-period verification.
        - label: Cash retention and reinvestment
          displayValue: FY22 CFO Rs 52.85 crore versus GCA Rs 137.53 crore
          detail: Working capital, capex, and subsidiary support absorb liquidity after revenue is booked.
      edges:
        - from: Portfolio breadth
          to: Demand generation
          label: promoted through therapy-specific coverage
        - from: Demand generation
          to: Channel structure
          label: doctor pull becomes distributor orders
        - from: Channel structure
          to: Reported audited revenue
          label: sales recognized only after channel execution and collections
        - from: Reported audited revenue
          to: Private-market growth narrative
          label: later transactions extrapolate scale from newer periods
        - from: Private-market growth narrative
          to: Cash retention and reinvestment
          label: valuation depends on converting growth into cash
    claimRefs: [CI004, CI007, CI008, CI012, CI013]
callouts:
  - calloutType: risk
    title: Working capital, not accounting profit, is the core financial risk
    body: CARE's audited numbers show healthy margins, but the company still carried a 134-day working-capital cycle and generated much less operating cash flow than gross cash accruals.
    claimRefs: [CI002, CI004]
  - calloutType: insight
    title: Recent valuation marks rely on a disclosure layer that is newer but softer
    body: The 2024-2025 revenue and valuation datapoints are directionally useful, yet they sit on secondary-market and media-style sources rather than current filed statements, so they should frame diligence questions more than close them.
    claimRefs: [CI012, CI013, CI015, CI016]
