company:
  name: La Renon Healthcare Pvt. Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    La Renon remains an unlisted Ahmedabad-based private pharmaceutical company
    built around chronic-therapy branded formulations, with current public
    evidence pointing to a September 2025 minority financing at an INR 110
    billion valuation after an April 2024 secondary deal at an $800 million
    valuation. The same source set also leaves important diligence gaps:
    customer count is undisclosed, current headcount proxies conflict, and
    updated governance and IPO-timing disclosures are still thin.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      The reviewed source set consistently places La Renon in Ahmedabad and
      dates its incorporation to 2007, while official materials add that the
      business started operations in 2008 and began by focusing on nephrology
      for chronic kidney disease patients. The official site and Preqin together
      describe a chronic-therapy branded-formulations company spanning
      nephrology, critical care, CNS, gastroenterology, urology,
      cardio-metabolic, respiratory, and gynaecology. For diligence purposes,
      that means the company should be treated as a specialty branded-generic
      platform rather than a single-product asset: the current identity is
      stable, but several commercial scale metrics still have to remain
      qualified rather than treated as audited fact.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance surface
    body: >-
      Leadership evidence is split between company biographies and registry
      aggregators. The founder remains the central figure: official materials
      identify Pankaj Singh as founder, and registry pages still show him as
      managing director. Beneath him, the public leadership surface points to a
      long-tenured operating bench rather than a fully transparent private-board
      package, with Vivek Gupta tied to the nephrology franchise and Yashwant
      Singh tied to several domestic therapy businesses. Registry data also show
      additional nominee and independent-looking board seats added over time,
      which suggests institutional oversight is increasing, but the company does
      not publish the shareholder-rights package or full governance documents
      needed to judge control protections.
    claimRefs: [CO002, CO005, CO006]
    tableRefs: [TO002]
  - id: capital-ownership-and-scale
    title: Capital, ownership, and scale markers
    body: >-
      The strongest recent external financing datapoint in the assigned pool is
      Preqin's September 2025 profile, which says a consortium led by White Oak,
      Siguler Guff, Creador, and Avendus acquired about 10% of La Renon at an
      INR 110 billion valuation. Medical Dialogues provides an earlier marker:
      ChrysCapital's April 2024 secondary purchase of roughly 8% at an $800
      million valuation, alongside a post-transaction ownership snapshot that
      still left the promoter family near 80%. Those transactions confirm
      investor interest and mark the company as a late-stage private asset, but
      the evidence set does not disclose cumulative capital raised, current cap
      table rights, or a reconciled current ownership ledger after both deals.
      CompanyCheck and Tofler add balance-sheet-adjacent context, including
      paid-up capital and open charges, which is useful for diligence but not a
      substitute for audited statements.
    claimRefs: [CO007, CO008, CO009, CO015]
    tableRefs: [TO003]
  - id: milestones-and-open-gaps
    title: Milestones and unresolved public gaps
    body: >-
      The timeline in the current pool is enough to establish a coherent company
      arc: formation in 2007, operating launch in 2008, a visible market-scale
      milestone by April 2020, financing and governance changes through 2024 and
      2025, and a current export footprint that management says exceeds 40
      countries. What remains notably incomplete is not identity but disclosure
      quality. The only IPO-timing datapoint in this pool is an August 2022
      VCCircle preview, while the exact current headcount still cannot be
      supported because public proxies disagree materially. Customer count is
      also still absent from the reviewed public set. Those gaps are material
      because later chapters will need them to judge operating leverage,
      commercial density, and exit readiness.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
