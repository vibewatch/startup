              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              The main product-tech risk is not lack of apparent scale; it is the mismatch between broad company claims
              and thin public operating proof at the product level. The assigned evidence pool does not provide detailed
              product dossiers, release histories, validation data, or reliability metrics that would let an investor
              distinguish high-franchise molecules from long-tail catalog volume. It also does not establish whether the
              company has recent recalls, warning letters, pharmacovigilance incidents, or other adverse quality events,
              even though that evidence is essential for judging whether rapid portfolio and capacity expansion is being
              matched by quality-system maturity. In practice, the chapter supports a view that La Renon has real
              manufacturing and regulatory infrastructure, but key trust, safety, and performance questions still
              require off-web diligence rather than additional prose confidence.
            claimRefs:
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product breadth appears real
            body: >-
              Independent and company-controlled sources line up on a chronic-therapy formulations platform with
              multiple therapy franchises, internal R&D, manufacturing assets, and cross-border registrations rather
              than a single-promoted product story.
            calloutType: strength
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE008
              - CE009
          - type: callout
            title: Public technical proof is still shallow
            body: >-
              The public record is rich on therapy areas, facilities, and expansion intent, but poor on SKU-level
              technical documentation, quality-system evidence, and adverse-product history, so core product reliability
              still depends on private diligence.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix and route to market
        blocks:
          - type: paragraph
            body: >-
              The retained public record points to a customer base defined first by chronic-therapy specialty coverage
              rather than by disclosed named accounts. Company-controlled surfaces and third-party summaries
              consistently place La Renon in nephrology, critical care, CNS, urology, gastroenterology, respiratory,
              cardio-metabolic, and related chronic-care categories, which implies specialist prescribers and patients
              are the primary end users even though payer mix is not broken out. The company also says it uses
              customer-dedicated marketing teams and comprehensive product portfolios in India, suggesting a segmented
              field-force model instead of a broad undifferentiated route to market. Independent and official sources
              align on a nationwide domestic footprint, but they do not identify the specific hospital chains, pharmacy
              groups, distributors, or government buyers that generate the demand. That makes the segment picture
              directionally clear while leaving buyer concentration and renewal quality unverified.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU009
