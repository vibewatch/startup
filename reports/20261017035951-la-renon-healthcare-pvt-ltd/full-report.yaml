  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory breadth is real, but the adverse legal record is still only partially visible
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a genuine multi-jurisdiction operating footprint rather than a purely domestic
              formulations story: La Renon says it has more than 40-country reach, 269 registrations, 90 applications
              under evaluation, and ministry approvals across ten export markets. The same careers page shows active
              hiring for a patent and IPR function handling prior-art searches, infringement analysis, annuities, and
              foreign counsel coordination, which is a credible mitigation signal. What is missing is equally important:
              the assigned pool does not include a regulator, court, recall, or product-liability record that would let
              an investor verify whether the legal history is clean or simply undisclosed. The legal underwrite
              therefore hinges on confirming renewal discipline, freedom-to-operate hygiene, and any hidden enforcement
              or dispute history before paying a growth multiple.
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
