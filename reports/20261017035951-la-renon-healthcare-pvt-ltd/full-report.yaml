      - number: '8.2'
        title: Scenario framework and valuation sensitivity
        blocks:
          - type: paragraph
            body: >-
              The upside case rests on La Renon converting niche chronic-therapy positioning into sustained earnings
              growth that can justify the 2025 mark. Official pages still describe nephrology leadership, export reach,
              and a 40-plus-country footprint, while the 2024 and 2025 secondary transactions show repeated
              institutional appetite. The problem is that public valuation context outruns public disclosure: one data
              service shows a Rs 1,250-1,500 crore revenue band, Medical Dialogues cites Rs 1,400 crore revenue and Rs
              300 crore EBITDA, and there is no public audited FY25 or FY26 package in this pool to prove that the
              higher mark is already earned. That makes the current setup asymmetrical: upside needs fresh proof, while
              downside can revert toward earlier transaction anchors if execution or liquidity slips.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
