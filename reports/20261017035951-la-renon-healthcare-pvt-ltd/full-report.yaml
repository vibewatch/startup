              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most important diligence work is around what public sources do not settle cleanly. LinkedIn still
              shows a 501-1,000 employee band, while TheCompanyCheck reports 2,727 employees as of February 2025, a
              useful reminder that public disclosures are not synchronized. TheCompanyCheck also shows Rs 85.65 crore of
              open charges and a nominee director appointment in 2024, both signals that financing structure and
              governance deserve direct review rather than inference. VCCircle's public preview of a 2022 IPO plan is
              too stale to underwrite an exit path in 2026. Thesis-break triggers are straightforward: audited earnings
              that fail to scale into the latest mark, investor-rights terms that subordinate new money, or a delayed
              IPO/liquidity path that leaves the 2025 valuation without an obvious monetization route.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
