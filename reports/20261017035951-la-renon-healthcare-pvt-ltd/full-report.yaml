      - number: '5.3'
        title: Deployment, regulatory reach, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Public deployment evidence is strongest on geographic reach and regulatory-facing execution, not on
              product-level performance metrics. On its official global page, La Renon says it has footprints in more
              than 40 countries, 269 registrations, and 90 applications under evaluation, alongside
              manufacturing-facility approvals from named health authorities across Africa and Asia. That export and
              approvals narrative aligns with Medical Dialogues' report that exports contributed 40-45% of FY24 net
              sales, and with LinkedIn's positioning of the company as a mid-sized private manufacturer focused on
              multiple specialty segments. The roadmap is also expansionary on paper: La Renon says roughly 175 products
              are in pipeline, while Economic Times says a new Rajasthan oral-solid-dosage plant would lift monthly
              tablet-and-capsule capacity from 100 million to 400 million. Those facts support a maturity story around
              breadth, filings, and capacity, but they do not establish product-launch cadence, market-by-market
              commercialization success, or post-launch quality performance.
            claimRefs:
