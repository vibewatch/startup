            title: Durability is materially under-evidenced
            body: >-
              The retained public corpus does not disclose NRR, GRR, churn, contract duration, customer count, or
              top-customer revenue share, so the chapter can support reach and channel breadth more confidently than
              retention or concentration.
            calloutType: risk
