            body: >-
              The combination of 40+ countries, 269 registrations, 90 applications, and named ministry approvals is
              stronger customer evidence than a logo wall because it shows market-access work has actually been done. It
              still does not identify the recurring buyers or reorder behavior behind the export business.
            calloutType: strength
