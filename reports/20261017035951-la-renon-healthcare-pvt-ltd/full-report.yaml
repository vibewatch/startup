      - number: '6.3'
        title: Durability, named proof, and concentration still need diligence
        blocks:
          - type: paragraph
            body: >-
              The largest customer diligence gap is not whether La Renon has commercial reach, but whether that reach is
              durable, referenceable, and diversified. Across the retained public sources for this chapter, none
              disclosed customer count, NRR, GRR, churn, renewal rates, contract length, or top-customer revenue share,
              and public customer proof remains mostly proxy evidence such as patient-segment claims, ministry
              approvals, route-to-market descriptions, and scale directories. Even the retained Tata 1mg marketer URL
              did not preserve marketer-specific assortment text in the fetched output, so it could not be used to
              validate active online-retail breadth. That leaves two practical risks open: concentration cannot be
              sized, and production deployment is less verifiable than the company’s market-access story. Investor
              diligence should therefore push for cohort, renewal, account-mix, and named reference evidence before
              treating customer durability as underwritten.
            claimRefs:
              - CU003
