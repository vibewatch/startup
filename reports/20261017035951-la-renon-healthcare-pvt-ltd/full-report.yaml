          detail: Specialty marketing teams and a large MR base drive prescription demand in chronic therapies.
        - label: Channel structure
          displayValue: Super-distributor plus export registrations
          detail: Domestic collections rely on dealer credit while export expansion relies on registrations and approvals.
        - label: Reported audited revenue
