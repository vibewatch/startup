      - number: '6.2'
        title: Adoption proof comes from scale proxies and export access
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is stronger at the market-access and scale-proxy level than at the named-account level. The
              strongest independent datapoints are that Medical Dialogues reported FY24 revenue of INR 1,400 crore with
              exports at 40-45% of net sales, while official surfaces say La Renon has a footprint in more than 40
              countries, 269 registrations, 90 applications under evaluation, and manufacturing approvals spanning
              Kenya, Uganda, Ivory Coast, Tanzania, Malawi, Cambodia, Nepal, Ethiopia, Zimbabwe, and Sudan. Directory
              and marketplace surfaces add imperfect but useful scale signals: LinkedIn shows a 501-1,000 employee band,
              Tofler lists eight India locations, and TheCompanyCheck reports 2,727 professionals under a different
              scope. Together these point to a business that has real reach and commercialization infrastructure, but
              the proof is still one step removed from recurring customer-account detail.
