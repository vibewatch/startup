              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Top underwriting risk is disclosure lag versus operating scope
            body: >-
              Public sources show a company that is larger and more international than a typical private generics
              business, but the quality of disclosure still looks closer to a private, founder-led asset. That mismatch
              raises the odds of surprises in collections, covenants, or compliance.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR016
          - type: callout
            title: Kill criteria before paying for growth
            body: >-
              Stop if diligence cannot reconcile open charges, working-capital quality, investor rights, and
              country-approval maintenance. The current public record is strong enough to justify diligence, not strong
              enough to underwrite those items by assumption.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a quality business with meaningful chronic-therapy scale, but not a clean buy
              at the latest visible private mark. Medical Dialogues reports FY24 revenue of Rs 1,400 crore and EBITDA of
              Rs 300 crore, while MedicinMan reports a later 7% transaction at nearly Rs 11,000 crore. That valuation
              step-up shows investor demand, yet the public evidence set is still built from snippets, company pages,
              and data aggregators rather than a recent audited package. Entry discipline therefore matters more than
              the company-quality story: without cleaner evidence on earnings durability, leverage, investor rights, and
              exit timing, the prudent stance is to track and engage only if diligence closes the gaps or price resets.
            claimRefs:
              - CV001
