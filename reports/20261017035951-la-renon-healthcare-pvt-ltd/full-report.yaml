      - number: '4.2'
        title: Efficiency, margin, and cash conversion
        blocks:
          - type: paragraph
            body: >-
              The strongest audited economics in the assigned pool come from CARE's FY22 and 9MFY23 release. It shows
              healthy PBILDT and PAT margins, but also a business that consumes working capital because dealer credit
              and inventory support growth. CARE explicitly said the company follows a super-distributor model, extends
              higher credit to dealers, and recovered bill discounting charges from customers. That helps explain why
              gross cash accruals remained materially ahead of operating cash flow. The GTM motion appears
              salesforce-heavy rather than digitally self-serve: CARE cited more than 16,000 doctors covered and a large
              MR base, while the company emphasizes customer-dedicated marketing teams. That can be effective in Indian
              chronic therapies, but without CAC, payback, gross margin by therapy, or productivity trends after the MR
              expansion, the public record cannot prove whether recent scale came from durable unit economics or from
              temporarily heavier field investment.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI004
              - CI008
      - number: '4.3'
        title: Capital needs and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The underwriting question is less whether La Renon can report profitable growth and more whether it can
              convert that growth into resilient cash generation while funding subsidiaries, capex, and export
              expansion. CARE's release is explicit that ELPL was loss-making, under liquidity stress, and had defaulted
              on debt repayment during 9MFY23, requiring La Renon support. CARE still viewed liquidity as strong because
              of cash balances and modest leverage, but that snapshot predates the 2024-2025 secondary-market valuation
              step-up and does not show current cash, covenant headroom, or free-cash-flow performance. Recent
              transaction evidence also appears mostly secondary rather than clearly primary capital into the company,
              so headline deal size should not be treated as cash available for operations. Net: revenue quality and
              margin path look plausible, but audited current-period statements, export-mix reconciliation, and direct
              management data remain necessary before treating the company as fully underwritten.
            claimRefs:
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Working capital, not accounting profit, is the core financial risk
            body: >-
              CARE's audited numbers show healthy margins, but the company still carried a 134-day working-capital cycle
              and generated much less operating cash flow than gross cash accruals.
            calloutType: risk
            claimRefs:
              - CI002
              - CI004
          - type: callout
            title: Recent valuation marks rely on a disclosure layer that is newer but softer
            body: >-
              The 2024-2025 revenue and valuation datapoints are directionally useful, yet they sit on secondary-market
              and media-style sources rather than current filed statements, so they should frame diligence questions
              more than close them.
            calloutType: insight
            claimRefs:
              - CI012
              - CI013
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Therapy footprint and customer workflow
        blocks:
          - type: paragraph
            body: >-
              La Renon's product offer appears to be branded chronic-therapy formulations sold into recurring
              prescriber, hospital, and distributor workflows rather than a single flagship asset. Across
              company-controlled and independent profiles, the public footprint consistently spans nephrology, critical
              care, CNS/neurology, urology, gastroenterology, respiratory, and cardio-metabolic therapies, which gives
              the chapter a coherent core around chronic-disease treatment rather than acute opportunism. The company
              also says it entered through nephrology and early-stage CKD care, which matters because that founding
              wedge explains why nephrology remains the sharpest public positioning claim. Economic Times separately
              reports a portfolio of roughly 340 formulations, so the public surface suggests breadth at the portfolio
              level, but not enough SKU-level detail to test where depth, pricing power, or physician adoption is
              strongest.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
