      - number: '1.3'
        title: Capital, ownership, and scale markers
        blocks:
          - type: paragraph
            body: >-
              The strongest recent external financing datapoint in the assigned pool is Preqin's September 2025 profile,
              which says a consortium led by White Oak, Siguler Guff, Creador, and Avendus acquired about 10% of La
              Renon at an INR 110 billion valuation. Medical Dialogues provides an earlier marker: ChrysCapital's April
              2024 secondary purchase of roughly 8% at an $800 million valuation, alongside a post-transaction ownership
              snapshot that still left the promoter family near 80%. Those transactions confirm investor interest and
              mark the company as a late-stage private asset, but the evidence set does not disclose cumulative capital
              raised, current cap table rights, or a reconciled current ownership ledger after both deals. CompanyCheck
              and Tofler add balance-sheet-adjacent context, including paid-up capital and open charges, which is useful
              for diligence but not a substitute for audited statements.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO015
