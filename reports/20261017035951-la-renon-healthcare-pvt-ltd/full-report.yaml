              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
              - CR016
      - number: '7.3'
        title: Ownership churn and partner dependence are the main residual underwriting risks
        blocks:
          - type: paragraph
            body: >-
              Recent transactions show a cap table in motion rather than a settled founder-owned private company.
              Medical Dialogues reported a secondary ChrysCapital deal in 2024, while Preqin recorded a separate
              September 2025 minority investment by a consortium led by White Oak, Siguler Guff, Creador, and Avendus PE
              Investment Advisors at an INR 110 billion valuation. Registry data now show two nominee directors, and the
              company's LinkedIn feed references CCI approval for a shareholding transaction, but public materials still
              do not disclose reserved matters, liquidity expectations, or the economics attached to these investor
              entries. At the same time, international expansion appears dependent on distributors, local commercial
              teams, and registration upkeep rather than a fully disclosed owned network. That combination creates a
              credible kill-criteria stack: rising charges without better cash transparency, stalled approvals, or
              sponsor-led exit pressure before governance disclosure improves.
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
