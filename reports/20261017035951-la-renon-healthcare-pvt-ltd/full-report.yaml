      - Probability signal
    rows:
      - - Bull
        - >-
          FY24 revenue and EBITDA prove repeatable, export/global registrations convert into additional growth, and IPO
          readiness becomes visible.
        - >-
          Sustain or exceed the ~Rs 11,000 crore private mark only if fresh audited earnings and liquidity preparation
          validate the rerating.
        - Execution in new markets, disclosure slippage, and private-market multiple compression.
        - Needs audited post-FY24 growth plus formal exit preparation.
      - - Base
        - >-
          The company remains a strong chronic-therapy compounder, but public diligence stays incomplete on rights,
          leverage, and current audited earnings.
        - >-
          Track at current pricing; an attractive entry would require a discount to the latest visible mark or
          materially better evidence.
        - Paying for growth before rights and earnings quality are verified.
        - Most consistent with today's evidence set.
      - - Bear
        - IPO timing slips, disclosure stays thin, or earnings do not keep pace with the rerating.
        - >-
          Downside can revert toward older public transaction anchors around the 2024-2023 range rather than the 2025
          high-water mark.
        - Secondary liquidity dries up, leverage matters more, or investor protections favor existing holders.
        - Most likely if diligence cannot close the current evidence gaps.
    notes: >-
      Ranges are directional because the pool contains transaction anchors but not enough current audited detail for a
      precise DCF or trading-multiple model.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
      - CV013
      - CV014
      - CV015
      - CV016
