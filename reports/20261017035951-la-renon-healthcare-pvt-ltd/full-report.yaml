        title: Milestones and unresolved public gaps
        blocks:
          - type: paragraph
            body: >-
              The timeline in the current pool is enough to establish a coherent company arc: formation in 2007,
              operating launch in 2008, a visible market-scale milestone by April 2020, financing and governance changes
              through 2024 and 2025, and a current export footprint that management says exceeds 40 countries. What
              remains notably incomplete is not identity but disclosure quality. The only IPO-timing datapoint in this
              pool is an August 2022 VCCircle preview, while the exact current headcount still cannot be supported
              because public proxies disagree materially. Customer count is also still absent from the reviewed public
              set. Those gaps are material because later chapters will need them to judge operating leverage, commercial
              density, and exit readiness.
