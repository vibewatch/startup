  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              La Renon's monetization model is easiest to underwrite as a chronic-therapy branded-generic portfolio
              rather than as a contract manufacturer, platform, or subscription business. CARE described a
              357-formulation portfolio as of March 2022, and the live company product PDF still lists discrete tablet,
              capsule, infusion, and injectable SKUs across cardio, nephrology, critical care, gastro, and neuro lines.
              That supports a per-SKU product-sales model, but not a clean realized-pricing model: the assigned official
              catalog shows molecules and strengths, not pack prices, rebates, or gross-to-net terms. Public traction
              also has two layers: harder FY22/9MFY23 credit-rating numbers, and newer private-market deal datapoints
              pointing to FY24-FY25 revenue growth and a richer valuation. The business looks scaled, but public
              disclosure still understates what an investor would need to validate revenue quality by therapy,
              geography, and channel.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
