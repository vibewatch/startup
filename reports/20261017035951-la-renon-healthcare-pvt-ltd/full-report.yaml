chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              The reviewed source set consistently places La Renon in Ahmedabad and dates its incorporation to 2007,
              while official materials add that the business started operations in 2008 and began by focusing on
              nephrology for chronic kidney disease patients. The official site and Preqin together describe a
              chronic-therapy branded-formulations company spanning nephrology, critical care, CNS, gastroenterology,
              urology, cardio-metabolic, respiratory, and gynaecology. For diligence purposes, that means the company
              should be treated as a specialty branded-generic platform rather than a single-product asset: the current
              identity is stable, but several commercial scale metrics still have to remain qualified rather than
              treated as audited fact.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
