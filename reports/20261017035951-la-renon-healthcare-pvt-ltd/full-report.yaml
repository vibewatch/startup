      - number: '1.2'
        title: Leadership and governance surface
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is split between company biographies and registry aggregators. The founder remains the
              central figure: official materials identify Pankaj Singh as founder, and registry pages still show him as
              managing director. Beneath him, the public leadership surface points to a long-tenured operating bench
              rather than a fully transparent private-board package, with Vivek Gupta tied to the nephrology franchise
              and Yashwant Singh tied to several domestic therapy businesses. Registry data also show additional nominee
              and independent-looking board seats added over time, which suggests institutional oversight is increasing,
              but the company does not publish the shareholder-rights package or full governance documents needed to
              judge control protections.
            claimRefs:
              - CO002
