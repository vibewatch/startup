    type: flow
    summary: >-
      The recommendation follows the path from operating proof and investor demand to disclosure friction and price
      discipline.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          note: Medical Dialogues cites FY24 revenue of Rs 1,400 crore and EBITDA of Rs 300 crore.
        - id: market-position
          label: Niche positioning
          note: Company pages describe chronic-therapy breadth, nephrology leadership, and 40+ country reach.
        - id: private-demand
          label: Private-market demand
          note: Public secondary marks moved from about Rs 6,500 crore in 2024 to nearly Rs 11,000 crore in 2025.
        - id: disclosure-friction
          label: Disclosure friction
          note: Audited post-FY24 operating proof, rights terms, and synchronized workforce disclosure are still missing.
        - id: scenario-skew
          label: Scenario skew
          note: Upside needs new proof; downside can lean on older transaction anchors if liquidity or execution slips.
        - id: recommendation
          label: 'Recommendation: track'
          note: Stay engaged, but keep pricing discipline until diligence closes the valuation-critical gaps.
