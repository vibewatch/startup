              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: What looks durable in public view
            body: >-
              The visible moat is executional: specialty coverage in nephrology, customer-dedicated marketing teams,
              export registrations, and manufacturing plus API infrastructure.
            calloutType: strength
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP013
          - type: callout
            title: What still looks commoditized
            body: >-
              Public evidence points to established generic molecules and weak public pricing visibility, so realized
