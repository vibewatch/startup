              - CR003
              - CR006
              - CR014
              - CR015
      - number: '7.2'
        title: Operating complexity is high enough that controls matter more than headline growth
        blocks:
          - type: paragraph
            body: >-
              The public record shows a business with enough moving parts to create execution risk even if commercial
              demand remains healthy. La Renon says it supports field teams across India and 40 other countries, while
              independent reporting ties the business to two manufacturing units, two API units, one USFDA-approved API
              unit, and exports that accounted for 40-45% of net sales in FY24. The careers page also advertises finance
              and tax hiring for distributor accounting, fixed-asset controls, SAP, and statutory compliance, implying
              the back office is still being built around scale. A further warning sign is disclosure inconsistency:
              public workforce indicators range from 500-1,000 employees to 2,727 employees, which makes productivity
              and span-of-control benchmarking unreliable. The core operating risk is not obvious demand weakness; it is
              whether quality, collections, and finance controls are as mature as the footprint suggests.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR008
              - CR013
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
