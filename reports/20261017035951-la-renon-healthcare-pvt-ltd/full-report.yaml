              - CE006
              - CE007
      - number: '5.2'
        title: Operating model and asset base
        blocks:
          - type: paragraph
            body: >-
              The operating model looks like a multi-asset pharmaceutical platform with internal R&D feeding specialized
              manufacturing entities and product extensions. Economic Times reports that La Renon operates through
              Stanford Laboratories for formulations, Frimline for medical foods, Enaltec Labs for API research, and
              Rusoma Healthcare for small-volume parenterals, while Medical Dialogues says the group had two
              manufacturing units, two API units, and an in-house R&D center in 2024. Preqin adds an important mechanism
              detail: the internal R&D center develops formulations and processes, then transfers technology to
              manufacturing facilities such as Stanford Labs. Taken together, that is enough to describe a public
              operating architecture from formulation development to manufacturing transfer, but not enough to validate
              batch yields, tech-transfer cycle times, or plant utilization. The announced Rajasthan oral-solids plant
              reinforces that scale-up remains a live operating priority rather than a completed historical build-out.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
