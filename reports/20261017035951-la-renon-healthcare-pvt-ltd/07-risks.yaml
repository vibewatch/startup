      - ["Freedom-to-operate / IP challenge", "Formulation launches and foreign filings", "IP function visibly staffed", "Medium", "Medium-High", "In-house patent/IPR role covers prior art, infringement, annuities, and foreign counsel", "Medium", "Inspect patent docket, oppositions, infringement notices, and top molecule legal opinions."]
