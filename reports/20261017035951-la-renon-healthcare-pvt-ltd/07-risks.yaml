callouts:
  - calloutType: "risk"
    title: "Top underwriting risk is disclosure lag versus operating scope"
    body: "Public sources show a company that is larger and more international than a typical private generics business, but the quality of disclosure still looks closer to a private, founder-led asset. That mismatch raises the odds of surprises in collections, covenants, or compliance."
    claimRefs: ["CR013", "CR014", "CR016"]
  - calloutType: "recommendation"
    title: "Kill criteria before paying for growth"
    body: "Stop if diligence cannot reconcile open charges, working-capital quality, investor rights, and country-approval maintenance. The current public record is strong enough to justify diligence, not strong enough to underwrite those items by assumption."
    claimRefs: ["CR002", "CR003", "CR011", "CR013", "CR014"]
