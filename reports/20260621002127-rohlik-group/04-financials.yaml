- id: section-3
  title: Capital intensity, financing dependency, and balance-sheet implications
  body: 'Rohlik’s financial model is inseparable from capital intensity. The company has committed more than €400 million to automation, continues to invest in fulfillment technology, and has supplemented equity rounds with EIB-backed scale-up debt. That is rational if management believes automation raises throughput, defends service quality, and ultimately improves unit cost. It also means the company should be judged against return-on-capital discipline, not merely against topline growth. Growth capital led by EBRD in 2024 and continuing EIB support into 2026 show that sophisticated institutions are willing to fund that thesis, but they do not remove the need for execution proof.


    Germany is the biggest swing factor in this equation. Newer geographies can consume capital for years before reaching mature density, and the public record still frames Germany as a strategic buildout rather than a fully harvested earnings engine. Veloq slightly broadens the financing narrative because it opens a software and project-finance pathway adjacent to the retail business, but it can also complicate value capture if technology economics and grocery economics diverge. Overall, the capital structure looks supportive, yet the business remains dependent on disciplined rollout and measured capex payback.'
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI032
