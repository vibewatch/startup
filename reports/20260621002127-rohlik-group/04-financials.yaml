    severity: material
    topic: cac-payback
    missingEvidence: Customer acquisition cost, contribution margin, and payback by market and channel.
    whyItMatters: These metrics determine whether growth is truly value accretive.
    diligencePath: Ask management for cohort economics or channel-level acquisition analysis.
    relatedQuestionRefs:
    - QI023
    - QI025
    relatedTableRefs:
