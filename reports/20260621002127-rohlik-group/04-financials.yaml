- id: section-4
  title: Disclosure gaps and bottom-line financial verdict
  body: 'The most important financial negative is not lack of scale; it is lack of disclosure. Rohlik is still private, and the public record does not provide cash balance, burn, runway, market-level contribution margins, or reconciled channel acquisition economics. Those omissions matter because online grocery is operationally complex and capital hungry. A business can post strong revenue growth while still destroying value in newer markets or overinvesting ahead of density. The Czech corporate register helps on legal-entity existence, but it does not close the underwriting gap.


    The appropriate verdict from public evidence is therefore balanced. Rohlik appears to have crossed the threshold into real scale, has multiple signs of margin improvement, and has backers willing to finance continued automation and expansion. At the same time, high capex, incomplete margin disclosure, and unresolved questions around Germany mean the company should still be modeled as a late-stage growth business with significant diligence blockers, not as a transparent pre-IPO comp. The economics look promising enough to justify further work, but not transparent enough to wave through without management data.'
  claimRefs:
