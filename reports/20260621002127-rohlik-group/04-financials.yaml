  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, and runway months by the latest board reporting date.
    whyItMatters: Capital adequacy cannot be underwritten cleanly without liquidity visibility.
    diligencePath: Request latest cash bridge, debt draw status, and covenant package.
    relatedQuestionRefs:
