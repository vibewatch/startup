- id: section-2
  title: Unit economics and margin path
  body: 'The public margin story is encouraging but incomplete. Third-party and partner sources point to 2024 gross profit of about €389 million, or roughly 38% of revenue, and to positive EBITDA in the Czech core for years, Hungary since 2021, and Munich since 2023. Rockaway and TCF also describe group EBITDA as positive at a modest level, with the Czech business delivering materially stronger profitability. Taken together, that suggests Rohlik has moved beyond the pure cash-burn phase and that at least some market clusters have validated the model operationally.


    Still, online grocery is not software. Gross profit does not flow cleanly to free cash flow when inventory freshness, fulfillment labor, route density, and capex all matter. Public metrics such as NPS, on-time delivery, and repeat order behavior help explain why the business can support improving margins, but they do not tell investors the full story on CAC, payback, contribution margin, or working-capital timing. The right reading is therefore that Rohlik has credible signs of economic progress, but not yet a disclosure package that lets an outside underwriter declare the margin path fully proven.'
  claimRefs:
  - CI006
