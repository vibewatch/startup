- id: operational-and-regulatory
  title: Operational, regulatory, and dependency risk
  body: >-
    The operating model that makes Rohlik interesting is the same model that creates execution risk. A 40% fresh-produce mix, high delivery reliability expectations, and a multi-temperature fulfilment process mean the company depends on daily excellence in procurement, storage, picking, consolidation, and last-mile handoff. Automation helps, but it also couples service quality to vendor-backed systems such as Brightpick and other fulfilment-automation partners. That creates a double-edged risk profile: higher automation can improve unit economics, but it also makes failures or delays in integration more consequential.


    Regulatory and legal complexity compounds the challenge. Rohlik operates across multiple food-retail jurisdictions, so labor rules, food safety, warehouse standards, and delivery obligations all matter. The Czech commercial register provides baseline legal anchoring, but it does not answer the operationally important questions investors would ask about labor disputes, local compliance incidents, or the exact governance rights attached to different operating entities. Public evidence is therefore sufficient to identify regulatory exposure, but not to rank it precisely by country. The same is true of customer and channel dependencies: the Amazon.de partnership is strategically interesting, yet investors still need to understand whether it improves acquisition efficiently or gradually weakens direct customer ownership in Germany.
  claimRefs:
  - CR013
  - CR014
  - CR017
  - CR018
