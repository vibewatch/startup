      - number: '5.2'
        title: 架构、自动化与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              Rohlik 技术故事中最差异化的一点，是它把物理自动化和软件编排当作同一个架构。慕尼黑是最清晰的公开 proof point：Rohlik 披露了一套含 28,000 个 bin、96 台机器人、12 个
              carousel port、200 米输送线的 AutoStore 系统，产能约每小时 2,500 单。公司还称该安装带来 3x 拣选生产率提升和 30% 额外存储。这些不是 vanity
              metrics；它们说明 Rohlik 已在真实运营站点公开展示吞吐改善。


              更广版图与旗舰安装同样重要。布拉格和维也纳被描述为 Swisslog 支持站点，汉堡为 Element Logic 部署，Brightpick 机器人则从布拉格试点推进到慕尼黑、法兰克福、维也纳和布拉格
              rollout。Brightpick 自身材料进一步强化，Rohlik 正在把自动化从存储取货扩展到覆盖常温、冷藏和冷冻区域的拣选与合并。这支持一个判断：Rohlik 的运营栈是模块化的，本地 app
              将需求输入站点特定自动化层，再回到最后一公里软件和客户服务指标。它也解释了为什么 Veloq 可以被可信地定位为可输出软件，而不只是内部工具。该架构并非从头到尾 clean-room 自研，但如果 Rohlik
              继续掌控编排层，它足够连贯，也足以差异化。
