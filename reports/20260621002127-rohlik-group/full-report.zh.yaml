      - number: '4.2'
        title: 单位经济性与利润率路径
        blocks:
          - type: paragraph
            body: >-
              公开利润率故事令人鼓舞，但不完整。第三方和合作方来源指向 2024 年毛利约 €389 million，约占收入 38%；捷克核心业务多年 EBITDA 为正，匈牙利自 2021 年为正，慕尼黑自 2023
              年为正。Rockaway 和 TCF 也称集团 EBITDA 小幅为正，捷克业务盈利能力明显更强。合在一起看，这说明 Rohlik 已经越过纯烧钱阶段，至少部分市场集群在运营上验证了模型。


              但在线杂货不是软件。当库存新鲜度、履约劳动力、路线密度和 capex 都重要时，毛利不会顺畅流向 free cash
              flow。NPS、准时配送和重复订单行为等公开指标有助于解释业务为何能支撑利润率改善，但并不会向投资者讲完整 CAC、回收期、贡献利润率或 working-capital 时点。正确解读是，Rohlik
              有可信的经济性进展信号，但披露包仍不足以让外部 underwriter 宣称利润率路径已完全证明。
