      - number: '3.4'
        title: Moat 持久性与主要竞争风险
        blocks:
          - type: paragraph
            body: >-
              牛市观点是，Rohlik
              已经拼出一个难复制的组合：高密度城市物流、强消费者服务信号，以及越来越针对杂货履约优化的技术栈。熊市观点是，杂货结构性低毛利，客户仍可跨渠道拆分份额，强大的既有玩家或平台可以模仿足够多的体验，在 Rohlik
              完全摊销投资基础之前压缩回报。公开记录同时支持这两种看法。


              更广行业重置是有用警示。Quick-commerce 收缩说明，没有扎实单位经济性的速度不够；Rohlik 仍必须证明，更有纪律的全品类策略能比那些踩坑公司带来更持久回报。因此，核心竞争问题不是 Rohlik
              今天是否差异化，而是在既有玩家改善、且公司需要每个新城市都越过更高回报门槛之后，这种差异化是否仍能防守。这也是下方风险登记表聚焦模仿、multi-homing 和 capex 回收，而不只看 headline
