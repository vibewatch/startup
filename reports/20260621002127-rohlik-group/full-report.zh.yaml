      - number: '7.2'
        title: 运营、监管与依赖风险
        blocks:
          - type: paragraph
            body: >-
              让 Rohlik 有意思的运营模型，也正是制造执行风险的模型。生鲜占比 40%、高配送可靠性预期和多温区履约流程，意味着公司依赖采购、存储、拣选、合并和最后一公里交接每天都做到位。自动化有帮助，但也把服务质量与
              Brightpick 及其他履约自动化合作伙伴等 vendor-backed 系统绑定在一起。这形成双刃风险：更高自动化可以改善单位经济性，但也让集成失败或延迟后果更重。


              监管和法律复杂性进一步叠加挑战。Rohlik
              跨多个食品零售司法辖区运营，所以劳动规则、食品安全、仓库标准和配送义务都重要。捷克商业登记提供基础法律锚点，但不能回答投资者会问的运营关键问题：劳动争议、本地合规事件，或不同运营实体附带的确切治理权。公开证据足以识别监管暴露，但不足以按国家精确排序。客户和渠道依赖也是如此：Amazon.de
              合作有战略意思，但投资者仍需要理解，它是在高效改善获客，还是在德国逐渐削弱直接客户所有权。
