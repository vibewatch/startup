      - number: '8.3'
        title: 价值驱动、下行触发因素和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的上行情景不难讲清楚。公司结合了 CEE 和 DACH 多国在线杂货领先地位、强客户规模验证、持续改善的国家层面盈利能力，以及 Veloq 这个可能成立的软件 /
              平台资产。如果德国能够持续增厚利润，Veloq 又证明能对外变现，业务就可能从“带技术的高效杂货商”升级为“有零售现金流的技术赋能杂货平台”，市场大概率会奖励这种转变。Amazon.de
              合作也带来有用的战略可选项：不用把 Rohlik 逼成纯交易平台模式，也能扩大德国触达。


              下行情景同样清楚。德国可能继续吃资本，杂货估值倍数可能继续被压着，Veloq
              也可能在比投资者希望更久的时间里，只是战略故事，而不是已经变现的软件资产。除此之外，资本结构、治理权利和各国精确经济模型的公开披露仍然薄弱。这类披露缺口不是无关痛痒的遗漏：它们直接决定标题估值能不能转化为好的投资回报。因此，最终尽调问题很窄，但很关键。投资者从观察推进到买入之前，需要拿到股权结构和优先权图谱、德国盈利桥，以及
              Veloq 独立经济模型。没有这三项，所谓精确只是虚假的安慰。
