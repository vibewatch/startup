      - number: '5.3'
        title: 差异化、就绪度与可变现平台潜力
        blocks:
          - type: paragraph
            body: >-
              Rohlik 最强的产品技术差异化不是某个单一机器人或 app 功能，而是杂货原生软件、自动化 capex 和可衡量服务结果的组合，并且这套组合跨五个国家运转。Veloq
              强化了这一论点，因为它点名了管理层认为可转移的层：Fulfillment、Last Mile 和 eCommerce。EIB 融资和外部报道也说明，第三方把 Veloq
              视为成熟度足以支撑集团自有零售版图之外扩张的平台资产。这有战略意义，因为它打开了一条上行路径：Rohlik 的估值部分来自技术提供商身份，而不只是在线杂货商身份。


              即便如此，公开记录仍指向一个混合的就绪度图景。Rohlik 披露了亮眼的 NPS、准时和无错指标，但没有披露许多平台 underwriter 会期待的买方级安全或隐私包。Android app
              表面证明本地化软件产品存在，却不能解释 moat 有多少来自自有软件，多少来自合作伙伴硬件和集成 know-how。因此，投资者应把 Rohlik
              视为一个运营可信度很高、具有真实外部化潜力的技术栈，但还不是完全透明的软件平台。下一步尽调要拆开 Veloq 真正拥有的东西和它协调的东西，并测试德国和奥地利自动化密度上升后，当前服务指标能否延续。
