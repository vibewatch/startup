  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模与公开 traction 实际证明了什么
        blocks:
          - type: paragraph
            body: >-
              Rohlik 现在已有足够收入历史支撑一条真实财务叙事，即便还不足以完全 underwriting。公开证据显示，收入从 2020 年约 €300 million，到截至 2022 年 4 月年度约 €490
              million、2023 年 €700 million、2024 年 €1.114 billion，2025 年初步收入约 €1.3
              billion。这条曲线重要，因为官方发布、分析师式摘要和合作方评论之间相互印证。它说明 Rohlik 不只是一个品类概念，而已经是有重复家庭需求的规模化杂货运营商。


              同一公开记录也说明了收入质量。客户数、订单量、平均订单价值和下单频率，与报告销售轨迹基本对得上。AOV 约 €63–64、每客户年订单约 14–15 单、客户基数约 1.2
              million，共同构成一个十亿欧元级别的连贯收入引擎。这不能替代经审计披露，但让 top-line 故事内部可信。关键 caveat
              在于，公开证据在销售规模上远比会计细节丰富，所以后续判断应依赖方向性信心，而不是来源并未真正提供的精确度。
