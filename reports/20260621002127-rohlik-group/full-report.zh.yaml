      - number: '1.2'
        title: 领导层厚度与治理成熟度
        blocks:
          - type: paragraph
            body: >-
              领导层仍由创始人主导，但过去两年班底明显更制度化。Tomáš Čupr 作为创始人兼 CEO 仍锚定战略和资本形成；Vineta Bajaj 则从 Ocado 和大型公司财务岗位加入，推动资本规划专业化。随后
              Rohlik 在运营端引入 Erwin Brunner，在技术端引入 David Pavlík，两人都有规模化全球平台背景。Mark Hübner 被任命负责德国和奥地利业务，也说明 Rohlik
              现在把市场级执行当作高管职责，而不是创业者的副业。


              治理指标仍不及公开市场投资者希望看到的厚度，但这家公司已经不再像创始人单点驱动的初创公司。公司发布文化准则、举报渠道和招聘原则，这很有意义，因为杂货执行依赖可复制的一线行为和供应商信任。即便如此，关键人依赖仍是真实的尽调项。战略、投资者信号和品牌身份仍围绕
              Čupr 展开，公开资料也没有同等详细地呈现董事会权利或内部委员会结构。结果是一家公司管理深度改善，但权力仍集中。
