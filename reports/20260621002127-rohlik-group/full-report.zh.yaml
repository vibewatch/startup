      - number: '8.2'
        title: 可比框架与估值区间
        blocks:
          - type: paragraph
            body: >-
              看 Rohlik，最有用的参照系不是一组，而是两组。Tesco、Ahold Delhaize 这类传统杂货商收入倍数低，因为业务成熟、多元，也没人把它们当软件资产定价。按这把尺子，Rohlik 隐含 1.5x
              倍数显得偏贵。但平台型杂货或交易平台公司给出的答案不同。Instacart 更接近 2.5x-3x 收入；Ocado 则说明，一旦公开市场不再相信平台叙事，这个溢价会有多危险。Rohlik
              卡在两者之间：比普通杂货商有更多技术和经营杠杆，但公开披露少于、变现也不如最强的软件式公司干净。


              这个中间状态解释了为什么估值判断落在合理。如果 Rohlik 按 Tesco 或 Ahold 定价，吸引力会很明显；如果按高溢价软件平台定价，又会显得过高。按目前已知估值，它两者都不是。核心问题是，投资者该不该把
              Veloq、自动化和德国利润率改善写进高倍数驱动因素。公开信息给出的答案是“部分可以，但不能盲目”。因此，估值区间相对传统杂货商的下行缓冲有限；只有当技术和盈利故事长期拿到高于零售倍数的认可，上行空间才真正有意义。
