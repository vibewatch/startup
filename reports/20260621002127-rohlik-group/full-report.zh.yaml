  - id: TV005
    title: 论点击穿和终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 德国业务无法持续增厚收益
        - 再跑 12-18 个月规模，仍看不到清晰盈利桥
        - 支撑溢价叙事所需的经营杠杆被拿掉
        - 若估值拉长或偏贵，下调立场
      - - Veloq 仍只是内部经济账
        - 没有外部客户或细分市场证据出现
        - 估值故事里的软件溢价被削掉
        - 重新贴近零售可比公司定价
      - - 股权结构条款被证明对投资人不友好
        - 清算顺位、反稀释棘轮或权利条款严重损害新资金经济性
        - EUR2B 的名义估值对回报测算不再关键
        - 视严重程度暂停或回避
      - - 公开可比公司进一步压缩
        - Ocado / Instacart / 杂货同行估值明显下调
        - 即使 Rohlik 执行良好，可接受入场倍数也会降低
        - 提高要求回报率，并下调可接受价格
    notes: 这些触发项直接绑定估值逻辑，不只是一般经营风险。
    claimRefs:
      - CV019
      - CV024
      - CV028
      - CV035
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与优先权
        - 清算顺位、反稀释棘轮、保护性条款
        - 决定新资金的真实回报
        - 律师与融资会议审查
      - - 德国盈利桥
        - 国家 EBITDA、履约利用率和订单经济性
        - 上行与下行情景的关键变量
        - 国家 P&L 与 FC 仪表盘审查
      - - Veloq 独立经济性
        - 收入、利润率和外部客户管线
        - 决定软件溢价是否站得住
        - 结合细分数据做产品 / 财务尽调
      - - 治理权利
        - 董事会权利、股东保护、IPO 路径变化
        - 影响流动性和下行保护
        - 法律尽调与治理备忘录
      - - 利润率转化
        - 各国毛利到 EBITDA 的桥
        - 要从合理变成有吸引力，必须补上这一环
        - 财务尽调资料包
    notes: 这些问题刻意收窄到投资关键项；每一项都可能实质改变建议。
    claimRefs:
      - CV034
      - CV036
      - CV040
      - CV041
