  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类结构
        blocks:
          - type: paragraph
            body: >-
              对 Rohlik 来说，正确的市场定义比「所有食品
              commerce」窄，又比「即时杂货配送」宽。公司所在的是全品类在线杂货：一种有计划的家庭采购流程，主要与传统超市购物竞争，其次与既有零售商配送服务竞争，只在部分场景与超快便利 app
              竞争。这个区别重要，因为每周家庭大篮子的经济性，与十分钟补货订单截然不同。篮子大小、生鲜可靠性和路线密度是判断市场吸引力的关键输入，单纯 app 安装量或一次性订单数信息量较低。


              欧洲市场结构仍处早期。McKinsey 仍称该地区大部分市场的在线渗透率低于 10%，意味着线下超市仍是真正的存量替代对象。与此同时，同一研究指向 2030
              年线上份额可能明显更高，说明只要运营商解决信任、密度和履约成本，市场增长可以很可观。因此，尽调中有用的框架不是「在线杂货是否存在」，而是「杂货中哪个子分部能以经济方式迁移到线上、在哪些城市、在什么服务承诺下迁移」。Rohlik
              的全品类定位把它放在长期收入潜力最大的子分部，但执行负担也最重。
