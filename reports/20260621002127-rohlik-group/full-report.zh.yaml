  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的风险栈异常集中在几个相互关联的问题上。第一，业务已承诺向自动化投入超过
              EUR400M，这提高了利用率、吞吐量和执行纪律的赌注。第二，德国仍是最大增长机会，但在重投入之后，也是对集团经济性最清晰的拖累。第三，未来任何 IPO
              路径不仅取决于增长，也取决于可比估值多年重置之后，公开市场是否还愿意买杂货技术故事。没有一个风险意味着模型已经坏掉；但合在一起，它们说明 underwriting case 对少数变量的敏感度，高于单看
              topline 增长所暗示的程度。


              好消息是，一些缓释因素可见。捷克、匈牙利和慕尼黑的国家盈利里程碑说明，当密度与运营对齐时，模型可以成立。但这些胜利没有取消德国需要纪律的事实；进一步扩张仍必须证明大额历史投资合理。投资者因此应把 Rohlik
              看成一家运营证明在改善、但战略漂移空间有限的公司。一个背负如此多 capex
              和市场扩张雄心的业务，不能同时承受太多失误：一个市场偏软或许可控，一个地区爬坡放慢或许可控，一次估值重置或许可控，但若其中多个同时发生，就会重塑整个投资案例。
