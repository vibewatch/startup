      - number: '4.4'
        title: 披露缺口与最终财务判断
        blocks:
          - type: paragraph
            body: >-
              最重要的财务负面不是缺规模，而是缺披露。Rohlik
              仍是私营公司，公开记录没有提供现金余额、burn、runway、市场级贡献利润率，或经调和的渠道获客经济性。这些缺口重要，因为在线杂货运营复杂且吃资本。一个业务可以发布强劲收入增长，同时仍在新市场毁灭价值，或在密度到来前过度投资。捷克商业登记有助于确认法律实体存在，但不能补上
              underwriting 缺口。


              因此，基于公开证据的合适判断应保持平衡。Rohlik 似乎已经跨入真实规模，有多个利润率改善信号，也有支持者愿意继续为自动化和扩张融资。与此同时，高
              capex、不完整利润率披露和德国相关未解问题，意味着公司仍应被建模为有重大尽调阻碍的后期成长业务，而不是透明的 pre-IPO
              comp。经济性看起来足以支持继续研究，但透明度不足以在没有管理层数据的情况下直接放行。
