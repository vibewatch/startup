      - number: '7.3'
        title: 融资、竞争与击穿假设的触发器
        blocks:
          - type: paragraph
            body: >-
              公开记录显示 Rohlik 仍能继续融资，但这不等于融资风险已经消失。TechCrunch 在 2022 年围绕市场降温的叙述、继续支持德国的需求，以及 EIB
              融资的存在，都说明业务仍部分活在资本市场条件里。如果公开市场或后期私募可比公司进一步压缩，集团可能会同时拥有强增长和改善中的运营，却面对更不宽容的融资环境。Ocado 的 de-rating
              是这一可能性最清晰的不利 comp：「tech-enabled」并不保证永远有溢价倍数。


              竞争和野心进一步抬高门槛。Picnic 和 Flink 说明，专业化在线杂货或便利模型仍会持续压迫本地市场经济性；到 2030 年 EUR10B 的愿景也要求持续多国执行。投资者因此应紧盯少数
              thesis-break 信号：德国无法达到持久盈利、集团自我融资尚未证明前又出现新的资本需求，或重大监管 / 服务事件损害核心市场信任。如果这些触发器保持安静，Rohlik
              的风险画像可以继续改善；如果两个或更多同时启动，业务可能迅速从「带有选择权的扩张」转向「长进自身约束里」。
