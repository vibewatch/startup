companyProfile:
  summary: >-
    Rohlik Group 是一家总部位于布拉格、由创始人掌舵的欧洲在线杂货龙头，由 Tomáš Čupr 于 2014 年创立。公司在捷克、匈牙利、奥地利、德国和罗马尼亚五个国家，以五个消费者品牌运营全品类杂货配送，借助自研 AI
    驱动、高度自动化的履约中心，在 60–180 分钟内配送 17,000–24,000 个 SKU。2024 年经审计收入 €1.114 billion、同比增长 34%，两大市场实现 EBITDA 盈利，Rohlik
    已成为欧洲大陆唯一盈利的大型在线杂货商。2025 年 6 月，公司拆分出独立的 AI-native 杂货履约平台 Veloq，并计划 2027 年 IPO。
