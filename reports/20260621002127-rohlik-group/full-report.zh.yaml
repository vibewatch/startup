  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前价格背景
        blocks:
          - type: paragraph
            body: >-
              Rohlik 已不再是需要凭英雄式想象才能证明相关性的投机型杂货初创。公开收入从 2023 年约 EUR700M 增至 2024 年 EUR1.114B，2025 年初步报告约
              EUR1.3B，客户和订单指标也持续扩大。与此同时，外部材料把当前估值背景放在 EUR2B 以上。用简单收入视角看，这意味着约 1.5x
              倍数。对于一家已有真实规模、盈利能力改善、并且技术平台叙事越来越明确的公司，这不是离谱数字。


              但「不离谱」不等于「有吸引力的入场」。Rohlik 仍需要德国成熟、Veloq 证明独立变现、融资条款变得更清晰。因此，当前证据支持有纪律的 track
              建议，而不是买入。投资者可以相信公司质量高，同时仍坚持价格敏感。信心应为中等：增长和战略进展的公开证明很多，但 preference stack、国家级经济性，以及 Veloq
              今天到底应获得多少软件溢价，证据少得多。实务上，按已知信息看，Rohlik 估值大体合理；如果执行继续收紧就有上行，若 grocery-tech 倍数或德国经济性失望则有下行。
