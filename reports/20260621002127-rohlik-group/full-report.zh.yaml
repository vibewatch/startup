        title: 技术里程碑、时间线与不利背景
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的身份与仓库自动化和履约软件分不开。官方材料描述的技术栈建立在 AutoStore 系统、Swisslog 集成和 Brightpick 机器人之上，公司承诺在 2021–2025
              年期间向自动化投入超过 €400 million。2025 年 Veloq spinout 进一步强化了这条叙事：公司把内部杂货技术变成拥有自身外部融资路径的独立平台。此举扩大了战略选择权，但也凸显 Rohlik
              的差异化多大程度上依赖持续把资本砸进运营基础设施。


              里程碑记录也必须保留不那么好看的事实。意大利和西班牙已不在活跃版图内，德国虽在慕尼黑取得本地进展但仍在向全面盈利扩张，2027 年 IPO
              日期更应被视为管理层愿景，而非确定时间表。这些不是旁注。它们定义执行风险，因为同一家实现强劲收入增长的公司，还必须证明自动化支出、地域扩张和平台拆分能转化为持久资本回报。因此，下方时间线应成为后续章节同时引用成功标记和警示信号的标准来源。
