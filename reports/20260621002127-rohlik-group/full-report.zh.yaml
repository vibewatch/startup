      - number: '2.4'
        title: 增长驱动、约束与可能击穿假设的因素
        blocks:
          - type: paragraph
            body: >-
              最重要的正向驱动是便利与信任的复利。如果一个家庭可以稳定地用一个品类广、生鲜好、准时的在线篮子替代去店购物，重复使用就会具备结构吸引力。自动化通过扩大拣选能力、可能改善劳动生产率来强化这一点，这也是 Rohlik
              及其支持者持续给履约技术投钱的原因。来自股权投资者和 EIB 相关融资的机构支持说明，外部资本仍相信该品类有成熟空间。


              核心约束在于杂货容错率很低。毛利比软件薄，资本需求更重，每进入一个新城市都需要本地执行，而不是简单数字分发。既有杂货商有门店、采购规模和 omnichannel 选择；quick-commerce
              初创公司仍能在速度预期上施压；早期意大利和西班牙故事也说明扩张错误代价高。因此，市场分析是建设性但有条件的。Rohlik
              正在进攻一个大而仍低渗透的品类，但赢家会是能把密度和自动化转化为持久经济性的运营商，而不只是市场叙事最宽的公司。
