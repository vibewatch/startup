chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与运营模型
        blocks:
          - type: paragraph
            body: >-
              理解 Rohlik Group，关键不是把它看成一个覆盖宽、触达轻的 marketplace，而是一个围绕高密度城市覆盖区搭建的全品类在线杂货商。公司由 Tomáš Čupr 于 2014
              年在布拉格创立；官方材料和独立报道都一致显示，业务当前活跃于五个市场：捷克、匈牙利、奥地利、德国和罗马尼亚。这一点重要，因为公司已经试过扩张边界。意大利和西班牙曾属于 Sezamo
              的增长叙事，但已不在当前活跃版图内，所以今天的运营地图比早期泛欧洲叙事更窄，也更有纪律。


              运营模型也不同于主导 2021 年头条的即时配送公司。Rohlik 强调每周杂货任务、生鲜组合和高频家庭便利。公开摘要显示，公司商品组合约 17,000–24,000 个，生鲜约占销售额 40%，说明它不只是卖
              pantry top-up。分析上的结论是，后续章节应把 Rohlik 看成一家物流很重、由软件赋能运营的零售商，而不是纯需求聚合 app。因此，密度、冷链执行和供应商质量，与消费者品牌或 app 增长同样重要。
