      - number: '1.3'
        title: 规模、融资与利益相关方结构
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的公开规模指标已经远超初创新鲜感，明确进入后期运营型公司区间。根据合作方报道，收入从 2020 年约 €300 million 增至截至 2022 年 4 月年度的 €490
              million、2023 年 €700 million、2024 年超过 €1.1 billion，2025 年初步数字约 €1.3 billion。客户数、订单和平均订单价值都指向同一结论：这已经是大型高频家庭
              commerce 平台，不是早期市场测试。


              资本形成也沿着这条轨迹推进。公司 2021 年 3 月完成 €190 million Series B，数月后以独角兽身份完成 €100 million Series C，2022 年完成 €220
              million Series D，随后 2024 年由 EBRD 而非 Partech 领投成长轮。公开来源还显示累计股权融资约 €780 million+，估值高于 €2
              billion。这套资本结构有战略意义，因为 Rohlik 不只是给软件 R&D 融资；它还在为自动化、市场进入和重 working-capital
              的杂货运营融资。因此，利益相关方不只是被动股东，还提供耐心、债务能力和后续融资可信度。
