      - number: '3.3'
        title: 定价、渠道与分发权力
        blocks:
          - type: paragraph
            body: >-
              公开竞争者比较在实际定价上最弱，在分发结构上最强。Rohlik
              似乎并不是因为在透明且永远可比的意义上独特便宜而取胜；公开来源没有足够标准化的篮子数据支撑这一主张。更可见的优势来自更好的服务组合：广泛品类、可靠时段、生鲜执行和鼓励更高频篮子形成的用户体验。这意味着定价权即便存在，也更可能来自流程价值，而不是客户锁定。


              因此，分发至关重要。Berlin 的 Amazon.de 合作有战略意思，因为它在不要求 Rohlik
              拥有既有门店资产的情况下，扩大客户获取和便利性。但它也证明，公司愿意在有用时借用大得多的平台分发。这同时是优势和依赖。核心竞争事实仍是，杂货客户很容易 multi-home，所以 Rohlik
              必须用每一单守住相关性，而不是靠硬合同锁定。
