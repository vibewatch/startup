      - number: '3.2'
        title: 能力差异化与 Rohlik 更强的地方
        blocks:
          - type: paragraph
            body: >-
              Rohlik 最清晰的公开差异化在运营，而不是单纯品牌。公司围绕全品类组合、生鲜可信度和稳定服务质量定位。公开摘要反复提到 NPS 高于 90、准时配送约
              97%，这些在杂货中是有意义的信号，因为转换成本不高，执行差会很快被惩罚。更重要的是，Rohlik 对自动化投入很重。AutoStore 基础设施、Swisslog 相关集成和 Brightpick
              机器人共同指向一套履约系统，许多本地杂货既有玩家如果不显著增加 capex，很难快速复制。


              Veloq spinout 给能力故事加了第二层。它说明 Rohlik 可能不只是在内部运营差异化软件，最终还可能把部分工具外部化为平台优势。这不会把公司变成纯技术授权商，但确实强化了一个判断：Rohlik 的
              moat 可能先通过内部生产率收益拓宽，再通过正式网络效应拓宽。关键 underwriting 问题是，这些能力投资复利的速度，能否快过竞争对手模仿可见前端功能的速度。
