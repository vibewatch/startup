  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与工作流
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的产品更应被理解为一套 full-stack 杂货工作流，而不是单个购物 app。面向客户的表面从 rohlik.cz、kifli.hu、gurkerl.at、knuspr.de、sezamo.ro
              等本地 storefront
              开始，但真正的产品承诺，是时段准确、高频重复购物和生鲜占比高的篮子组合。公开材料把这项承诺与一条集成运营闭环绑定：浏览广泛商品组合，承诺窄配送窗口，把订单路由进自动化履约，跨温区合并，再以高服务可靠性送达。


              这很重要，因为 Rohlik 的经济性和技术设计由重复家庭需求塑造，而不是偶发便利订单。平均篮子约 EUR63–64、每客户每年 14–15 单、生鲜占比接近
              40%，说明这是一条为每周家庭购物优化的流程，质量失败代价高且高度可见。在这种语境下，履约软件、机器人和路由逻辑本身就是产品的一部分。Rohlik 的软件也延伸到核心杂货交易之外：自有品牌、Rohlik Xtra
              折扣和 upcycling 品类，说明 merchandising、忠诚度和减废举措直接叠在同一数字表面上。结果是一个比通用 e-commerce 前端更有运营深度的产品，但也有更多必须每天同步执行的依赖。
