      - number: '2.3'
        title: 买方分群与采用流程
        blocks:
          - type: paragraph
            body: >-
              Rohlik
              的自然用户不是随机便利购物者，而是希望外包杂货计划中反复摩擦的家庭。公开和推断证据指向城市家庭和忙碌专业人士，他们在意生鲜质量、广泛组合和可靠配送窗口。在这条流程中，买方、用户和付款方通常都是同一个家庭单位，所以采用更多靠习惯形成驱动，而非正式预算审批。客户往往从试单篮子开始，进入周期性补货；一旦服务质量和替代处理被信任，就提升到更高频使用。


              这也是生鲜如此重要的原因之一。仅靠 pantry 补货不能证明品类迁移；客户需要相信运营商能处理杂货里难的部分，包括易腐品、时效和整篮完整性。Rohlik
              报告的订单量和篮子大小支撑这条叙事。公司不只是在买下载流量，而是在试图进入每周家庭流程。相比即时配送 app，这带来更大的钱包份额机会；但也意味着市场采用依赖持续优秀的运营，而不只是促销支出。
