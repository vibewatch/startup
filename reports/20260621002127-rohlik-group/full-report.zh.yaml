  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Rohlik 面对的不是一个干净的竞争者集合。在本土市场，它既与 Košík
              等直接在线杂货商竞争，也与已搭建数字渠道的既有零售商竞争，还要面对仍占主导的线下门店购物行为。在奥地利和德国，这个组合进一步扩展到全国性杂货商、omnichannel 连锁和相邻便利选项。Picnic
              是最相关的大篮子欧洲同业；Flink 和其他 quick-commerce 运营商离得很近，但解决的是不同客户任务。Ocado 更像技术 benchmark，而不是直接版图匹配。


              这个碎片化格局有战略意义，因为它阻止 Rohlik 只靠单一狭窄功能对比取胜。公司需要在便利和信任上赢过既有玩家，在运营质量上赢过直接同业，在感知易用性上赢过相邻
              app。因此，市场同时从多个角度可被争夺。这有利于品类验证，但也意味着尽调不能因为 Rohlik 已有规模就夸大 moat 强度。竞争场仍然宽且异质。
