      - number: '6.2'
        title: 客户证明与持久性信号
        blocks:
          - type: paragraph
            body: >-
              Rohlik 是 B2C 零售商，所以客户证明不能按企业软件 reference 来读。这里没有可检查的采购式客户 logo 矩阵。最强证据是一组宽口径用户数、app-store
              分发、满意度主张和国家级盈利里程碑。Rohlik、Knuspr 和 Gurkerl 的 Google Play 列表确认核心市场存在活跃消费者分发；公司也反复引用高于 90 的 NPS。这不能完全替代
              cohort 数据，但比简单流量主张更实在。


              最好的持久性证据来自按地区拆分的经济性。捷克业务据称自 2018 年起盈利，匈牙利自 2021 年起盈利，慕尼黑自 2023
              年起盈利。这些里程碑重要，因为它们意味着重复客户行为强到足以长期支撑固定履约和配送基础设施。关于疫情后需求没有明显软化的公开评论，也指向同一方向。不过，证据仍不对称：Rohlik 在满意度和增长上的证据强于
              churn、NRR 或 cohort 存活。投资者可以因此相信客户价值主张是真实的，但不应把公开记录当成已经回答了所有留存问题。合适框架是「足够持久，值得相信；披露不足，仍要追问」。
