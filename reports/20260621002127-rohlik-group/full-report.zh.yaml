  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分群与采用规模
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的客户基础更像有计划的家庭杂货需求，而不是 quick-commerce
              冲动需求。公开证据指向忙碌城市家庭、有孩子家庭和注重健康的购物者，他们重视大篮子、生鲜组合和可靠配送窗口。经济性支持这种解读：平均篮子约 EUR63–64、年消费接近 EUR920、每活跃客户每年 14–15
              单，很难与纯补货或仅便利用例相匹配。奥地利报告的 EUR85 篮子进一步说明，Rohlik 能在富裕城市市场进入更大的每周任务。


              规模现在已有实质意义。集团报告 2023 年活跃客户超过 800,000，2025 年超过 1.2M；订单从 2023 年 11.5M 扩大到 2025 年约每月
              2.1M。这些数字意味着客户增长伴随真实使用，而不只是浅层注册。产品也似乎通过品类深度创造 engagement：生鲜约占销售额 40%，说明客户在易腐、重复购买品类上信任
              Rohlik，而这些品类既有更高情绪权重，也有更频繁复购行为。对投资者来说，结论是 Rohlik 已跳出「食品配送新鲜玩意」桶，建立了高频杂货相关性的证据。剩余尽调问题不是是否存在真实客户，而是最佳
              cohorts 到底多持久、地理上多分散。
