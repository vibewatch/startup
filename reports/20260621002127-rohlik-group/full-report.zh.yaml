      - number: '4.3'
        title: 资本强度、融资依赖与资产负债表含义
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的财务模型与资本强度分不开。公司已承诺向自动化投入超过 €400 million，继续投资履约技术，并用 EIB 支持的 scale-up
              债务补充股权轮。如果管理层相信自动化提高吞吐量、守住服务质量并最终改善单位成本，这样做是理性的。但这也意味着，评判公司应看 return-on-capital 纪律，而不只是 topline 增长。2024 年
              EBRD 领投成长资本、EIB 支持延续到 2026 年，说明成熟机构愿意资助这条 thesis，但并不能取消执行证明的需求。


              德国是这个方程里最大的摆动因素。新地理市场可能多年消耗资本，才能达到成熟密度；公开记录仍把德国描述为战略 buildout，而非已经充分收割的盈利引擎。Veloq
              略微拓宽了融资叙事，因为它在零售业务旁打开了软件和项目融资路径，但如果技术经济性与杂货经济性分叉，也可能让价值捕获更复杂。整体看，资本结构有支持性，但业务仍依赖有纪律的 rollout 和可衡量的 capex
              回收。
