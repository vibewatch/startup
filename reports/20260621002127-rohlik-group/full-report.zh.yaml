      - number: '2.2'
        title: 规模测算视角与真正可服务市场
        blocks:
          - type: paragraph
            body: >-
              对 Rohlik 做可信市场规模测算，至少需要三层。最宽的一层是欧洲杂货总支出，规模巨大但大多无关，因为其中大部分仍在线下，也很难从中心化 e-grocery 运营中服务。第二层是在线杂货，渗透率仍低，但到
              2030 年有可能升至明显更高水平。第三层也是最重要的一层，是 Rohlik 可服务的高密度城市版图：那些履约中心、配送路线、劳动生产率和客户复购意愿能同时对齐的城市家庭。


              公开证据支持公司在德国和更广地区的增长野心，但不支持偷懒式自上而下 TAM 故事。Rohlik 自身轨迹从 2023 年 €700 million 迈向 2025 年约 €1.3
              billion，说明运营跑通时确实有实质需求；但意大利和西班牙历史也提醒投资者，只要时机或经济性踩错，市场机会会反转。实际结论是，SAM 和 SOM
              应被视为受密度约束、逐城爬坡的结果，而不是把抽象杂货支出套上国家级百分比。这个框架没那么会讲故事，但更适合 underwriting。
