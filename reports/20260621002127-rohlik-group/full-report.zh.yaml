      - number: '6.3'
        title: 扩张杠杆与集中风险
        blocks:
          - type: paragraph
            body: >-
              Rohlik 的扩张逻辑不只是增加新城市，而是在不破坏服务质量的前提下，提高客户 lifetime value 并获取相邻 cohorts。Rohlik
              Xtra、自有品牌折扣和获奖自有品牌，为提升现有客户账户内的重复使用、毛利和钱包份额提供了清晰机制。Amazon.de 合作做的是另一件事：在 Berlin 的 Prime 会员中扩大 top-of-funnel
              发现，同时仍依赖 Rohlik 自身运营系统履约。合在一起，这些杠杆说明 Rohlik 正通过产品表面同时进攻留存和获客。


              主要风险是漂亮增长故事中隐藏的集中度。公开证据没有揭示活跃客户、订单或 EBITDA
              中还有多少来自捷克业务；先宣布意大利和西班牙扩张、后来退出这些地区的历史，也提醒投资者并非每个市场都会像布拉格一样表现。来自其他在线杂货商（包括本地既有玩家）的竞争，即便 topline
              需求仍稳，也可能挤压钱包份额和留存。因此，Rohlik 的客户章节以积极但有纪律的基调收尾：服务显然有真实 product-market fit，但投资者仍需要国家级 cohort
              和贡献数据，才能判断整个版图是否同样强。
