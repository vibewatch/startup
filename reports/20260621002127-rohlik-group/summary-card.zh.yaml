  topStrengths:
    - 欧洲大陆唯一已盈利的大型全篮在线杂货商；捷克（2018 年起）、匈牙利（2021 年起）和慕尼黑（2023 年起）均实现 EBITDA 转正。
    - 自研 AI 自动化栈 Veloq 已在五个国家跑通并开始对外授权，技术飞轮把护城河从杂货运营延伸到软件层。
    - EBRD 和 EIB 背书带来可信度、低成本扩张资本和监管验证，纯 VC 支持的竞争对手很难复制。
    - Amazon.de 分销合作（2024 年 11 月）验证技术，也在德国扩大客户触达，且不需要同比例资本开支。
    - 全市场 NPS 超过 90，准时交付率 97%，说明客户忠诚度和复购经济性有韧性。
  topRisks:
    - 德国在集团层面仍亏损，尽管慕尼黑已盈利；€350M+ 投入后集团层面盈亏平衡时间仍不清晰，继续拖累现金。
    - IPO 时间窗口有风险：2027 年目标偏愿景化，取决于盈利进展、欧洲资本市场稳定和竞争位置。
    - €400M+ 自动化投资计划推高资本强度，使公司对杠杆和再融资更敏感。
    - 意大利和西班牙先上线后退出，已暴露国家退出风险；新城市和新地区扩张会反复消耗试错资本开支。
    - 战略、文化和投资者信心集中在创始人兼 CEO Tomáš Čupr 身上。
  unresolvedGaps:
    - 经审计集团层面 EBITDA 和净利润；按国家拆分的 P&L。
    - 精确现金和债务头寸、各市场烧钱速度，以及 EIB / EBRD 融资工具的契约条款。
    - Veloq 客户管线、已签约 ARR，以及 B2B 技术业务的贡献利润率。
    - 详细客户队列数据（留存曲线、按市场和获客渠道拆分的 LTV）。
    - 五个市场达到 IPO 招股书质量的单位经济。
