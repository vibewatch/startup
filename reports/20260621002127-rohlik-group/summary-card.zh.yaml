summary:
  headline: Rohlik 是欧洲最可信的全篮在线杂货商：已经盈利、收入增长 34%，还靠 Veloq 搭技术护城河；但高资本开支、德国亏损和 IPO 十字路口上的私募市场，仍让风险评级维持高位。
