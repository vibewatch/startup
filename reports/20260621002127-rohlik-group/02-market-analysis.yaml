  evidenceGaps:
  - type: missing-source
    severity: material
    topic: city-share
    missingEvidence: City-level online grocery share curves by market and cohort.
    whyItMatters: Precise SAM/SOM sizing depends on actual penetration by dense urban catchment, not just national averages.
    diligencePath: Request internal city cohort dashboards or syndicated market-share data.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: market-zones
    missingEvidence: Contribution margins for outer catchments versus affluent urban cores.
    whyItMatters: This determines whether market size outside prime density zones is economically serviceable.
    diligencePath: Ask management for zone-level order density and margin analysis.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: minor
    topic: market-exits
    missingEvidence: Detailed operating reasons and financial outcomes for the Italy and Spain exits.
    whyItMatters: Those exits are the best adverse test of the expansion thesis.
    diligencePath: Request country post-mortems and closure KPIs from management.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: material
    topic: basket-mix-by-market
    missingEvidence: Basket mix, category mix, and fresh-share differences across Rohlik's active markets.
    whyItMatters: Market-level mix would sharpen which segments and city profiles are truly repeatable across the footprint.
    diligencePath: Request market-level customer cohort and basket-mix dashboards.
    relatedQuestionRefs:
    - QM025
