- id: section-3
  title: Pricing, channels, and distribution power
  body: 'Public competitor comparison is weakest on realized pricing and strongest on distribution structure. Rohlik does not appear to win because it is uniquely cheap in a transparent, always-comparable sense; public sources do not provide enough standardized basket data for that claim. Instead, the more visible edge comes from a better service bundle: broad assortment, reliable slots, fresh execution, and a user experience that encourages higher-frequency basket formation. That means pricing power, where it exists, is likely earned through workflow value rather than through customer lock-in.


    Distribution is therefore critical. The Amazon.de partnership in Berlin is strategically interesting because it broadens customer acquisition and convenience without requiring Rohlik to own an incumbent store estate. But it also proves that the company is willing to borrow distribution from a much larger platform where useful. That is a strength and a dependency at the same time. The core competitive fact remains that grocery customers can multi-home easily, so Rohlik has to defend relevance with every order rather than with hard contractual lock-in.'
  claimRefs:
  - CP006
  - CP015
  - CP021
  - CP024
  - CP026
  - CP030
  - CP031
  - CP034
  tableRefs:
  - TP003
- id: section-4
  title: Moat durability and the main competitive risks
  body: 'The bull case is that Rohlik has built a difficult combination to copy: dense-city logistics, strong consumer service signals, and a technology stack increasingly optimized for grocery-specific fulfillment. The bear case is that grocery remains structurally low-margin, that customers can still split share across channels, and that powerful incumbents or platforms can imitate enough of the experience to compress returns before Rohlik fully amortizes its investment base. Both views are supported by the public record.


    The broader sector reset is a useful warning. Quick-commerce retrenchment showed that speed without robust unit economics is not enough, and Rohlik still has to prove that its more disciplined full-basket strategy results in more durable returns than the companies that stumbled. The central competitive question is therefore not whether Rohlik is differentiated today, but whether that differentiation remains defensible once incumbents improve and once the company needs every new city to clear a higher return threshold. That is why the risk register below focuses on imitation, multi-homing, and capex payback rather than only on headline market share.'
  claimRefs:
