company:
  name: Rohlik Group
chapter:
  number: 3
  title: Competitors
  summary: Rohlik competes across a fragmented field of direct online peers, incumbent grocers, quick-commerce adjacencies, and powerful platforms. Its clearest advantages are operational service quality and automation depth, but moat durability still depends on whether those advantages outrun imitation, multi-homing, and the economics of low-margin grocery competition.
sections:
- id: section-1
  title: 'Landscape: direct peers, incumbents, and substitutes'
  body: 'Rohlik does not face one clean competitor set. In its home markets it competes with direct online grocers such as Košík, with incumbent retailers that have built digital channels, and with the still-dominant behavior of shopping in physical stores. In Austria and Germany, that mix widens further to include national grocers, omnichannel chains, and adjacent convenience options. Picnic is the most relevant large-basket European peer, while Flink and other quick-commerce operators sit nearby but solve a different customer mission. Ocado matters more as a technology benchmark than as a direct footprint match.


    This fragmented landscape is strategically important because it prevents Rohlik from winning through one narrow feature comparison. The company needs to beat incumbents on convenience and trust, direct peers on operational quality, and adjacent apps on perceived ease of use. The market is therefore contestable from several angles at once. That is good for category validation, but it means a diligence process should not overstate moat strength simply because Rohlik has built scale. The competitive field remains broad and heterogeneous.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP007
  - CP008
  - CP025
