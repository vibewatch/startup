  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Private labels + Rohlik Xtra
    - Could over-index to existing loyal cohorts rather than broaden TAM
    - Raises basket quality but may not solve new-market acquisition alone
    - Request adoption and frequency uplift from Xtra members
  - - Amazon.de channel
    - Partner-discovery channel could create dependence in Berlin
    - Good top-of-funnel leverage, but economics need visibility
    - Request conversion, CAC, and repeat behavior of Prime-acquired users
  - - Czech market strength
    - Home market may still dominate profitable behavior
    - Could mask weaker economics elsewhere
    - Request active customers, orders, and EBITDA by country
  - - Italy / Spain expansion history
    - Market rollouts can fail to reach durable scale
    - Shows that customer fit is not automatic in every geography
    - Request post-mortem on exit economics and lessons learned
  - - Local competition
    - Competitors can pressure share of wallet and delivery economics
    - Retention may compress before topline slows
    - Benchmark Rohlik cohorts against local review and price data
  notes: The main unresolved risk is concentration by market and channel, not whether Rohlik has real customers.
