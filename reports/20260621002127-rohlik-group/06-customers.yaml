chapter:
  number: 6
  title: Customers
  summary: Rohlik’s customer story is strong on active-user growth, basket size, repeat frequency, and satisfaction, with indirect durability proof from country profitability milestones. The weakest area is formal disclosure on retention cohorts and market concentration, so the evidence supports a high-quality customer franchise but not a fully closed diligence file.
sections:
- id: segments-and-scale
  title: Customer segments and adoption scale
  body: >-
    Rohlik’s customer base looks more like planned household grocery demand than quick-commerce impulse demand. Public evidence points to busy urban households, families, and health-conscious shoppers who value a broad basket, fresh assortment, and reliable delivery windows. The economics back that reading: average baskets of about EUR63-64, annual spend near EUR920, and 14-15 orders per active customer per year are hard to reconcile with a pure top-up or convenience-only use case. Austria’s reported EUR85 basket strengthens the idea that Rohlik can move into larger weekly missions in affluent urban markets.


    Scale is now meaningful. The group reported more than 800,000 active customers in 2023 and more than 1.2M by 2025, while orders expanded from 11.5M in 2023 toward roughly 2.1M per month by 2025. Those figures imply that customer growth has been accompanied by real usage, not just shallow sign-ups. The product also appears to create engagement through category depth: fresh produce at around 40% of sales suggests customers trust Rohlik for perishable, repeat-purchase categories that carry both higher emotional stakes and more frequent reorder behavior. For investors, the conclusion is that Rohlik has escaped the “food delivery novelty” bucket and built evidence of recurring grocery relevance. The remaining diligence question is not whether real customers exist, but how durable and geographically diversified the best cohorts actually are.
