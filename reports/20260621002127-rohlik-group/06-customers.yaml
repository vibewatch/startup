  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, and cohort-retention data by market and customer archetype.
    whyItMatters: High NPS and repeat-frequency claims are directionally positive but do not fully quantify durability or willingness to pay.
    diligencePath: Request cohort dashboards and market-level customer-retention tables from management.
    relatedQuestionRefs:
    - QU020
    - QU025
  - type: private-evidence-only
    severity: material
    topic: market-concentration
    missingEvidence: Share of active customers, orders, and EBITDA by geography, especially Czechia versus Germany and Austria.
    whyItMatters: A broad customer story can still mask concentration if most profitable behavior sits in one market.
