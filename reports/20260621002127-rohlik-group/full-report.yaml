  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Rohlik’s risk stack is unusually concentrated around a few linked issues. First, the business has
              committed more than EUR400M to automation, which raises the stakes on utilization, throughput, and
              execution discipline. Second, Germany remains the largest growth opportunity but also the clearest drag on
              group economics after heavy investment. Third, any future IPO path depends not only on growth but also on
              public-market appetite for grocery technology stories after a multi-year reset in comparable valuations.
              None of these risks means the model is broken; together, however, they mean the underwriting case is
              sensitive to a smaller number of variables than topline growth alone might suggest.


              The good news is that some mitigation is visible. Country profitability milestones in Czechia, Hungary,
              and Munich show the model can work once density and operations align. But those wins do not remove the
              need for discipline in Germany, where further scaling still has to justify large historical investment.
              Investors should therefore frame Rohlik as a company with improving operating proof but limited room for
              strategic drift. A business carrying this much capex and market-expansion ambition cannot afford too many
              misses at once: one soft market could be manageable, one slower geography could be manageable, one
              valuation reset could be manageable, but several of those happening together would reshape the entire
              investment case.
