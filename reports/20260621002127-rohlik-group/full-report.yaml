  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and current price context
        blocks:
          - type: paragraph
            body: >-
              Rohlik is no longer a speculative grocery startup that needs heroic imagination just to justify relevance.
              Public revenue climbed from about EUR700M in 2023 to EUR1.114B in 2024 and roughly EUR1.3B in preliminary
              2025 reporting, while customer and order metrics kept expanding. At the same time, external materials
              place the current valuation context above EUR2B. On a simple revenue lens, that implies a multiple of
              roughly 1.5x. For a company with real scale, improving profitability, and an increasingly explicit
              technology platform narrative, that is not an outrageous number.


              But “not outrageous” is not the same as “compelling entry.” Rohlik still needs Germany to mature, Veloq to
              prove standalone monetization, and financing terms to become clearer. The current evidence therefore
              supports a disciplined track recommendation rather than a buy. Investors can believe the company is high
              quality and still insist on price sensitivity. Confidence should be medium: there is plenty of public
              proof on growth and strategic progress, but much less on the preference stack, country-level economics,
              and how much software premium Veloq truly deserves today. In practical terms, Rohlik looks fairly valued
              for what is known, with upside if execution keeps tightening and downside if grocery-tech multiples or
              German economics disappoint.
            claimRefs:
              - CV001
