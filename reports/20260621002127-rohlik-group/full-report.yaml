    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a wide but bounded range in which the current mark is closer to fair than to obviously
      attractive.
    data:
      items:
        - label: Traditional-grocer downside lens
          low: 250
          mid: 400
          high: 550
          detail: 0.2x-0.4x on roughly EUR1.3B revenue, expressed in EUR millions
        - label: Bear case
          low: 1000
          mid: 1250
          high: 1500
          detail: Growth slows and Germany remains a drag
        - label: Base case
          low: 2200
          mid: 2600
          high: 3000
          detail: Current mark plus moderate execution progress
        - label: Bull case
          low: 4100
          mid: 4750
          high: 5400
          detail: Germany de-risks and Veloq earns premium treatment
    approximationNotes: Values are supportable-value guardrails in EUR millions, not claimed financing outcomes.
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV026
      - CV027
      - CV028
      - CV029
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Rohlik scores well on scale and strategic optionality, but only moderately on valuation transparency and
      governance visibility.
    data:
      items:
        - label: Scale proof
          value: 8.5
          detail: Revenue, customers, and orders are already meaningful
        - label: Profitability trajectory
          value: 7
          detail: Country-level proof exists but group-level finish line is incomplete
        - label: Platform optionality
          value: 7.5
          detail: Veloq improves the story but needs standalone economics
        - label: Valuation transparency
          value: 4
          detail: Current price context exists, but full financing terms do not
        - label: Governance visibility
          value: 3.5
          detail: Registry evidence is useful but limited for underwriting
    claimRefs:
