      - number: '3.2'
        title: Capability differentiation and what Rohlik does better
        blocks:
          - type: paragraph
            body: >-
              Rohlik's clearest public differentiation is operational rather than purely brand-led. The company
              positions itself around full-basket assortment, fresh-food credibility, and consistent service quality.
              Public summaries repeatedly cite NPS above 90 and on-time delivery around 97%, which are meaningful
              signals in grocery because switching costs are modest and poor execution is punished quickly. More
              importantly, Rohlik has committed heavily to automation. AutoStore infrastructure, Swisslog-related
              integrations, and Brightpick robotics all suggest a fulfillment system that many local grocery incumbents
              cannot replicate quickly without their own step-up in capex.


              The Veloq spinout adds a second layer to the capability story. It suggests Rohlik may not only operate
              differentiated software internally but could eventually externalize some of that tooling into a platform
              advantage. That does not turn the company into a pure technology licensor, but it does strengthen the case
              that Rohlik's moat may widen through internal productivity gains before it widens through formal network
              effects. The key underwriting question is whether those capability investments compound faster than
              competitors can imitate the visible customer-facing features.
