      - number: '2.4'
        title: Growth drivers, constraints, and what can break the thesis
        blocks:
          - type: paragraph
            body: >-
              The most important positive driver is convenience compounded by trust. If a household can reliably replace
              store trips with a broad, fresh, and on-time online basket, repeat usage can be structurally attractive.
              Automation strengthens that by widening picking capacity and potentially improving labor productivity,
              which is why Rohlik and its backers keep funding fulfillment technology. Institutional support from both
              equity investors and EIB-related financing suggests outside capital still believes the category has room
              to mature.


              The key constraint is that grocery is unforgiving. Margins are thinner than in software, capital needs are
              heavier, and every new city requires local execution rather than simple digital distribution. Incumbent
              grocers have stores, buyer scale, and omnichannel options; quick-commerce startups can still pressure
              customer expectations around speed; and expansion mistakes are costly, as the earlier Italy and Spain
              story implies. The market analysis is therefore constructive but conditional. Rohlik is attacking a large
              and still-underpenetrated category, yet the winners will be the operators that can translate density and
              automation into durable economics, not merely the ones with the broadest market narrative.
            claimRefs:
