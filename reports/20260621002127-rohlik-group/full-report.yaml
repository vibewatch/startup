      - number: '2.2'
        title: Sizing lenses and where the market is really serviceable
        blocks:
          - type: paragraph
            body: >-
              A credible market-sizing view for Rohlik needs at least three layers. The broadest layer is total grocery
              spend in Europe, which is huge but mostly irrelevant because most of it remains offline and structurally
              hard to serve from centralized e-grocery operations. The second layer is online grocery, where penetration
              is still low but plausibly rising toward materially higher levels by 2030. The third and most important
              layer is Rohlik’s serviceable dense-city footprint: households in urban areas where fulfillment centers,
              delivery routes, labor productivity, and customer willingness to reorder can all line up.


              Public evidence supports the company’s growth ambition in Germany and the broader region, but it does not
              support a lazy top-down TAM story. Rohlik’s own trajectory from €700 million in 2023 toward roughly €1.3
              billion in 2025 shows there is meaningful demand when operations work, yet the Italy and Spain history
              reminds investors that market opportunity is reversible if timing or economics misfire. The practical
              conclusion is that SAM and SOM should be treated as density-constrained, city-by-city ramps rather than as
              country-level percentages applied to abstract grocery spend. That framing is less promotional but much
              more useful for underwriting.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM015
              - CM016
              - CM017
              - CM031
              - CM033
