  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Rohlik does not face one clean competitor set. In its home markets it competes with direct online grocers
              such as Košík, with incumbent retailers that have built digital channels, and with the still-dominant
              behavior of shopping in physical stores. In Austria and Germany, that mix widens further to include
              national grocers, omnichannel chains, and adjacent convenience options. Picnic is the most relevant
              large-basket European peer, while Flink and other quick-commerce operators sit nearby but solve a
              different customer mission. Ocado matters more as a technology benchmark than as a direct footprint match.


              This fragmented landscape is strategically important because it prevents Rohlik from winning through one
              narrow feature comparison. The company needs to beat incumbents on convenience and trust, direct peers on
              operational quality, and adjacent apps on perceived ease of use. The market is therefore contestable from
              several angles at once. That is good for category validation, but it means a diligence process should not
              overstate moat strength simply because Rohlik has built scale. The competitive field remains broad and
              heterogeneous.
            claimRefs:
