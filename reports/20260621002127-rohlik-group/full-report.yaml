      - number: '1.2'
        title: Leadership bench and governance maturity
        blocks:
          - type: paragraph
            body: >-
              Leadership remains founder-led, but the bench has become materially more institutional over the last two
              years. Tomáš Čupr still anchors strategy and capital formation as founder and CEO, while Vineta Bajaj was
              brought in from Ocado and large-company finance roles to professionalize capital planning. Rohlik then
              added Erwin Brunner on operations and David Pavlík on technology, both with pedigrees from scaled global
              platforms. Mark Hübner’s appointment over the German and Austrian businesses also indicates that Rohlik
              now treats market-level execution as an executive discipline rather than an entrepreneurial side
              assignment.


              Governance indicators are still lighter than what a public-market investor would want, but the business is
              no longer operating like a founder-only startup. The company publishes a culture code, whistleblowing
              channel, and recruiting doctrine, which is meaningful because grocery execution depends on repeatable
              frontline behavior and supplier trust. Even so, key-person dependence remains a real diligence item.
              Strategy, investor signaling, and brand identity still center on Čupr, and the public source set does not
              provide a similarly detailed picture of board rights or internal committee structure. The result is a
              company with improved managerial depth but still concentrated authority.
            claimRefs:
