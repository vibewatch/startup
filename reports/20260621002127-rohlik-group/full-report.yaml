      - number: '7.3'
        title: Financing, competition, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public record suggests Rohlik can keep raising money, but that is not the same as saying financing
              risk is gone. TechCrunch’s 2022 framing around a cooling market, the continuing need to support Germany,
              and the presence of EIB financing all show that the business still lives partly inside capital-market
              conditions. If public-market or late-stage private comparables compress further, the group could find
              itself carrying strong growth and improving operations but a less forgiving funding environment. Ocado’s
              de-rating is the clearest adverse comp for that possibility: being “tech-enabled” does not guarantee a
              premium multiple forever.


              Competition and ambition raise the bar further. Picnic and Flink show that specialized online-grocery or
              convenience models can keep pressuring local market economics, while the EUR10B by 2030 aspiration demands
              sustained multi-country execution. Investors should therefore watch a small number of thesis-break signals
              closely: Germany failing to reach durable profitability, new capital needs emerging before group
              self-funding is proven, or a major regulatory/service event damaging trust in a core market. If those
              triggers stay quiet, Rohlik’s risk profile can continue improving. If two or more start firing together,
              the business could shift quickly from “scaling with optionality” to “growing into its constraints.”
