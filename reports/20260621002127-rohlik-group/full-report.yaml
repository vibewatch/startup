      - number: '1.4'
        title: Technology milestones, chronology, and adverse context
        blocks:
          - type: paragraph
            body: >-
              Rohlik’s identity is inseparable from warehouse automation and fulfillment software. Official materials
              describe a stack built on AutoStore systems, Swisslog integrations, and Brightpick robots, and the company
              has committed more than €400 million to automation over the 2021-2025 period. The 2025 Veloq spinout
              sharpens that narrative further by turning internal grocery technology into a standalone platform with its
              own external financing path. That move expands strategic optionality, but it also underlines how much of
              Rohlik’s differentiation depends on sustained capital deployment into operational infrastructure.


              The milestone record also needs to preserve the less flattering facts. Italy and Spain no longer sit in
              the active footprint, Germany is still scaling toward full profitability despite local progress in Munich,
              and the 2027 IPO date is best treated as a management aspiration rather than a committed timetable. These
              are not side notes. They define execution risk, because the same company that has produced strong revenue
              growth also has to prove that automation spending, geographic expansion, and platform spinouts convert
              into durable returns on capital. The chronology below should therefore serve as the canonical source for
              both success markers and caution flags in later chapters.
