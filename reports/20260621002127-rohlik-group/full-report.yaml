  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from scale proof and platform optionality into a fair-but-not-cheap valuation stance
      because disclosure gaps still matter.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: EUR1.3B 2025 revenue and 1.2M+ active customers
          tone: positive
        - id: platform
          label: Platform option
          detail: Veloq and automation support some premium narrative
          tone: positive
        - id: risk
          label: Execution risk
          detail: Germany, capex, and disclosure gaps remain material
          tone: warning
        - id: price
          label: Current price context
          detail: Above EUR2B implies roughly 1.5x revenue
          tone: neutral
        - id: call
          label: Track / fair
          detail: Good company, but conviction buy needs more diligence
          tone: warning
      edges:
        - from: scale
          to: price
        - from: platform
          to: price
        - from: risk
          to: call
        - from: price
          to: call
