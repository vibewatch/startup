  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category structure
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Rohlik is narrower than “all food commerce” and broader than “instant
              grocery delivery.” The company operates in full-basket online grocery: a planned household purchasing
              workflow that competes primarily with traditional supermarket shopping, secondarily with incumbent
              retailer delivery services, and only partially with ultrafast convenience apps. That distinction matters
              because the economics of a weekly family basket differ sharply from the economics of a ten-minute top-up
              order. Basket size, fresh-food reliability, and route density are essential inputs to market
              attractiveness, whereas pure app installs or one-off order counts are less informative.


              Market structure across Europe remains early. McKinsey still describes online penetration below 10% in
              much of the region, which means the offline supermarket remains the real incumbent substitute. At the same
              time, the same research points to a much higher possible online share by 2030, suggesting that market
              growth can be substantial if operators solve trust, density, and fulfillment cost. For diligence, the
              useful framing is therefore not “does online grocery exist?” but “which subsegment of grocery can
              economically migrate online, in which cities, and under which service promise?” Rohlik’s full-basket
              positioning puts it in the subsegment with the biggest long-run revenue potential, but also with the
              heaviest execution burden.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM032
