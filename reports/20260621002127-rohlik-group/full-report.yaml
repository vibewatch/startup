      - number: '3.4'
        title: Moat durability and the main competitive risks
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Rohlik has built a difficult combination to copy: dense-city logistics, strong
              consumer service signals, and a technology stack increasingly optimized for grocery-specific fulfillment.
              The bear case is that grocery remains structurally low-margin, that customers can still split share across
              channels, and that powerful incumbents or platforms can imitate enough of the experience to compress
              returns before Rohlik fully amortizes its investment base. Both views are supported by the public record.


              The broader sector reset is a useful warning. Quick-commerce retrenchment showed that speed without robust
              unit economics is not enough, and Rohlik still has to prove that its more disciplined full-basket strategy
              results in more durable returns than the companies that stumbled. The central competitive question is
              therefore not whether Rohlik is differentiated today, but whether that differentiation remains defensible
              once incumbents improve and once the company needs every new city to clear a higher return threshold. That
              is why the risk register below focuses on imitation, multi-homing, and capex payback rather than only on
              headline market share.
