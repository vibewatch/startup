  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Germany fails to become durably accretive
        - Another 12-18 months of scale without clear profitability bridge
        - Removes the operating leverage needed for premium narrative
        - Downgrade stance toward stretched or expensive
      - - Veloq remains internal-only economics
        - No external customer or segment evidence emerges
        - Cuts the software premium from the valuation story
        - Re-rate closer to retail comparables
      - - Cap-table terms prove investor-unfriendly
        - Heavy preferences, ratchets, or rights impair new-money economics
        - Headline EUR2B value becomes less relevant to return math
        - Pause or avoid depending on severity
      - - Public comparables compress further
        - Ocado / Instacart / grocery peers de-rate materially
        - Lowers acceptable entry multiple even if Rohlik executes well
        - Raise required return and lower acceptable price
    notes: These triggers are tied directly to valuation logic, not only to general business risk.
    claimRefs:
      - CV019
      - CV024
      - CV028
      - CV035
      - CV040
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Cap table and preferences
        - Liquidation stack, ratchets, protective provisions
        - Determines real return to new money
        - Counsel and financing room review
      - - Germany profitability bridge
        - Country EBITDA, fulfilment utilization, and order economics
        - Key variable in upside and downside cases
        - Country P&L and FC dashboard review
      - - Veloq standalone economics
        - Revenue, margin, and external customer pipeline
        - Determines whether software premium is justified
        - Product / finance diligence with segment data
      - - Governance rights
        - Board rights, shareholder protections, IPO path changes
        - Affects liquidity and downside protection
        - Legal diligence and governance memo
      - - Margin conversion
        - Gross-to-EBITDA bridge by country
        - Needed to move from fair to attractive
        - Finance diligence pack
    notes: These asks are intentionally narrow and investment-critical; each could move the recommendation materially.
    claimRefs:
      - CV034
      - CV036
      - CV040
      - CV041
