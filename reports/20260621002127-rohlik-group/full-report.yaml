    title: Scenario analysis
    type: range
    layout: standard
    summary: >-
      Downside risk is driven less by demand collapse than by how quickly Germany, financing, and multiples move
      together.
    data:
      items:
        - label: Bull operating risk case
          low: 2
          mid: 3
          high: 4
          detail: Germany improves, capex utilization rises, financing window stays open
        - label: Base operating risk case
          low: 4
          mid: 5
          high: 6
          detail: Mixed execution but no major shock
        - label: Bear operating risk case
          low: 7
          mid: 8
          high: 10
          detail: Germany lags, new capital is needed, and comparables compress further
        - label: Regulatory event severity
          low: 3
          mid: 5
          high: 8
