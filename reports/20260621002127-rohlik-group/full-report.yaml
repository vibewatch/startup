companyProfile:
  summary: >-
    Rohlik Group is a Prague-based, founder-led European online grocery leader founded in 2014 by Tomáš Čupr. The
    company operates full-basket grocery delivery under five consumer brands across Czech Republic, Hungary, Austria,
    Germany, and Romania, delivering 17,000–24,000 SKUs within 60–180 minutes using proprietary AI-powered, highly
    automated fulfillment centers. With €1.114 billion in audited 2024 revenue, 34% year-on-year growth, and EBITDA
    profitability in its two largest markets, Rohlik has become the only profitable large-scale online grocer in
    continental Europe. In June 2025 it spun out Veloq, a standalone AI-native grocery fulfillment platform, and is
    targeting an IPO in 2027.
  foundedDate: '2014-01-01'
  founders:
    - name: Tomáš Čupr
      role: Founder and Chief Executive Officer
      background: >-
        Serial Czech entrepreneur; built Rohlik from a Prague startup into a continental European unicorn; retains
        active operating and strategic control.
      claimRefs:
        - CO001
        - CO002
  foundingLocation: Prague, Czech Republic
  headquarters: Prague, Czech Republic
  productSummary: >-
    Same-day full-basket grocery delivery with 17,000–24,000 products (branded, private-label, and local/farm-direct),
    60-minute delivery windows, 15-minute scheduling slots, and coverage of fresh, chilled, frozen, ambient, pharmacy,
    drugstore, and pet categories. The Veloq spin-out offers the same AI fulfillment platform (automation, last-mile
    routing, eCommerce) to third-party retailers globally.
  customerFocus: >-
    Urban and suburban European households seeking full-basket convenience, high-quality fresh produce, and reliable
    rapid delivery; premium and mainstream segments in major metropolitan areas.
  businessModel: >-
    Direct-to-consumer online grocery retailing with revenue from product sales (gross margin on food and non-food);
    ancillary revenue from retail media, premium delivery subscriptions (Rohlik Xtra loyalty program), and private-label
    margin; Veloq adds a B2B technology licensing and services revenue stream.
