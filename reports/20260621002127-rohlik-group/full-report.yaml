      - number: '3.3'
        title: Pricing, channels, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public competitor comparison is weakest on realized pricing and strongest on distribution structure.
              Rohlik does not appear to win because it is uniquely cheap in a transparent, always-comparable sense;
              public sources do not provide enough standardized basket data for that claim. Instead, the more visible
              edge comes from a better service bundle: broad assortment, reliable slots, fresh execution, and a user
              experience that encourages higher-frequency basket formation. That means pricing power, where it exists,
              is likely earned through workflow value rather than through customer lock-in.


              Distribution is therefore critical. The Amazon.de partnership in Berlin is strategically interesting
              because it broadens customer acquisition and convenience without requiring Rohlik to own an incumbent
              store estate. But it also proves that the company is willing to borrow distribution from a much larger
              platform where useful. That is a strength and a dependency at the same time. The core competitive fact
              remains that grocery customers can multi-home easily, so Rohlik has to defend relevance with every order
              rather than with hard contractual lock-in.
            claimRefs:
