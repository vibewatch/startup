            body: >-
              Because Rohlik is a B2C retailer, customer proof has to be interpreted differently from enterprise
              software references. There is no procurement-style customer-logo matrix to inspect. Instead, the strongest
              evidence is a mix of broad user numbers, app-store distribution, satisfaction claims, and country-level
              profitability milestones. Google Play listings for Rohlik, Knuspr, and Gurkerl confirm active consumer
              distribution across core markets, and the company repeatedly cites NPS above 90. That is not a full
              substitute for cohort data, but it is more tangible than a simple traffic claim.


              The best durability evidence comes from economics by geography. Czech operations have reportedly been
              profitable since 2018, Hungary since 2021, and Munich since 2023. Those milestones matter because they
              imply repeat customer behavior has been strong enough to support fixed fulfilment and delivery
              infrastructure over time. Public commentary that post-pandemic demand did not materially soften points in
              the same direction. Still, the evidence remains asymmetric: Rohlik is stronger on satisfaction and growth
              than on churn, NRR, or cohort survival. Investors can therefore take comfort that the customer proposition
              is real, but should avoid treating the public record as if it already answered every retention question.
              The right framing is “durable enough to believe, not disclosed enough to stop asking questions.”
