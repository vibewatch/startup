      - number: '6.3'
        title: Expansion levers and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Rohlik’s expansion logic is not just about adding new cities; it is about increasing customer lifetime
              value and acquiring adjacent cohorts without breaking service quality. Rohlik Xtra, private-label
              discounts, and award-winning own brands create a clear mechanism for boosting repeat usage, margin, and
              wallet share inside existing customer accounts. The Amazon.de partnership does something different: it
              widens top-of-funnel discovery among Prime members in Berlin while still relying on Rohlik’s own operating
              system to fulfil the order. Together, those levers show that Rohlik is attacking both retention and
              acquisition through the product surface.


              The main risk is concentration hidden inside an attractive growth story. Public evidence does not reveal
              how much of active customers, orders, or EBITDA still comes from the Czech business, and the history of
              announcing Italy and Spain expansion before later exiting those geographies is a reminder that not every
              market will behave like Prague. Competition from other online grocers, including local incumbents, can
              also pressure share of wallet and retention even if topline demand remains solid. As a result, Rohlik’s
              customer chapter ends on a positive but disciplined note: the service clearly has real product-market fit,
              but investors still need country-level cohort and contribution data before concluding that the whole
              footprint is equally strong.
