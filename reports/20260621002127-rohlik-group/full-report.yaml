      - number: '1.3'
        title: Scale, funding, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Rohlik’s public scale indicators now place it well beyond startup novelty and firmly in late-stage
              operating-company territory. Revenue moved from roughly €300 million in 2020 to €490 million by the year
              ending April 2022, €700 million in 2023, and more than €1.1 billion in 2024 according to partner
              reporting, with preliminary 2025 figures around €1.3 billion. Customer count, orders, and average order
              value all point in the same direction: this is already a large recurring household commerce platform
              rather than an early market test.


              Capital formation has followed that trajectory. The company raised a €190 million Series B in March 2021,
              a €100 million Series C a few months later at unicorn status, a €220 million Series D in 2022, and then a
              2024 growth round led by EBRD rather than Partech. Public sources also point to cumulative equity raised
              of roughly €780 million-plus and a valuation north of €2 billion. That capital stack is strategically
              important because Rohlik is not financing software R&D alone; it is financing automation, market entry,
              and working-capital heavy grocery operations. Stakeholders therefore matter not only as passive owners,
              but as providers of patience, debt capacity, and follow-on credibility.
