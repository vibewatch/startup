  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue scale and what public traction actually proves
        blocks:
          - type: paragraph
            body: >-
              Rohlik now has enough revenue history to support a real financial narrative, even if not a fully
              underwritable one. Public evidence points to roughly €300 million of revenue in 2020, about €490 million
              by the year ending April 2022, €700 million in 2023, €1.114 billion in 2024, and preliminary 2025 revenue
              around €1.3 billion. That curve matters because it is corroborated across official releases, analyst-style
              summaries, and partner commentary. It shows that Rohlik is not merely a category concept; it is already a
              scaled grocery operator with repeat household demand.


              The same public record also says something about revenue quality. Customer count, order volume, average
              order value, and order frequency line up reasonably well with the reported sales trajectory. AOV around
              €63-64, roughly 14-15 annual orders per customer, and a customer base at roughly 1.2 million create a
              coherent revenue engine at the billion-euro level. That does not replace audited disclosure, but it does
              make the top-line story internally plausible. The key caveat is that public evidence is far richer on
              sales scale than on accounting detail, so later judgment should rely on directional confidence rather than
              on precision that the sources do not actually provide.
