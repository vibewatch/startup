chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating model
        blocks:
          - type: paragraph
            body: >-
              Rohlik Group is best understood as a full-basket online grocer built around dense urban catchments rather
              than a broad, low-touch marketplace. The company was founded in Prague in 2014 by Tomáš Čupr, and official
              materials plus independent reporting consistently place the business in five active markets today: the
              Czech Republic, Hungary, Austria, Germany, and Romania. That matters because the company has already
              tested the boundaries of expansion. Italy and Spain were part of the Sezamo growth story, but they are not
              in the current active footprint, so the present operating map is narrower and more disciplined than the
              earlier pan-European narrative suggested.


              The operating model also differs from the instant-delivery cohort that dominated 2021 headlines. Rohlik
              emphasizes weekly grocery missions, fresh assortment, and recurring household convenience. Public
              summaries place assortment between roughly 17,000 and 24,000 products, with fresh produce around 40% of
              sales, which signals that the company is not merely selling pantry top-ups. The analytical consequence is
              that later chapters should treat Rohlik as a logistics-heavy retailer with software-enabled operations,
              not as a pure demand-aggregation app. Density, cold-chain execution, and supplier quality therefore matter
              as much as consumer brand or app growth.
