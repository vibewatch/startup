company:
  name: Rohlik Group
chapter:
  number: 1
  title: Company Overview
  summary: Rohlik Group is a founder-led Central European online grocer that has scaled to over €1 billion in revenue by combining dense-city fulfillment, automation investment, and repeated external financing. The same record also shows expansion reversals, ongoing capital intensity, and an IPO timeline that remains aspirational rather than locked.
sections:
- id: section-1
  title: Identity, footprint, and operating model
  body: 'Rohlik Group is best understood as a full-basket online grocer built around dense urban catchments rather than a broad, low-touch marketplace. The company was founded in Prague in 2014 by Tomáš Čupr, and official materials plus independent reporting consistently place the business in five active markets today: the Czech Republic, Hungary, Austria, Germany, and Romania. That matters because the company has already tested the boundaries of expansion. Italy and Spain were part of the Sezamo growth story, but they are not in the current active footprint, so the present operating map is narrower and more disciplined than the earlier pan-European narrative suggested.


    The operating model also differs from the instant-delivery cohort that dominated 2021 headlines. Rohlik emphasizes weekly grocery missions, fresh assortment, and recurring household convenience. Public summaries place assortment between roughly 17,000 and 24,000 products, with fresh produce around 40% of sales, which signals that the company is not merely selling pantry top-ups. The analytical consequence is that later chapters should treat Rohlik as a logistics-heavy retailer with software-enabled operations, not as a pure demand-aggregation app. Density, cold-chain execution, and supplier quality therefore matter as much as consumer brand or app growth.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: section-2
  title: Leadership bench and governance maturity
  body: 'Leadership remains founder-led, but the bench has become materially more institutional over the last two years. Tomáš Čupr still anchors strategy and capital formation as founder and CEO, while Vineta Bajaj was brought in from Ocado and large-company finance roles to professionalize capital planning. Rohlik then added Erwin Brunner on operations and David Pavlík on technology, both with pedigrees from scaled global platforms. Mark Hübner’s appointment over the German and Austrian businesses also indicates that Rohlik now treats market-level execution as an executive discipline rather than an entrepreneurial side assignment.


    Governance indicators are still lighter than what a public-market investor would want, but the business is no longer operating like a founder-only startup. The company publishes a culture code, whistleblowing channel, and recruiting doctrine, which is meaningful because grocery execution depends on repeatable frontline behavior and supplier trust. Even so, key-person dependence remains a real diligence item. Strategy, investor signaling, and brand identity still center on Čupr, and the public source set does not provide a similarly detailed picture of board rights or internal committee structure. The result is a company with improved managerial depth but still concentrated authority.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO037
  - CO038
  tableRefs:
  - TO002
- id: section-3
  title: Scale, funding, and stakeholder structure
  body: 'Rohlik’s public scale indicators now place it well beyond startup novelty and firmly in late-stage operating-company territory. Revenue moved from roughly €300 million in 2020 to €490 million by the year ending April 2022, €700 million in 2023, and more than €1.1 billion in 2024 according to partner reporting, with preliminary 2025 figures around €1.3 billion. Customer count, orders, and average order value all point in the same direction: this is already a large recurring household commerce platform rather than an early market test.


    Capital formation has followed that trajectory. The company raised a €190 million Series B in March 2021, a €100 million Series C a few months later at unicorn status, a €220 million Series D in 2022, and then a 2024 growth round led by EBRD rather than Partech. Public sources also point to cumulative equity raised of roughly €780 million-plus and a valuation north of €2 billion. That capital stack is strategically important because Rohlik is not financing software R&D alone; it is financing automation, market entry, and working-capital heavy grocery operations. Stakeholders therefore matter not only as passive owners, but as providers of patience, debt capacity, and follow-on credibility.'
  claimRefs:
  - CO012
