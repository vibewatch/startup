  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-compliance
    missingEvidence: Downloadable trust-portal materials such as certifications, penetration-test summaries, DPA terms, or privacy-control mappings for Rohlik and Veloq.
    whyItMatters: Service metrics alone are not enough to underwrite technology risk for a multi-country grocery platform handling customer data and payments.
    diligencePath: Request buyer diligence materials, privacy documentation, and any ISO/SOC evidence from management.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: partner-dependence
    missingEvidence: Architecture split showing which planning, picking, and routing layers are Rohlik-built versus vendor-managed.
    whyItMatters: It determines whether Veloq’s external monetization is based on defensible software IP or mainly on orchestrating third-party hardware.
    diligencePath: Ask management for module ownership maps, vendor contracts, and economics by in-house versus partner layer.
    relatedQuestionRefs:
    - QE024
  - type: stale
    severity: minor
    topic: trust-disclosure
    missingEvidence: Current uptime history, incident logs, and data-governance disclosures beyond the retained announcement pack.
    whyItMatters: Public product and financing pages may lag the latest operational or compliance posture.
    diligencePath: Refresh trust pages and status disclosures directly before any investment committee decision.
    relatedQuestionRefs:
    - QE022
