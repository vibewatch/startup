- id: architecture-automation
  title: Architecture, automation, and scaling logic
  body: >-
    The most differentiated part of Rohlik’s technology story is the extent to which physical automation and software orchestration are treated as one architecture. Munich is the clearest public proof point: Rohlik disclosed a 28,000-bin AutoStore system with 96 robots, 12 carousel ports, a 200-meter conveyor, and around 2,500 orders per hour of capacity. The company also attributed a 3x picking-productivity gain and 30% more storage to that installation. These are not vanity metrics; they show that Rohlik has publicly demonstrated throughput improvements in a real operating site.


    The broader footprint matters just as much as the flagship installation. Prague and Vienna were described as Swisslog-backed sites, Hamburg as an Element Logic deployment, and Brightpick robots moved from Prague pilot to Munich, Frankfurt, Vienna, and Prague rollout. Brightpick’s own materials reinforce that Rohlik is testing automation beyond storage retrieval by covering picking and consolidation across ambient, chilled, and frozen zones. That supports the view that Rohlik’s operating stack is modular: local apps feed demand into site-specific automation layers, then back into last-mile software and customer service metrics. It also explains why Veloq can plausibly be positioned as exportable software rather than only internal tooling. The architecture is not clean-room proprietary end to end, but it is coherent enough to be differentiated if Rohlik continues to own the orchestration layer.
