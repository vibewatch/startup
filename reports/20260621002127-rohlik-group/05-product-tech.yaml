- id: differentiation-readiness
  title: Differentiation, readiness, and monetizable platform potential
  body: >-
    Rohlik’s strongest product-tech differentiation is not any single robot or app feature; it is the combination of grocery-native software, automation capex, and measurable service outcomes operating across five countries. Veloq sharpens that argument because it names the layers that management believes are transferable: Fulfillment, Last Mile, and eCommerce. The EIB financing and external coverage also suggest that third parties see Veloq as a platform asset with enough maturity to support expansion beyond the group’s own retail footprint. That is strategically important because it creates an upside path where Rohlik is valued partly as a technology provider, not only as an online grocer.


    Even so, the public record still points to a mixed readiness picture. Rohlik discloses impressive NPS, on-time, and error-free metrics, but it does not disclose the buyer-grade security or privacy package that many platform underwriters would expect. The Android app surface proves that localized software products exist, yet it does not resolve how much of the moat sits in proprietary software versus partner hardware and integration know-how. Investors should therefore read Rohlik as a highly operationally credible tech stack with real externalization potential, but not as a fully transparent software platform yet. The next diligence step is to separate what Veloq truly owns from what it coordinates, and to test whether current service metrics persist as automation density rises in Germany and Austria.
