chapter:
  number: 5
  title: Product & Technology
  summary: Rohlik has moved beyond a retailer app into a grocery-native operating stack that combines localized storefronts, automated fulfilment, and the Veloq software platform. The strongest public proof is around warehouse automation, service metrics, and multi-country throughput; the weakest area is formal disclosure on security, privacy, and exact software-versus-partner IP boundaries.
sections:
- id: product-surface
  title: Product surface and workflow
  body: >-
    Rohlik’s product is best understood as a full-stack grocery workflow rather than as a single shopping app. The customer-facing surface starts with local storefronts such as rohlik.cz, kifli.hu, gurkerl.at, knuspr.de, and sezamo.ro, but the real product promise is the combination of slot accuracy, high-frequency repeat shopping, and fresh-heavy baskets. Public materials tie that promise to an integrated operating loop: browse a broad assortment, commit to a narrow delivery window, route orders into automated fulfilment, consolidate across temperature zones, and deliver with high service reliability.


    This matters because Rohlik’s economics and technical design are shaped by repeat household demand, not by occasional convenience orders. Average baskets around EUR63-64, 14-15 orders per customer per year, and a fresh-produce mix near 40% imply a workflow optimized for weekly family shopping where quality failures are expensive and highly visible. In that context, fulfilment software, robotics, and routing logic are part of the product itself. Rohlik’s software also extends beyond the core grocery transaction: private labels, Rohlik Xtra discounts, and the upcycling category show that merchandising, loyalty, and waste-reduction initiatives are layered directly into the same digital surface. The result is a product with more operational depth than a generic e-commerce front end, but also more dependencies that must execute in sync every day.
