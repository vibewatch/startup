- id: drivers-risks-and-diligence
  title: Value drivers, downside triggers, and final diligence asks
  body: >-
    Rohlik’s upside case is easy to articulate. It combines multi-country online-grocery leadership in CEE and DACH, strong customer-scale proof, improving country-level profitability, and a plausible software/platform asset in Veloq. If Germany becomes consistently accretive and Veloq proves external monetization, the business could graduate from “efficient grocer with tech” to “tech-enabled grocery platform with retail cashflow,” and the market would likely reward that shift. The Amazon.de partnership also adds useful strategic optionality by improving customer reach in Germany without forcing Rohlik into a marketplace-only model.


    The downside case is just as clear. Germany may keep consuming capital, grocery multiples may stay compressed, and Veloq may remain more strategic story than monetized software asset for longer than investors hope. On top of that, public disclosure is still weak on the capital stack, governance rights, and exact country economics. Those are not cosmetic omissions: they directly shape whether the headline valuation translates into a good investment return. As a result, the final diligence ask is narrow but crucial. Before moving from track to buy, investors need the cap-table and preference picture, a Germany profitability bridge, and standalone Veloq economics. Without those three items, precision is false comfort.
