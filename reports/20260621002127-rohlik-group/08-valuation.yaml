  rows:
  - - Bull
    - Revenue compounds well beyond EUR1.3B, Germany becomes clearly accretive, and Veloq earns software premium
    - At 2.3x-2.7x revenue on EUR1.8B-2.0B sales, equity value could land around EUR4.1B-EUR5.4B
    - Requires strong execution and market appetite
    - low-medium
  - - Base
    - Revenue continues to grow solidly while group profitability improves gradually and multiple stays around 1.4x-1.7x
