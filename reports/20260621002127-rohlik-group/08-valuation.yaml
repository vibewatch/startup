    - Execution must stay clean and Germany cannot backslide
    - medium-high
  - - Bear
    - Growth slows, Germany remains a drag, and public grocery-tech multiples compress further
    - At 0.8x-1.1x revenue on EUR1.3B-1.4B sales, value could compress toward EUR1.0B-EUR1.5B
    - Downside can come from valuation reset more than demand collapse
    - medium
  notes: Scenarios use revenue-multiple logic because the public record is too thin for a DCF-grade profitability model.
