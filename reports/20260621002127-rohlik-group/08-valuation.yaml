- id: comp-and-range
  title: Comparable framing and valuation range
  body: >-
    The most useful way to frame Rohlik is to compare it against two different peer sets. Traditional grocers such as Tesco and Ahold Delhaize trade on low revenue multiples because they are mature, diversified, and not viewed as software assets. On that lens, Rohlik’s 1.5x implied multiple looks rich. But platform-like grocery or marketplace names tell a different story. Instacart screens closer to 2.5x-3x revenue, while Ocado shows how dangerous that premium can be when public markets lose faith in the platform narrative. Rohlik sits between those buckets. It has more technology and operating leverage than a plain grocer, but less public disclosure and cleaner monetization than the strongest software-style names.


    That in-between status is why the valuation stance settles at fair. If Rohlik were valued like Tesco or Ahold, it would look obviously attractive. If it were valued like a premium software platform, it would look stretched. At the current known mark, it is neither. The central question is whether investors should underwrite Veloq, automation, and German margin improvement as premium-multiple drivers. The public answer is “partly yes, but not blindly.” That supports a valuation range with limited downside cushion relative to traditional grocers, but meaningful upside only if the technology and profitability story earns more than a retail multiple over time.
