- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Germany fails to become durably accretive
    - Another 12-18 months of scale without clear profitability bridge
    - Removes the operating leverage needed for premium narrative
    - Downgrade stance toward stretched or expensive
  - - Veloq remains internal-only economics
    - No external customer or segment evidence emerges
    - Cuts the software premium from the valuation story
    - Re-rate closer to retail comparables
  - - Cap-table terms prove investor-unfriendly
    - Heavy preferences, ratchets, or rights impair new-money economics
    - Headline EUR2B value becomes less relevant to return math
    - Pause or avoid depending on severity
  - - Public comparables compress further
    - Ocado / Instacart / grocery peers de-rate materially
    - Lowers acceptable entry multiple even if Rohlik executes well
    - Raise required return and lower acceptable price
  notes: These triggers are tied directly to valuation logic, not only to general business risk.
