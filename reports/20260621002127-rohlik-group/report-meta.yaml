companyProfile:
  summary: >-
    Rohlik Group is a Prague-based, founder-led European online grocery leader founded in 2014
    by Tomáš Čupr. The company operates full-basket grocery delivery under five consumer brands
    across Czech Republic, Hungary, Austria, Germany, and Romania, delivering 17,000–24,000 SKUs
    within 60–180 minutes using proprietary AI-powered, highly automated fulfillment centers.
    With €1.114 billion in audited 2024 revenue, 34% year-on-year growth, and EBITDA profitability
    in its two largest markets, Rohlik has become the only profitable large-scale online grocer in
    continental Europe. In June 2025 it spun out Veloq, a standalone AI-native grocery fulfillment
    platform, and is targeting an IPO in 2027.
  foundedDate: '2014-01-01'
  founders:
    - name: Tomáš Čupr
      role: Founder and Chief Executive Officer
      background: >-
        Serial Czech entrepreneur; built Rohlik from a Prague startup into a continental European
        unicorn; retains active operating and strategic control.
      claimRefs: [CO001, CO002]
  foundingLocation: Prague, Czech Republic
  headquarters: Prague, Czech Republic
  productSummary: >-
    Same-day full-basket grocery delivery with 17,000–24,000 products (branded, private-label,
    and local/farm-direct), 60-minute delivery windows, 15-minute scheduling slots, and coverage
    of fresh, chilled, frozen, ambient, pharmacy, drugstore, and pet categories.
    The Veloq spin-out offers the same AI fulfillment platform (automation, last-mile routing,
    eCommerce) to third-party retailers globally.
  customerFocus: >-
    Urban and suburban European households seeking full-basket convenience, high-quality fresh
    produce, and reliable rapid delivery; premium and mainstream segments in major metropolitan areas.
  businessModel: >-
    Direct-to-consumer online grocery retailing with revenue from product sales (gross margin
    on food and non-food); ancillary revenue from retail media, premium delivery subscriptions
    (Rohlik Xtra loyalty program), and private-label margin; Veloq adds a B2B technology
    licensing and services revenue stream.
  stage: late-stage private / pre-IPO
  fundingStatus: >-
    Total equity funding ~€780M across Series B (€190M, Mar 2021), Series C (€100M, Jul 2021),
    Series D (€220M, Jun 2022), and 2024 growth round ($170M led by EBRD). EIB scale-up debt
    of €90M (2024) and €30M for Veloq (2026) supplements equity. Current valuation estimated
    at €2B+. IPO targeted for 2027.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO008, CO010, CO011]
summary:
  headline: >-
    Rohlik is Europe's most credible full-basket online grocer — profitable, growing at 34%,
    and building a technology moat via Veloq — but high capex, Germany losses, and a private
    market at an IPO crossroads keep the risk rating elevated.
