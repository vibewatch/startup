  topStrengths:
    - Sole profitable large-scale full-basket online grocer in continental Europe with EBITDA positive in Czech Republic (since 2018), Hungary (since 2021), and Munich (since 2023).
    - Proprietary AI-powered automation stack (Veloq) proven across five countries and now licensed externally, creating a technology flywheel that extends the moat beyond grocery operations.
    - EBRD and EIB institutional backing provides credibility, low-cost expansion capital, and regulatory validation difficult for pure-VC-backed competitors to replicate.
    - Amazon.de distribution partnership (November 2024) validates technology and extends customer reach in Germany without proportional capex.
    - Industry-leading NPS above 90 and 97% on-time delivery across all markets demonstrates durable customer loyalty and repeat economics.
  topRisks:
    - Germany remains loss-making at group level despite Munich profitability; €350M+ invested with unclear group-level breakeven timeline creating ongoing cash drag.
    - "IPO market timing risk: 2027 target is aspirational and dependent on continued profitability progress, stable European capital markets, and competitive positioning."
    - High capital intensity from €400M+ automation investment programme creates leverage sensitivity and refinancing dependency.
    - Country exit risk evidenced by Italy and Spain launch-then-exit; expansion into new cities and geographies carries recurring test-and-fail capex.
    - "Key-person concentration in founder-CEO Tomáš Čupr for strategy, culture, and investor confidence."
  unresolvedGaps:
    - Audited group-level EBITDA and net income; country-by-country P&L breakdown.
    - Exact cash and debt position, burn rate by market, and covenants on EIB/EBRD facilities.
    - Veloq customer pipeline, contracted ARR, and contribution margin for the B2B technology segment.
    - Detailed customer cohort data (retention curves, LTV by market and acquisition channel).
    - IPO prospectus-quality unit economics across all five markets.
