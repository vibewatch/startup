schemaVersion: report-v2
artifact: company-overview
slug: torq
runDate: "2026-09-24"
company:
  name: Torq
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Torq is a 2020-founded AI SOC and security hyperautomation company that closed a $140 million Series D in
    January 2026 at a $1.2 billion valuation, bringing total funding to $332 million. The company says it now
    serves 300+ enterprise customers, runs 100 million+ daily automations, and has scaled to 430+ employees while
    expanding into the US federal market through Merlin Ventures.
sections:
  - id: identity-and-model
    title: Identity, Footprint, and Business Model
    body: >-
      Torq is a private cybersecurity company founded in 2020 and headquartered in New York, with its main R&D base
      in Israel. It sells an AI SOC platform that combines hyperautomation, agentic AI, and workflow orchestration
      to help security teams triage, investigate, and respond to threats. The business is delivered as enterprise
      software and is positioned as a replacement for legacy SOAR tooling, with a SaaS-first operating model and a
      wide integration layer spanning SIEM, EDR, identity, cloud, and IT systems. Torq's own site and product pages
      emphasize self-service automation, AI-assisted investigation, and SOC workflow execution rather than point
      tools.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
    tableRefs:
      - TO001

  - id: founders-leadership
    title: Founders, Leadership, and Key-Person Risk
    body: >-
      Torq was founded by Ofer Smadari, Leonid Belkind, and Eldad Livni, who remain the company's visible senior
      leadership bench. The three founders bring prior security-company experience and have continued to anchor the
      company narrative through its scale-up phase. That structure is a strength because it keeps product direction
      close to the original operating thesis, but it also creates key-person concentration: the product, technical,
      and commercial story still depends heavily on the founding team. Public governance detail remains limited, so
      outside diligence has less to work with than it would for a public company or a later-stage private issuer.
    claimRefs:
      - CO006
      - CO007
      - CO009
    tableRefs:
      - TO002

  - id: funding-scale-and-milestones
    title: Funding History, Scale, and Recent Milestones
    body: >-
      Torq's most recent capital event was a January 2026 Series D that raised $140 million at a $1.2 billion
      valuation and brought cumulative funding to $332 million. The company says the round supports product R&D,
      enterprise expansion, and a push into federal and public-sector markets, with Merlin Ventures providing both
      capital and go-to-market support. Since the last refresh window, Torq has also shipped Agentic Builder,
      expanded product updates across cases and reporting, and described SOC Brain as a new self-learning layer on
      top of the platform. The combination of funding, product cadence, and customer scale suggests the company is
      still in a rapid investment-and-expansion phase rather than a maturity phase.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
    tableRefs:
      - TO003
    figureRefs:
      - FO001

