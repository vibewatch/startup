companyProfile:
  summary: >-
    Torq is a New York-headquartered AI SOC and security hyperautomation company founded in 2020 by Ofer Smadari, Leonid
    Belkind, and Eldad Livni. The platform automates SOC triage, investigation, and response across a large integration
    surface, and the company now says it serves 300+ enterprise customers, processes 100M+ daily automations, and
    employs 430+ people. The most recent disclosed financing was a $140 million Series D in January 2026 at a $1.2
    billion valuation, with Merlin Ventures leading the round and federal-market expansion as a key use of proceeds.
