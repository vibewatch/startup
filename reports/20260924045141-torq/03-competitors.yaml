chapter:
  number: 3
  title: Competitors
  summary: >-
    Torq's closest competitors are other security automation and AI SOC platforms that solve the same triage and
    orchestration pain points with different tradeoffs around deployment flexibility, governance, and ecosystem
    breadth. The most important competitive pressure comes from legacy SOAR vendors and large security-suite
    incumbents that can bundle automation into adjacent products.
sections:
  - id: landscape
    title: Competitive Landscape
    body: >-
      Torq competes against both direct AI SOC specialists and larger security vendors that can deliver automation as
      part of a broader platform. Swimlane is the clearest direct comparator in the public materials we reviewed,
      while PeerSpot users regularly compare Torq to Microsoft Sentinel, Palo Alto Cortex XSOAR, and other enterprise
      automation stacks. Torq's strength is the combination of agentic AI, integrations, and workflow speed; its
      weaker public posture is deployment flexibility, because competitors promote on-prem or air-gapped options that
      Torq does not foreground. That leaves Torq looking strong on product velocity but less complete on deployment
      optionality.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
    tableRefs:
      - TP001

  - id: differentiation
    title: Differentiation, Switching Costs, and Distribution
    body: >-
      The main reasons Torq can win are workflow depth, AI-assisted builder experiences, and a channel ecosystem that
      helps it reach large enterprises and MSSPs. The main reasons it can lose are feature parity pressure, reporting
      and governance concerns, and incumbent distribution power from vendors already sitting inside the security
      stack. In practice, this means Torq looks more like a fast-growing specialist than a category monopolist.
      Buyers that value speed and AI-assisted authoring are likely to prefer Torq; buyers that value deployment
      control or audited governance may prefer a more conservative incumbent. The key question is whether workflow
      depth creates enough switching cost to offset the bigger vendors' distribution reach.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
    figureRefs:
      - FP001
    tableRefs:
      - TP002

  - id: displacement-risk
    title: Substitutes, Commoditization, and Adverse Signals
    body: >-
      The biggest threat is not a single rival; it is commoditization. As XDR and SIEM vendors add more native AI
      triage, Torq must defend a software wedge that can look increasingly similar to adjacent products. User-review
      sites and competitor marketing pages also point to practical friction around reporting, learning curve, and
      deployment control. Those are not existential weaknesses, but they are enough to keep Torq in the "prove it"
      bucket rather than the "category winner" bucket. The risk is less a single rival and more the steady pressure
      of features becoming interchangeable over time.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
    tableRefs:
      - TP003

