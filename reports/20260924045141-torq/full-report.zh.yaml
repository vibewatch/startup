        title: 市场边界与竞争现状
        blocks:
          - type: paragraph
            body: >-
              Torq 锚定的目标市场远超传统 SOAR 范畴，正处于安全编排、安全案件管理、AI SOC 与 SecOps 工作流自动化的交汇地带。买方目前的替代选择主要包括：分析师人工操作、传统 SOAR
