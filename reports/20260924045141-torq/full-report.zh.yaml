      - number: '6.3'
        title: 留存、增购与客户集中度缺口
        blocks:
          - type: paragraph
            body: >-
              公开信息未披露队列留存率、净留存率（NRR）或流失率，外界只能根据知名客户名单和公司自称的使用量推测客户基础质量。这形成一大尽调缺口：标杆客户多，不等于增购经济性已经成立。此外，渠道合作也带来另一重集中风险，部分增长很可能依赖尚未充分披露的
              MSSP 及合作伙伴体系。总体而言，其客群基础真实且在扩张，但仅凭公开证据仍无法全面量化。核心尽调问题在于：显性用量能否转化为持续增购？还是说，增长仍更多靠案例叙述支撑，而非硬指标？
