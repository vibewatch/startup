    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Torq 是一家成立于 2020 年的私营网络安全公司，总部位于纽约，主要研发中心设在以色列。公司对外销售 AI SOC 平台，将超级自动化、Agentic AI
              与工作流编排融为一体，协助安全团队完成威胁分诊、调查与响应。其业务以企业级软件形式交付，定位为传统 SOAR 工具的替代方案，采用 SaaS 优先的运营模式，并拥有覆盖 SIEM、EDR、身份认证、云基础设施及
              IT 系统的广泛集成层。Torq 官网与产品页面重点突出自助式自动化、AI 辅助调查以及 SOC 工作流执行能力，而非单一功能工具。
