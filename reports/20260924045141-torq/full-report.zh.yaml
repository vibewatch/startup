    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR007
      - CR009
  - id: TR002
    title: 风险分层表
    columns:
      - 分层
      - 潜在隐患
      - 核心影响
      - 缓解措施
    rows:
      - - 产品
        - 部署门槛与 AI 信任阻力
        - 可能拖慢早期客户采纳
        - 展示管控与治理机制
      - - 财务
        - ARR 与毛利率不透明
        - 难以建立严密投资判断
        - 索取数据室中的财务桥接表
      - - 执行
        - 团队招聘与联邦市场拓展复杂度
        - 推高烧钱速度并增加进度失控风险
        - 分阶段谨慎把控开支
      - - 战略
        - 原生内置 AI 带来的同质化
        - 可能压缩切入点生存空间
        - 筑深工作流差异化壁垒
    notes: 本表将产品、财务、执行与战略风险分层归纳，使公开证据结构清晰有序。
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR009
  - id: TR003
    title: 风险触发条件表
    columns:
      - 触发事件
      - 直接影响
      - 核心影响
      - 应对策略
    rows:
      - - 部署灵活性短板未能改善
        - 受监管行业成单放缓或停滞
        - 压缩 TAM 空间并放缓拓展节奏
        - 增加部署管控选项
      - - 留存数据不及预期
        - 客户扩张逻辑受到削弱
        - 估值承压增加
        - 重新评估风险折价
      - - 平台型厂商补齐 AI 差距
        - 产品功能趋于同质
        - 通用化与贬值风险加剧
        - 进一步做深工作流壁垒
    notes: 本表重点列出最可能快速改变 Torq 风险画像的几项关键事件。
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR009
  - id: TV001
    title: 估值情景与对标视角
    columns:
      - 情景
      - 逻辑推演
      - 估值参考判断
      - 成立前提
      - 风险等级
    rows:
      - - 悲观
        - 增速放缓，且平台型厂商挤压切入点空间
        - 低于现价的支撑水平
        - 未公开 ARR 证明且客户采纳转弱
        - 高
      - - 基准
        - Torq 持续增长但增速回归常态
        - 估值大致维持当前水平
        - 数据室展现坚实的 ARR 与留存数据
        - 高
      - - 乐观
        - Torq 确立 AI SOC 品类领先地位
        - 高于当前估值水平
        - 具备可防守的工作流壁垒与联邦订单破局
        - 中
      - - 公开对标视角
        - 更多基于战略价值定价而非严格乘数
        - 一级市场定价享有溢价
        - 需具备可比的品类领先地位证据
        - 高
      - - 验证门槛
        - 需要确凿经营指标
        - 尚无法完成严密投资判断
        - ARR、毛利率、NRR 与集中度
        - 高
      - - 入场姿态
        - 保持观望，等待透明度提升
        - 维持跟踪，直至尽调结论闭环
        - 数据室质量提升或价格回调
        - 中
      - - 下行触发事件
        - 原生 AI 抹平差距
        - 估值面临下调风险
        - 老牌厂商实现功能同质化
        - 高
      - - 上行触发事件
        - 智能体自动化经受住长期验证
        - 估值倍数扩张
        - 大企业客户可复制扩张
        - 中
      - - 客户背书
        - 具备明确标杆客户名单与证言
        - 支撑估值溢价
        - 实际生产环境应用面拓宽
        - 中
      - - 财务凭据
        - 依然不透明
        - 阻碍精准测算
        - 亟需经审计指标
        - 高
    notes: 鉴于公开 ARR 未曾披露，各情景划分特意采用定性表述；本表宜作为估值思考框架参考，而非精确的数学模型测算。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV013
  - id: TV002
    title: 估值质疑视角表
    columns:
      - 来源
      - 质疑点
      - 估值推演影响
    rows:
      - - The Register
        - AI 安全估值溢价往往过度预支团队执行力
        - 对信息披露不透明保持估值折价
      - - Ars Technica
        - 自主 SOC 相关主张仍需实际生产验证
        - 切忌单纯为概念叙事支付过高溢价
      - - Torq 官方 D 轮新闻稿
        - 增长确属真实，但财务口径模糊
        - 溢价或可成立，但必须经过严密尽调验证
    notes: 本表兼收乐观与审慎视角，确保本章立论紧扣公开证据，而非主观推论。
    claimRefs:
      - CV003
      - CV005
      - CV013
  - id: TV003
    title: 尽调准入门槛表
    columns:
      - 尽调要件
      - 核心影响
      - 若验证向好
      - 若验证落空
    rows:
      - - ARR 变动拆分
        - 验证收入底盘是否真实且保持增长
        - 支撑更坚实的估值逻辑
        - 维持“观察”评级
      - - NRR / 流失率
        - 揭示产品真实粘性
        - 缩减下行折价
        - 视高估值为脆弱溢价
      - - 毛利率
        - 验证业务增长是否高效
        - 证实规模经济效应
        - 计入更高的股权稀释风险
      - - 客户集中度
        - 暴露单一账户依赖风险
        - 支撑更宽广的护城河逻辑
        - 施加更大幅度估值扣减
    notes: 本表列出关键最低证据门槛；只有补齐这些要件，Torq 才能从引人瞩目的增长故事蜕变为论证充分的投资标的。
    claimRefs:
      - CV008
      - CV011
      - CV012
