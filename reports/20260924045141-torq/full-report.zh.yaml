  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流架构
        blocks:
          - type: paragraph
            body: >-
              Torq 是一款云端安全运营平台，位于威胁检测与响应之间。平台接入告警和事件，将其归入统一案件，再自动执行调查步骤，并调用已连接的安全工具触发响应。在公司 2026 年的产品更新中，Socrates
              具备了兼顾调查与构建的双重能力，推动 Torq 从单纯的工作流引擎演进为更具智能体（agentic）特性的开发环境。这一转变至关重要，它大幅减少了 SOC
              团队手工编写安全剧本（playbook）的工作量，也让运营团队能在同一处编写并审计工作流。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
      - number: '5.2'
        title: 技术架构、生态集成与运营模式
        blocks:
          - type: paragraph
            body: >-
              该平台的核心依赖仍是外部集成与可复用的工作流组件。官方动态提到了数百个连接器、定时报表、通知收件箱、案件看板、组织权限管理、分组指派以及步骤运行器（step-runners）。其技术路径十分清晰：Torq
              要做安全工作流的控制中枢（control
              plane），而不只是告警面板。只要集成可靠，客户接入的安全栈越多，平台价值就越能累积放大，形成系统层面的优势。反过来，每增加一个连接器都要投入维护，产品质量取决于团队能否持续做好运维。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
