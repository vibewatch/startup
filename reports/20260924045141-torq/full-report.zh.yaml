      - number: '6.2'
        title: 客户落地证据与典型场景
        blocks:
          - type: paragraph
            body: >-
              最强有力的落地信号来自生产环境的实际调用与具体工作流案例。Torq 官网与客户案例披露了庞大的日均自动化执行量、AI Agent 的快速部署，以及覆盖钓鱼邮件分诊、告警处置、问题修复和应急响应的 SOC
              工作流。合作伙伴报道进一步印证了这一点，将 Torq 视作 MSSP 及相邻安全平台的运营层，而非只适合演示的产品。这说明 Torq 已有真实用户，不只是设计合作伙伴（design
              partners）。不过，目前公开证据仍以特定时间断面的标杆背书为主，足以支撑客户确实采用的判断，但尚无法支撑完整的留存队列分析。
            claimRefs:
              - CU005
