  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 产品、部署与市场风险
        blocks:
          - type: paragraph
            body: >-
              最显著的风险是：Torq 的公开叙事主打云端 Agentic AI，但许多受监管行业买方仍看重部署控制权和可审计性。竞品对比页面反复强调这一差距；用户评价也显示 Torq
              上手不易，报表功能也有不足。这不代表产品弱，但买方若拿它与更容易治理的平台比较，采购就可能停滞。换言之，Torq
              面向一个仍要求稳妥验证的市场，提出了更前沿的产品承诺；尤其在强监管行业，眼下落地确定性往往比新颖性更重要。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
      - number: '7.2'
        title: 财务、执行与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Torq 同样面临成长型企业的常见风险：高昂的招聘成本、估值溢价带来的高预期，以及进军联邦与公共部门市场时仍须保持快速迭代的压力。客户案例真实，但公开证据未披露
              NRR、流失率或客户集中度，收入质量仍不清楚。此外，创始人主导既是优势，也带来关键人集中风险。财务层面的隐患不是业务虚构，而是公开证据太少，无法判断增长究竟有多稳。在这些指标披露前，Torq
              的业务故事虽有吸引力，风险图谱却仍不完整。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
