              - CR007
              - CR009
              - CR010
      - number: '7.3'
        title: 战略转折信号与一票否决标准
        blocks:
          - type: paragraph
            body: >-
              最关键的战略风向标在于：大型安全巨头推出的原生 AI 能力，是否会削弱市场对独立自动化层的刚需。一旦 XDR 或 SIEM 综合套件迅速抹平代差，Torq
              就必须持续证明自己能差异化地执行工作流，而不是给同一种分诊问题换个包装。在此之前，适合把 Torq 看作一家有前景、但仍需更多证据验证的公司。因此，一票否决标准（kill
              criteria）不在某个季度表现不佳，而在产品差异化是否持续流失。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
