              共同创立，三人至今仍是公司核心管理层。三位创始人都有安全行业创业经历，在公司扩张过程中持续把控业务主线。这种架构让产品方向贴近最初的经营思路，是一大优势；但关键人风险也因此集中：产品、技术和商业化叙事仍高度依赖创始团队。此外，公司公开披露的治理细节有限，外部尽调能掌握的信息远少于上市公司或发展阶段更靠后的私营公司。
