  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群结构与行业分布
        blocks:
          - type: paragraph
            body: >-
              根据 Torq 官方口径，其客户群体涵盖《财富》500 强企业、强合规监管机构以及托管安全服务合作伙伴。公司在公开资料中列举了 Marriott、PepsiCo、Procter &
              Gamble、Siemens、Uber、Virgin Atlantic、Valvoline、Check Point、Chipotle、Armis、Informatica、Wiz 等客户。这些客户说明，Torq
              不只是小团队用的工具；其产品已进入 SOC 规模较大、且 SOC 本身关乎业务运转的企业。这份名单还显示，Torq 正从单一垂直行业拓展到多类企业场景；在这一阶段，客户覆盖面和标杆客户质量同样重要。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
