              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 多空投资逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景清晰明确：Torq 身处高增长的 AI SOC
              赛道，大企业客户落地扎实，产品迭代极为敏捷。悲观情景同样直截了当：公开财务信息稀缺，平台能否抵御平台型大厂的进攻仍待自证，且当前定价已按赛道赢家计入。两股力量相互拉扯，使得仅基于公开证据的尽调结论更倾向于“观察”（track）而非“买入”（buy）。持审慎态度的媒体也提醒，AI
              安全概念的估值往往容易跑在业务落地前面，Torq 的估值溢价必须靠后续业绩打出来，而不能想当然。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV013
      - number: '8.2'
        title: 估值参照与可比视角
        blocks:
          - type: paragraph
            body: >-
              无论从一级市场何种尺度衡量，Torq 在 D 轮拿下的 $1.2B 估值都处于高位，尤其在 ARR
              尚未公开的前提下。因此，无法开展严密的估值倍数对比，最务实的对标视角属于战略层面：赛道契合度、标杆客户背书、产品迭代速度，以及在巨头套件挤压下能否持续放量。公开可比案例与融资动态显示，市场愿意为 AI SOC
              赛道领头羊买单，但这一溢价能否维持，完全取决于 Torq 能否持续证明自己绝非浮于表层的工具功能插件。决策分水岭在于：在市场将 AI SOC
              视同又一场安全套件的功能内卷并杀估值之前，公司能否将先发的产品势能转化为可持续的商业运营模型。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV010
      - number: '8.3'
        title: 投资建议、置信度与进场核查诉求
        blocks:
          - type: paragraph
            body: >-
              投资建议维持“观察”（track），置信度为“中”（medium）。Torq
              的真实调用量、标杆客户与产品势能已有充分证据，不至于给出“回避”（avoid）评级；但其公开财务深度不足，尚难支撑更坚决的看多判断。进场尽调的核心诉求很直接：在确认当前估值溢价合理之前，必须在虚拟数据室（data
              room）中核实真实的 ARR、客户留存率、集中度以及毛利结构。若这些数据表现强劲，当前估值站得住脚；反之，这笔溢价将难以自圆其说。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV011
