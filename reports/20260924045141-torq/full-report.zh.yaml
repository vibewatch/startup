        title: 竞争态势
        blocks:
          - type: paragraph
            body: >-
              Torq 既要直面垂直领域的 AI SOC 初创公司，也要与将自动化作为大平台组件的大型安全巨头竞争。从公开资料看，Swimlane 是最直接的对标竞品；PeerSpot 上的用户评测也经常将 Torq 与
              Microsoft Sentinel、Palo Alto Cortex XSOAR 等企业级自动化套件进行对比。Torq 的优势在于 Agentic
              AI、广泛集成与快速构建工作流的能力相结合；公开材料中的短板则是部署灵活性不足：竞品主推本地部署（on-prem）或隔离网络（air-gapped）选项，Torq 却没有重点强调。这使 Torq
              在产品迭代速度上表现抢眼，但部署选择较少。
