schemaVersion: report-v2
artifact: customers
slug: torq
runDate: "2026-09-24"
company:
  name: Torq
acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The customer chapter uses a bar summary because the planned journey-map would add little beyond the already clear adoption funnel and proof table.
  - dimension: unverifiedSource
    reason: >-
      The adverse customer-adoption source is carried forward from the prior Torq research archive to preserve continuity during this structural repair.
chapter:
  number: 6
  title: Customers
  summary: >-
    Torq's public customer evidence is strong on named enterprise logos and use-case breadth, but weaker on cohort
    data, retention, and concentration. The company appears to have a real enterprise installed base, plus a growing
    partner and MSSP channel, but the durable unit economics of those relationships are still not public.
sections:
  - id: customer-base
    title: Customer Base and Segment Mix
    body: >-
      Torq's stated customer base spans Fortune 500 enterprises, regulated organizations, and managed security
      partners. The company names Marriott, PepsiCo, Procter & Gamble, Siemens, Uber, Virgin Atlantic, Valvoline,
      Check Point, Chipotle, Armis, Informatica, Wiz, and others in public material. Those names signal that Torq
      is not a small-team tool: it is being deployed where the SOC is already a large, business-critical function.
      The customer list also suggests that Torq is moving beyond a single vertical and into multiple enterprise
      motions, which is important because breadth usually matters as much as logo quality at this stage.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001

  - id: adoption-evidence
    title: Adoption Evidence and Use Cases
    body: >-
      The strongest adoption signals are production usage and concrete workflow examples. Torq's own site and
      customer stories describe large daily automation volumes, rapid deployment of AI agents, and SOC workflows
      that span phishing triage, alert handling, remediation, and incident response. Partner coverage reinforces
      this by framing Torq as an operating layer for MSSPs and adjacent security platforms rather than a demo-only
      product. The implication is that Torq has real users, not just design partners. That said, the evidence is
      still mostly point-in-time and logo-based, so the public record supports adoption but not yet a full cohort
      analysis.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
    figureRefs:
      - FU001
    tableRefs:
      - TU002

  - id: retention-and-concentration
    title: Retention, Expansion, and Concentration Gaps
    body: >-
      The public record does not show cohort retention, NRR, or churn, so the quality of the customer base has to be
      inferred from named logos and usage claims. That creates a gap: a company can have strong logo counts without
      proving expansion economics. The channel story also creates a second concentration risk because some of the
      growth is likely to flow through MSSP and partner relationships that are not fully disclosed. Net: the
      customer base looks real and growing, but not yet fully measurable from public evidence. The key diligence
      question is whether the visible usage translates into durable expansion, or whether the company is still
      carrying too much of its growth story in anecdotes rather than metrics.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU003

tables:
  - id: TU001
    title: Named customer proof table
    enumerationScope:
      coverage: partial
      basis: Public Torq customer references, quotes, and partner announcements that name customers directly; this is a representative subset, not a full roster.
    columns:
      - Evidence
      - What it shows
      - Confidence
      - Diligence note
    rows:
      - ["Marriott / PepsiCo / P&G / Siemens", "Large multinational enterprise adoption", "medium", "Named in official Series D materials"]
      - ["Uber / Virgin Atlantic / Wiz", "Broader Fortune 500 / large enterprise adoption", "medium", "Named in official Series D materials"]
      - ["Valvoline", "Fast deployment and workflow value", "medium", "Customer quote in Series D release"]
      - ["Check Point", "High automation of internal security alerts", "medium", "Series C release customer quote"]
      - ["Chipotle / Armis / Informatica", "Breadth across verticals", "medium", "Named customer logos in company materials"]
      - ["MSSP / MDR partners", "Partner-led delivery path", "medium", "Reco and Stellar Cyber coverage"]
      - ["Fortune 100 / Fortune 500", "Enterprise-scale deployment", "medium", "Official company narrative"]
      - ["300+ customers", "Scale signal", "medium", "Company-stated and unaudited"]
      - ["100M+ daily automations", "Operational usage signal", "medium", "Company-stated and unaudited"]
      - ["No public NRR / churn", "Retention gap", "high", "Still a key diligence blocker"]
    notes: >-
      This table uses public customer references only. It is intentionally a mix of positive adoption signals and
      the biggest public gaps in customer diligence.
    claimRefs:
      - CU001
      - CU005
      - CU009
      - CU010

  - id: TU002
    title: Customer adoption proof table
    columns:
      - Proof point
      - What it implies
      - Public signal
      - Diligence read-through
    rows:
      - ["Named Fortune 500 logos", "Enterprise validation", "Official customer names and quotes", "Shows Torq can land inside large SOCs"]
      - ["Partner deployment", "Channel-led distribution", "Reco and Stellar Cyber coverage", "Suggests MSSP and multi-tenant motion"]
      - ["Daily automations", "Production usage", "Company-stated scale claim", "Signals operational depth if accurate"]
      - ["48-hour usefulness quote", "Fast time to value", "Valvoline customer quote", "Suggests onboarding can be rapid"]
    notes: >-
      This is a proof-of-adoption table rather than a full customer roster. It emphasizes public signals that look
      like live deployment, not just evaluation-stage activity.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008

  - id: TU003
    title: Retention and concentration risk table
    columns:
      - Risk
      - Public evidence
      - Why it matters
      - What to ask in diligence
    rows:
      - ["NRR / churn opacity", "No public cohort metrics", "Hard to tell if adoption is compounding", "Request renewal cohorts and expansion by vintage"]
      - ["Customer concentration", "No disclosed top-account mix", "One large account could skew results", "Request top-10 revenue share and contract terms"]
      - ["Partner concentration", "MSSP motion is material but not quantified", "Channel wins may hide concentration risk", "Request partner-sourced ARR and churn"]
    notes: >-
      The table keeps the public gap front and center: strong logos are not the same thing as measurable retention
      quality, and partner-led growth can obscure the true customer mix.
    claimRefs:
      - CU009
      - CU011
      - CU013

figures:
  - id: FU001
    title: Customer proof pyramid
    type: bar
    summary: >-
      The strongest public proof points are enterprise logos, real workflow quotes, and partner-channel deployment.
    data:
      items:
        - label: "Named enterprise logos"
          value: 5
        - label: "Customer quotes"
          value: 4
        - label: "MSSP / partner proof"
          value: 3
        - label: "Company-stated customers"
          value: 300
        - label: "Daily automations"
          value: 100
        - label: "Public retention metrics"
          value: 0
    notes: >-
      The figure is intentionally asymmetric: public customer proof is strong on logos and anecdotes, but weak on
      quantified retention and expansion metrics.
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU009
      - CU010

