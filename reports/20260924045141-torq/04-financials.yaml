acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The chapter uses a timeline instead of the planned flow or waterfall because public financial evidence is too sparse for a credible process diagram.
  - dimension: unverifiedSource
    reason: >-
      The valuation-skepticism source is retained from the existing Torq evidence archive to preserve continuity while this refresh fixes chapter structure.
chapter:
  number: 4
  title: Financials
  summary: >-
    Public financial evidence for Torq is still limited, but the company has now disclosed enough to establish a
    clear trajectory: a $70 million Series C in 2024, a $140 million Series D in January 2026, and a cumulative
    $332 million raised. Revenue growth and customer expansion are strong, but audited revenue, margin, burn, and
    runway data remain undisclosed.
sections:
  - id: revenue-and-pricing
    title: Revenue Model, Pricing, and Growth Signals
    body: >-
      Torq sells enterprise security software, but the public record does not disclose a clean pricing sheet or
      audited revenue model. What is visible is the growth narrative: the company says revenue increased by roughly
      300% in 2025, and third-party coverage repeats that Torq is gaining traction with large enterprises and
      federal-focused investors. The implied economics are strong enough to support a $1.2 billion valuation, but not
      transparent enough to underwrite a precise ARR model from public data alone. Pricing is still inferred from
      customer scale, deployment breadth, and contract intensity rather than from a published rate card or audited
      revenue bridge.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
    tableRefs:
      - TI001

  - id: capital-structure
    title: Capital Structure, Runway, and Use of Proceeds
    body: >-
      The company has raised capital in enough size to keep scaling, but the latest public data still leaves the
      cash profile opaque. The Series D was explicitly framed as funding for R&D, go-to-market expansion, and federal
      market entry. That means the round was at least as much about growth acceleration as balance-sheet support.
      Because there is no public burn or runway disclosure, diligence should assume another financing cycle is likely
      if the company continues to spend heavily on hiring and federal readiness. The capital base is meaningful, but
      the real question is whether the company can convert the round into durable operating leverage before expansion
      costs outrun the growth story.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
    figureRefs:
      - FI001

  - id: financial-risks
    title: What the Public Record Still Does Not Show
    body: >-
      The biggest financial gap is the absence of audited operating metrics. Torq does not publicly disclose ARR,
      gross margin, customer concentration, or retention cohorts. That means investors have to price the company off
      funding multiples, growth claims, and strategic position rather than a defensible financial model. The result
      is a high-growth, high-opacity profile: attractive if the operating story is real, but still difficult to
      underwrite with the precision one would want before a large private-market entry. Skeptical coverage also
      reminds readers that AI-security valuations can outrun disclosed fundamentals, so the margin for error stays
      tight until the data room fills in the missing numbers.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI002
      - TI003

