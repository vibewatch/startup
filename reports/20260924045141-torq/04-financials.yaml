      - CI002
      - CI005
      - CI009
      - CI010

  - id: TI002
    title: Financial disclosure gap matrix
    columns:
      - Metric
      - Public status
      - Why it matters
      - Underwriting impact
    rows:
      - ["ARR", "Not disclosed", "Core revenue anchor for any valuation multiple", "Blocks clean ARR-based pricing"]
      - ["Gross margin", "Not disclosed", "Shows how much growth is left after delivery costs", "Prevents a full model check"]
      - ["Burn / runway", "Not disclosed", "Determines whether spending is self-funding or capital-dependent", "Makes timing risk harder to judge"]
      - ["Customer concentration", "Not disclosed", "Reveals single-account exposure", "Changes downside severity"]
      - ["Retention / expansion", "Not disclosed", "Shows whether growth is durable", "Keeps the premium thesis conditional"]
    notes: >-
      This is an underwriting checklist, not a forecast table. The gaps are the point: the public record does not
      yet provide enough data to convert Torq's growth story into a precise financial model.
    claimRefs:
      - CI007
      - CI009
      - CI010

  - id: TI003
    title: Valuation skepticism and downside anchors
    columns:
      - Source
      - What it implies
      - Read-through
    rows:
      - ["The Register", "AI security valuations can assume near-perfect execution", "Premium pricing deserves a larger discount until execution is proven"]
      - ["Ars Technica", "Autonomous SOC claims still need production validation", "AI-led automation is not a substitute for evidence"]
      - ["Torq Series D coverage", "$1.2B pricing with strong growth narrative", "Upside exists, but the public proof set remains incomplete"]
    notes: >-
      The table intentionally pairs skeptical coverage with the company's own disclosure so the valuation discussion
      stays evidence-first rather than momentum-first.
    claimRefs:
      - CI002
      - CI009
      - CI012

