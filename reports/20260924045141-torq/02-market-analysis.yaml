      - ["Pricing and packaging", "Not public", "Makes economics hard to map", "Request pricing and ACV bands"]
      - ["Retention / expansion", "Not public", "Shows whether adoption compounds", "Request cohort and renewal data"]
    notes: >-
      Torq's addressable market looks real, but the public record does not support a precise sizing model without more
      operating evidence.
    claimRefs:
      - CM003
      - CM010
      - CM012

