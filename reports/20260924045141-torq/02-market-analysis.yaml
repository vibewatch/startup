acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The chapter uses a bar chart instead of the planned pyramid because the adoption forces are better represented as relative pressure rather than stacked hierarchy.
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Torq sits in the AI SOC and security automation market, where buyers want faster triage, better analyst
    coverage, and more governed automation. The market is being pulled in two directions: enterprise demand for
    agentic workflows and a countervailing preference for explainability, deployment flexibility, and auditability.
    Torq's strongest fit is large enterprise and MSSP SOCs that can tolerate SaaS delivery and want high automation
    depth.
sections:
  - id: market-boundary
    title: Market Boundary and Status Quo
    body: >-
      The relevant market is broader than classic SOAR. Torq competes in the overlap of security orchestration,
      security case management, AI SOC, and workflow automation for SecOps. The status quo alternatives are manual
      analyst work, legacy SOAR platforms, ticketing-based process chains, and single-vendor automation embedded in
      SIEM/XDR stacks. Torq's own positioning, analyst commentary, and competitor comparisons all point to the same
      market boundary: buyers are purchasing automation that can execute work, not just summarize alerts. In
      practice, that means the category is defined by actionability, governance, and integration depth more than by
      a single SOAR label.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001

  - id: buyer-segmentation
    title: Buyer Segments and Adoption Path
    body: >-
      Torq's best-fit buyers are enterprise SOC leaders, MSSP operators, and regulated organizations that need
      repeatable investigations, strong integrations, and a clear path from triage to response. The adoption path
      generally starts with a bounded alert- or case-heavy workflow, then expands into more autonomous response once
      the team trusts the controls and audit trail. Analyst commentary repeatedly stresses that buyers care less
      about the underlying model and more about workflow design, guardrails, and proof that the platform can show
      its work. The segmentation is therefore less about company size alone and more about how much operational
      discipline the buyer already has in the SOC.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
    figureRefs:
      - FM001
    tableRefs:
      - TM002

  - id: market-forces
    title: Growth Drivers, Constraints, and Diligence Gaps
    body: >-
      Demand is being driven by alert fatigue, staffing pressure, 24x7 coverage gaps, and the need to operationalize
      security data already being collected by SIEM and XDR tools. The main constraints are governance, deployment
      flexibility, and trust: enterprise teams still want explainability, role controls, and an audit trail before
      they let AI act autonomously. Because public market sizing is inconsistent and Torq does not disclose enough
      economics for a clean top-down model, the right diligence posture is evidence-constrained rather than precise.
      That makes the addressable market large but not tightly quantifiable from public evidence alone. The public
      evidence supports a real category with real demand, but it still does not support a precise numeric sizing
      thesis without extra diligence.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM003

