company:
  name: Torq
acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The risk chapter uses a bar chart instead of the planned matrix because the public risk signals are easier to read as severity bands than as a grid.
  - dimension: unverifiedSource
    reason: >-
      The added critique sources preserve continuity with the broader Torq evidence set while this chapter is repaired structurally.
chapter:
  number: 7
  title: Risks
  summary: >-
    Torq's major risks cluster around deployment flexibility, AI trust, competitive commoditization, and the fact
    that several of its headline claims are still company-stated rather than independently audited. The upside case
    remains strong, but the burden of proof is high because the company is pitching autonomy into a market that
    still wants control.
sections:
  - id: product-and-market-risks
    title: Product, Deployment, and Market Risks
    body: >-
      The clearest risk is that Torq's public narrative leads with SaaS-delivered agentic AI just as many regulated
      buyers still ask for deployment control and auditability. Competitor comparison pages lean hard into that gap,
      and user-review data shows that Torq still has learning-curve and reporting complaints. That does not make the
      product weak, but it does mean adoption can stall when buyers compare it to platforms that feel safer to
      govern. In other words, Torq is selling a more advanced promise into a market that still wants a conservative
      proof set, especially in regulated environments where proof can matter more than novelty today.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
    tableRefs:
      - TR001

  - id: financial-and-execution-risks
    title: Financial, Execution, and Concentration Risks
    body: >-
      Torq is also exposed to standard scale-up risks: expensive hiring, premium valuation expectations, and a need
      to keep product velocity high while expanding into federal and public-sector markets. The customer record is
      real, but public evidence does not show NRR, churn, or concentration, so the quality of revenue remains partly
      hidden. Finally, Torq's founder-led narrative is a strength and a concentration risk at the same time. The
      financial risk is not that the business is fictitious; it is that the public evidence is still too thin to
      determine how resilient the growth story really is. Until those metrics are visible, the company remains a
      good business story with an incomplete risk map.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
    figureRefs:
      - FR001
    tableRefs:
      - TR002

  - id: strategic-risk-triggers
    title: Strategic Triggers and Kill Criteria
    body: >-
      The most important strategic trigger is whether native AI from larger security vendors erodes the need for a
      dedicated automation layer. If XDR or SIEM suites close the gap quickly, Torq must continue proving that it
      delivers differentiated workflow execution and not just a different wrapper on the same triage problem. Until
      then, the right posture is to treat the company as promising but still evidence-heavy. The kill criteria are
      therefore less about a single bad quarter and more about a durable loss of product differentiation.
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR012
    tableRefs:
      - TR003

tables:
