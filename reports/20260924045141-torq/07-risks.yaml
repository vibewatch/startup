    title: Regulatory / legal risk register
    enumerationScope:
      coverage: partial
      basis: Public Torq risks and limitations surfaced in competitor pages, review sites, official product updates, and funding coverage; the list is representative rather than exhaustive.
    columns:
      - Risk
      - Why it matters
      - Evidence
      - Severity
      - Mitigation
    rows:
      - ["SaaS-only deployment", "Limits fit for air-gapped or on-prem buyers", "Swimlane comparison page", "High", "Prove enough control for regulated buyers"]
      - ["AI trust / black-box concerns", "Autonomy still needs explainability", "Techzine / KuppingerCole commentary", "High", "Keep human-in-the-loop controls visible"]
      - ["Reporting and dashboard friction", "Can slow adoption in mature SOCs", "PeerSpot and competitor pages", "Medium", "Keep shipping governance and reporting features"]
      - ["Competition from suite incumbents", "Native AI in XDR/SIEM can commoditize the wedge", "PeerSpot / market commentary", "High", "Deepen workflow differentiation"
      ]
      - ["Founder concentration", "Leadership risk if a founder departs", "Company page / public profile", "Medium", "Broaden visible leadership bench"]
      - ["Disclosure opacity", "ARR, margins, burn, and NRR are not public", "News coverage", "High", "Improve investor transparency in the data room"]
      - ["Premium valuation", "Leaves less room for execution misses", "Series D coverage", "High", "Maintain growth and expansion pace"]
      - ["Federal-market execution", "Compliance timelines can slip", "Series D / InfoSec coverage", "Medium", "Use Merlin's market access effectively"]
      - ["Customer concentration unknowns", "No public concentration data", "No disclosure", "Medium", "Surface retention and top-customer mix"]
      - ["Integration maintenance burden", "Many connectors create operational load", "Product updates / official site", "Medium", "Invest in reliability and testing"]
    notes: >-
      The table emphasizes issues that are visible in public sources. It intentionally separates market risk from
      disclosure risk because the latter is a diligence limitation, not just a product problem.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR007
      - CR009

  - id: TR002
    title: Risk layering table
    columns:
      - Layer
      - What can go wrong
      - Why it matters
      - Mitigation
    rows:
      - ["Product", "Deployment and AI-trust friction", "Can slow early adoption", "Show controls and governance"]
      - ["Financial", "Opacity on ARR and margins", "Makes underwriting difficult", "Request the data room bridge"]
      - ["Execution", "Hiring and federal-market complexity", "Raises burn and timing risk", "Stage spending carefully"]
      - ["Strategic", "Native AI commoditization", "Could shrink the wedge", "Deepen workflow differentiation"]
    notes: >-
      This table separates product, financial, execution, and strategic risks so the public evidence stays organized.
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR009

  - id: TR003
    title: Risk trigger table
    columns:
      - Trigger
      - What would change
      - Why it matters
      - Response
    rows:
      - ["Deployment flexibility gap persists", "Regulated deals slow or stall", "Limits TAM and velocity", "Broaden control options"]
      - ["Retention data disappoints", "Expansion thesis weakens", "Raises valuation pressure", "Reprice the risk"]
      - ["Suite vendors close the AI gap", "Feature parity increases", "Commoditization risk rises", "Lean harder into workflow depth"]
    notes: >-
      The table highlights the few events most likely to change Torq's risk profile quickly.
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR009

