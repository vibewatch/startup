    title: Valuation scenarios and comparable lens
    columns:
      - Case
      - Read-through
      - Indicative valuation view
      - What has to be true
      - Risk
    rows:
      - ["Bear", "Growth slows and suite vendors compress the wedge", "Below current price support", "No public ARR proof and weaker adoption", "High"]
      - ["Base", "Torq keeps growing but at a more normal rate", "Around current valuation", "Strong ARR and retention data in the data room", "High"]
      - ["Bull", "Torq becomes a category leader in AI SOC", "Premium to current valuation", "Defensible workflow moat plus federal traction", "Medium"]
      - ["Public-comp lens", "Strategic rather than strict multiples", "Premium private-market pricing", "Comparable category leadership evidence", "High"]
      - ["Proof requirement", "Need operating metrics", "Cannot fully underwrite", "ARR, margin, NRR, and concentration", "High"]
      - ["Entry posture", "Wait for more visibility", "Track until diligence closes", "Better data room or lower price", "Medium"]
      - ["Downside trigger", "Native AI closes the gap", "Re-rate risk", "Feature parity from incumbents", "High"]
      - ["Upside trigger", "Agentic automation proves durable", "Multiple expansion", "Repeatable enterprise expansion", "Medium"]
      - ["Customer proof", "Named logos and quotes exist", "Supports premium", "Production usage broadens", "Medium"]
      - ["Financial proof", "Still opaque", "Blocks precision", "Need audited metrics", "High"]
    notes: >-
      Scenario labels are intentionally qualitative because public ARR is not disclosed. This table should be read as
      a valuation framework, not a mathematical forecast.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV009
      - CV013

  - id: TV002
    title: Valuation skepticism table
    columns:
      - Source
      - Concern
      - Valuation read-through
    rows:
      - ["The Register", "AI security premiums can assume too much execution", "Keep a discount for disclosure opacity"]
      - ["Ars Technica", "Autonomous SOC claims still need production proof", "Do not overpay for narrative alone"]
      - ["Torq's own Series D release", "Growth is real but financially opaque", "Premium is possible, but only with diligence"]
    notes: >-
      This table pairs bullish and skeptical evidence so the chapter stays anchored to public proof rather than
      extrapolation.
    claimRefs:
      - CV003
      - CV005
      - CV013

  - id: TV003
    title: Diligence gate table
    columns:
      - Ask
      - Why it matters
      - If positive, then
      - If negative, then
    rows:
      - ["ARR bridge", "Shows whether the revenue base is real and growing", "Support a fuller valuation case", "Keep the rating at track"]
      - ["NRR / churn", "Reveals product stickiness", "Reduce downside discount", "Treat the premium as fragile"]
      - ["Gross margin", "Shows if growth is efficient", "Validate scale economics", "Assume more dilution risk"]
      - ["Customer concentration", "Exposes account-level risk", "Support a wider moat thesis", "Apply a larger haircut"]
    notes: >-
      The table focuses on the minimum evidence Torq needs to graduate from interesting growth story to better
      underwritten asset.
    claimRefs:
      - CV008
      - CV011
      - CV012

