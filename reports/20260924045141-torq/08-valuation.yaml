chapter:
  number: 8
  title: Valuation
  summary: >-
    Torq looks like a strong but expensive private cybersecurity asset: the product and customer story justify a
    premium, yet the lack of public ARR, margins, and retention data prevents a clean underwriting case. The right
    valuation stance is stretched, with a track recommendation rather than a bullish entry call.
sections:
  - id: thesis-and-antithesis
    title: Investment Thesis and Antithesis
    body: >-
      The bull case is straightforward: Torq sits in a growing AI SOC category, has credible enterprise traction,
      and is shipping product at a fast pace. The bear case is also straightforward: public financial detail is thin,
      the platform still has to prove it can defend against suite incumbents, and the company is priced like a winner
      already. Those two forces pull in opposite directions, which is why the name sits closer to "track" than
      "buy" for a public-evidence-only diligence pass. Skeptical coverage also warns that AI-security valuations
      can get ahead of execution, so Torq's premium needs to be earned rather than assumed.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV013
    tableRefs:
      - TV001

  - id: valuation-context
    title: Valuation Context and Comparable Lens
    body: >-
      Torq's $1.2 billion Series D valuation is high on any private-market lens, especially because ARR is not public.
      A strict multiple comparison is therefore not possible, so the cleanest comparison set is strategic: vendor
      category fit, customer proof, product velocity, and the ability to keep growing against larger suites. Public
      comparables and financing pages show that the market is willing to pay for category leadership in AI SOC, but
      the premium only holds if Torq keeps proving it is more than a feature layer. The decision point is whether
      the company can convert product momentum into a durable operating model before the market discounts the AI
      SOC category as another security-suite feature race.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
    figureRefs:
      - FV001
    tableRefs:
      - TV002

  - id: recommendation
    title: Recommendation, Confidence, and Diligence Ask
    body: >-
      The recommendation remains track with medium confidence. Torq has enough evidence of real usage, real logos,
      and real product momentum to avoid an avoid call, but not enough public financial depth to justify a cleaner
      positive call. The main diligence ask is simple: validate ARR, retention, customer concentration, and margin
      structure in the data room before assuming the current premium is fully earned. If those metrics come back
      strong, the current valuation can be defended; if they do not, the premium becomes hard to justify.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
    tableRefs:
      - TV003

tables:
