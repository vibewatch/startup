      - number: '6.2'
        title: Adoption Evidence and Use Cases
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are production usage and concrete workflow examples. Torq's own site and
              customer stories describe large daily automation volumes, rapid deployment of AI agents, and SOC workflows
              that span phishing triage, alert handling, remediation, and incident response. Partner coverage reinforces
              this by framing Torq as an operating layer for MSSPs and adjacent security platforms rather than a
              demo-only product. The implication is that Torq has real users, not just design partners. That said, the
              evidence is still mostly point-in-time and logo-based, so the public record supports adoption but not yet
              a full cohort analysis.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
