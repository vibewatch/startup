      - number: '1.2'
        title: Founders, Leadership, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Torq was founded by Ofer Smadari, Leonid Belkind, and Eldad Livni, who remain the company's visible senior
              leadership bench. The three founders bring prior security-company experience and have continued to anchor
              the company narrative through its scale-up phase. That structure is a strength because it keeps product
              direction close to the original operating thesis, but it also creates key-person concentration: the
              product, technical, and commercial story still depends heavily on the founding team. Public governance
              detail remains limited, so outside diligence has less to work with than it would for a public company or a
              later-stage private issuer.
            claimRefs:
              - CO006
