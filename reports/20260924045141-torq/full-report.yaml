              - CO009
      - number: '1.3'
        title: Funding History, Scale, and Recent Milestones
        blocks:
          - type: paragraph
            body: >-
              Torq's most recent capital event was a January 2026 Series D that raised $140 million at a $1.2 billion
              valuation and brought cumulative funding to $332 million. The company says the round supports product R&D,
              enterprise expansion, and a push into federal and public-sector markets, with Merlin Ventures providing
              both capital and go-to-market support. Since the last refresh window, Torq has also shipped Agentic
              Builder, expanded product updates across cases and reporting, and described SOC Brain as a new
              self-learning layer on top of the platform. The combination of funding, product cadence, and customer
              scale suggests the company is still in a rapid investment-and-expansion phase rather than a maturity
              phase.
