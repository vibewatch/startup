              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.3'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Demand is being driven by alert fatigue, staffing pressure, 24x7 coverage gaps, and the need to
              operationalize security data already being collected by SIEM and XDR tools. The main constraints are
              governance, deployment flexibility, and trust: enterprise teams still want explainability, role controls,
              and an audit trail before they let AI act autonomously. Because public market sizing is inconsistent and
              Torq does not disclose enough economics for a clean top-down model, the right diligence posture is
              evidence-constrained rather than precise. That makes the addressable market large but not tightly
              quantifiable from public evidence alone. The public evidence supports a real category with real demand,
              but it still does not support a precise numeric sizing thesis without extra diligence.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Torq competes against both direct AI SOC specialists and larger security vendors that can deliver
              automation as part of a broader platform. Swimlane is the clearest direct comparator in the public
              materials we reviewed, while PeerSpot users regularly compare Torq to Microsoft Sentinel, Palo Alto Cortex
              XSOAR, and other enterprise automation stacks. Torq's strength is the combination of agentic AI,
              integrations, and workflow speed; its weaker public posture is deployment flexibility, because competitors
              promote on-prem or air-gapped options that Torq does not foreground. That leaves Torq looking strong on
              product velocity but less complete on deployment optionality.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
      - number: '3.2'
        title: Differentiation, Switching Costs, and Distribution
        blocks:
          - type: paragraph
            body: >-
              The main reasons Torq can win are workflow depth, AI-assisted builder experiences, and a channel ecosystem
              that helps it reach large enterprises and MSSPs. The main reasons it can lose are feature parity pressure,
              reporting and governance concerns, and incumbent distribution power from vendors already sitting inside
              the security stack. In practice, this means Torq looks more like a fast-growing specialist than a category
              monopolist. Buyers that value speed and AI-assisted authoring are likely to prefer Torq; buyers that value
              deployment control or audited governance may prefer a more conservative incumbent. The key question is
              whether workflow depth creates enough switching cost to offset the bigger vendors' distribution reach.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Substitutes, Commoditization, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The biggest threat is not a single rival; it is commoditization. As XDR and SIEM vendors add more native
              AI triage, Torq must defend a software wedge that can look increasingly similar to adjacent products.
              User-review sites and competitor marketing pages also point to practical friction around reporting,
              learning curve, and deployment control. Those are not existential weaknesses, but they are enough to keep
              Torq in the "prove it" bucket rather than the "category winner" bucket. The risk is less a single rival
              and more the steady pressure of features becoming interchangeable over time.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
