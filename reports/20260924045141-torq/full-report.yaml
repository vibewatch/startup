  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Growth Signals
        blocks:
          - type: paragraph
            body: >-
              Torq sells enterprise security software, but the public record does not disclose a clean pricing sheet or
              audited revenue model. What is visible is the growth narrative: the company says revenue increased by
              roughly 300% in 2025, and third-party coverage repeats that Torq is gaining traction with large
              enterprises and federal-focused investors. The implied economics are strong enough to support a $1.2
              billion valuation, but not transparent enough to underwrite a precise ARR model from public data alone.
              Pricing is still inferred from customer scale, deployment breadth, and contract intensity rather than from
              a published rate card or audited revenue bridge.
