      - - The Register
        - AI security premiums can assume too much execution
        - Keep a discount for disclosure opacity
      - - Ars Technica
        - Autonomous SOC claims still need production proof
        - Do not overpay for narrative alone
      - - Torq's own Series D release
        - Growth is real but financially opaque
        - Premium is possible, but only with diligence
    notes: >-
      This table pairs bullish and skeptical evidence so the chapter stays anchored to public proof rather than
      extrapolation.
    claimRefs:
      - CV003
      - CV005
      - CV013
  - id: TV003
    title: Diligence gate table
    columns:
      - Ask
      - Why it matters
      - If positive, then
      - If negative, then
    rows:
      - - ARR bridge
        - Shows whether the revenue base is real and growing
        - Support a fuller valuation case
        - Keep the rating at track
      - - NRR / churn
        - Reveals product stickiness
        - Reduce downside discount
        - Treat the premium as fragile
      - - Gross margin
        - Shows if growth is efficient
        - Validate scale economics
        - Assume more dilution risk
      - - Customer concentration
        - Exposes account-level risk
        - Support a wider moat thesis
        - Apply a larger haircut
    notes: >-
      The table focuses on the minimum evidence Torq needs to graduate from interesting growth story to better
      underwritten asset.
    claimRefs:
