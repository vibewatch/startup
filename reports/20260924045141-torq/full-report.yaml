        title: Capital Structure, Runway, and Use of Proceeds
        blocks:
          - type: paragraph
            body: >-
              The company has raised capital in enough size to keep scaling, but the latest public data still leaves the
              cash profile opaque. The Series D was explicitly framed as funding for R&D, go-to-market expansion, and
              federal market entry. That means the round was at least as much about growth acceleration as balance-sheet
              support. Because there is no public burn or runway disclosure, diligence should assume another financing
              cycle is likely if the company continues to spend heavily on hiring and federal readiness. The capital
              base is meaningful, but the real question is whether the company can convert the round into durable
              operating leverage before expansion costs outrun the growth story.
            claimRefs:
              - CI005
