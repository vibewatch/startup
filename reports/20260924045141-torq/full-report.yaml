  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status Quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than classic SOAR. Torq competes in the overlap of security orchestration,
              security case management, AI SOC, and workflow automation for SecOps. The status quo alternatives are
              manual analyst work, legacy SOAR platforms, ticketing-based process chains, and single-vendor automation
              embedded in SIEM/XDR stacks. Torq's own positioning, analyst commentary, and competitor comparisons all
              point to the same market boundary: buyers are purchasing automation that can execute work, not just
              summarize alerts. In practice, that means the category is defined by actionability, governance, and
              integration depth more than by a single SOAR label.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.2'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Torq's best-fit buyers are enterprise SOC leaders, MSSP operators, and regulated organizations that need
              repeatable investigations, strong integrations, and a clear path from triage to response. The adoption
              path generally starts with a bounded alert- or case-heavy workflow, then expands into more autonomous
              response once the team trusts the controls and audit trail. Analyst commentary repeatedly stresses that
              buyers care less about the underlying model and more about workflow design, guardrails, and proof that the
              platform can show its work. The segmentation is therefore less about company size alone and more about how
              much operational discipline the buyer already has in the SOC.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
