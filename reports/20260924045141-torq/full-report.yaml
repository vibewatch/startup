  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segment Mix
        blocks:
          - type: paragraph
            body: >-
              Torq's stated customer base spans Fortune 500 enterprises, regulated organizations, and managed security
              partners. The company names Marriott, PepsiCo, Procter & Gamble, Siemens, Uber, Virgin Atlantic,
              Valvoline, Check Point, Chipotle, Armis, Informatica, Wiz, and others in public material. Those names
              signal that Torq is not a small-team tool: it is being deployed where the SOC is already a large,
              business-critical function. The customer list also suggests that Torq is moving beyond a single vertical
              and into multiple enterprise motions, which is important because breadth usually matters as much as logo
              quality at this stage.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
