              - CV002
              - CV005
              - CV009
              - CV010
      - number: '8.3'
        title: Recommendation, Confidence, and Diligence Ask
        blocks:
          - type: paragraph
            body: >-
              The recommendation remains track with medium confidence. Torq has enough evidence of real usage, real
              logos, and real product momentum to avoid an avoid call, but not enough public financial depth to justify
              a cleaner positive call. The main diligence ask is simple: validate ARR, retention, customer
              concentration, and margin structure in the data room before assuming the current premium is fully earned.
              If those metrics come back strong, the current valuation can be defended; if they do not, the premium
              becomes hard to justify.
            claimRefs:
              - CV009
