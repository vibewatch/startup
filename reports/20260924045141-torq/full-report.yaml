  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow
        blocks:
          - type: paragraph
            body: >-
              Torq is a cloud-delivered security operations platform that sits between detection and response. It
              ingests alerts and events, normalizes them into cases, automates investigation steps, and can trigger
              response actions across connected tools. In the company's 2026 product updates, Socrates can now both
              investigate and build, which pushes Torq from a workflow engine toward a more agentic authoring
              environment. That shift matters because it reduces the amount of manual playbook coding a SOC team has to
              do. It also makes the product more legible to operational teams that want to author and audit workflows in
              the same place.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE009
      - number: '5.2'
        title: Architecture, Integrations, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The platform still depends on integrations and reusable workflow primitives. Official updates mention
              hundreds of connectors, scheduled reports, notification inboxes, case dashboards, org-managed roles, group
              assignment, and step-runners. The technical pattern is clear: Torq wants to be the control plane for
              security workflows, not just the alert console. That gives the product a real systems advantage if the
              integrations are reliable, because the value compounds as customers wire more of their security stack into
              the platform. The flip side is that every connector adds reliability work, so product quality depends on
              ongoing maintenance discipline.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
