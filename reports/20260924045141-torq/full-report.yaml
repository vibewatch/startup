      - number: '4.3'
        title: What the Public Record Still Does Not Show
        blocks:
          - type: paragraph
            body: >-
              The biggest financial gap is the absence of audited operating metrics. Torq does not publicly disclose
              ARR, gross margin, customer concentration, or retention cohorts. That means investors have to price the
              company off funding multiples, growth claims, and strategic position rather than a defensible financial
              model. The result is a high-growth, high-opacity profile: attractive if the operating story is real, but
              still difficult to underwrite with the precision one would want before a large private-market entry.
              Skeptical coverage also reminds readers that AI-security valuations can outrun disclosed fundamentals, so
              the margin for error stays tight until the data room fills in the missing numbers.
