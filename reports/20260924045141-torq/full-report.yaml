chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Torq is a private cybersecurity company founded in 2020 and headquartered in New York, with its main R&D
              base in Israel. It sells an AI SOC platform that combines hyperautomation, agentic AI, and workflow
              orchestration to help security teams triage, investigate, and respond to threats. The business is
              delivered as enterprise software and is positioned as a replacement for legacy SOAR tooling, with a
              SaaS-first operating model and a wide integration layer spanning SIEM, EDR, identity, cloud, and IT
              systems. Torq's own site and product pages emphasize self-service automation, AI-assisted investigation,
              and SOC workflow execution rather than point tools.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
