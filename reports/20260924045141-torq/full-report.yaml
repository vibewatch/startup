            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU009
              - CU010
      - number: '6.3'
        title: Retention, Expansion, and Concentration Gaps
        blocks:
          - type: paragraph
            body: >-
              The public record does not show cohort retention, NRR, or churn, so the quality of the customer base has
              to be inferred from named logos and usage claims. That creates a gap: a company can have strong logo
              counts without proving expansion economics. The channel story also creates a second concentration risk
              because some of the growth is likely to flow through MSSP and partner relationships that are not fully
              disclosed. Net: the customer base looks real and growing, but not yet fully measurable from public
              evidence. The key diligence question is whether the visible usage translates into durable expansion, or
              whether the company is still carrying too much of its growth story in anecdotes rather than metrics.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
