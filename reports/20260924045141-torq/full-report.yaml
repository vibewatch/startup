  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Product, Deployment, and Market Risks
        blocks:
          - type: paragraph
            body: >-
              The clearest risk is that Torq's public narrative leads with SaaS-delivered agentic AI just as many
              regulated buyers still ask for deployment control and auditability. Competitor comparison pages lean hard
              into that gap, and user-review data shows that Torq still has learning-curve and reporting complaints.
              That does not make the product weak, but it does mean adoption can stall when buyers compare it to
              platforms that feel safer to govern. In other words, Torq is selling a more advanced promise into a market
              that still wants a conservative proof set, especially in regulated environments where proof can matter
              more than novelty today.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
      - number: '7.2'
        title: Financial, Execution, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Torq is also exposed to standard scale-up risks: expensive hiring, premium valuation expectations, and a
              need to keep product velocity high while expanding into federal and public-sector markets. The customer
              record is real, but public evidence does not show NRR, churn, or concentration, so the quality of revenue
              remains partly hidden. Finally, Torq's founder-led narrative is a strength and a concentration risk at the
              same time. The financial risk is not that the business is fictitious; it is that the public evidence is
              still too thin to determine how resilient the growth story really is. Until those metrics are visible, the
              company remains a good business story with an incomplete risk map.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
              - CR010
      - number: '7.3'
        title: Strategic Triggers and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The most important strategic trigger is whether native AI from larger security vendors erodes the need for
              a dedicated automation layer. If XDR or SIEM suites close the gap quickly, Torq must continue proving that
              it delivers differentiated workflow execution and not just a different wrapper on the same triage problem.
              Until then, the right posture is to treat the company as promising but still evidence-heavy. The kill
              criteria are therefore less about a single bad quarter and more about a durable loss of product
              differentiation.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Antithesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Torq sits in a growing AI SOC category, has credible enterprise
              traction, and is shipping product at a fast pace. The bear case is also straightforward: public financial
              detail is thin, the platform still has to prove it can defend against suite incumbents, and the company is
              priced like a winner already. Those two forces pull in opposite directions, which is why the name sits
              closer to "track" than "buy" for a public-evidence-only diligence pass. Skeptical coverage also warns that
              AI-security valuations can get ahead of execution, so Torq's premium needs to be earned rather than
              assumed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV009
              - CV013
      - number: '8.2'
        title: Valuation Context and Comparable Lens
        blocks:
          - type: paragraph
            body: >-
              Torq's $1.2 billion Series D valuation is high on any private-market lens, especially because ARR is not
              public. A strict multiple comparison is therefore not possible, so the cleanest comparison set is
              strategic: vendor category fit, customer proof, product velocity, and the ability to keep growing against
              larger suites. Public comparables and financing pages show that the market is willing to pay for category
              leadership in AI SOC, but the premium only holds if Torq keeps proving it is more than a feature layer.
              The decision point is whether the company can convert product momentum into a durable operating model
              before the market discounts the AI SOC category as another security-suite feature race.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV013
          - type: figure
