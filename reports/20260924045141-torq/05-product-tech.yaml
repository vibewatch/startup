chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Torq's product story in 2026 is a move from automation platform to agentic AI SOC workspace. The platform now
    centers on Builder and Investigator flows, richer case management, reporting, and multi-agent learning layers,
    while maintaining the integration-heavy automation foundation that made the company attractive in the first
    place.
sections:
  - id: product-definition
    title: Product Definition and Workflow
    body: >-
      Torq is a cloud-delivered security operations platform that sits between detection and response. It ingests
      alerts and events, normalizes them into cases, automates investigation steps, and can trigger response actions
      across connected tools. In the company's 2026 product updates, Socrates can now both investigate and build,
      which pushes Torq from a workflow engine toward a more agentic authoring environment. That shift matters
      because it reduces the amount of manual playbook coding a SOC team has to do. It also makes the product more
      legible to operational teams that want to author and audit workflows in the same place.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001

  - id: architecture-and-integrations
    title: Architecture, Integrations, and Operating Model
    body: >-
      The platform still depends on integrations and reusable workflow primitives. Official updates mention hundreds
      of connectors, scheduled reports, notification inboxes, case dashboards, org-managed roles, group assignment,
      and step-runners. The technical pattern is clear: Torq wants to be the control plane for security workflows,
      not just the alert console. That gives the product a real systems advantage if the integrations are reliable,
      because the value compounds as customers wire more of their security stack into the platform. The flip side is
      that every connector adds reliability work, so product quality depends on ongoing maintenance discipline.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
    figureRefs:
      - FE001
    tableRefs:
      - TE002

  - id: maturity-and-differentiation
    title: Maturity, Differentiation, and Technical Risk
    body: >-
      Torq's differentiation is strongest where it blends AI with deterministic workflow execution. The company has
      begun to describe multi-agent learning, context graphs, and natural-language builder workflows, which makes the
      platform feel more modern than classic SOAR. The remaining risks are familiar: cloud-only delivery, the burden
      of keeping many connectors healthy, and the possibility that competitors can copy the surface features faster
      than Torq can deepen its moat. Product maturity is good enough for large enterprises, but the evidence still
      suggests rapid iteration rather than a fully settled platform. That makes the product compelling, but it also
      leaves room for competitors to catch up if Torq stops shipping quickly.
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003

