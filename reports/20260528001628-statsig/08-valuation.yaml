tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why it matters
  - Decision implication
  rows:
  - - Recommendation
    - avoid new capital / closed strategic outcome
    - The business is already inside OpenAI and the operating platform is being run with Amplitude.
    - Treat Statsig as a realized strategic case, not an open late-stage opportunity.
  - - Confidence
    - medium
    - The headline valuation anchors are real, but critical private metrics and terms remain undisclosed.
    - Use ranges and buyer-specific logic rather than precise intrinsic-value claims.
  - - Risk rating
    - high for a new financial investor
    - There is no disclosed markup above the Series C and no clean standalone upside remains.
    - Do not underwrite a new entry off the old $1.1B mark.
  - - Valuation stance
    - fair for a strategic buyer, stretched for a financial buyer
    - OpenAI actually paid $1.1B, but public comps do not support that price for ordinary financial buyers.
    - Frame the mark as validated strategically, not as obviously cheap.
  - - What validates the price
    - strategic scarcity in experimentation infrastructure
    - Datadog had explored a deal, OpenAI paid $1.1B, and experimentation assets were consolidating.
    - Acknowledge that scarcity value existed even if public multiples were lower.
  - - What would change the call
    - disclosed retention, margins, terms, and post-close economics
    - Those metrics could show whether the headline mark carried hidden downside or hidden quality.
    - Absent that evidence, stay on the sidelines.
  notes: This is a buyer-specific judgment table. The same $1.1B price can be fair for a strategic acquirer and unattractive for a new financial investor.
