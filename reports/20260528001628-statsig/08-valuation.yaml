- id: financing-context-and-capital-history
  title: Financing context and capital history
  body: The financing chronology is unusually clean at the headline level but still opaque in the details that matter most for late-stage underwriting. Statsig announced a $100 million Series C at a $1.1 billion valuation in May 2025, and Sacra’s retained summary says the round mixed $80 million of new primary capital with $20 million of employee secondary liquidity. That matters because the implied new-money dilution was only around 7% to 8% if the $1.1 billion number was post-money, which is modest for a round of that size, while the rest of the transaction was holder liquidity rather than company financing. Sacra also puts lifetime funding at about $153.4 million across the Series A, Series B, and Series C. Then OpenAI agreed to buy Statsig for the same $1.1 billion later in 2025, which validates the round price for a strategic buyer but shows no disclosed markup above it. What public sources still do not show is the preference stack, liquidation waterfall, or participation rights that
    would tell outside investors whether the headline mark was economically cleaner or harsher than it looked.
