company:
  name: Statsig
chapter:
  number: 8
  title: Valuation
  summary: 'Statsig’s last disclosed price-setting events both landed at $1.1 billion: the May 2025 Series C and the September 2025 OpenAI acquisition. On the only public ARR estimate retained here—about $40 million—the anchor implies roughly 27.5x ARR, far above Amplitude’s public multiple and still above Datadog’s much larger and more profitable platform multiple. That makes the price fair for a strategic buyer who wanted scarce experimentation infrastructure, but unattractive for a new financial investor, especially now that Statsig sits inside OpenAI while Amplitude operates the platform and customer base.'
sections:
- id: investment-thesis-antithesis
  title: Investment thesis and anti-thesis
  body: The best case for Statsig’s valuation was always strategic, not purely financial. The company assembled a broad product-development stack that combined feature releases, experimentation, analytics, performance monitoring, and session replay, and it sold that stack through a usage-based model that could run either in Statsig’s cloud or warehouse-native on customer infrastructure. Third-party estimates put the business at roughly $40 million of ARR around the May 2025 Series C, with more than 300 paying customers and over 1 trillion daily events, while customer references said buyers evaluated incumbents such as Optimizely, LaunchDarkly, Split, and Eppo before choosing Statsig for integrated workflows. Those are real proof points. The anti-thesis is that none of the retained public sources disclose net retention, gross margin, churn, or the exact Series C terms, so the public record cannot prove that a 27.5x ARR price was justified for a financial investor rather than for a strategic
    acquirer seeking scarce experimentation infrastructure.
