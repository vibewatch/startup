- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-breaks, and final diligence asks
  body: 'The unresolved work is concentrated exactly where valuation confidence should live: revenue quality, round terms, and the economics of the post-close operating structure. Retained sources do not disclose Statsig’s net retention, gross margin, churn, cohort expansion, or preference stack, and they do not explain how economics, customer rights, support obligations, and IP stewardship now sit across OpenAI and Amplitude. Those omissions matter because they determine whether the $1.1 billion headline represented disciplined strategic underwriting or simply a buyer willing to pay up for people and positioning. The practical diligence path is therefore narrow and concrete. A buyer would need the Series C and sale documents, a cohort-level ARR and retention bridge, and the exact OpenAI-Amplitude transition agreement before treating the old mark as reusable precedent. Without that data, the case belongs in the ‘observed strategic outcome’ bucket rather than the ‘repeatable valuation benchmark’
    bucket.'
