- id: TV007
  title: Capital history / dilution bridge
  columns:
  - Event
  - Capital amount
  - Headline valuation / status
  - Approximate ownership or dilution signal
  - Implication
  rows:
  - - Series A (2021)
    - ~$10.4M
    - Valuation undisclosed in retained public sources
    - Early sponsor capital; ownership effects not public
    - Established Sequoia and Madrona as recurring backers.
  - - Series B (2022)
    - ~$43M
    - Valuation undisclosed in retained public sources
    - Growth capital before the 2025 price reset
    - Built the company to the point where a unicorn round later became possible.
  - - Series C primary capital (2025)
    - ~$80M
    - Part of $100M round at $1.1B
    - ~7.3% of post-money equity if the $1.1B figure was post-money
    - Headline dilution looks modest for a round that created a unicorn valuation.
  - - Series C secondary liquidity (2025)
    - ~$20M
    - Part of same $100M transaction
    - Transfers ownership but does not dilute the company
    - Shows the round also served employee liquidity rather than only balance-sheet funding.
  - - Total raised through sale
    - ~$153.4M
    - OpenAI later agreed to buy Statsig for $1.1B
    - Raised capital equals roughly 14% of sale value
    - Suggests decent capital efficiency, though waterfall economics remain undisclosed.
  notes: Dilution math is approximate because retained public sources do not disclose the full cap table or exact pre-money terms; the 7.3% figure assumes the reported $1.1B valuation was post-money and only the $80M primary piece diluted the company.
