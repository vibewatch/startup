- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumption
  - Valuation logic
  - Value range (USD billions)
  - Probability signal
  rows:
  - - Bear
    - No strategic buyer emerges, public-software comps dominate, and the business is judged on ~$40M ARR without premium scarcity value.
    - 10x-17.5x ARR range implied by high-growth but non-strategic software outcomes.
    - 0.4-0.7
    - Would have been likely if Datadog never approached and OpenAI had not paid a strategic price.
  - - Base / realized
    - A strategic buyer values experimentation infrastructure and clears the same price as the Series C.
    - Realized 27.5x ARR on the retained ~$40M ARR estimate.
    - 1.0-1.2
    - 'This is the observed outcome: OpenAI agreed to pay $1.1B and no higher public mark followed.'
  - - Bull
    - ARR grows well beyond the retained ~$40M estimate or multiple strategic bidders compete for the asset.
    - Needs materially higher ARR or another scarcity-driven auction to support value above the realized deal.
    - 1.4-1.8
    - Would have required either faster disclosed scale-up or another strategic bidder willing to pay above OpenAI.
  notes: The base case is anchored on the realized strategic sale, while the bear and bull cases are counterfactual underwriting ranges.
