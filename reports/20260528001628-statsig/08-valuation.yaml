- id: scenario-analysis
  title: Scenario analysis and realized outcome
  body: 'The cleanest way to frame Statsig’s valuation is to separate the realized strategic outcome from the counterfactual financial-buyer cases. On the retained ~$40 million ARR estimate, a 10x multiple would have implied about $400 million of equity value, 15x would have implied about $600 million, and 20x would have implied about $800 million. The actual outcome—first the Series C and then the OpenAI transaction—cleared at 27.5x ARR, or $1.1 billion. That makes the realized base case easy to describe: a strategic buyer was willing to pay the scarcity premium, but no public source shows a markup beyond that. The bear case is what the company likely would have faced without a strategic acquirer and with public software multiples still setting the outer boundary. The bull case would have required either a much higher ARR base than the retained $40 million estimate or a second strategic bidder willing to pay up even further. As of runDate, the realized $1.1 billion outcome looks like the
    most relevant anchor, not a springboard to another private mark-up.'
