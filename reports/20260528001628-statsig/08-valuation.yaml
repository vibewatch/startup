- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it breaks the thesis
  - Action implication
  rows:
  - - No clean continuity between OpenAI and Amplitude
    - Evidence that customer support, roadmap ownership, or IP stewardship is materially fragmented.
    - The strategic-price precedent becomes less reusable if the operating asset is effectively split.
    - Treat the $1.1B mark as a one-off talent or scarcity purchase rather than a repeatable platform value.
  - - Customer quality disappoints
    - Any disclosed churn, weak NRR, or negative cohort data after the transition.
    - A 27.5x ARR price only works if revenue quality is exceptional.
    - Mark the company below the realized $1.1B strategic outcome under a financial-buyer lens.
  - - Hidden round terms are investor-unfriendly
    - Participation rights, senior preferences, or a harsh waterfall materially distort common-holder economics.
    - Headline valuation can overstate the economics of the price actually paid.
    - Discount the precedent and require term-by-term underwriting.
  - - Public comp pressure worsens
    - Amplitude stays depressed and Datadog de-rates while experimentation is treated as a feature, not a platform.
    - The comp gap versus Statsig becomes even harder to defend.
    - Use 10x-20x ARR ranges instead of the realized 27.5x strategic outcome.
  - - Strategic scarcity fades
    - No second bidder, no incremental markup, and no new disclosed metrics that justify paying above OpenAI’s price.
    - The flat realized outcome becomes the ceiling, not a floor.
    - Do not assume upside beyond the historical transaction price.
  notes: These kill triggers are written for investors deciding whether the historical $1.1B outcome can be reused as precedent for a fresh valuation call.
