- id: comparable-set-and-multiple-gap
  title: Comparable set and multiple gap
  body: The public comp gap is severe. Amplitude, the closest public product-analytics reference in the fetched set, reported $374 million of ARR and $93.5 million of Q1 2026 revenue, yet CompaniesMarketCap showed it at only about $0.91 billion of market value in May 2026—roughly 2.4x on that ARR base. Datadog, a much broader observability and developer platform that now includes experimentation assets through Eppo, reported $1.006 billion of Q1 2026 revenue, a 22% non-GAAP operating margin, and a market cap near $78.95 billion, or roughly 19.6x annualized Q1 sales. Statsig’s 27.5x implied ARR multiple therefore sat above both public references despite radically smaller scale and thinner disclosure. Optimizely is useful only as strategic-history context, because Episerver bought it at an undisclosed price in 2020. The closest M&A datapoint in experimentation itself is Datadog’s Eppo deal, where reported consideration was around $220 million but the denominator was undisclosed. In other words,
    the only clean justification for Statsig’s price is strategic scarcity, not ordinary public-comparable math.
