- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Series C and sale terms
    - Preference stack, participation rights, option treatment, and liquidation waterfall across the Series C and OpenAI deal.
    - This determines whether the headline $1.1B figure mapped to common-holder economics or mostly preferred protection.
    - Obtain financing docs and sale documents from counsel and the board data room.
  - - Revenue quality
    - Net retention, logo churn, gross margin, cohort expansion, and customer concentration at the time of sale.
    - These are the metrics that would tell whether 27.5x ARR was disciplined or aggressive.
    - Request the operating model and cohort analyses from finance.
  - - OpenAI-Amplitude transition economics
    - Commercial terms, customer custody, support obligations, and IP rights after Amplitude took over the platform and customer base.
    - The split operating model is the biggest current uncertainty in reusing the precedent.
    - Review the transition services and commercial agreements between OpenAI and Amplitude.
  - - Customer continuity
    - Renewal and expansion behavior for key accounts after the transition, especially named enterprise logos.
    - Continuity evidence would reduce fears that the strategic outcome was mostly a talent acquisition.
    - Run customer references and request post-close account-retention data.
  - - Board and investor outcome
    - How much of the $20M secondary and later sale proceeds went to employees versus earlier investors.
    - This clarifies whether the outcome was merely flat in headline terms or better/worse on a per-holder basis.
    - Request the proceeds waterfall and cap-table bridge from company counsel.
  notes: These asks are ordered by what most directly changes valuation confidence. Each one narrows buyer-specific uncertainty rather than adding generic diligence color.
