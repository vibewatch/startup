  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: Series C and sale documents showing preference stack, option treatment, participation rights, and liquidation waterfall.
    whyItMatters: Headline valuation can materially overstate or understate investor economics when preferences and waterfall terms are hidden.
    diligencePath: Request executed financing documents, board approvals, and the sale waterfall from company counsel.
    relatedQuestionRefs:
    - QV014
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Cohort-level ARR, net retention, logo churn, gross margin, and customer-concentration data around the time of sale.
    whyItMatters: These are the core metrics needed to decide whether 27.5x ARR reflected exceptional software quality or just strategic scarcity.
    diligencePath: Request finance operating model outputs and cohort analyses from management.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: post-close-economics
    missingEvidence: The OpenAI-Amplitude transition agreement covering customer custody, support duties, roadmap ownership, and IP stewardship.
    whyItMatters: Without it, investors cannot tell whether the historical $1.1B outcome belongs to the product, the team, or a split operating structure.
    diligencePath: Review the commercial and transition services agreements between OpenAI and Amplitude.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: minor
    topic: optimizely-valuation
    missingEvidence: A public purchase price or current valuation reference for Optimizely.
    whyItMatters: Optimizely is useful category history, but the missing denominator limits its value as a pricing comp.
    diligencePath: Use paid databases or private transaction materials rather than public web sources.
    relatedQuestionRefs:
    - QV022
    relatedTableRefs:
    - TV004
