companyProfile:
  summary: >
    Statsig is a private developer-tools company founded in 2021 around Vijaye Raji's thesis that product teams should ship, measure, and learn inside one experimentation control plane. Public evidence supports a broad stack spanning feature flags, experimentation, analytics, session replay, and warehouse-native workflows, plus meaningful customer adoption and a $1.1B 2025 valuation anchor. The main caveat is that the business became strategically spoken for quickly: OpenAI announced a $1.1B deal in September 2025, while later public materials point to Amplitude operating the platform and customer base, leaving the standalone investment case largely closed and the long-term ownership structure harder to underwrite from public evidence alone.
  foundedDate: '2021-02-01'
  founders:
    - name: Vijaye Raji
      role: Founder / CEO through 2025 acquisition announcement
      background: Former Microsoft engineer and Facebook/Meta engineering leader whose experimentation background maps directly to Statsig's product thesis.
      claimRefs:
        - CO001
        - CO016
        - CO017
        - CO018
  foundingLocation: Kirkland / Bellevue, Washington, USA
  headquarters: Bellevue, Washington, USA
  productSummary: Statsig sells a usage-based platform that combines feature flags, dynamic configs, experimentation, product analytics, session replay, and warehouse-native analysis with broad SDK coverage and enterprise controls.
  customerFocus: Engineering-led product teams, data scientists, growth teams, and larger software organizations that want one integrated release-and-measurement stack.
  businessModel: Usage-based SaaS with self-serve and enterprise contracts, plus warehouse-native deployment for larger governed environments.
  stage: Series C company with OpenAI acquisition announced in 2025
  fundingStatus: Publicly disclosed funding reached about $153.4M across Series A, B, and a $100M Series C at a $1.1B valuation in May 2025, followed by a signed $1.1B OpenAI transaction announced in September 2025.
