              的全球教育使命，都能证明地理范围够广；但地理分布本身不能化解按客户类型或支出队列划分的集中风险。因此，投资人应把 Statsig
              的公开客户叙事看作：具名证据强，独立性和新鲜度中等，留存和集中度披露偏弱。下一步尽调不是再找更多 Logo，而是拿到带日期的续约案例、前 10 大客户敞口、模块渗透率，以及队列层面的留存或扩张数据。
