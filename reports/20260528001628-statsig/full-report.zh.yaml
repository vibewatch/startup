            body: >-
              公开材料中可见的技术架构以 SDK 介导的运行时评估，加上控制台和 API 控制平面为中心。功能门控、动态配置和实验都被呈现为通过 Statsig SDK 或 API
              发生的运行时检查，事件和曝光日志再进入下游分析。Warehouse Native 改变的是分析在哪里运行，而不是 Statsig 是否参与工作流：公开文档仍依赖 Statsig 控制台做设置、官方 SDK
              做分配，以及一条把暂存表和汇总表写入客户仓库的文档化流程。结果是混合架构，而不是纯无控制平面的设备。对想要托管发布管理加仓库分析的买方，这种混合模型可以是优势；但它也是尽调点，因为 “warehouse
              native” 并不消除围绕分配、摄取、日志回调和中央 API 治理的实施选择。GitHub 代码引用等开发者工具进一步显示，Statsig 试图嵌入日常工程循环，而不只是指标控制台。
