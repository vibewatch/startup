            body: >-
              融资历史比盈利能力更有文档支撑。Tracxn 追踪到三轮已披露融资，合计约 $153 million：2021 年 $10.4 million Series A、2022 年 $43 million Series
              B，以及 2025 年 5 月 $100 million Series C。官方和媒体来源一致认为，Series C 给 Statsig 的估值为 $1.1 billion，由 ICONIQ Growth
              领投，Sequoia 和 Madrona 继续跟投。这轮融资只在几个月后就迎来下一项重大财务事件：OpenAI 于 2025 年 9 月同意以 $1.1 billion 收购 Statsig。GeekWire
              最有财务意义的观察是，收购价与上一轮私人估值持平而非高于它，意味着投资人获得流动性，但没有收购溢价。OpenAI 和 CNBC 还表示，在监管批准和整合推进期间，Statsig 将继续独立运营并从 Seattle
              服务客户。对财务分析来说，问题从纯风险投资现金跑道转为母公司支持下的运营连续性。如果收购按所述条款交割，短期独立融资依赖应大幅下降。代价是，未来外部投资者可见的财务透明度会更差，因为任何交割后经济性更可能落在
