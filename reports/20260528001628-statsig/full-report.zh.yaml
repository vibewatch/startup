      - number: '4.2'
        title: 规模、增长与利润率代理指标
        blocks:
          - type: paragraph
            body: >-
              Statsig 最强的公开财务支撑是方向性规模，而非审计收入。公司 2025 年回顾称，周活用户 20,000、每天处理 3 trillion 事件、通过实验触达 4 billion
              唯一终端用户、实验和功能门控同比增长 2.5 倍，并在 2025 年产生近 7 million 次分析查询。这些产品使用信号让按量计费模型在经济上可信：客户使用更多开关、实验和分析，Statsig
              就有更多方式在账户内扩大收入。第三方营收估计仍混杂。Sacra 和 SiliconANGLE 都指向 2025 年 Series C 前后 ARR 约 $40 million，Growjo 则估计较低的
              $23.7 million 收入运行率。员工数也是区间而非点估计，官方和第三方来源集中在 145 至 170 人左右，GeekWire 称公司计划到 2026 年初接近 200 人。如果 $40 million
              ARR 估计方向正确，这一员工区间支持推导出的 ARR/员工约 $235,000 至 $276,000。含义不是成熟 SaaS
              效率，而是可信的成长期经营杠杆故事；其利润质量仍取决于未知的托管、支持、销售和留存经济性。
