  - id: TP001
    title: 竞品画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 公开规模 / 采用信号
      - 目标买方 / 团队
      - 产品范围
      - 差异化
      - 限制
    rows:
      - - Statsig
        - 集成式实验控制平面
        - 1T+ 次事件 / 天、99.99% 可用性、2.5B 月度实验对象、数千家客户信任
        - 产品、增长、数据和工程团队
        - 分析、实验、功能管理、回放、Web 分析、配置、WHN
        - 集成工作流，加上透明的自助式定价
        - 未见官方自托管部署；可移植性弱于开源对手
      - - LaunchDarkly
        - 治理导向的功能管理老牌厂商
        - 独立评论仍把它视为品类领导者；官方范围覆盖运行时控制和智能体控制
        - 企业工程与平台团队
        - 功能开关、渐进式交付、实验、可观测性、智能体控制
        - 审批、可审计性和发布治理可信度
        - 公开定价到高阶后转为询价，分析广度窄于集成套件
      - - Optimizely
        - 企业实验老牌厂商
        - 信任中心材料强调其在云和本地环境中已有 20 多年安全交付
        - 数字产品、增长和实验团队
        - 功能实验、统计引擎、数据仓库连接、AI 优化
        - 统计工具强，能跨技术栈做实验
        - 公开定价以询价为主，且并非数据仓库原生 / 开源优先
      - - Harness / Split
        - 发布监控与实验老牌厂商
        - Split 品牌仍留在 Harness FME 内；CostBench 突出其成熟的企业归因和广泛 SDK 覆盖
        - 平台、DevOps 和产品团队
        - 功能开关、定向、动态配置、发布监控、实验、数据仓库原生实验
        - 把发布控制与影响数据、发布监控绑定
        - 按用户计费可能快速抬升成本，更宽的 DevOps 平台复杂度也会增加采用摩擦
      - - Amplitude
        - 分析优先的邻近套件
        - 官方定价和信任门户显示，其套件打包很宽，并提供企业级信任展示
        - 产品、增长、高管和分析团队
        - 分析、功能实验、Web 实验、激活、回放、AI 工具
        - 一个套件里同时给 PM 友好的分析和实验
        - 高阶价格仍需定制，部署姿态以 SaaS 优先
      - - GrowthBook
        - 数据仓库原生开源对手
        - 官网显示 3,000+ 家公司、100B+ 次功能开关查询 / 天
        - 技术型产品和数据团队
        - 实验、功能开关、产品分析、数据仓库原生云或自托管
        - 开源、自托管、可预测的席位定价、可审计性
        - 需要用户承担更多搭建责任，分发弱于托管型老牌厂商
      - - Eppo
        - 数据仓库原生实验专家
        - 官网称功能开关支撑每天数十亿次分配；现在被包装为 Datadog Experiments
        - 数据科学、产品、工程和营销团队
        - 实验、功能开关、上下文 bandit、无代码营销测试
        - 零拷贝、数据仓库原生的严谨性，用户级数据不经过平台
        - 定价不透明；已审材料未显示自托管部署
      - - PostHog
        - 开源邻近产品套件
        - 官方定价页显示 60,000+ 客户、10+ 个产品
        - 工程驱动型创业公司和技术型产品团队
        - 分析、回放、功能开关、实验、问卷、数据仓库、工作流
        - 套件范围宽，还有开源和自托管选项
        - 云优先的经济性往往优于自托管；对非技术 PM 工作流优化较弱
      - - VWO
        - 优化与功能实验邻近厂商
        - 安全页显示 3,000+ 客户和广泛合规认证
        - 优化、实验和数字体验团队
        - Web 和移动测试、功能实验、发布、审批、护栏
        - Web 优化工作流强，治理界面完整
        - 不是完整的产品数据操作系统，企业价格基准仍不完整
      - - 内部自建 / 现状
        - 替代方案
        - 没有共同公开规模信号；成本体现为工程时间，或沿用既有分析栈
        - 优先考虑控制权、低前期现金成本或既有技术栈的团队
        - 自建功能开关和实验、OpenFeature 抽象层，或分析加点工具
        - 可移植性和定制贴合度最高
        - 价值兑现慢、持续运营负担重，跨团队治理更难
    notes: 各行综合了保留的官方产品、定价、文档、信任页面，以及部分独立比较证据；表中只列公开采用信号。
