        title: 可比公司和倍数缺口
        blocks:
          - type: paragraph
            body: >-
              公开可比缺口很大。已抓取样本中最接近的上市产品分析参照 Amplitude 报告 ARR 为 $374 million，2026 年 Q1 收入为 $93.5 million，但
              CompaniesMarketCap 显示其 2026 年 5 月市值仅约 $0.91 billion，按 ARR 约 2.4x。Datadog 是更宽的可观测性和开发者平台，现在通过 Eppo
              纳入实验资产；其报告 2026 年 Q1 收入 $1.006 billion、非 GAAP 运营利润率 22%、市值约 $78.95 billion，相当于年化 Q1 销售额约 19.6x。因此，Statsig
              隐含 27.5x ARR 倍数高于两个公开参照，尽管规模小得多、披露也更薄。Optimizely 只适合作为战略历史背景，因为 Episerver 在 2020 年收购它时价格未披露。实验领域最接近的 M&A
              数据点是 Datadog 收购 Eppo，据报道对价约 $220 million，但分母未披露。换句话说，Statsig 价格唯一干净的理由是战略稀缺，而不是普通的公开可比数学。
