      - number: '8.5'
        title: 建议和估值立场
        blocks:
          - type: paragraph
            body: >-
              截至 2026-05-28，新财务投资人的正确决策是回避，不是因为 Statsig 产品质量不足，而是因为可投资的独立上行空间实际上已经关闭。OpenAI 同意以 $1.1 billion
              收购公司，Amplitude 随后宣布将接管 Statsig 品牌、客户和平台运营，同时与 OpenAI 团队协作。这意味着最重要的经济结果已经确定，运营未来至少分裂在两个交易对手之间。如果问题是旧的 $1.1
              billion 标记是否荒唐，答案是否定的：战略买家确实支付了这个价格。如果问题是，对于希望获得额外上行空间的新后期投资人，这个标记是否有吸引力，答案也是否定的：没有披露高于 Series C
              的升值，公开可比仍低得多，足以支撑更高价格的缺失指标也从未公开。因此，估值立场是：对战略买家合理，对财务买家偏高；现在除了作为战略估值的已关闭案例研究，已不可操作。
