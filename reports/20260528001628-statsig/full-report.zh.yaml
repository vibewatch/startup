  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑和反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Statsig 估值最强的理由一直是战略价值，而不是纯财务逻辑。公司拼出了一套广泛的产品开发栈，把功能发布、实验、分析、性能监控和会话回放放在一起，并用按量计费模式销售；部署既可跑在 Statsig
              云端，也可用仓库原生方式跑在客户基础设施上。第三方估计显示，2025 年 5 月 Series C 前后，公司 ARR 大约 $40 million，付费客户超过 300 家，日事件量超过 1
              trillion；客户案例称，买家在选择 Statsig 的整合工作流前，也评估过 Optimizely、LaunchDarkly、Split 和 Eppo
              等既有厂商。这些都是真实证据点。反向逻辑在于，保留下来的公开来源没有披露净留存、毛利率、流失或 Series C 的确切条款，因此公开记录无法证明，对于财务投资人而言，27.5x ARR
              价格是合理的；它更像战略买家为稀缺实验基础设施支付的价格。
