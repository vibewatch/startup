              Statsig 抓取到的客户包显示出宽度，但并非随机或均匀分布。具名案例集中在产品主导的软件和互联网业务，这些场景每天都需要发布控制、实验节奏和产品分析：Notion、Webflow 等生产力与协作平台；Brex
              等金融科技和金融软件；HelloFresh、Whatnot、OfferUp 等消费者商业和市场平台场景；Bluesky、SoundCloud、Linktree 等社交、创作者和媒体产品；Code.org
              代表的非营利教育；Character.ai 代表的消费者 AI；Runna 代表的健身；Ancestry 代表的家谱订阅；Graphite
              代表的开发者工具。在这些例子中，运营买方通常是产品、工程、数据或增长负责人，而不是单独行动的集中采购团队。用户更宽：可能是 B2B
              软件内部工程师和分析师，也可能是受已发布体验影响的数百万终端消费者、创作者、教师、学生、跑者、购物者和听众。因此，公开证据对有可度量发布循环的软件原生团队最强，对传统线下或高度监管客户环境则薄得多。
