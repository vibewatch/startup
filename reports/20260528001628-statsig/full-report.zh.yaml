      - number: '2.4'
        title: 增长驱动、采用约束与开放规模缺口
        blocks:
          - type: paragraph
            body: >-
              需求驱动真实且多层。产品分析研究者把增长与云采用和个性化联系起来；Credence 将实验需求与数字化转型和移动商务联系起来；Kameleoon 与 VWO
              显示，投资和测试频率仍健康，足以支撑品类扩张。最新的需求加速器是 AI 辅助产品开发：DORA 认为 AI 采用现在是与价值流表现绑定的系统问题，Harvard
              则把实验描述为组织加快产品学习的战略必需。但约束同样真实。Forrester 和 LeadDev 说明了内部自研为什么昂贵：自研功能开关和实验系统会消耗开发者时间，也难以维护。MIT
              又加入了随机化、版本控制和自研还是购买之间的方法复杂性。隐私和治理是另一道刹车。Harness 指出实验会收集敏感行为数据；ICO 和 EDPB 明确，基于 cookie 的数据收集通常需要同意，不能伪装成
              “strictly necessary”。结果是，一个增长有吸引力、架构上强烈拉向受治理数据、但持续受切换成本、实施复杂性、隐私和品类模糊拖累的市场。因此，投资者应把 Statsig
              放在一组受约束的相邻市场视角中承保，而不是套用一个单一膨胀 TAM。
