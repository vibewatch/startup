            body: >-
              缺口在于客户集中度和商业耐久性。已抓取来源没有披露 NRR、GRR、流失、Logo
              留存、续约率、标准合同期限、席位数或头部客户收入占比。这不等于客户基础薄弱；只是公开记录无法把那份亮眼的客户名单转化成可承保的收入质量。公开证据也集中在特定客户类型。可见案例主要来自互联网原生软件、消费应用、数据驱动产品团队和实验成熟的组织。Whatnot
