  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台表面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Statsig 的公开表面围绕一个产品开发循环组织，而不是单个独立工具。公司把功能开关、实验、分析和仓库原生分析营销为相互连接的层；文档也强化了这个模型，会根据开发者需要的是布尔发布控制、结构化 JSON
              payload，还是随机测试，把他们从功能门控路由到动态配置再到实验。这对尽调重要，因为产品定义不只是“功能开关”；它是一套控制与度量栈，意在帮助工程、产品和数据团队发布代码、观察影响，并决定是否扩大或回滚发布。因此，模块地图很宽但仍一致：发布控制和远程配置位于运行时行为前端，实验和留出组建在曝光数据之上，分析和回放位于实验旁用于诊断，仓库原生则把同一工作流扩展给希望在自有数据集上分析的买方。
