        title: 反向视角与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              反向财务故事不是可见困境，而是竞争压力、产品摩擦和不透明私营经济性的组合。Sacra
              的风险部分清楚指出，实验支出可能被更广泛的可观测性或分析预算吸收；这对任何独立工具供应商都是真实定价风险。同一报告还警告，高级统计能力对高阶用户可能比对主流买方更有价值；如果更广泛客户只需要更简单测试工作流，付费意愿会变弱。TrustRadius
              评论从用户侧强化了这一担忧：买方称 Statsig
              强大，但也指出界面偏复杂、偏数据科学，工作流存在限制。最大阻碍仍是缺少财务披露。留存来源均未提供毛利率、CAC、回本周期、NRR、客户集中度、手头现金、月度烧钱、债务工具，或清晰的收购后独立报告视图。即便备案线索也不完整：SEC
              legacy browse 搜索没有在抓取的主要内容中给出可直接读取的 Statsig 公司文件；市场数据服务也可能滞后，Crunchbase 旧快照仍将 Series B
              标为最新轮次就是例子。合理财务结论因此是：看好产品市场匹配和资本可得性，但对正常化盈利能力和估值精度保持谨慎。
