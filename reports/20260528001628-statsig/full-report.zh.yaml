  - id: TP004
    title: 壁垒耐久度 / 竞争风险登记表
    columns:
      - 壁垒主张或压力点
      - 证据
      - 威胁路径
      - 严重性
      - 当前缓释或抵消因素
      - 尽调问题
    rows:
      - - 以实验为中心的一体化套件
        - Statsig 把分析、旗标、实验和回放接进同一套托管工作流
        - Amplitude、PostHog、Optimizely 和 GrowthBook 也在扩展套件边界
        - 高
        - 对产品主导型团队，采购和工作流仍更简单
        - 索取按分群划分的多产品附加、扩张和留存数据
      - - 透明的自助入门定价
        - Statsig 公布免费和 Pro 入门经济性
        - GrowthBook、PostHog 等透明对手降低了这一信号的稀缺性
        - 中
        - 定价透明仍能提升买方信任和采用速度
        - 收集真实企业报价，验证透明度在规模化后是否仍成立
      - - 仓库原生选项
        - Statsig 支持 Warehouse Native，且无需 ETL
        - GrowthBook 和 Eppo 把仓库控制放在叙事中心，而不是当作选项
        - 高
        - Statsig 仍可提供托管或仓库原生的灵活性
        - 验证数据团队主导实验栈时的胜率
      - - 托管工作流便利性
        - 托管配置和集成统计能力降低工程开销
        - 开源和自托管选项降低长期锁定，对某些工作负载可能更便宜
        - 中
        - 缺少深度实验基础设施的团队很看重快速上线
        - 衡量不同替代方案下首次测试用时和总工程工时
      - - 治理与企业审批
        - LaunchDarkly、Optimizely、Harness 和 VWO 强调审批、可审计性、SSO 与发布纪律
        - 治理要求重的企业可能认为 Statsig 好用，但不是默认最佳
        - 高
        - 治理需求较轻或产品主导程度更高时，Statsig 更容易赢
        - 向 LaunchDarkly 级买方核验企业级部署、RBAC 和审批适配
      - - 可迁移性与代码级锁定
        - OpenFeature 和自托管对手降低硬代码锁定
        - 买方可以抽象供应商，或把数据留在自有基础设施
        - 中
        - 工作流、实验历史和采购流程仍会制造切换摩擦
        - 询问现有客户是否标准化采用 OpenFeature 或类似抽象层
