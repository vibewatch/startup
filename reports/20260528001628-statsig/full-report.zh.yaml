  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 价值区间（十亿美元）
      - 概率信号
    rows:
      - - 熊
        - 没有战略买方出现，公开软件可比公司主导定价，业务按 ~$40M ARR 评估，不给稀缺性溢价。
        - 高增长但非战略性软件结果隐含 10x-17.5x ARR 区间。
        - 0.4-0.7
        - 如果 Datadog 从未接触、OpenAI 也没有支付战略价格，这一情景本会更可能。
      - - 基准 / 已实现
        - 战略买方看重实验基础设施，并以 Series C 同价成交。
        - 按保留的 ~$40M ARR 估计，已实现 27.5x ARR。
        - 1.0-1.2
        - 这是已观察到的结果：OpenAI 同意支付 $1.1B，之后没有更高公开标记。
      - - 牛
        - ARR 远超保留的 ~$40M 估计，或多个战略竞标方争夺该资产。
        - 需要明显更高 ARR，或另一场由稀缺性驱动的拍卖，才能支撑高于已实现交易的价值。
        - 1.4-1.8
        - 需要披露更快放量，或另一个愿意出价高于 OpenAI 的战略竞标方。
    notes: 基准情景锚定已实现的战略出售；熊情景和牛情景是反事实承销区间。
