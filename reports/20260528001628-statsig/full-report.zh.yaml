            body: >-
              在官方页面上，Statsig 把自己呈现为高度集成的实验控制平面：功能管理、实验、分析、回放、Web 分析、配置和仓库原生运营都在同一个产品家族里；定价 FAQ 还公开真实的自助升级路径，包括 2 million
              免费计量事件、$150 Pro 层级和明确超额计费。这种宽度真实存在，但方向上已不再独特。Amplitude 在更大套件里销售实验、分析和回放；Optimizely
              把功能实验与自己的统计引擎、仓库连接打包；Harness Split 把功能开关连到监控和仓库原生实验；GrowthBook 提供实验、开关和分析，可云端或自托管部署；Eppo
              结合仓库原生实验与快速开关；PostHog 销售更宽的开发者套件；VWO 打包测试、灰度发布、审批和护栏。更尖锐的区别在包装和部署哲学。Statsig、GrowthBook、PostHog 以及
              Amplitude 的部分入门点在公开信息中可读性更强。LaunchDarkly、Optimizely 和偏企业的大型存量厂商，仅凭公开列表价仍更难对标。仓库原生和自托管权衡形成第二条分界线：Statsig
              支持仓库原生模式，但 GrowthBook、Eppo 和内部自研路径更用力把数据所有权和可移植性作为核心购买信息。
