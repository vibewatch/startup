      - number: '7.3'
        title: 方法论、参考样本和人员风险
        blocks:
          - type: paragraph
            body: >-
              Statsig 最强的产品信息是统计能力成熟，但这把刀两面都锋利。平台把贝叶斯和频率学派方法、CUPED、序贯检验、多臂老虎机、AI
              评估、防护指标和发布控制直接交给操作人员。文档本身承认，偷看会抬高假阳性，早期统计显著的读数仍可能功效不足，普通多臂老虎机可能收敛到对子群错误的答案，而 LLM-as-a-judge
              天然不完美。这些不是避开产品的理由，而是把操作人员质量纳入风险包的理由。人员侧同样重要。公开客户证据集中在数字原生、AI、市场平台和电商
              Logo，这些客户本来就有强产品、工程和数据职能。对成熟买家来说这是正向信号，但参考样本也偏向那些能承受仓库设置、策略配置和实验严谨性的团队。与此同时，公开材料没有披露客户集中度或续约敞口。OpenAI 和
