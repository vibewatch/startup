        title: 情景分析和已实现结果
        blocks:
          - type: paragraph
            body: >-
              给 Statsig 估值，最清楚的方法是把已经实现的战略结果和反事实的财务买方案例分开。在保留的约 $40 million ARR 估计上，10x 倍数意味着约 $400 million 股权价值，15x
              意味着约 $600 million，20x 意味着约 $800 million。实际结果——先是 Series C，随后是 OpenAI 交易——以 27.5x ARR、即 $1.1 billion
              成交。由此，已实现基准情景很容易表述：战略买家愿意支付稀缺性溢价，但没有公开来源显示高于这一价格的加价。悲观情景是，如果没有战略收购方，且公开软件倍数仍设定外沿边界，公司大概率会面对的结果。乐观情景则要求 ARR
              基数远高于保留的 $40 million 估计，或出现第二个愿意进一步加价的战略竞标方。截至 runDate，已实现的 $1.1 billion 结果看起来是最相关的锚点，而不是通往下一轮私人加价的跳板。
