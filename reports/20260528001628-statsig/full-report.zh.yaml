        - ~$40M ARR；300+ 付费客户
        - 2025 年 5 月：$1.1B；~27.5x ARR
        - 公司自身的主要融资锚点。
        - ARR 来自第三方估计，未经审计，该轮条款也未公开。
      - - OpenAI 收购 Statsig
        - 同一保留 ~$40M ARR 框架；战略买方结果
        - 2025 年 9 月：$1.1B 全股票交易
        - 最新披露的定价事件，也直接验证了该轮价格。
        - 战略买方逻辑未必适用于财务买方定价。
      - - Amplitude
        - 2026 年 Q1 ARR $374M；Q1 收入 $93.5M
        - ~$0.91B 市值；~2.4x
        - 最接近的在市公开产品分析基准。
        - 增长较慢的上市公司，利润率和治理画像不同。
      - - Datadog
        - 2026 年 Q1 收入 $1.006B；non-GAAP 经营利润率 22%
        - ~$78.95B 市值；年化 Q1 销售额 ~19.6x
        - 高端可观测 / 实验套件基准。
        - 平台更宽、规模更大、盈利能力强得多。
      - - Datadog 收购 Eppo
        - 实验资产；收入未披露
        - 据报 ~$220M；条款未披露
        - 显示 2025 年战略买方对实验资产有需求。
        - 没有收入分母，因此不是干净的倍数可比对象。
      - - Optimizely / Episerver 历史
        - 签约时 >1,000 家客户；2020 年品类历史
        - 价格未披露；战略整合参考
        - 可用于理解实验整合的品类历史背景。
        - 保留来源中没有披露收购价，也没有公开 2026 年估值。
    notes: 这是本章使用的完整决策相关可比篮子：两个 Statsig 价格锚、两个公开软件参照、两个战略历史参照。
