  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手、相邻套件与替代路径
        blocks:
          - type: paragraph
            body: >-
              Statsig 已不再只在狭窄功能开关赛道里竞争。最接近的直接对手，是把发布控制与实验结合、并至少带有部分分析或指标层的平台：LaunchDarkly、Optimizely、Harness
              Split、GrowthBook、Eppo 和 PostHog 都以不同起点重叠同一个买方任务。LaunchDarkly 和 Optimizely 从企业级发布治理和实验严谨性切入该品类。Harness 延续旧
              Split 逻辑，把功能开关和实验与发布监控、仓库原生分析绑在一起。GrowthBook 和 Eppo 从仓库原生侧进攻，主张实验应留在买方自己的数据和指标栈内。PostHog 从开源开发者套件角度竞争，VWO
              则通过掌控 Web 和 App 优化工作流保持相邻位置，仍能吸收实验预算。替代集合也重要：内部自研、现有分析加点工具，以及 OpenFeature 等标准，都让多供应商并用保持可行。这意味着 Statsig
              必须靠集成工作流速度取胜，而不能假设买方在结构上被锁进某一类供应商。
