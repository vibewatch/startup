companyProfile:
  summary: >
    Statsig 是一家私营开发者工具公司，Vijaye Raji 于 2021
    年围绕一个判断创办：产品团队应该在同一个实验控制平面里发布、衡量和学习。公开证据支撑一个覆盖功能开关、实验、分析、会话回放和仓库原生工作流的宽栈，也支撑有意义的客户采用和 2025 年 $1.1B
    估值锚点。主要保留项是，业务很快就有了战略归属：OpenAI 于 2025 年 9 月宣布 $1.1B 交易，而后续公开材料指向 Amplitude
    运营该平台和客户基础，使独立投资逻辑基本关闭，也让长期所有权结构仅凭公开证据更难承保。
  foundedDate: '2021-02-01'
  founders:
    - name: Vijaye Raji
      role: 截至 2025 年收购公告时的创始人 / CEO
      background: 曾任 Microsoft 工程师和 Facebook/Meta 工程负责人，其实验背景与 Statsig 的产品逻辑直接对应。
