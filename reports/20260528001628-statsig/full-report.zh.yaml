      - 改变判断的证据
    rows:
      - - 一体化产品开发栈可以获得溢价
        - Statsig 把功能发布、实验、分析、性能监控和会话回放打包进一个平台。
        - 证明平台不只是覆盖面广，还能产出软件级留存和利润率指标。
      - - 用量计费和数仓原生部署可随客户放大
        - 定价按用量计量，文档同时描述数仓原生和托管部署选项。
        - 披露 ARR 有多少来自事件量扩张，而不是一次性或低质量用量。
      - - 客户证据显示真实竞争胜出
        - 客户案例称，买方在选择 Statsig 前评估过 Optimizely、LaunchDarkly、Split 和 Eppo；其中一个部署扩展到数亿用户。
        - 提供更独立的客户留存和扩张数据，而不是筛选后的推荐语。
      - - 反方：公开可比公司测算低得多
        - 按保留的 ARR 估计，Statsig 隐含约 27.5x；Amplitude 交易约 ~2.4x，Datadog 约 ~19.6x。
        - 更高的经审计 ARR 基数，或更清晰的战略竞标证据，才会缩小差距。
      - - 反方：退出价格与该轮持平
        - OpenAI 的 $1.1B 交易验证了 Series C，但未披露高于该轮的升值。
        - 后续披露加价，或更清晰的交割后经济性，会改善财务投资者案例。
      - - 反方：治理现在分散在 OpenAI 和 Amplitude
        - OpenAI 保留公司，Amplitude 接手品牌、客户和平台运营。
        - 明确的交割后权利、经济性和支持义务，可以判断连续性风险是否被高估。
    notes: 正面逻辑是战略稀缺和产品宽度；负面逻辑是实际退出没有上行，且经济性缺失。
    claimRefs:
