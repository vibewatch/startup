        title: 实验统计、分析与回放
        blocks:
          - type: paragraph
            body: >-
              Statsig 的统计表面显著宽于基础固定期 A/B 工具。公开文档覆盖 CUPED 方差降低、序贯测试、留出组和 Thompson-sampling
              bandits；仓库原生文档也明确把这些方法连回同一实验引擎。这种宽度支撑了公司对数据科学重度买方的推介，但细节也揭示权衡：存在序贯测试，是因为提前窥探是真实风险；bandit
              文档明确表示，默认方法无法个性化，且可能对特定用户队列收敛到错误的全局答案。在可观测性侧，分析表面包括漏斗、留存、分布、用户旅程、生命周期和仪表盘；Session Replay 则把诊断扩展到基于 rrweb
              的回放。Replay 不只是一个录制按钮；公开文档把它定位为同一反馈循环的一部分，用来指导发布和实验。保留项是，回放有自己的浏览器和隐私边界情况，因此应被承保为比核心功能开关评估风险更高的附加模块。
