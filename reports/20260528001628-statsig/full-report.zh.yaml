  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 交易、竞争和定价风险
        blocks:
          - type: paragraph
            body: >-
              最大残余风险不是产品 Bug，而是平台未来究竟由谁掌控出现漂移。官方收购公告显示，Statsig 同意在 2025 年 9 月加入 OpenAI，Vijaye Raji 将转任 Applications
              CTO，交易完成后员工预计成为 OpenAI 员工。但当前公开法律材料已经归在 Amplitude 名下，MarTech 报道称 Amplitude 将接管 Statsig
              品牌、客户基础、路线图和支持，原团队则留在 OpenAI。这种组合正好制造企业买家最不喜欢的连续性风险：代码可能延续，但关键运营者、统计专家和产品负责人坐在别处。竞争风险还会放大这一过渡。Statsig
              低端定价有吸引力，但扩张逻辑依赖把整合平台卖进客户账户；这些客户同样可以选择 PostHog 慷慨的免费层、Amplitude 更低的入门价格，或 Optimizely 的既有企业套件。如果 Amplitude
              整理重叠产品或重新定价过猛，流失风险会上升，定价权也会同时被压缩。
