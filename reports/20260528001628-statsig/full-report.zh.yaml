      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图横跨产品工程、产品管理、增长和数据。LeadDev 的买方指南把重心锚在持续发布功能的工程团队和产品经理。Firebase 把范围扩到绑定收入和留存的产品及营销实验；PostHog 和 Statsig
              都强调，数据团队仍然是度量、指标定义和实验分析的核心。MIT 和 Harvard
              增加了审批层：当实验规模化，它会变成业务系统决策，涉及高层领导、数据科学利益相关方和高管赞助人；他们要的是决策质量和更快创新，而不只是一个新
              SDK。实践中，采用路径通常从功能开关和受控灰度发布开始，再加入实验定向、指标治理和分析，最后扩展到平台标准化或仓库原生治理。这意味着用户常常是工程师、PM、分析师、增长经理或数据科学家；付款方则会随发布范围，在平台工程、产品运营、数据基础设施或高管数字化转型预算之间切换。
