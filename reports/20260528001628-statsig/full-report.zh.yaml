    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Statsig 客户如何从发布定义走到运行时评估、度量和更大范围推广。
    approximationNotes: 流程抽象掉分析托管在 Statsig 还是仓库原生环境的差异，因为两种模式仍使用同一套公开产品对象。
    data:
      nodes:
        - id: n1
          label: 定义发布对象
          detail: 团队在控制台中或通过控制台 API 创建功能门控、动态配置、实验或留出组。
        - id: n2
          label: 在运行时评估
          detail: SDK 或 HTTP API 根据定向和分配规则，为某个用户或请求完成对象评估。
        - id: n3
          label: 记录曝光和事件
          detail: 系统捕获曝光和自定义事件数据，供后续分析和实验读数使用。
        - id: n4
          label: 分析影响
          detail: 团队查看实验结果、分析图表，有时也回看会话，以理解用户行为。
        - id: n5
          label: 决定推广
          detail: 运营人员借助诊断、序贯读数，以及多臂老虎机或留出组证据，扩大、停止或优化流量。
        - id: n6
          label: 沉淀学习
          detail: 仪表盘、仓库原生表和代码引用工作流，为下一轮迭代输入经验。
      edges:
        - from: n1
