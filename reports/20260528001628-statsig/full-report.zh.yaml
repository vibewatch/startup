  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 战略买家看 Statsig 估值合理，但财务投资吸引力不足，因为产品广度和稀缺性抵消了弱公开可比公司的支撑。
    data:
      nodes:
        - id: breadth
          label: 一体化产品广度
          detail: 功能发布、实验、分析、性能监控和会话回放，拼出一套宽产品开发栈。
          tone: positive
        - id: proof
          label: 使用量和客户证据
          detail: 第三方来源显示 Statsig 接近 $40M ARR，拥有 300+ 付费客户和大规模部署。
          tone: positive
        - id: scarcity
          label: 战略稀缺性
          detail: Datadog 曾探索交易，OpenAI 支付 $1.1B，说明实验资产确有战略需求。
          tone: positive
        - id: comp-gap
          label: 公开可比差距
          detail: 按公开数据筛选，Amplitude 和 Datadog 都低于 Statsig 隐含的 27.5x ARR 倍数。
          tone: warning
        - id: handoff
          label: 交割后分工托管
          detail: OpenAI 拥有公司，Amplitude 运营平台和客户群。
          tone: warning
        - id: decision
          label: 避免新资金
          detail: 战略买家看合理，但新财务投资者已没有清晰的独立上行空间。
          tone: neutral
      edges:
        - from: breadth
          to: proof
        - from: proof
          to: scarcity
        - from: scarcity
          to: decision
        - from: comp-gap
          to: decision
        - from: handoff
          to: decision
