      - number: '2.2'
        title: 规模测算视角、市场区间与仓库原生切口
        blocks:
          - type: paragraph
            body: >-
              公开来源支持多个可用市场视角，但没有一个权威、适用于 Statsig 的 TAM。在更宽的相邻市场侧，产品分析是 USD 13 billion 至 USD 15 billion
              市场，具体取决于来源和年份，Grand View 与 Mordor 都指向双位数增长。在核心实验侧，已发布区间宽得多：Credence 将 2024 年 A/B 测试软件定为 USD 8.18
              billion，VWO 引用的 A/B 测试工具估计则窄得多，为 USD 850.2
              million。这些并非简单矛盾，更像不同品类外壳。它们框出市场中纯测试工具与更广义实验软件之间的占比。仓库原生实验是该市场内的重要切口，但公开数据没有把它单独作为一个品类测算。Statsig、LaunchDarkly、Optimizely、Harness、Eppo
              和 GrowthBook 都在营销仓库原生工作流，把指标、SQL 和实验分析放得更靠近 Snowflake、BigQuery、Databricks 或
              Redshift。供应商趋同说明买方在数据治理和指标信任上有拉力；但缺乏独立分拆意味着，仓库原生应被视为一种架构部署模型，而不是独立 TAM。
