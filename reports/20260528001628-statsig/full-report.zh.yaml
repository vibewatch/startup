  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series C 与出售条款
        - Series C 与 OpenAI 交易中的优先权结构、参与权、期权处理和清算瀑布。
        - 该信息决定名义 $1.1B 数字是对应普通股持有人经济性，还是主要对应优先股保护。
        - 从律师和董事会数据室获取融资文件和出售文件。
      - - 收入质量
        - 出售时的净留存、客户数流失、毛利率、队列扩张和客户集中度。
        - 上述指标能说明 27.5x ARR 是有纪律的定价，还是激进定价。
        - 向财务团队索取运营模型和队列分析。
      - - OpenAI-Amplitude 过渡经济性
        - Amplitude 接手平台和客户群之后的商业条款、客户归属、支持义务和知识产权。
        - 拆分运营模式是复用这一先例时当前最大的疑点。
        - 审阅 OpenAI 与 Amplitude 之间的过渡服务和商业协议。
      - - 客户延续性
        - 过渡后关键账户的续约和扩张行为，尤其是具名企业客户。
        - 客户延续证据会降低外界对该战略结果主要是人才收购的担忧。
        - 访谈客户推荐人，并索取交易完成后的账户留存数据。
      - - 董事会和投资人回报
        - $20M 老股交易和后续出售所得中，有多少流向员工、多少流向早期投资人。
        - 由此可厘清该结果按名义口径只是持平，还是按单个持有人口径更好或更差。
        - 向公司法律顾问索取收益分配瀑布和股权结构表桥接。
    notes: 这些索取项按对估值信心影响最直接的程度排序。每一项都在缩小买方特定不确定性，而不是增加泛泛的尽调材料。
    claimRefs:
