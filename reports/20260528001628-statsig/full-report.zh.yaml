      - number: '1.3'
        title: 融资历史、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              Statsig 的融资路径在金额上很清楚，尽管一些运营指标仍模糊。公司于 2021 年 8 月完成 $10.4 million Series A，2022 年 4 月完成 $43 million Series
              B，2025 年 5 月以 $1.1 billion 估值完成 $100 million Series C。GeekWire、Tracxn 和 Sacra 的数据合计，累计融资约 $153 million 至
              $153.4 million；Sequoia 与 Madrona 连续参与三轮，ICONIQ Growth 作为后期领投方加入。2025 年 Series C 看起来是拐点：Statsig 成为 Bellevue
              独角兽，披露新增董事会席位，并开始大幅扩充办公室容量。


              规模信号方向强，但精度不均。官方页面称拥有数千家公司、每天超过 1 trillion 事件、每月 2.5 billion 唯一实验对象。第三方和客户证明来源补充了更多细节：Sacra 估计付费客户超过 300
              家、ARR 约 $40 million；官方客户页面列出
              OpenAI、Microsoft、Notion、Brex、Atlassian、Bloomberg、Eventbrite、Ancestry、Headspace 和 SoundCloud
              等品牌。员工数更不清楚。GeekWire 在 Series C 前后报道员工 140 至 145 人，在 2025 年 9 月 OpenAI 公告时报道 155 人；但 Tracxn
              当前快照称，截至一个标注含糊的 4 月 26 日，公司有 55 名员工。差距足够大，当前员工数应在尽调中视为未解决事项。
