  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商
      - 公开入门方案
      - 定价模式
      - 入门档包含能力
      - 透明度
      - 影响
    rows:
      - - Statsig
        - Developer 档含 2M 计量事件免费；Pro $150/mo
        - 基于用量，对事件和曝光计量
        - 门控、配置、实验、分析
        - 入门档透明度高
        - 对重度实验团队，自助式价格很有进攻性
      - - LaunchDarkly
        - 可免费开始；规模化方案定制
        - 套餐加定制企业定价
        - 运行时控制、功能开关、实验、可观测性、智能体控制
        - 入门档以上透明度低
        - 很难直接对标透明的自助式竞品
      - - Optimizely
        - 各套餐均需询价
        - 按产品定制定价
        - 按模块提供功能实验、Web 实验、分析、CMS、数据平台
        - 透明度低
        - 可能适合企业，但公开 TCO 难以核算
      - - Harness / Split
        - 免费方案引导，加上大量询价式打包
        - 独立评测材料显示按用户和企业式定价
        - 功能开关、监控、实验、数据仓库原生实验
        - 透明度中到低
        - 企业可用，但成本可能比 Statsig 或 GrowthBook 更快上升
      - - Amplitude
        - Starter 免费；Plus 起价 $49/mo；Growth 和 Enterprise 定制
        - 套件加附加模块打包
        - 分析优先的平台套件，包含 Feature Experiment 和 Web Experiment
        - 透明度中等
        - 入门门槛低，但企业经济性仍需拿到报价后验证
      - - GrowthBook
        - Starter 免费，最多 3 个用户；Pro $40/seat/mo
        - 基于席位的云定价，可选自托管
        - 功能开关和实验不限量；分析 beta 和高级治理位于更高档
        - 公开档透明度高
        - 技术团队会强力压价封闭式老牌厂商
      - - Eppo
        - 未保留公开自助定价页
        - 所审材料暗示企业版需报价
        - 仓库原生实验与功能旗标
        - 高度不透明
        - 相较自助替代品，是高价专业工具采购
      - - PostHog
        - 多个免费层级，使用费率明确
        - 按用量计费，并设账单上限
        - 分析、回放、旗标、实验、数据仓库、调查、工作流
        - 入门层级不透明度低
        - 在所审相邻套件中，透明价格菜单最全
      - - VWO
        - 保留页面列出 Growth、Pro 和 Enterprise 层级
        - 分层打包，按功能设门槛
        - 测试、实验、发布、审批、护栏
        - 中等不透明
        - 详细功能表便于初筛，但标价底线的经济性仍不完整
      - - 内部自建 / 现状方案
        - 通常现金入门成本低，但没有开箱即用套件
        - 工程时间和既有工具支出形成资本开支
        - 团队自己构建或已经拥有的能力
        - 无外部标价
        - 前期看起来便宜，但往往藏着运营和机会成本
    notes: 本表只比较保留页面中的公开入门信号和打包逻辑；最低承诺、协商折扣和企业报价底线仍未解决。
