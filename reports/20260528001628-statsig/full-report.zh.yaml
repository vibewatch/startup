  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 为什么会破坏论点
      - 行动含义
    rows:
      - - OpenAI 与 Amplitude 之间没有清晰连续性
        - 有证据显示客户支持、路线图归属或 IP 管理明显碎片化。
        - 如果运营资产实质上被拆分，战略价格先例就更难复用。
        - 将 $1.1B 标记视为一次性人才或稀缺性采购，而不是可重复的平台价值。
      - - 客户质量不及预期
        - 过渡后披露任何流失、疲弱 NRR 或负面队列数据。
        - 只有收入质量极高，27.5x ARR 价格才说得通。
        - 站在财务买方视角，将公司估值标在已实现 $1.1B 战略结果之下。
      - - 隐藏轮次条款对投资者不友好
        - 参与权、优先清偿权或严苛分配瀑布显著扭曲普通股持有人经济性。
        - 名义估值可能夸大实际支付价格的经济性。
        - 对先例打折，并逐条承销条款。
      - - 公开可比公司压力恶化
        - Amplitude 持续低迷、Datadog 估值下修，同时实验被视为功能而非平台。
        - 与 Statsig 的可比差距更难辩护。
        - 使用 10x-20x ARR 区间，而不是已实现的 27.5x 战略结果。
      - - 战略稀缺性消退
        - 没有第二竞标方、没有增量加价，也没有新披露指标支撑高于 OpenAI 价格的出价。
        - 已实现的持平结果会变成上限，而不是底线。
        - 不要假设历史交易价之上还有上行。
    notes: 这些否决触发项面向投资者，帮助判断历史 $1.1B 结果能否作为新估值判断的先例。
    claimRefs:
