        - 留存公开来源未披露估值
        - 早期支持方资本；所有权影响未公开
        - 确立 Sequoia 和 Madrona 为持续支持方。
      - - Series B 轮（2022）
        - ~$43M
        - 留存公开来源未披露估值
        - 2025 年价格重设前的成长资本
        - 把公司推到后来可能完成独角兽轮的阶段。
      - - Series C 轮新股融资（2025）
        - ~$80M
        - $1.1B 估值、$100M 轮次的一部分
        - 如果 $1.1B 是投后估值，约占投后股权的 7.3%
        - 对一个打出独角兽估值的轮次来说，名义稀释看起来不高。
      - - Series C 轮老股流动性（2025）
        - ~$20M
        - 同一笔 $100M 交易的一部分
        - 转移所有权，但不稀释公司
        - 显示该轮也服务于员工流动性，而不只是给资产负债表补钱。
      - - 出售前累计融资
        - ~$153.4M
        - OpenAI 后来同意以 $1.1B 收购 Statsig
        - 累计融资约等于出售价值的 14%
        - 说明资本效率尚可，但瀑布经济性仍未披露。
    notes: 稀释计算只是近似值，因为留存公开来源未披露完整股权结构表或精确投前条款；7.3% 假设报道的 $1.1B 估值是投后估值，且只有 $80M 新股部分稀释公司。
