        title: 缓释措施、否决标准和具体尽调问题
        blocks:
          - type: paragraph
            body: >-
              公开缓释措施存在，但大多停留在框架层面，而非结果层面。Statsig
              记录了访问控制、评审、审批、策略设置、诊断和安全实践，说明公司理解相关失效模式。未解决的问题是，在公司过渡期里，这些控制是否被持续执行；客户能否在不付出过高内部成本的情况下落地这些控制。对承保来说，最干净的框架是把未决问题改写成明确否决标准。如果交易对手、支持负责人或路线图承诺再次变化，部署就需要重新承保。如果仓库原生计算成本或资源争用结构性高于预期，所谓治理和
              TCO 优势会很快变弱。如果 HIPAA、DPA 或子处理方治理无法达到受监管买家的文档标准，可触达市场会收窄。如果相对 PostHog、Amplitude 或 Optimizely
              的套件经济性恶化，扩张假设就应下调。因此，剩余尽调包应聚焦过渡后的商业连续性、实际客户集中度、受监管企业证据，以及现实的仓库成本模型。
