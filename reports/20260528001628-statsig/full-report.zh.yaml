  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 渐进式交付和暗发布
        - 驱动因素
        - 当前
        - 持续交付把功能开关和受控发布变成默认工程需求
        - Statsig 使用中，有多少起点是发布控制，而不是实验？
      - - 云与个性化需求
        - 驱动因素
        - 当前
        - 数字产品需要更快个性化闭环时，分析和实验预算会增长
        - 多少客户购买实验能力，是为了改善既有个性化或增长工作流？
      - - AI 辅助的产品迭代
        - 驱动因素
        - 当前至近期
        - AI 原生版本发布更频繁，拉高了度量和回滚纪律的需求
        - Statsig 需求中，有多少来自 AI 产品团队，而非传统 Web / 移动团队？
      - - 数据仓库原生治理
        - 驱动因素
        - 当前
        - 指标可信度、SQL 控制权和数据驻留要求，把需求拉向数据仓库原生分析
        - 现在有多少赢单需要兼容 Snowflake、BigQuery 或 Databricks？
      - - 可见的实验强度
        - 驱动因素
        - 当前
        - 健康的测试频率和明确的功能投入预算，支撑品类韧性
        - 有多少客户会从基础功能开关成熟到高频实验？
      - - 内部自建维护税
        - 约束
        - 当前
        - 自建功能开关和实验会推迟采购，但之后也会形成迁移压力
        - 哪些迁移工具能降低替换内部系统的成本？
      - - 隐私、cookie 同意与 PII 风险
        - 约束
        - 当前
        - 部分度量用例需要明确同意或更严格的数据最小化，可用流量因此减少
        - 产品实验中，有多少只靠已同意或第一方服务端数据就能运行？
      - - 方法复杂度
        - 约束
        - 当前
        - 随机化设计、单元追踪和解读复杂度，限制了实验民主化
        - 产品把哪些统计和治理护栏自动化到足够好，能让非专家使用？
      - - 集成与资源负担
        - 约束
        - 当前至近期
        - 切换技术栈或跨团队标准化，需要支持、定制和工程时间
        - 各细分客群需要多少实施资源，多久能体现价值？
      - - 估值中的品类边界模糊
        - 约束
        - 当前
        - 混杂的市场边界会高估 TAM，也会遮住买方到底是在替换单点工具，还是替换更宽的分析栈
        - 后续章节哪些应使用狭义核心视角，哪些应使用更宽的邻近视角？
    notes: 本表把需求驱动因素和约束放在一起，因为此处的市场吸引力不仅取决于品类原始增长，也同样取决于治理和迁移摩擦。
