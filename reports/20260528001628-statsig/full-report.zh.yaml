      - number: '1.4'
        title: 里程碑时间线、交易状态与尽调保留项
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，这家公司从创立到产品扩张推进很快。Statsig 2021 年 3 月发布创立逻辑，同年 8 月宣布正式可用并完成 Sequoia 领投的 Series A，2022 年 4 月前完成
              Series B，2023 年 6 月推出 Warehouse Native。同一 2023 年记录已经显示数百家付费客户、数千名免费层用户，以及用于测试模型成本和延迟的特定 AI 实验功能。到 2025 年 5
              月和 7 月，公开报道显示其完成 $1.1 billion Series C、搬入更大的 Bellevue 总部，招聘计划也暗示仍在独立扩张。


              最清晰的保留项是交易状态。Statsig 和 OpenAI 均在 2025 年 9 月 2 日表示双方已签署最终协议；OpenAI 与 Reuters 将该交易描述为仍需监管批准和满足惯常交割条件。然而
              Tracxn
              已将公司标记为已收购。这个不一致意味着，直接来源支持“已宣布的交易”，但表面上不能证明交易已完全完成。第二个保留项是证据质量不对称：产品和融资可见度相对较好，董事会构成、最终交割确认和当前员工数仍较弱。安全可见度居中。Statsig
              发布了信任页面，包含 SOC 2、事件响应和治理控制表述；UpGuard 也提供了独立供应商风险视角。但两类来源都没有给出投资者在把可靠性视为已充分承保前会想要的详细运营历史。
