          detail: 需要 ARR 显著高于保留估计，或再次出现战略竞价事件。
          tone: positive
    approximationNotes: 上述区间属于买方驱动的估值框架，不是贴现现金流输出。基准情景采用已实现交易作为最佳可观察锚点。
    claimRefs:
      - CV038
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 产品质量和战略稀缺性得分较好；公开可比支撑和可投资性得分较差。
    data:
      items:
        - label: 产品广度
          score: 8
          detail: 一体化功能管理、实验、分析、监控和回放，是可信优势。
          tone: positive
        - label: 客户证据
          score: 7
          detail: 客户引用和第三方规模估计显示真实采用，但披露经过筛选。
          tone: positive
        - label: 战略稀缺性
          score: 8
          detail: OpenAI 支付 $1.1B；Datadog 在收购 Eppo 前也曾探索交易。
          tone: positive
        - label: 公开可比支撑
          score: 3
          detail: 按保留公开数据，Amplitude 和 Datadog 都低于 Statsig 的隐含倍数。
          tone: warning
        - label: 资本效率
          score: 7
          detail: 累计融资相对最终 $1.1B 退出价值较低。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 留存、流失、毛利率和条款仍未公开。
          tone: warning
        - label: 当前可投资性
          score: 2
          detail: OpenAI 所有权和 Amplitude 平台托管，使后期投资者没有清晰的独立切入点。
          tone: negative
    approximationNotes: 评分是内部投委会式判断，基于抓取来源集综合形成，并非外部报告的评级。
    claimRefs:
      - CV022
      - CV037
