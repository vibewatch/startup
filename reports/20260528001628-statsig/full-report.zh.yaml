      - number: '7.2'
        title: 仓库原生治理、隐私和运营风险
        blocks:
          - type: paragraph
            body: >-
              Statsig 的仓库原生设计是真正的差异化，但也带来不小的实施和治理负担。产品需要服务用户、作业执行权限、读取客户指标和曝光数据的权限，以及写入专用暂存环境的权限。Statsig
              表示，一些聚合结果和诊断仍会存储在其服务器上；自家文档也警告，随着实验量上升，实验暂存数据可能快速膨胀。最佳实践指南明确要求客户使用分区、聚类、增量重载和范围化资源，才能控制支出和资源争用。安全姿态显著好于不透明初创公司的基线：Statsig
              宣传 SOC 2 Type II、加密、备份、灾难恢复和事件响应。但隐私和法律栈也说得很清楚：客户仍是控制者，标准条款下不应发送敏感数据，HIPAA 支持需要 BAA，供应商链条现在横跨 Amplitude
              品牌下的法律所有权以及多个 AI 和基础设施子处理方。纪律严明的团队能管住这些问题，但并非无摩擦。
