  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与品类融合
        blocks:
          - type: paragraph
            body: >-
              Statsig 处在一个融合的产品开发工具市场，而不是某个清晰的传统品类。核心任务是发布控制加因果度量：功能开关、渐进式交付、A/B 测试、留出组、指标定义和发布后分析。Forrester
              明确把功能管理和实验界定为横跨软件交付与产品管理；Azure、AWS 和 PostHog 文档也显示，同一个控制平面用于 beta
              访问、暗发布、安全灰度发布、远程配置和实验定向。产品分析属于相邻支出池，因为现代供应商越来越把分析与实验、功能开关打包在一起，但不能未经调整就简单并入核心实验
              TAM。因此，合理市场边界应包括实验基础设施、功能管理、仓库原生实验和产品分析邻近项，同时排除通用
              BI、后台分析和无关营销技术测试。主要现状替代品是自研功能开关、内部实验工具，以及把发布控制和度量分开的碎片化栈。
