chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台边界与 Bellevue 运营足迹
        blocks:
          - type: paragraph
            body: >-
              Statsig 把自己定位为现代产品开发平台，而不是单点 A/B 测试工具。从官网、文档、定价到产品页，公司都在推一个集成栈：实验、功能管理、产品分析、会话回放、Web
              分析、仓库原生分析，以及配套发布工具。这个定位重要，因为它解释了定价模型和融资故事：Statsig 试图用一个按量计费的平台，替代一组更窄的开发者和分析产品。官方定价页用与用量而非席位数绑定的
              Free、Pro、Enterprise 层级，进一步强化了这个逻辑。


              当前地址信号指向 Bellevue，而不只是更宽泛的 Seattle 地区。Statsig 招聘材料、产品页和收购博客都以 “Hello from Bellevue, WA” 收尾；GeekWire
              报道，2025 年 7 月公司迁入新的 Bellevue 总部，可容纳 450 至 500 人。不过，地址记录并不完全干净。Statsig 的 2021 年 Series A 新闻稿使用 Kirkland
              办公地址，Tracxn 仍保留 Kirkland 标签与 Bellevue 注册地址并存的记录。最干净的公开解读是：Statsig 现在在 Bellevue 运营，而较旧、更新更慢的记录仍反映它早期
              Eastside 足迹。
