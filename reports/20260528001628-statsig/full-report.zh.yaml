      - number: '3.3'
        title: 治理、信任姿态、切换成本与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              信任和切换成本图景是混合的，而非单向。Statsig 可以指向平台级可靠性和仓库原生选项，但治理重的存量厂商在审批链、可审计性和企业发布安全上仍有更强默认心智。LaunchDarkly
              的独立定位仍是治理优先，Optimizely 强调长运营历史以及安全的本地和云端经验，Harness 描述同伴评审、回滚纪律、RBAC、SSO 和 2FA，VWO 则在留存页面上直接展示审批、SSO
              和大量认证细节。GrowthBook、Eppo 和 PostHog
              提供另一种信任叙事：数据留在买方环境内或可自托管，本地评估避免每次检查都发起网络调用，开源或仓库原生架构降低对供应商的硬基础设施依赖。OpenFeature 进一步通过供应商无关 API
              降低代码层锁定。结果是，Statsig
              周围的切换成本更多基于工作流和治理，而不是代码。指标、灰度发布习惯、实验历史和采购标准化都会制造粘性；但只要买方把数据留在自有仓库、自托管关键组件，或标准化到保留多供应商能力的抽象层，真正硬锁定就更弱。
