        blocks:
          - type: paragraph
            body: >-
              未解决工作恰好集中在估值信心最该落地的地方：收入质量、轮次条款，以及交割后运营结构的经济性。保留来源没有披露 Statsig 的净留存、毛利率、流失、队列扩张或优先股堆叠，也没有解释 OpenAI 和
              Amplitude 之间如何分配经济利益、客户权利、支持义务和 IP 管理权。这些遗漏很关键，因为它们决定 $1.1 billion
              标题价代表的是纪律严明的战略承保，还是买家愿意为人才和位置支付溢价。实际尽调路径因此很窄也很具体。买家需要 Series C 和出售文件、队列层 ARR 和留存桥，以及 OpenAI-Amplitude
              过渡协议的确切内容，才能把旧估值标记当作可复用先例。没有这些数据，本案应放进“已观察到的战略结果”桶，而不是“可重复估值基准”桶。
