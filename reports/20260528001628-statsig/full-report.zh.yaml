  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Statsig 的货币化对一家私营基础设施初创公司来说异常清晰，因为公司同时公布免费开发者层和按量计费 Pro 层。官方定价页展示了经典产品主导阶梯：面向个人构建者的免费访问、每月 $150
              且包含事件量和付费超额的 Pro 计划，以及定制企业合同。经济信号不是席位货币化；Statsig 反复把定价围绕事件、实验用量和部署规模展开，同时表示席位、功能开关和环境不是限制变量。Warehouse
              Native 对财务重要，因为它拓宽了企业入口，而不必把每个客户都推入 Statsig 托管算力；Sacra 也明确认为该部署选项可降低 Statsig
              自身基础设施负担。收入质量上的保留项同样重要。公开列表价解释了包装和客户如何扩大支出的机制，但没有显示已实现 ASP、折扣、续约率，或自助 Pro
              与谈判型企业承诺之间的组合。换句话说，漏斗顶部透明，真正货币化引擎仍是私有信息。
