      - number: '1.2'
        title: 创始人背景、领导力集中与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Statsig 的公众身份仍异常集中在 Vijaye Raji 身上。留存记录把公司与他在 Microsoft 和 Facebook 的经历紧紧连在一起：Microsoft 资料称他是 Small Basic
              的创建者；Meta 工程博客在 Statsig 成立很久之前，就介绍过他在 Seattle Messenger 团队的工作。后续报道称，他曾管理 Facebook 的 Seattle
              工程组织，并担任副总裁角色，这些经历与 Statsig 创立时“快速实验、用数据指导产品发布”的投资逻辑直接对上。因此，创始人与市场匹配度格外强，也解释了为什么多家投资者和媒体画像把 Statsig
              描述为创始人主导的产品公司。


              但治理可见度远薄于产品可见度。最清晰的公开治理信息，是 2025 年 Series C 披露 ICONIQ Growth 合伙人 Murali Joshi
              加入董事会。除此之外，本报告审阅的直接公开来源没有给出清晰且最新的董事会名单、委员会结构或详细投票权图谱。这一点重要，因为 OpenAI 交易在本已有限的私营公司治理透明度之上，又叠加了控制权变更。OpenAI
              的公告明确表示，Raji 预计将出任 Applications CTO，交易一旦交割，员工和控制动态都会发生实质变化；但这不能替代完整治理材料。
