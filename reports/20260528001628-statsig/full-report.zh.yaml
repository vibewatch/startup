      - number: '8.2'
        title: 融资背景和资本历史
        blocks:
          - type: paragraph
            body: >-
              融资时间线在标题层面异常清晰，但对后期承保最关键的细节仍不透明。Statsig 在 2025 年 5 月宣布以 $1.1 billion 估值完成 $100 million Series C；Sacra
              保留摘要称，本轮包含 $80 million 新股和 $20 million 员工老股流动性。这很重要，因为如果 $1.1 billion 是投后估值，隐含新钱稀释只有约 7% 到
              8%，对这个规模的融资来说偏温和；交易其余部分是持有人流动性，而非公司融资。Sacra 还把 Series A、Series B 和 Series C 的累计融资额估计为约 $153.4 million。随后
              OpenAI 在 2025 年晚些时候同意以同样 $1.1 billion 收购
              Statsig，这验证了战略买家眼中的本轮价格，但没有披露高于该价格的加价。公开来源仍看不到优先股堆叠、清算瀑布或参与权；这些信息才能告诉外部投资人，标题估值在经济上比表面更干净还是更苛刻。
