          tone: neutral
        - label: 15x ARR 中性情景
          value: 15
          detail: 代表有溢价、但非战略性的软件结果。
          tone: neutral
        - label: Datadog 实时倍数
          value: 19.6
          detail: 以一家规模大得多的平台为参照，按市值 / Q1 年化销售额估算。
          tone: warning
        - label: 20x ARR 轻战略倍数
