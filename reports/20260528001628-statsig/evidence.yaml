evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and investor-rights summary for Statsig pre-close or post-close.
    whyItMatters: Governance visibility is thin relative to the size of the valuation and the announced change-of-control event.
    diligencePath: >-
      Request a current board list, observer rights, protective provisions, and any governance memos tied to the Series
      C and OpenAI transaction.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A dated official employee count and an org split showing who remains at Statsig versus who is expected to
      transition to OpenAI.
    whyItMatters: >-
      Current headcount affects operating leverage, integration complexity, and the credibility of Bellevue expansion
      plans.
    diligencePath: Request an updated headcount memo, org chart, and hiring plan from management or HR as of the current month.
    relatedQuestionRefs:
      - QO017
  - type: conflicting-data
    severity: material
    topic: acquisition
    missingEvidence: >-
      A direct post-announcement closing confirmation, abandonment notice, or amended transaction disclosure from OpenAI
      or Statsig.
    whyItMatters: >-
      Current stage, control, employee retention, and customer-counterparty risk all depend on whether the transaction
      actually closed.
    diligencePath: >-
      Request the latest signed transaction-status update, regulatory-clearance status, and any customer communication
      confirming close timing.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: security
    missingEvidence: >-
      Detailed incident history, postmortems, and customer impact summaries beyond the high-level trust-page controls
      language.
    whyItMatters: >-
      Reliability and trust are central to experimentation infrastructure, but the public record reviewed here is
      stronger on controls than on operating history.
    diligencePath: >-
      Request internal incident logs, customer-facing postmortems, uptime reports, and the latest third-party audit
      summaries.
    relatedQuestionRefs:
      - QO025
      - QO026
  - type: missing-source
    severity: material
    topic: warehouse-native-market-sizing
    missingEvidence: >-
      An independent analyst or filing-backed estimate that isolates warehouse-native experimentation as a standalone
      software segment.
    whyItMatters: Without an independent category cut, warehouse-native remains a strategic wedge rather than a clean SAM/TAM layer.
    diligencePath: Ask management for win-loss data and analyst materials that quantify warehouse-native demand by customer segment.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-conflict
    missingEvidence: >-
      A vendor-neutral framework that reconciles testing tools, experimentation software, and product analytics into one
      non-overlapping taxonomy.
    whyItMatters: >-
      Current public estimates are directionally useful but not directly additive, which makes valuation-sensitive TAM
      work fragile.
    diligencePath: >-
      Build a bottoms-up taxonomy from competitor SKUs and customer budgets instead of relying on one syndicated market
      report.
    relatedQuestionRefs:
      - QM007
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Segment-level evidence showing which line item actually pays for standardized experimentation and
      feature-management stacks in mature software orgs.
    whyItMatters: >-
      Public sources show users clearly, but payer identity shifts between engineering, product, growth, and data
      budgets.
    diligencePath: >-
      Use customer references and implementation calls to map buyer, approver, and payer by company size and data
      maturity.
    relatedQuestionRefs:
      - QM013
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: statsig-specific-sam
    missingEvidence: >-
      A public or management-supported breakdown of Statsig’s true serviceable market after excluding broader product
      analytics and generic devtools spend.
    whyItMatters: >-
      Later valuation work should not overstate reachable market size by inheriting the full adjacent analytics
      category.
    diligencePath: Request pipeline segmentation by use case, ACV band, and architecture preference to build a constrained SAM/SOM.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
