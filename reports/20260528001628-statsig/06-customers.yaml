  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Customer cohort NRR, GRR, logo churn, and renewal-rate data by product tier or segment.
    whyItMatters: Without retention metrics, the chapter cannot distinguish high-usage customers from high-renewal customers.
    diligencePath: Request cohort retention dashboards or board materials showing renewal and contraction by product tier.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR share, largest-single-customer exposure, and ARR by customer archetype or vertical.
    whyItMatters: Strong logo breadth can still mask material revenue concentration if a few software-native customers dominate spend.
    diligencePath: Request customer concentration schedules from finance or sales operations and tie them to current product/module usage.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: contract-economics
    missingEvidence: Average contract length, seat counts, module attach rates, and cohort pricing by customer segment.
    whyItMatters: Commercial durability depends on how deeply customers buy into the platform, not just how often they run experiments.
    diligencePath: Request sales collateral or CRM exports showing contract term, seats, products purchased, and expansion history.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
    - TU005
  - type: stale
    severity: minor
    topic: reference-freshness
    missingEvidence: Publication dates or last-updated timestamps for the strongest Statsig customer stories.
    whyItMatters: Undated customer stories make it harder to judge whether a proof point is current, historical, or already superseded.
    diligencePath: Ask Statsig for publication dates, renewal dates, or fresher joint customer references for the top logos.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU006
  - type: access-blocked
    severity: material
    topic: customer-side-corroboration
    missingEvidence: Customer-authored or customer-controlled corroboration for SoundCloud, Whatnot, and Character.ai deployment details.
    whyItMatters: These logos currently rely mostly on vendor-authored stories, which lowers independence relative to the best-correlated accounts.
    diligencePath: Request direct customer references, joint announcements, procurement records, or customer-authored engineering posts for the weaker-corroborated names.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU003
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: customer-roster-completeness
    missingEvidence: A dated complete customer roster or at least a broader named-customer list segmented by product and status.
    whyItMatters: The fetched public proof is strong, but partial; a fuller roster would show whether the visible references are representative or cherry-picked.
    diligencePath: Request a customer-reference list by product, logo status, renewal status, and willingness to speak.
    relatedQuestionRefs:
    - QU003
    relatedTableRefs:
    - TU003
