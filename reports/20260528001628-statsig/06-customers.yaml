- id: named-proof-and-reference-quality
  title: Named customer proof, reference quality, and freshness
  body: 'The strongest part of the Statsig customer story is that it goes well beyond logo walls. The fetched stories include quantified operational outcomes for multiple named customers: Ancestry says experimentation rose from 70 to 600 annual tests; HelloFresh says it reached 1,000 experiments per year while improving decision quality; Brex reports data-team efficiency and tool-consolidation savings; Bluesky ties the platform to rapid growth and release activity; Whatnot describes a ramp from zero to hundreds of annual experiments; Graphite discloses active feature-gate and config usage; OfferUp reports an 11% conversion lift; and Runna, SoundCloud, Notion, Webflow, Linktree, Code.org, and Character.ai all describe production use cases with meaningful scale context. But reference quality is still mixed. Almost all deployment details come from vendor-authored, currently live Statsig pages rather than customer-authored engineering posts, filings, or procurement records. Customer-side official
    pages do corroborate that many named logos are real, current, and large platforms, yet those pages rarely mention Statsig directly. So the chapter supports genuine adoption and some concrete outcomes, while still stopping short of fully independent proof for most logos.'
