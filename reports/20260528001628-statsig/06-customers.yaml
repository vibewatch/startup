- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Type
  - Impact
  - Diligence path
  rows:
  - - Unified platform replaces multiple tools
    - Expansion driver
    - Can increase account stickiness by expanding from flags into experimentation, analytics, configs, or warehouse-native workflows
    - Request module attach rates, modules purchased per customer, and expansion timing
  - - Warehouse-native and data integration use cases
    - Expansion driver
    - Deepens entrenchment for data teams once metrics, data, and experimentation are standardized
    - Request what percent of ARR comes from warehouse-native customers and which warehouses dominate
  - - High experiment cadence at consumer apps and marketplaces
    - Expansion driver
    - Frequent releases and measurement loops can raise switching costs
    - Request monthly active experimenters and top-customer event volume by cohort
  - - Public proof concentrated in internet-native software and consumer apps
    - Concentration risk
    - Visible references may overstate diversification if ARR is similarly concentrated by product-led software customers
    - Request ARR by industry / customer archetype
  - - Top-customer exposure not disclosed
    - Concentration risk
    - A few large logos could represent outsized revenue or usage without being visible publicly
    - Request top-10 customer ARR share and largest-single-customer share
  - - Most detailed stories are vendor-authored and usually undated
    - Reference-quality risk
    - Freshness and independence are weaker than customer-authored engineering posts or filings
    - Request dated customer references, renewals, or joint announcements
  - - Review-site complaints point to onboarding and UX friction
    - Retention risk
    - Complexity could slow adoption outside highly technical teams
    - Request implementation timeline, support tickets, and lost-deal reasons
  - - Customer-side corroboration varies by logo
    - Reference-quality risk
    - Some names have strong official identity/scale proof while others rely mostly on Statsig pages
    - Prioritize direct customer calls for weaker-corroborated logos such as SoundCloud, Whatnot, and Character.ai
  notes: The table separates growth vectors from underwriting risks. Missing commercial disclosure is itself a risk because it limits the ability to convert public logo proof into durable revenue-quality evidence.
  claimRefs:
