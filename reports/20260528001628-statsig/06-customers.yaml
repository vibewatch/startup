- id: concentration-risk-and-gaps
  title: Concentration risk, proof concentration, and diligence gaps
  body: The missing pieces are concentration and commercial durability. None of the fetched sources disclosed NRR, GRR, churn, logo retention, renewal rates, standard contract length, seat counts, or top-customer revenue share. That does not mean the customer base is weak; it means the public record cannot translate the impressive reference list into underwritten revenue quality. Public proof is also concentrated by archetype. The visible reference set is dominated by internet-native software, consumer apps, data-forward product teams, and experimentation-mature organizations. Geographic breadth is visible through examples such as Whatnot's U.S. and Europe footprint, SoundCloud's 193-country reach, Bluesky's millions of users, Linktree's global creator base, and Code.org's worldwide education mission, but geography alone does not resolve concentration by customer type or spend cohort. Investors should therefore treat Statsig's public customer story as strong on named proof, medium on independence
    and freshness, and weak on retention and concentration disclosure. The next diligence step is not finding more logos; it is getting dated renewal examples, top-10 customer exposure, module penetration, and cohort-level retention or expansion data.
