chapter:
  number: 6
  title: Customers
  summary: 'Statsig''s public customer proof is unusually rich for a private developer-tool company: fetched customer stories span Notion, Webflow, Brex, HelloFresh, Whatnot, SoundCloud, Bluesky, Ancestry, OfferUp, Character.ai, Linktree, Code.org, Runna, and Graphite, and many include concrete experiment-volume, efficiency, or conversion outcomes. The main gap is durability, not adoption: most proofs are vendor-authored and live on undated Statsig pages, while no fetched source disclosed NRR, churn, renewals, or top-customer concentration.'
sections:
- id: customer-base-segmentation
  title: Customer base and buyer-user-payer segmentation
  body: 'Statsig''s fetched customer pack shows breadth, but not in a random or evenly distributed way. The named stories cluster around product-led software and internet businesses where release control, experimentation cadence, and product analytics matter every day: productivity and collaboration platforms such as Notion and Webflow; fintech and financial software such as Brex; consumer commerce and marketplace surfaces such as HelloFresh, Whatnot, and OfferUp; social, creator, and media products such as Bluesky, SoundCloud, and Linktree; nonprofit education through Code.org; consumer AI through Character.ai; fitness through Runna; genealogy subscriptions through Ancestry; and developer tools through Graphite. Across those examples, the operational buyer is usually a product, engineering, data, or growth leader rather than a centralized procurement team acting alone. Users are broader: internal engineers and analysts in B2B software, or millions of end consumers, creators, teachers, students,
    runners, shoppers, and listeners affected by the shipped experiences. That makes the public evidence strongest for software-native teams with measurable release loops, and much thinner for traditional offline or heavily regulated customer environments.'
