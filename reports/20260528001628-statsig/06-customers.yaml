- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Representative public proof
  - Revenue / strategic value
  - Main gap
  rows:
  - - Productivity and collaboration SaaS
    - Buyer = product/engineering/data leadership; users = builders and end users; payer = core product budget
    - Experimentation, release control, and analytics for collaboration products
    - Notion and Webflow stories plus official company pages
    - High strategic value because shipping speed and UX quality directly affect growth
    - No public contract size, renewal rate, or module mix by account
  - - Fintech and financial software
    - Buyer = data/platform or product leaders; users = internal finance and operations teams; payer = central platform or analytics budget
    - Experiment analysis, data consolidation, and rollout control
    - Brex story plus Brex homepage
    - Tool consolidation can deepen account value beyond simple feature flags
    - No public commercial terms or spend share
  - - Consumer commerce and marketplaces
    - Buyer = growth/product/engineering; users = shoppers, sellers, and local buyers/sellers; payer = consumer product organization
    - Conversion optimization, rollout control, and experimentation at marketplace scale
    - HelloFresh, Whatnot, and OfferUp stories
    - Direct link to checkout, activation, and monetization metrics
    - No cohort retention or seller/buyer split disclosed
  - - Social, creator, and media platforms
    - Buyer = growth/platform/data teams; users = consumers, creators, listeners, and communities; payer = platform team budget
    - Engagement measurement, rollout safety, and product analytics
    - Bluesky, SoundCloud, and Linktree stories with official Bluesky and Linktree pages
    - Large audience surfaces make experiment volume strategically valuable
    - Public proof does not reveal revenue concentration or module penetration
  - - Mission-driven education
    - Buyer = PM/data/education platform teams; users = teachers and students; payer = nonprofit operating budget
    - Product visibility and experimentation under budget constraints
    - Code.org story plus official impact page
    - Shows Statsig can win even where tooling budgets are constrained
    - No public pricing terms or renewal data
  - - Consumer AI applications
    - Buyer = product/ML/platform teams; users = end consumers interacting with models; payer = AI product budget
    - Safe and engaging model releases and evaluation loops
    - Character.ai story
    - Extends the platform into subjective, safety-sensitive AI product decisions
    - Customer-side corroboration is thinner than for the best software references
  - - Developer tools
    - Buyer = engineering platform leadership; users = software engineers and reviewers; payer = engineering productivity budget
    - Feature gates, dynamic configs, and controlled shipping workflows
    - Graphite story plus official homepage
    - Strong fit where release precision and incident response are core
    - No public ARR or account-size disclosure
  - - Fitness and wellness apps
    - Buyer = growth/product teams; users = subscribers and runners; payer = product-led subscription budget
    - Testing onboarding, premium conversion, and retention levers
    - Runna story plus official homepage
    - Shows Statsig can support fast-moving consumer subscription apps
    - No actual retention percentages or renewal economics disclosed
  notes: Segments are grouped from fetched named case studies and corroborating customer official pages. The segmentation shows breadth by archetype, but public proof still over-indexes to internet-native software and consumer apps.
