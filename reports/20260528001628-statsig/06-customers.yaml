      detail: Teams compare Statsig against internal builds or multiple third-party products.
    - id: f3
      label: Initial implementation
      detail: Feature flags, rollouts, or experiment setup are deployed for one urgent workflow or growth motion.
    - id: f4
      label: First quantified win
      detail: Customers report a measurable improvement such as faster decisions, more experiments, cost savings, or conversion lift.
    - id: f5
      label: Workflow standardization
      detail: More teams adopt the platform and begin using additional modules like analytics, configs, or warehouse-native experimentation.
    - id: f6
      label: Expansion or renewal underwriting
      detail: Commercial durability must eventually be proved with cohort retention, module penetration, and concentration data that remain private publicly.
