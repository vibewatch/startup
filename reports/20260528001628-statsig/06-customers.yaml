figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Typical buyer-user-payer journey across Statsig’s strongest public customer stories.
  data:
    nodes:
    - id: u1
      label: Shipping or measurement pain appears
      detail: Teams hit limits with homegrown flags, fragmented analytics, slow experiment setup, or low confidence in rollout safety.
    - id: u2
      label: Product, engineering, and data champions evaluate
      detail: The operational buyer is usually a PM, engineer, data scientist, or platform lead rather than a generic procurement owner.
    - id: u3
      label: First production rollout or experiment
      detail: Initial use often starts with feature gating, release control, or a specific experiment backlog that needs faster execution.
    - id: u4
      label: Measurement and analytics deepen
      detail: Customers then connect experiments to analytics, warehouse-native workflows, or richer product data to make decisions faster.
    - id: u5
      label: Broader teams adopt the workflow
      detail: Experiment velocity rises across more squads or more of the customer journey, expanding internal reliance on the platform.
    - id: u6
      label: Renewal and expansion need proof
      detail: The last step is still the least visible publicly because NRR, renewals, and top-customer spend are not disclosed.
