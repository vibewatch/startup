- id: sizing-lenses-and-warehouse-native-architecture
  title: Sizing Lenses, Market Range, and the Warehouse-Native Wedge
  body: 'Public sources support multiple usable market lenses but not one authoritative Statsig-ready TAM. On the broad adjacent side, product analytics is a USD 13 billion to USD 15 billion market depending on source and year, with both Grand View and Mordor pointing to double-digit growth. On the core experimentation side, the published range is much wider: Credence places A/B testing software at USD 8.18 billion in 2024 while VWO cites a much narrower A/B testing tools estimate of USD 850.2 million. Those are not simple contradictions so much as different category shells. They bracket how much of the market is pure testing tooling versus broader experimentation software. Warehouse-native experimentation is an important wedge inside this market but not a separately sized category in public data. Statsig, LaunchDarkly, Optimizely, Harness, Eppo, and GrowthBook all market warehouse-native workflows that keep metrics, SQL, and experiment analysis closer to Snowflake, BigQuery, Databricks,
    or Redshift. That vendor convergence suggests buyer pull around data governance and metric trust, but the lack of independent segmentation means warehouse-native should be treated as an architectural deployment model, not as a standalone TAM.'
