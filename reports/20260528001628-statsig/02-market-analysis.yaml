chapter:
  number: 2
  title: Market Analysis
  summary: 'Statsig operates inside a converging product-development tooling market where feature management and experimentation form the core control plane, product analytics is the main adjacent budget pool, and warehouse-native workflows create a high-value architectural wedge. Public data supports a meaningful market range rather than one clean TAM: narrow testing-tool estimates sit below USD 1 billion, broader experimentation software is above USD 8 billion, and adjacent product analytics is already in the USD 13 billion to USD 15 billion range. Adoption is driven by continuous delivery, AI-era release velocity, and data-governance needs, but the slope of penetration is still constrained by privacy rules, internal-build inertia, implementation complexity, and shifting budget ownership.'
sections:
- id: market-boundary-and-category-convergence
  title: Market Boundary, Included Spend, and Category Convergence
  body: 'Statsig sits in a converged product-development tooling market rather than in one clean legacy category. The core job is release control plus causal measurement: feature flags, progressive delivery, A/B testing, holdouts, metric definition, and post-launch analysis. Forrester explicitly frames feature management and experimentation as spanning software delivery and product management, while Azure, AWS, and PostHog documentation show that the same control plane is used for beta access, dark launches, safe rollouts, remote configuration, and experiment targeting. Product analytics belongs in the adjacent spend pool because modern vendors increasingly package analytics next to experimentation and flagging, but it should not simply be added to the core experimentation TAM without adjustment. The right market boundary therefore includes experimentation infrastructure, feature management, warehouse-native experimentation, and a product-analytics adjacency, while excluding generic BI,
    back-office analytics, and unrelated martech testing. The main status-quo substitutes are home-grown flags, internally built experimentation tools, and fragmented stacks that keep release control and measurement separate.'
