  evidenceGaps:
  - type: missing-source
    severity: material
    topic: warehouse-native-market-sizing
    missingEvidence: An independent analyst or filing-backed estimate that isolates warehouse-native experimentation as a standalone software segment.
    whyItMatters: Without an independent category cut, warehouse-native remains a strategic wedge rather than a clean SAM/TAM layer.
    diligencePath: Ask management for win-loss data and analyst materials that quantify warehouse-native demand by customer segment.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-conflict
    missingEvidence: A vendor-neutral framework that reconciles testing tools, experimentation software, and product analytics into one non-overlapping taxonomy.
    whyItMatters: Current public estimates are directionally useful but not directly additive, which makes valuation-sensitive TAM work fragile.
    diligencePath: Build a bottoms-up taxonomy from competitor SKUs and customer budgets instead of relying on one syndicated market report.
    relatedQuestionRefs:
    - QM007
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Segment-level evidence showing which line item actually pays for standardized experimentation and feature-management stacks in mature software orgs.
    whyItMatters: Public sources show users clearly, but payer identity shifts between engineering, product, growth, and data budgets.
    diligencePath: Use customer references and implementation calls to map buyer, approver, and payer by company size and data maturity.
    relatedQuestionRefs:
    - QM013
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: statsig-specific-sam
    missingEvidence: A public or management-supported breakdown of Statsig’s true serviceable market after excluding broader product analytics and generic devtools spend.
    whyItMatters: Later valuation work should not overstate reachable market size by inheriting the full adjacent analytics category.
    diligencePath: Request pipeline segmentation by use case, ACV band, and architecture preference to build a constrained SAM/SOM.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: switching-cost-benchmarks
    missingEvidence: Vendor-neutral benchmarks for migration effort, implementation time, and realized cost savings when teams move off home-grown or incumbent experimentation stacks.
    whyItMatters: Budget pressure is visible, but public sources do not quantify switching cost well enough to forecast adoption velocity.
    diligencePath: Collect implementation timelines from customers and compare migration patterns against incumbent and internal-build alternatives.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
    - TM004
