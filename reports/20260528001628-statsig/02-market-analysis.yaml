- id: growth-drivers-constraints-and-open-sizing-gaps
  title: Growth Drivers, Adoption Constraints, and Open Sizing Gaps
  body: 'Demand drivers are real and multi-layered. Product analytics researchers tie growth to cloud adoption and personalization, Credence links experimentation demand to digital transformation and mobile commerce, and Kameleoon plus VWO show that investment and testing frequency remain healthy enough to support category expansion. The newest demand accelerator is AI-assisted product development: DORA argues that AI adoption is now a systems problem tied to value-stream performance, and Harvard frames experimentation as a strategic imperative for organizations that want faster product learning. But the constraints are equally real. Forrester and LeadDev show why internal build is costly: home-grown flags and experimentation systems tax developer time and are hard to maintain. MIT adds methodological complexity around randomization, version control, and build-versus-buy trade-offs. Privacy and governance are another brake. Harness notes that experimentation collects sensitive behavioral
    data, while the ICO and EDPB make clear that cookie-based data collection often requires consent and cannot be disguised as “strictly necessary.” The result is a market with attractive growth, strong architectural pull toward governed data, and persistent friction around switching cost, implementation complexity, privacy, and category ambiguity. Investors should therefore underwrite Statsig against a constrained range of adjacent market lenses rather than a single inflated TAM.'
