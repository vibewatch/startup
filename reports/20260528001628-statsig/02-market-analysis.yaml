- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Progressive delivery and dark launches
    - Driver
    - Current
    - Continuous delivery makes flags and controlled release a default engineering need
    - How much of Statsig usage begins with rollout control versus experimentation?
  - - Cloud and personalization demand
    - Driver
    - Current
    - Analytics and experimentation budgets grow when digital products need faster personalization loops
    - What percent of customers buy experimentation to improve existing personalization or growth workflows?
  - - AI-assisted product iteration
    - Driver
    - Current to near-term
    - More frequent AI-native releases increase the need for measurement and rollback discipline
    - How much of Statsig demand is tied to AI product teams versus classic web/mobile teams?
  - - Warehouse-native governance
    - Driver
    - Current
    - Metric trust, SQL control, and data residency create pull toward warehouse-native analysis
    - What share of wins now require Snowflake, BigQuery, or Databricks compatibility?
  - - Visible experimentation intensity
    - Driver
    - Current
    - Healthy testing frequency and declared feature-investment budgets support category durability
    - How many customers mature from basic flags into frequent experimentation?
  - - Internal-build maintenance tax
    - Constraint
    - Current
    - Home-grown flags and experiments can delay buying but also create migration pressure later
    - What migration tooling reduces the cost of replacing internal systems?
  - - Privacy, cookie consent, and PII risk
    - Constraint
    - Current
    - Some measurement use cases need explicit consent or stricter data minimization, reducing usable traffic
    - How much of product experimentation can run on consented or first-party server-side data only?
  - - Methodological complexity
    - Constraint
    - Current
    - Randomization design, unit tracking, and interpretation complexity limit democratized use
    - What statistical and governance guardrails does the product automate well enough for non-experts?
  - - Integration and resource burden
    - Constraint
    - Current to near-term
    - Switching stacks or standardizing across teams needs support, customization, and engineering time
    - What implementation resources and time-to-value are required by segment?
  - - Category ambiguity in valuation
    - Constraint
    - Current
    - Mixed market boundaries can overstate TAM and hide whether buyers are replacing point tools or broad analytics stacks
    - Which later chapters should use the narrow core lens versus the broader adjacent lens?
  notes: This table mixes demand drivers with constraints because market attractiveness here depends as much on governance and migration friction as on raw category growth.
