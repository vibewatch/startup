    sourceRefs:
    - SE012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE009
  - id: CE009
    statement: The same bandit methodology page says vanilla multi-armed bandits cannot personalize and can converge to a global winner that is suboptimal for specific user segments.
    type: observed
    topic: bandit-limit
    sourceRefs:
    - SE012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE009
    - QE024
  - id: CE010
    statement: Statsig holdouts measure the aggregate impact of multiple features, can be global or selected, and are recommended at small percentages such as 1% to 10% of users.
    type: observed
    topic: holdouts
    sourceRefs:
    - SE013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE010
  - id: CE011
    statement: Statsig product analytics exposes metric drilldown, funnels, retention, distribution, user journeys, lifecycle views, and dashboards that can also hold feature gate and experiment snapshots.
