- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: How a Statsig customer moves from launch definition to runtime evaluation, measurement, and wider rollout.
  approximationNotes: This flow abstracts over whether analysis is hosted or warehouse-native, because both modes still use the same public product objects.
  data:
    nodes:
    - id: n1
      label: Define release object
      detail: A team creates a feature gate, dynamic config, experiment, or holdout in the console or via the Console API.
    - id: n2
      label: Evaluate in runtime
      detail: SDKs or HTTP APIs evaluate the object for a user or request based on targeting and assignment rules.
    - id: n3
      label: Log exposures and events
      detail: Exposure and custom-event data are captured for later analytics and experiment readouts.
    - id: n4
      label: Analyze impact
      detail: Teams inspect experiment results, analytics charts, and sometimes replay sessions to understand behavior.
    - id: n5
      label: Decide rollout
      detail: Operators widen, stop, or optimize traffic using diagnostics, sequential reads, and bandit or holdout evidence.
    - id: n6
      label: Persist learning
      detail: Dashboards, warehouse-native tables, and code-reference workflows feed the next iteration.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
