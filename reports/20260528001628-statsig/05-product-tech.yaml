chapter:
  number: 5
  title: Product & Technology
  summary: Statsig publicly presents a broad but coherent product stack that combines release control, experimentation, analytics, replay, and warehouse-native analysis. The technical surface is credible for enterprise buyers, but the public pack still leaves diligence questions around fine-grained governance, replay browser coverage, and exact warehouse-boundary implementation details.
sections:
- id: platform-surface
  title: Platform surface and customer workflow
  body: 'Statsig''s public surface is organized around one product-development loop rather than a single standalone tool. The company markets feature flags, experimentation, analytics, and warehouse-native analysis as connected layers, and the docs reinforce that model by routing developers from gates to dynamic configs to experiments depending on whether they need a boolean release control, a structured JSON payload, or a randomized test. That matters for diligence because the product definition is not just “flagging”; it is a control-and-measurement stack intended to help engineering, product, and data teams ship code, observe impact, and decide whether to widen or reverse a release. The module map is therefore broad but still coherent: release controls and remote config sit in front of runtime behavior, experimentation and holdouts sit on top of exposure data, analytics and replay sit beside experimentation for diagnosis, and warehouse-native extends the same workflow to buyers that want
    analysis on their own datasets.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE005
  - CE011
  - CE014
  - CE042
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: runtime-architecture
  title: Runtime architecture, APIs, and deployment model
  body: 'The technical architecture visible in public materials centers on SDK-mediated runtime evaluation plus a console and API control plane. Feature gates, dynamic configs, and experiments are all presented as runtime checks that happen through Statsig SDKs or APIs, with event and exposure logging feeding downstream analysis. Warehouse Native changes where analysis runs, not whether Statsig participates in the workflow: public docs still depend on the Statsig console for setup, official SDKs for assignment, and a documented pipeline that writes staging and summary tables in the customer warehouse. The result is a hybrid architecture rather than a pure no-control-plane appliance. That hybrid model can be a strength for buyers who want hosted release management plus warehouse analysis, but it is also a diligence point because “warehouse native” does not eliminate implementation choices around assignment, ingestion, logging callbacks, and central API governance. Developer tooling such as
    GitHub code references further suggests Statsig is trying to embed itself in the day-to-day engineering loop, not only in a metrics console.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE027
  - CE043
  tableRefs:
  - TE003
  figureRefs:
  - FE002
  - FE003
- id: stats-and-observability
  title: Experimentation statistics, analytics, and replay
  body: 'Statsig''s statistical surface is meaningfully broader than a basic fixed-horizon A/B tool. Public docs cover CUPED variance reduction, sequential testing, holdouts, and Thompson-sampling bandits, and the warehouse-native docs explicitly connect those methods back to the same experimentation engine. That breadth supports the company''s pitch to data-science-heavy buyers, but the details also reveal trade-offs: sequential testing exists because peeking is a real risk, and the bandit docs explicitly say the default approach cannot personalize and may converge to the wrong global answer for specific user cohorts. On the observability side, the analytics surface includes funnels, retention, distribution, journeys, lifecycle, and dashboards, while Session Replay extends diagnosis into rrweb-based playback. Replay is not just a recording button; the public docs position it as part of the same feedback loop that informs launches and experiments. The caveat is that replay has its own browser
    and privacy edge cases, so it should be underwritten as a higher-risk add-on than core flag evaluation.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE038
  - CE039
  tableRefs: []
  figureRefs:
  - FE004
- id: enterprise-controls
  title: Enterprise controls, privacy, and security posture
  body: 'Statsig has a credible public enterprise-control surface, but it is strongest at the organization and project level rather than at the most granular object level. The access-management docs clearly separate SSO from SCIM, document enterprise OIDC SSO, and show Okta-based SCIM lifecycle automation. The warehouse-native roles page adds an explicit RBAC story for who can view, edit, and approve experiments, metrics, and raw data. Security and privacy materials also go beyond generic marketing: the compliance docs discuss customer-data isolation, AI-data boundaries, AES-256 at rest, TLS 1.2+, and SOC 2 Type II, while the privacy policy distinguishes between website/account processing and customer-controlled product data. The net takeaway is that Statsig is publicly legible on core enterprise controls, but fine-grained authorization, data-residency specifics, and some product-by-product control scope still require diligence rather than being fully settled by the public pack.'
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE025
  - CE026
  - CE036
  tableRefs:
  - TE004
  figureRefs: []
- id: limitations-and-roadmap
  title: Technical limitations and roadmap-visible risk
  body: 'The main public risks are not that Statsig lacks core breadth; they are that some important operational boundaries are still only partially documented. Public package registries and repositories make it clear that the company maintains a wide SDK footprint and ships actively, but those same artifacts do not prove feature parity across languages. The session replay issue queue shows that browser-specific failures can surface even when the broader platform story is strong. And on governance, public materials establish that Statsig has RBAC, approvals, and enterprise identity features, yet a public request for per-gate or per-rule access control highlights a possible gap for buyers with strict segregation-of-duties requirements. The warehouse-native story is also strong enough to take seriously but still leaves an implementation boundary question: the public pack shows in-warehouse analysis and hybrid deployment choices, not a universal no-ETL promise. For underwriting, that means
    the product is clearly capable, but the last mile of governance, browser support, and deployment architecture still needs direct diligence.'
