  - id: CE002
    statement: Feature Gates are runtime boolean controls evaluated by Statsig SDKs and support gradual rollouts, kill switches, targeting by user attributes, and environment-based rules.
    type: observed
    topic: feature-flags
    sourceRefs:
    - SE007
    - SE001
    - SE025
    confidence: medium
    freshness: current
    answersQuestionRefs:
