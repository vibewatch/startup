  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sdk-parity
    missingEvidence: A current public parity matrix that maps every supported language package to feature completeness, release cadence, and deprecation status.
    whyItMatters: Package listings prove breadth, but they do not show whether advanced features like replay, warehouse-native logging, bandits, or governance controls are equally available across languages.
    diligencePath: Request a language-by-language SDK capability matrix and the current server-core migration roadmap from the product or solutions team.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: session-replay-browser-matrix
    missingEvidence: An official browser-support matrix or replay-specific changelog that confirms whether Safari 15 and similar legacy browser issues are fixed or intentionally unsupported.
    whyItMatters: Replay can become a deployment blocker even when the core flagging stack works, especially for consumer web properties with long browser-tail support requirements.
    diligencePath: Ask for replay browser support policy, current regression-test coverage, and incident history for browser-specific capture failures.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: governance-roadmap
    missingEvidence: A current official roadmap or permissions matrix showing whether per-gate or per-rule RBAC, approval policies, and warehouse-native governance boundaries are already shipped, planned, or unsupported.
    whyItMatters: Enterprise buyers often need delegated ownership and segregation of duties at a finer grain than project-level roles, and public evidence is still thinner than the feature surface itself.
    diligencePath: Request the current enterprise authorization model, approval workflow granularity, and the next 12-month governance roadmap from product leadership.
    relatedQuestionRefs:
    - QE025
  - type: stale
    severity: minor
    topic: warehouse-boundary-docs
    missingEvidence: A single up-to-date architecture brief that reconciles warehouse-native compute, older direct-ingestion docs, and the company's no-extra-overhead positioning.
    whyItMatters: The exact no-ETL or no-ingestion boundary affects security review, data-movement cost, and implementation complexity for warehouse-first buyers.
    diligencePath: Ask the solutions architecture team for a current deployment decision tree covering hosted, hybrid, and warehouse-native data paths.
    relatedQuestionRefs:
    - QE016
    - QE025
