    - Mature core surface
    - Boolean runtime controls tied to advanced targeting, release diagnostics, and rollback workflows
    - Public evidence does not confirm per-gate or per-rule authorization granularity
  - - Dynamic configs
    - Application engineers
    - Mature but bounded
    - Server-defined JSON lets teams vary values by user context without redeploying code
    - 100 KB payload limit may push larger parameter sets into adjacent config systems
  - - Experiments, holdouts, and bandits
    - Product / data science
    - Advanced documented surface
    - A/B/n, CUPED, sequential testing, holdouts, and Thompson-sampling autotune are all publicly documented
    - Contextual fit, personalization limits, and rollout policy still need buyer-specific statistical review
  - - Product analytics and dashboards
    - Growth / analytics
    - Mature supporting surface
    - Funnels, retention, journeys, lifecycle, and dashboards are connected to release and experiment artifacts
    - Public docs do not expose the underlying cloud analytics data model in the same detail as warehouse-native
  - - Session replay
    - Product / support / UX
    - Documented but higher-risk add-on
    - rrweb-based replay gives visual debugging with masking and eligibility controls
    - Browser-support coverage and retention details are thinner than the flagging surface
  - - Warehouse Native
    - Data platform / experimentation teams
    - Enterprise-grade but nuanced
    - Runs experiment analysis in the customer warehouse while preserving Statsig’s stats engine and optional SDK assignment path
    - Public materials show a hybrid deployment model rather than a universally local-only architecture
  notes: This table maps the public product surface as visible on the run date. “Maturity” reflects documentation depth and shipping evidence, not internal revenue mix.
