- id: capital-and-scale
  title: Funding history, valuation, and scale signals
  body: |-
    Statsig’s financing path is straightforward on amounts even if some operating metrics remain blurry. The company raised $10.4 million in Series A in August 2021, $43 million in Series B in April 2022, and $100 million in Series C in May 2025 at a $1.1 billion valuation. Across GeekWire, Tracxn, and Sacra, total capital raised lands around $153 million to $153.4 million, with Sequoia and Madrona showing continuity across all three rounds and ICONIQ Growth joining as the late-stage lead. The 2025 Series C appears to be the inflection point where Statsig became a Bellevue unicorn, added a disclosed board seat, and started expanding office capacity materially.

    Scale signals are directionally strong but uneven in precision. Official pages claim thousands of companies, 1 trillion-plus daily events, and 2.5 billion unique monthly experiment subjects. Third-party and customer-proof sources add more texture: Sacra estimates more than 300 paying customers and about $40 million in ARR, while official customer surfaces name brands including OpenAI, Microsoft, Notion, Brex, Atlassian, Bloomberg, Eventbrite, Ancestry, Headspace, and SoundCloud. Headcount is less clean. GeekWire reported 140 to 145 employees around the Series C and 155 employees at the September 2025 OpenAI announcement, but Tracxn’s current snapshot says 55 employees as of an ambiguously labeled April 26 date. That discrepancy is large enough that current headcount should be treated as unresolved in diligence.
