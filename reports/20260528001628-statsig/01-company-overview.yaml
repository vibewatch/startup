  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and investor-rights summary for Statsig pre-close or post-close.
    whyItMatters: Governance visibility is thin relative to the size of the valuation and the announced change-of-control event.
    diligencePath: Request a current board list, observer rights, protective provisions, and any governance memos tied to the Series C and OpenAI transaction.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated official employee count and an org split showing who remains at Statsig versus who is expected to transition to OpenAI.
    whyItMatters: Current headcount affects operating leverage, integration complexity, and the credibility of Bellevue expansion plans.
    diligencePath: Request an updated headcount memo, org chart, and hiring plan from management or HR as of the current month.
    relatedQuestionRefs:
    - QO017
  - type: conflicting-data
    severity: material
    topic: acquisition
    missingEvidence: A direct post-announcement closing confirmation, abandonment notice, or amended transaction disclosure from OpenAI or Statsig.
    whyItMatters: Current stage, control, employee retention, and customer-counterparty risk all depend on whether the transaction actually closed.
    diligencePath: Request the latest signed transaction-status update, regulatory-clearance status, and any customer communication confirming close timing.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
    - TO003
    - TO004
  - type: private-evidence-only
    severity: minor
    topic: security
    missingEvidence: Detailed incident history, postmortems, and customer impact summaries beyond the high-level trust-page controls language.
    whyItMatters: Reliability and trust are central to experimentation infrastructure, but the public record reviewed here is stronger on controls than on operating history.
    diligencePath: Request internal incident logs, customer-facing postmortems, uptime reports, and the latest third-party audit summaries.
    relatedQuestionRefs:
    - QO025
    - QO026
