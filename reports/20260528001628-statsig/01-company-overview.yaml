callouts:
- calloutType: strength
  title: Unified platform positioning is not just branding
  body: |-
    Statsig's official product, docs, pricing, and Warehouse Native materials all tell the same story: the company is trying to collapse experimentation, feature control, analytics, and release operations into one metered platform. That coherence lowers the risk that the business is merely a narrow A/B testing point solution.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO036
- calloutType: strength
  title: Investor continuity culminated in a credible unicorn round
  body: |-
    Sequoia and Madrona followed Statsig from Series A through Series C, and ICONIQ Growth set a $1.1 billion benchmark in 2025. That continuity matters because it suggests repeated underwriting across both early product thesis and later scale evidence, not a single opportunistic financing event.
  claimRefs:
  - CO023
  - CO025
  - CO026
  - CO027
  - CO028
- calloutType: risk
  title: Control and headcount visibility are weaker than product visibility
  body: |-
    The public record is much better on product breadth and funding than it is on board composition, current employee count, or final transaction status. Tracxn says Statsig is already acquired and shows 55 employees, while direct OpenAI and Reuters sources still read as pending-close and 2025 reporting showed 140 to 155 employees. That gap should be treated as a real diligence issue, not a formatting nuisance.
  claimRefs:
  - CO021
  - CO042
  - CO043
  - CO047
  - CO050
  - CO055
- calloutType: insight
  title: Statsig appears to have kept shipping after agreeing to sell
  body: |-
    The January 2026 AI-features and knowledge-graph posts suggest Statsig still had an active standalone roadmap after announcing the OpenAI transaction. That is a useful signal for customer continuity and product momentum, even though it does not resolve the underlying closing-status ambiguity.
  claimRefs:
