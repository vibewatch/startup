companyProfile:
  summary: >
    Statsig is a private developer-tools company founded in 2021 around Vijaye Raji's thesis that product teams should
    ship, measure, and learn inside one experimentation control plane. Public evidence supports a broad stack spanning
    feature flags, experimentation, analytics, session replay, and warehouse-native workflows, plus meaningful customer
    adoption and a $1.1B 2025 valuation anchor. The main caveat is that the business became strategically spoken for
    quickly: OpenAI announced a $1.1B deal in September 2025, while later public materials point to Amplitude operating
    the platform and customer base, leaving the standalone investment case largely closed and the long-term ownership
    structure harder to underwrite from public evidence alone.
  foundedDate: '2021-02-01'
  founders:
    - name: Vijaye Raji
      role: Founder / CEO through 2025 acquisition announcement
      background: >-
        Former Microsoft engineer and Facebook/Meta engineering leader whose experimentation background maps directly to
        Statsig's product thesis.
      claimRefs:
