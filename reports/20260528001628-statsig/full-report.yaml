      - number: '5.3'
        title: Experimentation statistics, analytics, and replay
        blocks:
          - type: paragraph
            body: >-
              Statsig's statistical surface is meaningfully broader than a basic fixed-horizon A/B tool. Public docs
              cover CUPED variance reduction, sequential testing, holdouts, and Thompson-sampling bandits, and the
              warehouse-native docs explicitly connect those methods back to the same experimentation engine. That
              breadth supports the company's pitch to data-science-heavy buyers, but the details also reveal trade-offs:
              sequential testing exists because peeking is a real risk, and the bandit docs explicitly say the default
              approach cannot personalize and may converge to the wrong global answer for specific user cohorts. On the
              observability side, the analytics surface includes funnels, retention, distribution, journeys, lifecycle,
              and dashboards, while Session Replay extends diagnosis into rrweb-based playback. Replay is not just a
              recording button; the public docs position it as part of the same feedback loop that informs launches and
              experiments. The caveat is that replay has its own browser and privacy edge cases, so it should be
              underwritten as a higher-risk add-on than core flag evaluation.
