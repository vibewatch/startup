      public product objects.
    data:
      nodes:
        - id: n1
          label: Define release object
          detail: A team creates a feature gate, dynamic config, experiment, or holdout in the console or via the Console API.
        - id: n2
          label: Evaluate in runtime
          detail: SDKs or HTTP APIs evaluate the object for a user or request based on targeting and assignment rules.
        - id: n3
          label: Log exposures and events
          detail: Exposure and custom-event data are captured for later analytics and experiment readouts.
        - id: n4
          label: Analyze impact
          detail: Teams inspect experiment results, analytics charts, and sometimes replay sessions to understand behavior.
        - id: n5
          label: Decide rollout
          detail: >-
