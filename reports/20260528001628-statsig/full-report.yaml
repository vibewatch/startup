        title: Platform surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Statsig's public surface is organized around one product-development loop rather than a single standalone
              tool. The company markets feature flags, experimentation, analytics, and warehouse-native analysis as
              connected layers, and the docs reinforce that model by routing developers from gates to dynamic configs to
              experiments depending on whether they need a boolean release control, a structured JSON payload, or a
              randomized test. That matters for diligence because the product definition is not just “flagging”; it is a
              control-and-measurement stack intended to help engineering, product, and data teams ship code, observe
              impact, and decide whether to widen or reverse a release. The module map is therefore broad but still
              coherent: release controls and remote config sit in front of runtime behavior, experimentation and
              holdouts sit on top of exposure data, analytics and replay sit beside experimentation for diagnosis, and
              warehouse-native extends the same workflow to buyers that want analysis on their own datasets.
