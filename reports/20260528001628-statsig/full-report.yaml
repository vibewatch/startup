      - number: '5.2'
        title: Runtime architecture, APIs, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The technical architecture visible in public materials centers on SDK-mediated runtime evaluation plus a
              console and API control plane. Feature gates, dynamic configs, and experiments are all presented as
              runtime checks that happen through Statsig SDKs or APIs, with event and exposure logging feeding
              downstream analysis. Warehouse Native changes where analysis runs, not whether Statsig participates in the
              workflow: public docs still depend on the Statsig console for setup, official SDKs for assignment, and a
              documented pipeline that writes staging and summary tables in the customer warehouse. The result is a
              hybrid architecture rather than a pure no-control-plane appliance. That hybrid model can be a strength for
              buyers who want hosted release management plus warehouse analysis, but it is also a diligence point
              because “warehouse native” does not eliminate implementation choices around assignment, ingestion, logging
              callbacks, and central API governance. Developer tooling such as GitHub code references further suggests
              Statsig is trying to embed itself in the day-to-day engineering loop, not only in a metrics console.
