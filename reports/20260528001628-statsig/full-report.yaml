      - number: '6.3'
        title: Durability, satisfaction, and expansion proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a credible land-and-expand motion, but only through proxies. The recurring
              customer pattern is not a small single-purpose deployment. Webflow replaced a patchwork of homegrown
              gates, experiments, and configs. Brex describes consolidating analytics and experimentation workflows.
              HelloFresh moved off a clunky in-house setup. Code.org had been constrained by the price and limitations
              of earlier tools. SoundCloud and other customers explicitly weighed build-vs-buy tradeoffs before choosing
              a unified platform. In other words, the win condition often starts with feature flags or release control,
              then expands into experimentation, analytics, warehouse-native usage, or dynamic configuration.
              Independent review evidence partially supports this story: TrustRadius scores Statsig 8.9 out of 10 and
              includes examples of replacing Mixpanel and LaunchDarkly, which is consistent with product-surface
              expansion. At the same time, that same review source surfaces recurring friction around UI complexity,
              segmentation limits, metadata handling, and configuration ergonomics. The takeaway is that customer
              stickiness looks plausible where technical teams grow usage across modules, but public evidence still does
              not disclose actual renewal rates, contraction, or cohort retention.
