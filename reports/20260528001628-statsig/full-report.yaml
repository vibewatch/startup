      - number: '1.4'
        title: Milestone chronology, transaction status, and diligence caveats
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that moved quickly from founding into product breadth. Statsig
              published its founding thesis in March 2021, announced general availability and a Sequoia-led Series A
              that August, raised a Series B by April 2022, and launched Warehouse Native in June 2023. The same 2023
              record already showed hundreds of paying customers, thousands of free-tier users, and specific AI
              experimentation features for testing model cost and latency. By May and July 2025, public reporting showed
              a $1.1 billion Series C, a bigger Bellevue headquarters, and hiring plans that implied continued
              standalone scaling.


              The clearest caveat is transaction status. Statsig and OpenAI both said on September 2, 2025 that they had
              signed a definitive agreement, and OpenAI plus Reuters framed the deal as subject to regulatory approval
              and customary closing conditions. Yet Tracxn already labels the company acquired. That mismatch means
              direct sources support an announced transaction but do not, on their face, prove a fully completed close.
              A second caveat is evidence quality asymmetry: product and funding visibility are relatively good, but
              board composition, final closing confirmation, and current headcount remain weaker. Security visibility
              sits in the middle. Statsig publishes a trust page with SOC 2, incident-response, and governance-control
              language, while UpGuard provides an independent vendor-risk lens, but neither source gives the kind of
              detailed operating history an investor would want before treating reliability as fully underwritten.
