      - number: '3.4'
        title: Moat durability, commoditization risk, and adverse readings
        blocks:
          - type: paragraph
            body: >-
              The adverse reading is straightforward: feature management and experimentation are converging into a
              broader capability layer, which means bundle breadth alone is less likely to stay scarce. Forrester
              explicitly treats feature management plus experimentation as one evolving market spanning software
              delivery and product management, and the vendor pack now reflects that framing in practice. GrowthBook
              markets itself as open-source, warehouse-native, lower-cost, and more auditable than Statsig, and its
              migration page attacks Statsig directly on event-based pricing, proprietary analysis, and data ownership.
              Independent reviews echo a softer version of the same warning: LaunchDarkly still wins the
              governance-first enterprise motion, while GrowthBook looks more attractive to teams that want lower cost
              and more ownership. That does not erase Statsig's strengths. Transparent entry pricing, integrated
              analytics plus experimentation, and a mature managed workflow still make it compelling for product-led
              teams that want fast setup and fewer tools. But the moat is segment-specific, not universal. Statsig looks
              strongest where teams want one managed experiment-centric control plane, and weakest where buyers
              prioritize self-hosted portability, zero-copy warehouse governance, or incumbent approval-heavy workflows
              that are already embedded in the organization.
