            body: >-
              The right call for a new financial investor as of 2026-05-28 is avoid, not because Statsig lacked product
              quality, but because the investable standalone upside has effectively closed. OpenAI agreed to buy the
              company at $1.1 billion, and Amplitude later announced that it would take over the Statsig brand,
              customers, and platform operations while coordinating with the team at OpenAI. That means the most
              important economic outcome has already been set and the operating future is split across at least two
              counterparties. If the question is whether the old $1.1 billion mark was absurd, the answer is no: a
              strategic buyer actually paid it. If the question is whether the mark was attractive for a fresh
              late-stage investor hoping for additional upside, the answer is also no: there is no disclosed uplift
              above the Series C, public comps remain far lower, and the missing metrics that would justify paying more
              were never made public. The stance is therefore fair for a strategic buyer, stretched for a financial
