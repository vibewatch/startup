  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Category Convergence
        blocks:
          - type: paragraph
            body: >-
              Statsig sits in a converged product-development tooling market rather than in one clean legacy category.
              The core job is release control plus causal measurement: feature flags, progressive delivery, A/B testing,
              holdouts, metric definition, and post-launch analysis. Forrester explicitly frames feature management and
              experimentation as spanning software delivery and product management, while Azure, AWS, and PostHog
              documentation show that the same control plane is used for beta access, dark launches, safe rollouts,
              remote configuration, and experiment targeting. Product analytics belongs in the adjacent spend pool
              because modern vendors increasingly package analytics next to experimentation and flagging, but it should
              not simply be added to the core experimentation TAM without adjustment. The right market boundary
              therefore includes experimentation infrastructure, feature management, warehouse-native experimentation,
              and a product-analytics adjacency, while excluding generic BI, back-office analytics, and unrelated
              martech testing. The main status-quo substitutes are home-grown flags, internally built experimentation
              tools, and fragmented stacks that keep release control and measurement separate.
