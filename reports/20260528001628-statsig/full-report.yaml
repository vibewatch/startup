            body: >-
              Statsig's fetched customer pack shows breadth, but not in a random or evenly distributed way. The named
              stories cluster around product-led software and internet businesses where release control, experimentation
              cadence, and product analytics matter every day: productivity and collaboration platforms such as Notion
              and Webflow; fintech and financial software such as Brex; consumer commerce and marketplace surfaces such
              as HelloFresh, Whatnot, and OfferUp; social, creator, and media products such as Bluesky, SoundCloud, and
