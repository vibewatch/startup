chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and Bellevue operating footprint
        blocks:
          - type: paragraph
            body: >-
              Statsig presents itself as a modern product-development platform rather than a single-point A/B testing
              tool. Across its homepage, documentation, pricing, and product pages, the company markets an integrated
              stack that combines experimentation, feature management, product analytics, session replay, web analytics,
              warehouse-native analysis, and related release tooling. That positioning matters because it explains both
              the pricing model and the capital story: Statsig is trying to replace a collection of narrower developer
              and analytics products with one metered platform. The official pricing page reinforces that logic with
              free, Pro, and Enterprise tiers tied to usage rather than seat counts.


              Current location signals point to Bellevue, not just the broader Seattle area. Statsig careers materials,
              product pages, and its acquisition blog all close with “Hello from Bellevue, WA,” and GeekWire reported a
              July 2025 move into a new Bellevue headquarters with room for 450 to 500 people. That said, the location
              record is not perfectly clean. Statsig’s 2021 Series A press release used a Kirkland office address, and
              Tracxn still preserves a mix of Kirkland labeling with a Bellevue registered address. The cleanest public
              read is that Statsig now operates out of Bellevue, while older and slower-moving records still reflect its
              earlier Eastside footprint.
