              no longer a clean late-stage venture entry.
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV039
              - CV051
              - CV052
          - type: callout
            title: Why strategic buyers cared
            body: >-
              Statsig paired broad experimentation infrastructure with visible customer and usage proof, making it
              strategically scarce even before OpenAI bought it.
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV047
          - type: callout
            title: The public multiple gap never closed
            body: >-
              Public references like Amplitude and Datadog still sit below Statsig’s implied 27.5x ARR anchor, which is
              why the price only works cleanly for strategic buyers.
            calloutType: risk
            claimRefs:
              - CV026
              - CV031
              - CV037
          - type: callout
            title: Bull case needs more than the retained ARR estimate
            body: >-
              Anything above the realized $1.1B outcome would have required much higher ARR, cleaner economics, or
              another scarcity-driven bidding event.
            calloutType: assumption
            claimRefs:
              - CV045
              - CV050
