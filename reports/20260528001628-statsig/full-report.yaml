  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance to Statsig
    rows:
      - - Feature management / progressive delivery
        - Flags, rollout control, kill switches, targeting, remote config, dark launches
        - Generic CI/CD tooling without runtime control
        - Platform engineering, application engineering, developer tools budgets
        - Core control-plane wedge that gets products safely into production
      - - Experimentation / A/B testing
        - Assignment, holdouts, metric calculation, causal readouts, experiment governance
        - Pure web-CRO agencies and manual spreadsheet analysis
        - Product teams, growth teams, data-science-supported product orgs
        - Core causal-measurement layer that expands after flags are in place
      - - Warehouse-native experimentation
        - Experiment analysis against Snowflake, BigQuery, Databricks, or Redshift data using governed metrics
        - Standalone warehouses with no release-control or experiment workflow
        - Data platform, analytics engineering, security-conscious enterprise buyers
        - High-value architectural wedge when metric trust and data residency matter
      - - Product analytics adjacency
        - Event analytics, funnels, retention, journey analysis, session understanding, warehouse pairing
        - General BI, finance reporting, unrelated martech analytics
        - Product, growth, analytics, and digital teams
        - Important adjacent pool because many vendors package analytics beside experimentation
      - - AI product iteration / release analytics
        - Measurement of AI-powered experiences, release health, and post-launch impact
        - Model training infrastructure unrelated to product release decisions
        - AI product teams, platform teams, innovation leaders
        - Growing adjacency because AI increases release frequency and the need for controlled measurement
      - - Status-quo substitutes
        - Home-grown flags, internal testing tools, fragmented analytics stacks, manual rollout decisions
        - N/A
        - Same functional buyers using cheaper or already-owned tools
        - Real alternative to purchase, and often the main source of switching friction
    notes: >-
      Boundary table separates the core FM&E control plane from adjacent analytics and AI-iteration budgets so later
      sizing does not double-count every product-data tool.
