  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Statsig reached a strategic-fair but financially-unattractive valuation because product breadth and scarcity
      offset weak public-comparable support.
    data:
      nodes:
        - id: breadth
          label: Integrated product breadth
          detail: >-
            Feature releases, experimentation, analytics, performance monitoring, and session replay created a broad
            product-development stack.
          tone: positive
        - id: proof
          label: Usage and customer proof
          detail: Third-party sources put Statsig near $40M ARR with 300+ paying customers and large-scale deployments.
          tone: positive
        - id: scarcity
          label: Strategic scarcity
          detail: Datadog explored a deal and OpenAI paid $1.1B, showing real strategic demand for experimentation assets.
          tone: positive
        - id: comp-gap
          label: Public comp gap
          detail: Amplitude and Datadog both screen below Statsig’s implied 27.5x ARR multiple on public data.
          tone: warning
        - id: handoff
          label: Post-close split stewardship
          detail: OpenAI owns the company while Amplitude operates the platform and customer base.
          tone: warning
        - id: decision
          label: Avoid new capital
          detail: Fair for a strategic buyer, but no clean standalone upside remains for a fresh financial investor.
          tone: neutral
      edges:
        - from: breadth
          to: proof
        - from: proof
          to: scarcity
        - from: scarcity
          to: decision
        - from: comp-gap
          to: decision
        - from: handoff
          to: decision
    approximationNotes: This figure captures underwriting logic, not a process flow inside the product.
    claimRefs:
      - CV009
      - CV006
      - CV007
      - CV014
      - CV016
      - CV037
      - CV047
      - CV052
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Statsig’s realized 27.5x ARR anchor sat well above the closest fetched public references.
    data:
      items:
        - label: Amplitude public multiple
          value: 2.4
          detail: Approximate market-cap-to-ARR based on $0.91B market cap and $374M ARR.
          tone: positive
        - label: 10x ARR floor
          value: 10
          detail: Simple high-growth software floor on $40M ARR.
          tone: neutral
        - label: 15x ARR mid-case
          value: 15
          detail: Represents a premium but non-strategic software outcome.
          tone: neutral
        - label: Datadog live multiple
          value: 19.6
          detail: Approximate market-cap-to-annualized-Q1-sales for a far larger platform.
          tone: warning
        - label: 20x ARR strategic-lite
          value: 20
          detail: Upper-end rich software multiple without the full realized scarcity premium.
          tone: warning
        - label: Statsig realized anchor
          value: 27.5
          detail: Series C and OpenAI acquisition price on the retained ~$40M ARR estimate.
          tone: negative
    approximationNotes: >-
      Multiples mix ARR and annualized sales where that is what the public source set provides. The purpose is
      directional comparison, not perfect apples-to-apples valuation science.
    claimRefs:
      - CV019
      - CV026
      - CV031
      - CV037
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The realized $1.1B strategic outcome sits near the center of the base case and far above non-strategic software
      ranges.
    data:
      items:
        - label: Bear case ($M)
          low: 400
          mid: 550
          high: 700
          detail: No strategic buyer and valuation converges toward rich but non-scarcity software ranges.
          tone: negative
        - label: Base / realized ($M)
          low: 1000
          mid: 1100
          high: 1200
          detail: Observed strategic clearing price with little or no disclosed markup above the Series C.
          tone: warning
        - label: Bull case ($M)
          low: 1400
          mid: 1600
          high: 1800
          detail: Requires much higher ARR than the retained estimate or another strategic bidding event.
          tone: positive
    approximationNotes: >-
      Ranges are buyer-dependent valuation frames, not discounted cash-flow outputs. The base case uses the realized
      transaction as the best observable anchor.
    claimRefs:
      - CV038
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: Product quality and strategic scarcity scored well; public-comparable support and investability scored poorly.
    data:
      items:
        - label: Product breadth
          score: 8
          detail: Integrated feature management, experimentation, analytics, monitoring, and replay are credible strengths.
          tone: positive
        - label: Customer proof
          score: 7
          detail: Customer references and third-party scale estimates show real adoption, albeit with curated disclosure.
          tone: positive
        - label: Strategic scarcity
          score: 8
          detail: OpenAI paid $1.1B and Datadog had explored a deal before buying Eppo.
          tone: positive
        - label: Public comp support
          score: 3
          detail: Amplitude and Datadog both screen below Statsig’s implied multiple on retained public data.
          tone: warning
        - label: Capital efficiency
          score: 7
          detail: Total raised was modest relative to the eventual $1.1B exit value.
          tone: positive
        - label: Evidence quality
          score: 4
          detail: Retention, churn, gross margin, and terms remain private.
          tone: warning
        - label: Current investability
          score: 2
          detail: OpenAI ownership and Amplitude platform stewardship leave no clean standalone late-stage entry.
          tone: negative
    approximationNotes: >-
      Scores are internal IC-style judgments synthesized from the fetched source set rather than externally reported
      ratings.
    claimRefs:
      - CV022
      - CV037
      - CV038
      - CV047
      - CV048
      - CV050
      - CV051
      - CV052
