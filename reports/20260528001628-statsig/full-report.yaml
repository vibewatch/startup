  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The best case for Statsig’s valuation was always strategic, not purely financial. The company assembled a
              broad product-development stack that combined feature releases, experimentation, analytics, performance
              monitoring, and session replay, and it sold that stack through a usage-based model that could run either
              in Statsig’s cloud or warehouse-native on customer infrastructure. Third-party estimates put the business
              at roughly $40 million of ARR around the May 2025 Series C, with more than 300 paying customers and over 1
              trillion daily events, while customer references said buyers evaluated incumbents such as Optimizely,
              LaunchDarkly, Split, and Eppo before choosing Statsig for integrated workflows. Those are real proof
              points. The anti-thesis is that none of the retained public sources disclose net retention, gross margin,
              churn, or the exact Series C terms, so the public record cannot prove that a 27.5x ARR price was justified
              for a financial investor rather than for a strategic acquirer seeking scarce experimentation
              infrastructure.
