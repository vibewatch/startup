              Statsig has a credible public enterprise-control surface, but it is strongest at the organization and
              project level rather than at the most granular object level. The access-management docs clearly separate
              SSO from SCIM, document enterprise OIDC SSO, and show Okta-based SCIM lifecycle automation. The
              warehouse-native roles page adds an explicit RBAC story for who can view, edit, and approve experiments,
