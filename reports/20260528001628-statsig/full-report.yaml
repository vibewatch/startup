      - number: '3.3'
        title: Governance, trust posture, switching costs, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              The trust and switching-cost picture is mixed rather than one-directional. Statsig can point to
              platform-scale reliability and a warehouse-native option, but governance-heavy incumbents still have
              stronger default mindshare for approval chains, auditability, and enterprise release safety.
              LaunchDarkly's independent positioning remains governance-first, Optimizely emphasizes long operating
              history plus secure on-prem and cloud experience, Harness describes peer review, rollback discipline,
              RBAC, SSO, and 2FA, and VWO exposes approvals, SSO, and extensive certification detail directly on
              retained pages. GrowthBook, Eppo, and PostHog offer a different trust pitch: data stays in the buyer's
              environment or can be self-hosted, local evaluation avoids per-check network calls, and open-source or
              warehouse-native architecture reduces hard infrastructure dependence on the vendor. OpenFeature takes that
              further by lowering code-level lock-in through a vendor-agnostic API. The result is that switching costs
              around Statsig are more workflow and governance based than code based. Metrics, rollout habits, experiment
              history, and procurement standardization all create stickiness, but true hard lock-in is weaker wherever
              buyers keep data in their own warehouse, self-host critical components, or standardize on an abstraction
              layer that preserves multi-homing.
