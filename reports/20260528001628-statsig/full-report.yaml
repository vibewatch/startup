        - CO016
        - CO017
        - CO018
  foundingLocation: Kirkland / Bellevue, Washington, USA
  headquarters: Bellevue, Washington, USA
  productSummary: >-
    Statsig sells a usage-based platform that combines feature flags, dynamic configs, experimentation, product
    analytics, session replay, and warehouse-native analysis with broad SDK coverage and enterprise controls.
  customerFocus: >-
