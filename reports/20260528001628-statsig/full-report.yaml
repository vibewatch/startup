          one platform.
        - Show the platform also produced software-quality retention and margin metrics, not just breadth.
      - - Usage-based and warehouse-native deployment can scale with customers
        - Pricing is metered, and docs describe both warehouse-native and hosted deployment options.
        - Disclose how much ARR comes from expanding event volume versus one-time or low-quality usage.
      - - Customer proof indicates real competitive wins
        - >-
          Customer references say buyers evaluated Optimizely, LaunchDarkly, Split, and Eppo before choosing Statsig,
          and one deployment scaled to hundreds of millions of users.
        - Provide more independent customer retention and expansion data rather than selected testimonials.
      - - 'Counter: public comp math is much lower'
        - >-
          Amplitude traded near ~2.4x and Datadog near ~19.6x versus Statsig’s implied ~27.5x on the retained ARR
          estimate.
        - A higher audited ARR base or clearer strategic bidding evidence would narrow the gap.
      - - 'Counter: the exit was flat to the round'
        - OpenAI’s $1.1B transaction validated the Series C but showed no disclosed uplift above it.
        - A later disclosed markup or cleaner post-close economics would improve the financial-investor case.
      - - 'Counter: stewardship is now split across OpenAI and Amplitude'
        - OpenAI kept the company while Amplitude took over brand, customers, and platform operations.
        - >-
          Exact post-close rights, economics, and support obligations could clarify whether continuity risk is
          overstated.
    notes: >-
      The positive case is strategic scarcity plus product breadth. The negative case is flat realized upside plus
      missing economics.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
