      - number: '1.2'
        title: Founder background, leadership concentration, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Statsig’s public identity is still unusually concentrated around Vijaye Raji. The retained record ties the
              company tightly to his background at Microsoft and Facebook: Microsoft documents him as the creator of
              Small Basic, while Meta’s engineering blog profiled him on the Seattle Messenger team long before Statsig
              existed. Later coverage says he ran Facebook’s Seattle engineering organization and held vice-president
              roles that align directly with Statsig’s founding thesis of fast experimentation and data-informed product
              shipping. That makes the founder-market-fit case unusually strong and helps explain why multiple investor
              and press profiles describe Statsig as a founder-led product company.


              Governance visibility, however, is much thinner than product visibility. The clearest public governance
              datapoint is the 2025 Series C disclosure that ICONIQ Growth partner Murali Joshi joined the board. Beyond
              that, the direct public sources reviewed here do not provide a clean, current board roster, committee
              structure, or detailed voting-rights picture. That matters because the OpenAI transaction introduces a
              change-of-control overlay on top of already limited private-company governance transparency. OpenAI’s
              announcement makes clear that Raji is expected to become CTO of Applications and that the transaction
              would shift employee and control dynamics materially once it closes, but it does not substitute for a full
              governance packet.
