  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              Statsig’s monetization is unusually legible for a private infrastructure startup because the company
              publishes both a free developer tier and a metered Pro tier. The official pricing page shows a classic
              product-led ladder: free access for individual builders, a $150 per month Pro plan with included event
              volume and paid overages, and custom enterprise contracts. The economic signal is not seat monetization;
              Statsig repeatedly frames pricing around events, experiment usage, and deployment scale, while also saying
              seats, flags, and environments are not the limiting variable. Warehouse Native matters financially because
              it widens the enterprise aperture without forcing every customer into Statsig-hosted compute, and Sacra
              explicitly argues that this deployment option can lower Statsig’s own infrastructure burden. The
              revenue-quality caveat is equally important. Public list pricing explains packaging and the mechanism by
              which a customer can expand spend, but it does not show realized ASPs, discounts, renewal rates, or the
              mix between self-serve Pro and negotiated enterprise commitments. In other words, the top of the funnel is
              transparent, while the real monetization engine is still private.
