  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / alternative
      - Category
      - Public scale / adoption signal
      - Target buyer / team
      - Product scope
      - Differentiation
      - Limitation
    rows:
      - - Statsig
        - Integrated experimentation control plane
        - 1T+ events/day, 99.99% uptime, 2.5B monthly experiment subjects, trusted by thousands
        - Product, growth, data, and engineering teams
        - Analytics, experimentation, feature management, replay, web analytics, configs, WHN
        - Integrated workflow plus transparent self-serve pricing
        - No official self-host deployment; portability weaker than open-source rivals
      - - LaunchDarkly
        - Governance-led feature-management incumbent
        - Independent reviews still frame it as category leader; official scope spans runtime control and agent control
        - Enterprise engineering and platform teams
        - Feature flags, progressive delivery, experimentation, observability, agent control
        - Approvals, auditability, and release-governance credibility
        - Public pricing becomes quote-driven and analytics breadth is narrower than integrated suites
      - - Optimizely
        - Enterprise experimentation incumbent
        - Trust-center materials emphasize over two decades of secure delivery across cloud and on-prem environments
        - Digital product, growth, and experimentation teams
        - Feature experimentation, stats engine, warehouse connectivity, AI optimization
        - Strong statistical tooling and cross-stack experimentation
        - Public pricing is request-driven and not warehouse-native/open-source first
      - - Harness / Split
        - Release-monitoring and experimentation incumbent
        - >-
          Split brand persists inside Harness FME; CostBench highlights mature enterprise attribution and wide SDK
          coverage
        - Platform, DevOps, and product teams
        - Feature flags, targeting, dynamic configs, release monitoring, experimentation, warehouse-native experiments
        - Ties rollout control to impact data and release monitoring
        - Per-user economics can escalate and broader DevOps platform complexity can raise adoption friction
      - - Amplitude
        - Analytics-first adjacent suite
        - Official pricing and trust portal show broad suite packaging and enterprise trust surfaces
        - Product, growth, executive, and analytics teams
        - Analytics, feature experiment, web experiment, activation, replay, AI tools
        - PM-friendly analytics plus experimentation in one suite
        - Higher-tier economics stay custom and deployment posture is SaaS-first
      - - GrowthBook
        - Warehouse-native open-source rival
        - 3,000+ companies and 100B+ feature-flag lookups/day on homepage
        - Technical product and data teams
        - Experimentation, feature flags, product analytics, warehouse-native cloud or self-host
        - Open source, self-hosted, predictable seat pricing, auditability
        - More setup ownership and weaker distribution than managed incumbents
      - - Eppo
        - Warehouse-native experimentation specialist
        - Official site says feature flags power billions of daily assignments; now framed as Datadog Experiments
        - Data science, product, engineering, and marketing teams
        - Experimentation, feature flagging, contextual bandits, no-code marketing tests
        - Zero-copy warehouse-native rigor with no user-level data through the platform
        - Pricing is opaque and reviewed pack does not show self-host deployment
      - - PostHog
        - Open-source adjacent product suite
        - 60,000+ customers and 10+ products on official pricing page
        - Engineering-led startups and technical product teams
        - Analytics, replay, feature flags, experiments, surveys, data warehouse, workflows
        - Broad suite plus open-source and self-host options
        - Cloud-first economics often beat self-hosting; less optimized for non-technical PM workflows
      - - VWO
        - Optimization and feature experimentation adjacent
        - 3,000+ customers and extensive compliance certifications on security page
        - Optimization, experimentation, and digital-experience teams
        - Web and mobile testing, feature experimentation, rollouts, approvals, guardrails
        - Strong web optimization workflow and governance surfaces
        - Not a full product-data operating system and enterprise price benchmarking stays incomplete
      - - Internal build / status quo
        - Substitute
        - No shared public scale signal; economics are engineering time or existing analytics-stack default
        - Teams prioritizing control, low upfront cash cost, or existing stacks
        - Home-grown flags and experiments, OpenFeature abstraction, or analytics plus point tools
        - Maximum portability and custom fit
        - Slow time to value, ongoing operating burden, and harder cross-team governance
    notes: >-
      Rows synthesize retained official product, pricing, docs, and trust pages plus selective independent comparison
      evidence; only public adoption signals are listed.
