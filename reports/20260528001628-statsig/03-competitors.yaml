  evidenceGaps:
  - type: missing-source
    severity: material
    topic: private-competitor-scale
    missingEvidence: Like-for-like current ARR, customer counts, and financing strength for private rivals such as Statsig, LaunchDarkly, Harness FME, and Eppo.
    whyItMatters: Relative scale affects pricing-war durability, ecosystem leverage, and how aggressively competitors can subsidize adjacent modules.
    diligencePath: Request management metrics, paid-database pulls, or customer-reference scale disclosures before underwriting durable share assumptions.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-floors
    missingEvidence: Actual minimum commits, floor prices, and discounting behavior for LaunchDarkly, Optimizely, Harness FME, Eppo, and upper-tier Amplitude or VWO deals.
    whyItMatters: Quote-driven packaging makes it difficult to compare total cost of ownership and whether Statsig remains meaningfully cheaper at enterprise scale.
    diligencePath: Collect live vendor proposals, procurement screenshots, or customer order forms from reference accounts and update the pricing table with verified enterprise floors.
    relatedQuestionRefs:
    - QP028
  - type: private-evidence-only
    severity: material
    topic: renewal-and-win-loss-proof
    missingEvidence: Independent renewal, attach-rate, or win-loss data showing whether Statsig’s integrated bundle actually reduces multi-homing and drives better retention over time.
    whyItMatters: Without renewal or displacement evidence, moat claims remain directional and could overstate the durability of bundle-led differentiation.
    diligencePath: Ask Statsig and customer references for win-loss logs, product attach by cohort, renewal narratives, and reasons buyers kept or replaced adjacent vendors.
    relatedQuestionRefs:
    - QP029
