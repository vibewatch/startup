- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or pressure point
  - Evidence
  - Threat vector
  - Severity
  - Current mitigation or offset
  - Diligence ask
  rows:
  - - Integrated experimentation-centric bundle
    - Statsig ties analytics, flags, experiments, and replay into one managed workflow
    - Amplitude, PostHog, Optimizely, and GrowthBook are all broadening bundle scope too
    - High
    - Still simplifies procurement and workflow for product-led teams
    - Ask for multi-product attach, expansion, and retention by cohort
  - - Transparent self-serve entry pricing
    - Statsig publishes free and Pro entry economics
    - GrowthBook, PostHog, and other transparent rivals reduce scarcity of that signal
    - Medium
    - Pricing still improves buyer trust and speed of adoption
    - Collect real enterprise quotes to see whether transparency survives at scale
  - - Warehouse-native option
    - Statsig supports Warehouse Native with no ETL
    - GrowthBook and Eppo make warehouse control the center of their pitch, not an option
    - High
    - Statsig can still offer managed or warehouse-native flexibility
    - Validate win rates where data teams own the experimentation stack
  - - Managed workflow convenience
    - Managed setup and integrated stats reduce engineering overhead
    - Open-source and self-hosted options lower long-run lock-in and can be cheaper for certain workloads
    - Medium
    - Fast setup matters for teams without deep experimentation infra
    - Measure time-to-first-test and total engineering hours across alternatives
  - - Governance and enterprise approvals
    - LaunchDarkly, Optimizely, Harness, and VWO highlight approvals, auditability, SSO, and release discipline
    - Governance-heavy enterprises may treat Statsig as good but not default-best
    - High
    - Statsig wins where governance needs are lighter or more product-led
    - Reference-check enterprise rollout, RBAC, and approval fit against LaunchDarkly-class buyers
  - - Portability and code-level lock-in
    - OpenFeature plus self-hosted rivals reduce hard code lock-in
    - Buyers can abstract vendors or keep data on their own infra
    - Medium
    - Workflow, experiment history, and procurement still create switching friction
    - Ask whether current customers standardize on OpenFeature or equivalent abstractions
  - - Status-quo and internal-build substitute
    - Internal build remains feasible in principle and appeals to control-minded teams
    - Hidden operating burden can be ignored until later
    - Medium
    - Dedicated vendors still deliver faster time to value
    - Request real internal-build cost comparisons before dismissing substitute risk
  - - Category convergence / commoditization
    - Forrester and current vendor pages show experiments plus release control becoming common
    - No single feature stays scarce enough to defend premium alone
    - High
    - Statsig can still compete on integrated workflow and speed
    - Track roadmap velocity, win-loss reasons, and bundle attach versus direct peers
  - - Adverse migration narrative
    - GrowthBook now pitches direct migration from Statsig on pricing, data ownership, and auditability
    - Warehouse-native and open-source rivals can frame Statsig as a managed lock-in risk
    - High
    - Statsig can counter with managed convenience and integrated workflow
    - Probe how often this narrative appears in competitive deals and renewals
  notes: Severity reflects likely impact on a 2026 buying process, not a quantified financial-loss model.
