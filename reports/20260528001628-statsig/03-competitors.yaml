- id: capabilities-pricing-and-deployment
  title: Capability breadth, packaging transparency, and deployment posture
  body: 'On official pages, Statsig presents itself as a tightly integrated experimentation control plane: feature management, experiments, analytics, replay, web analytics, configs, and warehouse-native operation all sit inside one product family, and the pricing FAQ publishes a real self-serve ramp with 2 million free metered events, a $150 Pro tier, and explicit overages. That breadth is real, but it is no longer unique in direction. Amplitude sells experiment plus analytics plus replay inside a broader suite; Optimizely bundles feature experimentation with its own stats engine and warehouse connectivity; Harness Split connects feature flags to monitoring and warehouse-native experiments; GrowthBook offers experiments, flags, and analytics with cloud or self-hosted deployment; Eppo combines warehouse-native experimentation with fast flags; PostHog sells a broader developer bundle; and VWO packages testing, rollouts, approvals, and guardrails. The sharper distinction is packaging and deployment
    philosophy. Statsig, GrowthBook, PostHog, and some Amplitude entry points are publicly legible. LaunchDarkly, Optimizely, and enterprise-heavy incumbents remain harder to benchmark from public list pricing alone. Warehouse-native and self-host tradeoffs create the second fault line: Statsig supports warehouse-native mode, but GrowthBook, Eppo, and internal-build paths push harder on data ownership and portability as the core buying message.'
