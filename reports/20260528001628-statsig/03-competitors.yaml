chapter:
  number: 3
  title: Competitors
  summary: Statsig faces a three-sided competitive squeeze rather than one mirror-image rival. LaunchDarkly, Optimizely, and Harness Split still own governance-led or enterprise release-control buying motions; GrowthBook, Eppo, PostHog, and internal-build paths pressure Statsig on warehouse-native control and deployment portability; and Amplitude plus VWO keep adjacent experimentation budgets contestable. Statsig remains differentiated where buyers want integrated experimentation, analytics, and release control with transparent self-serve entry pricing, but its moat is softer where teams prioritize open-source portability, zero-copy warehouse governance, or incumbent approval-heavy workflows.
sections:
- id: landscape-and-classes
  title: Direct rivals, adjacent suites, and substitute paths
  body: 'Statsig no longer competes inside a narrow feature-flag niche. The closest direct rivals are the platforms that combine release control with experimentation and at least some analytics or metric layer: LaunchDarkly, Optimizely, Harness Split, GrowthBook, Eppo, and PostHog all overlap with the same buyer job from different starting points. LaunchDarkly and Optimizely approach the category from enterprise release governance and experimentation rigor. Harness keeps the old Split thesis alive by tying flags and experiments to release monitoring and warehouse-native analysis. GrowthBook and Eppo attack from the warehouse-native side, arguing that experimentation should stay inside the buyer''s own data and metric stack. PostHog competes from the open-source developer-suite angle, while VWO stays adjacent by owning web and app optimization workflows that can still absorb experimentation budget. The substitute set matters too: internal build, existing analytics plus point tools, and standards
    such as OpenFeature all keep multi-homing plausible. That means Statsig must win on integrated workflow speed, not on the assumption that buyers are structurally locked into one vendor class.'
