  - id: governance-privacy-and-operational-risk
    title: Warehouse-native governance, privacy, and operational risk
    body: 'Statsig''s warehouse-native design is a genuine differentiator, but it is also the source of substantial implementation and governance burden. The product requires a service user, job execution permissions, read access to customer metric and exposure data, and write access to a dedicated staging environment. Statsig states that some aggregate results and diagnostics are still stored on its servers, and its own documentation warns that experiment staging data can multiply quickly as experiment volume rises. Best-practice guidance is explicit that customers need partitioning, clustering, incremental reloads, and scoped resources to keep spend and contention under control. The security posture is materially better than an opaque startup baseline: Statsig advertises SOC 2 Type II, encryption, backups, disaster recovery, and incident response. But the privacy and legal stack also makes clear that the customer remains the controller, that sensitive data should not be sent under standard terms, that HIPAA support requires a BAA, and that the vendor chain now spans Amplitude-branded legal ownership plus multiple AI and infrastructure subprocessors. This is manageable for disciplined teams, but not frictionless.'
