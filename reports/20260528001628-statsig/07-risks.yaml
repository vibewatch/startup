  evidenceGaps:
    - type: missing-source
      severity: material
      topic: contract-counterparty-and-support-ownership
      missingEvidence: Current 2026 master service agreement, order form language, and a written statement naming the legal counterparty, roadmap owner, and support owner after the OpenAI / Amplitude transition.
      whyItMatters: The biggest residual risk is continuity; without hard documents, buyers cannot know who actually controls pricing, support, roadmap, or remedies.
      diligencePath: Request the live contracting pack, escalation SLA, and a management letter covering ownership, roadmap commitments, and support responsibilities.
      relatedQuestionRefs:
        - QR001
        - QR004
      relatedTableRefs:
        - TR001
        - TR003
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-10 customer ARR mix, renewal dates, NRR by cohort, and exposure to any single reference account or cloud-native segment.
      whyItMatters: Public materials prove adoption quality but do not quantify revenue durability or concentration risk, so downside could be larger than the visible reference set suggests.
      diligencePath: Obtain cohort, renewal, and concentration schedules plus board or finance materials that show customer mix by segment and contract length.
      relatedQuestionRefs:
        - QR027
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: regulated-enterprise-proof
      missingEvidence: Named reference calls and deployment artifacts from healthcare, financial-services, or other highly regulated customers using the same modules under review.
      whyItMatters: The public proof set skews toward digital-native teams; regulated buyers need evidence that governance, security, and support claims survive slower procurement and stricter audit requirements.
      diligencePath: Request at least three regulated-customer references, sample security questionnaires, and evidence of successful compliance reviews.
      relatedQuestionRefs:
        - QR026
      relatedTableRefs:
        - TR003
        - TR005
    - type: private-evidence-only
      severity: material
      topic: warehouse-native-tco
      missingEvidence: Representative query-cost, storage-footprint, and contention model for a real enterprise workload across one target warehouse.
      whyItMatters: Statsig's own best-practice docs warn that costs and contention can rise sharply as experimentation scales, but public materials do not quantify real customer TCO.
      diligencePath: Run a time-boxed pilot on the buyer's warehouse with actual data volume, measure compute and storage impact, and compare against a hosted alternative.
      relatedQuestionRefs:
        - QR012
      relatedTableRefs:
        - TR002
        - TR005
    - type: private-evidence-only
      severity: material
      topic: security-assurance-depth
      missingEvidence: Current SOC 2 report, penetration-test summary, subprocessor due-diligence pack, and current BAA template for regulated deployments.
      whyItMatters: Public trust-center statements are useful but not enough for high-assurance underwriting, especially with a widened vendor chain and transition-driven counterparty questions.
      diligencePath: Request the latest audit reports, pen-test executive summary, vendor-management policy, incident history, and healthcare compliance packet under NDA.
      relatedQuestionRefs:
        - QR015
        - QR019
        - QR021
      relatedTableRefs:
        - TR001
        - TR002
