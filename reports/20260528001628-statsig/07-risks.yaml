  - id: methodology-reference-set-and-people-risk
    title: Methodology, reference-set, and people risk
    body: Statsig's strongest product message is statistical sophistication, but that cuts both ways. The platform exposes Bayesian and frequentist methods, CUPED, sequential testing, bandits, AI evals, guardrails, and release controls directly to operators. The documentation itself says peeking inflates false positives, early statistically significant reads may still be underpowered, vanilla bandits can converge to subgroup-wrong answers, and LLM-as-a-judge is inherently imperfect. Those are not reasons to avoid the product; they are reasons to underwrite operator quality as part of the risk package. The people side of the story is equally important. Public customer proof is concentrated in digital-native, AI, marketplace, and e-commerce logos that already have strong product, engineering, and data functions. That is encouraging for sophisticated buyers, but it biases the reference set toward teams that can tolerate warehouse setup, policy configuration, and experimental rigor. At the same time, public materials do not disclose customer concentration or renewal exposure. After the OpenAI and Amplitude transition, that leaves buyers with both execution risk and evidence-selection bias.
