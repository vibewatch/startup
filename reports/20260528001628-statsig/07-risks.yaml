callouts:
  - calloutType: risk
    title: Transition risk is the top-ranked residual exposure
    body: The most material risk is not platform functionality; it is whether the OpenAI and Amplitude handoff leaves customers with slower roadmap execution, weaker support continuity, or a moving counterparty.
    claimRefs:
      - CR041
      - CR042
      - CR044
      - CR045
  - calloutType: risk
    title: Warehouse-native is powerful, but it is not operationally free
    body: Warehouse-native deployment improves control over data location, but it also requires meaningful permissions, staging storage, and warehouse-optimization work that can erode ROI if underestimated.
    claimRefs:
      - CR013
      - CR017
      - CR018
      - CR019
      - CR022
  - calloutType: assumption
    title: Do not over-read the public reference set
    body: Public customer proof is strongest for AI-native and product-led teams; regulated-enterprise underwriting still needs direct references, compliance artifacts, and concentration data.
    claimRefs:
      - CR046
      - CR047
      - CR048
      - CR060
  - calloutType: recommendation
    title: Treat method risk like model risk
    body: Because the platform exposes advanced statistical and AI-eval tooling directly to operators, diligence should test experiment governance, reviewer coverage, and misuse-prevention defaults before trusting topline outcomes.
    claimRefs:
