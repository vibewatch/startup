chapter:
  number: 7
  title: Risks
  summary: 'Statsig''s risk profile is led by corporate-transition uncertainty, not by a simple product deficiency. The verified OpenAI acquisition, subsequent Amplitude-branded legal stack, and external reporting on an Amplitude handoff create real continuity, roadmap, and key-person risk on top of already meaningful warehouse-native governance, privacy, and statistical-misuse complexity. Public mitigations are credible but mostly framework-level, so the right posture is conditional: require hard proof on counterparty continuity, warehouse-native TCO, regulated-customer references, and concentration before underwriting aggressive expansion assumptions.'
sections:
  - id: transaction-and-pricing-risk
    title: Transaction, competitive, and pricing risk
    body: 'The highest residual risk is not a product bug; it is control drift over who actually owns the future of the platform. Official acquisition announcements show Statsig agreed to join OpenAI in September 2025, with Vijaye Raji moving to CTO of Applications and employees expected to become OpenAI employees after close. Yet current public legal materials already sit under Amplitude, and MarTech reports that Amplitude will take over the Statsig brand, customer base, roadmap, and support while the original team remains at OpenAI. That combination creates exactly the kind of continuity risk enterprise buyers dislike: the code may persist while key operators, statistical experts, and product leaders sit elsewhere. Competitive risk compounds the transition. Statsig''s own pricing is attractive at the low end, but the expansion thesis depends on selling a consolidated platform into accounts that can also choose PostHog''s generous free tier, Amplitude''s lower entry pricing, or Optimizely''s incumbent enterprise bundle. If Amplitude rationalizes overlapping products or reprices too aggressively, churn risk rises and pricing power compresses at the same time.'
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
