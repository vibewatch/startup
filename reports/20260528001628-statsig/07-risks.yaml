  - id: mitigations-kill-criteria-and-diligence
    title: Mitigations, kill criteria, and concrete diligence asks
    body: Public mitigations exist, but they are mostly framework-level rather than outcome-level. Statsig documents access controls, reviews, approvals, policy settings, diagnostics, and security practices, which means the company understands the relevant failure modes. The unresolved issue is whether those controls are consistently operated during a period of corporate transition and whether customers can implement them without disproportionate internal effort. For underwriting, the cleanest framing is to turn the open issues into explicit kill criteria. If the counterparty, support owner, or roadmap commitment changes again, the deployment deserves re-underwriting. If warehouse-native compute cost or contention is structurally higher than expected, the claimed governance and TCO advantage weakens fast. If HIPAA, DPA, or subprocessor governance cannot be documented to a regulated buyer's standard, the addressable market narrows. And if bundle economics deteriorate versus PostHog, Amplitude, or Optimizely, expansion assumptions should be cut. The remaining diligence package should therefore focus on post-transition commercial continuity, actual customer concentration, regulated-enterprise proof, and a realistic warehouse cost model.
