    {
      "id": "adverse-lens-and-underwriting-gaps",
      "title": "Adverse lens and underwriting blockers",
      "body": "The adverse financial story is not visible distress; it is the combination of competitive pressure, product friction, and opaque private economics. Sacra’s risk section is clear that experimentation spend can be absorbed into broader observability or analytics budgets, which is a real pricing risk for any standalone tool vendor. The same report warns that advanced statistical sophistication may be more valuable to power users than to mainstream buyers, weakening willingness to pay if broader customers only need simpler testing workflows. TrustRadius reviews reinforce that concern from the user side: buyers describe Statsig as powerful but also call out a complex data-science-oriented interface and workflow limitations. The biggest blocker, however, is missing financial disclosure. None of the retained sources provide gross margin, CAC, payback, NRR, customer concentration, cash on hand, monthly burn, debt facilities, or a clean post-acquisition standalone reporting view. Even the filing trail is imperfect: the SEC legacy browse search did not yield a directly readable Statsig company filing in fetched main content, and market-data services can lag, as shown by Crunchbase’s older snapshot still pointing to Series B as the latest round. The right financial conclusion is therefore positive on product-market fit and capital access, but cautious on normalized earnings power and valuation precision.",
