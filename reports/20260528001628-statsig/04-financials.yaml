  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Statsig’s public financial picture supports a usage-priced experimentation platform with credible product breadth, strong 2025 usage growth signals, and more than $153 million of outside capital before the announced $1.1 billion OpenAI acquisition. Official pricing pages show a clear PLG-to-enterprise ladder and a warehouse-native option that could improve cost structure, while Sacra and other market-data sources imply roughly $40 million of ARR and a 145–170 employee base. The blocker is still underwriting precision: public sources do not disclose gross margin, burn, runway, CAC, NRR, customer concentration, or a post-acquisition standalone financial view."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue model and pricing architecture",
      "body": "Statsig’s monetization is unusually legible for a private infrastructure startup because the company publishes both a free developer tier and a metered Pro tier. The official pricing page shows a classic product-led ladder: free access for individual builders, a $150 per month Pro plan with included event volume and paid overages, and custom enterprise contracts. The economic signal is not seat monetization; Statsig repeatedly frames pricing around events, experiment usage, and deployment scale, while also saying seats, flags, and environments are not the limiting variable. Warehouse Native matters financially because it widens the enterprise aperture without forcing every customer into Statsig-hosted compute, and Sacra explicitly argues that this deployment option can lower Statsig’s own infrastructure burden. The revenue-quality caveat is equally important. Public list pricing explains packaging and the mechanism by which a customer can expand spend, but it does not show realized ASPs, discounts, renewal rates, or the mix between self-serve Pro and negotiated enterprise commitments. In other words, the top of the funnel is transparent, while the real monetization engine is still private.",
