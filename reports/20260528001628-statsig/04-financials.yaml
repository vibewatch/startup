      "id": "scale-growth-and-margin-proxies",
      "title": "Scale, growth, and margin proxies",
      "body": "The strongest public financial support for Statsig is directional scale rather than audited revenue. The company’s 2025 recap claims 20,000 weekly active users, 3 trillion events processed per day, 4 billion unique end users reached through experiments, 2.5 times year-over-year growth in experiments and feature gates, and nearly 7 million analytics queries in 2025. Those product-usage signals make the metered pricing model economically plausible: if customers use more flags, experiments, and analytics, Statsig has more ways to expand revenue inside the account. Third-party topline estimates are still mixed. Sacra and SiliconANGLE both point to roughly $40 million of ARR around the 2025 Series C, while Growjo estimates a lower $23.7 million revenue run rate. Headcount is also a band rather than a point estimate, with official and third-party sources clustering around 145 to 170 employees and GeekWire saying the company planned to approach 200 by early 2026. That band supports a derived ARR-per-employee range of roughly $235,000 to $276,000 if the $40 million ARR estimate is directionally right. The implication is not mature-SaaS efficiency, but a credible growth-stage operating leverage story whose margin quality still depends on unknown hosting, support, sales, and retention economics.",
