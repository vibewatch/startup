    {
      "id": "capital-history-and-acquisition-implications",
      "title": "Capital history, valuation, and acquisition implications",
      "body": "Funding history is better documented than profitability. Tracxn traces three disclosed rounds totaling about $153 million: a $10.4 million Series A in 2021, a $43 million Series B in 2022, and a $100 million Series C in May 2025. Official and media sources agree that the Series C valued Statsig at $1.1 billion and was led by ICONIQ Growth with Sequoia and Madrona returning. That financing gave the company fresh capital only months before the next major financial event: OpenAI’s September 2025 agreement to acquire Statsig for $1.1 billion. GeekWire’s most financially important observation is that the acquisition price matched the last private mark rather than exceeding it, implying investor liquidity but no acquisition premium. OpenAI and CNBC also say Statsig will continue to operate independently and serve customers from Seattle while regulatory approval and integration proceed. For financial analysis, that changes the question from pure venture runway to parent-backed operating continuity. If the acquisition closes on the described terms, near-term standalone financing dependency should fall materially. The trade-off is that future financial transparency becomes worse for outside investors, because any post-close economics are more likely to sit inside OpenAI’s broader reporting perimeter than inside a standalone Statsig disclosure cadence.",
