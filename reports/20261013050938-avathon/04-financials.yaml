figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Illustrates how industrial asset monitoring and operational data convert into recurring software subscription,
      forward deployment, and realized gross margin.
    data:
      nodes:
        - id: node-1
          label: Asset Integration
          role: Operational telemetry ingested from sensors, SCADA, and CCTV into computational knowledge graph.
        - id: node-2
          label: Enterprise Platform License
          role: Core recurring software platform subscription contracted per facility or asset fleet.
        - id: node-3
          label: Forward Deployed Engineering
          role: High-touch implementation and custom model tuning generating professional services revenue.
        - id: node-4
          label: Workflow Agent Adoption
          role: Operational agents deployed across maintenance, production recovery, and supply chain.
        - id: node-5
          label: Contract Expansion & NRR
          role: Multi-year expansion across asset classes and geographies driving net expansion.
        - id: node-6
          label: Gross Margin Realization
          role: Blended gross margin determined by software scale offsetting cloud compute and forward engineering overhead.
      edges:
        - from: node-1
          to: node-2
          label: Underwrites core license
        - from: node-1
          to: node-3
          label: Requires custom setup
        - from: node-2
          to: node-4
          label: Activates agent workflows
        - from: node-3
          to: node-4
          label: Enables production deployment
        - from: node-4
          to: node-5
          label: Demonstrates ROI
        - from: node-5
          to: node-6
          label: Scales recurring margin
    approximationNotes: >-
      Conceptual conversion sequence based on disclosed enterprise deployment workflows; conversion velocity and margin
      absorption ratios are qualitative proxies.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI011
callouts:
  - calloutType: risk
    title: High Forward-Deployed Labor Overhead Depresses Gross Margin
    body: >-
      Avathon relies heavily on forward-deployed engineering teams and technical architects to configure custom
      knowledge graphs and asset data pipelines for enterprise clients. This delivery model introduces significant
      professional services cost, preventing the company from achieving typical pure-play SaaS gross margins.
    claimRefs:
      - CI007
      - CI011
  - calloutType: recommendation
    title: Condition Valuation On Access to Private Unit Economics
    body: >-
      Because public sources disclose no verified ARR, retention metrics, or gross margin figures, underwriting
      Avathon's valuation requires direct access to confidential management accounts, customer cohort expansion data,
      and cash burn schedules before committing growth capital.
    claimRefs:
      - CI005
      - CI010
      - CI014
