companyProfile:
  summary: >-
    Avathon is an industrial AI and autonomy software vendor, formerly SparkCognition, that sells software for
    predictive maintenance, asset performance management, operational logistics, and worker-safety workflows across
    capital-intensive industries. The company rebranded in 2024, shifted its executive headquarters to Pleasanton,
    California, and retains engineering operations in Austin while expanding commercial reach through hyperscaler,
    energy, mining, aviation, and defense relationships.
  foundingLocation: Austin, Texas, USA
  headquarters: San Francisco Bay Area, California, USA
  productSummary: >-
    Enterprise industrial AI platform combining contextual asset knowledge graphs, autonomous decision workflows, and
    governed operational guardrails for maintenance, scheduling, logistics, and safety use cases.
  customerFocus: Heavy asset-intensive enterprises in energy, aviation, mining, defense, and industrial logistics
  businessModel: Enterprise software subscriptions plus forward-deployed professional services and defense contracts
  stage: Series D
  fundingStatus: >-
