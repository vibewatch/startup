callouts:
  - calloutType: "insight"
    title: "The Computational Knowledge Graph as Core Intellectual Property"
    body: "Avathon's primary technical moat lies in its Computational Knowledge Graph, which bridges raw, high-velocity time-series sensor data with business context and spatial relationships. Rather than treating telemetry as isolated statistical series, the knowledge graph connects equipment to operational hierarchies, maintenance histories, and supply chain constraints. This semantic scaffolding allows agentic AI models to generate actionable mitigation plans rather than superficial anomaly alerts."
    claimRefs:
      - "CE003"
      - "CE006"
      - "CE007"
  - calloutType: "risk"
    title: "Developer Friction, Heavy Forward Deployment, and Closed Integration"
    body: "Avathon exhibits a marked absence of public developer resources, open APIs, and published software development kits. External software directories report that no public API is available, compelling enterprise clients to rely on dedicated forward-deployed engineering teams to build custom integrations. This services-heavy implementation model increases deployment lead times, introduces customer-specific code maintenance overhead, and elevates professional services dependency."
    claimRefs:
      - "CE009"
      - "CE012"
      - "CE013"
