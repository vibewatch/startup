callouts:
- calloutType: risk
  title: High Base-Rate Failure in Broad Industrial AI Deployments
  body: Category research cites industrial AI failure rates reaching up to 80% due to legacy data fragmentation and integration friction. Avathon's multi-product strategy increases overall capability breadth but expands operational surface area, necessitating rigorous pilot scoping before enterprise-wide expansion.
  claimRefs:
  - CP008
- calloutType: insight
  title: Outcome-Linked Contracting as a Commercial Wedge
  body: Avathon's five-year agreement with Barrick Gold ties vendor compensation partly to operational improvements rather than pure software seat volume. This performance-linked model lowers adoption risk for skeptical buyers while establishing defensible multi-year commercial lock-in.
  claimRefs:
  - CP002
