callouts:
  - calloutType: risk
    title: Autonomous Control Liability in Critical Physical Systems
    body: >
      Avathon's platform is designed to execute autonomous equipment shutdowns and prescriptive operational commands across power plants, energy pipelines, and industrial machinery. In the event of an erroneous automated action or missed critical failure, liability exposure could exceed software contract values. Investors must mandate comprehensive contractual liability caps, field fail-safe audits, and proof of redundant manual interlocks before endorsing expanded physical autonomy deployments.
    claimRefs:
      - CR001
      - CR002
      - CR004
  - calloutType: recommendation
    title: Definitive Diligence Triggers and Pre-Investment Kill Criteria
    body: >
      Prior to capital commitment, diligence teams must verify three non-negotiable milestones: (1) audited financial verification of recurring software revenue and forward cash runway to validate the $300M+ funding base, (2) formal proof of customer concentration demonstrating no single energy or defense client exceeds 25% of ARR, and (3) operational audit logs demonstrating continuous uptime and manual override efficacy across production deployments.
    claimRefs:
      - CR003
      - CR005
      - CR011
      - CR012
