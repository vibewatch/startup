              - CU013
      - number: '6.4'
        title: Durability, Retention Dynamics & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite compelling technical outcomes and high-profile partner announcements, Avathon's customer economics
              remain characterized by substantial informational opacity. The company does not publicly disclose net
              revenue retention (NRR), gross retention, customer acquisition costs, or logo churn rates, preventing
              external investors from verifying cohort durability. Independent financial analysis highlights that
              Avathon's commercial announcements are largely promotional and consistently omit specific contract dollar
              values, multi-year commitments, or committed backlog figures. Furthermore, enterprise software review
              platforms exhibit zero verified customer reviews or satisfaction ratings, indicating that sales motions
              operate strictly through top-down enterprise relationships rather than bottoms-up practitioner adoption.
              The company also faces potential channel and partner concentration risk through its deep architectural
              dependence on hyperscaler go-to-market channels like Google Cloud, creating vulnerability if partner
              priorities shift or enterprise procurement cycles lengthen.
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Validated High-Value Industrial Production ROI
            body: >-
              Documented customer deployments across offshore oil, petrochemical processing, and commercial aviation
              demonstrate significant operational returns, with reported platform savings of up to $30M and failure lead
              times of 9 to 35 days on critical machinery.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Financial Opacity Around Retention and Contract Backlog
            body: >-
              Avathon discloses virtually no data regarding annual recurring revenue retention (NRR/GRR), customer
              concentration, or contract churn, while independent market commentary notes that commercial announcements
              remain heavily promotional and lack firm contract value figures.
            calloutType: risk
            claimRefs:
              - CU010
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Taxonomy, Severity Ranking, and Governance Framework
        blocks:
          - type: paragraph
            body: >
              Operating industrial AI within critical physical infrastructure entails exposure to severe physical,
              regulatory, and commercial failure modes. Avathon deploys agentic autonomy across capital-intensive
              sectors—including energy, utilities, manufacturing, and defense sustainment—where software failures can
              directly induce equipment destruction, regulatory sanctions, or human safety hazards [CR001]. A
              comprehensive assessment of Avathon's operating profile reveals a multi-tiered risk landscape dominated by
              autonomous control liability in high-hazard assets, substantial architectural dependency on third-party
              cloud hyperscalers, and pronounced opacity surrounding post-Series D financing and private contract values
              [CR003, CR005]. While management has instituted structural governance protocols such as human-in-the-loop
              oversight and enterprise partnership models to manage risk, residual exposure remains elevated across
              unverified production deployments [CR007, CR011].
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
