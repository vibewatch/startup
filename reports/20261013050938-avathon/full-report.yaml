  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Customer progression from initial edge telemetry ingestion through autonomous plant-wide operations across heavy
      industry deployments.
    claimRefs:
      - CU005
      - CU006
      - CU012
      - CU013
    approximationNotes: >-
      Stages and operational milestones are synthesized from vendor deployment literature and enterprise industrial AI
      adoption patterns.
    data:
      items:
        - label: 1. Asset Ingestion & Sensor Discovery
          detail: Connecting legacy industrial assets, SCADA systems, and CCTV feeds into Avathon's data integration layer.
          touchpoints: Edge gateway installation, historian database connectors, and initial data hygiene assessment.
        - label: 2. Baseline Normal Behavior Modeling
          detail: >-
            Building asset-specific machine learning models to capture standard operating temperatures, pressures, and
            vibration.
          touchpoints: Historical telemetry ingestion (12-36 months) and unsupervised anomaly threshold calibration.
        - label: 3. Predictive Pilot & Failure Detection
          detail: >-
            Running parallel shadow operations to validate failure prediction accuracy on critical pumps, turbines, or
            turbines.
          touchpoints: Plant reliability team alerts, false-positive tuning, and initial advance warning verification.
        - label: 4. Maintenance Workflow Integration
          detail: Connecting predictive alerts into enterprise CMMS and ERP systems for automated work-order generation.
          touchpoints: Technician AI assistant deployment, parts inventory checks, and scheduled downtime coordination.
        - label: 5. Operational Autonomy & Multi-Site Rollout
          detail: >-
            Expanding from single asset failure prevention to multi-facility operations and supply chain
            synchronization.
          touchpoints: Enterprise computational knowledge graph, cross-facility benchmarking, and cloud analytics.
        - label: 6. Closed-Loop Autonomous Orchestration
          detail: >-
            Enabling adaptive real-time setpoint adjustments and automated process optimization without manual
            intervention.
          touchpoints: Agentic AI orchestration, edge execution controls, and board-level operational resilience reporting.
