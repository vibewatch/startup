  - id: TV001
    title: Recommendation Summary and Investment Decision Framework
    columns:
      - Dimension
      - Assessment
      - Supporting Signal
      - Decision Implication
    rows:
      - - Recommendation
        - Research-more
        - Credible product breadth and tier-1 traction balanced by persistent financial opacity
        - Withhold capital commitment until audited revenue and backlog are disclosed
      - - Confidence Level
        - Medium
        - Confirmed tier-1 partners (Google Cloud, Barrick) offset by lack of verifiable SaaS metrics
        - Conduct dedicated management and customer calls before formal term sheet
      - - Risk Rating
        - High
