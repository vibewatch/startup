  - id: TV003
    title: Valuation Scenarios and Expected Return Profiles
    columns:
      - Scenario
      - Operating Assumptions
      - Implied Valuation / Multiple
      - Key Risks & Failure Modes
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR scales to $180M+ by 2028; global mining and defense deployments convert into multi-year recurring
          enterprise licenses with >120% NRR
        - $2.2B - $2.7B (12x-15x ARR multiple reflecting premium software gross margins)
        - Slower government procurement cycles; edge deployment complexity compresses operating margins
        - 25% (requires flawless transition from professional services to software recurring revenue)
      - - Base Case
        - >-
          ARR grows steadily to $120M - $150M; steady expansions with Google Cloud and energy partners offset by high
          forward deployment costs
        - $1.2B - $1.5B (8x-10x ARR multiple aligned with mature enterprise software comps)
        - >-
          Multiple compression in broader enterprise tech; increased competition from industrial incumbents like C3 AI
          and Honeywell
        - 50% (baseline commercial trajectory based on established reference customers)
      - - Bear Case
        - >-
          ARR stagnates below $80M; customized deployments fail to scale; Series D liquidation preferences crush common
          and junior equity holders
        - $400M - $600M (4x-6x ARR multiple or distressed asset sale)
        - >-
          Customer churn among legacy clients; severe down-round dilution; capital depletion requiring emergency
          financing
        - 25% (material risk given four-year gap since last institutional equity round)
    notes: >-
      Scenarios model 2026-2028 valuation horizons using market-implied revenue multiples and comparative public
      software benchmarks.
