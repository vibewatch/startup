  - id: TV002
    title: Investment Thesis and Anti-Thesis Balance Sheet
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - View-Changing Trigger
    rows:
      - - Market & Product
        - >-
          Industrial AI platform addresses high-cost downtime ($500k/hr) across mission-critical energy and aviation
          assets
        - Long enterprise sales cycles, custom deployment friction, and high customer engineering overhead
        - Demonstration of standardized self-serve agent deployment across multi-facility fleets
      - - Customer Proof
        - Tier-1 enterprise partnerships with Barrick, Aramco Digital, and U.S. Army validate dual-use capability
        - Promotional announcements lack explicit contract values, multi-year commitments, or renewal data
        - Verified multi-year ACVs exceeding $2M with net revenue retention above 115%
      - - Financial Model
        - Substantial lifetime funding ($340M) and top-tier investor backing (Temasek) provide operational runway
        - Severe revenue opacity; absence of ARR run-rate figures prevents multiple defensibility
        - Delivery of audited financial statements showing positive gross margins and software-led gross profit
      - - Valuation & Structure
        - Unicorn designation positions company as category leader in heavy industrial autonomy
        - Potential down-round risk or severe preference overhang from the January 2022 Series D vintage
        - Transparent secondary pricing data or clean recapitalization terms at sensible ARR multiples
    notes: >-
      Synthesizes core bull and bear arguments across market position, customer traction, financials, and capital
      structure.
