evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-financial-metrics
    missingEvidence: >-
      Audited financial statements, current annual recurring revenue (ARR), gross margins, and cash burn rate for fiscal
      years 2024 through 2026.
    whyItMatters: >-
      Without audited revenue or ARR run-rate figures, commercial velocity and software business model quality cannot be
      independently evaluated.
    diligencePath: >-
      Request confidential disclosure from management or institutional secondary diligence access via accredited
      platforms.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Full board of directors composition, equity ownership stakes, and formal documentation of founder Amir Husain's
      ongoing governance relationship.
    whyItMatters: >-
      Key-person dependence and founder-executive transition dynamics remain partially opaque following corporate
      relocation under CEO Pervinder Johar.
    diligencePath: >-
      Review state corporate registration records in Delaware and California alongside shareholder agreement
      disclosures.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Detailed cap table, preferred share liquidation preferences, voting control covenants, and secondary trading
      volume across Series A through Series D rounds.
    whyItMatters: >-
      Economic waterfall and investor seniority between early venture partners and sovereign backers (Temasek, DVC)
      cannot be verified from top-level round listings.
    diligencePath: >-
      Review company capitalization table and preferred stock purchase agreements during confirmatory investment
      diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Financial Scale and Market Share Verification
    missingEvidence: >-
      Audited financial statements, ARR disclosures, or authoritative third-party market share breakdowns quantifying
      Avathon's exact revenue and share of global industrial AI spending.
    whyItMatters: >-
      Without verifiable ARR or customer count disclosures, market share cannot be empirically bounded, and valuation
      metrics must rely on external comparable multiples rather than fundamental revenue scale.
    diligencePath: >-
      Request confidential disclosure of GAAP revenue, ARR run-rate, customer count, and expansion economics during
      management diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-switching-data
    missingEvidence: >-
      Detailed multi-year net revenue retention, customer churn, and contract renewal figures across core energy and
      mining deployments.
    whyItMatters: >-
      Without audited cohort renewal rates, it is impossible to evaluate whether Avathon's multi-product breadth creates
      genuine enterprise lock-in or suffers from pilot attrition.
    diligencePath: >-
      Request customer cohort renewal tables, logo churn history, and expansion contract metrics under NDA during
      commercial diligence.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: blocking
    topic: audited-arr-and-gross-margin
    missingEvidence: >-
      Audited financial statements or verified disclosures confirming annual recurring revenue (ARR), subscription gross
      margins, and net revenue retention (NRR).
    whyItMatters: >-
      Without audited ARR and margin figures, an investor cannot determine revenue quality, software operating leverage,
      or sustainable valuation multiples.
    diligencePath: >-
      Request audited GAAP/IFRS financials, revenue breakdown by product line, and cohort-level NRR schedules during
      management diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash balance, net monthly cash burn, credit facility availability, and capital deployment budget.
    whyItMatters: >-
      Given that Avathon's last reported primary round was in January 2022, understanding current cash runway is
      essential to gauge financing dependency and dilution risk.
    diligencePath: Review monthly cash flow statements, trailing 12-month operating burn, and board-approved budget in the data room.
    relatedQuestionRefs:
      - QI010
  - type: missing-source
    severity: material
    topic: cybersecurity-and-edge-benchmarks
    missingEvidence: >-
      Public third-party cybersecurity audits (SOC 2 Type II, ISO 27001), FedRAMP certification status for
      avathongov.com, and quantitative edge-inference latency benchmarks for visual AI models.
    whyItMatters: >-
      Heavy industrial and defense deployments mandate stringent compliance, air-gapped security validation, and
      deterministic sub-second edge latency for real-time safety critical interventions.
    diligencePath: >-
      Request SOC 2 / ISO compliance packages, NIST/FedRAMP authorization packages from Avathon's government division,
      and hardware benchmarking reports for edge compute nodes.
    relatedQuestionRefs:
      - QE008
  - type: access-blocked
    severity: minor
    topic: developer-ecosystem-and-apis
    missingEvidence: Public developer portal, REST/GraphQL API specifications, SDK documentation, and client-side code libraries.
    whyItMatters: >-
      A lack of open APIs forces client lock-in, increases reliance on professional services, and raises total cost of
      ownership by complicating integration with legacy MES and SCADA systems.
    diligencePath: >-
      Review master service agreements and platform technical appendices to determine whether standard API connectors
      are licensed or if all integrations require forward-deployed engineering.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: >-
      Detailed historical net revenue retention (NRR), gross revenue retention (GRR), annual churn rates, and top-5
      customer revenue concentration figures.
    whyItMatters: >-
      Without audited retention and customer concentration disclosures, it is impossible to evaluate whether Avathon's
      reported multi-million dollar customer savings translate into durable software ARR or if revenue is concentrated
      in volatile pilot projects.
    diligencePath: >-
      Request audited revenue by customer cohort, top-customer concentration schedules, and multi-year contract renewal
      history under NDA.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: named-customer-contract-verification
    missingEvidence: >-
      Production contract disclosures, committed annual contract values (ACV), and verified deployment scope for named
      references including Airbus, BAE Systems, and Barrick.
    whyItMatters: >-
      Public mentions often conflate vendor marketing pilots or initial software trials with comprehensive
      enterprise-wide production rollouts.
    diligencePath: >-
      Review master services agreements (MSAs), statements of work (SOWs), and software license schedules for primary
      enterprise accounts.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: commercial-contracts
    missingEvidence: Audited backlog figures and multi-year contract values for Avathon's defense, mining, and energy engagements.
    whyItMatters: >-
      Public reports note announcements remain promotional without disclosed financial scale, obscuring actual revenue
      run rate.
    diligencePath: >-
      Request audited management accounts, customer contract copies, and signed defense delivery schedules under
      non-disclosure agreements.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: operational-telemetry
    missingEvidence: Independent production outage logs and telemetry on false-positive rates for automated equipment shutdowns.
    whyItMatters: Autonomous shutdown features can inflict massive operational disruption if equipment is tripped erroneously.
    diligencePath: >-
      Review historical production logs, MTBF metrics, and supervisory control intervention histories across reference
      customer deployments.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: capitalization-table
    missingEvidence: Current post-Series D capitalization table, liquidation preferences, and debt covenants.
    whyItMatters: >-
      Funding history is opaque post-January 2022, creating downside dilution risk if current growth does not support
      historical marks.
    diligencePath: >-
      Examine current cap table, articles of incorporation, investor rights agreements, and any subsequent secondary or
      convertible notes.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: >-
      Audited financial statements confirming trailing ARR, revenue growth rate, gross margins, and net revenue
      retention.
    whyItMatters: >-
      Without audited top-line figures, valuation multiple assessments rely on unverified third-party estimates and
      promotional statements.
    diligencePath: >-
      Request confidential disclosure of audited income statement, revenue recognition policy, and SaaS contract backlog
      under NDA.
  - type: conflicting-data
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Fully diluted capitalization table detailing Series D senior liquidation preferences, participation rights, and
      ESOP dilution.
    whyItMatters: >-
      Preference overhang from the 2022 Series D round could impair common or junior equity returns under downside or
      flat valuation scenarios.
    diligencePath: >-
      Examine shareholder agreements, certificate of incorporation amendments, and cap table ledger during confirmatory
      diligence.
