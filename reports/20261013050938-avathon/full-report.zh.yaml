      - number: '4.2'
        title: 成本结构、单位经济性与交付现实
        blocks:
          - type: paragraph
            body: >-
              由于物理 AI 部署具有资本和劳动密集特征，Avathon
              的毛利结构和单位经济性与标准化纯软件即服务基准明显不同。工业资产环境需要大量数据摄取工程、定制模型训练，以及针对传统运营技术基础设施、监控系统和复杂传感器拓扑的持续校准。职位架构和招聘情况表明，公司高度依赖前置部署的工程团队、技术架构师和领域专长
              AI 科学家，他们分布在总部与全球交付中心之间。因此，销售成本既包括大量前置工程人工开销，也包括在 Google Cloud Vertex AI 和 Azure
              基础设施上训练、推理大型视觉和基础模型所需的高额云计算费用。客户 ROI 案例称非计划停机和运营支出得到可衡量的下降，但 Avathon
              没有公开披露经审计的毛利率、客户获取成本或净收入留存率。若看不到专业服务利润拖累和云计算单位经济性的经审计数据，潜在投资评估者就无法验证合同扩张是否带来软件贡献毛利提升，还是仍被相同比例的人员数量牵制。
