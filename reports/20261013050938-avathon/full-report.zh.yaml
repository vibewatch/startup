            body: >-
              Avathon 明显缺少公开开发者资源、开放 API 和已发布的 SDK。外部软件目录称没有公开
              API，这迫使企业客户依赖专门的前置部署工程团队构建定制整合。这种服务密集型实施模式拉长部署周期，增加客户专属代码的维护负担，也提高对专业服务的依赖。
            calloutType: risk
