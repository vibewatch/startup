      - number: '5.2'
        title: 技术栈、工程架构与部署模式
        blocks:
          - type: paragraph
            body: >-
              Avathon 的核心技术栈在多云和本地环境中结合分布式数据流、运营知识图谱和预测性机器学习模型。Avathon 平台开发团队披露的信息显示，底层摄取流水线基于 Apache Kafka、AWS Kinesis
              和 IoT Core 等流式及消息代理构建，分布式处理由 Apache Spark 和 Databricks 管理。在数据建模层，Avathon
              将非结构化、结构化、时间序列和视觉数据组织进计算知识图谱，刻画物理实体、流程工作流和组织关系。机器学习能力包括数字孪生、正常行为建模（NBM）、自然语言处理和计算机视觉。编排依赖 Airflow、Dagster
              和 Prefect，容器化微服务通过 Docker 和 Kubernetes 管理。为实现云规模执行，Avathon 深度整合 Google Cloud Platform，利用 Vertex AI
              改进预测性维护模型，并用 Gemini Enterprise 构建领域专属智能体助手。尽管企业基础扎实，Avathon 的开发者可用性仍受到严重限制：独立软件目录未见公开的软件开发工具包（SDK）或开发者
              API，系统依赖前置部署工程团队整合 OPC UA、Modbus 和工业历史数据库等运营技术（OT）协议。
            claimRefs:
              - CE003
