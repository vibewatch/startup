          - type: paragraph
            body: >-
              Avathon 的公开客户组合包含知名企业参考案例，证明平台能够适应复杂运营环境。在商业航空领域，Airbus 选择 Avathon 的知识图谱架构驱动内部 AIRKOG
              决策平台，获得全球领先商用飞机制造商的高信任技术验证。在自然资源领域，Barrick Gold 于 2026 年 9 月选中 Avathon，为其北美业务打造 AI
              原生采矿运营模式，把从勘探现场到开采再到供应链的运营遥测连接起来。在电力公用事业领域，National Grid Partners 投资 Avathon，并验证 Avathon
              在电网预防性维护和现场工人安全上的生产表现。为加快企业分销并简化采购，Avathon 与 Google Cloud 密切合作，把 Autonomy Platform 与 Vertex AI 和 Gemini
              Enterprise 整合，以触达全球能源运营商，同时通过 Aramco Digital 等区域联盟拓展覆盖。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
