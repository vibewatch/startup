      - number: '3.3'
        title: 定价、产品打包与合同结构
        blocks:
          - type: paragraph
            body: >-
              工业 AI 类别的商业模式差异很大，既有按资产计费的订阅层级、按用户计费的许可证，也有定制企业协议。第三方软件目录给出的 Avathon 每用户许可证估计定价为每月 $150–$400，但大型工业企业协议与标准
              SaaS 席位模式差异明显。典型案例是 Barrick Gold
              在北美运营的五年商业部署：基础平台使用费之外，还按可衡量的运营改善结果支付绩效挂钩报酬。这种分担风险的商业姿态能够对抗守成惯性和昂贵的内部开发，但同时增加合同治理负担和财务预测不确定性。
            claimRefs:
              - CP002
              - CP007
              - CP011
