      - number: '4.3'
        title: 资本充足性、消耗率与融资依赖
        blocks:
          - type: paragraph
            body: >-
              鉴于距离上一次确认的机构股权融资已经过去很长时间，Avathon 资产负债表的持久性和前瞻性资本充足程度，对增长投资评估者提出了关键问题。公司于 2022 年 1 月完成 D 轮融资，由 Temasek 和
              Doha Venture Capital 等知名主权及机构投资者领投；更早轮次由 Hearst Ventures、Brevan Howard 和 Founders Equity Partners 支持。2024
              年末，公司获世界经济论坛独角兽社区认可，反映出其私募市场估值超过十亿美元。然而，公司已经超过四年没有披露主要股权资本注入。美国陆军五百万美元 VIPER
              合同等高毛利双用途国防项目，以及商业合作带来非稀释性现金流入，但不能取代机构层面对净现金消耗、流动性储备或信贷额度的了解。对技术人才的持续投入，包括扩建印度 AI
              卓越中心及与学术机构开展研究合作，都需要持续大量现金支出。在缺乏经审计财务报表或公开监管申报的情况下，Avathon 的现金跑道和对未来外部融资的潜在依赖仍是未解决的尽调缺口。
