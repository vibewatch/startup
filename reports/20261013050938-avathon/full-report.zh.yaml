              - CP011
      - number: '3.4'
        title: 转换成本、锁定效应与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              工业 AI 系统一旦部署到任务关键型基础设施中，就会受益于强大的转换壁垒，壁垒来自深度 OT
              传感器整合、定制告警阈值和经过认证的合规工作流。替换正在运行的平台意味着高昂的工程转换成本、切换期间的运营风险，以及对预测基线进行长时间重新校准。不过，Avathon
              的竞争护城河持续受到全行业部署高失败率的威胁；据报道，制造业和能源 AI 项目的失败率最高可达
              80%。此外，不透明的客户续约数据和多平台并用做法，让外界无法判断客户账户能否在多年周期内持续扩张，还是会在旗舰站点之外扩容时出现试点疲劳。
            claimRefs:
              - CP008
              - CP012
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 广泛工业 AI 部署的高基准失败率
            body: 行业研究称，由于传统数据碎片化和整合摩擦，工业 AI 失败率最高可达 80%。Avathon 的多产品战略扩大了整体能力覆盖面，也扩大了运营接触面，因此在向全企业扩展前必须严格界定试点范围。
            calloutType: risk
            claimRefs:
              - CP008
          - type: callout
            title: 与结果挂钩的合同是商业切入口
            body: Avathon 与 Barrick Gold 签订的五年协议，把供应商报酬部分绑定到运营改善，而非单纯的软件席位数量。这一绩效挂钩模式降低了持怀疑态度买家的采用风险，同时建立了可守住的多年商业锁定。
            calloutType: insight
            claimRefs:
              - CP002
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业定价架构
        blocks:
          - type: paragraph
            body: >-
              Avathon 采用混合商业模式，将 Autonomy Platform
              的经常性软件许可证与前置部署的专业工程服务和定制机器学习服务结合。公司在能源、采矿、航空航天和物流等核心工业垂直领域，通过多年期企业合同变现，把资产运营遥测、计算机视觉馈送和传感器流接入自有计算知识图谱。软件访问以模块化解决方案销售，包括资产绩效管理、预测性维护和运营物流编排。除
              Barrick Gold 在北美黄金业务中的多资产协议等商业企业部署外，Avathon 还获取非稀释性国防合同收入，包括与美国陆军签订的两年期五百万美元 VIPER
              争议物流解决方案合同。大型企业账户的定价高度定制，不会透明列在数字商店中。第三方软件目录给出的指示性席位价格为每位用户每月一百五十至四百美元，但工业生产部署主要采用站点级许可证、资产容量费或多年期企业订阅。通过
              Google Cloud 和 Microsoft Azure Marketplace 的超大规模云分销合作，为采购提供顺畅渠道和联合销售机会；实际合同折扣和批量定价条款则仍属机密。
