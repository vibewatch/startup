        - 50%（基于既有参考客户的基准商业轨迹）
      - - 悲观情景
        - ARR 停滞在 $80M 以下；定制部署无法规模化；Series D 清算优先权挤压普通股及次级股权持有人
        - $400M - $600M（4x-6x ARR 倍数或困境资产出售）
        - 老客户流失；严重的下轮融资稀释；资本耗尽，需要紧急融资
        - 25%（距上一轮机构股权融资已四年，风险显著）
    notes: 情景以市场隐含收入倍数和上市软件公司可比基准，模拟 2026—2028 年估值区间。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Avathon 从 SparkCognition 创立、融资、品牌重塑到 2025—2026 年工业部署的发展历程。
    data:
      items:
        - label: 以 SparkCognition 起步
          date: '2013'
          detail: 在得州 Austin 创立，开发用于认知工业分析和网络安全的机器学习系统。
          tone: neutral
        - label: Series A 资本化
          date: 2016-04
          detail: 完成机构 Series A 融资，推进工业 IoT 自动化故障预测算法。
          tone: positive
        - label: Series B 扩张轮
          date: 2018-02
          detail: 获得 Brevan Howard 支持的 Series B 投资，扩大工程团队和工业合作伙伴渠道。
          tone: positive
        - label: Series C 主权与成长轮
          date: 2019-10
          detail: 完成 Series C 扩张融资，投资方包括 Temasek、Hearst Ventures、Blue Horizon 和 DFO Management。
          tone: positive
        - label: Series D 独角兽里程碑
          date: 2022-01
          detail: 与 Temasek 和 Doha Venture Capital 完成 Series D 融资，据报道投后估值为 $1.4B。
          tone: positive
        - label: 企业品牌重塑为 Avathon
          date: 2024-10
          detail: 从 SparkCognition 更名为 Avathon；总部迁至加州 Pleasanton，同时保留 Austin 中心。
          tone: positive
        - label: Google Cloud 自主运营交易
          date: 2025-12
          detail: 扩大合作，将 Google Cloud Vertex AI 和 Gemini Enterprise 集成进 Autonomy for Energy Operations。
          tone: positive
        - label: Bangalore CoE 与 IIT Roorkee Physical AI 实验室
          date: 2026-08
          detail: 在 Bangalore 启用专属 AI 卓越中心，并与 IIT Roorkee 共建 Physical AI Lab。
          tone: positive
        - label: Barrick Mining 与 Aramco Digital 战略交易
          date: 2026-09
          detail: 与 Barrick North America 合作打造 AI 采矿运营模型，并与 Aramco Digital 合作推进工业自主化。
          tone: positive
        - label: 披露透明度市场分析
          date: 2026-10
          detail: 独立市场分析指出其沟通偏宣传口吻，且缺乏公开合同披露指标。
          tone: warning
    approximationNotes: 日期和事件细节经官方新闻稿、SEC/Caplight 文件及独立市场复盘报道核实。
    claimRefs:
      - CO001
      - CO005
      - CO008
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 将广泛的工业数字化支出逐层拆解至可服务自主运营工作负载的分层规模模型。
    data:
      items:
        - label: 全球工业自动化与企业软件
          value: 150
          unit: USD B
          detail: 覆盖 ERP、SCADA、工业自动化硬件和传统历史数据库软件等企业宏观支出。
        - label: 全球工业 AI 与分析软件（TAM）
          value: 38
          unit: USD B
          detail: 面向机器学习、预测性维护、计算机视觉和运营智能的企业软件市场。
        - label: 资产密集型基础设施支出（目标垂直领域）
          value: 18
          unit: USD B
          detail: 可服务市场集中在能源发电、油气资产、重型制造、采矿和航空航天。
        - label: 预测性维护与资产绩效管理（SAM）
          value: 9.5
          unit: USD B
          detail: 用于持续设备状态监控和运营故障预测平台的可服务预算。
        - label: 自主运营与智能体 AI 平台（SOM）
          value: 2.2
          unit: USD B
          detail: 统一多资产运营 AI 的近期可服务支出，连接数据、决策智能和执行。
        - label: Avathon 可核实企业覆盖
          value: 0.15
          unit: USD B
          detail: 以能源公用事业、国防项目和采矿合作伙伴为基础，估算当前销售管道和商业合同基础。
    approximationNotes: 市场规模层级反映综合后的行业分析师共识；Avathon ARR 未在经审计文件中核实，仅作为示意性目标覆盖。
    claimRefs:
      - CM001
      - CM008
      - CM010
      - CM014
