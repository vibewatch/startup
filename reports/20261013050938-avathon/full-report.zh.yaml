  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块架构
        blocks:
          - type: paragraph
            body: >-
              Avathon 是一个工业 AI 自主运营平台，旨在帮助资本密集型企业从被动告警转向自主和半自主运营工作流。公司从 SparkCognition
              完成品牌重塑，面向油气、公用事业、采矿、航空航天、国防和自动化仓储等重工业的任务关键型资产。产品套件围绕端到端运营软件栈构建，覆盖物理资产监测、运营智能和供应链执行。Avathon
              不提供孤立的诊断告警，而是通过智能体 AI 工作流输出可执行的运营方案。商业产品覆盖核心模块：用于预测性维护和异常检测的资产绩效管理（APM）；依托现有 CCTV 基础设施，提供工作场所安全和码头物流追踪的
              Visual AI；用于关系型运营映射的计算知识图谱基础设施；以及支持需求预测和销售与运营规划（S&OP）的供应链规划（SCM）。Avathon
              在高风险行业展现了广泛商业适用性，但第三方功能评估表明，成功部署需要大量前期数据准备和定制模型训练，限制了开箱即用的采用。
