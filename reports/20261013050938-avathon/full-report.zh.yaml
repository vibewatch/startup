      - number: '6.4'
        title: 持久性、留存动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管技术结果有说服力、合作伙伴公告也具备高知名度，Avathon
              的客户经济性仍然高度不透明。公司没有公开披露净收入留存率（NRR）、毛留存率、客户获取成本或客户流失率，外部投资者因而无法验证客户群的持久性。独立财务分析指出，Avathon
              的商业公告大多偏宣传性质，持续省略具体合同金额、多年期承诺或已承诺积压订单。企业软件评价平台上也没有任何经过验证的客户评论或满意度评级，表明销售严格依靠自上而下的企业关系，而非自下而上的专业用户采用。公司还通过对
              Google Cloud 等超大规模云市场拓展渠道的深度架构依赖，面临潜在渠道和合作伙伴集中度风险；一旦合作伙伴优先级改变或企业采购周期拉长，Avathon 就会受到影响。
            claimRefs:
              - CU010
              - CU011
              - CU013
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 经验证的高价值工业生产 ROI
            body: 海上石油、石化加工和商业航空领域有记录的客户部署显示出显著运营回报：报告称平台节省最多 $30M，并将关键机械的故障提前时间做到 9 至 35 天。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: 留存和合同积压订单的财务不透明
            body: Avathon 几乎没有披露 ARR 留存（NRR/GRR）、客户集中度或合同流失数据；独立市场评论指出，商业公告仍高度偏宣传性质，缺乏明确合同金额。
            calloutType: risk
            claimRefs:
              - CU010
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险分类、严重性排序与治理框架
        blocks:
          - type: paragraph
            body: >
              在关键物理基础设施中运行工业 AI，会暴露于严重的物理、监管和商业故障模式。Avathon 在能源、公用事业、制造和国防保障等资本密集型行业部署智能体自主系统；软件故障可能直接导致设备损毁、监管处罚或人身安全风险
              [CR001]。对 Avathon 运营画像的全面评估显示，其多层风险格局主要由高风险资产的自主控制责任、对第三方云超大规模服务商的重大架构依赖，以及围绕 D 轮融资后融资情况和私有合同金额的明显不透明构成
              [CR003, CR005]。管理层已设立人在回路监督、企业伙伴模式等结构化治理机制来管理风险，但未经验证的生产部署仍存在较高剩余风险 [CR007, CR011]。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR008
              - CR010
              - CR012
      - number: '7.2'
        title: 监管、法律与运营执行漏洞
        blocks:
          - type: paragraph
            body: >
              Avathon 的监管和法律风险集中于关键基础设施环境中的严格责任，以及国防采购合规。尽管公开记录目前没有披露针对 Avathon
              的在执行执法行动或诉讼，但在油气和电网基础设施中部署自主停机能力，如果算法误分类打断运营或违反可靠性要求，就会产生潜在责任 [CR002,
              CR004]。将复杂工业数字孪生从静态概念验证扩展到动态生产设施的摩擦，也进一步拉紧运营执行
              [CR006]。在制造和物流环境中，公司将计算机视觉用于危险识别和工人安全，但公开评价显示，第三方整合情况和已发布的正常运行时间 SLA 仍未披露 [CR007, CR008]。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR010
      - number: '7.3'
        title: 合作伙伴对手方依赖、财务不透明与尽调否决标准
        blocks:
          - type: paragraph
            body: >
              Avathon 企业模式的持久性与核心对手方关系和平台架构紧密相连。公司依赖 Google Cloud 基础设施，尤其是 Vertex AI 和 Gemini
              Enterprise，为能源部署训练模型、进行推理并编排运营智能体；这使运营暴露于超大规模云服务商的定价变化和服务中断 [CR001, CR009]。在国防领域，Avathon
              积极争取预测性保障和航空航天项目，但行业评估指出，其公开里程碑大多偏宣传性质，缺少具体多年期合同金额或积压订单披露 [CR005, CR010]。财务方面，自 2022 年 D
              轮以来缺少公开收入数据；如果增长倍数收缩，公司面临估值压缩的重大风险 [CR003, CR012]。投资者必须设定明确的否决标准，将其与客户集中度、自主系统事故责任和经审计财务里程碑挂钩 [CR011,
              CR012]。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR012
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 关键物理系统中的自主控制责任
            body: >
              Avathon
              的平台可在发电厂、能源管线和工业机械上执行自主停机及处方式操作指令。一旦自动操作出错，或关键故障未被及时捕捉，责任敞口可能超过软件合同金额。投资者在支持扩大实体自主部署前，必须要求全面的合同责任上限、现场故障安全审计，以及冗余手动联锁确实有效的证明。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: callout
            title: 明确的尽调触发条件与投前否决标准
            body: >
              承诺投入资本前，尽调团队必须核实三项不可妥协的里程碑：(1) 经审计的经常性软件收入和未来现金跑道财务验证，以确认 $300M+ 的资金基础；(2) 客户集中度的正式证明，表明没有任何单一能源或国防客户贡献超过
              ARR 的 25%；(3) 运营审计日志，证明生产部署持续在线且手动接管有效。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Avathon 的核心投资论点颇具吸引力，建立在重工业对 Physical AI 和工业自主化需求加速的基础上。其软件平台把遗留资本资产与预测智能接起来，面向非计划停机每小时可让资产运营商损失最高
              $500,000 的场景。近期，Barrick 商业采矿业务、Aramco Digital 全球能源优化，以及通过 $5 million 的美国陆军 VIPER
              合同实现的战备军事保障均显示其产品具备跨军民两用能力和较高技术成熟度。与 Google Cloud Vertex AI 的深度集成，也增强了其用于预测性资产性能管理的机器学习流水线。

              但这一论点被显著的结构性风险所抵消。市场公告大多偏宣传，缺少具体合同金额、期限条款和客户留存指标。SaaS
              扩张指标、客户集中度披露和经验证的单位经济模型都不透明，投资者因此无法确认客户增长是否真正转化为可防守的经常性软件利润率。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV011
              - CV014
      - number: '8.2'
        title: 估值历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Avathon 于 2024 年末加入世界经济论坛独角兽社区，意味着其估值基准预计超过 $1 billion。机构跟踪数据显示，公司通过风险投资和私募股权轮次累计募资约 $340 million，其中包括
              Temasek 与 Doha Venture Capital 领投的 2022 年 1 月 Series D 轮，早期投资方还包括 Hearst Ventures 和 Brevan Howard。公司从
              SparkCognition 更名后，将总部迁至旧金山湾区，同时保留 Austin 和 Bangalore 的工程中心。

              尽管履历亮眼，自 2022
              年初以来没有任何公开披露的初始股权融资，这对当前资本结构提出了关键疑问。商业市场情报供应商受严格使用条款限制，无法自动提取非上市公司收入数据，外部数据因而更加不透明。若近期没有定价股权融资，潜在投资者将面临
              2022 年资本结构留下的清算优先权悬置；在非超高速增长情景下，这可能大幅稀释次级或新发行股权。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
      - number: '8.3'
        title: 估值情景与可比公司倍数
        blocks:
          - type: paragraph
            body: >-
              评估 Avathon 的投资价值，需要拿企业自动化和工业 AI 可比公司做基准。二级交易和交易平台将 C3 AI（相似度 80%）与 ServiceNow（相似度
              77%）列为关键公开参照。第三方目录估计，Avathon 软件席位价格为每位用户每月 $150 至 $400，但主流软件评估平台上没有公开用户评价。

              基准情景下，Avathon 的估计企业价值为 $1.2 billion 至 $1.5 billion，依据是对估计 $120 million 至 $150 million 收入运行率采用 8x 至 10x ARR
              倍数。乐观情景估值为 $2.2 billion 至 $2.7 billion，假设其在全球矿业和国防车队中快速获得企业客户，以 12x 至 15x 倍数带来超过 $180 million 的高毛利经常性
              ARR。相反，悲观情景估值为 $400 million 至 $600 million，反映政府采购周期拉长、前置部署服务拖累严重以及倍数压缩，也说明必须严格控制价格。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 投资建议与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              我们对 Avathon 的尽调建议为
              research-more，风险评级为高，估值判断为未知。公司虽然展现了经验证的产品能力，也赢得了重要客户，但缺少经审计财务报表、经认证的净收入留存率和详细资本表披露，现阶段仍无法形成可执行的投资决策。在不清楚
              Series D 高级清算优先权的情况下进入成长轮或二级投资，会造成不利的风险收益不对称。

              考虑投入资本前，潜在投资者必须执行严格的确认性尽调路线图。重点包括审计软件与服务的收入构成，核实 BAE Systems、Barrick 等核心客户的合同积压与续约行为，并在保守毛利假设下压力测试 2022
              年之后的现金跑道。若能明确证明可规模化的经常性软件毛利率超过 70%，且清算安排不具惩罚性，就应成为将投资判断上调至 buy 的主要触发条件。
            claimRefs:
              - CV004
              - CV006
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 建议：等待财务披露后继续研究
            body: Avathon 虽已在国防、能源和采矿大型企业中实现有形的工业 AI 采用，但由于 ARR 和资本表优先级均未得到验证，暂不足以形成立即买入的判断。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV014
          - type: callout
            title: Series D 清算优先权悬置
            body: 自 2022 年 1 月 Series D 轮以来已过去四年多，且未披露后续定价股权轮次；若当前估值倍数压缩，潜在投资者可能面临下行清算优先权悬置。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
