  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 重工业客户基础与采购分层
        blocks:
          - type: paragraph
            body: >-
              Avathon
              面向任务关键型重工业企业：在这些企业中，资产非计划停机或运营故障会带来灾难性的财务、环境和人身安全成本。公司主要将客户分为四个高资本垂直行业：航空航天和商业航空、上游及中游能源、采矿和自然资源，以及国防和政府物流。在这些行业，主要买家和预算负责人通常是运营副总裁、首席维护官、工厂经理和军事物流指挥官。在商业航空领域，Airbus
              等一级客户将 Avathon 的计算知识图谱技术部署到 AIRKOG 等内部运营平台；BAE Systems 等国防承包商则利用该系统缩短维护、维修和大修周转时间。政府和国防合作通过 Digital
              Maintenance Advisor 等专门的军事保障解决方案开展，目标客户是寻求提升机队战备的美国国防部实体。
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
