    claimRefs:
      - CP010
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示工业资产监控和运营数据如何转化为经常性软件订阅、前置部署和实现的毛利率。
    data:
      nodes:
        - id: node-1
          label: 资产集成
          role: Operational telemetry ingested from sensors, SCADA, and CCTV into computational knowledge graph.
        - id: node-2
          label: 企业平台许可证
          role: Core recurring software platform subscription contracted per facility or asset fleet.
        - id: node-3
          label: 前置部署工程
          role: High-touch implementation and custom model tuning generating professional services revenue.
        - id: node-4
          label: 工作流智能体采用
          role: Operational agents deployed across maintenance, production recovery, and supply chain.
        - id: node-5
          label: 合同扩张与 NRR
          role: Multi-year expansion across asset classes and geographies driving net expansion.
        - id: node-6
          label: 毛利率实现
          role: Blended gross margin determined by software scale offsetting cloud compute and forward engineering overhead.
      edges:
        - from: node-1
          to: node-2
          label: 支撑核心许可证
        - from: node-1
          to: node-3
          label: 需要定制设置
        - from: node-2
          to: node-4
          label: 激活智能体工作流
        - from: node-3
          to: node-4
          label: 支持生产部署
        - from: node-4
          to: node-5
          label: 展示 ROI
        - from: node-5
          to: node-6
          label: 放大经常性利润
    approximationNotes: 概念性转化路径基于已披露的企业部署工作流；转化速度和利润吸收比率仅为定性代理指标。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI011
  - id: FE001
    title: Avathon 工业 AI 平台架构栈
    type: stack
    summary: Avathon Autonomy Platform 的多层功能栈，展示从原始工业遥测到运营自主智能体的流转。
    data:
      layers:
        - label: 应用与智能体执行层
          detail: 处方式运营计划、自主决策支持、S&OP 规划，以及操作员移动端 / Web 仪表盘
        - label: 领域专用智能体编排层
          detail: Gemini Enterprise 运营智能体执行自动化推理和持续流程优化
        - label: AI 建模与智能层
          detail: 数字孪生、正常行为模型和 Google Cloud Vertex AI 机器学习模型
        - label: 计算知识图谱层
          detail: 统一上下文本体，连接资产、流程、人员、遥测数据和物理站点位置
        - label: 数据处理与 MLOps 管道层
          detail: Apache Spark、Databricks、模型注册表、实验跟踪和持续漂移检测系统
        - label: 摄取与边缘集成层
          detail: 通过 Kafka、Kinesis、IoT Core、CCTV 光学流和工业 OT 现场协议实现高速流式传输
    approximationNotes: 层级划分综合自官方工程经理和架构师招聘要求、Google Cloud 集成披露及平台产品摘要；内部服务边界和消息拓扑未公开披露。
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示重工业部署中客户从最初的边缘遥测摄取到全厂自主运营的推进过程。
    claimRefs:
      - CU005
      - CU006
      - CU012
      - CU013
    approximationNotes: 阶段和运营里程碑综合自供应商部署资料及企业采用工业 AI 的模式。
    data:
      items:
        - label: 1. 资产摄取与传感器发现
          detail: 将传统工业资产、SCADA 系统和 CCTV 数据流接入 Avathon 数据集成层。
          touchpoints: Edge gateway installation, historian database connectors, and initial data hygiene assessment.
        - label: 2. 基线正常行为建模
          detail: 构建资产专属机器学习模型，捕捉标准运行温度、压力和振动。
          touchpoints: Historical telemetry ingestion (12-36 months) and unsupervised anomaly threshold calibration.
        - label: 3. 预测性试点与故障检测
          detail: 运行并行影子运营，验证关键泵、涡轮机或汽轮机的故障预测准确性。
          touchpoints: Plant reliability team alerts, false-positive tuning, and initial advance warning verification.
        - label: 4. 维护工作流集成
          detail: 将预测性告警接入企业 CMMS 和 ERP 系统，自动生成工单。
          touchpoints: Technician AI assistant deployment, parts inventory checks, and scheduled downtime coordination.
        - label: 5. 运营自主化与多站点推广
          detail: 从单一资产故障预防扩展到多设施运营和供应链同步。
          touchpoints: Enterprise computational knowledge graph, cross-facility benchmarking, and cloud analytics.
        - label: 6. 闭环自主编排
          detail: 实现自适应实时设定值调整和自动流程优化，无需人工干预。
          touchpoints: Agentic AI orchestration, edge execution controls, and board-level operational resilience reporting.
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 映射运营、合作伙伴和财务领域可能性与严重程度的多维风险矩阵。
    data:
      columns:
        - label: 低严重度
        - label: 中严重度
        - label: 高严重度
        - label: 严重
        - label: 灾难性严重度
        - label: 系统性故障
      rows:
        - label: 高可能性
          values:
            - label: 运营噪声
              tone: low
            - label: 部署瓶颈
              tone: medium
            - label: 企业集成摩擦
              tone: high
            - label: 未对冲的单点故障
              tone: critical
            - label: 严重工作流中断
              tone: critical
            - label: 运营完全瘫痪
              tone: critical
        - label: 中可能性
          values:
            - label: 轻微数据延迟
              tone: low
            - label: 竞争者侵入
              tone: medium
            - label: 资本结构悬压
              tone: high
            - label: 超大规模云厂商中断
              tone: critical
            - label: 客户广泛流失
              tone: critical
            - label: 系统性云中断
              tone: critical
        - label: 低可能性
          values:
            - label: 名义传感器错误
              tone: low
            - label: 常规功能缺陷
              tone: low
            - label: 自主误触发
              tone: high
            - label: 国防制裁 / 泄露
              tone: critical
            - label: 严重物理破坏
              tone: critical
            - label: 全面监管禁令
              tone: critical
    approximationNotes: 定性评级综合自公开报道的运营覆盖和机构投资者结构。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR008
      - CR010
      - CR012
  - id: FV001
    title: 投资建议决策流程
    type: flow
    summary: 通过依次评估市场进展、财务不透明度和资本结构，得出继续研究建议的分析链。
    data:
      nodes:
        - id: step-1
          label: 工业 AI 平台验证
          description: 已核实能源、国防和采矿领域预测性维护及运营物流的市场进展。
        - id: step-2
          label: 企业客户进展
          description: 与 Barrick、Aramco Digital 和 U.S. Army 的合作证明一级商业验证。
        - id: step-3
          label: 财务与收入不透明
          description: 缺少经认证的 ARR、收入运行率和客户留存指标，限制投资判断的可见度。
        - id: step-4
          label: 资本结构不确定性
          description: 2022 年 1 月的 Series D 轮次留下尚未解决的清算优先权悬置，也使估值标记存在不确定性。
        - id: step-5
          label: 估值倍数压力测试
          description: 基准情景估值为 $1.2B-$1.5B，隐含的 $120M-$150M ARR 需要匹配 8x-10x 倍数。
        - id: step-6
          label: 最终判断：继续研究
          description: 在完成经审计财务和资本表尽调前，维持高风险评级和估值中性判断。
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
    approximationNotes: 展示如何根据现有尽调证据应用结构化决策逻辑。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV010
      - CV013
      - CV014
