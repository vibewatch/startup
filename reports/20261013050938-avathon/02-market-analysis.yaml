callouts:
  - calloutType: "insight"
    title: "Procurement Bifurcation in Industrial AI Adoption"
    body: "Enterprise buyers in asset-heavy industries exhibit a stark bifurcation between low-friction visual AI safety deployments and high-friction predictive maintenance integrations. While computer vision overlays on existing CCTV cameras deliver rapid time-to-value for workplace safety, core asset autonomy workflows require extensive operational technology data integration and organizational change management before software budgets expand."
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM011"
  - calloutType: "risk"
    title: "Diligence Barrier: Absence of Verified Contract and ARR Disclosures"
    body: "Despite high-profile brand messaging and marquee enterprise partnerships across energy and defense, Avathon provides limited transparency regarding commercial contract values, recurring software ARR, and expansion economics. Public marketplace traction remains modest, and customer evaluations highlight significant initial data engineering friction, leaving long-term software monetization unproven in verifiable public filings."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM012"
