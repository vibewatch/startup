evidenceGaps:
  - id: GO001
    title: Exact post-money Series D valuation not disclosed
    description: >-
      The Series D press release does not state a post-money valuation figure. Secondary reporting implies above USD 1
      billion. A formal cap table review is needed to confirm exact valuation.
    relatedTableRefs:
      - TO001
    relatedQuestionRefs:
      - QO005
      - QO017
    diligencePath: Request cap table and investor rights agreement; check SEC Form D filings for partial investment amounts
    whyItMatters: Essential for benchmarking equity value versus capital raised and assessing dilution path to commercialisation
  - id: GO002
    title: Headcount, burn rate, and financial runway not publicly disclosed
    description: >-
      Synchron has not disclosed employee count, departmental breakdown, or burn rate. Required for operations diligence
      and cash runway assessment.
    relatedQuestionRefs:
      - QO016
      - QO025
    diligencePath: Request directly from Synchron; check LinkedIn headcount trends
    whyItMatters: Burn rate against USD 345M total raised and pivotal trial costs determines timeline to commercialisation
  - id: GO003
    title: Pivotal trial protocol, primary endpoint, and enrollment timeline not confirmed
    description: >-
      Pivotal trial preparation is underway but enrollment criteria, primary endpoints, site count, patient numbers, and
      data readout timeline have not been publicly disclosed.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO009
    diligencePath: >-
      Monitor Synchron ClinicalTrials.gov registrations for IDE application for pivotal trial; consult company investor
      relations
    whyItMatters: >-
      Pivotal trial success is the single gating event between Synchron's current pre-commercial status and FDA PMA
      filing
  - id: GO004
    title: Long-term safety data beyond 12 months and IP portfolio details not published
    description: >-
      SWITCH and COMMAND have only 12-month follow-up data. No multi-year safety publication exists. Patent portfolio
      scope and strength are not publicly detailed.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO021
      - QO022
    diligencePath: >-
      Monitor JAMA Neurology and Neurology journals for extended COMMAND follow-up; search USPTO/EPO for Synchron patent
      filings
    whyItMatters: Long-term safety data is required for FDA PMA; IP protection determines competitive moat
  - id: GM001
    title: Implant-eligible fraction of the paralysis population is not precisely known
    type: missing-source
    severity: material
    topic: market-sizing
    description: >-
      Total prevalence of ALS, SCI, and stroke paralysis is documented, but the subset with intact cortical signaling
      and suitable vascular anatomy for an endovascular implant is not published.
    missingEvidence: A peer-reviewed or company estimate of the implant-eligible fraction of severe paralysis patients.
    relatedQuestionRefs:
      - QM009
      - QM024
    relatedTableRefs:
      - TM002
    diligencePath: >-
      Request Synchron internal addressable-market analysis; review clinical eligibility criteria from COMMAND/pivotal
      protocols.
    whyItMatters: >-
      The eligible fraction, not total prevalence, determines the realistic SAM and therefore the valuation-relevant
      revenue ceiling.
  - id: GM002
    title: Synchron device and procedure pricing undisclosed
    type: private-evidence-only
    severity: material
    topic: market-sizing
    description: >-
      Synchron has not disclosed the expected device price or procedure reimbursement, so dollar-denominated SAM and SOM
      cannot be computed precisely.
    missingEvidence: Disclosed or modeled device + procedure price and target reimbursement level.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
    diligencePath: Request pricing assumptions from Synchron; benchmark against DBS and cochlear implant reimbursement.
    whyItMatters: >-
      Price is the multiplier converting eligible patients into market value; without it, sizing remains directional
      only.
  - id: GM003
    title: Contradictory BCI market estimates across analysts
    type: conflicting-data
    severity: minor
    topic: market-sizing
    description: >-
      Published 2026 BCI market values differ across Precedence, SNS Insider, and Fortune Business Insights despite
      similar growth rates.
    missingEvidence: A reconciled, methodology-transparent market model isolating the clinical implantable subset.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
    diligencePath: Compare analyst methodologies and segment definitions; commission a bottom-up clinical-BCI model.
    whyItMatters: Reconciling the estimates is needed before any single TAM figure can anchor a valuation.
  - id: GM004
    title: Near-term penetration rate for the first PMA indication is unproven
    type: missing-source
    severity: material
    topic: market-sizing
    description: >-
      No evidence establishes how quickly implanting-center capacity and referral pathways will convert eligible
      patients after approval.
    missingEvidence: Capacity and ramp data from analog device launches or Synchron commercial plan.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
    diligencePath: Model center capacity and referral conversion; benchmark DBS launch ramp.
    whyItMatters: Penetration speed drives the SOM and the time-to-revenue that underpins the Series D valuation.
  - topic: >-
      Neuralink total funding raised and investor roster — not publicly disclosed; limits competitive financial
      benchmarking
    severity: medium
    relatedQuestionRefs:
      - QP021
  - topic: >-
      Pricing and commercial ASP for any permanently implanted BCI competitor — entirely unknown; no pricing precedent
      exists; limits TP003 precision
