    title: The ~$1B mark is an implied, milestone-contingent valuation
    body: >-
      Synchron is pre-revenue, so the ~$1B Series D mark reflects probability-weighted future cash
      flows gated by FDA approval and CMS coverage, not current financials. It is best read as the
      base case in a wide distribution.
    claimRefs:
      - CV001
      - CV003
      - CV017
