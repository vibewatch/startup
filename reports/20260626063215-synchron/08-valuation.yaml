artifact: valuation
slug: synchron
runDate: '2026-06-26'
company:
  name: Synchron
chapter:
  number: 8
  title: Valuation
  summary: >-
    Synchron's November 2025 Series D ($200M led by Double Point Ventures, ~$345M raised in total)
    implies a post-money valuation near $1 billion - an implied, milestone-contingent mark rather
    than a disclosed multiple, since the company is pre-revenue and gated by FDA approval and CMS
    coverage. Relative valuation places Synchron sensibly within the private-BCI peer set: below
    Neuralink (reported ~$9B target, unconfirmed) and above Precision Neuroscience (~$350-500M),
    with ONWARD Medical and Medtronic anchoring the public spectrum. The recommendation is a
    price-sensitive track / conditional-participate: the ~$1B mark is peer-consistent but not
    independently verifiable without cap-table, burn, and pivotal disclosures, and a missed pivotal
    endpoint or stalled reimbursement would force a down round.
  contentRequirements:
    - >-
      Price- and evidence-sensitive recommendation with confidence, risk rating, valuation stance,
      and decision implication.
    - Implied valuation analysis from the Series D, total raised, and secondary marks.
    - Comparable-company analysis across private BCI peers and public neurotech benchmarks.
    - Bull / base / bear scenarios with explicit assumptions and key value drivers.
    - Valuation sensitivity, return range, and IC scoring across investment dimensions.
    - Thesis-break / kill triggers and final diligence asks with owners or paths.
  plannedTables:
    - name: Recommendation summary table
      requirement: recommendation, confidence, risk rating, valuation stance, decision implication.
    - name: Thesis / anti-thesis table
      requirement: argument, what would change the view.
    - name: Bull / base / bear scenario table
      requirement: assumptions, valuation/return logic, key risks, probability signal.
    - name: Comparable valuation table
      enumeration: true
      expectedMinRows: 4
      requirement: comparable, metric, multiple/valuation/status, relevance, limitation.
    - name: Thesis-break and kill triggers table
      requirement: trigger, threshold, transmission to thesis, action implication.
    - name: Final diligence asks table
      requirement: topic, missing evidence, why it matters, owner or diligence path.
  plannedFigures:
    - name: Recommendation logic
      acceptedTypes:
        - flow
      requirement: Chain from scale/proof/risks/valuation to recommendation.
    - name: Valuation sensitivity
      acceptedTypes:
        - bar
      requirement: >-
        Sensitivity to revenue, margin, multiple, milestone probability, utilization, or other
        driver.
    - name: Valuation / return range
      acceptedTypes:
        - range
      requirement: Low/base/high valuation, exit, dilution, or return outcomes with explicit assumptions.
    - name: Investment KPIs
      acceptedTypes:
        - kpi
      requirement: >-
        IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence
        quality.
  evidenceStrategy:
    - >-
      Use prior chapter evidence first, then gather recommendation-critical
      financing/valuation/comparable data directly.
    - >-
      Valuation/financing - latest rounds, valuation marks, cap-table/preference clues,
      public/private comps, secondary marks.
    - >-
      Adverse/downside - overvaluation, down-round risk, multiple compression, regulatory blockers,
      failed commercialization.
  qualityBar:
    - Recommendation is price-sensitive and evidence-sensitive, not a generic company-quality score.
    - >-
      Use a valuation method matching the business model and stage; show what diligence or price
      change would move the call.
    - >-
      Do not issue buy unless thesis and anti-thesis are evidence-supported and valuation has
      sufficient support.
    - If valuation inputs are missing, prefer research-more or track over false precision.
sections:
  - id: recommendation-implied-valuation
    title: Recommendation and Implied Valuation
    body: >-
      Synchron's November 2025 Series D anchors the valuation analysis. The company raised a $200
      million round led by Double Point Ventures, lifting total capital raised to approximately $345
      million and, per company and independent reporting, implying a post-money valuation near $1
      billion. That figure is an implied mark rather than a disclosed multiple: Synchron is
      pre-revenue, so the valuation rests on probability-weighted future cash flows gated by FDA
      pre-market approval and Medicare coverage, not on current financials. Secondary-market
      activity tracked by independent analysts has implied a value close to the Series D mark, with
      reported trades at a modest premium, which is corroborating but thin evidence. Our
      recommendation is therefore a price-sensitive "track / conditional-participate" rather than an
      unqualified buy: the technology and clinical record are credible, but the valuation is
      milestone-contingent and the next financing will reprice the company on the pivotal-trial
      outcome. The recommendation-summary and thesis/anti-thesis tables below set out the explicit
      conditions — a clean pivotal readout and visible CMS coverage progress would justify leaning
      in, while a missed endpoint, stalled reimbursement, or a closed financing window would break
      the thesis. Because Synchron is a venture-stage medical-device company, the appropriate method
      is scenario and comparable-based rather than a discounted-cash-flow model built on false
      precision, and the implied $1B mark should be read as the base case in a wide distribution,
      not a point estimate.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: comparable-companies
    title: Comparable Company Analysis
    body: >-
      Relative valuation is the most defensible lens for a pre-revenue BCI company, and the
      comparable set spans private BCI peers and public neurotech benchmarks. Neuralink is the
      closest BCI peer by technology category but sits several multiples above Synchron: it has been
      reported targeting a roughly $9 billion private valuation, though a closed round at that level
      is not uniformly confirmed, so the headline peer mark is itself uncertain. Precision
      Neuroscience, a US cortical-surface competitor, is earlier and smaller, with reported
      post-money discussions in the few-hundred-million range, placing Synchron between the two on
      the private-BCI spectrum. Paradromics and Blackrock Neurotech provide directional private
      comparables but disclose little. On the public side, ONWARD Medical offers a listed
      implantable-neurotech reference at a far smaller market capitalization, while Medtronic
      anchors the mature end of the device-valuation spectrum at a market capitalization above $100
      billion, useful only as a terminal benchmark rather than a stage-matched comp. The
      comparable-valuation table enumerates these peers with the metric, reported value, relevance,
      and explicit limitation for each; because most marks are private, unconfirmed, or
      modality-mismatched, the table is partial by construction and the evidence gap below records
      what disclosure would tighten it. The key takeaway is that Synchron's ~$1B implied valuation
      is internally consistent with the private-BCI peer set — comfortably below Neuralink and above
      Precision — but every comparison carries a modality or stage caveat that limits precision.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    tableRefs:
      - TV004
    figureRefs:
      - FV002
  - id: scenarios-drivers-return
    title: Scenarios, Value Drivers, and Return Range
    body: >-
      The valuation distribution is wide and milestone-driven, so we frame it as bull, base, and
      bear scenarios tied to explicit assumptions. In the bull case, a clean pivotal readout, FDA
      PMA, and favorable CMS coverage with a dedicated procedure code support a step-up well above
      the current mark as the company approaches commercial revenue and is repriced against
      approved-device economics. The base case holds the ~$1B implied mark roughly flat to modestly
      up, reflecting continued clinical progress but unresolved reimbursement and pre-revenue
      status, with at least one further dilutive raise before approval. The bear case — a missed or
      delayed pivotal endpoint, stalled reimbursement, or a closed financing window — implies a down
      round and material valuation impairment. The principal value drivers are the same gates
      identified in the risk chapter: pivotal-trial success, reimbursement coverage, manufacturing
      and quality scale-up, the everyday-usability moat from Apple and NVIDIA integrations, and the
      size of the addressable paralysis population. The valuation-sensitivity figure ranks how each
      driver moves the outcome, with approval probability and reimbursement rate dominating; the
      return-range figure translates the scenarios into low/base/high valuation outcomes with
      explicit dilution assumptions. Because the company is pre-revenue, returns are highly convex
      and binary: most of the expected value sits in the approval-and-coverage path, which is
      precisely why the recommendation is conditioned on monitorable milestones rather than issued
      unconditionally.
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
    tableRefs:
      - TV003
    figureRefs:
      - FV003
      - FV004
  - id: thesis-break-diligence
    title: Thesis-Break Triggers and Final Diligence Asks
    body: >-
      A price-sensitive recommendation is only useful if it is paired with monitorable thesis-break
      triggers and a concrete diligence list. The thesis-break-and-kill-triggers table translates
      the valuation case into measurable events: a missed pivotal endpoint or major delay, no CMS
      coverage progress within a defined window after approval, runway falling below twelve months
      without a term sheet, a serious device-related adverse event, or a competitor achieving a
      decisive capability or regulatory lead. Any of these would re-underwrite the company downward
      and most would imply a down round. On the upside, a clean pivotal readout plus visible
      reimbursement progress would justify increasing exposure at the next round. The
      final-diligence-asks table records what an underwriter must obtain before committing at or
      above the current mark: the Series D term sheet and preference stack to understand the real
      per-share economics behind the implied valuation, a runway and burn disclosure to size
      financing risk, the pivotal-trial protocol and any interim safety data, a freedom-to-operate
      and IP opinion against the competitor patent landscape, and reimbursement strategy detail
      including any CMS engagement. Each ask maps to an owner or diligence path. Because Synchron
      declines to disclose burn, unit economics, and the detailed cap table publicly, the honest
      valuation conclusion is that the ~$1B implied mark is plausible and peer-consistent but not
      independently verifiable without these disclosures, which is why the recommendation prefers
      track-and-condition over commit-at-any-price.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
    tableRefs:
      - TV005
      - TV006
    figureRefs: []
