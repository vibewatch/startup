      description: >-
        Most BCI peer valuation marks are private, unconfirmed, or modality-mismatched, so the
        comparable table cannot be exhaustive or fully verified.
      missingEvidence: >-
        Confirmed private-round marks for Neuralink, Precision, and Paradromics, plus stage-matched
        public comps.
      relatedQuestionRefs:
