    title: Valuation is peer-consistent but not independently verifiable
    body: >-
      The mark sits sensibly below Neuralink and above Precision, but Synchron does not disclose
      burn, unit economics, or the detailed cap table, so the valuation cannot be independently
      confirmed without further diligence.
    claimRefs:
