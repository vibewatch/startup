      relatedTableRefs:
        - TV004
      diligencePath: >-
        Obtain confirmed funding-round disclosures and independent secondary-market marks for each
        peer.
      whyItMatters: >-
        Unconfirmed peer marks materially affect where Synchron sits in the private-BCI valuation
        spectrum.
    - id: GV002
      title: Cap table and preference stack undisclosed
      type: missing-source
      severity: material
      topic: valuation
      description: >-
