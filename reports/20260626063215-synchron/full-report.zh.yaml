  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Synchron 竞争的是植入式脑机接口（BCI）市场——这类医疗器械读取神经信号，并把意图转成数字控制能力，面向失去运动或语言功能的人群。这里的相关边界是用于恢复重度瘫痪患者数字自主能力的临床、侵入式 /
              血管内 BCI 细分市场，而不是更宽泛的 BCI 大类；后者还包括非侵入式消费 EEG 头显、神经反馈健康小工具或仅用于研究的实验室设备。纳入支出的项目包括植入器械、植入手术（Stentrode 通过颈静脉进行约
              20 分钟的血管内部署）、外部信号处理单元、软件和持续临床支持。排除的支出包括 Parkinson
              病深部脑刺激、人工耳蜗，以及眼动追踪平板等辅助增强沟通（AAC）工具；这些工具覆盖部分重叠用户，但机制不同。买方若不选择 BCI，可选的现状替代方案正是这些 AAC
              和由护理者辅助的沟通方式，外加什么都不做。由于尚无植入式 BCI 获得 FDA
              上市前批准或全国报销代码，当前市场仍处于商业化前：今天收入实际上为零，可服务市场只是一个前瞻性构造，受监管批准和支付方覆盖卡口约束。如此收紧边界很重要，因为头部 BCI
              市场数字混合了消费和医疗类别；两者增长速度和采用障碍都截然不同。
