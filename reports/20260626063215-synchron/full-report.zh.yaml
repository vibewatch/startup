      - number: '7.4'
        title: 合作伙伴、平台与依赖风险
        blocks:
          - type: paragraph
            body: >-
              对 Apple 的平台依赖具有结构性重要性。Synchron 宣布与 Apple iPhone、iPad 和 Apple Vision Pro 设备做原生 BCI-HID
              集成（MassDevice），并有报道显示一名 Synchron 患者是 Apple Vision Pro 的首位临床 BCI 用户，形成具名患者宣传集中度。该集成依赖 Apple 持续支持 BCI-HID
              协议；一旦协议变化或访问政策调整，核心日常可用性价值主张会受损。Apple 2024 年 5
              月发布的原生眼动追踪无障碍功能，同时验证了瘫痪患者市场，也引入部分替代风险。资本提供方依赖对一家尚无收入的公司而言是生死线：Synchron 完成 $200M Series D（2025 年 11 月）并获得约
              AUD 54M NRF 支持，累计融资 $345M，但仍在无收入状态下烧钱。如果融资窗口在关键性试验读出前关闭，投资论点会被致命破坏。FDA 和 CMS
              是依赖交易对手，因为整个收入论点都由它们的决定卡住。三个学术中心的植入中心集中度限制需求，也带来临床医生离任风险。
