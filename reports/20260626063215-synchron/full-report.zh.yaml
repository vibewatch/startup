      - number: '6.4'
        title: 获客、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Synchron 的获客动作本质上是临床采用和报销动作，而不是销售主导动作。新增患者需求由神经科医生以及 ALS
              或脊髓损伤诊所把合格患者转诊至植入中心创造，这意味着获客漏斗穿过临床转诊路径、患者倡导组织和试验站点声誉。扩张沿两条轴线展开：增加植入中心（地理和产能扩张），以及把批准适应症从初始 ALS
              或重度瘫痪标签扩展到更广泛的卒中和脊髓损伤人群。INTENT 试验（NCT07543367）和 FOCUS-AUS 试验（NCT07533903）显示 Synchron 已在 COMMAND
              之外扩大临床足迹。Apple BCI-HID 原生集成创造了额外扩张界面：每个拥有 iPhone 和 iPad、且符合条件的患者，都可能成为用户，而不需要新的硬件生态投入。Synchron CEO
              表述中提到每周患者互动是关键参与度指标，暗示活跃使用而不是闲置安装。集中度风险很大：今天已展示的需求集中在三个美国学术中心和单一主导支付方（Medicare），患者管线依赖尚未形成既定报销激励的转诊行为。采购摩擦很高，因为医院不会在覆盖存在前配置设备和手术预算，临床医生也不会在设备获批并报销前搭建转诊路径——这是新型植入式设备典型的鸡生蛋、蛋生鸡问题。全球约
              100 million 人存在上肢障碍，长期可服务基础很大；近期商业基础仍只是少数试验站点。
            claimRefs:
