      - number: '1.3'
        title: 临床项目
        blocks:
          - type: paragraph
            body: >-
              Synchron 的临床项目覆盖澳大利亚、美国和加拿大。


              首个人体 SWITCH（Stentrode With Thought-Controlled Digital Switch）研究入组 4 名澳大利亚患者。2023 年 1 月发表于 JAMA Neurology
              的结果显示，12 个月随访中没有持续性神经功能缺损、没有器械血栓或迁移，信号质量保持稳定。研究由 Royal Melbourne Hospital 的 Peter Mitchell 教授和 Bruce
              Campbell 教授牵头。


              在美国，COMMAND 试验在 FDA 批准的首个永久植入式 BCI Investigational Device Exemption（IDE）下进行，并获得 NIH BRAIN Initiative
              支持。COMMAND 在三个中心入组 6 名重度上肢瘫痪患者：UB Neurosurgery/Gates Vascular Institute（Buffalo, NY）、Mount Sinai（New York,
              NY）和 UPMC/Carnegie Mellon（Pittsburgh, PA）。入组于 2023 年 9 月完成。2024 年 9 月 30 日，6 名患者全部达到主要终点：植入后 12
              个月评估期内，没有器械相关严重不良事件导致死亡或永久性残疾加重。没有患者出现与大脑或血管相关的 SAE。器械部署准确率为 100%，部署中位时间 20 分钟。结果在 2024 Congress of
              Neurological Surgeons 上发表。


              此后，Synchron 在加拿大启动 FOCUS-CAN，并获准在美国开始 INTENT 试验；INTENT 被描述为评估 Stentrode 更长期可行性的研究。公司正在准备 2026
              年关键性临床试验。Synchron 只有先在规模化试验中证明疗效，才能提交 FDA PMA 申请。


              FDA 于 2020 年 8 月授予 Stentrode Breakthrough Device designation，并于 2021 年 7 月批准美国首个 IDE。
