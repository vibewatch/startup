              NVIDIA（Holoscan edge AI）做生态集成。没有公开的，基本是承销方需要的全部财务指标：收入（今天为零，但未披露前瞻预测）、在手现金、月度或年度
              burn、毛利率、制造成本、设备定价、带成本的员工数，以及任何投后估值数字（Series D 被广泛描述为对应超过 USD 1 billion 的估值，但公司未确认具体数字）。Synchron
              是私营公司，EDGAR 中没有 SEC 定期文件可用于交叉验证这些数据。检索 SEC EDGAR 公司文件数据库中 Synchron Inc. 的 Form D
              私募提交，没有可访问结果，这与公司可能用法律名称变体提交、或搜索端点不可用相一致；无论哪种情况，都说明最多只会存在 Form D
              类型的私募证据，只披露融资金额，不披露经营经济性。由此形成很大的私有指标缺口：投资案例建立在证据充分的临床和监管里程碑上，但决定资本充足性和最终回报的财务输入几乎全部未披露。尽调含义是，公共来源无法完成财务承销，必须直接进入
              data room，获取 cap table、审计财务、burn 明细和定价假设。
