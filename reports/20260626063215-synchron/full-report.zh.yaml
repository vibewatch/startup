      - number: '1.5'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Synchron 已完成六轮融资，累计融资 USD 345 million；该金额在 2025 年 11 月 Series D 新闻稿中得到确认。资本结构全为股权，未披露债务融资。


              Series A 支持了首个人体 SWITCH 研究。2021 年，Khosla Ventures 领投 USD 40 million Series B。2022 年 12 月，ARCH Venture
              Partners 领投超额认购的 USD 75 million Series C，并引入 Gates Frontier、Bezos Expeditions、Reliance Digital
              Health、Greenoaks、Alumni Ventures、Moore Strategic Ventures 和 Project X；累计融资达到 USD 145 million。


              2025 年 11 月的 USD 200 million Series D 由 Double Point Ventures 领投，Australian National Reconstruction
              Fund（主权产业基金）、T.Rx Capital、Qatar Investment Authority、K5 Global、Protocol Labs 和
              IQT（In-Q-Tel，美国情报界的风险投资机构）参投。所有既有投资方（ARCH Ventures、Khosla Ventures、Bezos
              Expeditions、NTI、METIS）均继续参与。Series D 隐含估值超过 USD 1 billion；Neurofounders 将 Synchron 描述为 Neuralink 之后，第二家超过
              USD 1 billion 的现代 BCI 公司。


              对这家商业化前、临床阶段公司而言，收入和 ARR 不适用。Morgan Stanley 预计 BCI 市场规模为 USD 400 billion（Synchron 在公司材料中引用了该数字）。
