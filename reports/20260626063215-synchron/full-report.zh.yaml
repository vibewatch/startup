      - number: '5.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 血管内设计是在安全性与带宽之间主动取舍
            body: >-
              Synchron 不穿刺脑组织，而是从邻近皮层的静脉记录信号，因此避免开颅、降低手术风险；代价是只有 16 通道，而皮层内竞争对手有 1,000
              个或更多通道。这个取舍既是产品的核心安全优势，也是主要能力限制，也是竞争论点和下一代带宽路线图的关键。
            calloutType: insight
            claimRefs:
              - CE002
              - CE022
              - CE023
          - type: callout
            title: 对 Acquandas 存在单一供应商制造依赖
            body: >-
              溅射薄膜镍钛工艺需要专门 MEMS 设备，集中在一家德国供应商。Synchron 持有 Acquandas
              股权，部分缓释了风险，但无法消除良率问题、地缘政治风险或产能约束带来的冲击。一旦制造中断，植入体供应会直接停摆。
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
          - type: callout
            title: 公开文件缺少网络安全和神经数据隐私内容
            body: 神经信号属于最敏感的个人数据之一。Synchron 没有公开无线神经数据链路的安全架构，也没有公开原始或解码脑信号的数据处理政策。随着规模扩大，这一缺口会影响医院采购、监管提交和投资人尽调。
            calloutType: risk
            claimRefs:
              - CE027
