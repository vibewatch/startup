      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动因素利好市场。人口老龄化正在推高 ALS 和中风幸存者的绝对数量；更宽泛 BCI 市场的高十位数 CAGR 反映出投资增加和临床验证推进；Synchron 的生态合作——2025 年宣布的原生
              Apple BCI-HID 集成和 NVIDIA Holoscan 边缘 AI 合作——降低了把神经信号转成日常设备控制的集成成本，扩大了感知效用。监管顺风也重要：FDA Breakthrough Device
              Designation 和首个永久植入式 BCI IDE 给 Synchron 提供了更清晰的路径，也可能带来新技术附加支付等报销加成。不过，约束同样强，而且主要卡的是时间，而非最终规模。最大约束是报销：截至
              2026 年中，Medicare 对植入式 BCI 还没有全国覆盖决定，因此即使器械获批，也没有保证付款；GAO 和独立评论者都把报销和长期获益证明列为未解决问题。监管风险真实存在，因为 Synchron
              仍必须完成关键性试验并拿下 PMA。资本强度高——医疗器械商业化、销售基础设施和多年试验都需要持续资金，哪怕公司已累计融资 USD 345
              million。转换成本和信任门槛也会拖慢采用：相比眼动追踪器，植入不可逆，临床证据门槛更高；16
              电极血管内设计用信号带宽换安全性，通道数更高的竞品会攻击这一点。总体看，驱动因素抬高长期天花板，约束因素把实质性收入推到多年之后，并让支付方参与成为限速环节。
