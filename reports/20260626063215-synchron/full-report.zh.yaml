      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Neuralink 是最知名、资金最充足的直接竞争者。它的 N1 植入物带有 1,024 个记录电极，通过机器人手术系统直接放入皮层组织。公司获得 FDA Breakthrough Device
              designation，用于帮助沟通障碍患者恢复语言功能；该 BCI 适应症与 Synchron 的 ALS 和瘫痪目标人群重叠，确立了监管优先级。Neuralink 的垂直整合——机器人手术平台、自研
              ASIC、应用层 Telepathy 界面——若能拿到 PMA，可能形成很深护城河；但开颅要求限制了可承受颅内手术的患者人群，也让神经外科资质路径更复杂。

              Precision Neuroscience 开发了 Layer 7 Cortical Interface，这是一种薄膜硬膜下皮层脑电阵列，带有 1,024 个电极，放置在脑表面而不穿透皮层。Precision
              获得短期使用（最长 30 天）的 510(k) clearance；截至 MassDevice clearance 报道时，已在临床程序中入组 37 名患者。510(k) 路径让 Precision 可以比
              Synchron 获得 PMA 早数年建立神经外科中心关系、培训植入医生并积累商业临床经验。这会给 Synchron 带来神经外科项目中心准入被锁定的风险。

              Blackrock Neurotech 生产 Utah Array 皮层内电极系统，是所有 BCI 平台中人体植入研究记录最长的公司。Blackrock
              的模块化研究平台服务全球学术机构、政府研究和临床研究者。该公司的 for-researchers 平台作为机构工具已可商用，但截至 2026 年 6 月，并不构成 FDA
              批准的永久瘫痪管理商业产品。其分发由研究机构驱动。

              BrainGate 是一个多机构学术研究联盟，由 Brown University、Stanford、Massachusetts General Hospital 和 Case Western Reserve
              支撑。它不是商业公司，也不提供打包商业产品。BrainGate 围绕皮层内 BCI 性能发表了大量论文，但依赖 FDA 批准的研究性器械豁免进行试验阶段使用。它对 Synchron
              的竞争相关性，主要在于生成影响监管和临床社群的临床数据。

              Paradromics 是一家临床阶段 BCI 公司，目标是高数据率神经记录，尤其用于重度瘫痪患者的语音合成。截至 2026 年 6 月，在已审阅来源中，公司官方新闻中心未披露临床试验入组人数或 FDA
              状态。Paradromics 代表语音 BCI 的未来竞争者，但在瘫痪用例上的开发阶段早于 Synchron 或 Neuralink。

              Tobii Dynavox 是基于眼动追踪技术的增强与替代沟通（AAC）设备市场领先者。Tobii Dynavox 产品已商业化，可通过 Medicare 和 Medicaid 的耐用医疗设备福利类别覆盖，并被
              ALS、SCI 和其他重度瘫痪患者广泛用于文字输入和设备控制。作为非手术替代品，Tobii Dynavox 面向的是与 Stentrode 相同的沟通恢复任务，前提是患者仍保留可用眼动。
