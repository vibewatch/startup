      - number: '1.4'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Synchron 的高管团队由科学创始人与成熟医疗器械商业化老将组成。


              Thomas Oxley, M.D. Ph.D. 是 CEO 兼联合创始人。他在 University of Melbourne 完成医学学位和 Ph.D.，并在 Mount Sinai Health
              System 神经外科系担任讲师。Nicholas Opie, Ph.D. 是联合创始人，也是主导早期 Stentrode 设计的生物医学工程师。


              Kurt Haggstrom 于 2022 年加入并担任 Chief Commercial Officer，负责商业战略、合作伙伴关系和报销规划。2025 年 8 月，Andy Rasdal（自 2023 年
              12 月起任董事）出任 Chief of Staff。Rasdal 曾任 DexCom CEO（主导 FDA PMA 和 IPO）、Obalon Therapeutics CEO（FDA PMA 和 IPO）以及
              Medtronic Vascular 总裁。Mark Brister 同期加入担任 VP R&D，拥有 38 年经验、100 多次产品发布、450 多项专利，经历横跨
              Guidant、Medtronic、DexCom 和 Obalon。


              董事会包括 Double Point Ventures 的 Campbell Murray（Series D 领投方，14 次 IPO 记录）、ARCH Venture Partners 的 Ari
              Nowacek（Series C 加入）以及 ARCH 的董事会观察员 Robert Nelsen。


              关键人风险集中在 CEO Thomas Oxley 身上。他掌握科学愿景、投资者关系，也是主要媒体发言人。公司未公开披露继任计划或关键人保险。
