      - number: '5.4'
        title: 路线图、开发者生态与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Synchron 的路线图分两条线推进。近端路线瞄准 2026 年关键性试验，以支持 FDA PMA 递交——这一里程碑会把研究性设备转为可商业植入产品。软件路线持续迭代 Chiral、Apple
              BCI-HID、NVIDIA Holoscan 和 OpenAI 集成，在不改硬件的情况下提升能力。更长线是下一代、更高通道数接口，正在 San Diego
              场地进行早期研发，目标是在保留血管内安全优势的同时，缩小与皮层内竞争对手的带宽差距；架构和时间线未公开披露。CTO Riki Banerjee 于 2024 年 1
              月获任，且任命明确关联制造爬坡，释放出产品成熟化转型信号。开发者生态信号方面，Synchron Careers 页面列出硬件工程、软件 /
              AI、临床事务和监管岗位，说明产品开发活跃，但不代表独立外部社区。GitHub 上的 NeuroTechX awesome-bci 仓库是一个由社区维护的 BCI
              工具和框架索引，被从业者和研究人员使用，确认更广泛的 BCI 开发生态存在；但它并非 Synchron 专属，也不反映外部采用 Synchron 平台或 API。两个开发者信号来源都只是有限
              proxy；evidenceGap 记录的是外部开发者没有围绕 Synchron 特定技术栈发表内容。核心证据缺口是：Chiral 准确率没有独立 benchmark；2026
              年关键性试验尚未启动，时间表只是目标；下一代接口没有任何公开技术规格；网络安全和神经数据隐私仍未披露。
