      - number: '6.2'
        title: 医院和临床站点客户，以及具名患者证据
        blocks:
          - type: paragraph
            body: >-
              Synchron 今天最具体、可核验的客户，是作为植入和研究站点的学术医学中心。COMMAND 早期可行性研究在三个主要美国站点开展——纽约 Mount Sinai Health
              System、University at Buffalo 的 Gates Vascular Institute，以及 Pittsburgh 的 UPMC 与 Carnegie Mellon University
              合作站点——项目由 NIH BRAIN Initiative 支持。六名患者在这三个中心完成入组；一年随访未报告死亡或与设备相关的严重不良事件。美国首例植入于 2022 年在 Mount Sinai West
              完成，由 Dr. Shahram Majidi 主导，患者 48 小时内出院。最强客户验证来自名为 Mark 的患者：这名 64 岁 ALS 男性成为首个通过 Stentrode 用意念控制 Apple
              Vision Pro 的人，随后在 2025 年 8 月基于 Apple 新 BCI Human Interface Device 协议，完成首个意念控制 iPad 交互。更早之前，澳大利亚 SWITCH
              研究中的 4 名患者全部学会 BCI 控制，并达到 12 个月安全性终点——该结果发表于 JAMA Neurology。同行评议文献（PMID 33115813）记录的两名 ALS
              患者在家中仅靠意念完成发短信、购物和管理财务等任务。Synchron 由 OpenAI 支持的聊天功能也曾由一名具名患者用户演示，展示了 AI
              辅助通信这一面向患者的扩展能力。这些具名部署全部是研究性使用，不是付费生产客户；它们代表的是在顶级机构中的临床概念验证，而不是商业客户基础。
