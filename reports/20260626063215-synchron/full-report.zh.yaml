chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立
        blocks:
          - type: paragraph
            body: >-
              Synchron 是一家临床阶段神经技术公司，总部位于 New York City（Brooklyn），并在 California 州 San Diego
              设有工程中心。公司将使命表述为：借助植入式脑机接口恢复、延展并保护人的自主能力。它的商业目标是为数百万运动障碍人群打造第一款可商业规模化的 BCI，早期面向
              ALS、中风和脊髓损伤患者——这些患者已无法靠身体动作或语音控制数字设备。


              公司于 2016 年在澳大利亚 Melbourne 创立，由 Thomas Oxley 医生和 Nicholas Opie 医生基于 University of Melbourne Vascular
              Bionics Laboratory 的研究共同创办。Oxley 是神经科医生兼心脏科医生，拥有 University of Melbourne 的 M.D. 和 Ph.D.，现任 CEO，并在 New York
              的 Mount Sinai Health System 神经外科系担任讲师。Opie 是生物医学工程师，曾在 University of Melbourne 共同开发 Stentrode 电极阵列。


              截至 2026 年中，Synchron 已完成两项临床试验（澳大利亚 SWITCH、美国 COMMAND），获准启动第三项美国试验（INTENT），并在加拿大推进 FOCUS-CAN。公司已在各项试验中植入 10
              名患者。Synchron 是 Neuralink 之后，第二家隐含估值跨过 10 亿美元门槛的现代 BCI 公司。Stentrode 带有 FDA 标识「CAUTION - Investigational
              device. Limited by Federal law to investigational use」；商业化上市必须完成关键性试验并获得 FDA 上市前批准（PMA）。
