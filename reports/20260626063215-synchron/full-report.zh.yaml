  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、使用场景与模块图
        blocks:
          - type: paragraph
            body: >-
              Synchron 的产品是 Stentrode
              系统：这是首个设计成无需开颅植入的脑机接口，让重度瘫痪患者只靠意图就能免手操作数字设备。从客户工作流看，患者想象一个动作，设备捕捉对应的运动皮层信号，再把信号解码成数字指令——一次光标点击、一条短信、一次
              Vision Pro 选择——全程不需要肢体动作。2020 年首个人体研究论文（PubMed 33115813）显示，两名 ALS
              患者在家中用该系统发短信和浏览网页。已展示的使用场景现在覆盖光标控制、短信、Apple Vision Pro 和 iPad 原生操作，以及 OpenAI 支持的 AI
              聊天——全部仍在研究性许可之下。模块图包含五项清晰资产：Stentrode 植入体（16 电极镍钛支架阵列）、胸内遥测单元、外部处理单元、Chiral AI 解码模型，以及 Apple BCI-HID
              集成层。制造模块锚定供应链尽调：电极阵列由德国专业厂商 Acquandas 通过 MEMS 薄膜溅射生产，Synchron
              持有该公司股权。监管限定约束所有商业表述：该系统仅供研究使用，受美国联邦法律限制只能用于研究，尚未获准在临床试验外商业植入。
