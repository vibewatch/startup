      - number: '5.3'
        title: 信任、安全、临床证据与合规
        blocks:
          - type: paragraph
            body: >-
              Stentrode 系统的安全和合规由医疗设备监管框架约束。四项试验构成临床证据基础：SWITCH（NCT03834857，4 名澳大利亚患者，12 个月安全性发表于 JAMA
              Neurology）、COMMAND（NCT05035823，6 名美国患者，2024 年达到主要安全终点，2025 年预印本报告 16 通道慢性稳定性数据）、INTENT（NCT07543367）和
              FOCUS-AUS（NCT07533903）。2025 年 COMMAND 稳定性预印本（PubMed 41040697）包含作者利益冲突披露，注明公司从属关系和专利权益。Synchron 拥有 FDA
              Breakthrough Device Designation（2020 年）和永久植入式 BCI 的首个 FDA IDE（2021 年）。商业部署需要完整 FDA pre-market
              approval（PMA），要求高于 IDE 许可。PMA 制造要求符合 ISO 13485 质量管理体系，但 Synchron
              的认证状态未被公开确认。血管内特有风险——血管血栓、导线迁移、狭窄——需要抗血小板或抗凝管理。公开文件缺少两块信任内容：没有发布网络安全架构或无线神经数据链路加密规格；也没有披露覆盖原始或解码脑信号的神经数据隐私政策。公司称聊天功能不会与
              OpenAI 分享脑数据，这是正面但很窄的一个数据点。鉴于所有试验的总患者数仍小，长期耐久性和罕见不良事件仍未刻画清楚。
