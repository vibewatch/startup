      - number: '4.3'
        title: 资本充足性、烧钱速度与 runway
        blocks:
          - type: paragraph
            body: >-
              Synchron 已累计完成约 USD 345 million 股权融资，最新一轮是 2025 年 11 月 6 日宣布、由 Double Point Ventures 领投的 USD 200 million
              Series D。该轮包括主权和战略投资人：Australia's National Reconstruction Fund Corporation（NRFC）承诺 AUD 54 million（约 USD 34
              million），专门用于建立澳大利亚商业和工程枢纽，使美国业务之外的制造基础设施成本也进入资本投放图景。Qatar Investment Authority、IQT（美国国家安全战略投资人）、T.Rx
              Capital、K5 Global 和 Protocol Labs 参投，既有投资人包括 ARCH Venture Partners、Khosla Ventures 和 Bezos
              Expeditions。逐轮融资历史已在 Company Overview 章节记录，此处只引用不重复展开。除人员和试验外，几项离散资本投放也指向持续支出。2024 年 1 月，Synchron
              收购神经电极供应链伙伴 ACQUANDAS GmbH 的股权，说明资本开支指向特定制造与供应链，而不只是 opex。Riki Banerjee 于 2024 年 1 月获任
              CTO，负责为关键性研究做工程准备，直接释放出关键性试验前技术 burn 升高的信号。资深医疗设备商业化高管 Andy Rasdal 于 2023 年 12
              月加入董事会，说明公司已转向商业发布及其配套成本搭建。2024 年 7 月，Synchron 推出由 OpenAI 支持的 BCI 聊天功能，表明产品扩展工程和 AI
              合作成本已经成为资本使用项目。向前看资本充足性，公司未披露在手现金或 burn rate，因此只能估算 runway。处于后期阶段的神经设备公司，一边推进关键性试验、一边搭建美国和澳大利亚商业及 AI 运营，年
              burn 通常约 USD 40-120 million；以新募 USD 200 million 加 NRFC 的 AUD 54 million 共同投资测算，runway 约为两到四年——足以支撑计划中的
              2026 年关键性试验和初步商业化搭建，但不显然足以在不再融资的情况下走到可自我维持的报销收入。下一轮融资触发点最可能是关键性试验读出和 PMA 递交。因此，约束性财务依赖是获批加报销与资本耗尽之间的缺口。
