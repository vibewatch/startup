      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              该市场的经济结构把用户、买方和支付方拆开，这一点决定采用节奏。用户是重度运动障碍患者——可分为 ALS、脊髓损伤（尤其四肢瘫痪）以及中风或闭锁综合征人群——外加支持日常器械使用的护理者。买方是医院，具体是
              Mount Sinai、UPMC、University at Buffalo 等拥有介入神经学和神经外科项目的大学医学中心；Synchron 的 COMMAND
              试验就在这些机构运行，它们掌握资本预算和植入临床流程。支付方几乎就是政府：美国多数 ALS 和重度瘫痪患者由 Medicare（包括 65 岁以下残障资格）或 Medicaid 覆盖，因此 Centers for
              Medicare & Medicaid Services 是需求闸门。预算权因此横跨两张桌子——医院的器械和手术预算，只有报销路径出现后才会打开；以及联邦支付方的覆盖决定。每个细分市场的采用触发器，是 FDA
              批准的适应症、已建立的手术和器械报销代码（例如 Category I CPT code 以及有利的全国或地方覆盖决定）以及临床路径集成三者合一，让神经科医生把合格患者转诊至植入中心。商业保险和 Veterans
              Health Administration（对脊髓损伤退伍军人相关）构成次级支付方分层。由于患者不直接付款，处方者、植入者和支付方又是不同参与者，Synchron 的 go-to-market
              本质是多利益相关方报销和临床采用问题，而不是常规销售动作。
