      - number: '3.5'
        title: 反向证据与竞争风险
        blocks:
          - type: paragraph
            body: >-
              对 Synchron 竞争位置最重要的反向发现，是电极数量缺口。Synchron 的 16 通道 Stentrode 捕获的神经信号远少于 Neuralink 的 1,024 电极 N1 或 Precision
              的 1,024 电极 Layer 7 阵列——通道数劣势为 64:1。更高通道数通常带来更丰富的解码、更快的打字速度、更细腻的运动意图分类，以及未来多肢体假肢控制。如果 BCI
              市场朝更丰富的神经接口演进，用于沟通或假肢应用，Synchron 的 16 通道限制将成为结构性能力天花板；除非 San Diego 中心秘密开发的下一代多通道经导管接口换代，否则无法解决。

              Precision Neuroscience 的 510(k) clearance 创造了竞争滩头阵地。Precision 可在短期 clearance 下把 1,024
              电极器械部署到神经外科中心，借此训练医生、建立机构流程并积累临床性能数据。Synchron 在永久植入类别中的 PMA 优势，若 Precision 的中心准入位置在商业化上市决策点转化为对 Precision
              平台的偏好，就可能被抵消。

              非手术替代品是体量最大的竞争威胁。Tobii Dynavox 和类似眼动追踪 AAC 系统，满足了大多数仍保留可用凝视控制的瘫痪患者的沟通需求——ALS
              患者在多数病程中大多如此。这些替代品不需要手术、没有植入风险，已由现有 Medicare / Medicaid DME 代码覆盖，并且可以立即部署。只有当眼控失效（晚期 ALS
              闭锁综合征）或患者需要比眼动追踪更丰富的设备控制时，Stentrode 的临床优越性才会显现。

              Synchron CCO Kurt Haggstrom 在 Medical Design and Outsourcing 采访中承认，永久植入式神经器械没有快速上市路径，PMA 路径是 FDA
              最严格的轨道。这个明确认知给 Precision 留出了深化医院关系的窗口，也给 Neuralink 留出了生成更多患者数据的窗口，并让替代品有时间在 Synchron 商业化上市前巩固位置。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
