  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，Synchron 关键竞争耐久性与商业就绪度指标的紧凑 KPI 摘要；它呈现的护城河维度，不同于 TP004 的详细风险登记。这里聚焦可观察、由来源支撑的指标，而不是定性严重程度评级。
    claimRefs:
      - CP004
      - CP005
      - CP019
      - CP020
      - CP022
      - CP023
      - CP024
      - CP029
    data:
      items:
        - label: 临床植入总数（SWITCH 加 COMMAND 加在研试验）
          value: 11 confirmed
          detail: >-
            截至 2026 年 6 月，SWITCH（澳大利亚 4 例）、COMMAND（美国 6 例）以及额外 FOCUS/INTENT 患者累计植入 11 枚 Stentrode；按公司披露，这是同业中永久植入 BCI
            数量最高的一组
        - label: Apple BCI HID 先发（原生支持 iOS 的 BCI 公司）
          value: 1 of 1
          detail: 截至 2026 年 6 月，Synchron 是唯一跑通 Apple BCI-HID 原生集成的 BCI 公司；2025 年 5 月公告和 Vision Pro 患者演示已确认这一点
        - label: COMMAND 主要终点完成（患者无器械相关 SAE）
          value: 6 of 6
          detail: COMMAND 试验达到主要安全终点，6/6 名患者在 12 个月评估时均未报告器械相关严重不良事件；这是竞争组里最高的永久植入安全里程碑
        - label: 主动招募试验（美国加加拿大，2026 年）
          value: 2 active
          detail: 截至 2026 年 6 月，INTENT（NCT07543367，美国，聚焦 ALS）和 FOCUS-AUS（NCT07533903，加拿大）都在主动招募；用于衔接关键试验
        - label: 电极数量对比通道领先竞争者（Neuralink 和 Precision）
          value: 16 vs 1,024
          detail: Synchron 的 16 通道血管内阵列，比 1,024 电极的 N1（Neuralink）和 Layer 7（Precision）少捕捉 64 倍电极通道；这种根本性的信号保真差距，是结构性护城河风险
        - label: 已获 510(k) 或商业准入的竞争器械（含替代品）
          value: 2 cleared
          detail: Precision 的 Layer 7 已获 510(k) 短期使用准入；Tobii Dynavox AAC 已在 DME 下获得商业准入；两者都给 Synchron 的商业化前状态施加参照压力
