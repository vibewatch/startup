      - number: '5.2'
        title: 系统架构与制造流程
        blocks:
          - type: paragraph
            body: >-
              Stentrode 系统包含三层硬件和多层软件栈。感知层是 Stentrode 电极阵列本身：一个自膨式镍钛支架，搭载 16
              个铂电极，经颈静脉送入上矢状窦；该静脉窦紧邻运动皮层。胸部层是植入皮下的内部遥测单元，通过皮下隧道连接电极导线；该单元把神经信号无线穿过胸壁传输到外部处理单元。外部单元运行软件栈：Chiral，被
              Synchron 描述为可跨患者和会话泛化的神经解码基础模型，运行在 NVIDIA Holoscan 上，用于低延迟边缘 AI 推理；以及 Apple BCI-HID 驱动，把解码后的意图映射为
              iPhone、iPad 和 Vision Pro 的原生输入事件。核心硬件制造流程技术门槛很高。据 Synchron CTO Riki Banerjee 在行业媒体中介绍，电极阵列用 MEMS
              风格的溅射薄膜镍钛制造，薄膜沉积在硅晶圆上；薄膜从晶圆释放后卷到芯轴上，形成支架形态。该工艺需要高度专门化设备。2024 年 1 月，Synchron 收购德国 MEMS 和薄膜制造商 Acquandas
              的股权，以锁定这一生产环节。Acquandas 是薄膜镍钛的战略制造伙伴，形成关键依赖图所突出的一项材料单一供应商依赖。
