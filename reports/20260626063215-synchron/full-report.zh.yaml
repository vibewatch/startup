        title: 图表与证据
        blocks:
          - type: callout
            title: 没有付费客户，需求卡在一个尚无覆盖路径的单一支付方上
            body: >-
              Synchron 处于商业化前：唯一客户是试验站点和参与者，最终需求取决于尚不存在的 Medicare 覆盖决定。InsideBCI 2026 年 3 月政策分析确认，CMS 没有植入式 BCI
              专用覆盖路径，意味着 FDA 批准后的采用可能被多年逐案承包商裁定拖慢。覆盖缺失和单一支付方主导，是客户侧的核心风险。
            calloutType: risk
            claimRefs:
              - CU003
              - CU018
              - CU029
          - type: callout
            title: Mark 的 Apple Vision Pro 和 iPad 演示是最强的商业信号型客户证据
            body: >-
              Mark 的具名患者故事——这名 64 岁 ALS 患者成为首个用意念操作 Apple Vision Pro 的人，随后又在 Apple BCI-HID 协议下完成首个意念控制 iPad
              交互——是目前质量最高的具名客户证据。再加上 MassDevice、MobilityMgmt 和 Synchron 自身 BusinessWire
              新闻稿的多源佐证，它锚定了具名客户证据表，并证明了实验室以外的真实世界效用。
            calloutType: insight
