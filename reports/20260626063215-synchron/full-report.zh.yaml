      - number: '1.6'
        title: 风险、批评与竞争挑战
        blocks:
          - type: paragraph
            body: >-
              Synchron 的血管内方案内嵌一个根本取舍：血管内 16 个电极捕获的神经信号比皮层内植入物更粗。Neuralink 的 N1 芯片拥有 1,024 个皮层电极；Precision Neuroscience
              的表面阵列也达到 1,024 通道。COMMAND 可行性研究用 6 名患者证明了安全性，但关键性试验必须展示的规模化疗效证据尚未给出。


              U.S. GAO 关于脑机接口的 2024/2025 年报告列出四类挑战，均直接适用于
              Synchron：（1）数据所有权与隐私——脑信号数据缺乏统一法律框架；（2）潜在访问中断——如果公司停止运营，患者可能失去器械支持；（3）Medicare 和保险覆盖——CMS
              报销路径尚未建立；（4）长期安全性——现有临床数据只覆盖小样本 12 个月。Frontiers 期刊 2025 年 BCI 伦理分析进一步提出，脆弱人群知情同意和神经数据隐私值得担忧。


              竞争正在加速。Precision Neuroscience 已与 Medtronic 合作。Science Corporation 达到隐含 USD 1.5 billion 估值，BrainCo 达到 USD
              1.3 billion，Merge Labs 以 USD 850 million 估值出现。截至 2026 年中，没有任何 BCI 公司拿到永久植入式器械的 FDA PMA 批准。


              这家商业化前公司的收入为零。员工数、烧钱速度和财务数据均未公开披露。Oxley 关键人集中、无线神经器械带来的网络安全风险，以及未来支付方覆盖的不确定性，都是额外尽调项。
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO030
