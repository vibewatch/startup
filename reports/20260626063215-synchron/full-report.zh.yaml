      - number: '6.3'
        title: 支付方格局、覆盖缺口与留存类比
        blocks:
          - type: paragraph
            body: >-
              对一款患者主要是老年人或残障人士的植入式医疗设备而言，决定性客户是支付方，在美国就是 Centers for Medicare and Medicaid Services。多数 ALS 和重度瘫痪患者符合
              Medicare（包括 65 岁以下残障资格）或 Medicaid，因此需求由联邦覆盖政策决定，而不是患者支付意愿决定。截至 2026 年中，没有全国覆盖决定列明植入式脑机接口设备，也没有 BCI
              专用手术代码；这意味着即使 FDA 批准后，设备仍将面对一个单独、不确定且可能缓慢的覆盖流程。InsideBCI 于 2026 年 3 月 21 日发布的政策分析把这识别为结构性缺口：Medicare 没有
              BCI 植入专用路径；没有路径，获批后采用就取决于各承包商逐案裁定，而不是全国标准。LCD L33739 下的 SGD 覆盖框架提供了一个相关支付方参照——Synchron
              最终必须取得类似清晰的报销状态。Tobii Dynavox SGD 是患者当前使用的 incumbent 技术，支付方已为其建立覆盖先例；BCI
              必须满足更高的成本效益门槛。因此，客户关系的耐久性更应理解为覆盖耐久性，而不是传统留存：一旦有利的覆盖决定和手术代码形成，随着每年新诊断的合格患者需要设备，需求可以变得持久且重复；在此之前，没有可留存的经常性收入。次级支付方包括商业保险公司和
              Veterans Health Administration。
