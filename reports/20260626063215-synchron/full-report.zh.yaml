      - number: '8.4'
        title: 论点失效触发器与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              价格敏感建议只有配套可监控的论点失效触发器和具体尽调清单，才有用。thesis-break-and-kill-triggers 表把估值案例转成可衡量事件：关键性终点错失或重大延迟、获批后限定窗口内没有 CMS
              覆盖进展、runway 降至 12 个月以下且没有 term sheet、严重设备相关不良事件，或竞争对手取得决定性能力或监管领先。任一事件都会让公司被向下重新承销，多数还意味着 down
              round。上行侧，干净的关键性读出加可见报销进展，会支持在下一轮增加敞口。final-diligence-asks 表记录承销方在按当前标记或更高价格承诺前必须取得的材料：Series D term sheet
              和清算优先栈，用来理解隐含估值背后的真实每股经济性；runway 和 burn 披露，用来量化融资风险；关键性试验方案和任何中期安全数据；针对竞争对手专利格局的 freedom-to-operate 和 IP
              意见；以及包括任何 CMS 沟通在内的报销策略细节。每项问题都映射到负责人或尽调路径。由于 Synchron 公开层面拒绝披露 burn、单位经济性和详细 cap table，诚实的估值结论是：约 $1B
              隐含标记有合理性，也与同行一致，但没有这些披露无法独立验证，因此建议偏向跟踪并附条件，而不是不计价格地承诺。
