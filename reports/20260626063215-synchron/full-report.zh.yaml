              - CE009
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 患者群体与客户分层
        blocks:
          - type: paragraph
            body: >-
              Synchron
              的最终客户分成三类角色，而这三类很少由同一个人承担：接受植入的患者用户、购买并植入设备的医院，以及负责报销的支付方。患者用户分层由重度运动障碍但认知保留来定义——主要是肌萎缩侧索硬化症（ALS）、高位脊髓损伤伴四肢瘫痪、脑干卒中或闭锁综合征患者——设备为他们恢复数字通信和设备控制能力。在美国，这些群体合计规模可观（约
              34,700 名 ALS 存量患者、308,000 名创伤性脊髓损伤患者，以及估计 5.4 million
              名某种形式瘫痪患者），但血管解剖适合且运动皮层信号完整、真正适合植入的子集要小得多。设备仍处于研究性和商业化前阶段，因此 Synchron
              今天没有付费客户；当前可核验客户是临床试验参与者和支持试验的学术医学中心。除美国试验外，synchron.com/join 上的临床招募页面正在主动招募适合使用 Apple 设备的合格患者，确认 Apple
              生态兼容性已经成为面向患者的采用界面。因此，尽调真正需要看的客户分层，不是按收入加权的客户基础，而是临床和机构基础：哪些患者符合条件，哪些医院能植入，最终由哪个支付方付费。
