      - number: '3.6'
        title: 图表证据
        blocks:
          - type: callout
            title: 血管内递送是难以轻易复制的结构性差异
            body: >-
              植入式 BCI 领域没有竞争者采用血管内导管方案；所有直接对手都需要开颅。该差异创造了独立的植入手术专科（神经介入）、独立的医院科室流程（导管室 vs.
              神经外科手术室）以及独立的患者资格分层。复制这条路径需要多年导管工程、关于血管内路径的新临床证据体系，以及把血管内 BCI 确立为可信类别的监管工作。Synchron 从 2019 年首个人体 SWITCH
              研究起，在这条特定路径上已有 7 年领先。
            calloutType: strength
            claimRefs:
              - CP018
              - CP003
          - type: callout
            title: Precision Neuroscience 的 510(k) 滩头阵地在 PMA 前造成分发劣势
            body: >-
              Precision Neuroscience 的短期皮层记录 510(k) clearance，使其今天即可在神经外科中心部署 1,024 电极薄膜阵列。每一次部署都会训练一名医生、建立一套机构流程，并在
              Precision 与医院之间形成关系，影响 PMA 时的商业 BCI 平台选择。Synchron 的血管内神经介入流程需要不同医院科室和不同专科医生，因此可部分隔离于这种动态——但 Synchron 无法像
              Precision 通过 510(k) 部署那样，建立同类型的商业化前中心熟悉度。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP034
          - type: callout
            title: 16 通道限制是结构性信号保真度天花板
            body: >-
              Synchron 的判断是，在当前临床用例（二元运动意图到数字开关动作）中，安全性和部署简便性比通道数量更重要。这个判断对简单沟通和开关访问任务是自洽的。不过，随着 BCI
              应用走向更丰富的神经解码——连续光标控制、全词汇语音合成、复杂假肢控制——16 通道与 1,024 通道之间的性能差距，可能让更高价值应用在商业上不再适合 Synchron。Synchron San Diego
              中心秘密开发的下一代高通道经导管接口，是对冲该风险的方案，但它不是已交付产品。
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              Synchron 是一家收入前、商业化前医疗器械公司：它的 Stentrode 血管内脑机接口仍是研究性器械，受美国联邦法律限制仅可用于研究，因此截至 2026 年中，公司实际上没有产品收入。一旦获得 FDA
              上市前批准（PMA），拟定收入模型是院内植入式器械模式，并有三条可能收入流。第一条也是最大的一条，是可植入器械本身——Stentrode
              及其外部信号处理单元——销售给大学医学中心，并通过住院或门诊手术支付报销。第二条是植入手术经济性；Synchron 间接受益，因为可报销的 Category I 手术代码和有利的 Medicare
              覆盖决定，才会解锁器械销售；公司也可能争取 New Technology Add-On Payment（NTAP）来桥接早期报销。第三条更具猜测性，是与 Chiral 神经解码平台和 Apple / NVIDIA
              集成绑定的经常性软件、数据和临床支持服务，它可能把一次性硬件销售转成更长收入关系。Synchron
              未披露任何定价，因此标价、实际成交价和收入结构都未知。因此，变现模型更像其他植入式神经刺激业务（深部脑刺激、人工耳蜗），而不是软件或订阅模式；收入确认完全受监管批准和支付方覆盖卡口约束，而不只取决于销售执行。由于目前没有收入，本章所有以美元计价的数字都是估算或前瞻性构造，并会明确标注。
