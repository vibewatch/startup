  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与隐含估值
        blocks:
          - type: paragraph
            body: >-
              Synchron 2025 年 11 月的 Series D 是估值分析锚点。公司完成由 Double Point Ventures 领投的 $200 million 融资，使累计融资升至约 $345
              million；根据公司和独立报道，该轮隐含投后估值接近 $1 billion。这个数字是隐含标记，而不是披露倍数：Synchron 尚无收入，因此估值建立在由 FDA pre-market approval 和
              Medicare 覆盖卡住的概率加权未来现金流上，而不是当前财务。独立分析师追踪的二级市场活动也隐含了接近 Series D
              标记的价值，且据报交易有小幅溢价；这能提供佐证，但证据很薄。因此，我们的建议是价格敏感的「跟踪 /
              有条件参与」，而不是无条件买入：技术和临床记录可信，但估值依赖里程碑，下一轮融资会根据关键性试验结果重新定价。下方 recommendation-summary 和 thesis/anti-thesis
              表列出明确条件——干净的关键性读出和可见 CMS 覆盖进展会支持加码；错失终点、报销停滞或融资窗口关闭会打破论点。由于 Synchron
              是风险投资阶段医疗设备公司，合适方法是场景法和可比公司法，而不是基于虚假精确度的 DCF；隐含 $1B 标记应被视为宽分布中的 base case，而不是点估计。
