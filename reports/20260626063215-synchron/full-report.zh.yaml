      - number: '7.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 两个二元监管关口主导风险画像
            body: >-
              FDA PMA 批准和 Medicare 覆盖决定是两个不能保证、且顺序发生的关口。InsideBCI 2026 年 3 月分析把 Medicare 缺失 BCI
              覆盖路径识别为结构性缺口，短期没有可见补救方案。Precision Neuroscience 的 510(k) clearance 通过建立低风险 BCI 监管先例，进一步放大 CMS
              复杂性。任一关口失败或重大延迟，都会把一家临床可信公司转成搁浅资产风险，技术质量再高也无法抵消。
