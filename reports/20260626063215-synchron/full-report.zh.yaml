      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              测算机会必须使用多重视角，因为没有单一公开数字能隔离出 Synchron 实际服务的「面向瘫痪患者的血管内 BCI」细分市场。自上而下的分析师视角将整个全球 BCI 市场估为 2025 年约 USD 2.9
              billion、2026 年 USD 3.3 billion，并按 Precedence Research 数据，以约 16.8% 的复合年增长率增至 2035 年约 USD 13.9
              billion；MarketsandMarkets、SNS Insider 和 Fortune Business Insights 给出的轨迹也大体类似，均为双位数增长。不过，该数字包含非侵入式和研究型
              BCI，因此会高估 Synchron 可触达市场，同时低估可报销植入式平台的长期价值。自下而上的患者视角从疾病患病率出发：约 34,700 名美国人患有 ALS，约 308,000 人有创伤性脊髓损伤，约 5.4
              million
              人存在某种形式瘫痪，其中中风约占三分之一。真正适合植入的子集——重度上肢瘫痪或丧失语言能力、但运动皮层信号仍完整的人群——要小得多，美国可能在低数十万人级别，全球约为百万人量级。套用假设的器械加手术混合价格（Synchron
              未披露定价），可服务可获得市场（SAM）在总量上较大，但需要多年才能兑现，并取决于报销。获批后三到五年的可服务可获取市场（SOM）更窄：早期 PMA 适应症（可能是 ALS
              和重度瘫痪）、少数高量植入中心以及温和渗透率。因此，我们把 SAM 和 SOM 视为受证据约束的估算，而不是精确数字，并保留自上而下与自下而上视角之间的矛盾，将其作为尽调缺口。
