      - number: '1.2'
        title: 技术平台
        blocks:
          - type: paragraph
            body: >-
              Synchron 的旗舰产品是 Stentrode，一种血管内脑机接口。Stentrode 形似支架，由 16
              个电极组成，通过导管经颈静脉穿入血管，并固定在运动皮层邻近的脑静脉内。它部署在血管系统内，而不是脑组织表面或内部，因此避开了竞品神经植入物所需的开颅手术。临床试验中，该手术中位耗时 20
              分钟，采用标准神经介入技术。


              植入后，Stentrode
              记录代表运动意图的局部场电位，并无线传输至外部处理器。机器学习解码器将频段变化转换成数字运动输出（DMO），再映射为连接设备上的开关动作。整个系统完全内置，没有经皮导线，设计目标是长期稳定采集信号。


              Stentrode 体现了一个根本取舍：信号保真度换风险。16 个电极捕获的信号比 Neuralink N1 设备（1,024 个电极）更粗。Synchron
              的判断是，较低风险的导管方案在监管规模化上足以抵消电极数量劣势。


              2025 年宣布的三项软件和 AI 进展延展了平台。2025 年 1 月，公司与 NVIDIA Holoscan 平台合作，目标是在设备端部署边缘 AI，降低神经解码延迟。2025 年 3 月 NVIDIA
              GTC 上，Synchron 发布 Chiral，这是一个基于去标识化人类神经数据训练的认知 AI 大脑基础模型，目标是跨患者泛化解码；Chiral 属于研究路线图，不是已交付产品。2025 年 5 月 13
              日，Synchron 宣布将成为首家与 Apple BCI Human Interface Device（BCI HID）协议实现原生集成的 BCI 公司，让用户可用意念控制 iPhone、iPad 和
              Apple Vision Pro。


              下一代高通道全脑经导管接口正在 San Diego 中心秘密开发，由 Andy Rasdal 和 Mark Brister 牵头，约 20% 的 Series D 资金将投向该项目。
