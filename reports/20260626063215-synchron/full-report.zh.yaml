  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Synchron 的主导风险是监管：公司尚未完成关键性试验，也未取得 FDA pre-market approval（PMA），而获批是一个二元、不能保证的事件。FDA 自身 Breakthrough
              Devices Program 指南说明，designation 会加速审评，但不保证批准或报销。行业分析也确认，即便有 Breakthrough 身份，植入式 BCI 也没有快速 PMA
              路径——多年证据负担并未改变。叠加在获批风险之上的是报销风险：InsideBCI 2026 年 3 月分析指出，Medicare 缺少 BCI 覆盖路径；没有全国覆盖决定，也没有 BCI 专用手术代码。CMS
              针对语音生成设备的 LCD L33739 提供基线对照，但不覆盖 BCI。Precision Neuroscience 皮层 BCI 接口获得 FDA 510(k) clearance，形成竞争和监管
              wedge：它树立了低风险 BCI 元件可达到 510(k) 门槛的先例，会让 CMS 是否愿意覆盖更高风险、植入式 Stentrode 的判断更复杂。法律风险当前可见度低，但结构上重要：Synchron
              Australia 的专利组合可在 Google Patents 上看到，但其相对 Neuralink、Precision 和其他申请方的 freedom-to-operate 分析尚未被独立确认。HIPAA
              以及新兴 neurorights 法规下的神经数据会产生合规风险，而披露不足。报销开始后，上市后义务（MAUDE 报告、QSR、反回扣）都会适用。
