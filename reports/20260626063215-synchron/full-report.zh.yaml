companyProfile:
  summary: >
    Synchron 是一家创立于 Melbourne、总部位于 New York 的神经技术公司，正在开发 Stentrode——一种 16 电极血管内脑机接口，经颈静脉植入，在不做开颅手术的情况下抵达运动皮层。公司由 CEO
    Thomas Oxley M.D. Ph.D. 与联合创始人 Nicholas Opie Ph.D. 于 2016 年从 University of Melbourne 的 Vascular Bionics Laboratory
    孵化成立。Synchron 于 2020 年 8 月获得 FDA Breakthrough Device Designation，并于 2021 年 7 月拿到美国首个永久植入式 BCI 的 IDE。SWITCH 研究（4
    名患者，JAMA Neurology 2023）和 COMMAND 早期可行性试验（6 名患者，2024 年 9 月达到主要终点）证明，重度运动瘫痪患者（ALS、脊髓损伤、中风）在 12 个月内具备安全性，并可控制数字设备。2025
    年 11 月，Synchron 完成由 Double Point Ventures 领投的 $200M Series D，累计融资增至 $345M，隐含估值超过 $1B，成为 Neuralink 之后第二家跨过该门槛的 BCI
    公司。公司正准备 2026 年关键性试验，目标是 FDA PMA；同时已宣布与 Apple（BCI-HID 协议，2025 年 5 月）和 NVIDIA（Holoscan 边缘 AI，2025 年 1 月）集成，并推出自有
    Chiral 神经解码基础模型（2025 年 3 月）。
