      - number: '7.5'
        title: 财务、执行与资本市场风险
        blocks:
          - type: paragraph
            body: >-
              对一家尚无收入、资本密集的设备公司而言，财务风险是结构性的。SEC EDGAR 对 Synchron Inc 的 Form D 检索确认了私募融资轮次，但不披露 burn rate、runway
              或详细资金用途——这是重大财务尽调缺口。公司已融资 $345M、没有收入，若在获批加报销前耗尽资本，就是核心财务风险。Riki Banerjee 于 2024 年 1 月获任 CTO，负责技术爬坡，Andy
              Rasdal 于 2023 年 12 月加入董事会，带来 PMA /
              商业化经验，这部分缓释了关键人风险；但公开招聘页面显示公司仍在商业、监管和工程岗位上活跃招聘——说明商业组织仍在与关键性试验执行同步搭建。NeuroTechX awesome-bci GitHub 目录可作为
              BCI 开发者生态薄且碎片化的 proxy，限制获批后第三方集成社区深度和商业速度。报道中的 $1B+
              隐含估值设定了较高门槛；若批准延迟或报销费率偏弱，未来融资条款会承压。mitigation-and-kill-criteria 表把这些风险转成可监控触发器：关键性读出、CMS 覆盖信号、runway
              披露和关键人留任。
