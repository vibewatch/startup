      - number: '7.2'
        title: 临床安全与耐久性风险
        blocks:
          - type: paragraph
            body: >-
              临床安全风险是植入式脑设备的内生风险。ClinicalTrials.gov 上登记了四项试验——COMMAND（NCT05035823）、澳大利亚
              SWITCH（NCT03834857）以及另外两项活跃试验（NCT07543367、NCT07533903）——说明项目在扩张，也带来同步入组风险。MassDevice 报道 SWITCH 12
              个月安全性结果为正面，但 n 很小，因此长期耐久性、多年信号稳定性和罕见不良事件尚未在商业规模下建立。唯一慢性稳定性证据是一篇预印本（PubMed PMID
              41040697），作者与公司有关联并披露利益冲突；尚未经过同行评议，证据权重受限。首个居家使用案例的同行评议论文（PMID 33115813）证明技术可行，但对耐久性预测的可泛化性很小。Nature
              Reviews Bioengineering 指出植入式 BCI
              试验存在系统性障碍——合格人群小、知情同意复杂、所需随访长、植入基础设施有限——这些都会直接提高单项试验错失终点的风险。血管内设计引入血管特有失效模式，包括血栓、设备迁移和狭窄，并需要抗血小板管理。这些风险已在运营风险登记表中排序。
