      - number: '8.3'
        title: 场景、价值驱动因素与回报区间
        blocks:
          - type: paragraph
            body: >-
              估值分布很宽且由里程碑驱动，因此我们把它框定为与明确假设绑定的 bull、base 和 bear 三种场景。Bull case 下，干净的关键性读出、FDA PMA 和有利 CMS
              覆盖加专用手术代码，会支撑估值显著高于当前标记；公司接近商业收入，并按获批设备经济性重新定价。Base case 让约 $1B
              隐含标记大致持平到小幅上行，反映临床持续推进，但报销未解、仍无收入，且获批前至少还需要一轮稀释性融资。Bear case——关键性终点错失或延迟、报销停滞，或融资窗口关闭——意味着 down round
              和实质估值受损。主要价值驱动因素与风险章节识别的关口相同：关键性试验成功、报销覆盖、制造和质量爬坡、Apple 和 NVIDIA 集成带来的日常可用性
              moat，以及可服务瘫痪人群规模。估值敏感性图按每项驱动因素对结果的影响排序，其中批准概率和报销费率占主导；回报区间图在明确稀释假设下，把场景转译成低 / 中 /
              高估值结果。公司尚无收入，因此回报高度凸性且二元：大部分期望价值都在获批加覆盖路径上，这正是建议绑定可监控里程碑、而不是无条件给出的原因。
