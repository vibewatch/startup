    type: stack
    layout: standard
    summary: Synchron 系统的五层视图：从植入式电极阵列，到信号中继、边缘 AI 解码、BCI-HID 集成，再到原生设备输出。
    approximationNotes: 层级描述反映公司和合作伙伴的技术表述；信号延迟和吞吐量未公开说明。
    claimRefs:
      - CE002
      - CE004
      - CE007
      - CE008
    data:
      layers:
        - label: 输出 / 控制层
          detail: 通过原生 BCI-HID 输入事件驱动 iPhone / iPad / Apple Vision Pro
        - label: 集成层
          detail: Apple BCI-HID 协议驱动，把解码后的意图映射为 OS 输入
        - label: 解码 / AI 层
          detail: Chiral 神经解码基础模型跑在 NVIDIA Holoscan 低延迟边缘 AI 上
        - label: 信号中继层
          detail: 胸内遥测单元（无线）+ 外部处理单元
        - label: 感知 / 植入层
          detail: 16 电极 Stentrode，位于毗邻运动皮层的上矢状窦
