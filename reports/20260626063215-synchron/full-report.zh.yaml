      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              对一家尚无收入的 BCI 公司，相对估值是最有防御性的视角，可比集合横跨私有 BCI 同行和公开神经科技 benchmark。Neuralink 是按技术类别最接近的 BCI 同行，但估值高出 Synchron
              数倍：有报道称其目标私有估值约 $9 billion，尽管该水平的已关闭融资并未被一致确认，因此 headline peer mark 本身也不确定。美国皮层表面竞争对手 Precision
              Neuroscience 更早期、规模更小，据报投后讨论处于数亿美元区间，使 Synchron 位于私有 BCI 光谱中 Neuralink 与 Precision 之间。Paradromics 和
              Blackrock Neurotech 提供方向性私有可比，但披露很少。公开市场一侧，ONWARD Medical 提供一个上市植入式神经科技参照，市值远小；Medtronic
              则锚定成熟设备估值光谱的末端，市值超过 $100 billion，只适合作为终局 benchmark，而不是阶段匹配可比。可比估值表列出这些同行及其指标、报告值、相关性和明确限制；由于多数标记是私有、未确认或
              modality 不匹配，该表天然不完整，下方 evidence gap 记录了哪些披露可以收紧分析。关键结论是，Synchron 约 $1B 隐含估值与私有 BCI 同行集合内部一致——显著低于
              Neuralink，高于 Precision——但每项比较都有 modality 或阶段限制，精确度受限。
