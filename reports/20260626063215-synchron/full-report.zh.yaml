      - number: '3.4'
        title: 转换成本、锁定、多归属与分发
        blocks:
          - type: paragraph
            body: >-
              永久植入式 BCI 的转换成本因产品性质而极高。植入 Stentrode 的患者无法同时植入 Neuralink
              N1；对颅内植入物来说，多归属在物理上不可能，对血管内植入物也高度不可能。一旦器械植入，患者层面就形成完全单一供应商锁定——患者、临床团队和护理者都会围绕一个平台建立流程、训练和器械熟悉度。

              医生和中心锁定发生在机构层面。接受 Precision Layer 7 阵列植入培训的神经外科医生，会围绕该器械形成手术熟悉度和机构流程。Synchron
              的神经介入流程是一套不同技能（基于导管，在神经介入室而非神经外科手术室完成）——这使它部分隔离于 Precision 的外科中心滩头阵地，但也要求 Synchron 从零搭建自己的合格中心网络。

              Apple BCI-HID 集成是一项分发护城河资产。Apple 原生 BCI-HID 协议把 BCI 嵌入 iOS、iPadOS 和 visionOS，成为一等输入方式；因此，每次加深 BCI HID
              能力的软件更新都会自然利好 Synchron 平台。随着 Apple 生态优势复利，那些需要自定义软件桥接的竞争 BCI 公司，在面向消费者用例上处于结构性劣势。

              截至 2026 年 6 月，供应链和制造准入并非公开差异化点；所有竞争者都还在临床试验规模制造。在 PMA 获批并建立 National Coverage Determination 之前，任何永久植入式 BCI
              都无法获得支付方分发（医院合同、保险覆盖），这意味着截至 2026 年中，所有植入式 BCI 竞争者的分发力量实际上都为零。
            claimRefs:
