      - number: '4.2'
        title: 成本结构、毛利与单位经济
        blocks:
          - type: paragraph
            body: >-
              Synchron
              的成本结构主要由研发、临床试验运营，以及推进关键性试验所需的工程和科研团队驱动；制造规模还很小，仍停留在临床级，不是成本主因。和其他植入式神经设备公司一样，一旦放量，设备本身的长期毛利率预计会很高（植入式神经刺激硬件历史上设备毛利较强），但在形成销量之前，这个毛利没有实际意义；早期每例植入的经济性会很差，因为固定的临床、监管和质量成本只能摊到少数研究性植入上。因此，今天的单位经济性最好描述为尚未定义：没有平均售价，没有公开
              COGS，也没有传统意义上的 CAC，因为「销售」由医院和支付方居中完成，而不是直接销售团队完成。真正需要向前看的单位经济性，是设备加手术价格（未披露）、临床到商业阶段 Stentrode
              的制造成本（未披露）、关键性试验的单患者成本（行业内植入式神经设备关键性试验总体通常达到数千万美元量级），以及获批后长期支持每位植入患者的成本。相对重资本硬件公司，营运资本和 capex
              较轻，因为设备很小，并且靠既有的导管介入流程植入；但制造爬坡、质量体系搭建和商业销售团队会在上市时大幅推高成本。下方每个空值的单位经济字段都对应一个具体尽调问题，因为核心财务证据缺口不是数字披露后偏弱，而是这些数字本身缺失。
