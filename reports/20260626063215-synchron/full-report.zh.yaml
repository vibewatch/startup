      - number: '7.3'
        title: 供应链、运营与制造风险
        blocks:
          - type: paragraph
            body: >-
              供应链风险集中在 Synchron 对 ACQUANDAS 的依赖上。Synchron 于 2024 年 1 月收购 ACQUANDAS 股权（BusinessWire），以锁定 Stentrode
              关键基材薄膜电极制造。MassDevice 确认了这笔股权投资，并将其描述为锚定供应商的动作。这造成薄膜电极组件的单一供应商集中度，且没有公开确认的第二来源或连续性计划。从临床级制造爬坡到 ISO 13485 和
              FDA QSR 下的商业化生产，是设备公司常见失败点。Australia's National Reconstruction Fund（NRF）AUD 54M 投资同时锚定澳大利亚的 R&D
              和制造，带来地理集中和外汇敞口。ACQUANDAS 依赖与澳大利亚制造枢纽叠加，把关键组件供应和制造 R&D
              集中在单一非美国司法辖区——形成复合的地缘政治和供应风险。联网脑机植入体的网络安全风险也正成为更大的监管和运营担忧；FDA 期待联网设备安全的全生命周期管理。
            claimRefs:
              - CR014
              - CR015
