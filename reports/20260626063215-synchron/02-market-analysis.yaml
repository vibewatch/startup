  evidenceStrategy:
    - >-
      Market data from analyst reports, government/industry statistics, filings, trade associations,
      public-company disclosures.
    - >-
      Buyer/budget evidence from procurement pages, customer case studies, public budgets, job
      postings, reimbursement data.
    - >-
      Disconfirming evidence from slowdown reports, failed pilots, regulatory bottlenecks,
      saturation, contrary estimates.
  qualityBar:
    - Define the market boundary before sizing it.
    - Tie drivers and constraints to adoption timing, budget owner, and valuation relevance.
    - Do not rely on one generic TAM estimate or call the market large without boundary logic.
    - If SAM/SOM cannot be isolated, preserve failed sizing paths and diligence asks.
sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >-
      Synchron competes in the implantable brain-computer interface (BCI) market — medical devices
      that read neural signals and translate intention into digital control for people who have lost
      motor or speech function. The relevant boundary is the clinical, invasive/endovascular BCI
      segment used to restore digital agency for severe paralysis, not the broader category that
      also counts non-invasive consumer EEG headsets, neurofeedback wellness gadgets, or
      research-only laboratory rigs. Included spend is the implant device, the implantation
      procedure (a roughly 20-minute endovascular deployment via the jugular vein for the
      Stentrode), the external signal-processing unit, software, and ongoing clinical support.
      Excluded spend covers deep brain stimulation for Parkinson's, cochlear implants, and assistive
      augmentative communication (AAC) tools such as eye-tracking tablets, which address overlapping
      users but through different mechanisms. The status-quo substitutes a buyer can choose instead
      of a BCI are exactly these AAC and caregiver-mediated communication methods, plus doing
      nothing. Because no implantable BCI has yet received FDA pre-market approval or a national
      reimbursement code, the present market is pre-commercial: revenue today is effectively zero
      and the addressable market is a forward-looking construct gated by regulatory approval and
      payer coverage. Defining the boundary this tightly matters because headline BCI market figures
      blend consumer and medical categories that grow at very different rates and carry very
      different adoption barriers.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
    figureRefs: []
  - id: market-sizing
    title: 'Market Sizing: TAM, SAM, and SOM'
    body: >-
      Sizing the opportunity requires multiple lenses because no single published figure isolates
      the endovascular-BCI-for-paralysis segment Synchron actually serves. The top-down analyst lens
      values the entire global BCI market at roughly USD 2.9 billion in 2025 and USD 3.3 billion in
      2026, scaling to about USD 13.9 billion by 2035 at a compound annual growth rate near 16.8
      percent per Precedence Research, with MarketsandMarkets, SNS Insider, and Fortune Business
      Insights publishing broadly similar double-digit trajectories. However, that figure includes
      non-invasive and research BCIs, so it overstates Synchron's reachable market while
      understating the long-run value of a reimbursed implantable platform. The bottom-up patient
      lens starts from disease prevalence: approximately 34,700 Americans live with ALS, about
      308,000 with traumatic spinal cord injury, and roughly 5.4 million with some form of
      paralysis, of which stroke causes about a third. The implant-eligible subset — people with
      severe upper-limb paralysis or loss of speech who retain intact motor cortex signaling — is
      far smaller, plausibly in the low hundreds of thousands in the US and on the order of a
      million globally. Applying a hypothetical blended device-plus-procedure price (Synchron has
      not disclosed pricing) yields a serviceable addressable market (SAM) that is large in
      aggregate but realizable only over many years and contingent on reimbursement. The serviceable
      obtainable market (SOM) over the first three to five years post-approval is much narrower: an
      initial PMA indication (likely ALS and severe paralysis), a handful of high-volume implanting
      centers, and modest penetration. We therefore treat the SAM and SOM as evidence-constrained
      estimates, not precise figures, and preserve the contradictions between the top-down and
      bottom-up lenses as a diligence gap.
    claimRefs:
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM002
    figureRefs:
      - FM001
      - FM002
  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      The economic structure of this market separates the user, the buyer, and the payer, which is
      decisive for adoption timing. The user is the patient with severe motor impairment — segmented
      into ALS, spinal cord injury (especially tetraplegia), and stroke or locked-in syndrome
      populations — together with the caregiver who supports daily device use. The buyer is the
      hospital, specifically academic medical centers with interventional neurology and neurosurgery
      programs such as Mount Sinai, UPMC, and the University at Buffalo where Synchron's COMMAND
      trial ran; these institutions own the capital budget and the clinical workflow for
      implantation. The payer is overwhelmingly the government: most ALS and severe-paralysis
      patients in the US are covered by Medicare (including under-65 disability eligibility) or
      Medicaid, making the Centers for Medicare & Medicaid Services the gatekeeper of demand. Budget
      ownership therefore sits across two desks — the hospital's device and procedure budget, which
      is only unlocked once a reimbursement pathway exists, and the federal payer's coverage
      determination. The adoption trigger for each segment is the combination of an FDA-approved
      indication, an established procedure and device reimbursement code (for example a Category I
      CPT code and a favorable national or local coverage determination), and clinical-pathway
      integration so that neurologists refer eligible patients to implanting centers. Private
      insurers and the Veterans Health Administration (relevant for spinal-cord-injured veterans)
      form secondary payer segments. Because the patient does not pay directly and the prescriber,
      implanter, and payer are different actors, Synchron's go-to-market is a multi-stakeholder
      reimbursement and clinical-adoption problem rather than a conventional sales motion.
    claimRefs:
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
    tableRefs:
      - TM003
    figureRefs:
      - FM003
  - id: drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >-
      Several structural drivers favor the market. An aging population is increasing the absolute
      number of ALS and stroke survivors; the broader BCI market's high-teens CAGR reflects rising
      investment and clinical validation; and Synchron's ecosystem partnerships — native Apple
      BCI-HID integration announced in 2025 and an NVIDIA Holoscan edge-AI collaboration — lower the
      integration cost of turning neural signals into everyday device control, expanding perceived
      utility. Regulatory tailwinds matter too: FDA Breakthrough Device Designation and the first
      IDE for a permanently implanted BCI give Synchron a clearer path and potential reimbursement
      add-ons such as new technology add-on payments. The constraints, however, are formidable and
      largely gate timing rather than ultimate size. The single largest is reimbursement: as of
      mid-2026 there is no Medicare national coverage determination for implantable BCIs, so even an
      approved device has no guaranteed payment, and the GAO and independent commentators flag
      reimbursement and demonstrated long-term benefit as unresolved. Regulatory risk is real
      because Synchron must still complete a pivotal trial and win PMA. Capital intensity is high —
      medical-device commercialization, sales infrastructure, and multi-year trials require
      sustained funding against the USD 345 million raised to date. Switching costs and trust
      barriers also slow adoption: an implant is irreversible relative to an eye-tracker, raising
      the clinical evidence bar, and the 16-electrode endovascular design trades signal bandwidth
      for safety, which competitors with higher channel counts attack. Net, the drivers expand the
      long-run ceiling while the constraints push meaningful revenue years into the future and make
      payer engagement the rate-limiting step.
    claimRefs:
      - CM019
      - CM020
      - CM021
      - CM022
      - CM023
      - CM024
      - CM025
    tableRefs:
      - TM004
    figureRefs:
      - FM004
  - id: landscape-adjacencies
    title: Market Landscape and Adjacencies
    body: >-
      Synchron sits inside a fast-forming implantable-BCI landscape and adjacent to several
      established neurotechnology markets that shape buyer expectations and reimbursement precedent.
      Within implantable BCI, the direct field includes intracortical approaches (Neuralink, with
      far higher electrode counts) and cortical-surface arrays (Precision Neuroscience), plus
      well-capitalized entrants such as Science Corporation and legacy players like Blackrock
      Neurotech; competitive dynamics are analyzed in the competitors chapter, but for market
      purposes their fundraising and clinical milestones validate buyer and investor appetite for
      the category. Adjacent markets provide both substitutes and reimbursement analogs. Deep brain
      stimulation, dominated by Medtronic, demonstrates that an implantable neuro device can achieve
      durable Medicare coverage and multi-billion-dollar revenue, offering a template Synchron's
      payer strategy can follow. Cochlear implants similarly show how a sensory neuroprosthetic
      crossed from investigational to standard-of-care with established codes. On the substitute
      side, the assistive-technology and AAC market — eye-tracking communication tablets and
      switch-access devices — is the realistic status-quo alternative for most paralyzed patients
      today; it is cheaper and non-invasive but slower and more limited, which frames Synchron's
      value proposition as restoring higher-bandwidth, hands-free digital control. The non-invasive
      consumer BCI segment grows faster in unit terms but addresses wellness and gaming rather than
      clinical restoration, so it is adjacent rather than competitive. Overall, the landscape is
      early, capital-rich, and clinically unproven at commercial scale, meaning market structure —
      not just product — will determine which players convert addressable demand into reimbursed
      revenue.
    claimRefs:
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
    tableRefs: []
    figureRefs: []
