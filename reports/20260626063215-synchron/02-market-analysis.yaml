callouts:
  - calloutType: insight
    title: Reimbursement, not addressable population, is the binding market constraint
    body: >-
      The bottom-up patient pool is large enough to support a multi-billion-dollar long-run market,
      but with no Medicare national coverage determination for implantable BCIs as of mid-2026,
      near-term realizable demand is gated by payer policy and FDA approval rather than by the
      number of eligible patients.
    claimRefs:
      - CM010
      - CM022
      - CM023
  - calloutType: risk
    title: Headline BCI market figures overstate Synchron reachable share
    body: >-
      Published BCI TAM figures near USD 3.3B blend consumer, research, and non-invasive products
      that Synchron does not sell. Using them uncritically would inflate the serviceable market; the
      clinical implantable subset is materially smaller and unproven at commercial scale.
    claimRefs:
      - CM006
      - CM008
      - CM029
