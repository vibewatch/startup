chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Synchron sells into a pre-commercial implantable brain-computer interface market: published
    global BCI figures near USD 3.3 billion in 2026 blend consumer and clinical products, while a
    bottom-up view of severe-paralysis prevalence (about 34,700 ALS, 308,000 spinal cord injury, and
    5.4 million total paralysis patients in the US) implies a large but reimbursement-gated
    serviceable market. The binding constraint is not addressable population but FDA approval and
    the absence of a Medicare coverage determination for implantable BCIs.
  contentRequirements:
    - Market boundary, included/excluded spend, adjacencies, and status-quo substitutes.
    - TAM/SAM/SOM or evidence-constrained sizing using multiple lenses, not one broad estimate.
    - Buyer/user/payer segmentation with budget ownership and adoption path.
    - >-
      Growth drivers and adoption constraints (regulation, switching cost, ROI, trust, capital
      intensity).
    - Sizing/adoption diligence gaps and contradictory estimates preserved.
  plannedTables:
    - name: Market definition table
      requirement: segment/category, included spend, excluded spend, buyer/payer, relevance.
    - name: TAM/SAM/SOM or sizing lens table
      requirement: publisher, year, geography, value, CAGR, methodology, confidence, limitation.
    - name: Segment / buyer map
      requirement: segment, buyer, user, payer, workflow, budget owner, adoption trigger.
    - name: Growth drivers and constraints table
