  evidenceGaps:
    - id: GM001
      title: Implant-eligible fraction of the paralysis population is not precisely known
      type: missing-source
      severity: material
      topic: market-sizing
      description: >-
        Total prevalence of ALS, SCI, and stroke paralysis is documented, but the subset with intact
        cortical signaling and suitable vascular anatomy for an endovascular implant is not
        published.
      missingEvidence: >-
        A peer-reviewed or company estimate of the implant-eligible fraction of severe paralysis
        patients.
      relatedQuestionRefs:
        - QM009
        - QM024
      relatedTableRefs:
        - TM002
      diligencePath: >-
        Request Synchron internal addressable-market analysis; review clinical eligibility criteria
        from COMMAND/pivotal protocols.
      whyItMatters: >-
        The eligible fraction, not total prevalence, determines the realistic SAM and therefore the
        valuation-relevant revenue ceiling.
    - id: GM002
      title: Synchron device and procedure pricing undisclosed
      type: private-evidence-only
      severity: material
      topic: market-sizing
      description: >-
        Synchron has not disclosed the expected device price or procedure reimbursement, so
        dollar-denominated SAM and SOM cannot be computed precisely.
      missingEvidence: Disclosed or modeled device + procedure price and target reimbursement level.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002
      diligencePath: >-
        Request pricing assumptions from Synchron; benchmark against DBS and cochlear implant
        reimbursement.
      whyItMatters: >-
        Price is the multiplier converting eligible patients into market value; without it, sizing
        remains directional only.
    - id: GM003
      title: Contradictory BCI market estimates across analysts
      type: conflicting-data
      severity: minor
      topic: market-sizing
      description: >-
        Published 2026 BCI market values differ across Precedence, SNS Insider, and Fortune Business
        Insights despite similar growth rates.
      missingEvidence: >-
        A reconciled, methodology-transparent market model isolating the clinical implantable
        subset.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM002
      diligencePath: >-
        Compare analyst methodologies and segment definitions; commission a bottom-up clinical-BCI
        model.
      whyItMatters: Reconciling the estimates is needed before any single TAM figure can anchor a valuation.
    - id: GM004
      title: Near-term penetration rate for the first PMA indication is unproven
      type: missing-source
      severity: material
      topic: market-sizing
      description: >-
        No evidence establishes how quickly implanting-center capacity and referral pathways will
        convert eligible patients after approval.
      missingEvidence: Capacity and ramp data from analog device launches or Synchron commercial plan.
      relatedQuestionRefs:
        - QM024
      relatedTableRefs:
        - TM002
      diligencePath: Model center capacity and referral conversion; benchmark DBS launch ramp.
      whyItMatters: >-
        Penetration speed drives the SOM and the time-to-revenue that underpins the Series D
        valuation.
