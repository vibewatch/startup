  topStrengths:
    - 唯一获 FDA IDE 批准的血管内 BCI——绕开开颅，大幅压低外科风险，也扩大合格患者和可操作外科医生人群
    - COMMAND 试验达到主要终点（September 2024）：六名患者实现独立控制数字设备，证明已经具备进入关键性试验的准备度
    - Apple BCI-HID 原生集成（May 2025）与 NVIDIA Holoscan 边缘 AI 平台合作（January 2025），验证平台具备商业级部署基础
    - >-
      Series D（$200M，November 2025）由 Double Point Ventures 领投（TechBio 有 14-IPO 记录），主权资金（NRF Australia、Qatar Investment
      Authority）和美国情报体系 VC（IQT）参投
    - >-
      商业化团队配置顶级：Andy Rasdal（前 DexCom CEO，带过 FDA PMA 和 NASDAQ IPO）任 Chief of Staff；Mark Brister（450+ 项专利、100+ 次产品发布，曾任职
      Medtronic / Guidant / DexCom）任 VP R&D
    - 源自 Australia 的神经技术已获得美国两党政府兴趣（GAO BCI 报告、IQT 投资），未来可能切入政府采购和国防场景
  topRisks:
    - 关键性试验主要终点失败，或出现患者安全信号，都会让 PMA 路径停摆；考虑到重启资金强度，公司大概率承受不起
    - CMS 报销决定就是商业化闸门：如果植入手术拿不到有利编码和支付，即便 FDA 批准，医院采用也会很低
    - 电极数量差距（16 vs 皮层内 1,024）限制信号保真度和用例宽度；Synchron 推进关键性试验期间，Neuralink 扩大的试验可能在可行性准备度上反超
    - 临床阶段烧钱速度（估计约 $50-80M/year）叠加零商业收入，让公司依赖持续股权融资；已融 $345M 必须同时撑住关键性试验和商业化前建设
    - 关键人物风险集中在 CEO Thomas Oxley 身上；尚未看到同等血管内 BCI 领域专家作为接班候选人
    - CMS 对 BCI 报销格局尚未定型：血管内神经植入没有现成 CPT/APC 编码；医院支付不确定性会让 FDA 批准后的采用继续延后
  unresolvedGaps:
    - 关键性试验方案细节尚未公开，包括主要终点定义、入组标准、中心数量、患者数和数据读出时间表
    - CMS 报销策略、编码谈判状态和付款方沟通时间表都未公开；商业可行性完全押在有利报销结果上
    - 股权结构表、Series D 投后估值（精确数字）和投资人经济权利（清算优先权、反稀释）均未公开
    - 烧钱速度、分职能员工数、现金跑道和部门预算分配均未披露；财务韧性评估只能参考可比医疗器械公司基准
    - Chiral AI 神经解码模型的训练数据来源、患者同意框架和独立性能验证尚未发布
