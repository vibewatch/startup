summary:
  headline: >
    Synchron 已经跨过可行性试验主要终点这一关键临床去风险节点，也成为唯一一条有清晰 FDA PMA 路径的血管内 BCI。微创路径绕开开颅这道脑植入采用门槛，Apple 与 NVIDIA 集成则把平台推向商业级部署。$200M
    Series D 和隐含 $1B+ 估值已经把关键性试验跑通计入价格；一旦关键性终点失败，或 CMS 报销拿不下来，公司生存都会被击穿。对能接受多年医疗器械周期的投资人，这是高确信度观察标的。
