runDate: '2026-06-26'
company:
  name: Synchron
chapter:
  order: 4
  key: financials
  letter: I
  number: 4
  title: Financials
  summary: >-
    Synchron is a pre-revenue medical-device company that has raised about USD 345 million, most
    recently a USD 200 million Series D in November 2025 led by Double Point Ventures. It has no
    product revenue, no disclosed pricing, and no disclosed burn or runway; the path to first
    revenue is gated by FDA PMA approval and a not-yet-established Medicare reimbursement pathway.
    Estimated annual burn of USD 40-120 million implies a roughly two-to-four-year runway, but the
    absence of disclosed cash, burn, margin, and pricing is the central financial-evidence gap for
    underwriting.
  contentRequirements:
    - Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
    - GTM motion and sales-efficiency proxies (cycle, CAC/payback or proxy, channel economics).
    - Cost structure, gross-margin drivers, working capital, capex, and service-delivery costs.
    - Public traction (revenue, ARR, units, locations) versus private-metric gaps.
    - >-
      Capital adequacy and financing dependency: cash, burn, runway, use of funds, next-round
      trigger.
    - Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
  plannedTables:
    - name: Revenue streams table
      requirement: stream, mechanism, unit, current value/status, quality, diligence ask.
    - name: Pricing / monetization table
      requirement: price/unit/contract, list vs realized pricing, discounts/unknowns, source.
    - name: Unit economics table
      requirement: metric, value/null, confidence, why it matters, diligence ask.
    - name: Capital adequacy table
      requirement: cash on hand, monthly burn, runway months, use of funds, next-round trigger, debt.
    - name: Public financial gaps table
      requirement: missing private metrics, impact, exact diligence path.
  plannedFigures:
    - name: Revenue model bridge
      acceptedTypes:
        - flow
        - waterfall
      requirement: How customer activity converts into revenue and gross profit.
    - name: Unit economics bridge
      acceptedTypes:
        - flow
      requirement: Use inputs when available; otherwise qualitative nodes with approximationNotes.
    - name: Financial estimate range
      acceptedTypes:
        - range
      requirement: Revenue, burn, runway, margin, or valuation-input ranges with source-backed bounds.
    - name: Capital intensity / cash-flow map
      acceptedTypes:
        - flow
        - matrix
        - waterfall
      requirement: Capex, inventory, project finance, manufacturing scale-up, or credit exposure.
  evidenceStrategy:
    - >-
      Revenue/pricing from official pricing, investor announcements, and reimbursement data; none
      currently disclosed by Synchron.
    - >-
      Capital adequacy from latest reported raise, use-of-funds coverage, and category burn
      benchmarks.
    - >-
      Adverse checks for burn, reimbursement risk, and the gap between approval and capital
      exhaustion.
  qualityBar:
    - >-
      Separate list pricing, company-claimed traction, corroborated metrics, estimates, and
      unavailable private data.
    - >-
      Do not force SaaS or marketplace metrics; the revenue mechanism is implantable hardware plus
      reimbursement.
    - Reference the funding chronology from Company Overview without copying its claim ids.
    - Every null unit-economics field carries a specific diligence request.
sections:
  - id: revenue-model
    title: Revenue Model and Monetization
    body: >-
      Synchron is a pre-revenue, pre-commercial medical-device company: its Stentrode endovascular
      brain-computer interface remains an investigational device limited by US federal law to
      investigational use, so the company books effectively no product revenue as of mid-2026. The
      intended revenue model, once an FDA pre-market approval (PMA) is secured, is a hospital-based
      implantable-device model with three plausible streams. The first and largest is the
      implantable device itself — the Stentrode plus its external signal-processing unit — sold to
      academic medical centers and reimbursed under inpatient or outpatient procedure payment. The
      second is the implantation procedure economics, where Synchron benefits indirectly because a
      reimbursed Category I procedure code and a favorable Medicare coverage determination are what
      unlock the device sale; the company may also pursue a New Technology Add-On Payment (NTAP) to
      bridge early reimbursement. The third, more speculative stream is recurring software, data,
      and clinical-support services tied to the Chiral neural-decoding platform and Apple/NVIDIA
      integrations, which could convert a one-time hardware sale into a longer revenue relationship.
      Synchron has not disclosed any pricing, so list price, realized price, and revenue mix are all
      unknown. The monetization model therefore resembles other implantable neurostimulation
      businesses (deep brain stimulation, cochlear implants) rather than a software or subscription
      model, and revenue recognition will be gated entirely by regulatory approval and payer
      coverage rather than by sales execution alone. Because no revenue exists yet, every figure in
      this chapter that is dollar-denominated is an estimate or a forward construct, explicitly
      labeled as such.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure
    title: Cost Structure, Margins, and Unit Economics
    body: >-
      Synchron's cost structure is dominated by research and development, clinical-trial operations,
      and the engineering and scientific headcount needed to advance toward a pivotal trial — not by
      manufacturing scale, which remains small and clinical-grade. Like other implantable
      neuro-device makers, the long-run gross margin on the device itself is expected to be high
      once at scale (implantable neurostimulation hardware historically carries strong device
      margins), but that margin is irrelevant until volumes exist, and early per-implant economics
      will be poor because fixed clinical, regulatory, and quality costs are spread over a handful
      of investigational implants. The unit economics today are therefore best described as
      undefined: there is no average selling price, no published cost of goods, and no
      customer-acquisition cost in a conventional sense because the "sale" is mediated by hospitals
      and payers rather than a direct salesforce. The relevant forward unit economics are the
      device-plus-procedure price (undisclosed), the cost to manufacture a clinical-then-commercial
      Stentrode (undisclosed), the cost per patient to run the pivotal trial (industry pivotal
      trials for implantable neuro devices commonly run on the order of tens of millions of dollars
      in aggregate), and the post-approval cost to support each implanted patient over time. Working
      capital and capex are modest relative to capital-intensive hardware businesses because the
      device is small and implanted via an existing catheter-based workflow, but manufacturing
      scale-up, quality-system build-out, and a commercial salesforce will raise costs sharply at
      launch. Each null unit-economics field below carries a specific diligence ask, because the
      absence of these numbers — not a disclosed-but-weak number — is the core financial-evidence
      gap.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: capital-adequacy
    title: Capital Adequacy, Burn, and Runway
    body: >-
      Synchron has raised approximately USD 345 million in total equity financing across its rounds,
      most recently a USD 200 million Series D announced on November 6, 2025 and led by Double Point
      Ventures. The round included sovereign and strategic investors: Australia's National
      Reconstruction Fund Corporation (NRFC) committed AUD 54 million (approximately USD 34 million)
      specifically to establish an Australian commercial and engineering hub, adding manufacturing
      infrastructure costs to the capital-deployment picture beyond US operations. Qatar Investment
      Authority, IQT (a US national-security strategic investor), T.Rx Capital, K5 Global, and
      Protocol Labs joined existing backers such as ARCH Venture Partners, Khosla Ventures, and
      Bezos Expeditions. The historical round-by-round chronology is documented in the Company
      Overview chapter and is referenced here rather than restated.
      Beyond headcount and trials, several discrete capital deployments signal ongoing spend. In
      January 2024, Synchron acquired an equity stake in ACQUANDAS GmbH, a neural-electrode
      supply-chain partner, implying targeted manufacturing and supply-chain capex rather than
      purely operating expense. Riki Banerjee was appointed Chief Technology Officer in January 2024
      to lead engineering preparation for the pivotal study, directly signalling elevated technical
      burn ahead of the pivotal trial. Andy Rasdal, a seasoned medical-device commercialization
      executive, was appointed to the Board of Directors in December 2023, signalling the company's
      orientation toward a commercial launch and associated cost build-up. In July 2024 Synchron
      launched a BCI chat feature powered by OpenAI, demonstrating that product-expansion engineering
      and AI partnership costs are already active use-of-capital categories.
      For forward capital adequacy, the company has not disclosed cash on hand or burn rate, so
      runway must be estimated. Late-stage neuro-device companies advancing a pivotal trial while
      building US and Australia commercial and AI operations typically burn on the order of
      USD 40-120 million per year; against a fresh USD 200 million raise plus the NRFC AUD 54 million
      co-investment, this implies a runway on the order of two to four years — enough to fund the
      planned 2026 pivotal trial and an initial commercialization build-out, but not obviously enough
      to reach self-sustaining reimbursed revenue without at least one further raise. The next-round
      trigger is most likely the pivotal-trial readout and PMA submission. The binding financial
      dependency is therefore the gap between approval-plus-reimbursement and capital exhaustion.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
      - CI019
      - CI037
      - CI038
      - CI041
      - CI042
      - CI043
      - CI044
    tableRefs:
      - TI004
    figureRefs:
      - FI003
      - FI004
  - id: public-traction-gaps
    title: Public Traction Versus Private-Metric Gaps
    body: >-
      Public, verifiable traction for Synchron is clinical and partnership-based rather than
      financial. The company has completed the SWITCH study (four patients, published in JAMA
      Neurology in January 2023) and the COMMAND early-feasibility study (six patients, primary
      safety endpoint met in 2024), has FDA Breakthrough Device Designation and the first IDE for a
      permanently implanted BCI, and has announced ecosystem integrations with Apple (native
      BCI-HID) and NVIDIA (Holoscan edge AI). What is not public is essentially every financial
      metric an underwriter needs: revenue (zero today, but no disclosed forward forecast), cash on
      hand, monthly or annual burn, gross margin, manufacturing cost, device pricing, headcount with
      cost, and any post-money valuation figure (the Series D was widely described as implying a
      valuation above USD 1 billion, but the company did not confirm a specific number). Because
      Synchron is a private company, there are no SEC periodic filings in EDGAR to triangulate these
      figures. A search of the SEC EDGAR company filing database for Synchron Inc. under Form D
      private-placement submissions returns no accessible results, consistent with the company filing
      under a variation of its legal name or the search endpoint being unavailable; either outcome
      confirms that only Form D-type private-placement evidence would exist, which discloses amounts
      raised but not operating economics. This creates a large private-metric gap: the investment
      case rests on clinical and regulatory milestones that are well evidenced, while the financial
      inputs that determine capital adequacy and ultimate returns are almost entirely undisclosed.
      The diligence implication is that financial underwriting cannot be completed from public
      sources alone and requires direct data-room access to cap table, audited financials, burn
      detail, and pricing assumptions.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI025
      - CI039
    tableRefs:
      - TI005
    figureRefs: []
  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: >-
      On revenue quality, the verdict is that Synchron has no revenue and no near-term revenue; its
      quality cannot be assessed because it does not yet exist, and the path to first revenue is
      gated by a binary regulatory event (PMA) followed by a slow, uncertain reimbursement process.
      Medical device analysts note there is no quick path to market for a BCI device of this
      complexity: the Pre-Market Approval route requires a multi-hundred-patient pivotal trial and
      years of FDA review, meaning revenue is structurally distant rather than merely delayed.
      On margin path, the long-run implantable-device gross margin could be attractive at scale, but
      the company is years from the volumes that would make device margin meaningful, and early
      economics will be loss-making by design. On capital intensity, Synchron is moderately
      capital-intensive: less so than a manufacturing-heavy hardware company because the device is
      small and uses an existing catheter workflow, but more so than a software company because it
      must fund multi-year pivotal trials, a quality system, manufacturing scale-up, the NRFC-backed
      Australia commercial hub, and an eventual commercial organization. The USD 345 million raised
      is substantial for the category and places Synchron among the better-capitalized BCI companies,
      but the GAO and independent commentators flag reimbursement and demonstrated long-term benefit
      as unresolved, meaning capital alone does not guarantee a revenue outcome. The principal
      diligence blockers are: (1) no disclosed burn or runway, so the time-to-cash-out is unknown;
      (2) no disclosed pricing or reimbursement assumption, so the revenue ramp cannot be modeled;
      (3) a valuation implied but not confirmed, so entry multiple cannot be validated; and (4) a
      reimbursement pathway that is a precondition for any revenue and is not yet established.
      Net, this is a clinically credible, well-funded, pre-revenue venture whose financial profile is
      appropriate for a high-risk, milestone-driven medical-device investment rather than a
      cash-generative business.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
      - CI031
      - CI040
    tableRefs: []
    figureRefs: []
