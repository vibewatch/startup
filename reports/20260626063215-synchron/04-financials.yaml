callouts:
  - calloutType: risk
    title: No disclosed burn or runway is the central financial-evidence gap
    body: >-
      Synchron has not published cash on hand, burn, or runway. The two-to-four-year runway used
      here is an estimate from category benchmarks against the USD 200M Series D, not a company
      figure, so the cash-out date and need for a further raise cannot be confirmed without
      data-room access.
    claimRefs:
      - CI015
      - CI016
      - CI020
  - calloutType: insight
    title: Revenue is gated by a binary regulatory event, not by sales execution
    body: >-
      Because there is no revenue until FDA PMA plus reimbursement, the financial model is dominated
      by milestone risk rather than commercial-execution risk. Capital adequacy must be judged
      against the gap between approval-plus-coverage and capital exhaustion.
    claimRefs:
      - CI002
      - CI019
      - CI028
