  evidenceStrategy:
    - Official-surface mining of Synchron homepage, about, join, and careers pages.
    - >-
      Technical proof from peer-reviewed first-in-human and COMMAND stability papers, patent
      filings, and four clinical-trial registrations.
    - Trade press for manufacturing process, Acquandas partnership, and Apple/OpenAI/NVIDIA integrations.
    - >-
      Developer-signal from Synchron careers page as a hiring proxy and NeuroTechX awesome-bci
      as the nearest independent BCI practitioner community signal.
  qualityBar:
    - Distinguish verified maturity, integration milestones, and regulatory status from marketing claims.
    - Make architecture, manufacturing, and workflow content specific and grounded in cited sources.
    - Surface product, cybersecurity, neural-data privacy, regulatory, and bandwidth gaps as evidenceGaps.
    - Unsupported decoding-accuracy, certification, or roadmap claims must become evidenceGaps.
sections:
  - id: product-scope
    title: Product Definition, Use Cases, and Module Map
    body: >-
      Synchron's product is the Stentrode system: the first brain-computer interface designed to be
      implanted without open-brain surgery, giving a person with severe paralysis hands-free digital
      control by intention alone. In customer-workflow terms, the patient thinks about a movement,
      the device detects the corresponding motor-cortex signal, and that signal is decoded into a
      digital command—a cursor click, a text message, a Vision Pro selection—without any limb
      movement. The 2020 first-in-human paper (PubMed 33115813) showed two ALS patients using the
      system at home for texting and web browsing. Demonstrated use cases now span cursor control,
      text messaging, Apple Vision Pro and iPad native operation, and OpenAI-powered AI chat—all
      under investigational clearance. The module map has five distinct assets: the Stentrode implant
      (16-electrode nitinol stent array), the internal chest telemetry unit, the external processing
      unit, the Chiral AI decoding model, and the Apple BCI-HID integration layer. A manufacturing
      module anchors supply-chain diligence: the electrode array is produced via MEMS thin-film
      sputtering by Acquandas, a German specialist in which Synchron holds an equity stake. The
      regulatory caveat governs all commercial claims: the system is investigational only, limited
      by US federal law to investigational use, and is not approved for commercial implantation
      outside clinical trials.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE021
      - CE030
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE001
      - FE002

  - id: architecture-manufacturing
    title: System Architecture and Manufacturing Process
    body: >-
      The Stentrode system has three hardware layers and a multi-tier software stack. The sensing
      layer is the Stentrode electrode array itself: a self-expanding nitinol stent carrying sixteen
      platinum electrodes deployed through the jugular vein into the superior sagittal sinus, which
      runs immediately adjacent to the motor cortex. The chest layer is an internal telemetry unit
      implanted subcutaneously and connected to the electrode lead via a subcutaneous tunnel; this
      unit transmits neural signals wirelessly through the chest wall to an external processing unit.
      The external unit runs the software stack: Chiral, described by Synchron as a neural-decoding
      foundation model that generalises across patients and sessions, running on NVIDIA Holoscan for
      low-latency edge-AI inference; and the Apple BCI-HID driver that maps decoded intention to
      native iPhone, iPad, and Vision Pro input events. The manufacturing process for the core
      hardware is technically demanding. Per Synchron CTO Riki Banerjee in trade media, the electrode
      array is manufactured using MEMS-style sputtered thin-film nitinol deposited on a silicon wafer;
      the film is released from the wafer and rolled onto a mandrel to form the stent shape. This
      process requires highly specialised equipment. In January 2024 Synchron acquired an equity
      stake in Acquandas, a German MEMS and thin-film manufacturer, to secure this production step.
      Acquandas serves as the strategic manufacturing partner for thin-film nitinol, creating a
      material single-supplier dependency that the critical dependency map highlights.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE007
      - CE008
      - CE012
      - CE013
      - CE014
      - CE022
    tableRefs:
      - TE003
    figureRefs:
      - FE003

  - id: trust-safety-compliance
    title: Trust, Safety, Clinical Evidence, and Compliance
    body: >-
      Safety and compliance for the Stentrode system are governed by the medical-device regulatory
      regime. Four trials form the clinical evidence base: SWITCH (NCT03834857, four Australian
      patients, 12-month safety published in JAMA Neurology), COMMAND (NCT05035823, six US patients,
      primary safety endpoint met 2024, 2025 preprint reporting 16-channel chronic stability data),
      INTENT (NCT07543367), and FOCUS-AUS (NCT07533903). The 2025 COMMAND stability preprint
      (PubMed 41040697) includes author conflict-of-interest disclosures noting company affiliations
      and patent interests. Synchron holds FDA Breakthrough Device Designation (2020) and the first
      FDA IDE for a permanently implanted BCI (2021). Commercial deployment requires a full FDA
      pre-market approval (PMA), which is more demanding than IDE clearance. ISO 13485
      quality-management-system conformance is required for PMA manufacturing, but Synchron's
      certification status is not publicly confirmed. Endovascular-specific risks—vessel thrombosis,
      lead migration, stenosis—require antiplatelet or anticoagulation management. Two trust areas
      are absent from public documentation: no cybersecurity architecture or wireless neural-data
      link encryption specification is published; and no neural-data privacy policy covering raw or
      decoded brain signals is disclosed. The company statement that brain data is not shared with
      OpenAI in the chat feature is a positive but narrow data point. Long-term durability and rare
      adverse events remain uncharacterised given the small total patient count across all trials.
    claimRefs:
      - CE006
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE027
      - CE028
      - CE029
      - CE034
      - CE035
      - CE036
    tableRefs:
      - TE004
    figureRefs: []

  - id: roadmap-developer
    title: Roadmap, Developer Ecosystem, and Evidence Gaps
    body: >-
      Synchron's roadmap runs on two tracks. The near track targets a 2026 pivotal trial to support
      FDA PMA submission—the milestone that converts the investigational device into a commercially
      implantable product. The software track iterates Chiral, Apple BCI-HID, NVIDIA Holoscan, and
      OpenAI integrations to improve capability without hardware changes. The longer track is a
      next-generation, higher-channel-count interface in early R&D at a San Diego site, intended to
      close the bandwidth gap against intracortical competitors while preserving the endovascular
      safety advantage; architecture and timeline are not publicly disclosed. The appointment of CTO
      Riki Banerjee in January 2024, explicitly tied to manufacturing scale-up, signals a product-
      maturity transition. For developer-ecosystem signal, the Synchron Careers page lists openings
      across hardware engineering, software/AI, clinical affairs, and regulatory, indicating active
      product development but not an independent external community. The NeuroTechX awesome-bci
      repository on GitHub is a community-curated index of BCI tools and frameworks used by
      practitioners and researchers, confirming a broader BCI developer ecosystem, but it is not
      specific to Synchron and does not reflect external adoption of Synchron's platform or APIs.
      Both developer-signal sources are limited proxies; an evidenceGap records the absence of
      external developers publishing on Synchron's specific stack. The central evidence gaps are:
      Chiral accuracy has no independent benchmark; the 2026 pivotal trial has not started and its
      schedule is a target; the next-generation interface lacks any public technical specification;
      and cybersecurity and neural-data privacy remain undisclosed.
    claimRefs:
      - CE007
      - CE009
      - CE010
      - CE019
      - CE024
      - CE025
      - CE026
      - CE031
      - CE032
      - CE033
