callouts:
  - calloutType: insight
    title: The endovascular design is a deliberate safety-for-bandwidth trade
    body: >-
      By recording from a vein adjacent to cortex rather than penetrating brain tissue, Synchron
      avoids craniotomy and lowers surgical risk, but accepts 16 channels versus 1,000 or more for
      intracortical competitors. This trade is the product's core safety advantage and its primary
      capability limitation, and it is the crux of both the competitive thesis and the next-
      generation bandwidth roadmap.
    claimRefs:
      - CE002
      - CE022
      - CE023
  - calloutType: risk
    title: Single-supplier manufacturing dependency on Acquandas
    body: >-
      The sputtered thin-film nitinol process requires specialised MEMS equipment concentrated at
      a single German supplier. Synchron's equity stake in Acquandas partially mitigates but does
      not eliminate exposure to disruption from yield issues, geopolitical risk, or capacity
      constraints. A manufacturing interruption would directly halt implant supply.
    claimRefs:
      - CE012
      - CE013
      - CE014
  - calloutType: risk
    title: Cybersecurity and neural-data privacy are absent from public documentation
    body: >-
      Neural signals are among the most sensitive personal data. No security architecture for the
      wireless neural-data link, and no public data-handling policy for raw or decoded brain
      signals, is available from Synchron. This gap is material for hospital procurement,
      regulatory submission, and investor diligence at scale.
    claimRefs:
      - CE027
      - CE028
      - CE009

