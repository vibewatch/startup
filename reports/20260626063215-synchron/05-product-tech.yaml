  evidenceGaps:
    - id: GE001
      title: Chiral decoding accuracy is not independently benchmarked
      type: missing-source
      severity: material
      topic: software-ai
      description: >-
        Synchron describes Chiral as a foundation model for neural decoding but no independent or
        peer-reviewed benchmark of decoding accuracy, latency, or cross-patient generalisation
        has been published.
      missingEvidence: Independent or peer-reviewed evaluation of Chiral decoding accuracy and latency.
      relatedQuestionRefs:
        - QE023
      relatedTableRefs:
        - TE003
      diligencePath: >-
        Request internal benchmark data and seek third-party or academic evaluation of decoding
        accuracy and latency before relying on company claims.
      whyItMatters: >-
        Decoding quality drives real-world usability; unverified claims overstate product capability
        and create risk for clinical and commercial projections.
    - id: GE002
      title: Cybersecurity architecture and neural-data privacy policy absent from public record
      type: missing-source
      severity: material
      topic: trust-compliance
      description: >-
        No security architecture for the wireless neural-data link, and no public data-handling
        policy for raw or decoded brain signals, is available from Synchron.
      missingEvidence: >-
        Published security specification for the transcutaneous wireless link and a public
        neural-data privacy policy.
      relatedQuestionRefs:
        - QE024
      relatedTableRefs:
        - TE004
      diligencePath: >-
        Request cybersecurity design documentation, penetration-test results, and neural-data
        privacy policy; assess against IEC 62443 and FDA cybersecurity guidance for medical devices.
      whyItMatters: >-
        Neural signals are among the most sensitive personal data; absence of security and privacy
        disclosure is material for hospital procurement, regulatory submission, and patient trust.
    - id: GE003
      title: Limited patient count and follow-up leave durability uncharacterised
      type: missing-source
      severity: material
      topic: clinical
      description: >-
        Only tens of patients have been implanted across all trials and the longest published
        follow-up is 12 months, leaving long-term durability, signal stability, and rare adverse
        events unproven.
      missingEvidence: Pivotal-trial cohort with multi-year follow-up and durability endpoints.
      relatedQuestionRefs:
        - QE018
      relatedTableRefs:
        - TE004
      diligencePath: >-
        Review pivotal-trial protocol, planned enrollment, and longitudinal safety and durability
        endpoints; seek multi-year follow-up commitments.
      whyItMatters: >-
        Durability and rare-event risk at scale are decisive for PMA approval and clinical adoption;
        a small short-duration evidence base cannot de-risk chronic implants.
    - id: GE004
      title: Single-supplier Acquandas dependency creates manufacturing concentration risk
      type: missing-source
      severity: minor
      topic: manufacturing
      description: >-
        The sputtered thin-film nitinol process is outsourced to Acquandas; no alternative
        manufacturing source, yield data, or business-continuity plan is publicly disclosed.
      missingEvidence: >-
        Evidence of dual-source manufacturing capability or a business-continuity plan for
        thin-film nitinol production.
      relatedQuestionRefs:
        - QE008
      relatedTableRefs:
        - TE003
      diligencePath: >-
        Request supply-chain resilience plan, yield data from Acquandas, and status of any
        second-source manufacturing development.
      whyItMatters: >-
        A single-supplier disruption for the critical manufacturing step could halt implant supply
        and delay the pivotal trial or commercial launch.
    - id: GE005
      title: Developer signal limited to company hiring proxy and non-specific community
      type: missing-source
      severity: minor
      topic: developer-signal
      description: >-
        The Synchron Careers page and NeuroTechX awesome-bci are the only available developer-
        signal proxies; no external developers publish on Synchron's specific stack, APIs, or SDK.
      missingEvidence: >-
        External developer community publishing on Synchron-specific tools, APIs, or access to
        the Chiral model interface.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE001
      diligencePath: >-
        Monitor for Synchron SDK or API releases; assess whether Chiral is made available to
        researchers or third-party developers.
      whyItMatters: >-
        Platform strength and ecosystem defensibility partly depend on external developer adoption;
        absence of a developer community is a current limitation for platform moat claims.
    - id: GE006
      title: Public patent corpus does not clearly map claim scope to current shipped modules
      type: missing-source
      severity: minor
      topic: IP
      description: >-
        Public patent search results suggest a meaningful Synchron filing footprint, but the currently
        granted versus pending claims, jurisdictions, and specific coverage of the Stentrode, Chiral,
        and deployment stack are not clearly enumerated in accessible public materials.
      missingEvidence: >-
        A patent schedule mapping issued and pending patent families to the Stentrode device,
        delivery method, decoder stack, and manufacturing process.
      relatedQuestionRefs:
        - QE020
      relatedTableRefs:
        - TE001
      diligencePath: >-
        Review the company's patent schedule, outside counsel summaries, and family-level prosecution
        status for the principal endovascular BCI claims before underwriting IP durability.
      whyItMatters: >-
        IP scope is a core part of Synchron's technical moat claim; weak visibility into issued versus
        pending protection makes it difficult to judge copy risk and freedom to operate.
