runDate: '2026-06-26'
company:
  name: Synchron
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Synchron's Stentrode is a 16-electrode endovascular brain-computer interface implanted via the
    jugular vein without craniotomy, paired with a chest telemetry unit and an external decoder
    running the Chiral neural-decoding foundation model on NVIDIA Holoscan edge compute. Apple
    BCI-HID native device integration was demonstrated in 2025; an OpenAI-powered chat feature was
    announced in 2024 with the company stating brain data is not shared with OpenAI. The electrode
    array is manufactured using MEMS-style sputtered thin-film nitinol on silicon wafers, with
    Acquandas as the strategic manufacturing partner following a January 2024 equity-stake
    acquisition. Demonstrated use cases span cursor control, texting, Apple Vision Pro and iPad
    operation, and AI-assisted communication—all investigational. Safety evidence from SWITCH,
    COMMAND, INTENT, and FOCUS-AUS trials is favorable across small cohorts; FDA Breakthrough
    Device Designation and IDE clearance are held. Key gaps: Chiral decoding accuracy is not
    independently benchmarked; cybersecurity and neural-data privacy detail is absent from public
    documentation; and long-term implant durability is unproven beyond short trial follow-up.
  contentRequirements:
    - Product/service definition in customer-workflow terms.
    - Module, asset, and product-line map including hardware, software, and manufacturing.
    - 'Architecture and operating model: hardware design, signal path, software stack, and manufacturing process.'
    - Deployment, integration, reliability, and roadmap.
    - 'Differentiation: technology, IP, supply chain, and regulatory approvals.'
    - Trust, safety, security, compliance, and quality controls.
  plannedTables:
    - name: Product module / asset matrix
      requirement: module/asset/product line, user, status/maturity, differentiation, diligence gap.
    - name: Workflow / use-case table
      requirement: user job, current workflow, Synchron solution, benefit, limitation.
    - name: Technology / operating architecture table
      requirement: layer/component, role, dependency, risk.
    - name: Trust / quality / compliance table
      requirement: control/certification/milestone, status, scope, gap.
    - name: Roadmap / release / development-stage table
      requirement: date/stage, milestone, status, implication.
  plannedFigures:
    - name: Product architecture map
      acceptedTypes:
        - stack
      requirement: Layers from implanted electrode through signal relay, AI decoding, and device output.
    - name: Customer workflow / operating flow
      acceptedTypes:
        - flow
      requirement: Step-by-step flow from patient intention to executed digital command.
    - name: Critical dependency map
      acceptedTypes:
        - dag
      requirement: Suppliers, platform partners, regulators, and clinical infrastructure the product depends on.
    - name: Product maturity / capability map
      acceptedTypes:
        - matrix
