  - id: switching-costs-lock-in-and-distribution
    title: Switching Costs, Lock-In, Multi-Homing, and Distribution
    body: >-
      Switching costs in permanently implanted BCIs are extraordinarily high by the nature of
      the product. A patient implanted with the Stentrode cannot be simultaneously implanted
      with a Neuralink N1; multi-homing is physically impossible for cranial implants and
      highly unlikely for an endovascular implant. This creates complete single-vendor lock-in
      at the patient level once a device is implanted — the patient, their clinical team, and
      their caregivers all build workflows, training, and device familiarity around one platform.

      Surgeon and center lock-in operates at the institutional level. Neurosurgeons trained to
      implant Precision's Layer 7 array build procedure familiarity and institutional protocols
      around that device. Synchron's neurointerventional workflow is a distinct skill set
      (catheter-based, performed in a neurointerventional suite rather than a neurosurgical OR)
      — providing partial insulation from Precision's surgical-center beachhead, but also
      requiring Synchron to build its own credentialed center network from scratch.

      The Apple BCI-HID integration is a distribution-moat asset. Apple's native BCI-HID
      protocol embeds BCI as a first-class input method in iOS, iPadOS, and visionOS, meaning
      every software update that deepens BCI HID capabilities inherently benefits Synchron's
      platform. Competing BCI companies that require custom software bridges are at a structural
      disadvantage for consumer-facing use cases as the Apple ecosystem advantage compounds.

      Supply chain and manufacturing access are not public differentiators as of June 2026; all
      competitors are manufacturing at clinical trial scale. Payer distribution (hospital contracts,
      insurance coverage) is unavailable for any permanently implanted BCI until PMA is granted
      and a National Coverage Determination is established, meaning distribution power is
      effectively zero across all implanted BCI competitors as of mid-2026.
