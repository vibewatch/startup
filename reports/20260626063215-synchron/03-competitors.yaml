callouts:
  - calloutType: strength
    title: Endovascular Delivery Is a Structural Differentiation That Cannot Be Easily Replicated
    body: >-
      No competitor in the implanted BCI segment has an endovascular catheter-based approach;
      all direct rivals require craniotomy. This distinction creates a distinct surgical specialty
      (neurointerventional) required for implantation, a distinct hospital department workflow
      (catheter lab vs. neurosurgical OR), and a distinct patient-eligibility segment. Replicating
      this approach requires years of catheter engineering, a new body of clinical evidence for
      the endovascular route, and regulatory work to establish the endovascular BCI as a credible
      class. Synchron has a 7-year head start on this specific path from its 2019 first-in-human
      SWITCH study.
    claimRefs:
      - CP018
      - CP003

  - calloutType: risk
    title: Precision Neuroscience's 510(k) Beachhead Creates a Distribution Disadvantage Before PMA
    body: >-
      Precision Neuroscience's 510(k) clearance for short-term cortical recording enables it to
      deploy its 1,024-electrode thin-film array in neurosurgical centers today. Each deployment
      trains a surgeon, builds an institutional protocol, and creates a relationship between
      Precision and the hospital that will influence the commercial BCI platform decision at PMA.
      Synchron's endovascular neurointerventional workflow requires a different hospital department
      and a different specialist, providing partial insulation from this dynamic — but Synchron
      cannot build the same type of pre-commercial center familiarity that Precision is generating
      through its 510(k) deployments.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP034

  - calloutType: risk
    title: 16-Channel Constraint Is a Structural Signal-Fidelity Ceiling
    body: >-
      Synchron's thesis is that safety and deployment simplicity outweigh channel count for
      current clinical use cases (binary motor-intent to digital switch actions). This thesis
      is coherent for simple communication and switch-access tasks. However, as BCI applications
      expand toward richer neural decoding — continuous cursor control, speech synthesis at full
      vocabulary, complex prosthetic control — the performance gap between 16 channels and 1,024
      channels could become commercially disqualifying for higher-value applications. The next-
      generation high-channel transcatheter interface in stealth development at Synchron's San
      Diego hub is the hedge against this risk, but it is not a shipped product.
    claimRefs:
      - CP031
      - CP032

