  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat Claim
      - Supporting Evidence
      - Primary Threat / Disconfirming Factor
      - Severity (H/M/L)
      - Mitigation / Diligence Ask
    rows:
      - - Endovascular no-craniotomy delivery creates a distinct patient-eligibility tier
        - 20-minute median procedure; neurointerventional workflow; COMMAND 100% deployment accuracy
        - Competitors may develop less-invasive cortical approaches; patient preference for higher channel count may override risk preference
        - Medium
        - Confirm neurointerventionalist training capacity; quantify patient segment ineligible for craniotomy
      - - First Apple BCI HID native integration creates ecosystem distribution moat
        - May 2025 BCI-HID announcement; Vision Pro patient demonstration; iOS/iPadOS/visionOS support
