  - id: adverse-evidence-and-competitive-risks
    title: Adverse Evidence and Competitive Risks
    body: >-
      The most significant adverse finding for Synchron's competitive position is the electrode
      count gap. Synchron's 16-channel Stentrode captures far less neural signal than Neuralink's
      1,024-electrode N1 or Precision's 1,024-electrode Layer 7 array — a 64:1 channel count
      disadvantage. Greater channel count generally enables richer decoding, faster typing rates,
      more nuanced motor-intent classification, and future multi-limb prosthetic control. If the
      BCI market evolves toward richer neural interfaces for communication or prosthetic
      applications, Synchron's 16-channel constraint is a structural capability ceiling that
      cannot be addressed without a generation change to its next-generation multi-channel
      transcatheter interface in stealth development at the San Diego hub.

      Precision Neuroscience's 510(k) clearance creates a competitive beachhead. By deploying
      its 1,024-electrode device in neurosurgical centers under short-term clearance, Precision
      is building center familiarity, training surgical staff, and accumulating clinical performance
      data. Synchron's PMA advantage in the permanent implant category may be offset if Precision's
      center-access position converts into a preference for Precision's platform at the commercial
      launch decision point.

      Non-surgical substitutes represent the largest volumetric competitive threat. Tobii Dynavox
      and similar eye-tracking AAC systems satisfy the communication needs of most paralyzed patients
      who retain functional gaze control — the large majority of ALS patients through most of their
      disease course. These substitutes require no surgery, carry no implant risk, are covered by
      existing Medicare/Medicaid DME codes, and are immediately deployable. The Stentrode's clinical
      superiority emerges only when eye control fails (late-stage ALS locked-in syndrome) or when
      the patient requires richer device control than eye-tracking can deliver.

      Synchron's CCO Kurt Haggstrom acknowledged in a Medical Design and Outsourcing interview that
      there is no quick path to market for a permanently implanted neural device and that the PMA
      pathway is the most rigorous FDA track. This explicit recognition creates a window for
      Precision to deepen hospital relationships, for Neuralink to generate more patient data, and
      for substitutes to entrench their position before Synchron's commercial launch.
