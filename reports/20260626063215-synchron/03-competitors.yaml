        - Medium
        - Confirm whether Apple BCI-HID is an exclusive relationship or an open protocol; track Neuralink BCI-HID announcements
      - - PMA pathway leader with most advanced clinical data package for permanent implant
        - COMMAND primary endpoint met; INTENT and FOCUS-AUS active; 11 cumulative implants
        - PMA timeline 2028 plus at earliest; Precision 510(k) center-access head start; Neuralink patient enrollment velocity possible
        - High
        - Model PMA timeline scenarios; assess whether pivotal trial can be accelerated; track Neuralink IDE patient enrollment
      - - Single-vendor patient lock-in — multi-homing physically impossible
        - No patient can hold two simultaneously implanted BCIs; post-implant workflow dependency
        - Low implant volumes mean lock-in applies to very few patients today; market is too small to create network effects
        - Low
        - Monitor cumulative implant volumes across all competitors; assess switching cost durability at scale
      - - 16-channel signal fidelity is a structural ceiling vs 1,024-electrode competitors
        - "Synchron Stentrode: 16 LFP channels; Neuralink N1: 1,024; Precision: 1,024"
        - As BCI applications demand richer decoding (speech, multi-limb), 16 channels may cap clinical utility
        - High
        - Assess next-gen high-channel transcatheter device timeline; model decoding performance gap
      - - Non-surgical substitutes satisfy most communication jobs without BCI surgery
        - Tobii Dynavox commercially available; Medicare/Medicaid covered; no surgical risk
        - Patients and physicians will default to non-surgical path unless Stentrode offers compelling incremental benefit
        - High
        - Define precise patient segment where eye-tracking fails and Stentrode is incremental; quantify this sub-population
    notes: >-
      Severity ratings are analyst assessments based on commercial impact and time-horizon;
      they are not from a formal risk framework. All competitive moat claims are based on
      publicly available evidence as of June 2026; material changes to Neuralink or Precision
      regulatory timelines could shift severity assessments significantly.
