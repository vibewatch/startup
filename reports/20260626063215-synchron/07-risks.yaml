schemaVersion: report-v2
artifact: risks
slug: synchron
runDate: '2026-06-26'
company:
  name: Synchron
chapter:
  number: 7
  title: Risks
  summary: >-
    Synchron's risk profile is dominated by two sequential, binary regulatory gates: FDA PMA
    approval (no pivotal trial completed) and a Medicare coverage determination (none exists for
    BCIs), either of which failing would strand a clinically credible company regardless of
    technology quality. Reimbursement risk is compounded by Precision Neuroscience's 510(k)
    clearance, which creates a regulatory wedge affecting CMS coverage calculus. Clinical-safety
    risk is favorable but unproven beyond small, short follow-up cohorts, and the only chronic
    stability evidence is a company-affiliated preprint with COI disclosure. Supply-chain risk
    concentrates in a single ACQUANDAS thin-film supplier; partner risk concentrates in Apple
    BCI-HID platform dependency, Australia-based manufacturing, and capital-market access;
    financial risk is capital exhaustion before revenue against a high implied valuation. The
    risk registers rank these by severity with monitorable kill criteria.
  contentRequirements:
    - >-
      Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and
      investment implication.
    - >-
      Regulatory/legal risk: PMA approval, reimbursement NCD, Precision competitive wedge,
      IP/FTO, neural privacy, post-market enforcement.
    - >-
      Operational risk: ACQUANDAS single-supplier, Australia manufacturing concentration,
      scale-up QMS, decoding software benchmarking, cybersecurity.
    - >-
      Partner/dependency risk: Apple BCI-HID platform, capital providers, FDA/CMS, implanting
      centers, ACQUANDAS supply, NRF/Australia hub.
    - >-
      Financial/model and execution risk: pre-revenue burn, SEC disclosure gap, key persons,
      developer ecosystem depth, valuation expectations.
    - Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
  plannedTables:
    - name: Regulatory / legal risk register
      enumeration: true
      expectedMinRows: 3
      requirement: >-
        rule/license/case, jurisdiction, status, likelihood, severity, mitigation, residual
        exposure; rows ordered by severity.
    - name: Operational / quality / security risk register
      requirement: >-
        failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap;
        rows ordered by severity.
    - name: Partner / dependency risk register
      requirement: >-
        dependency, counterparty, role, concentration, failure scenario, severity, mitigation,
        residual exposure; rows ordered by severity.
    - name: People / execution risk register
      requirement: >-
        role/function, dependency or gap, likelihood, severity, mitigation, diligence path; rows
        ordered by severity.
    - name: Mitigation and kill criteria table
      requirement: risk, monitorable trigger, threshold/event, action implication.
  plannedFigures:
    - name: Risk heatmap
      acceptedTypes:
        - matrix
      requirement: Impact, likelihood, mitigation maturity, or residual severity.
    - name: Risk transmission map
      acceptedTypes:
        - dag
      requirement: How risks flow into revenue, customers, margin, financing, operations, and valuation.
    - name: Dependency map
      acceptedTypes:
        - dag
      requirement: Critical partners, suppliers, platforms, regulators, facilities, or financing dependencies.
  evidenceStrategy:
    - >-
      Adverse/disconfirming research across regulatory, legal, clinical, and financial dimensions
      is mandatory; 30 sources spanning 16 distinct domains are used.
    - >-
      Primary regulatory sources: FDA Breakthrough Devices guidance, FDA neurological device
      classifications, CMS LCD L33739, ClinicalTrials.gov (4 trials), SEC EDGAR Form D.
    - >-
      Independent adverse sources: InsideBCI reimbursement-gap analysis (March 2026),
      MedicalDesignAndOutsourcing PMA difficulty, MassDevice Precision 510(k), Nature Reviews
      BCI barriers.
    - >-
      Company sources: BusinessWire Series D, ACQUANDAS equity stake, CTO/board appointments,
      NRF AUD 54M investment, Apple newsroom.
  qualityBar:
    - Cite evidence and mitigation for every top risk; never assign severity from intuition.
    - Define monitorable kill criteria or diligence paths for all unresolved risks.
    - Record exact diligence path where litigation, IP, durability, or supply cannot be confirmed.
    - Tie thesis-break triggers to measurable regulatory, clinical, customer, or financial events.
sections:
  - id: regulatory-legal
    title: Regulatory and Legal Risks
    body: >-
      The dominant risk to Synchron is regulatory: the company has not yet completed a pivotal
      trial or obtained FDA pre-market approval (PMA), and approval is a binary, non-guaranteed
      event. FDA's own Breakthrough Devices Program guidance states that designation expedites
      review but does not guarantee approval or reimbursement. Industry analysis confirms there
      is no quick PMA path for implantable BCIs even with Breakthrough status — the multi-year
      evidence burden is unchanged. Layered on top of approval risk is reimbursement risk:
      InsideBCI's March 2026 analysis identifies Medicare's missing coverage pathway for BCIs;
      there is no national coverage determination and no BCI-specific procedure code. The CMS
      LCD L33739 for speech-generating devices provides a baseline comparator but does not
      cover BCIs. Precision Neuroscience's FDA 510(k) clearance for a cortical BCI interface
      creates a competitive and regulatory wedge: it sets precedent that lower-acuity BCI
      elements can clear the 510(k) bar, complicating CMS's willingness to cover the
      higher-acuity, implanted Stentrode. Legal risks are presently low-visibility but
      structurally important: Synchron Australia's patent portfolio is visible on Google Patents
      but freedom-to-operate analysis against Neuralink, Precision, and other filers has not
      been independently confirmed. Neural data under HIPAA and emerging neurorights statutes
      creates compliance risk that is under-disclosed. Post-market obligations (MAUDE
      reporting, QSR, anti-kickback) apply once reimbursement begins.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR027
      - CR028
      - CR033
      - CR034
      - CR037
      - CR043
    tableRefs:
      - TR001
    figureRefs:
      - FR001
  - id: clinical-safety
    title: Clinical Safety and Durability Risks
    body: >-
      Clinical-safety risk is intrinsic to an implanted brain device. Four trials are registered
      across ClinicalTrials.gov — COMMAND (NCT05035823), SWITCH Australia (NCT03834857), and
      two additional active trials (NCT07543367, NCT07533903) — demonstrating an expanding
      program with simultaneous enrollment risks. MassDevice reports SWITCH 12-month safety
      results as positive but n is small, so long-term durability, signal stability over years,
      and rare adverse events are not established at commercial scale. The only chronic stability
      evidence is a preprint (PubMed PMID 41040697) with company-affiliated authors who disclose
      conflicts of interest; it has not yet been peer-reviewed, limiting its evidentiary weight.
      The peer-reviewed first home-use case (PMID 33115813) establishes technical feasibility
      but minimal generalizability for durability projections. Nature Reviews Bioengineering
      identifies systemic barriers to implantable BCI trials — small eligible populations,
      complex consent, long required follow-up, limited implanting infrastructure — that
      directly increase the risk of any single trial missing its endpoints. The endovascular
      design introduces vascular-specific failure modes including thrombosis, device migration,
      and stenosis requiring antiplatelet management. These risks are ranked in the operational
      register.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR008
      - CR035
      - CR036
      - CR037
      - CR040
    tableRefs:
      - TR002
    figureRefs: []
  - id: supply-operations
    title: Supply Chain, Operational, and Manufacturing Risks
    body: >-
      Supply-chain risk concentrates in Synchron's ACQUANDAS dependency. Synchron acquired an
      equity stake in ACQUANDAS in January 2024 (BusinessWire) to secure thin-film electrode
      manufacturing, a critical substrate for the Stentrode. MassDevice confirmed the stake,
      characterizing it as a supplier-anchor move. This creates single-supplier concentration
      for the thin-film electrode component with no publicly confirmed secondary source or
      continuity plan. Manufacturing scale-up from clinical-grade to commercial production
      under ISO 13485 and FDA QSR is a common device-company failure point. Australia's
      National Reconstruction Fund (NRF) AUD 54M investment anchors both R&D and manufacturing
      in Australia, creating geographic concentration and foreign-exchange exposure. The
      ACQUANDAS dependency and Australia manufacturing hub together concentrate critical
      component supply and manufacturing R&D in a single non-US jurisdiction — a compounded
      geopolitical and supply risk. Cybersecurity risk in a connected brain-computer implant
      is also a growing regulatory and operational concern; the FDA expects lifecycle management
      of connected-device security.
    claimRefs:
      - CR014
      - CR015
      - CR029
      - CR038
      - CR044
    tableRefs: []
    figureRefs:
      - FR002
  - id: partner-dependency
    title: Partner, Platform, and Dependency Risks
    body: >-
      Platform dependency on Apple is structurally significant. Synchron announced native
      BCI-HID integration with Apple iPhone, iPad, and Apple Vision Pro devices (MassDevice),
      and a Synchron patient was reported as the first clinical BCI user of Apple Vision Pro,
      creating named-patient publicity concentration. This integration depends on Apple's
      continued BCI-HID protocol support; a protocol change or access policy shift would impair
      the core everyday-usability value proposition. Apple's May 2024 native eye-tracking
      accessibility announcement simultaneously validates the paralysis-patient market and
      introduces partial substitute risk. Capital-provider dependency is existential for a
      pre-revenue company: Synchron raised $200M Series D (November 2025) and approximately
      AUD 54M NRF support, totaling $345M raised, but is burning capital with no revenue.
      A financing window that closes before the pivotal-trial readout would be fatal to the
      thesis. FDA and CMS are dependency counterparties because the entire revenue thesis is
      gated by their decisions. Implanting-center concentration across three academic centers
      limits demand and creates clinician-departure risk.
    claimRefs:
      - CR018
      - CR019
      - CR024
      - CR025
      - CR026
      - CR030
      - CR031
    tableRefs:
      - TR003
    figureRefs:
      - FR003
  - id: financial-execution
    title: Financial, Execution, and Capital Market Risks
    body: >-
      Financial risk is structural for a pre-revenue, capital-intensive device company. SEC
      EDGAR Form D searches for Synchron Inc confirm private offering rounds but do not disclose
      burn rate, runway, or detailed use of funds — a material financial diligence gap. With
      $345M raised and no revenue, capital exhaustion before approval-plus-reimbursement is the
      central financial risk. Key-person risk is partially mitigated by Riki Banerjee's
      appointment as CTO (January 2024) for technology scale-up and Andy Rasdal's board addition
      for PMA/commercialization experience (December 2023), but the open careers page shows
      active hiring across commercial, regulatory, and engineering roles — signaling the
      commercial organization is still being built in parallel with pivotal-trial execution.
      The NeuroTechX awesome-bci GitHub catalog is a proxy for a thin, fragmented BCI developer
      ecosystem, constraining third-party integration community depth and commercial velocity
      post-approval. A reported $1B+ implied valuation sets a high bar; a delayed approval or
      weak reimbursement rate would pressure future financing terms. The mitigation-and-kill-
      criteria table translates these into monitorable triggers: pivotal readout, CMS coverage
      signals, runway disclosure, and key-person retention.
    claimRefs:
      - CR016
      - CR017
      - CR020
      - CR021
      - CR022
      - CR023
      - CR032
      - CR039
      - CR041
      - CR042
      - CR043
    tableRefs:
      - TR004
      - TR005
    figureRefs: []
