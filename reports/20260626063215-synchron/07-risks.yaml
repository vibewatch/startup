callouts:
  - calloutType: risk
    title: Two binary regulatory gates dominate the risk profile
    body: >-
      FDA PMA approval and a Medicare coverage determination are both non-guaranteed sequential
      gates. InsideBCI's March 2026 analysis identifies Medicare's missing BCI coverage pathway
      as a structural gap with no near-term remedy visible. Precision Neuroscience's 510(k)
      clearance amplifies CMS complexity by establishing a lower-risk BCI regulatory precedent.
      Failure or major delay at either gate converts a clinically credible company into a
      stranded-asset risk regardless of technology quality.
    claimRefs:
      - CR001
      - CR002
      - CR010
      - CR027
      - CR028
  - calloutType: risk
    title: ACQUANDAS and Apple platform create paired single-counterparty dependencies
    body: >-
      ACQUANDAS (thin-film electrode, equity-stake supplier) and Apple (BCI-HID protocol
      integration) together concentrate two critical technology dependencies in single
      counterparties. A supply disruption at ACQUANDAS or a protocol change at Apple would
      each independently impair either the pivotal trial or the core everyday-use value
      proposition. These risks are distinct from the regulatory gates but can accelerate
      capital exhaustion if they materialize simultaneously.
    claimRefs:
      - CR014
      - CR015
      - CR029
      - CR030
      - CR031
