  evidenceGaps:
    - id: GR001
      title: Freedom-to-operate analysis against competitor IP is unconfirmed
      type: missing-source
      severity: material
      topic: legal
      description: >-
        Synchron AU's patent portfolio is searchable on Google Patents, but competitive
        freedom-to-operate analysis against Neuralink, Precision Neuroscience, and other
        BCI filers has not been confirmed from any public source.
      missingEvidence: >-
        Independent FTO opinion letter and IP prosecution history vs. key BCI competitors.
      relatedQuestionRefs:
        - QR005
      relatedTableRefs:
        - TR001
      diligencePath: >-
        Request legal disclosure schedule, FTO opinion letter, and IP prosecution history
        from patent counsel.
      whyItMatters: >-
        Undisclosed infringement risk or injunction exposure could materially impair the
        commercial path and create unquantifiable legal overhang.
    - id: GR002
      title: Long-term implant durability unproven; chronic evidence has COI
      type: missing-source
      severity: material
      topic: clinical
      description: >-
        Safety data is limited to small cohorts with short follow-up; the only chronic
        stability evidence is a company-affiliated preprint with COI disclosure that has
        not been peer-reviewed.
      missingEvidence: >-
        Multi-year longitudinal safety and durability data from an independent
        peer-reviewed source.
      relatedQuestionRefs:
        - QR008
      relatedTableRefs:
        - TR002
      diligencePath: >-
        Review pivotal trial protocol for multi-year follow-up design; request any
        unpublished longitudinal safety datasets from the company.
      whyItMatters: >-
        Durability and rare adverse-event rates are decisive for PMA approval and
        commercial adoption; the current evidence base cannot establish them.
    - id: GR003
      title: ACQUANDAS supply-chain depth and continuity plan undisclosed
      type: missing-source
      severity: material
      topic: operational
      description: >-
        The ACQUANDAS equity stake anchors thin-film electrode supply, but secondary
        source availability, component inventory levels, and manufacturing continuity
        plans are not publicly disclosed.
      missingEvidence: >-
        Supplier-risk assessment, secondary-source analysis, and manufacturing
        continuity and contingency plan.
      relatedQuestionRefs:
        - QR020
      relatedTableRefs:
        - TR003
      diligencePath: >-
        Request supply-chain map, ACQUANDAS production-capacity data, and risk
        assessment covering single-source components for pivotal trial and commercial scale.
      whyItMatters: >-
        A single-source supply failure could halt the pivotal trial or delay commercial
        launch — an existential program-level risk.
    - id: GR004
      title: Burn rate, runway, and unit economics are not publicly disclosed
      type: missing-source
      severity: material
      topic: financial
      description: >-
        SEC Form D filings confirm financing rounds but do not include burn rate, runway,
        or unit-economics detail; financial runway and path to profitability cannot be
        independently validated.
      missingEvidence: >-
        Audited financial statements, quarterly burn summary, and unit-economics model
        including cost-of-goods and reimbursement scenario analysis.
      relatedQuestionRefs:
        - QR024
        - QR021
      relatedTableRefs:
        - TR005
      diligencePath: >-
        Request audited financials, quarterly burn disclosure, and use-of-proceeds
        breakdown for the Series D round.
      whyItMatters: >-
        Capital exhaustion before the pivotal-trial readout would be an existential risk;
        without runway data, this cannot be adequately monitored.
    - id: GR005
      title: Neural-data privacy and post-trial support obligations remain under-specified
      type: missing-source
      severity: material
      topic: legal
      description: >-
        Public materials do not clearly explain how neural data rights, long-term user support,
        or post-trial access obligations would be handled if the company changes strategy,
        runs out of capital, or ceases support.
      missingEvidence: >-
        A published neural-data governance policy, post-trial support plan, and user-rights
        framework covering data ownership, portability, and ongoing clinical support.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR001
      diligencePath: >-
        Request data-governance policy, patient-consent language, and post-trial support
        obligations from management; compare against GAO and neuroethics guidance.
      whyItMatters: >-
        Implanted BCI users face unusually high switching and dependency costs, so unclear
        data-rights and support obligations create legal, ethical, and reputational downside.
