      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The economic structure of this market separates the user, the buyer, and the payer, which is decisive for
              adoption timing. The user is the patient with severe motor impairment — segmented into ALS, spinal cord
              injury (especially tetraplegia), and stroke or locked-in syndrome populations — together with the
              caregiver who supports daily device use. The buyer is the hospital, specifically academic medical centers
              with interventional neurology and neurosurgery programs such as Mount Sinai, UPMC, and the University at
              Buffalo where Synchron's COMMAND trial ran; these institutions own the capital budget and the clinical
              workflow for implantation. The payer is overwhelmingly the government: most ALS and severe-paralysis
              patients in the US are covered by Medicare (including under-65 disability eligibility) or Medicaid, making
              the Centers for Medicare & Medicaid Services the gatekeeper of demand. Budget ownership therefore sits
              across two desks — the hospital's device and procedure budget, which is only unlocked once a reimbursement
              pathway exists, and the federal payer's coverage determination. The adoption trigger for each segment is
              the combination of an FDA-approved indication, an established procedure and device reimbursement code (for
              example a Category I CPT code and a favorable national or local coverage determination), and
              clinical-pathway integration so that neurologists refer eligible patients to implanting centers. Private
              insurers and the Veterans Health Administration (relevant for spinal-cord-injured veterans) form secondary
              payer segments. Because the patient does not pay directly and the prescriber, implanter, and payer are
              different actors, Synchron's go-to-market is a multi-stakeholder reimbursement and clinical-adoption
              problem rather than a conventional sales motion.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
          - type: table
            tableRef: TM003
            claimRefs:
              - CM013
