      - number: '3.2'
        title: Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Neuralink is the most prominent and best-funded direct competitor. Its N1 implant carries 1,024 recording
              electrodes placed directly into cortical tissue via a robotic surgical system. The company received FDA
              Breakthrough Device designation for its BCI to help restore speech function in patients with communication
              impairments, establishing regulatory priority in a BCI indication that overlaps with Synchron's ALS and
              paralysis target population. Neuralink's vertical integration — robotic surgery platform, custom ASIC,
              app-layer Telepathy interface — creates a potentially deep moat if it achieves PMA, but the open-skull
              craniotomy requirement limits the patient population to those who can withstand intracranial surgery and
              complicates the neurosurgical credentialing path.

              Precision Neuroscience has developed the Layer 7 Cortical Interface, a thin-film subdural
              electrocorticography array with 1,024 electrodes placed on the brain surface without penetrating the
              cortex. Precision received 510(k) clearance for short-term use (up to 30 days) and had enrolled 37
              patients in clinical procedures as of the MassDevice clearance report. The 510(k) pathway allows Precision
              to build neurosurgical center relationships, train implanting surgeons, and generate commercial clinical
              experience years before Synchron achieves PMA. This creates a center-access lock-in risk for Synchron in
              neurosurgical programs.

              Blackrock Neurotech manufactures the Utah Array intracortical electrode system, with the longest human
              implant research record of any BCI platform. Blackrock's modular research platform serves academic
              institutions, government research, and clinical researchers globally. The company's for-researchers
              platform is commercially available as an institutional tool but does not constitute an FDA-approved
              commercial product for permanent paralysis management as of June 2026. Its distribution is
              research-institution-driven.

              BrainGate is a multi-institutional academic research consortium anchored at Brown University, Stanford,
              Massachusetts General Hospital, and Case Western Reserve. It is not a commercial company and does not
              offer a packaged commercial product. BrainGate has published extensively on intracortical BCI performance
              but relies on FDA-approved investigational device exemptions for trial-phase use. Its competitive
              relevance to Synchron is primarily in clinical data generation that informs the regulatory and clinical
              community.

              Paradromics is a clinical-stage BCI company targeting high-data-rate neural recording, particularly for
              speech synthesis in patients with severe paralysis. The company's official news hub does not disclose
              clinical trial enrollment numbers or FDA status in the sources reviewed as of June 2026. Paradromics
              represents a future competitor for speech-BCI but is at an earlier development stage than Synchron or
              Neuralink for paralysis use cases.

              Tobii Dynavox is the market-leading provider of augmentative and alternative communication (AAC) devices
              based on eye-tracking technology. Tobii Dynavox products are commercially available, Medicare and Medicaid
              covered under durable medical equipment benefit categories, and used widely by ALS, SCI, and other
              severely paralyzed patients for text entry and device control. As a non-surgical substitute, Tobii Dynavox
              addresses the same communication restoration job as the Stentrode for patients who retain functional eye
              movement.
