      - number: '6.2'
        title: Hospital and Clinical-Site Customers and Named Patient Proof
        blocks:
          - type: paragraph
            body: >-
              The most concrete, verifiable customers Synchron has today are the academic medical centres that serve as
              implanting and research sites. The COMMAND early-feasibility study ran at three principal US sites — Mount
              Sinai Health System in New York, the University at Buffalo's Gates Vascular Institute, and UPMC in
              Pittsburgh in collaboration with Carnegie Mellon University — with the programme supported by the NIH
              BRAIN Initiative. Patient enrollment was completed with six patients across these three centres; no deaths
              or serious device-related adverse events were reported at the one-year follow-up. The first US implant was
              performed at Mount Sinai West in 2022, led by Dr. Shahram Majidi, with discharge within 48 hours. The
              named patient proof that provides the strongest customer validation centres on Mark, a 64-year-old man
              with ALS who became the first person to use Apple Vision Pro through thought control via the Stentrode,
              and then in August 2025 completed the first thought-controlled iPad interaction under Apple's new BCI
              Human Interface Device protocol. Earlier, four patients in the Australian SWITCH study all learned BCI
              control and the 12-month safety endpoint was met — published in JAMA Neurology. Two ALS patients
              documented in peer-reviewed literature (PMID 33115813) performed home tasks including texting, shopping,
              and managing finances by thought alone. Synchron's OpenAI-powered chat feature was also demonstrated with
              a named patient user, showing AI-assisted communication as a patient-facing expansion capability. These
              named deployments are exclusively investigational, not paying production customers; they represent
              clinical proof of concept at prestigious institutions, not a commercial customer base.
