  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              The dominant risk to Synchron is regulatory: the company has not yet completed a pivotal trial or obtained
              FDA pre-market approval (PMA), and approval is a binary, non-guaranteed event. FDA's own Breakthrough
              Devices Program guidance states that designation expedites review but does not guarantee approval or
              reimbursement. Industry analysis confirms there is no quick PMA path for implantable BCIs even with
              Breakthrough status — the multi-year evidence burden is unchanged. Layered on top of approval risk is
              reimbursement risk: InsideBCI's March 2026 analysis identifies Medicare's missing coverage pathway for
              BCIs; there is no national coverage determination and no BCI-specific procedure code. The CMS LCD L33739
              for speech-generating devices provides a baseline comparator but does not cover BCIs. Precision
              Neuroscience's FDA 510(k) clearance for a cortical BCI interface creates a competitive and regulatory
              wedge: it sets precedent that lower-acuity BCI elements can clear the 510(k) bar, complicating CMS's
              willingness to cover the higher-acuity, implanted Stentrode. Legal risks are presently low-visibility but
              structurally important: Synchron Australia's patent portfolio is visible on Google Patents but
              freedom-to-operate analysis against Neuralink, Precision, and other filers has not been independently
              confirmed. Neural data under HIPAA and emerging neurorights statutes creates compliance risk that is
              under-disclosed. Post-market obligations (MAUDE reporting, QSR, anti-kickback) apply once reimbursement
              begins.
            claimRefs:
