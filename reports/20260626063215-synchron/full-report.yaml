      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Two binary regulatory gates dominate the risk profile
            body: >-
              FDA PMA approval and a Medicare coverage determination are both non-guaranteed sequential gates.
              InsideBCI's March 2026 analysis identifies Medicare's missing BCI coverage pathway as a structural gap
              with no near-term remedy visible. Precision Neuroscience's 510(k) clearance amplifies CMS complexity by
              establishing a lower-risk BCI regulatory precedent. Failure or major delay at either gate converts a
              clinically credible company into a stranded-asset risk regardless of technology quality.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR027
              - CR028
          - type: callout
            title: ACQUANDAS and Apple platform create paired single-counterparty dependencies
            body: >-
              ACQUANDAS (thin-film electrode, equity-stake supplier) and Apple (BCI-HID protocol integration) together
              concentrate two critical technology dependencies in single counterparties. A supply disruption at
              ACQUANDAS or a protocol change at Apple would each independently impair either the pivotal trial or the
              core everyday-use value proposition. These risks are distinct from the regulatory gates but can accelerate
              capital exhaustion if they materialize simultaneously.
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
              - CR029
              - CR030
              - CR031
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Implied Valuation
        blocks:
          - type: paragraph
            body: >-
              Synchron's November 2025 Series D anchors the valuation analysis. The company raised a $200 million round
              led by Double Point Ventures, lifting total capital raised to approximately $345 million and, per company
              and independent reporting, implying a post-money valuation near $1 billion. That figure is an implied mark
              rather than a disclosed multiple: Synchron is pre-revenue, so the valuation rests on probability-weighted
              future cash flows gated by FDA pre-market approval and Medicare coverage, not on current financials.
              Secondary-market activity tracked by independent analysts has implied a value close to the Series D mark,
              with reported trades at a modest premium, which is corroborating but thin evidence. Our recommendation is
              therefore a price-sensitive "track / conditional-participate" rather than an unqualified buy: the
              technology and clinical record are credible, but the valuation is milestone-contingent and the next
              financing will reprice the company on the pivotal-trial outcome. The recommendation-summary and
              thesis/anti-thesis tables below set out the explicit conditions — a clean pivotal readout and visible CMS
              coverage progress would justify leaning in, while a missed endpoint, stalled reimbursement, or a closed
              financing window would break the thesis. Because Synchron is a venture-stage medical-device company, the
              appropriate method is scenario and comparable-based rather than a discounted-cash-flow model built on
              false precision, and the implied $1B mark should be read as the base case in a wide distribution, not a
              point estimate.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV017
              - CV019
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV017
      - number: '8.2'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >-
              Relative valuation is the most defensible lens for a pre-revenue BCI company, and the comparable set spans
              private BCI peers and public neurotech benchmarks. Neuralink is the closest BCI peer by technology
              category but sits several multiples above Synchron: it has been reported targeting a roughly $9 billion
              private valuation, though a closed round at that level is not uniformly confirmed, so the headline peer
              mark is itself uncertain. Precision Neuroscience, a US cortical-surface competitor, is earlier and
              smaller, with reported post-money discussions in the few-hundred-million range, placing Synchron between
              the two on the private-BCI spectrum. Paradromics and Blackrock Neurotech provide directional private
              comparables but disclose little. On the public side, ONWARD Medical offers a listed implantable-neurotech
              reference at a far smaller market capitalization, while Medtronic anchors the mature end of the
              device-valuation spectrum at a market capitalization above $100 billion, useful only as a terminal
              benchmark rather than a stage-matched comp. The comparable-valuation table enumerates these peers with the
              metric, reported value, relevance, and explicit limitation for each; because most marks are private,
              unconfirmed, or modality-mismatched, the table is partial by construction and the evidence gap below
              records what disclosure would tighten it. The key takeaway is that Synchron's ~$1B implied valuation is
              internally consistent with the private-BCI peer set — comfortably below Neuralink and above Precision —
              but every comparison carries a modality or stage caveat that limits precision.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV004
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV022
              - CV023
              - CV024
      - number: '8.3'
        title: Scenarios, Value Drivers, and Return Range
        blocks:
          - type: paragraph
            body: >-
              The valuation distribution is wide and milestone-driven, so we frame it as bull, base, and bear scenarios
              tied to explicit assumptions. In the bull case, a clean pivotal readout, FDA PMA, and favorable CMS
              coverage with a dedicated procedure code support a step-up well above the current mark as the company
              approaches commercial revenue and is repriced against approved-device economics. The base case holds the
              ~$1B implied mark roughly flat to modestly up, reflecting continued clinical progress but unresolved
              reimbursement and pre-revenue status, with at least one further dilutive raise before approval. The bear
              case — a missed or delayed pivotal endpoint, stalled reimbursement, or a closed financing window — implies
              a down round and material valuation impairment. The principal value drivers are the same gates identified
              in the risk chapter: pivotal-trial success, reimbursement coverage, manufacturing and quality scale-up,
              the everyday-usability moat from Apple and NVIDIA integrations, and the size of the addressable paralysis
              population. The valuation-sensitivity figure ranks how each driver moves the outcome, with approval
              probability and reimbursement rate dominating; the return-range figure translates the scenarios into
              low/base/high valuation outcomes with explicit dilution assumptions. Because the company is pre-revenue,
              returns are highly convex and binary: most of the expected value sits in the approval-and-coverage path,
              which is precisely why the recommendation is conditioned on monitorable milestones rather than issued
              unconditionally.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV017
              - CV018
              - CV019
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV007
              - CV025
      - number: '8.4'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              A price-sensitive recommendation is only useful if it is paired with monitorable thesis-break triggers and
              a concrete diligence list. The thesis-break-and-kill-triggers table translates the valuation case into
              measurable events: a missed pivotal endpoint or major delay, no CMS coverage progress within a defined
              window after approval, runway falling below twelve months without a term sheet, a serious device-related
              adverse event, or a competitor achieving a decisive capability or regulatory lead. Any of these would
              re-underwrite the company downward and most would imply a down round. On the upside, a clean pivotal
              readout plus visible reimbursement progress would justify increasing exposure at the next round. The
              final-diligence-asks table records what an underwriter must obtain before committing at or above the
              current mark: the Series D term sheet and preference stack to understand the real per-share economics
              behind the implied valuation, a runway and burn disclosure to size financing risk, the pivotal-trial
              protocol and any interim safety data, a freedom-to-operate and IP opinion against the competitor patent
              landscape, and reimbursement strategy detail including any CMS engagement. Each ask maps to an owner or
              diligence path. Because Synchron declines to disclose burn, unit economics, and the detailed cap table
              publicly, the honest valuation conclusion is that the ~$1B implied mark is plausible and peer-consistent
              but not independently verifiable without these disclosures, which is why the recommendation prefers
              track-and-condition over commit-at-any-price.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV005
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV006
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The ~$1B mark is an implied, milestone-contingent valuation
            body: >-
              Synchron is pre-revenue, so the ~$1B Series D mark reflects probability-weighted future cash flows gated
              by FDA approval and CMS coverage, not current financials. It is best read as the base case in a wide
              distribution.
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV017
          - type: callout
            title: Valuation is peer-consistent but not independently verifiable
            body: >-
              The mark sits sensibly below Neuralink and above Precision, but Synchron does not disclose burn, unit
              economics, or the detailed cap table, so the valuation cannot be independently confirmed without further
              diligence.
            calloutType: risk
            claimRefs:
              - CV008
              - CV031
              - CV032
