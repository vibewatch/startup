      - number: '1.6'
        title: Risks, Criticisms, and Competitive Challenges
        blocks:
          - type: paragraph
            body: >-
              Synchron's endovascular approach embeds a fundamental trade-off: 16 electrodes within blood vessels
              capture a coarser neural signal than intracortical implants. Neuralink's N1 chip has 1,024 cortical
              electrodes; Precision Neuroscience's surface array also reaches 1,024 channels. The COMMAND feasibility
              study established safety with six patients but has not yet provided the efficacy evidence at scale that a
              pivotal trial must demonstrate.


              The U.S. GAO's 2024/2025 report on brain-computer interfaces identifies four challenge categories directly
              applicable to Synchron: (1) data ownership and privacy — no unified legal framework for brain signal data;
              (2) potential loss of access — risk that patients lose device support if a company ceases operations; (3)
              Medicare and insurance coverage — CMS reimbursement pathway is not yet established; and (4) long-term
              safety — existing clinical data covers only 12 months in small cohorts. Frontiers journal's 2025 analysis
              of BCI ethics adds concerns about informed consent in vulnerable populations and neural data privacy.


              Competitive dynamics are accelerating. Precision Neuroscience has partnered with Medtronic. Science
              Corporation reached an implied USD 1.5 billion valuation, BrainCo USD 1.3 billion, and Merge Labs emerged
              at USD 850 million. No BCI company holds FDA PMA approval for a permanently implanted device as of
              mid-2026.


              Revenue is zero for this pre-commercial company. Headcount, burn rate, and financial data are not publicly
              disclosed. Key-person concentration in Oxley, cybersecurity risks from wireless neural devices, and future
              payer coverage uncertainty are additional diligence items.
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO030
      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: First and Only Endovascular BCI with FDA IDE for Permanently Implanted Device
            body: >-
              Synchron holds the first-ever FDA Investigational Device Exemption for a permanently implanted BCI,
              placing it uniquely ahead of all competitors in the regulatory pathway. Combined with FDA Breakthrough
              Device Designation and positive COMMAND safety data in six US patients, Synchron has the strongest US
              clinical regulatory credentials in the permanently implanted BCI space entering its 2026 pivotal trial.
            calloutType: strength
            claimRefs:
              - CO018
              - CO016
              - CO033
          - type: callout
            title: Apple BCI HID Integration and NVIDIA Partnership Expand Platform Ecosystem
            body: >-
              The May 2025 Apple BCI HID native integration makes Synchron the first BCI company formally recognized as
              an input device category by Apple, bridging the gap between medical device and consumer technology
              ecosystem. The NVIDIA Holoscan partnership for on-device edge AI decoding addresses the latency limitation
              of the 16-electrode system. Together these partnerships validate the platform beyond the clinical trial
              context.
            calloutType: strength
            claimRefs:
              - CO011
              - CO009
          - type: callout
            title: 16-Electrode Signal Fidelity Gap and Feasibility-Stage Evidence
            body: >-
              The Stentrode's 16 electrodes provide coarser signal resolution than competitors. The COMMAND trial
              established safety in only six patients over 12 months. Efficacy at pivotal scale, long-term safety beyond
              12 months, FDA PMA approval, and the reimbursement pathway all remain unproven. The 2026 pivotal trial is
              the decisive gate before commercialisation.
            calloutType: risk
            claimRefs:
              - CO027
              - CO028
              - CO030
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Synchron competes in the implantable brain-computer interface (BCI) market — medical devices that read
              neural signals and translate intention into digital control for people who have lost motor or speech
              function. The relevant boundary is the clinical, invasive/endovascular BCI segment used to restore digital
              agency for severe paralysis, not the broader category that also counts non-invasive consumer EEG headsets,
              neurofeedback wellness gadgets, or research-only laboratory rigs. Included spend is the implant device,
              the implantation procedure (a roughly 20-minute endovascular deployment via the jugular vein for the
              Stentrode), the external signal-processing unit, software, and ongoing clinical support. Excluded spend
              covers deep brain stimulation for Parkinson's, cochlear implants, and assistive augmentative communication
              (AAC) tools such as eye-tracking tablets, which address overlapping users but through different
              mechanisms. The status-quo substitutes a buyer can choose instead of a BCI are exactly these AAC and
              caregiver-mediated communication methods, plus doing nothing. Because no implantable BCI has yet received
              FDA pre-market approval or a national reimbursement code, the present market is pre-commercial: revenue
              today is effectively zero and the addressable market is a forward-looking construct gated by regulatory
              approval and payer coverage. Defining the boundary this tightly matters because headline BCI market
              figures blend consumer and medical categories that grow at very different rates and carry very different
              adoption barriers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
