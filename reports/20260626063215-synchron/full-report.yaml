      - number: '6.3'
        title: Payer Landscape, Coverage Gap, and Retention Analog
        blocks:
          - type: paragraph
            body: >-
              For an implantable medical device whose patients are predominantly elderly or disabled, the decisive
              customer is the payer, and in the US that means the Centers for Medicare and Medicaid Services. Most ALS
              and severe-paralysis patients qualify for Medicare (including under-65 disability eligibility) or
              Medicaid, so federal coverage policy, not patient willingness to pay, governs demand. As of mid-2026 there
              is no national coverage determination listing implantable brain-computer interface devices, and no
              BCI-specific procedure code, meaning that even after FDA approval the device would face a separate,
              uncertain, and potentially slow coverage process. The InsideBCI policy analysis published 21 March 2026
              identifies this as a structural gap: Medicare has no dedicated pathway for BCI implants, and without a
              pathway, post-approval adoption depends on individual contractor adjudication rather than a national
              standard. The SGD coverage framework under LCD L33739 provides a relevant payer reference — Synchron must
              eventually achieve comparable reimbursement clarity. Tobii Dynavox SGDs are the incumbent technology
              patients currently use, and payers have established coverage precedent for them; BCIs must meet a higher
              cost-effectiveness bar. Durability of the customer relationship is therefore better understood as
              durability of coverage than as conventional retention: once a favourable coverage determination and
              procedure code exist, demand can become durable and recurring as newly diagnosed eligible patients need
              devices each year; until then there is no recurring revenue to retain. Secondary payers include private
              insurers and the Veterans Health Administration.
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU020
              - CU021
              - CU022
