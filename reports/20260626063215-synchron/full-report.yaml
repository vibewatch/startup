  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Use Cases, and Module Map
        blocks:
          - type: paragraph
            body: >-
              Synchron's product is the Stentrode system: the first brain-computer interface designed to be implanted
              without open-brain surgery, giving a person with severe paralysis hands-free digital control by intention
              alone. In customer-workflow terms, the patient thinks about a movement, the device detects the
              corresponding motor-cortex signal, and that signal is decoded into a digital command—a cursor click, a
              text message, a Vision Pro selection—without any limb movement. The 2020 first-in-human paper (PubMed
              33115813) showed two ALS patients using the system at home for texting and web browsing. Demonstrated use
              cases now span cursor control, text messaging, Apple Vision Pro and iPad native operation, and
              OpenAI-powered AI chat—all under investigational clearance. The module map has five distinct assets: the
              Stentrode implant (16-electrode nitinol stent array), the internal chest telemetry unit, the external
              processing unit, the Chiral AI decoding model, and the Apple BCI-HID integration layer. A manufacturing
              module anchors supply-chain diligence: the electrode array is produced via MEMS thin-film sputtering by
              Acquandas, a German specialist in which Synchron holds an equity stake. The regulatory caveat governs all
              commercial claims: the system is investigational only, limited by US federal law to investigational use,
              and is not approved for commercial implantation outside clinical trials.
            claimRefs:
