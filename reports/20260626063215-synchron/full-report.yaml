      - number: '7.2'
        title: Clinical Safety and Durability Risks
        blocks:
          - type: paragraph
            body: >-
              Clinical-safety risk is intrinsic to an implanted brain device. Four trials are registered across
              ClinicalTrials.gov — COMMAND (NCT05035823), SWITCH Australia (NCT03834857), and two additional active
              trials (NCT07543367, NCT07533903) — demonstrating an expanding program with simultaneous enrollment risks.
              MassDevice reports SWITCH 12-month safety results as positive but n is small, so long-term durability,
              signal stability over years, and rare adverse events are not established at commercial scale. The only
              chronic stability evidence is a preprint (PubMed PMID 41040697) with company-affiliated authors who
              disclose conflicts of interest; it has not yet been peer-reviewed, limiting its evidentiary weight. The
              peer-reviewed first home-use case (PMID 33115813) establishes technical feasibility but minimal
              generalizability for durability projections. Nature Reviews Bioengineering identifies systemic barriers to
              implantable BCI trials — small eligible populations, complex consent, long required follow-up, limited
              implanting infrastructure — that directly increase the risk of any single trial missing its endpoints. The
              endovascular design introduces vascular-specific failure modes including thrombosis, device migration, and
              stenosis requiring antiplatelet management. These risks are ranked in the operational register.
