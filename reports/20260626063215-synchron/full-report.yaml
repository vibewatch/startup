      - number: '5.2'
        title: System Architecture and Manufacturing Process
        blocks:
          - type: paragraph
            body: >-
              The Stentrode system has three hardware layers and a multi-tier software stack. The sensing layer is the
              Stentrode electrode array itself: a self-expanding nitinol stent carrying sixteen platinum electrodes
              deployed through the jugular vein into the superior sagittal sinus, which runs immediately adjacent to the
              motor cortex. The chest layer is an internal telemetry unit implanted subcutaneously and connected to the
              electrode lead via a subcutaneous tunnel; this unit transmits neural signals wirelessly through the chest
              wall to an external processing unit. The external unit runs the software stack: Chiral, described by
              Synchron as a neural-decoding foundation model that generalises across patients and sessions, running on
              NVIDIA Holoscan for low-latency edge-AI inference; and the Apple BCI-HID driver that maps decoded
              intention to native iPhone, iPad, and Vision Pro input events. The manufacturing process for the core
              hardware is technically demanding. Per Synchron CTO Riki Banerjee in trade media, the electrode array is
              manufactured using MEMS-style sputtered thin-film nitinol deposited on a silicon wafer; the film is
              released from the wafer and rolled onto a mandrel to form the stent shape. This process requires highly
              specialised equipment. In January 2024 Synchron acquired an equity stake in Acquandas, a German MEMS and
              thin-film manufacturer, to secure this production step. Acquandas serves as the strategic manufacturing
              partner for thin-film nitinol, creating a material single-supplier dependency that the critical dependency
              map highlights.
            claimRefs:
