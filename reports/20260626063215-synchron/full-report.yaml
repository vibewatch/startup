      - number: '5.3'
        title: Trust, Safety, Clinical Evidence, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Safety and compliance for the Stentrode system are governed by the medical-device regulatory regime. Four
              trials form the clinical evidence base: SWITCH (NCT03834857, four Australian patients, 12-month safety
              published in JAMA Neurology), COMMAND (NCT05035823, six US patients, primary safety endpoint met 2024,
              2025 preprint reporting 16-channel chronic stability data), INTENT (NCT07543367), and FOCUS-AUS
              (NCT07533903). The 2025 COMMAND stability preprint (PubMed 41040697) includes author conflict-of-interest
              disclosures noting company affiliations and patent interests. Synchron holds FDA Breakthrough Device
              Designation (2020) and the first FDA IDE for a permanently implanted BCI (2021). Commercial deployment
              requires a full FDA pre-market approval (PMA), which is more demanding than IDE clearance. ISO 13485
              quality-management-system conformance is required for PMA manufacturing, but Synchron's certification
              status is not publicly confirmed. Endovascular-specific risks—vessel thrombosis, lead migration,
              stenosis—require antiplatelet or anticoagulation management. Two trust areas are absent from public
              documentation: no cybersecurity architecture or wireless neural-data link encryption specification is
              published; and no neural-data privacy policy covering raw or decoded brain signals is disclosed. The
              company statement that brain data is not shared with OpenAI in the chat feature is a positive but narrow
              data point. Long-term durability and rare adverse events remain uncharacterised given the small total
              patient count across all trials.
            claimRefs:
