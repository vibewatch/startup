      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers favor the market. An aging population is increasing the absolute number of ALS
              and stroke survivors; the broader BCI market's high-teens CAGR reflects rising investment and clinical
              validation; and Synchron's ecosystem partnerships — native Apple BCI-HID integration announced in 2025 and
              an NVIDIA Holoscan edge-AI collaboration — lower the integration cost of turning neural signals into
              everyday device control, expanding perceived utility. Regulatory tailwinds matter too: FDA Breakthrough
              Device Designation and the first IDE for a permanently implanted BCI give Synchron a clearer path and
              potential reimbursement add-ons such as new technology add-on payments. The constraints, however, are
              formidable and largely gate timing rather than ultimate size. The single largest is reimbursement: as of
              mid-2026 there is no Medicare national coverage determination for implantable BCIs, so even an approved
              device has no guaranteed payment, and the GAO and independent commentators flag reimbursement and
              demonstrated long-term benefit as unresolved. Regulatory risk is real because Synchron must still complete
              a pivotal trial and win PMA. Capital intensity is high — medical-device commercialization, sales
              infrastructure, and multi-year trials require sustained funding against the USD 345 million raised to
              date. Switching costs and trust barriers also slow adoption: an implant is irreversible relative to an
              eye-tracker, raising the clinical evidence bar, and the 16-electrode endovascular design trades signal
              bandwidth for safety, which competitors with higher channel counts attack. Net, the drivers expand the
              long-run ceiling while the constraints push meaningful revenue years into the future and make payer
              engagement the rate-limiting step.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
