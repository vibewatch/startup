      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              Sizing the opportunity requires multiple lenses because no single published figure isolates the
              endovascular-BCI-for-paralysis segment Synchron actually serves. The top-down analyst lens values the
              entire global BCI market at roughly USD 2.9 billion in 2025 and USD 3.3 billion in 2026, scaling to about
              USD 13.9 billion by 2035 at a compound annual growth rate near 16.8 percent per Precedence Research, with
              MarketsandMarkets, SNS Insider, and Fortune Business Insights publishing broadly similar double-digit
              trajectories. However, that figure includes non-invasive and research BCIs, so it overstates Synchron's
              reachable market while understating the long-run value of a reimbursed implantable platform. The bottom-up
              patient lens starts from disease prevalence: approximately 34,700 Americans live with ALS, about 308,000
              with traumatic spinal cord injury, and roughly 5.4 million with some form of paralysis, of which stroke
              causes about a third. The implant-eligible subset — people with severe upper-limb paralysis or loss of
              speech who retain intact motor cortex signaling — is far smaller, plausibly in the low hundreds of
              thousands in the US and on the order of a million globally. Applying a hypothetical blended
              device-plus-procedure price (Synchron has not disclosed pricing) yields a serviceable addressable market
              (SAM) that is large in aggregate but realizable only over many years and contingent on reimbursement. The
              serviceable obtainable market (SOM) over the first three to five years post-approval is much narrower: an
              initial PMA indication (likely ALS and severe paralysis), a handful of high-volume implanting centers, and
              modest penetration. We therefore treat the SAM and SOM as evidence-constrained estimates, not precise
              figures, and preserve the contradictions between the top-down and bottom-up lenses as a diligence gap.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
