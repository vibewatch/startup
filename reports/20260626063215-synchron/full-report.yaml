      - number: '3.5'
        title: Adverse Evidence and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              The most significant adverse finding for Synchron's competitive position is the electrode count gap.
              Synchron's 16-channel Stentrode captures far less neural signal than Neuralink's 1,024-electrode N1 or
              Precision's 1,024-electrode Layer 7 array — a 64:1 channel count disadvantage. Greater channel count
              generally enables richer decoding, faster typing rates, more nuanced motor-intent classification, and
              future multi-limb prosthetic control. If the BCI market evolves toward richer neural interfaces for
              communication or prosthetic applications, Synchron's 16-channel constraint is a structural capability
              ceiling that cannot be addressed without a generation change to its next-generation multi-channel
              transcatheter interface in stealth development at the San Diego hub.

              Precision Neuroscience's 510(k) clearance creates a competitive beachhead. By deploying its
              1,024-electrode device in neurosurgical centers under short-term clearance, Precision is building center
              familiarity, training surgical staff, and accumulating clinical performance data. Synchron's PMA advantage
              in the permanent implant category may be offset if Precision's center-access position converts into a
              preference for Precision's platform at the commercial launch decision point.

              Non-surgical substitutes represent the largest volumetric competitive threat. Tobii Dynavox and similar
              eye-tracking AAC systems satisfy the communication needs of most paralyzed patients who retain functional
              gaze control — the large majority of ALS patients through most of their disease course. These substitutes
              require no surgery, carry no implant risk, are covered by existing Medicare/Medicaid DME codes, and are
              immediately deployable. The Stentrode's clinical superiority emerges only when eye control fails
              (late-stage ALS locked-in syndrome) or when the patient requires richer device control than eye-tracking
              can deliver.

              Synchron's CCO Kurt Haggstrom acknowledged in a Medical Design and Outsourcing interview that there is no
              quick path to market for a permanently implanted neural device and that the PMA pathway is the most
              rigorous FDA track. This explicit recognition creates a window for Precision to deepen hospital
              relationships, for Neuralink to generate more patient data, and for substitutes to entrench their position
              before Synchron's commercial launch.
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
              - CP038
              - CP039
              - CP040
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Endovascular Delivery Is a Structural Differentiation That Cannot Be Easily Replicated
            body: >-
              No competitor in the implanted BCI segment has an endovascular catheter-based approach; all direct rivals
              require craniotomy. This distinction creates a distinct surgical specialty (neurointerventional) required
              for implantation, a distinct hospital department workflow (catheter lab vs. neurosurgical OR), and a
              distinct patient-eligibility segment. Replicating this approach requires years of catheter engineering, a
              new body of clinical evidence for the endovascular route, and regulatory work to establish the
              endovascular BCI as a credible class. Synchron has a 7-year head start on this specific path from its 2019
              first-in-human SWITCH study.
            calloutType: strength
            claimRefs:
              - CP018
              - CP003
          - type: callout
            title: Precision Neuroscience's 510(k) Beachhead Creates a Distribution Disadvantage Before PMA
            body: >-
              Precision Neuroscience's 510(k) clearance for short-term cortical recording enables it to deploy its
              1,024-electrode thin-film array in neurosurgical centers today. Each deployment trains a surgeon, builds
              an institutional protocol, and creates a relationship between Precision and the hospital that will
              influence the commercial BCI platform decision at PMA. Synchron's endovascular neurointerventional
              workflow requires a different hospital department and a different specialist, providing partial insulation
              from this dynamic — but Synchron cannot build the same type of pre-commercial center familiarity that
              Precision is generating through its 510(k) deployments.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP034
          - type: callout
            title: 16-Channel Constraint Is a Structural Signal-Fidelity Ceiling
            body: >-
              Synchron's thesis is that safety and deployment simplicity outweigh channel count for current clinical use
              cases (binary motor-intent to digital switch actions). This thesis is coherent for simple communication
              and switch-access tasks. However, as BCI applications expand toward richer neural decoding — continuous
              cursor control, speech synthesis at full vocabulary, complex prosthetic control — the performance gap
              between 16 channels and 1,024 channels could become commercially disqualifying for higher-value
              applications. The next- generation high-channel transcatheter interface in stealth development at
              Synchron's San Diego hub is the hedge against this risk, but it is not a shipped product.
            calloutType: risk
            claimRefs:
              - CP031
              - CP032
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              Synchron is a pre-revenue, pre-commercial medical-device company: its Stentrode endovascular
              brain-computer interface remains an investigational device limited by US federal law to investigational
              use, so the company books effectively no product revenue as of mid-2026. The intended revenue model, once
              an FDA pre-market approval (PMA) is secured, is a hospital-based implantable-device model with three
              plausible streams. The first and largest is the implantable device itself — the Stentrode plus its
              external signal-processing unit — sold to academic medical centers and reimbursed under inpatient or
              outpatient procedure payment. The second is the implantation procedure economics, where Synchron benefits
              indirectly because a reimbursed Category I procedure code and a favorable Medicare coverage determination
              are what unlock the device sale; the company may also pursue a New Technology Add-On Payment (NTAP) to
              bridge early reimbursement. The third, more speculative stream is recurring software, data, and
              clinical-support services tied to the Chiral neural-decoding platform and Apple/NVIDIA integrations, which
              could convert a one-time hardware sale into a longer revenue relationship. Synchron has not disclosed any
              pricing, so list price, realized price, and revenue mix are all unknown. The monetization model therefore
              resembles other implantable neurostimulation businesses (deep brain stimulation, cochlear implants) rather
              than a software or subscription model, and revenue recognition will be gated entirely by regulatory
              approval and payer coverage rather than by sales execution alone. Because no revenue exists yet, every
              figure in this chapter that is dollar-denominated is an estimate or a forward construct, explicitly
              labeled as such.
