            body: >-
              Financial risk is structural for a pre-revenue, capital-intensive device company. SEC EDGAR Form D
              searches for Synchron Inc confirm private offering rounds but do not disclose burn rate, runway, or
              detailed use of funds — a material financial diligence gap. With $345M raised and no revenue, capital
              exhaustion before approval-plus-reimbursement is the central financial risk. Key-person risk is partially
              mitigated by Riki Banerjee's appointment as CTO (January 2024) for technology scale-up and Andy Rasdal's
              board addition for PMA/commercialization experience (December 2023), but the open careers page shows
              active hiring across commercial, regulatory, and engineering roles — signaling the commercial organization
              is still being built in parallel with pivotal-trial execution. The NeuroTechX awesome-bci GitHub catalog
              is a proxy for a thin, fragmented BCI developer ecosystem, constraining third-party integration community
              depth and commercial velocity post-approval. A reported $1B+ implied valuation sets a high bar; a delayed
              approval or weak reimbursement rate would pressure future financing terms. The mitigation-and-kill-
              criteria table translates these into monitorable triggers: pivotal readout, CMS coverage signals, runway
              disclosure, and key-person retention.
