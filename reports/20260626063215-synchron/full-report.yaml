  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Synchron competes in a structurally immature market where no permanently implanted brain-computer
              interface has received commercial FDA approval as of June 2026. The competitive set spans three tiers:
              direct implanted-BCI rivals working toward similar use cases (Neuralink, Precision Neuroscience, Blackrock
              Neurotech, BrainGate, Paradromics), a commercially established non-surgical substitute (Tobii Dynavox),
              and a status-quo default where patients remain unserved or manage with low-tech adaptive equipment. No
              competitor has achieved a commercially launched permanently implanted BCI in the United States, making the
              regulatory race as important as the technological one.

              The landscape is defined by a fundamental surgical-risk versus signal-fidelity trade-off. Cortical
              implants—inserted directly into or onto brain tissue—achieve electrode counts of 1,024 or more (Neuralink
              N1, Precision Layer 7 Cortical Interface) and capture richer motor-intent signals at the cost of
              open-skull surgery. Endovascular approaches (Synchron Stentrode) sacrifice channel count (16 electrodes)
              in exchange for a catheter- based deployment that avoids craniotomy entirely. Academic systems (Blackrock
              Utah Array, BrainGate) occupy the high-channel cortical tier but lack commercial packaging.

              Morgan Stanley's September 2024 BCI analysis, as reported by MassDevice, names Synchron, Neuralink,
              Precision Neuroscience, and Blackrock among the key companies in the $400 billion long-run BCI
              opportunity, but cautions that limited penetration is expected in the first 20 years. As of mid-2026, the
              competitive dynamic is shaped less by commercial market share and more by which company achieves the first
              FDA PMA, which company builds the first repeatable commercial surgical workflow, and which company locks
              in the hardware-to-OS distribution relationship that will define ecosystem economics.
            claimRefs:
