      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The endovascular design is a deliberate safety-for-bandwidth trade
            body: >-
              By recording from a vein adjacent to cortex rather than penetrating brain tissue, Synchron avoids
              craniotomy and lowers surgical risk, but accepts 16 channels versus 1,000 or more for intracortical
              competitors. This trade is the product's core safety advantage and its primary capability limitation, and
              it is the crux of both the competitive thesis and the next- generation bandwidth roadmap.
            calloutType: insight
            claimRefs:
              - CE002
              - CE022
              - CE023
          - type: callout
            title: Single-supplier manufacturing dependency on Acquandas
            body: >-
              The sputtered thin-film nitinol process requires specialised MEMS equipment concentrated at a single
              German supplier. Synchron's equity stake in Acquandas partially mitigates but does not eliminate exposure
              to disruption from yield issues, geopolitical risk, or capacity constraints. A manufacturing interruption
              would directly halt implant supply.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
          - type: callout
            title: Cybersecurity and neural-data privacy are absent from public documentation
            body: >-
              Neural signals are among the most sensitive personal data. No security architecture for the wireless
              neural-data link, and no public data-handling policy for raw or decoded brain signals, is available from
              Synchron. This gap is material for hospital procurement, regulatory submission, and investor diligence at
              scale.
            calloutType: risk
            claimRefs:
              - CE027
              - CE028
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patient Population and Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Synchron's ultimate customer is segmented across three roles that rarely coincide in one person: the
              patient-user who receives the implant, the hospital that buys and implants the device, and the payer that
              reimburses it. The patient-user segment is defined by severe motor impairment with intact cognition —
              principally people with amyotrophic lateral sclerosis (ALS), high spinal-cord injury with tetraplegia,
              brainstem stroke, or locked-in syndrome — for whom the device restores digital communication and device
              control. In the United States these populations are substantial in aggregate (roughly 34,700 living with
              ALS, 308,000 with traumatic spinal-cord injury, and an estimated 5.4 million with some form of paralysis),
              but the implant-eligible subset with suitable vascular anatomy and intact motor-cortex signalling is far
              smaller. Because the device is investigational and pre-commercial, Synchron has no paying customers today;
              its current verifiable customers are clinical-trial participants and the academic medical centres
              supporting the trials. Beyond US trials, clinical-recruitment pages on synchron.com/join actively solicit
              eligible patients for active studies using Apple devices, confirming that Apple-ecosystem compatibility is
              already a patient-facing adoption surface. The segmentation that matters for diligence is therefore not a
              revenue-weighted customer base but a clinical and institutional one: which patients qualify, which
              hospitals can implant, and which payer will ultimately fund the procedure.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU032
