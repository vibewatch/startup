      - number: '2.5'
        title: Market Landscape and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Synchron sits inside a fast-forming implantable-BCI landscape and adjacent to several established
              neurotechnology markets that shape buyer expectations and reimbursement precedent. Within implantable BCI,
              the direct field includes intracortical approaches (Neuralink, with far higher electrode counts) and
              cortical-surface arrays (Precision Neuroscience), plus well-capitalized entrants such as Science
              Corporation and legacy players like Blackrock Neurotech; competitive dynamics are analyzed in the
              competitors chapter, but for market purposes their fundraising and clinical milestones validate buyer and
              investor appetite for the category. Adjacent markets provide both substitutes and reimbursement analogs.
              Deep brain stimulation, dominated by Medtronic, demonstrates that an implantable neuro device can achieve
              durable Medicare coverage and multi-billion-dollar revenue, offering a template Synchron's payer strategy
              can follow. Cochlear implants similarly show how a sensory neuroprosthetic crossed from investigational to
              standard-of-care with established codes. On the substitute side, the assistive-technology and AAC market —
              eye-tracking communication tablets and switch-access devices — is the realistic status-quo alternative for
              most paralyzed patients today; it is cheaper and non-invasive but slower and more limited, which frames
              Synchron's value proposition as restoring higher-bandwidth, hands-free digital control. The non-invasive
              consumer BCI segment grows faster in unit terms but addresses wellness and gaming rather than clinical
              restoration, so it is adjacent rather than competitive. Overall, the landscape is early, capital-rich, and
              clinically unproven at commercial scale, meaning market structure — not just product — will determine
              which players convert addressable demand into reimbursed revenue.
