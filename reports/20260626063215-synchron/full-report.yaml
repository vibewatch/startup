              The November 2025 Series D of USD 200 million was led by Double Point Ventures and included the Australian
              National Reconstruction Fund (sovereign industrial fund), T.Rx Capital, Qatar Investment Authority, K5
              Global, Protocol Labs, and IQT (In-Q-Tel, the US intelligence community's venture arm). All existing
              investors (ARCH Ventures, Khosla Ventures, Bezos Expeditions, NTI, METIS) participated. The Series D
              implies a valuation above USD 1 billion; Neurofounders characterised Synchron as the second modern BCI
              company above USD 1 billion after Neuralink.


              Revenue and ARR are not applicable for this pre-commercial clinical-stage company. Morgan Stanley projects
              the BCI market at USD 400 billion (figure cited by Synchron in company materials).
