      - number: '6.4'
        title: Customer Acquisition, Expansion, and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Synchron's customer-acquisition motion is fundamentally a clinical-adoption and reimbursement motion
              rather than a sales-led one. New patient demand is created by neurologists and ALS or spinal-cord-injury
              clinics referring eligible patients to implanting centres, which means the acquisition funnel runs through
              clinical referral pathways, patient advocacy organisations, and the reputation of the trial sites.
              Expansion comes along two axes: adding implanting centres (geographic and capacity expansion) and
              broadening the approved indication from an initial ALS or severe-paralysis label to wider stroke and
              spinal-cord-injury populations. The INTENT trial (NCT07543367) and FOCUS-AUS trial (NCT07533903)
              demonstrate that Synchron is already expanding its clinical footprint beyond COMMAND. The Apple BCI-HID
              native integration creates an additional expansion surface: every iPhone and iPad owner with a qualifying
              condition becomes a potential user without requiring new hardware ecosystem investment. Synchron CEO
              statements cited weekly patient interactions as a key engagement metric, suggesting active use rather than
              dormant installations. The concentration risks are significant: today's demonstrated demand is
              concentrated in three US academic centres and a single dominant payer (Medicare), and the patient pipeline
              depends on referral behaviour that does not yet have an established reimbursement incentive. Procurement
              friction is high because hospitals will not allocate device and procedure budget until coverage exists,
              and clinicians will not build referral pathways until the device is approved and reimbursed — a
              chicken-and-egg dynamic typical of novel implantable devices. At approximately 100 million people globally
              with upper- limb impairment, the long-run addressable base is large; the near-term commercial base is a
              handful of trial sites.
