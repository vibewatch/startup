      - number: '7.3'
        title: Supply Chain, Operational, and Manufacturing Risks
        blocks:
          - type: paragraph
            body: >-
              Supply-chain risk concentrates in Synchron's ACQUANDAS dependency. Synchron acquired an equity stake in
              ACQUANDAS in January 2024 (BusinessWire) to secure thin-film electrode manufacturing, a critical substrate
              for the Stentrode. MassDevice confirmed the stake, characterizing it as a supplier-anchor move. This
              creates single-supplier concentration for the thin-film electrode component with no publicly confirmed
              secondary source or continuity plan. Manufacturing scale-up from clinical-grade to commercial production
              under ISO 13485 and FDA QSR is a common device-company failure point. Australia's National Reconstruction
              Fund (NRF) AUD 54M investment anchors both R&D and manufacturing in Australia, creating geographic
              concentration and foreign-exchange exposure. The ACQUANDAS dependency and Australia manufacturing hub
              together concentrate critical component supply and manufacturing R&D in a single non-US jurisdiction — a
              compounded geopolitical and supply risk. Cybersecurity risk in a connected brain-computer implant is also
              a growing regulatory and operational concern; the FDA expects lifecycle management of connected-device
              security.
