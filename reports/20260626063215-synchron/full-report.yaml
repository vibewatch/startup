      - number: '4.2'
        title: Cost Structure, Margins, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Synchron's cost structure is dominated by research and development, clinical-trial operations, and the
              engineering and scientific headcount needed to advance toward a pivotal trial — not by manufacturing
              scale, which remains small and clinical-grade. Like other implantable neuro-device makers, the long-run
              gross margin on the device itself is expected to be high once at scale (implantable neurostimulation
              hardware historically carries strong device margins), but that margin is irrelevant until volumes exist,
              and early per-implant economics will be poor because fixed clinical, regulatory, and quality costs are
              spread over a handful of investigational implants. The unit economics today are therefore best described
              as undefined: there is no average selling price, no published cost of goods, and no customer-acquisition
              cost in a conventional sense because the "sale" is mediated by hospitals and payers rather than a direct
              salesforce. The relevant forward unit economics are the device-plus-procedure price (undisclosed), the
              cost to manufacture a clinical-then-commercial Stentrode (undisclosed), the cost per patient to run the
              pivotal trial (industry pivotal trials for implantable neuro devices commonly run on the order of tens of
              millions of dollars in aggregate), and the post-approval cost to support each implanted patient over time.
              Working capital and capex are modest relative to capital-intensive hardware businesses because the device
              is small and implanted via an existing catheter-based workflow, but manufacturing scale-up, quality-system
              build-out, and a commercial salesforce will raise costs sharply at launch. Each null unit-economics field
              below carries a specific diligence ask, because the absence of these numbers — not a disclosed-but-weak
              number — is the core financial-evidence gap.
