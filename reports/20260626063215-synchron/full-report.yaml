      - number: '4.3'
        title: Capital Adequacy, Burn, and Runway
        blocks:
          - type: paragraph
            body: >-
              Synchron has raised approximately USD 345 million in total equity financing across its rounds, most
              recently a USD 200 million Series D announced on November 6, 2025 and led by Double Point Ventures. The
              round included sovereign and strategic investors: Australia's National Reconstruction Fund Corporation
              (NRFC) committed AUD 54 million (approximately USD 34 million) specifically to establish an Australian
              commercial and engineering hub, adding manufacturing infrastructure costs to the capital-deployment
              picture beyond US operations. Qatar Investment Authority, IQT (a US national-security strategic investor),
              T.Rx Capital, K5 Global, and Protocol Labs joined existing backers such as ARCH Venture Partners, Khosla
              Ventures, and Bezos Expeditions. The historical round-by-round chronology is documented in the Company
              Overview chapter and is referenced here rather than restated. Beyond headcount and trials, several
              discrete capital deployments signal ongoing spend. In January 2024, Synchron acquired an equity stake in
              ACQUANDAS GmbH, a neural-electrode supply-chain partner, implying targeted manufacturing and supply-chain
              capex rather than purely operating expense. Riki Banerjee was appointed Chief Technology Officer in
              January 2024 to lead engineering preparation for the pivotal study, directly signalling elevated technical
              burn ahead of the pivotal trial. Andy Rasdal, a seasoned medical-device commercialization executive, was
              appointed to the Board of Directors in December 2023, signalling the company's orientation toward a
              commercial launch and associated cost build-up. In July 2024 Synchron launched a BCI chat feature powered
              by OpenAI, demonstrating that product-expansion engineering and AI partnership costs are already active
              use-of-capital categories. For forward capital adequacy, the company has not disclosed cash on hand or
              burn rate, so runway must be estimated. Late-stage neuro-device companies advancing a pivotal trial while
              building US and Australia commercial and AI operations typically burn on the order of USD 40-120 million
              per year; against a fresh USD 200 million raise plus the NRFC AUD 54 million co-investment, this implies a
              runway on the order of two to four years — enough to fund the planned 2026 pivotal trial and an initial
              commercialization build-out, but not obviously enough to reach self-sustaining reimbursed revenue without
              at least one further raise. The next-round trigger is most likely the pivotal-trial readout and PMA
              submission. The binding financial dependency is therefore the gap between approval-plus-reimbursement and
              capital exhaustion.
