        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Synchron's executive team combines the scientific founders with seasoned medical device commercialisation
              veterans.


              Thomas Oxley, M.D. Ph.D., is CEO and co-founder. He completed his medical degree and Ph.D. at the
              University of Melbourne and serves as an instructor in the Department of Neurosurgery at Mount Sinai
              Health System. Nicholas Opie, Ph.D., is co-founder and the biomedical engineer who led early Stentrode
              design.


              Kurt Haggstrom joined as Chief Commercial Officer in 2022, responsible for commercial strategy,
              partnerships, and reimbursement planning. In August 2025, Andy Rasdal (board member since December 2023)
              became Chief of Staff. Rasdal was previously CEO of DexCom (led FDA PMA and IPO), CEO of Obalon
              Therapeutics (FDA PMA and IPO), and President of Medtronic Vascular. Mark Brister joined simultaneously as
              VP R&D with 38 years of experience, 100+ product launches, and 450+ patents across Guidant, Medtronic,
              DexCom, and Obalon.


              The Board includes Campbell Murray of Double Point Ventures (Series D lead, 14-IPO track record), Ari
              Nowacek of ARCH Venture Partners (joined at Series C), and Robert Nelsen of ARCH as board observer.


              Key-person risk is concentrated in CEO Thomas Oxley, who holds the scientific vision, investor
              relationships, and primary media spokesperson roles. No succession plan or key-person insurance has been
              publicly disclosed.
