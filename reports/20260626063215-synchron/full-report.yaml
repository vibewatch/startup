      - number: '1.2'
        title: Technology Platform
        blocks:
          - type: paragraph
            body: >-
              Synchron's flagship product is the Stentrode, an endovascular brain-computer interface. The Stentrode is a
              stent-like mesh of 16 electrodes threaded through a blood vessel on a catheter via the jugular vein, and
              lodged in a cerebral vein adjacent to the motor cortex. By deploying within the vasculature rather than on
              or inside brain tissue, Synchron avoids the craniotomy required by competing neural implants. The
              procedure takes a median of 20 minutes in clinical trials and uses standard neurointerventional
              techniques.


              Once implanted, the Stentrode records local field potentials representing motor intent and transmits them
              wirelessly to an external processor. A machine-learning decoder converts frequency-band shifts into
              digital motor outputs (DMOs), which map to switch actions on connected devices. The system is fully
              internalized with no percutaneous leads, and is designed for long-term stable signal capture.


              The Stentrode embodies a fundamental signal-fidelity trade-off: 16 electrodes capture a coarser signal
              than Neuralink's N1 device (1,024 electrodes). Synchron's thesis is that the lower-risk catheter-based
              approach outweighs the electrode-count disadvantage for regulatory scalability.


              Three major software and AI developments announced in 2025 extend the platform. In January 2025, a
              partnership with NVIDIA's Holoscan platform targets on-device edge AI for lower-latency neural decoding.
              In March 2025 at NVIDIA GTC, Synchron unveiled Chiral, a cognitive AI brain foundation model trained on
              de-identified human neural data to generalise decoding across patients; Chiral is a research roadmap item,
              not a shipped product. On May 13, 2025, Synchron announced it would be the first BCI company to achieve
              native integration with Apple's BCI Human Interface Device (BCI HID) protocol, enabling iPhone, iPad, and
              Apple Vision Pro control by thought.


              A next-generation high-channel whole-brain transcatheter interface is in stealth development at the San
              Diego hub, led by Andy Rasdal and Mark Brister, with approximately 20% of Series D proceeds allocated to
              this effort.
            claimRefs:
