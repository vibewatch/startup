      - number: '5.4'
        title: Roadmap, Developer Ecosystem, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              Synchron's roadmap runs on two tracks. The near track targets a 2026 pivotal trial to support FDA PMA
              submission—the milestone that converts the investigational device into a commercially implantable product.
              The software track iterates Chiral, Apple BCI-HID, NVIDIA Holoscan, and OpenAI integrations to improve
              capability without hardware changes. The longer track is a next-generation, higher-channel-count interface
              in early R&D at a San Diego site, intended to close the bandwidth gap against intracortical competitors
              while preserving the endovascular safety advantage; architecture and timeline are not publicly disclosed.
              The appointment of CTO Riki Banerjee in January 2024, explicitly tied to manufacturing scale-up, signals a
              product- maturity transition. For developer-ecosystem signal, the Synchron Careers page lists openings
              across hardware engineering, software/AI, clinical affairs, and regulatory, indicating active product
              development but not an independent external community. The NeuroTechX awesome-bci repository on GitHub is
              a community-curated index of BCI tools and frameworks used by practitioners and researchers, confirming a
              broader BCI developer ecosystem, but it is not specific to Synchron and does not reflect external adoption
              of Synchron's platform or APIs. Both developer-signal sources are limited proxies; an evidenceGap records
              the absence of external developers publishing on Synchron's specific stack. The central evidence gaps are:
              Chiral accuracy has no independent benchmark; the 2026 pivotal trial has not started and its schedule is a
              target; the next-generation interface lacks any public technical specification; and cybersecurity and
              neural-data privacy remain undisclosed.
