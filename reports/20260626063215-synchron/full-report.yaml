      - number: '1.5'
        title: Financing History and Investors
        blocks:
          - type: paragraph
            body: >-
              Synchron has raised USD 345 million across six financing rounds since inception, confirmed in the November
              2025 Series D press release. The capital structure is entirely equity with no disclosed debt financing.


              The Series A funded the first-in-human SWITCH study. A USD 40 million Series B was led by Khosla Ventures
