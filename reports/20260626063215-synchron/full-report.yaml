      - number: '4.4'
        title: Public Traction Versus Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Public, verifiable traction for Synchron is clinical and partnership-based rather than financial. The
              company has completed the SWITCH study (four patients, published in JAMA Neurology in January 2023) and
              the COMMAND early-feasibility study (six patients, primary safety endpoint met in 2024), has FDA
              Breakthrough Device Designation and the first IDE for a permanently implanted BCI, and has announced
              ecosystem integrations with Apple (native BCI-HID) and NVIDIA (Holoscan edge AI). What is not public is
              essentially every financial metric an underwriter needs: revenue (zero today, but no disclosed forward
              forecast), cash on hand, monthly or annual burn, gross margin, manufacturing cost, device pricing,
              headcount with cost, and any post-money valuation figure (the Series D was widely described as implying a
              valuation above USD 1 billion, but the company did not confirm a specific number). Because Synchron is a
              private company, there are no SEC periodic filings in EDGAR to triangulate these figures. A search of the
              SEC EDGAR company filing database for Synchron Inc. under Form D private-placement submissions returns no
              accessible results, consistent with the company filing under a variation of its legal name or the search
              endpoint being unavailable; either outcome confirms that only Form D-type private-placement evidence would
              exist, which discloses amounts raised but not operating economics. This creates a large private-metric
              gap: the investment case rests on clinical and regulatory milestones that are well evidenced, while the
              financial inputs that determine capital adequacy and ultimate returns are almost entirely undisclosed. The
              diligence implication is that financial underwriting cannot be completed from public sources alone and
              requires direct data-room access to cap table, audited financials, burn detail, and pricing assumptions.
