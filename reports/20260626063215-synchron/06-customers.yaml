  evidenceGaps:
    - id: GU001
      title: Named customer proof table is partial; future implanting centres not yet public
      type: enumeration-incomplete
      severity: minor
      topic: named customer proof table
      description: >-
        Only publicly disclosed COMMAND sites and named predecessor trial participants are
        enumerated; additional planned or future implanting centres have not been publicly
        announced.
      missingEvidence: A complete current list of all active and planned implanting centres including any new INTENT sites.
      relatedQuestionRefs:
        - QU009
      relatedTableRefs:
        - TU003
      diligencePath: Request from Synchron the full and current list of active and planned implanting centres.
      whyItMatters: The breadth of the implanting network determines commercial capacity and concentration risk.
    - id: GU002
      title: Implant-eligible patient subset not precisely quantified
      type: missing-source
      severity: material
      topic: patient-population
      description: >-
        Aggregate US prevalence figures are available, but the implant-eligible fraction with
        suitable vascular anatomy and intact motor-cortex signalling has not been published.
      missingEvidence: Clinical eligibility-based estimate of the implant-eligible population fraction.
      relatedQuestionRefs:
        - QU004
        - QU024
      relatedTableRefs:
        - TU001
      diligencePath: Review pivotal-trial eligibility criteria and request company addressable-patient analysis.
      whyItMatters: The eligible subset, not total prevalence, sets the realistic near-term patient base.
    - id: GU003
      title: No patient-reported satisfaction or long-term durability data beyond 12 months
      type: missing-source
      severity: material
      topic: retention
      description: >-
        Beyond one-year safety, no structured patient-satisfaction survey or multi-year
        device-longevity data have been publicly reported.
      missingEvidence: Structured patient-reported outcomes and multi-year device-functioning data.
      relatedQuestionRefs:
        - QU014
        - QU021
      relatedTableRefs:
        - TU004
      diligencePath: Request longitudinal patient-reported outcomes and device-longevity records from investigators.
      whyItMatters: Durability and patient satisfaction underpin both clinical adoption rates and any retention analog.
    - id: GU004
      title: Referral-pipeline denominator undisclosed
      type: missing-source
      severity: minor
      topic: retention
      description: >-
        The number of eligible patients entering the clinical referral funnel and the
