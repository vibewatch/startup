schemaVersion: report-v2
artifact: customers
slug: synchron
runDate: '2026-06-26'
company:
  name: Synchron
chapter:
  number: 6
  title: Customers
  summary: >-
    Synchron has no paying customers: it is pre-commercial, and its verifiable customers are the
    three US COMMAND implanting sites (Mount Sinai, University at Buffalo, UPMC/Carnegie Mellon),
    ten implanted trial patients across SWITCH and COMMAND with no serious device-related adverse
    events reported at one year, and the Apple ecosystem partner serving as both a distribution
    surface and a clinical-demonstration platform. Named patient proof centres on Mark, a
    64-year-old ALS patient who became the first person to use Apple Vision Pro and then the first
    to complete a thought-controlled iPad interaction via the BCI-HID protocol. Ultimate demand is
    gated by a single dominant payer, Medicare, which has no coverage determination or procedure
    code for implantable BCIs as of mid-2026. The customer base is clinically credible and
    institutionally prestigious but commercially nascent and highly concentrated across a few
    centres and one payer.
  contentRequirements:
    - Customer base segmentation by buyer/user/payer, geography, and use case.
    - Adoption trajectory (implants, sites, utilisation) where supportable.
    - 'Named customer proof: production vs pilot, outcomes, reference quality, freshness.'
    - 'Retention/durability: device longevity, coverage durability, satisfaction, or gaps.'
    - >-
      Expansion and concentration: land-and-expand, top-customer and payer risk, procurement
      friction.
  plannedTables:
    - name: Customer segmentation table
      requirement: segment, buyer/user/payer, use case, scale, revenue/strategic value, gap.
    - name: Customer growth / adoption trajectory table
      requirement: metric, value, date, source, confidence, implication, missing denominator.
    - name: Named customer proof table
      enumeration: true
      expectedMinRows: 3
      requirement: customer, segment, deployment/use case, production vs pilot, outcome, limitation.
    - name: Retention / repeat usage / satisfaction table
      requirement: metric, value/null, segment, confidence, diligence ask.
    - name: Expansion and concentration risk table
      requirement: expansion driver, concentration risk, impact, diligence path.
  plannedFigures:
    - name: Customer journey map
      acceptedTypes:
        - journey-map
      requirement: Customer segments, adoption surfaces, and expansion loops.
    - name: Adoption / deployment funnel
      acceptedTypes:
        - funnel
        - flow
      requirement: Discovery-to-purchase-to-deployment-to-expansion path.
    - name: Customer proof matrix
      acceptedTypes:
        - matrix
      requirement: Evidence quality, outcome specificity, retention visibility, or production maturity.
    - name: Retention / repeat cohort
      acceptedTypes:
        - cohort
      requirement: >-
        Time-series retention; columns are time buckets and cell values are retention percentages
        0-100.
  evidenceStrategy:
    - >-
      Official and hospital customer evidence: company and academic-medical-centre announcements
      naming implanting sites.
    - >-
      Named patient proof: massdevice and mobility-management trade coverage naming Mark and SWITCH
      participants; published first-in-human PubMed papers for home-use outcomes.
    - >-
      Clinical-trial registration: ClinicalTrials.gov API records for COMMAND, SWITCH, INTENT,
      FOCUS-AUS, and the all-trials search endpoint.
    - >-
      Payer adverse evidence: InsideBCI reimbursement-gap analysis and CMS coverage database
      confirming absence of BCI NCD/procedure code; LCD L33739 for SGD comparator.
    - >-
      Incumbent comparator: Tobii Dynavox as the SGD market leader patients currently use.
  qualityBar:
    - Distinguish named deployments, active use, outcomes, and durability from logos.
    - Tie customer evidence to buyer/user/payer segments and strategic value.
    - Convert unsupported retention, count, or satisfaction claims into null plus diligence asks.
    - Include adverse searches for concentration, reimbursement blockers, and pre-commercial status.
    - Mark every named patient deployment as investigational, not a paying production customer.
sections:
  - id: patient-population
    title: Patient Population and Customer Segmentation
    body: >-
      Synchron's ultimate customer is segmented across three roles that rarely coincide in one
      person: the patient-user who receives the implant, the hospital that buys and implants the
      device, and the payer that reimburses it. The patient-user segment is defined by severe motor
      impairment with intact cognition — principally people with amyotrophic lateral sclerosis
      (ALS), high spinal-cord injury with tetraplegia, brainstem stroke, or locked-in syndrome —
      for whom the device restores digital communication and device control. In the United States
      these populations are substantial in aggregate (roughly 34,700 living with ALS, 308,000 with
      traumatic spinal-cord injury, and an estimated 5.4 million with some form of paralysis), but
      the implant-eligible subset with suitable vascular anatomy and intact motor-cortex signalling
      is far smaller. Because the device is investigational and pre-commercial, Synchron has no
      paying customers today; its current verifiable customers are clinical-trial participants and
      the academic medical centres supporting the trials. Beyond US trials, clinical-recruitment
      pages on synchron.com/join actively solicit eligible patients for active studies using Apple
      devices, confirming that Apple-ecosystem compatibility is already a patient-facing adoption
      surface. The segmentation that matters for diligence is therefore not a revenue-weighted
      customer base but a clinical and institutional one: which patients qualify, which hospitals
      can implant, and which payer will ultimately fund the procedure.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU032
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: hospital-customers
    title: Hospital and Clinical-Site Customers and Named Patient Proof
    body: >-
      The most concrete, verifiable customers Synchron has today are the academic medical centres
      that serve as implanting and research sites. The COMMAND early-feasibility study ran at three
      principal US sites — Mount Sinai Health System in New York, the University at Buffalo's Gates
      Vascular Institute, and UPMC in Pittsburgh in collaboration with Carnegie Mellon University —
      with the programme supported by the NIH BRAIN Initiative. Patient enrollment was completed
      with six patients across these three centres; no deaths or serious device-related adverse
      events were reported at the one-year follow-up. The first US implant was performed at Mount
      Sinai West in 2022, led by Dr. Shahram Majidi, with discharge within 48 hours. The named
      patient proof that provides the strongest customer validation centres on Mark, a 64-year-old
      man with ALS who became the first person to use Apple Vision Pro through thought control via
      the Stentrode, and then in August 2025 completed the first thought-controlled iPad interaction
      under Apple's new BCI Human Interface Device protocol. Earlier, four patients in the
      Australian SWITCH study all learned BCI control and the 12-month safety endpoint was met —
      published in JAMA Neurology. Two ALS patients documented in peer-reviewed literature (PMID
      33115813) performed home tasks including texting, shopping, and managing finances by thought
      alone. Synchron's OpenAI-powered chat feature was also demonstrated with a named patient user,
      showing AI-assisted communication as a patient-facing expansion capability. These named
      deployments are exclusively investigational, not paying production customers; they represent
      clinical proof of concept at prestigious institutions, not a commercial customer base.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU037
      - CU040
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002
      - FU003
  - id: payer-landscape
    title: Payer Landscape, Coverage Gap, and Retention Analog
    body: >-
      For an implantable medical device whose patients are predominantly elderly or disabled, the
      decisive customer is the payer, and in the US that means the Centers for Medicare and
      Medicaid Services. Most ALS and severe-paralysis patients qualify for Medicare (including
      under-65 disability eligibility) or Medicaid, so federal coverage policy, not patient
      willingness to pay, governs demand. As of mid-2026 there is no national coverage
      determination listing implantable brain-computer interface devices, and no BCI-specific
      procedure code, meaning that even after FDA approval the device would face a separate,
      uncertain, and potentially slow coverage process. The InsideBCI policy analysis published
      21 March 2026 identifies this as a structural gap: Medicare has no dedicated pathway for BCI
      implants, and without a pathway, post-approval adoption depends on individual contractor
      adjudication rather than a national standard. The SGD coverage framework under LCD L33739
      provides a relevant payer reference — Synchron must eventually achieve comparable reimbursement
      clarity. Tobii Dynavox SGDs are the incumbent technology patients currently use, and payers
      have established coverage precedent for them; BCIs must meet a higher cost-effectiveness bar.
      Durability of the customer relationship is therefore better understood as durability of
      coverage than as conventional retention: once a favourable coverage determination and
      procedure code exist, demand can become durable and recurring as newly diagnosed eligible
      patients need devices each year; until then there is no recurring revenue to retain.
      Secondary payers include private insurers and the Veterans Health Administration.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU029
      - CU036
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: acquisition-expansion
    title: Customer Acquisition, Expansion, and Concentration Risk
    body: >-
      Synchron's customer-acquisition motion is fundamentally a clinical-adoption and reimbursement
      motion rather than a sales-led one. New patient demand is created by neurologists and ALS or
      spinal-cord-injury clinics referring eligible patients to implanting centres, which means the
      acquisition funnel runs through clinical referral pathways, patient advocacy organisations,
      and the reputation of the trial sites. Expansion comes along two axes: adding implanting
      centres (geographic and capacity expansion) and broadening the approved indication from an
      initial ALS or severe-paralysis label to wider stroke and spinal-cord-injury populations. The
      INTENT trial (NCT07543367) and FOCUS-AUS trial (NCT07533903) demonstrate that Synchron is
      already expanding its clinical footprint beyond COMMAND. The Apple BCI-HID native integration
      creates an additional expansion surface: every iPhone and iPad owner with a qualifying
      condition becomes a potential user without requiring new hardware ecosystem investment. Synchron
      CEO statements cited weekly patient interactions as a key engagement metric, suggesting active
      use rather than dormant installations. The concentration risks are significant: today's
      demonstrated demand is concentrated in three US academic centres and a single dominant payer
      (Medicare), and the patient pipeline depends on referral behaviour that does not yet have an
      established reimbursement incentive. Procurement friction is high because hospitals will not
      allocate device and procedure budget until coverage exists, and clinicians will not build
      referral pathways until the device is approved and reimbursed — a chicken-and-egg dynamic
      typical of novel implantable devices. At approximately 100 million people globally with upper-
      limb impairment, the long-run addressable base is large; the near-term commercial base is a
      handful of trial sites.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU030
      - CU031
      - CU033
      - CU034
      - CU035
      - CU038
      - CU039
    tableRefs:
      - TU005
    figureRefs: []
