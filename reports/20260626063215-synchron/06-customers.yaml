callouts:
  - calloutType: risk
    title: No paying customers exist and demand is gated by a single payer with no coverage pathway
    body: >-
      Synchron is pre-commercial: its only customers are trial sites and participants, and ultimate
      demand depends on a Medicare coverage determination that does not yet exist. InsideBCI's March
      2026 policy analysis confirms that CMS has no dedicated coverage pathway for implantable BCIs,
      meaning post-FDA-approval adoption could be delayed by years of individual contractor
      adjudication. The absence of coverage and the dominance of a single payer are the central
      customer-side risks.
    claimRefs:
      - CU003
      - CU018
      - CU029
  - calloutType: insight
    title: Mark's Apple Vision Pro and iPad demonstrations are the strongest commercial-signal customer proof
    body: >-
      The named-patient story of Mark — a 64-year-old ALS patient who became the first person to
      use Apple Vision Pro by thought and then completed the first thought-controlled iPad interaction
      under Apple's BCI-HID protocol — is the highest-quality named customer proof available.
      Combined with multi-source corroboration from MassDevice, MobilityMgmt, and Synchron's own
      BusinessWire release, it anchors the named-customer-proof table and demonstrates real-world
      utility beyond lab conditions.
    claimRefs:
      - CU011
      - CU012
      - CU031
