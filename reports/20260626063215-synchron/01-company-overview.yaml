  evidenceStrategy:
  - Official surfaces - synchron.com homepage, /about, /technology, /research pages
    and company press releases on Business Wire and BioSpace.
  - Clinical evidence - ClinicalTrials.gov, EVToday, NeuroNews International, MedTech
    Dive, and ClinicalTrialsArena covering SWITCH and COMMAND trial results.
  - Funding and partnership announcements - Business Wire releases for Series C, Series
    D, Apple BCI-HID, executive appointments.
  - Market and competitive context - Forbes, Neurofounders, TechTimes, Time Best Inventions,
    Longevity Technology, Tracxn.
  - Adverse and regulatory - GAO brain-computer interface policy report and Frontiers
