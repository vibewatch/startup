company:
  name: Synchron
chapter:
  number: 1
  title: Company Overview
  summary: Synchron is a New York-headquartered brain-computer interface (BCI) company
    that developed the Stentrode, a 16-electrode endovascular neural implant deployed
    through blood vessels adjacent to the motor cortex without open-brain surgery.
    Founded in 2016 in Melbourne, Australia, by neurologist Dr. Thomas Oxley and biomedical
    engineer Dr. Nicholas Opie, the company has raised USD 345 million across six financing
    rounds, most recently a USD 200 million Series D in November 2025 led by Double
    Point Ventures at an implied valuation above USD 1 billion. The COMMAND early
    feasibility trial met its primary safety endpoint with all six patients in September
    2024. Synchron achieved the first Apple BCI HID protocol integration (May 2025)
    and an NVIDIA Holoscan edge AI partnership (January 2025). A 2026 pivotal trial
    is in preparation toward FDA pre-market approval.
  contentRequirements:
  - Identity, headquarters, founding date, current stage, and one-line product/business
    model.
  - Founders, leadership, board/governance, key-person dependence, and material leadership
    changes.
  - Funding history, valuation, total raised, investors, secondaries, debt/credit
    when supportable.
  - Cover metrics (valuation, raised, revenue/run-rate, customers, headcount, locations)
    with explicit gaps for unsupported numbers.
  - Milestones across founding, financing, product, scale, regulatory, partnerships,
    and adverse events.
  plannedTables:
