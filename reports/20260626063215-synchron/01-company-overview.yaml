- id: clinical-program
  title: Clinical Program
  body: 'Synchron''s clinical program spans Australia, the United States, and Canada.


    The first-in-human SWITCH (Stentrode With Thought-Controlled Digital Switch) study
    enrolled four Australian patients. Results published in JAMA Neurology in January
    2023 showed 12-month follow-up with no persistent neurological deficits, no device
    clots or migration, and stable signal quality. The study was led by Prof. Peter
    Mitchell and Prof. Bruce Campbell at Royal Melbourne Hospital.


    In the United States, the COMMAND trial was conducted under the first FDA-approved
    Investigational Device Exemption (IDE) for a permanently implanted BCI, with NIH
    BRAIN Initiative support. COMMAND enrolled six patients with severe upper-limb
    paralysis at three sites: UB Neurosurgery/Gates Vascular Institute (Buffalo, NY),
    Mount Sinai (New York, NY), and UPMC/Carnegie Mellon (Pittsburgh, PA). Enrollment
    completed September 2023. On September 30, 2024, all six patients met the primary
    endpoint: no device-related serious adverse events resulting in death or permanent
    increased disability during the 12-month post-implant evaluation. No patients
    had SAEs related to the brain or vasculature. Device deployment accuracy was 100%
    with a median deployment time of 20 minutes. Results were presented at the 2024
    Congress of Neurological Surgeons.


    Synchron has since launched FOCUS-CAN in Canada and received permission to begin
    the INTENT trial in the United States, described as evaluating longer-term feasibility
    of the Stentrode. The company is preparing a pivotal clinical trial in 2026, which
    must demonstrate efficacy at scale before Synchron can file an FDA PMA application.


    The FDA granted the Stentrode Breakthrough Device designation in August 2020 and
    the first US IDE in July 2021.'
