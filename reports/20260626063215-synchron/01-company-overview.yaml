    private metrics.
  - Milestone timeline has at least 10 dated entries; gaps noted where needed.
  - Unsupported cover metrics use null plus a concrete diligence path.
sections:
- id: identity-mission-founding
  title: Identity, Mission, and Founding
  body: 'Synchron is a clinical-stage neurotechnology company headquartered in New
    York City (Brooklyn) with an engineering hub in San Diego, California. The company
    describes its mission as restoring, extending, and protecting human agency through
    implantable brain-computer interfaces. Its commercial ambition is to build the
    first commercially scalable BCI for millions of people with motor impairment —
    initially ALS, stroke, and spinal cord injury patients who have lost the ability
    to control digital devices through physical movement or voice.


    The company was founded in 2016 in Melbourne, Australia, by Dr. Thomas Oxley
    and Dr. Nicholas Opie, building on research conducted at the University of Melbourne''s
    Vascular Bionics Laboratory. Oxley, a neurologist and cardiologist with an M.D.
    and Ph.D. from the University of Melbourne, leads as CEO and serves as an instructor
    in the Department of Neurosurgery at Mount Sinai Health System in New York. Opie,
    a biomedical engineer, co-developed the Stentrode electrode array at the University
    of Melbourne.


    As of mid-2026, Synchron has completed two clinical trials (SWITCH in Australia,
    COMMAND in the United States), received permission to begin a third US trial (INTENT),
    and is running FOCUS-CAN in Canada. The company has implanted ten patients across
    its trials. Synchron is the second modern BCI company to cross an implied USD
    1 billion valuation threshold, after Neuralink. The Stentrode bears the FDA designation
    ''CAUTION - Investigational device. Limited by Federal law to investigational use'';
    commercial launch requires completion of a pivotal trial and FDA pre-market approval
    (PMA).'
