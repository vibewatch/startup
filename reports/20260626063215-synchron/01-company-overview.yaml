    requirement: metric, value/status, date, confidence, gap.
  - name: Leadership and founder table
    enumeration: true
    expectedMinRows: 5
    requirement: person, role, background, founder-market fit, key-person dependency.
  - name: Funding round history
    enumeration: true
    expectedMinRows: 5
    requirement: round, date, amount, lead investor, key participants, post-money metrics.
  - name: Milestone chronology
