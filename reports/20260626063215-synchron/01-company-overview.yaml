callouts:
- calloutType: strength
  title: First and Only Endovascular BCI with FDA IDE for Permanently Implanted Device
  body: Synchron holds the first-ever FDA Investigational Device Exemption for a permanently
    implanted BCI, placing it uniquely ahead of all competitors in the regulatory
    pathway. Combined with FDA Breakthrough Device Designation and positive COMMAND
    safety data in six US patients, Synchron has the strongest US clinical regulatory
    credentials in the permanently implanted BCI space entering its 2026 pivotal trial.
  claimRefs:
  - CO018
  - CO016
  - CO033
- calloutType: strength
  title: Apple BCI HID Integration and NVIDIA Partnership Expand Platform Ecosystem
  body: The May 2025 Apple BCI HID native integration makes Synchron the first BCI
    company formally recognized as an input device category by Apple, bridging the
    gap between medical device and consumer technology ecosystem. The NVIDIA Holoscan
    partnership for on-device edge AI decoding addresses the latency limitation of
    the 16-electrode system. Together these partnerships validate the platform beyond
    the clinical trial context.
  claimRefs:
  - CO011
  - CO009
- calloutType: risk
  title: 16-Electrode Signal Fidelity Gap and Feasibility-Stage Evidence
  body: The Stentrode's 16 electrodes provide coarser signal resolution than competitors.
    The COMMAND trial established safety in only six patients over 12 months. Efficacy
    at pivotal scale, long-term safety beyond 12 months, FDA PMA approval, and the
    reimbursement pathway all remain unproven. The 2026 pivotal trial is the decisive
    gate before commercialisation.
  claimRefs:
  - CO027
  - CO028
  - CO030
