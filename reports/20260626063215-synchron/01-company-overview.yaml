- id: financing-investors
  title: Financing History and Investors
  body: 'Synchron has raised USD 345 million across six financing rounds since inception,
    confirmed in the November 2025 Series D press release. The capital structure is
    entirely equity with no disclosed debt financing.


    The Series A funded the first-in-human SWITCH study. A USD 40 million Series B
    was led by Khosla Ventures in 2021. In December 2022, ARCH Venture Partners led
    a USD 75 million oversubscribed Series C, bringing in Gates Frontier, Bezos Expeditions,
    Reliance Digital Health, Greenoaks, Alumni Ventures, Moore Strategic Ventures,
    and Project X; total raised reached USD 145 million.


    The November 2025 Series D of USD 200 million was led by Double Point Ventures
    and included the Australian National Reconstruction Fund (sovereign industrial
    fund), T.Rx Capital, Qatar Investment Authority, K5 Global, Protocol Labs, and
    IQT (In-Q-Tel, the US intelligence community''s venture arm). All existing investors
    (ARCH Ventures, Khosla Ventures, Bezos Expeditions, NTI, METIS) participated.
    The Series D implies a valuation above USD 1 billion; Neurofounders characterised
    Synchron as the second modern BCI company above USD 1 billion after Neuralink.


    Revenue and ARR are not applicable for this pre-commercial clinical-stage company.
    Morgan Stanley projects the BCI market at USD 400 billion (figure cited by Synchron
    in company materials).'
  claimRefs:
  - CO023
  - CO024
  - CO025
  - CO026
  figureRefs:
  - FO003
- id: risks-and-limitations
  title: Risks, Criticisms, and Competitive Challenges
  body: "Synchron's endovascular approach embeds a fundamental trade-off: 16 electrodes\
    \ within blood vessels capture a coarser neural signal than intracortical implants.\
    \ Neuralink's N1 chip has 1,024 cortical electrodes; Precision Neuroscience's\
    \ surface array also reaches 1,024 channels. The COMMAND feasibility study established\
    \ safety with six patients but has not yet provided the efficacy evidence at scale\
    \ that a pivotal trial must demonstrate.\n\nThe U.S. GAO's 2024/2025 report on\
    \ brain-computer interfaces identifies four challenge categories directly applicable\
    \ to Synchron: (1) data ownership and privacy — no unified legal framework for\
    \ brain signal data; (2) potential loss of access — risk that patients lose device\
    \ support if a company ceases operations; (3) Medicare and insurance coverage —\
    \ CMS reimbursement pathway is not yet established; and (4) long-term safety —\
    \ existing clinical data covers only 12 months in small cohorts. Frontiers journal's\
    \ 2025 analysis of BCI ethics adds concerns about informed consent in vulnerable\
    \ populations and neural data privacy.\n\nCompetitive dynamics are accelerating.\
    \ Precision Neuroscience has partnered with Medtronic. Science Corporation reached\
    \ an implied USD 1.5 billion valuation, BrainCo USD 1.3 billion, and Merge Labs\
    \ emerged at USD 850 million. No BCI company holds FDA PMA approval for a permanently\
    \ implanted device as of mid-2026.\n\nRevenue is zero for this pre-commercial\
    \ company. Headcount, burn rate, and financial data are not publicly disclosed.\
    \ Key-person concentration in Oxley, cybersecurity risks from wireless neural\
    \ devices, and future payer coverage uncertainty are additional diligence items."
  claimRefs:
  - CO027
  - CO028
  - CO029
  - CO030
