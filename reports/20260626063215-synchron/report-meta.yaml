  productSummary: |
    The Stentrode is a 16-electrode array housed within a self-expanding stent, permanently
    deployed via endovascular catheterization through the jugular vein to a position adjacent
    to the motor cortex. A subcutaneous transmitter in the chest communicates with an external
    tablet running BrainOS software. The system translates motor-imagery neural signals into
    digital commands — enabling patients with paralysis to operate computers, smartphones,
    and smart-home devices without physical movement. The May 2025 Apple BCI-HID integration
    enables native iPhone/iPad/Vision Pro control. The Chiral AI neural decoding model
    (announced March 2025) is a research-stage cognitive foundation model. A next-generation
    high-channel, whole-brain interface is in development at the San Diego engineering hub.
  customerFocus: "Adults with severe upper-limb paralysis due to ALS, spinal cord injury, or stroke; implanted by neurosurgeons at specialized academic medical centers; regulated as Class III medical device"
  businessModel: "Medical device: hospital-based implant procedure; no commercial revenue yet; commercial launch requires FDA PMA approval (following pivotal trial) and CMS/payer reimbursement negotiation"
