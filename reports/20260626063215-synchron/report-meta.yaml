companyProfile:
  summary: |
    Synchron is a Melbourne-founded, New York-headquartered neurotechnology company developing
    the Stentrode — a 16-electrode endovascular brain-computer interface implanted via the
    jugular vein, reaching the motor cortex without craniotomy. Founded in 2016 by CEO
    Thomas Oxley M.D. Ph.D. and co-founder Nicholas Opie Ph.D. from the University of
    Melbourne's Vascular Bionics Laboratory, Synchron received FDA Breakthrough Device
    Designation in August 2020 and the first US IDE for a permanently implanted BCI in July
    2021. The SWITCH study (4 patients, JAMA Neurology 2023) and the COMMAND early feasibility
    trial (6 patients, primary endpoint met September 2024) demonstrate 12-month safety and
    digital-device control for patients with severe motor paralysis (ALS, spinal cord injury,
    stroke). In November 2025, Synchron closed a $200M Series D led by Double Point Ventures,
    bringing total raised to $345M and implying a $1B+ valuation — making it the second BCI
    company to cross that threshold after Neuralink. The company is preparing for a 2026
    pivotal trial targeting FDA PMA, and has announced integrations with Apple (BCI-HID
    protocol, May 2025) and NVIDIA (Holoscan edge AI, January 2025), and its own Chiral
    neural decoding foundation model (March 2025).
  foundedDate: "2016-01-01"
  founders:
