  enumerationScope:
    coverage: partial
    basis: Covers selected public AI-drug-discovery or adjacent platform/pipeline companies plus high-profile private AI-biology financings visible from public sources as of 2026-07-13; excludes many opaque private companies with no useful public pricing or revenue data.
  rows:
  - - Recursion Pharmaceuticals
    - Public company
    - 2026 market cap $1.88B; 2026 TTM revenue $65.73M
    - ~28.6x market cap / TTM revenue
    - Shows public markets still pay for AI-drug-discovery option value
    - Public market cap includes cash, volatility, and pipeline optionality; not a clean EV/revenue comp
  - - Schrödinger
    - Public company
    - 2026 market cap $1.23B; 2025 revenue about $0.25B
    - ~4.9x market cap / revenue
    - Useful software-plus-therapeutics anchor with disclosed revenue
    - Business mix and maturity differ meaningfully from Genesis
  - - Relay Therapeutics
    - Public company
    - 2026 market cap $4.35B; 2025 TTM revenue $15.35M
    - Very high market-cap / revenue because pipeline optionality dominates
    - Shows how preclinical/clinical option value can swamp revenue multiples
    - Clinical-asset profile and public disclosure are far ahead of Genesis
  - - Xaira
    - Private financing signal
    - Launched in 2024 with over $1B in funding
    - Round size signal, valuation undisclosed publicly here
    - Shows private investors will still fund frontier AI-biology at scale
    - Capital raised is not the same as post-money value or operating proof
  - - Isomorphic Labs
    - Private financing signal
    - Raised $600M first external round in 2025
    - Round size signal, valuation undisclosed publicly here
    - Useful signal for premium appetite around AI drug design
    - Backed by DeepMind/Alphabet context; not a clean operating peer
  - - Genesis / Forge secondary mark
    - Secondary private-market estimate
    - Forge estimates ~$806.8M post-money in May 2026
    - Best concrete public Genesis price anchor
    - Most directly relevant Genesis-specific valuation clue
    - Secondary estimate, not company-confirmed cap table
  - - Genesis / unverified premium narrative
    - Weaker secondary chatter
    - Higher figures circulate but are not supported cleanly in strongest public evidence
    - Not reliably underwritable
    - Important as sentiment backdrop only
    - Should not outrank clearer secondary or official financing signals
  notes: Comparable work is directional. Genesis sits awkwardly between platform software, collaboration techbio, and preclinical asset optionality, so no single comp set is clean.
