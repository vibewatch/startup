- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Partner contraction
    - A major current partner shrinks or exits the relationship
    - Undercuts both commercial proof and financing confidence
    - Re-underwrite immediately
  - - Progress stall
    - No clearer asset progression despite continued partner and platform spending
    - Weakens scarcity-premium argument
    - Lower valuation range and pause conviction
  - - Weak financing signal
    - A new round prices materially below implied expectations or comes with punitive terms
    - Reveals overvaluation or limited bargaining power
    - Reset base case downward
  - - Disclosure gap persists
    - Management still cannot provide clean revenue, concentration, and runway data in diligence
    - Prevents precision underwriting
    - Do not pay premium pricing
  - - IP / data-rights ambiguity
    - Contract or patent review suggests model improvements are not as reusable or defensible as assumed
    - Compresses moat and exit value
    - Increase discount rate / reduce position size
  notes: These are the conditions that would invalidate the current “track but guarded” stance.
