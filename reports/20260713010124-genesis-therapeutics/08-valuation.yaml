- id: scenarios-and-comparable-set
  title: Bull, base, bear cases and imperfect comparables
  body: 'Scenario analysis is more useful than point-estimate valuation because Genesis sits across multiple categories at once: software-like platform, collaboration-led techbio, and preclinical asset company. In the bull case, Genesis broadens beyond its current visible partner concentration, shows clearer candidate progression in internal or partnered programs, and converts its technical edge into a repeatable pharma platform franchise. In that world, a $1.5-2.0 billion valuation could be rationalized as a scarcity-premium private AI-biotech mark. In the base case, Genesis remains strategically valuable but only partially disclosed, with financing support and real customers yet still no public revenue quality or clinical proof; that supports something closer to roughly $0.8-1.2 billion, near or modestly above the clearest current secondary anchor. In the bear case, partner momentum slows, translation risk remains unresolved, and private-market multiples compress, pushing the supportable
    range down toward roughly $0.5-0.8 billion. Comparables help, but only directionally. Public names such as Recursion, Schrödinger, and Relay trade on very different blends of software revenue, collaboration revenue, pipeline option value, and public-market liquidity. Private financings such as Xaira and Isomorphic show that investors still fund AI-biology aggressively, but those are signaling comps rather than apples-to-apples operating comps.'
