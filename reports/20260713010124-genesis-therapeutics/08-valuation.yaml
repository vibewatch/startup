    - Public proof of repeatable scientific outcomes would make the scarcity premium more durable.
  - - Anti-thesis
    - There is still no public revenue, margin, burn, runway, or clinical proof.
    - A diligence-room financial package or later public disclosure would materially improve underwriteability.
  - - Anti-thesis
    - Current visible customer proof is concentrated in Gilead and Incyte.
    - A broader active partner set or lower concentration would reduce the discount rate.
  - - Tiebreaker
    - The market needs proof that Genesis is more than a discovery-acceleration vendor.
    - Internal or partnered program milestones beyond preclinical positioning would be decisive.
  notes: The valuation debate collapses into proof breadth, concentration, and disclosure quality.
