  - CV039
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preference stack
    - Post-money valuation mechanics, liquidation preferences, investor rights
    - Entry economics can differ sharply from headline valuation
    - Management + legal
  - - Revenue quality
    - Recognized revenue, deferred revenue, milestone accounting, gross margin
    - Needed to distinguish real platform economics from contract headlines
    - Finance diligence
  - - Cash and runway
    - Current cash, burn, budget by partnered vs internal programs
    - Determines financing risk before clinical proof
    - Finance diligence
  - - Customer concentration
    - Share of value tied to Gilead, Incyte, and any undisclosed accounts
    - Concentration drives downside severity
    - Commercial diligence
  - - Data rights and IP
    - Training rights, derived-model rights, patent documentation, inventorship process
    - Core to moat durability and exit value
    - Legal + IP counsel
  - - Program progression
    - Confidential milestone table for internal and partnered assets
    - Needed to price option value more rationally
    - Scientific diligence
  notes: These asks are the gating items before treating Genesis as more than a strategically interesting watchlist asset.
  claimRefs:
