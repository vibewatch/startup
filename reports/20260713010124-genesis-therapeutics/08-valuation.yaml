- id: exit-readiness-and-final-diligence
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'The exit debate is also shaped by Genesis’s current disclosure posture. An IPO is conceivable eventually, but not with the current public information set; the company would need materially better visibility on revenue, margin path, customer concentration, and at least some clearer downstream program proof. A strategic acquisition or continued private financing path is more plausible in the near to medium term, especially if a large pharma or techbio buyer views Genesis as a platform-plus-pipeline asset worth owning outright. That does not make the company de-risked. The thesis breaks if partner momentum reverses, if internal or partnered programs fail to show meaningful progression despite continued spend, if a future financing reveals a materially weaker mark or punitive preference stack, or if data-rights / IP ambiguity undercuts the reusability of model improvements. The final diligence agenda is therefore unusually crisp: investors need the cap table and preference stack, partner
    concentration data, revenue quality and recognition, cash and runway, data-rights and IP documentation, and a confidential program progression table. Until those are available, Genesis should be treated as strategically compelling but valuation-sensitive rather than as a clean green light.'
