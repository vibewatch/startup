  rows:
  - - Upfront collaboration payments
    - Cash paid at signing or expansion of large-pharma discovery deals
    - $35M Gilead (2024); $30M initial Incyte (2025); $120M expanded Incyte package (2026 incl. equity)
    - Confirmed, but not equivalent to recognized revenue
    - Proves buyers will fund Genesis before clinical proof
    - Request revenue-recognition schedule and deferred-revenue treatment by contract
  - - Recurring research funding
    - Partner funds AI model training, inference, and program support
    - Disclosed for 2026 expanded Incyte collaboration; amount undisclosed
    - Confirmed but partially quantified
    - Higher-quality near-term monetization than pure milestone optionality
    - Request annual run rate and cost recovery / margin on funded work
  - - Development / regulatory / commercial milestones
    - Payments triggered by candidate and clinical progress
    - Up to $295M per target in initial Incyte deal; up to $232M per program in expanded deal
    - Highly contingent
    - Can dominate long-term economics if programs advance
    - Request milestone schedule by stage and probability weighting
  - - Royalties
    - Percentage of sales for approved collaboration products
    - Tiered or undisclosed
    - Contingent and long-dated
    - Potentially highest-margin revenue stream if products launch
    - Request royalty bands, territory scope, and stacking rules
  - - Equity financing
    - Direct balance-sheet capital, not operating revenue
    - $200M Series B (2023); $40M Incyte equity purchase (2026)
    - Confirmed
    - Extends runway even if recognized revenue is modest
    - Request post-money valuation, cap table, and preferred terms
  - - Internal pipeline monetization
    - Future out-licensing or partnered asset monetization
    - No public example yet
    - Unavailable publicly
    - Could diversify away from pure platform-service revenue
    - Request internal portfolio plan and partnering posture by asset
  notes: Only publicly disclosed economics are shown. “Public value” reflects announced contract or financing amounts, not audited revenue recognized under GAAP.
