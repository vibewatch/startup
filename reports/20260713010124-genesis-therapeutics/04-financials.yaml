- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Severity
  - Exact diligence path
  rows:
  - - Audited income statement and balance sheet
    - Cannot verify revenue, margin, cash, or liabilities
    - Blocking
    - Obtain audited financial statements or board pack extracts for FY2025 / YTD 2026
  - - Revenue-recognition policy by collaboration
    - Cannot separate upfront cash from recognized revenue
    - Blocking
    - Review contracts plus accounting memo for performance obligations and deferred revenue
  - - Monthly burn and runway
    - Cannot assess capital adequacy or next-round timing
    - Blocking
    - Request monthly actuals vs. budget and cash forecast through 24 months
  - - Partner concentration and backlog
    - Cannot measure exposure to a single partner delaying work or milestones
    - Material
    - Request revenue by customer, active programs, and booked / expected collaboration value
  - - Cost structure by function
    - Cannot estimate gross margin path or compute intensity
    - Material
    - Request R&D / G&A / compute / wet-lab / partner-delivery cost breakout
  - - 2026 equity round terms and cap table
    - Cannot validate dilution, valuation, or investor preference stack
    - Material
    - Request cap table, stock purchase agreement summary, and preferred terms for Incyte equity purchase
  notes: These are public-information blockers specific to underwriting. Each gap maps to a concrete diligence request rather than a generic call for “more data.”
