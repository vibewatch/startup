coverageNotes: Public evidence is strong on platform positioning, pharma-partner validation, and financing quality, but weak on recognized revenue, margin, runway, cap-table structure, and downstream asset progression. The clearest public valuation anchor is Forge’s roughly $806.8M May 2026 secondary estimate; higher premium narratives remain unresolved. The primary post-cutoff qualifying signal is Incyte’s 2026 $40M equity investment within a broader collaboration expansion.
