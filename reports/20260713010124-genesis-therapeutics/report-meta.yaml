companyProfile:
  summary: Genesis Therapeutics is a 2019 Stanford-linked private biotech building the GEMS molecular AI platform for small-molecule drug discovery while advancing internal preclinical assets and partnered programs. Public evidence supports real external validation from Gilead and Incyte, including Incyte’s 2026 expansion with an $80M cash upfront payment and a $40M equity purchase, but the company still discloses too little revenue, margin, and asset-progression detail for precise underwriting.
  foundedDate: '2019-01-01'
  founders:
  - name: Evan Feinberg
    role: CEO & Co-founder
    background: Stanford-linked founder who says he started Genesis in 2019 to extend AI and simulation research from Vijay Pande’s lab.
    claimRefs:
    - CO001
    - CO002
    - CO011
  headquarters: San Mateo, California, USA
  foundingLocation: Bay Area, California, USA
  productSummary: GEMS (Genesis Exploration of Molecular Space) is presented as an AI platform for small-molecule discovery that integrates foundation models, physical simulation, and medicinal-chemistry workflow tooling; Pearl is a key generative 3D foundation-model component within that stack.
  customerFocus: Large pharmaceutical R&D organizations seeking structure-based small-molecule discovery acceleration, currently most visibly Gilead and Incyte.
  businessModel: Platform-led partnered discovery with upfront payments, recurring research funding, milestones, royalties, and internal pipeline option value.
  stage: Post-Series B
  fundingStatus: Oversubscribed $200M Series B in 2023, followed by continued partner-linked capital and Incyte’s $40M 2026 equity purchase; Forge estimates roughly $340M total funding in public secondary data.
