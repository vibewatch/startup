evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A primary document or company-confirmed post-money valuation for the 2026 Incyte equity round and any subsequent
      financing activity.
    whyItMatters: Public secondary values conflict sharply, making entry discipline and dilution analysis unreliable.
    diligencePath: >-
      Request the 2026 stock purchase agreement or board-approved financing materials and reconcile against secondary
      trackers.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Current revenue, ARR, and the split between collaboration revenue, research funding, milestone revenue, and any
      internal program monetization.
    whyItMatters: >-
      Without revenue quality and mix, later financial and valuation analysis remains mostly structural rather than
      quantitative.
    diligencePath: >-
      Obtain management KPI pack or audited financial statements that break out recurring versus milestone-based
      revenue.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A current official headcount and function split across AI research, chemistry, biology, and G&A.
    whyItMatters: >-
