figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Genesis’s path runs from a Stanford-linked 2019 launch through Series B financing, Gilead and Incyte validation,
      and the Pearl/OpenBind technical sequence in 2025-2026.
    claimRefs:
      - CO001
      - CO021
      - CO023
      - CO029
      - CO026
      - CO032
      - CO027
      - CO033
      - CO047
    data:
      items:
        - date: 2019-11
          label: Seed launch
          detail: Company finances its Stanford-linked start with a $4.12M seed round.
          tone: positive
        - date: 2020-12
          label: Series A
          detail: Roughly $52M Series A funding supports platform buildout.
          tone: positive
        - date: 2023-08
          label: Series B
          detail: Oversubscribed $200M headline round moves Genesis into late-private scale-up mode.
          tone: positive
        - date: 2024-07
          label: Gilead partnership
          detail: $35M upfront and three initial targets validate external demand for GEMS.
          tone: positive
        - date: '2024'
          label: Leadership expansion
          detail: CSO, SVP Engineering, and chairman additions strengthen operating depth.
          tone: positive
        - date: 2025-02
          label: Initial Incyte deal
          detail: $30M upfront and option-bearing target collaboration begins.
          tone: positive
        - date: 2025-10
          label: Pearl launch
          detail: Genesis unveils a new foundation model for protein-ligand structure prediction.
          tone: positive
        - date: 2026-05
          label: Incyte expansion + equity
          detail: $120M upfront including a $40M equity purchase expands the strategic partnership.
          tone: positive
        - date: 2026-07
          label: Disclosure gap persists
