            body: >-
              Durability is where the public record thins out materially. Genesis’s official pages show live and
              expanded collaborations, but they do not disclose customer count, contract duration, renewal rates,
              program survival rates, NRR, GRR, logo churn, or active deployment depth by customer. That means the
              company can prove adoption, yet not prove elite retention economics. The customer evidence is therefore
              stronger on continuity than on cohort math. Gilead still appears as an active partner in 2026 after the
              2024 announcement, and Incyte not only remained but expanded after the 2025 initial deal, which are both
              positive signs. Even so, these examples are too few to establish a broad renewal pattern. Public adverse
              context also matters: sector-level analyses argue that AI-drug-discovery platforms still struggle to
              convert early computational wins into late-stage clinical proof at consistent rates. In customer terms,
              that means partner enthusiasm could remain high while long-term wallet share or repeat-buy behavior stays
