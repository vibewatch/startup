              The strongest public pricing signal on Genesis today is not the user-supplied unicorn narrative but the
              weaker, more concrete secondary record. Forge’s profile estimates a May 2026 post-money valuation of about
              $806.8 million and cumulative funding of about $340.3 million. That figure is not a company-confirmed
              cap-table disclosure, but it is more supportable than noisier tracker pages or uncited market chatter. The
              2026 Incyte expansion is the second critical anchor: even without a disclosed round price, a large public
              biopharma was willing to combine $80 million of upfront cash with a $40 million equity purchase, which is
              a much stronger external pricing signal than media enthusiasm alone. At the same time, Genesis still
              offers too little financial disclosure to justify a high-confidence point estimate. Because the company
              does not disclose revenue, margin, or runway, investors cannot cleanly apply revenue or cash-flow
              frameworks the way they might for software or public biotech peers. The most supportable recommendation is
              therefore track rather than chase: maintain high interest, assign high risk, and avoid assuming that any
