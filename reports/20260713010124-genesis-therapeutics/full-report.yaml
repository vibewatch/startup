      - number: '2.2'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more concentrated than headline market-size charts imply. Mordor says pharmaceutical and
              biotechnological companies represented roughly 67% of AI drug discovery end-user share in 2025, with
              software taking most revenue and academic institutions growing faster from a smaller base. That fits
              Genesis’s public commercial record: the company has sold multi-target platform collaborations to Gilead
              and Incyte rather than mass-market software subscriptions. In practice, the economic buyer is usually a
              large pharma or advanced biotech organization with a discovery budget large enough to fund multi-program
              work, proprietary data integration, and milestone-bearing partnerships. The technical user is the
              medicinal chemist, computational biologist, structural biologist, or translational discovery team that
              needs target identification, docking, protein-ligand structure prediction, and lead optimization support.
              The payer sits above them in R&D leadership, business development, or portfolio strategy. Academic and
              research demand is real as well. Mount Sinai launched an AI Small Molecule Drug Discovery Center in 2025
              specifically to integrate AI with traditional discovery methods, build compound databases, and collaborate
              with pharma, biotech, and academic institutions. That is an important market signal: AI drug discovery is
              no longer just a startup niche. Yet it does not erase the commercial reality that Genesis’s monetizable
              buyer pool remains concentrated among well-funded organizations able to share data, sponsor compute-heavy
              workflows, and tolerate milestone-style contracting.
