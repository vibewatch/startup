      - number: '5.2'
        title: Architecture, model stack, and data flywheel
        blocks:
          - type: paragraph
            body: >-
              The most credible part of Genesis’s technical story is the specificity of the public model stack. The AI
              research page says the company focuses on scaling deep learning with physics, and organizes research
              around reinforcement learning, multimodal learning, and geometric or 3D deep learning. The Pearl technical
              report then makes that concrete: Pearl uses large-scale synthetic data, an SO(3)-equivariant diffusion
              module, and controllable inference with generalized templating across protein and non-polymeric
              components. The initial Incyte collaboration describes GEMS as combining language models, diffusion
              models, and physical simulation, while the 2026 expansion says Incyte will share proprietary experimental
              data to improve next-generation GEMS models. Taken together, the public architecture looks like a
              flywheel: structure data and partner data feed foundation models; foundation models drive pose prediction,
              generation, and property estimation; wet-lab results then create better training signal. The main
              diligence gap is that Genesis describes the stack at the research-layer level, not at the
              production-systems level, so service boundaries, data-governance controls, and reproducibility tooling
              remain opaque. A Stanford page about founder Evan Feinberg’s pre-company research in Vijay Pande’s lab
              also shows technical continuity: before founding Genesis, he was publicly described as developing deep
              neural network architectures for in-silico lead identification.
