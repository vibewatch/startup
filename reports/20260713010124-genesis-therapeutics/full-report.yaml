      - number: '5.4'
        title: Dependencies, trust, and public quality gaps
        blocks:
          - type: paragraph
            body: >-
              For underwriting, Genesis’s technical dependencies matter almost as much as its benchmark wins. The
              platform appears dependent on scarce structural data, synthetic-data generation, substantial compute,
              partner-provided experimental data, and cross-functional scientists who can use the tooling productively.
              Public sources also show external partner concentration in the data flywheel: the Incyte expansion
              explicitly ties broader GEMS deployment to proprietary experimental-data sharing. Trust signals exist, but
              they are research-grade rather than enterprise-grade. Genesis discloses benchmark cutoffs, describes
              production-hyperparameter testing on OpenBind, and repeatedly emphasizes physical validity and PoseBusters
              checks; those are meaningful quality signals. Still, the official surfaces reviewed here do not provide a
              public status page, uptime SLA, model card library, detailed security certifications, or a
              partner/developer documentation surface that would let outsiders evaluate reliability and governance at
              deployment depth. External literature is relevant here because it argues that AI drug discovery still
              faces data scarcity, explainability, synthetic-feasibility, and regulatory-trust challenges. Genesis looks
              technically ahead of the field on structure prediction, but not immune to the category’s general
              validation problem.
