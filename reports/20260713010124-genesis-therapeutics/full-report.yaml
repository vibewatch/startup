      - number: '3.4'
        title: Switching Costs, Multi-homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this market do not look like traditional SaaS lock-in. They are created by three
              things: partner data sharing, model retraining tied to that data, and the legal/IP scaffolding around
              active discovery programs. Incyte’s expanded Genesis collaboration is instructive because it explicitly
              adds proprietary experimental data for GEMS training while broadening the target set. Once that kind of
              workflow is underway, the real switching cost is not a software subscription; it is the combined loss of
              shared data context, internal champion bandwidth, and program-specific IP continuity. insitro’s Lilly
              agreements show a similar dynamic in a different form, where ML models are trained on a partner’s
              proprietary datasets and embedded into future decision-making.


              At the same time, multi-homing remains normal. Large pharma companies can and do work with several AI
              providers at once because their needs are not identical across target discovery, structure prediction,
              medicinal chemistry, translational biology, and patient stratification. Genesis’s current collaborators do
              not prove exclusivity over all AI budgets at those firms; they prove that Genesis has won one category of
              work. This matters because a buyer may simultaneously use Schrödinger internally, collaborate with
              Isomorphic on one frontier-model program, work with insitro on metabolism or RNA-enabled biology, and
              still partner with Genesis on hard-to-drug small-molecule targets.


              Distribution power therefore favors incumbents with embedded workflows or repeated procurement wins.
              Schrödinger’s software footprint is the strongest classic distribution moat in this set. Recursion’s broad
              partnership roster creates a second kind of distribution power: repeated trust from counterparties across
              oncology, immunology, and data partnerships. Genesis’s distribution advantage is much narrower and
              relationship-driven. Its current evidence suggests a high-touch deployment model, not a mass-market
              platform rollout. That can support strong account depth where it works, but it also means the company
              remains exposed to concentration risk and to rivals with bigger compute budgets, larger
              business-development teams, or broader therapeutic reach.
