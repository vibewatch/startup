  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Genesis is not facing an obvious near-term existential red flag in the public record, but it does face a
              stack of structurally important risks that matter for underwriting. The highest residual exposures are
              translational risk, partner concentration, and financial opacity. Translational risk is first because
              Genesis’s public proof still stops at preclinical discovery and partner expansion rather than human
              efficacy or approved-product economics. Partner concentration is second because the current public
              commercial story is effectively concentrated in Gilead and Incyte, with Incyte now carrying
              disproportionate importance after its 2026 expansion. Financial opacity is third because Genesis discloses
              collaboration economics and financing signals but not revenue, burn, cash balance, runway, customer
              concentration, or program-level performance. Regulatory and legal risk is real but more medium-term: the
              FDA, EMA, NIST, and EU policy environment is making AI governance expectations more explicit, while
              AI-related IP and state-law compliance issues are still evolving. The practical conclusion is that Genesis
              looks strategically validated but still high risk for anyone who wants public-company-style predictability
              before clinical proof.
