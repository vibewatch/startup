      - number: '4.3'
        title: Cost Structure and Unit Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              Genesis does not publish a P&L, so any unit-economic view must be proxy-based. The company’s AI-platform
              and partners pages nonetheless make the cost stack conceptually visible. Genesis is not a pure software
              company: it operates a wet-lab loop, advances an internal pipeline, deploys scientists alongside partner
              teams, and trains compute-intensive molecular models. That implies a cost base dominated by scientific
              headcount, model-training and inference compute, experimental validation, and partner-specific execution
              work. In other words, Genesis likely has higher delivery cost than a cloud software vendor, but lower
              commercialization infrastructure than a late-stage biotech with large clinical and manufacturing
              obligations.


              Public peers help frame the bounds. Recursion’s filings and Q1 2025 release show a capital-intensive
              collaboration model with large operating cash burn relative to revenue. Schrödinger’s filings and
              financial summaries show the economics of an installed software model: better gross margins and more
              visible revenue conversion, even while still funding a therapeutics pipeline. Genesis’s delivery model
              appears structurally closer to the former than the latter, because its platform is explicitly embedded
              into partner workflows and coupled with wet-lab activity. That means the most important missing metrics
              are not vanity top-line figures but recognized collaboration revenue, cost of revenue, deferred revenue,
              gross margin, monthly burn, and the share of spend devoted to internal programs versus partnered work.


              The practical underwriting consequence is that Genesis’s unit economics are currently unknowable from
              public sources. Any annual burn or monthly burn estimate must be treated as a proxy derived from
              comparable companies rather than as a fact about Genesis itself. That is still directionally useful: it
              suggests Genesis is likely a capital-consuming R&D business whose future financing needs depend less on
              customer acquisition costs and more on partner renewal, candidate progression, and the balance between
              internal pipeline ambition and funded external work.
