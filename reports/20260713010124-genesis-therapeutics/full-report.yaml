  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Genesis is straightforward. This is not a science-fair AI story with no customers:
              Gilead and Incyte have both committed meaningful upfront capital, and Incyte went further in 2026 by
              adding a $40 million equity investment, recurring research funding, and broader target scope. That implies
              Genesis has convinced sophisticated pharma buyers that its GEMS platform is worth integrating into real
              drug-discovery workflows. The company also benefits from scarcity value. There are only a handful of
              private AI-drug-discovery companies with visible pharma traction, a still-active internal pipeline,
              top-tier investors, and current technical narrative around structure-based design. The anti-thesis is that
              public proof remains incomplete where valuation matters most. Genesis has no publicly visible
              clinical-stage program, discloses no recognized revenue, no margin structure, no burn, and no runway, and
              depends heavily on a small number of highly sophisticated counterparties. That means the company may be
              strategically important without yet being precisely underwritable. The valuation debate is therefore not
              whether Genesis has value, but how much of that value should be paid for before more asset, financial, and
              concentration proof becomes visible.
