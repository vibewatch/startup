      - number: '4.2'
        title: GTM Motion, Concentration, and Public Traction Proxies
        blocks:
          - type: paragraph
            body: >-
              Genesis’s go-to-market motion is classic enterprise biotech business development, not a bottoms-up
              software funnel. The company is selling multi-target discovery collaborations to large pharma buyers, with
              exclusivity on downstream products and a delivery model that combines GEMS with deployed scientists and
              engineers. Public evidence today points to a highly concentrated customer base: on the current site,
              Gilead and Incyte are the only clearly disclosed major commercial counterparties. That does not prove they
              are the only customers, but it does mean public monetization evidence is effectively concentrated in two
              named logos.


              Because Genesis discloses neither recognized revenue nor customer-count metrics, peers are the best public
              traction proxies. Recursion’s first-quarter 2025 results are especially informative: the company reported
              $15 million of quarterly revenue consisting primarily of collaboration agreements, alongside $509 million
              of cash and $132 million of net cash used in operating activities. Its FY2025 profile, as summarized in
              both its 10-K and StockAnalysis, was $74.68 million of revenue with deeply negative free cash flow. That
              illustrates the basic economics of collaboration-led techbio: real revenue exists, but the cost base can
              scale much faster than recognized revenue.


              Schrödinger shows the opposite end of the spectrum. As a software-plus-therapeutics hybrid, it reported
              $255.87 million of FY2025 revenue and a 55.74% gross margin, with large-pharma software penetration
              generating far more predictable revenue than milestone-style platform deals. Genesis almost certainly sits
              between these extremes. It has more commercial proof than a pre-revenue platform story, but far less
              recurring visibility than a software vendor with contract value, renewal, and deferred-revenue mechanics
              visible in filings. Publicly, Genesis therefore looks commercially credible but still highly concentrated
              and non-recurring.
