  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and scientist workflow
        blocks:
          - type: paragraph
            body: >-
              Genesis does not publicly sell a simple point tool; it presents GEMS as an operating system for
              small-molecule discovery. The AI-platform page says GEMS integrates foundation models, agents, and
              exploratory tooling so chemists can generate and triage solutions to difficult chemistry problems, while
              the Pearl launch says the platform combines structure prediction with molecule generation and property
              prediction such as potency and drug-like parameters. In practice, that means the primary user workflow is
              scientist-centric rather than self-serve software-centric. Researchers move from a target and ligand
              hypothesis into Pearl-based structure prediction, then into model-guided generation, ranking, and
              experimental follow-up. The same public surfaces say Pearl is deployed both in Genesis’s own internal
              pipeline and inside partner programs, which supports the view that GEMS is a reusable discovery stack
              rather than a one-off benchmarking artifact. What remains absent is public disclosure of customer-facing
              packaging, integration APIs, or realized throughput metrics per program.
