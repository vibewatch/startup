chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              Genesis Therapeutics is best understood as a private, preclinical AI drug discovery company that has
              recently shifted its outward-facing brand toward “Genesis Molecular AI.” The current homepage and AI
              platform pages describe the business as building foundation models and an AI operating system for
              small-molecule drug discovery rather than as a single-asset biotech or horizontal SaaS vendor. GEMS, short
              for Genesis Exploration of Molecular Space, is presented as the core platform, integrating foundation
              models, agents, and chemistry tooling to generate and triage drug ideas. The company’s public footprint is
              multi-site but not perfectly cleanly labeled. The current contact page lists offices in San Mateo, San
              Diego, and New York, while the partners and pipeline page says AI research is based in the Bay Area and
              New York City with the wet lab in San Diego. Older 2024 leadership materials still described Genesis as
              headquartered in Burlingame, California, which suggests either an office move or updated mailing address
              rather than a settled contradiction on the core Bay Area base. Stage-wise, the company now looks
              materially beyond an early platform story: it has completed a large Series B, operates internal oncology
              and immunology programs, and has current large-pharma partnerships that provide both non-dilutive cash and
              strategic validation.
