      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The AI-governance perimeter around drug development is becoming clearer, which is helpful operationally
              but increases compliance burden. FDA’s 2025 draft guidance and 2026 AI-drug-development materials show a
              risk-based regulatory approach centered on credibility assessment, intended use, and lifecycle oversight
              for AI that supports regulatory decision-making. The joint FDA-EMA good-AI-practice principles extend that
              direction by emphasizing data quality, human oversight, performance evaluation, and maintenance across the
              development life cycle. Outside the product-specific regulatory lane, broader AI law remains fragmented.
              The EU AI Act phases in binding obligations for AI systems and creates a more formal compliance
              architecture for risk management, transparency, documentation, and oversight. U.S. governance remains more
              patchwork: the CRS report, Gunder’s 2026 legal update, and Cooley’s Illinois audit analysis all point to a
              growing mix of federal, state, and international rules that can affect contracting, diligence
              expectations, and downstream compliance even before a company is directly captured by a specific statute.
              IP adds another legal layer. Goodwin’s analysis of AI drug discovery patent law argues that inventorship
              and enablement become harder when AI contributes heavily to compound generation, which means Genesis’s
              ability to document human scientific contribution and reproducible development logic may matter as much as
              raw model performance.
            claimRefs:
