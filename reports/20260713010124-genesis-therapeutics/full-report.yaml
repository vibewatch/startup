      - number: '5.3'
        title: Benchmarking, throughput, and engineering signals
        blocks:
          - type: paragraph
            body: >-
              Genesis has more public benchmarking detail than most private AI-drug-discovery companies. The Pearl post
              and arXiv report say the model surpasses AlphaFold 3 and other open baselines on Runs N’ Poses and
              PoseBusters, while the OpenBind post adds a more operational layer by describing zero-shot,
              pocket-conditioned, and redocking regimes on a public benchmark with explicit RMSD and validity
              thresholds. The DeCAF-Pearl distillation post is equally important because it addresses throughput, not
              just peak accuracy: Genesis claims roughly 20 times fewer model calls and about a 5 times end-to-end
              inference speedup versus the Pearl teacher checkpoint, which matters for virtual screening and
              synthetic-data generation. Public engineering signals also support continued platform investment. The
              careers page shows hiring across software engineering, machine learning, computational chemistry, and
              biology, including a Senior or Staff Software Engineer role focused on computational chemistry or
              molecular dynamics. Leadership additions such as Sergey Edunov and Shifeng Pan reinforce that Genesis is
              still building both the AI and therapeutics sides of the platform. Genesis also now has a limited public
