      - number: '2.4'
        title: Genesis Fit, SAM Reality, and Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              Genesis’s practical serviceable market is much narrower than the broad small-molecule or pharma-R&D
              ceilings. The company’s own partnership history implies a market centered on large organizations that want
              structure-based small-molecule discovery against difficult targets and are willing to fund repeated
              design-make-test cycles. The public Gilead and Incyte deals show that near-term pricing power sits in
              partnership economics—upfront payments, target options, research funding, milestone rights, and eventually
              royalties—not in commodity per-seat SaaS. That narrows Genesis’s near-term SAM to the subset of pharma and
              biotech buyers with both large discovery budgets and a willingness to share proprietary data or run
              collaborative programs. The most realistic SOM is smaller still: only a few dozen counterparties globally
              are plausible near-term customers for the type of multi-target, small-molecule, data-rich collaboration
              Genesis advertises. No public source quantifies that slice directly, and neither market-research firms nor
              company disclosures publish a clean budget line for “AI structure-based small-molecule platform
              collaborations.” That gap matters. Investors can confidently say Genesis is operating in a growing market
              with strong structural drivers, but cannot yet claim a precise top-down SAM or SOM without making
              assumptions. The right market conclusion is therefore attractive but bounded: the market is large enough
              to matter, yet still concentrated enough that customer quality and deal depth matter more than raw
              headline TAM.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM040
              - CM042
              - CM043
              - CM045
