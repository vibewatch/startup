            body: >-
              Commercially, Genesis’s risk picture is concentrated rather than broad. The current public partner set is
              basically Gilead and Incyte, and the most important recent signal is not a diversified customer roster but
              a deepening of one account. That is encouraging because Incyte expanded after the initial 2025
              collaboration, but it also heightens account dependence: if one partner reprioritizes targets, cuts early
              discovery budgets, or shifts work in-house, Genesis could lose cash inflow, scientific validation, and
              market signaling at the same time. Historical references to Lilly and Genentech prove prior market access,
              yet they do not solve current concentration because their 2026 operating status is not visible on the
              present partner pages. Financially, Genesis is still hard to underwrite from public sources. Collaboration
