      - number: '7.3'
        title: Scientific translation and operational risk
        blocks:
          - type: paragraph
            body: >-
              Genesis’s core operating risk is not that the platform lacks sophistication; it is that sophisticated
              discovery systems still have to survive biology. Genesis’s own site describes GEMS as powering both
              internal pipeline work and partner programs, while the partners page still presents internal assets as
              preclinical. That means the company’s public proof is strongest at the discovery-enablement layer and
              weakest at the human-outcome layer. Independent adverse context reinforces the point. The 2026 MDPI review
              frames AI drug discovery as facing a validation crisis with uncertain clinical payoff and persistent
              attrition, while PDA’s sector overview says AI can accelerate and prioritize work but does not remove
              wet-lab, translational, or development risk. Recursion’s pipeline rework after the Exscientia merger is
              also relevant as a peer warning: even scaled AI-drug-discovery platforms with substantial data and capital
              can still reset portfolios when downstream programs disappoint. Genesis’s operating model adds complexity.
              The company emphasizes tight collaboration between model builders, drug hunters, wet-lab teams, and
              forward-deployed partner staff. That is commercially powerful, but it also means execution depends on
              scarce multidisciplinary talent, repeatable internal coordination, partner-specific data rights, and the
              ability to turn platform wins into durable molecules rather than one-off discovery outputs.
