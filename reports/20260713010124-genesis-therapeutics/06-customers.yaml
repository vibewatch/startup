  - - Partnership-heavy GTM
    - Strategic buyers are high quality, but pipeline can look healthy even when broad diversification is absent
    - High
    - Request pipeline of new customer acquisition versus expansion-only growth
  notes: 'Customer quality and concentration coexist here: the visible logos are strong, but the public record is too narrow to dismiss counterparty dependence.'
