callouts:
- calloutType: strength
  title: Genesis has real top-tier customer proof, not just aspirational logo marketing
  body: The company’s customer evidence includes named big-pharma collaborations with disclosed economics and one clear expansion case in Incyte. That is stronger proof of market demand than a generic enterprise-logo page or an undifferentiated “pilot program” narrative.
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU014
  - CU015
  - CU023
- calloutType: risk
  title: Customer quality is high, but customer concentration is probably higher
  body: Current public evidence points to a very small set of large, strategically important counterparties. If one major partner slows target nominations or reprioritizes budgets, Genesis’s visible customer momentum could change quickly.
  claimRefs:
  - CU016
  - CU018
  - CU027
  - CU031
  - CU035
- calloutType: insight
  title: Public customer proof is better on expansion headlines than on retention math
  body: The record shows customers sign and at least one expands, but it does not yet show NRR, churn, program survival, or contract-duration data. Investors can underwrite demand, but not durability, from public evidence alone.
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU023
  - CU029
