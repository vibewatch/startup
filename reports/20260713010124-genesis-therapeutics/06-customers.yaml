- id: durability-retention-and-satisfaction-gaps
  title: Durability, retention, and satisfaction gaps
  body: 'Durability is where the public record thins out materially. Genesis’s official pages show live and expanded collaborations, but they do not disclose customer count, contract duration, renewal rates, program survival rates, NRR, GRR, logo churn, or active deployment depth by customer. That means the company can prove adoption, yet not prove elite retention economics. The customer evidence is therefore stronger on continuity than on cohort math. Gilead still appears as an active partner in 2026 after the 2024 announcement, and Incyte not only remained but expanded after the 2025 initial deal, which are both positive signs. Even so, these examples are too few to establish a broad renewal pattern. Public adverse context also matters: sector-level analyses argue that AI-drug-discovery platforms still struggle to convert early computational wins into late-stage clinical proof at consistent rates. In customer terms, that means partner enthusiasm could remain high while long-term wallet
    share or repeat-buy behavior stays vulnerable to the underlying translational success of programs.'
  claimRefs:
  - CU020
  - CU021
  - CU022
  - CU024
  - CU025
  - CU028
  - CU029
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: 'The expansion logic is clear even if the exact economics are not. Genesis’s collaborations appear to expand by adding targets, sharing more data, deepening scientific integration, and funding more compute and research work rather than by cross-selling lightweight software modules. The Incyte expansion is the cleanest example: within about fifteen months of the initial agreement, the customer relationship deepened from a two-target collaboration into a broader multi-target, data-sharing, and recurring-funding arrangement. That is good expansion proof. But the same structure creates concentration risk. The current named customer list is essentially Gilead and Incyte, with Lilly and Genentech appearing only in historical references. A customer base like that can be strategically valuable while still fragile, because a small number of counterparties may account for most public traction, most non-dilutive cash inflow, and most external validation. Procurement timing, portfolio shifts
    inside a single pharma, or disappointing program readouts could therefore have an outsized effect on Genesis’s visible customer momentum.'
  claimRefs:
  - CU018
  - CU019
  - CU023
  - CU026
  - CU027
  - CU030
  - CU031
  - CU033
