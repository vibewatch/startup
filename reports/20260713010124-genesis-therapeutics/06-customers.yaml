    - A few counterparties may drive most visible revenue and validation
    - Very high if one major partner slows, reprioritizes, or exits
    - Request top-customer exposure, target counts, and contract end dates
  - - Deepen data sharing and scientific integration
    - Customer lock-in improves, but switching cost cuts both ways if programs disappoint
    - High
