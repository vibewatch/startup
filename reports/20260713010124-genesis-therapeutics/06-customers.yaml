- id: named-customer-proof-and-deployment-quality
  title: Named customer proof and deployment quality
  body: The strongest public customer evidence is the partnership chronology itself. Genesis’s current partners page says Gilead started in 2024 and paid $35 million upfront for three initial targets, while the initial Incyte collaboration in 2025 added two initial targets plus an option for another and the 2026 expansion widened that into at least five additional targets, $120 million of upfront consideration, recurring research funding, and proprietary-data sharing. That Incyte expansion matters because it goes beyond logo proof; it implies the initial work was strong enough to earn a broader commitment. Historical third-party coverage adds earlier big-pharma proof. Pharmaphorum says Lilly paid $20 million upfront for up to five targets after Genentech had already partnered with Genesis in 2020, and C&EN independently said the company had worked with both Lilly and Genentech by 2023. The quality limit is that public evidence still centers on signed collaborations and expanded scope rather
    than program-by-program scientific outputs, so investors can see that customers buy the platform but not yet how uniformly they achieve downstream success from it.
  claimRefs:
  - CU007
  - CU008
