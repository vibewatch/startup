  - TU005
  figureRefs: []
- id: customer-verdict-and-diligence-asks
  title: Customer verdict and diligence asks
  body: The customer verdict is favorable on proof of real demand and unfavorable on diversification and transparency. Genesis clearly has attracted sophisticated, reference-quality counterparties that are capable of underwriting significant discovery collaborations, and at least one of those relationships—Incyte—has already expanded in scope and economics. That is much stronger evidence than logo slides or speculative platform narratives. However, the visible base remains narrow and heavily partnership-driven. Public materials do not reveal how many active customers exist beyond the few named logos, how many programs are live inside each account, what renewals look like, or whether any historical collaborations ended quietly. For diligence, investors should request a customer concentration table, program-by-program backlog, contract structures and renewal milestones, active target counts by partner, and evidence that expanded relationships are producing repeatable scientific and commercial
    value rather than one-off deal headlines.
  claimRefs:
  - CU023
  - CU027
  - CU028
  - CU029
  - CU031
  - CU035
