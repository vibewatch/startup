chapter:
  number: 6
  title: Customers
  summary: Genesis has real customer proof, but it is narrow and partner-led. Public evidence shows repeated adoption by large-pharma R&D groups—most clearly Gilead and Incyte today, with earlier Genentech and Lilly collaborations in the historical record—yet public retention, deployment depth, and concentration metrics remain largely absent, making customer quality credible but still only partially underwritten.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: Genesis’s visible customer base is not broad-based biotech demand or a self-serve software motion. Public evidence consistently frames the company’s external customers as large-pharma research organizations buying multi-target discovery collaborations around hard chemistry problems. The partner-facing pages show Gilead and Incyte as the current named counterparties, while historical 2022-2023 coverage says Genesis had previously worked with Eli Lilly and Genentech as well. The buyer is therefore best described as pharma R&D leadership or business-development teams willing to fund platform-centric discovery campaigns; the users appear to be partner discovery scientists working alongside Genesis’s own forward-deployed engineers, drug hunters, and AI researchers. This is strategically attractive because it pairs Genesis with customers that have the budget, target inventory, and downstream development capabilities to use the platform seriously. It is also risky because it implies a concentrated,
    high-touch customer base with a small number of very large relationships rather than a diversified roster of many smaller accounts.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU018
  - CU019
  - CU034
