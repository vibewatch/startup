  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-risk
    missingEvidence: Audited or management-provided revenue, gross margin, cash balance, burn, runway, debt, and deferred-revenue detail for Genesis.
    whyItMatters: Without core financial statements or operating metrics, investors cannot separate strategic validation from durable economic strength.
    diligencePath: Request the latest balance sheet, P&L, cash flow statement, backlog, and recognized-revenue schedule by major partner.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR020
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named account concentration, account-level backlog, termination rights, renewal timing, and current status of historical Lilly and Genentech relationships.
    whyItMatters: The public commercial story may overrepresent durability if one or two accounts drive most traction and older counterparties are inactive.
    diligencePath: Request a customer concentration table, contract duration summaries, active target counts by partner, and a list of ended collaborations.
    relatedQuestionRefs:
    - QR015
    - QR016
    - QR017
  - type: private-evidence-only
    severity: material
    topic: TR002 governance coverage gap
    missingEvidence: Internal AI-governance procedures, model validation records, change-management controls, and any framework mapping to NIST AI RMF, FDA guidance, or partner QA requirements.
    whyItMatters: Genesis sells into regulated, scientifically rigorous environments; governance maturity cannot be inferred safely from partner logos alone.
    diligencePath: Request SOPs, validation templates, risk registers, model monitoring procedures, and responsible-owner mapping for AI governance.
    relatedQuestionRefs:
    - QR004
    - QR005
    - QR023
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: ip-and-data-rights
    missingEvidence: Patent strategy, inventor-documentation process, and partner contract detail covering training-data rights, derived-model rights, and confidentiality boundaries.
    whyItMatters: AI-drug-discovery value can erode quickly if ownership of discoveries or reusable model improvements is ambiguous.
    diligencePath: Review patent counsel materials, sample invention disclosures, and redacted partner contracting language on data use and IP ownership.
    relatedQuestionRefs:
    - QR009
    - QR013
    - QR028
  - type: missing-source
    severity: important
    topic: program-outcomes
    missingEvidence: Public program-by-program milestone disclosure linking Genesis platform outputs to concrete downstream therapeutic progress.
    whyItMatters: Without that bridge, it remains hard to tell whether expanded collaborations reflect deep scientific success, option value buying, or both.
    diligencePath: Request a confidential pipeline progress table for partnered and internal programs, including candidate nomination and attrition history.
