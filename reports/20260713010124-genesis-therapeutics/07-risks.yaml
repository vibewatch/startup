    - Genesis links AI researchers, drug hunters, wet-lab scientists, and partner teams.
    - Cross-functional coordination failures can slow programs and reduce repeatability.
    - Medium
  - - Peer precedent of pipeline resets
    - Fierce coverage of Recursion’s pipeline rework shows scaled peers still retrench.
    - AI platform scale does not guarantee downstream portfolio durability.
    - Medium-High
  notes: The core operational point is that Genesis’s sophistication does not exempt it from normal drug-discovery failure dynamics.
