- id: TR002
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Framework / source
  - Why it matters
  - Residual risk
  - Diligence ask
  rows:
  - - AI model credibility expectations
    - FDA 2025 draft guidance
    - AI used to support drug regulatory decisions must be governed, validated, and documented with risk-based credibility evidence.
    - Medium
    - Request Genesis regulatory-governance SOPs and any model-credibility packages used with partners.
  - - Lifecycle AI governance expectations
    - FDA / EMA good-AI-practice principles
    - Regulators now expect data quality, human oversight, performance monitoring, and lifecycle management disciplines.
    - Medium
    - Request internal framework showing who owns model monitoring, drift response, and scientific sign-off.
  - - EU AI compliance expansion
    - EU AI Act
    - EU-facing use or customer deployment can add documentation, oversight, and risk-management obligations over time.
    - Medium
    - Request EU customer exposure, legal analysis, and compliance roadmap.
  - - Patchwork US AI law
    - CRS + Gunder + Cooley
    - Fragmented state and federal rules can raise contracting friction and create moving compliance expectations.
    - Medium
    - Request counsel memo on current state-by-state AI obligations relevant to Genesis operations and sales.
  - - AI-related patent inventorship uncertainty
    - Goodwin patent-law analysis
    - If AI contributes heavily to compound conception, human contribution and disclosure must be documented carefully to preserve exclusivity.
    - Medium
    - Review patent strategy, inventor documentation practices, and lab notebook / workflow evidence.
  - - Data-rights and confidentiality boundaries
    - Incyte expansion + partner model training language
    - Partner data-sharing and model-improvement language can create complex ownership, use-rights, and confidentiality issues.
    - Medium
    - Request contract summaries covering training rights, derived-model rights, and confidentiality exceptions.
  - - Public legal/compliance disclosure gap
    - Reviewed Genesis public pages
    - The public site describes platform and partnerships but provides limited visible detail on governance artifacts or compliance posture.
    - Medium
    - Request privacy, security, AI-governance, and quality-system materials from the diligence room.
  notes: This register focuses on the most decision-relevant regulatory and legal exposures visible from public materials rather than providing an exhaustive legal review.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main AI-governance, IP, and partner-data legal risks evident in reviewed sources, not every possible jurisdiction-specific obligation.
