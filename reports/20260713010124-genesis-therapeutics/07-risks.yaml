- id: TR004
  title: Partner / customer / financial dependency register
  columns:
  - Dependency
  - Current signal
  - Why it matters
  - Residual risk
  - Diligence ask
  rows:
  - - Incyte
    - Expanded in 2026 with upfront cash, equity, recurring funding, and data sharing.
    - Strongest validation signal, but also the clearest single-account dependency.
    - High
    - Request revenue share, backlog, and termination rights for the Incyte relationship.
  - - Gilead
    - Still listed as active after 2024 collaboration.
    - Provides counterparty quality and continuity, but public scope remains limited.
    - Medium-High
    - Request target progression, active workstreams, and renewal / expansion triggers.
  - - Historical Lilly / Genentech references
    - Visible in older coverage, not on current partner page.
    - Shows past market access but does not diversify current visible revenue.
    - Medium
    - Request status of all prior collaborations and any ended relationships.
  - - Lumpy collaboration economics
    - Upfronts, research funding, milestones, and royalties dominate public economics.
    - Cash receipts may not equal durable recognized revenue or predictable renewal.
    - High
    - Request recognized revenue, deferred revenue, and milestone probability weighting.
  - - Private balance-sheet visibility
    - No public cash, burn, runway, or debt disclosure.
    - Underwriting capital adequacy is impossible without management data.
    - High
    - Request latest balance sheet, monthly burn, and financing plan.
  - - Buyer bargaining power
    - Large pharma counterparties have internal R&D and alternative external tools.
    - Sophisticated buyers can reprice, pause, or multi-home discovery work.
    - Medium-High
    - Request contract duration, exclusivity mechanics, and competitive win/loss context.
  - - Talent concentration
    - Senior bench appears strong but still relatively concentrated.
    - Leadership departures could weaken fundraising, science quality, or partner trust.
    - Medium
    - Request succession planning and retention structure for key AI and drug-discovery leaders.
  notes: Partner quality is an asset, but concentration and opacity keep residual exposure elevated.
