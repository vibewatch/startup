- id: TR005
  title: Mitigation, monitoring, and thesis-break table
  columns:
  - Risk
  - Current mitigation
  - Monitoring indicator
  - Thesis-break trigger
  rows:
  - - Translational risk
    - Internal pipeline + partner validation + wet-lab integration
    - Named candidate progression or clearer development milestones
    - No visible downstream asset progress despite continued spend and partnerships
  - - Partner concentration
    - Land-and-expand with large pharma
    - Breadth of active named partners beyond Gilead and Incyte
    - Loss or shrinkage of a top partner without offsetting new demand
  - - Financial opacity
    - Series B capital + Incyte equity + research funding
    - Disclosure of cash, burn, revenue quality, and backlog
    - Need for capital before clear progress while disclosure remains opaque
  - - Regulatory / governance burden
    - Regulated-pharma customer base should impose some discipline
    - Evidence of formal AI governance and quality systems
    - Partner or regulator requires controls Genesis cannot show cleanly
  - - IP / data-rights risk
    - Human scientific bench and partner contracts may protect workflows
    - Patent issuance, inventor records, and contract-rights clarity
    - Disputes or weak documentation undermine exclusivity or model-use rights
  - - People / execution risk
    - Strong public bench across AI and chemistry
    - Leadership retention and hiring continuity
    - Departure of key technical or scientific leaders without clear successor depth
  notes: Monitoring indicators focus on externally visible signals because the internal economics and control systems remain private.
