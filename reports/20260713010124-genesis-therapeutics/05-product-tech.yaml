- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Public structural data + synthetic structures
    - Supply baseline training signal for cofolding and related models
    - Protein structure repositories, physics-generated synthetic complexes, data curation
    - Sparse or biased data can cap generalization
  - - Pearl cofolding foundation model
    - Predict all-atom protein-ligand structures at scale
    - SO(3)-equivariant diffusion architecture, large-scale training compute
    - Benchmark wins may not fully translate across every target class
  - - Generalized templating and conditional inference
    - Inject scientist knowledge and prior structures at inference time
    - Usable templates, prompts, and expert steering
    - Opaque usage policy and conditioning heuristics outside public examples
  - - Physics-guided inference-time scaling and pose ranking
    - Generate, refine, and select higher-quality poses
    - Compute budget, ranking heuristics, validity checks
    - Marginal benefit versus cost is not publicly quantified per program
  - - DeCAF-Pearl flow-map distillation
    - Increase throughput for screening and synthetic-data generation
    - Teacher checkpoints, distillation regime, search heuristics
    - Faster model could create hidden quality regressions on edge cases
  - - Molecule generation and property prediction layers
    - Turn structural hypotheses into optimized candidate molecules
    - Integrated model stack and downstream scoring functions
    - Public module boundaries and calibration metrics are not disclosed
  - - Wet-lab and partner data feedback loop
    - Validate outputs and improve future models
    - Internal lab operations and partner experimental data sharing
    - Partner concentration and data-rights complexity can constrain scale
  notes: Architecture rows reflect the layer-level public picture; Genesis does not publish a full production-system diagram.
