- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Public benchmark reporting
    - Present
    - Runs N’ Poses, PoseBusters, OpenBind, plus disclosed training cutoffs
    - No full independent reproduction package surfaced publicly
  - - Physical-validity checks
    - Present
    - PoseBusters validity and physics-guided ranking emphasized in public materials
    - No broader model-governance or failure taxonomy is public
  - - Production-like evaluation signal
    - Present
    - OpenBind post says production hyperparameters were used without benchmark-specific tuning
    - No campaign-level deployment telemetry or incident history
  - - Partner-data training controls
    - Partial
    - Incyte expansion discloses secure use of proprietary experimental data to improve GEMS
    - Exact governance, separation, and audit controls are not public
  - - Security / privacy / compliance certifications
    - Not disclosed publicly here
    - No public SOC 2, ISO, GxP, or equivalent assurance surfaced on reviewed pages
    - Need diligence on security and regulated-data handling
  - - Developer / partner documentation surface
    - Not disclosed publicly here
    - No public API docs or external integration portal found on reviewed surfaces
    - Hard to judge deployment maturity outside direct partners
  - - Clinical or translational validation
    - Limited public evidence
    - Public proof centers on structure prediction and discovery workflow, not human clinical outcomes
    - Need evidence that model gains improve downstream therapeutic success
  notes: Absence of a disclosed control does not prove it is absent internally; it means it was not visible on public surfaces accessed for this report.
