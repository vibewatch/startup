- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Genesis solution
  - Measurable benefit
  - Limitation
  rows:
  - - Predict a protein-ligand complex from sparse prior knowledge
    - Start from protein sequence and ligand 2D structure before a pocket is fully characterized
    - Pearl unconditional cofolding mode
    - Lets teams generate structure hypotheses before full structural context exists
    - Public sources do not provide hit-rate by target class or campaign stage
  - - Refine around a known pocket or prior structure
    - Use existing structural or binding-site hints to guide design
    - Pearl conditional mode and generalized templating
    - Supports scientist-in-the-loop hypothesis testing and higher-accuracy conditioning
    - No public explanation of how often conditioning is required in production
  - - Rank multiple candidate poses for a target
    - Generate pose sets and choose plausible structures for follow-up
    - Pearl system inference-time scaling plus physics/AI pose ranking
    - Public OpenBind results show stronger zero-shot and sub-angstrom performance
    - Public cost-per-best-of-k workflow is undisclosed
  - - Screen larger ligand libraries under fixed compute budget
    - Trade off model quality against screening throughput
    - DeCAF-Pearl few-step cofolding workflow
    - About 5x faster inference expands screening and synthetic-data generation throughput
    - Quality-versus-compute trade-offs remain campaign dependent
  - - Improve models using real experimental programs
    - Close the loop between design, make, test, and model retraining
    - GEMS plus partner and internal data flywheel
    - Expanded Incyte deal adds proprietary experimental data for training
    - Data-rights governance and contamination controls are not public
  - - Coordinate AI, chemistry, and biology execution
    - Move from modeling output into wet-lab and program decisions
    - Integrated platform plus San Diego lab and partner deployment
    - Supports a full-stack discovery workflow rather than offline model evaluation
    - No public workflow timings or cross-functional productivity metrics
  notes: Benefits are described from public technical and partner disclosures, not from audited ROI studies or program-level dashboards.
