- id: product-tech-verdict-and-diligence-asks
  title: Product-tech verdict and diligence asks
  body: The product-tech verdict is positive on technical ambition and unusually positive on public proof compared with other private techbio companies. Genesis can point to a coherent stack narrative, public benchmark wins, a throughput story through DeCAF-Pearl, active hiring, and partner data flywheels that make the product more than marketing copy. The company’s strongest claim is not that it has one excellent model; it is that it is assembling an integrated molecular-AI operating system with real deployment into internal and partnered programs. The remaining concern is observability. Investors still cannot see detailed program-level productivity data, failure rates, architecture operations, model-governance controls, or a dated roadmap for what becomes broadly deployable next. Before underwriting the platform as durable differentiated infrastructure, diligence should request internal architecture reviews, benchmark methodology packets, model-governance and security materials, and evidence
    that the public structure-prediction gains translate into better design-make-test economics inside active programs.
