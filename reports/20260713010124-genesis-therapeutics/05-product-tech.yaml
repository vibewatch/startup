  rows:
  - - GEMS platform
    - Computational chemists and discovery teams
    - Live core platform
    - Combines foundation models, agents, and exploratory tooling in one discovery stack
    - No public usage metrics, API surface, or program throughput dashboard
  - - Pearl foundation model
    - Structure-prediction scientists
    - Frontier / actively deployed
    - Protein-ligand cofolding model with synthetic-data training, geometric priors, and controllable inference
    - Need benchmark protocol packet and internal-to-public performance reconciliation
  - - Pearl system
    - Drug-hunting teams needing ranked poses
    - Live workflow layer
    - Adds inference-time scaling plus physics and AI pose ranking on top of the base model
    - No public disclosure of compute cost per campaign or user-facing operational constraints
  - - DeCAF-Pearl distillation layer
    - High-throughput screening and synthetic-data workflows
    - Newly disclosed / maturing
    - Roughly 5x faster inference with far fewer model calls while preserving much of teacher quality
    - Need evidence on where speed gains matter most in real campaigns
  - - Partner-program deployment
    - Genesis + pharma collaboration teams
    - Commercially validated but concentrated
    - Same platform deployed into internal and partnered programs, with partner data feeding model improvement
    - Concentration on a few strategic partners raises dependency and disclosure risk
  - - Integrated lab + internal pipeline loop
    - Model, chemistry, and biology teams
    - Operational but preclinical
    - Wet-lab feedback can turn model outputs into a discovery flywheel instead of offline benchmarking only
    - No public cycle-time or hit-to-lead conversion data
