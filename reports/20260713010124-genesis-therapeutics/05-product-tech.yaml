callouts:
- calloutType: strength
  title: Genesis’s strongest asset is the integration of models, scientist controls, and data flywheels into one discovery stack
  body: Public materials show Genesis building more than a benchmarking model. The company combines cofolding, guided inference, acceleration, molecule design, and wet-lab or partner feedback into a unified workflow that can be deployed in both internal and partnered programs.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE023
  - CE025
  - CE040
- calloutType: risk
  title: Public technical proof is strong, but public operating disclosure is still shallow
  body: Investors can see benchmark wins and recruiting momentum, but still cannot inspect model-governance controls, production reliability, developer interfaces, or downstream program-economics data. That makes Genesis easier to admire technically than to underwrite operationally.
