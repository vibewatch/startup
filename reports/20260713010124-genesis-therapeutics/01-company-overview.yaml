- id: funding-capital-and-stage-proof
  title: Funding History, Capital Formation, and Stage Proof
  body: The financing chronology is clearer than the valuation story. Forge’s funding-round table shows a $4.12 million seed round in November 2019, a 2020 Series A assembled across tranches that totals roughly $52 million, and a 2023 Series B process that totals about $204 million across B, B-1, and B-2 tranches. Company and third-party 2023 coverage compress that into an “oversubscribed $200 million Series B,” with investors including a16z, Fidelity, BlackRock, NVIDIA, Menlo Ventures, T. Rowe Price, Radical Ventures, and Rock Springs. By late 2024, a BioSpace leadership release said Genesis had raised over $300 million, a figure that can be reconciled if one includes post-Series B financings or later partnership-linked capital. The most important fresh financing evidence for the current report is Incyte’s May 2026 $40 million equity purchase alongside an $80 million cash upfront payment. That event demonstrates that Genesis is no longer financed purely as a speculative platform startup;
    a large public biopharma partner was willing to commit both collaboration capital and balance-sheet equity at a negotiated price. At the same time, public valuation references remain noisy. Forge shows a May 2026 post-money valuation of about $806.8 million based on certificate data, while weaker trackers publish contradictory revenue and valuation figures. The disciplined takeaway is not a clean unicorn mark, but a well-financed private company with real sponsor and partner support.
