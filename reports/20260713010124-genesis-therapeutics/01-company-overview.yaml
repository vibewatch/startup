  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A primary document or company-confirmed post-money valuation for the 2026 Incyte equity round and any subsequent financing activity.
    whyItMatters: Public secondary values conflict sharply, making entry discipline and dilution analysis unreliable.
    diligencePath: Request the 2026 stock purchase agreement or board-approved financing materials and reconcile against secondary trackers.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, and the split between collaboration revenue, research funding, milestone revenue, and any internal program monetization.
    whyItMatters: Without revenue quality and mix, later financial and valuation analysis remains mostly structural rather than quantitative.
    diligencePath: Obtain management KPI pack or audited financial statements that break out recurring versus milestone-based revenue.
    relatedQuestionRefs:
    - QO013
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A current official headcount and function split across AI research, chemistry, biology, and G&A.
    whyItMatters: Hiring density and functional mix affect burn, execution capacity, and the credibility of simultaneous platform and pipeline ambitions.
    diligencePath: Request current HR headcount by function and compare with tracker estimates and office footprint.
    relatedQuestionRefs:
    - QO014
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A company-confirmed statement on whether Burlingame or San Mateo is the current principal Bay Area office and when any change occurred.
    whyItMatters: The issue is not economically major, but it signals how carefully the public record is maintained and affects profile consistency across sources.
    diligencePath: Confirm legal headquarters and current office footprint directly with investor relations or operations.
    relatedQuestionRefs:
    - QO015
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: The full board roster, ownership percentages, liquidation preferences, and investor control terms for the current capitalization table.
    whyItMatters: Governance and preference overhang directly shape financing risk, dilution, and valuation interpretation.
    diligencePath: Request the current cap table, board observer list, and major investor rights summary.
