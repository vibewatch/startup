- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'Founder-market fit is one of the strongest parts of the public record. Evan Feinberg’s profile says he founded Genesis in 2019 to develop AI and simulation research from Vijay Pande’s lab at Stanford University, including the PotentialNet framework for difficult and data-poor targets. That lineage matters because Genesis still markets itself as a company where frontier model development and medicinal chemistry are tightly coupled, not as a thin application layer over general-purpose models. The current team pages establish a senior bench with both software and drug-development depth: Will McCarthy leads corporate functions as COO, Sergey Edunov brings large-model and infrastructure experience from Meta as CTO, and Shifeng Pan brings decades of medicinal chemistry leadership as CSO. Governance also matured in 2024. A BioSpace leadership announcement says Paul Friedman became chairman, Alla Ivanova joined as SVP of Engineering, Vijay Pande joined the board in 2023, and NVIDIA NVentures
    head Mohamed Siddeek joined as an observer in 2024. The board-facing team pages also surface investors or directors tied to Radical Ventures, Rock Springs, and a16z, implying a governance structure that is both AI-native and heavily sponsor-linked. What remains missing is cap-table granularity, ownership percentages, and any published discussion of voting control or protective provisions.'
