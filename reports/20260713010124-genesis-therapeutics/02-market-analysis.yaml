company:
  name: Genesis Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: Genesis Therapeutics sells into the narrow AI drug discovery platform market—roughly $2.6-3.1 billion in 2025 by conservative analyst definitions—while drawing value from a far larger small-molecule discovery economy measured in the tens of billions and from global biopharma R&D budgets that remain above pre-pandemic levels. Demand is concentrated among large pharmaceutical and advanced biotech buyers that need structure-based design, target validation, and lead-optimization acceleration, but adoption still faces data, validation, regulatory, and workflow-integration constraints that keep Genesis’s near-term serviceable market much narrower than headline TAM figures.
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Multi-Lens Sizing
  body: 'Genesis does not compete in the full pharmaceutical value chain; it competes in the computational and decision-support layer that sits upstream of wet-lab validation, clinical development, manufacturing, and commercialization. The narrowest market lens is the AI drug discovery platform category measured by firms such as Mordor Intelligence and Global Market Insights. Those estimates put the market at roughly $2.58-3.1 billion in 2025 and $3.25-4.0 billion in 2026, with high-20s to low-30s CAGR expectations. The broader but still relevant lens is the small-molecule drug discovery market. Precedence Research and The Business Research Company place that market at about $67.9-95.6 billion in 2025 and $75.6-103.3 billion in 2026, depending on scope and methodology. Those larger numbers include workflows, services, and broader discovery spend that Genesis only partially addresses, but they show why a company that improves hit identification, lead optimization, and structure-based design
    can sell into very large budgets. Citeline and IQVIA supply the outermost context. Citeline says the active global R&D pipeline contains 22,940 drugs at the start of 2026, while IQVIA says biopharma R&D remained resilient in 2025 even as productivity pressure rose. The analytical conclusion is that Genesis’s true market sits inside a layered stack: a low-single-digit-billion AI platform market within a much larger discovery-spend envelope.'
