- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Genesis moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Partner data flywheel
    - Partners spread similar data to other AI vendors or internal teams
    - High
    - Data advantage compounds only if it stays unique and keeps improving models
    - Request contract terms around data use, exclusivity, and model rights
  - - Hard-target small-molecule specialization
    - Isomorphic, Recursion, or internal pharma teams reach similar target classes with more capital
    - High
    - Genesis could lose differentiation if structural AI becomes table stakes
    - Ask for head-to-head benchmark results and win/loss examples
  - - Forward-deployed scientific teams
    - Service intensity caps scaling relative to software-like rivals
    - Medium
    - High-touch deployment can deepen accounts but constrain concurrency
    - Quantify active programs per FTE and program gross margins
  - - Commercial validation from Gilead / Incyte
    - No clinical success yet from internal pipeline
    - High
    - Without human data, revenue validation may not translate into durable premium pricing
    - Track development-candidate nominations and any IND timeline disclosures
  - - Focused small-molecule scope
    - Broader AI-scientist or multimodal platforms capture upstream budget before Genesis enters
    - Medium
    - Budget can shift toward integrated biology or decision-support platforms
    - Map where Genesis sits in partner procurement workflow and who owns budget
  - - Model quality moat
    - Open-model diffusion and big-tech tooling commoditize pure algorithm claims
    - High
    - If models commoditize, execution and data become the only durable edges
    - Request independent external benchmarks versus AlphaFold-derived and physics-based alternatives
  notes: Severity reflects public-source competitive judgment rather than a quantified loss model; mitigation items are diligence requests, not confirmed management plans.
