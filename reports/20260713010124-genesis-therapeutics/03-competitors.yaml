- id: SP003
  title: Capability, Packaging, and Go-to-Market Comparison
  body: |-
    The field splits into several economically distinct models. Genesis, Recursion, Isomorphic, and Insilico all monetize through multi-target collaborations, milestone ladders, royalties, and in some cases equity-linked partner financing. Genesis’s disclosed economics are a $35 million upfront from Gilead in 2024 and, from Incyte’s 2026 expansion, $120 million upfront that includes an $80 million cash payment and a $40 million equity purchase. Isomorphic’s disclosed Lilly and Novartis collaborations benchmark that frontier-model category at $45 million and $37.5 million of upfront cash, respectively, before milestones and royalties. Recursion’s Sanofi and Bayer partnerships show that scaled platform providers can push headline economics still higher, while insitro’s Lilly structure demonstrates that some AI-native players can keep more program rights instead of acting like classical fee-for-service vendors.

    Capabilities differ more than the shared “AI drug discovery” label suggests. Genesis’s public wedge is structure and property prediction for hard-to-drug small-molecule targets, reinforced by a wet-lab flywheel and forward-deployed scientists. Recursion emphasizes industrialized phenomics, causal biology, and automated experiments at massive scale. Schrödinger sells high-accuracy molecular modeling tools that fit into existing pharma workflows. Insilico markets an end-to-end stack across target identification, chemistry, and clinical-trial analytics. insitro focuses more on multimodal disease understanding and ML models that connect human and cellular data. Isomorphic leads with structural and generative models descended from AlphaFold-era research, while Xaira is building a broad foundation model plus data-generation stack with therapeutics to follow.

    Go-to-market power today favors the companies with either installed workflow presence or repeated top-pharma validation. Schrödinger wins on installed software distribution, Recursion on breadth and partner count, and Isomorphic on capital plus marquee collaborations. Genesis’s go-to-market evidence is narrower but still real: two major pharma logos, one of which deepened into data-sharing plus equity investment. That is a stronger signal than an unfunded concept deck, but weaker than the distribution of Schrödinger, the clinical proof of Insilico and Relay, or the balance-sheet strength of Isomorphic and Xaira.
