- id: SP002
  title: 'Direct Peer Profiles: Scale, Maturity, and Strategic Direction'
  body: |-
    Recursion is the scale benchmark for AI-first techbio. Public materials describe a platform built on more than 50 petabytes of proprietary biological and chemical data, automated labs processing millions of cell experiments per week, and a partnership roster that includes Bayer, Sanofi, Merck KGaA, Tempus, Helix, Google Cloud, and NVIDIA. Its pipeline page and 2025 Fierce coverage also show a meaningful clinical footprint even after pruning: six active development projects remained after the company deprioritized several programs. That makes Recursion a threat on breadth, partner access, and enterprise credibility, even though its 2025 reshuffle is also a warning that scale does not eliminate biological risk.

    Schrödinger is a different type of competitor: an incumbent computational chemistry platform with more than 30 years of R&D, a software-centric installed base, and a therapeutics business layered on top. Its platform is marketed around physics-based prediction rather than generative biology branding, and its pipeline includes internal programs plus partnered assets that reach Phase 3 through collaborators. For Genesis, Schrödinger is less a mirror image than a substitute stack: a buyer can pair Schrödinger tools, in-house scientists, and external wet-lab work instead of paying Genesis for an integrated discovery collaboration.

    Insilico Medicine and insitro are the two most instructive private peers. Insilico publicly shows the deepest AI-native small-molecule pipeline, with 40-plus programs, 13 IND approvals, and a Phase II fibrosis program discovered using Pharma.AI. insitro is less clinically advanced in public disclosures, but its strength is the combination of human clinical data, cellular data, and flexible rights structures with large partners such as Lilly; it has also disclosed more than $700 million of capital raised by late 2025. Isomorphic Labs and Xaira define the capital-rich frontier-model flank. Isomorphic now combines AlphaFold3 heritage, IsoDDE performance claims, a $2.1 billion Series B, and collaborations with Lilly, Novartis, and J&J. Xaira launched with $1 billion and is building an integrated AI, data, and therapeutics stack oriented toward difficult biology and antibody-style programs. By contrast, Genesis has better current partner proof than Xaira, but far less disclosed capital than either Xaira or Isomorphic and far less public clinical maturity than Insilico, Relay, Recursion, or Schrödinger’s therapeutics arm.
