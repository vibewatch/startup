      - number: '8.3'
        title: 牛市、基准、熊市情景与不完美可比公司
        blocks:
          - type: paragraph
            body: >-
              情景分析比点估值更有用，因为 Genesis 同时横跨多个类别：类软件平台、合作驱动的技术生物模式，以及临床前资产公司。牛市情景下，Genesis
              超越当前可见伙伴集中，展示内部或合作项目中更清晰的候选药物进展，并把技术边际优势转化为可重复的药企平台特许价值。在这种世界里，$1.5-2.0B 估值可以被解释为私营 AI
              生物科技公司的稀缺溢价标记。基准情景下，Genesis 仍有战略价值，但披露不完整；有融资支持和真实客户，却仍没有公开收入质量或临床证据，这支持更接近约 $0.8-1.2B
              的区间，接近或略高于当前最清晰的二级市场锚点。熊市情景下，伙伴势头放慢、转化风险未解、私募市场倍数压缩，可支撑区间下移到约
              $0.5-0.8B。可比公司有帮助，但只能给方向。Recursion、Schrödinger 和 Relay 等上市公司，在软件收入、合作收入、管线选择权价值和公开市场流动性上的组合差异很大。Xaira 和
              Isomorphic 等私募融资显示投资人仍积极资助 AI 生物学，但这些是信号型可比，不是口径完全一致的运营可比。
