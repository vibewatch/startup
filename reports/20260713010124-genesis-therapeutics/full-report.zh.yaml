      - number: '3.4'
        title: 切换成本、多家并用与分发权力
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本不像传统 SaaS 锁定。它由三件事构成：合作方数据共享、绑定这些数据的模型再训练，以及围绕活跃发现项目的法律 / IP 脚手架。Incyte 扩大后的 Genesis
              合作很有参考价值，因为它明确加入自有实验数据用于 GEMS 训练，同时拓宽靶点集合。一旦这种工作流开始运行，真实切换成本就不是软件订阅，而是共享数据上下文、内部推动者时间，以及项目专属 IP
              连续性的合并损失。insitro 与 Lilly 的协议以另一种形式展示了类似动态：ML 模型基于合作方自有数据集训练，并嵌入未来决策。


              同时，多家并用仍是常态。大型药企可以、也确实会同时与多家 AI 提供商合作，因为它们在靶点发现、结构预测、药物化学、转化生物学和患者分层上的需求并不相同。Genesis 当前合作方并不能证明它们把所有 AI
              预算独家交给 Genesis；它们只证明 Genesis 赢下了一类工作。这很重要，因为同一个买方可能内部使用 Schrödinger，与 Isomorphic 合作一个前沿模型项目，在代谢或 RNA
              使能生物学上与 insitro 合作，同时仍在难成药小分子靶点上与 Genesis 合作。


              因而，分发权力偏向已嵌入工作流或反复赢得采购的既有玩家。Schrödinger 的软件足迹，是这组公司里最强的经典分发护城河。Recursion
              的广泛合作名单创造了第二种分发权力：来自肿瘤、免疫和数据合作等交易对手的反复信任。Genesis
              的分发优势窄得多，也更依赖关系。当前证据指向高接触部署模式，而不是大众化平台铺开。这可以在有效账户中支撑强账户深度，但也意味着公司仍暴露在集中度风险下，并面临算力预算更大、BD 团队更大或治疗覆盖更广的对手。
