      - number: '5.3'
        title: 基准测试、吞吐量与工程信号
        blocks:
          - type: paragraph
            body: >-
              Genesis 公开披露的基准细节，比多数私营 AI 药物发现公司更多。Pearl 帖文和 arXiv 报告称，该模型在 Runs N’ Poses 和 PoseBusters 上超过 AlphaFold 3
              及其他开放基线；OpenBind 帖文则更接近运营层，描述了在公开基准上的零样本、口袋条件化和重对接场景，并给出明确的 RMSD 与有效性阈值。DeCAF-Pearl
              蒸馏帖同样重要，因为它解决的是吞吐量，不只是峰值准确率：Genesis 称，相比 Pearl 教师检查点，模型调用次数约少 20 倍，端到端推理速度约快 5
              倍。这对虚拟筛选和合成数据生成很关键。公开工程信号也支持公司继续投入平台。招聘页面显示，公司在软件工程、机器学习、计算化学和生物学等岗位招人，包括一个聚焦计算化学或分子动力学的 Senior / Staff
              Software Engineer 职位。Sergey Edunov 和 Shifeng Pan 等领导层加入，也强化了 Genesis 仍在同时建设平台的 AI 侧和治疗侧。Genesis
              现在还露出了有限的公开代码面：genesistherapeutics/decaf GitHub 仓库发布了 DeCAF 方法的示例脚本、评估说明和检查点路径，这比单看招聘更像具体的开发者信号。
