      - number: '1.3'
        title: 融资历史、资本形成与阶段证明
        blocks:
          - type: paragraph
            body: >-
              融资时间线比估值故事更清楚。Forge 的融资轮次表显示，2019 年 11 月种子轮为 $4.12M，2020 年 Series A 由多个分批组成、合计约 $52M，2023 年 Series B 流程横跨
              B、B-1 和 B-2，合计约 $204M。公司和第三方 2023 年报道把它压缩成“超额认购的 $200M Series B”，投资方包括
              a16z、Fidelity、BlackRock、NVIDIA、Menlo Ventures、T. Rowe Price、Radical Ventures 和 Rock Springs。到 2024 年底，一份
              BioSpace 领导层公告称 Genesis 已融资超过 $300M；如果纳入 Series B 之后的融资或后续合作方挂钩资本，这个数字可以对上。当前报告最重要的新融资证据，是 Incyte 2026 年 5
              月在 $80M 现金预付款之外购买 $40M 股权。该事件说明 Genesis 已经不再只是按投机性平台创业公司融资；一家大型上市 biopharma
              合作方愿意按谈判价格同时投入合作资本和资产负债表股权。与此同时，公开估值参考仍然噪声很大。Forge 基于证书数据给出 2026 年 5 月约 $806.8M
              的投后估值，而质量较弱的追踪网站发布互相冲突的收入和估值数字。审慎结论不是一个干净的独角兽标记，而是一家融资充足、确有赞助方和合作伙伴支持的私营公司。
