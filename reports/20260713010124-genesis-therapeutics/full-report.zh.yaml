  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与多视角测算
        blocks:
          - type: paragraph
            body: >-
              Genesis 并不参与完整制药价值链；它竞争的是湿实验室验证、临床开发、生产和商业化上游的计算与决策支持层。最窄的市场视角，是 Mordor Intelligence 和 Global Market
              Insights 等机构测算的 AI 药物发现平台类别。这些估算把 2025 年市场规模放在约 $2.58-3.1B，2026 年放在 $3.25-4.0B，并预期 CAGR 处于高 20% 到低 30%
              区间。更宽但仍有关联的视角，是小分子药物发现市场。Precedence Research 和 The Business Research Company 按范围和方法不同，把该市场估为 2025 年约
              $67.9-95.6B、2026 年约 $75.6-103.3B。这些更大的数字包含 Genesis
              只覆盖一部分的工作流、服务和更广义发现支出，但它们解释了为什么一家能改善命中识别、先导优化和基于结构设计的公司，可以卖进非常大的预算池。Citeline 和 IQVIA 提供最外层背景。Citeline
              称，2026 年初全球活跃 R&D 管线包含 22,940 个药物；IQVIA 则称，虽然生产率压力上升，2025 年 biopharma R&D 仍保持韧性。分析结论是，Genesis
              的真实市场位于一个分层堆栈内部：一个低个位数十亿美元级 AI 平台市场，嵌在远大得多的发现支出外壳里。
