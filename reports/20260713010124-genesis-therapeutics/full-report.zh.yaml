      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              围绕药物开发的 AI 治理边界正变得更清楚，运营上有帮助，但也提高了合规负担。FDA 的 2025 年草案指南和 2026 年 AI 药物开发材料显示，监管采用基于风险的方法，核心是针对支持监管决策的 AI
              评估可信度、预期用途和全生命周期监督。FDA-EMA 联合 good-AI-practice 原则延续这一方向，强调开发生命周期中的数据质量、人类监督、性能评估和维护。在产品特定监管通道之外，更广泛的 AI
              法律仍然碎片化。EU AI Act 正分阶段对 AI 系统施加有约束力的义务，并为风险管理、透明度、文档和监督建立更正式的合规架构。美国治理仍更拼图式：CRS 报告、Gunder 的 2026 年法律更新，以及
              Cooley 对 Illinois 审计的分析，都指向联邦、州和国际规则日益混杂。即使公司尚未被某项具体法律直接覆盖，这些规则也会影响合同、尽调预期和下游合规。IP 又加了一层法律风险。Goodwin 对 AI
              药物发现专利法的分析认为，当 AI 深度参与化合物生成时，发明人身份和充分公开会更难处理；也就是说，Genesis 记录人类科学贡献和可复现开发逻辑的能力，可能和原始模型性能一样重要。
