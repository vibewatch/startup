    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              公开记录中，Genesis 没有明显的近期存亡红旗，但确实面对一组对投资判断很重要的结构性风险。最高剩余敞口是转化风险、伙伴集中和财务不透明。转化风险排第一，因为 Genesis
              的公开证据仍止步于临床前发现和合作伙伴扩张，而不是人体疗效或获批产品经济性。伙伴集中排第二，因为当前公开商业故事实际上集中在 Gilead 和 Incyte，且 Incyte 在 2026
              年扩展合作后重要性不成比例。财务不透明排第三，因为 Genesis
              披露了合作经济条款和融资信号，却没有披露收入、现金消耗、现金余额、现金续航期、客户集中度或项目级表现。监管和法律风险真实存在，但更偏中期：FDA、EMA、NIST 和 EU 政策环境正让 AI 治理预期更明确，而
              AI 相关 IP 和州法合规问题仍在演进。实际结论是，Genesis 看起来已获得战略验证，但任何想在临床证据出现前就获得上市公司式可预测性的投资人，仍要面对高风险。
