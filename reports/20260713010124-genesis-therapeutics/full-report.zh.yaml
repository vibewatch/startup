      - number: '5.2'
        title: 架构、模型栈与数据飞轮
        blocks:
          - type: paragraph
            body: >-
              Genesis 技术叙事里最可信的一块，是公开模型栈足够具体。AI 研究页面称，公司把重点放在用物理学扩展深度学习，研究围绕强化学习、多模态学习，以及几何或 3D 深度学习展开。Pearl
              技术报告把这件事落到细节：Pearl 使用大规模合成数据、SO(3) 等变扩散模块，并用泛化模板化在蛋白质和非聚合物组分之间做可控推理。最初的 Incyte 合作把 GEMS
              描述为结合语言模型、扩散模型和物理模拟；2026 年扩展合作又称，Incyte 将共享专有实验数据，以改进下一代 GEMS
              模型。合起来看，公开架构像一个飞轮：结构数据和伙伴数据喂给基础模型；基础模型驱动姿态预测、生成和性质估计；湿实验结果再形成更好的训练信号。主要尽调缺口在于，Genesis
              描述的是研究层模型栈，不是生产系统层，所以服务边界、数据治理控制和可复现工具仍不透明。Stanford 关于创始人 Evan Feinberg 在创办公司前于 Vijay Pande
              实验室研究的页面，也显示技术路线有延续性：在创立 Genesis 前，公开资料称他在开发用于计算机模拟先导化合物识别的深度神经网络架构。
