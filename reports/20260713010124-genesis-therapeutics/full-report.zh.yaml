      - number: '7.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 最大风险仍是生物学，不是品牌包装
            body: Genesis 获得的伙伴验证优于许多 AI 药物发现初创公司，但可见证据仍停在人体临床结果之前。这让转化风险高于纯商业或法律顾虑。
