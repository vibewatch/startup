chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Genesis Therapeutics 最适合被理解为一家私营、临床前 AI 药物发现公司，最近对外品牌转向 “Genesis Molecular AI”。当前首页和 AI
              平台页面把公司描述为小分子药物发现的基础模型和 AI 操作系统，而不是单一资产型生物科技公司，也不是横向 SaaS 厂商。GEMS 是 Genesis Exploration of Molecular Space
              的缩写，被定位为核心平台：它把基础模型、智能体和化学工具接在一起，用来生成并筛选药物想法。公司的公开足迹横跨多地，但办公室标注并不完全清晰。当前联系页面列出 San Mateo、San Diego 和 New
              York 办公室；合作伙伴与管线页面则称 AI 研究位于 Bay Area 和 New York City，湿实验室在 San Diego。较早的 2024 年领导层材料仍称 Genesis 总部在
              Burlingame, California，这更像办公室搬迁或邮寄地址更新，而不是对 Bay Area 核心基地的根本矛盾。按阶段看，公司已经明显越过早期平台故事：它完成了大额 Series
              B，运营内部肿瘤和免疫学项目，也拥有当前大型药企合作，既带来非稀释性现金，也带来战略背书。
