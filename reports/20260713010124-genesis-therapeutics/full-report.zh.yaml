            body: >-
              产品与技术结论是：技术雄心值得肯定，公开证据相较其他私营技术生物公司也异常扎实。Genesis 能拿出连贯的模型栈叙事、公开基准胜利、DeCAF-Pearl
              带来的吞吐量故事、活跃招聘，以及让产品不止停留在营销文案的合作伙伴数据飞轮。公司最强的主张不是拥有一个优秀模型，而是在组装一套整合式分子 AI
              操作系统，并真正部署到内部项目和合作项目中。剩下的担忧是可观测性。投资人仍看不到详细的项目级生产率数据、失败率、架构运营、模型治理控制，也看不到下一步哪些能力会被更广泛部署的有日期路线图。在把平台按耐久、差异化基础设施定价前，尽调应索取内部架构评审、基准方法包、模型治理和安全材料，并要求证明公开的结构预测提升能在在研项目中转化为更好的
              设计-合成-测试经济性。
