      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动，是 biopharma R&D 的成本和周期危机。IQVIA 描述了有韧性但承压的 R&D 支出、更长开发周期，以及提升生产率的需求；Frontiers 综述同样把药物 R&D
              描述为被高成本、长周期和低成功率拖累。这正是 Genesis 要卖给客户的痛点。其他几个驱动也在强化机会：在 IQVIA 数据集中，小分子在 Phase I 试验中的占比 2025 年回升到
              62%，在大型公司中升至 66%；市场研究机构反复提到慢性病负担、精准医疗、高通量筛选和 biotech-pharma 合作增加，都是需求加速器；监管方也开始直接介入。FDA 2025
              年指南草案为用于药物和生物制品决策的 AI 模型引入基于风险的可信度框架，FDA 与 EMA 2026 年良好 AI 实践原则则显示监管边界正在变得更可读。约束同样重要。Frontiers 和 MDPI
              综述强调数据稀疏、3D 感知表征、可解释性和可信验证。2026 年 MDPI “validation crisis” 综述更直接：自 2022 年以来，超过 $100B 资金涌入 AI
              生命科学热潮，但临床影响仍不确定，项目高淘汰和可复现性缺口持续存在。对 Genesis 来说，这些约束意味着买方可能先为发现加速付预付款，但只有当 AI
              引导的分子能转化为扎实的湿实验室和临床结果时，才会扩大支出。
