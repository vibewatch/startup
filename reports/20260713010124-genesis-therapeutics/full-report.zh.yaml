      - number: '4.4'
        title: 资本充足性、交易对手质量与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性是 Genesis 财务故事里最强的部分，虽然仍只露出一部分。官方和独立公开来源确认，2023 年完成超额认购的 $200M Series B；公司口径称截至 2024 年底 Genesis 已融资超过
              $300M；此后还获得合作方的重大战略资本。仅自 2024 年以来，已披露的合作挂钩预付款和股权对价至少达到 $185M：Gilead $35M、初始 Incyte 合作 $30M，以及 2026 年
              Incyte 扩展合作 $120M（含股权）。Forge 的二级市场资料指向约 $340.28M 累计融资，并把 2026 年 5 月 Incyte 股权购买视为融资事件；但 Forge
              是二级数据提供方，不是公司申报文件，因此这个数字应作为可见性边界使用，而不是精确现金余额。


              关键提醒是，上述信息都不等于手头现金。Genesis
              不披露资产负债表、不披露现金或受限现金、不披露债务期限表，也不给跑道指引。公开资本支持可能很强，但如果公司在扩大算力、大量招聘并推进多个内部项目，现金消耗仍可能很激进。已审阅来源也没有披露债务、项目融资或信贷额度；方向上这是正面信号，但远不足以建模义务。


              交易对手质量显著增强了这幅图。SEC companyfacts 显示，Incyte 2025 年收入 $5.14B，并在 2026 年 Q1 持有约 $3.46B 现金和受限现金。Gilead 的 SEC
              companyfacts 显示，2025 年收入 $29.44B，并在 2026 年 Q1 持有约 $7.63B 现金和受限现金。这些不是 Genesis
              的资产，但很重要：它们降低了交易对手信用风险，也让已承诺研究经费、里程碑和持续合作支出更可能实际支付。因此，剩下的融资依赖问题不是合作方能不能付钱，而是 Genesis
              自身内部野心会不会在出现清晰临床拐点前超过当前资金。
