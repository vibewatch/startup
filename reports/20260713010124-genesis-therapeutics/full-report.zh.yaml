      - number: '4.3'
        title: 成本结构与单位经济代理
        blocks:
          - type: paragraph
            body: >-
              Genesis 不公布 P&L，因此任何单位经济视角都只能靠代理推断。不过，公司的 AI 平台和合作伙伴页面已经把成本堆栈在概念上暴露出来。Genesis
              不是纯软件公司：它运营湿实验室循环，推进内部管线，派驻科学家到合作方团队旁边，并训练算力密集型分子模型。这意味着成本基数主要由科学人员、模型训练和推理算力、实验验证，以及合作方专属执行工作构成。换句话说，Genesis
              的交付成本可能高于云软件厂商，但商业化基础设施成本低于承担大规模临床和生产义务的后期 biotech。


              公开同行有助于框定边界。Recursion 的申报文件和 2025 年 Q1 公告显示，合作模式资本消耗很重，经营现金消耗相对于收入很大。Schrödinger
              的申报文件和财务摘要则展示了已装机软件模型的经济性：毛利率更好，收入转化更可见，即便它仍在资助治疗管线。Genesis
              的交付模型在结构上更接近前者而非后者，因为其平台明确嵌入合作方工作流，并与湿实验室活动耦合。这意味着最重要的缺失指标不是好看的收入总额，而是确认合作收入、收入成本、递延收入、毛利率、月度消耗，以及支出中内部项目与合作方工作各占多少。


              实际投资后果是，Genesis 的单位经济目前无法从公开来源得知。任何年度消耗或月度消耗估计，都必须被视为由可比公司推导出的代理值，而不是关于 Genesis 本身的事实。但这个方向仍有用：它暗示 Genesis
              很可能是一门消耗资本的 R&D 生意，未来融资需求较少取决于获客成本，更多取决于合作方续约、候选物推进，以及内部管线野心和外部资助工作之间的平衡。
