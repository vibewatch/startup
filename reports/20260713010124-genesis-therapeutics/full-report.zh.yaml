      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，是公开记录里最强的部分之一。Evan Feinberg 的资料显示，他 2019 年创办 Genesis，是为了发展 Stanford University Vijay Pande 实验室的
              AI 与模拟研究，其中包括面向高难、少数据靶点的 PotentialNet 框架。这条脉络重要，因为 Genesis
              仍把自己包装成一家前沿模型开发和药物化学紧密耦合的公司，而不是搭在通用模型上的轻应用层。当前团队页面显示，高管梯队同时具备软件和药物开发深度：Will McCarthy 以 COO 身份负责公司职能，Sergey
              Edunov 从 Meta 带来大模型和基础设施经验并担任 CTO，Shifeng Pan 以 CSO 身份带来数十年药物化学领导经验。治理也在 2024 年成熟。BioSpace 领导层公告称，Paul
              Friedman 出任董事长，Alla Ivanova 加入并担任工程 SVP，Vijay Pande 于 2023 年加入董事会，NVIDIA NVentures 负责人 Mohamed Siddeek 于
              2024 年加入担任观察员。面向董事会的团队页面还露出与 Radical Ventures、Rock Springs 和 a16z 绑定的投资人或董事，说明治理结构既有 AI
              原生色彩，也高度依赖赞助方。缺口在于股权结构颗粒度、持股比例，以及任何关于投票控制权或保护性条款的公开讨论。
