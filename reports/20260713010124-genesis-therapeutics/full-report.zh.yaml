      - number: '1.4'
        title: 平台、合作伙伴、管线与里程碑
        blocks:
          - type: paragraph
            body: >-
              Genesis 的公开里程碑轨迹显示，公司正从平台搭建走向更完整的药物建设者。公司官网把 GEMS 定义为分子设计的 AI
              操作系统，并称它同时驱动内部项目和大型药企合作。合作伙伴与管线页面列出内部肿瘤和免疫学项目，包括一个泛突变变构 PIK3CA
              抑制剂项目，以及针对炎症信号和抗凋亡通路靶点的其他工作。合作时间线同样重要。当前网站称，Genesis 2024 年从 Gilead 获得 $35M 预付款，用于三个初始靶点；随后在 2025 年签署初始
              Incyte 合作、获得 $30M 预付款；2026 年扩展后，Incyte 的预付款对价总额升至 $150M，其中包括股权投资。技术上，Pearl 是关键产品里程碑。Genesis 2025 年 10 月推出
              Pearl，称其为药物发现下一代基础模型；又在 2026 年 6 月报告称，zero-shot Pearl 系统在 OpenBind 上跑赢 cofolding
              基线。这些里程碑之所以重要，是因为它们把资本形成、药企验证和技术雄心接成一条线：公司试图用 AI 进展同时改善自有管线和面向合作方的经济性。
