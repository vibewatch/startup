  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争宇宙与 Genesis 的位置
        blocks:
          - type: paragraph
            body: >-
              Genesis 面对的不是一组同质化的“AI 药物发现”公司。最接近的直接同行，是 AI 优先的小分子发现平台：它们向大型药企出售合作，或用同一批核心模型搭建内部管线，包括 Recursion、Insilico
              Medicine、insitro、Isomorphic Labs 和 Xaira。核心圈外还有第二圈邻近竞争者：Schrödinger 是既有物理建模软件和治疗平台；Relay Therapeutics
              是临床阶段的结构与动力学专家；Owkin 则是更宽的多模态“AI 科学家”平台，目标是自动化 biopharma 决策，而不只盯住小分子设计。现状替代品通常不是另一家创业公司，而是药企内部自建，外加 CRO
              湿实验室能力、云基础设施、开放模型，以及 Schrödinger 这类模块化工具。


              Genesis 自己的公开定位比许多同行更窄。合作伙伴与管线页面把 GEMS 描述为 AI 加湿实验室飞轮，用于针对困难生物靶点开发高效且高选择性的小分子药物；合作记录则显示，公司通过 2024 年 Gilead
              合作和 2026 年扩展后的 Incyte 合作获得商业验证，后者加入了自有数据共享和至少五个新增靶点。这把 Genesis 放在“混合型合作平台 biotech”赛道：它不是经典软件那样的纯 SaaS
              厂商，也还不是上市临床阶段治疗公司，更不是覆盖所有模态的通用 AI 科学层。


              这个定位在竞争上很关键。Genesis 比宽泛的 AI 科学家叙事更具体，因为它向买方出售一个可识别的任务：用 GEMS 和 Genesis
              科学家加速困难靶点的小分子发现。但它也比规模领先者更暴露，因为买方可以用几条路径解决同一个任务：与 Recursion 合作，获得数据规模的 phenomics 和化学能力；与 Isomorphic
              合作，使用前沿结构模型；当靶点生物学和患者分层处于核心时使用 insitro；用 Schrödinger 工具和内部 AI 团队把发现留在公司内部；或从 Xaira
              这类资本雄厚的新进入者手中购买更早期的期权价值。
