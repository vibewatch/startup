      - number: '3.3'
        title: 能力、封装与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              这个领域分成几个经济模型差异很大的类别。Genesis、Recursion、Isomorphic 和 Insilico 都靠多靶点合作、里程碑阶梯、销售分成，有时还包括与股权挂钩的合作方融资来变现。Genesis
              已披露的经济条款包括 2024 年 Gilead $35M 预付款，以及 2026 年 Incyte 扩展合作的 $120M 预付款组合，其中包含 $80M 现金和 $40M 股权购买。Isomorphic
              披露的 Lilly 和 Novartis 合作把前沿模型类别的预付款基准放在 $45M 和 $37.5M 现金，之后才是里程碑和销售分成。Recursion 的 Sanofi 和 Bayer
              合作显示，规模化平台提供商可以把头部经济条款推得更高；insitro 的 Lilly 结构则说明，一些 AI 原生玩家可以保留更多项目权利，而不是像传统按服务收费供应商那样运作。


              能力差异比共同的“AI 药物发现”标签暗示的更大。Genesis 的公开切入点，是针对难成药小分子靶点的结构与性质预测，并由湿实验室飞轮和前置部署的科学家增强。Recursion 强调工业化
              phenomics、因果生物学和超大规模自动化实验。Schrödinger 出售高精度分子建模工具，可嵌入既有药企工作流。Insilico 营销的是横跨靶点识别、化学和临床试验分析的端到端堆栈。insitro
              更关注多模态疾病理解，以及连接人类和细胞数据的 ML 模型。Isomorphic 以继承 AlphaFold 时代研究的结构与生成模型打头阵，Xaira 则在搭建广义基础模型加数据生成堆栈，后续接治疗业务。


              今天的 GTM 权力偏向两类公司：要么已经嵌入工作流，要么反复拿到顶级药企验证。Schrödinger 赢在既有软件分发，Recursion 赢在广度和合作方数量，Isomorphic
              赢在资本加标志性合作。Genesis 的 GTM 证据更窄但真实：两个大型药企标识，其中一个深化为数据共享加股权投资。这比没有融资的概念材料强得多，但弱于 Schrödinger 的分发、Insilico 和
              Relay 的临床证明，以及 Isomorphic 和 Xaira 的资产负债表实力。
