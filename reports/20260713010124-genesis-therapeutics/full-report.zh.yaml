  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与科学家工作流
        blocks:
          - type: paragraph
            body: >-
              Genesis 并不公开出售一个简单单点工具；它把 GEMS 呈现为小分子发现的操作系统。AI 平台页面称，GEMS 集成基础模型、智能体和探索工具，让化学家生成并筛选困难化学问题的解法；Pearl
              发布材料则称，该平台把结构预测与分子生成、药效和成药性参数等性质预测组合起来。实操中，主要用户工作流以科学家为中心，而不是以自助软件为中心。研究人员从靶点和配体假设出发，进入基于 Pearl
              的结构预测，再进入模型引导的生成、排序和实验跟进。同一批公开页面称，Pearl 同时部署在 Genesis 自有内部管线和合作方项目中，这支持了一个判断：GEMS
              是可复用发现堆栈，而不是一次性跑分成果。缺失的仍是面向客户的产品封装、集成 API，或每个项目已实现吞吐指标的公开披露。
