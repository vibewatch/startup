  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与确认约束
        blocks:
          - type: paragraph
            body: >-
              Genesis 的公开变现模式以合作为先。当前合作伙伴与管线页面，以及 Incyte 公告，显示出四条有经济意义的现金流：合作预付款、持续研究经费、里程碑付款和销售分成。公开证据支持 Gilead 2024
              年为三个初始靶点支付 $35M 预付款，初始 Incyte 合作在 2025 年 2 月支付 $30M 预付款，2026 年 5 月扩展后的 Incyte 协议则包含 $120M 预付款组合，其中有 $80M
              现金和 $40M 股权购买。Genesis 的 about 页面还提供了有用综合：在 2026 年扩展前，Gilead 与初始 Incyte 合作合计预付款为 $65M。


              这是类似收入的变现，但不是 SaaS。Genesis 没有公布席位定价、API
              定价、订阅层级，也没有任何产品收入证据。所有已披露合同都是定制化、长期合同，合作方获得合作产品的独家商业化权利。这个区别重要，因为预付款现金不等于年度经常性收入；视会计处理而定，部分付款可能随着研究义务履行分期确认为收入，而不是立即确认为收入。公开来源从未披露
              Genesis 的收入确认政策、递延收入余额，或收入与融资收益之间的拆分。


              最高质量的已披露变现信号，是 2026 年 Incyte 扩展合作，因为它不只是头部里程碑期权组合。Incyte 官方公告称，公司还将提供持续研究经费，支持 AI
              模型训练和推理算力负载。从运营角度看，这比纯粹或有里程碑经济更强，因为它意味着在临床里程碑达成前，交付活动也能获得持续现金支持。即便如此，收入质量仍然混合：现金真实存在，但模型集中在少数企业合作中，并且很大程度上后置到开发成功。
