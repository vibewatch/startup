  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Genesis 的正向案例很直接。这不是一个没有客户的科学展式 AI 故事：Gilead 和 Incyte 都已投入有意义的前期资金，Incyte 还在 2026 年进一步加入 $40M
              股权投资、经常性研究经费和更广靶点范围。这说明 Genesis 已让成熟药企买方相信，GEMS
              平台值得嵌入真实药物发现工作流。公司也受益于稀缺价值。具备可见药企牵引、仍活跃的内部管线、一线投资人，以及围绕结构设计的当前技术叙事的私营 AI
              药物发现公司，数量只有少数。反论点是，公开证据在最影响估值的地方仍不完整。Genesis
              没有公开可见的临床阶段项目，不披露确认收入、利润率结构、现金消耗或现金续航期，并高度依赖少数成熟交易对手。这意味着公司可能有战略重要性，但还不能被精确投资判断。估值争论因此不是 Genesis
              有没有价值，而是在更多资产、财务和集中度证据出现前，应为多少价值买单。
