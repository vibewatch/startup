      - number: '7.4'
        title: 伙伴、客户与财务依赖风险
        blocks:
          - type: paragraph
            body: >-
              商业上，Genesis 的风险图谱是集中型，不是广谱型。当前公开伙伴基本是 Gilead 和 Incyte，最近最重要的信号也不是客户名单多元化，而是一个账户加深合作。Incyte 在 2025
              年初始合作后扩大范围，这令人鼓舞；但它也提高了账户依赖：如果某个伙伴重新排序靶点、削减早期发现预算，或把工作转回内部，Genesis 可能同时失去现金流入、科学验证和市场信号。Lilly 和 Genentech
              的历史引用证明过往市场准入，但不能解决当前集中度，因为它们在 2026 年的运营状态没有出现在现有伙伴页面上。财务上，Genesis 仍很难凭公开来源投资判断。合作经济条款、Series B 融资和 2026 年
              Incyte 股权投资显示公司能获得资本，但公司仍未披露确认收入、现金消耗、现金、现金续航期、债务、毛利率或账户集中度。这留下一个关键不确定性：已披露合作现金是在充裕资助平台扩张和内部项目，还是只是抵消仍然沉重的
              R&D 成本基础。大药企交易对手本身信用很强，但它们也是有内部 R&D 组织和议价能力的成熟买方，所以交易对手质量不能消除续约或重新定价风险。
