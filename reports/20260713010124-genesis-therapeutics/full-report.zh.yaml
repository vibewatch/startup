  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 围绕证据、护城河、经济性、风险、可比标的和估值支撑，形成可直接提交 IC 的评分。
    data:
      items:
        - label: 战略验证质量
          value: High
          note: Gilead 和 Incyte 带来真实买方证据，也提供融资支撑
        - label: 技术 / 平台差异化
          value: Medium-High
          note: 公开叙事很强，但产出可复现性仍有部分不透明
        - label: 财务透明度
          value: Low
          note: 收入、利润率、烧钱速度、现金续航期均无公开披露
        - label: 临床 / 资产证据
          value: Low
          note: 公开证据仍停在临床前阶段
        - label: 可比标的匹配度
          value: Medium-Low
          note: 多数公开可比标的把软件收入和管线可选性混在一起，但组合方式不同
        - label: 估值可支撑性
          value: Medium-Low
          note: 已有类似 Forge 的锚点，但溢价叙事跑在硬证据前面
        - label: 退出清晰度
          value: Medium-Low
          note: 现阶段，收购比近期 IPO 更现实
