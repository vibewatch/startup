companyProfile:
  summary: >-
    Genesis Therapeutics 是一家 2019 年从 Stanford 脉络走出的私营生物科技公司，搭建 GEMS 分子 AI 平台用于小分子药物发现，同时推进内部临床前资产和合作项目。公开证据显示，Gilead 与
    Incyte 提供了真实外部验证；其中 Incyte 2026 年扩展合作包括 $80M 现金预付款和 $40M 股权购买。但公司披露的收入、利润率和资产推进细节仍太少，难以精确做投资判断。
