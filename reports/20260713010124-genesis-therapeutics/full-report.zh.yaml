        - 最直接的 Genesis 专属估值线索
        - 二级市场估计，不是公司确认的股本结构
      - - Genesis / 未验证溢价叙事
        - 较弱的二级市场传闻
        - 市场流传更高数字，但最强公开证据无法清晰支撑
        - 不能可靠写入投资假设
        - 只能作为情绪背景
        - 优先级不应高于更清晰的二级市场或官方融资信号
    notes: 可比分析只是方向性参考。Genesis 卡在平台软件、合作型技术生物公司和临床前资产期权之间，没有一组完全干净的可比公司。
