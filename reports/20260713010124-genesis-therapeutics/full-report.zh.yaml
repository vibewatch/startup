  - id: TV005
    title: 推翻投资论点与止损触发条件表
    columns:
      - 触发项
      - 阈值或事件
      - 如何打到论点
      - 行动含义
    rows:
      - - 合作伙伴收缩
        - 现有主要合作伙伴缩小或退出合作
        - 同时削弱商业验证和融资信心
        - 立即重新测算
      - - 进展停滞
        - 合作伙伴和平台仍在花钱，资产推进却没有变清晰
        - 削弱稀缺性溢价逻辑
        - 下调估值区间，暂停高信心判断
      - - 融资信号偏弱
        - 新一轮定价显著低于隐含预期，或附带惩罚性条款
        - 暴露估值过高或议价能力有限
        - 下调基础情景
      - - 披露缺口持续
        - 尽调中，管理层仍无法提供清晰的收入、客户集中度和资金续航数据
        - 无法精确测算
        - 不要支付溢价
      - - IP / 数据权利模糊
        - 合同或专利审查显示，模型改进的可复用性或可防御性不如假设
        - 压缩护城河和退出价值
        - 提高折现率 / 降低仓位
    notes: 任一条件触发，都会推翻当前「跟踪但谨慎」的立场。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股本结构和优先权栈
        - 投后估值机制、清算优先权、投资人权利
        - 入场经济性可能与名义估值差很多
        - 管理层 + 法务
      - - 收入质量
        - 确认收入、递延收入、里程碑会计、毛利率
        - 用来区分真实平台经济性和合同公告数字
        - 财务尽调
      - - 现金和资金续航
        - 当前现金、烧钱速度、合作项目与内部项目预算拆分
        - 决定临床验证前的融资风险
        - 财务尽调
      - - 客户集中度
        - 绑定 Gilead、Incyte 及未披露账户的价值占比
        - 集中度决定下行严重程度
        - 商业尽调
      - - 数据权利和 IP
        - 训练权、衍生模型权利、专利文件、发明人认定流程
        - 决定护城河耐久度和退出价值
        - 法务 + IP 顾问
      - - 项目推进
        - 内部和合作资产的保密里程碑表
        - 用来更理性地给期权价值定价
        - 科学尽调
    notes: 只有把关键问题答清楚，Genesis 才能从「有战略趣味的观察名单资产」升级为可定价资产。
    claimRefs:
      - CV038
      - CV040
