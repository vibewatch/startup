      - number: '1.5'
        title: 负面信号与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公司概览在使命、领导层质量和合作验证上很强，但在投资者做精确判断所需的硬事实面前很弱。官方来源仍未披露当前收入、客户数、员工数、现金余额、跑道、债务，或一个确定的当前投后估值。即使是看似量化的追踪页面，也不足以干净填补这些缺口：GetLatka
              报告估计收入 $16.1M、146 名员工、估值 $48.2M，甚至写着“no funding reported”，这与公开度很高的 2023 年 Series B 和 2026 年 Incyte
              股权事件直接冲突。因此，该追踪网站主要只能证明数据质量有问题，而不能证明经济性。结构上看，更广泛的 AI 药物发现领域仍暴露在转化风险下。2026 年 MDPI 综述认为，AI
              热潮已经跑在临床验证前面；这也凸显了为什么 Genesis
              未公开披露临床阶段项目会构成问题。公司可能技术上很强，也获得了合作方商业验证，但公开记录仍留下核心投资问题：当前准确估值、真实运营规模、内部资产的临床就绪度，以及合作方资助收入与纯股权融资之间的经济性。
