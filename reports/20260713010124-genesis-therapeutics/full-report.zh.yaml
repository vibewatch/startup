        title: 科学转化与运营风险
        blocks:
          - type: paragraph
            body: >-
              Genesis 的核心运营风险不是平台不够先进，而是先进发现系统仍要经受生物学考验。Genesis 自有网站把 GEMS
              描述为同时驱动内部管线和合作伙伴项目，而伙伴页面仍把内部资产呈现为临床前。这意味着公司的公开证据在发现赋能层最强，在人体结果层最弱。独立的不利背景也强化了这一点。2026 年 MDPI 综述把 AI
              药物发现描述为面对验证危机，临床回报不确定，损耗持续存在；PDA 的行业概览则称，AI 可以加速和排序工作，但不能消除湿实验、转化或开发风险。Recursion 在合并 Exscientia
              后重整管线，也可作为同业警示：即使是拥有大量数据和资本的规模化 AI 药物发现平台，下游项目不达预期时也可能重置组合。Genesis
              的运营模式还增加了复杂度。公司强调模型构建者、药物猎手、湿实验团队和前置部署伙伴员工之间紧密协作。这在商业上有力，但也意味着执行依赖稀缺的跨学科人才、可重复的内部协同、伙伴特定数据权利，以及把平台胜利转化为耐久分子而不是一次性发现产出的能力。
