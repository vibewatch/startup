      - number: '2.4'
        title: Genesis 匹配度、SAM 现实与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              Genesis 的实际可服务市场，比广义小分子或 pharma R&D 天花板窄得多。公司的合作历史暗示，市场核心是一批大型组织：它们想用基于结构的小分子发现攻克困难靶点，也愿意为反复的
              design-make-test 循环付费。公开的 Gilead 和 Incyte 交易显示，短期定价权来自合作经济性——预付款、靶点选择权、研究经费、里程碑权利，最终还有销售分成——而不是商品化按席位
              SaaS。这把 Genesis 的短期 SAM 缩窄到 pharma 和 biotech 买方中的一个子集：既有大额发现预算，也愿意共享自有数据或运行合作项目。最现实的 SOM
              还要更小：全球只有几十个交易对手，可能在短期内购买 Genesis 所宣传的多靶点、小分子、数据密集型合作。没有公开来源直接量化这一片区；市场研究机构和公司披露也都没有发布“AI
              基于结构的小分子平台合作”的干净预算线。这个缺口重要。投资者可以有把握地说 Genesis 所在市场在增长，并且具备强结构性驱动，但如果不加入假设，还不能声称拥有精确的自上而下 SAM 或
              SOM。因此，正确的市场结论是有吸引力但有边界：市场大到值得做，但仍集中到客户质量和交易深度比头部 TAM 数字更重要。
