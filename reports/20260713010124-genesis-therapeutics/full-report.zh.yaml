      - number: '8.4'
        title: 退出准备度、推翻论点触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出争论也受 Genesis 当前披露姿态影响。IPO
              最终可以想象，但不是在当前公开信息集下；公司需要在收入、利润率路径、客户集中度，以及至少部分更清晰的下游项目证据上给出实质性更好可见度。战略收购或继续私募融资的路径，在近中期更可信，尤其当某家大药企或 技术生物
              买方把 Genesis 视为值得整体拥有的平台加管线资产时。但这并不意味着公司已去风险。若伙伴势头逆转、内部或合作项目在持续投入下仍未显示有意义进展、未来融资暴露明显更弱的估值标记或惩罚性优先权堆叠，或数据权利
              / IP 模糊性削弱模型改进的可复用性，投资论点就会破裂。最终尽调清单因此异常清晰：投资人需要股权结构表和优先权堆叠、伙伴集中度数据、收入质量和确认方式、现金和 现金续航期、数据权利和 IP
              文件，以及保密的项目进展表。在这些材料出现前，Genesis 应被视为战略上很有吸引力但估值敏感，而不是干净的绿灯。
