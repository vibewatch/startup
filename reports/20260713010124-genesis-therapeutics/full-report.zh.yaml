      - number: '8.2'
        title: 当前估值背景与建议姿态
        blocks:
          - type: paragraph
            body: >-
              今天 Genesis 最强的公开定价信号，不是用户提供的独角兽叙事，而是更弱但更具体的二级市场记录。Forge 档案估计，2026 年 5 月公司投后估值约 $806.8M，累计融资约
              $340.3M。这个数字不是公司确认的股权结构表披露，但比噪声更大的跟踪网站或没有引用的市场传言更可支撑。2026 年 Incyte 扩展合作是第二个关键锚点：即便没有披露轮次价格，一家大型上市生物制药公司愿意把
              $80M 前期现金和 $40M 股权购买结合起来，这比单纯媒体热度强得多。同时，Genesis
              的财务披露仍太少，不足以支持高信心点估值。公司不披露收入、利润率或现金续航期，投资人就无法像评估软件公司或上市生物科技
              同业那样，干净套用收入或现金流框架。因此，最可支撑的建议是跟踪而不是追高：保持高度兴趣，给高风险评级，并避免假定高于最有支撑二级市场标记的任何溢价估值都理所当然。
