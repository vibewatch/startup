      - number: '5.4'
        title: 依赖、信任与公开质量缺口
        blocks:
          - type: paragraph
            body: >-
              做投资判断时，Genesis
              的技术依赖几乎和基准胜利一样重要。平台看起来依赖稀缺结构数据、合成数据生成、大量算力、合作伙伴提供的实验数据，以及能高效使用工具的跨职能科学家。公开来源还显示，数据飞轮对外部伙伴存在集中：Incyte
              扩展合作明确把更广泛的 GEMS 部署与专有实验数据共享绑定。信任信号有，但更像研究级，不是企业级。Genesis 披露了基准截断值，描述了 OpenBind 的生产超参数测试，并反复强调物理有效性和
              PoseBusters 检查；这些都是有意义的质量信号。即便如此，本次审阅的官方页面并未提供公开状态页、正常运行时间 SLA、模型卡库、详细安全认证，或让外部人按部署深度评估可靠性和治理的合作伙伴 /
              开发者文档面。外部文献在这里也相关，因为它指出 AI 药物发现仍面临数据稀缺、可解释性、合成可行性和监管信任挑战。Genesis 在结构预测上看起来技术领先，但并没有免疫于这一赛道普遍的验证问题。
