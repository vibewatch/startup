      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比头部市场规模图暗示的更集中。Mordor 称，2025 年制药和生物技术公司约占 AI 药物发现终端用户份额的 67%；软件拿走大部分收入，学术机构则从较小基数上更快增长。这与 Genesis
              的公开商业记录吻合：公司卖给 Gilead 和 Incyte 的是多靶点平台合作，而不是大众化软件订阅。实操中，经济买方通常是大型药企或成熟 biotech
              组织，发现预算足够大，可以支持多项目工作、自有数据整合和带里程碑的合作。技术用户是药物化学家、计算生物学家、结构生物学家或转化发现团队，需要靶点识别、对接、蛋白-配体结构预测和先导优化支持。付款方位于他们之上，可能在
              R&D 领导层、BD 或组合策略部门。学术和研究需求也真实存在。Mount Sinai 2025 年启动 AI Small Molecule Drug Discovery Center，目标是把 AI
              与传统发现方法接在一起，建设化合物数据库，并与药企、biotech 和学术机构合作。这是一个重要市场信号：AI 药物发现已经不再只是创业公司小众赛道。但它并没有改变商业现实：Genesis
              能变现的买方池仍集中在资金充足、愿意共享数据、赞助算力密集型工作流，并能接受里程碑式合同的组织。
