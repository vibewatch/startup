      - number: '7.5'
        title: 缓释因素、监测指标与推翻论点的触发项
        blocks:
          - type: paragraph
            body: >-
              Genesis 的风险缓释逻辑可信，但还不足以抹掉核心风险。最强缓释因素是第三方验证和融资深度：一线药企关系、Incyte 反复扩张，以及主要投资人背书，都说明 Genesis 卖的不是空气。公司似乎也搭起了覆盖
              AI 基础设施、药物化学和转化科学的扎实团队；对一个必须连接模型和分子的平台来说，这很重要。但公开缓释证据在几个关键控制上仍然薄：Genesis 没有公开把治理映射到 NIST AI RMF
              等框架，没有详细披露数据权利和模型使用权的合同结构，也没有发布那类能实质性降低投资判断风险的逐项目表现、收入质量或可复现性披露。因此，正确的监测指标应该外部、具体：伙伴集合是否扩大到 Gilead 和
              Incyte 之外，是否有任何项目达到更明确的候选药物或临床里程碑，公司是否露出更好的财务披露，以及 AI
              药物发现周边法律或合规预期是否变得更重。推翻投资论点的触发项包括伙伴收缩而不是扩张、持续无法展示下游资产进展，或有证据表明平台经济性需要在任何临床证据出现前反复融资。
            claimRefs:
