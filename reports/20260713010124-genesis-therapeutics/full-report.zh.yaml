      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Genesis 在财务上有吸引力，但公开信息不足以投资定价。正面看，公司拼出了强战略资本故事：$200M Series B、截至 2024 年底已融资超过 $300M 的公开证据，以及来自 Gilead 和
              Incyte 的实质合作挂钩现金与股权。Incyte 扩展合作尤其重要，因为它同时包含预付款现金、股权、持续研究经费和多靶点里程碑潜力。这让 Genesis 看起来比许多只讲远期机会的 AI-biotech
              平台更有商业真实性。


              负面在于可见度。已审阅材料中，公司没有公开收入数字，没有披露毛利率、现金余额、消耗、跑道、债务期限表，也没有经审计财务报表。围绕 Genesis 的低质量数据生态没有解决问题，反而强化了问题：GetLatka
              的资料一边声称收入 $16.1M、员工 146 人，一边又称没有报告融资；这与记录充分的 Series B 和 Incyte
              股权事件直接冲突。因此，二级数据库只能作为很弱的方向性提示，或作为数据不一致的证据，不能作为估值工作基础。


              负面视角也重要。MDPI 综述和 Excelra 市场报告都认为，AI 药物发现仍有未解决的临床转化和 ROI 问题。对 Genesis
              来说，这意味着其大型里程碑阶梯的期望价值仍受制于生物学，而不只是软件表现。因此，正确的财务结论是：商业上已有种子，战略资本到位，并且看起来有能力继续运营和扩张；但任何严肃判断收入质量、利润率路径或下一轮时点，都仍依赖非公开财务披露。
