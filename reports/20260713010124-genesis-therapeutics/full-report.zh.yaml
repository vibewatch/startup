      - number: '3.2'
        title: 直接同行画像：规模、成熟度与战略方向
        blocks:
          - type: paragraph
            body: >-
              Recursion 是 AI 优先 techbio 的规模基准。公开材料描述的平台拥有超过 50 PB 自有生物和化学数据，自动化实验室每周处理数百万次细胞实验，合作名单包括 Bayer、Sanofi、Merck
              KGaA、Tempus、Helix、Google Cloud 和 NVIDIA。其管线页面与 2025 年 Fierce
              报道也显示，即使砍掉若干项目后，临床足迹仍有分量：公司下调多个项目优先级后，仍保留六个活跃开发项目。因此，Recursion 在广度、合作方触达和企业可信度上构成威胁；不过 2025
              年重组也提醒市场，规模并不能消除生物学风险。


              Schrödinger 是另一类竞争者：一家既有计算化学平台，拥有 30 多年
              R&D、以软件为中心的装机基础，并在上层叠加治疗业务。其平台围绕物理预测做营销，而不是生成式生物学品牌；管线包括内部项目，也包括通过合作方推进到 Phase 3 的合作资产。对 Genesis
              来说，Schrödinger 与其说是镜像，不如说是替代堆栈：买方可以把 Schrödinger 工具、内部科学家和外部湿实验室工作组合起来，而不是付费购买 Genesis 的一体化发现合作。


              Insilico Medicine 和 insitro 是最有参考价值的两家私营同行。Insilico 公开展示了最深的 AI 原生小分子管线，拥有 40 多个项目、13 个 IND 批准，以及一个用
              Pharma.AI 发现的 Phase II 纤维化项目。insitro 在公开披露中临床进展较少，但强项是把人类临床数据、细胞数据和灵活权利结构与 Lilly 等大型合作方组合起来；它还披露截至 2025
              年底已融资超过 $700M。Isomorphic Labs 和 Xaira 定义了资本充足的前沿模型侧翼。Isomorphic 现在集合了 AlphaFold3 脉络、IsoDDE 性能主张、$2.1B
              Series B，以及与 Lilly、Novartis 和 J&J 的合作。Xaira 以 $1B 启动，正在搭建一体化 AI、数据和治疗堆栈，面向困难生物学和抗体式项目。相比之下，Genesis
              当前合作方证明强于 Xaira，但披露资本远少于 Xaira 或 Isomorphic，公开临床成熟度也远低于 Insilico、Relay、Recursion 或 Schrödinger 的治疗业务。
