      - number: '4.2'
        title: GTM 动作、集中度与公开牵引力代理
        blocks:
          - type: paragraph
            body: >-
              Genesis 的 GTM 动作是典型企业级 biotech BD，而不是自下而上的软件漏斗。公司向大型药企买方出售多靶点发现合作，下游产品有排他性，交付模式则把 GEMS
              与派驻科学家和工程师组合起来。今天的公开证据指向高度集中的客户基础：在当前网站上，Gilead 和 Incyte
              是仅有的清晰披露的大型商业交易对手。这并不能证明它们是唯一客户，但意味着公开变现证据实际上集中在两个具名标识上。


              Genesis 既不披露确认收入，也不披露客户数指标，因此同行是最好的公开牵引力代理。Recursion 2025 年第一季度业绩尤其有参考价值：公司报告季度收入 $15M，主要来自合作协议，同时拥有 $509M
              现金，并在经营活动中使用 $132M 净现金。其 FY2025 状况，无论按 10-K 还是 StockAnalysis 摘要，都是 $74.68M 收入且自由现金流深度为负。这说明合作驱动 techbio
              的基本经济性：真实收入存在，但成本基数可能比确认收入扩张得快得多。


              Schrödinger 展示了光谱另一端。作为软件加治疗的混合体，它报告 FY2025 收入 $255.87M、毛利率 55.74%，大型药企软件渗透带来的收入可预测性远强于里程碑式平台交易。Genesis
              几乎肯定落在两个极端之间。它比前收入平台故事更有商业证明，但经常性可见度远低于一家在申报文件中可见合同价值、续约和递延收入机制的软件厂商。因此，从公开角度看，Genesis
              商业可信，但仍高度集中，且非经常性明显。
