      - number: '3.5'
        title: 护城河耐久性、替代风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              Genesis 的护城河目前更多是商业和运营层面，而不是临床已证实。公司可以指向反复合作方验证、困难靶点小分子聚焦，以及由 Incyte
              愿意共享自有实验数据并购买股权所强化的数据飞轮。这有意义。但这条护城河面对四股力量时仍未证明耐久性：资本不对称、开放模型商品化、药企内部 AI 自建，以及全行业仍缺少获批 AI 设计药物。Genesis
              尚未披露公开临床阶段资产，这意味着它仍主要靠模型质量、速度和合作方体验竞争，而不是靠人体疗效数据竞争。


              负面证据不只来自 Genesis 本身。2026 年 MDPI 综述认为，AI 已经加速发现工作流，却尚未改变底层临床淘汰现实；综述指出，进入临床开发的候选药物仍有约 90%
              失败，可复现性、数据透明度和监管缺口仍是实质约束。Recursion 2025 年在疗效信号混杂后修剪组合，是同一问题的鲜活市场案例：即便资本更充足、成熟度更高的 AI-biotech
              公司，项目深入开发后也会撞上生物学边界。这削弱了“算法足够先进就能形成稳定竞争护城河”的看法。


              对 Genesis 来说，实际含义很清楚。公司看起来有足够竞争力赢得更多合作，尤其当合作方想要的是一支聚焦小分子的团队，而不是自动化科学的大理论时。但在 Genesis
              拿出更强独立基准或公开管线进展之前，市场仍可能围绕率先证明可重复临床成功的公司重新定价。在这场竞赛里，Genesis 已获商业验证，但临床风险尚未解除。
