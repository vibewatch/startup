      - number: '3.3'
        title: 直接同业竞争对手
        blocks:
          - type: paragraph
            body: >
              Figure AI 是全球融资最多的人形机器人公司。其 2025 年 9 月 Series C 融资超过 $1B，估值 $39B，使累计资本超过 $1.7B。Figure 03 是一款身高 5'8"、重 61
              kg、双足人形机器人，手部具备 16 自由度；它正在 Figure 的 BotQ 工厂以每小时一台的速度制造，到 2026 年初已生产超过 350 台。Helix 视觉—语言—动作 AI
              系统让它能在结构化环境中自主操作。Figure 近期重点是工业和商业部署（最初在 BMW Spartanburg 工厂），家庭部署明确被放在未来阶段。其 $39B
              估值意味着公司有资本渠道支持消费者产品转向，但双足人形形态、安全认证要求和单台成本，对近期任何消费者可接受价格下的家庭采用都构成重大障碍。


              1X Technologies（挪威 / 美国，OpenAI 支持）在消费者家庭部署上走得最激进。其 NEO 人形机器人 2025 年 10 月开放预订，2026 年初向家庭首批出货。NEO 定价
              $20,000（早期体验）或订阅 $499/month——远高于消费者门槛，但低于上一代研究平台。1X 在加州 Hayward 建成 58,000-square-foot 工厂，年产能 10,000 台。2025
              年 9 月，该公司正寻求以 $10B 目标估值融资 $1B。关键在于，1X 与 EQT 达成协议，也把为家庭设计的 NEO
              机器人部署到工业和仓储场景；这说明即便对开发者而言，仅靠人形硬件实现消费者端盈利也存在财务挑战。


              Hello Robot 的 Stretch 3（2024 年初发布，约 $25,000；Stretch 4 于 2025 年发布，价格
              $29,950）是一款为研究和辅助用途设计的非人形移动操作机器人。它使用带夹爪的伸缩臂，支持 ROS 2，并采用开源软件。它不是消费者产品，也不定位于家庭大众市场部署。尽管如此，Stretch
              的设计理念——非人形形态、轮式底盘、单臂操作——是与 The Bot Company 所述路线最接近的概念参照，验证了非人形平台无需承担双足人形的成本和安全复杂度，也能完成家庭操作任务。Tesla Optimus
              已在 Tesla 自有工厂部署超过 1,000 台 Gen 3，但消费者可用性预计要到 2027 年末或更晚，因此属于更长期威胁。
