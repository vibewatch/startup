      - number: '2.5'
        title: 采用约束与壁垒
        blocks:
          - type: paragraph
            body: >
              抵消增长驱动的，是 The Bot Company 必须解决的几类结构性采用约束。隐私和数据安全顾虑是消费者最常提及的障碍：约 47% 的潜在家庭机器人买家担心联网设备里的摄像头和麦克风造成家庭监控。一个由
              LLM
              驱动、绘制家庭地图、识别物体并接收关于家庭日常的自然语言指令的机器人，必然收集并处理敏感的居家行为数据。数据治理设计——数据放在哪里、谁能访问、如何使用——将成为主流消费者采用的一线产品要求，而不只是法律合规检查。


              认证周期构成结构性发布前风险。任何家庭机器人进入美国市场，都需要 UL 3300 安全认证（覆盖服务机器人的电气、机械和功能安全）、FCC 无线通信授权，以及越来越多的州级数据隐私合规（加州 CCPA，以及
              15+ 个州正在出现的类似法律）。进入欧盟市场需要 CE 标志和适用于清洁机器人的 EN IEC 60335-2-107 合规，另需遵守 General Product Safety Directive。带 AI
              组件的新硬件产品从设计冻结到完成综合认证，估计需要 12–24 个月；这意味着任何计划在 2026 或 2027 年发布的产品，都必须最迟在 2024 年中或 2025 年中启动认证测试。


              中国制造商在扫地机器人品类中的主导地位——Roborock、Ecovacs、Dreame 和 Xiaomi 合计控制 80%+ 销量——确立了 The Bot Company
              必须在其之上竞争、而不是正面对抗的性价比底线。iRobot 2025 年 12 月提交 Chapter 11 破产申请很有启示：iRobot 在高端扫地机器人细分拥有约 9% 全球市场份额和 15+
              年品牌资产，却在价格 / 功能上被中国平台击败。The Bot Company 若要成功，其多功能 AI 平台必须相对单功能扫地机器人足够差异化，让中国平台无法简单以更低成本加入同等能力——随着 Ecovacs
              和 Roborock 都已释放「具身 AI」产品路线图投资信号，这一风险需要持续跟踪。


              消费者对真实效用与营销承诺之间落差的怀疑，是另一道信任壁垒。当前没有商业化多功能家庭机器人能够验证「一个机器人完成我所有家务」这个消费者问题，是否能在推动主流采用所需的价格点和可靠性水平上被技术解决。早期采用者会容忍不完美产品；大众市场采用则需要可证明的可靠性，而任何现有产品都尚未建立这一点。
            claimRefs:
              - CM028
              - CM029
              - CM030
