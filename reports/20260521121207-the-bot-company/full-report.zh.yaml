  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与硬件设计
        blocks:
          - type: paragraph
            body: >-
              The Bot Company
              的核心产品是一台非人形家用机器人，由轮式移动底盘、单个关节式机械臂和一组可更换末端执行器组成。公司刻意放弃人形形态，降低成本、复杂度和平衡控制要求，同时让机器人能在杂乱家庭环境中稳定运行。据报道，其形态像一张带轮子的矮咖啡桌，重心低，在儿童和宠物周围倾倒风险较小。机械臂可处理据称多数低于约
              1 kilogram 的家庭物品；可更换末端执行器包括抓握夹爪和吸盘式附件，用于不同表面交互。一个 10-liter 可拆卸收纳箱用于收集物品。感知是多模态的：RGB 摄像头和 LiDAR 传感器生成连续 3D
              点云，用于建图和定位，直接映射了 Cruise
              为自动驾驶开发的传感器融合方法。安全硬件包括软保险杠、机械臂扭矩限制和冗余接近感知。上述设计细节没有任何一项正式发布在产品规格书中；目前全部来自公司表述、投资者报道和第三方分析。
