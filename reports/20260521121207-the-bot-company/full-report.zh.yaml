      - number: '3.2'
        title: 存量玩家与相邻竞争对手
        blocks:
          - type: paragraph
            body: >
              iRobot 曾是美国最强势的家庭机器人品牌，美国市场份额约 42%，2024 年收入 $682M，却在 2025 年 12 月申请 Chapter 11 破产。此前 Amazon 在 2024 年初试图以
              $1.7B 收购 iRobot，但欧洲和美国反垄断监管阻止交易，导致收购失败。iRobot 资产正由其主要中国代工制造商 Shenzhen Picea Robotics
              收购。这一事件说明，分销和品牌强度不足以抵御垂直整合中国制造商的商品化定价：Roborock、Ecovacs 和 Dreame 以低 20–50% 的价格提供相当或更强的地面清洁能力，夺走了 iRobot 份额。


              Roborock（2025 年收入 ¥18.7B，约 $2.7B，同比增长 56.5%）和 Ecovacs（2025 年收入 ¥19.04B，约 $2.8B，增长
              15.1%）都是上市中国公司，盈利能力强、全球分销完善，并加速投资 AI 赋能导航和物体操作。Roborock 的 “RRMind GPT” AI
              平台为其扫地机器人产品线加入语义场景理解。这说明中国存量玩家正在沿能力栈向多任务家庭自动化爬升；如果市场空白比预期更快闭合，它们将对 The Bot Company 的定位构成可信的中期威胁。


              Amazon Astro（$1,499–$1,599，邀请制，仅美国）是一款家庭监控和 AI 陪伴机器人，集成
              Alexa、摄像头、潜望镜视角机械臂，并可用货仓携带小物件。它不能操作物体、执行表面清洁，或在多楼层运行。其价值主张围绕家庭安防和远程监控，而非家务自动化。Samsung Ballie 于 2025
              年夏季在美国和韩国发布，是一款球形陪伴机器人，内置投影仪、4K 前置摄像头、Gemini AI 和 SmartThings 集成。截至 2026 年 5 月，其价格未披露，也没有物理操作能力。Amazon 和
              Samsung 都是相邻而非直接竞争威胁：它们争夺同一「家庭 AI」心智，但服务的主要用例不同。
