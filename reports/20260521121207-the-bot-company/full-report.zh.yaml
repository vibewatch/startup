        - 与 Alexa/Google Home/Apple HomeKit 集成降低上手摩擦；LLM 控制进一步增强这一点
        - 机器人上市时将原生支持哪些智能家居平台？
      - - 美国、欧盟、日本人口老龄化（养老照护机器人 CAGR 16–17%）
        - 驱动因素
        - 中期（3–7 年）
        - 扩大可触达的养老照护买方细分；辅助设备可能获得政策顺风
        - Bot Company 是否规划养老照护产品变体或照护机构合作？
      - - 传感器和计算成本下降（2018–2025 年成本下降 30%+）
        - 驱动因素
        - 持续
        - 让 Bot Company 能在配备 LiDAR + 边缘 AI 的同时打到低于 $2,500 的目标价格并保持利润率
        - 目标消费者价位下，预计 BOM 成本和毛利率是多少？
      - - LLM 自然语言控制（可用性定性跃迁）
        - 驱动因素
        - 近期（1–3 年）
        - Bot Company 核心产品逻辑；首个可信地把该能力用于家用机器人的竞争者
        - LLM 模型上市时能覆盖哪些任务完成范围？边缘案例失败率是多少？
      - - 中国制造主导地位（Roborock/Ecovacs/Dreame/Xiaomi 占出货量 >80%）
        - 约束
        - 持续
        - 设定 Bot Company 必须超越的价格性能底线；中国品牌正释放「具身 AI」路线图信号
        - Bot Company 会在美国制造，还是外包到亚洲？供应链韧性策略是什么？
      - - 隐私和数据安全顾虑（47% 买方表达担忧）
        - 约束
        - 近期（发布前）
        - 家中摄像头 + 云端 AI 会卡在消费者信任上；数据治理必须成为一级产品设计议题
        - 计划采用什么加密、数据主权和同意机制？CCPA/GDPR 合规姿态如何？
      - - 认证要求（UL 3300、FCC、CE/IEC 60335；12–24 个月）
        - 约束
        - 上市前关键路径
        - 若错过认证启动窗口，发布会延后；若要 2026 年发布，测试应已在 2024–2025 年启动
        - Bot Company 是否已启动预认证测试？当前认证状态如何？
      - - iRobot 2025 年 12 月 Chapter 11 破产（美国高端品牌失败）
        - 信号 / 约束
        - 当前（反向信号）
        - 拥有 15 年以上品牌资产的美国高端机器人品牌仍未能竞争；单一功能差异化不是护城河
        - Bot Company 的平台差异化能否在低成本中国多功能机器人面前撑住高端定价？
      - - 消费者切换成本优势（家庭布局训练、习惯学习）
        - 驱动因素
        - 中期
        - 能学习家庭布局的机器人一旦部署，就会形成锁定效应；每个家庭都有先发优势
        - Bot Company 的家庭入门和增量学习模型是什么？数据可携带政策如何？
      - - 硬件开发的资本强度（NRE、模具、供应链）
        - 约束
        - 持续（收入前）
        - 硬件 NRE、模具和供应链都要吃掉大量资本；已融资 $302M 可用于估算现金跑道
        - 年烧钱速度是多少？首批商业出货前预计现金跑道多长？
    notes: >-
      驱动因素和约束综合自 Mordor Intelligence、Global Market Insights、IDC、makerstations.io、economy.ac 市场报告，以及 iRobot 破产报道（HDIN
