      - number: '2.2'
        title: 市场规模测算 — TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              已发布的分析师对 2025 年家庭机器人总可用市场（TAM）的估计跨度很大：从 $10.1B（Mordor Intelligence，使用较窄产品边界）到 $17.7B（Global Growth
              Insights，采用包含联网家电的更宽泛「智能家用机器人」定义）。引用最多的一组估计——Global Market Insights 的 $14.7B、Precedence Research 的
              $14.5B，以及 Research and Markets/Business Research Company 的 $11.4B——指向 2025 年约 $12–15B 的中枢估计。CAGR
              预测同样分化：Mordor 预计到 2031 年为 14.87%，Global Market Insights 预计到 2035 年为 19.2%，Business Research Company 预计同比增长
              20.4%。三者都认为市场到 2030 年会大致翻倍至 $22–24B。


              扫地机器人子市场——与竞争语境最相关的存量品类——2025 年本身估计约为 $12.5B，2026 年增长至 $14.4B（Global Market Insights 扫地机器人报告；Fortune
              Business Insights）。IDC 跟踪实际出货数据，其报告显示 2025 年 Q1 中国品牌 Roborock（19.3% 份额）、Ecovacs（13.6%）、Dreame（11.3%）和
              Xiaomi（9.9%）合计占全球扫地机器人出货 54%，iRobot 为 9.3% 且在下降。HDIN Research 估计 2025 年扫地机器人市场为 $13.1B，并将在「具身 AI」驱动扩张下以
              12% CAGR 增长。


              The Bot Company 的可服务市场（SAM）在结构上更难分离。没有已发布分析师报告专门切分多功能、LLM 驱动、高端定价（估计
              $1,500–$3,000）的非人形家用机器人。一项分析师推导估计显示，若把家庭机器人 TAM 的 50–60% 归入非人形家务自动化平台，再套用高端产品筛选，2025 年全球 SAM 约为
              $5–8B。北美约占全球收入 35–38%，换算为所有家庭机器人的北美市场约 $4–6B，或高端 AI 赋能子赛道约 $1–2B。这些估计置信度低，方法论风险显著。


              The Bot Company 产品发布后前五年的 SOM（可获取市场）没有产品价格点或分销策略就无法计算。作为情景锚，若美国双职工家庭机器人细分的 1% 渗透率（约 15–20 million 个符合条件、收入
              $100K+ 的家庭）按假设 $2,000 价格点计算，意味着 $300–400M
              年收入。这在产品前阶段高度投机，并完全取决于公司能否交付可信产品并赢得消费者信任。因此，市场规模分析保留不确定性，而不是锚定一个大数字估计。
