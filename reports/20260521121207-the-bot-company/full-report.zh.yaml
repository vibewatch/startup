      - number: '8.6'
        title: 投资逻辑破裂触发点与最终尽调请求
        blocks:
          - type: paragraph
            body: >-
              The Bot Company
              的投资逻辑可能被六组不同触发因素打破，每一组都有明确阈值、传导机制和行动含义。最关键的结构性触发点是：（1）下一轮融资前未能展示商业可靠性级别的操作基准——没有任务成功率的实证证据，未来任何估值上调都缺少可信度，也不应投入新资本；（2）发生安全事件（家庭成员、宠物受伤或财产损坏），这会触发类似
              Cruise 行人事件的监管、媒体和声誉动态；考虑到 Vogt 的公众形象，影响可能来得更快；（3）截至报告日 Bloomberg 融资尚未完成，意味着公司现金位置可能显著低于潜在 $552 million
              总额所暗示的水平，并把现金跑道压缩到制造发布之前。

              最终尽调请求围绕六个最关键的信息缺口组织；这些缺口无法通过公开来源解决，但会实质改变投资建议。最高优先级请求包括：（a）现场产品演示，并发布成功率基准；（b）确认 Bloomberg
              轮是否已完成以及具体条款；（c）截至 Q1 2026 的当前股权结构表、优先权条款和烧钱速度；（d）合同制造、执行器和供应链披露；（e）围绕 Cruise DOJ 延期起诉协议，对 Kyle Vogt
              做个人合规尽调。
            claimRefs:
              - CV033
              - CV034
              - CV035
