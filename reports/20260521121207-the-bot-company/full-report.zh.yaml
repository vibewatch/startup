            body: >
              约 47% 的潜在家庭机器人买家担心家中摄像头和数据收集。UL 3300 和 FCC 认证从设计冻结起需要 12–24
              个月。这些不是发布后问题，而是商业产品出货前必须在产品设计和监管策略中解决的发布前要求。截至报告日，The Bot Company 尚未公开披露认证状态或数据治理设计。
