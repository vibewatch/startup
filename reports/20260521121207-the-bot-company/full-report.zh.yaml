      - number: '7.3'
        title: 隐私、数据与网络安全风险
        blocks:
          - type: paragraph
            body: >-
              一台配备连续摄像头、LiDAR
              和音频传感器的家用机器人，会成为有史以来规模化部署的最侵入隐私的消费设备之一。不同于智能手机或智能音箱，移动机器人会持续以三维方式扫描整个家庭内部，生成家庭布局、物品位置和居住者行为的持久地图。The Bot
              Company 的隐私政策写明，公司会收集视觉、音频和运营数据；这些数据可用于训练 AI
              模型；人在回路远程操作期间，人类操作员可能访问实时或录制的家庭画面。这些披露在法律层面很概括，没有说明数据留存期限、操作员访问控制、加密标准或第三方数据共享细节。

              FTC 在 May 2023 针对 Amazon Ring 的执法行动确立了控制性先例。FTC 认定，Ring
              员工未经授权观看女性用户数千段私密空间视频；公司在未经用户同意的情况下使用私人视频记录训练算法；安全不足让黑客访问约 55,000 个客户账户，并骚扰包括儿童在内的用户。Ring 随后以 $5.8 million
              和解。FTC 的表述非常明确：「Ring 对隐私和安全的漠视，让消费者暴露在被监视和骚扰之中。」拥有实时摄像头访问权限的室内移动机器人，比固定门铃摄像头高出一个数量级的侵入性。

              California 的 CCPA/CPRA 将生物识别数据——包括可从室内视频中推导出的人脸几何——归为敏感个人信息，并附加更高的同意、退出、最小化和安全义务。公司的目标市场偏 California。IoT
              设备网络安全风险已明显恶化：2026 年初，全球每日 IoT 攻击尝试平均超过 820,000 次；DEF CON 32 的研究人员演示，Ecovacs 扫地机器人可在 450 feet 外通过
              Bluetooth 被远程访问，从而静默传输家庭视频和音频。一支已部署的 Bot Company 机器人队列若发生安全漏洞，会把 Ring 事件的声誉损害，与移动、始终感知机器人才有的实体家庭访问维度叠加在一起。
