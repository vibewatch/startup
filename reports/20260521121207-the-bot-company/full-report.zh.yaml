      - number: '7.5'
        title: 财务、资本与估值风险
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 尚无收入、产品未发布，已通过两轮主要融资获得约 $302 million：May 2024 的 $150 million 种子轮，投后估值 $550 million（Botco
              Inc. Form D 确认 41 名投资者出资 $150.67 million）；以及 March 2025 由 Greenoaks 领投的 $150 million 后续融资，投后估值 $2
              billion。Bloomberg 在 October 2025 报道称，公司正寻求按超过 $4 billion 估值融资 $250 million；截至 May 2026，尚无公开确认该轮已完成交割。

              按这一融资规模、团队构成（来自 Tesla、Cruise、OpenAI、Google、Pixar 的工程师）和 San Francisco 总部估算，公司月度烧钱约为 $3–6
              million，若按软件阶段支出速度计算，现金跑道约 50–100 months。公司进入硬件制造阶段后，资本强度会明显加速：消费电子模具和 NRE 需要 $500K–$2
              million；合同制造商的最小起订量会带来库存风险；一台带 LiDAR、精密机械臂和边缘计算的机器人，低量产时物料清单估计为每台 $200–$1,000+。

              估值路径（$550M → $2B → $4B+）由创始人声誉和市场叙事驱动，而不是运营指标；如果公司在下一轮融资前错过商业里程碑，下轮降价融资风险就会上升。iRobot
              先例说明，即便是已有收入的成熟消费机器人品牌，硬件经济性也可能被侵蚀；对尚无收入的新进入者而言，毛利结构完全未经验证。投资者集中风险存在：Greenoaks
              领投的后续融资集中在单一领投方手中。如果市场环境恶化，或开发里程碑落空，下一轮定价可能等于或低于 $2 billion，从而触发普通股股东面前的清算优先权瀑布。
