            title: 所有估值区间都是估计，不是保证
            body: >-
              The Bot Company
              没有披露任何运营指标。本章每一个估值区间、回报估计和情景，都是从可比私募轮次、公开市场可比和分析师基准推导出来，并套用在示意性收入假设上。没有任何数值由公司披露或经独立审计。真实估值可能高于或低于所有呈现区间。本章应被视为结构化推测框架，而不是估值意见。
            calloutType: assumption
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: $4B+ Bloomberg 轮状态是重大未知
            body: >-
              截至 May 2026，没有发现通过新闻稿、SEC Form D 修订或可信媒体佐证，公开确认 Bloomberg 报道的 $250M、$4B+ 估值融资已经完成。如果该轮仍在进行或尚未完成，（a）总资本是
              $302M 而不是 $552M，（b）烧钱速度下的现金跑道可能被压缩到低于制造规模化门槛，（c）任何按 $4B+ 给 TBC 定价的投资者，都是在一个未确认标记上定价。这是本报告最紧急的单一尽调请求。
            calloutType: risk
