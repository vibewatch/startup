          - type: callout
            title: 产品前阶段异常强的资本形成能力
            body: >
              在推出任何产品前融到 $302 million、估值达到 $2 billion，对硬件公司而言极不寻常。投资人组合质量（Greenoaks、Kleiner Perkins、Spark Capital、Nat
              Friedman、Collison 兄弟）体现了成熟资本的认可；这类资本通常不会在产品前阶段以这种规模下注。这笔融资为首次产品发布和早期部署迭代提供了很长现金跑道。
            calloutType: strength
            claimRefs:
              - CO015
              - CO016
              - CO017
          - type: callout
            title: 创始人不利历史 — Cruise 事件与监管发现
            body: >
              Kyle Vogt 在 2023 年 10 月行人拖行事件后辞任 Cruise，加州 DMV 又在书面材料中指称 Cruise 向监管方隐瞒事故画面，这是公司最重要的不利背景因素。投资人应独立评估 DMV
              记录、Vogt 在事后决策中的直接参与程度，以及底层治理姿态是否适合一家要在消费者家中自主运行机器人的公司。
            calloutType: risk
