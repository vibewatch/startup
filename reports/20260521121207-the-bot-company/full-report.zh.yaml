      - number: '5.6'
        title: 证据材料
        blocks:
          - type: callout
            title: 自动驾驶级技术团队降低感知风险
            body: >-
              创始团队亲手搭建 Cruise 自动驾驶感知和 AI 栈——建图、物体检测、传感器融合和机队规模学习——这些经验可以直接迁移到家用机器人。其在传感器融合和 sim-to-real
              迁移上的工程深度，在消费机器人领域属于最强梯队之一，降低了基础导航和感知成为主要商业瓶颈的风险。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE028
              - CE029
          - type: callout
            title: 非结构化家庭环境中的 sim-to-real 缺口是核心技术赌注
            body: >-
              公司的整个产品逻辑取决于 sim-to-real 泛化能否在真实家庭中可靠运行；在家庭里，物体多样性、光照变化和空间不可预测性比受控工业或 AV 场景高出几个数量级。这是全行业尚未解决的开放研究问题，The
              Bot Company 也没有发布任何基准。如果 sim-to-real 迁移在家庭环境中不可接受地退化，机器人将需要成本极高的真实世界数据采集和远程操作，从而摧毁单体经济模型逻辑。
            calloutType: risk
            claimRefs:
              - CE041
              - CE042
              - CE043
          - type: callout
            title: 隐私与安全合规架构完全未披露
            body: >-
              在私人住宅中持续记录音频、视频和空间传感器数据的家用机器人，会面对严苛的隐私和数据安全义务。The Bot Company
              没有发布隐私政策、数据治理框架或安全架构。任何公开披露中也看不到必需的消费者安全认证（UL 3300、ISO 13482）。这些缺口必须先解决，零售渠道伙伴或数据隐私监管机构才可能批准商业部署。
            calloutType: risk
            claimRefs:
              - CE032
              - CE033
          - type: callout
            title: 招聘信息是主要技术信号
            body: >-
              在没有公开技术文档、API、GitHub 仓库或产品演示的情况下，The Bot Company 活跃的工程招聘岗位——全身控制、世界模型、3D 视觉、仿真、ML
              编译器、固件和电气系统——构成了外界能观察到的最清晰技术优先级和开发阶段信号。这种做法符合早期隐身机器人开发，但限制了外部对架构选择的验证。
