      - number: '6.2'
        title: 消费者调研显示家务自动化潜在需求强，但认知缺口长期存在
        blocks:
          - type: paragraph
            body: >-
              与 The Bot Company 所在类别最直接相关的消费者需求数据集，是 Altman Solon 2025 Humanoid Home Robotics Survey；该调研覆盖超过 1,000
              名美国消费者，询问他们对家用机器人的认知、偏好和价格预期。调研发现，65% 的美国消费者表示有兴趣拥有一台先进家用机器人。最受期待的五项机器人功能分别是清洁（吸尘、拖地、除尘），占 23%
              回答；安全监控与警报，占 14%；洗衣处理，占 9%；烹饪辅助，占 8%；以及收取快递。这个排序验证了 The Bot Company 以家务为先的设计哲学：消费者想要的是实用自动化，不是陪伴或娱乐。

              但消费者对这项技术仍然不熟。85% 的受访者称自己对先进通用家用机器人只是中等熟悉、略微熟悉或完全不熟悉。只有 15%
              称自己非常或极其熟悉。这个“认知缺口”是早期市场转化的结构性阻力。消费者无法评估自己要买什么时，高兴趣不会直接转化为购买意向。The Bot Company
              需要投入大量消费者教育，才能把目标人群中的大多数从好奇推向转化。

              商业端看，全球扫地机器人市场在 2024 年达到 $5.43 billion，预计到 2033 年达到 $16.16 billion，CAGR 为 12.88%（Renub
              Research，2025）。行业追踪机构引用 IDC 数据称，2025 年第二季度智能吸尘器出货量同比增长超过 20%。增长由双收入和城市家庭、AI 导航改进、语音助手集成，以及多功能型号供应增加驱动。超过
              72% 的城市家庭表达了对智能家居设备的兴趣。这些市场信号确认，The Bot Company 追逐的买家群体已经在 sub-$1,000
              价位的自动化产品上积极消费；这说明支付意愿真实存在，但不一定延伸到通用机器人所需的数千美元价格点。

              Goldman Sachs 在分析 2025 World Robotics Conference
              并接触领先中国公司后，将家庭机器人消费者需求描述为“正在激增”，尤其是在娱乐、教育和陪伴方向。该机构也指出，真正通用机器人在高度自适应多技能智能上的“ChatGPT
              时刻”可能还要两到三年才会到来；这给任何瞄准这一窗口内消费通用机器人的公司——包括 The Bot Company——带来时点风险。
