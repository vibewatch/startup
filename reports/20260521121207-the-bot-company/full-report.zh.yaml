      - number: '7.2'
        title: 产品、技术与运营风险
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 的核心技术逻辑，是把自动驾驶感知和 AI
              专长迁移到家用机器人。这个逻辑有吸引力，但也带有结构性风险；机器人文献已有充分记录，近期硬件创业公司的失败也提供了例证。首要技术风险是仿真到现实的泛化缺口：家庭环境是机器人领域最无结构的运行场景之一，物体摆放不可预测、光照变化大、地面杂乱、表面陌生，仿真无法完整覆盖。消费者接受门槛下的操作可靠性要求错误率接近零；即便只是偶发失败，损坏物品或造成轻微伤害，也可能让产品失去商业资格。公司的人在回路远程操作系统在运营上缓解了泛化问题，但也引入了两个尚未在任何公开披露中解决的问题：边际成本结构（远程操作员劳动力）和隐私暴露（操作员访问家庭实时视频）。

              iRobot/Roomba 的 Chapter 11 申请（December 2025）是最直接相关的市场先例。iRobot 曾是全球家用机器人市场二十多年的领导者；其收入从峰值约 $1.4 billion 跌至
              2024 年的 $682 million，随后申请破产。摧毁公司的因素包括：Roborock、Dreame 和 Ecovacs 等中国 OEM 的价格压力；未能跟上功能创新；硬件毛利薄；以及其 $1.7
              billion Amazon 收购案在 2024 年初因反垄断审查失败。iRobot 拥有数十年品牌资产和数百万台出货量；The Bot Company 出货量为零。The Bot Company
              的通用操作平台面对的可靠性问题，从根本上比扫地机器人更难，单机经济性的不确定性也相应更高。

              硬件制造风险很重要，但讨论不足。精密执行器交期在 2026 年达到 14 months，供应集中在少数亚洲制造商手中。K-Scale Labs 在 2025 年的失败说明，执行器可靠性投入不足会带来危险。The
              Bot Company 没有披露合同制造伙伴、供应链架构、物料清单、目标单机经济性或计划产量——这些都构成关键运营依赖的阻断级尽调缺口。
