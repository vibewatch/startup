      - number: '3.5'
        title: 护城河耐久性与战略风险
        blocks:
          - type: paragraph
            body: >
              The Bot Company 的防御性来自几类尚未验证的潜在护城河：新产品类别里的先发品牌信任；通过机队部署积累的自研 AI
              与行为数据飞轮；通过耗材和软件订阅形成的潜在硬件平台锁定；以及创始人信誉对人才和分销伙伴的吸引力。单看任何一项都不够持久。中国制造商已经在扫地机器人类别证明，它们能在西方硬件创新推出后三到五年内逆向工程、复制并用更低价格压过对手。


              iRobot 案例是最清晰的反向证据：尽管拥有 20 多年品牌资产、美国市场领导地位，以及 Amazon 的救助式收购尝试（被反垄断监管机构阻止），iRobot
              仍无法在中国竞争对手的商品化定价面前保持盈利。The Bot Company 的 $2B 估值意味着市场已经把相当大的信用给了其品类创造逻辑，但一个 $2,000 价位的消费硬件要承载多任务运行所需的 AI
              算力和传感器物料清单，单体经济模型还没有跑通。如果硬件毛利很薄——早期出货量下几乎必然如此——持续软件订阅收入就成了关键变量，而家庭 AI 生态的切换成本仍处在早期。


              正向结构因素包括：The Bot Company 已融资 $302M，有足够跑道在中国玩家进入前寻找产品市场匹配；非人形形态避开了双足竞争者面对的监管和认证风险；在 1X 和 Figure
              聚焦工业部署时，面向消费者市场无强敌开发的窗口确实存在，只是有时间限制。最可信的反向情景是，Roborock 或 Ecovacs 在 2028–2029 年前把 AI
              平台延伸到操作能力，并凭更强分销和制造规模达到同一消费价格点。The Bot Company 必须在窗口关闭前建立品牌信任、数据护城河和分销能力。
