        title: 资本充足性与融资机制
        blocks:
          - type: paragraph
            body: >
              The Bot Company 已确认资本基础约为 $302 million，来自两轮股权融资。第一轮是 2024 年 5 月宣布的 $150 million 种子轮，法律实体为 Botco, Inc.（CIK
              0002024013）；SEC Form D 于 2024-05-21 提交，显示按 Rule 506 豁免募得 $150,669,884 股权资金，并由 Kyle Vogt 以 CEO
              身份签署。这是公开可得融资信息中唯一已确认的一手文件。种子轮投资者包括 Nat Friedman、Daniel Gross、Nabeel Hyatt（Spark Capital）、Patrick
              Collison、John Collison、Quiet Capital、Elad Gil 和 Fifty Years。Forbes 援引多名了解该轮融资的人士报道称，投后估值约为 $550 million。


              第二轮已确认融资是 2025 年 3 月完成的 $150 million，由 Greenoaks Capital 领投，投后估值 $2 billion——约十个月内较种子轮上升 3.6x。Reuters 报道（由
              The Robot Report 引用）最先确认该轮融资；随后 Bloomberg、Economic Times 和多家媒体给出佐证。官方 bot.co 网站列出的更广投资者名单包括
              Greenoaks、NFDG、Spark、Eclipse、Kleiner Perkins 和 Y Combinator，说明除 Greenoaks 领投外，可能还有更多投资者在后续交割或分批融资中加入。


              Bloomberg 于 2025 年 10 月报道称，The Bot Company 正寻求以高于 $4 billion 的估值再融资 $250 million，这将较 2025 年 3 月轮次再上升
              2x。截至本报告日期（2026 年 5 月），该轮状态未确认；它可能已经完成、部分完成，也可能仍未落地。如果确认，累计融资将约为 $552 million，隐含估值路径为：$550M（种子轮，2024）→
              $2B（2025 年 3 月）→ $4B+（2025–2026），一家产品发布前公司在 18 个月内估值大约上涨 7x。


              没有公开披露任何债务融资、可转债、收入分成融资、项目融资额度或其他非股权工具。所有已确认资本都是风险股权。Greenoaks Capital
              的投资哲学以集中下注、长期持有和主动治理为特征，这与领投方有能力支撑公司度过多年收入前研发阶段相一致。


              按当前阶段估算（月度约 80 名员工、活跃硬件原型开发和云端 AI 算力），基于同等员工规模和阶段的可比硬件 AI 创业公司基准，月度现金消耗约为 $2–4 million。这意味着仅按 2025 年 3
              月已确认的 $302 million 基础测算，现金跑道约 6–12 年——但该估算没有计入制造爬坡；一旦生产开始，制造通常会消耗 $20–100 million
              或更多资本。更现实的“从研发烧钱到制造爬坡”情景会在硬件投产后把跑道压缩到 2–4 年，因此需要 Bloomberg 报道中的融资或另一轮新融资。
