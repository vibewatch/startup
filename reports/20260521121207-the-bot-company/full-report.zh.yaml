              - CO004
              - CO005
              - CO006
      - number: '1.2'
        title: 创立历史与领导团队
        blocks:
          - type: paragraph
            body: >
              Kyle Vogt 于 2024 年 5 月公开宣布成立 The Bot Company，距离他 2023 年 11 月辞任 Cruise CEO 约五个月。Vogt 与 Paril Jain、Luke
              Holoubek 联合创立公司；后两人都从自动驾驶行业相邻岗位离开。Jain 曾在 Tesla Autopilot 团队担任负责人，并公开发帖称离开 Tesla 是为了加速机器人行业发展；Holoubek 曾是
              Cruise 软件工程师及 CTO 技术顾问。创始团队的自动驾驶背景可直接迁移到独立家用机器人，因为两者在感知、导航和操作上共享核心技术难题。


              Vogt 此前于 2007 年联合创立 Justin.tv，后者演变为 Twitch，并于 2014 年以 $970 million 被 Amazon 收购。他还于 2013 年联合创立 Cruise，2016
              年被 General Motors 以约 $1 billion 收购；此后他继续担任 CEO，并带领公司在美国多个城市部署超过 250,000 次无人驾驶出行。他还创立了 Socialcam，2012 年以
              $60 million 被 Autodesk 收购。这一连续创业和多次大型退出记录，使他在 AI 与自主系统领域具备异常强的创始人—市场可信度。


              The Bot Company 更广泛的团队招募了来自 Tesla、Cruise、OpenAI、Google 和 Pixar 的工程师与设计师，凸显公司有意招聘真正把产品交付给大规模用户的人。Paril Jain
              担任 CTO。截至 2026 年 5 月，除创始团队和投资人组合之外，公司尚未公开任命其他高管或董事会成员。这使 Vogt 作为创始人和主要公众面孔形成实质性关键人物集中风险。
