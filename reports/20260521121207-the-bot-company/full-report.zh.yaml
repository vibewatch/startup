      - number: '6.4'
        title: 渠道策略未披露；DTC 线上和后续零售最可能
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，The Bot Company 没有公开披露销售渠道、定价模式、分销伙伴或零售策略。公司网站（bot.co）承担认知和兴趣收集功能；访客可以提交联系方式以接收更新，这符合 DTC
              硬件发布中常见的早期漏斗等候名单或预订模式。没有披露任何合作伙伴公告、零售铺货讨论或企业渠道协议。

              考虑到公司的消费者聚焦和旧金山所在地，最可能的上市路径是以线上销售为主渠道的 DTC 硬件发布。这与其他高端消费机器人品牌的路径类似。DTC
              能完整保留毛利、控制品牌，并收集丰富的购后数据。但它也带来高获客成本，需要投资物流和支持基础设施，并把发现范围限制在已经知道品牌的消费者。一条后续零售路径可能通过电子和家居零售商——Best
              Buy、Costco、Apple Stores 或类似渠道——扩大触达，但这需要分销级包装、零售经济性（35-45% 毛利率）和贸易营销投入。

              公司描述的商业模式把一次性硬件销售和持续软件订阅结合起来。这种两段式收入模式在高端消费设备中很常见（参见
              Peloton、Roomba/iRobot），但历史上执行难度很高：消费电子硬件毛利薄，订阅绑定率高度依赖用户感知到的持续价值。The Bot Company
              没有披露目标硬件价格、订阅价格或预计硬件到订阅转化率。这些都是评估任何收入模型时的实质未知数。

              silicon.co.uk 关于 2025 年 3 月融资轮的报道明确指出，“The Bot Company 没有客户、没有产品、没有收入，仍在搭建硬件和 AI
              软件”——确认公司处在纯产品开发模式，尚未运营化任何上市职能。从现在到首次商业发布之间的窗口，是一个只有公司主动披露时间线才能填补的证据缺口。
