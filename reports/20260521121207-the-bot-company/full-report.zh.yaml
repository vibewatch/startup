      - number: '6.5'
        title: 没有具名客户、试点或部署；所有需求证明都停留在市场层面
        blocks:
          - type: paragraph
            body: >-
              截至报告日 May 21, 2026，The Bot Company 尚未公开披露任何具名客户、beta 测试方、试点项目、商业协议，或任何形式的部署。Silicon.co.uk 在报道 March 2025
              融资轮时明确写到，公司「没有客户、没有产品、没有收入」。The Bot Company 官网没有列出客户 logo、案例研究、用户证言或参考客户。公开信息中也没有正式 beta
              项目、设备交付公告，第三方平台上也没有来自客户的评论或证言。

              因此，本章无法填入第 6 章分析一家已有商业牵引公司的常规客户证据数据点——具名部署、生产环境与试点状态、效果指标、客户报告满意度、NRR、GRR、流失、合同期限或队列留存。下文把这些维度全部列为证据缺口。

              唯一可用的需求证据停留在市场和调研层面：第三方消费者研究显示，65 percent
              的美国消费者有兴趣拥有高级家用机器人；家用机器人市场以双位数速度增长；双收入家庭已经被证明会购买机器人家务电器。这些只是需求信号代理，不是客户证据。它们确认市场存在，但不能替代 The Bot Company
              已经找到产品-市场契合、获得任何付费用户，或成功把机器人部署进家庭的证据。

              现阶段缺少客户证据，符合一家产品未发布公司的状态。但这也意味着，整个客户章节——客群、付费意愿、渠道、留存和扩张——都建立在更大市场和公司自述定位的推断上。投资者阅读本章时，应把它视为市场与定位分析，而不是商业牵引证据。
