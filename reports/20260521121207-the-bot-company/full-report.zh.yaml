      - number: '2.6'
        title: 对 The Bot Company 的战略含义
        blocks:
          - type: paragraph
            body: >
              市场分析给出五点战略含义，用于评估 The Bot Company。第一，TAM 很大且在增长，但 The Bot Company
              瞄准的具体子赛道——多功能高端机器人——尚未被公开测算，需要创造市场，而不仅是夺取市场。2025 年 $14–17B 的全球家庭机器人市场是真实存在的，但 80%+ 来自 $600 以下扫地机器人；The Bot
              Company 瞄准的是一个尚未规模化存在的品类。这既是机会（没有直接竞争对手），也是风险（高端价格点需求未验证）。


              第二，公司所称的主要买方——美国主要都会区收入 $100K+ 的双职工家庭——正是推动 Peloton bikes、Nest thermostats
              和高端扫地机器人早期采用的同一群体。这是一个已验证、可触达的早期采用者细分，有记录显示其愿意为便利技术付费。问题在于，多功能机器人能力能否在该群体中支撑 $1,500–$3,000
              价格，并抢在中国竞争对手以半价复制功能之前站稳。


              第三，硬件加订阅商业模式有强先例，但需要谨慎设计：Peloton 因订阅依赖而崩塌，Ring/Nest 因数据治理引发争议，这些都说明居家技术订阅在数据实践不透明时，同时面临财务模型风险和消费者信任风险。Bot
              Company 必须从第一天起设计订阅条款和数据治理。


              第四，认证和监管时间线意味着，如果公司截至 2026 年尚未启动 UL 3300 预认证测试，任何 2026 年发布都不可行，而 2027 年发布也需要激进执行。这是一个实质性尽调问题。


              第五，iRobot 破产对高端美国机器人硬件公司是警示信号，但也是机会：iRobot
              失败源于在单功能扫地机器人这个商品化细分中，与具备规模制造优势的对手竞争。一个靠能力而非价格竞争的差异化多功能平台，风险画像不同——但前提是它要在中国竞争对手复制 LLM 控制层之前出货。
            claimRefs:
              - CM034
              - CM035
              - CM036
              - CM037
      - number: '2.7'
        title: 展示项
        blocks:
          - type: callout
            title: 市场机会真实存在，但需要创造品类
            body: >
              2025 年 $14–17B 的全球家庭机器人市场真实且增长，但 80%+ 收入来自价格低于 $600 的单功能扫地机器人。The Bot Company 并不是进入这个市场，而是在旁边创造一个多功能、高端定价
              AI 机器人的新子品类。没有已发布分析师 SAM 直接覆盖该子赛道，因此机会规模和采用风险都存在结构性低估或未明。投资人应把它建模为品类创造赌注，而不是市场份额夺取。
            calloutType: insight
            claimRefs:
              - CM004
              - CM012
              - CM034
          - type: callout
            title: iRobot 破产是高端美国硬件的警示
            body: >
              iRobot 拥有 15+ 年品牌资产和约 9% 全球扫地机器人市场份额，却在中国制造商竞争压力下于 2025 年 12 月申请 Chapter 11。这是评估 The Bot Company
              时最具体的负面市场信号：高端美国机器人硬件公司面对中国规模制造存在结构性成本劣势。The Bot Company 要活下来，必须在多功能能力和 LLM
              控制上形成真实产品差异化——不能只靠高端品牌——才能把定价维持在中国竞争带之上。
            calloutType: risk
            claimRefs:
