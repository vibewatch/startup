  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: The Bot Company 从认知到采用家务自动化的假设客户旅程。由于公司没有已部署客户，“试用”及之后所有阶段都未经验证。该图基于消费者研究和公司陈述定位，反映主要双收入家庭客群的预期旅程。
    approximationNotes: “认知”之后所有阶段均根据市场常规和公司定位推断；不存在 Bot Company 客户旅程数据。
    data:
      nodes:
        - id: awareness
          label: 认知
          tone: neutral
          detail: 消费者通过媒体报道、Kyle Vogt 的个人影响力或社交媒体听说 Bot Company。公众兴趣高，但产品熟悉度低（85% 不太熟悉）。
        - id: interest
          label: 兴趣 / 考虑
          tone: positive
          detail: 消费者访问 bot.co；注册获取更新（候补名单）。潜在兴趣强：65% 美国消费者对家用机器人感兴趣（Altman Solon 2025）。
        - id: barrier
          label: 购买障碍
          tone: warning
          detail: 价格锚定（$1,000-$5,000 上限 vs 可能更高的产品价格）、隐私担忧（家中摄像头 / LiDAR）、安全犹豫（50% 对先进家用机器人感到不适）和低熟悉度都会成为转化摩擦。
        - id: purchase
          label: 购买决策
          tone: neutral
          detail: 5% 早期采用者群体愿意支付 $10,000+；更广泛的大众市场采用需要把价格降到 $5,000 区间。根据调查偏好，一次性购买（37%）或订阅（24%）都可行。
        - id: onboarding
          label: 入门 / 设置
          tone: neutral
          detail: 28% 的智能家居买家把设置复杂度视为障碍；入门体验将决定留存。相比传统重 App 设置，语音命令 / LLM 界面降低复杂度。
        - id: value-delivery
          label: 家务自动化价值
          tone: positive
          detail: 成功部署每周可为家庭节省 6+ 小时。消费者按约 $14/hour 估值（约 $4,368/year）。正向 NPS 可通过口碑扩展到 STR 运营商和养老护理客群。
