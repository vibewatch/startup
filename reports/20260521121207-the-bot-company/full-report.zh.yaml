      - number: '5.4'
        title: 差异化、IP 与制造
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 的主要技术差异化来自三点：创始团队在自动驾驶（AV）感知和 AI 上的深度经验，全栈垂直整合模式，以及刻意选择非人形硬件路线。Kyle Vogt、Paril Jain（前
              Tesla AI 团队负责人）和 Luke Holoubek（前 Cruise 软件工程师）共同拥有稀缺的实战经验：把必须在非结构化真实环境中安全规模化运行的 AI 系统交付出去。这种从 AV
              到家庭的迁移，是技术逻辑里最可信的部分：传感器融合、基于 SLAM 的导航、机队遥测和 OTA 学习，都是自动驾驶中已建立的模式，现在被改造到家庭场景。非人形形态避开了 Figure AI 和 1X
              等竞争者面对的双足平衡和执行器成本难题。IP 方面，截至 2026 年 5 月，公开渠道检索不到 The Bot Company 已授权专利；据报道至少有一件流程编排专利申请，但尚未验证。公司的 SEC Form
              D 文件确认其法律实体为 BotCo Inc.。制造计划没有公开披露；在 $4 billion 估值、融资约 $300 million
              的情况下，公司需要处理合同制造伙伴关系、执行器和传感器供应链、质量控制——这些都没有公开描述。这是一个实质尽调缺口：消费级硬件的规模制造与偏软件的 AV 开发在结构上不同，而团队过往经验主要在后者。
