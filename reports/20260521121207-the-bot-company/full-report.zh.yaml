      - number: '7.4'
        title: 监管、法律与产品责任风险
        blocks:
          - type: paragraph
            body: >-
              消费级家用机器人处在复杂且不断变化的监管环境中。Consumer Product Safety Commission (CPSC) 是监管家用产品安全的主要联邦机构；依据 Consumer Product
              Safety Act 第 15 条，它可以强制召回并施加民事罚款。截至 May 2026，The Bot Company 没有披露任何安全认证，包括 UL 3300、ISO 13482，或仍在制定中的 IEC
              63327 家用服务机器人标准。进入大型零售渠道通常要求 UL 认证，这构成一扇尚未公开回应的上市闸门。

              Federal Trade Commission 对联网家居设备隐私、数据安全和欺骗性行为的管辖权已经确立且正在执行。Arnold & Porter 的 April 2026 提示确认，CPSC
              已扩大对软件驱动消费产品的召回权限。一台带动力机械臂的室内移动机器人，在产品责任上会面对设计缺陷、制造缺陷和未警示等侵权主张；任何对人或宠物造成的伤害都会引发诉讼风险。HumanoidLiability.com
              对 Cruise 延期起诉协议的分析说明，未向监管机构完整报告安全事故是联邦刑事犯罪，而不仅是民事违规——这为所有部署自主消费系统的公司设下先例。

              国际上，EU General Product Safety Regulation (GPSR) 已于 December 2024 生效，对在欧盟销售的 AI
              驱动消费产品施加持续的安全、网络安全和可追溯性义务。修订后的 EU Product Liability Directive（December 2026 生效）扩大了缺陷 AI
              嵌入式产品造成伤害时的严格责任。Osborne Clarke 对消费机器人监管的分析确认，制造商现在面对 GPSR、EU AI Act、Cyber Resilience Act 和 GDPR
              多层合规负担。没有公开披露涉及 The Bot Company 的监管文件、认证或执法行动——这与阶段相符，但商业发布时会变成闸门。
