      - number: '1.5'
        title: 公司里程碑
        blocks:
          - type: paragraph
            body: >
              The Bot Company 在不到两年内从成立公告推进到数十亿美元估值——即使对 AI 相邻创业公司而言，这条融资时间线也异常压缩。公司成立于 2024 年上半年至年中，Kyle Vogt 于 2024 年
              5 月通过社交媒体和媒体公开宣布，称希望「打造能替你做家务的机器人」。最初 $150 million 种子轮与成立公告同步披露，说明资本在公开发布前已经承诺到位。


              创始团队组成本身就是一个里程碑：Paril Jain 专门离开 Tesla 联合创立公司，并公开发帖称离开 Tesla 是为了「加速机器人行业其他领域的发展」。这确认 Jain 离开 Tesla
              是有目的的，而非巧合。Luke Holoubek 离开 Cruise 早于公司发布。这些动作合在一起，指向一套有计划的创始顺序，而不是机会主义拼盘。


              2025 年 3 月，公司宣布（经 Reuters 报道）完成由 Greenoaks 领投的第二轮 $150 million 融资，估值 $2 billion，距离种子轮不到一年。到 2025 年 10
              月，Bloomberg 报道公司正洽谈再融资 $250 million，估值超过 $4 billion。若该轮交割，公司估值将在约十八个月内接近三倍。截至 2026 年 5
              月，公司尚未宣布商业产品发布，阶段仍是研发和招聘。缺失的里程碑，是没有任何产品演示、试点客户或商业发布公告。这是当前最重要的未决风险：创始人能否在投资人耐心耗尽前，把异常强的融资能力转化为可部署产品？
