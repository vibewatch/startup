      - number: '4.3'
        title: 单体经济模型与成本结构
        blocks:
          - type: paragraph
            body: >
              The Bot Company 没有披露任何单体经济模型数据。公司仍处在产品发布前、尚未量产阶段，以下分析完全基于可比消费硬件机器人平台的行业基准，应被视为说明性框架，而不是公司特定证据。


              在低产量阶段（年产低于 10,000 台），一台高端消费机器人若包含 LiDAR、摄像头、机械臂、可更换末端执行器、端侧算力和无线连接模块，其物料清单估计为零售价的 50–70%。对一台 MSRP 为
              $2,000 的机器人，这意味着每台 BOM 为 $1,000–$1,400，尚未计入组装、质检、包装和运输；发布初期毛利率可能落在负 10% 到 20% 区间。这与同业早期硬件路径相符，包括
              Roborock（经过多代产品才达到 35–45% 毛利率）和 iRobot（只有在 Roomba 多年规模化后才维持 30–40% 毛利率）。


              软件订阅层一旦规模化启用，结构性毛利率应达到 60–80%，与 SaaS 和云服务经济性一致。但人类在环 AI 系统会把边界案例解决方案通过 OTA
              更新分发回机器人机队，也会带来每个订阅用户的云算力成本，初期会压低订阅毛利率。随着机队扩大、AI 模型通过群体学习改善，每台机器人每月的推理成本应下降。


              按 Sacra 分析，TBC 计划采用合同制造模式，这会降低前期资本开支，但通常会让单台 BOM
              高于垂直整合，因为代工方要拿走利润。这是消费硬件创业公司的标准取舍：用更低固定成本强度，换取更高单位可变成本。在产品发布阶段，这通常是正确选择；到数百万台规模时，垂直整合才具备经济性。


              一个全新、$2,000+、且尚无既有需求信号的消费硬件品类，获客成本（CAC）高度不确定。高端硬件的 DTC 渠道（社交媒体、搜索、自然媒体）通常每售出一台需要 $300–$1,500
              的营销和渠道成本，回本周期取决于订阅转化和流失，通常为 12–36 个月。公司没有披露任何 CAC 数据、等候名单规模或消费者需求信号。


              上市路径尚未披露。截至 2026 年 5 月，公司没有宣布任何零售合作、分销协议或渠道关系。这是一个重大财务未知数：零售分销（例如 Best Buy、Amazon）通常要求在 MSRP 基础上给出 30–40%
              渠道折扣，会进一步压缩本已很薄的硬件毛利；DTC 可以避免这一点，但需要相应更高的营销投入。
