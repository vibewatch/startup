      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >
              The Bot Company 已通过两轮主要融资披露约 $302 million 累计融资，并在 2025 年 3 月达到据报道 $2 billion 的投后估值——距离公司宣布成立不到一年。即便按
              Silicon Valley 风险投资标准，这样的融资速度和规模也很罕见，尤其是对一家尚未推出产品的硬件公司。


              最初的 $150 million 种子轮于 2024 年 5 月宣布；Forbes 援引多方来源报道称，该轮投后估值为 $550 million。本轮投资人包括 Nat Friedman（前 GitHub
              CEO、专注 AI 的投资人）、Daniel Gross（Pioneer 创始人和投资人）、Nabeel Hyatt（Spark Capital 普通合伙人）、Patrick Collison（Stripe
              CEO）、John Collison（Stripe 联合创始人）、Quiet Capital、Elad Gil 和 Fifty
              Years。该财团最突出的特点，是聚集了大量知名硅谷运营者和投资人；他们很少领投这种规模的种子轮。


              第二轮 $150 million 于 2025 年 3 月完成，由 Greenoaks 领投（这是一家位于旧金山的全球投资机构，曾为早期科技公司承销十亿美元级估值）。该轮给公司的投后估值为 $2
              billion，不到十二个月较种子轮估值提升约 3.6 倍。按公司 2026 年 5 月官网披露，投资人名单还包括 Eclipse、Kleiner Perkins 和 Y
              Combinator，这些机构未出现在早前轮次中，暗示 $2 billion Greenoaks 轮到报告日之间可能有追加交割或新一轮融资。2025 年 10 月，Bloomberg 报道公司正寻求再融资
              $250 million，估值将超过 $4 billion，较十八个月前估值近乎翻倍。截至报告日，该轮状态尚未确认；它可能已经交割、部分交割，或仍未完成。
