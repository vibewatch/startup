      - number: '6.3'
        title: 支付意愿锚定在可能售价之下；信任、隐私和成本都是障碍
        blocks:
          - type: paragraph
            body: >-
              Altman Solon 调研（2025）为 The Bot Company 的目标市场提供了目前最清晰的支付意愿基准。69% 的美国消费者不愿为家用机器人支付超过 $5,000。25%
              不愿以任何价格购买。即便在自称了解人形机器人的受访者中，价格预期仍锚定在 $1,000 到 $5,000 区间。对一家已融资 $302 million、估值 $2
              billion，并在开发全新通用平台的创业公司来说，这是重大商业挑战：大众消费市场的价格天花板明显低于初期产品经济性很可能落点。

              consulting.us 对同一调研数据的分析指出，随着生产规模化，“可负担性不太可能长期是障碍”，并引用 Goldman Sachs 关于人形机器人硬件价格同比下降 40%
              的数据。但短期缺口很大：Figure AI 的通用模型目标价格约 $20,000，是大多数消费者锚定的 $1,000-$5,000 区间的四到二十倍。The Bot Company
              没有披露价格点，因此无法直接比较，但这个约束是全行业性的。大约 5% 的消费者，即“早期采用者”群体，愿意支付 $10,000 或更多；这可以成为高端定价发布机器人的合理初始滩头阵地。

              消费者对家用机器人节省时间的估值约为每小时 $14。超过一半的人预期机器人每周最多节省六小时；按每小时 $14 计算，年价值约为 $4,368，与 $5,000 心理天花板一致。The Bot Company
              若想证明高于该门槛的溢价合理，就必须以高可靠性带来有意义的时间节省。无论商品成本如何下降，这个基于价值的价格天花板都会存在。

              除价格外，还有三个已记录的障碍。第一是安全：约 50% 的消费者担心家中出现人形大小的先进机器人。The Bot Company
              的非人形、低矮轮式底盘设计可以部分缓解这一点，因为消费者更偏好“视觉和触感都柔和”、更小且没那么吓人的机器人。第二是隐私：Copeland 研究和 Deloitte 2025 Connected Consumer
              调研都记录了消费者对智能家居数据采集的担忧增加。带摄像头、LiDAR 和云连接 LLM 处理的家用机器人会面临实质消费者隐私审视。第三是落地复杂度：2025 年一项调研中，28%
              的智能家居用户将设置困难列为障碍。新用户引导和可靠性将是关键采用杠杆。

              StudioRed/Robotics & Automation News 对 200 多名机器人开发者的调研（2025）从供给侧确认了这些阻力：73%
              将高实施成本列为采用的最大障碍；安全和可靠性是第二常见担忧。这些数据来自开发者社区，但与消费者调研图景一致：价格和安全是一对家庭机器人发布必须处理的核心障碍。
