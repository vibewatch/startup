      - number: '2.3'
        title: 买方与细分市场格局
        blocks:
          - type: paragraph
            body: >
              家庭机器人市场当前买方集中在中高收入城市家庭，且智能家居设备采用率高。主要买方画像是双职工家庭（25–50 岁）、家庭收入高于
              $75,000、且至少有一个孩子或宠物——这一群体相对可支配收入更缺时间，因此更愿意为高端自动化付费。美国人均可支配收入 2023 年超过
              $57,800，并继续增长，支撑该收入层投资高端家居技术的意愿。高端机器人品类早期采用者不成比例地集中在大型都会区（纽约、旧金山、洛杉矶、波士顿、西雅图），这些地区双职工专业家庭密度最高。


              长期增长潜力最高的次级买方细分是养老护理家庭：65
              岁及以上成人或其照护者，他们希望为行动受限个体获得家庭辅助。日本、德国和美国在消费者调研中显示最高的养老护理机器人采用意愿。该细分面对另一套购买触发因素（担心跌倒、照护负担、居家护工成本）和价格敏感度，可能需要不同于主要高端细分的产品配置。


              短租运营商（管理 2+ 房源的 Airbnb/VRBO 房东）、小型办公室运营者和养老护理机构管理者，是公司暗示瞄准的其他客群。这些偏 B2B 的细分有明确运营成本问题（清洁劳动力流失、住客间周转时间）和可衡量
              ROI 门槛，但通常通过采购渠道购买，需要不同于消费者 DTC 的销售动作。


              2025 年，电商和直接面向消费者渠道约占全球家庭机器人销售的 55%，其余来自零售合作。北美高端机器人产品的主流分销模式是 DTC 在线（公司网站），再由 Amazon 和 Best Buy
              补充——Roborock、Ecovacs 等竞争对手也正是通过这些渠道成功从亚太扩展到西方市场。
            claimRefs:
              - CM017
              - CM018
