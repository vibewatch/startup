      - number: '4.6'
        title: 证据材料
        blocks:
          - type: callout
            title: 收入前 $2B+ 估值带来显著投资判断风险
            body: >
              The Bot Company 的 $2 billion 估值（已确认，2025 年 3 月）和据报道的 $4 billion-plus
              目标估值（未确认），完全建立在可选性溢价上——创始人履历、品类创造逻辑和团队质量——没有收入、产品或单体经济模型验证。这在 AI 机器人领域并非孤例（Figure AI 在消费者业务前估值达到
              $39B），但意味着投资者无法用标准财务指标校准估值。任何产品发布延迟、制造成本超支或消费者采用慢于预期，都可能迫使公司以潜在压缩条款融资。iRobot
              破产说明，即使有可观收入的硬件机器人公司也不能免于财务压力。
