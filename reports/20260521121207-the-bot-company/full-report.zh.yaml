      - number: '4.5'
        title: 财务结论与证据缺口
        blocks:
          - type: paragraph
            body: >
              收入质量：无法评估——TBC 还没有收入。没有商业化产品、没有披露 ASP、没有宣布发布时间表、没有已签客户合同，也没有公开领域中的等候名单或预订数据。Latka 估算的 “$16.6M ARR”
              不可靠，应予以排除。


              毛利路径：高度不确定且资本密集。消费硬件机器人在发布初期的出货量下通常毛利为负。要走到 20–35% 的混合硬件毛利，需要显著规模（可能是年产 100,000+
              台）和供应链成熟。订阅层提供了长期扩毛利路径，但在装机量足够大之前，财务贡献可以忽略。按同业先例，如果公司在报告日期后 12–18 个月内发布产品，混合毛利转正大约是发布后 3–5 年的事情。


              资本强度：高，且前置。硬件机器人需要大量资本用于研发、原型工装、制造认证和初始库存。已确认的 $302 million
              基础足以支撑研发阶段和初步生产准备，但要把制造爬坡到每年数万台，还需要额外资本——无论来自据报道的 $250 million 轮次，还是后续融资。产品验证后，制造设备或库存相关债务融资可能可用。


              尽调阻塞项：

              1. 实际烧钱速度和账上现金：没有月度经营报告，只能估算跑道，无法确认。

              2. 产品发布时间表和里程碑计划：没有公开时间线；任何估值模型都需要假设发布日期。

              3. 单体经济模型：BOM、ASP、订阅定价和渠道经济性都未公开。

              4. $250M 轮次状态：该轮是否关闭，会实质影响资本充足性和估值正当性。

              5. 收入和需求验证：预订、等候名单、试点部署或机构 LOI 都能提供初步需求信号，但没有任何公开信息。
