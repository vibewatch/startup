companyProfile:
  summary: >
    The Bot Company 是一家位于旧金山的家庭机器人创业公司，2024 年 5 月由 Kyle Vogt（Cruise 前 CEO、Twitch 联合创始人）、Paril Jain（Tesla 前 AI 负责人、现任
    CTO）和 Luke Holoubek（Cruise 前工程师）创立。公司在开发非人形、AI 驱动的家用机器人，用自然语言指令自动完成日常家务，并把自动驾驶工程在感知、操作和世界模型仿真上的经验迁移过来。截至 2026 年 5
    月，公司尚未推出产品、也没有收入；两轮已确认融资约 $302 million，已确认投后估值为 $2 billion。投资人组合包括 Greenoaks、NFDG、Spark Capital、Eclipse、Kleiner
    Perkins 和 Y Combinator。Kyle Vogt 此前在 Cruise 任职期间经历 2023 年 10 月行人拖行事件并随后辞职，这构成重要的负面背景因素。
