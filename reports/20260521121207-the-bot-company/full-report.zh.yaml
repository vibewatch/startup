  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              The Bot Company 提出的是双收入模式：一次性硬件销售叠加持续软件订阅费，但两个组成部分都没有公开定价。基于 Sacra 对公司商业模式以及高端消费机器人竞争格局的分析，硬件单机预计瞄准约
              $1,500–$3,000 的消费者平均售价（ASP）——这与行业报道中的价格区间一致，也符合其相对 1X Technologies NEO 人形机器人（发布价为 $499/month 订阅，隐含硬件成本高于
              $20,000；但 TBC 的非人形形态使其 MSRP 应显著更低）的竞争定位。云端 AI 功能、OTA 更新、人类在环处理和智能家居集成若按月收取 $30–$80，和类似“硬件 + 软件”平台相符。


              “硬件 + 订阅”模式的收入确认分成两条流：硬件收入在销售或交付时确认；订阅收入在订阅期内按比例确认。随着装机量扩大，订阅层会形成不断增长的经常性收入，但第一年的总收入主要由硬件 ASP
              和销量决定。在发布前阶段，公司没有记录任何类型的收入。公司也没有披露来自消费者或机构买家的预订、订金计划或意向书管线。


              截至 2025 年 11 月，GetLatka 数据库页面称 The Bot Company 有 “$16.6M ARR”（高于 “2024 年的 $2.9M”）。这个数字在页面内部标注为“GetLatka
              估算指标”，不是公司披露数据；它也与所有可信媒体报道、公司自身的产品前定位、没有任何商业发布公告以及公司网站信息相矛盾。没有任何佐证来源能证明公司已有收入。Latka 数字必须视为不可靠估算，本分析不采用。


              二级目标市场包括短租运营商、养老护理服务商和小型办公室设施团队，把可触达市场从核心消费家庭向外扩展。这些细分通常能接受比纯消费者渠道更高的 ASP 和持续费用，为发布后的溢价定价提供潜在路径。
