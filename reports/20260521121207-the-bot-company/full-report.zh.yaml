          - type: callout
            title: Altman Solon 调研显示，WTP 上限是结构性约束，不只是暂时障碍
            body: >-
              Altman Solon (2025) 发现，69 percent 的消费者不愿支付超过 $5,000；这不只是熟悉度或认知不足、靠教育就能解决的问题。即便在最了解产品的消费者中，WTP 仍锚定在
              $1,000-$5,000。这意味着 The Bot Company 要么把硬件成本压到 $5,000 以下，才可能打开大众市场；要么接受初始市场只有大约 5 percent 感兴趣消费者——即愿意支付
              $10,000+ 的人群——并用这批人来资助成本曲线下移。前一条路要求公司在收入验证设计之前就取得巨大的制造规模；后一条路会限制初始收入，但可能是唯一可行的发布路径。
