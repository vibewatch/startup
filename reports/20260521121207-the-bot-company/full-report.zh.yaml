      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              本章为 The Bot Company 构建三个 5-year 投资期（到
              2030–2031）的估值情景，并锚定具体市场、技术和融资里程碑。所有情景都明确带有推测性；没有运营证据可用，无法精确赋予概率权重。情景框架仅用于投资委员会讨论。

              乐观情景（概率信号：低——需要多个成功同时发生）：TBC 在 2027 年推出商业可行机器人，到 2029 年实现 $200 million 收入，并在 2030 年占据全球家用机器人市场
              2–5%。若通过大型科技平台（Amazon、Google、Samsung、Apple）战略收购退出，按 2029 年远期收入的 10–15x 计算，估值为 $2–4 billion。另一种路径是，如果 TBC
              成为家用 AI 的主导软件层（类似 Skild AI 作为基础模型平台），20x 收入倍数可支撑 $4–8 billion 估值。该情景要求公司在商业可靠性上解决仿真到现实的泛化缺口，拿下一级分销伙伴，在没有
              iRobot 式毛利崩塌的情况下扩大制造规模，并避免 Vogt 声誉事件。全球家用机器人市场到 2031 年达到 $41.9 billion，为 TAM 提供上行空间。

              基准情景（概率信号：中）：TBC 在 2027 年底或 2028 年初发布产品，遭遇明显商业化摩擦（获客成本、制造毛利压力、中国 OEM 竞争），到 2030 年实现 $50–100 million 收入。按
              5–8x 收入退出，退出估值为 $250–800 million。对按 $2 billion 进入的投资者来说，这是亏损情景（0.1–0.4x
              回报）。这一结果符合消费硬件机器人同行的早期轨迹：时间线长于预期，制造成本高于预期。Bloomberg 融资轮（若按 $4B+ 完成）会加重后期投资者的下行：他们需要 $4 billion+
              退出才能保本，而这要求乐观情景式执行。

              悲观情景（概率信号：中——尤其针对 $4B+ 进入层）：TBC 因仿真到现实泛化缺口，无法在 2029 年前推出商业可行产品；发生安全或隐私事件；或在物理 AI 融资环境收缩时无法继续融资。结果可能是按
              $1–1.5 billion 下轮降价融资，或以 $200–400 million 人才收购退出，资金主要分给优先股股东。普通股股东和后期投资者几乎没有或完全没有回报。iRobot 破产（December
              2025）和 K-Scale Labs 失败（2025）验证了这一情景：即便资金充足，家用机器人商业化也能快速摧毁股权价值。
