      - number: '5.5'
        title: 信任、安全、合规与关键风险
        blocks:
          - type: paragraph
            body: >-
              据报道，机器人的安全功能包括软保险杠、扭矩受限关节和冗余接近感知，体现了源自 AV 的近人和近宠物运行原则。家用机器人的隐私风险在结构上很大：在整个家庭中持续使用视频、LiDAR
              和音频感知，会产生高度敏感的环境数据。截至 2026 年 5 月，The Bot Company 没有发布面向家用产品的隐私政策、数据处理规范或安全架构。也没有披露任何安全认证，包括 UL
              3300（美国服务机器人标准）、ISO 13482（个人护理机器人）或 IEC 63327（制定中的家用服务机器人标准）。美国消费级家用机器人目前缺乏强制认证制度，但大型零售渠道通常要求 UL
              或同等认证。在当前阶段，公开安全与合规披露缺失对一家发布前研发阶段公司而言并不异常，但它会成为未来商业部署的闸门。最关键的技术风险是：（1）非结构化、高变化家庭环境中的 sim-to-real
              泛化，陌生物体、光照变化和杂乱布局会削弱模型表现；（2）消费者接受所需的操作可靠性底线——哪怕偶发错误损坏物品或造成轻微伤害，也会使产品商业上不可接受；（3）消费价格点下的硬件成本结构，要求执行器和传感器成本远低于当前现货市场价格；（4）进入家庭部署前必须具备的隐私
              / 数据治理架构。
