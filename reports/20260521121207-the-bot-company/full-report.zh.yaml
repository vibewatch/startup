      - number: '5.2'
        title: AI 与软件栈
        blocks:
          - type: paragraph
            body: >-
              智能层围绕大语言模型（LLM）搭建，用于解释自然语言语音指令——例如“把 Legos 放进蓝色箱子”——并拆解成多步物理动作计划。Kyle Vogt 将其描述为给机器人装上“LLM 的全部大脑”，把
              ChatGPT 时代的泛化能力转译到物理世界行动中。公司的工程招聘信息显示，它正在主动搭建三个核心 ML 子系统：实时协调移动底盘和机械臂的全身控制策略；生成并模拟视频序列、用于预测规划和 sim-to-real
              训练数据的时空世界模型；以及把几何计算机视觉与深度学习结合、用于实时物体识别和场景理解的 3D 视觉流水线。支撑这些系统的是一条仿真到现实（sim-to-real）流水线：强化学习智能体先在 GPU
              规模的仿真环境中训练，再迁移到实体硬件。ML 编译器团队会把多十亿参数模型转换到受延迟和功耗约束的边缘机器人处理器上运行。固件和电机控制工程师负责软件与执行器之间的底层接口。AI
              核心被设计为可云端更新，因此某台机器人运行中发现的边界案例修复，可以在无需硬件召回的情况下分发到整个机队。该架构是全栈、垂直整合的：硬件、固件、机器人 OS、感知、AI 规划和用户界面全部自研，延续了 Vogt
              在 Cruise 采用的集成哲学。
