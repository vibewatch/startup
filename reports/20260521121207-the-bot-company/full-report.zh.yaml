        - 有限工业部署；Amazon/SoftBank 战略背书
        - $2.12B post-money；融资 $400M
        - 最贴近 TBC 已确认 $2B 估值；阶段相近（早期部署 vs TBC 产品前）
        - 先做工业场景（仓储物流）；Amazon 战略买家提前占位；TBC 先做消费端
      - - 1X Technologies（Norway/USA）
        - NEO 人形机器人 early 2026 进入首批家庭；数量有限
        - 目标 $10B+（尚未确认关闭）
        - 与 TBC 同样瞄准消费家庭部署；OpenAI Startup Fund 背书
        - 双足人形、价格 $20K，而 TBC 目标是低于 $3K 的非人形；TAM 分段差异很大
      - - Ecovacs（SHA:603486）— 公开市场
        - 已盈利；TTM 收入 $2.8B；毛利率 47.8%；净利率 8.4%
        - EV/收入 1.71x；EV CNY 34.4B（~$4.7B USD）；市值 CNY 39.6B
        - 天花板 / 底线纪律：成熟上市家用机器人可比公司给出以收入为锚的底部估值
        - 成熟、盈利、高产量；已有 10–15 年规模化，而 TBC 仍在产品前；倍数压缩形成底线
      - - 可比轮次：TBC — Greenoaks Series B（March 2025）
        - 产品前；收入前；已确认累计融资 $302M
        - $2B post-money（已观察、已确认）
        - 最新确认估值；所有前瞻情景分析的锚点
        - 不能用经营指标独立验证；主要由可比公司叙事和 Vogt 履历驱动
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
    notes: >-
      所有私营公司估值均为公开报道融资事件中的上一轮 post-money，并未独立审计，可能不同于内部股权结构表标记。Ecovacs EV/收入倍数截至 May 21, 2026，反映当天公开市场状况。TBC 行只反映 March
      2025 已确认的 $2B 估值；Bloomberg 报道的 $4B+ 目标因未确认而排除。可比性限制很实质：所有私营可比公司要么在不同分段（先工业），要么拥有 TBC 已知股权结构表中没有的战略背书。
  - id: TV005
    title: 投资逻辑破坏与否决触发器表
    summary: >-
      Specific observable triggers that would break or confirm the investment thesis, with threshold, transmission
      mechanism, and action implication.
    columns:
      - 触发器
      - 可衡量阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 到 mid-2027 仍无产品演示
        - 到 Q2 2027 仍没有公开演示，或没有投资人见证的操作基准演示
        - 意味着商业化发布时间线推迟到 2028+，在收入前继续烧跑道；sim-to-real 风险升至阻断项
        - 拒绝跟投；任何新增资本承诺都必须设置里程碑门槛
      - - 安全或隐私事故
        - 任何公开伤害事件、CPSC 投诉、FTC 调查，或家庭监控数据泄露
        - 触发类似 Cruise 的监管和媒体螺旋；Vogt 既往经历会把严重性放大到未知创始人的 3–5x
        - 若已持仓则立即退出；零新增资本；让法律团队评估受托责任
      - - Bloomberg 轮未关闭
        - Botco Inc. 到 2026 年底仍无 SEC Form D 修订，也无新闻确认关闭
        - 累计资本不是 $552M 而是 $302M；烧钱跑道压缩 35%；制造资金缺口暴露
        - 下一次承诺前要求公司确认资本状态；将跑道模型调整为 $302M 基准
      - - 中国 OEM 推出低于 $2,000、可操作物体的消费机器人
        - Roborock 或 Ecovacs 在 18 个月内发布消费级定价、带操作臂的消费产品
        - 一手窗口关闭；TBC 的主要竞争优势（空白市场）被抹平；定价权被侵蚀
        - 复盘持仓；降低下一轮入场价格预期；要求披露分销伙伴
      - - 关键人离开（Vogt 辞任或失能）
        - Kyle Vogt 任何公开离任 CEO 的公告
        - 主要融资者、技术愿景和公开市场可信度同时消失；资本获取风险上升
        - 若有保护性条款则触发；评估资本重组或出售流程
      - - 降价融资
        - 任何新融资轮估值低于 $2 billion
        - 确认商业化失败或市场条件恶化；反稀释条款启动
        - 按市场价重估；复核治理权；确认是否有反稀释保护；考虑退出
    claimRefs:
      - CV033
      - CV034
      - CV035
    notes: >-
      触发器被定义为可观察、可公开报道的事件，而不是只有投资人通过私下尽调才能看到的内部或非公开进展。所有阈值都按最坏可见性场景校准，即最早可能出现的公开信号。这里不分配触发概率；每个触发器都代表投资人应持续监控的条件，而不是预期会发生的结果。
  - id: TV006
    title: 最终尽调追问表
    summary: >-
      Highest-priority unresolved evidence gaps that would materially change the investment recommendation, ranked by
      urgency.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 产品演示
        - 现场或投资人见证的机器人演示，并公布跨 5+ 类家务操作任务的成功率
        - 没有实证可靠性数据，sim-to-real 风险无法量化；任何高于 $500M 的估值都不能独立支撑
        - 在 NDA 下向公司索取；要求给出基准协议（如 tasks/hour、错误率、测试物体多样性）
      - - Bloomberg 轮确认
        - 确认 Oct 2025 Bloomberg 报道的 $250M、$4B+ 估值融资是否已关闭，以及条款如何
        - 这决定累计资本和跑道；$250M 差额会实质改变烧钱模型，也改变制造前资金缺口风险
        - 查 SEC EDGAR 中 Botco Inc. Form D 修订；向公司索取股权结构表；检查新闻线是否有关闭公告
      - - 股权结构表和烧钱速度
        - 当前股权结构表、优先权条款、清算瀑布，以及截至 Q1 2026 已确认的月度烧钱速度
        - 建模每个情景估值下的投资人回报，并评估降价融资中的优先权堆叠风险，都离不开这些数据
        - 在 NDA 下向公司索取；与 Greenoaks 和其他领投方交叉核对
      - - 供应链和制造伙伴
        - 合约制造商、执行器供应商、LiDAR 供应商和云 AI 提供商披露
        - 精密执行器 14 个月交期会带来生产延误风险；供应链未确认本身就是阻断性运营风险
        - 在 NDA 下要求披露供应链；向熟悉机器人执行器市场的制造顾问做背调
      - - Vogt DPA 个人合规义务
        - Kyle Vogt 是否接受 Cruise DOJ DPA 下、会延伸到 TBC 运营的个人合规义务
        - 任何个人合规条件都可能约束 TBC 治理、报告和监管姿态，并带来实质运营影响
        - 向 Vogt 律师索取法律意见；审阅公开 DPA 文本；向领投方确认其做过哪些背景尽调
      - - 分销策略
        - 商业产品发布时的具名零售、DTC 或渠道伙伴
        - 消费硬件没有分销就商业上站不住；没有渠道伙伴，就没有规模化获客路径
        - 向公司索取伙伴披露；评估与具名零售或 DTC 渠道的 LOI 或试点协议
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV030
    notes: >-
      尽调追问按改变投资建议的紧迫性排序。第 1、2 项（产品演示和 Bloomberg 轮确认）是承诺投资前的阻断项；没有解决前不应投资。第 3–6 项是完整承销必需信息，但可以与第 1、2
      项并行获取。所有项目都需要直接接触公司或查询 SEC EDGAR；单靠公开来源无法解决。
