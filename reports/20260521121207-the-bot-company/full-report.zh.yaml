      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              按第三方报道描述，机器人的设置流程包括：把设备推过每个房间以生成 3D 地图；通过配套移动应用标注拾取区和放置区；通过拍摄目标物品训练物体识别。之后可以配置定时例程（例如每晚从客厅收拾
              Legos）。机器人会自动回到底座充电，并在指定位置清空收纳箱。智能家居集成瞄准 Matter 协议、SmartThings 和 Apple
              HomeKit，从而与智能门锁、灯光和传感器协同。公司采用人类在环远程操作系统处理边界案例：当机器人遇到不熟悉的物体或情况时，操作员远程解决该案例，再通过 OTA 软件更新把解决方案推送到整个机队。截至 2026
              年 5
              月，公司没有披露商业发布日期、产量、定价或分销渠道。电气系统、机械设计、仿真、固件和数据基础设施等开放工程岗位显示，公司仍在进行积极的量产前硬件开发。路线图完全由公司私下掌握；基于融资阶段以及没有任何公开真实世界性能数据，技术成熟度被评估为早期
              TRL 4–5（实验室演示、试点前部署）。
