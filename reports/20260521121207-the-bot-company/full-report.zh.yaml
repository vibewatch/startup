  - id: FV001
    title: 推荐逻辑：从市场、证据、风险和估值到建议的证据链
    type: flow
    layout: wide
    summary: 逻辑链从四个主要输入维度——市场机会、产品验证、风险评估和估值背景——经由中间判断走向最终建议。所有节点权重均为定性判断。
    data:
      nodes:
        - id: market
          label: |-
            市场机会
            2035 年 TAM $85B
            CAGR 19–25%
            空白市场确认
          type: input
        - id: proof
          label: |-
            产品验证
            为零：无演示、无发布
            无基准、无客户
            Sim-to-real 未量化
          type: risk
        - id: risk_level
          label: |-
            风险评估
            高——创始人风险阴影
            中国 OEM 威胁
            iRobot 先例
          type: risk
        - id: valuation
          label: |-
            估值背景
            $2B 已确认
            $4B+ Bloomberg（未确认）
            可比公司：同业区间 $2B–$39B
          type: process
        - id: thesis_support
          label: |-
            投资逻辑支撑
            行业顺风强劲
            融资渠道已验证
            团队履历扎实
          type: process
        - id: thesis_gap
          label: |-
            投资逻辑缺口
            无运营证据
            无供应链
            无分销
          type: risk
        - id: entry_discipline
          label: |-
            入场纪律
            $2B：长期仓位可持有
            $4B+：待里程碑
            兑现前暂缓
          type: process
        - id: recommendation
          label: |-
            建议
            有条件持有 /
            继续研究
            信心：中低
          type: output
      edges:
        - from: market
          to: thesis_support
          label: TAM 支撑
        - from: proof
          to: thesis_gap
          label: 证据为零
        - from: risk_level
          to: thesis_gap
          label: 放大下行
        - from: valuation
          to: entry_discipline
          label: 期权已计价
        - from: thesis_support
          to: entry_discipline
          label: 支撑 $2B
        - from: thesis_gap
          to: entry_discipline
          label: 阻断 $4B+
        - from: entry_discipline
          to: recommendation
          label: 有条件持有
    approximationNotes: 逻辑链为定性判断。节点权重未经实证校准。该流程反映分析师基于截至 2026 年 5 月可得证据作出的判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
  - id: FV002
    title: 估值敏感性：不同收入和倍数假设下的 TBC 隐含价值
    type: bar
    layout: wide
    summary: >-
      TBC 隐含股权价值对 2029 年收入（悲观 / 基准 / 乐观）与 EV/revenue 倍数（成熟硬件：2x；成长硬件：5x；AI 平台：10x；行业龙头：20x）组合的敏感性。图中给出要支撑 $2B 和 $4B+
      入场估值所需的收入与倍数条件。所有数值均为示意性估计。
    data:
      items:
        - label: 悲观收入 $30M × 成熟硬件 2x
          value: 60
          unit: $M implied EV
          detail: 深度下行：商业化失败，按商品化价格定价
        - label: 悲观收入 $30M × 成长硬件 5x
          value: 150
          unit: $M implied EV
          detail: 悲观收入叠加成长溢价；仍不到 $2B 入场估值的 10%
        - label: 基准收入 $75M × 成熟硬件 2x
          value: 150
          unit: $M implied EV
          detail: 基准收入按 Ecovacs 可比倍数计；以 $2B 入场会严重亏损
        - label: 基准收入 $75M × 成长硬件 5x
          value: 375
          unit: $M implied EV
          detail: 基准收入叠加成长溢价；以 $2B 入场亏损 80%
        - label: 基准收入 $150M × 成长硬件 5x
          value: 750
          unit: $M implied EV
          detail: 乐观基准；以 $2B 入场仍亏损 60%；以 $4B+ 入场亏损 80%
        - label: 乐观收入 $200M × 成长硬件 5x
          value: 1000
          unit: $M implied EV
          detail: 乐观收入按成长倍数计；以 $2B 入场亏损 50%
        - label: 乐观收入 $200M × AI 平台 10x
          value: 2000
          unit: $M implied EV
          detail: 以 $2B 入场打平；以 $4B+ 入场亏损 50%
        - label: 乐观收入 $300M × AI 平台 10x
          value: 3000
          unit: $M implied EV
          detail: 以 $2B 入场收益 50%；以 $4B+ 入场亏损 25%
        - label: 超乐观收入 $400M × 行业龙头 20x
          value: 8000
          unit: $M implied EV
          detail: 以 $2B 入场 4x；以 $4B+ 入场 2x——最低可接受回报门槛
    approximationNotes: 收入估计来自情景推演，并非公司披露。倍数取自可比私募轮区间和 Ecovacs 公开市场可比公司。未做折现。数值仅用于示意性敏感性分析，不应作为点估计使用。
    claimRefs:
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值与回报区间：乐观 / 基准 / 悲观退出结果及入场价格背景
    type: range
    layout: wide
    summary: The Bot Company 三种情景下由低到高的退出估值和回报估计，并列示 $2B 与 $4B+ 入场估值作为背景。回报为总回报（费用前、carry 前）。所有数值均为估计；没有运营证据支撑点预测。
    data:
      items:
        - label: 悲观——退出估值
          low: 200
          mid: 350
          high: 500
          unit: $M
          detail: 人才收购或低价融资；优先股持有人部分回收；普通股接近归零
        - label: 基准——退出估值
          low: 250
          mid: 500
          high: 800
          unit: $M
          detail: 小规模商业发布、牵引力有限；按收入 5–8x 退出
        - label: 乐观——退出估值
          low: 2000
          mid: 4000
          high: 8000
          unit: $M
          detail: 战略收购或平台倍数；按收入 10–20x 退出
        - label: $2B 入场总回报（悲观）
          low: 0.1
          mid: 0.175
          high: 0.25
          unit: x MOIC
          detail: 优先权瀑布后资本近乎全损；普通股股东归零
        - label: $2B 入场总回报（基准）
          low: 0.125
          mid: 0.25
          high: 0.4
          unit: x MOIC
          detail: 资本大幅亏损；已投资本亏损 60–88%
        - label: $2B 入场总回报（乐观）
          low: 1
          mid: 2
          high: 4
          unit: x MOIC
          detail: 1–4x；若持有 5 年以上尚可；取决于退出时点和结构
        - label: $4B+ 入场总回报（悲观）
          low: 0.05
          mid: 0.09
          high: 0.125
          unit: x MOIC
          detail: 近乎全损；早期投资人的优先股堆叠吃掉所有退出收益
        - label: $4B+ 入场总回报（基准）
          low: 0.06
          mid: 0.125
          high: 0.2
          unit: x MOIC
          detail: 即便基准情景也近乎全损；仅保住本金也需要乐观执行
        - label: $4B+ 入场总回报（乐观）
          low: 0.5
          mid: 1
          high: 2
          unit: x MOIC
          detail: 乐观情景下最高 2x；对硬件创业公司来说风险调整后回报不足
    approximationNotes: 所有回报数字均为总额、无杠杆估计，基于情景估值模型和示意性优先权瀑布假设（全部优先股堆叠为 1x 非参与型优先股）。实际回报取决于具体优先权条款、反稀释条款和退出结构。区间很宽，反映无收入硬件估值内在的真实不确定性。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
  - id: FV004
    title: 投资 KPI：面向 IC 的七维评分
    type: kpi
    layout: standard
    summary: 截至 2026 年 5 月，面向投委会对 The Bot Company 七个评估维度的评分。分数为定性评估，未经实证校准。
    data:
      items:
        - label: 市场机会
          value: High (8/10)
          detail: 2035 年 TAM $85B；空白市场已确认；人口结构和 AI 顺风强劲
        - label: 产品 / 技术验证
          value: Very Low (2/10)
          detail: 为零：无商业产品、无演示基准、未披露操作成功率
        - label: 竞争护城河
          value: Nascent (3/10)
          detail: 先发位置；LLM 集成；但未披露数据飞轮、分销或 IP 专利
        - label: 单位经济
          value: Unknown (1/10)
          detail: 未披露 BOM，未确认定价，未指明制造伙伴；所有估计均为基准参照
        - label: 团队 / 执行风险
          value: Mixed (5/10)
          detail: Vogt/Jain 履历强；Cruise 事件持续构成阴影；关键人集中度高
        - label: 估值 / 入场风险
          value: High Risk (3/10)
          detail: 相比可比公司，$2B 尚可辩护；$4B+ 需要尚未达成的里程碑；下行是全损
        - label: 证据质量
          value: Low (3/10)
          detail: 唯一公开证据是股权结构、团队背景和行业背景；所有产品与经济性均为估计
    approximationNotes: 评分是截至 2026 年 5 月的分析师评估，未经实证验证。市场机会 8/10 反映多家市场研究机构给出的 TAM 证据强度；其他分数均受限于公司未披露运营数据。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
