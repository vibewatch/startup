      - number: '1.7'
        title: 展示项
        blocks:
          - type: callout
            title: 顶级创始人履历，且具备可直接迁移的自动驾驶经验
            body: >
              Kyle Vogt 联合创立 Cruise（GM 约 $1B 收购）和 Twitch（Amazon 以 $970M 收购），给了他两次大型退出和深厚领域可信度。Paril Jain 曾领导 Tesla
              Autopilot AI 团队，意味着创始团队直接构建并交付过家用机器人所需的核心感知和导航技术。这一技术底座明显强于多数消费机器人创业公司。
