  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 的投资逻辑建立在三根支柱上：（1）在 $14.7 billion 全球家用机器人市场中最缺供给的细分领域，具备真正先发位置——一款非人形、由 LLM
              控制、能执行多任务家务、消费者价格低于 $3,000 的机器人，且尚无商业竞争对手出货；（2）创始团队在自主系统方面有直接先验可信度，而这正是产品最稀缺的技术输入（Kyle Vogt/Cruise、Paril
              Jain/Tesla AI、Luke Holoubek/Cruise）；（3）资本储备充足（已确认 $302 million，潜在 $552
              million），可支撑公司穿过资本密集的硬件商业化阶段。在这个行业中，最低竞争门槛已经抬升到 $1 billion+ 轮次。

              反向逻辑同样是结构性的：截至报告日，公司产品未发布、尚无收入；没有披露产品发布日期，没有消费者需求验证，没有公开的操作可靠性基准，也没有确认供应链。零运营指标下 $2 billion
              估值，意味着投资者几乎完全在为期权买单——押注 TBC 能在一个没有任何西方公司实现主流规模的品类里成功商业化，同时还要对抗拥有制造优势的中国 OEM 既有玩家；这些玩家已经在 December 2025
              把拥有二十年品牌资产和数百万台出货量的 iRobot 打到 Chapter 11。创始人 Kyle Vogt 因 Cruise 行人事件和 DOJ 延期起诉协议背负重大声誉压力；如果 TBC
              发生任何安全事件，监管敏感性和媒体风险都会被放大。$4 billion+ 的目标估值，意味着一家产品未发布公司在约 18 months 内估值上调 133
              percent，要求其在多年期、资本密集的技术项目上执行极其精准。

              建议：**$4B+ 进入价下条件性持有 / 继续研究；若已在 $2B 参与，则在产品证据明确时继续跟踪。** $4 billion
              或以上估值下，若没有产品演示、公开的操作基准、足以支撑制造规模化的资本充足性确认，以及 Bloomberg 轮是否完成的清晰答案，不建议进入。已参与 $2 billion Greenoaks
              轮、且有长期机器人敞口授权的投资者，应持有并在追加前要求里程碑证据。新投资者若以 $4 billion 进入，只是相对已确认的 $2 billion 锚点守住价值，也至少需要 2x 回报路径；只有 TBC
              被收购或实现有收入的产品发布，这一路径才可能成立。商业化失败或被迫下轮降价融资时，下行就是资本全损，这与 iRobot 先例一致。置信度：中低。风险评级：高。
