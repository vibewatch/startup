      - number: '8.5'
        title: 稀释、退出就绪度与优先权压力
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 的资本结构带有优先权压力，会实质影响除最优先优先股持有人之外所有投资者的回报计算。已确认的 $302 million 资本全部为风险股权，Greenoaks 领投 $2
              billion 轮。2025 年末这类轮次的标准风险优先股条款，通常包含 1x 非参与清算优先权，即任何退出中，优先股投资者先于普通股股东拿回投资本金。按 $302 million 已投资资本计算，若以
              $400–500 million 退出，清算瀑布会先把本金返还给优先股持有人，普通股股东（创始人、员工）几乎没有或完全没有剩余。种子轮的 42 名投资者进一步复杂化分配瀑布。

              如果 Bloomberg 轮（按 $4B+ 估值融资 $250 million）已经完成，较高估值使早期投资者的入场价稀释有限，但额外 $250 million 优先权层把普通股股东参与分配前的最低退出门槛抬到约
              $552 million。这意味着，$1 billion 退出会让种子投资者大约拿回每 1 美元中的 80 美分（通过优先权 + 参与分配），普通股可能更低。$4 billion 退出对 Bloomberg
              轮投资者约为 1x，对 $2 billion 轮投资者约为 2x——考虑到高风险硬件创业公司需要 5 年以上持有，这不是出色回报。

              2030–2032 年窗口的退出路径包括：（1）被大型消费科技或家用设备公司（Amazon、Google、Samsung、Apple）战略收购，用以获得机器人 AI
              平台和车队数据集；（2）被大型中国消费电子制造商收购，用以获得西方分销和 AI 差异化；（3）如果 TBC 达到收入规模且物理 AI IPO 窗口打开，则公开上市。2025–2026 年 M&A
              环境显示，战略买家对 AI 硬件资产兴趣强烈，AI M&A 在 2025 年按价值约占科技 M&A 的 50 percent，全球 M&A 交易价值超过 $4.9 trillion。TBC
              没有披露战略企业投资者，意味着没有内置买家提前为收购卡位——相较同行（如 Apptronik/Google、Agility Robotics/Amazon、Fourier/SoftBank）是一个风险。

              截至报告日，IPO 就绪度为零：没有收入、没有客户数、没有公开产品发布，也没有验证过的单机经济性。即便在乐观情景下，TBC 最早也要到 2029–2031 年才可能 IPO。Q1 2026 美国 IPO
              市场放缓（全球 21 家估值超过 $1 billion 的风投支持公司退出，其中只有 4 家来自美国），进一步说明硬件依赖型 IPO 逻辑的时间不确定性。
            claimRefs:
