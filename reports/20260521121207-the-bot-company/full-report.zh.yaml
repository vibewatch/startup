  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 目标客户分层来自定位推断，而非已验证部署
        blocks:
          - type: paragraph
            body: >-
              The Bot Company
              在其公开网站上提出了一条清晰客户逻辑：正在打造“给每个家庭一个有用的机器人”。这句话指向广泛的消费家庭市场，而不是任何垂直企业细分。二级报道和投资者材料把主要意向买家描述为有孩子和宠物的双收入家庭——这个群体家务密度高、有可支配收入购买高端硬件，也已经表现出采用扫地机器人等自动化家电的意愿。公司报道中还提到两个子细分：希望提高房客交接效率的短租（STR）运营商，以及可从日常物理协助中受益的养老护理家庭或服务商。部分报道还偶尔提到小办公室。这些细分没有任何一个得到公司用具名客户、商业协议或试点公告确认。

              家庭机器人市场为机会规模提供了背景。全球家庭机器人市场在 2024 年价值约 $8.65 billion，预计到 2034 年达到 $20.88 billion，CAGR 为
              13.8%（IntelMarketResearch，2025）。相邻的住宅扫地机器人市场在 2024 年价值 $3.01 billion，预计 2025 年达到 $3.19 billion，并在 2034
              年增长到 $5.51 billion，CAGR 为 6.25%（GlobalGrowthInsights，2025）。这些数字确认，消费家庭自动化类别已经由更简单的单一用途设备驱动并形成规模收入；The Bot
              Company 打算用通用操作平台延展的正是这个类别。扫地机器人子市场也是最清晰的需求代理，代表以家务为先的消费者——也正是 The Bot Company 瞄准的画像。

              双收入家庭对扫地机器人的采用率很高：估计 74% 的双收入家庭已经采用扫地机器人，61% 将节省时间列为主要动机。更广义上，66% 的新扫地机器人型号已经支持智能家居生态，65%
              的受访美国消费者偏好支持语音指令的设备（GlobalGrowthInsights，2025）。这些信号确认，公司描述的主要买家画像——忙碌、熟悉科技、双收入家庭——已经是低价位自动化家电的已验证采用者。这些家庭是否会向上购买更贵、能力更强的通用机器人，是关键的未验证需求假设。
