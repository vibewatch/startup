          - type: callout
            title: 物理 AI 行业顺风真实存在，但会造成估值扭曲
            body: >-
              Q1 2026 是全球 VC 的纪录季度（部署 $300B，其中 $242B 投向 AI），机器人占比达到历史高位。Figure AI 的 $39B 和 Skild AI 的 $14B 说明，尚无收入的物理 AI
              公司可以靠叙事维持极高私募估值。TBC 受益于这股顺风，但顺风也会反转：如果物理 AI 融资热降温，TBC 的 $4B+ 目标估值将面对倍数压缩风险，类似 2022 年 SaaS
              倍数压缩，当时收入倍数中位数较峰值下降 60–70%。
