      - number: '4.4'
        title: 财务可比公司与基准
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，The Bot Company 的财务画像是：产品发布前、收入前、累计融资约 $302 million、估值 $2
              billion。这让它处在一个很小的类别里：资本极充足、但尚未商业化的硬件 AI 公司。没有完全一致的可比公司，但以下案例能提供有用框架。


              Figure AI 是一家人形机器人公司，多轮融资累计达到 $675 million 或更多；截至 2025 年 9 月估值达到 $39 billion——同样尚未面向消费者商业化，但已在 BMW
              有早期工业部署。Figure AI 的资本形成轨迹说明，大型 AI 机器人公司即便没有消费者收入，也能凭工业部署交易和投资者信念维持很高估值。TBC 在原型前阶段拿到 $2 billion 估值，相比
              Figure AI 的可比里程碑更激进；但 TBC 的创始人履历（Cruise、Twitch）和更小团队使比较并不完全对称。


              iRobot 是最相关的消费硬件机器人先例；其收入在 2024 年达到 $682 million 峰值，毛利率约 30–40%，随后于 2025 年 12 月申请 Chapter 11 破产。iRobot
              的失败揭示了 TBC 的两项关键财务风险：（1）即便收入规模可观，硬件机器人毛利率也结构性偏薄，容易受投入成本压力和竞争性降价冲击；（2）单一品类定义型产品（Roomba）无法在制造经济性更强的中国 OEM
              进入市场后，保护硬件公司免受毛利压缩。CNBC 指出，iRobot 破产“可能毁掉的不只是一家扫地机器人制造商”，明确提示相邻消费机器人公司的传染风险。这是对 TBC 资本强度逻辑最不利的可比案例。


              硬件 AI 创业公司的烧钱速度基准显示，种子阶段每月约 $100,000–$500,000，增长阶段升至每月 $1 million 或更多。TBC 据报道约有 83
              名员工，并在进行活跃硬件原型开发，月度烧钱速度很可能在 $2 million 到 $4 million 之间——高于增长阶段中位数，因为它同时承担硬件工程和 AI 基础设施两个成本中心。这与 Greenoaks
              的投资策略一致：该机构愿意支持“定义一代”的公司，容忍长期收入前阶段，押注品类最终形成赢家拿走大部分价值的格局，足以覆盖资本强度。


              Roborock 的公开财务数据（香港上市）显示，一家高端消费机器人公司在规模化且垂直整合制造后，可以达到 35–45% 毛利率。这代表 TBC
              可以追求的目标毛利路径，但只有经过数年生产规模化和供应链优化后才可能实现。
