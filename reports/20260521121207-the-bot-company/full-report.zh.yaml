chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              The Bot Company 总部位于美国加州旧金山，是一家 2024 年注册成立、使用 bot.co
              域名运营的早期机器人创业公司。公司公开使命是为每个家庭打造有用的机器人——具体是能处理日常家务的非人形机器人，例如拾取物体、整理空间和完成清洁任务。它因此清晰落在消费级家庭机器人赛道内；该市场 2025
              年估计约为 $14.7 billion，预计到 2035 年将以约 19% 的 CAGR 增长，届时可能达到 $85 billion。


              公司正在设计一款非人形移动机器人，形态类似低矮轮式平台，配备 4 自由度机械臂、可更换末端执行器（双指夹爪、真空吸头、超细纤维擦拭器）、摄像头和 LiDAR
              传感器。机器人使用在端侧和云端运行的大语言模型接收用户自然语言指令。截至报告日，公司尚未推出商业产品，也没有披露收入。计划商业模式把前置硬件销售与经常性软件订阅费结合起来，目标客户是有孩子和宠物的双职工家庭，也覆盖短租运营商、养老护理服务商和小型办公室等次级市场。截至
              2026 年 5 月，公司官网列出的支持者包括 Greenoaks、NFDG、Spark、Eclipse、Kleiner Perkins 和 Y Combinator，说明投资人组合较 2025
              年初名单已明显扩展。
            claimRefs:
              - CO001
