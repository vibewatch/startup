  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类
        blocks:
          - type: paragraph
            body: >
              家庭机器人市场涵盖为在住宅内外自主执行家务而设计的机电设备。按分析师共识，该市场分为地面清洁机器人（扫地和拖地机器人，2025 年收入占比约
              48%，是最大细分）、户外维护机器人（割草机、泳池清洁机，是增长最快的子类）、陪伴与老人辅助机器人，以及安防或监控机器人。市场明确排除工业服务机器人、仓库或办公室使用的商业地面洗地机器人、作为 class-II
              或 class-III 医疗设备监管的医疗辅助设备，以及面向商业规模通用操作任务的双足人形机器人（这是一个独立且更早期的品类）。


              相邻支出池有重叠，但单独衡量。智能家居市场——覆盖联网温控器、语音助手、智能音箱、安防摄像头和家庭自动化基础设施——2025–2026 年全球估计为
              $133–182B。接入智能家居生态的家庭机器人（语音控制清洁机器人、连接 Google Home 或 Amazon Alexa
              的扫地机器人）同时参与两个市场。美国家庭每年在家庭服务上的支出——清洁、庭院工作和家居维护劳务——平均约为每户每年 $600–$800，这代表高端家用机器人作为人力替代品最终要竞争的预算池。


              The Bot Company 的投资逻辑落在一个当前任何分析师报告都尚未清晰切出的子赛道：一个多功能、非人形 AI
              平台，可通过自然语言指令执行多种家务。现有市场报告会把所有清洁机器人放在一起，不区分功能宽度；这明显低估了平台型产品的高端可服务机会，同时也掩盖了一个事实：在足以支撑 The Bot Company
              硬件开发成本的价格点上，消费者需求尚未被验证。


              预期产品的现状替代品包括：（1）现有单功能扫地机器人（iRobot
              Roomba、Roborock、Ecovacs）用于地面清洁；（2）每周或隔周聘用的家庭清洁服务；（3）面向特定任务的专用小家电解决方案（蒸汽拖把、玻璃刮、洗碗机）；以及（4）个人时间投入。每类替代品都在成本、信任和任务覆盖上竞争，The
              Bot Company 的产品必须同时在价值上击败四者，才可能实现广泛采用。
            claimRefs:
