      - number: '7.6'
        title: 竞争与市场采用风险
        blocks:
          - type: paragraph
            body: >-
              家用机器人市场竞争正在加剧。中国 OEM——Roborock、Dreame、Ecovacs 和
              DJI——已经证明，它们能靠激进的生产规模，把机器人感知、导航和操作能力商品化到消费者价格点。这些公司用价格更低、功能相当或更强的产品摧毁了 iRobot 的毛利结构，并且正在扩展到操作和通用任务。The Bot
              Company 的非人形设计带来一些差异化，但核心部件（LiDAR、摄像头、执行器）来自同一批支撑竞争对手的亚洲供应链。

              消费者接受门槛已有记录，而且很高。Humanoids Daily 的 2025
              年调研发现，消费者对家用机器人最常见的担忧包括隐私、财产损坏、行为不可预测和高成本。调研数据表明，消费者对家用机器人有兴趣，但不愿支付溢价——这正是摧毁 iRobot 高端品牌定位的定价动态。在估计
              $1,000–$3,000+ 的目标价格下，The Bot Company 面对陡峭的消费者教育和付费意愿障碍，而且没有既有品牌资产。

              人形机器人竞争对手——Figure AI（截至 September 2025 估值 $3.9 billion）、1X Technologies（Neo 家用人形机器人）以及 Samsung 的 Ballie（集成
              Gemini，计划 June 2025 发布）——也在瞄准家庭场景。Samsung 带来全球零售关系、成熟智能家居生态集成和消费者品牌信任，而这些都需要 The Bot Company
              从零建立。公司进入的市场刚刚看到最成熟品牌申请破产，同时 Silicon Valley 和亚洲资金充足的竞争者已经入场。
            claimRefs:
              - CR044
              - CR045
              - CR046
              - CR047
      - number: '7.7'
        title: 合作伙伴、供应商与依赖风险
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 的依赖图跨越四个关键节点：云端 AI 基础设施、精密执行器供应、合同制造和资本提供方。云端 AI 方面，公司的 LLM
              自然语言指令系统依赖模型提供商（基于投资者网络和工程师背景，最可能是 OpenAI、Google 或
              Anthropic）。任何定价变化、模型废弃或服务条款修改，都会成为重大运营风险，因为产品的核心智能依赖云端。工程招聘启事提到端侧模型能力，但公司没有公开描述任何备用架构。

              精密执行器采购是近期最尖锐的供应链风险。执行器交期在 2026 年达到 14 months，产能由亚洲生产商主导。没有既有规模的创业公司议价地位最弱；大型 OEM 拥有优先分配权。缺少已披露的供货协议时，The
              Bot Company 在试图从原型走向试点生产的时点，可能面临跨多个季度的生产延误。Schaeffler 的一体化执行器公告说明供应正在商品化，但尚未达到创业公司可轻松获取的规模。

              资本提供方集中是结构性风险：两轮融资都依赖小型财团，且公司没有公开披露独立董事或投资者权利结构。没有具名战略企业投资者（消费电子
              OEM、零售商或家政服务公司），意味着公司缺少内置分销渠道或退出收购方关系。公司的整张依赖图——云端 AI、执行器、合同制造、云计算、零售分销——均未披露，构成阻断级尽调缺口。
