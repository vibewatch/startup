      - number: '8.2'
        title: 融资历史、估值语境与资本结构
        blocks:
          - type: paragraph
            body: >-
              The Bot Company 已确认的融资路径为：May 2024 的 $150 million 种子轮，投后估值 $550 million（Botco, Inc. 于 May 21, 2024 提交的 SEC
              Form D，CIK 0002024013，记录依据 Rule 506 以股权融资 $150,669,884，42 名投资者）；March 2025 的 $150 million 后续融资，投后估值 $2
              billion，由 Greenoaks Capital 领投。Bloomberg 在 October 2025 报道称，TBC 正寻求按超过 $4 billion 估值融资 $250 million。截至 May
              2026，没有发现确认 Bloomberg 轮已完成的 SEC Form D 修订或媒体佐证。已确认总资本：$302 million。若 Bloomberg 轮已完成，潜在总资本最高可达 $552
              million。

              估值上调路径为：种子轮（$550M 投后，May 2024）→ Series B（$2B 投后，March 2025，10 months 内 3.6x）→ Bloomberg 轮目标（$4B+，October
              2025，7 months 内 2x+）。一家产品未发布公司在约 18 months 内隐含估值累计上升 7x，没有任何运营指标支撑；驱动力完全来自行业顺风、创始人履历和投资者对机器人资产的竞争。这与
              2025–2026 年物理 AI 资本环境一致：Figure AI（$39B）和 Apptronik（$5B）等尚无收入公司拿到的倍数，远高于任何基于收入的锚点。

              资本结构存在重大不确定性：（a）Bloomberg 轮状态未确认，使总融资额和烧钱路径存在模糊；（b）公开信息中没有披露股权结构表、具名反稀释条款或清算优先权条款；（c）Greenoaks
              的领投位置意味着治理集中，且很可能有 1x 或更高的清算优先权，会在任何低于 $2 billion
              水位线的退出中先于普通股股东受偿。公司网站列出六家投资者（Greenoaks、NFDG、Spark、Eclipse、Kleiner Perkins、Y Combinator），SEC Form D 记录种子轮有
              42 名投资者，说明财团较宽；在下轮降价融资场景下，这会造成复杂的优先权压力。

              没有披露任何债务、可转债或风险债，使资本结构更简单；但如果 Bloomberg 轮没有完成，公司截至 May 2026 的现金位置完全取决于已确认 $302 million 基础上的烧钱速度。按估计每月 $3–5
              million 烧钱，TBC 自 March 2025 交割起大约有 5–8 years 的制造前现金跑道——足以走到原型商业化，但不足以在没有额外资本的情况下支撑完整制造规模化。
