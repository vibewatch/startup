            title: 零客户证据是本章最核心的尽调缺口
            body: >-
              截至 May 2026，The Bot Company 已按 $2 billion 估值融资 $302
              million，却没有公开披露一个客户、试点或家庭部署。所有客户章节指标——采用、留存、扩张、渠道牵引、WTP
              验证——均为空。投资者买的是市场逻辑和团队，而不是已经验证的商业模式。对一家产品未发布的消费硬件创业公司来说，这在结构上正常；但融资规模已经到这个水平，连私下客户验证都没有，仍然值得注意。
            calloutType: risk
            claimRefs:
              - CU040
              - CU041
