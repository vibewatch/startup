      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              现阶段无法对 The Bot Company 做基本面估值——无论是 DCF、EV/revenue，还是 EV/EBITDA 倍数——因为公司收入为零、EBITDA
              为零、确认客户为零、产品出货为零。方法论上合适的框架只有三类：（1）物理 AI / 机器人行业的私募轮次可比；（2）基于里程碑的期权价值分析；（3）成熟阶段家用机器人上市公司的公开市场可比，作为上限 /
              下限参照。鉴于 TBC 与任何可得可比公司在阶段和商业模式上差异极大，下方所有比较都只能作为方向性信号，而不是估值锚点。

              私募轮次可比集的上沿是 Figure AI 的 $39 billion Series C（September 2025），约为 TBC 已确认 $2 billion 估值的
              20x；这是一个由工业部署证据、Microsoft/OpenAI/Nvidia 战略背书，以及每小时一台的制造能力推动的离群值。Apptronik（February 2026 投后 $5 billion+）与
              TBC 更直接可比：这是一家尚无商业化收入的人形机器人创业公司，已有 Mercedes-Benz 和 GXO Logistics 试点，总融资 $935 million，估值 $5 billion。按 $2
              billion 估值，TBC 相对 Apptronik 折价 60 percent，但没有试点证据——这意味着 TBC 必须交付产品演示，才能证明估值平价合理。Skild AI 的 $14 billion
              估值（January 2026）是软件 / 基础模型可比，不是硬件，应大幅折价。Agility Robotics（March 2025，$2.12
              billion）是最接近的参照：一家有部分工业部署、尚未达到商业规模的人形机器人创业公司，由 Amazon 和 SoftBank 支持，估值 $2 billion——方向上验证 TBC 的 $2 billion
              仍落在这一阶段资金充足机器人创业公司的合理私募定价区间内。

              公开市场可比提供上限 / 下限纪律：Ecovacs (SHA:603486) 是按收入计的全球 #2 家用机器人公司，TTM 收入 $2.8 billion、毛利率 47.8%、净利率 8.4%；截至 May
              21, 2026，其 EV/revenue 倍数为 1.71x。按这一倍数，如果 TBC 已有 $300 million 硬件加订阅收入，其价值约为 $513 million——只是当前私募估值的一小部分。TBC
              私募估值与成熟公开市场可比倍数之间的差距，只能由私募轮价格内嵌的尚无收入溢价解释：投资者在为 TBC 达到并超过成熟玩家收入规模的概率加权期权买单。任何投资决策都必须把这个期权价值计算摆到台面上。
