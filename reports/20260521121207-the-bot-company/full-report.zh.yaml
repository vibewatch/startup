          - type: callout
            title: 产品前风险 — 没有已展示机器人、没有收入、没有客户
            body: >
              截至 2026 年 5 月，The Bot Company
              从未公开展示过可工作的商业机器人，也没有点名客户或披露任何收入。公司整个估值都建立在创始人履历、资本承诺和家庭机器人品类承诺之上。即使拥有强融资和强团队，硬件创业公司失败率也一直很高。近期最关键里程碑，是公开产品演示或试点部署。
