      - number: '1.4'
        title: 快照指标与规模
        blocks:
          - type: paragraph
            body: >
              作为一家尚未推出产品的私营公司，The Bot Company 不公开披露财务或运营指标；可验证数据的缺口，正是其尽调画像的决定性特征。截至 2025 年 3 月，累计融资已确认约 $302
              million，至少经过两轮；投资人名单暗示 2025 年 3 月到报告日之间可能又融入更多资金。估值方面，2025 年 3 月 Greenoaks 领投轮已确认投后 $2 billion；Bloomberg
              报道的潜在后续轮 $4 billion+ 估值，截至 2026 年 5 月尚未确认。


              收入为零——公司明确处于产品前和收入前阶段，尚未商业化推出任何产品。员工数未公开披露；公司官网称其为位于 San Francisco 的「小团队」，投资人也称其为早期创业公司。2024
              年早期报道曾称其是「成立数月的公司」。到 2025 年 3 月融资时，公司运营约十个月。工程和 AI 人才来自 Tesla、Cruise、OpenAI、Google 和
              Pixar，说明即使团队规模不大，技术履历也很深。


              截至报告日，公司尚未公开披露客户、合作伙伴、试点或商业部署。机器人原型本身——被描述为咖啡桌高度的平台，配有 4-DOF
              机械臂——出现在二级研究摘要和数据库资料中，但公司尚未公开展示可工作的产品。现阶段对投资人最重要的指标，是创始团队履历、资本形成速度和估值轨迹；三者都非常正面。客户、收入、员工数和产品数据缺口符合公司所处阶段，不应被解读为隐瞒，而是发布前姿态。
