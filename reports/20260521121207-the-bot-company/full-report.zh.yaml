      - number: '3.4'
        title: 竞争比较与定位
        blocks:
          - type: paragraph
            body: >
              The Bot Company 相对当前所有竞争对手主张的核心差异化，在于几件事叠在一起：（a）非人形形态，成本更低、家用环境更安全、认证更容易；（b）LLM
              接口接受自然语言指令，支撑多任务能力；（c）面向消费者的定价目标为 $1,500–$3,000；（d）聚焦家务自动化——捡拾物品、清洁表面、整理空间——现有玩家还没有规模化覆盖。


              截至 2026 年 5
              月，还没有商业化竞争对手占住这个位置。单一功能的既有玩家（Roborock、Ecovacs）只处理地面。相邻平台（Astro、Ballie）不能操作实体物品。人形机器人竞争者（Figure、1X、Optimus）售价在
              $20,000+，主要部署在工业或研究场景。Hello Robot Stretch 是 $25,000+ 的研究平台，不是消费级产品。The Bot Company 提出的 $2,000 ASP 大约比 1X
              NEO 低 10x，比 Stretch 4 低 12x。价格纪律是其竞争逻辑的关键——但硬件单体经济模型还没有验证过这一点。


              在 The Bot Company
              预期价格下，多用途家用机器人的关键购买标准包括：物理任务覆盖广度（能完成的家务数量和多样性）；儿童和宠物环境下的安全认证；自然语言界面是否易用；与现有智能家居平台（Alexa、Google
              Home）的集成；以及通过软件更新和数据驱动改进带来的持续价值。现有扫地机器人在成本和已验证可靠性上有优势，但任务广度和自然语言能力弱。人形平台在理论上的任务广度更强，但在消费级定价和家庭安全上落地较弱。


              分销能力是 The Bot Company 的结构性风险。Roborock 和 Ecovacs 在 Amazon 市场、Best Buy 货架和 DTC
              渠道上都有主导地位，这些渠道花了多年才建起来。中国制造商可以通过成熟数字和零售渠道触达美国家庭，获客成本远低于创业公司。如果中国 OEM 把 AI 路线图（例如 Roborock 的 RRMind
              GPT）延伸到操作能力，它们可能带着成本和渠道优势切入 The Bot Company 的细分市场，而这种优势很难抵消。
