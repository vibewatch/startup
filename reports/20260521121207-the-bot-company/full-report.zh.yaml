      - number: '1.6'
        title: 不利背景 — Cruise 事件与 Vogt 辞职
        blocks:
          - type: paragraph
            body: >
              对 The Bot Company 的任何尽调，都必须彻底审视 Kyle Vogt 离开 Cruise 的经过，因为它构成重要的不利背景因素。2023 年 10 月 2 日，旧金山一辆 Cruise
              robotaxi 在一名行人先被人类驾驶车辆撞倒后，又撞到并拖行该行人约 20 feet。加州机动车管理局随后暂停 Cruise 的自动驾驶车辆部署和无人驾驶测试许可。DMV 的书面暂停令指称 Cruise 对其
              robotaxi 安全性作出「误导性陈述」，并称公司未向监管方提供车辆在初次碰撞后继续移动的画面，尤其是行人仍在车底时车辆执行靠边动作的部分。Cruise 对这些说法提出异议。


              Vogt 于 2023 年 11 月 19 日辞任 Cruise CEO，距离 10 月 2 日事件约六周。在辞职声明中，他承认事件严重性，并呼吁重新聚焦安全和透明度。General Motors 随后在
              2024 年完全停止为 Cruise 的 robotaxi 开发提供资金。DMV 暂停许可、接近致命的事件、监管方关于误导陈述的指控，以及 GM 撤资，合在一起构成投资人应明确衡量的声誉和治理事件。


              尽调问题不在于 Vogt 是否对 10 月 2 日事故承担技术责任——行人先被人类驾驶车辆撞倒，而 Cruise 主张 robotaxi
              的靠边行为是一项安全协议——真正的问题是，监管方关于隐瞒画面的指控是否反映出 Vogt 的治理姿态。Vogt 已从成熟硅谷投资人处为 The Bot Company 募得 $302
              million；这些投资人大概率了解这段历史，他们参与投资说明其已评估并接受该风险。不过，任何潜在投资人都应独立尽调加州 DMV 记录、Vogt
              在事后响应中的直接参与程度，以及这些事实对一家将让硬件在消费者家中自主运行的公司意味着什么。
            claimRefs:
