  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2026 年的家庭家务机器人竞争格局，最好按四个结构层级理解。第一层是来自中国制造商的存量单功能清洁机器人——Roborock（全球市场份额 17.7%）、Ecovacs（14.3%）、Dreame 和
              Xiaomi——它们合计掌握全球清洁机器人市场 70–80%，并已让西方品牌在价格上结构性失去竞争力。iRobot 的崩塌就是这一竞争力量的强度样本：Amazon $1.7B 收购被监管阻止后，iRobot 于
              2025 年 12 月申请 Chapter 11 破产，资产转交给中国制造商 Shenzhen Picea Robotics。


              第二层是相邻家庭机器人平台：Amazon Astro（家庭监控和陪伴，邀请制，价格 $1,599）以及 Samsung Ballie（AI 陪伴和智能家居中枢，2025
              年夏季在美国和韩国发布）。它们围绕监控和环境 AI 定位，而不是物理家务自动化。两者都没有机械臂，也无法拾取、分类或清洁地面以外的实体物体。


              第三层是面向未来家庭部署的人形机器人创业公司：Figure AI（资金充足，估值 $39B，工业部署正在推进）、1X Technologies（NEO 人形机器人 2026 年初以 $20,000
              价格出货到首批家庭）和 Tesla Optimus（已在 Tesla 工厂生产，但尚未面向消费者销售）。这些平台是双足、昂贵，并且首先为商业或研究环境设计。Hello Robot 的 Stretch
              系列（非人形移动操作机器人）属于专门的第四层：研究平台，价格 $25,000–$30,000，远高于消费者门槛。


              真正的市场空白——一款商业化定价、非人形、多任务、LLM 驱动，并可供主流家庭使用的家务机器人——仍未被占据。The Bot Company 是明确瞄准这一空白且资本最充足的创业公司；截至 2025 年 3
              月已融资 $302M，估值 $2B，并据报道正在以 $4B+ 估值进行 $250M 融资。
