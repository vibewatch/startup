  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人背景、治理与声誉风险
        blocks:
          - type: paragraph
            body: >-
              Kyle Vogt 担任 Cruise CEO 的经历，以及他在 November 2023 辞职，是 The Bot Company 最重要的非技术风险因素。October 2, 2023，Cruise
              一辆旧金山自动驾驶出租车碾过一名已被人类驾驶车辆撞倒的行人，随后因为软件误分类执行靠边停车动作，把受害者拖行约 20 feet 后才停下。National Highway Traffic Safety
              Administration 发布同意令，要求 Cruise 支付 $1.5 million 民事罚款，原因是其未在强制 Standing General Order
              报告文件中完整披露事故后细节。California DMV 和 CPUC 暂停了 Cruise 的自动驾驶车辆许可，理由是向监管机构披露视频证据不完整且不及时。U.S. Department of
              Justice's Northern District of California 推进了延期起诉协议，Cruise 承认提交虚假报告，意在影响联邦调查，并支付 $500,000 刑事罚款。

              Vogt 在创立 The Bot Company 前五个月辞去 Cruise CEO 职务，也没有公开说明 Cruise
              事件会如何影响他新公司的安全文化或治理模型。公司尚未公开任命独立董事、安全顾问或审计委员会成员。Paril Jain (CTO) 和 Luke Holoubek 是联合创始人，但公开存在感较低；公司没有披露其他
              C-suite 高管。关键人物集中度很高：Vogt
              是公司唯一的公开面孔、主要融资人，也是唯一可见的技术权威。在家用机器人场景中，一旦出现安全或透明度失败——伤害事件、隐私泄露或监管违规——即便没有自动驾驶车辆语境，也可能触发与摧毁 Cruise
              类似的监管和媒体动态，而且可能在一个新闻周期内爆发。

              HumanoidLiability.com 对 Cruise
              延期起诉协议的分析指出，未向监管机构完整报告安全事故构成联邦刑事犯罪，而不仅是民事违规。这个先例适用于任何在消费者场景部署自主系统的公司。投资者必须独立核实，Vogt 是否在 Cruise
              和解中接受了个人合规条件，且这些条件是否可能延伸至 The Bot Company 的治理或运营——这一尽调问题在公开信息中仍未解决。
