      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              五个结构性驱动因素支撑家庭机器人市场到 2031 年实现 14–20% CAGR。第一，智能家居生态扩散：全球智能家居市场在 2025–2026 年已增长到 $133–182B，形成了庞大的语音控制、App
              连接家庭基础设施装机基础。到 2026 年，预计超过 65% 的新消费机器人会为智能家居生态集成而设计，从而降低在现有家庭配置中部署新机器人的摩擦。The Bot Company 所称的 LLM
              控制界面正好切中这一预期。


              第二，人口老龄化。日本、德国、韩国、意大利和美国的人口老龄化速度快于护理基础设施扩张。养老护理机器人需求预计到 2031 年以 16–17% CAGR 增长，快于整体家庭机器人市场。第三，传感器和算力成本下降：自
              2018 年以来，LiDAR、RGB-D 摄像头和边缘计算模块平均价格下降超过 30%，让三年前仍成本过高的 AI 功能密度进入中端硬件。这直接改善了高端但非奢侈产品的物料清单经济性。


              第四，也是与 The Bot Company 最直接相关的一点：通过 LLM 集成自然语言处理，代表机器人易用性出现质变。过去的家庭机器人需要基于 App 排程或按钮指令；LLM
              控制机器人可以响应「清理餐桌下面，把玩具放进收纳箱」这样的语音或文字指令。采用逻辑需要证明，这种易用性改善能让消费者在更高价格点上偏好它，而不是只会清洁的机器人。第五，双职工劳动力稀缺动态：当夫妻双方都工作、隐含时间价值为每小时
              $30–$100+ 时，一台 $2,000、每周节省五小时的机器人按此计算不到一年即可回本——这是一个有吸引力的 ROI 叙事，但尚未在多功能机器人消费者支付意愿调研中得到证实。
