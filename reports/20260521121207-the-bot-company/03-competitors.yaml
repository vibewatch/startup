callouts:
  - calloutType: risk
    title: "iRobot Precedent: Distribution Is Not a Moat Against Chinese Manufacturing Scale"
    body: >
      iRobot's December 2025 bankruptcy — despite Amazon's $1.7B rescue attempt, 20-year
      brand equity, and 42% US market share — illustrates that US household robot companies
      cannot sustain themselves against vertically integrated Chinese manufacturers on price.
      The Bot Company must establish a differentiated value proposition, consumer trust, and
      recurring revenue before Chinese OEMs extend their AI platforms to manipulation tasks.
    claimRefs: [CP002, CP003, CP004, CP036]
  - calloutType: insight
    title: "White Space Is Real but Time-Limited"
    body: >
      No commercial competitor as of May 2026 offers a multi-task, LLM-driven, non-humanoid
      home chore robot at a consumer price point. The Bot Company occupies genuine white space.
      However, Roborock's object-manipulation experiments and 1X's consumer subscription model
      indicate that this gap will attract well-resourced entrants within 3–5 years.
    claimRefs: [CP028, CP037, CP038]

