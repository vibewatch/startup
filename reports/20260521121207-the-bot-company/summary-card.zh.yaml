summary:
  headline: >-
    The Bot Company 有顶尖创始团队、异常强的融资能力和真实的家用机器人产品机会；但产品证据、收入和客户验证全都缺位，叠加已确认的 $2B 估值、Cruise 创始人责任尾部风险和深层 sim-to-real
    技术风险，只能在高风险、低信心下观察。
