company:
  name: "The Bot Company"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    The Bot Company is developing a non-humanoid, wheeled-base household robot with a robotic arm and
    interchangeable end-effectors, targeting mundane chore automation via LLM-driven natural language
    commands. The technical stack draws heavily on autonomous vehicle (AV) engineering expertise —
    whole-body control, world-model simulation, and 3D vision — but as of May 2026 the company
    remains pre-launch with no commercial product shipped and limited public disclosure of
    architecture specifics, manufacturing plans, or safety certifications.

sections:
  - id: product-overview-hardware
    title: "Product Architecture and Hardware Design"
    body: >-
      The Bot Company's core product is a non-humanoid household robot built around a wheeled mobile
      base, a single articulated robotic arm, and a set of interchangeable end-effectors. The
      deliberate choice to forgo a humanoid form reduces cost, complexity, and balance-control
      requirements while enabling the robot to operate stably in cluttered home environments.
      The reported form factor resembles a low coffee table on wheels, providing a low center of
      gravity and minimal tipping risk around children and pets. The arm can handle most household
      objects reported to be under approximately 1 kilogram, with interchangeable end-effectors
      including grasping grippers and suction-cup-style attachments for varied surface interactions.
      A 10-liter detachable bin collects gathered objects. Sensing is multi-modal: RGB cameras and
      LiDAR sensors generate continuous 3D point clouds for mapping and localization, directly
      mirroring the sensor fusion approach developed at Cruise for autonomous vehicles. Safety
      hardware includes soft bumpers, torque limits on the arm, and redundant proximity sensing.
      None of these design details have been formally published in a product spec sheet; all
      currently derive from company statements, investor coverage, and third-party analysis.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE028
    tableRefs:
      - TE001
    figureRefs:
      - FE001

  - id: ai-software-stack
    title: "AI and Software Stack"
    body: >-
      The intelligence layer is built around large language models (LLMs) that interpret natural
      language voice commands — for example, "put the Legos in the blue bin" — and decompose them
      into multi-step physical action plans. Kyle Vogt has described this as giving robots "all the
      brains of an LLM," translating the ChatGPT-era generalization capability into physical world
      action. The company is actively building three core ML subsystems, as evidenced by its
      engineering job postings: whole-body control policies that co-ordinate the mobile base and
      arm in real time; spatiotemporal world models that generate and simulate video sequences for
      predictive planning and sim-to-real training data; and 3D vision pipelines that fuse geometric
      computer vision with deep learning for real-time object recognition and scene understanding.
      Underpinning these is a simulation-to-real (sim-to-real) pipeline in which reinforcement
      learning agents are trained in GPU-scale simulated environments and then transferred to
      physical hardware. An ML compiler team converts multi-billion-parameter models for deployment
      on edge robot processors with latency and power constraints. Firmware and motor-control
      engineers manage the low-level interface between software and actuators. The AI core is
      designed to be cloud-updatable so edge-case fixes discovered in one robot's operation are
      distributed fleet-wide without hardware recalls. The architecture is full-stack and vertical:
      hardware, firmware, robot OS, perception, AI planning, and user interface are all built
      in-house, following the integration philosophy Vogt applied at Cruise.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
