callouts:
  - calloutType: strength
    title: "AV-Grade Technical Team Reduces Perception Risk"
    body: >-
      The founding team's hands-on experience building Cruise's autonomous vehicle
      perception and AI stack — mapping, object detection, sensor fusion, and fleet-scale
      learning — directly transfers to household robotics. The engineering depth for sensor
      fusion and sim-to-real transfer is among the strongest in the consumer robotics field,
      reducing the risk that basic navigation and perception will be the primary commercial
      bottleneck.
    claimRefs:
      - CE017
      - CE018
      - CE028
      - CE029

  - calloutType: risk
    title: "Sim-to-Real Gap in Unstructured Home Environments Is the Core Technical Bet"
    body: >-
      The company's entire product thesis depends on sim-to-real generalization performing
      reliably in real homes, where object diversity, lighting variability, and spatial
      unpredictability are orders of magnitude greater than in controlled industrial or
      AV settings. This is an open research problem industry-wide with no published
      benchmark from The Bot Company. If sim-to-real transfer degrades unacceptably in
      homes, the robot will require prohibitively expensive real-world data collection and
      teleoperation, destroying the unit economics thesis.
    claimRefs:
      - CE041
      - CE042
      - CE043

  - calloutType: risk
    title: "Privacy and Safety Compliance Architecture Entirely Undisclosed"
    body: >-
      In-home robots that continuously record audio, video, and spatial sensor data from
      private residences face acute privacy and data security obligations. The Bot Company
      has published no privacy policy, data governance framework, or security architecture.
      Required consumer safety certifications (UL 3300, ISO 13482) are also absent from
      any public disclosure. These gaps must be resolved before any retail-channel partner
      or data-privacy regulator would approve commercial deployment.
    claimRefs:
      - CE032
      - CE033

  - calloutType: insight
    title: "Job Postings Are the Primary Technical Signal"
    body: >-
      With no published technical documentation, API, GitHub repository, or product demo,
      The Bot Company's active engineering job listings — for whole-body control, world
      models, 3D vision, simulation, ML compilers, firmware, and electrical systems —
      constitute the clearest observable signal of its technical priorities and development
      stage. This approach is consistent with early-stage stealth robotics development
      but limits external validation of architecture choices.
    claimRefs:
      - CE017
      - CE035

