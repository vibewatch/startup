  - id: deployment-integration-roadmap
    title: "Deployment, Integration, and Roadmap"
    body: >-
      The robot's setup workflow — as described in third-party reporting — involves rolling the unit
      through each room to generate a 3D map, labeling pickup and drop zones via a companion mobile
      app, and training object recognition by photographing items of interest. Scheduled routines
      can then be configured (e.g., nightly pickup of Legos from the living room). The robot
      recharges automatically at a dock and empties its collection bin at designated locations.
      Smart home integration targets the Matter protocol, SmartThings, and Apple HomeKit, enabling
      coordination with smart locks, lights, and sensors. The company employs a human-in-the-loop
      teleoperation system for edge cases: when the robot encounters an unfamiliar object or
      situation, the case is resolved remotely by an operator and the solution is pushed to the
      entire fleet via an over-the-air software update. As of May 2026, the company has not
      disclosed a commercial launch date, production volume, pricing, or distribution channel.
      Open engineering roles in electrical systems, mechanical design, simulation, firmware, and
      data infrastructure signal active pre-production hardware development. The roadmap remains
      entirely company-private; the technology readiness level is assessed as early TRL 4–5
      (laboratory demonstration, pre-pilot deployment) based on the funding stage and absence of
      any published real-world performance data.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE034
      - CE035
      - CE040
