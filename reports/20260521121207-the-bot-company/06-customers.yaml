company:
  name: "The Bot Company"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    The Bot Company has not publicly disclosed any commercial customers, pilots, or beta
    deployments as of May 2026. The company is pre-product and pre-revenue. This chapter
    therefore focuses on the inferred ideal customer profile, jobs-to-be-done, demand
    signals from the household robotics market, willingness-to-pay constraints from consumer
    surveys, adoption barriers, channel assumptions, and the explicit evidence gaps around
    actual customer proof. The primary evidence base is consumer survey data (Altman Solon,
    2025), published market intelligence on household robot adoption, and the company's own
    website positioning. Named customer proof, retention data, expansion metrics, and
    concentration risk are all unverifiable at this stage and documented as evidence gaps.

sections:
  - id: target-customer-segments
    title: Target customer segments are inferred from positioning, not verified deployments
    body: >-
      The Bot Company has articulated one clear customer thesis on its public website: it is
      building "a helpful robot for every home." This phrase targets the broad consumer
      household market rather than any vertical enterprise segment. Secondary reporting and
      investor coverage describe the primary intended buyer as dual-income households with
      children and pets — a segment that experiences high chore density, disposable income
      to support premium hardware purchases, and demonstrated willingness to adopt automation
      appliances such as robot vacuums. Two sub-segments are also cited in coverage of the
      company: short-term rental (STR) operators seeking turnover efficiency between guests,
      and elder care households or providers who would benefit from physical assistance for
      daily tasks. A tertiary reference to small offices appears in some coverage. None of
      these segments have been confirmed by the company with any named customer, commercial
      agreement, or pilot announcement.

      The household robotics market provides context for sizing the opportunity. The global
      household robots market was valued at approximately $8.65 billion in 2024 and is
      projected to reach $20.88 billion by 2034 at a CAGR of 13.8 percent
      (IntelMarketResearch, 2025). A related segment, the residential robotic vacuum cleaner
      market, was valued at $3.01 billion in 2024, expected to reach $3.19 billion in 2025
      and grow to $5.51 billion by 2034 at a CAGR of 6.25 percent (GlobalGrowthInsights,
      2025). These figures confirm that the consumer household automation category has
      established revenue at scale driven primarily by simpler single-purpose devices, which
      is the category The Bot Company intends to extend with a general-purpose manipulation
      platform. The robot vacuum sub-market is also the clearest demand proxy for chore-first
      consumers — the exact profile The Bot Company is targeting.

      Adoption of robotic vacuums among dual-income households is high: an estimated 74
      percent of dual-income homes have adopted a robotic vacuum, with 61 percent citing
      time savings as the primary motivation. More broadly, 66 percent of new robotic vacuum
      models now support smart home ecosystems, and 65 percent of surveyed US consumers
      prefer voice-command-enabled devices (GlobalGrowthInsights, 2025). These signals
      confirm that the primary buyer profile the company has described — busy, tech-comfortable,
      dual-income households — is already a demonstrated adopter of automated home appliances
      at lower price points. Whether those households will step up to a more expensive and
      more capable general-purpose robot is the key unverified demand hypothesis.
