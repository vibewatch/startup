callouts:
  - calloutType: risk
    title: Zero customer proof is the defining diligence gap for this chapter
    body: >-
      As of May 2026, The Bot Company has raised $302 million at a $2 billion valuation
      without publicly disclosing a single customer, pilot, or home deployment. Every
      customer-chapter metric — adoption, retention, expansion, channel traction, WTP
      validation — is null. Investors are buying a market thesis and a team, not a proven
      commercial model. This is structurally normal for a pre-product consumer hardware
      startup, but the dollar scale of the raise makes the absence of even private customer
      validation notable.
    claimRefs:
      - CU040
      - CU041
      - CU042
      - CU044
  - calloutType: insight
    title: Altman Solon survey data shows the WTP ceiling is a structural constraint, not just a temporary barrier
    body: >-
      The Altman Solon (2025) finding that 69 percent of consumers are unwilling to pay more
      than $5,000 is not purely a familiarity or awareness problem that education can solve.
      Among the most knowledgeable consumers, WTP is still anchored at $1,000-$5,000. This
      implies that The Bot Company must either drive its hardware cost to sub-$5,000 to unlock
      mass market, or accept an initial market of approximately 5 percent of interested consumers
      — those willing to pay $10,000+ — and use that cohort to fund cost curve reduction. The
      former path requires massive manufacturing scale before revenue validates the design; the
      latter limits initial revenue but may be the only viable launch path.
    claimRefs:
      - CU025
      - CU026
      - CU027
      - CU028
  - calloutType: assumption
    title: Channel and distribution assumptions are entirely unvalidated
    body: >-
      This chapter assumes a DTC-first online channel for the initial product launch based on
      the company's consumer positioning, web presence, and the absence of any disclosed retail
      or distribution partnerships. The Bot Company has not confirmed this assumption. A different
      channel strategy — such as a direct enterprise sale to STR operators or a care provider
      contract — would substantially change the customer segmentation, sales cycle, and economics
      of the business. Investors should treat channel assumptions in this chapter as directional
      only.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU038

