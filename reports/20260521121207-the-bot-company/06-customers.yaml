  - id: jobs-to-be-done-and-demand-signals
    title: Consumer surveys show strong latent demand for chore automation but a persistent familiarity gap
    body: >-
      The most directly relevant consumer demand dataset for The Bot Company's category is
      Altman Solon's 2025 Humanoid Home Robotics Survey, which polled over 1,000 US
      consumers on perceptions, preferences, and pricing expectations for home robots. The
      survey finds that 65 percent of US consumers expressed interest in owning an advanced
      home robot. The top five desired robot functions were cleaning (vacuuming, mopping,
      dusting) at 23 percent of responses, security monitoring and alerts at 14 percent,
      laundry handling at 9 percent, cooking assistance at 8 percent, and receiving
      deliveries. This ranking validates The Bot Company's chore-first design philosophy:
      consumers want utilitarian automation, not companionship or entertainment.

      However, familiarity with the technology remains low. Eighty-five percent of
      respondents rated themselves only moderately, slightly, or not at all familiar with
      advanced generalized home robots. Only 15 percent described themselves as very or
      extremely familiar. This "familiarity gap" is a structural headwind for early market
      conversion. High interest does not translate directly to purchase intent when consumers
      cannot evaluate what they are buying. The Bot Company will need substantial consumer
      education investment to move the majority of its target segment from curiosity to
      conversion.

      On the commercial side, the global robotic vacuum cleaner market reached $5.43 billion
      in 2024 and is projected to reach $16.16 billion by 2033 at a CAGR of 12.88 percent
      (Renub Research, 2025). Smart vacuum shipments grew more than 20 percent year-over-year
      in the second quarter of 2025 according to IDC data cited by industry trackers. Growth
      is driven by dual-income and urban households, AI navigation improvements, voice
      assistant integration, and the increasing availability of multi-function models. Over
      72 percent of urban households express interest in smart home devices. These market
      signals confirm that the buyer segment The Bot Company is pursuing is actively spending
      on automation products at sub-$1,000 price points, which establishes a real willingness
      to spend but not necessarily at the multi-thousand-dollar price point a general-purpose
      robot would command.

      Goldman Sachs, after analysis of the 2025 World Robotics Conference and engagement
      with leading Chinese firms, described consumer demand for household robots as
      "surging," especially in entertainment, education, and companionship. The firm also
      noted that a true general-purpose robot "ChatGPT moment" of highly adaptive
      multi-skill intelligence may still be two to three years away, which creates a
      timing risk for any company — including The Bot Company — that targets consumer
      general-purpose robots in that window.
