      - TU005
    figureRefs:
      - FU004

  - id: named-customer-proof-gap
    title: No named customers, pilots, or deployments exist; all proof-of-demand evidence is market-level
    body: >-
      The Bot Company has not publicly disclosed any named customers, beta testers, pilot
      programs, commercial agreements, or any form of deployment as of the report date of
      May 21, 2026. Silicon.co.uk explicitly noted in coverage of the March 2025 funding
      round that the company "has no customers, no products and no revenue." The Bot Company
      website does not list any customer logos, case studies, testimonials, or references.
      There is no evidence of a formal beta program, no public announcements of unit deliveries,
      and no customer-sourced review or testimonial on any third-party platform.

      As a result, this chapter cannot populate any of the standard customer-proof data points
      — named deployments, production vs pilot status, outcome metrics, customer-reported
      satisfaction, NRR, GRR, churn, contract lengths, or cohort retention — that would be
      expected in a chapter 6 analysis for a company with commercial traction. All such
      dimensions are documented as evidence gaps below.

      The only demand evidence available is market-level and survey-level: third-party consumer
      research indicating that 65 percent of US consumers are interested in owning an advanced
      home robot, that the household robot market is growing at double-digit rates, and that
      the dual-income household segment is a demonstrated buyer of robotic household appliances.
      These are demand-signal proxies, not customer proof. They confirm that a market exists,
      but they cannot substitute for evidence that The Bot Company has found product-market fit,
      acquired any paying users, or successfully deployed a robot into a home.

      The absence of customer proof at this stage is expected for a company that is pre-product.
      However, it means the entire customer chapter — segments, willingness-to-pay, channel,
      retention, and expansion — rests on inferences from the broader market and the company's
      stated positioning. Investors evaluating this chapter should treat it as a market and
      positioning analysis, not as commercial traction evidence.
    claimRefs:
      - CU040
      - CU041
      - CU042
      - CU043
      - CU044
      - CU045

