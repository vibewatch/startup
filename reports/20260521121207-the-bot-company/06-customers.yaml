figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The Bot Company's hypothetical customer journey from awareness through chore
      automation adoption. All stages from "trial" onward are unverified because the
      company has no deployed customers. The map reflects the expected journey for the
      primary dual-income household segment based on consumer research and the company's
      stated positioning.
    approximationNotes: >-
      All stages after "awareness" are inferred from market norms and company positioning;
      no Bot Company customer journey data exists.
    data:
      nodes:
        - id: awareness
          label: Awareness
          tone: neutral
          detail: >-
            Consumer hears about Bot Company through media coverage, Kyle Vogt's profile,
            or social media. High public interest but low product familiarity (85% not very familiar).
        - id: interest
          label: Interest / Consideration
          tone: positive
          detail: >-
            Consumer visits bot.co; signs up for updates (waitlist). Strong latent interest:
            65% of US consumers interested in home robots (Altman Solon 2025).
        - id: barrier
          label: Purchase Barrier
          tone: warning
          detail: >-
            Price anchoring ($1,000-$5,000 ceiling vs likely higher product price), privacy
            concerns (cameras/LiDAR in home), safety hesitation (50% uncomfortable with
            advanced home robots), and low familiarity all act as conversion friction.
        - id: purchase
          label: Purchase Decision
          tone: neutral
          detail: >-
            5% early adopter cohort willing to pay $10,000+; broader mass-market adoption
            requires price reduction to $5,000 range. Outright purchase (37%) or subscription
            (24%) both viable based on survey preferences.
        - id: onboarding
          label: Onboarding / Setup
          tone: neutral
          detail: >-
            28% of smart home buyers cite setup complexity as a barrier; onboarding
            experience will be critical for retention. Voice command / LLM interface reduces
            complexity compared to traditional app-heavy setups.
        - id: value-delivery
          label: Chore Automation Value
          tone: positive
          detail: >-
            Successful deployment delivers 6+ hours/week saved for household. Consumer
            values this at ~$14/hour (~$4,368/year). Positive NPS enables word-of-mouth
            expansion to STR operators and elder care segments.
    claimRefs:
      - CU001
      - CU013
      - CU014
      - CU015
      - CU019
      - CU025
      - CU027
      - CU030

