  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-som-sizing
      missingEvidence: "No published analyst SAM for multi-purpose, premium-priced, non-humanoid AI household robots. Existing reports cover either the full household robot TAM or the robotic vacuum sub-market, not the multi-purpose AI chore robot sub-segment."
      whyItMatters: "Without a verified SAM, the addressable market for Bot Company's specific product cannot be sized with precision; the SAM estimate in TM002 is analyst-derived and carries high uncertainty, limiting investment case rigor."
      diligencePath: "Commission a custom analyst study from IDC, Wood Mackenzie, or equivalent tier-1 research firm to segment the household robot market by product functionality tier and price band. Alternatively, request comparable data from Bot Company management (early customer survey, addressable household estimate)."
      relatedQuestionRefs: [QM004, QM022]
      relatedTableRefs: [TM002]

    - type: missing-source
      severity: material
      topic: market-penetration-rate
      missingEvidence: "Current household robot penetration rate among eligible US households (e.g., robot vacuum ownership rate) not directly obtained from primary survey data. Most sources report TAM in dollar terms, not household penetration."
      whyItMatters: "Penetration rate determines how much of the eligible buyer pool has not yet adopted, which anchors the growth ceiling and SOM calculations."
      diligencePath: "Obtain consumer penetration surveys from Consumer Intelligence Research Partners, Prosumer Insights, or equivalent primary-market research on robot vacuum and home automation device ownership rates by income tier."
      relatedQuestionRefs: [QM020]

    - type: private-evidence-only
      severity: material
      topic: certification-status
      missingEvidence: "The Bot Company has not publicly disclosed its UL 3300 pre-certification testing status, FCC authorization status, or any safety compliance filings as of May 2026."
      whyItMatters: "Certification timelines of 12–24 months mean that undisclosed certification status is a material launch-timing risk; without evidence of testing commencement, a 2026 or 2027 product launch timeline cannot be verified."
      diligencePath: "Request certification testing status from company management; request UL test facility agreements and submission timelines. Check FCC equipment authorization database (FCC ID search) for any Bot Company or related entity filings."
      relatedQuestionRefs: [QM016]
      relatedTableRefs: [TM004]

    - type: enumeration-incomplete
      severity: minor
      topic: task-coverage-map
      missingEvidence: "No public data on which specific household tasks Bot Company's robot will cover at initial launch versus a later roadmap. Household task coverage distribution (which tasks consume what share of domestic labor time) is not mapped to the bot Company product specification."
