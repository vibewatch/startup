callouts:
  - calloutType: insight
    title: Market Opportunity Is Real but Requires Category Creation
    body: >
      The $14–17B global household robot market in 2025 is genuine and growing, but
      80%+ of revenues come from single-function robotic vacuum cleaners priced below $600.
      The Bot Company is not entering this market; it is creating a new adjacent sub-category
      of multi-purpose, premium-priced AI robots. No published analyst SAM directly covers
      this sub-segment, which means both the opportunity size and the adoption risk are
      structurally underspecified. Investors should model this as a category creation bet, not
      a market-share capture play.
    claimRefs: [CM004, CM012, CM034]

  - calloutType: risk
    title: iRobot's Bankruptcy Is a Warning Sign for Premium US Hardware
    body: >
      iRobot, with 15+ years of brand equity and ~9% global robot vacuum market share,
      filed Chapter 11 in December 2025 under competitive pressure from Chinese manufacturers.
      This is the most concrete adverse market signal available for evaluating The Bot Company:
      premium US robot hardware companies face structural cost disadvantages against Chinese
      scale manufacturing. The Bot Company's survival requires genuine product differentiation
      on multi-purpose capability and LLM control — not just a premium brand — to sustain
      pricing above the Chinese competitive band.
    claimRefs: [CM031, CM032]

  - calloutType: risk
    title: Privacy and Certification Barriers Are Launch Prerequisites
    body: >
      Approximately 47% of potential household robot buyers express concern about in-home
      cameras and data collection. UL 3300 and FCC certifications require 12–24 months from
      design freeze. These are not post-launch problems — they are pre-launch requirements that
      must be addressed in product design and regulatory strategy before a commercial product
      ships. The Bot Company has not publicly disclosed its certification status or data
      governance design as of the report date.
    claimRefs: [CM028, CM030]

  - calloutType: strength
    title: Structural Growth Tailwinds Validate Long-Term Market Thesis
    body: >
      Smart home adoption, aging demographics, falling sensor costs, and LLM capability
      convergence create a multi-factor structural tailwind for exactly the product The Bot
      Company is building. The $85B market projection by 2035 (Global Market Insights) implies
      that the category will grow 5–6× even on conservative assumptions, and a first-mover
      platform advantage in multi-purpose household robots could command a significant share
      of the incremental category expansion if the company ships a credible product.
    claimRefs: [CM022, CM023, CM024, CM025, CM027, CM037]

