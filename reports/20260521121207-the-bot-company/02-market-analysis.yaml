      missingEvidence: "iRobot's December 2025 Chapter 11 bankruptcy and reported acquisition by Shenzhen Picea Robotics is referenced in secondary sources but the final outcome and its competitive implications for the US robot market as of May 2026 are not fully verified from primary iRobot filings."
      whyItMatters: "The outcome of iRobot's bankruptcy (liquidation vs. Chinese acquisition) affects the competitive landscape directly; a Chinese-owned iRobot brand with lower cost basis changes the market structure more adversely for US startups."
      diligencePath: "Review US Bankruptcy Court filings for iRobot Corporation (DEIN Chapter 11 case) and any acquisition closure documents; follow iRobot press releases on media.irobot.com."
