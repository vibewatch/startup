  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure-gap
      missingEvidence: "Actual revenue (zero or otherwise), ARR, gross margin, burn rate, cash on hand, customer count, and unit economics are all private and undisclosed. No audited financials, investor letter, or company-reported metric exists in the public domain."
      whyItMatters: "Without these metrics, underwriting is based entirely on estimated and benchmark inputs. Any investment decision requires access to the internal financial model and data room disclosures; no public market proxy exists."
      diligencePath: "Request monthly operating reports, management accounts (P&L, balance sheet, cash flow), unit economics model, BOM, and subscription economics projections in the data room. Request CFO attestation of cash position and burn rate."
      relatedQuestionRefs: [QI015, QI006, QI007]

    - type: stale
      severity: material
      topic: potential-series-c
      missingEvidence: "The status of the Bloomberg-reported $250 million raise at $4 billion-plus valuation is unconfirmed as of May 2026 — seven months after the report was published. The round may have closed, partially closed, or been abandoned."
      whyItMatters: "Whether this round closed materially affects capital adequacy (adding $250M extends runway), valuation legitimacy (confirming the $4B+ step-up), and the implied investor confidence signal. A failed raise would be an adverse capital signal."
      diligencePath: "Contact the company directly for the confirmed total capital raised and current cash position. Cross-reference with SEC EDGAR for any new Form D filings from Botco, Inc. (CIK 0002024013) in 2025–2026."
      relatedQuestionRefs: [QI021, QI014]

    - type: private-evidence-only
      severity: blocking
      topic: product-status
      missingEvidence: "No confirmed product launch timeline, prototype demo date, manufacturing start, or commercial milestone has been publicly disclosed. The company has operated in near-stealth since founding in May 2024."
      whyItMatters: "Product launch timing is the primary financial driver: it initiates revenue, tests unit economics, and triggers the capital-intensive manufacturing ramp. Without a timeline, burn-to-revenue models cannot be constructed."
      diligencePath: "Request product roadmap, manufacturing qualification timeline, and first commercial shipment date in the data room. Seek any CES, robotics conference, or product reveal commitments."
      relatedQuestionRefs: [QI022]

    - type: missing-source
      severity: material
      topic: bom-estimate
      missingEvidence: "No bill of materials, contract manufacturer quote, or manufacturing cost estimate for TBC's robot exists in the public domain. All BOM estimates in this chapter are derived from analogous consumer robotics products at comparable capability levels."
      whyItMatters: "The BOM is the primary determinant of hardware gross margin at launch. An error of 10 percentage points in BOM-to-ASP ratio (e.g., 65% vs. 55%) translates directly to 10 points of gross margin difference, materially affecting unit economics viability."
      diligencePath: "Request preliminary BOM from mechanical/electrical engineering team, contract manufacturer quotes, and first-article production cost estimates. Compare against peer BOM disclosures from Figure AI or Hello Robot for sanity checks."
      relatedQuestionRefs: [QI012, QI004]

