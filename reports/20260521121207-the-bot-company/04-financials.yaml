callouts:
  - calloutType: risk
    title: "Pre-Revenue Valuation at $2B+ Carries Significant Underwriting Risk"
    body: >
      The Bot Company's $2 billion valuation (confirmed, March 2025) and reported $4 billion-plus
      target (unconfirmed) are assigned entirely on optionality premium — founder pedigree, category
      creation thesis, and team quality — without any revenue, product, or unit economics validation.
      This is not unique in AI robotics (Figure AI reached $39B pre-consumer), but it means investors
      cannot calibrate valuation against standard financial metrics. Any delay in product launch,
      cost overrun in manufacturing, or slower-than-expected consumer adoption will require a
      fundraising round at potentially compressed terms. The iRobot bankruptcy demonstrates that
      even hardware robotics companies with substantial revenue are not insulated from financial stress.
    claimRefs: [CI033, CI034, CI039, CI040]

  - calloutType: insight
    title: "SEC Form D Is the Only Primary-Source Financial Confirmation Available"
    body: >
      Of all the financial claims circulating about The Bot Company, the SEC Form D filed 2024-05-21
      (Acc-no: 0002024013-24-000001) is the only document not derived from third-party press
      reporting. It confirms: (1) the issuer is Botco, Inc., CIK 0002024013; (2) $150,669,884
      in equity was raised under Rule 506; (3) Kyle Vogt signed as CEO; and (4) the company's
      business address is 552 Brannan Street, San Francisco, CA 94107. No comparable primary source
      exists for the March 2025 round, which rests entirely on press reporting citing anonymous
      sources. This asymmetry in source quality should be noted in any diligence process.
    claimRefs: [CI001, CI002, CI003, CI004, CI006]

