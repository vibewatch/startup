company:
  name: The Bot Company
chapter:
  number: 4
  order: 4
  title: Financials
  summary: >
    The Bot Company has confirmed $302 million in total disclosed equity financing — $150 million
    at a $550 million post-money seed valuation in May 2024 (SEC Form D filed 2024-05-21 confirms
    $150,669,884 raised) and $150 million at a $2 billion post-money valuation in March 2025 led
    by Greenoaks Capital — with Bloomberg reporting in October 2025 a planned $250 million raise
    at a $4 billion-plus valuation whose status as of the report date is unconfirmed. The company
    is pre-product and pre-revenue with no public disclosure of revenue, ARR, gross margin, burn
    rate, or customer count; estimated monthly cash consumption of $2–4 million implies a
    multi-year runway from the confirmed capital base before manufacturing scale-up begins, but
    hardware manufacturing initiation will significantly accelerate cash consumption. All unit
    economics, margin expectations, and revenue timing remain evidence gaps pending product launch,
    and the Latka-published "$16.6M ARR" figure is inconsistent with all credible sources and
    should be disregarded.

sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing
    body: |
      The Bot Company has articulated a dual-revenue model combining upfront hardware sales with
      recurring software subscription fees, but has not publicly disclosed pricing for either
      component. Based on Sacra's analysis of the company's business model and the competitive
      landscape of premium consumer robots, the hardware unit is expected to target a consumer
      average selling price of approximately $1,500–$3,000 — consistent with the price range
      discussed in industry reporting and competitive positioning against 1X Technologies' NEO
      humanoid robot (launched at $499/month subscription with implied hardware cost above
      $20,000, though the non-humanoid form factor positions TBC for a substantially lower
      MSRP). A monthly subscription in the $30–$80 range for cloud AI features, over-the-air
      updates, human-in-the-loop resolution, and smart home integrations is consistent with
      analogous hardware-plus-software platforms.

      Revenue recognition for a hardware-plus-subscription model is a dual-stream structure:
      hardware revenue is recognized at point of sale or delivery; subscription revenue is
      recognized ratably over the subscription term. The subscription layer creates growing
      recurring revenue as the installed base expands, but total revenue in year one is dominated
      by hardware ASP and unit volume. At pre-launch stage, no revenue of any kind has been
      recorded. The company has not disclosed any pre-orders, deposit programs, or letter-of-intent
      pipeline from consumers or institutional buyers.

      GetLatka's database page as of November 2025 claims "$16.6M ARR" for The Bot Company (up
      from "$2.9M in 2024"). This figure is internally labeled as "GetLatka-estimated metrics" —
      not company-reported data — and is inconsistent with every credible press account, the
      company's own pre-product positioning, the absence of any commercial launch announcement,
      and the company's website messaging. No corroborating source exists for any revenue
      whatsoever. The Latka figures must be treated as unreliable estimates and are not used in
      this analysis.

      Secondary market targets include short-term rental operators, elder care providers, and
      small office facility teams, expanding the addressable market beyond primary consumer
      households. These segments typically accept higher ASPs and recurring fees than pure
      consumer channels, offering a potential premium pricing pathway post-launch.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI019]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: capital-adequacy-and-funding-mechanics
    title: Capital Adequacy and Funding Mechanics
    body: |
      The Bot Company's confirmed capital base is approximately $302 million across two equity
      rounds. The first round — a $150 million seed announced in May 2024, with the legal entity
      Botco, Inc. (CIK 0002024013) — is confirmed by an SEC Form D filed 2024-05-21 showing
      $150,669,884 in equity raised (Rule 506 exemption), signed by Kyle Vogt as CEO. This is
      the only confirmed primary-source documentation of the financing available publicly. The
      seed investors included Nat Friedman, Daniel Gross, Nabeel Hyatt (Spark Capital), Patrick
      Collison, John Collison, Quiet Capital, Elad Gil, and Fifty Years. The post-money valuation
      of approximately $550 million was reported by Forbes citing multiple sources with knowledge
      of the round.

      The second confirmed round was $150 million closed in March 2025, led by Greenoaks Capital,
      with a $2 billion post-money valuation — a 3.6x step-up from the seed in approximately ten
      months. Reuters reporting (cited by The Robot Report) was the first to confirm the round;
      subsequent corroboration came from Bloomberg, Economic Times, and multiple outlets. The
      official bot.co website lists the broader investor roster — Greenoaks, NFDG, Spark, Eclipse,
      Kleiner Perkins, and Y Combinator — suggesting additional investors joined beyond the Greenoaks
      lead, possibly in a subsequent close or tranche.

      Bloomberg reported in October 2025 that The Bot Company was seeking an additional $250 million
      at a valuation above $4 billion, which would be a further 2x step-up from the March 2025
      round. The status of this round as of the report date (May 2026) is unconfirmed; it may have
      closed, partially closed, or remained outstanding. If confirmed, total raised would be
      approximately $552 million and the implied valuation progression would be: $550M (seed, 2024)
      → $2B (March 2025) → $4B+ (2025–2026), a roughly 7x increase in 18 months on a pre-product
      company.

      No debt financing, convertible notes, revenue-based financing, project finance facilities,
      or other non-equity instruments have been publicly disclosed. All confirmed capital is venture
      equity. Greenoaks Capital's investment philosophy is characterized by concentrated bets with
      long hold horizons and active governance — consistent with the lead investor's ability to
      sustain this company through a multi-year pre-revenue R&D phase.

      Estimated monthly cash burn at the current stage (approximately 80 employees, active
      hardware prototype development, and cloud AI compute) is $2–4 million per month based on
      industry benchmarks for comparable hardware AI startups at this headcount and stage. This
      implies a runway of approximately 6–12 years from March 2025 on the confirmed $302 million
      base — but this estimate does not account for manufacturing scale-up, which typically
      consumes $20–100 million or more in capital once production begins. A more realistic
      "development burn to manufacturing ramp" scenario would compress runway to 2–4 years once
      hardware production begins, necessitating either the Bloomberg-reported raise or an
      additional round.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI028, CI029, CI030, CI040]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: unit-economics-and-cost-structure
    title: Unit Economics and Cost Structure
    body: |
      The Bot Company has disclosed no unit economics data. As a pre-product company without
      active manufacturing, the following analysis is based entirely on industry benchmarks for
      comparable consumer hardware robotics platforms and should be treated as illustrative
      framing rather than company-specific evidence.

      At low production volumes (under 10,000 units annually), the bill of materials for a
      premium consumer robot with LiDAR, cameras, a robotic arm, interchangeable end-effectors,
      on-device compute, and a wireless connectivity module is estimated at 50–70% of retail price.
      For a $2,000 MSRP robot, this implies a BOM of $1,000–$1,400 per unit before assembly,
      quality testing, packaging, and shipping, yielding initial gross margins in the range of
      negative 10% to 20% at launch volumes — consistent with the early-stage hardware trajectory
      of peers including Roborock (which took multiple product generations to achieve 35–45% gross
      margins) and iRobot (which sustained 30–40% gross margins only after years of Roomba volume
      scale).

      The software subscription layer, once activated at scale, should carry structural gross
      margins of 60–80%, consistent with SaaS and cloud services economics. However, the
      human-in-the-loop AI system — which distributes edge-case resolutions back to the robot
      fleet via over-the-air updates — creates a per-subscriber cloud compute cost that will
      initially suppress subscription gross margin. As the fleet grows and the AI model improves
      via collective learning, inference costs per robot per month should decline.

      The planned contract manufacturing model (per Sacra's analysis) reduces upfront capex for
      TBC but typically results in a higher per-unit BOM versus vertical integration, since the
      contract manufacturer captures margin. This is the standard trade-off for consumer hardware
      startups: lower fixed cost intensity at the expense of higher variable cost per unit. At
      the product launch phase, this trade-off is typically correct; at multi-million-unit scale,
      vertical integration becomes economical.

      Customer acquisition cost (CAC) for a novel, $2,000+ consumer hardware product in a category
      without existing demand signals is highly uncertain. Direct-to-consumer channels (social media,
      search, earned media) for premium hardware typically require $300–$1,500 in marketing and
      channel cost per unit sold, with payback periods of 12–36 months depending on subscription
      uptake and churn. The company has not disclosed any CAC data, waitlist size, or consumer
      demand signals.

      Go-to-market motion has not been disclosed. The company has no announced retail partnerships,
      distribution agreements, or channel relationships as of May 2026. This represents a
      significant financial unknown: retail distribution (e.g., Best Buy, Amazon) typically
      requires channel discounts of 30–40% off MSRP, compressing already thin hardware margins;
      direct-to-consumer avoids this but requires proportionally higher marketing spend.
    claimRefs: [CI020, CI021, CI022, CI023, CI024, CI035, CI036, CI037, CI038]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: financial-comparables-and-benchmarks
    title: Financial Comparables and Benchmarks
    body: |
      The Bot Company's financial profile at May 2026 — pre-product, pre-revenue, approximately
      $302 million raised at a $2 billion valuation — situates it in a small category of
      extremely well-capitalized pre-commercial hardware AI companies. No exact peer exists, but
      the following comparables provide useful framing.

      Figure AI, a humanoid robot company with $675 million or more raised across multiple rounds,
      achieved a $39 billion valuation as of September 2025 — also pre-consumer, with early
      industrial deployments at BMW. Figure AI's capital formation trajectory illustrates that
      large-scale AI robotics companies can sustain very high valuations on the strength of
      industrial deployment deals and investor conviction without consumer revenue. TBC's $2 billion
      valuation at a pre-prototype stage is more aggressive relative to Figure AI's comparable
      milestone, but TBC's founder pedigree (Cruise, Twitch) and the smaller team suggest
      the comparison is imperfect.

      iRobot — the most relevant consumer hardware robotics precedent — peaked at $682 million
      in revenue (2024) with gross margins of approximately 30–40% before filing for Chapter 11
      bankruptcy in December 2025. The iRobot failure illustrates two key financial risks for
      TBC: (1) even at meaningful revenue scale, hardware robotics gross margins are structurally
      thin and vulnerable to input cost pressure and competitive pricing; and (2) a single
      category-defining product (the Roomba) does not insulate a hardware company from
      margin compression when Chinese OEM competitors with superior manufacturing economics
      enter the market. CNBC noted that iRobot's bankruptcy "may wreck a lot more than one
      robot vacuum maker," explicitly flagging contagion risk for adjacent consumer robotics
      companies. This is the most adverse comparable for TBC's capital intensity thesis.

      Burn rate benchmarks for hardware AI startups suggest $100,000–$500,000 per month at
      seed stage, rising to $1 million or more per month at growth stage. TBC, with its
      reported ~83-person headcount and active hardware prototype development, is likely
      between $2 million and $4 million per month — above the growth-stage median due to
      the dual hardware engineering and AI infrastructure cost centers. This is consistent
      with Greenoaks' investment strategy: the firm backs "generation-defining" companies
      with a tolerance for long pre-revenue phases on the belief that the category creates
      a winner-takes-most outcome worth the capital intensity.

      Roborock's publicly available financials (listed on Hong Kong exchange) show that a
      premium consumer robotics company can achieve 35–45% gross margin at scale with vertically
      integrated manufacturing. This represents an aspirational target margin path for TBC,
      achievable only after several years of production scale and supply chain optimization.
    claimRefs: [CI031, CI032, CI033, CI034, CI035, CI039]
    figureRefs: [FI004]

  - id: financial-verdict-and-evidence-gaps
    title: Financial Verdict and Evidence Gaps
    body: |
      Revenue quality: Cannot be assessed — TBC has no revenue. There is no commercial product,
      no disclosed ASP, no announced launch timeline, no signed customer contracts, and no
      waitlist or pre-order data in the public domain. The Latka-estimated "$16.6M ARR" is
      unreliable and should be disregarded.

      Margin path: Highly uncertain and capital-intensive. Consumer hardware robotics at launch
      volumes is typically gross-margin negative. The path to 20–35% blended hardware margin
      requires significant volume scale (likely 100,000+ units annually) and supply chain
      maturation. The subscription layer offers a path to margin expansion over time, but its
      financial contribution is negligible until the installed base is large. Based on peer
      precedent, positive blended gross margin is a 3–5 year horizon from launch, assuming
      launch occurs within 12–18 months of the report date.

      Capital intensity: High and front-loaded. Hardware robotics requires significant capital
      for R&D, prototype tooling, manufacturing qualification, and initial inventory. The
      confirmed $302 million base provides adequate runway for the R&D phase and initial
      production setup, but a manufacturing ramp to tens of thousands of units annually will
      require additional capital — whether from the reported $250 million round or a subsequent
      raise. Debt financing for manufacturing equipment or inventory could be available once
      the product is validated.

      Diligence blockers:
      1. Actual burn rate and cash on hand: Without a monthly operating report, runway is only
         estimable, not confirmed.
      2. Product launch timeline and milestone plan: No public timeline exists; any valuation
         model requires a launch assumption.
      3. Unit economics model: BOM, ASP, subscription pricing, and channel economics are all
         private and undisclosed.
      4. Status of $250M round: Whether this round has closed materially affects capital adequacy
         and valuation legitimacy.
      5. Revenue and demand validation: Pre-orders, waitlists, pilot deployments, or institutional
         LOIs would allow a preliminary demand signal assessment, none of which are public.
    claimRefs: [CI010, CI012, CI013, CI028, CI029, CI036, CI038, CI039, CI040]
    tableRefs: [TI005]

