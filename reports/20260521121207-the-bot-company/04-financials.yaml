      severity: material
      topic: latka-data-reliability
      missingEvidence: "GetLatka's '$16.6M ARR' figure and '$2.9M' in 2024 revenue conflict directly with the company's pre-product status confirmed by all credible public sources. If any revenue exists (e.g., from pilot programs or institutional beta), it has not been publicly disclosed."
      whyItMatters: "If TBC has any pilot revenue or institutional program revenue, it would change the financial picture from pure optionality to early traction — materially affecting valuation legitimacy and underwriting confidence. The current evidence base cannot distinguish between 'truly $0 revenue' and 'unreported minimal traction.'"
      diligencePath: "Directly ask the company for any revenue, letter-of-intent value, or institutional pilot program revenue. Cross-reference with any institutional partner announcements or beta program disclosures. Disregard Latka estimates."
