companyProfile:
  summary: >
    The Bot Company is a San Francisco-based household robotics startup founded in May 2024 by
    Kyle Vogt (former CEO of Cruise, co-founder of Twitch), Paril Jain (former Tesla AI lead and
    CTO), and Luke Holoubek (former Cruise engineer). The company is developing non-humanoid,
    AI-powered home robots that automate everyday chores via natural language commands, drawing on
    autonomous vehicle engineering expertise in perception, manipulation, and world-model simulation.
    As of May 2026 the company is pre-product and pre-revenue, having raised approximately $302
    million across two confirmed rounds at a confirmed $2 billion post-money valuation. The investor
    syndicate includes Greenoaks, NFDG, Spark Capital, Eclipse, Kleiner Perkins, and Y Combinator.
    Kyle Vogt's prior leadership of Cruise during the October 2023 pedestrian-dragging incident and
    his subsequent resignation represent a material adverse background factor.
  foundedDate: "2024-01-01"
  founders:
    - name: "Kyle Vogt"
      role: "CEO and Co-Founder"
      background: "Co-founder of Twitch (Amazon $970M, 2014) and Cruise (GM $1B, 2016); served as Cruise CEO until November 2023; serial founder with deep AV and AI expertise directly applicable to household robotics."
      claimRefs: ["CO007", "CO008", "CO009"]
    - name: "Paril Jain"
      role: "CTO and Co-Founder"
      background: "Led AI development on Tesla's Autopilot team; departed Tesla in May 2024 specifically to co-found The Bot Company; deep ML, perception, and autonomy experience."
      claimRefs: ["CO010", "CO011"]
    - name: "Luke Holoubek"
      role: "Co-Founder / Engineering Lead"
      background: "Software engineer and technical advisor to the CTO at Cruise; deep autonomous vehicle software experience directly applicable to robot motion planning and safety systems."
      claimRefs: ["CO012", "CO013"]
  foundingLocation: "San Francisco, CA"
  headquarters: "San Francisco, CA"
  productSummary: >
    A non-humanoid wheeled home robot with a 4-degree-of-freedom articulated arm, interchangeable
    end-effectors (grasping grippers, suction attachments, microfiber wipers), multi-modal sensing
    (RGB cameras, LiDAR), and an LLM-driven natural language command interface. The robot is
    designed to handle household objects under approximately 1 kg, map and navigate home environments,
    and execute multi-step chore routines (object pickup, organization, surface cleaning). No
    commercial product has been launched as of the report date.
  customerFocus: >
    Primary: dual-income US households with children and pets. Secondary: short-term rental
    operators, elder care providers, and small offices. All customer segments are inferred from
    positioning and investor coverage; no named customers, commercial agreements, or pilots have
    been disclosed.
  businessModel: >
    Planned dual-revenue model: upfront hardware sales (estimated consumer ASP $1,500–$3,000) plus
    recurring software subscription fees (estimated $30–$80/month) for cloud AI features,
    over-the-air updates, and smart home integrations. No pricing has been publicly disclosed and
    no revenue has been generated.
  stage: "Series B"
  fundingStatus: >
    $150M seed round in May 2024 at $550M post-money valuation (investors: Nat Friedman, Daniel
    Gross, Spark Capital, Patrick Collison, John Collison, Quiet Capital, Elad Gil, Fifty Years).
    $150M Series B in March 2025 led by Greenoaks Capital at $2B post-money valuation. Bloomberg
    reported in October 2025 that the company was seeking $250M at a $4B+ valuation; closing status
    unconfirmed as of May 2026. Website investor roster includes Eclipse, Kleiner Perkins, and YC,
    suggesting additional closes between the Greenoaks round and the report date.
  disclosureProfile: private-undisclosed
  claimRefs: ["CO001", "CO002", "CO003", "CO007", "CO008", "CO009", "CO010", "CO015", "CO016", "CO017", "CO021", "CO031"]

summary:
  headline: >-
    The Bot Company combines an elite founding team, exceptional capital formation, and a genuine
    product opportunity in household robotics, but the complete absence of product proof, revenue,
    or customer validation — combined with a $2B confirmed valuation, Cruise founder liability, and
    deep sim-to-real technical risk — justifies a TRACK stance at high risk with low confidence.
  overallScore: 6.5
  recommendation: track
  confidence: low
  riskRating: high
  valuationStance: stretched
