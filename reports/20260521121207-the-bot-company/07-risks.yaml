  - id: privacy-data-cybersecurity-risk
    title: "Privacy, Data, and Cybersecurity Risks"
    body: >-
      A household robot equipped with continuous cameras, LiDAR, and audio sensors constitutes one of the
      most privacy-invasive consumer devices ever deployed at scale. Unlike a smartphone or smart speaker,
      a mobile robot continuously surveys the full interior of the home in three dimensions, generating
      persistent maps of household layout, object locations, and occupant behavior. The Bot Company's
      privacy policy states that it collects visual, audio, and operational data; that data may be used
      for training AI models; and that human operators may access live or recorded home footage during
      teleoperation sessions. These disclosures are legally high-level and do not address data retention
      periods, operator access controls, encryption standards, or third-party data sharing specifics.

      The FTC's May 2023 enforcement action against Amazon Ring established the controlling precedent.
      Ring settled for $5.8 million after the FTC found that employees watched thousands of intimate-space
      videos of female users without authorization; the company used private video recordings to train
      algorithms without user consent; and inadequate security allowed hackers to access approximately
      55,000 customer accounts, enabling harassment of users including children. The FTC's characterization
      was unambiguous: "Ring's disregard for privacy and security exposed consumers to spying and
      harassment." An in-home mobile robot with live camera access is an order of magnitude more invasive
      than a fixed doorbell camera.

      California's CCPA/CPRA classifies biometric data—including facial geometry derivable from in-home
      video—as sensitive personal information with heightened consent, opt-out, minimization, and security
      obligations. The company's target market is California-heavy. IoT device cybersecurity risk has
      materially worsened: global daily IoT attack attempts averaged over 820,000 in early 2026, and
      researchers at DEF CON 32 demonstrated that Ecovacs robot vacuums could be remotely accessed via
      Bluetooth from 450 feet away, enabling silent home video and audio streaming. A security breach
      of a deployed Bot Company fleet would combine the Ring incident's reputational damage with physical
      home-access dimensions unique to a mobile, always-sensing robot.
