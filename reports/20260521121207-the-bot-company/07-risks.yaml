callouts:
  - calloutType: risk
    title: "Cruise Enforcement Record Is a Material Adverse Fact"
    body: >-
      The Cruise enforcement record—federal criminal admission, NHTSA $1.5M civil penalty, California
      permit revocation—is a material disclosed adverse fact about founder Kyle Vogt that investors must
      independently diligence before committing capital to The Bot Company.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
  - calloutType: risk
    title: "FTC Ring and Ecovacs Hacks Are Directly Analogous Precedents"
    body: >-
      The FTC's $5.8M Ring settlement (May 2023) and the Ecovacs robot vacuum Bluetooth hack (DEF CON 32,
      2024) establish that in-home sensing devices face active federal enforcement and demonstrated
      adversarial security risk. An in-home mobile robot is structurally more invasive than either precedent.
    claimRefs:
      - CR022
      - CR025
      - CR026
  - calloutType: risk
    title: "iRobot Bankruptcy Is the Most Relevant Market-Destruction Precedent"
    body: >-
      The iRobot Chapter 11 filing (December 2025) is the most relevant market-destruction precedent:
      a 30-year household robotics brand with millions of units shipped was destroyed by Chinese OEM
      pricing pressure. The Bot Company enters with zero units shipped, no consumer trust, and a harder
      technical problem.
    claimRefs:
      - CR012
      - CR019
      - CR044

