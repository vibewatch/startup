  - id: competitive-market-risk
    title: "Competitive and Market Adoption Risks"
    body: >-
      The household robot market is increasingly contested. Chinese OEMs—Roborock, Dreame, Ecovacs,
      and DJI—have demonstrated the ability to commoditize robotic sensing, navigation, and manipulation
      at consumer price points with aggressive production scale. These companies destroyed iRobot's
      margin structure with equivalent or superior products at lower prices, and they are expanding
      into manipulation and general-purpose tasks. The Bot Company's non-humanoid design provides some
      differentiation, but the core components (LiDAR, cameras, actuators) are available from the same
      Asian supply chains that power competitors.

      Consumer acceptance barriers are documented and significant. A 2025 survey by Humanoids Daily
      found the most common consumer fears regarding home robots include privacy concerns, property
      damage, unpredictable behavior, and high cost. Survey data shows consumers are interested in home
      robots but not willing to pay premium prices—the same pricing dynamic that destroyed iRobot's
      premium brand positioning. At an estimated target price of $1,000–$3,000+, The Bot Company faces
      a steep consumer education and willingness-to-pay hurdle with no existing brand equity.

      Humanoid robot competitors—Figure AI (at a $3.9 billion valuation as of September 2025), 1X
      Technologies (Neo home humanoid), and Samsung's Ballie (with Gemini integration, scheduled launch
      June 2025)—are also targeting the home. Samsung brings global retail relationships, established
      smart home ecosystem integration, and consumer brand trust that The Bot Company must build from
      scratch. The company enters a market that just watched its most established brand file for
      bankruptcy, with well-resourced competitors from both Silicon Valley and Asia already in market.
    claimRefs:
      - CR044
      - CR045
      - CR046
      - CR047

  - id: partner-dependency-risk
    title: "Partner, Supplier, and Dependency Risks"
    body: >-
      The Bot Company's dependency profile spans four critical nodes: cloud AI infrastructure, precision
      actuator supply, contract manufacturing, and capital providers. On cloud AI, the company's LLM-based
      natural language command system depends on model providers (most likely OpenAI, Google, or Anthropic
      based on investor network and engineer backgrounds). Any pricing change, model deprecation, or
      terms-of-service modification constitutes a material operational risk for a product whose core
      intelligence is cloud-dependent. On-device model capability is mentioned in engineering job postings
      but no fallback architecture has been publicly described.

      Precision actuator sourcing is the most acute near-term supply chain risk. Actuator lead times
      reached 14 months in 2026, with capacity dominated by Asian producers. A startup without established
      volume has the weakest bargaining position; large OEMs have priority allocation. Without a disclosed
      supply agreement, The Bot Company faces a potential multi-quarter production delay at the moment it
      attempts to move from prototype to pilot production. The Schaeffler all-in-one actuator announcement
      signals supply is commoditizing but not yet at startup-accessible scale.

      Capital provider concentration is a structural risk: two rounds each relied on a small syndicate,
      and no independent board members or investor rights structures have been publicly disclosed. No
      strategic corporate investor (consumer electronics OEM, retailer, or home services company) has
      been named, meaning the company lacks a built-in distribution channel or exit acquirer relationship.
      The entire dependency graph for the company—cloud AI, actuators, contract manufacturing, cloud
      compute, retail distribution—is undisclosed, representing a blocking-level diligence gap.
    claimRefs:
      - CR048
      - CR049
      - CR050
      - CR051
