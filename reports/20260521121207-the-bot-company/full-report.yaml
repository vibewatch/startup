      - number: '7.2'
        title: Product, Technical, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              The Bot Company's core technical thesis—transferring autonomous vehicle perception and AI expertise to
              household robotics—is compelling but carries structural risk that is well-documented in the robotics
              literature and illustrated by recent hardware startup failures. The primary technical risk is the
              sim-to-real generalization gap: household environments are among the most unstructured operating domains
              in robotics, featuring unpredictable object configurations, lighting variations, cluttered floors, and
              novel surfaces that cannot be fully captured in simulation. Manipulation reliability at
              consumer-acceptance thresholds requires near-zero error rates; even occasional failures that damage
              objects or cause minor harm can be commercially disqualifying. The company's human-in-the-loop
              teleoperation system addresses generalization operationally but introduces both marginal cost structure
              (remote operator labor) and privacy exposure (operators accessing live home video) that are unresolved in
              any public disclosure.

              The iRobot/Roomba Chapter 11 filing (December 2025) is the most directly relevant market precedent. iRobot
              was the global household robotics market leader for over two decades; its revenue fell from a peak of
              approximately $1.4 billion to $682 million in 2024 before it filed for bankruptcy. The company was
              destroyed by a combination of Chinese OEM pricing pressure from Roborock, Dreame, and Ecovacs; failure to
              keep pace with feature innovation; thin hardware margins; and the collapse of its $1.7 billion Amazon
              acquisition under antitrust scrutiny in early 2024. iRobot had decades of brand equity and millions of
              units shipped; The Bot Company has shipped zero units. The Bot Company's general-purpose manipulation
              platform targets a fundamentally harder reliability problem than robotic vacuuming, with correspondingly
              higher unit economics uncertainty.

              Hardware manufacturing risk is material and under-discussed. Precision actuator lead times reached 14
              months in 2026, with supply concentrated among a small number of Asian manufacturers. The K-Scale Labs
              failure in 2025 illustrates the dangers of underinvesting in actuator reliability. The Bot Company has not
              disclosed its contract manufacturing partners, supply chain architecture, bill of materials, target unit
              economics, or planned production volumes—creating blocking diligence gaps for all critical operational
              dependencies.
            claimRefs:
              - CR011
              - CR012
              - CR013
