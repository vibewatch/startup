      - number: '7.5'
        title: Financial, Capital, and Valuation Risks
        blocks:
          - type: paragraph
            body: >-
              The Bot Company is pre-revenue and pre-product, having raised approximately $302 million across two
              primary rounds: a $150 million seed in May 2024 at a $550 million post-money valuation (Botco Inc. Form D
              confirms $150.67 million from 41 investors), and a $150 million follow-on in March 2025 led by Greenoaks
              at a $2 billion post-money valuation. Bloomberg reported in October 2025 that the company was seeking $250
              million at a valuation above $4 billion; no public confirmation of that round closing has been disclosed
              as of May 2026.

              Monthly burn for a company of this funding scale, team composition (engineers from Tesla, Cruise, OpenAI,
              Google, Pixar), and San Francisco headquarters is estimated at $3–6 million per month, implying roughly
              50–100 months of runway at software-stage spend rates. As the company enters hardware manufacturing
              phases, capital intensity will accelerate materially: tooling and NRE for consumer electronics runs
              $500K–$2 million; minimum order quantities from contract manufacturers impose inventory risk; and bill of
              materials for a robot with LiDAR, a precision arm, and edge- compute is estimated at $200–$1,000+ per unit
              at low volume.

              The valuation trajectory ($550M → $2B → $4B+) has been driven by founder reputation and market narrative
              rather than operating metrics, creating down-round risk if the company misses commercial milestones before
              the next raise. The iRobot precedent shows that hardware economics can erode even for established
              revenue-generating consumer robotics brands; for a pre-revenue entrant, the margin structure is entirely
              unproven. Investor concentration risk is present: the Greenoaks-led follow-on concentrated with a single
              lead. If market conditions deteriorate or development milestones are missed, the next raise could price at
              or below the $2 billion mark, triggering liquidation preference waterfalls for common stockholders.
            claimRefs:
