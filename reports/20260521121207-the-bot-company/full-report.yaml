      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: All Valuation Ranges Are Estimated, Not Warranted
            body: >-
              The Bot Company has zero disclosed operating metrics. Every valuation range, return estimate, and scenario
              in this chapter is inferred from comparable private rounds, public market comps, and analyst benchmarks
              applied to illustrative revenue assumptions. None of these values are company-disclosed or independently
              audited. The true valuation could be higher or lower than all ranges presented. This chapter should be
              treated as a structured speculation framework, not a valuation opinion.
            calloutType: assumption
            claimRefs:
              - CV014
              - CV015
          - type: callout
            title: The $4B+ Bloomberg Round Status Is a Material Unknown
            body: >-
              As of May 2026, no public confirmation — via press release, SEC Form D amendment, or credible press
              corroboration — has been identified confirming that the Bloomberg-reported $250M raise at $4B+ valuation
              has closed. If this round is open or has not closed, (a) total capital is $302M not $552M, (b) burn rate
              runway may be compressed below manufacturing scale-up threshold, and (c) any investor valuing TBC at $4B+
              is doing so at an unconfirmed mark. This is the most urgent single diligence ask in this report.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
          - type: callout
            title: Physical AI Sector Tailwinds Are Real but Create Valuation Distortion
            body: >-
              Q1 2026 was the record quarter for global VC ($300B deployed, $242B to AI), and robotics accounted for a
              historic share. Figure AI at $39B and Skild AI at $14B establish that pre-revenue physical AI companies
              can sustain very large private market valuations based on narrative. TBC benefits from this tailwind, but
              the tailwind can reverse: if the physical AI funding boom moderates, TBC's $4B+ targeted valuation faces a
              multiple-compression risk analogous to the 2022 SaaS multiple compression, where median revenue multiples
              fell 60–70% from peak.
            calloutType: insight
            claimRefs:
              - CV036
