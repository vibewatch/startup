      - number: '6.3'
        title: Willingness-to-pay is anchored well below likely product prices; trust, privacy, and cost are barriers
        blocks:
          - type: paragraph
            body: >-
              The Altman Solon survey (2025) provides the clearest available willingness-to-pay benchmark for The Bot
              Company's target market. Sixty-nine percent of US consumers are unwilling to pay more than $5,000 for a
              home robot. Twenty-five percent are unwilling to purchase at any price. Even among respondents who
              describe themselves as knowledgeable about humanoid robots, price expectations remain anchored in the
              $1,000 to $5,000 range. This creates a significant commercial challenge for a startup that has raised $302
              million at a $2 billion valuation and is engineering a novel general- purpose platform: the mass-market
              consumer price ceiling is substantially below where initial product economics are likely to sit.

              The consulting.us analysis of the same survey data notes that "affordability is unlikely to remain a
              barrier for long" as production scales, citing Goldman Sachs data on a 40 percent year-over-year price
              decline in humanoid robot hardware. However, the near-term gap is material: Figure AI's general-purpose
              model targets approximately $20,000, which is four to twenty times higher than the $1,000-$5,000 range
              where most consumers are anchored. The Bot Company has not disclosed a price point, so direct comparison
              is impossible, but the constraint is industry-wide. About 5 percent of consumers, the "early adopter"
              cohort, are willing to pay $10,000 or more, and this is a plausible initial beachhead for a premium-priced
              launch robot.

              Consumers value a home robot's time savings at approximately $14 per hour. Over half expect a robot to
              save six hours or fewer per week, yielding roughly $4,368 in annual value at $14 per hour — consistent
              with the $5,000 psychological ceiling. The Bot Company would need to deliver meaningful time savings with
              high reliability to justify a premium price above that threshold. This value-based pricing ceiling applies
              regardless of cost-of-goods reductions.

              Beyond price, three additional barriers are documented. First, safety: approximately 50 percent of
              consumers express concern about having a human-sized advanced robot in their home. The Bot Company's
              non-humanoid, low-profile wheeled-base design partially mitigates this, as consumers prefer "visually and
              haptically soft" robots that are smaller and less intimidating. Second, privacy: the Copeland study and
              Deloitte's 2025 Connected Consumer survey document growing concerns about smart home data collection. A
              home robot with cameras, LiDAR, and cloud-connected LLM processing will face material consumer privacy
              scrutiny. Third, implementation complexity: 28 percent of smart home users in a 2025 survey cited setup
              difficulty as a barrier. Onboarding and reliability will be critical adoption levers.

              The StudioRed/Robotics & Automation News survey (2025) of more than 200 robotics developers confirms these
              headwinds from a supply perspective: 73 percent cited high implementation cost as the greatest barrier to
              adoption; safety and reliability were the second most common concern. These data are from the developer
              community, but they align with the consumer survey picture: price and safety are the twin barrier pair
              that any home robotics launch must address.
