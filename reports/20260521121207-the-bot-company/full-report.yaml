  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder Background, Governance, and Reputational Exposure
        blocks:
          - type: paragraph
            body: >-
              Kyle Vogt's tenure as CEO of Cruise, ending with his resignation in November 2023, represents the single
              most material non-technical risk factor for The Bot Company. On October 2, 2023, a Cruise autonomous
              robotaxi in San Francisco ran over a pedestrian who had already been struck by a human- driven car, and
              then—due to a software misclassification—executed a pull-over maneuver that dragged the victim
              approximately 20 feet before stopping. The National Highway Traffic Safety Administration issued a consent
              order requiring Cruise to pay a $1.5 million civil penalty for failing to fully disclose post-crash
              details in its mandatory Standing General Order report filings. The California DMV and CPUC suspended
              Cruise's autonomous vehicle permit, citing incomplete and untimely disclosure of video evidence to
              regulators. The U.S. Department of Justice's Northern District of California pursued a deferred
              prosecution agreement under which Cruise admitted to submitting a false report with intent to influence a
              federal investigation and paid a $500,000 criminal fine.

              Vogt resigned as Cruise CEO five months before founding The Bot Company, and has not publicly addressed
              the Cruise incident in the context of his new venture's safety culture or governance model. No independent
              board members, safety advisors, or audit committee have been publicly named. Paril Jain (CTO) and Luke
              Holoubek are co-founders but carry a lower public profile; no other C-suite executives have been
              disclosed. Key-person concentration is severe: Vogt is the sole public face of the company, primary
              fundraiser, and only visible technical authority. A safety or transparency failure in a household robot
              context—an injury event, a privacy breach, or regulatory noncompliance— could catalyze identical
              regulatory and media dynamics to those that destroyed Cruise within a single news cycle, even without the
              autonomous vehicle context.

              The HumanoidLiability.com analysis of the Cruise deferred prosecution agreement notes that failing to
              report safety incidents fully to regulators constitutes a federal criminal offense, not merely a civil
              violation. This precedent applies to any company deploying autonomous systems in consumer contexts.
              Investors must independently verify whether Vogt accepted personal compliance conditions under the Cruise
              settlement that could extend to The Bot Company's governance or operations—a diligence question that
              remains publicly unresolved.
