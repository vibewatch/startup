              In-home robots that continuously record audio, video, and spatial sensor data from private residences face
              acute privacy and data security obligations. The Bot Company has published no privacy policy, data
              governance framework, or security architecture. Required consumer safety certifications (UL 3300, ISO
              13482) are also absent from any public disclosure. These gaps must be resolved before any retail-channel
              partner or data-privacy regulator would approve commercial deployment.
