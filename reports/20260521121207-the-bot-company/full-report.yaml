              With no published technical documentation, API, GitHub repository, or product demo, The Bot Company's
              active engineering job listings — for whole-body control, world models, 3D vision, simulation, ML
              compilers, firmware, and electrical systems — constitute the clearest observable signal of its technical
              priorities and development stage. This approach is consistent with early-stage stealth robotics
              development but limits external validation of architecture choices.
