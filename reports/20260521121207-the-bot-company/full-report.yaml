      - number: '8.2'
        title: Financing History, Valuation Context, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              The Bot Company's confirmed financing trajectory is: $150 million seed in May 2024 at a $550 million
              post-money valuation (42 investors per SEC Form D filed May 21, 2024 via Botco, Inc., CIK 0002024013,
              which recorded $150,669,884 raised in equity under Rule 506); $150 million follow-on in March 2025 at a $2
              billion post-money valuation, led by Greenoaks Capital. Bloomberg reported in October 2025 that TBC was
              seeking $250 million at a valuation above $4 billion. No SEC Form D amendment or press corroboration
              confirming the Bloomberg round's closure has been identified as of May 2026. Total confirmed capital: $302
              million. Potential total capital if Bloomberg round closed: up to $552 million.

              The valuation step-ups are: Seed ($550M post-money, May 2024) → Series B ($2B post-money, March 2025, 3.6x
              in 10 months) → Bloomberg round target ($4B+, October 2025, 2x+ in 7 months). The aggregate implied
              valuation progression of 7x in approximately 18 months on a pre-product company has no operating metric
              support; it is driven exclusively by sector tailwinds, founder pedigree, and investor competition for
              robotics assets. This is consistent with the 2025–2026 physical AI capital environment, where pre-revenue
              companies such as Figure AI ($39B) and Apptronik ($5B) achieved multiples that far outpace any
              revenue-based anchor.

              The capital structure carries material uncertainty: (a) the Bloomberg round status is unconfirmed,
              creating ambiguity about total capital raised and burn trajectory; (b) no disclosed cap table, no named
              anti-dilution provisions, and no disclosed liquidation preference terms are available publicly; (c)
              Greenoaks' lead position implies concentrated governance and likely 1x or higher liquidation preference
              that will front-run common shareholders in any exit below the $2 billion watermark. The company's website
              lists six investors (Greenoaks, NFDG, Spark, Eclipse, Kleiner Perkins, Y Combinator), and the SEC Form D
              recorded 42 investors at the seed, suggesting broad syndication that creates complex preference overhang
              in a down-round scenario.

              The absence of any disclosed debt, convertible notes, or venture debt simplifies the capital structure but
              also means that if the Bloomberg round did not close, the company's cash position as of May 2026 depends
              entirely on the burn rate from the confirmed $302 million base. At the estimated $3–5 million per month
              burn, TBC has approximately 5–8 years of pre-manufacturing runway from the March 2025 close — sufficient
              to reach prototype commercialization, but not to fund full manufacturing scale-up without additional
              capital.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
