      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: |
              Published analyst estimates for the total addressable market (TAM) of household robots in
              2025 span a wide range: from $10.1B (Mordor Intelligence, using a narrower product boundary)
              to $17.7B (Global Growth Insights, using a broader "smart household robot" definition that
              includes connected appliances). The most-cited cluster — Global Market Insights at $14.7B,
              Precedence Research at $14.5B, and Research and Markets/Business Research Company at $11.4B
              — suggests a central estimate of approximately $12–15B for 2025. CAGR forecasts similarly
              diverge: Mordor projects 14.87% through 2031, Global Market Insights projects 19.2% through
              2035, and the Business Research Company projects 20.4% year-on-year. All three agree the
              market will roughly double to $22–24B by 2030.

              The robot vacuum cleaner sub-market — the incumbent category most relevant to competitive
              context — is itself estimated at approximately $12.5B in 2025, growing to $14.4B in 2026
              (Global Market Insights robotic vacuum report; Fortune Business Insights). IDC, which tracks
              actual shipment data, reported that in Q1 2025 Chinese brands Roborock (19.3% share), Ecovacs
              (13.6%), Dreame (11.3%), and Xiaomi (9.9%) collectively accounted for 54% of global robot
              vacuum shipments, with iRobot at 9.3% and declining. HDIN Research estimates the robot
              vacuum market at $13.1B in 2025 with a 12% CAGR through an "embodied AI" driven expansion.

              The Serviceable Addressable Market (SAM) for The Bot Company is structurally harder to
              isolate. No published analyst report segments specifically for multi-purpose, LLM-driven,
              premium-priced ($1,500–$3,000 estimated) non-humanoid home robots. An analyst-derived
              estimate suggests the SAM sits at approximately $5–8B globally in 2025 if we attribute
              50–60% of the household robot TAM to non-humanoid chore automation platforms, then apply a
              premium-product filter. North America's ~35–38% share of global revenues translates to a
              North American market of $4–6B for all household robots, or roughly $1–2B for the premium
              AI-enabled sub-segment. These estimates carry low confidence and significant methodology risk.

              The SOM (Serviceable Obtainable Market) in the Bot Company's first five years post-launch
              is not calculable without a product price point or distribution strategy. As a scenario
              anchor, 1% penetration of the US dual-income household robot segment (approximately 15–20
              million eligible households at $100K+ income) at an assumed $2,000 price point implies
              $300–400M annual revenue. This is highly speculative at the pre-product stage and depends
              entirely on whether the company can deliver a credible product and achieve consumer trust.
              The market sizing analysis therefore preserves uncertainty rather than anchoring to a single
              large-number estimate.
