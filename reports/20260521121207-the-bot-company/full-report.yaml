      - number: '1.6'
        title: Adverse Background — Cruise Incidents and Vogt Resignation
        blocks:
          - type: paragraph
            body: |
              Any diligence on The Bot Company requires a thorough examination of Kyle Vogt's departure
              from Cruise, as it forms a significant adverse background factor. On October 2, 2023, a Cruise
              robotaxi in San Francisco struck and dragged a pedestrian approximately 20 feet after she had
              been hit by a human-driven vehicle in a separate incident. The California Department of Motor
              Vehicles subsequently suspended Cruise's autonomous vehicle deployment and driverless testing
              permits. The DMV's written suspension order alleged that Cruise had "misrepresented" the
              safety of its robotaxis and that the company withheld footage of the vehicle's subsequent
              movement after the initial collision, specifically the pullover maneuver during which the
              pedestrian remained under the vehicle. Cruise disputed these characterizations.

              Vogt resigned as CEO of Cruise on November 19, 2023, approximately six weeks after the
              October 2 incident. In his resignation statement he acknowledged the gravity of the events
              and called for renewed focus on safety and transparency. General Motors subsequently stopped
              funding Cruise's robotaxi development entirely in 2024. The DMV suspension, the fatality-
              adjacent incident, the regulatory allegation of misrepresentation, and the GM funding
              withdrawal collectively represent reputational and governance events that investors should
              weigh explicitly.

              The diligence question is not whether Vogt was technically at fault for the October 2
              accident — the pedestrian was struck first by a human-driven vehicle and the robotaxi's
              pullover behavior was argued by Cruise to be a safety protocol — but rather whether the
              regulatory allegation of withholding footage reflects on Vogt's governance posture. Vogt
              has raised $302 million for The Bot Company from sophisticated Silicon Valley investors
              who are presumably aware of this history; their participation is a signal that they have
              evaluated and accepted the risk. However, any prospective investor should conduct
              independent diligence on the California DMV record, Vogt's direct involvement in the
              post-incident response, and the implications for a company building hardware that
              will operate in consumer homes.
            claimRefs:
              - CO031
              - CO032
              - CO033
              - CO034
              - CO035
