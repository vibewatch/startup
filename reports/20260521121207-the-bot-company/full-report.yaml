            title: Sim-to-Real Gap in Unstructured Home Environments Is the Core Technical Bet
            body: >-
              The company's entire product thesis depends on sim-to-real generalization performing reliably in real
              homes, where object diversity, lighting variability, and spatial unpredictability are orders of magnitude
              greater than in controlled industrial or AV settings. This is an open research problem industry-wide with
              no published benchmark from The Bot Company. If sim-to-real transfer degrades unacceptably in homes, the
              robot will require prohibitively expensive real-world data collection and teleoperation, destroying the
              unit economics thesis.
