      - number: '2.5'
        title: Adoption Constraints and Barriers
        blocks:
          - type: paragraph
            body: |
              Counterbalancing growth drivers are several structural adoption constraints that The Bot
              Company must address. Privacy and data security concerns represent the most frequently cited
              consumer barrier: approximately 47% of potential household robot buyers express concern
              about home surveillance via cameras and microphones in connected devices. An LLM-driven
              robot that maps the home, recognizes objects, and receives natural language commands about
              household routines necessarily collects and processes sensitive in-home behavioral data. Data
              governance design — where data lives, who can access it, how it is used — will be a
              first-tier product requirement for mainstream consumer adoption, not just a legal compliance
              check.

              Certification timelines create a structural pre-launch risk. US market entry for any
              household robot requires UL 3300 safety certification (covering electrical, mechanical, and
              functional safety for service robots), FCC authorization for wireless communications, and
              increasingly, state-level data privacy compliance (CCPA in California, similar laws
              emerging in 15+ states). EU market entry requires CE marking and EN IEC 60335-2-107
              compliance for cleaning robots, plus General Product Safety Directive adherence. Combined
              certification timelines for a new hardware product with AI components are estimated at 12–24
              months from design freeze, implying that any product targeted for a 2026 or 2027 launch
              required certification testing to commence no later than mid-2024 or mid-2025.

              Chinese manufacturing dominance in the robot vacuum category — with Roborock, Ecovacs,
              Dreame, and Xiaomi collectively controlling 80%+ of volume — establishes a price-performance
              floor that The Bot Company must compete above, not against. iRobot's December 2025 Chapter
              11 bankruptcy filing is instructive: iRobot held ~9% global market share with 15+ years of
              brand equity in the premium robot vacuum segment and was outcompeted on price/features by
              Chinese platforms. For The Bot Company to succeed, its multi-purpose AI platform must be
              differentiated enough from single-function vacuums that Chinese platforms cannot simply add
              the same capabilities at lower cost — a risk that requires ongoing monitoring as Ecovacs and
              Roborock have both signaled "embodied AI" product roadmap investments.

              Consumer skepticism about real-world utility versus marketing claims is an additional trust
              barrier. No commercially available multi-purpose household robot currently validates that
              the consumer problem — "a robot that does all my chores" — is technically solvable at the
              price point and reliability level that drives mainstream adoption. Early adopters will
              tolerate imperfect products; mass market adoption requires demonstrable reliability that has
              not been established in any existing product.
