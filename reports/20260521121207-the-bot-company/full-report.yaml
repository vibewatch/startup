  - id: FE002
    title: 'Customer Workflow: Home Robot Operating Flow'
    type: flow
    layout: standard
    summary: >-
      Six-step user workflow from initial home setup through recurring autonomous execution, based on company-claimed
      and third-party-reported descriptions.
    data:
      nodes:
        - label: Initial Setup
          detail: User rolls robot through home; LiDAR + cameras build 3D map
        - label: Zone Labeling
          detail: Companion app used to label pickup zones, drop bins, and restricted areas
        - label: Object Training
          detail: User photographs household objects to train recognition model
        - label: Voice / App Command
          detail: User issues natural language command (e.g. put the Legos in the blue bin) or schedules recurring routine
        - label: AI Planning & Execution
          detail: LLM decomposes command; whole-body control executes navigation and arm manipulation
        - label: Fleet Learning
          detail: Edge cases resolved via human-in-the-loop teleoperation; fix distributed to fleet via OTA update
      edges:
        - from: Initial Setup
          to: Zone Labeling
        - from: Zone Labeling
          to: Object Training
        - from: Object Training
          to: Voice / App Command
        - from: Voice / App Command
          to: AI Planning & Execution
