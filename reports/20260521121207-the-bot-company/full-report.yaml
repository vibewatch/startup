      - number: '1.3'
        title: Funding History and Investors
        blocks:
          - type: paragraph
            body: |
              The Bot Company has raised approximately $302 million in total disclosed funding across two
              primary rounds, achieving a reported $2 billion post-money valuation as of March 2025 —
              less than one year after its founding announcement. The speed and scale of its capital
              formation is exceptional even by Silicon Valley venture standards, particularly for a
              pre-product hardware company.

              The initial $150 million seed round, announced in May 2024, carried a $550 million post-money
              valuation according to Forbes reporting citing multiple sources. Investors in this round
              included Nat Friedman (former GitHub CEO and AI-focused investor), Daniel Gross (Pioneer
              founder and investor), Nabeel Hyatt (general partner at Spark Capital), Patrick Collison
              (Stripe CEO), John Collison (Stripe co-founder), Quiet Capital, Elad Gil, and Fifty Years.
              The syndicate was notable for the density of prominent Silicon Valley operators and investors
              who rarely lead seed rounds of this size.

              A second round of $150 million was closed in March 2025, led by Greenoaks (a San Francisco
              global investment firm that has underwritten billion-dollar valuations for early-stage
              technology companies). This round valued the company at $2 billion post-money, roughly a
              3.6x step-up from the seed valuation in under twelve months. As of the company's website in
              May 2026, the stated investor roster also includes Eclipse, Kleiner Perkins, and Y Combinator,
              which were not named in earlier rounds, suggesting additional closes or a new round between
              the $2 billion Greenoaks round and the report date. In October 2025, Bloomberg reported that
              the company was seeking an additional $250 million in a round that would value it above $4
              billion, nearly doubling the valuation from eighteen months earlier. The status of that round
              as of the report date is not confirmed; it may have closed, partially closed, or remained
              outstanding.
