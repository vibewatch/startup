      - number: '2.3'
        title: Buyer and Segment Landscape
        blocks:
          - type: paragraph
            body: |
              The household robot market's current buyer is concentrated in mid-to-high income urban
              households with strong smart-home device adoption. Primary buyer demographics are dual-income
              households (25–50 years old) with household income above $75,000 and at least one child or
              pet — a cohort with high time scarcity relative to discretionary income, making them
              receptive to automation at a premium price. The U.S. per capita disposable income exceeded
              $57,800 in 2023 and continues to grow, supporting willingness to invest in premium home
              technology in this income tier. Early adopters in the premium robot category are
              disproportionately in major metro areas (New York, San Francisco, Los Angeles, Boston,
              Seattle) where dual-income professional households are most dense.

              The secondary buyer segment with the highest long-term growth potential is the elder care
              household: adults aged 65+ or their caregivers who are seeking household assistance for
              mobility-limited individuals. Japan, Germany, and the United States exhibit the highest
              elder-care robot adoption intent in consumer surveys. This segment faces a different set of
              purchase triggers (concern about falls, care burden, cost of in-home aides) and price
              sensitivity, and may require different product configuration than the primary premium segment.

              Short-term rental operators (Airbnb/VRBO hosts managing 2+ properties), small office
              operators, and elder care facility administrators represent additional segments the company
              has signaled as targets. These B2B-adjacent segments have defined operational cost problems
              (cleaning labor turnover, between-stay turnaround time) and measurable ROI thresholds, but
              typically purchase via procurement channels and require different sales motions than
              consumer DTC.

              E-commerce and direct-to-consumer channels account for approximately 55% of household robot
              sales globally in 2025, with retail partnerships making up the remainder. The dominant
              distribution model for premium robot products in North America is DTC online (company
              website), supplemented by Amazon and Best Buy — the same channels through which competitors
              like Roborock and Ecovacs successfully expanded from APAC into Western markets.
