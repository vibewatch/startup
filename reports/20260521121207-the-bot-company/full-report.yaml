  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Taxonomy
        blocks:
          - type: paragraph
            body: |
              The household robotics market encompasses electromechanical devices designed to autonomously
              execute domestic tasks inside or around a residential property. By analyst consensus, the
              market is segmented into floor-cleaning robots (robotic vacuums and mops, the largest segment
              at ~48% of revenues in 2025), outdoor maintenance robots (lawn mowers, pool cleaners, the
              fastest-growing sub-segment), companion and elderly assistance robots, and security or
              surveillance robots. The market explicitly excludes industrial service robots, commercial
              floor-scrubbing robots used in warehouses or offices, medical assistive devices regulated as
              class-II or class-III medical equipment, and bipedal humanoid robots designed for general
              manipulation tasks at commercial scale (a separate and more nascent category).

              Adjacent spend pools overlap but are separately measured. The smart home market — covering
              connected thermostats, voice assistants, smart speakers, security cameras, and home
              automation infrastructure — is estimated at $133–182B globally in 2025–2026. Household
              robots that integrate with smart home ecosystems (voice-controlled cleaning robots, robotic
              vacuum cleaners linked to Google Home or Amazon Alexa) participate in both markets. Annual
              US household spending on domestic services — cleaning, yardwork, and home maintenance labor
              — averages approximately $600–$800 per household per year, representing the budget pool that
              premium home robots ultimately compete against as substitutes for human labor.

              The Bot Company's thesis occupies a sub-segment not yet cleanly carved out in any current
              analyst report: a multi-purpose, non-humanoid AI platform capable of executing diverse
              chores via natural language commands. Existing market reports bucket all cleaning robots
              together regardless of functional breadth, which significantly understates the premium
              addressable opportunity for a platform product while simultaneously obscuring the absence of
              proven consumer demand at the price point required to justify The Bot Company's hardware
              development costs.

              Status-quo substitutes for the intended product include: (1) existing single-function
              robotic vacuums (iRobot Roomba, Roborock, Ecovacs) for floor cleaning; (2) domestic
              cleaning services engaged weekly or bi-weekly; (3) dedicated small-appliance solutions for
              specific tasks (steam mops, window squeegees, dishwashers); and (4) personal time investment.
              Each substitute competes on cost, trust, and task coverage, and The Bot Company's product
              must beat all four simultaneously on value to achieve broad adoption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
