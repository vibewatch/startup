companyProfile:
  summary: >
    The Bot Company is a San Francisco-based household robotics startup founded in May 2024 by Kyle Vogt (former CEO of
    Cruise, co-founder of Twitch), Paril Jain (former Tesla AI lead and CTO), and Luke Holoubek (former Cruise
    engineer). The company is developing non-humanoid, AI-powered home robots that automate everyday chores via natural
