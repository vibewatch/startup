  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Hardware Design
        blocks:
          - type: paragraph
            body: >-
              The Bot Company's core product is a non-humanoid household robot built around a wheeled mobile base, a
              single articulated robotic arm, and a set of interchangeable end-effectors. The deliberate choice to forgo
              a humanoid form reduces cost, complexity, and balance-control requirements while enabling the robot to
              operate stably in cluttered home environments. The reported form factor resembles a low coffee table on
              wheels, providing a low center of gravity and minimal tipping risk around children and pets. The arm can
              handle most household objects reported to be under approximately 1 kilogram, with interchangeable
              end-effectors including grasping grippers and suction-cup-style attachments for varied surface
              interactions. A 10-liter detachable bin collects gathered objects. Sensing is multi-modal: RGB cameras and
              LiDAR sensors generate continuous 3D point clouds for mapping and localization, directly mirroring the
              sensor fusion approach developed at Cruise for autonomous vehicles. Safety hardware includes soft bumpers,
              torque limits on the arm, and redundant proximity sensing. None of these design details have been formally
              published in a product spec sheet; all currently derive from company statements, investor coverage, and
              third-party analysis.
