      - number: '7.4'
        title: Regulatory, Legal, and Product Liability Risks
        blocks:
          - type: paragraph
            body: >-
              Consumer household robots operate in a complex and evolving regulatory environment. The Consumer Product
              Safety Commission (CPSC) is the primary federal agency governing product safety for household goods; it
              can mandate recalls and impose civil penalties under Section 15 of the Consumer Product Safety Act. The
              Bot Company has not disclosed any safety certifications—including UL 3300, ISO 13482, or the developing
              IEC 63327 household service robot standard—as of May 2026. Major retail channel entry typically requires
              UL listing, creating a path-to-market gate not yet addressed publicly.

              Federal Trade Commission jurisdiction over privacy, data security, and deceptive practices for connected
              home devices is established and active. Arnold & Porter's April 2026 advisory confirms that CPSC has
              expanded recall authority for software-driven consumer products. Product liability exposure for a mobile
              in-home robot with a powered arm includes tort claims under design defect, manufacturing defect, and
              failure-to-warn theories; any injury to a human or pet creates litigation risk. The HumanoidLiability.com
              analysis of the Cruise deferred prosecution agreement establishes that failing to report safety incidents
              fully to regulators is a federal criminal offense, not merely a civil violation—setting precedent for all
              companies deploying autonomous consumer systems.

              Internationally, the EU General Product Safety Regulation (GPSR) became effective December 2024 and
              imposes ongoing safety, cybersecurity, and traceability obligations for AI-driven consumer products sold
              in the EU. The revised EU Product Liability Directive (effective December 2026) expands strict liability
              for harm caused by defective AI-embedded products. Osborne Clarke's analysis of consumer robotics
              regulation confirms manufacturers now face a multi-layered compliance burden across GPSR, EU AI Act, Cyber
              Resilience Act, and GDPR. No regulatory filings, certifications, or enforcement actions involving The Bot
              Company have been publicly disclosed—which is stage-appropriate but will become a gate for commercial
              launch.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
