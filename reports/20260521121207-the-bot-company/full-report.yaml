            body: >-
              The founding team's hands-on experience building Cruise's autonomous vehicle perception and AI stack —
              mapping, object detection, sensor fusion, and fleet-scale learning — directly transfers to household
              robotics. The engineering depth for sensor fusion and sim-to-real transfer is among the strongest in the
