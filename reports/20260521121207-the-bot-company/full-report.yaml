      - number: '1.4'
        title: Snapshot Metrics and Scale
        blocks:
          - type: paragraph
            body: |
              As a private pre-product company, The Bot Company does not publicly disclose financial
              or operational metrics, and the gaps in verifiable data are the defining characteristic of
              its diligence profile. Total funding raised is confirmed at approximately $302 million across
              at least two rounds through March 2025, with the investor roster suggesting additional
              capital may have been raised between March 2025 and the report date. Valuation is confirmed
              at $2 billion post-money as of March 2025 from the Greenoaks-led round; the Bloomberg-
              reported $4 billion-plus valuation for a prospective subsequent round is unconfirmed as of
              May 2026.

              Revenue is zero — the company is explicitly pre-product and pre-revenue, and no product has
              been commercially launched. Headcount is not publicly disclosed; the company's website
              describes it as "a small team" based in San Francisco and its investors cite its status as
              an early-stage venture. In 2024, the company was described in early reporting as a "months-old
              company." By the time of the March 2025 round, the company had been operating for roughly
              ten months. Engineering and AI talent has been recruited from Tesla, Cruise, OpenAI, Google,
              and Pixar, implying a team with deep technical pedigree even at small scale.

              No customers, partnerships, pilots, or commercial deployments have been publicly disclosed
              as of the report date. The robot prototype itself — described as a coffee-table-height
              platform with a 4-DOF arm — has been covered in secondary research summaries and database
              profiles, but the company has not publicly demonstrated a working product. The primary
              metrics that matter to investors at this stage are the pedigree of the founding team, the
              pace of capital formation, and the valuation trajectory, all of which are strongly positive.
              The gaps in customer, revenue, headcount, and product data are characteristic of the
              company's stage and should not be interpreted as concealment but as pre-launch posture.
            claimRefs:
