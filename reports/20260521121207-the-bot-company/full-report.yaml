      - number: '6.4'
        title: Channel strategy is undisclosed; DTC online and eventual retail are the most probable paths
        blocks:
          - type: paragraph
            body: >-
              The Bot Company has not publicly disclosed its sales channel, pricing model, distribution partnerships, or
              retail strategy as of May 2026. The company's website (bot.co) functions as an awareness and
              interest-capture surface; visitors can submit contact information for updates, which is consistent with an
              early-funnel waitlist or pre-order model common in direct-to-consumer hardware launches. No partner
              announcements, retail placement discussions, or enterprise channel agreements have been disclosed.

              The most probable go-to-market path, given the company's consumer focus and San Francisco location, is a
              direct-to-consumer hardware launch with online sales as the primary channel. This mirrors the approach of
              other premium consumer robotics brands. DTC allows full margin capture, brand control, and rich
              post-purchase data collection. However, it carries high customer acquisition cost, requires investment in
              logistics and support infrastructure, and limits discovery to consumers who already know the brand. A
              follow-on retail path through electronics and home goods retailers — Best Buy, Costco, Apple Stores, or
              similar — would accelerate reach but require distribution-ready packaging, retail economics (35-45 percent
              gross margins), and trade marketing investment.

              The company's described business model combines upfront hardware sales with a recurring software
              subscription. This two-part revenue model is standard in premium consumer devices (see: Peloton,
              Roomba/iRobot) but historically difficult to execute: hardware margins are thin in consumer electronics,
              and subscription attachment rates depend heavily on perceived ongoing value. The Bot Company has not
              disclosed a target hardware price, a subscription price, or a projected hardware-to-subscription
              conversion rate. These are material unknowns for any revenue model assessment.

              The silicon.co.uk reporting on the March 2025 funding round noted explicitly that "The Bot Company has no
              customers, no products and no revenue, and is still building hardware and AI software" — confirming that
              the company is in pure product development mode and has not yet operationalized any go-to-market function.
              The window between now and first commercial launch is an evidence gap that cannot be closed without the
              company voluntarily disclosing its timeline.
