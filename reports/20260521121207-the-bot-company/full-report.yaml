      - number: '5.5'
        title: Trust, Safety, Compliance, and Critical Risks
        blocks:
          - type: paragraph
            body: >-
              Safety features reported for the robot include soft bumpers, torque-limited joints, and redundant
              proximity sensing, reflecting AV-derived principles for operating near humans and pets. Privacy risks for
              in-home robots are structurally significant: continuous video, LiDAR, and audio sensing throughout a
              household generates highly sensitive ambient data. The Bot Company has not published a privacy policy,
              data handling specification, or security architecture for its in-home product as of May 2026. No safety
              certifications — including UL 3300 (US service robot standard), ISO 13482 (personal care robots), or IEC
              63327 (in development household service robot standard) — have been disclosed. Regulatory compliance for
              consumer household robots in the United States currently lacks a mandatory certification regime, but major
              retail channels typically require UL or equivalent listing. The absence of public safety and compliance
              disclosure at this stage is age-appropriate for a pre-launch R&D-stage company but represents a future
              gate for commercial deployment. The most critical technical risks are: (1) sim-to-real generalization in
              the unstructured, high-variability home environment where novel objects, lighting, and cluttered layouts
              degrade model performance; (2) the manipulation reliability floor required for consumer acceptance — even
              occasional errors that damage objects or cause minor injuries would be commercially disqualifying; (3)
              hardware cost structure for consumer price points, which requires actuator and sensor costs well below
              current off-the-shelf market prices; and (4) privacy/data governance architecture required before
              deployment in family homes.
