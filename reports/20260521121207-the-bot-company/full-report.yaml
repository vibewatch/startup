      - number: '8.5'
        title: Dilution, Exit Readiness, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              The Bot Company's capital structure carries preference overhang that materially affects return
              calculations for any investor other than the most senior preferred holders. The confirmed $302 million in
              capital consists entirely of venture equity, with Greenoaks leading the $2 billion round. Standard venture
              preferred terms in late-2025 rounds of this type typically include 1x non-participating liquidation
              preference, meaning preferred investors receive their invested capital back before common shareholders in
              any exit. At $302 million in invested capital, the preference waterfall at a $400–500 million exit would
              return invested capital to preferred holders with minimal to no proceeds for common shareholders
              (founders, employees). The 42 investors at the seed further complicates the waterfall.

              If the Bloomberg round ($250 million at $4B+ valuation) closed, entry-price dilution for earlier investors
              is limited given the step-up valuation, but the $250 million additional preference layer raises the
              minimum exit threshold before common shareholders participate to approximately $552 million. This means a
              $1 billion exit would return roughly 80 cents on the dollar for seed investors (paid out via preference +
              participation) and likely less for common. A $4 billion exit returns approximately 1x for the
              Bloomberg-round investors and 2x for the $2 billion-round investors — not exceptional returns given a 5+
              year hold for an inherently risky hardware startup.

              Exit pathways in the 2030–2032 window include: (1) strategic acquisition by a major consumer technology or
              household device company (Amazon, Google, Samsung, Apple) seeking to acquire a robotics AI platform and
              fleet dataset; (2) acquisition by a major Chinese consumer electronics manufacturer seeking Western
              distribution and AI differentiation; (3) public market listing if TBC achieves revenue scale and the
              physical AI IPO window opens. The M&A environment in 2025–2026 shows strong strategic buyer appetite for
              AI hardware assets, with AI M&A accounting for approximately 50 percent of tech M&A by value in 2025 and
              global M&A deals valued above $4.9 trillion. TBC has no disclosed strategic corporate investor, meaning no
              built-in buyer has pre-positioned for an acquisition — a risk relative to peers (e.g., Apptronik/Google,
              Agility Robotics/Amazon, Fourier/SoftBank).

              IPO readiness is zero as of the report date: no revenue, no customer count, no public product launch, and
              no demonstrated unit economics. Even in an optimistic scenario, a TBC IPO would not occur before 2029–2031
              at the earliest. The Q1 2026 slowdown in US IPO markets (21 venture-backed companies above $1 billion
              exiting globally, with only 4 from the US) further illustrates the timing uncertainty for a
              hardware-dependent IPO thesis.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.6'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for The Bot Company can break on six distinct trigger sets, each with a specific
              threshold, transmission mechanism, and action implication. The most critical structural triggers are: (1)
              failure to demonstrate a commercial-reliability manipulation benchmark before the next fundraise — without
              empirical evidence of task success rates, any future valuation increase lacks credibility and no new
              capital should be committed; (2) a safety incident (injury to a household member, pet, or property
              damage), which would activate regulatory, media, and reputational dynamics analogous to the Cruise
              pedestrian incident with potentially faster impact given Vogt's public profile; (3) the Bloomberg
              fundraise not having closed as of the report date, meaning the company's cash position may be materially
              lower than the potential $552 million total implies, compressing the runway to manufacturing launch.

              Final diligence asks are organized around the six most critical information gaps that cannot be resolved
              from public sources but would materially change the investment recommendation. The highest-priority asks
              are: (a) a live product demonstration with published success-rate benchmark; (b) confirmation of whether
              the Bloomberg round closed and on what terms; (c) current capitalization table, preference terms, and burn
              rate as of Q1 2026; (d) contract manufacturing, actuator, and supply chain disclosure; and (e) personal
              compliance diligence on Kyle Vogt relative to the Cruise DOJ deferred prosecution agreement.
            claimRefs:
              - CV033
              - CV034
              - CV035
