  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver/Constraint
      - Direction
      - Timing
      - Implication for Bot Company
      - Diligence Ask
    rows:
      - - Smart home ecosystem proliferation (65%+ new robots ecosystem-integrated by 2026)
        - Driver
        - Near-term (1–3yr)
        - Integration with Alexa/Google Home/Apple HomeKit lowers onboarding friction; LLM control augments this
        - What smart home platforms will the robot natively support at launch?
      - - Aging population in US, EU, Japan (CAGR 16–17% for elder care robots)
        - Driver
        - Medium-term (3–7yr)
        - Expands addressable elder care buyer segment; potential policy tailwinds for assistive devices
        - Does Bot Company have elder care product variants or care facility partnerships planned?
      - - Falling sensor and compute costs (30%+ cost reduction 2018–2025)
        - Driver
        - Ongoing
        - Allows Bot Company to hit sub-$2,500 target price with LiDAR + edge AI while maintaining margin
        - What is projected BOM cost and gross margin at target consumer price point?
      - - LLM natural language control (qualitative usability step-function)
        - Driver
        - Near-term (1–3yr)
        - Core Bot Company product thesis; first credible competitor to exploit this capability for home robots
        - What task-completion coverage does LLM model achieve at launch? Edge-case failure rate?
      - - Chinese manufacturing dominance (Roborock/Ecovacs/Dreame/Xiaomi >80% of volume)
        - Constraint
        - Ongoing
        - Sets price-performance floor Bot Company must exceed; Chinese brands signaling 'embodied AI' roadmaps
        - Will Bot Company manufacture in US or outsource to Asia? What is supply chain resilience strategy?
      - - Privacy and data security concerns (47% of buyers express concern)
        - Constraint
        - Near-term (pre-launch)
        - In-home cameras + cloud AI = consumer trust barrier; data governance must be first-tier product design
        - What encryption, data sovereignty, and consent model is planned? CCPA/GDPR compliance posture?
      - - Certification requirements (UL 3300, FCC, CE/IEC 60335; 12–24 months)
        - Constraint
        - Pre-launch critical path
        - Missed certification start = launch delay; 2026 launch requires testing to have begun in 2024–2025
        - Has Bot Company begun pre-certification testing? What is current certification status?
      - - iRobot December 2025 Chapter 11 bankruptcy (premium US brand failed)
        - Signal/Constraint
        - Current (adverse signal)
        - US premium robot brand with 15yr+ equity could not compete; single-function differentiation is not a moat
        - >-
          Does Bot Company's platform differentiation sustain premium pricing vs. low-cost Chinese multi-function
          robots?
      - - Consumer switching cost advantage (household layout training, learned habits)
        - Driver
        - Medium-term
        - Robot that learns home layout creates lock-in once deployed; per-household first-mover advantage
        - What is Bot Company's household-onboarding and incremental learning model? Data portability policy?
      - - Capital intensity of hardware development (NRE, tooling, supply chain)
        - Constraint
        - Ongoing (pre-revenue)
        - Hardware NRE, tooling, and supply chain require significant capital; $302M raised provides runway estimate
        - What is annual burn rate and projected runway to first commercial shipment?
    notes: >-
      Drivers and constraints synthesized from Mordor Intelligence, Global Market Insights, IDC, makerstations.io, and
      economy.ac market reports, plus iRobot bankruptcy reporting (HDIN Research, IDC iRobot article, December 2025).
      Timing estimates are analyst-inferred; certification timelines are industry estimates.
