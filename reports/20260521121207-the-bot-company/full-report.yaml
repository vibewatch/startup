      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: |
              Five structural drivers support the household robot market's projected 14–20% CAGR through
              2031. First, smart home ecosystem proliferation: the global smart home market has grown to
              $133–182B in 2025–2026, creating a large installed base of voice-controlled, app-connected
              home infrastructure. Over 65% of new consumer robots are expected to be designed for smart
              home ecosystem integration by 2026, reducing the friction of deploying a new robot into an
              existing home setup. The Bot Company's stated LLM control interface plays directly into this
              expectation.

              Second, aging population demographics. Populations in Japan, Germany, South Korea, Italy,
              and the United States are aging faster than care infrastructure is expanding. Eldercare
              robot demand is projected at a CAGR of 16–17% through 2031, faster than the overall
              household robot market. Third, falling sensor and compute costs: the average price of LiDAR,
              RGB-D cameras, and edge compute modules has declined by more than 30% since 2018, enabling
              AI feature density in mid-range hardware that was cost-prohibitive even three years ago.
              This directly improves the bill-of-materials economics for a premium but non-luxury product.

              Fourth, and most directly relevant to The Bot Company: natural language processing
              integration via LLMs represents a qualitative step-change in robot usability. Prior
              household robots required app-based scheduling or button commands; an LLM-controlled robot
              responds to voice or text commands like "clean under the dining table and put the toys in
              the bin." The adoption thesis requires demonstrating that this usability improvement drives
              consumer preference above cleaning-only robots at a higher price point. Fifth, the dual-
              income labor scarcity dynamic: with both partners employed and time valued at $30–$100+
              per hour implicitly, a $2,000 robot that saves five hours per week pays back in under a year
              by this calculus — a compelling ROI narrative that has not yet been substantiated in
              consumer willingness-to-pay surveys for multi-purpose robots.
