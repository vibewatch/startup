      - number: '5.2'
        title: AI and Software Stack
        blocks:
          - type: paragraph
            body: >-
              The intelligence layer is built around large language models (LLMs) that interpret natural language voice
              commands — for example, "put the Legos in the blue bin" — and decompose them into multi-step physical
              action plans. Kyle Vogt has described this as giving robots "all the brains of an LLM," translating the
              ChatGPT-era generalization capability into physical world action. The company is actively building three
              core ML subsystems, as evidenced by its engineering job postings: whole-body control policies that
              co-ordinate the mobile base and arm in real time; spatiotemporal world models that generate and simulate
              video sequences for predictive planning and sim-to-real training data; and 3D vision pipelines that fuse
              geometric computer vision with deep learning for real-time object recognition and scene understanding.
              Underpinning these is a simulation-to-real (sim-to-real) pipeline in which reinforcement learning agents
              are trained in GPU-scale simulated environments and then transferred to physical hardware. An ML compiler
              team converts multi-billion-parameter models for deployment on edge robot processors with latency and
              power constraints. Firmware and motor-control engineers manage the low-level interface between software
              and actuators. The AI core is designed to be cloud-updatable so edge-case fixes discovered in one robot's
              operation are distributed fleet-wide without hardware recalls. The architecture is full-stack and
              vertical: hardware, firmware, robot OS, perception, AI planning, and user interface are all built
              in-house, following the integration philosophy Vogt applied at Cruise.
