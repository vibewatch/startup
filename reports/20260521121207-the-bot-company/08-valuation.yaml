      statement: >-
        The recommendation is Conditional Hold / Research-More: entry cannot be recommended at
        $4 billion or above without a live product demonstration, manipulation benchmark, and
        confirmed capital adequacy through manufacturing scale-up; the $2 billion confirmed mark
        is defensible against comparable private rounds but remains high-risk.
      type: inferred
