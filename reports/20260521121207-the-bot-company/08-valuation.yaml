      All private company valuations are last-round post-money from publicly reported financing events;
      they are not independently audited and may differ from internal cap table marks. Ecovacs EV/revenue
      multiple is as of May 21, 2026 and reflects public market conditions on that date. The TBC row
      reflects only the March 2025 confirmed $2B mark; the Bloomberg-reported $4B+ target is excluded
      as unconfirmed. Comparability limitations are material: all private comps operate in different
      segments (industrial-first) or have strategic backers absent from TBC's known cap table.

  - id: TV005
    title: "Thesis-Break and Kill Triggers Table"
    summary: "Specific observable triggers that would break or confirm the investment thesis, with threshold, transmission mechanism, and action implication."
    columns:
      - Trigger
      - Measurable Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - "No product demo by mid-2027"
        - "No public demo or investor demo with manipulation benchmark by Q2 2027"
        - "Implies 2028+ commercial launch timeline, burning runway before revenue; raises sim-to-real risk to blocking"
        - "Decline follow-on; demand milestone gating for any new capital commitment"
      - - "Safety or privacy incident"
        - "Any public injury event, CPSC complaint, FTC inquiry, or home surveillance breach"
        - "Activates Cruise-precedent regulatory and media spiral; Vogt history compounds severity 3–5x vs unknown founder"
        - "Immediate exit if in-market; zero new capital; engage legal team on fiduciary obligations"
      - - "Bloomberg round not closed"
        - "No SEC Form D amendment from Botco Inc. through 2026; no press confirmation of close"
        - "Total capital is $302M not $552M; burn runway compresses 35%; manufacturing capital gap is exposed"
        - "Require confirmation of capital status from company before next commitment; adjust runway model to $302M base"
      - - "Chinese OEM ships manipulation-capable consumer robot below $2,000"
        - "Roborock or Ecovacs announces a manipulation-arm consumer product at consumer pricing within 18 months"
        - "First-mover window closes; TBC's primary competitive advantage (whitespace) is eliminated; pricing power erodes"
        - "Review position; reduce entry price expectation at next round; require distribution partner announcement"
      - - "Key person departure (Vogt resignation or incapacitation)"
        - "Any public announcement of Kyle Vogt departure as CEO"
        - "Removes primary fundraiser, technical vision, and public market credibility; capital access risk elevated"
        - "Trigger protective provisions if available; evaluate recapitalization or sale process"
      - - "Down-round financing"
        - "Any new financing round at valuation below $2 billion"
        - "Confirms commercialization failure or market condition deterioration; anti-dilution provisions activate"
        - "Mark to market; review governance rights; determine if anti-dilution protection is available; consider exit"
    claimRefs:
      - CV033
      - CV034
      - CV035
    notes: >-
      Triggers are defined as observable, publicly reportable events — not internal or non-public
      developments that would only become visible to investors through private diligence. All thresholds
      are calibrated to worst-case detection scenarios (i.e., earliest possible public signal). Trigger
      probabilities are not assigned; each trigger represents a condition the investor should monitor
      continuously rather than an expected outcome.

  - id: TV006
    title: "Final Diligence Asks Table"
    summary: "Highest-priority unresolved evidence gaps that would materially change the investment recommendation, ranked by urgency."
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - "Product Demonstration"
        - "Live or investor-witnessed robot demo with published household manipulation success rate across 5+ task types"
        - "Without empirical reliability data, the sim-to-real risk is unquantifiable; no valuation above $500M can be independently justified"
        - "Request from company under NDA; require benchmark protocol (e.g., tasks/hour, error rate, object variety tested)"
      - - "Bloomberg Round Confirmation"
        - "Confirmation of whether the Oct 2025 Bloomberg $250M raise at $4B+ valuation has closed and on what terms"
        - "Determines total capital and runway; $250M difference materially changes burn model and risk of capital gap before manufacturing"
        - "Check SEC EDGAR for Botco Inc. Form D amendment; request capital table from company; review press wires for close announcement"
      - - "Capital Table and Burn Rate"
        - "Current capitalization table, preference terms, liquidation waterfall, and confirmed monthly burn as of Q1 2026"
        - "Required to model investor returns at each scenario valuation and to assess preference overhang risk in a down-round"
        - "Request from company under NDA; cross-check with Greenoaks and other lead investors"
      - - "Supply Chain and Manufacturing Partners"
        - "Contract manufacturer, actuator supplier, LiDAR vendor, and cloud AI provider disclosures"
        - "14-month precision actuator lead times create production delay risk; unconfirmed supply chain is a blocking operational risk"
        - "Request supply chain disclosure under NDA; reference-check with manufacturing consultants familiar with robotic actuator market"
      - - "Vogt DPA Personal Compliance"
        - "Whether Kyle Vogt accepted personal compliance obligations under the Cruise DOJ DPA that extend to TBC operations"
        - "Any personal compliance conditions could constrain TBC governance, reporting, or regulatory posture with material operational impact"
        - "Request legal opinion from Vogt counsel; review publicly available DPA text; confirm with lead investors what background diligence was conducted"
      - - "Distribution Strategy"
        - "Named retail, DTC, or channel partner for commercial product launch"
        - "Consumer hardware without distribution is commercially non-viable; no channel partner = no path to customer acquisition at scale"
        - "Request partner disclosure from company; evaluate LOIs or pilot agreements with named retail or DTC channels"
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV030
    notes: >-
      Diligence asks are ranked by urgency to change the recommendation. Items 1 and 2 (product demo
      and Bloomberg round confirmation) are pre-commitment blocking items — no investment should be made
      without resolving them. Items 3–6 are required for full underwriting but can be obtained in parallel
      with Items 1–2. All items require direct company engagement or SEC EDGAR lookup; none can be resolved
      from public sources alone.

figures:
  - id: FV001
    title: "Recommendation Logic: Evidence Chain from Market, Proof, Risk, and Valuation to Recommendation"
    type: flow
    layout: wide
    summary: >-
      Logic chain from the four primary input dimensions — market opportunity, product proof,
      risk assessment, and valuation context — through intermediate judgments to the final
      recommendation. All node weights are qualitative.
    data:
      nodes:
        - id: market
          label: "Market Opportunity\n$85B TAM by 2035\n19–25% CAGR\nWhitespace confirmed"
          type: input
        - id: proof
          label: "Product Proof\nZero: no demo, no launch\nno benchmark, no customers\nSim-to-real unquantified"
          type: risk
        - id: risk_level
          label: "Risk Assessment\nHigh — founder overhang\nChinese OEM threat\niRobot precedent"
          type: risk
        - id: valuation
          label: "Valuation Context\n$2B confirmed\n$4B+ Bloomberg (unconfirmed)\nComps: $2B–$39B peer range"
          type: process
        - id: thesis_support
          label: "Thesis Support\nSector tailwinds strong\nCapital access confirmed\nTeam pedigree real"
          type: process
        - id: thesis_gap
          label: "Thesis Gap\nNo operating proof\nNo supply chain\nNo distribution"
          type: risk
        - id: entry_discipline
          label: "Entry Discipline\n$2B: hold for long-dated\n$4B+: withhold pending\nmilestones"
          type: process
        - id: recommendation
          label: "Recommendation\nConditional Hold /\nResearch-More\nConfidence: Medium-Low"
          type: output
      edges:
        - from: market
          to: thesis_support
          label: "TAM validates"
        - from: proof
          to: thesis_gap
          label: "Zero evidence"
        - from: risk_level
          to: thesis_gap
          label: "Amplifies downside"
        - from: valuation
          to: entry_discipline
          label: "Prices the option"
        - from: thesis_support
          to: entry_discipline
          label: "Supports $2B"
        - from: thesis_gap
          to: entry_discipline
          label: "Blocks $4B+"
        - from: entry_discipline
          to: recommendation
          label: "Conditional hold"
    approximationNotes: >-
      Logic chain is qualitative. Node weights are not empirically calibrated.
      The flow reflects the analyst's judgment given the evidence available as of May 2026.
    claimRefs:
      - CV001
      - CV002
      - CV003

