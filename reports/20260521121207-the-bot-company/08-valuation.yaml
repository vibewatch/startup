  claims:
    - id: CV001
      statement: >-
        The Bot Company's investment thesis rests on a genuine first-mover product gap in the
        household robot segment: no commercial competitor as of May 2026 offers a non-humanoid,
        multi-task, LLM-driven chore robot at a sub-$3,000 consumer price point.
      type: inferred
      topic: investment-thesis
      sourceRefs:
        - SV027
        - SV012
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV001
        - QV030

    - id: CV002
      statement: >-
        The investment anti-thesis is equally structural: TBC is pre-product and pre-revenue as
        of the report date, with no disclosed product launch date, no manipulation reliability
        benchmark, and no confirmed supply chain or distribution partner.
      type: observed
      topic: investment-thesis
      sourceRefs:
        - SV027
        - SV002
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QV027
        - QV030

    - id: CV003
      statement: >-
        Founder Kyle Vogt carries material reputational risk from his resignation as CEO of Cruise
        following the October 2023 pedestrian-dragging incident and DOJ deferred prosecution
        agreement, creating both regulatory sensitivity and media amplification risk for any TBC
        safety event.
      type: third-party-reported
      topic: founder-risk
      sourceRefs:
        - SV028
        - SV002
        - SV001
      confidence: high
      freshness: historical
      answersQuestionRefs:
        - QV017
        - QV033

    - id: CV004
      statement: >-
        The global household robot market is estimated at $14.7 billion in 2025, projected to
        grow to $17.5 billion in 2026 at a CAGR of approximately 19–20%, and forecast to reach
        $41.9 billion by 2031 and approximately $85 billion by 2035, providing large TAM headroom
        for the bull-case scenario.
      type: third-party-reported
      topic: market-size
      sourceRefs:
        - SV017
        - SV018
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QV011
        - QV012

    - id: CV005
      statement: >-
        The dual hardware-plus-subscription revenue model TBC has articulated would carry 60–80%
        gross margins at the software subscription layer at scale, consistent with SaaS economics,
        but will initially generate negative-to-20% blended gross margins at low hardware production
        volumes — compressing near-term economics materially.
      type: estimated
      topic: unit-economics
      sourceRefs:
        - SV002
        - SV029
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QV018
        - QV016

