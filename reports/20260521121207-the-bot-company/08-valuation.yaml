  - id: final-diligence-and-thesis-breaks
    title: "Thesis-Break Triggers and Final Diligence Asks"
    body: >-
      The investment thesis for The Bot Company can break on six distinct trigger sets, each with
      a specific threshold, transmission mechanism, and action implication. The most critical
      structural triggers are: (1) failure to demonstrate a commercial-reliability manipulation
      benchmark before the next fundraise — without empirical evidence of task success rates, any
      future valuation increase lacks credibility and no new capital should be committed; (2) a
      safety incident (injury to a household member, pet, or property damage), which would activate
      regulatory, media, and reputational dynamics analogous to the Cruise pedestrian incident with
      potentially faster impact given Vogt's public profile; (3) the Bloomberg fundraise not having
      closed as of the report date, meaning the company's cash position may be materially lower
      than the potential $552 million total implies, compressing the runway to manufacturing launch.

      Final diligence asks are organized around the six most critical information gaps that cannot
      be resolved from public sources but would materially change the investment recommendation.
      The highest-priority asks are: (a) a live product demonstration with published success-rate
      benchmark; (b) confirmation of whether the Bloomberg round closed and on what terms;
      (c) current capitalization table, preference terms, and burn rate as of Q1 2026; (d) contract
      manufacturing, actuator, and supply chain disclosure; and (e) personal compliance diligence
      on Kyle Vogt relative to the Cruise DOJ deferred prosecution agreement.
    claimRefs:
      - CV033
      - CV034
