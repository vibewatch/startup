  - id: comparable-valuation-analysis
    title: "Comparable Valuation Analysis"
    body: >-
      Fundamental valuation of The Bot Company — using DCF, EV/revenue, or EV/EBITDA multiples —
      is not possible at this stage because the company has zero revenue, zero EBITDA, zero
      confirmed customers, and zero product shipments. The only methodologically appropriate
      frameworks are (1) private round comps in the physical AI / robotics sector; (2) milestone-
      based option-value analysis; and (3) public market comps for mature-stage household robotics
      companies as a ceiling/floor reference. All comparisons below must be read as directional
      signals, not anchors, given the profound stage and business-model heterogeneity between TBC
      and any available comparable.

      The private round comp set is bounded at the top by Figure AI's $39 billion Series C
      (September 2025), which is 20x TBC's $2 billion confirmed valuation and represents an
      outlier driven by industrial deployment evidence, Microsoft/OpenAI/Nvidia strategic backing,
      and demonstrated manufacturing at one unit per hour. Apptronik ($5 billion+ post-money,
      February 2026), which has pilot deployments with Mercedes-Benz and GXO Logistics, provides
      a more directly comparable reference: a pre-commercial-revenue humanoid startup with pilot
      evidence, $935 million in total capital, and a $5 billion valuation. At $2 billion, TBC
      trades at a 60 percent discount to Apptronik on valuation, but has no pilot evidence —
      implying TBC must deliver product demonstrations to justify valuation parity. Skild AI's
      $14 billion valuation (January 2026) is a software/foundation-model comparable, not hardware,
      and should be discounted significantly. Agility Robotics ($2.12 billion, March 2025) is the
      most closely analogous reference: a pre-commercial-scale humanoid startup with some industrial
      deployments, backed by Amazon and SoftBank at $2 billion — directionally validating TBC's
      $2 billion as within the range of reasonable private market pricing for a well-funded robotics
      startup at this stage.

      Public market comps provide a ceiling/floor discipline: Ecovacs (SHA:603486) — the global
      #2 household robot company by revenue, with $2.8 billion TTM revenue, 47.8% gross margin,
      and 8.4% net income margin — trades at an EV/revenue multiple of 1.71x as of May 21, 2026.
      At this multiple, a revenue-generating TBC with $300 million in hardware-plus-subscription
      revenue would be worth approximately $513 million — a fraction of its current private
      valuation. The gap between TBC's private valuation and the mature public comp multiple is
      solely explained by the pre-revenue premium embedded in the private round price: investors
      are paying for the probability-weighted option that TBC reaches and exceeds the revenue scale
      of a mature player. This option value calculation must be explicit in any investment decision.
