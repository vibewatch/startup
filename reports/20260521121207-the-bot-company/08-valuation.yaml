  - id: bull-base-bear-scenarios
    title: "Bull, Base, and Bear Scenarios"
    body: >-
      Three valuation scenarios are constructed for The Bot Company across a 5-year investment
      horizon (to 2030–2031), anchored to specific market, technical, and financing milestones.
      All scenarios are explicitly speculative; no operating evidence is available to assign
      probability weights with any precision. Scenario framing is illustrative for investment
      committee purposes.

      Bull case (probability signal: low — requires multiple simultaneous successes): TBC
      launches a commercially viable robot in 2027, achieves $200 million in revenue by 2029,
      and captures 2–5% of the global household robot market by 2030. Exit via strategic acquisition
      by a major technology platform (Amazon, Google, Samsung, Apple) at 10–15x forward revenue
      implies a valuation of $2–4 billion on 2029 revenue. Alternatively, if TBC becomes the
      dominant software layer for household AI (analogous to Skild AI as a foundation-model
      platform), a 20x revenue multiple could support $4–8 billion valuation. This scenario requires
      solving the sim-to-real generalization gap at commercial reliability, securing a tier-1
      distribution partner, scaling manufacturing without iRobot-style margin collapse, and avoiding
      Vogt reputational events. The global household robot market reaching $41.9 billion by 2031
      provides the TAM headroom.

      Base case (probability signal: medium): TBC launches a product by late 2027 or early 2028,
      faces significant commercialization friction (customer acquisition cost, manufacturing margin
      headwinds, Chinese OEM competition), and achieves $50–100 million in revenue by 2030.
      Exit at 5–8x revenue implies $250–800 million exit valuation. For investors who entered at
      $2 billion, this is a loss scenario (0.1–0.4x return). This outcome is consistent with the
      early trajectory of consumer hardware robotics peers who faced longer-than-expected timelines
      and higher-than-expected manufacturing costs. The Bloomberg funding round (if closed at $4B+)
      compounds the downside for late-stage investors: they need a $4 billion-plus exit to preserve
      capital, which requires bull-case execution.

      Bear case (probability signal: medium — specifically for the $4B+ entry tier): TBC fails to
      launch a commercially viable product by 2029 due to the sim-to-real generalization gap, faces
      a safety or privacy incident, or cannot raise additional capital in a compressed physical AI
      funding environment. Down round at $1–1.5 billion, or acqui-hire exit at $200–400 million
      that distributes primarily to preferred shareholders. Common shareholders and late-stage
      investors receive little to no return. This scenario is validated by iRobot's bankruptcy
      (December 2025) and the K-Scale Labs failure (2025), both of which demonstrate that
      household robot commercialization can destroy equity value rapidly even for well-funded players.
