      - number: '5.4'
        title: Switching costs look real, but key technical diligence items remain undisclosed
        blocks:
          - type: paragraph
            body: >-
              Eve’s likely moat is operational embedding, not a single breakthrough model claim. Atlas is meant to
              normalize records, filings, communications, and case-management data into one case file; Clio sync pulls
              contacts, notes, and case details directly into Eve; customer stories describe firm-specific playbooks,
              transcript-driven drafting triggers, and overnight review loops. Once those workflows are tuned to a
              firm’s templates, intake logic, and approval checkpoints, replacement cost rises because the buyer is
              swapping not only software seats but encoded process. The internal search-infrastructure post reinforces
              that inference: a per-case retrieval design makes sense for firms that need matter-specific recall and
              traceability, and it suggests switching would involve both workflow and data-architecture migration.


              Even so, the product is not fully public-underwritable from a technical diligence perspective. The
              reviewed source set did not surface a public status page, uptime metrics, incident disclosures, an
              external API reference, a named integration catalog beyond Clio and generic CMS claims, or benchmarked
              evidence on hallucination rate, citation precision, or review-pass performance. Company-controlled scale
              claims also move quickly—500-plus firms in January, 800-plus in March sponsored coverage, 1,000-plus in
              jobs, and 1,200-plus on the June homepage—without an independent denominator on active usage, retention,
              or module penetration. Netting it out, Eve looks like one of the few legal-AI vendors building toward a
              workflow-native OS for plaintiff firms, with real developer-signal depth and visible product breadth. But
              the technical diligence case still depends on a private data room to confirm reliability, evaluation
              discipline, deployment friction, and whether verification controls perform consistently under
              courtroom-grade pressure.
