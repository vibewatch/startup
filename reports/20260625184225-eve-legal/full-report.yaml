  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the September 2025 round actually disclosed
        blocks:
          - type: paragraph
            body: >-
              The cleanest disclosed fact in the public record is simple: Eve’s September 2025 Series B priced the
              company at more than $1 billion post-money on a $103 million raise. Eve repeated that number in its own
              funding post and in the distributed press release, while independent legal-tech coverage from LawNext and
              Artificial Lawyer echoed the same headline. What matters for valuation, however, is not just the round
              size. It is the scale point at which that price was struck. Around the Series B announcement, Eve publicly
              said it had added more than 350 firms in eight months, reached more than 450 customer firms, processed
              more than 200,000 legal cases annually, and helped firms recover over $3.5 billion in settlements and
              judgments. Those are meaningful traction markers, but they are not revenue disclosures.


              The contrast with Eve’s own January 2025 Series A is useful because it shows how quickly the narrative
              accelerated. At Series A, the company announced a $47 million round and said more than 100 firms had
              adopted the product, alongside a 500% year-over-year revenue growth claim. By the June 2026 run date,
              Eve’s homepage had moved to a much larger headline of 1,200+ firms and a broader “AI operating system for
              plaintiff law” narrative spanning intake, pre-litigation, litigation, AI-ready data, and firm-level
              intelligence. That suggests meaningful post-round growth, but it also introduces a diligence problem: the
              public record never explains whether the 450-firm figure and the 1,200+ figure are defined the same way,
              whether they are fully paying customers, or what average contract value sits underneath them.


              That missing revenue bridge is the core valuation issue. A $1B+ post-money mark can be defensible for a
              company that is rapidly becoming the system of record and action layer for plaintiff firms. But public
              evidence still does not disclose ARR, NRR, gross margin, or the preference stack behind the Series B. So
              the round should be understood as a strong signal of investor conviction in Eve’s category potential, not
              as a price already validated by public-market-style revenue evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Comparable set, market size support, and what public benchmarks say
        blocks:
          - type: paragraph
            body: >-
              The most useful legal-tech benchmark is Clio, not because it is perfectly comparable to Eve, but because
              it is one of the few private legal-software platforms that has publicly disclosed both valuation and ARR
              at material scale. Clio’s July 2024 financing priced the company at $3 billion with ARR already above $200
              million, implying a sub-15x ARR multiple. After the vLex acquisition and a November 2025 financing, Clio
              was valued at $5 billion with $400 million ARR, implying roughly 12.5x ARR. Those marks still carry
              premium legal-tech positioning, but they were struck at revenue levels that Eve has not publicly
              disclosed. Harvey, by contrast, is explicitly an outlier: CNBC reported $190 million ARR at an $11 billion
              valuation in March 2026, or roughly 58x ARR. That makes Harvey useful only as a reminder that frontier-AI
              scarcity premiums exist, not as a direct underwriting anchor for plaintiff-law workflow software.


              Private plaintiff and workflow peers are directionally supportive but not clean multiple anchors. EvenUp’s
              October 2025 Series E priced it at $2B+ and management said ARR was doubling year over year with 2,000+
              firms on platform. Supio disclosed $91 million total funding and 4x ARR growth since Series A, but not the
              absolute ARR base. Filevine disclosed nearly 6,000 customers, 100,000 legal professionals, 96% gross
              retention, and NDR above 120%, but not valuation. Litify disclosed 450+ enterprise customers and 70,000+
              legal professionals and previously raised $50 million Series A, but again without current ARR.


              Public-market framing is even stricter. Intapp, a public professional-software platform with legal
              exposure, reported $146.0 million of March 2026 quarterly revenue and was worth about $1.78 billion in
              June 2026, or roughly 3.0x annualized revenue. SaaS Capital’s public benchmark put the median SaaS ARR
              multiple at 6.7x in June 2025 and framed the current environment as a 6-8x “new normal.” Market size
              support is real enough to justify a premium over generic SaaS laggards: the ABA puts the U.S. lawyer base
              at 1.37 million, and Clio’s personal-injury statistics page puts the PI subset above 135,000 lawyers with
              nearly 400,000 claims annually. But Thomson Reuters’ 2026 legal-market report is a reminder that buyers
              are investing in AI on unstable economic footing, which argues for price discipline rather than automatic
              AI multiple inflation.
