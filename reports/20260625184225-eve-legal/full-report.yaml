      - number: '1.2'
        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founding bench is one of the strongest parts of Eve’s public file. The official company page
              identifies Jay Madheswaran, Matt Noe, and David Zeng as the core founding team, while investor and
              interview coverage gives a coherent founder-market-fit story: Jay previously worked at Facebook, Rubrik,
              and Lightspeed Venture Partners, and Matt and David are described as technically deep Rubrik alumni. That
              background matters because Eve is selling workflow AI into a high-stakes, document-heavy legal vertical
              where product quality and trust are strategic differentiators, not nice-to-have features. Public sources
              also support a 2020 origin point, even if the market launch clearly came later. What is much less visible
              is governance. Reviewed sources do not disclose board composition, voting control, protective provisions,
              or the internal management bench beyond the founders with much precision. As a result, founder fit and
              product credibility look strong, but institutional governance and cap-table control remain diligence asks
              rather than verified facts.
