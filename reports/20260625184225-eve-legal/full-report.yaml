      - number: '8.4'
        title: Thesis, anti-thesis, and upside-downside cases
        blocks:
          - type: paragraph
            body: >-
              The constructive thesis for Eve is coherent. Plaintiff law is not a toy wedge. The PI and broader
              plaintiff workflow universe is large enough to matter, operationally repetitive enough to automate, and
              economically sensitive enough to reward better intake, drafting, and settlement execution. Eve’s public
              story also fits what growth investors want to see in a vertical AI winner: fast logo growth, broad
              workflow coverage, and an ambition to become the operating system rather than a point solution. If
              management can prove that the current 1,200+ firm headline translates into real paid ARR, strong
              retention, and a scalable services-light deployment model, then the September 2025 valuation starts to
              look like an aggressive but understandable bet on category leadership.


              The anti-thesis is equally clear. Public evidence supports the market opportunity, but not the price.
              Clio’s disclosed rounds cleared at much larger ARR scale. Intapp’s public-market ratio is far lower. SaaS
              Capital’s benchmark says the median SaaS environment is still sober, not euphoric. EvenUp and Harvey show
              that AI scarcity premiums can happen, but Harvey is a generalized legal-AI outlier and EvenUp still does
              not disclose absolute ARR. Eve therefore sits in an awkward valuation zone: too expensive to justify with
              public legal-software comps, but not transparent enough to earn Harvey-style exemption from traditional
              discipline.


              That leaves three practical scenarios. The bull case requires Eve to turn current traction into something
              like $250-300 million of exit ARR with premium 12-14x exit pricing, yielding roughly $3.0-4.2 billion of
              value and a respectable multi-turn outcome from the $1 billion mark. The base case is much harsher:
              $120-160 million exit ARR at 7-9x yields only about $0.84-1.44 billion, which barely protects capital. The
              bear case — $60-90 million at 4-6x — produces only $0.24-0.54 billion and destroys value. That asymmetry
              means the investment view is highly sensitive to proof quality, not just company quality.
            claimRefs:
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
