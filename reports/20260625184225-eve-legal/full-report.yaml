chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and public operating footprint
        blocks:
          - type: paragraph
            body: >-
              Eve presents itself as a legal AI platform built specifically for plaintiff law firms, not as a generic
              legal research assistant. Across the homepage, launch materials, and independent coverage, the company
              describes software that spans intake, evaluation, pre-litigation, litigation support, and increasingly
              firm-wide operations. By June 2026, the public product language had shifted from a case-work assistant to
              “EveOS,” an AI operating system for plaintiff law that promises 24/7 intake, AI-generated drafting,
              analytics, and a live data layer for the firm. Headquarters disclosure is thinner than product disclosure.
              Independent funding coverage consistently calls the company San Francisco-based, but the official website
              does not publish a street address. Identity at the legal-entity level is also less clean than the brand
              narrative: the public-facing brand is Eve, while the privacy materials repeatedly reference Butler Labs
              and SiliconANGLE calls the company Butler Labs Inc. That makes Eve’s commercial identity clear but its
              exact legal naming convention less transparent than the rest of its marketing surface.
