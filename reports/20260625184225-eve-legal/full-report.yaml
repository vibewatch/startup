  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Paid ARR proof misses the current de-risking threshold
        - Current paid ARR is still below ~$60M
        - The 1,200+ firm headline would not compress the entry multiple enough
        - Do not pay the prior valuation; require a reset or stay out
      - - Retention quality is ordinary, not premium
        - Gross or net retention lands below software-leader norms
        - Scarcity-premium pricing no longer fits a platform thesis
        - Re-rate toward public median or lower
      - - Customer count is heavily pilot-weighted
        - Large share of current firm logos are pilots, low-ACV trials, or non-paying seats
        - Logo growth would overstate monetized scale
        - Rebuild ARR from paid cohorts only before any underwriting
      - - New financing adds heavy preference overhang
        - Later rounds add aggressive preference, participation, or anti-dilution terms
        - Headline valuation would overstate common-equity value
        - Recalculate returns on a waterfall basis or avoid the deal
      - - Competitive pricing pressure hits plaintiff AI
        - Comparable plaintiff-AI offerings compress effective ACV or force services-heavy selling
        - Exit ARR and exit multiple both deteriorate
        - Shift to bear-case assumptions immediately
    notes: These triggers focus on facts that would directly collapse the valuation case, not on general startup noise.
    claimRefs:
      - CV050
      - CV053
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and retention
        - Actual ARR, NRR, GRR, and gross margin by cohort from September 2025 through the present
        - This is the core bridge between a scarcity-premium round and a supportable valuation multiple
        - CFO data room plus board reporting
      - - Customer definition
        - Paid customers, seat counts, ACV by segment, and reconciliation of 450+ versus 1,200+ firm disclosures
        - Scenario math depends on whether current logo counts represent paying revenue or broader adoption claims
        - CRO / VP Sales review with cohort export
      - - Cap table and waterfall
        - Share classes, liquidation preferences, participation rights, and anti-dilution terms
        - Common-equity returns cannot be assessed from the headline valuation alone
        - Company counsel plus cap-table export
      - - Unit economics
        - Services mix, CAC, payback, and contribution margin by cohort
        - Premium pricing is far more credible if implementation is efficient and software gross margins are strong
        - Finance and RevOps diligence
      - - Secondary and insider pricing
        - Any secondary transactions or internal marks since the Series B
        - A quiet internal discount would materially change the interpretation of the $1B headline mark
        - Lead investor and company finance diligence
    notes: These asks are the minimum package required to move from valuation framing to actual underwriting.
    claimRefs:
      - CV049
      - CV050
      - CV052
