      - number: '1.3'
        title: Funding history, investor syndicate, and current stage
        blocks:
          - type: paragraph
            body: >-
              Eve’s capital formation is well supported by official and third-party evidence. The company announced a
              $47 million Series A in January 2025 led by Andreessen Horowitz with Lightspeed and Menlo Ventures, then
              followed it eight months later with a $103 million Series B at a valuation above $1 billion led by Spark
              Capital, again with Andreessen Horowitz, Lightspeed, and Menlo participating. Those two rounds alone imply
              at least $150 million of disclosed capital since January 2025, and they place the company firmly in
              late-stage private-company territory rather than early experimental legal-tech. Investor commentary also
              helps explain what the capital is meant to do: Spark, Lightspeed, and Eve management all frame the company
              as building a new category of “AI-native law,” funding deeper product development, transformation
              services, onboarding, and broader case-lifecycle coverage. What the public file still does not answer is
              how governance changed after Series B, whether secondaries were involved, or how ownership is distributed
              among the syndicate and founders.
