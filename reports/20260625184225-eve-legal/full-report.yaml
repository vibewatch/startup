      - CV051
      - CV052
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - Counterweight
      - What would change the view
    rows:
      - - Plaintiff law is a real vertical software market
        - 135k+ PI lawyers, ~400k annual claims, and rising AI spend support category size
        - Large market does not automatically support outlier entry multiples
        - Show durable monetization and retention at meaningful scale
      - - Eve appears to be moving toward operating-system breadth
        - Current product story spans intake, pre-lit, litigation, AI-ready data, and firm intelligence
        - Breadth can mask services-heavy delivery if gross margin is weak
        - Disclose gross margin and productized deployment metrics
      - - Fast customer growth can justify premium pricing
        - Public record shows a move from 100+ firms at Series A to 450+ at Series B and 1,200+ on the current homepage
        - The public record does not define paid versus pilot or office versus firm counting
        - Provide paid-customer, seat, and ACV definitions
      - - Scarcity value exists in legal AI
        - Harvey and EvenUp show investors will pay up for category leaders
        - Harvey is an AI outlier and Clio achieved lower multiples at much higher ARR
        - Show why Eve belongs in the premium cluster, not the median cluster
      - - Platform upside can still be large
        - A plaintiff-native workflow winner could support multi-billion exit value
        - Base-case exit math is weak from a $1B entry if public multiples stay sober
        - Prove a path to $250M+ ARR and premium retention
    notes: >-
      This table separates the quality of the company thesis from the fairness of the current price; both can be true at
      the same time.
    claimRefs:
      - CV043
      - CV044
      - CV045
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Exit ARR of $250-300M with 12-14x exit multiple; Eve proves platform-quality retention and monetizes the
          1,200+ firm footprint
        - $3.0-4.2B value, or roughly 3.0-4.2x gross MOIC from a $1B entry
        - Execution, retention, and premium multiple sustainability
        - Low-to-medium; requires premium-cluster execution
      - - Base
        - Exit ARR of $120-160M with 7-9x exit multiple; growth remains good but public-market discipline persists
        - $0.84-1.44B value, or roughly 0.8-1.4x gross MOIC
        - Multiple compression, moderate ACV, and limited operating leverage
        - Most plausible without extraordinary proof
      - - Bear
        - Exit ARR of $60-90M with 4-6x exit multiple; monetization lags logo growth or competition compresses pricing
        - $0.24-0.54B value, or heavy capital impairment
        - Logo quality, weak retention, services drag, or hard pricing resets
        - Material downside if proof quality stays thin
    notes: >-
      Scenario outputs are deliberately coarse and are meant to illustrate return sensitivity, not produce a valuation
      precision point estimate.
    claimRefs:
      - CV046
      - CV047
      - CV048
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Clio (2024 Series F)
        - Valuation vs disclosed ARR
        - $3B valuation on >$200M ARR (<15x)
        - Best disclosed private legal-software round anchor before the vLex step-up
        - Broad legal workflow platform, not plaintiff-native AI
      - - Clio (2025 Series G + vLex)
        - Valuation vs disclosed ARR
        - $5B valuation on $400M ARR (~12.5x)
        - Shows how premium legal-platform pricing looks at large ARR scale
        - Includes vLex deal context and debt facility
      - - Intapp (public, Jun 2026)
        - Market cap vs annualized revenue
        - $1.78B market cap on ~$584M annualized revenue (~3.0x)
        - Public comp for regulated professional software with legal exposure
        - Not plaintiff-law specific and public markets are usually harsher
      - - Harvey (Mar 2026)
        - Valuation vs disclosed ARR
        - $11B on $190M ARR (~58x)
        - Useful only as labeled AI-outlier ceiling for frontier scarcity pricing
        - General legal/pro services AI, not plaintiff workflow
      - - EvenUp (Oct 2025)
        - Private round / scale markers
        - $2B+ valuation; 2,000+ firms; ARR doubled YoY
        - Closest disclosed plaintiff-AI valuation peer with meaningful scale markers
        - No absolute ARR disclosed
      - - Supio (Apr 2025)
        - Private round / growth markers
        - $91M total funding; 4x ARR growth since Series A
        - Relevant plaintiff-AI peer with verification-heavy positioning
        - No public valuation or absolute ARR
      - - Filevine (Sep 2025)
        - Private scale / retention markers
        - $400M financing; ~6,000 customers; 96% gross retention; 120%+ NDR
        - Shows incumbent workflow scale and retention quality in legal software
        - No public valuation multiple
      - - Litify (2023 + current scale)
        - Private scale / ownership markers
        - 450+ enterprise customers; 70,000+ legal pros; majority stake sold to Bessemer
        - Signals platform breadth and buyer value in plaintiff and high-volume practices
        - No public valuation multiple and stale financing disclosure
    notes: >-
      Rows mix clean multiple anchors with directional private-scale markers because most private legal-tech peers do
      not disclose enough ARR to support apples-to-apples math.
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the most relevant public and private legal-tech references with disclosed valuation, ARR, or scale
        markers available from public sources as of 2026.
