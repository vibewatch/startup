      - number: '5.2'
        title: EveOS adds a case-data layer, analytics, and visible technical architecture signals
        blocks:
          - type: paragraph
            body: >-
              The clearest 2026 product change is EveOS, which pushes Eve from workflow automation toward
              operating-system ambition. Lawnext and Business Wire coverage agree that EveOS adds Atlas, a self-updating
              case-data layer that pulls from case-management systems, emails, court filings, medical records, and
              client communications; when source-of-truth conflicts appear, the system is supposed to flag them for
              human review rather than silently resolve them. The same release expands the Analyst product into beta for
              plain-English reporting on settlement history, profitability, pacing, and case distribution, while
              Communication Agents automate outbound follow-ups and records-request tasks across 31 languages. Eve
              Research is also positioned as a native court-opinion layer inside the agents, including overruled-case
              flags and citation links to source passages.


              Public technical signals support the idea that Eve is building more than a wrapper on general models, but
              they stop short of proving defensible model quality. Built In lists a modern application stack—Django,
              PostgreSQL, Python, React, and TypeScript. The ML Engineer posting explicitly mentions domain-specific
              fine-tuning, evaluation frameworks, production deployment, and product-usage signals, plus direct
              collaboration with OpenAI and Anthropic. The engineering blog is even more revealing: one post says Eve’s
              internal WALL-E agent already authors 22% of monorepo merge requests, while another explains that the
              company migrated per-case search infrastructure away from OpenSearch after shard instability and more than
              $10,000 per month of AWS cost. Those are credible architecture and developer-signal clues. They suggest
              Eve has real infra and evaluation work under the hood, but they still do not disclose public benchmark
              scores, uptime history, or the exact retrieval-and-verification design used on customer legal outputs.
