  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Eve’s served market is narrower than “legal AI” and wider than a single personal-injury point solution.
              Official Eve pages say the product is built for plaintiff law firms and is used across intake, medical
              overview, demand drafting, discovery responses, and broader operations. Eve also explicitly names
              plaintiff-side practice areas including personal injury, workers’ compensation, medical malpractice, labor
              and employment, mass torts, and Social Security disability. That matters because the status quo in
              plaintiff firms is not just Westlaw-style research or generic chatbots. Competitor and workflow sources
              from Smokeball, CloudLex, CasePeer, and Paxton all describe plaintiff work as an intake-to-settlement
              operating system: client screening, medical-record collection, chronology building, drafting, settlement
              tracking, lien handling, and disbursement. In other words, the included spend is case-lifecycle workflow
              labor and software for contingency plaintiff practices; the excluded spend is most defense-only
              e-discovery, generalized BigLaw knowledge tools, or broad legal-research budgets that never touch
              plaintiff operations. The core substitute set is human labor, legacy case-management software, outsourced
              records and lien vendors, and generic AI that still needs heavy plaintiff-specific prompting and review.
