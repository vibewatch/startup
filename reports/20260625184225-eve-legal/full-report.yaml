            body: >-
              Public evidence supports a narrower and more credible customer story than the generic phrase “legal AI.”
              Eve is clearly marketed for plaintiff firms, not for the whole law-firm universe, and its public
              practice-area footprint already spans personal injury, labor and employment, workers’ compensation, Social
              Security disability, and medical malpractice. The named customer set is also more varied than a pure
              auto-PI wedge. Mike Morse and Jeffrey Glassman anchor large personal-injury references, James Scott Farrin
              adds a scaled Mid-Atlantic plaintiff platform with workers’ compensation and SSDI depth, while Hershey Law
              and Frontier Law Center show that Eve can land in plaintiff-side employment work. Geographically, the
              visible references are U.S.-centric but broad: Michigan, North and South Carolina, California, and
              Massachusetts are all represented in public materials. That is enough to show the product can travel
              across plaintiff subsegments and state-level workflows, but not enough to prove a balanced national
              customer mix or strong international reach. The best reading is that Eve has moved beyond a single-firm or
              single-practice proof point into a multi-logo plaintiff sample, yet still relies on a curated set of
