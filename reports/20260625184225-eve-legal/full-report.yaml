      - number: '1.4'
        title: Customer proof, milestone pace, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Traction is the clearest reason Eve matters beyond fundraising headlines. The reviewed materials show a
              sequence of scale claims that grew sharply over 2025 and 2026: more than 450 firms around the Series B,
              more than 500 firms by January 2026, more than 800 by March, 1,200-plus on the current homepage, and
              1,400-plus in June 2026 LawNext coverage. Those figures are directionally impressive but not perfectly
              aligned, which makes exact current count a diligence item rather than a settled fact. Still, customer
              proof is unusually concrete. Public sources name Mike Morse Law Firm, James Scott Farrin, Barrett &
              Farahany, Disparti Law Group, Frontier Law Center, Laurel Employment Law, and Hershey Law, while case
              studies attribute 20-plus hours per week of attorney time saved, doubled or tripled capacity, four-month
              average cycle times for some workflows, and a $27.5 million verdict to firms using Eve. Product milestones
              also continued after financing, with the January 2026 AI Workforce release and the June 2026 EveOS
              expansion. The adverse side is equally important: LLRX and a March 2026 court filing tied Eve’s marketing
              and training claims on hallucination safeguards to an attorney’s inaccurate quotation incident, even
              though the lawyer said he could not determine whether the error came from Eve itself or from his own
              copy-and-paste workflow. That does not invalidate the business, but it does show that trust, verification,
              and legal-process controls are material diligence risks.
