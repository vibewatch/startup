  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The valuation call depends less on the funding headline than on whether current paid ARR and retention now justify
      premium legal-tech multiples.
    data:
      nodes:
        - id: n1
          label: Real plaintiff market
          detail: 135k+ PI lawyers and ~400k claims
        - id: n2
          label: Eve traction
          detail: 450+ firms at round; 1,200+ firms on current homepage
        - id: n3
          label: Benchmark reality
          detail: Clio at ~12.5x-<15x; Intapp ~3x; SaaS median 6.7x
        - id: n4
          label: Opaque inputs
          detail: No public ARR, retention, or cap-table terms
        - id: n5
          label: Scenario math
          detail: Round implies ~28x-111x ARR on cautious round-time scenarios
        - id: n6
          label: Valuation stance
          detail: Stretched unless current paid ARR and retention are already premium
        - id: n7
          label: Recommendation
          detail: Track / require proof or lower entry price
      edges:
        - - n1
          - n5
        - - n2
          - n5
        - - n3
          - n5
        - - n4
          - n6
        - - n5
          - n6
        - - n6
          - n7
