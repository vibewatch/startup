      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Required ARR to support a $1B valuation varies dramatically by the multiple regime used.
    data:
      items:
        - label: Intapp-style ~3x
          value: 333.3
        - label: Public SaaS median 6.7x
          value: 149.3
        - label: Generous premium 10x
          value: 100
        - label: Clio 2025 ~12.5x
          value: 80
        - label: Clio 2024 <15x
          value: 66.7
    approximationNotes: >-
      Values are simple $1,000M divided by the referenced multiple and are intended as valuation hurdles, not audited
      forecasts.
    claimRefs:
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
      - CV051
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Forward return outcomes from a $1B entry are highly asymmetric and depend on whether Eve reaches premium-scale
      ARR.
    data:
      items:
        - label: Bear case
          low: 240
          high: 540
        - label: Base case
          low: 840
          high: 1440
        - label: Bull case
          low: 3000
          high: 4200
    approximationNotes: >-
      Values are implied future equity values in USD millions derived from broad ARR and multiple ranges, not discounted
      cash flow outputs.
    claimRefs:
      - CV046
      - CV047
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring is constructive on market and product breadth but weak on valuation support and evidence quality.
    data:
      items:
