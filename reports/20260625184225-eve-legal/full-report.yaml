      - number: '2.2'
        title: Sizing lenses, segment structure, and bounded TAM logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a bounded multi-lens market view, not a single inflated TAM slide. At the
              broadest level, the ABA says the U.S. had 1.37 million lawyers in 2025. Clio’s 2026 personal-injury market
              synthesis then narrows that broad denominator to 135,000-plus personal injury lawyers, roughly 10% of
              practicing attorneys, and nearly 400,000 annual PI claims filed predominantly in state courts. The same
              source cites $61.7 billion of 2025 industry revenue for U.S. personal-injury lawyers and attorneys, which
              is a large economic pool even though it is not software spend. Complexity outside routine PI is also
              meaningful. Lex Machina says premises-liability and motor-vehicle tort cases hit record levels in its 2025
              federal-torts report. The PFAS AFFF multidistrict litigation page says that single MDL alone has
              10,000-plus associated cases and tens of thousands of plaintiffs, while Duane Morris reviewed more than
              1,441 class-action decisions in the prior year. Together, those lenses say the plaintiff bar is material,
              fragmented, and operationally dense enough to sustain vertical workflow software. What public data does
              not cleanly reveal is the exact count of plaintiff firms by segment or the dollar share of that
              legal-revenue pool already earmarked for AI and workflow software.
