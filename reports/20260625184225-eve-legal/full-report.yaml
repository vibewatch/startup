  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
      - Basis
    rows:
      - - Recommendation
        - Track / research-more at prior price
        - Do not underwrite the $1B mark for new money without private ARR proof
        - Public evidence supports traction but not a clean revenue multiple
      - - Confidence
        - Medium
        - Enough evidence for direction, not enough for precision
        - Funding facts are clear; ARR, retention, and cap-table terms are not
      - - Risk rating
        - High
        - Return outcomes are highly skewed to proof quality and multiple compression
        - Base and bear cases quickly erase venture-style upside
      - - Valuation stance
        - Stretched
        - Treat $1B as a scarcity-premium mark rather than a public-comps-backed fair value
        - Round-time customer count plus cautious ACV assumptions imply high multiples
      - - New-money discipline
        - $700-800M absent proof; $1B only with strong current ARR proof
        - Require either price concession or evidence that current paid ARR is already well above $60-80M
        - 10-12.5x style legal-tech multiples require much more ARR than publicly disclosed
    notes: >-
      Recommendation is based on public evidence only; private diligence on ARR, retention, and preference terms could
      move the stance materially.
    claimRefs:
