  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow depth now reaches from intake through litigation execution
        blocks:
          - type: paragraph
            body: >-
              Eve’s public product surface is no longer just a drafting assistant. The June 2026 homepage, January 2026
              Eve 2.0 launch materials, and June 2026 EveOS launch coverage all describe a workflow stack that starts
              with multilingual intake, moves into pre-litigation chronologies and demand drafting, and extends into
              discovery, transcript review, cross-examination support, and matter-wide auditing. That breadth matters
              because plaintiff firms do not buy point tools in isolation; the operational pain is handoffs between
              intake, records review, drafting, client communication, and litigation prep. On the evidence reviewed
              here, Eve is trying to occupy those handoffs rather than merely help with one document at a time.


              The strongest module-level proof is around intake, medical overviews, and drafting. Eve says its intake
              layer answers calls and emails 24/7, signs qualified clients on the call, and works in 28 languages; the
              intake GA post adds 40-plus beta firms, lead scoring, structured summaries, and CMS integration. The
              medical-overview page is unusually concrete for legal-AI marketing: it specifies chronology, bad facts,
              ICD codes, damages ledgers, hyperlinks back to record pages, OCR on handwritten records, and 15–20 minute
              generation time. Customer case studies then tie those modules to live workflows: Laurel’s demand agent
              auto-triggers from transcripts and cut human touch time to minutes, while Hershey Law describes using Eve
              from intake through trial support. That is enough to conclude workflow depth is real, even if most
              quantified outcomes still come from company-controlled or sponsored sources.
