      - number: '8.3'
        title: Implied ARR multiples using cautious scenario framing
        blocks:
          - type: paragraph
            body: >-
              The crucial discipline step is to translate the $1B round into ARR requirements rather than repeat the
              headline valuation. Public benchmarks make the hurdle visible. To trade at the 6.7x public SaaS median
              from SaaS Capital, Eve would need about $149 million ARR. To look like Clio’s 2025 financing, it would
              need roughly $80 million ARR. To look like Clio’s 2024 round, roughly $67 million ARR. To look like
              Intapp’s much harsher public-market ratio, it would need more than $330 million ARR. Those thresholds are
              not precision targets, but they show the order of magnitude difference between public-market support and a
              round priced largely on private optionality.


              Because Eve does not disclose ARR, the only public way to translate the round is to use disclosed customer
              counts and cautious contract-value ranges. At the round-time 450-firm disclosure, a $20,000 blended
              ARR-per-firm assumption implies only about $9 million ARR and a roughly 111x multiple. A $40,000
              assumption implies about $18 million ARR and a roughly 56x multiple. Even a very generous $80,000 blended
              ARR per firm still implies only about $36 million ARR and a roughly 27.8x multiple. Those are not
              impossible numbers for a hot AI platform, but they are materially above what disclosed legal-tech and
              public SaaS comparables would normally support.


              The one public fact that softens this conclusion is Eve’s current 1,200+ firm homepage disclosure. If most
              of those firms are paying and the blend is around $50,000 ARR per firm, current ARR could approach $60
              million and retrospectively compress the September 2025 price to about 16.7x ARR. That is still rich, but
              much less extreme than the round-time 450-customer math. The problem is that this de-risking case depends
              on information the public record does not provide: paid versus pilot status, seats per firm, services mix,
              renewal behavior, and the share of customers on premium plans. So the right conclusion is not that the
              round was obviously wrong, but that it was an option-like price on execution that still needs private
              verification.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
