      - number: '3.2'
        title: Incumbent workflow suites, status-quo substitutes, and budget owners
        blocks:
          - type: paragraph
            body: >-
              Eve is not only competing against new plaintiff-native AI companies. It is also competing against the
              software systems that

              already control intake, calendaring, documents, billing, reporting, and day-to-day case movement inside
              plaintiff firms. Litify,

              Filevine, CloudLex, and CasePeer are the most important examples because they already sit close to the
              matter-management core.

              Litify and CloudLex, in particular, publicly speak in operating-system language: intake to settlement,
              configurable workflows,

              analytics, and embedded AI. Filevine’s public feature set shows why incumbents matter even when their
              branding sounds less

              “agentic” than Eve’s. It already offers AI medical-record analysis, deposition intelligence, validation
              workflows, calendaring,

              and payment operations. CloudLex and CasePeer are narrower but plaintiff-native and operationally
              embedded, which means they can

              defend budget through switching costs rather than frontier-model rhetoric. The status quo also includes
              more general practice

              suites such as Clio, MyCase, PracticePanther, and document-heavy tools like Smokeball. These are weaker on
              plaintiff depth, but

              they publish simpler pricing and can be “good enough” for smaller firms that do not yet want a new
              AI-first operating layer.
