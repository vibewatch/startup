      - number: '4.3'
        title: Capital adequacy, burn proxies, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Financially, the key positive is that Eve no longer looks like a fragile pre-product startup. The
              disclosed 2025 Series A and Series B alone contributed at least $150 million, and multiple 2026
              company-controlled sources round that total up to more than $160 million or $164 million. That matters
              because the company is still hiring aggressively. Jobera listed 34 open roles in June 2026 across
              engineering, data, product marketing, security, finance, revenue operations, customer success, sales, and
              legal. Public salary bands run from roughly $82,000 at the low end to $450,000 for senior engineering
              leadership, while the company also advertises equity, benefits, stipends, and retirement matching. Those
              disclosures do not reveal actual payroll, but they do show a venture-backed cost base that is consistent
              with a company still investing heavily in product, go-to-market, compliance, and customer operations.


              The problem is that capital adequacy still cannot be underwritten precisely. No reviewed source publishes
              cash on hand, monthly burn, runway months, debt, or credit facilities. Even the hiring data cuts both
              ways: it shows the company can spend, but not how much cash remains after the 2025 raises. The best
              defensible view is that the Series B materially reduced near-term financing pressure and that sponsor
              quality gives Eve a better refinancing position than most vertical AI startups. But the public record
              still does not let an investor determine whether Eve is twelve months from another raise or comfortably
              financed beyond that point.
