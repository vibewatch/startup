      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a constructive but incomplete financial verdict. Eve almost certainly sells
              recurring software through direct contracts into a real, budgeted pain point. Customer stories show
              material labor leverage in intake, drafting, and litigation prep. Sponsor quality is strong, disclosed
              capital is meaningful, and the company is still hiring like a growth-stage business rather than a business
              in retrenchment. Those facts support the idea that Eve is becoming an important vertical software platform
              for plaintiff firms.


              But that is still different from saying the business is publicly underwritable at a $1 billion-plus
              valuation. The biggest missing items are the ones that actually determine valuation discipline: absolute
              ARR or revenue, realized pricing, ACV distribution, gross margin, services mix, CAC, payback, retention,
              customer concentration, cash, burn, and debt. The adverse file matters too. The March 2026 citation
              incident does not prove systemic product failure, but it does show why legal-AI vendors may need
              continuing spend on QA, audit, human review, and customer training. Netting it out, Eve looks like a
              fast-growing contract SaaS platform with credible category leadership and clear ROI narratives, but the
              financial case still rests on growth signals and customer anecdotes more than on disclosed revenue
              quality. The right next step is not a new story; it is a metrics pack.
