companyProfile:
  summary: >-
    Eve is a San Francisco-based legal AI company focused on plaintiff-side law firms rather than Big Law or general
    legal research. Public product and customer evidence shows a platform that spans intake, medical-record synthesis,
    demand drafting, discovery support, research, communications, and a newer case-data layer meant to sit across firm
    workflows. The company’s market story is strong: Eve raised a $47 million Series A in January 2025 and a $103
    million Series B in September 2025 at a valuation above $1 billion, with Andreessen Horowitz, Lightspeed, Menlo, and
    Spark all publicly backing the business. Customer proof is also real, with named law-firm references and repeated
    claims of major time savings and conversion gains. The main diligence issue is not whether Eve has momentum; it is
    whether current paid ARR, retention, and legal-risk controls are strong enough to justify the prior valuation and
    support durable leadership as incumbents and adjacent legal-AI vendors catch up.
