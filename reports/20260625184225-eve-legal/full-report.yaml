  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct plaintiff-AI peers and the closest overlap with Eve
        blocks:
          - type: paragraph
            body: >-
              The closest direct overlaps with Eve are EvenUp and Supio, not the broader legal-AI field. EvenUp has
              expanded well beyond demand

              letters into a plaintiff-specific claims platform spanning intake, treatment, demands, negotiation,
              discovery, trial, executive

              analytics, and communication agents. That makes it more than a pre-lit point tool, but its public story is
              still rooted in

              claims intelligence and personal-injury volume. Supio overlaps even more directly with Eve’s current
              direction. It explicitly

              markets intake, chronologies, demand letters, litigation drafting, cross-case analysis, and firm
              intelligence, while also

              emphasizing mass torts and human-verified outputs. In other words, Supio is trying to own not just one
              workflow but the record,

              argument, and insight layer around plaintiff litigation. Darrow is relevant but different: it works
              upstream on legal-exposure

              detection and matter origination rather than on running a plaintiff firm day to day. Smaller entrants such
              as ProPlaintiff and

              LawPro.ai also show that medical chronology, demand generation, and agentic case support are already
              spawning narrower challengers.
