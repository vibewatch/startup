  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Publicly evidenced journey from plaintiff-firm discovery to workflow expansion, showing who is involved and where
      rollouts can stall.
    data:
      items:
        - label: 'Stage 1: Awareness'
          description: >-
            Firm leadership or legal-tech lead sees Eve through customer stories, legal-tech coverage, or a direct
            walkthrough CTA.
          buyerTrigger: Need to handle more cases without proportional headcount growth
          eveValue: Plaintiff-specific proof and named customer stories
          conversionBarrier: No posted pricing; buyer must enter a sales conversation
        - label: 'Stage 2: Security and fit review'
          description: Champion team tests whether Eve can fit practice area, data sensitivity, and existing systems.
          buyerTrigger: Need confidence on confidentiality, HIPAA/SOC2 posture, and workflow fit
          eveValue: Official security claims, CMS compatibility, and legal-tech references
          conversionBarrier: Governance, acceptable-use rules, and data-sharing concerns
        - label: 'Stage 3: Champion use case'
          description: Firm deploys on one painful workflow such as intake, medical summaries, demand drafting, or trial prep.
          buyerTrigger: Visible bottleneck with immediate ROI potential
          eveValue: Quick-output playbooks and tailored workflows
          conversionBarrier: Need internal champions and change-management effort
        - label: 'Stage 4: Department rollout'
          description: Use spreads across intake, paralegals, litigators, operations, and management reporting.
          buyerTrigger: Early win proves value and opens cross-team demand
          eveValue: Broader product map across intake, casework, and analytics
          conversionBarrier: Training load, process redesign, and integration work
        - label: 'Stage 5: Expansion / embed'
          description: Customer adds more workflows, CMS sync, and firm-level analytics, making Eve part of daily operating rhythm.
          buyerTrigger: Need more case capacity, faster cycle time, and better firm visibility
          eveValue: Land-and-expand into adjacent plaintiff workflows
          conversionBarrier: Retention economics and contract durability still undisclosed publicly
    approximationNotes: >-
      Stages are synthesized from public customer stories and official CTAs. The ordering is evidence-backed, but exact
      conversion rates and elapsed times are not publicly disclosed.
