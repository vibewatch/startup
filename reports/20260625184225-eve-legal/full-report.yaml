        - Ask for failover design, RTO/RPO, offline export paths, and deadline-contingency procedures
      - - Subprocessor discontinuation or model/vendor policy shift
        - Medium
        - High
        - Vendor review program; multi-system architecture implied by AWS/Azure references
        - Terms say subprocessors may discontinue hosting and Eve is not liable for those discontinuations
        - Obtain named critical vendors, portability terms, and migration procedures
      - - Public-site privacy practices and analytics create messaging mismatch
        - Low-Medium
        - Medium
        - Opt-outs exist and marketing-site collection is separable from matter handling
        - >-
          Privacy policy references analytics and advertising partners, which may alarm buyers if not clearly segmented
          from matter data controls
        - Confirm separation between marketing telemetry, product telemetry, and client-matter environments
    notes: >-
      Platform and privacy rows combine contractual, technical, and legal exposure because plaintiff-law workflows tie
      them together in practice.
