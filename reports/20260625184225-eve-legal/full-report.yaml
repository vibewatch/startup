      - number: '3.3'
        title: General legal AI, adjacent entrants, and what they can substitute
        blocks:
          - type: paragraph
            body: >-
              Harvey, CoCounsel, Lexis+ with Protégé, and Paxton matter because they can absorb portions of Eve’s
              workflow without becoming

              plaintiff operating systems. Harvey now sells agents that execute legal work end to end and has the scale,
              funding, and law-firm

              adoption to become a serious procurement alternative whenever a buyer wants one premium AI partner across
              many practice areas.

              CoCounsel and Lexis+ with Protégé bring a different kind of distribution power: trusted legal content,
              legal research workflows,

              due-diligence tooling, and grounded citation infrastructure. Those platforms are not built around
              plaintiff intake, medical

