      - number: '8.5'
        title: Recommendation, price discipline, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence-supported recommendation is price-sensitive caution rather than broad enthusiasm. For
              existing insiders, the September 2025 mark can still work if Eve has already scaled meaningfully beyond
              the public 2025 disclosure and can show retention, margins, and expansion economics more consistent with a
              premium platform than a services-heavy AI vendor. For new money, however, the public record is not yet
              strong enough to underwrite the prior price as fair on disclosed fundamentals alone. At a minimum,
              management would need to prove current paid ARR materially above the $60-80 million zone, strong renewal
              behavior, and limited preference overhang to move the valuation discussion closer to Clio-like rather than
              Harvey-like math.


              That is why the chapter stance is “stretched, but conditionally salvageable,” not “obviously broken.” The
              market is large enough, customer traction is real enough, and the workflow breadth is broad enough to keep
              upside alive. But the underwrite cannot ignore absent ARR disclosure, missing cap-table terms, and the
              possibility that current logo counts overstate current monetized scale. The simplest practical discipline
              is to require proof or price. Without private verification, a more prudent new-money range is roughly
              $700-800 million, where double-digit returns remain possible without assuming outlier multiples.


              The next diligence step is straightforward. Ask for the actual ARR bridge from January 2025 to the
              present, renewal and gross-retention data, segment ACV, seat counts per firm, and the full preference
              waterfall. If those data show Eve already operating in a Clio-like scaling lane, the valuation stance can
              improve quickly. If not, the chapter’s default view should remain track / research-more at the September
              2025 mark and only engage at a lower entry price.
            claimRefs:
              - CV049
