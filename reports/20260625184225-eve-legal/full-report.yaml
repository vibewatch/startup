        - Intake, medical overviews, drafting, research, discovery, communications, and firm analytics
        - Broadest explicit plaintiff operating-system ambition in the reviewed set
      - - EvenUp
        - Direct plaintiff-AI peer
        - $385M total funding; $2B+ valuation; 2,000+ PI firms claimed
        - High-volume PI and claims practices
        - Intake, treatment, demands, negotiation, discovery, trial, communications, analytics
        - Strongest scale rival in plaintiff pre-lit and claims operations, but still more claims-centric than EveOS
      - - Supio
        - Direct plaintiff-AI peer
        - $91M total funding after 2025 Series B; customer names include PI and mass-tort firms
        - PI and mass tort firms handling complex, document-heavy litigation
        - Intake, chronologies, demand letters, case economics, litigation drafting, firm intelligence, integrations
        - Strongest public rival on medical-record depth, litigation readiness, and verification messaging
      - - Darrow
        - Adjacent origination / intelligence competitor
        - $63M disclosed funding in sector coverage; 80+ organizations and 10K+ active matters claimed
        - Law firms, insurers, and compliance teams seeking emerging exposure
        - Legal exposure detection, upstream matter sourcing, regulatory and litigation-signal intelligence
        - Relevant for origination and portfolio-building, not a like-for-like plaintiff firm operating system
      - - ProPlaintiff
        - Emerging point competitor
        - Funding not publicly disclosed in reviewed materials
        - Personal injury law firms
        - AI demand letters, summaries, paralegal, case manager, medical chronologies, document generation
        - Smaller but clearly attacking the intake-to-settlement operations wedge
      - - LawPro.ai
        - Emerging point competitor
        - Funding not publicly disclosed in reviewed materials
        - Personal injury lawyers and injury-claims teams
        - Visual chronology, file review, case valuation, citation-backed answers, legal docs
        - Narrower than Eve, but notable where medical chronology and demand prep dominate buying criteria
      - - Litify
        - Incumbent workflow suite
        - Enterprise/custom-quote software with broad legal workflow footprint
        - High-volume PI firms plus broader law-firm and legal-department users
        - Intake, matter management, analytics, communications, payments, AI embedded in workflow
        - >-
          Closest incumbent analog to a plaintiff operating system, especially for firms that already want a system of
          record
      - - Filevine
        - Incumbent workflow suite
        - Scale not publicly quantified in retained sources; pricing routed through demos/custom packaging
        - Litigation, PI, and matter-management heavy firms
        - AI medical chronology, deposition intelligence, validation, documents, calendaring, payments
        - Strong incumbent threat because workflow depth is real even without Eve-style marketing language
      - - CloudLex / CasePeer
        - Plaintiff-specific incumbent suites
        - Pricing mostly custom or demo-led in reviewed public materials
        - Plaintiff boutiques and regional PI firms
        - Intake, matter management, documents, medical timelines, settlement support, reporting, legal AI
        - Lower frontier-model mystique than Eve but strong embedded workflow and plaintiff credibility
      - - Harvey / CoCounsel / Lexis+ / Paxton
        - General legal AI substitutes
        - Harvey at $11B valuation; others sold through large legal-tech platforms or SaaS subscriptions
        - Broad legal buyers across law firms and legal teams
        - Research, drafting, document analysis, due diligence, assistant or agent workflows
        - Serious substitute for drafting and research layers, but not a plaintiff-native intake-to-settlement system
