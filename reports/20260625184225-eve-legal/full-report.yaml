      - Diligence ask
    rows:
      - - Reference-customer concentration in large flagship firms
        - Medium
        - High
        - Growing firm count and broad logo set reduce single-logo dependence at the surface level
        - Public materials do not disclose revenue concentration, NRR, or churn by cohort
