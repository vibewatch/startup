      - number: '4.2'
        title: GTM motion, customer ROI, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The commercial case for Eve is strongest where customer stories expose the workflow math. Archuleta says
              the firm handles about 1,000 leads per month across all 50 states, that about half of inbound callers
              voluntarily choose AI intake, and that capacity doubled without adding staff. Laurel says demand-letter
              drafting fell from two to four hours to about 15 minutes, while its demand agent lifted weekly mailed
              demand letters from 48 to 104 and reduced human touch time to three to five minutes per letter. Frontier
              says Eve turned several days of interrogatory work into 45 minutes and now lets the team do five times
              more work in the same span. Those are not audited financial statements, but they are the clearest public
              evidence that Eve is selling labor leverage and throughput, not just prettier drafting.


              The harder question is whether that workflow leverage converts into attractive software economics.
              Public-company proxies say it can: Intapp’s filed March 2026 numbers showed 27% SaaS growth, 31% cloud ARR
              growth, and 123% cloud NRR, while DISCO showed continued revenue growth but still negative GAAP earnings.
              That is a useful pattern for Eve. A scaled legal-software company can compound recurring revenue and still
              absorb growth investment for longer than generic SaaS. But Eve does not disclose its own gross margin,
              services mix, CAC, payback, or retention. Investors therefore have enough evidence to believe the model
              could be attractive, but not enough to close the loop from customer ROI to unit economics without
              data-room support.
