      - number: '7.3'
        title: Privacy, HIPAA, privilege, and platform dependence
        blocks:
          - type: paragraph
            body: >-
              Eve's public materials repeatedly emphasize that it is built for sensitive plaintiff-law data. The
              homepage says client data is private, isolated, and privilege-protected; the security page says the
              company follows SOC 2 criteria, performs annual penetration testing, uses least-privilege access controls,
              runs quarterly access reviews, and hosts services on AWS and Azure with U.S.-based AWS databases; and the
              medical-overview page says Eve is HIPAA compliant, that medical records are encrypted in transit and at
              rest, and that protected health information is not used to train AI models. Those are meaningful signals,
              and the enterprise terms add more formal structure by requiring security safeguards, carrying E&O and
              cyber insurance, and defining customer data ownership. But the same documents also expose why privacy and
              platform risk remain material. Eve receives a license to host, copy, transmit, and display customer data
              as needed to provide the service; it can suspend service for security risk or court order; it disclaims
              uninterrupted or error-free operation; and it expressly says subprocessors may discontinue hosting and
              that Eve is not liable for those discontinuations.


              HIPAA risk should be characterized carefully. HHS guidance and 45 CFR 164.410 clearly set out breach
              duties for covered entities and business associates, including notification without unreasonable delay and
              within 60 days by a business associate to the covered entity. HHS also defines business associates as
              vendors that create, receive, maintain, or transmit PHI on behalf of a covered entity or another business
              associate. Public sources do not show whether Eve is acting as a HIPAA business associate in every
              customer workflow, because plaintiff-law firms often obtain medical records through authorizations and not
              every matter creates a direct covered-entity/vendor chain. So the precise HIPAA role is not fully proven
              from public sources. Still, Eve is plainly processing sensitive medical records at scale, and that means a
              breach, model misrouting, or access-control failure would create severe exposure even where the governing
              theory is contractual confidentiality, state privacy law, or malpractice rather than HIPAA enforcement
              alone.


              Privilege risk is similarly nuanced. The strongest 2026 public case in this area is Warner v. Gilbarco,
              where a Michigan federal court held that AI-assisted litigation materials retained work-product protection
              and that ChatGPT use did not automatically waive that protection. That helps the bull case. But it is not
              a blanket privilege blessing, and it does not convert product marketing into doctrine. The court was
              dealing with specific litigation facts, and other 2026 commentary and docket activity show genuine
              disagreement about how public or third-party AI use interacts with privilege. For Eve customers, the
              practical lesson is that privilege is a workflow property, not a software feature: it depends on
              data-selection discipline, contractual controls, platform confidentiality, and attorney supervision. Add
              the fact that the SLA excludes cloud-provider and integrated-application outages from downtime
              calculations, and the operational takeaway is stark: plaintiff firms remain exposed if AWS, Azure, or a
              key CMS integration fails near deadlines, even if Eve itself has done nothing technically wrong.
