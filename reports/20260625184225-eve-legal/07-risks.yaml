callouts:
- calloutType: risk
  title: The core legal risk is agentic scope, not generic AI usage
  body: Eve is safest when it remains a reviewable drafting and triage layer. Risk rises sharply when customers let agents set strategy, communicate legal advice, or move filings forward without meaningful human review.
  claimRefs:
  - CR013
  - CR015
  - CR016
- calloutType: risk
  title: Privilege is not a product feature you can buy once
  body: Public materials say Eve is privilege-protected, but 2026 case law shows privilege and work-product outcomes still depend on platform confidentiality, attorney involvement, selected inputs, and forum-specific doctrine.
  claimRefs:
  - CR026
  - CR027
  - CR033
- calloutType: insight
  title: Incumbents do not need Eve’s workflow breadth to hurt Eve’s economics
  body: If LexisNexis or Thomson Reuters can bundle trusted content, acceptable AI governance, and “good-enough” workflow tooling into existing subscriptions, Eve’s plaintiff-law specialization must keep proving measurable ROI to defend price and retention.
  claimRefs:
  - CR034
  - CR038
  - CR040
