tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk / rule / trigger
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Current mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Agentic drafting and casework drifts into regulated legal practice
    - Multi-state / state-bar governed
    - No Eve-specific action found; 2026 California guidance tightened supervision expectations for agentic AI
    - Medium
    - Critical
    - Attorney review and approval gates; product framed as augmenting lawyers, not replacing them
    - A few state-bar complaints, insurer restrictions, or procurement freezes could chill adoption before formal enforcement
    - Review customer engagement letters, human-review logs, and any state-specific outside counsel memoranda on UPL
  - - Lawyer competence and supervision failures under Rules 1.1 and 5.5
    - All U.S. jurisdictions
    - Current and ongoing obligation whenever AI is used in client work
    - High
    - High
    - Citations, source links, internal policies, and customer training materials
    - If firms treat Eve outputs as final rather than reviewed drafts, sanctions and malpractice risk shift quickly into customer relationships
    - Inspect training completion, approval workflows, and audit trails for high-stakes outputs
  - - Client-confidentiality failures under Rule 1.6
    - All U.S. jurisdictions
    - Always-on risk whenever sensitive matter data enters the system
    - Medium
    - High
    - SOC 2-aligned controls, least privilege, encryption, customer-data ownership provisions
    - Privilege/confidentiality questions remain workflow-specific and can fail through customer misuse or integration scope creep
    - Request architecture diagrams, DPA/BAA packet, and matter-level permissioning controls
  - - Court scrutiny of AI-generated filings and lack of candor
    - Federal and state courts
    - Active; 2023-2026 sanctions record keeps expanding
    - Medium
    - Critical
    - Open-and-verify citations, source-linked outputs, attorney sign-off before release
    - A single public sanction naming Eve-supported work would have reputational spillover across plaintiff law
    - Ask for internal incident register, quality-escalation policy, and any customer litigation holds tied to AI outputs
  - - HIPAA/business-associate misclassification across medical-record workflows
    - Federal / HHS OCR
    - Public scope not fully established from reviewed materials
    - Low-Medium
    - High
    - Eve publicly claims HIPAA compliance and non-training on PHI
    - If customer data flows actually create business-associate status, breach obligations and contractual exposure sharpen materially
    - Verify when Eve signs BAAs, what data flows trigger them, and whether subcontractors inherit obligations
  - - Adverse state-bar or insurer guidance restricting agentic legal AI
    - State bars / malpractice carriers
    - No Eve-specific bulletin identified
    - Medium
    - High
    - Human-in-the-loop positioning and client-disclosure guidance
    - Adoption can slow sharply if malpractice carriers or large firms narrow approved use cases
    - Collect customer carrier policies, procurement objections, and any outside ethics opinions obtained by top accounts
  notes: Rows are ordered by residual severity using public legal guidance and disclosed product scope as of 2026-06-11. Public sources do not reveal any Eve-specific bar action or insurer restriction.
  enumerationScope:
    coverage: partial
    basis: 'Covers the highest-severity legal and ethics risks visible from reviewed public materials: ABA rules, California’s 2026 agentic-AI guidance, HIPAA/public-privacy obligations, and court-sanction precedent. It is not a 50-state survey of every bar opinion or insurer bulletin.'
