  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hipaa-scope
    missingEvidence: Executed BAAs, customer-by-customer data-flow maps, and subprocessor inheritance terms showing when Eve actually functions as a HIPAA business associate.
    whyItMatters: The severity and timing of breach duties, indemnities, and customer procurement friction depend on whether Eve is inside a HIPAA-regulated chain or merely handling sensitive legal records outside that framework.
    diligencePath: Request current BAA templates, customer archetype data maps, and a matrix of which workflows are covered by HIPAA, state privacy law, or only contract/confidentiality commitments.
    relatedQuestionRefs:
    - QR011
    - QR032
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-customer revenue share, logo concentration, NRR, churn, and cohort expansion data by customer size and workflow module.
    whyItMatters: Public firm counts do not show whether Eve is broadly diversified or economically dependent on a small number of reference accounts with outsized usage and renewal leverage.
    diligencePath: Obtain top-10 customer concentration, cohort retention tables, and module-level expansion data for the last 8 quarters.
    relatedQuestionRefs:
    - QR022
    - QR024
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: Independent error-rate data, escalation volumes, sanction history, and red-team or audit findings for citation accuracy, chronology quality, and privilege-screening failures.
    whyItMatters: Public product claims show design intent, but investors need outcome evidence to assess whether human-in-the-loop controls are actually containing hallucination and malpractice risk at scale.
    diligencePath: Request QA dashboards, incident logs, customer support categorization, and any insurer, regulator, or customer notices tied to output quality.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: platform-resilience
    missingEvidence: Named critical vendors, failover architecture, recovery-time and recovery-point objectives, and evidence of tested business-continuity drills for cloud and CMS outages.
    whyItMatters: The contract already shifts meaningful outage risk back to customers, so resilience evidence is needed to determine whether deadline-critical disruption is a tail event or a routine operating constraint.
    diligencePath: Review architecture diagrams, tabletop exercises, postmortems, and customer communications from the most recent material outage or degraded-service event.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR020
    - QR021
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: state-specific-upl-enforcement
    missingEvidence: A full 50-state survey of bar opinions, insurer bulletins, and procurement restrictions specific to agentic plaintiff-law workflows.
    whyItMatters: The highest-severity downside could arrive through a few key state or insurer restrictions rather than through a single federal rule, so point-in-time national guidance is incomplete.
    diligencePath: Commission state-by-state outside counsel review focused on major plaintiff-law jurisdictions and malpractice-carrier positions.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-governance-burden
    missingEvidence: Implementation timelines, required customer staffing, training completion rates, and support intensity by cohort for large-firm deployments.
    whyItMatters: If successful adoption depends on unusually high enablement or customer-side AI leadership, then gross-margin and scaling assumptions may be too optimistic for a workflow-heavy legal AI platform.
    diligencePath: Request deployment playbooks, time-to-value dashboards, professional-services staffing ratios, and renewal outcomes by implementation complexity.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
