- id: TR003
  title: Privacy / platform / dependency risk register
  columns:
  - Dependency / failure mode
  - Likelihood
  - Severity
  - Current mitigation
  - Residual exposure
  - Diligence ask
  rows:
  - - Medical-record or PHI breach
    - Medium
    - Critical
    - Security program, encryption, annual pen test, incident response, cyber insurance
    - Public sources do not show detailed BAA scope, subcontractor list, or breach drill results
    - Request security packet, BAA templates, incident playbooks, and recent audit results
  - - Privilege challenge despite “privilege-protected” marketing
    - Medium
    - High
    - Matter isolation, confidentiality terms, attorney review, controlled inputs
    - Privilege is determined by workflow, forum, and confidentiality facts, not by product labeling
    - Review enterprise controls for logging, retention, and data use under customer-specific configurations
  - - Cloud outage or integration failure stops casework near deadlines
    - Medium
    - High
    - 99.5% SLA, backups, monitoring
    - SLA excludes cloud-provider and integrated-application outages; service credits do not cure deadline misses
    - Ask for failover design, RTO/RPO, offline export paths, and deadline-contingency procedures
  - - Subprocessor discontinuation or model/vendor policy shift
    - Medium
    - High
    - Vendor review program; multi-system architecture implied by AWS/Azure references
    - Terms say subprocessors may discontinue hosting and Eve is not liable for those discontinuations
    - Obtain named critical vendors, portability terms, and migration procedures
  - - Public-site privacy practices and analytics create messaging mismatch
    - Low-Medium
    - Medium
    - Opt-outs exist and marketing-site collection is separable from matter handling
    - Privacy policy references analytics and advertising partners, which may alarm buyers if not clearly segmented from matter data controls
    - Confirm separation between marketing telemetry, product telemetry, and client-matter environments
  notes: Platform and privacy rows combine contractual, technical, and legal exposure because plaintiff-law workflows tie them together in practice.
