- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - UPL / supervision risk
    - State bar or insurer says agentic drafting/intake exceeds approved use without tighter human review
    - Any published restriction from a major plaintiff-law state, insurer, or top-20 customer
    - Pause expansion of autonomous features until review controls and permitted-use boundaries are revalidated
  - - Hallucination / sanctions risk
    - Court order, sanction, or public corrective filing tied to Eve-supported output
    - One confirmed public incident naming Eve output or a pattern of customer near-misses
    - Escalate to red diligence; require incident root cause, remediation proof, and customer containment
  - - Privacy / HIPAA / privilege risk
    - Security incident or confidentiality challenge involving medical or privileged matter data
    - Material breach, regulator inquiry, or adverse privilege ruling tied to platform design rather than isolated misuse
    - Reprice the investment around legal-liability reserve, customer attrition, and slower go-to-market
  - - Platform dependency risk
    - Cloud/CMS outage blocks time-sensitive workflows
    - Repeated downtime or a single deadline-critical outage without credible recovery posture
    - Require failover remediation, offline workflows, and stronger contractual protections before increasing exposure
  - - Buyer concentration risk
    - Flagship-logo churn or sharp usage contraction
    - Loss of a top reference account or evidence that large firms are narrowing scope after pilots
    - Re-underwrite retention durability and sales efficiency assumptions
  - - Competitive/execution risk
    - Incumbent bundles verified legal content with comparable plaintiff workflow
    - Sustained win-rate deterioration against Lexis/Westlaw-linked tools or CAC inflation without expansion-offset
    - Shift valuation stance toward execution discount unless Eve proves durable plaintiff-native ROI
  notes: Kill criteria are not mechanical trading signals. They are escalation triggers for investor review because each one could break trust faster than revenue metrics alone would reveal.
