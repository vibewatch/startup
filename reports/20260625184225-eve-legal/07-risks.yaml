- id: hallucination-evidentiary-and-malpractice-risk
  title: Hallucination, evidentiary, and malpractice risk
  body: 'Recent case law removes any illusion that courts will excuse AI mistakes because a tool was involved. Mata v. Avianca remains the canonical warning: Judge Castel sanctioned the lawyers and their firm after ChatGPT-generated fake cases were filed and then defended, emphasizing that existing rules impose a gatekeeping role on attorneys. The 2026 Ninth Circuit order in Lnu v. Blanche takes the doctrine further and is especially important because it is appellate-level, recent, and explicit: the court said the rules are not violated at the point of research or drafting, but at the point of signing and filing. It imposed monetary sanctions and a six-month suspension after lawyers filed briefs containing nonexistent cases and then failed to make a prompt, candid disclosure about AI as the source of the errors. The through-line is simple: legal AI can assist, but it does not dilute responsibility.


    That precedent matters directly to Eve because the product is marketed for demands, motions, discovery responses, interrogatories, chronologies, and research inside live matters. Some of those outputs are not court filings, but they still create evidentiary and malpractice exposure. A wrong chronology can distort case valuation. A hallucinated or overstated medical fact can infect a demand letter, settlement negotiation, mediation brief, or deposition outline. A weakly verified discovery response can trigger evidentiary problems, sanctions, or credibility damage. Eve clearly knows this risk exists: its platform says research citations can be opened and verified, its medical overview says every data point is linked to page-level source material, and its discovery workflow says attorney review is essential while privileged or work-product materials should be excluded from selected inputs. Those are good controls, but they also double as admissions that accuracy and over-disclosure are
    live failure modes.


    The 2025 Morgan & Morgan sanctions order reinforces that internal legal AI is not a safe harbor. There, a firm''s own platform produced fake cases, and the judge stressed that the duty to verify is nondelegable. That is the right frame for Eve diligence. The key question is not whether Eve uses better retrieval, templates, or citations than consumer chatbots. It is whether a plaintiff firm under deadline pressure will reliably operate the product with enough human verification to stop factual drift, citation hallucinations, and overclaiming before outputs reach an insurer, opposing counsel, mediator, or court. Public materials do not disclose an independent error rate, claims experience, or sanction history for Eve itself. Without those metrics, investors should assume that output-integrity risk scales with customer workload and product autonomy, not just with model quality.'
