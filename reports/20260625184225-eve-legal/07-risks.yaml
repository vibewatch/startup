- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: 'Eve is not ignoring these risks. Publicly visible mitigants include attorney-review gates in launch materials, source-linked medical and research outputs, a security program mapped to SOC 2, annual penetration testing, least-privilege controls, explicit customer-data ownership language, E&O and cyber insurance, and an uptime commitment that—while limited—at least creates a contractual baseline. The company also appears to understand the organizational side of safe adoption: its blog content encourages law firms to create responsible-AI policies, client disclosures, training requirements, and escalation procedures for malformed outputs or breaches. Those are the right ingredients for a compliance-grade legal AI vendor.


    The problem is that most of the visible mitigants are process claims rather than independently measured outcomes. Public sources reviewed here do not show an outside audit of citation accuracy, a public incident history, a disclosed sanction track record, customer retention data, or evidence that Eve''s autonomous workflows have been tested under adversarial or regulatory review across multiple jurisdictions. That means an investor should treat management maturity as promising but unproven at the level needed to underwrite a platform that sits inside live litigation and settlement workflows. The next stage of diligence should therefore focus on hard evidence: sample QA dashboards, red-team results, breach-response drills, insurer history, model-governance policies, privileged-data architecture, and customer-level renewal/cohort data.


    For underwriting purposes, the cleanest thesis-break triggers are also monitorable. A public sanction, bar complaint, or adverse court order tying Eve output to attorney misconduct would be a major red flag because it would attack trust at the exact point Eve is trying to become system-of-work. A material security incident involving medical records or privileged matter data would have similarly outsize consequences. So would meaningful churn among flagship firms, or proof that large incumbents can match plaintiff-specific workflow breadth while bundling trusted legal content more cheaply. Absent those events, Eve still has a plausible path to category leadership. But the investment case should be conditioned on continued human-in-the-loop discipline, low incident rates, durable reference customers, and evidence that governance is scaling as quickly as autonomous product scope.'
