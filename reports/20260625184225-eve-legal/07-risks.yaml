- id: TR002
  title: Output integrity / evidentiary / malpractice risk register
  columns:
  - Failure mode
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure
  - Diligence ask
  rows:
  - - Hallucinated citation or authority reaches court filing
    - Medium
    - Critical
    - Source-verification UX; attorney review; research product promises open-and-verify citations
    - Recent courts impose fines, suspensions, and candor sanctions; signing duty remains nondelegable
    - Demand sample filing workflows, citation QA metrics, and exception logging
  - - Factual hallucination or bad chronology skews demand, mediation, or valuation
    - Medium
    - High
    - Page-level links to source documents; nightly audit findings routed to humans
    - Settlement posture can be distorted before a court ever sees the issue
    - Review error-rate dashboards on chronologies, damages extraction, and source mismatches
  - - Discovery response over-discloses privileged or work-product material
    - Medium
    - High
    - Workflow tells users to exclude privileged documents and verify every sentence
    - Product guidance helps, but one mistaken document selection can still waive protections or create motion practice
    - Test privilege-screening controls and document-selection defaults in customer environments
  - - Agentic audit/recommendation creates hidden reliance by overworked staff
    - Medium-High
    - High
    - Attorney sign-off; customer governance policies; AI-use training
    - As volume rises, teams may trust queues and risk scores without re-checking underlying evidence
    - Inspect reviewer load, escalation thresholds, and whether low-confidence outputs are blocked or merely labeled
  - - Lack of public quality benchmarks masks tail-risk frequency
    - High
    - Medium-High
    - Customer testimonials and source-linked product design are positive but indirect
    - No public independent accuracy, sanction, or claims-history dataset was found in reviewed materials
    - Request cohort-level QA metrics, customer complaint logs, and insurer or E&O notices
  notes: These are workflow risks rather than accusations of known defects. Public evidence supports the presence of mitigation features, but not their measured effectiveness at scale.
