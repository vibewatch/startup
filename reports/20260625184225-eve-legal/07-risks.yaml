- id: buyer-concentration-competition-and-execution-risk
  title: Buyer concentration, competition, and execution risk
  body: 'Eve''s traction is real, but the risk profile is shaped by where that traction sits. In January 2026 the company said it had more than 500 leading plaintiff firms and 10x revenue growth; by June it said the broader platform was in production with more than 900 plaintiff firms; the homepage now says 1,200+ firms. Those are strong adoption signals, yet the public customer proof still clusters around a relatively visible set of flagship plaintiff firms such as Mike Morse and James Scott Farrin. That does not prove dangerous revenue concentration, but it does show concentration of reference value, workflow learning, and reputational leverage in a small number of large, sophisticated customers. Public materials do not disclose churn, NRR, average contract value, seat concentration, or the share of usage coming from the biggest logos. That absence matters because if a few high-volume firms pause, switch, or narrow scope, Eve could lose both revenue and the credibility that fuels new customer
    acquisition.


    Execution risk is amplified by the nature of what Eve is trying to build. A narrow legal copilot can disappoint without breaking the business. An ''AI operating system'' that promises intake, analytics, drafting, nightly auditing, and cross-case intelligence has to synchronize product quality, data ingestion, integrations, customer change management, and legal-risk controls at the same time. Eve''s own case studies describe the need for Chief AI Officers, acceptable-use policies, governance review, and deliberate change management to overcome employee fear and workflow disruption. That is bullish in one sense because it suggests serious customers are embedding the product deeply. It is bearish in another sense because it means deployment success depends on customer operational maturity, not just product demand. If customers need dedicated AI leadership, custom playbooks, and extensive implementation support, gross-margin leverage and renewal durability may be lower than a pure self-serve
    SaaS story implies.


    Competitive risk is also no longer hypothetical. Thomson Reuters and RELX are not waiting to see if legal AI works; they are already using AI adoption to drive growth in their core legal franchises. Thomson Reuters Institute''s market data show legal GenAI adoption is climbing while policies and training lag, and RELX''s 2025 Form 20-F says its Law Firms & Corporate Legal segment is posting double-digit growth driven by Lexis+ AI and Protégé. The same filing warns that legal markets are highly competitive and dynamic, that AI and new competitors can change demand quickly, and that privacy, cybersecurity, cloud, software, and large-language-model dependencies can all hurt performance. Those statements are about RELX, but they also illustrate why Eve''s moat is fragile: incumbents have verified legal content, entrenched distribution, and the capital to absorb product mistakes. Eve can still win if plaintiff specialization and workflow depth stay meaningfully ahead of those incumbents,
    but the burden of proof is now on execution, governance, and measurable customer ROI rather than on feature novelty alone.'
