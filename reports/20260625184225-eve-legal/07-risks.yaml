chapter:
  number: 7
  title: Risks
  summary: Eve's highest-risk issues are not generic startup risks; they come from selling agentic AI into plaintiff-law workflows that touch substantive legal judgment, privileged materials, and medical records. Primary ethics sources already say lawyers cannot let agentic systems make substantive legal determinations or act without meaningful supervision, while recent court orders show that hallucinated citations and weak disclosure can trigger sanctions, suspensions, and malpractice-style exposure. Add cloud/CMS dependence and accelerating incumbent competition from LexisNexis and Thomson Reuters, and the key diligence question becomes whether Eve's governance and review loops are scaling as fast as its product ambition.
sections:
- id: regulatory-ethics-and-upl-risk
  title: Regulatory, ethics, and unauthorized-practice-of-law risk
  body: 'Eve is not marketing itself as a back-office note taker. Its homepage and platform pages say it handles intake, medical chronologies, motions, demands, discovery responses, research, and firm analytics, and its 2026 launch materials describe agents that act automatically as new information arrives, draft required documents, and manage routine intake and status updates while attorneys review and approve work before it leaves the firm. That positioning is commercially powerful, but it also puts Eve close to the boundary that bar guidance now treats as the core legal-AI risk: the point where software stops being a drafting aid and starts functioning like a quasi-representative actor inside legal service delivery. Eve''s own messaging tries to keep humans in control, yet its differentiation depends on pushing further into exactly the workflows that regulators and courts treat as professional judgment territory.


    The binding baseline remains old-fashioned. ABA Formal Opinion 512 says lawyers using generative AI still owe duties of competence, confidentiality, client communication, and reasonable billing. Model Rule 1.1 requires competent representation, Rule 1.6 requires reasonable efforts to prevent unauthorized disclosure or access, and Rule 5.5 bars assisting unauthorized practice of law. The sharper 2026 source is California''s updated practical guidance, which explicitly addresses agentic AI and says lawyers must not deploy systems so that they make substantive legal determinations, communicate legal advice, prepare and file pleadings, or otherwise act in a representative capacity without meaningful lawyer supervision and review. That matters because Eve now frames its product as an AI workforce with execution, review, and intelligence layers rather than a passive software tool.


    The immediate risk is not that Eve itself will be declared a law firm tomorrow. It is that the more its product automates intake qualification, legal drafting, issue spotting, and next-step recommendations, the more state-specific UPL, supervision, and disclosure questions move from abstract policy debate into customer procurement and claims handling. Thomson Reuters Institute''s 2026 UPL analysis underscores that there is still no uniform definition of the practice of law across states, and that the sensitive boundary is applying law to specific facts and recommending a course of action. For Eve, that ambiguity cuts both ways: it preserves room to operate, but it also means a few adverse state-bar or court examples could chill adoption much faster than a slow-moving statute. In a risks chapter, that should be scored as a high-severity, medium-likelihood issue because the downside can show up through customer hesitation, court scrutiny, or insurer/law-firm policy tightening even before
    any formal enforcement action names Eve directly.'
