      - number: '7.2'
        title: 幻觉、证据与法律过失风险
        blocks:
          - type: paragraph
            body: >-
              近期判例打消了一个幻想：法院不会因为牵涉工具就原谅 AI 错误。Mata v. Avianca 仍是标志性警示：律师提交并随后辩护 ChatGPT 生成的虚假案例后，Castel
              法官制裁了律师及其律所，并强调现有规则要求律师把关。2026 年第九巡回法院在 Lnu v. Blanche
              中的命令把教义又推进一步，而且尤其重要，因为它来自上诉层级、时间很近、表述明确：法院称，违规不发生在研究或起草环节，而发生在签署和提交环节。律师提交含有不存在案例的简报后，又未能就 AI
              是错误来源及时、坦诚披露，法院因此处以金钱制裁和六个月停业。贯穿其中的逻辑很简单：法律 AI 可以辅助，但不会稀释责任。


              这些先例直接关系到
              Eve，因为产品面向真实案件中的索赔函、动议、证据开示回复、质询书、时间线和研究销售。部分输出不是法院文件，但仍会造成证据和法律过失暴露。错误时间线会扭曲案件估值。幻觉或夸大的医疗事实会污染索赔函、和解谈判、调解简报或证词提纲。核验不足的证据开示回复会引发证据问题、制裁或信誉损害。Eve
              显然知道这类风险存在：其平台称研究引文可打开并核验，医疗概览称每个数据点都链接到页级来源材料，证据开示工作流称律师审查必不可少，同时应从选定输入中排除特权或工作成果材料。这些控制很好，但也等于承认准确性和过度披露都是现实失效模式。


              2025 年 Morgan & Morgan 制裁令进一步说明，内部法律 AI 不是安全港。该案中，律所自有平台生成了虚假案例，法官强调核验义务不可委托。这正是审查 Eve 时应采用的框架。关键问题不是 Eve
              是否比消费级聊天机器人用了更好的检索、模板或引用，而是在截止期限压力下，原告律所能否可靠地以足够人工核验运行产品，在输出触达保险公司、对方律师、调解员或法院之前，拦住事实漂移、引用幻觉和过度主张。公开材料没有披露
              Eve 自身的独立错误率、索赔经验或制裁历史。没有这些指标，投资人应假定输出完整性风险会随着客户工作量和产品自主性放大，而不只是随模型质量变化。
