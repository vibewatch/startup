      - number: '1.4'
        title: 客户证据、里程碑速度与负面信号
        blocks:
          - type: paragraph
            body: >-
              牵引力是 Eve 超越融资新闻而值得关注的最清晰理由。已审阅材料显示，2025 和 2026 年的规模口径迅速上升：Series B 前后超过 450 家律所，2026 年 1 月超过 500 家，3 月超过
              800 家，当前官网写 1,200-plus，2026 年 6 月 LawNext 报道写
              1,400-plus。这些数字方向上亮眼，但彼此并不完全对齐，因此准确当前数量是尽调项，而非既定事实。即便如此，客户证据异常具体。公开来源点名 Mike Morse Law Firm、James Scott
              Farrin、Barrett & Farahany、Disparti Law Group、Frontier Law Center、Laurel Employment Law 和 Hershey
              Law；案例研究则把每周节省 20 多小时律师时间、产能翻倍或两倍增长、部分工作流平均周期四个月、以及 $27.5 million 判决额归因于使用 Eve 的律所。融资后产品里程碑也在延续，包括 2026 年
              1 月 AI Workforce 发布和 2026 年 6 月 EveOS 扩展。负面一侧同样重要：LLRX 和一份 2026 年 3 月法院文件把 Eve
              关于幻觉防护的营销与培训说法，同一名律师的不准确引用事件联系起来，尽管该律师表示无法判断错误来自 Eve 本身，还是来自他自己的复制粘贴工作流。这不会推翻业务，但说明信任、验证和法律流程控制是实质性尽调风险。
