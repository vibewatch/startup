            body: >-
              Eve 不只是在和新的原告原生 AI 公司竞争。它还在和已经控制原告律所内部获客接待、日程、文件、计费、报告和日常案件流转的软件系统竞争。Litify、Filevine、CloudLex 和 CasePeer
