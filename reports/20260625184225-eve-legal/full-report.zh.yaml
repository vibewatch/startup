        - 索取模块级 DAU/WAU 和按队列渗透率
      - - 律所数量规模
        - 公开来源显示，2026 年各类材料中的叙事从 500+ 家上升到 1200+ 家律所
        - 活跃 logo、留存 logo，以及按模块拆分的付费律所
        - 规模质量比标题 logo 数更重要
        - 索取活跃客户数、GRR/NRR，以及付费与试点拆分
      - - 产品结果
        - 案例研究显示了真实使用、笔录触发和法庭支持
        - 多数生产率和和解提升指标
        - ROI 主张支撑估值和切换成本叙事
        - 索取前后对照队列、基线和可独立审阅的案件样本
      - - 核验质量
        - 内嵌来源和人工审阅控制是真实产品概念
        - 公开基准化的幻觉率、引文率和批准通过率
        - 法庭风险取决于控制实际表现，而不是 UI 主张
        - 索取评测包、抽样方法和事故后 RCA 流程
      - - 集成和数据可携性
        - Clio 同步和 Atlas 意图已确认
        - 支持系统广度、导出完整性和 API 成熟度
        - OS 级定位取决于真实互操作性
        - 索取 API 文档、伙伴清单和导出 / 导入测试数据
      - - 安全 / 合规
        - 公开声称覆盖 SOC 2、HIPAA、AES-256、隔离和零留存
        - 认证范围、已测试控制和事故历史
        - 买方需要控制细节，而不只是标签
        - 索取信任中心材料、最新报告日期和安全架构审阅
      - - 部署速度
        - 公司称律所可在 90 天或更短时间内转为 AI-native
        - 中位上线时间、失败实施和服务负担
        - 快速部署是销售叙事的一部分，也影响真实切换成本
        - 索取上线漏斗指标和实施人员配置模型
