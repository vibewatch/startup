      - number: '7.4'
        title: 买方集中、竞争与执行风险
        blocks:
          - type: paragraph
            body: >-
              Eve 的增长动能是真实的，但风险轮廓取决于这些动能落在哪里。2026 年 1 月，公司称拥有 500 多家领先原告律所，收入增长 10 倍；到 6 月，公司称更广泛平台已在 900 多家原告律所投产；首页现在称
              1,200+ 家律所。这些都是强采用信号，但公开客户证据仍集中在 Mike Morse、James Scott Farrin
              等相对可见的旗舰原告律所。这不能证明存在危险的收入集中，但确实说明参考价值、工作流学习和声誉杠杆集中在少数大型成熟客户手中。公开材料没有披露流失率、NRR、平均合同价值、席位集中度，或最大 logo
              贡献的使用份额。这一缺口很重要，因为如果少数高量级律所暂停、切换或缩小范围，Eve 可能同时失去收入和推动获客的可信度。


              Eve 想建的东西本身放大了执行风险。狭义法律 copilot 即便令人失望，也不一定击穿业务。一个承诺线索受理、分析、起草、夜间审计和跨案件情报的「AI
              操作系统」，必须同时同步产品质量、数据摄取、集成、客户变更管理和法律风险控制。Eve 自己的案例研究提到，需要 Chief AI
              Officers、可接受使用政策、治理审查和审慎的变更管理，来克服员工恐惧和工作流扰动。从一个角度看，这是利好，因为它说明严肃客户正在深度嵌入产品；从另一个角度看，这是利空，因为部署成功取决于客户运营成熟度，而不只是产品需求。如果客户需要专门
              AI 领导者、定制 playbook 和大量实施支持，毛利率杠杆和续约耐久性可能低于纯自助 SaaS 叙事所暗示的水平。


              竞争风险也不再是假设。Thomson Reuters 和 RELX 没有等着验证法律 AI 是否有效；它们已经在用 AI 采用推动核心法律业务增长。Thomson Reuters Institute
              的市场数据显示，法律 GenAI 采用在上升，而政策和培训滞后；RELX 的 2025 Form 20-F 称，其 Law Firms & Corporate Legal 分部在 Lexis+ AI 和
              Protégé 带动下实现两位数增长。同一份文件还警告，法律市场高度竞争且动态变化，AI 和新竞争者可能快速改变需求，隐私、网络安全、云、软件和大语言模型依赖也都可能伤害业绩。这些表述说的是 RELX，但同样说明
              Eve 的护城河为何脆弱：既有巨头拥有经验证的法律内容、深植的分销，以及吸收产品错误的资本。只要原告侧专业化和工作流深度仍明显领先既有巨头，Eve 仍能赢；但现在证明责任已经落在执行、治理和可衡量客户 ROI
              上，而不再只是功能新鲜感。
