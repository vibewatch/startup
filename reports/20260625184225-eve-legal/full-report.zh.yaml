  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
      - 依据
    rows:
      - - 建议
        - 按上一轮价格跟踪 / 继续研究
        - 没有私有 ARR 证明前，不要按 $1B 标记为新钱承销
        - 公开证据支持增长牵引，但不足以给出干净的收入倍数
      - - 置信度
        - 中
        - 证据足以判断方向，不足以精确定价
        - 融资事实清楚；ARR、留存和 cap table 条款不清楚
      - - 风险评级
        - 高
        - 回报结果高度取决于证明质量和倍数压缩
        - 基准和熊市情景会很快抹掉风险投资式上行
      - - 估值立场
        - 偏高
        - 将 $1B 视为稀缺性溢价标记，而非有公开可比公司支撑的公允价值
        - 融资时客户数量加上谨慎 ACV 假设，意味着倍数很高
      - - 新钱纪律
        - 无证明时 $700-800M；只有强有力的当前 ARR 证明才支持 $1B
        - 要求降价，或证明当前付费 ARR 已显著高于 $60-80M
        - 10-12.5x 级法律科技倍数需要远高于公开披露的 ARR
    notes: 建议仅基于公开证据；对 ARR、留存和优先权条款的私有尽调，可能显著改变立场。
