      - number: '5.2'
        title: EveOS 增加案件数据层、分析能力和可见技术架构信号
        blocks:
          - type: paragraph
            body: >-
              2026 年最清楚的产品变化是 EveOS，它把 Eve 从工作流自动化推向操作系统野心。Lawnext 和 Business Wire 报道一致认为，EveOS 增加了
              Atlas，一个自更新案件数据层，会从案件管理系统、邮件、法院文件、医疗记录和客户沟通中拉取数据；当事实来源冲突出现时，系统应将其标记给人工审查，而不是静默解决。同一发布还把 Analyst 产品扩展到
              beta，用自然语言报告和解历史、盈利能力、节奏和案件分布；Communication Agents 则跨 31 种语言自动化外呼跟进和记录请求任务。Eve Research
              也被定位为智能体内部的原生法院判例层，包括被推翻案例标记和指向来源段落的引用链接。


              公开技术信号支持 Eve 不只是在通用模型外套壳，但还不足以证明可防守的模型质量。Built In 列出一个现代应用栈——Django、PostgreSQL、Python、React 和
              TypeScript。ML Engineer 岗位明确提到特定领域微调、评估框架、生产部署和产品使用信号，以及与 OpenAI 和 Anthropic 直接合作。工程博客更有信息量：一篇文章称 Eve 内部
              WALL-E agent 已经撰写 monorepo 合并请求的 22%；另一篇解释公司在 shard 不稳定和每月超过 $10,000 AWS 成本后，把每案搜索基础设施从 OpenSearch
              迁走。这些是可信的架构和开发者信号。它们说明 Eve 底层确实有基础设施和评估工作，但仍未披露公开 benchmark 分数、正常运行历史，或用于客户法律输出的准确检索与验证设计。
