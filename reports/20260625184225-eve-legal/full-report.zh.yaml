              从客户故事看，用户地图如今相当清楚。Eve
              被获客接待团队、律师助理、律师、业务负责人、运营人员和法律科技负责人使用，因为它位于案件工作流之中，而不是外围。买方和付款方地图不那么明确，但仍可推断：公开部署由所有者、管理合伙人、律所运营负责人和法律技术负责人推动，而不是某个律师刷卡购买。Eve
              自家网站也强化了这一模式，因为商业动作是预约沟通、产品 walkthrough 和候补名单驱动，而不是公布自助计划。实施看起来也偏咨询式。James Scott Farrin 建立实施团队、验证 SOC2 和
              HIPAA 姿态，并签署 Acceptable Use Policy；Mike Morse 通过内部演示处理恐惧；Hershey 按阶段建立 playbook；Frontier
              则围绕现场展示真实用例来推动采用。反复出现的模式是，先切入一个急性瓶颈——获客接待、医疗时间线、索赔函起草或审判准备——再扩展到相邻工作流，最终进入律所层面情报。这是合理的原告律所销售动作，但也意味着上手劳动密集、变革管理重，今天可能更有利于区域性和规模化律所，而不是纯
