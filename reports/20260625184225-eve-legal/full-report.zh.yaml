    title: Eve 竞争耐久度评分卡
    type: kpi
    layout: compact
    summary: 对最可能决定 Eve 能否守住相对原告同业、既有厂商和更广义法律 AI 差异化的公开维度做序数评分。
    data:
      items:
        - label: 原告专业化
          value: 9
          unit: /10
          note: Eve 明确是原告原生，但这种定位并非只有它一家。
        - label: 工作流广度
          value: 9
          unit: /10
          note: 公开材料比大多数直接同业更明确覆盖从接案到证据开示和律所分析。
        - label: 医疗深度护城河
          value: 6
          unit: /10
          note: Supio 和 LawPro 表明，时间线和记录深度已经有人争夺。
        - label: 替换既有厂商的难度
          value: 8
          unit: /10 (risk)
          note: Litify、Filevine、CloudLex 和 CasePeer 已经占住运营工作流和案件数据。
        - label: 通用 AI 商品化风险
          value: 7
          unit: /10 (risk)
          note: Harvey、CoCounsel、Lexis+ 和 Paxton 可以压缩起草和研究切入口。
        - label: 定价透明度
          value: 4
          unit: /10
          note: 与 Clio、MyCase 或 PracticePanther 相比，Eve 公开披露的定价细节更少。
        - label: 多栖部署风险
          value: 7
          unit: /10 (risk)
          note: 叠加式部署和竞争者集成让共存具备现实可能。
    approximationNotes: 评分是分析师基于已审阅公开证据形成的序数判断，并非公司报告的 KPI。
