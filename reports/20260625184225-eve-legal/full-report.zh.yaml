      - number: '4.2'
        title: GTM 动作、客户 ROI 与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Eve 的商业论点在客户故事暴露工作流数学的地方最强。Archuleta 称，该律所每月处理约 1,000 条线索，覆盖全美 50 个州；约一半来电者自愿选择 AI
              获客接待；且未增加员工就实现产能翻倍。Laurel 称索赔函起草从两到四小时降到约 15 分钟，其 demand agent 让每周寄出的索赔函从 48 封增至 104
              封，并把人工接触时间降到每封三到五分钟。Frontier 称 Eve 把数天的质询书工作压缩到 45 分钟，现在团队能在同一时间内完成五倍工作。这些不是经审计财务报表，但它们是最清楚的公开证据：Eve
              卖的是人力杠杆和吞吐量，不只是更漂亮的起草。


              更难的问题是，这种工作流杠杆能否转化为有吸引力的软件经济性。上市公司代理指标显示可以：Intapp 2026 年 3 月申报数字显示 SaaS 增长 27%、cloud ARR 增长 31%、cloud NRR
              为 123%；DISCO 则显示收入继续增长，但 GAAP 盈利仍为负。这一模式对 Eve 有参考意义。规模化法律软件公司可以复合增长经常性收入，同时比通用 SaaS 更长时间吸收增长投资。但 Eve
              没有披露自身毛利率、服务收入占比、CAC、回本期或留存。因此，投资人有足够证据相信模型可能有吸引力，但没有足够证据在缺少 data room 支持时，从客户 ROI 闭环到单位经济。
