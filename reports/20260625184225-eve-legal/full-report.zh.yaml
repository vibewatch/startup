        - 企业 / 定制报价软件，法律工作流覆盖面广
        - 高量 PI 律所以及更广泛的律所和法务部门用户
        - 进线、事项管理、分析、沟通、支付、嵌入工作流的 AI
        - 最接近原告操作系统的既有类比，尤其适合已经想要记录系统的律所
      - - Filevine
        - 既有工作流套件
        - 保留来源未公开量化规模；定价通过演示 / 定制打包推进
        - 诉讼、PI 和事项管理重度律所
        - AI 医疗时间线、证词情报、验证、文档、日历、支付
        - 工作流深度真实存在，即便没有 Eve 式营销语言，也是强劲既有威胁
      - - CloudLex / CasePeer
        - 原告专用既有套件
        - 已审查公开材料中的定价多为定制或演示驱动
        - 原告精品律所和区域性 PI 律所
        - 进线、事项管理、文档、医疗时间线、和解支持、报告、法律 AI
        - 前沿模型光环低于 Eve，但嵌入式工作流和原告可信度很强
      - - Harvey / CoCounsel / Lexis+ / Paxton
        - 通用法律 AI 替代品
        - Harvey 估值 $11B；其他产品通过大型法律科技平台或 SaaS 订阅销售
        - 覆盖律所和法务团队的广义法律买方
        - 研究、起草、文档分析、尽调、助手或 agent 工作流
        - 起草和研究层的严肃替代品，但不是原告原生的进线到和解系统
    notes: 本表把原告原生 AI 直接同行、既有记录系统和更广义法律 AI 替代品分开；规模数值只使用公开披露数字。
