chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与公开运营足迹
        blocks:
          - type: paragraph
            body: >-
              Eve 将自己定位为专为原告律所打造的法律 AI 平台，而不是通用法律研究助手。无论是官网首页、发布材料还是独立报道，公司都把软件描述成覆盖获客接待、评估、诉前、诉讼支持，并越来越延伸到全所运营。到 2026 年
              6 月，公开产品话术已从案件工作助手转向「EveOS」——一个面向原告法律业务的 AI 操作系统，承诺提供 24/7 获客接待、AI
              生成式起草、分析能力和律所实时数据层。总部披露比产品披露薄得多。独立融资报道一致称公司位于 San Francisco，但官网没有公布街道地址。法律实体层面的身份也不如品牌叙事清晰：面向公众的品牌是
              Eve，而隐私材料反复提到 Butler Labs，SiliconANGLE 则称公司为 Butler Labs Inc.。因此，Eve 的商业身份清楚，但准确法律命名惯例比其营销表层更不透明。
