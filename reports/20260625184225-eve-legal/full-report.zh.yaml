  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、伦理与无证执业风险
        blocks:
          - type: paragraph
            body: >-
              Eve 并没有把自己包装成后台记笔记工具。其首页和平台页面称，产品处理线索受理、医疗时间线、动议、索赔函、证据开示回复、研究和律所分析；2026
              年发布材料还描述了会在新信息到来时自动行动的代理，能够起草所需文件、管理常规受理和状态更新，并由律师在工作离开律所前审查批准。这个定位商业上很有力，但也把 Eve 推近了律协指引如今视为法律 AI
              核心风险的边界：软件不再只是起草辅助，而是在法律服务交付里像准代理人一样运转。Eve 自己的信息试图让人类保留控制权，但它的差异化恰恰取决于继续深入监管机构和法院视为专业判断领域的工作流。


              有约束力的基线仍很传统。ABA Formal Opinion 512 规定，律师使用生成式 AI 时，仍负有能力、保密、客户沟通和合理计费义务。Model Rule 1.1 要求胜任代理，Rule 1.6
              要求采取合理措施防止未经授权的披露或访问，Rule 5.5 禁止协助无证执业。更尖锐的 2026 年来源是加州更新后的实务指引，该指引明确谈到代理式
              AI，并称律师不得部署系统，使其在缺乏有意义律师监督和审查的情况下作出实质性法律判断、传达法律建议、准备并提交诉状，或以其他方式以代表身份行动。这一点重要，因为 Eve
              如今把产品描述为带有执行层、审查层和情报层的 AI 劳动力，而不是被动软件工具。


              眼前风险不是 Eve 明天就会被认定为律所。真正的风险在于，产品越多自动化线索资格判断、法律起草、问题识别和下一步建议，各州 UPL、监督和披露问题就越会从抽象政策争论进入客户采购和理赔处理。Thomson
              Reuters Institute 的 2026 年 UPL 分析强调，各州对法律执业仍没有统一定义，敏感边界在于把法律适用于具体事实并建议行动路径。对 Eve
              来说，这种模糊性双向作用：它保留了经营空间，但也意味着少数不利的州律协或法院案例，可能比缓慢推进的成文法更快冷却采用。在风险章节里，应把它评为高严重性、中等可能性问题，因为即使没有任何正式执法直接点名
              Eve，下行影响也可能先通过客户犹豫、法院审视，或保险公司 / 律所政策收紧体现出来。
