  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开证据显示，原告律所从发现 Eve 到扩展工作流，会经历一条路径；图中标出参与者，以及推广可能卡住的环节。
    data:
      items:
        - label: 阶段 1：认知
          description: 律所管理层或法律科技负责人，通过客户故事、法律科技报道，或直接预约产品讲解的行动号召看到 Eve。
          buyerTrigger: Need to handle more cases without proportional headcount growth
          eveValue: Plaintiff-specific proof and named customer stories
          conversionBarrier: No posted pricing; buyer must enter a sales conversation
        - label: 阶段 2：安全与适配评估
          description: 内部推动团队测试 Eve 是否适配执业领域、数据敏感度和现有系统。
          buyerTrigger: Need confidence on confidentiality, HIPAA/SOC2 posture, and workflow fit
          eveValue: Official security claims, CMS compatibility, and legal-tech references
          conversionBarrier: Governance, acceptable-use rules, and data-sharing concerns
        - label: 阶段 3：内部推动用例
          description: 律所先落地一个痛点工作流，例如进件、医疗摘要、索赔函起草或庭审准备。
          buyerTrigger: Visible bottleneck with immediate ROI potential
          eveValue: Quick-output playbooks and tailored workflows
          conversionBarrier: Need internal champions and change-management effort
        - label: 阶段 4：部门推广
          description: 使用场景扩展到进件、律师助理、诉讼律师、运营和管理报告。
          buyerTrigger: Early win proves value and opens cross-team demand
          eveValue: Broader product map across intake, casework, and analytics
          conversionBarrier: Training load, process redesign, and integration work
        - label: 阶段 5：扩展 / 嵌入
          description: 客户增加更多工作流、CMS 同步和律所级分析，让 Eve 进入日常运营节奏。
          buyerTrigger: Need more case capacity, faster cycle time, and better firm visibility
          eveValue: Land-and-expand into adjacent plaintiff workflows
          conversionBarrier: Retention economics and contract durability still undisclosed publicly
    approximationNotes: 各阶段由公开客户故事和官方行动号召综合而来。顺序有证据支撑，但确切转化率和耗时并未公开披露。
    claimRefs:
      - CU009
      - CU018
      - CU019
      - CU021
      - CU031
      - CU032
      - CU036
      - CU041
      - CU042
