      - number: '2.3'
        title: 买方、用户、付款方与采用动态
        blocks:
          - type: paragraph
            body: >-
              原告律所的日常用户就是已经接触案件文件的人：获客接待团队、律师助理、律师、合伙人和运营人员。Eve
              自己的页面明确把合伙人、律师、律师助理和运营专业人士放进工作流，其他供应商的原告运营指南则聚焦获客表单、医疗记录、起草、案件管理和和解后工作。但购买和付款不是个别律师的决定。Wolters Kluwer
              报告称，超过 90% 的受访者如今在日常工作中使用至少一种 AI 工具；ABA Law Practice 对 8am 报告的摘要也称，法律 AI 采用率同比增长超过一倍。但同一份 8am
              摘要称，许多律所仍缺乏正式政策、结构化培训和治理框架，这意味着规模化部署仍由管理合伙人、运营负责人、IT 或其他律所领导层掌握，而不是由单个律师选择工具。原告侧采用由异常直接的 ROI 杠杆拉动：低于 30
              秒的获客响应可以提升转化，大多数 PI 案件庭前和解，重复性起草和记录工作会造成重大桌面时间瓶颈。因此，原告律所软件需求更像运营预算，而不是纯研究软件科目。
