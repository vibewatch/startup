      - number: '5.3'
        title: 验证控制可见，但公开资料无法消除模型风险担忧
        blocks:
          - type: paragraph
            body: >-
              Eve 在营销其验证姿态时异常明确。医疗概览页面称，每个数据点都会链接回来源文件和页码，直接引用与 AI 摘要在视觉上分开。Working With Eve 进一步声称内联来源、一键验证和 AI
              验证框架；安全页面则强调隔离、针对基础模型训练的提示和输出零留存处理、年度审计、HIPAA 合规和 SOC 2 Type
              II。这些控制与原告律所买方应当想要的东西方向一致：敏感工作流中的来源可追溯、人工批准和数据隔离。


              但公开证据也显示，应该把这些控制视为缓释，而不是证明。Eve
              隐私政策描述会与服务提供商、分析伙伴和广告伙伴共享网站个人数据；这是营销网站行为，不是事项文件处理，但仍说明公司有不同隐私表面和不同风险画像。更重要的是，2026
              年负面来源直接反驳任何简单的「幻觉已解决」读法。LLRX 重点提到一封 2026 年 3 月律师道歉信：信中称 Eve 培训强调防护和「Trust but
              Verify」，但不准确引用仍进入法院。该律师无法判断失败来自软件还是自己的工作流，这正是问题所在：验证必须在混乱的真实使用中生效，而不只是营销演示。EDRM、LawAccounting 和
              TechNewsWorld 都展示了更严酷的 2026 年背景：制裁、逻辑层幻觉和 shadow-AI 治理失败，让原生可审计性和人工审查成为基本要求，而不是单靠自身就能差异化。
