  - id: FR001
    title: 风险热力图 — Eve 风险栈
    type: matrix
    layout: wide
    summary: 按发生概率和影响程度，审视 Eve 最主要的法律、隐私、平台和竞争风险。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高概率
          values:
            - ''
            - 客户变更管理摩擦
            - 既有厂商竞争挤压；复核人员过度依赖
            - ''
        - label: 中等概率
          values:
            - ''
            - 参考客户集中
            - 云 / CMS 依赖；保密失误
            - UPL / 监督边界漂移；客户工作中的事实幻觉
        - label: 低概率
          values:
            - ''
            - 正式 HIPAA 角色争议
            - 公开制裁点名 Eve 输出
            - 重大医疗记录或特权信息泄露
    approximationNotes: 单元格是基于公开法律指引、产品主张和不利判例作出的定性判断，并非已披露的事件概率。
    claimRefs:
      - CR015
      - CR016
      - CR021
      - CR032
      - CR038
      - CR041
      - CR043
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Eve 的主要风险向采用率、收入耐久性和估值传导的方式。
    data:
      nodes:
        - id: upl
          label: UPL / 伦理边界
          group: regulatory
        - id: hallucination
          label: 幻觉 / 验证失败
          group: quality
        - id: breach
          label: 隐私 / PHI 泄露
          group: privacy
        - id: platform
          label: 云 / CMS 中断
          group: platform
        - id: reference
          label: 标杆客户流失
          group: customer
        - id: sanction
          label: 法院 / 律师协会制裁
          group: legal
        - id: trust
          label: 信任侵蚀
          group: market
        - id: sales
          label: 销售周期拉长
          group: revenue
        - id: retention
          label: 留存 / 扩展下降
          group: revenue
        - id: valuation
          label: 估值压缩
          group: financial
      edges:
        - from: upl
          to: trust
          label: 客户担心工作流不合规
        - from: hallucination
          to: sanction
          label: 错误输出进入提交文件或代理意见
        - from: sanction
          to: trust
          label: 公开先例损害可信度
        - from: breach
          to: trust
          label: 隐私和特权顾虑加剧
        - from: platform
          to: retention
          label: 截止期限压力和工作流中断
        - from: reference
          to: sales
          label: 失去标杆证据削弱销售管线
        - from: trust
          to: sales
          label: 采购更难，保险方提出异议
        - from: trust
          to: retention
          label: 续约和范围扩展放慢
        - from: sales
          to: valuation
          label: 增长倍数收缩
        - from: retention
          to: valuation
          label: 耐久性溢价消失
    claimRefs:
      - CR016
      - CR021
      - CR022
      - CR032
      - CR043
      - CR045
