  - id: TP004
    title: 转换成本 / 分发能力表
    columns:
      - 竞争者类别
      - 锁定或多栖驱动因素
      - 公开证据
      - 对 Eve 的含义
      - 尽调问题
    rows:
      - - Eve 本身
        - 可接入现有 CMS，也可独立运行；部署摩擦更低，但硬锁定可能受限
        - Eve 称其 AI-ready data 可配合现有 CMS 使用，也可独立使用
        - 落地动作强；除非 Eve 成为日常记录系统，否则护城河偏弱
        - 询问客户中将 Eve 作为主系统与作为叠加层使用的比例
      - - Supio 及类似叠加层
        - 集成优先架构让团队无需替换 CMS 就能叠加 AI
        - Supio 点名可集成 Westlaw、Litify、MyCase、CasePeer
        - 买方整合前可能同时运行多层 AI
        - 要求提供附加率、共存模式，以及面对叠加式部署的赢单 / 输单情况
      - - EvenUp
        - 专业数据和工作流训练可在 PI 运营中形成流程依赖
        - EvenUp 营销 Piai，并覆盖 PI 案件生命周期自动化
        - 即便 Eve 扩展到全律所，诉前专业化仍可能保持粘性
        - 询问 EvenUp 是从 demand letters 扩展到记录系统，还是继续保持模块化
      - - Litify / Filevine / CloudLex / CasePeer
        - 现有案件数据、Intake 流程、报表、日历和计费构成典型记录系统转换成本
        - 公开产品页面强调 Intake、案件计划、分析、文档和支付
        - Eve 面对的最硬既有厂商障碍，尤其是在成熟原告律所
        - 衡量迁移成本、实施时间，以及 Eve 是替代还是与各套件共存
      - - Clio / MyCase / PracticePanther
        - 更低的公开入门价和更广的执业覆盖降低小型律所试点摩擦
        - 公开分层定价和通用执业管理广度披露清晰
        - 若律所偏好更便宜、够用的软件叠加 AI，Eve 的 SMB 触达会被压住
        - 询问何种律所规模和案件复杂度会稳定触发升级到 Eve
      - - Harvey / CoCounsel / Lexis+
        - 借助高端法律订阅、研究习惯和现有采购渠道分发
        - Harvey 规模、CoCounsel 工作流主张、Lexis grounded 起草 / 研究均已公开
        - Eve 赢下全工作流之前，这些厂商可先吃掉起草和研究预算
        - 询问 Eve 多常被拿来对比通用法律 AI，而非原告专用软件
    notes: 这片市场的转换成本耐久度并不均匀；最硬的锁定来自记录系统，而不是独立 AI copilots。
