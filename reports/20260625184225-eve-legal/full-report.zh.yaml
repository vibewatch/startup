      - number: '5.4'
        title: 切换成本看起来真实，但关键技术尽调项仍未披露
        blocks:
          - type: paragraph
            body: >-
              Eve 可能的护城河是运营嵌入，而不是单一突破性模型声明。Atlas 旨在把记录、文件、沟通和案件管理数据规范化进一个案件文件；Clio sync 直接把联系人、笔记和案件细节拉入 Eve；客户故事描述了律所专属
              playbook、由证词驱动的起草触发和夜间审查循环。一旦这些工作流被调到某家律所的模板、获客逻辑和审批检查点上，替换成本就会上升，因为买方替换的不只是软件席位，还有被编码的流程。内部搜索基础设施文章强化了这一推断：逐案检索设计对需要事项专属回忆和可追溯性的律所说得通，也意味着切换会涉及工作流和数据架构迁移。


              即便如此，从技术尽调角度看，这个产品仍无法完全公开承销。已审阅来源没有找到公开状态页、正常运行指标、事故披露、外部 API 参考、除 Clio 和通用 CMS
              声明之外的具名集成目录，也没有关于幻觉率、引用精度或审查通过表现的基准证据。公司控制的规模口径也变化很快——1 月 500-plus 家律所、3 月赞助报道 800-plus、招聘信息 1,000-plus、6
              月官网 1,200-plus——但没有独立分母说明活跃使用、留存或模块渗透。综合来看，Eve 像是少数几个朝原告律所工作流原生 OS 方向建设的法律 AI
              供应商之一，具备真实开发者信号深度和可见产品广度。但技术尽调论点仍依赖私有 data room 来确认可靠性、评估纪律、部署摩擦，以及验证控制能否在法庭级压力下稳定运转。
