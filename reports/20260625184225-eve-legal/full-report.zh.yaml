      - number: '1.3'
        title: 融资历史、投资人组合与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Eve 的融资形成过程有官方和第三方证据充分支撑。公司 2025 年 1 月宣布由 Andreessen Horowitz 领投的 $47 million Series A，Lightspeed 和 Menlo
              Ventures 参投；八个月后又完成由 Spark Capital 领投、Andreessen Horowitz、Lightspeed 和 Menlo 继续参投的 $103 million Series
              B，估值超过 $1 billion。仅这两轮就意味着 2025 年 1 月以来披露融资至少 $150
              million，也把公司稳稳放进后期私营公司地带，而不是早期实验性法律科技。投资人评论也解释了这笔资金要做什么：Spark、Lightspeed 和 Eve 管理层都把公司描述为在打造「AI-native
              law」新类别，资金用于更深产品开发、转型服务、上手培训和更广案件生命周期覆盖。公开资料仍未回答的是，Series B 后治理如何变化、是否包含老股交易，以及投资人组合和创始人之间的持股如何分布。
