            body: >-
              创始团队是 Eve 公开资料里最强的一块。公司官网列出 Jay Madheswaran、Matt Noe 和 David Zeng 为核心创始团队，投资人和访谈报道也拼出一条连贯的创始人—市场匹配故事：Jay
              曾在 Facebook、Rubrik 和 Lightspeed Venture Partners 工作，Matt 和 David 则被描述为技术功底深的 Rubrik 校友。这一点重要，因为 Eve 把工作流
              AI 卖进一个高风险、文件密集的法律垂直领域，产品质量和信任是战略差异点，不是锦上添花。公开来源也支持 2020
              年的起点，尽管市场发布显然更晚。治理则远不那么可见。已审阅来源没有披露董事会构成、投票控制、保护性条款，也没有精确披露创始人之外的内部管理层。因此，创始人匹配和产品可信度看起来很强，但机构治理和股权控制仍是尽调问题，而非已验证事实。
