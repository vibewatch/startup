        title: 直接原告 AI 同行与 Eve 的最近重叠
        blocks:
          - type: paragraph
            body: >-
              与 Eve 最直接重叠的是 EvenUp 和 Supio，而不是更广法律 AI 领域。EvenUp
              已远远超出索赔函，扩展成面向原告的索赔平台，覆盖获客接待、治疗、索赔函、谈判、证据开示、审判、高管分析和沟通智能体。这让它不只是诉前点工具，但其公开叙事仍根植于索赔智能和人身伤害规模。Supio 与 Eve
              当前方向重叠更直接。它明确营销获客接待、时间线、索赔函、诉讼起草、跨案件分析和律所情报，同时强调群体侵权和人工验证输出。换句话说，Supio
              想拥有的不只是一个工作流，而是围绕原告诉讼的记录、论证和洞察层。Darrow 相关但不同：它在更上游做法律风险暴露发现和事项发起，而不是日复一日运营原告律所。ProPlaintiff 和 LawPro.ai
              等较小进入者也说明，医疗时间线、索赔函生成和智能体式案件支持已经在催生更窄挑战者。
