  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - UPL / 监督风险
        - 州律协或保险方认为，在没有更严格人工复核时，agentic 起草 / intake 超出获准用途
        - 主要原告律所州、保险方或前 20 大客户发布任何限制
        - 暂停扩展自主功能，直到复核控制和准许使用边界重新验证
      - - 幻觉 / 制裁风险
        - 法院命令、制裁或公开更正文件与 Eve 支持的输出有关
        - 一起已确认、点名 Eve 输出的公开事件，或客户险情呈现模式
        - 升级为红色尽调；要求事故根因、整改证明和客户侧封堵
      - - 隐私 / HIPAA / 特权风险
        - 涉及医疗或特权案件数据的安全事件或保密争议
        - 重大泄露、监管问询，或不利的特权裁定，且原因指向平台设计而非孤立误用
        - 围绕法律责任准备金、客户流失和 go-to-market 放缓重新定价
      - - 平台依赖风险
        - 云 / CMS 中断阻塞有时限要求的工作流
        - 反复宕机，或一次影响关键期限的宕机且没有可信恢复方案
        - 在提高敞口前，要求完成故障切换整改、离线工作流和更强合同保护
      - - 买方集中风险
        - 标杆 logo 流失或使用量急剧收缩
        - 失去顶级标杆客户，或有证据显示大型律所在试点后缩小范围
        - 重新承销留存耐久性和销售效率假设
      - - 竞争 / 执行风险
        - 既有厂商把已验证法律内容与可比的原告工作流打包
        - 对 Lexis/Westlaw 关联工具的赢率持续恶化，或 CAC 膨胀且扩张收入无法抵消
        - 除非 Eve 证明原告原生 ROI 可持续，否则估值立场转向执行折价
    notes: 终止标准不是机械交易信号，而是投资人复核的升级触发项；每一项都可能比单看收入指标更早击穿信任。
