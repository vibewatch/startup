  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及 2025 年 9 月轮次实际披露了什么
        blocks:
          - type: paragraph
            body: >-
              公开记录中最干净的披露事实很简单：Eve 2025 年 9 月 Series B 融资 $103 million，投后估值超过 $1 billion。Eve
              在自己的融资文章和发布的新闻稿中重复了这个数字，LawNext 和 Artificial Lawyer
              等独立法律科技报道也呼应了同一标题。但对估值更重要的，不只是融资规模，而是这个价格落在什么规模点上。Series B 公告前后，Eve 公开称其八个月内新增 350 多家律所，客户律所超过 450 家，每年处理
              200,000 多个法律案件，并帮助律所追回超过 $3.5 billion 的和解金与判决款。这些都是有意义的增长标记，但不是收入披露。


              与 Eve 自己 2025 年 1 月 Series A 的对比很有用，因为它显示叙事加速得有多快。Series A 时，公司宣布 $47 million 融资，并称 100
              多家律所已采用产品，同时声称收入同比增长 500%。到 2026 年 6 月运行日，Eve 首页已经换成更大的 1,200+ 家律所标题，并把叙事扩展为「原告法律 AI
              操作系统」，覆盖线索受理、诉前、诉讼、AI-ready 数据和律所级情报。这暗示轮后增长有意义，但也引入了尽调问题：公开记录从未解释 450 家律所和 1,200+
              家律所是否按同一定义计算，是否全是付费客户，或其下的平均合同价值是多少。


              缺失的收入桥就是核心估值问题。对一家快速成为原告律所记录系统和行动层的公司来说，$1B+ 投后标记可以自洽。但公开证据仍未披露 ARR、NRR、毛利率或 Series B
              背后的优先权结构。因此，这一轮应被理解为投资人对 Eve 品类潜力的强信号，而不是一个已经被公开市场式收入证据验证的价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
