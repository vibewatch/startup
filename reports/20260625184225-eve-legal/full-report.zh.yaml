        title: 采用轨迹与公开披露 ROI 信号
        blocks:
          - type: paragraph
            body: >-
              Eve 现在有足够多带日期的公开里程碑，可以显示真实采用势头，尽管准确实时总数仍会随每次公告移动。LawNext 报道 2026 年 1 月超过 500 家原告律所；Above the Law 3 月引用
              800-plus；Eve 及其 4 月发布称 1,000-plus 家律所和超过 200,000 个案件；6 月材料把公开区间推到 Eve 自家网站的 1,200-plus，LawNext 对 EveOS
              的报道则高达 1,400。这个进展方向上强劲，尽管 6 月分母在不同来源之间并未完全协调。ROI 证据也强于泛泛「省时间」承诺，但仍是案例研究级别，而不是经审计 cohort 数据。Mike Morse
              称产能翻倍或翻两倍；James Scott Farrin 称医疗摘要从数周降到数分钟，一名律师的案件周期从七到八个月降到四个月；Frontier 称线索转化率从 10% 升至 35%，获客接待时间减少 50
              分钟，平均案件价值上升 90%；Jeffrey Glassman 称约三个月内 90% 索赔函都通过 Eve
              运行。这些是有意义的运营指标，因为它们触及转化、周期、产能和案件经济性，但它们由特色客户自报，应被视为可能性证明，而不是组合平均表现。
