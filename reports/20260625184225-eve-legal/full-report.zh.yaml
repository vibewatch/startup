  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价不透明与客户推导出的收入线索
        blocks:
          - type: paragraph
            body: >-
              从财务形态看，Eve 更像面向原告法律的直销型 B2B SaaS 平台，而不是自助式法律工具。官网持续销售完整操作系统——EveOS、AI
              Intake、Agents、起草、证据开示和分析——但从不公布价目表。公司转而把潜在客户导向演示和销售沟通，同时 Head of Legal 岗位明确提到 MSA、Deal Desk
              审查、客户协议和合作伙伴合同。这个组合强烈指向合同驱动销售、协商定价，以及收入确认前的实施或法律开销。


              最好的公开牵引力信号是客户数量和工作流量，而不是美元收入。官方 Series B 材料称，截至 2025 年 9 月，Eve 已增长到超过 450 家律所、每年超过 200,000 个法律案件、客户追回金额超过
              $3.5 billion。到 2026 年，官方招聘信息把规模口径提高到 1,000-plus 家律所，甚至称收入环比翻倍，但公司仍未披露绝对 ARR
              或收入。因此只能谨慎做基准建模。相邻法律软件供应商公开收费约为每用户每月 $49 到 $130，足以说明原告律所已经支付有意义的软件预算。但即便把这些基准套到 1,000
              家律所，也只能得到很宽的个位数百万到数千万美元年化支出区间。换句话说，Eve 显然拥有可货币化规模，但公开资料仍无法精确钉住实际 ACV、席位数或已确认收入。
