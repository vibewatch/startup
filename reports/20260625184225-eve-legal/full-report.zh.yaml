  - id: TP005
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - 只服务原告的定位让工作流适配和销售话术更锐利
        - EvenUp、Supio、CloudLex、CasePeer、LawPro、ProPlaintiff 也直接卖进 PI 工作流
        - 中
        - 验证 Eve 赢单更多来自广度、品牌，还是可衡量的案件结果
      - - 从 Intake 到 discovery 的广度支撑操作系统叙事
        - 起草和研究层可能被 Harvey、CoCounsel、Lexis+、Paxton 商品化
        - 高
        - 按工作流衡量日活使用，而不只看 logo 数
      - - 原告原生数据结构可能形成可防守飞轮
        - EvenUp 营销最大 PI 数据集，Supio 营销已验证输出和案件智能
        - 高
        - 要求提供专有数据优势、反馈闭环和长期结果改善的证据
      - - 可选 CMS 叠加层降低采用摩擦
        - 同样的可选性也会保留多栖使用，削弱锁定
        - 高
        - 检查 Eve 能否成为主要运营层，而不只是生产力附加工具
      - - 资本和品类势能让 Eve 能参与企业式交易
        - EvenUp 披露融资规模更大，Harvey 的资本获取能力远超原告品类
        - 中
        - 对比同样融资充足的竞品，审阅招聘节奏、服务能力和销售效率
      - - 既有案件管理厂商在 AI 创新上可能更慢
        - 但它们已经掌握案件数据、Intake 流程、报表、支付和用户习惯
        - 高
        - 研究 Eve 面对 Litify、Filevine、CloudLex、CasePeer 的实际替换赢单率
      - - 买方信任可能偏向已验证、原告专用工作流，而非通用 copilots
        - Supio 直接从幻觉、集成和诉讼级验证角度攻击 Eve
        - 高
        - 审阅质量控制、来源可追溯性，以及复杂诉讼案件的客户推荐
      - - 定价不透明保留灵活性
        - 但也让 ROI 更难对标 Clio、MyCase、PracticePanther 的透明套件价格
        - 中
        - 要求提供当前价格卡、实施费，以及按律所规模划分的回本基准
    notes: 核心耐久度问题在于：既有厂商和通用 AI 抹平可见功能差距之前，Eve 能否把广度和原告专业化变成日常运营依赖。
