        - 技术栈可见有帮助，但没有公开架构文档展示租户边界或服务拆分
      - - 案件数据层（Atlas）
        - 把诉讼文件、记录、邮件、CMS 数据和通信规范成实时案件视图
        - 需要接入上游系统，并处理 schema 映射和冲突
        - 公开材料展示的是意图，不是数据血缘细节或对账 SLA
      - - 单案搜索 / 检索
        - 为搜索、检索和上下文 grounding 做按案件索引
        - OpenSearch 分片不稳定且 AWS 成本高之后迁移到 Turbopuffer
        - 没有公开披露召回指标、权限模型或索引重建频率
      - - 智能体编排
        - 监控案件变化，触发起草、审阅和通信动作
        - 工作流规则、案件状态识别和人工批准门
        - 如果触发逻辑薄弱，自主触发可能让错误悄悄扩散
      - - 核验层
        - 输出离开律所前，提供内嵌来源、来源段落链接和人工批准
        - 依赖可靠的引文绑定和 UI 层审阅体验
        - 法庭级失败案例说明，真实使用中核验仍可能失效
      - - 集成层
        - 从外部系统同步案件详情、联系人、备注和其他记录
        - 目前有 Clio 同步；Atlas 暗示更广泛的 CMS / 邮件 / 会计连接
        - 公开 API 文档和支持伙伴清单不可得
      - - 模型开发和评测
        - 微调、评估并部署法律工作流 AI 系统
        - 依赖领域数据、使用信号和与基础模型提供商的协作
        - 没有公开基准包覆盖幻觉、延迟或批准通过率
      - - 工程自动化
        - 内部 WALL-E 智能体加快软件交付
        - Slack 触发后台执行、完整应用启动、浏览器测试和 MR 创建
        - 开发者生产率提升不会自动转化为终端用户法律输出更可靠
    notes: 架构行结合了直接技术披露，以及从招聘和工程文章中做出的谨慎推断；缺少公开文档仍是重大问题。
