        title: 资本充足性、烧钱代理指标与资本强度
        blocks:
          - type: paragraph
            body: >-
              财务上的关键正面是，Eve 不再像一家脆弱的产品前创业公司。已披露的 2025 年 Series A 和 Series B 至少贡献 $150 million，多份 2026 年公司控制来源把总额上调到超过
              $160 million 或 $164 million。这一点重要，因为公司仍在积极招聘。Jobera 2026 年 6 月列出 34
              个开放岗位，覆盖工程、数据、产品营销、安全、财务、收入运营、客户成功、销售和法律。公开薪资区间从低端约 $82,000 到高级工程领导岗位
              $450,000，同时公司还宣传股权、福利、津贴和退休匹配。这些披露没有揭示实际薪酬总额，但显示出一个由风险资本支持的成本基础，与仍在产品、GTM、合规和客户运营上重投入的公司相符。


              问题在于，资本充足性仍无法被精确承销。已审阅来源没有公布现金余额、月度烧钱、跑道月数、债务或信贷额度。即便招聘数据也有两面性：它显示公司可以花钱，但不显示 2025
              年融资后还剩多少现金。最可辩护的看法是，Series B 实质降低了近期融资压力，且赞助方质量让 Eve 相比多数垂直 AI 创业公司有更好的再融资位置。但公开记录仍不能让投资人判断，Eve
              是十二个月后就要再融资，还是在那之后仍资金充裕。
