      - number: '7.5'
        title: 缓释措施、监控与止损标准
        blocks:
          - type: paragraph
            body: >-
              Eve 并没有忽视这些风险。公开可见的缓释因素包括：发布材料中的律师审查关卡、带来源链接的医疗和研究输出、映射到 SOC 2 的安全计划、年度渗透测试、最小权限控制、明确的客户数据所有权语言、E&O
              和网络保险，以及一项虽有限但至少建立合同基线的 uptime 承诺。公司似乎也理解安全采用的组织侧问题：其博客内容鼓励律所制定负责任 AI
              政策、客户披露、培训要求，以及针对畸形输出或泄露的升级流程。这些都是合规级法律 AI 供应商需要的正确要素。


              问题在于，大多数可见缓释因素都是流程主张，而非独立衡量的结果。本文审阅的公开来源没有显示外部引用准确性审计、公开事故历史、已披露制裁记录、客户留存数据，或 Eve
              自主工作流在多个司法辖区接受对抗性或监管审查测试的证据。这意味着投资人应把管理成熟度视为有希望但未被证明，尚不足以承保一个嵌入真实诉讼与和解工作流的平台。下一阶段尽调应聚焦硬证据：样本 QA
              仪表盘、红队结果、泄露响应演练、保险公司历史、模型治理政策、特权数据架构，以及客户层面的续约 / cohort 数据。


              对承保来说，最干净的 thesis-break 触发器也可监控。如果公开制裁、律协投诉或不利法院命令把 Eve 输出与律师不当行为联系起来，就是重大红旗，因为它会在 Eve
              试图成为系统工作底座的关键点攻击信任。涉及医疗记录或特权案件数据的重大安全事件，也会产生同样不成比例的后果。旗舰律所显著流失，或证据显示大型既有公司能在更便宜地捆绑可信法律内容的同时，匹配原告侧工作流宽度，也会触发同类风险。在这些事件缺席时，Eve
              仍有通往品类领导者的合理路径。但投资论点应以持续的人类在环纪律、低事故率、耐久参考客户，以及治理扩张速度跟上自主产品范围为条件。
