companyProfile:
  summary: >-
    Eve 是一家总部位于 San Francisco 的法律 AI 公司，聚焦原告侧律所，而不是 Big Law
    或通用法律研究。公开产品和客户证据显示，其平台覆盖获客接待、医疗记录综合、索赔函起草、证据开示支持、研究、沟通，以及一个较新的案件数据层，意图横跨律所工作流。公司的市场叙事很强：Eve 2025 年 1 月完成 $47
    million Series A，2025 年 9 月以超过 $1 billion 的估值完成 $103 million Series B，Andreessen Horowitz、Lightspeed、Menlo 和 Spark
    都公开背书。客户证据也扎实，既有具名律所引用，也反复声称节省大量时间、提升转化率。核心尽调问题不是 Eve 有没有势头；而是当前付费 ARR、留存和法律风险控制是否足以支撑此前估值，并在现有厂商和相邻法律 AI
    供应商追赶时守住长期领导地位。
