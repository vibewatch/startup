  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Clio（2024 Series F）
        - 估值与已披露 ARR
        - '> $200M ARR 对应 $3B 估值（<15x）'
        - vLex 抬升前，已披露私有法律软件轮次中最好的锚点
        - 广义法律工作流平台，不是原告原生 AI
      - - Clio（2025 Series G + vLex，融资轮）
        - 估值与已披露 ARR
        - $400M ARR 对应 $5B 估值（约 12.5x）
        - 展示大 ARR 规模下高端法律平台定价的样子
        - 包含 vLex 交易背景和债务融资安排
      - - Intapp（公开市场，2026 年 6 月）
        - 市值与年化收入
        - 约 $584M 年化收入对应 $1.78B 市值（约 3.0x）
        - 有法律敞口的受监管专业软件公开可比公司
        - 非原告律所特定，且公开市场通常更严苛
      - - Harvey（2026 年 3 月）
        - 估值与已披露 ARR
        - $190M ARR 对应 $11B（约 58x）
        - 只能作为明确标注的 AI 异常值上限，用于前沿稀缺定价
        - 通用法律 / 专业服务 AI，不是原告工作流
      - - EvenUp（2025 年 10 月）
        - 私有轮次 / 规模标记
        - $2B+ 估值；2,000+ 家律所；ARR 同比翻倍
        - 最接近的已披露原告 AI 估值可比对象，并有有意义的规模标记
        - 未披露绝对 ARR
      - - Supio（2025 年 4 月）
        - 私有轮次 / 增长标记
        - 总融资 $91M；Series A 以来 ARR 增长 4x
        - 相关的原告 AI 同行，定位偏重验证
        - 无公开估值或绝对 ARR
      - - Filevine（2025 年 9 月）
        - 私有规模 / 留存标记
        - $400M 融资；约 6,000 个客户；96% 总留存；120%+ NDR
        - 展示法律软件中既有工作流厂商的规模和留存质量
        - 无公开估值倍数
      - - Litify（2023 + 当前规模）
        - 私有规模 / 所有权标记
        - 450+ 企业客户；70,000+ 法律专业人士；多数股权售予 Bessemer
        - 显示原告和高案件量业务中的平台宽度与买方价值
        - 无公开估值倍数，且融资披露已陈旧
    notes: 表中混合了干净的倍数锚点和方向性的私有规模标记，因为多数私有法律科技同行披露的 ARR 不足以支撑同口径计算。
