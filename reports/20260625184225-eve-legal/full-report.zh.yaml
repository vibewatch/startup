  - id: TI003
    title: 单位经济性表
    columns:
      - 指标 / 代理
      - 公开数值 / 状态
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 销售动作复杂度
        - 通过 MSAs、Deal Desk 和客户协议做直接合同销售
        - 中
        - 意味着周期比自助式 SaaS 更长、售前成本更高，但可能支撑更大的 ACV
        - 要求提供 pipeline 阶段、赢单率、平均销售周期和实施时间线
      - - Intake ROI 代理
        - 40+ 家律所 beta；Archuleta 的 AI-intake 选择率 50%；未增员情况下产能翻倍
        - 中
        - 若转化和人力收益成立，前台回本可被衡量
        - 要求按 cohort 提供线索到签约案件转化的前后对比，以及工时节省
      - - 起草 ROI 代理
        - Laurel 从 2–4 小时缩至 15 分钟；每周 demand letters 从 48 封到 104 封；每封需 3–5 分钟人工介入
        - 中
        - 显示显著人力杠杆和潜在贡献毛利扩张
        - 要求提供 QA 返工率、人工审阅时间和实际节省的律师工时
      - - 大型部署代理
        - Laurel 报告称上线 Eve 后拥有 100+ 名员工和 1,500+ 名活跃客户
        - 中
        - 表明 Eve 能支撑比纯 solo-practice 工具更大、更高价值的客户足迹
        - 要求提供前 20 大客户席位数、ACV 和集中度
      - - 成熟法律软件代理
        - Intapp：123% cloud NRR；DISCO：347 个客户 >$100k，同时仍为 GAAP 亏损
        - 中
        - 说明法律软件平台可扩张经常性收入，同时仍承担增长开支
        - 要求提供 Eve 毛利率、NRR、>$100k 客户数和利润率桥
      - - 核心指标披露
        - 毛利率、CAC、回本期、NRR 和收入结构未公开
        - 中
