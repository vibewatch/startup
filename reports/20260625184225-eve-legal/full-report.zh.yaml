      - number: '8.4'
        title: 正论、反论与上行 / 下行情景
        blocks:
          - type: paragraph
            body: >-
              Eve 的建设性论点是连贯的。原告法律不是玩具切口。PI 和更广泛原告工作流宇宙足够大、运营足够重复、经济上足够敏感，值得用更好的线索受理、起草和和解执行来自动化。Eve 的公开故事也符合成长投资人对垂直 AI
              赢家的期待：logo 快速增长、覆盖广泛工作流，并有野心成为操作系统而不是点状解决方案。如果管理层能证明当前 1,200+ 家律所的标题转化为真实付费 ARR、强留存，以及可扩展、轻服务的部署模型，那么 2025
              年 9 月估值就会开始像是一次激进但可理解的品类领导者押注。


              反论同样清晰。公开证据支持市场机会，但不支持价格。Clio 披露的轮次是在大得多的 ARR 规模上完成的。Intapp 的公开市场比率远低。SaaS Capital 的基准显示，SaaS
              中位数环境仍清醒，而非亢奋。EvenUp 和 Harvey 说明 AI 稀缺溢价可能发生，但 Harvey 是通用法律 AI 离群值，EvenUp 仍未披露绝对 ARR。因此 Eve
              处在一个尴尬估值区间：用公开法律软件可比公司看太贵，但又不够透明，拿不到 Harvey 式豁免传统纪律的资格。


              因此剩下三个实用情景。多头情景要求 Eve 把当前动能转化为约 $250-300 million 退出 ARR，并以 12-14x 的优质退出定价成交，得到约 $3.0-4.2 billion 价值，相比 $1
              billion 标记实现体面的多倍回报。基准情景严苛得多：$120-160 million 退出 ARR、7-9x 倍数，只得到约 $0.84-1.44 billion，几乎只能保本。空头情景——$60-90
              million、4-6x——只产生 $0.24-0.54 billion，并摧毁价值。这种不对称意味着投资观点对证据质量高度敏感，而不只是对公司质量敏感。
            claimRefs:
              - CV044
              - CV045
              - CV046
              - CV047
              - CV048
