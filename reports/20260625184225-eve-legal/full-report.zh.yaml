      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个建设性但不完整的财务结论。Eve
              几乎肯定通过直接合同，把经常性软件卖进一个真实、有预算的痛点。客户故事显示，获客接待、起草和诉讼准备中存在实质人力杠杆。赞助方质量强，已披露资本有分量，公司仍像成长阶段企业而不是收缩企业一样招聘。这些事实支持
              Eve 正在成为原告律所重要垂直软件平台的判断。


              但这仍不同于说该业务可以在 $1 billion-plus 估值上公开承销。最大的缺失项正是决定估值纪律的指标：绝对 ARR 或收入、实际定价、ACV
              分布、毛利率、服务收入占比、CAC、回本期、留存、客户集中度、现金、烧钱和债务。负面资料也重要。2026 年 3 月引用事件不能证明系统性产品失败，但它说明法律 AI 供应商可能需要持续投入
              QA、审计、人工审查和客户培训。综合来看，Eve 像一个快速增长的合同型 SaaS 平台，拥有可信类别领导力和清晰 ROI
              叙事，但财务论点更多依赖增长信号和客户轶事，而不是已披露收入质量。正确的下一步不是讲新故事，而是拿指标包。
