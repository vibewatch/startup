            body: >-
              Harvey、CoCounsel、带 Protégé 的 Lexis+ 和 Paxton 之所以重要，是因为它们可以吸收 Eve 工作流的一部分，而不必成为原告操作系统。Harvey
              现在销售能端到端执行法律工作的智能体，并拥有规模、融资和律所采用基础；当买方想要一个跨多个执业领域的高端 AI 伙伴时，它可能成为严肃采购替代。CoCounsel 和带 Protégé 的 Lexis+
              带来另一种分发力量：可信法律内容、法律研究工作流、尽调工具和有依据的引用基础设施。这些平台不是围绕原告获客接待、医疗时间线、和解运营或律所专属 PI 分析构建，但仍可以商品化研究、起草和审查。Paxton
              则更偏向光谱另一端的 copilot。其公开材料强调起草、文件分析、上下文研究、医疗时间线和计费摘要，因此对于想要 AI 辅助、但不替换现有系统记录的小律所，它可能成为一层工具。含义是，Eve
