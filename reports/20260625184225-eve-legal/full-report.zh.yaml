  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 平台
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 竞争含义
    rows:
      - - Eve
        - 已审查来源没有公开标价；销售主导或演示主导动线
        - 原告原生 AI 平台，覆盖进线、起草、证据开示和分析
        - 具体席位下限、实施费和按用量计费条款未披露
        - 定价不透明或有助于企业打包，但削弱与更简单套件快速对标的能力
      - - EvenUp
        - 已审查来源没有公开价目卡
        - 索赔情报、PLAAS、起草、沟通和全生命周期支持
        - 按案件、按席位或按页计价的精确经济模型未公开
        - 让 EvenUp 能按价值定价，但也让横向成本尽调更难
      - - Supio
        - 公开材料承诺固定价格、无平台费、无页数限制；未发布价目表
        - Intake、时间线、诉讼文书起草、案件经济性、律所智能
        - 未披露公开席位档位、最低承诺或服务成本
        - 信息表达比 Eve 或 EvenUp 更买方友好，但采购仍需直接接洽
      - - Litify / Filevine / CloudLex / CasePeer
        - 已审阅公开材料多为定制报价或演示引导
        - 案件管理、Intake、分析、文档，以及越来越多 AI 功能
        - 公开比价空间有限，净价可能取决于实施范围
        - 有利于既有厂商追加销售和打包，尤其是厂商已掌握核心工作流时
      - - Clio
        - 起价 $49/user，大型律所采用定制报价
        - Intake、CRM、工作流自动化、计费、文档、客户门户、Manage AI
        - 最终套餐随档位、附加模块和企业谈判而变
        - 小型律所若想要看得见的入门价格和广泛功能、又不需要原告专业化，Clio 更有吸引力
      - - MyCase
        - 按年计费为 $50 至 $130/user/month，按月计费随档位为 $60 至 $150
        - Intake、工作流自动化、计费、执业管理、法律 AI 功能
        - 附加模块和律所实际组合仍然重要，但定价远比原告原生 AI 同行清晰
        - 中小律所若尚未准备更换系统，试点账更容易算
      - - PracticePanther
        - 按年计费为 $49 至 $89/user/month，按月价格更高、最高 $99
        - Intake 表单、自定义工作流、日程、计费、会计、法律执业管理
        - 高级财务功能位于更高档位
        - 对预算敏感律所最透明，但原告原生差异化最弱
    notes: 本表比较公开包装信号，而非谈判后净价或特定工作负载 ROI。
