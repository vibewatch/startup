  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、执业领域契合与可见证据
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个比泛泛「法律 AI」更窄、更可信的客户故事。Eve 明确面向原告律所营销，而不是整个律所宇宙；其公开执业领域足迹已经覆盖人身伤害、劳动就业、工伤赔偿、Social Security
              disability 和医疗过失。具名客户集合也比单纯 auto-PI 切口更多样。Mike Morse 和 Jeffrey Glassman 锚定大型人身伤害客户引用；James Scott Farrin
              增加了一个规模化 Mid-Atlantic 原告平台，且具备工伤赔偿和 SSDI 深度；Hershey Law 和 Frontier Law Center 则说明 Eve
              可以进入原告侧劳动就业业务。地域上，可见引用以美国为中心但覆盖较广：Michigan、North and South Carolina、California 和 Massachusetts
              都出现在公开材料中。这足以说明产品可以跨原告细分市场和州级工作流迁移，但不足以证明全国客户组合均衡或国际触达强。最佳解读是，Eve 已从单一律所或单一执业领域 proof point 走向多 logo
              原告样本，但仍依赖精心挑选的公开故事，而不是完整披露的客户名册。
