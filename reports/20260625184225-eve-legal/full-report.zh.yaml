      - number: '8.3'
        title: 用谨慎情景框架推算隐含 ARR 倍数
        blocks:
          - type: paragraph
            body: >-
              关键纪律步骤是把 $1B 轮次翻译成 ARR 要求，而不是重复标题估值。公开基准让门槛变得可见。若按 SaaS Capital 的 6.7x 公开 SaaS 中位数交易，Eve 需要约 $149 million
              ARR。若要看起来像 Clio 2025 年融资，需要约 $80 million ARR。若要看起来像 Clio 2024 年轮次，需要约 $67 million ARR。若要看起来像 Intapp
              更严苛得多的公开市场比率，则需要超过 $330 million ARR。这些门槛不是精确目标，但显示了公开市场支撑与主要按私有可选性定价的一轮之间，数量级差距有多大。


              因为 Eve 不披露 ARR，公开材料唯一能翻译这轮价格的方法，是使用已披露客户数和谨慎合同价值区间。按轮次时披露的 450 家律所计算，假设每家混合 ARR 为 $20,000，只隐含约 $9 million
              ARR 和约 111x 倍数。假设 $40,000，则隐含约 $18 million ARR 和约 56x 倍数。即使采用非常慷慨的每家 $80,000 混合 ARR，仍只隐含约 $36 million ARR
              和约 27.8x 倍数。这些数字对热门 AI 平台并非不可能，但明显高于已披露法律科技和公开 SaaS 可比公司通常能支撑的水平。


              唯一能缓和这一结论的公开事实，是 Eve 当前首页披露的 1,200+ 家律所。如果其中大多数是付费客户，且混合约为每家 $50,000 ARR，当前 ARR 可能接近 $60 million，并回头把 2025
              年 9 月价格压缩到约 16.7x ARR。这仍然昂贵，但远没有轮次时 450
              客户数学那么极端。问题在于，这个去风险情景依赖公开记录没有提供的信息：付费还是试点状态、每家律所席位数、服务组合、续约行为，以及高端计划客户占比。因此，正确结论不是这一轮明显错误，而是它是一个押注执行的期权式价格，仍需要私下验证。
