  - id: TV002
    title: 正方 / 反方投资论点表
    columns:
      - 论点
      - 支撑
      - 反向权重
      - 什么会改变判断
    rows:
      - - 原告律所是真实的垂直软件市场
        - 135k+ PI 律师、每年约 400k 起索赔，以及上升的 AI 支出，支撑品类规模
        - 市场大不自动支撑异常高的进入倍数
        - 在有意义规模上证明可持续变现和留存
      - - Eve 看起来正在走向操作系统级宽度
        - 当前产品叙事覆盖 intake、诉前、诉讼、AI-ready 数据和律所智能
        - 如果毛利率弱，产品宽度可能掩盖服务重交付
        - 披露毛利率和产品化部署指标
      - - 快速客户增长可以支撑溢价
        - 公开记录显示，律所数量从 Series A 的 100+ 增至 Series B 的 450+，当前官网为 1,200+
        - 公开记录未定义付费与试点，也未说明按办公室还是按律所计数
        - 提供付费客户、席位和 ACV 定义
      - - 法律 AI 存在稀缺价值
        - Harvey 和 EvenUp 显示，投资人愿为品类领导者付高价
        - Harvey 是 AI 异常值，Clio 在 ARR 高得多时拿到的倍数更低
        - 证明 Eve 属于溢价集群，而不是中位数集群
      - - 平台上行仍可能很大
        - 原告原生工作流赢家可能支撑数十亿美元退出价值
        - 如果公开市场倍数保持克制，从 $1B 进入的基准退出数学偏弱
        - 证明通往 $250M+ ARR 和高端留存的路径
    notes: 本表把公司论点质量与当前价格公平性拆开；两者可以同时成立。
