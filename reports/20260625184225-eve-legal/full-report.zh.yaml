  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Eve 服务的市场比「法律 AI」更窄，但又比单一人身伤害点工具更宽。Eve 官方页面称产品为原告律所打造，并用于获客接待、医疗概览、索赔函起草、证据开示答复和更广运营。Eve
              还明确列出原告侧执业领域，包括人身伤害、工伤赔偿、医疗过失、劳动就业、群体侵权和 Social Security disability。这一点重要，因为原告律所的现状不只是 Westlaw
              式研究或通用聊天机器人。Smokeball、CloudLex、CasePeer 和 Paxton
              的竞品与工作流资料都把原告工作描述为从获客到和解的操作系统：客户筛选、医疗记录收集、时间线构建、起草、和解追踪、留置权处理和款项分配。换句话说，纳入的支出是按胜诉收费原告业务的案件生命周期工作流人力和软件；排除的支出是大多数仅面向被告的电子取证、通用
              BigLaw 知识工具，或从不触达原告运营的宽泛法律研究预算。核心替代集合是人力、传统案件管理软件、外包记录与留置权供应商，以及仍需大量原告专属提示和审查的通用 AI。
