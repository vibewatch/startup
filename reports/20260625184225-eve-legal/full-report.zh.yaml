  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 付费 ARR 证明低于当前去风险阈值
        - 当前付费 ARR 仍低于约 $60M
        - 1,200+ 家律所的标题数字不足以压低进入倍数
        - 不按上一轮估值支付；要求重置价格或退出
      - - 留存质量普通，而非高端
        - 总留存或净留存低于软件领导者常模
        - 稀缺溢价定价不再匹配平台论点
        - 重估至公开市场中位数或更低
      - - 客户数量高度偏向试点
        - 当前律所 logo 中，大量是试点、低 ACV 试用或非付费席位
        - Logo 增长会夸大已变现规模
        - 任何承销前，只从付费 cohort 重建 ARR
      - - 新融资带来沉重优先权包袱
        - 后续轮次加入激进优先权、参与权或反稀释条款
        - 标题估值会夸大普通股价值
        - 按 waterfall 重新计算回报，或避开交易
      - - 竞争性价格压力冲击原告 AI
        - 可比原告 AI 产品压缩有效 ACV，或迫使销售变得服务重
        - 退出 ARR 和退出倍数同时恶化
        - 立即切换到熊市情景假设
    notes: 这些触发项聚焦会直接压垮估值论点的事实，而不是一般创业公司噪音。
    claimRefs:
      - CV050
      - CV053
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 和留存
        - 2025 年 9 月至今按 cohort 划分的实际 ARR、NRR、GRR 和毛利率
        - 这是稀缺溢价轮次与可支撑估值倍数之间的核心桥梁
        - CFO 数据室加董事会报告
      - - 客户定义
        - 付费客户、席位数、按分部划分的 ACV，以及 450+ 与 1,200+ 家律所披露口径的对账
        - 情景数学取决于当前 logo 数量代表付费收入，还是更广泛的采用声明
        - CRO / 销售副总裁审查并导出 cohort
      - - Cap table 和 waterfall
        - 股份类别、清算优先权、参与权和反稀释条款
        - 不能只靠标题估值评估普通股回报
        - 公司法律顾问加 cap table 导出
      - - 单位经济
        - 服务组合、CAC、回收期，以及按 cohort 划分的贡献利润率
        - 如果实施高效、软件毛利率强，溢价定价可信度会高得多
        - 财务和 RevOps 尽调
      - - 二级交易和内部定价
        - Series B 以来的任何二级交易或内部标记
        - 如果内部悄悄打折，会显著改变对 $1B 标题估值的解读
        - 领投方和公司财务尽调
    notes: 这些要求是从估值框架走向真实承销所需的最低材料包。
    claimRefs:
      - CV049
      - CV050
      - CV052
