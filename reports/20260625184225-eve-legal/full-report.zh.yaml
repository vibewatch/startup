      - CV044
      - CV045
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 退出 ARR 为 $250-300M，退出倍数 12-14x；Eve 证明平台级留存，并把 1,200+ 律所足迹变现
        - 价值 $3.0-4.2B，或从 $1B 进入约 3.0-4.2x 总 MOIC
        - 执行、留存，以及溢价倍数可持续性
        - 低到中；需要溢价集群级执行
      - - 基准
        - 退出 ARR 为 $120-160M，退出倍数 7-9x；增长仍好，但公开市场纪律持续存在
        - 价值 $0.84-1.44B，或约 0.8-1.4x 总 MOIC
        - 倍数压缩、中等 ACV、有限经营杠杆
        - 没有超常证明时最可能
      - - 熊市
        - 退出 ARR 为 $60-90M，退出倍数 4-6x；变现落后于 logo 增长，或竞争压缩定价
        - 价值 $0.24-0.54B，或资本大幅减损
        - Logo 质量、留存弱、服务拖累，或定价硬重置
        - 如果证明质量仍薄，下行显著
    notes: 情景输出刻意保持粗粒度，用来展示回报敏感性，而不是给出精确估值点估计。
