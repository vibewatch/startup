      - number: '2.4'
        title: 采用约束、监管与信任要求
        blocks:
          - type: paragraph
            body: >-
              原告侧工作流不同于 BigLaw 或被告侧，不只因为案子不同，也因为商业模式和风险模型不同。Thomson Reuters
              指出，大型律所过去通常防御原告按胜诉收费案件，而规模通常较小的原告律所在案件成功时获取上行收益。在按胜诉收费经济学下，更快获客、更干净的案件筛选、更好的医疗综合、更快索赔函产出和更紧密的和解处理，都会直接进入现金转化。监管进一步强化了这种运营特殊性。ABA
              Formal Opinion 512 称，律师使用生成式 AI 仍负有胜任、保密、沟通、监督、诚实和合理收费义务。Rule 1.5 要求书面约定按胜诉收费机制，并在追回款项结束时出具书面汇款说明。Rule
              1.15 和 ABA 信托账户记录规则要求客户资金隔离并维护款项分配记录。NYSBA 2026 年护栏文章称幻觉仍在导致制裁，Thomson Reuters 的伦理指南强调律师仍必须验证引用，并把 AI
              当作助手而非自治律师。因此，信任控制、来源可追溯、人类审查和达到和解级别的运营纪律，是原告律所的核心购买条件。
