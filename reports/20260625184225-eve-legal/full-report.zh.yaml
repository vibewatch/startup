      - number: '8.5'
        title: 建议、价格纪律与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              有证据支撑的建议是价格敏感的谨慎，而不是广泛乐观。对现有内部投资人来说，如果 Eve 已经显著超越公开 2025 年披露的规模，并能展示更接近优质平台而非重服务 AI 供应商的留存、利润率和扩张经济性，那么
              2025 年 9 月标记仍可能跑通。但对新资金来说，公开记录还不足以仅凭已披露基本面就承保上一轮价格公平。至少，管理层需要证明当前付费 ARR 明显高于 $60-80 million
              区间、续约行为强劲，并且优先权悬置有限，才可能让估值讨论更接近 Clio 式而非 Harvey 式数学。


              因此，本章立场是「拉伸，但有条件可挽救」，而不是「显然破裂」。市场足够大、客户动能足够真实、工作流宽度足够广，仍能保留上行。但承保不能忽视 ARR 披露缺失、资本表条款缺失，以及当前 logo
              数可能夸大当前货币化规模的可能性。最简单的实用纪律是要求证据或价格。没有私下验证时，更审慎的新资金区间约为 $700-800 million；在这个价格，哪怕不假设离群倍数，双位数回报仍有可能。


              下一步尽调很直接。要求管理层提供从 2025 年 1 月至今的实际 ARR 桥、续约和总留存数据、分部 ACV、每家律所席位数，以及完整优先权瀑布。如果这些数据表明 Eve 已经进入类似 Clio
              的扩张通道，估值立场可以迅速改善。否则，本章默认观点应维持为：在 2025 年 9 月标记下跟踪 / 继续研究，只在更低入场价格参与。
