  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流深度已从获客延伸到诉讼执行
        blocks:
          - type: paragraph
            body: >-
              Eve 的公开产品表面已不只是起草助手。2026 年 6 月官网、2026 年 1 月 Eve 2.0 发布材料和 2026 年 6 月 EveOS
              发布报道，都描述了一套工作流栈：从多语言获客接待开始，进入诉前时间线和索赔函起草，再延伸到证据开示、证词审查、交叉询问支持和事项级审计。这种广度重要，因为原告律所不会孤立购买点工具；运营痛点在于获客接待、记录审查、起草、客户沟通和诉讼准备之间的交接。基于这里审阅的证据，Eve
              试图占据这些交接点，而不只是一次帮忙处理一份文件。


              模块级证据最强的地方是获客接待、医疗概览和起草。Eve 称其获客层 24/7 接听电话和邮件，在通话中签下合格客户，并支持 28 种语言；intake GA 文章还加入 40-plus 家 beta
              律所、线索评分、结构化摘要和 CMS 集成。医疗概览页面对法律 AI 营销来说异常具体：它列明时间线、坏事实、ICD codes、损害赔偿台账、回链到记录页、手写记录 OCR 和 15–20
              分钟生成时间。客户案例研究再把这些模块连接到真实工作流：Laurel 的 demand agent 从证词自动触发，并把人工接触时间缩短到几分钟；Hershey Law 则描述了从获客到审判支持使用
              Eve。这足以得出工作流深度真实存在的结论，尽管多数定量结果仍来自公司控制或赞助来源。
