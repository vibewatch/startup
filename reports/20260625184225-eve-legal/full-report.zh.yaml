  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 核心平台订阅
        - 覆盖 Intake、起草、discovery 和分析的原告法律操作系统，通过直接合同销售
        - 按律所 / 按用户 / 按合同
        - 已上线；定价未公开披露
        - 若嵌入日常工作流，可能具备经常性和粘性，但标价和计费节奏未公开
        - 要求按 cohort 提供 ACV、计费频率、席位数和 logo 留存
      - - AI Intake 模块
        - 对线索做资格判断，并自动化前台 Intake 的工作流模块
        - 按律所 / 模块附加
        - 40+ 家律所 beta 后，2026 年 GA
        - 若收入与线索捕获绑定，可能提高扩展 ARR，但附加率和定价未披露
        - 要求提供模块附加率、转化提升，以及任何按用量计费部分
      - - Agents / EveOS 扩展
        - 客户在同一平台内添加起草、审计、分析和其他 AI workers
        - 按律所 / 工作流 / 用户
        - 已上线；公开叙事强调扩展，未公开价格
        - 若模块叠加进现有账户，可能成为强 NRR 杠杆
        - 要求按模块提供收入结构，以及来自现有账户的扩展 ARR
      - - 入职 / 实施层
        - 客户故事和招聘暗示其需要高接触部署、法律审阅、客户成功和工作流设计
        - 项目 / 打包服务 / 已包含
        - 有迹象但未公开定价
        - 可帮助采用，但相比纯软件会压低近期毛利率
        - 要求按客户分层提供服务收入、实施成本和上线时间
      - - 续约与交叉销售
        - 现有律所从单一工作流扩展到更广的律所运营
        - 账户扩展
        - 案例研究和演进中的产品线提供支撑，但未披露续约指标
        - 若工作流粘性强，收入质量可能高；没有留存数据时公开层面仍未证实
        - 要求提供 NRR、总留存、流失率和多产品采用率
    notes: 各行区分已上线产品界面、隐含服务和扩展机制；公开来源未披露实际价格卡或收入结构。
