      - number: '6.4'
        title: 扩张空间、持久性边界与商业约束
        blocks:
          - type: paragraph
            body: >-
              Eve 的扩张机会真实存在，因为它的切入点不是单一文档任务。官方材料和客户案例显示，Eve 可以从线索受理延伸到诉前、诉讼支持和律所情报；参考客户也横跨高量级 PI 律所和原告侧雇佣法律所。与现有 CMS
              共存也扩大了可触达买方，因为它降低了推倒重来的压力；Eve 现在把自己描述为案件管理系统的补充，公开引用也提到 CRM 同步和即将接入 Jove。但耐久性证据仍明显薄于采用证据。公开来源没有披露
              NRR、GRR、流失率、合同期限或头部客户集中度，可见评论样本也太小，不能替代续约证据。定价不透明也是拖累：买方仍需演示和报价，外部评测也指出，集成、迁移、上线和培训成本都是真实预算变量。最后，法律 AI
              治理仍是门槛。纽约州律协指引和制裁评论都强调，任何规模化部署仍需要保密控制、监督、核验和费用敏感度。也就是说，Eve
              最好的扩张飞轮，是在成熟原告律所里以咨询式打法先落地再扩张——但这套打法也比轻量席位销售更慢、更贵，也更受治理约束。
