      - number: '7.3'
        title: 隐私、HIPAA、特权与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Eve 的公开材料反复强调，它为敏感的原告法律数据而建。首页称客户数据私密、隔离并受特权保护；安全页面称公司遵循 SOC 2 标准，进行年度渗透测试，使用最小权限访问控制，开展季度访问审查，并在 AWS 和
              Azure 上托管服务，AWS 数据库位于美国；医疗概览页面称 Eve 符合 HIPAA，医疗记录在传输和静态存储中均加密，受保护健康信息不会用于训练 AI
              模型。这些都是有意义的信号，企业条款也通过要求安全保障、持有 E&O 和网络保险、界定客户数据所有权，增加了更正式的结构。但同一批文件也暴露出隐私和平台风险为何仍然重要。Eve
              获得一项许可，可在提供服务所需范围内托管、复制、传输和展示客户数据；它可因安全风险或法院命令暂停服务；它不保证服务不中断或无错误；并明确称分包处理方可能停止托管，且 Eve 不对这些中止承担责任。


              HIPAA 风险需要谨慎表述。HHS 指引和 45 CFR 164.410 明确列出 covered entities 和 business associates 的违规通知义务，包括 business
              associate 需在无不合理延误且 60 天内通知 covered entity。HHS 还把 business associates 定义为代表 covered entity 或另一 business
              associate 创建、接收、维护或传输 PHI 的供应商。公开来源无法证明 Eve 是否在每个客户工作流中都作为 HIPAA business associate
              行事，因为原告律所往往通过授权获取医疗记录，并非每个事项都会形成直接的 covered-entity/vendor 链条。因此，精确的 HIPAA 角色无法从公开来源完全证明。不过，Eve
              显然在规模化处理敏感医疗记录，这意味着即便适用理论是合同保密、州隐私法或法律过失，而非仅由 HIPAA 执法驱动，数据泄露、模型误路由或访问控制失败也会造成严重暴露。


              特权风险同样有细微差别。该领域最强的 2026 年公开案例是 Warner v. Gilbarco，密歇根联邦法院认定 AI 辅助诉讼材料保留工作成果保护，使用 ChatGPT
              不会自动放弃保护。这有利于多头论点。但它不是一揽子特权背书，也不会把产品营销变成法律教义。法院处理的是具体诉讼事实，其他 2026 年评论和案卷活动也显示，公开或第三方 AI 使用如何影响特权仍存在真实分歧。对
              Eve 客户来说，实际教训是：特权是一种工作流属性，不是软件功能；它取决于数据选择纪律、合同控制、平台保密性和律师监督。再加上 SLA 把云服务商和集成应用故障排除在停机计算之外，运营结论很尖锐：如果
              AWS、Azure 或关键 CMS 集成在截止期限附近失效，原告律所仍会暴露在风险中，即便 Eve 自身技术上没有做错任何事。
