      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 核心法律风险是代理式范围，而不是泛泛使用 AI
            body: Eve 最安全的位置，是停留在可审查的起草和分流层。客户一旦让代理制定策略、传达法律建议，或在缺乏有意义人工审查的情况下推进提交，风险会急剧上升。
            calloutType: risk
            claimRefs:
              - CR013
              - CR015
              - CR016
          - type: callout
            title: 特权不是买一次就拥有的产品功能
            body: 公开材料称 Eve 受特权保护，但 2026 年判例显示，特权和工作成果结果仍取决于平台保密性、律师参与、选定输入和法院地特定教义。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR033
          - type: callout
            title: 既有公司不需要具备 Eve 的工作流宽度，也能伤害 Eve 的经济性
            body: 如果 LexisNexis 或 Thomson Reuters 能把可信内容、可接受的 AI 治理和「足够好」的工作流工具打包进现有订阅，Eve 的原告法律专业化就必须持续证明可衡量 ROI，才能守住价格和留存。
