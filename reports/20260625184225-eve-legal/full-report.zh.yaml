      - number: '2.2'
        title: 规模测算视角、分层结构与有边界的 TAM 逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个有边界的多视角市场判断，而不是单张膨胀 TAM 幻灯片。最宽口径上，ABA 称美国 2025 年有 1.37 million 名律师。Clio 2026 年人身伤害市场综合资料则把这个宽分母缩窄到
              135,000-plus 名人身伤害律师，约占执业律师 10%，并有近 400,000 起年度 PI 索赔主要在州法院提交。同一来源引用 2025 年美国人身伤害律师及律所 $61.7 billion
              行业收入，经济池很大，尽管这不是软件支出。常规 PI 之外的复杂度也有意义。Lex Machina 称，房屋责任和机动车侵权案件在其 2025 年联邦侵权报告中达到创纪录水平。PFAS AFFF
              多区诉讼页面称，单一 MDL 就有 10,000-plus 起关联案件和数万名原告；Duane Morris 则审阅了上一年超过 1,441
              份集体诉讼裁决。合在一起，这些视角说明原告律师群体规模可观、碎片化且运营密集，足以支撑垂直工作流软件。公开数据无法清楚揭示的是，各细分市场原告律所的准确数量，或该法律收入池中已经划给 AI
              和工作流软件的美元份额。
