    title: 监管 / 法律风险登记表
    columns:
      - 风险 / 规则 / 触发点
      - 司法辖区
      - 状态
      - 可能性
      - 严重性
      - 当前缓释
      - 剩余暴露
      - 尽调路径
    rows:
      - - 智能体式起草和办案滑入受监管的法律执业
        - 多州 / 由州律师协会监管
        - 未发现 Eve 专项行动；2026 年加州指引收紧了对智能体式 AI 的监督预期
        - 中
        - 关键
        - 律师审阅和批准关口；产品定位为增强律师，而不是替代律师
        - 少数州律师协会投诉、保险公司限制或采购冻结，就可能在正式执法前压冷采用
        - 审查客户委托函、人工审阅日志，以及关于 UPL 的任何州别外部律师备忘录
      - - Rules 1.1 和 5.5 下的律师胜任能力与监督失效
        - 美国全部司法辖区
        - 只要在客户工作中使用 AI，义务就持续存在
        - 高
        - 高
        - 引文、来源链接、内部政策和客户培训材料
        - 如果律所把 Eve 输出当成终稿，而不是待审草稿，制裁和渎职风险会很快进入客户关系
        - 检查培训完成度、审批工作流，以及高风险输出的审计轨迹
      - - Rule 1.6 下的客户保密失效
        - 美国全部司法辖区
        - 敏感案件数据进入系统时，风险始终在线
        - 中
        - 高
        - 对齐 SOC 2 的控制、最小权限、加密、客户数据所有权条款
        - 特权 / 保密问题取决于具体工作流，仍可能因客户误用或集成范围蔓延而失效
        - 索取架构图、DPA/BAA 文件包和案件级权限控制
      - - 法院审查 AI 生成提交文件和缺乏坦诚
        - 联邦和州法院
        - 活跃；2023-2026 年制裁记录持续扩大
        - 中
        - 关键
        - 打开并核验引文、带来源链接的输出、发布前律师签署确认
        - 只要一起公开制裁点名 Eve 支持的工作，就会在原告律师行业外溢声誉影响
        - 索取内部事件登记、质量升级政策，以及任何与 AI 输出有关的客户诉讼保全
      - - 医疗记录工作流中的 HIPAA / 商业伙伴身份误分类
        - 联邦 / HHS OCR
        - 从已审材料无法完全确定公开范围
        - 低中
        - 高
        - Eve 公开声称符合 HIPAA，且不使用 PHI 训练
        - 如果客户数据流实际上构成商业伙伴身份，泄露义务和合同暴露会显著变尖
        - 核验 Eve 何时签署 BAA、哪些数据流触发 BAA，以及分包商是否承继义务
      - - 州律师协会或保险公司限制智能体式法律 AI 的负面指引
        - 州律师协会 / 渎职险承保方
        - 未识别到 Eve 专项公告
        - 中
        - 高
        - 人在回路定位和客户披露指引
        - 如果渎职险承保方或大型律所收窄获批用例，采用可能明显放缓
        - 收集客户承保方政策、采购异议，以及头部账户获得的任何外部伦理意见
    notes: 各行按剩余严重性排序，依据截至 2026-06-11 的公开法律指引和已披露产品范围。公开来源未显示任何 Eve 专项律师协会行动或保险公司限制。
