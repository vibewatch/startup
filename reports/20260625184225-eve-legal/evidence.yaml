evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: >-
      An official corporate or legal page that states the exact incorporated entity name, domicile, and relationship
      between the Eve brand and Butler Labs.
    whyItMatters: >-
      Entity naming affects diligence on contracts, privacy obligations, litigation exposure, and refresh-to-refresh
      identity consistency.
    diligencePath: >-
      Request certificate of incorporation, current good-standing records, and signed customer paper under the
      contracting entity.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, ownership percentages, investor rights, and founder voting control after the Series B.
    whyItMatters: Control and governance can materially affect strategic flexibility, future financing, and key-person risk.
    diligencePath: Request board deck excerpt, cap table, voting agreements, and investor rights summary.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee-count disclosure or authoritative hiring/roster source tied to the run date.
    whyItMatters: Headcount is a basic scale indicator for product delivery, customer success capacity, and burn assumptions.
    diligencePath: Request current org chart and payroll count or corroborate with an authoritative HRIS export.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A dated run-rate customer count with a consistent definition of “firm,” “customer,” and “active matter.”
    whyItMatters: >-
      Public traction is a major part of Eve’s valuation narrative, but the precise current firm count varies across
      2026 sources.
    diligencePath: >-
      Request a dated customer dashboard or board metric pack with definitions for firm count, active matters, and net
      adds.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: plaintiff-firm-count
    missingEvidence: A current public census of U.S. plaintiff firms segmented across personal injury, mass tort, and class action.
    whyItMatters: >-
      Without a clean firm-count denominator, SAM and SOM can only be bounded with lawyer, claims, and litigation-volume
      proxies.
    diligencePath: >-
      Compile state-bar directories, legal-market databases, and plaintiff-association rosters into a deduped firm
      census.
    relatedQuestionRefs:
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Actual plaintiff-firm software budget line items, approval chains, and willingness-to-pay by firm size.
    whyItMatters: >-
      The buyer/user/payer model is clear directionally, but exact ACV and budget-owner assumptions affect go-to-market
      and TAM quality.
    diligencePath: >-
      Request win/loss notes, customer contracts, and deployment-owner interviews segmented by small, regional, and
      mass-tort firms.
    relatedQuestionRefs:
      - QM012
      - QM025
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: segment-volume
    missingEvidence: >-
      Consistent public counts splitting plaintiff case volume across state-court PI, federal torts, MDLs, and class
      actions in one normalized dataset.
    whyItMatters: >-
      Different public datasets illuminate different parts of the plaintiff bar, making apples-to-apples segment sizing
      difficult.
    diligencePath: >-
      Normalize NCSC, U.S. Courts, FJC, and MDL docket data into a single segmentation model with explicit overlap
      rules.
    relatedQuestionRefs:
      - QM008
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: deployment-roi
    missingEvidence: >-
      Independent cohort data showing plaintiff-firm ROI by workflow after onboarding, including review burden and error
