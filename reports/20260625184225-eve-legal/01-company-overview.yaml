  title: Public traction is clear, but trust and disclosure gaps still matter
  body: Eve’s funding and adoption curve are well supported, yet public diligence still has blind spots. The exact current customer count moves quickly across sources, governance and headcount are not disclosed, and a March 2026 court filing plus LLRX commentary show that hallucination safeguards and verification claims remain a live reputational risk category for the company and for legal AI more broadly.
