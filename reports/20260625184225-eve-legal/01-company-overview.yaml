- id: capital-base-and-stage
  title: Funding history, investor syndicate, and current stage
  body: 'Eve’s capital formation is well supported by official and third-party evidence. The company announced a $47 million Series A in January 2025 led by Andreessen Horowitz with Lightspeed and Menlo Ventures, then followed it eight months later with a $103 million Series B at a valuation above $1 billion led by Spark Capital, again with Andreessen Horowitz, Lightspeed, and Menlo participating. Those two rounds alone imply at least $150 million of disclosed capital since January 2025, and they place the company firmly in late-stage private-company territory rather than early experimental legal-tech. Investor commentary also helps explain what the capital is meant to do: Spark, Lightspeed, and Eve management all frame the company as building a new category of “AI-native law,” funding deeper product development, transformation services, onboarding, and broader case-lifecycle coverage. What the public file still does not answer is how governance changed after Series B, whether secondaries
    were involved, or how ownership is distributed among the syndicate and founders.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO042
  tableRefs:
  - TO003
- id: traction-milestones-and-risk-signals
  title: Customer proof, milestone pace, and adverse signals
  body: 'Traction is the clearest reason Eve matters beyond fundraising headlines. The reviewed materials show a sequence of scale claims that grew sharply over 2025 and 2026: more than 450 firms around the Series B, more than 500 firms by January 2026, more than 800 by March, 1,200-plus on the current homepage, and 1,400-plus in June 2026 LawNext coverage. Those figures are directionally impressive but not perfectly aligned, which makes exact current count a diligence item rather than a settled fact. Still, customer proof is unusually concrete. Public sources name Mike Morse Law Firm, James Scott Farrin, Barrett & Farahany, Disparti Law Group, Frontier Law Center, Laurel Employment Law, and Hershey Law, while case studies attribute 20-plus hours per week of attorney time saved, doubled or tripled capacity, four-month average cycle times for some workflows, and a $27.5 million verdict to firms using Eve. Product milestones also continued after financing, with the January 2026 AI Workforce
    release and the June 2026 EveOS expansion. The adverse side is equally important: LLRX and a March 2026 court filing tied Eve’s marketing and training claims on hallucination safeguards to an attorney’s inaccurate quotation incident, even though the lawyer said he could not determine whether the error came from Eve itself or from his own copy-and-paste workflow. That does not invalidate the business, but it does show that trust, verification, and legal-process controls are material diligence risks.'
