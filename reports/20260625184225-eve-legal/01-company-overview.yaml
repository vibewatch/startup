company:
  name: Eve
chapter:
  number: 1
  title: Company Overview
  summary: 'Eve is a San Francisco-focused plaintiff-law legal AI company whose public materials tie its origins to 2020, its founding team to Jay Madheswaran, Matt Noe, and David Zeng, and its current operating narrative to full-lifecycle AI workflows for plaintiff firms. Public funding evidence is unusually strong for a private legal-tech company: a $47 million Series A in January 2025 and a $103 million Series B in September 2025 at a $1 billion-plus valuation, with Spark, Andreessen Horowitz, Lightspeed, and Menlo all publicly named. The business also shows real customer traction and marquee law-firm proof, but exact legal-entity naming, board structure, headcount, and the precise current customer count remain only partially disclosed, and 2026 hallucination-related scrutiny is a real diligence risk.'
sections:
- id: identity-and-platform
  title: Identity, product scope, and public operating footprint
  body: 'Eve presents itself as a legal AI platform built specifically for plaintiff law firms, not as a generic legal research assistant. Across the homepage, launch materials, and independent coverage, the company describes software that spans intake, evaluation, pre-litigation, litigation support, and increasingly firm-wide operations. By June 2026, the public product language had shifted from a case-work assistant to “EveOS,” an AI operating system for plaintiff law that promises 24/7 intake, AI-generated drafting, analytics, and a live data layer for the firm. Headquarters disclosure is thinner than product disclosure. Independent funding coverage consistently calls the company San Francisco-based, but the official website does not publish a street address. Identity at the legal-entity level is also less clean than the brand narrative: the public-facing brand is Eve, while the privacy materials repeatedly reference Butler Labs and SiliconANGLE calls the company Butler Labs Inc. That
    makes Eve’s commercial identity clear but its exact legal naming convention less transparent than the rest of its marketing surface.'
