  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: An official corporate or legal page that states the exact incorporated entity name, domicile, and relationship between the Eve brand and Butler Labs.
    whyItMatters: Entity naming affects diligence on contracts, privacy obligations, litigation exposure, and refresh-to-refresh identity consistency.
    diligencePath: Request certificate of incorporation, current good-standing records, and signed customer paper under the contracting entity.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, ownership percentages, investor rights, and founder voting control after the Series B.
    whyItMatters: Control and governance can materially affect strategic flexibility, future financing, and key-person risk.
    diligencePath: Request board deck excerpt, cap table, voting agreements, and investor rights summary.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A current employee-count disclosure or authoritative hiring/roster source tied to the run date.
    whyItMatters: Headcount is a basic scale indicator for product delivery, customer success capacity, and burn assumptions.
    diligencePath: Request current org chart and payroll count or corroborate with an authoritative HRIS export.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: A dated run-rate customer count with a consistent definition of “firm,” “customer,” and “active matter.”
    whyItMatters: Public traction is a major part of Eve’s valuation narrative, but the precise current firm count varies across 2026 sources.
    diligencePath: Request a dated customer dashboard or board metric pack with definitions for firm count, active matters, and net adds.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
    - TO004
