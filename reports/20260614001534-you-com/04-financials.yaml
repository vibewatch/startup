- id: pricing-traction-and-revenue-quality
  title: List pricing and public traction are real signals, but they are not realized economics
  body: 'The list-price stack is now observable enough to say something useful about revenue quality. Base web search is priced at $5 per 1,000 calls, contents extraction at $1 per 1,000 pages, and higher-value research products step up sharply in price, with public page text showing a $12 research tier and a $110 finance-research SKU. That spread is directionally good because it implies the company is trying to monetize reasoning depth and workflow value, not only cheap retrieval. The caveat is equally important: the same pricing page advertises volume discounts and annual savings, so list price is a ceiling, not a realized net-rate disclosure. Public traction metrics are also mostly company-authored. The Series C post claims more than 1 billion monthly API queries and 100,000-plus agents built in the prior year, while the Series B post claimed 500% ARR growth since January 2024. Those are meaningful demand signals, but they do not show absolute ARR, cohort quality, or renewal behavior.
    Customer stories from NIH, Maryville, and Mimecast show strong workflow value, yet they do not disclose contract size, deployment scope, or expansion behavior. Financially, the evidence supports product-market relevance and monetization breadth, but not yet durable recurring-revenue quality.'
  claimRefs:
