- id: go-to-market-and-unit-economics-proxies
  title: GTM and unit-economics proxies point to a two-speed motion
  body: 'The public go-to-market evidence suggests a two-speed commercial model. On one side, You.com has built a relatively low-friction developer funnel: $100 of free credits, a no-signup free MCP search profile, SDKs, a playground, and integrations into the OpenAI, Claude, Zapier, Vercel, and Databricks ecosystems. Those features should lower self-serve acquisition cost and shorten time to first value for API buyers. On the other side, the enterprise materials and founder posts clearly imply a higher-touch motion for private-data integrations, custom agents, and premium research workflows. That likely means longer cycles, solution engineering, and more expensive customer success, especially when the company is promising zero data retention, vertical indexes, finance-specific evidence arbitration, and organization-specific deployments. Competitive pricing reinforces the need for this mix shift: base web-search pricing already clusters tightly among You.com, Brave, and Exa, while adjacent
    search tooling from OpenAI sits above that band but is packaged differently. In practice, You.com probably needs premium research, finance, and enterprise workflow products to subsidize what is becoming a fairly compressed base-search layer. What public evidence does not reveal is whether those premium products convert efficiently enough to offset support, inference, and licensed-data cost.'
