  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-recognition
    missingEvidence: A product-line revenue bridge covering search, contents, research, finance, Team, and bespoke enterprise work plus the accounting policy for each stream.
    whyItMatters: Without mix and recognition detail, investors cannot judge software quality, services drag, seasonality, or the sustainability of ARR-based valuation language.
    diligencePath: Request monthly revenue by SKU, deferred revenue, billed versus recognized revenue, and the company's revenue-recognition memo.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-cost-to-serve
    missingEvidence: Gross margin by product plus infrastructure, licensing, and support cost per query or per active customer for research-heavy SKUs.
    whyItMatters: Premium list prices only create equity value if contribution margin survives multi-step retrieval, licensed financial data, and enterprise support costs.
    diligencePath: Request product P&Ls, cloud-inference cost curves, vendor-data contracts, and contribution margin by tier.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, and base/downside runway after the 2025 financing.
    whyItMatters: Capital access is visible, but solvency and next-round timing cannot be underwritten without direct cash-flow data.
    diligencePath: Request the latest cash flow statement, 24-month operating plan, monthly actual-versus-budget burn, and board runway scenarios.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, customer-count distribution, top-account concentration, and partner revenue share.
    whyItMatters: Usage claims can mask heavy concentration or low expansion; recurring-revenue quality depends on retention and diversification, not traffic alone.
    diligencePath: Request cohort analyses, top-10 customer revenue share, partner economics, and expansion history by product line.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
