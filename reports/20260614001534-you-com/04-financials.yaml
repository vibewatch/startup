- id: capital-adequacy-and-financial-verdict
  title: Capital access is visible; cash sufficiency is not
  body: 'Capital formation looks meaningfully better than operating disclosure. The disclosed funding chronology visible from prior rounds is coherent: $20 million in 2021, $25 million in 2022, $50 million in 2024, and $100 million in the 2025 Series C, for roughly $195 million of visible company-level capital. Independent news and official materials line up on the $100 million Series C at a $1.5 billion valuation, while June 2025 coverage shows that the company was still seeking fresh financing before the later close. The most interesting incremental evidence is in SEC filings: two August 2025 Form D vehicles named GSBackers You.com Fund I and II reported fully sold offering amounts totaling about $15.1 million. Those look like pooled investment vehicles tied to the financing, but they are not direct proof of balance-sheet cash at the operating company. That distinction matters because public materials still do not disclose cash on hand, monthly burn, runway, debt, or net retention. The
    financial verdict is therefore nuanced. You.com does not look capital-starved for a software infrastructure company, but licensed financial data, multi-step research compute, enterprise integrations, and customer-success-heavy deployments could still consume cash quickly. Until management opens the data room on margin and runway, capital adequacy can only be judged as plausible, not proven.'
