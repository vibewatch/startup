- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Exact diligence path
  rows:
  - - Revenue by SKU and recognition policy
    - Needed to judge mix quality, seasonality, and whether services are masking software growth
    - Public pages show products but not revenue mix or accounting treatment
    - Request monthly revenue by product family, recognition memo, deferred revenue, and services versus software split
  - - Gross margin by SKU and cost-to-serve
    - Needed to know whether premium products produce attractive contribution margin after compute and licensing
    - No public margin disclosure
    - Request product-level gross margin, cloud spend, vendor licensing, and support burden by SKU
  - - Cash, burn, and runway
    - Determines whether the 2025 financing is sufficient or only a waypoint
    - No public cash or burn disclosure
    - Request monthly cash flow, current cash, hiring plan, and base/downside runway scenarios
  - - Retention, churn, and expansion
    - Separates one-off usage bursts from durable recurring revenue
    - No public NRR, GRR, or cohort metrics
    - Request cohort retention by product, expansion rates, and churn reasons for the last 8 quarters
  - - Customer concentration and partner economics
    - Large partners may drive traffic but not necessarily healthy margins
    - Named logos are public, spend share is not
    - Request top-customer and top-partner revenue share, contract terms, and rev-share or discount schedules
  - - Realized pricing and discount policy
    - List pricing cannot support a margin or valuation case on its own
    - Official pages mention discounts and annual savings but not actual net rates
    - Request recent order forms, price exceptions, renewal rates, and discount waterfall by segment
  notes: Each gap names a specific diligence packet because the public record is not detailed enough for standard software underwriting.
