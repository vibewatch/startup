company:
  name: You.com
chapter:
  number: 4
  title: Financials
  summary: 'You.com''s public financial picture is strongest on monetization breadth and weakest on realized economics. Official sources now show a layered revenue stack—usage-based search and contents APIs, premium research and finance APIs, Team-style collaboration, and bespoke enterprise agent deployments—while independent and filing evidence corroborates substantial capital access through the $100 million Series C, visible lifetime rounds of roughly $195 million, and at least $15.1 million of You.com-named SPV filings. What remains missing are the underwriting essentials: revenue mix, gross margin, burn, runway, retention, and concentration, so the financial verdict is positive on top-line optionality but still cautious on margin path and capital sufficiency.'
sections:
- id: revenue-model-and-monetization
  title: Revenue model is visibly mixed, not a single-SKU API story
  body: 'The current public footprint supports a mixed monetization model rather than a pure search-API utility. The clearest visible stream is self-serve developer usage: You.com''s pricing page lists per-call web search pricing, per-page contents pricing, a lower-cost research tier, and a much higher-priced finance research tier. But the company is not selling only one metered endpoint. The Series B and Series C materials, enterprise-solutions page, and 2025-2026 product updates show at least four overlapping monetization paths: base retrieval APIs, premium research APIs, Team or collaboration-style offerings, and enterprise custom-agent deployments tied to private-data integration. That matters because it improves revenue optionality, but it also complicates revenue-recognition analysis. Usage billing, seat-oriented collaboration plans, and bespoke enterprise work likely recognize revenue on different schedules and carry different gross margins. Public sources let us see the menu, not
    the mix. The safest financial framing is therefore that You.com has broadened its sellable surface area materially, but investors still cannot tell what percentage of revenue comes from commodity search versus higher-value workflow products or services.'
