  rows:
  - - Web Search API
    - Usage-based self-serve API sold to developers and agents
    - $5 per 1,000 calls
    - High-volume but likely price-compressed base layer
    - Directly observable on official pricing page
    - Request net realized price, customer mix, and gross margin by query band
  - - Contents API
    - Usage-based extraction or livecrawl add-on for page content
    - $1 per 1,000 pages
    - Useful attach product but likely lower-ticket than search or research
    - Directly observable on official pricing page
    - Request attach rate from search into contents and associated infrastructure cost
  - - Research API
    - Premium cited-answer workflow for multi-step open-web research
    - $12 per 1,000 queries in public page text
    - Better monetization than base search if adoption is real
    - Public list pricing visible; realized volumes unknown
    - Request volume mix by research tier and customer cohort
  - - Finance Research API
    - Finance-specific agentic research using licensed and public data
    - $110 per 1,000 queries
    - Highest visible list price, but likely highest cost to serve
    - Public launch and pricing disclosed
    - Request gross margin after licensed-data fees, compute, and support
  - - Team / collaboration product
    - Seat-style or workspace-oriented workflow product introduced in 2024
    - Publicly signaled, but current official seat pricing is not cleanly surfaced on the API pricing page
    - Could improve revenue durability if meaningful, but current visibility is weak
    - Evidence is indirect via company and media sources
    - Request current seat pricing, active seats, and retention by plan
  - - Enterprise custom agents and private-data deployments
    - Custom builds, private RAG, integrations, and tailored workflow delivery
    - Custom / contract-based
    - Supports larger ACVs but introduces services and deployment complexity
    - Strong official messaging; no public contract economics
    - Request services mix, implementation effort, and time-to-production by account
  notes: Separates directly observed API list pricing from higher-touch or indirectly observed monetization paths; realized net price and revenue mix remain undisclosed.
