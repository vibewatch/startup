  rows:
  - - Visible disclosed company rounds
    - ~195
    - USD millions across 20 / 25 / 50 / 100 disclosed rounds
    - Large enough to support a serious infrastructure build, but not a cash-balance disclosure
    - High
    - Provide current cap table, cash balance, and cumulative primary versus secondary proceeds
  - - Latest valuation
    - '1.5'
    - USD billions in the September 2025 Series C
    - Supports premium market positioning but not operating quality by itself
    - High
    - Provide board materials showing valuation rationale, growth assumptions, and investor rights
  - - Mid-2025 capital need signal
    - Sought funding at 1.4B valuation before the later close
    - Independent June 2025 report said funds would bolster AI assistant offerings
    - Suggests continued capital dependency before the Series C closed
    - Medium
    - Provide financing process timeline, investor pipeline, and use-of-proceeds plan
  - - You.com-named 2025 Form D vehicles
    - '15.085'
    - USD millions across Fund I and Fund II pooled venture-capital filings
    - Shows financing ecosystem depth but is not direct proof of operating-company cash
    - High
    - Clarify whether these vehicles fed the Series C, and whether any economics differed from the lead round
  - - Cash on hand
    - Not disclosed
    - No public cash balance surfaced in reviewed materials
    - Runway cannot be underwritten
    - Low
    - Provide latest month-end cash, restricted cash, and short-term investments
  - - Monthly burn / runway
    - Not disclosed
    - No public operating-loss or cash-burn disclosure surfaced
    - Capital adequacy remains plausible rather than proven
    - Low
    - Provide 24-month cash flow, base/downside runway, and headcount plan
  - - Next-round trigger
    - Not public
    - No explicit trigger disclosed; premium-workflow conversion and margin proof appear most likely gating items
    - Future financing need may hinge on whether premium SKUs monetize faster than infrastructure cost grows
    - Medium
    - Provide financing plan, covenant triggers, and board thresholds for new capital
  - - Debt or project-finance obligations
    - None visible publicly
    - No debt facility or project-finance obligation surfaced in reviewed sources
    - Helpful if true, but absence of public evidence is not proof of zero leverage
    - Low
    - Provide debt schedule, credit lines, letters of credit, and off-balance-sheet commitments
  notes: Keeps visible equity evidence separate from unproven cash-position assumptions; the SPV filings are informative but not interchangeable with operating-company cash.
