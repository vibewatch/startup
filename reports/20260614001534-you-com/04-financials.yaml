- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Proxy or caveat
  - Diligence ask
  rows:
  - - ARR growth
    - 500% since January 2024 (company-claimed)
    - Medium
    - Shows directional acceleration if true
    - No absolute ARR base or independent corroboration disclosed
    - Request monthly ARR bridge and board KPI history
  - - Absolute ARR or revenue
    - Not publicly disclosed
    - Low
    - Core underwriting input for valuation and runway
    - Usage claims cannot be converted into revenue without monetization mix
    - Request trailing-12-month revenue, ARR, and monthly run rate by product
  - - Monthly API volume
    - '>1 billion monthly queries (company-claimed)'
    - Medium
    - Demonstrates top-of-funnel scale and infrastructure load
    - Could include low-priced or partner traffic; not a revenue proxy on its own
    - Request paid query mix, free query mix, and gross profit per query band
  - - Gross margin by product
    - Not publicly disclosed
    - Low
    - Determines whether premium products offset base-search compression
    - Licensed data and deep research likely create very different cost stacks by SKU
    - Request gross margin by search, contents, research, finance, and services
  - - CAC / payback
    - Not publicly disclosed
    - Low
    - Needed to distinguish efficient PLG from expensive enterprise selling
    - Free credits, docs, SDKs, and enterprise integrations only give directional hints
    - Request acquisition funnel, payback by segment, and sales-cycle lengths
  - - Net revenue retention
    - Not publicly disclosed
    - Low
    - Expansion versus churn is a core quality signal for recurring software revenue
    - Customer stories do not show cohort expansion
    - Request NRR, GRR, and cohort expansion by product line
  - - Customer concentration
    - Not publicly disclosed
    - Low
    - A few large API partners could dominate usage or revenue
    - Named logos do not disclose spend share or contract value
    - Request top-10 customer revenue share and largest-partner economics
  - - Cost per deep-research or finance query
    - Not publicly disclosed
    - Low
    - Premium list pricing only works if contribution margin survives multi-step retrieval and licensed data
    - Products cite hundreds of sources and external datasets
    - Request compute, licensing, and support cost per query by tier
  notes: Uses disclosed traction and pricing as proxies, but every core efficiency metric still requires direct management disclosure or a data-room extract.
