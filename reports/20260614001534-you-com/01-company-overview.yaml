- id: capital-formation
  title: Funding history, valuation progression, and investor mix
  body: 'The financing story is now clear enough to anchor the report, even if some repeated aggregate numbers remain fuzzy. TechCrunch documented a $20 million seed in 2021, then a $25 million 2022 round led by Radical Ventures, and company plus press sources align on a $50 million Series B in 2024 followed by a $100 million Series C in 2025 at a $1.5 billion valuation led by Cox Enterprises. Those four disclosed rounds sum to roughly $195 million of visible capital. That is materially below the roughly $222 million figure sometimes repeated in secondary narratives, which later chapters should therefore treat as unverified unless a missing tranche surfaces. The investor base is strategically interesting as well as financial: DuckDuckGo appears as both investor and customer, Cox contributes a board-linked growth fund through Socium, and earlier backers include Benioff, Radical, Salesforce Ventures, and Norwest. What is still missing are the cap-table details that matter for control and underwriting,
    including secondaries, observer rights, and any debt or structured capital.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO040
  tableRefs:
  - TO003
  - TO004
  figureRefs:
  - FO001
- id: scale-pivot-and-risk-context
  title: Scale markers, product pivot, and overview-level risk context
  body: 'The strongest public scale marker is not revenue but usage. Series C materials say the API now handles more than one billion queries per month, while the prior Series B post had already claimed one billion cumulative queries and 500% ARR growth since January 2024. Those are meaningful signals, but they are still mostly company-authored and need cautious treatment. What independent reporting does confirm is the strategic pivot: TechCrunch''s 2024 coverage says it would have been futile to fight Google on simple queries, so You.com moved up-market toward harder research and productivity tasks where citations and orchestration matter more. The customer stories support that story because they center on NIH research workflows, Maryville student outcomes, Mimecast GTM productivity, dpa newsroom discovery, and named relationships with Harvey and DuckDuckGo. The same evidence also surfaces the main overview risks. Distribution remains less proven than product quality, some key metrics are
    still self-reported, headcount is undisclosed, and public governance pages have not all caught up with the latest leadership changes.'
