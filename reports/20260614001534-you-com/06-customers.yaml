  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Customer count by segment, top-account mix, and revenue concentration by logo.
    whyItMatters: Without concentration visibility, the named logo set could mask a highly skewed revenue
      base.
    diligencePath: Request customer count by product, top-10 revenue share, and query-volume concentration.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, average contract term, and renewal calendar.
    whyItMatters: Renewal durability is the main missing ingredient between compelling case studies and
      durable software economics.
    diligencePath: Ask management for trailing 12-month retention metrics, cohort tables, and churn reasons
      by segment.
    relatedQuestionRefs:
    - QU024
    - QU029
    relatedTableRefs:
    - TU004
    - TU005
  - type: conflicting-data
    severity: material
    topic: customer-satisfaction
    missingEvidence: Reconciliation between positive curated case studies and materially negative Trustpilot
      support and billing complaints.
    whyItMatters: If consumer or team-plan support issues bleed into enterprise experience, the public
      proof could overstate renewal quality.
    diligencePath: Request support SLA performance, complaint-resolution rates, refund rates, and satisfaction
      by plan type.
    relatedQuestionRefs:
    - QU025
    - QU026
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: marketplace-proof
    missingEvidence: Direct readable marketplace listing pages or SKU-level procurement references for
      AWS, Azure, and Databricks.
    whyItMatters: Channel breadth is part of the commercial case, but readable public evidence is thinner
      than the partnership page implies.
    diligencePath: Collect exact marketplace URLs, screenshots, SKU identifiers, and first marketplace-sourced
      customer wins.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU006
    - TU005
  - type: private-evidence-only
    severity: material
    topic: logo-proof-depth
    missingEvidence: Independent customer-side confirmation or contract details for DuckDuckGo, Windsurf,
      Harvey, HanseMerkur, and Wort & Bild.
    whyItMatters: These logos support the narrative of scale and breadth, but public proof quality is
      too uneven to score them equally with NIH or Maryville.
    diligencePath: Request customer references, partner attestations, or invoice / statement-of-work evidence
      for named logos outside the flagship case studies.
    relatedQuestionRefs:
    - QU022
    - QU031
    relatedTableRefs:
    - TU003
