- id: deployment-motion-and-partner-channels
  title: Deployment friction is lowered by marketplaces and framework integrations, but public procurement
    proof trails the marketing narrative
  body: You.com's 2026 customer motion is increasingly channel-aware. The partnerships and integration
    docs position the company not just as a seat-based AI app but as an infrastructure layer available
    through MCP, cloud marketplaces, SDKs, workflow automation, and model ecosystems. That matters commercially
    because these channels shorten time-to-value for developers and allow teams to adopt You.com without
    re-platforming. GPT OSS makes You.com the default browser-tool backend, Zapier carries the APIs into
    no-code workflows, Vercel packages search and research tools into an existing developer stack, and
    MindStudio/Remy turns web intelligence into a dependency that can be compiled into generated apps.
    The enterprise page reinforces the same message by promising low-lift go-live and white-glove onboarding.
    The caveat is that procurement proof is still mixed. The You.com partnerships page claims AWS, Azure,
    and Databricks marketplace availability, but the captured AWS Marketplace search output does not itself
    surface a clearly readable listing or price card. So the broader deployment story is credible and
    strategically attractive, but not every claimed channel is equally well evidenced in public artifacts.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU035
  - CU038
  - CU041
  - CU043
  tableRefs:
  - TU006
  figureRefs:
  - FU002
- id: repeat-usage-retention-and-expansion
  title: Repeat-usage proxies exist, but retention durability is still a hypothesis rather than a published
    KPI
  body: 'The public evidence is good enough to say that some customers are doing more than a one-week
    test, but not good enough to underwrite classical SaaS durability. NIH''s pilot expansion and Maryville''s
    rising engagement are legitimate repeat-use signals. Shared-agent workflows at Mimecast and Team Plan
    access at dpa also suggest that You.com is selling something collaborative rather than purely personal.
    Review data adds another dimension: G2 is broadly positive, while Trustpilot is materially negative
    and heavy with support, billing, and reliability complaints. That divergence matters because it hints
    at a split between curated enterprise proof and messier mass-market customer experience. The enterprise
    trust story is directionally helpful—zero data retention, non-training of connected-party data, and
    deployment support all reduce enterprise objections—but the terms also acknowledge dependence on third-party
    APIs and reserved rights to change or discontinue features. The net result is that You.com appears
    capable of winning and expanding accounts, yet the public record still lacks GRR, NRR, renewal rate,
    average contract term, or expansion-by-cohort disclosure.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU040
  tableRefs:
  - TU004
  figureRefs: []
- id: concentration-renewal-and-proof-gaps
  title: The largest customer diligence risk is not absence of logos; it is absence of concentration and
    renewal visibility behind those logos
  body: 'The chapter''s main adverse read is that customer proof is real but still thin relative to the
    ambition of the story. The series C post cites more than 1 billion monthly API queries and names DuckDuckGo,
    Windsurf, and Harvey, which is strategically important, but none of those relationships comes with
    contract size, workload mix, or retention detail. The same is true for most partner-led and marketplace
    channels: they clearly broaden reach, yet they may also concentrate technical and commercial dependence
    on external ecosystems. Public procurement evidence does not fully close the loop, and third-party
    reviews surface support and activation issues that could matter disproportionately in team settings.
    Most importantly, the company discloses no customer count, no top-customer concentration, no ARR by
    segment, and no renewal statistics. That forces an investor to separate what is proven from what is
    only plausible. Proven: You.com has deployable products, real institutional references, and meaningful
    distribution. Unproven: how diversified the revenue base is, how sticky accounts remain after year
    one, and whether channel volume converts into durable economics.'
  claimRefs:
  - CU027
  - CU028
  - CU031
  - CU033
