          detail: 与智能体搜索高度重叠，工具包包装也透明，但可见分发力有限。
        - label: Brave Search API
          x: 4
          'y': 7
          detail: 自有索引和低价格提高了直接重叠度，不过产品范围仍以搜索为中心。
        - label: Glean
          x: 9
          'y': 6
          detail: 企业数据和席位分发能力很强，但与纯外部网页搜索的直接重叠度较低。
        - label: Google Agent Search
          x: 9
          'y': 6
          detail: 云分发和搜索积累带来高分发力，在有依据的企业检索上也有稳固重叠。
        - label: Azure / AWS 企业搜索
