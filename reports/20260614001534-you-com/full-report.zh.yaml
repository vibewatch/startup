  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 支撑证据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 真实牵引力与融资支持让机会有研究价值，但经济性披露仍太薄，不足以支撑确信买入。
        - 没有对收入质量和利润率做私下尽调前，不应按当前估值承销。
      - - 置信度
        - 中
        - 产品、资本获取能力和客户验证都真实存在；收入、留存和利润率数据缺失也同样真实。
        - 估值区间要留足宽度，避免给出单点精度。
      - - 风险评级
        - 高
        - 支持、集中度、供应商依赖和信任缺口可能同时传导到估值倍数压缩。
        - 仓位要谨慎，愿意付高价前必须拿到尽调权利。
      - - 估值立场
        - $1.5B 估值偏紧
        - Series C 估值有其合理性，但公开经济性还不足以完全支撑。
        - 更偏好相对上一轮折价，或看到更强的私下证据。
      - - 观点改变条件
        - 披露 ARR、毛利率、留存，以及高端工作流背后分散的大客户使用情况。
        - 这些指标会证明 You.com 不只是承受价格压力的检索层。
        - 只有当估值支撑来自经济性而非叙事本身时，才上调判断。
      - - 最可能的下一检查点
        - 新一轮私募融资、战略交易，或更丰富的二级市场定价
        - 目前公开层面还看不到 IPO 式披露。
        - 把融资和披露质量作为下一次市场检验。
    notes: 这份摘要有意把价格和证据放在核心位置：公司质量本身不足以支撑当前估值。
