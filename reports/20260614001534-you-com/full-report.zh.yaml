      - number: '7.4'
        title: 可见缓释因素有帮助，但投资案例仍需要明确否决标准和私下尽调
        blocks:
          - type: paragraph
            body: >-
              正确姿态应是有条件判断，而不是非黑即白。You.com 在公开视野里确实有不少缓释因素：模型无关定位、来自受监管和重视引用买家的客户故事、DPA 和安全文件壳、治理模板、免费到付费的开发者漏斗，以及 AWS
              Marketplace
              这类采购路径。这些都是真实的降风险信号。但它们不能替代买家级尽调。对本章来说，最高优先级的否决标准也都可以跟踪。如果隐私、信任或监管事件在公司证明成熟控制之前落地，企业叙事应迅速重估。如果模型供应商涨价、弃用或限流，而公司没有可信后手，利润率和可靠性故事会同时变弱。如果管理层无法披露客户集中度、续约行为和产品级毛利率，公开证明就仍然过于精修，无法支撑有信心的承销。如果付费计划的可靠性或支持质量反复浮出水面，而不是孤立噪音，那就是商业化问题，不是表面瑕疵。实际尽调要求很直接：先拿到信任包、供应商地图、集中度清单、支持和事件历史，以及真实合同经济性，再把企业故事视为已充分降风险。
