  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: You.com 的外部依赖网横跨模型、采购和竞争平台；其中多个节点可以同时影响产品质量和议价杠杆。
    data:
      nodes:
        - id: you
          label: You.com 运营核心
          detail: 产品、路由、企业 GTM 和支持。
          tone: positive
        - id: llms
          label: OpenAI / Anthropic / Google
          detail: 隐私政策中点名的 LLM 提供商。
          tone: warning
        - id: gptoss
          label: GPT OSS 生态
          detail: 集成文档将 You.com 列为默认浏览器后端。
          tone: warning
        - id: aws
          label: AWS marketplace 渠道
          detail: 与 EDP 和发票合并绑定的采购捷径。
          tone: neutral
        - id: comp
          label: OpenAI / Google / Brave 替代方案
          detail: 具备捆绑或合规优势的竞争性 grounded-search 技术栈。
          tone: warning
        - id: accounts
          label: 标杆账户
          detail: 经过筛选的企业背书和大型 API 客户。
          tone: warning
      edges:
        - from: llms
          to: you
        - from: gptoss
          to: you
        - from: aws
          to: you
        - from: comp
          to: you
        - from: accounts
          to: you
        - from: llms
          to: accounts
        - from: comp
          to: accounts
    approximationNotes: 这张依赖图标出外部交易对手在哪些位置会同时影响产品体验和商业杠杆，并不意味着各节点权重相同。
    claimRefs:
      - CR001
      - CR016
      - CR031
      - CR032
      - CR033
      - CR034
      - CR037
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从牵引力和市场背景出发，经由披露与竞争，推导到继续研究建议的链条。
    data:
      nodes:
        - id: n1
          label: 真实牵引力：1.5B Series C、经过筛选的企业客户证明、>1B 月查询量声明
        - id: n2
          label: 变现广度：搜索、研究、金融和企业工作流界面
        - id: n3
          label: 商品化压力：同业直接检索定价已经被压缩
        - id: n4
          label: 披露缺口：收入、利润率、留存、集中度和现金续航仍未公开
        - id: n5
          label: 风险负担：支持、信任、提供商依赖和平台替代
        - id: n6
          label: 公开证据更能证明需求存在，而不是证明经济性可持续
        - id: n7
          label: 估值立场：缺少私下证据时，1.5B 估值偏高
        - id: n8
          label: 建议：继续研究；只有披露经济性后才上调
      edges:
        - - n1
          - n6
        - - n2
          - n6
        - - n3
          - n6
        - - n4
          - n6
        - - n5
          - n6
        - - n6
          - n7
        - - n7
          - n8
    approximationNotes: 这是逻辑链，不是加权模型；它展示哪些公开事实驱动建议，以及缺失证据在哪里打断了信心。
    claimRefs:
      - CV001
      - CV010
      - CV013
      - CV017
      - CV033
      - CV034
      - CV039
      - CV040
