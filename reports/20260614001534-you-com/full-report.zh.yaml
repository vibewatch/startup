  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 仅基于公开证据，对市场、证明、经济性、风险和估值支撑做 IC 风格评分。
    data:
      items:
        - label: 市场机会
          value: 8
          max: 10
          note: 企业 AI 预算和经常性软件配置趋势是真实的顺风因素。
        - label: 产品和工作流证明
          value: 7
          max: 10
          note: 公开产品广度和被引用的研究工作流，比泛泛的 API 故事更强。
        - label: 客户证明
          value: 6
          max: 10
          note: 具名客户和量化案例研究已经存在，但样本经过筛选，集中度仍被隐藏。
        - label: 经济性披露
          value: 2
          max: 10
          note: 收入、利润率、留存和现金续航大多仍未公开。
        - label: 竞争耐久性
          value: 5
          max: 10
          note: 楔子真实存在，但直接检索定价和平台捆绑让压力保持高位。
        - label: 风险负担
          value: 3
          max: 10
          note: 信任、支持、提供商和集中度风险仍会影响估值。
        - label: 估值支撑
          value: 4
          max: 10
          note: 1.5B 估值可以成立，但公开证据仍更支持“偏高”，而不是“有吸引力”。
        - label: 证据质量
          value: 4
          max: 10
          note: 来源集合很宽，但关键承销指标仍未进入公开视野。
    approximationNotes: 分数是定性且受证据约束的；它们用于概括信心，而不是替代财务模型。
    claimRefs:
      - CV013
      - CV017
      - CV026
      - CV034
      - CV039
      - CV040
      - CV046
      - CV048
