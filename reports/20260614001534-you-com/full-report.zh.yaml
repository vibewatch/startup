  - id: TV005
    title: 论点破裂与退出触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 平轮或下调轮
        - 下一轮融资在更苛刻条款下，价格等于或低于 2025 年估值
        - 证明投资者深入经济性后，当前叙事溢价没能守住。
        - 把估值框架推向空头区间，并审查清算优先权悬挂。
      - - 高端 SKU 变现不及预期
        - 管理层无法证明研究、金融或企业工作流显著改善实现价格或利润率
        - You.com 正从商品化检索毕业的判断会坍塌。
        - 在产品经济性得到证明前，移除多头情景权重。
      - - 集中度意外
        - 少数 API 客户贡献了不成比例的使用量或收入
        - 使每月 >1B 查询量的说法不如表面上有价值，并抬高续约风险。
        - 要求更大折扣，并重新评估耐久性假设。
      - - 信任或支持失灵
        - 账单、支持、隐私或可靠性问题在尽调或客户访谈中反复出现，形成模式
        - 在高端定价最需要信任的位置，推高流失和声誉风险。
        - 暂停承诺，直到运营指标和客户访谈改善。
      - - 供应商或平台冲击
        - 主要上游模型或平台变化恶化成本、质量或路由灵活性
        - 挤压利润率，并削弱模型无关切口。
        - 用更低实现利润率和更高运营风险重算情景。
      - - 披露继续停滞
        - 管理层在下一轮尽调中仍不披露 ARR、利润率、留存和 runway
        - 估值继续锚在叙事，而不是经营证据。
        - 维持继续研究立场，不要高于保守区间付款。
    notes: 每个触发因素都可监测，并直接关联基准情景是否仍能成立。
