        title: 最大的客户尽调风险不是没有 logo，而是这些 logo 背后的集中度和续约可见度缺失
        blocks:
          - type: paragraph
            body: >-
              本章最主要的反向解读是：客户证明真实存在，但相对于故事的雄心仍然偏薄。Series C 文章称每月 API 查询超过 10 亿次，并点名 DuckDuckGo、Windsurf 和
              Harvey，战略意义很强；但这些关系都没有给出合同规模、工作负载组合或留存细节。多数伙伴驱动和市场渠道也是如此：它们显然扩大了触达，却也可能把技术和商业依赖集中到外部生态上。公开采购证据没有完全闭环，第三方评论还暴露了支持和激活问题；在团队场景里，这些问题可能被放大。最重要的是，公司没有披露客户数、头部客户集中度、分业务
              ARR 或续约统计。投资人因此必须把已被证明的事实和只是合理推测的部分分开。已证明的是：You.com
              有可部署产品、真实机构背书和有意义的分发能力。未证明的是：收入基础有多分散、客户第一年之后有多粘、渠道流量能否转成耐久经济性。
