      - number: '3.2'
        title: 直接同行在外部 grounding 上竞争，incumbents 则争夺数据控制
        blocks:
          - type: paragraph
            body: >-
              在最直接的同行中，重叠最清楚的是向开发者开放搜索、答案或研究端点的厂商。Exa 提供 search、contents、answer 和 research 端点；Tavily 提供
              search、extract、crawl、map 和 research；Brave 基于自有网页索引提供 raw search 和 answer API；Perplexity 官方文档把 raw search 与
              Sonar、agent tooling 组合起来。OpenAI 的 web search 也应放入这组替代组件，尽管它被包装成 Responses API
              里的内置工具，而不是专门的搜索产品界面。这些直接同行会立刻对 You.com 的外部网页产品形成价格和功能压力。incumbent 一侧不同。Glean
              的姿态围绕权限感知企业检索、连接器广度、嵌入式工作流界面和按用户计费的 Enterprise Flex 包装展开。Azure AI Search、AWS Kendra 和 Google Agent Search
              同样强调混合检索、知识库管理和企业数据访问，定价模型围绕容量、订阅或基础设施式计量，而不是简单的自助式网页搜索调用。Elastic 又扩展了 incumbent 集合，提供企业搜索和向量搜索 building
              blocks，而不是 turnkey 答案引擎。结果是一场双线战。You.com 既要在底层 web-grounding 同行面前赢得开发者偏好，也要证明自己能足够强地承载企业上下文、治理和工作流深度，避免被
              Glean 或 hyperscaler-native 栈替代。
