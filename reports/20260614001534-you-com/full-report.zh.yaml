      - number: '1.2'
        title: 创始人履历、领导层延续性和治理信号
        blocks:
          - type: paragraph
            body: >-
              创始人与市场的匹配，是 You.com 最清晰的优势之一。Richard Socher 仍是公司最主要的公开声音，来自 Salesforce 和学术 NLP 的履历带来少见可信度；Bryan McCann
              则通过公司用于解释技术根源的 Natural Language Decathlon 工作，连到同一条研究脉络。这种履历让公司从搜索 UI
              转向检索基础设施的转变更可信：创始团队过去做过语言建模、企业产品化和评估。不过，领导层延续性比旧版公司页面暗示的更复杂。公开 About 页面仍把 McCann 标为 CTO，但 2026 年 3
              月公司公告已把运营 CTO 角色交给最早期员工之一 Saahil Jain，McCann 则以顾问和董事会身份继续参与。除此之外，治理披露仍然很薄。主要硬信息是 David Yang 随 Series C
              加入董事会，说明董事会演进终于开始对外可见，但还远未充分透明。
