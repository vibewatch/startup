    rows:
      - - 产品表面
        - You.com 现在销售搜索、研究、金融和企业工作流产品，而不再只是单一的消费者搜索工具。
        - 仅有产品宽度，不能证明更高价值 SKU 已成为经济重心。
        - 按产品线展示收入结构和贡献利润率。
      - - 客户验证
        - NIH、Maryville、DPA、HanseMerkur、Mimecast 和具名 API 客户显示，它切入了受监管且知识密集的工作流。
        - 公开客户证据经过筛选，没有揭示账户集中度、合同规模或续约情况。
        - 提供头部客户结构、合同规模和 cohort 留存数据。
      - - 融资信号
        - $100M Series C、$1.5B 估值说明市场仍愿意为这个故事出资。
        - 2025 年 6 月约 $1.4B 的融资信号和不透明轮次条款，都反对盲目沿用该估值。
        - 披露 term sheet 逻辑、清算优先权结构和当前二级市场价格。
      - - 竞争姿态
        - 模型无关定位和企业控制能力，让 You.com 在报告提到的研究工作流中有真实切口。
        - 直接搜索价格正在压缩，更大平台也能把检索打包进更广的套件。
        - 证明高端工作流能把实现价格推到商品化检索之上。
      - - 估值方法
        - 当收入、利润率和留存仍属私有信息时，情景分析能保留不确定性。
        - 单一可比倍数会制造公开记录并不支持的精确感。
        - 释放足够财务数据，支撑更紧的估值框架。
    notes: 每个多头观点都配上对应证据；只有这些证据变得可见，论点才配得上更紧的倍数。
