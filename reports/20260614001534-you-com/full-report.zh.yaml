  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 即使没有头部诉讼，法律、隐私和企业信任风险依然真实
        blocks:
          - type: paragraph
            body: >-
              法律和监管栈是尽调最先该感到不舒服的地方。You.com 有足够公开文件去卖给企业，但这些文件也明确写出公司不控制什么。隐私政策点名多个 LLM
              供应商，提醒用户不要上传受限数据，披露继续转移和服务提供商共享，并保留法律留存例外。条款更进一步，把第三方输出和 API 的风险转回用户，同时保留修改、暂停或停用功能的广泛权利。这些条款对快速迭代的 AI
              产品很常见，但在这里更重要，因为 You.com 把信任、引用和适配受监管工作流作为价值主张的一部分在销售。2026 年 AI Act 时间线和 HanseMerkur
              的公开评论显示，受监管买家越来越需要可审计性、文档和可预测控制，而不只是好答案。缓释因素是，You.com 确实发布了法律中心、DPA-ready
              语言、治理模板和企业信任主张。未解的问题在于深度：公开网页更清楚展示的是文件壳和营销说法，而不是谈判后的赔偿、控制映射、事件义务或客户级 SLA 语言。
