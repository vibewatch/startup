  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正题与反题
        blocks:
          - type: paragraph
            body: >-
              You.com 的多头逻辑不难理解。公开来源显示，它有真实产品面，而不只是一个通用 AI wrapper：低摩擦搜索 API、更高价的研究和金融产品、私有数据集成，以及企业部署构建。客户证据也好于普通早期 AI
              故事。NIH、Maryville、DPA、HanseMerkur 和 Mimecast 都支持一个判断：在受监管或重视准确性的场景里，带引用的搜索和研究工作流可以有价值；Series C 文章还点名了
              DuckDuckGo、Windsurf、Harvey 等 API 客户。在这个背景下，$1.5 billion 的 Series C
              表面上并不荒唐。反题在于，投资人真正需要用来估值的几乎每个指标都还藏着。公司声称每月 API 查询超过 10 亿次，也曾称 ARR
              加速，但公开来源没有披露实际净定价、收入组合、毛利率、留存或客户集中度。与此同时，基础检索在 You.com、Brave、Exa 和 Perplexity 之间已经被价格压缩，OpenAI 和
              hyperscalers 这类更大平台还能把检索打包进更广的栈里。因此，估值问题不是 You.com 有没有意思，而是叙事背后的私有经济性是否足够好，能支撑在当前标记上支付溢价。
