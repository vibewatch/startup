  - id: TP004
    title: 护城河韧性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 有证据支撑的理由
      - 缓释方式 / 尽调索取项
    rows:
      - - 引用式网页 grounding 质量
        - 直接 API 同行之间价格压缩
        - 高
        - 多个同行的基础外部搜索定价已大致集中在每 1,000 次请求 $4-$7。
        - 索取按端点拆分的留存和毛利率证据，尤其比较研究产品与普通搜索
      - - 企业工作流深度
        - Glean 与 hyperscaler 控制内部数据、身份和采购
        - 高
        - 与 You.com 的公开呈现相比，Glean 和云端既有厂商更贴近连接器、权限和企业落地界面。
        - 按用例和买方画像，提供与 Glean、Microsoft、Google、AWS 竞争的赢单 / 输单数据
      - - 模型无关灵活性
        - 用开放模型和托管搜索工具自建内部方案
        - 中高
        - 工程团队想掌握控制权时，gpt-oss 加网页搜索工具降低了拼装定制技术栈的门槛。
        - 与内部自建替代方案相比的价值实现时间、维护负担和总成本基准
      - - 研究型 agent 差异化
        - Harvey 等垂直工作流产品
        - 中
        - 专用工具可以占住高价值工作流，降低对横向研究平台的需求。
        - 证明 You.com 已扩展到特定领域、留存稳住，且客户愿意在试验之外把 You.com 标准化使用
      - - 信任与治理姿态
        - 竞争对手的信任叙事趋同
        - 中
        - You.com、Glean 和 Brave 都强调安全或零数据留存式主张，削弱了信息层面的差异化。
        - 第三方安全尽调、红队结果，以及因合规赢单的客户证明
      - - 公司自编基准领先
        - 未被独立复现的基准叙事
        - 中
        - You.com 最强的相对性能主张来自自家基准和发布材料，而不是中立第三方测试。
        - 独立 bake-off 结果、具名客户证明和可复现评估方法
    notes: 严重性反映截至 2026-06-14 公开证据集中的承销相关性，并非实测市场份额。
