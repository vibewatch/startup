  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局，以及最重要的竞品类别
        blocks:
          - type: paragraph
            body: >-
              不应只拿 You.com 对标一个答案引擎或一个企业搜索 incumbents。公开产品界面显示出三类不同竞争者。第一类是直接的 API-first 同行——Exa、Tavily、Brave、Perplexity
              和 OpenAI 的网页搜索栈——它们向代理和应用销售可编程检索、答案生成或研究工作流。这些厂商攻击的买家问题与 You.com 的自助式搜索和研究 API 相同：如何在不从零搭建检索层的情况下，给 LLM
              提供当前、带引用、有网页依据的上下文。第二类是企业 incumbents 和近似 incumbents——Glean、Azure AI Search、AWS Kendra、Google Agent Search
              和 Elastic——它们较少在简单每次调用价格上竞争，更多争夺私有数据、权限、索引、治理和采购关系的控制权。第三类是看起来完全不像搜索厂商、却能捕获同一预算的替代品，包括专业服务工作流里的
              Harvey、拥有消费分发规模的 DuckDuckGo，以及由 OpenAI 的 gpt-oss 加托管搜索工具促成的内部自建栈。这个框架重要，因为 You.com
              已不再把自己呈现为泛消费搜索挑战者；TechCrunch 2024 年报道和 You.com 自己的企业界面都显示，它正转向更深的研究和生产力代理。因此，承销问题不是 You.com
              有没有对手——显然有——而是在某个具体交易中，哪一类压力最大：开发者采用、企业扩张，还是内部自建决策。
