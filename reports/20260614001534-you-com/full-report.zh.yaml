      - number: '8.4'
        title: 可比公司组合与市场锚点
        blocks:
          - type: paragraph
            body: >-
              最干净的可比教训不是某一个倍数，而是不同证据层级能拿到什么定价。Glean 是这组来源里最有用的私人参照，因为它把高得多的 $7.2 billion 估值、披露的 $100 million 以上
              ARR，以及清晰的企业平台故事放在一起。公开软件公司则框定了经济性可见后市场奖励的外沿。Elastic 是一家与搜索和基础设施相邻的上市公司，2026 年 6 月市值约 $6.3 billion、约 3.6x
              sales；Datadog 和 Snowflake 的收入倍数和市值则高得多。重点不是 You.com 应该接近这些龙头，而是公开市场把这些溢价留给披露收入、增长和利润率质量的公司。下行情景也适用同一原则。搜索
              API 同行发布透明价格，hyperscalers 又把检索打包进更广的采购关系；因此，未披露经济质量的公司不应默认拿到高端软件可比逻辑的全部好处。可比公司因此支持谨慎，而不是机械下调或上调。
