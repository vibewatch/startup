      - number: '8.6'
        title: 建议与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              正确投资姿态是继续研究，置信度中等，并且认为公开 $1.5 billion 标记下估值偏紧。这不是说 You.com
              没有前景，而是说公开记录对产品相关性的支持远强于对耐久经济性的支持。如果投资人能以显著低于上一轮的价格买入，或管理层能私下证明强 ARR、健康毛利率、分散的大客户，以及高粘性的高端工作流采用，姿态可以转向
              fair，最终再转向 track。没有这些证明，为故事支付溢价就是承销希望，而不是承销证据。最终尽调清单直接且杠杆很高：收入组合、产品毛利率、集中度和留存、cap table 条款、现金
              runway。如果这五块都强，公司可能值得高于当前公开证据所允许的估值。如果它们偏弱或仍被 withheld，上一轮就应被视为叙事上限锚点，而不是可靠的当前价值。
