  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信任或监管事故
        - 与隐私、留存或 AI 合规相关的公开披露、监管机构接触或客户数据泄露通知
        - 任何与零留存、安全或受监管工作流主张相矛盾，且没有快速控制和买方级解释的事故
        - 立即重估投资论点；暂停承保，直到事故范围和补救措施得到独立验证。
      - - 上游供应商重新定价或访问丧失
        - 影响主要模型的支持通知、产品限制变化或供应商合同重置
        - 丧失旗舰模型的同等访问能力，或在没有替代经济性的情况下发生实质成本传导
        - 重做利润率假设，并在继续推进前要求证明备用路由。
      - - 客户集中度不透明
        - 管理层在尽调中拒绝披露头部账户构成、续约行为或查询集中度
        - 无法提供可信的头部客户、NRR/GRR 或工作负载集中度明细
        - 将收入耐久性视为未经证明，并把估值立场调得更保守。
      - - 付费套餐可靠性和支持恶化
        - 激活、额度或未解决企业阻塞点上反复出现投诉
        - 一个季度内反复出现未解决的付费客户失败，而非一次性噪音
        - 下调商业化可扩展性信心，并要求更强的支持指标。
      - - 竞争性价格压缩
        - OpenAI、Google、Brave 或类似打包产品缩小有依据搜索与引用上的价值差距
        - 持续需要匹配竞争对手价格，却没有利润率韧性或更高价值企业附加的证据
        - 假设贡献利润率更低，并降低承保溢价倍数的意愿。
      - - 领导层或执行断裂
        - 高管离职、信任包交付延误，或无法连贯支撑多条 GTM 动作
        - 创始人 / 高管出现重大扰动，且没有清晰继任或运营冗余
        - 重新评估执行折价，并要求更强治理权，或等待稳定后再推进。
    notes: 这些触发因素刻意保持可监控。目标不是虚假的精确性，而是定义哪些事件应改变估值纪律或停止尽调流程。
