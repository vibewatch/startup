      - number: '5.3'
        title: 信任姿态在商业上纸面很强，但公开技术披露仍落后于平台野心
        blocks:
          - type: paragraph
            body: >-
              You.com 显然知道，企业 AI 买家关心的不只是原始搜索质量，也同样关心信任和可部署性。定价和企业页面强调零数据留存、SOC 2 认证、DPA ready、自定义 QPS limits
              和私有数据集成。隐私政策补充了有用的技术背景：服务使用多个 LLM providers，明确点名 OpenAI、Anthropic 和 Google，内容托管在
              AWS，并称从已连接第三方系统拉取的数据不会用于训练第三方 AI 模型。条款也说明了更冷静的现实：部分功能依赖第三方 API 按合理条件持续可用，You.com
              也保留修改或停止功能的权利。这让信任故事足以打开企业大门，但从尽调角度看仍未完全透明。公开材料没有给出架构层细节，例如模型路由政策、fallback paths、事故历史、签署的 uptime
              commitments，或安全声明背后的详细控制映射。不过，集成广度是真优势。公司现在接入 MCP-enabled IDEs、Databricks、Zapier、Vercel AI SDK、OpenAI
              SDK、Claude Agent SDK 和常见企业数据存储。分发扩大了使用，也增加了连接器脆弱性、权限错误和外部平台变化风险。
