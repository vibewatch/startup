        title: 融资背景、估值纪律，以及公开标记真正说明什么
        blocks:
          - type: paragraph
            body: >-
              融资记录现在给了投资人一个清晰标题，但没有给出清晰承销文件。You.com 可见融资合计约 $195 million，包括 2021 年 $20 million 融资、2022 年 $25 million
              轮、2024 年 $50 million Series B、2025 年 $100 million Series
              C。这条序列重要，是因为它说明公司在战略转向中仍能持续吸引资本。但估值纪律也要求看成交前一刻的信号。Verdict 2025 年 6 月报道，公司正在寻求以约 $1.4 billion
              估值融资，随后才有官方宣布的 $1.5 billion Series C。这个差距不足以称为 distress，但确实说明最终轮次应被视为一次谈判形成的市场事件，而不是突破性经济性的自明证明。两个 2025 年
              Form D 载体又增加了一层细节：它们显示轮次周围有融资生态支持，但不必然等同于运营公司直接进账，或干净的普通股条款。因此，投资人应把 $1.5 billion
              标记当作真实锚点，但不能把它当成稀释、runway 或优先权结构问题的充分答案。
