    rows:
      - - 外部网页 grounding API
        - 搜索调用、摘要、页面提取、引用、面向实时网页工作流的答案生成
        - 消费者搜索广告、通用浏览流量变现
        - 使用 usage-based API 预算的开发者平台团队或产品负责人
        - 最贴合 You.com 公开 API 定位和基准材料
      - - 企业检索 / workplace search
        - 索引、连接器、权限感知检索、员工答案体验
        - 没有搜索或 grounding 层的通用生产力套件
        - CIO、知识平台负责人、AI enablement 负责人
        - 与企业扩张相关，但不是 You.com 今天最清晰的公开楔子
      - - 垂直研究工作流
        - 更高价值的领域端点、研究代理、合规或分析师工作流
        - 缺乏搜索深度的宽泛横向生产力软件
        - 用工作流软件预算付费的职能负责人或平台团队
        - 相关，因为 You.com 销售高端研究型端点
      - - Agent 平台 grounding 层
        - 位于聊天机器人、copilot 和自主代理下方的 API 和检索服务
        - 没有检索或引用层的纯模型支出
        - AI 工程或平台预算负责人
        - 重要，因为 agents 需要带引用且新鲜的检索，而不只是模型 tokens
      - - 消费者答案引擎 UX
        - 面向终端用户的自然语言搜索界面和答案呈现
        - 企业连接器和内部权限栈
        - 消费者产品预算或流量变现负责人
        - 历史上与 You.com 有关，但对当前市场 sizing 来说太宽
      - - DIY 或替代栈
        - 传统企业搜索、vector DB 加 LLM 栈，或竞争搜索 API
        - N/A
        - 与上述相同的买家
        - 这些替代方案争夺同一笔 grounding 和知识工作预算
    notes: 各行把更宽的 AI 和搜索背景，与更窄且看起来最贴近 You.com 的检索、grounding 和工作流支出分开。
