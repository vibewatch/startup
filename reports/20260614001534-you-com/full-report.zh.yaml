  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 You.com 时，不应假设它在争夺所有搜索、所有生成式 AI 或所有知识工作软件支出。证据更具体。AI
              搜索由自然语言理解、跨多来源检索以及带引用的综合答案定义；企业搜索还叠加内部授权、索引和连接器要求，这些在消费级答案引擎里并不存在。这意味着，You.com 最相关的市场边界，位于外部网页
              grounding、企业检索和面向代理的研究基础设施交汇处。纳入支出包括搜索调用、答案生成 API、抽取、RAG
              grounding，以及让开发者或企业团队基于新鲜数据搭建工作流的高价值研究端点。排除支出包括原始模型训练预算、广义消费搜索广告预算，以及并不真正提供搜索或 grounding
              基础设施的软件类别。现实替代方案是传统关键词或联邦搜索、围绕基础模型 API 自建的 DIY RAG 栈，以及承诺为代理提供类似 grounding 的 API-first 搜索竞品。
