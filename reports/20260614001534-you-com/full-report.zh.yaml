    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹和当前定位
        blocks:
          - type: paragraph
            body: >-
              现在再把 You.com 描述成消费级答案引擎，已经不准确。最新官方页面把它定位为企业 AI 基础设施，帮助组织更快获得准确、新鲜、可行动的情报；法律文件则把运营实体写作 SuSea, Inc. d/b/a
              you.com。公开足迹也不只是单办公室创业公司的故事：法律通知地址和多条公司新闻 dateline 指向 Palo Alto，招聘网站则强调 San Francisco 和 New York
              办公室。这个组合符合公司轨迹：2020 年以 AI 原生搜索挑战者起步，随后把前门转向 API、私有数据检索和企业工作流支持。商业模式现在明显是混合型。You.com
              一边提供自助定价和公开开发者入口，一边营销定制企业搭建和专家实施支持。后续章节最稳妥的概览框架是：You.com 是一家私营 AI 搜索与研究基础设施公司，在美国有多地足迹，企业化姿态比最初消费搜索发布时更强。
