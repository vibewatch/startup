          detail: 云分发和私有数据控制很强，但相比 You.com 的自助式网页搜索切口，更像基础设施。
        - label: 内部自建
          x: 2
          'y': 6
          detail: 默认分发力较低，但团队把开放模型和搜索工具拼起来时，重叠度会变得可观。
        - label: Harvey
