              tone: negative
              detail: 隐私政策点名这些依赖，产品文档和评测也显示它们已落到运营里。
            - label: 关键
              tone: negative
              detail: 一旦重新定价或失去访问权限，可靠性和毛利率会同时受冲击。
            - label: 中
              tone: warning
              detail: 模型无关路由已经存在，但备用路径的证据仍未公开。
            - label: 高
              tone: negative
              detail: 只有尽调证明备用路径能跑通，剩余暴露才会下降。
        - label: 隐私 / 监管负担
          values:
            - label: 中高
              tone: warning
              detail: AI Act 落地节奏和受限数据规则抬高了监管行业部署门槛。
            - label: 高
              tone: negative
              detail: 一次信任事件就会削弱核心企业销售叙事。
            - label: 中
              tone: warning
              detail: 法务中心、DPA 条款和治理套件有帮助，但还不完整。
            - label: 中高
              tone: warning
              detail: 剩余暴露取决于合同包和运营纪律，这些证据尚未公开。
        - label: 可靠性 / 支持质量
          values:
            - label: 中
              tone: warning
              detail: 评测和公司文档显示这类风险成立，但独立遥测证据很薄。
            - label: 高
              tone: warning
              detail: 付费方案或检索一旦失效，企业信任会很快破裂。
            - label: 低中
              tone: warning
              detail: 公开缓释措施存在，但没有买方级 SLA 和事故复盘证据。
            - label: 中高
              tone: warning
              detail: 没有独立 uptime 证明，剩余严重性仍然偏高。
        - label: 商业化 / 定价压力
          values:
            - label: 高
              tone: negative
              detail: 公司仍在证明，自己能从搜索增长转向可持续的企业经济性。
