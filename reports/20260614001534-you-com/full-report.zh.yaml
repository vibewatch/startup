  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 公开机制
      - 当前标价 / 单位信号
      - 收入质量判断
      - 证据状态
      - 尽调索取项
    rows:
      - - Web Search API
        - 面向开发者和 agents 销售、按使用量计费的自助式 API
        - $5 per 1,000 calls
        - 量大，但基础层可能承受价格压缩
        - 官方定价页可直接观察
        - 索取按查询区间拆分的实际净价、客户结构和毛利率
      - - Contents API
        - 用于页面内容的按量抽取或 livecrawl 附加产品
        - $1 per 1,000 pages
        - 有用的附加产品，但客单价可能低于搜索或研究
        - 官方定价页可直接观察
        - 索取从搜索到 contents 的附加率及相关基础设施成本
      - - Research API
        - 面向多步骤开放网页研究的高价引用答案工作流
        - 公开页面文字为每 1,000 次查询 $12
        - 若采用真实，变现好于基础搜索
        - 公开标价可见；实际用量未知
        - 索取按研究层级和客户 cohort 拆分的量级结构
      - - Finance Research API
        - 使用授权数据和公开数据的金融专用 agentic research
        - $110 / 1,000 次查询
        - 可见标价最高，但服务成本可能也最高
        - 公开发布和定价已披露
        - 索取扣除授权数据费、计算和支持后的毛利率
