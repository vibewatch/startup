            body: >-
              You.com 栈的成熟度不均匀，但脉络清楚。Search、Contents 和通用 grounding 层看起来是最成熟的界面，因为它们有公开定价、文档、多条集成路径、客户引用和反复发布节奏。Research
              和 ARI 也不像实验品，尤其是公司已经开源评估工具，并围绕引用密集型工作流搭建客户故事。Finance Research
              在战略上有意思，因为它从开放网页检索升级到授权金融数据加证据裁决；但它也最清楚地提醒我们，部分护城河位于 You.com
