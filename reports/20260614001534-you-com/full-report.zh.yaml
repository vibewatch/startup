        - 未披露 ARR、利润率、留存或清算优先权条款。
      - - Glean Series F
        - 私募融资加已披露 ARR 信号
        - 融资 150M，估值 7.2B；公司称 ARR 已超过 100M
        - 展示更强企业披露在私募 AI 软件中能拿到什么定价。
        - 产品组合不同，公开 ARR 证据也远强于 You.com。
      - - Elastic
        - 公开市值和销售倍数
        - StockAnalysis 显示约 6.3B 市值；约 3.6x 销售额
        - 搜索和基础设施相邻的公开可比公司，有真实财务披露。
        - 增长较低的公开市场业务，成熟度画像不同。
      - - Datadog
        - 公开市值和销售倍数
        - StockAnalysis 显示约 81.8B 市值；约 22.3x 销售额
        - 说明公开市场会给高增长、披露充分的软件基础设施什么溢价。
        - 规模大得多，披露也比 You.com 多得多。
      - - Snowflake
        - 公开市值和销售倍数
        - StockAnalysis 显示约 80.7B 市值；约 16.0x 销售额
        - 给出第二个高质量公开软件锚，并带有明确估值比率。
        - 数据云经济性和成熟度与搜索及研究基础设施差异很大。
