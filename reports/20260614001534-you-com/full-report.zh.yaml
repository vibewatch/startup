  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 公司 / 类别
      - 公开价格或单位
      - 合同模式
      - 包含能力
      - 折扣 / 未知项
      - 影响
    rows:
      - - You.com
        - 每 1k 次 web-search 调用 $5；每 1k 次 research 请求 $12；每 1k 次 finance-research 请求 $110
        - 按用量计费的自助服务加企业销售动议
        - 外部网页搜索、研究工作流、金融研究、引用和企业选项
        - 实际企业折扣和席位经济性不公开
        - 自助入口强，但毛利防守可能取决于更高价值工作流
      - - Exa
        - 每 1k 次 search $7；每 1k 次 deep search $12；每 1k 次 deep-reasoning search $15；Agent 请求 $0.025 起
        - 按用量计费的 API 定价
        - 搜索、内容、答案、研究和异步 Agent
        - 企业折扣和自定义数据集定制定价
        - 纯 API 经济性上，可与 You.com 清晰做开发者侧对比
      - - Tavily
        - 每月 1,000 个免费 credits；按量付费每 credit $0.008；高级搜索消耗 2 credits
        - 基于 credit 的用量模型，提供月度套餐和企业定制定价
        - 搜索、提取、映射、爬取和研究工作流
        - credits 到请求经济性的换算取决于端点和深度
        - 适合实验和 Agent 工具打包，虽不如按调用定价直观
      - - Brave Search API
        - 每 1k 次答案请求 $4，另收 token 费用；搜索套餐含每月免费 credits
        - 按用量计费 API，另有定制企业套餐
        - 原始搜索、答案、引用和独立索引访问
        - 存储权利和大规模条款需要升级套餐
        - 在这组来源中，可见直接答案价格最低，加大基础检索的商品化价格压力
      - - Perplexity
        - 每 1k 次搜索请求 $5；每次 web_search 工具调用 $0.005；Sonar 分层另收 token 和请求费用
        - 跨搜索、Agent 和模型层的 API 用量模型
        - 原始搜索、答案引擎模型、深度研究和 Agent 工具
        - 企业席位定价存在，但本章证据集中在文档定价
        - 在外部答案和研究变现上与 You.com 高度重叠
      - - OpenAI
        - 每 1k 次 web-search 调用 $10，另加模型 token 定价
        - 模型加工具定价，而不是独立搜索产品定价
        - Responses API 内的托管网页搜索
        - 总成本取决于模型、工具频率和 token 量
        - 作为构建者栈组件有吸引力，但本身不是开箱即用的企业搜索平台
      - - Glean
        - 按用户计费的 Enterprise Flex 席位加共享 FlexCredits；标准 thinking 包含每用户每周最多 100 次查询
        - 席位许可，高级 AI 功能按用量超额收费
        - 企业搜索、聊天、Agent、嵌入式应用体验和 API
        - 这组来源中的官方文档没有发布简单公开席位费率
        - 打包方式更偏企业推广和嵌入式使用，而不是自下而上的 API 采用
      - - Google Agent Search
        - 每 1k 次标准查询 $1.50；每 1k 次企业查询 $4.00；存储和附加项另计费
        - 查询加存储定价，并提供可配置订阅选项
        - 覆盖网站、结构化和非结构化数据的搜索应用，并带生成式答案
        - 高级附加项和可配置模型带来比简单 API 同业更多的定价分支
        - 买方已接受云式计量且需要企业扎根时具备竞争力
      - - AWS Kendra
        - 基础 GenAI index 每小时 $0.32 起，另收查询、存储和连接器费用
        - 预置基础设施定价
        - 内部搜索索引、retrieve/query API 和托管连接器
        - 即便尚未重度使用，成本也会随预置容量扩张
        - 更适合作为内部知识 RAG 成本基准，而不是直接外部搜索价格对比
      - - Azure AI Search
        - 专用和 serverless 分层，agentic retrieval 在 Azure AI Search 下计费；页面展示分层结构，而不是简单标价
        - 基于容量的搜索服务定价
        - 混合检索、索引和 agentic-retrieval 操作
        - 实际按地区价格需要计算器或报价上下文
        - 不利于开发者快速比较，但企业云买方熟悉这种模式
    notes: 该领域的公开定价高度分散；有的供应商按调用收费，有的按 credit 收费，有的按席位收费，也有的按云容量收费，因此定价背后的影响比标价本身更重要。
