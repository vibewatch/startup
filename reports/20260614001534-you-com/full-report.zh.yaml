  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以证据质量为中心，而不是围绕单一可比倍数，给出示意性的悲观、基准和乐观估值区间。
    data:
      items:
        - label: 悲观
          low: 0.8
          value: 1
          high: 1.2
          unit: $B
        - label: 基准
          low: 1.2
          value: 1.5
          high: 1.8
          unit: $B
        - label: 乐观
          low: 1.8
          value: 2.2
          high: 2.6
          unit: $B
        - label: PW 中心值
          low: 1.35
          value: 1.5
          high: 1.7
          unit: $B
    approximationNotes: 这些是情景区间，不是按模型估值输出。由于公开收入、利润率和留存输入不可得，区间刻意拉宽。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
