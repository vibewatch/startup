      - number: '2.4'
        title: 增长驱动、约束，以及 You.com 所处位置
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动是结构性的。代理工作流越来越需要新鲜引用、页面级访问和语境丰富的输出，而不是蓝色链接；基础 RAG 研究和厂商文档都把 grounded search
              视为解决幻觉和知识陈旧的答案，进一步强化了检索的技术逻辑。预算所有者也在寻找生产力和准确性收益，而不只是 AI
              新鲜感，这解释了为什么企业支出正在流入经常性软件科目。约束同样重要。连接器、权限和治理仍是部署瓶颈；DIY RAG 仍需要实质系统和 ML
              人才；买家也越来越想要多模型可选性，避免锁定单一供应商。与此同时，基础检索的价格带已经很紧，品类里挤满了 hyperscalers、企业工作 AI 平台和 API-first 厂商。这让 You.com
              处在一个合理但并非牢不可破的位置：公开证据指向它在外部网页 grounding 和更高层研究工作流上的差异化切口，但公开证据仍无法隔离出清晰的 SAM、利润率画像，或足以在缺少客户级尽调时承销的持久护城河。
