      - number: '8.3'
        title: 多头、基准和空头情景
        blocks:
          - type: paragraph
            body: >-
              You.com
              不披露收入、毛利率或留存，因此用情景法比给单点估值更诚实。空头情景假设，大部分经济价值落在日益商品化的检索里，而不是有防御力的工作流软件里。在这个世界里，公司仍有真实技术和客户相关性，但市场会折价看待不透明集中度、支持负担和供应商依赖；这指向约
              $0.8 billion 到 $1.2 billion 的区间。基准情景假设 Series C 标记大体守住，因为企业工作流、金融研究和私有数据部署都是真实的，但公开经济性仍太薄，不足以支撑 Glean
              式溢价。这导向约 $1.2 billion 到 $1.8 billion 的区间。多头情景需要远多于今天的公开故事：私下尽调必须证明强 ARR、耐久留存、健康毛利率，以及查询量声明背后分散的大客户。只有到那时，约
              $1.8 billion 到 $2.6 billion 的区间才说得通。换句话说，当前轮次已经计入了有意义的上行；公开证据主要支持基准情景，而不是多头情景。
