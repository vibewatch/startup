        title: 规模标记、产品转向和概览层面的风险背景
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模标记不是收入，而是用量。Series C 材料称 API 现在每月处理超过 10 亿次查询；此前 Series B 文章已经声称累计 10 亿次查询，并称自 2024 年 1 月以来 ARR 增长
              500%。这些信号有意义，但大多仍来自公司自述，需要谨慎处理。独立报道确实确认了战略转向：TechCrunch 2024 年报道称，在简单查询上对抗 Google 已经徒劳，因此 You.com
              转向更高端、更难的研究和生产力任务，在这些场景里引用和编排更重要。客户故事也支持这一叙事，因为它们集中在 NIH 研究工作流、Maryville 学生成果、Mimecast GTM 生产力、dpa
              新闻编辑室发现，以及与 Harvey 和 DuckDuckGo
              的具名关系。同一组证据也暴露了主要概览风险。分发仍不如产品质量有证明力，一些关键指标仍为自报，员工数未披露，公开治理页面也尚未完全跟上最新领导层变化。
