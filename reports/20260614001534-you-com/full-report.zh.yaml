              tone: negative
              detail: 竞争会同时挤压定价和产品定位。
            - label: 中
              tone: warning
              detail: 企业交易和市场渠道提供了一定分散度。
            - label: 高
              tone: negative
              detail: 只有披露利润率和续约情况，剩余暴露才会下降。
        - label: 客户集中度不透明
          values:
            - label: 中高
