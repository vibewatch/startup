      - number: '7.3'
        title: 商业化风险来自价格压力、证明集中，以及仍在成形的收入模型
        blocks:
          - type: paragraph
            body: >-
              承销问题不再是 You.com 有没有人想用的产品，而是公司能否在更大平台压缩品类之前，把需求转成耐久且分散的经济性。TechCrunch 2023 年和 2024
              年报道像是在公开记录中呈现一场战略转向：先是一家探索私人广告的消费者搜索公司，后来变成一家生产力和企业公司，同时承认聊天里的广告仍未解决。这个转向可能合理，但也抬高了执行门槛，因为公司现在试图同时服务自助
              API、市场、嵌入式平台渠道和企业项目。定价有两面性。公开价格表足够有吸引力，可以赢下开发者；但它也在多个产品面上设定了激进预期，而这些产品可能依赖昂贵的上游模型和检索基础设施。竞争并不抽象。OpenAI
              在更大的 API 平台里把网页搜索作为工具出售，Google 用合规功能推广 grounded enterprise search，Brave
              则销售带引用的搜索和企业支持。与此同时，客户证明仍集中在少数打磨过的故事里——NIH、Maryville、Mimecast、DPA、HanseMerkur、Wort & Bild——再加上公司撰写的 Series
              C 文章，点名大型 API 客户却不披露支出、续约或集中度。这足以证明相关性，但不足以让人靠信念承销耐久性。
