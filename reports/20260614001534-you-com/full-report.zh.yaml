      - number: '2.3'
        title: 买家、用户和预算归属
        blocks:
          - type: paragraph
            body: >-
              这个品类的买家地图分成企业平台所有者和开发者主导团队两类。企业买家想要跨 SharePoint、Salesforce、Jira 和内部文档等系统做安全、权限感知的检索，因此 Glean、Azure AI
              Search 和 Google Agent Search 都强调连接器、治理和企业数据控制。在这些案例里，买家可能是 CIO、知识平台负责人、支持平台所有者或 AI enablement
              团队；用户是员工、分析师、支持客服或下游内部 copilots；付款方通常是经常性软件或云预算。开发者主导买家不同。OpenAI、Exa、Tavily、Brave 和 You.com
              都把搜索作为可编程组件，卖给聊天机器人、编码助手、研究代理和有网页依据的应用；这意味着第一笔采购可以从工程或产品预算开始，只有工作流证明价值后才扩张。对 You.com 来说，关键含义是它横跨两种动作。它的
              API 定价和 benchmark 材料瞄准自下而上的 builders，但其规模声称、垂直索引和企业定位，又暗示后续会向更高价值工作流上移。
