  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户原型很宽，但公开证明分裂为深度企业故事和渠道主导的 API 分发
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一条双轨客户故事。一条是典型企业部署：You.com 向重视引用、私有数据和工作流专用代理的机构销售服务更重的情报栈。NIH、Maryville、Mimecast、dpa、HanseMerkur 和
              Wort & Bild 都落在这个桶里，尽管各账户的证明深度差异很大。第二条是平台分发：You.com 也销售 API 和搜索基础设施，经由 MCP、GPT
              OSS、Vercel、Zapier、MindStudio 和云市场界面流动。这把买家宇宙从中央 IT
              团队和知识工作负责人，拓宽到开发者、产品团队，以及可能永远不会购买独立席位产品的合作伙伴生态。关键承销细节是，买家、用户和付款方经常不同。Maryville 领导层和教师治理 rollout，学生消费产品；NIH
              IT 赞助使用，研究人员和承包商实际使用；Mimecast 为业务团队集中选择产品；GPT OSS 或 Remy 这样的伙伴渠道，则可能把 You.com
              嵌进其他产品。这让客户基础比简单的企业搜索标签更宽，但也意味着单靠公开数据很难读出商业结构。
