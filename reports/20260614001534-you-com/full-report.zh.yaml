  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入和 ARR 结构
        - 按搜索、内容、研究、金融和企业解决方案拆分的过去十二个月收入或 ARR
        - 需要区分工作流软件业务和低价值检索层。
        - 索取月度收入桥和产品级 bookings / ARR 明细表。
      - - 按产品拆分的毛利率
        - 按 SKU 拆分的毛利率、云成本、数据授权成本和支持负担
        - 判断高端工作流是否真的创造软件式经济性。
        - 审阅产品 P&L 和服务成本分析。
      - - 留存和集中度
        - 头部客户占比、GRR、NRR、合同期限，以及按账户拆分的工作负载结构
        - 没有耐久性和分散化，每月 >1B 查询量这个标题还不够。
        - 索取前 10 大客户明细、cohort 表和续约历史。
      - - 股权结构和清算优先权条款
        - Series C 周围的清算优先权、二级交易、按比例认购权和任何结构化条款
        - 标题估值不等于普通股吸引力。
        - 索取当前 cap table、term sheets 和董事会批准的融资备忘录。
      - - 现金和 runway
        - 当前现金余额、月度 burn、招聘计划，以及基准 / 下行情景 runway
        - 区分可选增长资本和未来融资依赖。
        - 审阅现金桥和 24 个月运营计划。
      - - 运营验证
        - 支持指标、正常运行时间或事故历史，以及聚焦部署稳定性的客户访谈
        - 信任和支持质量同时影响留存和支付高端价格的意愿。
        - 索取 SLA dashboards、事故日志，并与规模化客户做 reference calls。
    notes: 这些要求按最能改变估值置信度的程度排序，而不是按最容易拿到的程度排序。
