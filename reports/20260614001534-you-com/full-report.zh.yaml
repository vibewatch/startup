    rows:
      - - You.com
        - 网页扎根与研究平台
        - 公司称月 API 查询量超过 1B；自助服务和企业入口均已上线
        - 构建 Agent 的开发者，以及需要带引用研究工作流的企业
        - 组合网页搜索、深度研究、金融研究、模型无关编排和私有数据连接器
        - 核心规模和基准测试主张仍主要来自公司自身，实际企业定价未披露
      - - Perplexity
        - 答案引擎与搜索 API 同业
        - 官方文档披露原始搜索、Sonar 和 Agent 工具定价
        - 需要带引用答案或答案引擎能力的开发者和团队
        - 在带引用答案 UX 和 API 变现上与 You.com 高度重叠
        - 公开文档对定价的呈现，比对企业私有数据工作流深度的呈现更清晰
      - - Exa
        - API 优先的搜索与研究同业
        - 公开端点覆盖搜索、内容、答案、研究和 Agent 工作流
        - 把实时网页检索或研究嵌入应用的开发者
        - 开发者定位清晰，端点价格和研究工作流明确
        - 公开证据最强的是 API 界面和定价，而不是企业分发
      - - Tavily
        - Agent 搜索工具包同业
        - 搜索、提取、爬取、映射和研究 API 按 credits 销售
        - 构建懂网页的 Agent 和研究工作流的团队
        - 网页工具工作流覆盖面广，credit 模型透明
        - credit 定价清楚，但企业安装基数和差异化分发不公开
      - - Brave Search API
        - 独立索引搜索同业
        - 声称索引 30B+ 页面，提供答案 API、AWS Marketplace 上架和企业隐私姿态
        - 希望直接访问独立网页索引的开发者和企业
        - 自有索引、零数据留存叙事和强性价比故事
        - 产品界面在搜索上更强，在完整企业私有数据编排上较弱
      - - Glean
        - 企业工作 AI 既有玩家
        - 100+ 连接器、嵌入式工作流界面和 Enterprise Flex 席位打包
        - 在内部系统中标准化 AI 的知识工作者和企业
        - 靠企业数据、权限和嵌入式应用体验分发
        - 公开定价偏打包口径，实际合同经济性不透明
      - - Google Agent Search
        - 超大云厂商企业检索既有玩家
        - Search Enterprise 定价、网站 / 非结构化 / 结构化搜索，以及基于企业数据的扎根
        - 已在 Google Cloud 上构建，或需要网站加内部数据搜索的企业
        - Google 质量检索、引用、行业版本和云分发
        - 企业数据控制更强，低摩擦自助式网页搜索采用更弱
      - - Azure AI Search
        - 超大云厂商企业检索既有玩家
        - 混合搜索、向量存储行为、通过 Microsoft 工具获得的 80+ 连接器路径，以及分层定价模式
        - 在 Microsoft 云、数据和身份栈上标准化的企业
        - 深度接入 Microsoft 生态，并主打 Agentic retrieval 定位
        - 公开页面更强调分层和企业部署，而不是简单的按调用价格对比
      - - AWS Kendra
        - 托管式企业搜索既有玩家
        - GenAI 和企业索引版本，分别收取查询、存储和连接器费用
        - 已在 AWS 内部的内部知识搜索和 RAG 构建者
        - 成熟的基础设施式打包，连接器经济性明确
        - 相比 You.com 或 Brave，不太明显为低摩擦外部网页扎根用例优化
      - - 用 gpt-oss 加工具自建
        - 自建替代方案
        - 开放权重模型可在本地或自有基础设施上运行，并可接入网页搜索工具
        - 由工程牵头、优化控制权、定制化或成本结构的团队
        - 避免供应商锁定，并可按具体工作流调优
        - 需要集成工作、评估纪律和持续运营；产品供应商把这些抽象掉了
      - - Harvey
        - 垂直工作流替代方案
        - 公司网站声称获得顶级律所和企业内部法务团队信任，覆盖 20+ 专业领域、142,000+ 用户和 1,500+ 家律所
        - 法律和专业服务团队
        - 掌握高价值专家工作流，而不只是检索层
        - 领域范围比横向搜索或研究平台更窄
