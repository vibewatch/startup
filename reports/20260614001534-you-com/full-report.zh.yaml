  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式明显是混合型，不是单 SKU API 故事
        blocks:
          - type: paragraph
            body: >-
              当前公开足迹支持的是混合变现模式，而不是纯搜索 API utility。最清晰的可见收入流是自助开发者用量：You.com 定价页列出按次调用的网页搜索定价、按页计费的 contents 定价、成本较低的
              research tier，以及价格高得多的 finance research tier。但公司卖的并不只是一个计量端点。Series B 和 Series C 材料、enterprise-solutions
              页面以及 2025-2026 产品更新显示，至少有四条重叠变现路径：基础检索 API、高级研究 API、Team
              或协作式产品，以及绑定私有数据集成的企业定制代理部署。这一点重要，因为它提高了收入可选性，但也让收入确认分析更复杂。用量计费、按席位导向的协作计划和定制企业项目，很可能按不同节奏确认收入，并带来不同毛利率。公开来源让我们看见菜单，却看不见结构。因此，最稳妥的财务框架是：You.com
              已经大幅拓宽可销售界面，但投资人仍无法判断收入中有多少来自商品化搜索，又有多少来自更高价值的工作流产品或服务。
