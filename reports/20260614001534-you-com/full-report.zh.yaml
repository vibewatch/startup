      - 主要买方 / 用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - Web Search API
        - 开发者、agent 构建者、搜索驱动应用
        - 已上线核心产品
        - 在一个界面中提供低延迟网页 grounding，包含 snippets、metadata 和 news
        - 需要独立 uptime 和大客户留存数据
      - - Contents API
        - RAG 构建者、监控团队、agent pipelines
        - 已上线附加产品
        - 无需自建爬取 / 解析栈，就能返回干净的 markdown 或 HTML 及 metadata
        - 无公开抽取失败率、覆盖统计或滥用控制
      - - Express API
        - 需要一次调用即可获得有来源支撑答案的应用
        - 2025 年商业化推出
        - 把搜索、答案和引用打包进一次请求，减少编排工作
        - 公开披露的答案路由、模型选择和错误处理信息较薄
      - - Deep Search
        - 需要精确段落的 agents 和 copilots
        - 已可见推出的早期访问能力
        - 用页面抓取、高亮和 fuzzy-match 验证来检索已验证摘录
        - 未发现独立基准或大规模生产部署数据
      - - Research API / ARI
        - 分析师、咨询顾问、企业知识工作者
        - 有意义的商业化界面
        - 跨数百个来源做带引用的多步骤研究，并输出精修结果
        - 多数性能比较由公司自编，且绑定特定工作负载
      - - Finance Research API
        - 金融分析师、尽调和市场研究工作流
        - 新产品，但战略价值高
        - 在研究编排之上叠加授权结构化数据和证据仲裁
        - 依赖第三方授权数据且 latency 长，可能压缩利润率
      - - 企业情报栈
        - IT、运营和部署私有数据 agents 的职能团队
        - 高接触度企业产品
        - 私有 RAG、定制 agents、模型无关路由、连接器和 onboarding 支持
        - 需要更清晰的安全架构、SLO 和实施工作量公开细节
    notes: 行把成熟的核心 grounding 界面与更新的专业层、高接触层分开；成熟度判断只依赖 2024-2026 年公开证据。
