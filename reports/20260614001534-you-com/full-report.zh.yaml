      - number: '5.2'
        title: 架构强调检索编排、引用保真，以及按用例路由的专门化
        blocks:
          - type: paragraph
            body: >-
              公开技术材料持续把 You.com 描述成覆盖多种检索模式的编排层，而不是单体模型公司。架构从对实时网页、垂直索引和企业私有数据的采集与索引开始，然后根据任务把请求路由到不同检索路径。Fast search
              返回上下文 snippets；Contents 抓取干净的页面文本；Express 把搜索和答案打包进一次调用；Research 和 ARI 跑更深的多步骤综合；Finance Research
              则把开放网页替换成针对金融优化、并由授权和机构数据增强的索引。公开材料中技术差异化最强的组件是 Deep Search。公司称它会并行抓取页面，运行基于 LLM 的 highlighter，再通过 fuzzy
              matching 验证返回段落是否真实出现在页面上。这个设计选择值得注意，因为它明确瞄准 agentic retrieval 系统最大的失败模式：有说服力但 grounding
              薄弱的摘录。栈的其余部分遵循类似逻辑。RAG
              被描述为先检索再生成，引用贯穿研究界面，产品更新也反复把快速答案路径与更慢但更深的研究路径分开。架构上行空间在于跨延迟和深度的灵活性；下行是运营复杂度：更多检索界面、更多排序逻辑、更多模型路由决策，也有更多端点之间成本或质量漂移的机会。
