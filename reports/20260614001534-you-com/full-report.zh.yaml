      - number: '3.3'
        title: 定价、包装和分发权力解释了为什么市场显得拥挤
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开定价信号是，基础外部 grounding 已经聚集到一个窄区间。You.com 标价为每 1,000 次网页搜索调用 $5，Brave 的 answered search 为每 1,000 次请求
              $4，Exa 的 search 为每 1,000 次请求 $7，Perplexity 文档列出 raw search 每 1,000 次请求 $5。Tavily 使用 credits 而不是
              requests，但它的定价仍可换算成透明的 pay-as-you-go 费率。这个价格聚集很重要，因为它说明原始检索正在变成 utility，而不是持久护城河。因此，厂商都在向上游栈推进。You.com
              以明显更高价格销售 research endpoints，Exa 把 deep-search 和 agent workflows 定价在基础搜索之上，Perplexity 增加 Sonar 和
              agent/tool 定价层。Glean 把包装迁移推得更远，把企业搜索、chat、agent runs 和 embedded experiences 捆进按席位的 Enterprise Flex 权益与超额
              credits 中。Hyperscalers 追求另一种模型：Google 和 AWS 给出明确的基础设施式查询和存储定价，而 Azure 当前定价页围绕 tier 选择、search units 和
              agentic-retrieval activity 组织，而不是像消费搜索账单那样计费。分发会放大这些差异。Glean 嵌入 Slack、Teams、GitHub、Zoom
              和服务平台；Google、Microsoft 和 AWS 紧贴更广的云和身份资产；DuckDuckGo 拥有终端用户搜索分发；Brave 通过 AWS Marketplace
              获得可见渠道界面。相比之下，You.com 的公开分发优势更偏产品驱动，而非生态锁定。只要性能和工作流深度能持续吸引买家，这条路可以成立；但价格压力和 incumbent 捆绑应被视为基本假设，而不是被轻易忽略。
