      - number: '2.2'
        title: 受证据约束的规模测算和变现视角
        blocks:
          - type: paragraph
            body: >-
              公开数据不足以为 You.com 支撑一句干净的 TAM 表述，因此更稳妥的做法是使用多个受约束的视角。最宽一层，Andreessen Horowitz 报告称 2023 年企业生成式 AI 平均支出为 $7
              million，并预期 2024 年该支出约增长 2 到 5 倍；同时，少于四分之一受访企业预期资金会继续来自创新预算。这一点重要，因为它意味着品类正在转向经常性软件归属，而不只是实验性试点。BVP
              提供第二个视角，展示价值已经如何流经 AI 栈：基础模型公司在 2023 年融资 $23 billion，而垂直 AI 初创公司的年度合同价值已经达到传统垂直 SaaS 的约 80%，且增长约
              400%。这些信号是需求背景，不是 You.com 的 TAM。变现方面，公开厂商定价比公开市场规模更清楚。基础搜索访问目前集中在一个窄区间——Brave 每 1,000 次答案请求约 $4，You.com 每
              1,000 次网页搜索调用 $5，Exa 每 1,000 次搜索请求 $7——而更深的答案和研究工作流售价更高。这个价格带说明，You.com
              的上行空间较少来自商品化检索，更多取决于能否说服买家为工作流级结果付费。
