        - 公开曾释放信号，但当前官方席位定价未在 API 定价页清晰呈现
        - 若规模可观，可提升收入耐久性，但当前可见度弱
        - 证据通过公司和媒体来源间接获得
        - 索取当前席位定价、活跃席位数和按套餐拆分的留存
      - - 企业定制 agents 与私有数据部署
        - 定制构建、私有 RAG、集成和定制工作流交付
        - 定制 / 基于合同
        - 支撑更大的 ACV，但会引入服务和部署复杂度
        - 官方叙事很强；无公开合同经济性
        - 索取服务收入占比、实施工作量，以及按账户拆分的投产时间
