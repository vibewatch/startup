  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: You.com 最高的剩余风险集中在法律合规负担、模型依赖和商业化不透明；公开缓释措施已经可见，但仍有一部分由营销叙事驱动。
