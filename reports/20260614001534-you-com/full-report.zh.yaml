      - number: '3.4'
        title: 护城河耐久性取决于拥有工作流，而不只是拥有一次搜索调用
        blocks:
          - type: paragraph
            body: >-
              You.com 最强的公开论据，不是它没有竞争，而是它试图逃离最商品化的一层。企业页面、ARI 发布和 Finance Research API
              都显示，公司正从网页搜索推向更高价值、带引用、多步骤的研究工作流，并把公开和私有数据结合起来。这个策略合理，因为纯搜索层看起来脆弱。公司自述的 benchmark 可以解释 You.com
              希望外界如何看它，但单靠 benchmark 不能证明相对直接同行有持久优势。与此同时，incumbent 压力是结构性的：Glean 和 hyperscalers
              更靠近身份、数据和采购层，而这些层决定企业搜索能否粘住。替代威胁同样是结构性的。Harvey 说明，垂直工作流工具可以吸收本来可能流向横向研究平台的预算；gpt-oss 和工具 API
              也降低了企业内部搭建定制代理的成本。因此，公开证据支持一个更细的护城河判断。买家想要一个平台，把当前网页 grounding、引用、模型选择和可配置企业工作流混在一起时，You.com
              看起来最强；如果买家已经有可信内部数据基础设施、垂直应用完全占住用户工作流，或工程团队愿意自己组栈，You.com 就弱一些。主要尽调障碍不是不知道有竞争者，而是缺少公开的
              win-loss、实际定价和渠道经济数据，无法判断 You.com 的切口是否真正转化为持久企业权力。
