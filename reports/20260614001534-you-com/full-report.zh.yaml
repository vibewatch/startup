companyProfile:
  summary: >-
    You.com 是一家私营 AI 搜索与研究基础设施公司，由 Richard Socher 和 Bryan McCann 于 2020 年创立。公司起步时是 AI 原生搜索挑战者，如今定位成企业 AI 基础设施，围绕有网页依据的
    API、私有数据检索、高级研究工作流和定制企业部署搭建产品。公开证据支持 Palo Alto 总部锚点，以及更广的多地运营足迹；2025 年公司完成真实的 $100 million Series C，估值 $1.5
    billion；在机构、企业和 API 平台场景中也有实质客户证明。但关键经营指标仍然稀疏。
