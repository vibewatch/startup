        title: 标价和公开 traction 是真实信号，但不是实际经济性
        blocks:
          - type: paragraph
            body: >-
              标价栈现在已经足够可观察，可以对收入质量说些有用的话。基础网页搜索定价为每 1,000 次调用 $5，内容抽取为每 1,000 页 $1，更高价值的研究产品价格大幅上台阶；公开页面文本显示 research
              tier 为 $12，finance-research SKU 为
              $110。这个价差方向上是好事，因为它说明公司试图变现推理深度和工作流价值，而不只是廉价检索。限制同样重要：同一价格页宣传批量折扣和年度节省，所以标价是天花板，不是实际净费率披露。公开 traction
              指标也大多来自公司自述。Series C 文章称每月 API 查询超过 10 亿次，前一年构建了 100,000+ 个代理；Series B 文章称自 2024 年 1 月以来 ARR 增长
              500%。这些是有意义的需求信号，但没有显示绝对 ARR、cohort 质量或续约行为。NIH、Maryville 和 Mimecast
              的客户故事展示了强工作流价值，却没有披露合同规模、部署范围或扩张行为。从财务角度，证据支持产品市场相关性和变现宽度，但还不足以证明持久经常性收入质量。
