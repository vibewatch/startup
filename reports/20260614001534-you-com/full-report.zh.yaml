      - number: '7.2'
        title: 模型供应商依赖和可靠性不透明，最可能把风险传导成客户痛点
        blocks:
          - type: paragraph
            body: >-
              核心经营风险不是 You.com 今天没有模型或功能，而是太多体验仍压在交易对手和难以观察的运行质量上。隐私政策点名 OpenAI、Anthropic 和 Google 作为 LLM 供应商，条款又明确说第三方
              API 可能以不合理条件消失。这不是理论上的样板条款。Trustpilot 投诉已经指向供应商施加的请求限制，GPT OSS 文档也让 You.com
              成为另一平台浏览器工具的后端。与此同时，公司自己的幻觉和延迟指南承认了投资人担心的同一组运营事实：幻觉没有被消除，监控仍然重要，下游依赖可能主导延迟和故障表现。公司确实宣传零留存、SOC 2
              和基准测试胜出，但这些信号大多仍由公司自己撰写。关于 uptime
              承诺、事件历史、复盘纪律或连接器权限治理，独立公开证据很少。换句话说，信任故事在商业上有用，但剩余敞口仍然像是模型路由、配额管理和运营支持质量都可能在公司证明机构级可靠性之前先被客户看见。
