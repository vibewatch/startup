  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面多层展开，横跨快速 grounding、深度研究和企业代理交付
        blocks:
          - type: paragraph
            body: >-
              2026 年 You.com 最重要的产品技术事实，是它已经不再只卖一件东西。公开界面横跨快速网页
              grounding、页面抽取、长篇研究、金融专用研究，以及服务更重的企业代理部署。自助侧，文档和定价页展示了离散的 Search、Contents、Research 和 Finance Research
              界面；release notes 又增加 Express，用于单次调用的 grounded answering，以及用于已验证 snippet retrieval 的 Deep
              Search。企业侧，You.com 销售更宽的情报栈，把私有数据、实时网页结果、模型路由和应用层交付结合起来。这一点重要，因为公司正试图用一个架构捕获多种 jobs：给代理用的低延迟搜索、RAG
              pipelines 的检索材料、供分析师和高管使用的长周期综合，以及面向企业团队的私有数据助手。工作流证据也与这套栈一致。NIH 使用引用密集型研究，Maryville
              在学术工作流中使用多模型定制代理，Mimecast 使用共享代理提升 GTM 生产力。实际承销读法是：产品宽度真实存在，但它抬高了执行门槛，因为 You.com
              必须同时维护多个可靠性和成本边界，而不是一个范围狭窄的搜索 API。
