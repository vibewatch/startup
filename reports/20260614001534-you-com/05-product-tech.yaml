  evidenceGaps:
    - type: missing-source
      severity: material
      topic: uptime-sla
      missingEvidence: Independent uptime history, public status reporting, or signed SLO/SLA detail for the API and enterprise surfaces.
      whyItMatters: Reliability is central to the investment case because the company sells infrastructure for agents and enterprise workflows, not just a consumer app.
      diligencePath: Request enterprise MSAs, SLA schedules, uptime dashboards, and postmortem history by endpoint.
      relatedQuestionRefs:
        - QE020
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: security-architecture
      missingEvidence: Detailed architecture for model routing, data isolation, connector permissions, key management, and incident response beyond marketing-level claims.
      whyItMatters: Security and privacy posture likely drives enterprise adoption, but the public record does not show enough technical depth to validate the strongest trust claims.
      diligencePath: Request a security briefing, control matrix, architecture diagrams, and the latest SOC 2 report plus penetration-test summaries.
      relatedQuestionRefs:
        - QE025
        - QE026
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: dependency-concentration
      missingEvidence: Revenue, usage, and performance concentration by third-party model provider, licensed-data supplier, and major connector or SDK ecosystem.
      whyItMatters: The platform depends on outside models, data, and integration surfaces that can change pricing, availability, or terms.
      diligencePath: Request supplier concentration analysis, fallback-provider design, and gross-margin sensitivity by model and data source.
      relatedQuestionRefs:
        - QE019
        - QE026
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: material
      topic: benchmark-independence
      missingEvidence: Independent third-party evaluations that reproduce benchmark quality, latency, and security claims across customer-like workloads.
      whyItMatters: Most current proof of superiority is authored or curated by the company, which is informative but not sufficient for full underwriting confidence.
      diligencePath: Run customer-side bakeoffs against target workloads and request third-party benchmark participation or referenceable evaluation partners.
      relatedQuestionRefs:
        - QE017
        - QE025
      relatedTableRefs:
        - TE005
