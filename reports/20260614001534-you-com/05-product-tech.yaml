tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary buyer / user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Web Search API
        - Developers, agent builders, search-powered apps
        - Fielded core product
        - Low-latency web grounding with snippets, metadata, and news in one surface
        - Need independent uptime and large-customer retention data
      - - Contents API
        - RAG builders, monitoring teams, agent pipelines
        - Fielded add-on product
        - Returns clean markdown or HTML plus metadata without custom crawl/parsing stack
        - No public extraction-failure rates, coverage stats, or abuse controls
      - - Express API
        - Apps needing one-call grounded answers
        - Commercially launched in 2025
        - Packages search plus answer plus citations in a single request to reduce orchestration work
        - Public disclosure on answer routing, model choice, and error handling is thin
      - - Deep Search
        - Agents and copilots needing precise passages
        - Early-access capability with visible rollout
        - Verified excerpt retrieval using page fetches, highlighting, and fuzzy-match verification
        - No independent benchmark or broad production deployment data was found
      - - Research API / ARI
        - Analysts, consultants, enterprise knowledge workers
        - Meaningful commercial surface
        - Multi-step research with citations across hundreds of sources and polished outputs
        - Most performance comparisons are company-authored and workload-specific
      - - Finance Research API
        - Financial analysts, diligence and market-research workflows
        - New but strategically high-value surface
        - Licensed structured data plus evidence arbitration on top of research orchestration
        - Reliance on third-party licensed data and long latencies may constrain margins
      - - Enterprise intelligence stack
        - IT, operations, and functional teams deploying private-data agents
        - High-touch enterprise offer
        - Private RAG, custom agents, model-agnostic routing, connectors, and onboarding support
        - Need clearer public detail on security architecture, SLOs, and implementation effort
    notes: Rows separate mature core grounding surfaces from newer specialist or high-touch layers; maturity judgments rely only on public 2024-2026 evidence.
