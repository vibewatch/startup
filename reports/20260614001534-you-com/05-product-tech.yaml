callouts:
  - calloutType: strength
    title: 'Strength: You.com has built a genuine multi-surface grounding stack'
    body: The company now offers distinct products for quick search, full-page extraction, verified snippets, long-form research, and finance-grade analysis instead of forcing every workload through one generic endpoint.
    claimRefs:
      - CE001
      - CE016
      - CE017
      - CE018
      - CE022
  - calloutType: insight
    title: 'Insight: the moat is orchestration and workflow fit more than a single model breakthrough'
    body: Public evidence consistently points to routing, citations, private-data blending, and endpoint specialization as the core product value, which is strategically sensible in a market where foundation models and retrieval tools keep commoditizing.
    claimRefs:
      - CE007
      - CE012
      - CE021
      - CE028
      - CE031
  - calloutType: risk
    title: 'Risk: trust messaging is ahead of public systems disclosure'
    body: Zero-data-retention and compliance claims are commercially important, but public materials still do not expose enough architecture, uptime, or incident detail to fully underwrite enterprise operating risk from the outside.
    claimRefs:
      - CE039
      - CE040
      - CE042
  - calloutType: recommendation
    title: 'Diligence focus: test endpoint-by-endpoint quality and dependency concentration'
    body: Management should be pressed on model-routing economics, connector support burden, security control implementation, and the degree to which finance and deep-research differentiation depends on third-party inputs that could get more expensive or less exclusive.
    claimRefs:
      - CE022
      - CE039
      - CE040
      - CE043
      - CE046
