  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Acquisition and indexing layer
        - Continuously gathers public web data, vertical indexes, and private enterprise data
        - Needs crawl freshness, connector health, and source permissioning
        - Coverage gaps or stale ingestion degrade every higher layer
      - - Search and ranking layer
        - Returns snippets, metadata, and result sets for fast grounding
        - Depends on ranking quality, freshness, and query routing
        - Compressed market pricing makes quality deltas hard to sustain commercially
      - - Content extraction layer
        - Fetches full page text or markdown for downstream models
        - Depends on webpage accessibility, parsing, sanitization, and anti-bot resilience
        - Extraction failures or noisy content can pollute RAG pipelines
      - - Verified excerpt layer (Deep Search)
        - Finds answer passages and checks that quoted text really exists on source pages
        - Depends on parallel fetch orchestration, highlighting quality, and verification logic
        - If verification is weak, the claimed hallucination advantage narrows quickly
      - - Research orchestration layer
        - Runs multi-step search, source reading, synthesis, and citation mapping
        - Depends on model quality, cost discipline, and source reconciliation
        - Long-running workflows can become expensive and hard to debug across endpoints
      - - Enterprise data and delivery layer
        - Connects private data, SDKs, MCP surfaces, and end applications
        - Depends on permissions, partner APIs, SDK compatibility, and support operations
        - Connector sprawl and third-party platform changes can break customer workflows
    notes: Models the public stack as a retrieval-and-orchestration system rather than a single endpoint.
