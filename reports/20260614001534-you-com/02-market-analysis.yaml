- id: evidence-constrained-sizing-and-monetization
  title: Evidence-constrained sizing and monetization lenses
  body: 'Public data does not support one clean TAM statement for You.com, so the safer approach is to use multiple constrained lenses. At the broadest layer, Andreessen Horowitz reported average enterprise generative-AI spend of $7 million in 2023 and expected that spend to grow roughly twofold to fivefold in 2024, while fewer than a quarter of surveyed enterprises expected that money to keep coming from innovation budgets. That is important because it means the category is shifting toward recurring software ownership, not only experimental pilots. BVP adds a second lens by showing how much value is already flowing through the AI stack: foundation-model companies raised $23 billion in 2023, while vertical-AI startups were already commanding about 80% of legacy vertical SaaS annual contract values and growing around 400%. Those signals are demand context, not a You.com TAM. For monetization, public vendor pricing is clearer than public market size. Base search access currently clusters in
    a narrow band—Brave at roughly $4 per 1,000 answers requests, You.com at $5 per 1,000 web-search calls, and Exa at $7 per 1,000 search requests—while deeper answer and research workflows sell at higher price points. That pricing spread suggests You.com''s upside depends less on commodity retrieval and more on convincing buyers to pay for workflow-level outcomes.'
