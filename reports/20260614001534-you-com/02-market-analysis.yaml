callouts:
- calloutType: strength
  title: Demand is real even without a clean standalone TAM
  body: Enterprise AI budgets are moving out of innovation pools, agent workflows increasingly need grounded retrieval, and application-layer buyers are showing willingness to pay for workflow software. Those demand signals make the market real even though public sources do not isolate a neat You.com TAM.
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM016
  - CM027
