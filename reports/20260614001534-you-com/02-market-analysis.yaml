  title: Base retrieval is already crowded and price-compressed
  body: Public list pricing shows only a narrow band between major API-first providers for base search access, while hyperscalers and enterprise-work AI vendors attack adjacent use cases. That means You.com probably has to win on workflow outcomes, not commodity retrieval alone.
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM032
  - CM038
- calloutType: insight
