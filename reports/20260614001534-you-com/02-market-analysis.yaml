- id: growth-drivers-constraints-and-positioning
  title: Growth drivers, constraints, and where You.com sits
  body: 'The strongest demand drivers are structural. Agent workflows increasingly require fresh citations, page-level access, and context-rich outputs rather than blue links, and the technical case for retrieval is reinforced by both foundational RAG research and vendor documentation that treats grounded search as the answer to hallucination and stale knowledge. Budget owners are also looking for productivity and accuracy gains, not just AI novelty, which helps explain why enterprise spend is moving into recurring software lines. The constraints are just as material. Connectors, permissions, and governance remain deployment bottlenecks; DIY RAG still requires meaningful systems and ML talent; and buyers increasingly want multi-model optionality so they are not locked to one provider. Meanwhile, price bands for base retrieval are already tight, and the category is crowded with hyperscalers, enterprise-work AI platforms, and API-first vendors. That leaves You.com in a plausible but not unassailable
    position: public evidence points to a differentiated wedge in external web grounding and higher-level research workflows, but public evidence still does not isolate a clean SAM, margin profile, or moat durable enough to underwrite without customer-level diligence.'
