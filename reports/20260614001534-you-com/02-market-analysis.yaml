  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to You.com
  rows:
  - - External web grounding APIs
    - Search calls, snippets, page extraction, citations, answer generation for live web workflows
    - Consumer search advertising, generic browsing traffic monetization
    - Developer platform team or product owner using usage-based API budget
    - Closest fit to You.com's public API positioning and benchmark materials
  - - Enterprise retrieval / workplace search
    - Indexing, connectors, permissions-aware retrieval, employee answer experiences
    - Generic productivity suites without search or grounding layer
    - CIO, knowledge-platform owner, AI enablement lead
    - Relevant for enterprise expansion but not You.com's clearest public wedge today
  - - Vertical research workflows
    - Higher-value domain endpoints, research agents, compliance or analyst workflows
    - Broad horizontal productivity software without search depth
    - Functional leader or platform team paying from workflow software budget
    - Relevant because You.com sells premium research-style endpoints
  - - Agent platform grounding layer
    - APIs and retrieval services that sit beneath chatbots, copilots, and autonomous agents
    - Model-only spend with no retrieval or citation layer
    - AI engineering or platform budget owner
    - Important because agents need cited and fresh retrieval, not just model tokens
  - - Consumer answer-engine UX
    - Natural-language search interface and answer rendering for end users
    - Enterprise connectors and internal permissions stacks
    - Consumer-product budget or traffic monetization owner
    - Historically related to You.com but too broad for current market sizing
  - - DIY or substitute stack
    - Legacy enterprise search, vector DB plus LLM stack, or rival search APIs
    - N/A
    - Same buyers as above
    - These alternatives compete for the same grounding and knowledge-work budget
  notes: Rows separate the broad AI and search backdrop from the narrower retrieval, grounding, and workflow spend that appears most relevant to You.com.
