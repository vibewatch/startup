tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale or adoption signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - You.com
    - Web-grounding and research platform
    - 1B+ monthly API queries claimed; self-serve and enterprise surfaces both live
    - Developers building agents plus enterprises needing cited research workflows
    - Combines web search, deep research, finance research, model-agnostic orchestration, and private-data connectors
    - Core scale and benchmark claims remain largely company-authored and realized enterprise pricing is undisclosed
  - - Perplexity
    - Answer engine and search API peer
    - Official docs expose raw search, Sonar, and agent tool pricing
    - Developers and teams wanting cited answers or answer-engine capabilities
    - Strong overlap with You.com on cited-answer UX and API monetization
    - Public docs show pricing more clearly than enterprise private-data workflow depth
  - - Exa
    - API-first search and research peer
    - Public endpoints span search, contents, answer, research, and agent workflows
    - Developers embedding live web retrieval or research into apps
    - Clean developer positioning with explicit endpoint prices and research workflows
    - Public evidence is strongest on API surface and pricing, not on enterprise distribution
  - - Tavily
    - Agent-search toolkit peer
    - Search, extract, crawl, map, and research APIs sold on credits
    - Builders of web-aware agents and research workflows
    - Broad web-tool workflow with transparent credit model
    - Credit pricing is clear, but enterprise install-base and differentiated distribution are not public
  - - Brave Search API
    - Independent-index search peer
    - 30B+ page index claim, answer API, AWS Marketplace presence, and enterprise privacy posture
    - Developers and enterprises wanting direct access to an independent web index
    - Own index, zero-data-retention messaging, and strong price-to-performance story
    - Product surface is stronger on search than on full enterprise private-data orchestration
  - - Glean
    - Enterprise work-AI incumbent
    - 100+ connectors, embedded workflow surfaces, and Enterprise Flex seat packaging
    - Knowledge workers and enterprises standardizing AI across internal systems
    - Distribution through enterprise data, permissions, and embedded app experiences
    - Public pricing is packaging-oriented and opaque on realized contract economics
  - - Google Agent Search
    - Hyperscaler enterprise retrieval incumbent
    - Search Enterprise pricing, website/unstructured/structured search, and grounding on enterprise data
    - Enterprises already building on Google Cloud or needing website plus internal-data search
    - Google-quality retrieval, citations, industry variants, and cloud distribution
    - Stronger on enterprise-data control than on low-friction self-serve web-search adoption
  - - Azure AI Search
    - Hyperscaler enterprise retrieval incumbent
    - Hybrid search, vector store behavior, 80+ connector path through Microsoft tooling, and tiered pricing modes
    - Enterprises standardizing on Microsoft cloud, data, and identity stacks
    - Deep integration with Microsoft ecosystem and agentic retrieval positioning
    - Public page emphasizes tiering and enterprise deployment more than simple call-level price comparison
  - - AWS Kendra
    - Managed enterprise search incumbent
    - GenAI and enterprise index editions with query, storage, and connector charges
    - Internal knowledge search and RAG builders already inside AWS
    - Mature infrastructure-style packaging with explicit connector economics
    - Less obviously optimized for low-friction external web-grounding use cases than You.com or Brave
  - - Internal build with gpt-oss plus tools
    - Build-it-yourself substitute
    - Open-weight models run locally or on owned infrastructure and can attach to web-search tools
    - Engineering-led teams optimizing for control, customization, or cost structure
    - Avoids vendor lock-in and can be tuned to the exact workflow
    - Requires integration work, evaluation discipline, and ongoing operations the product vendors abstract away
  - - Harvey
    - Vertical workflow substitute
    - Trusted by top law firms and in-house legal teams across 20+ professionals, 142,000+ users, and 1,500+ firms per site claims
    - Legal and professional-services teams
    - Owns a high-value expert workflow rather than only the retrieval layer
    - Narrower domain scope than horizontal search or research platforms
  enumerationScope:
    coverage: partial
    basis: Rows cover the direct peers, incumbents, substitutes, and build paths most relevant to You.com's current web-grounding and enterprise-research posture as of 2026-06-14, not every search or agent vendor in market.
  notes: The table is intentionally weighted toward decision alternatives a buyer could choose instead of You.com rather than every company adjacent to AI search.
