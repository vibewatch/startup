  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Executed enterprise contracts, discount schedules, and realized usage bills for You.com, Glean, and at least one incumbent cloud alternative.
    whyItMatters: Public list prices mix seat, query, credit, and capacity models, so underwriting margin durability or buyer friction from public pages alone is unreliable.
    diligencePath: Request three recent redacted order forms or invoices per vendor class plus internal pricing policy summaries.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Named win-loss evidence and renewal reasons versus Glean, Microsoft, Google, AWS, Perplexity, Exa, and Brave by use case.
    whyItMatters: Product positioning explains where You.com wants to compete, but not whether buyers consistently choose it or stay with it once incumbents respond.
    diligencePath: Request a trailing-12-month win-loss dashboard, five reference calls, and churn analysis segmented by developer-led versus enterprise deals.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Partner terms, channel revenue mix, and embedded-distribution economics for relationships such as DuckDuckGo, AWS Marketplace exposure, and any major enterprise embedded surfaces.
    whyItMatters: Distribution power may matter more than API quality, but public sources do not show whether channel access is durable, exclusive, or economically meaningful.
    diligencePath: Request partner agreements, channel ARR mix, and gross-margin attribution by direct versus partner-sourced usage.
    relatedQuestionRefs:
    - QP021
    - QP024
