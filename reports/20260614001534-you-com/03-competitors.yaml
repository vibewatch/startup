- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Cited web-grounding quality
    - Price compression among direct API peers
    - High
    - Base external-search pricing already clusters around roughly $4-$7 per 1,000 requests across several peers.
    - Request retention and gross-margin evidence by endpoint, especially for research products versus plain search
  - - Enterprise workflow depth
    - Glean and hyperscaler control of internal data, identity, and procurement
    - High
    - Glean and cloud incumbents sit closer to connectors, permissions, and enterprise rollout surfaces than You.com publicly does.
    - Win-loss data against Glean, Microsoft, Google, and AWS by use case and buyer persona
  - - Model-agnostic flexibility
    - Internal build using open models and hosted search tools
    - Medium-High
    - gpt-oss plus web-search tools lower the barrier to assembling a custom stack when engineering teams want control.
    - Time-to-value, maintenance burden, and total cost benchmarks versus in-house alternatives
  - - Research-agent differentiation
    - Vertical workflow products like Harvey
    - Medium
    - Specialized tools can own a high-value workflow and reduce the need for a horizontal research platform.
    - Evidence of domain-specific expansion, retention, and customer willingness to standardize on You.com beyond experiments
  - - Trust and governance posture
    - Parity trust messaging from rivals
    - Medium
    - You.com, Glean, and Brave all emphasize security or zero-data-retention style claims, reducing messaging differentiation.
    - Third-party security diligence, red-team results, and customer references where compliance won the deal
  - - Company-authored benchmark leadership
    - Benchmark narratives that are not independently reproduced
    - Medium
    - You.com's best comparative performance claims come from its own benchmark and release materials rather than neutral third-party tests.
    - Independent bake-off results, named customer references, and reproducible evaluation methodology
  notes: Severity reflects underwriting relevance from the public evidence set on 2026-06-14, not measured market share.
