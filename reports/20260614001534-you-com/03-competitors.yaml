figures:
- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: standard
  summary: Ordinal map of rival classes by direct overlap with You.com's current thesis and enterprise distribution or data-control power.
  data:
    xAxis: Enterprise distribution or data-control power (1 = limited, 10 = strongest)
    yAxis: Direct overlap with You.com's web-grounded agent and research thesis (1 = distant substitute, 10 = closest overlap)
    points:
    - label: You.com
      x: 5
      y: 9
      detail: Strong direct overlap with the thesis by definition, but less visible public distribution lock-in than the biggest incumbents.
    - label: Perplexity
      x: 4
      y: 8
      detail: Answer-engine and API overlap is high, but enterprise data-control depth is less public than incumbent stacks.
    - label: Exa
      x: 3
      y: 8
      detail: Direct developer overlap on search and research workflows with lighter public enterprise-distribution proof.
    - label: Tavily
      x: 3
      y: 7
      detail: Strong agent-search overlap with transparent toolkit packaging but limited visible distribution power.
    - label: Brave Search API
      x: 4
      y: 7
      detail: Own index and low pricing increase direct overlap, though product scope remains search-centered.
    - label: Glean
      x: 9
      y: 6
      detail: Massive enterprise-data and seat-distribution strength, but less direct overlap with pure external-web search.
    - label: Google Agent Search
      x: 9
      y: 6
      detail: High distribution through cloud and search heritage with solid overlap in grounded enterprise retrieval.
    - label: Azure / AWS enterprise search
      x: 9
      y: 5
      detail: Strong cloud distribution and private-data control, but more infrastructure-like than You.com's self-serve web-search wedge.
    - label: Internal build
      x: 2
      y: 6
      detail: Lower distribution by default, but meaningful overlap when teams assemble open models plus search tools.
    - label: Harvey
      x: 6
      y: 3
      detail: Vertical workflow substitute with domain-specific distribution rather than horizontal search overlap.
  approximationNotes: Axes are ordinal 1–10 scores derived from reviewed evidence on product overlap and distribution power, not measured market share or revenue.
