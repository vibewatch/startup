- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / class
  - Public price or unit
  - Contract model
  - Included capability
  - Discount / unknowns
  - Implication
  rows:
  - - You.com
    - $5 per 1k web-search calls; $12 per 1k research requests; $110 per 1k finance-research requests
    - Usage-based self-serve plus enterprise sales motion
    - External web search, research workflows, finance research, citations, and enterprise options
    - Realized enterprise discounts and seat economics are not public
    - Strong self-serve entry point, but margin defense likely depends on higher-value workflows
  - - Exa
    - $7 per 1k search; $12 per 1k deep search; $15 per 1k deep-reasoning search; agent requests from $0.025
    - Usage-based API pricing
    - Search, contents, answers, research, and async agents
    - Enterprise discounts and custom datasets are custom-priced
    - Clear developer comparison with You.com on pure API economics
  - - Tavily
    - 1,000 free credits monthly; pay-as-you-go at $0.008 per credit; advanced search costs 2 credits
    - Credit-based usage model with monthly plans and enterprise custom pricing
    - Search, extract, map, crawl, and research workflows
    - Translation from credits to request economics depends on endpoint and depth
    - Competitive for experimentation and agent-tool bundling, though less intuitive than per-call pricing
  - - Brave Search API
    - $4 per 1k answer requests plus token charges; search plan includes free monthly credits
    - Usage-based API with bespoke enterprise plans
    - Raw search, answers, citations, and independent-index access
    - Storage rights and large-scale terms require plan upgrades
    - Lowest visible direct answer price in this source set raises commodity price pressure on base retrieval
  - - Perplexity
    - $5 per 1k search requests; $0.005 per web_search tool call; Sonar tiers add token and request fees
    - API usage model spanning search, agents, and model layers
    - Raw search, answer-engine models, deep research, and agent tools
    - Enterprise-seat pricing exists but current chapter evidence centers on docs pricing
    - Strong overlap with You.com on external-answer and research monetization
  - - OpenAI
    - $10 per 1k web-search calls plus model-token pricing
    - Model-plus-tool pricing rather than standalone search product pricing
    - Hosted web search inside the Responses API
    - Total cost depends on model, tool frequency, and token volumes
    - Attractive as a stack component for builders, but not a turnkey enterprise search platform by itself
  - - Glean
    - Per-user Enterprise Flex seats plus pooled FlexCredits; standard thinking includes up to 100 queries per user per week
    - Seat license with usage overages for advanced AI features
    - Enterprise search, chat, agents, embedded app experiences, and APIs
    - Official docs do not publish simple public seat rates in this source set
    - Packaging favors enterprise rollout and embedded usage more than bottom-up API adoption
  - - Google Agent Search
    - $1.50 per 1k standard queries; $4.00 per 1k enterprise queries; storage and add-ons billed separately
    - Query plus storage pricing with configurable subscription option
    - Search apps over website, structured, and unstructured data with generative answers
    - Advanced add-ons and configurable model create more pricing branches than simple API peers
    - Competitive where buyers already accept cloud-style metering and want enterprise grounding
  - - AWS Kendra
    - Base GenAI index from $0.32 per hour plus query, storage, and connector charges
    - Provisioned infrastructure pricing
    - Internal search indexes, retrieve/query APIs, and managed connectors
    - Cost scales with provisioned capacity even before heavy usage
    - Better benchmark for internal-knowledge RAG cost than for direct external-search price comparison
  - - Azure AI Search
    - Dedicated and serverless tiers with agentic retrieval billed under Azure AI Search; page surfaces tier structure rather than simple list rates
    - Capacity-based search service pricing
    - Hybrid retrieval, indexing, and agentic-retrieval operations
    - Actual region-specific price requires calculator or quote context
    - Opaque for quick developer comparison but familiar to enterprise cloud buyers
  notes: Public pricing is highly heterogeneous across the field; some vendors quote per call, some per credit, some per seat, and some as cloud capacity, so implications matter more than nominal sticker price.
