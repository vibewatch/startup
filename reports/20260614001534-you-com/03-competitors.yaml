company:
  name: You.com
chapter:
  number: 3
  title: Competitors
  summary: "You.com's competitive set is broader than AI search branding suggests: direct API peers compress price on external web grounding, incumbents like Glean and hyperscalers control enterprise data access and procurement paths, and internal-build substitutes increasingly ride open models plus search tools. Public evidence supports You.com's differentiation around model-agnostic, cited, web-grounded research workflows, but the moat looks more like a moving product wedge than a settled market position because realized win rates, enterprise pricing, and channel economics remain private."
sections:
- id: landscape-and-weighting
  title: Competitive landscape and which rival classes matter most
  body: >-
    You.com should not be benchmarked only against one answer engine or one
    enterprise-search incumbent. The public product surfaces show three
    distinct competitive classes. First are direct API-first peers—Exa,
    Tavily, Brave, Perplexity, and OpenAI's web-search stack—that sell
    programmable retrieval, answer generation, or research workflows for agents
    and applications. These vendors attack the same buyer problem as You.com's
    self-serve search and research APIs: how to give an LLM current, cited,
    web-grounded context without building the retrieval layer from scratch.
    Second are enterprise incumbents and near-incumbents—Glean, Azure AI
    Search, AWS Kendra, Google Agent Search, and Elastic—that compete less on
    simple price-per-call and more on control of private data, permissions,
    indexing, governance, and procurement relationships. Third are substitutes
    that can capture the same budget without looking like search vendors at
    all, including Harvey for professional-services workflows, DuckDuckGo for
    consumer-distribution scale, and internal-build stacks enabled by OpenAI's
    gpt-oss plus hosted search tools. That framing matters because You.com no
    longer presents itself as a generic consumer search challenger;
    TechCrunch's 2024 reporting and You.com's own enterprise surfaces both show
    a move toward deeper research and productivity agents. The underwriting
    question is therefore not whether You.com has rivals—it clearly does—but
    which class exerts the most pressure on a given deal: developer adoption,
    enterprise expansion, or the decision to build internally.
