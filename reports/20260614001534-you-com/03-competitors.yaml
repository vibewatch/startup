- id: pricing-packaging-and-distribution
  title: Pricing, packaging, and distribution power explain why the market feels crowded
  body: >-
    The clearest public pricing signal is that basic external grounding is
    already clustering into a narrow band. You.com lists web search at $5 per
    1,000 calls, Brave lists answered search at $4 per 1,000 requests, Exa
    lists search at $7 per 1,000 requests, and Perplexity's docs list raw
    search at $5 per 1,000 requests. Tavily uses credits instead of requests,
    but its pricing still converts to a transparent pay-as-you-go rate. That
    price clustering is important because it suggests raw retrieval is becoming
    a utility rather than a durable moat. Vendors are therefore pushing
    up-stack. You.com sells research endpoints at materially higher prices, Exa
    prices deep-search and agent workflows above basic search, and Perplexity
    adds Sonar and agent/tool pricing layers. Glean takes the packaging shift
    even further by bundling enterprise search, chat, agent runs, and embedded
    experiences inside seat-based Enterprise Flex entitlements plus overage
    credits. Hyperscalers pursue yet another model: Google and AWS expose
    explicit infrastructure-style query and storage pricing, while Azure's
    current pricing page is framed around tier choice, search units, and
    agentic-retrieval activity rather than a consumer-like search bill.
    Distribution compounds this. Glean embeds into Slack, Teams, GitHub, Zoom,
    and service platforms; Google, Microsoft, and AWS sit next to the broader
    cloud and identity estate; DuckDuckGo owns end-user search distribution;
    and Brave gains a visible channel surface through AWS Marketplace. By
    contrast, You.com's public distribution advantage is more product-led than
    ecosystem-locked. That can work if performance and workflow depth keep
    buyers engaged, but it also means price pressure and incumbent bundling
    should be assumed rather than dismissed.
