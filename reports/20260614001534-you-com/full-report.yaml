        title: Repeat-usage proxies exist, but retention durability is still a hypothesis rather than a published KPI
        blocks:
          - type: paragraph
            body: >-
              The public evidence is good enough to say that some customers are doing more than a one-week test, but not
              good enough to underwrite classical SaaS durability. NIH's pilot expansion and Maryville's rising
              engagement are legitimate repeat-use signals. Shared-agent workflows at Mimecast and Team Plan access at
              dpa also suggest that You.com is selling something collaborative rather than purely personal. Review data
              adds another dimension: G2 is broadly positive, while Trustpilot is materially negative and heavy with
              support, billing, and reliability complaints. That divergence matters because it hints at a split between
              curated enterprise proof and messier mass-market customer experience. The enterprise trust story is
              directionally helpful—zero data retention, non-training of connected-party data, and deployment support
              all reduce enterprise objections—but the terms also acknowledge dependence on third-party APIs and
              reserved rights to change or discontinue features. The net result is that You.com appears capable of
              winning and expanding accounts, yet the public record still lacks GRR, NRR, renewal rate, average contract
