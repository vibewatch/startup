      - number: '6.3'
        title: >-
          Deployment friction is lowered by marketplaces and framework integrations, but public procurement proof trails
          the marketing narrative
        blocks:
          - type: paragraph
            body: >-
              You.com's 2026 customer motion is increasingly channel-aware. The partnerships and integration docs
              position the company not just as a seat-based AI app but as an infrastructure layer available through MCP,
              cloud marketplaces, SDKs, workflow automation, and model ecosystems. That matters commercially because
              these channels shorten time-to-value for developers and allow teams to adopt You.com without
              re-platforming. GPT OSS makes You.com the default browser-tool backend, Zapier carries the APIs into
              no-code workflows, Vercel packages search and research tools into an existing developer stack, and
              MindStudio/Remy turns web intelligence into a dependency that can be compiled into generated apps. The
              enterprise page reinforces the same message by promising low-lift go-live and white-glove onboarding. The
