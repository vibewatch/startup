      - number: '3.2'
        title: Direct peers compete on external grounding while incumbents compete on data control
        blocks:
          - type: paragraph
            body: >-
              Among the most direct peers, the clearest overlap is with vendors that expose search, answer, or research
              endpoints to developers. Exa exposes search, contents, answer, and research endpoints, Tavily exposes
              search, extract, crawl, map, and research, Brave exposes both raw search and answer APIs on its own web
              index, and Perplexity's official docs combine raw search with Sonar and agent tooling. OpenAI's web search
              belongs in this set as a substitute component, although it is packaged as a built-in tool inside the
              Responses API rather than as a dedicated search product surface. These direct peers create immediate
              pricing and feature pressure on You.com's external-web products. The incumbent side is different. Glean's
              posture is built around permission-aware enterprise retrieval, connector breadth, embedded workflow
              surfaces, and per-user Enterprise Flex packaging. Azure AI Search, AWS Kendra, and Google Agent Search
              similarly emphasize hybrid retrieval, knowledge-base management, and enterprise data access, with pricing
              models built around capacity, subscription, or infrastructure-style metering instead of simple self-serve
              web-search calls. Elastic broadens the incumbent set again by offering enterprise search and vector-search
              building blocks rather than a turnkey answer engine. The result is a two-front battle. You.com must win
              developer preference against lower-level web-grounding peers while simultaneously proving it can hold
              enterprise context, governance, and workflow depth strongly enough to avoid being displaced by Glean or
              hyperscaler-native stacks.
