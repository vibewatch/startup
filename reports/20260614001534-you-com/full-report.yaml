  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for You.com is not hard to understand. Public sources show a real product surface, not just
              a general AI wrapper: low-friction search APIs, higher-priced research and finance products, private-data
              integration, and enterprise buildouts. The customer evidence is also better than a generic early-stage AI
              story. NIH, Maryville, DPA, HanseMerkur, and Mimecast all support the idea that cited search and research
              workflows can matter in regulated or accuracy-sensitive settings, while the Series C post names API
              customers such as DuckDuckGo, Windsurf, and Harvey. Against that backdrop, a $1.5 billion Series C is not
              absurd on its face. The anti-thesis is that nearly every metric an investor actually needs for valuation
              is still hidden. The company claims more than 1 billion monthly API queries and prior ARR acceleration,
              but public sources do not reveal realized net pricing, revenue mix, gross margin, retention, or customer
              concentration. At the same time, base retrieval is already price-compressed across You.com, Brave, Exa,
              and Perplexity, and larger platforms like OpenAI and the hyperscalers can bundle retrieval into broader
              stacks. The valuation question is therefore not whether You.com is interesting. It is whether the private
              economics behind the narrative are good enough to justify paying up at the current mark.
            claimRefs:
