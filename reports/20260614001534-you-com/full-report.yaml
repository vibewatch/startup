      - number: '1.4'
        title: Scale markers, product pivot, and overview-level risk context
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale marker is not revenue but usage. Series C materials say the API now handles
              more than one billion queries per month, while the prior Series B post had already claimed one billion
              cumulative queries and 500% ARR growth since January 2024. Those are meaningful signals, but they are
              still mostly company-authored and need cautious treatment. What independent reporting does confirm is the
              strategic pivot: TechCrunch's 2024 coverage says it would have been futile to fight Google on simple
              queries, so You.com moved up-market toward harder research and productivity tasks where citations and
              orchestration matter more. The customer stories support that story because they center on NIH research
              workflows, Maryville student outcomes, Mimecast GTM productivity, dpa newsroom discovery, and named
              relationships with Harvey and DuckDuckGo. The same evidence also surfaces the main overview risks.
              Distribution remains less proven than product quality, some key metrics are still self-reported, headcount
              is undisclosed, and public governance pages have not all caught up with the latest leadership changes.
