  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, privacy, and enterprise-trust risk are real even without a headline lawsuit
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory stack is the first place diligence should get uncomfortable. You.com has enough
              public paperwork to sell into enterprises, but the paperwork is also explicit about what the company does
              not control. The privacy policy names multiple LLM vendors, warns users not to upload restricted data,
              discloses onward transfers and service-provider sharing, and reserves legal-retention exceptions. The
              terms go further by shifting risk from third-party outputs and APIs back to the user and by reserving
              broad rights to modify, suspend, or discontinue functionality. Those clauses are normal for fast-moving AI
              products, but they matter more here because You.com is selling trust, citations, and regulated-workflow
              readiness as part of the value proposition. The 2026 AI Act timeline and HanseMerkur’s public comments
              show that regulated buyers increasingly need auditability, documentation, and predictable controls, not
              just good answers. The mitigating point is that You.com does publish a legal hub, DPA-ready language,
              governance templates, and enterprise trust claims. The open question is depth: the public web shows
              document shells and marketing claims much more clearly than it shows negotiated indemnities, control
              mappings, incident obligations, or customer-grade SLA language.
            claimRefs:
