        title: >-
          Customer archetypes are broad, but the public proof is bifurcated between deep enterprise stories and
          channel-led API distribution
        blocks:
          - type: paragraph
            body: >-
              The public record supports a two-track customer story. One track is classic enterprise deployment: You.com
              sells a higher-touch intelligence stack to institutions that care about citations, private data, and
              workflow-specific agents. NIH, Maryville, Mimecast, dpa, HanseMerkur, and Wort & Bild all sit in this
              bucket, even though the depth of proof varies sharply by account. The second track is platform
              distribution: You.com also sells APIs and search infrastructure that travel through MCP, GPT OSS, Vercel,
              Zapier, MindStudio, and cloud-marketplace surfaces. That widens the buyer universe from central IT teams
              and knowledge-work leaders to developers, product teams, and partner ecosystems that may never buy a
              standalone seat product. The important underwriting nuance is that buyer, user, and payer often differ.
              Maryville leadership and faculty govern rollout while students consume it; NIH IT sponsors usage while
              researchers and contractors use it; Mimecast chose the product centrally for business teams; and partner
              channels like GPT OSS or Remy can embed You.com inside other products altogether. This makes the customer
              base broader than a simple enterprise-search label suggests, but it also means the commercial mix is hard
              to read from public data alone.
