      - number: '5.2'
        title: The architecture emphasizes retrieval orchestration, citation fidelity, and route-by-use-case specialization
        blocks:
          - type: paragraph
            body: >-
              Public technical materials consistently frame You.com as an orchestration layer over multiple retrieval
              modes rather than as a monolithic model company. The architecture starts with acquisition and indexing
              across the live web, vertical indexes, and private enterprise data, then routes requests into distinct
              retrieval paths depending on the job. Fast search returns contextual snippets; Contents fetches clean page
              text; Express packages search plus answer in one call; Research and ARI run deeper multi-step synthesis;
              and Finance Research swaps the open web for a finance-optimized index enriched with licensed and
              institutional data. The most technically differentiated public component is Deep Search, which the company
              says performs parallel page fetches, runs an LLM-based highlighter, and then verifies that returned
              passages actually appear on the pages through fuzzy matching. That design choice is notable because it
              explicitly targets the biggest failure mode in agentic retrieval systems: persuasive but weakly grounded
              excerpts. The rest of the stack follows a similar logic. RAG is described as retrieve-then-generate,
              citations are central across research surfaces, and product updates repeatedly separate fast-answer paths
              from slower but deeper research paths. The architectural upside is flexibility across latency and depth.
              The downside is operational complexity: more retrieval surfaces, more ranking logic, more model-routing
              decisions, and more opportunities for cost or quality drift between endpoints.
