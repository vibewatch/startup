            body: >-
              The financing story is now clear enough to anchor the report, even if some repeated aggregate numbers
              remain fuzzy. TechCrunch documented a $20 million seed in 2021, then a $25 million 2022 round led by
              Radical Ventures, and company plus press sources align on a $50 million Series B in 2024 followed by a
