              contractors actually do with the product, and why the buyer cared about citation traceability. Maryville
              is the clearest education example: it links You.com to fewer nursing-course withdrawals, more students
              staying on track, heavy faculty adoption, hundreds of custom agents, and repeated student use. Mimecast
              adds a third proof point, but the disclosed outcome is narrower: a 20% lift in sales-enablement content
              plus faster GTM processes. dpa adds newsroom workflow proof and Team Plan access, but not renewal or ROI
              data. The enterprise page adds HanseMerkur and Wort & Bild, yet those references remain materially lighter
              than the flagship case studies. The right read is that You.com clearly has real enterprise deployments,
              but public proof quality is concentrated in a small handful of hand-picked stories rather than a broad,
