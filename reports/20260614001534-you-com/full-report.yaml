chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and current positioning
        blocks:
          - type: paragraph
            body: >-
              You.com is no longer best described as a consumer answer engine. The most current official pages frame it
              as enterprise AI infrastructure that helps organizations move faster with accurate, fresh, and actionable
              intelligence, while legal documents identify the operating entity as SuSea, Inc. d/b/a you.com. The public
              footprint is a little broader than a single-office startup story: the legal notice address and multiple
              company datelines point to Palo Alto, while the recruiting site highlights offices in San Francisco and
              New York. That combination fits a company that began as an AI-native search challenger in 2020 and then
              reoriented its front door toward APIs, private-data retrieval, and enterprise workflow support. The
              business model is now visibly mixed. You.com offers self-serve pricing and public developer surfaces while
              also marketing customized enterprise builds and expert implementation support. For later chapters, the
              safest overview framing is that You.com is a private AI search and research infrastructure company with a
              multi-site U.S. footprint and a stronger enterprise posture than its original consumer-search launch
              implied.
