      - number: '3.4'
        title: Moat durability depends on owning the workflow, not just the search call
        blocks:
          - type: paragraph
            body: >-
              The strongest public case for You.com is not that it has no competition, but that it is trying to escape
              the most commoditized layer. The enterprise page, ARI launch, and Finance Research API all show a company
              pushing from web search toward higher-value, cited, multi-step research workflows that combine public and
              private data. That strategy is sensible because the pure search layer looks fragile. Company-authored
              benchmarking can help explain how You.com wants to be seen, but it cannot by itself prove a durable edge
              versus direct peers. Meanwhile, incumbent pressure is structural: Glean and hyperscalers sit closer to the
              identity, data, and procurement layers that determine whether enterprise search sticks. The substitute
              threat is structural too. Harvey shows how a vertical workflow tool can absorb budget that might otherwise
              have gone to a horizontal research platform, while gpt-oss and tool APIs lower the cost of building custom
              agents in-house. Public evidence therefore supports a nuanced moat view. You.com appears strongest when a
              buyer wants one platform that mixes current web grounding, citations, model choice, and configurable
              enterprise workflows. It appears weaker when the buyer already has trusted internal-data infrastructure,
              when a vertical application fully owns the user workflow, or when an engineering team is willing to
              assemble its own stack. The main diligence blocker is not awareness of rivals; it is the absence of public
              win-loss, realized pricing, and channel-economics data that would show whether You.com's wedge actually
              converts into durable enterprise power.
