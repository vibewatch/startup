      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Because You.com does not publish revenue, gross margin, or retention, a scenario approach is more honest
              than a point estimate. The bear case assumes that most of the economic value sits in increasingly
              commoditized retrieval, not in defensible workflow software. In that world, the company still has real
              technology and customer relevance, but the market discounts opaque concentration, support burden, and
              provider dependence; that points to a range around $0.8 billion to $1.2 billion. The base case assumes the
              Series C mark broadly holds because enterprise workflows, finance research, and private-data deployments
              are real, while public economics remain too thin to justify a Glean-style premium. That leads to a range
              around $1.2 billion to $1.8 billion. The bull case requires much more than today's public story: private
              diligence would need to show strong ARR, durable retention, healthy gross margins, and diversified large
              accounts behind the query-volume claim. Only then does a range around $1.8 billion to $2.6 billion make
              sense. Put differently, the current round already prices in meaningful upside; public evidence mostly
              supports the base case, not the bull case.
