            body: >-
              The list-price stack is now observable enough to say something useful about revenue quality. Base web
              search is priced at $5 per 1,000 calls, contents extraction at $1 per 1,000 pages, and higher-value
              research products step up sharply in price, with public page text showing a $12 research tier and a $110
