      - number: '7.4'
        title: Visible mitigations help, but the investment case still needs explicit kill criteria and private diligence
        blocks:
          - type: paragraph
            body: >-
              The right stance is conditional rather than binary. You.com does have meaningful mitigations in public
              view: model-agnostic positioning, customer stories from regulated and citation-sensitive buyers, DPA and
              security document shells, governance templates, free-to-paid developer funnels, and procurement routes
              like AWS Marketplace. Those are real de-risking signals. But they are not a substitute for buyer-grade
              diligence. For this chapter, the highest-priority kill criteria are also monitorable. If a privacy, trust,
              or regulatory incident lands before the company can show mature controls, the enterprise narrative should
              re-rate quickly. If model providers reprice, deprecate, or throttle access without a credible fallback,
              the company’s margin and reliability story weakens at the same time. If management cannot disclose
              customer concentration, renewal behavior, and product-level gross margins, then the public proof remains
              too curated for confident underwriting. And if paid-plan reliability or support quality keeps surfacing as
              a pattern rather than isolated noise, that is a commercialization issue, not a cosmetic one. The practical
              diligence ask is straightforward: get the trust pack, the provider map, the concentration schedule, the
              support and incident history, and the real contract economics before treating the enterprise story as
              fully de-risked.
