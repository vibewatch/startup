  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visibly mixed, not a single-SKU API story
        blocks:
          - type: paragraph
            body: >-
              The current public footprint supports a mixed monetization model rather than a pure search-API utility.
              The clearest visible stream is self-serve developer usage: You.com's pricing page lists per-call web
              search pricing, per-page contents pricing, a lower-cost research tier, and a much higher-priced finance
              research tier. But the company is not selling only one metered endpoint. The Series B and Series C
              materials, enterprise-solutions page, and 2025-2026 product updates show at least four overlapping
              monetization paths: base retrieval APIs, premium research APIs, Team or collaboration-style offerings, and
              enterprise custom-agent deployments tied to private-data integration. That matters because it improves
              revenue optionality, but it also complicates revenue-recognition analysis. Usage billing, seat-oriented
              collaboration plans, and bespoke enterprise work likely recognize revenue on different schedules and carry
              different gross margins. Public sources let us see the menu, not the mix. The safest financial framing is
              therefore that You.com has broadened its sellable surface area materially, but investors still cannot tell
              what percentage of revenue comes from commodity search versus higher-value workflow products or services.
