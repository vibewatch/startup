      - number: '1.2'
        title: Founder pedigree, leadership continuity, and governance signals
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is one of You.com's clearest strengths. Richard Socher is still the dominant public
              voice and brings unusual credibility from Salesforce and academic NLP, while Bryan McCann is tied to the
              same research lineage through the Natural Language Decathlon work the company uses to explain its
              technical roots. That pedigree helps make the company's shift from search UI to retrieval infrastructure
              more believable: the founding team has worked on language modeling, enterprise productization, and
              evaluation before. Leadership continuity is more nuanced than older company pages suggest, however. The
              public About page still labels McCann as CTO, but a March 2026 company announcement moved the operating
              CTO role to Saahil Jain, one of the earliest hires, while McCann stayed involved in an advisory and board
              capacity. Governance disclosure remains thin beyond that. The main hard data point is David Yang joining
              the board as part of the Series C round, which suggests board evolution is finally becoming externally
              visible but not yet fully transparent.
