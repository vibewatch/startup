  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              You.com should not be analyzed as though it competes for all search, all generative-AI, or all
              knowledge-work software spend. The evidence is more specific. AI search is defined by natural-language
              understanding, retrieval across multiple sources, and synthesized answers with citations, while enterprise
              search adds internal authorization, indexing, and connector requirements that do not exist in a consumer
              answer engine. That means the most relevant market boundary for You.com sits at the intersection of
              external web grounding, enterprise retrieval, and agent-oriented research infrastructure. Included spend
              covers search calls, answer-generation APIs, extraction, RAG grounding, and higher-value research
              endpoints that let developers or enterprise teams build workflows on top of fresh data. Excluded spend
              includes raw model-training budgets, broad consumer search ad budgets, and software categories that do not
              actually provide search or grounding infrastructure. The practical substitutes are legacy keyword or
              federated search, DIY RAG stacks built around foundation-model APIs, and rival API-first search providers
              that promise similar grounding for agents.
