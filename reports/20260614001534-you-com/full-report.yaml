      - number: '6.5'
        title: >-
          The largest customer diligence risk is not absence of logos; it is absence of concentration and renewal
          visibility behind those logos
        blocks:
          - type: paragraph
            body: >-
              The chapter's main adverse read is that customer proof is real but still thin relative to the ambition of
              the story. The series C post cites more than 1 billion monthly API queries and names DuckDuckGo, Windsurf,
              and Harvey, which is strategically important, but none of those relationships comes with contract size,
              workload mix, or retention detail. The same is true for most partner-led and marketplace channels: they
              clearly broaden reach, yet they may also concentrate technical and commercial dependence on external
              ecosystems. Public procurement evidence does not fully close the loop, and third-party reviews surface
              support and activation issues that could matter disproportionately in team settings. Most importantly, the
              company discloses no customer count, no top-customer concentration, no ARR by segment, and no renewal
              statistics. That forces an investor to separate what is proven from what is only plausible. Proven:
              You.com has deployable products, real institutional references, and meaningful distribution. Unproven: how
              diversified the revenue base is, how sticky accounts remain after year one, and whether channel volume
              converts into durable economics.
