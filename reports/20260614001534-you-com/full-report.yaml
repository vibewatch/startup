      - number: '8.2'
        title: Financing context, valuation discipline, and what the public mark really says
        blocks:
          - type: paragraph
            body: >-
              The financing record now gives investors a clean headline but not a clean underwriting file. You.com's
              visible rounds add to roughly $195 million across the 2021 $20 million raise, the 2022 $25 million round,
              the 2024 $50 million Series B, and the 2025 $100 million Series C. That sequence matters because it shows
              the company can keep attracting capital across strategy shifts. But valuation discipline requires looking
              at the signal immediately before the close as well. Verdict reported in June 2025 that the company was
              seeking new funding at a roughly $1.4 billion valuation, before the later official announcement of the
              $1.5 billion Series C. That gap is not large enough to call distress, yet it does show that the final
              round should be treated as a negotiated market event rather than as self-evident proof of breakout
              economics. The two 2025 Form D vehicles add another nuance: they show financing ecosystem support around
              the round, but not necessarily direct operating-company cash or clean common-equity terms. Investors
              should therefore treat the $1.5 billion mark as a real anchor, but not as a sufficient answer to dilution,
              runway, or preference-stack questions.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV025
              - CV027
              - CV028
              - CV031
              - CV040
