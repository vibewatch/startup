  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Flat or down round
        - Next financing clears at or below the 2025 mark on tougher terms
        - Confirms that the current narrative premium did not hold once investors dug into economics.
        - Move the valuation framework toward the bear range and scrutinize preference overhang.
      - - Premium-SKU monetization miss
        - >-
          Management cannot show that research, finance, or enterprise workflows materially improve realized pricing or
          margin
        - Collapses the idea that You.com is graduating away from commodity retrieval.
        - Remove bull-case weighting until product economics are proven.
      - - Concentration surprise
        - A small number of API customers drive a disproportionate share of volume or revenue
        - Makes the >1B monthly-query claim less valuable than it appears and raises renewal risk.
        - Demand a bigger discount and reassess durability assumptions.
      - - Trust or support failure
        - >-
          Repeatable billing, support, privacy, or reliability issues become a pattern in diligence or customer
          references
        - Raises churn and reputation risk exactly where premium pricing requires trust.
        - Pause commitment until operational metrics and references improve.
      - - Provider or platform shock
        - Major upstream model or platform changes worsen cost, quality, or routing flexibility
        - Pressures margin and undermines the model-agnostic wedge.
        - Re-cut scenarios with lower realized margin and higher operating risk.
      - - Disclosure remains stalled
        - Management still withholds ARR, margin, retention, and runway in the next diligence cycle
        - Keeps valuation anchored in narrative rather than operating proof.
        - Maintain research-more stance and do not pay above a conservative range.
    notes: Each trigger is monitorable and tied directly to whether the base case should still hold.
