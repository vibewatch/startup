  - id: FV004
    title: Investment KPI scorecard
    type: kpi
    layout: wide
    summary: IC-style scoring across market, proof, economics, risk, and valuation support based only on public evidence.
    data:
      items:
        - label: Market opportunity
          value: 8
          max: 10
          note: Enterprise AI budgets and recurring-software allocation trends are real tailwinds.
        - label: Product and workflow proof
          value: 7
          max: 10
          note: Public product breadth and cited research workflows are stronger than a generic API story.
        - label: Customer proof
          value: 6
          max: 10
          note: Named customers and quantified case studies exist, but the set is curated and concentration is hidden.
        - label: Economics disclosure
          value: 2
          max: 10
          note: Revenue, margin, retention, and runway remain largely private.
        - label: Competitive durability
          value: 5
          max: 10
          note: There is a real wedge, but direct retrieval pricing and platform bundling keep pressure high.
        - label: Risk load
          value: 3
          max: 10
          note: Trust, support, provider, and concentration risks remain valuation-relevant.
        - label: Valuation support
          value: 4
          max: 10
          note: The 1.5B mark is plausible, but public evidence still supports stretched more than attractive.
        - label: Evidence quality
          value: 4
          max: 10
          note: The source set is broad, but key underwriting metrics are still missing from public view.
    approximationNotes: >-
      Scores are qualitative and evidence-bound; they are intended to summarize confidence, not to substitute for a
      financial model.
    claimRefs:
      - CV013
      - CV017
      - CV026
      - CV034
      - CV039
      - CV040
      - CV046
      - CV048
