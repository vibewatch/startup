      - number: '2.3'
        title: Buyer, user, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The buyer map for this category is split between enterprise platform owners and developer-led teams.
              Enterprise buyers want secure, permission-aware retrieval across systems such as SharePoint, Salesforce,
              Jira, and internal documents, which is why Glean, Azure AI Search, and Google Agent Search all emphasize
              connectors, governance, and enterprise data controls. In those cases, the buyer may be a CIO,
              knowledge-platform lead, support-platform owner, or AI-enablement team; the users are employees, analysts,
              support agents, or downstream internal copilots; and the payer is usually a recurring software or cloud
              budget. Developer-led buyers look different. OpenAI, Exa, Tavily, Brave, and You.com all sell search as a
              programmable component for chatbots, coding assistants, research agents, and web-grounded applications,
              which means the first purchase can start inside an engineering or product budget and expand only after the
              workflow proves value. The important implication for You.com is that it straddles both motions. Its API
              pricing and benchmark materials target bottom-up builders, but its scale claims, vertical indexes, and
              enterprise positioning imply a later upmarket motion into higher-value workflows.
