  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      You.com’s highest residual risks cluster around legal-compliance burden, model dependence, and commercialization
      opacity; public mitigations are visible but still partly marketing-led.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Third-party model / API dependence
          values:
            - label: high
              tone: negative
              detail: Named in privacy policy and operationalized in product docs and reviews.
            - label: critical
              tone: negative
              detail: A repricing or access loss can hit reliability and gross margin together.
            - label: medium
              tone: warning
              detail: Model-agnostic routing exists, but fallback evidence is private.
            - label: high
              tone: negative
              detail: Residual exposure stays high until fallback paths are proved in diligence.
        - label: Privacy / regulatory burden
          values:
            - label: medium-high
              tone: warning
              detail: AI Act timing and restricted-data rules raise the bar for regulated deployments.
            - label: high
              tone: negative
              detail: A trust incident would impair the core enterprise sales narrative.
            - label: medium
              tone: warning
              detail: Legal hub, DPA language, and governance kit are helpful but incomplete.
            - label: medium-high
              tone: warning
              detail: Residual exposure depends on contract packs and operating discipline not yet public.
        - label: Reliability / support quality
          values:
            - label: medium
              tone: warning
              detail: Reviews and company docs show the risk is plausible, but independent telemetry is thin.
            - label: high
              tone: warning
              detail: Enterprise trust breaks quickly when paid plans or retrieval fail.
            - label: low-medium
              tone: warning
              detail: Public mitigations exist, but buyer-grade SLA and postmortem evidence does not.
            - label: medium-high
              tone: warning
              detail: Residual severity remains elevated without independent uptime proof.
        - label: Commercialization / pricing pressure
          values:
            - label: high
              tone: negative
              detail: The company is still proving the pivot from search growth to durable enterprise economics.
            - label: high
              tone: negative
              detail: Competition can pressure both pricing and product positioning.
            - label: medium
              tone: warning
              detail: Enterprise deals and marketplaces offer some diversification.
            - label: high
              tone: negative
              detail: Residual exposure stays high until margins and renewals are disclosed.
        - label: Customer concentration opacity
          values:
            - label: medium-high
              tone: warning
              detail: Named references are strong but curated, and query-volume anchors are not disclosed.
            - label: high
              tone: warning
              detail: A small number of large accounts could disproportionately matter.
            - label: low
              tone: warning
              detail: Public mitigation is mostly vertical diversity, not disclosure.
            - label: high
              tone: negative
              detail: Residual exposure remains high until management shares concentration data privately.
    approximationNotes: >-
      This matrix uses source-backed ordinal labels rather than invented probabilities. It is a ranking device for
      residual exposure, not a statistical forecast.
    claimRefs:
      - CR007
      - CR010
      - CR012
      - CR013
      - CR018
      - CR020
      - CR022
      - CR025
      - CR030
      - CR042
      - CR045
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Most downside pathways run through a short causal chain: trust and platform risks transmit into customer
      confidence, pricing power, support burden, and ultimately valuation discipline.
    data:
      nodes:
        - id: reg
          label: Legal / regulatory burden
          detail: Privacy obligations, AI Act implementation, and contract risk shape enterprise friction.
          tone: warning
        - id: vendor
          label: Model / API dependence
          detail: Upstream providers control some capability, cost, and rate-limit behavior.
          tone: warning
        - id: ops
          label: Reliability / support friction
          detail: Latency, quotas, support failures, and connector complexity become customer-visible.
          tone: warning
        - id: trust
          label: Enterprise trust
          detail: Citations, retention promises, and control evidence determine adoption quality.
          tone: warning
        - id: margin
          label: Margin pressure
          detail: Provider costs and price competition compress contribution economics.
          tone: negative
        - id: growth
          label: Growth durability
          detail: Expansion and renewals depend on reliability plus trust, not demos alone.
          tone: warning
        - id: valuation
          label: Valuation support
          detail: Opacity or operational misses widen discount rates and narrow upside confidence.
          tone: negative
      edges:
        - from: reg
          to: trust
        - from: vendor
          to: ops
        - from: vendor
          to: margin
        - from: ops
          to: trust
        - from: ops
          to: growth
        - from: trust
          to: growth
        - from: margin
          to: valuation
        - from: growth
          to: valuation
    approximationNotes: >-
      The graph is qualitative and directional. It shows how one risk can transmit into another business variable, not
      how large the effect will be.
    claimRefs:
      - CR018
      - CR020
      - CR025
      - CR039
      - CR042
      - CR043
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      You.com’s external dependency web spans models, procurement, and competing platforms; several nodes can affect
      both product quality and bargaining leverage at once.
    data:
      nodes:
        - id: you
          label: You.com operating core
          detail: Product, routing, enterprise GTM, and support.
          tone: positive
        - id: llms
          label: OpenAI / Anthropic / Google
          detail: Named LLM providers in the privacy policy.
          tone: warning
        - id: gptoss
          label: GPT OSS ecosystem
          detail: You.com is the default browser backend in the integration docs.
          tone: warning
        - id: aws
          label: AWS marketplace channel
          detail: Procurement shortcut tied to EDP and invoice consolidation.
          tone: neutral
        - id: comp
          label: OpenAI / Google / Brave alternatives
          detail: Competing grounded-search stacks with bundle or compliance advantages.
          tone: warning
        - id: accounts
          label: Flagship accounts
          detail: Curated enterprise references and large API customers.
          tone: warning
      edges:
        - from: llms
          to: you
        - from: gptoss
          to: you
        - from: aws
          to: you
        - from: comp
          to: you
        - from: accounts
          to: you
        - from: llms
          to: accounts
        - from: comp
          to: accounts
    approximationNotes: >-
      This dependency map highlights where external counterparties can influence both product experience and commercial
      leverage. It does not imply equal weight across nodes.
    claimRefs:
      - CR001
      - CR016
      - CR031
      - CR032
      - CR033
      - CR034
      - CR037
      - CR046
