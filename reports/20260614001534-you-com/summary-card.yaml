  topStrengths:
    - >-
      Founder-market fit is unusually strong, anchored by Richard Socher and Bryan McCann's NLP and enterprise-software
      pedigree.
    - >-
      Product breadth is real: You.com now spans base search, premium research, finance workflows, and private-data
      enterprise deployments.
    - >-
      Public customer proof is better than a generic AI startup story, with quantified workflow outcomes from NIH,
      Maryville, and Mimecast plus named API customers.
    - >-
      Capital access is credible, with a well-corroborated $100M Series C at a $1.5B valuation and roughly $195M of
      visible disclosed funding.
    - >-
      The company has a plausible wedge in cited, model-agnostic, web-grounded workflows for enterprise and agentic use
      cases.
  topRisks:
    - >-
      Revenue, gross margin, retention, concentration, and runway remain undisclosed, preventing clean underwriting of
      the business.
    - >-
      Direct retrieval and search API pricing is already compressed across peers, pressuring margin durability in the
      base layer.
    - >-
      Several headline traction signals, including >1B monthly API queries, remain primarily company-claimed rather than
      independently underwritten.
    - >-
      The product stack depends materially on external models, platform ecosystems, and enterprise trust or support
      execution.
    - Founder concentration and lagging public governance surfaces add key-person and communications risk.
  unresolvedGaps:
    - ARR and revenue mix by product line remain undisclosed.
    - Gross margin, cost-to-serve, and realized pricing by SKU are still not publicly visible.
    - Customer concentration, GRR, NRR, and contract durability are not disclosed.
    - Current cash balance, burn, and runway remain unknown.
    - Series C preference terms, secondaries, and other cap-table details are still private.
