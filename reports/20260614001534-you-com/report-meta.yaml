companyProfile:
  summary: You.com is a private AI search and research infrastructure company founded in 2020 by Richard Socher and Bryan McCann. What began as an AI-native search challenger now presents as enterprise AI infrastructure built around web-grounded APIs, private-data retrieval, premium research workflows, and custom enterprise deployments. Public evidence supports a Palo Alto headquarters anchor with a broader multi-site footprint, a real $100 million Series C at a $1.5 billion valuation in 2025, and meaningful customer proof across institutional, enterprise, and API-platform use cases, but key operating metrics remain sparse.
  foundedDate: '2020-01-01'
  founders:
    - name: Richard Socher
      role: CEO, Co-founder
      background: Former Salesforce chief scientist and EVP; publicly presented as a leading NLP researcher.
      claimRefs: [CO009]
    - name: Bryan McCann
      role: Co-founder; former CTO, now advisor and board member
      background: NLP researcher who collaborated with Socher on the Natural Language Decathlon line of work and later shifted out of the operating CTO role in 2026.
      claimRefs: [CO007, CO010]
  foundingLocation: Palo Alto, CA
  headquarters: Palo Alto, CA
  productSummary: You.com sells a layered product stack that includes web search and contents APIs, premium Research and Finance Research APIs, private-data retrieval, and custom enterprise agents or workflow deployments.
  customerFocus: Enterprise teams and developers that need fresh, cited web grounding, research workflows, and permission-aware retrieval across private and public data.
  businessModel: Mixed monetization model combining self-serve usage-based APIs, premium research and finance APIs, and higher-touch enterprise engagements with tailored economics.
  stage: Series C / late-stage private
