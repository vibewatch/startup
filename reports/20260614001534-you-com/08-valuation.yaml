- id: comparable-set-and-market-anchors
  title: Comparable set and market anchors
  body: The cleanest comparable lesson is not a single multiple; it is what different evidence levels command. Glean is the most useful private reference in this source set because it pairs a far higher $7.2 billion valuation with disclosed ARR above $100 million and a clearly enterprise-shaped platform story. Public software names then frame the outer bounds of what markets reward once economics are visible. Elastic, a search and infrastructure-adjacent public company, traded around a $6.3 billion market cap and roughly 3.6x sales in June 2026, while Datadog and Snowflake traded at much richer revenue multiples and far larger market caps. The point is not that You.com should trade anywhere near those leaders. It is that public markets reserve those premiums for businesses with disclosed revenue, growth, and margin quality. That same principle applies on the downside. Search API peers publish transparent prices, and hyperscalers package retrieval into broader procurement relationships, so
    a company without disclosed economic quality should not get the full benefit of premium-software comp logic by default. Comparables therefore support caution, not a mechanical markdown or markup.
