- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Product surface
    - You.com now sells search, research, finance, and enterprise workflow products rather than a single consumer-search utility.
    - Breadth alone does not prove that higher-value SKUs are the economic center of gravity.
    - Show revenue mix and contribution margin by product line.
  - - Customer proof
    - NIH, Maryville, DPA, HanseMerkur, Mimecast, and named API customers show relevance across regulated and knowledge-heavy workflows.
    - Public customer proof is curated and does not reveal account concentration, contract size, or renewals.
    - Provide top-customer mix, contract sizes, and cohort retention data.
  - - Financing signal
    - A $100M Series C at $1.5B shows the market still funds the story.
    - A June 2025 ~$1.4B fundraising signal and opaque round terms argue against blind carry-forward of the mark.
    - Disclose term sheet logic, preference stack, and current secondary pricing.
  - - Competitive posture
    - Model-agnostic positioning and enterprise controls give You.com a real wedge in cited research workflows.
    - Direct search pricing is compressing and larger platforms can bundle retrieval into broader suites.
    - Prove premium workflows drive realized pricing above commodity retrieval.
  - - Valuation method
    - Scenario analysis preserves uncertainty when revenue, margin, and retention are private.
    - A single comp multiple would manufacture precision the public record does not support.
    - Release enough financial data to support a tighter valuation framework.
  notes: Every bull point is paired with the exact evidence that would need to become visible before the thesis deserves a tighter multiple.
