- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - Key assumptions
  - Main downside trigger
  rows:
  - - Bear
    - 25%
    - 0.8B-1.2B
    - Base retrieval proves more commodity-like than software-like; concentration and provider dependence remain opaque; premium SKUs do not offset price compression.
    - A flat/down round or weak margin evidence forces the market to discount the 2025 mark.
  - - Base
    - 55%
    - 1.2B-1.8B
    - The Series C broadly holds because enterprise workflows and research products are real, but public economics remain too thin for a richer premium.
    - Retention, concentration, or support evidence undercuts durability.
  - - Bull
    - 20%
    - 1.8B-2.6B
    - Private diligence shows strong ARR, healthy gross margins, diversified large customers, and premium-workflow monetization that changes realized pricing.
    - Management cannot prove that premium workflows materially improve economics.
  - - Probability-weighted center
    - 100%
    - ~1.35B-1.7B
    - The current public record supports something close to the last round, but not a clear step-up above it.
    - Overpaying materially above the last round without new evidence erases margin of safety.
  notes: Ranges are deliberately broad because the company has not disclosed the revenue, margin, or retention inputs needed for a tighter valuation model.
