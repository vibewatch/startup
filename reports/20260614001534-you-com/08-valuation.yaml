  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Trailing-twelve-month revenue or ARR by product line, including what share comes from base search versus research, finance, and enterprise deployments.
    whyItMatters: Without revenue mix, the market cannot tell whether the $1.5B mark reflects software-quality monetization or mostly usage volume plus narrative.
    diligencePath: Request monthly revenue and ARR bridge by search, contents, research, finance, and enterprise solutions.
    relatedQuestionRefs:
    - QV009
    - QV021
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by product, cost per query by tier, and support or services burden for enterprise deployments.
    whyItMatters: Scenario ranges depend on whether premium workflows genuinely expand contribution margin above base-retrieval economics.
    diligencePath: Request product P&Ls, cloud and data-licensing cost stacks, and support allocation by SKU.
    relatedQuestionRefs:
    - QV006
    - QV019
    - QV020
    - QV024
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-customer share, cohort retention, contract duration, and query volume concentration for named API customers and enterprise accounts.
    whyItMatters: The >1B monthly-query claim is hard to value if a few accounts drive most usage or if renewals are weak.
    diligencePath: Request top-10 customer schedule, GRR, NRR, and workload mix by segment.
    relatedQuestionRefs:
    - QV026
    - QV029
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, liquidation preferences, pro rata rights, secondaries, and whether any structured terms accompanied the Series C.
    whyItMatters: A $1.5B post-money headline is not enough to judge common-equity attractiveness or likely next-round dynamics.
    diligencePath: Request financing documents, board materials, and updated cap table including preference waterfalls.
    relatedQuestionRefs:
    - QV004
    - QV023
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current cash balance, monthly burn, runway, and financing plan after the 2025 close.
    whyItMatters: Investors cannot distinguish optional growth capital from future financing dependence without balance-sheet evidence.
    diligencePath: Request current cash bridge, operating plan, hiring plan, and downside runway scenarios.
    relatedQuestionRefs:
    - QV023
    - QV024
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Additional truly like-for-like public or private valuation references for AI search and research infrastructure that also disclose revenue quality or retention.
    whyItMatters: The comparable table is intentionally partial because the most decision-useful peers either lack disclosure or are not clean business-model matches.
    diligencePath: Extend the comp set in a future refresh if more directly comparable companies publish valuation and operating metrics.
    relatedQuestionRefs:
    - QV013
    - QV016
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: minor
    topic: independent-reliability-proof
    missingEvidence: Independent uptime, support-SLA, or third-party reliability evidence beyond company-authored trust material and review sites.
    whyItMatters: Reliability and support quality affect both concentration risk and whether premium workflows can keep pricing power.
    diligencePath: Request support KPI dashboard, incident/postmortem history, and customer references focused on deployment stability.
    relatedQuestionRefs:
    - QV027
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
