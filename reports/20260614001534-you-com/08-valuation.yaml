tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Supporting evidence
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Real traction and funding support relevance, but economics disclosure is still too thin for a conviction buy.
    - Do not underwrite the current mark without private diligence on revenue quality and margins.
  - - Confidence
    - medium
    - The product, capital access, and customer proof are real; the missing revenue, retention, and margin data are also real.
    - Maintain a wide valuation range and avoid single-point precision.
  - - Risk rating
    - high
    - Support, concentration, provider dependence, and trust gaps can all flow into multiple compression at the same time.
    - Size cautiously and demand diligence rights before paying up.
  - - Valuation stance
    - stretched at $1.5B
    - The Series C mark is plausible but not fully supported by public economics.
    - Prefer a discount to the last round or stronger private evidence.
  - - What changes the view
    - Disclosed ARR, gross margin, retention, and diversified large-account usage behind premium workflows.
    - Those metrics would show that You.com is more than a price-pressed retrieval layer.
    - Upgrade only when valuation support comes from economics rather than narrative alone.
  - - Most likely next checkpoint
    - Another private round, strategic transaction, or richer secondary mark
    - IPO-style disclosure is not yet visible publicly.
    - Track financing and disclosure quality as the next market test.
  notes: 'This summary is intentionally price-sensitive and evidence-sensitive: company quality alone is not enough to justify the current mark.'
