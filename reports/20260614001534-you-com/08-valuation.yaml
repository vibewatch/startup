- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Flat or down round
    - Next financing clears at or below the 2025 mark on tougher terms
    - Confirms that the current narrative premium did not hold once investors dug into economics.
    - Move the valuation framework toward the bear range and scrutinize preference overhang.
  - - Premium-SKU monetization miss
    - Management cannot show that research, finance, or enterprise workflows materially improve realized pricing or margin
    - Collapses the idea that You.com is graduating away from commodity retrieval.
    - Remove bull-case weighting until product economics are proven.
  - - Concentration surprise
    - A small number of API customers drive a disproportionate share of volume or revenue
    - Makes the >1B monthly-query claim less valuable than it appears and raises renewal risk.
    - Demand a bigger discount and reassess durability assumptions.
  - - Trust or support failure
    - Repeatable billing, support, privacy, or reliability issues become a pattern in diligence or customer references
    - Raises churn and reputation risk exactly where premium pricing requires trust.
    - Pause commitment until operational metrics and references improve.
  - - Provider or platform shock
    - Major upstream model or platform changes worsen cost, quality, or routing flexibility
    - Pressures margin and undermines the model-agnostic wedge.
    - Re-cut scenarios with lower realized margin and higher operating risk.
  - - Disclosure remains stalled
    - Management still withholds ARR, margin, retention, and runway in the next diligence cycle
    - Keeps valuation anchored in narrative rather than operating proof.
    - Maintain research-more stance and do not pay above a conservative range.
  notes: Each trigger is monitorable and tied directly to whether the base case should still hold.
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV033
  - CV041
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Revenue and ARR mix
    - Trailing-twelve-month revenue or ARR by search, contents, research, finance, and enterprise solutions
    - Needed to distinguish a workflow-software business from a lower-value retrieval layer.
    - Request monthly revenue bridge and product-level bookings/ARR schedule.
  - - Gross margin by product
    - Gross margin, cloud cost, data-licensing cost, and support burden by SKU
    - Determines whether premium workflows actually create software-like economics.
    - Review product P&Ls and cost-to-serve analysis.
  - - Retention and concentration
    - Top-customer share, GRR, NRR, contract length, and workload mix by account
    - The >1B monthly-query headline is not enough without durability and diversification.
    - Request top-10 customer schedule, cohort tables, and renewal history.
  - - Cap table and preference terms
    - Liquidation preferences, secondaries, pro rata rights, and any structured features around the Series C
    - A headline valuation is not the same as common-equity attractiveness.
    - Request the current cap table, term sheets, and board-approved financing memo.
  - - Cash and runway
    - Current cash balance, monthly burn, hiring plan, and base/downside runway
    - Separates optional growth capital from future financing dependence.
    - Review cash bridge and 24-month operating plan.
  - - Operational proof
    - Support metrics, uptime or incident history, and customer references focused on deployment stability
    - Trust and support quality affect both retention and willingness to pay premium rates.
    - Request SLA dashboards, incident logs, and reference calls with scaled customers.
  notes: These asks are ranked by what most directly changes valuation confidence, not by what is easiest to obtain.
