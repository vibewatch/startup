- id: recommendation-and-final-diligence-asks
  title: Recommendation and final diligence asks
  body: 'The correct investment posture is research-more with medium confidence and a stretched valuation stance at the public $1.5 billion mark. That is not a judgment that You.com lacks promise. It is a judgment that the public record still supports product relevance much more strongly than it supports durable economics. If an investor can buy meaningfully below the last round, or if management can privately prove strong ARR, healthy gross margins, diversified large accounts, and sticky premium-workflow adoption, the stance can move toward fair and eventually toward track. Without those proofs, paying a premium for the story would be underwriting hope rather than evidence. The final diligence list is straightforward and high leverage: revenue mix, product margins, concentration and retention, cap-table terms, and cash runway. If those five areas are strong, the company may deserve more than the public evidence currently allows. If they are weak or still withheld, the last round should
    be treated as an upper-bound narrative anchor rather than a dependable current value.'
