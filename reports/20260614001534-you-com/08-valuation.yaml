- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric or status
  - Value / valuation signal
  - Relevance to You.com
  - Limitation
  enumerationScope:
    coverage: partial
    basis: 'Covers the most decision-useful private and public references for You.com''s 2026 valuation framing: its own last round, the closest higher-disclosure private peer, and three public software infrastructure anchors. It is not an exhaustive list of all AI or SaaS comparables.'
  rows:
  - - You.com Series C
    - Private financing round
    - 100M raised at 1.5B valuation
    - Most direct hard market anchor for the company itself.
    - Does not disclose ARR, margin, retention, or preference terms.
  - - Glean Series F
    - Private financing plus disclosed ARR signal
    - 150M raised at 7.2B valuation; company said it had surpassed 100M ARR
    - Shows what stronger enterprise disclosure can command in private AI software.
    - Different product mix and far stronger public ARR evidence than You.com.
  - - Elastic
    - Public market cap and sales multiple
    - ~6.3B market cap; ~3.6x sales on StockAnalysis
    - Search and infrastructure-adjacent public comp with real financial disclosure.
    - Lower-growth, public-market business with a different maturity profile.
  - - Datadog
    - Public market cap and sales multiple
    - ~81.8B market cap; ~22.3x sales on StockAnalysis
    - Illustrates the premium public markets give to high-growth, well-disclosed software infrastructure.
    - Much larger scale and much more disclosed than You.com.
  - - Snowflake
    - Public market cap and sales multiple
    - ~80.7B market cap; ~16.0x sales on StockAnalysis
    - Shows a second high-quality public software anchor with explicit valuation ratios.
    - Data-cloud economics and maturity differ materially from search and research infrastructure.
  notes: These references are for bracket-setting and evidence discipline, not for a mechanical mark-to-multiple transfer.
