evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current board list, observer rights, and executive reporting map beyond David Yang and the founders.
    whyItMatters: >-
      Governance quality, succession readiness, and investor control cannot be judged from the public overview surfaces
      alone.
    diligencePath: Request the latest board deck, board consent history, and an org chart covering executive reports.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee count by function and geography.
    whyItMatters: Headcount is a core maturity, burn, and execution indicator and is still absent from public materials.
    diligencePath: Request payroll-backed headcount, employee census, and hiring plan as of the latest month-end.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-detail
    missingEvidence: Cap-table detail on secondaries, debt facilities, liquidation preferences, and investor information rights.
    whyItMatters: Round headlines alone do not show dilution, insider liquidity, or any structured capital risk.
    diligencePath: Request the current cap table, financing documents, and investor side letters.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: self-reported-metrics
    missingEvidence: Independent corroboration of monthly API query volume, ARR growth, and customer usage concentration.
    whyItMatters: >-
      Overview metrics influence valuation and scale perception, but the most impressive numbers are still mostly
      company-authored.
    diligencePath: >-
      Request audited customer usage dashboards, board metrics packs, and any third-party billing or cloud-usage
      evidence.
    relatedQuestionRefs:
      - QO012
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: Named contract sizes, renewal status, and revenue concentration for the public customer roster.
    whyItMatters: >-
      The logo list demonstrates relevance but not whether the business is diversified or dependent on a few large
      accounts.
    diligencePath: Request cohort retention, top-10 customer exposure, and renewal history.
    relatedQuestionRefs:
      - QO013
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      Segment-level revenue mix, active customer counts, and regional concentration for You.com's API and enterprise
      business.
    whyItMatters: >-
      Without segment mix and customer distribution, a public TAM narrative cannot be converted into a credible You.com
      SAM or SOM.
    diligencePath: >-
      Request internal cohort data by product line, customer segment, and geography; reconcile with monthly-query volume
      and revenue concentration.
    relatedQuestionRefs:
      - QM008
      - QM025
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, infrastructure cost per query, and attach rates from base search into higher-priced answer or
      research workflows.
    whyItMatters: >-
      Base-search list prices are tight, so underwriting depends on whether premium workflows or operating leverage
      create attractive economics.
    diligencePath: >-
      Obtain product-level gross margins, cloud or indexing costs, and conversion metrics from search calls into premium
      endpoints.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: Win-loss data versus Azure, Google, Glean, Brave, and Exa plus renewal and expansion behavior for large customers.
    whyItMatters: >-
      The category is crowded, so moat durability depends on whether You.com consistently wins a specific wedge and
      expands from it.
    diligencePath: >-
      Review recent enterprise deals, churn reasons, proof-of-concept conversion rates, and customer references by
      segment.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: market-lens-enumeration
    missingEvidence: A public, apples-to-apples market-size dataset specific to agentic search infrastructure.
    whyItMatters: >-
      Current sizing relies on mixed budget, usage, capital, and pricing lenses instead of a single canonical market
      dataset.
    diligencePath: >-
      Triangulate category size from vendor billing data, cloud marketplace sales, and direct competitor revenue
      disclosures if available.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Executed enterprise contracts, discount schedules, and realized usage bills for You.com, Glean, and at least one
      incumbent cloud alternative.
    whyItMatters: >-
      Public list prices mix seat, query, credit, and capacity models, so underwriting margin durability or buyer
      friction from public pages alone is unreliable.
    diligencePath: Request three recent redacted order forms or invoices per vendor class plus internal pricing policy summaries.
    relatedQuestionRefs:
      - QP018
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Named win-loss evidence and renewal reasons versus Glean, Microsoft, Google, AWS, Perplexity, Exa, and Brave by
      use case.
    whyItMatters: >-
      Product positioning explains where You.com wants to compete, but not whether buyers consistently choose it or stay
      with it once incumbents respond.
    diligencePath: >-
      Request a trailing-12-month win-loss dashboard, five reference calls, and churn analysis segmented by
      developer-led versus enterprise deals.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Partner terms, channel revenue mix, and embedded-distribution economics for relationships such as DuckDuckGo, AWS
      Marketplace exposure, and any major enterprise embedded surfaces.
    whyItMatters: >-
      Distribution power may matter more than API quality, but public sources do not show whether channel access is
      durable, exclusive, or economically meaningful.
    diligencePath: Request partner agreements, channel ARR mix, and gross-margin attribution by direct versus partner-sourced usage.
    relatedQuestionRefs:
      - QP021
      - QP024
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-recognition
    missingEvidence: >-
      A product-line revenue bridge covering search, contents, research, finance, Team, and bespoke enterprise work plus
      the accounting policy for each stream.
    whyItMatters: >-
      Without mix and recognition detail, investors cannot judge software quality, services drag, seasonality, or the
      sustainability of ARR-based valuation language.
    diligencePath: >-
      Request monthly revenue by SKU, deferred revenue, billed versus recognized revenue, and the company's
      revenue-recognition memo.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-cost-to-serve
    missingEvidence: >-
      Gross margin by product plus infrastructure, licensing, and support cost per query or per active customer for
      research-heavy SKUs.
    whyItMatters: >-
      Premium list prices only create equity value if contribution margin survives multi-step retrieval, licensed
      financial data, and enterprise support costs.
    diligencePath: Request product P&Ls, cloud-inference cost curves, vendor-data contracts, and contribution margin by tier.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, monthly burn, hiring plan, and base/downside runway after the 2025 financing.
    whyItMatters: >-
      Capital access is visible, but solvency and next-round timing cannot be underwritten without direct cash-flow
      data.
    diligencePath: >-
      Request the latest cash flow statement, 24-month operating plan, monthly actual-versus-budget burn, and board
      runway scenarios.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, logo churn, customer-count distribution, top-account concentration, and partner revenue share.
    whyItMatters: >-
      Usage claims can mask heavy concentration or low expansion; recurring-revenue quality depends on retention and
      diversification, not traffic alone.
    diligencePath: Request cohort analyses, top-10 customer revenue share, partner economics, and expansion history by product line.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: uptime-sla
    missingEvidence: Independent uptime history, public status reporting, or signed SLO/SLA detail for the API and enterprise surfaces.
    whyItMatters: >-
      Reliability is central to the investment case because the company sells infrastructure for agents and enterprise
      workflows, not just a consumer app.
    diligencePath: Request enterprise MSAs, SLA schedules, uptime dashboards, and postmortem history by endpoint.
    relatedQuestionRefs:
      - QE020
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: security-architecture
    missingEvidence: >-
      Detailed architecture for model routing, data isolation, connector permissions, key management, and incident
      response beyond marketing-level claims.
    whyItMatters: >-
      Security and privacy posture likely drives enterprise adoption, but the public record does not show enough
      technical depth to validate the strongest trust claims.
    diligencePath: >-
      Request a security briefing, control matrix, architecture diagrams, and the latest SOC 2 report plus
      penetration-test summaries.
    relatedQuestionRefs:
      - QE025
      - QE026
