- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Trust or regulatory incident
    - Public disclosure, regulator contact, or customer breach notice tied to privacy, retention, or AI compliance
    - Any incident that contradicts zero-retention, security, or regulated-workflow claims without rapid containment and buyer-grade explanation
    - Immediate thesis re-rate; pause underwriting until incident scope and remediation are independently verified.
  - - Upstream provider repricing or access loss
    - Support notices, product-limit changes, or provider contract resets affecting major models
    - Loss of parity access to flagship models or material cost pass-through without replacement economics
    - Rework margin assumptions and require proof of routing fallback before proceeding.
  - - Customer concentration opacity
    - Management refuses to disclose top-account mix, renewal behavior, or query concentration in diligence
    - No credible top-customer, NRR/GRR, or workload-concentration schedule available
    - Treat revenue durability as unproven and move valuation stance more conservatively.
  - - Paid-plan reliability and support deterioration
    - Repeat complaints on activation, quotas, or unresolved enterprise blockers
    - Pattern of unresolved paid-customer failures over a quarter rather than one-off noise
    - Cut confidence in commercialization scalability and demand stronger support metrics.
  - - Competitive price compression
    - OpenAI, Google, Brave, or similar bundles narrow the value gap on grounded search and citations
    - Sustained need to match competitor pricing without evidence of margin resilience or higher-value enterprise attach
    - Assume lower contribution margins and reduce willingness to underwrite premium multiples.
  - - Leadership or execution fracture
    - Senior departures, delayed trust-pack delivery, or inability to support multiple GTM motions coherently
    - Material founder/executive disruption without clear succession or operating redundancy
    - Reassess execution discount and require stronger governance rights or wait for stabilization.
  notes: These triggers are deliberately monitorable. The goal is not false precision; it is to define the events that should change valuation discipline or stop the diligence process.
