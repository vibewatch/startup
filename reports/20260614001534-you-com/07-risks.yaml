  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: trust-package
    missingEvidence: Full DPA, security overview, indemnity terms, uptime commitments, and customer-facing incident obligations used in live enterprise contracts.
    whyItMatters: Public legal artifacts show intent but not the contractual protections that actually determine enterprise risk transfer.
    diligencePath: Request the current enterprise trust pack, including DPA, MSA, SLA, security addendum, and control-mapping summary.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Independent incident history, uptime metrics, postmortems, and support-SLA attainment data.
    whyItMatters: Operational and support risk cannot be underwritten confidently from company-authored reliability materials and scattered reviews alone.
    diligencePath: Obtain 12-18 months of incident logs, customer-severity summaries, support KPI dashboards, and any contractual uptime commitments.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue and query concentration, renewal rates, gross retention, net retention, and workload mix by segment.
    whyItMatters: Public proof is real but curated; concentration opacity is one of the main downside channels into valuation and financing assumptions.
    diligencePath: Request the top-10 customer schedule, segment mix, cohort renewals, and any account-level exposure above 5% of revenue or query volume.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: copyright-liability
    missingEvidence: Outside-counsel analysis of retrieval, citation, training, and content-extraction exposure plus any dispute history or takedown volume.
    whyItMatters: The product’s value proposition depends on live web retrieval and grounded answers, so IP and attribution risk can hit trust and economics simultaneously.
    diligencePath: Request a legal memo on copyright and false-attribution exposure together with internal policies for source verification, disputes, and removals.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
