summary:
  headline: >
    Semperis 是 Active Directory 和 Entra ID 身份韧性领域的代表性平台，拥有 $100M+ ARR、1,000+ 企业客户和耐久的 AD 专项护城河；但 $1B+ 估值约等于 10x
    ARR，已经押注持续高增长，而 Microsoft 捆绑、财务不透明，以及 CrowdStrike、SentinelOne 的平台整合压力，让当前价格更适合继续研究，而不是直接买入。
  overallScore: 6.8
  recommendation: research-more
