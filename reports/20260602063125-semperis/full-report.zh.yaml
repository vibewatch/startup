      - number: '4.3'
        title: 资本充足性与融资结构
        blocks:
          - type: paragraph
            body: >
              Semperis 在 2024 年 6 月从 J.P. Morgan Asset Management 和 Hercules Capital 获得 $125 million
              成长融资。这轮融资由股权和成长型债务组合而成；官方公告使用“成长融资”这一表述，也把它同纯股权 Series D 区分开来。到 2024 年 6 月，累计融资约 $368-373
              million，具体取决于是否计入更早的小规模轮次。最近一次此前的股权融资是 2022 年 3 月由 KKR 领投的 $200 million Series C，该轮把公司推上 $1 billion+
              独角兽估值。


              Semperis CFO Jeff Bray 将 2024 年 6
              月融资描述为对已相当稳健资产负债表的补充，说明公司并非处在被迫融资状态。公司披露的成长资本主要用途是产品创新和全球客户扩张，这与销售、工程和市场拓展岗位的活跃招聘相吻合。2024 年 6 月拿到
              $125M，加上过去五年收入增长 3,000%+，公司的现金跑道可延伸到 2026 年之后。


              投资者阵容包括 KKR（私募股权，Series C 领投）、J.P. Morgan Asset Management、Hercules Capital（成长债务专家）、Insight
              Partners（成长型软件专家）、Ten Eleven Ventures（聚焦网络安全）、Paladin Capital Group（聚焦政府与国家安全）、Atrium Health Strategic
              Fund 等。多元机构背书既提供资金，也与 Semperis 的企业和政府客户基础形成战略匹配。


              月度烧钱速度和准确现金余额未公开。作为一家约 500-600 名员工的私营公司，月度现金消耗只能粗略估算：假设每名员工每月总薪酬为 $15,000-$20,000，在收入抵消前，等同薪酬的总烧钱约为每月
              $7.5-12M。若 ARR 超过 $100M（订阅收入约每月 $8.3M），考虑到 SaaS 毛利率较高，公司很可能已经接近现金流盈亏平衡，或已经越过该点。不过，高强度 R&D
              投入和国际扩张仍可能让自由现金流维持为负。公司聘用具备 IPO 经验的 Jeff Bray、Mike DeGaetano 和 Annabel Lewis，指向 12-24 个月的公开市场准备周期，与 2024 年
              6 月融资节奏一致。
