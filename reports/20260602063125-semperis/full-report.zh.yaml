      - number: '2.5'
        title: 证据展示
        blocks:
          - type: callout
            title: Microsoft MDI 捆绑是 TAM 被侵蚀的主要风险
            body: >-
              Microsoft Defender for Identity 包含在 Microsoft 365 E5 授权中——这一授权层级已经被 Semperis 的核心企业买方基础持有。 MDI 以零增量成本提供实时
              AD 威胁检测、pass-the-hash 和 DCSync 告警，以及横向移动可视化。任何没有明确把 MDI 在绿地账户中的 基线纳入模型的投资者，都会高估 Semperis
              的替换机会。关键尽调问题是：Semperis 赢单中有多大比例是 MDI 已经部署但不够用， 又有多大比例是 MDI 尚未配置？这项数据——带有 MDI 背景的赢 / 输分析——应在管理层沟通中索取。
