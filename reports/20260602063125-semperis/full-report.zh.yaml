      - number: '3.3'
        title: 护城河耐久性、切换成本与竞争风险清单
        blocks:
          - type: paragraph
            body: >-
              Semperis 最强的竞争护城河是 Active Directory Forest Recovery（ADFR）能力——这是唯一专为 Active Directory 打造、经过测试、
              自动化的完整森林恢复产品。没有 Semperis 时，要从勒索软件攻击中恢复一个 500 节点 AD 森林，AD 专家通常需要按照复杂 runbook 手工投入 24–72
              小时，并承担备份介质再次感染的显著风险。Semperis ADFR 能把这一过程压缩到 15 分钟以内，从取证干净镜像自动恢复。这与 Microsoft MDI、 CrowdStrike 或 Quest RMAD
              提供的能力有质的差别。对于已经与 Semperis 一起投入测试恢复计划和 runbook 的客户，护城河最强——替换工具意味着 重建整个 DR 框架，切换成本很高。

              Semperis 对 AD 专项攻击技术的覆盖深度，是第二层护城河。10+ 年 AD 安全工程沉淀，带来跨本地 AD 和 Entra ID 的 150+ 攻击技术检测。这种检测深度，
              以及配套威胁情报基础设施（Semperis Research Lab、Purple Knight 评分模型），短期内很难复制。不过，这条护城河正在变窄：Microsoft 正快速扩展 MDI
              检测目录，CrowdStrike 也在通过其 Graph 集成吸收 AD 遥测。两家平台厂商的工程资源远超 Semperis，并且都在投入身份安全。

              多工具并存已经出现：许多大型 Semperis 客户同时保留 MDI（捆绑）和 Semperis DSP/ADFR，用 MDI 做基础检测，用 Semperis 做恢复和高级检测。这种共存模型 既验证了
              Semperis 的增量价值，也带来风险：如果 MDI 明显变强，共存理由就会削弱。Semperis 在销售材料中承认这一动态，并在营销中把 MDI 定位为补充而非竞争； 但随着 MDI
              增加功能，这种叙事越来越吃力。

              分销力存在显著不对称：Microsoft 在企业身份基础设施中拥有 95%+ 市场份额，并把 MDI 捆绑进其占主导的生产力套件。CrowdStrike 拥有 29,000+ 企业终端客户。 Semperis
              必须通过直销或合作伙伴渠道逐个账户争夺，对抗这些分销优势。Semperis 的政府合同载体和 FedRAMP 授权，在美国联邦市场形成了部分分销护城河。

              护城河耐久性的反向证据：2025–2026 年独立分析师评论指出，在 MDI 已部署且 80%+ 常见 AD 攻击场景得到覆盖的账户中，Semperis 的定价溢价 （大型企业部署估计 ARR 为
              $300–700K）越来越难证明合理。DSP 的非恢复用例（威胁检测、攻击路径可视化）面临最强商品化压力。恢复用例仍然受保护。
