  - id: FE001
    title: Semperis Identity Resilience Platform —— 产品架构图
    slug: product-architecture-map
    type: stack
    layout: wide
    summary: 分层展示 Semperis Identity Resilience Platform：底层是身份覆盖范围，顶层是危机管理。每层代表一个或多个产品模块交付的一项独立功能能力。
    data:
      layers:
        - label: 身份覆盖范围
          detail: 覆盖本地 Active Directory、Entra ID（Azure AD）、Okta、Ping Identity —— 平台覆盖完整混合多 IdP 攻击面
        - label: 预防与评估
          detail: Purple Knight（免费 IOE/IOC 扫描器，v4.2 2026）、Forest Druid（免费 Tier 0 爆炸半径分析）—— 持续评估安全态势并降低暴露
        - label: 实时检测与变更监控
          detail: DSP 无代理捕获复制日志，ML 异常检测引擎，面向 AD 和 Entra ID 变更的 IOE/IOC 评分与告警
        - label: 运行时攻击检测
          detail: Lightning IRP 对内存攻击（DCSync、Golden Ticket、Kerberoasting）做行为检测，补足 DSP 的变更日志分析
        - label: 自动修复与响应
          detail: DSP 一键对象回滚，SIEM/SOAR 集成（Sentinel、Splunk、ServiceNow），跨所有 IdP 的防篡改变更跟踪
        - label: 以网络安全为先的 Forest 恢复
          detail: ADFR 在干净硬件上自动完成无恶意软件的完整或部分 forest 恢复，Azure 云备份（AES-256），对象级恢复向导
        - label: 危机管理与取证
          detail: Identity Forensics and Incident Response（IFIR）、Ready1 危机管理平台、合计 180+ 年 Microsoft MVP 专家 IR 能力
    claimRefs:
      - CE001
      - CE006
      - CE009
      - CE010
      - CE015
      - CE018
      - CE026
      - CE030
  - id: FE002
    title: 客户工作流 / 运营流程 —— AD 安全生命周期
    slug: customer-workflow-operating-flow
    type: flow
    layout: wide
    summary: 展示 Semperis 客户如何使用不同平台产品走完整 AD 安全生命周期，从初始评估到恢复。
    data:
      nodes:
        - id: n1
          label: 基线评估
          detail: 运行 Purple Knight 免费扫描，发现 AD 和 Entra ID 中的 IOE 和 IOC；生成带评分报告和按优先级排序的修复清单
          type: step
        - id: n2
          label: Tier 0 加固
          detail: 使用 Forest Druid 定义 Tier 0 资产边界；映射所有通往特权资产的所有权路径；关闭爆炸半径后门
          type: step
        - id: n3
          label: 持续检测
          detail: 部署 DSP 监控所有 AD 变更的复制日志；对可疑变更接收实时告警，并自动给出严重性评分
          type: step
        - id: n4
          label: 运行时攻击拦截
          detail: Lightning IRP 在内存攻击（DCSync、Golden Ticket）完成前识别；通过 SIEM/SOAR 集成告警 SOC
          type: step
        - id: n5
          label: 定向修复
          detail: DSP 自动修复或一键回滚特定恶意 AD 对象变更；分析师查看审计轨迹用于取证
          type: step
        - id: n6
          label: 事件响应
          detail: Semperis IFIR 团队介入，验证威胁清除；Ready1 危机管理平台协调利益相关方沟通
          type: decision
        - id: n7
          label: Forest 恢复
          detail: ADFR 在干净硬件上编排无恶意软件的完整或部分 forest 恢复；如本地存储丢失，可使用 Azure 云备份
          type: step
        - id: n8
          label: 恢复后验证
          detail: 重新运行 Purple Knight 扫描；用 Forest Druid 验证 Tier 0 边界；回到生产前确认 AD 状态干净
          type: step
      edges:
        - from: n1
          to: n2
          label: 发现项推动加固
        - from: n2
          to: n3
          label: 先加固，再持续监控
        - from: n3
          to: n4
          label: 告警升级到运行时检测
        - from: n4
          to: n5
          label: 确认攻击 → 修复
        - from: n3
          to: n5
          label: DSP 变更告警 → 回滚
        - from: n5
          to: n6
          label: 宣布重大事件
        - from: n6
          to: n7
          label: 需要恢复
        - from: n7
          to: n8
          label: Forest 上线 → 验证
        - from: n8
          to: n3
          label: 回到持续监控
    claimRefs:
      - CE002
      - CE016
      - CE017
      - CE019
      - CE027
      - CE036
