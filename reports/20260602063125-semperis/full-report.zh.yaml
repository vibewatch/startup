  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 企业客户结构、买方画像与渠道拆分
        blocks:
          - type: paragraph
            body: >-
              Semperis 服务 1,000+ 企业客户，核心是 Active Directory 环境复杂的组织——通常拥有 10,000+ 名员工、100+ 台域控制器，并配备能够采购和部署专用 AD
              安全平台的安全运营团队。主要买方是 CISO 或安全副总裁，并与 AD 管理和 IT 安全运营团队协作；主要付款方是企业安全或 IT
              运营预算，而不是身份与访问管理团队。客户结构明显偏向受监管行业：金融服务估计是最大垂直行业（占客户基础 25–30%），需求来自身份安全和韧性的监管要求。医疗健康估计占 15–20%，主要受勒索软件暴露和
              HIPAA 相关合规要求驱动。政府和联邦机构占 10–15%，FedRAMP Moderate 授权让 Semperis 能够参与民用联邦采购。关键基础设施行业——能源、公用事业和交通——另占 10–15%，受
              CISA 要求以及 Active Directory 在运营技术网络认证中的作用推动。Fortune 500 和大型企业通用账户贡献其余部分；考虑到按席位计价的交易规模，它们在 ARR
              中的占比很可能不成比例地高。地域结构估计约 60% 来自北美（美国和加拿大），40% 来自国际市场（主要为 EMEA），APAC 在已安装基础中仍是较小少数。渠道结构同时包括面向年合同价值约 $250K
              以上账户的直销式企业销售动作，以及面向中型企业账户、正在扩张的 VAR/MSP 伙伴网络。Semperis 已公开披露正式 MSP 计划以及与主要安全分销商的转售合作，但没有给出伙伴来源 ARR 占总 ARR
              的比例。公司未公开任何分部级收入集中度数据。
