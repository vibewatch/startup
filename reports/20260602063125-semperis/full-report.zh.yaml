      - number: '8.3'
        title: 可比公司组与市场基准
        blocks:
          - type: paragraph
            body: >-
              六家可比公司锚定 Semperis 估值框架，覆盖公开市场安全平台、身份行业 M&A，以及私募股权支持的私营 AD 竞争者。没有单一可比公司是纯粹 ITDR 匹配；这组样本用于从不同视角三角定位 ARR 倍数。

              CrowdStrike（CRWD）是主要公开市场锚点：FY2026 ARR 约 $3.95B，企业价值 $65-75B，隐含 16-19x 远期 ARR。CrowdStrike 的 Falcon Identity
              Protection 模块在 ITDR 检测领域与 DSP 竞争，因此它既是竞争者，也是估值上限基准。其倍数溢价来自 CrowdStrike 的平台规模和 Falcon 网络效应，而作为独立供应商的
              Semperis 无法复制这些能力。

              Rubrik（RBRK）是结构上最相近的公开市场可比公司：它面向企业买方，叙事是安全加恢复。FY2025 ARR 约 $825M，并于 2024 年 4 月完成 IPO，估值约为 12-15x 过去
              ARR。Rubrik IPO 提供了最近的数据点，显示公开市场如何给一个以恢复为锚、具备强企业客户参考能力的安全供应商定价。

              Ping Identity（2023 年 12 月被 Thales 以 $2.8B 收购）确立了身份行业 M&A 的战略收购方基准：收购时约为 7-8x ARR。这意味着如果没有 IPO 溢价，按基准 ARR
              计算，身份平台 M&A 会给 Semperis $700M-$960M 估值；这确认低于 $1.3B 的入场价格能够同时捕捉 M&A 底部价值和 IPO 期权溢价。

              SailPoint（2022 年 4 月被 Thoma Bravo 以 $6.9B 私有化，并以重新 IPO 为目标）提供身份治理可比，倍数约为 10-12x ARR。SailPoint
              规模大得多，但其在私募股权持有下的身份治理倍数压缩很有参考价值：Thoma Bravo 不会超额支付，即便存在战略溢价情景，身份行业倍数也有可见上限。

              Quest Software（Francisco Partners）和 Netwrix（PE 支持）是私营 AD 管理与分析竞争者。Quest 估计在 $400-600M ARR 上对应 $2-4B EV，隐含
              4-7x 倍数，反映市场对较老 AD 管理产品组合的折价。Netwrix 在 $100-150M ARR 上对应 $600M-$1B，隐含 5-7x，是规模最直接可比的基准。鉴于 Semperis 专注
              ITDR、增长更快且有机构投资者背书，它应相对 Quest 和 Netwrix 享有溢价。

              在整组可比公司中，ITDR 类别领导者溢价支持其较 PE 支持的 AD 管理倍数（5-7x）高出 2-3 个 ARR 倍数，同时低于 CrowdStrike 平台倍数（16-19x）；这支撑 8-12x ARR
              的基准情景区间。投资 KPI 评分确认，市场地位和客户证据较强；单位经济和证据质量是中等缺口。
