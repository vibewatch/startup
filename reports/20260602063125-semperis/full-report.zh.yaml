      - number: '1.4'
        title: 规模指标、客户与市场位置
        blocks:
          - type: paragraph
            body: >
              截至 2025 年初，Semperis 的年经常性收入（ARR）已超过 $100 million；公司在 January 2025 新闻稿和 PR Newswire
              分发稿中公开宣布了这一里程碑。收入增长极快：Semperis 报告称，在公告前五年收入增长 3,000%， 背后是多起高知名度 AD 攻击（Colonial Pipeline、SolarWinds，以及其他利用
              AD 凭据的勒索事件）之后， 企业快速采用 ITDR 方案。基于分析师预测，2026 年 ARR 估计约为 $151 million，体现持续的两位数增长。

              公司服务 1,000+ 家企业客户，包括已点名的 Fortune 500 账户：American Airlines、ADP、Lenovo、 United Airlines 和 Starbucks。Semperis
              称其在客户群中保护超过 100 million 个用户身份。客户集中在 航空、金融服务、科技等受监管行业，反映出这些行业既有更高安全预算，也承担 AD 被攻破后更高的监管后果。

              保守估计员工数约为 500 人，部分数据库跟踪值接近 637 人；公司维持约 24% 的年度员工增长。Semperis 委托的 Forrester Total Economic
              Impact（TEI）研究为一个复合客户识别出 $9.5 million 三年价值，为企业高管层采购决策 提供了商业论证。
