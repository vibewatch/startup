      - number: '6.3'
        title: 具名客户、案例研究与生产部署质量
        blocks:
          - type: paragraph
            body: >-
              在 1,000+ 客户基础中，Semperis 公开点名的只是一小部分；具名客户证据集中在交通、零售、技术和金融服务等领域的全球知名品牌。质量最高的具名证据是 Lenovo——Semperis
              发布了案例研究，描述其在一次 AD 入侵事件后部署 DSP 和 ADFR，成果包括相较手工流程显著缩短恢复时间。United Airlines 被点名在其全球 AD 环境中部署
              DSP，用于持续威胁检测。American Airlines 的部署由 Semperis 新闻稿确认，新闻稿提到企业级 AD 身份保护。Starbucks 列在 Semperis
              客户页面上，但公开案例细节仅限于品牌标识引用和一般范围。Hertz 和 ADP 在公司材料中被提及，但没有确认的结果指标。一个未具名美国医疗系统使用 Semperis ADFR 在 30
              分钟内从勒索软件攻击中恢复——结果很有说服力，但客户未具名限制了独立佐证。一个英国公共部门组织出现在案例研究中，用于展示政府基础设施的 AD
              恢复。在独立评价平台上，来自医疗健康、金融服务和关键基础设施的具名企业评论者确认了生产使用。总体来看，具名客户证据质量为中等：公司产出的案例研究占主导，特定结果声明的独立第三方验证有限，具名客户是否仍为活跃订阅者也未确认。六家公开具名客户——Lenovo、United
              Airlines、American Airlines、Starbucks、Hertz 和 ADP——占公司声称客户基础不到 1%，限制了具名证据向更广泛安装基础外推的能力。
