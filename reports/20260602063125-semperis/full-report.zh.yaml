      - number: '2.2'
        title: TAM、SAM 与 SOM——测算身份威胁检测与响应机会
        blocks:
          - type: paragraph
            body: >-
              公开分析师对 2026 年 ITDR 市场的估计从 $2.32B（Fortune Business Insights，口径较窄）到 $5.0B+
              （MarketsandMarkets，更宽的身份检测口径）不等；纯软件 ITDR TAM 的中位共识约为 $3.0–4.0B。这种分散反映了真实的 边界分歧：较窄定义聚焦 AD
              专属威胁检测工具，较宽定义则纳入云身份保护、员工身份安全和身份驱动的 XDR 能力。 KuppingerCole 估计 2025 年 ITDR 市场为 $3.2B，并以约 20%
              年增速增长——这一数字与中位共识一致。

              更广泛的身份安全市场包括 IAM、PAM、IGA 和 ITDR；根据 IDC 和 Grand View Research，2026 年全球规模估计为 $22–26B。ITDR 当前约占其中
              13–18%；这一品类增长明显快于更广泛 IAM 基础，因为已经安装 IAM 平台的组织现在正把 ITDR 叠加到其上。

              Semperis 的可服务市场（SAM）是 ITDR 和 AD 安全支出中的一个子集：约 2,000 名员工以上、拥有本地或混合 AD 环境的组织。 这排除了只用 Entra ID 的纯云组织、低于企业 AD
              复杂度门槛的组织，以及只使用商品化 Microsoft 原生工具的客户。基于公开的 细分规模数据，这一企业细分约占 ITDR TAM 的 55–65%，对应 2026 年 SAM 约为
              $1.8–2.8B。Semperis 在三年规划期内的 SOM 估计为 $350–650M——相当于 SAM 的 15–25%——与其当前 $100M+ ARR、当前 SAM 渗透率约 4–6% 大体一致。

              关键估计限制：没有分析师把「以企业 AD 为中心的 ITDR」作为独立研究类别发布。所有 SAM 和 SOM 估计都由二级研究和 Semperis 披露的 ARR 推导。17–26% CAGR
              的市场增长表明可触达边界正在快速扩张；这既是机会，也是风险，因为品类定义 可能转向平台捆绑式身份安全。
