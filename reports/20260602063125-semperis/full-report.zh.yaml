      - number: '5.4'
        title: 产品路线图与竞争差异化
        blocks:
          - type: paragraph
            body: >-
              Semperis 近期路线图聚焦三条线：多 IdP 扩展、AI 增强运营和危机管理集成。MightyID 收购（2026 年 2 月）立即把平台覆盖范围从本地 AD 和 Entra ID 扩展到 Okta 与
              Ping Identity，使 Semperis 成为唯一在单一平台内覆盖完整企业 IdP 栈的持续暴露管理和防篡改变更追踪供应商。公司也在开发生成式 AI（CoPilot
              式）功能——截至研究日，具体产品名称和正式发布（GA）日期尚未公开披露，但博客内容提到，AI 驱动的异常评分和威胁优先级排序是活跃开发方向。

              公司对 Microsoft Defender for Identity 的差异化叙事核心是覆盖范围：MDI 用用户行为分析监控单个用户活动，而 Semperis 保护身份服务本身——整个 AD
              林、复制拓扑、架构和信任关系。Semperis 认为，只保护用户行为会让 AD 基础设施层裸露；两套方案是互补关系，而不是直接竞争。相较 Quest Recovery Manager for Active
              Directory，Semperis 把 ADFR 的攻击优先编排作为关键优势，尤其是在恢复过程中把 AD 与 OS 分离，以防恶意软件重新引入；传统备份恢复方式无法做到这一点。

              身份取证与事件响应（IFIR）被定位为恢复后的差异化能力：Semperis 提供专家 IR 产能，安全团队合计拥有 180+ 年 Microsoft MVP
              经验，帮助客户在回到生产环境前确认威胁已经清除。另行收购的危机管理平台 Ready1 已集成进恢复流程。非人类身份（NHI）和服务账号监控是一个新兴覆盖缺口，公司已承认这属于更长期路线图的一部分。
