  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Semperis 客户从免费工具发现，到企业购买、生产部署，再到追加销售扩张的端到端获客与扩张生命周期。每个阶段映射主要客户动作、采用界面和推动前进的关键接触点。
    data:
      items:
        - label: 认知
          detail: >-
            IT 安全团队或 AD 管理员通过 Purple Knight 免费评估发现 AD 漏洞，或因同业组织遭遇勒索软件事件而关注；Semperis Research Lab 出版物和 MITRE ATT&CK
            引用带来自然发现。
          touchpoints:
            - Purple Knight 免费 AD 评估工具（65K+ 家组织）
            - MITRE ATT&CK 框架引用和 Semperis Research Lab 出版物
            - 提及 Semperis 的分析师报告（KuppingerCole、Forrester、Wavestone）
        - label: 评估
          detail: >-
            安全团队将 DSP 和 ADFR 与 CrowdStrike Falcon Identity Protection、Microsoft Defender for Identity 对比评估；进入概念验证或 30
            天试用；查阅独立评论平台，验证同行经验。
          touchpoints:
            - 30 天试用或 POC（企业评估周期通常 60-120 天）
            - G2、Gartner Peer Insights 和 TrustRadius 同行评论研究
            - 直接对比已部署的 Microsoft MDI 基线
        - label: 购买
          detail: 企业采购团队通过直销或 VAR/渠道合作伙伴谈判年度订阅；政府账户接受 FedRAMP 合规审查；大型部署通常会谈判多年期价格。
          touchpoints:
            - 面向 >$250K ACV 账户的企业直销
            - 面向中型企业账户的 VAR/MSP 渠道合作伙伴
            - 面向联邦账户的 GSA 或其他政府合同工具
        - label: 部署
          detail: DSP 传感器部署在域控制器上；ADFR 配置为基于离线、取证干净备份的网络韧性恢复；接入 SIEM（Splunk、Microsoft Sentinel）和 SOAR 工具；通过桌面演练验证恢复计划。
          touchpoints:
            - 专业服务上线（通常 4-8 周）
            - Splunk/Microsoft Sentinel 集成配置
            - 恢复桌面演练和运行手册认证
        - label: 扩张
          detail: 多产品客户增加 Lightning IRP、更多 AD forest 或 Entra ID 覆盖；年度续约承接范围扩张带来的追加销售；客户成功团队推动交叉销售沟通；Purple Knight 结果暴露更多风险。
          touchpoints:
            - 年度续约叠加追加销售动作（在 DSP 之上叠加 ADFR）
            - 客户成功与技术客户经理参与
            - Lightning IRP 与更多 forest 范围扩张
    approximationNotes: 接触点排序和转化时点根据同行评论平台披露、独立客户证言和企业安全 SaaS 基准估算。60-120 天评估周期估计来自 G2 和 TrustRadius 买方披露的采购时间线。Semperis 未披露平均销售周期长度。
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU007
      - CU024
      - CU025
