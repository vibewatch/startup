chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Semperis 是一家私人网络安全公司，总部位于美国 New Jersey 州 Hoboken，并在英国、荷兰、 以色列和澳大利亚设有办公室。公司约成立于 2013–2014
              年，创立初衷就是补上企业安全中的关键缺口： 保护 Microsoft Active Directory（AD）和云身份基础设施。全球绝大多数企业 IT 环境的认证与授权 都靠 AD
              支撑，但历史上一直缺少专用、实时的威胁检测和恢复能力。Semperis 正是为填补这个缺口而生。

              公司的核心产品族品牌为 Identity Resilience Platform，旗下涵盖四项主要产品。Directory Services Protector（DSP）为本地 AD 和混合 Azure
              AD（Entra ID）部署提供实时威胁检测、自动修复和取证分析。 Active Directory Forest Recovery（ADFR）帮助组织在数小时内从灾难性 AD 攻击中恢复。Purple
              Knight 是免费的社区 AD 安全评估工具，用来带动销售线索生成。Forest Druid 是攻击路径分析工具，负责映射 AD 与 Azure AD 中的权限升级路径。合在一起，这些产品覆盖完整 AD
              安全生命周期：评估、检测、响应和恢复。

              Semperis 采用 B2B 企业 SaaS 商业模式，以订阅式授权收费。它的市场拓展策略把直营企业销售队伍 与渠道合作伙伴结合起来。免费提供的 Purple Knight 扮演漏斗顶部工具；组织通过
              Purple Knight 发现 AD 弱点后，往往会转化为付费 DSP 订阅。公司主要服务金融服务、医疗、政府 / 国防和关键基础设施等受监管行业。
