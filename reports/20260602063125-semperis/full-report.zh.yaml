      - number: '3.2'
        title: 竞争对手画像——规模、能力、定价与战略方向
        blocks:
          - type: paragraph
            body: >-
              Microsoft Defender for Identity（MDI）是 Semperis 面临的最关键竞争动态。MDI 是基于 Microsoft 传感器技术构建的云端 AD 威胁检测工具，消耗本地 AD
              域控制器流量，并为 80+ 攻击技术提供告警。它以零增量成本随 Microsoft 365 E5（$57/user/month）、 Microsoft Defender for Identity Plan
              2（E3 的 $5.50/user/month 附加项）或 Microsoft Defender XDR 套件提供。估计 70%+ 的 Semperis 企业客户已经持有 M365 E5 授权，使 MDI
              成为默认部署基线；客户必须为 Semperis 付费来补强这条基线。MDI 的实质限制 有文档可查：缺少自动响应预案；没有取证级 AD 回滚或森林恢复能力；混合（本地 / Entra
              ID）关联有限；还需要大量配置工作以降低 误报率。IBM X-Force 红队在 2025 年测试发现，MDI 只检测到所测 AD 攻击技术的 42%。Semperis 的销售话术正是直接利用这些 已记录的
              MDI 缺口。

              CrowdStrike Falcon Identity Protection 把身份信号加入 CrowdStrike 的终端情报平台，提供 AD 用户风险评分，并把终端事件与身份异常 交叉关联。定价通常是
              $8–15/endpoint/year，作为 Falcon Complete 或 Falcon Enterprise 套件的附加项。CrowdStrike 不提供 AD 森林恢复、 备份，也没有 Semperis
              DSP 所具备的 AD 专项攻击技术覆盖深度。不过，在 CrowdStrike 已是现有 EDR 厂商的账户中，Falcon Identity Protection 是低摩擦扩展，直接竞争 Semperis
              DSP 的检测层。CrowdStrike FY2026 ARR 为 $3.65B，客户基础 29,000+，拥有压倒性分销优势。

              Quest Software 是 AD 恢复和备份最直接的同业。Quest Recovery Manager for Active Directory（RMAD）在 AD 对象级和 tombstone 恢复市场
              领先 15+ 年，在企业和政府中有庞大装机基础。Quest 由 Francisco Partners 和 Cinven（私募股权）私有持有。Quest RMAD 聚焦单个对象恢复 和细粒度恢复——它不提供
              Semperis ADFR 规模的完整森林恢复。Quest Change Auditor 提供 AD 事件日志、审计和合规报告。Quest 经常在政府 和受监管行业账户中捆绑两款产品。定价通过企业谈判；估计大型
              Quest AD 部署 ARR 为 $100K–$500K+。Quest 的战略方向是拓宽 IT 管理， 而不是深化 AD 安全。

              Netwrix（纳入原 Stealthbits）聚焦 AD 审计、合规报告和数据安全。它的 AD Auditing Edition 与 Quest Change Auditor 在合规 / 审计用例中竞争。
              Netwrix 缺少与 Semperis 等价的 ITDR 威胁检测深度，也没有森林恢复能力。Netwrix 由 TA Associates 支持，正在向治理和合规市场定位。 Cayosoft
              是较小竞争对手，以低于 Semperis 的价格点，面向中端市场提供一体化 AD 管理和恢复平台，主要替代 5,000 人以下组织中的 Quest。

              CyberArk 的 Identity Security Platform 包括 Endpoint Privilege Manager 和 Identity Threat Detection 功能，与 ITDR
              能力部分重叠。 CyberArk 的主线动作是 PAM，但它正通过 Secure Browser 和 Identity Flows 产品主动扩展进身份威胁检测。CyberArk（NASDAQ: CYBR）在 Q4
              2024 报告 $974M ARR，在金融服务和关键基础设施中拥有重要装机基础——与 Semperis 目标账户重叠。CyberArk 更可能是 Semperis 的潜在收购方， 而不是纯竞争对手。
