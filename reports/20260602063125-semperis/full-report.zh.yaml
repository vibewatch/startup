      - number: '5.3'
        title: 信任、质量与合规
        blocks:
          - type: paragraph
            body: >-
              Semperis 的信任基础主要来自产品级合规对齐和第三方评价分数。DSP 内置 GDPR、HIPAA、PCI 和 SOX 合规报告包；这些模板可定期生成和分发，使受监管行业客户可以直接从 DSP
              生成审计证据。公司将 DSP 定位为覆盖最关键的 AD 安全合规控制，而不需要单独的报告基础设施。公司材料中提到其云托管和联邦行业产品符合 SOC 2 Type II 与 FIPS
              140-2，但本次研究未找到可公开访问的鉴证文件；对执行正式供应商评估的受监管买方来说，这是一个验证缺口。

              在第三方评价平台上，Semperis DSP 得分较强：G2 对比显示，主动威胁狩猎得分 9.7、支持质量 9.6、易用性 9.2、风险评分 9.0、自动化扫描
              8.1。公司称基于客户调研数据，其净推荐值（NPS）为 81。Peerspot 评论者强调安装便捷、生产环境可靠、Semperis 支持团队质量高，同时指出云环境集成深度仍可提升——MightyID
              收购部分补上了这一缺口。KuppingerCole 在 2025 年将 Semperis 评为 Identity Threat Detection and Response 类别 Leader。公司还入选
              Fortune 2024 年增长最快网络安全公司 Cyber 60 榜单，并进入 2026 Australian Cyber Awards 年度勒索软件安全提供商决赛名单。产品定位中提及 MITRE ATT&CK
              框架覆盖，但具体到技术级别的覆盖深度尚未通过外部来源独立验证。
