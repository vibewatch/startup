      - number: '6.4'
        title: 切换成本、合同耐久性与 NRR 证据缺口
        blocks:
          - type: paragraph
            body: >-
              Semperis 未公开任何净留存率（NRR）、总留存率（GRR）或流失率数据——这是客户尽调图景中最重大的单一信息缺口。不过，基于产品架构的结构性分析强烈支持高切换成本判断，尤其是以 ADFR
              为锚的客户。ADFR 嵌入企业灾难恢复运行手册、经过测试和验证的恢复预案，以及运营桌面演练计划。替换 ADFR 不只是换软件，而是要重建 DR
              框架、重新测试恢复流程，并与信息安全团队、通常还包括外部审计师重新认证恢复过程。这些切换成本真实存在，但并非合同锁定——注重成本的 CFO 可以强制要求替换。仅使用 DSP 做威胁检测的客户切换成本更低，因为
              Microsoft Defender for Identity 和 CrowdStrike Falcon Identity Protection
              提供了成本更低或零增量成本的替代检测路径。独立评价平台的客户满意度数据支持高留存判断：G2 240+ 条评论平均 4.7/5.0，Gartner Peer Insights 为
              4.4/5.0。常见满意度驱动因素包括恢复能力、支持质量和检测深度。常见抱怨包括相对捆绑替代方案定价偏高，以及大型混合环境部署复杂——这些信号与仅使用 DSP
              的客户面临续约审查相一致。基于同行评价披露，大型企业合同结构估计为 1 到 3 年。ADFR 锚定账户的总留存估计高于
              85%，与结构性切换成本分析一致，但这一估计尚未通过管理层披露确认。关键尽调要求：按产品线（ADFR 锚定 vs. 仅 DSP）和客户规模拆分的 NRR。
