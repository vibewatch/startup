      - number: '2.3'
        title: 细分与买方分析——谁购买 ITDR，为什么购买
        blocks:
          - type: paragraph
            body: >-
              ITDR 和 AD 安全采购集中在三类主要买方原型中，差异来自组织规模、监管暴露和技术成熟度。大型企业（10,000 名以上员工） 中，主要买方是 CISO 或安全 VP，身份架构团队影响很强，CIO
              负责签字。预算来自安全运营或身份基础设施预算线。这一细分的 采用触发因素，最常见的是数据泄露或险情后的事后整改要求，其次是董事会层面对网络韧性框架的压力。金融服务、医疗和关键基础设施 主导大型企业 ITDR
              支出。

              中端市场（2,000–10,000 名员工）中，买方通常是向 CTO 或 CIO 汇报的 IT Security Director 或 IT Director。 预算所有权由 IT
              运维和安全共享，采购更常由合规要求触发（CMMC、HIPAA、PCI-DSS 补充控制、欧洲组织的 NIS2），而不是 数据泄露经历。基于已披露赢单模式，这一细分是 Semperis 增长最快的市场。

              政府和国防买方销售周期更长（12–24 个月），但单笔交易价值更大、留存更高。CISA 的 SCuBA 指引和 M-21-31 联邦备忘录 已在联邦民用机构中催生合规驱动需求。Department of
              Defense CMMC 2.0 要求刺激了 10,000+ 员工层级的国防工业基础承包商需求。 服务中端客户的托管服务商（MSPs）是重要间接渠道——Semperis 在 2024 年披露了 MSP
              伙伴计划，MSP 采用能在 不增加直营销售成本的情况下创造经常性收入。

              医疗行业的紧迫性尤其高：针对医院 AD 的勒索软件攻击多次扰乱临床运营，包括 early 2024 的 Change Healthcare 事件；再叠加 HIPAA 监管义务，以及通常投入不足的 IT
              安全状态，使 ITDR 的 ROI 论证很有说服力。关键基础设施（能源、公用事业、水务）是一个 新兴买方细分，正受到 CISA 公告和 TSA 指令推动而加速。

              地理集中度：北美约占 ITDR 支出的 50%；欧洲占 30%（受 NIS2 推动加速）；APAC 占 15%（监管推力有限的增长市场）。 Semperis 已披露 EMEA 扩张为战略优先事项，并在 2024
              年开设 London 办公室。
