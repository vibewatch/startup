      - number: '1.3'
        title: 融资历史、估值与投资方基础
        blocks:
          - type: paragraph
            body: >
              从创立到 June 2024，Semperis 已在五轮公开披露融资中累计融资约 $368 million。公司最近一轮融资是 June 2024 完成的 $125 million 成长融资，由 J.P.
              Morgan Asset Management 和 Hercules Capital 领投，使 Semperis 以超过 $1 billion 的估值进入独角兽行列。上一轮大额融资是 2022 年初的 $200
              million Series C，构成公司成为独角兽前资本结构中的主体。

              June 2024 的 $125 million 轮采用股权与债务组合（成长融资）结构，符合 Hercules Capital 为高增长科技公司 提供贷款的典型模式。J.P. Morgan 的资产管理部门与
              Hercules 共同领投，意味着机构资金认可 Semperis 的市场位置 和财务轨迹。该轮融资同时伴随公司超过 $100M ARR 轨迹的公告，以及明确的 IPO 准备信号；Security Week 报道称
              Semperis 正在「eyeing an IPO」，并已「hired experienced executives with public market experience」。

              早期轮次包括约 2019–2021 年的 Series B，以及更早机构风险投资方参与的种子轮和 Series A。约 $368 million 的累计融资使 Semperis 成为 ITDR
              纯玩家中资金最充足的公司之一。早期轮次的完整投资方名称和经济条款没有完整公开， 形成围绕股权结构和清算优先权的尽调缺口。
