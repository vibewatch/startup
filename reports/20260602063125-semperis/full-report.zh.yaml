        - ARR 增长放缓至同比 < 20%；倍数压缩至 < 6x；悲观情景概率升至 60% 以上
        - 触发确认后 60 天内退出持仓；投资逻辑已破——没有缓释措施能修复核心 DSP 收入逻辑
      - - Microsoft 原生 AD 恢复侵蚀 ADFR 切换成本
        - Microsoft 在 Entra ID 或 Windows Server Update 中发布原生 Active Directory 林恢复，具备同等取证级干净恢复能力
        - 任意 12 个月窗口内，≥ 2 家公开点名的 Semperis 企业客户提到 ADFR 被替换
        - 留存护城河逻辑失效；悲观情景概率升至 60% 以上；ADFR 溢价收入承压
        - 退出或对冲持仓；继续持有前，重新评估 Entra ID 产品收入贡献
      - - 关键人物离任（CEO 或 CTO）
        - CEO Mickey Bresman 或 CTO Guy Teverovsky 宣布离任，且没有计划内 6 个月继任者重叠期
        - 初始投资后 24 个月内宣布非计划离任；90 天内未任命继任者
        - 投资者信心受冲击；IPO 可能延后；CTO 集中掌握 AD 安全 IP，R&D 连续性存在风险
        - 暂停后续投资；等继任安排清晰，并观察新领导层 180 天记录后再恢复
      - - 监管执法行动
        - CISA、BIS 或 SEC 对 Semperis 或其以色列 R&D 业务发出正式调查、违规通知或执法行动
        - 任何正式书面监管通知或已公告调查
        - 联邦客户流失；FedRAMP 授权面临复审风险；声誉受损，加速拉长企业销售周期
        - 30 天内启动退出复盘；进一步投入资本前，召集法律顾问评估
      - - 下调估值融资或融资失败
        - Semperis 下一轮股权融资的投后估值低于 $900M，或已宣布融资在公告后 90 天内未能交割
        - 已确认条款清单低于 $900M，或融资交割失败
        - 发出经营表现不及已披露里程碑的信号；清算优先权悬顶可能损害普通股价值
        - 确认后立即退出持仓；除非全面重组股权结构表，否则不参与下调估值融资
    notes: >-
      触发阈值用于识别投资逻辑驱动因素的实质性恶化，而非正常经营波动。DSP 续约率和 ADFR
      替换数据未公开披露，必须在尽调中通过管理层披露取得，或在投资后通过投资者报告权取得。监管触发因素适用于美国（SEC、BIS）以及以色列—美国双地运营的合规事件。所有行动含义都假设为无董事会控制权的少数股权投资；多数投资者可能拥有额外补救措施。
    claimRefs:
      - CV016
      - CV023
      - CV032
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调索取清单
    enumeration: false
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 净收入留存率（NRR）和总收入留存率（GRR）
        - 任何期间的 NRR 和 GRR 均未公开披露；公开来源没有可用代理指标
        - 切换成本逻辑的核心实证检验；没有 NRR，ADFR 留存护城河只是主张，未经验证；基准情景 ARR 增长假设 NRR > 100%
        - 在管理层会议中直接向 Semperis CFO 索取；要求披露过去 4 个季度 NRR 和 GRR，并按产品线（DSP 与 ADFR）拆分
      - - 客户集中度与 ARR 瀑布
        - 前 10 大客户 ARR 占比和合同到期时间表未公开披露
        - 前 10 大客户占比高于 30%，会在任意 12 个月窗口内制造实质性流失风险；合同续约时间表影响 IPO 收入可预测性叙事
        - 向 Semperis 财务团队索取 ARR 集中度瀑布、合同到期时间表，以及前 10 大客户行业和续约状态
      - - 股权结构表、优先股堆叠与债务契约
        - Insight Partners Series C 清算优先权条款和 Hercules Capital 债务契约结构未公开披露
        - 优先股悬顶可能在退出时显著压低普通股价值；Hercules Capital 契约可能限制运营灵活性并触发强制事件
        - 向 Insight Partners 主导合伙人索取；审阅 Hercules Capital 贷款协议，包括财务维持契约、最低流动性阈值和交叉违约条款
      - - FedRAMP High 授权路线图
        - FedRAMP High 授权时间表、赞助机构或进展里程碑均未公开披露
        - FedRAMP High 可打开 DoD 和美国情报界机会，估计带来 $50–100M 增量 ARR；没有已确认路线图，意味着这部分收入在投资期内仍属推测
        - 向 Semperis CISO 和联邦销售团队索取 FedRAMP High 授权路线图、已确认赞助机构和估计授权时间表
      - - 出口管制与 EAR 合规项目
        - 针对以色列开发的加密软件，EAR Part 730 合规状态、许可证例外覆盖范围或主动合规项目均未公开披露
        - Semperis 以色列 R&D 为美国联邦客户开发加密 AD 安全软件，带来实质性 EAR 合规义务；不合规罚款最高可达每次违规 $1M，并存在取消承包资格风险
        - 向 Semperis 总法律顾问索取出口管制合规文件；确认主动分类审查、许可证例外选择，以及针对涉密联邦数据处理的 ITAR 评估
    notes: >-
      五项尽调索取均属于因 Semperis 私有公司身份而结构性无法从公开来源获得的信息。第 1 项（NRR）和第 2 项（集中度）是会阻断投资的问题：若无法得到令人满意的答复，应暂停承诺。第 3 项（股权结构表）、第 4
      项（FedRAMP High）和第 5 项（出口管制）是实质性风险限定项，影响条款与结构设计；若有充分缓释，单独不会阻断承诺。投资后谈判取得的信息权应包括季度 ARR 和 NRR 报告、FedRAMP
      里程碑报告，以及任何监管问询发生后 10 个工作日内通知。
    claimRefs:
      - CV028
      - CV030
      - CV039
      - CV042
      - CV044
