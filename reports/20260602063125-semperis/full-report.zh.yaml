      - number: '8.4'
        title: 退出准备度、尽调问题与否决标准
        blocks:
          - type: paragraph
            body: >-
              Semperis 已经露出可信的 IPO 准备信号：2025 年 1 月确认跨过 $100M ARR，任命 CFO 说明财务报告能力在成熟，1,000+ 企业客户足以支撑 S-1 招股说明书所需的参考客户
              基础，Fortune 500 具名客户分布在航空、金融服务、医疗、零售等监管强行业，可承接机构 投资人兴趣，FedRAMP Moderate 授权也验证了联邦收入可信度。Insight Partners 的组合
              公司 IPO 经验，以及 J.P. Morgan Asset Management 领投成长轮，为其补上机构路径支撑。 现实退出窗口是 18-36 个月（IPO 窗口为 2027-2028 年），前提是 ARR
              增速持续高于 30%，且网络安全 SaaS 公共市场环境友好。战略并购是次要路径：CrowdStrike、Palo Alto Networks、Microsoft 和 Thales 都是可能买方；按 8-14x
              ARR 计算，在基准 ARR 假设下对应 $800M-$1.7B 退出区间。

              五个足以击穿投资逻辑的触发点需要持续盯住：DSP 续约率跌破 70%（Microsoft MDI 替代）、 Microsoft 原生 AD 恢复削弱 ADFR 切换成本、投资后 12 个月内 CEO/CTO
              非计划离职、监管 执法行动，或下一轮股权融资估值低于 $900M。任一触发点都会把乐观 / 基准情景的概率权重 明显推向悲观情景，并应启动退出复盘。

              投资承诺前有五项最终尽调要求不可让步：(1) 披露 NRR 和 GRR —— 没有这项，切换成本逻辑 无法验证，基准情景中的留存假设也无法压力测试；(2) 客户集中度瀑布 —— 前 10 大客户 ARR 占比超过
              30%，就会带来足以改写投资判断的流失风险；(3) 股权结构表和优先股堆叠 —— 必须审阅 Insight Partners Series C 优先权和 Hercules Capital 债务契约，才能看清普通股
              分配瀑布和运营灵活性限制；(4) FedRAMP High 路线图 —— 确认 High 授权时间表和发起机构， 才能释放估计 $50-100M 增量 ARR 的 DoD/IC 收入机会；(5) 出口管制合规文件
              —— Semperis 在以色列的研发涉及双用途加密软件，需要有效的 EAR 合规计划；若缺少文件，考虑到其美国 联邦客户基础，这就是重大监管风险。
            claimRefs:
