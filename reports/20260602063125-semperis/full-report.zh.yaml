  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价模型
        blocks:
          - type: paragraph
            body: >
              Semperis 运营订阅优先的 SaaS 收入模式，由两款旗舰产品支撑：Directory Services Protector（DSP）和 Active Directory Forest
              Recovery（ADFR）。

              DSP 按节点或用户作为年度经常性订阅授权，覆盖本地 Active Directory、混合 Azure AD（Entra ID）和 Okta 环境。ADFR 按企业森林层级授权，面向需要在数小时

              而不是数天内完成自动化、无恶意软件 AD 恢复的客户。这两款产品合计贡献 Semperis $100M+ ARR 基础中的绝大部分，尽管公司没有披露明确的产品级收入拆分。


              Purple Knight 是 Semperis 的免费 AD 安全评估工具，下载量已超过 75,600+，是付费 DSP 转化的主要需求生成漏斗。Forest Druid 是另一款免费的攻击路径分析工具，

              在 Tier 0 攻击面细分中发挥类似作用。这种免费增值到企业的动作，以近乎零增量获客成本创造高质量管线。Lightning IRP（Identity Incident Response Platform）

              是较新的收入流，面向 AD 专项事件响应项目，把可触达买方从预防扩展到主动响应。


              专业服务包括事件响应保留服务、部署项目和培训，只占总收入少数。Semperis 委托的 Forrester 2024 Total Economic Impact 研究量化了部署企业可获得的潜在节省，

              包括停机时间减少 90%、手工监控时间减少 40%。这些生产率指标支撑企业为高价订阅定价寻找论证。Semperis 不发布公开定价页；所有定价都通过直营企业销售项目或

              渠道合作伙伴报价完成。


              英国 ARR 在 January 2025 前两年增长超过 200%，说明订阅基础的国际扩张很强。公司连续四年获得 Deloitte Technology Fast 500 认可，进一步印证快速且持续的收入增长。

              收入质量较高：Active Directory 保护具备任务关键属性，意味着自愿流失低、多年企业合同，以及随着客户 AD 环境增长而扩张的潜力。主要收入确认风险是收入组合转向更多专业服务，

              这会稀释 ARR 质量，但目前尚未观察到这种转变。
