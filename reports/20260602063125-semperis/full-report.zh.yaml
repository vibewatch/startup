      - number: '2.4'
        title: 增长驱动、监管催化与市场约束
        blocks:
          - type: paragraph
            body: >-
              ITDR 需求的核心结构性驱动，是 Active Directory 被攻破在现代网络攻击中占据主导地位。CrowdStrike 的 2025 Global Threat Report
              记录，基于身份的攻击同比增长 71%，在超过 90% 的已观察勒索入侵中，AD 都是目标。Verizon 的 2025 Data Breach Investigations Report
              也记录，凭据被攻破是领先的初始访问向量，出现在 68% 的数据泄露中。这种普遍性形成了持续、 有证据支撑的需求信号，竞争对手很难将其抵消。

              监管要求是第二大需求催化剂，政府和受监管行业尤其明显。CISA 的 Zero Trust Maturity Model（v2.0, 2023）明确要求身份支柱控制， 包括持续身份威胁检测。EO
              14028（Executive Order on Improving the Nation's Cybersecurity, May 2021）要求联邦民用机构到 2024 年采用 Zero
              Trust，形成联邦采购管线。CMMC 2.0 Level 2（effective December 2023）要求 DoD 承包商实施访问控制和事件检测能力， 与 ITDR
              功能相吻合。在欧洲，NIS2（effective October 2024）和 DORA（effective January 2025）分别要求关键基础设施运营商和金融实体
              满足事件响应与运营韧性要求——两者都要求 Semperis 所提供的快速身份恢复能力。

              云身份扩散构成第三个结构性驱动：Microsoft Entra ID（原 Azure AD）全球月活用户已超过 700 million；本地 AD 与 Entra ID 同步的
              混合环境现在是企业主流架构。与纯本地部署相比，这种混合模型把攻击面扩大了一倍，因为攻击者可以攻破任一环境并转向另一个环境。

              主要市场约束包括：Microsoft 捆绑的 Defender for Identity（MDI）工具，已包含在 Microsoft 365 E5 和 Defender for Identity P2
              授权中，并以零增量成本提供基础 AD 威胁检测；来自 CrowdStrike 和 SentinelOne 的竞争压力，它们正在终端保护平台内扩展 ITDR 能力；
              预算整合压力，使安全团队围绕既有平台厂商精简工具；以及早期买方教育挑战——这个市场的定义术语（ITDR）直到 2022 年才被创造出来。 Microsoft
              捆绑威胁是分析师评论中最常被提及的反向风险，也是多位行业观察者认为 Semperis 在云身份细分护城河收窄、但在本地 AD 恢复中 仍然很强的主要原因。
