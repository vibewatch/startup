  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——身份安全、ITDR 与 AD 加固
        blocks:
          - type: paragraph
            body: >-
              身份安全市场涵盖一类工具和平台：它们发现、保护、检测身份系统中的威胁，并在系统被攻破后恢复——核心对象包括 Microsoft Active Directory（本地）、Microsoft Entra ID（云
              / 混合），以及 LDAP 目录、Okta/Ping 身份结构等 相邻身份存储。Gartner 在 2022 年 IAM Hype Cycle 中正式提出「Identity Threat Detection
              and Response」（ITDR） 这一新兴安全类别，承认攻击者已经从聚焦终端入侵，转向以身份为中心的横向移动。

              与 Semperis 最相关的市场边界由三个相互咬合的子细分构成。第一，AD Security and Hardening，包括持续评估和加固 AD 配置、检测错误配置、识别攻击路径的工具——Semperis
              Purple Knight 和 Forest Druid 位于这一层。第二，面向 AD 和混合身份的 ITDR，包括对 pass-the-hash、DCSync、Kerberoasting、password
              spraying 等身份攻击的实时检测和自动响应 ——Semperis Directory Services Protector（DSP）是这一层的旗舰产品。第三，AD Disaster Recovery and
              Cyber Resilience， 覆盖为勒索软件场景专门打造的备份、取证回滚和完整森林恢复——Semperis Active Directory Forest Recovery（ADFR）
              是主要解决方案。没有其他厂商能在企业规模上横跨全部三个子细分。

              通常不计入 Semperis 直接 TAM、但构成替代风险的相邻市场包括：Privileged Access Management（PAM，例如 CyberArk、
              BeyondTrust），它控制特权账户使用，但不做实时 AD 威胁检测；Identity Governance and Administration（IGA）， 它管理访问生命周期，但缺少攻击检测能力；更宽泛的
              SIEM/SOAR 平台，把 AD 遥测作为众多数据源之一接入；以及 Cloud Infrastructure Entitlement
              Management（CIEM），它关注云资源权限，而不是本地目录安全。Microsoft 自有工具 ——Defender for Identity（MDI）和 Entra ID Protection——是
              Semperis 必须替代或补强的主要已纳入市场替代品。

              Active Directory 的全球装机基础估计覆盖超过 95% 的 Fortune 500 企业，以及全球 1,000 人以上组织中的 90%+， 使 AD
              的持续存在几乎与企业身份基础设施同范围。如此宽的装机基础意味着，Semperis 的 TAM 与更广泛企业 IT 支出拥有 相同的地理和行业分布——集中于北美（45–55%）、欧洲（25–35%）和
              APAC（15–20%）。
