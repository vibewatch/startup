      - number: '6.2'
        title: Purple Knight 漏斗：从 65K 社区到 1,000+ 企业客户
        blocks:
          - type: paragraph
            body: >-
              Semperis 从 2014 年创立到 2025 年拥有 1,000+ 企业客户，路径遵循一个独特的产品驱动增长（PLG）漏斗，锚点是公司的免费 Active Directory 安全评估工具 Purple
              Knight。Purple Knight 自 2021 年起免费提供；截至 2025 年，已有超过 65,000 家组织下载或使用，形成庞大的漏斗顶部，其中一部分免费用户转化为付费的 Directory
              Services Protector（DSP）和 Active Directory Forest Recovery（ADFR）客户。1,000+ 付费企业客户里程碑对比 65,000+ Purple Knight
              社区，意味着免费到付费转化率约 1.5%——按 PLG SaaS 标准偏低，但完全符合 AD 安全工具长周期、多利益相关方的企业采购环境；从第一次 Purple Knight 扫描到购买，可能跨越 12–24
              个月。公司客户曲线估计从 2020 年约 100 家付费客户起步，并经历几个清晰阶段：2020 到 2022 年，一系列针对 Active Directory
              基础设施的高关注度勒索软件攻击（包括医疗健康、能源和交通行业攻击）为专用 AD 恢复工具创造了强需求拉力。2022–2023 年，Semperis 获得 FedRAMP Moderate
              授权，打开政府行业渗透。2023–2025 年，渠道伙伴计划扩张加速了中型企业账户获取。Semperis 披露的保护 100M+
              身份声明覆盖社区用户和付费用户合计，能说明部署规模，但无法拆出仅付费覆盖。公司未公开增长率或队列年份数据。
