  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接同业、平台与现状
        blocks:
          - type: paragraph
            body: >-
              Semperis 所处市场可分为四个竞争层级，每一层的战略意义差异很大。第一层是直接 AD 安全专门厂商，包括 Quest Software （Change Auditor 和 Recovery Manager
              for Active Directory）、Netwrix（AD Auditing Edition，2021 年收购 Stealthbits） 和 Cayosoft（面向较小企业的 AD
              管理与恢复）。这些厂商覆盖 AD 审计、加固，以及不同程度的备份和恢复等重叠用例。按收入规模看， Quest 是最强直接同业，估计 IT 管理收入 $500M+（AD
              产品只占其中一部分），在中端市场和政府账户中拥有庞大装机基础。Netwrix 主要 竞争审计与合规用例，检测较轻，也没有专门打造的森林恢复。Cayosoft 是较小厂商，面向中端组织提供一体化 AD/Azure
              AD 管理套件， 包含有限恢复功能。

              第二个竞争层级——也是对 Semperis 销售落地最具实质威胁的一层——由平台厂商构成，它们把身份威胁检测捆绑进更广泛的安全产品： Microsoft Defender for
              Identity（MDI）以零增量成本包含在 M365 E5 中，可检测 pass-the-hash、DCSync 和横向移动等常见 AD 攻击。 CrowdStrike Falcon Identity
              Protection 把 AD 相邻身份遥测与其占据主导的终端代理绑定。SentinelOne Singularity Identity、 Palo Alto Networks Cortex Identity 和
              IBM QRadar UEBA 都提供身份行为分析，与 Semperis DSP 能力部分重叠。

              第三层是存在部分重叠的相邻厂商，包括 CyberArk（PAM 领导者，其 Identity Security Platform 日益纳入 ITDR 相邻检测）、Okta （员工身份平台，在 Okta
              Privileged Access 中提供身份异常检测），以及 Microsoft 自有 Entra ID Protection（内置于 Entra ID 的
              条件访问和基于风险的身份信号）。这些厂商的主要采购场景不同，但在账户整合预算时可能挤占 Semperis。

              第四层——现状和免费工具——才是最常见的实际替代方案：多数企业 IT 团队主要靠原生 Windows 事件日志、Microsoft 免费的 BloodHound （Active Directory
              安全评估开源工具）和手工流程管理 AD 安全。BloodHound Community Edition 部署广泛，能执行攻击路径分析， 这也是 Semperis Forest Druid 覆盖的场景。现状是
              Semperis 替代的主要对象，尤其在首次进行结构化 ITDR 采购的中端账户中。
