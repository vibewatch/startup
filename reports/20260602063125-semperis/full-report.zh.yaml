      - number: '6.5'
        title: 先落地再扩张动作、集中风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Semperis 的先落地再扩张策略沿三条主线展开：产品交叉销售（DSP 客户加购 ADFR 或 Lightning IRP）、林覆盖扩张（现有企业客户增长或收购公司后增加更多 AD
              林），以及全球企业客户内部的地域扩张。从 DSP 威胁检测自然延伸到 ADFR
              恢复，是产品组合中价值最高的交叉销售——它增加了一个实质上不同的用例，预算所有者也不同（业务连续性，而不只是安全运营），并带来更高切换成本。对大型企业账户，ADFR 通常会把年合同价值增加
              $200K–$400K，构成每客户有意义的增购。该动作带来的扩张收入未单独披露，因此先落地再扩张投资逻辑的健康度仍不确定。最显著的集中风险来自大型企业账户依赖：考虑到 Semperis 在 2024 年
              Series C 中披露的约 $1.3–1.5B 估值，以及企业基础设施公司的典型 ARR 倍数，前 20 大账户很可能贡献超过 30% ARR——这是该阶段企业安全供应商的典型集中结构。通过 VAR 和 MSP
              伙伴的渠道依赖带来次级集中风险；如果主要转售商贡献了不成比例的新客户获取，就会放大风险。单一产品客户——只使用 DSP 或只使用 ADFR
              的客户——由于切换成本较低，是更脆弱的留存分部。没有客户被公开识别为贡献超过 10% ARR，但缺少披露限制了尽调可见度。北美约 60% 的地域集中度，也压制了在高增长 EMEA 和 APAC
              企业安全市场中的扩张叙事。
