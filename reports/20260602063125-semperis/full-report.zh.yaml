  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与模块架构
        blocks:
          - type: paragraph
            body: >-
              Semperis 将商业产品统一放在 Identity Resilience Platform 之下；截至 2026-05-11 本次运行日，该平台包含六个主要产品模块。Directory Services
              Protector（DSP）是旗舰付费产品，持续、实时监控本地 Active Directory 和混合 Entra ID 环境。DSP 通过获得专利的无代理复制日志（DFS/USN
              journal）分析捕捉每一次 AD 变更，并可自动回滚对 AD 对象的未授权修改。产品内置面向 GDPR、HIPAA、PCI 和 SOX
              的合规报告模板，支持多林部署，并按被利用可能性和影响为每个安全指标打风险分。

              Purple Knight 是一款免费社区工具，用于扫描 AD 和 Entra ID 环境中的暴露指标（IOE）和入侵指标（IOC）。2026 年发布的 4.2
              版本将评分口径改为只关注“failed”指标，而不是所有指标，信号更聚焦。Purple Knight 现已支持 Microsoft Government cloud，覆盖范围延伸到美国联邦机构。Forest
              Druid 同样免费，采用由内向外的攻击路径管理思路：它不枚举所有攻击者路径，而是先定义 Tier 0 资产，再从这些资产反向映射所有权关系。Forest Druid 首次亮相于 Black Hat USA。

              Active Directory Forest Recovery（ADFR）是高端恢复产品，支持以网络攻击为先、无恶意软件的 AD 林恢复。ADFR
              在全新、干净的硬件上编排林恢复每一步——元数据清理、Global Catalog 重建、站点拓扑重组——避免裸机恢复把恶意软件重新带回环境。ADFR 还提供对象级恢复向导，并用 AES-256 加密把备份存储在
              Azure Blob Storage。Lightning Identity Runtime Protection（Lightning IRP）加入运行时攻击检测——DCSync、Golden Ticket
              伪造、Kerberoasting——用行为信号补足 DSP 基于变更的检测。2026 年 2 月收购 MightyID 后，平台覆盖范围扩展到 Okta 和 Ping Identity 环境，使 Semperis
              成为唯一宣称能在单一平台内完整覆盖混合 AD + Entra ID + 云 IdP 纵深防御的供应商。
