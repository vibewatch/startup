companyProfile:
  summary: |
    Semperis 是一家网络安全公司，围绕 Active Directory 与 Microsoft Entra ID 环境做出了领先的
    身份威胁检测与响应（ITDR）平台。公司 2013 年成立于 Hoboken, NJ，创始团队包括 CEO Mickey
    Bresman、CTO Guy Teverovsky 和业务发展 EVP Matan Liberman。它切入的是一个关键却长期供给不足的
    攻击面：Active Directory。AD 为 90%+ Global Fortune 1000 组织管理身份与访问，也是勒索软件和
    国家级攻击中的 #1 目标。Semperis 的五产品 Identity Resilience Platform（Directory Services
    Protector、AD Forest Recovery、Lightning IRP、Purple Knight 和 Forest Druid）是唯一覆盖混合
    AD/Entra ID 环境持续检测、实时保护与具备网络攻击意识恢复的套件。公司在 January 2025 跨过
    $100M ARR，拥有 1,000+ 家企业客户，累计融资 $368M，并在 June 2024 进入独角兽行列。
