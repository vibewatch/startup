      - number: '5.2'
        title: 技术架构与基础设施
        blocks:
          - type: paragraph
            body: >-
              Semperis DSP 的核心技术架构是无代理。DSP 不在域控制器上部署软件代理，而是被动读取 AD 复制流——DFS/USN journal——在变更沿 AD
              结构传播时捕捉每一次变更。这种方式非侵入式：不修改 AD，不安装内核模式驱动，也不影响 DC 稳定性。根据官方产品文档，DSP 专为处理全球最大型 AD 环境的变更量而设计，针对多林部署中高频的每日和每小时 AD
              更新做了处理优化。

              部署形态覆盖本地、云端（Azure）和混合模式。ADFR 进一步扩展云端覆盖，将 Azure Blob Storage 作为加密备份目标（AES-256），即便本地存储被毁，也能保留恢复点。对多林组织，ADFR
              提供单一管理服务器和门户，可同时编排多个林和多个地理分发点的恢复。Lightning IRP 用基于 ML 的异常检测补足 DSP，识别仅靠变更日志分析会漏掉的进行中攻击，例如完全发生在内存中的 DCSync
              冒充和 Golden Ticket 伪造模式。

              Semperis 通过 REST API 接入 Microsoft Sentinel、Splunk、ServiceNow 等主流 SIEM/SOAR 平台，让安全运营团队无需新增中间件，就能把 DSP
              告警导入现有响应流程。平台对 Entra ID 的覆盖与本地 AD 覆盖相互对应：DSP 监控 Entra ID 配置变更，Purple Knight 则按与本地 AD 相同的 IOE/IOC 类别扫描
              Entra ID。2026 年 2 月收购 MightyID 后，Okta 和 Ping Identity 也被纳入同一套持续暴露管理和防篡改变更追踪框架，形成统一的混合身份安全底座。
