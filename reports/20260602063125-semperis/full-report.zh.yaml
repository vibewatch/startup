  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Semperis 所处环境高度受监管，四条不同的监管风险线共同形成累积合规义务。最重要的是 GDPR 和 UK GDPR 责任：Semperis 为欧盟和英国企业客户处理 Active Directory
              目录数据。AD 对象包含 GDPR Article 4(1) 定义下的个人数据——全名、电子邮件地址、电话号码、职务和组织成员关系——因此 Semperis 是数据处理者，需根据 Article 28 与每个欧盟
              / 英国客户签署合规的数据处理协议（DPA）。不合规罚款可达全球年营业额的 4% 或每次违规 2000 万欧元，以较高者为准。Semperis 正接近 $100M+
              ARR，且欧盟客户在企业账户中占有实质份额，因此汇总罚款暴露在结构上很重要。ICO 已确认，脱欧后 UK GDPR 作为平行制度继续适用，在许多情况下，同一客户数据会产生双重合规义务。

              美国出口管理条例（EAR Part 730 et seq.）下的出口管制合规是第二条独立风险线。Semperis 在以色列 Tel Aviv 设有 R&D 中心，开发密码学安全软件，包括 Active
              Directory 加密密钥处理、Kerberos Golden Ticket 检测和加密备份验证。EAR 将两用网络安全软件纳入管制；加密项目的商业出口需要许可例外。出口合规失败可能导致最高每次违规 $1M
              的罚款、被禁止参与美国政府合同，以及许可证撤销。公司源自以色列、拥有美国联邦客户基础、技术范围又涉及密码学，这一组合使任何被处理的涉密联邦数据都带来更高 ITAR 敏感性。

              FedRAMP 授权是第三项监管风险：根据 FedRAMP marketplace，Semperis 的 Directory Services Protector 持有 FedRAMP Moderate
              授权，但尚未取得 FedRAMP High 授权；在要求 High 授权的敏感联邦民用机构和 DoD 场景中，可服务收入因此受限。授权缺口会在取得 High 前压住联邦收入上限，而该过程通常需要 12 到 24
              个月。SEC Cybersecurity Disclosure Rule（Reg S-K Item 106，2023 年 12 月生效）要求上市公司在 4
              个工作日内披露重大网络安全事件；作为上市公司客户的供应商，Semperis 客户发生任何被认定为重大的 AD 事件，都可能牵涉供应商关系。Semperis 最终 IPO 后，公司自身也将受所有 Form 8-K
              和年报网络安全披露义务约束。CIRCIA 强制报告规则还会带来额外的间接合规义务，因为关键基础设施客户必须向 CISA 报告事件，并可能在受影响环境中点名 Semperis 作为技术供应商。
