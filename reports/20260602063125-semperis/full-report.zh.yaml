      - number: '8.2'
        title: 估值框架与情景
        blocks:
          - type: paragraph
            body: >-
              Semperis 是一家高增长 SaaS 公司，未公开 EBITDA 利润率或自由现金流情况，因此最适合用 ARR 倍数估值。基于 2025 年 1 月已确认里程碑，以及从披露里程碑推断的 40-60% YoY
              增长轨迹，2026 年初 ARR 估计为 $100-120M，锚定估值区间。倍数选择来自三个基准：CrowdStrike 公开市场估值约为 16-19x 远期 ARR，是安全平台上限；Rubrik IPO
              先例为安全加恢复叙事给出 12-15x 过去 ARR；身份行业 M&A 可比公司中，SailPoint 为 10-12x，Ping Identity 为 7-8x。网络安全 SaaS 倍数从 2022
              年峰值（20-30x ARR）压缩到 2026 年（成长阶段私营公司 8-15x ARR），这是结构性现实，任何入场价格都必须折价反映。

              乐观情景（20% 概率信号）：在 ITDR 市场加速、AI 身份安全需求和 Entra ID 扩展成功推动下，ARR 达到 $150-180M。按 12-18x ARR，隐含 EV 为 $1.8-3.2B，反映
              IPO 前溢价。关键上行情景假设包括 NRR 高于 120%、通过 FedRAMP High 授权扩大联邦 ARR，以及 CrowdStrike 保持互补平台伙伴角色，而不是成为正面 ITDR 竞争者。

              基准情景（55% 概率信号）：ARR 达到 $110-130M，按 8-12x ARR，对应隐含 EV 为 $880M-$1.56B。该情景假设增长温和延续、DSP 续约率高于 80%，且在 ADFR
              差异化最有说服力的企业层级，Microsoft MDI 竞争仍可管理。2024 年 6 月成长轮（$1B+ 估值）对应的当前市场条件支撑基准底线。

              悲观情景（25% 概率信号）：随着 Microsoft MDI 捆绑推动 DSP 出现实质替代，且 ARR 增长降至 20% 以下，ARR 达到 $80-100M。按 5-7x ARR，隐含 EV 为
              $400-700M，低于 2024 年 6 月 $1B+ 轮估值，意味着估值下调融资情景。触发因素包括 DSP 续约率下降、联邦客户流失，或 Insight Partners 在市场周期不利时点被迫退出。

              估值敏感性显示，在基准 ARR 假设下，ARR 倍数每增加 2x，就会增加 $200-300M EV。以 $1.3B 或更低价格入场，可捕捉到通往乐观情景的有意义上行空间，同时相对悲观底线提供 30-40%
              下行缓冲；这也支撑了带保护性结构要求的买入投资逻辑。
