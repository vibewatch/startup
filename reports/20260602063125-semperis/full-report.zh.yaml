      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              Semperis 最灾难性的运营风险，是自身平台和面向客户基础设施遭遇网络安全入侵。Semperis 在客户域控制器上部署轻量代理，并在自身云基础设施中托管取证干净的 AD 备份副本。一旦 Semperis
              自有系统被攻破，可能暴露企业中最敏感的一类目录数据，并让攻击者有能力大规模入侵客户 AD 环境。同行网络安全供应商的先例——SolarWinds（2020 年供应链后门影响 18,000
              个安装）、Okta（2022-2023 年多起入侵影响数千客户）、CrowdStrike（2024 年 Falcon 传感器更新导致全球 IT 中断，影响 8.5 million 台 Windows
              系统）——说明身份和端点安全供应商是高价值攻击目标，入侵后果也远超直接客户。根据安全信任中心，Semperis 维持 SOC 2 Type II 鉴证和安全信任计划，但这些控制无法完全消除风险。

              Microsoft MDI 捆绑威胁是发生概率最高的重大运营风险。Microsoft Defender for Identity（MDI）已包含在 Microsoft 365 E5 和 E5 Security
              订阅中，无需额外成本，而这些订阅在 Semperis 企业客户基础中已被广泛采用。续约时，承受预算压力的 IT 采购团队会例行评估 MDI 是否足以满足其 AD 监控需求。虽然 Semperis DSP
              提供更深的取证调查、Active Directory Forest Recovery 和 Purple Knight 审计能力，而 MDI 无法复制这些能力，但零成本的 MDI
              替代方案会在每个企业续约周期制造显著定价压力。

              在域控制器上进行基于代理的部署，会带来独立的运营风险：DSP 代理处理实时 AD 变更事件，并需要兼容 Windows Server 和域控制器补丁级别。代理更新与客户补丁周期不兼容，可能引发客户 AD
              运营事故。Semperis 通过分阶段部署管理这一点，但域控制器的敏感性会放大任何代理层事故对客户信任的伤害。

              中期结构性风险是 Active Directory 市场过时。Microsoft Entra ID 是本地 AD 的云原生后继者；随着企业完成向 Entra ID 的云身份迁移并降低对本地 AD 的依赖，本地
              AD 安全工具的可服务市场会收缩。Semperis 已投资 Entra ID 安全产品能力，但长期 TAM 走势取决于企业迁移的彻底程度和速度。分析师估计，这主要是 5 到 10
              年维度的风险，而非眼前风险；但其结构性不可逆，仍需持续监控。
