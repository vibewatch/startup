  - id: TP001
    title: 竞品画像表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Enumeration of primary competitive vendors in the ITDR, AD security, and identity threat detection space based
        on KuppingerCole ITDR Leadership Compass 2025, Forrester Now Tech ITDR Q1 2025, Wavestone AD security tools
        report 2026, and Semperis' public competitive positioning. Excludes vendors with <1% market presence; emerging
        ITDR startups below Series A are excluded. Free/open-source tools (BloodHound CE) included as status-quo
        substitute.
    columns:
      - 竞品
      - 类别
      - 规模 / 融资
      - 主要目标细分
      - 关键差异化
      - 相对 Semperis 的实质限制
    rows:
      - - Microsoft Defender for Identity（MDI）产品
        - 捆绑式平台替代品
        - 包含在 M365 E5（$57/user/month）中；未披露独立 ARR；Microsoft FY2025 收入 >$245B
        - 所有企业级 Microsoft 客户（Fortune 500 的 70%+）
        - E5 中增量成本为零；与 Microsoft XDR 生态原生集成；常见 AD 攻击覆盖广
        - 无 AD 林恢复；无取证回滚；自动化响应有限；检测深度低于 Semperis DSP（IBM X-Force 测得技术覆盖率 42%）
      - - CrowdStrike Falcon Identity Protection
        - 平台端点 + 身份捆绑包
        - CrowdStrike FY2026 ARR $3.65B；Falcon Identity Protection 是增购 SKU；客户 29,000+
        - 现有 CrowdStrike 端点客户（大型企业）
        - 统一端点与身份遥测；利用现有客户群低摩擦增购；威胁图谱关联更强
        - 无 AD 林恢复；针对 AD 的检测深度弱于 Semperis；需要 CrowdStrike EDR 基础；非 CrowdStrike 账户成本更高
      - - Quest Software（RMAD + Change Auditor）产品组合
        - 垂直 AD 备份 / 审计厂商
        - Quest Software 估计总收入 $700M+；由 Francisco Partners 和 Cinven PE 支持；深耕 AD 管理 >25 年
        - 企业和政府；Quest 装机基础（AD 产品客户 10,000+）
        - 15+ 年 AD 备份 / 恢复装机基础；政府关系；捆绑 AD 管理套件
        - 没有达到 Semperis ADFR 规模的专用林恢复；恢复停留在对象级，不是全林；ITDR 检测能力更弱；PE 持有，投资受限
      - - Netwrix AD Auditing（含 Stealthbits）产品
        - AD 审计与合规
        - Netwrix：TA Associates 支持，估计 ARR $150–300M；2021 年收购 Stealthbits
        - 需要 AD 合规报告的中端市场和受监管行业
        - 合规 / 审计报告能力强；整合 Stealthbits 带来部分 AD 安全能力；定价有竞争力
        - 无 AD 林恢复；ITDR 检测深度较浅；主要用例是审计 / 合规，不是检测 / 响应
      - - SentinelOne Singularity Identity
        - 平台端点 + 身份捆绑包
        - SentinelOne FY2025 ARR $858M；Singularity Identity 是加购模块
        - SentinelOne 端点装机基础（中型到大型企业）
        - 身份信号与端点遥测集成；作为 SentinelOne 捆绑加购，定价有竞争力
        - 针对 AD 的检测深度仍在早期；无恢复能力；需要 SentinelOne 基础
      - - Cayosoft
        - AD 管理 + 恢复（中端市场）
        - 私营，种子 / Series A 阶段；团队小；估计 ARR < $20M
        - 中端市场（1,000–5,000 名员工）；手工 AD 管理已经不够用的组织
        - AD 管理集成部分恢复功能，价格更低；UX 简单
        - 企业级恢复能力有限；Entra ID ITDR 未做到同等能力；合作伙伴生态更小；长期可持续性未知
      - - CyberArk Identity Security Platform 身份安全平台
        - 相邻 PAM/身份平台（部分重叠）
        - CyberArk (CYBR) Q4 2024 ARR $974M；金融服务和关键基础设施装机基础大
        - 受监管行业的企业 PAM 买方（BFSI、医疗健康）
        - PAM 市场领导者；向身份安全平台扩张；金融服务品牌强
        - 主要用例是 PAM，不是 AD 专用 ITDR；无林恢复；买方不同（PAM 团队与 AD/安全团队）
      - - BloodHound CE（开源 / SpecterOps）
        - 现状替代品（免费攻击路径分析）
        - 免费社区版；SpecterOps BloodHound Enterprise：$50K–$200K ARR（SaaS）
        - 安全研究团队；具备 AD 安全专业能力的组织；预算受限组织
        - 免费社区版；采用广泛；攻击路径可视化强
        - 无威胁检测或监控；无 ITDR 响应；无恢复；解读结果需要 AD 安全专业能力
    notes: 私营公司规模估计基于二手研究和分析师报告。CrowdStrike 和 SentinelOne 数字来自公开业绩披露。Quest 和 Netwrix 数字来自分析师报告估计。MDI 定价来自 Microsoft 公开价目表。
