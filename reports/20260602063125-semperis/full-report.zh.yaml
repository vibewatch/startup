      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Semperis 由 Mickey Bresman（CEO）、Matan Liberman（业务发展 EVP）和 Guy Teverovsky （首席技术官）联合创立。Bresman
              是公司的公众面孔和首席执行官，经常出现在新闻稿和客户公告中。 Liberman 负责业务发展战略和伙伴关系。Teverovsky 领导技术架构和产品工程团队，打造了专注 AD 的平台。
              自公司成立以来，创始团队一直保持稳定领导——在安全关键基础设施产品中，关键人物的连续性直接影响客户信任， 这一点构成重要差异化。

              随着 Semperis 为潜在 IPO 做准备，公司引入了有经验的企业软件和公开市场高管。根据 Security Week 报道，公司专门招聘了有公开市场转型经验的高管。这类组合——引入具备上市公司背景的 CFO
              和 CRO 级人才—— 通常出现在 IPO 前 12–24 个月的公司中。

              关键人物风险为中等，主要集中在 CEO Mickey Bresman 身上。他既是公司外部发言人，也是战略决策者， 与投资者关系、客户信心和市场定位绑定很深。公司没有公开披露继任计划。创始团队继续覆盖
              CEO、EVP BD 和 CTO 角色，提供了组织知识连续性；但这也意味着，如果多位联合创始人同时离开，将会成为公司稳定性的 重大反向信号。
