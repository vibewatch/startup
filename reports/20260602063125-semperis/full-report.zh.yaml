      - number: '7.4'
        title: 人员、执行与否决标准
        blocks:
          - type: paragraph
            body: >-
              CEO Mickey Bresman 是 Semperis 面向投资者关系、战略合作和政府参与的主要外部代表。如果他离任，IPO 执行、投资者信心和政府行业销售拓展都会出现不确定性。CTO Guy
              Teverovsky 是核心 AD 安全与恢复知识产权的主要技术架构师。技术深度和组织知识集中在这两个角色上，形成显著关键人依赖，而标准继任规划只能部分缓解。

              以色列 R&D 的地缘集中风险，是最具运营实质性的人员风险。Semperis 工程团队高度集中在以色列 Tel Aviv。2023 年 10 月开始的 Israel-Hamas
              冲突已经扰乱多家以色列科技公司运营，包括预备役征召影响工程人员规模。地缘焦虑、美国公司竞争性录用邀请或人身安全担忧驱动的人才流失，可能降低 R&D 速度。业务连续性规划和 R&D 地理多元化可以缓解风险，但如果
              Tel Aviv 运营遭受严重冲击，重建工程产能至少需要 12 到 24 个月。Parsippany, NJ 和 Tel Aviv 的双总部结构带来管理开销、时区协调摩擦和文化整合挑战，并会在压力下被放大。

              IPO 执行风险是近期投资逻辑风险。2022 年 3 月确立的 $1.4B 估值和 2024 年 $125M 成长轮，使投资者期待流动性事件。IPO 准备需要聘请面向公开市场的 CFO、搭建 SOX
              合规基础设施、完成 S-1 申报，并维持足以支撑 IPO 估值的 ARR 增长。如果在不利市场窗口过早 IPO，可能形成估值下调融资，损害员工士气、客户信心和 Semperis
              品牌。下方标准表列出了本章记录的主要风险线的具体监测阈值和投资逻辑破裂触发条件。投资者应监测 TR005 中的五个阈值，并把两个绝对触发条件——MDI 驱动的 NRR 持续压缩，以及 Semperis
              发生重大安全入侵——视为需要立即重新评估投资逻辑的事件。
