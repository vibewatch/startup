      - number: '4.2'
        title: 单位经济与销售效率
        blocks:
          - type: paragraph
            body: |
              Semperis 没有公开披露单位经济，但可以通过产品定位、市场可比公司和有限公开信号进行三角测算。包括 CyberArk 和 SentinelOne 等可比上市公司在内的企业身份 SaaS 公司，
              毛利率通常落在 70-85% 区间。考虑到 Semperis 是纯软件交付模式，没有显著硬件成分，其毛利率很可能位于这一区间，尽管具体数字仍不可得。

              市场拓展动作是高接触企业销售模型，把直营企业销售与渠道合作伙伴结合起来。AWS Marketplace 上架能缩短拥有 AWS 云预算企业的采购周期。客户获取成本（CAC）未披露，
              但企业身份安全销售周期通常为 6-18 个月，涉及多个部门利益相关方。这意味着单账户 CAC 较高，但可由任务关键安全基础设施合同的高客户终身价值（LTV）抵消；一旦深度集成，
              这类合同具备显著切换成本。

              净收入留存率（NRR）是 Semperis 这一阶段 SaaS 公司最重要的单位经济指标，但公司没有披露。鉴于 Active Directory 保护的任务关键属性，以及 Semperis 围绕企业范围覆盖的
              明确定位，NRR 很可能高于 115% 到 120%，与顶级身份安全 SaaS 同业一致。Purple Knight 的 75,600+ 免费下载，代表一批已经接触 Semperis 方法论和平台的合格组织管线，
              降低了这一队列向 DSP 转化的有效 CAC。

              Ransomware Risk Report 2025 发现，78% 的受访组织在过去 12 个月内遭到勒索软件攻击，代表持续需求压力，会缩短 AD 安全投资决策周期。每个企业 DSP 部署的年度合同价值
              估计为 $100,000 到 $500,000+，取决于 AD 环境规模。在 $100M+ ARR 和 1,000+ 家企业客户基础下，隐含的单客户平均 ARR 约为 $100,000，与大型企业定价动态一致。
              关键尽调要求，是获取实际 CAC、LTV、回本周期、NRR 和 GRR 队列数据。
