      - number: '1.5'
        title: 反向信号、关键风险与尽调提示
        blocks:
          - type: paragraph
            body: >
              Semperis 最重要的结构性风险，是 Microsoft Active Directory 能否继续保持企业身份基础设施的主导地位。 Microsoft 正在主动推广 Microsoft Entra ID（原
              Azure Active Directory），把它作为本地 AD 的云原生替代路径； 如果迁移加速，DSP 和 ADFR 主要保护的传统 AD 环境装机基础可能缩小。Semperis 的应对方式，是把 DSP
              覆盖扩展到 混合 Entra ID 环境，并把自己定位为不绑定具体身份基础设施的 ITDR 平台；但 AD 日落带来的长期 TAM 风险是真实的。

              叠加风险来自 Microsoft 自身通过 Microsoft Defender for Identity（MDI）和 Microsoft Entra ID Protection 直接竞争。两者都为
              Microsoft 365 E5 订阅者提供部分重叠的 AD 威胁检测能力，而且没有增量成本。已经承诺大额 Microsoft 授权的企业可能会认为 MDI「足够好」，从而抗拒为第三方平台额外投入 ITDR
              预算。Semperis 在取证深度、 攻击路径分析（Forest Druid）和森林恢复（ADFR）上形成差异化——这些能力 MDI 并未复制——但 Microsoft 捆绑产品带来的 定价压力是一股持续逆风。

              其他风险包括企业客户集中、私人公司没有 SEC 报告义务导致财务信息不对称、关键人物风险集中在 CEO 和联合创始团队、 若公开市场环境恶化可能出现 IPO 时点风险，以及来自 CrowdStrike
              Falcon Identity、Varonis 和 Netwrix 的竞争压力。
