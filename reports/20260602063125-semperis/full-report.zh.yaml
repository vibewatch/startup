  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: >-
      有向无环图，展示主要风险事件如何传导到 Semperis 的投资相关结果。Microsoft MDI 捆绑和 FedRAMP 授权失效都会通过 ARR 压缩，最终传导到估值倍数压缩。Semperis
      软件被攻破会通过客户信任侵蚀传导到估值冲击和 IPO 受扰。控制节点会部分拦截特定风险向量。所有路径最终都汇聚到 IPO 延迟或受扰这一投资者退出风险结果。
    data:
      nodes:
        - id: risk-microsoft
          label: Microsoft MDI 捆绑
          detail: M365 E5 中免费 MDI 在续约时替代 DSP；这是 Semperis 企业客群最可能的 ARR 压缩路径
          type: risk
        - id: risk-security-breach
          label: Semperis 软件被攻破
          detail: 代理部署在域控制器上；供应链被攻破会打开灾难性的客户 AD 访问权限，并带来监管责任和品牌毁损
          type: risk
        - id: risk-export-control
          label: EAR/ITAR 出口暴露
          detail: 以色列-美国双地运营；网络安全双用途技术分类；美国联邦客户基础让涉密数据处理场景产生 ITAR 敏感性
          type: risk
        - id: risk-fedramp
          label: FedRAMP 授权失效
          detail: 失去 FedRAMP Moderate 授权会让民用联邦采购资格消失；政府 ARR 面临风险；High 授权缺口限制 DoD 和 IC 收入
          type: risk
        - id: risk-israel
          label: 以色列研发地缘政治风险
          detail: 多数工程力量集中在特拉维夫；若冲突持续造成中断，会削弱所有 Semperis 产品的交付速度和路线图执行
          type: risk
        - id: impact-arr
          label: ARR 压缩
          detail: Microsoft 捆绑、FedRAMP 失效或平台整合导致续约损失，将收入增长率压到投资者预期和 IPO 可比公司之下
          type: impact
        - id: impact-trust
          label: 客户信任侵蚀
          detail: 安全厂商遭攻破或监管执法行动会损害企业身份安全市场中的品牌可信度；客户续约流失加速
          type: impact
        - id: impact-valuation
          label: 估值倍数压缩
          detail: 收入增长放缓和信任侵蚀会把 ITDR 倍数压向商品化基础设施水平；IPO 定价窗口收窄
          type: impact
        - id: impact-ipo
          label: IPO 延迟或受扰
          detail: 重大监管行动、被攻破、收入不达预期或研发中断会迫使 IPO 延迟或降估值融资；每轮延迟都会加大 Insight Partners 的退出压力
          type: impact
        - id: control-fedramp
          label: FedRAMP 合规控制
          detail: 现有 Moderate 授权正在主动维护；High 授权流程待启动；专职合规团队管理年度评估日历
          type: control
        - id: control-sdlc
          label: 安全 SDLC 与代码签名
          detail: SOC 2 Type II 证明、代码签名流水线、安全信任中心计划，可部分拦截供应链攻破风险向量，但无法消除
          type: control
      edges:
        - from: risk-microsoft
          to: impact-arr
          label: MDI 在续约时替代 DSP
        - from: risk-fedramp
          to: impact-arr
          label: FedRAMP 失效使联邦收入消失
        - from: risk-israel
          to: impact-arr
          label: 研发中断拖慢产品交付
        - from: risk-security-breach
          to: impact-trust
          label: 被攻破摧毁品牌可信度
        - from: risk-export-control
          to: impact-trust
          label: 执法行动损害客户信心
        - from: impact-arr
          to: impact-valuation
          label: 增长放缓压缩倍数
        - from: impact-trust
          to: impact-valuation
          label: 信任侵蚀削弱定价权
        - from: impact-valuation
          to: impact-ipo
          label: 倍数压缩收窄 IPO 窗口
        - from: control-fedramp
          to: risk-fedramp
          label: 合规控制降低失效风险
        - from: control-sdlc
          to: risk-security-breach
          label: 安全 SDLC 可部分拦截入侵
    approximationNotes: DAG 边由正文记录的因果逻辑推导；确切因果权重基于判断。五个主要风险节点都可能独立触发估值倍数压缩；最可能的传导路径是 Microsoft MDI 到 ARR 压缩，再到估值压缩，最终到 IPO 延后。
    claimRefs:
      - CR012
      - CR016
      - CR024
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: >-
      依赖关系图展示 Semperis 平台的关键输入，以及它服务的客户细分。Microsoft Active Directory 是基础平台依赖。投资方依赖 （Insight Partners、J.P. Morgan 和
      Hercules Capital）约束资本可得性与退出时点。FedRAMP 授权机构控制美国联邦客户准入。 以色列研发中心提供工程能力。OEM 合作伙伴 Cohesity 把分销放大到数据基础设施买家。
    data:
      nodes:
        - id: dep-microsoft
          label: Microsoft Active Directory
          detail: 核心市场之所以存在，是因为 AD 主导企业身份验证；Semperis 的产品相关性依赖 Microsoft 掌控的平台；Entra ID 的迁移轨迹是长期生存级依赖风险
          type: dependency
        - id: dep-insight
          label: Insight Partners
          detail: 多轮融资的主要财务支持方；在资本配置、高管招聘和退出时点上有董事会影响力；LP 动态会影响二级市场压力
          type: dependency
        - id: dep-jpmorgan
          label: J.P. Morgan / Hercules Capital 融资方
          detail: 2024 年 $125M 成长轮领投方；Hercules Capital 提供的债务部分包含财务维持条款；具体契约条款未公开披露
          type: dependency
        - id: dep-cohesity
          label: Cohesity OEM 合作
          detail: Cohesity Identity Resilience 由 Semperis 技术驱动；双方联合营销的数据与身份韧性解决方案，把分销放大到 Cohesity 的企业客户群
          type: dependency
        - id: dep-fedramp-body
          label: FedRAMP 授权机构
          detail: FedRAMP Moderate 授权决定联邦民用采购资格；要维持状态需每年重新评估；DoD 和 IC 细分需要 High 授权
          type: dependency
        - id: dep-israel-rnd
          label: 以色列研发中心
          detail: 核心工程多数集中在 Tel Aviv；交付 DSP、ADFR、Purple Knight 和 Forest Druid 的产品开发；地缘政治风险影响交付连续性
          type: dependency
        - id: semperis-core
          label: Semperis 平台
          detail: DSP、ADFR、Purple Knight 和 Forest Druid 交付给 1,000+ 家企业客户；多产品套件交叉销售渗透率在提高
          type: process
        - id: customer-federal
          label: 美国联邦机构
          detail: 依赖 FedRAMP 的政府客户细分；估计占 ARR 的 10-15%；面向关键基础设施保护、与 CISA 对齐的用例
          type: actor
        - id: customer-enterprise
          label: Fortune 500 企业
          detail: 主要收入基础；1,000+ 家企业客户；DSP + ADFR 的多产品扩张是主要 ARR 增长打法
          type: actor
      edges:
        - from: dep-microsoft
          to: semperis-core
          label: AD 平台提供产品市场
        - from: dep-insight
          to: semperis-core
          label: 股权资本与治理
        - from: dep-jpmorgan
          to: semperis-core
          label: 债务融资与 IPO 对齐
        - from: dep-cohesity
          to: semperis-core
          label: OEM 分销放大
        - from: dep-fedramp-body
          to: customer-federal
          label: 授权卡住联邦采购
        - from: dep-israel-rnd
          to: semperis-core
          label: 工程能力与产品交付
        - from: semperis-core
          to: customer-federal
          label: 平台交付给联邦机构
        - from: semperis-core
          to: customer-enterprise
          label: 平台交付给企业客户
    approximationNotes: 依赖类型来自新闻稿、FedRAMP 市场和产品文档中可公开观察的关系。Hercules Capital 财务契约细节按 BDC 投资组合公司贷款的常见做法估算；实际条款需要尽调访问权限才能确认。
    claimRefs:
      - CR022
      - CR025
      - CR027
      - CR028
      - CR029
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: >-
      决策链从 Semperis 已验证的规模和护城河强度出发，经过风险评估和估值校验，落到带保护性结构要求的买入建议。每个节点代表一个独立尽调关口，必须通过后才进入下一决策阶段。该流程确认，尽管存在 Microsoft
      捆绑风险，ADFR 切换成本、FedRAMP 公信力与入场价格纪律的组合，支撑有条件买入。
    data:
      nodes:
        - id: scale-proof
          label: 规模与验证
          detail: 2025 年 1 月确认 ARR 超过 $100M；1,000+ 家企业客户；已点名 Fortune 500 客户（AA、ADP、Lenovo、United、Starbucks）——规模门槛达到独角兽级别
          type: process
        - id: moat-strength
          label: 护城河韧性
          detail: ADFR 切换成本嵌进 DR runbook；Purple Knight 的 65K+ 社区用户形成自然获客管线护城河；FedRAMP Moderate 构成联邦竞品进入壁垒
          type: process
        - id: market-position
          label: 市场位置
          detail: >-
            唯一同时覆盖检测（DSP）+ 恢复（ADFR）的纯 ITDR 厂商；KuppingerCole 2025 年 Leader；$6–8B TAM 以 25–30% CAGR 增长；企业级规模下没有可直接对标的独立纯
            ITDR 公司
          type: process
        - id: risk-assessment
          label: 风险评估
          detail: Microsoft MDI 捆绑是主要结构性威胁；ADFR 的 DR 集成可部分缓解；以色列研发的地缘政治风险真实但可管理；未披露 NRR 是主要证据缺口
          type: process
        - id: valuation-check
          label: 估值校验
          detail: 基准情景 $880M–$1.56B（$110–130M ARR 的 8–12x）；2024 年成长轮 $1B+ 确认底部；较 2022 年 $1.4B 高点回落，反映板块倍数压缩 30–50%
          type: process
        - id: recommendation
          label: 建议：买入
          detail: 在低于 $1.3B 的入场价启动投资，并配置保护性结构（NRR 契约、反稀释、下行保护条款）；身份安全是关键基础设施投资主题，IPO 退出窗口为 18–36 个月
          type: process
    approximationNotes: 流程逻辑是综合多源证据搭出的分析框架；单个节点断言由证据声明 CV001–CV044 支撑。节点顺序反映尽调优先级，不代表因果时间顺序。买入建议以投资前满足 TV006 中五项尽调要求为条件。
    claimRefs:
      - CV001
      - CV012
      - CV014
      - CV026
      - CV029
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: >-
      将八种 ARR 倍数情景套用到 Semperis 估算 ARR 后得到的隐含企业价值，从悲观底部（$100M ARR 用 5x = $500M EV）到乐观上限（$150M ARR 用 18x = $2.7B
      EV）。图表显示，在基准 ARR 假设下，ARR 倍数每提高 2–3x，EV 增加 $200–450M，确认现阶段主要估值杠杆不只是 ARR 增长，而是倍数选择。
    data:
      items:
        - label: 悲观 5x ARR（$100M 基准）
          value: 500
        - label: 悲观 7x ARR（$100M 基准）
          value: 700
        - label: 基准 8x ARR（$120M 估算）
          value: 960
        - label: 基准 10x ARR（$120M 估算）
          value: 1200
        - label: 基准 12x ARR（$120M 估算）
          value: 1440
        - label: 乐观 15x ARR（$150M 估算）
          value: 2250
        - label: 乐观 18x ARR（$150M 估算）
          value: 2700
        - label: CrowdStrike 上市公司类比 17x
          value: 2040
    approximationNotes: >-
      ARR 数字均为估算：$100M 是已确认底部（2025 年 1 月公告）；$120M 是 2026 年初基准估算，按已确认底部增长 20–30% 推出；$150M 是乐观估算，基于同比增长
      40–60%。倍数来自可比公司集合（TV004）。CrowdStrike 类比把 CrowdStrike 约 17x 的前瞻倍数套用到 Semperis $120M ARR，作为示意性上限。所有数值单位为百万美元。
    claimRefs:
      - CV017
      - CV020
      - CV021
      - CV022
      - CV036
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: >-
      企业价值区间覆盖六个参考点：Semperis 悲观情景、基准情景、乐观情景、2022 年 Series C 估值锚、2024 年 6 月成长轮底部，以及 Ping Identity 战略并购可比交易。图表确认，低于 $1.3B
      入场可获得相对基准和乐观情景的显著上行，同时相对 $400–700M 的悲观底部保留缓冲。
    data:
      items:
        - label: 悲观情景 EV 区间
          low: 400
          high: 700
        - label: 基准情景 EV 区间
          low: 880
          high: 1560
        - label: 乐观情景 EV 区间
          low: 1800
          high: 3200
        - label: 2022 年 Series C 估值锚
          low: 1400
          high: 1400
        - label: 2024 年成长轮锚
          low: 1000
          high: 1200
        - label: 身份领域 M&A 可比交易（Ping Identity）
          low: 1500
          high: 3000
    approximationNotes: >-
      所有区间均为估算，来自 ARR 倍数敏感性分析（TV003）和可比交易价值（TV004）。2022 年 Series C 锚点是 SEC Form D 与 GlobeNewsWire 报道确认的投后估值 $1.4B。2024
      年成长轮锚点公开报道为“$1B+”——低端为 $1.0B，$1.2B 高端是估算，反映成长轮相对上一轮常见的估值上调。Ping Identity 可比区间低端代表 Thales 收购价（$2.8B），高端代表按可比 ITDR
      市场倍数估算的同等公司隐含乐观情景。所有数值单位为百万美元。
    claimRefs:
      - CV006
      - CV020
      - CV021
      - CV022
      - CV033
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: >-
      投资委员会从七个维度打分——市场位置、客户验证、护城河强度、单位经济、主要风险、估值立场和证据质量——给出 Semperis 投资准备度的 IC
      快照。市场、验证和护城河是优势项；单位经济与证据质量是承诺投资前尽调必须补齐的缺口。
    data:
      nodes:
        - id: kpi-market
          label: 市场位置
          detail: 唯一同时覆盖检测 + 恢复的纯 ITDR；$6–8B TAM 以 25–30% CAGR 增长；FedRAMP Moderate；KuppingerCole 2025 年 Leader；Gartner ITDR 认可
          type: strength
        - id: kpi-proof
          label: 客户验证
          detail: 1,000+ 家企业客户；已确认点名 Fortune 500 客户；2025 年 1 月跨过 $100M ARR 里程碑；已确认美国联邦客户基础
          type: strength
        - id: kpi-moat
          label: 护城河强度
          detail: ADFR DR runbook 切换成本；Purple Knight 65K+ 社区形成自然企业线索；FedRAMP Moderate 构成联邦竞品进入壁垒；受监管垂直行业替换周期 3–5 年
          type: strength
        - id: kpi-economics
          label: 单位经济
          detail: ARR 估算约 $100–120M；同比增长估算 40–60%；NRR 未披露（关键缺口）；毛利率估算 > 70%（SaaS 可比）但未确认；烧钱速度未知
          type: risk
        - id: kpi-risk
          label: 主要风险
          detail: Microsoft MDI 捆绑进 M365 E5，形成零成本 DSP 替代；AD 市场在 5–10 年云迁移周期中可能过时；以色列研发地缘政治集中；Hercules Capital 债务契约
          type: risk
        - id: kpi-valuation
          label: 估值立场
          detail: 公允价值 $880M–$1.56B（基准 8–12x ARR）；上一轮为 2024 年 6 月 $1.0B+；$1.3B 或以下入场价格纪律关键；较 2022 年 $1.4B 高点回落，源于板块倍数压缩
          type: neutral
        - id: kpi-evidence
          label: 证据质量
          detail: 中等——$100M ARR 已确认，点名 Fortune 500 客户已确认；NRR 未披露，毛利率未披露，股权结构不透明，出口管制姿态未知
          type: neutral
    approximationNotes: >-
      优势 / 风险 / 中性评级是基于全部公开证据的分析判断，不代表数字分数。单位经济节点被评为风险，并非因为经济性确定很差，而是缺少 NRR 和利润率数据，无法靠公开证据独立验证。估值立场只反映基准情景区间；乐观和悲观情景区间见
      TV003 与 FV003。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV019
      - CV026
      - CV028
      - CV036
      - CV039
