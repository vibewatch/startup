summary:
  headline: >
    SHEIN combines one of the most powerful demand-sensing and supply-chain engines in global consumer internet with one
    of the

    heaviest regulatory, legal, and reputational overhangs in retail; the business is too large and capable to dismiss,
    but the

    current risk stack and uncertain IPO path support TRACK rather than an aggressive buy posture.
  overallScore: 6.4
