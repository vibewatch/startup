evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership and founder table
    missingEvidence: Board roster, committee composition, and delegated authority between Chris Xu and Donald Tang.
    whyItMatters: Founder-control risk and governance readiness cannot be assessed from public pages alone.
    diligencePath: Request corporate governance deck, board observer list, and latest shareholder agreement.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO027
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder or investor map
    missingEvidence: >-
      Complete cap table, investor roster, ownership percentages, liquidation preferences, and secondary-transfer
      clearing prices.
    whyItMatters: Valuation interpretation and control analysis remain incomplete without capital-structure evidence.
    diligencePath: Request latest financing documents, tender materials, and cap-table export.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO017
      - QO027
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: milestone table
    missingEvidence: Primary-source archive for early legal-entity and naming transitions from ZZKKO to SheInside to SHEIN.
    whyItMatters: Early-history claims rely on secondary summaries and should not be overstated in later chapters.
    diligencePath: Pull original Chinese incorporation records, historical domains, and archived company pages.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: audited financial transparency
    missingEvidence: Audited income statement, cash flow, and current-period margin disclosure.
    whyItMatters: Revenue scale and profitability are central to valuation, but public evidence is still indirect.
    diligencePath: Request audited annual accounts, quarterly board packs, and KPI bridge used for IPO workstreams.
    relatedQuestionRefs:
      - QO018
      - QO019
      - QO027
  - type: missing-source
    severity: material
    topic: narrow SAM for cross-border low-price fashion retail
    missingEvidence: >-
      A credible third-party global revenue estimate for the exact cross-border, low-price fashion retail segment in
      which SHEIN competes most directly.
    whyItMatters: >-
      Without a clean SAM, any market-share claim risks mixing broad online apparel with a much narrower operating
      wedge.
    diligencePath: >-
      Request sell-side retail research or internal market sizing decks that isolate cross-border fashion GMV and order
      frequency.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: post-tariff unit economics
    missingEvidence: >-
      Order-level landed-cost bridge showing tariff pass-through, shipping subsidy, and gross-margin effect after de
      minimis changes.
    whyItMatters: >-
      The biggest forward-looking market question is whether SHEIN can keep impulse prices low enough to preserve
      conversion under a tougher customs regime.
    diligencePath: >-
      Request current pricing waterfall, destination-country shipping costs, and weekly conversion before/after tariff
      changes.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: repeat purchase and cohort retention
    missingEvidence: Cohort retention, repeat-purchase cadence, and app reopen frequency by geography and consumer segment.
    whyItMatters: >-
      Mobile-download leadership alone does not prove durable market power if repeat purchase weakens under price
      pressure or trust concerns.
    diligencePath: Request cohort dashboards, MAU/DAU bridge, and repeat-order curves from the growth team.
    relatedQuestionRefs:
      - QM027
  - type: stale
    severity: minor
    topic: regional fast-fashion share comparables
    missingEvidence: >-
      Fresh 2024-2026 region-level share data for Europe and Latin America comparable to the Second Measure and NIQ
      snapshots.
    whyItMatters: Current public share evidence is strong but patchy by geography and year.
    diligencePath: Pull more recent regional panel data or retailer disclosures covering the same competitive set.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: No clean public win-loss or cohort-retention data versus Temu
    missingEvidence: Direct retention, order frequency, and cross-shop data comparing Shein and Temu by market.
    whyItMatters: >-
      Low switching costs are central to moat durability, but public traffic and app data do not reveal behavior-level
      loyalty.
    diligencePath: Request cohort retention and coupon-response data by cohort and geography.
    relatedQuestionRefs:
      - QP012
      - QP015
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: Marketplace take-rate and seller economics remain undisclosed
    missingEvidence: Marketplace commission rates, seller mix, subsidy policy, and refund/chargeback burden.
    whyItMatters: Platform expansion could improve monetization or simply add complexity without attractive unit economics.
    diligencePath: Request marketplace economics, seller cohorts, and compliance loss rates from management.
    relatedQuestionRefs:
      - QP010
      - QP023
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: Relative trust advantage is easier to infer than to quantify
    missingEvidence: Comparable brand-trust or NPS survey data across Shein, Temu, Zara, and H&M.
    whyItMatters: The legal and regulatory narrative suggests a trust gap, but current public evidence is mostly qualitative.
    diligencePath: Obtain third-party customer-trust benchmarking or returns-satisfaction data.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: Cider public scale disclosure is thin
    missingEvidence: Recent disclosed revenue, users, or order scale for Cider.
    whyItMatters: Cider is strategically relevant as a narrow digital-native rival, but its relative scale remains fuzzy.
    diligencePath: Search for recent investor or analyst coverage and request management deck if available.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: stale
    severity: minor
    topic: Second Measure and NielsenIQ comparison snapshots are not 2026-native operational data
    missingEvidence: Fresh 2026 competitor share and assortment-speed comparisons from the same publishers or comparable datasets.
    whyItMatters: The structural story is strong, but the timing of public competitor datasets lags current conditions.
    diligencePath: Refresh with newer transaction or panel data when available.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: No public cash, debt, burn, or runway disclosure
    missingEvidence: Cash balance, debt facilities, monthly burn, and runway scenarios.
    whyItMatters: Capital adequacy cannot be fully underwritten without direct liquidity data despite the company’s scale.
    diligencePath: Request treasury dashboard, debt agreements, and board-approved runway scenarios.
    relatedQuestionRefs:
      - QI018
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: No public gross-margin bridge by business line
    missingEvidence: Gross margin by first-party, marketplace, and services, plus returns burden and discounting.
    whyItMatters: >-
      Headline sales and even net profit do not reveal whether growth is economically attractive or increasingly
      subsidized.
    diligencePath: Request management P&L bridge and margin decomposition by line of business.
    relatedQuestionRefs:
      - QI017
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: material
    topic: 2025 sales and valuation figures diverge across secondary sources
