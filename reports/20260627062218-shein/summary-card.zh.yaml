summary:
  headline: |
    SHEIN 同时握着全球消费互联网里最强的一套需求感知和供应链引擎，也背着零售业最重的监管、法律和声誉包袱之一；这家公司规模够大、能力够强，不能轻易排除，但当前风险堆叠和 IPO 路径不明，更适合 TRACK，而不是激进买入。
