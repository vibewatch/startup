  topStrengths:
    - SHEIN 的按需运营把选品、试产和补单压进一套速度-价格系统，传统服装同行至今难以追上。
    - 公司已跑到少见的私营企业规模：据报道年销售额达数百亿美元，覆盖 150+ 个国家，品类也从女装扩到更多消费场景。
    - 消费者发现路径在 TikTok、Instagram 和应用商店之间迁移，SHEIN 仍靠移动分发、促销设计和趋势响应撑起持续获客飞轮。
    - SHEGLAM、SHEIN X、转售和一体化 marketplace 给公司留下了扩张变现的余地，不必只靠最初的自营快时尚核心。
    - 供应商赋能投入、合规工具和更正式的治理结构说明，管理层正试图把一家长期跑得比内控更快的公司制度化。
  topRisks:
    - UFLPA、de minimis 改革、关税升级和跨境海关审查，都可能直接削弱 SHEIN 的价格优势，并冲击其核心发货模式。
    - 劳工实践指控和供应链不透明仍是公司最大的单一治理包袱，可能拖慢甚至打断其在主要市场的 IPO 执行。
    - 版权、商标和类敲诈勒索诉讼会抬高累计法律成本，也会侵蚀信任，并增加交易对手或监管方限制平台的风险。
    - Temu 正在争夺同一批低价移动购物用户，而 Zara、H&M、Amazon 等既有玩家在信任、线下服务或物流上仍占更强位置。
    - 相比公司的风险画像，私募市场估值标记仍然偏高；政策不确定、且缺少经审计的公开披露时，这一点更突出。
  unresolvedGaps:
    - 没有经审计的公开财务报表披露收入质量、现金转换、营运资本强度或自由现金流的准确情况。
    - 当前私有股权结构表、优先股堆叠以及任何 IPO 相关老股安排均未公开披露。
    - 公开材料只能部分看见供应商集中度、准确工厂数量和完整审计级合规结果。
    - 公开证据尚未解释客户队列留存、复购集中度，或各区域盈利能力。
    - 最终 IPO 地点、时间、估值区间，以及中国 / 英国监管审批顺序仍不确定。
