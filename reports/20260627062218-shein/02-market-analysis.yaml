callouts:
- calloutType: insight
  title: The right comparable is a market stack, not a single TAM label
  body: 'SHEIN lives inside a very large online-apparel TAM, but its true competitive arena is much narrower: mobile-first, cross-border, low-price fashion retail. Treating those layers as identical either overstates the addressable market or understates the policy sensitivity.'
  claimRefs:
  - CM001
  - CM004
  - CM005
  - CM017
  - CM033
  - CM034
- calloutType: strength
  title: Assortment velocity is not just merchandising flair; it is a market-share weapon
  body: 'NielsenIQ’s 315,000-new-item figure and Sacra’s small-batch explanation point to the same market mechanism: cadence itself is a source of demand capture. In this category, consumers are not only buying clothes; they are buying constant novelty at low risk to their wallet.'
  claimRefs:
  - CM015
  - CM016
  - CM031
  - CM039
- calloutType: risk
  title: De minimis and tariff changes attack the model at its economic center
  body: The cross-border low-price fashion wedge only works if landed cost stays low enough to preserve impulse conversion. USCC and CNBC together imply that the post-2025 environment can shrink that advantage materially, which means market growth and SHEIN growth may now diverge.
  claimRefs:
  - CM017
  - CM027
  - CM028
  - CM029
  - CM030
  - CM042
