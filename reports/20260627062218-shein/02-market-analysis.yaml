- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Smartphone-led online shopping adoption
    - Driver
    - Structural / ongoing
    - Expands the broad online-apparel TAM and supports app-first retail habits
    - What share of orders and repeat sessions comes from app vs web by major geography?
  - - Value-seeking consumer behavior / off-price orientation
    - Driver
    - 2025 onward
    - Supports low-ticket fashion baskets even in softer macro periods
    - How much price elasticity can SHEIN absorb after tariff and customs changes?
  - - On-demand small-batch replenishment
    - Driver
    - Ongoing
    - Raises conversion odds by aligning assortment with real-time demand and lowering inventory risk
    - What share of SKUs get reordered after first batch, and on what time lag?
  - - De minimis closure and customs tightening
    - Constraint
    - Immediate / 2025 onward
    - Directly pressures cross-border price advantage and conversion economics
    - What is the landed-cost increase by average order value and destination market?
  - - Forced-labor, product-safety, and consumer-protection scrutiny
    - Constraint
    - Ongoing
    - Raises trust friction, compliance cost, and valuation discount
    - What remediation steps are measurable enough to restore trust and reduce enforcement risk?
  - - Tariffs and trade-policy volatility
    - Constraint
    - Immediate / ongoing
    - Can compress margins or force price hikes, reducing repeat-purchase frequency
    - What tariff pass-through has already been implemented, and how has conversion changed?
  notes: The table separates category growth drivers from SHEIN-specific operating constraints. The broad market can grow even while SHEIN’s narrow wedge becomes harder to monetize.
