    {
      "id": "final-diligence-and-thesis-breakers",
      "title": "Final diligence asks and thesis-break triggers",
      "body": "The missing work for an investor is unusually concrete. Public evidence still does not provide prospectus-grade detail on audited EBITDA, free cash flow, inventory, working-capital intensity, customer acquisition cost, cap-table preferences, or how much of the model can migrate away from China without killing value-for-money. That matters because the debate is no longer about whether SHEIN has scale; it clearly does. The debate is whether its scale deserves a normal public-market multiple once duties, compliance cost, and listing friction are fully internalized. Until those missing items are disclosed, the upside case is always easier to describe than to underwrite. Investors should therefore insist on a diligence pack that converts current narrative advantages into measurable economics. If the company cannot provide that before listing, or if the next filing confirms weaker margins, harder trade-policy transmission, or fresh labor/IP setbacks, then even the current discounted range may prove too generous.",
