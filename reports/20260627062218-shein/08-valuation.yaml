  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "SHEIN is too large to dismiss and too controversy-exposed to value like a normal premium apparel winner. The 2023 $66B fundraise, the 2024 ~$45B secondary mark, and 2025 IPO pressure toward roughly $30B–$50B together suggest the market is already applying a discount, but not one that makes the stock obviously cheap without audited disclosure. The current evidence supports a research-more / track stance, with fair value most defensible around $35B–$45B and meaningful upside only if profit durability, tariff resilience, and a credible listing route become clearer."
  },
  "sections": [
    {
      "id": "pricing-context-and-private-marks",
      "title": "Private marks, profit pressure, and IPO context",
      "body": "SHEIN’s valuation discussion has become less about whether the company is large and more about what kind of discount the market should apply to a scaled but controversy-exposed retailer. Public reporting gives three usable anchors. First, the 2023 fundraising round put the company around the mid-$60 billions. Second, private secondary marks discussed in early 2024 were nearer $45 billion. Third, 2025 reporting around the London IPO described a market debate that had already drifted toward roughly $50 billion and, in some investor-pressure scenarios, closer to $30 billion. Those moves were not random. They tracked weaker profit reporting, higher trade-policy pressure, and the continuing inability to secure a clean, low-friction listing route across the U.S., U.K., China, and Hong Kong. The key inference is that SHEIN is no longer being valued as a frictionless hyper-growth story. It is being valued as a very large retailer whose exit route and margin durability both need heavier discounting than conventional fast-fashion peers.",
