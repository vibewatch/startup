callouts:
- calloutType: strength
  title: The core moat is a demand-led supply loop, not a classic fashion brand
  body: The strongest repeatable advantage in the source set is not design prestige or owned manufacturing capacity. It is the ability to read customer demand in real time, place unusually small first batches, and replenish only what converts. That model lowers inventory risk, speeds trend response, and explains why a China-centered contractor base can support global scale.
  claimRefs:
  - CO009
  - CO010
  - CO012
  - CO033
  - CO034
  - CO041
- calloutType: risk
  title: IPO optionality is real, but the discount rate is now regulatory
  body: 'By 2025 SHEIN had enough size to keep a London listing alive, including reported FCA approval. But the same period also concentrated the exact risks investors will price hardest: de minimis changes, tariffs, labor allegations, EU consumer-law scrutiny, and a deep IP-litigation docket. The practical outcome is that public-market access cannot be separated from policy and compliance remediation.'
  claimRefs:
