- calloutType: insight
  title: SHEIN is already broader than a single app, but not yet transparent like a listed platform
  body: Brand extensions such as SHEGLAM, Missguided, Happy Returns, and the Brand Accelerator show a company building commerce infrastructure and adjacent revenue vectors beyond ultra-fast apparel. Yet the same public record still lacks audited revenue, a full cap table, and a clear board map. Investors are being asked to underwrite platform breadth before receiving platform-grade disclosure.
