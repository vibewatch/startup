      - number: '1.2'
        title: Founders, Leadership, and Governance Posture
        blocks:
          - type: paragraph
            body: >-
              Leadership concentration is high. Chris Xu is the persistent founder-control figure across official and
              independent sources, even though the naming conventions vary between Chris Xu, Xu Yangtian, and the
              official-facing Sky Xu. Donald Tang plays a distinct but important role as executive chairman and as the
              voice used for investors, partners, and public-market communication. That split suggests founder control
              combined with a professionalized external-facing layer for fundraising and IPO navigation rather than a
              broad, transparently disclosed executive bench.


              Governance transparency remains materially weaker than operating visibility. SHEIN’s governance page
              speaks extensively about privacy, product safety, compliance, and supplier-security standards, but public
              disclosures still do not resemble the executive, board, or committee transparency investors would expect
              from a listed retailer. That gap matters because the company is trying to market an increasingly
              institutional governance story while it remains dependent on founder control, third-party manufacturers,
              and trust in internal compliance systems that outsiders cannot inspect in detail.


              The company has nevertheless built more formal governance signals than it had a few years ago. Annual
              sustainability reports, supplier-audit disclosures, and repeated messaging around privacy and compliance
              indicate a deliberate pre-IPO packaging effort. Those steps improve process visibility but do not resolve
              the core diligence questions around board independence, committee composition, or the exact division of
              authority between Chris Xu, Donald Tang, and the Singapore holding structure.
            claimRefs:
