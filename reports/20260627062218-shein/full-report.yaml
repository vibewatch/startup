      - number: '4.2'
        title: 'Margin path, working capital, and logistics: asset-light in one sense, operationally heavy in another'
        blocks:
          - type: paragraph
            body: >-
              Shein’s economic structure appears asset-lighter than a classic store fleet because much of the assortment
              is shipped cross-border and sourced through third-party manufacturers instead of being stocked through a
              vast owned retail footprint. Marketplace expansion and partner-brand services likely reduce inventory
              intensity further by allowing Shein to monetize assortment and traffic without owning every item sold. But
              “asset-light” should not be confused with “cash-light” or “margin-simple.” The company’s own reporting
              shows continuing supplier-investment, compliance training, returns infrastructure, and process-improvement
              spending. Sacra’s estimate that stable fulfillment costs let a Q1 2025 volume spike turn into margin is
              encouraging, yet it is also a reminder that logistics is a core economic lever, not back-office plumbing.
              The public record never gets to the variables an investor would actually need to model durable economics:
              gross margin, returns rate, discount-adjusted ASP, customer-acquisition cost, payback, or burn. H&M’s
              annual report is useful precisely because it shows what good disclosure looks like; Shein still does not
              provide the equivalent bridge from net sales to gross profit to operating income.
