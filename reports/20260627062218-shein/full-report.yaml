      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand side still has real growth drivers. Research and Markets points to smartphone penetration,
              online-shopping habit formation, and digital infrastructure as structural supports for e-commerce apparel.
              McKinsey’s fashion outlook adds a macro lens: off-price channels and value-seeking behavior remain
              powerful, helping explain why low-price digital fashion can keep taking attention even in a choppy
              consumer environment. SHEIN’s own on-demand system intensifies these drivers because it compresses the
              cycle between trend detection and purchasable inventory.


              The constraint side is just as important. USCC makes clear that de minimis shipping rules historically
              mattered to the model, and CNBC said the closure of the U.S. de minimis loophole, possible similar moves
              elsewhere, and broader customs tightening have materially worsened the outlook. That is not just a margin
              issue; it goes directly to conversion because higher landed costs erode the core value proposition that
              underpins repeat purchase in cross-border low-price fashion.


              The trust stack is the second major constraint. CNBC and USCC both preserve the same cluster of overhangs:
              forced-labor concerns, product-safety and consumer-protection scrutiny, sustainability skepticism, and IP
              disputes. The overall market is therefore still growing, but SHEIN’s specific wedge inside it is becoming
              more policy-sensitive and more expensive to sustain than it looked during the pandemic hypergrowth era.
            claimRefs:
