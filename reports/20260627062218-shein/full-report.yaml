  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The right way to define SHEIN’s market is as a layered stack rather than a single label. The broad TAM is
              global e-commerce apparel, where external market research provides actual dollar sizing. Inside that sits
              the behavioral niche of fast fashion and ultra-fast fashion, where consumers prioritize trend
              responsiveness and low ticket sizes over brand heritage. Inside that, again, sits SHEIN’s most direct
              competitive arena: cross-border, mobile-first, low-price fashion retail shipped from a China-centered
              supply base to end consumers. Defining the market this way avoids the two common errors in SHEIN analysis:
              calling the company merely “apparel e-commerce,” which is too broad, or treating it as a pure fast-fashion
              peer of Zara and H&M, which misses the cross-border app-marketplace dynamic.


              Included spend should therefore cover online apparel, fashion-led accessories, and adjacent low-ticket
              lifestyle items that are merchandised as part of the same shopping mission. Excluded spend should include
              luxury apparel, most offline apparel spend, and broad non-fashion marketplace GMV that does not share the
              same price, trend, and discovery mechanics. That exclusion logic matters because consumers can substitute
              across Zara, H&M, Temu, Amazon Fashion, and Cider, but they do so for different reasons: some compete on
              branded curation, some on extreme value, and some on marketplace breadth.


              Official sites reinforce that this is not a pure apparel-only market. SHEIN, Temu, H&M, and Amazon all
              present fashion alongside home, beauty, and accessory adjacencies. The practical conclusion is that
              analysts should model SHEIN against online apparel first, fast-fashion share second, and cross-border
              low-price retail economics third.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM018
              - CM019
              - CM040
              - CM041
