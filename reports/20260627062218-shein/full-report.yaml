  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner / diligence path
    rows:
      - - Audited profitability
        - Full audited EBITDA, gross margin, free cash flow, and working-capital bridge
        - Without these, even the base case is still an estimate stacked on estimated revenue.
        - Request prospectus-grade financial package or audited statements under NDA.
      - - Cap table and preference stack
        - Latest share classes, liquidation preferences, option pool, and any special investor protections
        - Public valuation talk is not equivalent to common-equity fair value.
        - Request legal cap-table summary and new-money preference schedule.
      - - Tariff pass-through
        - Observed price, conversion, and margin effect after de minimis and duty changes
        - The low-price thesis depends on whether SHEIN can keep traffic while repricing.
        - Request geography-by-geography post-policy performance dashboard.
      - - Sourcing diversification
        - Evidence on how much sourcing or routing has moved away from China-linked sensitivity
        - A cleaner supply chain could justify a narrower risk discount.
        - Request country mix, lead times, and landed-cost comparison before and after diversification.
      - - Regulatory / legal closure
        - Current status of labor, customs, and major IP disputes in any listing venue diligence materials
        - These are the overhangs most likely to force a deeper discount late in process.
        - Request counsel memo and regulator-workstream tracker before underwriting an IPO order.
    notes: >-
      These asks are ordered by their ability to move the valuation stance from narrative-driven to evidence-driven.
      Without the first three, the call should stay price-disciplined.
