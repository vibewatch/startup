  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct ultra-fast rivals, omnichannel incumbents, and broader shopping substitutes'
        blocks:
          - type: paragraph
            body: >-
              Shein is not competing only with one type of apparel merchant. The direct ultra-fast rival is Temu, which
              packages low prices, broad category reach, and friction-light shipping and returns inside an app-led
              marketplace. Zara and H&M matter differently: they are slower and more curated, but they pair fashion
              credibility with stores, app continuity, and familiar returns or membership mechanics. Amazon Fashion is
              not a fashion-native peer, yet it is a real substitute whenever the shopper’s job is “cheap, fast, and
              convenient” rather than “trend discovery from a single fashion app.” Cider is narrower and more
              women-fashion-centric, which makes it relevant for style-sensitive cohorts without matching Shein’s
              breadth. Resale and secondhand channels also belong in the competitive set because they absorb
              value-seeking or sustainability-motivated demand that would otherwise flow to new ultra-fast-fashion
              purchases. Public market-share and traffic evidence therefore supports a broad competitive frame: Shein
              leads important digital surfaces, but the alternative set is wide and increasingly multi-format.
            claimRefs:
