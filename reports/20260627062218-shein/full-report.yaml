      - number: '7.3'
        title: Environmental, logistics, and partner-dependence risk
        blocks:
          - type: paragraph
            body: >-
              Environmental and operational criticism also deserves elevated weight because it is embedded in the model
              rather than sitting outside it. NGO and retail-analytics sources frame ultra-fast fashion as a high-churn,
              synthetic-heavy format where SKU velocity itself drives waste, returns, and scrutiny. SHEIN’s own
              sustainability materials present a mitigation narrative built around on-demand planning, circularity,
              audits, grievance channels, and supplier investment. Those disclosures are directionally positive and show
              the company is not standing still. Even so, the same disclosures underline how much of the model still
              depends on a broad supplier network, constant product refresh, and complex cross-border logistics. Reverse
              logistics is now important enough that SHEIN publicly highlighted the Happy Returns partnership, and in
              2025 it also signed an MoU with Lufthansa Cargo to pilot more sustainable and traceable air freight. Those
              moves are helpful mitigants, but they also show continued reliance on third-party infrastructure to keep
              the delivery network performant and politically defensible. For investors, the practical point is that
              environmental critique, logistics friction, and partner performance can all become economic issues through
              returns cost, customs delays, higher testing burdens, or weaker conversion if delivered prices rise.
