      - number: '3.2'
        title: 'Speed, pricing, and channel model: where Shein is still structurally different'
        blocks:
          - type: paragraph
            body: >-
              The biggest public difference between Shein and legacy fast-fashion incumbents is cadence. NielsenIQ’s
              comparison is stark: Shein’s item-release count dwarfs Zara and H&M, and the same source characterizes
              Shein as compressing into days what classic fast fashion offers across months. Business of Apps and Sacra
              reinforce that picture from different angles, pointing to thousands of daily item additions, modular
              supplier depth, and a social-media acquisition loop tuned for constant novelty. Those mechanics matter
              because they shape both price presentation and channel design. Shein and Temu both sell through
              aggressively promotional, app-led surfaces that normalize flash sales, free shipping, and free returns.
              Zara and H&M instead compete through branded assortment, app-enabled discovery, and service continuity
              across digital and physical touchpoints. Shein’s own expansion into marketplace seller education,
              partner-brand acceleration, and supplier investment also shows a channel model that is broadening from
              first-party fashion into platform and service layers. Another Fashion Law lawsuit alleges that the same
              algorithmic, small-batch operating loop that powers Shein’s speed can also amplify copyright risk, while
              SHEIN’s Planet roadmap says it is trying to produce, package, and ship closer to customers to reduce
              delivery times and shipping costs. That improves assortment breadth and monetization flexibility, but it
              also adds compliance and quality-management complexity.
