      - number: '8.2'
        title: What the public comp screen actually implies
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame SHEIN’s current valuation is to compare its implied sales multiple against
              several different public peers while being explicit about why none is perfect. On current screens, H&M
              sits around 1.2x sales, PDD around 1.8x, Inditex around 4.5x, and Fast Retailing around 7.7x. That means a
              $45 billion SHEIN mark on roughly $38 billion of 2024 revenue is only about 1.2x sales, while a $30–$50
              billion range maps to roughly 0.8x–1.3x. In pure multiple terms, that places current private-market
              pressure near H&M and below PDD, far below best-in-class global apparel operators. The discount is
              understandable because SHEIN carries more regulatory, labor, IP, and venue uncertainty than any of those
              peers. The key nuance is that the comp screen does not say SHEIN is necessarily cheap; it says the market
              is already pricing a controversy discount, and the investment question is whether that discount is wide
              enough relative to unresolved risk.
