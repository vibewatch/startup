  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold / event
      - transmission to thesis
      - action implication
    rows:
      - - Labor / customs event
        - Direct UFLPA detention pattern, adverse enforcement, or new congressional escalation
        - Raises compliance cost and damages listing credibility simultaneously
        - Lower the acceptable valuation range and pause premium-case underwriting.
      - - Venue failure
        - Hong Kong or alternative route also stalls after London setback
        - Pushes out exit timing and weakens investor confidence in governance readiness
        - Treat optionality as impaired and revert to lower-risk retail peer bands.
      - - Margin pressure
        - Evidence that tariffs or duty changes are hurting conversion or gross margin more than expected
        - Reduces the defense for paying even H&M-like public multiples
        - Move toward the bear case and require a lower entry price.
      - - Legal escalation
        - Adverse court event or widening IP claim set
        - Adds reserve risk and narrative damage into the listing window
        - Increase discount rate and assume higher ongoing compliance cost.
      - - Disclosure disappointment
        - Prospectus omits or weakens audited EBITDA, cash flow, cap-table, or sourcing detail
        - Prevents the market from shrinking the controversy discount
        - Maintain research-more stance and avoid valuation stretch.
    notes: >-
      The trigger set focuses on events that a real investment committee could monitor from filings, news, or diligence
      packets without pretending to know private management data in advance.
