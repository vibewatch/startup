      - number: '7.4'
        title: Mitigation maturity, monitoring, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              SHEIN has enough visible mitigation infrastructure that the right conclusion is not “avoid immediately,”
              but it still lacks the independent closure that would justify a normal retail-risk discount. The company
              can point to governance pages, sourcing policies, supplier audits, grievance handling, cybersecurity
              frameworks, and new seller education efforts. That means the diligence task is to test effectiveness, not
              to demand first-time policy creation. The problem is that the hardest residual issues remain the least
              independently resolved: forced-labor verification, product-safety error rates, reverse-logistics economics
              under higher duties, and the financial transmission from IPO delays or legal escalation. Investors should
              therefore monitor a short list of kill criteria rather than rely on generic optimism. If UFLPA enforcement
              lands directly on the company, if Chinese approval again blocks listing routes, if a federal court
              materially worsens the RICO or infringement posture, or if tariff-driven price rises visibly erode the
              value proposition, the risk case ceases to be theoretical. Those events would indicate that mitigation
              maturity is not keeping up with business complexity.
