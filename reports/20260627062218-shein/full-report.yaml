  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Labor, trade, and IPO-gating risk
        blocks:
          - type: paragraph
            body: >-
              SHEIN’s most material risk cluster is the one that links labor scrutiny, import policy, and listing
              feasibility into a single chain. The congressional and USCC record shows why this is more serious than
              generic “headline risk.” The House interim report tied SHEIN and Temu to unusually heavy reliance on the
              de minimis channel, while CBP’s UFLPA framework keeps the burden on importers to prove Xinjiang-linked
              inputs are not tainted by forced labor. Even SHEIN’s own December 2024 decision to join CBP’s Section 321
              Data Pilot shows that low-value import transparency is already an operating compliance workstream, not
              just a future policy threat. That matters because the IPO path has already been shaped by the same issue
              set: Reuters’ timeline said U.S. lawmakers asked the SEC to halt a SHEIN offering until forced-labor
              claims were addressed, and the 2025 shift from London toward Hong Kong showed that the company still needs
              Chinese regulatory tolerance even after moving its headquarters to Singapore. In other words, the trade
              model, the supply-chain debate, and the public-listing path are not separate debates. They are the same
              underwriting problem expressed in different venues. If customs scrutiny tightens further or Chinese
              approval remains conditional, valuation, margin, and exit timing all move lower together.
            claimRefs:
