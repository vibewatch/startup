            body: >-
              Customer proof is strongest when app-store footprint and independent market-share work are combined. On
              the 2026 run date, the U.S. App Store shows 2.8 million ratings for SHEIN, while Google Play shows 9.92
              million reviews and more than 500 million downloads. Business of Apps adds broader historical scale
              estimates, including 88.8 million active shoppers in 2023, 17.3 million U.S. users that year, and 238
              million downloads in 2023. Independent spending panels reinforce that this is not just top-of-funnel
              noise. Bloomberg Second Measure says SHEIN represented half of tracked U.S. fast-fashion competitor sales
              in November 2022 and was the only analyzed peer to post year-over-year U.S. sales growth that month. NIQ
              shows the European picture is also meaningful, with 40 percent share in the UK and more than half in Spain
              during 2022. Public customer proof is therefore unusually strong on scale proxies for a private company,
              even though it remains weak on the specific cohorts or repeat-buyer waterfalls investors would still want.
