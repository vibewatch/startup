      - number: '1.3'
        title: Capitalization, Scale Signals, and Brand Scope
        blocks:
          - type: paragraph
            body: >-
              SHEIN’s scale is no longer in doubt; the question is how much of that scale is verified, profitable, and
              durable. Reuters reported that the company sought roughly $2 billion in 2023 financing at a valuation
              around $64 billion, while later Reuters-based coverage continued to reference a roughly $66 billion
              last-round valuation. By contrast, Bloomberg reporting cited by TechNode said some private holders were
              willing to mark shares around $45 billion in early 2024. The right conclusion is not that one number is
              “true” and the other is “false,” but that the public market case is highly sensitive to timing, regulatory
              sentiment, and tariff expectations.


              Revenue evidence is supportive but still indirect. Business of Apps estimated 2023 revenue at $32.5
              billion, and CNBC quoted a key partner saying annual revenue was “a lot more” than $30 billion. CNBC also
              reported Donald Tang’s statement that SHEIN reached record profitability in the first half of 2023. Those
              signals are directionally strong, but they are still weaker than audited financial statements, which
              remain absent. For diligence, SHEIN should therefore be treated as a very large private retailer with
              credible scale and plausible profitability, but not with public-company-grade financial transparency.


              Beyond core apparel, SHEIN is broadening the perimeter of what investors are being asked to underwrite.
              Official properties now encompass SHEGLAM, a Brand Accelerator program, a returns-network partnership with
              Happy Returns, and the use of the on-demand engine to relaunch acquired brands such as Missguided. That
              expansion supports the argument that SHEIN is evolving from a single app into a wider commerce, services,
              and brand infrastructure platform.
