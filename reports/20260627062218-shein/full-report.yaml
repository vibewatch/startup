  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Private marks, profit pressure, and IPO context
        blocks:
          - type: paragraph
            body: >-
              SHEIN’s valuation discussion has become less about whether the company is large and more about what kind
              of discount the market should apply to a scaled but controversy-exposed retailer. Public reporting gives
              three usable anchors. First, the 2023 fundraising round put the company around the mid-$60 billions.
              Second, private secondary marks discussed in early 2024 were nearer $45 billion. Third, 2025 reporting
              around the London IPO described a market debate that had already drifted toward roughly $50 billion and,
              in some investor-pressure scenarios, closer to $30 billion. Those moves were not random. They tracked
              weaker profit reporting, higher trade-policy pressure, and the continuing inability to secure a clean,
              low-friction listing route across the U.S., U.K., China, and Hong Kong. The key inference is that SHEIN is
              no longer being valued as a frictionless hyper-growth story. It is being valued as a very large retailer
              whose exit route and margin durability both need heavier discounting than conventional fast-fashion peers.
            claimRefs:
