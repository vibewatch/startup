      - number: '4.4'
        title: >-
          Financial verdict: visible scale, incomplete quality, and a range-based rather than point-estimate
          underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The positive financial case is straightforward. Shein has already crossed into giant-scale e-commerce, has
              been profitable at least in some periods, appears to have lower fixed-store burden than incumbents, and is
              broadening monetization through marketplace and partner-brand services. The negative case is equally
              straightforward. Profit appears far more fragile than revenue growth, 2025 sales and valuation estimates
              still conflict across reputable secondary sources, and the public record remains silent on the metrics
              that distinguish a durable cash machine from a promotional growth engine. Those missing metrics include
              gross margin by surface, realized take rate, returns burden, cash and burn, covenant constraints, and the
              exact cost of logistics and compliance adaptation as regulation tightens. Tariffs and de minimis reform
              matter because they attack the model’s core promise: cheap goods delivered quickly from a cross-border
              supply chain. The correct public-only conclusion is therefore not “Shein is weak” or “Shein is
              unstoppable.” It is that the business is clearly huge, financially more mature than many private startups,
              and still too opaque on margin quality and policy resilience to underwrite from headline scale metrics
              alone.
