chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              SHEIN is best understood as a private, global online fashion-and-lifestyle retailer whose commercial edge
              comes from a data-led, on-demand merchandising system rather than owned manufacturing. Official group
              pages frame the company as a customer-first retailer; independent reporting anchors the harder facts: the
              business emerged from Nanjing in 2008 under Chris Xu, later consolidated under a Singapore-headquartered
              structure, and still relies on a deeply China-centric sourcing network. The combination matters because
              later chapters need to separate the company’s legal and managerial center from the production engine that
              powers price, speed, and assortment.


              The operating model is the main strategic fact. Official and independent sources agree that SHEIN reads
              demand signals from browsing, purchase, and feedback data, then decides what to manufacture with unusually
              small initial lots before rapidly replenishing winning SKUs. ValueChain Asia summarized initial drops as
              roughly 100 to 200 items, while USCC cited reporting that some first runs can be as few as 50 pieces. This
              is the mechanism behind the retailer’s low-inventory, high-refresh proposition and the reason its
              Guangzhou-area manufacturing cluster is more important than a conventional corporate-factory footprint.


              Singapore headquarters should not be mistaken for operational decoupling. Reuters said the 2022
              head-office move was paired with continued concentration of supply chains and warehouses in China, plus a
              Singapore holding-company structure aimed at supporting offshore listing flexibility. In practical
              diligence terms, SHEIN’s corporate, capital-markets, and regulatory narrative is now transnational, but
              the cost, speed, and compliance risks remain anchored in the China-based supplier network.
