        title: Exhibits
        blocks:
          - type: callout
            title: The core moat is a demand-led supply loop, not a classic fashion brand
            body: >-
              The strongest repeatable advantage in the source set is not design prestige or owned manufacturing
              capacity. It is the ability to read customer demand in real time, place unusually small first batches, and
              replenish only what converts. That model lowers inventory risk, speeds trend response, and explains why a
              China-centered contractor base can support global scale.
