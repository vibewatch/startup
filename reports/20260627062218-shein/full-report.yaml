      - number: '5.2'
        title: 'Portfolio surfaces: core retail, Marketplace, SHEGLAM, and SHEIN X'
        blocks:
          - type: paragraph
            body: >-
              The consumer-facing catalog is broad enough that the product map now spans more than core women's apparel.
              Official storefronts and app-store descriptions show SHEIN selling across home, beauty, pet, office,
              electronics, automotive, and other lifestyle categories, while the brand stack also includes adjacent
              labels and initiatives. SHEGLAM is not merely a category tile inside the main app; it is a distinct beauty
              brand with its own merchandising voice, category structure, and collaboration-led release cadence.
              Marketplace adds a different kind of surface, because the company is now publishing seller-education and
              compliance materials that only make sense once third-party assortment becomes part of the operating model.
              SHEIN X is another extension: the program began as a designer incubator in 2021 and has since evolved into
              SHEIN Xcelerator, which explicitly promises fulfilment and on-demand production services to participating
              brands. A January 2023 program update adds more operational detail, describing end-to-end product
              development, manufacturing, marketing, logistics, and a real-time analytics site for participating
              designers. Public partnership work also shows the product surface branching into co-creation and
              inclusive-design programs: in April 2025 SHEIN and the Singapore Fashion Council launched the Every Body
              Matters competition for designers building collections around different body types and abilities. Put
              differently, the portfolio is increasingly a layered platform made up of owned retail, owned brands,
              third-party sellers, and partner-brand enablement, all sitting on the same underlying demand and
              fulfilment engine.
