  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: No public cash, debt, burn, or runway disclosure
    missingEvidence: Cash balance, debt facilities, monthly burn, and runway scenarios.
    whyItMatters: Capital adequacy cannot be fully underwritten without direct liquidity data despite the company’s scale.
    diligencePath: Request treasury dashboard, debt agreements, and board-approved runway scenarios.
    relatedQuestionRefs:
    - QI018
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: No public gross-margin bridge by business line
    missingEvidence: Gross margin by first-party, marketplace, and services, plus returns burden and discounting.
    whyItMatters: Headline sales and even net profit do not reveal whether growth is economically attractive or increasingly subsidized.
    diligencePath: Request management P&L bridge and margin decomposition by line of business.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: 2025 sales and valuation figures diverge across secondary sources
    missingEvidence: Audited 2025 revenue run-rate or formal investor deck reconciliation across sources.
    whyItMatters: Range-based underwriting is prudent only if the team acknowledges that current public point estimates disagree.
    diligencePath: Request board materials or IPO drafting materials that reconcile sales, profit, and valuation assumptions.
    relatedQuestionRefs:
    - QI004
    - QI012
    - QI023
    relatedTableRefs:
    - TI003
    - TI004
  - type: missing-source
    severity: material
    topic: Marketplace take-rate and seller economics remain opaque
    missingEvidence: GMV, take rate, refund chargebacks, seller subsidies, and marketplace gross margin.
    whyItMatters: Marketplace expansion could improve working capital or simply add revenue with weak economics.
    diligencePath: Request marketplace operating metrics, seller cohort data, and fee schedule.
    relatedQuestionRefs:
    - QI021
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: access-blocked
    severity: minor
    topic: Public policy math is visible before company response plans are visible
    missingEvidence: Internal playbooks for tariff pass-through, sourcing diversification, and logistics repricing.
    whyItMatters: Regulatory sensitivity is clearly material, but the quality of mitigation planning remains private.
    diligencePath: Request management scenario deck covering duty, tariff, and de minimis changes by corridor.
    relatedQuestionRefs:
    - QI015
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
