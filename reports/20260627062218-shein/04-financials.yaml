- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: Shein avoids some store-heavy fixed costs, but supplier support, returns localization, marketplace compliance, and tariff sensitivity still create meaningful cash-flow exposure.
  data:
    columns:
    - Cash-light advantage
    - Cash drain / obligation
    - Sensitivity
    rows:
    - label: Inventory / sourcing
      values:
      - Third-party supplier model limits owned stock
      - Supplier ecosystem requires direct support and process investment
      - Labor or sourcing scrutiny can raise compliance cost
    - label: Returns / localization
      values:
      - No giant owned store fleet required
      - Happy Returns and local handling expand service cost base
      - Return-cost curves may worsen if delivery windows or duties change
    - label: Marketplace / services
      values:
      - Seller and partner-brand activity can expand revenue without owning every SKU
      - Training, product safety, and quality controls need ongoing operating spend
      - Weak fee design could create complexity without strong margin capture
    - label: Trade policy / tariffs
      values:
      - Low-cost direct import model historically aided growth
      - Price hikes or duty absorption can hit conversion or profit
      - IPO and valuation outcomes now move with regulatory headlines
  approximationNotes: The matrix maps operating mechanics, not booked accounting line items; exact cash magnitudes remain undisclosed publicly.
