- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - current value / status
  - implication
  - diligence ask
  rows:
  - - 2023 funding round
    - ~$2B at ~$66B valuation
    - Confirms prior investor support at very large scale
    - Request cap table, round terms, and investor rights.
  - - Secondary / mark pressure
    - Private-market marks around $45B reported in early 2024
    - Signals weaker investor appetite and a lower mark-to-growth relationship
    - Request recent secondary transactions and board valuation materials.
  - - IPO valuation reset
    - Reuters-linked 2025 talk around ~$50B and policy-sensitive listing path
    - Capital-market access may depend on discounting ambitions and political approvals
    - Request IPO readiness plan and downside scenarios if listing slips again.
  - - Supplier ecosystem support
    - US$70M five-year supplier program
    - Supply reliability requires direct cash commitment
    - Request annual spend schedule and measured ROI from supplier programs.
  - - Returns / localization investment
    - 300+ Forever 21 returns points via Happy Returns
    - Localization improves service but adds handling and integration costs
    - Request return-cost curve by market and pre/post localization economics.
  - - Public liquidity disclosure
    - No cash, debt, or runway metrics disclosed publicly
    - Largest remaining blocker for any true capital-adequacy judgment
    - Request monthly cash bridge, debt facilities, and contingency funding plan.
  notes: This table focuses on forward adequacy and financing sensitivity rather than recreating a full historical funding chronology.
