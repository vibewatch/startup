- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Gross margin by business line
    - Cannot judge whether revenue growth is economically attractive or heavily subsidized
    - Obtain monthly gross-profit bridge split across first-party, marketplace, and services.
  - - Marketplace GMV, take rate, and refund burden
    - Marketplace could be margin-accretive or merely complexity-accretive
    - Request seller P&L, take-rate policy, and cohort economics.
  - - Cash on hand, debt, burn, and runway
    - Capital adequacy cannot be underwritten publicly
    - Review treasury dashboard, debt agreements, and board runway scenarios.
  - - Returns rate and logistics cost by geography
    - Localization and free-return promises may hide major cost variability
    - Request return-rate, carrier-cost, and reverse-logistics data by region.
  - - Discount-adjusted ASP and acquisition payback
    - Promotion-heavy public pricing says little about true customer economics
    - Review CAC, payback, coupon redemption, and repeat-purchase cohorts.
  - - Tariff / de minimis pass-through model
    - Policy shocks directly affect both price perception and margin
    - Request scenario model showing demand and margin under multiple duty regimes.
  notes: These are the minimum private datasets needed to convert visible scale into an investable financial model.
