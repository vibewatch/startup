- id: TI002
  title: Pricing / monetization table
  columns:
  - price / offer
  - public signal
  - what it shows
  - what remains unknown
  - source-backed implication
  rows:
  - - “A lot more” than $30B annual revenue
    - External partner quote reported by CNBC
    - Revenue scale is already massive
    - Does not reveal product, region, or margin mix
    - Scale is visible before audited public disclosure.
  - - Extra 30% off first order
    - App Store copy
    - Customer acquisition is promotion-forward
    - Discount redemption rate and payback are unknown
    - Marketing intensity may be materially higher than list prices imply.
  - - Flash sales up to 90% off
    - Google Play copy
    - Shein uses deep promotional framing to drive urgency
    - Blended ASP and contribution margin are unknown
    - Consumer traction may be supported by meaningful price concessions.
  - - Low-ticket examples like $10 dresses and $12 jeans
    - Reuters-linked MarketScreener report
    - Shein competes from a very low ticket baseline
    - Item-level gross margin and shipping subsidy are unknown
    - Tariffs or customs friction can hit consumer value perception directly.
  - - Free shipping and free returns messaging
    - App-store surfaces and logistics partnerships
    - Conversion depends partly on friction reduction, not only cheap goods
    - Return abuse, carrier cost, and geographic exclusions are not public
    - Logistics is integral to monetization, not a bolt-on perk.
  - - Marketplace seller education and compliance tooling
    - Official seller program
    - Third-party monetization likely depends on service and governance layers
    - Seller fee structure and compliance cost recovery are not public
    - Marketplace growth may trade gross margin for breadth and compliance readiness.
  notes: Public pricing evidence is heavily promotional and consumer-facing; it should not be mistaken for realized net revenue or unit economics.
