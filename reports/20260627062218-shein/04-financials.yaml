  - - Beauty / home / lifestyle
    - Cross-category first-party assortment sold alongside apparel
    - SKU sale
    - Clearly visible in app-store and site descriptions
    - Low for revenue mix
    - Provide non-apparel revenue mix and contribution margin by category.
  - - Marketplace seller assortment
    - Third-party sellers list goods on Shein and require compliance support
    - Take rate / seller services
    - Operationally visible, exact take rate not public
    - Low
    - Disclose marketplace GMV, take rate, seller mix, and refund burden.
  - - Partner-brand / Xcelerator services
    - DTC services and on-demand production for external brands
    - Service fee / production services
    - Officially confirmed, revenue contribution undisclosed
    - Low
    - Provide revenue, margin, and working-capital terms for brand-service programs.
  - - Resale / secondhand adjacency
    - Pre-owned listings and seller activity inside Shein ecosystem
    - Listing / transaction activity
    - Visible strategically, but not yet presented as a disclosed revenue line
    - Low
    - Clarify whether resale is monetized, subsidized, or engagement-driven.
  - - Portfolio / brand monetization
    - Owned or acquired brands such as Missguided expand assortment and brand reach
    - Brand sales / licensing / portfolio revenue
