- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - SHEIN solution
  - Measurable benefit
  - Limitation
  rows:
  - - Test whether a new trend should scale
    - Conventional retailers buy deeply before clear evidence
    - Launch a 100-200 unit test batch and watch engagement and feedback
    - Reduces overproduction and lets replenishment follow demand
    - Public sources do not disclose exact conversion thresholds from test to scale
  - - Keep supplier output aligned with fast-moving assortment
    - Supplier coordination often depends on manual forecasting and long runs
    - Shared ordering systems, supplier programs, and CIGM-driven best-practice transfer
    - Supports faster changeovers and lower inventory risk for suppliers
    - Exact supplier software stack and adoption rate are undisclosed
  - - Expand assortment without owning every SKU
    - Retailer adds categories by internal merchandising alone
    - Marketplace seller education and compliance tooling bring third-party assortment into the same front end
    - Broader assortment and seller leverage without fully internal inventory
    - No public seller-count, dispute-rate, or compliance-failure metrics
  - - Serve beauty demand inside the broader ecosystem
    - Beauty may sit on a generic category tab
    - SHEGLAM operates as a separate beauty brand with its own categories and collaborations
    - Improves cross-sell and brand adjacency to fashion shoppers
    - No public evidence on repeat-beauty purchase rate or attach rate
  - - Handle returns and end-of-life items
    - Customer mails items back or exits the ecosystem entirely
    - BORIS returns at Forever 21, SHEIN Exchange, and takeback / recycling programs
    - Improves convenience and creates additional data on reverse flows and resale
    - No public return-rate, cost-to-serve, or recovered-value metrics
  notes: Use cases combine company-claimed operating workflows with third-party descriptions of the demand-driven model; quantified conversion or ROI metrics remain sparse.
