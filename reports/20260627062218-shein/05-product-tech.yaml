callouts:
- calloutType: strength
  title: The moat is the loop, not just the catalog
  body: SHEIN's strongest product signal is the closed operating loop from demand capture to test batch to supplier response to returns feedback. That loop can support core retail, owned adjacencies like SHEGLAM, and newer surfaces like Marketplace or Xcelerator without changing the underlying operating logic.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE013
  - CE036
- calloutType: risk
  title: Visible controls do not eliminate unresolved legal and sourcing risk
  body: SHEIN now exposes more concrete privacy, security, and sourcing controls than its earlier reputation suggested, but USCC and legal-trade coverage still keep forced-labor, product-safety, IP, and customs questions alive. The governance layer is improving faster than the adverse file is disappearing.
