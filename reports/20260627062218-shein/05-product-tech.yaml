  evidenceGaps:
  - type: missing-source
    severity: material
    topic: supplier-network-scale
    missingEvidence: A current supplier or factory count, geography split, and direct-versus-marketplace participation mix.
    whyItMatters: Without supplier-network scale, it is hard to judge how concentrated or resilient the operating model really is.
    diligencePath: Request a current supplier census, active-factory count, top-supplier concentration, and percentage using SHEIN systems end to end.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: marketplace-unit-economics
    missingEvidence: Marketplace seller count, GMV share, take rate, compliance failure rate, and seller retention.
    whyItMatters: Marketplace is strategically important but public evidence only proves governance tooling exists, not whether the economics or control outcomes are attractive.
    diligencePath: Request quarterly seller adds, active sellers, GMV mix, returns by seller cohort, and enforcement / takedown metrics.
    relatedQuestionRefs:
    - QE010
    - QE022
    relatedTableRefs:
    - TE001
    - TE004
  - type: missing-source
    severity: material
    topic: returns-economics
    missingEvidence: Return rate, BORIS adoption rate, resale recovery rate, and cost to serve by market.
    whyItMatters: Returns convenience is part of the product promise, but the business impact of those reverse flows is not underwriteable from public evidence.
    diligencePath: Request return-rate dashboards, BORIS usage, net recovery by channel, and inventory return-to-stock timing.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE002
    - TE004
