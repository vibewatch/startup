- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Dependency
  - Risk
  rows:
  - - Demand-signal capture
    - Reads app and website engagement to detect what customers want
    - Large mobile/web traffic base and first-party data instrumentation
    - Signal quality can drift if data usage rules tighten or engagement weakens
  - - Small-batch launch engine
    - Tests fresh styles in 100-200 unit runs before scaling
    - Supplier responsiveness and fast merchandising loops
    - If batch feedback is noisy, bad SKUs can still scale
  - - Supplier ordering / processing system
    - Standardizes how partner factories receive work and report back
    - Supplier compliance with SHEIN systems and processes
    - Exact software architecture and uptime are not public
  - - Supplier training and CIGM layer
    - Transfers lean/agile methods and operational best practice into the network
    - SCEP funding, trainers, and supplier participation
    - Program quality may vary across a large and changing supplier base
  - - Marketplace compliance layer
    - Teaches third-party sellers product safety and quality obligations
    - TIC partners and seller willingness to adopt controls
    - Marketplace expansion can outpace oversight if seller growth accelerates
  - - Returns / resale / recycling layer
    - Captures post-purchase returns, exchanges, resale, and takeback flows
    - Happy Returns, store partners, and circularity operations
    - Economics of returns and resale remain under-disclosed
  notes: Architecture layers are drawn from official governance/process pages and third-party supply-chain analysis; several software and operational details remain opaque.
