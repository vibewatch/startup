    - Public sources do not disclose seller count, GMV share, or Marketplace take rate
  - - SHEGLAM
    - Beauty shopper
    - Scaled adjacent brand
    - Standalone beauty identity with distinct categories and drop-led collaborations
    - No public disclosure of SHEGLAM revenue share or customer overlap with core SHEIN
  - - SHEIN X / Xcelerator
    - Designer or partner brand founder
    - Operational program since 2021; broadened infrastructure role
