chapter:
  number: 5
  title: Product & Technology
  summary: 'SHEIN''s product architecture is not a single app feature set so much as a demand-driven operating system: mobile demand sensing feeds 100-200 unit test batches, supplier digitization, and scaled replenishment across core apparel, Marketplace sellers, SHEGLAM, and SHEIN X. The strongest official evidence sits around supplier empowerment, circularity, privacy/security governance, and Marketplace compliance tooling, while third-party work still flags unresolved forced-labor, IP, and product-control risks.'
sections:
- id: on-demand-architecture
  title: On-demand architecture and demand sensing
  body: 'SHEIN''s core product is really a demand-driven retail operating model rather than a single consumer app. Official company materials repeatedly describe the business as having moved from a supply-driven model to a demand-driven one, and the best third-party supply-chain synthesis shows how that works in practice. Value Chain Asia says new styles are typically released in small batches of around 100 to 200 items, with user engagement and feedback signals determining whether production scales. That matters because the technical moat is not just speed: it is the loop that connects merchandising, digital demand capture, supplier instructions, replenishment, and eventual returns or resale signals. Governance materials add that first-party app and website data are used in aggregated form to inform design decisions, which fits the third-party description of a demand-sensing stack. In practice, this architecture looks like a closed loop from signal capture to small-batch testing to scaled
    replenishment, with product breadth and mobile engagement acting as the front door rather than the moat by themselves.'
