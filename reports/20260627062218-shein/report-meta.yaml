companyProfile:
  summary: |
    SHEIN was founded in China in 2008 by Chris Xu and evolved from an SEO-led cross-border apparel seller into a global,
    app-native retailer operating a digitally coordinated supplier network centered in Guangzhou/Panyu. The company moved its
    global headquarters to Singapore in 2022 while retaining most sourcing, design-adjacent coordination, and manufacturing
    relationships in China. Its core operating model combines trend sensing, rapid design iteration, micro-batch production,
    and direct-to-consumer international shipping to support very low price points and extremely high SKU velocity. Beyond its
    core women’s apparel business, SHEIN now spans men’s, kids, home, beauty via SHEGLAM, resale, designer incubation via
    SHEIN X, and a growing integrated marketplace.
  foundedDate: '2008-01-01'
  founders:
    - name: Chris Xu
      role: Founder and Chairman
      background: SEO and cross-border e-commerce operator who built SHEIN from an export-focused online apparel seller into a global ultra-fast-fashion platform.
