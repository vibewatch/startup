  productSummary: |
    Consumer-facing products include fast-fashion apparel, accessories, beauty, home goods, and third-party marketplace items
    sold through mobile apps and regional web storefronts. The underlying operating system is an on-demand merchandising and
    supplier-coordination model built around small initial production batches, rapid reorder loops, and highly promotional,
    app-led customer acquisition.
  customerFocus: Global value-seeking fashion shoppers, especially app-native younger consumers buying trend-led apparel and adjacent lifestyle categories.
  businessModel: Direct-to-consumer retail plus expanding marketplace and brand ecosystem; monetization comes from first-party product margin, logistics/returns optimization, and emerging platform economics.
