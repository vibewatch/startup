      - number: '8.2'
        title: 公开可比公司筛选真正意味着什么
        blocks:
          - type: paragraph
            body: >-
              给 SHEIN 当前估值定框，最干净的办法是把隐含收入倍数与几个不同公开同行比较，同时明确没有哪个同行完全合适。按当前筛选，H&M 约为 1.2x 销售额，PDD 约 1.8x，Inditex 约
              4.5x，Fast Retailing 约 7.7x。这意味着 SHEIN 以约 380 亿美元 2024 年收入对应 450 亿美元估值，只有约 1.2x 销售额；300 亿至 500 亿美元区间则约对应
              0.8x–1.3x。单看倍数，当前私募市场压力把 SHEIN 放在接近 H&M、低于 PDD 的位置，远低于全球一流服装运营商。这个折价可以理解，因为 SHEIN 承担的监管、劳工、IP
              和上市地不确定性，比这些同行都更重。关键细节是，可比公司筛选并不是说 SHEIN 一定便宜；它说明市场已经在计入争议折价，投资问题是相对未解决风险而言，这个折价是否足够宽。
