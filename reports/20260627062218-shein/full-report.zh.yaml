      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              需求侧仍有真实增长驱动。Research and Markets 指出，智能手机渗透、线上购物习惯形成和数字基础设施，是电商服装的结构性支撑。McKinsey
              的时尚展望又补上宏观视角：折扣渠道和追求性价比的行为仍很强，这有助于解释为什么低价数字时尚即便在波动的消费环境中仍能持续抢注意力。SHEIN
              自己的按需系统会强化这些驱动，因为它压缩了趋势识别到可购买库存之间的周期。


              约束侧同样重要。USCC 明确指出，de minimis 运输规则曾对该模式很关键；CNBC 称，美国 de minimis
              漏洞关闭、其他地区可能采取类似动作，以及更广泛的海关收紧，已经实质性恶化前景。这不只是利润率问题；它直接影响转化，因为更高的到岸成本会侵蚀跨境低价时尚复购所依赖的核心价值主张。


              信任堆栈是第二个主要约束。CNBC 和 USCC 都保留了同一组压力：强迫劳动担忧、产品安全和消费者保护审查、可持续性质疑，以及 IP 争议。因此，整体市场仍在增长，但 SHEIN
              在其中的特定楔子变得更受政策影响，也比疫情期间超高速增长阶段看起来更昂贵、更难维持。
