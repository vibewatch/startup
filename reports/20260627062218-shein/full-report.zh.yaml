      - number: '4.2'
        title: 利润率路径、营运资本与物流：某种意义上轻资产，另一种意义上运营很重
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的经济结构看起来比传统门店网络更轻资产，因为大量选品通过跨境发货，并由第三方制造商供货，而不是压在庞大的自有零售门店足迹里。Marketplace 扩张和合作品牌服务可能进一步降低库存强度，让
              SHEIN 不必拥有每一件售出商品，也能变现选品和流量。但“轻资产”不能等同于“轻现金”或“利润率简单”。公司自己的报告显示，它仍在持续投入供应商、合规培训、退货基础设施和流程改进。Sacra
              估计，稳定履约成本让 Q1 2025 的销量跃升转化为利润率，这令人鼓舞；但这也提醒投资者，物流是核心经济杠杆，不是后台管线。公开记录从未给出投资者真正需要用来建模可持续经济性的变量：毛利率、退货率、折扣调整后
              ASP、获客成本、回本周期或 burn。H&M 年报的价值正在于它展示了好披露应是什么样；SHEIN 仍没有提供从净销售额到毛利再到营业利润的等效桥梁。
