      - number: '4.3'
        title: 估值、融资依赖与政策敏感性：公开波动最大来自监管和市场信心
        blocks:
          - type: paragraph
            body: >-
              最可辩护的融资锚点仍是 2023 年以约 $66B 估值完成的约 $2B 融资。之后图景变得不稳定得多。TechNode 引用 Bloomberg 称，2024 年初私募市场估值标记约 $45B。随后
              Reuters 相关报道称，伦敦 IPO 可能需要把发行叙事压到接近约 $50B；The Fashion Law 仍提到更早的伦敦上市目标约
              $63B。换句话说，估值故事一直在下移，也越来越取决于政治、监管和同业可比。这个政策连接不是理论。USCC 已经围绕 de minimis 和采购风险来框定 SHEIN 模式；CNBC 随后把 de
              minimis 关闭直接连到 SHEIN 累积的问题；Reuters
              报道则突出关税和更严格免税规则，称其是正在发生的运营和上市逆风。因此，公开证据支持的公司画像是：它可能不像亏损软件创业公司那样依赖新资本，但仍高度依赖有利贸易机制、涨价后的转化韧性，以及资本市场对一个政治暴露商业模式的信心。
