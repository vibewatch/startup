  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入规模与变现：大体量收入、证据混杂，且不止一个引擎
        blocks:
          - type: paragraph
            body: >-
              公开记录已经足够支持一个结论：SHEIN 已经在极大规模上运营，但还不足以把这个结论压缩成一个完全对齐的数字。Business of Apps 估计 2023 年收入约 $32.5B；CNBC
              引述一位合作伙伴称，同期业务年收入“远高于” $30B。到 2024 年，CNBC 对 Financial Times 的摘要指向约 $38B 销售额；Sacra 也独立估计了同样的 2024 年收入水平，并预测
              Q1 2025 run-rate 很高。趋势比虚假的精确更重要：业务已经远超创业公司规模，并在多个界面变现。官方页面现在展示自营时尚和生活方式选品、扩张中的 Marketplace 卖家活动、通过
              Xcelerator 向合作品牌提供 DTC 服务，以及转售相邻业务的证据。尽调中的变现问题不是 SHEIN 是否有多个收入引擎；而是公开记录仍不拆分结构、take
              rate、折扣、退货负担，或各引擎的实现利润率。规模越来越可见，收入质量仍部分不透明。
