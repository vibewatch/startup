      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              不同于企业软件或工业品类，SHEIN 的核心市场通常把买方、用户和付款人压缩成同一个人：终端消费者。公开来源高度偏向价格敏感、移动原生、深受社交内容和持续上新影响的时尚消费者。Statista 明确把 SHEIN
              的崛起与病毒式 haul 行为相连，并称用户群体压倒性偏女性；Business of Apps 也呼应这个框架，强调社交媒体原生获客。这并不意味着所有用户都是 Gen Z，但意味着 Gen-Z
              式发现模式比传统商场式时尚陈列更能定义这个市场。


              移动分发不是边角细节，而是市场结构的一部分。SHEIN、Temu、Zara 和 H&M 在 App Store 的存在说明，主战场是随时在线的购物
              App，而不只是网站或门店网络。采用通常沿着一条短循环推进：社交发现或推送通知，打开 App，低客单冲动加购，然后由每日上新和折扣驱动重复浏览。SHEIN
              的节奏优势会放大这条循环，因为选品速度给了用户比季节性更慢的商家更多重新打开 App 的理由。


              竞争者类型很关键。Zara 和 H&M 是时尚优先的替代品，品牌策展更强；Temu 是游戏化的性价比 Marketplace；Amazon Fashion 是宽口径便利型 Marketplace；Cider
              则是更窄的数字原生时尚同业。SHEIN 位于中间：比 Amazon 或 Temu 更聚焦时尚，但比 Zara 或 H&M 更 App 驱动、也更跨境。
