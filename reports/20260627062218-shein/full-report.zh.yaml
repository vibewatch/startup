  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 劳工、贸易与 IPO 闸门风险
        blocks:
          - type: paragraph
            body: >-
              SHEIN 最重大的风险组，是把劳工审查、进口政策和上市可行性连成一条链的那一组。国会和 USCC 记录说明，这比泛泛的「头条风险」更严重。众议院临时报告把 SHEIN 和 Temu 与对 de minimis
              通道异常重度的依赖联系起来；CBP 的 UFLPA 框架则继续把举证责任压在进口商身上，要求其证明与新疆相关的投入没有受到强迫劳动污染。即便 SHEIN 自己在 2024 年 12 月决定加入 CBP 的
              Section 321 Data Pilot，也说明低价值进口透明度已经是运营合规工作流，而不只是未来政策威胁。这很关键，因为 IPO 路径已经被同一组问题塑形：Reuters 时间线称，美国议员要求 SEC
              暂停 SHEIN 发行，直到强迫劳动指控得到处理；2025
              年从伦敦转向香港，也说明公司即使把总部迁到新加坡，仍需要中国监管容忍。换句话说，贸易模型、供应链争议和公开上市路径不是三场独立辩论，而是同一个承销问题在不同场域的表达。如果海关审查继续收紧，或中国审批仍带条件，估值、利润率和退出时间都会一起下移。
