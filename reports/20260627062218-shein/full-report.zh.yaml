  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 劳工、贸易、法律和产品风险如何传导到利润率、IPO 准备度和投资逻辑。
    data:
      nodes:
        - id: n1
          label: UFLPA / 强迫劳动审查
          description: 海关和国会压力仍在持续
        - id: n2
          label: 小额豁免 / 关税重置
          description: 价格优势和到岸成本开始逆着旧模型走
        - id: n3
          label: 中国审批风险
          description: 上市路径仍取决于中国监管机构
        - id: n4
          label: IP / RICO 诉讼
          description: 美国联邦案件仍在审理，更大的法律阴影也未消散
        - id: n5
          label: 产品安全复杂度
          description: SKU 更宽、Marketplace 更大，合规暴露面随之扩大
        - id: n6
          label: 利润率和转化承压
          description: 关税、退货、检测和法律成本都在上升
        - id: n7
          label: IPO 延迟或折价
          description: 公开市场投资者要求更大的风险折扣
        - id: n8
          label: 投资逻辑破裂
          description: 剩余争议压过规模优势
      edges:
        - from: n1
          to: n6
        - from: n1
          to: n7
        - from: n2
          to: n6
        - from: n3
          to: n7
        - from: n4
          to: n6
        - from: n4
          to: n7
        - from: n5
          to: n6
        - from: n6
          to: n8
        - from: n7
          to: n8
