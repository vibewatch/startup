      - number: '6.4'
        title: 退货体验与投诉信号
        blocks:
          - type: paragraph
            body: >-
              SHEIN 公开讲的购后体验，核心是便利，但评论区也暴露了摩擦点。官方页面主打免费退货和免运费门槛，Happy Returns 合作又在 300 多个 Forever 21
              门店提供实体退货选择，不用箱子，也不用打印标签。这是重要的客户体验证据，因为它缩短了线上购买与线下便捷退货之间的距离。与此同时，近期 Google Play
              评论呈现出更怀疑的客户叙事，集中在价格展示和优惠券行为上。DJ Miik Martorell、Jas T 和 Tam Sigler
              的评论都批评过优惠券不清楚、结账前价格上涨等情况，直接指向用户对价值主张的信任。上述抱怨并不否定平台规模，但说明以低价驱动的客户关系会带来运营噪音。更重要的是，Temu
              等价值型购物竞争者也在宣传宽松退货，因此在这个品类里，退货便利更像卫生因子，而不是深层差异化。
