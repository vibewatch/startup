  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 当前数值 / 状态
      - 含义
      - 尽调要求
    rows:
      - - 2023 年融资轮
        - 约 $2B，估值约 $66B
        - 证明既有投资人在超大规模下仍提供支持
        - 要求提供股权结构表、轮次条款和投资人权利。
      - - 二级市场 / 估值压力
        - 2024 年初有报道称私募市场估值约 $45B
        - 指向投资人胃口走弱，估值与增长的匹配度下降
        - 要求提供近期二级交易和董事会估值材料。
      - - IPO 估值重设
        - Reuters 相关报道提到 2025 年约 $50B 的讨论，以及受政策影响的上市路径
        - 资本市场准入可能取决于下调估值预期和取得政治审批
        - 要求提供 IPO 准备计划，以及上市再次延后时的下行情景。
      - - 供应商生态支持
        - US$70M 五年供应商计划
        - 供应可靠性需要直接现金投入
        - 要求提供年度支出计划和供应商项目的量化 ROI。
      - - 退货 / 本地化投入
        - 通过 Happy Returns 接入 300+ 个 Forever 21 退货点
        - 本地化改善服务，但增加处理和集成成本
        - 要求按市场提供退货成本曲线，以及本地化前后的经济性。
      - - 公开流动性披露
        - 未公开现金、债务或跑道指标
        - 仍是判断真实资本充足性的最大障碍
        - 要求提供月度现金桥表、债务融资安排和应急融资计划。
