      - number: '3.3'
        title: 护城河耐久性：低切换成本、Temu 压力尖锐、信任摩擦上升
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的护城河真实存在，但不是传统锁定。App Store 证据和已审视的促销界面显示，消费者切换成本很低：购物者可以安装多个 App，比较优惠券或 haul 购物篮，在
              Temu、SHEIN、Amazon、Zara、H&M 或转售之间拆分支出，几乎没有迁移成本。这就是 Temu 特别危险的原因。它攻击同一种低价、跨品类、移动优先行为；Amazon
              可以凭纯便利取胜，既有玩家则能靠信任和门店取胜。监管和法律审查让耐久性问题更糟。USCC 把 SHEIN 和 Temu 放进同一个 de minimis、采购和数据风险框架；The Fashion Law
              的报道则让海关、版权和强迫劳动担忧保持可见。SHEIN 自己的负责任采购、人权和 ISO 27001
              披露显示管理层正努力缩小信任缺口，但也确认治理投入已经成为竞争成本基础的一部分。这些问题不只制造标题风险；它们给更可信的对手提供话术，并提高政策变化削弱最低广告价背后经济性的概率。SHEIN
              可以用供应商投资、物流合作和平台工具回应，但护城河暴露度仍高于下载量数字本身显示的程度。
