      - number: '1.3'
        title: 资本结构、规模信号与品牌边界
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的规模已不再需要争论；问题是其中有多少经过验证、有利润且可持续。Reuters 报道，公司 2023 年寻求约 $2B 融资，估值约 $64B；后续基于 Reuters 的报道仍提到上一轮估值约
              $66B。相反，TechNode 引用的 Bloomberg 报道称，2024 年初部分私募持有人愿意按约 $45B
              给股份估值。正确结论不是一个数字“真”、另一个“假”，而是公开市场故事对时点、监管情绪和关税预期高度敏感。


              收入证据支持规模判断，但仍是间接的。Business of Apps 估计 2023 年收入为 $32.5B；CNBC 引述一位关键合作伙伴称，年收入“远高于” $30B。CNBC 还报道了 Donald
              Tang 的说法：SHEIN 在 2023 年上半年实现创纪录盈利。这些信号方向很强，但仍弱于经审计财务报表，而后者仍然缺位。尽调时，SHEIN
              因此应被视为一家规模极大的私营零售商，拥有可信规模和看似合理的盈利能力，但没有达到上市公司级别的财务透明度。


              除核心服装外，SHEIN 正在扩大投资者被要求承销的边界。官方资产现在包括 SHEGLAM、Brand Accelerator 计划、与 Happy Returns 的退货网络合作，以及利用按需引擎重启
              Missguided 等收购品牌。这个扩张支撑了一个论点：SHEIN 正在从单一 App 演进为更宽的商业、服务和品牌基础设施平台。
