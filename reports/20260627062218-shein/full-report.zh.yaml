      - number: '3.2'
        title: 速度、定价与渠道模式：SHEIN 仍具结构性差异的地方
        blocks:
          - type: paragraph
            body: >-
              SHEIN 与传统快时尚既有玩家之间最大的公开差异是节奏。NielsenIQ 的对比很鲜明：SHEIN 的商品发布数量远超 Zara 和 H&M；同一来源还称，传统快时尚用数月提供的东西，SHEIN
              压缩到数天。Business of Apps 和 Sacra
              从不同角度强化了这幅图景：每天数千个商品新增、模块化供应商深度，以及为持续新鲜感调校的社交媒体获客循环。这些机制很重要，因为它们同时塑造价格呈现和渠道设计。SHEIN 与 Temu 都通过强促销、App
              驱动的界面销售，让限时闪购、免运费和免费退货成为常态。Zara 和 H&M 则通过品牌化选品、App 支持的发现，以及跨数字和实体触点的服务连续性竞争。SHEIN 自身向 Marketplace
              卖家教育、合作品牌加速和供应商投资扩张，也显示渠道模式正在从自营时尚拓宽到平台和服务层。另一起 Fashion Law 诉讼称，支撑 SHEIN 速度的同一套算法化、小批量运营循环，也可能放大版权风险；而
              SHEIN 的 Planet 路线图称，公司正尝试把生产、包装和发货做得更靠近客户，以缩短交付时间、降低运输成本。这会改善选品宽度和变现灵活性，但也增加合规和质量管理复杂度。
