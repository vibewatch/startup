companyProfile:
  summary: >
    SHEIN 由 Chris Xu 于 2008 年在中国创立，最初是靠 SEO 起家的跨境服装卖家，后来演变成一家 全球化、

    App 原生零售商，运营一个以广州 / 番禺为中心、数字化协调的供应商网络。公司 2022 年将 全球总部迁至新加坡，但大部分采购、贴近设计的协同和制造关系仍留在中国。其核心运营模式把趋势感知、
    快速设计迭代、小批量生产和直面消费者的国际运输结合起来，支撑极低价格和极高 SKU 更新速度。 除核心女装业务外，SHEIN 现在还覆盖男装、童装、家居、美妆品牌 SHEGLAM、转售、通过

    SHEIN X 孵化设计师，以及不断扩张的一体化 Marketplace。
  foundedDate: '2008-01-01'
  founders:
    - name: Chris Xu
      role: 创始人兼董事长
      background: SEO 与跨境电商运营者，把 SHEIN 从一家出口导向的线上服装卖家做成全球超快时尚平台。
      claimRefs: []
