  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按需架构与需求感知
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的核心产品其实是需求驱动的零售运营模式，而不是单一消费者 App。公司官方材料反复称，业务已从供给驱动转向需求驱动；最好的第三方供应链综合材料展示了这套机制如何落地。Value Chain Asia
              称，新款通常以约 100 到 200
              件的小批量发布，再由用户互动和反馈信号决定是否扩大生产。这很关键，因为技术护城河不只是速度，而是把商品管理、数字需求捕获、供应商指令、补货，以及最终退货或转售信号连起来的循环。治理材料还补充说，第一方 App
              和网站数据会以汇总形式用于支持设计决策，这与第三方对需求感知堆栈的描述吻合。实际看，这套架构像一个从信号捕获到小批量测试、再到规模化补货的闭环；产品宽度和移动互动是入口，本身不是护城河。
