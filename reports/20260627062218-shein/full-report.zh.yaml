      - number: '5.2'
        title: 产品组合界面：核心零售、Marketplace、SHEGLAM 与 SHEIN X
        blocks:
          - type: paragraph
            body: >-
              面向消费者的目录已经足够宽，产品地图现在不止核心女装。官方门店和 App Store 描述显示，SHEIN
              销售范围覆盖家居、美妆、宠物、办公、电子、汽车和其他生活方式品类，品牌堆栈也包括相邻标签和项目。SHEGLAM 不只是主 App
              里的一个品类入口；它是独立美妆品牌，有自己的陈列声音、品类结构和以联名带动的发布节奏。Marketplace
              增加的是另一类界面，因为公司现在发布卖家教育和合规材料，而这些只有在第三方选品成为运营模式一部分后才说得通。SHEIN X 是另一个延伸：该计划 2021 年作为设计师孵化器起步，此后演进为 SHEIN
              Xcelerator，明确承诺向参与品牌提供履约和按需生产服务。2023 年 1
              月的项目更新给出更多运营细节，描述了端到端产品开发、制造、营销、物流，以及面向参与设计师的实时分析网站。公开合作也显示产品界面正分叉到共创和包容性设计项目：2025 年 4 月，SHEIN 与 Singapore
              Fashion Council 启动 Every Body Matters
              竞赛，面向围绕不同体型和能力设计系列的设计师。换句话说，产品组合越来越像一个分层平台，由自营零售、自有品牌、第三方卖家和合作品牌赋能组成，全部坐在同一套底层需求和履约引擎上。
