      - number: '4.4'
        title: 财务结论：规模可见、质量不完整，承销应采用区间而非点估
        blocks:
          - type: paragraph
            body: >-
              正面财务故事很直接。SHEIN 已经进入巨型电商规模，至少在部分时期盈利，固定门店负担似乎低于既有玩家，并通过 Marketplace
              和合作品牌服务拓宽变现。负面故事同样直接。利润看起来远比收入增长脆弱，2025
              年销售额和估值估计在可信二级来源之间仍有冲突，公开记录也没有披露那些能区分可持续现金机器和促销型增长引擎的指标。缺失指标包括按界面拆分的毛利率、实现 take rate、退货负担、现金和
              burn、契约约束，以及监管收紧时物流和合规适配的确切成本。关税和 de minimis 改革很重要，因为它们攻击的是模式的核心承诺：从跨境供应链快速送达便宜商品。正确的公开信息结论因此不是“SHEIN
              很弱”或“SHEIN 无法阻挡”，而是：业务显然巨大，财务成熟度高于许多私营创业公司，但在利润率质量和政策韧性上仍太不透明，不能只凭头部规模指标承销。
