      - CR008
      - CR011
      - CR015
      - CR017
      - CR036
      - CR037
      - CR039
      - CR041
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: 为了让模式继续运转并具备上市条件，SHEIN 仍依赖的关键监管方、合作伙伴和系统。
    data:
      nodes:
        - id: d1
          label: SHEIN 核心模式
          description: 按需跨境零售和 Marketplace 引擎
        - id: d2
