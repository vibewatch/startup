chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹与运营模式
        blocks:
          - type: paragraph
            body: >-
              理解 SHEIN，不能把它只看成一家私营的全球线上时尚与生活方式零售商；它的商业锋芒来自数据驱动、按需上新的商品系统，而不是自有制造。官方集团页面把公司描述为以客户为先的零售商；独立报道则锚定更硬的事实：业务
              2008 年从南京起步，由 Chris Xu 创立，后来整合进新加坡总部架构，但仍依赖高度以中国为中心的采购网络。这个组合很关键，因为后文必须把公司的法律和管理中心，与支撑价格、速度和选品的生产引擎分开看。


              运营模式才是最核心的战略事实。官方和独立来源都指向同一套机制：SHEIN 从浏览、购买和反馈数据读取需求信号，再用异常小的初始批量决定生产什么，并迅速给胜出的 SKU 补货。ValueChain Asia
              将初始上新概括为约 100 到 200 件；USCC 则引用报道称，一些首批生产可低至 50 件。这就是零售商低库存、高刷新主张背后的机制，也解释了为什么广州周边制造集群比传统的公司自有工厂版图更重要。


              新加坡总部不等于运营脱钩。Reuters 称，2022 年总部迁移伴随的是供应链和仓库继续集中在中国，同时设立新加坡控股公司架构，为海外上市灵活性服务。落到尽调上，SHEIN
              的公司、资本市场和监管叙事现在是跨国的，但成本、速度和合规风险仍锚在中国供应商网络。
