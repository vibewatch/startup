      - number: '6.3'
        title: 采用规模与客户证据
        blocks:
          - type: paragraph
            body: >-
              当 App Store 足迹与独立市场份额研究结合时，客户证据最强。在 2026 年运行日，美国 App Store 显示 SHEIN 有 2.8 million 条评分；Google Play 显示 9.92
              million 条评价和超过 500 million 次下载。Business of Apps 补充了更宽的历史规模估计，包括 2023 年 88.8 million 活跃购物者、当年 17.3 million
              美国用户，以及 2023 年 238 million 次下载。独立支出面板进一步说明，这不只是漏斗顶部噪音。Bloomberg Second Measure 称，2022 年 11 月，SHEIN
              占被追踪美国快时尚竞争者销售额的一半，并且是被分析同业中唯一实现美国销售额同比增长的玩家。NIQ 显示欧洲图景同样有意义：2022 年英国份额
              40%，西班牙超过一半。因此，对于一家私营公司，公开客户证据在规模代理指标上异常强；但在投资者仍想看到的具体 cohort 或复购买家瀑布上仍然薄弱。
