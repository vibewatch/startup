            title: 合适的可比对象是市场堆栈，而不是单一 TAM 标签
            body: SHEIN 位于一个非常大的线上服装 TAM 内，但它真正的竞争场窄得多：移动优先、跨境、低价时尚零售。把这些层级视为同一件事，要么夸大可服务市场，要么低估政策敏感性。
