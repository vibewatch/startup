      - number: '6.5'
        title: 留存、扩张与集中度缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据很容易让人想象 SHEIN 客户耐久性的上行情景，尽管很难用数字证明。SHEIN 可以从核心女装扩到男装、童装、家居、美妆和综合商品，同时把同一批用户留在促销密集的移动 App 里。SHEGLAM
              扩大了美妆钱包份额，Shein Exchange 则在首次购买后又给用户一个留在生态里的理由。evoluSHEIN x Anitta 胶囊系列和 Or Foundation EPR
              基金显示，管理层也在围绕明星上新和循环叙事制造重复触点，而不只是每天做价格促销。Business of Apps 还暗示了一个培养习惯的节奏：每天约新增 2,000
              件商品，促销系统设计成把购物者不断拉回来。SHEIN X 周年发布又提供了一条扩张线索：来自 20 多个国家的近 3,000 名设计师已通过该项目推出近 2,000 个系列和超过 25,000
              件原创作品，这有助于解释新鲜感和创作者主导的供给如何让用户保持参与。缺失的数据，恰恰是投资人判断客户质量时最关键的部分：公开来源不披露流失率、NRR、复购
              cohort、当前运行期的主要国家贡献、退货率经济性，或少数买家 / 地理 cohort 的集中度。因此，公开证据支持一个可信的先落地再扩张的消费引擎，但还不足以清晰衡量耐久性或集中度。
