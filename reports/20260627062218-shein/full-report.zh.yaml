        - 按地区披露品类结构、毛利率和退货率。
      - - 美妆 / 家居 / 生活方式
        - 与服饰并列销售的跨品类一方商品
        - SKU 销售
        - App 商店和网站描述中清晰可见
        - 收入结构质量低
        - 按品类披露非服饰收入结构和贡献利润率。
      - - 平台卖家商品
        - 第三方卖家在 Shein 上架商品，并需要合规支持
        - 抽佣率 / 卖家服务
        - 运营层面可见，具体抽佣率未公开
        - 低
        - 披露平台 GMV、抽佣率、卖家结构和退款负担。
      - - 合作品牌 / Xcelerator 服务
        - 为外部品牌提供 DTC 服务和按需生产
        - 服务费 / 生产服务
