            body: >-
              合理的牛市情景存在，但有条件。它要求证明 2024–2025 年收入仍高于 380 亿至 400 亿美元区间，利润从 2024
              年下滑中反弹而不是继续压缩，并且管理层能通过一个投资人认为可信的上市地提交文件，尽管劳工和贸易审查仍在持续。如果这些条件满足，400 多亿美元高段、甚至 500
              亿美元以上都可以讨论。基准情景更低，因为公开记录仍缺少经审计的利润率、营运资本、库存和股权结构细节；没有这些披露，支撑最充分的区间仍在约 350 亿至 450 亿美元。熊市情景也真实存在：如果 de
              minimis 结束后的经济性削弱转化，如果采购多元化滞后，或如果香港路径也停滞，市场已经表现出愿意讨论约 300 亿美元标记。实际建议因此很直接：跟踪或继续研究，而不是买入，除非价格和披露都实质性改善。
