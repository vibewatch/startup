      - number: '3.4'
        title: 替代品与现状：转售、便利购物和既有玩家服务预期
        blocks:
          - type: paragraph
            body: >-
              严肃承销也必须考虑那些并不在 SHEIN 与某个具名对手之间二选一的购物者。有些消费者会根据便利、信任、可持续性或新鲜感的优先级，用 Amazon 购物篮、门店型快时尚或二手流通来完成同一任务。SHEIN
              自己的转售和退货举措显示，管理层理解这种行为；公司试图把替代需求内化，而不是忽视它。即便如此，替代品仍重要，因为它们限制定价权。新鲜感最重要时，SHEIN
              的规模和节奏仍难匹敌。交付速度、轻松退货或品牌保证最重要时，Amazon、Zara 和 H&M 更有说服力。可持续或循环时尚叙事重要时，二手会拿走份额。实际结果是，SHEIN 在 App
              原生低价时尚中的竞争压力最强，但更广泛的替代集合让市场结构性受争夺，也让长期护城河耐久性变成有条件，而非自动成立。
