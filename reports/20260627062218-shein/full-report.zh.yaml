        title: 私募标记、利润压力与 IPO 背景
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的估值讨论，焦点已经不再是公司够不够大，而是市场该给一个有规模、但暴露在争议中的零售商打多大折扣。公开报道给出三个可用锚点。第一，2023 年融资轮把公司估值放在 600 多亿美元中段。第二，2024
              年初讨论的私募二级市场标记更接近 450 亿美元。第三，2025 年围绕伦敦 IPO 的报道显示，市场讨论已经漂向约 500 亿美元；在部分投资人施压情景下，更接近 300
              亿美元。这些变化不是随机的。它们跟随的是利润报告走弱、贸易政策压力升高，以及公司始终无法在美国、英国、中国和香港之间拿到一条干净、低摩擦的上市路径。关键推论是，SHEIN
              不再按一个无摩擦的超增长故事估值。市场把它当成一个非常大的零售商，其退出路径和利润率耐久性，都需要比传统快时尚同行更重的折价。
