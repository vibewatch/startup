  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群、地域与价值主张
        blocks:
          - type: paragraph
            body: >-
              SHEIN 的客户地图远比“女性超快时尚”这个简称更宽，即便女性仍像是重心。首页和 About Us 界面展示的品类覆盖男装、童装、家居生活、美妆、电子、宠物、办公、玩具和其他生活方式需求；Our Group
              则把公司描述为一家围绕可负担性和可及性打造的全球时尚与生活方式零售商。Marketscreener 的 Reuters 来源 IPO 报道和 Business of Apps 都支撑基本的全球足迹叙事，后者称
              SHEIN 在 150 个国家运营，前者称其在 150 多个国家销售。与此同时，Business of Apps
              称绝大多数客户仍是女性，这与目录和陈列仍锚在女装上的体感一致。公司支持的包容性项目也显示，SHEIN 正试图在不放弃核心的情况下扩大共鸣——Every Body Matters
              合作把设计围绕不同体型和能力展开；后续 NAFA 胶囊系列合作则把四个入围包容性时尚设计转化为计划在 App 和网站全球销售的产品。Vision 2045 还称 SHEIN 希望带客户一起走上可持续旅程；英国
              Football for Change gala
              赞助则把这条面向客户的叙事延伸到支持女性、年轻女孩和服务不足社区。结果是，客户基础在品类和地域上很宽，但经济上很可能仍由女装核心牵引，再带动向家居、美妆和相邻性价比购物任务的交叉销售。
