        - 相邻便利性替代品
        - 在最大消费平台之一内部销售时尚商品
        - 优先考虑便利性、购物篮广度或配送确定性的消费者
        - 贴近 Prime 的物流和多品类便利性
        - 不是时尚原生发现目的地
      - - Cider
        - 数字原生潮流时尚竞争者
        - 只做线上的女装品牌，促销力度大
        - 对风格敏感的年轻女性
        - 线上原生时尚调性和促销驱动获客
        - 商品宽度小于 Shein 或 Temu，规模也没那么显眼
      - - 转售 / 二手 App
        - 替代品 / 现状选项
        - 循环时尚需求增长，Shein 转售活动也在出现
        - 关注预算和可持续性的消费者
        - 相比买新品，价格更低或可持续叙事更强
        - 商品不稳定，潮流响应更慢
      - - 商场 / 折扣快时尚
        - 现有线下替代品
        - 数字传播较弱，但本地可得性仍在
        - 想试穿、快速退货或立即购买的消费者
        - 即时到手和熟悉的服务规范
        - 相比超快时尚 App，新鲜感有限
    notes: 本表覆盖已审阅公开证据中最重要的直接、既有、相邻和替代选项，而不是每一个区域快时尚品牌。
