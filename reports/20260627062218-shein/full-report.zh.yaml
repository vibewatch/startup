  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商
      - 公开包装
      - 价格 / 单位 / 合约模式
      - 已含能力
      - 折扣或未知项
      - 含义
    rows:
      - - SHEIN
        - App 驱动的一方零售 + 增长中的平台业务
        - 促销驱动 SKU 定价；首单折扣和限时抢购叙事
        - 商品广、免运费 / 退货信息、社交发现
        - 实际购物篮经济性和平台抽佣率未公开
        - 优化目标是转化和重复成批购买，而不是透明利润率
      - - Temu
        - 平台应用
        - 交易折扣驱动的平台定价，附免运费和 90 天退货
        - 数千种商品和广泛品类覆盖
        - 卖家经济性和补贴强度未公开
        - 对 Shein 的低价便利故事形成非常直接的压力
      - - Zara
        - 品牌服饰零售
        - 按 SKU 目录定价；没有公开订阅包装
        - 精选系列和 App 联动浏览
        - 已审阅来源中，促销策略不是核心
        - 更多靠设计和信任竞争，而不是最低客单价
      - - H&M
        - 平价时尚全渠道零售
        - 按 SKU 目录定价，可见降价和会员层
        - 时尚、家居、美妆、奖励和订单追踪
        - 促销对实际利润率的影响未公开可见
        - 在可负担价格、服务和忠诚机制之间取平衡
      - - Amazon Fashion
        - 平台折扣入口
        - 按 SKU 和卖家区分的平台定价
        - 商品宽度、配送便利和平台选择
        - 时尚业务经济性埋在更广泛的 Amazon 平台条款里
        - 消费者把便利性放在时尚身份前面时会胜出
      - - Cider
        - 促销驱动的数字原生时尚
        - 折扣码和大促驱动 SKU 定价
        - 女装潮流时尚和线上发现
        - 规模、复购经济性和退货画像在公开层面不透明
        - 更像风格对手，而不是真正的宽度对手
    notes: 公开可见的定价信号多为促销和 SKU 层面；已审阅公开页面无法推断私下折扣、供应商补贴和真实贡献利润率。
