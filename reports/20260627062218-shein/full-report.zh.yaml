  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从规模、争议折扣、上市同业和披露缺口出发，推导当前推荐。
    data:
      nodes:
        - id: n1
          label: |-
            规模证据
            $30B+ 收入和领先份额
          type: strength
        - id: n2
          label: |-
            私募估值压缩
            $66B → $45B → $30B–$50B 争议区间
          type: neutral
        - id: n3
          label: |-
            上市同业倍数区间
            ~1.2x H&M 至 ~7.7x Fast Retailing
          type: neutral
        - id: n4
          label: 劳工 / IPO / 关税阴影
          type: risk
        - id: n5
          label: 缺少招股书级公开财务数据
          type: risk
        - id: n6
          label: |-
            基准情形
            $35B–$45B
          type: conclusion
        - id: n7
          label: |-
            IPO 高端估值说法
            需要更强证据
          type: risk
        - id: n8
          label: |-
            推荐
            继续研究 / 跟踪
          type: conclusion
    approximationNotes: 这是定性决策链，不是加权模型。它拆出一个矛盾：公司运营表现可以很亮眼，但新资金进场时仍对价格高度敏感。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV010
      - CV015
      - CV016
      - CV030
      - CV031
      - CV035
      - CV040
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在选定销售倍数下，支撑特定股权价值所需的隐含收入。
    data:
      items:
        - label: $30B，对应 1.0x 销售额
          value: 30
        - label: $40B，对应 1.0x 销售额
          value: 40
        - label: $50B，对应 1.0x 销售额
          value: 50
        - label: $45B，对应 1.5x 销售额
          value: 30
        - label: $50B，对应 2.0x 销售额
          value: 25
    approximationNotes: 数值为隐含年收入，单位是十亿美元。它们显示，一旦投资者把定价推到带争议折扣的 1x 销售额框架之上，承销负担会多快上升。
    claimRefs:
      - CV010
      - CV015
      - CV016
      - CV017
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 相对于当前公开证据的低位、基准和较高端估值结果。
    data:
      items:
        - label: 熊市情形
          low: 25
          mid: 27.5
          high: 30
        - label: 基准情形
          low: 35
          mid: 40
          high: 45
        - label: 有条件上行
          low: 45
          mid: 50
          high: 55
        - label: 2024 二级交易锚点
          low: 45
          mid: 45
          high: 45
        - label: 2023 融资锚点
          low: 66
          mid: 66
          high: 66
    approximationNotes: 所有数字均为估算值，单位是十亿美元。2023 和 2024 锚点来自已报道交易或二级市场参考；情景区间则反映基于当前证据加权后的判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV040
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 1–10 分制，对当前估值论证做投资委员会式打分。
    data:
      items:
        - label: 收入规模
          value: 9
        - label: 市场位置
          value: 8
        - label: 当前盈利可见度
          value: 4
        - label: 监管阴影
          value: 3
        - label: 披露质量
          value: 3
        - label: $35B–$45B 的同业支撑
          value: 6
        - label: $50B+ 的同业支撑
          value: 4
    approximationNotes: 评分来自判断，并按证据加权。低分反映尚未解决的承销问题，并不意味着怀疑 SHEIN 已具规模。
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV030
