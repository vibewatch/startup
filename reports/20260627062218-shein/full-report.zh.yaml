      - number: '2.2'
        title: 市场规模与渗透率
        blocks:
          - type: paragraph
            body: >-
              文件集中最宽的外部市场数字来自 Research and Markets：全球电商服装市场 2024 年约 $685.7B，到 2033 年以 8.07% CAGR 增至约
              $1.37T。这个数字适合作为外层边界，但单独拿来当 SHEIN 的 SAM 太宽。公开数据无法干净切出跨境低价时尚子集，因此本章有意使用多重规模视角，而不是假装单一 TAM/SAM/SOM 堆栈完全可观测。


              从公司规模看，SHEIN 已经大到足以影响大盘。Business of Apps 估计 2023 年收入为 $32.5B；Statista 称 2025 年电商净销售额超过 $50B，2026 年初估值仍约
              $66B。这些数字并不等于 SHEIN 就是整个快时尚市场，但确实说明公司已经达到能撬动品类份额统计的规模。


              渗透率证据在区域份额数据中最强。Bloomberg Second Measure 称，按支出份额计算，SHEIN 已成为美国最大快时尚玩家；NielsenIQ 显示，公司在法国超快时尚市场占
              33.8%，在西班牙的品类渗透率从 2019 年 21% 升至 2022 年 33%。合在一起看，市场既很大，也仍在换份额，但狭义 SAM 的精确边界仍被不一致的公开定义部分遮蔽。
