      - number: '6.2'
        title: App 界面、品类宽度与购物体验
        blocks:
          - type: paragraph
            body: >-
              移动 App 是 SHEIN 如何包装客户体验的最清晰证据之一。Apple 和 Google 都把该 App 描述为覆盖时尚、家居、美妆、配饰、鞋履、宠物、电子、工具和办公品类；两者也都强调通知和促销提醒，App
              Store 还特别突出在线聊天、限时闪购和先买后付选项。这很重要，因为价值主张不只是低价，还包括一个持续刷新、App 原生的购物环境，让客户为新品和促销不断回来。SHEIN 发布的 2025 年 Harris
              Poll 研究称，80% 的美国成年人把价格列为选择零售商的首要因素，56% 优先考虑款式多样性，72% 的 SHEIN 客户称服装预算紧张。一项更早的 Bloomberg 相关 SHEIN
              趋势调查还称，超过一半受访美国客户在寻找适合工作的轻便连衣裙和两件套，指向一种既要趋势响应选品、又重视舒适和可负担性的购物者。Google Play 还暴露了用于内容和互动功能的权限堆栈，包括通知、相机、照片 /
              视频、位置、日历和麦克风。相比 Zara 或 H&M 的 App 信息更偏门店整合、策展系列或会员，SHEIN
              更强烈地押注宽度、速度、社区和便利。这一定位契合移动优先、折扣驱动的购物者：他们愿意用策展极简换取丰裕、提醒和快速选品周转。
