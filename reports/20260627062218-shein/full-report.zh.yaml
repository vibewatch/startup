      - 说明什么
      - 仍未知什么
      - 来源支撑的含义
    rows:
      - - 年收入比 $30B “多得多”
        - CNBC 报道的外部合作伙伴引述
        - 收入规模已经很大
        - 不披露产品、地区或利润率结构
        - 审计公开披露前，规模已经可见。
      - - 首单额外 30% 折扣
        - App Store 文案
        - 获客明显前置促销
        - 折扣核销率和回本周期未知
        - 营销强度可能显著高于标价暗示。
      - - 限时抢购最高 90% 折扣
        - Google Play 文案
        - Shein 用深度促销叙事制造紧迫感
        - 混合 ASP 和贡献利润率未知
        - 消费者牵引力可能靠有意义的价格让利支撑。
      - - $10 连衣裙、$12 牛仔裤等低客单示例
        - Reuters 关联的 MarketScreener 报道
        - Shein 从极低客单基线竞争
        - 单品毛利和运输补贴未知
        - 关税或海关摩擦会直接打击消费者价值感知。
      - - 免运费和免费退货信息
        - App 商店界面和物流合作
        - 转化部分依赖降低摩擦，而不只是便宜商品
        - 退货滥用、承运商成本和地域排除未公开
        - 物流是变现核心部分，不是外挂福利。
      - - 平台卖家教育和合规工具
        - 官方卖家计划
        - 第三方变现可能依赖服务和治理层
        - 卖家费率结构和合规成本回收未公开
        - 平台增长可能用毛利率换宽度和合规准备度。
    notes: 公开定价证据高度促销化、面向消费者；不应误认为实际净收入或单位经济性。
