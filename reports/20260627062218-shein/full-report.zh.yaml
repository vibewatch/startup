  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接超快时尚对手、全渠道既有玩家与更广泛购物替代品
        blocks:
          - type: paragraph
            body: >-
              SHEIN 竞争的不是单一类型的服装商家。直接的超快时尚对手是 Temu，它把低价、宽品类覆盖、低摩擦运输和退货打包进一个 App 驱动的 Marketplace。Zara 和 H&M
              的重要性不同：它们更慢、策展更强，但把时尚可信度与门店、App 连续性，以及熟悉的退货或会员机制结合起来。Amazon Fashion 不是时尚原生同业，但只要购物任务是“便宜、快、方便”而不是“从单一时尚
              App 发现趋势”，它就是真实替代品。Cider 更窄、更偏女装，因此能触达重视风格的人群，但宽度无法匹配
              SHEIN。转售和二手渠道也应纳入竞争集合，因为它们吸收追求性价比或受可持续动机驱动的需求，而这些需求本可流向新的超快时尚购买。公开市场份额和流量证据因此支持一个宽竞争框架：SHEIN
              在关键数字界面领先，但替代集合很宽，而且越来越多形态并存。
