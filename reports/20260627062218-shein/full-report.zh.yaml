      - number: '1.4'
        title: 里程碑、IPO 路径与不利压力
        blocks:
          - type: paragraph
            body: >-
              里程碑记录在商业加速上异常清晰，在法律闭环上却异常混浊。正面来看，公开报道支撑了一条连贯路径：2008 年创立，SheInside 时代扩张，2015 年更名为 SHEIN，2022 年迁至新加坡，随后进入
              2023–2025 年上市准备。官方披露也显示，集团在 ESG 报告、合作伙伴关系和品牌扩张上更正式。这条时间线很重要，因为它说明公司已从跨境服装网站成熟为大型跨国私营发行人。


              不利记录同样重要。USCC 概括了围绕 de minimis 利用、强迫劳动、产品安全和数据风险的持续担忧。CNBC 称，美国 de minimis
              漏洞关闭、欧洲和英国可能跟进，以及关于强迫劳动和消费者实践的持续指控，共同加剧了 IPO 压力。The Fashion Law 又补上一层诉讼：截至 2024 年中，公司面临 40
              多起活跃案件，知识产权争议是主导类别，其中一宗设计师诉讼还嵌入 RICO 理论。


              对后文的实际读法是，SHEIN 的估值和公开市场选项现在已经离不开监管。公司有足够规模、App 触达和供应商速度优势，值得严肃关注；它也有足够多的海关、劳工、IP
              和消费者保护压力，任何估值讨论都必须为监管波动打折，而不能假设上市路径干净顺畅。
