        - 无法仅靠公开资料承保资本充足性
        - 审阅资金仪表盘、债务协议和董事会跑道情景。
      - - 按地区拆分的退货率和物流成本
        - 本地化和免费退货承诺可能掩盖重大成本差异
        - 要求按地区提供退货率、承运人成本和逆向物流数据。
      - - 折扣调整后的 ASP 和获客回本周期
        - 公开价格促销很重，几乎看不出真实客户经济性
