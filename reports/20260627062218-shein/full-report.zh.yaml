      - number: '5.4'
        title: 信任、安全、合规与未解风险
        blocks:
          - type: paragraph
            body: >-
              治理上，SHEIN 已经不止停留在泛泛 ESG 表述，而是暴露出一套相当可读的控制堆栈。Governance 页面把数据安全和隐私、产品安全、知识产权、税务合规和政策文件列为明确工作流；它还称，一个位于美国的
              Privacy Office 监督个人数据保护，客户数据不会被出售或共享，并且只收集最低必要数据。安全姿态也从软性措辞转向具名验证：2025 年，SHEIN 称其 Europe Technology Centre
              在欧洲电商平台和 Dublin 办公版图范围内取得 ISO 27001:2022 认证，至少为信息安全管理给出了具体流程信号。随着第三方选品扩张，Marketplace
              卖家教育又增加了产品安全和质量控制层。上述动作都没有清空不利案卷。USCC 仍突出生产流程、采购、产品安全、强迫劳动和 IP 担忧；The Fashion Law 则整理版权、商标和 RICO 式诉讼。另一篇
              Fashion Law 诉讼报道指称大规模版权和商标侵权，以及与侵权相关的敲诈活动；CNBC 在 2025 年 5 月把 SHEIN 的 IPO
              描述为陷入困境。结果是，公司拥有比许多私营零售商更可见的合规工具，但仍背着不可忽视的供应链和法律压力，这些压力会影响产品耐久性和治理承销。
