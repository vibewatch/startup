          description: 制造和采购基地
        - id: d3
          label: 中国监管机构
          description: 上市路径的审批关口
        - id: d4
          label: CBP / 美国进口规则
          description: 关税负担和强迫劳动审查
        - id: d5
          label: TIC 和安全伙伴
          description: 产品检测和 Marketplace 合规支持
        - id: d6
          label: Happy Returns / 逆向物流
          description: 美国售后回收和退货
        - id: d7
          label: 公开市场窗口
          description: 投资者、上市地点和承销胃口
      edges:
