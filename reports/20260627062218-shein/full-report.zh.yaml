  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - Shein 的新鲜度速度难以复制
        - Temu 和其他 App 原生对手复制价格驱动发现的速度，会快于门店型既有品牌
        - 高
        - 按国家跟踪相对 Temu 的流量、转化和重复下单趋势。
      - - 供应商网络深度是持久优势
        - 供应商生态需要持续投入，也持续暴露在劳动和合规审查下
        - 高
        - 要求披露供应商集中度、交付周期指标和合规整改成本。
      - - 商品广度提升钱包份额
        - 平台扩张会提高质量控制和产品安全复杂度
        - 中
        - 审查卖家抽佣率、质量失败率和执法流程。
      - - 低价驱动重复成批购买
        - 关税和小额豁免改革会直接冲击这套报价的经济基础
        - 高
        - 建模政策后价格弹性和毛利率转嫁情景。
      - - App 分发给 Shein 带来强直接触达
        - 转换成本低，用户很容易在 Temu、Amazon、Zara 和 H&M 之间多栖
        - 高
        - 询问优惠券或配送变化后的用户分群留存和跨店购买行为。
      - - 转售和退货工具弥补便利性缺口
        - 门店型既有品牌仍掌握更强信任和线下服务预期
        - 中
        - 比较线下与数字流程的退货成本曲线和客户满意度。
    notes: 本登记表聚焦最可能改变长期竞争假设的耐久性问题，而不是短期货品运营战。
