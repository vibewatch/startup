  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 劳工 / 海关事件
        - 直接 UFLPA 扣留模式、不利执法，或新的国会升级
        - 同时抬高合规成本并伤害上市可信度
        - 下调可接受估值区间，并暂停溢价情景承销。
      - - 上市地失败
        - 伦敦受挫后，香港或替代路径也停滞
        - 推迟退出时间，并削弱投资者对治理就绪度的信心
        - 将可选性视为受损，并回到低风险零售同行区间。
      - - 利润率压力
        - 有证据显示，关税或税费变化对转化或毛利率的伤害超出预期
        - 削弱支付哪怕 H&M 式公开市场倍数的理由
        - 转向熊市情景，并要求更低进入价格。
      - - 法律升级
        - 法院事件不利，或 IP 索赔范围扩大
        - 在上市窗口期增加拨备风险和叙事伤害
        - 上调折现率，并假设持续合规成本更高。
      - - 披露不及预期
        - 招股书省略或弱化经审计 EBITDA、现金流、股权结构或采购细节
        - 使市场无法收窄争议折价
        - 维持继续研究立场，避免估值拉伸。
    notes: 这组触发因素聚焦真实投委会可以从申报、新闻或尽调材料中跟踪的事件，不假装能提前知道私人管理层数据。
    claimRefs:
      - CV008
      - CV009
      - CV031
      - CV033
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计盈利能力
        - 完整经审计 EBITDA、毛利率、自由现金流和营运资本桥
        - 缺少这些，即使基准情景也只是架在估算收入上的估算。
        - 要求提供招股书级别财务包，或在 NDA 下提供经审计报表。
      - - 股权结构和优先权栈
        - 最新股份类别、清算优先权、期权池和任何特殊投资者保护
        - 公开估值传言不等于普通股公允价值。
        - 要求提供法律版股权结构摘要和新资金优先权安排。
      - - 关税传导
        - de minimis 和关税变化后，观察到的价格、转化和利润率影响
        - 低价论点取决于 SHEIN 重新定价时能否保住流量。
        - 要求提供按地域拆分的政策后表现仪表盘。
      - - 采购多元化
        - 证据显示采购或路由有多少已远离中国相关敏感性
        - 更干净的供应链可以支撑更窄风险折价。
        - 要求提供国家组合、交付周期，以及多元化前后的到岸成本对比。
      - - 监管 / 法律结案
        - 任何上市地尽调材料中，劳工、海关和主要 IP 争议的当前状态
        - 这些压力最可能在流程后期迫使折价加深。
        - 承销 IPO 订单前，要求提供律师备忘录和监管工作流跟踪表。
    notes: 这些问题按其推动估值立场从叙事驱动转向证据驱动的能力排序。缺少前三项，判断就应保持价格纪律。
    claimRefs:
      - CV031
      - CV035
      - CV040
      - CV041
      - CV042
