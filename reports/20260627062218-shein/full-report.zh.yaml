              投资人缺的功课异常具体。公开证据仍没有提供招股书级别的细节，包括经审计
              EBITDA、自由现金流、库存、营运资本强度、客户获取成本、股权结构优先权，以及有多少模型可以从中国迁出而不破坏性价比。这很关键，因为争论不再是 SHEIN
