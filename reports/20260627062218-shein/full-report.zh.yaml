      - number: '1.2'
        title: 创始人、领导层与治理姿态
        blocks:
          - type: paragraph
            body: >-
              领导权高度集中。无论官方还是独立来源，Chris Xu 都是持续存在的创始人控制人物，尽管名称在 Chris Xu、Xu Yangtian 和官方对外的 Sky Xu 之间变化。Donald Tang
              的角色不同但重要：他是执行董事长，也是面向投资者、合作伙伴和公开市场沟通的声音。这种分工更像是创始人控制加上一层职业化的外部界面，用于融资和 IPO 导航，而不是一个广泛、透明披露的高管团队。


              治理透明度仍明显弱于运营可见度。SHEIN
              的治理页面大量谈及隐私、产品安全、合规和供应商安全标准，但公开披露仍不像上市零售商投资者预期的那样展示高管、董事会或委员会透明度。这个缺口很重要，因为公司正在推销一个越来越机构化的治理故事，但它仍依赖创始人控制、第三方制造商，以及外部无法细查的内部合规系统信任。


              不过，SHEIN 已经建立起比几年前更正式的治理信号。年度可持续发展报告、供应商审计披露，以及围绕隐私和合规的反复表述，都显示出有意的 IPO
              前包装。这些动作提升了流程可见度，但没有解决围绕董事会独立性、委员会构成，以及 Chris Xu、Donald Tang 与新加坡控股结构之间确切权力划分的核心尽调问题。
