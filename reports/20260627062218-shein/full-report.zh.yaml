  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              定义 SHEIN 市场的正确方式，是把它看成分层堆栈，而不是单一标签。最宽的 TAM
              是全球电商服装，外部市场研究能给出实际美元规模。里面一层是快时尚和超快时尚的行为细分，消费者把趋势响应和低客单价放在品牌传承前面。再往里，才是 SHEIN
              最直接的竞争场：从以中国为中心的供应基地发货给终端消费者、跨境、移动优先、低价的时尚零售。这样定义市场，可以避开 SHEIN 分析中的两个常见错误：把公司仅称为“服装电商”，这太宽；或把它当成 Zara 和
              H&M 的纯快时尚同业，这会漏掉跨境 App-Marketplace 动态。


              纳入的支出应覆盖线上服装、时尚导向配饰，以及作为同一购物任务一部分陈列的相邻低客单生活方式商品。排除的支出应包括奢侈服装、大部分线下服装支出，以及不共享同一价格、趋势和发现机制的广义非时尚 Marketplace
              GMV。这个排除逻辑很重要，因为消费者会在 Zara、H&M、Temu、Amazon Fashion 和 Cider 之间替代，但替代理由不同：有的拼品牌策展，有的拼极致性价比，有的拼 Marketplace
              宽度。


              官方网站也强化了一个判断：这不是纯服装市场。SHEIN、Temu、H&M 和 Amazon 都把时尚与家居、美妆、配饰等相邻品类放在一起呈现。实际结论是，分析师应先用线上服装衡量
              SHEIN，再看快时尚份额，第三层才是跨境低价零售经济性。
