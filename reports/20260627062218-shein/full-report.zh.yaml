        - Shein 生态内的二手上架和卖家活动
        - 上架 / 交易活动
        - 战略上可见，但尚未作为已披露收入线呈现
        - 低
        - 澄清转售是变现、补贴，还是由互动驱动。
      - - 组合 / 品牌变现
        - Missguided 等自有或收购品牌扩大商品和品牌触达
        - 品牌销售 / 授权 / 组合收入
        - 资本部署已确认；具体收入贡献未知
        - 低
        - 提供被收购品牌收入、毛利率和整合成本。
    notes: 本表把清晰可观察的变现界面，与判断收入质量仍需要的私有经济性拆开。
