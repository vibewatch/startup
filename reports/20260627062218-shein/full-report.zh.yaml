    rows:
      - - 按业务线拆分的毛利率
        - 无法判断收入增长是经济上有吸引力，还是靠高额补贴撑起
        - 获取按第一方、Marketplace 和服务业务拆分的月度毛利润桥表。
      - - Marketplace GMV、抽佣率和退款负担
        - Marketplace 可能增厚利润率，也可能只是增加复杂度
