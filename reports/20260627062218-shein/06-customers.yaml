  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Current repeat-buyer cohorts, churn, NRR, GRR, and order-frequency data by geography or category.
    whyItMatters: Without retention cohorts, public scale proof cannot be translated cleanly into customer-quality underwriting.
    diligencePath: Request cohort tables by first-order month, category, and geography, plus repeat-purchase cadence and churn.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: returns-economics
    missingEvidence: Return rate, BORIS adoption, refund-cycle time, and cost-to-serve by market.
    whyItMatters: Returns convenience is central to the proposition, but no public source quantifies whether it is economically attractive or operationally stable.
    diligencePath: Request market-level return-rate dashboards, BORIS usage, and refund / resale recovery metrics.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: geographic-concentration
    missingEvidence: Current active-buyer and GMV concentration by top country, category, and mobile platform.
    whyItMatters: 150+ country reach sounds diversified, but concentration could still be high in a small set of geographies or cohorts.
    diligencePath: Request country-level active buyers, GMV, repeat rate, and contribution margin for the top ten markets.
    relatedQuestionRefs:
    - QU003
    - QU011
    - QU024
    relatedTableRefs:
    - TU002
    - TU005
  - type: missing-source
    severity: material
    topic: TU003 named customer proof roster
    missingEvidence: A broader named-customer or cohort-level roster with repeat-purchase, tenure, and outcome detail beyond app-store cohorts and reviewer anecdotes.
    whyItMatters: The public proof set confirms real shoppers exist, but it does not show which named cohorts are most valuable or durable.
    diligencePath: Request top-country customer cohorts, loyalty or repeat-buyer segments, and any case-study style customer panels that quantify order frequency or retention.
    relatedQuestionRefs:
    - QU015
    - QU023
    relatedTableRefs:
    - TU003
