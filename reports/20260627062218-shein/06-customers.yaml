- id: retention-expansion-and-concentration-gaps
  title: Retention, expansion, and concentration gaps
  body: 'The upside case for customer durability is easy to imagine from public evidence even though it is hard to prove numerically. SHEIN can expand from core women''s fashion into men, kids, home, beauty, and general merchandise while keeping the same customer inside a promotion-heavy mobile app. SHEGLAM broadens wallet share inside beauty, while Shein Exchange offers one more reason to remain in the ecosystem after the initial purchase. The evoluSHEIN x Anitta capsule and the Or Foundation EPR fund show management is also trying to create repeat touchpoints around celebrity drops and circularity narratives, not just daily price promotions. Business of Apps also suggests a habit-forming cadence, with roughly 2,000 new items added per day and a promotional system designed to draw shoppers back. The SHEIN X anniversary release adds one more expansion clue, saying nearly 3,000 designers from more than 20 countries had already launched nearly 2,000 collections and more than 25,000 original creations through the program, which helps explain how novelty and creator-led assortment can keep shoppers engaged. The missing data are the ones that matter most to an investor underwriting customer quality: public sources do not disclose churn, NRR, repeat-order cohorts, top-country contribution by current run date, return-rate economics, or concentration by a handful of buyer or geography cohorts. Public evidence therefore supports a credible land-and-expand consumer engine, but not a cleanly measured durability
    or concentration profile.'
