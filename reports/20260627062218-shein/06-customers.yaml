company:
  name: SHEIN
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a genuinely mass-market, mobile-first SHEIN customer base spread across more than 150 countries and far beyond core women's apparel into home, beauty, and general lifestyle categories. The strongest proof comes from app-store scale, market-share studies, and customer-facing returns/value surfaces, while retention, return-rate economics, and concentration remain materially under-disclosed.
sections:
- id: segments-geographies-and-value-map
  title: Segments, geographies, and value proposition
  body: SHEIN's customer map is much broader than the shorthand of “women's ultra-fast fashion” suggests, even if women still appear to be the center of gravity. The homepage and About Us surfaces show categories across men, kids, home and living, beauty, electronics, pets, office, toys, and other lifestyle needs, while Our Group describes the company as a global fashion and lifestyle retailer built around affordability and accessibility. Marketscreener's Reuters-sourced IPO coverage and Business of Apps both support the basic global-footprint story, with the latter also stating that SHEIN operates in 150 countries and the former saying it sells in more than 150 countries. At the same time, Business of Apps says the vast majority of customers are still women, which is consistent with how the catalog and merchandising still feel anchored in women's fashion. Company-backed inclusivity programs also show how SHEIN is trying to broaden resonance without abandoning that core — the Every Body Matters partnership frames design around different body types and abilities, while the later NAFA capsule collaboration turned four shortlisted inclusive-fashion looks into products slated for global sale on the app and website. Vision 2045 also says SHEIN wants to bring customers along on its sustainability journey, and the Football for Change gala sponsorship in the UK extends that customer-facing narrative into support for women, young girls, and underserved communities. The result is a customer base that is broad by category and geography, but still economically likely to be led by the women's fashion
    core that powers cross-sell into home, beauty, and adjacent value-shopping missions.
