figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: The customer journey starts with price-led discovery and extends into cross-category browsing, checkout, returns, and repeat engagement loops.
  data:
    items:
    - id: discover
      label: Discover
      actor: Price-sensitive mobile shopper
      description: The shopper finds SHEIN through the app, rankings, social buzz, or broad category search for inexpensive fashion and lifestyle goods.
      channels:
      - App stores
      - Homepage
      - Social / promotions
    - id: browse
      label: Browse breadth
      actor: Cross-category shopper
      description: The shopper moves from women's fashion into men, kids, home, beauty, or other adjacent categories inside the same app surface.
      channels:
      - Women
      - Kids
      - Home & Living
      - Beauty / SHEGLAM
    - id: transact
      label: Transact
      actor: Consumer buyer
      description: Checkout is supported by promotions, free-return messaging, Afterpay, and broad payment support designed to reduce friction.
      channels:
      - Flash sales
      - Afterpay
      - Coupons
      - Live chat
    - id: resolve
      label: Resolve post-purchase
      actor: Buyer with support or return need
      description: Returns can route through free-return messaging, digital customer service, or BORIS at Forever 21 via Happy Returns.
      channels:
      - Free returns
      - Happy Returns
      - Live chat
    - id: repeat
      label: Repeat / expand
      actor: Existing SHEIN customer
      description: Notifications, community, daily assortment changes, beauty adjacency, creator collaborations, recommerce, and sustainability/community storytelling create multiple hooks for coming back.
      channels:
      - Push alerts
      - SHEGLAM
      - SHEIN Exchange
      - New drops
      - Anitta capsule
      - Impact / circularity
