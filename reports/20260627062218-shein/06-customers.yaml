tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - Women's fashion core shopper
    - Buyer=user=payer; style-led individual shopper
    - Browse frequent drops, flash sales, and low-ticket wardrobe refreshes
    - Business of Apps says most customers are still women; Bloomberg-cited trend-survey coverage highlights demand for dresses and two-piece sets for work; homepage and app copy remain women-led
    - Economic center of gravity that can seed cross-category expansion
    - No disclosed repeat-order frequency or gross margin by this core cohort
  - - Family / household value shopper
    - Buyer often adult household shopper; users may include men, kids, babies, or home purchasers
    - Bundle fashion, home, kids, and adjacent needs into one low-friction app
    - Homepage and About Us expose men, kids, baby, home, appliances, toys, and office categories
    - Raises basket breadth and creates more reasons to revisit the app
    - No category-mix disclosure by geography or cohort
  - - Beauty shopper via SHEGLAM
    - Buyer=user=payer; beauty-first or fashion-plus-beauty shopper
    - Purchase makeup, tools, and collaboration drops
    - SHEGLAM operates a distinct beauty storefront with clear category depth
    - Extends wallet share into a high-frequency adjacency beyond apparel
    - No public attach-rate between SHEIN and SHEGLAM shoppers
  - - App-first bargain hunter
    - Buyer=user=payer; mobile-led shopper responding to promotions and alerts
    - Discover deals, track flash sales, and shop high-velocity assortment
    - App Store and Google Play emphasize notifications, flash sales, and wide selection; a Harris Poll release for SHEIN says 80% prioritize price, 56% variety, and 72% of SHEIN customers have tight clothing budgets
    - Supports repeat engagement loops without requiring stores
    - MAU, DAU, and conversion funnel are not public
  - - Cross-border global shopper
    - Buyer=user=payer across multiple countries
    - Access low-priced fashion and lifestyle goods through a common global storefront
    - Reuters-sourced coverage says SHEIN sells in more than 150 countries
    - Scale across many markets diversifies demand and makes the app globally legible
    - Current country-level revenue mix and concentration are not disclosed
  - - Returns-sensitive U.S. shopper
    - Buyer=user=payer with high need for easy post-purchase resolution
    - Use BORIS, free returns, and customer support to reduce purchase friction
    - Happy Returns partnership plus free-return claims on official surfaces
    - Can increase confidence to buy from a cross-border value platform
    - Public sources do not quantify adoption, return rates, or cost to serve
  - - Values-conscious collaboration shopper
    - Buyer=user=payer; younger shopper responsive to celebrity drops and social-impact cues
    - Shop creator-led capsules while expecting affordability plus some sustainability or community narrative
    - Vision 2045 says SHEIN wants to bring customers along on a sustainability journey; evoluSHEIN x Anitta launched as the first product collaboration under evoluSHEIN by Design; Football for Change and the Or Foundation extend the message into community and circularity
    - Can widen resonance beyond purely price-led shopping and support brand trust
    - No public data show conversion, retention, or higher spend from values-led campaigns
  notes: Segments are synthesized from public category surfaces, app descriptions, and independent commentary rather than company-disclosed revenue cohorts.
