- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Cross-category catalog breadth from women into men, kids, home, electronics, and general merchandise
    - No public revenue share by category or country
    - Raises basket breadth and return visit reasons without adding stores
    - Request category mix, repeat rate, and gross margin by major category
  - - Beauty adjacency through SHEGLAM
    - No public overlap or attach-rate data between SHEIN and SHEGLAM buyers
    - Can deepen wallet share and increase shopping frequency beyond apparel
    - Request cross-brand customer overlap and repeat-beauty purchase cadence
  - - Promotion-heavy app engagement
    - Promotional loops can create noisy unit economics or low-quality demand
    - Can drive repeat visits quickly, but may pressure trust if pricing feels inconsistent
    - Request cohort gross profit after coupons, return rates, and support tickets
  - - Easy returns and BORIS convenience
    - Return-rate and cost burden remain undisclosed
    - Can reduce purchase hesitation and lift conversion for cross-border buyers
    - Request return-rate by market, BORIS adoption, and net recovery by returned order
  - - Global reach across 150+ countries
    - Public sources do not disclose top-country concentration or active-buyer mix
    - Geographic diversification may offset single-market risk
    - Request GMV and active-buyer concentration by top 10 countries
  - - Marketplace, creator collaborations, and broader brand family
    - No public active-seller, partner-brand, or take-rate data
    - Could create more assortment with limited owned inventory risk while keeping fresh designer-led drops in front of customers
    - Request seller GMV share, brand-partner economics, and customer overlap with core retail
  - - Values-led sustainability and community storytelling
    - Mostly company-authored proof with no disclosed conversion or retention impact
    - Could improve trust and repeat engagement for shoppers who care about celebrity capsules, circularity, or community support
    - Request campaign conversion, repeat rate, NPS, and attach metrics for collaboration- or sustainability-tagged shoppers
  notes: Public evidence supports multiple expansion vectors, but concentration and durability still require private cohort and economics data.
