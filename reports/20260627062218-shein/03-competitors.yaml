- id: durability-risk
  title: 'Moat durability: low switching costs, acute Temu pressure, and rising trust friction'
  body: 'Shein’s moat is real, but it is not classic lock-in. The app-store evidence and reviewed promotional surfaces imply that consumer switching costs are low: a shopper can install multiple apps, compare coupons or haul baskets, and split spend across Temu, Shein, Amazon, Zara, H&M, or resale without meaningful migration cost. That is why Temu is especially dangerous. It attacks the same low-price, cross-category, mobile-first behavior, while Amazon can win on pure convenience and incumbents can win on trust and stores. The durability problem is made worse by regulatory and legal scrutiny. The USCC report places Shein and Temu inside the same de minimis, sourcing, and data-risk frame, while The Fashion Law’s reporting keeps customs, copyright, and forced-labor concerns visible. SHEIN’s own responsible-sourcing, human-rights, and ISO 27001 disclosures show management is trying to narrow the trust gap, but they also confirm that governance spend is now part of the competitive cost base. Those issues do not merely create headline risk; they give more trusted rivals a talking point and increase the chance that policy changes weaken the economics behind the lowest advertised prices. Shein can respond
    with supplier investment, logistics partnerships, and platform tools, but the moat remains more exposed than the download numbers alone imply.'
