- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - public package
  - price/unit/contract model
  - included capabilities
  - discount or unknowns
  - implication
  rows:
  - - SHEIN
    - App-led first-party + growing marketplace
    - Promo-led SKU pricing; first-order discount and flash-sale framing
    - Broad assortment, free shipping/returns messaging, social discovery
    - Exact realized basket economics and marketplace take-rate are not public
    - Optimized for conversion and repeat haul behavior rather than transparent margin
  - - Temu
    - Marketplace app
    - Deal-led marketplace pricing with free shipping and 90-day returns
    - Thousands of products and broad category coverage
    - Seller economics and subsidy intensity are not public
    - Very direct pressure on Shein’s low-price convenience story
  - - Zara
    - Branded apparel retail
    - Per-SKU catalog pricing; no public subscription wrapper
    - Curated collections and app-linked browsing
    - Promotion strategy is less central in reviewed sources
    - Competes on design and trust more than on the cheapest ticket
  - - H&M
    - Value-fashion omnichannel retail
    - Per-SKU catalog pricing with visible markdowns and membership layer
    - Fashion, home, beauty, rewards, and order tracking
    - Realized margin impact of promotions is not visible publicly
    - Balances affordability with service and loyalty mechanics
  - - Amazon Fashion
    - Marketplace deals surface
    - SKU and seller-specific marketplace pricing
    - Breadth, delivery convenience, and marketplace choice
    - Fashion-specific economics are buried inside broader Amazon marketplace terms
    - Wins when consumers prioritize convenience over fashion identity
  - - Cider
    - Promo-led digital-native fashion
    - Discount-code and sale-led SKU pricing
    - Women’s trend fashion and online discovery
    - Scale, repeat economics, and return profile are opaque publicly
    - Closer style rival than true breadth rival
  notes: Visible public pricing signals are promotional and SKU-level; private discounting, supplier subsidies, and true contribution margins are not inferable from the reviewed public pages.
