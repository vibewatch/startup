- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation/diligence ask
  rows:
  - - Shein’s novelty speed is hard to match
    - Temu and other app-native rivals can copy price-led discovery faster than store incumbents can
    - high
    - Track relative traffic, conversion, and repeat-order trends versus Temu by country.
  - - Supplier-network depth is a durable edge
    - Supplier ecosystems need continuous investment and remain exposed to labor and compliance scrutiny
    - high
    - Request supplier concentration, lead-time metrics, and compliance remediation costs.
  - - Broad assortment improves wallet share
    - Marketplace expansion raises quality-control and product-safety complexity
    - medium
    - Review seller take-rate, quality-failure rates, and enforcement processes.
  - - Low prices drive repeat haul behavior
    - Tariffs and de minimis reform can directly attack the economic basis of the offer
    - high
    - Model post-policy price elasticity and gross-margin pass-through scenarios.
  - - App distribution gives Shein strong direct reach
    - Low switching costs make multi-homing easy across Temu, Amazon, Zara, and H&M
    - high
    - Ask for cohort retention and cross-shop behavior after coupon or delivery changes.
  - - Resale and returns tools defend convenience gaps
    - Store-based incumbents still hold stronger trust and physical service expectations
    - medium
    - Compare return-cost curves and customer satisfaction between physical and digital flows.
  notes: The register focuses on the durability questions most likely to change long-run competitive assumptions rather than short-run merchandising battles.
