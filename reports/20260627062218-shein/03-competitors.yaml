tables:
- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - SHEIN
    - Direct ultra-fast-fashion platform
    - Very high app traffic and U.S. fast-fashion share leadership in reviewed sources
    - Value-seeking, trend-led global shoppers
    - Extreme SKU velocity, social distribution, broad non-apparel assortment
    - Low trust moat and weak physical-service footprint
  - - Temu
    - Direct low-price marketplace / haul rival
    - Huge cross-category app surface with free shipping and 90-day returns
    - Bargain-first shoppers across fashion and general merchandise
    - Aggressive price-led discovery and broad marketplace assortment
    - Less fashion-native brand identity and similar policy exposure to Shein
  - - Zara
    - Incumbent omnichannel fashion brand
    - Large global brand with app plus physical-store network
    - Fashion-conscious shoppers who value brand and stores
    - Brand equity, curated design, omnichannel returns and service
    - Much slower item cadence than Shein
  - - H&M
    - Incumbent omnichannel value-fashion chain
    - Global scale with stores, online, and loyalty surfaces
    - Mass-market apparel, family, home, and beauty shoppers
    - Membership, order tracking, stores, and familiar value positioning
    - Lower novelty speed than Shein and less app-native excitement
  - - Amazon Fashion / Deals
    - Adjacent convenience substitute
    - Fashion sold inside one of the largest consumer marketplaces
    - Shoppers optimizing convenience, basket breadth, or delivery confidence
    - Prime-adjacent logistics and multi-category convenience
    - Not a fashion-native discovery destination
  - - Cider
    - Digital-native trend-fashion rival
    - Online-only women’s fashion brand with heavy promotions
    - Style-sensitive younger women
    - Online-native fashion voice and promo-led acquisition
    - Narrower assortment and less obvious scale than Shein or Temu
  - - Resale / secondhand apps
    - Substitute / status quo alternative
    - Growing circular-fashion demand and Shein resale activity
    - Budget- and sustainability-aware shoppers
    - Lower price or sustainability narrative versus buying new
    - Inconsistent assortment and slower trend responsiveness
  - - Mall / off-price fast fashion
    - Status quo offline alternative
    - Persistent local availability despite weaker digital virality
    - Shoppers who want to try on, return quickly, or buy immediately
    - Immediate possession and familiar service norms
    - Limited novelty versus ultra-fast-fashion apps
  notes: This table covers the most material direct, incumbent, adjacent, and substitute alternatives visible in reviewed public evidence, not every regional fast-fashion label.
  enumerationScope:
    coverage: partial
    basis: The table is a targeted map of the main competitor classes a Shein shopper or investor would compare in 2026, rather than an exhaustive census of all apparel retailers.
