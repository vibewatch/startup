chapter:
  number: 3
  title: Competitors
  summary: Shein still benefits from unmatched speed-price-assortment economics, but the moat is narrower than the app-download narrative suggests. Temu is the closest direct pressure point on low-price haul behavior, while Zara and H&M defend with stronger brand and store-service trust, and Amazon plus resale channels broaden the substitute set.
sections:
- id: landscape
  title: 'Landscape: direct ultra-fast rivals, omnichannel incumbents, and broader shopping substitutes'
  body: 'Shein is not competing only with one type of apparel merchant. The direct ultra-fast rival is Temu, which packages low prices, broad category reach, and friction-light shipping and returns inside an app-led marketplace. Zara and H&M matter differently: they are slower and more curated, but they pair fashion credibility with stores, app continuity, and familiar returns or membership mechanics. Amazon Fashion is not a fashion-native peer, yet it is a real substitute whenever the shopper’s job is “cheap, fast, and convenient” rather than “trend discovery from a single fashion app.” Cider is narrower and more women-fashion-centric, which makes it relevant for style-sensitive cohorts without matching Shein’s breadth. Resale and secondhand channels also belong in the competitive set because they absorb value-seeking or sustainability-motivated demand that would otherwise flow to new ultra-fast-fashion purchases. Public market-share and traffic evidence therefore supports a broad competitive
    frame: Shein leads important digital surfaces, but the alternative set is wide and increasingly multi-format.'
  claimRefs:
