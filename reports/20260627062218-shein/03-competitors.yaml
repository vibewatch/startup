- id: substitutes-status-quo
  title: 'Substitutes and status quo: resale, convenience shopping, and incumbent service expectations'
  body: A serious underwriting view also has to account for shoppers who do not choose between Shein and a single named rival. Some consumers solve the same job through Amazon baskets, store-based fast fashion, or secondhand flows depending on whether they prioritize convenience, trust, sustainability, or novelty. Shein’s own resale and returns initiatives show management understands that behavior; the company is trying to internalize substitute demand rather than ignore it. Even so, substitutes matter because they limit pricing power. When novelty matters most, Shein’s scale and cadence remain hard to match. When speed of delivery, easy returns, or brand assurance matters most, Amazon, Zara, and H&M can be more persuasive. When sustainability or circular-fashion framing matters, secondhand takes share. The practical outcome is that Shein’s competitive pressure is strongest in app-native low-price fashion, but the broader substitute set keeps the market structurally contested and makes long-term
    moat durability conditional rather than automatic.
