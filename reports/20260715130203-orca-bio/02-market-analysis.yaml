slug: "orca-bio"
runDate: "2026-07-15"
company:
  name: "Orca Bio"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Orca Bio addresses a narrow, center-concentrated graft-engineering and GVHD-prevention opportunity inside roughly 10,402 annual U.S. allogeneic transplants, not the entire global GVHD-treatment market. Published 2026 treatment-market estimates range from $1.85B to $4.19B, while an evidence-constrained Tregzi sizing model produces a $4.45B theoretical procedure ceiling, a $2.14B–$2.57B disease-focused pool, and a much smaller $107M–$214M illustrative launch scenario."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >
      Orca Bio's commercial market is best defined as precision graft engineering plus chronic-GVHD
      prevention for eligible adults receiving matched-donor, myeloablative allogeneic hematopoietic
      stem-cell transplantation for hematologic malignancies. It is not the full stem-cell-transplant
      procedure market and it is not synonymous with the downstream GVHD-drug market. Included spend
      is the one-time Tregzi graft product, priced at a wholesale acquisition cost of $428,000, and
      the center workflow required to collect donor cells, manufacture the fresh product and infuse
      its three components. Conventional transplant facility, conditioning, donor-search and routine
      inpatient costs are adjacent rather than Tregzi revenue. Likewise, Jakafi, Rezurock and Niktimvo
      treat established or refractory chronic GVHD and therefore sit downstream of Tregzi's prevention
      proposition. The most important status-quo substitutes are an unmanipulated graft with
      tacrolimus/methotrexate and increasingly post-transplant cyclophosphamide-based prophylaxis.
      CMS coverage of allogeneic transplantation supports the underlying procedure, but does not by
      itself establish product-specific reimbursement for Tregzi.
    claimRefs: ["CM001", "CM004", "CM005", "CM006", "CM007", "CM008", "CM009"]
    tableRefs: ["TM001"]
  - id: "market-sizing"
    title: "TAM, SAM and SOM through multiple lenses"
    body: >
      Market sizing requires separate lenses because published reports measure different populations,
      therapies and geographies. HRSA activity data indicate 6,646 unrelated-donor and 3,756
      related-donor allogeneic transplants in the United States in 2024, or 10,402 in total. Multiplying
      that entire procedure pool by the exact $428,000 Tregzi WAC gives a $4.45B theoretical annual
      revenue ceiling, but this is deliberately not labeled an addressable forecast: pediatric,
      nonmalignant, mismatched, reduced-intensity and clinically unsuitable cases fall outside the
      approved use. A disease-focused 5,000–6,000 annual AML/MDS-heavy pool gives a more constrained
      $2.14B–$2.57B product-value range before eligibility and penetration discounts. An illustrative
      launch scenario of 250–500 annual starts across the planned center network equals $107M–$214M;
      patient throughput is an explicit assumption, not guidance. For context only, 2026 global GVHD
      treatment estimates cluster around $1.85B–$4.19B, while one $23.07B estimate is a scope outlier.
    claimRefs: ["CM002", "CM003", "CM011", "CM012", "CM013", "CM014", "CM015", "CM016", "CM017", "CM018", "CM019", "CM020", "CM021"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001", "FM002"]
  - id: "buyers-users-payers"
    title: "Buyer, user and payer segmentation"
    body: >
      The economic customer is a transplant center or its sponsoring hospital system, while the
      clinical users are transplant physicians, cell-processing teams, pharmacists, coordinators and
      inpatient nursing staff. The patient is the beneficiary but rarely the budget owner. The
      purchase path begins with physician identification of an eligible adult and an 8/8 HLA-matched
      donor, proceeds through multidisciplinary case review and payer authorization, and then requires
      center onboarding, donor collection, manufacturing-slot reservation and timed infusion.
      Hospital finance, pharmacy-and-therapeutics or value-analysis functions are likely internal
      budget gatekeepers; commercial insurers, Medicare and Medicaid ultimately bear much of the
      covered episode cost. This inference should be tested center by center because buy-and-bill,
      bundled transplant reimbursement, carve-outs and contractual risk allocation are not publicly
      specified. NMDP's directory confirms that center selection is concentrated and measurable, and
      the roughly 25-center year-end target makes account-level sequencing more important than broad
      community-oncology promotion.
    claimRefs: ["CM010", "CM024", "CM025", "CM026", "CM027", "CM028", "CM029", "CM030"]
    tableRefs: ["TM003"]
    figureRefs: ["FM003"]
  - id: "drivers-and-constraints"
    title: "Growth drivers, constraints and adoption timing"
    body: >
      Demand is supported by a durable base of more than ten thousand annual U.S. allogeneic
      transplants, broader donor availability and the major clinical burden of chronic GVHD.
      Tregzi's randomized evidence—78.0% one-year chronic-GVHD-free survival versus 38.4% for control
      and 12.6% versus 44.0% moderate-to-severe chronic GVHD—creates a clinically legible adoption
      trigger and a plausible downstream cost-offset narrative. Analyst reports also forecast
      faster growth for cell and gene therapy modalities than for the overall GVHD market. Adoption
      is nevertheless constrained by a formidable low-cost incumbent: post-transplant
      cyclophosphamide-based prophylaxis has randomized evidence and is already changing practice.
      Tregzi also requires a fully matched donor, myeloablative preparation, center qualification and
      fresh-product delivery within roughly 72 hours. The $428,000 upfront price is material relative
      to a recent $331,827 median transplant-period cost estimate, so payer authorization, separate
      reimbursement and proof of durable avoided complications can govern timing even when clinicians
      accept the efficacy evidence.
    claimRefs: ["CM022", "CM023", "CM031", "CM032", "CM033", "CM034", "CM035", "CM036", "CM037", "CM038"]
    tableRefs: ["TM004"]
    figureRefs: ["FM004"]
  - id: "contradictions-and-diligence-gaps"
    title: "Contradictory estimates and diligence gaps"
    body: >
      The largest analytical risk is false precision. Published market reports disagree not just on
      forecasts but on what constitutes the market: Coherent Market Insights reports $1.85B in 2026,
      Future Market Insights $3.2B, Mordor $3.32B, Emergen $4.19B for chronic GVHD in 2025, and Market
      Research Future $23.07B in 2025. These estimates cannot be averaged responsibly without full
      definitions, geography and product-level revenue inputs. The U.S. allogeneic procedure count is
      a stronger denominator, but public tables do not isolate all approval criteria—adult age,
      malignancy, matched donor and myeloablative conditioning—in one current cut. There is also no
      public Tregzi-specific payer policy, net price, center throughput commitment or approved-center
      roster. The launch scenario is therefore a sensitivity analysis rather than a forecast. Priority
      diligence is to obtain payer policies and denial rates, center contracts and onboarding dates,
      eligible-case counts at the initial sites, manufacturing-slot capacity, and an independently
      reconciled U.S. patient funnel from referral through infusion.
    claimRefs: ["CM018", "CM039", "CM040", "CM041", "CM042"]
