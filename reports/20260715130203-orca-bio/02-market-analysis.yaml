    claimRefs: ["CM002", "CM020", "CM021", "CM040", "CM041"]
callouts:
  - calloutType: "insight"
    title: "The procedure denominator is more defensible than analyst TAM"
    body: "HRSA's 10,402 annual U.S. allogeneic procedures provides an auditable starting point, while GVHD reports vary more than twelvefold because their definitions differ."
    claimRefs: ["CM002", "CM018", "CM039"]
  - calloutType: "risk"
    title: "PTCy is the pivotal adoption comparator"
    body: "Post-transplant cyclophosphamide combines randomized efficacy, changing practice patterns and comparatively low cost, so Tregzi must win on durable outcomes and total episode economics rather than efficacy versus tacrolimus/methotrexate alone."
    claimRefs: ["CM007", "CM032", "CM034"]
  - calloutType: "assumption"
    title: "Launch revenue is a scenario, not guidance"
    body: "The $107M–$214M illustrative launch range assumes 250–500 starts at exact WAC; neither center throughput nor net price is publicly disclosed."
    claimRefs: ["CM009", "CM010", "CM021", "CM040"]
