      - ["$428,000 upfront WAC", "Constraint", "Immediate", "High authorization and budget-impact hurdle", "Obtain net price, denial and time-to-authorization data"]
      - ["Matched donor and myeloablative label", "Constraint", "Current", "Narrows procedure denominator", "Extract eligible cases from CIBMTR by all criteria"]
