      - ["Tacrolimus/methotrexate prophylaxis", "Low-cost medicines and monitoring", "Tregzi manufacturing", "Hospital pharmacy; payer", "Pivotal-trial control and status quo"]
      - ["Post-transplant cyclophosphamide prophylaxis", "Generic regimen and supportive care", "Precision graft processing", "Hospital pharmacy; payer", "High-evidence, lower-cost substitute"]
      - ["Chronic-GVHD treatment drugs", "Jakafi, Rezurock, Niktimvo and related treatment", "Prophylaxis before disease develops", "Specialty/hospital pharmacy; payer", "Adjacent downstream spend, not direct TAM"]
      - ["Global GVHD treatment reports", "Drug and treatment revenue under each publisher's scope", "Tregzi-specific U.S. eligible revenue", "Analyst-defined", "Context only; boundaries are inconsistent"]
    notes: "Boundary is based on FDA indication, HRSA transplant reporting, clinical prophylaxis evidence and labeled downstream drugs; list prices are not net realized revenue."
    claimRefs: ["CM001", "CM005", "CM006", "CM007", "CM008", "CM009"]
