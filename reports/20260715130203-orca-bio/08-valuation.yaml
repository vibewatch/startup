  claims:
    - { id: "CV001", statement: "FDA approval and randomized Phase 3 evidence support a clinically de-risked core product thesis for Tregzi.", type: "inferred", topic: "thesis", sourceRefs: ["SV006", "SV009", "SV028"], confidence: "high", freshness: "current", answersQuestionRefs: ["QV001"] }
    - { id: "CV002", statement: "One-year chronic-GVHD-free survival was 78.0% with Tregzi versus 38.4% with control.", type: "observed", topic: "clinical-proof", sourceRefs: ["SV006", "SV009"], confidence: "high", freshness: "current", answersQuestionRefs: ["QV001"] }
    - { id: "CV003", statement: "One-year overall survival was 93.9% versus 83.1% with P=.12 and was not statistically significant.", type: "observed", topic: "clinical-risk", sourceRefs: ["SV006", "SV007", "SV029"], confidence: "high", freshness: "current", answersQuestionRefs: ["QV002", "QV011"] }
    - { id: "CV004", statement: "Tregzi's wholesale acquisition cost is $428,000 per one-time therapy.", type: "third-party-reported", topic: "pricing-input", sourceRefs: ["SV005", "SV029"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV001"] }
    - { id: "CV005", statement: "Orca's 2020 Form D reports $191,999,870 sold as Series D preferred stock with common stock issuable upon conversion.", type: "observed", topic: "historical-financing", sourceRefs: ["SV001", "SV002"], confidence: "high", freshness: "historical", answersQuestionRefs: ["QV008"] }
    - { id: "CV006", statement: "Orca disclosed $250M of new equity across its two most recent rounds plus up to $100M of additional liquidity under an amended SVB facility.", type: "company-claimed", topic: "recent-financing", sourceRefs: ["SV004", "SV027"], confidence: "high", freshness: "current", answersQuestionRefs: ["QV007"] }
    - { id: "CV007", statement: "The reported January 2026 private mark is $1.2B and implies approximately 1.91x value to $625M of capital raised.", type: "third-party-reported", topic: "entry-mark-analysis", sourceRefs: ["SV003", "SV004"], confidence: "medium", freshness: "recent", answersQuestionRefs: ["QV003", "QV006"] }
    - { id: "CV008", statement: "Public sources do not establish whether the $1.2B mark is a primary post-money price, a secondary indication or a blended estimate.", type: "observed", topic: "valuation-gap", sourceRefs: ["SV003", "SV004", "SV027"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV009"] }
    - { id: "CV009", statement: "Public financing disclosures do not reveal liquidation preferences, participation, anti-dilution rights or the fully diluted ownership waterfall.", type: "observed", topic: "preference-gap", sourceRefs: ["SV001", "SV002", "SV004", "SV027"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV010"] }
    - { id: "CV010", statement: "At the reported mark, strong clinical proof is offset by insufficient commercial and capitalization evidence for an immediate buy recommendation.", type: "inferred", topic: "recommendation", sourceRefs: ["SV003", "SV005", "SV009", "SV013"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV003", "QV004"] }
    - { id: "CV011", statement: "A 5,500-patient annual midpoint is an estimated scenario denominator within the 5,000–6,000 matched-donor AML and MDS opportunity used in prior market work.", type: "estimated", topic: "scenario-denominator", sourceRefs: ["SV009", "SV010"], confidence: "low", freshness: "current", answersQuestionRefs: ["QV012"] }
    - { id: "CV012", statement: "No reviewed public source disclosed recognized commercial Tregzi revenue by July 15, 2026.", type: "observed", topic: "commercial-proof", sourceRefs: ["SV005", "SV028", "SV029"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV002", "QV004"] }
    - { id: "CV013", statement: "The year-end 2026 target of approximately 25 treatment centers is an access milestone rather than proof of patient throughput.", type: "inferred", topic: "commercial-scale", sourceRefs: ["SV005", "SV029"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV013"] }
    - { id: "CV014", statement: "The bull case supports a $4.0B–$7.0B range only with high penetration, scalable margins, pipeline expansion and a strategic premium.", type: "estimated", topic: "bull-case", sourceRefs: ["SV004", "SV015", "SV017", "SV023"], confidence: "low", freshness: "current", answersQuestionRefs: ["QV013", "QV014"] }
    - { id: "CV015", statement: "The base case supports a $1.8B–$3.0B range with moderate penetration, broader center access and acceptable commercial yield.", type: "estimated", topic: "base-case", sourceRefs: ["SV005", "SV011", "SV023"], confidence: "low", freshness: "current", answersQuestionRefs: ["QV013", "QV015"] }
    - { id: "CV016", statement: "The bear case supports a $0.3B–$0.8B range under slow adoption, reimbursement friction, quality problems or forced financing.", type: "estimated", topic: "bear-case", sourceRefs: ["SV007", "SV008", "SV013", "SV014"], confidence: "low", freshness: "current", answersQuestionRefs: ["QV013", "QV016"] }
    - { id: "CV017", statement: "At a 5,500-patient denominator and $428,000 WAC, penetration from 5% to 35% implies gross bookings from about $118M to $824M before deductions.", type: "estimated", topic: "penetration-sensitivity", sourceRefs: ["SV004", "SV005", "SV010"], confidence: "low", freshness: "current", answersQuestionRefs: ["QV012"] }
    - { id: "CV018", statement: "Legend Biotech had an indicated July 2026 market capitalization of approximately $4.52B.", type: "third-party-reported", topic: "legend-comparable", sourceRefs: ["SV011", "SV012"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV017", "QV018"] }
    - { id: "CV019", statement: "CARVYKTI generated approximately $597M of first-quarter 2026 net trade sales and Legend reported improving operating performance.", type: "company-claimed", topic: "legend-comparable", sourceRefs: ["SV011", "SV012"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV018"] }
    - { id: "CV020", statement: "Gamida Cell's approved transplant therapy did not prevent a lender-led take-private involving $75M of debt conversion and $30M of new capital.", type: "third-party-reported", topic: "gamida-distress", sourceRefs: ["SV013", "SV014"], confidence: "high", freshness: "historical", answersQuestionRefs: ["QV002", "QV021", "QV022"] }
    - { id: "CV021", statement: "CRISPR Therapeutics was valued at $5.19B in Statista's January 2026 snapshot and about $4.98B in July 2026 market data.", type: "third-party-reported", topic: "crispr-comparable", sourceRefs: ["SV018", "SV023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV017", "QV019"] }
    - { id: "CV022", statement: "Beam Therapeutics was valued at $3.35B in Statista's January 2026 snapshot and about $3.14B in July 2026 market data.", type: "third-party-reported", topic: "beam-comparable", sourceRefs: ["SV019", "SV023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV017", "QV019"] }
    - { id: "CV023", statement: "uniQure was valued at $1.35B in Statista's January 2026 snapshot and about $2.77B in July 2026 market data.", type: "third-party-reported", topic: "uniqure-comparable", sourceRefs: ["SV020", "SV023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV017", "QV019"] }
    - { id: "CV024", statement: "Intellia was valued at $1.32B in Statista's January 2026 snapshot and about $1.84B in July 2026 market data.", type: "third-party-reported", topic: "intellia-comparable", sourceRefs: ["SV021", "SV023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV017", "QV019"] }
    - { id: "CV025", statement: "Gilead agreed to acquire pre-launch Kite Pharma for approximately $11.9B at a 29% one-day premium.", type: "third-party-reported", topic: "kite-acquisition", sourceRefs: ["SV015", "SV016", "SV017"], confidence: "high", freshness: "historical", answersQuestionRefs: ["QV017", "QV020"] }
    - { id: "CV026", statement: "The Kite transaction was priced for category leadership, platform breadth and strategic scarcity rather than as a direct Orca revenue multiple.", type: "inferred", topic: "kite-acquisition", sourceRefs: ["SV015", "SV016", "SV017"], confidence: "medium", freshness: "historical", answersQuestionRefs: ["QV020", "QV023"] }
    - { id: "CV027", statement: "Public gene and cell therapy valuations span widely and can move materially between milestone snapshots.", type: "inferred", topic: "comparable-normalization", sourceRefs: ["SV018", "SV019", "SV020", "SV021", "SV023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV019", "QV023"] }
    - { id: "CV028", statement: "Broader cell and gene therapy market forecasts support category growth but do not establish Orca's attainable share or price.", type: "inferred", topic: "market-context", sourceRefs: ["SV024", "SV025", "SV026"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV001", "QV023"] }
    - { id: "CV029", statement: "High COGS, complex treatment, small populations and selective capital markets can compress cell-therapy valuations despite regulatory success.", type: "third-party-reported", topic: "sector-risk", sourceRefs: ["SV013", "SV014", "SV026"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV002", "QV022"] }
    - { id: "CV030", statement: "The approved Tregzi label is narrower than a broad blood-cancer platform and pipeline expansion remains investigational.", type: "inferred", topic: "label-concentration", sourceRefs: ["SV004", "SV009", "SV028"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV002"] }
    - { id: "CV031", statement: "Audited financials, repeatable commercial cohorts, margin evidence and governance disclosures are prerequisites for a credible IPO process.", type: "inferred", topic: "ipo-readiness", sourceRefs: ["SV003", "SV005", "SV012", "SV026"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QV024"] }
