company:
  name: "Orca Bio"
chapter:
  number: 8
  title: "Valuation"
  summary: "Recommendation: track / conditional hold at the reported $1.2B private mark, with medium confidence, high risk and a stretched valuation stance. Approval and unusually strong chronic-GVHD-free survival create credible upside, but pre-revenue launch execution, undisclosed preferences and burn, a non-significant overall-survival comparison, and distressed cell-therapy precedents make price discipline essential."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment thesis, anti-thesis and recommendation"
    body: >
      The investment thesis is that an approved, first-in-class regulatory T-cell product can turn a
      clinically important reduction in chronic graft-versus-host disease into a defensible transplant-
      center franchise. PRECISION-T reported one-year chronic-GVHD-free survival of 78.0% versus 38.4%,
      the product has a $428,000 WAC, and a concentrated specialist channel makes commercial progress
      observable through center activation, infusions and collections. The anti-thesis is equally
      consequential: launch began without disclosed revenue, the initial label is narrow, post-transplant
      cyclophosphamide is an inexpensive alternative, commercial manufacturing is unproven, and overall
      survival of 93.9% versus 83.1% was not statistically significant at P=.12. Gamida Cell shows that
      approval alone does not protect an allogeneic transplant product from liquidity distress. At the
      reported $1.2B mark, the recommendation is therefore track / conditional hold rather than buy.
      Confidence is medium, risk is high and valuation is stretched until repeatable launch economics
      appear. A new investment should seek at least 3.0x gross value over five to seven years and avoid
      paying above $0.9B without verified net price, volume, gross margin and runway.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV010", "CV012", "CV020", "CV029", "CV034", "CV035", "CV047"]
    tableRefs: ["TV001", "TV002"]
    figureRefs: ["FV001", "FV004"]
  - id: "financing-entry-and-capital-structure"
    title: "Financing context, entry discipline and overhang"
    body: >
      The $1.2B January 2026 private-company mark is an analytical entry input, not a verified clearing
      price. The same secondary source reports $625M raised and a 1.91x valuation-to-capital ratio, while
      the company and its legal adviser confirm $250M of equity across the two most recent rounds and up
      to $100M under an amended SVB facility. The SEC filing independently establishes that the 2020
      Series D sold $191,999,870 of preferred stock and conversion-linked common stock. Public evidence
      does not disclose Series F post-money mechanics, primary versus secondary proceeds, fully diluted
      ownership, liquidation preferences, participation, anti-dilution, option-pool refreshes, debt draw
      or cash. Six rounds make preference and dilution overhang plausible, but their amount must not be
      invented. Entry discipline should therefore be document-driven: at $1.2B, require clean seniority,
      at least 24 months of downside liquidity, and commercial proof; otherwise seek a structured or
      lower entry. The financing is enough to attempt launch, but public data cannot prove that the
      quoted price is supported after preference-adjusted dilution.
    claimRefs: ["CV005", "CV006", "CV007", "CV008", "CV009", "CV036", "CV037", "CV041", "CV044"]
    tableRefs: ["TV006"]
  - id: "scenario-valuation"
    title: "Bull, base and bear valuation cases"
    body: >
      Scenario valuation uses a commercial-stage revenue-multiple framework because Orca has an approved
      product but no disclosed recurring earnings or cash flow. The demand denominator is a 5,500-patient
      midpoint within the prior market work's 5,000–6,000 annual U.S. AML and MDS matched-donor
      allo-HSCT opportunity. At $428,000 WAC, 5%, 10%, 15%, 25% and 35% penetration imply gross-bookings
      sensitivities of approximately $118M, $235M, $353M, $589M and $824M before gross-to-net deductions.
      The bear case values Orca at $0.3B–$0.8B if uptake stalls, reimbursement or manufacturing fails and
      financing becomes punitive. The base case is $1.8B–$3.0B if the center network expands beyond the
      roughly 25 targeted for year-end 2026 and Tregzi reaches moderate penetration with acceptable
      yield. The bull case is $4.0B–$7.0B if penetration is high, margins prove scalable, Orca-Q or label
      expansion succeeds and a strategic buyer pays a platform premium. These are underwriting ranges,
      not company guidance; probability weights remain provisional until private launch cohorts are
      available.
    claimRefs: ["CV011", "CV013", "CV014", "CV015", "CV016", "CV017", "CV046"]
    tableRefs: ["TV003"]
    figureRefs: ["FV002", "FV003"]
  - id: "comparable-set-and-exit-readiness"
    title: "Comparable evidence and exit readiness"
    body: >
      Public comparables bound outcomes rather than produce a precise multiple. Legend Biotech is the
      strongest commercial-stage reference: its July 2026 market capitalization is roughly $4.5B and
      CARVYKTI generated $597M of first-quarter 2026 net trade sales, showing how validated cell-therapy
      revenue can support a multi-billion-dollar value. Gene-editing peers span about $1.3B to $5.2B in
      Statista's January 2026 snapshot, demonstrating that pipeline quality and milestones can dominate
      current revenue. The adverse endpoint is Gamida Cell, whose approved transplant product did not
      prevent a lender-led take-private, $75M debt conversion and $30M rescue financing. Gilead's $11.9B
      acquisition of pre-launch Kite is a strategic ceiling, not a base multiple; it reflected category
      leadership, pipeline and manufacturing scarcity in a different capital market. Orca is not IPO-
      ready on public evidence because audited financials, commercial cohorts, margins and governance
      terms are unavailable. A strategic sale becomes credible after launch repeatability and pipeline
      de-risking; an IPO should follow several quarters of auditable revenue and site-level operating
      performance.
    claimRefs: ["CV018", "CV019", "CV020", "CV021", "CV022", "CV023", "CV024", "CV025", "CV026", "CV027", "CV028", "CV031", "CV032", "CV033", "CV048"]
    tableRefs: ["TV004"]
  - id: "diligence-and-thesis-breaks"
    title: "Final diligence asks and thesis-break triggers"
    body: >
      The final decision should be conditioned on evidence that directly converts product promise into
      equity value. First, reconcile the Series F term sheet, fully diluted cap table, all preferred
      rights and the SVB agreement into proceeds available to a new investor. Second, trace every
      commercial patient from referral through authorization, released lot, infusion, invoice and cash
      collection, including realized net price and center-level productivity. Third, audit commercial
      first-pass yield, deviations, per-lot COGS, logistics cost and site absorption at Sacramento and
      Princeton. Fourth, rebuild runway under base and downside launch cases and separate committed cash
      from undrawn debt. Thesis breaks are a material FDA manufacturing action or patient-identity event;
      persistent first-pass yield below 90%; two consecutive quarters materially behind board adoption
      and net-price plan; less than twelve months of downside runway without committed financing; or an
      insider financing below the current preference-adjusted entry. Passing these gates would move the
      call toward buy; failure should move it to avoid rather than justify averaging down.
    claimRefs: ["CV038", "CV039", "CV040", "CV041", "CV042", "CV043", "CV044", "CV045", "CV047"]
    tableRefs: ["TV005"]
