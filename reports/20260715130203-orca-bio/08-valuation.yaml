callouts:
  - calloutType: "recommendation"
    title: "Track, do not chase the reported mark"
    body: "The approved product merits continued diligence, but a new investment at $1.2B should wait for commercial cohorts and preference-adjusted capitalization evidence or demand a lower/structured entry."
    claimRefs: ["CV007", "CV008", "CV010", "CV035", "CV047"]
  - calloutType: "risk"
    title: "Approval is not liquidity protection"
    body: "Gamida Cell's lender-led take-private after product approval is a direct warning that weak uptake and insufficient runway can overwhelm regulatory success."
    claimRefs: ["CV020", "CV029"]
  - calloutType: "strength"
    title: "Clinical proof is unusually strong"
    body: "The randomized pivotal trial more than doubled one-year chronic-GVHD-free survival, supporting a real efficacy-led adoption case despite the unproven survival advantage."
    claimRefs: ["CV001", "CV002", "CV003"]
