evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current total employee headcount for Orca Bio
    whyItMatters: >-
      Headcount is a core scale metric and cost driver ahead of commercial launch, but is undisclosed for a private
      company.
    diligencePath: Request headcount in a data room, or triangulate via LinkedIn and state hiring/facility filings.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: latest valuation
    missingEvidence: Primary-source confirmation of the ~$1.2B valuation and its primary-versus-secondary composition
    whyItMatters: >-
      The valuation drives the investment thesis but comes only from secondary-market aggregators, not audited or
      company disclosure.
    diligencePath: Obtain the Series F term sheet, post-money valuation and cap table directly from the company or lead investor.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology completeness
    missingEvidence: >-
      Interim private milestones (undisclosed rounds, secondaries, internal operational events) not captured in the
      public milestone table
    whyItMatters: >-
      The milestone table relies on public announcements and may omit private events material to trajectory and
      cap-table dynamics.
    diligencePath: Reconcile the public chronology against company board minutes and financing documents in a data room.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: debt
    missingEvidence: Drawn amount, covenants and maturity of the Silicon Valley Bank credit facility
    whyItMatters: Debt terms affect runway and downside risk but only the up-to-$100M facility size is disclosed.
    diligencePath: Review the loan and security agreement and any UCC filings for SVB.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A current U.S. count satisfying adult age, hematologic malignancy, 8/8 matched donor and myeloablative
      conditioning simultaneously
    whyItMatters: >-
      Without the intersected label-eligible denominator, the disease-focused SAM remains a broad WAC-based sensitivity
      rather than an addressable forecast.
    diligencePath: >-
      Commission a CIBMTR custom cut by age, diagnosis, donor match and conditioning intensity for calendar years
      2024–2026.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: som
    missingEvidence: >-
      Signed center roster, activated dates, eligible case volume, manufacturing slots and expected Tregzi starts per
      site
    whyItMatters: >-
      The illustrative launch scenario depends on throughput assumptions that cannot be validated from the public
      year-end center target.
    diligencePath: Review center contracts, launch dashboards, order backlog and manufacturing capacity plans in the data room.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: center-count-gap
    missingEvidence: >-
      Definitive count and roster of active U.S. centers performing at least one allogeneic transplant in the latest
      year
    whyItMatters: >-
      The denominator determines rollout coverage, concentration and the remaining account opportunity beyond the
      planned network.
    diligencePath: Download and reconcile the HRSA center table with NMDP and CIBMTR center-level activity.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: reimbursement-gap
    missingEvidence: >-
      Tregzi-specific medical policies, coding, separate-payment treatment, net price, authorization time and denial
      rates
    whyItMatters: Upfront WAC and uncertain risk allocation can delay adoption even when the underlying transplant is covered.
    diligencePath: >-
      Obtain top-payer policy confirmations and de-identified authorization and remittance data from initial treatment
      centers.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: conflicting-data
    severity: material
    topic: estimate-conflict
    missingEvidence: Comparable publisher definitions and product-level inputs explaining the $1.85B–$23.07B estimate range
    whyItMatters: Using incompatible top-down estimates would materially overstate or understate the valuation-relevant market.
    diligencePath: >-
      Acquire full methodologies, normalize geography and included therapies, and reconcile against reported product
      sales and patient counts.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: Current exact Omisirge WAC, net price, discounts and center contract terms
    whyItMatters: >-
      Without a verified graft-product benchmark, Tregzi's relative premium and payer budget impact cannot be compared
      cleanly.
    diligencePath: >-
      Obtain the current Omisirge price compendium entry, manufacturer contract template and de-identified center
      invoices.
    relatedQuestionRefs:
      - QP014
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: downstream-pricing
    missingEvidence: Current net prices, average duration and rebate terms for Jakafi, Rezurock and Niktimvo in chronic GVHD
    whyItMatters: >-
      Avoided downstream treatment cost is central to Tregzi's premium value proposition but list prices alone would not
      establish realized savings.
    diligencePath: >-
      Request payer claims analyses and manufacturer contracting benchmarks normalized by treatment duration and line of
      therapy.
    relatedQuestionRefs:
      - QP015
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparator-gap
    missingEvidence: Randomized or well-adjusted Tregzi versus PTCy outcomes and total episode cost
    whyItMatters: PTCy is the most credible low-cost substitute, while Precision-T directly compared Tregzi with Tac/MTX.
    diligencePath: Commission an adjusted registry comparison and seek a prospective head-to-head or pragmatic PTCy comparator study.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
