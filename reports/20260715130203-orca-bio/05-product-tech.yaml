      statement: "One Tregzi course is supplied as four patient-specific bags containing HSPCs, Tregs, Tcons and Tcon diluent, with three cellular components administered sequentially."
      type: "third-party-reported"
      topic: "product-components"
      sourceRefs: ["SE004", "SE006", "SE007"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE002"]
    - id: "CE003"
      statement: "The label specifies at least 1.0×10^6 viable HSPCs/kg, 1.3–3.5×10^6 viable Tregs/kg and 1.3–6.9×10^6 viable Tcons/kg."
      type: "third-party-reported"
      topic: "dosing"
      sourceRefs: ["SE004", "SE006", "SE007"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE004"]
    - id: "CE004"
      statement: "HSPCs and Tregs are administered on day 0, Tcons on day +2 to +3, and no leukodepleting filter may be used."
      type: "third-party-reported"
      topic: "administration"
      sourceRefs: ["SE004", "SE007"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE024"]
    - id: "CE005"
      statement: "Precision-T used Tregzi with single-agent tacrolimus versus an unmanipulated allograft with tacrolimus plus methotrexate."
      type: "third-party-reported"
      topic: "prophylaxis"
      sourceRefs: ["SE006", "SE009", "SE010"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE005"]
