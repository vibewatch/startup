callouts:
  - calloutType: "strength"
    title: "Clinical mechanism and operating mechanism are aligned"
    body: "Tregzi's three cellular populations each have a distinct job, and the label preserves those jobs through separate bags, weight-based doses and timed administration."
    claimRefs: ["CE002", "CE003", "CE006", "CE007", "CE008"]
  - calloutType: "risk"
    title: "The process is part of every dose"
    body: "A matched donor, successful separation, release, temperature-controlled transport, patient identity and center execution must all succeed inside a narrow timeline; clinical repetition does not yet reveal commercial yield."
    claimRefs: ["CE010", "CE012", "CE025", "CE028", "CE033"]
  - calloutType: "insight"
    title: "Approved efficacy does not prove an overall-survival advantage"
    body: "Precision-T established chronic-GVHD-free survival benefit, but the one-year overall-survival difference of 93.9% versus 83.1% was not statistically significant at P=.12."
    claimRefs: ["CE014", "CE016"]
