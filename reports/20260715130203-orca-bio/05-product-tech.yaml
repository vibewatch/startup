        - { from: "w3", to: "w4" }
        - { from: "w4", to: "w5" }
        - { from: "w5", to: "w6" }
        - { from: "w6", to: "w7" }
    approximationNotes: "Flow condenses the prescribing-information sequence and does not replace institutional transplant protocols."
