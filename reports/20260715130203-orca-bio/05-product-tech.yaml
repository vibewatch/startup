      topic: "mechanism"
      sourceRefs: ["SE001", "SE007", "SE009"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE003"]
    - id: "CE008"
      statement: "Delayed Tcon add-back is intended to accelerate immune reconstitution while retaining graft-versus-leukemia activity."
