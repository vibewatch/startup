      topic: "mechanism"
      sourceRefs: ["SE001", "SE007", "SE009"]
      confidence: "high"
      freshness: "current"
      answersQuestionRefs: ["QE003"]
    - id: "CE007"
      statement: "High-purity donor Tregs are intended to restrain conventional T-cell alloreactivity and reduce GVHD."
