artifact: "customers"
slug: "orca-bio"
runDate: "2026-07-15"
company:
  name: "Orca Bio"
chapter:
  number: 6
  title: "Customers"
  summary: "Tregzi's customer is a qualified academic or specialty transplant center, its users are BMT clinicians and cell-therapy teams, and payment must clear commercial-insurer or Medicare hospital workflows. Commercial proof is exceptionally early: Moffitt explicitly says Tregzi is available, while the broader named-center record is primarily Precision-T trial participation; Orca is launching at a handful of centers and targets ~25 by year-end 2026."
sections:
  - id: "customer-segments-and-buying-system"
    title: "Customer segments and the four-party buying system"
    body: >
      Tregzi is not bought like an office-administered drug. The account-level customer is an academic
      or specialty hospital with an allogeneic hematopoietic-cell-transplant program, the clinical
      user is the transplant physician and multidisciplinary BMT or cellular-therapy team, and the
      ultimate beneficiary is an eligible adult with AML, ALL, MDS or MPAL. Payment is a fourth role:
      commercial insurers and Medicare reimburse hospitals through authorization, contracting, coding
      and inpatient or outpatient payment processes. That separation matters because physician
      enthusiasm alone cannot activate an account. A center must coordinate donor search, conditioning,
      product ordering, receipt and sequential administration while its financial team secures coverage
      for a $428,000 one-time product. The relevant vertical is therefore the concentrated U.S. transplant
      ecosystem rather than general oncology. Large referral centers offer the greatest near-term case
      volume, but they also possess bargaining and protocol-selection power. The direct channel runs
      from Orca's centralized manufacturing and access teams to qualified hospital programs; patients
      and community oncologists feed the referral channel but do not place product orders.
    claimRefs: ["CU001", "CU002", "CU003", "CU004", "CU005", "CU006", "CU007", "CU017", "CU038"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-trajectory-and-deployment"
    title: "Adoption trajectory: strong clinical repetition, minimal commercial history"
    body: >
      Adoption evidence divides sharply between clinical repetition and commercial deployment. Orca
      reports more than 500 patient-specific products made across clinical programs, showing repeated
      national donor-to-patient operations, but those products are not commercial orders and cannot be
      treated as active customer accounts. The pivotal Precision-T program involved 19 U.S. treatment
      centers and 187 randomized participants, creating an experienced launch seed set. Commercially,
      however, approval occurred only on June 30, 2026. Independent launch coverage says Orca began with
      a “handful” of treatment centers, expected first orders in the following weeks, and planned an
      onboarding and production ramp to ~25 centers by year-end 2026. The disclosed trajectory therefore
      supports readiness, not realized utilization. No public source reviewed disclosed activated-center
      count, paid orders, treated commercial patients, manufacturing-slot utilization, orders per site
      or payer approval rates as of July 15. The appropriate funnel labels those stages unknown rather
      than converting the clinical cohort into customers. Early concentration is structurally high while
      a small initial network absorbs training, reimbursement and logistics.
    claimRefs: ["CU012", "CU013", "CU014", "CU015", "CU016", "CU019", "CU020"]
    tableRefs: ["TU002"]
    figureRefs: ["FU002"]
  - id: "named-customer-proof"
    title: "Named proof: one explicit availability reference and a broader trial-site bench"
    body: >
      Named-center evidence is strongest at Moffitt Cancer Center. Its July 2026 clinical perspective
      states that Tregzi is available at Moffitt, invites early consultation and confirms that Moffitt
      served as a Phase 3 site; this is current, center-authored commercial availability evidence, though
      it does not disclose a paid order or treated commercial patient. City of Hope, Stanford Health Care
      and Memorial Sloan Kettering appear in the current Precision-T registry and each independently
      describes a substantial transplant program. Orca's approval release also quotes MSK's adult BMT
      chief on provider use at scale. Those references establish institutional capability and clinical
      familiarity, not production deployment. The registry lists 19 trial sites, but the commercial
      launch roster is not public, so it would be incorrect to label every investigator site a customer.
      Reference quality is high for trial participation and Moffitt availability, medium for commercial
      intent, and absent for site-level orders, payer clearances, outcomes after launch or repeat cases.
      The named table is intentionally a sample rather than a complete customer census.
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU012", "CU039"]
    tableRefs: ["TU003"]
    figureRefs: ["FU003"]
  - id: "retention-and-clinical-durability"
    title: "Retention is clinical durability, not subscription renewal"
    body: >
      Classic SaaS retention measures do not map cleanly to Tregzi because each patient receives a
      one-time, curative-intent transplant course. NRR, GRR, logo churn and annual renewal are therefore
      either not applicable at patient level or undisclosed at center level. The closest evidence-backed
      durability proxy is sustained clinical benefit in Precision-T. At one year, chronic-GVHD-free
      survival was 78.0% with Tregzi versus 38.4% with control, and moderate-to-severe chronic GVHD was
      12.6% versus 44.0%. The article also reports day-28 neutrophil engraftment, day-50 platelet
      engraftment and six-month severe acute-GVHD outcomes, allowing a time-bucketed clinical cohort
      view without implying customer renewal. Overall survival was 93.9% versus 83.1%, but the difference
      was not statistically significant at P=.12. These trial outcomes support product durability and
      physician confidence; they do not prove hospital satisfaction, repeat ordering, account retention
      or net revenue expansion. Commercial cohorts must ultimately track eligible cases, orders, payer
      approvals, cancellations, infusions and follow-up outcomes by activated center.
    claimRefs: ["CU021", "CU022", "CU023", "CU024", "CU025", "CU026", "CU027", "CU028", "CU029", "CU030", "CU031"]
    tableRefs: ["TU004"]
    figureRefs: ["FU004"]
  - id: "expansion-concentration-and-procurement"
    title: "Expansion, concentration and procurement friction"
    body: >
      The initial land-and-expand motion is center activation followed by additional eligible cases
      within the same BMT program, not seat expansion or a recurring license. Experienced Precision-T
      sites can shorten clinical education, while Moffitt's referral invitation illustrates how a
      qualified center can draw regional patients. Expansion beyond the initial handful depends on
      training, donor and manufacturing-slot coordination, payer authorization and reliable delivery.
      Orca says reimbursement pathways exist across commercial and government programs, but ASTCT's
      dedicated HCT coverage and billing resources show that benefit screening, contracting,
      authorization, coding and billing remain real operational work. Concentration risk is material:
      early volume can sit in a few high-throughput academic programs, no top-center revenue shares are
      disclosed, and account choice competes with familiar transplant protocols. Supply geography adds
      another dependency because initial production is concentrated in Sacramento; the Princeton site
      is intended to shorten Eastern transit and add future capacity. The ~25-center year-end target
      broadens reach but is still a target, not evidence of diversified paid demand. Diligence should
      require center-by-center funnel, throughput, payer and cancellation data.
    claimRefs: ["CU003", "CU015", "CU032", "CU033", "CU034", "CU035", "CU036", "CU037", "CU038", "CU040"]
    tableRefs: ["TU005"]
