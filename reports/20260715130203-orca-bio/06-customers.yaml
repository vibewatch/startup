  claims:
    - { id: "CU001", statement: "The account-level customer for Tregzi is a hospital or specialist center operating an allogeneic hematopoietic-cell-transplant program.", type: "inferred", topic: "buyer", sourceRefs: ["SU010", "SU011", "SU016"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU001", "QU005"] }
    - { id: "CU002", statement: "Transplant physicians, BMT program leaders, cell-therapy laboratory staff, pharmacists and nurses are the principal clinical and operational users.", type: "inferred", topic: "users", sourceRefs: ["SU003", "SU012", "SU022", "SU024"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU002"] }
    - { id: "CU003", statement: "Orca reports reimbursement pathways across commercial and government programs, while HCT providers still navigate benefit screening, contracting, authorization, coding and billing.", type: "third-party-reported", topic: "payer", sourceRefs: ["SU012", "SU013", "SU017", "SU020"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU003", "QU021"] }
    - { id: "CU004", statement: "The beneficiary segment is eligible adults with AML, ALL, MDS or MPAL undergoing matched-donor transplant after myeloablative preparation.", type: "third-party-reported", topic: "beneficiary", sourceRefs: ["SU001", "SU016", "SU025"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU004"] }
    - { id: "CU005", statement: "HRSA and NMDP directories show that the relevant U.S. customer base is a geographically distributed but specialist transplant-center network.", type: "observed", topic: "geography", sourceRefs: ["SU010", "SU011"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU005"] }
    - { id: "CU006", statement: "Orca's direct commercial channel terminates at qualified transplant centers, while community oncologists and patients enter through center referral pathways.", type: "inferred", topic: "channel", sourceRefs: ["SU003", "SU010", "SU017"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU006"] }
    - { id: "CU007", statement: "The customer use case is ordering and administering a patient-specific Tregzi course within a matched-donor allogeneic transplant episode.", type: "third-party-reported", topic: "use-case", sourceRefs: ["SU015", "SU016", "SU025"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU001", "QU004"] }
    - { id: "CU008", statement: "Moffitt states that Tregzi is available at its center, offers early consultation and confirms its participation as a Phase 3 site.", type: "third-party-reported", topic: "named-proof", sourceRefs: ["SU001", "SU003"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU010", "QU012"] }
    - { id: "CU009", statement: "City of Hope is listed as a Precision-T site and independently operates a blood stem-cell and bone-marrow transplant program.", type: "observed", topic: "named-proof", sourceRefs: ["SU001", "SU004"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU011", "QU012"] }
    - { id: "CU010", statement: "Stanford Health Care is listed as a Precision-T site and independently operates a bone-marrow-transplant and cellular-therapy program.", type: "observed", topic: "named-proof", sourceRefs: ["SU001", "SU005"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU011", "QU012"] }
    - { id: "CU011", statement: "Memorial Sloan Kettering is a Precision-T site with a current transplant program, and Orca's approval release quotes its adult BMT chief endorsing provider access at scale.", type: "third-party-reported", topic: "named-proof", sourceRefs: ["SU001", "SU007", "SU014"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU011", "QU012"] }
    - { id: "CU012", statement: "Orca reports that 19 U.S. treatment centers participated in Precision-T, which randomized 187 adults.", type: "company-claimed", topic: "clinical-adoption", sourceRefs: ["SU001", "SU014", "SU015"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU023"] }
    - { id: "CU013", statement: "Orca reports producing more than 500 patient-specific products across clinical programs.", type: "company-claimed", topic: "clinical-usage", sourceRefs: ["SU017", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU007"] }
    - { id: "CU014", statement: "Orca launched Tregzi at a handful of treatment centers immediately after approval.", type: "company-claimed", topic: "launch-footprint", sourceRefs: ["SU017", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU008", "QU025"] }
    - { id: "CU015", statement: "Orca targets approximately 25 treatment centers by year-end 2026.", type: "company-claimed", topic: "center-target", sourceRefs: ["SU017", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU009", "QU018", "QU025"] }
    - { id: "CU016", statement: "MedCity reported that Orca expected its first Tregzi orders in the weeks following approval, underscoring the launch's early stage.", type: "third-party-reported", topic: "commercial-adoption", sourceRefs: ["SU018", "SU019"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU008"] }
    - { id: "CU017", statement: "Tregzi's wholesale acquisition cost is $428,000 per one-time therapy.", type: "third-party-reported", topic: "price", sourceRefs: ["SU017", "SU018", "SU020"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU027"] }
    - { id: "CU018", statement: "Public reimbursement statements establish intended access pathways but do not disclose payer policies, approvals, denials or realized net payment.", type: "observed", topic: "payer-gap", sourceRefs: ["SU012", "SU017", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU003", "QU021"] }
    - { id: "CU019", statement: "A launch limited to a handful of centers creates genuine early adoption and account-concentration risk despite the ~25-center target.", type: "inferred", topic: "adoption-risk", sourceRefs: ["SU011", "SU017", "SU020", "SU023"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU019", "QU025"] }
    - { id: "CU020", statement: "No reviewed public source disclosed activated centers, paid orders, commercial infusions, orders per center or manufacturing-slot utilization as of July 15, 2026.", type: "observed", topic: "usage-gap", sourceRefs: ["SU017", "SU018", "SU019", "SU020"], confidence: "medium", freshness: "current" }
    - { id: "CU021", statement: "A Tregzi patient receives a one-time course, so patient-level subscription renewal and churn are not applicable.", type: "inferred", topic: "retention-definition", sourceRefs: ["SU016", "SU017", "SU018"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU022", statement: "Precision-T reported one-year chronic-GVHD-free survival of 78.0% with Tregzi versus 38.4% with control.", type: "third-party-reported", topic: "durability", sourceRefs: ["SU015", "SU016", "SU025"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016", "QU024"] }
    - { id: "CU023", statement: "Precision-T reported 12-month moderate-to-severe chronic GVHD of 12.6% with Tregzi versus 44.0% with control.", type: "third-party-reported", topic: "durability", sourceRefs: ["SU015", "SU016", "SU026"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016", "QU024"] }
    - { id: "CU024", statement: "At six months, freedom from grade 3–4 acute GVHD was 93.8% with Tregzi and 83.5% with control, calculated as 100% minus the reported incidences.", type: "estimated", topic: "durability", sourceRefs: ["SU015", "SU016"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU025", statement: "By day 28, neutrophil engraftment was 100.0% with Tregzi versus 96.7% with control in the as-treated analysis.", type: "third-party-reported", topic: "durability", sourceRefs: ["SU015", "SU016"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU026", statement: "By day 50, platelet engraftment was 98.9% with Tregzi versus 92.5% with control.", type: "third-party-reported", topic: "durability", sourceRefs: ["SU015", "SU025"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU027", statement: "One-year overall survival was 93.9% with Tregzi versus 83.1% with control, but the difference was not statistically significant at P=.12.", type: "third-party-reported", topic: "durability-limitation", sourceRefs: ["SU015", "SU017", "SU026"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU024"] }
    - { id: "CU028", statement: "One-year GVHD-free and relapse-free survival was 63.1% with Tregzi versus 30.9% with control.", type: "third-party-reported", topic: "durability", sourceRefs: ["SU015", "SU016"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU029", statement: "Center-level NRR, GRR, churn and repeat-case cohorts are not publicly disclosed.", type: "observed", topic: "retention-gap", sourceRefs: ["SU017", "SU018", "SU020"], confidence: "medium", freshness: "current" }
    - { id: "CU030", statement: "No reviewed public evidence provides a commercial-center satisfaction score, renewal reference or post-launch outcome cohort.", type: "observed", topic: "satisfaction-gap", sourceRefs: ["SU003", "SU017", "SU018"], confidence: "medium", freshness: "current" }
    - { id: "CU031", statement: "Clinical durability is the most defensible retention proxy for a one-time therapy, but it cannot substitute for center-account retention or repeat utilization.", type: "inferred", topic: "retention-proxy", sourceRefs: ["SU015", "SU016", "SU018"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU016"] }
    - { id: "CU032", statement: "Center activation requires clinical selection, payer clearance, donor coordination, manufacturing scheduling, receipt and administration rather than a simple formulary listing.", type: "inferred", topic: "procurement-friction", sourceRefs: ["SU003", "SU012", "SU015", "SU017"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU018", "QU021"] }
    - { id: "CU033", statement: "Initial commercial production is concentrated at Orca's Sacramento facility, creating a customer-reach dependency on timed national logistics.", type: "third-party-reported", topic: "geographic-concentration", sourceRefs: ["SU017", "SU018", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU020"] }
    - { id: "CU034", statement: "The Princeton manufacturing bridge is intended to reduce East Coast transit and add future capacity, but commercial line validation and throughput are not disclosed.", type: "third-party-reported", topic: "geographic-expansion", sourceRefs: ["SU017", "SU018", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU018", "QU020"] }
    - { id: "CU035", statement: "Early demand can remain concentrated in a small number of high-throughput academic centers even if Orca reaches its ~25-center target.", type: "inferred", topic: "center-concentration", sourceRefs: ["SU010", "SU011", "SU015", "SU017"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU019"] }
    - { id: "CU036", statement: "Large transplant centers control patient referral, protocol selection and the operational ability to administer Tregzi, giving them material channel power.", type: "inferred", topic: "channel-power", sourceRefs: ["SU003", "SU004", "SU005", "SU007"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU006", "QU019"] }
    - { id: "CU037", statement: "Orca has not disclosed top-center, top-five-center or payer revenue concentration.", type: "observed", topic: "concentration-gap", sourceRefs: ["SU017", "SU018", "SU020"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU019"] }
    - { id: "CU038", statement: "ASTCT's HCT billing resources identify insurance screening, contracting, authorization, registration and billing as distinct procurement steps.", type: "third-party-reported", topic: "procurement", sourceRefs: ["SU012", "SU013"], confidence: "high", freshness: "current", answersQuestionRefs: ["QU021"] }
    - { id: "CU039", statement: "Precision-T trial-site status establishes clinical experience but does not by itself establish a signed commercial account or paid Tregzi order.", type: "inferred", topic: "proof-quality", sourceRefs: ["SU001", "SU003", "SU014", "SU017"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU011", "QU026"] }
    - { id: "CU040", statement: "Moffitt's early-consultation referral model illustrates a center-level expansion loop from regional referral to successive eligible cases.", type: "inferred", topic: "land-and-expand", sourceRefs: ["SU003", "SU010"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QU018"] }
