        - { id: "a2", label: "Handful of initial launch centers" }
        - { id: "a3", label: "~25-center YE2026 onboarding target" }
        - { id: "a4", label: "Paid commercial orders: not disclosed" }
        - { id: "a5", label: "Commercial infusions: not disclosed" }
        - { id: "a6", label: "Repeat cases per center: not disclosed" }
      edges:
        - { from: "a1", to: "a2" }
        - { from: "a2", to: "a3" }
        - { from: "a2", to: "a4" }
        - { from: "a4", to: "a5" }
        - { from: "a5", to: "a6" }
    approximationNotes: "The stages are not numerically monotonic because the only public account values are a trial-site count and a forward center target; unknown stages remain explicit."
    claimRefs: ["CU012", "CU014", "CU015", "CU016", "CU019", "CU020"]
  - id: "FU003"
    title: "Customer proof matrix"
    type: "matrix"
    layout: "wide"
    summary: "Named proof is graded by trial participation, current availability, independent center capability and commercial-outcome visibility."
    data:
      columns: ["Registry trial site", "Center-authored capability", "Current Tregzi availability", "Paid order disclosed", "Site outcome disclosed"]
      rows:
        - { label: "Moffitt Cancer Center", values: ["Yes", "Yes", "Yes", "No", "No"] }
        - { label: "City of Hope", values: ["Yes", "Yes", "Not disclosed", "No", "No"] }
        - { label: "Stanford Health Care", values: ["Yes", "Yes", "Not disclosed", "No", "No"] }
        - { label: "Memorial Sloan Kettering", values: ["Yes", "Yes", "KOL launch endorsement", "No", "No"] }
    approximationNotes: "Yes/No/Not disclosed classify reviewed public evidence as of 2026-07-15; trial participation is not treated as commercial deployment."
    claimRefs: ["CU008", "CU009", "CU010", "CU011", "CU020", "CU039"]
  - id: "FU004"
    title: "Retention / repeat cohort"
    type: "cohort"
    layout: "wide"
    summary: "A composite clinical-durability cohort tracks source-backed milestones after a one-time transplant course."
    data:
      columns: ["Day 28", "Day 50", "Month 6", "Month 12"]
      rows:
        - { label: "Tregzi cohort", values: [100.0, 98.9, 93.8, 78.0] }
        - { label: "Control cohort", values: [96.7, 92.5, 83.5, 38.4] }
    approximationNotes: "This is a clinical durability proxy, not customer retention: one-time therapy means retention is sustained clinical benefit rather than renewal. Day 28 is neutrophil engraftment, day 50 is platelet engraftment, month 6 is freedom from grade 3–4 acute GVHD (100 minus reported incidence), and month 12 is cGFS; values are not one continuous endpoint."
    claimRefs: ["CU022", "CU024", "CU025", "CU026", "CU031"]
callouts:
  - calloutType: "strength"
    title: "Moffitt provides the clearest commercial-center proof"
    body: "Moffitt explicitly states that Tregzi is available and invites early consultation, moving its evidence beyond a trial-site logo while stopping short of a disclosed paid order."
    claimRefs: ["CU008"]
  - calloutType: "risk"
    title: "The commercial denominator is still nearly empty"
    body: "A handful of launch centers and a ~25-center target do not disclose activated accounts, paid orders, commercial infusions, repeat cases or payer approval performance."
    claimRefs: ["CU014", "CU015", "CU019", "CU020"]
  - calloutType: "insight"
    title: "Durability and retention must remain separate"
    body: "Precision-T supports sustained clinical benefit at one year, but no public evidence yet supports center-level NRR, GRR, satisfaction or renewal economics."
    claimRefs: ["CU022", "CU029", "CU030", "CU031"]
