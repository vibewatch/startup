    data:
      nodes:
        - { id: "j1", label: "Community oncologist refers eligible adult to specialist BMT center" }
        - { id: "j2", label: "Transplant physician confirms disease, donor and conditioning eligibility" }
        - { id: "j3", label: "Center finance team screens benefits, contracts and authorization" }
        - { id: "j4", label: "BMT team coordinates donor collection and manufacturing slot" }
        - { id: "j5", label: "Center receives, verifies and administers patient-specific components" }
        - { id: "j6", label: "Clinical team follows engraftment, GVHD, survival and safety" }
        - { id: "j7", label: "Successful workflow enables another eligible case at the center" }
    approximationNotes: "Stages synthesize label, center and ASTCT reimbursement workflows; they do not imply that every payer or center follows identical steps."
    claimRefs: ["CU002", "CU003", "CU004", "CU006", "CU032", "CU038", "CU040"]
