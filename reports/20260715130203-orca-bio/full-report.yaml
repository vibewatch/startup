      - number: '6.4'
        title: Retention is clinical durability, not subscription renewal
        blocks:
          - type: paragraph
            body: >
              Classic SaaS retention measures do not map cleanly to Tregzi because each patient receives a one-time,
              curative-intent transplant course. NRR, GRR, logo churn and annual renewal are therefore either not
              applicable at patient level or undisclosed at center level. The closest evidence-backed durability proxy
              is sustained clinical benefit in Precision-T. At one year, chronic-GVHD-free survival was 78.0% with
              Tregzi versus 38.4% with control, and moderate-to-severe chronic GVHD was 12.6% versus 44.0%. The article
              also reports day-28 neutrophil engraftment, day-50 platelet engraftment and six-month severe acute-GVHD
              outcomes, allowing a time-bucketed clinical cohort view without implying customer renewal. Overall
              survival was 93.9% versus 83.1%, but the difference was not statistically significant at P=.12. These
              trial outcomes support product durability and physician confidence; they do not prove hospital
              satisfaction, repeat ordering, account retention or net revenue expansion. Commercial cohorts must
              ultimately track eligible cases, orders, payer approvals, cancellations, infusions and follow-up outcomes
              by activated center.
