      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >
              Orca Bio was launched in 2016 by three co-founders who met at Stanford University: Ivan Dimov, Nate
              Fernhoff and Jeroen Bekaert. The company's scientific foundation draws on Stanford transplantation
              research associated with the Irving Weissman laboratory and investigators including Robert Negrin and
              Judith Shizuru. In a material leadership change, co-founder and former Chief Scientific Officer Nate
              Fernhoff was appointed Chief Executive Officer, succeeding founding CEO Ivan Dimov, while co-founder and
              former Chief Operating Officer Jeroen Bekaert became President. The executive bench is deep and
              commercialization- oriented: Scott McClellan (Chief Medical Officer) leads clinical development, Mike
              Hirschmann (Chief Commercial Officer, ex-Legend Biotech CAR-T launch) leads commercial, Josh Murray
              (ex-Goldman Sachs) leads finance and investor relations, and functional heads cover legal, engineering,
              quality and people. Board and advisor influence is concentrated among lead investors and scientific
              pioneers, including Jonathan MacQuitty of Lightspeed Venture Partners and Alex Kolicich of 8VC. Key-person
              dependence on the scientific founders and on the Stanford-licensed platform is a notable governance
              consideration for a company that has just transitioned its CEO on the eve of its first commercial launch.
