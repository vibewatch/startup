      - number: '5.2'
        title: Approved asset, pipeline extensions and clinical maturity
        blocks:
          - type: paragraph
            body: >
              The portfolio is tiered by regulatory maturity and donor or conditioning breadth. Tregzi is the commercial
              anchor: the FDA-approved label covers adults with hematologic malignancies receiving an 8/8 matched
              related or unrelated donor graft after myeloablative preparation. The pivotal randomized study enrolled
              187 adults, 93 assigned to Tregzi and 94 to control. One-year chronic-GVHD-free survival was 78.0% versus
              38.4% with a hazard ratio of 0.26, while moderate-to-severe chronic GVHD was 12.6% versus 44.0%.
              Non-relapse mortality was 3.4% versus 13.2%. The one-year overall-survival comparison, 93.9% versus 83.1%,
              was not statistically significant at P=.12 and should not be promoted as proven survival benefit. Orca-Q
              is a recruiting Phase 1 program intended to reach mismatched and haploidentical donor settings. SERENE-T
              is a recruiting Phase 2 study of Orca-T after reduced-intensity or nonmyeloablative conditioning, and
              OrCAR remains an earlier combination-platform direction. Those programs are roadmap options, not approved
              capabilities.
