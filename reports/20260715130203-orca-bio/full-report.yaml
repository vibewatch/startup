      - number: '8.3'
        title: Bull, base and bear valuation cases
        blocks:
          - type: paragraph
            body: >
              Scenario valuation uses a commercial-stage revenue-multiple framework because Orca has an approved product
              but no disclosed recurring earnings or cash flow. The demand denominator is a 5,500-patient midpoint
              within the prior market work's 5,000–6,000 annual U.S. AML and MDS matched-donor allo-HSCT opportunity. At
              $428,000 WAC, 5%, 10%, 15%, 25% and 35% penetration imply gross-bookings sensitivities of approximately
              $118M, $235M, $353M, $589M and $824M before gross-to-net deductions. The bear case values Orca at
              $0.3B–$0.8B if uptake stalls, reimbursement or manufacturing fails and financing becomes punitive. The
              base case is $1.8B–$3.0B if the center network expands beyond the roughly 25 targeted for year-end 2026
              and Tregzi reaches moderate penetration with acceptable yield. The bull case is $4.0B–$7.0B if penetration
              is high, margins prove scalable, Orca-Q or label expansion succeeds and a strategic buyer pays a platform
              premium. These are underwriting ranges, not company guidance; probability weights remain provisional until
              private launch cohorts are available.
