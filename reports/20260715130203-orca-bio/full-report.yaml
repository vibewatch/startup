      - number: '1.3'
        title: Funding history and capitalization
        blocks:
          - type: paragraph
            body: >
              Orca Bio has raised approximately $625 million in equity since its 2016 launch, complemented by debt
              capacity. The company emerged from stealth in June 2020 with a $192 million Series D co-led by Lightspeed
              Venture Partners, bringing cumulative capital to nearly $300 million at that time, with participation from
              8VC, DCVC Bio, ND Capital, Mubadala Investment Company, Kaiser Foundation Hospitals, Kaiser Permanente
              Group Trust and IMRF. In December 2025 it completed a Series F led by Lightspeed; together with its prior
              round the company announced $250 million in new equity capital, plus up to $100 million of additional
              liquidity from a 2025 amendment to its Silicon Valley Bank credit facility. Secondary-market and private-
              company data providers place Orca Bio's valuation at roughly $1.2 billion as of January 2026, giving it
              unicorn status and an implied capital-efficiency ratio of about 1.9x total funding. Because Orca Bio is
              private and does not publish audited financials, exact round-by-round valuations, the
              primary-versus-secondary composition of the $1.2B mark, current cash balance, and burn rate are not
              publicly disclosed and must be treated as estimates.
