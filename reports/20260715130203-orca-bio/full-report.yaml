      - number: '5.4'
        title: Differentiation combines composition, process, evidence and regulatory status
        blocks:
          - type: paragraph
            body: >
              The moat is a stacked system rather than any isolated cell type. First, the approved composition
              deliberately separates HSPCs, Tregs and Tcons instead of accepting the variable mixture in an
              unmanipulated graft. Second, the operating know-how must reproduce high-purity populations,
              patient-specific dose ranges and a narrow release-to-infusion window at clinical scale. Third, randomized
              evidence and the first FDA approval for this Treg-engineered transplant package raise the proof burden for
              followers. Fourth, an Orca-assigned patent family, including a 2024 U.S. grant, describes hematopoietic
              transplant compositions enriched for defined immune-cell populations and depleted of naïve conventional
              alpha-beta T cells. Patents do not establish freedom to operate or block every competing prophylaxis, but
              they corroborate that composition design is an owned R&D direction. The moat’s weakness is also clear:
              current approval requires a matched donor and myeloablative conditioning, while Orca-Q and SERENE-T remain
              investigational. Process complexity can deter entrants while simultaneously limiting throughput and
              geography if donor coordination, sorting, release testing or transport fails.
            claimRefs:
