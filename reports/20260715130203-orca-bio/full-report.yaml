  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and the four-party buying system
        blocks:
          - type: paragraph
            body: >
              Tregzi is not bought like an office-administered drug. The account-level customer is an academic or
              specialty hospital with an allogeneic hematopoietic-cell-transplant program, the clinical user is the
              transplant physician and multidisciplinary BMT or cellular-therapy team, and the ultimate beneficiary is
              an eligible adult with AML, ALL, MDS or MPAL. Payment is a fourth role: commercial insurers and Medicare
              reimburse hospitals through authorization, contracting, coding and inpatient or outpatient payment
              processes. That separation matters because physician enthusiasm alone cannot activate an account. A center
              must coordinate donor search, conditioning, product ordering, receipt and sequential administration while
              its financial team secures coverage for a $428,000 one-time product. The relevant vertical is therefore
              the concentrated U.S. transplant ecosystem rather than general oncology. Large referral centers offer the
              greatest near-term case volume, but they also possess bargaining and protocol-selection power. The direct
              channel runs from Orca's centralized manufacturing and access teams to qualified hospital programs;
              patients and community oncologists feed the referral channel but do not place product orders.
            claimRefs:
              - CU001
