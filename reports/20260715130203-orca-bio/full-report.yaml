      - number: '7.4'
        title: Financial and model downside
        blocks:
          - type: paragraph
            body: >
              The financial model carries single-product launch concentration and substantial fixed-cost absorption
              risk. The $428,000 wholesale acquisition cost is a ceiling before discounts, denials, center economics and
              collection timing; it is not evidence of realized net revenue. Orca announced $250M of new equity across
              its two most recent rounds and an SVB facility of up to $100M, but neither disclosure provides current
              cash, debt drawn, monthly burn, working capital, covenant headroom or commercial gross margin.
              Personalized manufacturing, two-site validation, quality testing and time-critical logistics can compress
              margin if throughput or first-pass yield misses plan. Clinical value is meaningful on chronic-GVHD-free
              survival, but one-year overall survival was 93.9% versus 83.1% with P=.12 and was not statistically
              significant. That does not negate the approved endpoint; it does limit a survival-premium argument to
              payers and physicians. Residual exposure is high until net-price, authorization, released-lot cost,
              collections and center-productivity cohorts are visible.
            claimRefs:
              - CR020
              - CR021
