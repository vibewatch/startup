  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis and recommendation
        blocks:
          - type: paragraph
            body: >
              The investment thesis is that an approved, first-in-class regulatory T-cell product can turn a clinically
              important reduction in chronic graft-versus-host disease into a defensible transplant- center franchise.
              PRECISION-T reported one-year chronic-GVHD-free survival of 78.0% versus 38.4%, the product has a $428,000
              WAC, and a concentrated specialist channel makes commercial progress observable through center activation,
              infusions and collections. The anti-thesis is equally consequential: launch began without disclosed
              revenue, the initial label is narrow, post-transplant cyclophosphamide is an inexpensive alternative,
              commercial manufacturing is unproven, and overall survival of 93.9% versus 83.1% was not statistically
              significant at P=.12. Gamida Cell shows that approval alone does not protect an allogeneic transplant
              product from liquidity distress. At the reported $1.2B mark, the recommendation is therefore track /
              conditional hold rather than buy. Confidence is medium, risk is high and valuation is stretched until
              repeatable launch economics appear. A new investment should seek at least 3.0x gross value over five to
              seven years and avoid paying above $0.9B without verified net price, volume, gross margin and runway.
            claimRefs:
