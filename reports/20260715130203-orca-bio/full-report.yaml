      - number: '7.2'
        title: Manufacturing, quality and logistics failure modes
        blocks:
          - type: paragraph
            body: >
              Commercial execution depends on a tightly coupled donor-to-patient chain. Precision-T showed that Orca
              could manufacture and infuse trial product within 72 hours of donor apheresis, but trial repetition does
              not establish commercial first-pass yield, deviation rates or recall readiness. The label's
              patient-specific identifiers and expiry times make chain of identity, custody and scheduling
              safety-critical. Sacramento can meet stated near-term needs, while Princeton was described as a
              clinical-program bridge expected to support commercial production only after line validation. That reduces
              but does not yet eliminate geographic concentration. Independent logistics sources identify route
              disruption, temperature excursions, labeling errors and narrow stability windows as general cell-therapy
              hazards. FACT standards and FDA deviation reporting reinforce the need for validated collection,
              processing, transport, release and corrective-action systems. Mitigation maturity is medium for
              Sacramento, early for Princeton and undisclosed for disaster recovery. A commercial batch rejection or
              multi-day outage would simultaneously lose revenue, consume capacity and impose clinical rescheduling.
            claimRefs:
