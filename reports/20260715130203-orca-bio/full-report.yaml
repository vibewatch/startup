      - number: '8.4'
        title: Comparable evidence and exit readiness
        blocks:
          - type: paragraph
            body: >
              Public comparables bound outcomes rather than produce a precise multiple. Legend Biotech is the strongest
              commercial-stage reference: its July 2026 market capitalization is roughly $4.5B and CARVYKTI generated
              $597M of first-quarter 2026 net trade sales, showing how validated cell-therapy revenue can support a
              multi-billion-dollar value. Gene-editing peers span about $1.3B to $5.2B in Statista's January 2026
              snapshot, demonstrating that pipeline quality and milestones can dominate current revenue. The adverse
              endpoint is Gamida Cell, whose approved transplant product did not prevent a lender-led take-private, $75M
              debt conversion and $30M rescue financing. Gilead's $11.9B acquisition of pre-launch Kite is a strategic
              ceiling, not a base multiple; it reflected category leadership, pipeline and manufacturing scarcity in a
              different capital market. Orca is not IPO- ready on public evidence because audited financials, commercial
              cohorts, margins and governance terms are unavailable. A strategic sale becomes credible after launch
              repeatability and pipeline de-risking; an IPO should follow several quarters of auditable revenue and
              site-level operating performance.
