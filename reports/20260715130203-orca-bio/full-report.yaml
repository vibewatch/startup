      - number: '6.5'
        title: Expansion, concentration and procurement friction
        blocks:
          - type: paragraph
            body: >
              The initial land-and-expand motion is center activation followed by additional eligible cases within the
              same BMT program, not seat expansion or a recurring license. Experienced Precision-T sites can shorten
              clinical education, while Moffitt's referral invitation illustrates how a qualified center can draw
              regional patients. Expansion beyond the initial handful depends on training, donor and manufacturing-slot
              coordination, payer authorization and reliable delivery. Orca says reimbursement pathways exist across
              commercial and government programs, but ASTCT's dedicated HCT coverage and billing resources show that
              benefit screening, contracting, authorization, coding and billing remain real operational work.
              Concentration risk is material: early volume can sit in a few high-throughput academic programs, no
              top-center revenue shares are disclosed, and account choice competes with familiar transplant protocols.
              Supply geography adds another dependency because initial production is concentrated in Sacramento; the
              Princeton site is intended to shorten Eastern transit and add future capacity. The ~25-center year-end
              target broadens reach but is still a target, not evidence of diversified paid demand. Diligence should
              require center-by-center funnel, throughput, payer and cancellation data.
