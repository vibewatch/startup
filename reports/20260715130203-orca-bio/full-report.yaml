  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a coordinated transplant workflow, not a single infusion
        blocks:
          - type: paragraph
            body: >
              Tregzi, the approved name for Orca-T, replaces an unmanipulated matched-donor graft with a defined,
              patient-specific sequence of cellular components. After an eligible adult receives myeloablative
              conditioning, the transplant center administers HSPCs and high-purity regulatory T cells on day 0, then
              thawed conventional T cells on day +2 or +3; single-agent tacrolimus begins after the Tcon infusion. HSPCs
              rebuild blood and immune lineages, Tregs restrain donor alloreactivity that causes GVHD, and Tcons
              accelerate immune recovery while preserving graft-versus-leukemia activity. The product therefore changes
              the customer job from “receive and infuse a donor graft” to “schedule, identify, receive, verify and
              administer a four-bag, weight-dosed course.” The label requires patient-identity checks, a central venous
              route and no leukodepleting filter. In Precision-T, this architecture was tested against an unmanipulated
              graft plus tacrolimus/methotrexate, so the value proposition is fewer chronic-GVHD events with less
              pharmacologic immunosuppression—not a claim that transplantation becomes risk-free.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
