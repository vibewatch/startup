      - number: '2.5'
        title: Contradictory estimates and diligence gaps
        blocks:
          - type: paragraph
            body: >
              The largest analytical risk is false precision. Published market reports disagree not just on forecasts
              but on what constitutes the market: Coherent Market Insights reports $1.85B in 2026, Future Market
              Insights $3.2B, Mordor $3.32B, Emergen $4.19B for chronic GVHD in 2025, and Market Research Future $23.07B
              in 2025. These estimates cannot be averaged responsibly without full definitions, geography and
              product-level revenue inputs. The U.S. allogeneic procedure count is a stronger denominator, but public
              tables do not isolate all approval criteria—adult age, malignancy, matched donor and myeloablative
              conditioning—in one current cut. There is also no public Tregzi-specific payer policy, net price, center
              throughput commitment or approved-center roster. The launch scenario is therefore a sensitivity analysis
              rather than a forecast. Priority diligence is to obtain payer policies and denial rates, center contracts
              and onboarding dates, eligible-case counts at the initial sites, manufacturing-slot capacity, and an
              independently reconciled U.S. patient funnel from referral through infusion.
            claimRefs:
              - CM018
              - CM039
              - CM040
              - CM041
              - CM042
