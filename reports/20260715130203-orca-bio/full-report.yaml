        title: Moat durability, displacement paths and adverse evidence
        blocks:
          - type: paragraph
            body: >
              Orca’s strongest moat is the combined regulatory, clinical and process package: the first approved
              Treg-engineered graft, a randomized trial with 78.0% versus 38.4% one-year chronic-GVHD-free survival, and
              accumulated manufacturing know-how for a three-component personalized product. That moat is meaningful but
              not absolute. The pivotal control was tacrolimus/methotrexate, not PTCy, so the commercial argument lacks
              a randomized head-to-head answer against the regimen most likely to displace the old standard. The label
              also requires a matched donor and myeloablative preparation; Orca-Q remains recruiting in Phase 1 and
              cannot yet neutralize that boundary. Process complexity can defend against entrants while simultaneously
              constraining Orca: approval followed an FDA request for additional manufacturing data, and the fresh
              product must arrive on a tight timetable. Commoditization risk comes from protocol innovation that narrows
              the outcome gap without bespoke manufacturing. Entrant risk is more likely to arrive through acquisition
              or partnership than a greenfield launch, as the Jasper strategic review and Vor pivot illustrate. Priority
              diligence is therefore PTCy-comparative outcomes, activated-center throughput, manufacturing success, net
