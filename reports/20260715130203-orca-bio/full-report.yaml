      - number: '7.5'
        title: People, execution, safety and security
        blocks:
          - type: paragraph
            body: >
              Orca must build its first commercial organization while scaling manufacturing and transferring leadership
              to co-founder Nate Fernhoff. The chief commercial officer has cell-therapy launch experience and
              Sacramento operations staffing expanded materially, but the public record does not show commercial span of
              control, succession plans, critical-role attrition, quality-unit independence or Princeton training
              completion. Founder and Stanford-science dependence adds continuity risk around platform know-how.
              Workplace and environmental controls also matter: OSHA treats occupational exposure to blood and other
              potentially infectious material as a regulated hazard, and EPA notes that medical waste can contain blood
              or body fluids and is primarily governed by state environmental and health departments. Digitized
              manufacturing and patient-chain workflows add cyber and privacy exposure; KPMG identifies data integrity,
              availability and third-party connectivity as life-sciences concerns. No public Orca-specific audit, breach
              history or recovery test was found, so mitigation maturity is unverified rather than assumed strong.
