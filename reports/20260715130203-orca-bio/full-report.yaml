  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >
              Orca Bio's commercial market is best defined as precision graft engineering plus chronic-GVHD prevention
              for eligible adults receiving matched-donor, myeloablative allogeneic hematopoietic stem-cell
              transplantation for hematologic malignancies. It is not the full stem-cell-transplant procedure market and
              it is not synonymous with the downstream GVHD-drug market. Included spend is the one-time Tregzi graft
              product, priced at a wholesale acquisition cost of $428,000, and the center workflow required to collect
              donor cells, manufacture the fresh product and infuse its three components. Conventional transplant
              facility, conditioning, donor-search and routine inpatient costs are adjacent rather than Tregzi revenue.
              Likewise, Jakafi, Rezurock and Niktimvo treat established or refractory chronic GVHD and therefore sit
              downstream of Tregzi's prevention proposition. The most important status-quo substitutes are an
              unmanipulated graft with tacrolimus/methotrexate and increasingly post-transplant cyclophosphamide-based
              prophylaxis. CMS coverage of allogeneic transplantation supports the underlying procedure, but does not by
              itself establish product-specific reimbursement for Tregzi.
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM001
