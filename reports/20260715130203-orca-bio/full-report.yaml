      - number: '2.2'
        title: TAM, SAM and SOM through multiple lenses
        blocks:
          - type: paragraph
            body: >
              Market sizing requires separate lenses because published reports measure different populations, therapies
              and geographies. HRSA activity data indicate 6,646 unrelated-donor and 3,756 related-donor allogeneic
              transplants in the United States in 2024, or 10,402 in total. Multiplying that entire procedure pool by
              the exact $428,000 Tregzi WAC gives a $4.45B theoretical annual revenue ceiling, but this is deliberately
              not labeled an addressable forecast: pediatric, nonmalignant, mismatched, reduced-intensity and clinically
              unsuitable cases fall outside the approved use. A disease-focused 5,000–6,000 annual AML/MDS-heavy pool
              gives a more constrained $2.14B–$2.57B product-value range before eligibility and penetration discounts.
              An illustrative launch scenario of 250–500 annual starts across the planned center network equals
              $107M–$214M; patient throughput is an explicit assumption, not guidance. For context only, 2026 global
              GVHD treatment estimates cluster around $1.85B–$4.19B, while one $23.07B estimate is a scope outlier.
