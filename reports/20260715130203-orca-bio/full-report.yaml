      - number: '3.3'
        title: Pricing, distribution power, switching cost and multi-homing
        blocks:
          - type: paragraph
            body: >
              Tregzi’s $428,000 wholesale acquisition cost is transparent; most alternatives are not comparable on a
              single unit. PTCy and tacrolimus/methotrexate use generic medicines embedded in the transplant episode,
              while downstream drugs recur until discontinuation and Ryoncil is weight-based across at least eight
              infusions. One payer-oriented source estimates $1.55 million for Ryoncil’s initial eight-infusion course,
              but an exact Omisirge WAC and current drug net prices were not confirmed in the readable reviewed sources.
              Operational switching is asymmetric. A center can multi-home by assigning different eligible patients to
              Tregzi, PTCy, Omisirge or standard grafts, so there is no technical account-level exclusivity. However,
              adopting Tregzi requires qualification, donor-cell coordination, manufacturing-slot reservation and
              reliable fresh-product delivery within about 72 hours. That creates workflow-specific switching cost and
              gives high-volume transplant centers distribution leverage. Omisirge’s planned U.S. manufacturing
              partnership and Ryoncil’s broad pediatric-center uptake show that partner capacity and center access—not
              just patents—can determine commercial reach.
