      - number: '3.2'
        title: Competitor profiles and capability boundaries
        blocks:
          - type: paragraph
            body: >
              Product comparisons favor Orca only when the buying criterion is defined narrowly as prevention through
              precision graft composition. Tregzi has randomized Phase 3 evidence in 187 adults and an approved
              matched-donor indication, while Omisirge is a nicotinamide-modified cord-blood graft intended to
              accelerate neutrophil recovery and reduce infection. Ryoncil is an off-the-shelf mesenchymal stromal-cell
              treatment for pediatric steroid-refractory acute GVHD; its company reported $115 million of fiscal-2026
              net revenue, demonstrating that transplant centers can adopt a specialized cellular product, but not
              proving demand for prophylactic graft engineering. Jakafi, Rezurock and Niktimvo have simpler drug
              distribution but are downstream chronic-GVHD treatments after prior systemic therapy. Jasper’s current
              briquilimab program targets mast-cell diseases, and the company reported only $14.1 million cash before
              initiating a strategic review. Vor wound down its former AML cell-therapy operations and pivoted to
              telitacicept. These reversals are favorable for near-term competitive intensity but adverse evidence about
              the financing and execution fragility of novel cell-therapy platforms.
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP014
