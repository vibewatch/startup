  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: the buyer can choose a product, a protocol, or the status quo'
        blocks:
          - type: paragraph
            body: >
              The competitive set must be organized by the clinical job rather than by the broad label “cell therapy.”
              Tregzi is the only reviewed FDA-approved product that engineers a matched-donor graft with purified HSPCs,
              regulatory T cells and conventional T cells to prevent chronic GVHD upfront. Its direct commercial-product
              peer set is therefore sparse. The principal substitute is protocol change: unmanipulated allo-HSCT using
              tacrolimus/methotrexate or the increasingly influential post-transplant cyclophosphamide regimen. PTCy is
              especially formidable because a roughly 430-patient randomized study reported 53% one-year GVHD-free,
              relapse-free survival versus 35% with tacrolimus/methotrexate, uses familiar drugs and can be adopted
              without buying a bespoke graft. Omisirge is an adjacent graft product focused on cord-blood engraftment
              and infection risk; Ryoncil, Jakafi, Rezurock and Niktimvo treat GVHD after it exists. Academic centers
              can also internalize new prophylaxis or graft-manipulation protocols. Orca-Q is a defensive pipeline
              extension rather than a current external competitor, while current Jasper and Vor evidence reduces the
              near-term threat from their previously discussed transplant platforms.
