  - id: TP001
    title: Competitor profile table
    columns:
      - Alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation / direction
      - Limitation versus Tregzi
    rows:
      - - PTCy + tacrolimus/MMF
        - Status-quo prophylaxis substitute
        - ~430-patient multicenter randomized trial; protocol-native
        - Matched or partially mismatched allo-HSCT
        - Lower-cost regimen with improving practice adoption
        - Not a precision graft; reviewed pivotal population used reduced-intensity conditioning
      - - Tacrolimus + methotrexate
        - Incumbent standard prophylaxis
        - Used as conventional control across major trials
        - Conventional matched-donor allo-HSCT
        - Familiar, generic and deeply embedded
        - Inferior cGVHD-free outcomes in Precision-T control
      - - Omisirge / Gamida Cell
        - Adjacent graft cell therapy
        - FDA approved 2023; second indication in 2025; U.S. manufacturing partnership
        - Cord-blood transplant; patients lacking preferred matched donors
        - NAM-expanded cord blood accelerates engraftment
        - Not designed as Treg-based chronic-GVHD prevention
      - - Ryoncil / Mesoblast
        - Adjacent GVHD cell treatment
        - FDA approved 2024; company reports $115M FY2026 net revenue
        - Pediatric steroid-refractory acute GVHD
        - Off-the-shelf MSC rescue therapy; adult expansion planned
        - Treats existing acute GVHD, not upfront chronic-GVHD prevention
      - - Jakafi / Incyte
        - Downstream drug
        - Approved, commercially distributed oral medicine
        - Chronic GVHD after systemic-therapy failure
        - Established JAK-pathway treatment
        - Treatment rather than prevention; recurring therapy
      - - Rezurock / Sanofi
        - Downstream drug
        - FDA approved 2021 oral medicine
        - Age 12+ chronic GVHD after two prior lines
        - ROCK2 mechanism addresses inflammation/fibrosis
        - Later-line treatment rather than graft engineering
      - - Niktimvo / Incyte-Syndax
        - Downstream biologic
        - FDA approved 2024; 75% ORR in AGAVE-201
        - cGVHD after at least two prior lines; weight ≥40 kg
        - First-in-class CSF-1R blockade
        - Infused later-line treatment, not prophylaxis
      - - Jasper briquilimab
        - Former conditioning adjacency / likely entrant
        - $14.1M cash at 2026-03-31; strategic review
        - 'Current focus: mast-cell diseases'
        - Anti-KIT platform now directed to CSU/CIndU/asthma
        - No current reviewed transplant program; funding constrained
