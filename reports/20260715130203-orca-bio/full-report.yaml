      - number: '2.4'
        title: Growth drivers, constraints and adoption timing
        blocks:
          - type: paragraph
            body: >
              Demand is supported by a durable base of more than ten thousand annual U.S. allogeneic transplants,
              broader donor availability and the major clinical burden of chronic GVHD. Tregzi's randomized
              evidence—78.0% one-year chronic-GVHD-free survival versus 38.4% for control and 12.6% versus 44.0%
              moderate-to-severe chronic GVHD—creates a clinically legible adoption trigger and a plausible downstream
              cost-offset narrative. Analyst reports also forecast faster growth for cell and gene therapy modalities
              than for the overall GVHD market. Adoption is nevertheless constrained by a formidable low-cost incumbent:
              post-transplant cyclophosphamide-based prophylaxis has randomized evidence and is already changing
              practice. Tregzi also requires a fully matched donor, myeloablative preparation, center qualification and
              fresh-product delivery within roughly 72 hours. The $428,000 upfront price is material relative to a
              recent $331,827 median transplant-period cost estimate, so payer authorization, separate reimbursement and
              proof of durable avoided complications can govern timing even when clinicians accept the efficacy
              evidence.
