      - number: '2.3'
        title: Buyer, user and payer segmentation
        blocks:
          - type: paragraph
            body: >
              The economic customer is a transplant center or its sponsoring hospital system, while the clinical users
              are transplant physicians, cell-processing teams, pharmacists, coordinators and inpatient nursing staff.
              The patient is the beneficiary but rarely the budget owner. The purchase path begins with physician
              identification of an eligible adult and an 8/8 HLA-matched donor, proceeds through multidisciplinary case
              review and payer authorization, and then requires center onboarding, donor collection, manufacturing-slot
              reservation and timed infusion. Hospital finance, pharmacy-and-therapeutics or value-analysis functions
              are likely internal budget gatekeepers; commercial insurers, Medicare and Medicaid ultimately bear much of
              the covered episode cost. This inference should be tested center by center because buy-and-bill, bundled
              transplant reimbursement, carve-outs and contractual risk allocation are not publicly specified. NMDP's
              directory confirms that center selection is concentrated and measurable, and the roughly 25-center
              year-end target makes account-level sequencing more important than broad community-oncology promotion.
            claimRefs:
