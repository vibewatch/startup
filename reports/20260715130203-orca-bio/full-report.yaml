      - number: '6.2'
        title: 'Adoption trajectory: strong clinical repetition, minimal commercial history'
        blocks:
          - type: paragraph
            body: >
              Adoption evidence divides sharply between clinical repetition and commercial deployment. Orca reports more
              than 500 patient-specific products made across clinical programs, showing repeated national
              donor-to-patient operations, but those products are not commercial orders and cannot be treated as active
              customer accounts. The pivotal Precision-T program involved 19 U.S. treatment centers and 187 randomized
              participants, creating an experienced launch seed set. Commercially, however, approval occurred only on
              June 30, 2026. Independent launch coverage says Orca began with a “handful” of treatment centers, expected
              first orders in the following weeks, and planned an onboarding and production ramp to ~25 centers by
              year-end 2026. The disclosed trajectory therefore supports readiness, not realized utilization. No public
              source reviewed disclosed activated-center count, paid orders, treated commercial patients,
              manufacturing-slot utilization, orders per site or payer approval rates as of July 15. The appropriate
              funnel labels those stages unknown rather than converting the clinical cohort into customers. Early
              concentration is structurally high while a small initial network absorbs training, reimbursement and
              logistics.
