      - number: '7.3'
        title: Partner and dependency concentration
        blocks:
          - type: paragraph
            body: >
              Orca controls manufacturing but not every prerequisite to treatment. Tregzi begins with an eligible
              matched related or unrelated donor, and transplant teams search family and the NMDP Registry when donor
              cells are needed. Collection centers, couriers and transplant hospitals must then execute coordinated
              handoffs. Commercial distribution begins at only a handful of centers, with approximately 25 targeted by
              year-end 2026, so a few institutions can dominate early throughput and negotiating leverage. FDA remains
              the decisive regulator for ongoing manufacturing and safety compliance, while Silicon Valley Bank supplies
              up to $100M of additional liquidity under an amended facility whose draw, covenants and maturity are not
              public. Regional logistics providers and the Princeton bridge diversify some physical risk, but do not
              remove matched-donor, apheresis, regulator or capital-provider dependence. Residual exposure remains high
              until center throughput is diversified, alternate lanes are qualified, the East Coast line releases
              commercial lots and covenant headroom is documented.
