      - number: '7.6'
        title: Mitigations, monitoring and thesis-break criteria
        blocks:
          - type: paragraph
            body: >
              The monitoring plan should convert broad risks into monthly evidence. For quality, require first-pass
              release yield, deviations per lot, out-of-specification investigations, identity exceptions, on-time
              delivery and regulator observations by site. For commercialization, track signed and activated centers,
              payer authorization, scheduled products, successful infusions, realized net price and cash collection. For
              liquidity, reconcile cash, burn, debt draw, borrowing base, covenants and committed capex. For people,
              inspect quality-unit independence, succession coverage and critical-role turnover. Thesis-break events are
              deliberately severe: a clinical hold or material warning letter tied to commercial manufacturing; a recall
              or patient-identity failure; persistent commercial release yield below 90%; failure to validate Princeton
              before Sacramento capacity or resilience becomes binding; or less than twelve months of downside runway
              without committed financing. A weaker but still material reset is two consecutive quarters of center
              activation, payer conversion or collected net price materially below board plan. These thresholds require
              private evidence and should become closing conditions.
