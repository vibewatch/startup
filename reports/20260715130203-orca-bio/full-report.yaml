  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >
              The top regulatory risk is no longer whether Tregzi can win an initial license; it is whether Orca can
              maintain consistent licensed-product quality while scaling a patient-specific, three-component graft. FDA
              extended review after requesting additional CMC data, and the prescribing information requires exact
              patient identity, timed handling and monitoring for graft failure, infusion reactions, secondary
              malignancies and infectious-disease transmission. Residual severity is therefore critical despite
              approval: an inspection finding, potency drift, identity error or material deviation could interrupt
              release, trigger field action or damage center confidence. Label breadth is also constrained to
              matched-donor transplantation with myeloablative preparation; Orca-Q and reduced-intensity SERENE-T remain
              investigational. Patent-safe-harbor disputes and healthcare-organization contract terms create medium
              legal exposure, while public evidence does not establish Orca's complete patent inventory, litigation
              docket, insurance limits, post-marketing commitments or facility inspection history. The investment
              implication is to underwrite approval as a monitored operating license, not a permanent removal of
              regulatory risk.
            claimRefs:
              - CR001
              - CR002
