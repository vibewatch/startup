chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission and business model
        blocks:
          - type: paragraph
            body: >
              Orca Bio is a Menlo Park, California biotechnology company that develops high-precision allogeneic
              (donor-derived) T-cell immunotherapies for blood cancers and, increasingly, autoimmune disease. The
              company was founded in 2016 by a Stanford-affiliated team and operates commercially through its legal
              entity, Orca Biosystems, Inc., which is the holder of record for its first FDA approval. Its lead product,
              Tregzi (development name Orca-T), is a donor-derived cellular immunotherapy composed of three sequentially
              administered components — purified hematopoietic stem and progenitor cells, regulatory T cells, and
              conventional T cells — engineered to reconstitute a patient's blood and immune system while sharply
              reducing chronic graft-versus-host disease. The business model is that of a commercial-stage,
              single-product cell-therapy company: Orca manufactures a personalized, one-time therapy for each patient
              at company-owned GMP facilities and sells it to transplant centers at a wholesale acquisition cost of
              $428,000. Revenue is expected to begin in the second half of 2026 as first orders are taken. The company
              frames its mission as delivering the promise of cell therapy "without compromise," meaning cure without
              the debilitating trade-offs historically associated with allogeneic transplantation.
