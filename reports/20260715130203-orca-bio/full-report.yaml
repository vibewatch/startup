      - number: '1.4'
        title: Product and regulatory status
        blocks:
          - type: paragraph
            body: >
              Orca Bio's identity now centers on its first approved product. On 30 June 2026 the FDA approved Tregzi
              (Orca-T) for use in matched-donor hematopoietic stem cell transplantation with a myeloablative preparative
              regimen, to improve chronic graft-versus-host-disease-free survival in adults with hematologic
              malignancies — the first regulatory T-cell-based immunotherapy ever approved for this setting. Approval
              was granted to Orca Biosystems, Inc. and rested on the randomized, controlled Phase 3 PRECISION-T trial
              (NCT05316701) in 187 adults, which met its primary endpoint with a chronic GVHD-free survival hazard ratio
              of 0.26 and one-year rates of 78.0% versus 38.4% for standard transplant. Tregzi carries Orphan Drug and
              Regenerative Medicine Advanced Therapy designations and reached approval after a roughly three-month PDUFA
              extension during which the FDA requested additional manufacturing data. Beyond Tregzi, the pipeline
              includes Orca-Q, a second-generation candidate designed to work without a fully matched donor, and an
              earlier-stage OrCAR platform, spanning leukemia, lymphoma, multiple myeloma and autoimmune indications
              such as primary progressive multiple sclerosis.
            claimRefs:
              - CO019
              - CO020
              - CO021
              - CO022
              - CO023
              - CO024
              - CO025
              - CO042
      - number: '1.5'
        title: Milestones and trajectory
        blocks:
          - type: paragraph
            body: >
              Orca Bio's trajectory is a decade-long march from a Stanford spin-out to a commercial cell- therapy
              company. Founded in 2016, it built centralized GMP manufacturing in California, treated its first patients
              with Orca-T and later Orca-Q, and secured RMAT designation from the FDA. In 2022 it broke ground on a
              state-of-the-art commercial manufacturing facility in Sacramento, California, and progressively presented
              positive data — including in elderly patients — at the American Society of Hematology annual meetings.
              Pivotal Phase 3 PRECISION-T data were presented at the EBMT annual meeting in 2025 and published in the
              journal Blood in March 2026. Regulatory momentum followed: FDA accepted the Biologics License Application
              for Priority Review with an April 6, 2026 PDUFA target, the company completed its Series F, transitioned
              its CEO, added an East Coast (Princeton, New Jersey) manufacturing site and tripled its West Coast
              manufacturing workforce, and finally won FDA approval on 30 June 2026. Along the way Orca reports treating
              its 500th patient and producing more than 500 cell-therapy products across its clinical programs.
