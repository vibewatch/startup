      - number: '5.5'
        title: Trust, quality, safety and center-control obligations
        blocks:
          - type: paragraph
            body: >
              FDA approval and GMP production establish a regulated baseline, not a blanket safety guarantee. The label
              operationalizes quality through patient-specific labels, bag-integrity inspection, temperature-specific
              receipt, expiry checks, a Certificate of Analysis and identity verification before each component. It also
              requires universal precautions for a human-blood-derived product and close post-infusion monitoring.
              Common adverse reactions at incidence of at least 20% include mucositis, diarrhea, rash, viral, bacterial
              and fungal infections, abdominal symptoms, hemorrhage, acute GVHD and edema. Warnings cover graft failure,
              life-threatening or fatal GVHD, infusion reactions, secondary or donor-origin malignancies and
              infectious-agent transmission. Precision-T’s 100% neutrophil recovery within 28 days is an important
              reliability signal, but the broader label states that graft failure has occurred and therefore mandates
              antidonor-antibody screening and hematopoietic-recovery monitoring. Centers must preserve chain of
              identity, avoid a leukodepleting filter, thaw and dilute Tcons correctly, report suspected serious events
              through Orca and FDA MedWatch, and sustain long-term malignancy and infection surveillance.
