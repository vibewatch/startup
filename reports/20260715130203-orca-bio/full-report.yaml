      - number: '8.2'
        title: Financing context, entry discipline and overhang
        blocks:
          - type: paragraph
            body: >
              The $1.2B January 2026 private-company mark is an analytical entry input, not a verified clearing price.
              The same secondary source reports $625M raised and a 1.91x valuation-to-capital ratio, while the company
              and its legal adviser confirm $250M of equity across the two most recent rounds and up to $100M under an
              amended SVB facility. The SEC filing independently establishes that the 2020 Series D sold $191,999,870 of
              preferred stock and conversion-linked common stock. Public evidence does not disclose Series F post-money
              mechanics, primary versus secondary proceeds, fully diluted ownership, liquidation preferences,
              participation, anti-dilution, option-pool refreshes, debt draw or cash. Six rounds make preference and
              dilution overhang plausible, but their amount must not be invented. Entry discipline should therefore be
              document-driven: at $1.2B, require clean seniority, at least 24 months of downside liquidity, and
              commercial proof; otherwise seek a structured or lower entry. The financing is enough to attempt launch,
              but public data cannot prove that the quoted price is supported after preference-adjusted dilution.
