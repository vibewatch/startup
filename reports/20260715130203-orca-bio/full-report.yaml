      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              The final decision should be conditioned on evidence that directly converts product promise into equity
              value. First, reconcile the Series F term sheet, fully diluted cap table, all preferred rights and the SVB
              agreement into proceeds available to a new investor. Second, trace every commercial patient from referral
              through authorization, released lot, infusion, invoice and cash collection, including realized net price
              and center-level productivity. Third, audit commercial first-pass yield, deviations, per-lot COGS,
              logistics cost and site absorption at Sacramento and Princeton. Fourth, rebuild runway under base and
              downside launch cases and separate committed cash from undrawn debt. Thesis breaks are a material FDA
              manufacturing action or patient-identity event; persistent first-pass yield below 90%; two consecutive
              quarters materially behind board adoption and net-price plan; less than twelve months of downside runway
              without committed financing; or an insider financing below the current preference-adjusted entry. Passing
              these gates would move the call toward buy; failure should move it to avoid rather than justify averaging
              down.
