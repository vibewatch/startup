companyProfile:
  summary: >-
    Orca Bio is a Menlo Park, California cell-therapy company founded in 2016 as a Stanford spin-out. Its precise
    cellular-engineering platform sorts a donor graft into high-purity regulatory T cells, hematopoietic stem/progenitor
    cells, and conventional T cells to preserve the graft-versus-leukemia effect while preventing graft-versus-host
    disease. Lead product Tregzi (Orca-T) won FDA approval on 30 June 2026 as the first regulatory T-cell-based
    allogeneic cell therapy for adults with hematologic malignancies undergoing matched-donor transplant. The company
    has raised roughly $625M through a Series F led by Lightspeed and carries an approximately $1.2B private valuation,
    but is pre-revenue with a single just-approved product.
