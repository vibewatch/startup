      - number: '5.3'
        title: 'Operating architecture: precision separation, release and timed delivery'
        blocks:
          - type: paragraph
            body: >
              Orca’s manufacturing system starts with mobilized donor peripheral blood, which is couriered to a GMP
              facility for purification and formulation into defined cell populations. The reviewed evidence supports
              central clinical manufacturing in Sacramento and a Princeton bridge intended to extend East Coast capacity
              after line validation. The pivotal paper reports that all treated Orca-T products were delivered within 72
              hours of donor apheresis. The label clarifies that this is a hybrid cold chain: HSPC and Treg bags arrive
              refrigerated at 2–8°C and must be infused promptly, while Tcons travel cryopreserved below -125°C, are
              thawed on day +2 or +3, diluted and infused within four hours if not immediate. Every bag is
              patient-specific; identity, expiry, integrity and Certificate of Analysis checks are clinical controls,
              not administrative extras. More than 500 clinical products demonstrate repetition, but they do not
              disclose commercial first-pass yield. Management’s expected single-digit to low-single-digit failure rate
              remains a forward claim that requires batch-level verification.
