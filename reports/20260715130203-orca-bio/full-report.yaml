        - Former engineered-HSC entrant
        - 95% workforce reduction reported before $175M pivot financing
        - 'Current focus: autoimmune telitacicept'
        - Licensed late-stage commercialized-in-China asset
        - Former AML cell-therapy operations wound down
      - - Academic center protocol
        - Internal build / substitute
        - High-volume centers already run complex prophylaxis trials
        - Center-specific allo-HSCT populations
        - Can change drug protocols without buying a graft
        - Reproducing standardized commercial manufacturing is harder
      - - Orca-Q
        - Internal defensive extension
        - Phase 1 recruiting; 300 estimated enrollment
        - Matched, 7/8 mismatched and haploidentical donor settings
