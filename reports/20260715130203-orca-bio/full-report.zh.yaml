        title: 快照与关键指标
        blocks:
          - type: paragraph
            body: >
              从快照看，Orca Bio 是一家刚进入商业化、由风投支持的细胞治疗公司：一个获批产品，一套差异化但资本密集的制造模式，以及一个已经计入相当大未来商业成功的估值。可核验的封面指标包括约 $1.2B 估值、约
              $625M 累计融资、Tregzi $428,000 批发价、临床项目累计治疗超过 500 名患者，以及计划到 2026 年底扩展至约 25
              家治疗中心。对私营公司仍不可得的指标——收入运行率、毛利率、员工数和精确现金跑道——被标记为缺口，并附上具体尽调路径，而不是强行估算。可投资性画像是：强临床验证和先发监管位置，抵消因素是单产品集中、商业爬坡未验证、制造与物流复杂（72
              小时 vein-to-vein 窗口），以及高价一次性疗法的报销不确定性。这些指标及其置信水平为后续章节分析提供锚点。
