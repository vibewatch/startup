      - number: '3.3'
        title: 定价、分销权力、切换成本与多归属
        blocks:
          - type: paragraph
            body: >
              Tregzi 的 $428,000 批发采购成本透明；多数替代方案不能按单一单位比较。PTCy 和 tacrolimus/methotrexate
              使用嵌入移植事件的仿制药，下游药物则持续使用直到停药，Ryoncil 按体重给药且至少八次输注。一份面向支付方的来源估计 Ryoncil 初始八次输注疗程为 $1.55M，但可读审阅来源未确认 Omisirge
              的精确 WAC 和当前药品净价。运营切换是不对称的。中心可以多归属，把不同合格患者分配给 Tregzi、PTCy、Omisirge 或标准移植物，因此账户层面没有技术排他性。不过，采用 Tregzi
              需要资质认证、供者细胞协调、制造档期预留，以及在约 72 小时内可靠交付新鲜产品。这会形成流程特定切换成本，并让高量移植中心获得分销杠杆。Omisirge 计划中的美国制造合作关系和 Ryoncil
              在儿科中心的广泛采用表明，合作伙伴产能和中心准入——不只是专利——可以决定商业触达。
