      - number: '7.2'
        title: 制造、质量和物流失效模式
        blocks:
          - type: paragraph
            body: >
              商业执行依赖一条紧密耦合的供者到患者链条。Precision-T 显示 Orca 能在供者单采后 72 小时内生产并输注试验产品，
              但试验中的重复执行不能证明商业首检合格率、偏差率或召回准备度。标签中的患者特异性标识和有效期，让身份链、 监管链和排期成为安全关键。Sacramento 能满足公司所称近期需求；Princeton
              被描述为临床项目桥接，预计只有完成产线验证后 才支持商业生产。这降低了地理集中度，但还没有消除。独立物流资料把路线中断、温度偏离、标签错误和狭窄稳定窗口列为 细胞疗法常见风险。FACT 标准和 FDA
              偏差报告强化了对经验证的采集、处理、运输、放行和纠正行动系统的需求。Sacramento 缓解成熟度为中，Princeton
              仍早期，灾备未披露。一个商业批次被拒或多日中断，会同时丢收入、占产能，并迫使临床重排期。
