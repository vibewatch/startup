      - number: '5.2'
        title: 已获批资产、管线延伸与临床成熟度
        blocks:
          - type: paragraph
            body: >
              组合按监管成熟度以及供者或预处理覆盖广度分层。Tregzi 是商业锚点：FDA 批准标签覆盖接受 8/8 匹配亲缘或非亲缘供者移植物、并经过清髓性预处理的血液系统恶性肿瘤成人患者。关键随机研究纳入 187
              名成人，其中 93 人分配至 Tregzi，94 人分配至对照组。一年无慢性 GVHD 生存率为 78.0%，对照为 38.4%，风险比 0.26；中重度慢性 GVHD 为 12.6%，对照为
              44.0%。非复发死亡率为 3.4%，对照为 13.2%。一年总生存比较为 93.9% 对 83.1%，在 P=.12 下没有统计显著性，不应宣传为已证明的生存获益。Orca-Q 是正在招募的 Phase 1
              项目，意在覆盖错配和半相合供者场景。SERENE-T 是 Orca-T 在降低强度或非清髓性预处理后使用的招募中 Phase 2 研究，OrCAR 仍是更早期的组合平台方向。这些项目是路线图选项，不是获批能力。
