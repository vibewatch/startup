  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >
              Orca Bio 的商业市场，最合适的定义是：面向符合条件的成人血液系统恶性肿瘤患者，在接受匹配供者、清髓性异体造血干细胞移植时，提供精准移植物工程和慢性 GVHD
              预防。它不是完整的干细胞移植手术市场，也不等同于下游 GVHD 药物市场。纳入支出的部分是一次性 Tregzi 移植物产品，批发采购成本
              $428,000，以及采集供者细胞、制造新鲜产品、输注三种组分所需的中心流程。常规移植设施、预处理、供者搜索和住院常规成本与 Tregzi 收入相邻，但不是 Tregzi
              收入。同样，Jakafi、Rezurock 和 Niktimvo 治疗已发生或难治性慢性 GVHD，位于 Tregzi 预防主张的下游。最重要的现状替代方案是未操作移植物加
              tacrolimus/methotrexate，且基于移植后 cyclophosphamide 的预防方案影响力越来越强。CMS 对异体移植的覆盖支持基础手术，但本身并不能确立 Tregzi 的产品特定报销。
