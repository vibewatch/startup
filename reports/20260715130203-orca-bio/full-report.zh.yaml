        title: 护城河耐久性、替代路径与反向证据
        blocks:
          - type: paragraph
            body: >
              Orca 最强的护城河是监管、临床和流程组合：首个获批的 Treg 工程化移植物，一项一年无慢性 GVHD 生存 78.0% 对 38.4%
              的随机试验，以及三组分个性化产品的累计制造诀窍。该护城河有意义，但不是绝对。关键试验对照是 tacrolimus/methotrexate，而非
              PTCy，因此商业论证缺少与最可能取代旧标准的方案之间的随机头对头答案。标签还要求匹配供者和清髓性预处理；Orca-Q 仍在 Phase 1 招募，尚不能消除这一边界。流程复杂性可以阻挡进入者，同时也约束
              Orca：批准前 FDA
              要求补充制造数据，新鲜产品还必须在紧张时间表内送达。商品化风险来自方案创新，它可能在不需要定制制造的情况下缩小结局差距。进入者风险更可能通过收购或合作出现，而不是从零搭建后入场；Jasper 战略评估和 Vor
              转向说明了这一点。因此，优先尽调是 PTCy 对照结局、已激活中心吞吐、制造成功率、净价，以及避免慢性 GVHD 成本能否延续到一年以后。
