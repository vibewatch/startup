      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >
              经济客户是移植中心或其所属医院系统，临床用户是移植医生、细胞处理团队、药师、协调员和住院护理人员。患者是受益者，但很少是预算负责人。采购路径从医生识别符合条件的成人和 8/8 HLA
              匹配供者开始，经多学科病例评审和支付方授权，再进入中心准入、供者采集、制造档期预留和定时输注。医院财务、药事与治疗委员会或价值分析职能很可能是内部预算把门人；商业保险、Medicare 和 Medicaid
              最终承担覆盖治疗事件的大部分成本。该推断需要逐中心验证，因为 buy-and-bill、打包移植报销、carve-out 和合同风险分摊均未公开说明。NMDP 目录确认中心选择集中且可衡量；约 25
