      - number: '1.5'
        title: 里程碑与发展轨迹
        blocks:
          - type: paragraph
            body: >
              Orca Bio 的轨迹是一场十年推进：从 Stanford 分拆公司成为商业化细胞治疗公司。2016 年成立后，公司在 California 建立集中式 GMP 制造，先后用 Orca-T 和 Orca-Q
              治疗首批患者，并获得 FDA 的 RMAT 认定。2022 年，公司在 California 州 Sacramento 的先进商业制造设施破土，并逐步在美国血液学会年会上公布积极数据，包括老年患者数据。关键
              Phase 3 PRECISION-T 数据于 2025 年在 EBMT 年会上发表，并于 2026 年 3 月刊登在 Blood。监管动能随后接上：FDA 接受生物制品许可申请并给予优先审评，PDUFA
              目标日为 2026 年 4 月 6 日；公司完成 Series F，完成 CEO 交接，新增美国东岸（New Jersey 州 Princeton）制造点，并将美国西岸制造团队扩大到三倍，最终于 2026 年 6
              月 30 日拿到 FDA 批准。期间，Orca 报告已治疗第 500 名患者，并在临床项目中生产超过 500 件细胞治疗产品。
