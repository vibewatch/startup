      - number: '5.4'
        title: 差异化来自组分、流程、证据和监管状态的叠加
        blocks:
          - type: paragraph
            body: >
              护城河是堆叠系统，而不是某一种孤立细胞类型。第一，获批组分刻意分离 HSPC、Treg 和
              Tcon，而不是接受未操作移植物中的可变混合物。第二，运营诀窍必须在临床规模下复现高纯度细胞群、患者专属剂量范围和狭窄放行到输注窗口。第三，随机证据和 FDA 对这一 Treg
              工程化移植组合的首次批准，提高了后来者的证明门槛。第四，一个分配给 Orca 的专利族，包括 2024 年美国授权，描述了富集特定免疫细胞群并去除初始常规 alpha-beta T
              细胞的造血移植组分。专利不能证明自由实施，也不能挡住每一种竞争性预防方案，但它们印证了组分设计是自有 R&D 方向。护城河的弱点也很清楚：当前批准要求匹配供者和清髓性预处理，Orca-Q 和 SERENE-T
              仍处于研究阶段。流程复杂性可以威慑进入者，但如果供者协调、分选、放行检测或运输失败，也会同时限制吞吐和地理覆盖。
            claimRefs:
              - CE019
