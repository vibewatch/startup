  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Representative public cell and gene therapy companies, one distressed private restructuring, and one strategic
        cell-therapy acquisition reviewed through 2026-07-15.
    columns:
      - 可比对象
      - 阶段 / 指标
      - 估值或交易状态
      - 对 Orca 的参照价值
      - 主要局限
    rows:
      - - Legend Biotech
        - 商业化 CAR-T；2026 Q1 净贸易销售 $597M
        - 2026 年 7 月市值约 $4.52B
        - 商业化细胞疗法的规模和利润率参照
        - 合作开发的全球 CAR-T，基础设施更广
      - - Gamida Cell
        - 已获批移植细胞疗法；流动性受限
        - $75M 债务转换，外加 $30M 新救援资金；私有化
        - 直接警示：获批不保证融资耐久性
        - 不是公平交易下的市值出售
      - - CRISPR Therapeutics
        - 商业化 / 管线期基因编辑
        - 2026 年 1 月 Statista 为 $5.19B；2026 年 7 月约 $4.98B
        - 公开市场同类纯业务资产的上沿里程碑参照
        - 技术路径、适应症和经济性不同
      - - Beam Therapeutics
        - 临床阶段碱基编辑
        - 2026 年 1 月 Statista 为 $3.35B；2026 年 7 月约 $3.14B
        - 管线期权价值参照
        - 尚未商业化，平台不同
      - - uniQure
        - 基因疗法平台
        - 2026 年 1 月 Statista 为 $1.35B；2026 年 7 月约 $2.77B
        - 显示 Orca 这个规模附近由里程碑驱动的波动
        - 疾病组合和价值催化剂不同
      - - Intellia Therapeutics
        - 临床阶段基因编辑
        - 2026 年 1 月 Statista 为 $1.32B；2026 年 7 月约 $1.84B
        - 接近入场价的公开市场估值参照
        - 没有直接的移植商业化类比
      - - Gilead / Kite
        - 上市前战略性 CAR-T 收购
        - $11.9B 交易；单日溢价 29%
        - 品类领导地位和稀缺平台的战略估值上限
        - 2017 年市场环境和转型型资产；不是基准倍数
    notes: 市值是某一时点的股权价值，交易对价不能直接对比私营公司投后估值；样本集刻意只取部分案例。
