  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与四方购买系统
        blocks:
          - type: paragraph
            body: >
              Tregzi 不是按诊室给药药物的方式购买。账户级客户是拥有异体造血细胞移植项目的学术型或专科医院，临床用户是移植医生和多学科 BMT 或细胞治疗团队，最终受益者是符合条件的 AML、ALL、MDS 或 MPAL
              成人患者。支付是第四个角色：商业保险和 Medicare
              通过授权、合同、编码以及住院或门诊支付流程向医院报销。这种角色分离很关键，因为只有医生热情无法激活账户。一个中心必须协调供者搜索、预处理、产品订购、接收和顺序给药，同时财务团队要为 $428,000
              一次性产品争取覆盖。因此，相关垂直市场是集中的美国移植生态，而不是普通肿瘤科。大型转诊中心提供最大的近期病例量，但也拥有议价和方案选择权。直接渠道从 Orca
              的集中制造和准入团队通往合格医院项目；患者和社区肿瘤医生贡献转诊渠道，但不下产品订单。
