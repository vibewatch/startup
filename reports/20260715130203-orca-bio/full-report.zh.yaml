      - number: '2.2'
        title: TAM、SAM 和 SOM 的多重口径
        blocks:
          - type: paragraph
            body: >
              市场测算必须拆成不同口径，因为公开报告衡量的人群、疗法和地域不同。HRSA 活动数据表明，2024 年美国有 6,646 例无关供者异体移植和 3,756 例相关供者异体移植，合计 10,402
              例。将整个手术池乘以 Tregzi 精确 WAC $428,000，可得到 $4.45B
              的理论年收入上限，但这里有意不把它标为可寻址预测：儿科、非恶性、错配、降低强度以及临床不适合病例都在批准用途之外。以疾病为核心的 5,000–6,000 例年度 AML/MDS
              重度人群，在资格和渗透率折扣前，对应更受约束的 $2.14B–$2.57B 产品价值范围。一个说明性上市情景是，在计划中心网络内每年启动 250–500 例，对应
              $107M–$214M；患者吞吐量是显式假设，不是指引。仅作背景，2026 年全球 GVHD 治疗估计集中在 $1.85B–$4.19B，而一个 $23.07B 估计属于范围异常值。
