      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Orca Bio 自 2016 年成立以来已通过股权融资约 $625M，并有债务额度补充。公司 2020 年 6 月以 $192M Series D 走出隐身状态，该轮由 Lightspeed Venture
              Partners 共同领投，使当时累计资本接近 $300M，参与方包括 8VC、DCVC Bio、ND Capital、Mubadala Investment Company、Kaiser Foundation
              Hospitals、Kaiser Permanente Group Trust 和 IMRF。2025 年 12 月，公司完成由 Lightspeed 领投的 Series F；连同上一轮，公司宣布新增股权资本
              $250M，并通过 2025 年修订的 Silicon Valley Bank 信贷额度获得最高 $100M 的额外流动性。二级市场和私营公司数据提供商将 Orca Bio 截至 2026 年 1 月的估值放在约
              $1.2B，使其具备独角兽身份，并隐含约 1.9x 累计融资的资本效率比。由于 Orca Bio 是私营公司且不发布经审计财务，逐轮精确估值、$1.2B
              标记中新股与老股占比、当前现金余额和烧钱速度均未公开披露，必须按估计处理。
