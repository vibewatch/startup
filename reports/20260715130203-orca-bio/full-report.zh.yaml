  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是协调的移植流程，不是单次输注
        blocks:
          - type: paragraph
            body: >
              Tregzi 是 Orca-T 的获批名称，它把未操作的匹配供者移植物替换为一套定义明确、患者专属的细胞组分序列。符合条件的成人接受清髓性预处理后，移植中心在第 0 天给予 HSPC 和高纯度调节性 T
              细胞，随后在第 +2 或 +3 天给予解冻的常规 T 细胞；单药 tacrolimus 在 Tcon 输注后开始。HSPC 重建血液和免疫谱系，Treg 抑制导致 GVHD 的供者异体反应，Tcon
              加速免疫恢复并保留移植物抗白血病活性。因此，产品把客户任务从「接收并输注供者移植物」改为「排期、识别、接收、核验并给药一个四袋、按体重给药的疗程」。标签要求患者身份核验、中心静脉通路，并禁止使用去白细胞滤器。在
              Precision-T 中，该架构对照未操作移植物加 tacrolimus/methotrexate 测试，因此价值主张是用更少药物免疫抑制换来更少慢性 GVHD 事件，而不是声称移植变得无风险。
            claimRefs:
