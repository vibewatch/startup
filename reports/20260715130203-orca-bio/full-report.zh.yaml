companyProfile:
  summary: >-
    Orca Bio 是一家位于 California 州 Menlo Park 的细胞治疗公司，2016 年从 Stanford 分拆而来。其精准细胞工程平台把供者移植物分选成高纯度调节性 T 细胞、造血干/祖细胞和常规 T
    细胞，在保留移植物抗白血病效应的同时预防移植物抗宿主病。核心产品 Tregzi（Orca-T）于 2026 年 6 月 30 日获 FDA 批准，成为首个面向接受匹配供者移植的血液系统恶性肿瘤成人患者、基于调节性 T
    细胞的异体细胞疗法。公司通过 Lightspeed 领投的 Series F 累计融资约 $625M，私人市场估值约 $1.2B，但目前尚未产生收入，且只有一个刚获批产品。
