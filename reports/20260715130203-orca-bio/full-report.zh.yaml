      - number: '5.5'
        title: 信任、质量、安全与中心控制义务
        blocks:
          - type: paragraph
            body: >
              FDA 批准和 GMP 生产建立的是受监管基线，不是笼统安全保证。标签通过患者专属标签、袋体完整性检查、按温度接收、有效期核验、Certificate of Analysis
              和每个组分输注前身份验证，把质量要求落到操作层面。标签还要求对人血来源产品采取普遍预防措施，并在输注后密切监测。发生率至少 20% 的常见不良反应包括黏膜炎、腹泻、皮疹、病毒、细菌和真菌感染、腹部症状、出血、急性
              GVHD 和水肿。警示覆盖移植物失败、危及生命或致死性 GVHD、输注反应、继发或供者来源恶性肿瘤，以及感染因子传播。Precision-T 在 28 天内 100%
              中性粒细胞恢复是重要可靠性信号，但更广泛标签说明曾发生移植物失败，因此要求抗供者抗体筛查和造血恢复监测。中心必须守住身份链，避免去白细胞滤器，正确解冻并稀释 Tcon，通过 Orca 和 FDA MedWatch
              报告疑似严重事件，并维持长期恶性肿瘤和感染监测。
