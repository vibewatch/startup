      - number: '8.4'
        title: 可比证据和退出准备度
        blocks:
          - type: paragraph
            body: >
              公开可比公司界定结果边界，而不是给出精确倍数。Legend Biotech 是最强的商业阶段参照：2026 年 7 月市值约 $4.5B， CARVYKTI 2026 年一季度净贸易销售额
              $597M，显示经过验证的细胞疗法收入可以支撑数十亿美元价值。Statista 2026 年 1 月快照中， 基因编辑同行约 $1.3B 到 $5.2B，说明管线质量和里程碑可以压过当前收入。不利端点是
              Gamida Cell：其获批移植产品没能阻止由贷款方主导的 私有化、$75M 债务转换和 $30M 救助融资。Gilead 以 $11.9B 收购上市前 Kite
              是战略上限，不是基准倍数；那笔交易反映的是另一个资本市场中的 品类领导力、管线和制造稀缺性。基于公开证据，Orca 尚未具备 IPO 条件，因为审计财务、商业队列、利润率和治理条款均不可得。战略出售要等
              上市可重复性和管线风险降低后才更可信；IPO 应在数个季度可审计收入和站点级运营表现之后再推进。
            claimRefs:
