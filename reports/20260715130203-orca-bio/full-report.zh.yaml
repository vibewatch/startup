  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律暴露排序
        blocks:
          - type: paragraph
            body: >
              头号监管风险不再是 Tregzi 能否拿到初始许可，而是 Orca 能否在放大一款患者特异性、三组分移植物时， 持续保持获批产品质量。FDA 曾在要求补充 CMC
              数据后延长审评；处方信息要求精确核对患者身份、按时限处理， 并监测移植物失败、输注反应、继发恶性肿瘤和传染病传播。因此，即便已经获批，残余严重性仍属关键：检查发现、
              效价漂移、身份错误或重大偏差都可能中断放行、触发现场纠正行动，或损害中心信心。标签范围也受限于清髓预处理下的 匹配供者移植；Orca-Q 和 reduced-intensity SERENE-T
              仍处于研究阶段。专利安全港争议和医疗机构合同条款带来 中等法律暴露，而公开证据无法证明 Orca 完整专利清单、诉讼案卷、保险额度、上市后承诺或设施检查历史。投资含义是把批准
              承保为一张需要持续监控的运营许可，而不是监管风险永久消失。
