        title: 合作伙伴和依赖集中度
        blocks:
          - type: paragraph
            body: >
              Orca 控制制造，但不控制治疗所需的每个前置条件。Tregzi 从合格的匹配亲缘或非亲缘供者开始；需要供者细胞时， 移植团队会搜索家族和 NMDP
              Registry。采集中心、快递和移植医院随后必须协同交接。商业分销起步只有少数中心， 公司目标到 2026 年底约 25 个，因此少数机构可能主导早期通量和议价权。FDA 仍是持续制造和安全合规的决定性监管方；
              Silicon Valley Bank 通过修订后贷款提供最高 $100M 额外流动性，但提款、契约和到期日未公开。区域物流商和 Princeton
              桥接线分散了一些实物风险，却没有消除匹配供者、单采、监管方或资金提供方依赖。只有中心通量多元化、 备用路线完成资质确认、东海岸产线能放行商业批次，且契约余量有文件证明后，残余暴露才会下降；此前仍为高。
