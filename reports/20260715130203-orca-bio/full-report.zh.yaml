chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              Orca Bio 是 California 州 Menlo Park 的生物技术公司，开发高精度异体（供者来源）T 细胞免疫疗法，先瞄准血液癌症，也越来越多延伸到自身免疫疾病。公司由 Stanford 相关团队于
              2016 年创立，商业运营主体是 Orca Biosystems, Inc.，该法人也是首个 FDA 批准的登记持有人。其核心产品 Tregzi（研发名
              Orca-T）是一款供者来源细胞免疫疗法，由三个依次给药的组分组成——纯化造血干/祖细胞、调节性 T 细胞和常规 T
              细胞——设计目标是在重建患者血液和免疫系统的同时，大幅降低慢性移植物抗宿主病。商业模式是一家商业化阶段、单产品细胞治疗公司：Orca 在自有 GMP 设施中为每名患者制造个性化一次性疗法，并以 $428,000
              的批发采购成本售予移植中心。随着首批订单落地，收入预计在 2026 年下半年开始。公司把使命表述为交付「without
              compromise」的细胞疗法承诺，也就是在避免异体移植历史上那些削弱生活质量的代价时仍追求治愈。
