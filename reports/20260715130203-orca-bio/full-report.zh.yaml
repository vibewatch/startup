        - 高纯度调节性细胞，旨在抑制同种异体反应
        - 商业纯度、活率和放行偏差趋势
      - - Tcon 组分加稀释剂
        - 细胞疗法实验室和移植医生
        - 已批准组分；第 +2 至 +3 天
        - 延迟回输常规 T 细胞，以支持免疫和 GVL 功能
        - 按中心查看解冻、稀释和四小时处理表现
