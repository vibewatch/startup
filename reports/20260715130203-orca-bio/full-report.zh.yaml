      - number: '6.4'
        title: 留存看临床持久性，不看订阅续约
        blocks:
          - type: paragraph
            body: >
              传统 SaaS 留存指标无法直接套到 Tregzi：每位患者接受的是一次性、以治愈为目标的移植疗程。因此，NRR、GRR、 logo
              流失和年度续约，要么不适用于患者层面，要么中心层面未披露。最接近且有证据支持的持久性代理指标，是 Precision-T 中持续的临床获益。1 年时，Tregzi 组无慢性 GVHD 生存率为
              78.0%，对照组为 38.4%；中重度 慢性 GVHD 为 12.6% 对 44.0%。文章还披露第 28 天中性粒细胞植入、第 50 天血小板植入和 6 个月重度急性 GVHD
              结局，可以按时间桶查看临床队列，但不能暗示客户续约。总体生存率为 93.9% 对 83.1%，但差异在 P=.12
              下没有统计学显著性。这些试验结果支撑产品持久性和医生信心；它们不能证明医院满意度、复购、账户留存或净收入扩张。 商业队列最终必须按已激活中心跟踪合格病例、订单、付款方批准、取消、输注和随访结果。
