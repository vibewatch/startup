      - number: '7.5'
        title: 人员、执行、安全和信息安全
        blocks:
          - type: paragraph
            body: >
              Orca 必须一边扩制造、一边把领导权交给联合创始人 Nate Fernhoff，同时搭出第一支商业组织。首席商务官有细胞疗法上市经验， Sacramento
              运营人员也大幅增加；但公开记录没有显示商业管理跨度、继任计划、关键岗位流失、质量部门独立性或 Princeton 培训完成情况。创始人和 Stanford
              科学依赖也带来平台技术诀窍的连续性风险。工作场所和环境控制同样重要：OSHA 将接触血液和 其他潜在感染性材料视为受监管危害，EPA
              则指出医疗废物可能含血液或体液，主要由州环境和卫生部门管理。数字化制造和患者链工作流 增加网络安全和隐私暴露；KPMG 将数据完整性、可用性和第三方连接列为生命科学企业的关切。未发现 Orca 特定的公开审计、
              泄露历史或恢复测试，因此不能假设缓解成熟度强，只能判定未验证。
