      - number: '1.4'
        title: 产品与监管状态
        blocks:
          - type: paragraph
            body: >
              Orca Bio 的身份如今围绕首个获批产品展开。2026 年 6 月 30 日，FDA 批准 Tregzi（Orca-T）用于接受清髓性预处理方案的匹配供者造血干细胞移植，以提高血液系统恶性肿瘤成人患者的无慢性
              GVHD 生存——这是该场景首个获批的基于调节性 T 细胞的免疫疗法。批准授予 Orca Biosystems, Inc.，依据是 187 名成人参加的随机对照 Phase 3 PRECISION-T
              试验（NCT05316701）。该试验达到主要终点：无慢性 GVHD 生存风险比为 0.26，一年率为 78.0%，标准移植为 38.4%。Tregzi 拥有孤儿药和再生医学先进疗法认定，并在约三个月 PDUFA
              延期后获批，期间 FDA 要求补充制造数据。Tregzi 之外，管线包括二代候选 Orca-Q，目标是在没有完全匹配供者时发挥作用；以及更早期 OrCAR
              平台，覆盖白血病、淋巴瘤、多发性骨髓瘤和原发进展型多发性硬化等自身免疫适应症。
