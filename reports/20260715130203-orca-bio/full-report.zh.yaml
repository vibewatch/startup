        - 缺乏全匹配供者的患者
        - 1 期招募中；研究性
        - 设计覆盖匹配、7/8 错配和半相合场景
        - 安全性、有效性、最佳预防方案和注册路径
      - - SERENE-T
        - 使用 RIC 或 NMA 预处理的 AML/MDS 患者
        - Phase 2 招募中；研究阶段
        - 验证 Orca-T 能否走出已获批的清髓性边界
        - 入组速度、终点成熟度和标签扩展计划
      - - OrCAR 平台
        - 高危血液恶性肿瘤研究项目
        - 早期临床 / 会议阶段方向
        - 把精准移植物架构与异体 CAR-T 概念拼在一起
        - 项目优先级、制造整合和监管路径
