            body: >
              最大的分析风险是假精确。公开市场报告不只在预测上分歧，也在市场定义上分歧：Coherent Market Insights 报告 2026 年 $1.85B，Future Market Insights
              $3.2B，Mordor $3.32B，Emergen 对 2025 年慢性 GVHD 给出 $4.19B，Market Research Future 对 2025 年给出
              $23.07B。没有完整定义、地域和产品级收入输入，不能负责任地平均这些估计。美国异体移植手术量是更强的分母，但公开表格没有在一个最新切口中同时隔离所有批准标准——成人年龄、恶性肿瘤、匹配供者和清髓性预处理。公开资料也没有
              Tregzi
              特定支付方政策、净价、中心吞吐承诺或获批中心名单。因此，上市情景是敏感性分析，而不是预测。优先尽调应获取支付方政策和拒付率、中心合同和准入日期、初始站点符合条件病例数、制造档期产能，以及从转诊到输注的美国患者漏斗的独立校准。
