  - id: TV005
    title: 投资逻辑失效和止损触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 监管 / 质量
        - 重大 FDA 行动、患者错误事件或 Class I 召回
        - 抽掉可靠性前提，且可能让收入停摆
        - 在取得独立整改证明前，立即回避
      - - 制造良率
        - 商业化首过放行良率连续两个月低于 90%
        - 击穿产能、利润率和中心信心
        - 暂停投资，审计 CAPA
      - - 商业采用
        - 连续两个季度显著低于董事会放量计划
        - 推翻渗透率和固定成本吸收假设
        - 将基准情景重置为悲观情景，并要求更低价格
      - - 支付方经济性
        - 实际净价或回款持续低于董事会计划
        - 压缩收入倍数和现金转化
        - 重定入场价，并缩短现金跑道假设
      - - 流动性
        - 无已承诺融资时，下行情景现金跑道少于 12 个月
        - 带来被迫融资轮和优先权风险
        - 融资先交割，否则不投
      - - 资本结构
        - 内部轮 / 降轮低于当前优先权调整后入场价
        - 说明价格发现低于报道估值标记
        - 采用新一轮条款；不要锚定 $1.2B
    notes: 这些阈值是拟议投资人控制线；需要董事会计划和私有运营数据后才能衡量。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 优先级 / 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 1. 资本结构
        - Series F 条款清单、完全摊薄股权结构表、所有优先股权利和期权池
        - 决定优先权调整后入场价和稀释
        - CFO、律师和领投方数据室
      - - 2. 流动性
        - 现金、月度烧钱、受限现金、SVB 提款、契约和到期日
        - 决定下行情景现金跑道和被迫融资日期
        - CFO 资金台账和已签署授信
      - - 3. 商业队列
        - 按中心拆分的转诊、授权、订单、放行批次、输注、发票和回款
        - 检验采用率和收入质量
        - CCO 和财务队列导出
      - - 4. 总价到净价
        - 支付方合同、折扣、拒付、援助和 DSO
        - 将 WAC 转成实际经济性
        - 市场准入和收入会计文件
      - - 5. 制造经济性
        - 首过良率、偏差、每批 COGS、失败成本和场地吸收
        - 检验可扩展利润率和可靠性
        - COO、质量和成本会计审计
      - - 6. 管线 / 退出
        - Orca-Q 与扩展时间表、预算、概率，以及 IP/FTO 文件包
        - 支撑平台溢价和战略退出
        - CMO、R&D、IP 律师和董事会计划
    notes: 每项索取都是交割文件请求，用来填补已经识别的公开证据缺口，而不是泛泛的管理层访谈题。
