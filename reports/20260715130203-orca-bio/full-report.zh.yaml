  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：买方可以选择产品、方案或现状
        blocks:
          - type: paragraph
            body: >
              竞争集合必须按临床任务组织，而不是按宽泛的「细胞治疗」标签组织。Tregzi 是已审阅 FDA 批准产品中唯一一个用纯化 HSPC、调节性 T 细胞和常规 T 细胞改造匹配供者移植物、并在前置环节预防慢性
              GVHD 的产品。因此，直接商业产品对手很少。主要替代品是方案变化：未操作 allo-HSCT 使用 tacrolimus/methotrexate，或采用影响力越来越大的移植后 cyclophosphamide
              方案。PTCy 尤其强势，因为一项约 430 名患者的随机研究报告，一年无 GVHD、无复发生存率为 53%，tacrolimus/methotrexate 为
              35%；它使用医生熟悉的药物，也不需要购买定制移植物即可采用。Omisirge 是相邻的移植物产品，聚焦脐血植入和感染风险；Ryoncil、Jakafi、Rezurock 和 Niktimvo 在 GVHD
              已经发生后治疗。学术中心也可以把新的预防或移植物操作方案内化。Orca-Q 是防御性管线延伸，不是当前外部竞争者；Jasper 和 Vor 当前证据则降低了其曾被讨论的移植平台的近端威胁。
