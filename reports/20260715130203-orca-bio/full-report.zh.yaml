              采用证据在临床重复和商业部署之间分化明显。Orca 报告在临床项目中制造了超过 500 件患者专属产品，显示其反复执行全国范围从供者到患者的操作；但这些产品不是商业订单，不能视为活跃客户账户。关键
              Precision-T 项目涉及 19 家美国治疗中心和 187 名随机参与者，形成了有经验的上市种子集。商业层面，批准直到 2026 年 6 月 30 日才发生。独立上市报道称，Orca
              从「少数」治疗中心起步，预计后续数周接收首批订单，并计划到 2026 年底完成准入和生产爬坡至约 25 家中心。因此，已披露轨迹支持准备度，不支持已实现利用率。截至 7 月 15
              日，已审阅公开来源没有披露已激活中心数量、付费订单、已治疗商业患者、制造档期利用率、单站点订单数或支付方批准率。合适的漏斗标注应把这些阶段列为未知，而不是把临床队列换算成客户。早期集中度在结构上很高，因为小型初始网络要吸收培训、报销和物流。
