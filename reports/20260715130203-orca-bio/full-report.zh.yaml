      - number: '7.4'
        title: 财务和模型下行
        blocks:
          - type: paragraph
            body: >
              财务模型承受单产品上市集中度和大量固定成本吸收风险。$428,000 批发采购成本是折扣、拒付、中心经济性和回款时点之前的 上限，不是已实现净收入的证据。Orca 披露最近两轮合计 $250M 新股权和最高
              $100M 的 SVB 贷款，但这些披露均未给出 当前现金、已提债务、月度烧钱速度、营运资金、契约余量或商业毛利率。个性化制造、双站点验证、质量测试和时效性物流都可能在 通量或首检合格率低于计划时挤压利润率。慢性
              GVHD 无病生存上的临床价值有意义，但 1 年总体生存率为 93.9% 对 83.1%， P=.12，未达统计学显著。这不否定已获批终点；但会限制面向付款方和医生的生存溢价论证。净价、授权、已放行批次成本、
              回款和中心生产率队列可见之前，残余暴露仍高。
