  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 指示性股权价值区间
      - 基于 $1.2B 的总倍数
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观
        - 渗透率 25%–35%；净价和良率强；Orca-Q 或标签扩展；战略溢价
        - $4.0B–$7.0B
        - 稀释前 3.3x–5.8x
        - 尚无证据
        - 份额持续 >25%、利润率可扩展，并且扩展成功
      - - 基准
        - 渗透率 10%–20%；网络扩展至约 25 家中心以上；总价到净价中等；无重大 CMC 事件
        - $1.8B–$3.0B
        - 稀释前 1.5x–2.5x
        - 合理但未证实
        - 连续两个季度中心数、输注数和回款符合计划
      - - 悲观
        - 渗透率 <10%；支付方阻力；PTCy 偏好；良率或流动性压力；降轮
        - $0.3B–$0.8B
        - 稀释前 0.3x–0.7x
        - Gamida 先例让该情景概率不为零
        - 商业化不及预期、救援融资或重大 FDA 行动
      - - 当前估值标记
        - 二级市场报道的私营公司估值标记；资本结构细节未披露
        - $1.2B–$1.2B
        - 1.0x
        - 可观察，但未获一手确认
        - 条款清单和分配瀑布验证
    notes: 区间为以十亿美元计的情景估算，不是公司指引；回报不含未来稀释、优先权、税费和交易成本。
    claimRefs:
      - CV007
      - CV014
      - CV015
      - CV016
      - CV020
