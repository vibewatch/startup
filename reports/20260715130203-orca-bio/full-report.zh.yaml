      - number: '7.6'
        title: 缓解措施、监控和打破投资逻辑的标准
        blocks:
          - type: paragraph
            body: >
              监控计划应把宽泛风险转化为月度证据。质量方面，按站点要求首检放行合格率、每批偏差、规格外调查、身份异常、准时交付和监管观察项。
              商业化方面，跟踪已签约和已激活中心、付款方授权、已排产产品、成功输注、实际净价和现金回收。流动性方面，核对现金、烧钱速度、
              债务提款、借款基础、契约和承诺资本开支。人员方面，检查质量部门独立性、继任覆盖和关键岗位离职。打破投资逻辑的事件故意设得很重： 与商业制造有关的临床搁置或重大警告信；召回或患者身份失败；商业放行合格率持续低于
              90%；Princeton 未能在 Sacramento 产能或韧性变成约束前完成验证；或没有承诺融资且下行情景现金跑道不足 12 个月。较弱但仍重大的重估信号，是中心激活、付款方转化或
              回收净价连续两个季度显著低于董事会计划。这些阈值需要私有证据，并应成为交割条件。
