      - number: '8.5'
        title: 最终尽调要求和打破投资逻辑触发器
        blocks:
          - type: paragraph
            body: >
              最终决策应以证据为条件，直接把产品承诺转成股权价值。第一，把 Series F 条款清单、完全摊薄股权结构表、所有优先股权利和 SVB 协议，
              核对成新投资者可用资金。第二，逐一追踪每个商业患者从转诊到授权、批次放行、输注、开票和现金回收的全流程，包括实际净价和中心级生产率。 第三，审计 Sacramento 和 Princeton
              的商业首检合格率、偏差、单批 COGS、物流成本和站点吸收。第四，在基准和下行上市情景下重建现金跑道， 并把承诺现金与未提款债务分开。打破投资逻辑的事件包括：FDA 重大制造行动或患者身份事件；首检合格率持续低于
              90%；连续两个季度显著落后于 董事会采用率和净价计划；没有承诺融资且下行情景现金跑道不足 12 个月；或内部人融资低于当前按优先权调整后的入场价。通过这些关口会把结论推向买入；
              失败则应转向回避，而不是为摊低成本辩护。
