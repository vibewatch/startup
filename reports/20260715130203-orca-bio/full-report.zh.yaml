        title: 融资背景、入场纪律和潜在负担
        blocks:
          - type: paragraph
            body: >
              $1.2B 的 2026 年 1 月私营公司标记估值，是分析入场输入，不是经验证的成交清算价。同一二级市场来源称公司已融资 $625M、 估值 / 资本比 1.91x；公司及其法律顾问则确认最近两轮合计
              $250M 股权，以及修订后 SVB 贷款下最高 $100M。SEC 文件独立证明， 2020 年 Series D 出售 $191,999,870 优先股和与转换挂钩的普通股。公开证据未披露 Series F
              投后机制、新股与老股所得、 完全摊薄所有权、清算优先权、参与权、反稀释、期权池刷新、债务提款或现金。六轮融资让优先权和稀释负担有可能存在，但金额不能编造。 因此，入场纪律应由文件驱动：若按 $1.2B
              入场，必须要求优先顺位清晰、至少 24 个月下行情景流动性和商业证据；否则应寻求结构化或 更低估值入场。融资足以尝试上市，但公开数据无法证明这个报价在按优先权调整后的稀释后仍站得住。
