      - number: '2.4'
        title: 增长驱动、约束与采用节奏
        blocks:
          - type: paragraph
            body: >
              需求有几个支撑：美国每年超过一万例异体移植的稳定基数、更广的供者可及性，以及慢性 GVHD 的重大临床负担。Tregzi 的随机证据——一年无慢性 GVHD 生存 78.0%，对照 38.4%；中重度慢性
              GVHD 12.6%，对照 44.0%——提供了临床上容易理解的采用触发点，也支撑一个合理的下游成本抵消叙事。分析师报告还预测，细胞和基因治疗形态的增速将快于整体 GVHD
              市场。尽管如此，采用仍受一个强势低成本现有方案约束：基于移植后 cyclophosphamide 的预防方案已有随机证据，并正在改变实践。Tregzi 还要求完全匹配供者、清髓性预处理、中心资质，以及大约 72
              小时内交付新鲜产品。$428,000 前置价格相对于近期 $331,827 的移植期中位成本估计并不轻；因此即便临床医生接受疗效证据，支付方授权、单独报销和持久避免并发症的证明仍会决定采用节奏。
