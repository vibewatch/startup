              多件临床产品的证据。短板是产品收入集中、实际定价未验证、利用率不透明，也没有从总预订到现金毛利的公开桥梁。临床价值主张可能凭借更少慢性 GVHD 并发症支撑溢价定价，但一年总体生存差异没有统计显著性，FDA
              审评还要求额外制造数据。这些事实说明，即便获批后仍有支付方证据风险和执行风险。只有当中心吞吐、一次放行良率和物流密度提升，同时固定制造开销被吸收时，利润率机会才可信。资本看起来足以尝试上市，但尚不能证明足以达到盈亏平衡。达到投资级承保，需要月度现金报表、融资额度协议、患者层面
