      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Orca Bio 由 2016 年在 Stanford University 相识的三位联合创始人 Ivan Dimov、Nate Fernhoff 和 Jeroen Bekaert 发起。公司的科学根基来自
              Stanford 移植研究，相关脉络包括 Irving Weissman 实验室，以及 Robert Negrin、Judith Shizuru 等研究者。一项重要管理层变化是，联合创始人、前首席科学官 Nate
              Fernhoff 出任 CEO，接替创始 CEO Ivan Dimov；联合创始人、前首席运营官 Jeroen Bekaert 则出任总裁。高管团队纵深较足，且明显面向商业化：Scott
              McClellan（首席医疗官）负责临床开发，Mike Hirschmann（首席商务官，曾参与 Legend Biotech CAR-T 上市）负责商业化，Josh Murray（前 Goldman
              Sachs）负责财务和投资者关系，法务、工程、质量和人力也有职能负责人。董事会和顾问影响力集中在领投方和科学先驱手中，包括 Lightspeed Venture Partners 的 Jonathan
              MacQuitty 和 8VC 的 Alex Kolicich。公司刚在首个商业化发布前夜完成 CEO 交接，仍依赖科学创始人和 Stanford 授权平台；关键人风险因此是重要治理考量。
