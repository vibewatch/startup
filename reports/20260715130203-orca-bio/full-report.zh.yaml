  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变观点所需证据
    rows:
      - - 市场
        - 匹配供者 AML/MDS 移植池有实质规模，且 cGVHD 负担沉重
        - 符合条件人群窄，廉价 PTCy 替代方案压制渗透率
        - 按中心拆分的转诊、资格和份额数据
      - - 产品
        - 首个获批的 Treg 基疗法，一年 cGFS 为 78.0%
        - 总生存差异不显著，适应症标签仍窄
        - 长期 OS、真实世界 cGVHD 和扩展数据
      - - 客户
        - 专科中心渠道有限且可衡量
        - 中心激活不等于重复订单、支付方批准或回款
        - 按中心跟踪从转诊到现金回款的队列
      - - 财务
        - 良率和采用率放大后，$428,000 WAC 可带来经营杠杆
        - 净价、COGS、利润率、烧钱速度和现金跑道未披露
        - 患者级总价到净价，以及放行批次经济性
      - - 竞争
        - 精准移植物工程与药物预防和治疗拉开差异
        - PTCy 便宜且医生熟悉；其他细胞疗法争夺产能和资本
        - 正面对比的采用原因和流失病例日志
      - - 风险 / 资本
        - 近期融资足以支持一次扎实上市尝试
        - 优先股堆叠、债务条款和救援融资风险不透明
        - 完全摊薄分配瀑布和下行情景流动性模型
    notes: 本表把前几章的运营证据连接到估值专属的观点变化测试；不是把身份事实另作公司快照。
