              只有当购买标准被狭义定义为通过精准移植物组分来预防时，产品比较才偏向 Orca。Tregzi 有 187 名成人参与的随机 Phase 3 证据和获批的匹配供者适应症；Omisirge
              是烟酰胺修饰脐血移植物，用于加速中性粒细胞恢复并降低感染。Ryoncil 是现货型间充质基质细胞疗法，用于儿童类固醇难治性急性 GVHD；其公司报告 2026 财年净收入
              $115M，说明移植中心可以采用专科细胞产品，但不能证明其会需求预防性移植物工程。Jakafi、Rezurock 和 Niktimvo 的药品分销更简单，但它们是既往系统治疗后的下游慢性 GVHD
              治疗。Jasper 当前 briquilimab 项目瞄准肥大细胞疾病，公司在启动战略评估前仅报告 $14.1M 现金。Vor 结束了原 AML 细胞治疗业务，转向
