              Orca 的制造系统从动员后的供者外周血开始，样本由专人运输至 GMP 设施，纯化并配制成定义明确的细胞群。已审阅证据支持 Sacramento 的集中临床制造，以及一个旨在产线验证后扩展 East Coast
              产能的 Princeton 桥接点。关键论文报告，所有已治疗 Orca-T 产品均在供者单采后 72 小时内交付。标签进一步说明这是一条混合冷链：HSPC 和 Treg 袋以 2–8°C
              冷藏送达，必须迅速输注；Tcon 以低于 -125°C 冷冻保存运输，在第 +2 或 +3 天解冻、稀释，如非立即使用则需在四小时内输注。每一袋都对应特定患者；身份、有效期、完整性和 Certificate of
              Analysis 检查是临床控制，不是行政附加项。超过 500 件临床产品证明了重复执行，但没有披露商业一次通过良率。管理层预期个位数到低个位数失败率，仍是需要批次级验证的前瞻性说法。
