              情景估值采用商业阶段收入倍数框架，因为 Orca 已有获批产品，但未披露经常性收益或现金流。需求分母取此前市场工作中美国 AML 和 MDS 匹配供者异基因 HSCT 年机会 5,000–6,000 人的中点
              5,500 人。按 $428,000 WAC，5%、10%、15%、25% 和 35% 渗透率分别意味着约 $118M、$235M、$353M、$589M 和 $824M
              的总预订额敏感性，尚未扣除总额到净额折减。悲观情景下，若采用停滞、报销或制造失败且融资变得 惩罚性，Orca 估值为 $0.3B–$0.8B。基准情景下，若中心网络超过 2026 年底约 25 个目标，且
              Tregzi 以可接受良率达到中等渗透， 估值为 $1.8B–$3.0B。乐观情景下，若渗透率高、利润率可规模化、Orca-Q 或标签扩展成功，且战略买家支付平台溢价，估值为 $4.0B–$7.0B。
