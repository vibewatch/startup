  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和建议
        blocks:
          - type: paragraph
            body: >
              投资逻辑是：获批的首个监管性 T 细胞产品，可以把临床上重要的慢性移植物抗宿主病下降，转化为有壁垒的移植中心专科业务。 PRECISION-T 报告 1 年无慢性 GVHD 生存率 78.0% 对
              38.4%，产品 WAC 为 $428,000，集中的专科渠道也让商业进展可以通过 中心激活、输注和回款观察。反向逻辑同样关键：上市开始时未披露收入，初始标签很窄，移植后环磷酰胺是低价替代方案，商业制造尚未证明，
              且总体生存率 93.9% 对 83.1% 在 P=.12 下没有统计学显著性。Gamida Cell 说明，单靠批准无法保护异基因移植产品免于流动性困境。 在据报道 $1.2B 的标记估值下，建议因此是观察 /
              有条件持有，而不是买入。信心中等，风险高；在可重复的上市经济性出现前，估值偏高。 新投资应寻求 5–7 年至少 3.0x 的总价值，并避免在未核验净价、销量、毛利率和现金跑道前，以高于 $0.9B 的估值入场。
