  - id: TR005
    title: 风险缓释与叫停标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值或事件
      - 行动含义
    rows:
      - - 商业化质量
        - 放行合格率 / 关键偏差
        - 一次通过率连续两个月低于 90%，或关键偏差反复出现
        - 暂停增长假设；要求 CAPA 和已验证恢复
      - - 监管连续性
        - FDA 检查或正式行动
        - 临床暂停、重大警告信或威胁许可的检查意见
        - 补救证据出现前，投资逻辑破裂
      - - 患者安全
        - 身份、召回或严重意外安全事件
        - 任何患者错配事件或 I 类召回
        - 投资逻辑立即失效，并启动独立质量复核
      - - 场地韧性
        - Princeton 商业化验证
        - Sacramento 产能或恢复能力变成硬约束前仍未验证
        - 下调放量情景，要求备用场地计划
      - - 商业采用
        - 已激活中心和输注病例
        - 连续两个季度显著低于董事会计划
        - 重置收入爬坡和融资日期
      - - 支付方经济性
        - 授权、实际净价和回款
        - 相对董事会情景持续出现不利偏差
        - 下调总价到净价和利润率假设
      - - 流动性
        - 下行情景现金跑道和契约余量
        - 无已承诺融资时少于 12 个月
        - 不投资 / 以融资为条件
      - - 人员
        - 质量、制造或商业化关键岗位流失
        - 六个月内出现两名非计划关键人员离职
        - 要求继任和留任方案
    notes: 这些阈值是拟议投资人控制线，不是公司指引；正式采用前，需要管理层数据来确定准确基线以及相对董事会计划的偏差。
    claimRefs:
      - CR034
      - CR035
      - CR044
      - CR045
      - CR046
      - CR047
      - CR048
  - id: TV001
    title: 推荐结论汇总表
    columns:
      - 决策项
      - 当前判断
      - 证据依据
      - 上调条件
      - 下调条件
    rows:
      - - 投资建议
        - 观察 / 有条件持有
        - 产品已获批且差异化明确，但未披露商业队列
        - 连续两个季度验证可重复的放量、净价和放行批次毛利率
        - 上市放量重大不及预期，或融资条款惩罚性
      - - 置信度
        - 中
        - 临床与监管证据强，私营公司财务披露弱
        - 经审计的队列和股权结构表证据
        - 上市放量或资本结构数据相互冲突
      - - 风险评级
        - 高
        - 单一产品上市、制造、报销和融资暴露高
        - 验证两地可靠性和 >24 个月下行情景流动性
        - FDA 行动、召回或现金跑道 <12 个月
      - - 估值立场
        - $1.2B 估值偏高
        - 价格已经计入有意义的商业转化
        - 商业证据支撑基准情景轨迹
        - 降轮或优先权调整后价值低于入场价
      - - 目标回报 / 周期
        - 5–7 年至少 3.0x 总回报
        - 流动性差的私营生物技术公司需要 VC 式回报门槛
        - 可信的 $4B+ 退出，且稀释可控
        - 稀释后基准情景达不到目标
    notes: 这些判断是作者截至 2026-07-15 的价格敏感型承销观点，不是公司指引；据报道的 $1.2B 标记仍是二级证据。
