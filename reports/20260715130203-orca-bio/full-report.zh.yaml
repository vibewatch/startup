      - number: '6.5'
        title: 扩张、集中度和采购摩擦
        blocks:
          - type: paragraph
            body: >
              最初的落地-扩张动作是先激活中心，再在同一个 BMT 项目里增加合格病例，不是席位扩张，也不是经常性许可。 有 Precision-T 经验的中心可以缩短临床教育；Moffitt
              的转诊邀请则说明，合格中心能吸引区域患者。初始少数中心之外的扩张， 取决于培训、供者和生产档期协调、付款方授权以及稳定交付。Orca 称商业和政府项目都有报销路径，但 ASTCT 专门的 HCT
              覆盖和计费资源显示，福利筛查、合同、授权、编码和计费仍是真实运营工作。集中度风险很实在：早期量可能落在少数
              高通量学术项目里，头部中心收入占比未披露，账户选择还要和熟悉的移植方案竞争。供应地理也增加依赖，因为初期生产集中在 Sacramento；Princeton 工厂旨在缩短东部运输并增加未来产能。年底约 25
              个中心的目标扩大了触达，但仍只是目标， 不是多元化付费需求的证据。尽调应要求逐中心的漏斗、通量、付款方和取消数据。
