    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 常规工作流
      - Tregzi 工作流
      - 已测或预期收益
      - 限制 / 控制点
    rows:
      - - 选择移植方案
        - 选择匹配供者和未处理移植物预防方案
        - 确认匹配供者、成人适应证和清髓性资格
        - 已获批的预防导向移植物架构
        - 不覆盖半相合或 RIC/NMA 用法
      - - 准备患者
        - 预处理加常规预防给药安排
        - 收到产品前完成清髓性预处理
        - 让定义明确的移植物匹配获批人群
        - 预处理毒性仍在
      - - 第 0 天输注移植物
        - 输注未处理的 PBSC 移植物
        - 核验身份；不使用去白细胞滤器，先输注 HSPC，再输注 Treg
        - 将重建和耐受功能拆开
        - 两袋新鲜冷藏产品，失效时间管理严格
      - - 恢复常规免疫
        - 供者 T 细胞随原始移植物进入
        - 第 +2 或 +3 天解冻、稀释并输注 Tcon
        - 延迟回输支撑免疫和 GVL 活性
        - 深低温接收，解冻后窗口为四小时
      - - 预防并监测 GVHD
        - 关键试验对照组使用他克莫司加甲氨蝶呤
        - Tcon 输注后单用他克莫司，并持续监测
        - Precision-T 中一年 cGFS 为 78.0%，对照为 38.4%
        - GVHD 和移植物衰竭仍可能发生
      - - 闭合安全闭环
        - 机构移植监测
        - 监测恢复、感染、输注反应和恶性肿瘤；上报事件
        - 标签规定的药物警戒路径
        - 长周期负担仍压在中心身上
    notes: 该表比较关键试验对照流程与获批的 Tregzi 标签；不意味着它可与当前每一种 GVHD 预防方案直接对比。
