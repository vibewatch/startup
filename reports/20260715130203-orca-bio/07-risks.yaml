  claims:
    - { id: "CR001", statement: "Tregzi's approved use is limited to matched-donor hematopoietic transplantation with a myeloablative preparative regimen in eligible adults.", type: "observed", topic: "label-scope", sourceRefs: ["SR001", "SR002"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR002"] }
    - { id: "CR002", statement: "The Tregzi label warns that secondary malignancies and malignancies of donor origin may occur and requires monitoring.", type: "observed", topic: "post-market-safety", sourceRefs: ["SR003", "SR013"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR003", "QR005"] }
    - { id: "CR003", statement: "FDA extended Tregzi review after requesting additional CMC data, making manufacturing control a demonstrated regulatory sensitivity.", type: "third-party-reported", topic: "cmc", sourceRefs: ["SR015", "SR007"], confidence: "high", freshness: "recent", answersQuestionRefs: ["QR006"] }
    - { id: "CR004", statement: "Cell-therapy developers can face patent infringement exposure where statutory safe-harbor protection does not cover the challenged use or manufacturing method.", type: "third-party-reported", topic: "patent", sourceRefs: ["SR010", "SR035"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR009"] }
    - { id: "CR005", statement: "Cell-therapy center agreements must allocate product liability, malpractice, indemnification, insurance, handling and loss risks.", type: "third-party-reported", topic: "product-liability", sourceRefs: ["SR035", "SR003"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR010"] }
    - { id: "CR006", statement: "Cell-therapy enforcement cases show that substantial processing can place human cell products outside lighter same-surgical-procedure treatment.", type: "third-party-reported", topic: "enforcement", sourceRefs: ["SR009", "SR026"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR008"] }
    - { id: "CR007", statement: "Biological operations must control bloodborne occupational exposure and potentially infectious medical waste under federal and state regimes.", type: "inferred", topic: "ehs", sourceRefs: ["SR028", "SR029"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR011"] }
    - { id: "CR008", statement: "FDA may require a REMS when a specific serious risk needs additional prevention, monitoring or management beyond labeling.", type: "observed", topic: "rems", sourceRefs: ["SR004", "SR008"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR004"] }
    - { id: "CR009", statement: "Post-approval cell-therapy regulation can include ongoing safety evidence generation and updated risk controls.", type: "inferred", topic: "post-market-safety", sourceRefs: ["SR004", "SR008", "SR026"], confidence: "high", freshness: "current" }
    - { id: "CR010", statement: "Manufacturing-site or process changes can require potency and comparability evidence because living-cell critical attributes may shift.", type: "third-party-reported", topic: "comparability", sourceRefs: ["SR005", "SR032"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR007"] }
    - { id: "CR011", statement: "The label requires matching patient-specific identifiers and observing stated expiry times before infusion.", type: "observed", topic: "chain-of-identity", sourceRefs: ["SR003", "SR013"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR012"] }
    - { id: "CR012", statement: "Cell-therapy logistics failures include route delays, temperature or stability excursions, incorrect labels and broken custody handoffs.", type: "third-party-reported", topic: "logistics", sourceRefs: ["SR030", "SR031"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR013"] }
    - { id: "CR013", statement: "Sacramento remains the stated source of near-term commercial capacity, creating geographic concentration until alternate capacity is commercially validated.", type: "inferred", topic: "site-resilience", sourceRefs: ["SR012", "SR017"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR014"] }
    - { id: "CR014", statement: "Princeton was announced as a clinical-program bridge expected to support commercial production only after manufacturing-line validation.", type: "company-claimed", topic: "site-resilience", sourceRefs: ["SR012", "SR014"], confidence: "high", freshness: "recent", answersQuestionRefs: ["QR015"] }
    - { id: "CR015", statement: "A rejected or delayed patient-specific lot can remove revenue capacity while forcing treatment rescheduling and possible remanufacture.", type: "inferred", topic: "batch-failure", sourceRefs: ["SR003", "SR030", "SR031"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR016"] }
    - { id: "CR016", statement: "The current matched-donor label makes donor availability and timely collection gating conditions for treatment.", type: "inferred", topic: "donor-dependency", sourceRefs: ["SR002", "SR003", "SR021"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR017"] }
    - { id: "CR017", statement: "Transplant teams may test family members and search the NMDP Registry for unrelated donors or cord-blood units.", type: "observed", topic: "donor-registry", sourceRefs: ["SR021", "SR003"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR018"] }
    - { id: "CR018", statement: "Orca described launch at a handful of centers and a target of approximately 25 centers by year-end 2026.", type: "third-party-reported", topic: "center-concentration", sourceRefs: ["SR024", "SR025"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR019"] }
    - { id: "CR019", statement: "Silicon Valley Bank is the single publicly disclosed provider of Orca's amended credit facility.", type: "observed", topic: "capital-provider", sourceRefs: ["SR011", "SR014"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR020"] }
    - { id: "CR020", statement: "Tregzi's wholesale acquisition cost is $428,000 per one-time therapy.", type: "third-party-reported", topic: "pricing-risk", sourceRefs: ["SR024", "SR025"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR021"] }
    - { id: "CR021", statement: "Orca disclosed $250M of new equity across its two most recent rounds plus an SVB facility providing up to $100M of additional liquidity.", type: "company-claimed", topic: "financing", sourceRefs: ["SR011", "SR014"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR022"] }
    - { id: "CR022", statement: "Public disclosures do not provide current cash, monthly burn, debt drawn, covenant headroom or downside runway.", type: "observed", topic: "runway-gap", sourceRefs: ["SR011", "SR014"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR023"] }
    - { id: "CR023", statement: "One-year overall survival was 93.9% for Tregzi versus 83.1% for control with P=.12, so the difference was not statistically significant.", type: "observed", topic: "efficacy-perception", sourceRefs: ["SR016", "SR017"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR024"] }
    - { id: "CR024", statement: "The non-significant survival comparison limits use of a proven overall-survival advantage in payer and physician value arguments.", type: "inferred", topic: "efficacy-perception", sourceRefs: ["SR016", "SR017", "SR025"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR025"] }
    - { id: "CR025", statement: "A recall, wrong-patient event or material FDA manufacturing action could interrupt commercialization and center use.", type: "inferred", topic: "commercial-interruption", sourceRefs: ["SR003", "SR006", "SR015"], confidence: "high", freshness: "current", answersQuestionRefs: ["QR026"] }
    - { id: "CR026", statement: "Before validated alternate commercial capacity is demonstrated, a Sacramento outage remains a plausible single-point interruption.", type: "inferred", topic: "site-resilience", sourceRefs: ["SR012", "SR030"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR027"] }
    - { id: "CR027", statement: "Co-founder Nate Fernhoff is leading the first commercial launch after moving from chief scientific officer to chief executive officer.", type: "observed", topic: "leadership-transition", sourceRefs: ["SR013", "SR014"], confidence: "medium", freshness: "current", answersQuestionRefs: ["QR028"] }
    - { id: "CR028", statement: "Orca's commercial, manufacturing, quality and scientific functions must scale simultaneously during its first launch.", type: "inferred", topic: "execution", sourceRefs: ["SR012", "SR013", "SR024", "SR034"], confidence: "medium", freshness: "current" }
    - { id: "CR029", statement: "Life-sciences cyber risk includes data-integrity, system-availability and third-party-connectivity failures in digitized operations.", type: "third-party-reported", topic: "cybersecurity", sourceRefs: ["SR033", "SR034"], confidence: "medium", freshness: "current" }
    - { id: "CR030", statement: "A disruption at any donor, collection, manufacturing, logistics, center or payer handoff can reduce completed treatments.", type: "inferred", topic: "dependency-chain", sourceRefs: ["SR003", "SR021", "SR030", "SR035"], confidence: "medium", freshness: "current" }
    - { id: "CR031", statement: "The $428,000 list price does not establish realized net price, collected revenue or provider economics.", type: "inferred", topic: "pricing-risk", sourceRefs: ["SR023", "SR024", "SR025"], confidence: "medium", freshness: "current" }
    - { id: "CR032", statement: "Commercial gross margin remains unverified because released-lot cost, failure expense, discounts and collection timing are undisclosed.", type: "observed", topic: "margin-risk", sourceRefs: ["SR012", "SR024", "SR031"], confidence: "medium", freshness: "current" }
    - { id: "CR033", statement: "The public record does not establish Orca's succession coverage, quality-unit independence or critical-role attrition.", type: "observed", topic: "people-gap", sourceRefs: ["SR012", "SR013", "SR014"], confidence: "medium", freshness: "current" }
    - { id: "CR034", statement: "Commercial quality monitoring should include release yield, deviations, out-of-specification investigations, identity exceptions and on-time delivery by site.", type: "inferred", topic: "monitoring", sourceRefs: ["SR003", "SR006", "SR022", "SR032"], confidence: "medium", freshness: "current" }
    - { id: "CR035", statement: "Launch monitoring should reconcile activated centers, authorizations, released products, infusions, net price and collections.", type: "inferred", topic: "monitoring", sourceRefs: ["SR023", "SR024", "SR025", "SR035"], confidence: "medium", freshness: "current" }
