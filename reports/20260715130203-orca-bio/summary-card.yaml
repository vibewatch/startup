  topStrengths:
    - >-
      First and only FDA-approved regulatory T-cell-engineered allogeneic cell therapy (Tregzi), a genuine regulatory
      and scientific first-mover moat.
    - >-
      Robust pivotal PRECISION-T data: chronic GVHD-free survival hazard ratio of 0.26 with markedly lower
      moderate-to-severe cGVHD and non-relapse mortality versus standard of care.
    - >-
      Well-capitalized for launch with a $250M Lightspeed-led Series F plus a $100M credit facility, and a
      differentiated manufacturing platform with 500+ products produced.
  topRisks:
    - >-
      Pre-revenue at a ~$1.2B valuation with concentration in a single just-approved product and an unproven commercial
      ramp.
    - >-
      Narrow initial label (matched-donor, myeloablative) and a statistically non-significant overall-survival benefit
      that could constrain payer and physician uptake versus cheap standard prophylaxis (PTCy).
    - >-
      Capital-intensive, bespoke vein-to-vein manufacturing with cold-chain and single-geography dependencies that
      create scale-up, batch-failure, and reliability risk.
  unresolvedGaps:
    - >-
      Undisclosed current cash, monthly burn, and runway make capital adequacy and next-round timing impossible to
      verify.
    - >-
      No real-world commercial adoption, retention, or reimbursement evidence yet; center-onboarding pace and payer
      coverage are unproven.
    - >-
      Round-by-round valuations, primary-versus-secondary composition of the $1.2B mark, and
      liquidation-preference/dilution overhang are not public.
