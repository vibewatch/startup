slug: "orca-bio"
runDate: "2026-07-15"
company:
  name: "Orca Bio"
chapter:
  number: 4
  title: "Financials"
  summary: "Orca Bio enters launch with a transparent $428,000 one-time list price and substantial recently disclosed financing, but no public commercial revenue, cash, burn, runway, realized net price, or gross-margin data. The investable financial case therefore depends on converting a tightly controlled center rollout into reliable patient throughput while manufacturing and reimbursement complexity absorb capital."
sections:
  - id: "revenue-model-and-recognition"
    title: "Revenue model, pricing and recognition"
    body: >
      Orca Bio should be underwritten as pre-revenue on July 15, 2026: Tregzi was approved only on
      June 30, launch is beginning at a handful of transplant centers, and the reviewed public record
      contains no disclosed commercial sales. The current revenue model is concentrated in one
      patient-specific, one-time product with a $428,000 wholesale acquisition cost. That list price is
      not net revenue. Realized economics will depend on payer authorization, government and commercial
      reimbursement, center contracting, discounts, denials, returns or manufacturing failures, and the
      point at which control transfers for a product assembled from matched-donor cells. Public sources
      describe established reimbursement pathways but do not identify a Tregzi-specific net price,
      rebate schedule, billing code, NTAP award, or revenue-recognition policy. Pipeline programs can
      broaden the revenue base later, but they do not support current revenue. Revenue quality is thus
      initially transactional and concentrated rather than recurring: every recognized sale must be
      regenerated through another eligible patient, donor, manufacturing slot and qualified center.
    claimRefs: ["CI001", "CI002", "CI004", "CI005", "CI006", "CI007", "CI009", "CI010", "CI011", "CI012", "CI042", "CI046", "CI047"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "gtm-and-unit-economics"
    title: "GTM motion and sales-efficiency proxies"
    body: >
      The go-to-market motion is a concentrated institutional sale rather than a broad prescription
      launch. Orca is starting with a handful of transplant centers and targets approximately 25 by
      year-end 2026. Each account must coordinate patient eligibility, matched-donor collection,
      manufacturing-slot reservation, product delivery and inpatient administration, so center
      activation is a better early sales-efficiency proxy than conventional lead volume. Public
      evidence supports a high-touch, potentially long implementation cycle, but it does not disclose
      sales and marketing spend, customer-acquisition cost, time from first contact to first order,
      orders per activated center, conversion rates, payer approval time, receivable days, distributor
      fees or contribution margin. A simple gross-bookings sensitivity illustrates operating leverage:
      100 treatments at WAC would equal $42.8 million before discounts, failures, reimbursement friction
      and recognition timing. That is not a forecast. The decisive launch dashboard is therefore
      activated centers multiplied by eligible referrals, authorization conversion, scheduled products,
      successful infusions and collected net revenue.
    claimRefs: ["CI003", "CI008", "CI013", "CI014", "CI015", "CI016", "CI040", "CI041", "CI045", "CI047"]
    tableRefs: ["TI003"]
    figureRefs: ["FI002", "FI003"]
  - id: "cost-structure-and-margin"
    title: "Cost structure, working capital and margin path"
    body: >
      Tregzi carries the cost architecture of a personalized cell-therapy service wrapped inside a
      product sale. Orca must secure healthy-donor starting material, perform multi-component cell
      processing and quality release, coordinate specialized logistics, and deliver to a transplant
      center within an approximately 72-hour vein-to-vein target. The company reports more than 500
      products manufactured in clinical programs and expects a single-digit to low-single-digit failure
      rate, but neither metric establishes commercial yield, cost per released lot or gross margin.
      Fixed costs include two-site manufacturing readiness, quality systems, CMC staff, validation and
      commercial infrastructure; variable costs include donor logistics, labor, consumables, testing,
      transport and failed or rescheduled lots. Working capital may be unfavorable if manufacturing cash
      outlays precede payer collection, particularly where providers use buy-and-bill mechanics. Public
      capex, inventory, depreciation, service-delivery cost and gross-margin data are absent. The margin
      path depends on throughput and first-pass yield rising faster than staffing, facility and logistics
      costs without compromising release reliability.
    claimRefs: ["CI017", "CI018", "CI019", "CI020", "CI021", "CI023", "CI024", "CI025", "CI026", "CI043"]
    tableRefs: ["TI005"]
    figureRefs: ["FI004"]
  - id: "capital-adequacy"
    title: "Capital adequacy and financing dependency"
    body: >
      Company Overview contains the round-by-round funding chronology; the relevant financial lens here
      is whether disclosed resources can bridge launch to self-funding operations. In January 2026 Orca
      announced $250 million of new equity across its two most recent rounds, including a December 2025
      Series F, plus an amended Silicon Valley Bank facility providing up to $100 million of additional
      liquidity. Disclosed uses include commercial readiness, East Coast manufacturing capacity and
      pipeline advancement. The older SEC Form D provides a hard historical check: the 2020 offering
      reported $191,999,870 sold while declining to disclose revenue range. None of these figures reveals
      July cash on hand, facility draw, restricted cash, monthly burn, runway, covenants, interest,
      maturity or borrowing conditions. Management describes the company as well capitalized for launch,
      but that statement cannot be converted into runway without a starting cash balance and burn plan.
      The next-financing trigger is therefore operational: slower center activation, lower net price,
      delayed reimbursement or higher manufacturing spend could force capital before launch economics
      are proven.
    claimRefs: ["CI027", "CI028", "CI029", "CI030", "CI031", "CI032", "CI033", "CI034", "CI035", "CI036", "CI044"]
    tableRefs: ["TI004"]
  - id: "financial-verdict"
    title: "Financial verdict and diligence blockers"
    body: >
      The financial setup is asymmetric. Strengths are a known one-time WAC, a limited number of
      specialized accounts, recent equity funding, access to a sizeable credit facility and evidence
      that the manufacturing process has handled more than 500 clinical products. Weaknesses are
      concentrated product revenue, unproven realized pricing, opaque utilization and no public bridge
      from gross bookings to cash gross profit. The clinical value proposition may support premium
      pricing through fewer chronic-GVHD complications, but the one-year overall-survival difference
      was not statistically significant, and the FDA review required additional manufacturing data.
      Those facts raise payer-evidence and execution risk even after approval. The margin opportunity is
      credible only if center throughput, first-pass release yield and logistics density improve while
      fixed manufacturing overhead is absorbed. Capital appears sufficient to attempt launch, not
      demonstrably sufficient to reach breakeven. Investment-grade underwriting requires monthly cash
      statements, a facility agreement, patient-level gross-to-net and collection cohorts, center funnel
      data, commercial batch economics, capex commitments and downside runway scenarios.
    claimRefs: ["CI011", "CI024", "CI032", "CI033", "CI034", "CI037", "CI038", "CI039", "CI042", "CI043", "CI044", "CI045"]
