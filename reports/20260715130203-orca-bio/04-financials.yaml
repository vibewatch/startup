    claimRefs: ["CI001", "CI003", "CI045"]
  - calloutType: "risk"
    title: "Capital adequacy cannot be converted into runway"
    body: "Recent equity and credit capacity are material, but absent cash, burn, facility-draw and covenant data they do not establish months of runway or financing independence."
    claimRefs: ["CI027", "CI028", "CI032", "CI033", "CI034", "CI036", "CI044"]
