company:
  name: "Orca Bio"
chapter:
  number: 3
  title: "Competitors"
  summary: "Tregzi occupies a unique approved niche as a matched-donor, Treg-engineered graft for upfront chronic-GVHD prevention, but its hardest competitor is not another engineered graft: it is low-cost, protocol-native PTCy. Omisirge and Ryoncil validate commercial transplant-cell-therapy demand while addressing different jobs, and current evidence shows Jasper and Vor retreating from the once-expected engineered-HSC threat set."
sections:
  - id: "competitive-landscape"
    title: "Landscape: the buyer can choose a product, a protocol, or the status quo"
    body: >
      The competitive set must be organized by the clinical job rather than by the broad label “cell
      therapy.” Tregzi is the only reviewed FDA-approved product that engineers a matched-donor graft
      with purified HSPCs, regulatory T cells and conventional T cells to prevent chronic GVHD upfront.
      Its direct commercial-product peer set is therefore sparse. The principal substitute is protocol
      change: unmanipulated allo-HSCT using tacrolimus/methotrexate or the increasingly influential
      post-transplant cyclophosphamide regimen. PTCy is especially formidable because a roughly
      430-patient randomized study reported 53% one-year GVHD-free, relapse-free survival versus 35%
      with tacrolimus/methotrexate, uses familiar drugs and can be adopted without buying a bespoke
      graft. Omisirge is an adjacent graft product focused on cord-blood engraftment and infection risk;
      Ryoncil, Jakafi, Rezurock and Niktimvo treat GVHD after it exists. Academic centers can also
      internalize new prophylaxis or graft-manipulation protocols. Orca-Q is a defensive pipeline
      extension rather than a current external competitor, while current Jasper and Vor evidence
      reduces the near-term threat from their previously discussed transplant platforms.
    claimRefs: ["CP001", "CP002", "CP003", "CP006", "CP007", "CP009", "CP010", "CP014", "CP021", "CP022", "CP024", "CP026", "CP028"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "profiles-and-product-comparison"
    title: "Competitor profiles and capability boundaries"
    body: >
      Product comparisons favor Orca only when the buying criterion is defined narrowly as prevention
      through precision graft composition. Tregzi has randomized Phase 3 evidence in 187 adults and an
      approved matched-donor indication, while Omisirge is a nicotinamide-modified cord-blood graft
      intended to accelerate neutrophil recovery and reduce infection. Ryoncil is an off-the-shelf
      mesenchymal stromal-cell treatment for pediatric steroid-refractory acute GVHD; its company
      reported $115 million of fiscal-2026 net revenue, demonstrating that transplant centers can adopt
      a specialized cellular product, but not proving demand for prophylactic graft engineering.
      Jakafi, Rezurock and Niktimvo have simpler drug distribution but are downstream chronic-GVHD
      treatments after prior systemic therapy. Jasper’s current briquilimab program targets mast-cell
      diseases, and the company reported only $14.1 million cash before initiating a strategic review.
      Vor wound down its former AML cell-therapy operations and pivoted to telitacicept. These reversals
      are favorable for near-term competitive intensity but adverse evidence about the financing and
      execution fragility of novel cell-therapy platforms.
    claimRefs: ["CP004", "CP010", "CP011", "CP012", "CP014", "CP015", "CP016", "CP018", "CP019", "CP020", "CP022", "CP023", "CP024", "CP025", "CP029", "CP030", "CP044"]
    tableRefs: ["TP002"]
    figureRefs: ["FP002"]
  - id: "pricing-distribution-and-switching"
    title: "Pricing, distribution power, switching cost and multi-homing"
    body: >
      Tregzi’s $428,000 wholesale acquisition cost is transparent; most alternatives are not comparable
      on a single unit. PTCy and tacrolimus/methotrexate use generic medicines embedded in the transplant
      episode, while downstream drugs recur until discontinuation and Ryoncil is weight-based across at
      least eight infusions. One payer-oriented source estimates $1.55 million for Ryoncil’s initial
      eight-infusion course, but an exact Omisirge WAC and current drug net prices were not confirmed in
      the readable reviewed sources. Operational switching is asymmetric. A center can multi-home by
      assigning different eligible patients to Tregzi, PTCy, Omisirge or standard grafts, so there is no
      technical account-level exclusivity. However, adopting Tregzi requires qualification, donor-cell
      coordination, manufacturing-slot reservation and reliable fresh-product delivery within about
      72 hours. That creates workflow-specific switching cost and gives high-volume transplant centers
      distribution leverage. Omisirge’s planned U.S. manufacturing partnership and Ryoncil’s broad
      pediatric-center uptake show that partner capacity and center access—not just patents—can determine
      commercial reach.
    claimRefs: ["CP005", "CP013", "CP015", "CP017", "CP018", "CP019", "CP020", "CP031", "CP032", "CP033", "CP034", "CP035"]
    tableRefs: ["TP003"]
  - id: "moat-durability-and-risk"
    title: "Moat durability, displacement paths and adverse evidence"
    body: >
      Orca’s strongest moat is the combined regulatory, clinical and process package: the first approved
      Treg-engineered graft, a randomized trial with 78.0% versus 38.4% one-year chronic-GVHD-free
      survival, and accumulated manufacturing know-how for a three-component personalized product.
      That moat is meaningful but not absolute. The pivotal control was tacrolimus/methotrexate, not
      PTCy, so the commercial argument lacks a randomized head-to-head answer against the regimen most
      likely to displace the old standard. The label also requires a matched donor and myeloablative
      preparation; Orca-Q remains recruiting in Phase 1 and cannot yet neutralize that boundary. Process
      complexity can defend against entrants while simultaneously constraining Orca: approval followed
      an FDA request for additional manufacturing data, and the fresh product must arrive on a tight
      timetable. Commoditization risk comes from protocol innovation that narrows the outcome gap without
      bespoke manufacturing. Entrant risk is more likely to arrive through acquisition or partnership
      than a greenfield launch, as the Jasper strategic review and Vor pivot illustrate. Priority
      diligence is therefore PTCy-comparative outcomes, activated-center throughput, manufacturing
      success, net pricing and evidence that avoided chronic-GVHD costs persist beyond year one.
    claimRefs: ["CP004", "CP026", "CP027", "CP036", "CP037", "CP038", "CP039", "CP040", "CP041", "CP042", "CP043"]
    tableRefs: ["TP004"]
    figureRefs: ["FP003"]
