callouts:
  - calloutType: "strength"
    title: "The direct-product white space is real"
    body: "No reviewed approved product combines a matched-donor graft, purified Tregs and an upfront chronic-GVHD-prevention indication; adjacent cell therapies solve engraftment or rescue-treatment jobs."
    claimRefs: ["CP001", "CP003", "CP012", "CP014"]
  - calloutType: "risk"
    title: "PTCy is the economic and clinical benchmark"
    body: "PTCy has randomized evidence, comparatively low cost and protocol-native distribution, while Tregzi's pivotal control was Tac/MTX rather than PTCy."
    claimRefs: ["CP007", "CP009", "CP041", "CP043"]
  - calloutType: "insight"
    title: "Competitor retreats validate both moat and fragility"
    body: "Jasper's funding-dependent strategic review and Vor's exit from AML cell therapy reduce near-term pipeline pressure but show how capital and manufacturing can defeat technically credible entrants."
    claimRefs: ["CP023", "CP024", "CP025", "CP038"]
