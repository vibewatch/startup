company:
  name: "Orca Bio"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Orca Bio (legal entity Orca Biosystems, Inc.), a Menlo Park, CA cell-therapy company founded in 2016 out of Stanford, won FDA approval on 30 June 2026 for Tregzi (Orca-T), the first regulatory T-cell-based immunotherapy for allogeneic transplant in adults with blood cancers. It is backed by ~$625M raised through a December 2025 Series F led by Lightspeed and is valued at ~$1.2B."
sections:
  - id: "identity-and-mission"
    title: "Identity, mission and business model"
    body: >
      Orca Bio is a Menlo Park, California biotechnology company that develops high-precision
      allogeneic (donor-derived) T-cell immunotherapies for blood cancers and, increasingly,
      autoimmune disease. The company was founded in 2016 by a Stanford-affiliated team and
      operates commercially through its legal entity, Orca Biosystems, Inc., which is the holder
      of record for its first FDA approval. Its lead product, Tregzi (development name Orca-T),
      is a donor-derived cellular immunotherapy composed of three sequentially administered
      components — purified hematopoietic stem and progenitor cells, regulatory T cells, and
      conventional T cells — engineered to reconstitute a patient's blood and immune system while
      sharply reducing chronic graft-versus-host disease. The business model is that of a
      commercial-stage, single-product cell-therapy company: Orca manufactures a personalized,
      one-time therapy for each patient at company-owned GMP facilities and sells it to transplant
      centers at a wholesale acquisition cost of $428,000. Revenue is expected to begin in the
      second half of 2026 as first orders are taken. The company frames its mission as delivering
      the promise of cell therapy "without compromise," meaning cure without the debilitating
      trade-offs historically associated with allogeneic transplantation.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO039"]
    figureRefs: ["FO002"]
  - id: "leadership-and-governance"
    title: "Founders, leadership and governance"
    body: >
      Orca Bio was launched in 2016 by three co-founders who met at Stanford University: Ivan
      Dimov, Nate Fernhoff and Jeroen Bekaert. The company's scientific foundation draws on
      Stanford transplantation research associated with the Irving Weissman laboratory and
      investigators including Robert Negrin and Judith Shizuru. In a material leadership change,
      co-founder and former Chief Scientific Officer Nate Fernhoff was appointed Chief Executive
      Officer, succeeding founding CEO Ivan Dimov, while co-founder and former Chief Operating
      Officer Jeroen Bekaert became President. The executive bench is deep and commercialization-
      oriented: Scott McClellan (Chief Medical Officer) leads clinical development, Mike Hirschmann
      (Chief Commercial Officer, ex-Legend Biotech CAR-T launch) leads commercial, Josh Murray
      (ex-Goldman Sachs) leads finance and investor relations, and functional heads cover legal,
      engineering, quality and people. Board and advisor influence is concentrated among lead
      investors and scientific pioneers, including Jonathan MacQuitty of Lightspeed Venture
      Partners and Alex Kolicich of 8VC. Key-person dependence on the scientific founders and on
      the Stanford-licensed platform is a notable governance consideration for a company that has
      just transitioned its CEO on the eve of its first commercial launch.
    claimRefs: ["CO006", "CO007", "CO008", "CO009", "CO010", "CO011", "CO040"]
    tableRefs: ["TO002"]
  - id: "funding-and-capitalization"
    title: "Funding history and capitalization"
    body: >
      Orca Bio has raised approximately $625 million in equity since its 2016 launch, complemented
      by debt capacity. The company emerged from stealth in June 2020 with a $192 million Series D
      co-led by Lightspeed Venture Partners, bringing cumulative capital to nearly $300 million at
      that time, with participation from 8VC, DCVC Bio, ND Capital, Mubadala Investment Company,
      Kaiser Foundation Hospitals, Kaiser Permanente Group Trust and IMRF. In December 2025 it
      completed a Series F led by Lightspeed; together with its prior round the company announced
      $250 million in new equity capital, plus up to $100 million of additional liquidity from a
      2025 amendment to its Silicon Valley Bank credit facility. Secondary-market and private-
      company data providers place Orca Bio's valuation at roughly $1.2 billion as of January 2026,
      giving it unicorn status and an implied capital-efficiency ratio of about 1.9x total funding.
      Because Orca Bio is private and does not publish audited financials, exact round-by-round
      valuations, the primary-versus-secondary composition of the $1.2B mark, current cash balance,
      and burn rate are not publicly disclosed and must be treated as estimates.
    claimRefs: ["CO012", "CO013", "CO014", "CO015", "CO016", "CO017", "CO018", "CO041"]
    tableRefs: ["TO003"]
  - id: "product-and-regulatory-status"
    title: "Product and regulatory status"
    body: >
      Orca Bio's identity now centers on its first approved product. On 30 June 2026 the FDA
      approved Tregzi (Orca-T) for use in matched-donor hematopoietic stem cell transplantation
      with a myeloablative preparative regimen, to improve chronic graft-versus-host-disease-free
      survival in adults with hematologic malignancies — the first regulatory T-cell-based
      immunotherapy ever approved for this setting. Approval was granted to Orca Biosystems, Inc.
      and rested on the randomized, controlled Phase 3 PRECISION-T trial (NCT05316701) in 187
      adults, which met its primary endpoint with a chronic GVHD-free survival hazard ratio of 0.26
      and one-year rates of 78.0% versus 38.4% for standard transplant. Tregzi carries Orphan Drug
      and Regenerative Medicine Advanced Therapy designations and reached approval after a roughly
      three-month PDUFA extension during which the FDA requested additional manufacturing data.
      Beyond Tregzi, the pipeline includes Orca-Q, a second-generation candidate designed to work
      without a fully matched donor, and an earlier-stage OrCAR platform, spanning leukemia,
      lymphoma, multiple myeloma and autoimmune indications such as primary progressive multiple
      sclerosis.
    claimRefs: ["CO019", "CO020", "CO021", "CO022", "CO023", "CO024", "CO025", "CO042"]
  - id: "milestones-and-trajectory"
    title: "Milestones and trajectory"
    body: >
      Orca Bio's trajectory is a decade-long march from a Stanford spin-out to a commercial cell-
      therapy company. Founded in 2016, it built centralized GMP manufacturing in California, treated
      its first patients with Orca-T and later Orca-Q, and secured RMAT designation from the FDA.
      In 2022 it broke ground on a state-of-the-art commercial manufacturing facility in Sacramento,
      California, and progressively presented positive data — including in elderly patients — at the
      American Society of Hematology annual meetings. Pivotal Phase 3 PRECISION-T data were presented
      at the EBMT annual meeting in 2025 and published in the journal Blood in March 2026. Regulatory
      momentum followed: FDA accepted the Biologics License Application for Priority Review with an
      April 6, 2026 PDUFA target, the company completed its Series F, transitioned its CEO, added an
      East Coast (Princeton, New Jersey) manufacturing site and tripled its West Coast manufacturing
      workforce, and finally won FDA approval on 30 June 2026. Along the way Orca reports treating its
      500th patient and producing more than 500 cell-therapy products across its clinical programs.
    claimRefs: ["CO026", "CO027", "CO028", "CO029", "CO030", "CO031", "CO032", "CO043"]
    tableRefs: ["TO004"]
    figureRefs: ["FO001"]
  - id: "snapshot-and-key-metrics"
    title: "Snapshot and key metrics"
    body: >
      As a snapshot, Orca Bio is a newly commercial, venture-backed cell-therapy company with one
      approved product, a differentiated but capital-intensive manufacturing model, and a valuation
      that already implies substantial future commercial success. The verifiable cover metrics are
      a ~$1.2 billion valuation, ~$625 million total raised, a $428,000 wholesale price for Tregzi,
      more than 500 patients treated across clinical programs, and a planned expansion to roughly 25
      treatment centers by year-end 2026. Metrics that remain unavailable for a private company —
      revenue run-rate, gross margin, headcount and precise cash runway — are flagged as gaps with
      concrete diligence paths rather than estimated. The investability picture is one of strong
      clinical validation and a first-mover regulatory position offset by single-product
      concentration, an unproven commercial ramp, manufacturing and logistics complexity (a 72-hour
      vein-to-vein window), and reimbursement uncertainty for a high-priced one-time therapy. These
      metrics and their confidence levels anchor the analysis carried forward into later chapters.
    claimRefs: ["CO033", "CO034", "CO035", "CO036", "CO037", "CO038", "CO044"]
    tableRefs: ["TO001"]
    figureRefs: ["FO003"]
