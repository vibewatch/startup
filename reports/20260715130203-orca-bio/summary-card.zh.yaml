  topStrengths:
    - 首个且唯一获 FDA 批准、用调节性 T 细胞工程化的异体细胞疗法 Tregzi，在监管和科学上都是真正的先发护城河。
    - PRECISION-T 关键数据扎实：无慢性 GVHD 生存风险比为 0.26，中重度 cGVHD 和非复发死亡率显著低于标准治疗。
    - 上市启动资金充足：Lightspeed 领投的 $250M Series F 轮加上 $100M 信贷额度；制造平台也有差异化，已生产 500+ 个产品。
  topRisks:
    - 公司仍无营收，却对应约 $1.2B 估值；价值集中在一个刚获批产品上，商业爬坡还没被验证。
    - 首发标签狭窄（匹配供者、清髓预处理），总生存获益在统计上不显著；相较便宜的标准预防方案 PTCy，支付方和医生采用可能受限。
    - 资本开支重、定制化 vein-to-vein 制造，叠加冷链和单一地域依赖，放大扩产、批次失败和可靠性风险。
  unresolvedGaps:
    - 当前现金、月度烧钱速度和现金跑道均未披露，无法核验资本充足性和下一轮融资时点。
    - 尚无真实世界商业采用、留存或报销证据；中心接入速度和支付方覆盖都未验证。
    - 逐轮估值、$1.2B 估值中新股与老股交易构成，以及清算优先权 / 稀释压力均未公开。
