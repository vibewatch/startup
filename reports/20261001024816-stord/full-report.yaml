      - number: '6.3'
        title: Named Customer Deployments and Case Proof
        blocks:
          - type: paragraph
            body: >-
              Customer proof points demonstrate verifiable commercial adoption across prominent direct-to-consumer
              consumer brands that rely on Stord for mission-critical order fulfillment and carrier logistics. Reference
              accounts such as goodr, Native, True Classic, and Sundays for Dogs operate at scaled production volumes,
              deploying Stord's warehouse management systems and regional fulfillment hubs to support rapid retail and
              e-commerce distribution. Executive testimonials from these deployments emphasize measurable operational
              benefits, including 99.9% order fulfillment accuracy, enhanced delivery predictability, and unified
              cross-channel inventory visibility across e-commerce and wholesale channels. Despite strong brand
              referenceability, public case studies operate as a selective sample and consistently omit contract
              duration, minimum volume commitments, and customer gross margins. Independent diligence requires auditing
              enterprise contract service level agreements (SLAs) and inventory loss clauses, such as Stord's standard
              0.5% shrinkage allowance and $0.50 per pound liability limitation.
            claimRefs:
