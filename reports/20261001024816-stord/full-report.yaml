      - number: '7.3'
        title: Partner Network Dependencies, Pricing Resistance, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >
              Stord's commercial structure relies on two major external dependencies: third-party partner fulfillment
              centers and integrated parcel carriers. To prevent disintermediation, Section 19 of Stord's Warehouse
              Terms binds merchants to a strict non-circumvention covenant for the contract term plus one year
              post-termination, prohibiting direct solicitation of any Stord Partner Network facility. On pricing,
              independent evaluations by RFP.wiki and EvolveAMZ observe that Stord does not publish list pricing,
              instead utilizing custom quotes with recurring platform fees frequently starting around $30,000 annually
              alongside variable storage, pick-pack ($2.10 to $3.50 per order), and shipping surcharges. This high
              platform fee structure creates significant customer adoption friction for small and mid-market merchants
              generating under $10 million in revenue, limiting Stord's addressable client base primarily to high-volume
              enterprise brands. Financially, Stord doubled its valuation to $3 billion in its May 2026 Series F funding
              round, bringing total funding to over $775 million. Industry observers such as logistics analyst Eric Pong
              caution that Stord's rapid M&A strategy—completing eight acquisitions in six years including Ware2Go,
              Penny Black, and Shipwire—adds operational complexity and integration risk, warning that valuation
              compression could occur if growth decelerates and public markets price Stord as an asset-heavy logistics
              operator rather than a pure software platform.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
