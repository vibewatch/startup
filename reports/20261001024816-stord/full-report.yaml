      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While Stord's commercial expansion exhibits significant momentum, retention durability and expansion
              dynamics present notable diligence risks that warrant investor scrutiny. The company's land-and-expand
              motion typically originates through single-node parcel rate optimization before expanding into
              multi-facility warehousing, order management systems, and conversational AI analytics. However,
              third-party software evaluation directories and user reviews reflect mixed satisfaction signals: Stord
              holds a 4.0 out of 5.0 composite rating across 37 public reviews, with users praising real-time inventory
              visibility but highlighting lower customer support subscores on G2. Furthermore, smaller merchants cite
              opaque custom pricing and elevated platform fee floors as friction points during implementation. Logistics
              industry analysts also caution that rapid growth achieved through eight historical business acquisitions
              introduces customer integration friction, software homogenization hurdles, and operational retention risks
              that could compress software valuation multiples if customer churn accelerates.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Omnichannel Consumer Delivery vs Platform Independence
            body: >-
              Stord's core value proposition to high-growth consumer brands centers on delivering Amazon
              Prime-equivalent fulfillment velocity and 99% 1-2 day ground delivery coverage while allowing merchants to
              retain complete ownership of their direct consumer relationship, customer data, and checkout branding.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: callout
            title: 'Customer Diligence: Pricing Opacity and Support Divergence'
            body: >-
              Third-party directory evaluations and user reviews highlight that custom project-based pricing, high
              platform fee thresholds, and uneven customer support subscores create friction for mid-market shippers,
              warranting direct customer reference audits during investment underwriting.
            calloutType: risk
            claimRefs:
