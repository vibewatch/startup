    title: Stord Multi-Layer Platform and Technology Stack
    type: stack
    summary: Structural view of Stord's software architecture, concurrency layer, and physical logistics infrastructure.
    data:
      layers:
        - label: Engagement Layer
          detail: >-
            Omnichannel checkout delivery promises, branded order tracking, returns management, and conversational Chat
            assistant.
        - label: Orchestration & Workflow Layer
          detail: >-
            Distributed Order Management System (OMS) automating inventory allocation, order routing rules, and parcel
            rate shopping.
        - label: High-Concurrency Service Layer
          detail: >-
            Elixir and Phoenix backend microservices running on Erlang OTP supervision trees for fault-tolerant state
            orchestration.
        - label: Data Streaming & Integration Bus
          detail: Apache Kafka event pipeline handling order updates, inventory changes, and external carrier status webhooks.
        - label: Data Persistence & Transaction Engine
          detail: PostgreSQL databases maintaining relational item masters, billing ledgers, and transaction histories on GCP.
        - label: Physical Automation & Intelligence (Stord Labs)
          detail: >-
            10,000 sq ft physical lab testing autonomous mobile robots, computer vision, and dynamic pick-path
            algorithms.
        - label: Hybrid Fulfillment Execution Network
          detail: >-
            ~20 company-operated fulfillment nodes and ~80 certified partner warehouses delivering 99% 1-2 day ground
            coverage.
    approximationNotes: >-
      Layer partitioning synthesized from official engineering job disclosures, platform architecture documents, and
