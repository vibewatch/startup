  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Case
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - 'Thesis: Software Orchestration'
        - >-
          Vertically integrated OMS/WMS and AI layers turn commodity fulfillment into a sticky enterprise software
          platform.
        - Powers $10B-$15B GMV across 1,000+ brands; software bookings doubled QoQ in Q1 2026.
        - Deceleration in software bookings or high customer churn upon contract renewal.
      - - 'Thesis: Physical Intelligence Moat'
        - >-
          Proprietary order data across ~100 facilities trains real-time AI and robotics that asset-light software
          cannot replicate.
        - Stord Labs testing physical intelligence models on live production orders.
        - Inability to demonstrate unit cost reduction or throughput gains from robotics deployments.
      - - 'Anti-Thesis: Valuation Arbitrage Risk'
        - >-
          Serial M&A adds top-line revenue but masks underlying organic growth and introduces severe operational
          integration friction.
        - Six acquisitions completed since 2021 including Ware2Go, Penny Black, and Shipwire.
        - Verified organic same-facility volume growth exceeding 30% alongside stable customer cohorts.
      - - 'Anti-Thesis: Multiple Compression'
        - >-
          Trading at 20.4x revenue while public logistics comps trade at 1.7x-2.5x leaves equity vulnerable to a severe
          down-round or flat IPO.
        - Eric Pong critique and public comparables (Delhivery at 2.5x, EquipmentShare at 1.7x).
        - Evidence that software gross margins exceed 70% and represent over half of net revenue.
    notes: Core arguments synthesize verified Series F investment themes against independent logistics market critiques.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation & Exit Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Software ARR exceeds $100M (>50% of revenue); Stord Labs AI drives gross margin to 45%+; organic growth >40%.
        - $5.0B-$6.0B IPO valuation at 12x-15x forward revenue; 1.7x-2.0x MOIC for Series F investors.
        - Execution failure in robotics automation; competitive price war with Amazon Buy with Prime.
        - 25% (requires flawless software transition)
      - - Base Case
        - Revenue reaches $250M with 25%-30% blended gross margin; software remains 25%-30% of revenue mix.
        - $3.0B-$3.5B exit via IPO or strategic acquisition at 10x-12x blended multiple; 1.0x-1.2x MOIC.
        - Margin compression from physical facility leases and transportation freight cost volatility.
        - 50% (most consistent with current multi-node network reality)
      - - Bear Case
        - Organic growth stalls below 15%; acquisition integration issues emerge; business re-rated as traditional 3PL.
        - $1.2B-$1.5B down-round or distressed consolidation at 3x-4x revenue multiple; 50%+ capital loss.
        - Debt covenant triggers on $120M facility; enterprise customer churn; warehouse liability claims.
        - 25% (elevated by 20.4x entry multiple and logistics macro cyclicality)
    notes: Return projections model Series F entry at $3.0B post-money against historical logistics tech valuation cycles.
    claimRefs:
      - CV001
