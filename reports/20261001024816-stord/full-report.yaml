      - number: '4.2'
        title: Go-To-Market Motion, Network Economics, and Unit Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The commercial go-to-market engine relies on landing high-growth direct-to-consumer and mid-market
              omnichannel brands seeking nationwide two-day ground coverage without building dedicated supply chain
              infrastructure. Stord deploys a hybrid network comprising approximately 20 company-operated fulfillment
              nodes and 80 partner facilities running its proprietary operating system, allowing it to fulfill orders
              across 100 warehouse locations without incurring total real estate lease liability. Gross margins remain
              heavily sensitive to facility labor utilization, parcel carrier discounts, freight rate volatility, and
              accessorial recovery rates. While physical fulfillment generates tight gross margins typical of contract
              logistics providers, proprietary routing software and AI-driven carrier rate optimization deliver
              documented shipping savings up to 10% per parcel package, enabling Stord to capture an operational margin
              spread. Diligence requires scrutinizing whether revenue expansion reflects durable organic customer
              retention or whether top-line acceleration is predominantly driven by roll-up volume from eight historical
              acquisitions.
            claimRefs:
