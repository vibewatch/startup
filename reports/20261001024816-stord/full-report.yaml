      - number: '7.2'
        title: Operational Execution, Multi-Facility Consistency, and Software Maturity
        blocks:
          - type: paragraph
            body: >
              Stord operates a hybrid logistics architecture spanning approximately 20 owned facilities and roughly 80
              partner warehouses, creating operational consistency challenges across disparate operating environments.
              Independent industry reviews and competitive evaluations highlight that while Stord achieves 99.9%
              fulfillment accuracy and 99.5% 1-to-2 day ground coverage across its network, public review volume remains
              thin relative to its reported revenue scale, making broad client sentiment difficult to validate
              statistically. Independent analyses note that Stord's customer support responsiveness at standard tiers
              remains a frequent driver of negative reviews, while user feedback cites long timelines for non-core
              feature requests and software immaturity in edge cases. Furthermore, third-party commentary emphasizes
              that rapid expansion and employee turnover from past integration growing pains pose risks to operational
              consistency across newly onboarded warehouse nodes. Stord has deployed its StordAI suite—including Chat,
              Search, and Feed—to mitigate data fragmentation, but full network orchestration across 100 facilities
              requires continuous engineering investment to avoid warehouse execution bottlenecks.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
