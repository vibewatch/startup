              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Financing Context, Valuation Multiples, and Comparable Analysis
        blocks:
          - type: paragraph
            body: >-
              Stord's financing history reflects a successful transition through multiple venture capital market cycles,
              culminating in its May 2026 Series F round. Founded in 2015, the company achieved unicorn status in
              September 2021 with a $90 million Series D at a $1.1 billion valuation, extended in 2022 to $1.3 billion,
              and raised more than $200 million in equity and debt at a $1.5 billion valuation in May 2025. Across its
              lifetime, Stord has secured approximately $775 million to $777 million in aggregate funding, including a
              $120 million growth debt facility provided jointly by Silicon Valley Bank and ORIX USA. This substantial
              capital base has funded an aggressive acquisition strategy, absorbing six companies including Ware2Go from
              UPS, Penny Black, and Shipwire from Ceva Logistics to rapidly assemble physical warehouse capacity.


              The critical analytical challenge lies in the multiple expansion implied by the Series F transaction.
              Multiples.vc benchmarks Stord's revenue at $147 million as of May 2026, implying an enterprise revenue
              multiple of 20.4x. This reflects significant multiple expansion from 11.3x at Series D and 15.0x at Series
              E. When benchmarked against public and private supply chain comparables, Stord's multiple stands at a
              dramatic premium. Publicly listed logistics operators such as Delhivery trade at 2.5x revenue and
              EquipmentShare trades at 1.7x revenue, while tech-enabled fleet platform Motive commands 6.1x. Only
              specialized software providers like Peregrine.ai command higher multiples. While venture capital observers
              note that durable logistics infrastructure can command premium marks when growth holds, pricing Stord at
              20.4x revenue exposes equity holders to severe multiple compression if growth moderates.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV013
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Stord across bull, base, and bear operating scenarios underscores the asymmetric risk profile
              embedded in its current entry valuation. In the bull case (25 percent probability), Stord successfully
              scales software subscriptions to represent over 50 percent of total revenue, driving gross margins above
              45 percent and unlocking an eventual public listing at $5.0 billion to $6.0 billion (1.7x to 2.0x MOIC).
              In the base case (50 percent probability), Stord continues steady execution, reaching $250 million in
              run-rate revenue while blended gross margins remain constrained at 25 to 30 percent, generating an exit
              valuation between $3.0 billion and $3.5 billion that merely protects capital for Series F entrants.


              The bear case (25 percent probability) highlights material downside risks articulated by industry analysts
              like Eric Pong, who emphasize that serial acquisitions introduce operational friction and valuation
              arbitrage risk. If public markets re-rate Stord as an asset-intensive logistics operator, its valuation
              could contract to $1.2 billion to $1.5 billion, representing a 50 percent loss of capital. Furthermore,
              contractual liabilities under standard warehouse terms cap Stord's damage exposure to 50 cents per pound,
              which protects operating margins but exposes customer relationships to friction during inventory loss
              events. In addition, debt service on the $120 million SVB and ORIX facility could constrain operational
              flexibility. Before re-evaluating our track stance, prospective investors must resolve critical diligence
              gaps, specifically requiring segment-level gross margins, customer gross churn cohorts, and debt covenant
              compliance certificates.
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Software Margin Verification'
            body: >-
              While Stord's May 2026 Series F funding round demonstrates strong insider and crossover conviction led by
              Strike Capital, the 20.4x revenue multiple at a $3 billion post-money valuation leaves little margin for
              error. We recommend a track stance until confirmatory diligence verifies that high-margin software
              subscriptions, rather than pass-through warehouse fulfillment, represent the primary growth driver.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV014
          - type: callout
            title: 'Valuation Vulnerability: The Hybrid Logistics Discount'
            body: >-
              The central valuation risk is multiple compression if public markets treat Stord as a tech-enabled 3PL
              rather than an enterprise software vendor. Public comparables like Delhivery (2.5x) and EquipmentShare
              (1.7x) trade at low single-digit multiples. If Stord's software margins cannot be isolated from its
              capital-intensive facility network, public markets could discount its equity by over 50 percent.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
