  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Warehouse Contract Liabilities
        blocks:
          - type: paragraph
            body: >
              Stord's legal and regulatory exposure is heavily defined by its commercial warehouse agreements and
              standard terms of service. Under Section 11 of the Stord Warehouse Terms, Stord strictly caps its
              liability for any loss, damage, theft, or destruction of customer goods to the lesser of $0.50 per pound
              per article or the General Liability Cap in the General Terms, unless caused by gross negligence or
              willful misconduct. Furthermore, under Section 16, inventory shortage or shrinkage claims require customer
              proof of failure of reasonable care and are only actionable if cumulative losses exceed a 0.5% Shrinkage
              Allowance on inventory value over a rolling twelve-month measurement period. Section 13 imposes rigid
              procedural bars, requiring written claims within 60 days of goods removal or loss notification, and
              barring lawsuits commenced later than 9 months after removal or notification. Additionally, Stord
              explicitly disclaims liability for chargebacks of any kind, demurrage, or carrier detention outside
              defined Stord-caused windows, and holds general and specific warehouse liens allowing public or private
              disposal of goods past due by over 60 days. While these aggressive contractual terms mitigate Stord's
              balance-sheet exposure to warehouse inventory losses, they shift operational risk onto merchant clients,
              creating recurring commercial friction and contract dispute vulnerabilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
