              - CP004
              - CP005
      - number: '3.2'
        title: Feature Breadth, Technology Architecture & Operational Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Stord's technological differentiation centers on its proprietary Stord One software platform, which
              integrates warehouse management (WMS), order management (OMS), and transportation management (TMS) into a
              unified operational dashboard. Traditional third-party logistics providers such as Expeditors
              International deliver deep global air and ocean freight forwarding alongside complex customs brokerage,
              yet they generally rely on legacy electronic data interchange (EDI) connections and fragmented warehouse
              portals that lack real-time consumer brand visibility. In contrast, Stord incorporates automated
              multi-node order routing, parcel carrier optimization, and recently introduced agentic tools like
              conversational chat to synthesize inventory exceptions directly from live warehouse data. Furthermore,
              Stord claims that operator networks utilizing its self-correcting logic achieve up to 65% better service
              levels and a 15% reduction in logistics costs. However, operational friction persists in warehouse
              liability terms: standard warehouse agreements cap liability for loss or damage at fifty cents per pound
              per article, shifting inventory shrinkage and transit risk onto brand balance sheets unless merchants
              negotiate supplemental coverage.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP009
              - CP012
              - CP013
