figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: Key corporate, financing, operational, and M&A milestones across Stord's growth trajectory from 2015 through 2026.
    data:
      items:
        - label: '2015: Founding & Inception'
          date: 2015-10
          tone: neutral
          detail: >-
            Sean Henry and Jacob Boudreau co-found Stord in Atlanta to digitally connect shippers with underutilized
            warehousing capacity.
        - label: '2019: Kleiner Perkins Series A'
          date: 2019-04
          tone: positive
          detail: >-
            Kleiner Perkins backs Stord with institutional venture funding, accelerating development of proprietary
            supply chain software.
        - label: '2023: Generative AI Inflection'
          date: 2023-05
          tone: opportunity
          detail: >-
            Stord inflects product strategy following the launch of ChatGPT, initiating deep vertical integration of AI
            across warehouse operations.
        - label: '2025: Ware2Go & Penny Black M&A'
          date: 2025-07
          tone: positive
          detail: >-
            Stord acquires Ware2Go from UPS and SaaS startup Penny Black, significantly scaling fulfillment nodes and
            customer accounts.
        - label: '2026-01: Shipwire Acquisition'
          date: 2026-01
          tone: positive
          detail: >-
            Stord acquires e-commerce logistics specialist Shipwire from CEVA Logistics, expanding omnichannel
            fulfillment capabilities.
        - label: '2026-02: AI Solutions & Policy Update'
          date: 2026-02
          tone: neutral
          detail: >-
            Stord launches AI-Powered Estimated Delivery Dates and natural language workflows, while publishing revised
            warehouse service terms.
        - label: '2026-05: $250M Series F at $3B'
          date: 2026-05
          tone: positive
          detail: >-
            Stord raises $250 million Series F led by Strike Capital at a $3 billion valuation, launching Stord Labs for
            physical robotics.
        - label: '2026-05: Critical M&A Integration Scrutiny'
          date: 2026-05
          tone: warning
          detail: >-
            Industry analysts flag integration complexity, margin dilution, and valuation risks from eight rapid
            acquisitions in six years.
    approximationNotes: >-
