      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggressive Contractual Liability Caps Shield Stord but Expose Merchant Trust
            body: >
              Stord's Warehouse Terms cap liability at $0.50 per pound per article, impose a 0.5% inventory shrinkage
              threshold before liability attaches, disclaim chargebacks entirely, and bar legal claims after 9 months.
              While protective of Stord's balance sheet, these terms create operational friction with enterprise clients
              during inventory discrepancy incidents.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Valuation Multiple Vulnerability Post-Series F
            body: >
              Stord's Series F valuation of $3.0 billion represents an implied ~20x multiple on its previously reported
              ~$150M revenue run-rate, driven by AI and software positioning. If growth decelerates or public markets
              price Stord as an asset-intensive 3PL, the company faces significant down-round risk or valuation
              compression.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Summary
        blocks:
          - type: paragraph
            body: >-
              Stord presents a compelling yet price-sensitive investment case at the intersection of enterprise software
              and national supply chain operations. The company's core value proposition centers on empowering
              omnichannel brands to compete effectively against Amazon's fulfillment dominance without surrendering
              customer data, brand identity, or channel margins. By unifying distributed warehousing, proprietary order
              management (OMS) and warehouse management (WMS) software, and AI-driven parcel routing across more than
              1,000 customers, Stord has scaled to power over $10 billion to $15 billion in annual gross merchandise
              volume. Its recent launch of Stord Labs highlights an aggressive push to deploy physical intelligence,
              applying robotics, autonomous mobile units, and real-time operational models trained on live facility
              data.


              However, from an underwriting perspective, the company's valuation trajectory has outpaced demonstrable
              organic margin expansion. In May 2026, Stord closed a $250 million Series F financing round led by Strike
              Capital that valued the business at $3.0 billion post-money. While this milestone confirms strong
              institutional conviction from existing backers including Kleiner Perkins and Founders Fund, the resulting
              20.4x revenue multiple demands exceptional execution. We rate the valuation stance as fair to stretched
              and assign a track recommendation. Investors should withhold incremental capital commitments until
              confirmatory diligence provides audited verification of segment-level software gross margins and verifies
              that growth is not primarily driven by low-margin pass-through logistics services.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
