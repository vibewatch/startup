      - number: '4.3'
        title: Capital Adequacy, Debt Obligations, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Stord's capital capitalization reached $775M+ in aggregate funding following a $250M Series F financing in
              May 2026 that valued the enterprise at $3.0B post-money. This cash injection provides substantial balance
              sheet runway to fund Stord Labs, an Atlanta physical intelligence and robotics facility, while insulating
              operations from near-term liquidity stress. Nevertheless, capital adequacy cannot be fully underwritten
              without auditing historical debt obligations, specifically the terms and restrictive covenants governing
              the ORIX and SVB conventional debt facilities secured in May 2025. Industry analysts have highlighted that
              hybrid logistics aggregators face valuation down-round risks if aggressive acquisition growth decelerates,
              citing Flexport's valuation contraction from $8B to $2B as a cautionary precedent. Given private reporting
              gaps surrounding net revenue retention, software gross margins, and debt debt-service coverage, Stord's
              $3B valuation carries significant multiple compression risk if judged as an asset-heavy logistics operator
              rather than a pure technology platform.
