chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Governance, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              Stord, Inc. is an Atlanta, Georgia-based commerce enablement and supply chain platform founded in October
              2015 by Chief Executive Officer Sean Henry and Chief Technology Officer Jacob Boudreau. Self-styled as
              'The Consumer Experience Company,' Stord operates a vertically integrated commerce model designed to level
              the playing field for independent direct-to-consumer and business-to-business brands competing against
              Amazon Prime. Rather than functioning as a pure software vendor or a conventional asset-heavy third-party
              logistics provider, Stord couples proprietary cloud software—including order management, warehouse
              management, parcel carrier optimization, and pre- and post-purchase consumer experience tools—with a
              distributed physical fulfillment network. Operationally, Stord coordinates nearly 100 fulfillment
              facilities worldwide, comprising approximately 20 company-operated nodes and 80 vetted partner facilities,
              unified under a single operating system. Executive leadership remains anchored by co-founder Sean Henry,
              alongside President and Chief Operating Officer Steve Swan, Chief Financial Officer John McDonough, Senior
              Vice President of Product Craig Stewart, and co-founder Jacob Boudreau. While founder-led continuity has
              preserved execution speed, the company's hybrid operational footprint concentrates significant systemic
              dependency in key executive leadership and unified platform uptime.
            claimRefs:
