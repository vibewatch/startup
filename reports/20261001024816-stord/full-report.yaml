              - CU011
      - number: '6.2'
        title: Adoption Velocity and Volume Trajectory
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption at Stord has expanded rapidly across its ten-year operating history, driven by an
              integrated model that couples physical facility networks with proprietary supply chain software. Stord
              reports powering between $10 billion and $15 billion in annual gross merchandise value (GMV) across more
              than 50 million consumer packages, reaching an estimated 99.5% of continental United States households
              within one to two business days. The platform currently supports over 1,000 active brand customers,
              scaling from regional merchant logistics into nationwide multi-node distribution. Customer volume growth
              is reinforced by software-driven efficiency gains, including automated parcel rate shopping and carrier
              allocation algorithms that deliver reported shipping expense reductions of up to 10% per parcel package.
              However, because Stord does not publish detailed historical volume retention cohorts, active shipper
              account counts, or facility capacity utilization rates, diligence analysts must distinguish top-line GMV
              expansion from underlying organic customer retention velocity.
            claimRefs:
              - CU001
              - CU003
              - CU013
              - CU014
