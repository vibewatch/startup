callouts:
  - calloutType: risk
    title: Aggressive Contractual Liability Caps Shield Stord but Expose Merchant Trust
    body: >
      Stord's Warehouse Terms cap liability at $0.50 per pound per article, impose a 0.5% inventory shrinkage threshold before liability attaches, disclaim chargebacks entirely, and bar legal claims after 9 months.
      While protective of Stord's balance sheet, these terms create operational friction with enterprise clients during inventory discrepancy incidents.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
  - calloutType: risk
    title: Valuation Multiple Vulnerability Post-Series F
    body: >
      Stord's Series F valuation of $3.0 billion represents an implied ~20x multiple on its previously reported ~$150M revenue run-rate, driven by AI and software positioning.
      If growth decelerates or public markets price Stord as an asset-intensive 3PL, the company faces significant down-round risk or valuation compression.
    claimRefs:
      - CR013
      - CR014
      - CR015
