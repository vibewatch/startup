callouts:
  - calloutType: "insight"
    title: "Technical Leverage via Erlang/Elixir Concurrency"
    body: "Unlike traditional 3PL competitors operating on legacy monolithic Java or .NET stacks, Stord built its core OMS and WMS orchestration engines on Elixir, Phoenix, and OTP. This architectural choice provides high concurrency, fault isolation, and lightweight process threading, enabling the system to process high-volume retail order spikes across distributed facilities without proportional infrastructure overhead [CE003, CE004]."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Software Integration Friction Across Eight Acquired Entities"
    body: "Stord has acquired eight businesses in six years—including Ware2Go, Shipwire, and Penny Black. Engineering specifications reveal ongoing efforts to consolidate acquired frontends into a unified React component library and integrate disparate backend services into the core Elixir pipeline, creating persistent architectural complexity and maintenance overhead [CE004, CE005]."
    claimRefs:
      - "CE004"
      - "CE005"
  - calloutType: "assumption"
    title: "Third-Party Facility Compliance with Stord Technology Standards"
    body: "Stord's hybrid network relies on ~80 partner-operated facilities to achieve 99% two-day ground coverage. The operating model assumes third-party warehouse partners consistently execute barcode scanning and inventory tracking via Stord's cloud WMS, yet contractual terms explicitly disclaim facility climate guarantees and restrict inventory loss recovery [CE002, CE007, CE008]."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE008"
