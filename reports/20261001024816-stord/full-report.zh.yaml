      - number: '3.2'
        title: 功能覆盖、技术架构与运营权衡
        blocks:
          - type: paragraph
            body: >-
              Stord 的技术差异化核心在于自研的 Stord One 软件平台，该平台将仓储管理（WMS）、订单管理（OMS）和运输管理（TMS）整合进统一运营看板。Expeditors International
              等传统第三方物流商在跨国空海运货代与复杂清关报关上底蕴深厚，但通常依赖老旧的电子数据交换（EDI）与分散的仓储门户，欠缺面向消费品牌的实时数据透明度。相比之下，Stord
              具备自动化的多节点订单路由与包裹承运商优化能力，近期更推出对话式聊天等智能体工具，直接根据实时仓储数据汇总库存异常。此外，Stord 称采用其自纠偏逻辑的运营网络服务水准最高可优化 65%，物流成本可缩减
              15%。然而，仓储赔偿条款中依然存在运营阻碍：标准化仓储协议将货物灭失或损坏的赔付上限设定为每单品每磅 50 美分，除非商家另行协商追加补充险，否则库存损耗与运输在途风险实质上转嫁给了品牌方的资产负债表。
            claimRefs:
              - CP001
