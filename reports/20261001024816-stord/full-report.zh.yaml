  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定位与商户工作流架构
        blocks:
          - type: paragraph
            body: >-
              Stord 将自身定位为集成式商业赋能与实体智能平台，旨在帮助独立 DTC 及全渠道商户交付比肩零售巨头的履约体验 [CE001]。在工作流中，该平台统管订单跨多元销售渠道与实体仓储网点的全生命周期
              [CE001, CE002]。终端消费者在电商网店下单后，Stord 订单管理系统（OMS）会录入订单，评估各分布式履约节点的库存可用状态，并依据仓库运力与就近原则自动分派路由
              [CE002]。分派完成后，订单流转至 Stord 仓储管理系统（WMS），负责协调拣选打包、条码扫描及出库分拣，官方口径称履约准确率达 99.9% [CE002,
              CE005]。在购后环节，消费者体验平台提供包裹物流追踪、主动通知与退货管理服务，动态包裹优化算法则负责优选汽运承运商以降低包裹运输开支 [CE002, CE005]。
            claimRefs:
              - CE001
              - CE002
              - CE005
