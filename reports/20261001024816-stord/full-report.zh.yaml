      - CV008
      - CV009
      - CV010
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心经营假设
      - 估值与退出逻辑
      - 核心风险与下行诱因
      - 概率信号
    rows:
      - - 乐观情景
        - 软件 ARR 超过 $100M（占收入比重 >50%）；Stord Labs AI 推动毛利率升至 45%+；内生增速 >40%。
        - 按 12x-15x 预期收入倍数对应 $5.0B-$6.0B IPO 估值；F 轮投资方获得 1.7x-2.0x MOIC。
        - 机器人自动化落地不及预期；面临与 Amazon Buy with Prime 的竞争性价格战。
        - 25%（需要软件转型毫无差错）
      - - 基准情景
        - 收入达到 $250M，综合毛利率为 25%-30%；软件在收入结构中维持 25%-30% 占比。
        - 按 10x-12x 综合倍数经由 IPO 或战略并购退出，估值达 $3.0B-$3.5B；对应 1.0x-1.2x MOIC。
        - 实体设施租赁及运输货运成本波动挤压利润率。
        - 50%（与当前多节点网络现状最为吻合）
      - - 悲观情景
        - 内生增速停滞在 15% 以下；并购整合问题显现；业务被重估为传统 3PL。
        - 按 3x-4x 收入倍数遭遇 $1.2B-$1.5B 的下调轮次或困境整合；本金损失 50%+。
        - $120M 信贷额度触发债务违约条款；大企业客户流失；遭遇仓储责任索赔主张。
        - 25%（因 20.4x 入场倍数及物流宏观周期性而推高）
    notes: 回报预测以 F 轮投后 $3.0B 入场估值对比历史物流科技估值周期直接建模。
