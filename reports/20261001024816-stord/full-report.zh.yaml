  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Stord
              将自身业务品类定义为云供应链与商业赋能，立足于第三方物流（3PL）与企业级供应链软件的交汇点。其市场边界涵盖实体仓储、库存分发、多承运商包裹配送，以及自研订单管理软件（OMS）与仓储管理软件（WMS）。Stord
              有针对性地将约 20 处自营设施的实体执行能力，同约 80 处签约合作网点的轻资产网络整合，全由自研操作系统统一管理。这套混合基础设施面向高增长 DTC
              品牌及全渠道商家，满足其无需承担自建专用物流网络的重资本开支、即可获得全美覆盖的需求。


              目标买家面临的传统替代方案呈现两极分化格局：要么是高度分散的传统 3PL 网络，要么是 Amazon 多渠道履约（MCF）。传统区域型 3PL 往往欠缺现代化 API
              对接、自动化订单路由以及跨设施的实时库存透明度，迫使品牌运营人员拼凑第三方中间件与电子表格。反观 Amazon
              MCF，虽能提供快捷的两日地面达服务，但大型商家正日益寻求独立替代品，以规避平台绑定、维系直客关系、维护开箱品牌形象并防止电商平台蚕食毛利。Stord
              的商业范畴明确排除了重资产的海运包船及长途卡车资产，专注于软件编排的履约交付与包裹承运商优化。在合同条款上，Stord 借由标准化仓储协议平衡运营风险，将库存损失赔偿限制在每磅 50
              美分与总责任上限中的较低者，并附带千分之五的库存损耗免赔率。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: 市场规模测算视角、增长驱动力与 AI 拐点
        blocks:
          - type: paragraph
            body: >-
              测算 Stord 的潜在市场空间需借助多元运营视角，而非单凭宽泛的传统物流估算。宏观层面上，2025 年全球零售、物流及运输领域的企业级人工智能支出突破 $244
              billion，凸显出企业对自主路由与库存优化技术的重金投入。在北美全渠道电商范畴，据 Stord 披露，截至 2026 年其统一平台支撑的年化商品交易总额（GMV）超 $15 billion，处理了逾 50
              million 个消费者包裹，两日内地面网络可触达 99% 的美国家庭。此轮扩张前，一级市场推算 Stord 确认的收入运行率接近 $150 million，但其 F 轮高达 $3 billion
              的估值，反映出投资人押注其营收将迅速加速跨入大型企业规模。


              消费行为转变与 AI 实际落地共同催化了市场扩张。Stord 2026 年的研究显示，2025 年有 51% 的网购消费者使用生成式 AI 工具辅助购物，高于 2024 年的
              38%，推动了对智能化零点击购买路由与动态送达承诺的需求。与此同步，尽管 88% 的零售机构声称已在至少一项核心业务流程中部署 AI，却仅有 7%
              达到全企业规模化应用水平，这为能将智能体决策深度植入实体履约的平台创造了运营顺风。不过，风险资本支持的混合型物流公司面临残酷的估值前车之鉴。Flexport、Convoy 和 Deliverr
              等过往行业案例表明，若无稳固的软件毛利率支撑，单纯靠并购堆砌营收增长，极易遭遇市场将其估值从科技倍数大幅重估至传统物流运营倍数的下行风险，因此持续盈利能力与内生软件扩张至关重要。
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM010
              - CM011
