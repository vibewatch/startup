      - number: '1.2'
        title: 融资历程、投资机构格局与规模基准
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Stord 完成由 Strike Capital 领投的 $250 million F 轮融资，名义估值达 $3.0 billion；长期投资方 Kleiner
              Perkins、Founders Fund、Franklin Templeton、Baillie Gifford、G Squared、Bond 和 Lux Capital 参投。本轮融资使 Stord 估值较
              2025 年 5 月的 $1.5 billion 翻倍，自成立以来累计股权与债权融资额已超 $775 million。管理层披露，2022 至 2026 年四年间营收增长约 10 倍，并指出 2023
              年引入生成式 AI 工作流是增长拐点。据报道，2026 年第一季度软件预订量环比翻倍，主要受 StordAI 以及亚特兰大机器人与实体智能测试基地 Stord Labs
              等模块化产品带动。综合其实体与数字化运营，Stord 为 1,000 多家客户提供年化商品交易总额（GMV）超 $15 billion 的履约支撑，年处理包裹触达约四分之一美国独立家庭。但鉴于 Stord
              仍属非上市公司，其独立经审计营收、净收入留存率、纯软件年经常性收入（ARR）与分部毛利率均未公开，核心 SaaS 估值倍数假设仍需通过私下尽调确认。
            claimRefs:
