  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与评级建议总结
        blocks:
          - type: paragraph
            body: >-
              Stord 处于企业级软件与全美供应链运营的交织赛道，属于兼具高吸引力与高估值敏感度的投资标的。公司核心价值主张在于赋能全渠道品牌正面抗衡 Amazon
              的履约垄断，同时无须出让客户数据、品牌独立性或渠道利润率。Stord 整合分布式仓储、自研订单管理系统（OMS）、仓储管理系统（WMS）软件以及 AI 驱动包裹路由网络，已服务超 1,000
              家客户，年处理商品交易总额（GMV）达 $10B 至 $15B。近期推出的 Stord Labs 更显现出推进物理智能（physical
              intelligence）的激进布局，落地机器人、自主移动设备以及基于真实仓储运营数据训练的实时作业模型。


              然而，从投资评估（underwriting）角度看，公司估值扩张跑赢了可证实的内生毛利率扩张。2026 年 5 月，Stord 完成由 Strike Capital 领投的 $250M Series F
              轮融资，投后估值达 $3.0B。尽管该里程碑印证了 Kleiner Perkins 与 Founders Fund 等现有股东的强劲机构信心，但由此推高的 20.4x
              市销率倍数要求极其苛刻的业务执行力。我们将当前估值立场评定为合理至偏高（fair to
              stretched），给予跟踪（track）评级。投资者在追加增量资本前，应等待排他性尽审查明经审计的分部软件毛利率，并核实增长并非主要由低毛利转手物流服务推高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV012
              - CV014
