  - id: TV002
    title: 正向与反向投资逻辑表
    columns:
      - 情景 / 立场
      - 核心论点
      - 证据锚点
      - 何种情况会改变观点
    rows:
      - - 正向逻辑：软件编排能力
        - 垂直整合的 OMS/WMS 与 AI 层将同质化的履约业务转化为高黏性的企业级软件平台。
        - 支撑 1,000+ 个品牌共计 $10B-$15B GMV；2026 年 Q1 软件预订量环比翻倍。
        - 软件预订增速放缓，或客户在合同到期续约时出现大幅流失。
      - - 正向逻辑：实体智能护城河
        - 依托约 100 处设施沉淀的专有订单数据训练实时 AI 与机器人算法，轻资产软件厂商无法复制。
        - Stord Labs 在真实生产订单上测试实体智能模型。
        - 无法证明机器人部署能够降低单件成本或提升吞吐量。
      - - 反向逻辑：估值套利风险
        - 连续并购推高了账面总收入，却掩盖了真实的内生增长，并带来严重的运营整合阻力。
        - 2021 年以来累计完成 6 次收购，包括 Ware2Go、Penny Black 和 Shipwire。
        - 经核实同仓内生业务量增速超过 30%，且客户队列保持稳定。
      - - 反向逻辑：估值倍数压缩
        - 公司按 20.4x 收入倍数估值，而上市物流可比公司交易倍数仅为 1.7x-2.5x，致使股权极易遭遇严重的下调轮次或平价 IPO。
        - Eric Pong 的批评观点与上市可比公司（Delhivery 为 2.5x，EquipmentShare 为 1.7x）。
        - 有证据表明软件毛利率超过 70% 且占净收入一半以上。
    notes: 核心论点综合了已验证的 F 轮投资逻辑与独立的物流市场批评意见。
