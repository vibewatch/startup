figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 2015 年至 2026 年间 Stord 发展历程中的关键公司治理、融资、运营及并购里程碑。
    data:
      items:
        - label: 2015：创立与起步
          date: 2015-10
          tone: neutral
          detail: Sean Henry 与 Jacob Boudreau 在亚特兰大共同创立 Stord，以数字化手段连接货主与闲置仓储运力。
        - label: 2019：Kleiner Perkins 领投 A 轮
          date: 2019-04
          tone: positive
          detail: Kleiner Perkins 为 Stord 提供机构风险投资，加速自研供应链软件的开发。
        - label: 2023：生成式 AI 战略转折
          date: 2023-05
          tone: opportunity
          detail: ChatGPT 发布后，Stord 调整产品战略，启动 AI 与仓储运营的深度垂直整合。
        - label: 2025：收购 Ware2Go 与 Penny Black
          date: 2025-07
          tone: positive
          detail: Stord 从 UPS 手中收购 Ware2Go 并买下 SaaS 初创公司 Penny Black，大幅扩充履约节点与客户账户。
        - label: 2026-01：收购 Shipwire
          date: 2026-01
          tone: positive
          detail: Stord 从 CEVA Logistics 收购电商物流服务商 Shipwire，拓展全渠道履约能力。
        - label: 2026-02：AI 解决方案与条款更新
          date: 2026-02
          tone: neutral
          detail: Stord 推出 AI 驱动的预计送达时间功能与自然语言工作流，同时发布修订版仓储服务条款。
        - label: 2026-05：以 $3B 估值完成 $250M F 轮融资
          date: 2026-05
          tone: positive
          detail: Stord 完成由 Strike Capital 领投的 $250 million F 轮融资，投后估值 $3 billion，同时设立 Stord Labs 布局实体机器人。
        - label: 2026-05：并购整合面临严格审视
          date: 2026-05
          tone: warning
          detail: 行业分析师警示 6 年内快速完成 8 次收购带来的整合复杂性、利润率稀释及估值风险。
    approximationNotes: 日期与里程碑事件整理自公司新闻稿、交易公告及行业报道。
