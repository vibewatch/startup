  - id: FE001
    title: Stord 多层平台与技术栈
    type: stack
    summary: Stord 软件架构、高并发层及实体物流基础设施的结构视图。
    data:
      layers:
        - label: 交互层
          detail: 全渠道结账时效承诺、品牌定制订单追踪、退货管理及对话式 Chat 助手。
        - label: 编排与工作流层
          detail: 分布式订单管理系统（OMS），自动执行库存分配、订单路由规则及包裹比价。
        - label: 高并发服务层
          detail: 基于 Erlang OTP 监督树运行的 Elixir 与 Phoenix 后端微服务，用于容错状态编排。
        - label: 数据流与集成总线
          detail: 处理订单更新、库存变动及外部承运商状态 Webhook 的 Apache Kafka 事件管道。
        - label: 数据持久化与事务引擎
          detail: 在 GCP 上维护关系型商品主数据、计费账目及交易历史的 PostgreSQL 数据库。
        - label: 实体自动化与智能（Stord Labs）
          detail: 占地 10,000 sq ft 的实体实验室，用于测试自主移动机器人、计算机视觉与动态拣货路径算法。
        - label: 混合履约执行网络
          detail: 约 20 个公司自营履约节点与约 80 个认证合作仓，提供 99% 的 1-2 日陆运覆盖。
    approximationNotes: 层级划分综合自官方工程招聘信息、平台架构文档及 FreightWaves 报道。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
  - id: FU001
    title: 客户全旅程图：落地与扩张采纳周期
    type: journey-map
    summary: 直观呈现客户从包裹费率优化切入，逐步延伸至多节点履约、WMS 软件及实体 AI 自动化的上线演进历程。
    data:
      nodes:
        - label: 1. 包裹与结账优化
          detail: 品牌客户借助 Stord Parcel 费率优化软件切入，立竿见影节省高达 10% 的运费成本。
          touchpoints:
            - E-commerce checkout integration
            - Multi-carrier parcel rate shopping
        - label: 2. 战略性库存接入
          detail: 客户依据标准仓储条款和条码扫描规范，将货物交付至 Stord 混合网络。
          touchpoints:
            - Advanced Shipment Notification (ASN)
            - Barcode labeling and receiving
        - label: 3. 全渠道多节点履约
          detail: 订单在 100 处履约设施间动态路由，打通 99% 的两日陆运覆盖。
          touchpoints:
            - Automated order routing
            - Pick, pack, and custom kitting
        - label: 4. 统一供应链可视性
          detail: 品牌部署 Stord OMS 与 WMS 软件仪表板，全盘跟踪跨渠道订单、库存及 SLA 履约准确率。
          touchpoints:
            - Real-time inventory visibility
            - Control tower reporting
        - label: 5. 对话式 AI 与分析功能扩展
          detail: 客户进一步采纳 AI 助手（Chat、Search、Feed），数秒内即可查询异常事件与缺货预测。
          touchpoints:
            - Natural language order diagnostics
            - Predictive stockout alerts
        - label: 6. 企业级实体智能与机器人
          detail: 规模化品牌与 Stord Labs 合作，共同探索自动化机器人与仓储实体 AI 工作流。
          touchpoints:
            - Autonomous mobile robotics (AMR)
            - Custom enterprise SLA governance
    claimRefs:
      - CU013
      - CU014
