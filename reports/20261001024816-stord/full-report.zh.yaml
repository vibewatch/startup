      - number: '8.4'
        title: 图表附录
        blocks:
          - type: callout
            title: 投资立场：维持跟踪评级，静待软件毛利率确证
            body: >-
              尽管 Stord 于 2026 年 5 月由 Strike Capital 领投的 Series F 轮融资展现出内部老股东与跨界投资机构的强劲信心，但在 $3B 投后估值下，20.4x
              的营收倍数容错空间极其有限。我们建议维持跟踪（track）评级，直至确证性尽审查明高毛利软件订阅（而非转手仓储履约）才是驱动业务增长的主引擎。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV014
          - type: callout
            title: 估值脆弱性：混合物流折价
            body: >-
              核心估值风险在于：一旦公开市场将 Stord 归类为科技赋能 3PL 而非企业级软件厂商，势必引发倍数压缩。Delhivery（2.5x）和
              EquipmentShare（1.7x）等上市可比标的仅以低个位数倍数交易。若 Stord 的软件毛利无法脱离其重资本仓储设施网络单独核算，公开市场给予其股权的折价幅度可能超过 50%。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
