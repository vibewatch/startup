      - number: '5.3'
        title: 平台整合、运营可靠度与合同条款
        blocks:
          - type: paragraph
            body: >-
              尽管 Stord 在北美实现了 1–2 日内 99% 的地面网络覆盖，但其运营模式引入了显著的软件与法律风险边界，亟需严格尽调审视 [CE002, CE007]。由于在六年内完成了 8 起并购（包括从 UPS
              收购 Ware2Go、从 CEVA Logistics 收购 Shipwire 以及收购 Penny Black），在工程团队将杂乱的前端界面、状态模型与第三方仓储系统汇聚并入核心 Elixir 和 React
              技术栈的过程中，公司面临着持续的技术债务与架构摩擦 [CE004, CE005]。此外，Stord 的标准化仓储条款设置了严苛的免责及赔偿限额，将运营风险转嫁给商家 [CE007, CE008]。Stord
              将普通货物灭失损坏赔偿责任上限限制为每单品每磅 $0.50 与合同总责任上限中的较低者，在判定责任前执行 0.5% 的库存损耗免赔率，并明确不对合作网点设施的温湿度控制承担任何保证或担保义务 [CE007,
              CE008]。对其 SOC 2 Type II 合规及容灾故障切换的独立核查，仍是一项待解的尽调要件 [CE008, CE012]。
            claimRefs:
              - CE002
