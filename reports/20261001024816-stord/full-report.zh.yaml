      - number: '2.3'
        title: 买家分层、预算归属与落地路径
        blocks:
          - type: paragraph
            body: >-
              Stord 商业化拓展引擎将潜在客群细分为原生数字化 DTC 品牌、中端市场消费品牌以及大型全渠道零售商。公司与 Growth Today 开展的大规模账户分层与 CRM 准入梳理显示，全美符合条件的潜在商户超过
              160,000 家。准入指标要求商户每月网站访问量至少达到 35,000 次、销售实体产品、建有站内结算流程，并具备向全美 50 个州消费者直接送货的能力。该准入模型明确剔除了纯 SaaS
              软件商、航空公司、仅限同城自提的企业以及仅在 Amazon 和 Walmart 上经营的纯平台第三方卖家，精准锁定自主掌握生产、客群数据与分销策略的品牌。


              不同客群层级的预算归属与采购流程差异显著。对于 AG1、Native、True Classic 和 Goodr 等高增长 DTC 品牌，采购决策通常由创始人及运营副总裁主导，核心诉求在于上线速度、可靠的 1–2
              日地面送达以及定制化购后开箱体验。对于依靠 Costco、Target 等批发渠道分销的中端与企业级商户，预算审批权则转至首席供应链官及集团采购委员会。此类企业买家重点考察 Stord
              自动化处理电子数据交换（EDI）合规要求、避免供应商违约罚扣，以及在分散销售渠道间调配库存的能力。采购动作多在新兴品牌业务体量突破区域 3PL 承载极限、或在季节性需求爆发遭遇库存同步失误时触发。
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM013
              - CM014
      - number: '2.4'
        title: 推广阻碍、定价阻力与测算缺口
        blocks:
          - type: paragraph
            body: >-
              尽管商业化势头迅猛，Stord 的市场落地仍面临运营与财务阻力。来自 RFP.wiki 的第三方采购基准显示，Stord 定位为高端一体化解决方案，而非平价大宗
              3PL。公司未公开标准化企业费率表，而是依赖顾问式业务调研与定制化客户报价。行业分析指出，Stord One 软件平台经常性费用通常每年约 $30,000 起，或按月收取 $800 至 $2,500，另加每单
              $2.10 至 $3.50 的履约费与变动仓储成本。不透明的定价结构叠加高昂的先期软件投入，令倾向透明自助比价的中等规模商户在采购时产生迟疑。


              此外，关键尽调盲区掩盖了 Stord 混合商业模式的真实财务面貌。作为非上市公司，Stord 未公开披露 GAAP
              分部财务报告，无法将高毛利的软件订阅同低毛利的实体仓储及承运商代收代付转嫁账单明确拆分。投资人难以独立判断 Stord 的综合毛利率究竟是否具备防守壁垒的 SaaS
              单位经济效益，还是仅仅处于传统合同仓储的微薄水平。加之 Stord 仓储合同设置了严苛的运营限制，包括 0.5%
              的年度库存损耗免赔率和按磅赔偿限额，迫使持有高货值商品的大型企业必须单独谈判定制保险条款。厘清这些合同条款并获取经审计的分部财务数据，仍是评估其市场生存能力的核心尽调环节。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.5'
        title: 专题图表
        blocks:
          - type: callout
            title: 替代 Amazon 之选：为独立品牌解绑 Prime 物流
            body: >-
              Stord 的核心价值主张切中了现代数字商业的结构性矛盾：独立品牌既渴望媲美 Amazon Prime 的配送时效与库存铺货能力，又不愿将客户关系数据、结账品牌标识及电商交易利润拱手让给 Amazon。Stord
              将自研订单管理软件与 20 个自营网点加 80 处合作仓库的混合网络融为一体，支持中端与大型企业商户统一调度多节点地面履约，牢牢把控直面消费者的忠诚度。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
              - CM015
          - type: callout
            title: 混合物流模式的估值困境：重资产运营下的软件估值溢价
            body: >-
              Stord 高达 $3 billion 的估值固然折射出其营收增长 10 倍与 AI 平台定位带来的溢价，但物流行业的过往历程却敲响了警钟。Flexport、Convoy 和 Deliverr
              等先例表明，一旦二级市场将资本支持的科技型物流企业视作配置自研工具的重资产 3PL、而非高毛利纯软件平台，此类企业便会面临估值大幅缩水的风险。Stord
              持续的并购整合推高了账面规模，却也加剧了线下整合开支与运营复杂度。
            calloutType: risk
            claimRefs:
              - CM001
              - CM004
  - number: 3
    title: 竞品格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场细分
        blocks:
          - type: paragraph
            body: >-
              电商物流生态分化为四大竞争阵营：占据统治地位的垂直整合电商平台（以 Amazon 履约服务为主）、科技赋能型专用 3PL、按需仓储网络以及传统跨国货代。Amazon
              掌握着约三分之一的美国线上零售份额，塑造了全美消费者对 1–2 日送达的普遍心理预期。然而，大型企业及高增长 DTC 商家日益抗拒将客户关系、利润控制权及独家买家数据拱手让渡给 Amazon 平台生态。Stord
              正视这一痛点，将自身定位为数字化控制塔与独立云供应链平台。Stord 不单纯依赖自建实体仓储，也不局限于单一软件层，而是在北美与欧洲部署了由约 20 个自营履约节点及约 80
              处签约合作网点构成的混合网络。相较单一设施运营商，该模式赋予其更广阔的地域覆盖范围，同时避免了全网全自建所需的沉重资本负担。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
