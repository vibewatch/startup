          - type: callout
            title: 消化 8 家并购标的引发的软件整合摩擦
            body: >-
              Stord 六年内收购了 8 家企业，包括 Ware2Go、Shipwire 和 Penny Black。工程规范透露，团队仍在持续把被收购方的前端整合进统一 React 组件库，并将杂乱的后端服务接入核心
              Elixir 数据流水线，由此带来了持续的架构复杂度与维护负担 [CE004, CE005]。
            calloutType: risk
            claimRefs:
              - CE004
              - CE005
          - type: callout
            title: 第三方网点对 Stord 技术标准的遵从度挑战
            body: >-
              Stord 混合网络依靠约 80 处合作网点达成 99% 两日地面覆盖。其业务模式预设第三方仓库合作方能始终通过 Stord 云端 WMS
              执行条码扫描与库存追踪，但合同条款却明确排除了仓储环境温湿度保证，并严格限制了库存损失追偿范围 [CE002, CE007, CE008]。
            calloutType: assumption
            claimRefs:
              - CE002
              - CE007
              - CE008
  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户群体细分与买家画像
        blocks:
          - type: paragraph
            body: >-
              Stord 将商业客户群划分为三大核心运营类别：快节奏直面消费者（DTC）品牌、中端全渠道零售商以及大型企业级供应链货主。以 AG1、Native、True Classic 和 Seed Health
              为代表的高增长 DTC 商家，需要极高的履约流转速度、品牌专属开箱体验以及自动化全美包裹干线注入，以便在不牺牲客群归属的前提下对标 Amazon Prime 履约标准。中端全渠道商家借助 Stord
              的混合仓储网络兼顾线上商城发货与线下批发零售补货，应对诸如 Costco 和 Target 等大型零售伙伴复杂的 EDI 路由及供应商合规要求。相比之下，大型企业买家选用 Stord
              则主要看重其云端供应链编排能力、软件驱动的透明度以及应对旺季溢出货量的分发运力。在所有客群中，大型企业采购流程均推行严苛的信息安全审查，在获准接入仓储系统前，必须对终端安全基线、身份访问管理与客户数据隐私实施受审控管。
            claimRefs:
              - CU001
              - CU002
              - CU010
              - CU011
