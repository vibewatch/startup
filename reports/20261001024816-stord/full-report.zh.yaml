      - number: '6.2'
        title: 业务扩张速度与订单量走势
        blocks:
          - type: paragraph
            body: >-
              在过去十年的经营历程中，Stord 凭借实体网点同自研供应链软件紧密融合的模式，实现了商业客户的快速拓展。据 Stord 披露，其统一平台支撑的年化商品交易总额（GMV）在 $10 billion 至 $15
              billion 之间，处理包裹超 50 million 件，估计能在 1 至 2 个工作日内触达 99.5% 的美国本土家庭。平台目前服务逾 1,000
              家活跃品牌客户，业务已从区域性商户物流升级为全美多节点分销。软件带来的效率提升进一步强化了业务量扩张，包括自动化包裹比价及承运商派单算法，官方口径称每件包裹最高可削减 10% 的物流开支。然而，由于 Stord
              未公开详细的历史业务量留存群组数据、活跃货主数量或网点产能利用率，尽调人员必须厘清名义 GMV 扩张与底层客户内生留存节奏之间的真实差距。
            claimRefs:
              - CU001
              - CU003
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
