            body: >-
              Stord 的混合模式依托约 100 处网点构筑了广泛的地理覆盖，但依赖第三方仓库运营商也给打包准确率和 SLA 履约达标率带来了执行层面的波动。此外，收购 Ware2Go 和 Shipwire
              等传统资产驱动的业务扩张，也埋下了投后整合风险；若外延并购换来的业务体量无法带来持久的软件溢价，营业利润率恐将承压。
