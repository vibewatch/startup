  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收模式、定价机制与业务组合
        blocks:
          - type: paragraph
            body: >-
              Stord 依托一套将按量计费履约、轻资产仓储、运输管理与软件经常性订阅相融合的混合营收架构，推进商业物流变现。实体运营层面根据浮动杂费费率、月度托盘仓储费、拣选打包履约费以及承运商运费加价，向企业与 DTC
              货主收取费用。客户依据标准协议交付货物，协议规定自货物保管权交接当日起全额计算月度仓储费，并设定月度最低业务量门槛与超范围货物处理的杂费人工费率。与此同时，Stord 极力扩展其自研 SaaS 产品体系——涵盖
              Stord One Warehouse、订单管理系统以及最新上线的对话式 AI 助手层；据报道，2025 年其软件收入增至三倍，2026 年初季度预订量亦翻倍。然而，由于 Stord
              将软件同物流交付捆绑打包，财务报表掩盖了纯经常性软件收入相较转嫁运量确切的毛利贡献。
            claimRefs:
