      - number: '3.4'
        title: 护城河韧性、转换成本与替代威胁
        blocks:
          - type: paragraph
            body: >-
              Stord
              的竞争护城河建立在实体与软件网络相互叠加的数据飞轮之上，但其稳固性正面临切实的执行隐患。该平台每年处理数十亿条运营数据，持续训练覆盖各仓储网点的预测性补货与路由模型。成熟企业客户面临极高的转换成本：迁移企业级订单路由、WMS
              集成和多网点库存往往需要数月的运营过渡期，在销售旺季更伴随严重的缺货断供风险。即便如此，Stord 对合作仓库的依赖使品牌客户暴露在各节点包装执行标准不一、服务履约水平参差不齐的风险之中。不仅如此，Stord 靠
              8 起收购（包括从 UPS 收购 Ware2Go、从 Ceva Logistics 收购
              Shipwire）换来的迅猛扩张，也带来了沉重的软件整合复杂度与维护开销。正如物流行业分析师所警示，依靠并购与风险投资催生的增长蕴含着隐患：二级市场最终可能会将 Stord
              归类为自备技术的重资产物流中介，而非能够享有高估值倍数的纯粹 SaaS 软件平台。
            claimRefs:
              - CP002
