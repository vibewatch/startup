  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 将 Stord 运营规模、市销率扩张、收购风险及情景收益串联至「观察」建议的端到端分析脉络。
    data:
      nodes:
        - id: scale
          label: 运营规模与 GMV 势头
          note: 为 1,000+ 家品牌支撑 $10B-$15B GMV，陆运 1-2 日达覆盖率达 99.5%
        - id: revenue-mix
          label: 混合软件与物流收入
          note: 据报道 $147M 收入基线；软件业务正借助 Stord One 加速发展
        - id: valuation-mark
          label: Series F 轮 $3.0B 入场估值
          note: $250M 融资令估值翻倍至 $3.0B，估值倍数扩大至 20.4x
        - id: integration-risks
          label: 并购整合与 3PL 估值压缩风险
          note: 已完成 6 起收购；同类物流估值倍数平均在 1.7x 至 6.1x
        - id: scenario-payoff
          label: 非对称基准/悲观情景收益特征
          note: 基准情景提供 1.0x-1.2x MOIC；悲观情景面临 50% 估值下调下行风险
        - id: decision
          label: 建议：观察
          note: 在软件毛利率与债务条款核实前，暂不追加新资金
      edges:
        - from: scale
          to: revenue-mix
        - from: revenue-mix
          to: valuation-mark
        - from: valuation-mark
          to: integration-risks
        - from: integration-risks
          to: scenario-payoff
        - from: scenario-payoff
          to: decision
    approximationNotes: 流程图展示了驱动投资决策把关的定性分析依赖关系。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV010
      - CV011
      - CV012
      - CV014
