  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管合规、法律纠纷与仓储合同责任
        blocks:
          - type: paragraph
            body: >
              Stord 的法律与合规风险在很大程度上取决于其商业仓储协议与标准服务条款。根据《Stord 仓储条款》第 11 条，除非由重大过失或故意不当行为造成，否则 Stord
              对客户货物灭失、损坏、被盗或损毁的赔偿责任，严格限制在每单品每磅 $0.50 与《通用条款》中总责任上限（General Liability Cap）中的较低者。此外，依据第 16
              条，库存盘亏或损耗的索赔主张，要求客户必须证明公司未尽合理谨慎义务，且仅在滚动 12 个月统计周期内累计损失超过库存货值 0.5% 的损耗免赔额（Shrinkage Allowance）时方可追偿。第 13
              条设置了僵硬的程序阻碍：书面索赔主张必须在货物移库或收到损失通知后 60 天内提出，且在移库或收到通知后超过 9 个月提起的诉讼一律不予受理。此外，Stord 明确拒绝承担任何形式的违约罚扣、滞港费或非
              Stord 原因导致的承运人滞期费，并享有一般与特殊仓储留置权，有权对逾期超过 60 天的货物进行公开或私下处置。这套严苛的合同条款虽降低了 Stord
              资产负债表承担的仓储库存损失风险，却将运营风险转嫁给货主客户，容易引发持续的商务摩擦与合同争议隐患。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
