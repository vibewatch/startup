          label: 留存平台收入（软件订阅与物流服务费）
        - id: blended-margin
          label: 综合毛利率差（高毛利 SaaS + 使用量操作费）
      edges:
        - from: client-orders
          to: software-routing
        - from: software-routing
          to: facility-fulfillment
        - from: facility-fulfillment
          to: carrier-optimization
        - from: carrier-optimization
          to: retained-platform-revenue
        - from: retained-platform-revenue
          to: blended-margin
    approximationNotes: 流程图展示商业模式关系；实体通道成本与留存软件利润率之间的确切财务分配尚未公开。
    claimRefs:
      - CI001
      - CI004
      - CI005
