      - number: '7.2'
        title: 运营执行、跨网点一致性与软件成熟度
        blocks:
          - type: paragraph
            body: >
              Stord 运营着覆盖约 20 处自营设施与约 80 处合作仓库的混合物流架构，在异构运营环境下保障作业一致性面临重重考验。独立行业评测与竞品调研指出，尽管 Stord 在全网交出 99.9% 履约准确率及
              99.5% 的 1–2
              天地面覆盖表现，但相较其声称的营收体量，公开评价样本依然单薄，导致广泛的客户真实评价在统计学上难以严密验证。独立分析亦指出，基础套餐客户支持响应迟缓往往是负评的主要来源，用户亦频频吐槽非核心功能需求开发周期漫长、软件在边缘场景下欠缺成熟度。此外，第三方观点强调，过往整合阵痛导致的快速扩张与人员流动，给新接入仓储节点的运营稳定性带来隐患。尽管
              Stord 已推出包含 Chat、Search 和 Feed 的 StordAI 套件以缓解数据孤岛，但要在 100 处网点间完成全网协同编排，仍需持续投入工程研发以突破仓储作业瓶颈。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
