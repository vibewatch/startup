      - number: '6.3'
        title: 标杆客户案例与成效实证
        blocks:
          - type: paragraph
            body: >-
              标杆客户实证展现出知名 DTC 消费品牌对 Stord 的深度采用，这些品牌依托 Stord 处理关键的订单履约与承运商物流。goodr、Native、True Classic 以及 Sundays for
              Dogs 等代表性客户均具备规模化业务体量，部署了 Stord 仓储管理系统与区域履约枢纽，以支撑快速扩张的零售与电商分销。客户高管的公开背书强调了可量化的运营成效，包括 99.9%
              的订单履约准确率、送达时间更可预期，以及打通电商与批发渠道的统一库存透明度。尽管品牌背书效应显著，但公开案例研究属于选择性披露样本，普遍隐去了合同期限、最低业务量承诺以及客户毛利率。独立尽调仍需审计企业合同的服务等级协议（SLA）与库存损耗条款，例如
              Stord 统一规定的 0.5% 免赔率及每磅 $0.50 的责任赔偿上限。
