      - number: '3.3'
        title: 定价架构、产品打包与总体拥有成本
        blocks:
          - type: paragraph
            body: >-
              外包物流市场的商业打包机制，折射出行业在平衡软件与人工成本上的不同思路。Stord 推行高端一体化定价模式：将年度软件平台费（第三方运营基准常指其起步价接近每年 $30,000 或每月 $800 至
              $2,500）与拣选打包可变操作费（每单 $2.10 至 $3.50）、托盘或立方英尺仓储费以及承运商转嫁运费捆绑收取。这一定价机制将 Stord 塑造成高投入门槛的企业级方案，为月发货量低于 2,000
              单的品牌设置了重重阻碍。相比之下，Shipfusion 等专用 3PL 竞对虽设有月度最低消费，但主打完全按项拆解的操作账单；Flexe 等按需仓储网络则纯粹按托盘流转计费。在小微企业端，Forthsuite
              等原生集成 Shopify 的库存工具推行每月 $19.99 起的固定月租，且免收 SKU 附加费。由于 Stord
              未公布标准化费率表，亦未公开软件订阅毛利率，买家不得不面对销售主导的定制化方案，其总体拥有成本很大程度上取决于合同履约量承诺与杂费谈判结果。
