      - number: '4.2'
        title: 商业化拓展机制、网络经济学与单位毛利驱动因素
        blocks:
          - type: paragraph
            body: >-
              其商业化拓展引擎主要依靠获客寻求全美两日地面覆盖、却不愿自建供应链设施的高增长 DTC 及中端全渠道品牌。Stord 部署了由约 20 个自营履约节点与 80
              处运行自研操作系统的合作网点构成的混合网络，使其得以在 100
              处仓储网点间履约订单，同时无需承担全部地产租赁债务。毛利率对仓储人工利用率、包裹承运商折扣、运费费率波动及杂费回收率高度敏感。尽管实体履约产生的是合同物流商常见的薄弱毛利，但自研路由软件与 AI
              驱动的承运商运费优化工具带来了每件包裹最高节省 10% 运费的实证成效，使 Stord 得以捕获运营利差。尽调时需重点核实其营收增长究竟源于稳固的客户内生留存，还是主要靠历次 8 起收购并表业务量推高的账面冲刺。
