      - number: '6.4'
        title: 留存韧性、扩张飞轮与集中度风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Stord 的业务扩张势头强劲，但其留存韧性与扩展动能暴露出值得投资人警惕的尽调风险。公司通常遵循由点及面的增销路径：先以单点包裹费率优化切入，继而延伸至多地仓储、订单管理系统及对话式 AI
              数据分析。然而，第三方软件评测网站与用户反馈折射出错杂的满意度信号：在 37 条公开评价中，Stord 综合评分仅为 4.0 / 5.0 分；用户对其即时库存透明度颇多褒奖，但在 G2
              上的客户支持子项得分偏低。此外，小型商家将不透明的定制报价和过高的平台保底费视作落地实施中的主要阻力。物流行业分析师亦提示，依靠历次 8
              起企业收购换来的快速增长带来了客户整合摩擦、软件统一阻碍以及运营留存风险；一旦客户流失提速，公司的软件估值倍数恐将承压。
            claimRefs:
