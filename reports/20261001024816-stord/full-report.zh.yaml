            body: >
              Stord 在 Series F 轮获得的 $3.0B 估值，依托 AI 与软件叙事，对应此前披露约 ~$150M 收入运行率（run-rate）的 ~20x 隐含估值倍数。若增长放缓或公开市场将其视作重资产
              3PL 定价，公司将面临显著的下调轮（down-round）风险或估值压缩。
