      - number: '1.3'
        title: 运营保障、外延并购扩张与关键尽调盲区
        blocks:
          - type: paragraph
            body: >-
              Stord 实体网络的迅猛扩张主要受外延并购推动，过去六年间完成了 8 起战略收购。重大交易包括从 UPS 手中收购 Ware2Go、2025 年收购软件初创公司 Penny Black、2026 年 1 月从
              CEVA Logistics 收购 Shipwire，以及接管原 Quiet Logistics
              履约中心。行业分析师指出，激进并购虽带来即时营收与客户体量，却会引入严重的整合摩擦和运营复杂度；若投资者将并入的货运与履约收入按高毛利软件定价，还会扭曲估值倍数。此外，Stord
              的标准仓储合同条款严格限制了客户追索权：普通仓储赔偿责任上限为每单品每磅 $0.50 与合同总责任上限中的较低者，索赔主张必须在 60 天内正式提交，诉讼程序必须在 9 个月内启动，且在判定责任前设有 0.5%
              的库存损耗免赔率。该类法律条款虽保护了 Stord 的营业利润率，却将巨额库存下行风险转嫁给货主客户，凸显出细致核查合同条款的必要性。
            claimRefs:
              - CO014
              - CO015
              - CO016
      - number: '1.4'
        title: 专题图表
        blocks:
          - type: callout
            title: 激进并购整合与软件估值倍数风险
            body: >-
              Stord 六年内完成了 8 起企业收购，包括从 CEVA Logistics 收购 Shipwire、从 UPS 收购 Ware2Go 以及收购 Penny Black。并购主导战略虽将名义 GMV 推升至
              $15 billion 以上，却在异构 IT 技术栈之间引发了运营摩擦；若并入的低毛利货运与仓储收入无法产生软件级的单位经济效益，将面临投资者下调估值的风险。
            calloutType: risk
