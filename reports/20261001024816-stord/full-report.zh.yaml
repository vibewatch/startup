      - number: '5.2'
        title: 分布式系统架构与 Stord Labs AI 自动化
        blocks:
          - type: paragraph
            body: >-
              Stord 的技术架构采用事件驱动的微服务模式，将分布式运营服务同高并发实体执行解耦 [CE003, CE004]。主要后端服务依托运行在 Google Cloud Platform（GCP）上的
              Elixir、Phoenix 和 OTP 监督树支撑核心物流逻辑，涵盖订单路由、库存状态机、仓储任务队列与运输调度，底层配备 PostgreSQL 数据库与 Apache Kafka 消息流 [CE003,
              CE004]。前端 Web 应用由 TypeScript 和现代化 React 构建，调用后端 API 与统一组件设计系统 [CE003, CE004]。为加快其约 20 个自营与约 80
              处合作履约网点的自动化进程，Stord 在亚特兰大总部建立了占地 10,000 平方英尺的实体智能中心 Stord Labs [CE005, CE006]。Stord Labs 接入生产操作系统每年处理的超 8
              billion 个数据点的实时交易数据，研发并验证智能体 AI 工作流、机器人自动化及动态包裹路由 [CE005, CE006]。
            claimRefs:
