      - number: '8.2'
        title: 融资历程、估值倍数与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              Stord 的融资历程跨越了多轮风投市场周期，并在 2026 年 5 月的 Series F 轮达到顶峰。公司成立于 2015 年，2021 年 9 月以 $90M Series D 轮融资晋升独角兽，估值达
              $1.1B，并在 2022 年延伸至 $1.3B；2025 年 5 月又以 $1.5B 估值完成逾 $200M 股权与债权融资。自成立以来，Stord 累计获得约 $775M 至 $777M 融资，其中包括由
              Silicon Valley Bank 与 ORIX USA 联合提供的 $120M 成长型债权授信。充裕的资本储备支撑了其激进的并购策略，先后将 UPS 旗下的 Ware2Go、Penny Black 以及
              Ceva Logistics 旗下的 Shipwire 等六家公司收入囊中，迅速拼装出实体仓储网络能力。


              分析的核心挑战在于 Series F 交易隐含的估值倍数扩张。Multiples.vc 测算 Stord 截至 2026 年 5 月的营收为 $147M，对应 20.4x
              远期营收倍数（EV/Revenue）。相较 Series D 的 11.3x 与 Series E 的 15.0x，倍数出现显著跳升。对比供应链领域的上市与非上市公司，Stord
              的估值倍数溢价极高。上市物流运营商 Delhivery 交易倍数仅为 2.5x 营收，EquipmentShare 为 1.7x，科技赋能车队平台 Motive 达 6.1x，仅 Peregrine.ai
              等垂直软件厂商享有更高倍数。风投观察者固然指出稳固的物流基础设施在维持高增长时享有溢价，但将 Stord 锚定在 20.4x 营收倍数，一旦增速放缓，股权持有者将承受剧烈的倍数压缩冲击。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
