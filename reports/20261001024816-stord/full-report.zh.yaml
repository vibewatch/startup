chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、治理架构与核心体系
        blocks:
          - type: paragraph
            body: >-
              Stord, Inc. 成立于 2015 年 10 月，总部位于佐治亚州亚特兰大，是由首席执行官 Sean Henry 和首席技术官 Jacob Boudreau 创办的商业赋能与供应链平台。Stord
              自称为「The Consumer Experience Company」，运行垂直整合的商业模式，意在抹平独立 DTC 及 B2B 品牌在面对 Amazon Prime 时的竞争劣势。Stord
              并非纯软件供应商，亦非传统重资产第三方物流商（3PL），而是将涵盖订单管理、仓储管理、包裹承运商优化以及购前与购后消费者体验工具的自研云端软件，同分布式实体履约网络结合。在运营端，Stord 在全球统筹近 100
              处履约设施，包含约 20 个自营节点与 80 处经审核的合作网点，全部由单一操作系统统一调度。高管团队由联合创始人 Sean Henry 领衔，协同总裁兼首席运营官 Steve Swan、首席财务官 John
              McDonough、产品高级副总裁 Craig Stewart 以及联合创始人 Jacob Boudreau。尽管创始人主导保持了执行效率，但公司的混合运营布局使得系统对核心高管领导力与统一平台稳定运行高度依赖。
