        blocks:
          - type: callout
            title: 严苛合同责任上限保护 Stord 资产负债表却损耗商家信任
            body: >
              Stord《仓储条款》将赔偿责任限制在每件每磅 $0.50，设立 0.5% 的库存损耗免责门槛，全盘免除退单赔付（chargeback），并禁止超过 9 个月的法律索赔主张。此类条款虽保护了 Stord
              的资产负债表，但在出现库存差异事件时，极易引发与企业级客户的履约摩擦。
