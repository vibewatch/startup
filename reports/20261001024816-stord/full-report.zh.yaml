      - number: '4.3'
        title: 资本充足率、债务负担与投资评估结论
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月完成 $250M F 轮融资并达成 $3.0B 投后估值后，Stord 累计融资金额突破 $775M+。这笔现金注入充实了资产负债表现金储备，不仅为亚特兰大实体智能与机器人研发中心 Stord
              Labs 提供了充足资金，也使日常运营免受短期流动性压力困扰。然而，若不审计历史债务责任，尤其是 2025 年 5 月从 ORIX 和 SVB
              获得的传统债务额度之条款与限制性契约，便无法充分评估其资本充足程度。行业分析师强调，若激进的并购式扩张放缓，混合物流整合商将面临估值下调风险，并援引 Flexport 估值由 $8B 跌至 $2B
              作为警示前例。鉴于非公开报告缺失净收入留存率、软件毛利率及偿债备付率等关键数据，一旦被定性为重资产物流运营商而非纯科技平台，Stord 的 $3B 估值将面临严重的倍数压缩风险。
