              - CV013
      - number: '8.3'
        title: 情景分析、下行情境触发点与尽职调查诉求
        blocks:
          - type: paragraph
            body: >-
              从乐观、基准与悲观三种运营情景审视 Stord，其当前入场估值蕴含高度不对称的风险结构。在乐观情景（概率 25%）下，Stord 成功扩张软件订阅业务至总营收 50% 以上，推动毛利率升至 45% 以上，最终促成
              $5.0B 至 $6.0B（1.7x 至 2.0x MOIC）的公开上市。在基准情景（概率 50%）下，Stord 保持稳健执行，收入运行率达到 $250M，但综合毛利率仍受限于 25 至 30%，退出估值落在
              $3.0B 至 $3.5B 之间，仅勉强保全 Series F 投资人本金。


              悲观情景（概率 25%）凸显了物流分析师 Eric Pong 等业内专家警示的实质下行风险：连续并购带来运营摩擦与估值套利风险。若公开市场将 Stord 重新锚定为重资产物流运营商，其估值或将下修至 $1.2B
              至 $1.5B，招致 50% 的本金亏损。此外，标准仓储条款将 Stord 的货物破损赔偿责任限制在每磅 50 美分，该条款虽维系了营业利润率，却在发生货物灭失时给客群关系带来破裂风险。同时，$120M 的
              SVB 与 ORIX 授信负债偿付也会掣肘日常运营灵活度。在重估跟踪（track）立场前，拟投资方必须厘清关键尽调盲区，重点索取分部毛利率、客户总流失率群组（gross churn
              cohorts）以及债务契约合规凭证。
            claimRefs:
              - CV004
              - CV008
              - CV011
              - CV014
