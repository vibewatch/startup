      - number: '7.3'
        title: 合作网络依赖、定价阻力与估值悬顶风险
        blocks:
          - type: paragraph
            body: >
              Stord 的商业架构依赖两大外部核心要素：第三方合作履约中心与聚合包裹承运商。为防范去中介化，Stord《仓储条款》第 19 条以严格反绕道约定绑定商家，有效期覆盖合同期及终止后一年，禁止直接招揽任何
              Stord Partner Network 仓储设施。定价上，RFP.wiki 与 EvolveAMZ 的独立评估指出，Stord 不公布公开目录价，而采用定制报价：经常性平台年费通常约 $30,000
              起，另收浮动仓储费、每单 $2.10 至 $3.50 的拣选打包费及运输附加费。高额平台费对年收入 $10M 以下的中小商家形成显著接纳阻力，使 Stord 的目标客群基本限于高单量企业品牌。财务上，Stord
              于 2026 年 5 月 Series F 轮融资中估值翻倍至 $3B，融资总额超 $775M。物流分析师 Eric Pong 等业内观察人士提醒，Stord 六年完成八起收购（涵盖 Ware2Go、Penny
              Black 与 Shipwire）的高频并购策略推高了运营复杂度与整合风险，若增长减速且公开市场将其按重资产物流运营商而非纯软件平台估值，或将面临估值压缩。
