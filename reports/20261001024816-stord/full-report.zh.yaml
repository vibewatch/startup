          - type: callout
            title: 实体智能与垂直整合护城河
            body: >-
              依托约 20 个自营履约节点与 80 处合作网点组成的混合网络（全部运行 Stord 统一操作系统），Stord 每年捕获超 8 billion 个数据点。Stord Labs
              利用这批实际生产订单流训练自研机器人与智能体 AI 模型，建立起纯软件仿真无法复刻的业务反馈链路。
            calloutType: insight
