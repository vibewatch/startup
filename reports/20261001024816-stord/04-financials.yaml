callouts:
  - calloutType: "risk"
    title: "Valuation Multiple Compression and Roll-Up Integration Risk"
    body: "Stord's $3B valuation in its Series F represents a doubling of enterprise value over twelve months, pricing the business at an aggressive multiple exceeding 20x historical $150M baseline revenue. As industry analysts warn by referencing Flexport's 75% valuation decline, scaling logistics through frequent acquisitions—including eight transactions such as Ware2Go and Shipwire—introduces substantial operational integration overhead. If growth decelerates or public markets price Stord as an asset-intensive logistics operator rather than a pure software platform, valuation compression will be severe."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
  - calloutType: "insight"
    title: "Capital Adequacy vs Debt Covenant Visibility"
    body: "The fresh $250M equity injection in May 2026 resolves near-term cash burn concerns and provides multi-year operating runway to commercialize Stord Labs robotics and agentic AI. However, financial diligence remains blocked by the absence of disclosure regarding the debt covenants, liquidity minimums, and repayment schedules associated with the May 2025 ORIX and Silicon Valley Bank credit facilities."
    claimRefs:
      - "CI009"
      - "CI011"
      - "CI012"
