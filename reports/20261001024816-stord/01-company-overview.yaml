chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2015 and headquartered in Atlanta, Stord provides an integrated cloud supply chain platform combining software orchestration, physical fulfillment, and AI-driven automation. In May 2026, the company raised a $250 million Series F funding round led by Strike Capital at a $3.0 billion valuation, bringing cumulative capital raised past $775 million while scaling network volume to more than $15 billion in annual gross merchandise value across over 1,000 brand customers. However, reliance on aggressive M&A, strict warehouse liability caps, and unverified private operational metrics require rigorous ongoing diligence."
sections:
  - id: "company-identity-and-mission"
    title: "Company Identity, Governance, and Core Architecture"
    body: "Stord, Inc. is an Atlanta, Georgia-based commerce enablement and supply chain platform founded in October 2015 by Chief Executive Officer Sean Henry and Chief Technology Officer Jacob Boudreau. Self-styled as 'The Consumer Experience Company,' Stord operates a vertically integrated commerce model designed to level the playing field for independent direct-to-consumer and business-to-business brands competing against Amazon Prime. Rather than functioning as a pure software vendor or a conventional asset-heavy third-party logistics provider, Stord couples proprietary cloud software—including order management, warehouse management, parcel carrier optimization, and pre- and post-purchase consumer experience tools—with a distributed physical fulfillment network. Operationally, Stord coordinates nearly 100 fulfillment facilities worldwide, comprising approximately 20 company-operated nodes and 80 vetted partner facilities, unified under a single operating system. Executive leadership remains anchored by co-founder Sean Henry, alongside President and Chief Operating Officer Steve Swan, Chief Financial Officer John McDonough, Senior Vice President of Product Craig Stewart, and co-founder Jacob Boudreau. While founder-led continuity has preserved execution speed, the company's hybrid operational footprint concentrates significant systemic dependency in key executive leadership and unified platform uptime."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
      - "TO002"
    figureRefs:
      - "FO001"
  - id: "capitalization-and-scale"
    title: "Capitalization Trajectory, Investor Syndicate, and Scale Benchmarks"
    body: "Stord reached a headline valuation of $3.0 billion in May 2026 upon closing a $250 million Series F financing round led by Strike Capital, alongside participation from long-term backers Kleiner Perkins, Founders Fund, Franklin Templeton, Baillie Gifford, G Squared, Bond, and Lux Capital. This round doubled Stord's valuation from $1.5 billion in May 2025 and brought cumulative institutional equity and debt raised to more than $775 million since inception. Management reported approximately 10x revenue expansion over the four-year period from 2022 to 2026, pointing to an inflection point following the introduction of generative AI workflows in 2023. Software bookings reportedly doubled quarter-over-quarter in the first quarter of 2026, supported by modular offerings such as StordAI and Stord Labs, an Atlanta-based robotics and physical intelligence testbed. Across its physical and digital operations, Stord powers more than $15 billion in annual gross merchandise value for over 1,000 customers, processing parcels that reach approximately one in four United States households annually. However, because Stord remains private, standalone audited revenue, net revenue retention, software-only annual recurring revenue, and gross profit margins by segment remain undisclosed, leaving key SaaS multiple assumptions subject to private diligence confirmation."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "operational-risks-and-legal-terms"
    title: "Operational Safeguards, Inorganically Driven Scale, and Critical Diligence Gaps"
    body: "Stord's rapid physical expansion has been heavily accelerated by inorganic consolidation, completing eight strategic acquisitions over the past six years. Material transactions include the acquisition of Ware2Go from UPS, software startup Penny Black in 2025, Shipwire from CEVA Logistics in January 2026, and the takeover of former Quiet Logistics fulfillment facilities. Industry analysts note that while aggressive M&A provides immediate revenue and customer volume, it introduces acute integration friction, operational complexity, and valuation multiple distortion if investors price acquired freight and fulfillment revenue as high-margin software. Furthermore, Stord's standard contractual warehouse terms impose restrictive limits on customer recourse: general warehouse liability is capped at the lesser of $0.50 per pound per article or the contract General Liability Cap, claims must be formally submitted within 60 days, legal proceedings must be initiated within nine months, and warehouse shrinkage is shielded by a 0.5% inventory variance threshold before liability attaches. These legal structures protect Stord's operating margins but transfer substantial inventory downside to shipper clients, underscoring the need for detailed contract review."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
