callouts:
  - calloutType: "risk"
    title: "Aggressive M&A Integration vs. Software Valuation Multiple Risk"
    body: "Stord has completed eight corporate acquisitions in six years—including Shipwire from CEVA Logistics, Ware2Go from UPS, and Penny Black. While this acquisition-led strategy has propelled headline GMV beyond $15 billion, it creates operational friction across disparate IT stacks and risks investor re-rating if acquired low-margin freight and warehouse revenues fail to yield software-grade unit economics."
    claimRefs:
      - "CO014"
      - "CO015"
  - calloutType: "insight"
    title: "Physical Intelligence and Vertical Integration Moat"
    body: "By operating a hybrid network of approximately 20 owned fulfillment nodes and 80 partner facilities all running Stord's unified operating system, Stord captures over 8 billion data points annually. Stord Labs leverages this production order flow to train proprietary robotics and agentic AI models, creating an operational feedback loop that cannot be replicated in pure software simulations."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
