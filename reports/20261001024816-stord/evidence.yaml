evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements detailing GAAP revenue, gross margin by segment (software SaaS vs.
      fulfillment/transportation), and exact customer gross churn and net revenue retention (NRR) rates.
    whyItMatters: >-
      Determines whether Stord's 10x top-line expansion and $3.0B valuation reflect durable, high-margin software
      economics or capital-intensive logistics volume with acquisition integration drag.
    diligencePath: >-
      Request confidential audited income statements, segment revenue schedules, and cohort-level NRR/gross retention
      reports under NDA during formal diligence review.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - id: gap-leadership-enumeration
    type: enumeration-incomplete
    severity: minor
    topic: leadership-governance
    missingEvidence: >-
      Comprehensive listing of Stord's full 10-member executive committee and board of directors including independent
      board members.
    whyItMatters: >-
      Independent board oversight and committee governance are essential to evaluating key-person risk, corporate
      controls, and IPO readiness.
    diligencePath: >-
      Request corporate governance records, cap table voting agreements, and board committee charters from company
      counsel.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - id: gap-investor-map-enumeration
    type: enumeration-incomplete
    severity: minor
    topic: stakeholder-governance
    missingEvidence: >-
      Full capitalization table disclosing exact ownership percentages, liquidation preference seniority, and debt
      covenant terms.
    whyItMatters: >-
      Determines common shareholder dilution, downside protection hurdles for Series F preference holders, and debt
      overhang.
    diligencePath: >-
      Inspect the certified cap table, Series F stock purchase agreements, and credit facility loan agreements under
      NDA.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: tam-sizing
    missingEvidence: >-
      Audited segment revenue breakdown between high-margin software subscriptions (Stord One OMS/WMS) and lower-margin
      physical warehousing and parcel fulfillment services.
    whyItMatters: >-
      Without segment revenue splits, investors cannot verify the standalone TAM penetration of Stord's software
      platform or validate whether SaaS revenue multiples apply to its blended $15B GMV scale.
    diligencePath: >-
      Request customer cohort revenue waterfall and audited GAAP income statements segmenting software ARR from physical
      pass-through logistics billings.
    relatedQuestionRefs:
      - QM001
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: pricing-transparency
    missingEvidence: >-
      Standardized customer pricing schedules, volume discount tiers, and implementation fee structures across merchant
      gross merchandise value bands.
    whyItMatters: >-
      Opaque pricing prevents third-party validation of customer unit economics and makes estimating merchant payback
      periods speculative.
    diligencePath: >-
      Review historical customer master services agreements (MSAs) and rate cards across mid-market and enterprise
      customer cohorts.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-and-gross-margin
    missingEvidence: >-
      Audited rate cards, contract-specific platform fee discount schedules, and gross margin breakdowns between Stord
      One software subscriptions and physical warehouse pass-through fulfillment services.
    whyItMatters: >-
      Without itemized software versus logistics margin disclosures, underwriting cannot confirm whether Stord commands
      a durable SaaS gross margin premium over traditional 3PL competitors or functions primarily as a lower-margin
      logistics broker.
    diligencePath: >-
      Request customer contract samples and management disclosure of software subscription gross margin versus
      pass-through freight and fulfillment gross margins under NDA.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: debt-covenants
    missingEvidence: >-
      Audited debt facility agreements specifying financial covenants, minimum liquidity thresholds, debt service
      ratios, and maturity schedules for ORIX and SVB debt.
    whyItMatters: >-
      Without debt covenant schedules, underwriters cannot determine whether Stord's $250M equity cushion is encumbered
      by mandatory debt service or restrictive minimum cash balance rules.
    diligencePath: >-
      Obtain the master credit agreement and latest covenant compliance certificates from Stord's legal and banking data
      room.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-segmentation
    missingEvidence: >-
      GAAP breakdown of revenue and gross margin between software subscriptions (OMS/WMS) and physical logistics
      pass-through fulfillment services.
    whyItMatters: >-
      Valuation of $3B reflects a premium software multiple; if gross margin is heavily weighed down by low-margin
      freight and warehouse labor, the multiple is fundamentally stretched.
    diligencePath: >-
      Request management's audited product-line P&L statements showing revenue, cost of goods sold, and gross margin by
