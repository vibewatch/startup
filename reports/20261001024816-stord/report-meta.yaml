  topStrengths:
    - Large and growing hybrid network combining software control and physical fulfillment
    - More than 1,000 brand customers and $10B+ to $15B GMV throughput
    - Strong sponsor syndicate and continued investor willingness to fund expansion
    - Stord Labs and AI automation provide a plausible product differentiation path
  topRisks:
    - Segment margins remain opaque, making the 20.4x revenue multiple hard to underwrite
    - Acquisition-led growth increases integration complexity and multiple-compression risk
    - Debt covenant terms and repayment profile are not publicly disclosed
    - Warehouse liability caps and partner-network dependency shift operational risk to customers
  unresolvedGaps:
    - Audited segment-level revenue, ARR, and gross-margin disclosure separating software from fulfillment services
    - Customer churn, NRR, and top-account concentration across the 1,000+ brand base
    - ORIX and SVB debt covenant terms, repayment schedule, and compliance headroom
    - SOC 2 Type II and disaster-recovery evidence for enterprise procurement diligence
