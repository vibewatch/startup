summary:
  headline: >-
    Stord's $3.0B Series F and $10B+ GMV scale support a track stance, but opaque segment margins and debt covenants
    keep the valuation case fair-to-stretched.
  overallScore: 7
  recommendation: track
  confidence: medium
  riskRating: medium
  valuationStance: fair
