companyProfile:
  summary: >-
    Stord is an Atlanta-based commerce-enablement and supply-chain platform founded in 2015 that combines order
    management, warehouse management, parcel optimization, consumer experience tooling, and AI automation with a hybrid
    fulfillment network. The company serves direct-to-consumer, omnichannel, and enterprise brands that want Amazon-like
    delivery performance without surrendering brand control or customer relationships. Its private operating model
    leaves segment-level software margins, audited revenue, and customer retention durability only partially disclosed.
