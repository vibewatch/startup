  title: Company Overview
  summary: Establish Solugen's identity, leadership, funding, scale, and milestone trail so later chapters can reuse stable
    ground truth.
sections:
- id: identity
  title: Identity and operating model
  body: 'Solugen remains a Houston-based biomanufacturing company built around a chemienzymatic “Bioforge” platform. The company
    describes itself as a chemicals manufacturer rather than a software or pure biotech startup: it uses enzymes, catalysts,
    and renewable feedstocks to make industrial ingredients that can replace petroleum-derived inputs. The refreshed evidence
    still points to a B2B model anchored in process chemistry, with products aimed at water treatment, agriculture, cleaning,
    construction, personal care, and energy uses. The most important operating question is not whether the platform exists—it
    clearly does—but how quickly it can keep scaling without losing the efficiency and local-production advantages that differentiate
    it. That keeps the refresh grounded in operating reality instead of headline-only narrative. The company still reads like
    a commercial manufacturing story, not a lab-only research story.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  tableRefs:
  - TO001
  figureRefs: []
- id: capital
  title: Capitalization, leadership, and support base
  body: 'The company''s capital stack and governance remain tightly tied to the founders and a small set of climate-focused
    growth investors. Public sources still converge on a 2022 Series D north of $200 million and a 2021 Series C of $357 million,
    while later private-market profiles imply a larger cumulative stack once DOE-guaranteed project financing is included.
    Leadership fit is strong: Chakrabarti contributes the biology and medical-science lens, while Hunt contributes industrial
    chemistry and scale-up intuition. The flip side is that key-person dependence stays meaningful, because the business still
    depends on founder-led technical judgment and investor support for the next manufacturing phase.'
  claimRefs:
  - CO004
  - CO005
  - CO008
  - CO011
  - CO012
  tableRefs:
  - TO002
  - TO003
  figureRefs: []
- id: milestones
  title: Milestones, scale, and remaining gaps
  body: 'The best available milestone trail shows a company that moved from a prototype and early customer pull toward commercial
    manufacturing, then into a larger second-facility buildout. Public refresh evidence supports a commercial Houston plant,
    a 2024 DOE loan guarantee announcement, and a planned 500,000-square-foot Marshall site adjacent to ADM. The unresolved
    diligence questions are less about whether Solugen is real and more about how current the external visibility is: revenue
    remains privately estimated, headcount is source-dependent, and the Marshall schedule should still be treated as a live
    execution risk rather than a guaranteed outcome. That progression is visible in both the financing stack and the manufacturing
    footprint, which is why the commercial ramp still matters as much as the capital story.'
  claimRefs:
  - CO006
  - CO007
  - CO009
  - CO010
  tableRefs: []
  figureRefs:
  - FO001
