  summary: Concentrate the adverse evidence, legal history, scale-up risk, and disclosure gaps that define Solugen's downside
    case.
sections:
- id: events
  title: Adverse events and execution stressors
  body: 'The refresh surfaces a real but manageable set of adverse events. The most concrete legal risk is the 2019 Harris
    County matter involving confidentiality and non-compete allegations. The most important operating stressor is scale-up
    complexity: even the R&D compute stack needed to be reworked to keep pace with the business. None of this says the company
    is broken; it says the company operates in a category where physical execution risk is inherently high and where litigation,
    IP, and operational complexity should be expected rather than surprising.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  tableRefs:
  - TR001
  - TR002
  figureRefs:
  - FR001
- id: financing-risk
  title: Project-finance and commercial opacity
  body: The financing picture also carries risk. The DOE guarantee is conditional, which means the capital stack is not as
    closed as a press release might suggest. At the same time, private-market listings and independent revenue estimates show
    that external observers still lack full operating visibility. That does not invalidate the company's story, but it does
    mean a diligence memo cannot assume everything that looks like capital is already fully deployed, and it cannot assume
    that current revenue quality is as strong as the headline funding round implies. The practical implication is that diligence
    still needs to separate announced capacity from operationally available capacity, especially when a project is still crossing
    from construction into steady-state production.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR010
  tableRefs:
  - TR003
- id: summary
  title: Downside case and what still deserves top attention
  body: 'The downside case is not that Solugen is a pure marketing story. The downside case is that it is a real industrial
    business that could still under-deliver if a capital-intensive platform fails to scale into repeatable economics. The
    public record is strong enough to justify optimism, but not strong enough to relax the diligence standard. In priority
    order, the next questions are still legal/IP history, DOE close mechanics, customer concentration, and the true profitability
    of the operating plant. Those are the issues that would change the risk score most quickly. The most useful posture is
    disciplined skepticism: assume the company can be real, valuable, and still under-disclosed at the same time. The most
    constructive interpretation is that Solugen is investable only if the next stage proves the same rigor in customer and
    finance reporting that it already shows in process engineering.'
  claimRefs:
  - CR008
  - CR009
  - CR011
  - CR012
  tableRefs: []
