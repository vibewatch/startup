      - number: '2.3'
        title: 买方逻辑与决策约束
        blocks:
          - type: paragraph
            body: >-
              买方属于工业客户，涉及多元利益相关方。终端使用者看重产品性能；采购部门关注总成本与供应可靠性；可持续发展团队注重碳排放；而在受监管或面向政府的工作流中，合规往往成为推动变革的触发条件。这种决策结构导致采纳周期慢于典型的初创公司销售周期，因为新型化学品供应商不仅需要证明技术有效性，还必须验证工艺连续性、仓储、运输及认证准入。不过，一旦产品完成嵌入，这种复杂性同样会筑起极具防御力的客户壁垒。因此，Solugen
              模式的落脚点在于切入客户切换成本最高、且更安全或更环保方案价值最易量化的场景。这也解释了为何最理想的客户往往并非采购规模最大者，而是面临切换痛点最深的企业。
            claimRefs:
              - CM005
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
