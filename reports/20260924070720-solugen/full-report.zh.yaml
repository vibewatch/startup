        title: 资本结构、领导层与支持阵营
        blocks:
          - type: paragraph
            body: >-
              公司的资本结构与治理架构依然紧密系于创始人及少数专注于气候科技的成长期投资机构。公开信息普遍显示其 2022 年完成了超 $200 million 的 D 轮融资，以及 2021 年完成了 $357
              million 的 C 轮融资；若计入 DOE 担保的项目融资，后续私募市场资料显示其累计资本规模更为庞大。领导层与业务高度契合：Chakrabarti 带来生物学与医学视角，Hunt
              则提供工业化学与工程放大直觉。硬币的另一面是，关键人物依赖依然显著，因为进入下一制造阶段时，该业务仍仰赖创始人主导的技术判断以及投资者的持续支持。
