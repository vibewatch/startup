      - number: '2.2'
        title: 市场测算视角与采纳经济学
        blocks:
          - type: paragraph
            body: >-
              公开资料中并没有针对 Solugen 的明确 TAM/SAM/SOM 数据，因此最稳妥的尽调路径是多方交叉验证。Lowercarbon 将更广泛的化学品市场定义为一个 $6 trillion 的庞大行业，CNBC
              与 IEA 的估算则指出该行业碳排放强度极高。这些数字印证了潜在市场空间极为广阔，却无法直接推导 Solugen
              究竟能捕获多少份额。针对此类业务，更合理的测算思路应当是：哪些产品系列能在性价比上与现有方案持平，哪些客户重视本地化生产，以及哪些应用场景能够接纳新的供应链。答案很可能是“涉及诸多领域，但绝非全部”。
            claimRefs:
