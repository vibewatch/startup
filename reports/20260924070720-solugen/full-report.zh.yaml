companyProfile:
  summary: >-
    Solugen 是总部位于 Houston 的工业化学品与生物制造公司，由 Gaurab Chakrabarti 与 Sean Hunt 于 2016 年创立。公司利用 Bioforge
    平台将可再生原料转化为工业化学品，服务于水处理、农业、清洁、建筑、个人护理及能源市场。公司已完成多轮大额风险投资，获得一项有条件的 DOE 贷款担保，目前正致力于证明其 Houston 工厂与 Marshall
    扩建项目能够扩展为具备持久竞争力的分布式制造网络。
