      - number: '4.3'
        title: 营收、利润率与依然存在的能见度缺口
        blocks:
          - type: paragraph
            body: >-
              与清晰的融资结构相反，公司的经营损益表依然极不透明。公开信息表明该业务收入至少已迈入九位数规模，可能处于 $100 million
              以上区间，但未见任何经审计的公开申报文件以确认营收、利润率、烧钱速度或现金跑道。这一点尤为关键，因为缺乏真实的分母，估值倍数便无从谈起。因此，本次更新保留了最初的审慎立场：其实际业务体量可能比外界看起来更为强劲，但在管理层披露更多信息之前，最客观的结论依然是其财务全貌属于估算而非完全验证。在管理层公布可审计的运营指标前，所有关于估值的讨论在很大程度上都只是对执行信心的投射，而非对其底层利润率质量的准确衡量。
            claimRefs:
