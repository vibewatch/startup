figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Solugen 的公开记录展示了从原型化学技术走向商业化工厂、大额融资以及 Marshall 工厂建设的推进历程。
    data:
      items:
        - label: 创立
          date: '2016'
          detail: Gaurab Chakrabarti 与 Sean Hunt 在 Houston 创立该初创企业。
        - label: 原型 / 中试
          date: '2018'
          detail: 早期 Bioforge 装置成型并初步建立客户吸引力。
        - label: C 轮
          date: '2021'
          detail: 357M 轮次融资与 $1.8B+ 估值标志着大规模扩张资本就位。
        - label: D 轮
          date: '2022'
          detail: 融资超 $200M，估值超过 $2B。
        - label: DOE 贷款担保
          date: '2024'
          detail: 宣布获得附带条件的 $213.6M 贷款担保。
        - label: Marshall 工厂扩建
          date: '2025'
          detail: 500,000-sq-ft 设施被定位为下一阶段的核心扩建项目。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO008
      - CO010
    section: milestones
  - id: FM001
    title: 市场规模与采纳时间线
    type: timeline
    summary: 化工行业机遇体量庞大、碳排放密集，且受制于客户采纳节奏，而非单一清晰的 TAM。
    data:
      items:
        - label: 化工行业基本盘
          date: '2018'
          detail: $6T 全球行业规模框架与高碳排放强度。
        - label: 排放视角
          date: '2021'
          detail: IEA 与 CNBC 预估化工生产产生 880M 吨 CO2 排放。
        - label: 公司愿景
          date: '2022'
          detail: Solugen 声称其技术可覆盖广泛的化学品门类。
        - label: 买方客群
          date: '2024'
          detail: 水处理、农业、混凝土、清洗、个人护理、能源、国防。
        - label: 分布式生产
          date: '2025'
          detail: Bioforge 网络构想与本地化生产逻辑。
        - label: 测算断层
          date: '2026'
          detail: 未见经公开审计且针对 Solugen 的 TAM/SAM/SOM 数据。
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM008
      - CM012
    section: sizing
  - id: FP001
    title: 竞争格局时间线
    type: timeline
    summary: Solugen 所处赛道涵盖合成生物同行、传统化工替代品，以及行业内屡见不鲜的规模化失利前车之鉴。
    data:
      items:
        - label: 2021 年对标同行
          date: '2021'
          detail: CNBC 提及 Ginkgo、Amyris、Origin Materials 以及 Zymergen 时期的行业担忧。
        - label: 2022 年 Tracxn 监测范围
          date: '2022'
          detail: 广泛的竞争格局涵盖数百家活跃同行。
        - label: 2024 年传统巨头压力
          date: '2024'
          detail: BASF、Dow、LyondellBasell 及类似传统行业巨头仍构成替代威胁。
        - label: 2025 年平台优势
          date: '2025'
          detail: Bioforge 模块化与本地化供应仍是最清晰的切入支点。
        - label: 2026 年护城河疑问
          date: '2026'
          detail: 业务持久度取决于经济模型的可复制性与客户资质认证成效。
        - label: 2026 年执行风险
          date: '2026'
          detail: 赛道内过往失败案例拉高了对规模化验证的证明门槛。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP012
    section: risk
  - id: FI001
    title: 融资与估值时间线
    type: timeline
    summary: Solugen 的资本结构从早期原型研发资金演进为数亿美元规模的工业级规模化叙事。
    data:
      items:
        - label: 2017 年种子轮
          date: '2017'
          detail: 原型研发资金与首笔工厂建设投入。
        - label: 2019 年 B 轮
          date: '2019'
          detail: $32M 轮次融资与早期规模化信号。
        - label: 2021 年 C 轮
          date: '2021'
          detail: $357M 轮次融资与 $1.8B 估值。
        - label: 2022 年 D 轮
          date: '2022'
          detail: 融资超 $200M，估值超过 $2B。
        - label: 2024 年 DOE 贷款担保
          date: '2024'
          detail: 资本结构中引入附带条件的项目融资。
        - label: 2025-2026 年估值预估
          date: 2025-2026
          detail: 一级市场模型测算区间约为 $850M 至 $2B。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI012
    section: funding
  - id: FE001
    title: 产品与工厂推进时间线
    type: timeline
    summary: Solugen 平台已从原型化学技术走向商业化工厂、更丰富的产品线以及更大规模的下一代基地建设。
    data:
      items:
        - label: 2016 年概念成型
          date: '2016'
          detail: 围绕酶与催化剂构建的生物基化学构想成型。
        - label: 2018 年原型阶段
          date: '2018'
          detail: 基于 PVC 管道的早期 Bioforge 装置及首批客户销售落地。
        - label: 2021 年 Houston 工厂
          date: '2021'
          detail: 商业化 Bioforge 工厂规划为 20,000 sq ft 面积与 10,000 t/yr 产能。
        - label: 2022 年产品矩阵拓展
          date: '2022'
          detail: 形成多个产品家族与大幅扩容的研发管线。
        - label: 2024 年计算加速
          date: '2024'
          detail: Cloud303 案例显示研发工作流在 AWS Batch 上完成规模化扩展。
        - label: 2025 年 Marshall 工厂扩建
          date: '2025'
          detail: 公开材料披露占地 500,000-sq-ft 的下一代工厂规划。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE010
      - CE011
    section: footprint
  - id: FU001
    title: 客户采纳时间线
    type: timeline
    summary: 公开客户证据从早期水处理销售延伸至合规要求严苛、工作流复杂的工业级重点客户。
    data:
      items:
        - label: 2020 年拓展水处理市场
          date: '2020'
          detail: BioChelate 及类似产品进入服务商分销渠道。
        - label: 2021 年工业客群拓展
          date: '2021'
          detail: 客户群体拓展至工业及贴近消费端的多元应用场景。
        - label: 2023 年销售运营体系建设
          date: '2023'
          detail: 定价、样品寄送与客诉处理工作流成为必需体系。
        - label: 2024 年 CMMC 合规要求
          date: '2024'
          detail: Virtru 案例揭示政府合同带来的合规要求。
        - label: 2025 年 B2B 业务广度
          date: '2025'
          detail: 公开介绍资料仍强调跨多个细分领域的工业需求。
        - label: 2026 年客户信息断层
          date: '2026'
          detail: 具名客户集中度仍未披露。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU011
    section: proof
  - id: FR001
    title: 风险演进时间线
    type: timeline
    summary: Solugen 的下行情景主要取决于诉讼纠纷、规模化放大复杂性，以及尚未解决的融资与披露疑问。
    data:
      items:
        - label: 2019 年法律诉讼
          date: '2019'
          detail: 竞业禁止与商业秘密诉讼见诸公开记录。
        - label: 2021 年同行警示
          date: '2021'
          detail: Zymergen 规模化失利成为行业前车之鉴。
        - label: 2022 年盈利能力考量
          date: '2022'
          detail: 据 Bloomberg 报道 Solugen 虽已实现可观盈利，但规模化经济模型仍是关键。
        - label: 2024 年 DOE 贷款条件
          date: '2024'
          detail: 贷款担保仍附带生效条件。
        - label: 2025-2026 年公开透明度不足
          date: 2025-2026
          detail: 收入、利润率及客户集中度仍未披露。
        - label: 2026 年执行力疑问
          date: '2026'
          detail: Marshall 工厂产能爬坡仍待独立证实。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR012
    section: events
  - id: FV001
    title: 估值演变时间线
    type: timeline
    summary: 公开估值标杆保持在高位，但由于公司属于非上市实体且收入披露匮乏，各方数据分歧明显。
