      - number: '1.3'
        title: 里程碑、规模与未决缺口
        blocks:
          - type: paragraph
            body: >-
              从目前掌握的里程碑轨迹来看，公司已从原型验证和早期客户需求拉动走向商业化制造，进而推进规模更大的第二座工厂建设。公开更新证据印证了商业化运转的 Houston 工厂、2024 年公布的 DOE 贷款担保，以及毗邻
              ADM 规划的 500,000 平方英尺 Marshall 基地。尽调中尚未解决的疑问，不在于 Solugen 的真实性，而在于外部能见度究竟有多新：收入依然仅见私募口径预估，员工数因信息源而异，且
              Marshall 项目的投产进度仍应视为动态执行风险，而非板上钉钉的结果。这种演进在融资结构与制造布局中均有迹可循，这也是为何商业化放量依然与资本叙事同等关键。
