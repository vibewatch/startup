  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 技术栈与工艺逻辑
        blocks:
          - type: paragraph
            body: >-
              Solugen 的产品本质上是一套工艺革新体系：其将生物学与化学相结合，以更低反应温度、更低废弃物排放的工艺路径取代化石密集型工序。Bioforge
              正是公司对这一体化制造技术栈的代名词。尽调的核心要点在于，该平台绝非仅仅产出某种新分子，而是提供了一种远比传统化工厂更快速设计、测试和生产分子的工程化路径。只要能在规模化扩产中持续跑通，该技术便极具吸引力；但这也意味着相较于单一产品的发布，持续的运营一致性与收率把控更为关键。
            claimRefs:
              - CE001
              - CE002
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE012
      - number: '5.2'
        title: 商业化落地与制造扩产
        blocks:
          - type: paragraph
            body: >-
              公开资料依然印证了公司早已超越纯实验室研发阶段。Houston Bioforge 被描述为占地 20,000 平方英尺、年产能 10,000 公吨的工厂，而 Marshall
              项目则代表了在规模与复杂度上的下一级跃迁。这种进阶至关重要，因为唯有将相同的化学工艺复制至更大规模的设施中且不损失经济效益，Solugen
              的投资逻辑才具备可投资性。换言之，公司已经回答了“能否造出产品”的问题；尚未解决的悬念在于，其能否在同等工艺纪律下持续成倍制造产品。尽调的核心考量在于，更大规模的扩建能否依然维持原有的收率、开工率以及本地化采购优势。
            claimRefs:
