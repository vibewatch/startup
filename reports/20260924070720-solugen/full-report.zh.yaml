chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              Solugen 仍是一家依托化酶一体“Bioforge”平台的 Houston
              生物制造公司。公司将自身定位为化学品制造商，而非软件或纯生物技术初创公司：其利用酶、催化剂和可再生原料制造工业原料，以替代石油基原料。更新后的证据依然表明其为立足工艺化学的 B2B
              商业模式，产品面向水处理、农业、清洁、建筑、个人护理以及能源用途。最核心的运营问题不在于平台是否存在——答案显然是肯定的——而在于其能否在不丧失差异化效率与本地化生产优势的前提下快速扩大规模。这使本次更新始终立足于运营现实，而非停留在纯宣传叙事上。公司依然展现出商业化制造企业的面貌，而非仅停留在实验室阶段的研发故事。
            claimRefs:
              - CO001
              - CO002
              - CO003
