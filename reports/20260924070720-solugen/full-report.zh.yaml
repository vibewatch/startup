  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资沿革与当前资本结构
        blocks:
          - type: paragraph
            body: >-
              Solugen 的融资历程依然是尽调档案中最为有力的积极信号之一：公司已从种子期原型逐步演进为完成多轮超大额风投的工业级平台。目前公开梳理的格局包括 2021 年 C 轮、2022 年 D 轮，以及 2024
              年获得的 DOE
              有条件贷款担保，后者实质性地将资本结构拓宽至纯股权之外。这并不代表业务毫无风险，而是表明由于其平台被认定为具备现实落地能力而非纯实验性概念，公司得以持续吸引大型投资机构并获取非稀释性资金支持。这些里程碑同样意义重大，因为它们展现了成熟投资方屡次愿意为重资产工艺平台注资，而非仅停留在实验室阶段概念。
