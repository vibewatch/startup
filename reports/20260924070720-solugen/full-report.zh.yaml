  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              界定 Solugen 的目标市场应立足于特种化学品与分布式生物制造，而非局限于单一分子或 SaaS
              式的细分品类。相关的可比对象涵盖石化巨头、传统配方厂商以及能够切入相同工业工作流的替代性低碳技术路径。这种界定方式至关重要，因为公司并非试图在抽象意义上“颠覆化学”，而是着眼于替代那些价格、物流、碳排放与供应链安全同时起决定作用的特定采购模式。因此，审视该市场的合理视角必须兼顾工艺经济性与终端用途细分，并为多种替代品留出考量空间。
            claimRefs:
              - CM001
              - CM010
              - CM011
