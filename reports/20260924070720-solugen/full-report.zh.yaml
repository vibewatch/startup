          detail: $1.8B 估值锚点。
        - label: 2022 年 D 轮
          date: '2022'
          detail: 投后超 $2B 估值锚点。
        - label: 2025 年 UpMarket
          date: '2025'
          detail: 二级市场模型测算估值约 $2.0B。
        - label: 2026 年 Tracxn
          date: '2026'
