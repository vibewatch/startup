      - number: '4.2'
        title: 估值区间及其内涵
        blocks:
          - type: paragraph
            body: >-
              本次数据更新并未得出单一明确的估值数字，原因在于各公开来源在统计口径上存在分歧，且公司仍属非上市企业。最站得住脚的参考锚点依然是 2022 年超 $2 billion 的 D
              轮估值，但根据不同测算方法以及是否纳入类债权支持，私募市场服务机构给出的区间仍在约 $850 million 至 $2 billion
              之间。这种估值分歧本身就耐人寻味：公司固然极具价值，但市场显然将其定价为一个仍待执行兑现的成长故事，而非已经完全消除风险的成熟工业资产。如此宽泛的区间绝不能被视为精确估值，它更多是在提醒我们，私营公司的定价依然被有限的信息披露与市场情绪所主导。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI012
