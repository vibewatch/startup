  title: Product & Technology
  summary: Explain Solugen's Bioforge platform, plant footprint, and technology pipeline as a commercial manufacturing system.
sections:
- id: stack
  title: Technology stack and process logic
  body: 'Solugen''s product story is fundamentally a process story: it combines biology and chemistry to replace fossil-intensive
    steps with a lower-temperature, lower-waste route. The Bioforge is the company''s shorthand for that integrated manufacturing
    stack. The key point for diligence is that the platform is not just a new molecule, but a way to design, test, and manufacture
    molecules faster than a traditional chemical plant would. That makes the technology attractive if it continues to work
    at scale, but it also means operational consistency and yield control matter more than a single product launch.'
  claimRefs:
  - CE001
  - CE002
  - CE009
  tableRefs:
  - TE001
- id: footprint
  title: Commercial footprint and manufacturing scaling
  body: Public sources still support the view that the company is beyond lab-only status. The Houston Bioforge has been described
    as a 20,000-square-foot, 10,000-metric-ton-per-year plant, while the Marshall project represents the next step up in scale
    and complexity. That progression matters because Solugen's thesis only becomes investable if the same chemistry can be
    copied into larger facilities without losing economics. In other words, the company has already answered the question
    “can it make product?”; the open question is whether it can keep making more product with the same process discipline.
    The practical diligence issue is whether that next step preserves yield, uptime, and local-procurement advantages at larger
    scale.
  claimRefs:
  - CE003
  - CE004
  - CE010
  - CE011
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: pipeline
  title: Product breadth, R&D, and operating discipline
  body: 'The product portfolio is broader than a single line of chemistry. Public coverage references commercial water-treatment
    inputs like BioPeroxide, BioSol, ScavSol, and BioChelate, plus a much larger R&D pipeline. That breadth helps explain
    why the company still looks like a platform rather than a one-product startup. The Cloud303 case study is useful because
    it shows the other side of the business: even the research workflow needed to be industrialized so the company could iterate
    faster. That combination of wet-lab chemistry and compute-heavy research is part of what makes the platform defensible
    if execution remains tight. That wider research and commercialization stack is part of why the company looks more like
    an industrial platform than a single-product supplier.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE012
  - CE013
  tableRefs:
  - TE003
  figureRefs: []
