  topStrengths:
    - 差异化 Bioforge 平台已实现真实商业化生产，工业应用场景覆盖广泛
    - 拥有顶级投资方背书，且获得美国能源部（DOE）有条件支持的融资路径，助力大规模扩产
    - 在水处理、农业、清洁与工业应用领域跑通了 B2B 商业落地
    - 相比传统石化巨头，本地化制造模式能有效减少物流周转并降低碳排放
  topRisks:
    - 规模化放量执行风险依然是核心问题，尤其是 Marshall 工厂及未来新厂的落地
