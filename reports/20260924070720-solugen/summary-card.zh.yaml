    - 美国能源部（DOE）及项目融资支持仍属于有条件批准，尚未完全完成交割
    - 若执行出现偏差，传统石化巨头与邻近生物制造厂商的竞争仍可能挤压护城河
  unresolvedGaps:
    - 收入与毛利率尚未在公开申报文件中得到独立验证
    - Marshall 工厂的投产时间表与当前运营状态仍仅得到部分证实
    - 客户集中度与具体注名的承购协议仍未披露
