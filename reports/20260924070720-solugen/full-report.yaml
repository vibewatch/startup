      - number: '8.2'
        title: Why estimates scatter
        blocks:
          - type: paragraph
            body: >-
              The scatter across UpMarket, Tracxn, and other private-market references is not a bug; it is the natural
              result of a private company with no audited public financials. Some estimates are model-based, some are
              stale, and some count only equity while others fold in DOE-backed support. That means the correct
              analytical posture is to bracket the valuation rather than pretend precision exists. In this refresh, the
              bracket still looks stretched rather than cheap, but the label matters less than the underlying reason:
              there is enough evidence for scale, but not enough for clean public-market comparison. Put differently,
              the spread reflects both stale data and genuine uncertainty about whether the latest scale-up facts
              justify a premium or a discount.
            claimRefs:
              - CV003
