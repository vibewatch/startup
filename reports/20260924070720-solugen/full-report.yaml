companyProfile:
  summary: >-
    Solugen is a Houston-based industrial chemicals and biomanufacturing company founded in 2016 by Gaurab Chakrabarti
    and Sean Hunt. The company uses its Bioforge platform to convert renewable feedstocks into industrial chemicals for
    water treatment, agriculture, cleaning, construction, personal care, and energy markets. It has raised multiple
    large venture rounds, secured a conditional DOE loan guarantee, and is now trying to prove that its Houston plant
    and Marshall expansion can scale into a durable distributed manufacturing network.
