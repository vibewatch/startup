  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Technology stack and process logic
        blocks:
          - type: paragraph
            body: >-
              Solugen's product story is fundamentally a process story: it combines biology and chemistry to replace
              fossil-intensive steps with a lower-temperature, lower-waste route. The Bioforge is the company's
              shorthand for that integrated manufacturing stack. The key point for diligence is that the platform is not
              just a new molecule, but a way to design, test, and manufacture molecules faster than a traditional
              chemical plant would. That makes the technology attractive if it continues to work at scale, but it also
              means operational consistency and yield control matter more than a single product launch.
            claimRefs:
              - CE001
              - CE002
              - CE009
          - type: table
