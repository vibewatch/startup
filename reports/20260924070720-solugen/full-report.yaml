              - CE012
      - number: '5.2'
        title: Commercial footprint and manufacturing scaling
        blocks:
          - type: paragraph
            body: >-
              Public sources still support the view that the company is beyond lab-only status. The Houston Bioforge has
              been described as a 20,000-square-foot, 10,000-metric-ton-per-year plant, while the Marshall project
              represents the next step up in scale and complexity. That progression matters because Solugen's thesis
              only becomes investable if the same chemistry can be copied into larger facilities without losing
              economics. In other words, the company has already answered the question “can it make product?”; the open
              question is whether it can keep making more product with the same process discipline. The practical
              diligence issue is whether that next step preserves yield, uptime, and local-procurement advantages at
              larger scale.
