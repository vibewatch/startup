        title: Product breadth, R&D, and operating discipline
        blocks:
          - type: paragraph
            body: >-
              The product portfolio is broader than a single line of chemistry. Public coverage references commercial
              water-treatment inputs like BioPeroxide, BioSol, ScavSol, and BioChelate, plus a much larger R&D pipeline.
              That breadth helps explain why the company still looks like a platform rather than a one-product startup.
              The Cloud303 case study is useful because it shows the other side of the business: even the research
              workflow needed to be industrialized so the company could iterate faster. That combination of wet-lab
              chemistry and compute-heavy research is part of what makes the platform defensible if execution remains
              tight. That wider research and commercialization stack is part of why the company looks more like an
              industrial platform than a single-product supplier.
