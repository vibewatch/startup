      - number: '3.2'
        title: Differentiation that matters
        blocks:
          - type: paragraph
            body: >-
              The clearest advantage remains the Bioforge operating model: a modular plant built around enzymes and
              catalysts, positioned for rapid scale-up and localized production. Public coverage still suggests the
              company has moved farther toward commercial relevance than many of its synthetic-biology predecessors. But
              the edge is only durable if it survives contact with industrial procurement. Customers do not buy process
              elegance; they buy dependable supply, price, and performance. In other words, the competitive moat is real
              only if the company can keep shipping product with stable unit economics. That is why the companys edge
              should be judged on operational repeatability as much as on narrative quality.
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP012
      - number: '3.3'
        title: Competitive fragility and what could still break
        blocks:
          - type: paragraph
            body: >-
              There is still a big gap between a compelling climate narrative and a defensible industrial business.
              Incumbents have scale and customer trust, and some adjacent biomanufacturing companies have already shown
              how expensive it is to scale too early or too fast. That means Solugen has to keep proving three things at
              once: that it can make the product reliably, that customers will keep qualifying it into real operations,
              and that the economics improve enough for a buyer to switch away from the status quo. The field is
              competitive enough that any one of those failures could slow the story materially. The most important
              warning is that customers can revert to safer, slower, but better-understood incumbents if any part of the
              delivery promise slips.
            claimRefs:
              - CP006
              - CP008
              - CP010
