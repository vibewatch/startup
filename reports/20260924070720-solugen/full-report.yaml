  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer channels and segment breadth
        blocks:
          - type: paragraph
            body: >-
              The public evidence shows a broad but still lightly quantified customer base. Solugen is not selling a
              consumer product; it is selling industrial chemistry into regulated or operationally sensitive workflows
              where performance, safety, and supply reliability matter. That means the customer conversation is usually
              with procurement, operations, and technical stakeholders at the same time. The visible segments span water
              treatment, agriculture, construction, personal care, cleaning, energy, aerospace, and defense. The
              important diligence point is that the business has breadth, but it still lacks the sort of named-account
              transparency that would make concentration analysis easy. That breadth is useful, but it also means the
              company still needs to prove that the business can convert different segments into repeatable revenue
              rather than one-off pilots.
