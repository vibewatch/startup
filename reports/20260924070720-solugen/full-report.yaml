  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Solugen's market should be framed around specialty chemicals and distributed biomanufacturing, not around
              a single molecule or a SaaS-style category. The relevant comparison set includes petrochemical incumbents,
              conventional formulators, and alternative low-carbon routes that can sell into the same industrial
              workflows. That framing matters because the company is not trying to “own chemistry” in the abstract; it
              is trying to displace specific buying patterns where price, logistics, emissions, and supply security all
              matter at once. The right market lens therefore combines process economics with end-use segmentation and
              leaves room for several substitutes.
            claimRefs:
              - CM001
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM010
      - number: '2.2'
        title: Sizing lenses and adoption economics
        blocks:
          - type: paragraph
            body: >-
              There is no clean public TAM/SAM/SOM for Solugen, so the best diligence path is to triangulate.
              Lowercarbon frames the broader chemicals market as a $6 trillion industry, while CNBC and IEA estimates
              point to massive emissions intensity in the sector. Those numbers support the idea that the prize is
              large, but they do not tell us how much Solugen can capture. For this business, a better way to think
              about sizing is: which product families can reach parity on price and performance, which customers value
              localized production, and which applications can tolerate a new supply chain. The answer is likely “many,
              but not all.”
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
