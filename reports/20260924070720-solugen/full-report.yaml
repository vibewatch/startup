  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Adverse events and execution stressors
        blocks:
          - type: paragraph
            body: >-
              The refresh surfaces a real but manageable set of adverse events. The most concrete legal risk is the 2019
              Harris County matter involving confidentiality and non-compete allegations. The most important operating
              stressor is scale-up complexity: even the R&D compute stack needed to be reworked to keep pace with the
              business. None of this says the company is broken; it says the company operates in a category where
              physical execution risk is inherently high and where litigation, IP, and operational complexity should be
              expected rather than surprising.
