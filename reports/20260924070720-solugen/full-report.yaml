      - number: '7.2'
        title: Project-finance and commercial opacity
        blocks:
          - type: paragraph
            body: >-
              The financing picture also carries risk. The DOE guarantee is conditional, which means the capital stack
              is not as closed as a press release might suggest. At the same time, private-market listings and
              independent revenue estimates show that external observers still lack full operating visibility. That does
              not invalidate the company's story, but it does mean a diligence memo cannot assume everything that looks
              like capital is already fully deployed, and it cannot assume that current revenue quality is as strong as
              the headline funding round implies. The practical implication is that diligence still needs to separate
              announced capacity from operationally available capacity, especially when a project is still crossing from
              construction into steady-state production.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
