        title: What public customer proof exists
        blocks:
          - type: paragraph
            body: >-
              There is enough customer evidence to show the business is real. CNBC reported BioChelate sales through
              water-treatment service providers, Virtru showed the company had government-compliance pressure from
              DoD-adjacent work, and the SME case study showed the sales organization had to formalize pricing and
              sample-management workflows as the business scaled. Those signals are important because they indicate the
              company is past the “can anyone buy this?” stage. The remaining question is how repeatable and
              concentrated those wins are, because repeatability—not just one-off traction—is what will determine the
              next phase of growth. That evidence is meaningful because it shows the company has moved beyond purely
              aspirational customer language and into actual operating workflows. The throughline is that the company
              has evidence of real use, but the market still cannot see how concentrated or durable those relationships
              are.
