      - number: '6.3'
        title: What still is not public
        blocks:
          - type: paragraph
            body: >-
              The largest customer gap is still transparency. The refresh does not surface a precise customer count,
              top-account list, or revenue concentration metric, so the diligence view is inevitably qualitative. That
              is not unusual for a private industrial company, but it matters because Solugen's go-to-market motion
              depends on technical qualification and channel relationships rather than a software-style self-serve
              funnel. As a result, the right question for the next diligence pass is not merely “do customers exist?”
              but “which customers are material, repeatable, and durable enough to justify the next wave of capital?”
              The key diligence question is whether the visible workflow improvements map to durable, concentrated
              accounts or just to early commercial organization building.
