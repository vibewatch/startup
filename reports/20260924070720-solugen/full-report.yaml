              - CR005
              - CR008
              - CR012
      - number: '7.3'
        title: Downside case and what still deserves top attention
        blocks:
          - type: paragraph
            body: >-
              The downside case is not that Solugen is a pure marketing story. The downside case is that it is a real
              industrial business that could still under-deliver if a capital-intensive platform fails to scale into
              repeatable economics. The public record is strong enough to justify optimism, but not strong enough to
              relax the diligence standard. In priority order, the next questions are still legal/IP history, DOE close
              mechanics, customer concentration, and the true profitability of the operating plant. Those are the issues
              that would change the risk score most quickly. The most useful posture is disciplined skepticism: assume
              the company can be real, valuable, and still under-disclosed at the same time. The most constructive
              interpretation is that Solugen is investable only if the next stage proves the same rigor in customer and
              finance reporting that it already shows in process engineering.
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Best available valuation anchor
        blocks:
          - type: paragraph
            body: >-
              The refresh still anchors on a valuation above $2 billion, because that is what the company itself said in
              2022 and what several third-party profiles continue to echo in one form or another. But that anchor should
              be read as a private-market reference point, not as a market-clearing public quote. Solugen is still a
              high-variance industrial scale-up with real traction, and the valuation reflects that: investors are
              paying for the optionality of multiple Bioforge deployments, not for a mature, fully transparent cash-flow
              machine. That anchor remains useful only as a reference, because private-company valuation can move
              materially without a visible public tape.
            claimRefs:
              - CV001
