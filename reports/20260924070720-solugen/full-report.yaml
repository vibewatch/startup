          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV011
      - number: '8.3'
        title: Recommended stance and why
        blocks:
          - type: paragraph
            body: >-
              The recommended stance remains track. That is not a downgrade from quality; it is a reflection of evidence
              gaps. Solugen has a defensible technology platform, real capital, and a plausible path to a meaningful
              industrial company, but the refresh still lacks the disclosure quality needed to turn a high-level story
              into a comfortable valuation call. A higher conviction would require better visibility into revenue
              quality, margins, customer concentration, and the final shape of the Marshall ramp. Until then, the
              valuation is compelling but not clean enough to move beyond cautious observation. The discipline here is
              to wait for disclosure that would let the market price revenue quality, margin durability, and the
              Marshall ramp with less guesswork.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
