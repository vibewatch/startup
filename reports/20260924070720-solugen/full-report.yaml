              - CM012
      - number: '2.3'
        title: Buyer logic and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer side is industrial and multi-stakeholder. End users care about product performance; procurement
              cares about total cost and supply reliability; sustainability teams care about emissions; and in regulated
              or government-facing workflows, compliance can be the trigger for change. That structure makes adoption
              slower than a typical startup sales cycle, because a new chemistries vendor has to prove not just
              technical efficacy but also process continuity, storage, transport, and qualification. The same
              complexity, however, creates defensible account depth once the product is embedded. Solugen's model
              therefore depends on landing where the customer's switching cost is highest and the value of a safer or
              cleaner route is easiest to quantify. This is why the best customers are often the ones with the highest
              switching pain rather than the biggest addressable volume.
            claimRefs:
              - CM005
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peer set and broader competitive field
        blocks:
          - type: paragraph
            body: >-
              Solugen competes in a crowded but imperfectly comparable field. The near peers are synthetic-biology and
              biomanufacturing companies that promise lower-carbon chemistry, while the broader field also includes
              incumbents that simply sell the same end-use chemistry with more scale. That matters because Solugen does
              not need to be the only climate-chemicals company; it needs to win enough use cases where customers value
              local supply, safer processing, or better economics. The competitive question is therefore not whether
              there are alternatives—it is whether Solugen can stay differentiated while the field matures. The field is
              broad enough that Solugen is compared not only with specific startups but with entire categories of
              chemical suppliers and process developers.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
