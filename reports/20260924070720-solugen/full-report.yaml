        title: Revenue, margins, and the remaining visibility gap
        blocks:
          - type: paragraph
            body: >-
              Unlike the capital stack, the operating P&L remains opaque. Public sources suggest the business is at
              least in nine-figure revenue territory and may be in the $100 million-plus range, but there is no audited
              public filing to settle revenue, margin, burn, or runway. That matters because valuation multiples are
              hard to judge without a real denominator. The refresh therefore preserves the original caution: the
              business may be larger and stronger than it looks from outside, but until management discloses more, the
              right conclusion is still that the financial picture is estimated rather than fully verified. Until
              management publishes auditable operating metrics, every valuation discussion remains partly a proxy for
