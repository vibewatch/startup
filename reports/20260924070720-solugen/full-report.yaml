chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Solugen remains a Houston-based biomanufacturing company built around a chemienzymatic “Bioforge”
              platform. The company describes itself as a chemicals manufacturer rather than a software or pure biotech
              startup: it uses enzymes, catalysts, and renewable feedstocks to make industrial ingredients that can
              replace petroleum-derived inputs. The refreshed evidence still points to a B2B model anchored in process
              chemistry, with products aimed at water treatment, agriculture, cleaning, construction, personal care, and
              energy uses. The most important operating question is not whether the platform exists—it clearly does—but
              how quickly it can keep scaling without losing the efficiency and local-production advantages that
              differentiate it. That keeps the refresh grounded in operating reality instead of headline-only narrative.
              The company still reads like a commercial manufacturing story, not a lab-only research story.
            claimRefs:
