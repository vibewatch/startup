sections:
- id: funding
  title: Financing chronology and current capital stack
  body: 'Solugen''s financing story is still one of the strongest signals in the dossier: the company has moved from a seed
    prototype to a venture-backed industrial platform with several very large rounds. The public picture now includes a 2021
    Series C, a 2022 Series D, and a 2024 DOE conditional loan guarantee that materially extends the capital stack beyond
    plain equity. The implication is not that the business is risk-free—it is that the company has been able to keep attracting
    large investors and non-dilutive support because the platform is perceived as real rather than experimental. Those milestones
    also matter because they show repeated willingness from sophisticated backers to finance a capital-intensive process platform
    rather than just a lab-stage concept.'
  claimRefs:
  - CI001
  - CI005
  - CI009
  - CI011
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: valuation
  title: Valuation range and what it means
  body: 'The refresh does not produce a clean single valuation number, because the available sources disagree on what should
    count and because the company is private. The most defensible anchor remains the 2022 Series D above $2 billion, but private-market
    services still show a spread from roughly $850 million to $2 billion depending on methodology and whether one includes
    debt-like support. That spread is itself informative: the company is valuable, but the market is clearly pricing it as
    an execution story rather than as an already-de-risked industrial asset. That spread is wide enough that it should not
    be read as precision; it is mainly a reminder that private-company pricing is still dominated by sparse disclosure and
    market sentiment.'
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI012
  tableRefs:
  - TI002
- id: opacity
  title: Revenue, margins, and the remaining visibility gap
  body: 'Unlike the capital stack, the operating P&L remains opaque. Public sources suggest the business is at least in nine-figure
    revenue territory and may be in the $100 million-plus range, but there is no audited public filing to settle revenue,
    margin, burn, or runway. That matters because valuation multiples are hard to judge without a real denominator. The refresh
    therefore preserves the original caution: the business may be larger and stronger than it looks from outside, but until
    management discloses more, the right conclusion is still that the financial picture is estimated rather than fully verified.
    Until management publishes auditable operating metrics, every valuation discussion remains partly a proxy for confidence
    in execution, not a measurement of underlying margin quality.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI010
  tableRefs:
  - TI003
