  title: Customers
  summary: Summarize the visible customer segments, adoption evidence, and the remaining opacity around named accounts and
    concentration.
sections:
- id: channels
  title: Customer channels and segment breadth
  body: The public evidence shows a broad but still lightly quantified customer base. Solugen is not selling a consumer product;
    it is selling industrial chemistry into regulated or operationally sensitive workflows where performance, safety, and
    supply reliability matter. That means the customer conversation is usually with procurement, operations, and technical
    stakeholders at the same time. The visible segments span water treatment, agriculture, construction, personal care, cleaning,
    energy, aerospace, and defense. The important diligence point is that the business has breadth, but it still lacks the
    sort of named-account transparency that would make concentration analysis easy. That breadth is useful, but it also means
    the company still needs to prove that the business can convert different segments into repeatable revenue rather than
    one-off pilots.
  claimRefs:
  - CU001
  - CU002
  - CU007
  tableRefs:
  - TU001
- id: proof
  title: What public customer proof exists
  body: There is enough customer evidence to show the business is real. CNBC reported BioChelate sales through water-treatment
    service providers, Virtru showed the company had government-compliance pressure from DoD-adjacent work, and the SME case
    study showed the sales organization had to formalize pricing and sample-management workflows as the business scaled. Those
    signals are important because they indicate the company is past the “can anyone buy this?” stage. The remaining question
    is how repeatable and concentrated those wins are, because repeatability—not just one-off traction—is what will determine
    the next phase of growth. That evidence is meaningful because it shows the company has moved beyond purely aspirational
    customer language and into actual operating workflows. The throughline is that the company has evidence of real use, but
    the market still cannot see how concentrated or durable those relationships are.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU001
- id: gaps
  title: What still is not public
  body: The largest customer gap is still transparency. The refresh does not surface a precise customer count, top-account
    list, or revenue concentration metric, so the diligence view is inevitably qualitative. That is not unusual for a private
    industrial company, but it matters because Solugen's go-to-market motion depends on technical qualification and channel
    relationships rather than a software-style self-serve funnel. As a result, the right question for the next diligence pass
    is not merely “do customers exist?” but “which customers are material, repeatable, and durable enough to justify the next
    wave of capital?” The key diligence question is whether the visible workflow improvements map to durable, concentrated
    accounts or just to early commercial organization building.
  claimRefs:
  - CU006
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
