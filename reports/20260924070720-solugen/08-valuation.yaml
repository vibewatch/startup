  title: Valuation
  summary: Bracket Solugen's current value, explain why the estimates diverge, and keep the recommendation at track until
    disclosure improves.
sections:
- id: anchor
  title: Best available valuation anchor
  body: 'The refresh still anchors on a valuation above $2 billion, because that is what the company itself said in 2022 and
    what several third-party profiles continue to echo in one form or another. But that anchor should be read as a private-market
    reference point, not as a market-clearing public quote. Solugen is still a high-variance industrial scale-up with real
    traction, and the valuation reflects that: investors are paying for the optionality of multiple Bioforge deployments,
    not for a mature, fully transparent cash-flow machine. That anchor remains useful only as a reference, because private-company
    valuation can move materially without a visible public tape.'
  claimRefs:
  - CV001
  - CV002
  - CV005
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: scatter
  title: Why estimates scatter
  body: 'The scatter across UpMarket, Tracxn, and other private-market references is not a bug; it is the natural result of
    a private company with no audited public financials. Some estimates are model-based, some are stale, and some count only
    equity while others fold in DOE-backed support. That means the correct analytical posture is to bracket the valuation
    rather than pretend precision exists. In this refresh, the bracket still looks stretched rather than cheap, but the label
    matters less than the underlying reason: there is enough evidence for scale, but not enough for clean public-market comparison.
    Put differently, the spread reflects both stale data and genuine uncertainty about whether the latest scale-up facts justify
    a premium or a discount.'
  claimRefs:
  - CV003
  - CV004
  - CV007
  - CV008
  - CV011
  tableRefs:
  - TV002
  - TV003
- id: stance
  title: Recommended stance and why
  body: The recommended stance remains track. That is not a downgrade from quality; it is a reflection of evidence gaps. Solugen
    has a defensible technology platform, real capital, and a plausible path to a meaningful industrial company, but the refresh
    still lacks the disclosure quality needed to turn a high-level story into a comfortable valuation call. A higher conviction
    would require better visibility into revenue quality, margins, customer concentration, and the final shape of the Marshall
    ramp. Until then, the valuation is compelling but not clean enough to move beyond cautious observation. The discipline
    here is to wait for disclosure that would let the market price revenue quality, margin durability, and the Marshall ramp
    with less guesswork.
  claimRefs:
  - CV006
  - CV009
  - CV010
  - CV012
  tableRefs: []
