  title: Market Analysis
  summary: Define the chemicals market boundary, buyer logic, and adoption constraints that matter for Solugen's growth and
    valuation.
sections:
- id: boundary
  title: Market boundary and status-quo substitutes
  body: Solugen's market should be framed around specialty chemicals and distributed biomanufacturing, not around a single
    molecule or a SaaS-style category. The relevant comparison set includes petrochemical incumbents, conventional formulators,
    and alternative low-carbon routes that can sell into the same industrial workflows. That framing matters because the company
    is not trying to “own chemistry” in the abstract; it is trying to displace specific buying patterns where price, logistics,
    emissions, and supply security all matter at once. The right market lens therefore combines process economics with end-use
    segmentation and leaves room for several substitutes.
  claimRefs:
  - CM001
  - CM010
  - CM011
  tableRefs:
  - TM001
- id: sizing
  title: Sizing lenses and adoption economics
  body: 'There is no clean public TAM/SAM/SOM for Solugen, so the best diligence path is to triangulate. Lowercarbon frames
    the broader chemicals market as a $6 trillion industry, while CNBC and IEA estimates point to massive emissions intensity
    in the sector. Those numbers support the idea that the prize is large, but they do not tell us how much Solugen can capture.
    For this business, a better way to think about sizing is: which product families can reach parity on price and performance,
    which customers value localized production, and which applications can tolerate a new supply chain. The answer is likely
    “many, but not all.”'
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyers
  title: Buyer logic and constraints
  body: The buyer side is industrial and multi-stakeholder. End users care about product performance; procurement cares about
    total cost and supply reliability; sustainability teams care about emissions; and in regulated or government-facing workflows,
    compliance can be the trigger for change. That structure makes adoption slower than a typical startup sales cycle, because
    a new chemistries vendor has to prove not just technical efficacy but also process continuity, storage, transport, and
    qualification. The same complexity, however, creates defensible account depth once the product is embedded. Solugen's
    model therefore depends on landing where the customer's switching cost is highest and the value of a safer or cleaner
    route is easiest to quantify. This is why the best customers are often the ones with the highest switching pain rather
    than the biggest addressable volume.
  claimRefs:
  - CM005
  - CM009
  - CM012
  tableRefs:
  - TM003
