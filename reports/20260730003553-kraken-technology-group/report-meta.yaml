  customerFocus: UK, U.S., and NATO-aligned defense and maritime-security buyers, especially navies, commandos, and special-operations users seeking autonomous maritime capability.
  businessModel: Contract-driven hardware and integration model built around platform delivery, payload integration, prototyping, and eventual support or sustainment, with economics likely shaped by sovereign manufacturing partners and government procurement cycles.
