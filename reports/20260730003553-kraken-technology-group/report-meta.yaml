companyProfile:
  summary: Kraken Technology Group is a British-founded maritime-defense startup founded in 2020 by Mal Crease and described by DTCP as headquartered in Fareham, United Kingdom. The company builds a modular family of autonomous maritime platforms spanning the K3 SCOUT surface vessel, the K4 MANTA hybrid surface-subsurface vehicle, and the larger K5 KRAKEN mission platform. Public customer proof is meaningful for a private defense hardware company, including a named Royal Navy order for 20 boats and a USSOCOM OTA with an up-to-$49 million cap, alongside allied manufacturing relationships in Germany, the United States, and Canada. Kraken raised a $175 million Series B in July 2026 at a $1 billion valuation, but the public record still does not disclose the revenue, margin, retention, partner-economics, or financing-term detail needed to cleanly translate strategic traction into a conviction underwriting case.
