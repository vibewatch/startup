  topStrengths:
    - 作为私营海事防务硬件公司，Kraken 的公开证据异常扎实：有具名 Royal Navy 订单、公开提及的 USSOCOM OTA，也有可见的盟国制造扩张。
    - 产品族不是概念叙事，而是具体且贴着任务场景，覆盖模块化水面和水下自主用例，能够映射到真实防务流程。
    - 投资人和伙伴组合混合了风投、主权和产业背书，增强采购可信度，也拓宽国际扩张选项。
    - 战略海事自主正在吸引高溢价资本关注；如果现有参考客户转化顺利，Kraken 的期权价值真实存在。
  topRisks:
    - $1 billion 估值很难靠公开证据审计，因为收入、毛利率、backlog 质量、留存、融资条款和伙伴经济性都未披露。
    - 客户和收入敞口似乎集中在少数主权防务锚点上，公开采用叙事的一部分仍像试验场、原型或早期部署。
    - 业务看起来偏硬件和集成，资本消耗可能很重；如果价值捕获或转化不及预期，估值倍数也应低于软件式经常性模式。
    - 跨境出口管制、认证和伙伴 QA 要求可能拖慢项目转化；若 Kraken 内部流程没有叙事中成熟，估值支撑会被削弱。
  unresolvedGaps:
    - 已确认收入、backlog、毛利率和平台级单位经济性均未公开披露。
    - 公开来源没有显示续约行为、期权行权历史、按金额划分的头部客户集中度，也没有持续舰队利用率指标。
    - Series B 的清算优先权、ratchet、债务叠加和治理权利仍不在公开记录中。
    - 出口管制流程归属、伙伴 QA 治理，以及详细可靠性或事故证据，仍是尽调事项，不是公开事实。
