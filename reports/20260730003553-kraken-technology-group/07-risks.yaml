- id: customer-partner-and-budget-transmission
  title: Customer, partner, and budget transmission risks
  body: 'Kraken’s customer and dependency risks are tightly linked. The same sovereign-customer concentration that makes wins strategically valuable also makes revenue timing unusually sensitive to procurement cycles and program sponsorship. GAO’s 2026 report says continuing resolutions delay or complicate defense activities, while the UK Parliament’s equipment-plan inquiry underscores institutional uncertainty in the UK procurement apparatus. For Kraken, these dynamics matter because public traction is still concentrated in a small set of defense anchors rather than in a broad recurring customer base. At the same time, international scaling relies on partners and localized production nodes in Germany, the United States, and Canada. Those relationships can accelerate adoption and sovereign fit, but they also create dependency on shared QA, scheduling, export-control alignment, and commercial incentives that remain private. The risk transmission path is straightforward: if a customer program
    slips, a partner schedule slips, or a cross-border compliance question pauses shipment, a hardware-heavy company can feel the impact quickly in bookings, manufacturing cadence, and valuation support. The positive reading is that Kraken has chosen strong strategic counterparties; the risk reading is that they are now part of the company’s operating system.'
