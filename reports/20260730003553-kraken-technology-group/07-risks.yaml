- id: mitigations-and-thesis-break-triggers
  title: Mitigations and thesis-break triggers
  body: 'The right risk conclusion is not that Kraken is uninvestable; it is that the burden of proof shifts from narrative to operating controls. Public mitigants exist. Named Royal Navy and USSOCOM engagement suggests serious customers have already tested Kraken’s credibility. Sovereign and defense-aligned investors reduce some financing and policy-friction concerns. Public platform pages also emphasize human-in-the-loop control, modularity, and mission-specific design rather than a fully unconstrained autonomy story. But those mitigants are incomplete until diligence can verify export-screening process ownership, partner QA governance, reliability data, and concentration by program. The most important thesis-break triggers are therefore measurable: evidence of export-control or security-process weakness, inability to convert prototypes and testbeds into stable programs, partner quality drift across sites, repeated budget-driven award slippage, or a private data room that still cannot
    show renewal, incident, or margin evidence. Kraken can likely absorb isolated friction; it will struggle if several of those vectors compound at once. That is why the residual rating should remain high even with a strategically strong narrative.'
