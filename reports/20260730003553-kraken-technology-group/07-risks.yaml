  title: Risks
  summary: Kraken’s highest residual risks come from cross-border defense regulation, still-thin public reliability evidence, sovereign-customer concentration, and the operational difficulty of scaling autonomous maritime hardware through multiple partners and jurisdictions. Public sources support a real mitigant set—named military customers, sovereign-capital support, human-in-the-loop positioning, and partner-backed manufacturing—but they do not yet close the evidence gaps on export-control controls, incident history, certification depth, or budget-sensitive program conversion.
sections:
- id: regulatory-and-legal-exposure
  title: Regulatory and legal exposure
  body: Kraken’s regulatory burden is more serious than a typical UK startup because its product, customers, investors, and manufacturing footprint all touch sensitive defense regimes. UK strategic export controls explicitly apply to goods, software, and technology and reference licensing, end-use controls, sanctions, penalties, and fines. The National Security and Investment Act provides a legal backdrop for scrutiny of transactions involving sensitive national-security capabilities. On the U.S. side, Kraken’s USSOCOM relationship and broader U.S. industrial ambitions point toward exposure to ITAR and other export-control rules even if public sources do not show the detailed compliance architecture yet. The practical risk is not that Kraken has been accused of violating these rules; no retained source shows that. The risk is that every cross-border payload, software update, data flow, investor right, or local-production arrangement may require more export screening and legal process than
    the company’s public surface suggests. Because the company is growing quickly across allied jurisdictions, process maturity matters almost as much as technical capability.
