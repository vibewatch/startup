- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export-control or legal-process weakness
    - Missed or unclear transfer approvals
    - Counsel or management cannot map platform, data, and jurisdiction controls cleanly
    - Pause underwriting until the company shows an auditable export-control matrix.
  - - Prototype-to-program conversion failure
    - Reference accounts remain developmental
    - Royal Navy or USSOCOM proof does not progress beyond trial / OTA milestones
    - Re-rate customer durability and cut valuation support.
  - - Reliability evidence gap persists
    - No quantitative fleet-performance package
    - Management cannot provide MTBF, incident, or sortie-success evidence under NDA
    - Treat product moat as narrative-heavy and increase residual risk.
  - - Cross-site quality drift
    - Partner manufacturing introduces rework or acceptance issues
    - Repeated quality escapes, delayed deliveries, or inconsistent support across sites
    - Discount scale assumptions and demand a centralized QA remediation plan.
  - - Budget / procurement timing shock
    - Major awards slip repeatedly
    - Program delays or continuing-resolution style pauses materially extend conversion timelines
    - Stress-test cash needs and shift recommendation toward wait-and-see.
  notes: Kill criteria are analytical thresholds derived from sourced risks rather than management forecasts or legal advice.
