- id: autonomy-reliability-safety-and-certification
  title: Autonomy reliability, safety, and certification burden
  body: 'Kraken’s second major risk cluster is operational and technical: public excitement has outpaced public reliability disclosure. The company markets K3, K4, and K5 across surface patrol, logistics, covert insertion, force protection, and strike or ASW roles, which means the fleet has to work in very different environmental and mission conditions. Meanwhile, the regulatory backdrop is becoming more formal. The Workboat Code Edition 3 applies to new workboats from December 2023, the IMO adopted a MASS Code in May 2026 with effect from July 2026, and class and assurance bodies such as LR and ABS frame autonomy in terms of verification, testing, integrity, and compliance. Kraken has some positive proof—Royal Navy-backed trials, named customers, and at least one public reference to K5 being coded to WBC3—but retained public sources still do not provide MTBF, sortie-success rates, incident logs, or portfolio-wide certification depth. That gap matters because autonomous maritime systems
    face harsh operational consequences from navigation, communications, or payload faults. Until Kraken opens test data and safety cases, reliability remains a real thesis risk rather than a solved marketing point.'
