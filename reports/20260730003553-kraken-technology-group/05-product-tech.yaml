  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: Sortie-success rates, MTBF, maintenance cycles, and incident log by platform.
    whyItMatters: A defence-maritime platform can be technically interesting yet operationally fragile.
    diligencePath: Request test data, fleet telemetry summaries, and after-action maintenance reports.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: payload-proof
    missingEvidence: List of payloads that are field-proven rather than theoretically compatible.
    whyItMatters: Modularity value depends on real integrations, not only open interfaces.
    diligencePath: Request customer-specific payload matrix, swap times, and test reports.
    relatedQuestionRefs:
    - QE005
    - QE010
    relatedTableRefs:
    - TE001
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: supportability
    missingEvidence: Spare-parts model, maintenance intervals, and deployed support concept.
    whyItMatters: Supportability is part of product readiness and cost to serve.
    diligencePath: Review logistics concept, training package, and maintenance doctrine by product family.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
  - type: missing-source
    severity: minor
    topic: certification-trail
    missingEvidence: Comprehensive list of certifications, coding regimes, waivers, and safety assessments by platform.
    whyItMatters: Trust and exportability depend on formal compliance posture.
    diligencePath: Request certification register and safety case documents for each platform.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: cross-site-quality-assurance
    missingEvidence: Quality-control system spanning Kraken and partner production sites.
    whyItMatters: Scaling via partners can create drift in performance or maintenance burden.
    diligencePath: Request QA manual, partner audit cadence, and nonconformance statistics by site.
    relatedQuestionRefs:
    - QE015
    - QE016
    relatedTableRefs:
    - TE005
