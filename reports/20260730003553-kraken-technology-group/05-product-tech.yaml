callouts:
- calloutType: strength
  title: Kraken’s strongest product differentiator is family architecture
  body: Kraken is not selling a single hull. The public product set spans high-speed surface, hybrid surface-subsurface, and higher-endurance payload-heavy missions, which is unusual for a young defence company.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
- calloutType: insight
  title: The moat may live in systems integration more than pure software
  body: Open interfaces, payload modularity, deployment logic, and partner-backed manufacturing suggest the product moat is the system architecture and operating model, not a black-box autonomy claim alone.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE017
  - CE018
  - CE028
