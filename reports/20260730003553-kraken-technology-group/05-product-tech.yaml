- id: architecture-and-operating-model
  title: Architecture, operating model, and deployment logic
  body: 'The architecture story is modular and operationally pragmatic. Kraken’s pages describe open interfaces to autonomy, mission-specific payload bays, multiple operating modes from supervised autonomy to remote piloting, and compatibility with legacy communications and command systems. K3 SCOUT and K4 MANTA both reference the Auterion operating system, while K5 KRAKEN references PX4 and open interfaces to autonomy, suggesting a philosophy of leveraging established autonomy tooling rather than a closed black box. The operating model is built around deployment, integration, operation, adaptation, and scale. Each product page repeats that sequence and treats manufacturability and standardized components as part of the design system. The consequence is that Kraken’s technology moat may sit as much in hull design, systems integration, and mission reconfiguration as in any single software module. It also means field reliability and human-on-the-loop control are central to product acceptance,
    especially in contested or high-sea-state environments. This architecture is attractive precisely because it is operationally legible. Buyers can see where autonomy ends, where human control remains, and where manufacturing discipline has to convert design ambition into repeatable field performance. It also creates a clearer diligence path: inspect interfaces, payload swaps, test data, and support procedures instead of relying only on headline marketing language. clearly.'
  claimRefs:
