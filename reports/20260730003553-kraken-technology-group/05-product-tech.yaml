chapter:
  number: 5
  title: Product & Technology
  summary: Kraken’s product story centers on a modular family of autonomous maritime platforms that span high-speed surface missions, hybrid surface-subsurface operations, and higher-payload strike or ASW roles. The main technical claims are around rapid re-role, open-interface autonomy, deployability, and partner-enabled production; the main diligence gap is independent proof on reliability, safety, and sustained field performance.
sections:
- id: platform-family-and-workflows
  title: Platform family in customer workflow terms
  body: 'Kraken’s product portfolio is structured as a family rather than a one-off vessel. K3 SCOUT is the core high-speed surface platform for maritime awareness, force protection, logistics, and precision strike roles; K4 MANTA extends the line into hybrid surface-subsurface operations for covert insertion, reconnaissance, and loitering; and K5 KRAKEN pushes toward higher-payload, longer-range strike, ASW, and multi-domain missions. In customer workflow terms, Kraken is trying to slot into the mission chain from deployment and insertion, to remote or supervised autonomous operation, to payload execution, to retrieval or sustainment. That matters because the technology proposition is not just “autonomy”; it is autonomy wrapped in deployable hulls, modular mission kits, and interfaces that fit legacy command-and-control structures. Public materials consistently describe rapid re-roling, air/land/sea transportability, and system-of-systems integration as the product value proposition rather
    than only raw speed or payload. It also means the buyer is underwriting workflow compression: fewer launch constraints, less crew exposure, and faster mission adaptation when the operator needs to change payload or tasking at short notice. That workflow framing is important because most defence customers buy outcomes and integration confidence, not abstract autonomy claims in isolation. overall.'
