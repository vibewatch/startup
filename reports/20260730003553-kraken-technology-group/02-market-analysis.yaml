callouts:
- calloutType: insight
  title: The market is real, but the labels are not interchangeable
  body: Analyst reports ranging from $1.7 billion to $10.5 billion are all directionally useful, but they measure different slices of maritime autonomy. A disciplined investment case should resist using the largest figure as Kraken’s near-term TAM.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM005
  - CM006
- calloutType: strength
  title: Doctrine and crisis dynamics are pulling demand forward
  body: Hormuz disruption, allied emphasis on hybrid fleets, and operator-led maritime-security needs all strengthen the case for persistent uncrewed platforms that can screen, sense, and reduce crew exposure.
  claimRefs:
  - CM013
  - CM017
  - CM018
  - CM023
  - CM024
- calloutType: risk
  title: Procurement friction is the main adoption bottleneck
  body: The core barrier is not awareness. It is whether navies and special operators can clear testing, trust, export-control, and integration hurdles quickly enough for programmes to turn into production revenue.
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
- calloutType: assumption
  title: Kraken’s SAM is narrower than headline market reports imply
  body: Kraken’s disclosed customer set and platform types suggest that its real near-term opportunity is a subset of allied defence maritime-autonomy budgets rather than the whole autonomous-shipping universe.
  claimRefs:
  - CM007
  - CM008
  - CM033
  - CM034
