    - Closest public market lens to Kraken near-term product scope
  - - Autonomous ships (broad)
    - Commercial, merchant, and defence autonomous vessels across geographies
    - Non-maritime autonomous systems
    - Mixed public and private buyers
    - Useful top-down adjacency but too broad as Kraken TAM
  - - Hybrid-fleet maritime security
    - Crewed-uncrewed teaming, chokepoint security, infrastructure protection, and naval ISR
    - Standalone software tools without platform relevance
    - Navies, coast guards, maritime-security coalitions
    - Best operational frame for Kraken adoption path
  - - Commercial dual-use maritime autonomy
    - Offshore infrastructure, security, and selected commercial applications
    - Consumer boating and generic marine electronics
    - Operators of critical maritime infrastructure
    - Possible later adjacency but not main 2026 demand pool
  notes: The market boundary is layered rather than singular. Kraken’s current proof points are defence-led, so broader commercial autonomous-shipping estimates should not be used unadjusted as company TAM.
