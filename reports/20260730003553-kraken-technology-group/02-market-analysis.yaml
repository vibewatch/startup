- id: buyers-users-and-adoption-path
  title: Buyers, users, payers, and adoption path
  body: 'The buyer map is also more specialized than a typical commercial autonomy story. Buyers are usually ministries of defence, navies, special-operations organizations, and maritime-security bodies that control procurement or urgent-operational budgets; users are fleet commanders, operators, and mission planners who need persistent sensing, logistics, screening, or strike-adjacent capability at lower personnel risk. Payers are therefore government institutions, even when industrial partners or financiers help accelerate deployment. Royal Navy and allied commentary suggests that demand is being pulled by hybrid-fleet thinking: uncrewed systems are expected to augment frigates, support mine and choke-point operations, and give commanders more persistence at sea. The adoption path tends to start with demonstration, trial, or prototyping activity, then move to operator-supported exercises, limited operational deployment, and eventually procurement or serial production. Kraken’s 2025-2026
    public record—DSEI demonstrations, SOF Week demos, Hormuz-linked reporting, a Royal Navy-supported airdrop, and a USSOCOM OTA—fits that path closely. For the market chapter, that matters because it suggests adoption is gated less by raw curiosity and more by institutional trust, integration burden, and mission validation. In other words, demand formation is visible, but budget conversion remains sequential and evidence-heavy.'
