    whyItMatters: Without a bottom-up programme bridge, SAM/SOM claims can be overstated by borrowing too much from broad market reports.
    diligencePath: Request pipeline by programme, quantity, geography, and phase; map each to a realistic conversion probability.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-adjacency
    missingEvidence: Evidence of real commercial or dual-use demand converting beyond defence references.
    whyItMatters: Commercial adjacency could meaningfully expand TAM, but public proof remains thin.
