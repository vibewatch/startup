- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The positive demand case is strong. Conflict-driven maritime insecurity, especially around chokepoints like Hormuz, sharpens the value of persistent uncrewed sensing and force protection. Allied naval modernization increasingly emphasizes distributed operations, crewed-uncrewed teaming, and more affordable mass at sea, which benefits companies that can ship modular systems quickly. Investor appetite also remains robust: Landbase describes a record $49.1 billion of defence-tech funding in 2025, and Kraken’s own Series B shows investors are willing to back maritime autonomy specifically when there is operator proof and industrialization potential. But the adoption constraints are equally real. Defence procurement remains slow, programmatic, and politically mediated; trust in autonomy depends on communications resilience, collision avoidance, rules of engagement, and human-on-the-loop control; export-control and sovereignty requirements can complicate cross-border manufacturing models;
    and many market reports measure adjacent sectors rather than the exact sliver Kraken serves. As a result, the market is attractive but not frictionless. Kraken’s ability to convert strategic interest into durable production revenue will depend on clearing those institutional hurdles faster than peers while preserving reliability in rough-sea, contested-communications environments. Those constraints do not negate the opportunity, but they do mean revenue realization will lag the hype cycle unless vendors can prove operational reliability and procurement fit.'
