  rows:
  - - Royal Navy / allied navies
    - Naval procurement and fleet leadership
    - Task-group commanders and operators
    - Defence ministry/navy capital budgets
    - Persistent ISR, screening, force protection, logistics support
    - Hybrid-fleet doctrine plus proven trials
  - - Special operations maritime units
    - Special operations command
    - Maritime SOF operators
    - SOF programme budgets / OTAs
    - Covert insertion, reconnaissance, sensor/effect delivery
    - Rapid prototyping path and operational demos
  - - Chokepoint / coalition maritime security
    - Multinational maritime-security command
    - Deployed maritime task groups
    - Coalition and national defence budgets
    - Track, identify, and deter threats around high-value sea lanes
    - Acute crisis or route-closure risk
  - - Critical maritime infrastructure defenders
    - State security or contracted maritime operators
    - Security teams and surveillance cells
    - Public-security / infrastructure budgets
    - Protect offshore infrastructure and coastal approaches
    - Higher threat levels and lower-risk unmanned patrol value
  - - Later dual-use commercial buyers
    - Commercial infrastructure owners
    - Marine operations teams
    - Corporate capex / opex budgets
    - Persistent site security or remote monitoring
    - Only after defence proof lowers trust barrier
  notes: The buyer and payer are usually government institutions, while the operational user is a fleet or mission team. Commercial dual-use demand exists, but the public record remains overwhelmingly defence-led.
