      - number: '8.3'
        title: What still stretches the price
        blocks:
          - type: paragraph
            body: >-
              The stretch comes from opacity and business-model uncertainty. Public sources do not reveal whether Kraken
              is already generating tens of millions of recognized revenue or whether the current narrative is still
              dominated by prototype-heavy contract values, option value, and anticipated production conversion. The
              clearest named demand anchors—the Royal Navy order and USSOCOM OTA—are valuable, but together they still
              do not prove a broad, recurring installed base. Public evidence also suggests the business is hardware-
              and integration-heavy, which usually deserves a different valuation logic from software businesses that
              can prove clean recurring margins. Customer concentration, export-control burden, and partner-led
              manufacturing all add execution risk that should normally compress a multiple unless growth visibility is
              unusually strong. The key question is therefore not whether Kraken is important; it likely is. The key
              question is whether the public record supports paying a full unicorn price before diligence access to
              revenue quality, margins, partner economics, and conversion milestones. Without that data, the round looks
              investable only for buyers who are comfortable underwriting scarcity and strategic timing as much as
              current fundamentals.
            claimRefs:
