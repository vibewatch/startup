  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Kraken sits inside a market that is both real and analytically messy. The company is not a generic
              autonomous-shipping vendor; it is selling defence-oriented uncrewed surface and subsurface platforms,
              payload integration, and localized industrial capacity into allied maritime-security programs. That means
              the broad autonomous-ship market is directionally relevant but too wide on its own, because it includes
              commercial navigation, cargo autonomy, and civilian marine automation. The narrower
              autonomous-naval-vessel lens is closer to Kraken’s current product and customer set, while the broadest
              autonomous-maritime-defence lens captures the coalition-security, coastal-protection, and unmanned-mission
              budgets that can eventually support platforms like K3 SCOUT, K4 MANTA, and K5 KRAKEN. Public 2026 market
              estimates therefore span a wide band: Research and Markets puts autonomous naval vessels at about $1.7
              billion in 2026, Fortune Business Insights places autonomous ships at $7.09 billion, and NextMSC sizes
              autonomous maritime defence systems at $10.54 billion. The right analytical takeaway is not to pick one
              number and call it TAM; it is to treat Kraken’s addressable market as a layered opportunity where
              near-term SAM is materially narrower than the top-down global numbers, but the strategic direction of
              travel is still favorable. A robust market read therefore has to preserve all three layers and then
              explicitly narrow toward the programmes where Kraken already has customer proof.
