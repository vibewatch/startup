        title: Revenue model and traction proxies
        blocks:
          - type: paragraph
            body: >-
              Kraken’s public materials point to a contract-driven hardware and integration model rather than a pure
              software business. Product and capability pages emphasize complete mission systems: modular vessels,
              autonomy, payload integration, and deployment into operator workflows. Funding and partner announcements
              repeatedly describe continued development of uncrewed surface vessels and payload capabilities, which
              implies monetization through programme awards, platform delivery, mission-package integration, and
              follow-on support or sustainment. The strongest publicly disclosed revenue proxy is not ARR or
              subscription data; it is operator activity and contract evidence, especially the $49 million USSOCOM OTA
              and the company’s repeated references to UK Ministry of Defence and NATO-linked programmes. That means
              public traction exists, but it is procurement-centric. Investors can observe demand signals, yet they
              still cannot see booked revenue, revenue recognition timing, or how much of the value sits in hardware,
              software, integration, support, or partner pass-through economics. The absence of pricing disclosure also
              means investors cannot tell whether Kraken is winning on performance, strategic urgency, or simply
              absorbing low early margins to establish reference programmes. In a defence hardware business those
              scenarios have very different implications for later cash generation. That uncertainty makes
              revenue-quality assessment provisional rather than investable on public evidence alone. materially.
