            body: >-
              Public trust and quality evidence is improving, but still incomplete. Kraken emphasizes human-in-the-loop
              oversight, route holding, collision avoidance, secure communications, and reduced-signature designs, and
              it has now tied those claims to visible demonstrations: DSEI 2025, SOF Week 2026, Hamburg production with
              Rheinmetall, and the Royal Navy-supported K3 SCOUT airdrop. The roadmap therefore appears to move from
              demonstration and mission proof toward scaled production, broader payload integration, and localized
              manufacturing. Still, independent validation is thinner than the product ambition. Public materials do not
              provide failure-rate, MTBF, or sortie-success statistics, and certification language is sparse outside
              isolated references such as K5 KRAKEN being coded to MCA WBC3. Relative to peers like Saildrone, which
              publicizes endurance, ABS class milestones, and mission-specific capability pages, Kraken’s trust surface
              is promising but less maturely quantified. For diligence, the key question is not whether the platforms
              are interesting—they are—but whether reliability, safety, and supportability have advanced as quickly as
              the roadmap narrative. A strong diligence session should therefore focus on evidence that the architecture
              survives real operator tempo, not just that the feature set sounds differentiated on paper. The more
              Kraken scales across partners and geographies, the more important this proof burden becomes. The evidence
