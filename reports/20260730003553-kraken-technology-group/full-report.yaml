      - number: '8.4'
        title: Comparable set and scenario bridge
        blocks:
          - type: paragraph
            body: >-
              The best comparable frame is private defense autonomy rather than listed industrials alone. Saronic’s
              March 2026 Series D at $9.25 billion, Shield AI’s March 2026 $12.7 billion valuation, Mach Industries’
              2026 $1.8 billion round, Anduril’s 2026 $5 billion Series H, and Helsing’s $18 billion financing all show
              that investors are willing to pay very large premiums for mission-relevant autonomy, manufacturing
              capacity, or strategic defense software and hardware. Kraken’s $1 billion valuation therefore does not
              look crazy in sector context; if anything, it sits toward the lower end of the current premium-defense
              peer set. But that does not make it cheap. Several of those peers either disclosed larger capital raises,
              broader platform ambitions, deeper U.S. program access, or more expansive defense-technology narratives.
              Kraken should therefore be valued off a scenario bridge rather than off simple peer envy. In a bull case,
              reference customers convert into multi-program fleets and sovereign production scales. In a base case, the
              current round is roughly fair. In a bear case, prototype-heavy demand and thin margin visibility produce a
              flat or down-round path.
