      - number: '3.2'
        title: Capabilities, packaging, and route to market
        blocks:
          - type: paragraph
            body: >-
              Public capability claims show meaningful differentiation but also substantial overlap. Kraken’s K3 SCOUT
              emphasizes speed, modularity, and littoral missions; K4 MANTA adds a rare hybrid surface-subsurface
              profile; and K5 KRAKEN stretches the portfolio toward higher payload and anti-submarine warfare concepts.
              Saildrone’s marketing points to persistence and ocean-intelligence scale, while Saronic highlights
              advanced autonomous vessels and growing naval proof. Anduril positions itself around seapower and broader
              defence-system integration, and Shield AI emphasizes autonomy that survives degraded communications and
              operator overload. Large incumbents such as Lockheed and Exail make the market even less forgiving by
              offering trusted industrial wrappers around autonomy concepts. Packaging is correspondingly opaque: most
              players sell through programme-specific contracts rather than transparent list prices, and the relevant
              “product” often includes vessel hardware, autonomy software, payload integration, support, and localized
              industrial content. That makes go-to-market power a mix of product capability, operator proof,
              manufacturing access, and who controls the prime-contractor relationship. The consequence is that
              capability comparisons should be read as solution-package comparisons, not only as one boat versus
              another. That complexity favors vendors that can reduce procurement friction.
