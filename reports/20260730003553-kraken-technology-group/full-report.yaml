  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform family in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Kraken’s product portfolio is structured as a family rather than a one-off vessel. K3 SCOUT is the core
              high-speed surface platform for maritime awareness, force protection, logistics, and precision strike
              roles; K4 MANTA extends the line into hybrid surface-subsurface operations for covert insertion,
              reconnaissance, and loitering; and K5 KRAKEN pushes toward higher-payload, longer-range strike, ASW, and
              multi-domain missions. In customer workflow terms, Kraken is trying to slot into the mission chain from
              deployment and insertion, to remote or supervised autonomous operation, to payload execution, to retrieval
              or sustainment. That matters because the technology proposition is not just “autonomy”; it is autonomy
              wrapped in deployable hulls, modular mission kits, and interfaces that fit legacy command-and-control
              structures. Public materials consistently describe rapid re-roling, air/land/sea transportability, and
              system-of-systems integration as the product value proposition rather than only raw speed or payload. It
              also means the buyer is underwriting workflow compression: fewer launch constraints, less crew exposure,
              and faster mission adaptation when the operator needs to change payload or tasking at short notice. That
              workflow framing is important because most defence customers buy outcomes and integration confidence, not
              abstract autonomy claims in isolation. overall.
