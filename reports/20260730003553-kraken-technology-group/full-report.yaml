      - number: '1.3'
        title: Capital, contracts, and industrial scale-up
        blocks:
          - type: paragraph
            body: >-
              Kraken’s July 2026 Series B is the pivotal corporate milestone in the current public record. DTCP said it
              led a $175 million round at a $1 billion valuation with participation from British Business Bank, NATO
              Innovation Fund, Rheinmetall, Inocea Group, and several European venture firms, while earlier supporters
              including NSSIF, SmartCap, Notion Capital, and Speedinvest converted prior positions into equity.
              Management and investors frame the proceeds as fuel for two linked objectives: continued payload and
              platform development, and rapid build-out of localized manufacturing capacity across allied geographies.
              That scale story is not theoretical. Kraken and partners announced production or integration relationships
              with Rheinmetall in Germany, Anduril in the United States, Davie in Canada, and NVL in Germany; Naval News
              and Rheinmetall then reported that K3 SCOUT series production had begun in Hamburg. Public demand signals
              also moved from concept to operator-linked programs. Kraken cites UK Ministry of Defence, NATO European
              partners, and USSOCOM contracts; official and independent reporting tie the company to a $49 million
              USSOCOM OTA, SOF Week demonstrations of K4 MANTA, Royal Navy-linked K3 SCOUT deployments around Hormuz,
              and a Royal Navy-supported USV airdrop trial. The main unresolved issue is disclosure depth: the market
              now has clear capital and partner proof, but still lacks revenue, margin, headcount, and customer-count
              transparency.
