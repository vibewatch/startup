  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and platform scope
        blocks:
          - type: paragraph
            body: >-
              Kraken Technology Group presents itself as a British-founded maritime defence company focused on modular
              uncrewed systems for littoral, surface, and subsurface missions. The company discloses Fareham, UK as its
              headquarters through the lead investor announcement, while independent summaries alternately describe it
              as British-founded, Fareham-based, or London-based, suggesting a UK operating footprint with some media
              inconsistency in how the city label is rendered. The company mission centers on “agile, versatile,
              relentless” autonomous maritime capability for rapidly changing operational demands, and its commercial
              identity is tied to hardened, mission-ready platforms rather than pure software. Public product pages
              describe three core families: K3 SCOUT for high-speed surface missions, K4 MANTA for hybrid
              surface-subsurface operations, and K5 KRAKEN for higher-payload long-range surface missions. The public
              web presence is split between a minimal krakentechnologygroup.com landing page and a fuller
              krakentechnology.com site containing the mission, platform, and announcement archive used throughout this
              report. The split web presence also matters operationally because investors, partners, and customers are
              all funneled into one narrative of defence readiness even though the public corporate shell remains
              relatively thin. That is common for fast-scaling defence startups, but it means diligence should privilege
              source triangulation over any single landing page.
