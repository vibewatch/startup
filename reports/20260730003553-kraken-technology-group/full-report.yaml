  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Kraken’s regulatory burden is more serious than a typical UK startup because its product, customers,
              investors, and manufacturing footprint all touch sensitive defense regimes. UK strategic export controls
              explicitly apply to goods, software, and technology and reference licensing, end-use controls, sanctions,
              penalties, and fines. The National Security and Investment Act provides a legal backdrop for scrutiny of
              transactions involving sensitive national-security capabilities. On the U.S. side, Kraken’s USSOCOM
              relationship and broader U.S. industrial ambitions point toward exposure to ITAR and other export-control
              rules even if public sources do not show the detailed compliance architecture yet. The practical risk is
              not that Kraken has been accused of violating these rules; no retained source shows that. The risk is that
              every cross-border payload, software update, data flow, investor right, or local-production arrangement
              may require more export screening and legal process than the company’s public surface suggests. Because
              the company is growing quickly across allied jurisdictions, process maturity matters almost as much as
              technical capability.
