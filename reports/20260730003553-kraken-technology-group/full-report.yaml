      - number: '8.5'
        title: Final diligence asks and kill triggers
        blocks:
          - type: paragraph
            body: >-
              The valuation judgment gap is highly specific. First, Kraken needs to prove revenue quality: recognized
              revenue, backlog, margin by platform family, and how much of the business is hardware delivery versus
              recurring support or software. Second, investors need a customer-conversion pack that shows how the Royal
              Navy award, USSOCOM OTA, and allied pipeline progress from demonstration and prototyping into multi-cycle
              production or sustainment. Third, the capital structure itself matters: liquidation preferences, ratchets,
              debt, and any strategic governance overlays can change whether a headline unicorn mark is attractive for
              new money. Fourth, diligence needs to reconcile partner dependence with unit economics because
              local-production prestige is not always equivalent to value capture. Until those items close, the right
              posture is to avoid treating the round as self-validating. Thesis-break triggers would include repeated
              program-conversion slippage, a data room that still cannot show dependable margins or renewals, meaningful
              QA or export-control problems, or a follow-on financing that prices below the current mark without a clear
              market-wide explanation.
