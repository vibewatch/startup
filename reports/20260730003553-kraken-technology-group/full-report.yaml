        - Named Royal Navy contract and USSOCOM OTA show real defense demand.
        - The disclosed anchors still do not prove a broad recurring installed base.
        - Public disclosure of recognized revenue and renewal behavior by major program.
      - - Strategic positioning
        - European maritime-defense scarcity plus sovereign partners create strategic value.
        - Strategic relevance can coexist with weak unit economics or slow conversion.
        - Proof of production-scale follow-on orders and support revenue.
      - - Capital markets
        - Round is backed by a serious investor syndicate rather than a single opportunistic mark.
        - Preference terms and governance overlays are undisclosed.
        - Access to financing documents or counsel summary.
      - - Business model
        - Modular maritime autonomy can justify a premium if Kraken owns meaningful mission value.
        - Hardware and integration intensity may deserve lower multiples than software-first peers.
        - Gross-margin and value-capture data by platform family.
      - - Peer context
        - Kraken is far below the valuation marks of Saronic, Shield AI, Helsing, and Anduril.
        - Those peers may justify higher marks through scale, breadth, or program depth not yet visible at Kraken.
        - Evidence that Kraken belongs closer to top-tier strategic-autonomy peers than to earlier hardware startups.
