  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor categories
        blocks:
          - type: paragraph
            body: >-
              Kraken’s competitive field is best understood in layers rather than a single peer group. Direct peers
              include other maritime-autonomy vendors that sell or market purpose-built uncrewed vessels, most notably
              Saronic, Saildrone, and certain Anduril maritime offerings. A second layer includes autonomy-led defence
              companies such as Shield AI, whose relevance comes less from hulls and more from resilient autonomy in
              contested conditions. A third layer includes maritime and defence incumbents—Rheinmetall, Lockheed Martin,
              Exail, and similar industrial players—that can combine autonomy, payload integration, and procurement
              credibility even when they are not startup-like point competitors. This matters because buyers often
              evaluate a programme rather than a standalone craft: a platform must fit domestic-content rules, payload
              choices, support models, and command-and-control environments. Kraken’s public profile therefore competes
              on more than vessel specifications; it competes on trust, allied manufacturability, integration pathways,
              and whether the company can be the right industrial node for a sovereign or coalition maritime programme.
              That layered view keeps the chapter from overstating competition with every defence prime while still
              recognizing that procurement alternatives can come from much larger organizations. It also explains why no
              single competitor is a perfect analog: some win on endurance, some on autonomy stack depth, and some on
              sovereign prime status. today.
