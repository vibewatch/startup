      - number: '1.2'
        title: Leadership, governance, and founder dependence
        blocks:
          - type: paragraph
            body: >-
              Founder and chief executive Mal Crease remains the public face of Kraken’s strategy, and the available
              evidence indicates that founder-market fit is central to the company’s story. Investor and media write-ups
              consistently quote Crease on NATO demand, manufacturing expansion, and the company’s product philosophy,
              while official pages link Kraken’s engineering identity to offshore-racing heritage and composite-vessel
              design. During 2026 Kraken broadened its executive bench by appointing Amelia Gould as chief technology
              officer and Justin Litko as chief executive of Kraken Technology US, the latter explicitly tied to
              domestic expansion after the Anduril partnership and USSOCOM work. Governance support also appears to be
              expanding via an advisory model: Kraken announced three senior U.S. national-security figures on its
              advisory board and separately highlighted former Rear Admiral James Parkin after his 2025 Royal Navy
              retirement. Even so, public reporting still does not disclose a full statutory board composition or
              investor-control map, so key-person concentration remains meaningful and should be revisited in a
              management session. The same point applies to governance: advisory depth is improving faster than formal
              disclosure. In practice, that means investors may get comfort from the names around the company before
              they get a complete view of control mechanics, information rights, or board committees.
