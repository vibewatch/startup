              investor base blends strategic, policy, and venture capital that can support procurement patience and
              industrial build-out. Revenue quality could be attractive if the company converts current operator proof
              into repeat production orders with attached support revenue, but that is still a hypothesis rather than a
              demonstrated public fact. The risk is that valuation and manufacturing ambition are currently much more
              visible than gross margin, cash conversion, or recurring software-like economics. Public evidence also
              suggests customer concentration remains high around government and allied defence programmes, which can
              create lumpy booking profiles and working-capital pressure. Until Kraken opens the data room on revenue,
