  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and initial call
        blocks:
          - type: paragraph
            body: >-
              Kraken crossed the unicorn threshold in July 2026 when DTCP and multiple secondary outlets reported a $175
              million Series B at a $1 billion valuation. That financing anchor is strong enough to matter because it
              comes from a named lead investor, a recognizable defense-focused syndicate, and corroborating coverage
              across UK and international outlets. It is also connected to a credible use-of-funds story around
              capability development and international manufacturing expansion rather than to a vague AI narrative. The
              problem is not whether the round happened; it clearly did. The problem is that the public record still
              does not supply the financial pack that lets an outside investor test whether the round price is
              attractive versus merely plausible. There is no disclosed revenue, ARR, gross margin, runway math,
              preference stack, or customer concentration table in retained public sources. On that basis, the
              recommendation should remain research-more, confidence should remain medium, risk should remain high, and
              the valuation stance should be stretched rather than clearly cheap.
            claimRefs:
              - CV001
              - CV002
              - CV003
