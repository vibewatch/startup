            body: >-
              Durability is where Kraken’s public customer picture becomes much thinner. None of the retained public
              sources discloses active-customer count, NRR, GRR, churn, renewal rates, contract length, top-customer
              revenue share, or post-deployment satisfaction metrics. That does not negate the customer evidence already
              on record, but it means investors cannot yet tell whether Kraken has converted early strategic wins into a
              repeatable installed-base business. The most plausible expansion path is land-and-expand across
              NATO-aligned navies and special-operations communities: Royal Navy proof can seed broader UK fleet use,
              USSOCOM can validate the concept for additional U.S. operators, and participation in allied exercises can
              help Kraken localize production with partners in Germany, the United States, and Canada. The offsetting
              risk is concentration. Public evidence still clusters around a small number of government anchors, and
              multiple sources describe testbeds, prototypes, or potential operational debuts rather than multi-year
              production renewals. That means Kraken’s customer verdict is positive on reference quality but still high
              risk on concentration, procurement timing, and retention visibility. Investors should therefore separate
              customer quality from customer breadth. Kraken appears to have won unusually valuable reference accounts
              for its age, yet the public record still leaves open whether those references represent the first nodes of
              a durable fleet franchise or a narrower set of strategic but lumpy programs.
