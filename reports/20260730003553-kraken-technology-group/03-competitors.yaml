- id: moat-durability-and-displacement-risk
  title: Moat durability, switching cost, and displacement risk
  body: Kraken’s moat is credible but not yet comfortable. The strongest public advantages are its modular family architecture, its high-speed littoral focus, and its visible partnerships with Rheinmetall, Anduril, Davie, and other industrial nodes that can satisfy local-production and procurement preferences. Those are nontrivial assets in defence markets where sovereignty and industrial policy matter as much as pure technical merit. However, the moat is also execution-heavy. U.S. domestic champions such as Anduril and Saronic have deeper domestic customer pull; Saildrone has more visible endurance-at-sea proof; and primes such as Lockheed or Rheinmetall can absorb more programme complexity if buyers want balance-sheet security. Switching costs are meaningful once a fleet, autonomy stack, payload fit, and support chain are selected, but before that point multi-homing and competitive bake-offs remain plausible. The likely outcome is a fragmented market where Kraken can win important pockets,
    especially in allied high-speed maritime autonomy, but where price pressure, domestic-bias rules, and prime-led capture remain persistent risks. Investors should therefore treat competitive success as programme capture plus economic retention, not just visibility or partner count. Another way to frame it is that the market may reward Kraken with relevance before it rewards it with dominance. That gap between relevance and dominance is where dilution of economics, partner dependence, and procurement-driven price pressure can appear. materially.
