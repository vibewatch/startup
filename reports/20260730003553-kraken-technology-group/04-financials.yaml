callouts:
- calloutType: risk
  title: Revenue opacity is the central financial problem
  body: Public evidence is strong enough to confirm capital raised and operator relevance, but not strong enough to underwrite revenue scale, gross margin, or runway. That makes the financial story fundamentally capital-first rather than operating-metric-first.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI017
  - CI033
  - CI034
  - CI036
- calloutType: strength
  title: Capital base is credible for an industrial expansion phase
  body: The Series B and strategic investor mix give Kraken more funding credibility than many hardware startups attempting localized manufacturing expansion.
  claimRefs:
  - CI008
  - CI009
  - CI025
  - CI026
- calloutType: insight
  title: Financial quality will depend on value capture, not just demand
  body: Demand proof alone does not determine economics. The key unknown is how much of each programme Kraken retains after partner manufacturing, payload integration, and support obligations are accounted for.
  claimRefs:
  - CI019
  - CI020
  - CI021
  - CI032
- calloutType: risk
  title: Government concentration can create lumpy bookings
  body: A procurement-centric business can be valuable, but it often produces uneven revenue timing, long bid cycles, and working-capital swings until repeat production is established.
  claimRefs:
  - CI014
  - CI030
  - CI031
  - CI032
