- id: cost-structure-and-capital-adequacy
  title: Cost structure, capital intensity, and adequacy of capital
  body: Everything in the public record suggests Kraken is capital-intensive. The company is manufacturing physical vessels, integrating payloads, and standing up localized production capacity with Rheinmetall, Anduril, and Davie rather than shipping a lightweight software product. K3 SCOUT, K4 MANTA, and K5 KRAKEN specifications all imply meaningful bill-of-materials, testing, logistics, and support obligations, and the capabilities page adds mission roles that increase payload, validation, and certification burden. The July 2026 Series B materially improves capital adequacy by adding $175 million at a $1 billion valuation, and management explicitly says the proceeds will support product development and international manufacturing expansion. Yet public evidence does not reveal burn, cash on hand, inventory requirements, debt obligations, or runway months. The best interpretation is that Kraken has enough capital to fund the next stage of industrialization, but not enough public disclosure
    to determine whether that capital is conservative, tight, or aggressively optimistic relative to its production ambitions. Companies House filings reinforce that Kraken is an active private limited company with recent accounts, share-capital events, and securities resolutions, but they still do not expose the management-level operating metrics needed to model burn or margin. That leaves a registry trail without a full operating dashboard. publicly.
