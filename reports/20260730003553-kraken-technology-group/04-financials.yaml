  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-backlog
    missingEvidence: Monthly revenue, booked backlog, and contract-by-contract recognition schedules.
    whyItMatters: Without these, valuation and capital-adequacy judgments remain qualitative.
    diligencePath: Request management accounts, signed backlog bridge, and revenue-recognition policy by programme.
    relatedQuestionRefs:
    - QI004
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, working-capital, and cash-conversion metrics by platform family.
    whyItMatters: A hardware-heavy business can look attractive on demand but poor on economics.
    diligencePath: Request product-level P&L, inventory days, supplier terms, and partner margin-sharing details.
    relatedQuestionRefs:
    - QI007
    - QI011
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand, burn, forecast runway, and downside planning assumptions.
    whyItMatters: The size of the Series B cannot be interpreted without the burn base.
    diligencePath: Review board budget, treasury forecast, and scenario model.
    relatedQuestionRefs:
    - QI017
    - QI018
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: customer-revenue-concentration
    missingEvidence: Top-customer revenue share, production vs pilot mix, and renewal timing.
    whyItMatters: Government concentration affects volatility and valuation quality.
    diligencePath: Request top-customer concentration schedule and contract lifecycle tracker.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: recurring-support-share
    missingEvidence: Support, sustainment, autonomy-software, and training share of revenue.
    whyItMatters: Recurring mix is central to margin durability and valuation multiple support.
    diligencePath: Request revenue split by hardware, integration, support, and software.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
