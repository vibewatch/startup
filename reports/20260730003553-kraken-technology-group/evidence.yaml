evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current statutory board list, board-seat allocations, and major investor governance rights.
    whyItMatters: >-
      Governance control affects downside protection, hiring authority, and strategic flexibility after the unicorn
      round.
    diligencePath: Request cap table, shareholder agreement, and current board observer/seat schedule from management.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, gross margin, and current backlog disclosures.
    whyItMatters: A $1 billion valuation is hard to underwrite without commercial scale or margin evidence.
    diligencePath: Request monthly management accounts, contract revenue bridge, and FY2025/FY2026 budget package.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Current employee count by geography and function.
    whyItMatters: Headcount is a basic proxy for execution capacity and burn.
    diligencePath: Request org chart, payroll count, and recruiting plan by site.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headquarters-label
    missingEvidence: >-
      Management clarification on headquarters labeling and operating-office split between Fareham and London
      references.
    whyItMatters: Location consistency matters for official profile data and legal entity diligence.
    diligencePath: Confirm registered office, principal place of business, and major operating sites in diligence Q&A.
    relatedQuestionRefs:
      - QO002
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Named customer roster with programme status, contract value, and production-vs-pilot status.
    whyItMatters: Current public proof shows relevance but not breadth of demand.
    diligencePath: >-
      Request customer list with stage, geography, and revenue contribution; reconcile against procurement
      announcements.
    relatedQuestionRefs:
      - QO019
