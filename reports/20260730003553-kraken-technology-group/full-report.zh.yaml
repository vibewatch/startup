      - number: '8.2'
        title: 价格的支撑因素
        blocks:
          - type: paragraph
            body: >-
              $1B 标记背后有真实证据。Kraken 不是还没有客户的概念公司。Royal Navy 已公开宣布 £12.3 million 订单，采购 20 艘无人艇；USSOCOM 也与一份最高 $49 million
              的 OTA 挂钩，用于快速开发和原型验证。公司还吸引了 British Business Bank、NATO
              体系资本来源和防务工业伙伴等主权与战略资本，因此这轮融资比单纯追涨加价更有政策和产业分量。公开产品与部署证据显示，Kraken
              正在模块化海上自主领域押注一个资本开支重、但战略意义强的位置，并在多个盟友司法辖区搭建制造路径。分析师市场数据也支持自主海军装备和自主船舶市场在扩张，这能解释投资人为何愿意领先于当前披露付费。简言之，这个价格有实质战略支撑：具名客户、产业价值，以及当下奖励可信防务自主平台的市场。即便公开基本面只支撑了一部分，估值也不是拍脑袋。
            claimRefs:
              - CV001
              - CV002
