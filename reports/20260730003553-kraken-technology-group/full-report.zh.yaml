      - number: '8.3'
        title: 价格仍然偏高的地方
        blocks:
          - type: paragraph
            body: >-
              偏高感来自不透明和商业模式不确定。公开来源没有说明 Kraken 已经确认了数千万级收入，还是当前叙事仍由原型合同金额、期权价值和预期量产转化主导。最清晰的具名需求锚——Royal Navy 订单和
              USSOCOM
              OTA——有价值，但合在一起仍不能证明公司已有广泛、可重复的装机基础。公开证据还显示，业务偏硬件和集成，这通常应采用不同于软件公司的估值逻辑；后者能够证明干净的经常性利润率。客户集中、出口管制负担和伙伴主导制造都会增加执行风险；除非增长可见度异常强，否则这些风险通常会压低倍数。因此关键问题不是
              Kraken
              是否重要；它大概率重要。关键问题是，在尽调拿到收入质量、利润率、伙伴经济性和转化里程碑之前，公开记录是否足以支撑支付完整独角兽价格。没有这些数据，这轮只适合那些愿意同时承销稀缺性、战略时点和当前基本面的买家。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
