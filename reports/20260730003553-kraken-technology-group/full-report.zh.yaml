      - number: '3.2'
        title: 能力、打包方式与市场路径
        blocks:
          - type: paragraph
            body: >-
              公开能力主张显示出有意义的差异化，也有大量重叠。Kraken 的 K3 SCOUT 强调速度、模块化和近岸任务；K4 MANTA 加入少见的水面-水下混合形态；K5 KRAKEN
              把组合推向更高载荷和反潜作战概念。Saildrone 的营销重点是持久存在和海洋情报规模；Saronic 强调先进自主舰艇和增长中的海军证据。Anduril 围绕海权和更广的国防系统集成定位自己，Shield
              AI 强调能穿过通信降级和操作员过载的自主能力。Lockheed、Exail
              等大型巨头给自主概念套上可信工业包装，让市场更不宽容。打包方式也相应不透明：多数玩家通过项目特定合同销售，而不是透明标价；相关“产品”往往包括船艇硬件、自主软件、载荷集成、支持和本地化工业内容。由此，市场进入能力混合了产品能力、作战方证据、制造通道，以及谁掌握主承包关系。结论是，能力比较应被读作解决方案包比较，而不只是这一艘艇对另一艘艇。这种复杂性有利于能降低采购摩擦的供应商。
