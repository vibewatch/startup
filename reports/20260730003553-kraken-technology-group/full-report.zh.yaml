      - number: '2.2'
        title: 买方、使用方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱也比典型商业自动化故事更专业。买方通常是掌握采购或紧急作战预算的国防部、海军、特种作战组织和海上安全机构；使用方是需要在更低人员风险下获得持续感知、后勤、筛查或打击邻近能力的舰队指挥官、操作员和任务规划人员。因此，付款方是政府机构，即使产业伙伴或金融方能帮助加速部署。英国皇家海军和盟友评论显示，需求正由混合舰队思路拉动：无人系统被期待增强护卫舰、支持水雷和咽喉要道作业，并让指挥官在海上获得更持久的存在。采用路径通常从展示、试验或原型活动开始，再进入作战方支持的演训、有限作战部署，最后走向采购或系列生产。Kraken
              2025-2026 年公开记录——DSEI 展示、SOF Week 演示、Hormuz 相关报道、英国皇家海军支持的空投、USSOCOM
              OTA——与这一路径高度吻合。对市场章节来说，关键在于它说明采用的闸门不只是好奇心，而是制度信任、集成负担和任务验证。换句话说，需求形成已经可见，但预算转化仍是按顺序推进、证据密集的过程。
