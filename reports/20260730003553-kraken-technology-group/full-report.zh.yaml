      - number: '8.4'
        title: 可比公司组和情景桥
        blocks:
          - type: paragraph
            body: >-
              最佳可比框架是私有防务自主公司，而不只是上市工业公司。Saronic 2026 年 3 月 Series D 轮估值 $9.25B，Shield AI 2026 年 3 月估值 $12.7B，Mach
              Industries 2026 年融资估值 $1.8B，Anduril 2026 年 $5B Series H 轮，以及 Helsing $18B
              融资，都说明投资人愿意为任务所需的自主能力、制造产能或战略防务软硬件支付极高溢价。放在行业里看，Kraken $1B
              估值并不离谱；甚至位于当前高溢价防务同业的低端。但这不等于便宜。上述若干同业披露了更大融资额、更宽的平台野心、更深的美国项目入口，或更宏大的防务科技叙事。Kraken
              因而应按情景桥估值，而不是简单羡慕同业倍数。牛市情形下，标杆客户转成多项目舰队，主权生产放量。基准情形下，当前轮次大致合理。熊市情形下，原型驱动需求和薄弱的利润率可见度会推向平轮或降价轮。
