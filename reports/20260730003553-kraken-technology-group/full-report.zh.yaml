  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              Kraken
              所处市场真实存在，但分析口径很乱。公司不是一家泛自动航运供应商；它向盟友海上安全项目销售国防导向的无人水面和水下平台、载荷集成以及本地化工业能力。因此，宽口径自动船舶市场有方向参考意义，但单独使用过宽，因为它包含商业航行、货运自动化和民用海事自动化。更窄的自主海军舰艇口径更贴近
              Kraken 当前产品和客户集；最宽的自主海上防务口径则纳入联盟安全、海岸防护和无人任务预算，这些预算最终可能支持 K3 SCOUT、K4 MANTA 和 K5 KRAKEN 等平台。因此，2026
              年公开市场估算跨度很大：Research and Markets 估计自主海军舰艇约 $1.7 billion，Fortune Business Insights 估计自动船舶为 $7.09
              billion，NextMSC 估计自主海上防务系统为 $10.54 billion。正确的分析结论不是挑一个数字叫 TAM，而是把 Kraken 的可服务市场视为分层机会：近期 SAM
              明显窄于自上而下的全球数字，但战略方向仍有利。稳健的市场判断必须保留这三层，再明确收窄到 Kraken 已有客户证据的项目。
