        - 战略紧迫性高时，欧洲防务溢价也可以拉到极高。
        - 软件和 AI 属性与 Kraken 的海上硬件组合差异很大。
      - - Anduril
        - 未上市防务主承包商挑战者
        - 2026 年 Series H：融资 $5B，估值标尺 $61B
        - 给战略防务平台热情划出上限。
        - 规模和范围都太大，不能直接做估值可比，但可作为溢价天花板。
    notes: 可比项用于说明市场背景，不代表倍数可以精确对齐。
