companyProfile:
  summary: >-
    Kraken Technology Group 是一家英国创立的海上防务创业公司，Mal Crease 于 2020 年创办；DTCP 称其总部位于英国 Fareham。公司打造模块化自主海上平台家族，覆盖 K3 SCOUT
    水面艇、K4 MANTA 水面-水下混合载具，以及更大的 K5 KRAKEN 任务平台。作为一家私营国防硬件公司，Kraken 的公开客户证据已有分量，包括英国皇家海军 20 艘艇的具名订单、上限最高 $49 million 的
    USSOCOM OTA，以及在德国、美国和加拿大的盟友制造关系。Kraken 于 2026 年 7 月以 $1 billion 估值完成 $175 million Series
    B，但公开记录仍未披露收入、利润率、留存、伙伴经济性或融资条款等细节，尚不足以把战略牵引清晰转化为高确信度的投资论证。
