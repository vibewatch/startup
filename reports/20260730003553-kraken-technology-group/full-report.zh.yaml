  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买方分层与采购界面
        blocks:
          - type: paragraph
            body: >-
              Kraken 面向的是一个买方、使用方、付款方和部署赞助方经常分属不同组织的国防采购系统。最强、可直接归因的细分市场是英国国防部和英国皇家海军；2026 年 3 月 Project Beehive
              合同披露了具名合同金额、舰队数量，以及 Coastal Forces Squadron 和 47 Commando Royal Marines 等具名使用方。第二个细分市场是美国特种作战；USSOCOM 向
              Kraken 授予 OTA，用于快速开发和原型化下一代无人水面与水下舰艇。第三个细分市场是通过演训、展示和主权制造伙伴关系触达的 NATO 与盟友海上作战方。公开产品页还显示，Kraken
              为海军巡逻、后勤、部队防护、隐蔽投送、打击或反潜角色设计不同任务画像，意味着细分图谱覆盖海军水面部队、突击队和特种作战用户，而不是一本同质化客户账。这一点重要，因为采购路径就是产品的一部分。Kraken
              的客户牵引离不开任务紧迫性、原型授权和主权舰队现代化议程，而不是标准化目录销售。实际含义是，Kraken
              卖给的是同样重视条令适配、部署节奏和主权控制的组织，平台规格只是其中一部分。即使技术兴趣真实，这通常也会拉长从兴趣到规模化收入的路径。
