  - id: TV005
    title: 投资论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 原型到量产转化停滞
        - 标杆项目仍停在试验状态，缺少清晰后续收入
        - 削弱当前轮次内含的战略稀缺溢价
        - 在转化证据改善前，不按名义价格追加资本。
      - - 收入质量仍不透明
        - 管理层即便在 NDA 下仍无法披露确认收入、毛利率和在手订单质量
        - 投资人无法判断 Kraken 应按战略溢价定价，还是按硬件风险定价
        - 将立场从 research-more 转向 avoid-at-price。
      - - 合作伙伴 QA 或出口管制问题浮现
        - 跨站点质量或转移管制问题拖延重要项目
        - 把战略扩张叙事变成执行拖累
        - 下调制造扩张上行空间，并重估运营风险。
      - - 预算时点冲击
        - 主要主权客户长期推迟授标或行权
        - 拉长现金转化，拖慢规模化叙事
        - 压测资金跑道，并下调公允价值区间。
      - - 后续融资低于当前估值
        - 在市场未整体重置时，下一轮定价融资或战略交易指向更低企业价值
        - 表明当前公开估值支撑过于乐观
        - 在反证出现前，将 2026 年 7 月轮次视为叙事定价高点。
    notes: 触发因素专门指向估值，并绑定可跟踪的运营、客户和资本市场事件。
    claimRefs:
      - CV024
      - CV026
      - CV027
      - CV029
      - CV035
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按客户和项目拆分的确认收入、在手订单和转化
        - 公开记录不足以判断独角兽价格是否公允。
        - 在 NDA 下要求提供管理账和已签订单桥接表。
      - - 毛利率 / 单位经济
        - 平台系列毛利、合作伙伴分成、营运资本负担
        - 决定 Kraken 应享受战略溢价，还是接受硬件风险估值。
        - 审查产品级 P&L 和合作伙伴经济账。
      - - 客户持续性
        - 续约历史、期权行使节奏、头部客户集中度
        - 标杆订单本身不能证明现金流可持续。
        - 要求提供客户集中度明细和续约跟踪表。
      - - 融资条款
        - 清算优先权、棘轮条款、认股权证、董事会权利以及任何债务
        - 表面估值可能掩盖新资金拿到的不利经济条款。
        - 审查融资文件或律师摘要。
      - - 运营可靠性
        - MTBF、事故日志、支持成本和验收历史
        - 硬件自主系统执行风险会很快抹掉估值溢价。
        - 审查 QA、可靠性和现场支持证据。
    notes: 每一项尽调问题都直接对应一个判断：投资人应接受、拒绝，还是重新谈判 2026 年 7 月价格。
    claimRefs:
      - CV005
      - CV006
      - CV011
      - CV024
      - CV034
      - CV036
