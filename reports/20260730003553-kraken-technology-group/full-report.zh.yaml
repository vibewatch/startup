      - number: '7.4'
        title: 缓释措施与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              正确的风险结论不是 Kraken 不可投，而是举证责任从叙事转向运营控制。公开缓释因素确实存在。Royal Navy 和 USSOCOM 具名合作，说明严肃客户已经测试过 Kraken
              的可信度。主权资本和防务阵营投资人也降低了一部分融资与政策摩擦风险。公开平台页强调的也是人在环路控制、模块化和按任务设计，而不是完全不受约束的自主叙事。但这些缓释因素还不完整；尽调仍要验证出口筛查流程归属、合作伙伴
              QA
              治理、可靠性数据，以及项目集中度。因此，最重要的破局触发点都可量化：出口管制或安全流程薄弱的证据、无法把原型和试验台转成稳定项目、各地合作伙伴质量漂移、预算驱动的授标反复滑坡，或私有资料室仍拿不出续约、事件或利润率证据。单点摩擦
              Kraken 大概率能扛住；如果几条风险线同时叠加，公司会吃力。即便战略叙事很强，残余评级仍应维持高位。
