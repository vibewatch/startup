      - number: '1.2'
        title: 领导层、治理与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人兼首席执行官 Mal Crease 仍是 Kraken 战略的公众面孔，现有证据显示，创始人与市场的匹配是公司故事的核心。投资人和媒体文章持续引用 Crease 对 NATO
              需求、制造扩张和公司产品哲学的表述；官方页面则把 Kraken 的工程身份连接到离岸竞速传统和复合材料艇设计。2026 年，Kraken 扩充高管班子，任命 Amelia Gould 为首席技术官、Justin
              Litko 为 Kraken Technology US 首席执行官；后者明确服务于 Anduril 伙伴关系和 USSOCOM 工作之后的美国本土扩张。治理支持也在通过顾问机制扩展：Kraken
              宣布三名美国国家安全资深人士加入顾问委员会，并在前海军少将 James Parkin 2025
              年从英国皇家海军退役后单独突出其角色。即便如此，公开报道仍未披露完整法定董事会构成或投资人控制权结构，因此关键人物集中度仍有分量，应在管理层访谈中复核。治理也是同一逻辑：顾问深度改善得比正式披露更快。实际含义是，投资人可能先从公司周边人名获得安慰，之后才看到控制机制、信息权或董事会委员会的完整图景。
