      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              正向需求论点很强。冲突驱动的海上不安全，尤其是 Hormuz
              等咽喉要道周边，放大了持续无人感知和部队防护的价值。盟友海军现代化越来越强调分布式作战、有人-无人协同，以及海上更可负担的规模，这有利于能快速交付模块化系统的公司。投资人胃口也仍然强劲：Landbase 称
              2025 年国防科技融资达到创纪录的 $49.1 billion；Kraken 自己的 Series B
              也显示，只要有作战方证据和工业化潜力，投资人愿意专门押注海上自主。但采用约束同样真实。国防采购仍慢、项目化且受政治调节；对自主系统的信任取决于通信韧性、避碰、交战规则和人在回路上的控制；出口管制和主权要求会让跨境制造模式复杂化；许多市场报告衡量的是相邻赛道，而不是
              Kraken 服务的精确小切片。结果是，市场有吸引力，但并不无摩擦。Kraken
              能否把战略兴趣转成持久生产收入，取决于它能否比同行更快清除这些制度障碍，同时在恶劣海况和受争夺通信环境下守住可靠性。这些约束不会否定机会，但如果供应商无法证明作战可靠性和采购适配，收入落地就会滞后于炒作周期。
