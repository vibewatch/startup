            body: >-
              公开信任和质量证据正在改善，但仍不完整。Kraken 强调人在回路上的监督、航线保持、避碰、安全通信和低特征设计，并已把这些主张连接到可见展示：DSEI 2025、SOF Week 2026、与
              Rheinmetall 的 Hamburg 生产，以及英国皇家海军支持的 K3 SCOUT
              空投。因此，路线图看起来正从展示和任务证明走向规模化生产、更广泛载荷集成和本地化制造。不过，独立验证仍比产品野心薄。公开材料没有提供故障率、MTBF 或出动成功率统计；除了 K5 KRAKEN 按 MCA
              WBC3 编码等孤立引用外，认证语言也很稀疏。相较 Saildrone 等同行——后者公开续航、ABS 船级里程碑和任务特定能力页面——Kraken
              的信任证据面有前景，但量化成熟度较低。尽调的关键问题不是平台是否有意思——它们确实有——而是可靠性、安全性和可支持性是否与路线图叙事一样快地推进。一次强尽调应聚焦于架构能否承受真实作战节奏的证据，而不只是功能集在纸面上听起来差异化。Kraken
              越是跨更多伙伴和地理范围扩张，这项证明负担就越重。每增加一个伙伴场站和任务画像，证据负担都会上升。
