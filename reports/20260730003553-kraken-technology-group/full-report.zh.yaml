      - number: '6.3'
        title: 持久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              持久性是 Kraken
              公开客户图景明显变薄的地方。保留的公开来源都没有披露活跃客户数、NRR、GRR、流失、续约率、合同期限、头部客户收入占比或部署后满意度指标。这不会否定已经在记录中的客户证据，但意味着投资人还无法判断 Kraken
              是否已把早期战略胜利转化为可重复的装机基础业务。最合理的扩张路径，是在 NATO 阵营海军和特种作战社群中先落地再扩张：英国皇家海军证据可为更广泛的英国舰队使用播种，USSOCOM
              可为更多美国作战方验证概念，参与盟友演训则可帮助 Kraken
              与德国、美国和加拿大伙伴本地化生产。对冲风险是集中度。公开证据仍聚集在少数政府锚点周围，多个来源描述的是试验台、原型或潜在作战首秀，而不是多年生产续约。因此，Kraken
              的客户判断在参考质量上为正，但在集中度、采购时点和留存可见度上仍是高风险。投资人应把客户质量和客户宽度拆开看。Kraken
              似乎在这个年龄段已赢得异常有价值的参考客户，但公开记录仍没有回答：这些参考究竟是一项持久舰队特许权的首批节点，还是一组更窄、战略性强但节奏不平滑的项目。
