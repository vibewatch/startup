            body: >-
              Kraken 的护城河可信，但还谈不上舒适。最强的公开优势是模块化家族架构、高速近岸聚焦，以及与 Rheinmetall、Anduril、Davie
              和其他工业节点的可见伙伴关系；这些节点能满足本地生产和采购偏好。在主权和产业政策与纯技术水平同样重要的国防市场，这些资产并不轻。问题在于，护城河也高度依赖执行。Anduril、Saronic
              等美国本土冠军有更深的本土客户拉力；Saildrone 有更可见的海上续航证明；如果买方想要资产负债表安全感，Lockheed 或 Rheinmetall
              等主承包商能吸收更多项目复杂性。一旦舰队、自主栈、载荷适配和支持链被选定，切换成本就有分量；但在此之前，多家下注和竞争性比测仍然合理。更可能的结果是一个碎片化市场：Kraken
              能赢下一些重要口袋，尤其是在盟友高速海上自主领域；但价格压力、本土偏向规则和主承包商主导的价值攫取仍是持续风险。因此，投资人应把竞争成功定义为拿下项目并留住经济性，而不只是可见度或伙伴数量。换个说法，市场可能先奖励
              Kraken 相关性，再奖励它主导地位。相关性与主导地位之间的差距，正是经济性稀释、伙伴依赖和采购驱动价格压力出现的地方，而且影响可能很实质。
