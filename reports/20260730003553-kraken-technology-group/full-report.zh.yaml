        blocks:
          - type: paragraph
            body: >-
              因此，财务判断是混合的。Kraken
              当前阶段的资本化很强，投资人基础混合了战略、政策和风险资本，能支持采购耐心和工业化建设。如果公司把当前作战方证据转化为重复生产订单，并附带支持收入，收入质量可能有吸引力；但这仍是假设，不是已被公开证明的事实。风险在于，估值和制造野心眼下比毛利率、现金转化或类似软件的经常性经济性可见得多。公开证据还显示，客户集中度仍高度围绕政府和盟友国防项目，这会造成订单确认节奏不平滑和营运资本压力。在
              Kraken
              向数据室打开收入、现金消耗、在手订单和合同结构之前，正确立场是把财务强度视为有资金支撑的选择权，而不是已证明的运营效率。这足以支撑战略兴趣，但如果没有管理层披露，还不足以支撑细颗粒度价格判断。换句话说，今天的财务论证靠资产负债表支持和战略定位撑着，运营论证仍取决于尽调访问。这种缺口在国防创业公司中常见，但在这里更重要，因为如果项目转化滞后，本地化制造会很快吃掉资本。
