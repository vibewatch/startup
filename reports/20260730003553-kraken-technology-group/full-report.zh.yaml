  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与牵引代理指标
        blocks:
          - type: paragraph
            body: >-
              Kraken
              的公开材料指向合同驱动的硬件和集成模式，而不是纯软件业务。产品和能力页面强调完整任务系统：模块化舰艇、自主能力、载荷集成，以及嵌入作战方流程。融资和伙伴公告反复提到继续开发无人水面艇和载荷能力，意味着变现来自项目授予、平台交付、任务包集成，以及后续支持或维保。公开披露中最强的收入代理指标不是
              ARR 或订阅数据，而是作战方活动和合同证据，尤其是 $49 million USSOCOM OTA，以及公司多次提到的英国国防部和 NATO
              相关项目。这意味着公开牵引存在，但它以采购为中心。投资人能看到需求信号，却仍看不到已签收入、收入确认节奏，也看不到价值在硬件、软件、集成、支持或伙伴转手经济性中如何分配。缺少价格披露还意味着，投资人无法判断
              Kraken
              赢单靠的是性能、战略紧迫性，还是为了建立参考项目而接受较低早期毛利。在国防硬件业务中，这几种情景对后续现金生成的含义完全不同。这种不确定性让收入质量评估只能是暂定，而不能仅凭公开证据进入可投资状态，影响重大。
