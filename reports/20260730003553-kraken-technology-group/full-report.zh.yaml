  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Kraken 的监管负担比典型英国创业公司更重，因为它的产品、客户、投资人和制造足迹都触及敏感国防制度。英国战略出口管制明确适用于货物、软件和技术，并涉及许可、最终用途管制、制裁、处罚和罚金。National
              Security and Investment Act 为涉及敏感国家安全能力的交易审查提供法律背景。在美国一侧，Kraken 与 USSOCOM 的关系以及更广泛的美国工业野心，指向 ITAR
              和其他出口管制规则敞口，即使公开来源尚未展示详细合规架构。实际风险不是 Kraken
              已被指控违反这些规则；保留来源没有显示这一点。风险在于，每一次跨境载荷、软件更新、数据流、投资人权利或本地生产安排，都可能需要比公司公开表面显示更多的出口筛查和法律流程。公司正在盟友司法辖区内快速扩张，流程成熟度几乎和技术能力一样重要。
