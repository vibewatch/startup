      - number: '1.3'
        title: 资本、合同与工业化扩张
        blocks:
          - type: paragraph
            body: >-
              Kraken 2026 年 7 月的 Series B 是当前公开记录中的关键公司里程碑。DTCP 称其领投一轮 $175 million 融资，估值 $1 billion，British Business
              Bank、NATO Innovation Fund、Rheinmetall、Inocea Group 和多家欧洲风投参投；NSSIF、SmartCap、Notion Capital、Speedinvest
              等早期支持方也把此前头寸转换为股权。管理层和投资人把资金用途框定为两个相连目标：继续开发载荷和平台，并在盟友地理范围内快速建设本地化制造能力。这套规模化叙事并非纸面故事。Kraken 与伙伴宣布了在德国与
              Rheinmetall、在美国与 Anduril、在加拿大与 Davie、在德国与 NVL 的生产或集成关系；随后 Naval News 和 Rheinmetall 报道，K3 SCOUT 已在 Hamburg
              开始系列生产。公开需求信号也已从概念走向与作战方相连的项目。Kraken 提到英国国防部、NATO 欧洲伙伴和 USSOCOM 合同；官方与独立报道把公司与 $49 million USSOCOM OTA、SOF
              Week 的 K4 MANTA 展示、围绕 Hormuz 的英国皇家海军相关 K3 SCOUT 部署，以及英国皇家海军支持的 USV
              空投试验联系起来。主要未解问题仍是披露深度：市场现在看到了清晰的资本和伙伴证据，但仍缺收入、毛利率、员工人数和客户数量透明度。
