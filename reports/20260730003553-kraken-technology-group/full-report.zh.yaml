chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、使命与平台范围
        blocks:
          - type: paragraph
            body: >-
              Kraken Technology Group 自称是一家英国创立的海上防务公司，专注于为近岸、水面和水下任务提供模块化无人系统。牵头投资人的公告披露公司总部位于英国
              Fareham；独立摘要则交替称其为英国创立、以 Fareham 为基地或以 London
              为基地，说明公司有英国运营足迹，但媒体在城市标签上并不一致。公司的使命围绕“敏捷、多用、坚韧”的自主海上能力展开，以应对快速变化的作战需求；商业身份也绑定在加固、任务就绪的平台上，而不是纯软件。公开产品页描述了三条核心产品线：K3
              SCOUT 面向高速水面任务，K4 MANTA 面向水面-水下混合作业，K5 KRAKEN 面向更高载荷、远程水面任务。公开网页存在分裂：krakentechnologygroup.com
              是极简落地页，krakentechnology.com
              则更完整，包含本报告使用的使命、平台和公告档案。这种分裂网页也有运营含义：投资人、伙伴和客户都被导入同一套防务就绪叙事，但公开公司外壳仍相对单薄。这在高速扩张的国防创业公司中并不少见，但也意味着尽调应优先做来源交叉验证，而不是押注任何一个落地页。
