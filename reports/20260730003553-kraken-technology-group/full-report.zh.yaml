      - number: '5.2'
        title: 架构、运行模式与部署逻辑
        blocks:
          - type: paragraph
            body: >-
              架构叙事是模块化且务实作战导向的。Kraken 页面描述了面向自主系统的开放接口、任务特定载荷舱、从受监督自主到远程驾驶的多种运行模式，以及与传统通信和指挥系统的兼容性。K3 SCOUT 和 K4 MANTA
              都提到 Auterion 操作系统，K5 KRAKEN 则提到 PX4
              和面向自主系统的开放接口，说明公司倾向于利用成熟自主工具，而不是封闭黑盒。运行模式围绕部署、集成、运行、适配和规模化构建。每个产品页都重复这一序列，并把可制造性和标准化部件视为设计体系的一部分。结果是，Kraken
              的技术护城河可能同样位于船体设计、系统集成和任务重构，而不是任何单一软件模块。它也意味着现场可靠性和人在回路上的控制是产品被接受的核心，尤其是在受争夺或高海况环境中。这个架构有吸引力，正是因为作战上可读。买方能看到自主能力在哪里结束、人类控制在哪里保留、制造纪律又必须在哪里把设计野心转成可重复的现场表现。它也给出更清晰的尽调路径：检查接口、载荷更换、测试数据和支持流程，而不是只依赖标题式营销话术。
