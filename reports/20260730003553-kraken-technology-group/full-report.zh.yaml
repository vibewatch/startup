      - number: '7.2'
        title: 自主系统可靠性、安全与认证负担
        blocks:
          - type: paragraph
            body: >-
              Kraken 第二大风险簇是运营和技术：公众热度跑在公开可靠性披露之前。公司把 K3、K4 和 K5
              用于水面巡逻、后勤、隐蔽投送、部队防护、打击或反潜等角色，意味着舰队必须在差异很大的环境和任务条件下工作。与此同时，监管背景正在变得更正式。Workboat Code Edition 3 自 2023 年 12
              月起适用于新工作艇，IMO 于 2026 年 5 月通过 MASS Code、并自 2026 年 7 月起生效，LR 和 ABS 等船级与保障机构也以验证、测试、完整性和合规来框定自主。Kraken
              有一些正向证据——英国皇家海军支持的试验、具名客户，以及至少一处公开提到 K5 按 WBC3 编码——但保留的公开来源仍没有提供
              MTBF、出动成功率、事故日志或组合层面的认证深度。这个缺口很重要，因为自主海上系统一旦导航、通信或载荷出错，作战后果会很严厉。在 Kraken
              打开测试数据和安全案例之前，可靠性仍是真实的论点风险，而不是已经解决的营销点。
