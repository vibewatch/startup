  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与对手类别
        blocks:
          - type: paragraph
            body: >-
              Kraken 的竞争场域最好按层理解，而不是压成一个同业组。直接对手包括其他销售或营销专用无人舰艇的海上自主供应商，最典型的是 Saronic、Saildrone 以及 Anduril 的部分海事产品。第二层包括
              Shield AI 等以自主能力为核心的国防公司；它们的相关性更多来自受争夺条件下的韧性自主，而不是艇体。第三层包括 Rheinmetall、Lockheed Martin、Exail
              等海事与国防巨头，以及类似产业玩家；即使它们不像创业公司那样点状竞争，也能组合自主、载荷集成和采购可信度。这一点重要，因为买方常常评估的是一个项目，而不是一艘独立艇：平台必须适配本土内容规则、载荷选择、支持模式和指挥控制环境。因此，Kraken
              的公开形象竞争的不只是船艇参数，还包括信任、盟友制造可行性、集成路径，以及公司能否成为某个主权或联盟海事项目里的正确工业节点。分层视角能避免把每一家国防主承包商都夸大成直接竞争者，同时承认采购替代方案可能来自更大的组织。它也解释了为什么没有任何单一竞争对手是完美类比：有的赢在续航，有的赢在自主栈深度，有的赢在主权主承包地位——至少目前如此。
