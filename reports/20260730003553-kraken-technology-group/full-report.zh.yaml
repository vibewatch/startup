      - number: '8.5'
        title: 最终尽调问题和否决触发点
        blocks:
          - type: paragraph
            body: >-
              估值判断缺口非常具体。第一，Kraken 需要证明收入质量：已确认收入、未履约订单、按平台家族拆分的毛利率，以及业务中硬件交付与经常性支持或软件各占多少。第二，投资人需要客户转化包，说明 Royal Navy
              授标、USSOCOM OTA
              和盟友管线如何从演示和原型推进到多周期生产或保障。第三，资本结构本身也重要：清算优先权、棘轮条款、债务以及任何战略治理叠加，都可能改变标题独角兽标记对新资金是否有吸引力。第四，尽调需要把伙伴依赖与单位经济对齐，因为本地化生产的声望不一定等于价值捕获。在这些问题关闭之前，正确姿态是不要把这轮融资当成自我验证。破局触发点包括项目转化反复滑坡、资料室仍拿不出可靠利润率或续约、重大
              QA 或出口管制问题，或后一轮融资在没有明确全市场解释的情况下低于当前标记定价。
