        title: 成本结构、资本强度与资金充足性
        blocks:
          - type: paragraph
            body: >-
              公开记录中的所有信息都指向一个结论：Kraken 资本强度高。公司制造实体舰艇、集成载荷，并通过 Rheinmetall、Anduril 和 Davie 建设本地化产能，而不是交付轻量软件产品。K3
              SCOUT、K4 MANTA 和 K5 KRAKEN 的规格都意味着可观的物料清单、测试、物流和支持义务；能力页面列出的任务角色还会增加载荷、验证和认证负担。2026 年 7 月的 Series B 以 $1
              billion 估值引入 $175
              million，显著改善资金充足性；管理层也明确表示，资金将支持产品开发和国际制造扩张。但公开证据没有披露现金消耗、手头现金、库存需求、债务义务或资金续航月数。最合理的解读是，Kraken
              有足够资本资助下一阶段工业化，但公开披露不足以判断这笔资本相对生产野心是保守、紧绷，还是激进乐观。Companies House 备案进一步证明 Kraken
              是一家活跃的私人有限公司，近期有账目、股本事件和证券决议；但这些备案仍没有暴露建模现金消耗或毛利所需的管理层级经营指标。公开层面留下的是注册轨迹，而不是完整运营仪表盘。
