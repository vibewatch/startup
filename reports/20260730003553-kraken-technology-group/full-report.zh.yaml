  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点和初步判断
        blocks:
          - type: paragraph
            body: >-
              2026 年 7 月，DTCP 和多家二级媒体报道 Kraken 以 $1B 估值完成 $175M Series B
              轮融资，公司跨过独角兽门槛。这个融资锚足够重要：领投方具名、防务属性的财团可识别，英国及国际媒体也有交叉报道。资金用途也可信，指向能力开发和国际制造扩张，而不是笼统的 AI
              叙事。问题不是这轮是否发生；事实很清楚。问题在于，公开记录仍没有给出外部投资人用来判断价格究竟有吸引力还是只是说得通的财务包。留存公开来源没有披露收入、ARR、毛利率、现金续航测算、优先权结构或客户集中度表。因此，recommendation
              仍应是 research-more，confidence 仍为 medium，risk 仍为 high，估值立场应是偏高，而不是明显便宜。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
