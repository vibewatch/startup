            body: >-
              客户证据明显强于标识营销，但成熟度仍不均衡。英国皇家海军证据最深，因为它包括已公告的 £12.3 million、20 艘无人艇合同、具名最终用户组织，以及后续公开的英国皇家海军支持 K3 SCOUT
              空投试验。USSOCOM 证据同样有分量，因为 OTA 上限较大，多家独立媒体也描述了一条围绕特种作战需求塑造的快速开发路径；但公开记录仍把该工作框定为原型开发，而不是已公告的生产舰队订单。NATO
              和盟友证据来自 Task Force-X 参与、主权制造公告以及引用盟友国防需求的融资叙事，但在具名采购订单或稳定舰队利用率上更薄。Kraken
              自有新闻表面还加入了一个更强、但独立可验证性较弱的主张：系统已部署在持续冲突中。因此，采用故事可信但分阶段：真实合同和作战方触点存在，而活跃舰队规模、出动节奏、续约时间和利用率等宽口径分母指标仍未披露。换个方式看采用曲线，Kraken
              已经拥有足够客户证据来具备战略重要性，但还没有足够经常性使用披露来建模一个稳定装机基础。本章因此把具名合同证据视为强项，同时仍折价处理缺少分母或重复使用披露的主张。
