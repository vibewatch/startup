  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户流程看平台家族
        blocks:
          - type: paragraph
            body: >-
              Kraken 的产品组合是一个家族，而不是一次性船艇。K3 SCOUT 是核心高速水面平台，服务于海上态势感知、部队防护、后勤和精确打击角色；K4 MANTA
              把产品线延伸到水面-水下混合作业，覆盖隐蔽投送、侦察和滞留；K5 KRAKEN 则推向更高载荷、更长航程的打击、反潜和多域任务。从客户流程看，Kraken
              试图嵌入任务链：部署与投送、远程或受监督自主运行、载荷执行，再到回收或维保。这一点重要，因为技术主张不只是“自主”，而是把自主能力包在可部署船体、模块化任务套件和适配传统指挥控制结构的接口里。公开材料持续把快速换装、空
              / 陆 /
              海运输能力和系统之系统集成描述为产品价值主张，而不是只强调原始速度或载荷。它也意味着买方押注的是流程压缩：更少发射约束、更低人员暴露，以及当作战方需要短时间切换载荷或任务时更快适配。这种流程框架很重要，因为多数国防客户购买的是结果和集成信心，而不是孤立的抽象自主主张。
