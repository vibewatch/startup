    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛
        - 能量饮料和其他由产品组合驱动的延伸品类成功，2025 年中约 $340M 的收入预测达到或超过，公开或私募买方将公司视为多品类平台并给予认可。
        - 如果入场价格低于已经滞后的 2024 年估值，上行空间来自增长重启和 IPO 或战略退出窗口重新打开，而不是旧价格下的简单倍数扩张。
        - 品类上市未能复现早期牵引力，或需要过多营销支出。
        - 需要新的证据证明利润率改善、新品类售罄强劲，以及流动性路径更清晰。
      - - 基准
        - Liquid Death 继续增长，但更接近 2024 年报告的约 27% 增速；没有新的定价股权轮次，经济性公开披露有限。
        - 估值仍锚定在上一轮附近，回报取决于审慎入场，而非运营表现超预期。
        - 在单位经济性得到证明前，投资者已经为品牌质量支付过高价格。
        - 这是当前公开证据最支持的情景。
      - - 熊
        - 增长继续放缓，新品类表现不佳，公司更多依赖债务、可转债或更疲软的融资市场，而不是更高价格的股权融资。
        - 对新投资者而言，下轮融资降价、二级市场价格持平或长期缺乏流动性，都可能抹去大部分表面上的品牌优势。
        - 优先股堆叠、契约或资本强度最终比外部人士预期更差。
        - 若近期尽调仍无法补齐经济数据和股权结构缺口，该情景更可能发生。
    notes: 情景逻辑仅作方向性判断，因为公开来源没有披露经审计的毛利率、现金消耗或优先股堆叠；概率信号是定性的， 不是数值化概率。
