  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据指向一种品牌饮料模型：公司把品类广度和零售分销转化为收入，周边商品则作为高毛利补充。
    data:
      nodes:
        - id: products
          label: 产品组合
          note: 保留的官方页面均能看到山泉水、冰茶、汽水风味气泡水和能量饮料。
        - id: retail
          label: 零售与大众渠道客户
          note: 第三方分析将杂货店和大众零售描述为核心销量层。
        - id: on-premise
          label: 便利店、场馆与现场消费
          note: 公开评论将现场活动和便利店渠道视为高端单份饮料的销售场景。
        - id: dtc
          label: DTC 店铺与促销
          note: 公司拥有自营店铺，但披露证据显示其作用是战略支持，而非主要销量引擎。
        - id: merch
          label: 周边商品与限量发售
          note: 第三方估算表明，周边商品确实是饮料收入的高毛利补充。
        - id: revenue
          label: 净收入
          note: 公开来源对公司收入和零售销售的口径不一致，因此经审计的净收入仍未得到验证。
        - id: profit
          label: 毛利路径
          note: 公开证据指出了渠道和产品驱动因素，但没有量化毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Liquid Death 的公开产品体系从品牌认同和饮料组合出发，延伸到包装、外包生产以及渠道 / 社群运营。
    data:
      layers:
        - label: 品牌认同
          detail: 以重幽默、金属文化为编码的定位，把普通补水重新包装成娱乐体验。
          modules:
            - label: Murder Your Thirst
              note: tagline / tonal anchor
            - label: 高罐装审美
              note: beer / energy visual language
          outputs:
            - label: Shelf attention and social shareability
        - label: 场景设计
          detail: 公开来源将产品定位于零售货架、场馆和无酒精社交场景。
          modules:
            - label: 现场活动契合度
              note: cornerstone market
            - label: 更健康的派对替代品
              note: nonalcoholic substitution
          outputs:
            - label: Trial in party and venue contexts
        - label: 饮料组合
          detail: 如今，一个品牌体系覆盖饮用水、气泡水、茶和能量饮料。
          modules:
            - label: Mountain Water
            - label: 气泡水 / 汽水风味水
            - label: Iced Tea + Sparkling Energy
          outputs:
            - label: More dayparts and use cases
        - label: 包装与可持续性
          detail: 铝罐包装和反塑料信息是消费者可直接感知的产品属性。
          modules:
            - label: 可无限回收的罐装
            - label: Death to Plastic 定位
          outputs:
            - label: Visible environmental differentiator
        - label: 合同生产
          detail: 独立简介指向泉水采购，以及在弗吉尼亚州由第三方负责罐装。
          modules:
            - label: Bland, VA / Mackay, ID 水源
            - label: Wilderness 罐装合作方
          outputs:
            - label: Asset-light beverage supply
        - label: 分销与数据闭环
          detail: 零售、DSD、现场活动和奖励计划把铺货连接到复购营销。
          modules:
            - label: 113k+ 零售 / 场馆覆盖
            - label: Country Club / 奖励活动
          outputs:
            - label: National reach plus first-party audience
    approximationNotes: 零售覆盖和运营细节只是公开代理指标；指定证据中没有披露经审计的 SLA、良率或灌装率数据。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE010
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，旅程从品牌驱动的认知开始，在现场活动和零售环节转化，再延伸至 DTC / 社群激活。
    data:
      items:
        - label: 通过挑衅式品牌认同建立认知
          actor: Z 世代 / 千禧一代饮料消费者
          phase: awareness
          touchpoints:
            - 不敬式广告、社交内容与公关
            - 反塑料、突出幽默的定位
          note: Marcom 和 NVDigital 均围绕青年文化和营销差异化来描述该品牌。
        - label: 在现场活动试饮
          actor: 演唱会观众 / 音乐节参加者
          phase: trial
          touchpoints:
            - Live Nation 场馆
            - 音乐节和演唱会
          note: NBC 称现场娱乐消费者是核心市场，Live Nation 则是公开出现的独家渠道合作伙伴。
        - label: 早期杂货店与便利店验证
          actor: 零售采购方与消费者
          phase: validation
          touchpoints:
            - 进入 Whole Foods
            - 7-Eleven 的 200 家门店试点
          note: 早期点名的验证案例从试点测试走向稳定的零售货架陈列。
        - label: 大众零售规模化分销
          actor: 大众消费者
          phase: scale
          touchpoints:
            - 2024 年 3 月在美国和英国拥有 113,000 个网点
            - 2024 年全球 133,000+ 家门店
          note: 在指定来源池中，门店数是公开材料最反复出现的采用率 KPI。
        - label: 社群与零售商联动的复购激活
          actor: 直接消费者
          phase: engagement
          touchpoints:
            - Country Club
            - Death Peddlers
            - 与零售账户关联的 Sparkling Energy 奖励促销
          note: 官方 2026 年主页证据显示，公司同时拥有 DTC / 社群入口和零售购买验证机制。
        - label: 跨饮料场景扩展产品组合
          actor: 现有消费者
          phase: expansion
          touchpoints:
            - 气泡水
            - 冰茶 / 柠檬水
            - Sparkling Energy
          note: 公司正试图把同一消费者关系拓展到多个饮料场景。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU008
      - CU009
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险在于品牌持久性、渠道集中度和流动性，而不是某一个二元监管事件。
    data:
      columns:
        - label: 可能性
          note: 12-18 个月的投资判断周期。
        - label: 影响
          note: 对增长、利润率或融资灵活性的影响。
        - label: 缓释措施成熟度
          note: 当前公开来源中可见的内容。
        - label: 剩余风险
          note: 扣除可见缓释措施后的净风险。
      rows:
        - label: 品牌持久性 / 护城河
          note: 品类饱和，加上英国市场的翻译落地证据。
          values:
            - label: 高
              tone: high
              note: 第三方报道已经显示，产品经济模型容易被复制，营销疲劳也存在风险。
            - label: 高
              tone: critical
              note: 品牌优势减弱会同时挤压定价、货架空间和扩张回报。
            - label: 中
              tone: medium
              note: 社交影响力很强，但关于持久复购经济性的公开证据有限。
            - label: 高
              tone: high
              note: 这仍是核心投资判断风险。
        - label: 渠道 / 合作方集中度
          note: 零售覆盖广度和对 Live Nation 的依赖都很重要。
          values:
            - label: 中高
              tone: high
              note: 广泛的零售覆盖加上明确的锚定合作方，使集中度成为实质性问题。
            - label: 高
              tone: critical
              note: 下架或失去独家合作会同时削弱曝光和动销。
            - label: 中
              tone: medium
              note: 零售和电商多元化有所帮助，但具体集中度尚未披露。
            - label: 高
              tone: high
              note: 公开数据没有显示增长有多大比例依赖少数渠道。
        - label: 流动性 / 产能
          note: 信贷加上寻求新资本，说明规模化需要资金。
          values:
            - label: 高
              tone: high
              note: 对外部融资的需求已经延续到创业早期之后。
            - label: 高
              tone: critical
              note: 流动性压力会限制库存、渠道投入和新品类推出。
            - label: 中
              tone: medium
              note: 投资者资源和规模是正面因素，但缺少契约条款细节。
            - label: 高
              tone: high
              note: 在授信安排条款和现金转化情况明确前，投资判断仍暴露在风险中。
        - label: 法律 / 声誉
          note: 隐私、商标和漂绿问题均有现实进展。
          values:
            - label: 中
              tone: medium
              note: 公开证据显示相关问题仍在发展，但没有被引用的生存性执法事件。
            - label: 中高
              tone: high
              note: 一项禁令或信任冲击就可能打断新品发布并推高 CAC。
            - label: 中
              tone: medium
              note: 消费者权益处理流程和品牌灵活性是可见的缓释因素。
            - label: 中
              tone: medium
              note: 风险不小，但目前仍次于护城河和流动性风险。
        - label: 国际化落地
          note: 退出英国市场说明品牌并不会自动适应海外市场。
          values:
            - label: 中
              tone: medium
              note: 一个失败市场不足以证明存在规律，但已经是现实的预警信号。
            - label: 中高
              tone: high
              note: 国际化反复失误会封顶高增长估值倍数所隐含的上行空间。
            - label: 中低
              tone: warning
              note: 除了管理层决定重新聚焦美国市场外，没有强有力的公开缓释措施。
            - label: 中
              tone: medium
              note: 这对上行空间很重要，但紧迫性低于当前的美国渠道和流动性风险。
        - label: 产品安全 / 信任
          note: 质量批评已公开出现，但在可获得证据中尚未得到充分解决。
          values:
            - label: 中
              tone: medium
              note: 信号并不压倒性，但对社交属性强的品牌而言，即使小规模风波也可能迅速扩散。
            - label: 中
              tone: high
              note: 产品质量或安全叙事可能损害动销速度和零售商信心。
            - label: 低
              tone: low
              note: 指定来源池中关于正式整改的公开证据有限。
            - label: 中
              tone: medium
              note: 即使这不是主要悲观情景，未知因素也足以支持继续尽调。
    approximationNotes: 各单元格反映分析师根据引用证据得出的评分，不是管理层提供的量化概率。
    claimRefs:
      - CR002
      - CR005
      - CR008
      - CR011
      - CR014
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 公开证据支持这是一个已具规模的品牌，但尚不足以无视价格直接买入。
    data:
      nodes:
        - id: scale-proof
          label: 规模验证
          detail: Sacra 估算的 2024 年收入为 $333M，美国零售网点超过 133k，说明公司已形成真实的平台。
          claimRefs:
            - CV003
            - CV008
        - id: category-breadth
          label: 品类广度
          detail: 官方页面显示，市场上已有饮用水、冰茶、汽水风味气泡水和能量饮料。
          claimRefs:
            - CV009
            - CV010
        - id: pricing-anchor
          label: 定价锚点
          detail: 公开锚点仍是 2024 年 3 月约 $1.4B 的融资轮，对应 Sacra 估算的 2024 年收入约 4.2 倍。
          claimRefs:
            - CV001
            - CV002
            - CV011
        - id: reset-risks
          label: 重估风险
          detail: 据报道，2024 年增长约为 27%；公开信息中没有更新的定价轮融资，IPO 路径也尚未清晰。
          claimRefs:
            - CV005
            - CV006
            - CV012
        - id: capital-structure-gaps
          label: 资本结构缺口
          detail: 可转债、循环信贷额度和缺乏流动性的 IPO 前投资机会，都会提高新投资者对下行风险的敏感度。
          claimRefs:
            - CV013
            - CV015
            - CV016
        - id: decision
          label: 当前判断
          detail: 在经济性、可比公司或价格带来更清晰的安全边际前，继续跟踪 / 研究。
          claimRefs:
            - CV011
            - CV012
            - CV013
            - CV014
    approximationNotes: 该序列表达的是投资判断逻辑，不是量化转化率或概率树。
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
