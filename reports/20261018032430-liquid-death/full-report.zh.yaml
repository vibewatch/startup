      - number: '3.2'
        title: 差异化来自场景与渠道，而非配方
        blocks:
          - type: paragraph
            body: >-
              现有证据中最强的差异化并非饮料化学，而是社交场合的使用许可和渠道契合度。NBC 明确指出，高罐铝罐让不饮酒者在酒吧、音乐会和节庆活动中不显得格格不入，把“水”变成一种社交信号产品。同一来源和 RGM
              都把现场娱乐视为公司的核心场景；Live Nation 关系让 Liquid Death 独家进入 120 多个节庆活动和场馆。Litmus 认为，只有在 13.3
              万多个零售网点和场馆售卖权等实体资产支撑下，这种 meme 式语气才真正持久；新挑战者仅靠尖锐文案更难复制。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
