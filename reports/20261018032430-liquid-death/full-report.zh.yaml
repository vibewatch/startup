          - type: callout
            title: 价格会改变答案
            body: 更清晰的股权结构表、经审计的单位经济性和折价入场，可能让同一家公司变得有吸引力；没有这些条件，流动性不足和资本结构不确定性会主导预期回报计算。
            calloutType: risk
            claimRefs:
              - CV007
