          note: Faster Than Normal 使用较早的市场估算，描绘的是最初的机会，而不是当前 TAM。
        - label: 美国零售网点覆盖代理指标
          displayValue: 100,000+ doors
          context: 2024 年分销估算
          note: 网点数量反映采用广度，不代表可触达支出。
        - label: 高端单罐价格点
          displayValue: $1.99-$2.49
          context: 估算的零售单罐价格
          note: 反映消费者为包装、品牌和便利性支付溢价的意愿。
        - label: 核心饮料品类
          displayValue: '4'
          context: 饮用水、气泡水、冰茶及能量饮料相邻品类
          note: 官方页面和二手分析显示，品牌已从纯饮用水延伸出去。
        - label: 全球门店覆盖代理指标
          displayValue: 133,000+ stores
          context: 2024 年全球二手估算
          note: 可用于理解规模，但不是严谨的美国市场规模输入。
    approximationNotes: 各层按宽泛的品类天花板到更窄的商业代理指标排序；它们不是嵌套漏斗，不能理解为数学上可比的市场切片。
    claimRefs:
      - CM003
      - CM006
      - CM007
      - CM009
      - CM014
      - CM015
  - id: FP001
    title: 竞争定位图
