              - CO016
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 品牌加分销是概览的核心结论
            body: 最有力的公开事实不是某个单一产品说法，而是鲜明的品牌定位、扩大的饮料产品线，以及第三方来源所称超过 13.3 万家门店／网点的分销规模。
            calloutType: strength
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO011
          - type: callout
            title: 公开治理与经济性仍披露不足
            body: 公开证据足以确认规模和势头，但不足以有把握地评估股权控制、单位经济性、客户集中度或债务／再融资风险。
            calloutType: risk
            claimRefs:
              - CO010
              - CO012
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              可用的市场边界比普通包装水更宽，但比所有饮料更窄。公司官方文案和多份二手分析都指向一个高端补水品类：从静态水和气泡水起步，再延伸到风味气泡水、冰茶和能量饮料相邻场景。Liquid Death
              靠包装、语气和消费场景设计，与大宗瓶装水、社交场合的自来水、汽水及传统即饮饮料等既有替代品竞争，而不是只靠配方取胜。公开来源提供了可用的自上而下上限和若干商业代理指标，包括美国瓶装水大类估值、网点数估算和高端零售价。但这些来源没有按渠道、包装规格或零售商预算拆分出清晰的公司
              SAM 或 SOM，因此应保留这些宽泛口径并说明限制，而不是假装它们能拼成一套精确的 TAM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM014
