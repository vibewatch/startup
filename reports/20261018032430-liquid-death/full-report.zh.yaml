      - number: '8.2'
        title: 融资背景与情景
        blocks:
          - type: paragraph
            body: >-
              融资背景要求保持耐心。Sacra 称 2024 年 3 月后没有宣布新的定价股权轮，公司后来增加了一张 2028 年到期的可转债和一笔 5500 万美元的 Ares 循环额度；Microventures 称公司在
              2025 年年中寻求最多 2000
              万美元新资本，用于产能和分销。这本身不是困境信号，但意味着上一轮之后的公开记录更像资产负债表管理，而不是清晰的估值上调。与此同时，官方和第三方来源显示其确实超越普通罐装水：Liquid Death
              官网目前营销山泉水、冰茶、苏打风味气泡水和能量饮料，主页在 2026 年末仍推广 Sparkling Energy 活动。             
              因此乐观情景存在，但前提是产品组合和利润率扩张足够持久，能够抵御更苛刻的公开市场和后期私募市场环境。
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 最终尽调问题与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              剩余障碍是投资判断障碍，而不是叙事障碍。UpMarket 警告 IPO 前投资缺乏流动性，可能损失全部资本；Everything-PR 称截至 2026 年年中，公司尽管出现 Goldman Sachs 和一位
              PepsiCo 出身 CFO 等明显 IPO 前信号，仍未提交 IPO
              申请。同样重要的是，公开记录没有在相同指标口径和证券优先级上提供有说服力的可比公司分析，因此清晰的上行／下行区间仍依赖私募尽调。如果增长继续放缓，却没有相应的利润率扩张证明；如果债务和可转债成为增量融资的主要来源；或股权结构表显示优先权会吸收大部分温和退出价值，论点就会失效。下一步尽调应检验：更好的经济性或更低的入场价，能否把强品牌变成强投资。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 当前判断：跟踪，不买入
            body: Liquid Death 的规模和品牌实力足以值得主动跟踪，但公开记录仍指向陈旧的 2024 年估值锚点，而不是基于最新经济性的入场点。
            calloutType: recommendation
            claimRefs:
