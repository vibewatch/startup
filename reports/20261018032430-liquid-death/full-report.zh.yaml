chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的官方页面仍将公司定位为高端低卡饮料平台，而非单一罐装水 SKU。其核心仍是让公司脱颖而出的叛逆 “murder your thirst”
              品牌，但当前产品线已扩展到山泉水、苏打风味气泡水、冰茶和 Sparkling
              Energy，均采用无限可回收铝罐。后续估值和上市路径分析应把它看作一个用娱乐化营销运营的多品类饮料品牌，而不只是新奇的水品牌。官方材料也继续以 “death to plastic”
              传达可持续性，但现有证据没有独立量化这一定位对环境或利润率的影响。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO016
      - number: '1.2'
        title: 领导层、治理与股权透明度
        blocks:
          - type: paragraph
            body: >-
              管理层仍明显围绕创始人 Mike Cessario 集中，其创意背景和品牌话语与公司的市场定位、创始故事紧密相连。现有公开管理层证据虽不多，但对两位高管的描述一致：Cessario 任联合创始人兼
              CEO，Ricky Khetarpaul 任 CFO。结合反复出现的 IPO 猜测，这说明财务领导已初步正规化，但核心治理缺口仍未解决：现有公开来源没有清晰的董事会名单、控制权图谱或优先权层级。X/Grok
              的股权摘要提到创始人、风险投资机构、战略投资者和名人股东的混合结构，但在取得原始股权结构表前，只能把它视为低置信度线索。
            claimRefs:
              - CO004
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 融资、规模与渠道覆盖
        blocks:
          - type: paragraph
            body: >-
              尽管公司仍是私有企业，公开规模故事仍然强劲且可以持续更新。NBC 和 MEXC 都采用 2024 年 3 月一轮融资约 $1.4B 的估值口径；NBC 当时报道 2023 年全球销售额为
              $263M，在美国和英国拥有 113,000 个零售网点。后来的二手资料把经营规模推得更高，第三方来源称 2024 年销售额／收入约 $333M，门店或网点超过 133,000 个。Live Nation
              同时是投资者和现场活动分销渠道，战略意义突出；后续投资判断应检验这种娱乐相邻性究竟是持久护城河还是集中度风险。尽管收入端势头强劲，现有证据仍没有公开披露客户数、渠道组合、毛利率、现金消耗和信贷条款。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
