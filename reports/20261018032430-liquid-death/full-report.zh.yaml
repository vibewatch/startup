      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              现有证据表明，Liquid Death 在身份认同和场景与补水同样重要的地方取胜。可能的终端用户群从追求文化认同的 Z
              世代和年轻千禧一代开始，延伸到希望无酒精选择仍具文化可信度的清醒社交和活动型买家，也覆盖愿意为便利、新奇或可持续性信号支付溢价的家庭消费者。通常由消费者付款，但采用高度依赖中间环节：零售品类经理、场馆采购、Amazon
              商品运营和节庆活动运营方决定产品能否进入冷柜、端架或活动陈列，把关注转化为试购。公开来源对渠道路径的描述一致：早期通过 DTC、Amazon、Whole Foods、7-Eleven
              和身份契合的场所获得牵引，随后随着品牌证明自己能把文化热度转成终端动销，扩展到更广泛的杂货店、大卖场和会员制零售。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM013
              - CM015
      - number: '2.3'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              公开证据中最强的采用驱动并非产品科学或监管，而是品牌戏剧性、货架辨识度、可持续性叙事，以及靠创作者、活动和零售曝光不断累积认知的上市路径。高罐铝罐形态和反塑料叙事让消费者有理由为近似大宗商品的产品多付钱，产品线扩张也增加了品牌能覆盖的消费场景。但这些优势同样带来约束。底层饮料品类拥挤、补水需求通用，终端消费者转换成本低，因此护城河取决于持续保持创意相关性和零售执行力。公开来源还指出资本密集度、品类拥挤，以及相较塑料瓶不易重新密封等实际形态取舍。估值时，最有力的市场论点是高端品牌加分销，而不是具备锁定效应的专有产品品类。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 包装与语气是切入市场的楔子
            body: 最有力的市场证据不是 Liquid Death 找到了新的液体品类，而是它改变罐体、场景和购买的文化含义，以新的方式把大宗饮料卖出高端价格。
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM013
          - type: callout
            title: 精确投资判断仍缺乏清晰的 SAM/SOM
            body: 公开数据足以显示大品类和可见采用，但没有管理层或扫描器数据，就不足以拆出渠道层面的预算归属、复购经济性或有说服力的 SAM/SOM。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合超越水品类
        blocks:
          - type: paragraph
            body: >-
              本章证据支持的市场边界比“高端水”更宽。Liquid Death
              官方产品如今涵盖山泉水、苏打风味气泡水、冰茶和能量饮料，因此买方会按场景把它与普通水领域的既有品牌、气泡水挑战者、健康型汽水和无酒精成人仪式饮料比较。Ringly 的替代品指南并不完美，但仍说明消费者会把
              Liquid Death 与 Open Water、JUST Water、Rambler、Waterloo、Aura Bora、Ghia、De Soi 和 Athletic Brewing
              放在一起，视为解决包装、反塑料或“手里想拿点有趣东西”问题的相邻选项。Litmus 还指出，Olipop 和 Poppi 从不同功能角度争夺同一批年轻、重品牌的消费者，而非只在补水赛道竞争。
