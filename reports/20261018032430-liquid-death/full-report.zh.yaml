              - CP011
      - number: '3.3'
        title: 竞争优势随买方标准而变
        blocks:
          - type: paragraph
            body: >-
              没有单一竞争者在所有维度都占优。PepsiCo 和 Coca-Cola 在规模、货架和广告投入上胜出，但同样的公司体量也让它们难以真实地售卖反叛式反营销。Open Water、JUST Water 和
              Rambler 等可持续性替代品，在消费者主要想要铝制或替代包装而不是小众文化徽章时，更像直接替代。买方重视健康型价值主张时，Olipop 和 Poppi 更危险；Waterloo 或 Spindrift
              等风味水品牌则能凭口味和更简单的价格结构赢得家庭日常消费。现有资料没有保留同规格包装的稳定当前 SKU 价格，因此结论应保持定性：Liquid Death
              卖的是身份、场景契合和渠道陈列，而不是单纯赢得最低价补水比较。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河真实存在，但主要是无形资产
        blocks:
          - type: paragraph
            body: >-
              这条护城河可信，但不是硬科技或配方 IP。Harvard 2022 年案例已提出核心矛盾：增长把品牌推向主流时，如何扩大受众、延长产品线，同时保持“酷”。Yahoo Finance
              的风险摘要补充称，公司如今同时竞争水、茶、能量饮料和健康型汽水；即使对手无法复制其语气，包装或营销模仿也会压低价格和货架份额。该资料提到的英国退出案例尤其重要，因为它说明品牌的文化编码和高端价格未必能顺利跨市场迁移。Litmus
              从另一角度得到相同结论：如果公司看起来像在模仿自己原本的局外人语气，支撑溢价的资产可能比实体分销网络更快贬值。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 最危险的对手往往不是另一款水 SKU
            body: Liquid Death 赢得的是一种特定社交场景：健康、无酒精，同时拿在手里仍然很酷。因此，无酒精开胃酒、无酒精啤酒和健康型汽水即使在零售商货架图上不像瓶装水竞争者，也可能分走份额。
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
          - type: callout
            title: 护城河取决于规模化时仍保持文化可信度
            body: 现有企业不需要完美复制这个玩笑就能伤害 Liquid Death；它们可以挤占货架、加大分销投入，或等待品牌在国际化并扩展到更多饮料品类后失去局外人色彩。
            calloutType: risk
            claimRefs:
