      - number: '1.4'
        title: 里程碑与当前风险信号
        blocks:
          - type: paragraph
            body: >-
              带日期的公开记录显示，这个品牌从创始人故事迅速扩张为广泛覆盖零售的饮料平台，也说明下一步尽调不能只靠热度。公司似乎把 Warped Tour 时代的洞察商业化，并于 2019 年推出产品；到 2024 年 3
              月私募估值达到 14 亿美元，2025 年继续扩大零售覆盖和品类，至 2026 年年中仍是私有且未提交上市申请。与此同时，Yahoo 资料把竞争、2025
              年初退出英国市场以及品牌／法律波动列为真实执行风险。因此，概览更支持“有增长势头的规模化私有品牌”，而非“风险已完全消除的消费公司”。
            claimRefs:
              - CO004
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO014
              - CO016
