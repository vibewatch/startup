            body: >-
              公开记录最能证明收入规模和覆盖范围，不能证明实际经济性。NBC News 将公司新闻稿中的 2023 年全球销售额归为 $263M。2024 年，TapTwice 将 $333M 称为收入，而
              MicroVentures 称 $333M 为零售销售额，并另称公司收入为 $240M。这些指标不能互换，因此现有证据无法确认经审计的 2024 年净收入。定价证据也很少：MicroVentures 报道 12
              盎司 Sparkling Energy 罐的预期货架价为 $2.59 至 $3，并非当前实际收入。2026
