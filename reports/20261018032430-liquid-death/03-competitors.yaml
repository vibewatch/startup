    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of route-to-market leverage versus culture/occasion fit, based on retained
      evidence rather than inferred market-share math.
    data:
      xAxis:
        label: Distribution + venue leverage
        min: 1
        max: 5
        low: Limited leverage
        high: Dominant leverage
        scale: ordinal
        description: Ordinal score from retained evidence on shelf access, venue exclusivity, and category breadth.
      yAxis:
        label: Culture / occasion fit
        min: 1
        max: 5
        low: Commodity-coded
        high: Identity-coded
        scale: ordinal
        description: Ordinal score from retained evidence on rebellious branding and suitability for sober-curious social use cases.
      points:
        - label: Liquid Death
          x: 4
          y: 5
          claimRefs: [CP003, CP005, CP006]
        - label: PepsiCo / Coca-Cola water portfolios
          x: 5
          y: 2
          claimRefs: [CP007, CP008]
        - label: Open Water / JUST Water / Rambler
          x: 2
          y: 3
          claimRefs: [CP010, CP011]
        - label: Olipop / Poppi
          x: 4
          y: 4
          claimRefs: [CP009, CP012]
        - label: Waterloo / Spindrift / Aura Bora
          x: 3
          y: 3
          claimRefs: [CP011, CP013]
        - label: Ghia / De Soi / Athletic
          x: 2
          y: 4
          claimRefs: [CP003, CP011, CP012]
    approximationNotes: >-
      The axes are evidence-backed ordinal scores rather than measured market shares or
      conversion rates. They summarize relative route-to-market power and brand/occasion fit
      from the retained sources without inventing unavailable numeric benchmarks.
    claimRefs: [CP003, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP013]
