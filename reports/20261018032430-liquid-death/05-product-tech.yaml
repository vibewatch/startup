            - { label: "Country Club / reward campaigns" }
          outputs:
            - { label: "National reach plus first-party audience" }
    approximationNotes: "Retail footprint and operating details are public proxies; no audited SLA, yield, or fill-rate data is disclosed in the assigned evidence."
    claimRefs: [CE001, CE004, CE006, CE008, CE010, CE013]
