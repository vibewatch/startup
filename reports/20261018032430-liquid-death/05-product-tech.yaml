            - { label: "Sparkling / soda-flavored water" }
            - { label: "Iced Tea + Sparkling Energy" }
          outputs:
            - { label: "More dayparts and use cases" }
        - label: Packaging and sustainability
          detail: "Aluminum cans and anti-plastic messaging are product attributes visible to consumers."
          modules:
            - { label: "Infinitely recyclable cans" }
            - { label: "Death to Plastic positioning" }
          outputs:
            - { label: "Visible environmental differentiator" }
        - label: Contract manufacturing
          detail: "Independent profiles point to spring sourcing plus third-party canning in Virginia."
          modules:
            - { label: "Bland, VA / Mackay, ID springs" }
