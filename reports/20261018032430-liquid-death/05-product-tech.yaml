      - ["Notice a healthier option on a crowded convenience or grocery shelf", "Choose among lookalike bottled waters and flavored beverages", "Heavy-metal naming, skull imagery, and aluminum format make the package visibly distinct", "Independent profiles repeatedly attribute growth to shelf stand-out and social shareability", "Defensibility appears brand-led rather than formulation-led"]
      - ["Engage beyond the can after first purchase", "Follow creators, buy merch, or join loyalty-style programs", "Country Club, merch, and reward campaigns extend the relationship after purchase", "Creates a first-party audience and promotional loop around new launches", "No public conversion funnel, retention, or CAC disclosure"]
      - ["Place and replenish the line across retail and venue channels", "Use DSD/live-event distribution to keep tallboy inventory visible in high-traffic occasions", "Distribution agreements and live-event placement support broad physical deployment", "Independent sources cite 113,000+ outlets/stores and new DSD deals", "Channel concentration and service levels are not publicly quantified"]
    notes: "Benefits are framed as public deployment or attention proxies, not audited outcomes; missing denominator and retention data remain open."
    claimRefs: [CE003, CE004, CE008, CE011, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Brand system", "Own the humor-heavy identity, naming system, merch, and campaign engine", "Continual creative output and influencer/event relevance", "Brand fatigue or copycat positioning can erode distinctiveness"]
      - ["Beverage portfolio", "Apply one packaging and tone system across water, sparkling, tea, and energy", "Reliable reformulation/line-extension execution by beverage type", "No public evidence of deep formulation moat or line-level economics"]
      - ["Packaging + sustainability layer", "Use aluminum cans and anti-plastic messaging as visible product architecture", "Can supply, sustainability messaging credibility, and shelf execution", "Packaging can be copied by larger competitors"]
      - ["Contract manufacturing + sourcing", "Source spring water and can through third-party infrastructure rather than disclosed owned plants", "Spring sources plus Wilderness canning in Virginia", "Supplier concentration, QA opacity, and undisclosed SLA/incident history"]
      - ["Distribution + community loop", "Route products through retail, DSD, live events, and member-style programs", "Retail partners, distributors, live-event operators, and first-party data capture", "Sell-through, service quality, and data-usage outcomes remain lightly disclosed"]
    notes: "This is an operating-model map rather than a software architecture because the assigned evidence describes sourcing, packaging, and channel execution instead of code or hardware internals."
    claimRefs: [CE002, CE005, CE006, CE007, CE008, CE010, CE011]
