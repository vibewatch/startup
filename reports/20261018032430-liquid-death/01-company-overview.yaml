    claimRefs: [CO007, CO010, CO011, CO015]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show rapid category and channel expansion, but the
      company is still private and materially under-disclosed on economics and
      governance.
    data:
      items:
        - date: "2008"
          label: Warped Tour origin insight
          detail: >-
            Microventures says Mike Cessario's concept began when touring
            musicians hid water inside energy-drink cans.
          tone: neutral
          claimRefs: [CO004]
        - date: "2019"
          label: Commercial launch
          detail: >-
            Microventures says Liquid Death launched in 2019 under Mike
            Cessario after turning the tallboy-water concept into a branded
            beverage company.
          tone: positive
          claimRefs: [CO004]
        - date: "2024-03"
          label: $1.4B valuation lens
          detail: >-
            NBC and MEXC both cite the March 2024 private round at roughly a
            $1.4 billion valuation.
          tone: positive
          claimRefs: [CO007]
        - date: "2024-03"
          label: 2023 scale disclosed
          detail: >-
            NBC reported $263 million of 2023 global sales and 113,000 retail
            outlets across the U.S. and U.K.
          tone: positive
          claimRefs: [CO008]
        - date: "2024"
          label: 133k+ doors and ~$333M lens
          detail: >-
            TapTwice and Microventures both describe 2024 scale at roughly
            $333 million sales/revenue and more than 133,000 stores or doors.
          tone: positive
          claimRefs: [CO009]
        - date: "2025-06 to 2025-07"
          label: Capital raise seek and Sparkling Energy expansion
          detail: >-
            Microventures reported a plan to seek up to $20 million of new
            capital and announced Sparkling Energy at about $2.59 to $3 per
            can.
          tone: warning
          claimRefs: [CO010]
        - date: "2025"
          label: U.K. exit cited as risk
          detail: >-
            Yahoo's profile says the company exited the U.K. in early 2025,
            highlighting international-translation and pricing risk.
          tone: adverse
          claimRefs: [CO014]
        - date: "2026-06-14"
          label: IPO still unfiled
          detail: >-
            MEXC says the IPO remained rumored but unfiled, with no S-1,
            ticker, or underwriters disclosed.
          tone: neutral
          claimRefs: [CO012]
        - date: "2026-10-16"
          label: Current public employee lens
          detail: >-
            Yahoo/Forge showed 251 full-time employees, while official
            September-November 2026 Sparkling Energy promotion terms show active
            retail-linked energy marketing.
          tone: neutral
          claimRefs: [CO013, CO016]
    approximationNotes: null
    claimRefs: [CO004, CO007, CO008, CO009, CO010, CO012, CO013, CO014, CO016]
callouts:
  - calloutType: strength
    title: Brand plus distribution is the core overview takeaway
    body: >-
      The strongest public fact pattern is not a single product claim but the
      combination of distinctive brand positioning, a broadened beverage lineup,
      and distribution scale that third-party sources place above 133,000
      stores/doors.
    claimRefs: [CO001, CO002, CO009, CO011]
  - calloutType: risk
    title: Public governance and economics are still under-disclosed
    body: >-
      The company has enough public evidence to establish scale and momentum,
      but not enough to underwrite ownership control, unit economics, customer
      concentration, or debt/refinancing risk with confidence.
    claimRefs: [CO010, CO012, CO014, CO015]
