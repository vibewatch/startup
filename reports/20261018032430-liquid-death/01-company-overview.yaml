schemaVersion: "report-v2"
artifact: company-overview
slug: liquid-death
runDate: 2026-10-18
company:
  name: Liquid Death
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Liquid Death remains a founder-led private beverage brand built around
    heavy-metal-style marketing, aluminum cans, and a broadened portfolio that
    now spans water, sparkling water, iced tea, soda-flavored sparkling water,
    and Sparkling Energy. Public evidence in the assigned pool supports a
    roughly $1.4 billion March 2024 valuation and a 2024 scale lens of roughly
    $333 million sales/revenue and 133,000-plus doors, but public governance,
    cap-table, customer-concentration, and audited-economics disclosures remain
    thin.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Liquid Death's official surfaces still position the company as a premium,
      low-calorie beverage platform rather than a single canned-water SKU. The
      core identity is the same rebellious "murder your thirst" brand that made
      the company notable, but the current lineup now spans mountain water,
      soda-flavored sparkling water, iced tea, and Sparkling Energy in
      infinitely recyclable aluminum cans. That matters for later chapters
      because valuation and go-to-market questions should be framed as a
      multi-category beverage brand with entertainment-style marketing, not just
      a novelty water label. The same official materials also keep the
      sustainability message visible through a "death to plastic" frame, though
      the assigned evidence does not independently quantify the environmental or
      margin implications of that positioning.
    claimRefs: [CO001, CO002, CO003, CO006, CO016]
  - id: leadership-governance-and-ownership
    title: Leadership, governance, and ownership visibility
    body: >-
      Leadership remains visibly concentrated around founder Mike Cessario,
      whose creative background and brand voice are tightly intertwined with the
      company's market identity and origin story. Publicly accessible current
      management evidence in the assigned pool is thin but consistent on two
      named executives: Cessario as co-founder and CEO, and Ricky Khetarpaul as
      CFO. That gives some comfort that finance leadership has been formalized,
      especially alongside recurring IPO speculation, but it does not solve the
      core governance gap: the assigned public sources do not provide a clean
      board roster, control map, or preference-stack view. An X/Grok ownership
      summary points to a mix of founder, venture, strategic, and celebrity
      holders, but it should be treated only as a low-confidence pointer until
      primary cap-table material is produced.
    claimRefs: [CO004, CO005, CO015]
    tableRefs: [TO002]
  - id: funding-scale-and-channel-footprint
    title: Funding, scale, and channel footprint
    body: >-
      The refreshable public scale story remains strong even though the company
      is still private. NBC and MEXC both repeat the March 2024 round's roughly
      $1.4 billion valuation lens, while NBC reported $263 million of 2023
      global sales and 113,000 retail outlets across the U.S. and U.K. at that
      point. Later secondary profiles push the operating lens higher, with
      third-party sources describing roughly $333 million of 2024 sales/revenue
      and 133,000-plus stores or doors. Live Nation is strategically important
      because it appears both as an investor and as a live-events distribution
      channel, which means future underwriting should test whether that
      entertainment adjacency is a durable moat or a concentration risk.
      Despite the topline momentum, the assigned pool still lacks public
      evidence for customer count, channel mix, gross margin, burn, and credit
      terms.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO001, TO003]
  - id: milestones-and-current-risk-signals
    title: Milestones and current risk signals
    body: >-
      The dated public record shows a brand that scaled quickly from a
      founder-origin story into a broad retail beverage platform, but it also
      shows why the next diligence step cannot rely on hype alone. The company
      appears to have commercialized a Warped Tour-era insight into a 2019
      launch, hit a $1.4 billion private valuation by March 2024, widened its
      retail footprint and category set through 2025, and was still private and
      unfiled by mid-2026. At the same time, Yahoo's profile highlights
      competition, the early-2025 U.K. exit, and brand/legal volatility as real
      execution risks. The overview chapter therefore supports "scaled private
      brand with momentum" more than "fully de-risked consumer company."
    claimRefs: [CO004, CO007, CO008, CO009, CO010, CO012, CO014, CO016]
    figureRefs: [FO001]
