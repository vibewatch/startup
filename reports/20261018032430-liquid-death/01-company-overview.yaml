      - ["Ricky Khetarpaul", CFO, "Yahoo lists him as CFO; MEXC frames the hire as late-2025 finance professionalization for a possible IPO path.", "Provides finance leadership and public-market readiness coverage that the founder-led brand alone would not supply.", Medium]
