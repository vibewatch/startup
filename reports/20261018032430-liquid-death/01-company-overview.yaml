      - ["Science Inc.", "Venture investor (X/Grok synthesis)", "Represents institutional sponsorship in the shareholder mix, but exact economics are undisclosed here.", "Request board rights, liquidation preferences, and current ownership %."] 
      - ["Celebrity investors", "Brand-amplifying investors", "May help marketing reach, but governance and economics are opaque in public evidence.", "Separate promotional value from actual control or follow-on support."]
      - ["National retail accounts", "Distribution gatekeepers", "133,000-plus doors imply broad shelf access, but top-account dependence is not quantified publicly.", "Request account concentration, trade-spend, and channel-margin data."]
