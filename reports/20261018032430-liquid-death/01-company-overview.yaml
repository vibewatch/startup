  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-and-cap-table
      missingEvidence: >-
        Current cap table, board roster, investor rights, liquidation
        preferences, and any super-voting/control provisions.
      whyItMatters: >-
        Ownership and governance determine control, dilution risk, and return
        outcomes, but the assigned public pool provides only partial secondary
        summaries.
      diligencePath: >-
        Request the latest cap table, charter, investor-rights agreements, and
        current board observer/director list from management.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: economics-and-debt
      missingEvidence: >-
        Audited revenue recognition detail, gross margin, operating margin, cash
        burn, working-capital profile, and debt or credit-facility terms.
      whyItMatters: >-
        Public scale claims do not translate into investability without knowing
        underlying unit economics, cash needs, and covenant constraints.
      diligencePath: >-
        Request audited financial statements, monthly management accounts, and
        debt agreements with covenant definitions and maturity schedules.
      relatedQuestionRefs: [QO004]
    - type: private-evidence-only
      severity: material
      topic: customer-and-channel-concentration
      missingEvidence: >-
        Named top accounts, revenue share by top retailer, customer-count
        definition, and revenue contribution from Live Nation or other
        experiential channels.
      whyItMatters: >-
        Distribution breadth can still mask concentration, trade-spend pressure,
        or channel-specific volatility that changes underwriting materially.
      diligencePath: >-
        Request account-level sales concentration, channel-mix history, and
        customer-retention dashboards segmented by retailer and event channel.
      relatedQuestionRefs: [QO004, QO008]
