evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current cap table, board roster, investor rights, liquidation preferences, and any super-voting/control
      provisions.
    whyItMatters: >-
      Ownership and governance determine control, dilution risk, and return outcomes, but the assigned public pool
      provides only partial secondary summaries.
    diligencePath: >-
      Request the latest cap table, charter, investor-rights agreements, and current board observer/director list from
      management.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics-and-debt
    missingEvidence: >-
      Audited revenue recognition detail, gross margin, operating margin, cash burn, working-capital profile, and debt
      or credit-facility terms.
    whyItMatters: >-
      Public scale claims do not translate into investability without knowing underlying unit economics, cash needs, and
      covenant constraints.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, and debt agreements with covenant definitions
      and maturity schedules.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-concentration
    missingEvidence: >-
      Named top accounts, revenue share by top retailer, customer-count definition, and revenue contribution from Live
      Nation or other experiential channels.
    whyItMatters: >-
      Distribution breadth can still mask concentration, trade-spend pressure, or channel-specific volatility that
      changes underwriting materially.
    diligencePath: >-
      Request account-level sales concentration, channel-mix history, and customer-retention dashboards segmented by
      retailer and event channel.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Independent scanner or syndicated data that splits canned still water, sparkling, RTD tea, and energy-adjacent
      demand by channel, geography, and pack format.
    whyItMatters: >-
      Without that cut, the market case rests on a broad category ceiling plus adoption proxies instead of a defensible
      SAM or SOM.
    diligencePath: >-
      Request NielsenIQ, Circana, distributor scan, or retailer reset data that isolates canned premium hydration and
      RTD tea by chain and region.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Channel-level trade-spend, placement economics, repeat-purchase, and promotional ROI data by retailer, venue, and
      digital channel.
    whyItMatters: >-
      Public sources show who controls access and who pays at checkout, but they do not show whether each budget owner
      sees durable economic returns.
    diligencePath: >-
      Ask management for retailer scorecards, Amazon sell-through, venue economics, trade-spend ROI, and cohort repeat
      metrics by channel.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: Stable same-day SKU prices for Liquid Death and close substitutes across the same retailer set and pack sizes.
    whyItMatters: >-
      Without matched shelf pricing, the chapter can compare price posture but not real elasticity, promotion depth, or
      undercut risk.
    diligencePath: >-
      Capture same-retailer PDP or scanner data for identical pack sizes across Liquid Death, Open Water, Rambler,
      Waterloo, and Olipop/Poppi.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: venue-contract-economics
    missingEvidence: Contract economics, renewal horizon, and minimum-volume obligations for the Live Nation relationship.
    whyItMatters: >-
      The venue deal is a central moat claim, but its durability and cost to dislodge depend on terms that are not
      public in the assigned pool.
    diligencePath: >-
      Request distributor or management detail on exclusivity duration, economics, and whether the rights extend by
      venue class or geography.
  - type: missing-source
    severity: minor
    topic: shelf-share
    missingEvidence: >-
      Comparable current shelf-share or door-count data for Open Water, Waterloo, and other adjacencies in the same
      retail channels.
    whyItMatters: >-
      Better share and door data would show whether Liquid Death is truly winning head-to-head or just coexisting across
      different trips.
    diligencePath: >-
      Pull retailer audits or syndicated category data covering refrigerated and ambient beverage sets in the same
      chains.
  - type: private-evidence-only
    severity: material
    topic: gross-margin-burn-runway
    missingEvidence: Audited gross margin, contribution margin, sales and marketing spend, cash balance, monthly burn, and runway.
    whyItMatters: >-
      Without liquidity and margin disclosure, the company cannot be underwritten beyond revenue scale and valuation
      shorthand.
    diligencePath: >-
      Request FY2024-FY2026 management financials with monthly cash bridge and gross-margin waterfall by category and
      channel.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-denominator
    missingEvidence: >-
      Audited 2024 net revenue and a reconciliation of the $333M retail-sales label, the $333M revenue label, and the
      separate $240M company-revenue figure.
    whyItMatters: >-
      Retail sales and recognized company revenue have different denominators and cannot support the same growth or
      valuation conclusion.
    diligencePath: Request audited revenue statements and a gross-to-net bridge by channel for 2023 through 2025.
    relatedQuestionRefs:
      - QI004
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-net-pricing
    missingEvidence: Net realized revenue per case or can by channel, including discounts, chargebacks, and trade-promotion spend.
    whyItMatters: Public list prices do not establish revenue quality or contribution economics in a retailer-driven beverage model.
    diligencePath: Request channel P&L detail, retailer terms, and gross-to-net reconciliation for beverage and DTC sales.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: concentration-and-covenants
