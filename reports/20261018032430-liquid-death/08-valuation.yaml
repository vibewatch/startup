callouts:
  - calloutType: "recommendation"
    title: "Current call: track, not buy"
    body: >-
      Liquid Death looks large enough and brand-strong enough to merit active monitoring, but the
      public record still points to a stale 2024 valuation anchor rather than a fresh, economics-
      backed entry point.
    claimRefs: ["CV001", "CV003", "CV005", "CV011", "CV012"]
  - calloutType: "risk"
    title: "Price moves the answer"
    body: >-
      A cleaner cap table, audited unit economics, and a discounted entry could make the same
      company attractive; without those, illiquidity and capital-structure uncertainty dominate the
      expected-return math.
    claimRefs: ["CV007", "CV013", "CV014", "CV015", "CV016"]
