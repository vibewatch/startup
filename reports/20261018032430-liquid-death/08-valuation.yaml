company:
  name: "Liquid Death"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Public evidence still anchors Liquid Death to its March 2024 $1.4 billion round while
    Sacra estimates roughly $333 million of 2024 revenue and other sources show broad retail
    distribution, so the
    business looks real and scaled. The issue is price sensitivity: growth appears to have slowed
    to about 27%, no newer priced equity round is public, and the missing unit-economics,
    cap-table, and comparable-set evidence make TRACK / research-more the disciplined call.
sections:
  - id: "price-sensitive-recommendation"
    title: "Price-sensitive recommendation"
    body: >-
      The retained evidence supports treating Liquid Death as a scaled consumer brand rather than
      a novelty story: Retail Dive and UpMarket both anchor the latest priced financing at roughly
      $67 million raised on a $1.4 billion valuation in March 2024, while Sacra estimates 2024
      revenue at $333 million and MicroVentures says distribution reached more than 133,000
      retail locations. That is enough proof to keep the company on an investable watch list. It
      is not enough to recommend a buy at or above the last round by default. Everything-PR
      reports roughly 27% growth for 2024, down from triple-digit rates in 2022-2023, and notes
      that mixed consumer-staples valuations create a very different multiple environment from
      the phase that won the $1.4 billion mark. Without cleaner public evidence on gross margin durability, cash
      efficiency, or security seniority, the disciplined recommendation is track rather than buy.
    claimRefs: ["CV001", "CV002", "CV003", "CV005", "CV008", "CV011", "CV012", "CV013"]
    tableRefs: ["TV001", "TV002"]
    figureRefs: ["FV001"]
  - id: "financing-context-and-scenarios"
    title: "Financing context and scenarios"
    body: >-
      The financing context argues for patience. Sacra says no new priced equity round had been
      announced after March 2024 and that the company later added a convertible note due in 2028
      plus a $55 million Ares revolving line, while Microventures says the company was seeking up
      to $20 million of new capital in mid-2025 for capacity and distribution. That is not a
      distress signal by itself, but it does mean the public record since the last round points to
      balance-sheet management rather than a clean mark-up. At the same time, official and third-
      party sources show real breadth beyond plain canned water: Liquid Death's own site currently
      markets mountain water, iced tea, soda-flavored sparkling water, and energy, and the
      homepage promoted a Sparkling Energy campaign deep into late 2026. The bull case therefore
      exists, but it depends on mix and margin expansion proving durable enough to overcome a more
      demanding public-market and late-stage private-market backdrop.
    claimRefs: ["CV004", "CV007", "CV009", "CV010", "CV011", "CV015", "CV016"]
    tableRefs: ["TV003"]
  - id: "final-diligence-asks-and-thesis-breakers"
    title: "Final diligence asks and thesis-breakers"
    body: >-
      The remaining blockers are underwriting blockers, not storytelling blockers. UpMarket warns
      that pre-IPO investments are illiquid and can lose all capital, and Everything-PR says the
      company still had not filed for an IPO as of mid-2026 despite visible pre-IPO signals such
      as Goldman Sachs and a PepsiCo-alum CFO. Just as important, the public record does not offer
      a defensible comparable-set analysis on the same metric basis and security seniority, so a
      clean upside/downside range still depends on private diligence. The thesis breaks if growth
      continues to decelerate without corresponding proof of margin expansion, if debt and
      convertible instruments become the main source of incremental financing, or if the cap table
      reveals preferences that absorb most soft-exit value. The next diligence step is therefore
      to test whether improved economics or a better entry price can turn a strong brand into a
      strong investment.
    claimRefs: ["CV005", "CV006", "CV007", "CV012", "CV013", "CV014", "CV015", "CV016"]
