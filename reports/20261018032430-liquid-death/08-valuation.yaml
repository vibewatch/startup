      - ["Risk rating", "Medium-high", "Slower growth, financing opacity, and illiquidity create downside that is hard to price precisely from public evidence alone."]
      - ["Valuation stance", "Unsupported at the last-round mark", "The last priced round implies roughly 4.2x Sacra-estimated 2024 revenue, but disclosed margins and normalized comparable multiples are unavailable."]
      - ["Exit readiness", "Watch-list only", "Pre-IPO signals exist, but no public filing or newer priced equity round confirms a near-term liquidity event."]
    notes: >-
      Assessment synthesizes public sources as of 2026-10-18; the multiple uses the last priced
      valuation against Sacra-estimated revenue and is not an audited enterprise-value or GAAP metric.
    claimRefs: ["CV001", "CV002", "CV003", "CV005", "CV006", "CV011", "CV013"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Frame"
      - "Argument"
      - "What would change the view"
    rows:
      - ["Thesis", "Liquid Death has real scale: Sacra estimates $333M of 2024 revenue, MicroVentures reports 133k+ U.S. retail locations, and official pages show an active push into tea, soda-flavored sparkling, and energy.", "Audited proof that newer categories lift gross margin and repeat purchase would move the call closer to buy even without a new round."]
      - ["Anti-thesis", "The same evidence also shows slower growth, no newer priced equity mark, and a more difficult consumer multiple environment than the one that produced the 2024 valuation.", "A secondary discount or a new round with cleaner economics could create a margin of safety that the current public anchor does not offer."]
      - ["Swing factor", "Capital structure matters because public sources mention a convertible note, an Ares revolver, and illiquid pre-IPO access but do not disclose the full preference stack.", "A clean cap table, manageable covenants, and limited senior claims on exit proceeds would improve expected common-equity outcomes materially."]
    notes: >-
      This table converts retained evidence into investability tests rather than a precise target
      price; the swing factors are diligence gates, not forecast certainties.
    claimRefs: ["CV003", "CV005", "CV007", "CV008", "CV009", "CV010", "CV012", "CV013", "CV015", "CV016"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Energy and other mix-led extensions work, the mid-2025 ~$340M revenue projection is met or beaten, and public or private buyers reward the company as a multi-category platform.", "If entry is below the stale 2024 mark, upside comes from renewed growth and a reopened IPO or strategic-exit window rather than from simple multiple expansion at the old price.", "Category launches fail to repeat early traction or require too much marketing spend.", "Would need fresh evidence of margin improvement, strong sell-through in new categories, and a cleaner liquidity path."]
      - ["Base", "Liquid Death keeps growing but closer to the roughly 27% rate reported for 2024, with no new priced equity round and limited public disclosure on economics.", "Value remains anchored near the last round and returns depend on disciplined entry rather than operating surprise.", "Investors overpay for brand quality before unit economics are proven.", "This is the most supportable case from current public evidence."]
      - ["Bear", "Growth continues to slow, newer categories underperform, and the company depends more on debt, convertibles, or a softer financing market than on a higher-priced equity round.", "A down-round, flat secondary pricing, or a long illiquid hold can erase much of the headline brand strength for new investors.", "Preference stack, covenants, or capital intensity prove worse than outsiders expect.", "More likely if diligence cannot close the economics and cap-table gaps soon."]
    notes: >-
      Scenario logic is directional because public sources do not disclose audited margins, cash
      burn, or the preference stack; probability signals are qualitative rather than numerical.
    claimRefs: ["CV004", "CV005", "CV006", "CV007", "CV010", "CV011", "CV012", "CV013", "CV015", "CV016"]
