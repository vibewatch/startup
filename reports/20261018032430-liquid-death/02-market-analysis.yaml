      missingEvidence: Independent scanner or syndicated data that splits canned still water, sparkling, RTD tea, and energy-adjacent demand by channel, geography, and pack format.
      whyItMatters: Without that cut, the market case rests on a broad category ceiling plus adoption proxies instead of a defensible SAM or SOM.
      diligencePath: Request NielsenIQ, Circana, distributor scan, or retailer reset data that isolates canned premium hydration and RTD tea by chain and region.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: budget-ownership
      missingEvidence: Channel-level trade-spend, placement economics, repeat-purchase, and promotional ROI data by retailer, venue, and digital channel.
      whyItMatters: Public sources show who controls access and who pays at checkout, but they do not show whether each budget owner sees durable economic returns.
