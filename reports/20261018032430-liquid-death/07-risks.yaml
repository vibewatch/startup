  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: Exact covenants, maturity schedule, borrowing-base availability, and refinancing triggers for the Ares facility.
      whyItMatters: Credit headroom determines whether distribution and category expansion can continue without a dilutive or forced financing event.
      diligencePath: Request the credit agreement, latest compliance certificate, and internal 13-week cash forecast.
      relatedQuestionRefs: [QR009]
    - type: missing-source
      severity: material
      topic: channel-concentration
      missingEvidence: Revenue or gross-margin exposure by top retailer, direct-to-consumer, and Live Nation-related channels.
      whyItMatters: Public door counts do not show whether the growth model is diversified or whether a few channels drive an outsized share of gross profit.
      diligencePath: Ask management for a channel-mix bridge, top-account concentration, and same-door velocity trend.
      relatedQuestionRefs: [QR004]
      relatedTableRefs: [TR003]
    - type: conflicting-data
      severity: material
      topic: product-safety
      missingEvidence: Consolidated recall history, third-party test program, and management response to contaminant or safety criticism.
      whyItMatters: Public quality narratives are incomplete and sometimes contradictory, which leaves brand-trust downside hard to size.
      diligencePath: Review QA protocols, complaint logs, recall records, and third-party lab results for current SKUs.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: trademark-litigation
      missingEvidence: Current docket status, expected timing, and financial exposure of the Death Wish Coffee dispute.
      whyItMatters: An injunction, settlement cost, or naming restriction could delay product extension and weaken the brand's provocation-led playbook.
      diligencePath: Pull the active docket and ask counsel or management for reserves, timeline, and commercial workaround options.
