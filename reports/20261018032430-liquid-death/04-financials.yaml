artifact: financials
slug: liquid-death
runDate: 2026-10-18
company:
  name: Liquid Death
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports real scale but not a clean 2024 net-revenue figure: TapTwice labels
    $333 million as revenue, while MicroVentures labels $333 million as retail sales and separately
    cites $240 million of company revenue. Current product breadth and distribution are visible,
    but gross margin, burn, cash, runway, customer concentration, and debt terms remain undisclosed,
    preventing a reliable view of capital adequacy or margin progression.
sections:
  - id: revenue-model-and-channels
    title: Revenue model and channel architecture
    body: >-
      Liquid Death now presents itself as a multi-SKU beverage company rather than a single canned
      water novelty. The retained official pages show a portfolio spanning mountain water, iced tea,
      soda-flavored sparkling water, and energy, while third-party analysis describes an asset-light
      operating model in which the company owns the brand, outsources production to co-packers, and
      monetizes through mass retail, convenience and on-premise accounts, and a direct storefront.
      That matters financially because the revenue bridge is driven by distribution breadth and
      category expansion, not by proprietary manufacturing. Merchandise appears to be a meaningful
      supplemental stream in one analyst's estimate, with potentially better margins than beverages,
      but the company has not publicly broken out audited stream revenue or category margins.
    claimRefs: [CI001, CI002, CI004, CI012]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-traction-and-public-scale
    title: Pricing, traction, and public scale proxies
    body: >-
      The public record is strongest on topline and footprint, not on realized economics. NBC News
      attributed $263 million of 2023 global sales to a company release. For 2024, TapTwice labels
      $333 million as revenue, whereas MicroVentures calls $333 million retail sales and separately
      states that company revenue was $240 million. Those are not interchangeable metrics, so the
      retained evidence does not establish audited 2024 net revenue. Pricing evidence is also thin:
      MicroVentures reported an expected $2.59 to $3 shelf price for a 12-ounce Sparkling Energy can,
      not current realized revenue. The official 2026 promotion requiring a linked retail-account
      purchase reinforces the importance of retailer sell-through, but discloses no discount,
      conversion, or contribution-margin data.
    claimRefs: [CI005, CI006, CI007, CI012, CI015, CI016]
    tableRefs: [TI002]
  - id: capital-needs-and-unit-economics
    title: Capital needs and unit-economics visibility
    body: >-
      The most decision-useful financing signal in the retained pool is MicroVentures' report that
      Liquid Death was seeking up to $20 million of additional capital in June 2025 to expand
      production capacity and distribution. Funding sought is not cash available, and the source
      does not disclose whether that capital was secured. Yahoo Finance's profile adds two current
      operating proxies — 251 full-time employees and a derived Forge Price of $6.59 as of Oct. 16,
      2026 — while explicitly warning that the price is not a quotation and may rely on limited data.
      These indicators show operating scale and financing interest, not liquidity. Gross margin,
      net revenue after trade spend, working-capital needs, capex, burn, cash, runway, and debt terms
      remain outside the retained public evidence.
    claimRefs: [CI009, CI010, CI011, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      Financially, Liquid Death looks like a scaled branded-beverage platform with genuine demand
      signals, expanding product breadth, and enough external proof to support revenue-quality
      diligence rather than brand-story diligence alone. The adverse evidence centers on premium
      CPG economics: replicable products, shelf-space and pricing pressure, the UK exit, and no
      public proof that distinctive marketing converts into durable margin rather than expensive
      awareness. The revenue-label conflict further prevents a clean topline baseline. Until
      management discloses audited net revenue, category gross margins, concentration, trade spend,
      and a cash and debt bridge, revenue quality, capital intensity, and the margin path remain only
      partially underwritable.
    claimRefs: [CI003, CI008, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Packaged beverages
        - Branded canned beverages sold through retail, convenience, on-premise, and DTC channels
        - Cans / cases
        - Portfolio publicly spans mountain water, iced tea, soda-flavored sparkling water, and energy
        - Category breadth is official; stream-level revenue mix is undisclosed
        - Break out net revenue, gross margin, and velocity by beverage category and channel
      - - Merchandise and drops
        - DTC apparel, accessories, and limited-edition collectibles tied to brand campaigns
        - Orders / units
        - Deep Research Global cites roughly $3M of 2021 merch sales on $45M of revenue and estimates ~10% mix
        - Supplemental stream is visible, but magnitude is third-party estimated rather than audited
        - Provide annual merch revenue, gross margin, and repeat-purchase contribution
      - - Sparkling Energy
        - New better-for-you energy line sold through retail accounts with promotional support
        - 12-ounce cans
        - Official site and MicroVentures confirm 2026 launch period and public list-price proxy
        - Launch existence is clear; realized sell-through, allowances, and gross profit are undisclosed
        - Provide launch velocity, retailer allowances, and net contribution margin
      - - DTC storefront
        - Owned web storefront used for beverages, merch, and new-product incubation
        - Orders
        - Public sources show the channel exists but not its revenue share
        - Strategic role is visible; economics are not
        - Provide DTC revenue mix, CAC, repeat rate, and fulfillment margin
    notes: >-
      Current value/status mixes official product confirmation with third-party estimates; Liquid
      Death does not publicly disclose audited stream-level revenue mix in the retained source set.
    claimRefs: [CI001, CI002, CI004, CI007, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Sparkling Energy
        - $2.59-$3 per 12-ounce can
        - Publicly reported expected shelf price, not realized net revenue
        - Trade spend, retailer margin, and promo cadence undisclosed
        - MicroVentures
      - - Core beverage portfolio
        - null
        - Retained public sources confirm categories and channels, not a current list-price card
        - Case-pack pricing, promotional allowances, and contract terms undisclosed
        - Liquid Death official pages plus Deep Research Global
      - - Merchandise drops
        - Example scarcity drop at $500 for 100 Tony Hawk boards
        - Event pricing is visible, but standard apparel/accessory ASPs are not
        - Baseline merch basket economics undisclosed
        - Deep Research Global
      - - DTC promotions
        - Promotional incentives used to trigger qualifying retail purchases
        - Shows monetization support around retail sell-through rather than subscription disclosure
        - Redemption costs and conversion rates undisclosed
        - Liquid Death homepage promotion
    notes: >-
      Null price cells mean the retained public pool did not surface a current price card; official
      pricing evidence here should not be mistaken for realized net revenue or gross margin.
    claimRefs: [CI004, CI007, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 revenue / retail sales
        - $333M labeled as revenue by TapTwice
        - Medium
        - Establishes a third-party scale estimate but conflicts with another revenue label
        - Reconcile to audited company net revenue and define the denominator
      - - 2024 retail sales
        - $333M labeled as retail sales by MicroVentures
        - Medium
        - Consumer retail sell-through is not the same as company revenue
        - Provide the gross-to-net bridge from retail sales to recognized revenue
      - - 2024 company revenue
        - $240M in MicroVentures' retrospective comparison
        - Medium
        - Creates a material denominator conflict with the $333M revenue label
        - Provide audited revenue and explain whether sources mix retail sales and net revenue
      - - Full-time employees
        - 251 as of Oct. 16, 2026
        - Medium
        - Gives a current proxy for fixed-cost footprint
        - Provide payroll, contractor mix, and sales/marketing headcount split
      - - Gross margin
        - null
        - Low
        - Margin path is central to branded-beverage underwriting
        - Provide companywide and category gross margin with freight and promo treatment
      - - CAC / payback
        - null
        - Low
        - Content efficiency claims do not establish acquisition cost or payback
        - Provide CAC by channel, repeat rate, contribution margin, and payback
      - - Cash burn / runway
        - null
        - Low
        - Liquidity determines whether another financing is discretionary or required
        - Provide monthly burn, unrestricted cash, and runway under current plan
      - - Debt / covenant exposure
        - null
        - Low
        - Debt terms can force dilution or constrain working capital
        - Provide facility size, maturity, collateral, and covenant tests
    notes: >-
      Null values mean the metric was not disclosed in the retained public evidence; the two
      $333M labels and the separate $240M company-revenue figure are preserved rather than combined.
    claimRefs: [CI003, CI006, CI010, CI014, CI015, CI016]
figures:
