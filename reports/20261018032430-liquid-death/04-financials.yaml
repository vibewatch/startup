  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin-burn-runway
      missingEvidence: Audited gross margin, contribution margin, sales and marketing spend, cash balance, monthly burn, and runway.
      whyItMatters: Without liquidity and margin disclosure, the company cannot be underwritten beyond revenue scale and valuation shorthand.
      diligencePath: Request FY2024-FY2026 management financials with monthly cash bridge and gross-margin waterfall by category and channel.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: revenue-denominator
      missingEvidence: Audited 2024 net revenue and a reconciliation of the $333M retail-sales label, the $333M revenue label, and the separate $240M company-revenue figure.
      whyItMatters: Retail sales and recognized company revenue have different denominators and cannot support the same growth or valuation conclusion.
      diligencePath: Request audited revenue statements and a gross-to-net bridge by channel for 2023 through 2025.
      relatedQuestionRefs: [QI004, QI006]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: realized-net-pricing
      missingEvidence: Net realized revenue per case or can by channel, including discounts, chargebacks, and trade-promotion spend.
      whyItMatters: Public list prices do not establish revenue quality or contribution economics in a retailer-driven beverage model.
      diligencePath: Request channel P&L detail, retailer terms, and gross-to-net reconciliation for beverage and DTC sales.
      relatedQuestionRefs: [QI002, QI003]
      relatedTableRefs: [TI001, TI002]
    - type: missing-source
      severity: material
      topic: concentration-and-covenants
      missingEvidence: Top-account and channel concentration, plus any current debt-facility size, maturity, collateral, and covenant package.
      whyItMatters: A concentrated retail base or restrictive debt terms could change both runway and dilution risk materially.
      diligencePath: Request top-10 customer and channel mix, debt agreements, and covenant compliance history.
      relatedQuestionRefs: [QI005, QI007]
      relatedTableRefs: [TI003]
