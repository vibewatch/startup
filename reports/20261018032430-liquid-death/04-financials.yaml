    title: Revenue model bridge
    type: flow
    summary: Public evidence points to a branded-beverage model that converts category breadth and retail distribution into revenue, with merchandise acting as a higher-margin supplement.
    data:
      nodes:
        - id: products
          label: Product portfolio
          note: Mountain water, iced tea, soda-flavored sparkling water, and energy are all visible in retained official pages.
        - id: retail
          label: Retail and mass accounts
          note: Third-party analysis describes grocery and mass retail as the core volume layer.
        - id: on-premise
          label: Convenience, venues, and on-premise
          note: Public commentary points to live-event and convenience channels as premium single-serve outlets.
        - id: dtc
          label: DTC storefront and promotions
          note: Owned storefront exists, but disclosed evidence points to a strategic support role rather than the main volume engine.
        - id: merch
          label: Merchandise and drops
          note: Third-party estimates suggest merch is a real, higher-margin supplement to beverage revenue.
        - id: revenue
          label: Net revenue
          note: Public sources conflict between company revenue and retail-sales labels, so audited net revenue remains unverified.
        - id: profit
          label: Gross profit path
          note: Public evidence identifies channel and product drivers but does not quantify gross margin.
    claimRefs: [CI001, CI002, CI004, CI012, CI014]
