      - number: '1.4'
        title: Milestones and current risk signals
        blocks:
          - type: paragraph
            body: >-
              The dated public record shows a brand that scaled quickly from a founder-origin story into a broad retail
              beverage platform, but it also shows why the next diligence step cannot rely on hype alone. The company
              appears to have commercialized a Warped Tour-era insight into a 2019 launch, hit a $1.4 billion private
              valuation by March 2024, widened its retail footprint and category set through 2025, and was still private
              and unfiled by mid-2026. At the same time, Yahoo's profile highlights competition, the early-2025 U.K.
              exit, and brand/legal volatility as real execution risks. The overview chapter therefore supports "scaled
              private brand with momentum" more than "fully de-risked consumer company."
