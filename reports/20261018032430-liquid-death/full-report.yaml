  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Liquid Death's public product stack runs from brand identity and beverage portfolio through packaging, outsourced
      manufacturing, and channel/community execution.
    data:
      layers:
        - label: Brand identity
          detail: Humor-heavy, metal-coded positioning that reframes plain hydration as entertainment.
          modules:
            - label: Murder Your Thirst
              note: tagline / tonal anchor
            - label: Tallboy can aesthetic
              note: beer / energy visual language
          outputs:
            - label: Shelf attention and social shareability
        - label: Occasion design
