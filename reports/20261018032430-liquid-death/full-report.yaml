              - CI007
              - CI012
      - number: '4.3'
        title: Capital needs and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The most decision-useful financing signal in the retained pool is MicroVentures' report that Liquid Death
              was seeking up to $20 million of additional capital in June 2025 to expand production capacity and
              distribution. Funding sought is not cash available, and the source does not disclose whether that capital
              was secured. Yahoo Finance's profile adds two current operating proxies — 251 full-time employees and a
              derived Forge Price of $6.59 as of Oct. 16, 2026 — while explicitly warning that the price is not a
              quotation and may rely on limited data. These indicators show operating scale and financing interest, not
              liquidity. Gross margin, net revenue after trade spend, working-capital needs, capex, burn, cash, runway,
              and debt terms remain outside the retained public evidence.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI006
              - CI010
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Financially, Liquid Death looks like a scaled branded-beverage platform with genuine demand signals,
              expanding product breadth, and enough external proof to support revenue-quality diligence rather than
              brand-story diligence alone. The adverse evidence centers on premium CPG economics: replicable products,
              shelf-space and pricing pressure, the UK exit, and no public proof that distinctive marketing converts
              into durable margin rather than expensive awareness. The revenue-label conflict further prevents a clean
              topline baseline. Until management discloses audited net revenue, category gross margins, concentration,
              trade spend, and a cash and debt bridge, revenue quality, capital intensity, and the margin path remain
              only partially underwritable.
            claimRefs:
              - CI003
              - CI008
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Liquid Death now presents itself as a broader beverage platform rather than a single canned-water SKU. The
              official About page explicitly lists Energy, Soda-Flavored Sparkling Water, Iced Tea, and Mountain Water,
              and independent profiles still describe the same expansion pattern from water into sparkling, tea, and
              energy. The customer workflow is deliberately simple: encounter the brand on a store shelf or at a live
              event, pick a nonalcoholic drink that visually resembles beer or energy, and then deepen engagement
              through merch, the Country Club, or retail-linked promotions. That makes the product architecture
              consumer- and channel-led instead of software-led: the distinctive can, the portfolio naming system, and
              the entertainment tone do more of the work than any disclosed technical feature set.
