  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Energy and other mix-led extensions work, the mid-2025 ~$340M revenue projection is met or beaten, and public
          or private buyers reward the company as a multi-category platform.
        - >-
          If entry is below the stale 2024 mark, upside comes from renewed growth and a reopened IPO or strategic-exit
          window rather than from simple multiple expansion at the old price.
        - Category launches fail to repeat early traction or require too much marketing spend.
        - >-
          Would need fresh evidence of margin improvement, strong sell-through in new categories, and a cleaner
          liquidity path.
      - - Base
        - >-
          Liquid Death keeps growing but closer to the roughly 27% rate reported for 2024, with no new priced equity
          round and limited public disclosure on economics.
        - >-
          Value remains anchored near the last round and returns depend on disciplined entry rather than operating
          surprise.
        - Investors overpay for brand quality before unit economics are proven.
        - This is the most supportable case from current public evidence.
      - - Bear
        - >-
          Growth continues to slow, newer categories underperform, and the company depends more on debt, convertibles,
          or a softer financing market than on a higher-priced equity round.
        - >-
          A down-round, flat secondary pricing, or a long illiquid hold can erase much of the headline brand strength
          for new investors.
        - Preference stack, covenants, or capital intensity prove worse than outsiders expect.
        - More likely if diligence cannot close the economics and cap-table gaps soon.
    notes: >-
      Scenario logic is directional because public sources do not disclose audited margins, cash burn, or the preference
      stack; probability signals are qualitative rather than numerical.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
