    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments skew consumer, retail, and live-event driven
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a consumer beverage model rather than a workflow-embedded enterprise account
              model. Official materials frame Liquid Death as a portfolio of premium low-calorie beverages sold in
              recyclable cans, while third-party customer evidence repeatedly describes a young consumer target,
              mass-retail distribution, live-event consumption, and direct-to-consumer community surfaces. The most
              concrete buyer proofs in the assigned pool are retail chains, venue operators, and consumer-marketing
              programs, not named institutional end-users or procurement-heavy enterprise deployments. The current
              official retailer-linked energy promotion asks buyers to connect a listed retail account and make a
              qualifying purchase, showing a mechanism for joining retail transactions to direct engagement. It
              establishes an activation path, not retention, because no repeat count or cohort denominator is disclosed.
            claimRefs:
              - CU001
              - CU002
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption proof is strongest in store count and channel expansion
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is much clearer on breadth than on depth. NBC captured management's March 2024
              disclosure of 113,000 retail outlets across the U.S. and U.K., and later third-party summaries place the
              brand in more than 133,000 stores worldwide. Earlier named channel wins show a progression from pilot and
              anchor accounts into scaled distribution: Whole Foods, a 200-store 7-Eleven trial, and Live Nation venue
              exclusivity all appear before the wider national chain footprint cited in later sources. That progression
              supports real commercial adoption even though public sources still emphasize reach more than repeat
              purchase behavior.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU008
              - CU011
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU011
              - CU012
      - number: '6.3'
        title: Durability is less proven than reach
        blocks:
          - type: paragraph
            body: >-
              The weakest public customer evidence layer is retention and concentration. The assigned sources show
              multiple demand surfaces — retail shelves, live events, merchandise, community programs, and
              retailer-linked promotions — but they do not disclose NRR, GRR, churn, contract length, or account-level
              revenue concentration. As a result, Liquid Death's customer durability currently has to be inferred from
              continued distribution growth and brand engagement rather than verified renewal behavior. The most
              skeptical source in the pool also highlights a structural risk: premium canned water can look like a
              branding triumph before it looks like a functionally sticky product.
            claimRefs:
              - CU002
              - CU005
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is validated in public channels
            body: >-
              Liquid Death has credible public evidence of scaled retail and live-event adoption, with independent
              sources supporting 113k to 133k+ store/outlet reach and named anchor channels such as Whole Foods,
              7-Eleven, and Live Nation.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU011
          - type: callout
            title: Retention proof lags distribution proof
            body: >-
              Public evidence is still much better at proving where Liquid Death is sold than how well accounts or
              consumers renew, repurchase, or concentrate revenue over time.
            calloutType: risk
            claimRefs:
              - CU005
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk profile
        blocks:
          - type: paragraph
            body: >-
              The top residual risk is brand durability inside a commoditized category. Independent profile sources
              describe Liquid Death as operating in a saturated non-alcoholic beverage market where core products are
              easy to copy, while the same sources point to a failed UK push and the need to keep reinventing an
              entertainment-first marketing model. That matters because the company is no longer a tiny challenger
              adding first doors: third-party profiles cite 133,000-plus stores, Live Nation-linked event distribution,
              and fresh capital needs to support capacity and working capital. In that setup, even a modest slowdown in
              shelf velocity or a weaker brand handoff into new categories can create an outsize effect on margin,
              channel leverage, and financing flexibility.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR011
              - CR014
      - number: '7.2'
        title: Legal, privacy, and reputation risk
        blocks:
          - type: paragraph
            body: >-
              The visible legal stack is broader than a single lawsuit. Liquid Death's own privacy language says it uses
              email addresses and other non-cookie personal information for behavioral advertising on platforms such as
              Facebook and Google, which means state privacy compliance and vendor governance are real operating
              requirements rather than theoretical issues. On the brand side, third-party profiles tie provocative
              naming to both lawsuit threats and an active coffee trademark case, while the same sources describe
              sustainability and category-extension criticism that can turn a clever marketing edge into a reputational
              drag. None of these issues looks thesis-breaking on its own today, but together they raise the odds that a
              brand built on provocation can trigger avoidable legal cost or trust erosion.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR012
              - CR013
      - number: '7.3'
        title: Operating, channel, and partner dependence
        blocks:
          - type: paragraph
            body: >-
              Operationally, Liquid Death is taking on more complexity at the same time that its scale is becoming
              harder to hide with novelty. Official pages now present the business as a multi-line beverage company
              spanning water, iced tea, and energy drinks, while independent sources cite a 133,000-plus-door footprint,
              a Live Nation-led experiential channel, a $55 million credit facility, and a mid-2025 search for more
              production capital. Those facts point to a common risk pattern: the company has to coordinate formulation,
              inventory, working capital, and field execution across more SKUs and more channels before public evidence
              shows mature unit economics. Hiring activity and a distributed operating footprint are sensible mitigants,
              but they are still evidence of ongoing build-out rather than proof that the operating model is settled.
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Kill criteria and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The cleanest thesis-break triggers are measurable. Re-underwrite aggressively if store count or
              event-channel distribution keeps rising but new financing remains necessary, because that would imply the
              brand is buying reach faster than it is converting reach into durable cash flow. Likewise, a wider replay
              of the UK translation problem, loss of anchor partners such as Live Nation, or any escalation in privacy
              or trademark disputes would all signal that the company's moat is narrower than its valuation assumes.
              Before treating the current risk stack as acceptable, diligence should resolve credit covenants, channel
              concentration, the present status of the Death Wish litigation, and whether quality or sustainability
              criticism has driven any internal remediation that is not visible in public sources.
            claimRefs:
              - CR005
              - CR007
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Brand durability is the primary residual risk
            body: >-
              The investment case still depends on Liquid Death proving that provocation, not just novelty, can hold
              shelf space and margins once the business is already national and multi-category.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR014
          - type: callout
            title: Visible mitigations exist, but they are still build-out signals
            body: >-
              Privacy controls, distributed hiring, and anchor-channel relationships show operational intent, yet public
              evidence still reads like a scaling system under construction rather than a mature cash engine.
            calloutType: insight
            claimRefs:
              - CR002
              - CR003
              - CR015
          - type: callout
            title: Treat liquidity and concentration as go / no-go diligence items
            body: >-
              Do not underwrite the current valuation multiple without resolving facility covenants, channel
              concentration, and the current litigation and remediation status behind the public narrative.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports treating Liquid Death as a scaled consumer brand rather than a novelty
              story: Retail Dive and UpMarket both anchor the latest priced financing at roughly $67 million raised on a
              $1.4 billion valuation in March 2024, while Sacra estimates 2024 revenue at $333 million and MicroVentures
              says distribution reached more than 133,000 retail locations. That is enough proof to keep the company on
              an investable watch list. It is not enough to recommend a buy at or above the last round by default.
              Everything-PR reports roughly 27% growth for 2024, down from triple-digit rates in 2022-2023, and notes
              that mixed consumer-staples valuations create a very different multiple environment from the phase that
              won the $1.4 billion mark. Without cleaner public evidence on gross margin durability, cash efficiency, or
              security seniority, the disciplined recommendation is track rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing context and scenarios
        blocks:
          - type: paragraph
            body: >-
              The financing context argues for patience. Sacra says no new priced equity round had been announced after
              March 2024 and that the company later added a convertible note due in 2028 plus a $55 million Ares
              revolving line, while Microventures says the company was seeking up to $20 million of new capital in
              mid-2025 for capacity and distribution. That is not a distress signal by itself, but it does mean the
              public record since the last round points to balance-sheet management rather than a clean mark-up. At the
              same time, official and third- party sources show real breadth beyond plain canned water: Liquid Death's
              own site currently markets mountain water, iced tea, soda-flavored sparkling water, and energy, and the
              homepage promoted a Sparkling Energy campaign deep into late 2026. The bull case therefore exists, but it
              depends on mix and margin expansion proving durable enough to overcome a more demanding public-market and
              late-stage private-market backdrop.
            claimRefs:
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The remaining blockers are underwriting blockers, not storytelling blockers. UpMarket warns that pre-IPO
              investments are illiquid and can lose all capital, and Everything-PR says the company still had not filed
              for an IPO as of mid-2026 despite visible pre-IPO signals such as Goldman Sachs and a PepsiCo-alum CFO.
              Just as important, the public record does not offer a defensible comparable-set analysis on the same
              metric basis and security seniority, so a clean upside/downside range still depends on private diligence.
              The thesis breaks if growth continues to decelerate without corresponding proof of margin expansion, if
              debt and convertible instruments become the main source of incremental financing, or if the cap table
              reveals preferences that absorb most soft-exit value. The next diligence step is therefore to test whether
              improved economics or a better entry price can turn a strong brand into a strong investment.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current call: track, not buy'
            body: >-
              Liquid Death looks large enough and brand-strong enough to merit active monitoring, but the public record
              still points to a stale 2024 valuation anchor rather than a fresh, economics- backed entry point.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV012
          - type: callout
            title: Price moves the answer
            body: >-
              A cleaner cap table, audited unit economics, and a discounted entry could make the same company
              attractive; without those, illiquidity and capital-structure uncertainty dominate the expected-return
              math.
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
