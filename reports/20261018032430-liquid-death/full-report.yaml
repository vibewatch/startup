      - number: '4.2'
        title: Pricing, traction, and public scale proxies
        blocks:
          - type: paragraph
            body: >-
              The public record is strongest on topline and footprint, not on realized economics. NBC News attributed
              $263 million of 2023 global sales to a company release. For 2024, TapTwice labels $333 million as revenue,
              whereas MicroVentures calls $333 million retail sales and separately states that company revenue was $240
              million. Those are not interchangeable metrics, so the retained evidence does not establish audited 2024
              net revenue. Pricing evidence is also thin: MicroVentures reported an expected $2.59 to $3 shelf price for
              a 12-ounce Sparkling Energy can, not current realized revenue. The official 2026 promotion requiring a
              linked retail-account purchase reinforces the importance of retailer sell-through, but discloses no
              discount, conversion, or contribution-margin data.
            claimRefs:
