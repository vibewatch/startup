          A clean cap table, manageable covenants, and limited senior claims on exit proceeds would improve expected
          common-equity outcomes materially.
    notes: >-
      This table converts retained evidence into investability tests rather than a precise target price; the swing
      factors are diligence gates, not forecast certainties.
