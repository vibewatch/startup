              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Competitor advantages vary by buyer criterion
        blocks:
          - type: paragraph
            body: >-
              No single rival dominates every comparison axis. PepsiCo and Coca-Cola win on scale, shelf, and ad muscle;
              their weakness is that the same corporate size makes irreverent anti-marketing harder to sell
              authentically. Sustainability-led substitutes such as Open Water, JUST Water, and Rambler are closer
              product swaps when the shopper mostly wants aluminum or alternative packaging rather than a loud
              subculture badge. Olipop and Poppi are more dangerous when the buyer wants a strong better-for-you
              proposition, while flavored-water brands like Waterloo or Spindrift can win routine in-home trips on
              flavor and simpler price architecture. The pool does not retain stable current SKU prices for like-sized
              packs, so the right conclusion is qualitative: Liquid Death is selling identity, occasion fit, and channel
              placement more than it is winning a clean lowest-price hydration comparison.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat is real but mostly intangible
        blocks:
          - type: paragraph
            body: >-
              The moat is credible, but it is not hard technology or ingredient IP. Harvard's 2022 case already framed
              the core tension as how to broaden the audience, extend the line, and keep the brand "cool" while growth
              pulls it toward the mainstream. Yahoo Finance's risk summary adds that the company is now competing across
              water, tea, energy, and better-for-you soda, and that packaging- or marketing-led imitation can pressure
              price and shelf share even if a competitor cannot copy the exact tone. The same profile's UK-exit example
              matters because it shows the brand's cultural coding and premium price point may not travel cleanly.
              Litmus reaches the same endpoint from another angle: if the company starts to read like a corporate
              imitation of its own outsider voice, the asset supporting the premium can decay faster than a physical
              distribution network.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The most dangerous rival is often not another water SKU
            body: >-
              Liquid Death wins a specific social occasion—healthy, non-alcoholic, and still cool to hold—so NA
              aperitifs, NA beer, and better-for-you soda can take share even when they do not look like bottled water
              competitors on a retailer planogram.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP011
          - type: callout
            title: The moat depends on staying culturally credible while scaling
            body: >-
              Incumbents do not need to duplicate the joke perfectly to hurt Liquid Death; they can crowd shelf space,
              outspend on distribution, or wait for the brand to become less outsider-coded as it broadens
              internationally and across more beverage categories.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP014
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and channel architecture
        blocks:
          - type: paragraph
            body: >-
              Liquid Death now presents itself as a multi-SKU beverage company rather than a single canned water
              novelty. The retained official pages show a portfolio spanning mountain water, iced tea, soda-flavored
              sparkling water, and energy, while third-party analysis describes an asset-light operating model in which
              the company owns the brand, outsources production to co-packers, and monetizes through mass retail,
              convenience and on-premise accounts, and a direct storefront. That matters financially because the revenue
              bridge is driven by distribution breadth and category expansion, not by proprietary manufacturing.
              Merchandise appears to be a meaningful supplemental stream in one analyst's estimate, with potentially
              better margins than beverages, but the company has not publicly broken out audited stream revenue or
              category margins.
            claimRefs:
