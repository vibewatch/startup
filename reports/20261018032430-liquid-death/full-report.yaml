  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lens
        blocks:
          - type: paragraph
            body: >-
              The usable market boundary is broader than plain packaged water but narrower than all beverages. Official
              company copy and multiple secondary analyses point to a premium hydration franchise that starts with still
              and sparkling water, then extends into flavored sparkling, iced tea, and energy-adjacent use cases. That
              matters because Liquid Death is using packaging, tone, and occasion design to compete against status-quo
              substitutes such as commodity bottled water, tap water in social settings, soda, and conventional RTD
              refreshment choices rather than trying to win on formulation alone. Public sources provide a workable
              top-down ceiling and a few commercial proxies, including broad U.S. bottled-water category estimates,
              door-count estimates, and premium retail price points. What they do not provide is a clean
              company-specific SAM or SOM broken out by channel, pack format, or retailer budget, so the right
              analytical posture is to preserve the broad lenses and state their limitations instead of pretending they
              reconcile into one precise TAM stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM014
