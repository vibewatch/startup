      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests Liquid Death wins where identity and context matter as much as hydration.
              The likely end-user base starts with culture-seeking Gen Z and younger millennial consumers, extends to
              sober-social and event-driven buyers who want a nonalcoholic option that still looks culturally credible,
              and reaches household shoppers who are willing to pay a premium for convenience, novelty, or
              sustainability cues. The payer is usually the consumer, but adoption depends heavily on intermediaries:
              retail category managers, venue buyers, Amazon merchandising, and festival operators decide whether the
              product gets the cooler, endcap, or event placement that turns attention into trial. The channel pattern
              in public sources is consistent: early traction came through DTC, Amazon, Whole Foods, 7-Eleven, and
              identity-aligned venues, then expanded into broader grocery, mass, and club retail as the brand proved it
              could turn cultural buzz into sell-through.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM013
              - CM015
      - number: '2.3'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in public evidence are not product science or regulation; they are brand
              theater, shelf distinctiveness, sustainability framing, and a route-to-market that compounds awareness
              through creators, events, and retail visibility. The tallboy aluminum format and anti-plastic narrative
              create a reason to pay more for a commodity-like product, while product-line expansion broadens the number
              of consumption occasions the brand can address. Those same strengths define the key constraints. Switching
              costs for end consumers remain low because the underlying beverage categories are crowded and the core
              hydration need is generic, so the moat depends on maintaining creative relevance and retail execution.
              Public sources also point to capital intensity, category crowding, and practical format tradeoffs such as
              limited resealability versus plastic bottles. For valuation work, this means the market case is strongest
              when treated as a premium brand-and-distribution thesis, not as a proprietary product category with
              lock-in.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Packaging and tone are the market wedge
            body: >-
              The strongest market evidence is not that Liquid Death found a new liquid category, but that it found a
              new way to sell a commodity beverage at premium price points by changing the can, the context, and the
              cultural meaning of the purchase.
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM013
          - type: callout
            title: Precise underwriting still lacks a clean SAM/SOM
            body: >-
              Public data is rich enough to show a large category and visible adoption, but too thin to isolate
              channel-level budget ownership, repeat economics, or a defensible SAM/SOM without management or scanner
              data.
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set broadens beyond water
        blocks:
          - type: paragraph
            body: >-
              The chapter pool supports a wider market boundary than "premium water." Liquid Death's official surface
              now spans mountain water, soda-flavored sparkling water, iced tea, and energy, which means the buyer can
              compare it against plain-water incumbents, sparkling-water challengers, better-for-you soda, and
              non-alcoholic adult-ritual brands depending on the occasion. Ringly's substitute guide is imperfect but
              still useful because it shows how shoppers encounter Liquid Death next to Open Water, JUST Water, Rambler,
              Waterloo, Aura Bora, Ghia, De Soi, and Athletic Brewing as adjacent answers to the same packaging,
              anti-plastic, or "I need something interesting in my hand" problem. Litmus adds that Olipop and Poppi
              attack the same young, brand-led shopper from a different functional angle rather than from a pure
              hydration lane.
            claimRefs:
