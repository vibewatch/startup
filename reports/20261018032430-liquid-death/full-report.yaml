      - number: '3.2'
        title: Differentiation is occasion and channel, not formula
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation evidence in the pool is about social permission and channel fit, not
              beverage chemistry. NBC's reporting makes the core job explicit: the tallboy can helps a non-drinker avoid
              looking out of place at bars, concerts, and festivals, which turns "water" into a social-signal product.
              The same source and RGM both point to live entertainment as the company's cornerstone context, with the
              Live Nation relationship giving Liquid Death exclusive access to more than 120 festivals and venues.
              Litmus then argues that the meme-like voice only became durable once it was reinforced by physical
              assets—133,000+ retail doors and venue pour rights—which are harder for a new challenger to reproduce than
              edgy copy alone.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
