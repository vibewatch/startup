  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Highest residual exposure sits in brand durability, channel concentration, and liquidity rather than in a single
      binary regulatory event.
    data:
      columns:
        - label: Likelihood
          note: 12-18 month underwriting horizon.
        - label: Impact
          note: Effect on growth, margin, or financing flexibility.
        - label: Mitigation maturity
          note: What is visible in public sources today.
        - label: Residual exposure
          note: Net risk after visible mitigations.
      rows:
        - label: Brand durability / moat
          note: Saturated category plus UK translation evidence.
          values:
            - label: High
              tone: high
              note: Copyable product economics and marketing fatigue risk are already visible in third-party coverage.
            - label: High
              tone: critical
              note: A weaker brand edge would pressure pricing, shelf space, and expansion returns at once.
            - label: Medium
              tone: medium
              note: Strong social relevance exists, but public evidence of durable repeat economics is limited.
            - label: High
              tone: high
              note: This remains the core underwriting risk.
        - label: Channel / partner concentration
          note: Retail breadth and Live Nation dependence both matter.
          values:
            - label: Medium-High
              tone: high
              note: Broad retail exposure plus a named anchor partner make concentration meaningful.
            - label: High
              tone: critical
              note: Delistings or lost exclusivity would cut both visibility and sell-through.
            - label: Medium
              tone: medium
              note: Retail and e-commerce diversification help, but exact concentration is undisclosed.
            - label: High
              tone: high
              note: Public data do not show how much of growth is tied to a few channels.
        - label: Liquidity / capacity
          note: Credit plus new-capital search signal scale costs.
          values:
            - label: High
              tone: high
              note: External funding needs have persisted beyond the early startup phase.
            - label: High
              tone: critical
              note: Liquidity stress would constrain inventory, trade spend, and category launches.
            - label: Medium
              tone: medium
              note: Investor access and scale are positives, but covenant detail is missing.
            - label: High
              tone: high
              note: Underwriting stays exposed until facility terms and cash conversion are known.
        - label: Legal / reputation
          note: Privacy, trademark, and greenwashing themes are active.
          values:
            - label: Medium
              tone: medium
              note: Public evidence shows live issues, but no cited existential enforcement event.
            - label: Medium-High
              tone: high
              note: A single injunction or trust shock could interrupt launches and inflate CAC.
            - label: Medium
              tone: medium
              note: Consumer-rights workflow and brand agility are visible mitigants.
            - label: Medium
              tone: medium
              note: Material, but still secondary to moat and liquidity risk today.
        - label: International translation
          note: UK exit suggests the brand does not automatically travel.
          values:
            - label: Medium
              tone: medium
              note: One failed market does not prove a pattern, but it is already a live warning sign.
            - label: Medium-High
              tone: high
              note: Repeated international misfires would cap the upside embedded in premium growth multiples.
            - label: Low-Medium
              tone: warning
              note: No strong public mitigation beyond management's decision to refocus on the U.S.
            - label: Medium
              tone: medium
              note: Important for upside, but less urgent than current U.S. channel and liquidity risk.
        - label: Product safety / trust
          note: Quality criticism is public but not well resolved in accessible evidence.
          values:
            - label: Medium
              tone: medium
              note: The signal is not overwhelming, yet even minor scares can spread quickly for a social brand.
            - label: Medium
              tone: high
              note: A product-quality or safety narrative could impair velocity and retailer confidence.
            - label: Low
              tone: low
              note: Public evidence of formal remediation is limited in the assigned pool.
            - label: Medium
              tone: medium
              note: The unknowns justify diligence even if this is not the primary bear case.
    approximationNotes: >-
      Cells reflect analyst scoring derived from cited evidence and are not management-provided quantitative
      probabilities.
    claimRefs:
      - CR002
      - CR005
      - CR008
      - CR011
      - CR014
  - id: FV001
    title: Recommendation logic
