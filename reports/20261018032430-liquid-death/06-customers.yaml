figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests a journey that starts with brand-led awareness, converts in
      live events and retail, and extends into DTC/community activation.
    data:
      items:
        - label: Awareness via provocative brand identity
          actor: "Gen Z / millennial beverage shopper"
          phase: awareness
          touchpoints:
            - "Irreverent ads, social content, and PR"
            - "Anti-plastic and humor-forward positioning"
          note: "Marcom and NVDigital both frame the brand around youth culture and marketing distinctiveness."
        - label: Trial at live events
          actor: "Concertgoer / festival attendee"
          phase: trial
          touchpoints:
            - "Live Nation venues"
            - "Festivals and concerts"
          note: "NBC calls live entertainment-goers the cornerstone market, and Live Nation appears as an exclusive channel partner."
        - label: Early grocery and convenience proof
          actor: "Retail buyer and shopper"
          phase: validation
          touchpoints:
            - "Whole Foods entry"
            - "200-store 7-Eleven trial"
          note: "Early named proofs move from pilot testing into established retail shelf presence."
        - label: Scaled mass-retail distribution
          actor: "Mainstream shopper"
          phase: scale
          touchpoints:
            - "113,000 outlets across the U.S. and U.K. in March 2024"
            - "133,000+ stores worldwide in 2024"
          note: "Store count is the most repeated public adoption KPI in the assigned pool."
        - label: Community and retailer-linked repeat activation
          actor: "Direct consumer"
          phase: engagement
          touchpoints:
            - "Country Club"
            - "Death Peddlers"
            - "Retail-account-linked Sparkling Energy reward promo"
          note: "Official 2026 homepage evidence shows DTC/community surfaces plus retail purchase verification."
        - label: Portfolio expansion across beverage occasions
          actor: "Existing buyer"
          phase: expansion
          touchpoints:
            - "Sparkling water"
            - "Iced tea / lemonade"
            - "Sparkling Energy"
          note: "The company is trying to widen the same consumer relationship across multiple beverage occasions."
    claimRefs: [CU001, CU002, CU005, CU008, CU009, CU010]
callouts:
  - calloutType: strength
    title: Reach is validated in public channels
    body: >-
      Liquid Death has credible public evidence of scaled retail and live-event adoption,
      with independent sources supporting 113k to 133k+ store/outlet reach and named
      anchor channels such as Whole Foods, 7-Eleven, and Live Nation.
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU011]
  - calloutType: risk
    title: Retention proof lags distribution proof
    body: >-
      Public evidence is still much better at proving where Liquid Death is sold than how
      well accounts or consumers renew, repurchase, or concentrate revenue over time.
    claimRefs: [CU005, CU012, CU013, CU014]
