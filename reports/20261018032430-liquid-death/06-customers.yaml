company:
  name: Liquid Death
chapter:
  number: 6
  title: Customers
  summary: >-
    Liquid Death's public customer proof is strongest on scaled channel reach rather than
    measured retention: NBC reported 113,000 retail outlets across the U.S. and U.K. in
    March 2024, while later third-party summaries put the brand in 133,000+ stores
    worldwide and 120+ Live Nation festivals and concerts. The chapter finds real
    adoption across retail and live entertainment, but durability still depends more on
    brand momentum than disclosed renewal metrics.
sections:
  - id: customer-segments
    title: Customer segments skew consumer, retail, and live-event driven
    body: >-
      Public evidence points to a consumer beverage model rather than a workflow-embedded
      enterprise account model. Official materials frame Liquid Death as a portfolio of
      premium low-calorie beverages sold in recyclable cans, while third-party customer
      evidence repeatedly describes a young consumer target, mass-retail distribution,
      live-event consumption, and direct-to-consumer community surfaces. The most concrete
      buyer proofs in the assigned pool are retail chains, venue operators, and
      consumer-marketing programs, not named institutional end-users or procurement-heavy
      enterprise deployments. The current official retailer-linked energy promotion asks
      buyers to connect a listed retail account and make a qualifying purchase, showing a
      mechanism for joining retail transactions to direct engagement. It establishes an
      activation path, not retention, because no repeat count or cohort denominator is
      disclosed.
    claimRefs: [CU001, CU002, CU009, CU010, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption proof is strongest in store count and channel expansion
    body: >-
      Adoption evidence is much clearer on breadth than on depth. NBC captured management's
      March 2024 disclosure of 113,000 retail outlets across the U.S. and U.K., and later
      third-party summaries place the brand in more than 133,000 stores worldwide. Earlier
      named channel wins show a progression from pilot and anchor accounts into scaled
      distribution: Whole Foods, a 200-store 7-Eleven trial, and Live Nation venue
      exclusivity all appear before the wider national chain footprint cited in later
      sources. That progression supports real commercial adoption even though public
      sources still emphasize reach more than repeat purchase behavior.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU011]
    tableRefs: [TU002, TU003]
  - id: durability-and-concentration
    title: Durability is less proven than reach
    body: >-
      The weakest public customer evidence layer is retention and concentration. The
      assigned sources show multiple demand surfaces — retail shelves, live events,
      merchandise, community programs, and retailer-linked promotions — but they do not
      disclose NRR, GRR, churn, contract length, or account-level revenue concentration.
      As a result, Liquid Death's customer durability currently has to be inferred from
      continued distribution growth and brand engagement rather than verified renewal
      behavior. The most skeptical source in the pool also highlights a structural risk:
      premium canned water can look like a branding triumph before it looks like a
      functionally sticky product.
    claimRefs: [CU002, CU005, CU012, CU013, CU014]
