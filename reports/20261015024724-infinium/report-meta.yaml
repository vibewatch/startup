companyProfile:
  summary: >-
    Infinium is a growth-stage private electrofuels developer that markets drop-in eSAF, eDiesel, and eNaphtha for
    aviation, heavy transport, maritime, and chemicals customers. The company now has public evidence of commercial
    plant operation, airline delivery, and sponsor-backed project finance, but the market record still leaves pricing,
    margin, and full capital-structure visibility incomplete.
  headquarters: Sacramento, California, United States
  productSummary: >-
    Drop-in ultra-low-carbon electrofuels and related project technologies, including eSAF, eDiesel, eNaphtha, and
    catalytic / equipment offerings for power-to-liquids deployment.
  customerFocus: >-
    Airlines, freight operators, maritime fuel buyers, and industrial feedstock customers that want drop-in
    decarbonization without replacing core engines or plant infrastructure.
  businessModel: >-
    Sells low-carbon fuels and feedstocks through offtake and project-deployment relationships, with additional economic
    support from incentives, project finance, and related equipment or technology commercialization.
  stage: growth-stage private / commercial scale-up
  fundingStatus: >-
