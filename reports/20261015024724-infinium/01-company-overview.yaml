callouts:
  - calloutType: risk
    title: Policy formation is still economically material
    body: >-
      Infinium's commercial progress is real, but the retained record still ties
      scale-up to mandate design, project finance, and policy execution rather
      than to a self-disclosing standalone revenue engine.
    claimRefs: [CO013, CO014, CO015]
