company:
  name: Infinium
chapter:
  number: 8
  title: Valuation
  summary: >-
    Infinium has stronger public commercialization and sponsor-financing proof than many electrofuels peers, but the retained public record still does not disclose a current valuation, round size, or preference stack. With Project Roadrunner still ramping toward a planned 2027 start and policy-linked demand remaining central to the story, the evidence supports a track recommendation and an unknown valuation stance pending private diligence.
sections:
  - id: recommendation-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      Public evidence has improved on the quality side of the underwriting story. In 2026, American Airlines and Infinium announced a commercial passenger flight using Pathfinder-produced eSAF, and Mitsui ties the operating plant to named customers including Amazon and Borealis while also pointing to IAG and American as committed Roadrunner buyers. Financing support has also deepened through Brookfield, Mitsui, and DBJ-linked capital. What still blocks a priced entry call is missing price context: the retained valuation record lists recent financing timestamps and an April 2026 last-round marker, but it does not disclose round size, post-money value, price per share, dilution mechanics, or preference overhang. That combination supports a **track** posture instead of buy or avoid because the company looks increasingly real while the entry math remains opaque.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV008, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-anti-thesis
    title: Financing context and anti-thesis
    body: >-
      The positive case is straightforward: Brookfield's project commitment, Mitsui's Series C participation, and DBJ's latest-round participation all indicate that sophisticated capital providers are still willing to fund the platform. The anti-thesis is equally important for valuation. Caplight's public page surfaces financing chronology and comparable names, but it withholds the actual valuation figures and does not display filing documents without additional access. That means investors can see external interest but cannot test whether the current price already discounts Roadrunner's planned 2027 output, sponsor optionality, or the durability of offtake demand. The product and climate-positioning narrative is coherent across company-controlled pages, yet it is still narrative support rather than price support.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenarios-diligence-and-thesis-breakers
    title: Scenarios, diligence asks, and thesis-breakers
    body: >-
      The bull case depends on Infinium turning today's milestone proof into repeatable scaled economics: Roadrunner must start roughly on schedule, the sponsor group must keep funding expansion, and airline plus chemicals demand must translate into durable contracted volumes. The base case is more modest: technical credibility keeps improving, but investors still wait for better visibility into price and capital-structure terms before underwriting a return. The bear case is not that the product thesis is fake; it is that project timing, metric-linked follow-on financing, and policy-sensitive demand keep compressing the set of defendable outcomes. Lobbying activity around ReFuelEU, FuelEU Maritime, ETS, and related rules reinforces how dependent value creation remains on commercialization timing and policy architecture. The final diligence packet therefore needs round economics, debt terms, preference stack, and plant-level unit economics before an entry recommendation can tighten.
    claimRefs: [CV001, CV007, CV009, CV013, CV014, CV015]
    tableRefs: [TV003]
