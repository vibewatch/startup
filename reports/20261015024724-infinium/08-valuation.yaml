    notes: "Assessment is price-sensitive; retained public sources support company quality and funding momentum, but not a defendable current entry price."
    claimRefs: [CV001, CV004, CV005, CV006, CV013]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - ["Commercial proof", "Pathfinder has operating-customer evidence and a 2026 passenger-flight milestone.", "Roadrunner must convert that proof into sustained contracted deliveries at larger scale."]
      - ["Capital support", "Brookfield, Mitsui, and DBJ participation suggests continued sponsor access.", "A disclosed round price, debt package, and preference terms would show whether outside capital is arriving on attractive or punitive terms."]
      - ["Comparable framing", "Caplight publicly associates Infinium with Twelve, AIR COMPANY, and Synhelion.", "A real valuation bridge needs transaction comps, marks, or disclosed round terms rather than similarity labels alone."]
      - ["Policy sensitivity", "EU lobbying and fuel-policy targeting suggest value creation still depends on regulation and market design.", "A stronger view would come from contracted demand resilience that does not rely on favorable policy support or credits."]
    notes: "This table separates company-quality evidence from price evidence; peer labels and sponsor names are insufficient substitutes for disclosed round mechanics."
    claimRefs: [CV001, CV002, CV003, CV009, CV010, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Roadrunner starts near the stated 2027 target, sponsor capital continues to arrive, and airline plus chemicals customers expand from milestone proof to repeat offtake.", "Upside comes from multiple rounds of project deployment before public markets fully price commercial eFuel scarcity.", "Construction slippage, offtake concentration, and financing milestones could still interrupt the ramp.", "Needs disclosed economics that show Pathfinder-style proof can scale profitably."]
      - ["Base", "Commercial credibility keeps improving, but price and capital-structure terms remain undisclosed through the next underwriting window.", "Track can still work if investors keep optionality without committing to a price they cannot test.", "Capital may be available yet still expensive or highly structured.", "Most consistent with the retained public record."]
      - ["Bear", "Policy support weakens, Roadrunner slips, or follow-on capital tied to pre-agreed metrics does not convert into expansion on time.", "Returns compress because the market would be underwriting a long-duration scale story without price transparency.", "Opaque debt, dilution, and policy dependence can turn a strong technology story into a weak entry.", "Most likely if diligence cannot close today's valuation and project-economics gaps."]
    notes: "Scenario logic is directional, not a modeled share-price range, because retained public sources do not disclose current valuation, debt covenants, or project-level margin assumptions."
    claimRefs: [CV001, CV004, CV005, CV007, CV009, CV013, CV014, CV015]
