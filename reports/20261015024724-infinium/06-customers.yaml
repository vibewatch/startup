schemaVersion: report-v2
artifact: customers
slug: infinium
runDate: 2026-10-15
company:
  name: Infinium
chapter:
  number: 6
  title: Customers
  summary: >-
    Infinium now has public proof of real customer usage in two workflows:
    Borealis is receiving commercial eNaphtha from Pathfinder for plastics
    production, and American Airlines has already allocated Infinium eSAF to a
    commercial passenger flight. The public record is still thin on durability:
    the strongest evidence is deployment and contracted offtake, while
    retention, customer counts, contract economics, and concentration remain
    undisclosed.
sections:
  - id: customer-segments
    title: Customer proof is strongest in aviation and plastics, with other segments still mostly pipeline
    body: >-
      Infinium's public customer story is concentrated in hard-to-abate sectors
      where drop-in fuels matter immediately. The clearest retained proof is in
      aviation and plastics: American Airlines has both an announced Roadrunner
      offtake relationship and a completed commercial passenger flight
      allocated with Infinium eSAF, while Borealis is already receiving
      commercial eNaphtha shipments for polyolefin production. By contrast,
      trucking, maritime, and broader industrial demand are still described
      mainly as target markets rather than named production deployments. That
      means the segmentation story is commercially plausible, but current
      evidence is much stronger on use-case fit than on breadth of the
      installed customer base.
    claimRefs: [CU001, CU003, CU004, CU009, CU010, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption has progressed from operating plant proof to live customer delivery, but scale-up timing remains fluid
    body: >-
      The adoption trajectory is no longer just conceptual because Pathfinder
      is operating and has moved product into downstream use. Public proof now
      spans a continuously operating commercial-scale plant, a first commercial
      eNaphtha shipment to Borealis, and an allocated commercial passenger
      flight with American. Those are meaningful milestones because they show
      compatibility with existing chemical and aviation workflows rather than
      just lab validation. However, the ramp from anchor deployments to scaled
      recurring volume is still unsettled. The retained record shows
      Roadrunner demand interest and financing support, but it also shows
      timeline slippage and unsigned remainder capacity, which weakens
      confidence in near-term customer expansion pace.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU013]
    tableRefs: [TU002]
  - id: named-counterparties
    title: Named counterparties prove reference quality, but most logos are not yet equivalent to recurring production revenue
    body: >-
      The quality of named proof is mixed in a useful way. American and
      Borealis matter because the retained sources tie them to specific
      deployment events or delivered product rather than to passive logo use.
      Citi appears as a demand-enabling corporate counterparty through the
      American arrangement, which is directionally helpful but weaker than a
      disclosed direct fuel-purchase commitment. Earlier investor and ecosystem
      names such as Amazon and NextEra help validate strategic interest in the
      addressable customer problem, yet they are not substitutes for customer
      retention or concentration data. Investors and strategic sponsors improve
      confidence that a market exists; they do not prove repeat purchasing
      behavior across a scaled installed base.
    claimRefs: [CU003, CU004, CU005, CU009, CU012, CU014]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: The biggest unresolved customer questions are durability, economics, and concentration
    body: >-
      The main weakness in the current public record is not whether anyone
      wants the product, but whether the earliest customer wins convert into
      durable, diversified revenue. None of the retained sources disclose
      customer count, NRR, GRR, churn, renewal rates, contract duration, or
      top-customer concentration by year. Public evidence also leaves contract
      economics opaque: there is no disclosed price, minimum-volume commitment,
      or delivered-gallon history for the key American and Borealis
      relationships. Finally, regulatory dependence still matters. Infinium's
      own EU lobbying profile and American's explicit comment that lower SAF
      prices are essential both suggest expansion depends on policy design and
      cost competitiveness, not just technical readiness.
    claimRefs: [CU006, CU008, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public proof
      - Scale / status
      - Revenue / strategic value
      - Gap
    rows:
      - - Commercial airlines / corporate travel programs
        - Buyer and payer are airlines and Scope 3 sponsors; users are airline fuel and sustainability teams.
        - American offtake plus one allocated commercial passenger flight; Citi cited as a Scope 3 enabling counterparty.
        - Production proof exists at Pathfinder; Roadrunner scale-up still pending.
        - Anchors aviation credibility and future contracted volume if Roadrunner ramps.
        - No disclosed price, gallons, renewal terms, or share of total customer mix.
      - - Plastics and chemicals
        - Buyer is Borealis; downstream users are Borealis manufacturing customers and end consumers.
        - Borealis says commercial eNaphtha volumes are being shipped to Porvoo for polyolefin production.
        - Production deployment, not just pilot language.
        - Diversifies demand beyond aviation and validates chemical-feedstock use.
        - No disclosed run-rate, contract term, or margin contribution.
      - - Heavy trucking and maritime
        - Target buyers are fleet, shipping, and fuel-supply operators; users are truck and vessel operators.
        - Product pages and investor materials present these as target sectors.
        - Publicly described target market rather than named retained deployment.
        - Expands theoretical TAM beyond airline demand.
        - No named production customer, utilization data, or procurement proof in retained sources.
      - - EU compliance-led transport fuels
        - Potential buyers are airlines, shippers, and fuel-market intermediaries responding to EU mandates.
        - LobbyFacts records direct engagement on ReFuelEU Aviation, FuelEU Maritime, REDII, and related policy.
        - Business-development and policy-shaping stage.
        - Important for geographic expansion and regulatory demand pull.
        - No named EU customer contracts or delivered volumes in retained public evidence.
    notes: Snapshot of publicly retained customer signals as of the run date; qualitative scale/value cells summarize the cited sources and null-like gaps indicate data not disclosed publicly.
    claimRefs: [CU001, CU003, CU004, CU009, CU010, CU011, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Pathfinder operating status
        - Continuously operating commercial-scale eFuels plant in Corpus Christi
        - "2024-03-21"
        - Infinium Pathfinder release
        - High
        - Real production asset exists behind customer claims.
        - Annual throughput and utilization are undisclosed.
      - - First commercial plastics shipment
        - First commercial eNaphtha shipment left the United States in May 2024 for Borealis Porvoo
        - "2024-08-20"
        - Borealis release
        - High
        - Confirms downstream chemical customer use, not just product marketing.
        - Shipment size and recurring cadence are undisclosed.
      - - Aviation deployment
        - One commercial passenger flight from CRP to DFW was allocated with Infinium eSAF
        - "2026-08-06"
        - American Airlines and Infinium release
        - High
        - Shows compatibility with airport fueling and airline operations.
        - One flight does not reveal recurring airline volume.
      - - Roadrunner launch timing
        - 2024 expectation referenced American purchases starting in 2026; 2026 update said deliveries are expected in 2027
        - "2024-09-10 / 2026-08-06"
        - Hydrocarbon Processing plus American Airlines and Infinium releases
        - Medium
        - Suggests customer ramp timing has slipped during scale-up.
        - Signed gallons, milestones, and customer mix are undisclosed.
      - - Public project pipeline
        - More than a dozen additional projects under development across the US, EU, Japan, and Australia
        - "2024-03-21"
        - Infinium Pathfinder release
        - Medium
        - Expansion ambition is global rather than single-site.
        - Project-by-project conversion into customers is undisclosed.
    notes: Dates and values are copied from retained public sources; the final column captures the denominator or commercial detail still missing from otherwise positive adoption signals.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / counterparty
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - American Airlines
        - Aviation
        - Allocated eSAF to a commercial passenger flight and signed future Roadrunner offtake
        - Pathfinder flight is production use; Roadrunner supply remains future and under construction
        - Strongest retained airline proof because it combines live deployment with forward demand
        - Public sources do not disclose price, contracted gallons, or renewal terms
      - - Borealis
        - Plastics / chemicals
        - Receives commercial eNaphtha from Pathfinder for polyolefin production in Porvoo
        - Production
        - Shows Infinium can move product into an industrial feedstock workflow
        - Public sources do not disclose shipment cadence, contract duration, or revenue contribution
      - - Citi
        - Corporate travel emissions / Scope 3 enablement
        - Separate agreement cited in support of American's Roadrunner arrangement
        - Commercial enabling arrangement, not disclosed direct fuel consumption
        - Indicates demand can be supported by corporate decarbonization budgets in addition to airline buyers
        - The retained source does not quantify Citi-linked volume or direct contractual economics with Infinium
    notes: Partial enumeration of named counterparties tied to retained public deployment or offtake evidence between 2021 and 2026; undisclosed customers and nondisclosed logo references are intentionally excluded.
    enumerationScope:
      coverage: partial
      basis: Retained public sources only include named counterparties tied to deployment, offtake, or explicit demand-enabling arrangements from 2021 through 2026.
    claimRefs: [CU003, CU004, CU005, CU006, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public customer proof advances from sector targeting to production deployment, but scale-up still hinges on project timing, policy, and cost.
    data:
      items:
        - label: Segment qualification
          actor: Sustainability and industrial procurement teams
          touchpoints:
            - Aviation, trucking, maritime, and chemicals are framed as the core target sectors.
            - The selling point is drop-in compatibility with existing engines and industrial processes.
        - label: Technical and commercial diligence
          actor: Fuel buyers and industrial sourcing teams
          touchpoints:
            - Buyers need proof that Pathfinder can produce spec-compliant product at commercial scale.
            - Public record still lacks contract economics, delivered gallons, and retention metrics.
        - label: First production proof
          actor: Anchor counterparties
          touchpoints:
            - Borealis received commercial eNaphtha shipments for plastics production.
            - American allocated Infinium eSAF to a commercial passenger flight.
        - label: Scale-up contracting
          actor: Airlines and project-finance partners
          touchpoints:
            - American has future Roadrunner offtake and Brookfield financing is tied to pre-agreed metrics.
            - Remaining Roadrunner capacity was still being marketed in the 2024 retained coverage.
        - label: Geographic expansion
          actor: EU policy and market-development teams
          touchpoints:
            - Lobbying priorities include ReFuelEU Aviation, FuelEU Maritime, and REDII-related rules.
            - Public pipeline ambition spans the US, EU, Japan, and Australia.
        - label: Renewal and concentration test
          actor: Management and investors
          touchpoints:
            - Broader airline adoption depends on lower SAF prices and reliable delivered volume.
            - No retained source discloses customer count, churn, NRR, or top-customer concentration.
    claimRefs: [CU001, CU003, CU004, CU007, CU011, CU013]
callouts:
  - calloutType: strength
    title: Commercial proof is now real, not purely forward-looking
    body: Borealis shipment evidence and American's commercial flight make Infinium's customer proof materially stronger than a logo-only story.
    claimRefs: [CU003, CU004, CU014]
  - calloutType: risk
    title: Durability still rests on undisclosed economics and a delayed scale-up path
    body: Public proof does not yet show retention or concentration metrics, and the Roadrunner timeline moved from an earlier 2026 expectation to a 2027 delivery expectation in the latest retained customer proof.
    claimRefs: [CU006, CU012, CU013]
