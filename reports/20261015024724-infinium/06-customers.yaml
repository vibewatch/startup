  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Customer count, NRR, GRR, churn, renewal rates, contract duration, and top-customer concentration by year.
      whyItMatters: Without durability metrics, the current customer proof can show adoption events but cannot show whether revenue is recurring, diversified, or expanding.
      diligencePath: Request a cohort table with customer count, renewal timing, gross/net retention, and top-10 customer share for the last three fiscal years.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: contract-economics
      missingEvidence: Contract price, minimum-volume commitments, delivered gallons, and plant-capacity share for the American and Borealis relationships.
      whyItMatters: Deployment proof is much less valuable for underwriting if the public record cannot show whether the relationships are economically meaningful or only symbolic.
      diligencePath: Obtain signed offtake summaries, shipment history, and customer-level volume commitments for Pathfinder and Roadrunner.
      relatedQuestionRefs: [QU006, QU007]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-coverage
      missingEvidence: Complete list of production customers, pilots, and top-customer concentration rather than the small named subset disclosed in public releases.
      whyItMatters: A sparse public customer list can overstate diversification if most volume sits with one or two anchors.
