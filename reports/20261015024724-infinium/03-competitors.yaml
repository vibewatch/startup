  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Public list prices, contract formulas, minimum-volume commitments, and discount structures for Infinium and named direct peers.
      whyItMatters: Without comparable economics, the chapter can rank public commercialization proof but cannot prove durable price leadership or margin resilience.
      diligencePath: Request current customer offtake terms, pricing decks, or procurement bids from Infinium and the named peer set.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: peer-disclosure-depth
      missingEvidence: Primary product, pricing, deployment, and customer-proof sources for Twelve, AIR COMPANY, and Synhelion inside the assigned evidence pool.
