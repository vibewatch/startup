      - ["Infinium eDiesel / eNaphtha", "No list price disclosed in assigned pool", "Product pages show drop-in positioning but no retained contract terms", "Use cases span freight, maritime, and plastics/chemicals", "Cross-product breadth is visible, but unit economics remain opaque"]
      - ["Named direct peers", "No retained price signal", "Caplight comparable listing only", "Similarity names without public package or contract detail in assigned sources", "Peer willingness to bundle, discount, or outspend Infinium is unresolved"]
      - ["Bio-SAF substitute class", "No retained supplier-level price signal", "Existing airline procurement context is implied by the contrast with the first non-biobased U.S. airport delivery", "Assigned sources describe a supply-constrained SAF market that remains small versus total jet fuel use", "Substitute demand is real, but price comparison is not closed here"]
      - ["Status quo fossil fuels / internal build", "No retained price signal in assigned pool", "Compatibility baseline is clear; build route is implied by licensing and equipment offers", "Evidence is better on workflow fit than on total delivered cost", "Switching still depends on regulation, customer mandates, and verified delivered economics"]
    notes: >-
      This table is intentionally about disclosure quality as much as economics: retained sources
      support contract and capacity milestones better than they support apples-to-apples pricing.
    claimRefs: [CP001, CP004, CP005, CP006, CP011, CP012, CP014]
figures:
  - id: FP001
    title: "Competitive positioning map: commercialization proof (X) vs buyer switching ease (Y)"
    type: quadrant
    summary: >-
      Ordinal map using only retained public evidence; higher X reflects stronger commercialization
      proof in the assigned pool, while higher Y reflects easier adoption inside existing buyer
      workflows.
    data:
      points:
        - label: Infinium
          x: 5
          y: 5
          detail: Operating Pathfinder output, airline deployment, Brookfield backing, and drop-in compatibility are all retained.
        - label: Direct eFuel peers
          x: 2
          y: 3
          detail: Caplight confirms named peers exist, but the assigned pool does not retain equivalent deployment or pricing proof for them.
        - label: Bio-SAF substitutes
          x: 4
          y: 4
          detail: The SAF substitute class is already in airline procurement flows, but assigned sources remain thin on supplier-level economics.
        - label: Petroleum status quo
          x: 5
          y: 2
          detail: Existing fuels remain the operating baseline, but they are the least aligned with buyer decarbonization targets.
        - label: Internal build / licensed deployment
          x: 2
          y: 4
          detail: Licensing and equipment routes can fit buyer workflows, but the assigned pool does not retain non-Infinium deployment proof.
        - label: Project-financed entrants
          x: 3
          y: 3
          detail: Brookfield, DBJ, and prior investor support show capital can fund new entrants if policy-driven demand remains attractive.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal scores from the assigned pool rather than measured
      market-share or cost benchmarks; sparse peer disclosures cap confidence outside Infinium.
    claimRefs: [CP001, CP003, CP004, CP007, CP011, CP012, CP013, CP014]
callouts:
  - calloutType: insight
    title: Commercial proof is the clearest edge
    body: >-
      The assigned pool makes Infinium look strongest where many climate-fuel startups are weakest:
      operating-site proof, an airline offtake, and visible scale capital all appear before public
      price transparency does.
    claimRefs: [CP004, CP005, CP007]
  - calloutType: risk
    title: The pricing layer is still open
    body: >-
      Public disclosures retained for this chapter do not let a buyer or investor compare Infinium
      against named peers on list price, realized contract terms, or delivered margin, leaving room
      for substitutes or well-financed entrants to narrow any technology lead.
    claimRefs: [CP011, CP012, CP014]
