    claimRefs: [CM004, CM005, CM011, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Commercial aviation decarbonization
        - Airline fuel procurement / sustainability teams
        - Airline flight operations and airport fueling chain
        - Airlines directly; corporates can sponsor travel-emissions reductions
        - Secure eSAF offtake, blend into existing jet-fuel infrastructure, allocate reductions
        - Fuel procurement with sustainability oversight
        - SAF scarcity, emissions targets, and compatibility with existing aircraft and infrastructure
      - - Long-haul trucking and maritime fuel substitution
        - Fleet operators, shippers, marine fuel buyers
        - Truck fleets and vessels
        - Operators paying conventional fuel budgets
        - Swap lower-carbon drop-in fuel into existing engines and logistics networks
        - Operations and fuel procurement
        - Hard-to-electrify duty cycles plus low-carbon fuel mandates or customer pressure
      - - Chemicals / plastics feedstock decarbonization
        - Chemical and plastics manufacturers
        - Industrial plants using naphtha feedstocks
        - Materials producers paying feedstock budgets
        - Replace petroleum-derived naphtha in existing chemical workflows
        - Feedstock procurement with sustainability or product-line sponsorship
        - Demand for lower-carbon materials without redesigning plant equipment
    notes: >-
      Buyer, user, payer, and budget-owner fields synthesize retained product, customer, and
      partner disclosures; they are workflow-level maps, not evidence of disclosed customer counts.
    claimRefs: [CM008, CM009, CM012]
