    claimRefs: [CM004, CM005, CM006, CM013, CM014]
callouts:
  - calloutType: insight
    title: Aviation is the clearest documented wedge
    body: >-
      Retained sources give a usable aviation market boundary, a sub-1% SAF penetration benchmark,
      a disclosed Roadrunner capacity target, and a live American Airlines deployment, which is
      materially stronger proof than Infinium has publicly disclosed for other segments.
    claimRefs: [CM003, CM004, CM005, CM006]
  - calloutType: risk
    title: Monetization visibility still trails market visibility
    body: >-
      The chapter can justify a broad and attractive market boundary, but not a conviction-grade
      public SAM or SOM, because pricing, minimum-volume protections, and unit economics are still
      missing from the retained source set.
    claimRefs: [CM011, CM014]
