chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Retained public evidence supports a clear market boundary for Infinium around
    hard-to-abate fuel and feedstock substitution, with aviation as the best-documented
    near-term wedge and trucking, maritime, and chemicals as adjacencies. The opportunity
    is visibly large at the industry level, but the public record still supports only a
    constrained sizing lens because Roadrunner capacity, policy pressure, and customer
    proof are disclosed more clearly than pricing, contracted volumes, or segment-level SAM.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary and substitutes
    body: >-
      The retained sources support a market definition narrower than a generic "clean energy"
      story. Infinium is positioning eSAF, eDiesel, and eNaphtha as drop-in replacements for
      petroleum jet fuel, diesel, fuel oil, and naphtha in sectors where fleet turnover or
      electrification is slower: aviation, long-haul freight, maritime shipping, and chemicals.
      That means the relevant spend is liquid-fuel or feedstock substitution inside existing
      workflows, not aircraft manufacturing, charging infrastructure, or broad carbon-removal
      budgets. This boundary matters because the adoption case depends less on creating a new
      behavior and more on winning procurement inside incumbent fuel pools that already exist.
    claimRefs: [CM001, CM002, CM009]
    tableRefs: [TM001]
  - id: constrained-sizing-lenses
    title: Constrained sizing lenses
    body: >-
      Public evidence provides a useful top-down boundary for aviation but not a complete
      bottom-up TAM, SAM, and SOM stack. The strongest outside lens is aviation's incumbent
      fuel pool: retained 2026 coverage cites nearly 100 billion gallons of jet fuel consumed
      annually and notes that SAF is still less than 1% of total jet fuel use worldwide, which
      frames a very large category with still-early penetration. The narrower company-specific
      lens is Roadrunner's disclosed scale and timing, plus Pathfinder's existing commercial
      proof. Those lenses show real demand pull and commercialization progress, but they do not
      disclose the price, gross-margin, or contract terms needed to translate macro demand into
      a defendable public SAM or SOM.
    claimRefs: [CM003, CM004, CM005, CM006, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map-and-adoption-path
    title: Buyer map and adoption path
    body: >-
      Buyer, user, and payer roles differ by segment, and that shapes how quickly each lane can
      convert from interest to budgeted demand. In aviation, the user is the airline fuel
      operation, the immediate buyer is the airline or fuel procurement function, and the payer
      can extend to corporates that want travel-related emissions reductions, as shown by the
      American Airlines and Citi structure. In trucking, maritime, and chemical feedstocks, the
      user is the fleet or plant operator and the budget owner is conventional fuel or feedstock
      procurement. Across these lanes, Infinium's disclosed commercialization path relies on a
      small number of large counterparties rather than broad-based transactional distribution.
    claimRefs: [CM008, CM009, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints-and-gaps
    title: Drivers, constraints, and diligence gaps
    body: >-
      The main adoption drivers in retained sources are policy pressure, decarbonization targets,
      supply scarcity in SAF, and the ability to use existing engines and infrastructure. Those
      factors shorten the behavior-change hurdle and help explain why aviation appears to be the
      leading wedge. The offsetting constraints are equally material: this is a capital-intensive
      buildout, public evidence still centers on a limited set of counterparties, and retained
      sources do not disclose Roadrunner pricing, minimum-volume protections, plant-level unit
      economics, or segment-by-segment contracted volume. Those omissions do not negate the market
      opportunity, but they do keep the chapter at an evidence-constrained market view rather than
      a conviction-grade monetization model.
    claimRefs: [CM007, CM010, CM011, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Aviation eSAF
        - Sustainable aviation fuel procurement inside commercial flight operations and related travel decarbonization programs
        - Aircraft manufacturing, airport infrastructure, generic offsets, or broad airline software spend
        - Airlines as direct fuel buyers; corporates can help fund travel-emissions reductions
        - Best-documented wedge with disclosed deployment, policy pull, and named counterparties
      - - Heavy transport eDiesel
        - Diesel or fuel-oil replacement for long-haul trucking and maritime operations
        - EV charging networks, truck purchases, ship retrofits, or broader logistics software
        - Fleet operators, shipping companies, fuel procurement teams
        - Adjacent lane for hard-to-electrify transport where drop-in compatibility matters
      - - Chemicals / plastics eNaphtha
        - Lower-carbon naphtha feedstock for plastics and chemical processing
        - Downstream polymer conversion equipment or general industrial decarbonization services
        - Chemical and plastics producers; feedstock procurement owners
        - Extends the market beyond transport into industrial feedstock substitution
    notes: >-
      Boundary rows reflect only uses explicitly described in retained public sources; excluded
      spend lists show adjacent categories not supported as Infinium revenue pools here.
    claimRefs: [CM001, CM002, CM009]
