evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-coverage
    missingEvidence: Current board roster, named founders, and broader executive biographies.
    whyItMatters: Leadership continuity and oversight cannot be assessed confidently from a CEO-only public record.
    diligencePath: Request the board list, executive org chart, and founder biographies directly from management.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation-and-round-terms
    missingEvidence: >-
      Current valuation, round size, price per share, secondary activity, and security terms for the 2025-2026
      financings.
    whyItMatters: Capital structure and pricing are central to underwriting ownership dilution and entry valuation.
    diligencePath: Obtain the latest financing documents, cap table, and board-approved financing summary.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: access-blocked
    severity: material
    topic: market-data-detail
    missingEvidence: Full public or licensed market-data detail behind the Caplight funding-history entries.
    whyItMatters: The public page signals later financing activity but withholds the quantitative terms needed for diligence.
    diligencePath: >-
      Access licensed private-market datasets or confirm the same events through investor materials and transaction
      documents.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: private-evidence-only
    severity: material
    topic: operating-scale-metrics
    missingEvidence: Current revenue, delivered fuel volumes, customer count, headcount, and plant-level margin disclosures.
    whyItMatters: >-
      Later financial, customer, and valuation chapters cannot anchor on scale without direct company data or audited
      disclosures.
    diligencePath: Request monthly operating KPIs, annual financials, and contract-volume schedules from management.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: >-
      Full current ownership, debt stack, control rights, and all material counterparties behind named public
      stakeholders.
    whyItMatters: Named sponsors and adopters do not by themselves reveal control, concentration risk, or economics.
    diligencePath: Request the cap table, debt summary, offtake schedule, and major commercial contract list.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: monetization-gap
    missingEvidence: >-
      Executed Roadrunner offtake terms, pricing formulae, minimum-volume protections, and plant-level gross-margin
      assumptions.
    whyItMatters: >-
      Without economics and contract detail, the chapter can describe demand signals and capacity but not a defendable
      public SAM or near-term revenue capture path.
    diligencePath: >-
      Request executed offtake summaries and the current project-finance model with volume, price, and tax-credit
      assumptions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: segment-sam
    missingEvidence: >-
      Geography- and segment-specific customer counts, pipeline volumes, and conversion assumptions across aviation,
      maritime, trucking, and chemicals.
    whyItMatters: >-
      The current source set shows which segments matter, but it does not isolate which ones are large enough, ready
      enough, or contracted enough to qualify as SAM or SOM.
    diligencePath: >-
      Collect sales-pipeline reporting by segment and geography, then reconcile it to disclosed plant capacity and
      commissioning schedules.
    relatedQuestionRefs:
      - QM002
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: buyer-budget-owner
    missingEvidence: >-
      Internal procurement pathways showing who ultimately approves budgets for corporate-travel, airline, and
      industrial feedstock deals.
    whyItMatters: >-
      Budget ownership shapes adoption timing, but the retained public evidence only reveals a few named counterparties
      and workflow examples.
    diligencePath: >-
      Ask management for recent deal examples that identify buyer, user, payer, legal counterparty, and budget owner by
      segment.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public list prices, contract formulas, minimum-volume commitments, and discount structures for Infinium and named
      direct peers.
    whyItMatters: >-
      Without comparable economics, the chapter can rank public commercialization proof but cannot prove durable price
      leadership or margin resilience.
    diligencePath: Request current customer offtake terms, pricing decks, or procurement bids from Infinium and the named peer set.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: peer-disclosure-depth
    missingEvidence: >-
