              - CP014
      - number: '3.3'
        title: Distribution power, capital access, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The company looks harder to displace on project execution and capital access than on hidden pricing.
              Brookfield's commitment, its lead role in the Series C offering, and American's offtake all point to a
              commercialization model that pairs strategic customers with infrastructure finance. The March 2024
              Pathfinder release also describes more than a dozen projects in development, while LobbyFacts shows
              Infinium working inside the policy and certification stack that shapes adoption economics for low-carbon
              fuels. That does not remove competitive risk: DBJ explicitly frames SAF demand as regulation-driven and
              structurally short, which is attractive enough to invite more entrants. The moat in the retained evidence
              is therefore executional and ecosystem-based rather than purely technical.
