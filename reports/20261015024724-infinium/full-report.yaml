  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public customer proof advances from sector targeting to production deployment, but scale-up still hinges on
      project timing, policy, and cost.
    data:
      items:
        - label: Segment qualification
          actor: Sustainability and industrial procurement teams
          touchpoints:
            - Aviation, trucking, maritime, and chemicals are framed as the core target sectors.
            - The selling point is drop-in compatibility with existing engines and industrial processes.
        - label: Technical and commercial diligence
          actor: Fuel buyers and industrial sourcing teams
          touchpoints:
            - Buyers need proof that Pathfinder can produce spec-compliant product at commercial scale.
            - Public record still lacks contract economics, delivered gallons, and retention metrics.
        - label: First production proof
          actor: Anchor counterparties
          touchpoints:
            - Borealis received commercial eNaphtha shipments for plastics production.
            - American allocated Infinium eSAF to a commercial passenger flight.
        - label: Scale-up contracting
          actor: Airlines and project-finance partners
          touchpoints:
            - American has future Roadrunner offtake and Brookfield financing is tied to pre-agreed metrics.
            - Remaining Roadrunner capacity was still being marketed in the 2024 retained coverage.
        - label: Geographic expansion
          actor: EU policy and market-development teams
          touchpoints:
            - Lobbying priorities include ReFuelEU Aviation, FuelEU Maritime, and REDII-related rules.
            - Public pipeline ambition spans the US, EU, Japan, and Australia.
        - label: Renewal and concentration test
          actor: Management and investors
          touchpoints:
            - Broader airline adoption depends on lower SAF prices and reliable delivered volume.
            - No retained source discloses customer count, churn, NRR, or top-customer concentration.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU011
      - CU013
