chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Infinium presents itself as a private decarbonization platform with two operating brands: Infinium Energy
              for electrofuels and Infinium Edge for thermal infrastructure. The retained product pages consistently
              anchor the current commercial offer around drop-in eSAF, eDiesel, and eNaphtha that can be used in
              existing transport and chemical workflows, while third-party profile pages place the company in
              Sacramento, California and characterize it as an early commercial producer of electrofuels rather than a
              pre-launch concept. That is enough for later chapters to treat the company as a real operating eFuels
              developer with an adjacent, newer compute-infrastructure platform, but not enough to infer current revenue
              scale or segment mix.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is still narrow. Multiple retained sources name Robert Schuetzle as CEO, and
              the 2021 AP Ventures financing announcement adds that the company was founded in 2020 around technology
              its founders had been developing for more than a decade. What the current pool does not provide is a
              current board roster, named founders, or broader executive coverage. That keeps key-person dependence
              elevated in the public record: the company appears led by an identifiable operator, but outside investors
              still need direct diligence on founder continuity, board oversight, and succession depth rather than
              assuming those controls from sponsor quality.
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: Funding path and external stakeholders
        blocks:
          - type: paragraph
            body: >-
              The public evidence shows repeated outside financing and customer-side validation, but not a clean current
              capitalization picture. AP Ventures disclosed a $69 million round in October 2021 led by Amazon's Climate
              Pledge Fund and a NextEra Energy Resources subsidiary, while DBJ said it joined the latest funding round
              in January 2025. Caplight's public company page further indicates a corporate funding round dated April
              13, 2026 and a debt event dated June 24, 2025, but with no public amount or valuation on the accessible
              page. Separately, the 2026 American Airlines release and the World Economic Forum profile point to
              strategic customers and financiers including American, Citi, Breakthrough Energy Catalyst, and Brookfield.
              That combination supports commercial relevance, but not an underwriteable view of ownership, dilution,
              project debt terms, or total capital raised.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
              - CO016
      - number: '1.4'
        title: Milestones, policy dependence, and unresolved refresh gaps
        blocks:
          - type: paragraph
            body: >-
              Infinium's strongest refresh delta is operational proof. The March 2024 Pathfinder announcement
              established the first commercial-scale operating eFuels facility in Corpus Christi, and the August 2026
              American Airlines release moved the story forward to first eSAF delivery into a commercial airport supply
              chain and a passenger flight allocation. Those are concrete milestones later chapters can reuse. The
              counterweight is policy exposure: LobbyFacts shows Infinium spending €200,000-€299,999 on EU lobbying in
              2025 and targeting ReFuelEU Aviation, FuelEU Maritime, REDII, ETS, and the Energy Tax Directive. That does
              not negate the product story, but it does underline how much market formation still depends on regulation,
              mandates, and financing structures. Public sources still do not disclose current valuation, total capital
              raised, revenue, headcount, or delivered-volume economics, so the chapter supports a grounded identity
              baseline rather than a complete scale baseline.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
