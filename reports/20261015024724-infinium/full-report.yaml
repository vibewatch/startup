      - number: '3.2'
        title: Differentiation, deployment proof, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Infinium's retained differentiation is stronger on commercialization proof than on public feature
              granularity. The product pages claim drop-in compatibility across eSAF, eDiesel, and eNaphtha, and the
              American Airlines release adds external workflow proof by describing ASTM JetA qualification, use in
              existing aircraft and fueling infrastructure, and a completed commercial passenger flight using
              Pathfinder-produced eSAF. That matters because the status quo is not a blank slate: petroleum incumbents
              already own the operating baseline, while bio-based SAF participates in the same airline procurement
              conversation. The current pool therefore suggests that Infinium's edge is a combination of drop-in
              compatibility and operating-site evidence, not a public catalog of measured performance wins over named
              peers.
            claimRefs:
              - CP002
              - CP003
              - CP004
