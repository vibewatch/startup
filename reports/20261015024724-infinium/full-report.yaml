              - CI012
      - number: '4.2'
        title: Cost stack and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The cost structure is visible only at an engineering-input level, not at a margin or payback level.
              Construction Review reports that Roadrunner repurposes a brownfield site, adds a 100 MW electrolyzer
              system, relies on a 150 MW long-term wind supply arrangement, and receives dedicated carbon-dioxide
              feedstock infrastructure; those inputs make power, hydrogen conversion, and carbon sourcing obvious cost
              drivers. The same source also shows that tax abatements and monetization of 45V and 40B/45Z-related
              incentives are part of the economic stack. That is enough to say margins are structurally policy- and
              input-cost-sensitive, but not enough to compute contribution margin, gross margin, or CAC/payback proxies.
              Public evidence also does not disclose utilization, delivered gallons, logistics costs, or working-capital
              intensity, so the chapter can only separate observed operating architecture from the private data still
              required for underwriting.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital formation is better evidenced than operating economics, but even that evidence is incomplete.
              Roadrunner is described as backed by more than $275 million of equity financing, including Brookfield and
              Breakthrough Energy Catalyst participation, while AP Ventures' 2021 funding announcement tied an earlier
              $69 million round to scaling facilities that could each target nearly 40 million gallons annually. DBJ
              disclosed participation in Infinium's latest round in January 2025, and Caplight's public profile labels
              April 2026 as the company's last round while withholding amount and valuation details from its public
              preview. This pattern supports a view that Infinium is still in capital-raising mode as it scales
              projects, but it does not disclose cash on hand, debt size, amortization, covenants, or project-by-project
              capex budgets. LobbyFacts adds another signal: the company is spending to shape ReFuelEU, FuelEU Maritime,
              ETS, and related policy files, reinforcing that financing outcomes are intertwined with regulation rather
              than purely with already-proven plant economics.
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. Infinium looks more commercially real than a concept-stage
              climate startup because there is operating plant evidence, named customers and partners, and continued
              sponsor appetite across 2025-26. But the public record still does not support conviction on revenue
              quality, margin path, or capital adequacy because the variables that matter most for underwriting remain
              private: realized pricing, delivered volumes, gross margin, cash burn, debt obligations, and
              counterparty-specific contract terms. The most defensible investment read from public evidence alone is
              that Infinium has crossed the threshold from technology promise to project execution, yet still depends on
              additional diligence to prove whether execution converts into durable cash economics rather than a series
              of increasingly large funded buildouts.
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI012
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence is project-finance rich but P&L poor
            body: >-
              Named customers, operating plants, and continuing sponsor support reduce technology-risk concerns, but the
              retained public record still omits the contract, volume, margin, cash, and debt details needed to
              underwrite revenue quality or runway.
            calloutType: risk
            claimRefs:
              - CI004
              - CI006
              - CI010
              - CI012
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Infinium's product story is concrete rather than conceptual: the company markets three electrofuel
              products — eSAF, eDiesel, and eNaphtha — into customer workflows that already consume petroleum jet fuel,
              diesel, and naphtha. The strongest supported point is compatibility. Company materials consistently frame
              eSAF and eDiesel as drop-in replacements that can run through today's engines and distribution systems,
              which matters because buyers in aviation, trucking, maritime, and chemicals do not want fleet or
              infrastructure conversion risk. The more differentiated question is not what molecules Infinium sells, but
              whether those molecules can move from pilot narrative to repeatable delivered volumes and contract
              economics.
            claimRefs:
              - CE001
              - CE002
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE014
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The public architecture is that of a fuel-production system, not a software stack. Across company-issued
              and partner descriptions, Infinium combines waste carbon dioxide, renewable power, green hydrogen,
              patented catalysts, on-site electrolyzers, laboratory validation, and delivery logistics into a
              power-to-liquids workflow. Pathfinder is the key maturity anchor because it is described not just as a
              demonstration asset but as a continuously operating commercial-scale plant with Infinium responsible for
              construction, commissioning, operations, and maintenance. The August 2026 American Airlines release adds
              the clearest deployment proof: Pathfinder-produced eSAF was blended to ASTM JetA, delivered into an
              airport fuel system, and allocated to a commercial passenger flight.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE011
              - CE012
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.3'
        title: Differentiation and scale path
        blocks:
          - type: paragraph
            body: >-
              Supported differentiation rests on three pillars. First, Infinium repeatedly claims fuel compatibility
              with existing infrastructure, reducing the adoption burden relative to solutions that require new engines
              or refueling networks. Second, the company ties its edge to proprietary power-to-liquids know-how,
              patented catalysts, and direct operating feedback from Pathfinder; DBJ explicitly highlights catalyst
              technology and project-development capability in its investment rationale. Third, the operating model
              appears broader than pure fuel sales, with third-party descriptions pointing to technology licenses,
              proprietary equipment, and catalyst offerings alongside owned-project development. Roadrunner is therefore
              important not only as incremental capacity but as the first visible test of whether the Pathfinder
              learning loop scales into a repeatable project platform.
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
      - number: '5.4'
        title: Controls, dependencies, and open risks
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance evidence is real but narrow. Company materials cite ISCC PLUS certification and the
              2026 airport delivery describes ASTM JetA testing for the eSAF batch, which is useful proof that product
              qualification is more than marketing copy. LobbyFacts adds another important dependency: Infinium is
              actively targeting ReFuelEU, FuelEU Maritime, ETS, REDII, and related policy files, showing that
              commercialization is entangled with the regulatory design of low-carbon fuel markets. What remains
              under-disclosed are the variables that matter most for underwriting technical durability: catalyst
              composition, plant yields, uptime, delivered production volumes, chain-of-custody detail, plant-control
              software, and cybersecurity or incident-response architecture. Those omissions leave product credibility
              ahead of full operational transparency.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pathfinder provides unusually concrete deployment proof
            body: >-
              For an electrofuels company, Infinium's public record goes beyond conceptual technology claims: retained
              sources support an operating commercial-scale Pathfinder facility and a 2026 eSAF batch that was
              ASTM-tested, delivered to a commercial airport, and allocated to an American Airlines passenger flight.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE014
          - type: callout
            title: Scale underwriting still depends on non-public operating detail
            body: >-
              The retained public record does not disclose the catalyst recipe, plant yields, uptime, delivered volumes,
              control software, or cyber and quality-management architecture that would let an investor test whether
              Pathfinder maturity translates cleanly into Roadrunner-scale economics and reliability.
            calloutType: risk
            claimRefs:
              - CE008
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer proof is strongest in aviation and plastics, with other segments still mostly pipeline
        blocks:
          - type: paragraph
            body: >-
              Infinium's public customer story is concentrated in hard-to-abate sectors where drop-in fuels matter
              immediately. The clearest retained proof is in aviation and plastics: American Airlines has both an
              announced Roadrunner offtake relationship and a completed commercial passenger flight allocated with
              Infinium eSAF, while Borealis is already receiving commercial eNaphtha shipments for polyolefin
              production. By contrast, trucking, maritime, and broader industrial demand are still described mainly as
              target markets rather than named production deployments. That means the segmentation story is commercially
              plausible, but current evidence is much stronger on use-case fit than on breadth of the installed customer
              base.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
              - CU010
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU007
              - CU011
              - CU013
      - number: '6.2'
        title: >-
          Adoption has progressed from operating plant proof to live customer delivery, but scale-up timing remains
          fluid
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory is no longer just conceptual because Pathfinder is operating and has moved product
              into downstream use. Public proof now spans a continuously operating commercial-scale plant, a first
              commercial eNaphtha shipment to Borealis, and an allocated commercial passenger flight with American.
              Those are meaningful milestones because they show compatibility with existing chemical and aviation
              workflows rather than just lab validation. However, the ramp from anchor deployments to scaled recurring
              volume is still unsettled. The retained record shows Roadrunner demand interest and financing support, but
              it also shows timeline slippage and unsigned remainder capacity, which weakens confidence in near-term
              customer expansion pace.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: >-
          Named counterparties prove reference quality, but most logos are not yet equivalent to recurring production
          revenue
        blocks:
          - type: paragraph
            body: >-
              The quality of named proof is mixed in a useful way. American and Borealis matter because the retained
              sources tie them to specific deployment events or delivered product rather than to passive logo use. Citi
              appears as a demand-enabling corporate counterparty through the American arrangement, which is
              directionally helpful but weaker than a disclosed direct fuel-purchase commitment. Earlier investor and
              ecosystem names such as Amazon and NextEra help validate strategic interest in the addressable customer
              problem, yet they are not substitutes for customer retention or concentration data. Investors and
              strategic sponsors improve confidence that a market exists; they do not prove repeat purchasing behavior
              across a scaled installed base.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU009
              - CU012
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU014
      - number: '6.4'
        title: The biggest unresolved customer questions are durability, economics, and concentration
        blocks:
          - type: paragraph
            body: >-
              The main weakness in the current public record is not whether anyone wants the product, but whether the
              earliest customer wins convert into durable, diversified revenue. None of the retained sources disclose
              customer count, NRR, GRR, churn, renewal rates, contract duration, or top-customer concentration by year.
              Public evidence also leaves contract economics opaque: there is no disclosed price, minimum-volume
              commitment, or delivered-gallon history for the key American and Borealis relationships. Finally,
              regulatory dependence still matters. Infinium's own EU lobbying profile and American's explicit comment
              that lower SAF prices are essential both suggest expansion depends on policy design and cost
              competitiveness, not just technical readiness.
            claimRefs:
              - CU006
              - CU008
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof is now real, not purely forward-looking
            body: >-
              Borealis shipment evidence and American's commercial flight make Infinium's customer proof materially
              stronger than a logo-only story.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU014
          - type: callout
            title: Durability still rests on undisclosed economics and a delayed scale-up path
            body: >-
              Public proof does not yet show retention or concentration metrics, and the Roadrunner timeline moved from
              an earlier 2026 expectation to a 2027 delivery expectation in the latest retained customer proof.
            calloutType: risk
            claimRefs:
              - CU006
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Execution risk is now about repeatable project delivery, not basic fuel viability
        blocks:
          - type: paragraph
            body: >-
              The strongest current mitigation is that Infinium has moved beyond slideware into actual field deployment:
              retained August 2026 sources describe fuel from Pathfinder being allocated to an American Airlines
              commercial passenger flight, and March 2024 company materials describe Pathfinder as an operating
              commercial-scale eFuels facility with ISCC PLUS certification. That evidence reduces the binary question
              of whether the chemistry can clear real logistics and aircraft-spec handling. The remaining operating risk
              is scale repetition. The same August 2026 announcement says Roadrunner was still under construction, with
              first deliveries expected in 2027, so the key diligence question has shifted to whether Infinium can take
              one operating plant's proof and turn it into a predictable multi-plant build-and-ramp playbook without
              schedule, quality, or financing slippage.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR010
              - CR013
              - CR014
      - number: '7.2'
        title: Policy support helps demand formation, but it also creates exposure to rule design
        blocks:
          - type: paragraph
            body: >-
              Public sources tie Infinium's market formation directly to policy design. LobbyFacts shows the company
              targeting ReFuelEU Aviation, FuelEU Maritime, ETS, REDII, the Energy Tax Directive, and the Clean
              Industrial Deal in its EU lobbying remit, while DBJ explicitly frames aviation demand as being driven by
              regulations, policies, and decarbonization targets. That supports the bullish case for eFuels, but it also
              means underwriting is exposed to low-carbon fuel credit rules, lifecycle-accounting treatment, and timing
              of mandated adoption. The retained sources also show mitigation: Infinium says its fuels are drop-in
              replacements, and Pathfinder's certification reduces qualification risk. Even so, the policy stack matters
              because a change in incentive design or recognized compliance pathways could slow volume uptake before
              plant economics are fully proven at scale.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
      - number: '7.3'
        title: Capital access is visible, but underwriting transparency and counterparty concentration are still weak
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to show real capital formation but not tight enough to support
              high-conviction underwriting on project economics. Dealroom records a September 2024
              infrastructure-finance event with Brookfield and shows only valuation and funding ranges on its public
              page; Caplight records additional debt and corporate-funding milestones through April 2026; AP Ventures'
              2021 announcement framed capital needs in terms of facilities that could each target nearly 40 million
              gallons annually. Those signals imply large project intensity and continuing dependence on outside
              capital. Counterparties also look concentrated in the retained sources: American is the named airline
              offtaker, Citi is tied to the Scope 3 structure, and Brookfield, Breakthrough Energy Catalyst, and HSBC
              appear in the Roadrunner financing chain. That does not break the thesis, but it means a missed financing
              gate, offtake revision, or slower-than-expected policy monetization would hit the investment case quickly.
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers to monitor
            body: >-
              The thesis worsens materially if Roadrunner slips beyond its stated 2027 delivery window, if low-carbon
              fuel policy support weakens before multiple plants are online, or if financing counterparties remain
              visible while exact debt, pricing, and plant-economics terms stay opaque.
            calloutType: risk
            claimRefs:
              - CR002
              - CR010
              - CR013
              - CR014
          - type: callout
            title: What already de-risks the story
            body: >-
              Pathfinder operations, ISCC PLUS certification, and a real commercial passenger-flight allocation mean
              Infinium no longer has to prove that its fuel can exist outside a lab; the harder next step is proving
              repeatable, financed, customer-backed scale.
            calloutType: insight
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence has improved on the quality side of the underwriting story. In 2026, American Airlines and
              Infinium announced a commercial passenger flight using Pathfinder-produced eSAF, and Mitsui ties the
              operating plant to named customers including Amazon and Borealis while also pointing to IAG and American
              as committed Roadrunner buyers. Financing support has also deepened through Brookfield, Mitsui, and
              DBJ-linked capital. What still blocks a priced entry call is missing price context: the retained valuation
              record lists recent financing timestamps and an April 2026 last-round marker, but it does not disclose
              round size, post-money value, price per share, dilution mechanics, or preference overhang. That
              combination supports a **track** posture instead of buy or avoid because the company looks increasingly
              real while the entry math remains opaque.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Financing context and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is straightforward: Brookfield's project commitment, Mitsui's Series C participation,
              and DBJ's latest-round participation all indicate that sophisticated capital providers are still willing
              to fund the platform. The anti-thesis is equally important for valuation. Caplight's public page surfaces
              financing chronology and comparable names, but it withholds the actual valuation figures and does not
              display filing documents without additional access. That means investors can see external interest but
              cannot test whether the current price already discounts Roadrunner's planned 2027 output, sponsor
              optionality, or the durability of offtake demand. The product and climate-positioning narrative is
              coherent across company-controlled pages, yet it is still narrative support rather than price support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on Infinium turning today's milestone proof into repeatable scaled economics:
              Roadrunner must start roughly on schedule, the sponsor group must keep funding expansion, and airline plus
              chemicals demand must translate into durable contracted volumes. The base case is more modest: technical
              credibility keeps improving, but investors still wait for better visibility into price and
              capital-structure terms before underwriting a return. The bear case is not that the product thesis is
              fake; it is that project timing, metric-linked follow-on financing, and policy-sensitive demand keep
              compressing the set of defendable outcomes. Lobbying activity around ReFuelEU, FuelEU Maritime, ETS, and
              related rules reinforces how dependent value creation remains on commercialization timing and policy
              architecture. The final diligence packet therefore needs round economics, debt terms, preference stack,
              and plant-level unit economics before an entry recommendation can tighten.
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              The retained public record is now good enough to say Infinium is commercially relevant, but not good
              enough to say whether a new investor would be paying a fair, stretched, or attractive price.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
          - type: callout
            title: Best downside diligence question
            body: >-
              Ask whether Roadrunner economics still work if policy support, carbon-credit value, or sponsor follow-on
              milestones land later than management expects.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV009
              - CV014
