  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The retained sources support a market definition narrower than a generic "clean energy" story. Infinium is
              positioning eSAF, eDiesel, and eNaphtha as drop-in replacements for petroleum jet fuel, diesel, fuel oil,
              and naphtha in sectors where fleet turnover or electrification is slower: aviation, long-haul freight,
              maritime shipping, and chemicals. That means the relevant spend is liquid-fuel or feedstock substitution
              inside existing workflows, not aircraft manufacturing, charging infrastructure, or broad carbon-removal
              budgets. This boundary matters because the adoption case depends less on creating a new behavior and more
              on winning procurement inside incumbent fuel pools that already exist.
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence provides a useful top-down boundary for aviation but not a complete bottom-up TAM, SAM,
              and SOM stack. The strongest outside lens is aviation's incumbent fuel pool: retained 2026 coverage cites
              nearly 100 billion gallons of jet fuel consumed annually and notes that SAF is still less than 1% of total
              jet fuel use worldwide, which frames a very large category with still-early penetration. The narrower
              company-specific lens is Roadrunner's disclosed scale and timing, plus Pathfinder's existing commercial
              proof. Those lenses show real demand pull and commercialization progress, but they do not disclose the
              price, gross-margin, or contract terms needed to translate macro demand into a defendable public SAM or
              SOM.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyer, user, and payer roles differ by segment, and that shapes how quickly each lane can convert from
              interest to budgeted demand. In aviation, the user is the airline fuel operation, the immediate buyer is
              the airline or fuel procurement function, and the payer can extend to corporates that want travel-related
              emissions reductions, as shown by the American Airlines and Citi structure. In trucking, maritime, and
              chemical feedstocks, the user is the fleet or plant operator and the budget owner is conventional fuel or
              feedstock procurement. Across these lanes, Infinium's disclosed commercialization path relies on a small
              number of large counterparties rather than broad-based transactional distribution.
            claimRefs:
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption drivers in retained sources are policy pressure, decarbonization targets, supply
              scarcity in SAF, and the ability to use existing engines and infrastructure. Those factors shorten the
              behavior-change hurdle and help explain why aviation appears to be the leading wedge. The offsetting
              constraints are equally material: this is a capital-intensive buildout, public evidence still centers on a
              limited set of counterparties, and retained sources do not disclose Roadrunner pricing, minimum-volume
              protections, plant-level unit economics, or segment-by-segment contracted volume. Those omissions do not
              negate the market opportunity, but they do keep the chapter at an evidence-constrained market view rather
              than a conviction-grade monetization model.
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aviation is the clearest documented wedge
            body: >-
              Retained sources give a usable aviation market boundary, a sub-1% SAF penetration benchmark, a disclosed
              Roadrunner capacity target, and a live American Airlines deployment, which is materially stronger proof
              than Infinium has publicly disclosed for other segments.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: callout
            title: Monetization visibility still trails market visibility
            body: >-
              The chapter can justify a broad and attractive market boundary, but not a conviction-grade public SAM or
              SOM, because pricing, minimum-volume protections, and unit economics are still missing from the retained
              source set.
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The retained pool supports a broad but evidence-constrained landscape. Caplight names Twelve, AIR COMPANY,
              and Synhelion as Infinium comparables, which is enough to establish a direct electrofuels peer set, but
              not enough to benchmark each peer's current pricing, deployment, or product breadth one by one. Outside
              those named peers, the practical alternatives are clearer: bio-based SAF supply, incumbent petroleum fuels
              and feedstocks, and build-or-license routes for project developers. Infinium's own materials matter here
              because they frame the job-to-be-done as drop-in decarbonization for aviation, freight, maritime, and
              chemicals, so the relevant competition is any route that can satisfy those buyers without forcing major
              engine or infrastructure change.
            claimRefs:
              - CP001
              - CP002
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
