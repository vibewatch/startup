              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: What still blocks a clean winner-versus-peer conclusion
        blocks:
          - type: paragraph
            body: >-
              The assigned pool is good enough to place Infinium on the map, but not to close every underwriting
              question. Public sources here say more about offtakes, project capacity, and climate attributes than about
              list prices, take-or-pay floors, discounting, or delivered gross margins. Caplight confirms direct peers
              exist, yet the pool does not retain their own official product or pricing pages, so a strict
              apples-to-apples benchmark would overstate the evidence. For diligence purposes, the right read is that
              Infinium has unusually strong public commercialization proof for an electrofuels developer, while the
              price and contract layer remains the biggest unresolved opening for substitutes, incumbents, or
              well-financed entrants to compress differentiation.
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof is the clearest edge
            body: >-
              The assigned pool makes Infinium look strongest where many climate-fuel startups are weakest:
              operating-site proof, an airline offtake, and visible scale capital all appear before public price
              transparency does.
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP007
          - type: callout
            title: The pricing layer is still open
            body: >-
              Public disclosures retained for this chapter do not let a buyer or investor compare Infinium against named
              peers on list price, realized contract terms, or delivered margin, leaving room for substitutes or
              well-financed entrants to narrow any technology lead.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and commercial proof
        blocks:
          - type: paragraph
            body: >-
              The retained public record supports a straightforward monetization logic: Infinium markets physical
              low-carbon fuel products rather than software or equipment, and its public commercial proof is tied to
              named offtake relationships and product deployment milestones. The company product surface describes eSAF,
              eDiesel, and eNaphtha as drop-in replacements for aviation, heavy transport, maritime, and chemicals end
              markets. Independent coverage and a joint airline release then add evidence that Pathfinder has been
              operating since 2023, that Amazon-contracted heavy-transport use exists, and that American Airlines has
              already used Pathfinder-produced eSAF in a commercial-flight supply chain while holding a
              commercial-volume offtake agreement for Roadrunner. What remains missing is the underwriting layer:
              retained sources do not disclose realized fuel pricing, certificate ownership, take-or-pay mechanics, or
              delivered annual volumes by product line.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
