callouts:
  - calloutType: risk
    title: Thesis-break triggers to monitor
    body: >-
      The thesis worsens materially if Roadrunner slips beyond its stated 2027
      delivery window, if low-carbon fuel policy support weakens before multiple
      plants are online, or if financing counterparties remain visible while
      exact debt, pricing, and plant-economics terms stay opaque.
    claimRefs: [CR002, CR010, CR013, CR014]
  - calloutType: insight
    title: What already de-risks the story
    body: >-
      Pathfinder operations, ISCC PLUS certification, and a real commercial
      passenger-flight allocation mean Infinium no longer has to prove that its
      fuel can exist outside a lab; the harder next step is proving repeatable,
      financed, customer-backed scale.
    claimRefs: [CR001, CR003, CR005, CR008]
