      - ["Project-level financing visibility", "> $275 million of disclosed equity support for Roadrunner, but total project cost is not disclosed", "Medium", "Capital intensity cannot be underwritten without total capex and funding-stack detail", "Request full capex budget, source-and-use schedule, and any sponsor milestone conditions"]
