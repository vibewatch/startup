      - ["Policy dependence", "Roadrunner leverages tax abatements and IRA incentives; LobbyFacts shows €200,000-€299,999 of 2025 lobbying costs tied to fuel-policy files", "Medium", "A meaningful share of project economics may depend on regulation rather than purely merchant pricing", "Request base-case vs policy-downside economics and any contracted credit monetization terms"]
      - ["Latest financing signal", "DBJ joined the latest round in Jan 2025 and Caplight labels Apr 13, 2026 as the last round while hiding amount and valuation", "Low", "Shows continued fundraising activity but not whether the balance sheet is already adequately funded", "Request latest capitalization table, cash balance, debt schedule, and runway forecast"]
