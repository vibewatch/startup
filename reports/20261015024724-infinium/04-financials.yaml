company:
  name: "Infinium"
chapter:
  number: 4
  title: "Financials"
  summary: |-
    Public evidence supports a real fuels business with operating output from Pathfinder, named offtake relationships, and continuing outside financing, but it still does not support a traditional underwriting read on revenue quality or capital adequacy. The strongest disclosed signals are project-finance milestones and policy support rather than realized pricing, delivered volumes, margins, cash, or debt terms.
sections:
  - id: "revenue-model-and-commercial-proof"
    title: "Revenue model and commercial proof"
    body: |-
      The retained public record supports a straightforward monetization logic: Infinium markets physical low-carbon fuel products rather than software or equipment, and its public commercial proof is tied to named offtake relationships and product deployment milestones. The company product surface describes eSAF, eDiesel, and eNaphtha as drop-in replacements for aviation, heavy transport, maritime, and chemicals end markets. Independent coverage and a joint airline release then add evidence that Pathfinder has been operating since 2023, that Amazon-contracted heavy-transport use exists, and that American Airlines has already used Pathfinder-produced eSAF in a commercial-flight supply chain while holding a commercial-volume offtake agreement for Roadrunner. What remains missing is the underwriting layer: retained sources do not disclose realized fuel pricing, certificate ownership, take-or-pay mechanics, or delivered annual volumes by product line.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI012"]
    tableRefs: ["TI001", "TI002"]
  - id: "cost-stack-and-unit-economics"
    title: "Cost stack and unit-economics visibility"
    body: |-
      The cost structure is visible only at an engineering-input level, not at a margin or payback level. Construction Review reports that Roadrunner repurposes a brownfield site, adds a 100 MW electrolyzer system, relies on a 150 MW long-term wind supply arrangement, and receives dedicated carbon-dioxide feedstock infrastructure; those inputs make power, hydrogen conversion, and carbon sourcing obvious cost drivers. The same source also shows that tax abatements and monetization of 45V and 40B/45Z-related incentives are part of the economic stack. That is enough to say margins are structurally policy- and input-cost-sensitive, but not enough to compute contribution margin, gross margin, or CAC/payback proxies. Public evidence also does not disclose utilization, delivered gallons, logistics costs, or working-capital intensity, so the chapter can only separate observed operating architecture from the private data still required for underwriting.
    claimRefs: ["CI005", "CI006", "CI007", "CI012", "CI013"]
    tableRefs: ["TI003"]
    figureRefs: ["FI001"]
  - id: "capital-needs-and-financing-dependency"
    title: "Capital needs and financing dependency"
    body: |-
      Capital formation is better evidenced than operating economics, but even that evidence is incomplete. Roadrunner is described as backed by more than $275 million of equity financing, including Brookfield and Breakthrough Energy Catalyst participation, while AP Ventures' 2021 funding announcement tied an earlier $69 million round to scaling facilities that could each target nearly 40 million gallons annually. DBJ disclosed participation in Infinium's latest round in January 2025, and Caplight's public profile labels April 2026 as the company's last round while withholding amount and valuation details from its public preview. This pattern supports a view that Infinium is still in capital-raising mode as it scales projects, but it does not disclose cash on hand, debt size, amortization, covenants, or project-by-project capex budgets. LobbyFacts adds another signal: the company is spending to shape ReFuelEU, FuelEU Maritime, ETS, and related policy files, reinforcing that financing outcomes are intertwined with regulation rather than purely with already-proven plant economics.
    claimRefs: ["CI006", "CI008", "CI009", "CI010", "CI011", "CI013"]
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial verdict and diligence blockers"
    body: |-
      The financial verdict is therefore mixed. Infinium looks more commercially real than a concept-stage climate startup because there is operating plant evidence, named customers and partners, and continued sponsor appetite across 2025-26. But the public record still does not support conviction on revenue quality, margin path, or capital adequacy because the variables that matter most for underwriting remain private: realized pricing, delivered volumes, gross margin, cash burn, debt obligations, and counterparty-specific contract terms. The most defensible investment read from public evidence alone is that Infinium has crossed the threshold from technology promise to project execution, yet still depends on additional diligence to prove whether execution converts into durable cash economics rather than a series of increasingly large funded buildouts.
    claimRefs: ["CI003", "CI004", "CI010", "CI012", "CI013"]
