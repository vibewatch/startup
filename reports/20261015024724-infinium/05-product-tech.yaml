company:
  name: "Infinium"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Infinium's retained public product record is strongest on physical-fuel compatibility and early operating proof: multiple company-issued sources describe a patented power-to-liquids pathway, an operating Pathfinder facility, and a first commercial-airport eSAF delivery. The same record is materially thinner on plant economics, process yields, uptime, control software, and practitioner-level technical validation, so the chapter supports technical credibility but not full underwriting confidence."
sections:
  - id: "portfolio-and-customer-workflow"
    title: "Portfolio and customer workflow"
    body: "Infinium's product story is concrete rather than conceptual: the company markets three electrofuel products — eSAF, eDiesel, and eNaphtha — into customer workflows that already consume petroleum jet fuel, diesel, and naphtha. The strongest supported point is compatibility. Company materials consistently frame eSAF and eDiesel as drop-in replacements that can run through today's engines and distribution systems, which matters because buyers in aviation, trucking, maritime, and chemicals do not want fleet or infrastructure conversion risk. The more differentiated question is not what molecules Infinium sells, but whether those molecules can move from pilot narrative to repeatable delivered volumes and contract economics."
    claimRefs: ["CE001", "CE002", "CE009"]
    tableRefs: ["TE001", "TE002"]
  - id: "operating-architecture-and-maturity"
    title: "Operating architecture and maturity"
    body: "The public architecture is that of a fuel-production system, not a software stack. Across company-issued and partner descriptions, Infinium combines waste carbon dioxide, renewable power, green hydrogen, patented catalysts, on-site electrolyzers, laboratory validation, and delivery logistics into a power-to-liquids workflow. Pathfinder is the key maturity anchor because it is described not just as a demonstration asset but as a continuously operating commercial-scale plant with Infinium responsible for construction, commissioning, operations, and maintenance. The August 2026 American Airlines release adds the clearest deployment proof: Pathfinder-produced eSAF was blended to ASTM JetA, delivered into an airport fuel system, and allocated to a commercial passenger flight."
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE014"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-scale-path"
    title: "Differentiation and scale path"
    body: "Supported differentiation rests on three pillars. First, Infinium repeatedly claims fuel compatibility with existing infrastructure, reducing the adoption burden relative to solutions that require new engines or refueling networks. Second, the company ties its edge to proprietary power-to-liquids know-how, patented catalysts, and direct operating feedback from Pathfinder; DBJ explicitly highlights catalyst technology and project-development capability in its investment rationale. Third, the operating model appears broader than pure fuel sales, with third-party descriptions pointing to technology licenses, proprietary equipment, and catalyst offerings alongside owned-project development. Roadrunner is therefore important not only as incremental capacity but as the first visible test of whether the Pathfinder learning loop scales into a repeatable project platform."
    claimRefs: ["CE002", "CE003", "CE007", "CE008", "CE009", "CE010", "CE013"]
  - id: "controls-dependencies-and-open-risks"
    title: "Controls, dependencies, and open risks"
    body: "Trust and compliance evidence is real but narrow. Company materials cite ISCC PLUS certification and the 2026 airport delivery describes ASTM JetA testing for the eSAF batch, which is useful proof that product qualification is more than marketing copy. LobbyFacts adds another important dependency: Infinium is actively targeting ReFuelEU, FuelEU Maritime, ETS, REDII, and related policy files, showing that commercialization is entangled with the regulatory design of low-carbon fuel markets. What remains under-disclosed are the variables that matter most for underwriting technical durability: catalyst composition, plant yields, uptime, delivered production volumes, chain-of-custody detail, plant-control software, and cybersecurity or incident-response architecture. Those omissions leave product credibility ahead of full operational transparency."
    claimRefs: ["CE011", "CE012", "CE013", "CE014"]
callouts:
  - calloutType: "strength"
    title: "Pathfinder provides unusually concrete deployment proof"
    body: "For an electrofuels company, Infinium's public record goes beyond conceptual technology claims: retained sources support an operating commercial-scale Pathfinder facility and a 2026 eSAF batch that was ASTM-tested, delivered to a commercial airport, and allocated to an American Airlines passenger flight."
    claimRefs: ["CE005", "CE006", "CE014"]
  - calloutType: "risk"
    title: "Scale underwriting still depends on non-public operating detail"
    body: "The retained public record does not disclose the catalyst recipe, plant yields, uptime, delivered volumes, control software, or cyber and quality-management architecture that would let an investor test whether Pathfinder maturity translates cleanly into Roadrunner-scale economics and reliability."
    claimRefs: ["CE008", "CE012"]
