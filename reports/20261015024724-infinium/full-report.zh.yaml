      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本形成比运营经济性更有证据，但这部分信息也不完整。据称 Roadrunner 获得超过 $275 million 股权融资支持，其中包括 Brookfield 和 Breakthrough Energy
              Catalyst；AP Ventures 的 2021 年融资公告则将早期 $69 million 轮融资与扩建工厂联系起来，每座工厂目标年产量接近 40 million gallons。DBJ 披露其于
              2025 年 1 月参与 Infinium 最新轮融资；Caplight 公开资料将 2026 年 4 月标为公司上一轮融资，但在公开预览中隐藏金额和估值。这一模式支持 Infinium
              在项目扩张过程中仍处于融资状态的判断，但没有披露现金余额、债务规模、摊还、契约或逐项目资本开支预算。LobbyFacts 还提供了另一信号：公司正投入影响 ReFuelEU、FuelEU Maritime、ETS
              及相关政策文件，进一步说明融资结果与监管交织，而非只取决于已经验证的工厂经济性。
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合的。Infinium 比概念阶段的气候初创企业更像真实商业公司，因为已有运营工厂证据、具名客户和合作伙伴，以及 2025-26
              年持续的赞助方兴趣。但公开记录仍不足以对收入质量、毛利率路径或资本充足性形成高确信度判断，因为投资判断最看重的变量仍是私有信息：实际定价、交付量、毛利、现金消耗、债务义务和交易对手特定合同条款。仅凭公开证据，最稳妥的投资判断是：Infinium
              已跨过从技术愿景到项目执行的门槛，但仍需进一步尽调，证明执行能转化为持久的现金经济性，而不是一系列规模越来越大的融资建设项目。
            claimRefs:
