              及相关政策文件，说明商业化与低碳燃料市场的监管设计交织在一起。对于评估技术持久性最重要的变量仍披露不足：催化剂成分、工厂产率、开工率、交付产量、监管链细节、工厂控制软件以及网络安全和事件响应架构。这些缺口使产品可信度领先于完整运营透明度。
