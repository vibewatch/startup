      - number: '4.2'
        title: 成本结构与单位经济性透明度
        blocks:
          - type: paragraph
            body: >-
              目前只能从工程投入看出成本结构，利润率和回本情况仍不可见。Construction Review 报道称，Roadrunner 改造一处棕地，新增 100 MW 电解槽系统，依赖 150 MW
              长期风电供应安排，并获得专用二氧化碳原料基础设施；这些投入清楚指向电力、制氢转化和碳源成本。该来源还显示，税收减免以及 45V 和 40B/45Z
              相关激励的货币化属于经济结构的一部分。这足以说明毛利率在结构上对政策和投入成本敏感，但不足以计算贡献利润、毛利率或 CAC /
              回本代理指标。公开证据也没有披露产能利用率、交付量、物流成本或营运资本强度，因此本章只能区分已观察到的运营架构与投资判断所需的私人数据。
