      - number: '3.4'
        title: 哪些问题仍阻碍明确的胜负判断
        blocks:
          - type: paragraph
            body: >-
              分配给本章的资料足以把 Infinium 放到地图上，但不足以回答所有投资判断问题。这里的公开来源更多谈到承购、项目产能和气候属性，而不是挂牌价格、take-or-pay 保底、折扣或交付毛利。Caplight
              证实存在直接同行，但资料池没有保留这些同行自己的官方产品或定价页面，因此严格的同口径比较会高估证据。尽调时更合理的判断是：对于一家电制燃料开发商，Infinium
              拥有异常强的公开商业化证明；与此同时，价格和合同层仍是最大未解空间，替代方案、传统厂商或资金充足的进入者都可能借此压缩差异化。
