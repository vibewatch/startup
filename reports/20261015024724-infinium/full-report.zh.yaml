      - CE006
      - CE007
      - CE008
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户验证已从行业定位推进到生产部署，但扩张仍取决于项目时点、政策和成本。
    data:
      items:
        - label: 客户分群筛选
          actor: 可持续发展与工业采购团队
          touchpoints:
            - 航空、卡车运输、海运和化工被定位为核心目标行业。
            - 卖点是与现有发动机和工业流程即插即用地兼容。
        - label: 技术与商业尽调
          actor: 燃料买方与工业采购团队
          touchpoints:
            - 买方需要证据证明 Pathfinder 能在商业规模下生产符合规格的产品。
            - 公开记录仍缺少合同经济性、交付加仑数和留存指标。
        - label: 首次生产验证
          actor: 锚定交易对手
          touchpoints:
            - Borealis 收到用于塑料生产的商业 eNaphtha 货运。
            - American 将 Infinium eSAF 分配给一次商业客运航班。
        - label: 扩张签约
          actor: 航空公司与项目融资伙伴
          touchpoints:
            - American 已锁定未来 Roadrunner 承购，Brookfield 融资与预先约定的指标挂钩。
            - 保留的 2024 年报道显示，Roadrunner 剩余产能当时仍在销售。
        - label: 地理扩张
          actor: 欧盟政策与市场开发团队
          touchpoints:
            - 游说重点包括 ReFuelEU Aviation、FuelEU Maritime 和 REDII 相关规则。
            - 公开项目管线雄心覆盖美国、欧盟、日本和澳大利亚。
        - label: 续约与集中度检验
          actor: 管理层与投资者
          touchpoints:
            - 更广泛的航空公司采用取决于更低的 SAF 价格和可靠的交付量。
            - 没有保留来源披露客户数、流失率、NRR 或头部客户集中度。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在当前公开记录中，Roadrunner 执行和融资依赖带来的剩余风险最重。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余暴露
      rows:
        - label: Roadrunner 启动与爬坡
          note: 截至 2026 年 8 月，扩张里程碑仍在未来。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 中
              tone: medium
              note: Pathfinder 的运营和认证提供了一些可迁移经验。
            - label: 高
              tone: high
        - label: 政策与积分制度依赖
          note: 需求形成与低碳燃料政策设计相关。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 即插即用兼容性有帮助，但积分设计仍很关键。
            - label: 高
              tone: high
        - label: 交易对手集中度
          note: 保留样本中，已点名的商业化和融资交易对手有限。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 现有支持方和已点名承购方降低了二元失败风险。
            - label: 高
              tone: high
        - label: 价格与工厂经济性的投资判断不透明
          note: 公开来源对里程碑和区间的展示，比对确切条款更清楚。
          values:
            - label: 高
              tone: high
            - label: 中高
              tone: high
            - label: 低
              tone: medium
              note: 保留来源未披露债务契约、确切估值或单位利润率。
            - label: 高
              tone: high
        - label: 资质与交付项目复制
          note: 一次商业航班分配不等于可重复的多客户供货节奏。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 中
              tone: medium
              note: ASTM 兼容性和 ISCC PLUS 认证有帮助，但逐客户执行仍很关键。
            - label: 中
              tone: medium
        - label: 运营带宽与项目管线范围
          note: 相对于多项目开发议程，公开披露的员工人数并不多。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低中
              tone: medium
              note: 当前公开披露未详细拆分项目开发或运营人员配置。
            - label: 中
              tone: medium
    approximationNotes: 各单元格概括保留公开证据中的严重性信号，而非模型推导的概率。
    claimRefs:
      - CR002
      - CR005
      - CR006
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍受定价不透明限制，而不是受商业进展不足限制。
    data:
      nodes:
        - id: commercial-proof
          label: 商业验证
          description: 2026 年客运航班证据，加上已点名的 Pathfinder 和 Roadrunner 交易对手，表明已有真实部署。
        - id: sponsor-capital
          label: 发起方资本
          description: Brookfield、Mitsui 和 DBJ 的参与验证了持续融资渠道。
        - id: product-fit
          label: 产品契合度
          description: 公司控制的材料持续将这些燃料定位为即插即用的脱碳工具。
        - id: price-opacity
          label: 价格不透明
          description: 公开估值页面仍未提供融资轮次规模、估值、申报细节和优先权条款。
        - id: policy-execution
          label: 政策与执行敏感度
          description: 与指标挂钩的融资和积极的政策参与，使下行风险仍取决于时点和监管。
        - id: recommendation
          label: 观察
          description: 在作出入场投资判断前，等待定价条款和工厂经济性。
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV009
      - CV011
      - CV013
      - CV014
      - CV015
