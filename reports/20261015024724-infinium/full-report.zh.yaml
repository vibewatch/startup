      - 假设
      - 估值／回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Roadrunner 接近所述的 2027 年目标启动，发起方资本持续到位，航空和化工客户从里程碑验证扩展到重复承购。
        - 上行空间来自公开市场充分反映商业 eFuel 稀缺性之前，项目多轮部署带来的价值。
        - 建设延误、承购集中度和融资里程碑仍可能打断爬坡。
        - 需要披露经济性，证明 Pathfinder 式验证可以盈利扩张。
      - - 基准
        - 商业可信度持续提升，但直到下一次投资判断窗口，价格和资本结构条款仍未披露。
        - 只要投资者保留选择权、不承诺一个无法检验的价格，这条路径仍可行。
        - 资本可能可得，但成本仍高，或结构高度复杂。
        - 与保留的公开记录最为一致。
      - - 悲观
        - 政策支持减弱、Roadrunner 延误，或与预先约定指标绑定的后续资本未能及时转化为扩张。
        - 由于缺乏价格透明度，市场将对一个长期扩张故事作投资判断，回报因此收缩。
        - 不透明债务、稀释和政策依赖，可能把一个强技术故事变成糟糕的入场机会。
        - 如果尽调无法填补当前估值和项目经济性缺口，这种情景最可能发生。
