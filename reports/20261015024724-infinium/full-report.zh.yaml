      - number: '8.3'
        title: 情景、尽调要求与投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Infinium 将今天的里程碑证明转化为可重复的规模化经济性：Roadrunner
              必须大致按计划启动，赞助方集团必须继续为扩张提供资金，航空和化工需求必须转化为持久的合同量。基准情景更温和：技术可信度持续提升，但投资者仍要等待更好的价格和资本结构条款透明度，才能评估回报。悲观情景不是产品逻辑虚假，而是项目进度、与指标挂钩的后续融资和对政策敏感的需求持续压缩可辩护结果的范围。围绕
              ReFuelEU、FuelEU Maritime、ETS
              和相关规则的游说活动进一步说明，价值创造仍依赖商业化时间和政策架构。因此，在收紧入场建议之前，最终尽调材料需要轮次经济性、债务条款、优先股堆叠和工厂层面单位经济性。
            claimRefs:
