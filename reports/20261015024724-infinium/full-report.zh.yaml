              - CR014
      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 需要监控的投资逻辑破坏触发点
            body: 如果 Roadrunner 延迟到其所述 2027 年交付窗口之后，如果低碳燃料政策支持在多座工厂上线前减弱，或者融资交易对手仍然可见但确切债务、定价和工厂经济性条款依旧不透明，投资逻辑都会明显恶化。
            calloutType: risk
            claimRefs:
              - CR002
              - CR010
              - CR013
              - CR014
          - type: callout
            title: 已经降低故事风险的因素
            body: Pathfinder 的运营、ISCC PLUS 认证和真实的商业客运航班分配，意味着 Infinium 已无需证明其燃料能走出实验室；下一步更难的是证明可重复、获得融资并有客户支持的规模化。
            calloutType: insight
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据提升了投资判断中“质量”一侧的可信度。2026 年，American Airlines 和 Infinium 宣布使用 Pathfinder 生产 eSAF 的商业客运航班；Mitsui 将运营工厂与
              Amazon、Borealis 等具名客户联系起来，并指出 IAG 和 American 是已承诺购买 Roadrunner 产品的买方。Brookfield、Mitsui 和与 DBJ
              相关的资本也进一步加深了融资支持。阻碍按价格入场判断的仍是价格背景缺失：保留的估值记录列出近期融资时间戳和 2026 年 4
              月上一轮融资标记，但没有披露轮次规模、投后价值、每股价格、稀释机制或优先权悬置。这种组合支持“跟踪”而非买入或回避，因为公司越来越像真实商业体，但入场算术仍不透明。
