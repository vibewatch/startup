      - number: '8.2'
        title: 融资背景与反方逻辑
        blocks:
          - type: paragraph
            body: >-
              正面逻辑很直接：Brookfield 的项目承诺、Mitsui 对 Series C 的参与以及 DBJ 对最新轮次的参与，都说明成熟资本提供方仍愿意为平台提供资金。估值上的反方逻辑同样重要。Caplight
              公开页面展示融资时间线和可比公司名称，但隐藏了实际估值数字；没有额外权限，也看不到申报文件。因此，投资者能看到外部兴趣，却无法检验当前价格是否已经计入 Roadrunner 计划中的 2027
              年产出、赞助方期权价值或承购需求的持久性。公司控制页面上的产品和气候定位叙事彼此一致，但仍是叙事支持，而不是价格支持。
