              - CO013
              - CO014
      - number: '1.5'
        title: 展示
        blocks:
          - type: callout
            title: 政策形成仍具有重大经济意义
            body: Infinium 的商业进展是真实的，但保留记录仍将其规模化与强制要求设计、项目融资和政策执行联系在一起，而不是与一个能自行披露收入的独立收入引擎联系起来。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留来源支持的市场定义，比泛泛的“清洁能源”故事更窄。Infinium 将 eSAF、eDiesel 和 eNaphtha
              定位为石油基航空煤油、柴油、燃料油和石脑油的即插即用替代品，面向车队更替或电气化较慢的航空、长途货运、海运和化工行业。因此，相关支出是现有流程中的液体燃料或原料替代，而不是飞机制造、充电基础设施或广义碳移除预算。这个边界很重要：采用逻辑与其说是创造新行为，不如说是在已经存在的传统燃料池中赢得采购。
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: 受约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              公开证据为航空市场提供了有用的自上而下边界，但没有完整的自下而上 TAM、SAM 和 SOM 链条。最强的外部视角是航空业现有燃料池：保留的 2026 年报道称，全球每年消耗近 100 billion
              gallons 航空燃料，并指出 SAF 仍不到全球航空燃料总用量的 1%，说明这是一个规模极大但渗透率仍很早期的品类。更窄的公司视角来自 Roadrunner 已披露的规模和时间表，以及 Pathfinder
              已有的商业化证明。这些视角显示真实的需求拉动和商业化进展，但没有披露将宏观需求转换为可辩护的公开 SAM 或 SOM 所需的价格、毛利率或合同条款。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
              - CM014
      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              不同分部的买方、使用方和付款方并不相同，这决定了各条业务线从兴趣转成预算需求的速度。在航空领域，使用方是航空燃料运营部门，直接买方是航空公司或燃料采购部门，付款方还可能包括希望减少差旅相关排放的企业，American
              Airlines 与 Citi 的合作结构正说明了这一点。在卡车运输、海运和化工原料领域，使用方是车队或工厂运营商，预算负责人则是传统燃料或原料采购部门。总体而言，Infinium
              已披露的商业化路径依赖少数大型交易对手，而不是广泛的交易型分销。
            claimRefs:
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              保留来源中的主要采用驱动因素包括政策压力、脱碳目标、SAF
              供应稀缺，以及能够使用现有发动机和基础设施。这些因素降低了行为改变门槛，也解释了为什么航空似乎是最主要的切入口。制约因素同样重要：这是资本密集型扩张，公开证据仍集中于有限的交易对手，保留来源没有披露
              Roadrunner 定价、最低量保护、工厂层面单位经济性或分部逐一的合同量。这些缺口并不否定市场机会，但使本章停留在受证据约束的市场判断，而不是高确信度的变现模型。
            claimRefs:
              - CM007
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 航空是记录最清晰的切入口
            body: >-
              保留来源提供了可用的航空市场边界、低于 1% 的 SAF 渗透率基准、已披露的 Roadrunner 产能目标和正在进行的 American Airlines 部署；相比之下，这一证据明显强于 Infinium
              对其他分部公开披露的证明。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: callout
            title: 变现透明度仍落后于市场透明度
            body: 本章可以论证一个广阔且有吸引力的市场边界，但无法建立高确信度的公开 SAM 或 SOM，因为保留来源仍缺少定价、最低量保护和单位经济性。
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境与替代方案集合
        blocks:
          - type: paragraph
            body: >-
              保留资料支持一个广泛但受证据约束的竞争格局。Caplight 将 Twelve、AIR COMPANY 和 Synhelion 列为 Infinium
              的可比公司，足以建立直接电制燃料同行集合，但不足以逐一比较每家同行当前的定价、部署或产品宽度。在这些具名同行之外，实际替代方案更清楚：生物基 SAF
              供应、传统石油燃料和原料，以及项目开发商自行建设或许可技术的路径。Infinium
              自身材料很重要，因为它将待完成的任务定义为面向航空、货运、海运和化工的即插即用脱碳；因此，任何能满足这些买方且不迫使其大幅更换发动机或基础设施的路径，都是相关竞争。
            claimRefs:
              - CP001
              - CP002
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP011
              - CP012
              - CP014
      - number: '3.2'
        title: 差异化、部署证明与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              Infinium 的已保留差异化更强地体现在商业化证明，而不是公开功能细节。产品页面声称 eSAF、eDiesel 和 eNaphtha 具备即插即用兼容性；American Airlines
              公告又提供了外部流程证明，说明产品通过 ASTM JetA 认证，可用于现有飞机和加油基础设施，并已完成一次使用 Pathfinder 生产 eSAF
              的商业客运航班。这一点重要，因为现状并非空白：石油巨头已经掌握运营基线，生物基 SAF 也在争夺同一航空采购预算。因此，当前资料更支持这样的判断：Infinium
              的优势是即插即用兼容性加运营现场证据，而不是一份相对具名同行的量化性能领先目录。
            claimRefs:
