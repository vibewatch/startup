            body: >-
              公开架构是一套燃料生产系统，而不是软件栈。公司和合作方描述显示，Infinium 将废弃二氧化碳、可再生电力、绿色氢气、专利催化剂、现场电解槽、实验室验证和交付物流组合成电转液流程。Pathfinder
              是关键成熟度锚点，因为它不仅被描述为示范资产，还被描述为持续运营的商业规模工厂，Infinium 负责建设、调试、运营和维护。2026 年 8 月 American Airlines
