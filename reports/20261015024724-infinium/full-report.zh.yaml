        title: 产品组合与客户流程
        blocks:
          - type: paragraph
            body: >-
              Infinium 的产品故事具体而非概念化：公司将三种电制燃料产品——eSAF、eDiesel 和
              eNaphtha——销售给已经消耗石油基航空煤油、柴油和石脑油的客户流程。最有力的已支持论点是兼容性。公司材料始终将 eSAF 和 eDiesel
              定位为即插即用替代品，可通过现有发动机和分销系统运行；航空、卡车运输、海运和化工买方不想承担车队或基础设施改造风险，这一点很重要。真正更具差异化的问题不是 Infinium
              卖什么分子，而是这些分子能否从试点叙事走向可重复交付量和合同经济性。
