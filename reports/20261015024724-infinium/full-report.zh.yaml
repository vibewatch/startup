chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              Infinium 将自己定位为一家私营脱碳平台，旗下有两个运营品牌：负责电制燃料的 Infinium Energy，以及负责热基础设施的 Infinium
              Edge。保留的产品页面始终把当前商业产品锚定在即插即用的 eSAF、eDiesel 和 eNaphtha 上，这些产品可用于现有运输和化工流程；第三方简介则将公司定位于加州
              Sacramento，并称其是早期商业化电制燃料生产商，而不是尚未发布产品的概念公司。后续章节据此可以把 Infinium 视为一家真实运营中的 eFuels
              开发商，旁边还有一个较新的计算基础设施平台；但现有证据不足以推断当前收入规模或业务分部构成。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: 领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息仍然有限。多个保留来源将 Robert Schuetzle 列为 CEO，AP Ventures 在 2021 年融资公告中补充称，公司于 2020
              年成立，核心技术由创始人研发了十多年。当前资料没有提供现任董事会名单、具名创始人或更完整的高管信息。因此，公开记录中的关键人物依赖度仍偏高：公司看起来由一位可识别的运营者领导，但外部投资者仍需直接核查创始团队延续性、董事会监督和继任梯队，不能仅凭赞助方质量假定这些控制机制存在。
            claimRefs:
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
      - number: '1.3'
        title: 融资路径与外部利益相关方
        blocks:
          - type: paragraph
            body: >-
              公开证据显示公司反复获得外部融资，也得到客户侧验证，但尚未形成清晰的当前资本结构图。AP Ventures 披露，2021 年 10 月公司完成 $69 million 融资，由 Amazon 的 Climate
              Pledge Fund 和 NextEra Energy Resources 子公司领投；DBJ 则表示其于 2025 年 1 月加入最新融资轮。Caplight 的公司公开页面还显示，公司有一笔日期为 2026
              年 4 月 13 日的公司融资，以及一笔日期为 2025 年 6 月 24 日的债务事件，但可访问页面没有公开金额或估值。与此同时，2026 年 American Airlines 公告和世界经济论坛简介指向
              American、Citi、Breakthrough Energy Catalyst 和 Brookfield
              等战略客户及融资方。这些信息支持公司具有商业相关性，但不足以形成可用于投资判断的所有权、稀释、项目债务条款或累计融资额视图。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO012
              - CO013
              - CO016
      - number: '1.4'
        title: 里程碑、政策依赖与待解决的更新缺口
        blocks:
          - type: paragraph
            body: >-
              Infinium 本轮更新最强的增量是运营证明。2024 年 3 月的 Pathfinder 公告确认 Corpus Christi 的首座商业规模运营电制燃料工厂；2026 年 8 月 American
              Airlines 公告则进一步推进到首次将 eSAF 交付至商业机场供应链，并分配给客运航班。这些都是后续章节可以复用的具体里程碑。另一面是政策敞口：LobbyFacts 显示，Infinium 在 2025
              年花费 €200,000-€299,999 游说欧盟，目标涉及 ReFuelEU Aviation、FuelEU Maritime、REDII、ETS 和 Energy Tax
              Directive。这并不否定产品故事，但说明市场形成仍高度依赖监管、强制要求和融资结构。公开来源仍未披露当前估值、累计融资额、收入、员工人数或交付量经济性，因此本章能建立的是有依据的身份基线，而不是完整的规模基线。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
