  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业化证明
        blocks:
          - type: paragraph
            body: >-
              保留的公开记录支持一条直接的变现逻辑：Infinium 销售实体低碳燃料产品，而不是软件或设备；其公开商业化证明与具名承购关系和产品部署里程碑相连。公司产品页面将 eSAF、eDiesel 和 eNaphtha
              描述为航空、重型运输、海运和化工终端市场的即插即用替代品。独立报道和航空公司联合公告进一步证明，Pathfinder 自 2023 年起运营，存在 Amazon 签约的重型运输使用场景，American
              Airlines 已在商业航班供应链中使用 Pathfinder 生产的 eSAF，并持有 Roadrunner
              的商业量承购协议。尚缺的仍是投资判断层：保留来源没有披露实际燃料价格、证书所有权、take-or-pay 机制或各产品线的年度交付量。
