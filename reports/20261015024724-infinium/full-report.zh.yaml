figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 保留记录显示，公司从 2020 年成立一路发展到商业工厂运营、融资更新，并完成首个使用 Infinium eSAF 的商业客运航班。
    data:
      items:
        - date: '2020'
          label: 公司成立
          detail: AP Ventures 称，Infinium 于 2020 年成立，核心技术由其创始人研发了十多年。
          tone: positive
        - date: '2021-10-27'
          label: 披露 $69M 融资
          detail: AP Ventures 宣布完成一轮 6,900 万美元融资，由 Amazon's Climate Pledge Fund 和 NextEra Energy Resources 的一家子公司领投。
          tone: positive
        - date: '2022-06-03'
          label: 欧盟透明度登记
          detail: LobbyFacts 显示，Infinium Operations, LLC 于 2022 年 6 月 3 日首次登记进入欧盟透明度登记册。
          tone: neutral
        - date: '2022-09-07'
          label: 记录欧盟政策会议
          detail: LobbyFacts 列出了一场聚焦 e-fuels 和 REDII 授权法案的委员会会议。
          tone: risk
        - date: '2023'
          label: Pathfinder 投产
          detail: American Airlines 2026 年的新闻稿称，Infinium 自 2023 年起就在 Pathfinder 生产可规模化的 eDiesel 和 eNaphtha。
          tone: positive
        - date: '2024-03-21'
          label: 宣布 Pathfinder 投入运营
          detail: Infinium 宣布，全球首座商业规模 eFuels 设施已在德克萨斯州科珀斯克里斯蒂运营。
          tone: positive
        - date: '2025-01-17'
          label: DBJ 加入最新融资轮
          detail: DBJ 公开披露参与 Infinium 最新一轮融资。
          tone: positive
        - date: '2026-04-13'
          label: 公开市场数据页面显示新的公司融资事件
          detail: Caplight 的公开页面列出了一轮日期为 2026 年 4 月 13 日的公司融资，但未提供金额或估值细节。
          tone: neutral
        - date: '2026-08-06'
          label: 首个使用 eSAF 的商业客运航班
          detail: American Airlines 和 Infinium 宣布，首次向商业机场交付 eSAF，用于商业客运航班。
          tone: positive
    claimRefs:
      - CO006
      - CO007
      - CO009
      - CO011
      - CO012
      - CO013
      - CO014
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 公开证据支持宽泛的市场边界和狭窄的已披露近期规模视角，但不足以构成完整的公开 TAM／SAM／SOM 层级。
    data:
      items:
        - label: 难减排边界
          value: aviation + trucking + maritime + chemicals
          note: 当前产品组合覆盖燃料和原料替代，而非单一终端市场。
          tone: neutral
          claimRefs:
            - CM001
            - CM009
        - label: 现有航空需求
          value: 100
          unit: bn gal/yr jet fuel
          note: 保留的 2026 年报道称，航空业每年使用近 1000 亿加仑喷气燃料。
          tone: neutral
          claimRefs:
            - CM004
        - label: 当前 SAF 渗透率
          value: <1%
          note: 体现相对于现有航空市场，采用仍处于多早期阶段。
          tone: risk
          claimRefs:
            - CM004
        - label: 当下商业验证
          value: Pathfinder operating
          note: 商业规模工厂已向卡车、塑料行业和一次商业 eSAF 航班供货。
          tone: opportunity
          claimRefs:
            - CM006
        - label: 近期已披露规模
          value: '>5'
          unit: m gal/yr eSAF
          note: Roadrunner 预计于 2027 年达到满产能目标并开始生产和交付。
          tone: opportunity
          claimRefs:
            - CM005
        - label: 更广泛的项目管线
          value: '>12'
          unit: projects
          note: 地理管线广度已公开，但合同量和经济性尚未公开。
          tone: warning
          claimRefs:
            - CM013
            - CM014
    approximationNotes: 该图混合了边界、渗透率、实际商业化和产能视角，因为保留的公开证据不足以支持单一自下而上的 TAM／SAM／SOM 构建。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM013
      - CM014
  - id: FP001
    title: 竞争定位图：商业化验证（X）vs 买方切换便利度（Y）
    type: quadrant
    summary: 仅使用保留公开证据的序数图；X 越高表示指定样本中的商业化验证越强，Y 越高表示在现有买方工作流中越容易采用。
    data:
      points:
        - label: Infinium
          x: 5
          'y': 5
          detail: 保留记录包括 Pathfinder 的运营产出、航空部署、Brookfield 支持和即插即用兼容性。
        - label: 直接 eFuel 同行
          x: 2
          'y': 3
          detail: Caplight 确认这些点名同行存在，但指定样本未保留其同等部署或定价验证。
        - label: 生物 SAF 替代品
          x: 4
          'y': 4
          detail: SAF 替代品类别已进入航空公司采购流程，但指定来源对供应商层面经济性的记录仍很少。
        - label: 石油燃料现状
          x: 5
          'y': 2
          detail: 现有燃料仍是运营基线，但与买方脱碳目标的契合度最低。
        - label: 内部建设／许可部署
          x: 2
          'y': 4
          detail: 许可和设备路径可以适配买方工作流，但指定样本未保留 Infinium 之外的部署验证。
        - label: 项目融资进入者
          x: 3
          'y': 3
          detail: Brookfield、DBJ 和既有投资者支持表明，只要政策驱动的需求仍具吸引力，资本就能为新进入者提供资金。
    approximationNotes: 坐标是指定样本中由证据支持的序数评分，而非实测市场份额或成本基准；同行披露稀少，限制了对 Infinium 之外对象的信心。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
      - CP011
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持实体燃料价值链和承购桥接，但不支持实际定价或利润率桥接。
    data:
      nodes:
        - label: 捕集 CO2
          detail: Pathfinder 使用邻近工业 CO2；Roadrunner 增加专用原料输送
        - label: 可再生电力
          detail: 区域风电和太阳能支持 Pathfinder；Roadrunner 增加 150 MW 长期风电安排
        - label: 绿色氢能
          detail: Roadrunner 已披露的成本结构包含一套 100 MW 电解槽系统
        - label: Infinium 加工与认证
          detail: Pathfinder 配备专利催化剂、现场实验室／物流，以及获 ISCC PLUS 认证的产出
        - label: 产品流
          detail: eSAF、eDiesel 和 eNaphtha 作为即插即用燃料／原料销售
        - label: 承购与交付
          detail: American Airlines、与 Amazon 相关的重型运输，以及其他航空／出口客户
      edges:
        - from: Captured CO2
          to: Infinium processing and certification
        - from: Renewable electricity
          to: Green hydrogen
        - from: Green hydrogen
          to: Infinium processing and certification
        - from: Infinium processing and certification
          to: Product streams
        - from: Product streams
          to: Offtake and delivery
    approximationNotes: 这是基于保留公开来源的流程与变现桥接，不是量化的毛利润瀑布图。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI007
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 保留的公开记录将 Infinium 描述为一套液化能源生产栈：通过工厂运营、验证和扩张项目，把碳和氢原料转化为合格的即插即用燃料。
    data:
      layers:
        - label: 原料
          items:
            - label: 废弃 CO2
              note: Carbon input cited across official and third-party descriptions
            - label: 可再生电力
              note: Electricity source for green hydrogen pathway
            - label: 绿色氢能
              note: Hydrogen input produced from renewable power
          outputs:
            - label: Carbon and hydrogen inputs for fuel synthesis
        - label: 转化化学
          modules:
            - label: 液化能源流程
            - label: 专利催化剂
          outputs:
            - label: Synthetic hydrocarbon fuel molecules
        - label: 运营资产
          items:
            - label: Pathfinder 项目
          modules:
            - label: 现场电解槽
            - label: 最先进实验室
            - label: 物流与交付机制
          outputs:
            - label: Commercial-scale production, validation, and distribution loop
        - label: 商业产品
          items:
            - label: eSAF
            - label: eDiesel
            - label: eNaphtha
          outputs:
            - label: Drop-in fuels for aviation, heavy transport, maritime, and chemicals
        - label: 资质与控制
          items:
            - label: ISCC PLUS 认证
            - label: ASTM JetA 批次测试
          outputs:
            - label: Existing-engine and airport-fuel-chain compatibility proof
        - label: 扩张闭环
          items:
