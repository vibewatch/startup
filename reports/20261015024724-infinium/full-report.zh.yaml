              公开记录足以显示真实资本形成，但不够紧密，无法支持对项目经济性进行高确信度判断。Dealroom 记录了 2024 年 9 月与 Brookfield
              相关的基础设施融资事件，公开页面只显示估值和融资区间；Caplight 记录了截至 2026 年 4 月的额外债务和公司融资里程碑；AP Ventures 的 2021 年公告则按每座工厂年产量接近 40
              million gallons 的目标说明资本需求。这些信号意味着项目投资强度高，且持续依赖外部资本。保留来源中的交易对手也较集中：American 是具名航空承购方，Citi 与 Scope 3
              结构相关，Brookfield、Breakthrough Energy Catalyst 和 HSBC 出现在 Roadrunner
              融资链中。这并不打破投资逻辑，但意味着融资关口未通过、承购关系调整或政策变现慢于预期，都会迅速冲击投资判断。
            claimRefs:
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
