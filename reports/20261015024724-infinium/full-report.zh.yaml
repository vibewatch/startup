      - number: '3.3'
        title: 分销能力、资本获取与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              公司在项目执行和资本获取上的能力，比隐性定价更难被取代。Brookfield 的承诺、其在 Series C 发行中的领投角色，以及 American
              的承购，都指向一种将战略客户与基础设施融资结合的商业化模式。2024 年 3 月的 Pathfinder 公告还称有十多个项目在开发中；LobbyFacts 则显示 Infinium
              正参与塑造低碳燃料采用经济性的政策和认证体系。这并没有消除竞争风险：DBJ 明确称 SAF 需求由监管驱动且结构性短缺，足以吸引更多进入者。因此，保留证据中的护城河主要来自执行和生态体系，而不是纯粹技术。
            claimRefs:
