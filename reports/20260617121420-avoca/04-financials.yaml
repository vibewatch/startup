- id: TI005
  title: Public Financial Evidence Gaps Table
  columns:
  - Missing Metric
  - Impact on Underwriting
  - Exact Diligence Path
  - Severity
  rows:
  - - Exact ARR (2025 and 2026 YTD)
    - Cannot size the company or validate growth rate without confirmed ARR
    - Request audited or management-prepared ARR schedule by month from inception through June 2026
    - Blocking
  - - ARR Growth Rate (YoY and QoQ)
    - Cannot validate the 25–100× valuation multiple without growth confirmation
    - Request quarterly ARR bridge including new ARR, expansion ARR, contraction, and churn
    - Blocking
  - - Gross Margin and COGS Breakdown
    - Cannot model profitability path or terminal margin without cost-of-delivery data
    - Request GAAP income statement (FY 2024, FY 2025, TTM 2026) with line-item COGS and gross profit
