- id: cost-structure-and-unit-economics
  title: Cost Structure, Gross Margin Drivers, and Unit Economics
  body: |-
    Avoca's cost of goods sold (COGS) has at least four identifiable components. First, AI inference costs: every inbound
    and outbound call runs on a large language model (voice/text), voice synthesis, and telephony infrastructure. As Avoca
    handles a growing volume of calls, AI infrastructure is the dominant variable COGS item. Second, Human-in-the-Loop (HITL)
    labor: the AI handles 80–85% of calls, with the remaining 15–20% escalated to North America-based CSRs. These HITL agents
    are Avoca-trained employees or contractors whose labor cost directly reduces gross margin. Third, implementation and onboarding
    labor: enterprise multi-location deployments require significant setup (dispatch rule configuration, CRM sync, business-rule
    training), creating upfront costs that may or may not be separately billable. Fourth, customer success and technical account
    management: the company emphasized post-sale support as a competitive differentiator, which implies dedicated CS headcount
    costs flow through COGS or immediately below it.

    The BLS reports the 2024 median annual wage for US customer service representatives at $42,830 ($20.59/hour). With benefits
    and overhead, fully-loaded cost per HITL CSR is estimated at approximately $55,000–$70,000 per year. For a platform handling
    large call volumes, HITL labor is a structurally meaningful COGS line unless the mix of AI-handled versus human-handled calls
    approaches 95%+.

    Gross margin for Avoca is not disclosed. Comparable vertical AI SaaS companies with a human-services component typically
    operate at 50–70% gross margin versus 75–85% for pure-software SaaS. Avoca's HITL model suggests its long-run gross margin
    target likely requires ongoing improvement in the AI automation rate (from 80–85% toward 90–95%) to release HITL labor costs.
    This creates a favorable long-term trajectory if AI capability continues to improve, but creates near-term margin compression
    relative to software-only comparables.

    Unit economics—specifically CAC, LTV, payback period, and NRR—are entirely unavailable from public sources. The founders
    noted that acquisition cost likely tracks enterprise sales cycles (estimated 3–9 months for multi-location accounts), and
    the HITL blog implies customer success investment is above-average. The positive indicators are strong: Avoca Coach case
    studies claim $29K recovery in 90 days at a single location, and Granite Comfort attributed 20% YoY revenue lift to Avoca.
    These customer outcomes are plausible input signals for high LTV, but they are company-selected examples and cannot substitute
    for cohort-level retention data.
