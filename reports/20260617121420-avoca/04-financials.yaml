callouts:
- id: KI001
  type: risk
  title: Valuation–ARR Mismatch Risk
  body: >-
    Avoca's $1B Series B valuation implies a 25–100× ARR multiple depending on where within the "eight-figure"
    range actual 2025 ARR falls. At the lower bound ($10M ARR), the 100× multiple is consistent only with
    category-defining hypergrowth. If 2026 growth decelerates, the market conditions that supported the 2026
    private AI premium may not persist at the next liquidity event. Investors should stress-test: if ARR growth
    falls to 50% YoY, what valuation does the company command at exit, and does it justify today's entry multiple?
  tone: risk
  claimRefs:
  - CI013
  - CI036

- id: KI002
  type: risk
  title: Jobs-Booked Target Is GMV, Not Revenue
  body: >-
    The $1B jobs-booked target for 2026 is a gross-value-of-bookings metric, not a statement of Avoca's platform
    revenue. Multiple press sources have reported this figure in ways that could be misread as Avoca revenue.
    Investors must treat it as a demand-flow signal, not as a revenue claim. The actual revenue Avoca earns from
    facilitating $1B in jobs depends on the subscription take rate, not on the jobs-booked volume itself.
  tone: warning
  claimRefs:
  - CI011
  - CI012
  - CI035

- id: KI003
  type: recommendation
  title: "Data-Room Checklist: Minimum Financial Verification Required"
  body: >-
    No investment underwriting is possible from public sources alone. Minimum required data-room items: (1) monthly
    ARR schedule from inception through June 2026 with NRR and GRR by vintage, (2) GAAP income statement with COGS
    breakdown and gross margin, (3) trailing 12-month cash-flow statement and current cash position, (4) ACV
    distribution and top-10 customer concentration, (5) full cap table with all security types and any secondaries,
    (6) standard MSA/order-form with cancellation terms. These items, not the public record, are the financial
    underwriting foundation.
  tone: neutral
  claimRefs:
  - CI030
  - CI033

