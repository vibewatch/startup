  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: exact ARR and growth rate
    missingEvidence: >-
      Avoca has not published exact ARR, quarterly ARR growth, or any audited financial statement. The
      "eight figures" disclosure bounds ARR in a 10× range ($10M–$99M) and cannot support valuation
      underwriting without further precision.
    whyItMatters: >-
      ARR and growth rate are the two most critical inputs for validating the 25–100× valuation multiple.
      Without confirmed ARR, any financial model is speculative.
    diligencePath: >-
      Request monthly ARR schedule from inception through June 2026, broken out by new ARR, expansion,
      contraction, and churn. Cross-reference with billing system exports.
    relatedQuestionRefs:
    - QI002
    - QI025

  - type: missing-source
    severity: blocking
    topic: gross margin and unit economics
    missingEvidence: >-
      No gross margin, COGS breakdown, NRR/GRR, CAC, payback period, or ACV distribution has been
      publicly disclosed by Avoca or any investor.
    whyItMatters: >-
      Without these metrics, it is impossible to assess capital efficiency, profitability path, or
      the compounding nature of the platform. The HITL service component creates structural margin risk
      that cannot be evaluated without actual figures.
    diligencePath: >-
      Request GAAP income statement (FY 2024, FY 2025, TTM 2026) with line-item COGS; request NRR and
      GRR by cohort; request fully loaded CAC by channel and payback period from CFO package.
    relatedQuestionRefs:
    - QI024
    - QI026
    - QI027

  - type: private-evidence-only
    severity: material
    topic: cash position and burn rate
    missingEvidence: >-
      Cash on hand, monthly burn rate, and runway are entirely unavailable from public sources. The
      headcount-based burn estimate ($20M–$35M annually) is an inference, not a confirmed figure.
    whyItMatters: >-
      Capital adequacy cannot be assessed without actual cash and burn data, making it impossible to
      evaluate whether the Series B is sufficient for the stated growth plan.
    diligencePath: >-
      Request balance sheet as of most recent month-end and trailing 12-month operating cash flow statement;
      request 18-month financial forecast with key assumptions.
    relatedQuestionRefs:
    - QI025

  - type: missing-source
    severity: material
    topic: customer concentration and ACV distribution
    missingEvidence: >-
      No ACV distribution or top-10 customer revenue concentration data is available. The majority of
