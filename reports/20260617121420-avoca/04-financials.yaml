- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict, Adverse Analysis, and Diligence Blockers
  body: |-
    The financial case for Avoca rests on three publicly supportable pillars: confirmed eight-figure ARR in 2025 (company claim,
    independently repeated), a $1B Series B valuation endorsed by Meritech, GC, and KP, and a growing book of named enterprise
    accounts including PE-backed operators with verified multi-location deployments. These form a credible but incomplete picture.

    The adverse center is disclosure limitation. An investor seeking to underwrite Avoca today cannot independently verify
    ARR growth rate, gross margin, burn rate, NRR/GRR, CAC, or payback period. The $1B jobs-booked target risks conflation
    with revenue. The valuation multiple (25–100× ARR) is justifiable only if growth is hyperbolic; there is no public evidence
    confirming whether 2026 ARR has grown materially from the 2025 base. The three churn drivers disclosed by the founders
    (customer unreadiness, dispatch configuration, ownership changes) are plausible and non-product-failure-related, but no
    cohort retention data exists to quantify their impact on the ARR base.

    Revenue quality is structurally uncertain: "eight-figure ARR" encompasses a 10× range ($10M–$99M), the HITL service component
    implies recurring cost of delivery that suppresses gross margin below software-only comparables, and enterprise concentration
    in PE-backed platforms creates exposure if a platform rolls up or consolidates vendors. All of these risks are resolvable in
    diligence but unresolvable from public information alone.

    The financial verdict is: Avoca has demonstrated real traction (confirmed ARR, named accounts, top-tier investors, verified
    case studies) but has not made the disclosures necessary for a financially rigorous investment assessment. The public record
    supports a company with plausible product-market fit and institutional validation but not yet a company that can be
    underwritten without a data room. The most important single number to verify is the 2025-to-2026 ARR growth rate; if
    growth is 2–3× annually, the current valuation is defensible. If growth has slowed materially, the premium multiple
    represents significant re-rating risk.
