- id: arr-traction-and-gmv-proxy
  title: ARR Claim, $1B Jobs-Booked Target, and Revenue vs. GMV Distinction
  body: |-
    Avoca confirmed in its April 27, 2026 Series B press release that the company "surpassed eight figures in annual recurring
    revenue" in 2025. The phrase "eight figures" bounds ARR strictly between $10,000,000 and $99,999,999. The company has not
    disclosed a more precise figure in any public source reviewed. The IntelligentCIO coverage, Yahoo Finance syndication, and
    TheSaaSNews recap all repeat the "eight figures" phrasing without independent verification.

    The $1 billion jobs-booked target is a gross-value-of-bookings metric—it represents the sum of all job contract values booked
    through Avoca's platform, not Avoca's own revenue. Avoca earns a subscription and service fee from the operators who use its
    platform; those operators retain the job revenue. The distinction is commercially significant: $1B GMV through a platform
    earning, say, 3–5% take rate would represent $30–$50M in platform revenue, while $1B in jobs booked in no way implies $1B
    in Avoca revenue. Several press reports have noted the target in ways that could be misread as Avoca's revenue target;
    investors must treat these as GMV signals, not revenue confirmation.

    Given the enterprise multi-location contract structure and >50% penetration of the top 30 PE-backed platforms, a rough
    revenue estimate can be constructed: if each of the ~15 top-tier enterprise accounts contributes $300K–$700K annually and
    the remaining customer base adds smaller contract contributions, a total ARR in the $15–$40M range by mid-2026 is plausible.
    This is an estimate with no public confirmation, and should be treated as a scenario-planning input rather than a fact.

    The implied valuation multiple at different ARR scenarios illustrates the risk. At $10M ARR, the $1B Series B valuation
    implies 100× ARR—a premium achievable only in category-defining, hyper-growth AI companies. At $25M ARR the multiple
    falls to 40×; at $40M, to 25×. These multiples are above public-market vertical SaaS peers but in range for top-tier
    private AI infrastructure rounds in 2025–2026. The investor base (Meritech, GC, KP, Amplify) is consistent with underwriting
    at such multiples if growth trajectory supports it.

    No updated ARR figure has been published since the April 2026 announcement, and no audited financials are available.
