company:
  name: Avoca
chapter:
  number: 4
  title: Financials
  summary: >-
    Avoca's financial picture is materially constrained by limited public disclosure. The company
    confirmed eight-figure 2025 ARR (≥$10M) in its April 2026 Series B announcement and set a 2026
    target of booking $1 billion in jobs—a gross-value proxy, not platform revenue. The $1B Series B
    valuation implies a 25–100× ARR multiple depending on where in the eight-figure band actual ARR
    falls, requiring exceptional growth to justify. Revenue streams span AI-voice inbound, outbound
    campaigns, Avoca Coach analytics, and a Human-in-the-Loop (HITL) service tier. Cost structure
    includes AI inference, HITL labor, implementation, and customer success. Gross margin, burn rate,
    NRR/GRR, CAC, and per-customer ACV are not publicly available; no financial underwriting is
    possible without data-room access. The adverse risk center is the disclosure gap: investors cannot
    verify whether the "eight figures" ARR is growing or at risk, and the $1B jobs-booked target risks
    being misread as Avoca revenue.

sections:
- id: revenue-model-and-streams
  title: Revenue Model, Pricing Posture, and Revenue Streams
  body: |-
    Avoca is a SaaS-first platform with no publicly accessible pricing page (avoca.ai/pricing returns a 404 as of June 2026),
    consistent with an enterprise sales-led go-to-market motion rather than self-serve. Pricing is set through direct sales,
    and contracts are negotiated at the account or multi-location level. The platform segments into at least four revenue-generating
    modules: Avoca Inbound (AI voice for inbound call handling), Avoca Outbound (multi-touch SMS and voice drip campaigns), Avoca Coach
    (call scoring and analytics), and the Human-in-the-Loop (HITL) service tier that backstops AI with trained human CSRs for escalated calls.

    The structural revenue model is a platform subscription, most likely tiered by location count or call volume, with potential add-on fees
    for HITL minutes consumed and for the Coach analytics module. Because pricing is undisclosed, estimates of average contract value
    rest on indirect evidence: the company's founder blog notes that operators previously spent "$500,000+ annually" on traditional CSR
    staffing or offshore answering services, which establishes the upper bound of what Avoca can charge without exceeding its ROI
    proposition. Competitive pricing context places AI-only alternatives at $49–$199/month for solo operators (Rosie AI, GoodCall) and
    $285–$1,000+/month for hybrid human-AI services (Smith.ai), suggesting Avoca's enterprise contracts sit meaningfully above these
    entry-level benchmarks.

    Avoca's sales motion aligns with its customer profile: multi-location PE-backed platforms where a single contract can span 5–50+
    locations simultaneously. The Nexstar Network partner relationship provides an independent channel through the distributor's
    contractor membership base, reducing reliance on field sales for mid-market accounts. The enterprise GTM also implies a longer
    average sales cycle, higher implementation cost, and more complex revenue recognition than a self-serve SaaS.

    Revenue recognition for a subscription-plus-service model like Avoca is likely recognized monthly as service is delivered
    (consistent with ASC 606), with implementation fees potentially recognized over the onboarding period. None of these
    accounting details have been publicly disclosed, so the revenue quality assessment relies entirely on structure-level inference.
