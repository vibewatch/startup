  - id: TU006
    title: Adverse Signals and Evidence-Quality Assessment
    columns:
      - Signal / Gap
      - Type
      - Severity
      - Evidence Base
      - Investor Implication
    rows:
      - - All published case studies are company-authored
        - Testimonial selection bias
        - Material
        - G2 / Capterra / Trustpilot not publicly accessible; no independent reviews found
        - Outcomes may over-represent best deployments; request independent customer references
      - - No aggregate customer count disclosed
        - Missing metric
        - Material
        - No public filing or press mention of total account count
        - Cannot assess penetration, cohort trends, or churn denominator
      - - No NRR / GRR disclosed
        - Missing metric
        - Blocking (for valuation judgment)
        - No third-party confirmation of retention quality
        - Core SaaS durability metric absent; request in diligence
      - - Outbound AI calling subject to TCPA consent requirements
        - Regulatory / legal risk
        - Material
        - FCC February 2024 Declaratory Ruling (FCC 24-17)
        - Customers deploying Speed-to-Lead / Outbound without proper consent flows face TCPA liability
      - - PE concentration — single decision removes multiple brands
        - Customer concentration risk
        - Material
        - Co-founders acknowledge preferred-vendor displacement as recurring churn
        - If top-3 PE platforms represent >30% of ARR, single event drives material revenue decline
      - - AI trust dilemma — consumer-facing deception risk
        - Reputational / regulatory risk
        - Minor (managed by Human-in-the-Loop)
        - HomePros interview; FCC ruling references consumer protection context
        - State-level AI disclosure laws emerging; Avoca's transparency framing may need updating
    notes: >
      Severity ratings reflect their potential impact on investor judgment, not
      operational urgency. The "blocking" rating on NRR/GRR reflects the impossibility
      of a well-grounded valuation without retention data, not an imminent business risk.
    claimRefs:
      - CU026
      - CU028
      - CU036
      - CU041
      - CU042
      - CU043

figures:
  - id: FU001
    title: Customer Journey Map — Segment Pathways and Expansion Loops
    type: journey-map
    layout: wide
    summary: >
      Six journey nodes map the path from initial discovery through PE portfolio rollout;
      PE multi-brand platforms are the highest-leverage expansion node.
    data:
      nodes:
        - id: discovery
          label: Discovery
          detail: Trade show, ServiceTitan ecosystem, peer referral, or PE platform requirement drives first contact
        - id: demo
          label: 20-Minute Demo
          detail: Avoca demos inbound call handling with ROI framing against missed-call cost; no-commit entry point
        - id: pilot
          label: Pilot / FDE Onboarding
          detail: Forward Deployed Engineer travels onsite; configures AI to match business logic and CSR workflows
        - id: go-live
          label: Go-Live Production
          detail: Inbound Responder handles 24/7 calls; Coach monitors quality; customer iterates in real time
        - id: expand
          label: Module Expansion
          detail: Customer adds Outbound, Speed-to-Lead, Human-in-the-Loop, Simple Scheduler, or Web Chat
        - id: portfolio-rollout
          label: PE Portfolio Rollout
          detail: PE platform extends successful brand deployment across remaining portfolio companies; multiplier effect on ARR
    approximationNotes: >
      Journey stages and node descriptions are inferred from publicly disclosed case
      studies and blog content; formal sales-process documentation is not public.
    claimRefs:
      - CU025
      - CU034
      - CU035
      - CU038
      - CU039

  - id: FU002
    title: Adoption and Deployment Flow — Discovery to Portfolio Rollout
    type: flow
    layout: standard
    summary: >
      Discovery-to-portfolio-rollout flow for Avoca customers; the PE platform rollout
      node multiplies brand reach from a single sales motion.
    data:
      nodes:
        - id: lead
          label: Inbound Lead / Demo Request
          detail: Operator contacts Avoca via trade show, referral, ServiceTitan partner page, or direct outreach
        - id: demo
          label: Discovery Demo (20 min)
          detail: Conversion rate not disclosed; ROI framing emphasizes missed-call cost
        - id: pilot
          label: Pilot Deployment
          detail: FDE onsite; typically single brand or single channel; weeks to first bookings
        - id: golive
          label: Go-Live (AI CSR)
          detail: Inbound Responder live 24/7; Coach scoring active; customer feedback loop begins
        - id: expand
          label: Multi-module Expansion
          detail: Case studies show 3–4 Avoca modules per mature account
        - id: pe-rollout
          label: PE Portfolio Rollout
          detail: Avoca live in >50% of top-30 PE platforms; acquisition brings new brands automatically
      edges:
        - from: lead
          to: demo
          label: Demo booked
        - from: demo
          to: pilot
          label: Pilot agreed (conversion rate undisclosed)
        - from: pilot
          to: golive
          label: FDE completes configuration; typically weeks
        - from: golive
          to: expand
          label: Operator adds modules as ROI proven
        - from: expand
          to: pe-rollout
          label: PE platform decision to roll out across portfolio
    approximationNotes: >
      Conversion rates between stages are not publicly disclosed. Stage values are
      qualitative labels or company-stated aggregate claims, not verified funnel metrics.
    claimRefs:
      - CU022
      - CU025
      - CU032

