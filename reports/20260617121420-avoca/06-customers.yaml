  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Driver / Risk
      - Type
      - Impact
      - Current Evidence
      - Diligence Path
    rows:
      - - PE platform land-and-expand
        - Expansion driver
        - High (single account = multiple brands)
        - "Avoca deployed in >50% of top-30 PE platforms; Sila (40+ brands), Granite (9 brands)"
        - Request ARR split between PE platforms and independent SMBs; verify expansion rate per platform
      - - Acquisition-driven rollout
        - Expansion driver
