  - id: onboarding-and-partner-distribution
    title: Onboarding Model and Partner-Assisted Distribution
    body: >
      Avoca's customer acquisition and onboarding process relies on a Forward Deployed
      Engineer (FDE) model in which a technical staff member travels onsite to each new
      customer before and during deployment. The FDE extracts the operational details that
      differentiate each business — booking logic, seasonal protocols, membership tiers,
      emergency routing — and builds those rules directly into the AI deployment. Avoca
      reports that this model compresses feedback loops from weeks to same-day
      configuration changes. One reference customer, Yost & Campbell, went from daily
      escalation calls to weekly check-ins after the first 30 days. The ServiceTitan
      integration partnership is Avoca's most significant channel mechanism: since
      ServiceTitan is the dominant field service management platform for HVAC and
      plumbing businesses, Avoca's tight integration creates a natural distribution
      pathway inside the ServiceTitan ecosystem. The referral program (Refer & Earn) and
      formal partner program offer additional inbound leads from trade associations,
      insurance networks, and peer operator referrals. For PE platforms, the land-and-expand
      pattern is accelerated by acquisition: when a PE-backed platform acquires an
      independent Avoca customer, the platform typically reviews performance data and rolls
      the deployment out across additional portfolio brands. Rescue Air's PE deal process
      illustrates the inverse: buyers saw Rescue Air's AI deployment as a scalable playbook
      and priced that capability into the acquisition multiple.
    claimRefs:
      - CU025
      - CU030
      - CU031
      - CU034
      - CU035
      - CU039
    tableRefs:
      - TU005
    figureRefs:
      - FU003

  - id: retention-satisfaction-durability
    title: Retention, Satisfaction, and Durability Signals
    body: >
      Avoca does not publicly disclose aggregate net revenue retention, gross revenue
      retention, or churn rates. No third-party retention benchmark is available. The
      public record offers only indirect signals. Case studies from HL Bowman (93% AI
      satisfaction score), Sila Services (near-zero abandonment), and Rescue Air (ongoing
      multi-product deployment) suggest that customers who complete deployment tend to
      retain. The Aire Serv Sevierville case study reports a 90% booking rate maintained
      after switching from live answering to Avoca, which is an indirect durability signal.
      Avoca's co-founders stated in an April 2026 interview that three categories account
      for most churn: operators whose back-office processes were not ready for AI, cases
      where dispatch and capacity logic was misconfigured at go-live, and ownership changes
      when a PE acquirer brings a preferred vendor. Churn attributable to the AI simply
      failing to perform its job is, per the co-founders, rare. Customers who iterate
      actively — sending feedback in near real-time — appear to achieve substantially
      higher booking rates than those who treat deployment as a set-and-forget installation.
      The absence of independent cohort or NRR data is a material diligence gap; investors
      cannot rely on the company's own retention framing without corroboration.
    claimRefs:
      - CU013
      - CU022
      - CU026
      - CU029
      - CU033
      - CU036
    tableRefs:
      - TU004

  - id: adverse-analysis-evidence-gaps
    title: Adverse Analysis and Evidence Gaps
    body: >
      Several structural concerns constrain the evidentiary quality of Avoca's customer
      record. First, all published outcome data originates from Avoca-produced case studies
      and a co-founder interview; no independently authored reviews appear on G2, Capterra,
      or Trustpilot in publicly accessible form as of mid-2026. This limits triangulation
      and creates testimonial-selection bias: the cases chosen for publication reflect the
      most favorable deployments. Second, Avoca's outbound AI calling operations — including
      Speed-to-Lead and Outbound Campaigns — are subject to the FCC's February 2024
      Declaratory Ruling confirming that TCPA restrictions on artificial or prerecorded
      voice apply to AI-generated voice calls. Consent compliance adds operational friction
      and creates liability for customers who deploy outbound features without proper consent
      flows. Third, the concentration of Avoca's strategic value in PE-backed multi-brand
      platforms creates a two-sided risk: a single PE platform decision to switch vendors
      can immediately remove multiple brands. The co-founders acknowledged that losing an
      acquired company when its PE buyer has a preferred vendor is a recurring churn
      vector. Fourth, Avoca has not disclosed an aggregate customer count, making it
      impossible to assess penetration, cohort trends, or true market share from the public
      record. Fifth, the deployment model's dependence on high-touch FDE onboarding may
      limit the speed of new customer acquisition as the company scales.
    claimRefs:
      - CU026
      - CU028
      - CU036
      - CU041
      - CU042
      - CU043
    tableRefs:
      - TU006

