callouts:
  - calloutType: strength
    title: PE Platform Distribution — High-LTV Land-and-Expand Engine
    body: >
      Avoca's deployment in over half of the top 30 PE-backed home-service platforms
      creates a compounding distribution advantage. When a PE platform acquires a new
      brand, Avoca has a documented pattern of rolling out to that brand without a new
      sales cycle. This "acquisition-as-distribution" dynamic means Avoca benefits from
      the continued consolidation of the home-services industry by private equity —
      a secular trend that is independent of Avoca's own sales motion.
    claimRefs:
      - CU025
      - CU031
      - CU041

  - calloutType: risk
    title: Testimonial Bias and Retention Data Absence
    body: >
      All publicly available customer evidence originates from Avoca-produced case studies
      or co-founder interviews. No independent reviews, third-party audits, or public
      retention metrics (NRR, GRR, churn) exist in the verifiable record. This creates a
      structural inability to independently assess customer durability, satisfaction at
      scale, or the representativeness of highlighted outcomes. Investors must treat all
      stated outcomes as illustrative rather than audited KPIs and request verified
      retention data as a prerequisite for valuation confidence.
    claimRefs:
      - CU036
      - CU042
      - CU043

