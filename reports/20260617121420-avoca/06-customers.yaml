chapter:
  number: 6
  title: Customers
  summary: >
    Avoca's publicly named customer base spans six home-service verticals and includes
    both independent SMBs and large PE-backed multi-brand platforms, with Sila Services
    (40+ brands) and Granite Comfort (9 brands) as the highest-profile deployments. Case
    studies cite a 20% year-over-year revenue lift at Yost & Campbell, 90% call-volume
    automation at Sila, and 70% revenue growth at HL Bowman, but all evidence is
    company-produced; no independent reviews or public retention metrics exist.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: >
      Avoca serves two structurally distinct customer archetypes within the home-services
      market. The first is the independent small-to-medium business (SMB) operator running
      a single-brand HVAC, plumbing, electrical, pest control, garage-door, or general
      contracting company. These operators typically deploy Avoca to replace or augment a
      small in-house CSR team, capturing calls they currently miss and reducing reliance
      on after-hours answering services. The second — and strategically more important —
      archetype is the PE-backed multi-brand platform that operates dozens of acquired
      brands under a shared operating model. For PE platforms, Avoca delivers value at
      two levels: each acquired brand gets immediate call-handling automation, and the
      platform leadership gains a single analytics view across all brands that was
      previously impossible with decentralized CSR teams. Avoca's co-founders have
      disclosed that the company is live and deployed in over half of the top 30 PE-backed
      home-service platforms in the United States, making PE-assisted distribution a core
      growth lever. The geographic focus is overwhelmingly domestic US, matching the
      concentration of mature home-services private equity activity in the Northeast,
      Southeast, Southwest, and Midwest. Internationally, no active deployments are
      disclosed.
    claimRefs:
      - CU025
      - CU027
      - CU038
    tableRefs:
      - TU001

  - id: named-customer-proof
    title: Named Customer Proof and Deployment Evidence
    body: >
      Avoca's public website enumerates at least six named customer case studies, each
      describing a production deployment with quantified outcomes. Sila Services, the
      largest publicly known customer, operates more than 40 HVAC, plumbing, and
      electrical brands across the Northeast and Midwest, with 3,000-plus employees and
      1,200 technicians. Sila reports that Avoca handles approximately 90% of inbound
      call volume across live brands and performs within 2% of Sila's top CSRs on complex
      calls. Granite Comfort, a nine-brand PE-backed HVAC and plumbing platform, deployed
      Avoca Responder, Coach, and Human-in-the-Loop across all nine brands in late 2025,
      collapsing nine separate call centers into one. Pilot brand Yost & Campbell grew
      revenue 20% year-over-year from calls Avoca captured that were previously lost.
      HL Bowman achieved 70% revenue growth and reduced cost per conversion from $350 to
      $215. My Plumber Plus, with $129 million in annual revenue, deployed Avoca for
      overflow calls and reported a 17% improvement in booking rate. Call Dad achieved
      78% AI call handling and reported that 70%-plus of booked jobs fall in the
      highest-margin repair category. Rescue Air & Plumbing in Dallas–Fort Worth, one of
      Avoca's earliest customers (deployed approximately 2022–2023), promoted two CSRs
      into management roles from Coach insights. All outcome data originates from
      company-produced case studies; no independent audit of these figures has been
      identified in the public record.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU009
