  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention
      missingEvidence: Net revenue retention rate, gross revenue retention rate, and per-cohort churn rate broken down by customer segment and deployment tenure
      whyItMatters: Without retention data, the durability of Avoca's recurring revenue is unverifiable; all valuation models require an NRR assumption that cannot be grounded in public evidence
      diligencePath: Request in formal diligence from management; ask for monthly cohort data going back to 2023 separated by SMB vs. PE platform segments
      relatedQuestionRefs:
        - QU020
        - QU005

    - type: missing-source
      severity: material
      topic: customers
      missingEvidence: Aggregate active customer count broken out by segment (independent SMB vs. PE platform) and geography
      whyItMatters: Without a denominator, it is impossible to assess market penetration, churn rate as a percentage, or the representativeness of the six published case studies
      diligencePath: Request directly from management; cross-check against Tracxn / PitchBook for any public disclosures
      relatedQuestionRefs:
        - QU005
        - QU020

    - type: missing-source
      severity: material
      topic: independent-reviews
      missingEvidence: Independent customer reviews on G2, Capterra, Trustpilot, or equivalent platform with a minimum of 10 verifiable reviews
      whyItMatters: All published customer evidence is company-authored; independent reviews would surface deployment failures, service-quality concerns, and negative experiences absent from Avoca's curated case studies
      diligencePath: Monitor G2 and Capterra for new reviews post-funding; request a customer reference list for direct diligence calls
      relatedQuestionRefs:
        - QU017
        - QU016
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: pe-platform
      missingEvidence: Top-10 customer concentration data — specifically what share of ARR or call volume is attributable to the largest 1, 3, and 5 accounts
      whyItMatters: If a single PE platform represents more than 10–15% of ARR, a vendor-switch decision following a portfolio reconfiguration would have a material financial impact
      diligencePath: Request from management; cross-reference with known deployments at Sila Services and Granite Comfort as starting points
      relatedQuestionRefs:
        - QU019
        - QU005
      relatedTableRefs:
        - TU005

    - type: missing-source
      severity: minor
      topic: trade-associations
      missingEvidence: Formal endorsement or membership data from home-services trade associations such as Nexstar Network or ACCA, and confirmation of ServiceTitan co-selling or preferred-partner status as of 2026
      whyItMatters: Trade-association partnerships can be significant distribution channels in the home-services industry; their presence or absence would inform channel strategy assessment; the state of the ServiceTitan relationship in 2026 affects distribution runway
      diligencePath: Check Nexstar and ACCA member benefit pages; ask Avoca directly about formal association relationships and ServiceTitan co-sell terms
      relatedQuestionRefs:
        - QU015
        - QU027

