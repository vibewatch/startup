  data:
    layers:
    - label: Customer input channels
      detail: >-
        Inbound voice calls (24/7), SMS/text, web chat, email, Google LSA leads, Yelp/Angi/Thumbtack/Facebook
        web form leads — all ingested into the Avoca platform via telephony and lead-intake APIs.
    - label: AI conversation engine (undisclosed stack)
      detail: >-
        Core LLM and voice synthesis layer handling natural-language understanding, intent classification,
        objection handling, and response generation. Underlying model vendor is not publicly disclosed.
        Webhook events: call.completed, sms.received, chat.started, speed_to_lead.completed.
    - label: Operator configuration and knowledge base
      detail: >-
        Per-operator dispatch rules, priority tiers (P1/P2/P3), persona and tone settings, job type taxonomy,
        booking logic, seasonal protocols, and emergency-routing scripts. Configured by Forward Deployed
        Engineers on-site; updatable same-day via configuration pushes.
    - label: CRM integration and scheduling layer
      detail: >-
        Real-time bi-directional sync with 40+ FSM/CRM platforms (ServiceTitan deep integration; also
        Jobber, HouseCallPro, Salesforce, Zoho, Service Fusion, and others). Reads live capacity, syncs
        12+ customer data fields per call, books jobs directly. Webhook: appointment.scheduled.
    - label: HITL service layer
      detail: >-
        Warm-transfer to North America-based Avoca-trained CSRs for 15–20% of escalated calls. Full
        AI-context handoff in <3 seconds. CSRs trained specifically on Avoca platform and home-services
        scenarios. Webhook: call.completed with escalation flag.
    - label: Analytics and coaching layer
      detail: >-
        Coach scores every call against operator rubric (objection handling, process adherence, tone,
        booking outcome). Call reclassification identifies misrecorded outcomes. Unified analytics dashboard
        for multi-location portfolio visibility. Webhook: coach.score_available.
    - label: Operator dashboard and API layer
      detail: >-
        Dashboard for operators and managers (live capacity view, task routing, coaching reports).
        REST API with Node.js/TypeScript and Python SDKs at docs.avoca.ai. Custom integrations via
        documented integration playbook. Status monitoring at status.avoca.ai.

- id: FE002
