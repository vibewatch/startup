    - id: job-booked
      label: Job booked in CRM
      detail: Job appears on dispatch board with correct job type, customer data, and technician slot; P1
        overrides lower-priority slots as needed
    - id: coach-scoring
      label: Coach scores call
      detail: Every call scored post-completion on objection handling, process adherence, tone, and booking
        outcome; reclassification flags misrecorded "not interested" outcomes
    - id: intelligent-task-routing
      label: Intelligent task routing
      detail: AI generates summary and routes high-value call types to appropriate team member (installs →
        inside sales; replacement leads → sales team; dropped calls → instant follow-up)
