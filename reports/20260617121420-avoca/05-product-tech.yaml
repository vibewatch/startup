- id: integration-and-deployment-architecture
  title: Integration Architecture, Deployment Model, and API Surface
  body: |-
    Avoca's integration layer supports 40+ field-service management (FSM) CRMs, including ServiceTitan,
    HouseCallPro, Jobber, Salesforce, Zoho, Service Fusion, BuildOps, Service Autopilot, Sera, Workiz,
    BigChange, and dozens of others across HVAC, plumbing, pest control, garage door, roofing, and
    electrical verticals. The ServiceTitan integration is deepest: Avoca maintains a dedicated ServiceTitan
    partner page, a co-branded product suite, a joint partnership program, and is featured on ServiceTitan's
    own blog as a primary example of AI voice automation for HVAC contractors. ServiceTitan is the dominant
    FSM in the trades, which means Avoca's deepest integration aligns with the largest potential customer
    concentration.

    The deployment model is anchored on a "Forward Deployed Engineer" (FDE) role: an Avoca engineer goes
    on-site to learn how the operator's dispatch board is actually used, how booking logic works, seasonal
    protocols, and how their best CSRs handle edge cases — then builds the deployment to those specifics.
    The stated philosophy is: "We don't onboard you to Avoca. Avoca onboards to you." Feedback loops from
    on-site deployment to config change are described as same-day — "ship at night, call in the morning,
    get a customer's screenshot by 4 PM, push a config change by 6 PM." This rapid iteration model is
    consistent with a SaaS configuration layer where AI behavior is governed by operator-specific rules and
    knowledge bases rather than compiled pipeline code. The docs also confirm "tornado protocols for certain
    regions, different routing logic for sales vs. service, filtering by membership tier" as examples of
    operator-specific customization.

    For developers and system integrators, docs.avoca.ai exposes a REST API covering all product modules.
    The API reference documents webhook events for call.completed, appointment.scheduled, sms.received,
    chat.started, speed_to_lead.completed, and coach.score_available; official SDKs are available for
    Node.js/TypeScript and Python. A custom-integration playbook at docs.avoca.ai/custom-integration
    covers technical architecture, API specifications, data exchange and booking process, and AI behavior
    customization. This signals an intent to support enterprise integrators who want to embed Avoca's
    capabilities into third-party platforms or proprietary CRMs.
