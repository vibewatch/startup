    AI handling, optional HITL escalation, CRM booking, and post-call coaching. Illustrates the priority
    routing and context-preservation mechanisms central to Avoca's value proposition.
  approximationNotes: >-
    Transfer times, field counts, and escalation percentages are company-claimed from product pages and HITL
    blog. No independently verified SLA or accuracy metrics are available.
