- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Key Dependency
  - Observable Risk
  rows:
  - - AI voice / conversation engine
    - Handles natural-language inbound and outbound calls; classifies intent; drives booking logic
    - Underlying LLM and voice synthesis provider(s) — not publicly disclosed
    - Vendor concentration in foundation model; prompt injection or hallucination on edge-case calls
  - - Telephony infrastructure
    - Routes calls to AI or HITL; provides <3s warm-transfer; supports 24/7 operation
    - Cloud telephony provider (e.g., Twilio or equivalent) — not explicitly disclosed
    - Telephony uptime is the availability floor for the entire Inbound product
  - - CRM integration layer
    - Syncs 12+ data fields per call; books jobs in real time; reads live capacity
    - 40+ FSM/CRM vendors; ServiceTitan is dominant; CRM API terms govern access
    - API deprecation or access restriction by CRM vendor could break booking workflow
  - - Operator configuration system
    - Stores booking logic, dispatch rules, priority tiers, persona, and tone per operator
    - Forward Deployed Engineers configure; config errors cause AI misbehavior
    - Configuration quality drives AI call quality; not a self-serve onboarding
  - - HITL service layer
    - North America-based human CSRs receive warm transfers for 15–20% of escalated calls
    - Avoca-trained CSR team; labor cost scales with call volume and escalation rate
    - HITL labor is margin-compressing variable cost; dependency on hiring/training velocity
  - - Coach / analytics layer
    - Scores every call; reclassifies outcomes; surfaces CSR coaching data to managers
    - AI scoring model trained on company-defined rubric; no third-party validation
    - Model accuracy undisclosed; rubric dependency means quality varies by operator
  - - REST API and webhook layer
    - Enables third-party and custom integrations via Node.js/TypeScript and Python SDKs
    - docs.avoca.ai API surface; webhook events for all major platform events
    - No public versioning or deprecation policy; integration stability risk for custom builds
  - - Status and monitoring
    - status.avoca.ai monitors Dashboard, Inbound, Outbound, Analytics, Omnichannel
    - Public status page with no published SLA percentages or historical availability report
    - No public uptime guarantee; enterprise operators cannot independently verify availability
  notes: >-
    Architecture inferred from docs.avoca.ai API reference, product pages, HITL blog, and FDE blog. Specific
    technology vendors (LLM, telephony, cloud) are not publicly named by Avoca. All dependency assessments
    are inferences from observable product behavior and public documentation, not confirmed architecture disclosures.
