chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Avoca's product suite comprises seven distinct workflow surfaces — AI CSR (inbound voice 24/7), Outbound
    Campaigns, Speed-to-Lead, Simple Scheduler, Web Chat, Google LSA, and Coach — plus a Human-in-the-Loop
    (HITL) service tier that backstops 15–20% of escalated calls. The AI CSR handles 80–85% of inbound calls
    autonomously, warm-transfers escalations to North America-based CSRs in under 3 seconds, and syncs 12+
    CRM data fields per call with zero manual entry. The platform integrates with 40+ field-service CRMs,
    most deeply with ServiceTitan. A three-tier priority dispatch system (P1 emergencies / P2 replacements /
    P3 maintenance) enables capacity-aware scheduling from live CRM data. Coach adds AI call scoring, call
    reclassification (identifying misclassified "not interested" outcomes), and team analytics. An official
    REST API with Node.js and Python SDKs, webhook event support, and a custom-integration playbook are
    documented at docs.avoca.ai. The observable architecture is cloud-native SaaS telephony with real-time
    CRM sync; the underlying LLM and voice-synthesis stack are not publicly disclosed. Critical risks include
    dependence on ServiceTitan API access, absence of publicly confirmed security certifications (SOC 2, ISO
    27001), TCPA exposure for outbound AI-generated voice calls under FCC 24-17, and no published independent
    performance benchmarks.

sections:
- id: product-portfolio-and-module-map
  title: Product Portfolio, Module Map, and Positioning
  body: |-
    Avoca markets itself as the "AI front office" for home-service businesses. As of June 2026 the public
    product surface spans seven distinct workflow modules: (1) AI CSR — an inbound-call AI agent that answers
    24/7, handles objections, and books jobs directly into the operator's CRM with zero hold time; (2)
    Outbound Campaigns — multi-touch SMS and voice drip sequences that re-engage existing customers and drive
    repeat bookings; (3) Speed-to-Lead — an immediate multi-source lead-response system that ingests contacts
    from Google LSA, Yelp, Thumbtack, Angi, Facebook, and web forms and fires outreach in under 60 seconds;
    (4) Simple Scheduler — a self-service online booking widget for website visitors; (5) Web Chat — an AI
    agent embedded on the operator's website; (6) Google LSA — direct integration with Google Local Services
    Ads for lead conversion; and (7) Coach — a call-scoring and analytics product that scores every call
    against a company-defined rubric and reclassifies misrecorded outcomes.

    Layered beneath these seven product modules is the Human-in-the-Loop (HITL) service tier — a team of
    Avoca-trained North America-based human CSRs who receive warm transfers when the AI escalates a call.
    HITL is not a standalone product; it is a service guarantee embedded in the platform subscription,
    ensuring no call goes unresolved. The transition from AI to HITL carries the full conversation context
    (caller identity, service type, escalation reason, equipment age, account history, and call tone) in
    under 3 seconds with zero dropped calls, per product page claims.

    The company's YC Winter 2023 launch described a broader SMB communications platform covering phone,
    text, email, and review management. By 2025–2026 the product had fully narrowed to home services, and
    Avoca's LinkedIn company description confirms "800+ operators across HVAC, plumbing, electrical, roofing,
    pest control, automotive and more" as the customer base, with 190 employees listed on LinkedIn as of
    June 2026. The docs.avoca.ai documentation site lists the full product suite under headings: Inbound,
    Outbound, Capacity Management, Speed to Lead, Google LSA, Simple Scheduler, Analytics & Coach, Dispatch,
    Configuration, Scheduling, Integrations, and Web Chat — confirming the module map described on public
    product pages.
