- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current / Legacy Workflow
  - Avoca Solution
  - Measurable Benefit (Claimed)
  - Known Limitation
  rows:
  - - Book inbound call during business hours
    - Human CSR answers, asks questions, looks up availability, books in CRM manually
    - AI CSR answers immediately, recognizes customer, reads live CRM capacity, books in <30s
    - 40% higher booking rate vs. IVR; <30s avg call-to-booking; 12+ CRM fields synced
    - AI can mishandle complex objections; configuration accuracy required for booking logic
  - - Answer call after hours or on holiday
    - Voicemail or offshore answering service (20%+ missed calls); delayed CRM entry
    - AI CSR is always-on; routes emergencies to on-call tech; books non-urgent calls
    - "After-hours bookings 58→208 (Aire Serv Sevierville); covers Dec 25 and 4 AM calls"
    - Emergency routing rule accuracy; HITL unavailability for after-hours escalations
  - - Handle inbound safety emergency (gas smell, flooding)
    - CSR manual routing to on-call; dependent on staff availability and judgment
    - P1 priority tier routes emergency to on-call tech in real time regardless of board status
    - Zero missed emergency escalations (company claim); consistent routing
    - Relies on accurate emergency-type configuration; no public safety-incident record
  - - Re-engage lapsed customers for seasonal maintenance
    - Manual phone lists, email blasts, or outsourced call center; inconsistent follow-through
    - "Outbound Campaigns — multi-touch SMS + voice drip with AI handling replies; books to CRM"
    - $850K SMS revenue in a single season (single customer case study)
    - TCPA consent requirements for AI outbound voice; campaign fatigue risk
  - - Follow up immediately on paid digital leads
    - Leads sit in inbox; CSR calls when available (30 min–hours after lead arrives)
    - Speed-to-Lead ingests all sources; AI fires outreach in <60s; handles conversation
    - Sub-60-second speed-to-lead (company claim); multi-channel follow-up
    - Lead source quality varies; AI response accuracy depends on job type configuration
  - - Score and coach CSR calls for QA
    - Manager listens to random call samples; time-intensive; 2–5% call coverage typical
    - Coach scores every call vs. rubric; reclassifies misrecorded outcomes; AI summaries
    - 5× reduction in QA time; 12% avg misclassification surfaced; $29K recovered in 90 days
    - Rubric must be configured; no third-party validation of scoring accuracy
  notes: >-
    Benefits are company-claimed or drawn from company-selected customer case studies and should not be treated
    as independently audited performance data. Limitations are inferred from product design, HITL blog content,
    and homepros.news founder interview.
