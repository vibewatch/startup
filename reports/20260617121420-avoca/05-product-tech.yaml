  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: AI model and technology stack
    missingEvidence: >-
      Avoca does not publicly disclose the foundation model provider, LLM version, voice synthesis vendor,
      telephony infrastructure, or cloud hosting provider. The docs.avoca.ai API reference reveals SDK
      structure but not underlying stack. No technology partner announcement or job description confirms
      specific model vendor.
    whyItMatters: >-
      Without knowing the AI vendor stack, investors cannot assess model risk concentration, dependency on
      OpenAI/Anthropic API pricing, potential for model capability regression, or latency constraints.
      Reliance on a third-party foundation model creates vendor risk that is invisible in public materials.
    diligencePath: >-
      Request from technical team: LLM vendor and contract terms, voice synthesis provider, telephony
      infrastructure provider, cloud hosting stack, and any model fine-tuning or proprietary training
      investment. Review any data processing agreements with AI vendors.
    relatedQuestionRefs:
    - QE026

  - type: missing-source
    severity: material
    topic: security certifications and compliance posture
    missingEvidence: >-
      No SOC 2 Type II, ISO 27001, HIPAA, or equivalent certification has been found in any public Avoca
      documentation. The Security section of docs.avoca.ai is authentication-gated and unavailable for
      review.
    whyItMatters: >-
      PE-backed home-service platforms and enterprise operators increasingly face contractual security
      requirements from their own investors or customers. Absence of a public certification creates a
      potential deal blocker for enterprise and institutional customers that require vendor security attestation.
    diligencePath: >-
      Request SOC 2 Type II report, penetration test results, and security controls documentation from
      Avoca security team. Verify scope of any certifications against actual data residency and processing
      footprint.
    relatedQuestionRefs:
    - QE011
    - QE012

  - type: missing-source
    severity: material
    topic: TCPA consent management for outbound
    missingEvidence: >-
      No public documentation describes how Avoca helps operators manage prior express written consent for
      outbound AI-generated voice calls, how opt-outs are processed and honored, or what campaign compliance
      checks are in place. The FCC 24-17 ruling is clear about the legal obligation but Avoca's enforcement
      mechanism is not publicly described.
    whyItMatters: >-
      TCPA violations carry $500–$1,500 per call in statutory damages; a single non-compliant outbound
      campaign to a large list could result in material liability for both the operator and potentially
      Avoca if it fails to provide adequate consent-management infrastructure.
    diligencePath: >-
      Request TCPA compliance documentation, consent capture workflow, opt-out management procedures,
      and any legal opinions or carrier-compliance certifications. Review any prior TCPA disputes or
      regulatory inquiries.
    relatedQuestionRefs:
    - QE014

  - type: missing-source
    severity: material
    topic: uptime SLA and reliability benchmarks
    missingEvidence: >-
      Avoca does not publish a formal SLA with uptime percentage guarantees or a historical availability
      report. The status.avoca.ai page shows current status only, without historical incident records or
      availability percentages accessible without authentication.
    whyItMatters: >-
      For home-service operators whose after-hours bookings depend entirely on Avoca's uptime, even brief
      outages during peak periods (summer heat waves, winter freezes) translate directly to lost revenue
      and customer trust. Enterprise operators need contractual SLAs for vendor selection.
    diligencePath: >-
      Request historical uptime reports for Inbound, Outbound, and HITL components over the past 12
      months, including incident logs, root-cause analyses, and current contractual SLA commitments.
    relatedQuestionRefs:
    - QE019

  - type: missing-source
    severity: material
    topic: ServiceTitan API access and exclusivity terms
    missingEvidence: >-
      Avoca's contractual terms with ServiceTitan — including API access rights, partner-program restrictions,
      exclusivity provisions, and revenue-share arrangements — are not publicly disclosed. It is not
      possible to assess whether ServiceTitan can restrict Avoca's API access, build competing AI natively,
      or materially alter partner terms without reviewing the actual agreement.
    whyItMatters: >-
      ServiceTitan is Avoca's deepest CRM integration and primary distribution channel for the largest
