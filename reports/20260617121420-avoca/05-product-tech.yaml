- id: trust-compliance-and-platform-constraints
  title: Trust, Compliance, Security Controls, and Platform Risk
  body: |-
    Avoca's privacy policy (effective January 29, 2025) confirms data encryption in transit (HTTPS) and
    at rest. Collected data includes name, email, phone, billing information, and — for financial
    transactions — government-issued ID. The policy also documents a Google Calendar OAuth integration:
    Avoca stores encrypted OAuth tokens to enable real-time calendar availability reads, automatic
    appointment creation, and change synchronization. Calendar data is described as used exclusively for
    appointment management and not shared with third parties for marketing.

    The status page at status.avoca.ai monitors five platform components: Dashboard, Inbound, Outbound,
    Analytics, and Omnichannel. All components showed fully operational status as of June 2026. The company
    does not publish a formal SLA with uptime percentage guarantees or a historical availability report
    accessible without authentication.

    No publicly confirmed SOC 2 Type II, ISO 27001, or HIPAA certification has been found in Avoca's public
    documentation as of June 2026. The docs.avoca.ai site includes a "Security" navigation item, but the
    underlying content is not accessible without platform authentication. This is a material disclosure gap
    for enterprise operators — particularly PE-backed multi-location platforms — that may face contractual
    compliance requirements from their own customers or investors.

    Regulatory risk is most acute for outbound. The FCC's February 2024 Declaratory Ruling (FCC 24-17)
    confirmed that AI-generated human-sounding voice calls constitute "artificial or prerecorded voice"
    under the TCPA, requiring prior express written consent from each call recipient before any such call
    is placed. Avoca's outbound AI calling product must maintain consent records for every contact in every
    campaign; operators bear primary TCPA liability for calls placed through their account. No public
    disclosure describes how Avoca manages consent verification, opt-out handling, or campaign compliance
    checks on behalf of operators.

    Three additional product-level constraints are observable from public materials: (1) vertical
    concentration — the entire product vocabulary, dispatch logic, priority system, and integration set is
    home-services-specific with no stated portability to other industries; (2) hallucination and quality
    risk — the same HITL blog that argues the system handles 80–85% of calls also confirms edge cases where
    AI-generated summaries or booking logic errors require same-day engineering intervention, suggesting
    non-trivial AI failure modes in production; and (3) integration dependency — if ServiceTitan restricts
    third-party API access, modifies its platform architecture, or builds equivalent AI natively, Avoca
    loses its most important distribution channel. Homepros News reported that Avoca founders acknowledge
    an "AI trust dilemma" and that churn drivers include operator dispatch-configuration errors at go-live,
    which underscores how configuration quality affects perceived AI reliability.
