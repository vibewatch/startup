summary:
  headline: >-
    Avoca has genuine vertical AI traction and elite investor validation in an underpenetrated
    home-services market, but the $1 billion valuation on undisclosed eight-figure ARR creates too
    wide an uncertainty band to underwrite without data-room access — warranting a track posture
    until key unit economics are verified.
