  productSummary: >-
    Avoca sells a multi-surface AI front-office platform for home-service operators comprising: AI CSR
    (inbound voice 24/7 with direct CRM booking), Outbound Campaigns (multi-touch SMS and voice drip),
    Speed-to-Lead, Simple Scheduler, Web Chat, Google LSA integration, and Coach (AI call scoring and
    analytics), all backed by a Human-in-the-Loop service tier that escalates the ~15–20% of calls
    the AI cannot resolve to trained North American CSRs.
  customerFocus: >-
    Multi-location PE-backed home-service operators (HVAC, plumbing, electrical, roofing, restoration)
