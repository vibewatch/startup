  topStrengths:
    - >-
      Top-tier institutional syndicate (Meritech Capital, General Catalyst, Kleiner Perkins, Amplify Partners) signals a
      category-creation underwriting thesis, implying sophisticated growth investors are pricing forward platform
      expansion in a large undigitized vertical.
    - >-
      Named enterprise deployments with concrete metrics — ~90% call automation at Sila Services, 70% revenue growth at
      HL Bowman, 20% year-over-year revenue lift at Yost & Campbell — provide credible proof-of-value anchors across
      multiple PE-backed platforms.
    - >-
      Differentiated AI-plus-HITL product embedded in ServiceTitan-centric workflows creates real integration switching
      costs; 40+ CRM integrations and a compound workflow data moat from call-booking outcomes compound the competitive
      barrier over time.
    - >-
      Founders have direct founder-market-fit: MIT computer science backgrounds, senior experience at BCG, Nuro, and
      Apple AI, and firsthand family-business context for the phone-driven revenue-loss problem that anchors the product
      thesis.
  topRisks:
    - >-
      ServiceTitan single-vendor dependency is a structural thesis-break risk: Avoca relies on ServiceTitan API access
      for its deepest enterprise deployments, and ServiceTitan's own AI roadmap directly overlaps Avoca's core product,
      creating bundling or API-restriction risk that public evidence cannot yet resolve.
    - >-
      Stretched valuation: $1 billion post-money on eight-figure ARR implies 25–100x ARR multiple depending on where in
      the $10M–$99.9M range revenue actually sits; the same evidence base cannot narrow the range, and investors are
      paying bull-case pricing before seeing bull-case numbers.
    - >-
      Disclosure opacity blocks independent financial underwriting: no audited ARR, growth rate, gross margin, NRR, CAC
      payback, burn, liquidation preference stack, or board composition are publicly available as of June 2026.
    - >-
      TCPA and FCC-24-17A1 regulatory exposure for AI-generated outbound voice, combined with unconfirmed SOC 2 and ISO
      27001 security certifications, represent material compliance and enterprise-procurement risks not yet publicly
      resolved.
    - >-
      PE-platform customer concentration creates correlated churn risk: ownership changes that drive vendor
      consolidation across multiple enterprise accounts could decelerate revenue sharply and simultaneously.
  unresolvedGaps:
    - >-
      Exact quarterly ARR, year-over-year growth rate, NRR and GRR by cohort, gross margin split between software and
      HITL labor, CAC payback period, and current burn rate — the minimum inputs required to underwrite the $1 billion
      valuation.
    - >-
      Complete cap table, liquidation preference stack, any debt or convertible-note obligations, and ServiceTitan
      integration contract terms including exclusivity provisions and API-dependency risk.
    - >-
      TCPA outbound consent-workflow audit, SOC 2 and ISO 27001 certification status, data-handling practices for call
      recordings, and regulatory compliance roadmap for FCC-24-17A1.
    - >-
      Reconciled customer count (public figures range from 800+ contractors to 1,000+ businesses), exact headcount,
      board roster, and governance control rights.
