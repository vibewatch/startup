  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Posture, and Revenue Streams
        blocks:
          - type: paragraph
            body: >-
              Avoca is a SaaS-first platform with no publicly accessible pricing page (avoca.ai/pricing returns a 404 as
              of June 2026),

              consistent with an enterprise sales-led go-to-market motion rather than self-serve. Pricing is set through
              direct sales,

              and contracts are negotiated at the account or multi-location level. The platform segments into at least
              four revenue-generating

              modules: Avoca Inbound (AI voice for inbound call handling), Avoca Outbound (multi-touch SMS and voice
              drip campaigns), Avoca Coach

              (call scoring and analytics), and the Human-in-the-Loop (HITL) service tier that backstops AI with trained
              human CSRs for escalated calls.


              The structural revenue model is a platform subscription, most likely tiered by location count or call
              volume, with potential add-on fees

              for HITL minutes consumed and for the Coach analytics module. Because pricing is undisclosed, estimates of
              average contract value

              rest on indirect evidence: the company's founder blog notes that operators previously spent "$500,000+
              annually" on traditional CSR

              staffing or offshore answering services, which establishes the upper bound of what Avoca can charge
              without exceeding its ROI

              proposition. Competitive pricing context places AI-only alternatives at $49–$199/month for solo operators
              (Rosie AI, GoodCall) and

              $285–$1,000+/month for hybrid human-AI services (Smith.ai), suggesting Avoca's enterprise contracts sit
              meaningfully above these

              entry-level benchmarks.


              Avoca's sales motion aligns with its customer profile: multi-location PE-backed platforms where a single
              contract can span 5–50+

              locations simultaneously. The Nexstar Network partner relationship provides an independent channel through
              the distributor's

              contractor membership base, reducing reliance on field sales for mid-market accounts. The enterprise GTM
              also implies a longer

              average sales cycle, higher implementation cost, and more complex revenue recognition than a self-serve
              SaaS.


              Revenue recognition for a subscription-plus-service model like Avoca is likely recognized monthly as
              service is delivered

              (consistent with ASC 606), with implementation fees potentially recognized over the onboarding period.
              None of these

              accounting details have been publicly disclosed, so the revenue quality assessment relies entirely on
              structure-level inference.
