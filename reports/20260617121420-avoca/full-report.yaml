companyProfile:
  summary: >-
    Avoca is a private AI software company founded in 2022 and headquartered in New York City (Union Square), with a
    second office in Santa Barbara. The company sells an AI-native voice and workflow automation platform to
    home-service businesses — particularly PE-backed multi-brand HVAC, plumbing, electrical, and restoration operators —
    replacing or augmenting inbound call centers, scheduling, and customer follow-up with an LLM-driven AI CSR backed by
    a North America-based human-in-the-loop escalation layer. By April 2026 Avoca had raised more than $125 million at a
    $1 billion Series B valuation led by Meritech Capital and General Catalyst, with earlier backing from Kleiner
    Perkins, Amplify Partners, Nexus Venture Partners, and Y Combinator. Public traction signals include eight-figure
    2025 ARR, named enterprise deployments at Sila Services, Granite Comfort, HL Bowman, and 1-800-GOT-JUNK?, and a 2026
    target of booking $1 billion in customer jobs (GMV). The principal diligence limitation is undisclosed unit
    economics: no audited ARR, margin, NRR, burn, or governance details are publicly available.
