      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the right analytical frame because point estimates are impossible from public
              evidence. In the bull case, Avoca proves that the company has already exited the low end of the ARR band,
              continues growing at 50 percent or better, expands beyond core HVAC and plumbing into adjacent service
              verticals, and improves gross margin as AI handle rates rise. Under that path, Avoca could plausibly reach
              a valuation above the current mark in a private follow-on or strategic exit, but even then the return for
              Series B investors may be modest unless ARR compounds very quickly.


              The base case assumes Avoca is real, growing, and operationally valuable, but not yet extraordinary enough
              to support a sustained private-market AI premium. If ARR is closer to $20 million to $25 million with 25
              percent to 30 percent growth and only moderate margin improvement, exit value settles below the current $1
              billion entry point and introduces down-round risk.


              The bear case is severe because the valuation is high. If ARR is near the low end of the public band, if
              PE customer concentration produces churn, or if ServiceTitan bundles a competing AI product, the multiple
              can collapse into services-like or slower-growth software territory. That outcome would produce a material
              write-down, not a minor miss, for late-stage investors entering at today's valuation.
            claimRefs:
