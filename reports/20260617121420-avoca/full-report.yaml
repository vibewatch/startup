      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation-Disclosure Mismatch
            body: >-
              Valuation-Disclosure Mismatch: The $1B valuation rests on the widest possible disclosure band ($10M-$99M
              ARR). At the lower bound, Avoca carries a 100x ARR multiple with no public mechanism to falsify or confirm
              it. Investors should treat the entry as bull-case pricing until data-room evidence narrows the range.
            calloutType: risk
            claimRefs:
              - CV007
              - CV025
              - CV040
          - type: callout
            title: Category Creation Premium Can Be Defensible
            body: >-
              Category Creation Premium Is Defensible If Growth Confirms: The Meritech, GC, KP, and Amplify syndicate is
              underwriting Avoca as a category-creation bet in undigitized home services, not as a conventional SMB SaaS
              tool. If 2026 ARR proves to be above $30M with 50%+ growth, the premium multiple compresses materially on
              a forward basis.
            calloutType: strength
            claimRefs:
              - CV002
              - CV011
              - CV027
          - type: callout
            title: Data-Room Access Is Non-Negotiable
            body: >-
              Data-Room Access Is Non-Negotiable Before Capital Commitment: Public evidence is sufficient to support
              strategic interest, but not enough to support financial underwriting. No investment decision should be
              made without confirmed ARR schedule, cohort retention, GAAP gross margin, cap table with preference stack,
              and ServiceTitan contract terms.
            calloutType: recommendation
            claimRefs:
