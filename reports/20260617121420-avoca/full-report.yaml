  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Map
        blocks:
          - type: paragraph
            body: >
              Avoca's risk profile reflects the intersection of a novel AI category, a concentrated customer base, and a
              regulatory environment that is actively recalibrating consent rules for AI-generated voice. The company is
              not facing a single dominant risk; it faces at least four independently material exposures that can
              interact. TCPA/FCC-24-17A1 compliance for outbound AI calling is the most acute regulatory exposure,
              because the February 2024 FCC declaratory ruling creates per-call penalty liability across every Avoca
              customer running outbound campaigns without verified prior written consent. ServiceTitan platform
              dependency is the most acute operational exposure; Avoca's core booking capability relies on ServiceTitan
              APIs while ServiceTitan simultaneously develops competing AI voice features. PE-platform revenue
              concentration creates correlated churn risk: a single vendor-preference decision by a platform operator
              removes dozens of brand deployments simultaneously. And narrative-versus-disclosure risk is the most
              structurally persistent: Avoca's $1B valuation rests on company-produced outcome metrics that no
              independent party has audited. The risk heatmap below maps likelihood against impact across all risk
              categories, and the transmission map shows how regulatory, quality, and dependency failures cascade into
              revenue, customer, and financing outcomes.
            claimRefs:
              - CR001
              - CR002
              - CR018
              - CR024
