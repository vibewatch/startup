      - number: '7.8'
        title: Kill Criteria and Monitoring
        blocks:
          - type: paragraph
            body: >
              Four thesis-break events are the highest priority monitoring targets. First: a TCPA class-action lawsuit
              naming an Avoca customer (or Avoca itself) for AI voice calls placed without verified prior written
              consent. Such an action would prompt regulatory review of all Avoca-powered outbound campaigns and
              materially increase compliance cost for all customers. Second: a ServiceTitan API restriction, pricing
              change, or competitive product launch that impairs Avoca's core booking functionality or eliminates the
              integration differentiation. Third: a revenue- concentration event in which one of the top three PE
              platform customers exits, reducing ARR materially in a single quarter. Fourth: a public security or
              data-handling incident involving homeowner PII processed by Avoca's platform. The HITL program is the
              primary quality mitigation but introduces per-call labor cost that scales with volume; if HITL volume
              increases materially, unit economics deteriorate. Avoca's npm SDK and documentation breadth support
              third-party integration durability, but API breaking changes from FSM partners remain a structural
              fragility. Monitoring indicators should include: public TCPA enforcement actions referencing AI voice in
              home services; ServiceTitan marketplace listing status; customer case-study freshness and volume; public
              G2/Capterra reviews (currently inaccessible); and any disclosed headcount restructuring following the
              Series B hiring cycle.
            claimRefs:
