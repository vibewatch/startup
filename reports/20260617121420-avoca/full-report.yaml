      - number: '2.2'
        title: Market Sizing – Multiple Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              No single analyst publishes a standalone TAM for AI voice automation in home services; sizing must be
              constructed from multiple partial lenses that cover different scopes and methodologies.


              The broadest anchor is the services economy framing used by both Kleiner Perkins and Amplify Partners in
              their public Avoca investment theses. Kleiner Perkins states explicitly that "customer support automation
              for home services alone represents tens of billions in spend" while describing the broader
              physical-infrastructure layer as a multi-trillion dollar economy. Amplify characterizes home services
              specifically as "a multi-trillion dollar market" that AI has barely touched, and notes that home services
              represents an essential layer for maintaining the country's aging housing stock. These are compelling
              order-of-magnitude anchors for the total opportunity but lack a stated methodology and mix different
              definitional scopes.


              A more grounded sizing lens comes from the field service management software market. Grand View Research
              valued the global FSM software market at $4.43 billion in 2022 and projects it will reach $11.78 billion
              by 2030 at a compound annual growth rate of 13.3%. North America accounts for approximately 26.5% of that
              spend, implying roughly $1.17 billion in North American FSM software revenue in 2022 and an extrapolated
              $3.1 billion by 2030 at the same share. These figures provide an adjacent benchmark: Avoca competes in the
              communication automation layer on top of FSM platforms, not in FSM itself, so the FSM market size bounds
              the ecosystem Avoca serves rather than the market Avoca directly addresses.


              A third lens is workforce-based. BLS data shows 425,200 HVAC installers, 504,500 plumbers, and 818,700
              electricians employed in 2024—approximately 1.75 million workers in just three trade categories. Each
              worker is associated with a business unit that handles inbound calls. Even assuming one CSR-equivalent
              role per every four trade workers and modest annual spending of $10,000–$30,000 per business unit on
              answering services and front-office staffing, the aggregated US call-handling market in core trades alone
              reaches several billion dollars annually. The Jobber platform's 100,000+ business customers across 50+
              industries provides another reference point for the scale of the digitized service-business universe.


              These sizing lenses converge on a market too large to ignore but too heterogeneous to characterize with
              one number. All plausible approaches point toward a SAM in the tens-of-billions range for front-office
              automation; the SOM for AI-native tools like Avoca depends on CRM-integration reach, operator willingness
              to pay, and the pace of AI trust adoption.
