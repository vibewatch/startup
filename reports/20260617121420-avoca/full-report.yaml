            body: >
              Avoca's public website enumerates at least six named customer case studies, each describing a production
              deployment with quantified outcomes. Sila Services, the largest publicly known customer, operates more
              than 40 HVAC, plumbing, and electrical brands across the Northeast and Midwest, with 3,000-plus employees
              and 1,200 technicians. Sila reports that Avoca handles approximately 90% of inbound call volume across
              live brands and performs within 2% of Sila's top CSRs on complex calls. Granite Comfort, a nine-brand
