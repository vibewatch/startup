      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation–ARR Mismatch Risk
            body: >-
              Avoca's $1B Series B valuation implies a 25–100× ARR multiple depending on where within the "eight-figure"
              range actual 2025 ARR falls. At the lower bound ($10M ARR), the 100× multiple is consistent only with
              category-defining hypergrowth. If 2026 growth decelerates, the market conditions that supported the 2026
              private AI premium may not persist at the next liquidity event. Investors should stress-test: if ARR
              growth falls to 50% YoY, what valuation does the company command at exit, and does it justify today's
              entry multiple?
            calloutType: insight
            claimRefs:
              - CI013
              - CI036
