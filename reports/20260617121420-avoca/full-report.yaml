            title: Jobs-Booked Target Is GMV, Not Revenue
            body: >-
              The $1B jobs-booked target for 2026 is a gross-value-of-bookings metric, not a statement of Avoca's
              platform revenue. Multiple press sources have reported this figure in ways that could be misread as Avoca
              revenue. Investors must treat it as a demand-flow signal, not as a revenue claim. The actual revenue Avoca
              earns from facilitating $1B in jobs depends on the subscription take rate, not on the jobs-booked volume
              itself.
