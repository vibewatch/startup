      - number: '6.4'
        title: Retention, Satisfaction, and Durability Signals
        blocks:
          - type: paragraph
            body: >
              Avoca does not publicly disclose aggregate net revenue retention, gross revenue retention, or churn rates.
              No third-party retention benchmark is available. The public record offers only indirect signals. Case
              studies from HL Bowman (93% AI satisfaction score), Sila Services (near-zero abandonment), and Rescue Air
              (ongoing multi-product deployment) suggest that customers who complete deployment tend to retain. The Aire
              Serv Sevierville case study reports a 90% booking rate maintained after switching from live answering to
              Avoca, which is an indirect durability signal. Avoca's co-founders stated in an April 2026 interview that
              three categories account for most churn: operators whose back-office processes were not ready for AI,
              cases where dispatch and capacity logic was misconfigured at go-live, and ownership changes when a PE
              acquirer brings a preferred vendor. Churn attributable to the AI simply failing to perform its job is, per
              the co-founders, rare. Customers who iterate actively — sending feedback in near real-time — appear to
              achieve substantially higher booking rates than those who treat deployment as a set-and-forget
              installation. The absence of independent cohort or NRR data is a material diligence gap; investors cannot
              rely on the company's own retention framing without corroboration.
