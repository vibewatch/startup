      - number: '5.2'
        title: Workflow Surfaces, Call Flow, and Dispatch Logic
        blocks:
          - type: paragraph
            body: |-
              Avoca's inbound workflow is built around three priority tiers that reflect how service operators triage
              work. P1 covers emergencies and urgent calls (no-heat, no-cool, gas smell, flooding): these are booked
              immediately regardless of what is already on the dispatch board, and safety emergencies are routed to
              an on-call technician in real time. P2 covers replacements and installations, which can overbook
              lower-priority slots. P3 covers maintenance and tune-ups, which fill open capacity but yield to P2 and
              P1 demand. Priority can be defined by equipment age, membership status, warranty status, call type, or
              any combination — and "buffer days" can push P3 work further out during peak weeks and pull it back
              during slow periods. This logic is driven by a live CRM availability read: Avoca reads capacity directly
              from the operator's CRM rather than using a static booking window, preventing double-booking and
              optionally allowing intentional overbooking of lower-priority slots.

              Before the first word of a call is spoken, Avoca pulls 12+ CRM data fields: past jobs, equipment make
              and model, equipment age, membership tier, account status, and homeowner status. When a call escalates
              to HITL, the human CSR receives this full brief on a live screen — who is calling, what they need,
              their equipment, their tone — before the customer repeats anything. Transfer time is stated at under 3
              seconds with zero dropped calls. The inbound product page reports: 40% higher booking rate versus IVR,
              average call-to-booking of under 30 seconds, and 2× faster than IVR systems.

              Intelligent task routing extends the dispatch logic to notifications: operators define which call types
              trigger routing actions (installs route to inside sales, old-equipment calls get flagged for a
              replacement conversation, dropped calls get immediate follow-up), and Avoca automatically routes them
              with an AI-generated summary attached. The outbound Speed-to-Lead playbook documents a tested workflow
              structure: 4+ touchpoints in the first 2 hours of a lead's life, across both voice and SMS, with AI
              handling conversations in both channels. Per the company's deployment lessons blog, operators at
              top-performing deployments have achieved 90–95% AI call handle rate (vs. the 80–85% baseline), booking
              rates have improved from 45% to 70%, and one customer generated $850K in SMS revenue from outbound
              campaigns in a single season.
