chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Positioning, and Market Wedge
        blocks:
          - type: paragraph
            body: >-
              Avoca is an AI-first software company founded in 2022 and headquartered in New York City, with a second
              office in Santa Barbara. The company sells AI-powered customer-communication and workflow automation for
              service businesses, especially home-services operators that depend on the phone for lead capture,
              scheduling, and after-hours responsiveness. Across its official materials, Avoca frames itself as the “AI
              workforce” or “AI front office” for these operators rather than as a narrow answering-service replacement.


              The product wedge is operationally concrete. Avoca handles inbound voice, chat, email, and SMS, books jobs
              directly into customer CRMs, follows up on unsold estimates, runs outbound campaigns, and increasingly
              layers coaching, analytics, and human backstop workflows on top of the automation layer. This positioning
              matters because the company is not just selling voice AI; it is trying to own the first customer
              interaction, then expand into the broader operating workflow. That system-of-action ambition is reinforced
              both by investor commentary and by product pages that emphasize live capacity, CRM sync, and workflow
              routing rather than a simple chatbot narrative.


              The wedge also appears deliberately vertical. Avoca’s own history says it experimented more broadly across
              SMB categories before concentrating on trades and home services, where missed calls map directly to lost
              revenue and where the urgency of bookings, dispatch, and technician schedules creates a high-ROI
              automation use case. By mid-2026 the company is explicitly talking about extending beyond core home
              services into adjacent service categories such as roofing, restoration, moving, junk removal, automotive
              services, and property management.
