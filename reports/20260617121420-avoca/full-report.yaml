      - number: '5.4'
        title: Analytics, Coaching, and Data Compounding
        blocks:
          - type: paragraph
            body: |-
              Avoca Coach adds an AI-scoring layer over every call handled by the platform — both AI-handled and
              HITL-handled calls. Each call is scored against a company-defined rubric across four dimensions:
              objection handling, process adherence, tone and empathy, and booking outcome. Managers see AI-generated
              coaching summaries with specific examples of where CSRs missed or succeeded. The product page reports
              15% improvement in booking rates, 2× increase in memberships sold, and 5× reduction in QA time for
              customers using Coach. A single-location HVAC case study shows $29K recovered in 90 days from calls
              that were previously misclassified as "not interested" and surfaced by reclassification.

              The call reclassification feature is analytically significant: the claimed average misclassification
              rate of 12% means that roughly 1 in 8 calls recorded as "not interested" or "not booked" may have
              actually been bookable opportunities. For a business handling hundreds of calls per month, that
              represents meaningful recovered revenue without any additional marketing spend. This feature also has
              a data-quality implication: it corrects the CRM record, which in turn improves the accuracy of
              historical analytics and future AI training signal.

              Amplify Partners' investment thesis explicitly names Avoca's proprietary workflow data as a compounding
              competitive moat: every deployment adds operator-specific call patterns, booking rules, and customer
              behavior data to the system's knowledge base. The HITL blog notes the system "gets smarter every day
              it runs" — a standard description of continuous learning from production data, though the specific
              learning mechanism and model update cadence are not publicly disclosed. Investor framing treats the
              data layer as the primary barrier to competitive displacement: a new AI entrant starts with no
              operator-specific training signal, while Avoca's long-tenured customers have trained the system on
              years of their own call patterns and booking logic.
            claimRefs:
              - CE025
              - CE026
