      - number: '7.7'
        title: Competitive, Valuation, Cyclicality, and Disclosure Risk
        blocks:
          - type: paragraph
            body: >
              ServiceTitan, HouseCall Pro, and Jobber have collectively more than 200,000 small-business customers and
              are each actively building native AI call-handling or receptionist capabilities. ServiceTitan's AI voice
              agent blog post targets inbound HVAC and plumbing booking — the exact use case Avoca monetizes. If major
              FSM platforms bundle AI voice as a zero-marginal-cost feature, the switching cost argument for Avoca
              erodes: customers already pay ServiceTitan for dispatch and CRM; adding a native AI receptionist feature
              eliminates the integration step that currently differentiates Avoca. Avoca's $1B valuation implies a 10x+
              ARR multiple on eight-figure ARR. TechCrunch and Axios Series B coverage is based on Avoca's press
              release; neither publication independently verified ARR, NRR, or growth rate. The Hacker News comment
              thread on the funding round raised questions about booking-lift methodology. Avoca's stated path to $1B in
              jobs booked in 2026 carries no disclosed methodology, and no third party has corroborated this figure.
              Macroeconomically, home services demand tracks housing transactions, consumer confidence, and disposable
              income; a housing-market slowdown reduces emergency call volume for trades, the highest-value use case for
              AI booking. ServiceTitan's AI voice blog cites peak-season capacity management as the primary driver — a
              cyclical demand signal. Avoca has not publicly disclosed ARR growth rate, NRR, or payback period, which
              means the investor must underwrite the valuation on company-provided anecdote rather than normalized unit
              economics.
            claimRefs:
              - CR034
              - CR035
