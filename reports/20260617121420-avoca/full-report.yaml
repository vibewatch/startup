      - number: '7.2'
        title: Regulatory, TCPA, and Privacy Risk
        blocks:
          - type: paragraph
            body: >
              The Telephone Consumer Protection Act (47 U.S.C. § 227) prohibits initiating calls using an artificial or
              prerecorded voice to any telephone number without prior express consent, subject to limited exceptions for
              existing business relationships. The FCC's February 2024 declaratory ruling (FCC-24-17A1) explicitly
              extended this prohibition to AI-generated voice calls, closing a gap that some vendors had previously
              exploited. The ruling creates a direct compliance obligation for any platform initiating AI voice outreach
              on behalf of service businesses, which describes Avoca's Speed-to-Lead and Outbound Campaigns modules
              precisely. Violations carry $500 per call for inadvertent violations and up to $1,500 per call for willful
              violations; TCPA class actions have been filed based on outreach volumes of tens of thousands of calls,
              making aggregate exposure potentially very large for any operator running high-volume AI outbound
              campaigns.

              Avoca's privacy policy (avoca.ai/legal/privacy-policy) acknowledges data collection but does not publish
              SOC 2 Type II, ISO 27001, HIPAA, or CCPA compliance certifications. The docs.avoca.ai security page was
              not publicly accessible as of June 2026 (HTTP 404), meaning investors cannot independently confirm the
              security controls Avoca maintains over homeowner PII. Multiple US state privacy laws (CCPA in California,
              CDPA in Virginia, CPA in Colorado) create data subject rights that apply to residents whose contact
              information Avoca processes. Avoca's terms-of-service URL (avoca.ai/terms) also returned 404 in June 2026,
              meaning the contractual liability structure for AI errors is currently undiscoverable from the public
              record. The FTC and FCC both list robocall and AI calling enforcement as top consumer-protection
              priorities in 2026, heightening the risk that a customer complaint could escalate to formal enforcement.
              No public lawsuit or regulatory action against Avoca or its customers has been identified in the public
              record, but absence of evidence is not evidence of compliance given the novelty of the 2024 ruling.
            claimRefs:
