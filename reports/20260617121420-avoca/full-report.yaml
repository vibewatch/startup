          label: Call arrives (24/7)
          detail: Homeowner dials operator; Avoca answers on first ring with zero hold time
        - id: customer-recognition
          label: Customer recognition
          detail: AI pulls 12+ CRM fields in real time — past jobs, equipment, membership tier, account history
        - id: intent-classification
          label: Intent and priority classification
          detail: >-
            AI classifies call as P1 (emergency), P2 (replacement/install), or P3 (maintenance); emergency safety calls
