      - number: '3.5'
        title: Competitive Moat, Switching Costs, Lock-In, and Risk Register
        blocks:
          - type: paragraph
            body: >-
              Avoca's competitive moat, as articulated in its June 2026 blog post "Customer Experience Is the New
              Competitive Moat," rests on the compound data asset built from call-booking-outcome records accumulated
              per operator over months of deployment. This positions Avoca's AI as self-improving on a per-business
              basis: the more calls it handles, the better it books, the more operators are reluctant to reset that
              learning curve. The moat claim is plausible but requires diligence verification—specifically, whether
              fine-tuning is truly operator-specific or generic across the platform.


              Switching costs are asymmetric by operator tier. Smaller operators with low booking volumes and simple
              workflows face low switching costs: a $49/month Rosie or GoodCall agent can handle basic call-answering
              with minimal setup. Larger multi-location operators face higher switching costs from embedded workflows,
              CRM data history, and the technical dependency of ServiceTitan calendar integration. Avoca's multi-brand
              deployment at operators like Granite Comfort (nine brands) creates a compounding integration lock-in that
              single-location tools cannot easily replicate.


              Multi-homing is possible: an operator could run Avoca for inbound AI and Hatch for outbound follow-up
              simultaneously, since they target different workflow steps. This is actually Avoca's partnership model for
              outbound. The risk is that competitors like Hatch could eventually expand into inbound, or that HCP/Jobber
              could bundle both inbound and outbound into their platforms.


              The principal strategic risk is ServiceTitan deepening its own AI voice capabilities. ServiceTitan has the
              largest premium installed base, real-time dispatch board data, and the financial resources to build or
              acquire AI voice features. Its current partnership posture toward Avoca could shift to direct competition
              if market dynamics warrant. A secondary risk is commoditization: as AI voice becomes table-stakes (driven
              by Rosie-class tools), buyers may stop paying a premium for the AI layer and demand bundled pricing from
              their FSM vendor.
