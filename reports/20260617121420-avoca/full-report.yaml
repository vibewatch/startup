      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary growth drivers for AI front-office adoption in home services are structural and mutually
              reinforcing. The skilled trades face a severe labor supply imbalance that Amplify describes as five
              workers leaving for every two entering. BLS projections show HVAC employment growing 8% and electricians
              9% through 2034, signaling persistent demand for service capacity even as operators struggle to staff
              call-handling. That staffing crunch converges with a $317 billion deferred maintenance backlog identified
              in ServiceTitan's Fall 2025 Benchmark Report: 71% of homeowners postponed renovations in 2025, and 62%
              deferred critical maintenance, meaning the incoming call volume in 2026 and beyond is likely to outpace
              what human CSR teams can absorb without automation support.


              The AI adoption signal is also rapidly strengthening. Jobber's 2026 Trends Survey of over 1,000 service
              business owners shows that 88% of high-confidence (fully-booked, growing) businesses now use AI tools,
              versus only 27% of low-confidence peers. More than half of all surveyed businesses use AI for quoting,
              invoicing, and communication. HVAC, plumbing, and roofing lead AI adoption. These adoption curves suggest
              the market is moving from early-adopter phase toward early majority. The economic case is also
              strengthening: ServiceTitan's HVAC-focused analysis estimates the average HVAC company loses
              $45,000–$120,000 per year to unanswered calls, and McKinsey research cited by HousecallPro estimates that
              businesses using AI report up to 30% cost savings.


              Adoption constraints are real but manageable. The most frequently cited barrier in operator and investor
              commentary is trust: contractors will only commit to AI CSR if performance matches or exceeds their best
              human CSR. Avoca acknowledges this by maintaining a human-in-the-loop program that escalates roughly
              15–20% of calls to trained human agents. Integration dependency is a structural gate—AI booking only works
              if the tool connects to real-time CRM availability, meaning Avoca is dependent on the FSM platform
              ecosystem. Cost sensitivity among small operators limits willingness to pay until ROI is demonstrated
              quickly. And the 2026 macro environment—inflation at 3.3% year-over-year in March, weakening consumer
              confidence—introduces incremental headwinds for operators managing margins alongside new technology
              investments.


              Key evidence gaps include the absence of independent data on what fraction of home services businesses
              have adopted AI CSR tools by mid-2026, the lack of third-party churn and payback comparison between AI and
              traditional answering services, and an unresolved question about state-level regulatory risk for AI voice
              recording and disclosure obligations across the footprint of national operators.
