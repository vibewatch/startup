      - number: '3.4'
        title: Feature, Capability, and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              The capability comparison across the competitive field reveals a clear segmentation. Avoca is the only
              vendor that simultaneously offers: AI-native inbound voice with real-time ServiceTitan dispatch board
              integration, outbound campaign automation (estimate follow-up, win-back), a human-in-the-loop escalation
              program handling 15–20% of calls, and analytics and coaching layered on top of call-booking data. No
              single competitor replicates all four capability clusters in one platform.


              Competitors partition across capability axes. Rosie AI and GoodCall offer call answering and simple
              booking without FSM-specific integrations. FSM-bundled AI tools (HCP CSR AI, Jobber AI Receptionist) offer
              tight integration but only within their own platform's dispatch board. Smith.ai provides the human
              staffing component but at a structurally higher cost per handled call. Hatch covers outbound follow-up but
              not inbound call answering. AnswerConnect offers live answering but not automation.


              On pricing, Avoca is the only competitor that does not publish pricing at all—a classic enterprise sales
              motion requiring custom quotes. Rosie AI starts at $49/month; GoodCall at $79/agent/month; Jobber base FSM
              at $29/month with AI Receptionist available in higher-tier plans ($199–$699/month). Live answering
              services such as AnswerConnect and Smith.ai require contact-sales pricing, implying per-minute costs that
              typically reach $1–$2+ per handled call at volume—a structural cost disadvantage versus AI-native tools
              for high-call-volume operators. HCP Starter plans begin at $59/month with CSR AI as a bundled add-on whose
              per-operator cost is not separately disclosed.


              The key implication for buyer decision-making is that the comparison set depends on operator tier. A solo
              HVAC technician comparing options will see Rosie at $49/month as a viable substitute. A regional PE-backed
              operator running ServiceTitan across ten locations with 500+ calls per month will find no substitute for
              Avoca's integration depth and multi-location capability.
