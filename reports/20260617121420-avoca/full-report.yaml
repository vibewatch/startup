  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Avoca serves two structurally distinct customer archetypes within the home-services market. The first is
              the independent small-to-medium business (SMB) operator running a single-brand HVAC, plumbing, electrical,
              pest control, garage-door, or general contracting company. These operators typically deploy Avoca to
              replace or augment a small in-house CSR team, capturing calls they currently miss and reducing reliance on
              after-hours answering services. The second — and strategically more important — archetype is the PE-backed
              multi-brand platform that operates dozens of acquired brands under a shared operating model. For PE
              platforms, Avoca delivers value at two levels: each acquired brand gets immediate call-handling
              automation, and the platform leadership gains a single analytics view across all brands that was
              previously impossible with decentralized CSR teams. Avoca's co-founders have disclosed that the company is
              live and deployed in over half of the top 30 PE-backed home-service platforms in the United States, making
              PE-assisted distribution a core growth lever. The geographic focus is overwhelmingly domestic US, matching
              the concentration of mature home-services private equity activity in the Northeast, Southeast, Southwest,
              and Midwest. Internationally, no active deployments are disclosed.
            claimRefs:
