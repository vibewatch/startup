      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer for Avoca is almost always a home services business owner or operations director—not an IT
              buyer. This is a critical structural difference from most enterprise software deals. The purchase decision
              sits closest to the P&L and is driven by an explicit revenue-loss calculation: "How much am I losing to
              missed calls and slow follow-up?" rather than a technology procurement process.


              Avoca's market can be segmented into three broad buyer tiers. At the smallest end, single-location
              independent contractors typically have one to three CSRs or no dedicated CSR at all; their adoption
              trigger is a missed call or an overstaffing cost during peak season. In the middle tier, regional
              multi-location operators (10–100+ trucks, often backed by private equity) have more sophisticated CSR
              operations and compare Avoca's cost against the total loaded cost of CSR headcount and call-center
              vendors. At the largest tier, national multi-brand operators and franchise groups can deploy Avoca across
              dozens of brands, generating consolidation ROI that makes enterprise economics compelling—Granite
              Comfort's nine-brand deployment in late 2025 illustrates this pattern.


              The user (the person operating Avoca day-to-day) is typically the CSR team or, in smaller shops, the
              business owner. The payer is always the business owner or their private-equity backer. This means the
              sales motion is fundamentally commercial ROI-driven rather than IT-gated, which compresses sales cycles
              but also requires fast proof of value—typically within four to eight weeks of deployment. Homeowners are
              not buyers but are indirect demand drivers: Jobber's 2026 survey data shows that over 70% of homeowners
              expect a same-day response and more than half expect contact within the hour. That expectation gradient
              has moved the performance bar above what most CSR operations can reliably meet, accelerating the case for
              automation.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
