        - Platform is not compounding and churn exceeds expansion
        - Require structural protections or step away from the round
      - - Gross margin confirmed below 45%
        - GAAP gross margin below 45% with HITL labor acting as a structural ceiling
        - Recasts Avoca as a services business deserving services-like multiples rather than SaaS multiples
        - Reprice the thesis completely and escalate to investment committee as services-not-SaaS
      - - Customer concentration above 50% in top-three accounts
        - Any single customer above 25% of ARR or top-three above half of total ARR
        - Correlated PE platform churn or procurement change can remove a large share of revenue at once
        - Require diversification milestones and covenant-style monitoring before signing
    notes: >-
      Triggers are derived from public risk factors and reflect thresholds that would meaningfully impair underwriting
      at a $1B Series B entry valuation.
    claimRefs:
      - CV023
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Exact ARR and quarterly growth
        - >-
          Confirmed ARR and quarterly ARR schedule from inception through Q2 2026 broken into new expansion contraction
          and churned ARR
        - Without this the 10x ARR range cannot be narrowed and the implied multiple is ununderwritable
        - CFO; first data-room ask cross-checked against billing system exports
      - - Net Revenue Retention by cohort
        - NRR and GRR by customer cohort at 12-month and 24-month windows
        - NRR above 110% validates compounding while below 100% indicates the ARR base is shrinking on net
        - CFO / Revenue Operations; produce cohort retention analysis
      - - Gross margin and COGS breakdown
        - >-
          GAAP income statement for FY2024 FY2025 and TTM June 2026 with COGS split across AI infrastructure HITL labor
          implementation and customer success
        - HITL labor determines whether terminal economics trend toward SaaS or stay structurally service-like
        - CFO; audit package or management accounts
      - - Cap table with preference stack
        - >-
          Full cap table showing all security types liquidation preferences anti-dilution provisions vesting schedules
          and secondary transactions
        - Preference overhang determines real investor proceeds and scenario outcomes
        - General Counsel; legal data-room section
      - - ServiceTitan API contract terms
        - >-
          Copy or summary of the commercial API agreement including data rights pricing tiers exclusivity and
          termination provisions
        - >-
          API dependency is the single highest operational risk and could make the platform vulnerable to a
          partner-competitor
        - CEO / Legal; contract disclosure under NDA
      - - Customer concentration report
        - Top-10 customer ARR as a percentage of total ARR with any customer above 10% identified
        - PE-platform concentration can create correlated churn and rapid revenue impairment
        - Revenue Operations; CRM export plus billing analysis
    notes: >-
      Priority order reflects urgency and blocking nature of the information gap; items 1-3 are blocking diligence asks
      before any investment commitment.
    claimRefs:
      - CV034
      - CV035
      - CV036
