      - number: '4.4'
        title: Capital Adequacy, Use of Funds, and Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Avoca has raised more than $125M across Seed, Series A, and Series B rounds at a $1B valuation. The
              capital history

              is one of the better-documented parts of the public record: PitchBook records a $500K accelerator round
              (2023), a $10.3M

              seed (October 2024), an undisclosed Series A (June 2025, KP-led), and the $125M+ Series B (April 2026,
              Meritech- and

              GC-led). The Company Overview chapter documents this chronology in detail; the relevant financial question
              here is forward

              capital adequacy.


              The stated use of Series B proceeds is product development, scaling operations, deeper integrations with
              industry software

              platforms, and expanding sales and customer success teams nationwide. This indicates a growth investment
              thesis: capital is

              being deployed primarily in S&M and R&D to capture market share before incumbents (ServiceTitan, Jobber,
              HCP) deepen their

              own AI features. This posture is consistent with a company accepting near-term cash burn to compound data
              moat and customer lock-in.


              No public data on Avoca's cash on hand, monthly burn rate, or runway is available. An estimate can be
              constructed from

              headcount and market benchmarks: with 100+ employees at a New York headquarters, fully-loaded annual
              payroll cost is

              estimated at $15–$25M. Adding AI infrastructure, facilities, and S&M program costs likely brings total
              annual burn into

              the range of $20–$35M. At $20M burn, the $125M Series B would provide approximately 6 years of runway; at
              $35M burn,

              approximately 3.5 years. These are rough estimates, not confirmed figures.


              No debt, credit facilities, or secondary capital obligations have been publicly disclosed. The absence of
              disclosure does not

              confirm their absence—data-room review should confirm the full capital structure, including any venture
              debt, earn-out

              provisions, or secondary transactions. The investors (Meritech, GC, KP, Amplify) are all equity-stage
              funds without known

              history of project-finance or debt structures, which reduces but does not eliminate the probability of
              subordinate capital.
