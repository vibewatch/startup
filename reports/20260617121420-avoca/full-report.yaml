      - number: '6.3'
        title: Onboarding Model and Partner-Assisted Distribution
        blocks:
          - type: paragraph
            body: >
              Avoca's customer acquisition and onboarding process relies on a Forward Deployed Engineer (FDE) model in
              which a technical staff member travels onsite to each new customer before and during deployment. The FDE
              extracts the operational details that differentiate each business — booking logic, seasonal protocols,
              membership tiers, emergency routing — and builds those rules directly into the AI deployment. Avoca
              reports that this model compresses feedback loops from weeks to same-day configuration changes. One
              reference customer, Yost & Campbell, went from daily escalation calls to weekly check-ins after the first
              30 days. The ServiceTitan integration partnership is Avoca's most significant channel mechanism: since
              ServiceTitan is the dominant field service management platform for HVAC and plumbing businesses, Avoca's
              tight integration creates a natural distribution pathway inside the ServiceTitan ecosystem. The referral
              program (Refer & Earn) and formal partner program offer additional inbound leads from trade associations,
              insurance networks, and peer operator referrals. For PE platforms, the land-and-expand pattern is
              accelerated by acquisition: when a PE-backed platform acquires an independent Avoca customer, the platform
              typically reviews performance data and rolls the deployment out across additional portfolio brands. Rescue
              Air's PE deal process illustrates the inverse: buyers saw Rescue Air's AI deployment as a scalable
              playbook and priced that capability into the acquisition multiple.
