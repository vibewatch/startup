  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview and Competitor Classification
        blocks:
          - type: paragraph
            body: >-
              The home services AI communication market has six identifiable competitor classes that Avoca must navigate
              simultaneously. Direct AI-native voice tools include Rosie AI (targeting sub-$200/month solo operators),
              GoodCall (a horizontally-deployed AI phone agent claiming 50,000+ agents launched, born from Google AI),
              and Signpost (an AI voice receptionist for HVAC, plumbing, and electrical contractors). FSM-bundled AI
              features are now embedded in Housecall Pro's CSR AI module (launched as part of the "AI Team" suite in
              2025–2026), Jobber's AI Receptionist, and ServiceTitan's existing call-booking infrastructure. Hybrid
              human-and-AI services such as Smith.ai deploy live North America-based receptionists working alongside AI,
              explicitly positioning against pure automation. Traditional live answering services like AnswerConnect
              market themselves as "people, not bots," capturing the trust-skeptical segment. AI outbound and follow-up
              tools—primarily Hatch, which focuses on estimate follow-up, rehash campaigns, and lead
              re-engagement—occupy the adjacent outbound lane without competing on inbound booking. And the single
              largest competitor remains the status quo: the human CSR or contracted answering service that most
              operators are running today.


              Avoca's framing as an "AI workforce" rather than an answering service is designed to reframe the
              competitive comparison away from head-to-head pricing versus Rosie or Smith.ai and toward total
              customer-experience ownership. This positioning supports a higher price point and longer land-and-expand
              sales motion than direct cost comparisons with single-use AI voice tools would justify. However, it also
              requires Avoca to continuously demonstrate workflow depth and data compounding that commoditized tools
              cannot replicate.
