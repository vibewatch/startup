  - id: FE001
    title: Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Observable architecture layers for Avoca's platform, from external channel inputs through AI processing,
      integration, and service-delivery layers to operator-facing outputs. Layers inferred from docs.avoca.ai, product
      pages, and API reference; specific technology vendors are not publicly disclosed.
    approximationNotes: >-
      AI model vendor, telephony provider, and cloud infrastructure provider are not publicly named. Layer boundaries
      are inferred from public product documentation and API structure, not from architectural disclosure.
