      - number: '6.5'
        title: Adverse Analysis and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Several structural concerns constrain the evidentiary quality of Avoca's customer record. First, all
              published outcome data originates from Avoca-produced case studies and a co-founder interview; no
              independently authored reviews appear on G2, Capterra, or Trustpilot in publicly accessible form as of
              mid-2026. This limits triangulation and creates testimonial-selection bias: the cases chosen for
              publication reflect the most favorable deployments. Second, Avoca's outbound AI calling operations —
              including Speed-to-Lead and Outbound Campaigns — are subject to the FCC's February 2024 Declaratory Ruling
              confirming that TCPA restrictions on artificial or prerecorded voice apply to AI-generated voice calls.
              Consent compliance adds operational friction and creates liability for customers who deploy outbound
              features without proper consent flows. Third, the concentration of Avoca's strategic value in PE-backed
              multi-brand platforms creates a two-sided risk: a single PE platform decision to switch vendors can
              immediately remove multiple brands. The co-founders acknowledged that losing an acquired company when its
              PE buyer has a preferred vendor is a recurring churn vector. Fourth, Avoca has not disclosed an aggregate
              customer count, making it impossible to assess penetration, cohort trends, or true market share from the
              public record. Fifth, the deployment model's dependence on high-touch FDE onboarding may limit the speed
              of new customer acquisition as the company scales.
