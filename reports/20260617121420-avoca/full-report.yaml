      - number: '7.5'
        title: Customer and Revenue Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Avoca's co-founders disclosed in April 2026 that the company is live in over half of the top 30 PE-backed
              home-service platforms in the US. This distribution strategy has a structural risk embedded in its
              success: each PE platform is simultaneously a high-value customer and a channel partner, meaning a single
              vendor-preference decision at the platform level removes all acquired brands from Avoca simultaneously.
              Sila Services (40+ brands, 3,000+ employees) is the largest publicly named customer; a Sila exit would
              represent the equivalent of dozens of concurrent individual-brand churns. Avoca's April 2026 funding
              announcement and co-founder interview acknowledge that ownership changes — particularly PE acquisitions of
              incumbent Avoca customers — can trigger vendor reviews. No customer revenue concentration disclosure
              (top-3 or top-5 share) exists in the public record; the cumulative ARR contribution of the top three
              customers is unknown from public sources. Amplify Partners' thesis letter explicitly highlights Avoca's PE
              land-and-expand model as a growth driver, but the same model that accelerates expansion creates correlated
              loss exposure. A consolidating home-services PE market could produce fewer, larger platforms with even
              greater negotiating leverage over technology vendors.
            claimRefs:
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
      - number: '7.6'
        title: People, Org Scaling, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Avoca's headcount ranges from 100 to 190 across public sources as of June 2026, reflecting rapid
              post-Series B hiring. The forward-deployed engineer (FDE) model — in which an Avoca engineer travels
              onsite to each new customer to build deployment-specific booking logic, seasonal rules, and membership
              tiers — creates a direct labor-to-growth dependency. Each new enterprise deployment requires onsite FDE
              time; doubling the customer base requires roughly doubling FDE headcount unless the model is
              systematically productized. Avoca's workforce-evolution blog discusses the transition from a heavily
              manual deployment model toward more automated configuration tooling, but the pace and completeness of that
              transition are not publicly documented. Axios's 2026 funding article reports accelerated hiring after the
              April 2026 Series B but does not break down functional allocation. The institutional knowledge
              concentration risk in the founding team and early engineers is material: both founders are operationally
              central, and no governance succession or leadership depth below the co-founder layer has been publicly
              disclosed.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
