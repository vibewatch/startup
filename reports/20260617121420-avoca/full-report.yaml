      - number: '7.4'
        title: Integration and Platform Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Avoca's core booking function — routing calls, querying live capacity, and writing job records — depends
              on real-time API access to field service management platforms. ServiceTitan holds an estimated 40%+ share
              of the US HVAC and plumbing FSM market, making it Avoca's most critical integration counterparty. Avoca's
              API documentation and ServiceTitan's developer portal both show tight integration via booking, dispatch,
              CRM sync, and capacity-management endpoints; if ServiceTitan changes pricing, introduces rate limits, or
              revokes Avoca's marketplace listing, the core product is materially impaired. ServiceTitan's developer
              portal and marketplace both carry standard SaaS terms that reserve unilateral modification rights. The
              competitive overlap is significant: ServiceTitan published a blog in 2024-2025 describing its own AI voice
              agent for HVAC booking, and the Avoca listing on the ServiceTitan marketplace places these two products in
              a visible dependency-and-competition tension.

              Avoca does mitigate this risk through breadth — its integrations page shows 40+ FSM platforms supported —
              but the depth of integration with ServiceTitan is materially greater than with alternatives, and the
              majority of high-value PE-backed platform customers likely run on ServiceTitan. The Avoca npm SDK and API
              documentation confirm that third-party developers can build custom integrations, which is an indirect
              durability signal, but custom integrations create their own maintenance surface. A scenario in which
              ServiceTitan offers equivalent AI voice functionality to its customer base at zero marginal cost (as a
              platform feature) would eliminate the TAM segment that represents Avoca's highest-value deployment
              targets. No public contract terms between Avoca and ServiceTitan have been disclosed.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
