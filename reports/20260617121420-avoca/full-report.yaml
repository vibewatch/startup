      - number: '7.3'
        title: AI Quality, Hallucination, and Trust Risk
        blocks:
          - type: paragraph
            body: >
              Avoca claims 80-85% autonomous AI call handling across its inbound deployments, with the remaining 15-20%
              escalated to human CSRs via its HITL tier. These figures appear in company-produced product pages and case
              studies; no independent measurement or audit has been identified. The absence of independent reviews on
              G2, TrustRadius, and Capterra — each of which returned access-restricted or 404 responses in June 2026 —
              means there is no third-party user-feedback signal to cross-check Avoca's performance claims. AI voice
              agents booking service appointments face a qualitatively distinct hallucination risk from general-purpose
              language model uses: a false commitment (misquoted pricing, unavailable time slot, incorrect service
              scope) creates an immediate customer dispute and potential refund liability for the operator. Avoca's HITL
              blog acknowledges that some call scenarios require human judgment, including complex upsells, distressed
              or non-English speakers, and non-standard service requests, which implies the AI's scope boundary is
              actively managed rather than unlimited.

              Customer outcome metrics — 20% year-over-year revenue lift at Yost & Campbell, 90% call-volume automation
              at Sila Services, 70% revenue growth at HL Bowman — all originate from Avoca-produced case studies with no
              independent corroboration. If any of these figures are based on methodology choices that do not survive
              audit (attribution window, baseline selection, concurrently running changes), the trust case for the
              product deteriorates rapidly. The Hacker News thread for Avoca's April 2026 funding raised questions about
              how booking-rate attribution is measured when AI handles a call that a live CSR would also have handled
              successfully. Trust in AI-first products ultimately depends on transparent performance measurement;
              Avoca's current public disclosure level does not yet support that standard.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
