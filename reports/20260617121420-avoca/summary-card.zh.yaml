summary:
  headline: >-
    Avoca 在渗透不足的家居服务市场里已有真实 vertical AI 牵引和顶级投资人背书；但未披露的八位数 ARR 对应 $1 billion 估值，不确定区间太宽， 没有 data-room
    访问就无法承销，因此应先观察，直到关键单位经济得到验证。
