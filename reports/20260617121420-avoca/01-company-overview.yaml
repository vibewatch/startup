- id: milestones-risks
  title: Milestones, Strategic Logic, and Adverse Checks
  body: |-
    The milestone pattern is coherent. Avoca was founded in 2022, entered Y Combinator in 2023, raised seed capital in 2024, raised a Series A in mid-2025, and then jumped to a $1 billion Series B in April 2026. In parallel, the company’s public content shows increasing maturity: by 2025 it was publicly arguing that trades and home services are uniquely well-suited to AI because phone-driven bookings directly determine revenue, and by 2026 it was publishing more detailed product and operating material on human escalation, busy-season controls, and customer-experience strategy.

    The main public adverse thread is not legal trouble but trust and execution risk. Homepros’ April 2026 interview explicitly frames an “AI trust dilemma” in which contractors will only fully commit if the system performs at least as well as their best CSR and preserves customer trust in high-stakes service moments. Avoca’s own materials partially validate that concern by emphasizing human-in-the-loop coverage, edge-case escalation, and the fact that AI still hands off the harder 15–20% of calls.

    No major public lawsuit, enforcement action, or leadership scandal surfaced in the retrieved materials, but absence of evidence should not be over-read. The real diligence burden is around governance, audited financials, exact customer and employee counts, and whether the company’s strong top-line narrative can sustain quality as it expands from core home services into adjacent verticals.
