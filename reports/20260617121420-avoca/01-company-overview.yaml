- id: traction-scale
  title: Traction Signals, Customer Proof, and Disclosure Limits
  body: |-
    Avoca’s public traction claims are strong but only partially quantified. The company says it surpassed eight figures in annual recurring revenue in 2025 and is on track to book $1 billion in jobs during 2026. It also cites major customers and partners — including Turnpoint, 1-800-GOT-JUNK?, Goettl, ServiceTitan, Nexstar, and Clover — and customer stories that show concrete workflow consolidation and revenue lift, such as Granite Comfort’s late-2025 deployment across nine brands and Yost & Campbell’s reported 20% year-over-year revenue gain from calls Avoca captured.

    The product pages add operational specificity to those claims. Avoca describes a 24/7 inbound AI that routes emergencies, books jobs directly into CRMs, syncs customer records, and hands edge cases to human agents with context preserved. Its outbound and busy-season materials extend the story into lifecycle marketing, capacity-aware scheduling, and task routing. The combination supports the thesis that Avoca’s value proposition is revenue capture plus workflow control, not just lower call-center labor.

    Still, material gaps remain. Public sources do not provide audited revenue, gross margin, customer-count, or retention metrics, and customer-count estimates in public commentary vary from “800+ contractors” to “1,000+ businesses served together,” often without a dated methodology. That means the company has credible momentum indicators and customer proof, but not the level of disclosure that would let an investor independently normalize unit economics or customer concentration from public materials alone.
