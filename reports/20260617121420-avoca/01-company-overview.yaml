- id: founders-team
  title: Founders, Team Signals, and Organizational Dependence
  body: |-
    Avoca was co-founded by Tyson Chen and Apurva Shrivastava. Public profiles consistently tie both founders to MIT computer-science backgrounds, and both narrate a similar founder-market-fit story: they grew up answering phones for family businesses and treat missed calls as a visceral small-business pain point rather than an abstract software problem. Tyson’s public background spans BCG and product work at Nuro, while Apurva’s public profile spans Apple AI work, Sunshine, Retool, and prior founder experience.

    Public team disclosure beyond the founders is comparatively thin. Avoca’s careers and culture pages name a handful of employees in engineering, sales, and technical account management and emphasize a highly in-office Union Square culture, but they do not publish a conventional leadership page or detailed board roster. That means the company is legible on founder identity and culture, but still opaque on governance depth, functional succession, and the full executive bench.

    Headcount is the biggest near-term disclosure conflict. Avoca’s 2026 careers page says the company is “100 people and growing,” the General Catalyst job board says it has scaled to 100+ employees in under two years, Y Combinator’s profile still shows 85 employees, PitchBook shows 158 employees, and Tracxn lists Avoca as a Series B company without resolving the discrepancy. The consistent directional signal is rapid hiring after the Series B, but exact current headcount remains unresolved and should be verified directly in diligence.
