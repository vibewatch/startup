  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated company-provided headcount and employee-location breakout that reconciles YC, careers, General Catalyst, PitchBook, and Tracxn differences.
    whyItMatters: Hiring pace and current team size are core inputs to burn, execution bandwidth, and post-Series-B scaling quality.
    diligencePath: Request an org-level employee count by function and location from management or a current HRIS export.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, ownership concentration, and any lead-investor control rights from the Series A and Series B.
    whyItMatters: Governance depth and investor rights determine founder dependence, reporting rigor, and the practical meaning of the unicorn valuation.
    diligencePath: Obtain the cap table, board list, and major financing documents in diligence.
    relatedQuestionRefs:
    - QO009
    - QO024
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: A dated active-customer count with a definition of customer, brand, and location-level counting methodology.
    whyItMatters: Public references to 800+ customers or 1,000+ businesses do not establish concentration, retention quality, or the real installed base.
    diligencePath: Request a customer-count bridge by segment and the top-20 customer concentration table.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited or board-grade metrics for ARR, growth, gross margin, NRR, churn, and customer payback.
    whyItMatters: The current public record is strong on narrative momentum but too thin to independently test efficiency and durability.
    diligencePath: Request a current KPI deck or monthly investor update with cohort and margin detail.
    relatedQuestionRefs:
    - QO015
  - type: missing-source
    severity: minor
    topic: legal-regulatory
    missingEvidence: Systematic legal and regulatory search coverage across state courts, federal courts, and agency databases tied to Avoca and founders.
    whyItMatters: No material issue surfaced in retrieved media, but absence of a structured legal search is not the same thing as a clean diligence result.
