- id: capital-history
  title: Funding History, Investors, and Strategic Backing
  body: |-
    Avoca’s capital story is one of the clearest parts of the public record. The company announced on April 27, 2026 that it had raised more than $125 million across Seed, Series A, and Series B rounds at a $1 billion valuation. Multiple independent retellings corroborate that Meritech and General Catalyst led the Series B while Kleiner Perkins led the Series A, with Amplify Partners, Nexus Venture Partners, and Y Combinator also disclosed as backers.

    PitchBook adds useful structure to the early timeline by showing a $500,000 accelerator round in 2023, a $10.3 million seed round in October 2024, an undisclosed-amount Series A dated June 26, 2025, and a $125 million Series B on April 27, 2026. Those private-market databases should not be treated as primary evidence for economics the company has not independently published, but they are directionally consistent with the official fundraising narrative and helpful for reconstructing the chronology.

    The investor set is strategically relevant, not just decorative. Kleiner Perkins frames Avoca as infrastructure for a huge offline services economy, while Amplify uses the company as a flagship case for vertical AI that owns the first customer interaction and compounds proprietary workflow data. That framing supports a thesis that Avoca is being underwritten not merely as a call-center tool but as a category-defining application-layer AI company for service operations. The open diligence questions are cap-table specifics, ownership concentration, and governance rights, none of which are public.
