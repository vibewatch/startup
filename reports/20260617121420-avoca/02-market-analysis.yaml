callouts:
- calloutType: strength
  title: Structural tailwinds are durable and multi-layered
  body: A labor shortage that predates AI, a $317B deferred maintenance backlog concentrating inbound volume, rising homeowner response expectations, and accelerating AI adoption among top performers combine to create unusually broad and durable demand for AI front-office automation in home services. These drivers are not macro-cyclical; they compound across the next several years regardless of near-term economic fluctuations.
  claimRefs:
  - CM014
  - CM026
  - CM029
  - CM033
- calloutType: risk
  title: Trust deficit and integration dependency are real near-term adoption gates
  body: The AI trust dilemma—contractors requiring AI to match their best CSR before full adoption—is not a solvable marketing problem; it requires demonstrated performance at scale. Combined with the structural gate of FSM platform integration (operators cannot use Avoca without live CRM connectivity), these constraints limit addressable market in the near term to operators on supported platforms who have a high-urgency missed-call problem and sufficient call volume to justify the switch.
  claimRefs:
  - CM034
  - CM035
  - CM036
- calloutType: insight
  title: No authoritative standalone TAM exists; investor framing requires decomposition
  body: Kleiner Perkins and Amplify cite multi-trillion dollar services economy figures that represent the full home services sector, not the AI front-office automation layer. The relevant SAM—customer support automation for home services—is estimated at tens of billions by KP but with no published methodology. Investors and diligence teams must build their own bottom-up sizing from workforce data, platform footprints, and per-operator spend proxies rather than relying on top-down analyst reports.
  claimRefs:
  - CM006
  - CM007
  - CM039
  - CM040

