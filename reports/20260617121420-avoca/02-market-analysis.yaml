  title: Market Analysis
  summary: The home services front-office AI market sits at the intersection of a $500B+ home services economy, a 13.3%-CAGR field-service-management software market reaching $11.78B by 2030, and tens of billions in annual call-center and answering-service spend by trade contractors. Avoca's relevant TAM is constrained by CRM-integration requirements and SMB operator budgets, but structurally advantaged by a skilled-trades labor shortage, $317B in deferred maintenance demand, and an AI adoption surge where high-confidence operators now use AI tools at 88% versus 27% for low-confidence peers.
sections:
- id: market-boundary
  title: Market Boundary, Status Quo, and Adjacent Segments
  body: |-
    Avoca competes at the intersection of three spend categories: home services front-office staffing (CSRs, dispatchers, answering services), field service management (FSM) software, and AI-powered business automation. The primary market is the labor and vendor cost that home services operators incur to handle inbound calls, book jobs, and follow up on unsold estimates—activities that account for roughly 90% of revenue entry points in the trades.

    The status quo is heterogeneous. Single-truck owner-operators often answer calls themselves or rely on voicemail during jobs. Growing independents typically hire one or two CSRs or contract with a live answering service or offshore call center. Larger regional and national brands run dedicated CSR teams, supplemented by task management platforms. In every segment this status quo carries a structural flaw: call volume is peaky (weather-driven, emergency-driven), and human CSRs are the bottleneck. Published data from Avoca and corroborating industry sources consistently put the missed call rate for unassisted home services businesses at 20–40%, with each missed call representing a booking opportunity worth hundreds to thousands of dollars.

    Adjacent markets that Avoca does not primarily address include back-end field dispatch (routing and scheduling optimization), technician productivity tools (time tracking, mobile forms), and broad horizontal CRM platforms. The field service management market is adjacent and important because Avoca must integrate into FSM platforms—ServiceTitan, Jobber, Housecall Pro—to function, making FSM incumbents both integration dependencies and indirect competitive references. Excluded from the core market boundary but worth tracking as adjacencies: national call-center BPO vendors, broader SMB marketing automation, and home services marketplace platforms (Angi, Thumbtack) that generate leads but do not handle inbound voice.
