  evidenceGaps:
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: An independent third-party TAM analysis specific to AI voice agent automation in US home services with explicit scope definition, methodology, and bottom-up sizing.
    whyItMatters: All current market size estimates come from Avoca's investors (KP, Amplify) with no stated methodology; absence of independent sizing makes it impossible to triangulate or pressure-test the TAM.
    diligencePath: Commission a targeted market sizing from an independent research firm or request KP's internal sizing model through diligence.
    relatedQuestionRefs:
    - QM002
  - type: missing-source
    severity: material
    topic: AI-adoption
    missingEvidence: An independent survey or third-party study on actual AI CSR penetration rate, churn, and payback period among US home services businesses as of 2026.
    whyItMatters: Current adoption data comes from platform-affiliated surveys (Jobber, ServiceTitan) which may overstate AI adoption among their already-digitized customer bases; independent penetration data would validate the TAM claim.
    diligencePath: Obtain a third-party market research study or commission a random-sample operator survey across ServiceTitan, Jobber, and non-platform users.
    relatedQuestionRefs:
    - QM005
    - QM022
  - type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: A systematic 50-state regulatory scan covering AI voice recording disclosure laws, call consent requirements, and consumer protection obligations applicable to AI voice agents deployed by home services operators.
    whyItMatters: Multi-state operators (roofing groups, HVAC brands) face potentially variable compliance obligations for AI voice recordings; a material regulatory issue in one state could restrict expansion or require product changes.
    diligencePath: Engage a regulatory counsel with telecom and consumer protection expertise to survey state-level AI voice and recording disclosure requirements.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: minor
    topic: sizing-conflict
    missingEvidence: A reconciliation of Kleiner Perkins' "tens of billions" and Amplify's "multi-trillion" market characterizations, both of which reference different scope boundaries without explicit methodology.
    whyItMatters: Investors using different scope definitions to describe the market opportunity makes it impossible to extract a shared, defensible SAM from investor thesis alone.
    diligencePath: Request internal market-sizing models from KP and Amplify through diligence; separately build a bottom-up model using BLS and FSM platform data.
    relatedQuestionRefs:
    - QM015
    - QM016
