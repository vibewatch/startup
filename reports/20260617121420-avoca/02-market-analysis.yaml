- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Factor
  - Direction
  - Timing
  - Implication for Avoca
  - Diligence Ask
  rows:
  - - Skilled-trades labor shortage (5 leaving per 2 entering)
    - Driver
    - Current and persistent through 2030+
    - Operators structurally understaffed; AI automation is cost-effective substitute
    - Confirm labor-market data with sector-specific turnover studies; measure impact on CSR hiring specifically
  - - Deferred maintenance backlog ($317B exposure)
    - Driver
    - Near-term (2026–2027) as pent-up demand releases
    - Call volume spike will exceed human CSR capacity; AI handles overflow
    - Validate backlog data from ServiceTitan survey; measure actual call volume growth in Q1–Q2 2026
  - - AI adoption maturation in home services (88% of top performers using AI)
    - Driver
    - Current and accelerating
    - Market moving from early adopter to early majority; window for category leadership
    - Independent survey or third-party adoption study to corroborate Jobber 2026 data
  - - Homeowner response-time expectations rising (70%+ want same-day)
    - Driver
    - Current
    - Raises stakes for every missed call; closes the case for always-on AI answering
    - Corroborate with independent consumer survey; test if expectations vary by trade vertical
  - - BLS trade workforce growth (HVAC +8%, Electricians +9% through 2034)
    - Driver
    - 2024–2034
    - Expanding worker base means more businesses needing front-office support
    - Track whether new-business formation outpaces existing-business consolidation
  - - AI trust dilemma (contractor requires AI to match best CSR)
    - Constraint
    - Current; eases as proof accumulates
    - Slows initial adoption; favors players with strong track records and references
    - Obtain independent customer NPS/retention data to verify performance claims
  - - CRM integration dependency (must connect to ServiceTitan/Jobber/HCP)
    - Constraint
    - Structural; shifts as integration coverage expands
    - Limits addressable market to operators on supported platforms; concentrates risk on integration SLAs
    - Audit integration uptime and depth; confirm live-booking reliability across platforms
  - - Cost sensitivity among single-truck operators
    - Constraint
    - Current
    - Limits willingness to pay; requires fast payback proof
    - Track average contract value and time-to-ROI from customer success data
  - - 2026 macro headwinds (inflation 3.3%, weakening consumer confidence)
    - Constraint
    - Current; may moderate in H2 2026
    - May delay discretionary AI spend for marginal operators; deferred maintenance demand partially offsets
    - Monitor operator churn and deal velocity against macro indicators quarterly
  notes: "Directions and timing assessments are based on public analyst, BLS, and platform-level data through June 2026. Not all factors affect every buyer segment equally; single-location operators are most sensitive to cost constraints while national brands are most sensitive to integration and trust issues."
