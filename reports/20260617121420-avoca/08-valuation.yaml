- id: valuation-context-and-comparables
  title: Current Valuation Context and Comparable Benchmarking
  body: |-
    Avoca's valuation context is unusually sensitive to the denominator. The company disclosed only that 2025 ARR surpassed eight figures, so the $1 billion Series B can imply 100x ARR at the low end, 40x at a plausible mid-case near $25 million, or 25x at the high end around $40 million. That spread is too large for precision underwriting and makes comparable analysis more important than usual. Public and semi-public software benchmarks suggest that mature vertical SaaS companies such as Procore have generally traded in mid-to-low double-digit ARR multiples, while scaled home-services platform ServiceTitan has been discussed around low-to-mid teens ARR at far larger revenue scale.

    Avoca can still argue for a premium. Private AI-native companies have received materially higher multiples than public SaaS, especially when investors believe they are creating a new operating layer in an undigitized vertical. a16z, BVP, SaaS Capital, and Meritech all contribute to that framing. Even so, a premium does not eliminate discipline. A 2x to 5x premium over public comps still requires strong growth, high retention, and improving margin.

    The most defensible interpretation is that Avoca is priced as a forward multiple on expected 2026 or 2027 ARR rather than on current audited ARR. That can work if revenue is already above roughly $30 million and growing rapidly; otherwise the price embeds a level of optimism that exceeds the public evidence base.
