- id: exit-readiness-and-final-diligence
  title: Exit Pathways, Thesis-Break Triggers, and Final Diligence Needs
  body: |-
    Avoca has multiple plausible exit paths, but none can be underwritten confidently from public evidence alone. A strategic acquisition is the nearest-term path because Avoca sits at the front-office workflow layer in home services and owns attractive assets: PE-backed enterprise relationships, training data from real call flows, ServiceTitan-centered operational integrations, and a North America-based HITL capability. Continued private compounding into a larger Series C is also plausible if the growth data validate the premium multiple. IPO remains the longest-duration path because the company would need substantially more scale, audited GAAP history, and clearer margin structure.

    The largest diligence blockers are straightforward and unforgiving. Investors need exact quarterly ARR, NRR and GRR by cohort, gross margin broken between software and HITL labor, the full cap table and preference stack, ServiceTitan contract terms, and customer concentration by account. These are not nice-to-have requests; they are the minimum inputs required to know whether the $1 billion headline valuation reflects real compounding economics or simply a premium narrative.

    The central thesis-break trigger is competitive compression from ServiceTitan. If the incumbent platform bundles native AI voice at no additional cost, Avoca's ROI story becomes harder to defend and its exit multiple would likely compress immediately. That single dependency is why public strategic interest should not be confused with public underwriting sufficiency.
