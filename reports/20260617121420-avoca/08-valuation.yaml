sections:
- id: recommendation-and-entry-discipline
  title: Recommendation, Confidence, and Entry Discipline
  body: |-
    The public evidence supports strategic interest in Avoca but not unconditional willingness to invest at the disclosed $1 billion post-money Series B mark. Avoca clearly has institutional validation: Meritech Capital, General Catalyst, Kleiner Perkins, Amplify Partners, and Y Combinator all appear in the capital stack, while multiple independent news reports corroborate the $125 million-plus financing and unicorn valuation. That matters because sophisticated growth investors rarely price a home-services workflow company as category-defining unless they believe the company can compound into a much larger platform.

    The problem is that the public record remains far thinner than the valuation implies. Avoca's only disclosed financial datapoint is that it crossed eight figures of ARR in 2025. That phrase can mean $10 million or $90 million-plus, and the difference is the difference between a stretched but plausible premium multiple and an extreme bubble multiple. Public materials also omit cohort retention, gross margin, CAC payback, burn, debt, and liquidation preference details.

    On that basis, the correct recommendation is conditional interest with low confidence and high risk. The company-quality thesis is credible, but the entry price is only defensible if the data room narrows ARR into the upper portion of the disclosed range and shows durable expansion economics. Without that confirmation, investors are effectively paying bull-case pricing before seeing the bull-case numbers.
  claimRefs:
