  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: ARR growth and financial trajectory
    missingEvidence: Exact ARR, quarterly growth, contraction, expansion, burn, and forward plan are not publicly disclosed beyond the eight-figure 2025 ARR statement.
    whyItMatters: Without precise revenue trajectory data, investors cannot know whether the $1B mark represents a premium but rational forward multiple or an extreme overvaluation.
    diligencePath: Request billing-system exports, board deck revenue bridges, and finance-model support for quarterly ARR through Q2 2026.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV023
    - QV024
  - type: private-evidence-only
    severity: blocking
    topic: gross margin and HITL cost structure
    missingEvidence: No public disclosure breaks out AI infrastructure cost, HITL labor, implementation expense, or customer success burden inside gross margin.
    whyItMatters: The distinction between software-like and service-like gross margin is a primary determinant of the terminal multiple applicable to Avoca.
    diligencePath: Request GAAP income statements, departmental COGS allocations, and margin bridge analysis for FY2024 FY2025 and TTM June 2026.
    relatedQuestionRefs:
    - QV019
    - QV020
  - type: private-evidence-only
    severity: material
    topic: cap table and liquidation preference
    missingEvidence: Public materials do not disclose the security stack, liquidation preferences, participation rights, or any secondary transactions.
    whyItMatters: Exit returns cannot be modeled accurately from headline valuation alone when preference terms may materially alter proceeds to new investors.
    diligencePath: Request the full cap table, liquidation waterfall, and side-letter summary from counsel.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: comparable valuation table coverage and current 2026 private benchmarks
    missingEvidence: Publicly accessible 2026 institutional benchmark data for private vertical SaaS and AI workflow valuations remains thin, fragmented, or generalized rather than Avoca-specific.
    whyItMatters: Fresh private benchmark data would narrow the judgment band between a justified AI premium and an undisciplined late-stage mark.
    diligencePath: Supplement public research with investor letters, secondary market color, and proprietary valuation datasets under diligence.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV030
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: NRR and customer retention by cohort
    missingEvidence: No cohort-level GRR or NRR data is publicly available for enterprise, platform, or SMB customer segments.
    whyItMatters: Retention determines whether the company is compounding efficiently enough to deserve a premium multiple and whether PE-platform concentration is manageable.
    diligencePath: Request monthly cohort retention tables, renewal schedules, and top-customer ARR movement by quarter.
    relatedQuestionRefs:
    - QV012
    - QV024
