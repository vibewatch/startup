company:
  name: Avoca
chapter:
  number: 8
  title: Valuation
  summary: >-
    Avoca's $1 billion Series B valuation is strategically understandable but financially under-evidenced in the public record. The company has real proof points: more than $125 million raised, a top-tier syndicate led by Meritech Capital and General Catalyst with Kleiner Perkins and Amplify support, disclosed eight-figure 2025 ARR, enterprise traction with PE-backed home-services operators, and a differentiated AI-plus-HITL workflow product embedded into ServiceTitan-heavy customer environments. Those facts support a category-creation argument in a large, still-undigitized services market. The problem is underwriting precision. Public evidence does not disclose exact ARR, growth rate, NRR, CAC, gross margin, burn, cap table, or preference stack, so the same $1 billion mark can imply anything from roughly 10x to 100x ARR depending on where revenue sits inside the eight-figure band. Scenario work therefore matters more than point estimates: the bull case can defend the price only if ARR is already above roughly $30 million and compounding above 50 percent with improving margins, while the base and bear cases imply down-round or write-down risk. Recommendation: conditional interest only after data-room verification of ARR, retention, margins, and ServiceTitan dependency terms.
