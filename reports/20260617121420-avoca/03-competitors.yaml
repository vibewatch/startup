callouts:
- calloutType: risk
  title: ServiceTitan build-vs-partner inflection
  body: |-
    ServiceTitan currently partners with Avoca rather than competing, but it has the installed base, real-time dispatch data, and technical resources to build or acquire a competing AI voice product. If ServiceTitan moves from partner to competitor, the integration advantage that Avoca commands flips into a platform liability. This is the single highest-severity risk in the competitive landscape and warrants close monitoring of ServiceTitan's product roadmap through 2026–2027.
  claimRefs:
  - CP018
  - CP021

- calloutType: strength
  title: No direct competitor matches Avoca's full four-quadrant capability stack
  body: |-
    No competitor in the field simultaneously offers AI-native inbound voice, outbound campaign automation, a human-in-the-loop escalation program, and FSM-integrated analytics in a single platform purpose-built for home services. This four-quadrant capability gap gives Avoca a defensible position against both commoditized AI tools and bundled FSM features—so long as it maintains integration depth and the compound data moat continues to compound faster than competitors can replicate.
  claimRefs:
  - CP031
  - CP027
  - CP021

