  - FP001

- id: direct-ai-voice-competitors
  title: Direct AI Voice and Answering Automation Competitors
  body: |-
    Rosie AI is the most direct SMB price-point competitor. Launched as an AI answering service starting at $49/month for 250 monthly minutes, Rosie targets solo operators and micro-businesses—explicitly "small businesses who can't always answer the phone"—that Avoca's enterprise pricing and sales motion does not prioritize. As of mid-2026, Rosie reports 1,900+ local business customers and 3.1 million calls handled, making it a real market presence in the sub-$150/month price tier. Rosie's differentiation is simplicity (set up in minutes from a Google Business Profile) and affordability rather than deep FSM integration or outbound workflow automation. At the Scale plan ($149/month), Rosie adds calendar appointment booking and warm transfers, beginning to overlap with Avoca's basic booking capability, but without native ServiceTitan dispatch integration.

    GoodCall represents a different threat: a horizontally-deployed AI phone agent platform with Google AI roots, pricing at $79–$249/agent/month with unlimited minutes included, and a reported 42,000+ business customers spanning restaurants, salons, home services, and enterprise clients. GoodCall's enterprise breadth is both its selling point and its limitation in home services: it lacks the vertical ServiceTitan integration and multi-location operator playbook that Avoca has purpose-built. GoodCall's 60+ million voice agent interactions demonstrate real scale but in a horizontal market.

    Smith.ai uses a hybrid model—live North America-based human receptionists augmented by AI—and explicitly positions itself against purely automated tools. Its pricing is not public and requires direct sales contact, indicating a significantly higher per-handled-call cost than AI-native alternatives. Smith.ai serves law firms, medical practices, home services, and real estate, making it a premium-tier answering service rather than a vertically-specialized AI automation competitor.

    Signpost offers an AI Voice Receptionist specifically aimed at home services contractors (electricians, HVAC, plumbing, roofers) with combined AI SMS and voice capabilities. However, Signpost's public product pages do not confirm calendar integration with FSM dispatch boards such as ServiceTitan, limiting its competitive relevance for complex multi-location booking workflows.
