- id: fsm-incumbent-threats
  title: FSM Platform Incumbents as Emerging AI Front-Office Threats
  body: |-
    The most structurally important competitive threat to Avoca is not small AI voice startups but FSM incumbents that can bundle AI front-office features into subscriptions already deployed across 100,000+ operator accounts. Housecall Pro launched a CSR AI module as part of its "AI Team" suite in late 2025 and 2026. The CSR AI feature answers calls and books jobs 24/7 from within the HCP platform, included in subscriptions starting at $59/month—a compelling bundle for operators already using HCP who do not want a separate vendor relationship. The critical limitation is that HCP's AI front-office only serves HCP platform customers and books only into HCP's own dispatch board, preventing adoption by the ServiceTitan-heavy HVAC and plumbing operators that form Avoca's core market.

    Jobber similarly launched an AI Receptionist for home service businesses, advertised as 24/7 call answering and job booking on the Jobber platform. Jobber pricing starts at $29/month (Core) and reaches $699/month (Connect annually), with the AI Receptionist available in higher-tier plans. Like HCP's CSR AI, Jobber's AI Receptionist is platform-native and does not offer ServiceTitan integration.

    Hatch (usehatchapp.com) occupies an adjacent but largely complementary position. Its platform focuses on outbound AI—estimate follow-up, rehash campaigns, and lead re-engagement—and integrates natively with ServiceTitan. The publicly documented case of Bone Dry Roofing closing $7 million in rehash revenue using Hatch validates the outbound AI category but does not overlap with Avoca's inbound booking core. Operators can and likely do run both simultaneously. ServiceTitan itself published a detailed guide in March 2026 on AI voice agents in HVAC but does not offer a standalone AI voice product as of that date, preferring the partner ecosystem model.

    Workiz, a field service management platform for HVAC, locksmiths, plumbing, and junk removal, competes in the FSM layer rather than AI voice automation, making it an adjacent platform threat rather than a direct AI call-handling competitor. CallRail's Voice Assist feature handles AI-based call qualification but is built for marketing analytics and lead attribution, not home-services-vertical booking automation.
