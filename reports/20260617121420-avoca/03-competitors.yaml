- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Threat Scenario
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - ServiceTitan native integration depth
    - ServiceTitan builds or acquires its own AI voice layer
    - Critical
    - Diversify integrations (Jobber, HCP); ensure partnership contractually protected
  - - Compound data advantage (call-booking-outcome records)
    - Competitors add per-business fine-tuning; data advantage commoditizes
    - High
    - Verify whether Avoca's fine-tuning is operator-specific vs. generic; measure booking-rate improvement curve
  - - Multi-location enterprise track record
    - HCP CSR AI or Jobber AI scales to PE-backed multi-brand operators
    - Medium
    - Maintain upmarket positioning; deepen analytics/coaching differentiator
  - - Human-in-loop escalation quality
    - Competitors add HITL programs; trust gap closes
    - Medium
    - Proprietary training program and outcome-tracking are harder to replicate than technology alone
  - - AI commoditization at low price point
    - Rosie-class tools make AI answering a $49/month commodity; operators stop paying premium
    - High
    - Avoca must demonstrate persistent ROI premium through analytics and workflow depth vs. cheaper alternatives
  - - Channel / distribution through partners (Nexstar, ServiceTitan)
    - Partners reduce referral flow or launch competing products
    - Medium
    - Contractual channel terms; own direct outbound GTM to reduce partner dependency
  notes: "Severity ratings are qualitative assessments based on available public evidence as of June 2026; not based on internal company risk disclosures."

