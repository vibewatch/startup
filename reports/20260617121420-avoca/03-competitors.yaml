  evidenceGaps:
  - type: missing-source
    severity: material
    topic: adverse evidence
    missingEvidence: No independent third-party churn or customer retention data for AI voice automation tools in home services; no published head-to-head performance benchmarks comparing booking accuracy and call handling quality across Avoca, Rosie, HCP CSR AI, and GoodCall.
    whyItMatters: Without retention and accuracy benchmarks, the claim that Avoca outperforms competitors on ROI cannot be independently verified by an investor; it rests solely on company-authored materials.
    diligencePath: Commission or locate independent G2, Capterra, or industry-association benchmark study; request cohort-level retention data from Avoca directly in diligence.
    relatedQuestionRefs:
    - QP009

  - type: private-evidence-only
    severity: material
    topic: competitor pricing
    missingEvidence: Avoca, Smith.ai, AnswerConnect, and Signpost do not publish pricing; without this data the buyer's make-vs-buy and switch-vs-stay decision economics cannot be independently modeled.
    whyItMatters: Pricing opacity for both Avoca and key substitutes makes it impossible for an investor to independently verify whether Avoca's price premium over Rosie-class tools is justified by ROI or reflects market power.
    diligencePath: Obtain Avoca pricing tiers and average contract value in due diligence; probe customer interviews for price sensitivity and churn triggers.
    relatedQuestionRefs: []

  - type: missing-source
    severity: material
    topic: regulatory risk
    missingEvidence: No public analysis found of state-level regulatory requirements for AI voice recording and consent disclosures that would apply to home services operators using Avoca across multi-state footprints; no legal opinion or enforcement action located as of June 2026.
    whyItMatters: If AI voice tools require explicit consent disclosures in California (CCPA voice), Florida (two-party consent), or other states, multi-location operators may face compliance friction that slows adoption or creates liability.
    diligencePath: Commission legal analysis of AI voice recording consent requirements across key Avoca operator states; review Avoca's ToS and privacy policy for disclosure practices.
    relatedQuestionRefs:
    - QP017

  - type: missing-source
    severity: minor
    topic: FSM incumbent roadmap
    missingEvidence: No public roadmap or product announcement found from ServiceTitan indicating whether it plans to launch a standalone AI voice product in 2026–2027 or deepen its Avoca partnership.
    whyItMatters: ServiceTitan's build-vs-partner decision is the highest-severity competitive risk in this analysis; without roadmap evidence, the risk cannot be sized with precision.
    diligencePath: Monitor ServiceTitan product announcements; check conference talks (ServiceTitan Pantheon 2026); review investor commentary on ServiceTitan's AI strategy.
    relatedQuestionRefs: []

  - type: enumeration-incomplete
