sections:
  - id: risk-overview-severity-map
    title: Risk Overview and Severity Map
    body: >
      Avoca's risk profile reflects the intersection of a novel AI category, a concentrated customer
      base, and a regulatory environment that is actively recalibrating consent rules for AI-generated
      voice. The company is not facing a single dominant risk; it faces at least four independently
      material exposures that can interact. TCPA/FCC-24-17A1 compliance for outbound AI calling is the
      most acute regulatory exposure, because the February 2024 FCC declaratory ruling creates per-call
      penalty liability across every Avoca customer running outbound campaigns without verified prior
      written consent. ServiceTitan platform dependency is the most acute operational exposure; Avoca's
      core booking capability relies on ServiceTitan APIs while ServiceTitan simultaneously develops
      competing AI voice features. PE-platform revenue concentration creates correlated churn risk: a
      single vendor-preference decision by a platform operator removes dozens of brand deployments
      simultaneously. And narrative-versus-disclosure risk is the most structurally persistent:
      Avoca's $1B valuation rests on company-produced outcome metrics that no independent party has
      audited. The risk heatmap below maps likelihood against impact across all risk categories,
      and the transmission map shows how regulatory, quality, and dependency failures cascade into
      revenue, customer, and financing outcomes.
    claimRefs:
      - CR001
      - CR002
      - CR018
      - CR024
      - CR036
    figureRefs:
      - FR001

  - id: regulatory-tcpa-privacy-risk
    title: Regulatory, TCPA, and Privacy Risk
    body: >
      The Telephone Consumer Protection Act (47 U.S.C. § 227) prohibits initiating calls using an
      artificial or prerecorded voice to any telephone number without prior express consent, subject to
      limited exceptions for existing business relationships. The FCC's February 2024 declaratory ruling
      (FCC-24-17A1) explicitly extended this prohibition to AI-generated voice calls, closing a gap that
      some vendors had previously exploited. The ruling creates a direct compliance obligation for any
      platform initiating AI voice outreach on behalf of service businesses, which describes Avoca's
      Speed-to-Lead and Outbound Campaigns modules precisely. Violations carry $500 per call for
      inadvertent violations and up to $1,500 per call for willful violations; TCPA class actions have
      been filed based on outreach volumes of tens of thousands of calls, making aggregate exposure
      potentially very large for any operator running high-volume AI outbound campaigns.

      Avoca's privacy policy (avoca.ai/legal/privacy-policy) acknowledges data collection but does not
      publish SOC 2 Type II, ISO 27001, HIPAA, or CCPA compliance certifications. The docs.avoca.ai
      security page was not publicly accessible as of June 2026 (HTTP 404), meaning investors cannot
      independently confirm the security controls Avoca maintains over homeowner PII. Multiple US state
      privacy laws (CCPA in California, CDPA in Virginia, CPA in Colorado) create data subject rights
      that apply to residents whose contact information Avoca processes. Avoca's terms-of-service URL
      (avoca.ai/terms) also returned 404 in June 2026, meaning the contractual liability structure for
      AI errors is currently undiscoverable from the public record. The FTC and FCC both list robocall
      and AI calling enforcement as top consumer-protection priorities in 2026, heightening the risk
      that a customer complaint could escalate to formal enforcement. No public lawsuit or regulatory
      action against Avoca or its customers has been identified in the public record, but absence of
      evidence is not evidence of compliance given the novelty of the 2024 ruling.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
    tableRefs:
      - TR001

  - id: ai-quality-hallucination-trust-risk
    title: AI Quality, Hallucination, and Trust Risk
    body: >
      Avoca claims 80-85% autonomous AI call handling across its inbound deployments, with the remaining
      15-20% escalated to human CSRs via its HITL tier. These figures appear in company-produced product
      pages and case studies; no independent measurement or audit has been identified. The absence of
      independent reviews on G2, TrustRadius, and Capterra — each of which returned access-restricted
      or 404 responses in June 2026 — means there is no third-party user-feedback signal to cross-check
      Avoca's performance claims. AI voice agents booking service appointments face a qualitatively
      distinct hallucination risk from general-purpose language model uses: a false commitment
      (misquoted pricing, unavailable time slot, incorrect service scope) creates an immediate customer
      dispute and potential refund liability for the operator. Avoca's HITL blog acknowledges that some
      call scenarios require human judgment, including complex upsells, distressed or non-English
      speakers, and non-standard service requests, which implies the AI's scope boundary is actively
      managed rather than unlimited.

      Customer outcome metrics — 20% year-over-year revenue lift at Yost & Campbell, 90% call-volume
      automation at Sila Services, 70% revenue growth at HL Bowman — all originate from Avoca-produced
      case studies with no independent corroboration. If any of these figures are based on methodology
      choices that do not survive audit (attribution window, baseline selection, concurrently running
      changes), the trust case for the product deteriorates rapidly. The Hacker News thread for Avoca's
      April 2026 funding raised questions about how booking-rate attribution is measured when AI handles
      a call that a live CSR would also have handled successfully. Trust in AI-first products ultimately
      depends on transparent performance measurement; Avoca's current public disclosure level does not
      yet support that standard.
    claimRefs:
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
    tableRefs:
      - TR002

  - id: integration-platform-dependency-risk
    title: Integration and Platform Dependency Risk
    body: >
      Avoca's core booking function — routing calls, querying live capacity, and writing job records —
      depends on real-time API access to field service management platforms. ServiceTitan holds an
      estimated 40%+ share of the US HVAC and plumbing FSM market, making it Avoca's most critical
      integration counterparty. Avoca's API documentation and ServiceTitan's developer portal both show
      tight integration via booking, dispatch, CRM sync, and capacity-management endpoints; if
      ServiceTitan changes pricing, introduces rate limits, or revokes Avoca's marketplace listing, the
      core product is materially impaired. ServiceTitan's developer portal and marketplace both carry
      standard SaaS terms that reserve unilateral modification rights. The competitive overlap is
      significant: ServiceTitan published a blog in 2024-2025 describing its own AI voice agent for
      HVAC booking, and the Avoca listing on the ServiceTitan marketplace places these two products in a
      visible dependency-and-competition tension.

      Avoca does mitigate this risk through breadth — its integrations page shows 40+ FSM platforms
      supported — but the depth of integration with ServiceTitan is materially greater than with
      alternatives, and the majority of high-value PE-backed platform customers likely run on
      ServiceTitan. The Avoca npm SDK and API documentation confirm that third-party developers can
      build custom integrations, which is an indirect durability signal, but custom integrations create
      their own maintenance surface. A scenario in which ServiceTitan offers equivalent AI voice
      functionality to its customer base at zero marginal cost (as a platform feature) would eliminate
      the TAM segment that represents Avoca's highest-value deployment targets. No public contract terms
      between Avoca and ServiceTitan have been disclosed.
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
    tableRefs:
      - TR003
    figureRefs:
      - FR003

  - id: customer-concentration-pe-risk
    title: Customer and Revenue Concentration Risk
    body: >
      Avoca's co-founders disclosed in April 2026 that the company is live in over half of the top 30
      PE-backed home-service platforms in the US. This distribution strategy has a structural risk
      embedded in its success: each PE platform is simultaneously a high-value customer and a channel
      partner, meaning a single vendor-preference decision at the platform level removes all acquired
      brands from Avoca simultaneously. Sila Services (40+ brands, 3,000+ employees) is the largest
      publicly named customer; a Sila exit would represent the equivalent of dozens of concurrent
      individual-brand churns. Avoca's April 2026 funding announcement and co-founder interview
      acknowledge that ownership changes — particularly PE acquisitions of incumbent Avoca customers —
      can trigger vendor reviews. No customer revenue concentration disclosure (top-3 or top-5 share)
      exists in the public record; the cumulative ARR contribution of the top three customers is
      unknown from public sources. Amplify Partners' thesis letter explicitly highlights Avoca's PE
      land-and-expand model as a growth driver, but the same model that accelerates expansion creates
      correlated loss exposure. A consolidating home-services PE market could produce fewer, larger
      platforms with even greater negotiating leverage over technology vendors.
    claimRefs:
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
    tableRefs: []

  - id: people-org-scaling-execution-risk
    title: People, Org Scaling, and Execution Risk
    body: >
      Avoca's headcount ranges from 100 to 190 across public sources as of June 2026, reflecting rapid
      post-Series B hiring. The forward-deployed engineer (FDE) model — in which an Avoca engineer
      travels onsite to each new customer to build deployment-specific booking logic, seasonal rules, and
      membership tiers — creates a direct labor-to-growth dependency. Each new enterprise deployment
      requires onsite FDE time; doubling the customer base requires roughly doubling FDE headcount unless
      the model is systematically productized. Avoca's workforce-evolution blog discusses the transition
      from a heavily manual deployment model toward more automated configuration tooling, but the pace
      and completeness of that transition are not publicly documented. Axios's 2026 funding article
      reports accelerated hiring after the April 2026 Series B but does not break down functional
      allocation. The institutional knowledge concentration risk in the founding team and early
      engineers is material: both founders are operationally central, and no governance succession or
      leadership depth below the co-founder layer has been publicly disclosed.
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
    tableRefs:
      - TR004

  - id: competitive-valuation-cyclicality-disclosure-risk
    title: Competitive, Valuation, Cyclicality, and Disclosure Risk
    body: >
      ServiceTitan, HouseCall Pro, and Jobber have collectively more than 200,000 small-business
      customers and are each actively building native AI call-handling or receptionist capabilities.
      ServiceTitan's AI voice agent blog post targets inbound HVAC and plumbing booking — the exact use
      case Avoca monetizes. If major FSM platforms bundle AI voice as a zero-marginal-cost feature, the
      switching cost argument for Avoca erodes: customers already pay ServiceTitan for dispatch and
      CRM; adding a native AI receptionist feature eliminates the integration step that currently
      differentiates Avoca. Avoca's $1B valuation implies a 10x+ ARR multiple on eight-figure ARR.
      TechCrunch and Axios Series B coverage is based on Avoca's press release; neither publication
      independently verified ARR, NRR, or growth rate. The Hacker News comment thread on the funding
      round raised questions about booking-lift methodology. Avoca's stated path to $1B in jobs booked
      in 2026 carries no disclosed methodology, and no third party has corroborated this figure.
      Macroeconomically, home services demand tracks housing transactions, consumer confidence, and
      disposable income; a housing-market slowdown reduces emergency call volume for trades, the
      highest-value use case for AI booking. ServiceTitan's AI voice blog cites peak-season capacity
      management as the primary driver — a cyclical demand signal. Avoca has not publicly disclosed ARR
      growth rate, NRR, or payback period, which means the investor must underwrite the valuation on
      company-provided anecdote rather than normalized unit economics.
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
    figureRefs:
      - FR002

  - id: kill-criteria-and-monitoring
    title: Kill Criteria and Monitoring
    body: >
      Four thesis-break events are the highest priority monitoring targets. First: a TCPA class-action
      lawsuit naming an Avoca customer (or Avoca itself) for AI voice calls placed without verified
      prior written consent. Such an action would prompt regulatory review of all Avoca-powered
      outbound campaigns and materially increase compliance cost for all customers. Second: a
      ServiceTitan API restriction, pricing change, or competitive product launch that impairs Avoca's
      core booking functionality or eliminates the integration differentiation. Third: a revenue-
      concentration event in which one of the top three PE platform customers exits, reducing ARR
      materially in a single quarter. Fourth: a public security or data-handling incident involving
      homeowner PII processed by Avoca's platform. The HITL program is the primary quality mitigation
      but introduces per-call labor cost that scales with volume; if HITL volume increases materially,
      unit economics deteriorate. Avoca's npm SDK and documentation breadth support third-party
      integration durability, but API breaking changes from FSM partners remain a structural fragility.
      Monitoring indicators should include: public TCPA enforcement actions referencing AI voice in
      home services; ServiceTitan marketplace listing status; customer case-study freshness and volume;
      public G2/Capterra reviews (currently inaccessible); and any disclosed headcount restructuring
      following the Series B hiring cycle.
    claimRefs:
      - CR043
      - CR044
      - CR045
      - CR046
      - CR047
    tableRefs:
      - TR005

