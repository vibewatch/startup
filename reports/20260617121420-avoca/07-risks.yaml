chapter:
  number: 7
  title: Risks
  summary: >
    Avoca's residual risk stack is anchored by three structural exposures: TCPA/FCC-24-17A1 compliance
    for AI-generated outbound voice, unconfirmed security certifications, and critical API dependency on
    ServiceTitan whose AI voice roadmap overlaps Avoca's core product. PE-platform customer concentration
    creates correlated churn risk, FDE-model scaling constrains growth velocity, and an unaudited $1B
    valuation rests on company-produced metrics. The regulatory, platform, and quality risks are each
    independently material; investors should require TCPA counsel review of outbound consent workflows,
    independent security audit disclosure, and ServiceTitan contract terms before underwriting.

