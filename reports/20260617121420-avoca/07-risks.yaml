  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Top-3 or top-5 customer ARR share; total customer count with revenue-band distribution;
        any stated customer concentration policy.
      whyItMatters: >
        Without concentration data, investors cannot assess the step-down churn risk from PE
        platform vendor changes or the dependency on Sila Services and similar mega-customers.
      diligencePath: >
        Request customer revenue concentration waterfall in data room; minimum: top-1, top-3,
        top-5, and top-10 ARR shares; churn waterfall by customer cohort.
      relatedQuestionRefs:
        - QR012

    - type: access-blocked
      severity: material
      topic: ai-quality
      missingEvidence: >
        Independent user reviews on G2, Capterra, TrustRadius, or Gartner Peer Insights;
        independently validated AI call quality benchmarks.
      whyItMatters: >
        All quality claims are company-produced; independent reviews are the only public
        signal of actual performance vs. stated metrics. Their absence creates unresolvable
        information asymmetry in public diligence.
      diligencePath: >
        Request reference calls with at least 5 named customers across different PE and
        independent deployments; request access to Avoca Coach analytics dashboard showing
        booking-rate trends over 12+ months.
      relatedQuestionRefs:
        - QR007

    - type: missing-source
      severity: blocking
      topic: security-privacy
      missingEvidence: >
        SOC 2 Type II report, ISO 27001 certificate, penetration-test summary, or CCPA/VCDPA
        compliance attestation; any prior security incident or breach notification history.
      whyItMatters: >
        Avoca processes homeowner contact data, call recordings, and CRM records. Without an
        independent security audit, PE platforms and enterprise operators cannot verify data
        governance; any breach would have reputational and regulatory consequences across
        all customer deployments simultaneously.
      diligencePath: >
        Request SOC 2 Type II or equivalent from Avoca; if unavailable, request CAIQ or
        security questionnaire responses and third-party pen-test summary.
      relatedQuestionRefs:
        - QR015

    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >
        Independently verified ARR, growth rate, NRR, and payback period; cap table with
        liquidation preferences; Series B term sheet economics.
      whyItMatters: >
        Avoca's $1B valuation is built on company-disclosed metrics that have not been
        independently audited. The implied ARR multiple (10x+) is defensible only if
        ARR growth rate, NRR, and margin trajectory can be verified.
      diligencePath: >
        Request audited or reviewed financial statements; QoQ ARR cohort data for 2024-2026;
        NRR by customer segment; gross margin by product line.
      relatedQuestionRefs:
        - QR020

    - type: missing-source
      severity: material
      topic: regulatory-enforcement-coverage
      missingEvidence: >
        Complete enforcement action registry for FCC-24-17A1 and TCPA violations involving
        AI-generated voice calls in home-services vertical; named defendant/violator list with
        penalty amounts and consent-flow descriptions for 2024–2026 actions.
      whyItMatters: >
        TR001 (regulatory/legal risk register) enumerates the principal statutory and regulatory
        instruments but cannot document post-ruling enforcement cases, open rulemaking dockets,
        or state-law analogs (CCPA, VCDPA, CPRA) with confirmed penalty precedents because no
        public regulatory compendium aggregates AI-voice enforcement actions at this specificity.
        Without this data investors cannot size the tail liability for outbound AI calling.
      diligencePath: >
        Commission FCC enforcement database search for 'artificial or prerecorded voice' actions
        post-2024; request Avoca TCPA counsel opinion letter covering outbound consent workflows;
        review FTC AI voice enforcement press releases for 2025–2026.
      relatedQuestionRefs:
        - QR001
      relatedTableRefs:
        - TR001
