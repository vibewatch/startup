  - id: TR005
    title: 缓解措施与否决标准表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - TCPA/FCC-24-17A1 外呼 AI 同意
        - TCPA 集体诉讼或 FCC 执法行动点名 Avoca 客户或 Avoca 本身
        - 任何已提交投诉，或正式 FCC/FTC 调查提及 Avoca 驱动平台发起的 AI 语音通话
        - 立即开展法律审查；在完成同意工作流审计前暂停新增外呼客户入驻
      - - ServiceTitan API 依赖
        - ServiceTitan 应用市场上架状态、API 定价变化，或 ST AI 语音产品公告
        - ST 应用市场下架、API 定价高于 $X/月，或具备预约能力的 ST AI 语音正式 GA
        - 加快非 ST 集成深度；推进 Jobber、HouseCall Pro、Workiz 的集成能力对等
      - - PE 客户集中度
        - 前三大客户 ARR 贡献趋势和平台供应商审查公告
        - 任何前三大客户宣布供应商审查；或前三大合计超过总 ARR 的 40%
        - 要求下一轮融资披露集中度；推动管理层分散客户
      - - AI 质量或信任事件
        - 首个公开投诉或评论提到虚假预约、数据误用，或高峰期宕机
        - 任何已确认 AI 幻觉事件导致客户退款要求或公开评论；或状态页显示宕机 >4 hrs
        - 要求独立质量审计和 SOC 2 路线图，作为继续支持投资的条件
      - - 安全或数据泄露
        - HHS / 州 AG 泄露通知；数据事件新闻报道；安全研究员披露
        - 任何已披露的房主 PII 或通话录音数据未授权访问
        - 评估事件是孤立还是系统性；审查认证和赔偿覆盖
      - - 估值 / 增长期望重置
        - ARR 增速降至同业以下；$1B jobs-booked 目标落空；公开 NRR 披露低于 100%
        - 公开或投资者披露 ARR 同比增长低于 80%；NRR 低于 110%；或 2026 年 $1B 预约工作额目标落空
        - 按更低 ARR 倍数重新承销；推动管理层提高单位经济透明度
    claimRefs:
      - CR043
      - CR044
      - CR045
      - CR046
      - CR047
    notes: |
      标有 $X 的阈值仅为示意；准确触发水平应根据尽调得出的 ARR 和集成收入数据设定，目前公开来源尚不可得。
