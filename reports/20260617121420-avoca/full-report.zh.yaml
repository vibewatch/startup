      - number: '3.5'
        title: 竞争护城河、切换成本、锁定与风险清单
        blocks:
          - type: paragraph
            body: >-
              Avoca 在 2026 年 6 月博客《Customer Experience Is the New Competitive
              Moat》中阐述的竞争护城河，建立在每个运营商部署数月后累积的电话—预约—结果记录这一复合数据资产之上。这让 Avoca 的 AI
              被定位为按单个企业自我改进：处理的电话越多，预约越好，运营商越不愿重置学习曲线。这个护城河主张可信，但需要尽调验证——尤其要确认微调是否真正按运营商定制，还是平台层面的通用能力。


              切换成本随运营商层级而不对称。低预约量、简单工作流的小型运营商切换成本低：$49/month 的 Rosie 或 GoodCall 坐席只需少量设置即可处理基础电话接听。大型多网点运营商因嵌入式工作流、CRM
              数据历史和 ServiceTitan 日历集成的技术依赖，切换成本更高。Avoca 在 Granite Comfort（九个品牌）等运营商的多品牌部署，会形成单网点工具难以复制的集成锁定复利。


              多宿主是可能的：运营商可以同时用 Avoca 处理入站 AI、用 Hatch 做外呼跟进，因为它们瞄准不同工作流步骤。这实际上也是 Avoca 的外呼合作模式。风险在于 Hatch 等竞争者最终可能扩进入站，或
              HCP/Jobber 可能把入站和外呼都捆进自家平台。


              主要战略风险是 ServiceTitan 加深自身 AI 语音能力。ServiceTitan 拥有最大的高端装机基础、实时派工板数据，以及自建或收购 AI 语音功能的财务资源。如果市场动态需要，它目前对
              Avoca 的合作姿态可能转向直接竞争。次级风险是商品化：当 AI 语音在 Rosie 类工具推动下变成标配，买方可能不再为 AI 层支付溢价，而会要求 FSM 供应商提供捆绑定价。
