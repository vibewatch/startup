              2026 年 $1B jobs-booked 目标是总预订价值指标，不是 Avoca 平台收入表述。多家媒体报道这一数字的方式，可能被误读为 Avoca
              收入。投资人必须把它当作需求流信号，而不是收入声明。Avoca 促成 $1B jobs 后实际赚取的收入，取决于订阅 take rate，而不是 jobs-booked 规模本身。
            calloutType: insight
