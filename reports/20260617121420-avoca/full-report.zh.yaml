  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 指标基础
      - 倍数 / 估值
      - 与 Avoca 的相关性
      - 局限
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of six public and private software comparables selected from cited 2024-2026 filings analyst benchmarks
        investor market maps and home-services adjacency references to frame Avoca's valuation context.
    rows:
      - - ServiceTitan（私有 FSM）
        - 直接垂直可比
        - ~$600M-$700M ARR (2024E)
        - 估值 ~$9.5B（~13-16x ARR）
        - 最直接可比：家庭服务 FSM 平台，拥有 PE 客户群，市场重叠
        - 规模不同；收入可能包含支付；无公开申报文件确认全部输入
      - - Procore Technologies（PCOR 上市公司）
        - 垂直建筑 SaaS
        - FY2024 收入 ~$1.1B
        - 7-12x ARR（2024-2025 交易区间）
        - 可比的垂直 SaaS，SMB-企业混合 GTM，工作流深度相近
        - 阶段更成熟、增长更低，且无 AI-native 定位溢价
      - - Verint Systems（VRNT 上市公司）
        - AI 客户互动平台
        - FY2024 ARR ~$640M
        - 3-5x ARR（FY2024-2025 交易区间）
        - 相邻的客户互动自动化品类，具备 AI 辅助呼叫工作流
        - 传统业务占比更高、增长更低，买方基础也不同于技工服务运营商
      - - Housecall Pro（私有家庭服务）
        - 直接垂直可比（阶段更早）
        - ~$50M-$80M ARR（估计）
        - 估值 ~$500M-$700M（估计 Series D 区间）
        - 直接的家庭服务平台参照，ARR 规模更低，垂直买方集合相似
        - 公开数据有限，产品组合的 AI-native 程度较弱
      - - Samsara（上市现场运营）
        - 相邻垂直领域，AI 加经常性收入
        - FY2025 ARR ~$1.4B
        - 10-14x ARR（2024-2025 交易区间）
        - 面向物理世界现场运营的软件，具备经常性、数据丰富的工作流
        - 品类和买方画像不同于 AI 语音预约
      - - a16z AI 企业组合 cohort（2024-2025）
        - 私有 AI 组合参照
        - Series B/C 阶段中位 ARR ~$20M-$40M
        - 顶级轮次 25-60x ARR
        - 反映同阶段 AI-first B2B 公司在私募市场的溢价
        - 样本异质，且无直接家庭服务可比对象
    notes: 可比数据来自申报文件、媒体报道和分析师基准页面。私有公司估值除非明确披露，否则均为估计，应视为方向性参照，而非已验证标记。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
  - id: TV005
    title: 破坏论点与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ServiceTitan AI voice 上线
        - ServiceTitan 宣布或交付 AI inbound booking，并对订阅客户零增量成本捆绑
        - 消除 Avoca 大部分市场的运营 ROI 主张，并制造相关性流失风险
        - 立即重评投资论点；追加资本前，要求 data room 提供合同条款和留存证据
      - - Data room 确认 ARR 不高于 $12M
        - 已确认 ARR 低于 $12M，且后续增长持平或为负
        - 估值从 AI 溢价 SaaS 重定价为困境软件，$1B 入场价无法支撑
        - 放弃按 $1B 投资；只有 ARR 倍数显著降低，或存在强硬下行保护，才考虑重新进入
      - - 净收入留存率低于 95%
        - 两个滚动 12 个月窗口的 cohort NRR 数据均低于 95%
        - 平台没有复利增长，流失超过扩张
        - 要求结构性保护，或退出本轮
      - - 确认毛利率低于 45%
        - GAAP 毛利率低于 45%，且 HITL 人工成本构成结构性天花板
        - Avoca 应被重估为服务业务，适用类似服务业倍数，而非 SaaS 倍数
        - 彻底重估论点，并以“服务而非 SaaS”提交投委会升级审议
      - - 前三大客户集中度超过 50%
        - 任一单一客户超过 ARR 的 25%，或前三大客户超过总 ARR 的一半
        - PE 平台相关性流失或采购变化，可能一次性带走大块收入
        - 签约前要求多元化里程碑和 covenant 式监控
    notes: 触发因素来自公开风险因子，反映会实质损害 $1B Series B 入场估值承销判断的阈值。
    claimRefs:
      - CV023
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 精确 ARR 和季度增长
        - 从成立至 2026 年 Q2 的已确认 ARR 和季度 ARR 明细，拆分新增、扩张、收缩和流失 ARR
        - 缺少该数据，10x ARR 区间无法收窄，隐含倍数也无法承销
        - CFO；第一项 data room 请求，并与计费系统导出交叉核对
      - - 按 cohort 拆分的净收入留存率
        - 12 个月和 24 个月窗口下，按客户 cohort 拆分的 NRR 和 GRR
        - NRR 高于 110% 验证复利增长；低于 100% 说明 ARR 基础净收缩
        - CFO / Revenue Operations；出具 cohort 留存分析
      - - 毛利率和 COGS 拆分
        - FY2024、FY2025 和截至 2026 年 6 月 TTM 的 GAAP 损益表，COGS 拆分为 AI 基础设施、HITL 人工、实施和客户成功
        - HITL 人工决定终局经济性会走向 SaaS，还是结构上停留在服务型
        - CFO；审计包或管理账
      - - 含优先权层级的股权结构表
        - 完整股权结构表，列示全部证券类型、清算优先权、反稀释条款、归属安排和二级交易
        - 优先权悬置决定投资人的真实回款和各场景结果
        - General Counsel；法律 data room 部分
      - - ServiceTitan API 合同条款
        - 商业 API 协议副本或摘要，包括数据权利、价格层级、排他性和终止条款
        - API 依赖是单一最高运营风险，可能让平台暴露在合作伙伴兼竞争对手面前
        - CEO / Legal；在 NDA 下披露合同
      - - 客户集中度报告
        - 前 10 大客户 ARR 占总 ARR 的比例，并标明任何超过 10% 的客户
        - PE 平台集中可能造成相关性流失和快速收入受损
        - Revenue Operations；CRM 导出加计费分析
    notes: 优先顺序反映信息缺口的紧迫性和阻断性；第 1-3 项是任何投资承诺前的阻断性尽调问题。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
