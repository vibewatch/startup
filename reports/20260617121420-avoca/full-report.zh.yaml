  - id: FI001
    title: Avoca 收入模型桥接 — 从客户活动到平台收入
    type: flow
    layout: wide
    summary: 展示 Avoca 平台模型中，入站需求、AI 处理、工单预约与订阅收入如何衔接，并纳入 HITL 服务层和 Coach 分析附加模块。
    approximationNotes: 节点连接来自公开产品页（avoca.ai/inbound、avoca.ai/outbound、avoca.ai/coach、HITL 博客）的结构性推断。受披露限制，收入金额和流量规模未量化。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI008
      - CI020
    data:
      nodes:
        - id: inbound-demand
          label: 入站需求
          detail: 房主来电、短信、聊天；7×24 捕获；此前 20–40% 无人接听
        - id: ai-handling
          label: Avoca AI Voice（入站）
          detail: AI 处理 80–85% 的来电；直接写入 CRM 预约；零等待
        - id: hitl-layer
          label: HITL 服务层
          detail: 位于北美的 CSR 兜底剩余 15–20% 升级来电，并接收 AI 传递的完整上下文
        - id: outbound-module
          label: Avoca 外呼活动
          detail: 多触点短信 + 语音滴灌序列，面向现有和流失客户
        - id: job-booking
          label: CRM 中预约工单
          detail: 入站 + 外呼活动转化为 ServiceTitan 或其他 FSM 中的已派工单
        - id: coach-analytics
          label: Avoca Coach 分析
          detail: 每通电话打分；暴露误分类结果；提升 CSR 表现
        - id: platform-subscription
          label: 平台订阅（ARR）
          detail: 运营商支付月度 / 年度 SaaS 费用；未公开定价；企业按网点谈判
        - id: revenue-outcome
          label: 八位数 ARR（2025）
          detail: 公司声称；具体数值未披露；范围为 $10M–$99M
      edges:
        - from: inbound-demand
          to: ai-handling
          label: 立即路由
        - from: ai-handling
          to: hitl-layer
          label: 升级 15–20%
        - from: ai-handling
          to: job-booking
          label: 直接预约 80–85%
        - from: hitl-layer
          to: job-booking
          label: 由人工 CSR 解决
        - from: outbound-module
          to: job-booking
          label: 重新激活客户并促成预约
        - from: job-booking
          to: coach-analytics
          label: 预约后每通电话打分
        - from: job-booking
          to: platform-subscription
          label: 使用量驱动价值；订阅是平台费
        - from: coach-analytics
          to: platform-subscription
          label: Coach 是附加模块（单独 ACV）
        - from: platform-subscription
          to: revenue-outcome
          label: 汇总所有运营商账户的 ARR
