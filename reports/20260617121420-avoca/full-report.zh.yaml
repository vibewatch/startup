  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览与竞争者分类
        blocks:
          - type: paragraph
            body: >-
              家政服务 AI 通信市场有六类可识别竞争者，Avoca 必须同时应对。直接 AI 原生语音工具包括 Rosie AI（面向每月低于 $200 的单人运营商）、GoodCall（横向部署的 AI 电话坐席，称已上线
              50,000+ 坐席，源自 Google AI）和 Signpost（面向 HVAC、管道和电气承包商的 AI 语音前台）。FSM 捆绑 AI 功能如今嵌入 Housecall Pro 的 CSR AI
              模块（2025–2026 年作为「AI Team」套件推出）、Jobber 的 AI Receptionist，以及 ServiceTitan 既有电话预约基础设施。Smith.ai
              等人机混合服务部署北美真人前台，与 AI 协同工作，并明确与纯自动化对位。AnswerConnect 等传统真人接听服务把自己营销为「people, not bots」，承接怀疑信任 AI 的客群。AI
              外呼和跟进工具——主要是 Hatch，聚焦报价跟进、重启营销和线索再激活——占据相邻外呼通道，不直接竞争入站预约。最大单一竞争者仍是现状：多数运营商今天使用的真人 CSR 或外包接听服务。


              Avoca 把自己定义为「AI workforce」而不是接听服务，意在把竞争比较从与 Rosie 或 Smith.ai 的价格正面对比，转向总客户体验所有权。这个定位支撑了更高价格点和比单一用途 AI
              语音工具更长的落地扩张销售动作。但它也要求 Avoca 持续证明工作流深度和数据复利，证明商品化工具无法复制。
