      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              Avoca 的买方几乎总是家政服务企业主或运营负责人，而不是 IT 买方。这与大多数企业软件交易有关键结构差异。购买决策最贴近
              P&L，由明确的收入损失计算驱动：「我因为漏接电话和跟进慢损失了多少？」而不是技术采购流程。


              Avoca 的市场可分为三类买方层级。最小端，单网点独立承包商通常只有一到三名 CSR，或根本没有专职 CSR；触发采用的是漏接电话，或旺季过度配员成本。中间层级，区域性多网点运营商（10–100+
              辆车，常有私募股权支持）拥有更成熟的 CSR 运营，会把 Avoca 的成本与 CSR 员工和呼叫中心供应商的全负荷成本比较。最大层级，全国性多品牌运营商和加盟集团可以跨数十个品牌部署
              Avoca，产生让企业经济性成立的整合 ROI；Granite Comfort 2025 年底九品牌部署体现了这一模式。


              用户（每天操作 Avoca 的人）通常是 CSR 团队，或在小店中就是企业主。付费方始终是企业主或其私募股权支持者。因此，销售动作本质上由商业 ROI 驱动，而非 IT
              门槛驱动；这会压缩销售周期，但也要求快速证明价值，通常要在部署后四到八周内给出结果。房主不是买方，却是间接需求驱动者：Jobber 2026 年调查显示，超过 70%
              房主期待当天回复，超过一半期待一小时内联系。这个预期梯度已经把绩效门槛抬高到多数 CSR 运营难以稳定达到的水平，从而加速自动化论证。
