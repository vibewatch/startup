      - number: '8.5'
        title: 退出路径、破坏投资逻辑的触发因素与最终尽调需求
        blocks:
          - type: paragraph
            body: >-
              Avoca 有多条合理退出路径，但仅凭公开证据，哪一条都无法被有信心地承销。战略收购是最近期路径，因为 Avoca 位于家庭服务前台工作流层，并握有有吸引力的资产：PE
              支持的企业客户关系、来自真实通话流的训练数据、围绕 ServiceTitan 的运营集成，以及位于北美的 HITL 能力。如果增长数据能验证溢价倍数，公司继续在私募市场复利、进入更大的 Series C
              也说得通。IPO 是周期最长的路径，因为公司还需要显著更大的规模、经审计 GAAP 历史，以及更清晰的毛利结构。


              最大的尽调阻塞点直接且严苛。投资人需要准确的季度 ARR、按 cohort 拆分的 NRR 和 GRR、软件与 HITL 人工拆分后的毛利率、完整 cap table 与优先权结构、ServiceTitan
              合同条款，以及按账户计算的客户集中度。这些不是锦上添花的请求；要判断 $1 billion 的名义估值究竟反映真实复利经济性，还是只是溢价叙事，这些是最低输入。


              破坏核心投资逻辑的触发因素，是 ServiceTitan 带来的竞争压缩。如果这个在位平台以零额外成本捆绑原生 AI 语音，Avoca 的 ROI
              叙事会更难守住，退出倍数也很可能立刻压缩。正因为存在这个单一依赖，公开的战略兴趣不应被误认为公开证据已经足够承销。
            claimRefs:
              - CV028
              - CV029
