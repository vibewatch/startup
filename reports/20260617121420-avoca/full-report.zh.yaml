          - type: callout
            title: Data room 清单：最低财务核验要求
            body: >-
              仅靠公开来源无法做任何投资承销。最低 data room 项包括：(1) 从创立到 2026 年 6 月的月度 ARR 表，按 vintage 列示 NRR 和 GRR；(2) 带 COGS 拆分和毛利率的
              GAAP 损益表；(3) trailing 12-month 现金流量表和当前现金余额；(4) ACV 分布和前 10 大客户集中度；(5) 包含所有证券类型和任何 secondary 的完整 cap
              table；(6) 带取消条款的标准 MSA / order form。财务承销的基础是这些材料，而不是公开记录。
            calloutType: insight
            claimRefs:
              - CI030
              - CI033
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合、模块地图与定位
        blocks:
          - type: paragraph
            body: >-
              Avoca 将自己定位为面向 home-service 企业的「AI front office」。截至 2026 年 6 月，公开产品界面覆盖七个不同工作流模块：(1) AI CSR——一个
              inbound-call AI agent，7×24 小时接听、处理异议，并以零等待时间直接把 jobs 预订进运营商 CRM；(2) Outbound Campaigns——多触点 SMS 和语音 drip
              序列，用来重新激活现有客户并推动复购预订；(3) Speed-to-Lead——即时、多来源 lead 响应系统，从 Google LSA、Yelp、Thumbtack、Angi、Facebook
              和网页表单摄取联系人，并在 60 秒内触发触达；(4) Simple Scheduler——给网站访客使用的自助在线预约 widget；(5) Web Chat——嵌入运营商网站的 AI agent；(6)
              Google LSA——与 Google Local Services Ads 直接集成以转化 leads；(7) Coach——通话评分和分析产品，按公司定义的 rubric
              给每通电话打分，并重新分类记录错误的结果。


              七个产品模块下方叠着 Human-in-the-Loop（HITL）服务层——一支由 Avoca 培训、位于北美的人类 CSR 团队，在 AI 升级电话时接收 warm transfer。HITL
              不是独立产品，而是嵌入平台订阅里的服务保证，确保没有电话被搁置。产品页称，从 AI 转到 HITL 时，完整对话上下文（来电者身份、服务类型、升级原因、设备年限、账户历史和通话语气）会在 3 秒内传递，且零掉线。


              公司在 YC Winter 2023 的发布，描述的是覆盖电话、短信、邮件和评价管理的更宽 SMB 通信平台。到 2025–2026 年，产品已完全收窄到 home services。Avoca 的
              LinkedIn 公司描述确认客户基础为「800+ operators across HVAC, plumbing, electrical, roofing, pest control, automotive
              and more」，截至 2026 年 6 月 LinkedIn 列示 190 名员工。docs.avoca.ai 文档站在以下标题下列出完整产品套件：Inbound、Outbound、Capacity
              Management、Speed to Lead、Google LSA、Simple Scheduler、Analytics &
              Coach、Dispatch、Configuration、Scheduling、Integrations 和 Web Chat——这确认了公开产品页描述的模块地图。
