      - number: '5.3'
        title: 集成架构、部署模型与 API 界面
        blocks:
          - type: paragraph
            body: >-
              Avoca 的集成层支持 40+ 个 field-service management（FSM）CRM，包括
              ServiceTitan、HouseCallPro、Jobber、Salesforce、Zoho、Service Fusion、BuildOps、Service
              Autopilot、Sera、Workiz、BigChange，以及 HVAC、plumbing、pest control、garage door、roofing 和 electrical
              等垂直领域的数十个其他系统。ServiceTitan 集成最深：Avoca 维护专属 ServiceTitan partner page、联合品牌产品套件、共同 partnership program，并被
              ServiceTitan 自身博客作为 HVAC contractors 的 AI 语音自动化主要案例展示。ServiceTitan 是 trades 领域主导 FSM，这意味着 Avoca
              最深的集成对准了最大的潜在客户集中区。


              部署模型锚定在「Forward Deployed Engineer」（FDE）角色上：Avoca 工程师到现场学习运营商实际如何使用派单板、预订逻辑如何运转、季节性协议是什么、最优秀 CSR
              如何处理边缘案例，然后按这些具体情况搭建部署。公司给出的理念是：「We don't onboard you to Avoca. Avoca onboards to
              you.」从现场部署到配置变更的反馈回路被描述为同日完成——「晚上 ship，早上接电话，下午 4 点收到客户截图，下午 6 点推配置变更。」这种快速迭代模型符合 SaaS 配置层特征：AI
              行为由运营商专属规则和知识库控制，而不是由编译后的 pipeline code 控制。文档也确认，「特定地区的龙卷风协议、销售与服务不同的路由逻辑、按会员层级过滤」是运营商专属定制示例。


              面向开发者和系统集成商，docs.avoca.ai 暴露了覆盖所有产品模块的 REST API。API reference 记录了
              call.completed、appointment.scheduled、sms.received、chat.started、speed_to_lead.completed 和
              coach.score_available 等 webhook events；官方 SDK 覆盖 Node.js/TypeScript 和
              Python。docs.avoca.ai/custom-integration 上的 custom-integration playbook 覆盖技术架构、API 规格、数据交换与预订流程、AI 行为定制。这表明
              Avoca 有意支持希望把 Avoca 能力嵌入第三方平台或自有 CRM 的企业集成商。
