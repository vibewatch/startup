            title: 估值与 ARR 错配风险
            body: >-
              Avoca 的 $1B Series B 估值意味着 25–100× ARR 倍数，具体取决于 2025 年实际 ARR 在「八位数」区间中的位置。若落在下限（$10M ARR），100×
              倍数只有在公司成为定义品类的超高速增长标的时才说得通。若 2026 年增长减速，支撑 2026 年私募 AI 溢价的市场条件，未必能延续到下一次流动性事件。投资人应做压力测试：如果 ARR 增长降至 50%
