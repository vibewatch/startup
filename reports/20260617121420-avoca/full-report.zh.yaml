      - number: '7.8'
        title: Kill criteria 与监控
        blocks:
          - type: paragraph
            body: >
              四个 thesis-break 事件是最高优先级监控目标。第一：因未验证事先书面同意就拨打 AI 语音电话，Avoca 客户（或 Avoca 本身）被列名 TCPA class-action
              lawsuit。此类行动会触发对所有 Avoca-powered outbound campaigns 的监管审查，并显著提高所有客户的合规成本。第二：ServiceTitan API
              限制、定价变化或竞争产品发布，损害 Avoca 核心预订功能，或消除集成差异化。第三：收入集中事件，即前三大 PE 平台客户之一退出，导致单季度 ARR 显著下降。第四：涉及 Avoca 平台处理
              homeowner PII 的公开安全或数据处理事件。HITL 项目是主要质量缓释手段，但引入随通话量扩张的 per-call 人力成本；如果 HITL 量显著增加，单位经济会恶化。Avoca npm SDK
              和文档广度支持第三方集成耐久性，但 FSM partners 的 API breaking changes 仍是结构性脆弱点。监控指标应包括：提及 home services AI voice 的公开 TCPA
              执法行动；ServiceTitan marketplace listing 状态；客户案例研究的新鲜度和数量；公开 G2/Capterra 评价（目前无法访问）；以及 Series B 招聘周期后任何已披露的
              headcount restructuring。
            claimRefs:
