      - number: '4.2'
        title: ARR 主张、$1B 作业预约目标，以及收入与 GMV 的区别
        blocks:
          - type: paragraph
            body: >-
              Avoca 在 2026 年 4 月 27 日 Series B 新闻稿中确认，公司 2025 年「surpassed eight figures in annual recurring revenue」。
              「eight figures」把 ARR 严格限定在 $10,000,000 到 $99,999,999 之间。公司没有在所审阅的任何公开来源披露更精确数字。IntelligentCIO 报道、Yahoo
              Finance 转发和 TheSaaSNews 摘要都重复了「eight figures」表述，但没有独立验证。


              $1 billion 作业预约目标是总预约价值指标，代表通过 Avoca 平台预约的所有作业合同价值之和，不是 Avoca 自身收入。Avoca
              从使用其平台的运营商处收取订阅和服务费；作业收入由这些运营商保留。这个区别在商业上很关键：若一个平台以 3–5% 抽成率 从 $1B GMV 中抽成，平台收入为 $30–$50M；而 $1B 作业预约绝不意味着
              Avoca 收入为 $1B。若干新闻报道提到该目标的方式可能被误读为 Avoca 收入目标；投资人必须把它视为 GMV 信号，而不是收入确认。


              鉴于企业多网点合同结构，以及前 30 大 PE 支持平台中 >50% 的渗透率，可以构建粗略收入估计：如果约 15 个头部企业账户每年贡献 $300K–$700K，其余客户群再贡献较小合同额，那么到 2026
              年中 ARR 达 $15–$40M 区间是合理情景。这只是没有公开确认的估计，应作为情景规划输入，而非事实。


              不同 ARR 情景下的隐含估值倍数展示了风险。若 ARR 为 $10M，$1B Series B 估值意味着 100× ARR——只有定义品类、超高速增长的 AI 公司才可能承受这一溢价。若 ARR 为
              $25M，倍数降至 40×；若为 $40M，降至 25×。这些倍数高于公开市场垂直 SaaS 同业，但落在 2025–2026 年顶级私有 AI
              基础设施轮的范围内。投资人组合（Meritech、GC、KP、Amplify）与在增长轨迹支持时按这类倍数承销相一致。


              自 2026 年 4 月公告以来，公司没有发布更新 ARR 数字，也没有可获得的经审计财务。
