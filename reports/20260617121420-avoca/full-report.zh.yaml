      - number: '7.3'
        title: AI 质量、幻觉与信任风险
        blocks:
          - type: paragraph
            body: >
              Avoca 声称其 inbound 部署中 80-85% 电话由 AI 自主处理，剩余 15-20% 通过 HITL 层升级给人类
              CSR。这些数字出现在公司制作的产品页和案例研究中；未发现独立测量或审计。G2、TrustRadius 和 Capterra 在 2026 年 6 月均返回访问受限或
              404，缺少这些独立评价意味着没有第三方用户反馈信号可交叉核对 Avoca 的性能声明。AI voice agents
              预订服务预约，与通用语言模型使用相比，面对性质不同的幻觉风险：一个错误承诺（报价错误、不可用时段、服务范围错误）会立刻引发客户纠纷，并可能让运营商承担退款责任。Avoca 的 HITL
              博客承认，部分通话场景需要人类判断，包括复杂 upsells、情绪激动或非英语用户、非标准服务请求，这说明 AI 的范围边界被主动管理，而不是无限扩张。

              客户结果指标——Yost & Campbell 收入同比提升 20%、Sila Services 90% 通话量自动化、HL Bowman 收入增长 70%——均来自 Avoca
              制作的案例研究，没有独立佐证。如果其中任何数字基于经不起审计的方法选择（归因窗口、基线选择、同时运行的其他变化），产品信任逻辑会迅速恶化。Avoca 2026 年 4 月融资的 Hacker News
              讨论串提出了一个问题：当 AI 处理一通真人 CSR 同样可能成功处理的电话时，预订率提升如何归因。AI-first 产品的信任最终取决于透明的性能测量；Avoca 当前公开披露水平还不支持这一标准。
