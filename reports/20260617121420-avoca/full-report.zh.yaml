      - number: '3.3'
        title: FSM 在位平台成为新兴 AI 前台威胁
        blocks:
          - type: paragraph
            body: >-
              对 Avoca 最重要的结构性竞争威胁不是小型 AI 语音创业公司，而是 FSM 在位平台：它们能把 AI 前台功能捆进已经部署在 100,000+ 运营商账户中的订阅里。Housecall Pro 在 2025
              年底和 2026 年把 CSR AI 模块作为「AI Team」套件的一部分推出。CSR AI 功能在 HCP 平台内 7×24 小时接听电话并预约作业，包含在起价 $59/month 的订阅中；对已经使用
              HCP、且不想增加独立供应商关系的运营商来说，这个捆绑很有吸引力。关键限制在于，HCP 的 AI 前台只服务 HCP 平台客户，也只能预约进 HCP 自己的派工板，因此无法被 Avoca 核心市场中的
              ServiceTitan 重度 HVAC 和管道运营商采用。


              Jobber 也面向家政服务企业推出了 AI Receptionist，宣传为 Jobber 平台上的 7×24 小时电话接听和作业预约。Jobber 定价从 $29/month（Core）起，到
              $699/month（Connect 年付）；AI Receptionist 可在更高层级计划中使用。和 HCP 的 CSR AI 一样，Jobber 的 AI Receptionist 是平台原生产品，不提供
              ServiceTitan 集成。


              Hatch（usehatchapp.com）占据相邻但大体互补的位置。其平台聚焦外呼 AI——报价跟进、重启营销和线索再激活——并与 ServiceTitan 原生集成。公开记录中 Bone Dry
              Roofing 使用 Hatch 完成 $7 million 重启收入，验证了外呼 AI 品类，但不与 Avoca 的入站预约核心重叠。运营商可以、也很可能会同时运行两者。ServiceTitan 自身在
              2026 年 3 月发布了一份关于 HVAC AI 语音坐席的详细指南，但截至该日期没有推出独立 AI 语音产品，更倾向合作伙伴生态模式。


              Workiz 是面向 HVAC、锁匠、管道和垃圾清运的现场服务管理平台，竞争位置在 FSM 层，而非 AI 语音自动化，因此是相邻平台威胁，不是直接 AI 电话处理竞争者。CallRail 的 Voice
              Assist 功能处理 AI 电话资格判定，但服务营销分析和线索归因，而不是家政服务垂直预约自动化。
