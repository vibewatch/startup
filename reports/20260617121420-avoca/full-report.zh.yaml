      - number: '3.2'
        title: 直接 AI 语音与接听自动化竞争者
        blocks:
          - type: paragraph
            body: >-
              Rosie AI 是最直接的 SMB 价格带竞争者。Rosie 作为 AI 接听服务推出，起价 $49/month，含每月 250 分钟，面向单人运营商和微型企业——明确针对「small businesses
              who can't always answer the phone」——而 Avoca 的企业定价和销售动作并不优先覆盖这类客户。截至 2026 年中，Rosie 报告 1,900+ 本地企业客户、处理 3.1
              million 通电话，使其在低于 $150/month 的价格层有真实市场存在。Rosie 的差异化在于简单（可从 Google Business Profile 几分钟设置）和便宜，而不是深度 FSM
              集成或外呼工作流自动化。在 Scale 计划（$149/month）中，Rosie 增加日历预约和暖转接，开始与 Avoca 基础预约能力重叠，但没有原生 ServiceTitan 派工集成。


              GoodCall 代表另一类威胁：一个源自 Google AI 的横向部署 AI 电话坐席平台，定价 $79–$249/agent/month，包含无限分钟，并报告有 42,000+
              企业客户，横跨餐厅、美容院、家政服务和企业客户。GoodCall 的企业宽度既是卖点，也是其在家政服务中的限制：它缺少 Avoca 专门打造的垂直 ServiceTitan
              集成和多网点运营商打法。GoodCall 的 60+ million 次语音坐席交互证明了真实规模，但发生在横向市场。


              Smith.ai 采用混合模式——北美真人前台叠加 AI——并明确与纯自动化工具对位。其定价不公开，需要直接联系销售，意味着单次处理电话成本显著高于 AI 原生替代方案。Smith.ai
              服务律所、医疗机构、家政服务和房地产，更像高端接听服务，而不是垂直专精的 AI 自动化竞争者。


              Signpost 提供专门面向家政服务承包商（电工、HVAC、管道工、屋面工）的 AI Voice Receptionist，结合 AI 短信和语音能力。不过，Signpost 的公开产品页面没有确认与
              ServiceTitan 等 FSM 派工板的日历集成，这限制了它在复杂多网点预约工作流中的竞争相关性。
