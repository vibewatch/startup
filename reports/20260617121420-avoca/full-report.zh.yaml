        - 因平台流失或垂直扩张失败，ARR 增长降至 20% 以下
      - - 熊市
        - $10M-$15M
        - 0-10% YoY
        - PE 平台流失兑现，ServiceTitan 捆绑有效，且 NRR <95%
        - 按 5-8x ARR 计，恢复价值 $50M-$150M
