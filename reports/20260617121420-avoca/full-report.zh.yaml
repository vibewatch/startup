companyProfile:
  summary: >-
    Avoca 是一家私有 AI 软件公司，2022 年成立，总部位于纽约市（Union Square），并在 Santa Barbara 设有第二办公室。公司向家政服务企业销售 AI 原生语音与工作流自动化平台，重点客户是 PE
    支持的多品牌 HVAC、管道、电气和修复服务运营商。平台用 LLM 驱动的 AI CSR 替代或增强入站呼叫中心、排期和客户跟进，并配有北美真人介入的升级处理层。到 2026 年 4 月，Avoca 已在 Meritech
    Capital 和 General Catalyst 领投下融资超过 $125 million，Series B 估值达 $1 billion；早期投资方包括 Kleiner Perkins、Amplify
    Partners、Nexus Venture Partners 和 Y Combinator。公开牵引力信号包括 2025 年八位数 ARR，在 Sila Services、Granite Comfort、HL Bowman 和
    1-800-GOT-JUNK? 的具名企业部署，以及 2026 年撮合 $1 billion 客户作业（GMV）的目标。核心尽调限制在于单位经济学未披露：公开资料没有经审计 ARR、利润率、NRR、烧钱速度或治理细节。
