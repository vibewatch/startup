      - number: '3.4'
        title: 功能、能力与价格对比
        blocks:
          - type: paragraph
            body: >-
              横向比较竞争场中的能力，可以看到清晰分层。Avoca 是唯一同时提供四类能力的供应商：AI 原生入站语音并实时集成 ServiceTitan 派工板；外呼活动自动化（报价跟进、赢回）；处理 15–20% 电话的
              Human-in-the-Loop 升级项目；以及叠加在电话预约数据之上的分析与辅导。没有单一竞争者能在一个平台里复制全部四组能力。


              竞争者按能力轴分布。Rosie AI 和 GoodCall 提供电话接听和简单预约，但没有 FSM 专项集成。FSM 捆绑 AI 工具（HCP CSR AI、Jobber AI
              Receptionist）集成很紧，但只能在自家平台派工板内使用。Smith.ai 提供真人坐席能力，但单次处理电话成本结构性更高。Hatch 覆盖外呼跟进，不覆盖入站电话接听。AnswerConnect
              提供真人接听，不提供自动化。


              定价上，Avoca 是唯一完全不公开价格的竞争者——典型企业销售动作，需要定制报价。Rosie AI 起价 $49/month；GoodCall 起价 $79/agent/month；Jobber 基础 FSM
              起价 $29/month，AI Receptionist 可在更高层级计划中使用（$199–$699/month）。AnswerConnect 和 Smith.ai
              等真人接听服务需要联系销售定价，意味着在规模化电话量下，单次处理电话通常达到 $1–$2+ 的分钟成本；相对 AI 原生工具，这是高电话量运营商的结构性成本劣势。HCP Starter 计划从 $59/month
              起，CSR AI 作为捆绑附加项，单运营商成本没有单独披露。


              对买方决策的关键启示是：比较集取决于运营商层级。单人 HVAC 技师比较选项时，会把 $49/month 的 Rosie 视为可行替代。一个区域性、PE 支持的运营商在十个网点运行 ServiceTitan、每月
              500+ 通电话时，则找不到能替代 Avoca 集成深度和多网点能力的方案。
