      各阶段之间的转化率未公开披露。阶段数值是定性标签或公司披露的汇总口径，不是经验证的漏斗指标。
    claimRefs:
      - CU022
      - CU025
      - CU032
  - id: FU003
    title: 客户证明矩阵——按具名客户划分的证据质量
    type: matrix
    layout: wide
    summary: |
      六个具名客户按证据质量、结果具体度、生产成熟度和留存可见度绘制；所有部署都已投产，但每个账户都缺少留存数据。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 生产状态
        - 留存可见度
      rows:
        - label: Sila Services
          values:
            - 高（详细案例研究 + 独立网站）
            - 已量化（90% AI 通话占比、<10% 转接、80K+ 外呼）
            - 生产环境（2025 年 1–10 月数据）
            - 无——没有 NRR 或流失数据
        - label: Granite Comfort
          values:
            - 高（详细案例研究 + 试点品牌结果）
            - 已量化（收入同比增长 20%、呼叫中心 9:1、>50% AI 通话）
            - 生产环境（2025 年末）
            - 无——没有 NRR 或流失数据
        - label: HL Bowman
          values:
            - 中高（多指标案例研究）
            - 已量化（收入增长 70%、CPC 降低 39%、CSAT 93%）
            - 生产环境（约 2025 年）
            - None
        - label: My Plumber Plus
          values:
            - 中（仅溢出场景，范围有限）
            - 部分量化（17% 预约率、1,000+ 通电话）
            - 生产环境（仅溢出渠道）
            - None
        - label: Call Dad
          values:
            - 中（无收入数据）
            - 部分量化（78% AI 处理、90%+ 解决率）
            - 生产环境（期间未说明）
            - None
        - label: Rescue Air
          values:
            - 中（最早客户，偏定性）
            - 定性加 1 项指标（每通被挽回电话 $250、2 名 CSR 晋升）
            - 生产环境（3+ 年——间接耐久性信号）
            - 间接（3 年留存意味着留存较强）
    approximationNotes: |
      证据质量评级是作者判断，依据包括细节程度、是否有量化指标，以及是否有非 Avoca 来源佐证。没有任何一行经过独立审计。
    claimRefs:
      - CU001
      - CU007
      - CU012
      - CU015
      - CU018
      - CU020
      - CU042
  - id: FR001
    title: 风险热力图——按风险类别划分的发生可能性与影响
    type: matrix
    claimRefs:
      - CR001
      - CR007
      - CR016
      - CR020
      - CR025
      - CR036
      - CR040
    data:
      columns:
        - label: 中等影响
        - label: 高影响
        - label: 关键影响
      rows:
        - label: 高可能性
          values:
            - FDE 模式扩张上限（招聘约束）
            - PE 平台集中带来的流失（阶梯式损失）
            - TCPA/FCC-24-17A1 外呼同意风险
        - label: 中等可能性
          values:
            - 房地产市场周期性（收入受压）
            - ServiceTitan 竞争性捆绑（商品化）
            - ServiceTitan API 限制或下架
        - label: 低可能性
          values:
            - AI 质量漂移（模型退化）
            - 安全 / 数据泄露
            - 快速放量下 HITL 扩张失效
  - id: FR002
    title: 风险传导图——风险如何级联到收入和估值
    type: dag
    claimRefs:
      - CR007
      - CR017
      - CR020
      - CR026
      - CR036
      - CR044
    data:
      nodes:
        - id: tcpa
          label: TCPA / FCC 执法行动
          detail: 未取得事先书面同意的 AI 外呼触发集体诉讼或 FCC 调查。
        - id: st_api
          label: ServiceTitan API 限制
          detail: ST 对 Avoca 集成接入限速、下架，或通过涨价挤出。
        - id: pe_churn
          label: PE 平台供应商退出
          detail: 一个平台层面的决定会同时移除所有被收购品牌。
        - id: ai_failure
          label: AI 质量 / 信任事件
          detail: 错误预约、数据事件或持续宕机都会打击运营商信心。
        - id: revenue
          label: 收入影响
          detail: 流失、合规暂停或产品受损会带来 ARR 损失。
        - id: customers
          label: 客户信心
          detail: 运营商是否愿意扩张并转介绍新客户。
        - id: valuation
          label: 融资 / 估值
          detail: Series C 倍数和投资者信心取决于 ARR 轨迹和监管清晰度。
      edges:
        - from: tcpa
          to: revenue
        - from: tcpa
          to: customers
        - from: st_api
          to: revenue
        - from: st_api
          to: customers
        - from: pe_churn
          to: revenue
        - from: ai_failure
          to: customers
        - from: ai_failure
          to: revenue
        - from: revenue
          to: valuation
        - from: customers
          to: valuation
  - id: FR003
    title: 依赖图——关键平台和合作伙伴依赖
    type: dag
    claimRefs:
      - CR018
      - CR019
      - CR021
      - CR022
      - CR023
      - CR024
    data:
      nodes:
        - id: avoca
          label: Avoca AI 平台
          detail: AI CSR、Outbound、HITL、Coach、Speed-to-Lead 和集成枢纽。
        - id: servicetitan
          label: ServiceTitan（FSM 主导者）
          detail: API 合作伙伴，也是正在冒头的竞争者；掌握调度、CRM 和产能端点。
        - id: st_marketplace
          label: ServiceTitan Marketplace
          detail: Avoca 触达 ST 原生运营商的分销渠道；上架条款由 ST 制定。
        - id: other_fsm
          label: 39+ 个其他 FSM 平台
          detail: Jobber、HouseCall Pro、Workiz 等；集成深度不如 ST。
        - id: llm_provider
          label: 未披露的 LLM / 语音提供商
          detail: 核心 AI 推理和语音合成；身份和合同条款未公开。
        - id: pe_platforms
          label: PE 支持的家政服务平台
          detail: 前 30 大 PE 平台；既是高价值客户，也是分销渠道。
        - id: hitl_csrs
          label: HITL 人工 CSR 团队
          detail: Avoca 北美员工为 15-20% 的通话升级兜底。
      edges:
        - from: servicetitan
          to: avoca
        - from: st_marketplace
          to: avoca
        - from: other_fsm
          to: avoca
        - from: llm_provider
          to: avoca
        - from: avoca
          to: pe_platforms
        - from: avoca
          to: hitl_csrs
        - from: hitl_csrs
          to: avoca
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从证据质量、规模证明、风险叠加和估值语境，推导到有条件关注的投资建议。
    approximationNotes: 节点连接代表分析逻辑，不是资金流。本图没有数值。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV007
      - CV023
      - CV025
    data:
      nodes:
        - id: evidence-base
          label: 证据基础
          detail: 公司声称 ARR 达八位数，已融资 >$125M，投资方阵容一线，但没有经审计财务
        - id: scale-proof
          label: 规模证明
          detail: 企业级 PE 支持客户、Nexstar 分销、进入头部平台，以及 80%+ AI 处理率
        - id: disclosure-gap
          label: 披露缺口
          detail: ARR、NRR、毛利率、CAC 或股权结构均未确认；公开 ARR 区间仍相差 10 倍
        - id: risk-overlay
          label: 风险叠加
          detail: ServiceTitan 捆绑风险、PE 集中度、HITL 毛利拖累，以及 AI 溢价压缩风险
        - id: valuation-context
          label: 估值语境
          detail: $1B 对应估算 ARR 的 25x-100x，高于公开可比公司，定价押注牛市情景下的品类创建
        - id: recommendation
          label: 有条件关注
          detail: 只有确认 ARR >=$30M、NRR >=110%、毛利率 >=65%，且审阅 ServiceTitan 条款后才投资
      edges:
        - from: evidence-base
          to: scale-proof
          label: 支撑
        - from: evidence-base
          to: disclosure-gap
          label: 受限于
        - from: scale-proof
          to: valuation-context
          label: 提供依据
        - from: disclosure-gap
          to: risk-overlay
          label: 放大
        - from: risk-overlay
          to: valuation-context
          label: 折价
        - from: valuation-context
          to: recommendation
          label: 导向
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在 $1B 估值下，五种 ARR 情景对应的隐含 ARR 倍数敏感性，从最低八位数边界到增长后的情景。
    approximationNotes: ARR 情景是示意区间；已披露的八位数表述把公开区间限定在 $10M 到 $99M。图中倍数只是估值除以 ARR。
    claimRefs:
      - CV003
      - CV007
      - CV014
      - CV015
    data:
      items:
        - label: ARR = $10M（八位数下限）
          value: 100
          detail: 100x 倍数；只有在超高速增长且利润率快速改善时才撑得住
        - label: ARR = $15M（低位估算）
          value: 67
          detail: 67x 倍数；高于已知公开可比公司，需要异常强的留存和利润率改善
        - label: ARR = $25M（中位估算）
          value: 40
          detail: 40x 倍数；只有对增长证明达到 50%+ 的顶四分位私有 AI 轮次才算合理
        - label: ARR = $40M（高位估算）
          value: 25
          detail: 25x 倍数；更站得住，也更接近高溢价私有垂直 AI 区间
        - label: ARR = $60M（2026E 前瞻牛市）
          value: 17
          detail: 17x 倍数；如果到 2026 年底跑出快速增长，就接近正常化可比区间
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在熊市、基准和牛市情景下的低 / 中 / 高退出估值，以及 $1B 入场价对应的 Series B 投资者隐含回报。
    approximationNotes: 所有退出估值都是情景分析推导出的估算；概率权重为定性判断，且没有已确认财务数据可验证任何区间。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV025
      - CV033
    data:
      items:
        - label: 熊市退出（2028-29 年，$10M-$15M ARR 对应 5-8x ARR）
          low: 50
          mid: 100
          high: 150
          detail: Series B 本金损失 88%-95%；回收取决于未知的优先权结构
        - label: 基准退出（2028-29 年，$25M-$40M ARR 对应 15-20x ARR）
          low: 375
          mid: 600
          high: 800
          detail: 低于 $1B 入场价；除非谈妥入场保护，否则有资本受损或下轮降价风险
        - label: 牛市退出（2028-29 年，$60M-$80M ARR 对应 20-25x ARR）
          low: 1200
          mid: 1700
          high: 2000
          detail: 入场价约 1.2x-2.0x；为正回报，但若没有进一步增长或倍数扩张，低于 3x 目标
        - label: 上行牛市（2029-30 年，$100M+ ARR 对应 25x+ ARR）
          low: 2500
          mid: 3000
          high: 4000
          detail: 入场价 3x-4x；需要持续 60%+ CAGR，并保住溢价倍数支撑
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 面向 IC 的评分，覆盖市场机会、产品证明、竞争护城河、财务披露、估值纪律、风险水平、证据质量和投资建议。
    approximationNotes: KPI 数值是分析师基于公开证据给出的综合评分，不应理解为经审计指标。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV017
      - CV022
      - CV027
      - CV032
      - CV035
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          detail: $150B+ 家政服务支出，并有可信路径切入相邻服务垂直领域
        - label: 产品证明
          value: 7 / 10
          detail: 具名企业客户、80%+ AI 处理率和 ROI 声明，但没有独立审计
        - label: 竞争护城河
          value: 6 / 10
          detail: ServiceTitan 集成和 PE 分销有帮助，但 ServiceTitan 自身路线图是主要护城河威胁
        - label: 财务披露
          value: 2 / 10
          detail: 公开信息只有八位数 ARR；没有经审计的增长、利润率、留存或 CAC 数据
        - label: 估值纪律
          value: 4 / 10
          detail: 视实际收入而定为 25x-100x ARR；只有确认牛市轨迹后才撑得住
        - label: 风险水平
          value: High
          detail: ServiceTitan 依赖、PE 集中、HITL 毛利拖累和披露缺口都是实质风险
        - label: 证据质量
          value: Low-Medium
          detail: 定性论点有充分佐证，但财务承销大体仍未验证
        - label: 建议
          value: Conditional
          detail: 只有数据室确认 ARR >=$30M、NRR >=110%、毛利率 >=65% 时，才具备战略关注价值
