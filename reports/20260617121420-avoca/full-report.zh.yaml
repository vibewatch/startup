      - number: '5.2'
        title: 工作流界面、通话流程与派单逻辑
        blocks:
          - type: paragraph
            body: >-
              Avoca 的 inbound 工作流围绕三个优先级层级搭建，反映服务运营商如何给工作分诊。P1
              覆盖紧急和急迫来电（无暖气、无制冷、煤气味、进水）：无论派单板上已有多少任务，这些都会立即预订；安全紧急事件会实时转给 on-call 技师。P2 覆盖更换和安装，可覆盖较低优先级时段。P3 覆盖保养和
              tune-up，用来填充空闲产能，但会让位给 P2 和 P1 需求。优先级可由设备年限、会员状态、保修状态、来电类型或任意组合定义——「buffer days」可在旺季周把 P3
              工作往后推，在淡季再拉回来。这套逻辑由实时 CRM 可用性读取驱动：Avoca 直接从运营商 CRM 读取产能，而不是使用静态预订窗口，从而避免重复预订，并可选择性允许较低优先级时段有意超订。


              电话第一句话说出之前，Avoca 会拉取 12+ 个 CRM 数据字段：过往 jobs、设备品牌和型号、设备年限、会员层级、账户状态和房主状态。电话升级到 HITL 时，人类 CSR 会在实时屏幕上看到完整
              brief——谁在打电话、需要什么、设备情况、语气如何——客户无需先重复一遍。转接时间标称低于 3 秒，且零掉线。Inbound 产品页报告：预订率较 IVR 高 40%，平均 call-to-booking
              低于 30 秒，速度比 IVR 系统快 2×。


              智能任务路由把派单逻辑延伸到通知：运营商定义哪些来电类型触发路由动作（安装转给 inside sales、老设备来电标记为更换沟通、掉线电话立即跟进），Avoca 会附上 AI
              生成摘要并自动路由。Outbound Speed-to-Lead playbook 记录了一套经测试的工作流结构：lead 产生后的前 2 小时内设置 4+ 个触点，覆盖语音和 SMS 两个渠道，AI
              在两端都处理对话。按公司部署经验博客，表现最好的部署中，运营商已实现 90–95% AI 通话处理率（对比 80–85% 基线），预订率从 45% 提升到 70%，还有一名客户在单个季节靠 outbound
              campaigns 产生 $850K SMS 收入。
