  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              Avoca 在 home-services 市场服务两类结构不同的客户。第一类是独立 SMB 运营商，经营单一品牌的 HVAC、plumbing、electrical、pest
              control、garage-door 或 general contracting 公司。这些运营商通常部署 Avoca，用来替代或补强小型内部 CSR
              团队，接住当前漏掉的电话，并减少对非工作时间接听服务的依赖。第二类——战略上更重要——是 PE 支持的多品牌平台，按共享运营模型管理数十个收购品牌。对 PE 平台，Avoca
              在两个层面交付价值：每个被收购品牌立即获得通话处理自动化，平台领导层也获得跨全部品牌的统一分析视图，而去中心化 CSR 团队此前无法做到这一点。Avoca 联合创始人披露，公司已在美国前 30 大 PE 支持
              home-service 平台中的超过一半上线并部署，PE 辅助分发因此成为核心增长杠杆。地理重心压倒性地在美国本土，与东北、东南、西南和中西部成熟 home-services
              私募股权活动的集中度一致。国际上未披露任何活跃部署。
