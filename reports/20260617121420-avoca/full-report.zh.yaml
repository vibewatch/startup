              相差不到 2%。Granite Comfort 是一个九品牌、PE 支持的 HVAC 与 plumbing 平台，2025 年底在全部九个品牌中部署 Avoca Responder、Coach 和
              Human-in-the-Loop，把九个独立呼叫中心压缩成一个。试点品牌 Yost & Campbell 通过 Avoca 接住此前流失电话，实现收入同比增长 20%。HL Bowman 实现 70%
              收入增长，并把每次转化成本从 $350 降至 $215。My Plumber Plus 年收入 $129 million，部署 Avoca 处理 overflow calls，报告预订率提升 17%。Call
