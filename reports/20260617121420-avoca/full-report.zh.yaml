      - number: '8.3'
        title: 当前估值语境与可比基准
        blocks:
          - type: paragraph
            body: >-
              Avoca 的估值语境对分母异常敏感。公司只披露 2025 年 ARR 超过八位数，因此 $1 billion 的 Series B 估值，在低端可意味着 100x ARR；若按接近 $25 million
              的合理中性情景，则是 40x；若按约 $40 million 的高端情景，则是 25x。这个区间太宽，无法精确定价，也让可比分析比平时更重要。公开和半公开的软件基准显示，Procore 等成熟垂直 SaaS
              公司通常以中低十几倍 ARR 交易，而规模更大的家庭服务平台 ServiceTitan，被讨论的倍数大致在低十几倍到中十几倍 ARR。


              Avoca 仍然可以为溢价辩护。AI-native 私营公司拿到的倍数显著高于公开 SaaS，尤其当投资人相信它们正在未数字化垂直行业里搭建新的运营层时。a16z、BVP、SaaS Capital 和
              Meritech 都在强化这个叙事。即便如此，溢价不等于可以放弃纪律。相对公开可比公司高 2x 到 5x，仍需要强增长、高留存和持续改善的利润率来支撑。


              最稳妥的理解是，Avoca 的定价是基于预期 2026 年或 2027 年 ARR 的前瞻倍数，而不是基于当前经审计 ARR。如果收入已经高于约 $30 million
              且增长很快，这种定价可以成立；否则，价格内含的乐观程度就超过了公开证据基础。
            claimRefs:
