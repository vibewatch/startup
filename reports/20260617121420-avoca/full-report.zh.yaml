              Kleiner Perkins 和 Amplify 引用的是数万亿美元服务经济数字，代表整个家政服务行业，而非 AI 前台自动化层。更相关的 SAM——家政服务客户支持自动化——KP
              估计为数百亿美元，但没有发布方法论。投资人和尽调团队必须基于劳动力数据、平台覆盖和单运营商支出代理，自行搭建自下而上的规模测算，而不能依赖自上而下的分析师报告。
