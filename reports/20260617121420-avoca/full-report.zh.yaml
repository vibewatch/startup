      - number: '4.4'
        title: 资本充足性、资金用途与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Avoca 已在种子轮、Series A 和 Series B 中累计融资超过 $125M，估值 $1B。融资历史是公开记录中较完整的一块：PitchBook 记录了 $500K 加速器轮（2023
              年）、$10.3M 种子轮（2024 年 10 月）、未披露金额的 Series A（2025 年 6 月，KP 领投），以及 $125M+ Series B（2026 年 4 月，Meritech 与 GC
              领投）。Company Overview 章节已详细梳理这条时间线；这里真正需要回答的财务问题，是未来资本是否够用。

              Series B 资金的公开用途包括产品开发、运营扩张、深化与行业软件平台的集成，以及在全国扩充销售和客户成功团队。这指向一套增长投资逻辑：在 ServiceTitan、Jobber、HCP 等
              incumbent 加深自身 AI 功能前，公司主要把钱投向 S&M 和 R&D，抢占市场份额。这种姿态也符合一家愿意承受短期现金消耗、以复合数据壁垒和客户锁定的公司。

              公开资料没有 Avoca 账上现金、月度 burn rate 或 runway。可以用员工数和市场基准拼出估算：总部在纽约、员工 100+，全包年薪成本估计为 $15–$25M。再加上 AI 基础设施、办公设施和
              S&M 项目成本，全年总 burn 大概率落在 $20–$35M 区间。按 $20M burn，$125M Series B 可提供约 6 年 runway；按 $35M burn，约 3.5
              年。这些只是粗略估算，不是已确认数字。

              Avoca 未公开披露任何债务、信贷额度或二级资本义务。没有披露不等于不存在——data room 应确认完整资本结构，包括任何 venture debt、earn-out 条款或 secondary
              交易。投资方（Meritech、GC、KP、Amplify）均为股权阶段基金，未见项目融资或债务结构历史；这会降低但不能排除从属资本的可能性。
