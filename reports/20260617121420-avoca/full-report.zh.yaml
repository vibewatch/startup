      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值与披露错配
            body: >-
              估值与披露错配：$1B 估值建立在最宽的披露区间上（$10M-$99M ARR）。按下限计算，Avoca 对应 100x ARR，且公开层面没有机制能证伪或确认这一点。在 data room
              证据收窄区间之前，投资人应把这笔入场视为牛市情景定价。
            calloutType: risk
            claimRefs:
              - CV007
              - CV025
              - CV040
          - type: callout
            title: 品类创造溢价可以成立
            body: >-
              如果增长得到确认，品类创造溢价可以成立：Meritech、GC、KP 和 Amplify 组成的财团，是把 Avoca 当作未数字化家庭服务中的品类创造押注来承销，而不是传统 SMB SaaS 工具。如果
              2026 年 ARR 证明高于 $30M，且增长超过 50%，前瞻口径下的溢价倍数会显著压缩。
            calloutType: strength
            claimRefs:
              - CV002
              - CV011
              - CV027
          - type: callout
            title: Data room 访问不可让步
            body: >-
              资本承诺前，data room 访问不可让步：公开证据足以支持战略兴趣，但不足以支撑财务承销。没有确认过的 ARR 明细、cohort 留存、GAAP 毛利率、含优先权结构的 cap table，以及
              ServiceTitan 合同条款，就不应作出投资决定。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV038
