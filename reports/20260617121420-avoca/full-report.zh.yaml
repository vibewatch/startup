  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、现状与相邻板块
        blocks:
          - type: paragraph
            body: >-
              Avoca 竞争的位置位于三类支出的交汇处：家政服务前台人员（CSR、调度员、接听服务）、现场服务管理（FSM）软件，以及 AI
              驱动的业务自动化。主要市场是家政服务运营商为处理入站电话、预约作业和跟进未成交报价付出的人力和供应商成本；在手工行业，这些动作约占收入入口的 90%。


              现状高度分散。单车业主通常自己接电话，或在作业时依赖语音信箱。成长中的独立商户通常雇一到两名 CSR，或外包给真人接听服务 / 离岸呼叫中心。更大的区域和全国品牌会运营专门 CSR
              团队，并辅以任务管理平台。每个细分层级都有同一个结构性缺陷：电话量呈峰谷波动（由天气和紧急事项驱动），真人 CSR 是瓶颈。Avoca 及互相印证的行业来源持续给出一个区间：无人辅助的家政服务企业漏接率为
              20–40%，每通漏接电话都代表价值数百到数千美元的预约机会。


              Avoca 主要不覆盖的相邻市场包括后端现场调度（路径与排期优化）、技师生产力工具（工时追踪、移动表单）以及宽泛横向 CRM 平台。现场服务管理市场相邻且重要，因为 Avoca 必须接入
              ServiceTitan、Jobber、Housecall Pro 等 FSM 平台才能运作；FSM 既是集成依赖，也是间接竞争参照。核心市场边界之外但值得跟踪的相邻领域包括：全国性呼叫中心 BPO
              供应商、更广的 SMB 营销自动化，以及 Angi、Thumbtack 等生成线索但不处理入站语音的家政服务市场平台。
            claimRefs:
