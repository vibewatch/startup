      - number: '6.3'
        title: 上线模型与伙伴辅助分发
        blocks:
          - type: paragraph
            body: >
              Avoca 的获客和上线流程依赖 Forward Deployed Engineer（FDE）模型：一名技术员工在部署前和部署中到每个新客户现场。FDE
              提取区分每家企业的运营细节——预订逻辑、季节性协议、会员层级、紧急路由——并把这些规则直接写入 AI 部署。Avoca 报告称，这种模型把反馈回路从数周压缩到同日配置变更。一位参考客户 Yost &
              Campbell，在前 30 天后从每天 escalation calls 变为每周 check-ins。ServiceTitan 集成合作是 Avoca 最重要的渠道机制：ServiceTitan 是 HVAC
              和 plumbing 企业的主导 field service management 平台，Avoca 的紧密集成在 ServiceTitan 生态内形成天然分发路径。Referral program（Refer
              & Earn）和正式 partner program 还带来来自行业协会、保险网络和同行运营商推荐的额外 inbound leads。对 PE 平台，land-and-expand 模式会被收购加速：当 PE
              支持平台收购一家独立 Avoca 客户时，平台通常会审阅业绩数据，并把部署推广到更多 portfolio brands。Rescue Air 的 PE 交易过程展示了反向逻辑：买方把 Rescue Air 的
              AI 部署视为可扩展 playbook，并把这项能力计入收购倍数。
