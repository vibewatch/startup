disclaimer: >-
  本尽调报告由 AI 研究代理基于截至 2026-06-17 的公开来源生成，不构成投资建议。Avoca 是一家私营公司，关键承销输入——包括准确
  ARR、增长率、毛利率、NRR、烧钱速度、股权结构和治理条款——仍未披露；任何投资决策都应结合管理层材料、客户访谈和经审计财务进行验证。公开材料中引用的 2026 年「$1 billion in jobs booked」目标，指客户通过
  Avoca 平台预约的总工单价值，不等同于 Avoca 平台收入。
