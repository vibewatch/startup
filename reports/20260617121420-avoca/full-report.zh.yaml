      - number: '4.3'
        title: 成本结构、毛利率驱动与单位经济学
        blocks:
          - type: paragraph
            body: >-
              Avoca 的 COGS 至少能拆出四块。第一是 AI 推理成本：每通来电和外呼都要跑在大语言模型（语音 / 文本）、语音合成和电话基础设施上。Avoca 处理的通话量越大，AI 基础设施就越成为最主要的可变
              COGS。第二是 Human-in-the-Loop（HITL）人力：AI 处理 80–85% 的电话，剩余 15–20% 升级给北美 CSR。这些 HITL 坐席由 Avoca
              培训，可能是员工也可能是承包商，人力成本会直接吃掉毛利。第三是实施和上线人力：企业级多网点部署需要大量配置（派单规则配置、CRM
              同步、业务规则训练），形成前置成本，是否能单独收费并不确定。第四是客户成功和技术客户管理：公司把售后支持强调为竞争差异点，意味着专属 CS 人头成本会进入 COGS，或紧贴其下方。

              BLS 报告显示，2024 年美国客户服务代表的年薪中位数为 $42,830（$20.59/小时）。加上福利和管理开销后，每名 HITL CSR 的全包成本估计约为每年
              $55,000–$70,000。平台一旦承接大规模通话量，除非 AI 处理与人工处理的比例接近 95%+，HITL 人力就是结构性重要的 COGS 项。

              Avoca 未披露毛利率。带有人力服务成分的同类垂直 AI SaaS 公司通常跑在 50–70% 毛利率，而纯软件 SaaS 为 75–85%。Avoca 的 HITL 模型意味着，长期毛利率目标大概率需要 AI
              自动化率持续提升（从 80–85% 推向 90–95%），才能释放 HITL 人力成本。若 AI 能力继续进步，长期路径有利；但短期相对纯软件可比公司会承受毛利挤压。

              单位经济——尤其 CAC、LTV、回本周期和 NRR——公开来源完全没有。创始人提到获客成本大概率跟随企业销售周期（多网点客户估计 3–9 个月），HITL
              博客也暗示客户成功投入高于平均水平。正向信号很强：Avoca Coach 案例称单网点 90 天追回 $29K，Granite Comfort 将 20% 同比收入提升归因于 Avoca。这些客户结果可以作为高
              LTV 的输入信号，但它们是公司筛选出来的案例，不能替代 cohort 层面的留存数据。
