      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              公开证据无法给出点估计，情景分析才是合适框架。牛市情景下，Avoca 证明公司已经脱离 ARR 区间低端，继续以 50% 或更高速度增长，从核心 HVAC 和 plumbing 扩到相邻服务垂直，并随着 AI
              处理率上升改善毛利率。沿着这条路径，Avoca 有可能在后续私募融资或战略退出中拿到高于当前标记的估值；但即便如此，除非 ARR 非常快地复利增长，Series B 投资人的回报可能仍然有限。


              基准情景假设 Avoca 业务真实、在增长、且有运营价值，但还没有出色到足以长期支撑私募市场 AI 溢价。如果 ARR 更接近 $20 million 到 $25 million，增长为 25% 到
              30%，毛利率只温和改善，退出价值会落在当前 $1 billion 入场价之下，并带来 down round 风险。


              熊市情景之所以严重，是因为估值太高。如果 ARR 接近公开区间低端，如果 PE 客户集中带来流失，或者 ServiceTitan 捆绑推出竞争性 AI
              产品，倍数可能塌到服务型业务或低增长软件区间。对按当前估值进入的后期投资人而言，这不是小幅低于预期，而是实质性减记。
