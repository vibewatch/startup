chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品定位与市场切入点
        blocks:
          - type: paragraph
            body: >-
              Avoca 是一家 AI 优先的软件公司，2022 年成立，总部在纽约市，并在 Santa Barbara 设有第二办公室。公司为服务业企业销售 AI
              驱动的客户沟通和工作流自动化，尤其面向依赖电话获客、排期和下班后响应的家政服务运营商。在官方材料中，Avoca 把自己定位成这些运营商的「AI workforce」或「AI front
              office」，而不是狭义的接听服务替代品。


              产品切口很具体。Avoca 处理入站语音、聊天、邮件和短信，把作业直接预约进客户 CRM，跟进未成交报价，运行外呼活动，并在自动化层之上继续叠加辅导、分析和真人兜底工作流。这个定位很重要：公司卖的不只是语音
              AI，而是想先拿下第一触点，再扩进更宽的运营工作流。投资人评论和产品页面都强化了这种「行动系统」野心：材料强调实时接待能力、CRM 同步和工作流路由，而不是简单的聊天机器人叙事。


              这个切口也明显是垂直市场优先。Avoca 自述早期曾在更宽的 SMB 品类里试验，之后转向手工行业和家政服务；在这些行业，漏接电话会直接变成收入损失，预约、派工和技师排班的紧迫性也让自动化 ROI 很高。到
              2026 年中，公司已经明确讨论从核心家政服务延伸到屋面、修复、搬家、垃圾清运、汽车服务和物业管理等相邻服务品类。
