  - id: TI005
    title: 公开财务证据缺口表
    columns:
      - 缺失指标
      - 对承保的影响
      - 精确尽调路径
      - 严重性
    rows:
      - - 精确 ARR（2025 与 2026 YTD）
        - 没有已确认 ARR，无法判断公司规模或验证增速
        - 索取经审计或管理层编制的月度 ARR 明细，覆盖自成立至 2026 年 6 月
        - 阻断
      - - ARR 增速（YoY 与 QoQ）
        - 没有增长确认，无法验证 25–100× 估值倍数
        - 索取季度 ARR 桥接表，包括新增 ARR、扩张 ARR、收缩和流失
        - 阻断
      - - 毛利率与 COGS 拆分
        - 没有交付成本数据，无法建模盈利路径或终局利润率
        - 索取 GAAP 利润表（FY 2024、FY 2025、TTM 2026），列示逐项 COGS 和毛利
        - 阻断
      - - 净收入留存（NRR）与总收入留存（GRR）
        - 无法评估 ARR 质量，也无法判断存量是在复利还是侵蚀
        - 按季度客户群索取 NRR 和 GRR；标记留存显著不同的客户群
        - 阻断
      - - 客户获取成本与回本期
        - 无法评估销售效率或增长所需资本
        - 按渠道和客户细分索取全负荷 CAC；用 ACV 计算回本期
        - 重大
      - - 平均合同价值（ACV）分布
        - 无法确认收入集中风险，也无法判断企业客户与中端市场组合
        - 按合同和客户数索取 ACV 分布；识别前 10 大客户集中度
        - 重大
      - - 账上现金与现金消耗率
        - 无法评估相对既定增长计划的资本充足性
        - 索取最近月末资产负债表和过去 12 个月现金流量表
        - 重大
      - - 股权结构表与所有权结构
        - 无法评估稀释、治理权利或二级交易悬置压力
        - 索取股权结构表，覆盖所有证券类型、归属安排和任何二级交易
        - 重大
      - - 按职能拆分的员工数与薪酬成本
        - 无法验证现金消耗估计或评估招聘杠杆
        - 从薪酬记录索取按部门拆分的员工数和总薪酬年化运行额
        - 次要
      - - 企业合同结构（期限、自动续约、取消）
        - 没有合同条款，无法评估 ARR 质量或流失风险
        - 索取标准 MSA / 订单表模板；识别任何无因取消条款
        - 次要
    notes: 标为阻断的项目，是任何有约束力投资决策的必要条件。重大项目影响估值和承保假设。次要项目支撑运营尽调。数据室访问没有替代方案。
