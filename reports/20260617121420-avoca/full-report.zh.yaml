      - number: '1.3'
        title: 融资历史、投资人与战略背书
        blocks:
          - type: paragraph
            body: >-
              Avoca 的资本故事是公开记录中最清楚的部分之一。公司在 2026 年 4 月 27 日宣布，已经跨 Seed、Series A 和 Series B 融资超过 $125 million，估值 $1
              billion。多篇独立转述互相印证：Meritech 和 General Catalyst 领投 Series B，Kleiner Perkins 领投 Series A，Amplify
              Partners、Nexus Venture Partners 和 Y Combinator 也披露为投资方。


              PitchBook 为早期时间线补上了有用结构：2023 年 $500,000 加速器轮，2024 年 10 月 $10.3 million 种子轮，2025 年 6 月 26 日金额未披露的 Series
              A，以及 2026 年 4 月 27 日 $125 million Series B。私募市场数据库不应作为公司未独立披露经济数据的一手证据，但它们与官方融资叙事方向一致，也有助于重建时间线。


              投资人组合有战略意义，不只是装点门面。Kleiner Perkins 把 Avoca 描述为庞大线下服务经济的基础设施；Amplify 则把公司作为垂直 AI
              旗舰案例，强调它拿下第一客户触点，并让专有工作流数据复利。这种框架支持一个判断：投资人承销的不是单纯呼叫中心工具，而是面向服务运营、可能定义品类的应用层 AI
              公司。仍待尽调的问题是股权结构细节、所有权集中度和治理权利；这些均未公开。
