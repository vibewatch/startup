      - number: '1.5'
        title: 里程碑、战略逻辑与反向检查
        blocks:
          - type: paragraph
            body: >-
              里程碑节奏是连贯的。Avoca 2022 年成立，2023 年进入 Y Combinator，2024 年完成种子轮，2025 年中完成 Series A，随后在 2026 年 4 月跃升到 $1 billion
              Series B。与此同时，公司公开内容显示成熟度提升：到 2025 年，它已公开论证手工行业和家政服务特别适合 AI，因为电话驱动的预约直接决定收入；到 2026
              年，它发布了更多关于真人升级、旺季控制和客户体验策略的产品与运营材料。


              公开反向线索的核心不是法律麻烦，而是信任与执行风险。Homepros 2026 年 4 月访谈明确提出「AI trust dilemma」：承包商只有在系统表现至少达到最佳 CSR
              水平、并在高风险服务时刻守住客户信任时，才会完全投入。Avoca 自身材料强调 Human-in-the-Loop 覆盖、边缘案例升级，以及 AI 仍会把更难的 15–20% 电话交出去，部分验证了这一担忧。


              检索材料中没有出现重大公开诉讼、执法行动或领导层丑闻，但不能过度解读「没有证据」。真正的尽调负担在治理、经审计财务、精确客户数和员工数，以及公司从核心家政服务扩进相邻垂直时，强劲的收入叙事能否继续守住质量。
