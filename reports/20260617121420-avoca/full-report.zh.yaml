  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据支持对 Avoca 保持战略兴趣，但还不足以无条件接受其披露的 $1 billion 投后 Series B 估值。Avoca 确实拿到了机构背书：Meritech Capital、General
              Catalyst、Kleiner Perkins、Amplify Partners 和 Y Combinator 都在股东名单里，多家独立新闻报道也相互印证了超过 $125 million
              的融资额和独角兽估值。这一点重要，因为成熟的成长型投资人很少会把一家家庭服务工作流公司按「定义品类」来定价，除非他们相信它能复利长成大得多的平台。


              问题在于，公开记录远比估值所暗示的要薄。Avoca 唯一披露的财务数据，是 2025 年 ARR 突破八位数。这个说法既可能是 $10 million，也可能是超过 $90
              million；两者的差别，就是一个偏高但说得通的溢价倍数，和一个极端泡沫倍数的差别。公开材料也没有披露 cohort 留存、毛利率、CAC 回收期、烧钱速度、债务和清算优先权细节。


              因此，正确建议是有条件关注，置信度低、风险高。公司质量的投资逻辑可信，但入场价格只有在 data room 把 ARR
              锚定在披露区间上沿、并证明扩张经济性可持续时，才站得住。没有这些确认，投资人等于在看到牛市情景数字之前，先按牛市情景付价。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV025
              - CV027
              - CV034
