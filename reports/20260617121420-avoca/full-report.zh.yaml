      - number: '5.5'
        title: 信任、合规、安全控制与平台风险
        blocks:
          - type: paragraph
            body: >-
              Avoca 隐私政策（2025 年 1 月 29 日生效）确认数据传输中（HTTPS）和静态存储均加密。采集数据包括姓名、邮箱、电话、账单信息，以及——针对金融交易——政府签发 ID。该政策还记录了 Google
              Calendar OAuth 集成：Avoca 存储加密 OAuth tokens，以支持实时日历可用性读取、自动创建预约和变更同步。日历数据被描述为仅用于预约管理，不会与第三方共享用于营销。


              status.avoca.ai 状态页监控五个平台组件：Dashboard、Inbound、Outbound、Analytics 和 Omnichannel。截至 2026 年 6
              月，所有组件均显示完全正常运行。公司未发布正式 SLA、uptime 百分比保证，或无需认证即可访问的历史可用性报告。


              截至 2026 年 6 月，Avoca 公开文档中未发现已公开确认的 SOC 2 Type II、ISO 27001 或 HIPAA 认证。docs.avoca.ai
              站点包含「Security」导航项，但底层内容需要平台认证才能访问。对企业运营商——尤其 PE 支持的多网点平台——这是重大披露缺口，因为它们可能面对来自自身客户或投资人的合同合规要求。


              Outbound 的监管风险最尖锐。FCC 2024 年 2 月 Declaratory Ruling（FCC 24-17）确认，AI 生成、听起来像真人的语音电话构成 TCPA 下的「artificial or
              prerecorded voice」，在拨打任何此类电话前，需要每位接听者事先明确书面同意。Avoca 的 outbound AI calling 产品必须为每个 campaign
              中的每个联系人维护同意记录；通过自身账户拨打电话的运营商承担主要 TCPA 责任。公开披露未说明 Avoca 如何代表运营商管理同意验证、opt-out 处理或 campaign 合规检查。


              公开材料还能观察到三项产品层面的额外约束：(1) 垂直集中——整个产品词汇、派单逻辑、优先级系统和集成集合都专属 home services，未说明可移植到其他行业；(2) 幻觉与质量风险——同一篇 HITL
              博客一方面称系统处理 80–85% 电话，另一方面也确认边缘案例中 AI 生成摘要或预订逻辑错误需要同日工程介入，说明生产环境中的 AI failure modes 并不轻；(3) 集成依赖——如果
              ServiceTitan 限制第三方 API 访问、修改平台架构，或原生构建等价 AI，Avoca 会失去最重要的分发渠道。Homepros News 报道称，Avoca 创始人承认存在「AI trust
              dilemma」，且流失驱动包括 go-live 时运营商派单配置错误，这凸显配置质量如何影响外界对 AI 可靠性的感知。
