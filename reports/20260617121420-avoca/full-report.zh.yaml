      - number: '6.4'
        title: 留存、满意度与耐久性信号
        blocks:
          - type: paragraph
            body: >
              Avoca 未公开披露汇总 net revenue retention、gross revenue retention 或 churn rates。没有第三方留存基准。公开记录只提供间接信号。HL
              Bowman（93% AI 满意度得分）、Sila Services（接近零 abandoned calls）和 Rescue Air（持续多产品部署）的案例研究显示，完成部署的客户倾向于留存。Aire Serv
              Sevierville 案例研究报告称，从 live answering 切换到 Avoca 后维持 90% 预订率，这是间接耐久性信号。Avoca 联合创始人在 2026 年 4
              月采访中表示，三类情况构成大多数流失：后端流程尚未准备好接入 AI 的运营商、go-live 时派单与产能逻辑配置错误的案例，以及 PE 收购方带来偏好供应商时发生的所有权变化。按创始人口径，归因于 AI
              本身无法完成工作的流失很少。积极迭代、近实时发送反馈的客户，似乎比把部署视为 set-and-forget 安装的客户获得显著更高的预订率。缺少独立 cohort 或 NRR
              数据是重大尽调缺口；没有佐证前，投资人不能依赖公司自己的留存叙事。
