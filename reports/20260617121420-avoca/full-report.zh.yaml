  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 2026E ARR 假设
      - 增长率
      - 关键假设
      - 隐含退出估值
      - 概率信号
      - 主要下行触发因素
    rows:
      - - 牛市
        - $40M+
        - 50%+ YoY
        - NRR >115%，AI 处理率迈向 95%，新垂直领域放量，且未被 ServiceTitan 替代
        - 2028-2029 年按 20-25x ARR 达 $1.5B-$2.0B
