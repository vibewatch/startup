      - number: '6.5'
        title: 反向分析与证据缺口
        blocks:
          - type: paragraph
            body: >
              几个结构性问题限制了 Avoca 客户记录的证据质量。第一，所有已发布结果数据均来自 Avoca 制作的案例研究和一场联合创始人采访；截至 2026 年中，公开可访问形式中未见 G2、Capterra 或
              Trustpilot 上的独立撰写评价。这限制交叉验证，并产生 testimonial-selection bias：被选中发布的案例反映最有利的部署。第二，Avoca 的 outbound AI calling
              业务——包括 Speed-to-Lead 和 Outbound Campaigns——受 FCC 2024 年 2 月 Declaratory Ruling 约束，该裁定确认 TCPA
              对人工或预录语音的限制适用于 AI 生成语音电话。同意合规会增加运营摩擦，并让在没有适当同意流程下部署 outbound 功能的客户承担责任。第三，Avoca 战略价值集中在 PE
              支持的多品牌平台，形成双边风险：单一 PE 平台决定更换供应商，就能立即移除多个品牌。联合创始人承认，当被收购公司遇到有偏好供应商的 PE 买方时失去该客户，是反复出现的流失向量。第四，Avoca
              未披露汇总客户数，因此无法从公开记录评估渗透率、cohort 趋势或真实市场份额。第五，部署模型依赖高接触 FDE 上线，随着公司扩张，可能限制新客户获取速度。
