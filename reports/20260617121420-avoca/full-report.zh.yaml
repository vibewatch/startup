  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性地图
        blocks:
          - type: paragraph
            body: >
              Avoca 的风险画像来自新兴 AI 品类、集中客户基础和正在重新校准 AI 生成语音同意规则的监管环境三者交汇。公司面临的不是单一主导风险，而是至少四个独立且重大的敞口，并且彼此可能联动。Outbound AI
              calling 的 TCPA/FCC-24-17A1 合规，是最尖锐的监管敞口，因为 2024 年 2 月 FCC declaratory ruling 会让每个在未验证事先书面同意下运行 outbound
              campaigns 的 Avoca 客户，在每通电话上承担罚款责任。ServiceTitan 平台依赖是最尖锐的运营敞口；Avoca 核心预订能力依赖 ServiceTitan APIs，而
              ServiceTitan 同时在开发竞争性 AI 语音功能。PE 平台收入集中带来相关流失风险：平台运营商一次供应商偏好决定，就会同时移除数十个品牌部署。叙事与披露不匹配风险最具结构性且持续：Avoca 的
              $1B 估值建立在公司制作的结果指标上，没有独立方审计。下方风险热力图把所有风险类别按可能性和影响映射，传导图则展示监管、质量和依赖失败如何级联到收入、客户和融资结果。
