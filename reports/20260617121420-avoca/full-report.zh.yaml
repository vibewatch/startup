        title: 展示材料
        blocks:
          - type: callout
            title: 结构性顺风持久且多层叠加
            body: >-
              早于 AI 出现的劳动力短缺、把入站电话量集中的 $317B 延期维护积压、房主响应预期上升，以及头部运营商 AI 采用加速，共同为家政服务 AI
              前台自动化创造了异常宽且持久的需求。这些驱动不是宏观周期项；未来数年，无论短期经济如何波动，它们都会继续复合。
            calloutType: strength
