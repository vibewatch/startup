      - number: '7.7'
        title: 竞争、估值、周期性与披露风险
        blocks:
          - type: paragraph
            body: >
              ServiceTitan、HouseCall Pro 和 Jobber 合计拥有超过 200,000 家 small-business 客户，且都在积极构建原生 AI call-handling 或
              receptionist 能力。ServiceTitan 的 AI voice agent 博客瞄准 inbound HVAC 和 plumbing booking——正是 Avoca 变现的用例。如果主要
              FSM 平台把 AI voice 打包成零边际成本功能，Avoca 的 switching cost 论点会被侵蚀：客户已经为 dispatch 和 CRM 向 ServiceTitan 付费；增加原生 AI
              receptionist 功能会消除当前区分 Avoca 的集成步骤。Avoca 的 $1B 估值意味着在八位数 ARR 上超过 10x 的 ARR 倍数。TechCrunch 和 Axios 的 Series
              B 报道基于 Avoca 新闻稿；两家媒体均未独立验证 ARR、NRR 或增长率。该轮融资的 Hacker News 评论串质疑 booking-lift 方法。Avoca 所称 2026 年 $1B jobs
              booked 路径没有披露方法，也没有第三方佐证该数字。从宏观上看，home services 需求跟随住房交易、消费者信心和可支配收入；住房市场放缓会减少 trades 的紧急来电量，而这是 AI
              booking 的最高价值用例。ServiceTitan 的 AI voice 博客把旺季产能管理列为主要驱动——这是周期性需求信号。Avoca 未公开披露 ARR 增速、NRR
              或回本周期，意味着投资人必须基于公司提供的轶事，而不是标准化单位经济来承销估值。
