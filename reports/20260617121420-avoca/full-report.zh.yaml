      - number: '2.4'
        title: 增长驱动、采用约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              家政服务 AI 前台采用的主要增长驱动是结构性的，而且彼此强化。熟练手工行业面临严重劳动力供给失衡；Amplify 描述为每进入两名工人，就有五名工人离开。BLS 预测到 2034 年 HVAC 就业增长
              8%、电工增长 9%，说明即便运营商难以补齐电话处理人员，服务产能需求仍会持续。人员紧缺又叠加 ServiceTitan 2025 年秋季 Benchmark Report 指出的 $317 billion
              延期维护积压：2025 年 71% 房主推迟装修，62% 推迟关键维护，意味着 2026 年及以后进入的电话量很可能超过真人 CSR 团队在没有自动化支持时可吸收的上限。


              AI 采用信号也在迅速增强。Jobber 2026 Trends Survey 覆盖 1,000 多名服务企业主，数据显示 88% 高信心（排满单、仍在增长）企业已经使用 AI 工具，而低信心同业只有
              27%。超过一半受访企业使用 AI 做报价、开票和沟通。HVAC、管道和屋面行业领跑 AI 采用。这些采用曲线说明市场正从早期采用者阶段走向早期大众。经济账也在变强：ServiceTitan 面向 HVAC
              的分析估计，普通 HVAC 公司每年因无人接听电话损失 $45,000–$120,000；HousecallPro 引用的 McKinsey 研究估计，使用 AI 的企业最高报告 30% 成本节省。


              采用约束真实存在，但可管理。运营商和投资人评论中最常被提到的障碍是信任：承包商只有在 AI CSR 表现达到或超过最佳真人 CSR 时才会投入。Avoca 通过保留 Human-in-the-Loop
              项目承认这一点：约 15–20% 电话会升级给受训真人坐席。集成依赖是结构性门槛——AI 预约只有连接实时 CRM 可用性才有效，这让 Avoca 依赖 FSM 平台生态。小型运营商成本敏感，只有快速证明 ROI
              才愿意付费。2026 年宏观环境也带来额外阻力：3 月通胀同比 3.3%，消费者信心走弱，运营商在利润率压力下还要评估新技术投入。


              关键证据缺口包括：截至 2026 年中，家政服务企业采用 AI CSR 工具比例缺少独立数据；AI 与传统接听服务之间缺少第三方流失率和回本期对比；全国性运营商覆盖多个州，AI
              语音录音和披露义务的州级监管风险仍未解决。
