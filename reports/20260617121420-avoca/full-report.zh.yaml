  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Avoca 平台可观察的架构层，从外部渠道输入，到 AI 处理、集成、服务交付层，再到面向运营商的输出。层级来自 docs.avoca.ai、产品页和 API 参考推断；具体技术供应商未公开披露。
    approximationNotes: AI 模型供应商、电话通信供应商和云基础设施供应商均未公开命名。层级边界来自公开产品文档和 API 结构推断，并非架构披露。
    claimRefs:
      - CE001
      - CE018
      - CE021
      - CE023
      - CE024
      - CE041
    sourceRefs:
      - SE001
      - SE004
      - SE025
      - SE026
    data:
      layers:
        - label: 客户输入渠道
          detail: >-
            入站语音来电（7×24）、SMS / 短信、网页聊天、邮件、Google LSA 线索、Yelp / Angi / Thumbtack / Facebook 网页表单线索——全部通过电话通信和线索接入 API 写入
            Avoca 平台。
        - label: AI 对话引擎（技术栈未披露）
          detail: >-
            核心 LLM 和语音合成层处理自然语言理解、意图分类、异议处理和回复生成。底层模型供应商未公开披露。Webhook
            事件：call.completed、sms.received、chat.started、speed_to_lead.completed。
        - label: 运营商配置与知识库
          detail: 每个运营商的派单规则、优先级层级（P1/P2/P3）、人设与语气设置、工单类型分类、预约逻辑、季节性流程和紧急路由脚本。Forward Deployed Engineers 现场配置；可通过配置推送当天更新。
        - label: CRM 集成与排期层
          detail: >-
            与 40+ FSM / CRM 平台实时双向同步（ServiceTitan 深度集成；也包括 Jobber、HouseCallPro、Salesforce、Zoho、Service Fusion
            等）。读取实时产能，每通电话同步 12+ 个客户数据字段，直接预约工单。Webhook：appointment.scheduled。
        - label: HITL 服务层
          detail: >-
            将 15–20% 升级来电温转给北美、经 Avoca 培训的 CSR。<3 秒完成完整 AI 上下文交接。CSR 专门接受 Avoca
            平台和家政服务场景培训。Webhook：call.completed，带升级标记。
        - label: 分析与辅导层
          detail: Coach 按运营商评分量表为每通电话打分（异议处理、流程遵守、语气、预约结果）。通话重分类识别误记结果。统一分析看板提供多网点组合可视性。Webhook：coach.score_available。
        - label: 运营商看板与 API 层
          detail: >-
            为运营商和经理提供看板（实时产能视图、任务路由、辅导报告）。REST API 在 docs.avoca.ai 提供 Node.js/TypeScript 和 Python
            SDK。通过文档化集成手册支持定制集成。状态监控在 status.avoca.ai。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 入站服务电话穿过 Avoca 平台的端到端流程——从初次联系，到 AI 处理、可选 HITL 升级、CRM 预约，再到通话后辅导。图中展示优先级路由和上下文保留机制，这是 Avoca 价值主张的核心。
    approximationNotes: 转接时间、字段数和升级比例来自公司产品页和 HITL 博客表述。没有可用的独立验证 SLA 或准确率指标。
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE015
      - CE025
      - CE026
    sourceRefs:
      - SE001
      - SE006
      - SE007
      - SE003
    data:
      nodes:
        - id: call-arrives
          label: 来电进入（7×24）
          detail: 房主拨打运营商电话；Avoca 首响接起，零等待
        - id: customer-recognition
          label: 客户识别
          detail: AI 实时拉取 12+ 个 CRM 字段——历史工单、设备、会员层级、账户历史
        - id: intent-classification
          label: 意图与优先级分类
          detail: AI 将来电分类为 P1（紧急）、P2（更换 / 安装）或 P3（维护）；紧急安全来电直接路由到值班技师
        - id: ai-handling
          label: AI 对话（80–85% 来电）
          detail: AI 处理异议、收集工单细节、从实时 CRM 看板确认可用性，并在 CRM 中预约工单且填满所有字段；零人工录入
        - id: hitl-escalation
          label: HITL 温转（15–20% 来电）
          detail: AI 识别边缘案例或复杂度阈值；<3 秒温转给 Avoca CSR；客户重复任何信息前，CSR 已收到完整简报（来电者、问题、设备、语气）
        - id: job-booked
          label: CRM 中预约工单
          detail: 工单出现在派单看板上，带正确工单类型、客户数据和技师时段；需要时 P1 会覆盖低优先级时段
        - id: coach-scoring
          label: Coach 给通话打分
          detail: 每通电话完成后按异议处理、流程遵守、语气和预约结果打分；重分类标记误记为“无兴趣”的结果
        - id: intelligent-task-routing
          label: 智能任务路由
          detail: AI 生成摘要，并把高价值来电类型路由给合适团队成员（安装 → 内部销售；更换线索 → 销售团队；掉线电话 → 立即跟进）
      edges:
        - from: call-arrives
          to: customer-recognition
          label: 立即查 CRM
        - from: customer-recognition
          to: intent-classification
          label: 带上下文分类
        - from: intent-classification
          to: ai-handling
          label: 常规 / 可预约来电
        - from: intent-classification
          to: hitl-escalation
          label: 边缘案例或复杂问题（15–20%）
        - from: intent-classification
          to: job-booked
          label: P1 紧急 → 值班技师
        - from: ai-handling
          to: job-booked
          label: 直接在 CRM 预约
        - from: hitl-escalation
          to: job-booked
          label: 人工解决并预约
        - from: job-booked
          to: coach-scoring
          label: 预约后每通电话打分
        - from: job-booked
          to: intelligent-task-routing
          label: 高价值来电路由给团队
