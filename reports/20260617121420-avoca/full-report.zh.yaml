      - number: '7.5'
        title: 客户与收入集中风险
        blocks:
          - type: paragraph
            body: >
              Avoca 联合创始人在 2026 年 4 月披露，公司已在美国前 30 大 PE 支持 home-service 平台中的超过一半上线。这种分发策略的成功内嵌结构性风险：每个 PE
              平台既是高价值客户，也是渠道伙伴，意味着平台层面一次供应商偏好决定，就会同时把所有被收购品牌从 Avoca 移除。Sila Services（40+ 品牌、3,000+ 员工）是公开具名的最大客户；Sila
              退出相当于数十个单品牌同时流失。Avoca 2026 年 4 月融资公告和联合创始人访谈都承认，所有权变化——尤其 PE 收购 incumbent Avoca
              客户——可能触发供应商审查。公开记录中没有客户收入集中披露（top-3 或 top-5 share）；前三大客户累计贡献的 ARR 无法从公开来源得知。Amplify Partners 的 thesis
              letter 明确强调 Avoca 的 PE land-and-expand 模型是增长驱动，但同一模型在加速扩张的同时也制造相关损失敞口。持续整合的 home-services PE
              市场，可能催生更少但更大的平台，并进一步提高它们对技术供应商的议价能力。
