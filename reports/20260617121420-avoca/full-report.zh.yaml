      - number: '2.2'
        title: 市场规模——多重视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              没有任何单一分析机构发布面向家政服务 AI 语音自动化的独立 TAM；规模测算只能用多个覆盖范围和方法论不同的局部视角拼出。


              最宽的锚点来自 Kleiner Perkins 和 Amplify Partners 在公开 Avoca 投资论述中采用的服务经济框架。Kleiner Perkins 明确表示，「customer support
              automation for home services alone represents tens of billions in spend」，同时把更广的实体基础设施层描述为数万亿美元经济。Amplify
              则把家政服务本身称为「a multi-trillion dollar market」，认为 AI
              几乎尚未触及，并指出家政服务是维护美国老化住房存量的必要层。这些都是有吸引力的数量级锚点，但没有给出方法论，且混合了不同定义范围。


              更落地的规模视角来自现场服务管理软件市场。Grand View Research 估计全球 FSM 软件市场 2022 年为 $4.43 billion，并预测到 2030 年达 $11.78
              billion，复合年增长率 13.3%。北美约占该支出的 26.5%，意味着 2022 年北美 FSM 软件收入约 $1.17 billion；按相同份额外推，2030 年约为 $3.1
              billion。这些数字提供了相邻基准：Avoca 竞争的是 FSM 平台之上的沟通自动化层，而不是 FSM 本身，因此 FSM 市场规模约束的是 Avoca 服务的生态，而非 Avoca 直接进入的市场。


              第三个视角基于劳动力。BLS 数据显示，2024 年美国有 425,200 名 HVAC 安装工、504,500 名管道工和 818,700 名电工，仅三个手工行业就约有 1.75 million
              名工人。每名工人背后都有处理入站电话的业务单元。即便假设每四名手工工人对应一个 CSR 等价岗位，并且每个业务单元每年在接听服务和前台人员上只花
              $10,000–$30,000，仅核心手工行业的美国电话处理市场合计也达到每年数十亿美元。Jobber 平台覆盖 50+ 行业、拥有 100,000+ 企业客户，也为数字化服务企业宇宙的规模提供了另一个参照。


              这些规模视角共同指向一个大到不能忽视、但过于异质而无法用单一数字描述的市场。所有合理路径都指向前台自动化 SAM 达数百亿美元量级；Avoca 这类 AI 原生工具的 SOM 取决于 CRM
              集成覆盖、运营商付费意愿，以及 AI 信任采用的速度。
