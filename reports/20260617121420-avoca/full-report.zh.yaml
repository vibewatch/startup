        - 品类商品化迹象，或 ServiceTitan 以零增量成本捆绑 AI
      - - 一线投资方组合验证增长轨迹
        - 牛市
        - Meritech、GC、KP、Amplify 和 YC 均参与 Series B
        - 若 ARR 增长低于 40% YoY，或 NRR 低于 100%，倍数会压缩
      - - 面向 PE 支持的多网点客户，已有企业级 ARR
        - 牛市
