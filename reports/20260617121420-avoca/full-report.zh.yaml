      - number: '5.4'
        title: 分析、辅导与数据复利
        blocks:
          - type: paragraph
            body: >-
              Avoca Coach 在平台处理的每通电话上叠加 AI 评分层——包括 AI 处理和 HITL 处理的电话。每通电话按公司定义的 rubric
              在四个维度评分：异议处理、流程遵守、语气与共情、预订结果。管理者会看到 AI 生成的辅导摘要，里面列出 CSR 哪里漏掉、哪里做对的具体例子。产品页报告，使用 Coach 的客户预订率提升 15%、售出会员数增加
              2×、QA 时间减少 5×。一个单网点 HVAC 案例显示，系统把此前被误分类为「not interested」的电话重新分类并浮出后，90 天追回 $29K。


              通话重新分类功能在分析上很重要：声称的平均误分类率 12% 意味着，记录为「not interested」或「not booked」的电话中，大约每 8 通就有 1
              通其实可能可预订。对每月处理数百通电话的企业来说，这代表无需额外营销支出即可追回有意义收入。这项功能也影响数据质量：它修正 CRM 记录，进而提高历史分析和未来 AI 训练信号的准确性。


              Amplify Partners 的投资 thesis 明确把 Avoca 的专有工作流数据称为复合竞争壁垒：每一次部署都会把运营商专属通话模式、预订规则和客户行为数据加入系统知识库。HITL
              博客称系统「gets smarter every day it runs」——这是从生产数据持续学习的标准描述，但具体学习机制和模型更新节奏未公开。投资人口径把数据层视为抵御竞争替代的主要屏障：新的 AI
              进入者没有运营商专属训练信号，而 Avoca 的长期客户已经用多年的自身通话模式和预订逻辑训练了系统。
            claimRefs:
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
