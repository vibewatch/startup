            body: >
              截至 2026 年 6 月，Avoca 员工数在公开来源中介于 100 到 190，反映 Series B 后快速招聘。Forward-deployed engineer（FDE）模型——Avoca
              工程师到每个新客户现场，搭建部署专属预订逻辑、季节性规则和会员层级——制造了人力与增长的直接依赖。每个新企业部署都需要现场 FDE 时间；除非该模型被系统性产品化，客户基础翻倍大致需要 FDE
              人头同步翻倍。Avoca workforce-evolution 博客讨论了从高度人工部署模型转向更自动化配置工具的过程，但转型速度和完成度没有公开记录。Axios 2026 年融资报道提到 2026 年 4 月
              Series B 后加速招聘，但未拆分职能分布。创始团队和早期工程师的机构知识集中风险很重要：两位创始人在运营上都处于核心位置，公开资料未披露联合创始人层以下的治理继任或领导深度。
