  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价姿态与收入流
        blocks:
          - type: paragraph
            body: >-
              Avoca 是 SaaS 优先的平台，没有公开可访问的价格页（截至 2026 年 6 月，avoca.ai/pricing 返回 404），这与企业销售主导、而非自助式的获客销售
              动作一致。价格通过直销设定，合同按账户或多网点层级谈判。平台至少可分为四个创收模块：Avoca Inbound（入站电话处理 AI 语音）、Avoca Outbound（多触点短信和语音滴灌活动）、Avoca
              Coach（电话评分和分析），以及 Human-in-the-Loop（HITL）服务层，用受训真人 CSR 兜底升级电话。


              结构性收入模式是平台订阅，最可能按网点数或电话量分层，并可能对消耗的 HITL 分钟数和 Coach 分析模块收取附加费。由于价格未披露，平均合同价值估计只能依赖间接证据：公司创始人博客提到，运营商过去每年在传统
              CSR 人员配置或离岸接听服务上花费「$500,000+」，这为 Avoca 在不突破 ROI 主张前可收取的价格划出上限。竞争价格背景显示，纯 AI 替代品面向单人运营商为
              $49–$199/month（Rosie AI、GoodCall），混合真人-AI 服务为 $285–$1,000+/month（Smith.ai），暗示 Avoca 企业合同显著高于这些入门基准。


              Avoca 的销售动作与客户画像一致：多网点、PE 支持的平台，一个合同可同时覆盖 5–50+ 个网点。Nexstar Network
              合作伙伴关系通过其承包商会员基础提供独立渠道，降低中端市场账户对现场销售的依赖。企业 GTM 也意味着平均销售周期更长、实施成本更高，收入确认也比自助 SaaS 更复杂。


              Avoca 这种订阅加服务模式的收入确认，很可能在服务交付时按月确认（与 ASC 606 一致），实施费则可能在上线导入 期间确认。这些会计细节均未公开披露，因此收入质量评估只能依赖结构层面的推断。
