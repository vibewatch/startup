      - number: '1.4'
        title: 牵引力信号、客户证明与披露边界
        blocks:
          - type: paragraph
            body: >-
              Avoca 的公开牵引力主张很强，但量化程度有限。公司称 2025 年年度经常性收入突破八位数，并预计 2026 年通过平台预约 $1 billion 作业。公司还列举了
              Turnpoint、1-800-GOT-JUNK?、Goettl、ServiceTitan、Nexstar 和 Clover 等主要客户与合作伙伴，以及展示具体工作流整合和收入提升的客户故事，例如 Granite
              Comfort 2025 年底在九个品牌部署，Yost & Campbell 据称由 Avoca 捕获电话带来 20% 同比收入增长。


              产品页面让这些主张更具运营细节。Avoca 描述了一个 7×24 小时入站 AI：可路由紧急事项、直接在 CRM
              中预约作业、同步客户记录，并在保留上下文的情况下把边缘案例交给真人坐席。外呼和旺季材料又把故事延伸到生命周期营销、感知产能的排期和任务路由。合起来看，Avoca
              的价值主张是收入捕获加工作流控制，而不只是降低呼叫中心人力成本。


              但关键缺口仍在。公开来源没有给出经审计收入、毛利率、客户数或留存指标；公开评论中的客户数估计从「800+ contractors」到「1,000+ businesses served
              together」不等，且通常没有注明日期的方法论。因此，公司有可信的动能指标和客户证明，但公开材料的披露水平还不足以让投资人独立校准单位经济学或客户集中度。
