      - number: '7.2'
        title: 监管、TCPA 与隐私风险
        blocks:
          - type: paragraph
            body: >
              Telephone Consumer Protection Act（47 U.S.C. § 227）禁止在未事先明确同意的情况下，使用人工或预录语音向任何电话号码发起呼叫；现有业务关系等有限例外除外。FCC
              2024 年 2 月 declaratory ruling（FCC-24-17A1）明确把这一禁令扩展到 AI 生成语音电话，堵上部分供应商此前利用的缺口。该裁定让任何代表服务企业发起 AI
              语音触达的平台承担直接合规义务，这正好对应 Avoca 的 Speed-to-Lead 和 Outbound Campaigns 模块。违规的非故意情形每通电话 $500，故意违规最高每通电话
              $1,500；TCPA class actions 已基于数万通电话的触达量提起，对任何运行高量 AI outbound campaigns 的运营商来说，总敞口可能很大。

              Avoca 隐私政策（avoca.ai/legal/privacy-policy）承认数据收集，但未发布 SOC 2 Type II、ISO 27001、HIPAA 或 CCPA 合规认证。截至 2026 年 6
              月，docs.avoca.ai security page 未公开可访问（HTTP 404），意味着投资人无法独立确认 Avoca 对 homeowner PII
              维护的安全控制。美国多个州隐私法（California 的 CCPA、Virginia 的 CDPA、Colorado 的 CPA）赋予 data subject rights，适用于 Avoca
              处理其联系方式的居民。Avoca 服务条款 URL（avoca.ai/terms）在 2026 年 6 月也返回 404，意味着公开记录无法发现 AI 错误的合同责任结构。FTC 和 FCC 都把
              robocall 与 AI calling 执法列为 2026 年消费者保护重点，增加了客户投诉升级为正式执法的风险。公开记录中未发现针对 Avoca 或其客户的公开诉讼或监管行动；但考虑到 2024
              年裁定较新，没有证据并不等于合规。
            claimRefs:
