      - number: '7.4'
        title: 集成与平台依赖风险
        blocks:
          - type: paragraph
            body: >
              Avoca 的核心预订功能——路由来电、查询实时产能、写入 job records——依赖对 field service management 平台的实时 API 访问。ServiceTitan 估计占有美国
              HVAC 和 plumbing FSM 市场 40%+ 份额，是 Avoca 最关键的集成交易对手。Avoca 的 API 文档和 ServiceTitan developer portal 都显示双方通过
              booking、dispatch、CRM sync 和 capacity-management endpoints 深度集成；如果 ServiceTitan 调整定价、引入 rate limits，或撤销
              Avoca 的 marketplace listing，核心产品会受到重大损害。ServiceTitan developer portal 和 marketplace 均带有保留单方面修改权的标准 SaaS
              条款。竞争重叠显著：ServiceTitan 在 2024-2025 年发布博客，描述其自有面向 HVAC booking 的 AI voice agent；Avoca 在 ServiceTitan
              marketplace 上的 listing，则让两个产品处于可见的依赖与竞争张力中。

              Avoca 通过广度缓释这项风险——其 integrations page 显示支持 40+ FSM 平台——但与 ServiceTitan 的集成深度显著高于替代方案，多数高价值 PE
              支持平台客户也很可能运行在 ServiceTitan 上。Avoca npm SDK 和 API 文档确认第三方开发者可构建 custom integrations，这是间接耐久性信号；但 custom
              integrations 也带来自身维护界面。如果 ServiceTitan 以零边际成本把等价 AI voice functionality 作为平台功能提供给客户群，Avoca 最高价值部署目标所代表的
              TAM segment 会被消灭。Avoca 与 ServiceTitan 之间未披露任何公开合同条款。
