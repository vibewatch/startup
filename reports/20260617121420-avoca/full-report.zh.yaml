      - number: '1.2'
        title: 创始人、团队信号与组织依赖
        blocks:
          - type: paragraph
            body: >-
              Avoca 由 Tyson Chen 和 Apurva Shrivastava 共同创立。公开资料稳定显示两位创始人都有 MIT
              计算机科学背景，也讲述了相似的创始人与市场契合故事：他们从小为家族企业接电话，把漏接电话视为小企业真实而刺痛的问题，而不是抽象的软件题。Tyson 的公开履历包括 BCG 和 Nuro 产品工作；Apurva
              的公开履历包括 Apple AI、Sunshine、Retool，以及此前的创业经历。


              创始人之外，团队披露相对单薄。Avoca 的招聘和文化页面点名了少数工程、销售和技术客户管理人员，并强调 Union Square
              高度到岗办公的文化，但没有发布常规管理层页面或详细董事会名单。因此，公司在创始人身份和文化上可读性较强，但治理深度、职能接班和完整高管梯队仍不透明。


              员工数是近期最大的披露冲突。Avoca 2026 年招聘页面称公司「100 people and growing」，General Catalyst 招聘板称其不到两年扩张到 100+ 员工，Y
              Combinator 档案仍显示 85 名员工，PitchBook 显示 158 名员工，Tracxn 则把 Avoca 列为 Series B 公司但没有消解差异。方向上可以确定的是 Series B
              后快速招聘；精确当前员工数仍未解决，应在尽调中直接核验。
