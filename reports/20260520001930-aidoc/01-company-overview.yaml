  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-footprint
    missingEvidence: A current official corporate contact or legal page that explicitly states Aidoc’s headquarters structure across New York and Tel Aviv.
    whyItMatters: Headquarters and control location affect jurisdiction, go-to-market assumptions, and refresh-to-refresh identity consistency.
    diligencePath: Fetch an official legal/contact page or corporate registry filing that states the operating headquarters and legal entity address.
    relatedQuestionRefs:
    - QO004
  - type: private-evidence-only
    severity: material
    topic: current-fda-cleared-count
    missingEvidence: A current official product matrix or regulatory listing that states one stable, up-to-date count of Aidoc FDA-cleared solutions.
    whyItMatters: Public sources reference 15, 17, 31, and “several dozen” counts, which affects competitive framing and KPI consistency.
    diligencePath: Export Aidoc’s current FDA-cleared product list from the FDA database or a current Aidoc product-information page with a dated count.
    relatedQuestionRefs:
    - QO008
  - type: private-evidence-only
    severity: material
    topic: unicorn-valuation
    missingEvidence: A post-2024-05-20 financing source that discloses the valuation attached to Aidoc’s most recent growth round or Series E.
    whyItMatters: Without a disclosed valuation, the report cannot confirm that Aidoc remains a private unicorn despite its funding scale.
    diligencePath: Obtain an investor deck, term-sheet summary, or credible press report that states the round valuation.
    relatedQuestionRefs:
    - QO013
  - type: missing-source
    severity: minor
    topic: 170-plus-model-count
    missingEvidence: A dated official product catalog or regulatory table that enumerates Aidoc’s current model count.
    whyItMatters: The prompt’s 170+ AI model context is widely repeated in the market, but it is not supportable from the fetched evidence.
    diligencePath: Request a current product inventory from Aidoc or fetch a public catalog that enumerates all deployed models.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue-and-headcount
    missingEvidence: A current public revenue disclosure, ARR proxy, or authoritative headcount disclosure.
    whyItMatters: These are cover metrics for scale and operating maturity but remain opaque for a private company.
    diligencePath: Use an investor presentation, audited filing, or company-confirmed workforce disclosure in the next refresh.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-leadership-roster
    missingEvidence: A full public executive roster beyond the founders and a handful of quotable leaders.
    whyItMatters: Leadership concentration and succession risk cannot be assessed comprehensively without a fuller public roster.
    diligencePath: Fetch a leadership page with complete bios or validate additional leaders through recent company announcements.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: full-investor-map
    missingEvidence: A complete cap table or a consistently published investor list across all rounds.
    whyItMatters: The public investor map is sufficient for major backers but not for full governance rights or dilution analysis.
    diligencePath: Request cap table excerpts or fetch a database record with full round-by-round participation and board rights.
    relatedTableRefs:
    - TO003
