- id: risks-evidence-gaps
  title: Adverse signals and unresolved evidence gaps
  body: 'The strongest negative evidence fetched in this run is not a lawsuit or warning letter, but a combination of technical and market constraints that limit how aggressively the company’s claims should be read. Aidoc’s own model card is more candid than its marketing pages about what remains unobserved: important demographic attributes are not available inside DICOM, so bias monitoring has to rely on proxies and post-market performance tracking rather than full direct measurement. External evidence also reinforces the need for caution. A May 2026 real-world pulmonary-embolism study summary said Aidoc’s algorithm matched radiologists in 97.8% of 32,501 scans, but also missed 15% of confirmed PE cases and lost most adjudicated disagreements, preserving the need for human oversight. Separately, reimbursement literature on generalist radiology AI says current payment frameworks still fit these products poorly, which means Aidoc’s ROI story likely depends more on error avoidance, throughput,
    and downstream care management than on direct payment codes. Most importantly for company-level diligence, four issues remain unresolved: current valuation/unicorn status, a stable current FDA-clearance count, a supportable current headcount, and a sourced 170+ model count. The report therefore treats Aidoc as a well-capitalized, high-scale private company with meaningful regulatory proof points—but not as a fully disclosed business whose valuation and coverage metrics can be accepted without qualification.'
