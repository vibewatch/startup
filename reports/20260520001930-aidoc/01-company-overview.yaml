- id: founders-leadership
  title: Founders, leadership, and key-person concentration
  body: 'Aidoc’s founder set is unusually well corroborated for a private company. The official leadership bios identify Elad Walach as co-founder and CEO, Michael Braginsky as co-founder and CTO, and Guy Reiner as co-founder, chief architect, and general manager of the Tel Aviv branch. CTech’s July 2025 reporting matches those roles and dates the founding to 2016. Functionally, the trio still appears to anchor the core business model: Walach is the external spokesperson and financing voice, Braginsky appears in both technical and funding coverage as the foundation-model architect, and Reiner’s remit over the Tel Aviv branch implies deep continuity in product and engineering execution. Publicly visible non-founder executives exist, but they are much less comprehensively disclosed; the record surfaced here is strongest for founder leadership and much thinner for the broader management bench. That makes key-person concentration a real diligence item rather than a generic startup caveat. Aidoc’s
    public materials do show growing organizational maturity—such as explicit discussion of governance, drift detection, and enterprise monitoring—but the public record still does not provide a fully exhaustive leadership roster or a refresh-to-refresh clean view of how authority is distributed below the founders.'
