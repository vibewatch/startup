company:
  name: Aidoc
chapter:
  number: 1
  title: Company Overview
  summary: Aidoc is a private clinical AI company founded in 2016 by Elad Walach, Michael Braginsky, and Guy Reiner, with a current operating footprint spanning New York-facing commercial activity and a Tel Aviv branch that still anchors core technical leadership. Fetched 2025-2026 evidence shows the company moved from a 2022 $110 million Series D to a July 2025 $150 million growth round and an April 2026 $150 million Series E led by Goldman Sachs, taking cumulative disclosed funding to more than $500 million. Aidoc’s thesis now rests on the combination of its aiOS enterprise platform and CARE foundation model, but current public evidence still leaves gaps around valuation, a stable current FDA-clearance count, exact headcount, and the often-repeated 170+ model claim.
sections:
- id: identity-product
  title: Identity, footprint, and product architecture
  body: 'Aidoc’s public materials consistently frame the company as a clinical AI vendor rather than a narrow radiology-algorithm shop. The official about page says the company is focused on helping healthcare teams optimize patient treatment and economic value, while the aiOS and CARE pages show how that positioning has widened from image triage into a broader enterprise workflow layer. aiOS is described as the control plane that runs, orchestrates, and governs clinical AI across a health system, connecting PACS, EHR, mobile, and care tools. CARE, in turn, is positioned as the multimodal foundation model that lets Aidoc move beyond single-condition tools toward broader disease coverage, automated measurement, and eventually draft-report generation. This matters because it changes the company’s investment case: Aidoc is no longer selling only acute-finding alerts to radiologists, but an operating layer for multi-algorithm deployment, care coordination, and model governance. Fetched sources
    support a clear New York commercial posture through the 2026 financing announcements, while Guy Reiner’s official bio still explicitly identifies him as general manager of the Tel Aviv branch. The resulting picture is a company with Israeli technical roots, a visible New York-facing capital-markets presence, and a strategy built around enterprise deployment rather than departmental point solutions.'
