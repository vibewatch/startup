- id: capital-investors
  title: Funding history, investor mix, and valuation visibility
  body: 'Aidoc’s capital path has accelerated materially in the last two years. The official 2022 Series D announcement recorded a $110 million round that brought cumulative funding to $250 million. By July 2025, PR Newswire, Calcalist, and Globes all reported a new $150 million growth financing led by General Catalyst and Square Peg, with NVentures and several major U.S. health systems also participating; both PR Newswire and Globes referenced an additional $40 million revolving credit facility and a cumulative total of $370 million. Then, in April 2026, Aidoc and Goldman Sachs Alternatives each announced a $150 million Series E led by Goldman, with General Catalyst, SoftBank Vision Fund 2, and NVentures joining. Those April 2026 materials state only that total funding is now “over $500 million,” not the exact figure. That distinction matters because it is enough to establish serious capitalization but not enough to settle valuation. The strongest post-2024 source on that point is actually
    Globes’ July 2025 interview, where Michael Braginsky explicitly said the company would not disclose the valuation of the financing round. As a result, the company’s private-unicorn status remains a genuine evidence gap in this run: high funding and rising scale are clear, but no fetched source dated after 2024-05-20 disclosed a valuation that would let this report confirm a current unicorn mark.'
