- id: TV002
  title: Thesis / anti-thesis table
  notes: The central disagreement is not whether Aidoc is real, but whether its undisclosed current valuation is justified by public evidence.
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Commercial traction
    - Named health-system rollouts and 100M analyzed cases suggest real adoption momentum
    - Rollout count does not equal disclosed paid revenue or durable expansion
    - Show signed ARR, paid utilization, and renewal by cohort
  - - Strategic validation
    - Goldman, AWS, General Catalyst, SoftBank, and NVentures validate the category
    - Strategic backing can amplify price opacity rather than resolve it
    - Disclose current post-money and board valuation memo
  - - Regulatory proof
    - New FDA clearance reduces “science project” risk
    - Regulatory progress does not prove unit economics or exit-quality revenue
    - Show revenue contribution by cleared products and margin profile
  - - Private comparables
    - Abridge and Viz.ai show premium valuations are possible for leading healthcare AI vendors
    - PathAI and Paige show not every healthcare AI company sustains a premium independent outcome
    - Show why Aidoc should clear the premium bar versus sale or compression scenarios
  - - Market environment
    - Selective but functioning late-stage market still rewards winners
    - Rock Health and Cooley both describe concentration and continued term selectivity
    - Show a clearly superior growth and efficiency profile versus peers
  - - Unicorn label
    - Aidoc is likely above the symbolic threshold if recent undisclosed rounds stepped up
    - No post-2024-05-20 public source proves the current price is at or above $1B
    - Produce a current primary round valuation disclosure or audited secondary reference
