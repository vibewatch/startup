- id: SV-2
  title: Financing history and what public sources actually confirm
  body: |-
    The last fully publicized Aidoc round with a disclosed dollar amount is the $110 million Series D announced in June 2022. That announcement clearly disclosed size and cumulative capital, but not post-money valuation. Public later evidence becomes less transparent rather than more transparent. Aidoc’s April 2026 Series E release disclosed a new $150 million financing and total capital above $500 million. Independent 2025-2026 press coverage also described additional or higher financing, but still did not pin down a current post-money value.

    That asymmetry matters. Investors often assume later rounds automatically clarify price discovery; in Aidoc’s case, the public record does the opposite. It proves that capital kept arriving, that the investor set improved, and that the company is still in motion. It does not prove what new investors actually paid, how the cap table changed, or whether the headline mark would survive a public-market or strategic-acquirer reality check. In other words, Aidoc’s financing history today is strong evidence of sponsorship and weak evidence of price.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV009
  - CV010
  - CV011
- id: SV-3
  title: Comparable valuation anchors
  body: |-
    The cleanest public anchor for Aidoc is not another opaque private round but the gap between premium public AI multiples and mainstream healthcare-IT multiples. Tempus is the premium outlier at roughly 9.0x market-cap-to-revenue on the cited 2026 anchors. RadNet and GE HealthCare are closer to 2x-3x, while Phreesia and Health Catalyst sit much lower. The message is straightforward: public markets will pay up for differentiated healthcare AI and data scale, but the premium only becomes durable when revenue scale and quality are visible.

    Private comparables tell a similar but more nuanced story. Viz.ai and Abridge show that category-leading healthcare AI companies can secure rich funding support. PathAI’s 2026 Roche deal and Paige’s 2025 sale to Tempus show that not every clinically credible AI asset gets priced like a standalone platform. For Aidoc, this means the upside case is real, but the burden of proof is also real. Without disclosed economics, the rational approach is to bracket plausible value against these comparable bands rather than treat private scarcity as self-validating.
  claimRefs:
  - CV013
  - CV014
  - CV015
