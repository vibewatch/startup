  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-valuation
    missingEvidence: The exact post-money valuation and round structure for Aidoc’s most recent financing.
    whyItMatters: Without the current price, any public-market comparison can only bracket plausibility, not underwrite entry.
    diligencePath: Request the signed term sheet, cap table snapshot, and board-approved valuation materials.
    relatedQuestionRefs:
    - QV004
    - QV005
    relatedTableRefs:
    - TV001
    - TV003
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Current ARR, GAAP revenue, gross margin, cohort retention, and expansion data.
    whyItMatters: Valuation cannot be converted into a credible multiple without revenue and quality-of-revenue evidence.
    diligencePath: Request the last eight quarters of revenue, gross margin, retention, and cohort expansion by major product line.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preferences-and-dilution
    missingEvidence: Exact liquidation preferences, participation rights, and any structured terms in 2025-2026 financings.
    whyItMatters: A high headline valuation can still produce poor investor outcomes if the preference stack is aggressive.
    diligencePath: Review financing documents, option pool expansion, and pro forma ownership by round.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: paid-usage-conversion
    missingEvidence: Evidence that enterprise rollouts translate into paid recurring usage rather than prestige deployments.
    whyItMatters: Commercial traction matters only if it becomes durable paid revenue with expansion, not just implementation footprint.
    diligencePath: Request contract value, live-account utilization, renewal rates, and pilot-to-production conversion by customer.
    relatedQuestionRefs:
    - QV006
    - QV019
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: unicorn-verification-and-comp-coverage
    missingEvidence: A post-2024-05-20 public source that explicitly states and documents Aidoc’s current valuation at or above $1 billion, plus broader directly comparable private clinical-AI valuation disclosures.
    whyItMatters: The “unicorn” label materially affects secondary pricing expectations and headline positioning, and sparse private-comp disclosure limits how exhaustive TV004 can be.
    diligencePath: Treat unicorn status as unconfirmed until a primary financing document or clearly sourced post-money disclosure is produced, and treat TV004 as a curated rather than exhaustive comp set until more private disclosures are available.
    relatedQuestionRefs:
    - QV005
    - QV030
    relatedTableRefs:
    - TV004
