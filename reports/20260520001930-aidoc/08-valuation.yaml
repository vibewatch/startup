- id: TV005
  title: Thesis-break and kill triggers table
  notes: These are thesis-break triggers for a prospective investor, not statements that the triggers have already occurred.
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Unfavorable financing reset
    - Any flat or down round relative to the undisclosed 2025-2026 pricing context
    - Signals current private mark outran underlying economics
    - Re-underwrite from public-comp corridor, not prior private mark
  - - Weak revenue quality
    - Signed ARR, expansion, or gross-margin data fail to support premium AI narrative
    - Breaks case for paying a scarcity premium
    - Move stance from research-more toward avoid at premium pricing
  - - Rollout without monetization
    - Enterprise deployments do not convert into paid recurring expansion
    - Traction becomes vanity rather than value
    - Lower revenue assumptions and exit range
  - - Reimbursement bottleneck
    - Hospitals cannot fund Aidoc beyond pilots because payment remains unclear
    - Caps adoption speed and pricing power
    - Compress base and bull valuation cases
  - - EHR-native encroachment
    - Incumbent workflow vendors absorb the budget category
    - Shrinks differentiation and standalone value
    - Treat as moat impairment and strategic-sale bias
  - - Aggressive preference stack
    - Latest round includes investor protections that subordinate new money economics
    - Headline valuation no longer reflects investor outcome quality
    - Pause and demand cap-table diligence before proceeding
