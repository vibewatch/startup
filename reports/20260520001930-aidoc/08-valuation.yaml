- id: TV006
  title: Final diligence asks table
  notes: These asks are the minimum package needed to move from a directional view to an investable valuation judgment.
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current post-money valuation
    - Exact round price and cap-table mark
    - Without it, entry discipline is impossible
    - Request signed term sheet and board materials
  - - Revenue quality
    - ARR, GAAP revenue, gross margin, NRR, and cohort expansion
    - Needed to convert price into a multiple and judge durability
    - Request CFO-attested operating metric pack
  - - Preference stack
    - Liquidation preferences, participation rights, anti-dilution, and pool expansion
    - Determines whether headline valuation translates into investor outcome
    - Review financing docs with counsel
  - - Paid deployment conversion
    - Contract value, utilization, renewal, and expansion by major customer
    - Separates marquee logos from durable monetization
    - Request customer-cohort commercial dashboard
  - - Unit economics by workflow
    - Implementation cost, support cost, cloud cost, and payback by use case
    - Needed to test whether premium software multiples are justified
    - Request product-line contribution margin model
  - - Regulatory roadmap
    - Upcoming submissions, PCCP scope, and post-market monitoring cadence
    - Regulatory burden can slow launches and dilute multiples
    - Review RA/QA roadmap and correspondence log
