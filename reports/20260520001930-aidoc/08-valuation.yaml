- id: SV-5
  title: Diligence asks and thesis-break triggers
  body: |-
    The most important diligence item is the simplest one: what is the current price? Without that, even the best comparable analysis remains only a plausibility test. The second blocker is revenue quality—ARR, margin, retention, paid usage conversion, and preference stack. If those metrics are strong, Aidoc could plausibly deserve a premium. If they are mediocre, the public comparator band would compress the valuation case quickly.

    That leads directly to thesis-break triggers. A flat or down round against the opaque 2025-2026 context would be a red flag that earlier private marks outpaced fundamentals. Failure to convert marquee rollouts into paid expansion would tell the same story more slowly. And if reimbursement or incumbent workflow vendors keep hospitals from assigning durable budget to Aidoc, the company will look more like a useful feature layer than a premium standalone platform. Until those questions are answered, the right closing posture is disciplined curiosity rather than eagerness.
