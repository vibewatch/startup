company:
  name: Aidoc
chapter:
  number: 8
  title: Valuation
  summary: 'Aidoc has enough public traction to justify serious diligence, but not enough public pricing transparency to justify an investable valuation call. The last fully disclosed round in primary public sources is the $110M Series D announced in 2022; later 2025-2026 financing evidence confirms stronger sponsorship and more capital, yet still does not disclose a current post-money value. Public comparables range from roughly 0.4x to 9.0x market-cap-to-revenue, with Tempus as the premium AI outlier and mainstream healthcare IT or imaging nearer 1x to 3x. That makes the right recommendation Research-More / Track: if Aidoc’s internal revenue quality is strong, a premium outcome is possible, but if it is merely good, today’s undisclosed private price could be stretched. Because no post-2024-05-20 public source clearly discloses a current valuation, Aidoc’s current unicorn status remains an explicit evidence gap rather than a confirmed fact.'
sections:
- id: SV-1
  title: Recommendation and valuation stance
  body: |-
    Aidoc looks like a real category participant with real traction, but public evidence still stops short of an investable price call. The company can point to a new FDA clearance, named enterprise deployments, over 100 million analyzed patient cases, and strategic backing from AWS, Goldman Sachs Alternatives, General Catalyst, SoftBank Vision Fund 2, and NVentures. That is enough to rule out the dismissive view that Aidoc is merely a concept-stock story. It is not enough to justify paying a premium private valuation blindly.

    The core problem is valuation opacity. Public post-2024 financing coverage confirms more capital and more investor support, but not a clean current post-money number. That means there is no public way to translate today’s implied private price into a revenue multiple, margin-adjusted multiple, or preference-adjusted outcome. My stance is therefore research-more / track. The company may deserve a premium if internal metrics are strong, but public evidence today supports curiosity, not conviction. Because a post-2024-05-20 current valuation is not disclosed, Aidoc’s unicorn status should be treated as an unconfirmed label rather than a verified fact.
  claimRefs:
  - CV003
  - CV011
