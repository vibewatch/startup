- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Persistent radiologist shortage
    - Positive for demand
    - Structural / multi-year
    - Supports AI triage and workflow automation purchases
    - Quantify local shortage intensity for target buyers rather than relying on national averages
  - - Imaging utilization growth
    - Positive for demand
    - Structural / long-term
    - More scans per radiologist raise the value of prioritization and orchestration
    - Validate which modalities and service lines create the sharpest backlog pain
  - - Hospital category dominance in radiology AI
    - Positive for demand
    - Current
    - Fits Aidoc’s enterprise health-system sales model
    - Test whether smaller hospitals can justify enterprise pricing without scale economics
  - - Sparse paid CPT coverage for most imaging AI
    - Negative / constraint
    - Current
    - Slows category adoption and forces ROI to come from operating savings
    - Map direct reimbursement status for Aidoc’s exact acute indications
  - - Adaptive AI governance and PCCP burden
    - Negative / constraint
    - Current / recurring
    - Raises lifecycle cost for vendors and validation work for buyers
    - Check which Aidoc products already have mature change-control plans in place
  - - Legacy PACS/EHR integration friction
    - Negative / constraint
    - Current
    - Creates slow procurement, IT burden, and pilot fatigue
    - Confirm implementation effort by buyer archetype and installed IT stack
  - - Need for human oversight in discordant cases
    - Negative / constraint
    - Current
    - Caps autonomy claims and preserves radiologist-in-the-loop workflow design
    - Review site-level performance and adjudication data before extrapolating ROI
  - - Move toward system-wide clinical AI platforms
    - Positive for demand
    - Current / near-term
    - Favors vendors with orchestration, governance, and customer-success depth
    - Verify whether customers standardize on aiOS or still buy point solutions in parallel
  notes: The main commercial bottleneck remains reimbursement, followed by integration cost and the limits of current human-off-the-loop use. Several positives are structural, but near-term conversion still depends on health-system budgeting behavior.
