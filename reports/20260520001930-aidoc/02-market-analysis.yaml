  - - Hospital base
    - U.S. provider institutions
    - 6,100 hospitals / 907,216 staffed beds
    - High confidence; direct AHA count
    - Institution count does not reveal software budget or IT readiness
  - - Global radiology AI market
    - Global category
    - US$0.76B in 2025 to US$2.27B in 2030
    - Medium confidence; analyst market report
    - Category scope still includes vendors and use cases outside Aidoc’s core product mix
  - - Hospital share of radiology AI
    - Global category split
    - ~55% of 2024 market
    - Medium confidence; analyst segment share
    - Segment share does not equal Aidoc-specific SAM
  - - Aidoc disclosed installed-base proxy
    - Company footprint
    - 150+ health systems in 2025; nearly 2,000 hospitals in 2026
    - Medium confidence; company disclosures
