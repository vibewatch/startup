    - Enterprise radiology + care-coordination software inside hospital systems
    - 'Low: US$4B / Mid: US$8B / High: US$16B'
    - Low confidence; proxy range based on tiny fractions of hospital spend rather than reported pricing
    - Necessary because no public Aidoc pricing or category-wide contract benchmark was fetched
