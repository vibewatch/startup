tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Radiology workflow AI
    - Triage, prioritization, quantification, follow-up activation inside imaging workflows
    - Imaging hardware revenue, scanner replacement, generic PACS licenses
    - Radiology departments, CMIO/CIO, enterprise operations
    - Core Aidoc wedge and clearest current budget line
  - - Cross-specialty care coordination
    - Multidisciplinary activation, patient management, urgent follow-up orchestration
    - Generic patient portal, call-center SaaS without imaging trigger
    - Health systems and service-line leadership
    - Important expansion layer that widens budget ownership beyond radiology
  - - Enterprise clinical AI operating layer
    - Model orchestration, governance, monitoring, analytics, and platform deployment
    - Standalone single-algorithm point tools without orchestration
    - Large health systems standardizing AI governance
    - Critical to Aidoc’s aiOS narrative and platform differentiation
  - - Adjacent oncology / cardiovascular workflows
    - Use cases tied to cancer burden, CAC, vascular and cardiology expansion
    - Drug discovery, therapeutics, oncology EHR systems as a whole
    - Specialty departments and enterprise imaging programs
    - Plausible adjacency, but not yet the cleanest public revenue core
  - - Excluded general healthcare IT
    - Billing, ERP, generic EHR, clinical documentation at large
    - Point-of-care imaging triage and care-team activation
    - Hospital IT budgets broadly
    - Outside the market boundary even when technically integrated
  - - 'Status-quo substitute: human workflow'
    - Radiologist review queues, manual notification chains, care-team paging and follow-up
    - Autonomous diagnosis claims
    - Hospitals bearing labor and delay costs
    - The incumbent workflow Aidoc is trying to compress rather than replace outright
  notes: The boundary is drawn around software and workflow layers attached to imaging and downstream action. Broad “AI in healthcare” and hardware categories are intentionally excluded unless they clearly overlap with Aidoc’s deployment economics.
