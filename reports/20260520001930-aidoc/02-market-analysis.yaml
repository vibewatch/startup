- id: buyers-adoption
  title: Buyer map and adoption path
  body: 'The strongest public deployment evidence suggests Aidoc sells into large provider organizations rather than through direct payer reimbursement or consumer channels. Hartford HealthCare framed its deal around cross-department collaboration, AI governance, and reduced care delays across radiology, cardiology, vascular, neurology, and the emergency department. Asklepios framed its rollout around radiology shortages, support for smaller sites, and 24/7 emergency coverage. Those examples imply a buyer map in which radiology leaders, CMIOs, CIOs, and health-system operations teams all matter, with budget ownership shifting based on whether the product is purchased as a departmental radiology tool or an enterprise platform. Aidoc’s own marketing sharpens that point: the company emphasizes one integration, multi-algorithm orchestration, and the extension of radiology signals into patient management. That combination makes adoption less about winning a single algorithm bake-off and more
    about proving that the platform reduces friction across an imaging workflow. The public rollout evidence also suggests the adoption path follows a standard enterprise-software pattern: problem recognition, integration design, pilot validation, then system-wide rollout. Aidoc’s disclosed installed base is already large enough that the commercial question is not whether the product can leave pilot mode, but whether buyer budgets and governance structures will support broader enterprise standardization.'
