  evidenceGaps:
  - type: missing-source
    severity: material
    topic: eu-regulatory-status
    missingEvidence: A public CE-MDR or equivalent European conformity update for Aidoc’s new comprehensive foundation-model triage product.
    whyItMatters: European commercialization and post-market obligations affect both regulatory scope and international growth assumptions.
    diligencePath: Request the notified-body status, CE technical documentation summary, and launch-country list for the new product line.
    relatedQuestionRefs:
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Independent security attestations such as SOC 2 Type II, HITRUST, penetration-test summaries, and standard BAA language.
    whyItMatters: Security maturity is central to hospital procurement and breach-loss severity, yet public evidence is still light.
    diligencePath: Request the latest audit letters, pen-test executive summary, customer security packet, and incident-response metrics.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
  - type: access-blocked
    severity: minor
    topic: adverse-event-search
    missingEvidence: A comprehensive public legal-docket and incident-database sweep linking Aidoc to any sealed or non-indexed litigation.
    whyItMatters: The absence of a visible public case should not be mistaken for proof that no disputes or incidents exist.
    diligencePath: Run PACER, state-court, MAUDE, and EUDAMED checks and obtain a litigation schedule from counsel.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: procurement-economics
    missingEvidence: Signed contract terms showing pilot-to-production conversion, pricing floors, reimbursement assumptions, and ROI realization by use case.
    whyItMatters: Without contract economics, it is hard to know whether marquee deployments translate into durable gross margin and renewal quality.
    diligencePath: Ask for cohort-level pipeline conversion, deployment timelines, realized ROI studies, and reimbursement assumptions by workflow.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR020
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: platform-dependence
    missingEvidence: The exact commercial and technical terms governing Aidoc’s AWS, Epic, and OEM relationships.
    whyItMatters: Dependence on distribution and interoperability partners can change margin, bargaining power, and renewal risk quickly.
    diligencePath: Request reseller/OEM concentration, cloud-spend concentration, Epic/App Orchard dependency detail, and termination/change-of-control clauses.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR016
    - QR017
    relatedTableRefs:
    - TR003
