- id: SR-2
  title: Security, privacy, reimbursement, and procurement risk
  body: |-
    Aidoc’s public materials point to a serious but only partially disclosed control environment. The security page references NIST CSF and AWS hosting, and the data-transfer notice says Aidoc is certified to the EU-U.S., UK, and Swiss DPF frameworks. That is useful baseline evidence, but it is not the same as seeing current SOC 2, HITRUST, penetration-test, incident-response, or BAA detail. In healthcare procurement, missing assurance detail can matter almost as much as a known weakness because it elongates security review and makes breach downside harder to price. HHS OCR’s 2026 ransomware settlements underline that HIPAA enforcement is ongoing and operational, not theoretical.

    Reimbursement risk compounds procurement risk. Independent radiology sources and the ACR both note that AI reimbursement still lags the volume of FDA-cleared tools because most imaging AI products remain tied to Category III tracking codes instead of durable payment-linked Category I economics. Aidoc can still sell on ROI without direct reimbursement—as Advocate Health and Novant show—but that makes each enterprise sale more dependent on local budget ownership, workflow redesign, and proof of measurable throughput or outcome gains. This is survivable, but it makes adoption slower, stickier, and more sensitive to CFO scrutiny than a clean reimbursement-backed standard of care would be.
  claimRefs:
