- id: SR-4
  title: Execution, leadership, and investment kill criteria
  body: |-
    Aidoc’s execution risk is rising with its scale. By January 2026, the company said aiOS had surpassed 100 million analyzed patient cases; by February and April it was publicizing multi-site rollouts in Germany, the Netherlands, Southern California, and Advocate Health. That is evidence of product-market fit, but it also means implementation quality, post-market surveillance, and customer-success discipline matter more than in an earlier algorithm phase. On leadership, Aidoc improved its bench materially in 2026 by adding former AMA president Jesse Ehrenfeld as chief medical officer, and the leadership page shows a more developed executive team than a pure founder-centric startup. Even so, Elad Walach remains central to the company’s public narrative and financing posture, so key-person risk is reduced, not eliminated.

    The most useful investor stance is to define kill criteria in advance. This thesis should be reconsidered if Aidoc encounters a named patient-harm or enforcement event, loses privileged interoperability access, fails to convert pilots because reimbursement and budget ownership stay ambiguous, or proves unable to keep model-change governance aligned with FDA expectations. The company’s large 2026 Series E funding softens runway risk, but it also means future rounds and exit expectations will be judged against a much higher proof bar.
