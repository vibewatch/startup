  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Best public substitute
      - Exact diligence path
    rows:
      - - Revenue / ARR
        - Cannot size the core software business or quality of growth
        - Deployment counts and patient-volume claims only
        - Request monthly recurring revenue bridge and ARR by product family
      - - Gross margin
        - Cannot judge software quality or services mix
        - Workflow-software benchmarks from GE/Intelerad only
        - Request software vs services gross margin and hosting cost trend
      - - Cash balance and burn
        - Cannot underwrite runway or next-round timing
        - Fresh funding announcements reduce distress risk but do not replace cash data
        - Request latest balance sheet, burn, and covenant schedule
      - - CAC / payback / sales cycle
        - Cannot judge capital efficiency of growth
        - Enterprise integration depth implies nontrivial deployment cost
        - Request funnel conversion, implementation cost, and payback by segment
      - - Retention / NRR / expansion
        - Cannot judge whether aiOS becomes a durable operating layer
        - 69% external-model usage on aiOS is promising but incomplete
        - Request logo retention, GRR, NRR, and external-model attach-rate cohorts
      - - Exact valuation
        - Cannot confirm fair value or current unicorn status from post-2024 evidence
        - Only “higher than prior round” reporting is public
        - Request term sheet or board-approved valuation memo from the latest round
      - - Revenue-recognition policy
        - Cannot tell how much revenue is recurring software versus services, implementation, or performance-linked work
        - Official messaging suggests enterprise software plus workflow value
        - Request revenue recognition memo and customer contract samples
    notes: These are not cosmetic omissions; they are the specific items that keep Aidoc from moving from promising to underwritable on public evidence alone.
