  - id: unit-economics-logic-and-benchmarks
    title: Unit economics logic is believable, but public numbers stop at customer-value proof and external benchmarks
    body: |
      Aidoc has a credible public value story. Official materials and investor commentary tie the product to shorter lengths of stay, radiology efficiency, reduced diagnostic delay, and measurable financial returns for health systems. That matters because imaging AI still struggles to justify itself on reimbursement alone. Independent market coverage says only a small number of imaging-AI applications have meaningful reimbursement and that ROI often fails unless the benefit accrues across the broader hospital network. Aidoc's own pitch lines up with that reality: the product is sold as workflow infrastructure and care coordination, not merely as a reimbursable image-analysis widget.

      Where public evidence runs out is inside the vendor P&L. There is no disclosed gross margin, CAC, payback, NRR, or cash conversion. To anchor the economic logic, the best public benchmark in this run is GE's planned Intelerad acquisition, which implies that mature workflow-layer imaging software can generate roughly 90% recurring revenue and more than 30% adjusted EBITDA margins. Nanox provides the opposite cautionary example: a public imaging-AI company can still produce very small software revenue, losses, and ongoing financing needs. Aidoc likely sits somewhere between those poles, but public evidence does not show where.
    claimRefs:
      - CI019
      - CI020
