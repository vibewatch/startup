artifact: financials
slug: aidoc
runDate: '2026-05-20'
company:
  name: Aidoc
chapter:
  number: 4
  title: Financials
  summary: >-
    Aidoc's 2025 and 2026 financings materially reduce immediate capital-pressure risk, but the company still discloses
    neither revenue nor cash, and its own lifetime-funding figures conflict across official releases. Public evidence
    supports an enterprise SaaS / site-license commercialization model with workflow-led switching costs and measurable
    customer ROI narratives, yet it does not support a reliable ARR, margin, or valuation estimate; post-2024 evidence
    therefore leaves current unicorn status and true revenue quality as explicit diligence gaps.
sections:
  - id: revenue-model-and-pricing-signals
    title: Revenue model and pricing signals point to enterprise software, not transparent transaction pricing
    body: |
      Aidoc's public commercial posture looks enterprise-led from every angle. The product pages describe deep integration into PACS, EHR, scheduling, reporting, and care-coordination workflows, while the AWS Marketplace listing says the offering is available only by private offer. That is the classic signature of negotiated enterprise contracts rather than self-serve software or a standardized per-study checkout flow. Aidoc's monetization surface also appears broader than a single radiology triage module: aiOS governs multiple models, the radiology product sits inside existing imaging workflows, and the care-coordination layer extends value into patient follow-up and cross-specialty activation.

      What is missing is just as important. Official pages do not publish list prices, per-study rates, or segment revenue mix. The only concrete public pricing signal found in this run is a low-reliability third-party review page that estimates $50,000 to $150,000-plus of first-year cost and says pricing starts around $50,000 per installation. That is directionally useful as a packaging proxy, but not reliable enough for underwriting. The defendable conclusion is that Aidoc behaves like enterprise SaaS / site-license software with implementation work and workflow-stickiness, while actual realized pricing and revenue recognition remain undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI046
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: capital-history-and-valuation-support
    title: Capital history is visible, but valuation support remains incomplete and internally inconsistent
    body: |
      Aidoc's latest financing record is far more current than its disclosed operating metrics. The company said in 2023 that a $110 million Series D brought total funding to $250 million. In 2025, a PRNewswire release described a $150 million financing plus a $40 million revolving credit facility and said total funding was $370 million. Then, in April 2026, Aidoc and Goldman Sachs said a $150 million Series E brought total funding to over $500 million. Taken individually, each announcement is clear on the new round. Taken together, the cumulative totals do not reconcile cleanly, which means the safest way to model capital raised is round-by-round, not by trusting headline lifetime-funding tallies.

      Valuation evidence is even thinner. Calcalist reported that the 2025 round was raised at a valuation higher than the prior round, while Globes said the company would not disclose either revenue or the round valuation. That leaves the post-2024 record supportive of momentum but insufficient for a numeric fair-value call. In practical terms, public evidence does not currently confirm a precise Aidoc valuation or current unicorn status, even after the 2026 Series E.
    claimRefs:
      - CI010
