tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current public evidence
      - Revenue-quality read
      - Diligence ask
    rows:
      - - Enterprise radiology AI deployment
        - Licensed clinical AI embedded into radiology workflows
        - Health-system / hospital contract
        - Official pages emphasize deep PACS and EHR integration plus private-offer selling
        - Likely recurring and sticky once embedded
        - Request contract term, deployment fee, and renewal structure by account size
      - - aiOS orchestration platform
        - Operating layer that runs, governs, and monitors multiple models
        - Platform / site-license style contract
        - aiOS is positioned as an enterprise platform, not just a feature inside one module
        - Potentially higher-quality platform revenue than single-use-case algorithm sales
        - Request platform-vs-algorithm revenue split and multi-year attach rates
      - - Care coordination and patient management
        - Workflow tools that activate follow-up and multidisciplinary teams
        - Cross-specialty workflow contract or platform add-on
        - Official care-coordination materials frame value around downstream action and follow-up
        - Could deepen wallet share if hospitals buy enterprise value rather than triage alone
        - Request attach rate, seat model, and outcome-based pricing exposure
      - - Third-party model hosting / ecosystem
        - aiOS hosts external models in addition to Aidoc's own algorithms
        - Platform fee or enterprise orchestration value capture
        - Aidoc said 69% of customers already run non-Aidoc models on aiOS
        - Improves stickiness and could raise revenue per account without first-party R&D for every use case
        - Request pricing for external-model hosting and whether revenue is software or pass-through
      - - Implementation / integration services
        - Workflow integration into PACS, EHR, reporting, and governance stack
        - One-time or staged implementation services
        - Deep workflow integration is central to the public positioning
        - Important for land-and-expand but could dilute gross margin if service-heavy
        - Request implementation cost recovery and gross margin profile on services versus software
    notes: Public evidence supports the shape of the revenue model, but not segment percentages, revenue recognition, or realized pricing.
    claimRefs:
