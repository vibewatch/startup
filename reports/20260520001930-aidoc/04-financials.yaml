  - id: TI002
    title: Pricing / monetization table
    columns:
      - Surface
      - Public pricing signal
      - What it implies
      - Confidence
      - Missing piece
    rows:
      - - Official Aidoc product pages
        - No list price published
        - Buyers are expected to engage via enterprise sales process
        - High
        - Whether contracts are per hospital, per site, per modality, or network-wide
      - - AWS Marketplace listing
        - Private offer only
        - Negotiated enterprise packaging rather than transparent click-through pricing
        - High
        - Actual quote ranges, minimum commitments, and multi-year term norms
      - - ItQlick review site
        - $50k-$150k+ first-year estimate; $50k per installation claim
        - Very rough external proxy that suggests meaningful upfront enterprise spend
        - Low
        - Methodology, real customer quotes, and whether estimate reflects Aidoc or category averages
      - - Care coordination / workflow ROI messaging
        - Pricing absent; value framed around hospital efficiency and follow-up
        - Monetization may depend on enterprise value proposition rather than per-scan billing
        - Medium
        - Whether any contracts include gain-share, performance guarantees, or service-line upsell economics
      - - Ecosystem hosting on aiOS
        - No public tariff for third-party model hosting
        - Potential platform economics are visible, but take-rate is not
        - Medium
        - Revenue share, platform fee, and margin structure for external models
    notes: Official evidence shows negotiated enterprise selling. The third-party pricing page is used only as a weak directional proxy and should not be treated as management guidance.
