  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Public value / status
      - Confidence
      - What it implies
      - Diligence ask
    rows:
      - - 2023 Series D
        - $110M; official total funding then stated as $250M
        - Medium
        - Established a sizable pre-2025 equity base
        - Request cap-table bridge from 2023 onward
      - - 2025 growth financing
        - $150M plus $40M revolver; official total funding then stated as $370M
        - Medium
        - Shows continued capital access and introduces debt-like financing
        - Request full terms of revolver, draw status, covenants, and use of proceeds
      - - 2026 Series E
        - $150M led by Goldman Sachs; official total funding then stated as over $500M
        - High
        - Meaningfully reduces near-term financing pressure and funds expansion
        - Request post-close cash balance and runway assumptions
      - - Valuation disclosure
        - 2025 reports say valuation was higher than prior round, but exact number was not disclosed
        - Medium
        - Momentum exists, but fair-value support remains weak
        - Request post-money valuation, liquidation preferences, and any participating debt terms
      - - Cash, burn, and runway
        - Not publicly disclosed
        - Low
        - Prevents a true capital-adequacy assessment
        - Request monthly burn, net cash, and downside runway plan
      - - Capital-intensity trigger
        - Company raised again less than a year after the prior financing while expanding CARE and aiOS globally
        - Medium
        - Suggests aggressive scale-up still consumes meaningful capital
        - Request model-development spend, hosting cost, and hiring plan by use of proceeds
    notes: The round-by-round disclosures are useful; the lifetime-funding totals are not fully internally consistent and should be cross-checked directly with management.
