  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Customer ROI proof
        - Shorter length of stay, radiology efficiency, and measurable financial returns are claimed; no unified audited ROI study is public
        - Medium
        - Supports demand quality and renewal logic
        - Request audited before/after economics by deployment cohort
      - - Reimbursement dependence
        - Public evidence suggests imaging AI adoption still relies more on systemwide efficiency than on CPT reimbursement
        - Medium
        - Determines whether Aidoc sells from budget savings or billable revenue creation
        - Request reimbursement exposure by product line and contract language on ROI guarantees
      - - Switching cost
        - Deep integration with PACS, EHR, reporting, and governance stack implies meaningful implementation friction
        - Medium
        - Sticky software can justify higher multiples and better renewal economics
        - Request churn, expansion, and replacement-win data
      - - Platform attach / ecosystem economics
        - 69% of customers reportedly run non-Aidoc models on aiOS
        - Medium
        - Platform hosting can improve revenue per customer and strategic relevance
        - Request external-model hosting fees and attach-rate cohorts
      - - Vendor gross margin path
        - Not disclosed publicly
        - Low
        - Core to software quality and valuation
        - Request software vs services gross margin and hosting / inference cost trends
      - - Sales efficiency and payback
        - Not disclosed publicly
        - Low
        - Determines whether growth is capital efficient or financing dependent
        - Request CAC, sales cycle, implementation time, and payback by segment
    notes: This table separates buyer-value proof from vendor-level economics. Public sources are better at the former than the latter.
