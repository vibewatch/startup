  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: arr-and-revenue
      missingEvidence: Current revenue, ARR, segment mix, and revenue-recognition policy by product family.
      whyItMatters: Without these figures, revenue quality and growth durability cannot be underwritten even though demand signals look strong.
      diligencePath: Request monthly recurring revenue bridge, ARR by module, deferred revenue, and recognized revenue split across software, services, and any performance-linked contracts.
      relatedQuestionRefs: [QI020, QI021, QI025]
    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-runway
      missingEvidence: Current cash balance, monthly burn, debt schedule, revolver usage, and runway assumptions.
      whyItMatters: Late-stage fundraising reduces immediate risk but does not prove capital adequacy or next-round timing.
      diligencePath: Request latest balance sheet, cash-flow statement, debt agreement, covenant package, and board runway model.
      relatedQuestionRefs: [QI014, QI024]
    - type: private-evidence-only
      severity: material
      topic: valuation-support
      missingEvidence: Exact post-money valuation, preference stack, and round terms for the 2025 and 2026 financings.
      whyItMatters: Public evidence after 2024 does not confirm a numeric current valuation or current unicorn status, so valuation stance must remain conservative.
      diligencePath: Request signed term sheets, cap table, liquidation-preference schedule, and any 409A / board valuation materials.
      relatedQuestionRefs: [QI007, QI008, QI017]
    - type: private-evidence-only
      severity: material
      topic: contract-pricing
      missingEvidence: Realized contract pricing, implementation fees, module attach rates, and any gain-share or performance-guarantee economics.
      whyItMatters: Official sources show only enterprise packaging; actual pricing power determines software quality and margin path.
      diligencePath: Review recent contracts across large health-system, regional-system, and single-hospital deployments.
      relatedQuestionRefs: [QI003, QI004]
