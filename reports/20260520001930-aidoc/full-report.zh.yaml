      - number: '6.3'
        title: 量化结果与工作流采用证据
        blocks:
          - type: paragraph
            body: >
              Aidoc 最好的公开结果证据来自工作流提速和照护升级指标，而不是合同或收入指标。Yale New Haven 的 PE 响应案例尤其有用，因为它把 Aidoc 关联到临床上重要的结果：合适的高级治疗使用约增加
              40%，约 70% 原本会漏掉的潜在激活被识别出来。Cedars-Sinai 也出现在 Aidoc 的 VTE 页面上，是另一个量化站点：PE 照护的治疗启动时间缩短 7 小时（41%），住院时长减少 26%。


              Renown Health / Carson Tahoe 补充了卒中网络案例：door-in-door-out 时间缩短 32 分钟，大血管闭塞转运在约六个月后快了大约 30%。Mercy
              的公开部署案例给出的不是照护事件百分比，而是运营规模指标，包括已分析 2.4 million 张影像、249,000 项被标记检查，以及门诊诊断时间缩短 90%。WellSpan CEO 也提到一年内分析超过
              200,000 个病例。这些都是有意义的工作流证明，但口径并不统一。有的是公司主导案例，有的是站点提供的内部数据，没有一个能替代标准化的跨客户队列。
