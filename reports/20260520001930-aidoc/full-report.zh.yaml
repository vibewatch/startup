      - number: '2.5'
        title: 反向证据及其对采用节奏的含义
        blocks:
          - type: paragraph
            body: >-
              这个市场中最有用的反向证据是实际问题，而不是耸动故事。Aidoc 的真实世界肺栓塞研究摘要就是一个好例子：97.8% 的一致率听起来很强，但算法仍漏掉了 15% 的确诊 PE
              病例，并在多数裁决分歧中落败，医院因此无法负责任地把 AI 当作放射科医生替代品。这与其说是产品失败，不如说是在提醒市场：价值主张是分诊和工作流支持，不是自主阅片。报销证据也指向同一方向。如果多数急症放射 AI
              用例无法获得单独付费的 CPT 代码，买方就会继续靠运营节省和临床风险降低来证明采购合理性，而不是靠直接科目报销。这会拖慢采用，因为企业软件预算、IT
              资源和临床治理委员会都必须先相信效率与安全叙事，产品才能规模化。Aidoc 当前装机基础说明，这道门槛对成熟医疗系统可以跨过；但它也意味着未来增长取决于能否赢下中央工作流预算、证明集成
              ROI，并展示基础模型治理可以被长期信任。换句话说，这个品类已经跨过可信度门槛，但尚未跨过无摩擦预算门槛。
