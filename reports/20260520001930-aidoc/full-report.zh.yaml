        blocks:
          - type: paragraph
            body: >
              Aidoc 的公开价值叙事可信。官方材料和投资人评论把产品与住院时长缩短、放射科效率提升、诊断延误减少，以及医疗系统可衡量财务回报联系起来。这很重要，因为影像 AI
              单靠报销仍难以证明自身价值。独立市场报道称，只有少数影像 AI 应用具备有意义的报销，且除非收益覆盖更广的医院网络，否则 ROI 往往站不住。Aidoc
              自己的销售话术与这一现实一致：产品被作为工作流基础设施和照护协同销售，而不只是一个可报销的影像分析小组件。


              公开证据止步的地方，是厂商 P&L 内部。公司没有披露毛利率、CAC、回本周期、NRR 或现金转换。为了锚定经济逻辑，本次最好的公开基准是 GE 计划收购 Intelerad
              的交易，它意味着成熟的工作流层影像软件可以产生约 90% 经常性收入和超过 30% adjusted EBITDA 利润率。Nanox 提供相反的警示样本：一家上市影像 AI
              公司仍可能只有很小的软件收入、亏损和持续融资需求。Aidoc 可能位于这两个极端之间，但公开证据没有显示具体位置。
