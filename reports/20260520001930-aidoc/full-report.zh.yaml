      - number: '3.3'
        title: 病理进入者与工作流既有厂商
        blocks:
          - type: paragraph
            body: >
              PathAI 和 Paige 不是放射优先，但它们仍然重要，因为它们争夺同一笔企业 AI 预算和治理注意力。两家公司都主打病理基础模型、工作流工具和大型数据资产；也都在 2025-2026
              年成为收购目标，凸显工作流加模型这一层已经具备战略价值。它们与 Aidoc 的关系，不在于一套病理产品能替代急症放射分诊，而在于医院高管越来越把 AI 作为跨服务线的运行层决策来评估。


              更持久的分发威胁来自既有影像 IT 厂商。Nuance/Microsoft、Sectra、Fujifilm、AGFA、GE 和 Intelerad 都把 AI
              部署营销为既有影像基础设施的延伸，经常强调单一合同上线、云 PACS 或嵌入式编排，而不是单个算法。一旦医院相信工作流层应承载多个第三方模型，既有厂商就会凭装机基础、采购熟悉度和集成控制权获得杠杆；而 Aidoc
              仍必须逐个账户赢下来。
