      - number: '7.4'
        title: 执行、领导力与投资否决条件
        blocks:
          - type: paragraph
            body: >-
              Aidoc 的执行风险随规模上升。到 2026 年 1 月，公司称 aiOS 已超过 100 million 个已分析患者病例；到 2 月和 4 月，公司公开宣传在德国、荷兰、南加州和 Advocate
              Health 的多站点部署。这是产品市场匹配证据，但也意味着实施质量、上市后监测和客户成功纪律比早期算法阶段更重要。领导力方面，Aidoc 在 2026 年显著补强班底，任命前 AMA 主席 Jesse
              Ehrenfeld 为首席医疗官；领导层页面也显示，其高管团队比纯粹以创始人为中心的初创公司更成熟。即便如此，Elad Walach 仍是公司公共叙事和融资姿态的中心，因此关键人风险降低了，但没有消失。


              最有用的投资者姿态，是提前定义否决条件。若 Aidoc 遭遇具名患者伤害或执法事件、失去特权互操作访问、因报销和预算归属持续模糊而无法转化试点，或无法让模型变更治理与 FDA
              预期保持一致，投资逻辑就应重新评估。公司 2026 年大额 Series E 融资缓释了现金跑道风险，但也意味着未来融资和退出预期会被放到更高证明门槛下评判。
