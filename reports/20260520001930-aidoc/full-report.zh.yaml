      - number: '4.4'
        title: 结论：需求信号强，投资测算文件弱
        blocks:
          - type: paragraph
            body: >
              以当前证据看，Aidoc 的财务画像强于早期算法厂商，但弱于一家足以完整测算的后期软件公司。2025 年融资、2026 年 Series E
              和广泛部署主张说明市场拉力有意义，也降低了短期财务困境风险。Series E 之后的新闻流仍保持活跃，Aidoc 强调新客户部署、欧洲产品扩张和一位全国知名 CMO
              加入，而不是释放收缩信号。产品覆盖、集成深度和企业级包装都符合经常性、高切换成本软件特征。相邻 AI 诊断领域的公开可比交易——Viz.ai 的独角兽融资、Roche 收购 PathAI，以及 Tempus 收购
              Paige——也显示战略买家和成长投资人愿意为工作流、数据和模型资产的组合付费。


              但对财务买家最在意的每一项指标，文件仍不完整。收入、ARR、毛利率、烧钱速度、现金、债务、CAC、回本周期和 NRR 都未披露。公开定价不透明。公司自己的总融资数字在官方新闻稿之间相互冲突。2024
              年后的记录也仍未公开确认数字化估值或当前独角兽状态。因此，正确的财务立场是：认可商业化质量和平台相关性，但在管理层打开账本之前，对利润率路径、估值支撑和资本充足性保持明确谨慎。
