      - number: '7.2'
        title: 安全、隐私、报销与采购风险
        blocks:
          - type: paragraph
            body: >-
              Aidoc 公开材料指向一个严肃但只部分披露的控制环境。安全页面提到 NIST CSF 和 AWS 托管，数据传输通知称 Aidoc 已获得 EU-U.S.、UK 和 Swiss DPF
              框架认证。这是有用的基线证据，但不同于看到当前 SOC 2、HITRUST、渗透测试、事件响应或 BAA
              细节。在医疗采购中，保障细节缺失与已知弱点几乎同样重要，因为它会拉长安全审查，也让数据泄露下行更难定价。HHS OCR 2026 年勒索软件和解案说明，HIPAA 执法是持续且运营层面的，不是理论风险。


              报销风险又放大采购风险。独立放射科来源和 ACR 都指出，AI 报销仍落后于获 FDA 许可工具的数量，因为大多数影像 AI 产品仍绑定 Category III 跟踪代码，而不是可持续、与支付挂钩的
              Category I 经济性。即使没有直接报销，Aidoc 仍可像 Advocate Health 和 Novant 所显示的那样靠 ROI
              销售；但这让每笔企业销售更依赖本地预算归属、工作流重设计，以及可衡量吞吐量或结果改善的证明。这条路能走通，但与有清晰报销支撑的护理标准相比，采用更慢、黏性更强，也更受 CFO 审视影响。
