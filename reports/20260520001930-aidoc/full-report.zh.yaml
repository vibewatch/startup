chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、覆盖与产品架构
        blocks:
          - type: paragraph
            body: >-
              Aidoc 的公开材料一直把公司定位为临床 AI 厂商，而不是狭窄的放射科算法公司。官方 about 页面称，公司专注于帮助医疗团队优化患者治疗和经济价值；aiOS 与 CARE
              页面则显示，这一定位已经从影像分诊扩展到更宽的企业级工作流层。aiOS 被描述为控制平面，负责在医疗系统内运行、编排和治理临床 AI，连接 PACS、EHR、移动端和照护工具。CARE
              则被定位为多模态基础模型，让 Aidoc 从单病种工具走向更广的疾病覆盖、自动测量，并最终生成报告草稿。这一点重要，因为它改变了公司的投资逻辑：Aidoc
              不再只向放射科医生销售急性发现提醒，而是在销售一个面向多算法部署、照护协同和模型治理的运行层。获取的来源支持其通过 2026 年融资公告形成了清晰的纽约商业姿态，而 Guy Reiner
              的官方简介仍明确称其为特拉维夫分部总经理。由此看到的是一家技术根基在以色列、资本市场形象面向纽约、战略围绕企业级部署而非科室级单点方案展开的公司。
