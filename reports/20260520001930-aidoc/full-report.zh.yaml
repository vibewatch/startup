  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: aiOS 平台架构与运行模式
        blocks:
          - type: paragraph
            body: >
              Aidoc 的核心产品不只是一组点算法库，而是 aiOS，一个面向临床 AI 的企业级操作系统。aiOS 页面明确把平台描述为在医疗系统内运行、编排并治理临床 AI
              的层，并用一次集成支撑多个工作流。实际含义是，医疗系统不需要把每个算法都部署成独立小组件。aiOS 会组织影像和元数据输入，判断哪些模型应该运行，在患者和检查语境中交付输出，并在系统层面提供治理、监控和结果跟踪。


              这套架构以工作流为先。Aidoc 称 aiOS 使用文本数据、扫描元数据和像素分析来决定哪些扫描应接受哪些 AI 处理，然后把疑似发现推送到 PACS、EHR、移动端和照护团队工作流。Aidoc 也把 aiOS
              定位成开放生态层，而不是封闭产品孤岛：外部模型托管是明确设计目标，多家独立 2025 年来源也称，多数客户已经在该平台上托管非 Aidoc 模型。这使 aiOS 更接近医院 IT 的 AI
              控制平面，而不是单一用途放射科应用。


              公开部署案例支持平台叙事。Hartford HealthCare 在三周内初步上线，Mercy 在 50 个设施中标准化 aiOS，Asklepios 完成了覆盖 28
              家医院的部署。这些案例说明，产品已经从试点阶段的科室工具进入企业级实施模式。剩余注意点在于，Aidoc 官方网站仍营销“规模最大的 FDA
              批准算法组合”，却没有发布当前官方数字化组合总数，因此描述广度时必须谨慎。
