        title: 规模、地域与客户覆盖
        blocks:
          - type: paragraph
            body: >
              Aidoc 的公开客户叙事有两层：一个宽泛的规模叙事，以及一组更窄的直接具名证明点。在最宽口径上，Healthcare IT Today、Fierce Healthcare、MedCity News 和 HLTH
              的 2025 年独立报道重复了公司自报数字：每年在 150+ 个医疗系统中服务超过 45 million 名患者。Aidoc 2026 年 4 月的官方稿和 PRNewswire 稿随后描述了近 2,000
              家医院、每年分析超过 60 million 个病例，以及累计分析超过 110 million 个病例。这些数字显然很大，但分母不能互换：医院、医疗系统、年度患者和年度病例衡量的是采用的不同侧面。


              具名证明的地域更偏向美国大型一体化交付网络和一家欧洲大型私营运营商。获取的公开来源直接确认了 Hartford HealthCare、Mercy、Sutter Health、WellSpan、Yale New
              Haven、Renown Health / Carson Tahoe、Temple Health、Advocate Health 和 Asklepios。独立文章还将 Mount Sinai、Northwell
              和 University of Miami 列为合作伙伴或用户，但这些更像规模引用，而不是完整记录的部署案例。最稳妥的解读是，Aidoc 拥有广泛平台触达和有意义的参考客户密度，但公开披露客户清单远比 150+
