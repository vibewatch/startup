  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前公开证据
      - 收入质量判断
      - 尽调问题
    rows:
      - - 企业级放射科 AI 部署
        - 授权临床 AI 嵌入放射科工作流
        - 医疗系统 / 医院合同
        - 官方页面强调深度 PACS 和 EHR 集成，以及私人报价销售
        - 一旦嵌入，可能经常性强且粘性高
        - 按账户规模索取合同期限、部署费和续约结构
      - - aiOS 编排平台
        - 运行、治理并监控多个模型的操作层
        - 平台 / 站点许可式合同
        - aiOS 被定位为企业平台，而不只是某个模块里的功能
        - 相比单一用例的算法销售，平台收入质量可能更高
        - 索取平台与算法收入拆分，以及多年期合同附加率
      - - 照护协调与患者管理
        - 调动随访和多学科团队的工作流工具
        - 跨专科工作流合同或平台附加包
        - 官方照护协调材料把价值落在下游行动和随访上
        - 如果医院买的是企业价值而非单纯分诊，钱包份额可能加深
        - 索取附加率、席位模型和结果挂钩定价敞口
      - - 第三方模型托管 / 生态系统
        - aiOS 除 Aidoc 自有算法外，还托管外部模型
        - 平台费，或从企业编排价值中变现
        - Aidoc 称 69% 的客户已经在 aiOS 上运行非 Aidoc 模型
        - 提升粘性，也可能在无需为每个用例投入自有研发的情况下提高单账户收入
        - 索取外部模型托管定价，以及收入属于软件还是代收代付
      - - 实施 / 集成服务
        - 将工作流接入 PACS、EHR、报告和治理栈
        - 一次性或分阶段实施服务
        - 深度工作流集成是公开定位的核心
        - 先落地再扩张离不开它，但如果服务占比过高，可能稀释毛利率
        - 索取实施成本回收情况，以及服务与软件的毛利率结构
    notes: 公开证据能支持收入模式的大致形态，但不能支持各分部占比、收入确认或实际定价。
