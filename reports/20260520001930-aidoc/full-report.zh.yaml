      - number: '1.5'
        title: 反向信号与未解决证据缺口
        blocks:
          - type: paragraph
            body: >-
              本次获取到的最强负面证据不是诉讼或警告信，而是一组技术和市场约束，它们限制了外界应如何激进解读公司的主张。Aidoc 自己的模型卡比营销页更坦率地说明了哪些内容仍不可观测：重要的人口统计属性不在 DICOM
              中，因此偏差监测必须依赖代理变量和上市后性能跟踪，而不是完整的直接测量。外部证据也强化了谨慎必要性。2026 年 5 月一项真实世界肺栓塞研究摘要称，Aidoc 算法在 32,501
              次扫描中与放射科医生的一致率为 97.8%，但也漏掉了 15% 的确诊 PE 病例，并在多数裁决分歧中落败，说明仍需人类监督。另一个问题来自通用放射 AI 的报销文献：当前支付框架仍很难适配这类产品，因此
              Aidoc 的 ROI 叙事可能更多依赖避免错误、提升吞吐和下游照护管理，而不是直接支付代码。对公司层面尽调最重要的是，四个问题仍未解决：当前估值 / 独角兽状态、稳定的当前 FDA
              批准数量、可支撑的当前员工数，以及有来源支撑的 170+ 模型数量。因此，本报告把 Aidoc
              视为一家资本充足、规模较高且具备重要监管证明点的私营公司，但不把它视为一家估值和覆盖指标可无条件接受、披露已经完整的企业。
