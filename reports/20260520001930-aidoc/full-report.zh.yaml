  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Aidoc 看起来是有真实牵引力的真实品类参与者，但公开证据仍不足以支持可投资的价格判断。公司可以拿出新的 FDA 许可、具名企业部署、超过 100 million 个已分析患者病例，以及 AWS、Goldman
              Sachs Alternatives、General Catalyst、SoftBank Vision Fund 2 和 NVentures 的战略支持。这足以排除 Aidoc
              只是概念股故事的轻率看法；但还不足以让投资者盲目支付溢价私募估值。


              核心问题是估值不透明。2024
              年后公开融资报道确认了更多资本和更强投资人支持，但没有给出清晰的当前投后估值。这意味着公众无法把今天隐含的私募价格换算成收入倍数、经利润率调整的倍数或经优先权调整的回报。我的立场因此是继续研究 /
              观察。若内部指标强，Aidoc 可能值得溢价；但今天的公开证据支持好奇，不支持确信。由于 2024-05-20 之后的当前估值未披露，Aidoc 的独角兽身份应视为未确认标签，而非已验证事实。
