      - number: '1.2'
        title: 创始人、领导层与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司而言，Aidoc 的创始团队得到的公开佐证异常充分。官方领导层简介确认 Elad Walach 为联合创始人兼 CEO，Michael Braginsky 为联合创始人兼 CTO，Guy
              Reiner 为联合创始人、首席架构师和特拉维夫分部总经理。CTech 2025 年 7 月的报道与这些角色一致，并将公司创立时间追溯到 2016 年。从职能上看，三人仍在支撑核心商业模式：Walach
              是对外发言人和融资声音，Braginsky 在技术与融资报道中都以基础模型架构师身份出现，Reiner
              对特拉维夫分部的职责则意味着产品和工程执行有很强连续性。公开可见的非创始高管确实存在，但披露远不如创始人完整；本次检索到的记录对创始人领导力最强，对更广泛管理梯队则薄得多。因此，关键人物集中度是一个真实的尽调项，而不是泛泛的创业公司风险提示。Aidoc
              的公开材料确实显示组织成熟度在提升，例如明确讨论治理、漂移检测和企业级监控；但公开记录仍未提供完整领导层名单，也无法清楚展示创始人以下的授权分布如何随版本迭代变化。
