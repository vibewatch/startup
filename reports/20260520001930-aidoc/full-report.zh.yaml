  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与临床安全风险
        blocks:
          - type: paragraph
            body: >-
              Aidoc 最严肃的风险仍是受监管设备负担与临床责任暴露叠加。公司确实有监管资产：其质量页面称已对齐 MDSAP、ISO 13485、EU MDR 和 FDA 质量体系，Aidoc 又在 2026 年 1
              月宣布，基于 CARE 基础模型打造的综合分诊产品获得新的 FDA 许可。这些都是有意义的进入壁垒，但也把 Aidoc 推进一个制度环境：模型更新、新适应证和文档标准每年都更关键。FDA 2025 年 1
              月生命周期指南和 2025 年 8 月 PCCP 指南都指向更严格的 AI 赋能设备软件证据预期，尤其是模型上线后继续演进时。Aidoc 自己的 BRIDGE
              框架承认，信任、合规和工作流纪律是采用的前提；这在方向上让人安心，但不能替代具体产品的变更控制证据。


              临床责任是伴随风险。Aidoc 的价值主张是在急诊和急性工作流中更快升级关键发现，因此一次漏检、延迟或带偏差的优先级排序失败，都可能从普通软件缺陷变成患者伤害事件。同行评议文献仍将偏见和泛化性列为医学影像 AI
              的未解问题，尤其是产品跨站点、跨人群迁移时。因此，正确的承销姿态不是“Aidoc 不受监管”，而是“Aidoc 已受监管、正在扩张，也因此越来越暴露在把监管和上市后安全做好所需的成本之下”。
