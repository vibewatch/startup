      - number: '3.2'
        title: 直接临床 AI 同行
        blocks:
          - type: paragraph
            body: >
              Viz.ai 是最清晰的同类竞争对手，因为它把影像触发检测与下游照护团队动员结合起来，并且已经进入大型医疗系统部署。它营销 50+ 个 FDA
              批准算法，把自己定位为照护协同平台，而不是单一用途工具，也有公开证据显示其完成独角兽规模融资。这使 Viz.ai 成为最直接的标尺，用来判断在更多厂商增加算法广度后，Aidoc 能否继续保持急症照护协同差异化。


              Enlitic 和 Annalise/Harrison.ai 的竞争方式不同。它们的信息更强调影像数据标准化、工作流效率和广泛发现覆盖，而不是全系统照护协同。Nanox.AI/Zebra
              又处在另一条相邻赛道：它把 AI 和软件与更宽的影像网络、硬件议程结合起来。这些同行很重要，因为即使它们没有完全复制 Aidoc 跨专科运行层的叙事，也可能在模态广度、算法数量或医院工作流嵌入上挤压 Aidoc。
