      - number: '2.4'
        title: 驱动因素、约束与报销现实
        blocks:
          - type: paragraph
            body: >-
              证据库中反复出现三类需求驱动。第一，劳动力压力是真实的：AAMC 仍预测医生短缺会延续到 2036 年，Neiman HPI 和 ACR 也称放射科医生短缺持续存在，且 2020
              年后流失明显加速。第二，影像需求继续上升：Neiman 的需求研究预计到 2055 年影像利用率还会增加 16.9% 至
              26.9%，老年人对影像的使用占比更高。第三，品类增长仍强：MarketsandMarkets 仍预计全球放射 AI 市场到 2030 年的 CAGR 为
              24.5%。这些顺风之外，最清晰的约束是报销。同行评审报销论文和 Radiology Business 文章从不同角度提出同一点：多数影像 AI 工具没有单独付费的 CPT 代码，只有极少数较新的影像 AI
              程序达到 Category I 状态。因此，ROI 必须来自吞吐、避免漏诊、减少重复检查或改善下游照护管理，而不是一条清晰的一对一支付流。监管负担是第二个约束。FDA 的 action-plan 和 PCCP
              材料显示，自适应医疗 AI 仍需要严格的变更控制、监测和文档。第三个约束是集成摩擦：医院需要能适配旧 PACS/RIS/EHR 环境的系统，而不只是独立算法准确率高。
