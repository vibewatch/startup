companyProfile:
  summary: >-
    Aidoc 是一家私营临床 AI 公司，由 Elad Walach、Michael Braginsky 和 Guy Reiner 于 2016 年创立。公司销售 Aidoc aiOS，这是一个企业级临床 AI
    操作系统，把放射科分诊、照护协同和工作流治理嵌入医院 PACS 与 EHR 环境，并在其上叠加 CARE 基础模型能力。2025-2026 年的公开证据显示，Aidoc 资本充足、部署规模已成形，在医疗系统中覆盖广泛，FDA /
    CE 进展也在持续推进；但当前估值、收入质量、准确员工数，以及常被引用的 170+ 模型数量仍未披露。
