      - number: '6.4'
        title: 扩张信号、黏性与持久性缺口
        blocks:
          - type: paragraph
            body: >
              公开客户证据显示，Aidoc 往往先以平台层落地，再扩展到更多服务线。Sutter 公告强调多年期基础设施和共同开发，而不是一次性算法。Hartford 公告提到 12 个月内走向更完整的企业级实施。Mercy
              自己的案例称，平台标准化让它能从少数孤立 AI 工具扩到更大规模。Healthcare IT Today 和 Fierce 都引用 Aidoc 的说法：69% 客户已经在 aiOS 上运行非 Aidoc
              模型，这意味着买方可能越来越把 Aidoc 当作多供应商 AI 资产的治理和编排层。


              这种平台黏性叙事方向上利好，但公开持久性证据仍然偏薄。抓取来源没有披露净收入留存、总留存、客户 logo 留存或续约队列数据，也没有公开集中度披露来说明少数企业级系统是否贡献了过大的 ARR
              或病例量。因此，虽然公开足迹显示 Aidoc 可以在复杂系统内部扩张，承销客户质量所需的经典 SaaS 持久性指标仍然缺位。
