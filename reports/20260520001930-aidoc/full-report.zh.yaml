      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              公开证据足以建立市场边界，却不足以把 Aidoc 的市场压成一个精确的 TAM/SAM/SOM 数字。自上而下视角先看美国医疗服务规模：CMS 报告 2024 年全国医疗支出为 $5.3
              trillion，其中医院支出 $1.63 trillion，医生和临床服务 $1.11 trillion。医院数量视角再加上 AHA 的 6,100 家美国医院和超过 900,000
              张配备人员的床位。品类视角随后缩窄到放射 AI：MarketsandMarkets 预计全球市场将从 2025 年 $0.76 billion 增至 2030 年 $2.27 billion，CAGR 为
              24.5%；Emergen 则称医院在 2024 年约占全球需求的 55%。最后，装机基础视角看 Aidoc 本身：2025 年 CARE 融资稿中的 150+ 个医疗系统，2026 年 Series E
              材料中的近 2,000 家医院，以及 Hartford 和 Asklepios 的已验证企业级部署。这些数字说明市场真实存在，也说明 Aidoc
              已在具备企业级购买能力的买方子集中占据有意义份额。它们没有揭示的是每家医院、每个模块或每项检查的价格。正因为缺少定价数据，本报告使用低 / 基准 / 高代理区间，而不是假装知道每家医院或每条服务线的干净收入池。
