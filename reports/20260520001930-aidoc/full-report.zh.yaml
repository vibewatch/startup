      - number: '1.3'
        title: 融资历史、投资人组合与估值可见度
        blocks:
          - type: paragraph
            body: >-
              Aidoc 的资本路径在过去两年明显提速。官方 2022 年 Series D 公告记录了一轮 $110 million 融资，使累计融资达到 $250 million。到 2025 年 7 月，PR
              Newswire、Calcalist 和 Globes 均报道了由 General Catalyst 与 Square Peg 领投的新一轮 $150 million 成长融资，NVentures
              和数家美国大型医疗系统也参与；PR Newswire 和 Globes 还提到额外 $40 million 循环信贷额度，以及 $370 million 的累计融资总额。随后，2026 年 4 月，Aidoc 和
              Goldman Sachs Alternatives 分别宣布由 Goldman 领投的 $150 million Series E，General Catalyst、SoftBank Vision Fund 2
              和 NVentures 跟投。2026 年 4 月的材料只称总融资现为“超过 $500 million”，没有给出精确数字。这一区别很重要：它足以证明公司资本化程度很高，却不足以解决估值问题。该点上最强的
              2024 年后来源其实是 Globes 2025 年 7 月的采访，Michael Braginsky
              明确表示公司不会披露该轮融资估值。因此，在本次报告中，公司是否为私营独角兽仍是实质证据缺口：高融资和规模提升都很清楚，但未获取到 2024-05-20 之后披露估值、足以确认当前独角兽标记的来源。
