      - number: '5.5'
        title: 成熟度、生态方向与技术风险
        blocks:
          - type: paragraph
            body: >
              Aidoc 最强的技术信号不只是监管活动，而是在真实医疗系统中的平台成熟度。到 2026 年 4 月下旬，公司和独立媒体都在描述每年分析 60+ million 个患者病例，并部署到近 2,000
              家医院。在客户故事层面，Mercy、Hartford 和 Asklepios 提供了直接证据，显示 Aidoc 能从初始协议走到运营部署，而不会被困在单站点试点中。AI 算法、ML
              平台、后端、DevOps、云平台和基础设施产品等岗位招聘，也进一步说明公司仍在持续投入企业级产品路线图。


              路线图很激进。Aidoc 称 CARE 将扩展到 CT 和 X-ray
              工作流，自动生成报告草稿也是近期目标。这些方向契合公司反复使用的“从像素到报告草稿”表述，以及其基础模型能把多年路线图压缩到更短周期的主张。但这些路线图事项仍是前瞻性的，尚未在公开生产部署中得到广泛证明。


              因此，主要尽调风险集中在证明深度，而不是表面广度。公开来源没有给出已调和的官方组合数量，CARE 的独立多站点基准仍薄，公司也没有为其描述的 69%
              外部模型生态发布详细的第三方模型接入或治理准则。产品看起来已达到企业级且真实存在，但面向市场的叙事走在了公开记录中的参考架构和基准语料之前。
