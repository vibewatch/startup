        - 医疗系统和放射科主导的企业级买方
        - 私人报价市场上架；平台 + 护理协调叙事
        - 深度工作流集成和企业级部署
        - 一旦跨模态集成，可能形成多年经常性关系
        - 无公开标价或实际成交价格
      - - Viz.ai
        - 医疗系统、中风 / 心脏项目、生命科学
        - 以独角兽级私募估值融资，支撑平台扩张
        - 疾病项目式部署，正扩展到更多病种
        - 若临床团队围绕项目化路径标准化，粘性强
        - 公开定价仍不透明
      - - Enlitic / Annalise
        - 放射科、影像网络、医院 IT
        - 工作流和数据标准化定位；Annalise 赢得 NHS 采购
        - 在科室或网络层面接入报告和分诊
        - 数据规范化和报告流程嵌入后，粘性强
        - 实际合同结构公开披露有限
      - - PathAI / Paige
        - 实验室、病理集团、生物制药、癌症中心
        - 企业级病理平台和 AI 授权
        - 由数据集和工作流牵引，部署进病理栈
        - 若纳入诊断和生物标志物工作流，粘性强
        - 与放射科合同相邻，而非直接替代
      - - Nuance / Microsoft / PACS 既有厂商
        - CIO、影像 IT、企业影像负责人
        - 单一合同 / BAA / MSA，或 PACS 捆绑的 AI 界面
        - 在既有影像和云关系中加入 AI
        - 既有基础设施已深度扎根时，续约杠杆最高
        - 难把 AI 价格从更广的影像 IT 支出中剥离
      - - 现状 / 选择性插件
        - 本地放射科领导层和治理委员会
        - 增量插件采购、试点或人工工作流调整
        - 缓慢按用例逐一部署
        - 承诺度最低，企业级标准化也最弱
        - 节省额往往难以持续一致地衡量
