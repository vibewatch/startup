        - Viz.ai 和既有厂商正向护理协调 + 工作流叙事靠拢
        - 高
        - 询问收入中有多少来自编排 / 护理协调，多少来自第一方算法
      - - 开放生态和第三方模型托管
        - 帮助医院用一个运营层压缩供应商蔓延
        - Fujifilm、Nuance/Microsoft 和 PACS 厂商也在推广开放式 AI 托管
        - 高
