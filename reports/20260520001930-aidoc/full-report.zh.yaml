  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Aidoc 并不处在一个边界整齐的单一品类中。它的产品栈从受监管的放射科分诊开始，延伸到 aiOS 编排，再进入照护协同和下游随访。因此，真正的对比对象包括 Viz.ai 这样的直接临床 AI
              同行，Enlitic 和 Nanox.AI 这样基础设施优先的影像厂商，PathAI 和 Paige 这样相邻病理基础模型玩家，以及已经掌握 PACS、归档、路由和安全审查的既有影像 IT
              厂商。独立行业报道也强化了这一点：医院越来越为工作流集成和企业级价值买单，而不是为孤立的点算法买单。


              现状替代方案仍很强。ACR 的 ARCH-AI 计划把影像 AI 部署界定为持续的治理和质量保证纪律，而不只是一笔软件采购。Radiology Business 也认为，许多医疗系统如果看不到 AI
              在放射科之外改善企业运营，仍难以证明采购合理性。实际采购中，这意味着既有 PACS、工作列表和院内治理仍是 Aidoc 的真实替代品，尤其当医院可以在现有基础设施上渐进添加 AI，而不是替换其工作流层时。
