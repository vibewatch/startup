      - number: '5.4'
        title: 信任、安全、安保与合规
        blocks:
          - type: paragraph
            body: >
              Aidoc 的信任姿态比典型创业 AI 厂商的公开表面成熟得多。质量页面称，Aidoc 运行在通过 MDSAP 和 ISO 13485 认证的 QMS 下，并符合 FDA QSR、EU MDR、ISO 14971
              和 IEC 62304。更重要的是，该页面明确重申，公司分诊和通知解决方案不是诊断软件，也不旨在替代临床医生对完整影像的复核。这是对产品边界条件有价值的公开承认。


              安全方面，Aidoc 称其对齐 NIST Cybersecurity Framework，并在 AWS 和 Azure 上运行，使用 EDR、加密、SIEM 和 CSPM 等控制。AWS
              合作页面还单独把产品营销为符合 HIPAA、面向企业部署。这些说法不能替代客户信任中心审计或经审阅的 SOC 报告，但确实显示 Aidoc 正把自己呈现为医院级、受监管的软件厂商，而不是轻量科室 AI 应用。


              BRIDGE 框架在控制和认证之外增加了治理视角。Aidoc 把 BRIDGE 定位为与 NVIDIA、医疗系统和行业伙伴共同制定的路线图，用于有韧性、负责任地采用
              AI。它有用，并不是因为证明了技术优势，而是因为它说明 Aidoc 理解：多模型部署成功与治理和运行纪律同样相关，不只是算法准确率。公开缺口在于，BRIDGE
              描述的是原则和协作，而不是逐客户接入第三方模型的精确标准。
