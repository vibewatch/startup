      - number: '2.3'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              最强的公开部署证据表明，Aidoc 面向大型服务提供机构销售，而不是依赖直接支付方报销或消费者渠道。Hartford HealthCare 把交易描述为围绕跨科室协作、AI
              治理，以及放射科、心脏科、血管科、神经科和急诊科的照护延误减少。Asklepios 则把部署放在放射科人手短缺、小型站点支持和 24/7 急诊覆盖的语境下。由此推导的买方地图中，放射科负责人、CMIO、CIO
              和医疗系统运营团队都很重要；预算归属会随着产品被作为科室级放射工具还是企业级平台采购而变化。Aidoc
              自身营销进一步强化这一点：公司强调一次集成、多算法编排，以及把放射信号延伸到患者管理。这个组合使采用不再只是赢下一场单算法比拼，而是要证明平台能降低影像工作流各环节的摩擦。公开部署证据也显示，采用路径遵循标准企业软件模式：问题识别、集成设计、试点验证，再到全系统铺开。Aidoc
              已披露的装机基础足够大，商业问题不再是产品能否走出试点，而是买方预算和治理结构能否支持更广泛的企业级标准化。
