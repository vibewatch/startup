      - - 深度工作流集成
        - 嵌入式 PACS / EHR / 报告连接抬高切换成本
        - 既有影像厂商已经控制大部分管线
        - 高
        - 索取相对既有 PACS 厂商的流失率、替换胜出和部署时长数据
      - - 部署规模和 FDA 历史
        - 传递信任和实施成熟度信号
        - 现在更多供应商声称拥有广泛获批和大型装机基础
        - 中
        - 比较活跃使用率和续约，而不只是客户 logo 或获批数量
      - - 来自偶发发现和随访的企业级 ROI
        - 报销仍窄时，企业级价值就是核心采购论点
        - 独立证据显示，除非在全系统层面衡量，ROI 仍常常站不住
        - 高
        - 要求提供经审计的客户 ROI 研究，覆盖范围需超出放射科周转时间
      - - 病理和多模态邻近性
