      - number: '8.2'
        title: 融资历史与公开来源真正确认的内容
        blocks:
          - type: paragraph
            body: >-
              Aidoc 最后一个完全公开、披露金额的轮次，是 2022 年 6 月宣布的 $110 million Series
              D。该公告清楚披露了轮次规模和累计融资额，但没有披露投后估值。此后的公开证据不是更透明，而是更不透明。Aidoc 2026 年 4 月 Series E 新闻稿披露新增 $150 million
              融资，累计融资超过 $500 million。2025-2026 年独立媒体报道也描述了追加或更高融资，但仍没有锁定当前投后价值。


              这种不对称很重要。投资者常假设后续轮次会自动澄清价格发现；Aidoc
              的公开记录恰好相反。它证明资本继续进入、投资人阵容改善、公司仍在推进；但没有证明新投资人实际支付的价格、股权结构如何变化，或标题估值能否经受公开市场或战略收购方的现实检验。换句话说，Aidoc
              的融资历史现在是强赞助证据，却是弱价格证据。
