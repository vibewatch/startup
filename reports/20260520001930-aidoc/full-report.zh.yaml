      - number: '6.5'
        title: 客户采用注意事项与反向信号
        blocks:
          - type: paragraph
            body: >
              主要提醒在于，规模说法一部分扎实，一部分依赖叙事。“150+ 家医疗系统”“45M 名患者”“近 2,000 家医院”和“每年 60M
              个病例”听起来都像客户数量口径，但衡量的不是同一件事。公开来源证明客户关系的直接程度也不同。Hartford、Mercy、Asklepios、Sutter 和 Yale 是强抓取参考；Cedars-Sinai
              是工作流研究站点；Temple 是高管买方证言；媒体列出的 Mount Sinai、Northwell 或 University of Miami，证明力弱于详细案例。


              抓取集中最清晰的反向公开来源是 ITQlick，它指出企业级实施昂贵、定价透明度有限、对小型诊所集成负担重。该来源声誉较低，且本身使用 AI
              辅助，因此应被视为弱提醒信号，而不是决定性负面。比目录评价更重要的是公开来源没有显示的内容：没有续约队列，没有集中度表，也没有抓取来源直接确认用户要求的一些名称，例如 NYU Langone、Mayo
              Clinic 或 University of Rochester Medical Center。这些是尽调缺口，不是否证。
