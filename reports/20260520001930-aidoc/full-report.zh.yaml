      - number: '5.2'
        title: CARE 基础模型与解决方案广度
        blocks:
          - type: paragraph
            body: >
              CARE（Clinical AI Reasoning Engine）是 Aidoc 从单病种算法走向可复用临床基础模型的下注。Aidoc 的基础模型页面称，CARE
              使用真实世界多模态数据训练，不仅覆盖影像，也覆盖文本、EHR 字段、化验和生命体征。2026 年 1 月体部 CT 获批，是该模型不再停留在概念层面的最强公开证明点。Aidoc 官方新闻稿和 Diagnostic
              Imaging 的独立摘要都称，此次获批把 11 个新批准适应症与 3 个此前已批准适应症合并进一个工作流，形成 14 个适应症的体部 CT 分诊产品。


              FDA 的 K252970 摘要提供了最具体的技术细节。获批设备是 BriefCase-Triage: CARE Multi-triage CT Body，这是一款面向胸部、腹部和骨盆增强及非增强 CT
              的工作流分诊和通知产品。FDA 文件列出的 11 个新发现包括憩室炎、腹盆腔脓肿、阑尾炎、肠缺血 / 肠壁积气、梗阻性肾结石、小肠梗阻、大肠梗阻、脾损伤、肝损伤、肾损伤和骨盆骨折。Aidoc 新闻稿还报告称，在
              FDA 审查研究中，11 个新适应症的平均敏感性为 97%，平均特异性为 98%。


              在综合体部 CT 获批之外，Aidoc 产品页面也显示了既有产品栈的临床广度。神经页面捆绑了血管闭塞、CT 灌注、脑动脉瘤、颅内出血、颈椎骨折和椎体压缩性骨折工作流。VTE 页面从肺栓塞延伸到偶发 PE、DVT
              和 IVC 滤器管理。主动脉页面把急性主动脉夹层分诊与动脉瘤随访结合起来。合在一起，这些页面支持一个围绕
              PE、ICH、主动脉夹层、骨折和颈椎发现的真实工作流组合。仍不够清楚的是当前官方总组合数量：公开来源支持广度，但 Aidoc 自己的网站没有发布已调和的总数。
