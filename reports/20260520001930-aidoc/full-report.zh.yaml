            body: >
              Aidoc 仍拥有一组真实竞争资产。官方材料显示，其能力覆盖放射科分诊、企业级编排和照护协同；2025 年融资材料还显示，客户已经在 aiOS 上运行第三方模型。这支撑了一个判断：Aidoc
              正从单算法厂商走向操作系统。战略上这很重要，因为医院越来越希望减少供应商数量，并获得更一致的治理。


              但护城河并非绝对。多供应商编排正在成为基本要求，而不是独特能力。Fujifilm 营销开放编排和 50 多个已验证算法，Nuance/Microsoft 借既有工作流合同销售更轻松的部署，Sectra 加
              GE/Intelerad 则能把 AI 与更宽的影像基础设施打包。独立报道也清楚指出，报销和直接 ROI 对许多影像 AI 仍然狭窄。因此，当医疗系统重视集成随访、偶发发现和企业 AI 治理时，Aidoc
