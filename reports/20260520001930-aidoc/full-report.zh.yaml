      - number: '8.3'
        title: 可比估值锚点
        blocks:
          - type: paragraph
            body: >-
              Aidoc 最干净的公开锚点，不是另一个不透明私募轮，而是高溢价公开 AI 倍数与主流医疗 IT 倍数之间的差距。按引用的 2026 年锚点，Tempus 是溢价异常值，市值 / 收入约 9.0x。RadNet
              和 GE HealthCare 更接近 2x-3x，Phreesia 和 Health Catalyst 则低得多。信息很直接：公开市场愿意为差异化医疗 AI
              和数据规模付溢价，但只有当收入规模和质量可见时，溢价才会变得持久。


              私募可比公司给出类似但更细的故事。Viz.ai 和 Abridge 显示，品类领先的医疗 AI 公司可以获得丰厚融资支持。PathAI 2026 年 Roche 交易和 Paige 2025 年出售给
              Tempus 说明，并非每个临床可信的 AI 资产都会像独立平台那样定价。对 Aidoc
              来说，这意味着上行情景真实存在，但证明负担也真实存在。没有披露经济指标时，理性做法是把可能价值放在这些可比区间内框定，而不是把私募稀缺性当成自证。
