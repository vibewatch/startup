      - number: '8.5'
        title: 尽调问题与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调项最简单：当前价格是多少？没有这个数字，即便最好的可比分析也只是合理性测试。第二个阻碍是收入质量——ARR、利润率、留存、付费使用转化和优先股堆叠。如果这些指标强，Aidoc
              可能合理享有溢价；如果表现平庸，公开可比区间会迅速压缩估值论证。


              这直接引出投资逻辑失效触发器。在 2025-2026
              年不透明背景下，平轮或下轮会是红旗，说明早期私募标记跑在基本面前面。无法把标志性部署转化为付费扩张，会以更慢速度讲同一个故事。如果报销或既有工作流供应商继续阻碍医院为 Aidoc
              分配持久预算，公司看起来就更像有用功能层，而非高溢价独立平台。在这些问题回答前，正确收尾姿态是有纪律的好奇，而不是急切。
