  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和定价信号指向企业软件，而不是透明交易定价
        blocks:
          - type: paragraph
            body: >
              从各个角度看，Aidoc 的公开商业姿态都由企业销售牵引。产品页面描述了它与 PACS、EHR、排班、报告和照护协同工作流的深度集成；AWS Marketplace
              页面则称该产品只通过私下报价提供。这是协商式企业合同的典型特征，而不是自助软件或标准化按检查结账流程。Aidoc 的变现面看起来也比单一放射科分诊模块更宽：aiOS
              治理多个模型，放射科产品嵌在既有影像工作流中，照护协同层则把价值延伸到患者随访和跨专科触发。


              缺失的内容同样重要。官方页面不发布标价、按检查费率或分部收入结构。本次找到的唯一具体公开定价信号，是一个可靠性较低的第三方评论页面，估计首年成本为 $50,000 到 $150,000 以上，并称每次安装起价约
              $50,000。作为包装代理，这个信号有方向性价值，但还不足以支撑投资测算。可辩护的结论是，Aidoc 的行为像带实施工作和工作流粘性的企业 SaaS / 站点许可软件，而实际成交价格和收入确认仍未披露。
