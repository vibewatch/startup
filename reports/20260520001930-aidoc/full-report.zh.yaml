  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              分析 Aidoc 时，应先把它放在放射 AI
              工作流市场内，再延伸到相邻的照护协同和跨专科编排层。官方放射科页面明确写到，公司价值从影像工作流中的分诊、优先级排序、定量发现和随访触发开始。照护协同页面随后把视角从放射科医生生产力扩展到多学科决策支持，尤其是肺栓塞等急症场景，时间、沟通和随访管理与影像解读同样重要。这一边界排除了通用
              EHR 厂商、影像硬件 OEM 收入、计费软件以及大多数面向消费者的数字健康工具，即便这些系统仍是集成依赖。它也意味着，宽泛的“医疗 AI” TAM
              说法会高估相关性，除非能被转换成放射科或急症工作流预算。MarketsandMarkets 和 Emergen Research 仍有用，因为它们确认医院是最大的放射 AI 买方，且以 CT
              为中心、工作流属性强的用例主导当前支出。但本章把这些报告视为品类天花板，而不是 Aidoc 可获取市场的直接代理。关键分析动作，是把 Aidoc
              的真实市场定义为依附于影像、分诊和下游照护触发的企业级工作流软件，而不是全部诊断 AI，更不是全部医疗 IT。
