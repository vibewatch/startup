      - number: '1.4'
        title: 规模信号、具名客户与监管里程碑
        blocks:
          - type: paragraph
            body: >-
              Aidoc 公开披露的规模已经足够大，分析公司时应把它视为企业级部署故事，而不是试点阶段厂商。2025 年 CARE 融资稿称，Aidoc 每年在 150+ 个医疗系统中支持超过 45 million
              名患者，并预计三年内达到 100 million。2026 年 Series E 材料进一步提高了披露规模，称年度患者病例超过 60 million，累计已分析患者病例超过 110 million，并部署在近
              2,000 家医院。这些数字来自公司自报，但支撑它们的客户证据已强于早期轮次。Asklepios 披露了覆盖德国 28 家医院的部署，每月约分析 35,000 张 CT 和 X-ray 图像；Hartford
              HealthCare 则表示 Aidoc 的 17 个算法部署在三周内上线，覆盖数百万次患者检查。监管记录也很具体，而不是纯叙事。FDA K213721 显示 2022 年脑动脉瘤分诊获批，K231631 显示
              2023 年 CAC 量化获批。Aidoc 2025 年和 2026 年新闻稿随后从逐适应症批准转向基础模型叙事：先是 CARE1 的肋骨骨折获批，再到综合体部 CT 分诊获批，把 11 个新适应症与 3
              个既有适应症纳入同一工作流。客户证据和监管产出的组合，是后续章节可以把 Aidoc 视为已成规模临床 AI 基础设施公司，而不是单产品创业公司的核心原因。
