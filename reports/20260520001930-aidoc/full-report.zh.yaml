            body: >-
              由于当前私募价格未披露，正确的情景框架应看退出价值，而不是当前内在价值。乐观情景下，Aidoc 把现有企业牵引力和基础模型叙事转化为数亿美元经常性收入，同时保住医疗 AI
              溢价倍数。这可以支撑中等个位数十亿美元退出区间。基准情景下，Aidoc 证明自己是有价值但并不例外的医疗工作流平台，指向较低个位数十亿美元结果。悲观情景下，报销摩擦、EHR 原生竞争或当前部署的弱商业化，把
              Aidoc 推向 1x-4x 的公开医疗 IT 走廊。


              情景逻辑并不是 Aidoc 必须失败才配得上更低估值；而是即便是好公司，如果资本市场正常化快于运营证据到来，也可能跑输溢价私募定价。Rock Health 和 Cooley 都把 2025-2026
              年数字健康市场描述为集中且选择性强，这一点尤其成立。正确问题不是“Aidoc 能值很多钱吗？”而是“在溢价标记站得住之前，Aidoc 必须跨过怎样的收入和质量门槛？”
            claimRefs:
