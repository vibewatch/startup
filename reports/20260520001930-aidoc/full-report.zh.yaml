  - id: TP001
    title: 竞品画像表
    columns:
      - 竞品组
      - 类别
      - 工作流层
      - 规模 / 商业化信号
      - 相对 Aidoc 的核心优势
      - 相对 Aidoc 的主要限制
    rows:
      - - Viz.ai
        - 直接急性护理临床 AI
        - 叠加在影像触发工作流上的护理协调平台
        - 50+ 个 FDA 获批算法；Series D 轮时覆盖 1,000+ 家医院；后续引用 1,400+ 家医院 / 2.2 亿人群
        - 最接近的同类组合：影像检测 + 下游护理团队调动
        - 更偏疾病项目中心；在开放式多服务线编排上不如 Aidoc 讲得明确
      - - Enlitic + Annalise
        - 影像数据基础设施 + 广泛发现支持
        - 面向放射科的标准化、报告和分诊工作流工具
        - Enlitic 面向放射科医生 / PACS 管理员；Annalise 入选 64 家 NHS 信托机构，每年处理 280 万张胸部 X 光
        - 在影像数据质量和多发现解读支持上覆盖面强
        - 影像工作流之外的企业级护理协调，公开证据较少
      - - Nanox.AI / Zebra
        - 影像网络 + AI/软件混合模式
        - AI 和软件挂在更广的影像及远程放射栈上
        - 上市公司；2025 年 Q4 AI/软件收入仍只有 $0.5M
        - 可把 AI 与硬件、影像网络和远程放射动作结合
        - 商业化仍早期，验证程度远低于医院工作流营销所暗示
      - - PathAI
        - 数字病理平台
        - 云端病理工作流和 AI 应用中枢
        - AISight 平台；2026 年被 Roche 收购，前期付款 $750M，另含里程碑付款
        - 病理工作流和生物制药定位强
        - 不是放射科或急性护理协调平台
      - - Paige
        - 计算病理 / 基础模型进入者
        - 病理医生助手和生物标志物工作流工具
        - 近 700 万张数字化切片；被 Tempus 以 $81.25M 收购
        - 数据资产强，病理基础模型叙事也强
        - 与模态相邻而非放射科优先；医院工作流覆盖面窄得多
      - - Nuance / Microsoft
        - 工作流分发和 AI 市场层
        - Precision Imaging Network 建在既有影像和云工作流关系上
        - 单一合同 / BAA / MSA 提供部署捷径；合作伙伴生态触达保险计划和雇主
        - 简化采购，拥有既有工作流关系
        - 目前更像分发层，而不是端到端临床 AI 运营模式
      - - Sectra / Fujifilm / AGFA / GE / Intelerad 等影像 IT 既有厂商
        - PACS 和企业影像既有厂商
        - 既有 PACS、云归档、工作流编排和嵌入式 AI 界面
        - Sectra 和 Fujifilm 推广 AI 市场 / 编排器；GE 对 Intelerad 估值 $2.3B，且 90% 为经常性收入
        - 装机基础、捆绑采购，以及跨放射科及更广场景的工作流控制
        - 单个算法可能弱于 Aidoc 第一方临床栈，或更依赖合作伙伴
      - - 现状 / 院内治理
        - 既有 PACS + 人工升级 + 选择性 AI 插件
        - 医院自有工作清单、路由、QA 和治理委员会
        - ROI 或治理证明薄弱时，仍是默认选择
        - 切换痛感最低，本地控制最大
        - 碎片化继续存在，也可能拖慢企业级随访工作流
    notes: 公开信号强调工作流位置、装机基础杠杆和战略方向。实际定价和许多私营公司收入仍未披露。
