      - number: '5.3'
        title: 集成、编排与企业级部署
        blocks:
          - type: paragraph
            body: >
              Aidoc 的产品主张一直强调嵌入临床医生已经使用的系统。aiOS、VTE 和主动脉页面都描述了 PACS、EHR 与移动端交付，并在影像分诊之上叠加照护协同。VTE 页面尤其明确：aiOS
              摄取多模态数据，把提醒路由到 PACS、EHR 和移动工作流，并在同一运行层中呈现实验室、生命体征、影像复核和 PERT 沟通。主动脉页面对跨科室聊天、移动复核和 EHR 连接的照护触发也提出了类似主张。


              FDA 摘要显示了这一设计的监管边界。K252970 是工作流分诊和通知产品，不是诊断软件；用户仍需在 PACS 中阅读完整影像并使用专业判断。这一边界重要，因为它解释了 Aidoc 如何把 AI
              深度嵌入运营工作流，同时仍将软件定位为优先级排序和协同层，而不是自主诊断代理。


              部署证据显示 Aidoc 可以支持不止一种运行模式。FDA 摘要在 CARE 体部 CT 获批中描述了云环境中的基于 Linux 的服务器。Aidoc 的 AWS 页面营销在 AWS 上符合 HIPAA
              的企业级部署；Asklepios 部署则称实施采用安全的云端方法，并配合本地部署 aiOS 平台，以满足 GDPR
              和既有放射系统约束。合在一起，公开记录支持的是可配置的云加企业集成模式，而不是单一不可变部署架构。
