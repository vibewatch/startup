      - number: '7.3'
        title: 合作伙伴、平台与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Aidoc 的运营模式与外部平台深度交织。这部分是优势：公司称 aiOS 不绑定供应商，已集成 PACS/VNA/EHR 工作流，并可在 Epic App Orchard
              中使用，这正是医院想要的工作流可信度。Aidoc 还与 AWS 合作，有多年期投资支持 CARE 基础模型开发。这些关系降低商业化摩擦，让 Aidoc 比狭窄算法供应商更像企业级公司。


              同样的关系也制造集中度风险。如果 Epic 调整姿态，OEM 或转售渠道表现不佳，或 AWS 经济性变化，Aidoc 的部署动作会很快削弱。既有技术栈内部的竞争强度也在上升：Microsoft 面向 Epic
              环境销售 Dragon 和 Azure AI，Oracle 推出面向文档和工作流的临床 AI 智能体，Epic 自身也把 AI
              定位为嵌入其软件全线。若医院足够看重急性影像分诊和跨团队编排，愿意购买专门层，Aidoc 仍能赢；但这是定价权问题，不是保证成立的护城河。实际结论是，Aidoc
              的伙伴姿态是重要缓释项，但应先被视为暴露地图，其次才是护城河。
