      - number: '4.2'
        title: 资本历史可见，但估值支撑仍不完整且内部不一致
        blocks:
          - type: paragraph
            body: >
              相比已披露的经营指标，Aidoc 最新融资记录要新得多。公司在 2023 年称，一轮 $110 million Series D 使总融资达到 $250 million。2025 年，一份 PRNewswire
              新闻稿描述了 $150 million 融资加 $40 million 循环信贷额度，并称总融资为 $370 million。随后在 2026 年 4 月，Aidoc 和 Goldman Sachs 称一轮
              $150 million Series E 使总融资超过 $500
              million。单独看，每份公告对新增轮次都清楚。合在一起看，累计总额无法干净对上，因此建模已融资资本时，最安全的方法是逐轮相加，而不是相信标题式累计融资总额。


              估值证据更薄。Calcalist 报道称，2025 年轮次的估值高于上一轮；Globes 则称公司不会披露收入或该轮估值。这样一来，2024
              年后的记录支持动能，却不足以给出数字化公允价值判断。实际含义是，即便经过 2026 年 Series E，公开证据目前也不能确认 Aidoc 的精确估值或当前独角兽状态。
