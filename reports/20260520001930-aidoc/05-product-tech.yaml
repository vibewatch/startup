  - id: maturity-roadmap-and-risks
    title: Maturity, ecosystem direction and technical risks
    body: |
      Aidoc’s strongest technical signal is not just regulatory activity but platform maturity in live health systems. By late
      April 2026, the company and independent media were describing 60+ million patient cases analyzed per year and
      deployment across nearly 2,000 hospitals. At the customer-story level, Mercy, Hartford and Asklepios provide direct
      evidence that Aidoc can move from initial agreement to operational rollout without being trapped in one-site pilots.
      Careers postings for AI algorithms, ML platform, backend, DevOps, cloud platforms and infrastructure product roles
      further suggest active investment in a sustained enterprise product roadmap.

      The roadmap is ambitious. Aidoc says CARE will expand across CT and X-ray workflows and that automated draft
      report creation is a near-term target. Those directions fit the company’s repeated “pixel to draft report” language and
      its claim that foundation models compress years of roadmap into a shorter period. But those roadmap items are still
      prospective rather than broadly evidenced in public production deployments.

      The main diligence risks are therefore concentrated in proof depth, not in surface breadth. Public sources do not give
      a reconciled official portfolio count, independent multi-site benchmarking for CARE remains thin, and the company has
      not published a detailed third-party model onboarding or governance rubric for the 69%-external-model ecosystem it
      describes. The product appears enterprise-grade and real, but the market-facing narrative is ahead of the publicly
      documented reference architecture and benchmark corpus.
    claimRefs:
      - CE025
      - CE026
      - CE027
