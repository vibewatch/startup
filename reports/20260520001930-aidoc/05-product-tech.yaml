  evidenceGaps:
    - type: missing-source
      severity: material
      topic: portfolio-count
      missingEvidence: A current official Aidoc-published numeric count of FDA-cleared and CE-marked algorithms/models mapped to clearances.
      whyItMatters: Portfolio breadth is central to Aidoc’s moat narrative, but buyers cannot reconcile official marketing language with public third-party counts.
      diligencePath: Request the current product master list with product name, jurisdiction, clearance number and retirement status.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: bundled-indications
      missingEvidence: A public enumeration of the three previously cleared indications bundled into the Jan. 2026 comprehensive workflow.
      whyItMatters: Without the exact three legacy modules, a buyer cannot fully map the 14-indication body-CT workflow against existing deployments.
      diligencePath: Ask Aidoc for the exact bundled indication list and the related legacy clearance numbers.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE002]
    - type: private-evidence-only
      severity: material
      topic: CARE-benchmarking
      missingEvidence: Independent multi-site benchmark studies comparing CARE against competing single-condition or multi-condition tools in live operations.
      whyItMatters: Regulatory performance and vendor marketing are meaningful but not sufficient for underwriting large-scale diagnostic workflow risk.
      diligencePath: Request customer-side validation summaries, post-deployment QA reports and any peer-reviewed cross-site studies.
      relatedQuestionRefs: [QE023]
      relatedTableRefs: [TE005]
    - type: private-evidence-only
      severity: minor
      topic: third-party-model-governance
      missingEvidence: Detailed public criteria for onboarding, validating and monitoring external non-Aidoc models on aiOS.
      whyItMatters: Open-ecosystem positioning is strategically attractive, but governance detail matters when aiOS is acting as a multi-vendor clinical AI control plane.
      diligencePath: Request the third-party model review rubric, rejection thresholds and monitoring playbook used by customer governance teams.
      relatedQuestionRefs: [QE019, QE025]
      relatedTableRefs: [TE003]
