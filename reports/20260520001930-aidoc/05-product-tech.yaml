  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Primary Risk
    rows:
      - - Study ingestion and metadata filtering
        - Matches studies to workflow criteria and prepares inputs
        - DICOM imaging, modality metadata, study routing rules
        - Misconfigured criteria could suppress relevant studies
      - - Orchestration layer
        - Chooses which models run on each scan based on anatomy and context
        - aiOS logic, metadata, pixel and textual signals
        - Public architecture detail stops short of full decision-tree disclosure
      - - Model execution layer
        - Runs CARE or other task-specific algorithms
        - GPU/cloud/on-prem compute and model registry
        - Third-party model quality governance is not publicly detailed
      - - Notification / preview layer
        - Delivers prioritization flags and preview imagery
        - PACS, worklists, mobile clients
        - Preview outputs are not diagnostic and must not replace full-image review
      - - Care coordination layer
        - Routes alerts, chat and team activation across specialties
        - EHR, mobile, role-based escalation paths
        - Over-alerting or poor configuration can create workflow fatigue
      - - Patient management layer
        - Tracks follow-up populations such as aneurysm or IVC filter cohorts
        - NLP/report extraction and scheduling connections
        - Longitudinal retention metrics are not broadly published
      - - Governance / analytics layer
        - Monitors adoption, performance and overrides
        - Validation, drift detection, analytics dashboards
        - Independent audit evidence is limited in the public domain
      - - Security / compliance foundation
        - Protects data and constrains regulated use
        - AWS/Azure, NIST CSF, QMS, MDR/FDA controls
        - Trust-center detail is thinner than customer procurement diligence typically requires
    notes: >-
      Architecture synthesized from official product, security, quality and FDA materials. Aidoc has not published a single
