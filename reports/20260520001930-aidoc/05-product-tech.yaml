callouts:
  - calloutType: strength
    title: aiOS looks like an enterprise operating layer, not a collection of point tools
    body: |
      Aidoc’s strongest product signal is operational architecture. The same fetched materials that describe PACS/EHR
      integration also show external-model hosting, governance, monitoring and multi-site rollout patterns. That is a more
      durable enterprise position than competing only on one radiology algorithm at a time.
    claimRefs:
      - CE001
      - CE004
      - CE027
      - CE031
      - CE032
  - calloutType: insight
    title: CARE has crossed the regulatory line from concept to product, but proof depth still trails marketing breadth
    body: |
      The Jan. 2026 clearance and the FDA’s K252970 summary are strong proof that CARE is real and regulated. The weak
      point is not whether the model exists, but how much independently comparable benchmark evidence exists across live
      sites and across the full portfolio that Aidoc markets under one platform story.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE036
  - calloutType: risk
    title: Portfolio count, third-party governance and benchmark transparency remain diligence gaps
    body: |
      Aidoc’s site repeatedly markets breadth and scale, but public materials do not reconcile the current portfolio count,
      do not fully enumerate every bundled indication, and do not publish a detailed third-party model governance rubric.
      Those gaps do not negate the product thesis, but they matter for buyers underwriting clinical AI risk at enterprise
      scale.
    claimRefs:
      - CE029
      - CE030
      - CE036
