  - id: trust-and-quality
    title: Trust, safety, security and compliance
    body: |
      Aidoc’s trust posture looks meaningfully more mature than a typical startup AI vendor’s public surface. The quality
      page says Aidoc operates under a QMS certified to MDSAP and ISO 13485, and that it is compliant with FDA QSR,
      EU MDR, ISO 14971 and IEC 62304. Just as important, the page explicitly reiterates that the company’s triage and
      notification solutions are not diagnostic software and are not intended to replace a clinician’s full image review. That
      is a useful public acknowledgement of the boundary conditions around the product.

      On the security side, Aidoc says it aligns with the NIST Cybersecurity Framework and runs on AWS and Azure using
      controls such as EDR, encryption, SIEM and CSPM. The AWS partnership page separately markets the product as
      HIPAA-compliant and enterprise-ready. None of those statements substitute for a customer trust-center audit or a
      reviewed SOC report, but they do show that Aidoc is presenting itself as a hospital-grade, regulated software vendor
      rather than a lightweight departmental AI app.

      The BRIDGE framework adds a governance lens beyond controls and certifications. Aidoc positions BRIDGE as a
      roadmap for resilient, responsible AI adoption built with NVIDIA, health systems and industry partners. That is useful
      not because it proves technical superiority, but because it suggests Aidoc understands that multi-model deployment
      success is as much about governance and operating discipline as algorithm accuracy. The public gap is that BRIDGE
      describes principles and collaboration, not the precise customer-by-customer onboarding criteria for third-party models.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
