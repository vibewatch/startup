  productSummary: Enterprise clinical AI platform combining Aidoc aiOS orchestration, FDA-cleared radiology solutions, care-coordination workflows, and CARE foundation-model capabilities for multi-condition triage and downstream action.
  customerFocus: Health systems, radiology groups, and acute-care service lines that need imaging triage, care coordination, and enterprise AI governance.
  businessModel: Enterprise SaaS / site-license clinical AI software sold into hospitals and health systems, with workflow integration, orchestration, and care-coordination modules rather than self-serve transactional pricing.
  stage: Series E / late-stage private
