  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor set
      - Primary buyer
      - Public packaging signal
      - Deployment motion
      - Contract / renewal implication
      - Evidence gap
    rows:
      - - Aidoc
        - Health systems and radiology-led enterprise buyers
        - Private-offer marketplace listing; platform plus care-coordination messaging
        - Deep workflow integration and enterprise rollout
        - Likely multiyear recurring relationship once integrated across modalities
        - No public list price or realized pricing
      - - Viz.ai
        - Health systems, stroke/cardiac programs, life sciences
        - Platform expansion funded at unicorn-scale private valuation
        - Disease-program rollout expanding across conditions
        - Strong if clinical teams standardize around programmatic pathways
        - Public pricing still opaque
      - - Enlitic / Annalise
        - Radiology departments, imaging networks, hospital IT
        - Workflow and data-standardization positioning; NHS procurement wins for Annalise
        - Departmental or network-level integration into reporting and triage
        - Sticky where data normalization and reporting processes are embedded
        - Limited public disclosure on realized contract structure
      - - PathAI / Paige
        - Labs, pathology groups, biopharma, cancer centers
        - Enterprise pathology platform and AI licensing
        - Dataset- and workflow-led deployment into pathology stack
        - Sticky if incorporated into diagnostic and biomarker workflows
        - Adjacent to, rather than directly substitutable for, radiology contracts
      - - Nuance / Microsoft / PACS incumbents
        - CIOs, imaging IT, enterprise imaging leaders
        - Single contract / BAA / MSA or PACS-bundled AI surfaces
        - Add AI inside existing imaging and cloud relationships
        - Highest renewal leverage where incumbent infrastructure is already entrenched
        - Hard to separate AI price from broader imaging-IT spend
      - - Status quo / selective add-ons
        - Local radiology leadership and governance committees
        - Incremental add-on purchases, pilots, or manual workflow changes
        - Slow, use-case-by-use-case deployment
        - Lowest commitment but weakest enterprise standardization
        - Savings often hard to measure consistently
    notes: Public disclosures reveal packaging logic and procurement posture more clearly than actual prices. Hospitals often buy the workflow layer before they can evaluate algorithm list prices.
