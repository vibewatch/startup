tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor set
      - Category
      - Workflow layer
      - Scale / commercialization signal
      - Key strength versus Aidoc
      - Main limitation versus Aidoc
    rows:
      - - Viz.ai
        - Direct acute-care clinical AI
        - Care coordination platform layered into imaging-triggered workflows
        - 50+ FDA-cleared algorithms; 1,000+ hospitals at Series D; 1,400+ hospitals / 220M lives later cited
        - Closest like-for-like blend of image detection plus downstream care-team mobilization
        - More disease-program-centric and less explicit than Aidoc on open multi-service-line orchestration
      - - Enlitic + Annalise
        - Imaging-data infrastructure + broad finding support
        - Standardization, reporting, and triage workflow tools for radiology departments
        - Enlitic targets radiologists / PACS admins; Annalise selected across 64 NHS trusts and 2.8M chest X-rays annually
        - Strong breadth in imaging data quality and high-finding-count interpretation support
        - Less public evidence of enterprise care coordination beyond imaging workflows
      - - Nanox.AI / Zebra
        - Imaging-network + AI/software hybrid
        - AI and software attached to broader imaging and teleradiology stack
        - Public company; AI/software revenue still only $0.5M in Q4 2025
        - Can combine AI with hardware, imaging network, and teleradiology motions
        - Monetization remains early and far less proven than hospital workflow marketing suggests
      - - PathAI
        - Digital pathology platform
        - Cloud pathology workflow and AI application hub
        - AISight platform; acquired by Roche in 2026 for $750M upfront plus milestones
        - Strong pathology workflow and biopharma positioning
        - Not a radiology or acute-care coordination platform
      - - Paige
        - Computational pathology / foundation model entrant
        - Pathologist copilot and biomarker workflow tools
        - Nearly 7M digitized slides; acquired by Tempus for $81.25M
        - Strong data asset and pathology foundation-model narrative
        - Modality-adjacent rather than radiology-first; much narrower hospital workflow surface
      - - Nuance / Microsoft
        - Workflow distribution and AI marketplace layer
        - Precision Imaging Network built on existing imaging and cloud workflow relationships
        - Single contract / BAA / MSA deployment shortcut; partner ecosystem reaches plans and employers
        - Procurement simplification and installed workflow relationships
        - More distribution layer than end-to-end clinical-AI operating model today
      - - Sectra / Fujifilm / AGFA / GE / Intelerad
        - PACS and enterprise imaging incumbents
        - Existing PACS, cloud archive, workflow orchestration, and embedded AI surfaces
        - Sectra and Fujifilm market AI marketplaces/orchestrators; GE values Intelerad at $2.3B with 90% recurring revenue
        - Installed base, bundled procurement, and workflow control across radiology and beyond
        - Individual algorithms may be weaker or more partner-dependent than Aidoc's first-party clinical stack
      - - Status quo / in-house governance
        - Existing PACS + manual escalation + selective AI add-ons
        - Hospital-owned worklists, routing, QA, and governance committees
        - Still the default when ROI or governance proof is weak
        - Lowest switching pain and maximal local control
        - Leaves fragmentation in place and can slow enterprise follow-up workflows
    notes: Public signals emphasize workflow position, installed-base leverage, and strategic direction. Realized pricing and many private-company revenues remain undisclosed.
