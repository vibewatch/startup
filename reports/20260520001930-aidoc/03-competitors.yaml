  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Why it matters
      - Threat
      - Severity
      - Diligence ask
    rows:
      - - Regulated triage plus orchestration plus care coordination
        - Gives Aidoc a broader story than single-algorithm rivals
        - Viz.ai and incumbents are converging on care-coordination plus workflow narratives
        - High
        - Ask how much revenue comes from orchestration/care coordination versus first-party algorithms
      - - Open ecosystem and third-party model hosting
        - Helps hospitals reduce vendor sprawl on one operating layer
        - Fujifilm, Nuance/Microsoft, and PACS vendors also market open AI hosting
        - High
        - Validate whether aiOS meaningfully outperforms incumbent orchestration on activation speed and governance
      - - Deep workflow integration
        - Embedded PACS / EHR / reporting connections raise switching costs
        - Incumbent imaging vendors already control much of that plumbing
        - High
        - Request churn, replacement-win, and deployment-time data versus incumbent PACS vendors
      - - Deployment scale and FDA history
        - Signals trust and implementation maturity
        - More vendors now claim broad clearances and large installed bases
        - Medium
        - Compare active utilization and renewal, not just logos or clearances
      - - Enterprise ROI from incidentals and follow-up
        - Enterprise value is the core buying argument as reimbursement stays narrow
        - Independent evidence says ROI still often fails unless measured systemwide
        - High
        - Ask for audited customer ROI studies that extend beyond radiology turnaround time
      - - Pathology and multimodal adjacency
        - Could expand Aidoc's budget relevance beyond radiology
        - PathAI, Paige, and other multimodal entrants may win AI-strategy dollars first
        - Medium
        - Clarify roadmap credibility outside current radiology-heavy strengths
    notes: This register focuses on moat durability rather than product quality. The core question is whether Aidoc can keep control of the enterprise AI operating layer as incumbents and adjacent specialists expand.
