company:
  name: Aidoc
chapter:
  number: 3
  title: Competitors
  summary: >-
    Aidoc's closest direct rival is Viz.ai in acute-care detection plus care coordination, but the harder long-term
    threat comes from workflow-layer incumbents such as Nuance/Microsoft, Sectra, Fujifilm, GE/Intelerad, and AGFA
    that already control hospital imaging infrastructure. Aidoc remains differentiated by combining regulated triage,
    enterprise orchestration, and cross-specialty care coordination, yet moat durability now depends more on workflow
    control, governance, and proving enterprise ROI than on any single algorithm lead.
sections:
  - id: landscape-and-status-quo
    title: Landscape and status-quo alternatives
    body: |
      Aidoc does not compete in a single neatly bounded category. Its product stack starts with regulated radiology triage, extends into aiOS orchestration, and then reaches into care coordination and downstream follow-up. That means the real comparison set includes direct clinical-AI peers like Viz.ai, infrastructure-first imaging vendors like Enlitic and Nanox.AI, pathology-adjacent foundation-model players like PathAI and Paige, and incumbent imaging-IT vendors that already own PACS, archiving, routing, and security review. Independent industry coverage reinforces that hospitals are increasingly buying for workflow integration and enterprise value rather than for isolated point algorithms.

      The status quo remains powerful. ACR's ARCH-AI program frames imaging-AI deployment as an ongoing governance and quality-assurance discipline, not just a software purchase. Radiology Business likewise argues that many health systems still struggle to justify AI unless it improves enterprise operations beyond radiology. In practice, that means existing PACS, worklists, and in-house governance remain real substitutes for Aidoc, especially when a hospital can add AI incrementally on top of incumbent infrastructure instead of replacing its workflow layer.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP031
      - CP032
      - CP033
      - CP042
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: direct-clinical-ai-peers
    title: Direct clinical-AI peers
    body: |
      Viz.ai is the clearest like-for-like competitor because it combines image-triggered detection with downstream care-team mobilization and has already scaled into large health-system deployments. It markets more than 50 FDA-cleared algorithms, positions itself as a care coordination platform rather than a single-use tool, and has public evidence of unicorn-scale fundraising. That makes Viz.ai the most direct benchmark for whether Aidoc can keep acute-care coordination differentiated as more vendors add algorithm breadth.

      Enlitic and Annalise/Harrison.ai compete differently. Their messaging emphasizes imaging-data normalization, workflow efficiency, and broad finding coverage rather than systemwide care coordination. Nanox.AI/Zebra sits in another adjacent lane again: it combines AI and software with a broader imaging-network and hardware agenda. These peers matter because they can pressure Aidoc on modality breadth, algorithm count, or hospital workflow embedding even if they do not fully replicate Aidoc's cross-specialty operating-layer story.
    claimRefs:
