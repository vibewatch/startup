  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: competitor-pricing
      missingEvidence: Actual contract pricing, realized discounts, and module attach rates for Aidoc, Viz.ai, and PACS-incumbent orchestration layers.
      whyItMatters: Public packaging signals are visible, but real pricing power is what determines competitive leverage and replacement risk in enterprise buying cycles.
      diligencePath: Request three recent customer contracts or redlined order forms per vendor class and compare term length, implementation fees, and renewal escalators.
      relatedQuestionRefs: [QP017, QP025]
    - type: missing-source
      severity: material
      topic: incumbent-replacement-rates
      missingEvidence: Win/loss and churn data showing how often Aidoc replaces incumbent PACS-adjacent AI layers versus being added alongside them.
      whyItMatters: Installed-base control is central to the moat question, but public sources rarely disclose actual competitive displacement outcomes.
      diligencePath: Ask management for named replacement wins, lost deals, and time-to-go-live benchmarks against Nuance, Sectra, Fujifilm, and GE/Intelerad.
      relatedQuestionRefs: [QP016, QP020]
    - type: private-evidence-only
