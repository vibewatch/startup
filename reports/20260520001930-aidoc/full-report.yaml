  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Aidoc looks like a real category participant with real traction, but public evidence still stops short of
              an investable price call. The company can point to a new FDA clearance, named enterprise deployments, over
              100 million analyzed patient cases, and strategic backing from AWS, Goldman Sachs Alternatives, General
              Catalyst, SoftBank Vision Fund 2, and NVentures. That is enough to rule out the dismissive view that Aidoc
              is merely a concept-stock story. It is not enough to justify paying a premium private valuation blindly.


              The core problem is valuation opacity. Public post-2024 financing coverage confirms more capital and more
              investor support, but not a clean current post-money number. That means there is no public way to
              translate today’s implied private price into a revenue multiple, margin-adjusted multiple, or
              preference-adjusted outcome. My stance is therefore research-more / track. The company may deserve a
              premium if internal metrics are strong, but public evidence today supports curiosity, not conviction.
              Because a post-2024-05-20 current valuation is not disclosed, Aidoc’s unicorn status should be treated as
              an unconfirmed label rather than a verified fact.
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV038
              - CV039
              - CV043
