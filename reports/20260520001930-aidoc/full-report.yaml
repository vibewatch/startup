      - number: '5.4'
        title: Trust, safety, security and compliance
        blocks:
          - type: paragraph
            body: >
              Aidoc’s trust posture looks meaningfully more mature than a typical startup AI vendor’s public surface.
              The quality

              page says Aidoc operates under a QMS certified to MDSAP and ISO 13485, and that it is compliant with FDA
              QSR,

              EU MDR, ISO 14971 and IEC 62304. Just as important, the page explicitly reiterates that the company’s
              triage and

              notification solutions are not diagnostic software and are not intended to replace a clinician’s full
              image review. That

              is a useful public acknowledgement of the boundary conditions around the product.


              On the security side, Aidoc says it aligns with the NIST Cybersecurity Framework and runs on AWS and Azure
              using

              controls such as EDR, encryption, SIEM and CSPM. The AWS partnership page separately markets the product
              as

              HIPAA-compliant and enterprise-ready. None of those statements substitute for a customer trust-center
              audit or a

              reviewed SOC report, but they do show that Aidoc is presenting itself as a hospital-grade, regulated
              software vendor

              rather than a lightweight departmental AI app.


              The BRIDGE framework adds a governance lens beyond controls and certifications. Aidoc positions BRIDGE as
              a

              roadmap for resilient, responsible AI adoption built with NVIDIA, health systems and industry partners.
              That is useful

              not because it proves technical superiority, but because it suggests Aidoc understands that multi-model
              deployment

              success is as much about governance and operating discipline as algorithm accuracy. The public gap is that
              BRIDGE

              describes principles and collaboration, not the precise customer-by-customer onboarding criteria for
              third-party models.
            claimRefs:
              - CE021
              - CE022
              - CE023
              - CE024
              - CE027
              - CE036
          - type: table
            tableRef: TE004
            claimRefs:
              - CE021
              - CE022
              - CE023
      - number: '5.5'
        title: Maturity, ecosystem direction and technical risks
        blocks:
          - type: paragraph
            body: >
              Aidoc’s strongest technical signal is not just regulatory activity but platform maturity in live health
              systems. By late

              April 2026, the company and independent media were describing 60+ million patient cases analyzed per year
              and

              deployment across nearly 2,000 hospitals. At the customer-story level, Mercy, Hartford and Asklepios
              provide direct

              evidence that Aidoc can move from initial agreement to operational rollout without being trapped in
              one-site pilots.

              Careers postings for AI algorithms, ML platform, backend, DevOps, cloud platforms and infrastructure
              product roles

              further suggest active investment in a sustained enterprise product roadmap.


              The roadmap is ambitious. Aidoc says CARE will expand across CT and X-ray workflows and that automated
              draft

              report creation is a near-term target. Those directions fit the company’s repeated “pixel to draft report”
              language and

              its claim that foundation models compress years of roadmap into a shorter period. But those roadmap items
              are still

              prospective rather than broadly evidenced in public production deployments.


              The main diligence risks are therefore concentrated in proof depth, not in surface breadth. Public sources
              do not give

              a reconciled official portfolio count, independent multi-site benchmarking for CARE remains thin, and the
              company has

              not published a detailed third-party model onboarding or governance rubric for the 69%-external-model
              ecosystem it

              describes. The product appears enterprise-grade and real, but the market-facing narrative is ahead of the
              publicly

              documented reference architecture and benchmark corpus.
