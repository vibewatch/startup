chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product architecture
        blocks:
          - type: paragraph
            body: >-
              Aidoc’s public materials consistently frame the company as a clinical AI vendor rather than a narrow
              radiology-algorithm shop. The official about page says the company is focused on helping healthcare teams
              optimize patient treatment and economic value, while the aiOS and CARE pages show how that positioning has
              widened from image triage into a broader enterprise workflow layer. aiOS is described as the control plane
              that runs, orchestrates, and governs clinical AI across a health system, connecting PACS, EHR, mobile, and
              care tools. CARE, in turn, is positioned as the multimodal foundation model that lets Aidoc move beyond
              single-condition tools toward broader disease coverage, automated measurement, and eventually draft-report
              generation. This matters because it changes the company’s investment case: Aidoc is no longer selling only
              acute-finding alerts to radiologists, but an operating layer for multi-algorithm deployment, care
              coordination, and model governance. Fetched sources support a clear New York commercial posture through
              the 2026 financing announcements, while Guy Reiner’s official bio still explicitly identifies him as
              general manager of the Tel Aviv branch. The resulting picture is a company with Israeli technical roots, a
              visible New York-facing capital-markets presence, and a strategy built around enterprise deployment rather
              than departmental point solutions.
