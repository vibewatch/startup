  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing signals point to enterprise software, not transparent transaction pricing
        blocks:
          - type: paragraph
            body: >
              Aidoc's public commercial posture looks enterprise-led from every angle. The product pages describe deep
              integration into PACS, EHR, scheduling, reporting, and care-coordination workflows, while the AWS
              Marketplace listing says the offering is available only by private offer. That is the classic signature of
              negotiated enterprise contracts rather than self-serve software or a standardized per-study checkout flow.
              Aidoc's monetization surface also appears broader than a single radiology triage module: aiOS governs
              multiple models, the radiology product sits inside existing imaging workflows, and the care-coordination
              layer extends value into patient follow-up and cross-specialty activation.


              What is missing is just as important. Official pages do not publish list prices, per-study rates, or
              segment revenue mix. The only concrete public pricing signal found in this run is a low-reliability
              third-party review page that estimates $50,000 to $150,000-plus of first-year cost and says pricing starts
              around $50,000 per installation. That is directionally useful as a packaging proxy, but not reliable
              enough for underwriting. The defendable conclusion is that Aidoc behaves like enterprise SaaS /
              site-license software with implementation work and workflow-stickiness, while actual realized pricing and
              revenue recognition remain undisclosed.
