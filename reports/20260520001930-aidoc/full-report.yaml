            body: >
              Aidoc still has a real competitive asset bundle. Official materials show breadth across radiology triage,
              enterprise orchestration, and care coordination, while the 2025 financing materials indicate customers
              already run third-party models on aiOS. That supports an argument that Aidoc is moving from
              single-algorithm vendor toward operating system, which is strategically important because hospitals
              increasingly want fewer vendors and more governance consistency.


              Still, the moat is not absolute. Multi-vendor orchestration is becoming table stakes, not unique. Fujifilm
              markets open orchestration with 50-plus validated algorithms, Nuance/Microsoft sells easier deployment
              through existing workflow contracts, and Sectra plus GE/Intelerad can bundle AI with broader imaging
              infrastructure. Independent coverage also makes clear that reimbursement and direct ROI remain narrow for
              much of imaging AI. Aidoc can therefore win when a health system values integrated follow-up, incidentals,
