  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and clinical-safety risk
        blocks:
          - type: paragraph
            body: >-
              Aidoc’s most serious risk remains the combination of regulated-device burden and clinical-liability
              exposure. The company has real regulatory assets: its quality page claims MDSAP, ISO 13485, EU MDR, and
              FDA-quality-system alignment, and Aidoc announced a new FDA clearance in January 2026 for a comprehensive
              triage product built on its CARE foundation model. Those are meaningful barriers to entry, but they also
              move Aidoc deeper into a regime where model updates, new indications, and documentation standards matter
              more every year. FDA’s January 2025 lifecycle guidance and August 2025 PCCP guidance both point toward
              tighter evidence expectations for AI-enabled device software, especially when models evolve after launch.
              Aidoc’s own BRIDGE framework acknowledges that trust, compliance, and workflow discipline are
              prerequisites for adoption, which is directionally reassuring but not a substitute for product-specific
              change-control evidence.


              Clinical liability is the corollary risk. Aidoc’s value proposition is faster escalation of critical
              findings in emergency and acute workflows, so a miss, delay, or biased prioritization failure could become
              a patient-harm event rather than a simple software defect. Peer-reviewed literature still flags bias and
              generalizability as unresolved problems in medical imaging AI, particularly when products move across
              sites and populations. The right underwriting posture is therefore not “Aidoc is unregulated,” but “Aidoc
              is regulated, scaling, and therefore increasingly exposed to the cost of doing regulation and post-market
              safety well.”
            claimRefs:
              - CR001
