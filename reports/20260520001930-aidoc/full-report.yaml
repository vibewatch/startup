      - number: '2.5'
        title: Adverse evidence and what it means for adoption timing
        blocks:
          - type: paragraph
            body: >-
              The most useful adverse evidence in this market is practical rather than sensational. Aidoc’s real-world
              pulmonary-embolism study summary is a good example: 97.8% agreement sounds strong, but the algorithm still
              missed 15% of confirmed PE cases and lost most adjudicated disagreements, which means hospitals cannot
              responsibly treat AI as a radiologist substitute. That is not a failure of the product so much as a
              reminder that the value proposition is triage and workflow support, not autonomous reading. The
              reimbursement evidence points in the same direction. If most acute radiology AI use cases will not earn
              separate paid CPT codes, buyers will continue to justify purchases through operational savings and
              clinical-risk reduction rather than direct line-item reimbursement. That slows adoption because enterprise
              software budgets, IT resources, and clinical governance committees all have to believe the efficiency and
              safety story before the product reaches scale. Aidoc’s current installed base shows this hurdle is
              surmountable for sophisticated systems, but it also implies that future growth depends on winning central
              workflow budgets, proving integration ROI, and showing that foundation-model governance can be trusted
              over time. In other words, the category has crossed the credibility threshold, but not the frictionless
              budget threshold.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM043
              - CM045
