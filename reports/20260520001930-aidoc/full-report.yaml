  - id: FV001
    title: Recommendation logic and diligence gates
    type: flow
    description: >-
      Decision path from visible traction through price, revenue-quality, and term-structure gates to the current
      recommendation.
    data:
      nodes:
        - id: traction
          label: Visible traction
          detail: '>$500M raised, FDA clearance, 100M cases, Advocate + Asklepios rollouts'
        - id: strategic
          label: Strategic validation
          detail: Goldman, AWS, NVentures, General Catalyst, SoftBank participation
        - id: price
          label: Current price known?
          detail: Exact post-2024-05-20 valuation publicly disclosed or diligenced
        - id: revenue
          label: Revenue quality known?
          detail: ARR, margin, retention, and preference stack confirmed
        - id: premium
          label: Premium multiple justified?
          detail: Evidence supports pricing above public 1x-3x corridor and toward 8x-10x leader band
        - id: research
          label: RESEARCH-MORE
          detail: Current price or economics missing; track but do not underwrite premium entry
        - id: track
          label: TRACK / CONDITIONAL BUY
          detail: Only if disclosed price and metrics support premium positioning
        - id: avoid
          label: AVOID PREMIUM
          detail: If price is opaque, terms are aggressive, or rollout monetization is weak
      edges:
        - from: traction
          to: strategic
          label: proof strengthens
        - from: strategic
          to: price
          label: still need price
        - from: price
          to: research
          label: 'NO'
        - from: price
          to: revenue
          label: 'YES'
        - from: revenue
          to: research
          label: 'NO'
        - from: revenue
          to: premium
          label: 'YES'
        - from: premium
          to: track
          label: 'YES'
        - from: premium
          to: avoid
          label: 'NO'
