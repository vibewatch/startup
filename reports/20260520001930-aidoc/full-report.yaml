  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: aiOS platform architecture and operating model
        blocks:
          - type: paragraph
            body: >
              Aidoc’s core product is not just a library of point algorithms; it is aiOS, an enterprise operating system
              for clinical

              AI. The aiOS page explicitly describes the platform as the layer that runs, orchestrates and governs
              clinical AI across

              a health system, with one integration feeding multiple workflows. In practice, that means a health system
              does not

              need to deploy each algorithm as a standalone widget. Instead, aiOS structures image and metadata inputs,

              determines which models should run, delivers output in the patient and study context, and exposes
              governance,

              monitoring and outcomes tracking at the system level.


              The architecture is workflow-first. Aidoc says aiOS uses textual data, scan metadata and pixel analysis to
              decide

              which scans should receive which AI processing, and then pushes suspected findings into PACS, EHR, mobile
              and

              care-team workflows. Aidoc also positions aiOS as an open ecosystem layer rather than a closed product
              silo:

              external-model hosting is a stated design goal, and multiple independent 2025 sources say the platform
              already

              hosts non-Aidoc models for a majority of customers. That makes aiOS closer to an AI control plane for
              hospital IT

              than a single-purpose radiology application.


              Public deployment examples support the platform framing. Hartford HealthCare reached initial go-live in
              three weeks,

              Mercy standardized aiOS across 50 facilities, and Asklepios completed rollout across 28 hospitals. Those
              examples

              suggest the product has moved beyond pilot-stage departmental tooling into enterprise implementation
              patterns.

              The remaining caveat is that Aidoc’s official site still markets the “largest portfolio of FDA-cleared
              algorithms”

              without publishing a current official numeric portfolio total, so breadth must be described with care.
