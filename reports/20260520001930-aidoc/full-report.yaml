    company sells Aidoc aiOS, an enterprise clinical AI operating system that embeds radiology triage, care
    coordination, and workflow governance into hospital PACS and EHR environments, and now layers CARE foundation-model
    capabilities on top. Public 2025-2026 evidence shows a heavily capitalized, scaled vendor with broad health-system
    deployment and ongoing FDA / CE progress, but still leaves current valuation, revenue quality, exact headcount, and
    the often-cited 170+ model count undisclosed.
