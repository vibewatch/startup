      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence is good enough to build market bounds, but not good enough to turn Aidoc’s market into a
              single precise TAM/SAM/SOM figure. The top-down lens starts with the size of U.S. healthcare delivery: CMS
              reports $5.3 trillion of national health expenditure in 2024, including $1.63 trillion of hospital
              spending and $1.11 trillion of physician and clinical services. The hospital-count lens adds 6,100 U.S.
              hospitals and more than 900,000 staffed beds from AHA. The category lens then narrows to radiology AI
              specifically: MarketsandMarkets puts the global market at $0.76 billion in 2025 rising to $2.27 billion in
              2030 at 24.5% CAGR, while Emergen says hospitals represented about 55% of global demand in 2024. Finally,
              the installed-base lens looks at Aidoc itself: 150+ health systems in the 2025 CARE financing release,
              nearly 2,000 hospitals in the 2026 Series E materials, and verified enterprise deployments at Hartford and
              Asklepios. Those figures show that the market is real and that Aidoc already occupies meaningful share
              within the subset of enterprise-ready buyers. What they do not reveal is price per hospital, module, or
              study. That missing pricing data is why the report uses low/base/high proxy ranges instead of pretending
              to know a clean revenue pool for every hospital or service line.
