      - number: '1.4'
        title: Scale signals, named customers, and regulatory milestones
        blocks:
          - type: paragraph
            body: >-
              Aidoc’s public scale claims are now large enough that the company should be analyzed as an enterprise
              deployment story rather than a pilot-stage vendor. The 2025 CARE financing release said Aidoc supported
              more than 45 million patients a year across 150+ health systems and expected that figure to reach 100
              million within three years. The 2026 Series E materials moved the disclosed scale higher still, claiming
              more than 60 million annual patient cases, more than 110 million patient cases analyzed cumulatively, and
              deployment across nearly 2,000 hospitals. Those numbers are self-reported, but the supporting customer
              proof is stronger than it was in earlier rounds. Asklepios disclosed a 28-hospital rollout across Germany
              with roughly 35,000 CT and X-ray images analyzed monthly, while Hartford HealthCare said Aidoc’s
              17-algorithm deployment reached go-live in three weeks and spanned millions of patient exams. The
              regulatory record is also tangible rather than purely narrative. FDA K213721 shows a 2022 clearance for
              brain aneurysm triage, and K231631 shows a 2023 CAC quantification clearance. Aidoc’s 2025 and 2026 press
              releases then move from indication-by-indication clearances toward foundation-model framing: first a
              rib-fractures clearance on CARE1, then a comprehensive body CT triage clearance that groups 11 new
              indications with three existing ones into one workflow. That combination of customer proof and regulatory
              throughput is the core reason later chapters can treat Aidoc as a scaled clinical-AI infrastructure
              company instead of a single-product startup.
