  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Scale, geography and customer footprint
        blocks:
          - type: paragraph
            body: >
              Aidoc’s public customer story has two layers: a broad scale narrative and a narrower set of directly named
              proof

              points. At the broadest level, 2025 independent coverage from Healthcare IT Today, Fierce Healthcare,
              MedCity News

              and HLTH repeated company-reported figures of more than 45 million patients annually across 150+ health
              systems.

              Aidoc’s April 2026 official and PRNewswire releases then described nearly 2,000 hospitals, more than 60
              million cases

              analyzed per year and more than 110 million total cases analyzed. Those are clearly large numbers, but
              they are not

              interchangeable denominators: hospitals, health systems, annual patients and annual cases all measure
              different aspects

              of adoption.


              The geography of named proof tilts toward large U.S. integrated delivery networks and one major European
              private

              operator. Fetched public sources directly confirm Hartford HealthCare, Mercy, Sutter Health, WellSpan,
              Yale New

              Haven, Renown Health / Carson Tahoe, Temple Health, Advocate Health and Asklepios. Independent articles
              also name

              Mount Sinai, Northwell and University of Miami as partners or users, but those appear more as scale
