      - number: '4.4'
        title: 'Verdict: strong demand signal, weaker underwriting file'
        blocks:
          - type: paragraph
            body: >
              On current evidence, Aidoc's financial profile is stronger than that of an early-stage algorithm vendor
              but weaker than that of an underwritable late-stage software company. The 2025 financing, 2026 Series E,
              and broad deployment claims suggest meaningful market pull and reduce immediate distress risk.
              Post-Series-E news flow also stayed active, with Aidoc highlighting new customer deployments, European
              product expansion, and a nationally prominent CMO hire rather than signaling retrenchment. The product
              footprint, integration depth, and enterprise packaging are all consistent with recurring,
              high-switching-cost software. Public comp transactions in adjacent AI diagnostics—Viz.ai's unicorn
              financing, Roche's PathAI deal, and Tempus's acquisition of Paige—also show that strategic buyers and
              growth investors are willing to pay for workflow plus data plus model assets.


              But the file is still incomplete on every metric that matters most to a financial buyer. Revenue, ARR,
              gross margin, burn, cash, debt, CAC, payback, and NRR are all undisclosed. Public pricing is opaque. The
              company's own total-funding figures conflict across official releases. And the post-2024 record still does
              not publicly confirm a numeric valuation or current unicorn status. The right financial stance is
              therefore constructive on commercialization quality and platform relevance, but explicitly cautious on
              margin path, valuation support, and capital adequacy until management opens the books.
