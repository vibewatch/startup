      - number: '5.2'
        title: CARE foundation model and solution breadth
        blocks:
          - type: paragraph
            body: >
              CARE (Clinical AI Reasoning Engine) is Aidoc’s bid to move from single-condition algorithms to a reusable
              clinical

              foundation model. Aidoc’s foundation-model page says CARE is trained on real-world multimodal data,
              spanning not

              just imaging but also text, EHR fields, labs and vitals. The January 2026 body-CT clearance is the
              strongest public

              proof point that this model is no longer conceptual. Aidoc’s official release and an independent
              Diagnostic Imaging

              summary both state that the clearance combined 11 newly cleared indications with three previously cleared

              indications into one workflow, creating a 14-indication body-CT triage product.


              The FDA’s K252970 summary adds the most concrete technical detail. The cleared device is BriefCase-Triage:
              CARE

              Multi-triage CT Body, a workflow-triage and notification product for contrast and non-contrast CT of the
              chest,

              abdomen and pelvis. The 11 new findings listed in the FDA documentation are diverticulitis,
              abdominal-pelvic

              abscess, appendicitis, intestinal ischemia/pneumatosis, obstructive renal stone, small bowel obstruction,
              large bowel

              obstruction, spleen injury, liver injury, kidney injury, and pelvic fracture. Aidoc’s release also
              reported mean

              sensitivity of 97% and mean specificity of 98% across the 11 new indications in its FDA-reviewed study.


              Outside the comprehensive body-CT clearance, Aidoc’s product pages show the clinical breadth of the
              existing stack.

              The neuro page bundles vessel occlusion, CT perfusion, brain aneurysm, intracranial hemorrhage, C-spine
              fracture

              and vertebral compression fracture workflows. The VTE page goes beyond pulmonary embolism into incidental
              PE,

              DVT and IVC-filter management. The aortic page combines acute aortic dissection triage with aneurysm
              follow-up.

              Together those pages support a real workflow portfolio around PE, ICH, aortic dissection, fractures and
              cervical-spine

              findings. What remains less clear is the current official aggregate portfolio count: public sources
              support breadth,

              but Aidoc’s own site does not publish a reconciled total.
