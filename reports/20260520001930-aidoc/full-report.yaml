      - number: '5.3'
        title: Integration, orchestration and enterprise deployment
        blocks:
          - type: paragraph
            body: >
              Aidoc’s product claims consistently emphasize integration into the systems where clinicians already work.
              The aiOS,

              VTE and aortic pages all describe PACS, EHR and mobile delivery, with care coordination layered on top of
              imaging

              triage. The VTE page is especially explicit: aiOS ingests multimodal data, routes alerts into PACS, EHR
              and mobile

              workflows, and exposes labs, vitals, image review and PERT communication in the same operating layer. The
              aortic

              page makes a similar claim for cross-department chat, mobile review and EHR-connected care activation.


              The FDA summary shows the regulatory boundary around this design. K252970 is a workflow triage and
              notification

              product, not diagnostic software; users remain responsible for reading full images in PACS and using
              professional

              judgment. That boundary matters because it explains how Aidoc has been able to embed AI deeply into
              operational

              workflows while still positioning the software as a prioritization and coordination layer rather than an
              autonomous

              diagnostic agent.


              Deployment evidence indicates Aidoc can support more than one operating model. The FDA summary describes a

              Linux-based server in a cloud environment for the CARE body-CT clearance. Aidoc’s AWS page markets a
              HIPAA-

              compliant enterprise deployment on AWS, while the Asklepios rollout says the implementation followed a
              secure,

              cloud-based approach with an on-prem aiOS platform to satisfy GDPR and existing radiology-system
              constraints.

              Taken together, the public record supports a configurable cloud-plus-enterprise-integration model rather
              than a

              single immutable deployment architecture.
