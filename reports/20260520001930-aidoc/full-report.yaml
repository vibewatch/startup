      - number: '3.2'
        title: Direct clinical-AI peers
        blocks:
          - type: paragraph
            body: >
              Viz.ai is the clearest like-for-like competitor because it combines image-triggered detection with
              downstream care-team mobilization and has already scaled into large health-system deployments. It markets
              more than 50 FDA-cleared algorithms, positions itself as a care coordination platform rather than a
              single-use tool, and has public evidence of unicorn-scale fundraising. That makes Viz.ai the most direct
              benchmark for whether Aidoc can keep acute-care coordination differentiated as more vendors add algorithm
              breadth.


              Enlitic and Annalise/Harrison.ai compete differently. Their messaging emphasizes imaging-data
              normalization, workflow efficiency, and broad finding coverage rather than systemwide care coordination.
              Nanox.AI/Zebra sits in another adjacent lane again: it combines AI and software with a broader
              imaging-network and hardware agenda. These peers matter because they can pressure Aidoc on modality
              breadth, algorithm count, or hospital workflow embedding even if they do not fully replicate Aidoc's
              cross-specialty operating-layer story.
