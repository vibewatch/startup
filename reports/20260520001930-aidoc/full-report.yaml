      - number: '4.2'
        title: Capital history is visible, but valuation support remains incomplete and internally inconsistent
        blocks:
          - type: paragraph
            body: >
              Aidoc's latest financing record is far more current than its disclosed operating metrics. The company said
              in 2023 that a $110 million Series D brought total funding to $250 million. In 2025, a PRNewswire release
              described a $150 million financing plus a $40 million revolving credit facility and said total funding was
              $370 million. Then, in April 2026, Aidoc and Goldman Sachs said a $150 million Series E brought total
              funding to over $500 million. Taken individually, each announcement is clear on the new round. Taken
              together, the cumulative totals do not reconcile cleanly, which means the safest way to model capital
              raised is round-by-round, not by trusting headline lifetime-funding tallies.


              Valuation evidence is even thinner. Calcalist reported that the 2025 round was raised at a valuation
              higher than the prior round, while Globes said the company would not disclose either revenue or the round
              valuation. That leaves the post-2024 record supportive of momentum but insufficient for a numeric
              fair-value call. In practical terms, public evidence does not currently confirm a precise Aidoc valuation
              or current unicorn status, even after the 2026 Series E.
