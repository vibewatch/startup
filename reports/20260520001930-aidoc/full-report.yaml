      - number: '3.3'
        title: Pathology entrants and workflow incumbents
        blocks:
          - type: paragraph
            body: >
              PathAI and Paige are not radiology-first, but they matter because they compete for the same enterprise AI
              budget and governance attention. Both pitch pathology foundation models, workflow tools, and large data
              assets; both also became acquisition targets in 2025-2026, underscoring how strategic the
              workflow-plus-model layer has become. Their relevance to Aidoc is not that a pathology suite can replace
              acute radiology triage, but that hospital executives increasingly evaluate AI as an operating-layer
              decision spanning service lines.


              The more durable distribution threat comes from incumbent imaging-IT vendors. Nuance/Microsoft, Sectra,
              Fujifilm, AGFA, GE, and Intelerad all market AI deployment as an extension of existing imaging
              infrastructure, often emphasizing single-contract onboarding, cloud PACS, or embedded orchestration rather
              than individual algorithms. Once hospitals believe the workflow layer should host multiple third-party
              models, incumbents gain leverage from installed base, procurement familiarity, and control over
              integrations that Aidoc still must win account by account.
