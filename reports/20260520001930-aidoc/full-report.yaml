      - number: '2.4'
        title: Drivers, constraints, and reimbursement reality
        blocks:
          - type: paragraph
            body: >-
              Three demand drivers recur across the evidence base. First, workforce pressure is real: AAMC still
              projects a broad physician shortage into 2036, while Neiman HPI and ACR say the radiologist shortage
              persists and that attrition accelerated materially after 2020. Second, imaging demand keeps rising:
              Neiman’s demand study projects another 16.9% to 26.9% increase in imaging utilization by 2055, and the
              older population is a disproportionate consumer of imaging. Third, category growth remains strong:
              MarketsandMarkets still projects 24.5% CAGR for the global radiology-AI market through 2030. Against those
              tailwinds, the clearest constraint is reimbursement. The peer-reviewed reimbursement paper and Radiology
              Business article both make the same point from different angles: most imaging AI tools do not have
              separate paid CPT codes, and only a tiny number of newer imaging-AI procedures have reached Category I
              status. That forces ROI to come from throughput, avoided misses, reduced repeats, or better downstream
              care management rather than a clean one-to-one payment stream. Regulatory burden is the second constraint.
              FDA’s action-plan and PCCP materials show that adaptive medical AI still needs disciplined change control,
              monitoring, and documentation. The third constraint is integration friction: hospitals need systems that
              fit old PACS/RIS/EHR environments, not just high standalone algorithm accuracy.
            claimRefs:
