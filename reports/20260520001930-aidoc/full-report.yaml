  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Aidoc should be analyzed inside the radiology AI workflow market first, then extended into adjacent
              care-coordination and cross-specialty orchestration layers. The official radiology page is explicit that
              the company’s value starts with triage, prioritization, quantified findings, and follow-up activation
              inside imaging workflows. The care-coordination page then broadens the lens from radiologist productivity
              to multidisciplinary decision support, especially for urgent cases like pulmonary embolism where timing,
              communication, and follow-up management matter as much as image interpretation. This boundary excludes
              generic EHR vendors, imaging hardware OEM revenue, billing software, and most consumer-facing
              digital-health tools, even though those systems remain integration dependencies. It also means broad “AI
              in healthcare” TAM claims overstate relevance unless they can be translated into radiology or
              acute-workflow budgets. MarketsandMarkets and Emergen Research are still useful because they confirm that
              hospitals are the largest radiology-AI buyers and that CT-centric, workflow-heavy use cases dominate
              current spending. But the chapter treats those reports as category ceilings, not as direct proxies for
              Aidoc’s capture. The important analytical move is to define Aidoc’s real market as enterprise workflow
              software attached to imaging, triage, and downstream care activation—not all diagnostic AI, and definitely
              not all healthcare IT.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
