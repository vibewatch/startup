      - number: '8.4'
        title: Bull, base, and bear valuation ranges
        blocks:
          - type: paragraph
            body: >-
              Because the current private price is undisclosed, the right scenario frame is exit value rather than
              current intrinsic value. In a bull case, Aidoc converts its current enterprise traction and
              foundation-model story into several hundred million dollars of recurring revenue while retaining a premium
              healthcare-AI multiple. That can support a mid-single-digit-billion exit range. In a base case, Aidoc
              proves itself as a valuable but not exceptional healthcare workflow platform, which points to a lower
              single-digit-billion outcome. In a bear case, reimbursement friction, EHR-native competition, or weak
              monetization from current rollouts push Aidoc down toward the 1x-4x public-healthcare-IT corridor.


              The scenario logic is not that Aidoc must fail to deserve a lower valuation; it is that good companies can
              still underperform premium private pricing if capital markets normalize faster than operating proof
              arrives. That is especially true in a 2025-2026 digital-health market that Rock Health and Cooley both
              describe as concentrated and selective. The right question is not “Can Aidoc be worth a lot?” It is “What
              revenue and quality bar must Aidoc clear before a premium mark is defensible?”
            claimRefs:
