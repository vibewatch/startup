      - number: '7.3'
        title: Partner, platform, and competition risk
        blocks:
          - type: paragraph
            body: >-
              Aidoc’s operating model is deeply intertwined with outside platforms. That is partly a strength: the
              company says aiOS is vendor-agnostic, integrated across PACS/VNA/EHR workflows, and available inside Epic
              App Orchard, which is exactly the kind of workflow credibility hospitals want. Aidoc also has an AWS
              collaboration backed by multiyear investment to develop its CARE foundation model. These relationships
              reduce go-to-market friction and make Aidoc look more enterprise-grade than a narrow algorithm vendor.


              The same relationships create concentration risk. If Epic changes its posture, if OEM or reseller channels
              underperform, or if AWS economics shift, Aidoc’s deployment motion weakens quickly. Competitive intensity
              is also rising from inside the incumbent stack: Microsoft markets Dragon and Azure AI for Epic
              environments, Oracle markets a clinical AI agent for documentation and workflow, and Epic itself positions
              AI as embedded throughout its software. Aidoc can still win if hospitals value acute-imaging triage and
              cross-team orchestration enough to buy a dedicated layer, but that is a pricing-power question, not a
              guaranteed moat. The practical conclusion is that Aidoc’s partner posture is an important mitigation, yet
              it should be treated as an exposure map first and a moat second.
            claimRefs:
              - CR018
