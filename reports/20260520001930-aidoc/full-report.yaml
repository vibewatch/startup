  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and status-quo alternatives
        blocks:
          - type: paragraph
            body: >
              Aidoc does not compete in a single neatly bounded category. Its product stack starts with regulated
              radiology triage, extends into aiOS orchestration, and then reaches into care coordination and downstream
              follow-up. That means the real comparison set includes direct clinical-AI peers like Viz.ai,
              infrastructure-first imaging vendors like Enlitic and Nanox.AI, pathology-adjacent foundation-model
              players like PathAI and Paige, and incumbent imaging-IT vendors that already own PACS, archiving, routing,
              and security review. Independent industry coverage reinforces that hospitals are increasingly buying for
              workflow integration and enterprise value rather than for isolated point algorithms.


              The status quo remains powerful. ACR's ARCH-AI program frames imaging-AI deployment as an ongoing
              governance and quality-assurance discipline, not just a software purchase. Radiology Business likewise
              argues that many health systems still struggle to justify AI unless it improves enterprise operations
              beyond radiology. In practice, that means existing PACS, worklists, and in-house governance remain real
              substitutes for Aidoc, especially when a hospital can add AI incrementally on top of incumbent
              infrastructure instead of replacing its workflow layer.
            claimRefs:
