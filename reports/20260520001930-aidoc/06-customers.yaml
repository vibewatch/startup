  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Public NRR, GRR, renewal and churn data for Aidoc’s installed base.
      whyItMatters: Customer quality cannot be underwritten from public deployment stories alone without durability data.
      diligencePath: Request retention cohorts by deployment vintage and module mix, plus logo-retention data for top accounts.
      relatedQuestionRefs: [QU019]
      relatedTableRefs: [TU005]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Public disclosure of top-customer concentration, ARR share or exam-volume concentration.
      whyItMatters: Large health systems can create material concentration risk even when the public footprint looks broad.
      diligencePath: Request top-5 and top-10 customer share of ARR, contracted cases and expansion pipeline.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU006]
    - type: missing-source
      severity: minor
      topic: proof-scope-gap
      missingEvidence: Direct confirmation for requested marquee names such as NYU Langone, Mayo Clinic and URMC.
      whyItMatters: Public investors and diligence teams should not overstate marquee-logo density beyond what fetched direct sources confirm.
      diligencePath: Ask Aidoc for a current referenceable customer list identifying which logos can be named publicly.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU003, TU006]
    - type: private-evidence-only
      severity: material
      topic: footprint-scale
      missingEvidence: An audited reconciliation between hospital, health-system, patient and case-based footprint metrics.
      whyItMatters: Aidoc’s public scale story is strong but denominator-shifting makes it hard to compare current customer breadth over time.
      diligencePath: Request a current customer-footprint bridge that maps logos to hospitals, annual cases and active workflows.
      relatedQuestionRefs: [QU021, QU025]
      relatedTableRefs: [TU002]
