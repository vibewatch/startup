  - id: outcomes-and-usage
    title: Quantified outcomes and workflow adoption evidence
    body: |
      Aidoc’s best public outcome evidence comes from workflow acceleration and care-escalation metrics rather than from
      contract or revenue metrics. Yale New Haven’s PE response story is especially useful because it ties Aidoc to a
      clinically consequential outcome: about 40% more appropriate advanced therapy use and roughly 70% of potential
      activations surfaced that would otherwise have been missed. Cedars-Sinai appears on Aidoc’s VTE page as another
      quantified site, with a 7-hour (41%) reduction in time-to-treatment and a 26% reduction in length of stay for PE care.

      Renown Health / Carson Tahoe add a stroke-network example: a 32-minute reduction in door-in-door-out time and
      roughly 30% faster large-vessel-occlusion transfer after around six months. Mercy’s public deployment story adds
      operational scale metrics rather than care-episode percentages, including 2.4 million images analyzed, 249,000 flagged
      studies and a 90% reduction in outpatient time-to-diagnosis. WellSpan’s CEO also cited more than 200,000 cases
      analyzed in one year. These are all meaningful workflow proofs, but they are heterogeneous. Some are company-run
      case studies, some are site-provided internal data, and none substitutes for standardized cross-customer cohorts.
    claimRefs:
      - CU010
      - CU013
      - CU014
      - CU016
      - CU017
      - CU019
      - CU027
      - CU033
      - CU036
    tableRefs:
      - TU004
  - id: expansion-and-durability
    title: Expansion signals, stickiness and durability gaps
    body: |
      Public customer evidence suggests Aidoc often lands as a platform layer and then expands across additional service
      lines. Sutter’s announcement emphasizes multi-year infrastructure and co-development rather than a one-off algorithm.
      Hartford’s announcement talks about a 12-month path toward fuller enterprise implementation. Mercy’s own story says
      platform standardization is what let it scale beyond a few isolated AI tools. Healthcare IT Today and Fierce both quote
      Aidoc’s claim that 69% of customers already run non-Aidoc models on aiOS, implying that buyers may increasingly be
      treating Aidoc as the governance and orchestration layer for a multi-vendor AI estate.

      That platform-stickiness story is directionally positive, but public durability proof is still thin. There is no disclosed net
      revenue retention, gross retention, logo retention or renewal cohort data in the fetched sources. There is likewise no
      public concentration disclosure showing whether a small number of enterprise systems represent outsized ARR or case
      volume. So while the public footprint suggests Aidoc can expand inside complex systems, the classic SaaS durability
      metrics needed for underwriting customer quality remain absent.
    claimRefs:
      - CU003
      - CU024
      - CU025
      - CU029
      - CU030
      - CU031
      - CU032
      - CU037
    tableRefs:
      - TU005
  - id: adoption-caveats
    title: Customer adoption caveats and adverse signals
    body: |
      The main caution is that scale claims are partly real and partly narrative-dependent. “150+ health systems,” “45M
      patients,” “nearly 2,000 hospitals” and “60M cases per year” all sound like customer-count statements, but they are
      not measuring the same thing. Public sources also differ in how directly they prove customer relationships. Hartford,
      Mercy, Asklepios, Sutter and Yale are strong fetched references; Cedars-Sinai is a workflow study site; Temple is an
      executive buyer testimonial; and media lists of Mount Sinai, Northwell or University of Miami provide weaker proof
      than a detailed case study.

      The clearest adverse public source in the fetch set is ITQlick, which flags expensive enterprise implementation,
      limited pricing transparency and integration burden for smaller practices. That source is low-reputation and itself uses
      AI assistance, so it should be treated as a weak cautionary signal rather than a decisive negative. More important than
      the directory review is what public sources do not show: no renewal cohorts, no concentration table, and no direct
      confirmation in fetched sources for some user-requested names such as NYU Langone, Mayo Clinic or the University
      of Rochester Medical Center. Those are diligence gaps, not disproofs.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU028
      - CU029
      - CU035
