  - id: named-customer-proof
    title: Named deployments and reference quality
    body: |
      The strongest named enterprise deployment evidence in fetched sources is Hartford HealthCare. Aidoc’s official
      launch announcement and HIT Consultant both say Hartford reached initial go-live in three weeks, deployed 17
      FDA-cleared algorithms across millions of exams and expanded across radiology, cardiology, vascular, neurology and
      emergency workflows. Mercy is the clearest multi-site implementation reference: Aidoc’s public stories describe aiOS
      running across all 50 Mercy facilities, with over a dozen use cases launched simultaneously and millions of images
      already analyzed.

      Beyond those two, Sutter Health publicly described a multi-year strategic collaboration that embeds aiOS across its
      care system and designates Sutter as Aidoc’s West Coast hub. Asklepios gives Aidoc an important Europe proof point,
      with 28 hospitals live and about 35,000 CT and X-ray images analyzed monthly. Yale New Haven is one of the best
      quantified service-line case studies because the pulmonary embolism response workflow is described with specific
      advanced-therapy and missed-activation metrics. Renown/Carson Tahoe and Temple Health show that Aidoc’s public
      proof is not limited to radiology-only messaging: the company is selling hub-and-spoke stroke orchestration and
      enterprise AI operating-system value to executive buyers.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
