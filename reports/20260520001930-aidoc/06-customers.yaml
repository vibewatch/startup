callouts:
  - calloutType: strength
    title: Strategic health-system investors strengthen reference quality
    body: |
      Hartford, Mercy, Sutter and WellSpan are not just named customers in public materials; they also participated in the
      2025 financing round. That matters because it suggests some of Aidoc’s most visible customers have moved beyond a
      vendor relationship into deeper strategic alignment with the platform roadmap.
    claimRefs:
      - CU003
      - CU005
      - CU012
      - CU019
  - calloutType: insight
    title: The best public proof is multi-site workflow adoption, not logo density
    body: |
      Mercy, Hartford and Asklepios show why Aidoc’s strongest public customer signal is deployment depth across sites and
      workflows. The company’s public list of named health systems is meaningful, but the truly differentiating evidence is
      where those systems show rapid implementation, multi-service-line usage or measurable workflow gains.
    claimRefs:
      - CU005
      - CU009
      - CU011
      - CU031
  - calloutType: risk
    title: Customer scale is impressive, but retention and concentration remain opaque
    body: |
      Public sources support a large installed base, yet they do not disclose renewal, churn, NRR, GRR or customer
      concentration. Without those metrics, an investor can see adoption momentum but cannot fully underwrite durability or
      the degree of dependence on a small number of large systems.
    claimRefs:
      - CU024
      - CU025
      - CU029
