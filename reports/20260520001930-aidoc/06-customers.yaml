chapter:
  number: 6
  title: Customers
  summary: >-
    Aidoc’s public customer proof is strongest at enterprise health systems that deploy aiOS as a workflow and governance
    layer rather than as a single algorithm, with Hartford HealthCare, Mercy, Sutter, Asklepios and Yale New Haven the
    clearest fetched examples. Independent 2025 media repeated company-reported scale figures of 150+ health systems
    and 45M patients served annually, while Aidoc’s 2026 releases shifted the denominator to nearly 2,000 hospitals and
    60M cases analyzed per year. The installed-base story is therefore impressive but metric-dependent, and public
    retention, renewal and concentration data remain absent.
sections:
  - id: customer-scale-and-footprint
    title: Scale, geography and customer footprint
    body: |
      Aidoc’s public customer story has two layers: a broad scale narrative and a narrower set of directly named proof
      points. At the broadest level, 2025 independent coverage from Healthcare IT Today, Fierce Healthcare, MedCity News
      and HLTH repeated company-reported figures of more than 45 million patients annually across 150+ health systems.
      Aidoc’s April 2026 official and PRNewswire releases then described nearly 2,000 hospitals, more than 60 million cases
      analyzed per year and more than 110 million total cases analyzed. Those are clearly large numbers, but they are not
      interchangeable denominators: hospitals, health systems, annual patients and annual cases all measure different aspects
      of adoption.

      The geography of named proof tilts toward large U.S. integrated delivery networks and one major European private
      operator. Fetched public sources directly confirm Hartford HealthCare, Mercy, Sutter Health, WellSpan, Yale New
      Haven, Renown Health / Carson Tahoe, Temple Health, Advocate Health and Asklepios. Independent articles also name
      Mount Sinai, Northwell and University of Miami as partners or users, but those appear more as scale references than
      as fully documented deployment case studies. The best reading is that Aidoc has broad platform reach and meaningful
      reference-customer density, but a much thinner publicly disclosed customer list than the raw 150+ or 2,000+ scale
      metrics might imply.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU018
      - CU019
