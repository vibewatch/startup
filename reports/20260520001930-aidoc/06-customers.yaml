figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Aidoc’s public customer stories show a repeat journey from executive sponsorship and reference proof to enterprise IT
      integration, live acute-care workflows and multi-service-line expansion.
    approximationNotes: >-
      Journey stages are inferred from public customer stories and executive interviews, not from a company-published sales
      funnel or renewal process map.
    data:
      nodes:
        - id: pain
          label: Clinical and operational pain becomes acute
          detail: Backlogs, missed findings, transfer delays, workforce shortage and fragmented AI-tool sprawl
        - id: sponsor
          label: Executive and clinical sponsorship forms
          detail: CEO, chief digital officer, imaging leader or service-line champion aligns on workflow problem
        - id: proof
          label: Reference proof and ROI scrutiny
          detail: Buyer reviews Hartford, Mercy, Yale, Sutter, Temple or similar proof before purchase
        - id: integrate
          label: Contracting and enterprise integration
          detail: PACS/EHR/mobile integration and workflow configuration; trust and governance reviewed
        - id: live
          label: Production go-live
          detail: Multi-site or service-line rollout begins and acute-care teams start receiving alerts and care-coordination support
        - id: expand
          label: Expansion and platform governance
          detail: Additional use cases, service lines and third-party models are added if value is proven
    claimRefs:
      - CU005
      - CU009
      - CU011
      - CU015
      - CU030
      - CU031
