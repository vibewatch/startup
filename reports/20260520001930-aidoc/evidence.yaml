evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-footprint
    missingEvidence: >-
      A current official corporate contact or legal page that explicitly states Aidoc’s headquarters structure across
      New York and Tel Aviv.
    whyItMatters: >-
      Headquarters and control location affect jurisdiction, go-to-market assumptions, and refresh-to-refresh identity
      consistency.
    diligencePath: >-
      Fetch an official legal/contact page or corporate registry filing that states the operating headquarters and legal
      entity address.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: current-fda-cleared-count
    missingEvidence: >-
      A current official product matrix or regulatory listing that states one stable, up-to-date count of Aidoc
      FDA-cleared solutions.
    whyItMatters: >-
      Public sources reference 15, 17, 31, and “several dozen” counts, which affects competitive framing and KPI
      consistency.
    diligencePath: >-
      Export Aidoc’s current FDA-cleared product list from the FDA database or a current Aidoc product-information page
      with a dated count.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: unicorn-valuation
    missingEvidence: >-
      A post-2024-05-20 financing source that discloses the valuation attached to Aidoc’s most recent growth round or
      Series E.
    whyItMatters: >-
      Without a disclosed valuation, the report cannot confirm that Aidoc remains a private unicorn despite its funding
      scale.
    diligencePath: Obtain an investor deck, term-sheet summary, or credible press report that states the round valuation.
    relatedQuestionRefs:
      - QO013
