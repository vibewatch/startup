  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-succession
    missingEvidence: Board composition, delegated operating structure, formal succession plan, and executive-depth map beyond Ali Agha.
    whyItMatters: Key-person risk cannot be sized confidently without knowing how much customer trust, technical sign-off, and operating control sit with the founder alone.
    diligencePath: Request board materials, executive-org charts, succession planning, and delegated decision rights under NDA.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: blocking
    topic: safety-and-compliance-readiness
    missingEvidence: Formal safety-case package, EU/U.S. compliance mapping, customer deployment sign-offs, incident logs, and third-party certification artifacts.
    whyItMatters: Regulatory and incident risk cannot be underwritten for safety-critical robotics without documentary proof of compliance and operating controls.
    diligencePath: Request conformity matrices, hazard analyses, certification records, and incident-response documentation for representative deployments.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-and-concentration
    missingEvidence: Recognized-revenue bridge, customer concentration schedule, pilot-versus-production ledger, and expansion-contract accounting treatment.
    whyItMatters: Commercial risk may be materially worse if headlines about expansion or multi-million-dollar contracts overstate recurring revenue quality.
    diligencePath: Request audited or CFO-certified revenue schedules and top-customer concentration by contract type and geography.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: benchmark-and-ip-depth
    missingEvidence: Independent technical benchmarks, intervention-rate and uptime data, plus a full freedom-to-operate and broader IP portfolio review.
    whyItMatters: The thesis depends on both technical superiority and defensibility; today public evidence proves neither at investment-grade depth.
    diligencePath: Request benchmark studies, reliability dashboards, FTO memo, and patent prosecution roadmap.
    relatedQuestionRefs:
    - QR014
    - QR016
    relatedTableRefs:
    - TR001
    - TR002
