- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Customer-opacity risk
    - Named customer proof growth
    - No additional independent named accounts or quantified outcomes over next 12 months
    - Shift from monitorable execution risk to structural go-to-market concern
  - - Preference-stack / financing risk
    - New round economics
    - Down-round, heavy structure, or investor terms that validate common-equity overhang
    - Treat current valuation as structurally fragile
  - - Regulatory readiness risk
    - Compliance evidence
    - Failure to produce safety-case or EU/U.S. conformity mapping for active deployments
    - Assume deployment velocity will compress as scrutiny rises
  - - Ecosystem dependence on NVIDIA
    - Platform power shift
    - New NVIDIA-backed peers receive materially stronger channel, tooling, or branding leverage
    - Increase discount for dependency and competitive squeeze
  - - Reliability risk
    - Operational KPI disclosure
    - Incident, low uptime, or no benchmark release despite scale claims
    - Re-rate product maturity downward
  - - Execution strain
    - Deployment-support burden
    - Headcount and field-support needs rise faster than recurring revenue proof
    - Treat business as services-heavy rather than software-like
  notes: Kill criteria are intentionally concrete so that a future refresh can test whether the risk vector improved or worsened.
