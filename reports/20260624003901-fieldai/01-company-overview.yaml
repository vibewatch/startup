  - id: funding-and-investors
    title: "Funding History, Investor Map, and Capital Position"
    body: >-
      FieldAI raised $405 million across two consecutive rounds announced on August 20, 2025.
      The most recent tranche — a $314 million Series A-1 — was co-led by Bezos Expeditions
      (Jeff Bezos's personal investment office), Prysm Capital, and Temasek. The earlier
      tranche was a Series A that included Gates Frontier, Samsung, Khosla Ventures, and Canaan
      Partners. The August 2025 rounds were described as oversubscribed, with FieldAI noting
      that most investor approaches came inbound. The combined $2B post-money valuation
      represents a roughly 4× step-up from the approximately $500M valuation set in the
      prior Series A round in 2024. Both rounds were priced equity rounds rather than bridge
      notes, as described in Reuters and TechCrunch coverage.

      Notable investor dynamics include NVIDIA's venture arm NVentures participating alongside
      an existing technology collaboration, creating strategic alignment between FieldAI's
      NVIDIA Omniverse integration and financial incentive. Intel Capital and BHP Ventures
      (mining conglomerate) add domain-specific industrial credibility. Emerson Collective
      (Laurene Powell Jobs's philanthropy/investment vehicle) and Canaan Partners round out the
      cap table. Bill Gates wrote a public blog endorsement of FieldAI's approach, describing
      the company's mission of developing AI software for other companies' robots that enables
      them to perceive their environments and navigate without GPS.

      Latka reported $140M ARR as of June 2025, and the OC Business Journal cited informal
      sources saying the company has "more than $100M in booked revenue and partnerships."
      Neither figure is independently verified. The UpsideList independent analysis estimates a
      $506M preference stack against the $2B headline valuation (approximately 25.3% of equity),
      and assigns a 50% probability to a bear scenario in which common equity is wiped if NVIDIA
      or Boston Dynamics internalize comparable capabilities. No audited financials, cap table,
      or debt/credit facility details have been disclosed.
