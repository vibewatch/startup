  - id: milestones-and-partnerships
    title: "Milestone Timeline and Strategic Partnerships"
    body: >-
      FieldAI's technical lineage traces directly to DARPA and NASA programs led by its
      founders. Team CoSTAR's 2020 DARPA SubT Urban Circuit win demonstrated, for the first
      time, fully autonomous many-kilometer exploration by a quadruped robot and coordinated
      multi-robot operations with up to 11 heterogeneous robots in GPS-denied underground
      environments. This achievement provided the foundational proof of concept that underpins
      FieldAI's commercial FFM architecture.

      The company was formally founded in 2023 after Dr. Agha left JPL, and entered its first
      commercial deployments with construction, energy, and security customers while operating
      in stealth. Significant milestones since August 2025 include: the NVIDIA Omniverse
      collaboration deepening the training data pipeline (August 2025); Ali Agha's keynote at
      RoboBusiness 2025 (October 2025); the Boston Dynamics partnership to deploy Spot-based
      quadruped fleets in construction sites (March 2026); and the Ouster Rev8 lidar
      collaboration for GPS-denied industrial perception (June 2026). The Boston Dynamics
      partnership is particularly significant: FieldAI plans to create one of the largest
      third-party Spot quadruped fleets in the world, with customers already expanding from
      Asia to Europe to North America at enterprise scale, and Boston Dynamics citing a 90%+
      reduction in inspection and documentation time.

      No safety incidents, product liability claims, or regulatory investigations involving
      FieldAI or its deployments appeared in public records as of June 2026, based on review
      of news coverage and third-party analyst reports. No lawsuits, IP disputes, or regulatory
      enforcement actions against FieldAI were identified. These absences are informative but
      should not be taken as a clean bill of health without direct regulatory and legal due
      diligence. The OCBJ reported that FieldAI has been recognized by Fast Company as one of
      the Top 10 Most Innovative AI companies, and the company has a robust pipeline of
      strategic partnerships including Boston Dynamics, NVIDIA, and Ouster Inc.
