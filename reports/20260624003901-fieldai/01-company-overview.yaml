company:
  name: FieldAI

chapter:
  number: 1
  title: Company Overview
  summary: >-
    FieldAI is a 2023 Irvine, California startup led by ex-NASA JPL roboticist Ali Agha that
    raised $405M across Series A and A-1 rounds in August 2025 to achieve a $2B unicorn valuation,
    backed by Bezos Expeditions, Khosla Ventures, NVIDIA, Gates Frontier, Temasek, and others.
    Its Field Foundation Models (FFMs) deliver hardware-agnostic autonomy software deployed on
    hundreds of industrial sites across three continents, though undisclosed customer names,
    unaudited financials, and a $506M preference stack introduce meaningful diligence gaps.

sections:
  - id: identity-and-model
    title: "Company Identity, Product, and Business Model"
    body: >-
      FieldAI, formally incorporated in 2023 and headquartered in Irvine, California, positions
      itself as a "brain company" — a pure-software provider of autonomous intelligence for
      third-party robot hardware. The company builds Field Foundation Models (FFMs), a proprietary
      class of physics-first, risk-aware foundation models designed from the ground up for
      embodied robotics rather than retrofitted from language or vision models. FFMs enable robots
      of any form factor — quadrupeds, humanoids, wheeled machines, and passenger-scale vehicles —
      to operate safely and autonomously in unstructured, GPS-denied, unmapped environments. The
      platform makes deployment decisions entirely on-edge, requiring no cloud connectivity, a key
      differentiator for remote industrial and federal applications where latency and connectivity
      are constraints.

      The business model is software-as-a-service: FieldAI licenses its autonomy platform
      (branded EDGE) to enterprise customers who own or procure third-party robot hardware.
      The company does not build robot hardware, a deliberate choice that keeps capital requirements
      lower and total addressable market broader than vertically integrated competitors such as
      Figure AI. Pricing spans a wide range from approximately $3,000 to over $500,000 per
      deployment depending on robot type, site scale, and mission complexity. Target verticals
      include construction, energy and mining, manufacturing, urban delivery and inspection, and
      federal and defense. The company operates a dedicated federal subsidiary, FieldAI Federal,
      serving government and defense customers.

      By June 2026, FieldAI claims production deployments spanning thousands of missions across
      hundreds of sites on three continents (North America, Europe, Asia-Pacific), positioning it
      as the leader in general-purpose robot deployments among industrial AI software companies.
      The NVIDIA Omniverse collaboration allows each customer deployment to feed a real-world data
      flywheel that accelerates model improvement, creating a compounding operational advantage
      the company argues is difficult for later entrants to replicate. FieldAI's hardware-agnostic
      approach distinguishes it from Boston Dynamics (hardware-and-software vertically integrated)
      and from Physical Intelligence (pi.ai), which also targets hardware-agnostic manipulation.
