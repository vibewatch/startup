  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: >-
        Audited revenue, ARR, and bookings figures from a financial statement or
        investment bank fairness opinion tied to the August 2025 round.
      whyItMatters: >-
        The $2B valuation cannot be assessed on a revenue multiple without verified ARR.
        The $140M Latka estimate and $100M+ OCBJ informal figure are insufficient for
        underwriting at any enterprise valuation standard.
      diligencePath: >-
        Request audited financials or management accounts for 2024 and H1 2025 directly from
        FieldAI CFO Duncan McIntyre; ask for recurring vs. one-time revenue breakdown and
        retention metrics.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO001]

    - type: private-evidence-only
      severity: blocking
      topic: customer-names
      missingEvidence: >-
        At least three named customer references with verifiable contract values and deployment
        dates in construction, energy, or manufacturing.
      whyItMatters: >-
        Without named customers, revenue traction cannot be independently verified and
        go-to-market claims cannot be assessed for concentration risk or churn.
      diligencePath: >-
        Request named customer list and case studies with at least two independent reference
        calls from enterprise customers; negotiate an NDA if needed for identity disclosure.
      relatedQuestionRefs: [QO004]

    - type: private-evidence-only
      severity: material
      topic: board-composition
      missingEvidence: >-
        Full board of directors membership with investor-appointed seats, independent directors,
        and advisory board composition as of June 2026.
      whyItMatters: >-
        Board composition drives governance quality, fiduciary oversight, and investor alignment.
        No public source confirms board seats or investor representative rights for any round.
      diligencePath: >-
        Review California or Delaware corporate filings; request governance documents (charter,
        bylaws, investor rights agreement) from FieldAI General Counsel.
      relatedQuestionRefs: [QO005]
      relatedTableRefs: [TO002]

    - type: private-evidence-only
      severity: material
      topic: preference-stack
      missingEvidence: >-
        Full capitalization table with liquidation preferences, anti-dilution provisions,
        participation rights, and board voting rights from the August 2025 rounds.
      whyItMatters: >-
        The $506M preference stack estimate from UpsideList suggests significant downside
        for common equity holders. Without the actual cap table, investment risk cannot be
        sized accurately for any downstream investor.
      diligencePath: >-
        Request capitalization table and investor rights agreement from FieldAI CFO; compare
        liquidation preference terms against standard Series A/A-1 market norms.
      relatedQuestionRefs: [QO012]

    - type: missing-source
      severity: material
      topic: secondary-transactions
      missingEvidence: >-
        Any records of secondary equity sales, tender offers, or insider liquidity events
        between the 2024 Series A and June 2026.
      whyItMatters: >-
        Secondary sales provide market-based price discovery and indicate insider sentiment
        about the company's long-term trajectory. Absence of disclosure makes it impossible
        to assess whether insiders are gaining or reducing exposure.
      diligencePath: >-
        Request transfer register from company counsel; check public secondary platforms
        (Forge, SharesPost) for FieldAI listing activity.
      relatedQuestionRefs: [QO015]

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table
      missingEvidence: >-
        Complete list of FieldAI milestones including any adverse events, governance changes,
        regulatory filings, or undisclosed product launches not captured in public press releases.
      whyItMatters: >-
        The milestone table (TO004) is documented as partial coverage; undisclosed events
        such as regulatory approvals, internal reorgs, or adverse incidents could be material
        to the company's trajectory assessment.
      diligencePath: >-
        Request board minutes, key contract execution log, and internal milestone tracking
        from FieldAI management; cross-check against any SEC or state filings.
      relatedQuestionRefs: [QO011]
      relatedTableRefs: [TO004]

