callouts:
  - calloutType: strength
    title: "Elite Founder-Market Fit from DARPA and NASA"
    body: >-
      Ali Agha's direct leadership of DARPA SubT, DARPA RACER, and NASA Mars programs, combined
      with Shayegan Omidshafiei's Google DeepMind foundation model expertise, creates an unusually
      deep alignment between the founding team's prior accomplishments and FieldAI's core
      commercial mission. No peer robotics software company has founders with comparable
      field-proven multi-robot GPS-denied autonomy experience at scale.
    claimRefs:
      - CO010
      - CO011
      - CO014

  - calloutType: risk
    title: "No Named Customers and Unaudited Revenue Claims"
    body: >-
      FieldAI has not disclosed the identity of any customers despite claims of dozens of large
      enterprise deployments across three continents. The $140M ARR estimate (Latka) and $100M+
      booked revenue signal (OCBJ informal) cannot be verified from public filings. This creates
      a material gap between the $2B valuation multiple and independently verifiable revenue, and
      is the single most critical diligence gap for any equity investor.
    claimRefs:
      - CO024
      - CO025
      - CO036

  - calloutType: risk
    title: "Preference Stack Concentration Risk"
    body: >-
      UpsideList's independent analysis estimates a $506M preference stack against the $2B
      headline valuation (approximately 25.3% of equity). In a bear-case scenario where a
      larger partner internalizes competing capabilities or the company faces a down round,
      common equity could be fully wiped. This structural risk is not reflected in the headline
      $2B figure and is material for any common-equity investor or employee optionholder.
    claimRefs:
      - CO026
      - CO027

  - calloutType: strength
    title: "Hardware-Agnostic Model Maximizes Total Addressable Market"
    body: >-
      By choosing not to build robot hardware, FieldAI can deploy across any OEM platform and
      target the full industrial robotics market rather than a segment tied to one hardware form
      factor. The EDGE platform's demonstrated deployment across quadrupeds, humanoids, wheeled
      robots, and passenger vehicles confirms the breadth of the addressable market opportunity.
    claimRefs:
      - CO001
