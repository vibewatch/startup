  topStrengths:
    - 市场位置独特：物理优先、不依赖 GPS、硬件无关的自主系统，已经在三大洲数百个生产现场落地；截至 2026 年中，没有纯基础模型同行能匹配这组证明。
    - 投资人阵容罕见：Bezos、Gates、Khosla、NVIDIA、Temasek、Intel Capital、Samsung 带来资金、战略合作和分销渠道。
    - NVIDIA 投资与 Omniverse 集成，再加上 Boston Dynamics Spot 认证，给 FieldAI 补上持久的硬件层背书和分销护城河。
    - 创始人 Ali Agha 有 NASA JPL 与 DARPA Subterranean 背景，给 FieldAI 带来软件型 AI 实验室很难复制的领域权威和政府市场入口。
    - 联邦子公司 FieldAI Federal 打开了防御性强、资本门槛高的联邦机器人市场，多数直接竞争对手难以进入。
  topRisks:
    - 收入质量无法核验：Latka 给出的 $140M ARR 与 Compworth 约 $5M 的估计彼此冲突；没有审计财务，$2B 估值倍数无法支撑。
    - 优先股压力悬在上方：UpsideList 估计优先股权益为 $506M，高于 $405M 累计融资；若退出估值持平或下行，投资人的下行保护可能挤压普通股。
    - 商业化超过 2 年仍没有具名客户，「数百个现场」说法能否经住独立尽调，需要打问号。
    - 对手资本更厚：Physical Intelligence（$11B）和 Skild AI（$14B）各自拥有 FieldAI 5-7 倍资源，可投入模型训练、研究和开发者生态。
    - 关键人集中：CEO Ali Agha 是唯一公开门面，又同时扛技术和商业牵引；一旦流失，冲击会很大。
  unresolvedGaps:
    - 审计财务：已确认 ARR、毛利率、烧钱速度、现金余额和现金跑道都未公开，阻碍财务承销。
    - 具名客户访谈：公司声称数百个现场有数百万美元合同，但没有公开披露任何企业客户。
    - 优先股堆叠细节：具体清算优先权、参与上限和反稀释条款未披露；UpsideList 的 $506M 估计需要验证。
    - 低于 100ms 的边缘推理说法：没有独立基准或第三方验证发布，目前只靠公司自述支撑。
    - FieldAI Federal 合同管线：没有披露联邦机构名称、合同金额或安全许可级别；这对评估防务市场上行空间很关键。
