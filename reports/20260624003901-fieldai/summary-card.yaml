  topStrengths:
    - >-
      Unique market position: physics-first, GPS-free, hardware-agnostic autonomy with real production deployments
      (hundreds of sites) across three continents — unmatched by any pure-play foundation model peer as of mid-2026.
    - >-
      Exceptional investor syndicate (Bezos, Gates, Khosla, NVIDIA, Temasek, Intel Capital, Samsung) providing capital,
      strategic partnerships, and distribution channels.
    - >-
      NVIDIA partnership (investment + Omniverse integration) and Boston Dynamics Spot certification provide durable
      hardware-layer credibility and distribution moat.
    - >-
      Founder Ali Agha's NASA JPL DARPA Subterranean heritage gives FieldAI domain authority and government-market
      access that software-only AI labs cannot easily replicate.
    - >-
      Federal subsidiary (FieldAI Federal) opens a defensible and capital-intensive federal robotics market inaccessible
      to most direct competitors.
  topRisks:
    - >-
      Revenue quality unverifiable: $140M ARR (Latka) vs ~$5M (Compworth) estimates are incompatible; without audited
      financials, the $2B valuation multiple cannot be justified.
    - >-
      Preference overhang: UpsideList estimates $506M in preferred equity vs $405M total raised, implying investor
      downside protection could impair common equity in a flat/down exit.
    - >-
      No named customers after 2+ years of commercial operation raises questions about whether "hundreds of sites"
      claims can withstand independent diligence.
    - >-
      Capital-superior rivals: Physical Intelligence ($11B) and Skild AI ($14B) each have 5-7× FieldAI's resources to
      invest in model training, research, and developer ecosystems.
    - >-
      Key-person concentration: CEO Ali Agha is the sole public face; loss would be highly disruptive given his role as
      the technical and commercial lead.
  unresolvedGaps:
    - >-
      Audited financials: confirmed ARR, gross margin, burn rate, cash position, and runway not publicly available;
      blocking for financial underwriting.
    - >-
      Named customer references: no publicly disclosed enterprise customers despite claimed multi-million-dollar
      contracts across hundreds of sites.
    - >-
      Preference stack details: exact liquidation preferences, participation caps, and anti- dilution terms are
      undisclosed; UpsideList estimate of $506M requires verification.
    - >-
      Sub-100ms edge inference claim: no independent benchmark or third-party verification published; claim rests solely
      on company assertions.
    - >-
      FieldAI Federal contract pipeline: no federal agency names, contract values, or clearance levels disclosed;
      critical for assessing defense-market upside.
