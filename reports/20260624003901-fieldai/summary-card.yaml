summary:
  headline: >-
    FieldAI is the most credibly-differentiated pure-play industrial robotics foundation model company, but revenue
    quality is unverifiable and multiple key diligence gates remain open; a conditional "research-more" stance is
    warranted until audited financials and customer references emerge.
