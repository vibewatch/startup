companyProfile:
  summary: >-
    FieldAI (founded 2023, Irvine CA) develops Field Foundation Models (FFMs), physics-first AI software that enables
    any robot — humanoid, quadruped, wheeled, or aerial — to operate autonomously in GPS-denied, unmapped, unstructured
    industrial environments. The company's EDGE platform runs at sub-100ms edge latency with no cloud dependency during
    operation, and is deployed commercially across construction, manufacturing, energy, and logistics verticals in the
    US, Europe, and Japan. FieldAI raised $405M ($91M Series A + $314M Series A-1) from Bezos Expeditions, Khosla
    Ventures, NVIDIA NVentures, Temasek, Intel Capital, Samsung, Gates Frontier, and Canaan Partners, achieving a $2B
    valuation in August 2025. The company also operates a federal subsidiary (FieldAI Federal) for defense and
    government contracting.
  foundedDate: '2023-01-01'
  founders:
    - name: Ali Agha
      role: CEO and Co-Founder
      background: >-
        Former lead scientist at NASA JPL; led the DARPA Subterranean Challenge autonomous robotics team; 15+ years
        building ground autonomy systems for extreme environments.
      claimRefs:
        - CO002
    - name: Shayegan Omidshafiei
      role: Co-Founder
      background: >-
        Former research scientist at Google DeepMind; PhD in multiagent reinforcement learning from MIT; research
        background in multi-robot coordination.
      claimRefs:
