  foundingLocation: Irvine, CA, USA
  headquarters: Irvine, CA, USA
  productSummary: >-
    EDGE Autonomy Platform powered by Field Foundation Models (FFMs) and the Belief World Model (BWM). The platform
    provides GPS-free navigation, multi-robot fleet management, physics-first risk-aware autonomy, and NVIDIA Omniverse
    digital-twin integration. Deployed via multi-year RaaS (Robotics-as-a-Service) enterprise contracts on Boston
    Dynamics Spot, humanoids, UAVs, wheeled vehicles, and other robotic form factors.
  customerFocus: >-
    Large industrial enterprises in construction, energy infrastructure, manufacturing, logistics, and defense; also
    security (Certis) and government (Detroit Defense, FieldAI Federal).
  businessModel: >-
    Multi-year Robotics-as-a-Service (RaaS) enterprise contracts; no hardware sold; revenue from software licensing,
    edge inference, fleet management, and continuous model updates.
  stage: Series A-1
  fundingStatus: >-
