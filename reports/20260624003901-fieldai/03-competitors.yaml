  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Proprietary operational data flywheel from 100s of deployments
        - Physical Intelligence / Skild AI accumulate large teleoperation datasets faster via open ecosystem
        - High
        - Verify data exclusivity; confirm no third-party data-sharing clauses in robot OEM contracts
      - - Physics-first architecture advantage in unstructured environments
        - General VLA models may reach parity as compute and data scale
        - Medium
        - Benchmark FFM vs π0 / Skild Brain on FieldAI-specific benchmarks; is the advantage measurable?
      - - Multi-year RaaS contract lock-in
        - Buyers may switch to open-source PI model with lower integration cost
        - Medium
        - Disclose contract terms, renewal rates, churn data; confirm net dollar retention
