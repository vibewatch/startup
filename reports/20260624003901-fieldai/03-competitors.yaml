company:
  name: FieldAI
chapter:
  number: 3
  title: Competitive Landscape
  summary: >-
    FieldAI competes in the emerging robotics foundation model segment against Physical Intelligence
    ($11B valuation), Skild AI ($14B valuation), Intrinsic (Google), Brain Corp, Covariant, Exyn
    Technologies, Figure AI, and incumbent automation vendors. FieldAI's differentiation rests on
    physics-first edge inference for unstructured industrial environments, a hardware-agnostic
    deployment model, and verified real-world deployments at scale — advantages that pure-research
    labs and humanoid-focused startups currently lack. However, Physical Intelligence and Skild AI
    are well-capitalized, broad-scope rivals whose omni-bodied architectures closely mirror FieldAI's
    strategic vision, and both are raising capital at valuations 5–7× FieldAI's current level.

sections:
  - id: SP01
    title: Direct Foundation-Model Competitors
    body: >-
      FieldAI's most proximate competitors are the three other pure-play robotics foundation model
      providers: Physical Intelligence (San Francisco, $11B valuation, March 2026), Skild AI
      (Pittsburgh, $14B valuation, January 2026), and Google DeepMind's Gemini Robotics stack.
      All three pursue hardware-agnostic, generalizable models that can drive diverse robot
      morphologies — matching FieldAI's core positioning. Physical Intelligence's π0 series and
      Skild AI's Brain model are open-source or broadly available, which lowers the barrier for
      robot OEMs to adopt an alternative to FieldAI's EDGE platform. Google DeepMind's Gemini
      Robotics-ER 1.6, folded into Google's enterprise infrastructure via Intrinsic's integration
      in February 2026, adds distribution power no startup can match. The key differentiator FieldAI
      claims is an industrial unstructured-environment focus and physics-first model architecture,
      versus PI and Skild's more general-purpose, laboratory-derived VLA approaches. FieldAI
      also emphasizes real, production deployments on hundreds of sites across three continents,
      while Physical Intelligence and Skild AI are still largely in pilot or pre-production stages
      for industrial use cases. FieldAI's edge-inference sub-100ms latency claim and GPS-free,
      map-free operation in hazardous environments remain unmatched claims among direct peers.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
    tableRefs:
      - TP001
      - TP002
    figureRefs:
      - FP001

  - id: SP02
    title: Incumbent and Adjacent Software Competitors
    body: >-
      Brain Corp (San Diego, ~$221M raised, ~$117M revenue 2026) operates BrainOS, the leading
      commercial robotics autonomy OS, deployed in over 10,000 robots globally via OEM partners led
      by Tennant Company. Brain Corp's strength lies in commercial-scale deployment and distribution
      through Tennant's global sales force, but it is limited to structured, indoor, map-dependent
      environments — the exact use cases FieldAI is designed to transcend. Covariant (Berkeley,
      ~$222M raised, $2.7B prior valuation) built an AI pick-and-place "robot brain" platform but
      suffered a reverse acqui-hire by Amazon in September 2024 that gutted its leadership team;
      it continues under new management but faces strategic uncertainty. Intrinsic (now part of
      Google, as of February 2026) offers Flowstate, a no-code robotics platform targeting
      manufacturing and logistics. Intrinsic's integration into Google means access to enterprise
      distribution, cloud infrastructure, and DeepMind's AI stack — a combination that poses a
      long-term platform competition risk to FieldAI. Exyn Technologies (Philadelphia, IPO May 2026,
      ~$57M raised) provides high-autonomy aerial robotics for GPS-denied mining environments; it
      overlaps with FieldAI in underground/industrial inspection but is hardware-specific (aerial
      only) and smaller-scale. Viam Robotics offers a developer-oriented robotics platform with
      broad hardware support, competing at the software layer; Figure AI ($1.9B raised, $39B
      valuation) and Agility Robotics lead the humanoid-hardware tier, which overlaps with FieldAI's
      humanoid-compatibility claim but is hardware-specific rather than software-layer competition.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP011
