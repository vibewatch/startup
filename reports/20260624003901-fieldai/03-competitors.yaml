  - id: SP03
    title: Feature and Pricing Comparison
    body: >-
      Among the robotics-AI platform peers, pricing varies significantly: Physical Intelligence
      charges ~$300/month/robot (SaaS), Brain Corp is primarily OEM-partnership revenue-sharing,
      Intrinsic/Flowstate targets enterprise licensing, and FieldAI uses multi-million-dollar
      multi-year RaaS contracts. FieldAI's contract model implies higher near-term commitment from
      buyers but also higher switching cost and revenue predictability. On capability dimensions,
      FieldAI leads on GPS-free outdoor/underground autonomy and multi-robot fleet management in
      unstructured environments; Physical Intelligence and Skild AI lead on manipulation dexterity
      and cross-morphology generalization trained on large teleoperation datasets; Brain Corp leads
      on installed-base scale in indoor structured environments. No competitor publicly claims
      sub-100ms edge inference in GPS-denied outdoor environments. In the federal segment, FieldAI
      Federal is the only foundation-model competitor with a declared defense and government
      contracting presence among robotics software providers; Exyn serves the US DoD but is
      hardware-specific.
    claimRefs:
      - CP016
      - CP017
      - CP018
      - CP019
      - CP020
      - CP021
    tableRefs:
      - TP003
    figureRefs: []

  - id: SP04
    title: Moat Durability and Competitive Risk
    body: >-
      FieldAI's competitive moats are data network effects (proprietary operational data from
      hundreds of deployments feeds FFM improvement, widening generalization edges over time),
      contract lock-in (multi-year RaaS contracts in regulated sectors like construction and energy
      carry high switching costs), and reference customer density (deployed at scale globally while
      peers remain in limited pilots). However, these moats face three structural risks.
      First, Physical Intelligence and Skild AI are each raising capital at 5–7× FieldAI's
      current valuation, enabling them to scale research teams and compute faster. Second,
      open-source releases (Physical Intelligence's π0.5) enable low-cost alternatives for buyers
      who can tolerate higher integration effort. Third, NVIDIA's Isaac GR00T and Omniverse platform
      — in which FieldAI is a partner — could transition from enabler to competitor if NVIDIA
      decides to productize its simulation and inference stack directly. A further adverse signal:
      FieldAI has not disclosed named enterprise customers despite 2+ years of operation, limiting
      independent verification of deployed-at-scale claims. Overall, FieldAI's competitive position
      is well-differentiated for 2026 industrial verticals but at risk from resource-superior peers
      over a 3–5 year horizon, particularly if general-purpose foundation models prove sufficient
      for industrial tasks without physics-first specialization.
    claimRefs:
