evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: >-
      Audited revenue, ARR, and bookings figures from a financial statement or investment bank fairness opinion tied to
      the August 2025 round.
    whyItMatters: >-
      The $2B valuation cannot be assessed on a revenue multiple without verified ARR. The $140M Latka estimate and
      $100M+ OCBJ informal figure are insufficient for underwriting at any enterprise valuation standard.
    diligencePath: >-
      Request audited financials or management accounts for 2024 and H1 2025 directly from FieldAI CFO Duncan McIntyre;
      ask for recurring vs. one-time revenue breakdown and retention metrics.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: customer-names
    missingEvidence: >-
      At least three named customer references with verifiable contract values and deployment dates in construction,
