- id: comparables-and-multiple-cross-check
  title: Comparable Set and Multiple Cross-Check
  body: |-
    FieldAI’s comparables are real but impure. Physical Intelligence and Skild AI are the closest narrative peers because both are funded as broad embodied-AI foundation-model plays, yet both are private, fast-moving, and themselves arguably marked on option value rather than on traditional software proof. Figure AI sits at a much higher valuation but is meaningfully more hardware-heavy and humanoid-centric. Covariant is a closer robotics-software precedent on paper, but public financial visibility is still incomplete. Brain Corp is commercially mature, yet it sits in a different part of the autonomy market with cleaning and enterprise-service economics rather than general field autonomy.

    That means the comp exercise can only triangulate, not conclude. The helpful part is directional: FieldAI is materially cheaper than the highest-flying embodied-AI names, which protects against the most obvious overpricing critique. The unhelpful part is that those peers may themselves be frothy. Public-company and filing-backed comps such as Tennant highlight the contrast: mature automation businesses disclose revenue, gross margin, and operating plans. FieldAI does not. So the right use of the comp set is not to declare the company cheap or expensive in absolute terms, but to show how much of the current $2B price is still a bet on future category leadership rather than a bet on transparent current economics.
  claimRefs:
