- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue-quality miss
    - CFO-certified ARR or recognized revenue lands far below venture narrative
    - Destroys premium-multiple logic and raises cap-table risk
    - Move from conditional toward pass
  - - Customer-proof stagnation
    - No new independent named customers or quantified outcomes within 12 months
    - Confirms traction breadth is too thin for current price
    - Assume market narrative is outrunning reality
  - - Structured down-round
    - Next round includes heavy preferences, anti-dilution, or lower headline price
    - Common-equity return math becomes structurally adverse
    - Treat current mark as financially fragile
  - - Compliance / safety failure
    - Material incident, failed audit, or inability to furnish safety-case documents
    - Weakens both customer trust and exit readiness
    - Re-rate product maturity downward
  - - Ecosystem squeeze
    - NVIDIA-backed peers gain materially stronger platform leverage or channel access
    - FieldAI’s relative bargaining power and premium multiple compress
    - Raise required return or step away
  notes: These triggers are intentionally binary because the current public record leaves little room for soft interpretation on the missing variables.
