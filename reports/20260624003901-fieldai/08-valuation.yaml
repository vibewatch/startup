  - Revenue estimates conflict too sharply to underwrite current multiple with confidence
  - Preference overhang and structured downside could impair common-equity returns
  - Customer, retention, and compliance proof remain too thin for a clean premium valuation call
chapter:
  number: 8
  title: Valuation
  summary: 'FieldAI’s public valuation case is binary: if the $140M ARR estimate is roughly right, the company looks expensive but defensible for an embodied-AI leader; if the low-single-digit revenue estimate is closer to truth, the $2B mark is extreme. Because customer breadth, recognized revenue quality, and exact downside terms remain unverified, the most supportable stance is not invest or pass, but conditional and valuation-unverifiable.'
sections:
- id: current-price-and-evidence-quality
  title: Current Valuation and Evidence Quality
  body: |-
    The directly corroborated part of the valuation story is simple: FieldAI raised roughly $405M and was marked at $2B in August 2025. Everything after that gets messier. GetLatka estimates about $140M ARR, while CompWorth’s public profile points to only about $5M of revenue, and neither figure is management-certified. UpsideList adds a different kind of caution by estimating roughly $506M of preferred overhang and highlighting how much downside structure may already sit above common. In other words, price is visible, but quality of the underlying denominator is not.

    That distinction drives the entire chapter. A private company can justify a high headline valuation if it has fast compounding revenue, strong customer retention, and manageable downside terms. Public evidence does not yet let FieldAI clear those bars. The company has real strengths—capital, strategic investors, deployment proof, and a compelling product narrative—but the public record does not say whether investors are paying 14x ARR for a frontier-AI leader or roughly 400x revenue for an under-disclosed startup. That is why the appropriate valuation stance begins with evidence quality, not with a neat multiple comparison.
