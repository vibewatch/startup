  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-revenue-quality
    missingEvidence: CFO-certified ARR, recognized revenue, bookings-to-revenue bridge, and revenue-recognition policy by stream.
    whyItMatters: This single gap determines whether FieldAI is priced at a plausible frontier-AI multiple or at an extreme revenue multiple unsupported by fundamentals.
    diligencePath: Request audited or CFO-certified trailing-12-month revenue, ARR, and bookings-to-revenue reconciliation under NDA.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-stack-terms
    missingEvidence: Full cap table, preferred seniority, liquidation preference multiples, participation rights, and anti-dilution mechanics.
    whyItMatters: Common-equity return can be very different from enterprise-value growth when late-stage preference structures are heavy.
    diligencePath: Request the full cap table, charter, and investor-rights documents and model the waterfall across valuation outcomes.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV002
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: Top-customer concentration, renewal schedule, NRR / churn, direct-versus-channel revenue mix, and named customer expansion cohorts.
    whyItMatters: Without concentration and retention data, even a high ARR figure may not translate into a durable multiple-worthy business.
    diligencePath: Request customer concentration schedules, cohort retention, contract terms, and revenue mix by direct and partner-led accounts.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV004
    - TV006
