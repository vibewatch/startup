verdict:
  recommendation: conditional
  confidence: medium
  riskRating: high
  valuationStance: unverifiable
  summary: FieldAI has enough product and deployment strength to remain investable in principle, but the current public record cannot prove whether the $2B price reflects a frontier-AI bargain or a narrative-heavy mark. A conditional stance is appropriate until management closes the gap on audited revenue, customer concentration, and cap-table downside terms.
  keyStrengths:
