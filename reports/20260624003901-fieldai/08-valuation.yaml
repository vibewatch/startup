- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR / revenue quality
    - CFO-certified ARR, recognized revenue, and bookings-to-revenue bridge
    - Determines whether multiple is ~14x or ~400x-like
    - Management / CFO under NDA
  - - Cap table and preferences
    - Full preferred-stack terms, liquidation preferences, anti-dilution, and seniority waterfall
    - Common-equity return may differ radically from enterprise-value outcome
    - Company counsel + lead investors
  - - Customer concentration and retention
    - Top-customer concentration, renewal schedule, NRR / churn, and direct-vs-channel revenue split
    - Tests durability of the business model and concentration risk
    - Revenue operations + finance
  - - Safety and compliance readiness
    - Deployment safety-case package and Europe / federal compliance map
    - Necessary for exit readiness and scalable deployment confidence
    - Product, safety, and legal teams
  - - Comparable benchmarking
    - Independent performance, margin, and deployment benchmarks versus peers
    - Helps distinguish category-leader premium from narrative inflation
    - Third-party diligence or specialist advisor
  notes: These are the minimum diligence asks required to move the recommendation from conditional toward a true invest or pass decision.
