    - Could support $3B-$5B follow-on valuation or higher exit if FieldAI becomes a category leader
    - Execution complexity, capital arms race, and compliance burden still matter
    - Possible but requires multiple unproven disclosures to break right
  - - Base
    - Current valuation broadly holds, but only after management closes revenue-quality and concentration gaps under NDA
    - Little near-term multiple expansion; return depends on disciplined entry terms and proof conversion
    - Evidence quality remains mixed and customer breadth narrow
    - Most supportable public-evidence case today
  - - Bear
    - Recognized revenue disappoints, customer breadth stays opaque, or next round introduces more structure and less proof
    - Down-round or structured financing can eliminate common upside despite enterprise growth
    - Preference stack, concentration, and competitor spending power compound downside
    - Public-data downside case remains very live
  notes: Scenarios are not model outputs; they are underwriting frames constrained by conflicting secondary data and limited public financial disclosure.
