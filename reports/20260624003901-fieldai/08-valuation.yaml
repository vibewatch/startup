- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - FieldAI could become the autonomy OS for messy real-world robotics
    - Would justify premium software-like economics and strategic scarcity
    - Need audited ARR growth, lower implementation burden, and wider named customer set
  - - Hardware-agnostic deployments create cross-robot leverage
    - Could support better capital efficiency than vertically integrated robot OEMs
    - Need proof that partner dependence does not cap margins or bargaining power
  - - Current valuation may already discount category leadership
    - If true, upside from this price could be limited even if the company succeeds
    - Need entry discipline or structure that compensates for evidence risk
  - - Revenue-quality uncertainty could make the entire multiple exercise invalid
    - If low-single-digit revenue is closer to reality, downside is severe
    - Need recognized-revenue bridge and renewal / expansion quality data
  - - Preference stack could absorb future downside before common participates
    - Return outcomes depend on structure, not just enterprise value growth
    - Need full cap-table and liquidation-preference stack with anti-dilution terms
  notes: The anti-thesis is dominated by evidence quality rather than by a single product failure. That is why additional diligence can still change the recommendation meaningfully.
