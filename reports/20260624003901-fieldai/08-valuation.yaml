- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public valuation / status
  - Revenue or denominator
  - Implied read-through for FieldAI
  - Limitation
  rows:
  - - FieldAI
    - ~$2B valuation after $405M raised
    - 'Revenue estimates conflict: ~$140M ARR vs ~$5M revenue'
    - Sets the current underwriting problem directly
    - Underlying denominator is unverified
  - - Physical Intelligence
    - ~$11B valuation in 2026 fundraising discussions
    - No clean public revenue disclosure
    - Shows frontier embodied-AI marks can price well above FieldAI
    - Peer may itself be valuation-rich and not a clean anchor
  - - Skild AI
    - '>$14B valuation after $1.4B raise'
    - No meaningful public revenue disclosure in release
    - Shows capital markets reward general-purpose robotics narratives at much higher marks
    - Does not prove FieldAI is cheap if peer is also frothy
  - - Figure AI
    - ~$39B valuation, pre-commercial humanoid scale story
    - Pre-commercial / limited public economics
    - Upper-bound hardware-heavy AI comp only
    - Too hardware-centric and valuation-extreme for direct multiple use
  - - Covariant
    - ~$2.7B valuation / IPO-status reference
    - Revenue not cleanly public in current source set
    - More software-like robotics precedent than humanoid plays
    - Still not a clean, fully disclosed public comp
  - - Brain Corp / Tennant context
    - Public-company / enterprise autonomy context with disclosed planning cadence
    - Public-company filing context exists, but Brain Corp is not a direct disclosed standalone public comp
    - Useful reminder that mature automation comps disclose real financials
    - Different vertical and economics from FieldAI
  notes: The table is intentionally mixed because no single clean public comparable exists. It is better read as a triangulation set than as a formula for exact multiples.
