- id: scenario-sensitivity-and-breakpoints
  title: Scenario Sensitivity, Downside Structure, and Break Triggers
  body: |-
    The sensitivity math is brutally simple because public data is so sparse. If GetLatka’s $140M ARR estimate is directionally right and FieldAI can continue converting deployments into durable software-like revenue, the current valuation compresses into a premium but recognizable frontier-AI multiple. If the low-revenue read is closer to truth, then the current mark only works as a financing event, not as an underwriting result. Venture-market context matters here: Carta, Cooley, Whitepage, and Equidam all point to a bifurcated 2025-2026 funding market where AI leaders can still raise enormous rounds, but down rounds, recapitalizations, and preference protections remain active when fundamentals disappoint.

    That means downside is not symmetric. A company can hold a high paper valuation longer than public-market logic would imply, but if the next financing forces a reset, the preference stack determines who actually participates in the upside and who is left with narrative-only marks. For FieldAI, the thesis breaks if management cannot substantiate revenue quality, if customer disclosure does not widen, or if the next round validates the preference-overhang concern with more structure instead of more proof. The bull case is still real, but it requires far more data than the current public record provides.
