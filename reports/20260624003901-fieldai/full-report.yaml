      - number: '6.2'
        title: Adoption Trajectory, Retention Signals, and Reference Quality
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is materially better than public retention evidence. On adoption, DPR offers the
              richest metrics: more than 45,000 photos, more than 100 miles walked, 500,000 square feet of interior
              coverage, 125,000 square feet of roofing, and roughly 1.5 years of operation on a named site. Big-D offers
              the clearest expansion signal, moving from more than two years of testing into broader operational
              rollout. Boston Dynamics adds the strongest anonymous scale-up evidence by saying some construction
              customers now deploy daily, have cut inspection and documentation time by more than 90%, and have expanded
              pilots into fleet-wide programs.


              Reference quality is mixed but usable. Big-D's Shaun Orr is a named C-level executive with 25 years at the
              contractor, which is unusually strong authority for a construction-automation reference even though the
              quote appears in company-linked coverage. DPR's Justin Schreiner is closer to the work, offering concrete
              operational details at superintendent level. Certis provides current corporate-level proof through named
              executive statements, but public outcomes are still qualitative. What is missing across all three is the
              classic SaaS durability layer: NRR, renewal rate, churn, contract term, or customer satisfaction metrics.
              That means the report can validate real usage and expansion behavior, but not durable recurring economics
              per logo.
