            title: Preference Stack Concentration Risk
            body: >-
              UpsideList's independent analysis estimates a $506M preference stack against the $2B headline valuation
              (approximately 25.3% of equity). In a bear-case scenario where a larger partner internalizes competing
              capabilities or the company faces a down round, common equity could be fully wiped. This structural risk
              is not reflected in the headline $2B figure and is material for any common-equity investor or employee
              optionholder.
