  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Connects FieldAI’s real strengths to the verification gaps that force a conditional rather than outright positive
      or negative call.
    data:
      nodes:
        - id: s1
          label: Strong product + deployment signals
        - id: s2
          label: Large capital base + strategic investors
        - id: g1
          label: Conflicting revenue denominators
        - id: g2
          label: Opaque preferences / concentration / retention
        - id: d1
          label: Conditional recommendation
        - id: d2
          label: Valuation stance = unverifiable
      edges:
        - from: s1
          to: d1
          label: prevents immediate pass
        - from: s2
          to: d1
          label: supports further work
        - from: g1
          to: d1
          label: blocks invest
        - from: g2
          to: d1
          label: raises risk
        - from: d1
          to: d2
          label: price unresolved
    approximationNotes: The logic map is an underwriting abstraction rather than a literal decision tree used by management.
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV031
      - CV039
      - CV040
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The investment case is overwhelmingly sensitive to which revenue denominator is true and whether downside
      structure bites.
    data:
      items:
        - label: Higher ARR estimate (~$140M)
          value: 5
          detail: Lower negative sensitivity because ~14.3x ARR can fit frontier-AI pricing if durable.
        - label: Low revenue estimate (~$5M)
          value: 10
          detail: Highest sensitivity because ~400x revenue would be extreme.
        - label: Preference overhang
          value: 8
          detail: High downside sensitivity because structure can cap common returns.
        - label: Customer / retention proof gap
          value: 9
          detail: Very high sensitivity because valuation depends on proving durable demand.
        - label: Comparable re-rating risk
          value: 6
          detail: Material sensitivity because peer froth can compress quickly in private markets.
    approximationNotes: This is a qualitative sensitivity bar because public evidence is insufficient for a clean quantitative model.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV021
      - CV022
      - CV036
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a wide outcome band because denominator quality, structure, and execution all remain
      unresolved.
    data:
      items:
        - label: Bear enterprise-value range
          low: 0.8
          high: 1.5
          unit: USD B
          detail: Down-round or structured financing if revenue quality disappoints or proof remains thin
        - label: Base enterprise-value range
          low: 1.8
          high: 2.5
          unit: USD B
          detail: Current mark broadly holds only if management can substantiate revenue quality under diligence
        - label: Bull enterprise-value range
          low: 3
          high: 5
          unit: USD B
          detail: Requires audited ARR growth, wider named customers, and compliance-ready scaling
        - label: Common-equity outcome range
          low: 0
          high: 2.5
          unit: USD B residual to common
          detail: Residual depends heavily on preference waterfall and next-round terms
        - label: Implied revenue multiple band
          low: 14.3
          high: 400
          unit: x revenue
          detail: Represents the current public high-low denominator conflict
    approximationNotes: >-
      Ranges are analytical and not market quotes. The common-equity line is especially sensitive to hidden preference
      and anti-dilution terms.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV023
      - CV024
      - CV026
      - CV028
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style snapshot of what is strong versus what remains unverified in the current public record.
    data:
      items:
        - label: Headline valuation
          value: $2B
          detail: Publicly corroborated by CNBC, Reuters, and FieldAI
        - label: Capital raised
          value: $405M
          detail: Strong balance-sheet support for continued execution
        - label: Revenue confidence
          value: Low
          detail: Public estimates diverge sharply between $140M ARR and ~$5M revenue
        - label: Customer-proof depth
          value: Medium-Low
          detail: Real deployments exist, but breadth and retention remain under-disclosed
        - label: Structure risk
          value: High
          detail: Preference overhang can impair common returns
        - label: Recommendation
          value: Conditional
          detail: Needs finance-quality diligence before underwriting price
    approximationNotes: KPI labels are summary judgments rather than audited metrics.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV021
      - CV031
      - CV040
