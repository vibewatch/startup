        - Constraint (−)
        - Ongoing
        - Creates lumpy revenue, high working capital requirements, large-account concentration risk
        - Confirm distribution of contract sizes and customer concentration
      - - Chinese physical AI platform development (100K–1M unit capacity build-out)
        - Constraint (−)
        - Medium-term (2026–2028)
        - Chinese domestic AI may produce price-competitive alternatives for non-US/EU markets
        - Assess FieldAI's international IP protection and trade secret policies
