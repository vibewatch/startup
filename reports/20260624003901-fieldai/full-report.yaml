              By choosing not to build robot hardware, FieldAI can deploy across any OEM platform and target the full
              industrial robotics market rather than a segment tied to one hardware form factor. The EDGE platform's
              demonstrated deployment across quadrupeds, humanoids, wheeled robots, and passenger vehicles confirms the
              breadth of the addressable market opportunity.
