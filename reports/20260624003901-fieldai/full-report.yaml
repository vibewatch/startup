      - number: '7.2'
        title: People, Partner, and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Ali Agha is simultaneously founder, CEO, public technical explainer, and external symbol of FieldAI's
              physics-first thesis. That concentration is powerful for fundraising and narrative clarity, but it also
              creates key-person risk: when one individual anchors technical credibility, recruiting magnetism, customer
              trust, and platform vision, the downside of leadership disruption is unusually high. Reuters'
              headcount-growth story and the company's own global ambitions add another layer: scaling from roughly 130
              people with plans to double headcount while supporting multi-vertical deployments across the U.S., Europe,
              Asia, and federal channels is operationally hard even for well-capitalized teams.


              Partner dependence amplifies the execution burden. NVIDIA, Ouster, Boston Dynamics, Certis, and Detroit
              Defense each help FieldAI reach markets or technical capability it would struggle to build alone, but they
              also create failure modes around platform leverage, sensor supply, go-to-market control, and ownership of
              the end-customer relationship. NVIDIA is the clearest example because it acts as investor, infrastructure
              provider, and ecosystem sponsor to competing robotics startups. In the best case, this accelerates
              FieldAI. In the worst case, it reduces bargaining power and leaves FieldAI exposed if the center of
              gravity shifts toward other NVIDIA-backed embodied-AI stacks.
