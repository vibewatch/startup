      - number: '6.3'
        title: Concentration Risk, Adverse Evidence, and Overall Customer Verdict
        blocks:
          - type: paragraph
            body: >-
              The adverse customer read is not evidence of failure; it is evidence of narrow disclosure. At a $2B
              valuation and with rhetoric around hundreds of deployments, public named-customer proof remains thin.
              Construction still dominates the disclosed customer base, security is represented mainly by Certis, and
              broader geographic claims outside the U.S. are mostly unnamed. GetLatka explicitly says it does not have
              customer-count information, while Robotics.press flags the absence of publicly disclosed named customer
              case studies with quantified outcomes and the lack of independent traction benchmarks. Even the most
              useful scale evidence from Boston Dynamics and Robots in Construction still leans on unnamed top-10 ENR
              builders rather than a broad roster of attributable logos.


              That creates two risks. First, customer concentration may be much higher than it appears because public
              references could overrepresent a small handful of flagship deployments. Second, partner-led distribution
              may blur where FieldAI owns the customer relationship versus where it sits behind Certis, Boston Dynamics,
              or federal integrators. On the positive side, there are no public churn, complaint, or competitive-loss
              events in the reviewed sources, and Big-D plus DPR suggest genuine operational value. The correct customer
              verdict is therefore 'real traction, insufficient breadth disclosure': enough proof to reject the idea
              that FieldAI has no customers, but not enough transparency to underwrite customer count, retention
              quality, or concentration with high confidence.
