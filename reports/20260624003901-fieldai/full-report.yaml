    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Eight key dated milestones from the 2020 DARPA SubT win through the June 2026 Ouster lidar collaboration,
      illustrating FieldAI's trajectory from research breakthrough to industrial-scale commercial deployment.
    data:
      items:
        - label: '2020: DARPA SubT Urban Circuit Win'
          detail: >-
            Team CoSTAR wins Urban phase; first fully autonomous km-scale quadruped exploration; 11 heterogeneous robots
            coordinated in GPS-denied underground — foundational technical proof
          tone: positive
        - label: '2023: FieldAI Founded (Irvine, CA)'
          detail: >-
            Agha departs NASA JPL to found FieldAI with Omidshafiei and Fan; begins stealth development of physics-first
            Field Foundation Models (FFMs)
          tone: positive
        - label: '2024: Series A, $500M Valuation'
          detail: >-
            Closes Series A with Samsung, Gates Frontier, Khosla Ventures, Canaan Partners; first commercial deployments
            begin in construction, energy, security sectors
          tone: positive
        - label: 'Aug 2025: $405M Raised, $2B Valuation'
          detail: >-
            $314M A-1 co-led by Bezos Expeditions, Prysm, Temasek; total $405M; oversubscribed; 4× valuation step-up;
            company publicly exits stealth
          tone: positive
        - label: 'Aug 2025: NVIDIA Omniverse Collaboration'
          detail: >-
            Deepens NVIDIA Omniverse integration for digital twin creation and synthetic data pipeline; accelerates the
            real-world data flywheel at scale
          tone: positive
        - label: 'Mar 2026: Boston Dynamics Partnership'
          detail: >-
            Integrates FFMs with Spot quadruped for construction and industrial environments; 90%+ inspection time
            reduction claimed; plans for world's largest Spot third-party fleet
          tone: positive
        - label: 'Apr 2026: $100M+ Revenue Signal (OCBJ)'
