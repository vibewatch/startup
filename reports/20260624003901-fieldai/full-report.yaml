      - number: '1.2'
        title: Founders, Leadership Team, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              FieldAI was co-founded by Dr. Ali Agha (CEO) and Dr. Shayegan Omidshafiei (now President and CSO), both of
              whom built long careers in autonomous robotics and AI before starting the company. Dr. Agha spent seven
              years at NASA Jet Propulsion Laboratory, where he served as Principal Investigator for the DARPA
              Subterranean Challenge, DARPA RACER (off-road autonomous vehicles), NASA Autonomous Mars Cave Exploration,
              and the prototype Mars Helicopter-Rover coordinated autonomy project. He led Team CoSTAR
              (JPL-MIT-Caltech-KAIST-LTU), which won the Urban Circuit of the 2020 DARPA SubT Challenge — a landmark
              multi-robot, GPS-denied exploration competition that achieved the first fully autonomous many-kilometer
              exploration with a quadruped robot and coordinated up to 11 heterogeneous robots simultaneously. Prior to
              JPL, Dr. Agha was a researcher at MIT and Qualcomm, where he founded Qualcomm's robotic autonomy effort in
              2016. He has no prior venture-backed company founding, though his research record includes over a decade
              of AI and autonomy publication.

              Dr. Omidshafiei brings over a decade of autonomous robotics and machine-learning experience, including
              more than five years as a leading Research Scientist at Google DeepMind focused on large-scale AI model
              training and multi-agent reinforcement learning. He holds a PhD from MIT and originally met Dr. Agha while
              they worked together there. The technology leadership is complemented by Dr. David Fan (CTO), also a
              former JPL and DARPA program veteran, and Eric Krotkov (Business Development), described by OCBJ as the
              "grandfather" of the PackBot and Talon military robots. Andrew Mullen leads hardware strategy and was
              quoted in the Ouster partnership announcement. Duncan McIntyre serves as CFO.

              The leadership team concentrates deep field-robotics pedigree that maps directly to the core technical
              challenges FieldAI is solving — a meaningful founder-market fit signal. However, this also creates
              key-person risk concentrated in Dr. Agha, whose public profile and technical credibility are central to
              customer and investor confidence. Board composition remains unknown, a significant governance gap. As of
              August 2025, Reuters confirmed the company grew from approximately 30 employees at year-end 2024 to 130 by
              August 2025, with plans to double by year-end 2025. By April 2026, the OCBJ facility tour and LinkedIn
              showed between 201 and 500 employees, suggesting aggressive hiring continued.
