      - number: '8.4'
        title: Recommendation, Confidence, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              A conditional recommendation is the only view that fits the public evidence. There are too many real
              strengths to pass reflexively: the product story is stronger than most robotics startups, the capital base
              is meaningful, and the customer references are enough to reject the idea that FieldAI is pre-product. But
              the verification gap is too wide to invest on headline valuation alone. Public evidence does not pin down
              audited ARR, recognized revenue, customer concentration, churn, or exact downside terms, and those are the
              inputs that separate a premium AI multiple from a cap-table trap.


              Confidence is medium, not high, because the same public dataset can support both a plausible-bull and an
              implausible-bear interpretation. Risk rating should stay high because downside is amplified by opaque
              commercial metrics and potential structure. The next diligence step is therefore obvious: demand
              finance-quality proof rather than more narrative. If management can produce CFO-certified ARR, customer
              concentration, renewal behavior, and full preference-stack terms, the company may deserve a serious
              investment case. Without that evidence, the current $2B mark remains valuation-unverifiable rather than
              investably fair or clearly overvalued.
