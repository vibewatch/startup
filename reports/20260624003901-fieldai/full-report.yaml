            title: No Named Customers and Unaudited Revenue Claims
            body: >-
              FieldAI has not disclosed the identity of any customers despite claims of dozens of large enterprise
              deployments across three continents. The $140M ARR estimate (Latka) and $100M+ booked revenue signal (OCBJ
              informal) cannot be verified from public filings. This creates a material gap between the $2B valuation
