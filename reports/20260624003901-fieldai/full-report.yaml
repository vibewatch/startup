            body: >-
              FieldAI does not sell a single robot SKU. Public materials consistently frame the product as EDGE, a
              general-purpose robot brain that can sit on top of many mobile robot embodiments and execute customer
              workflows in dynamic, unstructured environments. In customer terms, the product replaces manual field
              rounds, survey walks, progress-photo collection, hazardous inspection, and GPS-denied scouting with
              autonomous site traversal plus structured data capture. The most concrete public use cases are
              construction progress monitoring and survey capture, industrial and energy inspection, security patrol,
              underground or off-road mapping, and federal reconnaissance-style data collection.


              What matters commercially is that this is a workflow product, not just a model demo. The solutions catalog
              describes in-house mission applications alongside third-party payload integrations, and the federal site
              shows the same core stack extending into safety-critical GPS-denied missions. That makes the product map
              easier to underwrite: a reusable autonomy core, multiple mission packages, broad sensor support, and
              customer-facing outputs such as digital twins, anomaly detection, and site documentation. Big-D and DPR
              case studies suggest this abstraction is already good enough to move beyond narrow pilots into recurring
              job-site operations.
