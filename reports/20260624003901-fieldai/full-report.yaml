      - number: '3.3'
        title: Feature and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              Among the robotics-AI platform peers, pricing varies significantly: Physical Intelligence charges
              ~$300/month/robot (SaaS), Brain Corp is primarily OEM-partnership revenue-sharing, Intrinsic/Flowstate
              targets enterprise licensing, and FieldAI uses multi-million-dollar multi-year RaaS contracts. FieldAI's
              contract model implies higher near-term commitment from buyers but also higher switching cost and revenue
              predictability. On capability dimensions, FieldAI leads on GPS-free outdoor/underground autonomy and
              multi-robot fleet management in unstructured environments; Physical Intelligence and Skild AI lead on
              manipulation dexterity and cross-morphology generalization trained on large teleoperation datasets; Brain
              Corp leads on installed-base scale in indoor structured environments. No competitor publicly claims
              sub-100ms edge inference in GPS-denied outdoor environments. In the federal segment, FieldAI Federal is
              the only foundation-model competitor with a declared defense and government contracting presence among
              robotics software providers; Exyn serves the US DoD but is hardware-specific.
