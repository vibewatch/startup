      - number: '3.2'
        title: Incumbent and Adjacent Software Competitors
        blocks:
          - type: paragraph
            body: >-
              Brain Corp (San Diego, ~$221M raised, ~$117M revenue 2026) operates BrainOS, the leading commercial
              robotics autonomy OS, deployed in over 10,000 robots globally via OEM partners led by Tennant Company.
              Brain Corp's strength lies in commercial-scale deployment and distribution through Tennant's global sales
              force, but it is limited to structured, indoor, map-dependent environments — the exact use cases FieldAI
              is designed to transcend. Covariant (Berkeley, ~$222M raised, $2.7B prior valuation) built an AI
              pick-and-place "robot brain" platform but suffered a reverse acqui-hire by Amazon in September 2024 that
              gutted its leadership team; it continues under new management but faces strategic uncertainty. Intrinsic
              (now part of Google, as of February 2026) offers Flowstate, a no-code robotics platform targeting
              manufacturing and logistics. Intrinsic's integration into Google means access to enterprise distribution,
              cloud infrastructure, and DeepMind's AI stack — a combination that poses a long-term platform competition
              risk to FieldAI. Exyn Technologies (Philadelphia, IPO May 2026, ~$57M raised) provides high-autonomy
              aerial robotics for GPS-denied mining environments; it overlaps with FieldAI in underground/industrial
              inspection but is hardware-specific (aerial only) and smaller-scale. Viam Robotics offers a
              developer-oriented robotics platform with broad hardware support, competing at the software layer; Figure
              AI ($1.9B raised, $39B valuation) and Agility Robotics lead the humanoid-hardware tier, which overlaps
              with FieldAI's humanoid-compatibility claim but is hardware-specific rather than software-layer
