  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              The directly corroborated part of the valuation story is simple: FieldAI raised roughly $405M and was
              marked at $2B in August 2025. Everything after that gets messier. GetLatka estimates about $140M ARR,
              while CompWorth’s public profile points to only about $5M of revenue, and neither figure is
              management-certified. UpsideList adds a different kind of caution by estimating roughly $506M of preferred
              overhang and highlighting how much downside structure may already sit above common. In other words, price
              is visible, but quality of the underlying denominator is not.


              That distinction drives the entire chapter. A private company can justify a high headline valuation if it
              has fast compounding revenue, strong customer retention, and manageable downside terms. Public evidence
              does not yet let FieldAI clear those bars. The company has real strengths—capital, strategic investors,
              deployment proof, and a compelling product narrative—but the public record does not say whether investors
              are paying 14x ARR for a frontier-AI leader or roughly 400x revenue for an under-disclosed startup. That
              is why the appropriate valuation stance begins with evidence quality, not with a neat multiple comparison.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
