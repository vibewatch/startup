      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              Structural drivers accelerate adoption of autonomous robotic intelligence platforms.

              Labor shortages at structural scale: The US construction industry needs 349,000 net new
              workers in 2026, rising to 456,000 in 2027 (ABC). One-fifth of all US electricians are
              over 55. Global populations aged 65+ will rise from 10% to 16% by 2050, with some regions
              exceeding 30% (Barclays). Manufacturing and agriculture labor is aging faster than cities,
              creating a structural gap that manual hiring cannot close.

              Physical AI investment supercycle: Robotics raised $40.7B in VC globally in 2025 (CBInsights),
              9% of all venture funding. Q2 2025 saw $8.8B in robotics deal value — a 170.5% QoQ surge.
              Corporate investors including NVIDIA, Amazon, BHP, and Intel made strategic bets. World model
              investment surged from $1.4B in 2024 to $6.9B in 2025, validating FieldAI's Belief World
              Model (BWM) architecture.

              Expanding robot installed base: 542,000 industrial robots installed globally in 2024 (IFR),
              double the count of a decade ago. Total operational stock reached 4,664,000 units (+9% YoY).
              IFR projects 575,000 installations in 2025, exceeding 700,000 by 2028. Asia Pacific drives
              67.3% of global industrial robotics revenue, with China alone representing 54% of new
              deployments — context for FieldAI's international expansion.

              Government and defense: The US DoD has allocated $1.3B to autonomous ground systems,
              creating procurement opportunities for validated technologies. Barclays estimates global
              defence spending will reach $4.4–$6.6T by 2035, driving demand for autonomous systems.

              Key constraints: Organizational readiness gap — IFS found 99% of workforces require reskilling,
              53% of enterprises lack an AI strategy, and 88% use AI but only 33% have scaled it. The BCG
              AI Radar shows most companies dilute AI efforts across too many use cases. EU AI Act compliance
