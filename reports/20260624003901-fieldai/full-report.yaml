  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Foundation-Model Competitors
        blocks:
          - type: paragraph
            body: >-
              FieldAI's most proximate competitors are the three other pure-play robotics foundation model providers:
              Physical Intelligence (San Francisco, $11B valuation, March 2026), Skild AI (Pittsburgh, $14B valuation,
              January 2026), and Google DeepMind's Gemini Robotics stack. All three pursue hardware-agnostic,
              generalizable models that can drive diverse robot morphologies — matching FieldAI's core positioning.
              Physical Intelligence's π0 series and Skild AI's Brain model are open-source or broadly available, which
              lowers the barrier for robot OEMs to adopt an alternative to FieldAI's EDGE platform. Google DeepMind's
              Gemini Robotics-ER 1.6, folded into Google's enterprise infrastructure via Intrinsic's integration in
              February 2026, adds distribution power no startup can match. The key differentiator FieldAI claims is an
              industrial unstructured-environment focus and physics-first model architecture, versus PI and Skild's more
              general-purpose, laboratory-derived VLA approaches. FieldAI also emphasizes real, production deployments
              on hundreds of sites across three continents, while Physical Intelligence and Skild AI are still largely
              in pilot or pre-production stages for industrial use cases. FieldAI's edge-inference sub-100ms latency
              claim and GPS-free, map-free operation in hazardous environments remain unmatched claims among direct
              peers.
