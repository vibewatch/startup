      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              FieldAI's competitive moats are data network effects (proprietary operational data from hundreds of
              deployments feeds FFM improvement, widening generalization edges over time), contract lock-in (multi-year
              RaaS contracts in regulated sectors like construction and energy carry high switching costs), and
              reference customer density (deployed at scale globally while peers remain in limited pilots). However,
              these moats face three structural risks. First, Physical Intelligence and Skild AI are each raising
              capital at 5–7× FieldAI's current valuation, enabling them to scale research teams and compute faster.
              Second, open-source releases (Physical Intelligence's π0.5) enable low-cost alternatives for buyers who
              can tolerate higher integration effort. Third, NVIDIA's Isaac GR00T and Omniverse platform — in which
              FieldAI is a partner — could transition from enabler to competitor if NVIDIA decides to productize its
              simulation and inference stack directly. A further adverse signal: FieldAI has not disclosed named
              enterprise customers despite 2+ years of operation, limiting independent verification of deployed-at-scale
              claims. Overall, FieldAI's competitive position is well-differentiated for 2026 industrial verticals but
              at risk from resource-superior peers over a 3–5 year horizon, particularly if general-purpose foundation
              models prove sufficient for industrial tasks without physics-first specialization.
