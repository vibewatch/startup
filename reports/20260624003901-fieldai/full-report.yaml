      - number: '7.3'
        title: Technical, Regulatory, Legal, and Safety Risks
        blocks:
          - type: paragraph
            body: >-
              FieldAI operates exactly where regulators and enterprise buyers care most: AI-enabled machines moving
              through hazardous, changing environments with imperfect data and high consequence of failure. The
              technical upside of physics-first, risk-aware edge autonomy is therefore inseparable from regulatory and
              safety risk. OSHA still relies on a patchwork of applicable machine-safety rules rather than a single
              robot-specific standard, while EU and U.S. frameworks are tightening. The EU AI Act introduces enforceable
              obligations for high-risk AI systems, the Machinery Regulation raises conformity requirements for adaptive
              autonomous machinery, and 2025 updates to ANSI/A3 and ISO 10218 raise the safety and validation bar for
              industrial robots.


              The public evidence gap is the core risk amplifier. FieldAI has a pending traversability patent, but not a
              visibly broad issued IP portfolio. Public sources still do not show independent technical benchmarks,
              published intervention rates, MTTF/MTBF data, named safety certifications, or a formal safety-case package
              for commercial deployments. That leaves investors and buyers with an uncomfortable asymmetry: they can
              clearly see FieldAI pursuing safety-critical customers, but they cannot yet see the documentary layer that
              normally proves reliability, freedom to operate, and compliance readiness at scale.
