  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercial, Market, and Capital-Structure Risks
        blocks:
          - type: paragraph
            body: >-
              FieldAI's first-order business risk is that the market narrative is stronger than the public operating
              denominator. Independent sources can verify valuation, fundraising, and some deployment proof, but they
              still cannot verify active customer count, recognized revenue, churn, or concentration. That gap matters
              because the company is already priced like a breakout embodied-AI winner. UpsideList's $506M
              preference-stack estimate makes the downside more asymmetric for common shareholders, while Reuters and
              GetLatka show how easy it is to find top-line and scale claims without the supporting quality metrics that
              would normally de-risk a company at this valuation.


              The second business risk is competitive arms race. Skild AI and Physical Intelligence are capitalized at
              roughly 5-7x FieldAI's valuation, and Brain Corp shows that an incumbent autonomy platform can already
              commercialize at enterprise scale without promising general robot intelligence. If the market converges on
              a more horizontal foundation-model stack or if NVIDIA's ecosystem becomes the default control plane,
              FieldAI may find itself squeezed between larger-capitalized frontier peers and already-commercial
              incumbents. Short-term labor-market softening in construction also matters: if labor scarcity eases before
              ROI is fully proven, urgency to buy autonomous site robots could normalize faster than expected.
