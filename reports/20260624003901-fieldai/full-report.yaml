        title: Public Financial Gaps and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              FieldAI has enough public data to establish that investors value it as a breakout embodied-AI company, but
              not enough to confirm whether that valuation rests on durable recurring economics. Third-party datasets
              disagree not just on revenue but even on financing detail and headcount snapshots: PremierAlts lists
              $506.1M of funding across five rounds, whereas the company and Reuters describe $405M across two
              consecutive rounds, and PitchBook's mid-2025 employee snapshot materially lagged later news reporting.
              That inconsistency is itself a financial fact because it lowers confidence in any database-derived
              multiple analysis. CompWorth's $5M estimate and GetLatka's $140M estimate imply radically different
              valuation math, from venture-software rich to essentially narrative-only.


              The underwriting conclusion is therefore two-part. First, FieldAI probably has adequate near-term capital
              to keep scaling, especially because its model avoids heavy robot-manufacturing working capital. Second,
              the company still fails the public-evidence standard for revenue quality: there are no audited financials,
              no disclosed gross margin by stream, no customer concentration data, no churn or retention data, and no
              disclosed cash balance. For a diligence report, that means the correct verdict is not insolvency risk but
              information risk. Before underwriting the $2B valuation, an investor should demand audited or
              CFO-certified ARR, revenue-recognition policy, stream-level margins, latest cash balance, burn, and
              top-customer exposure.
