      - number: '4.3'
        title: Capital Adequacy, Burn Proxy, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The best-supported part of FieldAI's financial picture is capitalization. The company and multiple
              independent outlets agree that FieldAI raised $405M across two consecutive rounds, including a $314M
              tranche that brought valuation to $2B. The official use-of-proceeds language is also fairly clear: global
              expansion, continued product development, and aggressive hiring. Reuters adds the most useful operating
              proxy by describing headcount growing from about 30 at the end of 2024 to 130 by August 2025, with plans
              to double by year-end; GetLatka later estimated 150 employees. Even on a conservative $200K fully loaded
              cost basis, that implies a personnel-cost floor of roughly $30M to $36M annually before compute,
              facilities, travel, deployment support, or general overhead.


              No public source discloses cash on hand, actual monthly burn, or board-level financing trigger, so runway
              is necessarily estimate-based. A reasonable public-case framework is roughly $7M to $10M of monthly burn
              once payroll, model-training compute, and field operations are combined. If about half of the $405M raised
              has already been deployed, remaining cash would be near $200M and implied runway about 20 to 28 months.
              The model is less capital intensive than vertically integrated robotics because FieldAI does not appear to
              carry robot inventory or manufacturing capex, and no debt, project finance, or revenue-based financing has
              been publicly disclosed. Even so, UpsideList's preference-stack analysis is a useful adverse reminder that
              capital adequacy for operations is not the same as clean economics for common shareholders.
