        - Expanding number of retrofittable mobile robots; each new quadruped/humanoid is a potential FFM customer
        - Assess FieldAI's signed OEM partnerships and non-Boston Dynamics retrofit success rate
      - - AI infrastructure buildout (data centers, grid, renewable energy)
