            title: Elite Founder-Market Fit from DARPA and NASA
            body: >-
              Ali Agha's direct leadership of DARPA SubT, DARPA RACER, and NASA Mars programs, combined with Shayegan
              Omidshafiei's Google DeepMind foundation model expertise, creates an unusually deep alignment between the
              founding team's prior accomplishments and FieldAI's core commercial mission. No peer robotics software
