  - id: buyers-adoption
    title: Buyer Profile and Adoption Dynamics
    body: |
      FieldAI's go-to-market model is B2B enterprise software with multi-year contracts or RaaS
      agreements to large industrial operators. The buyer profile is distinct across verticals.

      Construction: General contractors and infrastructure developers (Fortune 500 tier). Decision
      makers include CTOs, COOs, and Heads of Innovation. Purchase triggers: severe labor shortages
      (349,000 net new workers needed in 2026 per ABC), site safety requirements, and data capture
      mandates. 92% of construction firms reported difficulty filling positions in 2025, and one-fifth
      of all US electricians are over 55. Robots address hazardous inspection and monitoring tasks,
      reducing risk exposure. Budget: CapEx projects or OpEx through RaaS. Adoption pattern: pilot
      on one job site type, then expand to fleet-wide rollout.

      Energy and Utilities: Refineries, power plants, substations, solar farms. Decision makers:
      Asset Managers, HSE Directors, Plant Operations Directors. Triggered by regulatory compliance,
      predictive maintenance ROI, and hazardous environment restrictions. FieldAI's claimed Europe
      and Japan deployments suggest early-mover adoption in high-regulation markets.

      Mining: FieldAI investor BHP Ventures validates the thesis — BHP describes AI and data as
      central to "discovery-to-decisions" optimization amid declining discovery rates and deeper
      ore bodies. GPS-denied environments are a natural fit for FFMs.

      Manufacturing and Logistics: AI can lower manufacturing maintenance costs by 25–40%, and 78%
      of production facilities using AI report waste reduction (McKinsey/Tech-Stack analysis). BCG
      AI Radar found leading AI companies focus on 3.5 use cases (vs. 6.1 for laggards), achieving
      2.1× greater ROI.

      Adoption barriers are significant. IBM's 2026 analysis identifies data readiness, governance
      and security, proving ROI, skills gaps, and workflow integration as primary barriers. The IFS
      2025 Invisible Revolution Study of 1,700+ industrial decision-makers found only 29% are
      comfortable allowing AI autonomous strategic decisions, and 68% require human approval for AI
      outputs. Just 53% of enterprises have a clear AI strategy, and 52% of senior leaders say
      their management teams don't understand AI. RaaS pricing (CAGR 21.2%) is addressing the
      CapEx barrier by shifting to OpEx models. Enterprise B2B sales cycles for autonomous robots
      in construction and energy span 12–24 months, creating lumpy revenue and high working capital
      requirements.
