  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-profiles
      missingEvidence: >-
        No named FieldAI enterprise customers or case study data are publicly disclosed. The buyer
        profile analysis is inferred from vertical market research and investor communications, not
        verified customer win announcements. Actual adoption triggers, contract values, and sales
        cycles by segment are unknown.
      whyItMatters: >-
        Without named customer case studies, it is impossible to verify whether actual buyer
        personas, sales cycles, contract values, and use cases match the theoretical market
        analysis. Customer concentration risk cannot be assessed.
      diligencePath: >-
        Request FieldAI's signed customer list, redacted contract summaries, and segment revenue
        breakdown from management; cross-check against Bloomberg, Salesforce, or procurement
        database filings.
      relatedQuestionRefs: [QM021, QM025]

    - type: missing-source
      severity: material
      topic: energy-europe-japan-market-sizing
      missingEvidence: >-
        No public market size estimates for energy or utilities autonomous inspection in Europe
        or Japan specifically, which are FieldAI's cited international markets. Regional regulatory
        approval pathways for autonomous industrial robots in these geographies are not documented.
      whyItMatters: >-
        FieldAI's international revenue and deployment claims (Europe, Japan) rest on markets
        whose addressable size and regulatory status have not been independently verified for
        those specific geographies.
      diligencePath: >-
        Seek European and Japanese industrial inspection robotics market reports; request FieldAI's
        geographic revenue breakdown and customer country list; verify local regulatory approvals.
      relatedQuestionRefs: [QM020]

    - type: conflicting-data
      severity: minor
      topic: market-sizing-methodology
      missingEvidence: >-
        Wide dispersion in industrial robotics market size estimates ($15.5B MarketsandMarkets
        vs. $61.1B Business Research Company for 2026) indicates definitional inconsistency.
        No analyst has published a FieldAI-specific SAM estimate using consistent methodology.
      whyItMatters: >-
        If the SAM is closer to the low end ($15.5B hardware-centric), FieldAI's current
        software layer captures a much smaller share than headline TAM comparisons suggest.
        Inflated market sizing narratives may drive overvalued investment expectations.
      diligencePath: >-
        Commission or obtain a FieldAI-specific SAM study using consistent software-only
        scoping; ask FieldAI management for their own SAM methodology and underlying data.
      relatedQuestionRefs: [QM017]

    - type: private-evidence-only
      severity: minor
      topic: software-margins-and-competitive-moat
      missingEvidence: >-
        No public data on FieldAI's gross margin or on the pricing differential between FieldAI
        and embedded AI solutions from major robotics OEMs (Boston Dynamics, ABB, FANUC). It is
        unclear whether the software-only model generates higher margins than hardware-inclusive
        competitors or whether OEMs could undercut FieldAI's pricing at scale.
      whyItMatters: >-
        The investment thesis that a software-only model commands higher margins and greater
        scalability than hardware-inclusive competitors requires empirical validation. OEM AI
        integration could commoditize the autonomy layer.
      diligencePath: >-
        Request unit economics data (gross margin, CAC, LTV) from FieldAI management; compare
        pricing against Exyn Technologies and Brain Corp public pricing where available.
      relatedQuestionRefs: [QM024]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TM001 government and manufacturing row sizes are analyst-estimated without direct primary
      sources disclosing FieldAI contract values in those verticals. TM003 buyer titles are
      inferred from product documentation; no named FieldAI customers have been publicly
      disclosed. Notes fields explain the basis and limitation of each estimate.
  - dimension: paywallRisk
    reason: >-
      MarketsandMarkets (SM003) report content is behind a paywall; the market size figure
      ($15.5B in 2026) appears on the public landing page and is corroborated by independent
      analyst comparisons. The paywall restriction does not affect the validity of the cited
      figure.
