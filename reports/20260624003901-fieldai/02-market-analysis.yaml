  - id: tam-sam-som
    title: "Market Sizing: TAM, SAM, and SOM"
    body: |
      FieldAI's market can be sized through three complementary lenses: broad physical AI TAM,
      direct vertical SAM, and a bottom-up SOM from deployable robot fleets.

      Broad TAM — Physical AI Software (2026): Robotics and physical AI startups raised a record
      $40.7B in 2025, up 74% YoY and representing 9% of all venture funding (CB Insights).
      PitchBook's data shows $27.6B across 1,009 deals in 2025, more than double 2024 totals.
      Information Matters' Q1-2026 agentic AI market report estimates a $40B TAM for agentic AI
      in 2026 (range $33–$48B), built bottom-up from primary-source disclosures. Goldman Sachs
      estimates the humanoid robot market alone at $6B (base case) to $154B (blue-sky) by 2035,
      indicating how early-stage this market is. Gartner projects that 33% of enterprise software
      will include agentic AI by 2028, up from less than 1% in 2024.

      Vertical SAM — FieldAI's Deployable Markets (2026): The three primary application markets
      combine to roughly $16–22B by 2026: construction robotics ($7.79B, CAGR 18.9%), autonomous
      inspection robots ($3.20B, CAGR 13.9%), and mining GPS-denied autonomy ($3–4B by 2030 per
      Sacra). Adding manufacturing field robotics (estimated $2–3B) yields the combined SAM. The
      Robotics-as-a-Service (RaaS) market — closest to FieldAI's deployment model — is a narrower
      $2.57B in 2026 at a 21.2% CAGR, reflecting realized subscription revenue versus total potential.

      Bottom-Up SOM — FieldAI's Capture Rate: The IFR reports 4,664,000 industrial robots in
      operational use at end-2024, up 9% YoY. Annual new installations reached 542,000 in 2024,
      expected to grow to 575,000 in 2025. Each new mobile robot is a potential FieldAI retrofit
      customer. At roughly $100M–$140M ARR (informal/unaudited estimates), FieldAI has captured
      approximately <1% of the narrow SAM — consistent with an early-stage platform in a market
      where 88% of enterprises use AI but only 33% have scaled.

      A significant caution: market estimates span $15.5B–$61.1B for industrial robotics in 2026
      depending on definitional scope, reflecting a common weakness in nascent market sizing.
      Analysts conflate hardware and software values, include or exclude integration services,
      and use different vertical definitions. This wide estimate range creates risk of inflated
      buyer expectations and investor TAM narratives.
