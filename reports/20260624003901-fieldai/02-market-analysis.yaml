chapter:
  number: 2
  title: Market Analysis
  summary: >-
    FieldAI operates at the intersection of the $53B industrial robotics market, the $7.8B
    construction robotics vertical, and the $3.2B autonomous inspection robot market. A broader
    agentic AI TAM is estimated at $40B for 2026. The combined serviceable addressable market
    across FieldAI's primary verticals (construction, energy/inspection, mining) is estimated at
    $16–22B in 2026, growing to $30–40B by 2030. Key growth drivers include a structural
    construction labor shortage (349K workers needed in 2026), a physical AI investment supercycle
    ($40.7B raised in 2025), and an expanding global robot installed base (4.66M operational units).
    Adoption constraints are significant: only 33% of industrial enterprises have scaled AI
    enterprise-wide, long B2B sales cycles (12–24 months), and EU AI Act compliance obligations
    from August 2026 all moderate penetration speed. Market estimates vary widely ($15.5B–$61.1B
    for industrial robotics 2026) due to definitional inconsistency — a key diligence caveat.

sections:
  - id: market-boundary
    title: Market Boundary, Segmentation, and Substitutes
    body: |
      FieldAI's market is autonomous robotic intelligence software — specifically Field Foundation
      Models (FFMs) that enable robots to navigate, inspect, and operate in unstructured industrial
      environments without GPS or pre-mapped spaces. This market sits at the intersection of physical
      AI software, industrial robotics, and enterprise automation-as-a-service.

      The broadest boundary is the global industrial robotics market: $53.2B in 2025, forecast to
      reach $61.1B in 2026 at a 15% CAGR (Business Research Company). However, FieldAI sells
      software and AI inference, not robots. Its direct competitive market is the autonomous robotics
      software and intelligence layer for industrial field operations. MarketsandMarkets sizes the
      broader industrial robotics market at $15.5B in 2026 growing to $20.8B by 2032 at a 5.0%
      CAGR — a narrower, hardware-centric scope.

      FieldAI's primary application markets are construction automation, industrial inspection (energy,
      utilities, infrastructure), mining and energy operations, and manufacturing logistics. Key
      market boundaries:
      - Included: physical AI software for mobile robots operating in unstructured industrial
        environments; autonomous inspection, progress monitoring, materials transport, and site
        reconnaissance; edge-inference platforms that work without cloud connectivity.
      - Excluded: fixed-arm factory automation (welding robots, SCARA arms), consumer robotics,
        surgical robots, autonomous vehicles (cars/trucks), drone surveillance, and general enterprise
        AI software not controlling a physical robot.
      - Substitutes: manual labor, traditional SLAM-based robots requiring pre-mapping, teleoperation
        services, BIM-integrated software suites without robotic autonomy, and operator-centric
        inspection services using human rope-access teams.

      The construction robotics sub-market is $7.79B in 2026 (CAGR 18.9% per Business Research
      Company and GII Research). Zacua Ventures' 2026 Construction Robotics Report confirms
      "on-site construction robotics revenue sits in the low single-digit billions of dollars globally,
      growing at roughly mid-teens annual rates." The autonomous inspection robots market (energy,
      utilities, infrastructure) is separately valued at $3.2B in 2026 by FactMR (CAGR 13.9%).
      Sacra estimates mining GPS-denied autonomy at $3–4B annually by 2030. Combining these
      verticals yields a serviceable addressable market of approximately $16–22B by 2026.
