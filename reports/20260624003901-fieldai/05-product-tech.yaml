  rows:
  - - EDGE general-purpose robot brain
    - Site operations / robotics lead
    - Core autonomy layer across robots, tasks, and environments
    - Production-marketed platform
    - One brain across heterogeneous robots rather than a single appliance
    - No public SKU sheet, version history, or pricing architecture
  - - Belief World Model (BWM)
    - Autonomy / safety engineering
    - Predictive engine for reasoning under uncertainty
    - Publicly named architecture component
    - Risk-aware world modeling is a stronger public articulation than generic end-to-end AI
    - No public technical paper or benchmark on BWM performance
  - - Field Foundation Models (FFMs)
    - Customer deployment and product teams
    - Foundation-model family for perception, planning, adaptation, and risk-aware behavior
    - Widely referenced across official pages and partners
    - Combines data-driven AI with physics-based reasoning and uncertainty handling
    - Model size, training corpus, and eval suite remain undisclosed
  - - Mission applications and payload integrations
    - Field operators and enterprise buyers
    - Site mapping, inspection, anomaly detection, telepresence, material transport, security, ISR
    - Live use cases publicly marketed
    - Open partnership model broadens application surface without owning every payload
    - No public attach-rate or module-level usage data
  - - Federal edge autonomy package
    - Government / defense operators
    - GPS-denied scouting, mapping, overwatch, and multi-robot operations
    - Dedicated product surface via FieldAI Federal
    - Extends the same autonomy core into safety-critical off-road missions
    - Award values, accreditation path, and fielded program count not disclosed
  - - Digital twin / real-to-sim pipeline
    - Operations, V&V, and planning teams
    - Turns live robot data into simulation-ready site models and customer-facing digital twins
    - Partner-backed and actively expanding
    - Creates a compounding data asset rather than one-off robot telemetry
    - No public economics on reconstruction throughput, cost, or customer adoption
  notes: Status labels reflect public evidence only. FieldAI markets all six layers as live or deployment-ready, but public documentation depth varies sharply by module.
