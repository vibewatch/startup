- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered view of FieldAI from embodied sensor inputs up through uncertainty-aware models, orchestration, and customer-facing digital twin outputs.
  data:
    layers:
    - label: Embodiment + sensor layer
      detail: Legged, wheeled, flying, and tracked robots ingest vision, LiDAR, text, thermal, and other sensor streams.
    - label: Perception + mapping layer
      detail: Multimodal understanding, 3D mapping, semantic perception, and dense obstacle awareness establish scene context.
    - label: Belief + dynamics layer
      detail: Belief World Model and Dynamics Foundation Model reason under uncertainty and connect AI outputs to robot motion.
    - label: Mission autonomy layer
      detail: EDGE / FFMs handle navigation, task execution, and conservative adaptation without GPS, maps, or fixed routes.
    - label: Multi-robot + integration layer
      detail: Multiagent coordination, ROS / rosbridge integration, and partner payload interfaces connect heterogeneous fleets.
    - label: Data flywheel + application layer
      detail: Digital twins, site documentation, inspection, anomaly detection, and planning outputs feed both customers and retraining / validation.
  approximationNotes: Layer boundaries are reconstructed from public product pages, partner writeups, and GitHub artifacts rather than a single published architecture diagram.
