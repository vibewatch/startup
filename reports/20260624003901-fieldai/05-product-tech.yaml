- id: trust-safety-and-quality-controls
  title: Trust, Safety, Security, Privacy, and Quality Controls
  body: |-
    FieldAI's public product copy emphasizes risk awareness, conservative adaptation under uncertainty, dense obstacle avoidance, semantic perception, and edge deployment in GPS-denied or hazardous environments. Those claims are directionally aligned with what industrial buyers need: low-latency local inference, resilience to weak connectivity, and safety functions that remain available even when networks are degraded. The standards backdrop has also become stricter. ISO 10218's 2025 revision explicitly sharpens functional-safety, collaborative-operation, and cybersecurity expectations, while ISO 13849 remains the reference for performance levels on safety-related controls. For any robot deployed on live industrial or construction sites, that standards context matters as much as raw autonomy capability.

    The gap is documentation. None of the public sources reviewed for this chapter provides named ISO 10218 or ISO 13849 certification, published PL calculations, validated stop-function performance, incident statistics, uptime/SLA disclosures, or a formal commercial safety-case package. That does not mean the controls do not exist; it means the public evidence standard is still weaker than the deployment and marketing narrative. For diligence, this moves the product-tech conclusion from 'breakthrough architecture' to 'strong architecture with documentation risk': the trust story is plausible and increasingly partner-backed, but the measurable quality and compliance layer still needs primary evidence under NDA.
  claimRefs:
