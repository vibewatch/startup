  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Measured uptime, MTBF, intervention rate, support-response SLA, and incident statistics for live FieldAI deployments.
    whyItMatters: Without measured operational KPIs, buyers and investors cannot tell whether impressive deployments are repeatable products or support-heavy bespoke engagements.
    diligencePath: Request customer scorecards, support dashboards, incident logs, and fleet-level reliability metrics for Big-D, DPR, and other live accounts under NDA.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: certification-proof
    missingEvidence: Named ISO 10218 / ISO 13849 conformity evidence, validated protective-stop documentation, cyber-safety controls, and any site-specific safety file.
    whyItMatters: Industrial and construction buyers will care as much about validated safety functions and documentation quality as about autonomy performance.
    diligencePath: Request the safety case, PL/SIL calculations, hazard analyses, and any third-party certification or integrator sign-off package for representative deployments.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: edge-latency-benchmark
    missingEvidence: Primary-source benchmark data for on-device inference latency, network-failure behavior, and compute envelope across representative robot classes.
    whyItMatters: The on-edge and sub-100ms narrative is strategically important, but it is still weakly corroborated without benchmark methodology or hardware-specific test results.
    diligencePath: Request benchmark reports by robot class, sensor stack, and scenario showing latency, throughput, fallback behavior, and accuracy trade-offs.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: roadmap-and-api-maturity
    missingEvidence: Versioned release notes, customer-facing API / SDK documentation, and module-level roadmap milestones with dates.
    whyItMatters: The public roadmap is readable through partners, but product-maintenance burden and integration maturity are hard to gauge without versioned artifacts.
    diligencePath: Request changelogs, customer integration guides, and the next 12-month product roadmap with dependencies and staffing assumptions.
