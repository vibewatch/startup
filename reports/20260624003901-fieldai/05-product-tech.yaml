- id: architecture-and-operating-stack
  title: Architecture and Operating Stack
  body: |-
    FieldAI's public architecture disclosures are more specific than the usual robotics marketing stack. The homepage anchors EDGE on a Belief World Model, while the technology page breaks the system into multimodal input, deployment-data-driven learning, dynamics-aware control, and multi-agent coordination. The architecture claim is not simply 'foundation model for robots'; it is explicitly a risk-aware stack that reasons under uncertainty, operates without maps or GPS, and is deployed on the edge rather than as a cloud-only copilot. That combination is central to the company's differentiation in construction, mining, utility, and federal settings where connectivity, terrain, and layouts are unstable.

    The strongest software-stack evidence comes from the NVIDIA Omniverse post, which turns abstract model claims into an operating pipeline: FieldAI uses Isaac Lab for training, Isaac Sim for software-in-the-loop validation, and Omniverse NuRec plus OSMO to transform live robot data into simulation-ready digital twins. The GitHub forks add a developer-signal layer: FieldAI publicly maintains ROS/Ouster and rosbridge-related code, which is consistent with a heterogeneous integration strategy rather than a sealed, single-robot appliance. Taken together, the stack looks like a field robotics platform built to ingest multimodal sensor data, act locally, and continuously improve through real-world deployment data.
