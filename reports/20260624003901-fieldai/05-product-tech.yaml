chapter:
  number: 5
  title: Product & Technology
  summary: 'FieldAI''s public product story is unusually coherent for an embodied-AI startup: EDGE is positioned as a hardware-agnostic autonomy brain built on risk-aware Field Foundation Models, with multimodal sensing, on-edge deployment, and a real-to-sim digital-twin loop through NVIDIA Omniverse. The strongest public proof points are partner-backed deployments with Big-D, DPR, Boston Dynamics, and Ouster plus a pending traversability patent, while the main diligence gaps are measured reliability, formal safety-case documentation, and named certification evidence.'
sections:
- id: product-definition-and-module-map
  title: Product Definition and Module Map
  body: |-
    FieldAI does not sell a single robot SKU. Public materials consistently frame the product as EDGE, a general-purpose robot brain that can sit on top of many mobile robot embodiments and execute customer workflows in dynamic, unstructured environments. In customer terms, the product replaces manual field rounds, survey walks, progress-photo collection, hazardous inspection, and GPS-denied scouting with autonomous site traversal plus structured data capture. The most concrete public use cases are construction progress monitoring and survey capture, industrial and energy inspection, security patrol, underground or off-road mapping, and federal reconnaissance-style data collection.

    What matters commercially is that this is a workflow product, not just a model demo. The solutions catalog describes in-house mission applications alongside third-party payload integrations, and the federal site shows the same core stack extending into safety-critical GPS-denied missions. That makes the product map easier to underwrite: a reusable autonomy core, multiple mission packages, broad sensor support, and customer-facing outputs such as digital twins, anomaly detection, and site documentation. Big-D and DPR case studies suggest this abstraction is already good enough to move beyond narrow pilots into recurring job-site operations.
