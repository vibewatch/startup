    - Not publicly disclosed; likely when growth plan and margin profile require another scale round
    - Low
    - Critical for dilution planning and capital-intensity judgment
    - Provide next financing threshold and required milestones
  - - Debt / project finance
    - No public debt, project finance, or revenue-based financing disclosed
    - Medium
    - Pure-equity structure lowers fixed financing obligations
