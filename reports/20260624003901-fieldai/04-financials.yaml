- id: unit-economics-and-cost-structure
  title: Unit Economics, Cost Structure, and GTM Efficiency Proxies
  body: |-
    FieldAI has not published gross margin, CAC, payback, NRR, contract duration, or customer concentration, so public unit economics must be built from mechanism rather than disclosure. The useful public comparators are AI-native SaaS and enterprise AI benchmarks: they show structurally lower gross margins than classic software because inference, orchestration, retrieval, and support remain real variable costs. Multiple 2026 benchmark sources cluster AI-native gross margin in the 50% to 65% range, while more traditional software businesses still center near 80% software gross margin and lower blended margin once services are included. For FieldAI, the relevant question is not whether it can ever look like pure SaaS, but how much deployment support and field-service content sit inside each contract.

    There is a plausible positive offset. FieldAI's architecture runs decisions at the edge rather than constantly in the cloud, which should reduce one major source of variable COGS relative to cloud-heavy AI applications. But edge inference does not remove labor-intensive deployment, customer success, model-training compute, safety validation, and global field operations. GTM is also likely expensive: Reuters points to multi-million-dollar enterprise contracts and rapid international expansion, while general SaaS benchmarks suggest healthy economics would require 3:1 LTV/CAC and payback under 18 months. Without actual cohort data, the prudent stance is that FieldAI may achieve good unit economics at scale, but current public evidence only supports scenario ranges, not a verified margin path.
