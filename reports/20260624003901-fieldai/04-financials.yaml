- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited ARR / recognized revenue
    - Without it, the spread between $5M and $140M external estimates leaves valuation math unusable
    - Request audited or CFO-certified trailing-12-month ARR and GAAP/non-GAAP revenue bridge
  - - Revenue mix by stream
    - Cannot separate sticky software revenue from one-time deployment work
    - Request software, services, federal, and support revenue split for the last 8 quarters
  - - Gross margin by stream
    - No way to know whether economics resemble AI software or field-services projects
    - Request gross-margin waterfall by software, services, and federal work
  - - CAC / payback / pipeline conversion
    - GTM efficiency and capital dependency remain opaque
    - Request funnel, CAC, and payback by segment and geography
  - - NRR / churn / expansion behavior
    - Expansion-contract narrative cannot be tested without cohort behavior
    - Request logo churn, gross revenue retention, and NRR by cohort
  - - Customer count and concentration
    - A few large contracts could overstate durability and increase downside concentration
    - Request top-10 customer concentration and active customer count
  - - Current cash balance and covenant schedule
    - Runway estimate is impossible to verify without actual cash and obligations
    - Request latest balance sheet, monthly cash burn, and any debt or leasing covenants
  notes: These are the specific missing metrics that block underwriting. Each one maps directly to a public-evidence limitation surfaced in this chapter rather than to a generic diligence checklist.
