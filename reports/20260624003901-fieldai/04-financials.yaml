chapter:
  number: 4
  title: Financials
  summary: 'FieldAI presents a classic embodied-AI underwriting split: capital adequacy looks strong after $405M raised at a $2B valuation, but public revenue quality is weakly evidenced and financially material metrics remain undisclosed. Public top-line estimates range from CompWorth''s $5M annual-revenue estimate to GetLatka''s $140M ARR estimate, while Reuters describes multi-million-dollar contracts and aggressive hiring, creating a wide band of possible unit economics rather than a verified financial profile.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model, Pricing Signals, and Revenue Quality
  body: |-
    FieldAI's publicly visible business model is software-led Robot-as-a-Service rather than robot manufacturing. The company repeatedly describes itself as a hardware-agnostic autonomy layer that can be installed on third-party robots, and Reuters likewise framed the product as software that can run on a wide range of hardware rather than a proprietary robot fleet. That matters financially because the likely revenue stack is a combination of initial deployment and integration work, recurring software subscriptions, and expansion contracts as sites or robot counts grow, with lighter inventory exposure than vertically integrated robotics OEMs. FieldAI Federal adds a distinct but still-unproven government channel that could carry long procurement cycles and milestone-based recognition rather than clean SaaS-style annual contracts.

    What is missing is the part that actually determines underwriting quality: realized price, contract duration, mix of recurring software versus lower-margin services, and the gap between bookings and recognized revenue. Reuters supplies the strongest concrete commercialization signal by quoting Ali Agha on multi-million-dollar contracts in the U.S., Europe, and Asia, and the August 2025 company release adds rapid adoption plus multiple expansion contracts. But there is no public price card, no customer-count disclosure, and no audited top line. Instead, third-party databases disagree sharply: GetLatka estimates $140M ARR while CompWorth estimates only $5M annual revenue. That spread is too wide to treat any single public revenue figure as investment-grade evidence, so the right conclusion is not that revenue is low or high, but that revenue quality remains unverified.
