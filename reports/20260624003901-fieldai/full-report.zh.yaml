      - number: '2.3'
        title: 买方画像与采用动态
        blocks:
          - type: paragraph
            body: >
              FieldAI 的 go-to-market 模式是 B2B 企业软件，通过多年期合同或 RaaS 协议卖给大型工业运营商。不同垂直的买方画像差异明显。


              建筑：总包商和基础设施开发商（Fortune 500 层级）。决策者包括 CTO、COO 和创新负责人。采购触发因素包括严重劳动力短缺（ABC 称 2026 年需要 349,000
              名净新增工人）、场站安全要求和数据采集强制要求。2025 年，92% 建筑公司称招聘困难，五分之一美国电工年龄超过 55 岁。机器人承担高风险巡检和监测任务，降低风险暴露。预算：CapEx 项目，或通过 RaaS
              转为 OpEx。采用模式：先在一种工地类型试点，再扩展到全队列 rollout。


              能源和公用事业：炼油厂、电厂、变电站、太阳能农场。决策者包括资产经理、HSE 负责人、工厂运营负责人。触发因素是监管合规、预测性维护 ROI 和危险环境限制。FieldAI
              声称在欧洲和日本已有部署，说明高监管市场已有早期采用者。


              采矿：FieldAI 投资方 BHP Ventures 验证了这个 thesis——BHP 称，在发现率下降、矿体更深的背景下，AI 和数据是「从发现到决策」优化的核心。无 GPS 环境天然适配 FFMs。


              制造和物流：AI 可将制造维护成本降低 25–40%，使用 AI 的生产设施中有 78% 报告废料减少（McKinsey/Tech-Stack 分析）。BCG AI Radar 发现，领先 AI 公司聚焦 3.5
              个用例（落后者为 6.1 个），实现 2.1× 更高 ROI。


              采用障碍很重。IBM 2026 年分析指出，数据准备度、治理与安全、证明 ROI、技能缺口和工作流集成是主要障碍。IFS 2025 Invisible Revolution Study 调研 1,700
              多名工业决策者后发现，只有 29% 愿意让 AI 自主做战略决策，68% 要求人类批准 AI 输出。只有 53% 企业拥有清晰 AI 战略，52% 高级领导称其管理团队不理解 AI。RaaS 定价（CAGR
              21.2%）正通过转向 OpEx 模式处理 CapEx 障碍。建筑和能源领域自主机器人的企业 B2B 销售周期为 12–24 个月，收入因此更不均匀，营运资本要求也高。
