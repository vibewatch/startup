            body: >-
              公开采用证据明显强于公开留存证据。采用方面，DPR 给出的指标最丰富：超过 45,000 张照片、行走超过 100 英里、覆盖 500,000 平方英尺室内空间、125,000 平方英尺屋面，以及在一个点名站点约
              1.5 年的运行时间。Big-D 给出最清楚的扩张信号：从超过两年的测试，转向更广的运营铺开。Boston Dynamics 又补上最强的匿名规模化证据，称部分建筑客户如今每天部署，检查和文档时间削减超过
              90%，并把试点扩成全队列项目。


              引用质量有高有低，但可用。Big-D 的 Shaun Orr 是点名 C-level 高管，在这家承包商任职 25 年；即便这段引用出现在公司关联报道里，对于建筑自动化客户引用来说，这种权威性仍然少见。DPR 的
              Justin Schreiner 离一线更近，给出了主管层面的具体运营细节。Certis 通过点名高管表态，提供了当前公司层面的证明，但公开成效仍停留在定性层面。三者共同缺少的是经典 SaaS
              耐久性层：NRR、续约率、流失、合同期限或客户满意度指标。因此，本报告能验证真实使用和扩张行为，却无法验证每个 logo 背后的耐久经常性经济性。
