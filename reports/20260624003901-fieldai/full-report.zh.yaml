      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的竞争护城河包括数据网络效应（来自数百个部署的专有运营数据反哺 FFM 改进，随着时间扩大泛化优势）、合同锁定（建筑、能源等受监管行业的多年期 RaaS
              合同切换成本高），以及参考客户密度（同行还停留在有限试点时，FieldAI 已在全球规模部署）。但这些护城河面临三类结构性风险。第一，Physical Intelligence 和 Skild AI 都在以
              FieldAI 当前估值 5–7 倍的水平融资，使其能更快扩张研究团队和算力。第二，开源发布（Physical Intelligence 的
              π0.5）让能承受更高集成成本的买方获得低成本替代方案。第三，NVIDIA 的 Isaac GR00T 和 Omniverse 平台——FieldAI 是其合作伙伴——如果 NVIDIA
              决定直接产品化仿真和推理栈，可能从赋能者转为竞争者。另一个负面信号是：FieldAI 运营 2 年多仍未披露具名企业客户，限制了对规模部署主张的独立验证。总体看，FieldAI 在 2026
              年工业垂直中的竞争位置差异化明显，但在 3–5 年视角下面临资源更强同行的风险，尤其是如果通用基础模型无需物理优先专门化，也足以完成工业任务。
