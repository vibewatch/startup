  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 投资结论极度取决于哪个收入分母为真，以及下行情景中结构条款是否咬住收益。
    data:
      items:
        - label: 较高 ARR 估算（约 $140M）
          value: 5
          detail: 负面敏感性较低，因为约 14.3x ARR 在需求可持续时可以匹配前沿 AI 定价。
        - label: 低收入估算（约 $5M）
          value: 10
          detail: 敏感性最高，因为约 400x 收入会非常极端。
        - label: 优先权悬顶
          value: 8
          detail: 下行敏感性高，因为结构可能封顶普通股回报。
        - label: 客户 / 留存证明缺口
          value: 9
          detail: 敏感性很高，因为估值取决于能否证明需求可持续。
        - label: 可比公司重估风险
          value: 6
          detail: 敏感性显著，因为私募市场同业泡沫可能快速压缩。
    approximationNotes: 公开证据不足以支撑干净的量化模型，因此这里给出定性敏感性条。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV021
      - CV022
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持很宽的结果区间，因为分母质量、结构和执行仍未解决。
    data:
      items:
        - label: 熊市企业价值区间
          low: 0.8
          high: 1.5
          unit: USD B
          detail: 如果收入质量令人失望或证明仍薄，可能出现 down-round 或结构化融资
        - label: 基准企业价值区间
          low: 1.8
          high: 2.5
          unit: USD B
          detail: 只有管理层能在尽调中证实收入质量时，当前标记才大体站得住
        - label: 牛市企业价值区间
          low: 3
          high: 5
          unit: USD B
          detail: 需要经审计的 ARR 增长、更广的具名客户，以及可合规扩张
        - label: 普通股结果区间
          low: 0
          high: 2.5
          unit: USD B residual to common
          detail: 剩余价值高度取决于优先权 waterfall 和下一轮条款
        - label: 隐含收入倍数区间
          low: 14.3
          high: 400
          unit: x revenue
          detail: 代表当前公开高低分母冲突
    approximationNotes: 区间是分析性判断，不是市场报价。普通股一行尤其受隐藏优先权和反稀释条款影响。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV023
      - CV024
      - CV026
      - CV028
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 风格快照，展示当前公开记录中哪些很强、哪些仍未验证。
    data:
      items:
        - label: 头部估值
          value: $2B
          detail: CNBC、Reuters 和 FieldAI 公开互相佐证
        - label: 已融资资本
          value: $405M
          detail: 资产负债表支撑很强，可继续执行
        - label: 收入可信度
          value: Low
          detail: 公开估算在 $140M ARR 和约 $5M 收入之间明显分化
        - label: 客户证明深度
          value: Medium-Low
          detail: 真实部署存在，但广度和留存披露不足
        - label: 结构风险
          value: High
          detail: 优先权悬顶可能损害普通股回报
        - label: 推荐
          value: Conditional
          detail: 定价承保前需要财务质量尽调
    approximationNotes: KPI 标签是摘要性判断，不是经审计指标。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV021
      - CV031
      - CV040
