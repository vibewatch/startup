      - number: '4.3'
        title: 资本充足性、烧钱代理与资本强度
        blocks:
          - type: paragraph
            body: >-
              FieldAI 财务图景中支撑最充分的部分是资本化。公司和多个独立媒体都同意，FieldAI 在连续两轮融资中筹集 $405M，其中包括一笔 $314M tranche，将估值推至
              $2B。官方募资用途表述也相当清楚：全球扩张、持续产品开发和激进招聘。Reuters 提供了最有用的运营代理，称员工数从 2024 年底约 30 人增至 2025 年 8 月的 130
              人，并计划到年底翻倍；GetLatka 后来估算员工 150 人。即使用保守的每人 $200K 全包成本计算，这也意味着在算力、设施、差旅、部署支持或一般管理费用之前，人员成本底线约为每年 $30M 到
              $36M。


              公开来源没有披露在手现金、真实月度 burn 或董事会层面的融资触发条件，因此 runway 必然基于估算。一个合理的公开情景框架是：工资、模型训练算力和现场运营合并后，月度 burn 约 $7M 到
              $10M。如果 $405M 融资中约一半已经投入使用，剩余现金将接近 $200M，隐含 runway 约 20 到 28 个月。相比垂直整合机器人公司，这个模式资本强度较低，因为 FieldAI
              看起来不承担机器人库存或制造 capex，且没有公开披露债务、项目融资或基于收入的融资。即便如此，UpsideList 的优先清算堆栈分析仍是一个有用的负面提醒：运营层面的资本充足，不等于普通股股东的经济账干净。
