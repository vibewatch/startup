      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              结构性驱动因素正在加速自主机器人智能平台的采用。


              结构性规模的劳动力短缺：美国建筑业 2026 年需要 349,000 名净新增工人，2027 年升至 456,000 名（ABC）。五分之一美国电工年龄超过 55 岁。到 2050 年，全球 65
              岁及以上人口占比将从 10% 升至 16%，部分地区超过 30%（Barclays）。制造业和农业劳动力老化速度快于城市，形成手工招聘无法填补的结构性缺口。


              Physical AI 投资超级周期：2025 年全球机器人 VC 融资 $40.7B（CBInsights），占全部风险投资 9%。2025 年 Q2 机器人交易额达到 $8.8B，环比激增
              170.5%。NVIDIA、Amazon、BHP、Intel 等企业投资方下注战略投资。世界模型投资从 2024 年 $1.4B 激增至 2025 年 $6.9B，验证了 FieldAI 的 Belief
              World Model（BWM）架构。


              机器人装机基数扩大：2024 年全球安装 542,000 台工业机器人（IFR），是十年前的两倍。总运行存量达到 4,664,000 台（同比 +9%）。IFR 预计 2025 年安装量为 575,000 台，到
              2028 年超过 700,000 台。亚太贡献全球工业机器人收入的 67.3%，仅中国就占新增部署的 54%——这为 FieldAI 国际扩张提供了背景。


              政府和国防：美国 DoD 已为自主地面系统拨款 $1.3B，为经验证技术创造采购机会。Barclays 估算，到 2035 年全球国防支出将达到 $4.4–$6.6T，拉动自主系统需求。


              关键约束：组织准备度缺口——IFS 发现 99% 劳动力需要再培训，53% 企业缺乏 AI 战略，88% 使用 AI 但只有 33% 实现规模化。BCG AI Radar 显示，多数公司把 AI
              努力摊在太多用例上。EU AI Act 合规（高风险义务，第 9–15 条，自 2026 年 8 月起）给国际运营增加摩擦。中国 physical AI 玩家正积极在已确认订单之前建设 100K–1M
              台产能（Goldman Sachs），这是中期竞争风险。2026 年工业机器人市场估算分散在 $15.5B–$61.1B，说明行业叙事膨胀，也可能存在「跨越鸿沟」风险。
