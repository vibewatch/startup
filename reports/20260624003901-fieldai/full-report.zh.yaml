      - number: '4.2'
        title: 单位经济、成本结构与 GTM 效率代理
        blocks:
          - type: paragraph
            body: >-
              FieldAI 尚未公布毛利率、CAC、回本期、NRR、合同期限或客户集中度，因此公开单位经济只能从机制而非披露搭建。可用的公开可比对象是 AI-native SaaS 和企业 AI
              基准：它们显示，AI-native 公司的结构性毛利率低于经典软件，因为推理、编排、检索和支持都是真实可变成本。多份 2026 年基准来源显示，AI-native 毛利率集中在 50% 到 65%
              区间，而更传统软件业务仍以约 80% 软件毛利率为中心，加入服务后混合毛利更低。对 FieldAI 来说，关键问题不是它能否最终看起来像纯 SaaS，而是每份合同里有多少部署支持和现场服务内容。


              存在一个合理的正向抵消。FieldAI 的架构在边缘端决策，而不是持续在云端运行；相对依赖云的 AI 应用，这应能减少一项主要可变 COGS
              来源。但边缘推理并不会消除劳动密集型部署、客户成功、模型训练算力、安全验证和全球现场运营。GTM 也很可能昂贵：Reuters 指向数百万美元级企业合同和快速国际扩张，而通用 SaaS 基准显示，健康经济性需要
              3:1 LTV/CAC 和低于 18 个月回本期。没有真实 cohort 数据时，审慎立场是：FieldAI 可能在规模化后实现良好单位经济，但当前公开证据只支持情景区间，而不是已验证的利润率路径。
