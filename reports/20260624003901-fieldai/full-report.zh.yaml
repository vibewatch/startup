      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              FieldAI 的市场可以用三种互补视角测算：广义 physical AI TAM、直接垂直 SAM，以及从可部署机器人队列自下而上的 SOM。


              广义 TAM — Physical AI 软件（2026）：机器人和 physical AI 初创公司在 2025 年融资创纪录达到 $40.7B，同比增 74%，占全部风险投资的 9%（CB
              Insights）。PitchBook 数据显示，2025 年有 1,009 笔交易、总额 $27.6B，是 2024 年总额的两倍多。Information Matters 的 2026 年 Q1
              agentic AI 市场报告，从一手披露自下而上估算，认为 2026 年 agentic AI TAM 为 $40B（区间 $33–$48B）。Goldman Sachs 估算，仅人形机器人市场到 2035
              年就为 $6B（基准情景）到 $154B（蓝天情景），显示这个市场仍处早期。Gartner 预计，到 2028 年，33% 的企业软件将包含 agentic AI，高于 2024 年不到 1%。


              垂直 SAM — FieldAI 可部署市场（2026）：三大主要应用市场到 2026 年合计约 $16–22B：建筑机器人（$7.79B，CAGR 18.9%）、自主巡检机器人（$3.20B，CAGR
              13.9%）和采矿无 GPS 自主（Sacra 估算到 2030 年为 $3–4B）。再加上制造现场机器人（估算 $2–3B），得到合并
              SAM。Robotics-as-a-Service（RaaS）市场——最接近 FieldAI 部署模式——2026 年规模更窄，为 $2.57B，CAGR 21.2%，反映的是已实现订阅收入，而非总潜力。


              自下而上 SOM — FieldAI 捕获率：IFR 报告称，截至 2024 年底，运行中的工业机器人为 4,664,000 台，同比增 9%。2024 年新增安装量达到 542,000 台，预计 2025
              年增至 575,000 台。每台新增移动机器人都是潜在的 FieldAI 改装客户。按约 $100M–$140M ARR（非正式 / 未审计估算）计，FieldAI 已捕获窄口径 SAM 的约
              <1%——这与早期平台在一个 88% 企业使用 AI、但只有 33% 实现规模化的市场中的位置一致。


              一个重要提醒：根据定义口径不同，2026 年工业机器人市场估算横跨
              $15.5B–$61.1B，反映新兴市场规模测算的常见弱点。分析师会混合硬件和软件价值，纳入或排除集成服务，并使用不同垂直定义。如此宽的估算区间，会带来买方预期被抬高和投资人 TAM 叙事膨胀的风险。
