  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 12–18 个月内 ARR 证明超过 $200M；具名客户基础扩大；合规文件站得住；合作伙伴杠杆保持有利
        - 如果 FieldAI 成为品类领导者，可能支撑 $3B-$5B 后续估值或更高退出
        - 执行复杂度、资本军备竞赛和合规负担仍然重要
        - 可能发生，但需要多项未经证明的披露同时向好
      - - 基准
        - 当前估值大体守住，但前提是管理层在 NDA 下补齐收入质量和集中度缺口
        - 近期倍数扩张有限；回报取决于有纪律的入场条款和证据转化
        - 证据质量仍然混杂，客户广度偏窄
        - 今天公开证据最能支撑的情景
      - - 熊市
        - 确认收入不及预期，客户广度仍不透明，或下一轮引入更多结构、却没有更多证明
        - 即便企业价值增长，下轮估值下调或结构化融资也可能抹掉普通股上行
        - 优先权栈、集中度和竞争对手花钱能力共同放大下行
        - 公开数据下的下行情景仍然非常现实
    notes: 情景不是模型输出；它们是在二级数据互相冲突、公开财务披露有限条件下的承销框架。
    claimRefs:
      - CV006
      - CV007
      - CV023
      - CV024
      - CV026
      - CV027
      - CV028
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 公开估值 / 状态
      - 收入或分母
      - 对 FieldAI 的隐含读数
      - 局限
    rows:
      - - FieldAI
        - 融资 $405M 后估值约 $2B
        - 收入估计互相冲突：约 $140M ARR vs 约 $5M 收入
        - 直接构成当前承销问题
        - 底层分母未经验证
      - - Physical Intelligence
        - 2026 年融资讨论中估值约 $11B
        - 没有干净的公开收入披露
        - 显示前沿具身 AI 标的估值可明显高于 FieldAI
        - 同业自身可能估值偏高，也不是干净锚点
      - - Skild AI
        - 融资 $1.4B 后估值 >$14B
        - 发布稿中没有有意义的公开收入披露
        - 显示资本市场会用更高估值奖励通用机器人叙事
        - 如果同业同样泡沫化，不能证明 FieldAI 便宜
      - - Figure AI
        - 估值约 $39B，前商业化人形机器人大规模叙事
        - 前商业化 / 公开经济性有限
        - 只能作为硬件更重 AI 可比的上限
        - 过于硬件中心且估值极端，不适合直接用于倍数
      - - Covariant
        - 估值约 $2.7B / IPO 状态参考
        - 当前来源集中收入没有干净公开
        - 相比人形机器人，更接近软件型机器人先例
        - 仍不是干净、充分披露的公开可比
      - - Brain Corp / Tennant 背景
        - 具公开公司 / 企业自主化背景，并披露规划节奏
        - 存在公开公司备案背景，但 Brain Corp 不是直接披露的独立公开可比
        - 有助于提醒：成熟自动化可比公司会披露真实财务
        - 垂直场景和经济性不同于 FieldAI
    notes: 这张表刻意混合不同参照物，因为公开市场里没有单一、干净的可比公司。更合适的读法是把它当作交叉校准集合，而不是精确倍数公式。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows include the most cited embodied-AI and autonomy-platform comparables surfaced in public research and
        earlier chapters as of June 2026. Several private peers lack disclosed revenue, so direct multiple comparison is
        necessarily incomplete.
