      - number: '8.4'
        title: 建议、置信度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              条件性建议，是唯一贴合公开证据的看法。公司有太多真实优势，不能条件反射式放弃：产品故事强于多数机器人初创，资金底座有分量，客户引用也足以否定 FieldAI 仍处于产品前阶段的说法。但验证缺口太宽，不能只凭
              headline 估值投资。公开证据没有钉住经审计 ARR、确认收入、客户集中度、流失或精确下行条款，而这些输入决定一个估值是优质 AI 倍数，还是 cap table 陷阱。


              置信度是中等，不是高，因为同一套公开数据既能支持一个合理的牛市解读，也能支持一个不合理的熊市解读。风险评级应保持高位，因为不透明商业指标和潜在结构放大了下行。下一步尽调很清楚：要财务质量的证明，而不是更多叙事。如果管理层能拿出
              CFO 认证 ARR、客户集中度、续约行为和完整优先权栈条款，公司可能值得认真建立投资 case。没有这些证据，当前 $2B 标记仍是估值不可验证，而不是可投资的合理或明确高估。
