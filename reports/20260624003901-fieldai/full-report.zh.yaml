      - number: '7.2'
        title: 人员、伙伴与执行风险
        blocks:
          - type: paragraph
            body: >-
              Ali Agha 同时是创始人、CEO、公开技术解释者，也是 FieldAI 物理优先 thesis
              的外部符号。这种集中有利于融资和叙事清晰度，但也带来关键人风险：一个人同时锚定技术可信度、招聘吸引力、客户信任和平台愿景，领导层扰动的下行就异常高。Reuters
              关于人数增长的报道，以及公司自己的全球野心，又加了一层难度：从约 130 人起步、计划把人数翻倍，同时支撑美国、欧洲、亚洲和联邦渠道的多垂直部署，即便对资金充足的团队也很难。


              伙伴依赖放大了执行负担。NVIDIA、Ouster、Boston Dynamics、Certis 和 Detroit Defense 都帮助 FieldAI
              触达原本难以独自进入的市场或技术能力，但也制造了平台杠杆、传感器供应、上市控制权和终端客户关系归属等失效模式。NVIDIA
              是最清楚的例子，因为它同时是投资方、基础设施提供方，也为彼此竞争的机器人初创公司背书生态。最好情况下，这会加速 FieldAI；最坏情况下，它会削弱议价能力，并在重心转向其他 NVIDIA 支持的具身 AI
              栈时，让 FieldAI 暴露在风险里。
