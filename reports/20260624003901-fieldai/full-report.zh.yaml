companyProfile:
  summary: >-
    FieldAI（2023 年成立，总部位于加州 Irvine）开发 Field Foundation Models（FFMs），这是一套物理优先的 AI 软件，让任何机器人——人形、四足、轮式或空中平台——都能在无
    GPS、无地图、非结构化的工业环境中自主运行。公司的 EDGE 平台在边缘端以低于 100ms 的延迟运行，作业时不依赖云端，并已在美国、欧洲、日本的建筑、制造、能源和物流垂直领域实现商业部署。FieldAI 从 Bezos
    Expeditions、Khosla Ventures、NVIDIA NVentures、Temasek、Intel Capital、Samsung、Gates Frontier 和 Canaan Partners 融资
    $405M（$91M Series A + $314M Series A-1），2025 年 8 月估值达到 $2B。公司还运营一家联邦子公司（FieldAI Federal），面向国防和政府合同。
