figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从 2020 年赢下 DARPA SubT，到 2026 年 6 月与 Ouster 展开激光雷达合作，八个带日期的关键里程碑勾勒出 FieldAI 从研究突破走向工业规模商业部署的轨迹。
    data:
      items:
        - label: 2020：赢下 DARPA SubT Urban Circuit
          detail: Team CoSTAR 赢下 Urban 阶段；首次完成公里级全自主四足机器人探索；11 台异构机器人在无 GPS 地下环境协同——奠定了技术证明
          tone: positive
        - label: 2023：FieldAI 成立（Irvine, CA）
          detail: Agha 离开 NASA JPL，与 Omidshafiei 和 Fan 共同创办 FieldAI；开始秘密开发物理优先的 Field Foundation Models（FFMs）
          tone: positive
        - label: 2024：Series A，估值 $500M
          detail: 完成 Series A，投资方包括 Samsung、Gates Frontier、Khosla Ventures、Canaan Partners；首批商业部署进入建筑、能源、安全等领域
          tone: positive
        - label: 2025 年 8 月：累计融资 $405M，估值 $2B
          detail: 完成 $314M A-1 轮，由 Bezos Expeditions、Prysm、Temasek 共同领投；累计融资 $405M；超额认购；估值跃升 4×；公司公开走出隐身状态
          tone: positive
        - label: 2025 年 8 月：NVIDIA Omniverse 合作
          detail: 加深与 NVIDIA Omniverse 的集成，用于创建数字孪生和合成数据管线；加速大规模真实世界数据飞轮
          tone: positive
        - label: 2026 年 3 月：Boston Dynamics 合作
          detail: 将 FFMs 集成到 Spot 四足机器人，面向建筑和工业环境；公司称巡检时间缩短 90%+；计划建设全球最大 Spot 第三方机队
          tone: positive
        - label: 2026 年 4 月：$100M+ 收入信号（OCBJ）
          detail: OCBJ 工厂参访披露，公司在三大洲覆盖数百个站点、数十家企业客户；非正式来源称订单收入超过 $100M
          tone: neutral
        - label: 2026 年 6 月：Ouster Rev8 激光雷达合作
          detail: FieldAI 集成 Ouster Rev8 原生彩色激光雷达，增强无 GPS 工业感知能力；面向生产级安全关键应用
          tone: positive
    approximationNotes: Series A 轮规模为推断值；仅知道月份 / 年份时，日期为近似值。
