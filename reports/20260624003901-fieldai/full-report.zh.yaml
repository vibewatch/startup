          - type: paragraph
            body: >-
              客户侧的反向解读不是失败证据，而是披露过窄的证据。在 $2B 估值、并围绕数百个部署讲述故事的情况下，公开的点名客户证明仍然偏薄。建筑仍主导已披露客户基础，安保主要由 Certis
              代表，美国以外更广的地域主张大多未点名。GetLatka 明确表示没有客户数量信息，Robotics.press 则指出缺少公开披露、带量化结果的点名客户案例，也缺少独立 traction 基准。即便
              Boston Dynamics 和 Robots in Construction 给出的规模证据最有用，也仍依赖未点名的 ENR 前 10 建造商，而不是一份广泛、可归属的 logo 名单。


              这带来两类风险。第一，客户集中度可能远高于表面，因为公开引用可能过度代表少数旗舰部署。第二，伙伴主导的分发可能模糊 FieldAI 到底在哪里拥有客户关系，哪里只是站在 Certis、Boston
              Dynamics 或联邦集成商背后。积极的一面是，已审阅来源中没有公开流失、投诉或竞争性丢单事件，Big-D 与 DPR 也显示出真实运营价值。因此，正确的客户结论是「真实
              traction，但广度披露不足」：证据足以否定 FieldAI 没有客户的说法，却不足以高置信度支撑客户数量、留存质量或集中度判断。
