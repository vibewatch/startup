  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与证据质量
        blocks:
          - type: paragraph
            body: >-
              估值故事中能被直接交叉验证的部分很简单：FieldAI 融资约 $405M，并在 2025 年 8 月被标记为 $2B。之后的部分就更乱。GetLatka 估算 ARR 约 $140M，CompWorth
              公开档案却指向仅约 $5M 收入，两者都没有管理层认证。UpsideList 以另一种方式提示谨慎：它估算优先权悬顶约
              $506M，并强调普通股之上可能已经堆了多少下行结构。换句话说，价格看得见，但底层分母的质量看不见。


              这个区别决定了整章。一家私营公司如果收入高速复合、客户留存强、下行条款可控，就可以支撑高 headline 估值。公开证据还不能让 FieldAI
              跨过这些门槛。公司确实有真实优势——资金、战略投资者、部署证明和有吸引力的产品叙事——但公开记录没有说明，投资者买的是 14x ARR 的前沿 AI 领导者，还是约 400x
              收入、披露不足的初创公司。因此，合适的估值立场应从证据质量开始，而不是从整齐的倍数对比开始。
            claimRefs:
              - CV001
              - CV002
              - CV003
