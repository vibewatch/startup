      - number: '3.2'
        title: 既有厂商与邻近软件竞争者
        blocks:
          - type: paragraph
            body: >-
              Brain Corp（San Diego，累计融资约 $221M，2026 年收入约 $117M）运营 BrainOS，这是领先的商用机器人自主 OS，通过以 Tennant Company 为首的 OEM
              合作伙伴在全球部署超过 10,000 台机器人。Brain Corp 的强项在于商业规模部署，以及借助 Tennant 全球销售队伍分发；但它局限于结构化、室内、依赖地图的环境——这正是 FieldAI
              设计要跨过去的用例。Covariant（Berkeley，累计融资约 $222M，此前估值 $2.7B）打造过 AI 拣选「robot brain」平台，但在 2024 年 9 月被 Amazon 反向
              acqui-hire，领导团队被掏空；公司在新管理层下继续运营，但面临战略不确定性。Intrinsic（截至 2026 年 2 月已成为 Google 一部分）提供
              Flowstate，一个面向制造和物流的无代码机器人平台。Intrinsic 并入 Google，意味着可获得企业分发、云基础设施和 DeepMind 的 AI stack——这个组合对 FieldAI
              构成长线平台竞争风险。Exyn Technologies（Philadelphia，2026 年 5 月 IPO，累计融资约 $57M）提供面向无 GPS 采矿环境的高自主空中机器人；它在地下 / 工业巡检上与
              FieldAI 重叠，但硬件特定（仅空中）且规模更小。Viam Robotics 提供开发者导向、广泛支持硬件的机器人平台，在软件层竞争；Figure AI（融资 $1.9B，估值 $39B）和 Agility
              Robotics 领先人形硬件层，与 FieldAI 的人形兼容主张有交集，但它们是硬件特定，而非软件层竞争。
