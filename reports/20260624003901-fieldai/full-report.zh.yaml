    title: 客户
    sections:
      - number: '6.1'
        title: 具名客户证明与客户细分
        blocks:
          - type: paragraph
            body: >-
              FieldAI 公开客户证据的宽度，明显跟不上它讲的市场故事。可点名、可核验的 logo 主要挤在建筑和相邻的安保运营里：Big-D Construction、DPR Construction 和
              Certis。Big-D 与 DPR 是最清楚的客户证明，因为它们绑定了具体建筑流程、可点名的运营引用和部署细节；Certis
              把组合扩展到安保运营，但它更像战略部署伙伴和通往终端站点的渠道，而不是披露合同条款的传统企业软件客户。相比之下，Detroit Defense 更适合被看作联邦技术伙伴，而不是客户证明。


              因此，分层故事有两层。第一层是建筑板块很强，项目和高管运营方给出了买方侧证据。第二层更宽但更弱，覆盖亚洲、欧洲、美国以及安保或联邦用例里的未点名部署。Boston Dynamics 和 Robots in
              Construction 帮助补足第二层：它们指向未点名的 ENR 前 10 建造商和 4 个已确认部署。但这些来源没有补上核心披露缺口：FieldAI
              仍未公布清晰的付费客户数、站点数，或按垂直行业拆分的客户结构。
