      - number: '5.4'
        title: 信任、安全、安保、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的公开产品文案强调风险感知、不确定性下的保守适应、密集避障、语义感知，以及在无 GPS
              或危险环境中的边缘部署。这些主张与工业买方需求方向一致：低延迟本地推理、弱连接韧性，以及即使网络退化也能继续可用的安全功能。标准背景也变得更严格。ISO 10218 的 2025
              年修订明确强化了功能安全、协作运行和网络安全预期，而 ISO 13849 仍是安全相关控制性能等级的参考。任何部署在真实工业或建筑场站的机器人，都必须把这种标准背景看得和原始自主能力一样重要。


              缺口在文档。为本章审阅的公开来源中，没有任何一个提供具名 ISO 10218 或 ISO 13849 认证、已发布 PL 计算、经验证停止功能表现、事故统计、uptime/SLA 披露，或正式商业
              safety-case
              包。这不意味着控制不存在；它意味着公开证据标准仍弱于部署和营销叙事。对尽调来说，这会把产品技术结论从「突破性架构」推到「架构强，但有文档风险」：信任故事可信，且越来越有合作伙伴背书，但可测量的质量和合规层仍需要
              NDA 下的一手证据。
