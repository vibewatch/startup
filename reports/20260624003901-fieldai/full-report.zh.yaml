chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              FieldAI 于 2023 年正式注册，总部位于加州 Irvine，把自己定位为一家「大脑公司」——为第三方机器人硬件提供自主智能的纯软件公司。公司打造 Field Foundation
              Models（FFMs），这是一类专有、物理优先、风险感知的基础模型，从一开始就面向具身机器人设计，而不是把语言或视觉模型改装过来。FFMs
              让各种形态的机器人——四足、人形、轮式机器和乘用级车辆——都能在非结构化、无
              GPS、无地图的环境中安全自主运行。平台完全在边缘端做部署决策，不需要云连接；对远程工业和联邦应用来说，延迟和连接都是约束，这一点就是关键差异。

              商业模式是软件即服务：FieldAI 将其自主平台（品牌名 EDGE）授权给拥有或采购第三方机器人硬件的企业客户。公司不造机器人硬件，这是有意为之：相比 Figure AI
              等垂直整合竞争者，资本需求更低，可触达市场也更宽。定价范围很宽，从每次部署约 $3,000 到超过
              $500,000，取决于机器人类型、场站规模和任务复杂度。目标垂直包括建筑、能源与采矿、制造、城市配送与巡检，以及联邦和国防。公司运营专门的联邦子公司 FieldAI Federal，服务政府和国防客户。

              到 2026 年 6 月，FieldAI 声称已在三大洲（北美、欧洲、亚太）数百个场站完成数千次任务的生产部署，并把自己定位为工业 AI 软件公司中通用机器人部署的领导者。与 NVIDIA Omniverse
              的合作让每个客户部署都能反哺真实世界数据飞轮，加快模型改进；公司认为，这会形成后来者难以复制的复合运营优势。FieldAI 的硬件无关路径，让它区别于 Boston
              Dynamics（硬件和软件垂直整合），也区别于同样瞄准硬件无关操作的 Physical Intelligence（pi.ai）。
