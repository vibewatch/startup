  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、细分与替代品
        blocks:
          - type: paragraph
            body: >
              FieldAI 的市场是自主机器人智能软件——具体说，是让机器人在无 GPS、无预建地图的非结构化工业环境中导航、巡检和作业的 Field Foundation Models（FFMs）。这个市场位于
              physical AI 软件、工业机器人和企业自动化即服务的交汇处。


              最宽口径是全球工业机器人市场：2025 年 $53.2B，预计 2026 年达到 $61.1B，CAGR 为 15%（Business Research Company）。但 FieldAI 销售的是软件和 AI
              推理，不是机器人。它的直接竞争市场，是面向工业现场作业的自主机器人软件和智能层。MarketsandMarkets 将更广义工业机器人市场规模定为 2026 年 $15.5B，到 2032 年增至
              $20.8B，CAGR 为 5.0%——这是更窄、更偏硬件的口径。


              FieldAI 的主要应用市场是建筑自动化、工业巡检（能源、公用事业、基础设施）、采矿和能源作业，以及制造物流。关键市场边界：

              - 纳入：面向在非结构化工业环境运行的移动机器人的 physical AI 软件；自主巡检、进度监测、材料运输和场站侦察；无需云连接即可工作的边缘推理平台。

              - 排除：固定机械臂工厂自动化（焊接机器人、SCARA 机械臂）、消费机器人、手术机器人、自动驾驶车辆（汽车 / 卡车）、无人机监控，以及不控制物理机器人的通用企业 AI 软件。

              - 替代品：人工劳动力、需要预建地图的传统 SLAM 机器人、远程操作服务、没有机器人自主能力的 BIM 集成软件套件，以及由人类绳索进入团队执行的操作员中心型巡检服务。


              建筑机器人子市场 2026 年为 $7.79B（Business Research Company 和 GII Research 给出的 CAGR 为 18.9%）。Zacua Ventures 的 2026
              Construction Robotics Report 确认，「现场建筑机器人收入在全球只有低个位数十亿美元，年增长率大约在十几个百分点中段」。自主巡检机器人市场（能源、公用事业、基础设施）由 FactMR
              单独估为 2026 年 $3.2B（CAGR 13.9%）。Sacra 估算采矿场景无 GPS 自主到 2030 年每年为 $3–4B。合并这些垂直，到 2026 年可服务可触达市场约为 $16–22B。
