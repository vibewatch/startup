  - id: TV005
    title: 论点失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入质量落空
        - CFO 认证 ARR 或确认收入远低于融资叙事
        - 高倍数逻辑被打穿，股权结构风险上升
        - 从有条件推进转向放弃
      - - 客户证据停滞
        - 12 个月内没有新增独立具名客户或量化结果
        - 证实牵引面太窄，撑不起当前价格
        - 假设市场叙事已跑在现实前面
      - - 结构性降价轮
        - 下一轮包含重清算优先权、反稀释，或更低名义价格
        - 普通股回报模型在结构上转为不利
        - 将当前估值视为财务上脆弱
      - - 合规 / 安全失败
        - 发生重大事故、审计未通过，或无法提供安全论证文件
        - 客户信任和退出准备度同时被削弱
        - 下调产品成熟度评级
      - - 生态挤压
        - NVIDIA 支持的同行获得明显更强的平台杠杆或渠道入口
        - FieldAI 的相对议价能力和高倍数被压缩
        - 提高要求回报，或直接退出
    notes: 这些触发因素刻意设成二元判断，因为现有公开记录对缺失变量几乎没有软性解释空间。
    claimRefs:
      - CV022
      - CV028
      - CV029
      - CV030
      - CV036
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR / 收入质量
        - CFO 认证 ARR、确认收入，以及订单到收入的桥接
        - 决定倍数更接近约 14x，还是类似约 400x
        - 管理层 / CFO，需 NDA
      - - 股权结构和优先权
        - 完整优先股条款、清算优先权、反稀释和优先级瀑布
        - 普通股回报可能与企业价值结果大幅偏离
        - 公司律师 + 领投方
      - - 客户集中度和留存
        - 头部客户集中度、续约计划、NRR / 流失率，以及直销与渠道收入拆分
        - 检验商业模式韧性和集中度风险
        - 收入运营 + 财务
      - - 安全与合规准备度
        - 部署安全论证包，以及欧洲 / 联邦合规地图
        - 退出准备度和可规模化部署信心都需要这一项
        - 产品、安全和法务团队
      - - 可比基准
        - 相对同行的独立性能、利润率和部署基准
        - 帮助区分类别龙头溢价与叙事膨胀
        - 第三方尽调或专业顾问
    notes: 这些是最低限度的尽调要求，只有补齐后，建议才能从有条件推进转向真正投资或放弃。
