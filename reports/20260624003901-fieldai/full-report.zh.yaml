      - number: '1.2'
        title: 创始人、领导团队与关键人风险
        blocks:
          - type: paragraph
            body: >-
              FieldAI 由 Dr. Ali Agha（CEO）和 Dr. Shayegan Omidshafiei（现任 President 兼 CSO）共同创立。创业前，两人都在自主机器人和 AI 领域深耕多年。Dr.
              Agha 在 NASA Jet Propulsion Laboratory 工作七年，担任 DARPA Subterranean Challenge、DARPA RACER（越野自动驾驶车辆）、NASA
              Autonomous Mars Cave Exploration，以及 Mars Helicopter-Rover 协同自主原型项目的 Principal Investigator。他带领 Team
              CoSTAR（JPL-MIT-Caltech-KAIST-LTU）赢得 2020 DARPA SubT Challenge Urban Circuit——这是多机器人、无 GPS
              探索比赛的标志性节点，首次用四足机器人实现完全自主的数公里探索，并同时协调最多 11 台异构机器人。加入 JPL 前，Dr. Agha 曾在 MIT 和 Qualcomm 做研究，并于 2016 年创立
              Qualcomm 的机器人自主项目。他此前没有创办过风投支持公司的经历，但研究履历包含十余年的 AI 和自主系统发表记录。

              Dr. Omidshafiei 带来十年以上自主机器人和机器学习经验，其中超过五年在 Google DeepMind 担任领先 Research Scientist，专注大规模 AI
              模型训练和多智能体强化学习。他拥有 MIT 博士学位，最初是在 MIT 与 Dr. Agha 相识。技术领导层还包括 Dr. David Fan（CTO），同样曾在 JPL 和 DARPA 项目任职；以及
              Eric Krotkov（Business Development），OCBJ 称其为 PackBot 和 Talon 军用机器人的「祖父」。Andrew Mullen 负责硬件战略，并在 Ouster
              合作公告中被引用。Duncan McIntyre 担任 CFO。

              领导团队集中了深厚的野外机器人履历，并直接对应 FieldAI 正在解决的核心技术难题——这是有意义的 founder-market fit 信号。但这也带来集中在 Dr. Agha
              身上的关键人风险：他的公开形象和技术信誉，是客户与投资人信心的核心。董事会构成仍未知，这是明显的治理缺口。截至 2025 年 8 月，Reuters 确认公司员工从 2024 年底约 30 人增至 2025 年
              8 月的 130 人，并计划到 2025 年底翻倍。到 2026 年 4 月，OCBJ 的设施参观和 LinkedIn 显示员工在 201 至 500 人之间，说明激进招聘仍在继续。
