      - number: '4.4'
        title: 公开财务缺口与承销结论
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的公开数据足以说明投资人把它当作具身 AI
              突破型公司定价，但不足以确认这个估值是否建立在耐久的经常性经济性之上。第三方数据集不仅在收入上分歧，连融资细节和员工数快照也不一致：PremierAlts 列出五轮融资共 $506.1M，而公司和 Reuters
              描述的是连续两轮共 $405M；PitchBook 2025 年中员工快照也明显落后于后续新闻报道。这个不一致本身就是财务事实，因为它降低了任何数据库推导倍数分析的可信度。CompWorth 的 $5M 估算和
              GetLatka 的 $140M 估算，意味着完全不同的估值数学：从偏贵的风险软件，到几乎纯叙事。


              因此，承销结论分两部分。第一，FieldAI
              近期资本大概率足够继续扩张，尤其因为其模式避开了沉重的机器人制造营运资本。第二，公司仍未达到收入质量的公开证据标准：没有经审计财务、没有按收入流披露毛利、没有客户集中度数据、没有 churn
              或留存数据，也没有披露现金余额。对尽调报告来说，正确结论不是破产风险，而是信息风险。在承销 $2B 估值前，投资人应要求提供经审计或 CFO 认证的
              ARR、收入确认政策、按收入流毛利、最新现金余额、burn，以及大客户暴露。
