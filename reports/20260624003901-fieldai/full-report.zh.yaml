  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接基础模型竞争者
        blocks:
          - type: paragraph
            body: >-
              FieldAI 最接近的竞争对手，是另外三家纯机器人基础模型提供商：Physical Intelligence（San Francisco，2026 年 3 月估值 $11B）、Skild
              AI（Pittsburgh，2026 年 1 月估值 $14B）和 Google DeepMind 的 Gemini Robotics stack。三者都追求硬件无关、可泛化的模型，可以驱动不同机器人形态——这与
              FieldAI 的核心定位相匹配。Physical Intelligence 的 π0 系列和 Skild AI 的 Brain model 是开源或广泛可得的，降低了机器人 OEM 采用 FieldAI
              EDGE 平台替代方案的门槛。Google DeepMind 的 Gemini Robotics-ER 1.6 在 2026 年 2 月通过 Intrinsic 集成并纳入 Google
              企业基础设施，带来任何初创公司都无法匹配的分发能力。FieldAI 声称的关键差异，是聚焦工业非结构化环境，以及物理优先模型架构；相比之下，PI 和 Skild 更像是通用、实验室数据训练出的 VLA
              路径。FieldAI 还强调，它已在三大洲数百个场站实现真实生产部署，而 Physical Intelligence 和 Skild AI 在工业用例上仍主要处于试点或量产前阶段。FieldAI 声称低于
              100ms 的边缘推理延迟，以及在危险环境中无 GPS、无地图运行，这些仍是直接同行中无人公开匹配的主张。
