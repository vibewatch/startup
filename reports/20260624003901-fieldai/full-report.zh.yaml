  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - FieldAI 可能成为杂乱真实世界机器人的自主 OS
        - 可支撑高溢价的软件型经济性和战略稀缺性
        - 需要经审计的 ARR 增长、更低实施负担和更宽的具名客户集合
      - - 硬件无关部署创造跨机器人杠杆
        - 可能比垂直一体化机器人 OEM 支撑更好的资本效率
        - 需要证明合作伙伴依赖不会压住利润率或议价能力
      - - 当前估值可能已计入品类领导地位
        - 若属实，即便公司成功，从这一价格进入的上行空间也可能有限
        - 需要入场纪律，或用结构条款补偿证据风险
      - - 收入质量不确定可能让整套倍数分析失效
        - 如果低个位数百万美元收入更接近现实，下行会很严重
        - 需要确认收入桥接，以及续约 / 扩张质量数据
      - - 优先权栈可能先吸收未来下行，普通股才参与
        - 回报结果取决于结构，不只取决于企业价值增长
        - 需要完整 cap table 和清算优先权栈，并包含反稀释条款
    notes: 反方论点主要受证据质量支配，而不是单一产品失败。因此，追加尽调仍可能实质性改变建议。
    claimRefs:
