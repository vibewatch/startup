      - number: '1.3'
        title: 融资历史、投资人图谱与资本状况
        blocks:
          - type: paragraph
            body: >-
              FieldAI 在 2025 年 8 月 20 日宣布的连续两轮融资中共筹集 $405 million。最近一笔是 $314 million 的 Series A-1，由 Bezos
              Expeditions（Jeff Bezos 的个人投资办公室）、Prysm Capital 和 Temasek 共同领投。更早一笔是 Series A，投资方包括 Gates
              Frontier、Samsung、Khosla Ventures 和 Canaan Partners。2025 年 8 月的两轮融资被描述为超额认购，FieldAI 称多数投资人接触来自主动找上门。合并后的
              $2B 投后估值，相比 2024 年上一轮 Series A 约 $500M 估值大约上调 4 倍。Reuters 和 TechCrunch 报道都称，两轮都是定价股权融资，而非过桥票据。

              值得注意的投资人动态包括：NVIDIA 的风投部门 NVentures 在既有技术合作之外参投，让 FieldAI 的 NVIDIA Omniverse 集成与财务激励形成战略一致性。Intel Capital
              和 BHP Ventures（矿业集团）增加了特定工业领域的可信度。Emerson Collective（Laurene Powell Jobs 的慈善 / 投资载体）和 Canaan Partners
              也在股东名单中。Bill Gates 公开写博客背书 FieldAI 的路径，称公司使命是为其他公司机器人开发 AI 软件，让机器人能够感知环境并在无 GPS 情况下导航。

              Latka 报道称截至 2025 年 6 月 ARR 为 $140M，OC Business Journal 引用非正式来源称公司有「超过 $100M
              的已签收入和合作」。两个数字都未被独立验证。UpsideList 的独立分析估算，相对 $2B 名义估值，优先清算堆栈为 $506M（约占股权 25.3%），并给出 50% 概率的熊市情景：如果 NVIDIA 或
              Boston Dynamics 内化类似能力，普通股可能被完全抹去。公司尚未披露经审计财务、股权结构表或债务 / 信贷额度细节。
