      - number: '7.3'
        title: 技术、监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              FieldAI 正好站在监管者和企业买家最在意的位置：AI 驱动的机器在危险、变化的环境中移动，数据不完美，失败后果很重。因此，物理优先、风险感知边缘自主的技术上行，无法和监管及安全风险切开。OSHA
              仍依赖一组可适用的机器安全规则拼图，而不是单一机器人专门标准；欧盟和美国框架正在收紧。EU AI Act 为高风险 AI 系统引入可执行义务，Machinery Regulation
              提高了自适应自主机械的合规要求，ANSI/A3 和 ISO 10218 的 2025 年更新也抬高了工业机器人的安全和验证门槛。


              公开证据缺口是核心风险放大器。FieldAI 有一项 traversability 待批专利，但看不到足够宽的已授权 IP 组合。公开来源仍未显示独立技术基准、已发布的干预率、MTTF/MTBF
              数据、点名安全认证，或面向商业部署的正式 safety-case 包。这让投资者和买家面对不舒服的不对称：他们能清楚看到 FieldAI
              在追逐安全关键客户，却还看不到通常用于证明可靠性、自由实施和规模化合规准备度的文档层。
