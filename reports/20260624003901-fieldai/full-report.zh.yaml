      - number: '1.4'
        title: 里程碑时间线与战略合作
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的技术血统直接来自创始人领导过的 DARPA 和 NASA 项目。Team CoSTAR 在 2020 DARPA SubT Urban Circuit
              的胜利，首次展示了四足机器人完全自主的数公里探索，以及在无 GPS 地下环境中最多 11 台异构机器人协同作业。这一成果为 FieldAI 商业 FFM 架构提供了基础概念验证。

              Dr. Agha 离开 JPL 后，公司于 2023 年正式成立，并在隐身期开始服务建筑、能源和安防客户，进入首批商业部署。2025 年 8 月以来的重要里程碑包括：NVIDIA Omniverse
              合作深化训练数据管线（2025 年 8 月）；Ali Agha 在 RoboBusiness 2025 发表主题演讲（2025 年 10 月）；与 Boston Dynamics 合作，在建筑工地部署基于
              Spot 的四足机器人队列（2026 年 3 月）；以及与 Ouster 合作 Rev8 lidar，用于无 GPS 工业感知（2026 年 6 月）。Boston Dynamics 合作尤其重要：FieldAI
              计划打造全球最大的第三方 Spot 四足机器人队列之一，客户已在企业规模上从亚洲扩展到欧洲再到北美；Boston Dynamics 称巡检和文档时间减少 90% 以上。

              根据对新闻报道和第三方分析师报告的审阅，截至 2026 年 6 月，公开记录中未出现涉及 FieldAI 或其部署的安全事故、产品责任索赔或监管调查。也未发现针对 FieldAI 的诉讼、IP
              纠纷或监管执法。这些缺失有信息价值，但在完成直接监管和法律尽调前，不能当作健康证明。OCBJ 报道称 FieldAI 被 Fast Company 评为 Top 10 Most Innovative AI
              companies 之一，公司还拥有包括 Boston Dynamics、NVIDIA 和 Ouster Inc. 在内的强战略合作管线。
