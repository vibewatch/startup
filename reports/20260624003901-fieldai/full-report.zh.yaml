  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开可见的客户路径从工作流痛点走向试点部署、运营数据、扩张，再到更广的组合或区域 rollout。
    data:
      nodes:
        - id: j1
          label: 工作流痛点
          detail: 手工记录、危险巡检和劳动力短缺，推动买方转向自主化。
        - id: j2
          label: 试点 / 验证部署
          detail: Big-D 测试、DPR 场地上线或 Certis 运营试点，建立第一层契合。
        - id: j3
          label: 日常运营使用
          detail: 机器人采集照片、巡走场地、检查状态，并把数据送入现有系统。
        - id: j4
          label: 扩张信号
          detail: 试点扩大到多个项目、每日部署或全机队使用。
        - id: j5
          label: 不透明稳定状态
          detail: 公开证明止步于客户数量、续约或 logo 级经济性披露之前。
    approximationNotes: 旅程图把 Big-D、DPR、Certis 和 Boston Dynamics 案例研究证据综合为一条共同客户路径。
