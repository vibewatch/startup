  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业、市场与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的一阶商业风险在于：市场叙事强于公开运营分母。独立来源能够验证估值、融资和部分部署证明，但仍无法验证活跃客户数、确认收入、流失或集中度。这个缺口很关键，因为公司已经按具身 AI
              突破型赢家来定价。UpsideList 对优先权栈约 $506M 的估算，让普通股股东的下行情景更不对称；Reuters 和 GetLatka
              也显示，在这个估值上，找到营收和规模口径并不难，难的是找到通常能降低风险的质量指标。


              第二个商业风险是竞争军备竞赛。Skild AI 和 Physical Intelligence 的估值大约是 FieldAI 的 5–7 倍，Brain Corp
              也说明，既有自主平台不必承诺通用机器人智能，就已经能在企业规模商业化。如果市场收敛到更横向的基础模型栈，或 NVIDIA 生态成为默认控制平面，FieldAI
              可能被夹在资本更充足的前沿同行和已商业化的在位者之间。建筑劳动力市场短期转松同样重要：如果劳动力稀缺在 ROI 充分证明前缓解，购买自主工地机器人的紧迫性可能比预期更快回归常态。
