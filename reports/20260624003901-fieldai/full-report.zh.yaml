      - number: '5.3'
        title: 部署、路线图与差异化
        blocks:
          - type: paragraph
            body: >-
              公开部署证据显示，FieldAI 正从平台叙事推进到可重复的运营模式。Big-D 称工具经过两年多测试后正在多个项目扩散，DPR 的建筑案例研究显示，这套 stack 已在 Santa Clara
              真实工地上跑在四足机器人上，用于进度采集和测量。Boston Dynamics 与 FieldAI 2026 年 3 月公告把证据从客户案例扩展到平台合作：Spot 级移动能力加
              FFMs，被定位为把自主能力带入不断变化的建筑环境，而这类环境过去会让基于规则的机器人失效。Ouster 2026 年 6 月 Rev8 合作补上了传感器层路线图，FieldAI 明确把未来部署与坚固性、原生彩色
              lidar、安全关键可解释性和恶劣环境感知绑定。


              因此，差异化案例建立在四个相互复合的资产上：硬件无关自主层、来自已部署场站的真实世界数据飞轮、基于 Omniverse 的 real-to-sim 验证栈，以及围绕不确定性感知可通行性的早期 IP。Intel
              Capital 的表述在这里很有用：标准化机器人硬件正在成为身体，而 FieldAI 这类公司在争夺大脑。需要注意的是，公开路线图证据更多由合作伙伴牵引，而不是版本牵引；市场能看到合作和场站扩张，但看不到详细
              release notes、性能阈值或按模块拆分的维护经济性。
