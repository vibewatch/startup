  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              FieldAI 不销售单一机器人 SKU。公开材料一贯把产品描述为
              EDGE：一个通用机器人“大脑”，可以架在多种移动机器人形态之上，并在动态、非结构化环境中执行客户工作流。用客户语言讲，这个产品用自主场站穿行加结构化数据采集，替代人工现场巡检、测量走场、进度照片采集、高危巡检和无
              GPS 侦察。最具体的公开用例包括建筑进度监测和测量采集、工业和能源巡检、安防巡逻、地下或越野测绘，以及联邦侦察式数据采集。


              商业上真正重要的是，这是一款工作流产品，不只是模型 demo。解决方案目录描述了自研任务应用和第三方载荷集成，联邦网站也显示同一核心 stack 可延伸到安全关键的无 GPS
              任务。这让产品图谱更容易承销：可复用的自主核心、多种任务包、广泛传感器支持，以及面向客户的输出，例如数字孪生、异常检测和场站文档。Big-D 和 DPR
              案例研究说明，这套抽象已经足够好，可以从窄试点推进到经常性工地运营。
