  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价信号与收入质量
        blocks:
          - type: paragraph
            body: >-
              FieldAI 公开可见的商业模式是软件主导的 Robot-as-a-Service，而不是机器人制造。公司反复把自己描述为硬件无关的自主层，可以安装在第三方机器人上；Reuters
              也把产品界定为能运行在广泛硬件上的软件，而不是自有机器人队列。这在财务上很关键，因为可能的收入栈由几部分组成：初始部署和集成工作、经常性软件订阅，以及随着场站或机器人数量增长而扩张的合同；相比垂直整合机器人
              OEM，库存暴露更轻。FieldAI Federal 增加了一个独立但仍未验证的政府渠道，可能带来漫长采购周期和按里程碑确认收入，而不是干净的 SaaS 式年度合同。


              缺失的部分，才是真正决定承销质量的部分：实际价格、合同期限、经常性软件与低毛利服务的组合，以及 bookings 与已确认收入之间的差距。Reuters 提供了最强的具体商业化信号，引用 Ali Agha
              称其在美国、欧洲和亚洲拥有数百万美元级合同；2025 年 8 月公司新闻稿还补充了快速采用和多个扩张合同。但公开没有价目表，没有客户数披露，也没有经审计收入。相反，第三方数据库分歧很大：GetLatka 估算
              $140M ARR，而 CompWorth 只估 $5M 年收入。这个区间太宽，不能把任何单一公开收入数字当成投资级证据；因此正确结论不是收入低或高，而是收入质量仍未验证。
