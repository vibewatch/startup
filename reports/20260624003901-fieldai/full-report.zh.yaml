      - number: '3.3'
        title: 功能与定价对比
        blocks:
          - type: paragraph
            body: >-
              在机器人 AI 平台同行中，定价差异很大：Physical Intelligence 收取约 $300/月/机器人（SaaS），Brain Corp 主要是 OEM
              合作收入分成，Intrinsic/Flowstate 瞄准企业授权，FieldAI 则采用数百万美元级、多年期 RaaS 合同。FieldAI
              的合同模式意味着买方近期承诺更高，但切换成本和收入可预测性也更高。在能力维度上，FieldAI 领先的是无 GPS 的户外 / 地下自主，以及非结构化环境中的多机器人车队管理；Physical
              Intelligence 和 Skild AI 领先的是操作灵巧性，以及在大规模远程操作数据上训练出的跨形态泛化；Brain Corp 领先的是室内结构化环境中的装机规模。没有竞争对手公开声称能在无 GPS
              户外环境实现低于 100ms 的边缘推理。在联邦领域，FieldAI Federal 是机器人软件提供商中唯一声明拥有国防和政府合同业务的基础模型竞争者；Exyn 服务美国 DoD，但它是硬件特定。
