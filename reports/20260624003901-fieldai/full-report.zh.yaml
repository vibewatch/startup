      - - 立即行动
        - 要证据，不要依赖叙事
        - 承销前需要 CFO 认证的 ARR / 收入、集中度和 cap table 条款
    notes: 本表刻意区分决策立场与估值立场。报告不是说 FieldAI 不可投资；而是说公开记录不足以证明价格公平。
