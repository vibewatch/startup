      - number: '8.2'
        title: 可比公司集合与倍数交叉检查
        blocks:
          - type: paragraph
            body: >-
              FieldAI 的可比对象真实存在，但不纯。Physical Intelligence 和 Skild AI 是叙事上最接近的同行，因为两者都以广义具身 AI
              基础模型公司融资；但两者都是私营、变化很快，估值本身也可以说更多来自期权价值，而非传统软件证明。Figure AI 估值高得多，但硬件更重，也更以人形机器人为中心。Covariant
              纸面上是更接近的机器人软件先例，但公开财务可见度仍不完整。Brain Corp 商业成熟度更高，却处在自主市场的另一块：清洁和企业服务经济性，而不是通用现场自主。


              因此，可比分析只能三角定位，不能下结论。有用的部分是方向性的：FieldAI 明显便宜于最炙手可热的具身 AI 名字，这能抵御最直接的高估批评。没那么有用的部分是，这些同行本身可能就有泡沫。Tennant
              这类上市公司和有申报支撑的可比对象凸显出反差：成熟自动化企业会披露收入、毛利率和运营计划；FieldAI 不披露。所以，使用可比集合的正确方式，不是宣称公司绝对便宜或昂贵，而是说明当前 $2B
              价格中，有多少仍是在押注未来品类领导权，而不是押注透明的当前经济性。
