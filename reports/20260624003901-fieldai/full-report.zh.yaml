      - number: '5.2'
        title: 架构与运行栈
        blocks:
          - type: paragraph
            body: >-
              FieldAI 公开披露的架构比常见机器人营销 stack 更具体。官网把 EDGE 锚定在 Belief World Model
              上，技术页则把系统拆成多模态输入、由部署数据驱动的学习、动态感知控制和多智能体协同。架构主张并不只是「机器人基础模型」；它明确是一套风险感知 stack，能在不确定性下推理，无需地图或 GPS
              运行，并部署在边缘端，而不是云端 copilot。这个组合是公司在建筑、采矿、公用事业和联邦场景中差异化的核心，因为这些场景里的连接、地形和布局都不稳定。


              最强的软件栈证据来自 NVIDIA Omniverse 文章，它把抽象模型主张变成运行管线：FieldAI 用 Isaac Lab 训练，用 Isaac Sim 做软件在环验证，并用 Omniverse
              NuRec 加 OSMO 把实时机器人数据转成可仿真的数字孪生。GitHub forks 又增加了开发者信号层：FieldAI 公开维护 ROS/Ouster 和 rosbridge
              相关代码，这更符合异构集成策略，而不是封闭的单机器人设备。合在一起，这套 stack 看起来像一个野外机器人平台：吸收多模态传感器数据，本地行动，并通过真实世界部署数据持续改进。
