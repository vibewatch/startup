  title: Customers
  summary: FieldAI has real deployment evidence, but it is disclosure-light relative to the company's valuation and claimed scale. The strongest public customer proof is construction—Big-D Construction, DPR Construction, and unnamed top-10 ENR firms—plus a newer Certis security deployment partnership, while public retention evidence relies mostly on expansion behavior rather than disclosed NRR, churn, or customer-count data.
sections:
- id: named-customer-proof-and-segmentation
  title: Named Customer Proof and Customer Segmentation
  body: |-
    FieldAI's public customer evidence is narrower than its market narrative. Named and verifiable logos cluster in construction and adjacent security operations: Big-D Construction, DPR Construction, and Certis. Big-D and DPR are the clearest customer proofs because they are attached to specific construction workflows, named operating references, and deployment details; Certis broadens the mix into security operations but still looks more like a strategic deployment partner and channel to end sites than a classic enterprise software customer with disclosed contract terms. Detroit Defense, by contrast, is best treated as a federal technology partner rather than customer proof.

    The segmentation story therefore has two layers. First, there is a strong construction segment with buyer-side evidence from project and executive operators. Second, there is a broader but weaker layer of unnamed deployments across Asia, Europe, the U.S., and security or federal use cases. Boston Dynamics and Robots in Construction help fill that second layer by pointing to unnamed top-10 ENR builders and four confirmed deployments, but those sources do not close the core disclosure gap: FieldAI still does not publish a clean paying-customer count, site count, or customer mix by vertical.
