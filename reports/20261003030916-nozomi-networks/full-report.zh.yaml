      - number: '5.4'
        title: 深度图表
        blocks:
          - type: callout
            title: 无侵入深度数据包检测与动态学习基线
            body: >-
              Nozomi Networks 的核心技术优势在于其无侵入的全栈架构，将 OSI 全 7 层工业协议解析与 Dynamic Learning 自动化基线建模融为一体。Guardian
              无需发起可能导致业务中断的主动扫描，也无需直接访问生产 SCADA 历史数据库，即可校验指令语法并追踪实时工控过程变量，在实现深层可见性的同时杜绝了破坏生产流程的运行风险。
            calloutType: strength
            claimRefs:
              - CE004
              - CE007
