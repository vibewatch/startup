      - number: '5.3'
        title: 部署架构、第三方生态与技术差异化壁垒
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks 的架构专为兼容普渡模型（Purdue Model）的复杂异构企业环境而设计，防护范围横跨 Level 0/1 现场设备直至 Level 4/5 集团 IT
              办公网络。该方案支持多样化的部署规格，包括 10 款不同形态的物理硬件设备（从适用于严苛变电站环境的导轨式加固机型，到面向数据中心的高吞吐机架式设备）、虚拟化镜像、面向工业交换机与路由器的内嵌容器套件，以及覆盖
              AWS、Azure 与 Google Cloud Marketplace 的云端实例。这种架构灵活性使炼油厂、电网、制药工厂和市政水务等工业企业能够实现端到端的信息物理韧性。


              系统依托开放 REST API 与标准化预置插件，实现与企业 IT、安全运营中心（SOC）及云端可观测性平台的无缝集成。与 Datadog、Elastic、主流 SIEM
              及工业自动化架构的官方认证集成支持双向遥测数据同步。在 Elastic 生态中，Nozomi Networks 插件可接入 8
              种标准化事件数据流：安全告警、资产清单、审计日志、传感器运行状态、网络节点元数据、节点通用漏洞披露（CVE）匹配记录、会话连接数据及由 DPI 解析出的工控过程变量。同理，Datadog
              插件提供开箱即用的可视化看板，在企业统一可观测性平台中直观呈现资产台账、传感器健康状态与核心运行告警。


              技术壁垒进一步借助内嵌情报服务筑牢，其威胁情报（Threat Intelligence）与资产情报（Asset Intelligence）订阅源可持续输出经专业筛选的 Yara
              规则、工业报文检测启发式特征，以及与国家漏洞数据库（NVD）对齐的资产弱点库。2026 年，Nozomi 依托 Vantage IQ 推出具备上下文感知能力的私有化 AI 工具，并携手 Schneider
              Electric 针对 SCADAPack 47xi 智能 RTU 联合开发了业内首款内嵌式 RTU 安全传感器（Nozomi Arc Embedded）。不过，核心技术依赖与运维局限依然存在：主动 Smart
              Polling 需要严苛的网络前置配置以防老旧 PLC 停摆，异地分布的大规模传感器集群需要规范的全生命周期运维，且在被 Mitsubishi Electric Corporation
              收购后，其跨厂商中立性正面临行业审视。
            claimRefs:
