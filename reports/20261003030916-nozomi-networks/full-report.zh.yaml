  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类体系与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              运营技术（OT）、工业控制系统（ICS）与信息物理系统（CPS）安全，涵盖用于保护物理作业流程、工业控制器及互联设备（而非仅保护企业数据资产）的专用软件、硬件设备与分析架构。传统企业级 IT
              安全的防御重心在于数据机密性、端点 Agent 防护与软件补丁；而在工业自动化环境中，安全架构的核心约束始终是系统可用性、运行安全与作业确定性。IT 领域通用的主动漏洞扫描或基于 Agent
              的自动化处置工具，极易导致可编程逻辑控制器（PLC）、远程终端单元（RTU）和分布式控制系统（DCS）意外崩溃宕机，造成物理产线停产、价值数百万美元的精密设备损毁，甚至触发灾难性的环境安全事故。因此，OT/CPS
              安全市场的核心边界始终围绕无侵入的被动深度数据包检测（DPI，基于交换机 SPAN 端口镜像与分光器 TAP）、不影响工控运行的原生安全轮询，以及在不干扰实时控制循环前提下的资产上下文关联展开。


              该市场边界内的有效支出涵盖专用被动工业传感器、集中管理控制台、OT 专属威胁情报订阅源，以及新兴的 OT
              资产服务治理平台。它明确排除了通用企业端点检测与响应（EDR）、通用身份与访问管理（IAM）、企业云安全态势管理（CSPM）及标准 IT 边界防火墙——后者普遍缺乏解析 Modbus、DNP3、IEC
              61850、Profinet
              以及厂商私有工程背板通信所需的工业协议解码器。相邻细分市场包括工业物联网（IIoT）安全、医疗物联网（IoMT）安全与楼宇自控系统（BMS）防护；这些领域虽同样具有信息物理属性，但在合规监管框架和运行容错率上与核心工业存在显著差异。


              各工业行业中根深蒂固的既有替代方案与传统防御机制，构成了采购专用商业化平台的主要阻力。几十年来，工业资产所有者一直依赖物理网络隔离（Air-gap），即彻底切断工厂内网与企业 IT
              网络及公共互联网的连接。然而，数字化转型、工业物联网遥测项目、预测性维护需求与设备商远程诊断机制，已系统性打破了绝对物理隔离，在工业生产区内衍生出大量未获授权或未被监管的通信路径。其他广泛使用的替代手段包括定期的离线人工审计、资产
              Excel 台账、通用网络管理工具与 IT 边界防火墙。这些传统方式根本无法提供实时资产发现，欠缺针对 Purdue 模型 Level 1 与 Level 2
              控制器通信的协议级可见性，在国家级黑客攻击利用未修补固件漏洞或劫持合法工程师站时，完全无法提供持续的漏洞上下文监控。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
