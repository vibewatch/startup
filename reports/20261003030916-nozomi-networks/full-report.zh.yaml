  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              运营技术（OT）与信息物理系统（CPS）安全的竞争版图，由专注细分市场的独立厂商、泛 IT/OT 可见性厂商、工业自动化传统巨头以及现状架构基准共同构成。Nozomi Networks 的直接竞争对手既包括
              Claroty 和 Dragos 等独立专注 OT 安全的厂商，也涵盖 Armis 和 Forescout 等覆盖更广的企业级信息物理资产可见性平台
              [CP001]。在相邻的关键基础设施层，企业采购方还会评估云端与边缘工业数据工具，包括 AWS IoT Analytics、Datadog、Dynatrace、Elastic Stack 以及 Bosch IoT
              Suite；这些工具虽能提供运行遥测，但欠缺原生工控协议的深度数据包检测能力 [CP002]。而在受监管的公用事业与制造工厂中，最为顽固的结构性替代方案依然是现状维持：手动网络分段、物理隔离架构，或 NSA
              GRASSMARLIN 等开源协议抓包工具 [CP003]。在商业选型中，采购团队始终将无扰的被动 OT 资产发现、协议解码深度以及避免停产的作业安全性置于最高优先级 [CP004]。
