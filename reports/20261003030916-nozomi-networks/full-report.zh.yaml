        title: 关键基础设施行业覆盖广泛，但采购方画像细节仍显薄弱
        blocks:
          - type: paragraph
            body: >-
              Nozomi
              公开的客户网络覆盖机场、电力公用事业、医疗、制造、航运、矿业、石油天然气、制药、铁路、零售、智慧城市以及水务和污水处理等领域。这一分布表明其定位于服务高敏感度生产运营环境的平台级产品，而非仅局限于单一垂直行业的点状工具。在公司官方口径的收购回顾中，其进一步宣称已渗透全球前十大油气、制药、公用事业与矿业运营商。这些陈述印证了其行业覆盖广度，但并未阐明各细分板块的付费实体数量、营收结构、客单价规模及真正的经济决策买家画像。渠道同样扮演着关键角色：据
              Exclusive Networks 描述，分销商、解决方案提供商、集成商及托管服务提供商有效延伸了市场触达，反映出部分客户拓展与服务交付可能是由生态伙伴居中促成的。
