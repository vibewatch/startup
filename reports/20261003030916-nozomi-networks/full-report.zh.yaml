      - number: '5.2'
        title: 运行机制：深度数据包检测、动态学习与工业落地场景
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks 检测引擎的技术底层依托于针对工控协议的深度数据包检测（DPI），并结合基于机器学习的异常行为建模技术 Dynamic
              Learning。在工控网络中，设备通信普遍采用专有且未加密的传统协议，如 Modbus、EtherNet/IP、DNP3、IEC 60870-5-104 及 Siemens S7 等。不同于仅检查标准
              TCP/IP 报头的基础 IT 网络监控工具，Guardian 能够对 OSI 参考模型全部 7 层的有效载荷语法、事务交互逻辑及具体操作指令序列进行深度校验，甚至涵盖变电站常用的 Layer 2 GOOSE
              协议。其内置的 Protocol SDK 亦支持工程团队自主扩展对厂商私有协议的解析能力。


              初次上线部署时，Guardian
              进入无扰学习阶段，依托被动分析流量交互、设备关联及过程控制变量，自动构建物理运行流程的交互式虚拟基线模型。一旦网络行为模式收敛趋稳，系统便自动切入防护监测状态。这一自动化学习过程降低了人工规则配置成本，并有效压缩了困扰工业运维的高频误报。除传统网络威胁特征外，Guardian
              还能实时对管网气压、流体温度、泵机转速等运行工艺变量进行连续建模。系统直接从网络报文中捕获工控参数的微小偏移，无需接入上位 SCADA
              历史数据库，即可在设备物理受损或停机发生前，精准洞察异常物理状态与潜在的信息物理篡改攻击。


              在企业级运营工作流中，安全团队可借助定制化看板、实时查询引擎及自动化断言（Assertions）调用这些遥测数据。安全分析师与现场运维工程师可配置持续策略断言，实时检测网络环境中的失陷指标（IOC）或违规协议指令，并在触发告警后即刻将取证上下文推送至企业
              SIEM、SOAR 及 IT 工单流转系统。
