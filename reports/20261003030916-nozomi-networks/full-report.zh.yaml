      - number: '1.3'
        title: 资本历史、交易结构与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              在被 Mitsubishi Electric 收购前，Nozomi Networks 历经 11 轮融资累计募集约 $266M。主要风投机构与战略投资方包括 Planven Investments、GGV
              Capital、Lux Capital、Energize Capital（前身为 Energize Ventures）以及 THI Investments；其中 THI Investments 于 2018 年
              9 月领投了  $30M C 轮融资，当时累计投入达 $53.8M。在随后的轮次中，公司进一步引入了工业与安全生态巨头的产业投资，包括 Schneider Electric、Honeywell 以及
              Mitsubishi Electric 本身。行业媒体报道显示，这项于 2025 年 9 月公布、2026 年 1 月 29 日交割的最终收购案，交易总价达 $1B。尽管 Mitsubishi Electric
              提供了稳健的资产负债表支撑、全球工业自动化客群触达渠道以及联合工程研发机会，该交易仍限制了早期风投机构的股权上行空间，并带来了战略利益相关方协同考量。横向工业伙伴渠道（如 Yokogawa Electric 和
              Schneider Electric）仍是商业分销的核心支柱，这要求 Nozomi 必须严格保持多厂商中立定位。
