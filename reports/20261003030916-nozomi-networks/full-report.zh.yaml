            body: >-
              Nozomi Networks 已建立起扎实的工业市场基本盘，2025 财年净营收为 $101.7M，年营收超过 $100M。公司宣布已实现盈亏平衡与持续性现金流，成为首家跨入运营盈利门槛的非上市 OT
              网络安全厂商。其全球部署网络超过 12,000 处，监控超过 115M 台 OT、IoT 与 IT 设备，覆盖众多关键基础设施客户，其中包括全球前十大石油和天然气运营商中的 5 家、前十大制药商中的 7
              家、前十大公用事业企业中的 7 家以及前十大矿业集团中的 4 家。尽管平台采纳迅速，但母公司的并购后完整交易条款、细分单位毛利率以及预估 391 至 600
              名员工的具体区域分布等关键维度上，仍缺乏充分披露。此外，外部采购评估指出，在复杂工业现场部署中，总体拥有成本（TCO）对现场环境、协议定制开发及多年维保费用极为敏感。
