        - 在基线学习时间窗口内保持静默或无通信行为的资产将无法被绘制入网
      - - 漏洞与补丁评估
        - 定期人工比对厂商安全公告，或使用具备侵入风险的传统漏洞扫描器
        - 借助 Threat Intelligence 持续映射 NVD 漏洞库，并辅以定向 Smart Polling 确认
        - 在不中断关键生产线运行的前提下，实现经验证的漏洞暴露面跟踪
        - 工控 OT 环境下的漏洞修复必须等待计划内的大修停产窗口期；无法进行自动化补丁热修补
      - - 工业协议威胁检测
        - 传统 IT 防火墙及边界入侵检测系统对工业报文有效载荷（payload）完全处于盲区
        - 贯穿 OSI 7 层模型的工业协议专用深度报文检测（DPI），搭配经调优筛选的 Yara 与数据包特征规则
        - 识别异常工业控制指令序列、未授权设定值（setpoints）篡改以及非法 PLC 梯形图重写
        - 依赖威胁情报源的定期更新推送；私有定制协议必须使用 Protocol SDK 二次开发适配
      - - 生产工艺异常与安全运行监控
        - 在物理工艺发生偏差后，依赖中控室 SCADA 告警和历史数据库设定的越限阈值被动应对
        - Process Views 直接利用网络通信流量对实时工艺变量（温度、压力、流量等）进行建模
        - 在装置停机前提前预警机械磨损劣化、缓慢气体泄漏或潜在的信息物理协同破坏
        - 依赖于未经加密的工业现场总线协议明文暴露实时工艺参数数值
    notes: 场景对比综合自 Nozomi Networks 白皮书深度剖析，系统展示技术机制、运维效率提升及工业部署约束条件。
