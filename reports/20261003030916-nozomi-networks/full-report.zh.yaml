  - id: TV001
    title: 投资建议概要
    columns:
      - 决策状态
      - 投资建议
      - 置信度
      - 风险评级
      - 估值立场与研判推论
    rows:
      - - 当前状态
        - 保持跟踪 / 深入调研
        - 中
        - 中高
        - 尚无定论；在未获知收购对价与当前财务表现前，切勿锚定 2024 年 3 月的估值标记。
      - - 评级上调门槛
        - 重新承销测算
        - 待补充证据
        - 中
        - 仅在经审计运营指标、交易条款及证券权益核实后，方可开启估值区间测算。
      - - 评级下调门槛
        - 放弃投资
        - 待补充证据
        - 若触发则为高
        - 若生态中立性、客户留存、收入质量或可靠的退出通道出现实质性恶化，则予以否决。
    notes: 分析师研判仅基于留存的公开证据；置信度与风险均为定性判断，未对当前交易价格或回报目标进行估算。
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV011
      - CV016
  - id: TV002
    title: 投资正方论点与反方论点
    columns:
      - 论点方向
      - 具证据支持的论点
      - 转变观点的触发因素
    rows:
      - - 正方论点
        - 公司官方发布的数据显示监控设备超 115M 台，安装量超 1.2 万处。
        - 核验统计口径、期间一致性、客户集中度及独立部署证据。
      - - 正方论点
        - Mitsubishi Electric 控股带来战略背书，同时公开报道称其保持运营独立性。
        - 核实预算、产品路线图、管理团队及第三方 GTM 决策方面的自主权。
      - - 正方论点
        - 公司官方发布的 FY2025 净收入为 1.017 亿美元。
        - 获取经审计的收入确认、增速、毛利率、留存率及造血现金流数据。
      - - 反方论点
        - 留存公开证据中缺失当前估值与收购对价。
        - 已签署交易文件或 Mitsubishi Electric 公告明确收购对价及所估值的证券标的。
    notes: 规模与收入数据源自公司自述；收购进展获得公司公告及独立报道支持，估值数据缺失仅限于所选证据范围。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率指向信号
      - 下行情景触发条件
    rows:
      - - 乐观
        - 经审计的增速、毛利率、留存率及现金造血能力印证了规模宣称；生态中立性在整合后得以延续。
        - 待核实最新财务数据与可比企业价值倍数后再重启估值测算；当前尚无法支撑具体估值区间。
        - 仅在出现经审计证据及独立渠道长期稳固指标后方转为积极。
        - 整合限制了 OEM 中立合作关系，或公布的财务表现未达核实验收目标。
      - - 基准
        - Nozomi 保持独立运营，但交易对价与完整财务数据仍未公开。
        - 持续跟踪，暂不给出当前独立估值或目标回报。
        - 与当前公开证据最为吻合。
        - 下一尽调周期仍无法获取证据，或股权权益模糊不清。
      - - 悲观
        - 整合削弱生态中立性、客户留存下滑，或收入质量与流动性退出权益未通过尽调。
        - 将过往融资估值标记视为不具参考意义并予以放弃，而非主观推算折价。
        - 由可度量的运营或治理恶化触发。
        - 合作伙伴退出、客户留存大幅下滑、毛利率证据承压，或缺乏可靠的可转让证券标的。
    notes: 情景分析有意省略了估值区间与数值化概率，因收购对价、经审计财务数据、证券权益及可比企业价值倍数均未公开。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
      - CV016
figures:
  - id: FO001
    title: Nozomi Networks 公司与产品演进关键里程碑
    type: timeline
    summary: 自 2013 年成立至 2026 年被 Mitsubishi Electric 收购及高管团队过渡期间，公司发展、融资、产品与并购的关键里程碑。
    data:
      items:
        - date: 2013-06
          label: 公司成立
          detail: Andrea Carcano 与 Moreno Carullo 创立 Nozomi Networks，研发基于 AI 的 ICS 与 SCADA 网络可见性解决方案。
        - date: 2018-01
          label: B 轮融资
          detail: 斩获 1500 万美元 B 轮风险投资，加速全球五大洲业务拓展。
        - date: 2018-09
          label: C 轮融资
          detail: 完成由 Planven Investments 领投的 3000 万美元 C 轮融资，累计融资金额达 5380 万美元。
        - date: 2021-08
          label: 推出 MSSP 合作计划
          detail: 推出业内首个面向 OT 与 IoT 托管安全服务商（MSSP）的专属合作伙伴认证计划。
        - date: 2024-03
          label: Yokogawa 全球战略联盟
          detail: 深化与 Yokogawa Electric 的全球战略合作，将 Nozomi 可见性能力深度整合至 OpreX Managed Services。
        - date: 2025-07
          label: 累计融资金额突破 2.66 亿美元
          detail: 完成引入工业自动化巨头战略入股的成长轮融资，累计融资金额达 2.66 亿美元。
        - date: 2025-09
          label: 签署收购协议
          detail: 签署正式收购协议，由 Mitsubishi Electric Corporation 收购，据报道交易对价为 10 亿美元。
        - date: 2026-01
          label: 收购交割与 $100M+ 年收入
          detail: 完成由 Mitsubishi Electric 作为独立子公司收购的交割；确认年收入突破 1 亿美元且现金流持续稳健。
        - date: 2026-07
          label: 产品生命周期策略 v3.0
          detail: 发布修订版产品生命周期与支持策略 v3.0，明确 N2OS 与 Arc 软件在 GA、EOS 及 EOL 各阶段的正规治理标准。
        - date: 2026-09
          label: Carcano 回归出任 CEO
          detail: 联合创始人 Andrea Carcano 回归出任首席执行官，引领 AI 平台创新与大型企业客户拓展。
    approximationNotes: null
    claimRefs:
