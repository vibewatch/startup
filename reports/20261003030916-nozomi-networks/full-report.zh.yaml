      - number: '8.2'
        title: 正方论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              看多逻辑基于其业务规模、战略资源背书以及部署覆盖广度。Nozomi 自述在逾 12,000 处部署中监控超过 115M 台 OT、IoT 与 IT
              设备，其官网也勾勒出可支持本地、混合、云端及托管部署的合作伙伴生态。战略投资方参与了 2024 年融资，随后 Mitsubishi Electric
              在维持其运营独立性的前提下完成了全资收购。反方论点在于，当前池内的每项规模指标均出自公司官方宣传，披露的营收缺乏经审计的盈利归因调节表，且由工业巨头控股可能削弱其中立生态定位。招聘页面在访问时未列出任何在招岗位；这仅是一项尽调信号，不足以证明公司已冻结招聘或裁员收缩。
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: 融资沿革与情景推演纪律
        blocks:
          - type: paragraph
            body: >-
              融资记录在作为估值锚点之前需完成数据对齐。Forge 列出的 E 轮融资金额为 8,000 万美元，附带 1.0x 不参与分配的清算优先权条款；而 Crunchbase 将 2024 年 E 轮描述为 1
              亿美元，并记载自成立以来累计融资 2.66 亿美元。此类差异可能反映了融资轮次构成的口径差异或数据库录入惯例，不能与账面可用现金、ARR
              或收购所得混为一谈。行业融资案例同样难以直接作为估值可比参照：Crunchbase 虽援引 Claroty 的 1 亿美元战略债权融资及 Dragos 的 7,400
              万美元股权融资，但两者均未提供企业价值、营收、增速或盈利能力指标。因此，乐观、基准和悲观情景推演均采用明确的证据门槛，而非凭空拟合乘数或胜率。只有在获取具体交易对价或子公司最新财务数据后，方能正式推导估值区间。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.4'
        title: 退出就绪度、触发事件与尽调清单
        blocks:
          - type: paragraph
            body: >-
              传统初创企业的私募退出路径已被并入 Mitsubishi Electric
              体系所取代。因此，潜在投资人需要厘清拟评估的证券类型、可转让性、治理权益，以及是否存在任何子公司是否存在流动性变现途径。当期尽调清单应索取签署生效的交易对价协议、完全稀释股权架构及清算优先权分配瀑布图、经审计的
              FY2025
              财务报表、最新收入结构、毛利率、留存指标、现金造血能力以及整合进展报告。仅当经核实的财务数据显示业务保持稳健增长与利润率，且合作伙伴中立性未受侵蚀时，方可上调评级；若整合导致第三方分销渠道受损、客户留存率恶化、披露的收入质量未经证实，或无法确认可行的流动性机制，则应下调评级。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.5'
        title: 附表与支撑证据
        blocks:
          - type: callout
            title: 保持跟踪，暂不估值
            body: 将 2024 年 3 月的估值标记视为历史融资背景。在厘清收购交易对价、经审计的子公司财务数据以及具体证券权益之前，不设定目标估值或投资回报预期。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV016
          - type: callout
            title: 营业收入并非 ARR
            body: 公司官方披露的 FY2025 1.017 亿美元数据为净营业收入。该指标不能替代 ARR、造血现金流或账面可用现金。
            calloutType: risk
            claimRefs:
              - CV011
