      - - 战略渠道合作关系
        - Telefónica / ElevenPaths 托管安全合作关系
        - 未知；留存证据具历史性，未提供当前收入分成比例
        - 渠道停滞或减弱会压缩区域触达能力与托管服务交付。
        - 中
        - 核实当前合同、商机管线、受训服务能力、续约条款及客户案例。
        - 在核实当前财务效益与业务活跃度前，影响重大。
    notes: 合作伙伴广泛性由公司与伙伴自述披露；指定来源均未披露收入集中度、归属于伙伴的订单额、续约财务条款或当前渠道产能。
    claimRefs:
