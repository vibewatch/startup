chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、发展阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks Inc. 由 Andrea Carcano 与 Moreno Carullo 于 2013
              年创立，专注于关键基础设施与工业控制系统（ICS）的网络安全、资产情报及异常检测。公司总部位于加利福尼亚州旧金山，业务遍及六大洲，为信息物理环境提供统一的网络与端点可见性。其商业架构基于运行 N2OS 的
              Guardian 传感器提供持续被动深度数据包检测（DPI），依托 Nozomi Arc 采集主机级端点遥测，借助中央管理控制台（CMC）实现本地集中管控，并由 Nozomi Vantage 提供 SaaS
              管理能力。2026 年 1 月，Mitsubishi Electric 以 10 亿美元交易估值完成对 Nozomi Networks
              的收购，使该企业从一家独立风险投资支持的成长型公司转型为全资运营子公司，同时保留原有品牌、高管团队及中立于硬件厂商的 GTM
              体系。公司营收主要由经常性软件订阅、物理与虚拟传感器设备、高级威胁情报订阅源以及托管安全服务商（MSSP）伙伴授权所驱动。
