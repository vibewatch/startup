  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构、传感器矩阵与模块化平台体系
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks 提供专为关键基础设施与高要求生产环境打造的运营技术（OT）、物联网（IoT）及信息物理系统（CPS）网络安全平台。该平台针对工业现场长期存在的可见性盲区而设计，传统 IT
              安全工具在这些场景中既无法安全识别专有工控协议，也不能承受主动网络扫描带来的风险。Nozomi
              的技术栈涵盖分布式边缘数据采集传感器、端点检测模块、集中管理设备以及云原生分析服务，旨在保护普渡企业参考架构（Purdue Model）各层级的工业资产。


              核心数据采集层由多形态硬件/虚拟设备 Nozomi Guardian 奠定基石，主要旁路部署在工业网络交换机的 SPAN 或镜像端口上。Guardian
              以无侵入的被动方式抓取工业网络流量，在不向脆弱控制网络注入数据包的前提下，采集资产遥测数据并建立通信基线。针对深层资产验证诉求，Guardian 支持选配 Smart Polling 模块，在不影响 PLC
              正常运转的前提下，对端点发起针对性、低频次的主动交互查询，以精确提取硬件型号、固件版本和补丁级别。面向分布式变电站及偏远泵站，Nozomi 提供了轻量级 Remote
              Collector，将现场采集的遥测数据回传至中央 Guardian 引擎。


              端点可见性与主机级防御由部署在工程师站、人机界面（HMI）和工业服务器上的端点传感器 Nozomi Arc 提供。Arc
              采集主机行为指标，监控用户登录与权限提升行为，检测未授权软件变更并防范内部威胁，能够以传感器许可或端点许可模式接入 Guardian 或
              Vantage。在企业集中管理层，系统既支持通过中央管理控制台（CMC）实施本地管控（提供物理设备、虚拟机或私有云部署形式），也支持依托可弹性伸缩的 SaaS 平台 Vantage
              实现多租户全局视图、自动化威胁响应编排，并与企业第三方 IT 安全架构对接。
            claimRefs:
              - CE001
