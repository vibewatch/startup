      - number: '2.2'
        title: 市场规模、增长轨迹与目标细分市场
        blocks:
          - type: paragraph
            body: >-
              评估运营技术与信息物理系统安全市场的体量，需要对比第三方独立市调机构预测与各细分品类的实际支出结构。据 MarketsAndMarkets 测算，全球运营技术安全市场规模在 2025 年达到 $23.54B，预计
              2026 年将增至 $27.39B，同比增速约 16.35%。ABI Research 的长周期预测印证了这一演进趋势，预计该市场将从 2023 年的 $12.75B 稳步攀升至 2028 年的
              $21.60B。虽然宏观潜在市场总额（TAM）指标汇总了全球所有工业门类的硬件、软件与专业服务支出，但分品类的结构拆解能更清晰地反映软件许可与平台层面的真实需求。Mordor Intelligence
              数据显示，平台型解决方案在 2025 年占到全球 OT 安全支出的 62.34%，反映出客户预算主要集中于核心软件平台许可与传感器基础设施的采购，而非经常性的咨询服务。


              在软件解决方案大类中，网络监控是最核心的产品方向，根据 Mordor Intelligence 统计，其占据了 2025 年市场总支出的
              46.05%。这种集中度反映了运营技术安全最基础的架构前提：工业运营方在推进微隔离、威胁猎捕或自动化漏洞优先级排序等高阶能力之前，必须先建立被动网络可见性与完整的资产清单。2026
              年全球针对关键基础设施行业（如电力、油气、化工、水务与离散制造）的专用 OT/CPS 防护平台（专门涵盖持续网络监控、异常检测与漏洞情报）可服务市场规模（SAM），估计在 $12.6B 至 $17.1B 之间。


              Nozomi Networks 及其背靠风投或产业巨头的一线竞对（Claroty 与
              Dragos）的可服务获取市场（SOM），主要聚焦于管理多分支站点的超大型关键基础设施企业。在这一客群中，单客年合同价值（ACV）受传感器密度、站点数量及托管端点规模驱动，在几十万至数百万美元之间浮动。市场落地指标反映出公司正持续渗透该客群：Nozomi
              Networks 已在全球逾 12,000 处部署中监控超过 115M 台 OT、IoT 与 IT 设备，印证大型工业企业正逐步将商业化平台确立为管控不断扩大的信息物理资产暴露面的标准方案。
