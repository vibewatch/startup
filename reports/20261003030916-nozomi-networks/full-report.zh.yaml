            body: >-
              工控网络安全采购方常常混淆 OT 网络可见性与防护执行力。被动监控平台能够绘制通信拓扑并提供 ISA/IEC 62443
              分区建议，但具体的策略执行依然依赖防火墙与网管交换机。若企业未就主动防御设施预留预算，往往会在部署后期遭遇显著阻力。
            calloutType: insight
            claimRefs:
              - CM013
          - type: callout
            title: 存量工厂交换机 SPAN 瓶颈与部署延时
            body: >-
              被动深度数据包检测依赖交换机 SPAN 端口与物理分光器 TAP。在老旧工业厂区中，老旧交换机普遍缺乏可用端口容量，且配置变更必须等待每 12 至 36
              个月一次的计划性大修停产窗口，导致软件采购与传感器全面就位之间存在漫长的实施周期。
            calloutType: risk
