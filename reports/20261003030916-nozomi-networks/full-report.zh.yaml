            body: >-
              评估 CPS 防护平台需要在协议可见深度、无扰部署机制与跨异构环境的跨厂区治理能力之间取得平衡 [CP004, CP005]。Nozomi 的差异化优势在于混合传感器覆盖能力——融合了 Guardian
              的被动网络监控、Guardian Air 的无线频谱监测、主动查询 Agent，以及 Nozomi Arc 提供的内嵌端点遥测 [CP006, CP007]。在工控环境中，Nozomi Arc Embedded
              与自动化硬件厂商开展了联合研发，包括直接集成进 Schneider Electric SCADAPack 47xi 智能 RTU [CP007]。在技术评分基准测试中，Nozomi 在被动 OT
              资产发现（4.9/5）和 OT 协议覆盖度（4.8/5）两项指标上均位列第一梯队
              [CP008]。不过独立评估同样强调，可见性与协议解析保真度高度取决于在分段工业拓扑中的传感器部署位置，且大规模多厂区推广需要投入大量的网络架构协同工作 [CP005, CP008]。
