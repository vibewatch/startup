      - number: '1.2'
        title: 创始人、核心管理层与治理结构演进
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks 建立在两位联合创始人关于 SCADA 安全与人工智能的基础学术及技术研究之上。Andrea Carcano 在因苏布里亚大学（Università degli Studi
              dell’Insubria）完成博士课题，专门研究 SCADA 入侵检测以及针对工控架构的早期恶意软件；他在 2026 年重掌首席执行官一职前曾任首席产品官，负责引领公司以 AI 为核心的发展阶段。联合创始人
              Moreno Carullo 同样拥有人工智能博士学位，现任首席技术官，主导软件研发，同时担任 IEC TC57 WG15 电力系统通信国际标准委员会专家。Carcano 接替了长期担任总裁兼首席执行官的
              Edgard Capdevielle，后者曾带领公司完成多轮融资扩张并达成被 Mitsubishi Electric 收购的确定性交易。其他核心运营高管包括首席营收官 Kevin Isaac、首席财务官
              George Todd、首席营销官 Mike Plante、幕僚长 Sai Mahalingam 以及人力与文化主管 Alan Berusch。收购后的治理结构在 Mitsubishi Electric
              的集团控股与公司的业务自主权之间取得平衡，既缓解了核心高管交接带来的即时震荡，也需要持续观察创始人与母公司长远战略的一致性。
