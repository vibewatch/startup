      - number: '2.4'
        title: 落地阻力、架构断层与治理边界
        blocks:
          - type: paragraph
            body: >-
              尽管市场扩张迅猛，运营技术网络安全的实际部署仍面临严峻的操作、技术与商业制约，拉长了销售周期并抑制了渗透速度。最大的技术阻力来自物理网络架构。被动深度数据包检测高度依赖交换机 SPAN 端口镜像或物理分光器
              TAP。在老旧的存量传统厂区中，工业交换机往往缺少冗余端口、网管功能或背板带宽来处理流量镜像。对生产交换机的重新配置，通常只能等待每 12 至 36
              个月一次的计划性大修停产窗口，导致合同签订到传感器全面上线之间存在漫长的交付延迟。此外，被动流量检测无法监控局限于 PLC 机箱背板内部或跨点对点串口链路的通信，这就要求引入 Nozomi Arc
              端点软件或安全协议主动查询等混合采集方案。


              在安全可见性与网络阻断防护之间也存在关键的分析断层。虽然 OT 安全监控平台能够将资产映射到 ISA/IEC 62443 安全分区与 Purdue
              模型层级，梳理出通信矩阵并识别出未经隔离的违规路径，但这类平台并不直接执行访问控制与网络隔离。物理与逻辑层面的控制策略最终仍须依赖工业防火墙、网管交换机及网络准入控制（NAC）系统落地。当工业企业采购了 OT
              可见性平台并误以为能获得开箱即用的网络隔离时，必然会引发计划外的交换硬件更换与防火墙工程改造预算。最后，关于控制器级协议深层解析能力、实测误报率以及跨分布式厂区总体拥有成本的独立第三方验证，在行业尽调中依然存在明显的信息缺口。这些工程现实决定了采购方必须依托严谨的现场实测
              PoC 完成能力核验，而非轻信厂商声称的协议支持数量与营销说辞。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
