            body: >-
              Nozomi 对外宣称保持 100% 的客户留存率，但公开材料并未明确界定其统计客群（Cohort）、核算区间、统计实体、毛留存与净留存口径，以及对并购并表与增购客户的折算准则。因此，该指标不能直接等同于
              GRR、NRR，亦不能作为证明经常性收入持久性的充分依据。Mitsubishi Electric
              的收购通报虽表态客户关系、合作伙伴生态与运营架构均将保持不变，但这一言论出自官方通稿，无法印证交割完成后的实际续约行为。现有公开信源均未披露前几大客户收入集中度、渠道贡献占比、平均合同周期、流失率、续约客群队列或采购审批阻力。尽管规模指标与口碑反馈呈现积极态势，这些核心信息的缺失使得外界难以对其客户经济模型形成高度确信的判断。
