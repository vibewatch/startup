  - id: TE003
    title: 技术与运行架构表
    columns:
      - 架构层级 / 核心运行组件
      - 架构定位与核心功能
      - 技术依赖与前置条件
      - 运营风险与尽调焦点
    rows:
      - - 网络捕获与传感器层
        - 在普渡模型（Purdue model）第 1–3 层通过交换机镜像端口（SPAN）与分流设备（TAP）捕获原始网络报文
        - 依赖具备端口镜像功能的网管交换机网络基础设施，以及现场机柜物理空间
        - 镜像端口带宽超卖（oversubscription）可能引发峰值流量期间丢包，导致分析遗漏
      - - 深度报文检测（DPI）引擎
        - 针对工业通信协议执行实时报文解析、语法校验与载荷提取
        - 依赖内置协议语法模型、用于私有协议扩展的 Protocol SDK，以及多核 CPU 算力支持
        - 面对 10Gbps+ 超高吞吐链路时的报文处理延迟；协议若采用加密传输则存在解析盲区
      - - Dynamic Learning 与行为机器学习
        - 自动建立网络统计基线模型，并跟踪工艺变量行为模式
        - 依赖稳定的网络基线训练学习窗口，期间不得并发网络攻击或严重工艺紊乱
        - 初始部署阶段若已潜伏恶意或异常网络流量，存在将其误学并固化为正常基线的风险
      - - 威胁情报分发服务
        - 分发更新后的恶意软件特征码、Yara 规则、ICS 威胁指示器及 NVD 漏洞库映射
        - 依赖公有云在线同步，或为物理隔离的工业网络提供周期性离线更新数据包
        - 若高密工业网络延迟人工导入离线情报包，可能导致威胁检测规则滞后老化
      - - 企业级 SIEM / 可观测性层
        - 将告警信息、资产 CVE 漏洞、审计日志及系统健康指标输出至 Elastic、Datadog 及企业级统一 SOC
        - 依赖 REST API 连通性、已授权认证的 API Key 以及企业级 SIEM 数据规范字段映射模块
        - API 速率限制，或隔离的 OT 生产区与企业 IT 网跨越网络物理/逻辑边界时传输失败
    notes: 架构组件、技术依赖与风险要素汇总自 Nozomi 官方技术文档、Elastic 集成规范及产品白皮书技术指标。
