      - number: '2.3'
        title: 采购画像、采购动因与核心价值驱动
        blocks:
          - type: paragraph
            body: >-
              运营技术网络安全的采购决策，取决于厂区运营工程师、企业首席信息安全官（CISO）与合规主管等多方利益相关者的共识协同。传统上，现场工程师与工控系统操作员将生产正常运行时间、物理安全和确定性控制可靠性置于首位，因担心业务中断而对
              IT 安全软件持审慎态度。相反，企业 CISO 与安全运营中心（SOC）负责人则力求统一的企业级风险可见性，要求将工控遥测数据无缝对接到 Splunk、Microsoft Sentinel 等现有的企业 SIEM
              和 SOAR 平台中。能够妥善化解这一部门鸿沟的商业化平台，既能为现场运营团队提供零冲击的被动监测，又能为 IT 安全分析师输出标准化告警，从而赢得集团级采购标准化订单。


              地缘政治威胁环境的加剧与全球监管合规要求的空前收紧，正加速相关产品的落地进程。近期威胁情报报告（包括 Palo Alto Networks 旗下 Unit 42 对 CL-STA-1128 威胁组织的披露，以及
              Baker Botts 的法律评估）记录了超过 60 个与伊朗相关的网络黑客团伙，正持续对美国及盟国关键基础设施的 PLC 展开侦察与破坏活动。这些攻击行动通常利用默认密码和未做隔离的网络访问权限，专门攻击
              Rockwell Automation、Schneider Electric 与 Siemens
              等厂商暴露在公网上的控制器。合规层面，监管已从自愿性指引升级为伴随严厉审计处罚的强制性法规。在北美，电力企业受制于强制性 NERC CIP
              标准，该标准严查资产清单、基线监控与电子安全边界；管道运营商则必须严格遵从 TSA 安全指令。在欧盟，NIS2
              指令大幅拓展了能源、医疗、交通、水务与数字基础设施等关键实体的网络安全风险管理、供应链审查及强制事件上报范围。在这些审计框架下，NIST SP 800-82 Rev. 3 已成为最核心的通用参考基线。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
