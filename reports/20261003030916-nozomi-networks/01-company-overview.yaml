company:
  name: "Nozomi Networks"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Nozomi Networks is a pioneer and market leader in operational technology (OT), Internet of Things (IoT), and cyber-physical systems (CPS) cybersecurity, founded in 2013 and headquartered in San Francisco, California. Following an agreement in September 2025, industrial automation giant Mitsubishi Electric completed its acquisition of Nozomi Networks in January 2026 for a reported valuation of USD $1 billion, establishing it as an independently operating subsidiary. The company reached break-even performance with sustained cash flow while surpassing $100 million in annual revenue ($101.7 million net revenue in fiscal year 2025) across more than 12,000 installations, even as the return of co-founder Andrea Carcano as CEO highlights executive succession dynamics."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Stage, and Business Model"
    body: "Founded in 2013 by Andrea Carcano and Moreno Carullo, Nozomi Networks Inc. specializes in cybersecurity, asset intelligence, and anomaly detection for critical infrastructure and industrial control systems (ICS). Headquartered in San Francisco, California, the company operates across six continents and provides unified network and endpoint visibility across cyber-physical environments. Its commercial architecture delivers continuous passive deep packet inspection (DPI) through Guardian sensors running N2OS, host-level endpoint telemetry via Nozomi Arc, centralized on-premise governance via the Central Management Console (CMC), and software-as-a-service management through Nozomi Vantage. In January 2026, Mitsubishi Electric completed its acquisition of Nozomi Networks in a transaction valued at USD $1 billion, transitioning the enterprise from an independent venture-backed scaleup into a wholly owned operating subsidiary that retains its original brand, executive team, and vendor-neutral go-to-market motion. Revenue is driven by recurring software subscriptions, physical and virtual sensor appliances, premium threat intelligence feeds, and managed security service provider (MSSP) partner licensing."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "executive-governance-and-leadership"
    title: "Founders, Executive Leadership, and Governance Evolution"
    body: "Nozomi Networks was established on foundational academic and technical research in SCADA security and artificial intelligence conducted by its co-founders. Andrea Carcano, who completed doctoral research at Università degli Studi dell’Insubria analyzing SCADA intrusion detection and early malware targeting industrial control architectures, served as Chief Product Officer before returning to the Chief Executive Officer position in 2026 to lead the company's AI-focused development phase. Co-founder Moreno Carullo, also holding a doctorate in artificial intelligence, serves as Chief Technology Officer and directs software development while contributing to the IEC TC57 WG15 international standards committee for power system communications. Carcano succeeded longtime President and CEO Edgard Capdevielle, who had steered the firm's commercial scale-out through multiple funding rounds and the definitive Mitsubishi Electric acquisition. Operational leadership is rounded out by Chief Revenue Officer Kevin Isaac, Chief Financial Officer George Todd, Chief Marketing Officer Mike Plante, Chief of Staff Sai Mahalingam, and Head of People and Culture Alan Berusch. Post-acquisition governance balances corporate ownership under Mitsubishi Electric with operational autonomy, mitigating immediate key-person transition disruption while requiring ongoing monitoring of founder alignment."
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization History, Deal Economics, and Stakeholder Mapping"
    body: "Prior to its acquisition by Mitsubishi Electric, Nozomi Networks raised approximately $266 million in lifetime capital across 11 funding events. Key venture and strategic backers included Planven Investments, GGV Capital, Lux Capital, Energize Capital (formerly Energize Ventures), and THI Investments, which led its $30 million Series C round in September 2018 at a cumulative $53.8 million invested. In subsequent rounds, the company secured corporate investments from industrial and security ecosystem heavyweights such as Schneider Electric, Honeywell, and Mitsubishi Electric itself. The definitive acquisition, announced in September 2025 and closed on January 29, 2026, established a headline transaction value of USD $1 billion as reported by industry trade media. While Mitsubishi Electric provides extensive balance-sheet durability, access to global industrial automation customers, and joint engineering opportunities, the transaction caps equity upside for earlier venture participants and introduces strategic stakeholder alignment considerations. Industrial partner channels such as Yokogawa Electric and Schneider Electric remain essential to commercial distribution, demanding strict preservation of Nozomi's multi-vendor neutral posture."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "operational-scale-and-milestones"
    title: "Operational Scale, Market Traction, and Corporate Chronology"
    body: "Nozomi Networks has established substantial industrial footprint, surpassing $100 million in annual revenue by generating $101.7 million in net revenue for fiscal year 2025. The company announced it has achieved break-even operations and sustained cash flow, distinguishing itself as the first privately held OT cybersecurity provider to reach operational profitability. Its deployment scale encompasses more than 12,000 installations globally, monitoring over 115 million OT, IoT, and IT devices across critical infrastructure installations including five of the world's top ten oil and gas operators, seven of the top ten pharmaceutical manufacturers, seven of the top ten utilities, and four of the top ten mining operations. Despite rapid platform adoption, critical gaps persist regarding the full disclosure of parent-level post-merger deal terms, detailed unit gross margins, and specific regional employee allocation across its estimated 391 to 600 personnel. Furthermore, external procurement evaluations emphasize that total cost of ownership in complex industrial deployments is sensitive to site context, protocol customization, and multi-year maintenance fees."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO014"
      - "CO015"
      - "CO016"
