callouts:
  - calloutType: "insight"
    title: "Strategic Autonomy vs. Conglomerate Alignment"
    body: "The acquisition of Nozomi Networks by Mitsubishi Electric for $1.0 billion validates the critical necessity of OT/CPS security inside industrial automation. However, retaining an open, multi-vendor ecosystem is essential to Nozomi's value proposition; any perceived bias toward Mitsubishi automation hardware could jeopardize deep commercial integrations with rivals such as Schneider Electric, Rockwell, and Siemens."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO006"
      - "CO013"
  - calloutType: "risk"
    title: "Deployment Cost Transparency and Total Cost of Ownership"
    body: "Independent procurement evaluations emphasize that while Nozomi Networks exhibits top-tier passive discovery and deep industrial protocol parsing, commercial buyers must carefully model multi-year expansion pricing, protocol customization expenses, and operational tuning effort, as deployment complexity across heterogeneous plants can inflate total cost of ownership beyond base software licenses."
    claimRefs:
      - "CO006"
      - "CO015"
