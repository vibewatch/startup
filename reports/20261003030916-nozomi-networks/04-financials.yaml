company:
  name: Nozomi Networks
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a subscription-led enterprise software model with professional
    services and partner-assisted delivery, but the latest usable growth disclosures are old
    and company-issued. Current pricing, gross margin, sales efficiency, cash, burn, and runway
    remain undisclosed, preventing a standalone unit-economics or capital-adequacy conclusion.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Nozomi Networks appears to monetize enterprise OT and IoT security primarily through
      subscriptions, supplemented by professional services and partner-enabled deployment.
      Multiples.vc labels the revenue model as subscription, while Nozomi's 2020 release said
      revenue growth was driven by subscription revenue and that professional-services
      engagements increased 45% year over year. The partner channel can deploy the platform
      on-premises, in hybrid environments, with cloud resources, or as a managed service,
      broadening routes to market but adding uncertainty around reseller discounts and service
      economics. No retained source publishes list pricing, realized contract value, billing
      units, revenue mix, or recognition policy, so neither price realization nor recurring
      revenue quality can be underwritten from public evidence.
    claimRefs:
      - CI001
      - CI002
      - CI012
      - CI015
      - CI016
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      Public traction is substantial but measurement quality is uneven. Nozomi currently claims
      more than 115 million monitored devices, more than 12,000 installations, and 100% customer
      retention; independent conference coverage in March 2024 reported more than 105 million
      devices across 12,000-plus installations. The installation count is therefore directionally
      corroborated, but device counts and retention remain company-defined, with no denominator,
      cohort, contract-value, or renewal methodology. Historical releases reported 66% revenue
      growth in the first half of 2020 and a 110% ARR increase around 2021, but those periods are
      too old to establish current growth. Partner reach and deployment scale are useful sales
      proxies, not substitutes for CAC, payback, net retention, or sales-cycle evidence.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI015
    tableRefs:
      - TI003
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The reviewed evidence does not quantify gross margin, hosting expense, hardware content,
      implementation labor, support burden, channel fees, working capital, or capital expenditure.
      That matters because an OT-security platform can combine software subscriptions with sensors,
      deployment work, tuning, support, and managed-service delivery; those activities may carry
      different margins and cash-conversion profiles. The 100% retention claim is encouraging but
      cannot be translated into gross retention, net revenue retention, or expansion economics
      without a cohort definition. Similarly, installation and device counts reveal footprint,
      not revenue per customer or contribution margin. Nozomi's careers page emphasizes frugality,
      but a cultural statement is not evidence of operating leverage or free-cash-flow generation.
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI006
      - CI016
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The latest disclosed financing was a $100 million Series E in March 2024, intended to scale
      product development and global go-to-market activity. Independent sources place cumulative
      funding above $250 million, with Tracxn reporting $266 million, but funding raised is not cash
      available. Mitsubishi Electric's acquisition changes the financing context, yet the reviewed
      sources disclose neither Nozomi's closing cash nor any parent funding commitment. Multiples.vc
      reports a $950 million transaction value and a 9.4x multiple on $101 million of revenue, while
      also discussing $883 million for the remaining 93% and $75 million of 2024 revenue; these
      different denominators and periods should not be treated as ARR or a clean current revenue
      multiple. The verdict is therefore positive on recurring-model signals and scale, but
      indeterminate on margin quality, cash generation, and forward capital adequacy.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI013
      - CI014
      - CI016
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Unit or basis
      - Public status
      - Quality and diligence ask
    rows:
      - - Software subscription
        - Recurring access to the security platform
        - Contract unit not disclosed
        - Supported as the primary model; no current mix disclosed
        - Obtain ARR by product, contract duration, renewal terms, and recognized revenue
      - - Professional services
        - Deployment, tuning, support, and related engagements
        - Engagement or project basis; pricing undisclosed
        - Engagements grew 45% year over year in H1 2020
        - Obtain services revenue, attach rate, utilization, and gross margin
      - - Partner-enabled deployment
        - Certified partners deploy or manage customer environments
        - On-premises, hybrid, cloud, or managed configuration
        - Delivery routes are disclosed; commercial splits are not
        - Obtain reseller discounts, referral fees, and support obligations
      - - Existing-customer expansion
        - Additional installations and services within deployed customers
        - Installation, device, site, or module basis is unknown
        - Expansion was described historically but not quantified currently
        - Obtain expansion ARR, net retention, and same-customer cohort data
      - - New enterprise deployments
        - Subscription and services sold to critical-infrastructure customers
        - Customer and installation definitions are undisclosed
        - More than 12,000 installations are company-claimed
        - Reconcile customers, sites, installations, devices, and contract value
    notes: >-
      Public-source synthesis; revenue shares, contract units, realized pricing, and recognition
      timing are not disclosed, so unknown fields are diligence gaps rather than estimates.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI012
      - CI015
      - CI016
  - id: TI002
    title: Pricing and monetization diligence map
    columns:
      - Pricing dimension
      - Public evidence
      - What cannot be inferred
      - Diligence request
    rows:
      - - Subscription list price
        - No amount in the retained sources
        - Realized ACV or revenue
        - Price book by module, deployment mode, and customer tier
      - - Deployment scope
        - Devices and installations are disclosed as operating scale
        - Whether billing is per device, site, sensor, module, or enterprise
        - Contract samples linking scope metrics to billed units
      - - Professional services
        - Engagement growth was reported for H1 2020
        - Rate card, attach rate, utilization, or services margin
        - Services bookings, revenue, backlog, staffing, and gross margin
      - - Channel economics
        - Partners can deploy and manage multiple environment types
        - Discount, referral, resale, or managed-service revenue share
        - Partner contracts and direct-versus-channel margin bridge
      - - Renewal and expansion
        - Nozomi claims 100% customer retention
        - Gross versus logo retention, cohort period, or expansion pricing
        - Gross retention, NRR, churn reasons, and renewal uplift by cohort
    notes: >-
      No list or realized prices were present in the assigned evidence pool; operating scale and
      retention claims are not used as substitutes for contract pricing.
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI015
      - CI016
  - id: TI003
    title: Unit-economics and capital-adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Current recurring revenue
        - Not disclosed
        - Low
        - Establishes scale and recurring revenue base
        - ARR and GAAP revenue by product, geography, and channel
      - - Historical growth
        - 66% revenue growth in H1 2020; 110% ARR increase reported around 2021
        - Medium for the cited periods; low for current inference
        - Indicates prior momentum but not current trajectory
        - Monthly ARR and revenue bridge for 2024-2026
      - - Customer retention
        - 100% company-claimed
        - Low without a cohort definition
        - Renewal quality drives lifetime value
        - Logo retention, gross dollar retention, NRR, and cohort methodology
      - - Gross margin
        - Not disclosed
        - Low
        - Tests software leverage versus delivery and hardware burden
        - Subscription, services, hardware, and consolidated gross margin
      - - CAC and payback
        - Not disclosed
        - Low
        - Tests enterprise sales efficiency and channel leverage
        - CAC, sales cycle, win rate, payback, and channel-adjusted contribution
      - - Cash, burn, and runway
        - Not disclosed
        - Low
        - Determines financing dependency and parent-support needs
        - Closing cash, monthly burn, committed parent funding, and runway plan
    notes: >-
      Values preserve the source metric names and periods; revenue growth is not ARR growth,
      retention lacks a disclosed denominator, and funding raised is not treated as cash available.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI008
      - CI009
      - CI011
      - CI013
      - CI014
      - CI016
