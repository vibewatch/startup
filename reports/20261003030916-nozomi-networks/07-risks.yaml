schemaVersion: "report-v2"
artifact: risks
slug: nozomi-networks
runDate: 2026-10-03
company:
  name: Nozomi Networks
chapter:
  number: 7
  title: Risks
  summary: >-
    Nozomi's most consequential disclosed legal exposure is export-control and
    sanctions compliance for products the company classifies as dual-use, while
    the strongest independent operating-risk evidence points to tuning,
    integration, multi-site rollout, and services dependencies. The assigned
    evidence does not establish a litigation or enforcement history, customer
    concentration, or private-company financial resilience, so those remain
    diligence gaps rather than inferred assurances.
sections:
  - id: risk-prioritization
    title: Risk posture and priority
    body: >-
      The risk profile is driven more by consequence and execution complexity
      than by a confirmed adverse-event record. Nozomi's current company page
      claims more than 115 million monitored devices, more than 12,000
      installations, and 100% customer retention. That breadth increases the
      potential impact of control, tuning, or partner-delivery failures, but the
      retained page does not disclose the retention cohort, period,
      denominator, or independent assurance. The heatmap therefore treats
      disclosure opacity as a risk in its own right and does not interpret the
      assigned adverse search's empty result set as evidence that incidents,
      litigation, or enforcement have not occurred.
    claimRefs: [CR002, CR003, CR004]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal and regulatory exposure
    body: >-
      Nozomi's own trade-compliance policy says some products are dual-use,
      requiring customer, transaction, end-use, and end-user screening. The
      policy also identifies possible criminal and civil penalties, loss of
      export privileges, and reputational damage, and prescribes five-year
      export-document and ten-year sanctions-record retention. These controls
      show that management recognizes the exposure; they do not independently
      verify operating effectiveness or establish a clean enforcement record.
      The company-issued NIST mapping guide is likewise useful as a control
      design reference, but its description of CSF 2.0 as voluntary guidance is
      not a certification or regulator finding.
    claimRefs: [CR011, CR012, CR013, CR015]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, quality, and security execution
    body: >-
      Independent procurement analysis identifies concrete deployment risks:
      detection quality depends on baselining and OT expertise, large multi-site
      rollouts add administrative complexity, and policy enforcement depends on
      integrations and disciplined change control. A Nozomi-authored banking
      example adds a customer-side failure mode: a third-party alarm contractor
      had not changed default credentials or updated firmware. This anecdote is
      not a failure-rate estimate, but it shows why platform performance alone
      cannot eliminate site governance risk. Kill criteria should therefore be
      tied to measured alert burden, coverage stability, integration failures,
      and time to remediate rather than vendor feature claims.
    claimRefs: [CR007, CR008, CR009, CR014]
    tableRefs: [TR002]
  - id: dependencies-financial
    title: Partner, commercial, and execution dependencies
    body: >-
      Nozomi presents a broad ecosystem of security, automation, and cloud
      partners and says certified partners can deploy on-premises, hybrid,
      cloud, or managed configurations. Telefónica's 2020 investment also
      reinforced a managed-service relationship with ElevenPaths. This breadth
      can improve distribution and implementation capacity, but it creates
      accountability, integration, and service-quality dependencies whose
      concentration is not disclosed. Independent procurement analysis further
      warns that high-touch services can add cost and vendor dependence. The
      assigned public evidence contains no current burn, runway, margin,
      working-capital, or post-acquisition operating data, so financial
      resilience cannot be scored responsibly.
    claimRefs: [CR001, CR005, CR006, CR010, CR016]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction
      - Evidence and status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Dual-use export and sanctions controls
        - "United States, European Union, and cross-border sales"
        - "Company policy says some products are dual-use and require customer, transaction, end-use, and end-user screening."
        - "Unknown; assigned evidence does not establish control-failure frequency."
        - "High if breached; the policy cites criminal/civil penalties and loss of export privileges."
        - "Documented policy, named compliance ownership, screening, and employee training."
        - "Material until testing, exception logs, and regulator correspondence are reviewed."
        - "Review classifications, licenses, denied-party screening logs, training completion, exceptions, and legal attestations."
      - - Export and sanctions record retention
        - "United States and European Union"
        - "Policy requires five years for export records and ten years for sanctions and screening records."
        - "Unknown; no audit results were allocated."
        - "High where missing records impair a regulator response or license defense."
        - "Documented retention periods and escalation contacts."
        - "Material because public policy does not prove record completeness."
        - "Sample records across entities and test retention, immutability, escalation, and legal-hold controls."
      - - Framework and sector-specific compliance claims
        - "Customer-specific regulated sectors"
        - "Company mapping aligns the platform to voluntary NIST CSF 2.0; independent procurement analysis says reporting needs tailoring and is not a GRC replacement."
        - "High likelihood of customer-specific tailoring in regulated deployments."
        - "Medium-high if sales claims outrun delivered audit evidence."
        - "Framework mapping is documented; independent certification was not established."
        - "Material in financial, government, energy, and critical-infrastructure procurements."
        - "Obtain current certifications, penetration-test scope, control mappings, customer audit exceptions, and regulator-facing evidence."
    notes: >-
      Partial register based only on allocated public evidence as of 2026-10-03;
      likelihood is left unknown where no frequency evidence exists, and severity
      reflects stated consequences rather than a recorded violation.
    enumerationScope:
      coverage: partial
      basis: >-
        Public company policy, company-issued framework mapping, partner evidence,
        and independent procurement commentary allocated to this chapter.
    claimRefs: [CR001, CR007, CR011, CR012, CR013, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator
      - Unresolved gap
    rows:
      - - "Alert baselining and tuning do not control noise"
        - "Environment-dependent; independent analysis says some environments need ongoing tuning."
        - "High where analyst overload delays validation or containment."
        - "Partial; platform and services are available, but stable workflow evidence is customer-specific."
        - "High for heterogeneous sites without OT expertise."
        - "Alerts per asset, false-positive rate, median triage time, and tuning backlog."
        - "No customer-level tuning benchmarks or service-level outcomes were allocated."
      - - "Multi-site architecture and release coordination fail to scale"
        - "Environment-dependent; complexity rises in constrained and distributed deployments."
        - "High where visibility gaps affect critical infrastructure."
        - "Partial; centralized products and partner deployment are company-claimed."
        - "High until representative production sites pass acceptance tests."
        - "Sensor coverage, offline sites, release skew, packet loss, and unresolved assets."
        - "No independent fleet-wide reliability or uptime series was allocated."
      - - "Customer-side device or contractor hygiene undermines coverage"
        - "Not quantified; company reports one bank contractor example."
        - "High because default credentials and stale firmware can enable compromise."
        - "Partial; visibility tools do not replace customer ownership and remediation."
        - "Material and shared with customers, OEMs, and contractors."
        - "Default credentials, firmware age, unmanaged devices, and overdue remediation."
        - "The anecdote does not establish prevalence across customers."
      - - "Workforce capacity constrains implementation or support"
        - "Unknown; the fetched careers page displayed no current job entries."
        - "Medium-high if specialist capacity lags deployment complexity."
        - "Unobservable from allocated public evidence."
        - "Material until staffing and support capacity are disclosed."
        - "Open specialist roles, implementation backlog, support response time, and attrition."
        - "No current headcount, vacancy, attrition, or support-capacity data was allocated."
    notes: >-
      Severity is consequence-based and conditional; no row estimates an incident
      rate, and the careers-page observation is a disclosure gap rather than proof
      of a hiring freeze.
    claimRefs: [CR002, CR003, CR007, CR009, CR014, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - "Enforcement and remote-access integrations"
        - "Firewalls, NAC, control systems, and external remote-access tooling"
        - "Not disclosed by integration or deployed asset"
        - "Integration loss, policy error, or weak change control prevents safe enforcement."
        - "High in production OT environments"
        - "Stage controls, require rollback, test least privilege, and measure integration health."
        - "High because independent analysis characterizes enforcement and governance as integration-dependent."
      - - "Certified deployment and managed services"
        - "Global security, engineering, automation, and cloud partner ecosystem"
        - "Broad named ecosystem; revenue and delivery concentration are not disclosed"
        - "Variable partner capability or accountability slows deployment, tuning, or incident response."
        - "Medium-high"
        - "Partner certification, acceptance testing, direct escalation, and service-level obligations."
        - "Material because high-touch services can add cost and vendor dependence."
      - - "Strategic channel relationship"
        - "Telefónica / ElevenPaths managed security relationship"
        - "Unknown; retained evidence is historical and supplies no current revenue share"
        - "A stale or weakened channel reduces regional reach and managed-service delivery."
        - "Medium"
        - "Confirm current contract, pipeline, trained capacity, renewal terms, and customer references."
        - "Material until current economics and activity are verified."
    notes: >-
      Partner breadth is company- and partner-reported; no allocated source
      discloses revenue concentration, partner-attributed bookings, renewal
      economics, or current channel productivity.
    claimRefs: [CR001, CR005, CR006, CR008, CR010]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Ordinal risk view separates consequence, evidence-based likelihood language,
      mitigation maturity, and residual exposure without inventing probabilities.
    data:
      columns:
        - Impact
        - Likelihood
        - Mitigation maturity
        - Residual severity
      rows:
        - label: "Export-control breach"
          values:
            - Critical
            - Unknown
            - "Documented policy"
            - Material
        - label: "Alert tuning failure"
          values:
            - High
            - "Environment-dependent"
            - Partial
            - High
        - label: "Integration / change-control failure"
          values:
            - High
            - "Environment-dependent"
            - "Partner-dependent"
            - High
        - label: "Multi-site rollout complexity"
          values:
            - High
            - "Environment-dependent"
            - Partial
            - High
        - label: "Partner delivery dependence"
          values:
            - "Medium-high"
            - Unknown
            - "Ecosystem-based"
            - Material
        - label: "Financial and retention disclosure gap"
          values:
            - "Medium-high"
            - "Current information gap"
            - "Diligence only"
            - Material
    approximationNotes: >-
      Ordinal labels are analyst judgments anchored to cited consequences and
      disclosed mitigations; likelihood remains unknown where sources provide no
      frequency or probability evidence.
    claimRefs: [CR004, CR007, CR011, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Escalate to avoid if diligence finds an export-control violation with
      material sanctions or lost privileges, persistent high-severity alert
      overload, failed production integrations without rollback, significant
      undisclosed partner concentration, or financial runway insufficient to
      support contracted deployments. The assigned public evidence does not
      establish whether any trigger has occurred.
    claimRefs: [CR007, CR008, CR010, CR012]
