      whyItMatters: >-
        Public product scale and retention claims cannot establish cash
        resilience, margin quality, or capacity to support complex deployments.
      diligencePath: >-
        Obtain audited statements, monthly management accounts, ARR bridge,
        cohort retention schedules, cash forecast, support-cost allocation, and
        parent-company funding commitments.
