      modules, Separate base platform fees from implementation, protocol customization, and managed service costs, and
      Model multi-year expansion pricing, renewal uplifts, and premium support requirements before commitment
      Implementation risks: Insufficient site-level network context can reduce discovery quality and detection
      reliability, Undefined ownership between OT and security teams slows remediation and policy enforcement, and Pilot
      success may not translate across heterogeneous plants without phased architecture planning
