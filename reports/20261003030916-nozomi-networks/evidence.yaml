evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deal-economics
    missingEvidence: >-
      Official SEC or Tokyo Stock Exchange transaction documentation specifying the definitive consideration breakdown,
      cash vs debt terms, and earnout agreements of the Mitsubishi Electric acquisition.
    whyItMatters: >-
      While press reporting cites a USD $1 billion valuation, audited parent disclosures are necessary to establish
      final enterprise value and multiple valuations.
    diligencePath: >-
      Review future annual securities filings (Yukashoken Hokokusho) from Mitsubishi Electric Corporation (TOKYO: 6503)
      for subsidiary purchase price allocation.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      Audited payroll or standardized regulatory filings clarifying the active global full-time equivalent (FTE)
      employee count of Nozomi Networks.
    whyItMatters: >-
      Public estimates range between 391 employees (LeadIQ directory) and 600 employees (company press releases),
      skewing revenue-per-employee productivity calculations.
    diligencePath: >-
      Request verified organizational census and geographical headcount allocation during confidential commercial
      diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-margins
    missingEvidence: >-
      Audited financial statements detailing gross margins across hardware appliances, software subscriptions, and
      professional services, as well as net revenue retention (NRR).
    whyItMatters: >-
      Without segmented gross margins, the underlying software margin durability and cash conversion efficiency cannot
      be independently modeled.
    diligencePath: Examine subsidiary management accounts or confidential financial disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: som-market-share
    missingEvidence: >-
      Audited breakdowns of Nozomi Networks FY2025 and 2026 annualized recurring revenue (ARR) and contract counts by
      customer tier to calculate exact SOM penetration.
    whyItMatters: >-
      Without segmented financial disclosures post-acquisition by Mitsubishi Electric, vendor-specific SOM capture can
      only be estimated from high-level company claims.
    diligencePath: >-
      Examine post-acquisition parent reporting from Mitsubishi Electric Corporation (TOKYO: 6503) and future statutory
      filings for subsidiary segment disclosures.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Current audited revenue, ARR, revenue mix, contract duration, and revenue-recognition policy.
    whyItMatters: These inputs are required to separate recurring software revenue from services and other delivery components.
    diligencePath: Obtain audited financials and a monthly 2024-2026 ARR-to-GAAP-revenue bridge by product and channel.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by stream, CAC, payback, sales cycle, churn, NRR, services utilization, and channel economics.
    whyItMatters: >-
      Scale and retention claims cannot establish profitable growth without acquisition cost, expansion, and
      delivery-cost evidence.
    diligencePath: Review cohort-level bookings, renewal, sales-efficiency, and contribution-margin schedules with definitions.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Closing cash, monthly burn, runway, debt obligations, planned uses, and committed Mitsubishi Electric support.
    whyItMatters: Historical funding and acquisition ownership do not establish available liquidity or financing independence.
    diligencePath: Obtain the latest balance sheet, 24-month cash forecast, debt schedule, and written parent-funding commitments.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: List pricing, realized ACV, discounting, billing unit, renewal uplift, and partner revenue share.
    whyItMatters: Pricing opacity prevents assessment of revenue durability, expansion mechanics, and channel-adjusted margins.
    diligencePath: Sample recent direct and partner contracts and reconcile quoted scope to invoiced and recognized revenue.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Cohort-based logo retention, GRR, NRR, churn, renewal, contract-length, and expansion metrics with periods and
      customer definitions.
    whyItMatters: >-
      A headline 100% retention claim cannot establish recurring-revenue durability or expansion without definitions and
      cohort evidence.
    diligencePath: >-
      Request monthly logo and revenue cohorts for the last 36 months, reconcile them to contracts and billing, and
      interview a sample of renewed and churned customers.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-one, top-five, and top-ten customer revenue shares, partner-sourced revenue, renewal calendars, and
      channel-specific pipeline conversion.
    whyItMatters: >-
      Broad vertical and geographic claims do not show whether revenue or service delivery depends on a small set of
      customers or channel partners.
    diligencePath: >-
      Obtain an anonymized customer revenue ledger and channel attribution by quarter, then test concentration,
      renewals, and partner dependency.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete named-customer list distinguishing production deployments, pilots, paid proofs of concept, deployment
      size, dates, and quantified outcomes.
    whyItMatters: Anonymous review excerpts cannot verify referenceability, deployment maturity, or account-level expansion.
    diligencePath: >-
      Request the customer reference roster and select at least five customers across major verticals for independent
      reference calls and contract verification.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      Primary court, regulator, sanctions, enforcement, and incident records establishing whether Nozomi has faced
      claims, violations, or penalties.
    whyItMatters: >-
      A company policy documents obligations but cannot establish a clean legal or regulatory history or prove control
      effectiveness.
    diligencePath: >-
      Run jurisdiction-specific court and regulator searches, review legal representations and regulator correspondence,
      and obtain counsel's litigation and compliance schedule.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model-risk
    missingEvidence: >-
      Current audited revenue, ARR reconciliation, gross margin, burn, cash, runway, working capital, service costs,
      customer concentration, and post-acquisition budget data.
    whyItMatters: >-
      Public product scale and retention claims cannot establish cash resilience, margin quality, or capacity to support
      complex deployments.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, ARR bridge, cohort retention schedules, cash forecast,
      support-cost allocation, and parent-company funding commitments.
    relatedQuestionRefs:
      - QR006
  - type: enumeration-incomplete
