    Nozomi Networks is a San Francisco-headquartered OT, IoT, and CPS cybersecurity company founded in 2013 and now
    operating as an independently run, wholly owned Mitsubishi Electric subsidiary. Its platform combines Guardian
    sensors, Arc endpoint telemetry, CMC/Vantage management, and threat-intelligence services for
    critical-infrastructure customers.
