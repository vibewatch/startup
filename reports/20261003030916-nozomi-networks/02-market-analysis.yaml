callouts:
  - calloutType: "insight"
    title: "Network Segmentation Visibility vs. Firewall Enforcement Gap"
    body: "Industrial cybersecurity buyers frequently conflate OT network visibility with enforcement. Passive monitoring platforms map communication flows and recommend ISA/IEC 62443 zone boundaries, but actual policy enforcement requires firewalls and managed switches. Organizations that fail to budget for active enforcement infrastructure encounter significant friction post-deployment."
    claimRefs:
      - "CM013"
  - calloutType: "risk"
    title: "Switch SPAN Bottlenecks and Deployment Lag in Brownfield Facilities"
    body: "Passive deep packet inspection depends on switch SPAN ports and physical network taps. In legacy industrial plants, aging switches lack port capacity, and configuration changes must wait for scheduled maintenance turnarounds that occur every 12 to 36 months, creating substantial lead time between software purchase and full sensor deployment."
    claimRefs:
      - "CM014"
