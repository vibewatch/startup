company:
  name: "Nozomi Networks"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a track/research-more posture, not a precise current valuation: Forge records an $801.55M March 2024 post-money mark, while Mitsubishi Electric has since acquired Nozomi and the retained acquisition coverage does not disclose consideration. Company-issued FY2025 net revenue and operating-scale claims are encouraging, but current price, audited economics, full preference terms, and subsidiary-level exit mechanics remain unavailable."
sections:
  - id: "decision-frame"
    title: "Decision Frame and Recommendation"
    body: >-
      Nozomi should be tracked rather than priced from public evidence. Forge records an
      $801.55M post-money valuation for the March 2024 Series E, but also shows no available
      Forge price and limited market activity. The company was subsequently acquired by
      Mitsubishi Electric and now operates as an independent, wholly owned subsidiary,
      so the 2024 financing mark is neither a current standalone price nor an observable
      acquisition value. The strongest operating datapoint in the assigned evidence is
      company-issued FY2025 net revenue of $101.7M. That figure is revenue, not ARR, and
      it does not disclose growth, gross margin, free cash flow, retention economics, or
      acquisition consideration. Those omissions make a precise entry multiple, return
      target, or valuation range unsupported.
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV010"
      - "CV011"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-antithesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The positive case rests on operating scale, strategic sponsorship, and deployment
      breadth. Nozomi says it monitors more than 115 million OT, IoT, and IT devices across
      more than 12,000 installations, and its homepage describes a partner ecosystem able
      to support on-premises, hybrid, cloud, and managed deployments. Strategic investors
      participated in the 2024 financing, and Mitsubishi Electric later completed the
      acquisition while preserving operational independence. The countercase is that every
      current scale metric in this pool is company-issued, the reported revenue lacks an
      audited profitability bridge, and ownership by an industrial vendor may complicate
      the neutral ecosystem proposition. The careers page displayed no open positions at
      access time; that is a diligence signal only, not evidence of a hiring freeze or
      workforce contraction.
    claimRefs:
      - "CV005"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "financing-and-scenarios"
    title: "Financing Context and Scenario Discipline"
    body: >-
      The financing record requires reconciliation before it can anchor valuation. Forge
      lists an $80M Series E and 1.0x, non-participating preference terms, while Crunchbase
      described the 2024 Series E as $100M and reported $266M raised since inception. Those
      figures can reflect different round components or database conventions and should not
      be treated as interchangeable with cash available, ARR, or acquisition proceeds.
      Sector financing references are also insufficient as valuation comparables: Crunchbase
      cited Claroty's $100M strategic debt facility and Dragos's $74M equity round, but
      neither amount supplies enterprise value, revenue, growth, or profitability. Bull,
      base, and bear outcomes therefore use explicit evidence gates rather than fabricated
      multiples or probabilities. A valuation range should be opened only after deal price
      or current subsidiary economics become available.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness, Triggers, and Diligence"
    body: >-
      The conventional private-company exit path has already been replaced by ownership
      inside Mitsubishi Electric. A prospective investor therefore needs clarity on the
      security being valued, its transferability, governance rights, and whether any
      subsidiary-level liquidity route exists. The immediate diligence package should
      include executed transaction consideration, the fully diluted capitalization and
      preference waterfall, audited FY2025 financials, current revenue mix, gross margin,
      retention, cash generation, and integration reporting. Upgrade the view only if
      verified economics demonstrate durable growth and margins while partner neutrality
      remains intact. Downgrade it if integration weakens third-party channels, customer
      retention deteriorates, reported revenue quality is not substantiated, or no credible
      liquidity instrument can be identified.
    claimRefs:
      - "CV003"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV016"
