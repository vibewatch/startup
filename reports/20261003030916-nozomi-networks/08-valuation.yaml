      - ["Anti-thesis", "The current value and acquisition consideration are absent from the retained public evidence.", "Executed deal documents or Mitsubishi Electric disclosures establish consideration and the security being valued."]
    notes: "Scale and revenue are company-issued claims; acquisition status is supported by company-issued and independent coverage, while valuation absence is bounded to the retained source set."
