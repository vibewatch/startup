  - id: "TV003"
    title: "Bull / Base / Bear Scenarios"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Probability signal"
      - "Downside trigger"
    rows:
      - ["Bull", "Audited growth, margins, retention, and cash generation validate the scale claims; partner neutrality survives integration.", "Re-open valuation using verified current economics and comparable enterprise-value metrics; no range is supportable yet.", "Positive only after audited evidence and durable independent-channel indicators.", "Integration constrains OEM-neutral partnerships or reported economics miss verified targets."]
      - ["Base", "Nozomi remains operationally independent, but consideration and full economics stay private.", "Continue to track without assigning a current standalone value or target return.", "Most consistent with the present public evidence.", "Evidence remains unavailable through the next diligence cycle or ownership rights are unclear."]
      - ["Bear", "Integration reduces ecosystem neutrality, retention weakens, or revenue quality and liquidity rights fail diligence.", "Treat the old financing mark as non-actionable and pass rather than infer a discount.", "Activated by measurable operating or governance deterioration.", "Partner exits, material retention decline, adverse margin evidence, or no credible transferable security."]
    notes: "Scenarios deliberately omit valuation ranges and numeric probabilities because acquisition consideration, audited economics, security rights, and comparable enterprise values are unavailable."
    claimRefs:
