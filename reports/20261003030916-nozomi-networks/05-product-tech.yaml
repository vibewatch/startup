callouts:
  - calloutType: "strength"
    title: "Non-Intrusive Deep Packet Inspection and Dynamic Learning Baseline"
    body: "Nozomi Networks' primary technical strength lies in its non-intrusive full-stack architecture, combining 7-layer industrial protocol parsing with automated Dynamic Learning baselining. By validating command grammar and tracking live process control variables without requiring disruptive active scanning or direct access to production SCADA historians, Guardian provides deep visibility while maintaining zero operational process disruption risk."
    claimRefs:
      - "CE004"
      - "CE007"
      - "CE009"
      - "CE010"
  - calloutType: "risk"
    title: "Active Polling Safety and Cloud Air-Gap Governance"
    body: "While passive monitoring ensures safety, complete asset verification requires active Smart Polling and endpoint Arc deployment, introducing potential disruption risks if applied aggressively across sensitive legacy PLCs. Furthermore, enterprise reliance on cloud-native Vantage analytics creates operational tension in strictly air-gapped critical infrastructure environments where outbound telemetry is prohibited by regulatory or physical security mandates."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE005"
      - "CE006"
