  - id: "deep-packet-inspection-and-operating-workflow"
    title: "Operational Mechanics: Deep Packet Inspection, Dynamic Learning, and Industrial Use Cases"
    body: "The technical foundation of Nozomi Networks' detection engine relies on protocol-specific Deep Packet Inspection (DPI) coupled with machine-learning-based behavioral modeling termed Dynamic Learning. In industrial control networks, communications frequently rely on specialized, unencrypted legacy protocols such as Modbus, EtherNet/IP, DNP3, IEC 60870-5-104, and Siemens S7. Unlike generic IT network monitors that inspect only standard TCP/IP packet headers, Guardian validates payload syntax, transaction grammar, and operational command sequences across all seven layers of the OSI model, down to Layer 2 protocols like GOOSE used in electrical substations. The built-in Protocol SDK allows engineering teams to extend parser support to proprietary vendor protocols.\n\nDuring initial deployment, Guardian operates in a non-intrusive learning phase, passively analyzing traffic flows, device relationships, and process control variables to build an interactive virtual baseline model of the physical process. Once network baselines stabilize, the system automatically transitions into protective monitoring mode. This automated progression reduces manual configuration overhead and diminishes false-positive alert volumes that commonly plague industrial deployments. Beyond cyber threat signatures, Guardian models operational process variables—such as pipeline gas pressure, fluid temperature, and pump rotational speeds—in real time. By tracking deviations in process parameters directly from network traffic without requiring access to a supervisory data historian, Nozomi detects anomalous physical states and early-stage cyber-physical tampering before equipment failure or physical disruption occurs.\n\nEnterprise workflows leverage this telemetry through customizable dashboards, real-time query engines, and automated assertions. Security analysts and plant operations engineers configure continuous policy assertions that inspect live network state for Indicators of Compromise (IOCs) or protocol policy violations, immediately generating alerts and relaying incident forensics to enterprise SIEM, SOAR, and IT ticketing systems."
    claimRefs:
      - "CE004"
