chapter:
  number: 5
  title: "Product & Technology"
  summary: "Nozomi Networks delivers an integrated operational technology (OT), Internet of Things (IoT), and cyber-physical systems (CPS) visibility and security platform spanning physical appliances, virtual sensors, endpoint agents, and cloud analytics. The platform combines passive deep packet inspection, active smart polling, endpoint detection via Arc, and SaaS aggregation through Vantage to monitor industrial networks across Levels 0–4 of the Purdue model. Technical differentiation centers on protocol-specific DPI across industrial communication standards, dynamic behavioral learning, and automated operational context correlation, while technical risks concentrate on sensor maintenance overhead, active polling safety in legacy PLC environments, and post-acquisition integration governance under Mitsubishi Electric."
sections:
  - id: "product-definition-and-modular-footprint"
    title: "Product Architecture, Sensor Portfolio, and Modular Platform Footprint"
    body: "Nozomi Networks delivers an operational technology (OT), Internet of Things (IoT), and cyber-physical systems (CPS) cybersecurity platform engineered for critical infrastructure and mission-critical production environments. The platform addresses the historical visibility deficit across industrial facilities where conventional IT security tools cannot safely monitor proprietary automation protocols or tolerate active network scanning. Nozomi's technical footprint spans distributed edge data collection sensors, endpoint detection modules, centralized management appliances, and cloud-native analytics services designed to protect assets across all tiers of the Purdue Enterprise Reference Architecture.\n\nThe core instrumentation tier is anchored by Nozomi Guardian, a multi-form-factor appliance deployed at industrial network switch SPAN or mirror ports. Guardian operates passively by inspecting industrial network traffic without injecting packets into sensitive control networks, capturing asset telemetry and communication baselines. For deep asset verification, Guardian supports an optional Smart Polling add-on module that conducts targeted, low-volume active interrogations of endpoints to extract exact hardware model numbers, firmware versions, and patch levels without disrupting PLC operation. To monitor distributed substations and remote pump stations, Nozomi provides low-resource Remote Collectors that relay localized telemetry back to central Guardian engines.\n\nEndpoint visibility and host-level defense are delivered through Nozomi Arc, an endpoint sensor deployed on engineering workstations, human-machine interfaces (HMIs), and industrial servers. Arc captures host behavioral metrics, monitors user logins and privilege escalation, detects unauthorized software changes, and defends against insider threats, operating in either sensor-licensed or endpoint-licensed modes connected to Guardian or Vantage. Centralized enterprise administration is provided either on-premises through the Central Management Console (CMC)—available as a physical appliance, virtual machine, or private cloud instance—or via Vantage, a scalable SaaS platform providing multi-tenant visibility, automated threat response orchestration, and integration with third-party enterprise IT security stacks."
