  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and priority
        blocks:
          - type: paragraph
            body: >-
              The risk profile is driven more by consequence and execution complexity than by a confirmed adverse-event
              record. Nozomi's current company page claims more than 115 million monitored devices, more than 12,000
              installations, and 100% customer retention. That breadth increases the potential impact of control,
              tuning, or partner-delivery failures, but the retained page does not disclose the retention cohort,
              period, denominator, or independent assurance. The heatmap therefore treats disclosure opacity as a risk
              in its own right and does not interpret the assigned adverse search's empty result set as evidence that
              incidents, litigation, or enforcement have not occurred.
