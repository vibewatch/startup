      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Industrial Automation Neutrality Dilemma Post-Acquisition
            body: >-
              Following Mitsubishi Electric's completed acquisition in January 2026, Nozomi Networks operates as an
              independent subsidiary to preserve its vendor-agnostic technology roadmap [CP011, CP012]. In the
              industrial automation market, plant operators routinely operate heterogeneous control environments
              spanning Siemens, Schneider Electric, ABB, Emerson, and Rockwell Automation [CP010]. If competitors
              leverage Mitsubishi's ownership to sow doubt regarding Nozomi's long-term multi-vendor neutrality,
              pure-play rivals like Claroty and Dragos could capture defensive market share among rival automation
              vendors [CP001, CP012].
            calloutType: insight
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Deployment Complexity and Tuning Overhead as Displacement Vectors
            body: >-
              Public procurement feedback and buyer scorecards indicate that while Nozomi scores exceptionally high on
              asset discovery (4.9/5) and protocol coverage (4.8/5), discovery quality depends heavily on sensor
              placement in fragmented networks, and alert volumes require extensive operational tuning to prevent
              fatigue [CP008, CP009]. In complex industrial deployments, failure to establish clear operational
              ownership between IT security and plant engineers creates vulnerability to churn during multi-year
              renewals [CP004, CP005].
            calloutType: risk
