figures:
  - id: FO001
    title: Nozomi Networks Corporate and Product Evolution Milestones
    type: timeline
    summary: >-
      Key corporate, financing, product, and acquisition milestones from founding in 2013 through the 2026 Mitsubishi
      Electric acquisition and executive leadership transition.
    data:
      items:
        - date: 2013-06
          label: Company Founding
          detail: >-
            Andrea Carcano and Moreno Carullo establish Nozomi Networks to develop AI-driven ICS and SCADA network
            visibility solutions.
        - date: 2018-01
          label: Series B Financing
          detail: Secures $15M in Series B venture capital to accelerate international expansion across five continents.
        - date: 2018-09
          label: Series C Financing
          detail: Closes $30M Series C round led by Planven Investments, bringing cumulative funding to $53.8M.
        - date: 2021-08
          label: MSSP Program Launch
          detail: >-
            Launches industry's first dedicated OT and IoT managed security services provider (MSSP) partner
            certification program.
        - date: 2024-03
          label: Yokogawa Global Alliance
          detail: >-
            Expands worldwide alliance with Yokogawa Electric to integrate Nozomi visibility into OpreX Managed
            Services.
        - date: 2025-07
          label: Cumulative Capital Reaches $266M
          detail: >-
            Completes growth financing rounds with strategic participation from industrial automation leaders, totaling
            $266M raised.
        - date: 2025-09
          label: Acquisition Agreement
          detail: >-
            Signs definitive agreement to be acquired by Mitsubishi Electric Corporation for a reported deal value of
            USD $1 billion.
        - date: 2026-01
          label: Acquisition Closing & $100M+ Revenue
          detail: >-
            Finalizes acquisition by Mitsubishi Electric as independent subsidiary; confirms exceeding $100M in annual
            revenue with sustained cash flow.
        - date: 2026-07
          label: Product Lifecycle Policy v3.0
          detail: >-
            Releases revised Product Lifecycle and Support Policy v3.0 defining formal GA, EOS, and EOL governance for
            N2OS and Arc software.
        - date: 2026-09
          label: Carcano Returns as CEO
          detail: >-
            Co-founder Andrea Carcano returns as Chief Executive Officer to steer AI platform innovation and enterprise
            expansion.
