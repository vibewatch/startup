            body: >-
              The positive case rests on operating scale, strategic sponsorship, and deployment breadth. Nozomi says it
              monitors more than 115 million OT, IoT, and IT devices across more than 12,000 installations, and its
              homepage describes a partner ecosystem able to support on-premises, hybrid, cloud, and managed
              deployments. Strategic investors participated in the 2024 financing, and Mitsubishi Electric later
              completed the acquisition while preserving operational independence. The countercase is that every current
              scale metric in this pool is company-issued, the reported revenue lacks an audited profitability bridge,
              and ownership by an industrial vendor may complicate the neutral ecosystem proposition. The careers page
              displayed no open positions at access time; that is a diligence signal only, not evidence of a hiring
