            body: >-
              The financing record requires reconciliation before it can anchor valuation. Forge lists an $80M Series E
              and 1.0x, non-participating preference terms, while Crunchbase described the 2024 Series E as $100M and
              reported $266M raised since inception. Those figures can reflect different round components or database
              conventions and should not be treated as interchangeable with cash available, ARR, or acquisition
              proceeds. Sector financing references are also insufficient as valuation comparables: Crunchbase cited
