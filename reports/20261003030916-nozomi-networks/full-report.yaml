      - number: '3.3'
        title: Commercial Models, Switching Costs, and Moat Defensibility
        blocks:
          - type: paragraph
            body: >-
              Commercial evaluation of CPS protection platforms is governed by total cost of ownership, recurring sensor
              licensing, and ongoing alert tuning discipline [CP004, CP009]. While Nozomi demonstrates strong customer
              satisfaction and high reported gross retention across its 12,000+ installation base, public procurement
              reviews repeatedly cite software licensing cost and expansion pricing as recurring operational friction
              points [CP009, CP010]. High switching costs in OT security arise from deep integration into plant switches
              (SPAN/TAP aggregation), custom firewall rule automation, SIEM/SOAR connectors, and historical behavioral
              baselines established across mission-critical physical processes [CP005, CP011]. Nozomi's acquisition by
              Mitsubishi Electric expands industrial distribution and hardware co-development, but maintaining vendor
              neutrality across competing automation environments (Siemens, ABB, Rockwell, Schneider Electric) remains
              critical to prevent displacement by unaligned competitors [CP011, CP012].
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
