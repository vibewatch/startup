        title: Exit Readiness, Triggers, and Diligence
        blocks:
          - type: paragraph
            body: >-
              The conventional private-company exit path has already been replaced by ownership inside Mitsubishi
              Electric. A prospective investor therefore needs clarity on the security being valued, its
              transferability, governance rights, and whether any subsidiary-level liquidity route exists. The immediate
              diligence package should include executed transaction consideration, the fully diluted capitalization and
              preference waterfall, audited FY2025 financials, current revenue mix, gross margin, retention, cash
              generation, and integration reporting. Upgrade the view only if verified economics demonstrate durable
              growth and margins while partner neutrality remains intact. Downgrade it if integration weakens
              third-party channels, customer retention deteriorates, reported revenue quality is not substantiated, or
              no credible liquidity instrument can be identified.
