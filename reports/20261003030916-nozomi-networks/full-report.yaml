      - number: '1.3'
        title: Capitalization History, Deal Economics, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Prior to its acquisition by Mitsubishi Electric, Nozomi Networks raised approximately $266 million in
              lifetime capital across 11 funding events. Key venture and strategic backers included Planven Investments,
              GGV Capital, Lux Capital, Energize Capital (formerly Energize Ventures), and THI Investments, which led
              its $30 million Series C round in September 2018 at a cumulative $53.8 million invested. In subsequent
              rounds, the company secured corporate investments from industrial and security ecosystem heavyweights such
              as Schneider Electric, Honeywell, and Mitsubishi Electric itself. The definitive acquisition, announced in
              September 2025 and closed on January 29, 2026, established a headline transaction value of USD $1 billion
              as reported by industry trade media. While Mitsubishi Electric provides extensive balance-sheet
              durability, access to global industrial automation customers, and joint engineering opportunities, the
              transaction caps equity upside for earlier venture participants and introduces strategic stakeholder
              alignment considerations. Industrial partner channels such as Yokogawa Electric and Schneider Electric
              remain essential to commercial distribution, demanding strict preservation of Nozomi's multi-vendor
              neutral posture.
