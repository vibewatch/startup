  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2013 by Andrea Carcano and Moreno Carullo, Nozomi Networks Inc. specializes in cybersecurity,
              asset intelligence, and anomaly detection for critical infrastructure and industrial control systems
              (ICS). Headquartered in San Francisco, California, the company operates across six continents and provides
              unified network and endpoint visibility across cyber-physical environments. Its commercial architecture
              delivers continuous passive deep packet inspection (DPI) through Guardian sensors running N2OS, host-level
              endpoint telemetry via Nozomi Arc, centralized on-premise governance via the Central Management Console
              (CMC), and software-as-a-service management through Nozomi Vantage. In January 2026, Mitsubishi Electric
              completed its acquisition of Nozomi Networks in a transaction valued at USD $1 billion, transitioning the
              enterprise from an independent venture-backed scaleup into a wholly owned operating subsidiary that
              retains its original brand, executive team, and vendor-neutral go-to-market motion. Revenue is driven by
              recurring software subscriptions, physical and virtual sensor appliances, premium threat intelligence
              feeds, and managed security service provider (MSSP) partner licensing.
