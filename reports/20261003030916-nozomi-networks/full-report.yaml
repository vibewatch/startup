      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is substantial but measurement quality is uneven. Nozomi currently claims more than 115
              million monitored devices, more than 12,000 installations, and 100% customer retention; independent
