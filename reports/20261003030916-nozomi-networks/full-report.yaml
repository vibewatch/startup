      - number: '3.2'
        title: Competitor Profiles, Technical Capabilities, and Deployment Fit
        blocks:
          - type: paragraph
            body: >-
              Evaluating CPS protection platforms requires balancing protocol visibility depth, non-disruptive
              deployment mechanisms, and cross-site governance across heterogeneous environments [CP004, CP005]. Nozomi
              differentiates through hybrid sensor coverage—combining passive network monitoring via Guardian, wireless
              spectrum monitoring via Guardian Air, active query agents, and embedded endpoint telemetry via Nozomi Arc
              [CP006, CP007]. In industrial control environments, Nozomi Arc Embedded has been co-developed with
              automation vendors, including direct integration into Schneider Electric SCADAPack 47xi Smart RTUs
              [CP007]. Technical scoring benchmarks reflect top-tier ratings for Nozomi in passive OT asset discovery
              (4.9/5) and OT protocol coverage (4.8/5) [CP008]. However, independent evaluations highlight that
              visibility and protocol fidelity remain heavily contingent on sensor placement across segmented industrial
              topologies, and broad multi-site rollouts impose substantial architectural coordination [CP005, CP008].
            claimRefs:
