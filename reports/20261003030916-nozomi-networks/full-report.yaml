  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Operational technology (OT), industrial control systems (ICS), and cyber-physical systems (CPS) security
              encompasses the protective software, hardware appliances, and analytical architectures designed to
              safeguard physical operational processes, industrial controllers, and connected devices rather than
              enterprise data assets alone. In traditional enterprise IT security, defensive mechanisms focus on data
              confidentiality, endpoint agent protection, and software patching. In industrial automation environments,
              security architectures are fundamentally bounded by availability, operational safety, and process
              determinism. Active vulnerability scanning or automated agent-based remediation tools commonly deployed in
              enterprise IT environments can inadvertently crash programmable logic controllers (PLCs), remote terminal
              units (RTUs), and distributed control systems (DCS), halting physical production, damaging
              multi-million-dollar physical equipment, or causing catastrophic environmental and safety failures.
              Consequently, the core boundary of the OT/CPS security market centers on passive deep packet inspection
              (DPI) mirrored across network switch SPAN ports and taps, non-disruptive protocol-native safe polling, and
              asset-context correlation that operates without interrupting real-time control loops.


              The addressable spend within this market boundary captures specialized passive industrial sensors,
              centralized management consoles, OT-specific threat intelligence feeds, and newly emerging OT asset
              service governance platforms. It explicitly excludes general-purpose enterprise endpoint detection and
              response (EDR), generic identity and access management (IAM), corporate cloud security posture management
              (CSPM), and standard IT perimeter firewalls, which lack the industrial protocol decoders necessary to
              interpret control protocols such as Modbus, DNP3, IEC 61850, Profinet, and vendor-proprietary engineering
              backplane traffic. Adjacent market segments include industrial Internet of Things (IoT) security,
              connected medical device security (IoMT), and building management systems (BMS) protection, which share
              cyber-physical characteristics but frequently operate under divergent regulatory frameworks and
              operational risk tolerances.


              Status-quo alternatives and defensive substitutes remain entrenched across industrial sectors,
              representing the primary resistance to dedicated commercial platform adoption. For decades, industrial
              asset owners relied on physical air-gapping—the total isolation of plant networks from enterprise IT
              networks and the public internet. However, digital transformation, industrial IoT telemetry initiatives,
              predictive maintenance requirements, and remote vendor diagnostics have systematically dismantled absolute
              air-gaps, creating unauthorized or unmonitored communication pathways into operational zones. Other
              widespread substitutes include manual periodic audits, asset spreadsheets, generic network management
              tools, and perimeter IT firewalls. These legacy approaches consistently fail to deliver real-time asset
              discovery, lack protocol-level visibility into Purdue Level 1 and Level 2 controller communications, and
              provide zero continuous vulnerability context when nation-state adversaries exploit unpatched firmware
              vulnerabilities or hijack legitimate engineering software workstations.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM008
              - CM013
      - number: '2.2'
        title: Market Sizing, Growth Trajectories, and Addressable Segments
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market sizing for operational technology and cyber-physical systems security requires
              contrasting independent third-party market research estimates with category-specific spend breakdowns.
              According to MarketsAndMarkets, the global operational technology security market was valued at $23.54
              billion in 2025 and is projected to expand to $27.39 billion in 2026, reflecting a robust year-over-year
              expansion rate of approximately 16.35%. Long-range market sizing published by ABI Research contextualizes
              this trajectory over a multi-year horizon, tracking the market from $12.75 billion in 2023 toward an
              estimated $21.60 billion by 2028. While headline total addressable market (TAM) figures aggregate
              hardware, software, and professional services across all industrial sectors worldwide, category-level
              decompositions provide a much sharper lens on software license and platform demand. Analysis published by
              Mordor Intelligence indicates that platform solutions accounted for 62.34% of global OT security spend in
              2025, indicating that capital allocations remain heavily directed toward purchasing core software platform
              licenses and sensor infrastructure rather than recurring professional consulting.


              Within the software solutions category, network monitoring represents the dominant product discipline,
              capturing 46.05% of total market expenditure in 2025 according to Mordor Intelligence. This concentration
              reflects the fundamental architectural prerequisite of operational technology security: industrial
              operators must establish passive network visibility and comprehensive asset inventories before
              implementing higher-order capabilities like micro-segmentation, threat hunting, or automated vulnerability
              prioritization. The serviceable addressable market (SAM) for dedicated pure-play OT/CPS protection
              platforms—specifically covering continuous network monitoring, anomaly detection, and vulnerability
              intelligence across critical infrastructure verticals such as electric utilities, oil and gas, chemical
              processing, water treatment, and discrete manufacturing—is estimated between $12.6B and $17.1B globally
              for 2026.


              The serviceable obtainable market (SOM) for Nozomi Networks and its immediate venture-backed and
              corporate-backed peers (Claroty and Dragos) focuses on large-scale enterprise critical infrastructure
              operators managing distributed multi-site facilities. In this tier, annual contract values (ACVs) range
              from hundreds of thousands to millions of dollars based on sensor density, site counts, and managed
              endpoints. Market traction indicators illustrate steady penetration into this tier: Nozomi Networks has
              monitored over 115 million OT, IoT, and IT devices across more than 12,000 global installations,
              demonstrating that large industrial enterprises are standardizing on commercial platforms to oversee their
              expanding cyber-physical asset surface.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
