      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Evolution
        blocks:
          - type: paragraph
            body: >-
              Nozomi Networks was established on foundational academic and technical research in SCADA security and
              artificial intelligence conducted by its co-founders. Andrea Carcano, who completed doctoral research at
              Università degli Studi dell’Insubria analyzing SCADA intrusion detection and early malware targeting
              industrial control architectures, served as Chief Product Officer before returning to the Chief Executive
              Officer position in 2026 to lead the company's AI-focused development phase. Co-founder Moreno Carullo,
              also holding a doctorate in artificial intelligence, serves as Chief Technology Officer and directs
              software development while contributing to the IEC TC57 WG15 international standards committee for power
              system communications. Carcano succeeded longtime President and CEO Edgard Capdevielle, who had steered
              the firm's commercial scale-out through multiple funding rounds and the definitive Mitsubishi Electric
              acquisition. Operational leadership is rounded out by Chief Revenue Officer Kevin Isaac, Chief Financial
              Officer George Todd, Chief Marketing Officer Mike Plante, Chief of Staff Sai Mahalingam, and Head of
              People and Culture Alan Berusch. Post-acquisition governance balances corporate ownership under Mitsubishi
              Electric with operational autonomy, mitigating immediate key-person transition disruption while requiring
              ongoing monitoring of founder alignment.
