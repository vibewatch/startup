  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Cohort-based logo retention, GRR, NRR, churn, renewal, contract-length, and
        expansion metrics with periods and customer definitions.
      whyItMatters: >-
        A headline 100% retention claim cannot establish recurring-revenue durability
        or expansion without definitions and cohort evidence.
      diligencePath: >-
        Request monthly logo and revenue cohorts for the last 36 months, reconcile
        them to contracts and billing, and interview a sample of renewed and churned
        customers.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: >-
        Top-one, top-five, and top-ten customer revenue shares, partner-sourced revenue,
        renewal calendars, and channel-specific pipeline conversion.
      whyItMatters: >-
        Broad vertical and geographic claims do not show whether revenue or service
        delivery depends on a small set of customers or channel partners.
      diligencePath: >-
        Obtain an anonymized customer revenue ledger and channel attribution by quarter,
        then test concentration, renewals, and partner dependency.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        A complete named-customer list distinguishing production deployments, pilots,
        paid proofs of concept, deployment size, dates, and quantified outcomes.
      whyItMatters: >-
        Anonymous review excerpts cannot verify referenceability, deployment maturity,
        or account-level expansion.
      diligencePath: >-
        Request the customer reference roster and select at least five customers across
        major verticals for independent reference calls and contract verification.
      relatedTableRefs: [TU003]
