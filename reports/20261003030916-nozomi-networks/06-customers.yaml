schemaVersion: "report-v2"
artifact: customers
slug: nozomi-networks
runDate: 2026-10-03
company:
  name: Nozomi Networks
chapter:
  number: 6
  title: Customers
  summary: >-
    Nozomi reports broad critical-infrastructure adoption, 12,000-plus installations,
    115 million-plus monitored devices, and strong 2026 user-review signals. The
    evidence nevertheless remains predominantly company-issued and does not disclose
    independently verified retention economics, customer concentration, or a named
    deployment census.
sections:
  - id: customer-segmentation
    title: Broad critical-infrastructure reach, with buyer detail still thin
    body: >-
      Nozomi's public customer surface spans airports, electric utilities, healthcare,
      manufacturing, maritime, mining, oil and gas, pharmaceuticals, rail, retail,
      smart cities, and water and wastewater. That range indicates a platform sold
      into operationally sensitive environments rather than a single-industry point
      solution. A company-attributed acquisition recap adds claimed penetration among
      top-ten oil and gas, pharmaceutical, utility, and mining operators. These claims
      establish vertical breadth, but not the number of paying organizations, revenue
      mix, contract size, or economic buyer by segment. The channel also matters:
      Exclusive Networks describes distributors, solution providers, integrators, and
      managed-service providers extending reach, so some buyer access and service
      delivery may be partner-mediated.
    claimRefs: [CU001, CU013, CU014]
    tableRefs: [TU001]
  - id: adoption-and-expansion
    title: Installation scale is visible; account-level adoption is not
    body: >-
      Nozomi's company page claims more than 115 million monitored OT, IoT, and IT
      devices and more than 12,000 installations, while a 2026 release says customers
      operate across six continents. These are useful scale indicators, but devices,
      installations, and customer accounts are different denominators and cannot be
      converted into a customer count or deployment growth rate. The public trajectory
      is therefore a current scale snapshot rather than a time series. Expansion may
      come from adding sites, partner-delivered services, and new workflows: Compass
      was announced for availability to existing customers in January, extending the
      proposition from CPS monitoring into OT asset and service management. No assigned
      source quantifies attach rates or expansion revenue.
    claimRefs: [CU002, CU003, CU008, CU012, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: customer-proof
    title: Review evidence is positive but anonymous and self-selected
    body: >-
      The clearest current customer signal is a company-issued release describing a
      4.9 rating based on 140 verified end-user reviews, with 99% saying they would
      recommend Nozomi as of June 2026. Quoted users in transportation and energy
      utilities praised post-sales support and network visibility, and the homepage
      displays additional role-and-vertical snippets from real estate, federal
      government, energy and utilities, and transportation. This is stronger than a
      logo wall because it ties feedback to user roles and use cases, but the customers
      remain unnamed and outcomes are not independently measured. Gartner's embedded
      disclaimer also says Peer Insights content is user opinion, not fact or an
      endorsement, limiting how far the ratings can support durability conclusions.
    claimRefs: [CU005, CU006, CU007, CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention and concentration remain the decisive diligence gaps
    body: >-
      Nozomi publishes a 100% customer-retention claim, but the assigned materials do
      not define the cohort, period, customer unit, gross-versus-net basis, or treatment
      of acquired and expanded accounts. It therefore cannot be read as GRR, NRR, or
      proof of recurring-revenue durability. The Mitsubishi Electric acquisition recap
      says customer relationships, the partner ecosystem, and the operating structure
      would remain unchanged, but that statement is company-attributed and does not
      establish post-close renewal behavior. No retained source discloses top-customer
      revenue concentration, partner-sourced revenue, contract length, churn, renewal
      cohorts, or procurement-cycle friction. Those omissions prevent a confident view
      on customer economics despite the positive scale and review signals.
    claimRefs: [CU004, CU015]
tables:
  - id: TU001
    title: Customer segmentation by operating environment and route to market
    columns:
      - Segment
      - Buyer / user / payer
      - Core use case
      - Public scale signal
      - Strategic value
      - Evidence gap
    rows:
      - - Industrial producers
        - Security and operations teams; payer not disclosed
        - OT/IoT visibility, threat detection, and risk management
        - Manufacturing, mining, oil and gas, and pharmaceuticals are listed verticals
        - Mission-critical, distributed production estates
        - No account count, contract value, or revenue mix by vertical
      - - Utilities and essential services
        - Utility security, engineering, and plant operations; payer not disclosed
        - Asset visibility and operational resilience
        - Electric utilities and water/wastewater are listed; company-attributed top-ten utility penetration
        - High-cost-of-downtime environments
        - No named-account census or deployment depth
      - - Transport and public infrastructure
        - IT/security risk, engineering, and public-sector teams
        - Distributed-site monitoring and incident response
        - Airports, maritime, rail, smart cities, transportation, and federal-government review snippets
        - Referenceable cross-sector workflow evidence
        - Reviewers are anonymous and production scope is not disclosed
      - - Partner-delivered global accounts
        - End customers reached through distributors, integrators, MSPs, and solution providers
        - Deployment, tuning, support, and managed security
        - Exclusive Networks lists coverage across North America, Europe, APAC, and Middle East/Africa
        - Extends geographic reach and implementation capacity
        - Partner-sourced revenue and channel concentration are undisclosed
    notes: >-
      Segmentation combines company-listed verticals and a distributor-authored channel
      page; scale and economic value are qualitative because account and revenue
      denominators are not public.
    claimRefs: [CU001, CU011, CU013, CU014]
  - id: TU002
    title: Public customer adoption and satisfaction snapshot
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source character
      - Confidence
      - Implication
      - Missing denominator or qualifier
    rows:
      - - Devices monitored
        - "115M+"
        - Current company page accessed 2026-10-03
        - Company-issued
        - Medium
        - Indicates large aggregate telemetry footprint
        - Device mix, active status, and period not defined
      - - Installations worldwide
        - "12K+"
        - Current company page accessed 2026-10-03
        - Company-issued
        - Medium
        - Indicates broad deployment footprint
        - Installations are not customers or recurring accounts
      - - Customer retention
        - "100%"
        - Current company page accessed 2026-10-03
        - Company-issued
        - Low
        - Directionally supports durability
        - Cohort, period, unit, GRR/NRR basis, and exclusions absent
      - - Peer rating
        - "4.9"
        - As of June 2026
        - Syndicated company release citing Gartner Peer Insights
        - Medium
        - Strong satisfaction signal among reviewers
        - Rating scale and selection effects require the underlying report
      - - Verified end-user reviews
        - "140"
        - As of June 2026
        - Syndicated company release citing Gartner Peer Insights
        - Medium
        - Nontrivial feedback sample
        - Not a customer-count or retention denominator
      - - Reviewers recommending Nozomi
        - "99%"
        - As of June 2026
        - Syndicated company release citing Gartner Peer Insights
        - Medium
        - Strong stated advocacy among reviewers
        - Self-selected opinion; Gartner says it is not fact or endorsement
    notes: >-
      Values preserve their original metric names and denominators; no device,
      installation, review, or retention figure is converted into a customer count.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Anonymous IT and security risk manager
        - Transportation
        - Post-sales support for a CPS protection deployment
        - Not disclosed
        - Described support as second to none
        - Company-selected quote; no named organization or measurable outcome
      - - Anonymous plant OT administrator
        - Energy utilities
        - OT network visibility
        - Product described as delivered, but status not independently verified
        - Reported visibility into previously unseen network areas
        - Company-selected quote; no baseline, date, or deployment scope
      - - Anonymous IT manager
        - Federal government
        - Industrial cybersecurity platform
        - Not disclosed
        - Homepage characterizes results as transformational
        - Snippet lacks organization name, metric, and full review context
    notes: >-
      Sample is limited to role-attributed public review snippets in the assigned
      sources; it is not an exhaustive customer list and does not verify production
      status independently.
    enumerationScope:
      coverage: sample
      basis: >-
        Public role-attributed customer statements available in the assigned source
        pool through 2026-10-03.
    claimRefs: [CU009, CU010, CU011]
figures:
  - id: FU001
    title: Evidence-backed customer adoption and expansion path
    type: journey-map
    summary: >-
      A qualitative route from complex OT estates to multi-site and workflow expansion;
      it is not a measured conversion funnel.
    data:
      nodes:
        - id: estate
          label: Complex OT/IoT estate
          detail: Customers operate across critical-infrastructure verticals with heterogeneous assets.
          touchpoints: Industry solution pages and partner discovery
        - id: deployment
          label: Initial deployment
          detail: Guardian, Vantage, or related capabilities are deployed directly or through certified partners.
          touchpoints: Distributor, integrator, MSP, and solution-provider channels
        - id: visibility
          label: Visibility established
          detail: Aggregate claims of 115M-plus monitored devices and user reports of newly visible network areas.
          touchpoints: Network monitoring and asset visibility
        - id: support
          label: Operational support
          detail: Public reviewer evidence emphasizes responsive post-sales and technical support.
          touchpoints: Customer support and solution engineering
        - id: expansion
          label: Site and geography expansion
          detail: The reported footprint reaches 12K-plus installations and customers on six continents.
          touchpoints: Multi-site rollout and partner services
        - id: workflow
          label: Workflow expansion
          detail: Compass is positioned to extend existing customers into OT asset and service management.
          touchpoints: Governed change, service workflows, and compliance evidence
    approximationNotes: >-
      Sequence is an analytical synthesis of public product, scale, partner, and review
      evidence; no source supplies stage conversion rates, timing, or attach rates.
    claimRefs: [CU001, CU002, CU003, CU008, CU009, CU010, CU012, CU013, CU016]
callouts:
  - calloutType: strength
    title: Current user-review signal is unusually strong
    body: >-
      A company-issued release reports a 4.9 rating from 140 verified end users and a
      99% recommendation rate as of June 2026, supported by role-attributed comments
      on visibility and support.
    claimRefs: [CU005, CU006, CU007, CU009, CU010]
  - calloutType: risk
    title: Scale metrics do not establish retention economics
    body: >-
      Public claims of installations, monitored devices, and 100% retention lack the
      account, cohort, period, revenue, and GRR/NRR definitions needed to assess
      durability or concentration.
    claimRefs: [CU002, CU003, CU004]
