      - number: '8.2'
        title: Median-based fintech comps support plausibility, but not complacency
        blocks:
          - type: paragraph
            body: >-
              Comparable discipline should use medians and business-model-adjusted buckets rather than headline fintech
              averages. The best external market data in this record shows exactly why: overall fintech averages are
              pulled up by outliers, while public payments, lending, and neobank businesses trade much lower than
              software-like wealth or enterprise platforms. Cleo sits in the middle of those worlds. It has more
              recurring-revenue and engagement depth than many simple transaction apps, but it also retains fee,
              regulatory, and credit-adjacent exposure that prevents a pure software multiple. On that basis, Cleo’s
              last known valuation does not appear absurd. Its implied multiple is below some late-stage private and
              neobank medians and roughly around lower public banking/lending anchors. That said, private-public gaps
              are real, and best-in-class public consumer fintechs such as Chime, SoFi, and Nubank support richer
              valuations because they disclose far deeper cohort, credit, and engagement evidence than Cleo currently
              makes public.
