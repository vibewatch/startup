      - number: '5.2'
        title: The architecture is agentic, data-linked, and explicitly optimized for latency and specialization
        blocks:
          - type: paragraph
            body: >-
              Cleo’s engineering posts provide unusually strong visibility into the technical operating model for a
              consumer-finance app. The system is not described as one monolithic chatbot. Instead, Cleo says it uses a
              multi-agent architecture in which a router selects domain specialists and background agents analyze
              historical transaction data to build a persistent financial profile. The newer custom router is presented
              as materially faster than an LLM-only approach, and Autopilot adds another layer by decomposing work into
              transaction understanding, planning, prioritization, and action execution. Voice mode preserves the same
              core chat pipeline and streams output into a voice layer rather than splitting the product into separate
              text and audio stacks. Cleo’s technical choices reflect product constraints: financial assistance requires
              low latency, more accurate transaction understanding, and narrow, high-confidence task routing. The result
              is a more specific and credible product-technology story than generic AI assistant marketing usually
              provides, although it still depends heavily on the quality of linked financial data and the reliability of
              third-party components.
