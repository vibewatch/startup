        title: >-
          Retention appears strongest where Cleo becomes a paid habit, but billing and support friction create
          durability risk
        blocks:
          - type: paragraph
            body: >-
              The best public evidence for customer durability is indirect. Paid-subscriber growth from 743,000 active
              paid users in late 2024 to 1.1 million paying subscribers on the current company page implies meaningful
              expansion, and both official pricing materials and FAQ content show clear ARPU ladders from free budgeting
              into Plus, Pro, and Builder plans. Builder’s subscription mechanics and card closure rules suggest Cleo is
              trying to turn episodic financial stress into a recurring membership relationship. At the same time,
              adverse evidence matters here more than in many consumer apps. FTC allegations, review-platform
              complaints, and third-party review writeups repeatedly point to the same churn vectors: subscription-first
              advance discovery, charges after attempted cancellation, inconsistent advance eligibility, and support
              dissatisfaction. Cleo therefore looks much more durable as a habit-forming budgeting product than as a
              universally loved cash-advance brand, and its concentration risk is geographic and feature-based rather
              than logo-based.
