      - number: '8.4'
        title: The correct IC posture is track with a high-risk overlay and explicit diligence gates
        blocks:
          - type: paragraph
            body: >-
              The evidence supports continued diligence, not a dismissal. Cleo has real scale, real monetization, and a
              stronger narrative-product fit than many fintech apps that chased AI branding after the fact. But a good
              company is not automatically a good entry at an unknown 2026 price. The IC-quality answer is therefore
              track with medium confidence, high risk, and a fair valuation stance. That call can move in either
              direction. It upgrades if the current price is still near the last visible mark and management can show
              clean post-settlement operating metrics, healthy loss cohorts, durable retention, and manageable note
              overhang. It downgrades if the hidden current price is materially above the last public anchor or if core
              monetization depends on customer behaviors that are weaker or riskier than the public story implies. The
              final diligence burden is narrow but heavy: price, preferences, loss data, retention, and partner
              resilience decide the investment more than brand heat alone.
