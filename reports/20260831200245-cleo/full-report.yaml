  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is consumer financial guidance plus short-term liquidity, not broad neobanking
        blocks:
          - type: paragraph
            body: >-
              The most decision-useful market definition for Cleo is narrower than “digital banking” and broader than
              “budgeting app.” Cleo combines budgeting, savings nudges, cash-flow forecasting, overdraft prevention,
              cash advances, and credit-building in one chat-first interface. That means the relevant market includes
              consumer apps that solve the same day-to-day job: helping a user understand whether they can spend, save,
              borrow, or avoid fees this week without opening a spreadsheet or visiting a branch. It excludes most
              full-service banks, enterprise payroll software, and pure investing products unless they are credible
              substitutes for that job. The status quo is also important. Before users adopt Cleo, they often rely on a
              mix of bank apps, mental accounting, social-media advice, family support, or expensive fallback products
              such as overdraft, payday-style advances, or credit-card revolvers. Public regulatory research reinforces
              why this category exists: the CFPB says demand for these products begins with the mismatch between when
              people get paid and when bills are due. Cleo’s best substitutes therefore are not only chat-first apps,
              but any mobile tool that reduces short-term money uncertainty for consumers living close to the edge.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
