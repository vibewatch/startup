      - number: '7.3'
        title: Scale reduces immediate survival risk, but opaque credit and support economics still matter materially
        blocks:
          - type: paragraph
            body: >-
              Cleo is no longer an early-stage survival story, which lowers one class of risk while raising another.
              Official materials and prior chapters show meaningful revenue, paid-subscriber scale, and improved
              profitability, which reduce near-term insolvency risk. However, public financial quality is still
              incomplete where investors most need clarity. Cleo’s revenue mix is tied to subscriptions and
              fee-generating products, the company remains heavily exposed to the United States, and the key
              loss-sensitive product lines still lack public delinquency, default, fraud, reserve, or capital
              disclosures. Terms say cash advances are non-recourse and that future access can be cut off if prior
              advances go unpaid, which suggests some embedded risk controls, but not enough public evidence to
              underwrite the loss model confidently. Execution risk also remains elevated because AI features are
              expanding from guidance toward action. The product can be charming when it budgets or nudges, but the cost
              of error rises when it influences borrowing, credit behavior, or automated money movement.
