      - number: '7.4'
        title: The residual-risk stack is monitorable, but still too dependent on unseen internal metrics
        blocks:
          - type: paragraph
            body: >-
              The most important diligence question is not whether Cleo has risks. It clearly does. The question is
              whether those risks are monitorable and whether management has enough internal instrumentation to catch
              them before they turn into regulatory, customer, or partner failures. Public evidence suggests the kill
              criteria are knowable: another consumer- protection action, material partner-bank restrictions,
              deteriorating loss performance on advance or card products, a sharp rise in complaint volume, or a major
              mismatch between autonomous product promises and real-world outcomes. The challenge is that outside
              investors cannot observe most of those metrics directly today. That makes diligence discipline critical.
              Cleo is investable only if management can demonstrate that support, compliance, partner governance, and
              credit-loss monitoring are at least as mature as the growth narrative and AI product ambition visible from
              the outside. Investors should want weekly operational dashboards, escalation thresholds, and board-level
              ownership rather than reassurance by narrative alone.
