  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Cleo primarily serves self-directed U.S. consumers who want low-friction money coaching
        blocks:
          - type: paragraph
            body: >-
              Cleo’s customer model is notably simple compared with enterprise fintechs: the buyer, daily user, and
              payer are usually the same individual. Public materials and third-party coverage consistently position the
              product for Gen Z and beginner budgeters who want a conversational, low-judgment interface rather than
              spreadsheet-style personal-finance software. The most important segmentation split is not company size or
              vertical, but financial need and product depth: free budgeting users, paid subscribers, credit-building
              users, and short-term liquidity seekers. Geography matters because Cleo is still economically concentrated
              in the United States even though the company is UK-founded and has reopened a limited UK product surface.
              Feature gaps also define who is not a good fit. Official FAQ and review coverage indicate Cleo is weaker
              for couples, business-account users, investment-centric households, and anyone expecting a full-service
              bank with international coverage or peer-to-peer payments. In other words, Cleo is closer to a guided
              consumer-finance habit product than a universal household money platform.
