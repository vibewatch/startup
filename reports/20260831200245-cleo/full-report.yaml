      - number: '1.3'
        title: Funding, scale metrics, and milestone chronology
        blocks:
          - type: paragraph
            body: >-
              Cleo’s capital and scale story is strong enough to make later diligence chapters worthwhile, but it is not
              fully audited end to end. The official timeline discloses a seed round in 2017, Series A in 2018, Series B
              in 2020, and Series C in 2022, while Redbus adds a previously undisclosed $38.8 million convertible note
              from March 2025. Sacra’s aggregation implies roughly $175 million of lifetime capital, which is
              directionally consistent with the known rounds but still deserves cap-table verification. On operating
              scale, Cleo’s own pages say the company has surpassed $300 million ARR, reached 1.1 million paying
              subscribers, and grown to a 500-plus person team, while the 2024 annual-report page shows 743,000 paid
              subscribers and a $186 million exit run-rate for 2024. Independent reporting triangulates the growth
              vector: City AM says Cleo crossed a $1 billion valuation threshold in 2025, BusinessCloud says management
              publicly cited $280 million ARR, and Redbus says 2024 revenue doubled to $135.7 million while losses
              nearly disappeared. The chronology is impressive, but audited 2025 accounts, ownership detail, and exact
              current headcount remain missing. For now, public evidence supports momentum and scale better than it
              supports precise underwriting of dilution, cash durability, or governance maturity. The likely investment
              debate is therefore not whether Cleo has traction, but whether today’s private-market entry terms properly
              reflect what remains opaque.
