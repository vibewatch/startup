  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Cleo has already crossed from theoretical compliance risk into active enforcement history
        blocks:
          - type: paragraph
            body: >-
              Cleo’s top risk category is regulatory and legal because the most visible adverse evidence is not
              speculative. The FTC sued, the company settled, and third-party legal commentary framed the matter as part
              of a broader crackdown on negative-option design, dark patterns, and hard-to-cancel fintech subscriptions.
              Cleo’s own terms still reveal how sensitive the product remains: monthly recurring billing, grace-period
              exceptions, optional express fees, arbitration, and venue provisions all matter when the target user is
              often financially stressed and using the app close to payday. Review surfaces reinforce the same theme by
              clustering complaints around cancellation, support, and eligibility disappointment rather than around
              basic budgeting utility. That combination means Cleo’s compliance burden is unusually close to the
              monetization engine itself. A second major regulatory event would threaten not only fines or refunds, but
              also acquisition efficiency, trust, and valuation.
