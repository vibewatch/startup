      - number: '8.3'
        title: Scenario work points to modest upside, meaningful downside, and limited room for error
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately conservative because the evidence base is mixed. The bull case
              assumes Cleo can sustain strong ARR growth, expand higher-value paid tiers, keep support and regulatory
              issues under control, and prove that its AI-led product stack converts into durable cohorts without large
              credit surprises. The base case assumes Cleo remains a strong but still partially opaque consumer-finance
              company and earns a fairer but not euphoric multiple on forward revenue. The bear case assumes that public
              evidence is already flattering the business and that a new enforcement issue, partner disruption, or weak
              loss data compresses both growth and the applicable multiple. Under those assumptions, the valuation still
              looks defendable around the unicorn mark, but not obviously cheap enough to merit a buy call without a
              disclosure step-up. That is why the range is investable to study, but not yet a conviction entry.
