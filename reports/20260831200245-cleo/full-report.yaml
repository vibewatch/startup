      - number: '4.4'
        title: The public financial verdict is positive on momentum, cautious on underwriting completeness
        blocks:
          - type: paragraph
            body: >-
              Taken together, the public record supports a constructive but incomplete financial verdict. Cleo has
              enough evidence of scale, improving profitability, and pricing discipline to deserve serious diligence
              attention. A consumer-finance app with $136 million of 2024 revenue, $186 million exit run-rate, 743,000
              active paid subscribers by year-end 2024, and later $280–300 million ARR claims is far beyond speculative
              pre-product stage. The low reported CAC and short payback period suggest acquisition economics that many
              consumer apps would envy. But underwriting still needs the boring details that are absent from marketing
              pages and founder interviews: active paid churn by cohort, reserve adequacy, credit loss and fraud
              experience, net revenue retention by tier, direct-deposit penetration, and hard evidence of current
              liquidity. Cleo looks more de-risked than many late-stage fintech stories because there is corroborated
              growth and signs of profitability. It does not yet look de-risked enough to skip management accounts,
              credit-performance data, and funding-document review.
