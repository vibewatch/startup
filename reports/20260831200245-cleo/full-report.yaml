      - number: '6.4'
        title: >-
          Customer quality is good enough for conviction on product-market fit, not yet good enough for full durability
          confidence
        blocks:
          - type: paragraph
            body: >-
              Taken together, the customer evidence supports a clear conclusion. Cleo has found product-market fit with
              a real, scaled audience of younger U.S. consumers who want money guidance delivered through chat, nudges,
              and lightweight credit or liquidity tools. That is a meaningful commercial achievement, especially given
              the visible paid-subscriber base and unusually large review footprint for a private company. However, the
              proof still tilts toward acquisition and engagement rather than fully disclosed durability. The company
              has shown it can attract users and upsell them into subscriptions, but public evidence is thinner on how
              long those relationships persist, how many users expand beyond the first paid tier, and how
              complaint-heavy money-moment features affect lifetime value. For diligence, the customer case is positive
              but incomplete rather than fully de-risked. The investment-relevant takeaway is that Cleo seems to have
              cracked acquisition and resonance with its target persona, but not yet to have publicly de-risked the
              durability of its most sensitive monetized interactions. That distinction matters because valuation should
              reward proven recurring relationships more than raw download energy.
