              voice mode required custom heuristics to avoid reading money amounts incorrectly. Those details matter
              because they show Cleo is building a real product system, not just bolting AI copy onto a fintech shell.
              They also show where technical risk lives: orchestration complexity, partner dependence, and the need to
              sustain trust while continuously shipping new behavior-sensitive AI features. Public evidence supports a
