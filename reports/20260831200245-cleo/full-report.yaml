              Cleo’s maturity profile is uneven in a reasonable way. The core linked-account chat product,
              credit-building path, and savings workflows look mature enough to support scaled consumer use today. By
              contrast, voice mode, Autopilot, and some of the underlying agent-routing optimizations are clearly newer
              layers still being expanded. The Autopilot materials say rollout is selective and that the roadmap will
              extend through 2026 to more goals and actions. The engineering posts also reveal operational tradeoffs:
