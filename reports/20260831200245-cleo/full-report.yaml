  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The landscape splits between liquidity apps, budgeting subscriptions, and broader fintech super-apps
        blocks:
          - type: paragraph
            body: >-
              Cleo does not face one clean competitor set. The most direct alternatives depend on which user job matters
              at the moment. If the user mainly wants short-term liquidity, Dave, Brigit, Albert, MoneyLion, and parts
              of Chime are direct substitutes. If the user wants budgeting clarity and recurring visibility into
              subscriptions, Rocket Money, Monarch, and YNAB matter more. If the user wants a deeper primary-banking
              relationship, Chime and MoneyLion are more credible than classic budgeting apps. Cleo’s own product
              surfaces show why the landscape is messy: it markets cash advances, savings, credit building, debt tools,
              voice, Money IQ, and Autopilot in one consumer flow. That breadth lets Cleo straddle several
              micro-categories, but it also means it inherits competitors from all of them. The strategic question is
              therefore not whether Cleo has rivals, but whether its chat-first personality, low-balance coaching, and
              increasingly agentic UX are distinct enough to keep users from defaulting to a stronger specialist or a
              larger fintech platform.
