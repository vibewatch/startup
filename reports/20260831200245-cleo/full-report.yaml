  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue is a hybrid of subscriptions, usage fees, and card-linked economics
        blocks:
          - type: paragraph
            body: >-
              Cleo’s revenue model is hybrid rather than purely subscription-based. Its paid tiers create the recurring
              backbone: the terms page lists Plus at $5.99 per month, Pro at $8.99, and Builder at $14.99, with
              higher-priced mobile bundles on top. App-store disclosures and FAQ pages show that the tiers unlock
              different mixes of savings tools, cash-advance access, credit insights, and Builder-related features.
              Redbus adds the most useful outside revenue-mix detail, reporting that 2024 revenue growth came from a 50%
              increase in subscription revenue plus a near-tripling of transaction fees, including interchange on card
              spend and fees from the cash-advance product. That matters because Cleo is not just a budgeting app
              selling monthly access. It is monetizing ongoing software use, urgent liquidity events, and card-related
              transaction volume at the same time. The model has attractive diversification because no single stream
              appears to stand entirely alone, but revenue quality is not uniform: subscription fees are inherently
              stickier than transaction or express-fee income tied to specific cash-flow events.
            claimRefs:
