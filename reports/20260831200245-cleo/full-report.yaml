      - number: '2.3'
        title: Buyer, user, and payer usually collapse into the same stressed consumer
        blocks:
          - type: paragraph
            body: >-
              Cleo’s market differs from B2B fintech because the buyer, user, and payer are usually the same person.
              Adoption is not driven by a procurement process; it is driven by immediate pain or aspiration. The
              best-fit segment is a younger U.S.-based, smartphone-native consumer who links their bank account, feels
              financial stress, and wants faster feedback than a traditional bank provides. Within that broad audience,
              public evidence suggests four practical subsegments: paycheck-stretched users trying to avoid overdrafts
              and timing gaps; credit-builders who need a lightweight path to improve scores; habit-formers who want to
              automate savings and budgets; and digitally curious users willing to try AI for financial guidance. These
              groups have different willingness to pay, but they share the same budget owner: the end consumer deciding
              whether a subscription, fee, or deposit-linked bundle is worth it. That matters because monetization must
              survive consumer scrutiny every month. Cleo cannot hide behind enterprise contracts or employer subsidies
              the way payroll-integrated earned wage access providers can. In this market, value has to be obvious,
              frequent, and emotionally resonant enough to keep a discretionary finance app installed and paid.
            claimRefs:
