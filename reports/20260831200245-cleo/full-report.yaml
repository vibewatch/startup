      - number: '3.3'
        title: Soft switching costs exist, but larger rivals own stronger trust or distribution surfaces
        blocks:
          - type: paragraph
            body: >-
              Cleo’s switching costs are real but still soft. Once a user links accounts, builds transaction history,
              and starts to receive personalized guidance, it becomes inconvenient to restart elsewhere. Autopilot
              increases that stickiness because it turns a static budget into a dynamic plan and recommended actions.
              Yet the market remains structurally easy to sample. Most alternatives are mobile-first, self-serve, and
              month-to-month. Users can install more than one app, compare alerts and cash-advance terms, and move on
              quickly if they dislike tone, fees, or support. Distribution and trust therefore matter enormously. Chime
              competes with a primary-account frame, million-plus app-store reviews, and explicit FDIC-insured
              partner-bank language. MoneyLion also competes on breadth and partner network scale. Dave has
              public-company resources and cash-advance brand recognition. Cleo’s strongest counters are its emotional
              design, chat interface, and increasingly personalized orchestration, but those are not the same as owning
              the deposit relationship or a proprietary employer-distribution network.
