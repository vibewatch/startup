      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is unusually concentrated around founder-CEO Barney Hussey-Yeo. Official company
              materials, City AM, and BusinessCloud all present Hussey-Yeo as the central strategic voice behind Cleo’s
              product strategy, AI narrative, growth story, and listing rhetoric. That consistency is useful for
              diligence because it reduces ambiguity over who owns the thesis, but it also signals key-person
              dependence. Companies House confirms Hussey-Yeo remains a director of CLEO AI LTD., yet the public
              governance surface is otherwise comparatively thin for a company claiming 500-plus staff and nine-figure
              ARR. Public records identify other officers and directors, but do not provide a rich board-level
              explanation of remit, committee structure, or independent oversight. The official story of founder-market
              fit is nonetheless coherent: Hussey-Yeo’s machine-learning background, experience in fintech, and
              long-standing bet on conversational AI align directly with Cleo’s product identity. The diligence takeaway
              is that Cleo looks founder-led rather than institution-led in public disclosures, with charisma and speed
              as strengths and governance depth as an unresolved follow-up. That matters for a pre-IPO case because the
              public record today tells investors much more about founder conviction than about process, control layers,
              or succession planning.
