  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Cleo delivers a broad consumer-finance workflow through one conversational surface
        blocks:
          - type: paragraph
            body: >-
              Cleo’s product definition is easiest to understand in workflow terms rather than as a list of fintech
              SKUs. The app is positioned as an AI money coach that users can actually talk to, and its public product
              surfaces bundle budgeting, savings, cash advance, credit building, debt guidance, voice interaction, and a
              weekly quiz into one running conversation. The key product choice is that these capabilities are not
              marketed as separate destinations. A user links accounts, asks Cleo about spending or low balances,
              receives guidance, and can then move into adjacent actions such as saving, taking an advance, or building
              credit without leaving the broader assistant. That is why Cleo feels less like a bank app and more like a
              financial operating layer built around habit formation. Autopilot extends the same idea by actively
              managing safe-to-spend guidance using income, bills, goals, and real spending, while Money IQ turns
              transaction knowledge into a game. Product breadth is therefore meaningful, but the unifying concept is
              the conversation surface rather than a classic dashboard alone.
