      - number: '7.2'
        title: Operational resilience depends on a web of external partners and policy-level controls
        blocks:
          - type: paragraph
            body: >-
              Cleo’s product experience depends on external institutions and vendor relationships more than the chat
              interface alone suggests. Plaid shapes connectivity and account permissioning, Thread shapes deposit-sweep
              mechanics, WebBank shapes card issuance, and Cleo’s own privacy policy names a longer list of cloud,
              model, fraud, identity, and payment providers. Some of those relationships come with visible mitigations:
              encrypted connections, 24/7 monitoring claims, third-party risk programs, and BSA/AML controls at
              sponsor-bank level. But the same evidence also highlights residual exposure. Thread’s sweep disclosure
              makes clear that underlying program banks can change and that users interact indirectly through Thread;
              WebBank’s public surface is thin; and Cleo’s support architecture is fragmented across many
              product-specific help surfaces. The main operational risk, therefore, is not one single failure mode. It
              is cascade risk, where connectivity, partner governance, support load, or data-handling issues combine
              into customer distrust at exactly the moment users are asking the app to manage sensitive money decisions.
