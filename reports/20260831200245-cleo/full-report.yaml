  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The thesis is strong enough to keep tracking, but not yet clean enough to underwrite aggressively
        blocks:
          - type: paragraph
            body: >-
              Cleo’s valuation debate starts with a genuine positive: there is now enough revenue, subscriber, and
              product proof to treat the company as a scaled late-stage fintech rather than a speculative AI app.
              Official and third-party evidence point to roughly $280 million to $300 million of ARR, a seven-figure
              paying-subscriber base, improving profitability, and a real consumer-finance brand. That explains why the
              company crossed the unicorn threshold. The caution is that price discipline matters more than company
              quality at this stage. The last visible valuation anchor is already stale, and public evidence still lacks
              note terms, cap-table specifics, liquidation preference detail, and fully disclosed loss or retention
              cohorts. Cleo may deserve a premium to commodity fintechs, but it does not yet deserve a blank-check AI
              premium. The right starting point is to ask whether the implied multiple near the last known unicorn mark
              is fair, generous, or still attractive after adjusting for regulatory and balance-sheet risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
