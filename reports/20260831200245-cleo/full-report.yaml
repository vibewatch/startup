chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and market focus
        blocks:
          - type: paragraph
            body: >-
              Cleo is a UK-founded consumer fintech that packages budgeting, savings, cash-flow support, and
              credit-building into a chat-first AI financial assistant. Its own homepage and app-store listings frame
              the product as an always-on money coach rather than a conventional bank app: users can ask questions about
              spending, automate savings goals, build credit through a secured card path, and request small cash
              advances when balances are tight. That positioning matters because Cleo sells behavior change as much as a
              balance view; the product voice is deliberately informal, humorous, and judgment-light, which independent
              coverage says is central to its Gen Z resonance. The business is legally rooted in the UK but
              operationally skewed to the US, where cash advances, subscriptions, savings, and credit features are
              monetized at scale. Public evidence supports a growth-stage, pre-IPO posture rather than a mature
              public-company profile: Cleo remains private, carries a London registered office, and is now attempting a
              UK return while still depending primarily on US users and revenue. The resulting company identity is
              unusually coherent: AI is not a side feature but the organizing principle for acquisition, engagement,
              product packaging, and the premium upsell path today overall globally.
