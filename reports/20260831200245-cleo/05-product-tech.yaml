chapter:
  number: 5
  title: Product & Technology
  summary: Cleo’s product stack is a chat-first personal-finance system built around linked-account data, specialized AI agents, partner-bank rails, and increasingly action-oriented workflows, but the architecture also creates meaningful partner, privacy, and trust dependencies.
sections:
- id: product-definition-and-user-workflow
  title: Cleo delivers a broad consumer-finance workflow through one conversational surface
  body: Cleo’s product definition is easiest to understand in workflow terms rather than as a list of fintech SKUs. The app is positioned as an AI money coach that users can actually talk to, and its public product surfaces bundle budgeting, savings, cash advance, credit building, debt guidance, voice interaction, and a weekly quiz into one running conversation. The key product choice is that these capabilities are not marketed as separate destinations. A user links accounts, asks Cleo about spending or low balances, receives guidance, and can then move into adjacent actions such as saving, taking an advance, or building credit without leaving the broader assistant. That is why Cleo feels less like a bank app and more like a financial operating layer built around habit formation. Autopilot extends the same idea by actively managing safe-to-spend guidance using income, bills, goals, and real spending, while Money IQ turns transaction knowledge into a game. Product breadth is therefore meaningful,
    but the unifying concept is the conversation surface rather than a classic dashboard alone.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE029
  - CE030
  tableRefs:
  - TE001
  - TE002
  figureRefs:
