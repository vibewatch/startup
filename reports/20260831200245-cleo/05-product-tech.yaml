- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Cleo solution
  - Measurable benefit
  - Limitation
  rows:
  - - Know what I can safely spend
    - Check account balance, remember bills, guess at remaining cash
    - Autopilot and chat generate dynamic safe-to-spend guidance
    - Lower cognitive load; real-time plan updates
    - Needs linked accounts and reliable transaction understanding
  - - Avoid an overdraft or shortfall
    - Notice low balance too late and pay fees or borrow elsewhere
    - Advance eligibility and warnings inside the app
    - Potentially avoids late or overdraft fees
    - Advance limits and eligibility can constrain usefulness
  - - Build credit without classic revolving-card behavior
    - Open another card and manage utilization manually
    - Builder and Cleo Card pre-fund spend and report to bureaus
    - Supports on-time behavior with lower utilization friction
    - Actual score effect varies and depends on total credit profile
  - - Save consistently
    - Manually transfer leftovers and forget
    - Savings goals, save hacks, and automated nudges
    - Improves consistency and habit formation
    - Public outcome metrics are thin
  - - Stay engaged with finances
    - Ignore budgeting app after setup
    - Money IQ, voice, and personality-led chat create repeat-touch reasons
    - Higher engagement and less shame around money
    - Novelty can fade without measurable financial progress
  notes: Benefits are directional because Cleo does not publish controlled outcome studies for most flows.
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE016
  - CE026
  - CE031
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Linked-account data ingestion
    - Pulls balances and transactions from supported banks
    - Plaid support and connection quality
    - Coverage gaps or poor data quality degrade product usefulness
  - - Conversation router
    - Directs user messages to specialist agents
    - Custom encoder model plus agent taxonomy
    - Misrouting harms trust and raises latency
  - - Background financial-profile agents
    - Analyze historical data for deeper financial understanding
    - Reliable access to enriched transactions and stable data stores
    - Poor enrichment or stale profiles weaken personalization
  - - Autopilot planning layer
    - Transforms state into roadmap, daily plan, and actions
    - Planning models plus action orchestration
    - Bad predictions can misguide users in sensitive money moments
  - - Voice pipeline
    - Streams model output into audio via ElevenLabs and on-device dictation
    - Speech-to-text and TTS partners
    - Latency or pronunciation errors hurt trust
  - - Quick-reply generation layer
    - Produces suggested next actions quickly in app
    - Fine-tuned small model and stable schema
    - Schema drift can create hallucinated or mistimed UI actions
  notes: The reviewed engineering material provides more architecture specificity than most consumer-fintech marketing surfaces do.
