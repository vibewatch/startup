- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Core AI chat coach
    - General consumer user
    - Mature / GA
    - Conversational money guidance anchored in linked transaction data
    - Need active-usage and retention by cohort
  - - Cash Advance
    - Low-balance users
    - Mature / GA with eligibility gating
    - No-interest framing and embedded access through chat
    - Need loss, repayment, and fee-incidence data
  - - Cleo Savings
    - Users seeking automated savings
    - Mature / GA
    - AI-led savings goals plus 2.75% APY product framing
    - Need deposit-balance and spread economics
  - - Cleo Builder / Cleo Card
    - Credit-building users
    - Mature / GA
    - Secured-card style credit path tied to app coaching
    - Need partner economics and credit-performance data
  - - Money IQ
    - Engaged budgeting users
    - Mature / niche
    - Gamifies spending awareness with weekly prize-based quiz
    - Need evidence of retention or monetization lift
  - - Voice mode
    - Chat-first users wanting hands-free interaction
    - Recent / expanding
    - Real-time voice tied to the same Cleo personality
    - Need adoption and failure-rate metrics
  - - Autopilot
    - Higher-engagement planning users
    - Early rollout / selective access
    - Roadmap, daily plan, and action orchestration in one AI loop
    - Need conversion and retention impact data
  notes: Core modules are identifiable publicly, but only some have visible maturity and business-outcome data.
