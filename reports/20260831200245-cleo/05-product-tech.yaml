- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality mechanism
  - Status
  - Scope
  - Gap
  rows:
  - - Privacy policy and data-controller disclosures
    - Present
    - GDPR, CCPA, partner sharing, data retention, user rights
    - Needs external audit evidence rather than policy text alone
  - - Read-only linked-account posture
    - Present
    - Security FAQ says Cleo views transactions rather than controlling bank account funds
    - Need independent verification of production permissions and exceptions
  - - Encryption / SSL / cloud-security controls
    - Present
    - Policy references encrypted data, SSL, AWS/Heroku controls, and written contracts
    - No recent public incident reports or penetration summaries reviewed
  - - Partner-bank disclosures
    - Present
    - Thread Bank for deposit and savings; WebBank for card issuance
    - Economic and operational terms remain private
  - - Fraud / KYC / AML partner stack
    - Present
    - Socure, Seon, credit bureaus, complaint tooling, payment processors named in policy
    - Control effectiveness and escalation metrics not public
  - - Geographic / bank compatibility constraints
    - Present
    - Not all Plaid-supported banks work for Cash Advance; card requires U.S. eligibility signals
    - Creates product inconsistency across users and regions
  notes: Control presence is visible; control performance is not fully public.
