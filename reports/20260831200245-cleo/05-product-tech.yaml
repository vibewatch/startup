- id: trust-safety-and-compliance-controls
  title: Trust controls are present, but they are implemented through a large partner web
  body: 'Cleo’s trust story is credible but highly partner-dependent. The privacy policy says Cleo does not sell personal data and identifies a long list of external providers for bank connectivity, card issuance, cloud hosting, identity verification, fraud, customer support, payments, and credit data. The supported-banks FAQ says account connectivity depends on Plaid and explicitly notes that not all connected banks are compatible with Cash Advance. The security FAQ says bank details are not stored, that transaction history is encrypted, and that Cleo only views transaction data, not full account control. Savings and card products similarly rely on external rails: Thread Bank and its sweep-program banks support deposit accounts, while WebBank issues the Cleo Card and sponsor-bank infrastructure pages from Pathward make clear how category-standard credit programs are layered onto bank partners. These controls are directionally reassuring and common for fintech programs, but they also mean trust is only as strong as a complex network of contractual and technical integrations. In practice, product quality, compliance,
    privacy, and reliability are inseparable from partner governance and vendor execution.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
