  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - ARR compounds toward $400M+, AI Pro and adjacent tiers deepen monetization, no new enforcement event, and support or loss metrics hold up
        - Supports roughly $1.7B-$2.2B range using a premium but still non-euphoric revenue multiple on stronger disclosed quality
        - Regulatory relapse, partner failure, or poor retention of new AI features
        - Plausible only with a disclosure step-up and sustained clean execution
      - - Base
        - ARR remains strong but risk-adjusted, retention and loss quality remain partly opaque, and valuation stays anchored to fair late-stage consumer-fintech multiples
        - Supports roughly $1.1B-$1.5B range, implying modest upside from a flat $1B anchor but not a huge margin of safety
        - Hidden current price could already have moved toward this range
        - Most consistent with current public evidence
      - - Bear
        - Growth slows, support or regulatory issues recur, or monetized-product economics prove weaker than implied
        - Keeps value around $0.8B-$1.0B as multiple and quality both compress
        - New enforcement, poor loss disclosure, or partner-bank friction
        - Real downside if quality of ARR is overstated
    notes: Scenarios are valuation judgment ranges rather than management guidance.
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric anchor
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Cleo last visible private anchor
        - $1B+ valuation versus $280M-$300M ARR narrative
        - ~3.3x-3.6x ARR implied
        - Most direct anchor for current underwriting
        - Current 2026 price and note overhang remain unknown
      - - Finro overall fintech dataset
        - 416-company Q1 2026 sample
        - 14.5x average EV/Revenue; 7.6x median
        - Proves why average-based comping is dangerous
        - Broad basket, not a Cleo-specific peer set
      - - Finro banking and neobanks basket
        - 55 companies in Q1 2026 dataset
        - 12.4x average EV/Revenue; 6.9x median
        - Useful category check for digital-banking-style businesses
        - Includes stronger and weaker models than Cleo
      - - Windsor banking and lending tech public median
        - Public sector medians as of June 30, 2026
        - 3.8x EV/2026E revenue median
        - Good lower-bound public anchor for regulated, balance-sheet-sensitive fintechs
        - Public comps can understate private growth optionality
      - - Chime sponsor-bank public filing anchor
        - 8.6M active members, 67% primary relationships, 104% net dollar transaction profit retention
        - Public comp with IPO-grade disclosure depth
        - Shows what premium-quality consumer-fintech disclosure looks like
        - Retained text does not provide a simple current valuation multiple
      - - Dave operating comp
        - Q1 2026 revenue $158.4M, 1.69% 28-DPD, 5.1% net monetization rate
        - Public subscale neobank and advance comp with disclosed operating metrics
        - Useful for how credit-sensitive consumer fintechs are judged publicly
        - Retained text does not provide a clean current EV/revenue multiple
      - - SoFi scale comp
        - Q2 2026 revenue $1.2B, 15.8M members, 30% adjusted EBITDA margin
        - Large diversified public consumer-finance platform
        - Illustrates why diversified, disclosed platforms can earn better valuation support
        - Too diversified and charter-like to map directly onto Cleo
      - - Nubank scale comp
        - Q2 2026 revenue nearly $5.9B, 139M customers, $1.1B net income
        - Top-tier digital-bank superapp benchmark
        - Useful upper-quality reference for scale and profitability ambition
        - Far larger geography and product scope than Cleo
    notes: Cleo should be triangulated against both category medians and disclosure quality, not only against the highest-growth outliers.
    enumerationScope:
      coverage: partial
      basis: Covers the most relevant public and market-data comparables reviewed for Cleo valuation discipline in 2026, but not every private round or public neobank comp.
