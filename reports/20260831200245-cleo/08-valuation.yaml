  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - New consumer-protection action
        - Any new FTC or state enforcement tied to fees, disclosure, or cancellation
        - Breaks the idea that the 2025 event was a contained one-off
        - Downgrade to pass or research-more
      - - Partner or connectivity disruption
        - Material constraint on savings, card, or bank-linking functionality
        - Weakens product reliability and growth durability
        - Rework downside and reduce acceptable entry price
      - - Hidden loss metrics disappoint
        - Advance or card cohorts show materially worse loss or fraud behavior than peers
        - Breaks confidence in monetized-product quality
        - Demand large valuation discount or walk away
      - - Current price re-marked too high
        - Hidden 2026 price materially above roughly $1.5B without disclosure step-up
        - Eliminates margin of safety
        - Maintain track only or pass
      - - Retention quality disappoints
        - Paid churn or cohort retention materially worse than implied by ratings and ARR narrative
        - Weakens LTV and AI-led expansion case
        - Lower base-case value and recommendation
    notes: These triggers translate diligence outcomes directly into recommendation changes.
    claimRefs:
      - CV033
      - CV038
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current pricing and cap table
        - Latest implied valuation, fully diluted ownership, preference stack, and note terms
        - Determines whether the opportunity is fair, attractive, or already overbid
        - Obtain cap table and financing documents from company or lead investor
      - - Loss and fraud cohorts
        - Advance, Builder, and card loss curves plus reserve policy
        - Core monetization quality is otherwise impossible to underwrite
        - Request finance and risk dashboards
      - - Retention and cohort quality
        - Paid-tier churn, active-paid bridge, tier mix, and reactivation
        - Growth without durable cohorts deserves a lower multiple
        - Request product and finance cohort pack
      - - Regulatory remediation
        - Post-settlement compliance testing and complaint trend lines
        - Determines whether FTC overhang is shrinking or persistent
        - Review legal, compliance, and support evidence
      - - Partner concentration and resilience
        - Key contracts, SLAs, fallback plans, and restrictions for Plaid and bank partners
        - External dependencies can quickly re-rate the story
        - Review partner agreements and operational postmortems
      - - Exit readiness
        - Board materials, forecast discipline, and IPO-grade disclosure readiness
        - Public comp support depends on disclosure quality as much as scale
        - Request investor-readiness package and board reporting samples
    notes: These asks are intentionally narrow because most of the missing value information sits in a small set of non-public documents.
    claimRefs:
      - CV018
      - CV027
      - CV028
      - CV039
      - CV040
