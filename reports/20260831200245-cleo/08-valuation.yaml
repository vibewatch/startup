  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - Cleo has credible late-stage scale with ARR roughly in the $280M-$300M band and more than a million paying subscribers
        - We would weaken this if current retention, active-paid, or ARR quality materially lags the public narrative
      - - 2024 margin and payback signals look stronger than many consumer fintech peers
        - We would weaken this if fraud, loss, support, or partner costs erode the apparent operating leverage
      - - The implied last-known multiple is not obviously stretched relative to sensible public and private medians
        - We would weaken this if the current hidden mark is already far above the last visible valuation
      - - AI-led product depth may support continued upsell into higher-value tiers
        - We would weaken this if AI features have low retention or raise complaint and compliance rates
      - - FTC history and consumer-protection risk justify a discount to best-in-class public comps
        - We would upgrade this if management shows sustained post-settlement remediation and clean complaint data
      - - Missing cap-table and loss-cohort disclosure prevents a buy call today
        - We would upgrade this if preference terms, note docs, and loss metrics are investment-grade and manageable
    notes: The anti-thesis is less about category demand and more about whether the disclosed public story hides risk in the monetization engine.
    claimRefs:
