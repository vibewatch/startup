    layout: compact
    summary: IC-style scoring for Cleo’s investability as of 2026-08-31.
    data:
      items:
        - label: Scale and monetization proof
          score: 8
          detail: ARR, paid subscribers, and margin signals are real enough for serious diligence.
        - label: Customer and retention disclosure
          score: 4
          detail: Ratings are strong but audited cohort visibility is still thin.
        - label: Regulatory overhang
          score: 3
          detail: FTC history sits too close to the core monetization engine.
        - label: Comparable support
          score: 7
          detail: The last visible implied multiple is not obviously stretched versus sane medians.
        - label: Cap-table and preference visibility
          score: 2
          detail: Note terms and current mark remain insufficiently disclosed.
        - label: Margin of safety
          score: 5
          detail: Reasonable if the price is still near $1B, thinner if the hidden mark moved well above it.
        - label: Overall composite
          value: 4.8
          score: null
          detail: Track with medium confidence until diligence closes the few but material remaining gaps.
    approximationNotes: Scores are analyst judgments on a 1-10 scale synthesizing the chapter’s evidence rather than reported company metrics.
