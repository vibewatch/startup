  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: A management-level bottom-up cohort view of eligible U.S. users by state, linked-account rate, and paid conversion.
    whyItMatters: Without a bottom-up denominator, public TAM estimates stay too loose for precise underwriting.
    diligencePath: Request current active-user, linked-user, eligible-user, and payer funnels by geography and feature access.
    relatedQuestionRefs:
    - QM005
    - QM023
    - QM025
  - type: conflicting-data
    severity: material
    topic: peer-installed-base
    missingEvidence: A standardized definition across peers for users, members, monthly actives, and paid subscribers.
    whyItMatters: Headline user counts can materially overstate unique demand and create false comfort about category size.
    diligencePath: Normalize peer metrics to MAU, paid users, or revenue-producing accounts before comp-based sizing.
    relatedQuestionRefs:
    - QM013
    - QM019
    - QM023
