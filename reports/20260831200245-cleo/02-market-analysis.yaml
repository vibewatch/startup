    - Full-service banking relationship economics
    - Consumer / consumer
    - Core market; best fit for Cleo chatbot and Autopilot-style guidance
  - - Direct-to-consumer cash advance / liquidity apps
    - Advance fees, optional expedited transfer fees, related subscriptions
    - Employer-subsidized payroll products when no consumer choice exists
