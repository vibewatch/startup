    - Core adjacency because Cleo offers cash-flow support and advances
  - - Credit-building apps and cards
    - Membership fees and interchange linked to score-building tools
    - Large unsecured lending and mainstream card revolve
    - Consumer / consumer
    - Relevant because Cleo Builder/Card are monetized retention features
  - - General neobanking
    - Deposits, interchange, lending, full account relationship
    - Institutional treasury, mortgages, branch banking
    - Consumer / consumer
    - Only partial overlap; too broad to use as sole market definition
  - - Financial education / coaching content
    - Ad-supported or subscription guidance and habit formation
    - Enterprise wellness benefits and school curricula
    - Consumer / consumer or sponsor
    - Relevant as substitute behavior but weaker as direct revenue analog
  - - Enterprise EWA / payroll-linked access
    - Per-employee payroll-integrated liquidity services
    - Consumer-chosen app bundles outside employer relationship
    - Employer / employee or employer
    - Adjacent, but not Cleo’s core SAM because Cleo sells directly to end users
