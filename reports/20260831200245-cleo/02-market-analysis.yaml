- id: drivers-constraints-and-adverse-signals
  title: The same forces expanding demand also increase scrutiny and switching risk
  body: The strongest market tailwinds for Cleo are persistent consumer stress, widespread mobile-banking behavior, and growing openness to AI-assisted decision support. TIAA’s 2026 P-Fin Index shows financial literacy has deteriorated, with Gen Z scoring especially poorly, which strengthens the case for guided products rather than self-directed spreadsheets alone. Wells Fargo similarly shows that Gen Z is materially more willing than the average U.S. adult to use AI for money ideas. But the constraints are equally important. Public watchdogs and regulators increasingly view direct-to-consumer cash-advance and earned-wage products as potential sources of hidden fees, debt cycles, and legal ambiguity. NCLC argues that many products are intentionally structured to avoid lending-law treatment, and the CFPB documents APR-equivalent economics that look expensive when fees are annualized. Competition also compresses differentiation because several peers now bundle budgeting, alerts, savings, credit,
    and small-dollar liquidity. Finally, category user counts likely overstate unique demand because people can multi-home across free or low-cost apps. Cleo therefore operates in a market with real demand and proven spending, but one where trust, transparent pricing, and regulatory resilience matter as much as clever product design.
