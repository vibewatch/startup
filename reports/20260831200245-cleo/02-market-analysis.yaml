- id: sizing-lenses-and-observable-demand
  title: Observable demand is already in the tens of millions, but exact TAM remains hard to isolate
  body: 'A traditional top-down TAM for Cleo is difficult to support from public evidence because available studies mix budgeting software, neobanking, earned wage access, financial wellness, and credit-building. A better approach is to layer multiple public lenses. First, the adjacent short-term liquidity market is real and large: the CFPB estimates that roughly 10 million workers used earned wage products in 2022 to access more than $31.9 billion, with average transactions of $106 and frequent repeat use. Second, consumer financial fragility remains widespread. SoLo’s 2026 Cash Poor Report says 44% of Americans identify as cash-poor with less than $200 in savings, while Wells Fargo reports that many Gen Z adults describe their financial lives as messy and would run out of funds within months after job loss. Third, the category already has meaningful installed base. Cleo’s app-store disclosures say 8 million-plus users; MoneyLion says it has helped more than 18 million people; Brigit says
    12 million-plus users; Rocket Money says 10 million-plus members; and Dave reports more than 3 million monthly transacting members. Those figures cannot simply be added because multi-homing is likely high, but they do show that a consumer who wants app-based help with spending, saving, and liquidity is no longer a niche buyer. The practical conclusion is that Cleo’s reachable market is large enough to justify growth-stage underwriting, yet still requires bottom-up caution because user counts, workers, and revenue pools are not interchangeable.'
