figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Representative Cleo user path from discovery through subscription expansion and possible churn triggers.
    data:
      nodes:
        - id: J1
          label: Discover Cleo
          detail: User encounters Cleo in the App Store, Google Play, social channels, or word-of-mouth as a budgeting or cash-advance app.
        - id: J2
          label: Link account
          detail: User connects a bank account and begins chat-based spending analysis via linked transaction data.
        - id: J3
          label: Use free coaching
          detail: User asks spending questions, receives alerts, and may try budgeting, roast-mode, or Money IQ-style engagement.
        - id: J4
          label: Upgrade to paid tier
          detail: Need for cash advance, credit building, or richer AI features triggers Plus, Pro, or Builder subscription decision.
        - id: J5
          label: Expand into financial actions
          detail: User adopts savings, advance requests, credit-builder card, or newer AI features like voice and Autopilot.
        - id: J6
          label: Durability or churn event
          detail: Relationship deepens if value is consistent; billing friction, denied advances, or support issues can cause cancellation or distrust.
    approximationNotes: Journey stages synthesize public product surfaces and review patterns rather than internal funnel data.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU016
      - CU023
      - CU025
      - CU033
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Publicly supportable customer funnel from marketed reach to current paid depth.
    data:
      items:
        - label: Marketed user base
          value: 8000000
          note: 8M+ users claimed across current app-store copy
        - label: Helped millions
          value: 5000000
          note: Illustrative floor for company-page “helped millions” language; not an audited registered-user total
        - label: Active paid subscribers (2024)
          value: 743000
          note: Official annual-report page
        - label: Paying subscribers (current)
          value: 1100000
          note: Current company page; denominator may differ from active-paid metric
        - label: Higher-value card / Builder subset
          value: 250000
          note: Illustrative only; exact builder-card actives undisclosed
    approximationNotes: Only the 8M+, 743k, and 1.1M figures are directly observed or company-claimed. The “helped millions” and Builder-subset values are framing aids, not disclosed counts.
