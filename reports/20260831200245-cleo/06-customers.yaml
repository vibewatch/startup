  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Apple App Store reviewers
        - iPhone consumer users
        - Budgeting, cash advance, savings, and voice app usage
        - Production / live
        - 4.7-star rating with 259K ratings indicates scaled live usage
        - Anonymous cohort; no plan-level retention disclosed
      - - Google Play listing and Android users
        - Android consumer users
        - Budgeting, cash advance, savings, Money IQ, and voice usage
        - Production / live
        - Confirms broad Android product surface and 8M+ user positioning
        - Play fetch did not expose review count or rating in retained text
      - - Trustpilot reviewers
        - Cross-platform consumer users
        - General satisfaction, payments, fees, and support experiences
        - Production / live
        - Mixed but directionally positive UX signal with repeated support and fee complaints
        - Self-selected and complaint-heavy sample
      - - JustUseApp review cohort
        - Cross-platform consumer users
        - Aggregate app-review analysis and pricing complaints
        - Production / live
        - 255,038 review corpus confirms large user-feedback volume
        - Third-party scoring methodology is opaque
      - - Unstar 1-star review subset
        - Cash-advance-first users
        - Eligibility, cancellation, repayment timing, and express-fee experiences
        - Production / live
        - Highlights concrete friction themes that can drive churn and distrust
        - Adverse curation bias toward dissatisfied reviewers
    notes: Because Cleo is B2C, named proof is review-platform-based rather than logo-based; that is informative for adoption, but weaker for revenue durability.
    enumerationScope:
      coverage: partial
      basis: Covers the main publicly visible customer-proof surfaces for Cleo in 2026, but not every review venue or social-comment thread.
