  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Upsell from free budgeting to Plus
        - Cash-advance dissatisfaction can block upgrade trust
        - Could cap LTV and referral efficiency
        - Review free-to-paid conversion by acquisition source and complaint history
      - - Move from Plus into Pro / AI Pro
        - Unknown retention of higher-AI tier
        - Could make AI-led upsell story overstated
        - Request tier mix, churn, and gross-margin contribution
      - - Builder / Cleo Card adoption
        - Credit-product performance and non-payment rules are undisclosed
        - Could raise regulatory and customer-service burden
        - Review card actives, repayment behavior, and closure reasons
      - - UK relaunch expansion
        - UK product is currently feature-limited versus U.S. stack
        - Low near-term diversification benefit
        - Request UK MAU and launch plan for paid features
      - - U.S. consumer concentration
        - Customer base is heavily U.S.-skewed and consumer-only
        - Macro stress or regulation can hit most revenue at once
        - Request geography split, plan mix, and acquisition concentration by channel
    notes: Cleo has little classic enterprise-customer concentration risk, but meaningful geography, product-line, and support-quality concentration risk.
