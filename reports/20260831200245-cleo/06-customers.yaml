  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Monthly churn, GRR/NRR, cohort survival, and plan-level retention for Plus, Pro, and Builder.
      whyItMatters: Store ratings and subscriber counts do not reveal whether paid relationships are durable enough to support long-term LTV assumptions.
      diligencePath: Request cohort tables by acquisition channel and paid tier, including renewal, cancellation, and reactivation rates.
      relatedQuestionRefs:
        - QU015
        - QU016
        - QU025
      relatedTableRefs:
        - TU002
        - TU004
    - type: private-evidence-only
      severity: material
      topic: cash-advance-users
      missingEvidence: Qualification rate, repeat-advance usage, default or repayment behavior, and customer-support burden for cash-advance cohorts.
      whyItMatters: The cash-advance path appears to be both an acquisition wedge and a complaint source, so its unit economics and user quality matter disproportionately.
      diligencePath: Review funnel conversion, repeat-usage, complaint tickets, and repayment cohorts for advance users.
      relatedQuestionRefs:
        - QU018
        - QU024
      relatedTableRefs:
        - TU003
        - TU005
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Current geography split of active users and paying subscribers, including the share represented by the UK relaunch.
      whyItMatters: Public sources strongly suggest U.S. concentration, but they do not quantify whether any diversification is actually underway.
      diligencePath: Request monthly active users, payers, and revenue by geography for 2025-2026.
      relatedQuestionRefs:
        - QU022
        - QU023
      relatedTableRefs:
        - TU001
        - TU005
    - type: missing-source
