  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Consumer-protection recidivism
        - New regulator action or formal warning
        - Any new FTC or state action tied to disclosures, fees, or cancellation
        - Pause valuation aggression and re-underwrite trust risk
      - - Partner-bank disruption
        - Program restriction or material contract change
        - Savings, card, or connectivity product becomes materially constrained
        - Rework downside case and demand contingency plan
      - - Complaint-volume shock
        - Support, billing, or review deterioration
        - Sustained jump in negative reviews or refund complaints
        - Treat as early-warning sign for churn and enforcement
      - - Credit or fraud underperformance
        - Internal loss metrics miss plan
        - Advance or card losses exceed management tolerance band
        - Raise required return and re-score economics quality
      - - AI action failure
        - Harmful or incorrect automated recommendation incident
        - Material consumer harm or broad rollback of Autopilot-type features
        - Reassess product-led moat and regulatory exposure
      - - Geography concentration unchanged
        - No meaningful non-U.S. monetization progress
        - UK remains largely non-monetized through 2026
        - Keep concentration discount in valuation
    notes: The most useful risk triggers are observable management metrics even when public evidence is incomplete.
    claimRefs:
      - CR027
      - CR033
      - CR040
      - CR041
