      - number: '2.3'
        title: 买方、用户和付款人通常合并为同一个承压消费者
        blocks:
          - type: paragraph
            body: >-
              Cleo 的市场不同于 B2B
              金融科技，因为买方、用户和付款人通常就是同一个人。采用不是采购流程驱动，而是即时痛点或愿望驱动。最契合的细分人群是年轻的美国本土、智能手机原生消费者：他们愿意绑定银行账户，感到财务压力，并希望获得比传统银行更快的反馈。在这个宽泛人群内，公开证据指向四个实用子群：工资被拉紧、想避开透支和时间错配的用户；需要轻量路径提升信用分的人；想自动化储蓄和预算的习惯养成者；以及愿意尝试
              AI 理财指导的数字好奇用户。这些群体的付费意愿不同，但预算主人相同：终端消费者决定某个订阅、费用或存款挂钩套餐值不值得。关键在于，变现每个月都必须经受消费者审视。Cleo
              不能像接入薪酬系统的工资预支提供商那样，躲在企业合同或雇主补贴后面。在这个市场里，价值必须足够明显、足够频繁、也足够有情绪共鸣，才能让一个可选的理财 App 留在手机上并持续付费。
