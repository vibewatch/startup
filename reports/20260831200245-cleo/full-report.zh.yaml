      - number: '2.2'
        title: 可观察需求已达数千万级，但精确 TAM 仍难拆出
        blocks:
          - type: paragraph
            body: >-
              传统自上而下的 Cleo TAM 很难靠公开证据支撑，因为可用研究混在一起：预算软件、新银行、工资预支、财务健康和信用建设。更好的方法是叠加多组公开视角。第一，相邻的短期流动性市场真实且庞大：CFPB
              估计，2022 年大约 10 million 工人使用工资预支类产品，获取超过 $31.9 billion 资金，平均单笔交易 $106，且重复使用频繁。第二，消费者财务脆弱性仍很普遍。SoLo 的 2026
              Cash Poor Report 称 44% 美国人自认现金贫困、储蓄低于 $200；Wells Fargo 报告称，许多 Z
              世代成年人认为自己的财务生活混乱，并且失业后数月内就会耗尽资金。第三，品类已经拥有有意义的装机基础。Cleo 应用商店披露 8 million 以上用户；MoneyLion 称已帮助超过 18 million
              人；Brigit 称有 12 million 以上用户；Rocket Money 称有 10 million 以上会员；Dave 报告月交易会员超过 3
              million。由于多归属概率很高，这些数字不能简单相加，但它们说明，想用 App 获取消费、储蓄和流动性帮助的消费者，已经不是小众买家。实际结论是，Cleo
              可触达市场足够大，可以支撑成长期承销；但用户数、工人数和收入池不能互换，所以仍需要自下而上的谨慎。
