chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与市场焦点
        blocks:
          - type: paragraph
            body: >-
              Cleo 是一家英国创立的消费金融科技公司，把预算、储蓄、现金流支持和信用建设打包进一个聊天优先的 AI 财务助手。公司官网和应用商店页面把产品定义成全天候理财教练，而不是传统银行
              App：用户可以询问消费情况、自动化储蓄目标、通过有担保卡路径建立信用，并在余额紧张时申请小额现金垫款。这个定位很关键，因为 Cleo
              卖的不只是余额视图，也是在卖行为改变；产品语气刻意做得轻松、有梗、少评判，独立报道认为这正是它打动 Z
              世代的核心。公司法律根基在英国，运营却偏向美国；现金垫款、订阅、储蓄和信用功能都在美国规模化变现。公开证据显示，Cleo
              更像一家成长期、上市前公司，而不是成熟上市公司：它仍是私营公司，注册办公室在伦敦，现在试图回到英国市场，但用户和收入仍主要依赖美国。因此，公司身份反而异常一致：AI
              不是旁支功能，而是当下整体业务中获取用户、提升参与、包装产品和推动高阶增购路径的组织原则。
