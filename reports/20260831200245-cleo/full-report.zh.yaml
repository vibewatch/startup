  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是消费端理财指导加短期流动性，而不是广义新银行
        blocks:
          - type: paragraph
            body: >-
              对 Cleo 最有决策价值的市场定义，比“数字银行”窄、比“预算 App”宽。Cleo
              在一个聊天优先界面里结合预算、储蓄提醒、现金流预测、防止透支、现金垫款和信用建设。这意味着，这个市场包括解决同一日常任务的消费端
              App：不用打开电子表格或去网点，就能帮助用户判断本周能不能花钱、存钱、借钱或避免费用。大多数全服务银行、企业薪酬软件和纯投资产品都不在范围内，除非它们能可信替代这项任务。现状同样重要。用户采用 Cleo
              前，往往依赖银行 App、心算记账、社交媒体建议、家人支持，或透支、发薪日式预支、信用卡循环等昂贵兜底产品。公开监管研究强化了这个品类存在的原因：CFPB
              认为，这类产品需求来自收入到账时间和账单到期时间之间的错配。因此，Cleo 最好的替代品不只是聊天优先 App，也包括任何能降低边缘消费者短期资金不确定性的移动工具。
