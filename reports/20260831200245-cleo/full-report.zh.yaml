  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入由订阅、使用费和银行卡挂钩经济性混合构成
        blocks:
          - type: paragraph
            body: >-
              Cleo 的收入模型是混合型，而不是纯订阅。付费档位构成经常性骨架：条款页列出 Plus 每月 $5.99、Pro $8.99、Builder $14.99，上面还有价格更高的移动端套餐。应用商店披露和 FAQ
              页面显示，不同档位解锁不同组合的储蓄工具、现金垫款访问、信用洞察和 Builder 功能。Redbus 提供了最有用的外部收入组合细节：2024 年收入增长来自订阅收入增加
              50%，以及交易费用接近三倍增长，其中包括银行卡消费交换费 和现金垫款产品费用。这一点重要，因为 Cleo 不只是一个卖月度访问权的预算
              App。它同时把持续软件使用、紧急流动性事件和银行卡相关交易量变现。这个模型因为没有单一收入流完全孤立而具备有吸引力的多元化，但收入质量并不均匀：订阅费天然比绑定特定现金流事件的交易或加急费收入更黏。
