      - number: '7.4'
        title: 残余风险栈可监控，但仍太依赖外界看不到的内部指标
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调问题不是 Cleo
              有没有风险。它显然有。真正的问题是，这些风险能不能监控，以及管理层是否有足够内部仪表来在风险演变成监管、客户或伙伴失败前捕捉它们。公开证据说明，否决标准是可识别的：另一项消费者保护行动、重大合作银行限制、垫款或银行卡产品亏损表现恶化、投诉量急升，或自主产品承诺与现实结果之间出现重大错配。挑战在于，外部投资人今天无法直接观察多数指标。这让尽调纪律变得关键。只有当管理层能证明，客服、合规、伙伴治理和信用损失监控至少与外部可见的增长叙事和
              AI 产品雄心一样成熟时，Cleo 才可投资。投资人应该要的是每周运营仪表盘、升级阈值和董事会层面的负责人，而不是只靠叙事安抚。
