      - number: '4.3'
        title: Cleo 增加了融资支持，但现金续航仍不透明
        blocks:
          - type: paragraph
            body: >-
              前瞻资本充足性是最重要的未解财务问题。公开证据确认，Cleo 获得了 $60 million 债务额度，并披露现有投资人在 2025 年 3 月提供 $38.8 million
              可转贷款票据。这些动作很可能给管理层留出空间，支持产品增长、银行卡扩张和现金垫款敞口，而不必立刻追求大额定价股权轮。它们也说明融资结构很重要：一家提供现金垫款、有担保卡路径和储蓄产品的公司，需要资金伙伴和风险控制，而不只是软件毛利率。定价和
              FAQ
              材料显示，更高垫款额度取决于直接存款和持续资格检查，这说明承销和资金经济性与类似工资单的信号、用户现金流质量相连。但核心资产负债表问题在公开信息中仍无答案：已审阅来源没有披露手头现金、月度烧钱速度、法定资本缓冲、逾期率、准备金政策、仓储融资契约或现金跑道。缺失的资产负债表细节，正是有前景的消费金融科技
              损益表和真正可承销业务之间的分界线。
