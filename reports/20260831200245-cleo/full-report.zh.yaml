            body: >-
              可比公司纪律应该使用中位数，并按商业模式调整分组，而不是看头部金融科技平均值。本记录中最好的外部市场数据正好说明原因：整体金融科技平均值会被离群值拉高，而公开支付、贷款和新银行公司的交易倍数远低于软件化财富或企业平台。Cleo
              位于这些世界中间。它比许多简单交易 App 有更多经常性收入和参与深度，但也保留了费用、监管和信用相邻敞口，无法获得纯软件倍数。基于这一点，Cleo
              最后已知估值并不荒唐。其隐含倍数低于部分后期私营和新银行中位数，大致处在较低的公开银行 / 贷款锚点附近。话虽如此，私营和公开市场之间的差距真实存在；Chime、SoFi、Nubank
              这类一流公开消费金融科技能支撑更高估值，是因为它们披露的队列、信用和参与证据，比 Cleo 当前公开内容深得多。
