      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层可见度异常集中在创始人兼 CEO Barney Hussey-Yeo 身上。官方材料、City AM 和 BusinessCloud 都把 Hussey-Yeo 描述成 Cleo 产品策略、AI
              叙事、增长故事和上市表态背后的核心战略声音。这种一致性有利于尽调，因为谁拥有投资逻辑更清楚；但它也说明公司存在关键人物依赖。Companies House 确认 Hussey-Yeo 仍是 CLEO AI
              LTD. 董事，但对一家声称拥有 500 多名员工和九位数年经常性收入（ARR）
              的公司而言，公开治理界面仍偏薄。公开记录能识别其他高管和董事，却没有充分解释董事会层面的职责、委员会结构或独立监督。创始人与市场契合的官方故事仍然自洽：Hussey-Yeo
              的机器学习背景、金融科技经验以及长期押注对话式 AI，都与 Cleo 的产品身份直接对齐。尽调结论是，公开披露中的 Cleo
              更像创始人驱动，而不是制度驱动；魅力和速度是优势，治理深度仍是待跟进问题。对于上市前案例，这一点重要，因为今天的公开记录让投资人看到的创始人信念，远多于流程、控制层或继任安排。
