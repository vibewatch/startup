  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局分成流动性 App、预算订阅和更宽的金融科技超级 App
        blocks:
          - type: paragraph
            body: >-
              Cleo 面对的不是一个干净的竞争集合。最直接的替代品取决于用户当下要完成哪项任务。用户主要想要短期流动性时，Dave、Brigit、Albert、MoneyLion 以及 Chime
              的部分功能就是直接替代。用户想要预算清晰度和订阅可见性时，Rocket Money、Monarch 和 YNAB 更重要。用户想要更深的主账户银行关系时，Chime 和 MoneyLion 比经典预算 App
              更可信。Cleo 自己的产品界面说明了为什么格局混杂：它在一个消费端流程里营销现金垫款、储蓄、信用建设、债务工具、语音、Money IQ 和 Autopilot。广度让 Cleo
              能横跨多个微品类，但也意味着它从每个品类继承竞争对手。战略问题因此不是 Cleo 有没有对手，而是它的聊天优先人格、低余额指导和日益智能体化的
              UX，是否足够独特，能让用户不默认转向更强的垂直专家或更大的金融科技平台。
