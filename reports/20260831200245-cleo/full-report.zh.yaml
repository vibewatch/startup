      - number: '2.4'
        title: 扩大需求的同一组力量，也会加大审查和切换风险
        blocks:
          - type: paragraph
            body: >-
              Cleo 最强的市场顺风，是持续的消费者压力、普遍的移动银行行为，以及用户对 AI 辅助决策支持越来越开放。TIAA 的 2026 P-Fin Index 显示，金融素养已经恶化，Z
              世代得分尤其低，这强化了引导型产品的理由，而不只是让用户自己做电子表格。Wells Fargo 同样显示，Z 世代比美国成年人平均水平更愿意用 AI
              获取理财想法。但约束同样重要。公共监督机构和监管方越来越把直接面向消费者的现金垫款和工资预支产品，视为隐藏费用、债务循环和法律模糊性的潜在来源。NCLC 认为，许多产品有意设计成避开贷款法处理；CFPB
              则记录了费用年化后看起来昂贵的 APR 等价经济性。竞争也在压缩差异化，因为几个同行现在都把预算、提醒、储蓄、信用和小额流动性打包在一起。最后，品类用户数很可能夸大了独特需求，因为人们可以在免费或低价 App
              之间多归属。因此，Cleo 所在市场既有真实需求和已验证付费，也要求信任、透明定价和监管韧性，重要性不亚于聪明的产品设计。
