      - number: '3.3'
        title: 软切换成本存在，但大对手拥有更强信任或分发界面
        blocks:
          - type: paragraph
            body: >-
              Cleo 的切换成本真实存在，但仍偏软。用户一旦绑定账户、积累交易历史并开始收到个性化指导，去别处重启会变麻烦。Autopilot
              进一步增加黏性，因为它把静态预算变成动态计划和推荐行动。但市场结构上仍容易试用。大多数替代品都是移动优先、自助、按月付费。用户可以安装多个
              App，比较提醒和现金垫款条款；只要不喜欢语气、费用或客服，就能很快离开。因此，分发和信任极其重要。Chime 以主账户框架、百万级应用商店评论和明确的 FDIC 受保合作银行话术竞争。MoneyLion
              也靠广度和合作伙伴网络规模竞争。Dave 拥有上市公司资源和现金垫款品牌认知。Cleo 最强的反击是情绪化设计、聊天界面和越来越个性化的编排，但这些并不等同于拥有存款关系或自有雇主分发网络。
