  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标锚点
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Cleo 最后可见私有市场锚点
        - $1B+ 估值，对应 $280M-$300M ARR 叙事
        - 隐含 ~3.3x-3.6x ARR
        - 当前投资判断最直接锚点
        - 当前 2026 年价格和票据悬而未决仍未知
      - - Finro 整体金融科技数据集
        - 2026 年 Q1，416 家公司样本
        - 14.5x 平均 EV/Revenue；7.6x 中位数
        - 说明按平均值做可比很危险
        - 样本篮子宽泛，并非 Cleo 专属同业组
      - - Finro 银行业与数字银行篮子
        - 2026 年 Q1 数据集中 55 家公司
        - 12.4x 平均 EV/Revenue；6.9x 中位数
        - 可用于校准数字银行式业务的品类估值
        - 包含强于和弱于 Cleo 的模式
      - - Windsor 银行与贷款科技公开市场中位数
        - 截至 2026 年 6 月 30 日的公开市场板块中位数
        - 3.8x EV/2026E 收入中位数
        - 是受监管、对资产负债表敏感的金融科技较好公开下限锚点
        - 公开可比公司可能低估私有公司的增长可选性
      - - Chime 赞助银行公开申报锚点
        - 8.6M 活跃会员、67% 主要关系、104% 净美元交易利润留存
        - 具备 IPO 级披露深度的公开可比
        - 展示高质量消费金融科技披露应是什么样
        - 留存文本没有给出简单的当前估值倍数
      - - Dave 运营可比
        - 2026 年 Q1 收入 $158.4M、1.69% 28-DPD、5.1% 净变现率
        - 有公开运营指标的次规模数字银行和垫款可比公司
        - 有助观察公开市场如何评判信贷敏感型消费金融科技
        - 留存文本没有给出干净的当前 EV/收入倍数
      - - SoFi 规模可比
        - 2026 年 Q2 收入 $1.2B、15.8M 会员、30% 调整后 EBITDA 利润率
        - 大型多元化公开消费金融平台
        - 说明多元化且披露充分的平台为何能获得更好估值支撑
        - 过于多元且接近持牌银行，难以直接映射到 Cleo
      - - Nubank 规模可比
        - 2026 年 Q2 收入接近 $5.9B、139M 客户、$1.1B 净利润
        - 顶级数字银行超级 App 标杆
        - 可作为规模和盈利雄心的高质量上限参照
        - 地域和产品范围远大于 Cleo
    notes: Cleo 应同时用类别中位数和披露质量三角校准，而不是只对标最高增长离群值。
