      - number: '7.3'
        title: 规模降低了短期生存风险，但不透明的信用和客服经济性仍然重要
        blocks:
          - type: paragraph
            body: >-
              Cleo
              已经不是早期生存故事，这降低了一类风险，也抬高了另一类风险。官方材料和前文显示，公司已有有意义收入、付费订阅规模和盈利改善，因此短期资不抵债风险下降。不过，在投资人最需要清晰度的地方，公开财务质量仍不完整。Cleo
              的收入组合绑定订阅和收费产品，公司仍高度暴露于美国，关键的亏损敏感产品线也没有公开逾期、违约、欺诈、准备金或资本披露。条款称现金垫款无追索权，若此前垫款未还，未来访问权限可能被切断；这说明公司内嵌了一些风险控制，但公开证据还不足以有信心承销亏损模型。执行风险也仍高，因为
              AI 功能正从指导扩展到行动。产品做预算或提醒时可以显得讨喜，但一旦影响借款、信用行为或自动资金移动，出错成本就会上升。
