      - number: '8.3'
        title: 情景分析指向有限上行、有意义下行和不大的容错空间
        blocks:
          - type: paragraph
            body: >-
              情景框架刻意保守，因为证据基础混合。乐观情景假设 Cleo 能维持强劲 ARR 增长，扩大更高价值付费档位，控制客服和监管问题，并证明 AI 主导的产品栈能转化成持久队列，且没有重大信用意外。基准情景假设
              Cleo
              仍是一家强劲但部分不透明的消费金融公司，并在前瞻收入上获得更公平但不狂热的倍数。悲观情景假设公开证据已经美化了业务，而新的执法问题、伙伴中断或疲弱亏损数据同时压缩增长和适用倍数。在这些假设下，估值围绕独角兽标记仍看起来可辩护，但还没有便宜到不需要披露升级就值得给出买入判断。因此，这个区间值得继续研究，但还不是高确信度入场点。
            claimRefs:
