  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Cleo 已从理论合规风险进入真实执法历史
        blocks:
          - type: paragraph
            body: >-
              Cleo 的头号风险类别是监管和法律，因为最可见的反向证据并非推测。FTC 已经起诉，公司已经和解，第三方法律评论把事件放在一轮更广泛的负面选项设计、黑暗模式和难取消金融科技订阅整治中。Cleo
              自己的条款仍显示产品有多敏感：月度经常性扣费、宽限期例外、可选加急费、仲裁和管辖条款，在目标用户经常财务承压、贴近发薪日使用 App
              时都很关键。评论界面强化了同一主题，投诉集中在取消、客服和资格落空，而不是基础预算效用。这个组合意味着 Cleo
              的合规负担异常贴近变现引擎本身。第二次重大监管事件不仅会威胁罚款或退款，也会威胁获客效率、信任和估值。
