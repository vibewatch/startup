  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 逻辑足够强，值得继续跟踪；但还不够干净，不能激进承销
        blocks:
          - type: paragraph
            body: >-
              Cleo 的估值辩论从一个真实正面因素开始：现在已有足够收入、订阅用户和产品证据，可以把公司视为规模化后期金融科技，而不是投机性 AI App。官方和第三方证据指向大约 $280 million 到 $300
              million
              ARR、七位数付费订阅用户基础、盈利改善，以及真实的消费金融品牌。这解释了为什么公司跨过独角兽门槛。谨慎点在于，在这个阶段，价格纪律比公司质量更重要。最后一个可见估值锚已经过时，公开证据仍缺少票据条款、股权结构表细节、清算优先权细节，以及充分披露的亏损或留存队列。Cleo
              或许应该相对商品化金融科技拿到溢价，但还不该拿到一张空白支票式 AI 溢价。正确起点是判断：围绕最后已知独角兽标记的隐含倍数，在调整监管和资产负债表风险后，是合理、慷慨，还是仍有吸引力。
