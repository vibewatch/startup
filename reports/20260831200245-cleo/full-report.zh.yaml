      - - 垫款损失、还款逾期和欺诈
        - 无法给收入流中的信用或流动性风险定价
        - 审阅承保材料和 12 个月信用表现表
      - - 付费用户流失和按档位订阅留存
        - 无法验证 LTV 或收入耐久性
        - 索取 Plus、Pro、Builder 和 AI Pro 队列留存
      - - 直接入账渗透率和绑定率
        - 无法判断高价值用户质量或承保基础
        - 索取月活直接入账用户和转化漏斗
      - - 合作伙伴经济性和收入分成
        - 无法把总收入转成贡献利润率
        - 审阅与 Thread Bank、WebBank 及处理商的协议
      - - 当前 ARR 按收入流构成
        - 无法判断当前规模更偏订阅还是更偏费用
        - 获取管理层按订阅、交易费、交换费和其他收入拆分的收入结构
      - - 准备金政策和契约
        - 无法对资本充足性做压力测试
        - 索取债务融资文件和董事会批准的准备金框架
    notes: 这些缺口是从鼓舞人心的公开叙事走向可投资财务模型所需的最低资料包。
