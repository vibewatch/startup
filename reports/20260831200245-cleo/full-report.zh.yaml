      - number: '6.3'
        title: Cleo 成为付费习惯时，留存看起来最强；但扣费和客服摩擦带来耐久性风险
        blocks:
          - type: paragraph
            body: >-
              公开证据中，客户耐久性的最好证明是间接的。活跃付费用户从 2024 年底的 743,000 增至当前公司页面上的 1.1 million 付费订阅用户，说明扩张有意义；官方定价材料和 FAQ
              内容也显示，从免费预算到 Plus、Pro、Builder 计划，ARPU 阶梯清楚。Builder 的订阅机制和银行卡关闭规则暗示，Cleo
              正试图把阶段性的财务压力，转化成经常性会员关系。与此同时，反向证据在这里比许多消费 App 更重要。FTC
              指控、评论平台投诉和第三方评测反复指向同一组流失向量：先订阅后发现垫款、尝试取消后仍被收费、垫款资格不稳定，以及客服不满。因此，Cleo
              作为习惯养成型预算产品看起来更耐久；作为人人喜爱的现金垫款品牌则弱得多。它的集中风险更多来自地域和功能，而不是客户标识。
