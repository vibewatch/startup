  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Cleo 通过一个对话界面交付宽泛的消费金融流程
        blocks:
          - type: paragraph
            body: >-
              理解 Cleo 的产品定义，按工作流比按金融科技 SKU 清单更容易。这个 App 定位为用户真能对话的 AI
              理财教练；公开产品界面把预算、储蓄、现金垫款、信用建设、债务指导、语音交互和每周测验装进一条持续对话里。关键产品选择在于，这些能力没有被营销成独立目的地。用户绑定账户，向 Cleo
              询问消费或低余额问题，收到指导，然后可以在不离开更大助手的情况下，转向储蓄、垫款或建立信用等相邻动作。因此，Cleo 感觉不太像银行 App，更像围绕习惯养成搭建的财务操作层。Autopilot
              通过收入、账单、目标和实际消费主动管理可安全支出指导，把同一想法向前推进；Money IQ 则把交易知识变成游戏。产品广度确实有意义，但统一概念是对话界面，而不只是经典仪表盘。
