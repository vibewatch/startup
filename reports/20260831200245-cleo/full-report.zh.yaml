        - 流动性驱动的金融科技
        - 3.08M MTMs；上市公司收入规模
        - 需要短期现金周转的用户
        - CashAI 承保能力和强现金垫款品牌
        - 资金管理深度不如 Cleo 的完整指导叙事
      - - Brigit
        - 流动性 + 信用建设应用
        - 12M+ 用户
