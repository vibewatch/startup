      - number: '3.4'
        title: Cleo 的护城河偏体验和品牌，但大量表层可被模仿
        blocks:
          - type: paragraph
            body: >-
              Cleo 最好的竞争论点是，大多数对手仍在营销功能，而 Cleo 在营销一种关系。它的产品文案异常对话化；语音模式、Money IQ 和 Autopilot 都把 App
              从静态预算推向习惯养成和持续辅导。工程文章通过展示其对智能体路由、个性化和延迟改善的投入，强化了这个故事。不过，反向案例也有分量。NCLC 把许多相邻 App
              识别为正在承受更强审查的直接面向借款人贷款方，这意味着竞争对手已经共享同一组问题，并可能进一步收敛。Trustpilot 也显示，Cleo
              的品牌语气并不能抹掉支付、服务和费用这类经典消费金融痛点。更重要的是，Cleo 很多差异化都可以在 UI 层复制。一个拥有更强存款经济性或分发的大对手，可以加入更多对话式指导，而不必复制 Cleo
              的具体语气。尽调角度看，Cleo 的护城河似乎可信，但还没有证明能脱离更快执行和更强留存结果，成为持久壁垒。
