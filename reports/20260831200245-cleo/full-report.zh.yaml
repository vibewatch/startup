      - - MoneyLion
        - 消费金融超级应用
        - 18M+ 用户；1,300+ 合作伙伴
        - 寻求银行、支出、储蓄、投资、借贷组合的消费者
        - 覆盖面、合作伙伴生态和与存款挂钩的会员体系
        - 相比 Cleo，可能更宽泛、人格化更弱
      - - Chime
        - 主账户新银行
        - 1M+ 五星评价；公开投资者材料
        - 想要低费用支票、储蓄和信用功能的消费者
        - 信任、直接存款导向和银行账户主入口地位
        - 抓取材料中，AI 引导特征不如 Cleo 明显
      - - Rocket Money
        - 订阅与预算管理应用
        - 10M+ 会员
        - 优化支出和账单的用户
        - 订阅跟踪、取消帮助和高级人工服务
        - 流动性和信用建设深度弱于 Cleo
      - - YNAB
        - 预算订阅
        - 高价专业工具
        - 规划意愿强的个人和家庭
        - 深度预算方法和纯订阅模式
        - 没有明显的流动性或信用建设层
      - - Monarch
        - 家庭财务规划工具
        - 高价家庭规划产品
        - 想要共享清晰视图的伴侣和家庭
        - 共享视图、周期性交易识别、目标和报告
        - 不太贴合低余额应急场景
