        - 垫款或卡同期群显示损失或欺诈行为显著差于同行
        - 击穿对变现产品质量的信心
        - 要求大幅估值折扣，否则放弃
      - - 当前价格重估过高
        - 在没有披露升级的情况下，隐藏 2026 年价格显著高于约 $1.5B
        - 抹掉安全边际
        - 仅维持跟踪或放弃
      - - 留存质量不及预期
        - 付费流失或同期群留存显著差于评分和 ARR 叙事所隐含的水平
        - 削弱 LTV 和 AI 驱动扩张论点
        - 下调基准估值和建议
    notes: 这些触发信号会把尽调结果直接转化为建议变化。
    claimRefs:
      - CV033
      - CV038
      - CV040
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前定价与股权结构
        - 最新隐含估值、完全稀释所有权、优先权栈和票据条款
        - 决定机会是合理、有吸引力，还是已经被抢高
        - 从公司或领投方获取股权结构表和融资文件
      - - 损失与欺诈同期群
        - 垫款、Builder 和卡损失曲线，以及准备金政策
        - 否则无法评估核心变现质量
        - 索取财务和风险仪表盘
      - - 留存与同期群质量
        - 付费层级流失、活跃付费桥接、层级组合和重新激活
        - 没有耐久同期群的增长应给更低倍数
        - 索取产品和财务同期群包
      - - 监管整改
        - 和解后合规测试和投诉趋势线
        - 决定 FTC 压力是在消退还是持续
        - 审阅法律、合规和支持证据
      - - 合作伙伴集中度与韧性
        - Plaid 和银行合作伙伴的关键合同、SLA、兜底方案和限制
        - 外部依赖会快速改写市场对故事的定价
        - 审阅合作伙伴协议和运营复盘
      - - 退出准备度
        - 董事会材料、预测纪律和 IPO 级披露准备度
        - 公开可比支撑既看规模，也看披露质量
        - 索取投资人准备材料包和董事会报告样本
    notes: 这些问题刻意收窄，因为大部分缺失的价值信息都藏在少数非公开文件里。
    claimRefs:
      - CV018
      - CV027
      - CV028
      - CV039
      - CV040
