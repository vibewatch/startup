        title: 架构是智能体化、数据连接，并且明确为低延迟和专业化优化
        blocks:
          - type: paragraph
            body: >-
              对消费金融 App 而言，Cleo 的工程文章对技术运营模型给出了少见的强可见度。系统并没有被描述成一个单体聊天机器人。相反，Cleo
              称其使用多智能体架构，由路由器选择领域专家，后台智能体分析历史交易数据，构建持久财务画像。新的自定义路由器被呈现为明显快于仅依赖 LLM 的方法；Autopilot
              又增加一层，把工作拆成交易理解、规划、优先级排序和动作执行。语音模式保留同一条核心聊天流水线，把输出流式传入语音层，而不是把产品拆成互不相干的文本和音频栈。Cleo
              的技术选择反映了产品约束：财务辅助需要低延迟、更准确的交易理解，以及狭窄、高置信度的任务路由。因此，它的产品技术故事比泛泛的 AI 助手营销更具体、更可信，尽管仍高度依赖已连接财务数据的质量和第三方组件可靠性。
