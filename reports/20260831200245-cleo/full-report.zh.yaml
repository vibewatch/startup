          - type: paragraph
            body: >-
              Cleo 的成熟度画像合理地不均匀。核心绑定账户聊天产品、信用建设路径和储蓄流程，看起来已经成熟到足以支撑今天的规模化消费端使用。相比之下，语音模式、Autopilot
              以及部分底层智能体路由优化，显然是仍在扩展的新层。Autopilot 材料称推出是选择性的，路线图会在 2026
              年继续扩展到更多目标和动作。工程文章也揭示了运营取舍：快捷回复微调改善了参与度和延迟，却提高了对数据结构变化的敏感性；语音模式需要自定义启发式规则，以避免错误读出金额。这些细节重要，因为它们说明 Cleo
              在搭建真实产品系统，而不是把 AI 文案拧到金融科技外壳上。它们也说明技术风险在哪里：编排复杂度、伙伴依赖，以及在持续发布对行为敏感的 AI
              新功能时守住信任的能力。公开证据支持一个思考充分的产品组织，但不是零风险组织。
