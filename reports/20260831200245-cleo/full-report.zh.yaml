      - number: '1.3'
        title: 融资、规模指标与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              Cleo 的资本和规模故事已经足够强，值得进入后续尽调章节，但还没有做到端到端完全审计。官方时间线披露了 2017 年种子轮、2018 年 Series A、2020 年 Series B 和 2022 年
              Series C；Redbus 又补充了一笔此前未披露的 2025 年 3 月 $38.8 million 可转债。Sacra 汇总数据暗示累计融资大约 $175
              million，与已知轮次方向一致，但仍需要核验股权结构表。运营规模上，Cleo 自有页面称公司 ARR 已超过 $300 million，付费订阅用户达到 1.1 million，团队扩至 500
              多人；2024 年年报页面则显示 743,000 名付费订阅用户和 2024 年 $186 million 期末收入运行率。独立报道交叉验证了增长方向：City AM 称 Cleo 在 2025 年跨过 $1
              billion 估值门槛，BusinessCloud 称管理层公开引用 $280 million ARR，Redbus 称 2024 年收入翻倍至 $135.7
              million，亏损几乎消失。时间线很亮眼，但经审计的 2025
              年账目、所有权细节和精确当前员工数仍缺失。就目前而言，公开证据对动能和规模的支撑强于对稀释、现金续航或治理成熟度的精确承销。因此，可能的投资辩论不是 Cleo
              有没有牵引力，而是今天的私募市场入场条款是否恰当反映仍不透明的部分。
