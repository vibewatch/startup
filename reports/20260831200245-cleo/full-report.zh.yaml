        title: 公开财务结论是动能正面，但承销完整性仍需谨慎
        blocks:
          - type: paragraph
            body: >-
              合在一起看，公开记录支持一个建设性但不完整的财务结论。Cleo 已有足够规模、盈利改善和定价纪律证据，值得严肃尽调关注。一个消费金融 App 拥有 $136 million 2024 年收入、$186
              million 期末收入运行率、2024 年底 743,000 名活跃付费订阅用户，并随后主张 $280–300 million ARR，已经远超投机性的产品前阶段。报告中的低 CAC
              和短回本周期，说明其获客经济性会让许多消费 App
              羡慕。但承销仍需要那些营销页面和创始人访谈没有提供的枯燥细节：按队列的活跃付费流失、准备金充足性、信用损失和欺诈经验、按档位的净收入留存、直接存款渗透率，以及当前流动性的硬证据。Cleo
              比许多后期金融科技故事更去风险，因为增长已被交叉验证，也有盈利迹象。但它还没有去风险到可以跳过管理层账目、信用表现数据和融资文件审查。
