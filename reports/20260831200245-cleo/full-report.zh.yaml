      - number: '6.2'
        title: 采用证据真实且庞大，但主要是平台层级，而非经审计队列披露
        blocks:
          - type: paragraph
            body: >-
              Cleo 的公开客户证据已经足够，能排除它只是小众或纯靠风险资金补贴产品的说法。官方页面声称 1.1 million 付费订阅用户，并称 App 已帮助数百万人；2024 年年报页面显示 2024 年底有
              743,000 名活跃付费订阅用户。应用商店证据同样可观：当前 iPhone 页面在大约 259,000 个评分中获得 4.7 星，第三方评论汇总平台处理的评论远超 250,000
              条。这个组合强烈说明，公司有真实、规模化的消费端使用。限制在于，多数具名证据是平台层面，而不是账户层面。Cleo
              不披露经审计留存队列、付费订阅用户流失，或按功能线划分的细分满意度。因此，对漏斗顶部采用的信心高，对长期客户质量指标的信心较低。
