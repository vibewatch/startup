        title: 运营韧性取决于外部伙伴网络和政策层控制
        blocks:
          - type: paragraph
            body: >-
              Cleo 的产品体验对外部机构和供应商关系的依赖，比聊天界面本身暗示的更深。Plaid 影响连接和账户授权，Thread 影响存款扫转机制，WebBank 影响发卡；Cleo
              自己的隐私政策还列出更长的云、模型、欺诈、身份和支付提供商名单。部分关系带有可见缓释：加密连接、24/7 监控主张、第三方风险项目，以及发起银行层面的 BSA/AML 控制。但同一证据也凸显残余敞口。Thread
              的扫转 披露明确说明底层项目银行可能变化，用户通过 Thread 间接互动；WebBank 的公开界面偏薄；Cleo
              的客服架构则分散在许多产品专属帮助界面。主要运营风险因此不是单一失效模式，而是级联风险：连接、伙伴治理、客服负载或数据处理问题叠加，在用户正要求 App 管理敏感金钱决策时，转化成客户不信任。
