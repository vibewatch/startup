  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: Cleo 主要服务想要低摩擦理财教练的自主型美国消费者
        blocks:
          - type: paragraph
            body: >-
              和企业金融科技相比，Cleo 的客户模型明显简单：买方、日常用户和付款人通常是同一个个人。公开材料和第三方报道一致把产品定位给 Z
              世代和预算新手，他们想要对话式、低评判界面，而不是表格式个人理财软件。最重要的分群维度不是公司规模或行业，而是财务需求和产品深度：免费预算用户、付费订阅用户、信用建设用户和短期流动性需求者。地理也重要，因为
              Cleo 虽然创立于英国，并重新开放了有限的英国产品界面，但经济性仍集中在美国。功能缺口也定义了谁不适合。官方 FAQ 和评测报道显示，Cleo
              对伴侣、企业账户用户、投资导向家庭，以及任何期待拥有国际覆盖或点对点支付的全服务银行的人，都更弱。换句话说，Cleo 更接近一款有引导的消费金融习惯产品，而不是通用家庭理财平台。
