      - number: '6.4'
        title: 客户质量足以让人相信产品市场契合，但还不足以完全相信耐久性
        blocks:
          - type: paragraph
            body: >-
              合在一起看，客户证据支持一个清晰结论。Cleo
              已经在真实、规模化的年轻美国消费者群体中找到产品市场契合；这些消费者想通过聊天、提醒和轻量信用或流动性工具获得理财指导。这是有意义的商业成就，尤其考虑到可见的付费订阅基础，以及一家私营公司罕见的大规模评论足迹。不过，证据仍偏向获客和参与，而不是充分披露的耐久性。公司已经证明能吸引用户，并把他们增购进订阅，但公开证据较少说明这些关系能持续多久、多少用户会超过第一个付费档位，以及投诉较多的金钱时刻功能如何影响客户终身价值。尽调上，客户故事是正面但不完整，而不是已经完全去风险。与投资相关的结论是，Cleo
              似乎打穿了对目标人群的获客和共鸣，但还没有公开去风险其最敏感变现互动的耐久性。这个区别重要，因为估值应该奖励已验证的经常性关系，而不是原始下载热度。
