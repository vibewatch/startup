      - number: '8.4'
        title: 正确的投委会（IC）姿态是观察，叠加高风险，并设置明确尽调门槛
        blocks:
          - type: paragraph
            body: >-
              证据支持继续尽调，而不是直接排除。Cleo 有真实规模、真实变现，也有比许多事后追逐 AI 品牌的金融科技 App 更强的叙事产品契合。但好公司不自动等于未知 2026 价格下的好入场。符合 IC
              质量的答案因此是：观察，中等信心，高风险，估值立场合理。这个判断可以向两个方向移动。如果当前价格仍接近最后可见标记，且管理层能展示干净的和解后运营指标、健康亏损队列、持久留存和可管理的票据包袱，评级可以上调。如果隐藏的当前价格明显高于最后公开锚点，或核心变现依赖的客户行为弱于、风险高于公开故事，评级应下调。最终尽调负担窄但重：价格、优先权、亏损数据、留存和伙伴韧性，比品牌热度更能决定投资。
