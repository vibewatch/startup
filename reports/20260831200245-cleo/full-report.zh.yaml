      - number: '3.2'
        title: Cleo 同时与更便宜和更昂贵的组合竞争，但包装异常混合
        blocks:
          - type: paragraph
            body: >-
              按功能看，Cleo 介于纯预算软件和更宽的新银行之间。App Store 和 Google Play 描述把 8 million 以上用户、现金垫款、2.75% APY 储蓄、信用建设、Debt
              Reset、Autopilot、Money IQ 和语音装进一个 App。这比强调规划、报告和家庭清晰度的 YNAB 或 Monarch 更宽，也比 Rocket Money 的取消订阅和消费管理焦点更宽。面对
              Dave 和 Brigit 这样的流动性专家，Cleo 不太靠最高垫款额度竞争，而是把应急使用转化成持续指导关系。面对 Albert 和 MoneyLion，Cleo
              用更轻、更好玩的产品语气和更低的标价竞争。定价分散也说明定位。YNAB、Monarch 和 Albert 瞄准愿意为高阶指导或整理支付明显更高价格的用户；Brigit 和 MoneyLion
              则靠较低月费叠加流动性相关经济性变现。Cleo 看起来有意放在这个区间中部，支撑了大众市场吸引力；但如果高端用户最终想要更完整的银行，或更严肃的家庭规划工具，高端变现会更难。
