      - number: '4.2'
        title: 公开牵引力强，单位经济性看起来不错，但还不是完全打开账本
        blocks:
          - type: paragraph
            body: >-
              Cleo 的公开牵引力足够强，财务故事有可信基础。2024 年年报页面称收入几乎翻倍至 $136 million，期末收入运行率达到 $186 million，EBITDA 利润率达到 8.4%，并且从 2024
              年 8 月起净利润转正。公司页面随后延伸这条轨迹，称 Cleo ARR 超过 $300 million，付费订阅用户达到 1.1 million；BusinessCloud 则引用创始人说法，称公司已经达到
              $280 million ARR 并实现盈利。即便考虑公司主张和独立报道之间的差异，三类来源都指向同一方向：Cleo
              似乎已经从风险融资驱动的增长故事，跨到拥有有意义经常性规模的业务。最鼓舞人的单位经济性信号，是年报披露的 $11 获客成本、三个月回本周期和 2024 年 60%
              毛利率。对于消费金融科技公司，这些表层指标异常有吸引力。只是公开披露还没有展示按产品划分的贡献利润率、按档位划分的付费用户流失、欺诈损失，或垫款相关活动的净信用损失。因此，财务图景方向正面、部分得到交叉验证，但还不足以只靠公开数据承销。
