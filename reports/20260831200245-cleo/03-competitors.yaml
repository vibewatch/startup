- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Personality-led conversational brand
    - Rivals can imitate tone or add generative chat surfaces
    - High
    - Request retention and NPS proof showing tone drives durable behavior change, not novelty
  - - Agentic planning and Autopilot
    - Larger platforms could add roadmap-style automation quickly
    - High
    - Measure whether Autopilot lifts paid conversion or retention relative to non-users
  - - Integrated product breadth
    - Broader rivals like MoneyLion and Chime already span more financial primitives
    - High
    - Clarify where Cleo wins on daily engagement, not just feature checklist breadth
  - - Data-driven personalization
    - Users can revoke linked accounts or multi-home across apps
    - Medium
    - Request cohort data on linked-account persistence and feature attach by age segment
  - - App-store and social discovery resonance
    - App stores can favor larger brands or cheaper substitutes
    - Medium
    - Audit CAC by channel and share of organic installs versus paid or referral traffic
  - - Trust advantage from playful UX
    - Service, payment, or fee complaints can quickly erode goodwill
    - High
    - Review complaint trends and support SLAs before underwriting brand-led moat claims
  notes: Competitive risk focuses on durability of differentiation rather than generic market crowding alone.
