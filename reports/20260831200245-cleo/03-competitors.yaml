- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Price / unit
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Cleo
    - $5.99+ monthly tiers plus express-fee economics on some advances
    - Savings goals, APY access, credit insights, cash advances, Builder, priority support
    - Realized ARPU and upgrade mix not public
    - Affordable mass-market positioning with room for upsell but less premium headroom
  - - Brigit
    - $8.99 Plus / $15.99 Premium
    - Instant Cash, credit monitoring, identity tools, credit builder on Premium
    - Advance eligibility varies by state and user
    - Closer to Cleo on monthly-price psychology
  - - MoneyLion
    - $9.99 monthly or waived with qualifying direct deposits
    - Spend, save, membership benefits, Instacash, marketplace access
    - Some benefits tied to deposit behavior and turbo fees
    - Uses bank-like bundle economics to offset headline price
  - - YNAB
    - $109 annually or $14.99 monthly
    - Budgeting method and planning tools
    - Pure subscription model; no cash advance layer evident
    - Shows willingness to pay for disciplined planners
  - - Monarch
    - $99 annually
    - Planning, recurring detection, reports, goals, shared household view
    - Annual emphasis reduces direct monthly comparison
    - Targets more organized household-finance segment
  - - Albert
    - $19.99 to $39.99 monthly
    - AI assistant, savings, advances, credit products, identity benefits
    - Segment likely skews toward higher willingness to pay
    - Demonstrates premium AI-finance pricing ceiling
  - - Chime
    - No monthly fee headline, with optional product fees
    - Checking, savings, credit, cashback, early pay
    - Pricing depends on product usage rather than subscription
    - Competes by making subscription budgeting tools feel unnecessary
  notes: Pricing mixes subscriptions and usage-linked economics; it should not be read as realized take rate or unit margin.
