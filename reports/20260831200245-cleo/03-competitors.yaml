- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Dave
    - Liquidity-led fintech
    - 3.08M MTMs; public-company revenue scale
    - Users needing short-term cash coverage
    - CashAI underwriting and strong cash-advance brand
    - Narrower money-management depth than Cleo’s full guidance story
  - - Brigit
    - Liquidity + credit-building app
    - 12M+ users
    - Cash-strapped consumers wanting advances and credit help
    - Combines advances, budgeting, and identity/credit tools
    - Product voice and planning depth look less differentiated than Cleo
  - - MoneyLion
    - Consumer-finance super-app
    - 18M+ users; 1,300+ partners
    - Consumers seeking bank, spend, save, invest, borrow bundle
    - Breadth, partner ecosystem, and deposit-linked membership
    - Can feel broader and less personality-led than Cleo
  - - Chime
    - Primary-account neobank
    - 1M+ five-star reviews; public investor surface
    - Consumers wanting fee-light checking, savings, and credit features
    - Trust, direct-deposit orientation, and bank-account primacy
    - Less overtly AI-guided than Cleo in fetched materials
  - - Rocket Money
    - Subscription and budgeting app
    - 10M+ members
    - Users optimizing spending and bills
    - Subscription tracking, cancellation help, and premium human services
    - Weaker liquidity and credit-building depth than Cleo
  - - YNAB
    - Budgeting subscription
    - Premium-priced specialist
    - Highly intentional planners and households
    - Deep budgeting method and subscription-pure model
    - No obvious liquidity or credit-building layer
  - - Monarch
    - Household finance planner
    - Premium-priced household planning product
    - Couples and households wanting shared clarity
    - Shared view, recurring detection, goals, and reporting
    - Less tailored to low-balance emergency use cases
  - - Albert
    - AI finance assistant + credit
    - High subscription pricing; advances and LOC
    - Users willing to pay for AI help plus banking products
    - Higher-priced AI assistant with broader credit stack
    - May feel expensive for Cleo’s mass-market segment
  notes: Profiles are based on publicly visible consumer-facing and investor-facing materials rather than internal cohort data.
