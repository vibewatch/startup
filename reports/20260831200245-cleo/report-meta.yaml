  topStrengths:
    - Cleo has real subscriber, ARR, and product-monetization proof rather than a thin AI-app narrative.
    - Official 2024 margin and payback signals suggest stronger operating leverage than many consumer-fintech peers.
    - The last visible unicorn valuation is not obviously stretched against sensible public and late-stage fintech revenue anchors.
  topRisks:
    - FTC history, subscription-cancellation sensitivity, and customer-trust exposure sit close to the core monetization engine.
    - Current cap-table terms, note overhang, retention quality, and credit-loss disclosure remain too opaque for a buy call.
    - U.S. concentration and partner dependence mean regulatory, connectivity, or sponsor-bank shocks could re-rate the business quickly.
    - A higher unseen 2026 private mark would erase much of the current margin of safety.
  unresolvedGaps:
    - Current implied valuation, fully diluted cap table, liquidation preferences, and March 2025 note terms.
    - Paid-tier churn, active-paid bridge, cohort retention, and product-level reactivation data.
    - Advance, Builder, and card loss curves, reserve policy, and fraud metrics.
    - Post-settlement compliance testing, complaint-trend evidence, and partner contingency planning.
