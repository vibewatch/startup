companyProfile:
  summary: Cleo is a London-founded AI personal-finance company that built a consumer money-coaching product around conversational UX rather than spreadsheet-style budgeting. The business now monetizes through subscriptions and fee-bearing financial products such as cash advances, savings, and secured credit-building, while still leaning heavily on U.S. users and partner-bank infrastructure. The central diligence question is no longer whether Cleo has product-market fit, but whether its current price, risk controls, and disclosed cohort quality justify a premium late-stage entry.
  foundedDate: '2016-01-01'
  founders:
    - name: Barney Hussey-Yeo
      role: Founder & CEO
      background: Machine-learning-trained founder who built Cleo around conversational finance and remains the company’s dominant public strategic voice.
      claimRefs: [CO002, CO006]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom, with operations across London, New York, and San Francisco
  productSummary: Chat-first budgeting, savings, cash advance, credit-building, and AI-planning tools delivered through one consumer-finance app.
  customerFocus: Primarily U.S. Gen Z and younger consumers seeking lower-friction money guidance and lightweight liquidity or credit tools.
  businessModel: Paid subscriptions plus transaction-related and financial-product fees across cash advance, card, savings, and adjacent consumer-finance workflows.
  stage: growth
  fundingStatus: Cleo has disclosed venture rounds through Series C plus a previously unannounced $38.8M convertible note in March 2025, and public reporting supports unicorn status without a public listing.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO015, CO018, CO019, CO020, CO021, CO026, CO031, CO034, CO035]
summary:
