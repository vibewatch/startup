evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-detail
    missingEvidence: Exact headcount by office, function, and contractor mix for London, New York, and San Francisco.
    whyItMatters: Operational leverage and talent concentration cannot be assessed precisely from the public 500+ headline alone.
    diligencePath: Request current org chart, employee census, and office-by-office headcount from management.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: >-
      Current cap table, ownership percentages, preference stack, and the terms of the March 2025 convertible loan
      notes.
    whyItMatters: >-
      Entry-price discipline and downside protection cannot be judged credibly without knowing dilution and liquidation
      preferences.
    diligencePath: Obtain the latest cap table, note documents, and board approvals from the company or lead investor.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: audited-2025-financials
    missingEvidence: Audited or filed full-year 2025 accounts tying ARR claims to statutory revenue, margins, and cash flow.
    whyItMatters: >-
      Current growth and profitability narratives rely on management pages and media reporting rather than published
      audited statements.
    diligencePath: >-
      Check whether 31 December 2025 accounts are filed after the Companies House due date, or request investor
      reporting directly.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: minor
    topic: uk-gtm-scope
    missingEvidence: Precise UK user numbers and monetization rollout plan after the UK return.
    whyItMatters: UK relaunch optionality is part of the founder narrative, but current commercial significance cannot be measured.
    diligencePath: Ask management for UK MAU, retention, and monetization milestones by quarter.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: board-governance-gaps
    missingEvidence: Committee structure, director remits, and independence standards for the current Cleo board.
    whyItMatters: Founder concentration is easier to evaluate when the oversight structure and committee coverage are visible.
    diligencePath: Request the latest board deck, committee charters, and board-observer rights from management or the lead investor.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: milestone-coverage-gaps
    missingEvidence: >-
      Day-level dates and additional private milestones for governance, commercial launches, and international relaunch
      execution.
    whyItMatters: The public chronology is sufficient for orientation but not for underwriting execution cadence or hidden delays.
    diligencePath: Request a board-approved milestone history and the internal launch calendar covering 2024-2026.
    relatedQuestionRefs:
      - QO016
      - QO020
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A management-level bottom-up cohort view of eligible U.S. users by state, linked-account rate, and paid
      conversion.
    whyItMatters: Without a bottom-up denominator, public TAM estimates stay too loose for precise underwriting.
    diligencePath: Request current active-user, linked-user, eligible-user, and payer funnels by geography and feature access.
    relatedQuestionRefs:
      - QM005
      - QM023
      - QM025
  - type: conflicting-data
    severity: material
    topic: peer-installed-base
    missingEvidence: A standardized definition across peers for users, members, monthly actives, and paid subscribers.
    whyItMatters: Headline user counts can materially overstate unique demand and create false comfort about category size.
    diligencePath: Normalize peer metrics to MAU, paid users, or revenue-producing accounts before comp-based sizing.
    relatedQuestionRefs:
      - QM013
      - QM019
      - QM023
  - type: missing-source
    severity: material
    topic: availability-constraint
    missingEvidence: A current state-by-state matrix for Cleo advances, credit-building, and savings eligibility.
    whyItMatters: Feature availability directly determines Cleo’s serviceable U.S. market and monetization reach.
    diligencePath: Request internal compliance matrix or regulator-ready state availability schedule from management.
    relatedQuestionRefs:
      - QM018
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: buyer-user-payer
    missingEvidence: Paid conversion and churn by segment, especially for AI-guidance users versus advance-first users.
    whyItMatters: The market looks large, but Cleo’s real revenue opportunity depends on which segments retain and pay.
    diligencePath: Obtain cohort retention, plan conversion, and feature attach data by user archetype.
    relatedQuestionRefs:
      - QM014
      - QM015
      - QM016
  - type: stale
    severity: minor
    topic: money-worries
    missingEvidence: A fresh 2026 government or top-tier survey replicating the APA money-worry findings for 18-34-year-olds.
    whyItMatters: The APA source is directionally helpful but predates the current run date.
    diligencePath: Swap in a newer government or tier-one survey if a later equivalent becomes available.
    relatedQuestionRefs:
      - QM008
  - type: enumeration-incomplete
    severity: minor
    topic: direct-substitutes
    missingEvidence: A complete substitute map including smaller niche personal-finance apps and status-quo non-app workflows.
    whyItMatters: The market landscape is fragmented and this chapter emphasizes the largest visible substitutes only.
    diligencePath: Extend competitor discovery with app-store rank data and consumer finance category crawls.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: material
    topic: retention-proof
    missingEvidence: Head-to-head retention or paid-conversion data showing Autopilot, voice, or Money IQ outperform baseline cohorts.
    whyItMatters: Cleo’s moat thesis relies on experiential differentiation, which is not proven by marketing copy alone.
    diligencePath: Request cohort retention and conversion metrics for users adopting Autopilot, voice mode, or Builder.
    relatedQuestionRefs:
      - QP011
      - QP021
      - QP022
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort data on multi-homing, uninstall reasons, and competitive win/loss against Dave, Brigit, MoneyLion, and
      Rocket Money.
    whyItMatters: Soft switching-cost claims remain speculative without observed churn and overlap behavior.
    diligencePath: Review survey, app-store attribution, and internal churn codes by competitor mention.
    relatedQuestionRefs:
      - QP012
      - QP019
  - type: enumeration-incomplete
    severity: minor
    topic: landscape
    missingEvidence: Full long-tail substitute set covering other cash-advance and budgeting apps named in Cleo’s store disclaimers.
    whyItMatters: >-
      The market is fragmented and the reviewed competitor set focuses only on the most decision-relevant visible
      players.
    diligencePath: Extend research with app-store category rankings and additional competitor fetches if needed.
    relatedQuestionRefs:
      - QP001
      - QP025
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: trust-threat
    missingEvidence: >-
      Comparable third-party review snapshots for Dave, Brigit, MoneyLion, Albert, and Rocket Money using the same
      review surface.
    whyItMatters: Without normalized review evidence, Cleo’s customer-friction profile cannot be benchmarked cleanly against peers.
    diligencePath: Fetch Trustpilot, app-store, or BBB equivalents for the closest rivals.
    relatedQuestionRefs:
      - QP016
      - QP017
  - type: conflicting-data
    severity: minor
    topic: pricing-position
    missingEvidence: Realized pricing, fee incidence, and average revenue per active user across competitors.
    whyItMatters: List pricing and marketing copy do not reveal actual monetization or elasticity.
    diligencePath: Use public filings or management data to normalize realized revenue per user and fee attachment.
    relatedQuestionRefs:
      - QP008
      - QP009
  - type: private-evidence-only
