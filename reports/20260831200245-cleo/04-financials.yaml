- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 customer acquisition cost
    - $11
    - Medium
    - Suggests efficient top-of-funnel for a consumer app
    - Break CAC by channel, paid vs organic, and by segment
  - - Payback period
    - 3 months
    - Medium
    - Indicates fast recoupment of acquisition spend if sustained
    - Confirm whether this is blended, marginal, or a specific cohort
  - - Gross margin
    - 60% in 2024
    - Medium
    - Supports software-like economics despite fintech rails exposure
    - Disclose margin by subscription, card, advance, and savings streams
  - - EBITDA margin
    - 8.4% in 2024
    - Medium
    - Shows progress from growth to profitability
    - Provide 2025 monthly margin bridge and one-off adjustments
  - - Operating cost / revenue
    - 0.58 in 2024
    - Medium
    - Signals operating leverage
    - Clarify which costs are included and whether support/compliance scale linearly
  - - 12-month conversion to paying subscribers
    - 1.1M paying subscribers visible; exact rate not disclosed
    - Low
    - Important for ARPU and LTV math
    - Provide registered-user denominator and cohort conversion rate
  - - Credit losses / delinquency
    - 'null'
    - Low
    - Critical for cash-advance and card economics
    - Disclose delinquency, charge-off, fraud, and reserve metrics
  - - Net revenue retention / payer retention
    - 'null'
    - Low
    - Needed to judge durability of subscription base
    - Provide cohort churn, renewals, and upsell by tier
  notes: Table separates real published metrics from the missing underwriting metrics investors still need.
  claimRefs:
