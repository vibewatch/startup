  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-gap
    missingEvidence: Current cash balance, monthly burn, and base / downside runway.
    whyItMatters: Without balance-sheet liquidity, profitability claims cannot be translated into capital adequacy.
    diligencePath: Request latest management accounts, monthly cash bridge, and treasury forecast.
    relatedQuestionRefs:
    - QI012
    - QI013
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: underwriting-gap
    missingEvidence: Advance losses, fraud losses, reserve policy, and delinquency metrics.
    whyItMatters: These metrics determine whether apparent margin quality survives credit and fraud stress.
    diligencePath: Obtain underwriting pack and monthly loss curves by product cohort.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: advance-fees
    missingEvidence: Unified current express-fee schedule across pricing page, terms, and app stores.
    whyItMatters: Fee inconsistencies weaken precision on transaction-fee yield.
    diligencePath: Request current fee matrix and effective dates by product surface.
    relatedQuestionRefs:
    - QI001
    - QI019
  - type: private-evidence-only
    severity: material
    topic: subscriber-scale
    missingEvidence: Cohort conversion, payer churn, and NRR-style retention by plan.
    whyItMatters: Subscriber count alone does not reveal durability or quality of recurring revenue.
    diligencePath: Review cohort dashboards for Plus, Pro, Builder, and AI Pro.
    relatedQuestionRefs:
    - QI005
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: Convertible note terms and debt-facility covenant package.
    whyItMatters: Capital structure economics affect late-stage entry pricing and downside outcomes.
    diligencePath: Request financing docs or investor deck appendix covering debt and note terms.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Current ARR split across subscriptions, interchange, transaction fees, and other income.
    whyItMatters: Public sources confirm diversification but do not show which stream truly drives margin and growth.
    diligencePath: Request stream-level revenue bridge for 2024, 2025, and current run-rate.
    relatedQuestionRefs:
    - QI003
    - QI019
    relatedTableRefs:
    - TI001
    - TI005
