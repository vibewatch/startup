    - List customer yield, variable
    - Spread and balance economics undisclosed
    - Save page and pricing page
  - - No-interest advance with optional fee
    - List product framing
    - Economic yield depends on express-fee uptake and repeat use
    - Advance FAQ and terms
  notes: List pricing does not reveal realized revenue, fee incidence, or partner-revenue sharing.
