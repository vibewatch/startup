- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Current status
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Cash on hand
    - Not publicly disclosed
    - No reviewed source gave a current cash balance
    - Runway cannot be underwritten from public data
    - Request monthly cash balance and minimum operating liquidity
  - - Monthly burn
    - Not publicly disclosed
    - No reviewed source disclosed net cash burn
    - Profitability claim does not replace cash-flow detail
    - Request burn bridge including working-capital swings
  - - Runway months
    - Not publicly disclosed
    - Cannot derive without cash and burn
    - Financing urgency remains uncertain
    - Request base and stress-case runway models
  - - Debt facility
    - $60M raised
    - Annual report page
    - Provides non-equity financing support but may carry covenants
    - Request lender, collateral, and covenant package
  - - March 2025 convertible note
    - $38.8M disclosed
    - Redbus reporting on annual results
    - Adds capital but also creates overhang and maturity questions
    - Request cap, discount, maturity, and investor participation
  - - Funding need for advance / card products
    - Present but opaque
    - Product and pricing pages show funding-linked features
    - Working capital and credit exposure matter alongside software margins
    - Disclose reserve funding and partner-capital model
  - - Next-round trigger
    - Unclear
    - City AM implies additional round talk and IPO optionality but no filed path
    - Capital strategy still relevant despite profitability narrative
    - Request internal plan for debt, equity, and liquidity buffers
  notes: Historical funding chronology lives in Company Overview; this table focuses on forward adequacy and missing balance-sheet detail.
  claimRefs:
  - CI021
  - CI022
  - CI024
  - CI025
  - CI026
  - CI037
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Cash balance and unrestricted liquidity
    - Cannot assess runway or downside resilience
    - Obtain current balance sheet and monthly cash waterfall
  - - Advance losses, repayment delinquency, and fraud
    - Cannot price credit or liquidity risk in revenue streams
    - Review underwriting deck and 12-month credit-performance tables
  - - Payer churn and subscriber retention by tier
    - Cannot validate LTV or revenue durability
    - Request cohort retention by Plus, Pro, Builder, and AI Pro
  - - Direct-deposit penetration and attach rate
    - Cannot judge quality of higher-value users or underwriting base
    - Request monthly active direct-deposit users and conversion funnel
  - - Partner economics and revenue share
    - Cannot translate gross revenue into contribution margin
    - Review agreements with Thread Bank, WebBank, and processors
  - - Current ARR composition by stream
    - Cannot tell whether current scale is subscription-heavy or fee-heavy
    - Obtain management revenue mix split for subscriptions, transaction fees, interchange, and other
  - - Reserve policy and covenants
    - Cannot stress-test capital adequacy
    - Request debt facility documents and board-approved reserve framework
  notes: These gaps are the minimum packet needed to move from encouraging public story to investable financial model.
