- id: traction-and-unit-economics
  title: Public traction looks strong and unit economics appear promising, but not fully open-book
  body: 'Cleo’s public traction is strong enough to make the financial case credible. The 2024 annual-report page says revenue nearly doubled to $136 million, exit run-rate reached $186 million, EBITDA margin reached 8.4%, and net income turned positive from August 2024 onward. The company page then extends that trajectory by saying Cleo surpassed $300 million in ARR and reached 1.1 million paying subscribers, while BusinessCloud quotes the founder saying the business had hit $280 million ARR and profitability. Even allowing for company-claim versus independent-reporting differences, all three sources point in the same direction: Cleo appears to have crossed from venture-funded growth story into a business with meaningful recurring scale. The most encouraging unit-economics signals are the annual report’s disclosed $11 customer acquisition cost, three-month payback period, and 60% gross margin in 2024. Those are unusually attractive surface metrics for a consumer fintech. Still, public disclosure
    stops short of showing contribution margin by product, payer churn by tier, fraud losses, or net credit losses on advance-related activity. The result is a financial picture that is directionally positive and partially corroborated, but not yet robust enough to underwrite purely from published data.'
  claimRefs:
