tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Subscriptions
    - Monthly paid tiers for Plus, Pro, Builder, and mobile bundles
    - Subscriber / month
    - Core recurring revenue stream; 1.1M paying subscribers claimed on company page
    - Higher-quality recurring revenue
    - What is active paid churn and realized ARPU by plan?
  - - Cash-advance express fees
    - Optional same-day transfer fee on eligible advances
    - Advance event
    - Express fee ranges from $4.49 to $14.99
    - Usage-linked and potentially volatile
    - What share of advances pay express fees and what is take rate net of losses?
  - - Cash-advance access / engagement
    - Paid tiers make access easier, but advance can also be requested without subscription
    - Eligible user / month
    - Supports tier value and engagement loop
    - Mixed quality because tied to consumer stress behavior
    - How much of subscription conversion is driven by advance utility?
  - - Card interchange / transaction fees
    - Cleo Card spend and related transaction activity
    - Card spend / transaction volume
    - Redbus says transaction fees nearly tripled in 2024; annual report shows +271% YoY card spend
    - Volume-driven and potentially scalable
    - What is gross profit per active cardholder after partner and fraud costs?
  - - Savings economics
    - Deposit-linked savings with 2.75% APY and program-bank structure
    - Deposits / spread / retention
    - Supports monetization and retention but exact economics undisclosed
    - Potentially sticky but opaque
    - What is deposit balance, spread capture, and cost of funds?
  - - Future AI / action monetization
    - Autopilot and AI Pro tiers may support higher-value upsell
    - Subscriber / feature adoption
    - AI Pro described as fastest-growing tier in Sep 2025
    - Promising but not separately disclosed
    - How much ARR is now attributable to AI Pro or Autopilot-linked conversion?
  notes: Revenue quality improves as income shifts toward recurring subscriptions and durable deposits rather than crisis-driven transactions alone.
