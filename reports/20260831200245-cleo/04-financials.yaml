- id: capital-adequacy-and-financing-dependency
  title: Cleo has added financing support, but cash durability remains opaque
  body: 'Forward capital adequacy is the most important unresolved financial question. Public evidence confirms that Cleo raised a $60 million debt facility and disclosed a $38.8 million March 2025 convertible loan note from existing investors. Those steps likely gave management room to fund product growth, card expansion, and cash-advance exposure without immediately pursuing a large priced equity round. They also imply that financing structure matters: a company offering cash advances, secured-card pathways, and savings products needs funding partners and risk controls, not just software gross margin. The pricing and FAQ material shows that higher advance amounts depend on direct deposit and ongoing eligibility checks, which suggests underwriting and funding economics are linked to payroll-like signals and user cash-flow quality. But the core balance-sheet questions remain unanswered in public: no reviewed source disclosed cash on hand, monthly burn, statutory capital buffers, delinquency
    rates, reserve policy, warehouse covenants, or runway. That missing balance-sheet detail is what separates a promising consumer-fintech P&L from a truly underwritable one.'
  claimRefs:
  - CI013
  - CI021
  - CI022
  - CI024
  - CI025
  - CI026
  - CI037
  - CI038
  - CI039
