  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-detail
    missingEvidence: Exact headcount by office, function, and contractor mix for London, New York, and San Francisco.
    whyItMatters: Operational leverage and talent concentration cannot be assessed precisely from the public 500+ headline alone.
    diligencePath: Request current org chart, employee census, and office-by-office headcount from management.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Current cap table, ownership percentages, preference stack, and the terms of the March 2025 convertible loan notes.
    whyItMatters: Entry-price discipline and downside protection cannot be judged credibly without knowing dilution and liquidation preferences.
    diligencePath: Obtain the latest cap table, note documents, and board approvals from the company or lead investor.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: audited-2025-financials
    missingEvidence: Audited or filed full-year 2025 accounts tying ARR claims to statutory revenue, margins, and cash flow.
    whyItMatters: Current growth and profitability narratives rely on management pages and media reporting rather than published audited statements.
    diligencePath: Check whether 31 December 2025 accounts are filed after the Companies House due date, or request investor reporting directly.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: minor
    topic: uk-gtm-scope
    missingEvidence: Precise UK user numbers and monetization rollout plan after the UK return.
    whyItMatters: UK relaunch optionality is part of the founder narrative, but current commercial significance cannot be measured.
    diligencePath: Ask management for UK MAU, retention, and monetization milestones by quarter.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: board-governance-gaps
    missingEvidence: Committee structure, director remits, and independence standards for the current Cleo board.
    whyItMatters: Founder concentration is easier to evaluate when the oversight structure and committee coverage are visible.
    diligencePath: Request the latest board deck, committee charters, and board-observer rights from management or the lead investor.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: milestone-coverage-gaps
    missingEvidence: Day-level dates and additional private milestones for governance, commercial launches, and international relaunch execution.
    whyItMatters: The public chronology is sufficient for orientation but not for underwriting execution cadence or hidden delays.
    diligencePath: Request a board-approved milestone history and the internal launch calendar covering 2024-2026.
    relatedQuestionRefs:
    - QO016
    - QO020
    - QO021
    relatedTableRefs:
