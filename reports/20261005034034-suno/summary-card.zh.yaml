  topStrengths:
    - 付费订阅用户规模大且增长快，据报道 ARR 已达 $300 million。
    - 2026 年 6 月刚完成 Series D 融资，机构投资者阵容深厚。
    - Warner 和解后转向授权模型，并拓展商业合作。
  topRisks:
    - 诉讼仍在进行、权利谈判尚未结束，版权和授权风险依然存在。
    - 单位经济模型不透明，尤其是毛利率、GPU 算力消耗和版税负担。
    - 高度依赖消费订阅的新鲜感，以及免费层持续转付费。
    - 盈利能力、留存和退出路径都尚未验证，当前估值却已偏高。
  unresolvedGaps:
    - Warner 和解及后续唱片公司交易之后，确切的毛利率、现金消耗、资金可支撑期限、法律准备金和授权付款结构。
    - 2025 年 11 月 Warner 和解后，Sony、UMG、Koda、GEMA 以及任何艺人诉讼中剩余原告和司法辖区组合能否彻底厘清。
    - 转向授权模型、设置下载上限并实行仅付费用户可下载后，各 cohort 的留存、流失和付费用户行为。
    - 消费订阅、合作伙伴渠道以及任何企业或 API 产品之间的收入构成，以及按 cohort 划分的客户集中度。
    - 董事会构成、投资者保护、后续轮次条款，以及更完整的管理层梯队成熟度。
