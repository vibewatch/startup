company:
  name: "Suno"
chapter:
  number: 7
  title: "Risks"
  summary: "Suno confronts severe legal, copyright, regulatory, cybersecurity, operational, and customer concentration risks. While its landmark settlement with Warner Music Group in late 2025 established a precedent for licensed model transitions, active litigation with Universal Music Group, Sony Music, European societies, and a consolidated 55-million-user data breach class action threaten operating margins and capital reserves."
sections:
  - id: "legal-and-copyright-exposure"
    title: "Copyright Litigation and Intellectual Property Exposure"
    body: "Suno's most acute existential vulnerability remains intellectual property infringement litigation surrounding its model training corpus. In June 2024, the Recording Industry Association of America (RIAA), representing major labels, filed copyright infringement lawsuits alleging unauthorized training on protected sound recordings. Although Warner Music Group settled in November 2025 and agreed to collaborate on licensed models, Universal Music Group and Sony Music Entertainment remain active plaintiffs in federal court. Furthermore, European collecting societies including Denmark's Koda and Germany's GEMA have initiated legal challenges, creating jurisdictional fragmentation. The lack of statutory copyright protection for purely AI-generated outputs under U.S. Copyright Office doctrine further constrains enterprise and sync licensing monetization."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "cybersecurity-operational-and-compute-risks"
    title: "Cybersecurity, Infrastructure Reliability, and Compute Cost Sensitivity"
    body: "Operational fragility is underscored by acute cybersecurity liabilities and massive compute cost structures. In August 2026, a federal judge in Massachusetts consolidated two class action lawsuits against Suno arising from a November 2025 data breach that compromised sensitive information belonging to approximately 55 million users. The breach remained undisclosed to victims for nine months until July 2026, exposing the firm to statutory liabilities, negligence claims, and operational distraction. Concurrently, compute and GPU infrastructure represent Suno's largest operating expenditure, creating severe sensitivity to GPU hardware supply constraints, hosting pricing volatility, and gross margin compression as higher-fidelity audio models scale."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR002"
  - id: "partner-customer-and-business-model-dependencies"
    title: "Partner Dependencies, Platform Restrictions, and Model Risk"
    body: "Suno faces significant partner and revenue concentration risks. Despite amassing $300 million in ARR and over 2 million paid subscribers as of February 2026, the company's revenue base is heavily weighted toward consumer subscriptions exposed to churn, novelty fatigue, and macro weakness. To appease label partners and prevent abusive distribution, Suno introduced download restrictions and monthly download caps in September 2026, while deprecating legacy models in favor of licensed v6 architectures. Licensing royalty payouts to major labels and platform changes could materially erode gross margins and trigger subscriber attrition toward competing foundation models from Google, Udio, or ElevenLabs."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR003"
