evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing gross profit margins, GPU compute hosting expenditures, and label licensing
      royalty schedules.
    whyItMatters: >-
      Without audited cost of goods sold, it is impossible to evaluate whether Suno's $300M ARR generates positive unit
      contribution margins or is consumed by inference compute and label revenue splits.
    diligencePath: >-
      Request confidential disclosure of GAAP income statements, cloud compute contracts, and Warner/BMG master
      licensing royalty schedules under non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: investor-syndicate-and-cap-table
    missingEvidence: >-
      Fully diluted capitalization table detailing exact institutional equity ownership percentages, liquidation
      preferences, and secondary transaction discounts.
    whyItMatters: >-
      While major institutional leads across Series A through Series D are public, specific share allocations, founder
      dilution, and liquidation preference seniority across preferred classes remain undisclosed.
    diligencePath: >-
      Request confidential disclosure of the full capitalization table, stock purchase agreements, and investor rights
      agreements in management diligence sessions.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      Reconciliation of total full-time headcount between company self-reported figures (250+ across 4 offices) and
      external workforce tracking databases (328 employees).
    whyItMatters: >-
      Headcount discrepancy affects estimates of annual payroll run rate, operating burn, and revenue per employee
      calculations.
    diligencePath: >-
      Verify official employee directory census and recent LinkedIn talent additions during management diligence
      sessions.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: enterprise-contract-breakdown
    missingEvidence: >-
      Granular breakdown of enterprise contract values, API volume pricing, and revenue share agreements for platform
      deployments such as Microsoft Copilot.
    whyItMatters: >-
      Direct enterprise contract metrics determine whether Suno can diversify revenue away from volatile consumer
      monthly subscriptions toward predictable B2B ARR.
    diligencePath: >-
      Review future enterprise partnership announcements, SEC Form S-1 disclosures if pursuing an IPO, or audited
      commercial partner filings.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: licensing-royalty-impact
    missingEvidence: >-
      Exact royalty payout percentages and revenue-sharing mechanisms established under the Warner Music Group
      settlement and future label agreements.
    whyItMatters: >-
      Content licensing fees will directly compress Suno's software gross margins, potentially reducing long-term SaaS
      profitability.
    diligencePath: >-
      Examine public disclosures from major music publishers (WMG quarterly earnings) and court filings in ongoing
      Sony/UMG litigation.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Private gross margin data, inference compute costs per generated minute, and label royalty revenue-share terms for
      direct peer Udio.
    whyItMatters: >-
      Without peer margin disclosures, evaluating whether Suno pricing model is structurally defensible against
      well-capitalized foundation competitors remains uncertain.
    diligencePath: >-
      Request confidential investor data room materials, partner royalty schedules, and cloud GPU cost attribution
      breakdowns during formal diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-reconciliation
    missingEvidence: >-
      Audited financial breakdown of GAAP gross margins, segregating hosting/compute GPU expenses from music label
      licensing distributions.
    whyItMatters: >-
      Essential for determining whether Suno's unit economics resemble high-margin enterprise software (70-80% gross
      margin) or low-margin streaming distribution (20-35% gross margin).
    diligencePath: Request audited income statement and management COGS schedule during confirmatory private diligence.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: >-
      Granular cohort-level paid subscriber retention data, net revenue retention (NRR), and monthly subscriber churn
      rates following WMG download restrictions.
    whyItMatters: >-
      High subscriber churn would degrade customer lifetime value (LTV) and necessitate continuous high customer
      acquisition spend to maintain $300M+ ARR.
    diligencePath: Inspect historical monthly subscriber retention cohorts and billings telemetry.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: blocking
    topic: litigation-contingency-reserves
    missingEvidence: >-
      Actuarial litigation reserve assessment and settlement terms under discussion with Universal Music Group and Sony
      Music Entertainment.
    whyItMatters: >-
      With statutory damages claims exceeding $9 billion against $775 million in cumulative raised capital, an adverse
      court judgment would exceed Suno's cash reserves.
    diligencePath: >-
      Obtain formal litigation risk audit letter from Suno's defense counsel assessing probability and range of
      financial settlement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: model-architecture-and-compute-costs
