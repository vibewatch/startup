    claimRefs: ["CV001", "CV003", "CV004", "CV007", "CV014"]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Side", "Argument", "Evidence signal", "What would change the view"]
    rows:
      - ["Thesis", "Subscription scale", "2M paid subscribers and $300M ARR were reported in February 2026.", "Cohort retention and audited ARR reconciliation would strengthen the thesis."]
      - ["Thesis", "Financing access", "$400M Series D and $775M cumulative funding were reported in 2026.", "A cash bridge showing runway after legal and licensing reserves would make the financing signal decision-useful."]
      - ["Thesis", "Private-market momentum", "The June 2026 mark was about 2.2x the November 2025 post-money valuation.", "Sustained ARR growth without multiple expansion would improve entry discipline."]
      - ["Anti-thesis", "Copyright and licensing exposure", "Warner settled, while UMG and Sony remained in active litigation in June 2026 reporting.", "Comprehensive settlements with quantified recurring licensing economics would reduce the overhang."]
      - ["Anti-thesis", "Cost structure opacity", "Reported planned allocation to compute and data suggests material infrastructure and input costs, but margins are undisclosed.", "Gross-margin, inference-cost, and contribution-margin cohorts would resolve the concern."]
      - ["Anti-thesis", "Terms and liquidity opacity", "Public sources do not disclose Series D preferences, dilution, secondary terms, or an exit timetable.", "Cap-table, preference waterfall, governance documents, and board-approved liquidity planning are required."]
    notes: "Evidence signals use reported ARR, subscriber, financing, and legal-status data; requested private metrics are gaps, not assumptions about actual performance."
    claimRefs: ["CV002", "CV003", "CV005", "CV007", "CV009", "CV010", "CV013", "CV015"]
  - id: "TV003"
    title: "Bull, base, and bear valuation sensitivity"
    columns: ["Case", "Assumptions", "Illustrative multiple", "Illustrative valuation range", "Probability signal and downside trigger"]
    rows:
      - ["Bull", "Reported $300M ARR compounds with durable retention; licensing economics become predictable; remaining litigation resolves without material operating constraint.", "18x-24x ARR", "$5.4B-$7.2B", "Positive signal: verified acceleration with stable margins. Trigger out: licensing or compute costs prevent operating leverage."]
      - ["Base", "Reported ARR is sustained, but margin, retention, and legal-reserve evidence remains incomplete; market accepts a premium private AI multiple.", "14x-18x ARR", "$4.2B-$5.4B", "Mixed signal: current mark is the top of the band. Trigger down: growth decelerates before unit economics are proven."]
      - ["Bear", "Growth slows, multiples compress, or unresolved litigation and licensing costs impair economics or distribution.", "8x-12x ARR", "$2.4B-$3.6B", "Negative signal: down round, adverse legal outcome, or weak cohort economics. This band implies material downside to the June 2026 mark."]
    notes: "Illustrative ranges equal the reported $300M ARR anchor multiplied by scenario assumptions; they are analyst sensitivities, not forecasts, transaction indications, or audited enterprise values. Comparator businesses and metric bases are not fully comparable."
    claimRefs: ["CV003", "CV004", "CV007", "CV011", "CV012", "CV015"]
