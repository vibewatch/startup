chapter:
  number: 8
  title: "Valuation"
  summary: "Suno's reported $5.4 billion June 2026 Series D valuation equates to about 18x the reported $300 million ARR anchor, while retained public evidence does not establish margins, retention, cash burn, financing preferences, or the cost of resolving remaining litigation. The resulting view is track/research more, with high risk and a stretched valuation stance pending private diligence or a materially lower entry price."
sections:
  - id: "recommendation-and-current-mark"
    title: "Recommendation and current mark"
    body: >-
      The recommendation is track/research more, with medium confidence, high risk, and a stretched valuation stance. Suno reportedly raised $400 million at a $5.4 billion valuation in June 2026, after a $250 million Series C at a $2.45 billion post-money valuation in November 2025. The later mark is about 2.2x the earlier one, and the reported $300 million ARR anchor implies roughly 18x ARR. That is meaningful commercial proof, but ARR is not accounting revenue, funding raised is not cash available, and neither figure establishes gross margin, burn, retention, or preference overhang. Public evidence therefore supports continued diligence, not an unconditional price endorsement.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005", "CV013", "CV014"]
    tableRefs: ["TV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The thesis is that Suno has paired unusual consumer subscription scale with rapid private-market repricing: independent reports cite two million paid subscribers and $300 million ARR, while multiple sources corroborate $775 million of cumulative funding. The anti-thesis is equally material. Warner settled and licensed, but Variety reported that UMG and Sony remained in active litigation as of June 2026. Music Ally also reported that a contemplated raise would direct large shares to compute and data, highlighting a potentially costly operating model rather than proving durable margins. The retained evidence contains no cohort retention, churn, gross-margin, cash-burn, runway, or preference data.
    claimRefs: ["CV003", "CV005", "CV007", "CV009", "CV010", "CV013", "CV015"]
    tableRefs: ["TV002"]
  - id: "scenario-and-comparable-context"
    title: "Scenario and comparable context"
    body: >-
      The scenario framework holds the reported $300 million ARR constant and varies the multiple; it is an analytical sensitivity, not a forecast or a quoted secondary-market price. An 8x-12x bear band implies $2.4-$3.6 billion, a 14x-18x base band implies $4.2-$5.4 billion, and an 18x-24x bull band implies $5.4-$7.2 billion. Multiples.vc lists private-company reference points including Higgsfield at 13.5x and Runway at 17.7x, while its public set spans materially lower values such as Presight AI at 5.4x. These are directional references only: business mix, maturity, profitability, and metric definitions differ, so they do not independently validate Suno's price.
    claimRefs: ["CV003", "CV004", "CV011", "CV012", "CV015"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-decision-triggers"
    title: "Exit readiness and decision triggers"
    body: >-
      Exit readiness is not established by the public record. The latest financing and subscriber scale may support future liquidity, but the retained sources do not disclose audited financials, board composition, liquidation preferences, secondary-transfer terms, or a credible IPO timetable. A positive decision would require cohort-level retention, gross-margin and inference-cost evidence, a reconciled cash and legal-reserve schedule, the Series D capitalization table and preferences, and a quantified path for remaining label disputes. The thesis breaks if ARR growth stalls while compute, data, or licensing costs keep margins structurally weak, if unresolved litigation produces material damages or distribution constraints, or if a future round resets the mark below the June 2026 valuation.
    claimRefs: ["CV005", "CV007", "CV009", "CV010", "CV013", "CV015", "CV016"]
    figureRefs: ["FV001"]
