    title: "Recommendation summary"
    columns: ["Recommendation", "Confidence", "Risk rating", "Valuation stance", "Decision implication"]
    rows:
      - ["Track / research more", "Medium", "High", "Stretched", "Do not underwrite the $5.4B mark without private unit-economics, legal-reserve, and financing-term diligence; revisit at a lower price or after evidence improves."]
