      - number: '4.2'
        title: Unit Economics, GPU Compute Burn, and Licensing Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Suno's unit economics requires untangling heavy computational infrastructure costs from
              emerging music rights-holder distributions. Public research profiles indicate that Suno's primary
              operating expense is cloud GPU compute for training generative audio architectures and serving inference
              across an estimated 7 million generated tracks daily. Analysts at Sacra note that Suno's GPU compute
              expenditures exceed its payroll costs by several multiples, creating an operating profile distinct from
              traditional asset-light software businesses. On the content cost side, Suno transitioned toward licensed
              foundation models in September 2026 with its v6 release, trained on licensed catalogs from partners
              including Warner Music Group, BMG Rights Management, and Believe. While these agreements protect
              enterprise continuity, rightsholder partners receive revenue shares that inevitably constrain long-term
              gross margin potential. Furthermore, unresolved federal litigation in Massachusetts with Universal Music
              Group and Sony Music Entertainment presents potential statutory damages of up to $150,000 per infringed
              work, representing an existential multi-billion-dollar contingent liability that clouds formal margin
              underwriting.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
