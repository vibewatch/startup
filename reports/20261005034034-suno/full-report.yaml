      - number: '1.3'
        title: Capitalization Trajectory, Valuation Expansion, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Suno has secured over $775 million in cumulative equity financing across four institutional investment
              rounds, escalating from a seed-stage project into a multi-billion dollar private growth leader. The
              company completed a $125 million Series B in May 2024 at a $500 million valuation led by Lightspeed
              Venture Partners, followed by a $250 million Series C in November 2025 at a $2.45 billion valuation led by
              Menlo Ventures with participation from NVIDIA's NVentures, Lightspeed, Matrix Partners, and Hallwood
              Media. In June 2026, Suno closed a $400 million Series D financing round led by Bond Capital that
              established a post-money valuation of $5.4 billion, pricing equity at an estimated 18.0x revenue multiple
              on annualized revenue run rates. The Series D syndicate included new and existing institutional
              participants such as IVP, Forerunner Ventures, Union Square Ventures, Alkeon Capital Management, Quiet
              Capital, and Schroders Capital, alongside angel backing from prominent technology executives. While
              institutional venture backing provides substantial liquidity, exact capitalization table allocations,
              liquidation preferences, and secondary transaction discounts remain undisclosed in private company
              filings.
            claimRefs:
