      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergence Between Commercial Velocity and Unresolved Copyright Liabilities
            body: >-
              Suno has demonstrated unprecedented revenue scaling for a consumer generative AI platform, accelerating
              from sub-$1 million ARR in 2023 to $300 million ARR by early 2026 with over 2 million paying subscribers.
              However, this growth was achieved while litigating existential copyright infringement claims filed by the
              world's largest music publishers. While Suno's settlement with Warner Music Group and the September 2026
              release of its licensed Suno v6 model prove a viable path toward industry coexistence, outstanding
              litigation from Sony Music Entertainment and Universal Music Group leaves residual legal damages and
              catalog injunction risks active.
            calloutType: insight
            claimRefs:
              - CO004
              - CO008
              - CO012
              - CO013
              - CO014
          - type: callout
            title: Governance Opaqueness and Unit Economic Diligence Gaps
            body: >-
              Despite raising $775 million and attaining a $5.4 billion valuation, Suno operates as a tightly held
              private corporation with minimal public disclosures regarding its gross margins, server compute expenses,
              and music licensing royalty obligations. Investors must treat reported revenue figures as unaudited
              management claims. Key diligence priorities include verifying net revenue retention across mature consumer
              cohorts, auditing the margin drag imposed by revenue-sharing agreements with record labels, and evaluating
              key-person dependency on the founding research team.
            calloutType: risk
