  - id: FI001
    title: Suno Monetization Funnel and Capital Conversion Flow
    type: flow
    summary: >-
      Structural flow illustrating user acquisition, free tier gating, subscription conversion, cost deductions, and
      capital reinvestment.
    data:
      nodes:
        - label: Registered User Base (100M+ Accounts)
          detail: Massive organic top-of-funnel acquisition via web and mobile apps
        - label: Free Tier Engagement (10 Songs/Day, ~50% Hit Daily Limit)
          detail: Free daily allowances create viral adoption while gating full utility
        - label: Paid Conversion (~2% Conversion Rate; 2M+ Paid Subscribers)
          detail: High-intent creators convert to unlock commercial rights and downloads
        - label: Gross Subscription Run-Rate ($300M+ ARR via Pro & Premier Tiers)
          detail: Fast compounding recurring revenues across $10/mo and $30/mo price points
        - label: Direct Operational Deductions (GPU Compute & Label Royalties)
          detail: Heavy continuous compute inference costs and emerging content rev-shares
        - label: Net Operating Cash Flow & Reinvestment (R&D, Studio & Series D Reserve)
          detail: Capital reinvested into custom models, Suno Studio, and corporate runway
    approximationNotes: >-
      Conversion rates and subscriber totals reflect reported milestones from Sacra, TechCrunch, and executive
      statements.
