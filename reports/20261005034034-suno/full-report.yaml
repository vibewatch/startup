      - number: '2.2'
        title: Market Sizing Across Multiple Analytical Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Suno's addressable opportunity requires distinct analytical lenses rather than a single
              speculative figure. From a broad macroeconomic perspective, the global digital music and creator software
              landscape spans several tens of billions of dollars across consumer streaming, licensing, and professional
              audio software. A more constrained serviceable addressable market (SAM) focuses on stock and production
              music alongside audio creation tools, where annual spend represents a multi-billion dollar opportunity.
              Within this serviceable territory, the serviceable obtainable market (SOM) is defined by paid generative
              AI music subscriptions and commercial creator licenses. Suno's verified $300 million in annual recurring
              revenue and 2 million paid subscribers demonstrate that generative audio has already captured a meaningful
              share of modern creator budgets. However, expanding beyond this beachhead depends on whether enterprise
              and media platforms can license generated assets without ongoing copyright exposure or downstream
              chain-of-title defects.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
