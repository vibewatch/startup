  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Thesis
        - Subscription scale
        - 2M paid subscribers and $300M ARR were reported in February 2026.
        - Cohort retention and audited ARR reconciliation would strengthen the thesis.
      - - Thesis
        - Financing access
        - $400M Series D and $775M cumulative funding were reported in 2026.
        - >-
          A cash bridge showing runway after legal and licensing reserves would make the financing signal
          decision-useful.
      - - Thesis
        - Private-market momentum
        - The June 2026 mark was about 2.2x the November 2025 post-money valuation.
        - Sustained ARR growth without multiple expansion would improve entry discipline.
      - - Anti-thesis
        - Copyright and licensing exposure
        - Warner settled, while UMG and Sony remained in active litigation in June 2026 reporting.
        - Comprehensive settlements with quantified recurring licensing economics would reduce the overhang.
      - - Anti-thesis
        - Cost structure opacity
        - >-
          Reported planned allocation to compute and data suggests material infrastructure and input costs, but margins
          are undisclosed.
        - Gross-margin, inference-cost, and contribution-margin cohorts would resolve the concern.
      - - Anti-thesis
        - Terms and liquidity opacity
        - Public sources do not disclose Series D preferences, dilution, secondary terms, or an exit timetable.
        - Cap-table, preference waterfall, governance documents, and board-approved liquidity planning are required.
    notes: >-
      Evidence signals use reported ARR, subscriber, financing, and legal-status data; requested private metrics are
      gaps, not assumptions about actual performance.
