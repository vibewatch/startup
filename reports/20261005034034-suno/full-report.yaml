chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Operating Mission
        blocks:
          - type: paragraph
            body: >-
              Suno Inc. was founded in 2022 by Mikey Shulman, Georg Kucsko, Martin Camacho, and Keenan Freyberg in
              Cambridge, Massachusetts, operating out of corporate headquarters at 17 Dunster Street with additional
              regional offices across New York, Los Angeles, and San Francisco. The founding team met at machine
              learning infrastructure provider Kensho, bringing specialized expertise in neural audio architectures,
              natural language processing, and high-throughput model inference. Suno's consumer-facing web and mobile
              applications enable users to generate complete audio compositions—including multi-genre instrumentation,
              lyric generation, synthesized vocals, and full arrangement stems—directly from conversational text
              prompts. While early traction centered on consumer virality and casual creator experimentation, Suno
              expanded into professional creator tooling through its Suno Studio digital audio workstation (DAW), which
              was augmented by its acquisition of browser DAW platform WavTool and concert discovery service Songkick.
              As of 2026, Suno reports more than 100 million registered creator accounts and maintains a
              multidisciplinary workforce of over 250 employees across four primary offices.
