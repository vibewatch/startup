      - number: '1.4'
        title: Commercial Scale, Legal Headwinds, and Model Governance Milestones
        blocks:
          - type: paragraph
            body: >-
              Suno's commercial expansion has been paired with acute legal exposure and regulatory scrutiny regarding
              generative AI training methodologies. In February 2026, CEO Mikey Shulman publicly confirmed that Suno had
              surpassed 2 million paid subscribers across its subscription tiers, generating approximately $300 million
              in annual recurring revenue compared to $200 million reported in late 2025 and $45 million in mid-2024.
              However, the company faced sweeping federal copyright lawsuits filed in 2024 by major record labels
              including Warner Music Group, Universal Music Group, and Sony Music Entertainment, alleging unlicensed
              ingestion of recorded music catalogs for training data. In late 2025, Suno concluded a landmark settlement
              and commercial licensing alliance with Warner Music Group, which included the acquisition of WMG's live
              event discovery entity Songkick. In September 2026, Suno launched its licensed Suno v6 model
              family—developed with licensed data from Warner Music Group, BMG, and Believe—expressly retiring
              unverified models and implementing watermarking and export caps, even as unresolved litigation continues
              with Sony Music, Universal Music Group, and independent artist groups.
            claimRefs:
              - CO004
              - CO008
              - CO012
              - CO013
              - CO014
              - CO015
