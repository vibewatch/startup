      - CI005
      - CI006
      - CI007
      - CI011
      - CI015
  - id: FE001
    title: Product Architecture and Technology Stack
    type: stack
    summary: >-
      Six-tier architectural stack illustrating Suno's user interface surfaces, generative workflow orchestration,
      foundation model inference, cloud infrastructure, and partner distribution layers.
    data:
      layers:
        - label: Presentation Layer
          detail: >-
            Responsive web client on desktop and mobile, native consumer mobile applications, and high-fidelity Suno
            Studio workspace for power creators.
          modules:
            - Web Application
            - Mobile App (iOS/Android)
            - Suno Studio UI
        - label: Workflow & Creative Control Layer
          detail: >-
            Natural language prompt interpretation, lyric parsing, genre/mood styling, audio upload ingestion, and
            multi-track stem separation controls.
          modules:
            - Prompt Parser
            - Lyrics Generator
            - Stem Separation Engine
            - Audio Extender / Remix Pipeline
        - label: Model Orchestration Layer
          detail: >-
            Chained inference sequences, function routing, asynchronous generation queues, and multi-model version
            routing (v4, v4.5, v5 beta).
          modules:
            - Model Version Router
            - Async Job Queue
            - Python Workflow Chaining
            - HTTP Ingress Endpoints
        - label: Generative Audio Foundation Layer
          detail: >-
            Proprietary deep learning music generation models producing multi-instrument audio, synthesized vocals, and
            structural song arrangements.
          modules:
            - Vocal Synthesis Model
            - Instrumental Accompaniment Network
            - Audio Diffusion / Transformer Engine
        - label: Infrastructure & Compute Layer
          detail: >-
            Serverless infrastructure on Modal scaling dynamically across thousands of cloud GPUs, eliminating cluster
            management and fixed reservations.
          modules:
            - Modal Serverless Compute
            - Dynamic GPU Auto-scaler
            - Batch Pre-processing Workers
            - Cloud Storage
        - label: Ecosystem & Partner Integration Layer
          detail: >-
            Licensed catalog data pipelines (Warner Music Group), commercial API distribution endpoints, and consumer
            integration surfaces (Microsoft Copilot).
          modules:
            - Licensed Music Pipeline
            - Commercial API Gateway
            - Microsoft Copilot Connector
    approximationNotes: >-
      Architectural layers and component boundaries are synthesized from Modal infrastructure case studies, third-party
      API documentation, and engineering disclosures.
    claimRefs:
      - CE001
      - CE003
      - CE013
      - CE014
  - id: FU001
    title: Suno Customer Adoption, Conversion, and Expansion Journey
    type: journey-map
    summary: >-
      Visualizes the user lifecycle from prompt-based casual discovery through paid monetization, copyright hurdles, and
      studio expansion.
    data:
      items:
        - label: Discovery & Casual Creation
          stage: Discovery & Casual Creation
          role: Casual Creator
          activity: Inputs text prompts to generate instant songs on the web or mobile app without musical training.
          touchpoints:
            - Free tier signup
            - Social media sharing
            - Mobile creation app
        - label: Paid Self-Serve Conversion
          stage: Paid Self-Serve Conversion
          role: Prosumer Subscriber
          activity: Upgrades to Pro ($10/mo) or Premier ($30/mo) for extended credits, stems, and commercial rights assignment.
          touchpoints:
            - Credit top-ups
            - High-quality audio export
            - Commercial rights assignment
        - label: Distribution & Monetization
          stage: Distribution & Monetization
          role: Monetizing Artist
          activity: >-
            Attempts to distribute music to Spotify or sync platforms; navigates watermarking and copyright ownership
            disclaimers.
          touchpoints:
            - TuneCore distribution
            - DistroKid screening
            - Sync licensing briefs
        - label: Collaborative Expansion
          stage: Collaborative Expansion
          role: Remixer & Studio Creator
          activity: Utilizes Suno Studio, remix features, and partner models; encounters non-commercial remix constraints.
          touchpoints:
            - Suno Studio power tool
            - Community remix feature
            - Licensed label models
        - label: Enterprise & Partner Alliances
          stage: Enterprise & Partner Alliances
          role: Commercial Partner
          activity: Integrates Suno API or collaborates on branded experiences via partner customer success motion.
          touchpoints:
            - Partner success onboarding
            - Musixmatch Sentinel screening
            - B2B API integrations
        - label: Retention & Churn Risk
          stage: Retention & Churn Risk
          role: Evaluating Subscriber
          activity: >-
            Evaluates subscription renewal against monthly download caps, copyright risk, and label litigation
            developments.
          touchpoints:
            - Monthly download quotas
            - Label litigation updates
            - Subscription renewal billing
    approximationNotes: >-
      Stages and touchpoints synthesized from contractual terms of service, distributor ingest policies, and partner
      onboarding disclosures.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Visual mapping of Suno's principal risk factors categorized by impact severity and occurrence likelihood.
    data:
      columns:
        - Very Low Likelihood
        - Low Likelihood
        - Moderate Likelihood
        - Elevated Likelihood
        - High Likelihood
        - Certain Likelihood
      rows:
        - label: Critical Severity
          values:
            - Hostile Takeover Threat
            - Catastrophic Infrastructure Outage
            - Hostile Major Label License Revocation
            - Multi-Jurisdiction Injunctions
            - UMG/Sony Litigation Injunction & Damages
            - Legacy Model Weight Deprecation
        - label: High Severity
          values:
            - Complete Mobile App Store Delisting
            - Severe API Developer Attrition
            - GPU Infrastructure Cost Shock
            - Foreign Collecting Society Judgments
            - Data Breach Class Action & Regulatory Fines
            - Mandatory Copyright Transparency Disclosures
        - label: Medium Severity
          values:
            - Vendor Payment Disputes
            - Executive Departure Disruption
            - Competitor Fast-Follower Pressure
            - Consumer Churn from Download Limits
            - European Copyright Society Injunctions
            - Statutory Non-Registrability of AI Outputs
        - label: Low Severity
          values:
            - Domain DNS Propagation Delays
            - Localized Brand Translation Issues
            - Minor Social Media Sentiment Dips
            - Customer Support Ticket Backlogs
            - User Interface Layout Friction
            - Non-Critical SDK Deprecation Notices
        - label: Minimal Severity
          values:
            - Routine Security Scans
            - Minor Website Typo Reports
            - Infrequent Forum Moderation Flags
            - Non-Core Documentation Updates
            - Standard SSL Certificate Rotations
            - Scheduled Staging Maintenance
        - label: Informational
          values:
            - Community Forum Poll Responses
            - Beta Feature User Wishlists
            - Industry Conference Announcements
            - Quarterly Newsletter Signups
            - Public Benchmark Tracker Notes
            - Open-Source Model Evaluation Logs
    approximationNotes: >-
      Likelihood and severity classifications derived from pending legal claims, pre-IPO offering memoranda, and
