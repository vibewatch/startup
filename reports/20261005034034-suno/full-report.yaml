  - id: TV003
    title: Bull, base, and bear valuation sensitivity
    columns:
      - Case
      - Assumptions
      - Illustrative multiple
      - Illustrative valuation range
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Reported $300M ARR compounds with durable retention; licensing economics become predictable; remaining
          litigation resolves without material operating constraint.
        - 18x-24x ARR
        - $5.4B-$7.2B
        - >-
          Positive signal: verified acceleration with stable margins. Trigger out: licensing or compute costs prevent
          operating leverage.
      - - Base
        - >-
          Reported ARR is sustained, but margin, retention, and legal-reserve evidence remains incomplete; market
          accepts a premium private AI multiple.
        - 14x-18x ARR
        - $4.2B-$5.4B
        - >-
          Mixed signal: current mark is the top of the band. Trigger down: growth decelerates before unit economics are
          proven.
      - - Bear
        - >-
          Growth slows, multiples compress, or unresolved litigation and licensing costs impair economics or
          distribution.
        - 8x-12x ARR
        - $2.4B-$3.6B
        - >-
          Negative signal: down round, adverse legal outcome, or weak cohort economics. This band implies material
          downside to the June 2026 mark.
    notes: >-
      Illustrative ranges equal the reported $300M ARR anchor multiplied by scenario assumptions; they are analyst
      sensitivities, not forecasts, transaction indications, or audited enterprise values. Comparator businesses and
      metric bases are not fully comparable.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV011
      - CV012
      - CV015
figures:
  - id: FO001
    title: Suno Foundational Corporate, Product, and Financing Timeline
    type: timeline
    summary: Chronological milestone progression across corporate formation, capital raises, legal battles, and model rollouts.
    approximationNotes: >-
      Dates correspond to publicly confirmed corporate founding, financing press releases, legal settlements, and major
      product model announcements.
    data:
      items:
        - label: '2022-01: Company Founding'
          detail: Mikey Shulman, Georg Kucsko, Martin Camacho, and Keenan Freyberg establish Suno in Cambridge, Massachusetts.
          tone: positive
          date: 2022-01
          claimRefs:
            - CO001
            - CO002
        - label: '2023-12: Public Platform Launch'
          detail: >-
            Suno launches its consumer-facing text-to-music web interface, triggering rapid consumer and social
            virality.
          tone: positive
          date: 2023-12
          claimRefs:
            - CO003
            - CO006
        - label: '2024-05: Series B Funding'
          detail: Closes $125 million Series B led by Lightspeed Venture Partners at a $500 million post-money valuation.
          tone: positive
          date: 2024-05
          claimRefs:
            - CO009
            - CO010
        - label: '2024-06: Record Label Copyright Suits'
          detail: >-
            RIAA, Warner Music Group, Sony Music, and Universal Music Group file federal copyright infringement lawsuits
            against Suno.
          tone: negative
          date: 2024-06
          claimRefs:
            - CO008
            - CO014
        - label: '2025-11: Series C and WMG Settlement'
          detail: >-
            Raises $250M at $2.45B valuation led by Menlo Ventures; simultaneously settles copyright lawsuit with Warner
            Music Group.
          tone: positive
          date: 2025-11
          claimRefs:
            - CO009
            - CO011
            - CO014
        - label: '2026-02: Commercial Scale Milestone'
          detail: >-
            Management announces Suno has reached 2 million paid subscribers and $300 million in annual recurring
            revenue.
          tone: positive
          date: 2026-02
          claimRefs:
            - CO004
            - CO012
        - label: '2026-06: $400M Series D at $5.4B'
