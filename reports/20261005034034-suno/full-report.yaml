      - number: '1.2'
        title: Executive Leadership, Key-Person Exposure, and Organizational Bench
        blocks:
          - type: paragraph
            body: >-
              Executive leadership centers on Chief Executive Officer Mikey Shulman, who serves as the primary strategic
              and public voice of Suno alongside technical co-founders Georg Kucsko and Martin Camacho. The core team
              was significantly augmented by the appointment of Jack Brody as Chief Product Officer following more than
              a decade directing product design at Snap, and former Atlantic Records executive Paul Sinclair as Chief
              Music Officer to manage commercial rights relations. Because proprietary model training techniques and
              audio synthesis algorithms are anchored in the machine learning backgrounds of the founding group,
              technical key-person exposure remains concentrated across Shulman, Camacho, and Kucsko. Board governance
              includes major early-stage institutional venture partners such as Menlo Ventures, Lightspeed Venture
              Partners, and Matrix Partners, alongside Series D lead Bond Capital. Management has actively diversified
              operational leadership to bridge Silicon Valley software velocity with legacy music industry licensing
              practices, although formal independent audit committees and public disclosure governance structures remain
              private and opaque.
            claimRefs:
