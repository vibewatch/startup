        title: 单位经济、GPU 计算消耗与授权成本结构
        blocks:
          - type: paragraph
            body: >-
              评估 Suno 的单位经济，必须把沉重的计算基础设施成本与不断增长的音乐权利人分成分开看。公开研究资料显示，Suno 的主要运营费用是云 GPU 计算，用于训练生成式音频架构并运行推理；据估计，每日生成的音轨达到
              7 million。Sacra 分析师指出，Suno 的 GPU 计算支出是薪资成本的数倍，运营画像不同于传统轻资产软件公司。就内容成本而言，Suno 于 2026 年 9 月随 v6
              发布转向获得授权的基础模型，使用 Warner Music Group、BMG Rights Management 和 Believe 等合作方的授权目录训练。             
              虽然这些协议保护了企业业务的持续性，但分给权利人合作伙伴的收入必然压缩长期毛利率潜力。此外，与 Universal Music Group 和 Sony Music Entertainment 在
