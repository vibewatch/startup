      - number: '8.4'
        title: 退出准备度与决策触发条件
        blocks:
          - type: paragraph
            body: >-
              公开记录尚未证明 Suno 已具备退出准备度。最新融资和订阅用户规模或许支持未来流动性，但留存的来源没有披露经审计财务报表、董事会构成、清算优先权、二级转让条款或可信的 IPO
              时间表。要作出积极决策，需要用户群层面的留存、毛利率和推理成本证据，经核对的现金及法律准备金明细，Series D 资本表和优先权安排，以及剩余唱片公司争议的量化解决路径。如果 ARR
              增长停滞而计算、数据或授权成本继续令利润率结构性偏弱；如果未决诉讼造成重大损害赔偿或分发限制；或者未来一轮融资将估值重置到 2026 年 6 月估值以下，投资论点就会失效。
