        title: 展示项
        blocks:
          - type: callout
            title: 双重威胁：训练合法性未定与数据泄露责任
            body: >-
              Suno 承受两项生存级法律压力。第一，虽然 WMG 已和解，UMG 和 Sony 仍继续追索每项侵权作品最高 $150,000 的法定损害赔偿，同时挑战旧模型及获得授权的 v6
              架构在衍生使用上的合法性。第二，围绕 2025 年 11 月、影响 55 million 用户的数据泄露而合并的集体诉讼，暴露出严重的网络安全治理缺口和延迟披露处罚。
