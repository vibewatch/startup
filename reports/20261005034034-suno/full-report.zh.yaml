chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与运营使命
        blocks:
          - type: paragraph
            body: >-
              Suno Inc. 由 Mikey Shulman、Georg Kucsko、Martin Camacho 和 Keenan Freyberg 于 2022 年在 Massachusetts Cambridge
              创立。公司总部位于 17 Dunster Street，并在 New York、Los Angeles 和 San Francisco 设有区域办公室。创始团队相识于机器学习基础设施供应商
              Kensho，带来了神经音频架构、自然语言处理和高吞吐模型推理方面的专长。Suno
              面向消费者的网页和移动应用允许用户直接用对话式文本提示生成完整音频作品，包括多流派配器、歌词生成、合成人声和完整编曲分轨。早期增长主要来自消费者自传播和休闲创作者试用；随后 Suno 通过 Suno Studio
              数字音频工作站（DAW）拓展专业创作者工具，并收购浏览器 DAW 平台 WavTool 和音乐会发现服务 Songkick。2026 年，Suno 报告注册创作者账户超过 100
              million，并在四个主要办公室拥有超过 250 名员工的多学科团队。
