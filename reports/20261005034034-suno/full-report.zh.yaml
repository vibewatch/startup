  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界逻辑
        blocks:
          - type: paragraph
            body: >-
              Suno 的可服务市场位于生成式 AI 内容平台、数字音频工作站（DAW）以及库存音乐 / 制作音乐授权的交叉地带。Suno
              的核心产品从自然语言文本提示出发，端到端合成歌曲，整合人声生成、歌词创作、编曲和分轨渲染。纳入的支出包括面向专业消费者的创作者工具、视频和游戏开发者使用的商业音频订阅，以及嵌入式平台 API
              集成。高端真人母带录音、需要工会真人演出的专业电影配器，以及现场活动制作，不在短期可捕获范围内，因为这些场景仍要求真人来源和工会合规。主要现有替代品包括传统采样库、免版税库存音乐库、自由职业录音师，以及要求具备乐器技能的传统桌面
              DAW。Suno 把作曲、演奏和录音捆进一个软件层级，将持续数天的制作流程压缩到几秒，直接挑战现有库存音乐目录和低端商业作曲流程。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
      - number: '2.2'
        title: 多种分析视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              评估 Suno
              的可服务机会，需要采用不同分析视角，而不是押注一个投机性数字。从宏观经济角度看，全球数字音乐和创作者软件市场涵盖消费者流媒体、授权和专业音频软件，规模达数百亿美元。范围更窄的可服务可得市场（SAM）聚焦库存音乐、制作音乐和音频创作工具，年支出对应数十亿美元机会。在这一可服务范围内，可服务可获取市场（SOM）由付费生成式
              AI 音乐订阅和商业创作者授权定义。Suno 已验证的 $300 million ARR 和 2 million
              付费订阅用户表明，生成式音频已从现代创作者预算中拿到有意义的份额。但要跨过这一立足点，取决于企业和媒体平台能否在不持续暴露版权风险或下游权利链瑕疵的情况下，为生成资产取得授权。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
