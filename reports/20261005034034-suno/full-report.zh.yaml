companyProfile:
  summary: >-
    Suno 是一家总部位于 Cambridge、由 Mikey Shulman、Georg Kucsko、Martin Camacho 和 Keenan Freyberg 于 2022 年创立的生成式 AI
    音乐平台。公司销售免费增值的文本转歌曲产品，并扩展到 Suno Studio 和获得授权的 Suno v6 模型系列，把消费者订阅与日益增多的版权及分发合作结合起来。到 2026 年初，管理层称 Suno 的付费订阅用户已超过 2
    million、ARR 达到 $300 million；截至 2026 年 6 月，公司已完成 $400 million 的 Series D 融资，估值达到 $5.4 billion。Suno
    仍是非上市公司，在应对持续的版权和授权问题之际，仅公开披露有限的财务和治理细节。
