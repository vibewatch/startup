      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Suno 的客户分为三类：休闲消费者创作者、专业消费者 / 商业创作者，以及企业平台集成商。休闲消费者用个人可支配支出购买月度或年度订阅（Pro 每月 $8 至 $10，Premier 每月 $24 至
              $30），用于娱乐、社交分享和个人试验。包括独立游戏开发者、社交媒体营销团队和视频制作人在内的专业消费者，使用 Suno 制作背景音频、演示音轨和声音素材，预算来自部门软件或创意制作费用。Microsoft 将
              Suno 集成进 Copilot、Gaxos 将音频生成集成进开发者环境，正是企业买方和平台伙伴通过程序化 API
              向终端用户提供生成能力的例子。企业采购通常由产品工程或创新负责人负责；版权赔偿和训练来源的法律审查，是合同签署的关键闸门。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
