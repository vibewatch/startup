      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业速度与未决版权负债的分化
            body: >-
              Suno 展现了消费者生成式 AI 平台前所未有的收入扩张速度：ARR 从 2023 年不足 $1 million 加速至 2026 年初的 $300 million，付费用户超过 2
              million。但这段增长是在应对全球最大音乐出版商据称提出的、可能动摇公司生存的版权侵权指控时实现的。Suno 与 Warner Music Group 的和解以及 2026 年 9 月发布获得授权的 Suno
              v6 模型，说明公司存在与行业共存的可行路径；不过，Sony Music Entertainment 和 Universal Music Group 的未决诉讼仍使法律损害赔偿和目录禁令风险悬而未决。
            calloutType: insight
            claimRefs:
              - CO004
              - CO008
              - CO012
              - CO013
              - CO014
          - type: callout
            title: 治理不透明与单位经济核查缺口
            body: >-
              尽管已融资 $775 million、估值达到 $5.4 billion，Suno
              仍是一家股权高度集中的私人公司，几乎不公开毛利率、服务器计算费用和音乐授权版税义务。投资者必须把已报告的收入数字视为未经审计的管理层口径。重点核查事项包括：验证成熟消费者群体的净收入留存率，审计与唱片公司分成协议造成的利润率拖累，以及评估公司对创始研究团队的关键人物依赖。
            calloutType: risk
