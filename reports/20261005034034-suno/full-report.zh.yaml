      - number: '1.4'
        title: 商业规模、法律逆风与模型治理里程碑
        blocks:
          - type: paragraph
            body: >-
              Suno 的商业扩张伴随着围绕生成式 AI 训练方法的严重法律风险和监管审查。2026 年 2 月，CEO Mikey Shulman 公开确认，Suno 各订阅层级的付费用户已超过 2
              million，年经常性收入约为 $300 million；相比之下，2025 年末报告为 $200 million，2024 年中为 $45 million。然而，公司还面临主要唱片公司于 2024
              年提起的一系列联邦版权诉讼，包括 Warner Music Group、Universal Music Group 和 Sony Music
              Entertainment；原告指控其未经授权将录制音乐目录作为训练数据。2025 年末，Suno 与 Warner Music Group 达成具有里程碑意义的和解及商业授权联盟，并收购 WMG
              的现场活动发现实体 Songkick。2026 年 9 月，Suno 推出获得授权的 Suno v6 模型系列，使用 Warner Music Group、BMG 和 Believe
              的授权数据开发，明确淘汰未经验证的模型，并加入水印和导出上限；与此同时，与 Sony Music、Universal Music Group 及独立艺术家团体的未决诉讼仍在继续。
            claimRefs:
