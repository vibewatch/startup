      - number: '3.3'
        title: 定价结构、打包摩擦与单位经济
        blocks:
          - type: paragraph
            body: >-
              AI 音乐生成的商业打包，在免费增值订阅获客与 GPU 推理成本之间寻找平衡。Suno 的主流 Pro 层级定价为每月 $10（按年计费每月 $8），提供 2,500 积分，约可生成 500
              首歌曲，活跃订阅用户拥有商业权利。Udio 的入门定价同样为每月 $10，付费层级提供月度积分和分轨下载。但生成积分的经济性给高频创作者带来隐性摩擦：一首完成度足够、可发行的音轨往往需要生成 5 至 15
              个创意变体，月度积分很快耗尽，可用歌曲的实际成本也随之倍增。下游流程工具的价格敏感度更高，例如 VidMuse 每月收费 $39，且积分严格过期。尽管存在这些消费动态，AI 音乐生成每首歌的成本仅为 $0.008
              至 $0.01，相比定制真人录音室作曲的 $500 至 $2,000 大幅下降；这既释放了巨大规模，也在考验平台毛利率的韧性。
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
