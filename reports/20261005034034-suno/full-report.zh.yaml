      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              情景框架固定报告中的 $300 million ARR，只改变倍数；这是分析敏感性，不是预测，也不是报价的二级市场价格。8x-12x 的悲观区间对应 $2.4-$3.6 billion，14x-18x
              的基准区间对应 $4.2-$5.4 billion，18x-24x 的乐观区间对应 $5.4-$7.2 billion。Multiples.vc 列出的私营公司参考点包括 Higgsfield 的 13.5x 和
              Runway 的 17.7x；其上市公司样本则包括明显更低的 Presight AI 5.4x。这些只能作为方向性参考：业务组合、成熟度、盈利能力和指标定义各不相同，不能独立验证 Suno 的价格。
            claimRefs:
