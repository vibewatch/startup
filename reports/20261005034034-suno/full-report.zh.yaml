      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 商业使用悖论与版权真空
            body: >-
              Suno 拥有 2 million 付费订阅用户，用户每月支付 $8 至 $30 以获得商业权利；但其 2026 年 3 月服务条款明确拒绝保证生成输出拥有任何版权。此外，使用协作混音功能生成的音轨按合同规定为
              50/50 共同作品，并受到严格的非商业限制，不因订阅层级而改变。这样的法律摩擦叠加分发商的自动筛查，给 Suno 的创作者收入基础带来严重的持续性风险。
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: 从游击式 AI 转向获得授权的合作伙伴平台
            body: >-
              Suno 的企业战略是从未经许可的网页抓取转向机构合法性。Suno 与 Warner Music Group、BMG 和 Believe/TuneCore 建立获得授权的模型合作，并接入 Musixmatch 的
              Sentinel 检测基础设施，正在打造一个获授权的创作者生态，以承受 Sony 和 Universal 的法律挑战。
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 版权诉讼与知识产权暴露
        blocks:
          - type: paragraph
            body: >-
              Suno 最紧迫、可能危及生存的风险，仍是围绕模型训练语料的知识产权侵权诉讼。2024 年 6 月，代表主要唱片公司的 Recording Industry Association of
              America（RIAA）提起版权侵权诉讼，指控其未经授权使用受保护录音进行训练。尽管 Warner Music Group 于 2025 年 11 月和解并同意合作开发获得授权的模型，Universal
              Music Group 和 Sony Music Entertainment 仍是联邦法院的活跃原告。此外，丹麦 Koda 和德国 GEMA
              等欧洲著作权集体管理组织也已发起法律挑战，造成司法管辖区碎片化。按美国版权局的规则，纯 AI 生成输出缺乏法定版权保护，这进一步限制了企业和同步授权变现。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
