  - id: FE001
    title: 产品架构与技术栈
    type: stack
    summary: 六层架构展示 Suno 的用户界面、生成式工作流编排、基础模型推理、云基础设施和合作伙伴分发层。
    data:
      layers:
        - label: 展示层
          detail: 覆盖桌面和移动端的响应式网页客户端、原生消费者移动应用，以及面向专业创作者的高保真 Suno Studio 工作区。
          modules:
            - Web 应用
            - 移动应用（iOS/Android）
            - Suno Studio 界面
        - label: 工作流与创意控制层
          detail: 自然语言提示词解析、歌词解析、流派 / 情绪风格化、音频上传与摄取，以及多轨分轨控制。
          modules:
            - 提示词解析器
            - 歌词生成器
            - 分轨引擎
            - 音频扩展器 / 混音管线
        - label: 模型编排层
          detail: 链式推理序列、函数路由、异步生成队列和多模型版本路由（v4、v4.5、v5 beta）。
          modules:
            - 模型版本路由器
            - 异步任务队列
            - Python 工作流链
            - HTTP 入口端点
        - label: 生成式音频基础层
          detail: 自研深度学习音乐生成模型，产出多乐器音频、合成人声和结构化歌曲编排。
          modules:
            - 人声合成模型
            - 器乐伴奏网络
            - 音频扩散 / Transformer 引擎
        - label: 基础设施与算力层
          detail: 基于 Modal 的无服务器基础设施在数千个云 GPU 之间动态扩展，无需管理集群或固定预留资源。
          modules:
            - Modal 无服务器算力
            - 动态 GPU 自动扩缩容
            - 批量预处理工作器
            - 云存储
        - label: 生态与合作伙伴集成层
          detail: 授权曲库数据管线（Warner Music Group）、商业 API 分发端点和消费者集成界面（Microsoft Copilot）。
          modules:
            - 授权音乐管线
            - 商业 API 网关
            - Microsoft Copilot 连接器
    approximationNotes: 架构层和组件边界综合自 Modal 基础设施案例、第三方 API 文档和工程披露。
    claimRefs:
      - CE001
      - CE003
      - CE013
      - CE014
  - id: FU001
    title: Suno 客户采用、转化与扩张旅程
    type: journey-map
    summary: 展示用户从提示词驱动的随意探索，到付费变现、版权障碍和 Studio 扩张的生命周期。
    data:
      items:
        - label: 探索与随手创作
          stage: 探索与随手创作
          role: Casual Creator
          activity: Inputs text prompts to generate instant songs on the web or mobile app without musical training.
          touchpoints:
            - 免费层注册
            - 社交媒体分享
            - 移动创作应用
        - label: 付费自助转化
          stage: 付费自助转化
          role: Prosumer Subscriber
          activity: Upgrades to Pro ($10/mo) or Premier ($30/mo) for extended credits, stems, and commercial rights assignment.
          touchpoints:
            - 积分充值
            - 高音质音频导出
            - 商业权利授予
        - label: 分发与变现
          stage: 分发与变现
          role: Monetizing Artist
          activity: >-
            Attempts to distribute music to Spotify or sync platforms; navigates watermarking and copyright ownership
            disclaimers.
          touchpoints:
            - TuneCore 分发
            - DistroKid 审核
            - 同步授权需求简报
        - label: 协作扩张
          stage: 协作扩张
          role: Remixer & Studio Creator
          activity: Utilizes Suno Studio, remix features, and partner models; encounters non-commercial remix constraints.
          touchpoints:
            - Suno Studio 高级工具
            - 社区混音功能
            - 获授权的唱片厂牌模型
        - label: 企业与合作伙伴联盟
          stage: 企业与合作伙伴联盟
          role: Commercial Partner
          activity: Integrates Suno API or collaborates on branded experiences via partner customer success motion.
          touchpoints:
            - 合作伙伴成功入驻
            - Musixmatch Sentinel 审核
            - B2B API 集成
        - label: 留存与流失风险
          stage: 留存与流失风险
          role: Evaluating Subscriber
          activity: >-
            Evaluates subscription renewal against monthly download caps, copyright risk, and label litigation
            developments.
          touchpoints:
            - 每月下载配额
            - 唱片厂牌诉讼进展
            - 订阅续费计费
    approximationNotes: 阶段与触点综合自服务合同条款、分销商内容接收政策及合作伙伴入驻披露。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按影响严重程度和发生可能性，对 Suno 的主要风险因素进行可视化映射。
    data:
      columns:
        - 极低可能性
        - 低可能性
        - 中等可能性
        - 较高可能性
        - 高可能性
        - 确定会发生
      rows:
        - label: 极高严重性
          values:
            - 恶意收购威胁
            - 灾难性基础设施中断
            - 主要唱片厂牌恶意撤销授权
            - 多司法辖区禁令
            - UMG/Sony 诉讼禁令与赔偿
            - 旧版模型权重弃用
        - label: 高严重性
          values:
            - 移动应用商店全面下架
            - API 开发者严重流失
            - GPU 基础设施成本冲击
            - 境外集体管理组织判决
            - 数据泄露集体诉讼与监管罚款
            - 强制版权透明度披露
        - label: 中等严重性
          values:
            - 供应商付款纠纷
            - 高管离职造成的扰动
            - 竞争对手快速跟随压力
            - 下载限制导致的消费者流失
            - 欧洲版权组织禁令
            - AI 输出依法不得注册
        - label: 低严重性
          values:
            - 域名 DNS 传播延迟
            - 本地化品牌翻译问题
            - 社交媒体情绪小幅下滑
            - 客服工单积压
            - 用户界面布局摩擦
            - 非关键 SDK 弃用通知
        - label: 极低严重性
          values:
            - 常规安全扫描
            - 网站轻微错字报告
            - 偶发论坛审核标记
            - 非核心文档更新
            - 标准 SSL 证书轮换
            - 计划中的预发布环境维护
        - label: 仅供参考
          values:
            - 社区论坛投票反馈
            - Beta 功能用户愿望清单
            - 行业会议公告
            - 季度新闻简报订阅
            - 公开基准跟踪记录
            - 开源模型评测日志
    approximationNotes: 可能性与严重性分类源自据称存在的待决法律指控、IPO 前发行备忘录及运营披露。
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR007
      - CR008
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策从已报告规模出发，依次考察价格、未解的经济性问题和法律风险敞口，最终给出“跟踪 / 继续研究”的建议。
    data:
      nodes:
        - id: reported-scale
          label: 已报告规模
          detail: 2M 付费订阅用户，ARR 为 $300M
        - id: current-price
          label: 当前融资估值
          detail: Series D 轮估值 $5.4B；约为已报告 ARR 的 18x
        - id: economics-gap
          label: 经济性缺口
          detail: 没有公开的毛利率、留存率、现金消耗或现金跑道证据
        - id: legal-overhang
          label: 法律风险悬而未决
          detail: Warner 已和解；与 UMG 和 Sony 的诉讼仍在持续
        - id: terms-gap
          label: 条款缺口
          detail: 优先权、稀释、治理及老股交易条款未披露
        - id: decision
          label: 决策
          detail: 跟踪 / 继续研究；需要更强证据或更低价格
    approximationNotes: 该流程是定性的；不赋予数值概率，也不推断因果转化率。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV016
