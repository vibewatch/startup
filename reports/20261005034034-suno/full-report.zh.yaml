      - number: '7.3'
        title: 合作伙伴依赖、平台限制与模型风险
        blocks:
          - type: paragraph
            body: >-
              Suno 面临显著的合作伙伴和收入集中风险。尽管截至 2026 年 2 月 ARR 已达 $300 million、付费订阅用户超过 2
              million，公司的收入基础仍高度依赖消费者订阅，容易受到流失、新鲜感疲劳和宏观走弱影响。为安抚唱片公司合作伙伴并防止滥用分发，Suno 在 2026 年 9
              月引入下载限制和月度下载上限，同时淘汰旧模型，转向获得授权的 v6 架构。向主要唱片公司支付的授权版税以及平台变化，可能实质性侵蚀毛利率，并促使订阅用户转向 Google、Udio 或 ElevenLabs
              的竞争基础模型。
