      - number: '1.3'
        title: 资本化轨迹、估值扩张与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              Suno 已在四轮机构投资中累计获得超过 $775 million 股权融资，从种子期项目成长为数十亿美元估值的私营成长公司。2024 年 5 月，公司完成 $125 million 的 Series B，估值
              $500 million，由 Lightspeed Venture Partners 领投；随后于 2025 年 11 月完成 $250 million 的 Series C，估值 $2.45 billion，由
              Menlo Ventures 领投，NVIDIA 的 NVentures、Lightspeed、Matrix Partners 和 Hallwood Media 参与。2026 年 6 月，Suno 完成由
              Bond Capital 领投的 $400 million Series D，投后估值达到 $5.4 billion，按年化收入 run-rate 计算，股权定价估计为收入的 18.0x。Series D
              联合投资者包括 IVP、Forerunner Ventures、Union Square Ventures、Alkeon Capital Management、Quiet Capital 和 Schroders
              Capital 等新老机构投资者，另有知名科技高管提供天使投资。机构风投支持带来充足流动性，但私人公司文件仍未披露确切的资本表分配、清算优先权和二级交易折扣。
            claimRefs:
