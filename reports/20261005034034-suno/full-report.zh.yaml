      - number: '7.2'
        title: 网络安全、基础设施可靠性与计算成本敏感度
        blocks:
          - type: paragraph
            body: >-
              严重的网络安全负债和庞大的计算成本结构凸显了运营脆弱性。2026 年 8 月，Massachusetts 的联邦法官合并了两起针对 Suno 的集体诉讼；诉讼源于 2025 年 11 月的一次数据泄露，约 55
              million 名用户的敏感信息受到影响。直到 2026 年 7 月、也就是泄露发生 9 个月后，受害者才获知此事，使公司暴露于法定责任、据称存在的过失责任和运营分心之下。与此同时，计算和 GPU 基础设施是
              Suno 最大的运营开支，使公司对 GPU 硬件供给约束、托管价格波动以及高保真音频模型扩张带来的毛利率压缩高度敏感。
            claimRefs:
