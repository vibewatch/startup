  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前估值
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，信心中等、风险高，估值偏高。Suno 据报道于 2026 年 6 月以 $5.4 billion 估值融资 $400 million；此前于 2025 年 11 月完成 $250
              million Series C，投后估值 $2.45 billion。后一个估值约为前一个的 2.2x，报告中的 $300 million ARR 锚点意味着约 18x ARR。这是有意义的商业验证，但 ARR
              不是会计收入，融资额不等于可用现金，二者都不能证明毛利率、现金消耗、留存或优先权负担。因此，公开证据支持继续尽调，而不是无条件认可当前价格。
            claimRefs:
