      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Suno 把罕见的消费者订阅规模与私募市场快速重估结合起来。独立报道援引两百万付费订阅用户和 $300 million ARR，多来源也交叉确认累计融资 $775
              million。反论点同样重要。Warner 已和解并授权，但 Variety 报道称，截至 2026 年 6 月，UMG 和 Sony 仍在积极诉讼。Music Ally
              还报道称，一笔筹划中的融资将大笔资金投入计算和数据，这说明运营模式可能成本高昂，而不是证明利润率持久。留存的证据没有提供用户群留存、流失率、毛利率、现金消耗、资金续航或优先权数据。
