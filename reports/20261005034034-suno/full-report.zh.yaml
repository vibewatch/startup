      - 决策含义
    rows:
      - - 跟踪 / 继续研究
        - 中
        - 高
        - 偏高
        - 在完成私有材料中的单位经济性数据、法律准备金和融资条款尽调前，不要把 $5.4B 估值计入投资判断；待价格更低或证据更充分后再评估。
    notes: 判断截至 2026-10-05；$5.4B 融资估值和 $300M ARR 是报道数字，并非经审计财务报表或当前二级市场报价。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV007
      - CV014
  - id: TV002
    title: 正论点与反论点
    columns:
      - 立场
      - 论点
      - 证据信号
      - 哪些事实会改变判断
    rows:
      - - 正论点
        - 订阅规模
        - 2026 年 2 月据报道有 2M 付费订阅用户和 $300M ARR。
        - 用户群留存和经审计的 ARR 核对结果将强化该论点。
      - - 正论点
        - 融资能力
        - 2026 年据报道完成 $400M D 轮融资，累计融资 $775M。
        - 一份展示计提法律和授权准备金后现金跑道的现金桥接表，才能让融资信号具备决策价值。
      - - 正论点
        - 私募市场动能
        - 2026 年 6 月估值约为 2025 年 11 月投后估值的 2.2x。
        - 在倍数不扩张的情况下维持 ARR 增长，将改善入场纪律。
      - - 反论点
        - 版权与授权风险敞口
        - 2026 年 6 月报道显示 Warner 已和解，而 UMG 和 Sony 仍在诉讼中。
        - 全面和解并量化经常性授权经济效益，将缓解悬而未决的压力。
      - - 反论点
        - 成本结构不透明
        - 据报道，对算力和数据的计划投入意味着基础设施及投入成本可观，但利润率未披露。
        - 毛利率、推理成本和贡献利润率的用户群组数据将化解这一担忧。
      - - 反论点
        - 条款与流动性不透明
        - 公开来源未披露 D 轮优先权、稀释、二级交易条款或退出时间表。
        - 需要资本表、优先权瀑布、治理文件和董事会批准的流动性规划。
    notes: 证据信号使用报道中的 ARR、订阅用户、融资和法律状态数据；所需私有指标是待补数据，不是对实际表现的假设。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV007
      - CV009
      - CV010
      - CV013
      - CV015
  - id: TV003
    title: 乐观、中性与悲观估值敏感性
    columns:
      - 情景
      - 假设
      - 参考倍数
      - 参考估值区间
      - 概率信号与下行触发因素
    rows:
      - - 乐观
        - 据报道的 $300M ARR 在留存稳健的情况下复合增长；授权业务经济性变得可预测；剩余诉讼解决且不对运营造成重大约束。
        - 18x-24x ARR
        - $5.4B-$7.2B
        - 正面信号：经验证的加速增长且利润率稳定。下行触发：授权或算力成本阻碍运营杠杆。
      - - 中性
        - 据报道的 ARR 能够维持，但利润率、留存和法律准备金证据仍不完整；市场接受私募 AI 的溢价倍数。
        - 14x-18x ARR
        - $4.2B-$5.4B
        - 混合信号：当前估值处于区间上沿。下行触发：单位经济尚未验证前增长就放缓。
      - - 悲观
        - 增长放缓、倍数压缩，或未解决的诉讼和授权成本损害经济性或分发能力。
        - 8x-12x ARR
        - $2.4B-$3.6B
        - 负面信号：折价融资、不利法律结果或用户群组经济性疲弱。该区间意味着相对 2026 年 6 月估值存在显著下行。
    notes: 参考区间等于报道的 $300M ARR 基准乘以情景假设；这是分析师敏感性分析，不是预测、交易报价或经审计的企业价值。可比公司的业务和指标基础并不完全可比。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV011
      - CV012
      - CV015
figures:
  - id: FO001
    title: Suno 公司、产品与融资基础时间线
    type: timeline
    summary: 按时间展示公司成立、融资、法律争端和模型上线的里程碑演进。
    approximationNotes: 日期对应公开确认的公司成立、融资新闻稿、法律和解及重大产品模型公告。
    data:
      items:
        - label: '2022-01: 公司成立'
          detail: Mikey Shulman、Georg Kucsko、Martin Camacho 和 Keenan Freyberg 在马萨诸塞州剑桥创立 Suno。
          tone: positive
          date: 2022-01
          claimRefs:
            - CO001
            - CO002
        - label: '2023-12: 平台公开上线'
          detail: Suno 推出面向消费者的文本转音乐网页界面，迅速在消费者群体和社交媒体上形成病毒式传播。
          tone: positive
          date: 2023-12
          claimRefs:
            - CO003
            - CO006
        - label: '2024-05: B 轮融资'
          detail: 完成 $125 million B 轮融资，由 Lightspeed Venture Partners 领投，投后估值 $500 million。
          tone: positive
          date: 2024-05
          claimRefs:
            - CO009
            - CO010
        - label: '2024-06: 唱片公司版权诉讼'
          detail: RIAA、Warner Music Group、Sony Music 和 Universal Music Group 对 Suno 提起联邦版权侵权诉讼。
          tone: negative
          date: 2024-06
          claimRefs:
            - CO008
            - CO014
        - label: '2025-11: C 轮融资与 WMG 和解'
          detail: Menlo Ventures 领投 $250M 融资，估值 $2.45B；同时与 Warner Music Group 就版权诉讼达成和解。
          tone: positive
          date: 2025-11
          claimRefs:
            - CO009
            - CO011
            - CO014
        - label: '2026-02: 商业规模里程碑'
          detail: 管理层宣布 Suno 已达到 2 million 付费订阅用户和 $300 million 年经常性收入。
          tone: positive
          date: 2026-02
          claimRefs:
            - CO004
            - CO012
        - label: '2026-06: $400M D 轮，估值 $5.4B'
          detail: Bond Capital 领投 $400 million D 轮融资，公司估值达到 $5.4 billion。
          tone: positive
          date: 2026-06
          claimRefs:
            - CO005
            - CO011
            - CO016
        - label: '2026-09: Suno v6 授权架构'
          detail: 推出 Suno v6 模型家族，使用 WMG、BMG 和 Believe 的授权数据训练，并停用旧训练数据集。
          tone: neutral
          date: 2026-09
          claimRefs:
            - CO008
            - CO013
            - CO015
    claimRefs:
