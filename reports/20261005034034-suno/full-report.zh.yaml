  - id: FI001
    title: Suno 变现漏斗与资本转化流
    type: flow
    summary: 展示用户获取、免费层门槛、订阅转化、成本扣除和资本再投资的结构化流程。
    data:
      nodes:
        - label: 注册用户基数（100M+ 账户）
          detail: 网页和移动应用带来大规模自然流量，撑起漏斗顶端
        - label: 免费层参与（10 首歌 / 天，约 50% 撞到每日上限）
          detail: 每日免费额度带动病毒式采用，同时限制完整功能
        - label: 付费转化（约 2% 转化率；2M+ 付费订阅用户）
          detail: 高意向创作者付费，以解锁商业权利和下载
        - label: 订阅收入运行率（Pro 与 Premier 层 $300M+ ARR）
          detail: 经常性收入在 $10/mo 和 $30/mo 价位上快速复合增长
        - label: 直接运营成本（GPU 算力与唱片公司版税）
          detail: 持续高昂的算力推理成本和逐渐形成的内容收入分成
        - label: 净经营现金流与再投资（研发、Studio 与 D 轮储备）
          detail: 将资本再投入自定义模型、Suno Studio 和公司现金跑道
    approximationNotes: 转化率和订阅用户总数反映 Sacra、TechCrunch 及管理层陈述中报道的里程碑。
