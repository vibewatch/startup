        title: 高管团队、关键人物暴露与组织梯队
        blocks:
          - type: paragraph
            body: >-
              管理层以首席执行官 Mikey Shulman 为核心；他与技术创始人 Georg Kucsko、Martin Camacho 一起，承担 Suno 的主要战略和对外发声职能。曾任 Snap 产品设计负责人的
              Jack Brody 出任首席产品官，任职超过十年；前 Atlantic Records 高管 Paul Sinclair
              出任首席音乐官，负责商业版权关系，核心团队因此得到显著补强。由于专有模型训练方法和音频合成算法都扎根于创始团队的机器学习背景，技术关键人物依赖仍集中在 Shulman、Camacho 和 Kucsko
              身上。董事会治理包括 Menlo Ventures、Lightspeed Venture Partners 和 Matrix Partners 等早期机构投资者，以及 Series D 领投方 Bond
              Capital。管理层正主动分散运营领导力，试图把 Silicon Valley 软件迭代速度与传统音乐行业的授权惯例接起来，但正式的独立审计委员会和公开披露治理结构仍处于非公开且不透明状态。
