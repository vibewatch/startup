              除直接面向消费者的自助式订阅外，Suno 正积极拓展音乐行业联盟、分发合作和企业 beta 关系。2025 年 11 月，Warner Music Group 与 Suno
              就版权诉讼达成和解，转为多年授权和模型开发合作，并在 2026 年 9 月推出使用 Warner 获授权曲库训练的 v6 模型。2026 年 8 月，Suno 又与 BMG 达成版权协议；2026 年 9
              月，数字分发商 Believe 和 TuneCore 加入合作，以促进独立艺人参与。同时，Suno 在基础设施层启动企业关系，并于 2026 年 8 月成为 Musixmatch Sentinel
              实时指纹和版权检测系统的首个客户。为了支持更广泛的商业采用，Suno 在 NYC 建立专门的客户成功与合作伙伴运营团队，面向创意工作室、广告代理商、教育和健康平台的早期 beta 合作伙伴。
