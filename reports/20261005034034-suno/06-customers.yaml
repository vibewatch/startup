callouts:
  - calloutType: "risk"
    title: "The Commercial Use Paradox and Copyright Void"
    body: "While Suno commands 2 million paying subscribers paying $8 to $30 monthly for commercial rights, its March 2026 terms of service explicitly decline to warrant that any copyright vests in generated output. Furthermore, tracks generated using the collaborative remix feature are contractually designated as 50/50 joint works subject to strict non-commercial restrictions, regardless of subscription tier. This legal friction, coupled with automated distributor screening, creates severe durability risks for Suno's creator revenue base."
    claimRefs:
      - "CU003"
      - "CU004"
  - calloutType: "insight"
    title: "Transition from Guerrilla AI to Licensed Partner Platform"
    body: "Suno's enterprise strategy reflects a deliberate pivot from unpermitted web scraping toward institutional legitimacy. By securing licensed model partnerships with Warner Music Group, BMG, and Believe/TuneCore, and integrating Musixmatch's Sentinel detection infrastructure, Suno is building an authorized creator ecosystem designed to withstand legal challenges from Sony and Universal."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
