company:
  name: "Suno"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Suno is a Cambridge, Massachusetts-based generative AI music platform founded in 2022 that has reached a $5.4 billion valuation following a $400 million Series D led by Bond Capital in June 2026. The company crossed 2 million paid subscribers and $300 million in annual recurring revenue in early 2026, while navigating copyright litigation through a landmark settlement with Warner Music Group and the rollout of its licensed Suno v6 model architecture."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Foundation, and Operating Mission"
    body: "Suno Inc. was founded in 2022 by Mikey Shulman, Georg Kucsko, Martin Camacho, and Keenan Freyberg in Cambridge, Massachusetts, operating out of corporate headquarters at 17 Dunster Street with additional regional offices across New York, Los Angeles, and San Francisco. The founding team met at machine learning infrastructure provider Kensho, bringing specialized expertise in neural audio architectures, natural language processing, and high-throughput model inference. Suno's consumer-facing web and mobile applications enable users to generate complete audio compositions—including multi-genre instrumentation, lyric generation, synthesized vocals, and full arrangement stems—directly from conversational text prompts. While early traction centered on consumer virality and casual creator experimentation, Suno expanded into professional creator tooling through its Suno Studio digital audio workstation (DAW), which was augmented by its acquisition of browser DAW platform WavTool and concert discovery service Songkick. As of 2026, Suno reports more than 100 million registered creator accounts and maintains a multidisciplinary workforce of over 250 employees across four primary offices."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Key-Person Exposure, and Organizational Bench"
    body: "Executive leadership centers on Chief Executive Officer Mikey Shulman, who serves as the primary strategic and public voice of Suno alongside technical co-founders Georg Kucsko and Martin Camacho. The core team was significantly augmented by the appointment of Jack Brody as Chief Product Officer following more than a decade directing product design at Snap, and former Atlantic Records executive Paul Sinclair as Chief Music Officer to manage commercial rights relations. Because proprietary model training techniques and audio synthesis algorithms are anchored in the machine learning backgrounds of the founding group, technical key-person exposure remains concentrated across Shulman, Camacho, and Kucsko. Board governance includes major early-stage institutional venture partners such as Menlo Ventures, Lightspeed Venture Partners, and Matrix Partners, alongside Series D lead Bond Capital. Management has actively diversified operational leadership to bridge Silicon Valley software velocity with legacy music industry licensing practices, although formal independent audit committees and public disclosure governance structures remain private and opaque."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-shareholder-structure"
    title: "Capitalization Trajectory, Valuation Expansion, and Investor Syndicate"
    body: "Suno has secured over $775 million in cumulative equity financing across four institutional investment rounds, escalating from a seed-stage project into a multi-billion dollar private growth leader. The company completed a $125 million Series B in May 2024 at a $500 million valuation led by Lightspeed Venture Partners, followed by a $250 million Series C in November 2025 at a $2.45 billion valuation led by Menlo Ventures with participation from NVIDIA's NVentures, Lightspeed, Matrix Partners, and Hallwood Media. In June 2026, Suno closed a $400 million Series D financing round led by Bond Capital that established a post-money valuation of $5.4 billion, pricing equity at an estimated 18.0x revenue multiple on annualized revenue run rates. The Series D syndicate included new and existing institutional participants such as IVP, Forerunner Ventures, Union Square Ventures, Alkeon Capital Management, Quiet Capital, and Schroders Capital, alongside angel backing from prominent technology executives. While institutional venture backing provides substantial liquidity, exact capitalization table allocations, liquidation preferences, and secondary transaction discounts remain undisclosed in private company filings."
    claimRefs:
      - "CO005"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO016"
    tableRefs:
      - "TO003"
  - id: "commercial-scale-and-legal-milestones"
    title: "Commercial Scale, Legal Headwinds, and Model Governance Milestones"
    body: "Suno's commercial expansion has been paired with acute legal exposure and regulatory scrutiny regarding generative AI training methodologies. In February 2026, CEO Mikey Shulman publicly confirmed that Suno had surpassed 2 million paid subscribers across its subscription tiers, generating approximately $300 million in annual recurring revenue compared to $200 million reported in late 2025 and $45 million in mid-2024. However, the company faced sweeping federal copyright lawsuits filed in 2024 by major record labels including Warner Music Group, Universal Music Group, and Sony Music Entertainment, alleging unlicensed ingestion of recorded music catalogs for training data. In late 2025, Suno concluded a landmark settlement and commercial licensing alliance with Warner Music Group, which included the acquisition of WMG's live event discovery entity Songkick. In September 2026, Suno launched its licensed Suno v6 model family—developed with licensed data from Warner Music Group, BMG, and Believe—expressly retiring unverified models and implementing watermarking and export caps, even as unresolved litigation continues with Sony Music, Universal Music Group, and independent artist groups."
