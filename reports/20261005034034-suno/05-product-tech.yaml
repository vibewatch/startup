    title: "Serverless GPU Scaling Shaves Infrastructure Overhead"
    body: "By utilizing Modal's serverless infrastructure instead of managing bare-metal GPU clusters or long-term reservations, Suno accelerated initial model delivery and handles holiday peak demand dynamically. However, this architectural choice creates high exposure to third-party serverless platform availability and usage-based compute pricing."
    claimRefs:
      - "CE003"
      - "CE004"
  - calloutType: "risk"
    title: "Copyright Resolution Remains Incomplete Despite Warner Settlement"
    body: "While Suno reached a landmark licensing agreement with Warner Music Group to develop catalog-trained models, ongoing litigation from other major labels (Sony, UMG) and publishing entities represents an existential technical and financial risk that could compel expensive model re-training or restrictive data governance."
    claimRefs:
      - "CE009"
