companyProfile:
  summary: >-
    Suno is a Cambridge-based generative AI music platform founded in 2022 by Mikey Shulman, Georg Kucsko, Martin
    Camacho, and Keenan Freyberg. The company sells a freemium text-to-song product that expanded into Suno Studio and a
    licensed Suno v6 model family, combining consumer subscriptions with emerging rights and distribution partnerships.
    By early 2026, management said Suno had surpassed 2 million paid subscribers and $300 million in ARR, and by June
    2026 the company had raised a $400 million Series D at a $5.4 billion valuation. Suno remains private and publicly
    discloses only limited financial and governance detail while navigating ongoing copyright and licensing issues.
