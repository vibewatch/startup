company:
  name: Kraken Technology Group
chapter:
  number: 6
  title: Customers
  summary: Kraken has public evidence of government and allied-force adoption pathways, including a £12.3 million Royal Navy Project Beehive contract for 20 USVs and a USSOCOM agreement worth up to $49 million. The public record is stronger for contract awards, trials, and partner-enabled deployment than for recurring revenue, renewals, utilization, or customer concentration.
sections:
  - id: buyer-segments
    title: Buyer segments and adoption surfaces
    body: Kraken sells into sovereign and allied defence workflows where the buyer, operator, and payer can differ. The Royal Navy contract identifies the Ministry of Defence as contracting customer, SURFLOT and Coastal Forces as operating stakeholders, and training and warfare development as part of the delivered scope. The USSOCOM agreement adds a US special-operations buyer and a rapid-prototyping route. Public reporting also describes NATO Task Force-X activity and allied-nation use, while the company’s disclosed manufacturing relationships show that production partners may be operationally important without being end customers. There is therefore credible evidence of institutional demand, but not a public customer ledger, active-account denominator, or revenue split by buyer.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Named customer proof and adoption trajectory
    body: The clearest adoption evidence is tied to named public-sector programs rather than anonymous logos. Naval News reports that Kraken will deliver 20 UK-built USVs under Project Beehive and support training, tactical development, and further autonomous-technology uses; the USSOCOM report describes prototype craft with modular payload bays and operator-shaped design choices. Armada identifies the £12.3 million Royal Navy award, a $49 million USSOCOM OTA, and Anduril and Rheinmetall manufacturing relationships, while Army Recognition reports K3 SCOUT demonstrations with the UK Ministry of Defence and says the platform is already in use with the MOD and allied nations. These sources establish adoption surfaces and program progression, not production fleet utilization, outcomes, or renewal behavior.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-expansion-risk
    title: Retention, expansion, and concentration visibility
    body: Kraken’s disclosed path is expansion through defence programs, allied procurement, and localized manufacturing rather than a conventional software land-and-expand motion. Project Beehive includes training and warfare development, which can create follow-on adoption opportunities, and the USSOCOM OTA is explicitly positioned as a route to further collaboration. The Series B coverage says capital will support global rollout and localized manufacturing, but neither that coverage nor the Companies House filing-history page discloses recognized revenue, contract backlog, renewal rates, churn, gross margin, customer concentration, or utilization. A diligence decision should therefore treat contract value and funding as pipeline and capacity signals, not as recurring customer economics.
    claimRefs: [CU012, CU013, CU014, CU015]
