    columns: [Metric, Value, Date, Source and confidence, Implication, Missing denominator]
    rows:
      - [Royal Navy contract, "20 USVs; £12.3 million", "2026", "Naval News; high", "Named sovereign program and initial fleet scale", "Delivered and operational units"]
      - [USSOCOM agreement, "Up to $49 million", "2025-2026 coverage", "UK Defence Journal; medium", "US entry and prototype expansion path", "Funded amount, milestones, and conversion to production"]
      - [K3 SCOUT adoption signal, "DSEI demonstrations with UK MOD; reported use with MOD and allied nations", "2025", "Army Recognition; medium", "Shows trials and reference visibility", "Number of operators, missions, and measured outcomes"]
      - [Manufacturing scale signal, "Around 200 units/year initially; scalable to 1,000", "2026", "Naval News / Rheinmetall; medium", "Partner capacity could support larger deployments", "Actual orders, utilization, and customer-funded production"]
    notes: "Values mix contract awards, agreement ceilings, reported deployment signals, and partner capacity; no common denominator supports a single growth rate."
    claimRefs: [CU001, CU006, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment / use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [UK Ministry of Defence / Royal Navy, "UK sovereign defence", "Project Beehive; 20 USVs plus training and warfare development", "Contracted delivery; production status not fully disclosed", "Hybrid-fleet transition and autonomous-technology development", "No public acceptance, utilization, or renewal metrics"]
      - [USSOCOM, "US special operations", "Prototype uncrewed surface and subsurface vessels with modular payload bays", "Agreement / prototyping", "Rapid-prototyping and operator-informed design route", "Maximum agreement value is not the same as revenue recognized"]
      - [NATO and allied nations, "Allied defence", "Task Force-X and related maritime operations", "Exercises and reported operational use", "Interoperability and mission-reference signal", "Named countries, fleet counts, and measured outcomes are incomplete"]
      - [Rheinmetall / Blohm+Voss, "Industrial partner supporting defence supply", "Series production of K3 SCOUT in Hamburg", "Production partnership, not an end-customer deployment", "Potential capacity and localization for future orders", "Order book and customer allocation are not public"]
    enumerationScope:
      coverage: partial
      basis: "Publicly named customer and deployment references found in assigned sources through 2026-10-25; private and undisclosed programs are excluded."
    notes: "Enumeration is partial and distinguishes customer programs from industrial partners; production status and outcomes are reported only where the source states them."
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from contract to scaled deployment
    type: journey-map
    summary: Public evidence moves from sovereign requirement and trial activity toward contracted delivery and partner-enabled production, with retention and utilization still unobserved.
    data:
      items:
        - label: Requirement and trial
          title: Operator-shaped validation
          detail: NATO Task Force-X and UK MOD demonstrations expose the platform to operational users.
          touchpoints: ["NATO Task Force-X", "UK MOD DSEI demonstrations"]
        - label: Contract and prototype
          title: Named government programs
          detail: Project Beehive covers 20 USVs; USSOCOM provides an OTA prototyping route.
          touchpoints: ["Royal Navy / SURFLOT", "USSOCOM"]
        - label: Delivery and integration
          title: Training and mission development
          detail: The Royal Navy scope includes training, tactical development, and warfare development.
          touchpoints: ["Training", "Tactical development", "Modular payload integration"]
        - label: Scale and expansion
          title: Localized production
          detail: Rheinmetall and other manufacturing relationships may enable allied deployment scale.
          touchpoints: ["Rheinmetall / Blohm+Voss", "Anduril", "Inocea / Davie"]
        - label: Durability checkpoint
          title: Unobserved commercial proof
          detail: Public sources do not disclose renewal, utilization, churn, or customer concentration.
          touchpoints: ["Renewal evidence unavailable", "Utilization denominator unavailable"]
        - label: Diligence handoff
          title: Evidence request
          detail: Obtain contract, delivery, acceptance, renewal, utilization, and concentration schedules before underwriting scale.
          touchpoints: ["Contract register", "Cohort and renewal data"]
    claimRefs: [CU001, CU006, CU007, CU008, CU012, CU013]
callouts:
  - calloutType: recommendation
    title: Ask for customer economics before underwriting scale
    body: Request executed contract values, delivery and acceptance records, funded versus ceiling amounts, repeat-order history, utilization, renewal or option exercise, and customer concentration by revenue.
    claimRefs: [CU012, CU013, CU014, CU015]
