      - [US special operations, "Buyer: USSOCOM; users: special-operations forces", "Prototype surface and subsurface vessels with modular payloads", "Agreement worth up to $49 million; rapid-prototyping route", "Award ceiling, funded value, delivery status, and field outcomes are not disclosed"]
      - [NATO and allied forces, "Sovereign defence buyers and operators", "Task Force-X, ISR, logistics, force protection, and contested-littoral missions", "Allied interoperability and reference value", "Country-by-country deployments and paid contract values are not enumerated"]
      - [Industrial and manufacturing partners, "Partners: Rheinmetall, Anduril, Inocea / Davie", "Localized production and integration for defence customers", "Potential scale and export access rather than end-customer revenue", "Partner economics, exclusivity, and order allocation are not public"]
    notes: "Sources are public reports and a regulatory filing-history page; rows describe evidenced segments and strategic roles, not a complete customer population or revenue segmentation."
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
