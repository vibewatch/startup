company:
  name: Kraken Technology Group
chapter:
  number: 3
  title: Competitors
  summary: Kraken competes in a fragmented uncrewed maritime market where platform performance, sovereign procurement access, production partnerships, and autonomy ecosystems matter more than a simple feature checklist. Public evidence shows credible UK and allied adoption, but leaves direct price, realized scale, and comparative reliability largely undisclosed.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: >-
      Kraken's closest disclosed alternatives are other uncrewed-surface-vessel
      providers, but the competitive set also includes incumbent defense primes,
      shipbuilders, autonomy-software ecosystems, and crewed or internally built
      fleets. Armada reports a £12.3 million Royal Navy contract for 20 K3 Scout
      vessels and separately identifies ZeroUSV's Oceanus 12 as a UK alternative
      used in NATO exercises. Army Recognition places K3 Scout on a UK Ministry
      of Defence stand and describes cooperation with NVL, while also reporting
      that Kraken's platform is already used by the UK and allied nations. These
      facts support customer access and industrial partnering as current
      differentiators, not proof of a durable moat. PX4 illustrates an adjacent
      open-source autonomy ecosystem: it supports consumer and industrial drones
      and has also been applied to underwater vehicles and boats. That lowers
      software switching friction for some integrators while increasing the
      importance of validated maritime deployment, payload integration, and
      support.
    claimRefs: [CP001, CP002, CP003, CP004, CP014]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability
    title: Capability, distribution, and trust comparison
    body: >-
      Public descriptions point to a capability contest rather than a
      standardized price comparison. Army Recognition describes K3 Scout as an
      eight-metre vessel with a 55-knot maximum speed, 600-kilogram payload,
      and 650-nautical-mile range, with modular payloads spanning ISR, mine
      countermeasures, and logistics. EU-Startups describes K3 Scout, K5
      Kraken, and K4 Manta as modular platforms covering awareness, force
      protection, logistics, strike, anti-submarine warfare, and covert
      roles. Armada reports Anduril's collaboration with Kraken to manufacture
      K5 and K7 vessels in the United States, while Rheinmetall Kraken GmbH
      provides German production. This partner-led route may improve sovereign
      distribution and support, but it also creates integration, quality,
      export-control, and partner-governance dependencies. No assigned source
      provides list or realized pricing for Kraken, ZeroUSV, Anduril, or PX4;
      matrix cells therefore remain unknown rather than inferred.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: durability
    title: Switching costs, displacement risk, and moat durability
    body: >-
      Kraken's apparent moat is strongest where procurement proof, operational
      testing, and localized manufacturing compound. Armada's account links K3
      Scout to Royal Navy operations and a USSOCOM contract, while Army
      Recognition describes live and static demonstrations with the UK Ministry
      of Defence and a partnership intended to expand European autonomous naval
      production. The countercase is that alternatives are also accumulating
      institutional proof: Armada describes ZeroUSV participation in NATO
      exercises and DASA trials, and identifies Anduril's manufacturing and
      autonomy role in US Navy programs. The First Sea Lord says the Royal Navy
      has received 20 Kraken boats for 47 Commando training and operations,
      strengthening the customer proof but not establishing renewal or
      exclusivity. PX4's vendor-neutral ecosystem shows that some autonomy
      components can be multi-homed or replaced at the software layer, while
      Fortune Business Insights identifies cyberattack exposure as a constraint
      on autonomous ships. The evidence supports a qualified differentiation
      thesis: sovereign relationships, platform integration, and production
      readiness may raise switching costs, but public data does not establish
      exclusive contracts, renewal rates, field reliability, or customer
      concentration. Those omissions are material to underwriting durability.
    claimRefs: [CP009, CP010, CP011, CP012, CP015, CP016]
callouts:
  - calloutType: strength
    title: Institutional access is a real competitive asset
    body: UK and allied demonstrations, contracts, and manufacturing partnerships provide stronger market access evidence than a product brochure alone, although contract economics and renewals remain undisclosed.
    claimRefs: [CP001, CP003, CP007]
  - calloutType: risk
    title: Production and software ecosystems can narrow differentiation
    body: Anduril, ZeroUSV, Rheinmetall, and open-source autonomy ecosystems show that competitors can combine platform manufacturing, payload integration, and distribution; Kraken's relative reliability and economics are not publicly benchmarked.
    claimRefs: [CP008, CP010, CP011]
