company:
  name: Kraken Technology Group
chapter:
  number: 5
  title: Product & Technology
  summary: Kraken is developing modular uncrewed surface and subsurface vessels for defence and commercial maritime missions, with public evidence of prototype work, a deployable K3 SCOUT programme, and an open-architecture K4 MANTA design. The public record supports a credible product architecture and government-facing development path, but detailed reliability, autonomy validation, cybersecurity controls, and manufacturing quality evidence remain limited.
sections:
  - id: product-system-and-mission
    title: Product system and mission
    body: >-
      Kraken's public product set is a family of composite maritime platforms rather than a single
      software product. EU-Startups describes K3 SCOUT as a modular uncrewed surface vessel for
      maritime awareness, force protection, logistics and precision strike; K5 KRAKEN as a
      high-endurance, high-payload surface vessel for strike, anti-submarine warfare, forward
      screening and multi-domain operations; and K4 MANTA as a surface vessel that can submerge for
      covert infiltration, persistent reconnaissance or loitering. Military Embedded Systems adds
      that K4 MANTA is being tailored for USSOCOM and can operate independently, in a swarm or as
      a node in a networked hybrid force. This is a differentiated mission architecture, but most
      public descriptions remain company- or media-reported rather than independently measured.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture, payloads and deployment
    body: >-
      The strongest technical evidence points to modular payload integration and an open interface
      model. Military Embedded Systems reports that K4 MANTA has an open architecture, swappable
      sensor suites, E/O, radar and sonar capabilities, and an Auterion operating system. The same
      report says the vehicle is transportable by air, land and sea and can be launched and
      recovered autonomously from shore or at sea. USSOCOM's OTA description, reported by Baird
      Maritime, adds advanced materials, stealth characteristics, modular mission payload
      integration, autonomous navigation and scalable sensors for ISR, logistics and direct action.
      These features make the platform adaptable across missions, while also creating integration,
      validation and supply-chain dependencies that are not quantified in the public record.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-operating-model
    title: Maturity and operating model
    body: >-
      Public evidence spans prototype development, demonstrations and an initial operational
      delivery programme. Military Embedded Systems says USSOCOM awarded Kraken an OTA agreement in
      2025 for rapid development and prototyping, while its May 2026 report describes multiple K4
      MANTA demonstrations at SOF Week. The same source says the K3 SCOUT was selected for the
      British Navy's Project Beehive programme in 2025 and that the formal contract finalized in
      March 2026 covered 20 platforms. Baird Maritime separately reports a USSOCOM OTA agreement
      capped at $49 million for prototype vessels. Companies House classifies Kraken Technology
      Group Limited as an active private company incorporated in December 2020 and lists its
      business as other manufacturing not elsewhere classified. The evidence supports commercial
      and government programme maturity, but not fleet-wide reliability or production-rate proof.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-gaps-and-diligence
    title: Trust, safety and implementation gaps
    body: >-
      The public materials establish mission use cases and selected platform features, but they do
      not establish a complete assurance case. PX4 documents the broader open-source autonomy
      ecosystem as applicable to underwater vehicles and boats, while Auterion describes its own
      onboard operating system, fleet-management suite and mission-control products; neither source
      is a Kraken-specific independent test of safety, security or uptime. The reviewed sources do
      not provide Kraken-specific cyber-assurance attestations, incident history, mean time between
      failures, autonomy performance by environment, software update controls, export-control
      ownership or supplier-quality metrics. Those omissions matter because modular payloads,
      autonomous launch and recovery, submerged operation and localized manufacturing multiply
      integration and mission-assurance risks. Procurement diligence should therefore request test
      reports, configuration-control records, cyber accreditation, failure data, acceptance
      criteria and production traceability.
    claimRefs: [CE013, CE014, CE015, CE016]
