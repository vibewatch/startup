company:
  name: Kraken Technology Group
chapter:
  number: 7
  title: Risks
  summary: Kraken's principal risks are execution and assurance risks associated with scaling autonomous maritime systems into defence procurement and multinational production. Public evidence shows a tightening regulatory and certification environment, multiple manufacturing dependencies, and limited disclosure of company-specific reliability, export-control, concentration, and financial resilience metrics.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Autonomous maritime systems face a changing safety and assurance regime rather than a single approval event. The International Maritime Organization states that it adopted a Maritime Autonomous Surface Ships Code in May 2026 and that the code takes effect on 1 July 2026. ABS describes its 2024 requirements as applying to vessels fitted with autonomous or remote-control functions and says that the October 2024 edition incorporates cyber-resilience requirements. Lloyd's Register separately identifies certification, safe navigation, remote operating centres, and cybersecurity as operational challenges. For Kraken, this creates a material risk that each mission profile, vessel class, payload, flag-state arrangement, and operating geography requires additional evidence and assurance work. The public pool does not establish Kraken's approvals, certification status, export-control ownership, or incident history; those are diligence gaps, not evidence of non-compliance.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, and security risk
    body: The operating environment is technically demanding and the public evidence is largely descriptive rather than a reliability dataset. Army Recognition reports that K3 SCOUT was shown in both static and dynamic demonstrations with the UK Ministry of Defence and describes an eight-metre vessel with stated speed, payload, and range characteristics. The same report says the company had more than one hundred employees and a newly established multi-million-pound facility. Those reports support deployment and scale signals, but they do not disclose failure rates, mean time between failures, cyber incidents, mission aborts, warranty exposure, safety cases, or fleet utilization. The mitigation priority is therefore to obtain platform-level reliability, test, incident, cyber, and quality-control evidence before treating operational claims as durable proof.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partners-financial-execution
    title: Partner, financial, and execution dependencies
    body: Kraken's international scale-up depends on counterparties and on defence procurement pathways that are outside its direct control. The funding coverage identifies manufacturing partnerships with Rheinmetall in Germany, Anduril in the United States, and Inocea's Davie Shipbuilding in Canada; the Army Recognition article also reports a partnership with NVL intended to support European production and supply chains. These relationships can expand capacity, but they introduce qualification, quality, schedule, geopolitical, export, and partner-priority dependencies. UK Ministry of Defence guidance says procurement includes routes for SMEs and that rapid commercial exploitation covers emerging technologies such as uncrewed systems, while also emphasizing export licences and sanctions awareness. Companies House records show 2025 accounts were filed on 29 September 2026 and share allotment filings followed in July and August 2026, but the fetched filing-history page does not expose recognized revenue, cash burn, backlog, margins, debt, or liquidity. The resulting financial risk is not a quantified insolvency claim; it is a requirement to verify cash runway, working capital, milestone funding, concentration, and capital-structure terms.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk or rule, Jurisdiction, Evidence status, Likelihood, Severity, Mitigation and residual exposure, Diligence path]
    rows:
      - [MASS safety and operating-code transition, International, "IMO says MASS Code adopted May 2026; effective 1 July 2026", medium, high, "Certification and operating procedures must track the new framework; residual exposure is high until Kraken-specific applicability and approvals are documented.", "Map every platform and mission to flag-state, port-state, and MASS Code requirements."]
      - [Autonomous and remote-control classification, International, "ABS 2024 requirements apply to vessels fitted with autonomous or remote-control functions", medium, high, "Independent testing and class/notation evidence can reduce exposure; residual exposure remains material for novel configurations.", "Obtain vessel-by-vessel class, notation, safety-case, and acceptance evidence."]
      - [Export controls and sanctions, UK/US and destination states, "MOD guidance points suppliers to export licences and sanctions regimes; company-specific status is not public", high, high, "A documented compliance programme is required; residual exposure is unknown because the assigned ITAR page was inaccessible.", "Review licence matrix, end-use controls, screening, and counsel advice before each market entry."]
      - [Cyber-resilience and software/hardware assurance, International, "ABS says its October 2024 edition incorporated IACS cyber-resilience and software/hardware requirements", medium, high, "Secure-by-design evidence and independent assessments may reduce exposure; residual exposure is unknown without Kraken test results.", "Request threat models, penetration tests, update controls, SBOMs, and incident response records."]
    notes: Sources are government, regulator, classification, and professional-assurance materials; company-specific licences and approvals are not disclosed, and the table is a partial risk register rather than an exhaustive legal opinion.
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and assurance pages in the assigned 2026 refresh pool; company-specific filings and licences are not fully available."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR013]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Autonomy or remote-control failure in high-sea-state operations, medium, high, "External assurance frameworks are described, but Kraken test evidence is not disclosed", high, "No fleet-level failure, abort, or safety-case denominator."]
      - ["Cyber compromise of autonomy, communications, or payload systems", medium, high, "ABS requirements and LR assurance practices identify cyber resilience; company implementation is unverified", high, "No company-specific cyber assessment or incident history in the assigned pool."]
      - [Manufacturing quality variance during global localization, medium, high, "Reported partners and localized-production plans may add capacity but require common QA controls", medium-high, "No supplier audit, first-article, defect, or warranty dataset."]
      - [Operational reliability and maintenance shortfall, medium, high, "Demonstrations and reported use are not equivalent to sustained fleet reliability", high, "No utilization, maintenance, MTBF, or corrective-action records."]
    notes: Likelihood and residual exposure are analytical risk ratings anchored to the cited assurance and deployment evidence; they are not company-reported probabilities.
    claimRefs: [CR003, CR006, CR007, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Defence procurement access, UK Ministry of Defence and allied buyers, "Procurement timing, acceptance, or budget changes delay conversion", high, "Use multiple procurement routes and milestone-based delivery planning", "High until backlog, acceptance, and customer concentration are verified."]
      - ["International manufacturing", "Rheinmetall, Anduril, and Inocea/Davie", "Partner capacity, priorities, export controls, or quality variance constrain delivery", high, "Documented dual-source plans, supplier QA, and local-production governance", "Medium-high; public sources identify relationships but not contractual protections."]
      - [European industrial production, NVL, "Shipbuilding integration or supply-chain execution delays scaling", medium-high, "Joint planning and acceptance milestones", "Medium-high pending production evidence."]
      - [Capital and dilution, DTCP and other investors, "Capital deployment outpaces revenue conversion or future financing becomes expensive", high, "Cash runway, milestone financing, and cap-table controls", "Unknown; public coverage gives round size and valuation but not burn or terms."]
    notes: Counterparty relationships are reported by independent coverage, while contractual concentration, exclusivity, service levels, and failure remedies remain private.
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
