callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: A failed safety or cyber acceptance test, an export-control denial or material investigation, a material manufacturing-quality incident, or evidence that cash runway does not cover the next delivery milestones would materially weaken the investment case.
    claimRefs: [CR003, CR004, CR010, CR013, CR014]
  - calloutType: insight
    title: Evidence asymmetry
    body: Kraken has public deployment, partnership, and funding signals, but the assigned pool does not disclose the operational denominators and control documents needed to convert those signals into low residual risk.
    claimRefs: [CR006, CR007, CR010, CR013, CR014]
localEvidence:
  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: export-controls
      missingEvidence: Company-specific export-control ownership, licences, sanctions screening, and ITAR or equivalent applicability for each product, payload, and destination.
      whyItMatters: The assigned government portal returned only a validation page, so public evidence does not establish whether international manufacturing and defence sales can proceed without licensing or compliance delays.
      diligencePath: Obtain the export-control matrix, named compliance owner, licence register, sanctions-screening procedure, and counsel memorandum covering UK, US, NATO, and destination-country regimes.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Fleet-level reliability, safety, cybersecurity, incident, recall, warranty, and mission-abort records by platform and operating environment.
      whyItMatters: Public coverage describes demonstrations and capabilities but does not provide denominators or failure rates needed to assess operational residual risk.
      diligencePath: Request signed test reports, incident logs, corrective-action records, cyber assessments, field-service data, and customer acceptance criteria for each deployed configuration.
      relatedQuestionRefs: [QR003, QR004, QR009]
    - type: missing-source
      severity: material
      topic: financial-resilience
      missingEvidence: Recognized revenue, backlog conversion, gross margin, cash balance, burn, runway, debt, working capital, and contract milestone economics.
      whyItMatters: The public filing-history page confirms filings and share allotments but not the financial measures needed to assess capital intensity or financing dependence.
      diligencePath: Obtain the latest management accounts, cash forecast, audited accounts, backlog schedule, debt documents, and scenario analysis through the next major delivery milestones.
      relatedQuestionRefs: [QR007]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Contract-level customer concentration, renewal or option exercise, production acceptance, and deployment utilization across UK, NATO, USSOCOM, and commercial users.
      whyItMatters: Named institutional customers and reported use are not equivalent to recurring revenue, diversified demand, or sustained utilization.
      diligencePath: Review the top-customer revenue and backlog schedule, contract terms, acceptance milestones, renewal history, and deployment telemetry under confidentiality.
      relatedQuestionRefs: [QR006]
