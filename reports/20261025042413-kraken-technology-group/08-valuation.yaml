    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, "Do not underwrite a buy without private financial and cap-table diligence."]
      - [Confidence, medium, "Strategic and financing evidence is credible, but operating disclosure is incomplete."]
      - [Risk rating, high, "Defence procurement timing, export controls, scale-up, and financing terms remain material."]
      - [Valuation stance, stretched, "A $1 billion private mark is disclosed, but public revenue and margin denominators are absent."]
      - [Target return / exit, null, "No public evidence supports a target return, exit multiple, or liquidity timetable."]
    notes: "Assessment synthesizes the assigned public sources; null means no supportable public value was found, not zero."
    claimRefs: [CV001, CV005, CV010, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Strategic demand can support scale, "Reported Ministry of Defence, NATO-partner and USSOCOM activity plus a $175 million Series B.", "Verified paid backlog, delivery cadence, and repeat procurement."]
      - [Platform breadth may improve deployment options, "Reported K3 SCOUT, K5 KRAKEN, and K4 MANTA platform families and modular payload development.", "Independent customer acceptance, reliability, and unit-cost evidence."]
      - [Valuation may already price the upside, "$1 billion round valuation with no public revenue, margin, or cash-flow denominator.", "Audited accounts and a defensible revenue or backlog-based valuation."]
      - [Execution is exposed to public-sector timing, "GAO reports delays, increased costs, and bottlenecks under continuing resolutions.", "Multi-year appropriations, contracted milestones, and cash-buffer evidence."]
      - [Cross-border delivery adds compliance friction, "UK guidance requires licences for controlled military or dual-use exports and treats unlicensed export as criminal.", "Documented export-control process, licences, and partner accountability."]
    notes: "Signals are directional rather than a full investment case; several positive operating facts originate from company-issued or syndicated material."
    claimRefs: [CV002, CV003, CV004, CV010, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Repeat procurement converts trials and OTAs into scaled production; margins and backlog are verified.", "The $1 billion mark could be justified by durable growth and improving cash conversion; no numeric target is supportable publicly.", "Programme concentration and manufacturing execution.", "Conditional, evidence gap remains material."]
      - [Base, "Strategic demand persists, but growth, margins, runway, and contract economics remain partly undisclosed.", "Hold the disclosed $1 billion mark as unproven rather than extrapolating a multiple.", "Disclosure opacity and public-budget timing.", "Most defensible pending private diligence."]
      - [Bear, "Procurement timing slips, export-control or partner constraints slow delivery, or the market compresses defence-tech multiples.", "Downside is not quantifiable from public evidence; a lower price or stronger terms would be required.", "Contract delays, cost inflation, scale-up and financing overhang.", "Plausible downside; monitor triggers."]
    notes: "Scenarios are qualitative because public sources do not provide revenue, gross margin, backlog, cash runway, cap-table preferences, or a comparable denominator."
    claimRefs: [CV005, CV006, CV007, CV008, CV010, CV011, CV012, CV013, CV015]

