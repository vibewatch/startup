company:
  name: Kraken Technology Group
chapter:
  number: 1
  title: Company Overview
  summary: Kraken Technology Group is a British maritime-defence company founded in 2021 that develops modular uncrewed surface and subsurface vessels. Independent reporting places its operating base in Fareham while a syndicated funding article calls it London-based; the public record shows contract, partnership, and financing momentum but leaves recognized revenue, backlog, margins, and governance terms unresolved.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: Kraken Technology Group is described as a British-founded maritime-defence company founded in 2021. Army Recognition and Armada International place the operating base in Fareham, while the syndicated EU-Startups funding article calls the company London-based; the current legal headquarters therefore needs primary confirmation. Its stated product set includes the K3 SCOUT and K5 KRAKEN uncrewed surface vessels and the K4 MANTA submerged-capable platform, with modular payloads and mission re-roling across surveillance, logistics, force protection, strike, and other maritime roles. Public descriptions support a dual-use defence and commercial-maritime positioning, but the assigned record does not establish pricing, recognized revenue, backlog, or a recurring-revenue model.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, financing, and scale
    body: Mal Crease is identified consistently as founder and CEO. Three substantially overlapping July 2026 reports state that Kraken raised $175 million in a Series B at a $1 billion valuation; because their wording follows the company announcement, they are treated here as company-issued evidence rather than independent corroboration. The reported round was led by DTCP and included institutional and strategic backers such as the British Business Bank, NATO Innovation Fund, Rheinmetall, and Inocea Group. These reports establish the announced financing amount, valuation, and investor roster, not cash available, recognized revenue, or valuation durability. The assigned record does not provide a complete executive team, board, ownership table, preference stack, debt overlays, or key-person mitigation plan.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones, partnerships, and diligence gaps
    body: Kraken's public operating milestones show a transition from product development to defence deployment and industrial scale-up. The assigned sources describe UK Ministry of Defence, NATO-partner, and USSOCOM activity; a Royal Navy-supported airdrop trial of a K3 SCOUT from an A400M; and manufacturing relationships involving Rheinmetall, Anduril, and Inocea's Davie Shipbuilding. Armada International and Army Recognition provide independent reporting for parts of that record, while the financing articles and Naval News airdrop text reproduce company-issued material. The evidence is therefore a meaningful demand and execution signal but not independent proof of sustained fleet utilization, renewal, or unit economics. Audited financial performance, customer concentration, broader leadership, governance, adverse-event history, and export-control evidence remain diligence gaps.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
