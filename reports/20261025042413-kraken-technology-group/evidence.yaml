evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, gross margin, backlog, cash balance, burn, and platform-level unit economics.
    whyItMatters: >-
      The financing valuation cannot be assessed against operating performance or delivery economics from the assigned
      public record.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, backlog aging, gross-margin bridge, and cash
      forecast under NDA.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, board, ownership, and succession roster.
    whyItMatters: Founder dependence and investor control cannot be evaluated from a founder-and-CEO identification alone.
    diligencePath: Obtain the current cap table, board minutes, executive biographies, delegated authorities, and succession plan.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Series B preference stack, ratchets, debt or credit overlays, and governance rights.
    whyItMatters: Headline valuation and capital raised do not establish common-equity value or investor control.
    diligencePath: Review executed financing documents, shareholder agreement, debt schedule, and investor rights matrix.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: independent-reporting
    missingEvidence: An independently accessible copy of the blocked 2026 product-demonstration report reserved in the pool.
    whyItMatters: The assigned pool contains a non-readable page, limiting corroboration for some current product claims.
    diligencePath: Replace the blocked page with a directly accessible original or independent report in the next refresh.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing-gaps
    missingEvidence: A Kraken-specific SAM and SOM by platform, payload, geography, and funded procurement program.
    whyItMatters: >-
      Headline market estimates differ by roughly five times at the 2025 base and cannot support a company valuation
      without boundary reconciliation.
    diligencePath: >-
      Request management's bottom-up opportunity model, named target programs, eligibility assumptions, and
      production-capacity constraints.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Contract delivery schedules, backlog conversion, fleet utilization, renewal or option exercise, and per-vessel
      gross margin.
    whyItMatters: Initial sovereign contracts demonstrate demand but do not establish repeatable adoption or durable economics.
    diligencePath: Obtain contract-level backlog, delivery, acceptance, sustainment, and unit-economics data under NDA.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
  - type: conflicting-data
    severity: material
    topic: market-comparability
    missingEvidence: Methodology, inclusion rules, and segment definitions for each published market estimate.
    whyItMatters: The NextMSC and Research and Markets estimates have materially different bases and forecast horizons.
    diligencePath: Acquire the full methodologies or analyst notes and reconcile platform, software, payload, and services inclusion.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: adoption-evidence
    missingEvidence: The assigned SOF Week 2026 demonstration page returned only a JavaScript verification interstitial.
    whyItMatters: The page title suggests potentially relevant demonstration evidence, but its contents cannot support a claim.
    diligencePath: >-
      Obtain an accessible copy from the publisher or verify the event through an already eligible primary source in a
      future run.
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable bid-level pricing, support costs, and lifecycle economics for Kraken and named alternatives.
    whyItMatters: >-
      Without realized pricing and support economics, capability differences cannot be translated into customer value or
      margin durability.
    diligencePath: >-
      Request anonymized bid sheets, maintenance terms, payload integration fees, and lifecycle-cost assumptions from
      management.
    relatedQuestionRefs:
      - QP004
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: Independent reliability, mission-availability, renewal, and option-exercise data by platform.
    whyItMatters: >-
      Institutional demonstrations and contracts show access but do not prove repeatable performance or durable
      switching costs.
    diligencePath: Obtain fleet availability, failure, safety, renewal, and customer-concentration data under NDA.
    relatedQuestionRefs:
