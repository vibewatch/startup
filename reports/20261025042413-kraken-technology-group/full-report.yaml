      - number: '5.2'
        title: Architecture, payloads and deployment
        blocks:
          - type: paragraph
            body: >-
              The strongest technical evidence points to modular payload integration and an open interface model.
              Military Embedded Systems reports that K4 MANTA has an open architecture, swappable sensor suites, E/O,
              radar and sonar capabilities, and an Auterion operating system. The same report says the vehicle is
              transportable by air, land and sea and can be launched and recovered autonomously from shore or at sea.
              USSOCOM's OTA description, reported by Baird Maritime, adds advanced materials, stealth characteristics,
              modular mission payload integration, autonomous navigation and scalable sensors for ISR, logistics and
              direct action. These features make the platform adaptable across missions, while also creating
              integration, validation and supply-chain dependencies that are not quantified in the public record.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.3'
        title: Maturity and operating model
        blocks:
          - type: paragraph
            body: >-
              Public evidence spans prototype development, demonstrations and an initial operational delivery programme.
              Military Embedded Systems says USSOCOM awarded Kraken an OTA agreement in 2025 for rapid development and
              prototyping, while its May 2026 report describes multiple K4 MANTA demonstrations at SOF Week. The same
              source says the K3 SCOUT was selected for the British Navy's Project Beehive programme in 2025 and that
              the formal contract finalized in March 2026 covered 20 platforms. Baird Maritime separately reports a
              USSOCOM OTA agreement capped at $49 million for prototype vessels. Companies House classifies Kraken
              Technology Group Limited as an active private company incorporated in December 2020 and lists its business
              as other manufacturing not elsewhere classified. The evidence supports commercial and government programme
              maturity, but not fleet-wide reliability or production-rate proof.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety and implementation gaps
        blocks:
          - type: paragraph
            body: >-
              The public materials establish mission use cases and selected platform features, but they do not establish
              a complete assurance case. PX4 documents the broader open-source autonomy ecosystem as applicable to
              underwater vehicles and boats, while Auterion describes its own onboard operating system, fleet-management
              suite and mission-control products; neither source is a Kraken-specific independent test of safety,
              security or uptime. The reviewed sources do not provide Kraken-specific cyber-assurance attestations,
              incident history, mean time between failures, autonomy performance by environment, software update
              controls, export-control ownership or supplier-quality metrics. Those omissions matter because modular
              payloads, autonomous launch and recovery, submerged operation and localized manufacturing multiply
              integration and mission-assurance risks. Procurement diligence should therefore request test reports,
              configuration-control records, cyber accreditation, failure data, acceptance criteria and production
              traceability.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular mission architecture
            body: >-
              The combination of interchangeable payloads, open architecture and surface/subsurface operation gives
              Kraken a credible route to adapt one platform family across several defence missions.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: callout
            title: Assurance evidence is the gating issue
            body: >-
              Public sources describe capability and programme milestones more clearly than they document reliability,
              cyber assurance, autonomy validation or repeatable manufacturing quality.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE013
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              Kraken sells into sovereign and allied defence workflows where the buyer, operator, and payer can differ.
              The Royal Navy contract identifies the Ministry of Defence as contracting customer, SURFLOT and Coastal
              Forces as operating stakeholders, and training and warfare development as part of the delivered scope. The
              USSOCOM agreement adds a US special-operations buyer and a rapid-prototyping route. Public reporting also
              describes NATO Task Force-X activity and allied-nation use, while the company’s disclosed manufacturing
              relationships show that production partners may be operationally important without being end customers.
              There is therefore credible evidence of institutional demand, but not a public customer ledger,
              active-account denominator, or revenue split by buyer.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Named customer proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence is tied to named public-sector programs rather than anonymous logos. Naval
              News reports that Kraken will deliver 20 UK-built USVs under Project Beehive and support training,
              tactical development, and further autonomous-technology uses; the USSOCOM report describes prototype craft
              with modular payload bays and operator-shaped design choices. Armada identifies the £12.3 million Royal
              Navy award, a $49 million USSOCOM OTA, and Anduril and Rheinmetall manufacturing relationships, while Army
              Recognition reports K3 SCOUT demonstrations with the UK Ministry of Defence and says the platform is
              already in use with the MOD and allied nations. These sources establish adoption surfaces and program
              progression, not production fleet utilization, outcomes, or renewal behavior.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
