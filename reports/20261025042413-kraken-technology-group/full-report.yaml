            body: >-
              Mal Crease is identified consistently as founder and CEO. Three substantially overlapping July 2026
              reports state that Kraken raised $175 million in a Series B at a $1 billion valuation; because their
              wording follows the company announcement, they are treated here as company-issued evidence rather than
              independent corroboration. The reported round was led by DTCP and included institutional and strategic
              backers such as the British Business Bank, NATO Innovation Fund, Rheinmetall, and Inocea Group. These
              reports establish the announced financing amount, valuation, and investor roster, not cash available,
              recognized revenue, or valuation durability. The assigned record does not provide a complete executive
