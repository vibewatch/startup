    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Kraken Technology Group is described as a British-founded maritime-defence company founded in 2021. Army
              Recognition and Armada International place the operating base in Fareham, while the syndicated EU-Startups
              funding article calls the company London-based; the current legal headquarters therefore needs primary
              confirmation. Its stated product set includes the K3 SCOUT and K5 KRAKEN uncrewed surface vessels and the
              K4 MANTA submerged-capable platform, with modular payloads and mission re-roling across surveillance,
              logistics, force protection, strike, and other maritime roles. Public descriptions support a dual-use
              defence and commercial-maritime positioning, but the assigned record does not establish pricing,
              recognized revenue, backlog, or a recurring-revenue model.
