  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is autonomous and uncrewed maritime defense capability: surface and subsurface
              vessels, autonomy, mission payloads, communications, and integration sold to navies, defense forces, coast
              guards, and allied security operators. It includes procurement of platforms and mission systems that can
              perform surveillance, reconnaissance, mine countermeasures, logistics, force protection, or anti-submarine
              missions. It excludes general commercial shipping, consumer drones, and broad naval procurement that does
              not contain an autonomous or uncrewed component. Research and Markets describes autonomous naval vessels
              as unmanned systems operating on or beneath the ocean with little to no human intervention, and identifies
              surface and subsurface types, autonomy levels, propulsion categories, and end users spanning defense,
              coast guards, research, and environmental organizations (SM002). That breadth is wider than Kraken's
              dual-use composite littoral platforms, so headline market values should not be treated as Kraken's
              addressable revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and comparability limits
        blocks:
          - type: paragraph
            body: >-
              Two published estimates establish a range rather than a single investable TAM. NextMSC estimates the
              global autonomous maritime defense systems market at USD 9.50 billion in 2025, USD 10.54 billion in 2026,
              and USD 26.73 billion in 2035, with a 10.90% CAGR from 2026 to 2035 (SM001). Research and Markets reports
              a narrower autonomous naval-vessel market of USD 1.56 billion in 2025, USD 1.70 billion in 2026, and USD
              2.40 billion in 2030, with a 9% CAGR for 2025-2026 and again describes surface/subsurface, autonomy,
              propulsion, and end-user segments (SM002). The approximately five-fold difference between the two 2025
              bases is a boundary and methodology signal, not a contradiction that can be averaged away. A
              Kraken-specific SAM would require filtering for littoral defense platforms, payload and autonomy
              integration, target geographies, procurement eligibility, and production capacity; the assigned sources do
              not provide those filters. The figure therefore presents the two source lenses as ordered evidence, not a
              combined funnel or derived share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM013
      - number: '2.3'
        title: Buyers, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The immediate buyer is a defense ministry, navy, or special-operations organization; the operator is a
              naval or maritime unit; and the budget owner is a national defense or security procurement authority. The
              adoption path is visible in the evidence: operational demonstrations and trials establish mission
              performance, initial contracts validate a use case, allied or partner production expands supply, and fleet
              integration, training, and sustainment determine scale. Army Recognition reports that K3 SCOUT was
              displayed on a UK Ministry of Defence stand and participated in live sea demonstrations, while Armada
              reports a £12.3 million Royal Navy contract for 20 K3 Scout vessels for operations, training, and
              autonomous-technology development and a US$49 million USSOCOM contract for contested-littoral ISR and
              direct-action missions (SM005; SM006). Those awards are company-specific proof of procurement traction,
              not a market-wide conversion rate. Constraints include mission reliability in high sea states,
              interoperability and payload integration, cyber and communications assurance, export controls, production
              capacity, and long public-sector procurement cycles. The market reports also identify integration,
              infrastructure, technology dependence, tariffs, and uneven defense budgets as scaling bottlenecks (SM001;
              SM002).
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption timing and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term market signal is not a generic growth rate but the transition from demonstrations
              to repeatable sovereign procurement. Kraken's reported UK and US contracts, live demonstrations, and
              manufacturing relationships support a path from mission validation to allied deployment, while the market
              reports point to naval modernization, maritime surveillance, modular payloads, and maritime-security
              demand as drivers. However, the assigned evidence does not disclose Kraken's backlog conversion, renewal
              behavior, gross margin, per-vessel economics, or share of any market estimate. The valuation implication
              is therefore asymmetric: sector growth and public contracts can support a large opportunity, but the
              public record cannot yet translate that opportunity into a defensible company-level SAM, SOM, or revenue
              forecast. A diligence process should request contract scope and delivery schedules, funded procurement
              programs by geography, fleet utilization and reliability metrics, payload and autonomy certification
              requirements, and production bottleneck data before underwriting scale.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Opportunity is real, but the TAM range is boundary-sensitive
            body: >-
              Public estimates span USD 1.56 billion to USD 9.50 billion for 2025 because the sources describe different
              market scopes. Kraken's company-level opportunity should be underwritten from eligible procurement
              programs and production capacity, not by selecting the largest headline.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM007
          - type: callout
            title: Procurement conversion remains the key market risk
            body: >-
              Demonstrations and initial contracts establish demand, but the assigned sources do not disclose repeat
              orders, delivery cadence, utilization, renewal, or unit economics needed to assess durable adoption.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Kraken's closest disclosed alternatives are other uncrewed-surface-vessel providers, but the competitive
              set also includes incumbent defense primes, shipbuilders, autonomy-software ecosystems, and crewed or
              internally built fleets. Armada reports a £12.3 million Royal Navy contract for 20 K3 Scout vessels and
              separately identifies ZeroUSV's Oceanus 12 as a UK alternative used in NATO exercises. Army Recognition
              places K3 Scout on a UK Ministry of Defence stand and describes cooperation with NVL, while also reporting
              that Kraken's platform is already used by the UK and allied nations. These facts support customer access
              and industrial partnering as current differentiators, not proof of a durable moat. PX4 illustrates an
              adjacent open-source autonomy ecosystem: it supports consumer and industrial drones and has also been
              applied to underwater vehicles and boats. That lowers software switching friction for some integrators
              while increasing the importance of validated maritime deployment, payload integration, and support.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP010
              - CP011
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Public descriptions point to a capability contest rather than a standardized price comparison. Army
              Recognition describes K3 Scout as an eight-metre vessel with a 55-knot maximum speed, 600-kilogram
              payload, and 650-nautical-mile range, with modular payloads spanning ISR, mine countermeasures, and
              logistics. EU-Startups describes K3 Scout, K5 Kraken, and K4 Manta as modular platforms covering
              awareness, force protection, logistics, strike, anti-submarine warfare, and covert roles. Armada reports
              Anduril's collaboration with Kraken to manufacture K5 and K7 vessels in the United States, while
              Rheinmetall Kraken GmbH provides German production. This partner-led route may improve sovereign
              distribution and support, but it also creates integration, quality, export-control, and partner-governance
              dependencies. No assigned source provides list or realized pricing for Kraken, ZeroUSV, Anduril, or PX4;
              matrix cells therefore remain unknown rather than inferred.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP008
              - CP011
              - CP013
      - number: '3.3'
        title: Switching costs, displacement risk, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Kraken's apparent moat is strongest where procurement proof, operational testing, and localized
              manufacturing compound. Armada's account links K3 Scout to Royal Navy operations and a USSOCOM contract,
              while Army Recognition describes live and static demonstrations with the UK Ministry of Defence and a
              partnership intended to expand European autonomous naval production. The countercase is that alternatives
              are also accumulating institutional proof: Armada describes ZeroUSV participation in NATO exercises and
              DASA trials, and identifies Anduril's manufacturing and autonomy role in US Navy programs. The First Sea
              Lord says the Royal Navy has received 20 Kraken boats for 47 Commando training and operations,
              strengthening the customer proof but not establishing renewal or exclusivity. PX4's vendor-neutral
              ecosystem shows that some autonomy components can be multi-homed or replaced at the software layer, while
              Fortune Business Insights identifies cyberattack exposure as a constraint on autonomous ships. The
              evidence supports a qualified differentiation thesis: sovereign relationships, platform integration, and
              production readiness may raise switching costs, but public data does not establish exclusive contracts,
              renewal rates, field reliability, or customer concentration. Those omissions are material to underwriting
              durability.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Institutional access is a real competitive asset
            body: >-
              UK and allied demonstrations, contracts, and manufacturing partnerships provide stronger market access
              evidence than a product brochure alone, although contract economics and renewals remain undisclosed.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP007
          - type: callout
            title: Production and software ecosystems can narrow differentiation
            body: >-
              Anduril, ZeroUSV, Rheinmetall, and open-source autonomy ecosystems show that competitors can combine
              platform manufacturing, payload integration, and distribution; Kraken's relative reliability and economics
              are not publicly benchmarked.
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and contract evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a project- and contract-led revenue model rather than transparent recurring
              software revenue. Armada reports a £12.3 million Royal Navy contract for 20 K3 Scout vessels and a US$49
              million USSOCOM contract for K3 Scout vessels, while also describing Anduril-manufactured K5 and K7
              platforms with maintenance and support. These are contract values or awards, not recognized revenue,
              backlog, annual recurring revenue, or cash receipts. The per-vessel arithmetic implied by the Royal Navy
              award is approximately £0.615 million, but that is a simple division of an award value and should not be
              treated as realized ASP: the contract may include training, payloads, support, options, or other
              deliverables. The company’s product mix and international manufacturing partners suggest multiple
              monetization components—platform sales, payload integration, support, and potentially production or
              deployment services—but list pricing and realized mix are not public. This distinction is central to
              underwriting because a growing contract headline can coexist with uneven milestone timing and high
              working-capital needs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI011
      - number: '4.2'
        title: Pricing, costs, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a public price list, gross margin, contribution margin, CAC, sales payback,
              renewal rate, or platform-level unit economics. The available contract disclosures are useful pricing
              proxies but not comparable list prices: the Royal Navy award covers 20 vessels, and the USSOCOM figure is
              described as a contract rather than a unit price. Cost structure is likely shaped by composite vessel
              production, payload integration, autonomy software, testing, logistics, support, and partner
              manufacturing, but the evidence does not quantify any of those components. Armada's coverage also
              identifies a competing UK supplier with Royal Navy and NATO activity, which is an adverse signal for
              assumed pricing power. The cited multi-million-pound facility and localized production expansion indicate
              upfront capacity commitments, while Germany, the United States, and Canada manufacturing relationships may
              reduce delivery bottlenecks but can also add partner-margin, qualification, and coordination costs. Those
              are underwriting hypotheses, not reported expenses. A diligence model should therefore request
              contract-level bill of materials, labor hours, payload and software attach rates, warranty and support
              reserves, partner transfer prices, milestone billing, and cash conversion by program before inferring a
              margin path.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Kraken announced a US$175 million Series B at a US$1 billion valuation, led by DTCP and supported by
              strategic and institutional investors. Smart Maritime Network says the proceeds are intended to develop
              uncrewed surface vessels and payload capabilities and expand localized manufacturing; Pulse 2 similarly
              describes product development, production capacity, and global deployment. The financing improves the
              company’s disclosed capital base, but it does not establish cash on hand, post-money cash available, burn
              rate, runway, debt, liquidation preferences, or the amount already committed to facilities and inventory.
              NATO’s 2025 commitment to invest 5% of GDP annually on defence and security by 2035 is a supportive demand
              backdrop, not a Kraken sales forecast. The capital plan is therefore strategically plausible but
              financially opaque: the key risk is that manufacturing scale, certification, deployment support, or
              contract working capital consumes the round faster than milestone collections replenish it. Public sources
              do not permit a reliable runway calculation.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strongest on external financing and visible contract demand, and weakest on
              conversion of awards into recognized revenue and free cash flow. Independent coverage corroborates the
              Series B headline and valuation, while the contract evidence provides two concrete demand signals.
              However, no assigned source discloses audited accounts, revenue recognition policy, backlog
              reconciliation, gross margin, customer concentration, cash balance, debt, or runway. The company’s
              expansion strategy also creates execution exposure: a distributed manufacturing footprint can support
              sovereign procurement and local production, but it may increase fixed costs and program complexity before
              volume is proven. The underwriting conclusion is research-more rather than a quantified margin or
              valuation call. Before relying on the $1 billion valuation, an investor should obtain monthly management
              accounts, contracted backlog by customer and delivery milestone, cash-flow forecast, financing terms,
              program gross margins, warranty exposure, and evidence that production partners can meet quality and
              schedule obligations.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital and demand are externally visible
            body: >-
              The Series B and two disclosed defense-contract values provide concrete evidence of financing access and
              customer demand, even though they do not establish recognized revenue or profitability.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI009
          - type: callout
            title: Award value is not cash flow
            body: >-
              Contract totals, funding raised, and a valuation headline cannot substitute for backlog conversion, cash
              balance, burn, gross margin, or financing-term diligence.
            calloutType: risk
            claimRefs:
              - CI006
              - CI011
              - CI015
          - type: callout
            title: Underwrite only after program-level economics are provided
            body: >-
              Request audited or management accounts, contract milestones, program gross margins, working-capital
              requirements, and financing terms before underwriting the valuation or runway.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and mission
        blocks:
          - type: paragraph
            body: >-
              Kraken's public product set is a family of composite maritime platforms rather than a single software
              product. EU-Startups describes K3 SCOUT as a modular uncrewed surface vessel for maritime awareness, force
              protection, logistics and precision strike; K5 KRAKEN as a high-endurance, high-payload surface vessel for
              strike, anti-submarine warfare, forward screening and multi-domain operations; and K4 MANTA as a surface
              vessel that can submerge for covert infiltration, persistent reconnaissance or loitering. Military
              Embedded Systems adds that K4 MANTA is being tailored for USSOCOM and can operate independently, in a
              swarm or as a node in a networked hybrid force. This is a differentiated mission architecture, but most
              public descriptions remain company- or media-reported rather than independently measured.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
