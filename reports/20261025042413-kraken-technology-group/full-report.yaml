              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
              - CU012
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration visibility
        blocks:
          - type: paragraph
            body: >-
              Kraken’s disclosed path is expansion through defence programs, allied procurement, and localized
              manufacturing rather than a conventional software land-and-expand motion. Project Beehive includes
              training and warfare development, which can create follow-on adoption opportunities, and the USSOCOM OTA
              is explicitly positioned as a route to further collaboration. The Series B coverage says capital will
              support global rollout and localized manufacturing, but neither that coverage nor the Companies House
              filing-history page discloses recognized revenue, contract backlog, renewal rates, churn, gross margin,
              customer concentration, or utilization. A diligence decision should therefore treat contract value and
              funding as pipeline and capacity signals, not as recurring customer economics.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Ask for customer economics before underwriting scale
            body: >-
              Request executed contract values, delivery and acceptance records, funded versus ceiling amounts,
              repeat-order history, utilization, renewal or option exercise, and customer concentration by revenue.
            calloutType: recommendation
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Autonomous maritime systems face a changing safety and assurance regime rather than a single approval
              event. The International Maritime Organization states that it adopted a Maritime Autonomous Surface Ships
              Code in May 2026 and that the code takes effect on 1 July 2026. ABS describes its 2024 requirements as
              applying to vessels fitted with autonomous or remote-control functions and says that the October 2024
              edition incorporates cyber-resilience requirements. Lloyd's Register separately identifies certification,
              safe navigation, remote operating centres, and cybersecurity as operational challenges. For Kraken, this
              creates a material risk that each mission profile, vessel class, payload, flag-state arrangement, and
              operating geography requires additional evidence and assurance work. The public pool does not establish
              Kraken's approvals, certification status, export-control ownership, or incident history; those are
              diligence gaps, not evidence of non-compliance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The operating environment is technically demanding and the public evidence is largely descriptive rather
              than a reliability dataset. Army Recognition reports that K3 SCOUT was shown in both static and dynamic
              demonstrations with the UK Ministry of Defence and describes an eight-metre vessel with stated speed,
              payload, and range characteristics. The same report says the company had more than one hundred employees
              and a newly established multi-million-pound facility. Those reports support deployment and scale signals,
              but they do not disclose failure rates, mean time between failures, cyber incidents, mission aborts,
              warranty exposure, safety cases, or fleet utilization. The mitigation priority is therefore to obtain
              platform-level reliability, test, incident, cyber, and quality-control evidence before treating
              operational claims as durable proof.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Kraken's international scale-up depends on counterparties and on defence procurement pathways that are
              outside its direct control. The funding coverage identifies manufacturing partnerships with Rheinmetall in
              Germany, Anduril in the United States, and Inocea's Davie Shipbuilding in Canada; the Army Recognition
              article also reports a partnership with NVL intended to support European production and supply chains.
              These relationships can expand capacity, but they introduce qualification, quality, schedule,
              geopolitical, export, and partner-priority dependencies. UK Ministry of Defence guidance says procurement
              includes routes for SMEs and that rapid commercial exploitation covers emerging technologies such as
              uncrewed systems, while also emphasizing export licences and sanctions awareness. Companies House records
              show 2025 accounts were filed on 29 September 2026 and share allotment filings followed in July and August
              2026, but the fetched filing-history page does not expose recognized revenue, cash burn, backlog, margins,
              debt, or liquidity. The resulting financial risk is not a quantified insolvency claim; it is a requirement
              to verify cash runway, working capital, milestone funding, concentration, and capital-structure terms.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              A failed safety or cyber acceptance test, an export-control denial or material investigation, a material
              manufacturing-quality incident, or evidence that cash runway does not cover the next delivery milestones
              would materially weaken the investment case.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR013
              - CR014
          - type: callout
            title: Evidence asymmetry
            body: >-
              Kraken has public deployment, partnership, and funding signals, but the assigned pool does not disclose
              the operational denominators and control documents needed to convert those signals into low residual risk.
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Kraken's investable thesis is that a large, strategically aligned financing can fund a dual-use
              autonomous-maritime platform with visible defence demand, manufacturing partnerships, and programme
              validation. The July 2026 reporting describes a $175 million Series B at a $1 billion valuation, with DTCP
              leading and the British Business Bank, NATO Innovation Fund, Rheinmetall, Inocea Group and other investors
              participating. Company-issued material also reports a USSOCOM OTA and Royal Navy-supported trials, which
              are useful proof points but remain programme and company claims rather than audited commercial
              performance. The anti-thesis is valuation opacity: the public record does not establish recognized
              revenue, gross margin, backlog quality, renewal behaviour, unit economics, dilution, liquidation
              preferences, or cash runway. That combination makes the price-sensitive call evidence-sensitive and leaves
              a material gap between strategic validation and shareholder return evidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
              - CV011
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The reported financing context is a private-company mark, not a public-market price discovery event.
              EU-Startups reports a €152.9 million ($175 million) Series B at nearly €874.1 million ($1 billion)
              valuation, while UK Defence Journal reports the same $175 million and $1 billion figures; Smart Maritime
              Network repeats the raise and says proceeds fund vessel, payload and localized manufacturing expansion.
              These sources establish the disclosed round terms but do not establish revenue multiples or a defensible
              intrinsic value. Comparable funding signals show that autonomous-defence valuations can re-rate sharply
              when contracts and platform selection arrive: CNBC reports Saronic's valuation more than doubled to $9.25
              billion after a $1.75 billion raise, and TechCrunch reports Shield AI's valuation rose 140% in one year to
              $12.7 billion. Those are contextual benchmarks, not like-for-like comparables. Entry discipline should
              therefore require verified revenue, backlog, gross margin, cash needs, cap-table terms and a price reset
              if those inputs disappoint.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A bull case is supportable only if the disclosed programme activity converts into repeatable production,
              funded procurement and acceptable margins; a base case assumes strategic demand but continued disclosure
              gaps; a bear case combines defence-budget timing, export-control friction, delayed programmes,
              manufacturing scale risk and multiple compression. GAO reports that continuing resolutions can delay
              contracts and delivery, increase costs, and create operational and spending bottlenecks across selected
              defence programmes, while UK government guidance states that exporting controlled military or dual-use
              goods, software or technology without the correct licence is a criminal offence. These are market and
              execution constraints, not a forecast of a Kraken violation. Before investing, diligence should obtain the
              Series B cap table and preference stack, audited or management accounts, backlog by customer and contract
              type, production yield and warranty data, cash runway, export-control ownership, and evidence of
              conversion from trials or OTAs into recurring paid orders. Exit readiness is therefore unproven in the
              public record.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research-more: the disclosed $1 billion valuation is not rejectable solely on strategic evidence, but it
              is not underwritable without financial, cap-table, and backlog diligence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV014
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a failure to convert programme activity into paid, repeatable production—or evidence of materially
              adverse preference, runway, export-control, or delivery terms—as a thesis-break event.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
