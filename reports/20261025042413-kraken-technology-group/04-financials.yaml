callouts:
  - calloutType: strength
    title: Capital and demand are externally visible
    body: The Series B and two disclosed defense-contract values provide concrete evidence of financing access and customer demand, even though they do not establish recognized revenue or profitability.
    claimRefs: [CI001, CI002, CI009]
  - calloutType: risk
    title: Award value is not cash flow
    body: Contract totals, funding raised, and a valuation headline cannot substitute for backlog conversion, cash balance, burn, gross margin, or financing-term diligence.
    claimRefs: [CI006, CI011, CI015]
  - calloutType: recommendation
    title: Underwrite only after program-level economics are provided
    body: Request audited or management accounts, contract milestones, program gross margins, working-capital requirements, and financing terms before underwriting the valuation or runway.
    claimRefs: [CI013, CI014, CI016]
