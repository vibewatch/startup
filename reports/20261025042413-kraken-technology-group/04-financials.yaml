company:
  name: Kraken Technology Group
chapter:
  number: 4
  title: Financials
  summary: Kraken has disclosed a large Series B and several sizable defense contracts, but public sources do not disclose recognized revenue, gross margin, cash burn, or contract economics. The evidence supports a capital-intensive, milestone-driven hardware and defense model whose underwriting still depends on private diligence.
sections:
  - id: revenue-contract-model
    title: Revenue model and contract evidence
    body: >-
      Public evidence points to a project- and contract-led revenue model rather than
      transparent recurring software revenue. Armada reports a £12.3 million Royal Navy
      contract for 20 K3 Scout vessels and a US$49 million USSOCOM contract for K3 Scout
      vessels, while also describing Anduril-manufactured K5 and K7 platforms with
      maintenance and support. These are contract values or awards, not recognized
      revenue, backlog, annual recurring revenue, or cash receipts. The per-vessel
      arithmetic implied by the Royal Navy award is approximately £0.615 million, but
      that is a simple division of an award value and should not be treated as realized
      ASP: the contract may include training, payloads, support, options, or other
      deliverables. The company’s product mix and international manufacturing partners
      suggest multiple monetization components—platform sales, payload integration,
      support, and potentially production or deployment services—but list pricing and
      realized mix are not public. This distinction is central to underwriting because
      a growing contract headline can coexist with uneven milestone timing and high
      working-capital needs.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-unit-economics
    title: Pricing, costs, and unit economics
    body: >-
      No assigned source provides a public price list, gross margin, contribution margin,
      CAC, sales payback, renewal rate, or platform-level unit economics. The available
      contract disclosures are useful pricing proxies but not comparable list prices:
      the Royal Navy award covers 20 vessels, and the USSOCOM figure is described as a
      contract rather than a unit price. Cost structure is likely shaped by composite
      vessel production, payload integration, autonomy software, testing, logistics,
      support, and partner manufacturing, but the evidence does not quantify any of
      those components. Armada's coverage also identifies a competing UK supplier with
      Royal Navy and NATO activity, which is an adverse signal for assumed pricing power.
      The cited multi-million-pound facility and localized production
      expansion indicate upfront capacity commitments, while Germany, the United States,
      and Canada manufacturing relationships may reduce delivery bottlenecks but can
      also add partner-margin, qualification, and coordination costs. Those are
      underwriting hypotheses, not reported expenses. A diligence model should therefore
      request contract-level bill of materials, labor hours, payload and software
      attach rates, warranty and support reserves, partner transfer prices, milestone
      billing, and cash conversion by program before inferring a margin path.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Kraken announced a US$175 million Series B at a US$1 billion valuation, led by
      DTCP and supported by strategic and institutional investors. Smart Maritime
      Network says the proceeds are intended to develop uncrewed surface vessels and
      payload capabilities and expand localized manufacturing; Pulse 2 similarly
      describes product development, production capacity, and global deployment. The
      financing improves the company’s disclosed capital base, but it does not establish
      cash on hand, post-money cash available, burn rate, runway, debt, liquidation
      preferences, or the amount already committed to facilities and inventory. NATO’s
      2025 commitment to invest 5% of GDP annually on defence and security by 2035 is
      a supportive demand backdrop, not a Kraken sales forecast. The capital plan is
      therefore strategically plausible but financially opaque: the key risk is that
      manufacturing scale, certification, deployment support, or contract working
      capital consumes the round faster than milestone collections replenish it. Public
      sources do not permit a reliable runway calculation.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: []
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is strongest on external financing and visible contract
      demand, and weakest on conversion of awards into recognized revenue and free
      cash flow. Independent coverage corroborates the Series B headline and valuation,
      while the contract evidence provides two concrete demand signals. However, no
      assigned source discloses audited accounts, revenue recognition policy, backlog
      reconciliation, gross margin, customer concentration, cash balance, debt, or
      runway. The company’s expansion strategy also creates execution exposure: a
      distributed manufacturing footprint can support sovereign procurement and local
      production, but it may increase fixed costs and program complexity before volume
      is proven. The underwriting conclusion is research-more rather than a quantified
      margin or valuation call. Before relying on the $1 billion valuation, an investor
      should obtain monthly management accounts, contracted backlog by customer and
      delivery milestone, cash-flow forecast, financing terms, program gross margins,
      warranty exposure, and evidence that production partners can meet quality and
      schedule obligations.
    claimRefs: [CI013, CI014, CI015, CI016]
    tableRefs: []
