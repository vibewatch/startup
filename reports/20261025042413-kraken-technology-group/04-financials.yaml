      - [USSOCOM contract unit pricing, null, "Aggregate US$49m contract; unit count not disclosed", Low, "Prevents direct ASP comparison", "Obtain unit count, options, and deliverable schedule"]
      - [List pricing, null, "No public price list in assigned sources", Low, "Cannot model pipeline conversion or discounting", "Request price book and realized-price waterfall"]
      - [Gross margin, null, "No public financial statement or margin disclosure", Low, "Core hardware economics remain untested", "Request program gross margin and cost allocation"]
      - [Recurring support revenue, null, "Support is described for Anduril collaboration but not priced", Low, "Could affect revenue quality and retention", "Request support attach, term, renewal, and margin data"]
    notes: "The only numeric proxy is a derived division of a reported award; it is not presented as company-reported pricing."
    claimRefs: [CI002, CI005, CI006, CI007]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Series B proceeds, "US$175 million", High, "Funds product and manufacturing expansion", "Confirm fees, escrow, tranche conditions, and cash available"]
      - [Series B valuation, "US$1 billion", High, "Sets the latest public valuation anchor", "Obtain cap table, preferences, ratchets, and fully diluted basis"]
      - [Cash on hand, null, Low, "Determines immediate solvency and runway", "Provide latest balance sheet and bank reconciliations"]
      - [Cash burn and runway, null, Low, "Determines financing dependency", "Provide 24-month monthly cash forecast and sensitivity cases"]
      - [Working-capital cycle, null, Low, "Defense hardware milestones can precede collections", "Provide billing milestones, inventory turns, deposits, and receivables aging"]
    notes: "Nulls mean no usable public figure was found in the assigned successful sources; they are explicit diligence gaps, not zero values."
    claimRefs: [CI009, CI010, CI011, CI012, CI015]
