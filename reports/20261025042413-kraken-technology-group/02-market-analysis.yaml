callouts:
  - calloutType: insight
    title: Opportunity is real, but the TAM range is boundary-sensitive
    body: >-
      Public estimates span USD 1.56 billion to USD 9.50 billion for 2025
      because the sources describe different market scopes. Kraken's
      company-level opportunity should be underwritten from eligible
      procurement programs and production capacity, not by selecting the
      largest headline.
    claimRefs: [CM004, CM005, CM007]
  - calloutType: risk
    title: Procurement conversion remains the key market risk
    body: >-
      Demonstrations and initial contracts establish demand, but the assigned
      sources do not disclose repeat orders, delivery cadence, utilization,
      renewal, or unit economics needed to assess durable adoption.
    claimRefs: [CM009, CM010, CM012]
