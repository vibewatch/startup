  - id: TV003
    title: Bull / base / bear scenario framework
    columns:
      - Scenario
      - Assumptions and valuation logic
      - Probability signal
      - Downside or decision trigger
    rows:
      - - Bull
        - >-
          Entry above the reported $300M mark is considered only if current growth, retention, margins, and durable
          enterprise expansion are independently verified.
        - Rising qualified pipeline, strong cohorts, improving margins, and low concentration.
        - Reject the premium if verification is incomplete or growth is services-led.
      - - Base
        - >-
          Use $300M only as a diligence anchor; require primary evidence before setting a valuation range or target
          return.
        - Stable growth and retention with manageable concentration and no material preference overhang.
        - Pause if the Series C terms or current financials do not reconcile with the anchor.
      - - Bear
        - >-
          A sub-$300M price is not automatically attractive when unit economics, preference seniority, and liquidity
          remain unknown.
        - Weak cohorts, margin compression, customer concentration, or recurring reliability issues.
        - Decline if downside protection depends on an unverified exit multiple or inaccessible secondary market.
    notes: >-
