  - id: FM001
    title: Evidence-constrained market boundary
    type: pyramid
    summary: >-
      The defensible market narrows from broad enterprise interaction software to Blip's WhatsApp-led workflows, but
      every layer remains unsized in the retained public evidence.
    data:
      nodes:
        - label: Enterprise customer-interaction software
          value: Unsized
          detail: Broad adjacent category; generic AI and unrelated contact-center spend are excluded.
        - label: Conversational AI and automation
          value: Unsized
          detail: Caplight classifies Blip within enterprise conversational AI.
        - label: Messaging orchestration
          value: Unsized
          detail: Blip documentation references WhatsApp, Google RCS, and other campaign channels.
        - label: Enterprise WhatsApp journeys
          value: Unsized
          detail: Blip describes acquisition, sales, post-sales, AI, automation, and human support.
        - label: Commerce and service workflows
          value: Unsized
          detail: Company pages identify commerce and multiple industry workflows.
        - label: Blip reachable spend
          value: Unknown
          detail: Pricing, qualified account count, penetration, and conversion to paid deployments are not public.
    approximationNotes: >-
      No area or level is value-proportional. The source pool does not support numeric TAM, SAM, SOM, or CAGR, so the
      diagram shows boundary logic rather than fabricated magnitude.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM016
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: Ordinal placement distinguishes channel breadth from operating-layer breadth; it is not a measured ranking.
    xAxis:
      label: Channel breadth (1=specialist, 5=broad)
      min: 1
      max: 5
      lowLabel: Specialist
      highLabel: Broad
    yAxis:
      label: Operating-layer breadth (1=infrastructure/manual, 5=end-to-end journey)
      min: 1
      max: 5
      lowLabel: Infrastructure/manual
      highLabel: End-to-end
    data:
      points:
        - label: Blip
          x: 4
          'y': 5
          detail: Messaging-led multichannel platform spanning AI, human service, commerce, and payments.
        - label: Sinch
          x: 5
          'y': 2
          detail: Broad voice, video, and messaging infrastructure; workflow breadth was not evidenced.
        - label: PolyAI
          x: 1
          'y': 3
          detail: Voice-focused enterprise assistant specialist.
        - label: Inbenta
          x: 3
          'y': 4
          detail: CX suite spanning chat, search, assist, knowledge, and learning.
        - label: Tiledesk
          x: 3
          'y': 3
          detail: No-code chatbot and multichannel alternative.
        - label: SMB BSP tools
          x: 3
          'y': 2
          detail: Self-service inbox and automation tools represented by WATI, Respond.io, and Trengo.
        - label: Direct API / internal build
          x: 1
          'y': 1
          detail: Buyer-operated Meta API or gateway route with greater implementation responsibility.
    approximationNotes: >-
      Scores are ordinal analyst classifications from described product scope, not vendor-supplied or independently
      measured performance scores.
    claimRefs:
