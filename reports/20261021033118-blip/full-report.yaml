figures:
  - id: FO001
    title: Blip operating and financing milestones
    type: timeline
    summary: >-
      Publicly reported milestones trace the business from a 1999 origin through the 2024 Series C and the latest
      undated-year operating incident.
    data:
      items:
        - date: '1999'
          label: Company origin
          details: TechCrunch and Caplight place the company's founding or origin in 1999; Tracxn lists 2017.
          tone: neutral
          claimRefs:
            - CO002
            - CO003
        - date: '2014'
          label: Conversational-marketing pivot
          details: TechCrunch reports a pivot at the start of the chatbot wave.
          tone: positive
          claimRefs:
            - CO004
        - date: '2020-10-07'
          label: First institutional round
          details: Tracxn dates the first funding round, a Series A, to October 7, 2020.
          tone: positive
          claimRefs:
            - CO008
        - date: '2022-06-07'
          label: Series B
          details: Tracxn and Caplight date the Series B to June 7, 2022.
          tone: positive
          claimRefs:
            - CO008
        - date: '2022'
          label: Revenue and acquisition milestone
          details: TechCrunch reports annual revenue above $100 million and the acquisition of Stilingue.
          tone: positive
          claimRefs:
            - CO013
            - CO015
        - date: '2023'
          label: Gus acquisition
          details: >-
            TechCrunch reports the acquisition of Mexican conversational-AI company Gus; Tracxn also lists Gus as
            acquired.
          tone: positive
          claimRefs:
            - CO015
        - date: '2024-11-18'
          label: Series C
          details: >-
            A $60 million SoftBank-led round with Microsoft participation brought reported total funding to $230
            million.
          tone: positive
          claimRefs:
            - CO008
            - CO009
        - date: '2024-11-18'
          label: Scale disclosure
          details: TechCrunch reported 4,000+ brands, 300,000+ chatbots, 50M+ daily conversations, and 1,500+ employees.
          tone: positive
          claimRefs:
            - CO011
            - CO012
            - CO014
        - date: Current public page
          label: Higher interaction claim
          details: >-
            Blip's homepage claims more than 125 million interactions processed each day; the metric is not directly
            comparable with conversations.
          tone: neutral
          claimRefs:
            - CO012
        - date: October 15 (year not shown)
          label: Database-provider outage
          details: Blip's status page records a resolved external-provider failure that affected bot message flow and history.
          tone: negative
          claimRefs:
            - CO016
