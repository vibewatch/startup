  - id: FU001
    title: Evidence-backed customer journey and expansion surfaces
    type: journey-map
    summary: >-
      The evidence supports a sales-led path from enterprise scoping to scaled messaging and adjacent commerce use
      cases, while retention remains unquantified.
    data:
      items:
        - label: Enterprise evaluation
          detail: >-
            Large organizations evaluate Blip for complex conversational programs rather than a lightweight self-service
            inbox.
          touchpoints:
            - Enterprise sales
            - CX and technology buying committee
        - label: Tailored scoping
          detail: Blip invites prospects to discuss solutions tailored to their requirements.
          touchpoints:
            - Needs discovery
            - Solution design
        - label: Workflow implementation
          detail: The retained reviews describe complex logic, CRM integrations, and dedicated implementation resources.
          touchpoints:
            - Conversational flows
            - CRM integration
        - label: Scaled operation
          detail: Blip reports 125 million new conversations processed daily across its platform.
          touchpoints:
            - Automated messaging
            - Human-assisted service
        - label: Commerce expansion
          detail: Feito Chocolate illustrates expansion from Meta ads into WhatsApp conversations and commerce activity.
          touchpoints:
            - Meta ads
            - WhatsApp commerce
        - label: Reliability monitoring
          detail: >-
            A provider-caused database incident shows that expansion depends on message routing and history remaining
            available.
          touchpoints:
            - Status monitoring
            - Operational escalation
    approximationNotes: This is a qualitative sequence synthesized from cited evidence, not a measured funnel or conversion-rate model.
    claimRefs:
      - CU001
      - CU004
      - CU005
      - CU010
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: Evidence-based risk heatmap
    type: matrix
    summary: Qualitative matrix separates observed or structural exposure, potential impact, and evidenced mitigation maturity.
    data:
      columns:
        - Exposure evidence
        - Potential impact
        - Mitigation maturity
      rows:
        - label: External database provider
          values:
            - label: Observed incident
              detail: Blip attributed bot unavailability and message-flow disruption to an external database-service provider.
            - label: High
              detail: Reception, processing, delivery, routing, and conversation history were affected.
            - label: Partial
              detail: Blip reported resolution, service validation, and continued monitoring.
        - label: Messaging-platform dependency
          values:
            - label: Structural
              detail: The proposition relies on messaging applications and major platform partners.
            - label: High
              detail: Channel access and economics are central to conversational commerce and service.
            - label: Partial
              detail: Tier 1 relationships are claimed, but contract protections are not public.
        - label: Enterprise implementation
          values:
            - label: Competitor-reported
              detail: Interested competitors describe technical, sales-gated, and consulting-led deployment.
            - label: Medium
              detail: The primary exposure is time-to-value, delivery cost, and specialist capacity.
            - label: Unverified
              detail: No independent implementation cohort or failure-rate evidence was assigned.
        - label: Compliance evidence scope
          values:
            - label: Disclosure gap
              detail: >-
                Global ISO certifications are claimed without standards, scope, validity, or audit artifacts in retained
                text.
            - label: High if unmet
              detail: Regulated-industry use cases can make missing controls or transfer mechanisms material.
            - label: Unverified
              detail: Certificates, DPA, subprocessors, and regulator records require diligence.
        - label: Autonomous commerce controls
          values:
            - label: Company-described
              detail: Blip markets AI-enabled commerce through payment with no humans needed.
            - label: High if uncontrolled
              detail: Incorrect actions could affect payments, privacy, or regulated users.
            - label: Unverified
              detail: Guardrails, evaluations, escalation rates, and loss-event evidence require diligence.
        - label: Commercial transparency
          values:
            - label: Adverse reports
              detail: Competitors describe opaque pricing and a sales-gated, consulting-led model.
            - label: Medium
              detail: Pricing and delivery opacity can weaken underwriting and delay time to value.
            - label: Unverified
              detail: Public valuation, detailed pricing, unit economics, and services intensity are unavailable.
    approximationNotes: >-
      Ordinal labels are analyst assessments, not probabilities or scores; "High if unmet" is conditional and does not
      assert that a compliance requirement has failed.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR007
      - CR008
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence moves from operating proof through price and downside tests to a research-more decision.
    data:
      nodes:
        - id: scale
          label: Company-reported scale
          value: 125M+ interactions per day
        - id: commercial-proof
          label: Commercial proof
          value: Company case metrics, not audited economics
        - id: financing-context
          label: Financing context
          value: $230M reported raised across three rounds
        - id: price-test
          label: Price test
          value: $300M report conflicts with unavailable-valuation disclosure
        - id: downside-test
          label: Downside test
          value: Pricing, platform, infrastructure, and liquidity gaps
        - id: recommendation
          label: Decision
          value: Research more; valuation stance unknown
      edges:
        - from: scale
          to: commercial-proof
        - from: commercial-proof
          to: financing-context
        - from: financing-context
          to: price-test
        - from: price-test
          to: downside-test
        - from: downside-test
          to: recommendation
    approximationNotes: The flow is qualitative; it does not imply a conversion rate, valuation probability, or causal weighting.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
      - CV016
