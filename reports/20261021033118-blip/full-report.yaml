      - CP006
      - CP007
      - CP008
      - CP010
      - CP011
      - CP012
  - id: FI001
    title: Publicly evidenced activity-to-outcome flow
    type: flow
    summary: >-
      The public product model links messaging activity to enterprise execution and customer outcomes, but no disclosed
      charging or gross-profit layer closes the financial bridge.
    data:
      nodes:
        - id: messaging-entry
          label: Messaging entry
          detail: Customers begin sales or service journeys in messaging channels.
        - id: messaging-api
          label: Messaging API
          detail: The communication layer carries enterprise interaction volume.
        - id: blip-intelligence
          label: Blip intelligence
          detail: AI, routing, automation, and monitoring orchestrate the conversation.
        - id: enterprise-systems
          label: Enterprise systems
          detail: CRM, ERP, payments, inventory, and fulfillment support execution.
        - id: customer-action
          label: Customer action
          detail: Journeys can progress through purchase, service, and after-sales tasks.
        - id: financial-outcome
          label: Financial outcome
          detail: Revenue and loyalty are targeted, but Blip pricing and gross profit are undisclosed.
      edges:
        - from: messaging-entry
          to: messaging-api
        - from: messaging-api
          to: blip-intelligence
        - from: blip-intelligence
          to: enterprise-systems
        - from: enterprise-systems
          to: customer-action
        - from: customer-action
          to: financial-outcome
    approximationNotes: >-
      Conceptual sequence based on public product descriptions; it does not imply disclosed conversion rates, pricing,
      revenue recognition, or gross-margin values.
    claimRefs:
      - CI004
      - CI010
      - CI011
  - id: FE001
    title: Publicly documented product architecture
    type: stack
