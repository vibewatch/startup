schemaVersion: "report-v2"
artifact: product-tech
slug: blip
runDate: "2026-10-21"
company:
  name: Blip
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Blip presents a broad conversational platform spanning channel delivery,
    low-code and code-first bot development, human service, analytics, commerce,
    and AI-assisted workflows. Public documentation substantiates the main
    product surfaces and integration paths, while independent technical
    benchmarks, current control evidence, service-level commitments, release
    cadence, and a forward roadmap remain material diligence gaps.
sections:
  - id: customer-workflow-and-surface
    title: Customer workflow and product surface
    body: >-
      Blip positions the product as an orchestration layer for conversational
      customer journeys rather than a single-purpose chatbot. Its public
      product narrative spans acquisition, sales, service, and retention, while
      the commerce material follows a buyer from initial interest through
      selection, order, and payment. The resulting surface combines automated
      contacts, human service, catalog and payment steps, and analytics. The
      breadth is credible at the feature-description level, but the headline
      daily-conversation scale is company-reported and the available
      independent profiles do not validate workflow-level conversion or
      resolution outcomes.
    claimRefs: [CE001, CE002, CE010, CE012, CE013]
    tableRefs: [TE001, TE002]
    figureRefs: []
  - id: architecture-and-implementation
    title: Architecture and implementation model
    body: >-
      The published architecture is modular: customer channels sit above a bot
      authored in Builder, an SDK, or an HTTP endpoint; the LIME JSON protocol
      provides a common message envelope; channel adapters translate content
      to each destination; and APIs, extensions, and integrations connect
      external systems. This supports both low-code and developer-led delivery
      without proving the underlying production topology. Public material
      describes interfaces and limits, not tenancy boundaries, regional
      deployment, data stores, recovery design, model evaluation, or release
      engineering. Those omissions prevent a full assessment of scalability
      and maintainability from public evidence alone.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: security-reliability-operating-maturity
    title: Security, reliability, and operating maturity
    body: >-
      Documentation requires authenticated access and describes a sensitive
      content container intended to keep selected content from being stored on
      Blip's server, while warning that external messaging channels may still
      store it. That is useful design evidence, but it is not a current
      independent control assessment. The strongest adverse operating signal
      is Blip's own status history: an Oct. 15 incident attributed to an
      external database-service provider disrupted message receipt, processing,
      delivery, routing, status updates, and conversation history before
      resolution. Public evidence does not expose service-level objectives,
      recovery targets, dependency architecture, or a detailed post-incident
      analysis.
    claimRefs: [CE007, CE008, CE009, CE014]
    tableRefs: []
    figureRefs: []
  - id: differentiation-roadmap-constraints
    title: Differentiation and roadmap constraints
    body: >-
      External descriptions consistently reinforce Blip's breadth: open
      integration points, human handoff, multi-channel delivery, a visual bot
      builder, commerce, payments, and AI-assisted service. However, the
      evidence quality is uneven. Software Advice lists no user reviews, and
      the two detailed implementation critiques come from competing vendors
      selling simpler alternatives; they are useful for forming diligence
      questions, not for independent benchmarking. Those competitors frame
      Blip as powerful but developer- or consulting-intensive. No retained
      source provides a dated product roadmap, release cadence, public
      repository activity, or comparative accuracy, latency, or uptime data.
    claimRefs: [CE010, CE011, CE012, CE015, CE016]
    tableRefs: []
    figureRefs: []
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - Primary user
      - Documented value
      - Evidence posture
      - Key diligence gap
    rows:
      - - Intelligent Contact and journey orchestration
        - Customer-experience and growth teams
        - Coordinates automated conversations across lifecycle stages and channels
        - Current company positioning; scale is company-reported
        - No independent outcome or scale benchmark
      - - Builder, templates, and SDKs
        - Operations teams and developers
        - Supports no-code and code-first chatbot construction
        - Detailed public technical documentation
        - No public release cadence or maintainability metrics
      - - APIs, extensions, and integrations
        - Developers and solution architects
        - Connects bots, systems of record, and channel workflows
        - Official docs plus an independent product profile
        - No public integration reliability or latency benchmark
      - - Blip Desk and routing
        - Human service agents and supervisors
        - Transfers automated interactions to agents and supports routing
        - Official docs and an independent listing
        - No public staffing-productivity or resolution benchmark
      - - Commerce, AI Agent, and Copilot
        - Sales, service, and commerce teams
        - Combines conversational selling, payment steps, and AI assistance
        - Company workflow page and external marketplace description
        - No public model evaluation, autonomy boundary, or error-rate data
    notes: Representative documented modules; public sources do not expose a complete current product catalog or independent performance data.
    enumerationScope:
      coverage: sample
      basis: Representative modules described by the retained official documentation and external product profiles as accessed on the run date.
    claimRefs: [CE001, CE002, CE004, CE007, CE010, CE012, CE013]
  - id: TE002
    title: Representative workflows and use cases
    columns:
      - Workflow
      - Documented sequence
      - Enabling surface
      - Evidence boundary
    rows:
      - - Conversational commerce
        - Interest to selection to order to payment
        - AI, catalog, integrations, and payments
        - Workflow is documented; conversion uplift is not independently verified
      - - Automated customer service
        - Intent handling to virtual-assistant response to human handoff
        - Intelligent Contact, AI, and Blip Desk
        - Capability is described; resolution quality is not benchmarked
      - - Multi-channel engagement
        - Build once to adapt content to supported messaging channels
        - Builder or SDK, LIME, and channel adapters
        - Interface behavior is documented; cross-channel parity is not independently tested
      - - Enterprise integration
        - Receive event to invoke bot logic to call external systems and return a response
        - HTTP webhooks, SDKs, APIs, extensions, and integrations
        - Integration options are public; implementation effort is disputed by competitors
    notes: Representative use cases assembled from public product and technical descriptions; they are not customer outcome benchmarks.
    enumerationScope:
      coverage: sample
      basis: Representative workflows directly described or mechanically supported by the retained public product and developer documentation.
    claimRefs: [CE003, CE004, CE006, CE010, CE012, CE013, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer
      - Documented components
      - Operating evidence
      - Unresolved diligence question
    rows:
      - - Channel delivery
        - WhatsApp, Messenger, Instagram, SMS, email, Blip Chat, and other channels
        - Content adaptation and multi-channel deployment are described
        - What are current feature-parity and per-channel delivery guarantees?
      - - Authoring and runtime
        - Builder, templates, C# and JavaScript SDKs, Python SDK, and HTTP webhooks
        - Three principal construction paths are documented
        - What runtime isolation, versioning, and rollback controls are used?
      - - Messaging protocol
        - LIME JSON envelopes and message, notification, and command operations
        - Protocol objects and command behavior are publicly documented
        - What compatibility and deprecation policy protects integrations?
      - - Platform services
        - Authentication, APIs, extensions, integrations, Desk, analytics, AI, and payments
        - Product documentation enumerates the service surface
        - Which components are first-party, regionally available, or externally dependent?
      - - Reliability and data handling
        - Published throughput limits, sensitive content container, and status reporting
        - Rate enforcement and one external-provider incident are visible
        - What are the current SLA, recovery targets, data-residency model, and control attestations?
    notes: Interface-level architecture inferred from official documentation; deployment topology and operational controls are not publicly verified.
    enumerationScope:
      coverage: partial
      basis: Layers visible in retained public technical documentation; internal infrastructure and deployment topology are outside the evidence boundary.
    claimRefs: [CE004, CE005, CE007, CE008, CE009, CE014]
