  evidenceGaps:
    - type: missing-source
      severity: material
      topic: independent-validation
      missingEvidence: Independent technical benchmarks for uptime, latency, throughput, channel parity, model quality, conversion, and service-resolution outcomes.
      whyItMatters: Product breadth and company-reported scale can be described, but operating performance cannot be independently validated.
      diligencePath: Request production KPI definitions and time series, then benchmark them against customer references and independent monitoring data.
      relatedQuestionRefs: [QE005, QE006, QE008]
      relatedTableRefs: [TE001, TE002, TE003]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Current control attestations, penetration-test results, service-level objectives, recovery targets, data-residency architecture, dependency mapping, and the detailed incident report.
      whyItMatters: Security and reliability maturity remain only partially assessable from public evidence.
      diligencePath: Review the security data room, architecture diagrams, vendor register, service commitments, disaster-recovery tests, and the Oct. 15 postmortem.
      relatedQuestionRefs: [QE006, QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: A dated roadmap, release history, deprecation policy, public repository activity, SDK adoption, and developer-community metrics.
      whyItMatters: Future product direction and external developer traction cannot be evaluated.
      diligencePath: Request the twelve-month roadmap, release log, API deprecation policy, SDK usage telemetry, and developer-support metrics.
      relatedQuestionRefs: [QE003, QE004, QE005]
