callouts:
  - calloutType: strength
    title: One build model spans no-code and code-first delivery
    body: >-
      Blip documents Builder, SDK, and webhook construction paths behind a
      common messaging model, supporting different implementation teams without
      reducing the product to a single authoring interface.
    claimRefs: [CE003, CE004, CE005, CE006]
  - calloutType: risk
    title: Public interface depth exceeds public operating transparency
    body: >-
      A broad documented surface and company-reported scale are not matched by
      independent performance tests, current service levels, deployment
      topology, recovery targets, or a dated roadmap; the status history also
      demonstrates dependency on an external database-service provider.
    claimRefs: [CE002, CE008, CE009, CE014]
