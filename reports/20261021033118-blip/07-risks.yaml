      whyItMatters: >-
        Marketing claims cannot establish control coverage or legal standing across jurisdictions and
        regulated customer segments.
      diligencePath: >-
        Obtain the complete trust-room package and counsel-led court, regulator, privacy, and trademark
        searches for each material operating entity and jurisdiction.
      relatedQuestionRefs: [QR002, QR008]
      relatedTableRefs: [TR001]
