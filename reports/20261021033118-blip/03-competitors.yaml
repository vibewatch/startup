      - ["Respond.io via BossBot", "USD79/month", "Platform subscription", "Omnichannel inbox and workflow builder", "Competitor-issued; unverified", "Competes where workflow breadth matters without enterprise delivery"]
      - ["Trengo via BossBot", "From GBP19/user/month", "Per-user subscription", "Team communications with EU-oriented positioning", "Competitor-issued; unverified", "Alternative for buyers prioritizing transparent per-seat packaging"]
      - ["360dialog via BossBot", "USD5/month base", "API gateway plus Meta charges", "WhatsApp API connection only", "Competitor-issued; unverified", "Low software price shifts implementation work to the buyer"]
      - ["Klaros", "USD8/month for five seats", "Flat self-service subscription; zero markup claimed", "Inbox, campaigns, sequences, and API", "Vendor self-description; not independent", "Focused vendors can unbundle Blip's enterprise service layer"]
    notes: "List and competitor-reported prices use different currencies, geographies, dates, inclusions, and messaging-fee treatments; they must not be compared as realized total cost."
    claimRefs: ["CP009", "CP010", "CP011", "CP012", "CP016"]
