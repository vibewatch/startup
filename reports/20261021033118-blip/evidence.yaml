evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, founder operating roles, succession plan, and key-person retention
      arrangements.
    whyItMatters: Leadership continuity and governance quality cannot be assessed from a historical founder list.
    diligencePath: >-
      Request the current organization chart, board minutes and observer list, founder employment agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-and-round-terms
    missingEvidence: >-
      Fully diluted ownership, Series C price and post-money valuation, liquidation preferences, voting rights, debt,
      secondaries, and investor board rights.
    whyItMatters: Total funding does not reveal entry price, control, downside protection, dilution, or cash available.
    diligencePath: >-
      Obtain the fully diluted cap table, charter, investor-rights agreements, financing documents, debt schedule, and
      secondary-transfer ledger.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: current-scale
    missingEvidence: >-
      Current audited revenue, ARR, gross margin, NRR, churn, customer concentration, headcount, and a reconciliation of
      conversations versus interactions.
    whyItMatters: Public scale figures use older periods or different metric names and cannot establish current growth quality.
    diligencePath: >-
      Request monthly management accounts, recurring-revenue bridge, cohort retention, customer concentration, HR
      roster, and metric-definition documentation through September 2026.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market sizing
    missingEvidence: Independent market size and CAGR by geography, customer segment, channel, and included software or services spend.
    whyItMatters: >-
      Without consistent boundaries and periods, TAM, SAM, SOM, penetration, and growth assumptions cannot be valued
      defensibly.
    diligencePath: >-
      Obtain current paid analyst datasets and build a bottom-up model from qualified accounts, annual contract value,
      message volume, and attach rates.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer segments
    missingEvidence: >-
      Procurement role, economic buyer, budget owner, sales-cycle length, implementation effort, and contract size by
      target vertical.
    whyItMatters: Buyer authority and budget source determine reachable SAM, go-to-market efficiency, and adoption timing.
    diligencePath: >-
      Review anonymized pipeline and win-loss data, then interview customers and lost prospects across the five named
      verticals.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: independent adoption benchmarks
    missingEvidence: >-
      Source-neutral corroboration of daily interaction volume, customer counts, conversion uplift, retention, and
      production usage.
    whyItMatters: >-
      Company and competitor claims cannot establish durable demand, customer outcomes, or relative adoption on their
      own.
    diligencePath: >-
      Request cohort exports and customer references, then reconcile them with channel-provider records and independent
      market research.
    relatedQuestionRefs:
      - QM010
  - type: conflicting-data
    severity: minor
    topic: enterprise positioning
    missingEvidence: >-
      Independent current pricing, onboarding, implementation, and customer-fit comparisons across Blip and self-service
      substitutes.
    whyItMatters: Available adverse descriptions come from competitors and may overstate price or complexity differences.
    diligencePath: >-
      Collect comparable vendor quotes and implementation statements of work for matched enterprise and mid-market
      scenarios.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable current revenue, customer count, funding, deployment scale, and strategic roadmaps for the named
      competitors.
    whyItMatters: >-
      Without normalized scale data, the analysis cannot determine whether each alternative has the resources and
      installed base to sustain enterprise competition.
    diligencePath: >-
      Request a management-maintained win/loss file and refresh competitor scale from filings, funding records, and
      current official disclosures.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current Blip quote sheets and like-for-like competitor proposals with region, volume, service, messaging fees,
      discounts, and contract length.
    whyItMatters: Competitor-authored list prices cannot establish realized total cost or price-performance against Blip.
    diligencePath: >-
      Run a standardized request-for-quote across Blip and at least three alternatives using the same seats, channels,
      message volumes, support, and implementation scope.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-performance
    missingEvidence: >-
      Independent benchmarks for uptime, implementation time, automation quality, conversion lift, security controls,
      and customer support.
    whyItMatters: >-
      Feature presence and vendor claims do not show whether Blip's integrated approach produces superior outcomes or
      reliability.
    diligencePath: >-
      Obtain reference calls, incident histories, contract SLAs, pilot results, and a scored proof-of-concept against
      shortlisted alternatives.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Blip-specific churn, multi-homing, data-export, number-porting, workflow-migration, and customer
      implementation-cost evidence.
    whyItMatters: >-
      The available competitor source describes generic migration friction but does not measure whether Blip customers
      are economically locked in.
    diligencePath: >-
      Review customer contracts and export rights, then interview churned and multi-vendor customers about migration
      effort and retained data.
    relatedQuestionRefs:
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current price cards, contract samples, billing units, minimum commitments, discounts, and implementation or
      channel pass-through fees.
    whyItMatters: >-
      Without realized pricing and contract terms, ACV, price realization, revenue durability, and gross-margin exposure
      cannot be tested.
    diligencePath: >-
      Obtain representative new, renewal, and expansion contracts plus billing extracts by product, geography, and
      channel.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      ARR definition, revenue mix, GRR, NRR, churn, customer concentration, gross margin, CAC, sales cycle, and CAC
      payback.
    whyItMatters: These metrics determine whether activity scale converts into recurring, defensible, and profitable revenue.
    diligencePath: >-
      Request audited monthly cohorts, customer-level revenue, gross-margin bridges, and sales-efficiency schedules for
      at least eight quarters.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash on hand, restricted cash, debt and project-finance obligations, monthly burn, runway, planned uses of funds,
      and next-round trigger.
    whyItMatters: >-
      Capital raised historically is not cash available and cannot establish whether Blip can finance growth or absorb
      delivery shocks.
    diligencePath: >-
      Review the latest balance sheet, cash-flow statement, debt schedule, board-approved operating plan, capitalization
      table, and financing documents.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent technical benchmarks for uptime, latency, throughput, channel parity, model quality, conversion, and
      service-resolution outcomes.
    whyItMatters: >-
      Product breadth and company-reported scale can be described, but operating performance cannot be independently
      validated.
    diligencePath: >-
      Request production KPI definitions and time series, then benchmark them against customer references and
      independent monitoring data.
    relatedQuestionRefs:
      - QE005
      - QE006
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: >-
      Current control attestations, penetration-test results, service-level objectives, recovery targets, data-residency
