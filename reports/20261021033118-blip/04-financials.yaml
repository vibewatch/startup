    title: Revenue streams and monetization evidence
    columns: [Surface, Customer mechanism, Pricing unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [Enterprise conversational platform, "Orchestrates messaging and customer journeys", "Not disclosed", "Product verified; monetization undisclosed", "Recurring potential, unverified", "Contract structure and revenue by SKU"]
      - [Conversational commerce, "Supports discovery through payment and after-sales workflows", "Not disclosed", "Capability verified", "Outcome-linked positioning, not verified revenue", "Attach rate and recognized revenue"]
      - [AI automation and service, "Automates sales and support interactions", "Not disclosed", "Capability verified", "Usage scale disclosed; unit economics absent", "Usage tiers, overages, and compute cost"]
      - ["Integrations, payments, and catalogs", "Connects messaging to execution systems", "Not disclosed", "Bundled capability described", "Separate revenue stream not established", "Pass-through fees and services mix"]
    notes: "Public product surfaces only; rows map possible monetization surfaces and do not establish reported revenue mix, contract terms, or standalone SKUs."
    claimRefs: [CI001, CI002, CI014]
  - id: TI002
    title: Pricing and commercial-efficiency disclosure
    columns: [Item, Public price or unit, List vs. realized, Discount or cost evidence, Implication]
    rows:
      - [Blip platform access, "Unavailable", "Neither disclosed", "No public discount schedule", "Cannot calculate ACV or software gross margin"]
      - [Messaging and API activity, "Unavailable", "Neither disclosed", "Channel pass-through treatment unknown", "Volume cannot be converted into revenue"]
      - [Implementation and integrations, "Unavailable", "Neither disclosed", "Services fees and delivery cost unknown", "Services mix may dilute margin"]
      - [WhatsApp Business alternative, "Free to download", "Entry price only", "Not comparable to enterprise orchestration", "Low-cost substitute increases value-proof burden"]
    notes: "Pricing coverage is partial: retained official pages contain no Blip list or realized prices, and the WhatsApp Business entry point is not a like-for-like enterprise benchmark."
    claimRefs: [CI009, CI010, CI013]
  - id: TI003
    title: Public traction and unit-economics evidence
    columns: [Metric, Public value, Evidence class, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Annual revenue", "$133.6M in Nov. 2024", "Third-party reported", "Medium", "Provides a historical scale anchor, not current ARR", "Audited revenue by period and recognition policy"]
      - ["Daily platform activity", "125M interactions", "Company claimed", "Medium", "Shows workload scale but no take rate", "Billable share and revenue per interaction"]
      - ["Commerce conversion uplift", "3x higher conversion", "Company claimed", "Low", "Suggests customer ROI but lacks baseline and sample", "Cohort method, denominator, and customer-level proof"]
      - ["Revenue retention", "Unavailable", "Private evidence only", "Low", "Required to test recurring quality", "GRR and NRR by cohort and geography"]
      - ["Gross margin", "Unavailable", "Private evidence only", "Low", "Required to assess infrastructure and services burden", "Gross margin bridge by product and channel"]
    notes: "Metrics have different issuers, periods, and denominators; activity and conversion claims are not revenue, ARR, gross profit, or comparable unit-economics measures."
    claimRefs: [CI003, CI005, CI007, CI008, CI016]
figures:
  - id: FI001
    title: Publicly evidenced activity-to-outcome flow
    type: flow
    summary: >-
      The public product model links messaging activity to enterprise execution and customer
      outcomes, but no disclosed charging or gross-profit layer closes the financial bridge.
    data:
      nodes:
        - id: messaging-entry
          label: Messaging entry
          detail: Customers begin sales or service journeys in messaging channels.
        - id: messaging-api
          label: Messaging API
          detail: The communication layer carries enterprise interaction volume.
        - id: blip-intelligence
          label: Blip intelligence
          detail: AI, routing, automation, and monitoring orchestrate the conversation.
        - id: enterprise-systems
          label: Enterprise systems
          detail: CRM, ERP, payments, inventory, and fulfillment support execution.
        - id: customer-action
          label: Customer action
          detail: Journeys can progress through purchase, service, and after-sales tasks.
        - id: financial-outcome
          label: Financial outcome
          detail: Revenue and loyalty are targeted, but Blip pricing and gross profit are undisclosed.
      edges:
        - from: messaging-entry
          to: messaging-api
        - from: messaging-api
          to: blip-intelligence
        - from: blip-intelligence
          to: enterprise-systems
        - from: enterprise-systems
          to: customer-action
        - from: customer-action
          to: financial-outcome
    approximationNotes: "Conceptual sequence based on public product descriptions; it does not imply disclosed conversion rates, pricing, revenue recognition, or gross-margin values."
    claimRefs: [CI004, CI010, CI011]
callouts:
  - calloutType: risk
    title: Financial underwriting remains blocked
    body: >-
      Request monthly revenue by product and geography, ARR and backlog definitions, GRR/NRR,
      gross-margin bridges, CAC and payback, customer concentration, cash, debt, burn, runway,
      and the current capitalization and preference schedule before assigning a valuation.
    claimRefs: [CI009, CI016]
