artifact: financials
slug: blip
runDate: 2026-10-21
company:
  name: Blip
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a scaled enterprise conversational-commerce platform and one
    third-party-reported 2024 revenue figure, but it does not expose Blip's pricing, revenue
    mix, margins, retention, burn, cash, or runway. The financial case is therefore
    directionally credible but not underwriteable without management data.
sections:
  - id: revenue-architecture
    title: Revenue architecture is visible, but monetization is not
    body: >-
      Blip presents an enterprise platform that connects messaging channels, its own
      intelligence and orchestration layer, and customers' commerce and enterprise systems.
      That architecture can support several commercial surfaces: platform access, automated
      service and sales journeys, integrations, payments, catalogs, and potentially
      implementation or managed services. The retained evidence does not show whether those
      surfaces are separately priced, bundled into contracts, charged by interaction, or
      passed through with channel fees. Consequently, the table below is a product-to-revenue
      map rather than a verified revenue-mix schedule. The investment implication is that
      recurring software economics are plausible but cannot be assumed from product breadth
      alone; contract samples and general-ledger revenue segmentation are required.
    claimRefs: [CI001, CI002, CI004, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Scale signals are meaningful but not mutually reconcilable
    body: >-
      GetLatka lists annual revenue of $133.6 million for November 2024 and attributes that
      observation to TechCrunch, while separately labeling its November 2023 and October 2024
      values as estimates. Blip's own site reports 125 million interactions processed per day,
      and a third-party marketplace profile reports more than 80 billion messages across 32
      countries and more than 365,000 chatbots. These measures indicate substantial platform
      activity, but none is ARR, contracted backlog, recognized revenue, or gross profit.
      They also use different time bases and denominators, so they should not be combined into
      a growth rate or revenue-per-message estimate. The $133.6 million figure is useful as a
      diligence anchor, not as a current run rate.
    claimRefs: [CI003, CI007, CI008, CI015]
    tableRefs: [TI003]
  - id: pricing-and-gtm
    title: Enterprise positioning implies a sales-led motion with weak public pricing transparency
    body: >-
      Blip targets revenue, engagement, service, and commerce workflows on messaging channels,
      with integrations into payments, CRM, ERP, inventory, and fulfillment systems. That
      breadth points toward a consultative enterprise sale and raises the likelihood that
      implementation complexity, channel costs, usage, and support obligations influence
      realized economics. No retained official page publishes a list price, contract unit,
      minimum commitment, discount schedule, or implementation fee. An independent comparison
      describes WhatsApp Business as free to download, underscoring that buyers can compare
      Blip's value-added orchestration against a low-entry-cost channel tool even though the
      products are not equivalent. CAC, sales cycle, quota productivity, partner economics,
      and payback therefore remain unavailable.
    claimRefs: [CI009, CI010, CI013]
    tableRefs: [TI002]
  - id: cost-base-and-capital-adequacy
    title: Delivery dependencies and capital adequacy remain the core underwriting blockers
    body: >-
      Blip's status page records an October 15 incident in which an external database-service
      provider disrupted message reception, processing, routing, response delivery, and
      conversation history. The fetched page omits the year, so the incident is treated as an
      undated operating-risk observation rather than a quantified current loss event. It
      nonetheless identifies third-party infrastructure as a service-delivery dependency that
      may affect hosting cost, redundancy spending, support load, and contractual service
      obligations. None of the eight retained sources discloses gross margin, hosting cost,
      headcount cost, working capital, capex, cash, debt, burn, runway, next-round triggers, or
      planned uses of capital. Funding raised elsewhere must not be treated as cash available;
      management financials and financing documents are required before judging adequacy.
    claimRefs: [CI011, CI012, CI016]
tables:
