          claimRefs: [CO015]
        - date: "2024-11-18"
          label: Series C
          details: "A $60 million SoftBank-led round with Microsoft participation brought reported total funding to $230 million."
          tone: positive
          claimRefs: [CO008, CO009]
        - date: "2024-11-18"
          label: Scale disclosure
          details: "TechCrunch reported 4,000+ brands, 300,000+ chatbots, 50M+ daily conversations, and 1,500+ employees."
