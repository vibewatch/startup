company:
  name: Blip
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Blip is a private, Series C enterprise conversational-AI platform with a
    reported $230 million of total funding and meaningful operating scale, but
    public records conflict on its founding year and headquarters. Current
    valuation, ownership rights, board composition, and refreshed financial and
    headcount metrics remain material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Blip sells an enterprise platform for orchestrating automated and
      human-assisted customer conversations across messaging channels, with
      commerce, customer-service, workflow, and analytics capabilities. The
      official site emphasizes end-to-end conversational journeys and claims
      125 million interactions processed each day, while independent and
      marketplace descriptions consistently position the product as B2B
      conversational AI rather than a consumer application. The corporate
      origin is less clean: TechCrunch and Caplight place the business in 1999,
      while Tracxn lists 2017. Headquarters are likewise reported as Sao Paulo
      by TechCrunch and Belo Horizonte by Tracxn and Caplight, so neither
      disputed field should be treated as settled without corporate records.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      TechCrunch identifies Roberto Oliveira, Daniel Costa, Sergio Passos,
      Marcelo Oliveira, and Antonio Oliveira as the founding group and quotes
      Roberto Oliveira as the principal company spokesperson in the 2024
      financing coverage. That supports a long-tenured founder narrative but
      does not establish the current executive roster, individual functional
      ownership, board seats, succession planning, or voting control. Public
      evidence in the assigned pool is therefore sufficient to enumerate the
      reported founders, not to claim exhaustive current leadership coverage.
      The concentration of external narrative around Roberto Oliveira creates
      a key-person diligence question rather than proof of actual operational
      dependence.
    claimRefs: [CO002, CO003, CO005, CO009]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholder structure
    body: >-
      The financing record is clearest at the round level. TechCrunch reported
      a $60 million Series C led by SoftBank with Microsoft participating in
      November 2024, bringing total capital raised to $230 million; Tracxn also
      reports three rounds ending in Series C and the same total raised.
      Caplight identifies SoftBank, Warburg Pincus, and Accel among notable
      investors, but it states that valuation is not publicly available.
      Funding raised must not be read as cash on hand, and the public record
      reviewed here does not disclose ownership percentages, liquidation
      preferences, debt, secondary-sale pricing, board rights, or a post-money
      valuation.
    claimRefs: [CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: scale-milestones-and-operating-risk
    title: Scale, milestones, and operating risk
    body: >-
      TechCrunch's November 2024 profile supplies the most specific dated scale
      disclosures: more than 4,000 brands, more than 300,000 chatbots, over 50
      million conversations per day, more than $100 million of annual revenue
      in 2022, and more than 1,500 employees. These are reported metrics rather
      than audited current-period results. Blip's present homepage separately
      claims more than 125 million daily interactions; that denominator is not
      necessarily comparable with TechCrunch's daily-conversation figure, so
      the difference is not presented as measured growth. Milestones include a
      2014 conversational-marketing pivot, three institutional funding rounds,
      and the 2022 and 2023 acquisitions of Stilingue and Gus. The company
      status page also documents an October 15 outage affecting bot message
      flows after an external database-service-provider failure, demonstrating
      real third-party infrastructure dependence without establishing a
      recurring incident rate.
    claimRefs: [CO004, CO008, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
