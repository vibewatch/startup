          touchpoints: ["Conversational flows", "CRM integration"]
        - label: "Scaled operation"
          detail: "Blip reports 125 million new conversations processed daily across its platform."
          touchpoints: ["Automated messaging", "Human-assisted service"]
        - label: "Commerce expansion"
