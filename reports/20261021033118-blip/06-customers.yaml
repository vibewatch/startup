schemaVersion: "report-v2"
artifact: "customers"
slug: "blip"
runDate: "2026-10-21"
company:
  name: "Blip"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Blip presents substantial operating scale, including 125 million new conversations
    processed daily, while an independent review reports 4,000+ brands and 80 million
    active contacts. Named proof is strongest for a production commerce case, but public
    evidence remains inadequate on retention, contract durability, and concentration.
sections:
  - id: "customer-base-and-buyers"
    title: "Customer base and buyer fit"
    body: >-
      The retained evidence consistently places Blip at the enterprise end of the
      conversational-commerce market. Independent and competitor-authored reviews describe
      a platform used by large Brazilian organizations and sold through a sales-led,
      consulting-oriented motion rather than a transparent self-service funnel. That
      positioning implies a buying committee spanning customer-experience, digital,
      technology, and contact-center leaders, while day-to-day users include service,
      sales, and support teams. Blip's own blog invites prospects to discuss tailored
      solutions, reinforcing the need for scoping before purchase. The evidence is much
      weaker for small-business adoption: two vendors selling alternatives characterize
      Blip's price, implementation complexity, and onboarding as structural barriers.
      IntelBee independently classifies the product as an intelligent conversation and
      live-chat platform, but offers no customer-scale detail.
    claimRefs: ["CU004", "CU010", "CU011", "CU012", "CU014"]
    tableRefs: ["TU001"]
  - id: "adoption-and-usage"
    title: "Adoption and usage signals"
    body: >-
      Public usage signals are large but not equivalent to recurring revenue, retained
      accounts, or paid seats. Blip states that it processes 125 million new conversations
      every day; Chatbotscape reports that Blip's current pages cite more than 4,000 brands
      and 80 million active contacts. These metrics indicate a broad conversation surface,
      yet none exposes the period definition, unique-account denominator, paid-versus-free
      mix, or customer concentration. A more concrete production example is Feito Chocolate:
      Blip says the company exchanged more than 50,000 messages in one month after
      integrating Blip with Meta ads. Blip also advertises a three-times-higher conversion
      rate for brands using conversational commerce, but the fetched page does not disclose
      a cohort, baseline, sample size, or measurement window.
    claimRefs: ["CU001", "CU002", "CU003", "CU005", "CU009"]
    tableRefs: ["TU002"]
  - id: "named-customer-proof"
    title: "Named customer proof and reference quality"
    body: >-
      Named-account evidence separates one quantified operating case from several
      third-party customer identifications. Blip's commerce page ties Feito Chocolate to a
      specific deployment surface, Meta ads directing customers to WhatsApp, and a monthly
      message volume above 50,000; this is the clearest production-use proof in the pool.
      BossBot identifies Magazine Luiza, Claro, and Itaú as large-enterprise deployments,
      while Chatbotscape separately references Claro and Itaú in its assessment of Blip's
      Brazilian enterprise footprint. Those names strengthen logo credibility, but the
      assigned evidence does not establish current contract status, rollout breadth, renewal,
      economics, or outcomes for the three larger accounts. Public review evidence is also
      thin: Chatbotscape reports only four G2 reviews and sixteen Trustpilot reviews as of
      October 7, 2026.
    claimRefs: ["CU005", "CU006", "CU007", "CU008", "CU015"]
    tableRefs: ["TU003"]
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and operating risk"
    body: >-
      The visible expansion mechanism is use-case broadening rather than a disclosed
      retention cohort: a customer can move from messaging and service into Meta-ad
      acquisition, conversational commerce, automation, and human-assisted workflows.
      Feito Chocolate provides evidence that acquisition traffic can become sustained
      message volume, but neither that case nor the wider brand and contact counts reveal
      renewals, net revenue retention, gross retention, churn, contract length, or
      land-and-expand economics. Durability also depends on infrastructure outside Blip's
      direct control. Its status page records a resolved external-database-provider failure
      that affected message reception, processing, response delivery, routing, and
      conversation history. The incident does not prove chronic unreliability, but it shows
      how a shared dependency can interrupt the workflows that customers use to generate
      and service demand.
    claimRefs: ["CU005", "CU009", "CU013"]
    figureRefs: ["FU001"]
