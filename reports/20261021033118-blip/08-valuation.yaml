    title: Recommendation logic
    type: flow
    summary: "Evidence moves from operating proof through price and downside tests to a research-more decision."
    data:
      nodes:
        - id: scale
          label: "Company-reported scale"
          value: "125M+ interactions per day"
        - id: commercial-proof
          label: "Commercial proof"
          value: "Company case metrics, not audited economics"
        - id: financing-context
          label: "Financing context"
          value: "$230M reported raised across three rounds"
        - id: price-test
          label: "Price test"
          value: "$300M report conflicts with unavailable-valuation disclosure"
        - id: downside-test
          label: "Downside test"
          value: "Pricing, platform, infrastructure, and liquidity gaps"
        - id: recommendation
          label: "Decision"
          value: "Research more; valuation stance unknown"
      edges:
        - from: scale
          to: commercial-proof
        - from: commercial-proof
          to: financing-context
        - from: financing-context
          to: price-test
        - from: price-test
          to: downside-test
        - from: downside-test
          to: recommendation
    approximationNotes: "The flow is qualitative; it does not imply a conversion rate, valuation probability, or causal weighting."
    claimRefs: [CV003, CV005, CV006, CV007, CV008, CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Research more before pricing
    body: >-
      Obtain primary financing terms and current cohort economics before translating
      Blip's operating signals into a valuation range or target return.
    claimRefs: [CV001, CV002, CV013, CV014]
  - calloutType: risk
    title: Do not equate funding with available cash
    body: >-
      The reported $230 million cumulative financing is historical capital raised and
      does not establish current liquidity, burn, runway, or distributable value.
    claimRefs: [CV003]
