  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market sizing
      missingEvidence: Independent market size and CAGR by geography, customer segment, channel, and included software or services spend.
      whyItMatters: Without consistent boundaries and periods, TAM, SAM, SOM, penetration, and growth assumptions cannot be valued defensibly.
      diligencePath: Obtain current paid analyst datasets and build a bottom-up model from qualified accounts, annual contract value, message volume, and attach rates.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer segments
      missingEvidence: Procurement role, economic buyer, budget owner, sales-cycle length, implementation effort, and contract size by target vertical.
      whyItMatters: Buyer authority and budget source determine reachable SAM, go-to-market efficiency, and adoption timing.
      diligencePath: Review anonymized pipeline and win-loss data, then interview customers and lost prospects across the five named verticals.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: independent adoption benchmarks
      missingEvidence: Source-neutral corroboration of daily interaction volume, customer counts, conversion uplift, retention, and production usage.
      whyItMatters: Company and competitor claims cannot establish durable demand, customer outcomes, or relative adoption on their own.
      diligencePath: Request cohort exports and customer references, then reconcile them with channel-provider records and independent market research.
      relatedQuestionRefs: [QM010]
    - type: conflicting-data
      severity: minor
      topic: enterprise positioning
      missingEvidence: Independent current pricing, onboarding, implementation, and customer-fit comparisons across Blip and self-service substitutes.
      whyItMatters: Available adverse descriptions come from competitors and may overstate price or complexity differences.
      diligencePath: Collect comparable vendor quotes and implementation statements of work for matched enterprise and mid-market scenarios.
      relatedQuestionRefs: [QM008]
