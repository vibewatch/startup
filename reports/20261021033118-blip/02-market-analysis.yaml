      - [WhatsApp customer journeys, Acquisition through sales and post-sales on one number, Basic WhatsApp Business App use, Enterprise organization; budget owner not public, Blip's clearest evidenced product wedge]
      - [Conversational commerce, Product selection order payment and loyalty workflows, General ecommerce software outside messaging, Retail or consumer-goods enterprise; payer not disclosed, Company-described monetizable workflow]
      - [SMB team inbox and simple automation, Shared inbox broadcasts and basic flows, Enterprise consulting and complex bot programs, Small-business owner or operator according to competitor pages, Substitute segment served by lower-cost self-service tools]
    notes: >-
      Boundary uses Blip and Caplight descriptions; SMB substitution is based on competitor-issued pages,
      not independent market research, and buying roles remain undisclosed.
    claimRefs: [CM001, CM002, CM003, CM004, CM014, CM015]
