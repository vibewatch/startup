      - [Customer use-case intensity, Blip, Single month; customer geography not specified, More than 50 thousand messages, Company case snippet for Feito Chocolate, Low, One selected customer and no denominator]
      - [Commerce outcome, Blip, Period and geography not specified, 3x higher conversion, Unpublished company comparison, Low, Baseline cohort sample and methodology absent]
      - [Company adoption proxy, Airframe, As-of date not disclosed, 163 reference customers and 1425 employees, Third-party profile display, Low, No customer definition date or market denominator]
    notes: >-
      Values are operating and adoption proxies only. No retained source supplies a dollar market size,
      CAGR, geographic TAM, reachable SAM, or evidence-based SOM.
    claimRefs: [CM010, CM011, CM012, CM013]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Evidenced workflow, User, Payer, Budget owner, Adoption trigger]
    rows:
      - [Financial services, Queries transactions and customer service, Service and operations teams inferred from workflow, Enterprise organization; role not disclosed, Not public, Need for automated interactions with privacy and security requirements]
      - [Retail, Purchasing and personalized service, Sales and service teams inferred from workflow, Enterprise organization; role not disclosed, Not public, Need to assist purchases inside messaging]
      - [Consumer goods, Customer conversations and commerce, Sales and engagement teams inferred from workflow, Enterprise organization; role not disclosed, Not public, Need for personalized conversational engagement]
      - [Transportation and logistics, Data deadlines inventory and process automation, Operations and service teams inferred from workflow, Enterprise organization; role not disclosed, Not public, Need to automate operational and customer processes]
      - [Healthcare, Company processes and patient experience, Service and operations teams inferred from workflow, Enterprise organization; role not disclosed, Not public, Need to improve patient interactions and automate processes]
    notes: >-
      Industries and workflows are company-described. User functions are workflow inferences; payer,
      procurement role, budget owner, contract path, and adoption timing require primary diligence.
    claimRefs: [CM001, CM002, CM004, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market boundary
    type: pyramid
    summary: >-
      The defensible market narrows from broad enterprise interaction software to Blip's WhatsApp-led
      workflows, but every layer remains unsized in the retained public evidence.
    data:
      nodes:
        - label: Enterprise customer-interaction software
          value: Unsized
          detail: Broad adjacent category; generic AI and unrelated contact-center spend are excluded.
        - label: Conversational AI and automation
          value: Unsized
          detail: Caplight classifies Blip within enterprise conversational AI.
        - label: Messaging orchestration
          value: Unsized
          detail: Blip documentation references WhatsApp, Google RCS, and other campaign channels.
        - label: Enterprise WhatsApp journeys
          value: Unsized
          detail: Blip describes acquisition, sales, post-sales, AI, automation, and human support.
        - label: Commerce and service workflows
          value: Unsized
          detail: Company pages identify commerce and multiple industry workflows.
        - label: Blip reachable spend
          value: Unknown
          detail: Pricing, qualified account count, penetration, and conversion to paid deployments are not public.
    approximationNotes: >-
      No area or level is value-proportional. The source pool does not support numeric TAM, SAM, SOM, or
      CAGR, so the diagram shows boundary logic rather than fabricated magnitude.
    claimRefs: [CM001, CM002, CM003, CM004, CM016]
callouts:
  - calloutType: insight
    title: Scale is not market size
    body: >-
      Daily interaction volume and selected customer-message counts demonstrate platform usage, but they
      cannot be converted into addressable revenue without unique-account, pricing, and paid-volume data.
    claimRefs: [CM010, CM011]
  - calloutType: risk
    title: Channel telemetry has timing limits
    body: >-
      Meta-dependent status updates, D-1 reporting, and held-message delays can slow campaign measurement
      and complicate ROI attribution for enterprise buyers.
    claimRefs: [CM006, CM007, CM008, CM009]
