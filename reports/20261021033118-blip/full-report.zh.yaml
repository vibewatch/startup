            body: >-
              TechCrunch 将 Roberto Oliveira、Daniel Costa、Sergio Passos、Marcelo Oliveira 和 Antonio Oliveira 列为创始团队，并在
              2024 年融资报道中引用 Roberto Oliveira
              作为公司主要发言人。这支持创始人长期参与的叙事，但不能证明当前高管名单、职能分工、董事席位、继任安排或投票控制权。指定资料足以列出被报道的创始人，却不足以宣称当前领导层披露完整。外部叙事高度集中于 Roberto
              Oliveira，构成关键人物尽调问题，但不等于证明公司实际依赖其运营。
