        - 供应商故障会中断机器人消息流、路由和历史记录
        - 高
        - 据报告，双方开展了纠正工作、重启服务、验证和监控
        - 冗余、独立故障切换、合同救济和复发情况仍未知
      - - 消息渠道接入
        - Meta、Google、Apple 及其他渠道所有者
        - Blip 声称拥有 Tier 1 合作关系；渠道收入和流量结构未披露
