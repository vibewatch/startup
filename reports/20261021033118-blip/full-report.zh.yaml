              - CM004
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              保留的资料没有提供独立市场规模、增长率，或一致的地域和期间，因此无法据此计算 TAM、SAM 或 SOM。最强的公开数量是运营代理指标：Blip 称每天处理超过 125 million
              次互动；电商页面描述某客户一个月交换超过 50 thousand 条消息；同页还声称使用对话式商务的品牌转化率高出三倍。Airframe 另列出 163 个参考客户和 1,425
              名员工，但抓取文本没有给出截至日期。这些数字说明规模和场景强度，而不是可服务支出；把它们当作收入、独立用户或市场规模，会改变指标、分母和经济含义。因此，可靠估值模型需要付费分析师数据，或自下而上搭建客户数、用量和定价模型。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Blip
              公开将交通物流、金融服务、消费品、零售和医疗列为目标行业，描述的工作流从库存和流程自动化延伸到交易、采购、个性化服务和患者体验。公开页面没有说明采购角色、预算负责人、合同规模，或软件与服务是否来自同一预算，因此细分图谱把已证实的工作流与未知的采购机制分开。采用似乎从接入渠道的机器人开始，再扩展到活动报告、自动化、AI
              和人工支持。Blip 声称拥有 ISO 认证和 Tier 1 合作关系，这些能力可能降低企业信任摩擦，但资料没有量化其对赢单率或部署时间的影响。
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM016
      - number: '2.4'
        title: 采用约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              计量质量和平台依赖限制了采用经济性。Blip 称活跃消息仪表盘按 D-1 更新，月末前数据可能变化；送达状态依赖 Meta，未决状态最多可占发送量的 4%，Meta 可能需要最多 20
              天更新暂存消息。这些限制会影响活动归因、运营支持和 ROI 证明时点。竞争资料还将 Blip
              描述为企业定价、销售把关、咨询驱动且对小企业技术要求高；由于两家发布方都在销售替代品，这些说法属于竞争性负面定位，而非独立定价证据。估值上行点是企业工作流深度和高消息强度，折价点是缺乏独立市场规模、透明定价、买方预算证据和中立采用基准。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
              - CM015
      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 规模不是市场规模
            body: 每日互动量和部分客户消息量证明平台被使用，但没有独立账户数、定价和付费消息量，就不能换算成可服务收入。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
          - type: callout
            title: 渠道遥测存在时效限制
            body: Meta 依赖的状态更新、D-1 报告和暂存消息延迟，可能拖慢活动计量，也会让企业买方更难归因 ROI。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖平台、专业厂商、替代方案与现状
        blocks:
          - type: paragraph
            body: >-
              买方并非只在同类聊天机器人套件中选择。ForesightIQ 将 Sinch、PolyAI、Inbenta 和 Tiledesk 列为相关竞争者，市场横跨通信基础设施、语音专用
              AI、客户体验套件和无代码聊天机器人。小型买方还可选择 WATI、Respond.io、Trengo、Zenvia 和 360dialog，技术能力较强的客户则可通过轻量层接入 Meta Cloud API
              或内部自建；低流量客户也能继续人工操作 WhatsApp。现有证据不能证明市场盘点完整或竞争者份额可比。
            claimRefs:
