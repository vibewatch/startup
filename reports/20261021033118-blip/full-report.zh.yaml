          - type: paragraph
            body: >-
              企业软件通常按收入增长、毛利率、留存、集中度和经常性收入倍数评估，但这些输入在这里都未公开。Multiples 的可比组包含对话式 AI 之外的业务，Caplight 只按产品相似性列出 Yalo 和
              Auronix，也没有可用估值。因此情景表围绕争议的 $300 million 采用方向性入场规则；乐观情景需要独立验证增长和留存，基准情景需要证明 2024
              年融资以来经济性保持，悲观情景则由留存弱、集中度高、利润率压力、优先权悬置或运营中断触发。
            claimRefs:
              - CV001
              - CV002
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Blip 仍是私有公司，Caplight 没有公开股票价格，也没有识别出公开 IPO
              计划。公开材料还没有披露买卖盘深度、已完成老股交易、转让限制、优先权级别或可能的退出时间。因此持有期、退出倍数和目标回报无法由指定证据支持。投资委员会定价前，应取得 Series C
              条款清单、完全稀释股权结构表、优先权瀑布、债务表、当前 ARR
              和确认收入、毛利率、净收入留存与总收入留存、队列流失、客户集中度、销售效率、可用性历史和已签管线。如果经验证的经济性无法支撑入场价、优先权明显使新普通股资本处于次级，或客户和基础设施集中制造未计价下行风险，投资逻辑就会失效。
            claimRefs:
              - CV004
              - CV007
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 定价前继续研究
            body: 在把 Blip 的运营信号转换为估值区间或目标回报前，应取得主要融资条款和当前客户队列经济性。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV014
          - type: callout
            title: 不要把融资等同于可用现金
            body: 累计融资 $230 million 是历史募集资本，不能证明当前流动性、烧钱速度、现金跑道或可分配价值。
            calloutType: risk
            claimRefs:
              - CV003
