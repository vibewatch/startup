  - id: FR001
    title: 基于证据的风险热力图
    type: matrix
    summary: 定性矩阵区分已观察到的或结构性的风险暴露、潜在影响和有证据支持的缓释成熟度。
    data:
      columns:
        - 暴露证据
        - 潜在影响
        - 缓释成熟度
      rows:
        - label: 外部数据库供应商
          values:
            - label: 已观察到的事故
              detail: Blip 将机器人不可用和消息流中断归因于外部数据库服务供应商。
            - label: 高
              detail: 接收、处理、发送、路由和对话历史均受影响。
            - label: 部分
              detail: Blip 报告已完成解决、服务验证并持续监控。
        - label: 消息平台依赖
          values:
            - label: 结构性
              detail: 该产品依赖消息应用和主要平台合作伙伴。
            - label: 高
              detail: 渠道接入和经济性是对话式商务与服务的核心。
            - label: 部分
              detail: 据称拥有 Tier 1 关系，但合同保护未公开。
        - label: 企业实施
          values:
            - label: 竞争对手报告
              detail: 利益相关的竞争对手将部署描述为技术驱动、由销售把关且由咨询主导。
            - label: 中
              detail: 主要风险暴露在价值兑现时间、交付成本和专业人才能力。
            - label: 未经验证
              detail: 未指定独立实施队列或失败率证据。
        - label: 合规证据范围
          values:
            - label: 披露缺口
              detail: 据称拥有全球 ISO 认证，但保留文本中没有标准、范围、有效期或审计材料，无法核实。
            - label: 未满足时为高
              detail: 受监管行业用例可能使缺失的控制措施或传输机制变得重大。
            - label: 未经验证
              detail: 证书、DPA、子处理方和监管机构记录需要尽调。
        - label: 自主商务控制
          values:
            - label: 公司描述
              detail: Blip 将无需人工介入且可完成支付的 AI 商务作为卖点。
            - label: 不受控时为高
              detail: 错误操作可能影响支付、隐私或受监管用户。
            - label: 未经验证
              detail: 防护栏、评测、升级率和损失事件证据需要尽调。
        - label: 商业透明度
          values:
            - label: 负面报道
              detail: 竞争对手称其定价不透明，模式由销售把关且由咨询主导。
            - label: 中
              detail: 定价和交付不透明会削弱投资判断，并推迟价值兑现。
            - label: 未经验证
              detail: 公开估值、详细定价、单位经济性和服务强度均不可得。
    approximationNotes: 序数标签是分析师评估，不是概率或分数；“未满足时为高”是条件性表述，不表示合规要求已经失败。
    claimRefs:
