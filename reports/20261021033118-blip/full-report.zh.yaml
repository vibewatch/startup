  - id: TV002
    title: 正反论点
    columns:
      - 立场
      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 正方
        - 公司报告的规模超过每日 125M 次互动。
        - 独立的使用量、收入、留存和客户集中度证据会提高置信度。
      - - 正方
        - 公司材料提到商务转化和客户参与成果。
        - 经审计的队列经济性和可归因增量收入，才能把验证点转化为投资判断依据。
      - - 反方
        - 竞争对手将 Blip 描述为企业定价、销售把关且实施负担重。
        - 合同层面的定价、部署时间、输赢数据和续约证据，可能反驳竞争对手的说法。
      - - 反方
        - 外部数据库供应商故障中断了机器人消息流。
        - 纵向可用性、恢复时间和客户影响数据可以量化这起事故究竟是孤立事件还是结构性问题。
    notes: 公司指标由公司自述；竞争对手批评属于利益相关方的反向证据，不是独立基准。
