        - 部署延迟、范围扩大或专业人才稀缺会推迟客户获得价值
        - 中
        - 竞争对手比较材料描述了企业工具、SDK 和引导式实施
        - 服务附加率、合作伙伴人才储备、积压量、上线时间和实施失败率未知
    notes: 指定来源未量化交易对手集中度；登记表将已记录的供应商事故与结构性平台依赖、以及置信度较低的竞争对手观察区分开来。
