      - number: '1.4'
        title: 规模、里程碑与运营风险
        blocks:
          - type: paragraph
            body: >-
              TechCrunch 2024 年 11 月的报道给出最具体的定日期规模数据：超过 4,000 个品牌、超过 300,000 个聊天机器人、每天超过 50 million 次对话、2022 年年收入超过 $100
              million，以及超过 1,500 名员工。这些是报道指标，不是经审计的当期结果。Blip 当前首页另称每天互动超过 125 million 次；该分母未必与 TechCrunch
              的每日对话数可比，因此不能把差异称为已测得的增长。里程碑包括 2014 年转向对话式营销、三轮机构融资，以及 2022 年和 2023 年收购 Stilingue、Gus。公司状态页还记录了 10 月 15
              日的一次中断：外部数据库服务商故障影响机器人消息流，说明公司确实依赖第三方基础设施，但不能据此证明事件会反复发生。
            claimRefs:
              - CO004
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
