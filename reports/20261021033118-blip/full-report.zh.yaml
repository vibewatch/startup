  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应比泛人工智能或客户体验软件更窄。Caplight 将 Blip 归为 B2B 企业软件；Blip 则描述了在 WhatsApp 上覆盖广告获客、销售、售后、自动化、AI
              和人工支持的旅程。相关类别位于企业对话式 AI、消息编排和客户运营的交叉处；相邻支出包括 CRM、联络中心、活动自动化和系统集成服务，应排除通用基础模型、消费消息和无关联络中心席位。替代方案包括内部自建和更简单的
              WhatsApp 自助工具，但现有比较资料来自竞争者，而非独立基准。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
              - CM015
