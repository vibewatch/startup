chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Blip 面向企业销售平台，编排消息渠道中的自动化和人工辅助客户对话，覆盖电商、客服、工作流和分析。官网强调端到端对话旅程，并称每天处理 125 million 次互动；独立资料和市场平台也一致将其定位为 B2B
              对话式 AI，而非消费应用。公司起源存在分歧：TechCrunch 和 Caplight 将其追溯至 1999 年，Tracxn 则列为 2017 年。总部同样有不同说法，TechCrunch
              称圣保罗，Tracxn 和 Caplight 称贝洛奥里藏特；在取得公司记录前，这两项都不能视为定论。
            claimRefs:
