      - number: '4.2'
        title: 规模信号有意义，但彼此无法调和
        blocks:
          - type: paragraph
            body: >-
              GetLatka 列出 2024 年 11 月年收入 $133.6 million，并将该观察归因于 TechCrunch；同时把 2023 年 11 月和 2024 年 10 月的数值分别标为估计。Blip
              官网称每天处理 125 million 次互动，第三方市场资料称其在 32 个国家处理超过 80 billion 条消息，并拥有超过 365,000 个聊天机器人。这些指标都不是
              ARR、合同储备、确认收入或毛利，且时间口径和分母不同，不能合并成增长率或每条消息收入估算。$133.6 million 更适合作为尽调锚点，而不是当前运行率。
