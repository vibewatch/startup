      - number: '3.3'
        title: 公开定价证据说明市场分层，而非可靠的同口径成本曲线
        blocks:
          - type: paragraph
            body: >-
              Blip 在指定官方来源中没有披露经验证的公开价格。Wuaps 称 Blip 方案月费从 EUR999 起，Klaros 则称其销售把关，通常在消息费用前高于每月
              USD500；两者都是竞争者，数字未经独立验证，也未必能按地域、范围或合同期限比较。BossBot
              为面向中小企业的替代品宣传了低得多的入门价格。价格透明度和自助开通确实是攻击面，但不能证明这些工具能替代复杂企业中的 Blip；更换供应商还可能昂贵，因为对话历史不能转移，模板和机器人流程必须重建。
