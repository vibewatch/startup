  - id: TV003
    title: 乐观 / 基准 / 悲观情景框架
    columns:
      - 情景
      - 假设与估值逻辑
      - 概率信号
      - 下行或决策触发条件
    rows:
      - - 乐观
        - 只有在当前增长、留存、利润率和持久的企业扩张得到独立验证后，才会考虑高于据报 $300M 的入场价。
        - 合格管线增长、队列表现强劲、利润率改善且集中度低。
        - 若验证不完整或增长由服务驱动，则拒绝溢价。
      - - 基准
        - 仅将 $300M 作为尽调锚点；设定估值区间或目标回报前，必须取得一手证据。
        - 增长和留存稳定、集中度可控，且没有明显的优先权负担。
        - 若 C 轮条款或当前财务数据无法与锚点核对一致，则暂停。
      - - 悲观
        - 当单位经济性、优先权级别和流动性仍未知时，低于 $300M 的价格并不会自动变得有吸引力。
        - 队列疲弱、利润率承压、客户集中或可靠性问题反复出现。
        - 若下行保护依赖未经验证的退出倍数或无法进入的二级市场，则放弃。
    notes: 方向性情景是决策规则，不是公允价值估计；由于所需财务基准数据不可得，未赋予概率百分比。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV009
