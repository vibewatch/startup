              - CP016
      - number: '3.4'
        title: 护城河来自运营与生态，但供应商依赖削弱耐久性
        blocks:
          - type: paragraph
            body: >-
              可防御性来自企业实施深度、集成、工作流广度以及接入主要消息生态，而不是某个独有渠道。Blip 声称的平台关系和每日互动量可能强化信任与分发；LeadIQ 估计约 1,400
              名员工，也说明交付能力不弱。反面是，官方状态页记录外部数据库供应商中断了机器人消息接收、处理、发送、路由和历史记录。该事件不能证明持续可靠性劣势，却说明关键服务质量依赖上游基础设施。在缺乏独立可用性、赢单率、留存、实施时长和总成本基准的情况下，护城河耐久性仍是尽调问题，而不是已证明的结果。
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP014
              - CP015
