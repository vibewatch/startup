      - number: '1.3'
        title: 融资与利益相关者结构
        blocks:
          - type: paragraph
            body: >-
              按融资轮次看，公开记录最清楚。TechCrunch 报道 SoftBank 在 2024 年 11 月领投 $60 million Series C，Microsoft 参与，使累计融资达到 $230
              million；Tracxn 也列出截至 Series C 的三轮融资和相同总额。Caplight 将 SoftBank、Warburg Pincus 和 Accel
              列为重要投资者，但称估值未公开。已融资金额不能当作账上现金；公开记录也没有披露持股比例、清算优先权、债务、老股交易价格、董事会权利或投后估值。
