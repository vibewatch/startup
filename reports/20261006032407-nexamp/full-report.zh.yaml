  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险分析
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的分布式发电业务模式在结构上暴露于公用事业并网摩擦、州级项目规则变更和承购方合同可执行性风险。 在纽约，法院对 Nexamp 起诉 Consolidated Edison 及 Orange and
              Rockland Utilities 的合同和允诺禁反言主张作出 驳回且不得就同一请求重新起诉，凸显了开发前的重大资产负债表风险 [CR001]。在该争议中，Nexamp 在收到 RFP 中标通知后、最终合同
              签署前，承诺支付不可退还的 $600,000 土地租赁款；联邦法院根据公用事业 RFP 保留条款，将其认定为无法追回的 商业风险 [CR002]。在伊利诺伊州，公用事业延误拖慢开发速度，Nexamp
              及项目关联方因此就公用事业法规合规问题， 向伊利诺伊州商务委员会针对 Ameren Illinois 提交了经核实的正式并网投诉 [CR003]。此外，纽约州项目和通过 FEJA、CEJA 建立的
              Illinois Shines 州级社区太阳能激励结构，决定虚拟净计量抵扣和折扣经济性；区域政策调整或 资费争议会直接影响开发商回报 [CR004] [CR005]。
            claimRefs:
              - CR001
              - CR002
