      - number: '4.3'
        title: 资本密集度与融资依赖
        blocks:
          - type: paragraph
            body: >-
              近期融资证明 Nexamp 能获得机构资本，但不能证明流动性或资金续航。Hoodline 报道 2026 年两名投资者提供约 $180 million 股权；Mercom India 另报 $200
              million 延迟提款信贷工具，其中最初承诺 $125 million，并带有 $75 million 选择权。Tracxn 报道 13 轮股权和债务融资累计 $1.45
              billion。由于融资类别不同，这些数字不能相加推断手头现金。最新信贷工具用于项目部署和客户基础扩张，说明项目成为运营资产前，增长先消耗资本。公开证据未披露未提款额度、利息支出、到期日、抵押物、契约余量、税收股权义务、项目层面杠杆、公司现金消耗或可用于管线的非受限现金金额。
