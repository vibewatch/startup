      - number: '1.3'
        title: 资本形成、资产规模与融资工具
        blocks:
          - type: paragraph
            body: >-
              Nexamp 已建立大量结构化项目融资和公司资本渠道，以支撑全国项目管线。Mitsubishi Corporation 2016 年初次投资时，公司管理约 40 MW 发电资产；到 2024
              年初，运营中及在建容量已超过 1.5 GW，可为逾 300,000 户家庭供电。2024 年 4 月，Nexamp 完成由主投资人 Manulife Investment Management 和现有股东承销的
              $520 million 股权轮；2026 年 6 月，又从 Crédit Agricole CIB 获得 $300 million 聚合证券化融资工具。Forge Global 等私募市场平台追踪 Series
              1E2 每股 $1,668.68 的价格，截至 2026 年 2 月对应 $1.49 billion 投后估值基准。但公开披露未提供 GAAP
              审计收入、ARR、运营利润率或完整订阅客户流失率，形成重大尽调缺口。Better Business Bureau 等机构留存的客户投诉文件，则记录了各运营辖区的争议处理义务和服务咨询量。
            claimRefs:
              - CO012
              - CO014
              - CO015
              - CO016
              - CO017
      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 双层公司母体与机构资本基础
            body: >-
              Nexamp 既获得多数股东 Mitsubishi Corporation 的资产负债表支持，也成功吸引 Generate Capital、Manulife Investment Management 和
              Crédit Agricole CIB 等一线基础设施资本。相比独立区域开发商，这一结构化金融生态带来显著资本优势。
            calloutType: insight
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分定义
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的可服务市场受州级分布式能源政策限定，尤其是虚拟净计量（VNM）和社区分布式发电（CDG）授权立法。社区太阳能平台不同于公用事业规模的商用发电或表后屋顶太阳能，部署通常每站 1 至 5
              MW、接入本地配电网络的中型分布式发电资产。收入依靠两类经济机制：将分配给场外居民、商业和市政订阅客户的公用事业账单抵扣额度货币化，以及通过长期土地或屋顶租约锁定项目选址。市场支出严格限于有法定订阅框架的辖区，例如纽约的
              NY-Sun/CDG，以及伊利诺伊州的 Climate and Equitable Jobs Act（CEJA）和 Illinois Shines Adjustable Block
              Program。居民屋顶设备销售、客户融资的 EPC 合同，以及在没有零售抵扣机制时直接向区域输电组织销售批发电力的大型商用输电项目，均不计入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模测算视角与政策边界
        blocks:
          - type: paragraph
            body: >-
              社区太阳能机会应按法定容量上限和公用事业辖区边界分层测算，而不是套用一个投机性的自上而下 TAM。纽约等主要运营州通过 New York Public Service Commission 的立法扩展，在
              NY-Sun 计划下批准 $1.4 billion 资金，并把分布式太阳能部署目标扩大到 2030 年 10 gigawatts，以支持该州 70% 的可再生能源目标。伊利诺伊州的 Climate and
              Equitable Jobs Act 同样规定，到 2030 年可再生发电占比 40%、2040 年占比 50%，推动该州社区太阳能部署容量位列全国第四。订阅客户层面的可服务支出，还受
              ComEd、Ameren、National Grid、Central Hudson、NYSEG 和 ConEd 各辖区客户数限制。Clarity 和 EquityZen 等私募二级市场平台追踪机构 IPO
              前股份交易及私人资本承诺，反映投资者持续对这一分布式平台进行投资判断。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方细分与客户获取经济性
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的获客覆盖四个主要经济细分：居民大众市场、低至中等收入（LMI）家庭、商业物业所有者与市政机构，以及农村土地所有者。居民和小企业订阅客户的核心价值是公用事业账单节省：通常在账单抵扣额度上提供 10
              至 15% 折扣，无需前期资本、不设长期合同锁定，也无取消罚金或信用评分检查。参加 LIHEAP、SNAP 等社会福利项目且符合收入条件的家庭，可通过 Illinois Solar for
              All（ILSFA）等州项目，以及与 ComEd 合作的 15 年 Give-A-Ray 计划，获得最高 20% 的增强折扣。商业房东和农村物业主则作为场地出租方参与，由 Nexamp
              全程管理数十年场地控制协议，把闲置土地或商业屋顶转化为被动的长期租赁收入。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动因素与结构性采用约束
        blocks:
          - type: paragraph
            body: >-
              联邦 Inflation Reduction
              Act（IRA）、低收入家庭能源负担纾解计划和州级公用事业脱碳配额等宏观政策，推动社区太阳能加快采用。低收入家庭的能源负担最高是高收入家庭的三倍，促使监管部门为公平项目预留专门容量。但结构性约束也带来明显运营摩擦。项目部署高度依赖公用事业并网队列；延迟和与区域配电公用事业围绕基础设施升级的争议，会卡住项目进度。客户关系管理和订阅客户计费同样持续承压；Better
              Business Bureau（BBB）与 Trustpilot 的外部反馈和争议记录反复提到公用事业账单协调、居民搬迁时账户转移延迟以及发票时间透明度问题。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 监管政策是首要边界条件
            body: >-
              不同于靠开放式企业采购扩张的软件或硬件市场，社区太阳能增长严格受公用事业配电容量和州立法约束。Nexamp 的扩张速度直接取决于纽约 CDG、伊利诺伊 Adjustable Block Program
              等法定项目。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
          - type: callout
            title: 并网队列与订阅客户账单摩擦
            body: 运营扩张受到公用事业电网并网争议积压以及消费者对账单抵扣延迟不满的结构性阻力。监管投诉和客户评价显示，与现有公用事业协调抵扣核算仍是关键运营瓶颈。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与同业定义
        blocks:
          - type: paragraph
            body: >-
              现有证据呈现的是分层竞争格局，而不是一个边界清晰的同业集合。Owler 将 Nautilus Solar Energy、Ecoplexus 和 Sunworks 列为 Nexamp
              的主要竞争者，可用于识别候选同业，但不能视为经过独立验证的市场份额排名。Craft 又把光伏供应商、非营利安装商、可再生能源服务商和组件技术供应商纳入其中，说明通用公司数据库会把直接开发商
              与相邻业务混在一起。实际替代方案范围更广：客户可以继续使用公用事业默认供电，符合条件的房主可以安装屋顶 太阳能，资产所有者也可以采购能源管理软件或在内部搭建运营流程。RatingFacts
              列出的无关消费者替代方案进一步 说明，自动生成的对比页面不应被当作独立竞争基准。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP007
              - CP012
      - number: '3.2'
        title: 能力与定价权衡
        blocks:
          - type: paragraph
            body: >-
              Nexamp 自己发布的州级页面最清楚地说明了面向客户的差异化，但并未证明其同业表现更优。在纽约，公司宣传每年 节省电费 10%、无注册费、无长期合同且无取消费；在伊利诺伊，公司宣传账单抵扣标准折扣为
              15%，符合收入条件 的家庭最高可享 20% 折扣。同一批页面将屋顶太阳能描述为前期成本更高、长期节省更多的方案，同时要求业主维护、
              房主拥有合适屋顶，并可获得税收激励。因此，社区太阳能更容易参与，但价值并非显然更高。留存来源没有直接同业 的定价、服务水平、取消条款或监管控制信息，这些比较项仍未知。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.3'
        title: 分销、切换与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Nexamp 称其在七个明确列出的州运营社区太阳能电站；其低至中等收入文章于 2026 年 3 月更新时，公司正在考虑
              扩展到新墨西哥、弗吉尼亚和夏威夷。同一份公司来源还介绍了与社区组织的合作，以及为符合条件家庭提供免费抵扣 的 15 年 ComEd
              项目。这些披露表明，公用事业区域准入、项目可用性、社区合作关系和注册执行，比软件排他性更 重要。不过，免费取消和缺少长期消费者合同也削弱了合同锁定。留存证据池没有关于流失、多重使用、队列准入、
              订阅者获客成本或合作伙伴排他性的独立客户群证据，因此不能仅凭覆盖范围推断持久护城河。
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: 不利信号与投资判断缺口
        blocks:
          - type: paragraph
            body: >-
              这组证据里最强的不利信号是证据质量，而不是已验证的运营失败。Owler 估计 Nexamp 有 250-500 名员工，而 GetLatka 报告截至 2026 年 9 月 10 日有 568
              名员工；后者还将页面标为 SaaS 数据库，并称不发布 Nexamp 的 替代方案。Owler 的融资和收入字段是估计值，不是经审计披露；RatingFacts 则生成了类别不匹配的替代方案。这些
              不一致使精确的同业规模比较不适合用于投资判断。买方或投资者在赋予 Nexamp 分销、信任或资本成本优势之前，应
              要求提供直接竞争者定价、项目和订阅者数量、公用事业区域重叠、取消客户群、并网排位，以及监管或投诉记录。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 低摩擦不等于锁定
            body: 无长期合同和无取消费降低了注册门槛，但留存证据池无法说明订阅便利性带来的是持久留存，还是仅仅更容易切换。
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开变现机制是销售社区太阳能账单抵扣。Nexamp 称，订阅者按分配到的项目发电份额获得公用事业抵扣， 再以折扣价向 Nexamp
              支付抵扣费用。因此，收入取决于项目发电、公用事业抵扣、订阅者计费和回款，而不是软件 订阅或已披露的固定经常性费用。独立报道还提到，收入来源包括与投资级锚定承购方签订的长期合同，以及居民和
              小型商业订阅者。这种组合可能增强收入持续性，但留存证据没有披露收入构成、按客户群划分的合同期限、集中度、 信用损失或按项目确认的收入。超过 300
              个运营项目和数吉瓦管线说明规模，不说明盈利能力，因为项目收益率和组合 现金转化情况均未公开。
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI014
              - CI015
