  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 社区太阳能订阅与客户工作流架构
        blocks:
          - type: paragraph
            body: >-
              Nexamp
              是覆盖全生命周期的分布式清洁能源平台，负责构建、建设、持有和运营社区太阳能及电池储能系统（BESS）资产，并为公用事业用电客户提供端到端订阅服务。居民家庭、租户、低至中等收入（LMI）家庭以及商业或市政机构可在线注册，无需预付费用、长期锁定、信用检查或安装屋顶硬件。注册后，客户按历史用电画像获得区域分布式太阳能农场的一部分份额。太阳能阵列向本地配电网发电后，配电公用事业计算虚拟净计量（VNM）抵扣额度，并直接冲抵客户月度电费。Nexamp
              再按法定或合同折扣向客户收取这些抵扣额度的费用；纽约、伊利诺伊等核心市场通常实现 10% 至 15% 净节省，专门的社区公平计划下符合收入条件的家庭最高节省 20%。
            claimRefs:
