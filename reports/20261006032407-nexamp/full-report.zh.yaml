chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、覆盖范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nexamp, Inc. 是一家成熟的分布式清洁能源平台，由 Will Thompson、Dan Leary 和 Henri-Claude Bailly 于 2007 年 11
              月创立。公司总部位于马萨诸塞州波士顿和伊利诺伊州芝加哥，业务覆盖项目发起、选址收购、工程建设、长期资产持有和订阅客户管理。不同于传统居民屋顶太阳能安装商或纯软件聚合商，Nexamp
              为场外太阳能农场和电池储能设施融资并建设，向多个公用事业辖区的居民、企业、非营利组织和市政订阅客户提供账单抵扣额度。在纽约等主要运营地区，客户无需预付费用或承担取消费即可加入，预计每年可节省电费 10% 至
              20%。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
