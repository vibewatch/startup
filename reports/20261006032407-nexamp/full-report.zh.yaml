      - number: '4.4'
        title: 财务投资判断结论
        blocks:
          - type: paragraph
            body: >-
              公开记录支持可信的交易模式和较强融资能力，但不足以建立可靠的盈利或现金流模型。IncFact 将 2025 年 $100 million 至 $500 million 收入区间标为统计评估；RocketReach
              给出 2026 年 $135.6 million 年收入估算，但两者都没有审计报表或项目层面勾稽。这些估算只能作为规模方向性代理，不是 ARR，也不能用于利润率估值。2026 年 3 月，一名
              Trustpilot
              评论者还称账单问题近两年未解决。单条评论不能证明发生率，但提示应测试回款和客户服务风险。因此，在判断收入质量、利润率路径或资本充足性前，投资判断需要审计财务报表、队列留存与回款、项目现金收益率、债务计划以及完工资金计划。
