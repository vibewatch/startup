  - id: FV001
    title: 投资评估与建议逻辑链
    type: flow
    summary: 从运营规模和融资速度，经资本结构悬垂，推导至最终“继续研究”建议的系统化过程。
    data:
      nodes:
        - id: scale-and-footprint
          label: 1. 运营规模与覆盖范围
          description: 覆盖 17 个州、服务约 80,000 名客户的 1.5 GW 运营中 / 建设中组合。
        - id: capital-access
          label: 2. 机构资本获取
          description: 2026 年上半年获得 $180M Series 1E2 股权融资和 $106M 组合债务。
        - id: structural-overhang
          label: 3. 优先股清算悬垂
          description: 2026 年股权轮包含高级 1.0x 清算优先权及 13.5% 累积股息。
        - id: operating-risks
          label: 4. 运营与监管摩擦
          description: 客户服务账单争议及州级费率修订不确定性。
        - id: diligence-path
          label: 5. 私人尽调验证
          description: 审计项目层面的净现金收益率、客户流失队列和债务覆盖。
        - id: recommendation-outcome
          label: 6. 建议结论
          description: 完成保密资本结构和现金收益率尽调前，建议继续研究。
      edges:
        - from: scale-and-footprint
          to: capital-access
        - from: capital-access
          to: structural-overhang
        - from: structural-overhang
          to: operating-risks
        - from: operating-risks
          to: diligence-path
        - from: diligence-path
          to: recommendation-outcome
    approximationNotes: 流程顺序反映定性尽调关卡的推进。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV012
