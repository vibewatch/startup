      - number: '4.2'
        title: 定价与分销经济性
        blocks:
          - type: paragraph
            body: >-
              宣传定价是对公用事业账单抵扣价值的折扣，并非已披露的每千瓦时价格或公司实际抽成率。Nexamp 宣传纽约节省 10%、伊利诺伊节省 15%，两个市场的收入合格客户均可获得最高 20%
              折扣。公司还宣传无前期成本、无长期合同、 无信用审查和无取消费。这些条款降低注册摩擦，却也限制合同锁定，因此留存和替换经济性很重要。Nexamp 称其与
              社区组织和保障性住房提供方合作，承担推广费用并支付转介费；但留存来源没有量化这些费用、获客成本、销售周期、 回本期或渠道生产率。因此，价目折扣只能说明客户价值主张，不能说明实际净收入或销售效率。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
