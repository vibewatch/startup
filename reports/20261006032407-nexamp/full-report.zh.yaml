              Nexamp 的交易对手高度集中于投资者所有的公用事业，这些公用事业把控电网并网、抵扣分配和资费管理。社区太阳能 客户以固定折扣向 Nexamp 购买公用事业账单抵扣：纽约为 10%，伊利诺伊为
              15%；因此，Nexamp 的现金回收机制 直接依赖公用事业及时计算抵扣并实现透明的账单整合 [CR011] [CR012]。参与伊利诺伊州 Rockford 的 Give-A-Ray
              等专门低至中等收入项目，还会与市政及保障性住房合作方共同承担 15 年期合规义务 [CR013]。若征集被取消或 公用事业电网纾困要求改变，而前期租赁和工程支出又无法收回，就会产生资产减值
              [CR014]。多州开发管线的资本 密集性要求持续获得项目融资，使伊利诺伊等关键地区尚未解决的并网队列争议成为收入转化的实质性阻力 [CR015]。
