      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >-
              Nexamp 由董事长兼 CEO Zaid Ashai 领导；他已推动公司增长十余年。联合创始人 Will Thompson 任 Nexamp Asset Management Services
              高级副总裁，负责项目全周期运营衔接。管理层还包括 CFO Peter Tawczynski、首席开发官 Chris Clark、首席战略官 John Murphy、首席基础设施部署官 Chris Perron
              和总法律顾问 Kamran Idrees。Mitsubishi Corporation 掌握治理和公司控制权：2016 年首次入股，并于 2018 年通过其位于洛杉矶的子公司 Diamond Generating
              Corporation 将 Nexamp 纳为合并子公司。机构股东基础随后进一步多元化，Generate Capital 于 2021 年 8 月投资 $240 million，Manulife
              Investment Management 于 2024 年 4 月牵头 $520 million 融资轮，Diamond Generating 和 Generate Capital 参与。
            claimRefs:
              - CO006
