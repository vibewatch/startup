      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: PPA 前支出负债与交易对手拖延
            body: >-
              Nexamp, Inc. v. Consolidated Edison
              案的联邦法院驳回裁定表明，在签署最终公用事业合同前执行场地租约，开发商要承担未被缓释的资产负债表风险。在竞争性采购环境中，公用事业保留取消征集且不补偿第三方开发商支出的明确权利。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 并网诉讼是项目开发瓶颈
            body: 向州公共事业委员会提交的正式投诉表明，电网并网队列仍是社区太阳能组合建设最大的运营摩擦点。公用事业电网运营商造成的延迟会直接拉长资本回收期并威胁项目交付时间表。
            calloutType: insight
            claimRefs:
              - CR003
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的核心投资论点在于其处于分布式社区太阳能发电领域的领先运营位置：公司在 17 个州、20 多个区域公用 事业市场运营，拥有超过 1.5 GW 的在运及在建清洁发电资产。Nexamp
              向消费者和商业承购方提供标准 10% 至 15% 的公用事业账单折扣，且无设备前期资本投入、无长期合同锁定、注册流程简化，已将订阅者规模扩大到近 80,000 个 活跃账户。平台的多层资本获取能力也得到
              Generate Capital、Manulife Investment Management、Mitsubishi 旗下 Diamond Generating Corporation 等一线基础设施投资者，以及
              First Citizens Bank 等大型银行贷款方的验证。 反过来看，结构性反论点是 Nexamp 激进的资产持有模式需要持续债务再融资和项目层面杠杆，使股权价值高度敏感于
              资本成本上升、州级净计量监管变化、并网延迟和客户账单摩擦。客户服务记录反复出现账单争议升级和账户转移瓶颈， 清算瀑布条款则显示，普通股持有人之前存在大量优先股悬置权益。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.2'
        title: 资本结构、融资安排与清算悬置
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的资本结构通过持续进行公司股权、税收股权和专用资产层面信贷融资不断扩张。2024 年 4 月完成关键的 $520 million 股权融资、达到初始独角兽估值基准后，Forge Global
              私募市场记录显示，Nexamp 于 2026 年 2 月 27 日又完成 $180 million 的 Series 1E2 股权融资，价格为每股 $1,668.68，投后股权估值达到 $1.49
              billion。 但这轮 Series 1E2 融资的治理和分配机制，对普通股回报构成了很高的门槛。该轮享有高级第 1 顺位清算优先权， 倍数为 1.0x，属于非参与型，并带有 13.5% 的累计股息率；其条款与
              2024 年 4 月 Series 1E 轮一致，后者的累计 股息率为 12.0%。与此同时，债务融资继续给运营组合叠加高级固定费用，其中包括 2026 年 6 月由 First Citizens
              Bank、Huntington Bank 和 Siemens Financial Services 为 20 个运营项目完成的 $106 million、5 年期项目债务 融资，以及 Tracxn 报道的
              2026 年 4 月常规债务融资。对潜在股权投资者而言，高级累计股息不断累积，在次级股权 分层参与价值实现前形成了陡峭的估值门槛。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV012
      - number: '8.3'
        title: 情景分析、退出路径与关键尽调要求
        blocks:
          - type: paragraph
            body: >-
              将 Nexamp 放入宏观经济和监管情景中评估，可以看到回报分布并不对称，核心取决于资本成本、政策稳定性和订阅者
              留存。基准情景下，在联邦清洁能源政策稳定、纽约州、伊利诺伊州和马萨诸塞州社区太阳能项目持续的支持下， Nexamp 到 2028 年将组合容量以个位数高段的速度扩张至 2.5 GW。按这一基线，2027 至
              2028 年最终上市或机构 重组可能带来 $2.2B 至 $2.7B 的预计企业价值；扣除高级累计股息后，成长轮投资者的回报倍数为 1.4x 至 1.7x。
              乐观情景下，公用事业规模储能配套快速建设、企业订阅者采用和利率下降将扩大利润率，并支撑 $3.5B 至 $4.0B 的 IPO
              估值。相反，悲观情景假设并网严重拥堵、州资费调整压缩社区太阳能账单抵扣利润率、坏账上升且债务再融资利率更高，导致股权价值跌破 $1.0B，并抹去清算优先权要求之下的次级分层。只有拿到机密股权结构表、
              组合净现金收益率和经审计违约数据，才有可能形成高确信度买入判断；现有证据还不够。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 推荐立场：继续研究股权投资
            body: >-
              尽管 Nexamp 在社区太阳能部署上拥有无可争议的领先地位、融资速度也已得到证明，成长股权投资者仍应在获得完整资本清算瀑布表和组合回款数据前暂缓承诺资本。Series 1E2 股权 13.5%
              的累计股息，给次级和普通股持有人带来严重下行风险。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV012
          - type: callout
            title: 清算优先权与股息门槛悬置
            body: >-
              Forge Global 的私募市场披露显示，Series 1E（2024 年 $420M）和 Series 1E2（2026 年 $180M）融资轮均带有高级 1.0x 清算优先权，并分别配套 12.0% 和
              13.5% 累计股息率；优先股权益快速复利，限制普通股上行空间。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV013
