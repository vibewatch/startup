          detail: 明确指名的直接同业；未保留一手简介
        - label: Ecoplexus
          x: 5
          'y': 2
          detail: 明确指名的直接同业；未保留一手简介
        - label: Sunworks
          x: 5
          'y': 1
          detail: 明确指名的直接同业，但指定细节极少
        - label: 屋顶太阳能
          x: 4
          'y': 5
          detail: 明确的客户替代方案，有公司撰写的比较
        - label: IBC SOLAR
          x: 2
          'y': 3
          detail: 相邻光伏供应商，而非已验证的直接同业
    approximationNotes: 两个轴均为分析师指定的 1-5 序数分数，不是市场指标：x 轴排名与相同买方任务的直接程度，y 轴排名指定来源深度。 分数依据明确的同业指名和来源具体性，不代表市场份额或产品优越性。
    claimRefs:
      - CP001
      - CP007
      - CP012
  - id: FI001
    title: 社区太阳能收入模式桥接
    type: flow
    summary: 该桥接图展示有证据支持的计费机制，以及公开财务披露止步之处。
    data:
      nodes:
        - id: project-generation
          label: 项目发电
          detail: Nexamp 拥有或运营的项目为公用事业电网发电。
        - id: utility-credit
          label: 公用事业账单抵扣
          detail: 公用事业将与订阅者项目份额相关的抵扣应用到账单。
        - id: subscriber-allocation
          label: 订阅者分配
          detail: 住宅、小型商业或锚定客户获得分配的收益。
        - id: discounted-payment
          label: 折价支付给 Nexamp
          detail: 订阅者按公开的州级折扣向 Nexamp 支付抵扣费用。
        - id: portfolio-revenue
          label: 组合收入
          detail: 收入组合、确认、回款和集中度均未公开披露。
        - id: cash-after-costs
          label: 扣除运营及融资成本后的现金
          detail: 毛利率、项目收益率、偿债和公司现金转化仍属私人信息。
      edges:
        - from: project-generation
          to: utility-credit
          label: 发电产生抵扣价值
        - from: utility-credit
          to: subscriber-allocation
          label: 通过公用事业账单分配抵扣
        - from: subscriber-allocation
          to: discounted-payment
          label: 订阅者获得节省
        - from: discounted-payment
          to: portfolio-revenue
          label: 支付支撑收入
        - from: portfolio-revenue
          to: cash-after-costs
          label: 私人成本与融资桥接
    approximationNotes: 这是机制图，不是按比例的瀑布图；不估算收入份额、毛利或现金转化。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI015
  - id: FE001
    title: Nexamp 端到端技术栈
    type: stack
    summary: 分层架构图，展示 Nexamp 从面向消费者的数字应用到底层实体电站遥测的技术运营组件。
    data:
      layers:
        - label: 订阅者体验与获取层
          detail: 客户数字化开户、公用事业账户验证和项目报名门户。
          items:
            - React 和 TypeScript 网页门户，动态核验公用事业邮编资格
            - 零信用检查验证的自动化订阅者注册流程
            - 定向 LMI 验证集成（LIHEAP 和 SNAP 资格渠道）
        - label: 财务建模与订阅计费引擎
          detail: 可扩展后端微服务，管理资本分配工具和账单抵扣开票。
          items:
            - 托管于 Microsoft Azure 的 Python（Django/FastAPI）应用服务
            - 跟踪客户太阳能份额和月度抵扣台账的关系型 SQL 数据库
            - 应用 10%–15% 法定抵扣折扣的自动化折扣开票引擎
        - label: 工业运营技术与机队 SCADA 层
          detail: 24/7 网络运营中心（NOC）管理电站实时遥测和控制。
          items:
            - Inductive Automation Ignition 和 AVEVA System Platform SCADA 环境
            - Azure 云托管监控服务器及高可用运营历史数据库
            - 系统化 NERC CIP 网络合规、VPN 隧道和防火墙访问控制
        - label: 现场控制与遥测网络基础设施
          detail: 变电站 RTAC 控制器、工业交换机和远程遥测单元。
          items:
            - 实时自动化控制器（RTAC）、逆变器和现场开关设备
            - 加固型工业路由器和安全遥测传输设备
            - 远程遥测和自动化逆变器调度控制器
        - label: 实体发电与共址储能资产
          detail: 太阳能光伏阵列、电池储能系统和公用事业并网设施。
          items:
            - 按 NEC 和 IBC 规范设计的分布式公用事业级太阳能光伏阵列
            - 符合 IFC 标准的共址电池储能系统（BESS）
            - 接入区域电网配电的公用事业公共耦合点（PCC）
        - label: 环境与退役生命周期控制
          detail: 许可、雨水管理、土地维护和组件回收协议。
          items:
            - 施工前场址适宜性分析和当地分区合规
            - 对退役光伏组件的全面组件回收承诺
            - 尽量减少环境扰动的可持续土地使用协议
    approximationNotes: 各层抽象呈现 Nexamp 的专有软件配置和第三方工业监控工具。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程地图
    type: journey-map
    summary: 从数字资格核验、太阳能电站分配，到账单抵扣流转和持续留存的端到端订阅者旅程。
    data:
      items:
        - label: 发现与资格核验
          touchpoints:
            - 数字落地页和公用事业邮编查询
            - 无信用检查自动资格核验
          detail: 潜在订阅者输入邮编，在运营公用事业区域内核验资格，无需前期费用或信用检查。
        - label: 报名与电站分配
          touchpoints:
            - 公用事业账户授权
            - 根据历史 kWh 用量确定太阳能份额规模
          detail: 订阅者提交基本公用事业账户信息，并被分配至与其用电量匹配的本地太阳能电站项目。
        - label: 并网与投运等待
          touchpoints:
            - 电站建设进度的电子邮件更新
            - 持续数月的公用事业并网排队
          detail: 客户等待太阳能电站送电和公用事业批准，首次发放抵扣前可能跨越多个账单周期。
        - label: 抵扣流转与账单处理
          touchpoints:
            - 公用事业账单抵扣（10-15% 折扣）
            - Nexamp 针对折扣抵扣的月度发票
          detail: 公用事业将虚拟净计量抵扣应用到订阅者电费账单，Nexamp 再按合同折扣单独向客户开票。
        - label: 客户服务与争议解决
          touchpoints:
            - 支持门户和电话咨询
            - 年度结算调整和抵扣对账
          detail: 持续支持订阅者，处理太阳能抵扣的季节性、净计量滞后，以及跨公用事业周期解决账单差异。
        - label: 留存与搬迁
          touchpoints:
            - 零罚金取消选项
            - 搬迁后重新申请账户
          detail: 客户按月灵活参与，流失风险主要在住宅搬迁或持续账单摩擦时出现。
    approximationNotes: 旅程阶段和运营触点依据订阅者服务条款、公用事业并网流程及已核实的客户投诉建模。
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU014
  - id: FR001
