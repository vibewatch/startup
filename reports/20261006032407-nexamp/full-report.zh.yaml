companyProfile:
  summary: >-
    Nexamp
    是一家垂直整合的社区太阳能与分布式清洁能源平台，负责开发、融资、建设、持有和运营场外太阳能及储能资产。公司向多个州的居民、商业、非营利组织和市政订阅客户销售公用事业账单抵扣额度，把项目持有、客户订阅管理和长期资产运营结合起来。Mitsubishi
    Corporation 通过 Diamond Generating Corporation 持有多数股权，Manulife Investment Management、Generate Capital
    及其他基础设施投资者也提供机构资本。
