      - number: '5.3'
        title: 全生命周期工程、并网与运营可靠性控制
        blocks:
          - type: paragraph
            body: >-
              部署和维护分布式社区太阳能基础设施，需要贯穿土建许可、环境影响评估、电气设计和电网并网的跨职能全生命周期工程。Nexamp 项目工程团队使用 AutoCAD 等计算机辅助设计（CAD）系统及 PVsyst
              等发电量模拟平台，建模系统表现和价值工程取舍。实体资产严格遵守 National Electrical Code（NEC）、International Building Code（IBC）和
              International Fire Code（IFC）；环境审查覆盖地形、雨水管理和退役承诺。              从运营可靠性和网络安全看，分布式 SCADA 网络执行 North American
              Electric Reliability Corporation Critical Infrastructure Protection（NERC CIP）标准，部署 VPN、防火墙、VLAN
              和系统化安全补丁。主要瓶颈是公用事业并网延迟、输电队列研究和账单同步；本地配电公司延迟应用抵扣额度，会直接损害订阅客户信任和营运资金效率。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: 展示
        blocks:
          - type: callout
            title: 分布式太阳能的双架构协同
            body: >-
              Nexamp 的竞争定位建立在打通两套传统上相互隔离的技术栈之上：工业级 SCADA
              遥测（AVEVA/Ignition）负责实时电网合规和资产正常运行，云原生消费者计费引擎（React/Django/Azure）则自动向数万公用事业账户分发小额抵扣。
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
          - type: callout
            title: 对公用事业抵扣处理的外部依赖
            body: 尽管内部软件自动化程度很高，Nexamp 的端到端产品交付仍受制于配电公用事业的旧计费系统。抵扣额度延迟 2 至 3 个账单周期才出现，会制造摩擦和支持工单负担，单靠软件优化无法绕开。
            calloutType: risk
            claimRefs:
