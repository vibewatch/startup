              客户服务评分显示总体消费者满意度较高：693 条已验证及未验证评价的综合评分为 4.4 / 5 [CR006]；但客户投诉暴露出持续数年的账单同步问题和注册延迟 [CR007]。部分订阅者称，从注册项目到
              收到第一张账单最长等待两年，且公用事业账单上的太阳能折扣抵扣到账延迟 [CR008]。共址电池储能系统还依赖当地 许可机构、保护委员会和消防部门，造成场址层面的开发瓶颈 [CR009]。Better
              Business Bureau 记录反复出现围绕 账单抵扣说明的消费者咨询类别，不过相对于客户总规模，投诉总量仍处于有限范围 [CR010]。
