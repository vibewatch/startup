      - number: '5.2'
        title: 软件栈、运营技术与 SCADA 资产管理
        blocks:
          - type: paragraph
            body: >-
              支撑 Nexamp 分布式覆盖的技术架构结合云原生消费者软件、金融工程工具和工业运营技术（OT）。软件栈以 React、TypeScript 前端、使用 Django 和 FastAPI 的 Python Web
              服务、SQL 关系数据库为核心，并通过 Terraform 在 Microsoft Azure
              上自动部署基础设施。面向客户和后台的软件负责获客、公用事业账户关联、抵扣自动核对以及分布式资产组合的资本部署建模。物理层面，运营技术网络运营中心（NOC）对资产群进行持续 24/7 监控和控制。OT
              监控依托工业监控与数据采集（SCADA）平台，具体为 AVEVA System Platform 和 Inductive Automation 的 Ignition；平台托管于安全的 Microsoft
              Azure 虚拟环境，并接入现场远程终端单元（RTU）、实时自动化控制器（RTAC）、受管工业网络交换机以及太阳能阵列和 BESS 装置中的现场遥测传感器。
            claimRefs:
