chapter:
  number: 4
  title: "Financials"
  summary: "Nexamp's public revenue model centers on selling utility bill credits to community-solar subscribers at a discount, supplemented by long-term offtake relationships, while recent equity and debt financings support a capital-intensive project pipeline. Public sources indicate operating scale but do not disclose audited revenue, margins, cash, burn, runway, project yields, or covenant headroom, leaving the equity case underwritable only after private financial diligence."
sections:
  - id: "revenue-model"
    title: "Revenue Model and Revenue Quality"
    body: "The clearest public monetization mechanism is the sale of community-solar bill credits. Nexamp says subscribers receive utility credits tied to their allocated share of project generation and then pay Nexamp for those credits at a discount. This makes revenue dependent on project production, utility crediting, subscriber billing, and collections rather than on a software subscription or a disclosed fixed recurring fee. Independent reporting also describes a mix of long-term contracts with investment-grade anchor offtakers and residential and small-commercial subscribers. That blend can improve revenue durability, but the retained evidence does not disclose revenue mix, contract tenor by cohort, concentration, credit losses, or recognized revenue by project. More than 300 operating projects and a multi-gigawatt pipeline indicate scale, not profitability, because neither project yields nor portfolio cash conversion are public."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-distribution"
    title: "Pricing and Distribution Economics"
    body: "Advertised pricing is a discount to utility bill-credit value, not a disclosed price per kilowatt-hour or realized corporate take rate. Nexamp advertises 10% savings in New York and 15% in Illinois, with income-eligible discounts reaching 20% in both markets. The company also advertises no upfront cost, no long-term contract, no credit check, and no cancellation fee. Those terms reduce enrollment friction but also limit contractual lock-in, so retention and replacement economics matter. Nexamp says it works with community organizations and affordable-housing providers, covers outreach expenses, and offers referral payments; however, no retained source quantifies those payments, acquisition cost, sales cycle, payback, or channel productivity. List discounts therefore establish customer value propositions, not realized net revenue or sales efficiency."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI002"
  - id: "capital-intensity"
    title: "Capital Intensity and Financing Dependence"
    body: "Recent financing demonstrates access to institutional capital but does not establish liquidity or runway. Hoodline reported roughly $180 million of equity from two investors in 2026, while Mercom India reported a separate $200 million delayed-draw credit facility with $125 million initially committed and a $75 million option. Tracxn reports $1.45 billion raised across 13 equity and debt rounds. These figures use different financing categories and should not be added to infer cash on hand. The latest credit facility was described as funding project deployment and customer-base expansion, reinforcing that growth consumes capital before projects become operating assets. Public evidence does not disclose undrawn availability, interest expense, maturities, collateral, covenant headroom, tax-equity obligations, project-level leverage, corporate burn, or the amount of unrestricted cash available to fund the pipeline."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "underwriting-verdict"
    title: "Financial Underwriting Verdict"
    body: "The public record supports a credible transaction model and substantial financing capacity, but not a reliable earnings or cash-flow model. IncFact labels its 2025 revenue range of $100 million to $500 million a statistical evaluation, while RocketReach presents a $135.6 million 2026 annual-revenue estimate; neither source supplies audited statements or project-level reconciliation. These estimates are directional scale proxies, not ARR and not a basis for margin valuation. A March 2026 Trustpilot reviewer also reported an unresolved billing problem lasting almost two years. One review cannot establish incidence, but it identifies a collections and customer-service diligence risk that should be tested. Investment underwriting therefore requires audited financials, cohort retention and collections, project cash yields, debt schedules, and a cash-to-completion plan before drawing a view on revenue quality, margin path, or capital adequacy."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
