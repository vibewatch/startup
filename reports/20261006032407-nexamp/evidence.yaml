evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: >-
      Audited GAAP financial statements including annual revenues, gross margins, project EBITDA, and debt covenant
      headroom.
    whyItMatters: >-
      Operating profitability and cash generation cannot be independently confirmed without audited income and cash flow
      statements.
    diligencePath: Request audited parent and project subsidiary financials under non-disclosure agreement during formal diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-ownership-split
    missingEvidence: >-
      Detailed post-2024 capitalization table, voting rights agreement, and board representation seats among Mitsubishi,
      Manulife, and Generate Capital.
    whyItMatters: Control dynamics and minority investor protections determine exit waterfalls and strategic governance flexibility.
    diligencePath: Review stockholders agreement, investor rights agreement, and voting agreement with management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: full-executive-and-board-enumeration
    missingEvidence: Complete board of directors list and external independent director identities.
    whyItMatters: Independent board oversight evaluates management performance and conflicts between shareholders.
    diligencePath: Inquire with corporate counsel for full director appointments and committee charters.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: national-market-share
    missingEvidence: >-
      Audited multi-state subscriber count breakdown and portfolio megawatt capacity share relative to total national
      operating community solar capacity.
    whyItMatters: >-
      Without third-party audited subscriber and megawatt numbers across all operating states, exact nationwide market
      share and revenue run rate cannot be independently verified.
    diligencePath: >-
      Request confidential portfolio operating disclosures, state-by-state subscriber rosters, and utility
      interconnection approval logs during management diligence.
    relatedQuestionRefs:
      - QM001
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: subscriber-retention-metrics
    missingEvidence: >-
      Statistically verified annual subscriber churn rates and utility uncollectible credit ratios across mass-market
      versus LMI segments.
    whyItMatters: >-
      Public review profiles and complaint logs highlight billing delays and relocation friction, but overall retention
      rates and collection losses remain unquantified.
    diligencePath: Review monthly cohort retention schedules and bad-debt allowance filings in audited financial statements.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: peer-scale
    missingEvidence: >-
      Primary, period-matched revenue, funding, employee, project, and subscriber metrics for Nexamp and each named
      direct peer.
    whyItMatters: >-
      Aggregator estimates cannot establish relative scale, financing capacity, or market share and produce a visible
      employee-count conflict.
    diligencePath: >-
      Request audited or management-certified peer metrics with dates and definitions, then reconcile them against
      project and subscriber records.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: direct-peer-pricing
    missingEvidence: >-
      Primary pricing, contract, service-level, cancellation, utility-territory, and capability documents for Nautilus
      Solar Energy, Ecoplexus, and Sunworks.
    whyItMatters: >-
      Without like-for-like peer terms, Nexamp's discount and low-friction packaging cannot be assessed as
      differentiated or durable.
    diligencePath: >-
      Collect current peer enrollment agreements, customer bills, tariff schedules, utility-territory maps, and
      cancellation policies.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP005
      - QP007
    relatedTableRefs:
      - TP002
      - TP003
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-posture
    missingEvidence: >-
      Independent complaint, consumer-protection, regulatory, outage, churn, and service-quality records for Nexamp and
      direct peers.
    whyItMatters: >-
      The assigned pool cannot compare trust, compliance, retention, or operating reliability, so it cannot support a
      risk-adjusted positioning conclusion.
    diligencePath: >-
      Obtain regulator dockets, attorney-general records, utility performance data, complaint cohorts, and independently
      verified customer retention data.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited revenue, recognition policy, gross margin, project cash yields, operating expenses, CAC, payback, churn,
      and bad debt.
    whyItMatters: >-
      Without these inputs, advertised customer discounts cannot be translated into reliable contribution margin or
      corporate cash generation.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, and project- and cohort-level unit-economics schedules
      under NDA.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, monthly burn, committed project expenditures, facility draws, undrawn availability, debt
      maturity, collateral, and covenant headroom.
    whyItMatters: >-
      Capital raised and committed facilities do not establish how much cash is available or whether Nexamp can fund
      projects through completion.
    diligencePath: >-
      Review the latest cash statement, 24-month liquidity model, debt register, borrowing-base certificates, and
      downside covenant forecast.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: enumeration-incomplete
    severity: material
    topic: billing-risk
    missingEvidence: Population-level billing lag, invoice error, complaint, resolution-time, churn, and collection-loss data.
    whyItMatters: >-
      A single adverse review identifies a plausible operating risk but cannot establish incidence or portfolio
      financial impact.
    diligencePath: >-
      Request monthly billing operations data and reconcile complaint cohorts to receivables aging, churn, and
      write-offs.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: scada-telemetry-metrics
    missingEvidence: >-
      Quantitative telemetry packet loss, SCADA server failover latency, and historical fleet-wide availability
      percentages across operational solar and BESS sites.
    whyItMatters: >-
      Validating operational claims of high uptime and low-downtime generation requires technical server audit logs and
      real-time NOC historical incident reporting.
    diligencePath: >-
      Request confidential Network Operations Center (NOC) performance audits, SCADA downtime logs, and NERC CIP
      third-party vulnerability assessments.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: material
    topic: utility-billing-synchronization
    missingEvidence: >-
      Automated API integration specifications and failure recovery rates between Nexamp's Django billing backend and
      regional utility EDI/billing platforms.
    whyItMatters: >-
      Subscriber bill credit delays represent a primary customer complaint vector; technical friction in utility data
      exchange directly affects churn and customer lifetime value.
    diligencePath: >-
      Review technical architecture documentation for utility electronic data interchange (EDI) adapters and batch
      credit reconciliation pipelines.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort retention schedules, annual subscriber churn percentages, and net revenue retention (NRR) figures
      across mature operating vintages.
    whyItMatters: >-
      Without audited churn and cohort retention metrics, customer lifetime value and the durability of contracted
      utility bill credit cash flows cannot be independently verified.
    diligencePath: >-
      Request audited subscriber cohort schedules, monthly churn logs, and replacement acquisition cost data directly
      from Nexamp investor relations during private diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Full customer registry of municipal, educational, healthcare, and commercial anchor subscribers across all
      operating states.
    whyItMatters: >-
      Public disclosure reveals only select partner case studies (e.g., Marcfirst, ComEd Give-A-Ray), obscuring
      commercial off-taker concentration and municipal contract expirations.
    diligencePath: Review Nexamp's complete commercial and industrial subscriber registry and anchor off-take agreements under NDA.
    relatedTableRefs:
      - TU003
