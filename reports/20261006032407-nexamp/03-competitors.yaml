chapter:
  number: 3
  title: "Competitors"
  summary: "The retained evidence identifies Nautilus Solar Energy, Ecoplexus, and Sunworks as direct peers, while rooftop solar, utility default supply, and energy-management software represent materially different substitutes. Nexamp's public offer is differentiated by low enrollment friction and state-specific bill discounts, but sparse primary competitor disclosure prevents a defensible conclusion that those advantages are durable."
sections:
  - id: "landscape-and-peer-definition"
    title: "Landscape and Peer Definition"
    body: "The evidence supports a layered landscape rather than a single clean peer group. Owler names Nautilus Solar Energy, Ecoplexus, and Sunworks as Nexamp's top competitors, which is useful for candidate identification but not an independently verified market-share ranking. Craft broadens the set to photovoltaic suppliers, nonprofit installers, renewable-service providers, and module-technology vendors, showing how generic company databases mix direct developers with adjacent businesses. The practical substitute set is wider still: customers can retain default utility supply, eligible homeowners can install rooftop solar, and asset owners can procure energy-management software or build operating workflows internally. RatingFacts' unrelated consumer alternatives demonstrate why automated comparison pages should not be treated as independent competitive benchmarks."
    claimRefs:
      - CP001
      - CP007
      - CP008
      - CP012
      - CP016
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: "capability-and-pricing-tradeoffs"
    title: "Capability and Pricing Tradeoffs"
    body: "Nexamp's own state pages establish its clearest customer-facing differentiation, but they do not establish superior peer performance. In New York, the company advertises 10% annual electricity-cost savings, no signup fee, no long-term contract, and no cancellation fee. In Illinois, it advertises a standard 15% discount on bill credits and up to 20% for eligible income-qualified households. The same pages frame rooftop solar as the higher-upfront-cost option with higher long-term savings, owner maintenance, homeowner and roof requirements, and access to tax incentives. That makes community solar more accessible but not unambiguously more valuable. Direct-peer pricing, service levels, cancellation terms, and regulatory controls are absent from the retained sources and therefore remain unknown in the comparison."
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP016
    tableRefs:
      - TP002
      - TP003
  - id: "distribution-switching-and-moat"
    title: "Distribution, Switching, and Moat Durability"
    body: "Nexamp says it operates community-solar farms in seven named states and was considering expansion into New Mexico, Virginia, and Hawaii when its low-to-moderate-income article was updated in March 2026. The same company-issued source describes partnerships with community organizations and a 15-year ComEd program that provides free credits to eligible households. These disclosures suggest that utility-territory access, project availability, community partnerships, and enrollment execution matter more than software exclusivity. However, no-fee cancellation and the absence of long-term consumer contracts reduce contractual lock-in. The retained pool contains no independent cohort evidence on churn, multi-homing, queue access, subscriber acquisition costs, or partner exclusivity, so a durable moat cannot be inferred from footprint alone."
    claimRefs:
      - CP010
      - CP014
      - CP015
    calloutRefs: []
  - id: "adverse-signals-and-underwriting-gaps"
    title: "Adverse Signals and Underwriting Gaps"
    body: "The strongest adverse signal in this pool is evidence quality, not a verified operating failure. Owler places Nexamp at 250-500 employees, while GetLatka reports 568 employees as of September 10, 2026; the latter also labels the page a SaaS database and says it publishes no Nexamp alternatives. Owler's funding and revenue fields are estimates, not audited disclosures, and RatingFacts produces category-mismatched alternatives. These inconsistencies make precise peer-scale comparisons unsuitable for underwriting. A buyer or investor should request direct competitor pricing, project and subscriber counts, utility-territory overlap, cancellation cohorts, interconnection positions, and regulatory or complaint records before assigning Nexamp a distribution, trust, or cost-of-capital advantage."
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP006
      - CP008
