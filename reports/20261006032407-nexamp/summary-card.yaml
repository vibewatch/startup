  topStrengths:
    - Large and growing community-solar operating footprint with multi-state scale.
    - Strong access to institutional and strategic capital, including Mitsubishi, Manulife, Generate, and bank debt.
    - Vertically integrated model combines development, ownership, and subscriber management.
  topRisks:
    - Public disclosure remains thin on project-level yields, collections, churn, and covenant headroom.
    - State policy, interconnection, and utility billing friction can delay cash conversion.
    - Preferred equity and debt layering create a meaningful overhang for common equity holders.
  unresolvedGaps:
    - Current post-2024 liquidation waterfall terms and common-equity upside remain insufficiently disclosed.
    - Portfolio-level cash yields, subscriber churn, and collections need private diligence.
    - Customer concentration and state-by-state policy exposure remain too opaque for a conviction buy call.
