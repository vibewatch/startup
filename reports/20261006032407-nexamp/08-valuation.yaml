  name: "Nexamp"
chapter:
  number: 8
  title: "Valuation"
  summary: "Nexamp commands an established footprint as a leading U.S. community solar platform with 1.5 GW operating and in-construction capacity across 17 states, having completed a $180M Series 1E2 equity round at a $1.49B post-money valuation in February 2026 and an incremental $106M 5-year debt facility in June 2026. However, with private market indicators showing senior 1.0x cumulative participating liquidation preferences paying a 13.5% dividend rate and thin public operating disclosures on project-level net cash yields, customer churn, and off-taker collections, an outright buy recommendation cannot be underwritten, supporting a research-more stance."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Nexamp centers on its preeminent operational position in the distributed community solar generation sector, operating across more than 20 regional utility markets in 17 states with over 1.5 gigawatts of operating and in-construction clean generation assets. By offering consumers and commercial off-takers standard 10% to 15% utility bill discounts with zero upfront equipment capital, no long-term contractual lock-in, and streamlined onboarding, Nexamp has successfully scaled its subscriber base to nearly 80,000 active accounts. Furthermore, the platform's multi-tier capital access is validated by Tier-1 infrastructure investors including Generate Capital, Manulife Investment Management, and Mitsubishi's Diamond Generating Corporation, alongside major bank lenders like First Citizens Bank. Conversely, the structural anti-thesis highlights that Nexamp's aggressive asset ownership model requires perpetual debt refinancing and project-level leverage, leaving equity value highly sensitive to rising capital costs, state-level net-metering regulatory changes, interconnection delays, and customer billing friction. Customer service records exhibit recurring billing dispute escalations and account transfer bottlenecks, while liquidation waterfall terms show substantial preferred equity overhang ahead of common equity holders."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "capitalization-and-financing-structure"
    title: "Capitalization, Financing Structure, and Liquidation Overhang"
    body: "Nexamp's capital structure has expanded through continuous rounds of corporate equity, tax equity, and dedicated asset-level credit facilities. Following its pivotal $520 million equity capital raise in April 2024 at an initial unicorn valuation benchmark, private market records from Forge Global document that Nexamp raised an additional $180 million Series 1E2 equity financing round on February 27, 2026, priced at $1,668.68 per share and establishing a $1.49 billion post-money equity valuation. However, the governance and distribution mechanics of this Series 1E2 financing impose a formidable barrier to common equity returns. The round carries senior Liquidation Preference Order 1 with a 1.0x multiplier, non-participating status, and a 13.5% cumulative dividend rate, matching the terms established in its April 2024 Series 1E round which carried a 12.0% cumulative dividend. In parallel, debt facilities continue to layer senior fixed charges onto operating portfolios, including a $106 million 5-year project debt facility closed in June 2026 with First Citizens Bank, Huntington Bank, and Siemens Financial Services across 20 operating projects, as well as an April 2026 conventional debt facility reported by Tracxn. For prospective equity investors, the accumulation of senior cumulative dividends creates a steep valuation hurdle before subordinate equity tranches participate in value realization."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV001"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Analysis, Exit Pathways, and Key Diligence Asks"
    body: "Evaluating Nexamp across macroeconomic and regulatory scenarios illustrates asymmetric return distributions governed by capital costs, policy stability, and subscriber retention. Under the base case scenario, Nexamp sustains high single-digit portfolio capacity expansion toward 2.5 GW by 2028, supported by stable federal clean energy policy and sustained state community solar programs in New York, Illinois, and Massachusetts. In this baseline, an eventual public listing or institutional recapitalization in 2027 to 2028 yields an estimated enterprise value of $2.2B to $2.7B, delivering a 1.4x to 1.7x return multiple to growth-round investors once senior cumulative dividends are deducted. Under the bull case scenario, rapid build-out of utility-scale storage pairings, corporate subscriber adoption, and falling interest rates expand margins and support an IPO valuation of $3.5B to $4.0B. In contrast, the bear case scenario contemplates severe interconnection bottlenecks, state tariff revisions that trim community solar bill credit margins, rising bad debt, and higher debt refinancing rates, compressing equity value below $1.0B and wiping out subordinate tranches beneath preferred liquidation preference claims. Consequently, a conviction buy is unsupportable without primary access to the confidential capitalization table, portfolio-level net cash yields, and audited default data."
    claimRefs:
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
