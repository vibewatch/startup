callouts:
  - calloutType: "recommendation"
    title: "Recommendation Stance: Research-More on Equity Investment"
    body: "Despite Nexamp's undisputed leadership in community solar deployment and demonstrated financing velocity, growth equity investors should withhold capital commitments until full capitalization waterfall schedules and portfolio collections data are provided. The 13.5% cumulative dividend on Series 1E2 equity creates severe downside risk for subordinate and common holders."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV012"
  - calloutType: "risk"
    title: "Liquidation Preference and Dividend Hurdle Overhang"
    body: "Private market disclosures from Forge Global indicate that both the Series 1E ($420M in 2024) and Series 1E2 ($180M in 2026) financing rounds carry senior 1.0x liquidation preferences coupled with 12.0% and 13.5% cumulative dividend rates, generating rapid preferred equity compounding that constrains common equity upside."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV013"
