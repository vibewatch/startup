      - - Manulife Investment Management
        - Lead institutional equity investor in $520M 2024 round
        - Substantial minority equity stake; provides global infrastructure fund backing
        - Request governance rights, board seat representation, and liquidation preference terms
      - - Generate Capital
        - Major institutional shareholder ($240M investment in 2021, participated in 2024)
