company:
  name: Nexamp
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Founded in November 2007, Nexamp is a vertically integrated distributed solar and energy storage platform headquartered in Boston and Chicago. Controlled as a subsidiary of Mitsubishi Corporation through Diamond Generating Corporation since 2018, Nexamp develops, finances, constructs, owns, and operates community solar assets and customer subscription programs. Recent capital formation is anchored by a $520 million capital raise led by Manulife Investment Management in April 2024 and a $300 million aggregation securitization facility with Crédit Agricole CIB in June 2026, alongside Forge Global secondary indications tracking an estimated post-money valuation benchmark of $1.49 billion.
sections:
  - id: corporate-identity-and-footprint
    title: Corporate Identity, Footprint, and Business Model
    body: >-
      Nexamp, Inc. is an established distributed clean energy platform founded in November 2007 by Will Thompson, Dan Leary, and Henri-Claude Bailly. Headquartered jointly in Boston, Massachusetts and Chicago, Illinois, the company operates an integrated community-solar model spanning project origination, site acquisition, engineering and construction, long-term asset ownership, and customer subscriber management. Unlike traditional residential rooftop solar installers or pure-play software aggregators, Nexamp finances and builds off-site solar farms and battery storage facilities, delivering utility-bill credits to residential households, businesses, non-profits, and municipal subscribers across multiple utility territories. In major operating jurisdictions such as New York, subscribers enroll without upfront costs or cancellation fees to receive credits that yield an estimated 10% to 20% annual savings on electricity bills.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: executive-leadership-and-governance
    title: Founders, Executive Leadership, and Governance Architecture
    body: >-
      Nexamp operates under executive leadership led by Chairman and Chief Executive Officer Zaid Ashai, who has directed the company's growth for over a decade. Co-founder Will Thompson serves as Senior Vice President of Nexamp Asset Management Services, providing continuity in project lifecycle operations alongside an executive bench that includes Chief Financial Officer Peter Tawczynski, Chief Development Officer Chris Clark, Chief Strategy Officer John Murphy, Chief Infrastructure Deployment Officer Chris Perron, and General Counsel Kamran Idrees. Governance and corporate control are anchored by Mitsubishi Corporation, which first acquired an ownership interest in 2016 and established Nexamp as a consolidated subsidiary through its Los Angeles-based subsidiary Diamond Generating Corporation in 2018. The institutional shareholder base was further diversified with a $240 million investment by Generate Capital in August 2021 and a $520 million funding round led by Manulife Investment Management in April 2024, alongside Diamond Generating and Generate Capital.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
    tableRefs:
      - TO002
      - TO003
  - id: capital-formation-and-scale
    title: Capital Formation, Asset Scale, and Financing Facilities
    body: >-
      Nexamp has built substantial structured project-financing and corporate capital channels to support its national project pipeline. From managing approximately 40 MW of generation assets at the time of Mitsubishi Corporation's initial 2016 investment, the company expanded its portfolio to over 1.5 GW of operating and in-construction capacity capable of powering more than 300,000 households by early 2024. In April 2024, Nexamp closed a $520 million equity round underwritten by lead investor Manulife Investment Management and existing shareholders. To finance ongoing project development, Nexamp secured a $300 million aggregation securitization facility from Crédit Agricole CIB in June 2026. Secondary private market platforms such as Forge Global track a Series 1E2 share price of $1,668.68 implying a $1.49 billion post-money valuation benchmark as of February 2026. However, public disclosures do not report GAAP audited revenues, ARR, operating margins, or complete subscriber churn rates, representing material diligence gaps. Customer complaint files, such as those maintained by the Better Business Bureau, document dispute resolution obligations and service-inquiry volume across operating jurisdictions.
    claimRefs:
      - CO012
      - CO014
      - CO015
      - CO016
      - CO017
