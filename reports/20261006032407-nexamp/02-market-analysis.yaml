callouts:
  - calloutType: "insight"
    title: "Regulatory Policy as the Primary Boundary Condition"
    body: "Unlike typical software or hardware markets where market size expands through open enterprise procurement, community solar growth is strictly gated by utility distribution capacity and state legislation. Nexamp's expansion rate is directly determined by statutory programs like New York's CDG and Illinois's Adjustable Block Program."
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Interconnection Queues and Subscriber Billing Friction"
    body: "Operational expansion faces structural headwinds from utility grid interconnection dispute backlogs and consumer dissatisfaction regarding bill credit delays. Regulatory complaints and customer reviews indicate that coordinating credit accounting with incumbent utilities remains a critical operational bottleneck."
    claimRefs:
      - "CM014"
      - "CM015"
      - "CM016"
