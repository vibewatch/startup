chapter:
  number: 5
  title: "Product & Technology"
  summary: "Nexamp delivers a vertically integrated community solar and distributed energy platform combining utility-scale distributed generation asset deployment, cloud-hosted industrial supervisory control and data acquisition (SCADA), and an automated subscriber management and billing credit engine. The operating model eliminates upfront consumer capital costs through virtual net metering while managing real-time field telemetry and utility interconnects under stringent grid compliance mandates."
sections:
  - id: "product-service-definition"
    title: "Community Solar Subscription and Customer Workflow Architecture"
    body: "Nexamp operates as a full-lifecycle distributed clean energy platform that structures, builds, owns, and operates community solar and battery energy storage system (BESS) assets while providing an end-to-end subscription service for utility electric consumers. In customer workflow terms, subscribers—including residential households, renters, low-to-moderate-income (LMI) families, and commercial or municipal entities—enroll digitally without upfront costs, long-term lock-in, credit checks, or physical rooftop hardware installations. Once enrolled, the customer is assigned a fractional allocation of a regional distributed solar farm calibrated to their historical electrical consumption profile. As the solar array generates electricity into the local utility distribution grid, virtual net metering (VNM) credits are calculated by the distribution utility and applied directly against the subscriber's monthly electric delivery invoice. Nexamp subsequently bills the customer for these generated credits at a fixed statutory or contractual discount, typically delivering 10% to 15% net savings in core markets like New York and Illinois, and up to 20% for income-qualified households under dedicated community equity initiatives."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-operating-stack"
    title: "Software Stack, Operational Technology, and SCADA Fleet Management"
    body: "The core technology architecture supporting Nexamp's distributed footprint combines modern cloud-native consumer software, financial engineering tools, and industrial operational technology (OT). Nexamp's software development stack is anchored in a React and TypeScript frontend, modern Python web services utilizing Django and FastAPI, SQL relational databases, and automated infrastructure provisioned via Terraform on Microsoft Azure. This customer-facing and back-office software manages subscriber acquisition, utility account linking, automated credit reconciliation, and financial modeling tools required to deploy capital across distributed portfolios. At the physical layer, Nexamp maintains continuous 24/7 monitoring and control across its operating fleet via an Operational Technology Network Operations Center (NOC). The OT monitoring architecture relies on industrial supervisory control and data acquisition (SCADA) platforms—specifically AVEVA System Platform and Inductive Automation's Ignition—hosted within secure Microsoft Azure virtual environments and integrated with on-site Remote Terminal Units (RTUs), Real-Time Automation Controllers (RTACs), managed industrial network switches, and telemetry field sensors across solar arrays and BESS installations."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-reliability-and-compliance"
    title: "Lifecycle Engineering, Grid Interconnection, and Operational Reliability Controls"
    body: "Deploying and sustaining distributed community solar infrastructure requires extensive cross-functional lifecycle engineering, spanning civil permitting, environmental impact assessment, electrical design, and utility grid interconnection. Nexamp's project engineering teams utilize computer-aided design (CAD) systems like AutoCAD and energy yield simulation platforms such as PVsyst to model system performance and value engineering tradeoffs. Physical assets are designed and constructed in strict compliance with the National Electrical Code (NEC), International Building Code (IBC), and International Fire Code (IFC), with environmental reviews governing ground topography, stormwater management, and decommissioning commitments. On the operational reliability and cybersecurity front, Nexamp's distributed SCADA networks enforce compliance with North American Electric Reliability Corporation Critical Infrastructure Protection (NERC CIP) standards, implementing virtual private networks (VPNs), firewalls, virtual local area networks (VLANs), and systematic security patching. Key operational bottlenecks center around utility interconnection delays, transmission queue studies, and utility billing synchronization, where delayed credit application by local distribution companies directly strains subscriber trust and working capital efficiency."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
callouts:
  - calloutType: "insight"
    title: "Dual Architecture Synergies in Distributed Solar"
    body: "Nexamp's competitive posture relies on bridging two traditionally siloed technology stacks: industrial-grade SCADA telemetry (AVEVA/Ignition) for real-time electrical grid compliance and asset uptime, paired with cloud-native consumer billing engines (React/Django/Azure) that automate micro-credit distribution across tens of thousands of utility accounts."
    claimRefs:
      - "CE005"
      - "CE007"
  - calloutType: "risk"
    title: "External Dependency on Utility Credit Processing"
    body: "Despite high software automation internally, Nexamp's end-to-end product delivery is tethered to distribution utilities' legacy billing systems. Delays of 2 to 3 billing cycles in credit appearance generate friction and support ticket overhead that software optimization alone cannot bypass."
    claimRefs:
      - "CE004"
      - "CE012"
