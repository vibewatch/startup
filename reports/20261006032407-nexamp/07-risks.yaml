callouts:
  - calloutType: "risk"
    title: "Pre-PPA Expenditure Liabilities and Counterparty Hold-Up"
    body: "The federal court dismissal in Nexamp, Inc. v. Consolidated Edison establishes that developers bear unmitigated balance sheet risk when executing site leases before definitive utility contracts are signed. In competitive procurement environments, utilities retain explicit rights to cancel solicitations without reimbursing third-party developer expenditures."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Interconnection Litigation as a Project Development Bottleneck"
    body: "Formal complaints before state public utility commissions demonstrate that grid interconnection queues remain the single largest operational friction point for community solar portfolio buildout. Delays from utility grid operators directly extend capital payback periods and threaten project delivery timelines."
    claimRefs:
      - "CR003"
      - "CR015"
