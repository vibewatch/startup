      - number: '3.3'
        title: Distribution, Switching, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Nexamp says it operates community-solar farms in seven named states and was considering expansion into New
              Mexico, Virginia, and Hawaii when its low-to-moderate-income article was updated in March 2026. The same
              company-issued source describes partnerships with community organizations and a 15-year ComEd program that
              provides free credits to eligible households. These disclosures suggest that utility-territory access,
              project availability, community partnerships, and enrollment execution matter more than software
              exclusivity. However, no-fee cancellation and the absence of long-term consumer contracts reduce
              contractual lock-in. The retained pool contains no independent cohort evidence on churn, multi-homing,
              queue access, subscriber acquisition costs, or partner exclusivity, so a durable moat cannot be inferred
              from footprint alone.
            claimRefs:
              - CP010
              - CP014
              - CP015
      - number: '3.4'
        title: Adverse Signals and Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal in this pool is evidence quality, not a verified operating failure. Owler
              places Nexamp at 250-500 employees, while GetLatka reports 568 employees as of September 10, 2026; the
              latter also labels the page a SaaS database and says it publishes no Nexamp alternatives. Owler's funding
              and revenue fields are estimates, not audited disclosures, and RatingFacts produces category-mismatched
              alternatives. These inconsistencies make precise peer-scale comparisons unsuitable for underwriting. A
              buyer or investor should request direct competitor pricing, project and subscriber counts,
              utility-territory overlap, cancellation cohorts, interconnection positions, and regulatory or complaint
              records before assigning Nexamp a distribution, trust, or cost-of-capital advantage.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Low friction is not the same as lock-in
            body: >-
              No long-term contract and no cancellation fee reduce the barrier to enrollment, but the retained pool does
              not show whether subscriber convenience translates into durable retention or merely easier switching.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              The clearest public monetization mechanism is the sale of community-solar bill credits. Nexamp says
              subscribers receive utility credits tied to their allocated share of project generation and then pay
              Nexamp for those credits at a discount. This makes revenue dependent on project production, utility
              crediting, subscriber billing, and collections rather than on a software subscription or a disclosed fixed
              recurring fee. Independent reporting also describes a mix of long-term contracts with investment-grade
              anchor offtakers and residential and small-commercial subscribers. That blend can improve revenue
              durability, but the retained evidence does not disclose revenue mix, contract tenor by cohort,
              concentration, credit losses, or recognized revenue by project. More than 300 operating projects and a
              multi-gigawatt pipeline indicate scale, not profitability, because neither project yields nor portfolio
              cash conversion are public.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI014
              - CI015
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
