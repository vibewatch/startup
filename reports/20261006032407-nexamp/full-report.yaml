      - number: '4.3'
        title: Capital Intensity and Financing Dependence
        blocks:
          - type: paragraph
            body: >-
              Recent financing demonstrates access to institutional capital but does not establish liquidity or runway.
              Hoodline reported roughly $180 million of equity from two investors in 2026, while Mercom India reported a
              separate $200 million delayed-draw credit facility with $125 million initially committed and a $75 million
              option. Tracxn reports $1.45 billion raised across 13 equity and debt rounds. These figures use different
              financing categories and should not be added to infer cash on hand. The latest credit facility was
              described as funding project deployment and customer-base expansion, reinforcing that growth consumes
              capital before projects become operating assets. Public evidence does not disclose undrawn availability,
              interest expense, maturities, collateral, covenant headroom, tax-equity obligations, project-level
              leverage, corporate burn, or the amount of unrestricted cash available to fund the pipeline.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Financial Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              The public record supports a credible transaction model and substantial financing capacity, but not a
              reliable earnings or cash-flow model. IncFact labels its 2025 revenue range of $100 million to $500
              million a statistical evaluation, while RocketReach presents a $135.6 million 2026 annual-revenue
              estimate; neither source supplies audited statements or project-level reconciliation. These estimates are
              directional scale proxies, not ARR and not a basis for margin valuation. A March 2026 Trustpilot reviewer
              also reported an unresolved billing problem lasting almost two years. One review cannot establish
              incidence, but it identifies a collections and customer-service diligence risk that should be tested.
              Investment underwriting therefore requires audited financials, cohort retention and collections, project
              cash yields, debt schedules, and a cash-to-completion plan before drawing a view on revenue quality,
              margin path, or capital adequacy.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Community Solar Subscription and Customer Workflow Architecture
        blocks:
          - type: paragraph
            body: >-
              Nexamp operates as a full-lifecycle distributed clean energy platform that structures, builds, owns, and
              operates community solar and battery energy storage system (BESS) assets while providing an end-to-end
              subscription service for utility electric consumers. In customer workflow terms, subscribers—including
              residential households, renters, low-to-moderate-income (LMI) families, and commercial or municipal
              entities—enroll digitally without upfront costs, long-term lock-in, credit checks, or physical rooftop
              hardware installations. Once enrolled, the customer is assigned a fractional allocation of a regional
              distributed solar farm calibrated to their historical electrical consumption profile. As the solar array
              generates electricity into the local utility distribution grid, virtual net metering (VNM) credits are
              calculated by the distribution utility and applied directly against the subscriber's monthly electric
              delivery invoice. Nexamp subsequently bills the customer for these generated credits at a fixed statutory
              or contractual discount, typically delivering 10% to 15% net savings in core markets like New York and
              Illinois, and up to 20% for income-qualified households under dedicated community equity initiatives.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE012
      - number: '5.2'
        title: Software Stack, Operational Technology, and SCADA Fleet Management
        blocks:
          - type: paragraph
            body: >-
              The core technology architecture supporting Nexamp's distributed footprint combines modern cloud-native
              consumer software, financial engineering tools, and industrial operational technology (OT). Nexamp's
              software development stack is anchored in a React and TypeScript frontend, modern Python web services
              utilizing Django and FastAPI, SQL relational databases, and automated infrastructure provisioned via
              Terraform on Microsoft Azure. This customer-facing and back-office software manages subscriber
              acquisition, utility account linking, automated credit reconciliation, and financial modeling tools
              required to deploy capital across distributed portfolios. At the physical layer, Nexamp maintains
              continuous 24/7 monitoring and control across its operating fleet via an Operational Technology Network
              Operations Center (NOC). The OT monitoring architecture relies on industrial supervisory control and data
              acquisition (SCADA) platforms—specifically AVEVA System Platform and Inductive Automation's
              Ignition—hosted within secure Microsoft Azure virtual environments and integrated with on-site Remote
              Terminal Units (RTUs), Real-Time Automation Controllers (RTACs), managed industrial network switches, and
              telemetry field sensors across solar arrays and BESS installations.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
      - number: '5.3'
        title: Lifecycle Engineering, Grid Interconnection, and Operational Reliability Controls
        blocks:
          - type: paragraph
            body: >-
              Deploying and sustaining distributed community solar infrastructure requires extensive cross-functional
              lifecycle engineering, spanning civil permitting, environmental impact assessment, electrical design, and
              utility grid interconnection. Nexamp's project engineering teams utilize computer-aided design (CAD)
              systems like AutoCAD and energy yield simulation platforms such as PVsyst to model system performance and
              value engineering tradeoffs. Physical assets are designed and constructed in strict compliance with the
              National Electrical Code (NEC), International Building Code (IBC), and International Fire Code (IFC), with
              environmental reviews governing ground topography, stormwater management, and decommissioning commitments.
              On the operational reliability and cybersecurity front, Nexamp's distributed SCADA networks enforce
              compliance with North American Electric Reliability Corporation Critical Infrastructure Protection (NERC
              CIP) standards, implementing virtual private networks (VPNs), firewalls, virtual local area networks
              (VLANs), and systematic security patching. Key operational bottlenecks center around utility
              interconnection delays, transmission queue studies, and utility billing synchronization, where delayed
              credit application by local distribution companies directly strains subscriber trust and working capital
              efficiency.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Architecture Synergies in Distributed Solar
            body: >-
              Nexamp's competitive posture relies on bridging two traditionally siloed technology stacks:
              industrial-grade SCADA telemetry (AVEVA/Ignition) for real-time electrical grid compliance and asset
              uptime, paired with cloud-native consumer billing engines (React/Django/Azure) that automate micro-credit
              distribution across tens of thousands of utility accounts.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
          - type: callout
            title: External Dependency on Utility Credit Processing
            body: >-
              Despite high software automation internally, Nexamp's end-to-end product delivery is tethered to
              distribution utilities' legacy billing systems. Delays of 2 to 3 billing cycles in credit appearance
              generate friction and support ticket overhead that software optimization alone cannot bypass.
            calloutType: risk
            claimRefs:
              - CE004
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Market Structure
        blocks:
          - type: paragraph
            body: >-
              Nexamp segments its clean energy customer base across residential homeowners, renters,
              low-to-moderate-income (LMI) households, commercial businesses, and municipal or non-profit entities. For
              residential subscribers, the primary value proposition centers on virtual net metering bill credits that
              deliver 10% to 15% annual electricity cost savings without rooftop panel installation, upfront capital
              expense, or long-term contractual lock-in. LMI households qualify for enhanced discounts of up to 20% in
              key regulated markets, supported by streamlined enrollment partnerships with local social service
              agencies. By eliminating FICO credit checks and cancellation penalties, Nexamp addresses a broad
              addressable market of power consumers previously excluded from distributed generation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU009
              - CU012
      - number: '6.2'
        title: Adoption Trajectory and Geographic Distribution
        blocks:
          - type: paragraph
            body: >-
              Nexamp has scaled its subscriber footprint across seven core operating states—Massachusetts, New York,
              Maryland, Illinois, New Jersey, Minnesota, and Maine—while actively pursuing development pipelines in New
              Mexico, Virginia, and Hawaii. In New York, projects span six major investor-owned utility territories
              including National Grid, Central Hudson, Orange & Rockland, NYSEG, RGE, and ConEd. In Illinois, solar
              assets operate under the Adjustable Block Program and Illinois Shines frameworks across ComEd and Ameren
              grids, with projects like Minonk achieving commercial energization for 650 subscribers in June 2026.
              Furthermore, Nexamp secured $350 million in long-term project financing in late 2025 to co-locate
              behind-the-meter battery energy storage systems, positioning the company to serve energy-intensive
              commercial and data center customers facing grid queue delays.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU004
              - CU011
              - CU014
      - number: '6.3'
        title: Named Deployments and Institutional Partnerships
        blocks:
          - type: paragraph
            body: >-
              Customer adoption is anchored by institutional and municipal partnerships that validate execution
              capability across diverse subscriber cohorts. In Illinois, Nexamp joined forces with Commonwealth Edison
              to launch Give-A-Ray, a dedicated 15-year community solar program sited on a repurposed landfill in
              Rockford that delivers free solar credits to low-income households, offsetting up to 75% of average energy
              usage. On the organizational side, non-profit entities such as Marcfirst have documented thousands of
              dollars in annual operating savings through participation in Nexamp solar arrays. These named deployments
              demonstrate Nexamp's ability to combine commercial project off-take with community-driven distributed
              generation across regulated utility jurisdictions.
            claimRefs:
              - CU007
              - CU009
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.4'
        title: Subscriber Durability, Billing Friction, and Churn Risk
        blocks:
          - type: paragraph
            body: >-
              While Nexamp maintains an overall consumer rating of 4.4 out of 5 stars across 693 Trustpilot submissions,
              independent review analysis surfaces meaningful operational friction that threatens customer durability. A
              prominent subset of subscribers reports severe billing reconciliation disputes lasting up to two years,
              multi-month lags in receiving utility bill credits, and customer service difficulties. Additionally,
              subscribers face account portability friction: when customers move residences, accounts cannot simply be
              transferred, requiring reapplication from scratch. Although Nexamp employs a dedicated customer experience
              management organization to oversee operational continuity, ongoing utility-level billing delays and
              consumer dispute filings recorded by the Better Business Bureau present persistent retention and customer
              acquisition cost risks.
            claimRefs:
              - CU011
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frictionless Consumer Enrollment Model
            body: >-
              Nexamp's zero-barrier enrollment proposition—eliminating credit checks, upfront equipment fees, and
              long-term contract lock-ins—has enabled rapid customer acquisition across residential and LMI cohorts.
            calloutType: strength
            claimRefs:
              - CU002
              - CU004
          - type: callout
            title: Utility Billing Integration and Churn Exposure
            body: >-
              Third-party consumer feedback reveals persistent billing reconciliation disputes and multi-month delays in
              crediting, creating customer service strain and elevating voluntary cancellation risk if net-metering
              administrative friction persists.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Nexamp's distributed generation business model is structurally exposed to utility interconnect friction,
              state program rule transitions, and off-taker contract enforceability. In New York, judicial dismissal
              with prejudice of Nexamp's contract and promissory estoppel claims against Consolidated Edison and Orange
              and Rockland Utilities highlights substantial pre-development balance-sheet risk [CR001]. In that dispute,
              Nexamp committed a non-refundable $600,000 land lease payment following an RFP award notification before
              definitive contracts were executed, which the federal court deemed an unrecoverable business risk under
              utility RFP reservation clauses [CR002]. In Illinois, development velocity faces utility delays, leading
              Nexamp and project affiliates to file verified formal interconnection complaints before the Illinois
              Commerce Commission against Ameren Illinois regarding public utility code statutory compliance [CR003].
              Furthermore, state-level community solar incentive structures under New York programs and Illinois Shines
              (established via FEJA and CEJA) govern virtual net metering credits and discount economics, making
              regional policy adjustments or tariff disputes directly impact developer returns [CR004] [CR005].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR009
              - CR014
      - number: '7.2'
        title: Operational, Quality, and Execution Risk Analysis
        blocks:
          - type: paragraph
            body: >-
              Operationally, Nexamp manages customer acquisition, long-term asset maintenance, and billing
              synchronization across multi-utility territories including ComEd, Ameren, ConEd, and National Grid.
              Although customer service scores on Trustpilot indicate broad consumer satisfaction with an aggregate
              rating of 4.4 out of 5 across 693 verified and unverified reviews [CR006], customer complaints reveal
              multi-year billing synchronization issues and onboarding lags [CR007]. Specific subscribers report waiting
              up to two years between program enrollment and first bill receipt, as well as delays receiving solar
              discount credits on utility statements [CR008]. Operational dependencies also extend to local permitting
              authorities, conservation commissions, and fire departments for co-located battery energy storage systems,
              creating site-level development bottlenecks [CR009]. Better Business Bureau records reflect recurring
              consumer inquiry categories surrounding billing credit clarity, though overall complaint volumes remain
              bounded relative to total customer base scale [CR010].
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Partner Dependency and Financial Model Risk
        blocks:
          - type: paragraph
            body: >-
              Nexamp operates under high counterparty concentration with investor-owned utilities that act as
              gatekeepers for grid interconnection, credit distribution, and tariff administration. Because community
              solar customers pay Nexamp for utility bill credits at fixed discounts of 10% in New York or 15% in
              Illinois, Nexamp's cash collection mechanism depends directly on timely utility credit calculation and
              transparent billing integration [CR011] [CR012]. Program participation in specialized
              low-to-moderate-income initiatives such as Give-A-Ray in Rockford, Illinois introduces compliance
              obligations across 15-year terms alongside municipal and affordable housing partners [CR013]. Cancelled
              solicitations or altered utility grid relief requirements create asset write-downs when preliminary lease
              and engineering expenditures cannot be recovered [CR014]. Capital intensity across multi-state development
              pipelines necessitates continuous project financing access, making unresolved interconnection queue
              disputes in key regions like Illinois a material headwind to revenue conversion [CR015].
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-PPA Expenditure Liabilities and Counterparty Hold-Up
            body: >-
              The federal court dismissal in Nexamp, Inc. v. Consolidated Edison establishes that developers bear
              unmitigated balance sheet risk when executing site leases before definitive utility contracts are signed.
              In competitive procurement environments, utilities retain explicit rights to cancel solicitations without
              reimbursing third-party developer expenditures.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Interconnection Litigation as a Project Development Bottleneck
            body: >-
              Formal complaints before state public utility commissions demonstrate that grid interconnection queues
              remain the single largest operational friction point for community solar portfolio buildout. Delays from
              utility grid operators directly extend capital payback periods and threaten project delivery timelines.
            calloutType: insight
            claimRefs:
              - CR003
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Nexamp centers on its preeminent operational position in the distributed
              community solar generation sector, operating across more than 20 regional utility markets in 17 states
              with over 1.5 gigawatts of operating and in-construction clean generation assets. By offering consumers
              and commercial off-takers standard 10% to 15% utility bill discounts with zero upfront equipment capital,
              no long-term contractual lock-in, and streamlined onboarding, Nexamp has successfully scaled its
              subscriber base to nearly 80,000 active accounts. Furthermore, the platform's multi-tier capital access is
              validated by Tier-1 infrastructure investors including Generate Capital, Manulife Investment Management,
              and Mitsubishi's Diamond Generating Corporation, alongside major bank lenders like First Citizens Bank.
              Conversely, the structural anti-thesis highlights that Nexamp's aggressive asset ownership model requires
              perpetual debt refinancing and project-level leverage, leaving equity value highly sensitive to rising
              capital costs, state-level net-metering regulatory changes, interconnection delays, and customer billing
              friction. Customer service records exhibit recurring billing dispute escalations and account transfer
              bottlenecks, while liquidation waterfall terms show substantial preferred equity overhang ahead of common
              equity holders.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.2'
        title: Capitalization, Financing Structure, and Liquidation Overhang
        blocks:
          - type: paragraph
            body: >-
              Nexamp's capital structure has expanded through continuous rounds of corporate equity, tax equity, and
              dedicated asset-level credit facilities. Following its pivotal $520 million equity capital raise in April
              2024 at an initial unicorn valuation benchmark, private market records from Forge Global document that
              Nexamp raised an additional $180 million Series 1E2 equity financing round on February 27, 2026, priced at
              $1,668.68 per share and establishing a $1.49 billion post-money equity valuation. However, the governance
              and distribution mechanics of this Series 1E2 financing impose a formidable barrier to common equity
              returns. The round carries senior Liquidation Preference Order 1 with a 1.0x multiplier, non-participating
              status, and a 13.5% cumulative dividend rate, matching the terms established in its April 2024 Series 1E
              round which carried a 12.0% cumulative dividend. In parallel, debt facilities continue to layer senior
              fixed charges onto operating portfolios, including a $106 million 5-year project debt facility closed in
              June 2026 with First Citizens Bank, Huntington Bank, and Siemens Financial Services across 20 operating
              projects, as well as an April 2026 conventional debt facility reported by Tracxn. For prospective equity
              investors, the accumulation of senior cumulative dividends creates a steep valuation hurdle before
              subordinate equity tranches participate in value realization.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV012
      - number: '8.3'
        title: Scenario Analysis, Exit Pathways, and Key Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Nexamp across macroeconomic and regulatory scenarios illustrates asymmetric return
              distributions governed by capital costs, policy stability, and subscriber retention. Under the base case
              scenario, Nexamp sustains high single-digit portfolio capacity expansion toward 2.5 GW by 2028, supported
              by stable federal clean energy policy and sustained state community solar programs in New York, Illinois,
              and Massachusetts. In this baseline, an eventual public listing or institutional recapitalization in 2027
              to 2028 yields an estimated enterprise value of $2.2B to $2.7B, delivering a 1.4x to 1.7x return multiple
              to growth-round investors once senior cumulative dividends are deducted. Under the bull case scenario,
              rapid build-out of utility-scale storage pairings, corporate subscriber adoption, and falling interest
              rates expand margins and support an IPO valuation of $3.5B to $4.0B. In contrast, the bear case scenario
              contemplates severe interconnection bottlenecks, state tariff revisions that trim community solar bill
              credit margins, rising bad debt, and higher debt refinancing rates, compressing equity value below $1.0B
              and wiping out subordinate tranches beneath preferred liquidation preference claims. Consequently, a
              conviction buy is unsupportable without primary access to the confidential capitalization table,
              portfolio-level net cash yields, and audited default data.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More on Equity Investment'
            body: >-
              Despite Nexamp's undisputed leadership in community solar deployment and demonstrated financing velocity,
              growth equity investors should withhold capital commitments until full capitalization waterfall schedules
              and portfolio collections data are provided. The 13.5% cumulative dividend on Series 1E2 equity creates
              severe downside risk for subordinate and common holders.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV012
          - type: callout
            title: Liquidation Preference and Dividend Hurdle Overhang
            body: >-
              Private market disclosures from Forge Global indicate that both the Series 1E ($420M in 2024) and Series
              1E2 ($180M in 2026) financing rounds carry senior 1.0x liquidation preferences coupled with 12.0% and
              13.5% cumulative dividend rates, generating rapid preferred equity compounding that constrains common
              equity upside.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV013
