  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Segment Definition
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Nexamp is bounded by state-level distributed energy resource policy,
              specifically virtual net metering (VNM) and community distributed generation (CDG) enabling legislation.
              Unlike utility-scale merchant generation or behind-the-meter rooftop solar installations, community solar
              platforms deploy mid-scale distributed generation assets (typically 1 to 5 MW per site) connected to local
              distribution utility networks. The revenue architecture relies on two distinct economic mechanisms: the
              monetization of utility bill credits allocated to off-site residential, commercial, and municipal
              subscribers, and long-term land or rooftop leases that secure project siting. Market spend is strictly
              confined to jurisdictions with statutory subscription frameworks—such as New York under NY-Sun/CDG and
              Illinois under the Climate and Equitable Jobs Act (CEJA) and Illinois Shines Adjustable Block Program.
              Excluded spend encompasses residential rooftop equipment sales, customer-financed EPC contracts, and
              large-scale merchant transmission projects that sell commodity wholesale power directly into regional
              transmission organizations without retail credit mechanisms.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Policy Boundaries
        blocks:
          - type: paragraph
            body: >-
              Evaluating the community solar opportunity requires segmented sizing lenses governed by statutory capacity
              caps and utility territory boundaries rather than a single speculative top-down total addressable market
              figure. In key operational states like New York, legislative expansions through the New York Public
              Service Commission authorized $1.4 billion in funding under the NY-Sun initiative, expanding the
              distributed solar deployment target to 10 gigawatts by 2030 in support of the state's 70 percent renewable
              energy mandate. Similarly, in Illinois, the Climate and Equitable Jobs Act established statutory clean
              energy targets of 40 percent renewable generation by 2030 and 50 percent by 2040, propelling the state to
              rank fourth nationally in community solar deployment capacity. At the subscriber level, addressable
              spending is constrained by utility territory customer counts across ComEd, Ameren, National Grid, Central
              Hudson, NYSEG, and ConEd. Private secondary markets reflect ongoing investor underwriting of this
              distributed platform, with platforms such as Clarity and EquityZen tracking institutional pre-IPO share
              transactions and private capital commitments across multi-year asset deployment cycles.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
