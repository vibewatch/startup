      - number: '1.3'
        title: Capital Formation, Asset Scale, and Financing Facilities
        blocks:
          - type: paragraph
            body: >-
              Nexamp has built substantial structured project-financing and corporate capital channels to support its
              national project pipeline. From managing approximately 40 MW of generation assets at the time of
              Mitsubishi Corporation's initial 2016 investment, the company expanded its portfolio to over 1.5 GW of
              operating and in-construction capacity capable of powering more than 300,000 households by early 2024. In
              April 2024, Nexamp closed a $520 million equity round underwritten by lead investor Manulife Investment
              Management and existing shareholders. To finance ongoing project development, Nexamp secured a $300
              million aggregation securitization facility from Crédit Agricole CIB in June 2026. Secondary private
              market platforms such as Forge Global track a Series 1E2 share price of $1,668.68 implying a $1.49 billion
              post-money valuation benchmark as of February 2026. However, public disclosures do not report GAAP audited
              revenues, ARR, operating margins, or complete subscriber churn rates, representing material diligence
              gaps. Customer complaint files, such as those maintained by the Better Business Bureau, document dispute
              resolution obligations and service-inquiry volume across operating jurisdictions.
            claimRefs:
