              - CM008
              - CM009
      - number: '2.3'
        title: Buyer Segmentation and Customer Acquisition Economics
        blocks:
          - type: paragraph
            body: >-
              Nexamp's customer acquisition architecture spans four principal economic segments: residential mass-market
              consumers, low-to-moderate income (LMI) households, commercial property owners and municipalities, and
              rural landowners. For residential and small business subscribers, the value proposition is centered on
              guaranteed utility bill savings—typically delivering a 10 to 15 percent discount on generated bill credits
              with zero upfront capital requirements, no long-term contractual lock-in, and no cancellation penalties or
              credit score checks. Income-eligible households participating in social benefit programs such as LIHEAP or
              SNAP can access enhanced discount tiers up to 20 percent through state programs like Illinois Solar for
              All (ILSFA) and dedicated utility partnerships such as the 15-year Give-A-Ray initiative with ComEd.
              Conversely, commercial landlords and rural property hosts participate as site leaseholders, converting
              underutilized acreage or commercial rooftops into passive long-term lease income streams under
              multi-decade site control agreements managed end-to-end by Nexamp.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity in community solar is propelled by robust macro policy tailwinds, including the federal
              Inflation Reduction Act (IRA), low-income energy burden alleviation initiatives, and state-mandated
              utility decarbonization quotas. Low-income households experience energy burdens up to three times higher
              than high-income counterparts, driving regulatory mandates that reserve dedicated capacity for equity
              programs. However, structural constraints represent material operational friction. Project deployment
              remains heavily dependent on utility interconnection queues, where delays and infrastructure upgrade
              disputes with regional distribution utilities can create significant timeline bottlenecks. Furthermore,
              customer relationship management and subscriber billing present ongoing operational challenges; external
              consumer feedback and dispute logs at the Better Business Bureau (BBB) and Trustpilot reflect recurring
              friction regarding utility billing coordination, account transfer delays during residential relocations,
              and invoice timing transparency.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Policy as the Primary Boundary Condition
            body: >-
              Unlike typical software or hardware markets where market size expands through open enterprise procurement,
              community solar growth is strictly gated by utility distribution capacity and state legislation. Nexamp's
              expansion rate is directly determined by statutory programs like New York's CDG and Illinois's Adjustable
              Block Program.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM006
          - type: callout
            title: Interconnection Queues and Subscriber Billing Friction
            body: >-
              Operational expansion faces structural headwinds from utility grid interconnection dispute backlogs and
              consumer dissatisfaction regarding bill credit delays. Regulatory complaints and customer reviews indicate
              that coordinating credit accounting with incumbent utilities remains a critical operational bottleneck.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Peer Definition
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a layered landscape rather than a single clean peer group. Owler names Nautilus
              Solar Energy, Ecoplexus, and Sunworks as Nexamp's top competitors, which is useful for candidate
              identification but not an independently verified market-share ranking. Craft broadens the set to
              photovoltaic suppliers, nonprofit installers, renewable-service providers, and module-technology vendors,
              showing how generic company databases mix direct developers with adjacent businesses. The practical
              substitute set is wider still: customers can retain default utility supply, eligible homeowners can
              install rooftop solar, and asset owners can procure energy-management software or build operating
              workflows internally. RatingFacts' unrelated consumer alternatives demonstrate why automated comparison
              pages should not be treated as independent competitive benchmarks.
            claimRefs:
