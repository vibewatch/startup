chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Nexamp, Inc. is an established distributed clean energy platform founded in November 2007 by Will
              Thompson, Dan Leary, and Henri-Claude Bailly. Headquartered jointly in Boston, Massachusetts and Chicago,
              Illinois, the company operates an integrated community-solar model spanning project origination, site
              acquisition, engineering and construction, long-term asset ownership, and customer subscriber management.
              Unlike traditional residential rooftop solar installers or pure-play software aggregators, Nexamp finances
              and builds off-site solar farms and battery storage facilities, delivering utility-bill credits to
              residential households, businesses, non-profits, and municipal subscribers across multiple utility
              territories. In major operating jurisdictions such as New York, subscribers enroll without upfront costs
              or cancellation fees to receive credits that yield an estimated 10% to 20% annual savings on electricity
              bills.
