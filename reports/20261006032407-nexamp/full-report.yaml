  - id: FI001
    title: Community-Solar Revenue Model Bridge
    type: flow
    summary: The bridge shows the evidenced billing mechanism and the points where public financial disclosure ends.
    data:
      nodes:
        - id: project-generation
          label: Project generation
          detail: Nexamp-owned or operated projects generate electricity for the utility grid.
        - id: utility-credit
          label: Utility bill credit
          detail: The utility applies credits associated with the subscriber's project share.
        - id: subscriber-allocation
          label: Subscriber allocation
          detail: Residential, small-commercial, or anchor customers receive allocated benefits.
        - id: discounted-payment
          label: Discounted payment to Nexamp
          detail: The subscriber pays Nexamp for credits at an advertised state-specific discount.
        - id: portfolio-revenue
          label: Portfolio revenue
          detail: Revenue mix, recognition, collections, and concentration are not publicly disclosed.
        - id: cash-after-costs
          label: Cash after operating and financing costs
          detail: Gross margin, project yield, debt service, and corporate cash conversion remain private.
      edges:
        - from: project-generation
          to: utility-credit
          label: Generation produces credit value
        - from: utility-credit
          to: subscriber-allocation
          label: Credits allocated through utility billing
        - from: subscriber-allocation
          to: discounted-payment
          label: Subscriber receives savings
        - from: discounted-payment
          to: portfolio-revenue
          label: Payment supports revenue
        - from: portfolio-revenue
          to: cash-after-costs
          label: Private cost and financing bridge
    approximationNotes: >-
      This is a mechanism diagram, not a proportional waterfall; it does not estimate revenue share, gross profit, or
      cash conversion.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI015
  - id: FE001
    title: Nexamp End-to-End Technology Stack
    type: stack
    summary: >-
      Layered architecture mapping Nexamp's technical operational components from consumer-facing digital applications
      down to physical plant telemetry.
    data:
      layers:
        - label: Subscriber Experience & Acquisition Layer
          detail: Customer digital onboarding, utility account verification, and program enrollment portal.
          items:
            - React and TypeScript web portal with dynamic utility zip-code qualification
            - Automated subscriber sign-up workflow with zero credit check validation
            - Targeted LMI verification integrations (LIHEAP and SNAP qualification channels)
        - label: Financial Modeling & Subscription Billing Engine
          detail: Scalable backend microservices managing capital allocation tools and bill credit invoicing.
          items:
            - Python (Django/FastAPI) application services hosted on Microsoft Azure
            - Relational SQL database tracking customer solar shares and monthly credit ledger
            - Automated discount invoicing engine applying 10%–15% statutory credit discounts
        - label: Industrial Operational Technology & Fleet SCADA Layer
          detail: 24/7 Network Operations Center (NOC) managing real-time plant telemetry and control.
          items:
            - Inductive Automation Ignition and AVEVA System Platform SCADA environments
            - Azure cloud-hosted supervisory servers and high-availability operational historians
            - Systematic NERC CIP cyber compliance, VPN tunnels, and firewall access controls
        - label: Field Control & Telemetry Network Infrastructure
          detail: Substation RTAC controllers, industrial switches, and remote telemetry units.
          items:
            - Real-Time Automation Controllers (RTACs), inverters, and field switchgear
            - Ruggedized industrial routers and secure telemetry transmission devices
            - Remote telemetry and automated inverter dispatch controllers
        - label: Physical Generation & Co-located Storage Assets
          detail: Solar photovoltaic arrays, battery energy storage systems, and utility interconnects.
          items:
            - Distributed utility-scale solar photovoltaic arrays engineered to NEC and IBC codes
            - Co-located battery energy storage systems (BESS) compliant with IFC standards
            - Utility point of common coupling (PCC) integrating with regional grid distribution
        - label: Environmental & Decommissioning Lifecycle Controls
          detail: Permitting, stormwater management, land stewardship, and panel recycling protocols.
          items:
            - Pre-construction site suitability analysis and local zoning compliance
            - Comprehensive panel recycling commitments for decommissioned PV modules
            - Sustainable land use protocols minimizing environmental disturbance
    approximationNotes: Stack layers abstract Nexamp's proprietary software configurations and third-party industrial supervisory tools.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end subscriber journey from digital qualification and farm allocation to billing credit flow and ongoing
      retention.
    data:
      items:
        - label: Discovery & Qualification
          touchpoints:
            - Digital landing pages and utility zip code lookup
            - No-credit-check automated qualification
          detail: >-
            Prospective subscribers enter their zip code to verify eligibility within an operating utility territory
            without upfront fees or credit checks.
        - label: Enrollment & Farm Allocation
          touchpoints:
            - Utility account authorization
            - Solar share sizing based on historical kWh usage
          detail: >-
            Subscribers submit basic utility account details and are assigned to a local solar farm pipeline matching
            their electrical consumption.
        - label: Interconnection & Commissioning Wait
          touchpoints:
            - Email status updates on farm construction
            - Multi-month utility interconnection queue
          detail: >-
            Customers wait for solar farm energization and utility approval, which can extend over multiple billing
            cycles before initial credit issuance.
        - label: Credit Flow & Bill Processing
          touchpoints:
            - Utility bill crediting (10-15% discount)
            - Nexamp monthly invoice for discounted credits
          detail: >-
            Utility applies virtual net metering credits to subscriber power bills, and Nexamp bills the customer
            separately at the contracted discount.
        - label: Customer Service & Dispute Resolution
          touchpoints:
            - Support portal and phone inquiries
            - Annual true-up and credit reconciliation
          detail: >-
            Ongoing subscriber support addressing solar credit seasonality, net-metering lag, and resolving billing
            discrepancies across utility cycles.
        - label: Retention & Relocation
          touchpoints:
            - Zero-penalty cancellation option
            - Relocation account reapplication
          detail: >-
            Customers maintain flexible month-to-month participation, with churn risks emerging primarily during
            residential moves or persistent billing friction.
    approximationNotes: >-
      Journey stages and operational touchpoints modeled from subscriber terms of service, utility interconnection
      workflows, and verified customer complaints.
    claimRefs:
      - CU002
      - CU004
      - CU011
      - CU014
