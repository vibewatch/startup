          escalations.
      - - Base Case
        - 55%
        - >-
          Steady capacity additions reaching 2.5 GW; 10-15% bill savings model maintained across core states; debt
          facilities roll over at 6.0-7.0%.
        - >-
          $2.2B-$2.7B enterprise value; 1.4x-1.7x MOIC, partially suppressed by 13.5% cumulative preferred dividend
          accumulation.
        - >-
          Utility tariff margin compression in NY/IL; subscriber acquisition costs rising faster than solar asset
          revenues.
      - - Bear Case
        - 20%
        - >-
          Severe interconnection delays; customer billing disputes rise; net metering formulas revised downward;
          refinancing costs spike.
        - <$1.0B enterprise value; complete impairment of common equity tranches beneath $1.49B liquidation stack.
        - >-
          Regulatory caps on community solar bill credits; customer churn spikes above 15% annually; bank debt covenant
          breaches.
    notes: >-
      Scenario returns model the dilutive impact of 13.5% cumulative dividend accruals across Series 1E2 and 1E
      preferred tranches.
    claimRefs:
      - CV005
      - CV006
      - CV013
      - CV014
      - CV015
