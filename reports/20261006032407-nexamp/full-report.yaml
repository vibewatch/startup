      - number: '3.2'
        title: Capability and Pricing Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Nexamp's own state pages establish its clearest customer-facing differentiation, but they do not establish
              superior peer performance. In New York, the company advertises 10% annual electricity-cost savings, no
              signup fee, no long-term contract, and no cancellation fee. In Illinois, it advertises a standard 15%
              discount on bill credits and up to 20% for eligible income-qualified households. The same pages frame
              rooftop solar as the higher-upfront-cost option with higher long-term savings, owner maintenance,
              homeowner and roof requirements, and access to tax incentives. That makes community solar more accessible
              but not unambiguously more valuable. Direct-peer pricing, service levels, cancellation terms, and
              regulatory controls are absent from the retained sources and therefore remain unknown in the comparison.
            claimRefs:
