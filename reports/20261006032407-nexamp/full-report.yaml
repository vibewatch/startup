              - CI015
      - number: '4.2'
        title: Pricing and Distribution Economics
        blocks:
          - type: paragraph
            body: >-
              Advertised pricing is a discount to utility bill-credit value, not a disclosed price per kilowatt-hour or
              realized corporate take rate. Nexamp advertises 10% savings in New York and 15% in Illinois, with
              income-eligible discounts reaching 20% in both markets. The company also advertises no upfront cost, no
              long-term contract, no credit check, and no cancellation fee. Those terms reduce enrollment friction but
              also limit contractual lock-in, so retention and replacement economics matter. Nexamp says it works with
              community organizations and affordable-housing providers, covers outreach expenses, and offers referral
              payments; however, no retained source quantifies those payments, acquisition cost, sales cycle, payback,
              or channel productivity. List discounts therefore establish customer value propositions, not realized net
              revenue or sales efficiency.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
