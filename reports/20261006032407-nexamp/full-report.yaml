      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Nexamp operates under executive leadership led by Chairman and Chief Executive Officer Zaid Ashai, who has
              directed the company's growth for over a decade. Co-founder Will Thompson serves as Senior Vice President
              of Nexamp Asset Management Services, providing continuity in project lifecycle operations alongside an
              executive bench that includes Chief Financial Officer Peter Tawczynski, Chief Development Officer Chris
              Clark, Chief Strategy Officer John Murphy, Chief Infrastructure Deployment Officer Chris Perron, and
              General Counsel Kamran Idrees. Governance and corporate control are anchored by Mitsubishi Corporation,
              which first acquired an ownership interest in 2016 and established Nexamp as a consolidated subsidiary
              through its Los Angeles-based subsidiary Diamond Generating Corporation in 2018. The institutional
              shareholder base was further diversified with a $240 million investment by Generate Capital in August 2021
              and a $520 million funding round led by Manulife Investment Management in April 2024, alongside Diamond
              Generating and Generate Capital.
