companyProfile:
  summary: >-
    Nexamp is a vertically integrated community-solar and distributed clean-energy platform that develops, finances,
    constructs, owns, and operates off-site solar and storage assets. The company sells utility-bill credits to
    residential, commercial, nonprofit, and municipal subscribers across multiple states, combining project ownership
    with customer subscription management and long-term asset operations. Majority ownership sits with Mitsubishi
    Corporation through Diamond Generating Corporation, alongside institutional capital from Manulife Investment
    Management, Generate Capital, and other infrastructure investors.
