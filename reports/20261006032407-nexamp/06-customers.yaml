    title: "Customer journey map"
    type: "journey-map"
    summary: "End-to-end subscriber journey from digital qualification and farm allocation to billing credit flow and ongoing retention."
    data:
      items:
        - label: "Discovery & Qualification"
          touchpoints:
            - "Digital landing pages and utility zip code lookup"
            - "No-credit-check automated qualification"
          detail: "Prospective subscribers enter their zip code to verify eligibility within an operating utility territory without upfront fees or credit checks."
        - label: "Enrollment & Farm Allocation"
          touchpoints:
            - "Utility account authorization"
            - "Solar share sizing based on historical kWh usage"
          detail: "Subscribers submit basic utility account details and are assigned to a local solar farm pipeline matching their electrical consumption."
        - label: "Interconnection & Commissioning Wait"
          touchpoints:
            - "Email status updates on farm construction"
            - "Multi-month utility interconnection queue"
          detail: "Customers wait for solar farm energization and utility approval, which can extend over multiple billing cycles before initial credit issuance."
        - label: "Credit Flow & Bill Processing"
          touchpoints:
            - "Utility bill crediting (10-15% discount)"
            - "Nexamp monthly invoice for discounted credits"
          detail: "Utility applies virtual net metering credits to subscriber power bills, and Nexamp bills the customer separately at the contracted discount."
        - label: "Customer Service & Dispute Resolution"
          touchpoints:
            - "Support portal and phone inquiries"
            - "Annual true-up and credit reconciliation"
          detail: "Ongoing subscriber support addressing solar credit seasonality, net-metering lag, and resolving billing discrepancies across utility cycles."
        - label: "Retention & Relocation"
          touchpoints:
            - "Zero-penalty cancellation option"
            - "Relocation account reapplication"
          detail: "Customers maintain flexible month-to-month participation, with churn risks emerging primarily during residential moves or persistent billing friction."
