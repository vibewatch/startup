chapter:
  number: 6
  title: "Customers"
  summary: "Nexamp operates an expansive community solar subscriber platform across seven states, delivering guaranteed 10% to 15% utility bill discounts to residential, commercial, and low-income customers without rooftop equipment. While enrollment friction is minimized through no-fee, no-credit-check contracts, independent reviews indicate that operational vulnerabilities persist around utility credit delays, two-year billing disputes, and lack of account transferability."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Base Segmentation and Market Structure"
    body: "Nexamp segments its clean energy customer base across residential homeowners, renters, low-to-moderate-income (LMI) households, commercial businesses, and municipal or non-profit entities. For residential subscribers, the primary value proposition centers on virtual net metering bill credits that deliver 10% to 15% annual electricity cost savings without rooftop panel installation, upfront capital expense, or long-term contractual lock-in. LMI households qualify for enhanced discounts of up to 20% in key regulated markets, supported by streamlined enrollment partnerships with local social service agencies. By eliminating FICO credit checks and cancellation penalties, Nexamp addresses a broad addressable market of power consumers previously excluded from distributed generation."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-geographic-reach"
    title: "Adoption Trajectory and Geographic Distribution"
    body: "Nexamp has scaled its subscriber footprint across seven core operating states—Massachusetts, New York, Maryland, Illinois, New Jersey, Minnesota, and Maine—while actively pursuing development pipelines in New Mexico, Virginia, and Hawaii. In New York, projects span six major investor-owned utility territories including National Grid, Central Hudson, Orange & Rockland, NYSEG, RGE, and ConEd. In Illinois, solar assets operate under the Adjustable Block Program and Illinois Shines frameworks across ComEd and Ameren grids, with projects like Minonk achieving commercial energization for 650 subscribers in June 2026. Furthermore, Nexamp secured $350 million in long-term project financing in late 2025 to co-locate behind-the-meter battery energy storage systems, positioning the company to serve energy-intensive commercial and data center customers facing grid queue delays."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-customer-proof"
    title: "Named Deployments and Institutional Partnerships"
    body: "Customer adoption is anchored by institutional and municipal partnerships that validate execution capability across diverse subscriber cohorts. In Illinois, Nexamp joined forces with Commonwealth Edison to launch Give-A-Ray, a dedicated 15-year community solar program sited on a repurposed landfill in Rockford that delivers free solar credits to low-income households, offsetting up to 75% of average energy usage. On the organizational side, non-profit entities such as Marcfirst have documented thousands of dollars in annual operating savings through participation in Nexamp solar arrays. These named deployments demonstrate Nexamp's ability to combine commercial project off-take with community-driven distributed generation across regulated utility jurisdictions."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-durability-and-operational-friction"
    title: "Subscriber Durability, Billing Friction, and Churn Risk"
    body: "While Nexamp maintains an overall consumer rating of 4.4 out of 5 stars across 693 Trustpilot submissions, independent review analysis surfaces meaningful operational friction that threatens customer durability. A prominent subset of subscribers reports severe billing reconciliation disputes lasting up to two years, multi-month lags in receiving utility bill credits, and customer service difficulties. Additionally, subscribers face account portability friction: when customers move residences, accounts cannot simply be transferred, requiring reapplication from scratch. Although Nexamp employs a dedicated customer experience management organization to oversee operational continuity, ongoing utility-level billing delays and consumer dispute filings recorded by the Better Business Bureau present persistent retention and customer acquisition cost risks."
    claimRefs:
      - "CU011"
      - "CU013"
      - "CU014"
      - "CU015"
