    claimRefs: [CV001, CV002, CV004, CV005, CV008, CV009, CV010, CV011, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision dimension, Evidence, Current assessment, Decision implication]
    rows:
      - [Recommendation, "Enterprise platform breadth and transaction interest are supported; current financial disclosure is incomplete.", research-more, "Do not underwrite a buy without current economics."]
      - [Confidence, "Calcalist reports revenue doubled but declined slightly in 2023; no audited bridge is provided.", low, "Confidence should rise only with company-level financial evidence."]
      - [Risk rating, "Pricing complexity, implementation burden, crowded competition, and mixed user feedback are documented.", high, "Require retention, services-margin, and displacement diligence."]
      - [Valuation stance, "A $2.5B-plus sale target was reported, but no current denominator or completed transaction is disclosed.", unknown, "Use a price ceiling only after ARR/revenue and capital-structure verification."]
      - [Decision implication, "Platform consolidation may create strategic value, but quote-based TCO and competitive pressure can cap expansion.", conditional, "Track until price, quality of revenue, and downside protections are evidenced."]
    notes: "The recommendation distinguishes reported sale-price targets, licensing estimates, revenue/ARR, and cash economics; unavailable values remain unresolved rather than being inferred."
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV010]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Platform consolidation, "Official material describes a unified risk-based AppSec posture across complex portfolios.", "Independent retention and expansion data showing customers adopt multiple modules."]
      - [Enterprise defensibility, "Official material positions Checkmarx for complex application portfolios, while current G2 reviews show both enterprise workflow benefits and operating friction.", "Independent retention and win/loss evidence showing durable renewal quality versus alternatives."]
      - [Exit-market support, "Calcalist reported a $2.5B-plus target; BankInfoSecurity described active application-security ownership turnover.", "A completed transaction, financing round, or third-party valuation with operating metrics."]
      - [Pricing power, "Assigned pricing evidence shows quote-based enterprise packaging and module expansion.", "Audited gross margin, discounting, renewal uplift, and implementation-cost data."]
      - [Competitive pressure, "BankInfoSecurity cited Snyk, Veracode, Black Duck, and platform vendors; G2 feedback is mixed.", "Win/loss cohorts and independent benchmark evidence showing durable product superiority."]
    notes: "The comparable and competitive observations are directional: issuers, business models, dates, and disclosed metrics differ and should not be treated as a single multiple set."
    claimRefs: [CV001, CV004, CV005, CV006, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk and thesis-break trigger]
    rows:
      - [Bull, "Multi-module enterprise adoption; retention and growth remain strong; AI-assisted remediation lowers service burden.", "A premium strategic or sponsor multiple could be justified, but no numeric range is supportable without current ARR/revenue.", low-to-medium, "Downside if expansion is offset by churn or services-heavy delivery."]
      - [Base, "Checkmarx remains a scaled enterprise AST asset with mature growth and quote-based pricing.", "Value should be anchored to verified revenue/ARR, gross margin, net debt, and comparable transactions rather than the reported target price.", medium, "Downside if margins, retention, or competitive win rates are weaker than represented."]
      - [Bear, "Developer-first and platform competitors compress pricing; implementation and false-positive costs reduce renewal quality.", "A lower multiple or down-round becomes plausible; no precise loss estimate is defensible from the pool.", medium, "Thesis break: material net retention decline, failed sale, or preference/debt overhang."]
      - [Diligence gate, "Audited financials, cap table, retention cohorts, customer concentration, and current transaction terms are obtained.", "Convert research-more into buy/track only after denominator and downside protections are known.", high importance, "Remain research-more if any gate is withheld or only company marketing supports it."]
    notes: "Scenario probabilities are qualitative signals, not statistical forecasts. Numeric valuation ranges are intentionally omitted because current revenue/ARR, margins, capital structure, and transaction terms are not publicly established in the assigned evidence."
    claimRefs: [CV002, CV003, CV005, CV006, CV008, CV010, CV012, CV013, CV014]
