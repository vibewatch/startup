evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      A current audited consolidated revenue and ARR bridge, including services mix, retention, and reconciliation to
      the Checkmarx One platform ARR figure.
    whyItMatters: >-
      Platform ARR and total company revenue are different denominators and drive valuation and quality-of-revenue
      assessment.
    diligencePath: >-
      Request monthly recurring-revenue cohorts, audited financial statements, bookings, churn, expansion, and services
      revenue under confidentiality.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: ownership
    missingEvidence: Current cap table, debt, and completed or abandoned sale-process status after the September 2024 report.
    whyItMatters: The reported 90% ownership and $2.5B target may not describe the current transaction or capitalization.
    diligencePath: >-
      Obtain current capitalization, credit agreements, board materials, and signed transaction disclosures from the
      company or owner.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A complete current executive and board roster with roles, tenure, incentives, and succession coverage.
    whyItMatters: >-
      Founder board involvement and a later CEO transition indicate governance and key-person questions that cannot be
      resolved from named sources alone.
    diligencePath: Request the current organization chart, board minutes, executive employment agreements, and succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: adverse
    severity: material
    topic: workforce
    missingEvidence: Current workforce trend, retention, and the operational effects of the late-2022 reduction.
    whyItMatters: >-
      A historical reduction may affect roadmap delivery, customer support, and operating leverage even if later growth
      claims are accurate.
    diligencePath: >-
      Request quarterly headcount by function, attrition, hiring plan, support SLAs, and roadmap delivery metrics from
      2022 onward.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-uncertainty
    missingEvidence: >-
      A Checkmarx-specific SAM and SOM bridge by module, geography, customer segment, realized contract value and
      competitive capture.
    whyItMatters: Broad industry estimates cannot support a company revenue share or valuation conclusion.
    diligencePath: >-
      Request management's addressable-account model, module-level ARR, pipeline, win-loss, ACV, renewal and expansion
      data.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer
    missingEvidence: Verified payer, budget owner, implementation time and conversion data by Checkmarx customer segment.
    whyItMatters: Category demand does not establish monetization speed or sales efficiency.
    diligencePath: >-
      Obtain cohort-level bookings, implementation duration, module attach and buyer-persona evidence under diligence
      access.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: diligence-gap
    missingEvidence: >-
      Current win-loss records by competitor, segment, and reason, plus realized pricing, discounts, renewal uplift,
      retention, and account concentration.
    whyItMatters: >-
      Public feature breadth and historical rival financing do not establish current pricing power, customer preference,
      or competitive durability.
    diligencePath: >-
      Request a dated CRM win-loss export, cohort retention schedule, anonymized contract distribution, renewal bridge,
      and top-account concentration table from management.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: efficacy
    missingEvidence: >-
      Independent head-to-head precision, recall, false-positive, scan-time, and remediation-outcome testing on
      representative enterprise repositories.
    whyItMatters: >-
      Vendor feature lists and competitor comparisons cannot establish relative detection quality or developer
      productivity.
    diligencePath: >-
      Run a controlled bake-off using the same repositories, policies, languages, and remediation workflow across
      shortlisted platforms.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Current audited revenue and ARR bridge by product, customer segment, geography, and recognized versus deferred
      revenue.
    whyItMatters: >-
      A quote-based enterprise model can produce materially different recurring-revenue quality depending on services
      mix, discounts, renewals, and module attach rates.
    diligencePath: >-
      Request audited financial statements, ARR reconciliation, bookings-to-revenue bridge, deferred-revenue schedule,
      and cohort revenue files under NDA.
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, debt, covenants, monthly burn, runway, and financing or exit assumptions.
    whyItMatters: >-
      Private-equity ownership and the historical workforce reduction make liquidity and financing dependency central to
      downside underwriting.
    diligencePath: >-
      Request the latest balance sheet, cash-flow statement, debt schedule, covenant package, board-approved plan, and
      base/downside liquidity cases.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: CAC, sales-cycle duration, payback, NRR, GRR, churn reasons, win/loss data, and account concentration.
    whyItMatters: Enterprise customer count and product breadth do not establish efficient growth or durable retention.
    diligencePath: >-
      Request segmented cohort tables, pipeline conversion, quota attainment, renewal schedules, churn interviews, and
      top-20 account exposure.
    relatedQuestionRefs:
      - QI004
      - QI007
  - type: stale
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      A current 2026 operating update that reconciles the 2022 workforce action with present headcount, hiring, margin,
      and roadmap investment.
    whyItMatters: >-
      The adverse workforce evidence is historical and cannot alone establish current burn or product-investment
      posture.
    diligencePath: >-
      Request current headcount by function, hiring plan, R&D and support spend, and management commentary on
      post-reduction operating performance.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Current independent penetration-test scope, SOC 2 or ISO control boundaries, tenant-isolation design, data
      residency, and availability metrics for Checkmarx One.
    whyItMatters: >-
      Checkmarx is itself a security control plane, so buyer trust depends on evidence about the platform's own
      operating controls and resilience.
    diligencePath: >-
      Request the current trust-center package, independent test summaries, audit reports, incident register, SLA, and
      data-processing architecture under NDA.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: missing-source
    severity: material
    topic: scan-performance
    missingEvidence: >-
      Reproducible benchmark results for scan latency, false-positive rate, supported languages and file types, and
      authenticated API coverage.
    whyItMatters: Workflow value depends on actionable findings without pipeline bottlenecks or material blind spots.
    diligencePath: >-
      Run a controlled bake-off on representative repositories, APIs, IaC, and containers with predefined precision,
      recall, latency, and remediation criteria.
    relatedQuestionRefs:
      - QE004
      - QE005
      - QE009
  - type: missing-source
