figures:
  - id: FU001
    title: Enterprise customer adoption journey
    type: journey-map
    summary: Public evidence becomes progressively weaker after production integration, with renewal and expansion economics remaining private.
    data:
      nodes:
        - id: enterprise-trigger
          label: Enterprise security trigger
          detail: Regulated or complex organizations seek broad application-security coverage and governance.
        - id: commercial-evaluation
          label: Commercial evaluation
          detail: Custom enterprise pricing and competitor claims make scope, price, and implementation effort key diligence points.
        - id: integration
          label: SCM and CI integration
          detail: Adoption depends on automatic scanning in developer workflows and disciplined finding triage.
        - id: production
          label: Production deployment
          detail: Named accounts show pipeline, portfolio, compliance, and vulnerability-management use cases.
        - id: organizational-expansion
          label: Organizational expansion
          detail: Cebu Air provides a reported example of access expanding from about 10 to more than 100 users.
        - id: renewal-and-economics
          label: Renewal and economics
          detail: Retention, churn, contract duration, expansion ARR, and concentration are not public in the assigned evidence.
    approximationNotes: The journey is qualitative and ordered; it does not imply conversion rates, stage populations, or time-to-stage.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Enterprise proof extends beyond logos
    body: Several named deployments describe CI/CD, application portfolios, compliance workflows, and cross-functional governance, which is stronger evidence than an unexplained logo list.
    claimRefs: [CU004, CU006, CU007, CU008]
  - calloutType: risk
    title: Durability remains unverified
    body: Public sources do not disclose retention, churn, contract duration, expansion economics, or account concentration, so named deployments cannot establish recurring quality.
    claimRefs: [CU015, CU016]
