  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-and-concentration
      missingEvidence: "Current cohort-level gross retention, net retention, churn, renewal rate, contract duration, expansion revenue, and top-account concentration."
      whyItMatters: "Named production deployments do not establish whether customers renew, expand, or create concentrated revenue exposure."
      diligencePath: "Request cohort retention bridges and an anonymized top-20 account schedule by ARR band, vertical, geography, product bundle, and renewal date."
      relatedQuestionRefs: [QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: customer-census
      missingEvidence: "A current customer census separating active production accounts, pilots, former customers, and reference-only logos."
      whyItMatters: "Historical counts and selected references cannot establish the current paying-account denominator."
      diligencePath: "Reconcile CRM accounts to billing records and product telemetry, then sample named references for current production status."
      relatedQuestionRefs: [QU002, QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-economics
      missingEvidence: "Actual pricing, implementation cost, renewal uplift, services mix, and customer acquisition or support burden by segment."
      whyItMatters: "Third-party modeled pricing cannot establish realized customer economics or procurement friction."
      diligencePath: "Review executed order forms, implementation statements of work, discount history, support tickets, and renewal negotiations for representative cohorts."
      relatedQuestionRefs: [QU007, QU008]
