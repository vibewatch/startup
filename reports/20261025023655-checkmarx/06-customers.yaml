company:
  name: Checkmarx
chapter:
  number: 6
  title: Customers
  summary: Checkmarx has credible evidence of enterprise deployments across regulated and operationally complex sectors, including production workflows at Cebu Air, HSBC USA, Humana, and Mastercard. The assigned public evidence does not establish current active-customer count, retention, expansion economics, or account concentration.
sections:
  - id: segments-and-buying-centers
    title: Enterprise segments and buying centers
    body: >-
      The strongest customer evidence points to a sales-led enterprise motion rather than a
      self-serve customer base. Apps Run The World describes deployments across transportation,
      banking, insurance, manufacturing, and payments, while CTech names Dell, Adidas, Ford,
      Visa, Siemens, and Salesforce as clients. The participating functions extend beyond a
      security buyer: the deployment narratives involve application engineering, DevOps,
      vulnerability management, compliance, audit, and executive risk oversight. Cyber Company
      Profiles says an outside report counted more than 1,800 customers in March 2023, but also
      identifies that figure as the latest independent count in its reviewed record. This supports
      broad historical enterprise reach, not a current account census or a measure of paying,
      active, production customers.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: deployment-and-adoption
    title: Deployment depth and adoption signals
    body: >-
      The clearest adoption evidence concerns workflow depth inside named accounts. Cebu Air is
      described as migrating on-premises CxSAST workloads to Checkmarx One, embedding scans in
      CI/CD, expanding AppSec access from about 10 users to more than 100, and reducing
      vulnerability density by about 50 percent. Those outcomes originate in a vendor case study
      summarized by an independent directory and are not audited measures. HSBC USA is described
      as operating security testing across 11 Asia-Pacific and European countries, Humana as
      covering more than 50 applications, and Mastercard as embedding Checkmarx in a program run
      by a global team of more than 60 people. These accounts demonstrate production integration,
      but their different populations and periods prevent a comparable adoption curve.
    claimRefs: [CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and procurement friction
    body: >-
      Public reference volume is substantial but does not resolve durability. FeaturedCustomers
      displays 65 testimonials, 47 case studies, 16 customer videos, and a 4.7/5.0 score based on
      3,835 reference ratings; the page does not disclose the selection method, active-account
      denominator, or renewal cohort. Safeguard argues that rollout success depends on deep SCM
      and CI integration plus disciplined triage, implying that adoption requires continuing
      operating effort. CheckThat.ai describes custom enterprise pricing and estimates a
      $30,000 annual minimum, but its wider cost ranges are modeled estimates rather than vendor
      quotes. Competitors Beagle Security and OX portray cost, onboarding, developer workflow,
      and platform fragmentation as switching pressures. Those claims are adverse signals, not
      independent benchmarks, because the issuers sell competing products.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
    figureRefs: [FU001]
  - id: underwriting-view
    title: Customer underwriting view
    body: >-
      The evidence supports the existence of large, operationally embedded customers and a
      sizeable public reference program. It does not show whether the referenced deployments are
      all current, whether they expanded commercially after implementation, or whether Checkmarx
      retains them at attractive economics. None of the assigned sources reports net revenue
      retention, gross retention, churn, contract duration, top-customer share, partner-sourced
      revenue, or a current independently verified customer count. The customer thesis should
      therefore be treated as proven at the level of named enterprise use cases but unproven at
      the level of recurring durability and concentration. Underwriting requires CRM-to-billing
      reconciliation, product telemetry, cohort renewals, and a top-account schedule rather than
      extrapolation from logos, references, or historical counts.
    claimRefs: [CU015, CU016]
