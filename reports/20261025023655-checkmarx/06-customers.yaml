      - ["HSBC USA", "Banking", "SAST, DAST, manual testing, APIs, and governance workflows across multiple countries", "Production program described", "Quarterly PCI DSS assessment workflow across 11 Asia-Pacific and European countries", "No current use, spend, or measured security outcome"]
      - ["Humana", "Insurance", "SAST and automated security gates in Azure DevOps", "Production program described", "More than 50 applications reported in scope", "Narrative dates to 2020 and lacks renewal evidence"]
      - ["Mastercard", "Payments", "SAST, DAST, SBOM, container scanning, and vulnerability orchestration", "Production program described", "Embedded in a global program run by a 60-plus-person team", "No contract, renewal, or economic data"]
      - ["Dell, Adidas, Ford, Visa, Siemens, Salesforce", "Cross-sector enterprise", "Named as clients in a 2024 news report", "Not established", "Demonstrates reported brand-level customer breadth", "No deployment, outcome, freshness, or retention detail"]
    notes: This is a sample of names visible in the assigned public evidence, not an exhaustive customer list; source-reported outcomes are not independently audited.
