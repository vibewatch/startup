callouts:
  - calloutType: strength
    title: Enterprise scale is visible, but on different denominators
    body: "The strongest current operating evidence is the company-reported $150M-plus Checkmarx One ARR and more than 865 large enterprises protected; these are platform metrics and should not be substituted for audited consolidated revenue or a verified customer count."
    claimRefs: [CO001, CO002]
  - calloutType: risk
    title: Ownership and leadership require current verification
    body: "The public record combines a 2024 report of 90% Hellman & Friedman ownership and a potential $2.5B sale target with a 2023 CEO transition, but does not establish the outcome of the process, the current cap table, or a complete board and executive roster."
    claimRefs: [CO006, CO008, CO009]
  - calloutType: insight
    title: Product breadth is paired with customer-reported compatibility friction
    body: "Official materials emphasize broad platform coverage and AI-assisted development, while a 2026 enterprise review praised CI/CD integration but described an unresolved .mjs scanning limitation; diligence should test coverage and migration friction across representative codebases."
    claimRefs: [CO003, CO004, CO016]
