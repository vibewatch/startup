company:
  name: Checkmarx
chapter:
  number: 1
  title: Company Overview
  summary: Checkmarx is a privately held application-security vendor founded in 2006 and controlled by Hellman & Friedman since 2020. Public evidence supports a broad enterprise platform and material scale, but current company-wide revenue, ownership outcomes, and leadership continuity remain only partially disclosed.
sections:
  - id: identity-and-business-model
    title: Identity, platform, and operating footprint
    body: Checkmarx was founded in 2006 by Emmanuel Benzaquen and Maty Siman and is headquartered in Ramat Gan, according to Calcalist's September 2024 reporting. The company develops application-security technology centered on automated code scanning for vulnerability identification and compliance. Its current flagship, Checkmarx One, is described by the company as an agentic-AI-powered application-security testing platform and by an independent profile as a platform scanning code, open-source dependencies, APIs, and running applications. The independent profile also describes the coverage as SAST, SCA, DAST, IaC, secrets, container, API, and malicious-package scanning under an ASPM risk-orchestration layer; because that profile disclaims human review, this is a corroborating description rather than an audit. Checkmarx's own 2025 release reports more than 865 large enterprises protected and more than $150 million of Checkmarx One ARR in less than three years, while the release does not state audited consolidated company revenue.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: >-
      The founding team remains important to the governance picture, but operating leadership has changed. Calcalist identified Benzaquen as CEO and Siman as CTO at founding and reported in September 2024 that both founders continued to serve on the board. Checkmarx's October 2025 company release states that Sandeep Johri took the CEO role in 2023 and attributes subsequent momentum to that leadership period. The sources do not provide a complete current executive roster, board composition, or formal succession plan. That combination supports a key-person and governance diligence concern: the founders retain board relevance while day-to-day leadership rests with a later CEO, and public evidence does not establish how responsibilities, control, or incentives are allocated.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-ownership-and-scale
    title: Capital, ownership, and scale
    body: >-
      Calcalist reported that Hellman & Friedman acquired Checkmarx in March 2020 for $1.2 billion, primarily from Insight Partners, and later sought at least $2.5 billion in a potential sale process. The same report said Checkmarx had raised $100 million in total, including an $85 million Insight investment in 2015, and that Hellman & Friedman held 90% of the shares while employees and founders held the balance. These are reported transaction and ownership figures, not an audited capitalization table or a completed sale. The report also estimated approximately 900 employees across 70 countries, with about half in Israel, while the 2025 company release provides a different scale lens: more than 865 large enterprises protected and more than 30% ARR growth year-to-date through September 30, 2025. Public evidence therefore supports substantial enterprise scale but leaves consolidated revenue, net retention, cash, debt, and current headcount unverified.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-diligence-gaps
    title: Milestones and unresolved diligence
    body: >-
      The available record shows a progression from founding and venture financing to private-equity ownership, workforce restructuring, platform expansion, and AI-oriented product development. Customer evidence shows Checkmarx One implementations at Cebu Air in 2024, Humana in 2020, Ingersoll Rand in 2020, and Mastercard in 2023, illustrating use across airline, healthcare, industrial, and payments environments. G2 review evidence shows active enterprise use in 2026 alongside a reported compatibility gap for .mjs files; that is customer feedback, not a product-wide defect rate. The company announced Developer Assist general availability in August 2025, and its 2025 release also reported FedRAMP Ready at High Impact Level for Checkmarx One for Government. Remaining gaps are material: a current audited revenue and ARR bridge, current ownership after any sale process, a complete leadership and board roster, customer concentration and retention, and the financial effect of the 2022 workforce reduction.
    claimRefs: [CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
