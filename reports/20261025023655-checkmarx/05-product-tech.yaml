company:
  name: Checkmarx
chapter:
  number: 5
  title: Product & Technology
  summary: Checkmarx One is positioned as a unified, cloud-delivered application-security platform spanning code, dependencies, APIs, runtime testing, infrastructure, containers, and secrets. Public evidence supports broad workflow integration and enterprise deployments, but independent technical validation, current reliability evidence, and product-specific security controls remain incomplete.
sections:
  - id: product-surface
    title: Product surface and user workflow
    body: "Checkmarx One is presented as a single application-security surface rather than a point scanner. The external product descriptions identify SAST for source code, SCA for open-source dependencies and licensing, DAST for running applications, API testing, infrastructure-as-code, container security, and supply-chain controls. The practical user workflow is shift-left: findings are surfaced in IDEs, source-control systems, CI/CD pipelines, and issue trackers, then routed for triage and remediation. A customer-database record describes Cebu Air moving on-premises CxSAST workloads to Checkmarx One, embedding automated scans in CI/CD and expanding access from about 10 to more than 100 AppSec users. That is useful implementation evidence, but it is a vendor-database account rather than an independently audited outcome. The product therefore appears operationally broad, while actual coverage, scan latency, and remediation quality remain deployment-dependent."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-maturity
    title: Architecture, integrations, and maturity
    body: "The platform's architecture is best understood as a layered control plane: scanners collect signals from code, dependencies, APIs, infrastructure, containers, and live applications; a central risk-orchestration layer correlates findings; workflow integrations deliver results to developers and security teams. G2 user evidence supports CI/CD integration and centralized reporting, while also recording practical limitations: one enterprise reviewer reported that .mjs files were not supported at the time of review, and another reported that full scans on large projects could slow pipelines. These observations do not establish a universal defect rate, but they show that language coverage, policy configuration, scan duration, and result consistency are material implementation variables. The public architecture evidence does not disclose service-level objectives, tenant isolation design, data residency options, or independently tested availability."
    claimRefs: [CE005, CE006, CE007, CE008]
    figureRefs: [FE001]
    tableRefs: [TE003]
  - id: differentiation-and-trust
    title: Differentiation, trust, and diligence gaps
    body: "Checkmarx differentiates through breadth, enterprise governance, and the ability to correlate multiple AppSec testing modes in one program. That positioning aligns with CISA's Secure by Design guidance, which treats product security as a core business requirement, and with NIST's SSDF, which recommends integrating secure-development practices into each SDLC. Those frameworks are standards for buyers and producers, not proof that Checkmarx itself satisfies every control. External user evidence is mixed: reviewers praise actionable reporting and pipeline integration, but also mention false-positive noise, setup effort, pricing pressure, and slow or incomplete coverage for some projects. The March 2026 repository compromise described in the assigned company-profile source reportedly did not reach the Checkmarx One service, yet it makes software-distribution controls and incident disclosure a priority diligence item. Current penetration-test scope, incident chronology, vulnerability disclosure metrics, and roadmap support commitments are not publicly established here."
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: []
  - id: product-verdict
    title: Product verdict
    body: "The evidence supports a mature enterprise AppSec operating model with a broad product surface and credible workflow adoption, not a fully verified technical moat. Checkmarx can plausibly reduce tool sprawl for organizations that need SAST, SCA, DAST, API, IaC, container, and governance capabilities in one procurement relationship. The tradeoff is implementation complexity: pricing is quote-based, scan throughput and language coverage require validation in the buyer's estate, and customer-facing evidence does not establish independent reliability or security assurance for the current release. Underwriting should therefore treat breadth and existing enterprise workflow fit as strengths, while making renewal-quality telemetry, control-plane security evidence, and current product performance acceptance tests conditions of conviction."
    claimRefs: [CE013, CE014, CE015]
    tableRefs: []
