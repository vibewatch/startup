  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Developer and source layer", "IDE, SCM, and source-code feedback", "Code languages, file types, and IDE/SCM connectors", "Unsupported file types can force workarounds"]
      - ["Pipeline layer", "Automated checks during build and release", "CI/CD runners and credentials", "Scan duration and configuration can create delivery bottlenecks"]
      - ["Analysis layer", "SAST, SCA, DAST, API, IaC, and container findings", "Parsers, rules, test environments, and dependency intelligence", "False positives, missed paths, and inconsistent results require tuning"]
      - ["Risk-orchestration layer", "Correlate and prioritize findings", "Cross-scanner schemas and policy configuration", "Opaque scoring and policy drift can weaken prioritization"]
      - ["Governance and reporting layer", "Compliance evidence and executive reporting", "Customer data, retention, tenancy, and access controls", "Public evidence does not establish isolation, residency, or audit scope"]
      - ["Support and assurance layer", "Updates, incident response, and remediation support", "Vendor operating processes and disclosure practices", "Current SLA, penetration-test scope, and incident metrics are gaps"]
    notes: This is an evidence-bounded operating model assembled from the assigned product, customer, review, and standards sources; it is not a disclosed Checkmarx reference architecture.
    claimRefs: [CE005, CE006, CE007, CE009, CE010, CE011]
