  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Current independent penetration-test scope, SOC 2 or ISO control boundaries, tenant-isolation design, data residency, and availability metrics for Checkmarx One.
      whyItMatters: Checkmarx is itself a security control plane, so buyer trust depends on evidence about the platform's own operating controls and resilience.
      diligencePath: Request the current trust-center package, independent test summaries, audit reports, incident register, SLA, and data-processing architecture under NDA.
      relatedQuestionRefs: [QE007, QE008]
    - type: missing-source
      severity: material
      topic: scan-performance
      missingEvidence: Reproducible benchmark results for scan latency, false-positive rate, supported languages and file types, and authenticated API coverage.
      whyItMatters: Workflow value depends on actionable findings without pipeline bottlenecks or material blind spots.
      diligencePath: Run a controlled bake-off on representative repositories, APIs, IaC, and containers with predefined precision, recall, latency, and remediation criteria.
      relatedQuestionRefs: [QE004, QE005, QE009]
    - type: missing-source
      severity: minor
      topic: roadmap
      missingEvidence: Current roadmap, release cadence, support staffing, and post-incident product-hardening commitments.
      whyItMatters: A broad platform can lose renewal value if integrations and coverage lag customer development practices.
      diligencePath: Obtain the last four release notes, roadmap review, support SLA metrics, and management's remediation plan for reported repository and file-support issues.
      relatedQuestionRefs: [QE004, QE008]
