callouts:
  - calloutType: strength
    title: Breadth is the product's clearest strength
    body: "The assigned evidence consistently describes a consolidated platform spanning multiple AppSec testing modes and delivery integrations, which can reduce point-tool fragmentation for enterprise programs."
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: Technical assurance remains under-disclosed
    body: "Public sources do not establish current uptime, tenant isolation, data residency, penetration-test scope, or complete incident metrics; these are material diligence conditions for a security platform."
    claimRefs: [CE010, CE011, CE015]
  - calloutType: recommendation
    title: Underwrite with a production acceptance test
    body: "Require a representative repository and API test covering supported file types, scan duration, false-positive handling, authenticated paths, CI/CD throughput, and remediation workflow before treating product breadth as durable differentiation."
    claimRefs: [CE006, CE007, CE008, CE015]
