      - ["AI-native and emerging entrants", "Likely entrants", "No comparable scale metric retained", "Teams seeking automated prioritization or remediation", "Potentially faster iteration around AI-assisted workflows", "Independent accuracy and durability evidence is unavailable"]
    notes: >-
      Scale figures retain their original periods and are not current comparisons. Categories combine
      retained market research, official positioning, and analyst inference; unknown fields are not estimated.
    claimRefs: [CP001, CP003, CP005, CP011, CP012, CP014]
  - id: TP002
    title: Feature and capability comparison
    columns: [Buying criterion, Checkmarx, Developer-first alternatives, Enterprise-suite alternatives, SCM-native or internal option]
    rows:
      - ["Scanning breadth", "SAST, SCA, DAST, API, container, and IaC are documented", "Breadth varies; retained sources cite Snyk and Semgrep as narrower alternatives", "Veracode is described with SAST, DAST, SCA, and API security", "Unknown as a common bundle"]
      - ["Governance and correlation", "Cross-tool correlated results and ASPM are documented", "Unknown on a comparable basis", "Compliance and governance are described for Veracode", "Depends on native platform or internal implementation"]
      - ["Deployment flexibility", "Official page supports SaaS, self-hosted, and air-gapped requirements", "Unknown in assigned evidence", "Unknown in assigned evidence", "Internal build offers control but retains operating burden"]
      - ["Developer distribution", "IDE, CI/CD, SCM, and training integrations are described", "Developer workflow is a stated alternative advantage", "Developer integrations are described, not independently compared", "SCM-native tools begin inside the repository workflow"]
      - ["Independent efficacy proof", "No retained head-to-head benchmark", "No retained head-to-head benchmark", "No retained head-to-head benchmark", "No retained head-to-head benchmark"]
    notes: >-
      Cells summarize documented scope, not verified parity, detection accuracy, or customer outcomes.
      Vendor-authored comparison claims are treated as positioning; unsupported cells remain unknown.
    claimRefs: [CP002, CP005, CP006, CP008, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Offer, Public price evidence, Packaging model, Qualification, Buyer implication]
    rows:
      - [Checkmarx One, "No official rate card; custom quote", "Named packages plus modular add-ons", "Third-party estimates are not realized contract prices", "Requires a scoped quote and total-cost normalization"]
      - [Snyk, "Launch Ready Code cites a free tier and $25+/month entry", "Developer-first tiers", "Not an enterprise quote and not independently validated here", "Lower-friction entry may matter for smaller teams"]
      - [Veracode, "Beagle Security publishes product estimates, including $100,000+ for a full suite", "Module and suite pricing", "Competitor-issued estimate, not a contract", "Comparable scope and services must be normalized"]
      - [Internal / open source, "Software entry cost can be free", "Assembled tools and internal labor", "Excludes integration, maintenance, assurance, and governance cost", "Can undercut license cost while increasing internal burden"]
    notes: >-
      Price observations preserve source units and are not ARR, realized revenue, or total cost. No row
      should be used without validating developer count, modules, deployment, services, discounts, and term.
    claimRefs: [CP004, CP007, CP014, CP016]
figures:
  - id: FP001
    title: Ordinal competitive positioning map
    type: quadrant
    summary: >-
      The evidence places Checkmarx toward integrated enterprise governance, while alternatives trade
      breadth for developer distribution, native control points, or lower software entry cost.
    data:
      points:
        - {label: "Checkmarx One", x: 5, y: 5, note: "Integrated scope and procurement-led enterprise posture"}
        - {label: "Veracode", x: 4, y: 5, note: "Enterprise suite and compliance posture"}
        - {label: "Snyk", x: 3, y: 3, note: "Developer-first posture with broader AppSec modules"}
        - {label: "GitHub / GitLab", x: 2, y: 3, note: "SCM-native distribution; breadth not fully evidenced"}
        - {label: "Semgrep / point tools", x: 2, y: 2, note: "Focused developer-first or specialist scope"}
        - {label: "Internal / open source", x: 1, y: 1, note: "Maximum internal control with assembled coverage"}
      xAxis:
        label: "Integrated application-security breadth"
        min: 1
        max: 5
      yAxis:
        label: "Enterprise governance and procurement intensity"
        min: 1
        max: 5
    approximationNotes: >-
      Coordinates are ordinal analyst scores derived from documented scope, packaging, and target-buyer
      evidence. They are not market share, efficacy, price, or independently measured rankings.
    claimRefs: [CP002, CP006, CP010, CP013, CP015]
