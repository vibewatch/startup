    columns: [Publisher, Period/geography, Value, CAGR, Methodology, Confidence, Limitation]
    rows:
      - [MarketsandMarkets, "2025 / global AST", "USD 1.83B", "26.7% for 2025-2031", "Top-down, bottom-up, primary research and triangulation", medium, "Broad AST boundary"]
      - [MarketsandMarkets, "2031 / global AST", "USD 7.60B", "26.7% for 2025-2031", "Same publisher forecast", medium, "Not a Checkmarx revenue or share estimate"]
      - [Mordor Intelligence, "2026 / global DAST", "USD 4.18B", "15.59% for 2026-2031", "Proprietary model updated with January 2026 inputs", medium, "Narrow DAST boundary including related services"]
      - [Mordor Intelligence, "2031 / global DAST", "USD 8.63B", "15.59% for 2026-2031", "Same publisher forecast", medium, "Not comparable or additive to broad AST estimate"]
    notes: "Every value preserves its publisher, scope, period and currency; the estimates use incompatible boundaries and must not be summed."
    claimRefs: [CM004, CM005, CM006, CM007]
  - id: TM003
    title: Segment, buyer and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - [Large regulated enterprise, "CISO or AppSec leader", "AppSec engineers and developers", "Enterprise security platform budget", "Portfolio-wide testing and governance", "Unverified publicly", "Auditability and application scale"]
      - [Cloud-native product company, "Security or engineering leader", "Developers and platform engineers", "Security plus engineering budget", "CI/CD and API testing", "Unverified publicly", "Frequent releases and expanding API surface"]
      - [Software supplier to regulated buyers, "Security and compliance leadership", "Developers and assessors", "Compliance-enabled technology budget", "Secure-development evidence and supplier review", "Unverified publicly", "Secure-by-design and acquisition requirements"]
      - [Lean or single-need team, "Engineering leader", "Developers", "Engineering budget", "Point scanner or managed service", "Unverified publicly", "Lower setup burden and predictable cost"]
    notes: "Buyer roles and budget paths are analytical inferences from cited enterprise, regulatory and market evidence; Checkmarx cohort conversion and payer data are unavailable."
    claimRefs: [CM002, CM003, CM008, CM009, CM010, CM011, CM012, CM013, CM014]
