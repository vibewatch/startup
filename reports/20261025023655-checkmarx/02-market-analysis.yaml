    approximationNotes: "Authored order conveys boundary narrowing, not proportional magnitude. Values have different scopes and periods, are not additive, and do not calculate Checkmarx TAM, SAM or SOM."
    claimRefs: [CM004, CM005, CM006, CM008, CM009, CM015]
