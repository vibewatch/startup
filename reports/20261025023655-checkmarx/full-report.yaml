              - CI009
      - number: '4.2'
        title: Sales efficiency and cost structure
        blocks:
          - type: paragraph
            body: >-
              The commercial model is likely enterprise-led and service-assisted rather than self-serve. Public customer
              references describe migration from on-premises workloads into CI/CD-integrated Checkmarx One deployments,
              broader user access, compliance evidence, and ongoing governance. Those deployments can create expansion
              opportunities, but they also imply implementation, training, support, and internal AppSec operating costs
              that are not visible in a vendor income statement. A third-party pricing source estimates total cost of
              ownership at 1.5 to 2 times base licensing when professional services, premium support, and internal
              operations are included; this is a planning estimate, not a company disclosure. The commissioned Forrester
              study cited by Checkmarx found $7.13 million of benefits against $2.57 million of costs for a
              representative composite organization over three years, but it is not evidence of Checkmarx gross margin
              or customer-level payback across the installed base. Public data therefore supports a value proposition
              and a cost stack, not CAC, payback, services margin, or sales efficiency.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI008
              - CI010
              - CI014
              - CI015
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
