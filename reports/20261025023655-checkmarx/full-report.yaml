chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Checkmarx was founded in 2006 by Emmanuel Benzaquen and Maty Siman and is headquartered in Ramat Gan,
              according to Calcalist's September 2024 reporting. The company develops application-security technology
              centered on automated code scanning for vulnerability identification and compliance. Its current flagship,
              Checkmarx One, is described by the company as an agentic-AI-powered application-security testing platform
              and by an independent profile as a platform scanning code, open-source dependencies, APIs, and running
              applications. The independent profile also describes the coverage as SAST, SCA, DAST, IaC, secrets,
              container, API, and malicious-package scanning under an ASPM risk-orchestration layer; because that
              profile disclaims human review, this is a corroborating description rather than an audit. Checkmarx's own
              2025 release reports more than 865 large enterprises protected and more than $150 million of Checkmarx One
              ARR in less than three years, while the release does not state audited consolidated company revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The founding team remains important to the governance picture, but operating leadership has changed.
              Calcalist identified Benzaquen as CEO and Siman as CTO at founding and reported in September 2024 that
              both founders continued to serve on the board. Checkmarx's October 2025 company release states that
              Sandeep Johri took the CEO role in 2023 and attributes subsequent momentum to that leadership period. The
              sources do not provide a complete current executive roster, board composition, or formal succession plan.
              That combination supports a key-person and governance diligence concern: the founders retain board
              relevance while day-to-day leadership rests with a later CEO, and public evidence does not establish how
              responsibilities, control, or incentives are allocated.
            claimRefs:
              - CO005
              - CO006
