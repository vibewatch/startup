  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly dated milestones trace Checkmarx from founding and financing through ownership change, restructuring,
      leadership transition, platform growth, and current customer evidence.
    data:
      items:
        - date: '2006'
          label: Company founded
          details: Calcalist reported that Emmanuel Benzaquen and Maty Siman founded Checkmarx.
          tone: neutral
          claimRefs:
            - CO005
        - date: '2015'
          label: Insight investment
          details: Calcalist reported an $85M Insight Partners investment, the largest reported pre-acquisition investment.
          tone: neutral
          claimRefs:
            - CO008
        - date: 2020-03
          label: Hellman & Friedman acquisition
          details: Calcalist reported a $1.2B purchase, primarily from Insight Partners.
          tone: neutral
          claimRefs:
            - CO008
        - date: '2020'
          label: Humana implementation
          details: >-
            Apps Run the World reported Humana implemented Checkmarx One for centralized application-vulnerability
            analysis and SAST.
          tone: positive
          claimRefs:
            - CO013
        - date: '2022'
          label: Workforce reduction
          details: Calcalist reported layoffs of approximately 10% of employees, including about 100 people overall.
          tone: adverse
          claimRefs:
            - CO014
        - date: '2023'
          label: CEO transition
          details: Checkmarx reported Sandeep Johri took the CEO role; Mastercard implementation evidence also dates to 2023.
          tone: neutral
          claimRefs:
            - CO006
            - CO015
        - date: '2024-09-10'
          label: Potential sale reported
          details: Calcalist reported Hellman & Friedman was exploring a sale at a target of at least $2.5B.
          tone: neutral
          claimRefs:
            - CO008
        - date: 2025-08
          label: Developer Assist general availability
          details: Checkmarx reported Developer Assist reached general availability in August 2025.
          tone: positive
          claimRefs:
            - CO016
        - date: '2025-10-09'
          label: Platform scale update
          details: Checkmarx reported more than 865 large enterprises protected and more than $150M Checkmarx One ARR.
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - date: '2026-06-19'
          label: Enterprise user feedback
          details: >-
            A G2 review described centralized source-code security and CI/CD integration while reporting an unresolved
            .mjs compatibility issue.
          tone: adverse
          claimRefs:
            - CO003
            - CO004
    approximationNotes: >-
      Dates and values are reproduced as reported; the timeline does not imply that company claims are independently
      audited or that a reported sale target became a completed transaction.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO005
      - CO006
      - CO008
      - CO013
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: Published market and adoption hierarchy
    type: pyramid
    summary: >-
      Published totals and mix indicators narrow from category context toward Checkmarx's likely enterprise core,
      without asserting a TAM-to-SOM conversion.
    data:
      nodes:
        - id: ast-2025
          label: Global AST, 2025
          value: USD 1.83B
          detail: MarketsandMarkets broad application-security-testing estimate
        - id: ast-2031
          label: Global AST, 2031
          value: USD 7.60B
          detail: MarketsandMarkets forecast; stated 26.7% CAGR
        - id: dast-2026
          label: Global DAST, 2026
          value: USD 4.18B
          detail: Mordor Intelligence narrower runtime-testing estimate
        - id: dast-2031
          label: Global DAST, 2031
          value: USD 8.63B
          detail: Mordor Intelligence forecast; stated 15.59% CAGR
        - id: cloud-mix
          label: Cloud share of DAST, 2025
          value: 73.50%
          detail: Mordor Intelligence deployment mix
        - id: enterprise-mix
          label: Large-enterprise share of DAST, 2025
          value: 59.20%
          detail: Mordor Intelligence organization-size mix
    approximationNotes: >-
      Authored order conveys boundary narrowing, not proportional magnitude. Values have different scopes and periods,
      are not additive, and do not calculate Checkmarx TAM, SAM or SOM.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM008
      - CM009
      - CM015
  - id: FP001
    title: Ordinal competitive positioning map
    type: quadrant
    summary: >-
      The evidence places Checkmarx toward integrated enterprise governance, while alternatives trade breadth for
      developer distribution, native control points, or lower software entry cost.
    data:
      points:
        - label: Checkmarx One
          x: 5
          'y': 5
          note: Integrated scope and procurement-led enterprise posture
        - label: Veracode
          x: 4
          'y': 5
          note: Enterprise suite and compliance posture
        - label: Snyk
          x: 3
          'y': 3
          note: Developer-first posture with broader AppSec modules
        - label: GitHub / GitLab
          x: 2
          'y': 3
          note: SCM-native distribution; breadth not fully evidenced
        - label: Semgrep / point tools
          x: 2
          'y': 2
          note: Focused developer-first or specialist scope
        - label: Internal / open source
          x: 1
          'y': 1
          note: Maximum internal control with assembled coverage
      xAxis:
        label: Integrated application-security breadth
        min: 1
        max: 5
      yAxis:
        label: Enterprise governance and procurement intensity
        min: 1
        max: 5
    approximationNotes: >-
      Coordinates are ordinal analyst scores derived from documented scope, packaging, and target-buyer evidence. They
      are not market share, efficacy, price, or independently measured rankings.
    claimRefs:
      - CP002
      - CP006
      - CP010
      - CP013
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Checkmarx's public product and pricing evidence indicates a multi-module enterprise monetization path, but the
      revenue and gross-profit outputs are not publicly quantified.
    data:
      nodes:
        - id: N1
          label: Enterprise development teams
          detail: Primary buyer context described in platform and customer materials
        - id: N2
          label: SAST entry
          detail: Source-code scanning; third-party pricing estimate includes a developer-based tier
        - id: N3
          label: Platform expansion
          detail: SCA, DAST, API, container, IaC, secrets, and ASPM capabilities
        - id: N4
          label: Services and support
          detail: Implementation, premium support, and training are described as cost drivers
        - id: N5
          label: Contracted software revenue
          detail: Public sources do not disclose realized revenue or revenue recognition
        - id: N6
          label: Gross profit and cash generation
          detail: Gross margin, burn, cash, debt, and runway are unavailable publicly
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N3
          to: N5
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: >-
      This is an evidence-backed operating model, not a forecast or a derived revenue bridge; missing financial outputs
      remain explicitly unavailable.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI014
  - id: FE001
    title: Checkmarx One product architecture map
    summary: A layered view of how Checkmarx One connects application signals to developer workflows and governance.
    type: stack
    data:
