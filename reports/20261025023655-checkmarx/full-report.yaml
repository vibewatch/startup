  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Checkmarx sells Checkmarx One as a broad enterprise application-security platform spanning SAST, SCA,
              DAST, API security, container security, IaC, correlation, and training. The product architecture supports
              a land-and-expand motion: an organization can begin with a code-scanning use case, then add supply-chain,
              runtime, API, container, infrastructure, and governance modules. Public pricing evidence describes a
              quote-based model rather than a published rate card, with licensing influenced by contributing developers,
              repository coverage, product tier, deployment, support, and contract duration. A third-party pricing
              analysis reports a $30,000 annual minimum and estimated annual tiers, but those figures are explicitly
              estimates, not realized revenue or audited company data. The company-issued TEI release reports a
              1,800-plus customer base and a composite customer ROI case. A separate automated company profile reports
              that Checkmarx's own site said Checkmarx One passed $150 million in ARR within three years, while
              expressly noting that no independent source confirms the figure. Neither source discloses audited total
              revenue, the platform-to-company ARR bridge, revenue mix, gross margin, or customer concentration. That
              distinction leaves monetization directionally clear but financially under-specified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI006
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI004
