      - number: '1.3'
        title: Capital, ownership, and scale
        blocks:
          - type: paragraph
            body: >-
              Calcalist reported that Hellman & Friedman acquired Checkmarx in March 2020 for $1.2 billion, primarily
              from Insight Partners, and later sought at least $2.5 billion in a potential sale process. The same report
              said Checkmarx had raised $100 million in total, including an $85 million Insight investment in 2015, and
              that Hellman & Friedman held 90% of the shares while employees and founders held the balance. These are
              reported transaction and ownership figures, not an audited capitalization table or a completed sale. The
              report also estimated approximately 900 employees across 70 countries, with about half in Israel, while
              the 2025 company release provides a different scale lens: more than 865 large enterprises protected and
              more than 30% ARR growth year-to-date through September 30, 2025. Public evidence therefore supports
              substantial enterprise scale but leaves consolidated revenue, net retention, cash, debt, and current
              headcount unverified.
