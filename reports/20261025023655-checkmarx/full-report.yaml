      - number: '5.2'
        title: Architecture, integrations, and maturity
        blocks:
          - type: paragraph
            body: >-
              The platform's architecture is best understood as a layered control plane: scanners collect signals from
              code, dependencies, APIs, infrastructure, containers, and live applications; a central risk-orchestration
              layer correlates findings; workflow integrations deliver results to developers and security teams. G2 user
              evidence supports CI/CD integration and centralized reporting, while also recording practical limitations:
              one enterprise reviewer reported that .mjs files were not supported at the time of review, and another
              reported that full scans on large projects could slow pipelines. These observations do not establish a
              universal defect rate, but they show that language coverage, policy configuration, scan duration, and
              result consistency are material implementation variables. The public architecture evidence does not
              disclose service-level objectives, tenant isolation design, data residency options, or independently
              tested availability.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
      - number: '5.3'
        title: Differentiation, trust, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Checkmarx differentiates through breadth, enterprise governance, and the ability to correlate multiple
              AppSec testing modes in one program. That positioning aligns with CISA's Secure by Design guidance, which
              treats product security as a core business requirement, and with NIST's SSDF, which recommends integrating
              secure-development practices into each SDLC. Those frameworks are standards for buyers and producers, not
              proof that Checkmarx itself satisfies every control. External user evidence is mixed: reviewers praise
              actionable reporting and pipeline integration, but also mention false-positive noise, setup effort,
              pricing pressure, and slow or incomplete coverage for some projects. The March 2026 repository compromise
              described in the assigned company-profile source reportedly did not reach the Checkmarx One service, yet
              it makes software-distribution controls and incident disclosure a priority diligence item. Current
              penetration-test scope, incident chronology, vulnerability disclosure metrics, and roadmap support
              commitments are not publicly established here.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Product verdict
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a mature enterprise AppSec operating model with a broad product surface and credible
              workflow adoption, not a fully verified technical moat. Checkmarx can plausibly reduce tool sprawl for
              organizations that need SAST, SCA, DAST, API, IaC, container, and governance capabilities in one
              procurement relationship. The tradeoff is implementation complexity: pricing is quote-based, scan
              throughput and language coverage require validation in the buyer's estate, and customer-facing evidence
              does not establish independent reliability or security assurance for the current release. Underwriting
              should therefore treat breadth and existing enterprise workflow fit as strengths, while making
              renewal-quality telemetry, control-plane security evidence, and current product performance acceptance
              tests conditions of conviction.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the product's clearest strength
            body: >-
              The assigned evidence consistently describes a consolidated platform spanning multiple AppSec testing
              modes and delivery integrations, which can reduce point-tool fragmentation for enterprise programs.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: callout
            title: Technical assurance remains under-disclosed
            body: >-
              Public sources do not establish current uptime, tenant isolation, data residency, penetration-test scope,
              or complete incident metrics; these are material diligence conditions for a security platform.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE015
          - type: callout
            title: Underwrite with a production acceptance test
            body: >-
              Require a representative repository and API test covering supported file types, scan duration,
              false-positive handling, authenticated paths, CI/CD throughput, and remediation workflow before treating
              product breadth as durable differentiation.
            calloutType: recommendation
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise segments and buying centers
        blocks:
          - type: paragraph
            body: >-
              The strongest customer evidence points to a sales-led enterprise motion rather than a self-serve customer
              base. Apps Run The World describes deployments across transportation, banking, insurance, manufacturing,
              and payments, while CTech names Dell, Adidas, Ford, Visa, Siemens, and Salesforce as clients. The
              participating functions extend beyond a security buyer: the deployment narratives involve application
              engineering, DevOps, vulnerability management, compliance, audit, and executive risk oversight. Cyber
              Company Profiles says an outside report counted more than 1,800 customers in March 2023, but also
              identifies that figure as the latest independent count in its reviewed record. This supports broad
              historical enterprise reach, not a current account census or a measure of paying, active, production
              customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
      - number: '6.2'
        title: Deployment depth and adoption signals
        blocks:
          - type: paragraph
            body: >-
              The clearest adoption evidence concerns workflow depth inside named accounts. Cebu Air is described as
              migrating on-premises CxSAST workloads to Checkmarx One, embedding scans in CI/CD, expanding AppSec access
              from about 10 users to more than 100, and reducing vulnerability density by about 50 percent. Those
              outcomes originate in a vendor case study summarized by an independent directory and are not audited
              measures. HSBC USA is described as operating security testing across 11 Asia-Pacific and European
              countries, Humana as covering more than 50 applications, and Mastercard as embedding Checkmarx in a
              program run by a global team of more than 60 people. These accounts demonstrate production integration,
              but their different populations and periods prevent a comparable adoption curve.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU007
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability, expansion, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Public reference volume is substantial but does not resolve durability. FeaturedCustomers displays 65
              testimonials, 47 case studies, 16 customer videos, and a 4.7/5.0 score based on 3,835 reference ratings;
              the page does not disclose the selection method, active-account denominator, or renewal cohort. Safeguard
              argues that rollout success depends on deep SCM and CI integration plus disciplined triage, implying that
              adoption requires continuing operating effort. CheckThat.ai describes custom enterprise pricing and
              estimates a $30,000 annual minimum, but its wider cost ranges are modeled estimates rather than vendor
              quotes. Competitors Beagle Security and OX portray cost, onboarding, developer workflow, and platform
              fragmentation as switching pressures. Those claims are adverse signals, not independent benchmarks,
              because the issuers sell competing products.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Customer underwriting view
        blocks:
          - type: paragraph
            body: >-
              The evidence supports the existence of large, operationally embedded customers and a sizeable public
              reference program. It does not show whether the referenced deployments are all current, whether they
              expanded commercially after implementation, or whether Checkmarx retains them at attractive economics.
              None of the assigned sources reports net revenue retention, gross retention, churn, contract duration,
              top-customer share, partner-sourced revenue, or a current independently verified customer count. The
              customer thesis should therefore be treated as proven at the level of named enterprise use cases but
              unproven at the level of recurring durability and concentration. Underwriting requires CRM-to-billing
              reconciliation, product telemetry, cohort renewals, and a top-account schedule rather than extrapolation
              from logos, references, or historical counts.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise proof extends beyond logos
            body: >-
              Several named deployments describe CI/CD, application portfolios, compliance workflows, and
              cross-functional governance, which is stronger evidence than an unexplained logo list.
            calloutType: strength
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Durability remains unverified
            body: >-
              Public sources do not disclose retention, churn, contract duration, expansion economics, or account
              concentration, so named deployments cannot establish recurring quality.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Software-supply-chain trust ranks first because a third-party profile reports that attackers used
              Checkmarx repositories to distribute malicious editor and build artifacts in March 2026. That profile also
              says Checkmarx and Mandiant found no access to the Checkmarx One service; this is a bounded investigation
              result, not proof that every customer or distributed artifact avoided harm. Product-performance risk ranks
              next: current user evidence repeatedly identifies false positives, long full scans, and a file-extension
              coverage gap. These issues can weaken developer adoption and delay pipelines even when the platform's
              breadth is valuable. Investment underwriting should therefore require incident-control evidence and
              buyer-run acceptance tests, rather than treating vendor or review-platform summaries as substitutes for
              testing.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and control exposure
        blocks:
          - type: paragraph
            body: >-
              CISA's Secure by Design guidance places executive ownership on technology producers and frames customer
              security as a core business requirement. NIST's SSDF likewise recommends integrating secure-development
              practices into each lifecycle so producers reduce released vulnerabilities, limit exploitation impact, and
              address root causes. Those sources establish an external control benchmark, not Checkmarx's compliance
              with it. The assigned evidence also repeats a historical Jenkins-plugin vulnerability that disabled TLS
              validation by default, but it contains no current regulator, litigation, privacy-enforcement, license, or
              sanctions record for the company. Diligence should map current controls and exceptions to CISA and NIST
              practices and obtain counsel-certified searches before treating legal exposure as low.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Commercial, operating, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Pricing opacity compounds operational risk. Independent and competitor-authored analyses describe
              quote-based enterprise pricing, material implementation effort, and add-on or support costs, while a
              pricing aggregator explicitly labels its cost ranges as estimates that can vary significantly. G2's
              current page reports an average two-month implementation period and eleven-month return-on-investment
              period, but those figures are review-derived averages rather than Checkmarx-specific audited economics. A
              2022 workforce reduction is only historical context; it shows that management previously reorganized and
              refocused resources under market pressure, not that current product investment is impaired. The kill test
              is a buyer-specific total cost, implementation, support, and roadmap package that fails the investment
              committee's approved thresholds after a representative proof of value.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR011
              - CR015
      - number: '7.4'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigations are testable. For supply-chain trust, require the incident report, artifact inventory,
              credential-rotation evidence, third-party investigation scope, and proof that release signing and
              repository controls now detect recurrence. For product quality, run representative repositories through
              agreed file-coverage, false-positive, scan-time, and pipeline-availability thresholds before purchase. For
              economics, reconcile the final quote to active developers, repositories, automation accounts, concurrent
              scans, services, support, and renewal terms. Thesis breaks include another material distribution-channel
              compromise, failure against the buyer's agreed acceptance thresholds, or refusal to provide current
              financial, concentration, incident, and legal evidence. Because public sources do not quantify partner or
              customer concentration, these triggers remain diligence conditions rather than claims that a failure has
              already occurred.
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment committee condition
            body: >-
              Do not clear the risk workstream until Checkmarx supplies primary incident-control evidence,
              representative product acceptance results, a fully loaded quote and implementation plan, current financial
              capacity, and legal and concentration schedules.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Checkmarx has a plausible quality premium: its platform spans SAST, SCA, DAST, API,
              infrastructure-as-code, container, secrets, and ASPM workflows, and its target customer is an enterprise
              that values centralized governance. The official ASPM material describes a unified application-risk view
              spanning multiple testing signals and positions the product for complex application portfolios and
              app-owner mapping. That breadth can support vendor consolidation and switching costs when a buyer has many
              repositories, compliance requirements, and security stakeholders. However, the evidence is not a clean
              underwriting package. Calcalist reported that Hellman & Friedman sought at least $2.5 billion after buying
              Checkmarx for $1.2 billion and that revenue had doubled but declined slightly in 2023; the report did not
              provide audited revenue, EBITDA, cash, debt, or a transaction outcome. Information Security Media Group
              likewise described complicated pricing and implementation, and stronger competition from Snyk, Veracode,
              Black Duck, and platform vendors. This combination supports a valuable asset thesis but not a
              price-insensitive buy call.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.2'
        title: Price discipline and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The public pricing evidence points to a quote-heavy enterprise model rather than a transparent
              unit-economics benchmark. Checkmarx One component prices cited by the assigned pricing review include
              approximately $1,035 per license per year for a Start SKU and approximately $1,564 for Essential, while
              full-platform totals remain custom. The same source says premium services can be calculated as 20% of SaaS
              fees with minimums, and that implementation, tuning, and module expansion can dominate total cost. Those
              figures are procurement signals, not company revenue or ARR and should not be multiplied into a valuation.
              Transaction comparables show a wide range: Veracode was acquired for $950 million in cash in the assigned
              historical transaction source, while Snyk's 2021 financing valued it at $8.5 billion with reported ARR
              growth of 158% year over year. These are not directly comparable businesses or dates, but they establish
              that application-security prices depend heavily on growth, scale, product breadth, and market regime. A
              defensible Checkmarx entry price therefore requires a current ARR or revenue bridge, margins, retention,
              and fully diluted ownership data.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately conditional. The bull case requires evidence that Checkmarx can
              monetize platform breadth, sustain enterprise retention, and convert newer AI-assisted remediation into
              measurable expansion without disproportionate services cost. The base case assumes a valuable but mature
              enterprise security asset whose quote-based pricing and implementation burden limit growth and multiple
              expansion. The bear case is triggered by down-round pricing, weak retention, margin compression, customer
              concentration, or a shift toward developer-first and cloud-platform alternatives. The assigned G2 review
              archive contains both positive reports about integrations and early lifecycle detection and adverse
              comments about false positives, setup effort, scan time, unsupported file extensions, and pricing. That
              dispersion makes customer cohort and win/loss data central to exit readiness. Before any investment or
              sale process, diligence should obtain audited financials, current financing terms, net debt, preference
              stack, retention cohorts, implementation cost, renewal uplift, competitive displacement, and evidence that
              product investment remains aligned with customer outcomes.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at a price-sensitive entry
            body: >-
              The platform and enterprise references support continued diligence, but public evidence does not support a
              high-confidence buy at a rumored $2.5B-plus target. Move to buy only after current revenue or ARR, growth,
              margin, net retention, debt, fully diluted ownership, and transaction terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV014
          - type: callout
            title: The largest gap is financial, not product description
            body: >-
              Public materials explain product breadth and list-price mechanics more readily than they disclose audited
              company economics. Treat licensing examples, funding raised, and a sale-price target as distinct facts;
              none is a substitute for cash flow, ARR, or a cap-table bridge.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
