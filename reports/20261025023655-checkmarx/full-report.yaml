  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is application-security testing embedded in the software-development lifecycle. It
              includes static code analysis, software-composition analysis, dynamic testing of applications and APIs,
              infrastructure-as-code and container checks, secrets detection, plus the posture-management layer that
              correlates and governs findings. Checkmarx One sits at the broad-platform end of this boundary rather than
              in a single scanner category. The boundary excludes general network security, endpoint protection and
              consulting work not attached to an application-testing product. Buyers can instead assemble point
              scanners, open-source tools and internal AppSec workflows, so platform spend is partly consolidation of
              existing budgets rather than wholly new security spend. Checkmarx is most relevant where breadth,
              portfolio governance and regulated-enterprise workflows justify the implementation burden; teams needing
              only one testing layer can choose narrower substitutes.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Published estimates support market growth but not a single precise TAM. MarketsandMarkets places the broad
              global application-security-testing market at USD 1.83 billion in 2025 and USD 7.60 billion in 2031, a
              stated 26.7% CAGR. Mordor Intelligence places the narrower DAST market at USD 4.18 billion in 2026 and USD
              8.63 billion in 2031, a stated 15.59% CAGR. The narrower estimate exceeding the broad estimate shows that
              scope, sampling and modeling choices are not normalized across publishers; the values cannot be added or
              interpreted as Checkmarx revenue opportunity. Mordor's mix data nevertheless helps define the likely
              serviceable core: cloud delivery represented 73.50% of 2025 DAST spending, large enterprises 59.20%, and
              BFSI 24.20%. A company-specific SAM and SOM still require module-level revenue, eligible accounts,
              realized contract values, competitive win rates and geographic coverage.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyers, adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is most plausibly the CISO, AppSec leader or senior engineering owner, while developers
              and security engineers are the daily users; public sources do not verify Checkmarx's budget ownership by
              cohort. Adoption is pulled by secure-by-design expectations, acquisition requirements and the operational
              need to test frequently changing cloud and API estates. CISA assigns executive ownership for secure
              products, and NIST's SSDF gives purchasers and suppliers a shared acquisition vocabulary. Those forces
              favor integrated governance, but implementation economics can delay conversion. Independent and competitor
              reviews consistently describe quote-based pricing, setup effort, tuning needs and false-positive
              management as material frictions. Market research separately identifies AppSec skill scarcity and alert
              fatigue as adoption constraints. The valuation implication is that category growth alone does not
              establish Checkmarx's capture: diligence must test implementation time, module attach, renewal, expansion
              and displacement of point tools.
            claimRefs:
              - CM002
              - CM003
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
