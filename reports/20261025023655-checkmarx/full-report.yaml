              - CI002
              - CI007
              - CI014
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Checkmarx is private-equity-owned, so public financial disclosure is materially thinner than for a listed
              software company. A 2022 Calcalist report described a workforce reduction of about 100 employees, or 10%
              of the workforce, and quoted management as refocusing resources while continuing to invest in core
              application-security products. This is adverse evidence about operating pressure, but it does not quantify
              cash burn, runway, profitability, debt, or current headcount. The same report records the 2020 acquisition
              at a $1.15 billion valuation; that transaction valuation is not cash available or current financing
              capacity. The financial verdict is therefore mixed: enterprise breadth, customer adoption, and measurable
              customer-value claims support a credible recurring-software model, but absent audited revenue and
              cash-flow data prevent a high-conviction underwriting conclusion. Management should provide current ARR
              and revenue bridge, cohort retention, gross margin, services mix, cash, debt, burn, runway, and next-round
              or exit assumptions.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise value proposition is economically legible
            body: >-
              The commissioned TEI release describes a representative composite organization with $7.13M of benefits
              against $2.57M of costs over three years, while customer references describe scaled CI/CD and compliance
              deployments. These support a credible value narrative, but not Checkmarx's realized margin or payback.
            calloutType: strength
            claimRefs:
              - CI008
              - CI010
          - type: callout
            title: Underwriting is blocked by private-company opacity
            body: >-
              No assigned source discloses current audited revenue, ARR bridge, gross margin, cash, debt, burn, runway,
              retention, or customer concentration. Those omissions are material because quote-based enterprise pricing
              and services can produce very different revenue quality and cash conversion.
            calloutType: risk
            claimRefs:
