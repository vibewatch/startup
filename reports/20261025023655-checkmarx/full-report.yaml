  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary extends beyond vendors selling a like-for-like application security testing
              suite. MarketsandMarkets lists integrated incumbents such as IBM, Veracode, HCLTech, Black Duck, Snyk,
              GitHub, and Checkmarx, while also identifying Invicti, HackerOne, and Contrast Security as emerging
              leaders. Checkmarx itself compares against Snyk, GitHub Advanced Security, Veracode, Fortify, Black Duck,
              Semgrep, Wiz, and Endor Labs, but those comparisons are company-issued positioning rather than independent
              benchmarks. Buyers can also assemble open-source SAST and dependency-audit tools, keep internal review
              controls, or buy a specialist DAST or SCA product. Consequently, Checkmarx must win against platform
              consolidation, point-tool economics, and the status quo, not merely against another enterprise SAST
              vendor.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP011
              - CP012
              - CP014
      - number: '3.2'
        title: Capability, distribution, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Checkmarx's clearest differentiation is scope. Independent review surfaces and the official package page
              describe SAST, SCA, DAST, API, container, infrastructure-as-code, correlation, risk management, developer
              training, and AI-oriented modules in one offer. The official competitor page asserts advantages over Snyk,
              GitHub, Veracode, Fortify, Black Duck, and Semgrep, but no retained independent benchmark verifies its
              efficacy claims. GetApp's small review sample rates vulnerability scanning strongly while showing weaker
              value-for-money sentiment, which supports a nuanced conclusion: breadth and governance can matter to
              regulated enterprises, yet feature count alone does not prove superior detection, developer adoption, or
              trust. Procurement should test representative repositories and preserve unsupported matrix cells as
              unknown.
            claimRefs:
              - CP002
              - CP006
              - CP008
