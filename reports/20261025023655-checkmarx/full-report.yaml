              - CP015
      - number: '3.3'
        title: Packaging, pricing pressure, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Checkmarx publishes package names and modular coverage but no rate card; every official plan directs the
              buyer to request a custom quote. Third-party estimates are not contract evidence and diverge by scope:
              Launch Ready Code cites a $20,000-$50,000 annual starting range for a team, while CheckThat estimates a
              $30,000 annual minimum and much higher totals for 50-100 developers after modules and services. Snyk's
              historical funding and Veracode's acquisition value demonstrate that rivals have attracted substantial
              capital, not that their current economics or products are superior. Switching costs arise when policy,
              findings history, deployment constraints, and remediation workflows become embedded, but those costs
              should be measured in customer migrations rather than assumed from platform breadth.
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability and adverse competitive evidence
        blocks:
          - type: paragraph
            body: >-
              The market evidence cuts both ways. MarketsandMarkets says fragmented tool environments create operational
              cost and visibility problems, supporting Checkmarx's consolidation thesis, but it also identifies high
              enterprise licensing costs, false-positive noise, and compatibility gaps as market restraints. Verified
              Market Reports describes a crowded field with overlapping functionality and expects AI and machine
              learning to become central to testing, implying that new entrants can compress differentiation even if its
              market estimates are not used here. The durable moat is therefore the installed operating system around
              security policy, integrations, governance, and procurement trust, not a static feature checklist. Current
              independent win/loss rates, realized prices, migration costs, retention, and customer concentration remain
              unavailable in the assigned evidence.
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP015
              - CP016
