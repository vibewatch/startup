  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Checkmarx One is presented as a single application-security surface rather than a point scanner. The
              external product descriptions identify SAST for source code, SCA for open-source dependencies and
              licensing, DAST for running applications, API testing, infrastructure-as-code, container security, and
              supply-chain controls. The practical user workflow is shift-left: findings are surfaced in IDEs,
              source-control systems, CI/CD pipelines, and issue trackers, then routed for triage and remediation. A
              customer-database record describes Cebu Air moving on-premises CxSAST workloads to Checkmarx One,
              embedding automated scans in CI/CD and expanding access from about 10 to more than 100 AppSec users. That
              is useful implementation evidence, but it is a vendor-database account rather than an independently
              audited outcome. The product therefore appears operationally broad, while actual coverage, scan latency,
              and remediation quality remain deployment-dependent.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
