        title: Exhibits
        blocks:
          - type: callout
            title: Consolidation is the strongest right-to-win
            body: >-
              Checkmarx can replace several scanning surfaces with one governed platform, which is most valuable where
              regulated enterprises prioritize centralized policy and deployment flexibility.
            calloutType: strength
            claimRefs:
              - CP002
              - CP013
              - CP015
          - type: callout
            title: Public pricing evidence is not decision-grade
            body: >-
              Official pricing is quote-based and third-party estimates use different team sizes and inclusions, so no
              public source establishes realized price, discounting, renewal uplift, or total cost.
            calloutType: risk
            claimRefs:
