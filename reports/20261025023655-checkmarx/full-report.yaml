        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The available record shows a progression from founding and venture financing to private-equity ownership,
              workforce restructuring, platform expansion, and AI-oriented product development. Customer evidence shows
              Checkmarx One implementations at Cebu Air in 2024, Humana in 2020, Ingersoll Rand in 2020, and Mastercard
