      - CE003
      - CE005
      - CE006
  - id: FU001
    title: Enterprise customer adoption journey
    type: journey-map
    summary: >-
      Public evidence becomes progressively weaker after production integration, with renewal and expansion economics
      remaining private.
    data:
      nodes:
        - id: enterprise-trigger
          label: Enterprise security trigger
          detail: Regulated or complex organizations seek broad application-security coverage and governance.
        - id: commercial-evaluation
          label: Commercial evaluation
          detail: >-
            Custom enterprise pricing and competitor claims make scope, price, and implementation effort key diligence
            points.
        - id: integration
          label: SCM and CI integration
          detail: Adoption depends on automatic scanning in developer workflows and disciplined finding triage.
        - id: production
          label: Production deployment
          detail: Named accounts show pipeline, portfolio, compliance, and vulnerability-management use cases.
        - id: organizational-expansion
          label: Organizational expansion
          detail: Cebu Air provides a reported example of access expanding from about 10 to more than 100 users.
        - id: renewal-and-economics
          label: Renewal and economics
          detail: >-
            Retention, churn, contract duration, expansion ARR, and concentration are not public in the assigned
            evidence.
    approximationNotes: The journey is qualitative and ordered; it does not imply conversion rates, stage populations, or time-to-stage.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative ranking of the six most decision-relevant risks after considering only mitigations evidenced in the
      assigned public source pool.
    data:
      columns:
        - label: Lower residual exposure
          detail: Evidence supports a bounded issue or a directly testable mitigation.
        - label: Medium residual exposure
          detail: Risk is supported, but buyer-specific performance or economics remain untested.
        - label: Higher residual exposure
          detail: A material occurrence or evidence gap remains without primary control proof.
      rows:
        - label: Repository and artifact integrity
          note: Primary incident controls and customer impact evidence are not in the pool.
          values:
            - null
            - null
            - Critical impact / reported occurrence
        - label: False positives and triage load
          values:
            - null
            - High impact / repeated customer signal
            - null
        - label: Full-scan latency
          values:
            - null
            - High impact / repeated customer signal
            - null
        - label: File and language coverage
          values:
            - Medium impact / one specific current example
            - null
            - null
        - label: Pricing and implementation economics
          values:
            - null
            - High impact / quote and proof-of-value dependent
            - null
        - label: Legal and partner concentration
          values:
            - null
            - null
            - Potentially high impact / evidence unavailable
    approximationNotes: >-
      Qualitative placement, not a probability estimate; null cells mean no risk was placed in that band, and the chart
      does not imply measured likelihood or numeric comparability.
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR009
      - CR011
      - CR012
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Evidence chain from platform scale and market context to a conditional research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Enterprise platform breadth
          value: SAST, SCA, DAST, API, IaC, container, secrets, ASPM
        - id: proof
          label: Operating proof
          value: Revenue doubled by 2024 report; current ARR and retention undisclosed
        - id: price
          label: Price evidence
          value: $2.5B-plus reported target; quote-based TCO
        - id: comps
          label: Comparable context
          value: $950M Veracode deal; $8.5B Snyk 2021 valuation
        - id: downside
          label: Downside
          value: Competition, implementation burden, mixed user feedback
        - id: decision
          label: Decision
          value: Research-more until current economics and terms are verified
    approximationNotes: The sequence is an authored reasoning chain, not a quantitative valuation model or implied conversion rate.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
