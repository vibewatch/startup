schemaVersion: report-v2
artifact: risks
slug: checkmarx
runDate: 2026-10-25
company:
  name: Checkmarx
chapter:
  number: 7
  title: Risks
  summary: >-
    Checkmarx's highest-priority risks are software-supply-chain trust after a reported
    2026 repository compromise, persistent customer-reported scan noise and latency, and
    opaque enterprise pricing. Public evidence supports concrete diligence tests, but it
    does not establish current legal exposure, partner concentration, or financial capacity.
sections:
  - id: ranked-risk-view
    title: Ranked risk view
    body: >-
      Software-supply-chain trust ranks first because a third-party profile reports that
      attackers used Checkmarx repositories to distribute malicious editor and build
      artifacts in March 2026. That profile also says Checkmarx and Mandiant found no access
      to the Checkmarx One service; this is a bounded investigation result, not proof that
      every customer or distributed artifact avoided harm. Product-performance risk ranks
      next: current user evidence repeatedly identifies false positives, long full scans,
      and a file-extension coverage gap. These issues can weaken developer adoption and
      delay pipelines even when the platform's breadth is valuable. Investment underwriting
      should therefore require incident-control evidence and buyer-run acceptance tests,
      rather than treating vendor or review-platform summaries as substitutes for testing.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR006
      - CR011
      - CR012
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: regulatory-and-legal
    title: Regulatory, legal, and control exposure
    body: >-
      CISA's Secure by Design guidance places executive ownership on technology producers
      and frames customer security as a core business requirement. NIST's SSDF likewise
      recommends integrating secure-development practices into each lifecycle so producers
      reduce released vulnerabilities, limit exploitation impact, and address root causes.
      Those sources establish an external control benchmark, not Checkmarx's compliance
      with it. The assigned evidence also repeats a historical Jenkins-plugin vulnerability
      that disabled TLS validation by default, but it contains no current regulator,
      litigation, privacy-enforcement, license, or sanctions record for the company.
      Diligence should map current controls and exceptions to CISA and NIST practices and
      obtain counsel-certified searches before treating legal exposure as low.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
    tableRefs:
      - TR001
  - id: commercial-and-execution
    title: Commercial, operating, and execution risk
    body: >-
      Pricing opacity compounds operational risk. Independent and competitor-authored
      analyses describe quote-based enterprise pricing, material implementation effort,
      and add-on or support costs, while a pricing aggregator explicitly labels its cost
      ranges as estimates that can vary significantly. G2's current page reports an average
      two-month implementation period and eleven-month return-on-investment period, but
      those figures are review-derived averages rather than Checkmarx-specific audited
      economics. A 2022 workforce reduction is only historical context; it shows that
      management previously reorganized and refocused resources under market pressure, not
      that current product investment is impaired. The kill test is a buyer-specific total
      cost, implementation, support, and roadmap package that fails the investment
      committee's approved thresholds after a representative proof of value.
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR008
      - CR009
      - CR010
      - CR015
    tableRefs:
      - TR003
  - id: monitoring-and-kill-criteria
    title: Monitoring, mitigations, and thesis-break triggers
    body: >-
      The mitigations are testable. For supply-chain trust, require the incident report,
      artifact inventory, credential-rotation evidence, third-party investigation scope,
      and proof that release signing and repository controls now detect recurrence. For
      product quality, run representative repositories through agreed file-coverage,
      false-positive, scan-time, and pipeline-availability thresholds before purchase.
      For economics, reconcile the final quote to active developers, repositories,
      automation accounts, concurrent scans, services, support, and renewal terms. Thesis
      breaks include another material distribution-channel compromise, failure against the
      buyer's agreed acceptance thresholds, or refusal to provide current financial,
      concentration, incident, and legal evidence. Because public sources do not quantify
      partner or customer concentration, these triggers remain diligence conditions rather
      than claims that a failure has already occurred.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR008
      - CR009
      - CR011
      - CR013
      - CR014
      - CR015
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or framework
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Mitigation / diligence path
      - Residual exposure
    rows:
      - - Secure by Design producer responsibility
        - United States policy guidance
        - CISA assigns executive ownership and treats customer security as a core business requirement
        - Applicable benchmark
        - High
        - Map product and corporate controls to the CISA principles; obtain exception ownership
        - Unverified because the pool contains no Checkmarx control mapping
      - - NIST Secure Software Development Framework
        - United States federal framework / supplier benchmark
        - NIST SP 800-218 Version 1.1 was published in February 2022
        - Applicable benchmark
        - High
        - Obtain current SSDF mapping, evidence samples, remediation SLAs, and internal-audit results
        - Alignment is not established by the framework itself
      - - Jenkins Checkmarx Plugin TLS validation flaw
        - Software vulnerability record repeated by an independent profile
        - The profile reports CVE-2023-35142 disabled TLS validation by default
        - Historical occurrence
        - Medium
        - Verify affected versions, customer notice, patch adoption, and secure-default regression tests
        - Current exposure is unknown without primary remediation evidence
      - - Current litigation, privacy enforcement, licenses, and sanctions
        - Global
        - Not established in the assigned public evidence
        - Unknown
        - Potentially high
        - Counsel-certified litigation and regulator searches plus privacy and license compliance review
        - Material evidence gap
    notes: >-
      Partial register based only on the assigned prefetched sources; framework applicability
      does not prove Checkmarx compliance, and unknown means no supporting record was available.
    enumerationScope:
      coverage: partial
      basis: Public regulatory, framework, and company-linked records available in the assigned source pool.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap / kill criterion
    rows:
      - - Compromise of distributed developer artifacts
        - Reported March 2026 occurrence
        - Critical
        - Investigation reportedly completed; underlying controls not in pool
        - High until controls are independently evidenced
        - Kill on recurrence affecting customer service or on inability to evidence release integrity
      - - False-positive burden and triage noise
        - Repeated across current G2 reviews and its review synthesis
        - High
        - Vendor responses describe improvements; no independent benchmark in pool
        - Medium-high
        - Kill if representative repositories miss the buyer's agreed precision and triage thresholds
      - - Long scans on large or complex codebases
        - Reported by independent guide and current customers
        - High
        - Incremental scanning is described, but full-scan performance remains reported
        - Medium-high
        - Kill if full and incremental scans miss agreed CI/CD service levels
      - - Modern file-extension coverage gap
        - One June 2026 enterprise reviewer reports .mjs remained unsupported
        - Medium
        - Vendor response cites broader language-agnostic scanning, not closure of the named gap
        - Medium
        - Require a coverage test against the buyer's actual languages and extensions
      - - Implementation and policy-configuration complexity
        - G2 averages two months to implement; reviews describe a learning phase
        - Medium
        - Enterprise support exists, but service scope and outcomes are not independently evidenced
        - Medium
        - Kill if scoped implementation cost, staffing, and timeline exceed approved thresholds
    notes: >-
      Severity and residual exposure are diligence judgments grounded in the cited incident,
      review, and pricing evidence; no hands-on product test was performed.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR005
      - CR006
      - CR007
      - CR011
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Source and artifact distribution
        - GitHub repositories, editor extensions, build plugins, and CI/CD workflows
        - Not quantified
        - A compromised repository or build path distributes malicious security tooling
        - Critical
        - Signed releases, protected pipelines, least privilege, artifact inventory, and external control testing
        - High until primary incident and control evidence is reviewed
      - - Customer development stack
        - Languages, file extensions, repositories, and pipeline integrations
        - Not quantified
        - Unsupported formats or slow scans reduce coverage or cause teams to bypass controls
        - High
        - Proof of value using representative repositories and enforceable coverage / scan-time acceptance criteria
        - Medium because current reviews still report gaps
      - - Owner and operating-resource support
        - Hellman & Friedman ownership and management resource allocation
        - Current capital and staffing capacity not disclosed in the assigned evidence
        - Resource refocus weakens support, roadmap delivery, or incident response
        - Medium
        - Review current budget, retention, support staffing, roadmap delivery, debt, and board-approved investment
        - Unknown; the cited workforce action occurred in 2022
    notes: >-
      Partial dependency map; the assigned evidence does not disclose current cloud,
      reseller, supplier, key-customer, or capital-provider concentration.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR011
      - CR015
