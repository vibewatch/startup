    - type: private-evidence-only
      severity: material
      topic: dependency-concentration
      missingEvidence: >-
        Current supplier, cloud, reseller, key-customer, owner, and capital-provider
        concentration plus substitution and continuity plans.
      whyItMatters: >-
        Public evidence identifies important dependency surfaces but cannot quantify
        concentration, contractual protection, or recovery time.
      diligencePath: >-
        Review the counterparty register, revenue and spend concentration schedules,
        material contracts, exit clauses, disaster-recovery tests, and board risk reports.
