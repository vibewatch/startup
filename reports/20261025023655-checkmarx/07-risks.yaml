    approximationNotes: >-
      Qualitative placement, not a probability estimate; null cells mean no risk was placed
      in that band, and the chart does not imply measured likelihood or numeric comparability.
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR009
      - CR011
      - CR012
      - CR015
