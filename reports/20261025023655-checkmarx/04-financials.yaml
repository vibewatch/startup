    rows:
      - ["SAST and code security", "Developer and security teams scan proprietary source code", "Product documented; realized revenue undisclosed", "Recurring enterprise software is plausible; not audited", "ARR and contract-level revenue by module"]
      - ["SCA and supply-chain security", "Dependency, open-source, secrets, and SBOM risk management", "Product documented; realized mix undisclosed", "Expansion candidate; no public mix or attach rate", "Attach rates, renewal rates, and gross retention"]
      - ["DAST, API, container, and IaC", "Runtime, interface, container, and infrastructure testing", "Product documented; realized mix undisclosed", "Multi-module monetization; pricing and utilization unknown", "Bookings, usage, and realized price by module"]
      - ["Services, support, and training", "Implementation, premium support, and Codebashing/training", "Public sources describe services and support; revenue undisclosed", "May dilute or increase gross margin; mix unknown", "Services revenue, delivery cost, and renewal impact"]
    notes: "Public product descriptions establish mechanisms, not recognized revenue. Null or undisclosed values are not zero."
    claimRefs: [CI001, CI003, CI006]
  - id: TI002
    title: Pricing and monetization
    columns: [Pricing element, Public evidence, List versus realized, Underwriting implication, Required validation]
    rows:
      - [SAST entry tier, "$1,035 per developer annually; $30,000 minimum reported by a third party", "Estimated list/planning figure, not realized price", "Creates an enterprise budget floor if accurate", "Signed order forms and discount schedule"]
      - [Platform tiers, "Estimated annual ranges of $80,000-$500,000-plus across tiers", "Third-party estimates; quote-based actuals unknown", "Broad expansion surface but large uncertainty", "Price waterfall by customer segment and tier"]
      - [Contributing developers, "Licensing described as tied to commits in a rolling 90-day window", "Reported licensing mechanic; realized denominator unverified", "Usage can rise with developer and automation activity", "Contract definition, true-up terms, and bot treatment"]
      - [Services and support, "Third-party source estimates TCO at 1.5-2x base license", "Estimate; not company-reported", "Implementation and support can materially change payback", "Professional-services attach, utilization, and margin"]
    notes: "Pricing rows mix quoted third-party estimates with product documentation. They are not evidence of Checkmarx ARR, revenue recognition, or customer-level realized pricing."
    claimRefs: [CI002, CI004, CI007, CI009]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Checkmarx One ARR", "$150M within three years, relayed from a company claim", "Low; no independent confirmation and no total-company bridge", "Potential platform traction, but not audited revenue or cash generation", "Platform-to-company ARR bridge, period definition, and audit support"]
      - ["Customer count", "More than 1,800 in company release", "Medium; company-claimed", "Indicates enterprise distribution but not revenue concentration", "Reconcile active customers, ARR bands, and churn"]
      - ["Representative customer benefits", "$7.13M benefits versus $2.57M costs over three years", "Medium; commissioned study", "Supports value proposition in a composite case", "Cohort-level realized ROI and renewal linkage"]
      - ["Gross margin", null, "Unavailable publicly", "Determines software quality and services drag", "Audited gross margin by software and services"]
      - ["Cash, burn, and runway", null, "Unavailable publicly", "Determines financing dependency and downside timing", "Latest balance sheet, cash flow, debt, covenants, and runway"]
      - ["CAC, payback, and retention", null, "Unavailable publicly", "Tests whether enterprise growth is efficient and durable", "New-logo CAC, payback, NRR, GRR, churn, and win/loss cohorts"]
    notes: "The quantified ROI row is for a representative composite organization, not Checkmarx's own unit economics. Null means the metric was not publicly supportable in the assigned evidence."
    claimRefs: [CI005, CI008, CI010, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: "Checkmarx's public product and pricing evidence indicates a multi-module enterprise monetization path, but the revenue and gross-profit outputs are not publicly quantified."
    data:
      nodes:
        - id: N1
          label: "Enterprise development teams"
          detail: "Primary buyer context described in platform and customer materials"
        - id: N2
          label: "SAST entry"
          detail: "Source-code scanning; third-party pricing estimate includes a developer-based tier"
        - id: N3
          label: "Platform expansion"
          detail: "SCA, DAST, API, container, IaC, secrets, and ASPM capabilities"
        - id: N4
          label: "Services and support"
          detail: "Implementation, premium support, and training are described as cost drivers"
        - id: N5
          label: "Contracted software revenue"
          detail: "Public sources do not disclose realized revenue or revenue recognition"
        - id: N6
          label: "Gross profit and cash generation"
          detail: "Gross margin, burn, cash, debt, and runway are unavailable publicly"
      edges:
        - from: N1
          to: N2
        - from: N2
          to: N3
        - from: N3
          to: N4
        - from: N3
          to: N5
        - from: N4
          to: N5
        - from: N5
          to: N6
    approximationNotes: "This is an evidence-backed operating model, not a forecast or a derived revenue bridge; missing financial outputs remain explicitly unavailable."
    claimRefs: [CI001, CI002, CI007, CI014]
callouts:
  - calloutType: strength
    title: Enterprise value proposition is economically legible
    body: "The commissioned TEI release describes a representative composite organization with $7.13M of benefits against $2.57M of costs over three years, while customer references describe scaled CI/CD and compliance deployments. These support a credible value narrative, but not Checkmarx's realized margin or payback."
    claimRefs: [CI008, CI010]
  - calloutType: risk
    title: Underwriting is blocked by private-company opacity
    body: "No assigned source discloses current audited revenue, ARR bridge, gross margin, cash, debt, burn, runway, retention, or customer concentration. Those omissions are material because quote-based enterprise pricing and services can produce very different revenue quality and cash conversion."
    claimRefs: [CI004, CI011, CI014, CI015]
