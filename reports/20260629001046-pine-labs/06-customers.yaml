  - id: adoption-trajectory
    title: "Adoption and Scale Trajectory"
    body: |
      Pine Labs' adoption metrics show consistent double-digit growth across its core operating levers in FY26. Merchant count grew 14% year-on-year to 1.1 million, while digital checkout points (combining hardware PoS terminals, Android-based smart devices, and software-only checkout integrations) reached 2.03 million, growing 11% year-on-year. Both metrics grew slightly slower than total revenue (+17-19% for FY26), suggesting ongoing deepening of product attach per merchant rather than a pure headcount expansion story. Gross transaction value reached $194 billion in FY26, up 50% year-on-year, reflecting both merchant count growth and higher transaction intensity per merchant site as EMI, BNPL, and UPI transaction volumes scaled.

      The prepaid and brand segment shows its own adoption proxy: 86.5 crore prepaid cards issued in FY26 versus 71 crore in FY25, a 22% increase, indicating growing enterprise brand program uptake even as the regulatory environment around gift card breakage income attracted scrutiny. The Shopflo acquisition expanded the addressable customer universe into D2C e-commerce, adding 1,000+ brands and a 60 million-customer transaction history in a single deal.

      International adoption is the fastest-growing segment by revenue percentage: international revenue of ₹403 crore in FY26 represents approximately 15% of total revenue, with stated operations now spanning 22 countries. The GCash partnership in the Philippines (May 2026) targets 6 million MSME merchants, and stablecoin-backed prepaid cards were announced for nine international markets in West Asia, Africa, and Southeast Asia by April 2026. Importantly, none of these metrics disclose per-cohort retention or the share of merchants that are verified active versus enrolled but dormant; the headline counts are gross enrolled figures.
