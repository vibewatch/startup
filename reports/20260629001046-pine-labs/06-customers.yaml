  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "NRR, GRR, cohort-level merchant churn data, merchant lifetime value, and contract tenure by segment"
      whyItMatters: "Without NRR/GRR, it is impossible to verify that Pine Labs' merchant base is growing through genuine retention rather than rapid churn offset by new enrollment; the proxy NPS of -7 suggests the retention story may be weaker than implied by gross merchant count growth."
      diligencePath: "Request cohort retention tables for vintage classes FY23/24/25 from Pine Labs investor relations; obtain NPS by segment (enterprise vs SMB); compare GRR to fintech infrastructure peers such as Ingenico and Verifone disclosed metrics."
      relatedQuestionRefs:
        - QU008
        - QU015

    - type: private-evidence-only
      severity: material
      topic: enterprise-merchants
      missingEvidence: "Names of the top 10 customers and the single largest customer (10.62% / 8.24% of revenue); identities of the 'top 5 banks' and 'top 5 retailers' referenced in shareholder communications"
      whyItMatters: "Knowing counterparty identities enables assessment of contract renewal risk, competitive exposure (e.g., if a large customer is also piloting a competing platform), and dependency on any single regulated-sector client; without names, the disclosed 10.62% single-customer concentration is unactionable."
      diligencePath: "Request named top-customer list under NDA from Pine Labs IR; conduct channel checks with Indian bank procurement contacts; review RBI licensed entity announcements for bank-level Pine Labs deployments."
      relatedQuestionRefs:
        - QU011

    - type: missing-source
      severity: material
      topic: bank-partner
      missingEvidence: "Transaction volume, merchant count, and ARR attributable to Wio Bank, Karnataka Bank, and Pan Asia Bank Credit+ deployments; brand count reconciliation explaining the difference between 716 brands (Q3FY26 letter) and 450+ brands (FY26 Investor Day)"
      whyItMatters: "Wio Bank and Karnataka Bank partnerships are the primary evidence of Pine Labs' international bank customer traction; without volume data these remain announcement-stage proof. The brand count discrepancy (716 vs 450+) may indicate a methodology change, loss of inactive brands, or an error — each scenario has different implications for Qwikcilver customer durability."
      diligencePath: "Follow up with Pine Labs IR on brand count methodology; request quarterly brand count series from FY25 to FY26; verify Wio Bank deployment scale via UAE fintech industry contacts; seek independent confirmation of Karnataka Bank terminal deployment volume."
      relatedQuestionRefs:
        - QU010
        - QU018

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: "Comprehensive list of all production deployments across the 177 financial institution partner base and all 450+ enterprise brands; geographic coverage of channel partner merchant footprints"
      whyItMatters: "The named customer proof table covers only a small fraction of the reported 177 FI partners and 450+ brands; the unverified 'top 5 banks / top 5 retailers' claim inflates the implied enterprise customer pedigree without supporting named evidence."
      diligencePath: "Request a full anonymised or named list of FI partners from Pine Labs; conduct press-release search across all 177 partner institutions; request reference customer contacts for each Credit+ deployment."
      relatedTableRefs:
        - TU003
      relatedQuestionRefs:
        - QU002
        - QU003

