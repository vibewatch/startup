  - id: retention-durability
    title: "Retention, Durability, and Switching Costs"
    body: |
      Pine Labs does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), cohort-level churn rates, or merchant lifetime value in any public filing or investor communication as of June 2026. Retention analysis must therefore rely on structural switching-cost evidence and consumer-facing proxy indicators. The primary enterprise retention driver is platform integration depth: Pine Labs aggregates 200+ bank and NBFC EMI programs through a single device or API endpoint, eliminating the need for merchants to maintain individual bank relationships. For a multi-location retailer or hospitality chain, replacing Pine Labs means renegotiating with each bank partner, re-deploying ERP accounting linkages (including EMI subvention reconciliation, GST handling, and MDR reporting), and rolling out replacement hardware — a process that yields months of operational disruption and meaningful capital cost.

      SMB merchants face lower switching barriers. Competitors including Paytm, PhonePe, and BharatPe offer competing PoS products with comparable basic features, faster settlement options in some configurations, and actively target Pine Labs' lower-margin merchant base. Deep ERP and multi-bank EMI integration is not typically deployed at the single-store SMB level, reducing the friction of exit.

      Consumer-facing evidence is mixed: G2 reviews reflect a 4.3/5 satisfaction score (small and unrepresentative sample), but Comparably-aggregated data indicates an NPS of -7, signaling a notable share of merchant detractors. The Indian Consumer Complaints Forum contains active complaints from SMB merchants about billing irregularities after PoS cancellation, continued charges post-deactivation, and slow resolution — consistent with high exit friction being experienced by the most mobile segment of the merchant base. For enterprise brands using Qwikcilver, stickiness is reinforced by the complexity of replacing a gift card management platform: issuance, redemption, reconciliation, and brand-facing API layers must all be rebuilt, creating multi-year switching costs independent of contractual terms.
