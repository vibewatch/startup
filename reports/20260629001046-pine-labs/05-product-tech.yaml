  evidenceGaps:
    - type: missing-source
      severity: material
      topic: api-reliability
      missingEvidence: "An independent third-party benchmark or SLA audit verifying Pine Labs Plural gateway uptime, latency, and error rates under production load."
      whyItMatters: "Pine Labs claims 99.99% uptime and under 300ms average response based on its own portal; without independent corroboration this cannot be used to assess reliability risk for merchants relying on the gateway."
      diligencePath: "Request SLA documentation and historical uptime logs from Pine Labs directly; review merchant forum discussions or third-party monitoring services (e.g., Pingdom, StatusPage) for Plural gateway endpoint reliability data."
      relatedQuestionRefs: [QE005]

    - type: missing-source
      severity: material
      topic: stablecoin-launch-status
      missingEvidence: "Confirmation of whether the stablecoin-backed prepaid card has actually launched in any of the nine announced markets as of June 2026."
      whyItMatters: "The April 2026 launch target has passed. If the launch was delayed or cancelled, it affects the credibility of Pine Labs' international technology roadmap and stablecoin strategy."
      diligencePath: "Search for post-April 2026 press releases, user reports, or partner announcements from target markets (Middle East, Africa, SEA); check Pine Labs' investor relations page for product launch disclosures."
      relatedQuestionRefs: [QE015]

    - type: missing-source
      severity: minor
      topic: softpos-performance
      missingEvidence: "Independent benchmarks or merchant case studies comparing SoftPOS (Plutus on merchant Android handset) versus dedicated Plutus Smart terminal in terms of transaction speed, acceptance rates, and failure rates."
      whyItMatters: "SoftPOS is a lower-cost deployment path; its relative performance versus hardware terminals affects merchant adoption decisions and Pine Labs' ability to grow in SMB segments."
      diligencePath: "Review Pine Labs developer portal for SoftPOS documentation; search for independent merchant reviews and comparisons; ask Pine Labs for SoftPOS pilot data during diligence."
      relatedQuestionRefs: [QE018]

    - type: missing-source
      severity: material
      topic: cloud-infrastructure
      missingEvidence: "Pine Labs' cloud infrastructure provider (AWS, Azure, or GCP), data-centre configuration, disaster recovery architecture, and cloud SLA specifications."
      whyItMatters: "Cloud vendor concentration and DR configuration are material to platform reliability, regulatory data-residency compliance (RBI cloud guidelines), and vendor risk assessment."
      diligencePath: "Request infrastructure documentation from Pine Labs during technical due diligence; check RBI cloud policy compliance filings if available."

    - type: missing-source
      severity: minor
      topic: affordability-rail
      missingEvidence: "Technical documentation of Pine Labs' real-time EMI eligibility routing logic across 175-plus bank and NBFC APIs, including fallback behavior and offer-ranking algorithms."
      whyItMatters: "The internal routing mechanism for EMI eligibility is not publicly documented; understanding it is necessary to assess reliability risk if a major bank partner withdraws EMI offers."
      diligencePath: "Review Pine Labs developer portal for additional affordability API documentation; request technical architecture details from Pine Labs during diligence; speak with merchant customers using EMI."
      relatedQuestionRefs: [QE012]

    - type: private-evidence-only
      severity: material
      topic: P3P-liability
      missingEvidence: "Published NPCI or RBI guidance on the liability framework for unauthorized or erroneous AI agent payments under UPI mandate frameworks as used by P3P."
      whyItMatters: "Without a published liability framework, merchants and developers building on P3P carry unquantified regulatory and consumer-protection risk; NPCI/RBI clarification is needed before broad commercial deployment."
      diligencePath: "Monitor NPCI and RBI circular releases; engage with Pine Labs legal team to understand indemnity structures in the P3P developer agreements; review Grantex identity layer governance documentation."
      relatedQuestionRefs: [QE021]

