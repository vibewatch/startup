callouts:
  - calloutType: risk
    title: "Thesis-Critical: GST Litigation Exceeds 2.7x FY26 Net Profit"
    body: >
      The aggregate GST contingent liability of over Rs 310 crore (principal) plus estimated Rs 95.57 crore interest equals approximately Rs 405 crore—3.6x Pine Labs' FY26 net profit of Rs 112.5 crore.
      An adverse appellate ruling on the Rs 214 crore DGGI demand would not only wipe out reported profitability but could require a capital raise or covenant breach. Pine Labs asserts strong legal grounds, but multiple appellate stages have not yet resulted in a final resolution.
    claimRefs:
      - CR004
      - CR005
      - CR011

  - calloutType: risk
    title: "Thesis-Critical: RBI PPI Direction Threatens High-Margin Breakage Income"
    body: >
      The RBI's April 2026 draft PPI Master Direction contains a clause requiring transfer of expired PPI balances to the DEA Fund, which would eliminate breakage income for gift-card issuers including Pine Labs. Entrackr estimates this stream at 5-6 percent of Qwikcilver's Rs 700 crore gift-card revenue (~Rs 35-42 crore). Given near-zero incremental cost, the loss would flow almost entirely to net profit—erasing approximately 31-37 percent of FY26 net profit in a worst case. Pine Labs has not publicly quantified the impact, and no analyst appears to model it.
    claimRefs:
      - CR008
      - CR009
      - CR010

  - calloutType: risk
    title: "Manageable: Zero MDR and Investor Overhang Are Monitoring Risks"
    body: >
      Zero MDR on UPI limits Pine Labs' transaction-level monetisation, but MDR restoration for large merchants—recommended by the Finance Committee in 2026—could become a meaningful revenue tailwind if implemented. The lock-in expiry selling wave (Rs 17,372 crore freed in May 2026) is a technical overhang; it will diminish as pre-IPO investors complete their exits and domestic mutual funds (which bought in block deals) become the marginal investor.
    claimRefs:
      - CR014
      - CR034
      - CR038

