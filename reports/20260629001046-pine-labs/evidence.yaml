evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership-and-cap-table
    missingEvidence: >-
      A clean post-IPO cap table showing remaining stakes of major pre-IPO investors, insider holdings, and float
      evolution after listing.
    whyItMatters: >-
      Public disclosures identify selling shareholders but do not fully resolve who still controls meaningful voting or
      economic influence after the IPO.
    diligencePath: >-
      Collect the latest shareholding pattern, lock-in disclosures, and shareholder register filings from exchange
      announcements and investor-relations uploads.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: merchant-count-currentness
    missingEvidence: >-
      A primary-source merchant or active-customer count dated closer to the 2026-06-29 run date rather than
      FY25/Q1-FY26 reporting.
    whyItMatters: >-
      Merchant count is a key scale and distribution signal, but the freshest widely citable figure in retained sources
      still points backward to FY25 operating metrics.
    diligencePath: >-
      Check newer quarterly investor presentations, exchange press releases, or management commentary for an updated
      merchant-base number.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: board-committee-detail
    missingEvidence: >-
      Committee compositions, voting blocs, and practical governance mechanics beyond the board biographies published in
      the IPO materials.
    whyItMatters: >-
      Board names are visible, but oversight quality depends on committee structure and sponsor influence, which the
      abridged public file only partially reveals.
    diligencePath: >-
      Pull the latest corporate-governance documents, committee charters, and annual-report governance sections from
      investor relations.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: lifetime-capital-raised
    missingEvidence: A single authoritative reconciliation of lifetime primary capital, secondaries, debt, and post-IPO net proceeds.
    whyItMatters: >-
      Pine Labs is often discussed through historical private valuations, but investment judgment improves when capital
      inflows and secondary liquidity are fully separated.
    diligencePath: >-
      Reconstruct financing history from historical round announcements, DRHP/RHP capital structure notes, and
      post-listing filings.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: >-
      A fully exhaustive milestone list covering every historical financing, product release, and governance change
      since founding.
    whyItMatters: >-
      The chronology is designed to capture the most decision-relevant milestones, but it is not an exhaustive corporate
      history and could omit smaller intermediate events.
    diligencePath: >-
      Expand the chronology using older media archives, archived investor documents, and historical press releases if a
      refresh requires a denser historical timeline.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: commoditization-quantification
    missingEvidence: >-
      Quantitative data on POS hardware price erosion rates and terminal margin compression over the 2021-2026 period,
      specifically for India-market vendors including Pine Labs, Ingenico, and Verifone.
    whyItMatters: >-
      Without margin data on hardware, the commoditization thesis cited by Finshots and ETBFSI cannot be validated or
      sized; it affects whether Pine Labs' software-layer moat is large enough to offset hardware price compression.
    diligencePath: >-
      Request pricing schedules from Pine Labs' enterprise sales team or obtain channel-check data from independent POS
      hardware distributors in India.
    relatedQuestionRefs:
