  - id: TR005
    title: 缓释与 Kill-Criteria 表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - GST 诉讼不利裁决
        - GST Appellate Authority 或 CESTAT 命令
        - Rs 214 Cr DGGI 追缴遭不利裁决且未获中止
        - 打破投资逻辑：追缴变成确定负债，超过 FY26 净利润 2 倍；需要融资或重设盈利预期
      - - RBI PPI breakage 收入消除
        - RBI 最终发布关于 PPI 的 Master Direction
        - 强制将过期 PPI 余额转入 DEA Fund 的段落最终确定，且未给发行方豁免
        - 重大：下调 FY27-28 利润估计；按 Rs 35-42 Cr 年度利润率影响建模
      - - Zero MDR 延续且 MDR 未恢复
        - Union Budget / Finance Ministry 公告
        - FY27 预算继续安排 zero MDR 激励，但未为大型商户建立分层 MDR 框架
        - 可控：限制 UPI 变现上行空间；倒逼更快增长增值服务
      - - 机构投资者抛压
        - BSE/NSE 大宗和大额交易申报
        - IPO 前投资者在 30 天内新增超过 Rs 300 Cr 的大额交易
        - 可控：供给压顶；跟踪剩余机构持仓，判断后续退出波次
      - - 竞争导致市场份额侵蚀
        - 季度 GTV 数据对比 Razorpay/PhonePe 商户数披露
        - Pine Labs GTV 增速连续两个季度低于 30%
        - 警示：排查产品缺口；加快增值服务投资节奏
      - - 国际执行不达预期
        - 季度国际收入占总收入比例
        - 国际收入占比低于 15% 或连续两个季度停滞
        - 可控：削减国际 capex；重新聚焦印度核心业务
      - - ESOP / 员工成本膨胀
        - 季度业绩中的员工福利费用占收入比例
        - 员工成本连续两个季度超过收入 40%
        - 警示：利润率承压；评估新 ESOP 授予节奏和现金薪酬组合
      - - PCI DSS 合规失败
        - 卡组织审计发现或 RBI 检查
        - 任何需要整改的 PCI DSS 不合规发现
        - 投资逻辑关键：运营风险；卡组织暂停会让业务停摆
    notes: 阈值基于判断，并非来自 Pine Labs 披露的内部目标。所有触发器都应与季度监管申报和 NSE/BSE 披露交叉核对。
