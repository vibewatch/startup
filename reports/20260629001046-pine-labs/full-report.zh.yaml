  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：三个不同买方层级
        blocks:
          - type: paragraph
            body: >
              Pine Labs 服务三个结构上不同的买方层级，采购路径、集成深度和收入贡献各不相同。第一层也是数量最大的，是直接商户客户——110 万家企业使用 Pine Labs PoS 硬件、软件结账或支付 API
              来受理银行卡、UPI 和 EMI 交易。在这一层中，企业商户（头部零售商、石油网络、航空运营商、酒店连锁）是高价值端：它们把 Pine Labs 接入 ERP 系统，启用多银行 EMI
              补贴工作流，并在数百个网点运营大规模设备队列，形成深层运营切换成本。SMB 和微商户构成规模基础，但单商户收入更低，也是最容易被 Paytm、PhonePe 或 BharatPe 替代的群体。


              第二层是企业品牌——450 多个面向消费者的品牌与 Pine Labs 子公司 Qwikcilver 签约，把它作为白标礼品卡和忠诚度基础设施提供商，并按卡或按项目付费。已点名的企业品牌客户包括 Amazon
              India、Flipkart、Myntra 和 Croma，以及数百家企业礼赠客户。2026 年 4 月以 ₹88 crore 收购 Shopflo 后，这一层新增 1,000 多个 D2C 电商品牌，以及
              6,000 万条终端客户交易记录。


              第三层是金融机构伙伴——177 家银行和 NBFC 使用 Pine Labs 的发行、收单或卡管理平台（包括模块化 Credit+ 系统）来支撑自身商户产品或持卡人服务。已点名 FI 客户包括 Wio
              Bank（UAE）、Karnataka Bank（India）和 Pan Asia Bank（Sri Lanka）。这一 FI 层级模糊了客户与分销伙伴的边界：银行既为平台访问向 Pine Labs
              付费，也同时把商户关系导入 Pine Labs 基础设施。
