      - number: '2.3'
        title: 买方与分部地图
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的买方宇宙分成四个不同采购中心，各自预算所有者、采购标准和变现画像不同。大型企业零售商——百货连锁、燃油零售商、酒店集团和航空公司集成——构成锚定客户群。它们的财资和 IT
              部门掌握支付基础设施预算；采用通常由银行收单方关系、品牌 EMI 项目或忠诚度部署触发。该分部提供最高的单终端收入和最长合同期限。


              中小商户——kirana 门店、快餐餐厅、独立药房和加油站经销商——按商户数量计算，是最大的可寻址群体。它们的采用由 Payments Infrastructure Development Fund
              的政府补贴、零成本 QR 贴纸活动或金融科技同业推荐触发。单商户变现较低，但一旦商户采用 GST 开票、库存管理或分析的软件订阅，变现会明显改善。


              金融机构——银行、NBFC 和联名卡发卡机构——构成第三个购买中心，为 Pine Labs 的发卡基础设施和卡管理 API 付费；其选择标准强调监管合规、平台正常运行时间和白标能力。Pine Labs 的 177
              家金融机构合作伙伴和 716 个消费品牌，体现出这一企业关系层的广度。企业品牌和企业 HR 部门构成第四个中心，通过 Qwikcilver 采购礼品卡和奖励基础设施，预算所有者来自营销和 HR；这是 Pine
              Labs Issuing and Acquiring Platform 内利润率最高的分部。
