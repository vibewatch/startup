      - number: '1.2'
        title: 管理层、董事会与治理姿态
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 为公开上市做准备时，治理画像发生了实质变化。招股书称公司没有可识别的 promoter，这很关键：尽调重心从创始人控制叙事，转向董事会、主要财务赞助方和执行层操盘手。文件披露 B.
              Amrish Rau 为董事长、董事总经理兼首席执行官；他在 PayU、Citrus、First Data、NCR 和更广义支付领域的经历，使这一任命对一家规模化金融科技平台具有战略一致性。Kush Mehra
              仍是重要的第二操盘手，担任执行董事、总裁，以及数字基础设施与交易平台首席商务官，负责战略合作和数字支付增长。招股书的董事会章节也显示出上市公司叠加层：Peak XV 提名董事 Shailendra Jit
              Singh，以及多名具备银行、技术和治理背景的独立董事。这对上市准备度方向上是正面信号，但公开材料对委员会动态、投票集团和非正式影响力的透明度，仍低于私有尽调室可提供的水平。
