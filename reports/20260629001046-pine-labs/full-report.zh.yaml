  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 线下 POS 与商户收单格局
        blocks:
          - type: paragraph
            body: >-
              根据 Economic Times 援引行业高管的报道，Pine Labs 拥有印度最大的独立 POS 终端装机基础，约 1.9 million 台。其 Hub 设备整合超过 100
              种支付方式，并支持无线软件升级，把硬件规模与正在增长的分析层结合起来。Mordor Intelligence 将 Pine Labs 列为印度 POS 终端市场头部公司之一，与 Paytm、Worldline
              India、Mswipe 和 Innoviti 并列；但在一个中度分散的市场里，没有任何公司拥有压倒性领先。

              Paytm（One 97 Communications）是 Pine Labs 在商户规模上最强的对手。Jefferies 2026 年 3 月报告称，Paytm 平台拥有 45 million 活跃商户和 13
              million 台已安装 Soundbox 设备，FY26 支付 GMV 估计为 INR 24 lakh crore，并预计以 23% CAGR 增长至 FY28 的 INR 35 lakh
              crore。Paytm 的 Soundbox 是用于 QR 支付确认的纯音频设备，功能上不同于完整银行卡 POS；其传统 POS 终端基础显著小于 Pine Labs 的 1.9 million
              台，但庞大商户网络让它在借贷和金融服务交叉销售上拥有更强触达。

              BharatPe（Resilient Innovations）在 FY25 业绩新闻稿中披露，截至当时在 450+ 个城市注册 1.7 crore（17 million）商户，拥有 125,000+ 台 POS
              机；POS 业务年处理 INR 27,000 crore，每月处理 450 million+ 笔 UPI 交易。BharatPe 的 POS 规模远低于 Pine Labs，收入主要来自 NBFC 借贷子公司
              Trillionloans，而不是收单。PhonePe 于 2025 年 10 月推出 SmartPOD，把 SmartSpeaker 和完整银行卡 POS 合入一台平价设备，支持
              Visa、Mastercard、RuPay 和 American Express；截至 2025 年 3 月，PhonePe 的商户网络覆盖印度 4.4 crore（44 million）个网点，为
              SmartPOD 铺开提供了强大分销。

              Innoviti Technologies 处于不同价格带，通过 Unipay 收入保障 SaaS 服务印度前 20 大零售企业中的 18 家。Innoviti FY25 收入为 INR 143
              crore（同比增长 35%），预计 2026 年 IPO。BillDesk 于 2026 年 2 月以约 $70 million 完成收购 Worldline India 支付业务，把 BillDesk
              的在线规模与 Worldline 的 Ingenico 终端网络结合起来，形成新的全渠道竞争者。根据 Mordor Intelligence，印度 POS 终端装机基础 2025 年为 37.08 billion
              台，2026 年将增至 41.27 billion 台，CAGR 为 11.3%。
