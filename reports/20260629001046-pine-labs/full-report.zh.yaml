      - number: '2.6'
        title: 规模测算缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >
              Pine Labs 可寻址分部的市场规模测算有三类不确定性，需要在尽调中明确处理。第一，公开估计差异明显。印度 2026 年 BNPL 市场介于 USD 30.45
              billion（ResearchAndMarkets）和 USD 37.03 billion（Mordor Intelligence）之间，差距 22%；背后是对银行主导的 credit-on-UPI
              产品、银行卡 EMI 流和独立 BNPL app 处理不一致。尚无分析师在单一范围边界下公开调和这些定义差异。类似地，POS 终端市场估计从 USD 1.2 billion（IHL Group，仅硬件）到 USD
              3.3 billion（纳入软件和服务的更宽市场研究）不等，差异接近三倍。


              第二，Pine Labs 并未在 IPO 文件中披露正式计算的 Serviceable Addressable Market。公司引用印度数字支付总额作为 TAM
              参照，但没有在子分部层面映射可服务市场。Redseer 为 DRHP 所做工作分别测算了 P2M 支付流和可负担支付分部，但跨分部 SAM
              综合并未公开——这让外部很难评估当前渗透率，或基础收单向全栈变现上售的现实路径。


              第三，BCG/PhonePe 2022 年关于 2026 年达到 USD 10 trillion
              的预测，显然高估了零售分部已实现的数字支付流。这说明，激进市场预测在作为估值输入前，必须先做严格范围调和。相互矛盾的数字应被保留为尽调缺口，而不是通过选择最乐观估计来“解决”。
            claimRefs:
              - CM026
              - CM036
              - CM041
              - CM042
      - number: '2.7'
        title: 图表
        blocks:
          - type: callout
            title: 零 MDR 从结构上把商户商业变现从单笔抽成推向软件和信贷
            body: >-
              UPI 不收商户折扣率，支付运营商无法在承载印度 85.5% 数字支付交易量的平台上赚取按金额计费收入。这改写了市场经济结构：可行变现必须把商户上移到软件订阅、信贷撮合、忠诚度和分析。Pine Labs
              的多产品模型正反映这一必要性——其 SaaS 与可负担支付收入流不是可选多元化，而是交易量占主导的零收入支付通道带来的结构性回应。
            calloutType: insight
            claimRefs:
              - CM021
              - CM012
              - CM040
          - type: callout
            title: 相互矛盾的规模估计掩盖真实 SAM 不透明度和估值风险
            body: >-
              与 Pine Labs 相关分部的公开市场估计差异明显：2026 年 BNPL 介于 USD 30.45B 至 USD 37.03B；POS 硬件估计介于 USD 1.2B 至 USD
              3.3B。尚无分析师在单一商户商业平台口径下，产出自下而上的 SAM 并调和这些分部。Pine Labs 也未在 IPO 文件中披露正式 SAM 数字。投资人若把包含机构流量、竞争产品和不可寻址支出的 TAM
              数字当成锚点，估值会被误导。
            calloutType: risk
