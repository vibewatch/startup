      - number: '4.2'
        title: 定价、GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              根据 FY26 Q2 股东信，Pine Labs 的变现横跨三种已披露定价机制：店内基础设施按每个数字收银点（DCP）每月收订阅费；VAS 和可负担支付交易按 GTV take-rate
              收费；金融科技基础设施服务按交易笔数收处理费。发卡与收单业务在预付和礼品卡交易量上赚取与 GTV 挂钩的 take rate。所审阅的交易所文件或股东沟通中，均未公开披露明确单价。


              用 FY26 合并收入（Rs 2,711 crore）除以平台 GTV（$194 billion，按 Rs 88 / 美元约为 Rs 17 lakh crore），可计算出约 0.16% 的隐含混合净 take
              rate。由于收入按扣除银行和网络代收代付后的净额确认，该数字低估了总商户折扣率（MDR）敞口，也远低于商户在销售点支付的 1–3% 总 MDR。公司把这一差距定位为变现空间：FY26 GTV 约增长
              50%，收入仅增长 19%，意味着交易量扩张快于收入捕获；这既可能是增长机会，也可能是结构性 take-rate 拖累。


              与订阅挂钩的 DCP 收入约占 FY26 Q3 合并收入的 27%；28% 的 DCP 基础产生增值服务收入，同比提升 7 个百分点，显示已安装商户基础上的交叉销售渗透正在加深。所有公开文件都没有 CAC
              和商户回本周期；管理层关于低企业客户流失的评论，是唯一可用代理指标。根据 DITP 收入和 DCP 数量，可计算出约 Rs 75 / 设备 / 月的隐含 DCP 订阅费，但实际合同费率未披露。
