      - number: '4.6'
        title: 财务结论、收入质量与尽调卡点
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的 FY26 业绩确实出现结构性拐点：首次实现全年合并盈利，审计意见为无保留；ESOP 拖累恢复常态后，经营杠杆释放，贡献利润率守在 75%，收入规模跨过 Rs 2,700
              crore。但质量层面有多重保留。第一，单体 PAT 为 Rs 149.88 crore，比合并 PAT Rs 112.51 crore 高 Rs 37
              crore，说明国际子公司整体拖累集团利润——公司未公开逐子公司对账。第二，FY26 headline OCF Rs 395 crore 包含 Q4 提前结算带来的时点贡献，估计金额 Rs 115–195
              crore；标准化 OCF 明显更低。第三，按当前 Rs 146 股价计算的 143–145x P/E，已经把持续强增长且几乎没有执行误差的预期计入价格。


              从几个维度看，收入质量处于中高水平：净额法确认较为保守，DCP 订阅费提供经常性基础，75% 贡献利润率符合优质 fintech SaaS 平台特征，FY24–FY26 轨迹显示经营杠杆真正落地。IAP
              分部（预付和礼品卡，占收入 32%）不确定性更高，原因是 GST 追缴未解决，breakage 规模也未披露。


              在给出强信念判断前，关键尽调卡点包括：Rs 347 crore GST 或有负债的结果；Qwikcilver 管理的 breakage 收入量化；单体与合并 PAT 按子公司的对账；剔除 Q4 时点项后的标准化
              OCF；以及分部层面毛利率，用于判断哪些收入流结构性增厚利润，哪些依赖交叉补贴。
            claimRefs:
              - CI036
              - CI037
              - CI038
              - CI039
              - CI040
      - number: '4.7'
        title: 附录
        blocks:
          - type: callout
            title: GST 或有负债超过当前利润三年
            body: >-
              已确认的 Rs 214.11 crore DGGI 追缴在 2025 年 2 月获维持，加上估计 Rs 95.57 crore 利息，以及 2026 年 2 月获维持的 Rs 37.33 crore
              Qwikcilver 追缴，合计约 Rs 347 crore——超过 FY26 合并 PAT Rs 113 crore 的三倍。考虑到公司有 Rs 1,274 crore
              现金，败诉不会威胁偿付能力，但会抹掉多年当前利润，并显著削弱 IPO 募资形成的现金库。公司未披露针对这些索赔计提准备。
            calloutType: risk
            claimRefs:
              - CI029
              - CI030
          - type: callout
            title: 净额收入确认让 Pine Labs 难以与总额收入同行直接比较
            body: >-
              Pine Labs 明确按扣除银行和卡组织转付后的净额确认收入，不同于部分按总交易流水报告的印度 fintech 同行。因此，其 FY26 收入 Rs 2,711 crore 以及隐含 0.16% 净 take
              rate，无法与总额收入报告方做同口径比较。如果不调整这一差异就套用全行业 P/S 倍数，会系统性高估总额收入同行，或在可比经营指标上低估 Pine Labs。
            calloutType: insight
            claimRefs:
              - CI006
              - CI008
          - type: callout
            title: FY26 OCF 被 Q4 提前结算时点显著抬高
            body: >-
              Q4 FY26 经营现金流为 Rs 676 crore（包括提前结算），超过全年披露 OCF Rs 395 crore；除非 Q1 至 Q3 合计经营现金流为负，否则算术上不可能成立。Q4
              激增来自客户结算回款加速，并非可重复时点项。标准化年度 OCF 估计为 Rs 200–280 crore，仍为正，但大约只有多数公开分析中 Pine Labs 现金生成画像所用 headline 数字的一半。
            calloutType: risk
            claimRefs:
