      - number: '8.2'
        title: 收入、盈利与现金流倍数分析
        blocks:
          - type: paragraph
            body: >
              按收入口径，Pine Labs 企业价值 Rs 10,595 crore 除以 FY26 合并收入 Rs 2,711 crore，得到 EV/revenue 3.91x——已接近 Windsor Drake
              2026 年 6 月 M&A 数据中支付处理公司 4–6x 区间的低端，略高于 Finro 416 家公司数据集给出的支付行业中位数 3.6x。若按 price-to-sales 并包含净现金，市值隐含 FY26
              收入 6.78x，反映内嵌现金价值。


              按盈利口径，GAAP 与调整后指标之间的差距带来较大解读风险。FY26 合并 PAT 为 Rs 112.51 crore，对应 trailing P/E 约 157x；GAAP EBITDA 为 Rs 364
              crore（包含 ESOP 成本正常化），对应 EV/EBITDA 29.15x。相比之下，管理层披露的 adjusted EBITDA 为 Rs 559 crore，剔除了 ESOP 和非现金费用，把
              EV/adj. EBITDA 降至 18.9x——与表观数字差异显著。IPO 后授予趋稳，ESOP 正常化应会持续，因此 adjusted EBITDA
              更适合作为盈利代理指标，但投资者必须审计调节表，不能直接把它视为 GAAP 等价物。


              单体与合并口径对比看，Pine Labs 单体 PAT 为 Rs 149.88 crore，比合并 PAT Rs 112.51 crore 高 Rs 37 crore，说明国际子公司在 PAT
              层面整体亏损。套用合并盈利倍数，已经计入国际拖累；若用 SOTP，把印度单体 DITP 收入（隐含约 Rs 1,437 crore）按更高软件倍数估值，会带来增量价值，但支持 SOTP
              的分部毛利率并未公开披露。PEG 比率为 0.68——基于未来三年 EPS 增长预测 87.82%——显著低于 1；若指引兑现，盈利增长足以支撑当前 forward multiple。正常化自由现金流 Rs
              157 crore（经营现金流 Rs 395 crore 减 capex Rs 238 crore）对应 P/FCF 117x；按 Q4 时点调整后的正常化 OCF Rs 200–280 crore，则
              P/OCF 更接近 66–92x。
