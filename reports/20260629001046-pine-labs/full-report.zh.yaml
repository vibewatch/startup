      - number: '8.7'
        title: 图表证据
        blocks:
          - type: callout
            title: 建议——以中等确信度跟踪
            body: >
              Pine Labs 是一家真正进入首个盈利年度的印度 fintech，交易倍数低于细分行业 EV/revenue 倍数。概率加权内在价值 Rs 207，意味着较 2026 年 6 月 Rs 160 价格有 30%
              上行；分析师一致目标价 Rs 205 也与我们的基准情景一致。但三项未决事项阻止「买入」建议：（1）Rs 347+ crore GST 或有负债超过当前 PAT 三年；（2）IAP
              分部沉淀收入规模不可验证；（3）FY26 Q4 OCF 受提前结算时点抬高。我们建议跟踪该股，并在 FY27 Q1 业绩（2026 年 7 月 28 日）确认增长轨迹、GST
              上诉时间线公开沟通后，再重新进入买入决策。若仓位规模反映高风险评级（尽调清除前不超过组合权重 2%），在 Rs 145–165 入场、持有 24 个月是合理的。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV021
              - CV022
              - CV023
              - CV024
              - CV033
          - type: callout
            title: 关键风险——GST 与沉淀收入制造未定价尾部风险
            body: >
              GST 或有负债（Rs 347+ crore）叠加不可验证的礼品卡沉淀收入敞口，构成当前估值尚未定价的尾部风险。按 Rs 160 股价和 Rs 113 crore 年度 PAT 计算，若 GST
              全额败诉，会抹掉三年以上利润。2026 年 4 月 RBI 关于未使用余额的 PPI Master Direction 草案仍在征求意见；若最终版本不利，IAP 分部（收入占比
              32%）需要大幅调整商业模式。若有利解决，这些风险可控；但在披露补充前，无法量化。若投资者给 GST 全额败诉情景赋予超过 30% 概率，应将其视为重大因素。
            calloutType: risk
            claimRefs:
              - CV024
              - CV033
              - CV032
          - type: callout
            title: 净现金底——当前水平有 42% 下行缓冲
            body: >
              Pine Labs 资产负债表有 Rs 7,785 crore 净现金（每股 Rs 67.80），相当于当前 Rs 160 市价的 42%。即便在熊市情景下，「运营业务」按 3x EV/revenue
              定价，每股也为 Rs 140——只略低于当前水平。内嵌现金垫是有意义的下行缓冲，但随着公司把募集资金投向技术资本开支、M&A（Shopflo Rs 88
              crore）和潜在未来收购，该缓冲会被消耗。净现金头寸强化了熊市底部在 Rs 120–140、而非更深困境情景的判断。
            calloutType: insight
            claimRefs:
              - CV003
              - CV027
              - CV023
