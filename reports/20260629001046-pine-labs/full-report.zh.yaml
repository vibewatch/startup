      - number: '8.5'
        title: 应压缩或扩张估值倍数的风险因素
        blocks:
          - type: paragraph
            body: >
              相比原始行业可比，若干结构性因素支持折价或溢价。折价侧：Rs 347+ crore 的 GST 或有负债（Rs 214 crore DGGI 要求，加 Rs 37 crore Qwikcilver
              相关要求，再加估算利息 Rs 96 crore）超过当前合并 PAT 三年，是最大且尚未定价的尾部风险。即便 Pine Labs 最终在 CESTAT 胜诉，12–18%
              的年化利息累积也让拖延本身变得昂贵。倍数分析应按概率权重调整该负债：若败诉概率 50%，NAV 减少 Rs 174 crore；若 100%，减少 Rs 347 crore。礼品卡沉淀收入争议进一步增加 IAP
              分部倍数不确定性；Entrackr 2026 年 6 月报道称，RBI 针对未使用 PPI 余额的草案规则可能消除沉淀收入。Pine Labs 的交易所否认声明称沉淀收入归品牌伙伴所有，从未进入其 P&L；但
              Qwikcilver 沉淀收入规模未披露，外部无法独立验证，使 IAP 分部在当前披露水平下几乎无法审计该风险。


              剔除 FY26 Q4 的 Rs 676 crore 单季 OCF（其中包括估算 Rs 115–195 crore 的提前结算时点项目）后，正常化 OCF 每年约 Rs 200–280 crore。若投资者使用表观
              Rs 395 crore OCF，按现金流口径可能多付约 1.5–2x。


              溢价侧：Rs 7,785 crore 净现金为资产负债表提供缓冲，21% adjusted EBITDA margin 高于多数全球 POS 硬件同业，FY26 收入 CAGR 为 19%，也优于
              Worldline 的下滑。软件 / VAS 转型（DCP 基数中 28% 贡献 VAS 收入，同比提升 7 个百分点）支持倍数随时间扩张。印度市场增长轨迹也可支撑剩余溢价（行业层面 UPI 交易量同比增长
              21%，Pine Labs DCP 基数超过 2M 个触点）。综合看，风险调整后的公允价值约为 4.5–5.5x EV/FY27 revenue，对应每股 Rs 192–227，尚未扣除执行风险折价。
            claimRefs:
              - CV024
              - CV033
              - CV025
              - CV006
              - CV007
