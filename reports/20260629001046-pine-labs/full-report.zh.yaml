      - number: '2.2'
        title: 市场规模：多重视角
        blocks:
          - type: paragraph
            body: >
              印度商户商业市场很难用单一数字概括，因为 Pine Labs 同时参与四个不同分部，而每个分部都被单独衡量。最宽的口径——印度数字支付总额——在 FY2025 达到约 INR 117 lakh crore（USD
              1.4 trillion），并根据 Pine Labs DRHP 引用的 Redseer 模型，预计到 FY2029 达到 INR 276 lakh crore（约 USD 3.3 trillion）。这个
              TAM 夸大了可服务池，因为它纳入了 Pine Labs 产品范围之外的机构转账和 P2P 流量。


              分部估算提供了校准后的视角。根据 IHL Group，印度 POS 终端硬件市场 2025 年为 USD 1.2 billion，预计 2030 年达到 USD 2.0 billion，CAGR 为
              10.3%；该机构把印度列为全球增长最快的 POS 市场。与 Pine Labs 的 Plural 在线平台相关的印度支付网关市场，Mordor Intelligence 估计 2025 年为 USD 2.07
              billion，2026 年将达 USD 2.31 billion，并以 11.66% CAGR 增长至 2031 年 USD 4.01 billion；MarkNtel Advisors 以 9.69%
              CAGR 给出相近数字。根据 Mordor Intelligence，印度礼品卡和激励卡市场 2025 年达到 USD 12.65 billion，预计 2026 年增至 USD 13.65
              billion，2030 年达到 USD 20.71 billion，CAGR 为 8.70%，其中企业项目贡献 61% 的价值。


              印度 BNPL 与结账信贷市场在 2026 年估计为 USD 30.45 billion（ResearchAndMarkets，15.5% CAGR 增至 2031 年 USD 62.61 billion），但
              Mordor Intelligence 对同一年给出 USD 37.03 billion——22% 的差异反映了嵌入式信贷工具范围定义不同。FY25，Pine Labs 处理 INR 11.4 lakh
              crore（约 USD 136 billion）GTV，覆盖 5.7 billion 笔交易；FY26 报告首次实现全年盈利，运营收入为 INR 2,710 crore。
