      - number: '3.7'
        title: 图表
        blocks:
          - type: callout
            title: RBI Breakage 监管威胁 Qwikcilver 高利润率收入流
            body: >-
              RBI 2026 年 4 月 Prepaid Payment Instruments 主指引草案拟要求发行方在到期时向客户退还未使用余额，实质上消除 breakage
              收入——这是一条几乎零成本、基本直接流向利润的收入流。消息人士估计，breakage 占 Qwikcilver 礼品卡收入 5–6%。Pine Labs 尚未公开量化这一敞口。如果草案按当前形式实施，考虑到
              breakage 异常高的利润率，对公司首次全年盈利（FY26 净利润 INR 113 crore）的影响可能不成比例。所审阅的分析师研究均未建模这一情景。
            calloutType: risk
            claimRefs:
              - CP026
              - CP027
          - type: callout
            title: QR 码扩散为小商户 POS 经济性设置结构性天花板
            body: >-
              截至 2025 年 2 月，印度已部署 352 million 个 UPI QR 码，而 POS 终端仅 8.9 million 台；QR 贴纸对商户几乎没有成本。在 UPI 零 MDR 下，POS
              租金经济性只有在银行卡收单带来增量客单价或由商户类型要求时才成立。PhonePe 的 SmartPOD 现在以接近 Paytm Soundbox 成本曲线的形态提供银行卡收单，压缩了 Pine Labs
              在小商户分部上售硬件的空间。这一结构动态将迫使 Pine Labs 从软件、EMI 和数据层提取更多价值——而这些分部都有资源充足的竞争者。
            calloutType: risk
            claimRefs:
              - CP029
              - CP035
          - type: callout
            title: 硬件-软件集成和多银行 EMI 构成耐久的中端市场优势
            body: >-
              Pine Labs 最可防守的位置，是有组织中端零售：银行卡交易量足以支撑 POS 租金，结账 EMI 推动转化，HR、库存和分析的软件集成制造运营切换成本。1.9 million 台已安装终端和 5–6
              年设备生命周期，意味着该分部商户切换成本很高。覆盖 20+ 家银行合作伙伴的多银行 EMI 提供了顺滑的可负担支付产品，银行原生 EMI 项目无法同时跨所有放款方复制；在这一窗口内，Pine Labs
              因而能在高客单可选零售中扮演有意义角色。
            calloutType: strength
            claimRefs:
              - CP001
              - CP032
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、结构与确认基础
        blocks:
          - type: paragraph
            body: >
              Pine Labs 报告 FY26 合并运营收入为 Rs 2,711 crore，较 FY25 的 Rs 2,274 crore 同比增长 19%；FY25 本身较 FY24 的 Rs 1,769 crore
              增长 28.5%。收入来自两个可报告分部。Digital Infrastructure and Transaction Platform（DITP）分部覆盖店内和在线支付收单、增值服务、可负担 EMI
              基础设施，以及包括 BBPS、UPI switch 和账户聚合在内的金融科技 API 服务，贡献 Rs 1,836.82 crore，约占 FY26 合并收入 68%。Issuing and Acquiring
              Platform（IAP）分部覆盖预付礼品卡、通过 Qwikcilver 管理的联名项目，以及面向银行的嵌入式发卡，贡献 Rs 873.77 crore，占 32%；FY26 Q3 同比增长 42%，高于
              DITP 的 16%，是增长更快的分部。


              FY26 Q2 股东信披露了一项重要会计政策：Pine Labs 按净额确认收入，先剔除支付给收单银行和卡组织的支付处理费与代收代付费用，再确认收入。这与部分印度金融科技同业报告总交易流量不同，也使它们相对
              Pine Labs 的表观收入规模被放大。FY26 单体收入为 Rs 1,926.09 crore，比合并数字低 Rs 785 crore；单体 PAT 为 Rs 149.88 crore，高于合并 PAT 的
              Rs 112.51 crore，说明国际子公司拖低集团盈利能力。


              FY26 国际收入超过 Rs 403 crore，约占合并收入 15%，高于三年前的 9%；报道的三年 CAGR 为 44%。东南亚和中东扩张推动了这一增长，国际动能也被列为 FY26 Q4
              收入的关键驱动。收入增长从 FY25 的同比 28.5% 放缓至 FY26 的 19%，并在 FY26 Q4 进一步放缓至 17%；这一趋势值得观察，以区分结构性因素和季节性因素。
