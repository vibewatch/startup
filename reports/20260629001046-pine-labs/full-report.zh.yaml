      - number: '8.6'
        title: 建议、确信度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              建议：以中等确信度跟踪，投资期 12–18 个月。风险调整后的概率加权内在价值为每股 Rs 207，较当前 Rs 160 约有 30%
              上行；在风险更干净的环境中，这足以支持「买入」。但三项条件阻止高确信度：（1）Rs 347+ crore GST 负债未决，上诉时间线不清；（2）Qwikcilver 管理的沉淀收入规模不可验证，因此无法确认公司
              2026 年 6 月 16 日的否认声明；（3）Q4 OCF 存在时点扭曲，需要再看两个正常化季度 OCF 数据，才能验证真实现金生成能力。我们给当前价格的估值立场为「偏紧」；若这些风险清除，公允价值区间将移至
              Rs 200–230，立场可上调至「合理」。


              八名分析师覆盖该股，一致评级为「强烈买入」；分析师平均目标价 Rs 205.75，与我们的基准概率加权价值一致。JP Morgan 给出「持有」（目标 Rs 155），Jefferies 将目标价从 Rs 260
              下调至 Rs 185，都是可信的偏空数据点，反映的正是上文识别的尽调缺口。PEG 比率 0.68（未来三年 EPS CAGR 预测
              87.82%）按增长调整后具备吸引力，也说明不能把该股简单归为纯粹昂贵。核心投资逻辑押注两件事：ESOP 正常化释放经营杠杆（Rs 114.79 crore ESOP 拖累到 FY27E 退出 P&L），以及
              VAS / affordability 收入结构改善；两者都在管理层可控范围内，且已有早期证据。若 GST 风险可量化、沉淀收入争议能正式解决，最好通过独立审计披露确认，那么在 Rs 145–165
              区间（当前水平）建仓并持有 24 个月是合理的。
            claimRefs:
              - CV010
              - CV011
              - CV039
              - CV036
              - CV005
