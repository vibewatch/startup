      - number: '4.4'
        title: 资本充足性、IPO 募资与融资结构
        blocks:
          - type: paragraph
            body: >
              Pine Labs 于 2025 年 11 月完成 IPO，总募资 Rs 3,899.91 crore：其中 Rs 2,080 crore 来自每股 Rs 221 的新股发行，Rs 1,819.91 crore
              来自 Peak XV、Temasek、PayPal、Mastercard 等既有投资者的出售要约。股票于 2025 年 11 月 14 日以 Rs 242 上市，较发行价溢价 9.5%；但到 2026 年 6
              月下旬已跌至约 Rs 146–152，较 IPO 价格低约 34%，较上市后 Rs 283 的高点低约 45%。按 Rs 146 计算，隐含市值约 Rs 16,842 crore；基于 FY26 合并净利润 Rs
              113 crore，过去十二个月 P/E 约为 143–145x。


              在 Rs 2,080 crore 新股募资中，Rs 532 crore 用于偿还债务，Rs 760 crore 用于技术和云基础设施，剩余资金用于国际扩张、营运资金和一般公司用途。截至 2026 年 5 月 Q4
              FY26 业绩公告，约 Rs 797 crore 募资已投入使用，主要用于降债。2026 年 3 月 31 日，现金及现金等价物达到 Rs 1,273.9 crore，高于一年前的 Rs 245.2
              crore；按当前消耗速度，可覆盖约 24 个月运营。2026 年 4 月，Pine Labs 签署协议，以 Rs 88 crore 收购 Shopflo Technologies（D2C 结账平台），继续动用
              IPO 资金。FY26 单体口径仍有 Rs 70.39 crore 利息费用，确认部分偿债后仍有借款未偿。
