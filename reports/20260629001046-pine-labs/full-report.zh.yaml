      - number: '6.3'
        title: 采用与规模轨迹
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的采用指标显示，FY26 核心运营杠杆均保持两位数增长。商户数同比增长 14% 至 110 万；数字结账点（合并硬件 PoS 终端、Android 智能设备和纯软件结账集成）达到 203
              万，同比增长 11%。两项指标增速都略低于 FY26 总收入增速（+17–19%），说明故事更像每个商户附加产品持续加深，而不是纯粹的客户数扩张。FY26 总交易额达到 $194 billion，同比增长
              50%；这既反映商户数增长，也反映 EMI、BNPL 和 UPI 交易量放大后，单商户站点交易强度上升。


              预付和品牌分部有自己的采用代理指标：FY26 发行 86.5 crore 张预付卡，高于 FY25 的 71 crore 张，增长 22%，说明企业品牌项目采用上升，即便礼品卡 breakage
              收入周边监管环境受到审视。Shopflo 收购把可服务客户宇宙扩展到 D2C 电商，一笔交易带来 1,000 多个品牌和 6,000 万客户交易历史。


              按收入百分比看，国际业务是增长最快的分部：FY26 国际收入 ₹403 crore，约占总收入 15%，公司称运营已覆盖 22 个国家。菲律宾 GCash 合作（2026 年 5 月）瞄准 600 万 MSME
              商户；到 2026 年 4 月，公司宣布将在西亚、非洲和东南亚九个国际市场推出稳定币支持预付卡。重要的是，这些指标都没有披露按 cohort 的留存，或经验证活跃商户与已注册但休眠商户的占比；headline
              数字是总注册口径。
