      - number: '1.4'
        title: 里程碑、扩张与反向信号
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年的里程碑流显示，Pine Labs 的产品和地域动能真实存在，但并非一条无风险上行线。公司借助官方媒体渠道和交易所披露强化扩张叙事：通过 GCash for Business 进入菲律宾，与
              UAE 的 Wio Bank 建立商户收单合作，围绕 agentic commerce 与 OpenAI 合作，并推出 P3P，将其包装为印度首个运行在 UPI 上的 agentic payment
              protocol。年度业绩稿还称，FY26 国际收入超过 Rs 400 crore，接近总收入 15%，而三年前约为 9%。这些信号表明，公司正从印度 POS 根基向软件驱动、国际化和 AI
              色彩更强的商户基础设施推进。与此同时，公开风险文件也相当实质：RBI 2026 年 3 月因预付支付工具 KYC 缺陷处罚 Pine Labs；Moneycontrol 报道 IPO 披露中有约 Rs 310
              crore 的 GST 敞口；招股书本身还列出规模更大的 GST 说明原因通知要求以及其他诉讼。因此，Pine Labs 已具规模且战略动作活跃，但尽调姿态仍应紧盯合规执行与盈利质量。
