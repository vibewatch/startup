      - number: '5.6'
        title: 信任、安全与监管合规
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的安全态势由支付基础设施上的 PCI DSS 合规，以及 Plutus 终端的专用硬件安全支撑；该终端具备 PCI PTS 6.x SRED 认证和 EMV Level 1、Level 2
              批准。Plural 网关运行在 PA DSS v3.2 和 VISA PIN 认证之下（PCI PIN v2.0，含 KIF 与 RKI 密钥管理）。Pine Labs 宣传其在线平台的 card-on-file
              存储实现 100% RBI tokenization 合规。截至 2025 年 11 月，Pine Labs 成为首家同时持有三类 RBI payment aggregator 牌照的印度
              fintech——线下商户支付、线上商户支付和跨境支付处理——在 2025 年 11 月 IPO 上市前强化了监管地位。尽管有这套框架，RBI 仍在 2026 年 3 月对 Pine Labs 处以 3.1
              lakh rupee 罚款；此前覆盖 2024 年 7 月至 2025 年 5 月的法定检查发现，公司在未完成客户 KYC 手续的情况下发行 full-KYC 预付工具。RBI
              澄清，罚款不影响既有客户交易的有效性，但凸显 PPI 合规风险仍在。2026 年 4 月 RBI 关于礼品卡未使用余额返还的草案监管，带来的是前瞻性商业模式风险，不同于当前合规违规。
