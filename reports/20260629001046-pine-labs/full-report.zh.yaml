      - number: '6.2'
        title: 具名客户证明：银行、品牌与企业部署
        blocks:
          - type: paragraph
            body: >
              Pine Labs 披露的具名客户可分为三档证据质量。最高质量证明来自品牌层面的 Qwikcilver 部署：Amazon India、Flipkart、Myntra 和 Croma
              在公司新闻稿和分析师材料中被明确列为礼品卡与预付解决方案部门的活跃企业客户。这些是每天持续交易的生产关系，Qwikcilver 估计约 30% 的合并收入贡献也确认了企业品牌参与的实质性。Pine Labs
              声称通过 Qwikcilver 持有印度有组织礼品卡市场约 90% 份额，这进一步证明企业品牌采用已经根深蒂固。


              第二档证据覆盖有新闻稿日期确认的银行和金融机构合作：Wio Bank（UAE，Credit+ 收单平台，2026 年 1 月）、Karnataka Bank（India，面向零售 / MSME 分支网络的高级
              PoS，2026 年 4 月）以及 Pan Asia Bank（Sri Lanka，Credit+ 云原生发卡与处理）。这些公告确认合作关系在启动时已签约，但未披露各伙伴对应的运营量、商户吞吐或年度经常性收入。


              第三档也是最弱证据，是 Pine Labs 股东信和投资者演示中称其在印度“支撑 top 5 banks、top 5 retailers、top 3 petroleum companies、top 3
              e-commerce / quick-commerce companies”。这一营销表述在多份申报文件和 BSE
              演示中重复出现，但没有任何具名第三方披露佐证。尽调必须把它视为未验证，直到具体交易对手名称得到确认。GCash 合作（菲律宾，2026 年 5 月）增加了一个渠道中介证明点：它显示 Pine Labs
              基础设施可以支撑 MSME 商户的大规模采用，但直接商业关系在 GCash，而不是单个终端商户。
