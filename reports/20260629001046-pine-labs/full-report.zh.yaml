      - number: '6.4'
        title: 留存、韧性与切换成本
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Pine Labs 未在任何公开申报或投资者沟通中披露净收入留存（NRR）、总收入留存（GRR）、cohort
              层面流失率或商户生命周期价值。因此，留存分析只能依赖结构性切换成本证据和面向消费者的代理指标。企业留存的主要驱动是平台集成深度：Pine Labs 通过单一设备或 API endpoint 聚合 200
              多家银行和 NBFC 的 EMI 项目，免去商户逐一维护银行关系。对多网点零售商或酒店连锁而言，替换 Pine Labs 意味着要与每家银行伙伴重新谈判，重新部署 ERP 会计连接（包括 EMI 补贴对账、GST
              处理和 MDR 报告），并推出替代硬件——这一过程会带来数月运营中断和可观资本成本。


              SMB 商户切换壁垒更低。Paytm、PhonePe 和 BharatPe 等竞争对手提供基础功能相近的 PoS 产品，在部分配置中结算更快，并主动瞄准 Pine Labs 低利润率商户基础。深度 ERP
              和多银行 EMI 集成通常不会部署到单店 SMB 层面，降低了退出摩擦。


              面向消费者的证据好坏参半：G2 评论显示 4.3/5 满意度（样本小且不具代表性），但 Comparably 汇总数据显示 NPS 为 -7，说明商户贬损者占比不低。Indian Consumer
              Complaints Forum 有 SMB 商户的活跃投诉，内容包括 PoS 取消后账单异常、停用后仍收费、解决速度慢；这与高退出摩擦落在最具流动性的商户群体上相一致。对使用 Qwikcilver
              的企业品牌而言，粘性来自替换礼品卡管理平台的复杂度：发行、兑付、对账和面向品牌的 API 层都必须重建，形成独立于合同期限的多年切换成本。
