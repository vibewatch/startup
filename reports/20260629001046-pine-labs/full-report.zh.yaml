  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与税务风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 受印度储备银行（RBI）、印度证券交易委员会（SEBI）和邦级 GST 机关多层监管，上市后生命周期内合规负担会持续存在。2026 年 3 月，RBI 因 Pine Labs
              在未完成所有持有人强制 KYC 验证的情况下发行 Full-KYC Prepaid Payment Instruments（PPI），对其处以 Rs 3.10 lakh 罚款；该缺失来自覆盖 2024 年 7
              月至 2025 年 5 月的法定检查。罚款金额虽不具财务重要性，但释放出监管层仍在审视 Pine Labs PPI 业务和大规模 KYC 流程的信号。更关键的是，Pine Labs 在 DRHP 中披露的 GST
              总暴露超过 Rs 310 crore。最大组成部分 Rs 214.11 crore，于 2025 年 2 月由 Bengaluru 一名 Joint Commissioner 的命令确认，源于 2017 年 7
              月至 2024 年 3 月期间，公司涉嫌错误享受联名、电商 marketplace 费用和广告费用上的进项税抵扣。2026 年 2 月，公司上诉被驳回后，另一笔与 Qwikcilver FY20 负债相关的 Rs
              37.33 crore GST 追缴发出；公司现正上诉至 CESTAT。截至 2024 年 12 月，GST 事项的估计利息负债合计 Rs 95.57 crore。所得税方面，Pine Labs 就
              2019-20 和 2021-22 评税年度的重新评税通知（根据 Income Tax Act 第 148 和 148A 条发出），于 2025 年 10 月向 Delhi High Court 提起 writ
              petitions。结果仍未决；若裁决不利，将把额外直接税负债坐实。RBI 于 2026 年 4 月发布 PPI Draft Master Direction 征求公众意见，其中一项规定要求把过期或不活跃 PPI
              的未偿余额转入 Depositor Education and Awareness（DEA）Fund，而不是允许发行方确认为 breakage 收入。Pine Labs 的 DRHP
              本身承认，未使用预付卡余额产生的 breakage income 是一条会计收入线，尽管其 CFO 公开表示，合作品牌发行的联名礼品卡没有任何 breakage 收入归公司。Entrackr
              调查估计，Qwikcilver 的 breakage 占其 Rs 700 crore 礼品卡收入的 5–6%；如果 RBI
              指令按当前形式最终落地，这条高毛利收入流将被消灭，由于相关成本接近零，对盈利的拖累会不成比例。监管方向——强制返还未花掉的 PPI 余额——已经明确，Pine Labs 未向投资者公开量化精确影响。
