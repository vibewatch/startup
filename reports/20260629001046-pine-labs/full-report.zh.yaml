companyProfile:
  summary: >-
    Pine Labs 是一家印度商户商业基础设施公司，把线下 POS 收单、在线网关服务、预付和礼品卡基础设施、分期 / EMI 支付通道，以及商户软件整合进一个多通道平台。公司成立于 1998 年，目前注册办公室在
    Gurugram、公司办公室在 Noida；在多年重度融资的私有金融科技公司阶段之后，于 2025 年进入公开市场。在董事长、董事总经理兼 CEO B. Amrish Rau 领导下，Pine Labs
    已从银行卡终端拓展到软件驱动的支付基础设施、国际商户收单合作，以及较新的 AI 相关支付项目；但合规、诉讼和披露风险仍然显著。
