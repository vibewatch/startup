  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的商户商业平台横跨四个相互连接的市场分部，它们共同构成公司的总可寻址市场边界。线下商户收单覆盖实体 POS 终端和 kirana 式 QR 端点上的银行卡、UPI 和 QR
              支付，这些端点部署在印度有组织和半组织零售版图中。在线支付处理覆盖电商结账、D2C API 支付，以及通过 Pine Labs 的 Plural 网关进行的全渠道对账。预付和礼品卡发行覆盖通过
              Qwikcilver 平台管理的闭环、半闭环和联名企业礼品项目。结账信贷与可负担支付涵盖购买点集成的 EMI 促成、先买后付产品和 BNPL 通道。


              第五层是商户软件和分析，包括 GST 开票、库存管理和忠诚度；它在核心支付基础设施之上产生 SaaS 订阅收入。市场边界不包括消费者之间汇款、RTGS/NEFT
              机构转账、存款银行业务，以及结账场景之外的通用消费者借贷。相邻市场包括营运资金信贷、销售点保险和跨境结算，但这些延伸需要不同的监管批准。地域上，印度是主要收入基地；东南亚（Malaysia、Singapore、Thailand）和中东（UAE、GCC
              国家）是正在扩张的国际相邻市场。现状替代方案包括银行单独提供的 POS 终端、基础 UPI QR 贴纸部署、以现金或支票支付的手工企业奖励项目，以及基于 Excel 或 WhatsApp 的商户记账。
