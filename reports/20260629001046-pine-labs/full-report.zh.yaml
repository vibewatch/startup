  - id: FR001
    title: 风险热力图 – 可能性与影响
    type: matrix
    layout: wide
    summary: |
      Pine Labs 的主要风险落在 4×4「发生概率 × 影响」矩阵上；「重大影响、高发生概率」象限就是打穿投资逻辑的风险。
    data:
      columns:
        - 低发生概率
        - 中等发生概率
        - 高发生概率
        - 极高发生概率
      rows:
        - label: 重大影响
          values:
            - null
            - GST 不利裁定（Rs 310 Cr+）
            - RBI PPI 指令——取消沉淀收入
            - null
        - label: 高影响
          values:
            - PCI DSS 合规违规
            - 竞争挤出（Razorpay / PhonePe）
            - 投资者锁定期到期后的抛售压力
            - 零 MDR 延续（未恢复）
        - label: 中等影响
          values:
            - ESOP 断崖引发人才流失
            - 国际化执行不及预期
            - Mastercard 战略转向
            - Qwikcilver 锚定品牌流失
        - label: 低影响
          values:
            - 反向迁册遗留治理
            - 中东收入疲软
            - null
            - null
    approximationNotes: 发生概率和影响评级是定性判断；并非基于 Pine Labs 已披露的风险管理输出。
    claimRefs:
      - CR004
      - CR008
      - CR014
      - CR023
      - CR029
