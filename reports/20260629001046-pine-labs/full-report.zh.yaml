      - number: '5.5'
        title: AI、Agentic Commerce 与 P3P 协议
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的 AI 战略沿两条活跃线推进：内部工作流自动化，以及外部化的 agentic 支付基础设施。内部方面，Pine Labs 用 AI
              自动化日常结算对账，把处理时间从过去需要数十名员工手工检查的数小时压缩到数分钟；CEO Amrish Rau 2026 年 2 月向 TechCrunch 作了这一描述。2026 年 2 月，Pine Labs
              宣布与 OpenAI 合作，把 OpenAI API 嵌入其支付和商户技术栈，初期面向 B2B 工作流：发票处理、结算和支付编排。公司计划把该平台开放给第三方开发者，作为 agentic 开发者栈。2026 年
              6 月，Pine Labs 推出 P3P（Pine Labs Payment Protocol），这是印度首个已规模化运行的 agentic UPI 支付协议。P3P 允许 AI agent 在用户一次性预先授权
              UPI mandate 后，代用户浏览、选择并付款。它锚定 UPI 既有 Single Block Multiple Debit 框架（品牌名 UPI ReservePay）和 One Time Mandate
              框架。Grantex 层提供可验证 agent 身份、委托授权、支出控制和完整审计轨迹。HTTP 402 为 agent-to-agent 支付请求提供机器可读开放标准。Gullak（数字黄金储蓄平台）是 P3P
              首个上线商户；Vijay Sales（电子产品零售商）处于概念验证阶段。P3P 目前仅在 UPI ReservePay 上线；银行卡、网银、钱包、EMI 和稳定币仍在路线图中。Medianama
              已指出未解决的责任和隐私问题：NPCI 或 RBI 尚未发布指引，说明当 AI agent 超出授权或被攻破时，谁承担责任。
            claimRefs:
