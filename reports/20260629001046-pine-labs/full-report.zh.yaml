  - id: FU003
    title: 客户证明质量矩阵：按具名客户划分的证据深度
    type: matrix
    layout: wide
    summary: 将每个具名客户或伙伴映射到四个证据质量维度——生产环境确认、结果具体度、留存数据可得性和收入披露——凸显 Pine Labs 客户证明基础中仍存在的证据缺口。
