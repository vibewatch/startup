      - number: '5.2'
        title: 店内支付——Plutus Smart POS
        blocks:
          - type: paragraph
            body: >
              Plutus Smart（也称 APOS、Android POS）是一台基于 Android 的智能交易终端，运行 Pine Labs 的 Plutus 中间件。它支持信用卡、借记卡的 NFC /
              contactless、芯片和磁条交易，也支持 UPI / Bharat QR、移动钱包、EMI 和礼品卡。第三方收银应用通过 Android Messenger-over-Bound-Service IPC
              模式与 Plutus 集成：收银应用绑定到 Plutus 服务，交换 IBinder 引用，并发送 Message 对象来调用支付、打印和批量结算功能。该架构让收银、零售、餐饮软件供应商可以嵌入 Pine
              Labs 支付受理，而不进入 PCI 范围，因为持卡人数据不会进入收银应用。设备更新和故障排查通过云管理仪表盘处理。终端硬件具备 PCI PTS 6.x SRED 认证，以及 EMV Level 1 和
              Level 2 批准，可接入 Visa、Mastercard、RuPay 和 Amex 网络。softPOS 版本可在普通商户 Android 手机上运行 Plutus 应用，不需要专用硬件即可扩大部署；但
              softPOS 与专用 Plutus 终端的对比性能指标尚未由独立方基准测试。
            claimRefs:
              - CE002
              - CE003
              - CE024
