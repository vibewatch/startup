  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 案件 / 牌照
      - 管辖区
      - 状态
      - 不利结果可能性
      - 严重性
      - 缓释措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - GST 进项税抵扣被拒 – Rs 214.11 Cr（DGGI 命令，FY2017-24）
        - 印度 – Bengaluru / Mumbai
        - Joint Commissioner 命令于 2025 年 2 月被维持；正向 GST Appellate Authority 上诉
        - 中等 – 存在推翻理由；先例不一
        - 致命 – 超过 FY26 净利润 2 倍
        - 法律挑战；继续与 GST Appellate Authority 沟通
        - 若败诉，Rs 214.11 Cr 本金 + Rs 95.57 Cr 估算利息
        - 核验当前上诉听证日程；取得独立 GST 律师意见
      - - GST 追缴 – Qwikcilver FY20（Rs 37.33 Cr）
        - 印度 – Bengaluru
        - 上诉被驳回；准备提交 CESTAT
        - 中等 – Qwikcilver 合并让责任追溯更复杂
        - 高 – 并购后新增历史敞口
        - CESTAT 上诉待决；GSTIN 对账
        - Rs 37.33 Cr（Rs 14.89 Cr GST + Rs 20.9 Cr 利息 + Rs 1.48 Cr 罚金）
        - 跟踪 CESTAT 时间线；确认 Qwikcilver 账簿是否已完全整合
      - - 所得税重新评估 – AY 2019-20 和 AY 2021-22（Sec 148/148A）
        - 印度 – Delhi High Court
        - 2025 年 10 月提交令状申请；程序仍在进行
        - 低至中等 – High Court 挑战可能成功；金额未披露
        - 高 – 金额未披露；或有事项
        - 法律代理；向 Delhi High Court 提交令状挑战重新评估
        - 未披露或有负债；带来审计和披露不确定性
        - 从 Delhi HC 程序取得命令副本；依据 DRHP 注释评估金额
      - - RBI PPI KYC 违规罚款（2026 年 3 月）
        - 印度 – RBI
        - 已支付 Rs 3.10 lakh 罚款；检查期为 2024 年 7 月至 2025 年 5 月
        - 低 – 单次合规疏漏；罚款已缴
        - 低 – 财务影响不重大；声誉信号
        - KYC 整改；加强 PPI 合规控制
        - 若重复发生，会形成声誉风险；也显示 RBI 仍在持续审查
        - 审计 PPI 组合的 KYC 完成率；核验整改状态
      - - RBI 关于 PPI 的 Master Direction 草案 – breakage 收入消除风险
        - 印度 – RBI（草案，征求意见中）
        - 2026 年 4 月发布；公众意见期于 2026 年 5 月 22 日结束；最终指引待发布
        - 高 – 监管方向明确指向将未使用余额转入 DEA Fund
        - 高 – 消除高利润率 breakage 收入流
        - 将 Qwikcilver 收入多元化至 breakage 之外；参与 RBI 征求意见流程
        - 若取消，约占 Qwikcilver Rs 700 Cr 礼品卡收入 5-6%（约 Rs 35-42 Cr）
        - 监测 RBI 最终指引发布；按 5% breakage 消除情景测算 P&L 影响
      - - SEBI 上市公司合规义务（2025 年 11 月 IPO 后）
        - 印度 – SEBI / NSE / BSE
        - 有效；季度披露义务、内幕交易窗口、关联方报告
        - 低 – 专业管理层；未见关联方红旗
        - 中等 – 合规体系仍在成熟
        - 扩充合规团队；Big-4 审计覆盖
        - 快速增长期若披露存在缺口，可能引发 SEBI 询问风险
        - 审查内幕交易政策、披露框架和季度业绩流程
    notes: 各行按严重性排序。GST 和所得税金额是 DRHP 中的或有负债；最终责任取决于上诉结果。RBI 草案指引金额基于 Entrackr 调查估算；Pine Labs 未公开量化 breakage。
