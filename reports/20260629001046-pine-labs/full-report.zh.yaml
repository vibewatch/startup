          - type: callout
            title: 印度是全球增长最快的 POS 市场，商户基础仍结构性低渗透
            body: >-
              IHL Group 将印度列为全球增长最快的 POS 终端市场，CAGR 为 10.3%，到 2030 年达到 USD 2B。印度拥有全球 18% 的消费者，且有 50 多个人口超过 1M
              的城市，商户基础庞大，仍以未数字化为主。UPI 在支付交易量中占 85.5%，为 Pine Labs 提供了可叠加信贷、分析和忠诚度的数字交易轨迹——终端硬件之外的价值创造机会因此被放大。
