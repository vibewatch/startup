  - id: TV005
    title: 打破投资逻辑与止损触发器
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - GST 负债全额落地
        - CESTAT 裁定维持 Rs 214+ crore DGGI 追缴；总敞口超过 Rs 347 crore
        - Rs 347 crore 现金流出让净现金缓冲减少 4.5%；对 PAT 的侵蚀超过 3 个 FY26 年度利润
        - 下调至回避；用更低净现金和更高监管风险溢价重跑估值
      - - FY27 收入低于指引超过 5%
        - FY27 Q1 或 Q2 按运行率低于 Rs 800 crore；指引撤回或收窄
        - 估值倍数从 5x 压缩至 3–3.5x；熊市情景变成基准情景；分析师下调目标价
        - 退出或减仓；等一个完整干净季度后再评估
      - - RBI PPI 监管对 breakage 作出不利裁定
        - 2026 年 4 月 Master Direction 草案定稿，要求返还未使用 PPI 余额；直接冲击 IAP
        - IAP 分部（收入 32%，Rs 874 crore）收入 / 利润率受冲击；礼品卡 breakage 收入消失
        - 分部全面重估；IAP 倍数降至 1.5x EV/revenue；SOTP 损失 Rs 2,000–3,000 crore EV
      - - 正常化 OCF 连续两个季度低于 Rs 150 crore
        - FY27 H1 经营现金流合计低于 Rs 300 crore；说明 FY26 Q4 时点问题是结构性，而非一次性时点
        - 熊市 OCF 假设得到确认；折现现金流价值明显下降
        - 重新评估现金生成质量；可能将 FY26 OCF 重新归类为非经常性
      - - 核心高管离任或治理违规
        - CEO Amrish Rau 离任；RBI 再次开出 KYC/合规罚款；FY26 出现新的审计保留意见
        - 管理层信心崩塌；机构投资者下调治理溢价
        - 在替代人选和解释落地前，立即减仓
      - - 竞争对手在企业 DCP 中取得实质份额
        - Paytm、Razorpay 或 Stripe India 在贡献 >5% 收入的企业客户中替代 Pine Labs
        - 网络效应逻辑变弱；take-rate 压力上升；DCP 增长停在 10% 以下
        - 跟踪季度 DCP 数量与 VAS 附着率；若 DCP 连续两个季度增速 < 8%，标记风险
    notes: >
      触发器定义为可用公开数据衡量（NSE 交易所披露、季度业绩、监管通知）。「收入不及预期」相对管理层在 FY26 Q4 业绩会上给出的 21% 增长「硬指引」。OCF 正常化阈值采用财务章节分析估计的 Rs 200–280
      crore 年化区间。
    claimRefs:
      - CV024
      - CV033
      - CV025
      - CV038
  - id: TV006
    title: 高置信入场前的最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么影响估值
      - 负责人 / 路径
    rows:
      - - GST 或有负债时间线
        - CESTAT 听证日期；外部税务律师的概率评估；利息累积率
        - Rs 347+ crore 尾部风险超过年度 PAT 的 3x；金额会影响熊市 / 基准情景，也影响净现金折价
        - Pine Labs 法务团队；CESTAT 公开案卷；在业绩会上追问管理层
      - - Breakage 收入金额
        - Qwikcilver 在所有项目结构中管理的确切 breakage 金额（联名 vs. 闭环）
        - 没有披露的 breakage 金额，就无法独立核验公司 2026 年 6 月 16 日的否认
        - 要求管理层具体披露，或审阅经审计分账；下次分析师会议继续追问
      - - 子公司层面 PAT 拆分
        - 国际子公司按国家拆分的 P&L（马来西亚、阿联酋、新加坡、澳大利亚、非洲）
        - 不知道哪些市场盈利，就无法建模国际业务带来的 Rs 37 crore PAT 拖累
        - 在 Q4 后分析师会议提出请求；对比单体与合并分部披露
      - - IAP 分部毛利率
        - DITP 与 IAP 分别的分部级毛利率
        - 无法做可信 SOTP；可能揭示合并 P&L 中 IAP 被 DITP 交叉补贴
        - 要求在分析师日披露；若 Qwikcilver 专属利润率曾披露，再交叉核对
      - - 正常化 OCF 轨迹
        - FY27 Q1 和 Q2 季度 OCF 结果（下一次：2026 年 7 月 28 日业绩）
        - 连续两个干净季度各自 OCF 达 Rs 100+ crore，才能确认 Rs 400+ crore 年化运行率；一个季度不够
        - FY27 Q1 结果（预计 2026 年 7 月 28 日）；与 FY26 Q4 对比，确认没有反转
      - - ESOP 授予计划与稀释
        - 2026 年 6 月 19 日 NRC 批准 26.1M 份新 ESOP；完整归属安排与稀释影响
        - ESOP 稀释增加股本数；正常化后的 ESOP 费用运行率影响调整后 EBITDA 质量
        - NRC 批准后的 NSE 交易所文件；按 1,174M 完全稀释股本建模（隐含 10% 稀释）
    notes: >
      尽调问题按对估值精度的影响排序。GST 与 breakage 是投资逻辑关键项，持仓提高到组合 1–2% 以上前应先解决。正常化 OCF 与 ESOP 稀释属于模型调参项，会细化每股内在价值，但不改变牛市 / 基准 /
      熊市基本结构。
    claimRefs:
      - CV024
      - CV033
      - CV026
      - CV025
      - CV039
