      - number: '7.6'
        title: 投资者、估值与市场情绪风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 于 2025 年 11 月完成 IPO，发行价为每股 Rs 210-221，对应约 Rs 25,300 crore（约 $2.9 billion）企业价值，较 2022 年私募轮峰值估值 $5
              billion 折价 40%。IPO 后六个月锁定期于 2026 年 5 月到期，约 92.4 crore 股、约占总股本 80% 的股份可在公开市场交易。随后机构大宗交易接连出现：Madison India
              Capital 以 Rs 144/股卖出 Rs 357 crore 股票；Altimeter Capital 以 Rs 135.21/股卖出 Rs 211 crore；Actis 于 2026 年 6 月 24
              日以 Rs 154.25/股卖出 Rs 151.6 crore；Invesco 也在同一时期部分退出。锁定期到期当天股价即下跌 10%，并触及 Rs 151.12 的 52 周低点，较 IPO 价格和 52
              周高点下跌 31-45%。新投资者面临两层估值风险。第一，若盈利仍然很薄（净利润 Rs 112.5 crore，相当于 Rs 25,300 crore 市值上的约 0.4%
              净利率），股价需要持续的盈利增速上行才能支撑重估。第二，若 PayPal、Mastercard 以及其他 PE/VC 基金等老股东——它们已通过 IPO 的 OFS
              部分退出——继续通过大宗交易出售剩余持股，持续供给压力会压制股价，哪怕经营表现改善。PayPal 和 Mastercard 等 IPO 前投资者已在 IPO 过程中通过 offer-for-sale
              部分退出。尚未完全退出的 IPO 前机构投资者留下的持股压力，构成中期价格发现和分析师情绪风险；即便 FY26 业绩显示经营基本面正在改善，这一压力仍然存在。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
      - number: '7.7'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 是一家职业经理人管理的公司，没有传统 promoter；Sequoia、Temasek、PayPal、Mastercard 等机构投资者合计持有超过 95% 股权。该结构降低了印度
              promoter 驱动型 IPO 常见的关联方自利交易风险，但也带来另一类风险：决策受投资者组合层面目标和持有期压力影响，偶尔可能偏离长期运营建设。CEO Amrish Rau 于 2021 年从
              Mastercard 加入，带领 Pine Labs 完成从新加坡迁回印度的 reverse flip 和 IPO。公司存在显著关键人依赖：向数字支付、AI-enabled 服务和国际扩张的战略再定位反映 Rau
              的愿景；若他意外离任，公司在公开市场生命周期的关键节点会面临领导连续性风险。从新加坡迁回印度注册地（2025 年 6 月完成）增加了法律和结构复杂度，需要 Cyril Amarchand
              Mangaldas、Khaitan、S&R Associates、Latham & Watkins 等多家顶级律所参与，也留下跨境公司治理义务。历史法律程序——包括 2025 年 10 月在 Delhi High
              Court 提起的所得税争议——代表新加坡运营时期遗留风险。国际市场执行风险不小：同时进入东南亚（菲律宾、马来西亚）、中东（UAE、巴林）和澳大利亚，要求公司搭建本地监管关系、银行伙伴关系和商户网络。中东收入在
              FY26 末走弱，说明执行阻力是真实的，不是理论风险。自然增长的人才和组织风险也存在：公司有 4,465 名员工并快速国际扩张，在竞争激烈的市场吸引并留住本地 fintech 人才，会继续增加成本压力。
            claimRefs:
