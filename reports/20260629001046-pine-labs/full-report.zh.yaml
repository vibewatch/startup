        - 4500 万活跃商户；1300 万台 Soundbox；FY26 GMV 估计 INR 24L Cr
        - 大众市场和微型商户；小企业
        - AI Soundbox 音频 POS；印度最大活跃商户平台；贷款交叉销售
        - Soundbox 是音频 QR，不是完整银行卡 POS；银行卡 POS 基数远小于 Pine Labs
      - - Razorpay / Ezetap
        - 线上网关（主）/ 线下 POS（次）
        - 约 60 万台 POS 终端；年 GMV 超 $180B；估值 $7.5B
        - 线上 SME 优先；需要双渠道的全渠道卖家
        - 占优的线上 SME 支付网关；Ezetap 企业 POS 网络
        - 线下仅占 FY25 收入约 6%；地推扩张收缩；POS 基数小 3 倍
      - - BharatPe (Resilient Innovations)
        - QR / 线下 POS / 商户贷款
        - 1700 万注册商户；12.5 万+ POS 机；FY25 收入 INR 1,734 Cr
        - 微型和小商户；二三线城市；UPI-first
        - 零 MDR QR 先行者；集成 NBFC (Trillionloans)；Unity SFB 持股；线上 PA 牌照（2025 年 4 月）
        - POS 基数相对 Pine Labs 可忽略；靠贷款利差变现，而非收单费
      - - PhonePe
        - 全渠道 / SmartSpeaker / 银行卡 POS（萌芽）
        - 4400 万商户网点；6.1 亿注册用户（2025 年 3 月）；pre-IPO
        - 需要一台低价设备同时受理 UPI + 银行卡的小商户
        - SmartPOD 于 2025 年 10 月上线，结合 SmartSpeaker 和 EMV 银行卡受理；4G+NFC
        - 完整银行卡 POS 新进入者；硬件生态相对 Pine Labs 190 万基数仍早期
      - - Worldline India / BillDesk
        - 线下 POS (Ingenico) + 线上网关（组合）
        - BillDesk 以约 $70M 收购 Worldline India（2026 年 2 月）
        - 企业和银行绑定商户；全渠道
        - BillDesk 线上网关规模 + Worldline Ingenico POS 终端网络 + 银行合作
        - 收购后整合风险；BillDesk 过去以线上为主；Worldline India 当时正被剥离
      - - Innoviti Technologies
        - 企业线下 POS SaaS
        - 前 20 大零售企业中覆盖 18 家；FY25 收入 INR 143 Cr；累计融资 $60M
        - 食品、杂货、生活方式、医疗等企业零售连锁
        - 架在 POS 之上的 Unipay 收入保障 SaaS；14 项专利；80%+ 推荐获客
        - 绝对收入小于 Pine Labs；没有有意义的线上网关；仅覆盖印度企业垂直
      - - Mswipe Technologies
        - 移动 POS / SME 收单
        - FY24 收入 INR 271 Cr；融资 $126M；2025 年获得 RBI PA 牌照
        - 中小商户；移动商户收单
        - 低价移动 POS 硬件；RBI 持牌 PA（线上 + 线下 + 跨境）
        - SaaS 或贷款栈有限；规模较小；没有礼品卡或 affordability 产品
      - - Cashfree Payments
        - 线上支付网关
        - FY26 收入约 INR 1,000 Cr；Series C 融资 $53M（2025 年 2 月）；FY26 EBITDA 转正
        - 线上 SMB；跨境商户；developer-first API
        - FY25-FY26 跨境 GTV 增长 8 倍；FY26 SMB 商户基数增长 50%
        - 没有线下 POS；只在 Pine Labs 的线上细分市场竞争
      - - Zaggle Prepaid Ocean
        - 礼品卡 / 忠诚度 / 支出管理 SaaS
        - FY26 收入 INR 19,076 Mn（+46.3%）；5000 万张预付卡；BSE/NSE 上市
        - 企业礼赠、员工奖励、渠道忠诚度项目
        - SaaS-first 支出管理；上市公司；GIFT City IFSC 实体；向 MENA/美国扩张
        - 发卡规模远小于 Qwikcilver；没有 POS 或支付网关业务
    notes: 规模和融资数据来自公司新闻稿、调查报道和行业分析师报告，覆盖 FY25-FY26；没有任何玩家公开披露精确市场份额拆分。 竞争对手分类反映主要收入来源，而非完整产品范围。除非标明 USD，GMV 和收入数字均以 INR 计价。
