    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台叙事
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 更应被视为一家已上市的商户商业与支付基础设施公司，而不是狭义银行卡终端供应商。当前记录里最强的一手来源是 2025 年简版招股书；文件称 Pine Labs
              是一家技术公司，专注于通过数字支付和发卡解决方案，为商户、消费品牌、企业和金融机构推动商业数字化。该文件与当前官网元数据一致：官网把 Pine Labs 放在 POS
              机、支付网关、预付、信贷和金融科技基础设施的横向版图里；零售和在线支付页面则把运营命题进一步收束为全渠道结账、忠诚度、EMI 融资和安全互联网支付。公司办公足迹在当前申报文件中也比营销文案更清晰：注册办公室位于
              Gurugram，公司办公室位于 Noida。由此看到的，是一家扎根印度、接受公开市场披露、产品栈覆盖线下收单、在线支付、发卡、预付和商户软件的公司，而不是单一产品线公司。
