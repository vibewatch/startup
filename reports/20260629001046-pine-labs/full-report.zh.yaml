      - number: '5.4'
        title: 预付、礼品卡与新兴支付轨
        blocks:
          - type: paragraph
            body: >
              Qwikcilver 于 2019 年 3 月以约 $110 million 被收购，并在 2022 年正式并为全资子公司，它支撑 Pine Labs
              的预付与礼品卡业务。该平台处理数字和实体礼品卡的端到端发行、分销和兑付。它为 Amazon、Flipkart、Myntra、Croma 以及 1,500 多家企业客户中的 250
              多个品牌提供项目能力。FY26，Pine Labs 发行 870 million 张预付卡，高于 FY25 的 710 million 张。Qwikcilver 贡献约 800 crore rupees，约占
              Pine Labs FY26 合并收入 2,711 crore rupees 的 30%。Qwikcilver 内部有一条重要但未披露的收入流：breakage，即过期或未兑付礼品卡余额归发行方所有，估计占
              Qwikcilver 收入的 5% 到 6%。2026 年 4 月 RBI 草案规定拟要求发行方将未使用余额返还消费者，可能消除此项收入。Pine Labs 未公开量化其 breakage 暴露，截至 2026
              年初的报道，分析师也未独立建模。印度以外，Pine Labs 位于 pinelabs.us 的品牌支付业务服务 Zara、Marriott、McDonald's、Coca-Cola 等全球品牌，覆盖 10
              个国际市场，国际发行卡超过 287 million 张。2026 年，Pine Labs
              宣布在中东、非洲和东南亚九个国家推出稳定币支持的预付卡：客户从稳定币钱包向卡片充值，余额在销售点转换为本地法币，使商户收到本币。受当地数字资产监管限制，该产品不会在印度或中国推出。
