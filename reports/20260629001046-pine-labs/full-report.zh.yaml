      - number: '7.5'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 是一家上市支付处理平台，每天处理 2000 万笔 UPI 交易，每年发行 87 crore 张预付卡；运营和技术风险一旦爆发，可能迅速传导为监管、声誉和财务损害。Pine Labs
              必须在所有处理、存储或传输持卡人数据的系统上维持 PCI DSS Level 1 认证——这是最严格层级，需要每年接受 Qualified Security Assessor 审计并持续监控。PCI DSS
              4.0 自 2025 年 3 月起全面强制执行，新增持续合规义务、所有持卡人数据环境访问的强制 MFA，以及支付页面的自动脚本监控。若不合规，罚款最高可达每月
              $100,000；更关键的是，卡组织可暂停支付权限。一次严重泄露或合规失误，会同时引发监管行动、声誉受损和运营中断。国际扩张增加了新的运营风险向量：管理层在 FY26 末提到 POS
              终端部署受芯片短缺影响，东南亚 Fave 收购带来整合复杂度，多地市场基础设施成熟度不同，也让接近 100% 的正常运行时间更难维持。公司必须把印度运营模型——85% 的商户交易路由、每天 2000 万笔 UPI
              交易——复制到银行和网络关系深度不足的市场。Qwikcilver 合并（2022 年）和 Fave 收购也带来技术整合风险；任何残留系统割裂，都可能造成数据隔离缺口、合规失败或服务中断。最后，截至 2026 年
              6 月，Pine Labs 尚未披露确认的重大数据泄露，但印度 fintech 行业整体正面对更强的网络威胁：AI 驱动的欺诈、钓鱼和针对支付处理基础设施的勒索软件。
            claimRefs:
              - CR029
              - CR030
