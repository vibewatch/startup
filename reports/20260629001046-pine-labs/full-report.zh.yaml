      - number: '1.3'
        title: 资本基础、IPO 结构与规模指标
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 的资本故事同时体现出深度和重置。根据招股书和 SEBI 申报轨迹，公司通过 2025 年 IPO 进入公开市场：7 月先提交招股文件草案，10 月转为红鲱鱼招股书，并以 2025 年 11
              月中旬交易为目标。发行结构包括最高 Rs 20.8 billion 的新股发行，以及来自长期投资者和内部人的大规模出售要约，参与方包括 Peak
              XV、Actis、Macritchie/Temasek、PayPal、Mastercard、Invesco、Madison India、Lone Cascade、Sofina 和 Lokvir
              Kapoor。这既验证了机构背书，也显示二级流动性压力。公开运营规模也已足够重要：Pine Labs 披露截至 2025 年 6 月有 4,465 名员工；2026 年报道则把平台与 198
              家金融机构合作伙伴、约 690 个消费品牌、FY25 的 5.7 billion 笔交易和 954,000 个商户联系起来。但资本档案仍未补齐历轮累计融资、当前自由流通股动态和 IPO
              后精确股权集中度，因此若干投资人层面的问题仍然悬而未决。
