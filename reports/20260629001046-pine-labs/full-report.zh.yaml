      - number: '8.3'
        title: 可比公司集合——上市、非上市与跨境同业
        blocks:
          - type: paragraph
            body: >
              最直接的印度上市可比公司是 Paytm（One97 Communications，NSE:PAYTM）。Paytm FY26 收入 Rs 8,437 crore（增长 22%），EBITDA Rs 502
              crore，PAT Rs 552 crore。截至 2026 年 6 月 25 日，Paytm 市值 Rs 72,007 crore，企业价值 Rs 57,590 crore，对应 EV/revenue
              6.83x、P/E 131.56x。Paytm 收入规模是 Pine Labs 的 3.1 倍，市值是 5.4 倍；直接比较 EV/revenue 时，必须纳入 Paytm
              更大的规模、更多元的金融服务收入，以及更长的盈利记录。UBS 2026 年 6 月报告明确指出，考虑 Pine Labs 盈利能力更强，其相对 Paytm 的 45%
              估值折价「看起来没有道理」；该观点意味着随着盈利正常化，Pine Labs 有理由缩小折价。


              国际上，Adyen（阿姆斯特丹，NYSE:ADYEY）是支付平台公司最常被引用的高质量标杆，EV/revenue 约 7.2x，EV/EBITDA 10–12x，毛利率超过 60%。Adyen
              的溢价来自无可匹敌的网络效应和地理多元化。相反，Worldline（巴黎，EPA:WLN）的 EV/revenue 低于 1x，EV/EBITDA 为
              6.7x，反映结构性运营挑战和净利润为负，是困境收购方的低端锚。


              非上市可比包括印度 Razorpay，其 2026 年 Series G 估值约 $9.2 billion，按 FY26 收入约 $455M（Rs 3,783 crore）对应约 20x
              EV/revenue。Razorpay 的溢价来自 gateway-plus-SaaS 定位、更高毛利率和私募市场成长溢价。行业层面，Multiples.vc 2026 年 6 月数据显示，支付 POS 公司为
              1.4x EV/revenue，支付基础设施为 2.1x，位于区间低端。核心结构性判断是：Pine Labs 结合 POS 硬件、VAS、EMI affordability、在线支付和发卡 /
              预付业务，定位高于纯 POS 硬件厂商，但低于纯软件 / 网络型 fintech；因此 4–7x EV/revenue 的区间更可辩护，而不是 1.4x 的行业地板。
