      - number: '6.6'
        title: 地理扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 披露了客户集中度风险，但按 fintech 基础设施基准并不严重。前 10 大客户在 FY25 经营收入中占 30.95%，到 Q1 FY26 改善至 29.30%；单一最大客户同期从
              10.62% 降至 8.24%。这些数字出现在 IPO 招股书和分析师评论中，但前十大客户身份未公开，外部无法独立评估合同续约风险或按分部的集中度。趋势向好（集中度下降），但少数大关系的绝对暴露仍然重要。


              地理集中度也在缓慢改善。印度约占 FY26 收入 85%，国际收入达到 ₹403 crore（约占总额 15%），高于三年前不到 9%。已点名国际部署包括 Wio Bank（UAE）、Pan Asia
              Bank（Sri Lanka）、GCash（Philippines）和 CommercePay 分期合作（Malaysia）。Pine Labs 还宣布，到 2026 年 4
              月将在西亚、非洲和东南亚九个未披露市场发行稳定币支持预付卡；按公司自身披露，运营现已覆盖 22 个国家。


              Qwikcilver 分部集中度是另一条风险向量。Entrackr 估计 Qwikcilver 贡献约 30%（约 ₹800 crore）合并年收入。2026 年 4 月 RBI
              提议要求发行方退还未使用礼品卡余额，引发投资者担忧；不过 Pine Labs CFO 公开否认公司确认 breakage 收入，并称拟议规则影响为零。Shopflo 收购（₹88 crore，1,000 多个
              D2C 品牌）把客户基础分散到电商领域，但不增加地理集中度。
