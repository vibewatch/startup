      - number: '4.3'
        title: 成本结构、利润率动态与现金流质量
        blocks:
          - type: paragraph
            body: >
              FY26 单体口径下，员工福利是最大独立成本项，达到 Rs 753.25 crore，约占单体收入 39%。其他费用（基础设施、技术托管、设备成本和处理费）为 Rs 903.39 crore。折旧从 FY24 的
              Rs 265.99 crore、FY25 的 Rs 201.74 crore 大幅降至 FY26 单体口径的 Rs 192.21 crore，反映公司所称的资产轻量化转向：减少实体 POS 硬件投放。利息费用为
              Rs 70.39 crore（FY26 单体），略低于 FY25 的 Rs 70.31 crore，说明即便 IPO 募资用于偿债，借款也尚未完全清掉。


              FY25 净亏损 Rs 145.5 crore，主要由 Rs 114.79 crore 的 ESOP 成本推高，其中包括现金结算奖励的结算，以及 IPO 前的条款修改。Q1 FY26 的 ESOP
              费用进一步飙升至 Rs 66.04 crore，同比增加 123%，原因是 IPO 相关修改和归属期变更。上市后 ESOP 授予恢复常态，是未来持续盈利的重要顺风。FY26 贡献利润率维持在 75%（Rs
              2,041 crore），说明可变成本覆盖健康。调整后 EBITDA 增长 57% 至 Rs 559 crore，利润率 21%，高于 FY25 的 16%；每新增 Rs 100 贡献利润，约带来 Rs
              50–57 的增量 EBITDA，经营杠杆支撑了改善。


              FY26 经营现金流为 Rs 395 crore，较 FY25 的 Rs 49.7 crore 约增长八倍。但仅 Q4 FY26 就产生 Rs 676 crore
              OCF，其中包括提前结算动作；该数字超过全年总额，意味着 Q1 至 Q3 合计经营现金流为负。Q4 激增来自客户结算加速，是时点收益，不是可重复的结构性改善。剔除提前结算后，标准化年度 OCF 估计为 Rs
              200–280 crore——仍为正，但大约只有多数公开分析所用 headline 数字的一半。
