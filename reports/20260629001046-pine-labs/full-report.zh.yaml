      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              印度商户支付生态正沿多条结构和政策轴加速。FY 2025-26，UPI 处理 24,162 crore 笔年度交易，金额达 INR 314 lakh crore，约录得 43% 的五年交易量 CAGR；根据
              RBI 最新 Payment Systems Report，印度全部数字支付交易量中已有 85.5% 通过 UPI 通道流动。仅 2026 年 5 月，UPI 月度交易就创下 23.20 billion 笔、日均
              748 million 笔的新高；个人对商户支付在 UPI 交易量中的占比上升，显示它正从消费者之间的便利工具演变成完整商业基础设施。


              政府支持项目加速供给侧。FY2025，Payments Infrastructure Development Fund 通过硬件补贴让超过 12 lakh 个新商户上线，直接扩大 Pine Labs
              可触达的获客池。Account Aggregator 框架超过 100 million 次授权，为 Pine Labs 的结账借贷产品提供标准化数字信贷数据。印度电商市场 2025 年达到 USD 212
              billion，预计 2030 年达到 USD 325 billion，推动对综合在线网关、POS 和全渠道对账的需求。


              BCG 与 PhonePe 曾预测，商户支付占数字支付价值的比例将从 2022 年的 20% 增长至 2026 年的 65%；UPI 的 P2M 增长轨迹验证了这一命题。企业奖励数字化正在扩大礼品卡
              SAM；随着企业用实时数字券替代现金发放，企业项目预计到 2031 年 CAGR 为 19.36%。截至 2026 年 5 月，UPI 已国际化至八个国家，包括 UAE、Singapore 和 France，这为
              Pine Labs 在 SEA 和中东扩张所需的跨境商户收单基础设施创造了关联机会。
