      - number: '2.5'
        title: 采用约束与反向信号
        blocks:
          - type: paragraph
            body: >
              尽管增长顺风强劲，结构和经济约束仍限制商户商业变现的速度与深度。最关键的是 RBI 对 UPI 交易实行零商户折扣率（zero-MDR）要求。UPI
              没有单笔刷卡费，支付运营商无法在占主导地位的交易量通道上赚取按金额计费收入——Mordor Intelligence 估计，这会把网关 CAGR 压低约 1.8
              个百分点。这改写了市场经济结构：可行变现必须把商户上移到软件订阅、信贷撮合和分析。Pine Labs 的多产品模型正反映这一必要性，但金融分析师指出，POS
              硬件商品化是结构性风险，这意味着在硬件定价侵蚀装机基础价值之前，该战略必须跑通。


              在印度二线、三线和农村地区，现金仍被估计用于 70–80% 的零售交易，限制了商户数量最高市场的数字终端密度。这些区域的 POS
              部署面临叠加障碍：互联网连接不稳定、商户数字素养低、硬件部署成本补贴回收周期慢。RBI 收紧数字借贷监管——ZestMoney 退出、钱包关联 BNPL
              模型收窄都体现了这一点——削减了嵌入式结账信贷提供商可触达的独立 BNPL 市场，把交易量推向银行锚定产品；在该领域，Pine Labs 面对的是银行直连模式。


              ETBFSI 的一篇怀疑性分析强调，Pine Labs 前 10 大客户在非独家合同下贡献 31% 收入；如果大型零售商重新谈判或切换供应商，就会产生集中度风险。监管合规成本也在上升：非银行支付聚合商必须在
              2028 年 3 月前满足 INR 25 crore 净资产要求，这会增加固定开销，利好资本充足的既有玩家，同时为较小挑战者设置门槛。
            claimRefs:
