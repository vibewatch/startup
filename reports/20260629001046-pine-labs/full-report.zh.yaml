      - number: '8.4'
        title: 牛 / 基准 / 熊情景估值
        blocks:
          - type: paragraph
            body: >
              情景分析以 FY27 收入为主要驱动，以 EV/revenue 作为估值锚，并叠加净现金 Rs 7,785 crore 和 1,148 million 股流通股。FY27 收入假设（Rs 2,900–3,350
              crore）和 EV/revenue 倍数（3–7x）敏感性，给出每股约 Rs 120–310 的区间。


              牛市情景（概率权重：25%）：收入达到 Rs 3,346 crore（23.5% 指引上限）；经营杠杆和收入结构转向 VAS 后，adjusted EBITDA 扩至 24%（Rs 803 crore）；GST
              争议以 Pine Labs 胜诉解决且无现金流出；礼品卡沉淀收入争议证明影响不重大；市场给予 7x EV/FY27 revenue 重估，与 Adyen 和印度 fintech 头部四分位一致。EV = Rs
              23,422 crore；加净现金 Rs 7,785 crore → 市值 Rs 31,207 crore → 每股 Rs 272（较 Rs 160 上涨 70%）。催化剂：连续三个季度盈利、FY27 Q1
              业绩高于指引、GST 裁决、RBI 沉淀收入 Master Direction 草案澄清为不适用。


              基准情景（概率权重：50%）：收入达到 Rs 3,252 crore（21% 指引下限）；adjusted EBITDA 为 22–23%；GST 负债按 Rs 174 crore 部分计提（50%
              概率）；估值倍数为 5x EV/FY27 revenue——处于支付处理基准区间中点。EV = Rs 16,260 crore；加扣除部分 GST 后净现金 Rs 7,611 crore → 市值 Rs
              23,871 crore → 每股 Rs 208（较 Rs 160 上涨 30%）。该情景与分析师一致目标价 Rs 205.75 相符。


              熊市情景（概率权重：25%）：收入仅增长 7% 至 Rs 2,900 crore（芯片短缺持续、中东疲软恶化、affordability 分部承压）；全部 GST 负债兑现（现金流出 Rs 347
              crore）；RBI PPI 草案规则不利影响沉淀收入；倍数压缩至 3x EV/revenue（困境 POS 同业行业中位数）。EV = Rs 8,700 crore；加扣除全部 GST 后净现金 Rs
              7,438 crore → 市值 Rs 16,138 crore → 每股 Rs 140（较 Rs 160 下跌 13%）。概率加权内在价值：0.25 × Rs 272 + 0.50 × Rs 208 +
              0.25 × Rs 140 = 每股 Rs 207，较当前价格约高 30%；若基准情景假设成立且熊市情景概率不超过 25%，当前股价略低估。
            claimRefs:
