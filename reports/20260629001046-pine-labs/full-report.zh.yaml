      - number: '4.5'
        title: 财务风险、GST 诉讼、breakage 争议与治理警讯
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 DRHP，Pine Labs 面临的 GST 或有负债累计超过 Rs 310 crore。主要争议是 GST Intelligence 总局（DGGI）孟买办公室提出的 Rs 214.11
              crore 追缴，2025 年 2 月获维持；争议涉及 2017 年 7 月至 2024 年 3 月期间，联名服务、电商商品上架费、以及与礼品卡销售相关广告的进项税抵扣被否。仅该笔追缴的估计利息，截至 2024
              年 12 月已达 Rs 95.57 crore。另一笔与 Qwikcilver 收购相关的 Rs 37.33 crore 追缴于 2026 年 2 月获维持，Pine Labs 计划上诉至
              CESTAT。税款加利息合计约 Rs 347 crore，是 FY26 合并 PAT Rs 113 crore 的三倍以上。Pine Labs 声称在更高上诉机构胜诉概率较高，但没有承诺结果时间表。


              礼品卡 breakage 争议于 2026 年 6 月浮出水面。当时 Entrackr 报道称，RBI 关于未使用预付余额的拟议草案规则可能消除 breakage 收入。Pine Labs 于 2026 年 6
              月 16 日通过交易所公告回应，称报道具有猜测性、错误且误导；公司表示联名项目中的 breakage 归品牌合作伙伴所有，从未进入其 P&L。报道当天股价一度下跌 5%。尽管公司否认，Qwikcilver
              在所有项目结构下管理的 breakage 具体规模从未公开披露，外部无法独立验证该否认。2026 年 4 月 RBI 关于 PPI 的 Master Direction
              草案要求将未使用余额返还给持有人，该监管风险仍未消除。


              2026 年 3 月，RBI 因 Pine Labs 在未完成 KYC 验证的情况下发行 full-KYC PPI，对其处以 Rs 3.10 lakh 罚款；该问题来自覆盖 2024 年 7 月至 2025 年
              5 月的法定检查。审计师在 FY22–FY24 期间指出 GITC 薄弱点，包括收入和薪资系统的审计轨迹合规缺口、用户访问控制不足、以及法定付款延迟。CFO Marc Mathenz 在 IPO 前的 2025
              年 6 月辞职，FY24 员工流失率达到 39.2%。
