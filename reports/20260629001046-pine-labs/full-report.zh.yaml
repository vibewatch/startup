  - id: FV001
    title: Pine Labs 投资建议逻辑——从证据到立场
    type: flow
    layout: standard
    summary: |
      决策链从四根证据支柱出发——规模 / 增长验证、盈利轨迹、风险调整后的倍数、未解决压力——最终收敛为「跟踪」建议，置信度中等，概率加权内在价值 Rs 207。
    data:
      nodes:
        - id: growth-proof
          label: FY26 收入增长 19%；FY27 指引 21–23.5%（硬指标）；Q1 FY27 正在跟踪
        - id: margin-progress
          label: 调整后 EBITDA 利润率 21%，同比 +500bps；ESOP 拖累在 IPO 后常态化
        - id: valuation-context
          label: EV/Rev 3.91x，对比行业 4–6x；当前价格低于行业中位数
        - id: risk-overhang
          label: GST Rs 347+ Cr 悬而未决；沉淀收入无法核验；OCF 时点被扭曲
        - id: cash-buffer
          label: 净现金 Rs 7,785 Cr；Rs 67.80 / 股底价；占市值 42%
        - id: track-recommendation
          label: 立场：跟踪（中等置信度）；PW 内在价值 Rs 207（+30%）
    approximationNotes: |
      Rs 207 的概率加权价值按牛市（Rs 272）、基准（Rs 208）和熊市（Rs 140）情景分别赋予 25 / 50 / 25 权重。这些权重是分析估计，不是期权隐含概率。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV010
  - id: FV002
    title: Pine Labs 股价对 EV/收入倍数的敏感性——FY27 共识收入
    type: bar
    layout: standard
    summary: |
      在每个 EV/FY27E 收入倍数下隐含的每股价格（Rs 3,252 crore 共识收入、净现金 Rs 7,785 crore、1,148M 股）。当前价格 Rs 160 低于 4x 水平，意味着市场给的是低于行业平均的倍数。
    data:
      items:
        - label: 3x EV/Rev（熊市）
          value: 153
        - label: 4x EV/Rev（行业底部）
          value: 181
        - label: 5x EV/Rev（基准 / 共识）
          value: 209
        - label: 6x EV/Rev（行业中位）
          value: 238
        - label: 7x EV/Rev（牛市 / Adyen 区间）
          value: 266
    approximationNotes: >
      计算方式为：（EV 倍数 × Rs 3,252 crore）+ Rs 7,785 crore 净现金，再除以 1,148 million 股。净现金保持不变；未扣减 GST 影响（随情景变化）。FY27 收入 Rs 3,252
      crore 来自 S&P Global Market Intelligence 分析师共识。
    claimRefs:
      - CV006
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值区间——牛市 / 基准 / 熊市每股情景
    type: range
    layout: standard
    summary: |
      在 FY27 收入、EV/收入倍数和 GST 负债结果三组情景假设下的低 / 中 / 高每股估值。熊市情景把倍数压到 3x；牛市假设重估到 7x。当前价格 Rs 160 低于三种情景的中点，说明即便基准情景也隐含上行空间。
    data:
      items:
        - label: 熊市（3x EV/Rev，7% 增长，全额 GST）
          low: 120
          high: 155
          mid: 140
        - label: 基准（5x EV/Rev，21% 增长，部分 GST）
          low: 190
          high: 230
          mid: 208
        - label: 牛市（7x EV/Rev，23.5% 增长，GST 解决）
          low: 245
          high: 310
          mid: 272
    approximationNotes: |
      每个情景内的区间反映净现金部署（Shopflo、技术资本开支）、季度收入时点和 ESOP 稀释带来的变化。低 / 高边界围绕中点取 ±15%，用于反映结构性不确定性，并非正式 Monte Carlo 估计。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV003
  - id: FV004
    title: Pine Labs 投资 KPI 评分卡——IC 可用评估
    type: kpi
    layout: standard
    summary: |
      从市场、产品、护城河、经济性、法律 / 监管风险、估值和证据质量等维度给投资打分。总体 6.3 / 10 支持「跟踪」；若 GST / 沉淀收入压力解除，且连续两个季度 OCF 干净，评级可上调为「买入」。
    data:
      items:
        - label: 市场机会
          value: 7
          benchmark: 10
        - label: 收入增长验证
          value: 7
          benchmark: 10
        - label: 竞争护城河
          value: 6
          benchmark: 10
        - label: 单位经济性 / 利润率
          value: 6
          benchmark: 10
        - label: 法律和监管风险
          value: 4
          benchmark: 10
        - label: 估值买点
          value: 6
          benchmark: 10
        - label: 证据质量
          value: 7
          benchmark: 10
    approximationNotes: >
      分数是分析师判断（1–10 分制），依据本报告汇总的公开证据。10 分基准代表证据完备、风险低、估值有吸引力的假想投资。法律和监管得分为 4，反映 Rs 347+ crore GST
      负债悬而未决，且沉淀收入规模无法核验。分数并非来自量化模型。
    claimRefs:
      - CV024
      - CV033
      - CV006
      - CV012
      - CV020
