      - number: '7.8'
        title: 图表证据
        blocks:
          - type: callout
            title: 论点关键：GST 诉讼金额超过 FY26 净利润的 2.7 倍
            body: >
              GST 或有负债本金合计超过 Rs 310 crore，加上估算利息 Rs 95.57 crore，约等于 Rs 405 crore——是 Pine Labs FY26 净利润 Rs 112.5 crore 的
              3.6 倍。若 Rs 214 crore 的 DGGI 要求在上诉中被不利裁定，不仅会抹掉已披露盈利，还可能需要融资或触发 covenant breach。Pine Labs
              主张自身法律依据充分，但多轮上诉尚未给出最终结果。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR011
          - type: callout
            title: 论点关键：RBI PPI 指令威胁高利润率沉淀收入
            body: >
              RBI 2026 年 4 月 PPI Master Direction 草案包含一项条款，要求将过期 PPI 余额转入 DEA Fund；这会消除 Pine Labs 等礼品卡发行方的沉淀收入。Entrackr
              估计该收入流占 Qwikcilver Rs 700 crore 礼品卡收入的 5-6%（约 Rs 35-42 crore）。由于增量成本接近零，收入损失几乎会全部流向净利润——最坏情况下抹掉 FY26 净利润约
              31-37%。Pine Labs 尚未公开量化影响，似乎也没有分析师将其纳入模型。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: callout
            title: 可控：零 MDR 与投资者 overhang 属于监控风险
            body: >
              UPI 零 MDR 限制了 Pine Labs 在交易层面的变现，但若 2026 年 Finance Committee 建议的大商户 MDR 恢复落地，可能成为有意义的收入顺风。锁定期到期后的抛售潮（2026
              年 5 月释放 Rs 17,372 crore）属于技术性 overhang；随着 IPO 前投资者完成退出、国内共同基金（已在大宗交易中买入）成为边际投资者，该压力会逐步减弱。
