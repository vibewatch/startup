      - number: '5.3'
        title: 在线支付网关——Plural 与开发者平台
        blocks:
          - type: paragraph
            body: >
              Plural 是 Pine Labs 的全渠道在线支付网关，约在 2020–2021 年商业化推出。它开放 REST API，并用 OAuth2 client_credentials 授权保护；商户用
              client ID 和 secret 换取短期 access token，token 在服务端缓存，并在过期前刷新。UAT 环境位于 pluraluat.v2.pinepg.in，生产环境位于
              api.pluralpay.in。支持的支付方式覆盖 UPI、信用卡、借记卡、网银、钱包、BNPL / Pay Later（截至 2026 年中，公开文档中 LazyPay 是唯一列明的第三方 Pay Later
              提供方）、循环扣款和 tokenized card storage。开发者门户提供 Node.js / TypeScript、PHP（Packagist 上为
              plural-pinelabs/pinelabs-php）和 Python（PyPI 上为 pinelabs-python）的服务端 SDK；Java、Ruby、Go 和 .NET 标注为即将推出。移动 SDK
              覆盖 Android 和 iOS 网页跳转流程；React Native SDK 也已提供。店内 app-to-app 集成中，同一个 API 网关支撑上一节所述 Plutus IPC 流程。Model
              Context Protocol（MCP）服务器——npm 上的 pinelabs-online-mcp，以及 plural-pinelabs GitHub 组织——允许 Claude
              Desktop、Cursor、VS Code 和 GitHub Copilot 等 AI 助手工具用自然语言调用 Plural 支付 API，代表 Pine Labs 首个专门面向 agentic
              开发者工具。开发者门户宣传 500 多名开发者、1,000 万笔以上交易、99.99% 可用性、平均响应时间低于 300 毫秒；尚无独立 SLA 审计发布。
