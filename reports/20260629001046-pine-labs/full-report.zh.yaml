      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Pine Labs 的商业模式形成了几条集中度很高的依赖链；关键伙伴或监管机构一旦调整条款或战略，风险会不对称放大。Mastercard 持有 Pine Labs
              的战略股权，也是先买后付产品、国际扩张和部分支付处理基础设施的核心技术与金融伙伴。若 Mastercard 战略转向——无论是跨境支付规则遇到监管摩擦，还是 Mastercard 对印度 fintech
              投资逻辑改变——都会伤及商业安排和资产负债表观感。Pine Labs 虽然已为分期解决方案接入 Visa 和其他发卡方，但在印度以外，Mastercard 仍是最重要的单一战略伙伴。Qwikcilver 贡献约
              30% 的 FY26 合并收入（约 Rs 800 crore），是最大的单一子公司依赖。Qwikcilver 的礼品卡业务支撑 Amazon、Flipkart、Myntra、Croma
              以及数百个企业品牌的项目。若任何锚定品牌把礼品卡发行迁回内部或转给竞争对手，或监管变化抹掉沉淀收入，Qwikcilver 的收入和利润率贡献会急剧恶化。Pine Labs 在 FY26 每天处理约 2000 万笔
              UPI 交易，并通过自身平台路由约 85% 的商户交易，因此高度依赖 NPCI 的 UPI 网络和零 MDR 政策框架。任何 NPCI 层面的运营中断、认证问题或政策变化，都会立刻传导到收入。国际业务（FY26
              收入的 17%）集中在监管和地缘政治风险更高的市场：UAE / 中东在 FY26 末走弱，东南亚则需要本地牌照、银行伙伴关系（如 UAE 的 Wio Bank、菲律宾的
              GCash），并遵守各不相同的跨境支付监管。这些依赖会拖慢收入爬坡，也可能在单个市场触发牌照撤销。
            claimRefs:
