  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 市场估值、IPO 背景与价格发现
        blocks:
          - type: paragraph
            body: >
              Pine Labs 于 2025 年 11 月完成 IPO，发行价 Rs 221/股，11 月 14 日以 Rs 252 上市，随后短暂触及 Rs 284 的 52 周高点，之后持续回落。

              截至 2026 年 6 月 25 日，股价收于 Rs 160.07——较 IPO 价格低约 28%，较上市后高点低 43%，过去十二个月下跌 36.2%。

              公司总股本 1.148 billion 股，对应市值 Rs 18,380 crore（约 $2.21 billion USD）。截至 2026 年 3 月 31 日，公司持有现金 Rs 82.26
              billion、债务 Rs 4.41 billion，净现金约 Rs 7,785 crore，因此企业价值为 Rs 10,595 crore——IPO 募资形成的大额现金，使企业价值显著低于市值。


              上市后下跌来自多重因素叠加：初始估值偏高，按亏损的 FY25 盈利隐含超过 1,300x P/E；2026 年 3 月地缘政治避险（包括中东紧张局势）对新经济科技股冲击更大；机构抛售（Invesco
              Developing Markets Fund 在接近 52 周低点的大宗交易中以 Rs 145.97/股卖出 790 万股）；以及 H1 FY26 经营现金流持续为负，尽管 Q3 FY26（2025 年 12
              月季度）首次实现 Rs 42 crore 季度利润。股价已从 Rs 134.73 的 52 周低点修复，但仍在 Rs 155–165 区间震荡，说明市场在等待 FY27 季度执行兑现后再重估投资逻辑。


              尽管股价表现疲弱，估值倍数相对印度成长科技公司并不极端。157x 的 trailing P/E 绝对值偏高，但与 Paytm 首年盈利对应的 131x 倍数可比；基于分析师 FY27 EPS 一致预期 Rs
              2.85 的 forward P/E 为 56x，也符合成长阶段印度 fintech 的定价。每股净现金 Rs 67.80，为 Rs 160 股价提供约 42% 保护，意味着「运营业务」实际交易价格为每股 Rs
              92.20，或约 Rs 10,595 crore 企业价值。
