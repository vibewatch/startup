      - number: '6.5'
        title: 渠道与伙伴驱动的客户分发
        blocks:
          - type: paragraph
            body: >
              Pine Labs 通过与银行、钱包运营商和企业聚合方签订渠道和分销伙伴协议，触达其可服务商户市场的相当一部分。这带来一个关键证据区别：渠道伙伴关系能生成商户触达指标，但不等于 Pine Labs
              与终端商户之间存在直接商业关系。GCash for Business 合作（菲律宾，2026 年 5 月）就是这种动态的典型例子：Pine Labs 向 GCash for Business
              提供支付处理基础设施和增值服务，后者再把这些能力部署给其 600 万 MSME 商户网络和 9,400 万注册用户。终端商户采用的是 GCash 品牌支付解决方案；直接商业关系在 GCash，而不是 Pine
              Labs。一旦 GCash 更换供应商，Pine Labs 会立刻失去全部相关商户版图。


              同样，Karnataka Bank 的 PoS 部署使用 Pine Labs 终端和软件，但以银行自身客户体系营销和管理这些关系。UAE 的 Wio Bank 把其商户收单基础设施搭在 Pine Labs 的
              Credit+ 平台上，意味着 Wio Bank 商户在 Pine Labs rails 上交易，却不直接与 Pine Labs 签约。马来西亚 CommercePay 合作通过单一
              API，把分期支付选项扩展到九家主要银行（覆盖约 60% 马来西亚持卡人），直接面向商户的一方仍是 CommercePay。


              这一渠道模式让 Pine Labs
              无需搭建本地直销基础设施，就能加速地理覆盖，但也引入收入分成和排他性风险。这些渠道协议中的收入分成条款、排他性安排和最低承诺条款均未公开披露，外部无法评估一旦大型渠道伙伴流失，Pine Labs 的暴露程度。
            claimRefs:
              - CU023
              - CU024
          - type: figure
