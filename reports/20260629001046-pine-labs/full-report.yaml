            title: First full-stack PA licence holder in India
            body: >
              Pine Labs is the first Indian fintech to hold RBI payment aggregator licences for offline, online, and
              cross-border payment processing simultaneously. This regulatory position removes a key market-entry
              barrier that delays competitors and supports cross-border product development including the stablecoin
              prepaid card and agentic international payments.
