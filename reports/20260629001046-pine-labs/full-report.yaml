  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - GST liability crystallises in full
        - CESTAT ruling upholds Rs 214+ crore DGGI demand; total exposure exceeds Rs 347 crore
        - Rs 347 crore cash outflow reduces net cash cushion by 4.5%; PAT erosion >3 FY26 annual profits
        - Downgrade to avoid; re-run valuation with reduced net cash and elevated regulatory risk premium
      - - FY27 revenue misses guidance by > 5%
        - Q1 FY27 or Q2 FY27 revenue below Rs 800 crore on a run-rate basis; guidance withdrawn or narrowed
        - Multiple compression from 5x to 3–3.5x; bear case becomes base case; analyst target cuts
        - Exit or reduce position; reassess after one full clean quarter
      - - RBI PPI regulation adversely rules on breakage
        - April 2026 draft Master Direction finalised requiring unused PPI balances returned; directly impacts IAP
        - IAP segment (32% of revenue, Rs 874 crore) revenue/margin impacted; gift-card breakage income eliminated
        - Full segment re-valuation; IAP multiple collapses to 1.5x EV/revenue; SOTP loss Rs 2,000–3,000 crore EV
      - - OCF normalized below Rs 150 crore for two consecutive quarters
        - H1 FY27 operating cash flow totals less than Rs 300 crore; suggests Q4 FY26 timing was structural, not timing
        - Bear case OCF assumption confirmed; discounted cash-flow value falls materially
        - Reassess cash generation quality; potentially reclassify FY26 OCF as non-recurring
      - - Key executive departure or governance breach
        - CEO Amrish Rau departure; repeat KYC/compliance penalty from RBI; new audit qualification in FY26
        - Management confidence collapse; institutional investors de-rate governance premium
        - Reduce position immediately pending replacement and explanation
      - - Competitor material DCP share gain in enterprise
        - Paytm, Razorpay, or Stripe India displaces Pine Labs in an enterprise customer representing >5% of revenue
        - Network effect thesis weakens; take-rate pressure increases; DCP growth stalls below 10%
        - Monitor quarterly DCP count and VAS attachment rate; flag if DCP growth < 8% for two quarters
    notes: >
      Triggers are defined to be measurable on publicly available data (NSE exchange disclosures, quarterly results,
      regulatory notifications). "Revenue miss" is relative to management's "hard guidance" of 21% growth from the Q4
      FY26 earnings call. OCF normalization threshold reflects the estimated Rs 200–280 crore annual range from the
      financials chapter analysis.
