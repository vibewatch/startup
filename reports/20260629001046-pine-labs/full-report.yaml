      - number: '5.2'
        title: In-Store Payments — Plutus Smart POS
        blocks:
          - type: paragraph
            body: >
              The Plutus Smart (also referred to as APOS, Android POS) is an Android-based smart transaction machine
              running Pine Labs' Plutus middleware. It accepts credit cards, debit cards via NFC/contactless, chip, and
              magstripe, plus UPI/Bharat QR, mobile wallets, EMI, and gift cards. Third-party billing applications
              integrate with Plutus via an Android Messenger-over-Bound-Service IPC pattern: the billing application
              binds to the Plutus service, exchanges IBinder references, and sends Message objects to invoke payment,
              printing, and batch settlement functions. This architecture allows cashier, retail, and food-and-beverage
              software vendors to embed Pine Labs payment acceptance without becoming PCI-scoped, since cardholder data
              never enters the billing application. Device updates and troubleshooting are managed through a cloud
              management dashboard. Terminal hardware carries PCI PTS 6.x SRED certification and EMV Level 1 and Level 2
              approvals, qualifying it for Visa, Mastercard, RuPay, and Amex network acceptance. A softPOS variant runs
              the Plutus application on a standard merchant Android handset, broadening deployment without dedicated
              hardware costs, though comparative performance metrics for softPOS versus the dedicated Plutus terminal
              have not been independently benchmarked.
            claimRefs:
              - CE002
              - CE003
              - CE024
