      - number: '5.3'
        title: Online Payments Gateway — Plural and Developer Platform
        blocks:
          - type: paragraph
            body: >
              Plural is Pine Labs' omnichannel online payment gateway, launched commercially circa 2020–2021. It exposes
              a REST API secured by OAuth2 client_credentials grant; merchants exchange a client ID and secret for a
              short-lived access token, which is cached server-side and refreshed before expiry. The UAT environment
              runs at pluraluat.v2.pinepg.in and production at api.pluralpay.in. Supported payment methods span UPI,
              credit cards, debit cards, net banking, wallets, BNPL/Pay Later (LazyPay is the only documented
              third-party Pay Later provider in public documentation as of mid-2026), recurring payments, and tokenized
              card storage. The developer portal hosts server-side SDKs in Node.js/TypeScript, PHP (available via
              Packagist as plural-pinelabs/pinelabs-php), and Python (available on PyPI as pinelabs-python); Java, Ruby,
              Go, and .NET are listed as coming soon. Mobile SDKs cover Android and iOS web-redirection flows; a React
              Native SDK is also available. For in-store app-to-app integration, the same API gateway backs the Plutus
              IPC flow described in the previous section. The Model Context Protocol (MCP) server—pinelabs-online-mcp on
              npm and the plural-pinelabs GitHub organization—allows AI assistant tools including Claude Desktop,
              Cursor, VS Code, and GitHub Copilot to call Plural payment APIs in natural language, representing Pine
              Labs' first dedicated agentic developer tooling. The developer portal advertises 500-plus developers, 10
              million-plus transactions, 99.99% uptime, and under 300 milliseconds average response time; no independent
              SLA audit has been published.
