      - number: '1.2'
        title: Leadership, Board, and Governance Posture
        blocks:
          - type: paragraph
            body: >-
              Pine Labs’ governance profile changed materially as it prepared for public listing. The prospectus says
              the company has no identifiable promoter, which matters because it shifts diligence away from founder
              control mythology and toward the board, major financial sponsors, and executive operators. B. Amrish Rau
              is disclosed as Chairman, Managing Director, and Chief Executive Officer, and his background at PayU,
              Citrus, First Data, NCR, and payments more broadly makes the appointment strategically coherent for a
              scaled fintech platform. Kush Mehra remains an important second operator as Executive Director, President,
              and Chief Business Officer for Digital Infrastructure and Transaction Platform, with responsibility for
              strategic partnerships and digital-payments growth. The board section in the prospectus also shows the
              public-company overlay: Peak XV nominee Shailendra Jit Singh and multiple independent directors with
              banking, technology, and governance backgrounds. That is directionally positive for listed-company
              readiness, but public materials still provide less clarity on committee dynamics, voting blocs, and
              informal influence than a private diligence room would.
