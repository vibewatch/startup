      - number: '5.6'
        title: Trust, Security, and Regulatory Compliance
        blocks:
          - type: paragraph
            body: >
              Pine Labs' security posture is anchored by PCI DSS compliance across its payment infrastructure and by
              dedicated hardware security for the Plutus terminal, which carries PCI PTS 6.x SRED certification and EMV
              Level 1 and Level 2 approvals. The Plural gateway operates under PA DSS v3.2 and VISA PIN certification
              (PCI PIN v2.0 with KIF and RKI key management). Pine Labs promotes 100% RBI tokenization compliance for
              card-on-file storage on its online platform. As of November 2025, Pine Labs became the first Indian
              fintech to hold all three RBI payment aggregator licences—for offline merchant payments, online merchant
              payments, and cross-border payment processing—strengthening its regulatory standing ahead of its November
              2025 IPO listing. Despite this framework, the RBI imposed a 3.1 lakh rupee monetary penalty on Pine Labs
              in March 2026 following a statutory inspection from July 2024 to May 2025 that found full-KYC prepaid
              instruments had been issued without completing customer KYC formalities. The RBI clarified the penalty
              does not affect the validity of existing customer transactions but underscores ongoing PPI compliance
              risk. The April 2026 RBI draft regulation on gift card unused-balance return introduces prospective
              business model risk distinct from a current compliance failure.
