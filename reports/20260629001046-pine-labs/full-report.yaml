            title: Breakage income threat from RBI gift card unused-balance regulation
            body: >
              Qwikcilver's high-margin breakage revenue from unredeemed gift cards is not publicly quantified in Pine
              Labs' financials. An April 2026 RBI draft regulation could require return of unused balances to consumers,
              potentially eliminating this income stream. Analysts had not independently modeled this exposure as of
