  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Customer Segments: Three Distinct Buyer Tiers'
        blocks:
          - type: paragraph
            body: >
              Pine Labs serves three structurally distinct buyer tiers that differ in procurement path, integration
              depth, and revenue contribution. The first and largest tier by count is direct merchant customers — 1.1
              million businesses that use Pine Labs PoS hardware, software checkouts, or payment APIs to accept card,
              UPI, and EMI transactions. Within this tier, enterprise merchants (top retailers, petroleum networks,
              airline operators, hospitality chains) represent the high-value end: they integrate Pine Labs into ERP
              systems, enable multi-bank EMI subvention workflows, and operate large device fleets across hundreds of
              locations, creating deep operational switching costs. SMB and micro-merchants form the volume base but at
              lower per-merchant revenue, and represent the segment most susceptible to competitive substitution from
              Paytm, PhonePe, or BharatPe.


              The second tier is enterprise brands — 450+ consumer-facing brands that contract Pine Labs' Qwikcilver
              subsidiary as a white-label gift card and loyalty infrastructure provider, paying per-card or per-program
              fees. Named enterprise brand customers include Amazon India, Flipkart, Myntra, and Croma, among hundreds
              of corporate gifting clients. The Shopflo acquisition (April 2026, ₹88 crore) added 1,000+ D2C e-commerce
              brands and 60 million end-customer transaction records to this tier.


              The third tier is financial institution partners — 177 banks and NBFCs that use Pine Labs' issuing,
              acquiring, or card management platforms (including the modular Credit+ system) to power their own merchant
              products or cardholder services. Named FI customers include Wio Bank (UAE), Karnataka Bank (India), and
              Pan Asia Bank (Sri Lanka). This FI tier blurs the customer-versus-distribution-partner distinction, as
              banks both pay Pine Labs for platform access and simultaneously route merchant relationships through Pine
              Labs infrastructure.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
              - CU027
