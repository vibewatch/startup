      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >
              India's merchant payment ecosystem is accelerating on multiple structural and policy axes. UPI processed
              24,162 crore annual transactions worth INR 314 lakh crore in FY 2025-26, recording approximately a 43%
              five-year volume CAGR; 85.5% of all India digital payment volumes now flow through UPI rails per the RBI's
              latest Payment Systems Report. May 2026 alone set a monthly record of 23.20 billion transactions at 748
              million daily, with person-to-merchant payments growing as a share of UPI volume—signaling evolution from
              a consumer-to-consumer convenience into a full commercial infrastructure.


              Government-backed programs accelerate the supply side. The Payments Infrastructure Development Fund
              brought over 12 lakh new merchants online in FY2025 through subsidized hardware, directly expanding Pine
              Labs' addressable acquisition pool. The Account Aggregator framework surpassing 100 million consents
              enables standardized digital credit data for Pine Labs' checkout lending products. India's e-commerce
              market reached USD 212 billion in 2025 and is projected to reach USD 325 billion by 2030, driving demand
              for integrated online gateway, POS, and omnichannel reconciliation.


              BCG and PhonePe projected that merchant payments would grow from 20% of digital payment value in 2022 to
              65% by 2026, a thesis validated by UPI's P2M growth trajectory. Corporate rewards digitization is
              expanding the gift card SAM, with corporate programs projected at 19.36% CAGR through 2031 as enterprises
              replace cash payouts with real-time digital vouchers. UPI's internationalisation to eight countries by May
              2026—including UAE, Singapore, and France—creates cross-border merchant acceptance infrastructure relevant
              to Pine Labs' SEA and Middle East expansion.
