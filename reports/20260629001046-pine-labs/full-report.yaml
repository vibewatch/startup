      - number: '4.5'
        title: Financial Risk, GST Litigation, Breakage Controversy, and Governance Flags
        blocks:
          - type: paragraph
            body: >
              Pine Labs faces cumulative GST contingent liabilities exceeding Rs 310 crore as of its 2025 DRHP. The
              primary dispute involves a Rs 214.11 crore demand from the Directorate General of GST Intelligence (DGGI),
              Mumbai, upheld in February 2025, relating to disallowed input credits on co-branding services, e-commerce
              product listing fees, and advertising linked to gift card sales from July 2017 to March 2024. Estimated
              interest on this demand alone reached Rs 95.57 crore as of December 2024. A separate Rs 37.33 crore demand
              linked to the Qwikcilver acquisition was upheld in February 2026 and Pine Labs plans to appeal to CESTAT.
              Combined tax plus interest exposure of approximately Rs 347 crore exceeds FY26 consolidated PAT of Rs 113
              crore by more than three times. Pine Labs asserts it has a high probability of success at higher appellate
              forums, but no outcome timeline is committed.


              The gift-card breakage controversy emerged in June 2026 when an Entrackr report suggested proposed RBI
              draft rules on unused prepaid balances could eliminate breakage income. Pine Labs responded with an
              exchange filing on June 16, 2026, calling the report speculative, incorrect, and misleading, stating
              breakage accrues to brand partners in co-branded programs and has never been recognized in its P&L. The
              shares fell up to 5% on the day of the report. Despite the company's denial, the exact quantum of breakage
              managed by Qwikcilver across all program structures has never been disclosed publicly, making independent
              verification of the denial impossible. The April 2026 RBI draft Master Direction on PPIs requiring return
              of unused balances to holders remains an open regulatory risk.


              The RBI imposed a Rs 3.10 lakh penalty on Pine Labs in March 2026 for issuing full-KYC PPIs without
              completing KYC verification, following a statutory inspection covering July 2024 to May 2025. Auditors
              flagged GITC weaknesses across FY22–FY24, including audit trail compliance gaps in revenue and payroll
              systems, inadequate user access controls, and statutory payment delays. CFO Marc Mathenz resigned in June
              2025 ahead of the IPO, and employee attrition reached 39.2% in FY24.
            claimRefs:
              - CI029
              - CI030
              - CI031
              - CI032
              - CI033
              - CI034
