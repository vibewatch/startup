      - number: '5.4'
        title: Prepaid, Gift Card, and Emerging Payment Rails
        blocks:
          - type: paragraph
            body: >
              Qwikcilver, acquired in March 2019 for approximately $110 million and formally merged as a wholly-owned
              subsidiary in 2022, underpins Pine Labs' prepaid and gift card business. The platform handles end-to-end
              issuance, distribution, and redemption of both digital and physical gift cards. It powers programs for
              Amazon, Flipkart, Myntra, Croma, and more than 250 brands across 1,500-plus enterprise clients. In FY26,
              Pine Labs issued 870 million prepaid cards, up from 710 million in FY25. Qwikcilver contributes
              approximately 800 crore rupees, roughly 30% of Pine Labs' consolidated FY26 revenue of 2,711 crore rupees.
              A significant but undisclosed revenue stream within Qwikcilver is breakage—balances on expired or
              unredeemed gift cards that accrue to the issuer—estimated at 5 to 6% of Qwikcilver revenue. An April 2026
              RBI draft regulation proposing that issuers return unused balances to consumers could eliminate this
              income. Pine Labs has not publicly quantified its breakage exposure, and analysts had not modeled it
              independently as of early 2026 reporting. Beyond India, Pine Labs' branded-payments arm at pinelabs.us
              serves global brands including Zara, Marriott, McDonald's, and Coca-Cola across 10 international markets,
              with 287 million-plus cards issued internationally. In 2026 Pine Labs announced a stablecoin-backed
              prepaid card across nine countries in the Middle East, Africa, and Southeast Asia: customers fund the card
              from stablecoin wallets and balances are converted to local fiat at point of sale, enabling merchants to
              receive local currency. The product will not launch in India or China due to regulatory restrictions on
              digital assets in those jurisdictions.
            claimRefs:
