      - number: '5.5'
        title: AI, Agentic Commerce, and P3P Protocol
        blocks:
          - type: paragraph
            body: >
              Pine Labs' AI strategy operates across two active dimensions: internal workflow automation and
              externalized agentic payment infrastructure. Internally, Pine Labs uses AI to automate daily settlement
              reconciliation, compressing processing time from hours—previously requiring manual checks by dozens of
              employees—to minutes, as described by CEO Amrish Rau to TechCrunch in February 2026. In February 2026,
              Pine Labs announced a partnership with OpenAI to embed OpenAI APIs into its payments and merchant stack,
              initially targeting B2B workflows: invoice processing, settlements, and payment orchestration. The
              platform is intended to be opened to third-party developers as an agentic developer stack. In June 2026,
              Pine Labs launched P3P (Pine Labs Payment Protocol), the first agentic UPI payment protocol operational at
              scale in India. P3P allows an AI agent to browse, select, and pay on a user's behalf after a single
              upfront UPI mandate authorization. It is anchored on UPI's existing Single Block Multiple Debit
              framework—branded UPI ReservePay—and One Time Mandate frameworks. The Grantex layer provides verifiable
              agent identity, delegated authorization, spend controls, and full audit trails. HTTP 402 provides a
              machine-readable open standard for agent-to-agent payment requests. Gullak (digital gold savings platform)
              is the first live merchant on P3P; Vijay Sales (electronics retailer) is in proof-of-concept. P3P is
              currently live only on UPI ReservePay; cards, net banking, wallets, EMI, and stablecoins are on the
              roadmap. Medianama has flagged unresolved liability and privacy questions: there is no published NPCI or
              RBI guidance on who bears liability if an AI agent exceeds its mandate or is compromised.
            claimRefs:
