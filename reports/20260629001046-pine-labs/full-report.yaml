      - number: '6.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Entrenched Enterprise Customer Base with Structural Lock-In
            body: >-
              Pine Labs' deepest customer relationships — enterprise merchants with ERP integration, multi-bank EMI
              subvention workflows, and large device fleets — carry high switching costs that are independent of
              contractual terms. The 200+ bank and NBFC integrations accessible through a single Pine Labs device or API
              represent a competitive moat that smaller PoS providers cannot quickly replicate. Named enterprise brand
              relationships via Qwikcilver (Amazon, Flipkart, Myntra, Croma) further anchor the company to India's
              largest gift-card buying organisations.
