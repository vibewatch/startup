      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >
              Pine Labs' buyer universe divides into four distinct purchasing centers with different budget owners,
              procurement criteria, and monetization profiles. Large enterprise retailers—department store chains, fuel
              retailers, hospitality groups, and airline integrations—form the anchor customer base. Their treasury and
              IT departments own the payment infrastructure budget; adoption is typically triggered through bank
              acquirer relationships, branded EMI programs, or loyalty deployments. This segment provides the highest
              per-terminal revenue and longest contract durations.


              Small and medium merchants—kirana stores, quick-service restaurants, standalone pharmacies, and petrol
              pump dealers—represent the largest total addressable count by merchant number. Their adoption is triggered
              by government subsidies through the Payments Infrastructure Development Fund, zero-cost QR sticker
              campaigns, or fintech peer referrals. Monetization per merchant is lower but improves materially when the
              merchant adopts software subscriptions for GST billing, inventory management, or analytics.


              Financial institutions—banks, NBFCs, and co-branded card issuers—constitute a third buying center that
              pays for Pine Labs' issuing infrastructure and card management APIs, with selection criteria emphasizing
              regulatory compliance, platform uptime, and white-label capability. Pine Labs' 177 financial institution
              partners and 716 consumer brands reflect the breadth of this enterprise relationship layer. Enterprise
              brands and corporate HR departments form a fourth center, purchasing gift card and rewards infrastructure
              through Qwikcilver with marketing and HR budget owners—a segment with the highest margin profile within
              Pine Labs' Issuing and Acquiring Platform.
