      - number: '6.2'
        title: 'Named Customer Proof: Banks, Brands, and Enterprise Deployments'
        blocks:
          - type: paragraph
            body: >
              Pine Labs' named customer disclosures separate into three evidentiary quality levels. The highest-quality
              proof comes from brand-level Qwikcilver deployments: Amazon India, Flipkart, Myntra, and Croma are
              explicitly named in the company's media releases and analyst literature as active enterprise customers of
              the gift card and prepaid solutions unit. These are production relationships with ongoing daily
              transactions, and Qwikcilver's estimated ~30% contribution to consolidated revenue confirms the
              materiality of enterprise brand engagement. The approximately 90% share of India's organised gift card
              market that Pine Labs claims to hold through Qwikcilver further evidences entrenched enterprise brand
              adoption.


              The second evidentiary level covers bank and financial institution partnerships with dated press-release
              confirmation: Wio Bank (UAE, Credit+ acquiring platform, January 2026), Karnataka Bank (India, advanced
              PoS for retail/MSME branch network, April 2026), and Pan Asia Bank (Sri Lanka, Credit+ cloud-native card
              issuing and processing). These announcements confirm contractual relationships at inception but disclose
              no operational volumes, merchant throughput, or annual recurring revenue attributable to each partner.


              The third and weakest level is Pine Labs' shareholder letter and investor presentation claim to "power top
              5 banks, top 5 retailers, top 3 petroleum companies, and top 3 e-commerce/quick-commerce companies" in
              India. This marketing statement, repeated across multiple filings and BSE presentations, has not been
              corroborated by any named third-party disclosure. Diligence must treat it as unverified until specific
              counterparty names are confirmed. The GCash partnership (Philippines, May 2026) adds a channel-mediated
              proof point: it demonstrates that Pine Labs infrastructure supports mass MSME merchant adoption at scale,
              but the direct commercial relationship is with GCash, not the individual end-merchants.
            claimRefs:
