  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Tax Risk
        blocks:
          - type: paragraph
            body: >
              Pine Labs operates under multi-layered regulatory oversight from the Reserve Bank of India (RBI),
              Securities and Exchange Board of India (SEBI), and state GST authorities, creating a persistent compliance
              burden for the company's post-IPO lifecycle. In March 2026 the RBI imposed a monetary penalty of Rs 3.10
              lakh on Pine Labs for issuing Full-KYC Prepaid Payment Instruments (PPIs) without completing mandatory KYC
              verification for all holders—a lapse uncovered during a statutory inspection covering July 2024 to May
              2025. The penalty, while financially immaterial, signals ongoing supervisory scrutiny of Pine Labs' PPI
              operations and KYC processes at scale. Far more consequential is Pine Labs' aggregate GST exposure of over
              Rs 310 crore disclosed in its DRHP. The largest component—Rs 214.11 crore—was confirmed by a Joint
              Commissioner order in Bengaluru in February 2025, arising from alleged wrongful availing of input tax
              credit on co-branding, e-commerce marketplace fees, and advertising expenses from July 2017 to March 2024.
              In February 2026 a separate Rs 37.33 crore GST demand linked to Qwikcilver's FY20 liabilities was issued
              when Pine Labs' appeal was rejected; the company is now appealing to CESTAT. Estimated interest liability
              on the GST matters totals Rs 95.57 crore as of December 2024. On the income-tax front, Pine Labs
              challenged reassessment notices for assessment years 2019-20 and 2021-22 (issued under Sections 148 and
              148A of the Income Tax Act) via writ petitions filed before the Delhi High Court in October 2025. The
              outcome remains pending; an adverse ruling would crystallise additional direct-tax liability. The RBI
              published a Draft Master Direction on PPIs in April 2026 for public consultation, containing a provision
              that would require transfer of outstanding balances in expired or inactive PPIs to the Depositor Education
              and Awareness (DEA) Fund rather than allowing issuers to recognise them as breakage income. Pine Labs'
              DRHP itself acknowledges breakage income as an accounting revenue line from unutilised prepaid card
              balances, even though its CFO publicly stated that zero income accrues from breakage on co-branded gift
              cards issued for partner brands. Entrackr's investigation estimated Qwikcilver's breakage at 5-6 percent
              of its Rs 700 crore gift-card revenue; if the RBI direction is finalised in its current form, this
              high-margin stream would be extinguished, creating a disproportionate drag on profitability given
              near-zero associated costs. The direction of regulatory travel—mandatory return of unspent PPI balances—is
              unambiguous, and Pine Labs has not publicly quantified the exact impact for investors.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
