      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses'
        blocks:
          - type: paragraph
            body: >
              India's merchant commerce market defies single-number characterization because Pine Labs participates
              across four distinct segments each measured independently. The broadest lens—India's total digital payment
              value—reached approximately INR 117 lakh crore (USD 1.4 trillion) in FY2025 and is projected to reach INR
              276 lakh crore (approximately USD 3.3 trillion) by FY2029 per Redseer's model cited in Pine Labs' DRHP.
              This TAM overstates the serviceable pool because it includes institutional transfers and P2P flows outside
              Pine Labs' product scope.


              Segment-specific estimates provide a calibrated lens. India's POS terminal hardware market stood at USD
              1.2 billion in 2025 and is projected to reach USD 2.0 billion by 2030 at a 10.3% CAGR per IHL Group, which
              designates India the fastest-growing POS market globally. The India payment gateway market—relevant to
              Pine Labs' Plural online platform—was valued at USD 2.07 billion in 2025 and forecast to reach USD 2.31
              billion in 2026 at an 11.66% CAGR toward USD 4.01 billion by 2031 per Mordor Intelligence; MarkNtel
              Advisors corroborates a similar figure at 9.69% CAGR. India's gift card and incentive card market reached
              USD 12.65 billion in 2025, expected to grow to USD 13.65 billion in 2026 and USD 20.71 billion by 2030 at
              8.70% CAGR per Mordor Intelligence, with corporate programs commanding 61% of value.


              India's BNPL and checkout credit market is estimated at USD 30.45 billion in 2026 (ResearchAndMarkets,
              15.5% CAGR toward USD 62.61 billion by 2031), though Mordor Intelligence cites USD 37.03 billion for the
              same year—a 22% discrepancy reflecting differing scope definitions for embedded credit instruments. Pine
              Labs processed INR 11.4 lakh crore (approximately USD 136 billion) GTV in FY25 across 5.7 billion
              transactions and reported first full-year profitability in FY26 with operating revenue of INR 2,710 crore.
