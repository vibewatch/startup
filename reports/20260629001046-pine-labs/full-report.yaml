      - number: '3.7'
        title: Exhibits
        blocks:
          - type: callout
            title: RBI Breakage Regulation Threatens Qwikcilver's High-Margin Income Stream
            body: >-
              The RBI's April 2026 draft Master Direction on Prepaid Payment Instruments proposes requiring issuers to
              return unused balances to customers on expiry, effectively eliminating breakage income—a near-zero-cost
              revenue stream that flows almost directly to profit. Sources estimate breakage at 5–6% of Qwikcilver's
              gift card revenue. Pine Labs has not publicly quantified this exposure. If implemented in its current
              form, the impact on the company's first-ever profitable year (FY26 net profit INR 113 crore) could be
              disproportionate given breakage's exceptionally high margin profile. No analyst research reviewed models
              this scenario.
            calloutType: risk
            claimRefs:
              - CP026
              - CP027
          - type: callout
            title: QR Code Proliferation Creates Structural Ceiling on Small-Merchant POS Economics
            body: >-
              India had 352 million UPI QR codes deployed versus only 8.9 million POS terminals as of February 2025, and
              QR stickers cost merchants essentially nothing. At zero MDR on UPI, the POS rental economics hold only
              where card acceptance yields incremental basket size or is required by merchant type. PhonePe's SmartPOD
              now offers card acceptance in a form factor close to Paytm's Soundbox cost curve, narrowing Pine Labs'
              ability to upsell hardware in the small-merchant segment. This structural dynamic will pressure Pine Labs
              to extract more value from software, EMI, and data layers—segments where it faces well-resourced rivals.
            calloutType: risk
            claimRefs:
              - CP029
              - CP035
          - type: callout
            title: Hardware-Software Integration and Multi-Bank EMI Create Durable Mid-Market Advantage
            body: >-
              Pine Labs' most defensible position is in organised mid-market retail where card volumes justify POS
              rental, EMI at checkout drives conversion, and software integrations with HR, inventory, and analytics
              create operational switching costs. The 1.9 million installed terminal base with a 5–6 year device
              lifecycle means merchant switching costs are high in this segment. Multi-bank EMI across 20+ banking
              partners delivers a seamless affordability product that bank-native EMI programmes cannot replicate across
              all lenders simultaneously, giving Pine Labs a meaningful role in high-ticket discretionary retail through
              this window.
            calloutType: strength
            claimRefs:
              - CP001
              - CP032
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Mix, and Recognition Basis
        blocks:
          - type: paragraph
            body: >
              Pine Labs reported consolidated revenue from operations of Rs 2,711 crore for FY26, up 19% year-on-year
              from Rs 2,274 crore in FY25, itself a 28.5% gain over FY24's Rs 1,769 crore. Revenue is generated across
              two reportable segments. The Digital Infrastructure and Transaction Platform (DITP) segment—covering
              in-store and online payment acceptance, value-added services, affordability EMI infrastructure, and
              fintech API services including BBPS, UPI switch, and account aggregation—contributed Rs 1,836.82 crore, or
              approximately 68% of FY26 consolidated revenue. The Issuing and Acquiring Platform (IAP) segment—prepaid
              gift cards, co-branded programs managed through Qwikcilver, and embedded issuing for banks—contributed Rs
              873.77 crore, or 32%, growing at 42% YoY in Q3 FY26 versus DITP's 16%, making it the faster-growing
              segment.


              A material accounting policy disclosed in the Q2 FY26 shareholder letter: Pine Labs recognizes revenue on
              a net basis, stripping out payment processing fees and passthrough charges paid to acquiring banks and
              card networks before recognizing revenue. This differs from some Indian fintech peers that report gross
              transaction flows and inflates their apparent revenue scale relative to Pine Labs. Standalone entity
              revenue for FY26 was Rs 1,926.09 crore—Rs 785 crore below the consolidated figure—with standalone PAT of
              Rs 149.88 crore exceeding consolidated PAT of Rs 112.51 crore, indicating international subsidiaries
              reduce group profitability.


              International revenue crossed Rs 403 crore in FY26, approximately 15% of consolidated revenue, up from 9%
              three years prior, with a reported 44% three-year CAGR. Southeast Asian and Middle East expansion drove
              this growth, and international momentum was cited as a key Q4 FY26 revenue driver. Revenue growth
              decelerated from 28.5% YoY in FY25 to 19% in FY26 and further to 17% in Q4 FY26, a trend worth monitoring
              for structural vs. seasonal interpretation.
