            title: P3P liability and regulatory governance gap
            body: >
              The P3P agentic payment protocol enables autonomous AI-driven UPI debits after a single mandate. No
              published NPCI or RBI guidance addresses liability when an AI agent exceeds its mandate, is compromised,
              or acts erroneously. This governance vacuum poses regulatory and reputational risk to Pine Labs and to
              merchant and developer partners building on the protocol.
