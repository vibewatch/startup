  - id: FU001
    title: 'Pine Labs Customer Journey: Discovery to Expansion by Segment'
    type: journey-map
    layout: wide
    summary: >-
      Illustrates how each of Pine Labs' three buyer tiers enters, adopts, and deepens engagement, highlighting the
      divergent switching cost and expansion dynamics across enterprise merchants, SMB merchants, financial institution
      partners, and enterprise brands.
    data:
      nodes:
        - id: discover
          label: Discovery
          description: Merchant/brand/FI discovers Pine Labs via direct sales, bank referral, or distributor channel
        - id: evaluate
          label: Evaluation
          description: Assess EMI bank coverage, integration complexity, device options, and pricing vs alternatives
        - id: onboard
          label: Onboarding
          description: Contract signed; PoS device deployed, API integrated, or Credit+ platform provisioned
        - id: active
          label: Active Use
          description: Daily transactions processed; EMI offers surfaced; gift card programs live
        - id: expand
          label: Expansion
          description: Additional terminals, new product lines (BNPL, loyalty, Shopflo checkout), new geographies
