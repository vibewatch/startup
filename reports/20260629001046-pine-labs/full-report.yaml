      - number: '1.3'
        title: Capital Base, IPO Structure, and Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              The capital story is notable for both depth and reset. Pine Labs reached public markets through a 2025 IPO
              process that, according to the prospectus and SEBI filing trail, began with draft offer documents in July
              2025, shifted into an October 2025 red herring prospectus, and targeted trading in mid-November 2025. The
              offer structure combined a fresh issue of up to Rs 20.8 billion with a large offer for sale from
              long-standing investors and insiders including Peak XV, Actis, Macritchie/Temasek, PayPal, Mastercard,
              Invesco, Madison India, Lone Cascade, Sofina, and Lokvir Kapoor. That validates both institutional
              sponsorship and secondary liquidity pressure. Public operating scale is also large enough to matter: Pine
              Labs disclosed 4,465 employees as of June 2025, while 2026 reporting tied the platform to 198
              financial-institution partnerships, about 690 consumer brands, 5.7 billion FY25 transactions, and 954,000
              merchants. But the capital file is still incomplete on lifetime money raised, current free-float dynamics,
              and exact post-IPO ownership concentration, so some investor-level questions remain open.
