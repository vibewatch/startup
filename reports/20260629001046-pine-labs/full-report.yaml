      - number: '4.4'
        title: Capital Adequacy, IPO Proceeds, and Financing Structure
        blocks:
          - type: paragraph
            body: >
              Pine Labs completed its IPO in November 2025, raising Rs 3,899.91 crore in total: Rs 2,080 crore via fresh
              issue priced at Rs 221 per share and Rs 1,819.91 crore via an offer for sale from Peak XV, Temasek,
              PayPal, Mastercard, and other existing investors. The shares listed at Rs 242 on November 14, 2025—a 9.5%
              premium—but have since declined to approximately Rs 146–152 by late June 2026, approximately 34% below the
              IPO price and about 45% below the post-listing high of Rs 283. At Rs 146, the implied market
              capitalization is approximately Rs 16,842 crore, and the trailing P/E ratio is approximately 143–145x on
              FY26 consolidated earnings of Rs 113 crore.


              Of the Rs 2,080 crore fresh issue, Rs 532 crore was allocated to debt repayment, Rs 760 crore to
              technology and cloud infrastructure, and the remainder to international expansion, working capital, and
              general corporate purposes. As of the Q4 FY26 results announcement in May 2026, approximately Rs 797 crore
              of proceeds had been deployed, primarily for debt reduction. Cash and cash equivalents reached Rs 1,273.9
              crore at March 31, 2026—up from Rs 245.2 crore a year earlier—providing approximately 24 months of
              operating coverage at current rates. In April 2026, Pine Labs signed an agreement to acquire Shopflo
              Technologies (D2C checkout platform) for Rs 88 crore, deploying additional IPO capital. Residual interest
              expense of Rs 70.39 crore (standalone FY26) confirms borrowings remain outstanding despite partial
              repayment.
