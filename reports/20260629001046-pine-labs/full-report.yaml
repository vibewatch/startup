  - id: FV001
    title: Pine Labs Recommendation Logic — Chain from Evidence to Stance
    type: flow
    layout: standard
    summary: >
      Decision chain from four evidence pillars—scale/growth proof, profitability trajectory, risk-adjusted multiple,
      and unresolved overhang—converging on a Track recommendation with medium confidence and a Rs 207
      probability-weighted intrinsic value.
    data:
      nodes:
        - id: growth-proof
          label: Revenue growth 19% FY26; FY27 guidance 21–23.5% (hard); Q1 FY27 tracking
        - id: margin-progress
          label: Adj. EBITDA margin 21%, +500bps YoY; ESOP drag normalising post-IPO
        - id: valuation-context
          label: EV/Rev 3.91x vs sector 4–6x; below sector median at current price
        - id: risk-overhang
          label: GST Rs 347+ Cr unresolved; breakage unverifiable; OCF timing distorted
        - id: cash-buffer
          label: Net cash Rs 7,785 Cr; Rs 67.80/share floor; 42% of market cap
        - id: track-recommendation
          label: 'Stance: Track (medium confidence); PW intrinsic value Rs 207 (+30%)'
    approximationNotes: >
      Probability-weighted value of Rs 207 uses 25/50/25 weights for bull (Rs 272), base (Rs 208), and bear (Rs 140)
      scenarios. These weights are analytical estimates, not option-implied probabilities.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV010
  - id: FV002
    title: Pine Labs Share Price Sensitivity to EV/Revenue Multiple — FY27 Consensus Revenue
    type: bar
    layout: standard
    summary: >
      Per-share price implied at each EV/FY27E revenue multiple (Rs 3,252 crore consensus revenue, net cash Rs 7,785
      crore, 1,148M shares). Current price of Rs 160 sits below the 4x level, implying the market prices in a
      sub-sector-average multiple.
    data:
      items:
        - label: 3x EV/Rev (bear)
          value: 153
        - label: 4x EV/Rev (sector floor)
          value: 181
        - label: 5x EV/Rev (base / consensus)
          value: 209
        - label: 6x EV/Rev (sector mid)
          value: 238
        - label: 7x EV/Rev (bull / Adyen range)
          value: 266
    approximationNotes: >
      Values computed as: (EV multiple × Rs 3,252 crore) + Rs 7,785 crore net cash, divided by 1,148 million shares. Net
      cash held constant; no GST haircut applied (varies by scenario). FY27 revenue of Rs 3,252 crore is the S&P Global
      Market Intelligence analyst consensus.
    claimRefs:
      - CV006
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: Valuation Range — Bull / Base / Bear Per-Share Scenarios
    type: range
    layout: standard
    summary: >
      Low/mid/high per-share valuation under three scenario assumptions for FY27 revenue, EV/revenue multiple, and GST
      liability outcome. Bear scenario includes compression to 3x multiple; bull assumes 7x re-rating. Current price Rs
      160 lies below all three mid-points, suggesting embedded upside even in the base case.
    data:
      items:
        - label: Bear (3x EV/Rev, 7% growth, full GST)
          low: 120
          high: 155
          mid: 140
        - label: Base (5x EV/Rev, 21% growth, partial GST)
          low: 190
          high: 230
          mid: 208
        - label: Bull (7x EV/Rev, 23.5% growth, GST resolved)
          low: 245
          high: 310
          mid: 272
    approximationNotes: >
      Ranges within each scenario reflect variability in net cash deployed (Shopflo, technology capex), quarterly
      revenue timing, and ESOP dilution. Low/high bounds use ±15% around the mid for structural uncertainty, not formal
      Monte Carlo estimation.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV003
