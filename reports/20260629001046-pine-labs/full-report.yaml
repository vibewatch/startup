        title: Milestones, Expansion, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 milestone stream shows real product and geographic momentum, but not a clean risk-free
              ascent. Pine Labs used official media channels and exchange disclosures to reinforce an expansion
              narrative: entry into the Philippines through GCash for Business, a Wio Bank merchant-acquiring
              partnership in the UAE, an OpenAI collaboration around agentic commerce, and a P3P launch framed as
              India’s first agentic payment protocol on UPI. The annual-results release also said international revenue
              crossed Rs 400 crore in FY26 and approached 15% of total revenue, up from roughly 9% three years earlier.
              Those signals suggest the company is pushing beyond Indian POS roots into software-led, international, and
              AI-inflected merchant infrastructure. At the same time, the public risk file is substantive. RBI fined
              Pine Labs in March 2026 for KYC lapses on prepaid payment instruments, Moneycontrol reported roughly Rs
              310 crore of GST exposure in IPO disclosures, and the prospectus itself details a much larger GST
              show-cause demand plus other litigation. Pine Labs is therefore scaled and strategically active, but the
              diligence stance should remain alert to compliance execution and profitability quality.
