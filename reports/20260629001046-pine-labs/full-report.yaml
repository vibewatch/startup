            title: No NRR/GRR Disclosed; Retention Assessment Relies Entirely on Proxies
            body: >-
              Pine Labs discloses zero cohort-level retention metrics — no NRR, GRR, or merchant churn data — in any
              public filing or investor communication as of June 2026. The NPS of -7 (per Comparably) and active
              consumer complaints about billing irregularities post-cancellation suggest that retention is imperfect,
              particularly in the SMB segment. Investors and diligence teams cannot independently verify the claim that
              customer relationships are sticky without primary-source cohort data.
