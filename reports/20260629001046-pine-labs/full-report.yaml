            title: Multi-rail platform moat with developer and bank network depth
            body: >
              Pine Labs combines a large installed POS device estate, 175-plus bank EMI partnerships, Qwikcilver's deep
              gift card brand relationships, and a REST API and SDK surface tying merchant software and AI tools to the
              same payment rails. This multi-layer presence—hardware, gateway, prepaid, affordability, and
