companyProfile:
  summary: >-
    Pine Labs is an Indian merchant-commerce infrastructure company that combines offline POS acceptance, online gateway
    services, prepaid and gift-card infrastructure, affordability/EMI rails, and merchant software into one multi-rail
    platform. The company was incorporated in 1998, now operates with a Gurugram registered office and Noida corporate
    office, and entered public markets in 2025 after years as a heavily funded private fintech. Under Chairman, Managing
    Director, and CEO B. Amrish Rau, Pine Labs has broadened beyond card terminals into software-led payments
    infrastructure, international merchant-acquiring partnerships, and newer AI-linked payment initiatives, while still
    carrying meaningful compliance, litigation, and disclosure risks.
  foundedDate: '1998-05-18'
  foundingLocation: India
  headquarters: Noida, Uttar Pradesh / Gurugram, Haryana, India
  productSummary: >-
    Offline POS and merchant acceptance, Plural online payments, prepaid/gift and loyalty infrastructure via Qwikcilver,
    EMI/affordability products, and merchant / bank software rails.
  customerFocus: >-
    Merchants, enterprise brands, banks, NBFCs, issuers, and merchant-acquiring partners across India with expanding
    international coverage.
  businessModel: >-
    Net-revenue merchant-commerce monetization built on payment processing, software and value-added services,
    prepaid/gift infrastructure, issuing/acquiring rails, and affordability products.
  stage: Listed / post-IPO public fintech
  fundingStatus: >-
    2025 IPO with Rs 20.8 billion fresh-issue authorization and large OFS; current public market capitalization about
    $2.21B as of June 25, 2026.
