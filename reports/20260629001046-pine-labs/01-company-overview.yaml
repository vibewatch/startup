company:
  name: Pine Labs
chapter:
  number: 1
  title: Company Overview
  summary: Pine Labs' public file shows a 1998-founded merchant-commerce company that repositioned itself around digital payments, issuing, online payments, and merchant software before completing a 2025 IPO. Primary filings and 2026 exchange disclosures support a Noida/Gurugram operating footprint, 4,465 employees as of mid-2025, substantial international expansion, and a leadership structure centered on Chairman, Managing Director, and CEO B. Amrish Rau with a board refreshed for listed-company governance. The same record also shows a meaningful valuation reset into the IPO, a 2026 RBI penalty, and large unresolved tax litigation, so the company is clearly scaled and now public but not low-risk.
sections:
- id: identity-and-platform
  title: Identity and Platform Narrative
  body: 'Pine Labs should be framed as a listed merchant-commerce and payments infrastructure company rather than a narrow card-terminal vendor. The strongest primary source in the current record is the 2025 abridged prospectus, which describes Pine Labs as a technology company focused on digitizing commerce through digital payments and issuing solutions for merchants, consumer brands, enterprises, and financial institutions. That filing aligns with the current website metadata, which markets Pine Labs across POS machines, payment gateway, prepaid, credit, and fintech infrastructure, while the retail and online-payments pages sharpen the operating thesis into omnichannel checkout, loyalty, EMI financing, and secure internet payments. The company’s office footprint is also clearer in current filings than in marketing copy: the registered office sits in Gurugram while the corporate office is in Noida. The resulting picture is a business with Indian roots, public-market disclosure, and a product
    stack spanning offline acceptance, online payments, issuing, prepaid, and merchant software rather than a single product line.'
