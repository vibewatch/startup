callouts:
- calloutType: strength
  title: Public-market disclosure now gives Pine Labs a stronger diligence file than most private Indian fintech peers
  body: The combination of a 2025 prospectus, a 2026 audited-results filing, and current official media releases means Pine Labs can be assessed with materially better evidence than a typical private merchant-payments company. Incorporation details, board identities, office footprint, employee count, IPO mechanics, and current financial disclosure cadence are all visible in primary sources.
  claimRefs:
  - CO001
  - CO002
  - CO009
  - CO010
  - CO013
  - CO018
  - CO039
- calloutType: risk
  title: Scale is clear, but compliance and disclosure quality still deserve active skepticism
  body: Pine Labs is not a clean “IPO solved everything” case. RBI penalized the company in 2026 for KYC lapses on prepaid instruments, the IPO file carries meaningful GST litigation, and several commercially important facts—such as exact current merchant count, post-IPO ownership concentration, and fully reconciled lifetime capital raised—still require deeper diligence than the public file alone provides.
