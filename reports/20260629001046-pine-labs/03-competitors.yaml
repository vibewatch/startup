  - id: affordability-emi
    title: Affordability and EMI/BNPL Competition
    body: >-
      Pine Labs' affordability product—enabling cardless and card-based EMI at offline POS
      through integrations with more than 20 banking partners—addresses the large market of
      discretionary consumer purchases financed at the point of sale. This segment faces both
      legacy NBFC incumbents and digital-native BNPL fintechs, though the competitive
      environment has consolidated significantly under RBI regulatory pressure.

      Bajaj Finserv operates India's largest EMI card network, integrated with millions of offline
      merchants for big-ticket retail purchases; it is the dominant offline captive EMI
      competitor for categories including consumer electronics, white goods, and jewellery.
      India's private banks—HDFC, Axis, ICICI, Kotak, SBI—have steadily embedded EMI options
      directly into their card products and introduced debit-card EMI, reducing the need for
      merchants to rely on a third-party aggregator like Pine Labs for affordability facilitation
      in those ecosystems.

      The India BNPL market is shifting toward embedded, bank-backed models following RBI's 2022–25
      digital lending guidelines requiring all BNPL credit to be on licensed NBFC or bank books.
      This has forced many standalone fintech BNPL operators to pivot, partner with licensed lenders,
      or exit. LazyPay (owned by PayU) enables BNPL and small-ticket EMI across 45,000+ merchants
      and remains one of the leading digital BNPL products in the online segment. ZestMoney offered
      cardless EMI at online and offline points of sale but faced regulatory headwinds.
      Paytm Postpaid provides rolling credit via NBFC partnerships, particularly for bill payments,
      travel, and retail. Pine Labs benefits because the bank-and-NBFC consolidation trend validates
      the multi-bank partner model it already runs through its POS network, but bank-native EMI
      products increasingly bypass independent aggregators entirely.
