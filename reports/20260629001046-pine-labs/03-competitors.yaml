      - - "Qwikcilver dominates India enterprise gift card infrastructure with deep integrations at Amazon, Flipkart, Myntra, Croma"
        - "Zaggle (INR 1,907 Cr FY26 revenue, 50M cards, listed) growing at 46% YoY; RBI April 2026 draft PPI direction threatens breakage income at near-zero cost"
