  - id: online-gateway
    title: Online Payment Gateway Competition
    body: >-
      Pine Labs' online payments vertical—serving large e-commerce clients including Flipkart,
      Myntra, Zepto, and BigBasket—grew 50% year-on-year in Q3 FY26 per company commentary
      reported by Economic Times. Despite this acceleration, Pine Labs competes as a late entrant
      in the online gateway segment against incumbents with larger merchant bases and higher brand
      recognition in digital-first channels.

      Razorpay dominates the online SME payment gateway market, processing more than $180 billion
      in annual GMV across its overall business as of mid-2026 and targeting a $5 billion IPO
      valuation. After acquiring Ezetap for offline POS capability in 2022, Razorpay scaled back
      aggressive offline expansion following sluggish growth: its PoS business revenue in FY25 was
      approximately INR 225 crore, only about 6% of total revenue. The company has refocused on
      omnichannel merchants who need both online and offline solutions, rather than building large
      field teams for POS-only acquisition. This retreat eases near-term competitive pressure on
      Pine Labs' offline turf but signals how difficult the field-execution model is to scale profitably.

      PayU India reported H1 FY26 revenue of $397 million, a 20% year-on-year increase, with the
      payments vertical generating $301 million. Value-added services—fraud detection, multi-factor
      authentication, and SaaS—now contribute 34% of PayU's payments revenue, a strategic pivot
      to protect margins as UPI volume (which is zero-MDR) rises. PayU processed $640 million in
      loans during H1 FY26, with embedded credit accounting for a growing share of its monetisation.

      Cashfree Payments reported revenue nearing INR 1,000 crore for FY26 and achieved EBITDA
      profitability for the first time. Its active merchant base grew 50% in FY26, SMB gross
      transaction value more than doubled, and cross-border GTV grew eightfold between March 2025
      and March 2026. BillDesk's acquisition of Worldline further crowds the omnichannel gateway
      segment. Pine Labs' online vertical must accelerate against these established players to
      justify its omnichannel positioning.
