  - id: gift-card-loyalty
    title: Gift Card, Prepaid and Loyalty Competition
    body: >-
      Pine Labs' Qwikcilver subsidiary—acquired in March 2019 for approximately $110 million—is
      the dominant gift card infrastructure provider in India, powering programmes for Amazon,
      Flipkart, Myntra, Croma, and hundreds of enterprise reward and loyalty clients. Pine Labs
      issued 87 crore prepaid cards annually in FY26, up from 71 crore the prior year, per Entrackr.
      Sources familiar with Qwikcilver's financials told Entrackr that the subsidiary contributes
      approximately INR 800 crore, or about 30%, to Pine Labs' consolidated annual revenue.

      Zaggle Prepaid Ocean Services (BSE: ZAGGLE) is Pine Labs' most directly comparable public
      rival in this segment. Zaggle reported FY26 revenue of INR 19,076 million (approximately
      INR 1,907 crore), growing 46.3% year-on-year, with profit after tax of INR 1,388 million
      growing 51.8% YoY. Zaggle had issued over 50 million prepaid cards and served 3.9 million
      users as of March 31, 2026, and is expanding internationally into MENA and the United States.
      Its platform combines prepaid card issuance, SaaS spend management, and a consumer retail
      credit card, giving it a broader monetisation stack than a pure gift card issuer.

      India's gift card and incentive card market is projected to reach $13.65 billion in 2026
      and grow to $20.71 billion by 2030, per Mordor Intelligence estimates, supporting room for
      multiple operators. Other competitors include GyFTR (Vouchagram India) in digital vouchers,
      Sodexo and Edenred in corporate prepaid and meal benefits, and Amazon Pay and Flipkart
      gift cards which challenge the consumer-facing end of the market.

      A material and previously undisclosed regulatory risk was exposed in Entrackr's June 2026
      investigation: the RBI published a draft Master Direction on Prepaid Payment Instruments
      on April 22, 2026 proposing that unused balances on prepaid instruments be returned to
      the holder's source account upon expiry or closure, which would effectively eliminate
      "breakage" income—the high-margin revenue earned by gift card issuers on unredeemed balances.
      Sources estimate breakage accounts for approximately 5–6% of Qwikcilver's gift card revenue,
      with near-zero incremental cost, making it disproportionately impactful on profitability.
      Pine Labs has not publicly quantified this income stream.
