  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - GST liability crystallises in full
        - CESTAT ruling upholds Rs 214+ crore DGGI demand; total exposure exceeds Rs 347 crore
        - Rs 347 crore cash outflow reduces net cash cushion by 4.5%; PAT erosion >3 FY26 annual profits
        - Downgrade to avoid; re-run valuation with reduced net cash and elevated regulatory risk premium
      - - FY27 revenue misses guidance by > 5%
        - Q1 FY27 or Q2 FY27 revenue below Rs 800 crore on a run-rate basis; guidance withdrawn or narrowed
        - Multiple compression from 5x to 3–3.5x; bear case becomes base case; analyst target cuts
        - Exit or reduce position; reassess after one full clean quarter
      - - RBI PPI regulation adversely rules on breakage
        - April 2026 draft Master Direction finalised requiring unused PPI balances returned; directly impacts IAP
        - IAP segment (32% of revenue, Rs 874 crore) revenue/margin impacted; gift-card breakage income eliminated
        - Full segment re-valuation; IAP multiple collapses to 1.5x EV/revenue; SOTP loss Rs 2,000–3,000 crore EV
      - - OCF normalized below Rs 150 crore for two consecutive quarters
        - H1 FY27 operating cash flow totals less than Rs 300 crore; suggests Q4 FY26 timing was structural, not timing
        - Bear case OCF assumption confirmed; discounted cash-flow value falls materially
        - Reassess cash generation quality; potentially reclassify FY26 OCF as non-recurring
      - - Key executive departure or governance breach
        - CEO Amrish Rau departure; repeat KYC/compliance penalty from RBI; new audit qualification in FY26
        - Management confidence collapse; institutional investors de-rate governance premium
        - Reduce position immediately pending replacement and explanation
      - - Competitor material DCP share gain in enterprise
        - Paytm, Razorpay, or Stripe India displaces Pine Labs in an enterprise customer representing >5% of revenue
        - Network effect thesis weakens; take-rate pressure increases; DCP growth stalls below 10%
        - Monitor quarterly DCP count and VAS attachment rate; flag if DCP growth < 8% for two quarters
    notes: >
      Triggers are defined to be measurable on publicly available data (NSE exchange disclosures,
      quarterly results, regulatory notifications). "Revenue miss" is relative to management's
      "hard guidance" of 21% growth from the Q4 FY26 earnings call. OCF normalization threshold
      reflects the estimated Rs 200–280 crore annual range from the financials chapter analysis.
    claimRefs:
      - CV024
      - CV033
      - CV025
      - CV038

  - id: TV006
    title: Final Diligence Asks Before High-Conviction Entry
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Owner / Path
    rows:
      - - GST contingent liability timeline
        - CESTAT hearing date; probability assessment by external tax counsel; interest accumulation rate
        - Rs 347+ crore tail risk >3x annual PAT; sizing affects both bear/base case and credit for net cash
        - Pine Labs legal team; CESTAT public docket; ask management on earnings call
      - - Breakage income quantum
        - Exact breakage amounts managed by Qwikcilver across all program structures (co-branded vs. closed-loop)
        - Company's June 16, 2026 denial cannot be independently verified without disclosed breakage quantum
        - Request specific disclosure from management or review audited sub-ledger; probe at next analyst meeting
      - - Subsidiary-level PAT breakdown
        - Country-level P&L for international subsidiaries (Malaysia, UAE, Singapore, Australia, Africa)
        - Rs 37 crore PAT drag from international operations cannot be modelled without knowing which markets are profitable
        - Request in post-Q4 analyst meeting; compare standalone vs consolidated segment disclosures
      - - IAP segment gross margins
        - Segment-level gross margins for DITP vs IAP separately
        - Cannot perform credible SOTP; may reveal IAP is cross-subsidised by DITP in consolidated P&L
        - Analyst day disclosure request; cross-check with Qwikcilver-specific margins if ever disclosed
      - - Normalized OCF trajectory
        - 'Q1 FY27 and Q2 FY27 quarterly OCF results (next: July 28, 2026 earnings)'
        - Two clean quarters of Rs 100+ crore OCF each would confirm Rs 400+ crore annual run rate; one quarter doesn't
        - FY27 Q1 results (estimated July 28, 2026); compare to Q4 FY26 to confirm no reversal
      - - ESOP grant schedule and dilution
        - June 19, 2026 NRC approved 26.1M new ESOP grants; full vesting schedule and dilution impact
        - ESOP dilution adds to share count; ESOP expense run-rate post-normalisation affects adjusted EBITDA quality
        - NSE exchange filing post-NRC approval; model fully diluted share count at 1,174M (10% dilution implied)
    notes: >
      Diligence asks are ordered by impact on valuation precision. The GST and breakage items are
      thesis-critical and should be resolved before increasing position size above 1–2% of portfolio.
      Normalized OCF and ESOP dilution are model-tuning items that refine per-share intrinsic value
      but do not change the fundamental bull/base/bear structure.
    claimRefs:
      - CV024
      - CV033
      - CV026
      - CV025
      - CV039

