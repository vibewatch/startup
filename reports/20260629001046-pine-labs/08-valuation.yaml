  - id: revenue-and-earnings-multiples
    title: Revenue, Earnings, and Cash Flow Multiple Analysis
    body: |
      On a revenue basis, Pine Labs' enterprise value of Rs 10,595 crore divided by FY26
      consolidated revenue of Rs 2,711 crore yields an EV/revenue multiple of 3.91x—already near
      the low end of the 4–6x range cited for payment processing companies in Windsor Drake's June
      2026 M&A data, and slightly above the payments sector median of 3.6x from Finro's 416-company
      dataset. On a price-to-sales basis including the net cash, the market capitalisation implies
      6.78x FY26 revenue, reflecting the embedded cash value.

      On an earnings basis, the gap between GAAP and adjusted metrics creates significant
      interpretation risk. FY26 consolidated PAT of Rs 112.51 crore yields a trailing P/E of
      approximately 157x, while GAAP EBITDA of Rs 364 crore (including ESOP cost normalisation)
      yields an EV/EBITDA of 29.15x. By contrast, management-reported adjusted EBITDA of Rs 559
      crore strips ESOP and non-cash charges, reducing EV/adj. EBITDA to 18.9x—meaningfully
      different from the headline figure. Given that ESOP normalisation should persist post-IPO
      as grants stabilise, the adjusted EBITDA lens is the more defensible earnings proxy, but
      investors must audit the reconciliation before treating it as GAAP-equivalent.

      On a standalone versus consolidated basis, Pine Labs' standalone PAT of Rs 149.88 crore
      exceeds consolidated PAT of Rs 112.51 crore by Rs 37 crore, reflecting international
      subsidiaries that are collectively loss-making at the PAT level. An earnings multiple
      applied to consolidated figures prices in international drag; a SOTP using standalone
      India DITP revenue (approximately Rs 1,437 crore implied) at higher software multiples
      would be additive, but segment-level gross margins to support SOTP are not publicly disclosed.
      The PEG ratio of 0.68—based on a three-year forward EPS growth forecast of 87.82%—is
      well below 1, suggesting earnings growth more than justifies the current forward multiple
      if guidance is met. Normalised free cash flow of Rs 157 crore (operating cash flow Rs 395
      crore less capex Rs 238 crore) yields a P/FCF of 117x, while the q4-timing-adjusted OCF
      of Rs 200–280 crore normalised implies P/OCF closer to 66–92x.
