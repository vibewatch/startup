  - id: scenario-analysis
    title: Bull / Base / Bear Scenario Valuation
    body: |
      Scenario analysis uses FY27 revenue as the primary driver with EV/revenue as the valuation
      anchor, supplemented by net cash of Rs 7,785 crore and 1,148 million shares outstanding.
      Sensitivity to the FY27 revenue assumption (range Rs 2,900–3,350 crore) and EV/revenue
      multiple (range 3–7x) produces a per-share range of approximately Rs 120–310.

      Bull case (probability weight: 25%): Revenue reaches Rs 3,346 crore (23.5% guidance top);
      adjusted EBITDA expands to 24% (Rs 803 crore) as operating leverage and mix shift to VAS
      take hold; GST dispute resolved in Pine Labs' favour with no cash outflow; gift-card
      breakage controversy proves immaterial; market awards a 7x EV/FY27 revenue re-rating in
      line with Adyen and top-quartile Indian fintech. EV = Rs 23,422 crore; add net cash
      Rs 7,785 crore → market cap Rs 31,207 crore → Rs 272 per share (+70% from Rs 160).
      Catalysts: three consecutive profitable quarters, FY27 Q1 results above guidance, GST
      ruling, RBI breakage draft Master Direction clarified as non-applicable.

      Base case (probability weight: 50%): Revenue reaches Rs 3,252 crore (21% guidance bottom);
      adjusted EBITDA at 22–23%; GST liability partially provisioned at Rs 174 crore (50%
      probability); multiple of 5x EV/FY27 revenue—at the midpoint of the payment processing
      benchmark range. EV = Rs 16,260 crore; add net cash net of partial GST Rs 7,611 crore →
      market cap Rs 23,871 crore → Rs 208 per share (+30% from Rs 160). This scenario aligns
      with the analyst consensus price target of Rs 205.75.

      Bear case (probability weight: 25%): Revenue grows only 7% to Rs 2,900 crore (chip
      shortages persist, Middle East softness worsens, affordability segment headwinds); full
      GST liability materialises (Rs 347 crore cash outflow); RBI draft PPI rules adversely
      affect breakage income; multiple compresses to 3x EV/revenue (sector median for distressed
      POS peers). EV = Rs 8,700 crore; add net cash net of full GST Rs 7,438 crore → market
      cap Rs 16,138 crore → Rs 140 per share (-13% from Rs 160). Probability-weighted intrinsic
      value: 0.25 × Rs 272 + 0.50 × Rs 208 + 0.25 × Rs 140 = Rs 207 per share, approximately
      30% above current price, suggesting the stock is modestly undervalued at current levels
      if the base-case assumptions hold and the bear case is not more probable than 25%.
