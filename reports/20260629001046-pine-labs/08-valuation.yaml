  - id: comparable-set
    title: Comparable Set — Public, Private, and Cross-Border Peers
    body: |
      The most direct Indian public comparable is Paytm (One97 Communications, NSE:PAYTM), which
      reported FY26 revenue of Rs 8,437 crore (22% growth), EBITDA of Rs 502 crore, and PAT of
      Rs 552 crore. As of June 25, 2026, Paytm trades at a market cap of Rs 72,007 crore and an
      enterprise value of Rs 57,590 crore, yielding EV/revenue of 6.83x and P/E of 131.56x.
      Paytm is 3.1x larger by revenue and 5.4x larger by market cap, so a direct EV/revenue
      comparison must account for Paytm's greater scale, diversified financial-services revenues,
      and longer earnings track. UBS's June 2026 note explicitly flags that Pine Labs' 45%
      valuation discount to Paytm "looks unjustified given Pine Labs' stronger profitability"—a
      view that implies Pine Labs deserves to narrow the gap as profitability normalises.

      Internationally, Adyen (Amsterdam, NYSE:ADYEY) is the most cited quality benchmark for
      payment platform companies, trading at EV/revenue of approximately 7.2x and EV/EBITDA of
      10–12x with gross margins above 60%. Adyen's premium reflects unmatched network effects and
      geographic diversification. Worldline (Paris, EPA:WLN), by contrast, trades at EV/revenue
      of less than 1x and EV/EBITDA of 6.7x, reflecting structural operational challenges and
      negative net income—the low anchor for distressed acquirers.

      Private comparables include Razorpay (India) valued at approximately $9.2 billion in its
      2026 Series G at ~20x EV/revenue on FY26 revenue of ~$455M (Rs 3,783 crore). Razorpay's
      premium reflects its gateway-plus-SaaS positioning, higher gross margins, and private market
      growth premium. At the sector level, Multiples.vc's June 2026 data shows payments POS
      companies at 1.4x EV/revenue and payment infrastructure at 2.1x—the low end of the range.
      The key structural argument is that Pine Labs' combination of POS hardware, VAS, EMI
      affordability, online payments, and issuing/prepaid positions it above a pure POS hardware
      vendor but below a pure software/network fintech, supporting a defensible range of 4–7x
      EV/revenue rather than the sector floor of 1.4x.
