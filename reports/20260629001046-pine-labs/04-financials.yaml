callouts:
  - calloutType: risk
    title: GST Contingent Liability Exceeds Three Years of Current Profits
    body: The confirmed Rs 214.11 crore DGGI demand upheld February 2025, plus estimated Rs 95.57 crore interest and a Rs 37.33 crore Qwikcilver demand upheld February 2026, aggregate to approximately Rs 347 crore—over three times FY26 consolidated PAT of Rs 113 crore. An adverse ruling would not threaten solvency given Rs 1,274 crore in cash, but would eliminate multiple years of current earnings and reduce the IPO treasury materially. No reserve has been disclosed against these claims.
    claimRefs:
      - CI029
      - CI030

  - calloutType: insight
    title: Net Revenue Recognition Makes Pine Labs Incomparable to Gross-Revenue Peers
    body: Pine Labs explicitly recognizes revenue net of bank and card-network pass-throughs, unlike some Indian fintech peers that report gross transaction flows. This makes its Rs 2,711 crore FY26 revenue and implied 0.16% net take rate incomparable on a like-for-like basis to gross-revenue reporters. P/S multiples applied across the sector without adjusting for this difference will systematically overvalue gross-revenue peers or undervalue Pine Labs on comparable operating metrics.
    claimRefs:
      - CI006
      - CI008

  - calloutType: risk
    title: FY26 OCF Is Significantly Inflated by Q4 Early-Settlement Timing
    body: Q4 FY26 operating cash flow of Rs 676 crore—including early settlements—exceeds the full-year reported OCF of Rs 395 crore, which is arithmetically impossible unless Q1 through Q3 collectively produced negative operating cash flow. The Q4 surge reflects accelerated client settlement receipts that are not recurring timing items. Normalized annual OCF is estimated at Rs 200–280 crore, still positive but roughly half the headline figure used in most public analyses of Pine Labs' cash generation profile.
    claimRefs:
      - CI021
      - CI038

