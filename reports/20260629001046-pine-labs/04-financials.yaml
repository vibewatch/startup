  - id: TI005
    title: Public Financial Gaps — Key Metrics Not Disclosed
    columns:
      - Missing Metric
      - Why Absent
      - Investor Impact
      - Diligence Path
    rows:
      - - Segment-level gross margin (DITP vs IAP separately)
        - Indian GAAP two-segment disclosure gives contribution margin but not gross margin by segment
        - Cannot value segments independently; IAP drag on profitability is unquantifiable
        - Request in analyst or IR interaction; compare with any peer segment disclosures
      - - CAC and merchant payback period
        - Not standard Indian listed-fintech disclosure; no regulatory requirement
        - Cannot model growth economics or LTV/CAC; only enterprise-churn proxy available
        - Private diligence room; cross-check SBI Securities IPO note estimates
      - - Exact breakage income managed by Qwikcilver
        - Not disclosed; Pine Labs disputes it is in its P&L but has not quantified what Qwikcilver manages
        - Uncertainty around IAP segment margin sustainability under RBI April 2026 draft rules
        - Demand AGM shareholder query or formal IR disclosure; review Qwikcilver sub-entity filings
      - - Standalone-to-consolidated PAT reconciliation by subsidiary
        - Rs 37 crore gap (Rs 149.88 crore standalone vs Rs 112.51 crore consolidated) unexplained
        - International subsidiary losses not known by entity; scale and trajectory of Fave losses unknown
        - Request subsidiary financials in IR interaction; check Fave and Qwikcilver RoC filings
      - - Normalized OCF excluding Q4 early settlements
        - Management reports headline OCF including timing items without separate normalization
        - Rs 395 crore reported vs Rs 200–280 crore estimated normalized; material difference for run-rate
        - Request quarterly OCF ex-early-settlement series from IR; review FY26 Annual Report cash flow notes
    notes: |
      All gaps reflect information absent from public exchange filings, audited financial statements, and
      management disclosures reviewed as of June 29, 2026. Some items may be disclosed in the forthcoming
      FY26 Annual Report or investor-day presentations. Breakage and standalone-vs-consolidated gaps are
      the most material to revenue-quality judgment; CAC is most material to growth-thesis valuation.
      Normalized OCF is the most critical near-term quality flag because it affects how confident an
      investor should be in the reported cash generation trajectory.
    claimRefs:
      - CI033
      - CI039
      - CI012
      - CI007

