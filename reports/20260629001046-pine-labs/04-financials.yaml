  - id: cost-structure-and-margin-dynamics
    title: Cost Structure, Margin Dynamics, and Cash Flow Quality
    body: |
      Employee benefits were the largest standalone cost item in FY26 at Rs 753.25 crore, representing approximately 39% of standalone revenue. Other expenses (infrastructure, technology hosting, device costs, and processing fees) were Rs 903.39 crore. Depreciation fell sharply to Rs 192.21 crore in standalone FY26 from Rs 265.99 crore in FY24 and Rs 201.74 crore in FY25, reflecting a stated shift to an asset-light model with reduced physical POS hardware deployment. Interest expense was Rs 70.39 crore (standalone FY26), modestly below FY25's Rs 70.31 crore, indicating borrowings have not been fully retired despite IPO debt repayment.

      The FY25 net loss of Rs 145.5 crore was substantially driven by Rs 114.79 crore in ESOP costs, including settlement of cash-settled awards and modifications ahead of the IPO. Q1 FY26 ESOP expense surged further to Rs 66.04 crore—a 123% YoY increase—due to IPO-related modifications and vesting-period changes. Post-listing normalization of ESOP grants is a key tailwind to sustained profitability going forward. Contribution margin held at 75% for FY26 (Rs 2,041 crore), indicating healthy variable-cost coverage. Adjusted EBITDA rose 57% to Rs 559 crore at a 21% margin, up from 16% in FY25, supported by operating leverage of approximately Rs 50–57 of incremental EBITDA per Rs 100 of incremental contribution margin.

      FY26 operating cash flow was Rs 395 crore, an approximately eightfold increase from Rs 49.7 crore in FY25. However, Q4 FY26 alone generated Rs 676 crore in OCF including early-settlement actions—a figure that exceeds the full-year total and implies Q1 through Q3 combined produced negative operating cash flow. This Q4 surge reflects accelerated client settlements that are a timing benefit, not a recurring structural improvement. Normalized annual OCF, excluding early settlements, is estimated at Rs 200–280 crore—positive but roughly half the headline number used in most public analyses.
