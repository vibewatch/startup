  - id: pricing-gtm-and-sales-efficiency
    title: Pricing, GTM Motion, and Sales Efficiency Proxies
    body: |
      Pine Labs' monetization spans three disclosed pricing mechanisms per the Q2 FY26 shareholder letter: subscription fees per digital checkout point (DCP) per month for in-store infrastructure; GTV take-rate fees for VAS and affordability transactions; and per-transaction processing fees for fintech infrastructure services. The issuing and acquiring business earns a GTV-linked take rate on prepaid and gift card volumes. Explicit per-unit rates are not publicly disclosed in any exchange filing or shareholder communication reviewed.

      An implied blended net take rate of approximately 0.16% can be computed from FY26 consolidated revenue (Rs 2,711 crore) divided by platform GTV ($194 billion, approximately Rs 17 lakh crore at Rs 88 per dollar). This understates the gross merchant discount rate (MDR) exposure, as revenue is recognized net of bank and network pass-throughs, and is far below the 1-3% gross MDR merchants pay at point of sale. The company positions this gap as monetization headroom: GTV grew approximately 50% in FY26 while revenue grew only 19%, meaning volume is scaling faster than revenue capture, which is either a growth opportunity or a structural take-rate drag.

      Subscription-linked revenue from DCPs represented approximately 27% of Q3 FY26 consolidated revenue, and 28% of the DCP base generated value-added services revenue, up 7 percentage points year-on-year, indicating deepening cross-sell penetration on the installed merchant base. CAC and merchant payback period are absent from all public filings; management commentary referencing low enterprise churn is the only proxy available. An implied DCP subscription rate of roughly Rs 75 per device per month can be computed from DITP revenue and DCP count, but the actual contracted rate is undisclosed.
