chapter:
  number: 4
  title: Financials
  summary: Pine Labs delivered its first full-year consolidated profit in FY26—Rs 113 crore PAT on Rs 2,711 crore revenue (up 19% YoY)—with adjusted EBITDA expanding 57% to Rs 559 crore at a 21% margin and operating cash flow reported at Rs 395 crore, though inflated by Q4 early-settlement timing. The November 2025 IPO raised Rs 2,080 crore in fresh capital, primarily deployed for debt repayment, leaving Rs 1,274 crore in cash. Material risks include a Rs 310-plus-crore GST contingent liability exceeding three years of current profits, an unresolved gift-card breakage controversy, auditor-flagged IT control gaps across FY22–FY24, and a stock trading approximately 34% below its IPO price.

sections:
  - id: revenue-streams-and-mix
    title: Revenue Streams, Mix, and Recognition Basis
    body: |
      Pine Labs reported consolidated revenue from operations of Rs 2,711 crore for FY26, up 19% year-on-year from Rs 2,274 crore in FY25, itself a 28.5% gain over FY24's Rs 1,769 crore. Revenue is generated across two reportable segments. The Digital Infrastructure and Transaction Platform (DITP) segment—covering in-store and online payment acceptance, value-added services, affordability EMI infrastructure, and fintech API services including BBPS, UPI switch, and account aggregation—contributed Rs 1,836.82 crore, or approximately 68% of FY26 consolidated revenue. The Issuing and Acquiring Platform (IAP) segment—prepaid gift cards, co-branded programs managed through Qwikcilver, and embedded issuing for banks—contributed Rs 873.77 crore, or 32%, growing at 42% YoY in Q3 FY26 versus DITP's 16%, making it the faster-growing segment.

      A material accounting policy disclosed in the Q2 FY26 shareholder letter: Pine Labs recognizes revenue on a net basis, stripping out payment processing fees and passthrough charges paid to acquiring banks and card networks before recognizing revenue. This differs from some Indian fintech peers that report gross transaction flows and inflates their apparent revenue scale relative to Pine Labs. Standalone entity revenue for FY26 was Rs 1,926.09 crore—Rs 785 crore below the consolidated figure—with standalone PAT of Rs 149.88 crore exceeding consolidated PAT of Rs 112.51 crore, indicating international subsidiaries reduce group profitability.

      International revenue crossed Rs 403 crore in FY26, approximately 15% of consolidated revenue, up from 9% three years prior, with a reported 44% three-year CAGR. Southeast Asian and Middle East expansion drove this growth, and international momentum was cited as a key Q4 FY26 revenue driver. Revenue growth decelerated from 28.5% YoY in FY25 to 19% in FY26 and further to 17% in Q4 FY26, a trend worth monitoring for structural vs. seasonal interpretation.
