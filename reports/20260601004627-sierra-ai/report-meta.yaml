companyProfile:
  summary: >-
    Sierra AI is a 2023-founded enterprise software company led by Bret Taylor and Clay Bavor.
    The company sells multichannel AI agents and related tooling to large enterprises that want
    to automate and improve customer interactions across support, retention, payments, lending,
    healthcare, and other high-volume workflows. By mid-2026 Sierra had raised a $950 million
    Series E at a $15.8 billion post-money valuation after reaching a company-confirmed ARR floor
    above $150 million and claiming service to more than 40% of the Fortune 50.
  founders:
    - name: Bret Taylor
      role: Co-founder and CEO
      background: >-
        Former Salesforce co-CEO, former Facebook CTO, co-creator of Google Maps, and OpenAI board chair.
      claimRefs:
        - CO006
        - CO007
    - name: Clay Bavor
      role: Co-founder
      background: >-
        Former Google Labs lead and long-time Google product executive across Workspace, AR/VR, and Lens.
      claimRefs:
        - CO008
        - CO009
  foundingLocation: San Francisco, California, United States
  headquarters: San Francisco, California, United States
  productSummary: >-
    Sierra’s Agent OS platform lets enterprises build, deploy, and optimize AI agents across chat,
    SMS, WhatsApp, email, voice, and ChatGPT, with products including Agent Studio, Agent SDK,
    Insights, Live Assist, voice capabilities, and agent memory through Agent Data Platform.
  customerFocus: >-
    Large enterprises, especially regulated and customer-intensive businesses in financial services,
    healthcare, telecom, media, retail, and other complex service environments.
  businessModel: >-
    Enterprise software sold through negotiated contracts with a core outcome-based pricing model,
    supplemented where needed by blended or consumption-style pricing for certain interaction types.
  stage: Series E private company
