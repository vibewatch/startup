  - id: diligence-asks-exit
    title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
    body: >-
      Sierra's exit path at a $15.8 billion entry is most likely an IPO in 2027–2028, assuming
      continued ARR growth and a receptive public market for AI software companies. The $950
      million Series E is structurally consistent with a pre-IPO round: the raise is large
      enough to fund operations through an IPO filing window without requiring additional
      primary capital, and the entry of Tiger Global—a firm that has managed public equity
      positions at many portfolio companies at IPO—signals near-term liquidity orientation.
      A strategic acquisition by a hyperscaler (Salesforce, Microsoft, Google, Workday, or
      ServiceNow) is a secondary exit scenario; NICE Systems and Genesys are potential CCaaS
      consolidators but lack the market capitalization to execute a $15+ billion all-cash
      acquisition without structural dilution to their shareholders. The five highest-priority
      data room items before full investment conviction are: (1) ARR by cohort vintage with
      gross revenue retention and net revenue retention, segmented by customer size and vertical;
      (2) gross margin excluding customer success and professional services delivery costs,
      with LLM inference cost as a discrete line item; (3) top-10 customer share of total ARR
      to assess concentration risk; (4) LLM provider agreements, pricing terms, MFN protections,
      and any use-case restrictions relevant to financial services or healthcare deployments; and
      (5) the cap-table waterfall across Series A through E, including liquidation preferences,
      anti-dilution mechanisms, and any ratchet provisions affecting common equity returns.
      The thesis-break triggers—conditions under which the investment thesis is falsified—are:
      (a) ARR growth decelerating below 50% CAGR for two consecutive quarters; (b) departure
      of either co-founder within 12 months of investment; (c) EU AI Act enforcement action
      against a Sierra deployment, triggering regulatory remediation costs and enterprise
      hesitation; (d) OpenAI or Anthropic restricting AI agent access for regulated financial
      services or healthcare workflows; and (e) confirmed loss of any single account representing
      >10% of ARR without a disclosed replacement pipeline. Each trigger has a monitorable
      leading indicator: ARR quarterly velocity, founder LinkedIn and press status, EU DPA
      correspondence, LLM provider policy updates, and customer reference checks at renewal
      intervals. Investors should establish contractual information rights at closing covering
      all five triggers, with quarterly ARR reporting and immediate notification of any
      thesis-break-level events.
