  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Gross margin (%) and gross profit from Sierra AI's income statement, separated from
        customer success and professional services costs, with LLM inference cost as a discrete
        line item.
      whyItMatters: >-
        Gross margin is the most important unit economics indicator for the valuation; without it,
        investors cannot determine whether Sierra AI's delivery model generates SaaS-tier returns
        (70–80%) or services-tier economics (40–60%), a difference that moves the fair-value
        multiple by 30–50%.
      diligencePath: >-
        Request trailing-8-quarter P&L or gross profit figure from the data room; separately
        request inference cost by model provider.
      relatedQuestionRefs:
        - QV018

    - type: private-evidence-only
      severity: blocking
      topic: net-revenue-retention
      missingEvidence: >-
        Net revenue retention (NRR) and gross revenue retention (GRR) by customer cohort vintage
        (2024, 2025, 2026) and by customer segment (Fortune 50, mid-market, vertical).
      whyItMatters: >-
        A company growing at 100%+ CAGR could mask significant underlying churn from new logos
        alone; without cohort-level NRR, the quality and durability of the ARR base cannot be
        assessed.
      diligencePath: >-
        Request cohort-level NRR and GRR by year of first contract; include logo churn by segment
        and contract size bracket.
