  - id: TV006
    title: Final Diligence Asks Table
    description: >-
      The six highest-priority data-room requests for Sierra AI, with rationale for why each
      item is required before investment conviction can reach underwriting-grade confidence.
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR, NRR, and cohort retention
        - Gross ARR, net ARR, gross revenue retention (GRR), and net revenue retention (NRR) by customer cohort vintage and segment
        - The valuation multiple rests entirely on sustaining 100%+ ARR growth; NRR confirms whether growth is from new logos or existing account expansion
        - "Data room: request trailing-8-quarter ARR bridge, logo churn by vintage, NRR by customer size bracket"
      - - Gross margin and LLM COGS
        - Gross margin excluding customer success headcount, with LLM inference cost as a discrete line item
        - Without gross margin, it is impossible to determine whether Sierra is SaaS-grade (70–80%) or services-inflected (40–60%); LLM COGS trajectory affects long-run valuation
        - "Data room: P&L with gross profit line; request inference cost by model provider and use-case category"
      - - Customer revenue concentration
        - Top-10 account share of total ARR and Herfindahl index for the customer base
        - A single non-renewal at a 10–20% account would falsify the base case ARR trajectory and trigger a down-round signal
        - "Data room: ARR distribution by decile; confirm whether any single customer exceeds 10% of ARR"
      - - LLM provider contracts
        - Full provider agreements with OpenAI, Anthropic, and Google; pricing terms, MFN or volume commit protections, use-case restriction clauses
        - LLM pricing increases or use-case restrictions are the highest-probability gross margin risk; contract terms determine how much of this risk Sierra can mitigate contractually
        - "Data room: full provider agreements; outside counsel review of restriction clauses relevant to financial services and healthcare"
      - - Cap table and preference waterfall
        - Full cap table across Series A through E, including liquidation preferences, anti-dilution mechanisms, ratchets, and participation rights
        - At $1.475B raised and $15.8B post-money, the preference stack may materially impair common equity returns in sub-$8B exit scenarios
        - "Data room: certified capitalization table; waterfall modeling at $5B, $10B, $15B, $20B exit assumptions"
      - - EU regulatory posture
        - Fragment (France) EU AI Act high-risk system assessment; DPA correspondence; GDPR data processing agreements for EU customers
        - EU AI Act high-risk system requirements take effect August 2026; an adverse classification would require conformity assessments that could delay or restrict EU deployments
        - Outside EU AI law counsel; request Fragment regulatory counsel memos; DPA correspondence log
    notes: >-
      Diligence asks are prioritized by investment-conviction impact. Items 1 and 2 (ARR/NRR
      and gross margin) are gating: without them, no credible underwriting of the $15.8B
      valuation is possible. Items 3–6 are material but could be partially addressed through
      management representations if data room access is constrained.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041

