          low: 1.2
          high: 2.4
          mid: 1.8
        - label: Base Case (40%)
          low: 5.6
          high: 10.5
          mid: 8.0
        - label: Bull Case (35%)
          low: 14.0
          high: 22.5
          mid: 18.0
        - label: Series E Entry ($15.8B)
          low: 15.8
          high: 15.8
          mid: 15.8
    approximationNotes: >-
