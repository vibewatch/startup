  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Severity
      - Impact on judgment
      - Diligence path
    rows:
      - - Gross margin (%)
        - Blocking
        - Cannot determine whether economics are SaaS-tier or services-inflected
        - Request gross profit and COGS breakdown from data room; benchmark against Intercom / Zendesk comps
      - - Monthly burn rate and cash consumption
        - Blocking
        - Cannot calculate precise runway; limits forward capital adequacy assessment
        - Request trailing-12-month P&L or monthly cash flow from data room
      - - Net Revenue Retention (NRR)
        - Blocking
        - Cannot distinguish growth from new logos vs. expansion; churn may be masked
        - Request cohort NRR by year of first deal and customer segment
      - - Average contract value distribution
        - Material
        - Cannot size sales efficiency, CAC, or concentration risk without ACV data
        - Request deal-size distribution in deciles and top-10 account % of ARR
      - - Customer count with ARR breakdown
        - Material
        - Sacra estimates $200M ARR but precise count and concentration unknown
        - Request total active accounts, top-10 as % of ARR, and Herfindahl index
      - - LLM inference cost structure
        - Material
        - Cannot model margin trajectory as LLM pricing evolves
        - Request inference cost per interaction and as % of gross revenue; track quarterly
      - - Headcount and fully loaded compensation
        - Material
        - Cannot model burn from comp structure; global office expansion adds cost rapidly
        - Request headcount by department and total comp + benefits; compare to ARR per FTE
      - - Logo churn and gross revenue retention
        - Material
        - No public disclosure of customer losses; critical for underwriting revenue quality
        - Request logo churn by cohort and annual GRR net of expansions
      - - ADP and Live Assist separate pricing
        - Minor
        - Cannot assess upsell revenue potential or NRR contribution from new products
        - Confirm in commercial terms whether ADP/Live Assist are incremental or bundled
    notes: >-
      All gaps reflect Sierra's private-company status. Severity rated blocking=cannot underwrite
      without it, material=meaningfully affects judgment but directional thesis possible,
      minor=affects precision but not direction. Diligence paths assume data room access during
      a formal investment process.
