  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Gross margin (%) and gross profit from Sierra's income statement or an audited
        equivalent, or a gross margin range validated by the company in diligence.
      whyItMatters: >-
        Gross margin is the single most important unit economics indicator; without it,
        investors cannot determine whether Sierra's delivery model generates SaaS-tier
        returns or services-tier economics.
      diligencePath: >-
        Request P&L or gross profit figure from the data room; alternatively request
        a management-prepared income statement for the trailing four quarters.
      relatedQuestionRefs:
        - QI007

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >-
        Monthly or quarterly operating cash burn and the resulting runway calculation
        against the post–Series E cash balance.
      whyItMatters: >-
        Without burn data, it is not possible to determine how long the $1 billion-plus
        cash position will sustain operations or when the next capital raise will be needed.
      diligencePath: >-
        Request trailing-12-month cash flow statement or monthly burn report from the
        data room; cross-check against headcount growth rate as a proxy.
      relatedQuestionRefs:
        - QI009

    - type: private-evidence-only
      severity: blocking
      topic: customer-cohort-retention
      missingEvidence: >-
        Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn
        by vintage cohort to validate the expansion revenue thesis.
      whyItMatters: >-
        A company growing this fast from new logos could mask significant underlying
        churn; without cohort data, the quality of the ARR base cannot be assessed.
      diligencePath: >-
        Request cohort-level NRR and GRR by year of first contract; include logo churn
        by segment and contract size bracket.
      relatedQuestionRefs:
        - QI028

    - type: private-evidence-only
      severity: material
      topic: llm-inference-cost
      missingEvidence: >-
        LLM inference cost per resolved interaction and as a percentage of gross revenue,
        across all 15+ models in the constellation architecture.
      whyItMatters: >-
        Inference costs are a meaningful operating headwind at scale; the trajectory of
        these costs as models commoditize will significantly affect the gross margin outlook.
      diligencePath: >-
        Request cost-of-revenue breakdown with inference line item; benchmark against
        comparable multi-model AI platforms on cost-per-call or cost-per-interaction.
      relatedQuestionRefs:
        - QI019

    - type: private-evidence-only
      severity: material
      topic: average-contract-value
      missingEvidence: >-
        ACV distribution, top-10 customer percentage of total ARR, and Herfindahl
        concentration index for the customer base.
      whyItMatters: >-
        Revenue concentration risk cannot be assessed without knowing how many accounts
        drive the majority of ARR; this is material for valuation and scenario analysis.
      diligencePath: >-
        Request deal-size distribution by decile and top-10 account share of ARR from
        the data room.
      relatedQuestionRefs:
        - QI020
