company:
  name: "Sierra AI"
chapter:
  number: 7
  title: "Risks"
  summary: "Sierra's principal risk factors are: regulatory exposure across financial services, healthcare, and EU markets where AI Act high-risk classification and HIPAA obligations apply; operational and security risk from LLM hallucination and prompt-injection attack vectors in production financial and healthcare workflows; partner and dependency concentration on a small set of foundation-model providers and a 40%+ Fortune 50 customer base that is undisclosed by revenue share; financial and valuation risk from an implied ~100× ARR multiple at Series E that is highly sensitive to growth deceleration; and people and execution risk from co-founder key-person dependency and the simultaneous integration of two international acquisitions. Sierra's Trust and Reliability page confirms SOC 2 certification and multi-model architecture, providing partial mitigation, but material regulatory, concentration, and hallucination risks remain open investor diligence items."

sections:
  - id: regulatory-legal-risk
    title: "Regulatory and Legal Risk"
    body: >
      Sierra's regulatory exposure is unusually broad for a two-year-old company because its AI agents operate inside regulated workflows across at least three high-compliance verticals: financial services (mortgage origination, consumer lending, payments, corporate expense management), healthcare (chronic disease management, patient authentication, device troubleshooting), and telecommunications (subscription contracts, billing disputes). The EU AI Act, which entered force in August 2024 with high-risk system requirements effective from August 2026, is immediately relevant: Sierra acquired Fragment in France in early 2026, making its EU operations live. AI agents that materially assist in credit decisions, insurance claims processing, or patient triage could be classified as high-risk systems under Annex III of the EU AI Act, requiring conformity assessments, human oversight mechanisms, and technical documentation. In the United States, the CFPB has issued supervisory guidance on AI in consumer credit (2024), and HIPAA's Security and Privacy Rules impose business-associate obligations on any vendor processing protected health information—which Sierra does for Sutter Health, Cigna, and other named healthcare deployments. Sierra's terms-and-conditions limit liability for consequential damages, which is standard for enterprise SaaS but may create tension in jurisdictions with mandatory liability for AI-caused harm. State-level AI transparency laws in California and Colorado require disclosure when AI systems interact with consumers, adding compliance overhead for Sierra's US enterprise deployments. Sierra's payments blog post (2026) confirms the platform now routes financial transactions, triggering PCI DSS scope. While Sierra has not disclosed pending litigation, enforcement actions, or IP disputes, the absence of disclosure does not constitute confirmation of clean status; investor diligence via management representation letters and external counsel review is required.
