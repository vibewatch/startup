callouts:
  - calloutType: strength
    title: Context engineering plus proprietary transcription create compounding technical moats
    body: >-
      Sierra's progressive-disclosure context engine and multi-provider transcription ensembler are
      purpose-built for production enterprise CX—not adapted from general-purpose LLM toolkits.
      The 25–37% transcription error-rate improvement and the up-to-1% resolution rate lift are
      concrete performance claims tied to Sierra's proprietary investment. These components compound
      with usage as benchmark data grows, creating a widening gap with commodity alternatives.
    claimRefs:
      - CE011
      - CE012
      - CE023
  - calloutType: risk
    title: LLM dependency concentration and white-glove scalability are the primary product risks
    body: >-
      Sierra's product quality depends heavily on a small number of frontier LLM providers (OpenAI,
      Anthropic) whose pricing, terms, and API availability are outside Sierra's control. Simultaneously,
      the dedicated-AI-engineer deployment model that drives quality creates a structural capacity
      ceiling that limits addressable account count at current headcount levels. Both risks are material
      and unresolved in public disclosures.
    claimRefs:
      - CE036
      - CE037
      - CE038

