  evidenceGaps:
    - id: EG001
      topic: Third-party validation of transcription benchmark claims
      gapType: private-evidence-only
      severity: material
      description: >-
        Sierra reports ~25–37% utterance error rate reduction from ensembling and up to 1%
        resolution rate improvement from context-aware transcription. These are internal benchmark
        claims not independently audited. Without third-party validation, the differentiation
        claim cannot be fully corroborated. The risk that commodity STT provider improvements
        erode this advantage by 2026–2027 remains unquantifiable without benchmark data.
      diligencePath: Request Sierra's internal benchmark methodology and raw data; seek independent
        red-team STT testing against Sierra's claimed improvements on representative enterprise audio.
      relatedQuestionRefs:
        - QE017
        - QE020

    - id: EG002
      topic: LLM provider identity and concentration data
      gapType: private-evidence-only
      severity: material
      description: >-
        Sierra references a constellation of 15+ models but does not publicly name all providers.
        The concentration of top-tier reasoning tasks in OpenAI and/or Anthropic is reported but
        not officially confirmed. API cost, volume, and terms with key providers are private.
        The technical details of the multi-LLM constellation architecture are not publicly specified.
      diligencePath: Request vendor concentration disclosure (top 3 LLM providers by inference
        volume and cost) and representative API contracts before completing technical risk assessment.
      relatedQuestionRefs:
        - QE004

    - id: EG003
      topic: Dedicated-AI-engineer scalability and H2 2026 product roadmap
      gapType: missing-source
      severity: moderate
      description: >-
        Sierra's high-touch deployment model requires a dedicated AI engineer per enterprise customer.
        Public data on the ratio of engineers to customers, automation tooling for onboarding, and
        plans to scale beyond a few hundred customers are not available. Additionally, Sierra has not
        publicly disclosed its H2 2026 product roadmap priorities. The balance between compliance
        deepening and new product feature investment cannot be independently assessed.
      diligencePath: Request Sierra engineering-to-customer ratio, onboarding automation roadmap,
        and a product roadmap briefing covering H2 2026 priorities before finalizing scalability assessment.
      relatedQuestionRefs:
        - QE019
        - QE023

    - id: EG004
      topic: Production incident history and adversarial failure data
      gapType: missing-source
      severity: material
      description: >-
        No public record of adversarial attacks, production outages, or AI policy failures in
        Sierra's enterprise deployments exists as of June 2026. Sierra's trust page describes
        mitigation architecture but provides no incident disclosure, root-cause analyses, or
        bug bounty program results. Without this data, the empirical reliability of the supervisor
        model and hallucination-prevention stack cannot be independently assessed.
      diligencePath: Request SOC 2 Type II report with relevant period (2024–2026), any internal
        incident post-mortems, and details of the bug bounty or red-team program scope and findings.
      relatedQuestionRefs:
        - QE027

