  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / component
      - role
      - dependency
      - risk
    rows:
      - - Context Engineering Engine (progressive disclosure)
        - Delivers minimum relevant information to LLM at each conversation turn; manages composable blocks (journeys, tools, rules, policies, workflows, knowledge, memory, glossary) via conditional logic
        - Proprietary Sierra build; relies on underlying LLM's context window and reasoning quality
        - Model capability floor — if LLM capability plateaus, context engineering value compresses
      - - LLM Constellation (15+ models)
        - Routes reasoning tasks, subtasks, and voice synthesis to best-fit model; frontier models for complex reasoning; open-weight and proprietary models for specialist tasks
        - OpenAI, Anthropic, and undisclosed open-weight model providers; Sierra switches automatically on provider degradation
        - Provider concentration in top-tier reasoning models (OpenAI, Anthropic); API pricing increases directly affect gross margin
      - - Supervisor Model Layer
        - Wraps every LLM call to detect hallucinations, block prompt injection, enforce policy, and flag out-of-scope responses before customer delivery
        - Proprietary Sierra supervisor models; trained on enterprise CX interaction data
        - Supervisor effectiveness against novel adversarial prompts not independently tested; model refresh cadence undisclosed
      - - Multi-Provider Transcription Ensembler
        - Queries multiple STT providers in parallel; applies ensemble logic and context injection to produce accurate voice transcripts
        - Multiple undisclosed STT API providers; Sierra's internal benchmark dataset for ensemble weight tuning
        - Provider list and weighting not disclosed; benchmark is internal and unaudited
      - - Agent Data Platform (ADP) Memory Layer
        - Persists cross-session customer memory; unifies unstructured conversation data with structured CRM/billing data; powers intelligent decisioning and proactive recommendations
        - Customer's data warehouse or CRM integration; Sierra's own persistent storage infrastructure
        - Data integration quality depends on customer's data hygiene; regulatory retention limits may constrain memory depth in HIPAA and GDPR contexts
      - - Channel Routing Layer
        - Routes interactions across voice, chat (web, WhatsApp), email, SMS, ChatGPT plugin, and contact-center SIP
        - PSTN/SIP telephony partners; ChatGPT API (OpenAI); WhatsApp Business API (Meta)
        - Third-party distribution dependencies (ChatGPT, WhatsApp) create policy-change risk outside Sierra's control
    notes: >-
      Architecture inferred from official Sierra blog disclosures and product documentation.
      Specific provider names for LLM constellation and transcription are not publicly disclosed.
