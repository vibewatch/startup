  - id: agent-os-architecture
    title: Agent OS architecture and technical core
    body: >-
      Sierra's Agent OS is built on three foundational technical innovations: a proprietary context
      engineering engine, a constellation of large language models, and a multi-provider transcription
      platform for voice interactions. Context engineering is Sierra's answer to the central problem
      of LLM-based agents: as context window size grows, model recall and reasoning accuracy degrade
      when too much irrelevant information is present. Sierra's solution, called progressive
      disclosure, delivers only the minimum relevant information to the model at each moment in a
      conversation. Information is structured into composable blocks—journeys, tools, rules, policies,
      workflows, knowledge, memory, and glossary entries—each controlled by a "condition" that
      specifies when the block becomes relevant (based on conversational state, authenticated identity,
      or observed customer intent). This architecture means complex multi-step workflows like mortgage
      origination or insurance claim filing can run reliably without overloading the model's context
      window. [CE006] [CE007] [CE008]

      The LLM constellation approach uses 15 or more models simultaneously—frontier models (GPT-4,
      Claude) for reasoning, open-weight models for specific subtasks, and proprietary specialist
      models for brand voice and decision support. The system automatically switches between providers
      in case of degradation or outage, giving the platform resilience that single-model deployments
      cannot match. Supervisor models wrap every LLM call to reduce hallucinations, enforce policy
      compliance, and prevent adversarial prompt injection. [CE009] [CE010]

      For voice, Sierra built a transcription platform that queries multiple speech-to-text providers
      in parallel, applies ensemble logic to triangulate the most accurate output, and injects
      conversation context to narrow the search space. On Sierra's internal benchmarks, ensembling
      reduces utterance error rate by approximately 25% versus the best single provider, reaching
      up to 37% in languages with more transcription headroom. Context-aware transcription improved
      input verification rates for financial-services agents by over 25%, and after applying it
      across all voice turns, Sierra voice agents improved resolution rates by up to 1%—translating
      to tens of thousands of additional weekly resolutions—while reducing major transcription errors
      by up to 15%. The platform supports over 70 languages and dialects, with dynamic pipeline
      reconfiguration when a conversation switches languages mid-call. [CE011] [CE012] [CE013]
    claimRefs:
