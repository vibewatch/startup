  - id: trust-security-compliance
    title: Trust, security, privacy, and compliance
    body: >-
      Sierra holds a broad compliance portfolio that spans both general enterprise security standards
      and industry-specific regulations, positioning it for deployment in healthcare, financial
      services, insurance, telecommunications, and retail verticals where data protection is
      contractually and legally mandated. Certified standards as of June 2026 include SOC 2 Type II,
      HIPAA (enabling healthcare deployments like Sutter Health and Cigna), GDPR (covering European
      customers including Singtel and future EU expansion), ISO 27001 (information security management),
      ISO 42001 (AI management systems—the newest and most AI-specific certification in the portfolio),
      CSA STAR (cloud security), PCI DSS Level 1 Service Provider (payment processing), and CCPA
      (California consumer privacy). [CE027] [CE028]

      Technically, Sierra's trust architecture is multi-layered. Supervisor models wrap every LLM
      inference call to detect and suppress hallucinations, block adversarial prompt injection attempts,
      enforce business policy constraints, and prevent out-of-scope responses before they are
      delivered to customers. PII is automatically encrypted and masked within the platform; personally
      identifiable information shared with an agent is never stored in plaintext. For payment
      transactions, cardholder data flows through a dedicated PCI-certified infrastructure layer that
      is architecturally isolated from Sierra's core platform, LLMs, and persistent storage—meaning
      that even a compromise of the core platform would not expose card data. [CE029] [CE030]

      Sierra's data governance policy specifies that no customer data is used to train models for
      other customers—each enterprise's interaction data is isolated and governed by the customer's
      own data-use instructions. This is a critical differentiator for enterprise buyers in regulated
      industries who cannot permit their proprietary workflow data, customer PII, or business logic to
      contaminate another enterprise's AI training. Sierra maps its security practices against the
      NIST AI Risk Management Framework (released January 2023, updated with a GenAI Profile in July
      2024) and the OWASP Top 10 for LLM Applications, which represents community-validated guidance
      for the exact class of adversarial risks—prompt injection, insecure output handling, excessive
      agency—that a customer-facing conversational AI platform faces. The EU AI Act regulatory
      framework (in effect from August 2026 for high-risk AI applications) adds a compliance layer
      for Sierra's European enterprise business that is still being operationalized. The company's
      Sierra Trust Center provides documented security controls and SOC 2 report access on request.
      [CE031] [CE032] [CE033]
