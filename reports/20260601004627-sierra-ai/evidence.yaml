    topic: Dedicated-AI-engineer scalability and H2 2026 product roadmap
    gapType: missing-source
    severity: moderate
    description: >-
      Sierra's high-touch deployment model requires a dedicated AI engineer per enterprise customer. Public data on the
      ratio of engineers to customers, automation tooling for onboarding, and plans to scale beyond a few hundred
      customers are not available. Additionally, Sierra has not publicly disclosed its H2 2026 product roadmap
      priorities. The balance between compliance deepening and new product feature investment cannot be independently
      assessed.
    diligencePath: >-
      Request Sierra engineering-to-customer ratio, onboarding automation roadmap, and a product roadmap briefing
      covering H2 2026 priorities before finalizing scalability assessment.
    relatedQuestionRefs:
      - QE019
      - QE023
