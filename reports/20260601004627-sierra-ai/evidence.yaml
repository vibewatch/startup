  - id: EG001
    topic: Third-party validation of transcription benchmark claims
    gapType: private-evidence-only
    severity: material
    description: >-
      Sierra reports ~25–37% utterance error rate reduction from ensembling and up to 1% resolution rate improvement
      from context-aware transcription. These are internal benchmark claims not independently audited. Without
      third-party validation, the differentiation claim cannot be fully corroborated. The risk that commodity STT
      provider improvements erode this advantage by 2026–2027 remains unquantifiable without benchmark data.
    diligencePath: >-
      Request Sierra's internal benchmark methodology and raw data; seek independent red-team STT testing against
      Sierra's claimed improvements on representative enterprise audio.
    relatedQuestionRefs:
      - QE017
      - QE020
  - id: EG002
    topic: LLM provider identity and concentration data
    gapType: private-evidence-only
    severity: material
    description: >-
      Sierra references a constellation of 15+ models but does not publicly name all providers. The concentration of
      top-tier reasoning tasks in OpenAI and/or Anthropic is reported but not officially confirmed. API cost, volume,
      and terms with key providers are private. The technical details of the multi-LLM constellation architecture are
      not publicly specified.
    diligencePath: >-
      Request vendor concentration disclosure (top 3 LLM providers by inference volume and cost) and representative API
      contracts before completing technical risk assessment.
    relatedQuestionRefs:
