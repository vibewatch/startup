evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A full current cap table showing primary ownership, investor ownership, and any secondary activity.
    whyItMatters: >-
      Without it, the company overview cannot fully translate financing headlines into control and dilution
      implications.
    diligencePath: Request latest financing documents, cap table, and any side-letter or secondary-sale summary from management.
    relatedQuestionRefs:
      - QO012
      - QO025
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: >-
      A company-published current employee count or reliable third-party workforce estimate after the May 2026
      financing.
    whyItMatters: Headcount is a basic scale and burn proxy for a private software company at this stage.
    diligencePath: Ask management for current FTE count by function and geography and reconcile it to payroll or HRIS snapshots.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: minor
    topic: board-governance
    missingEvidence: A detailed public board roster, committee map, and governance-policy summary.
