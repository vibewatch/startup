  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              对一家成立两年的公司来说，Sierra 的监管暴露异常广，因为其 AI
              智能体运行在至少三个高合规垂直的受监管工作流里：金融服务（抵押贷款发放、消费贷款、支付、企业费用管理）、医疗（慢病管理、患者认证、设备故障排查）和通信（订阅合同、账单争议）。欧盟 AI Act 已于 2024 年
              8 月生效，高风险系统要求将自 2026 年 8 月起适用，和 Sierra 直接相关：Sierra 2026 年初在法国收购 Fragment，欧盟业务已经上线。若 AI
              智能体实质性协助信贷决策、保险理赔处理或患者分诊，可能按欧盟 AI Act 附录 III 被归类为高风险系统，需要完成合规评估、建立人工监督机制并准备技术文档。在美国，CFPB 已就消费信贷中的 AI
              发布监管指导（2024），HIPAA 的安全和隐私规则也要求任何处理受保护健康信息的供应商承担商业伙伴义务——Sierra 为 Sutter Health、Cigna 和其他具名医疗部署处理这类信息。Sierra
              条款限制间接损害赔偿责任，这对企业 SaaS 属于标准做法，但在对 AI 造成损害规定强制责任的司法辖区可能产生张力。California 和 Colorado 的州级 AI 透明度法律要求 AI
              系统与消费者互动时进行披露，为 Sierra 的美国企业部署增加合规开销。Sierra 的支付博客文章（2026）确认平台现在会路由金融交易，因此触发 PCI DSS 范围。虽然 Sierra
              未披露未决诉讼、执法行动或知识产权争议，但没有披露并不等于确认状态干净；投资人仍需通过管理层声明函和外部律师审查做尽调。
