  - id: FV001
    title: Sierra AI 推荐逻辑
    type: flow
    description: 从 Sierra AI 的关键证据支柱，经风险因素，推导到投资建议的逻辑链。决策节点标出哪些证据更强、哪些重大不确定性会压低确信度。
    data:
      nodes:
        - id: N1
          label: |-
            ARR 爬坡
            （$0→$100M <24 个月；
            企业 SaaS 史上最快）
        - id: N2
          label: |-
            客户质量
            （40%+ Fortune 50；
            按结果计费对齐利益）
        - id: N3
          label: |-
            创始人网络
            （Bret Taylor：前 Salesforce CEO、
            前 OpenAI 董事会成员）
        - id: N4
          label: |-
            倍数风险
            （79–100× ARR；
            较可比公司溢价 3–5×）
        - id: N5
          label: |-
            财务不透明
            （无毛利率、
            NRR 或烧钱数据）
        - id: N6
          label: |-
            竞争风险
            （Salesforce Agentforce；
            Microsoft；OpenAI）
        - id: N7
          label: |-
            有条件买入
            高风险
            （需数据室）
      edges:
        - from: N1
          to: N7
          label: 支撑
        - from: N2
          to: N7
          label: 支撑
        - from: N3
          to: N7
          label: 支撑
        - from: N4
          to: N7
          label: 约束
        - from: N5
          to: N7
          label: 约束
        - from: N6
          to: N7
          label: 约束
    basis: 推荐逻辑综合第 1–7 章和估值可比分析。边权重反映方向性证据强度。尽管客户和创始人信号强，财务不透明和倍数风险仍压低确信度。
    claimRefs:
      - CV001
      - CV023
      - CV029
      - CV034
  - id: FV002
    title: Sierra AI 估值对 ARR 和倍数的敏感性
    type: bar
    description: >-
      在三种 ARR 情景（$150M、$200M、$300M）和四档收入倍数（10×、20×、35×、79×）组成的 12 种组合下，对隐含估值进行测算。展示 Sierra $15.8B 估值对 ARR
      兑现和适用市场倍数变化的敏感性。所有数值单位为十亿美元。
    data:
      items:
        - label: $150M × 10×
          value: 1.5
        - label: $150M × 20×
          value: 3
        - label: $150M × 35×
          value: 5.25
        - label: $150M × 79×（当前）
          value: 11.85
        - label: $200M × 10×
          value: 2
        - label: $200M × 20×
          value: 4
        - label: $200M × 35×
          value: 7
        - label: $200M × 79×（当前）
          value: 15.8
        - label: $300M × 10×
          value: 3
        - label: $300M × 20×
          value: 6
        - label: $300M × 35×
          value: 10.5
        - label: $300M × 79×（当前）
          value: 23.7
    basis: >-
      ARR 数据来自 Sierra 官方博客（year-two-in-review：截至 2026 年 2 月为 $150M）和 Sacra 独立估算（截至 2026 年 5 月为 $200M）。$300M 代表 2027
      年基准情景轨迹。倍数来自公开可比公司组和当前隐含入场倍数。
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV015
  - id: FV003
    title: Sierra AI 各情景估值与回报区间
    type: range
    summary: Sierra AI 在牛市、基准和熊市情景下的企业价值区间，并与 $15.8B Series E 入场估值对比。所有数值单位为十亿美元。熊市到牛市跨度很大，反映 79× ARR 倍数对增速放缓高度敏感。
    data:
      items:
        - label: 熊市情景（25%）
          low: 1.2
          high: 2.4
          mid: 1.8
        - label: 基准情景（40%）
          low: 5.6
          high: 10.5
          mid: 8
        - label: 牛市情景（35%）
          low: 14
          high: 22.5
          mid: 18
        - label: Series E 轮入场（$15.8B）
          low: 15.8
          high: 15.8
          mid: 15.8
    approximationNotes: >-
      区间为分析师估算，依据可比倍数分析和 ARR 轨迹外推。熊市和基准情景中点均低于 Series E 入场估值；按基准概率分配（25% 熊市、40% 基准、35% 牛市）测算，投资期望值为负。概率加权预期价值：约
      $9.9B。实际结果取决于未披露的单位经济、IPO 市场条件和战略替代方案。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV004
    title: Sierra AI 投资 KPI — IC 评分
    type: kpi
    layout: standard
    description: >-
      投资委员会围绕七个关键尽调维度对 Sierra AI 评分，每项 1–5 分（5 = 证据优秀；1 = 重大缺口或反向信号）。评分仅反映截至 2026 年 6
      月的公开证据；若数据室披露利好，标有财务不透明提示的维度评分可能大幅修正。
    data:
      items:
        - label: 市场机会
          value: 5 / 5
          detail: $400B 客服 TAM；Gartner 预计到 2026 年智能体应用渗透率 40%；到 2025 年对话式 AI 市场 >$13B
          claimRefs:
            - CV024
        - label: 产品与客户验证
          value: 4 / 5
          detail: 40%+ Fortune 50 客户；ADT 每月 2M 次客户服务请求；Rocket Mortgage 成交率提升 3–4×；到 2025 年 10 月，语音已超过文本
          claimRefs:
            - CV025
        - label: 竞争护城河
          value: 3 / 5
          detail: 按结果计费对齐利益；创始人网络；多模型架构；但 Salesforce/Microsoft/OpenAI 拥有分发杠杆
          claimRefs:
            - CV027
        - label: 单位经济
          value: 1 / 5
          detail: 公开来源未提供毛利率、NRR、烧钱倍数或 CAC 数据；财务不透明是最高风险的单一缺口
          claimRefs:
            - CV034
        - label: 监管与法律风险
          value: 2 / 5
          detail: EU AI Act 高风险分类风险（2026 年 8 月）；HIPAA 业务伙伴义务；CFPB AI 指引；支付业务带来的 PCI DSS 范围
          claimRefs:
            - CV041
        - label: 团队与治理
          value: 4 / 5
          detail: Bret Taylor 和 Clay Bavor 担任联席 CEO；Benchmark + Sequoia + GV 董事会；但未披露继任计划或组织梯队图
          claimRefs:
            - CV033
        - label: 估值吸引力
          value: 1 / 5
          detail: $15.8B 估值对应 79–100× ARR，较最佳公开 SaaS 可比公司高 3–5×；按基准情景概率测算，投资期望值为负
          claimRefs:
            - CV015
    basis: KPI 分数综合 Sierra AI 八章尽调得出。分数仅为分析师基于公开证据的估算。若数据室披露利好，单位经济和估值分数会显著改善。综合得分：20/35（57%），反映中等确信度，且财务不透明带来显著拖累。
    claimRefs:
      - CV015
      - CV024
      - CV025
      - CV027
      - CV033
      - CV034
      - CV041
