      - number: '5.2'
        title: Agent OS 架构与技术核心
        blocks:
          - type: paragraph
            body: >-
              Sierra 的 Agent OS 建在三项基础技术创新之上：自研上下文工程引擎、一组大语言模型，以及面向语音互动的多供应商转写平台。上下文工程是 Sierra 对 LLM
              智能体核心问题的回答：当上下文窗口变大，若包含太多无关信息，模型召回和推理准确率会下降。Sierra
              的方案叫渐进式披露，也就是在对话每一刻只向模型提供最少且相关的信息。信息被组织成可组合模块——旅程、工具、规则、政策、工作流、知识、记忆和术语表条目——每个模块都由一个“条件”控制，规定该模块何时变得相关（基于对话状态、已认证身份或观测到的客户意图）。这种架构意味着，按揭发起或保险理赔等复杂多步骤工作流可以可靠运行，而不会压垮模型上下文窗口。[CE006]
              [CE007] [CE008]

              LLM 组合方法同时使用 15
              个或更多模型——前沿模型（GPT-4、Claude）负责推理，开放权重模型处理特定子任务，自研专业模型负责品牌语气和决策支持。系统会在性能下降或故障时自动切换供应商，使平台具备单模型部署无法匹配的韧性。监督模型包裹每一次
              LLM 调用，以减少幻觉、执行政策合规并防止对抗性提示注入。[CE009] [CE010]

              在语音上，Sierra 构建了一套转写平台，并行查询多个语音转文字供应商，应用集成逻辑来三角定位最准确输出，并注入对话上下文来缩小搜索空间。在 Sierra
              内部基准上，相比最佳单一供应商，集成方法将话语错误率降低约 25%，在转写提升空间更大的语言中最高达到 37%。上下文感知转写让金融服务智能体的输入验证率提高超过 25%；应用到所有语音轮次后，Sierra
              语音智能体的解决率最高提升 1%——折算为每周多解决数万次问题——同时重大转写错误最多减少 15%。平台支持超过 70 种语言和方言，并能在通话中切换语言时动态重配流水线。[CE011] [CE012]
              [CE013]
