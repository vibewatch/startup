  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - EU AI Act 高风险 AI 用例不合规
        - EU AI Office 将 Sierra 或 Fragment 列入不合规供应商登记册；欧盟客户以法案要求为由暂停部署
        - 收到任何欧盟监管通知或执法函；或任何具名欧盟客户公开称法案合规阻碍部署
        - 立即复核投资逻辑：评估欧盟收入敞口；要求管理层提供合格评定文件；合规前考虑托管安排
      - - 医疗客户发生 HIPAA 数据泄露或 OCR 调查
        - 公开披露数据泄露通知；HHS 泄露门户显示 OCR 开启调查；或客户（Sutter Health、Cigna）发布公开声明提及 Sierra 平台
        - 任何涉及 Sierra 智能体处理的 PHI 的公开泄露通知
        - 重大不利事件：要求立即提交事件报告；评估客户赔付敞口；判断医疗垂直行业的长期可行性
      - - LLM 提供商条款限制或 API 定价上调 >50%
        - OpenAI、Anthropic 或 Google 公开宣布限制金融服务 AI 用例，或宣布 90 天内生效的涨价
        - 主要模型提供商价格上调 >50%，或条款变更排除信贷、医疗或支付工作流
        - 财务模型影响：按新的 LLM 成本结构重跑单位经济；评估毛利率被压缩程度；加快开源模型评估时间表
      - - 联合创始人离职（Bret Taylor 或 Clay Bavor 任一）
        - 公开宣布离职、转任非执行角色，或未能完成通常由创始人关系锚定的 Series F 轮或重大合作交易
        - 离职公告；或投资人尽调确认未来 12 个月内创始人投入下降
        - 高严重性触发信号：重新评估增长轨迹假设；交割前要求临时领导计划和关键高管留任方案
      - - ARR 同比增长降至 70% 以下
        - 向投资人披露的季度 ARR（通过信息权）显示，年化增速较 Series E（2026 年 5 月）时 100%+ 的节奏明显下降
        - 连续两个季度 YoY ARR 增长低于 70%；或 2026 年末 ARR 低于 $250M
        - 估值压缩触发信号：复核竞争胜负数据；评估减速来自市场饱和、竞争还是流失；按 40× 和 60× ARR 倍数建模下行情景
      - - 客户集中度流失 — 前三大客户流失
        - 客户公开宣布离开 Sierra；竞争对手新闻稿称迁移了具名 Sierra 客户；或管理层披露收入显示单季 ARR 下降 >10%
        - 任何确认流失的客户估计占 ARR >5%；或披露的净收入留存率低于 100%
        - 重新审视增长逻辑：把尽调集中到剩余客户 NRR、管线健康度，以及流失是价格、性能还是既有平台驱动
    notes: >-
      终止标准是打破投资逻辑的事件，不是预期结果；多数场景概率低但投资后果高。阈值为分析师判断，并按 Sierra 的增长阶段和估值倍数校准。来源：NIST AI RMF（SR005）、EU AI Act（SR006）、Sierra
      信任页面（SR001）、Sierra 融资报道（SR020、SR021、SR022、SR012）。
