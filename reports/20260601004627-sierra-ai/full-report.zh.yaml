      - number: '2.3'
        title: 谁买、谁用，以及为什么采用在加速
        blocks:
          - type: paragraph
            body: >-
              从供应商定位和使用数据看，这个市场的购买动作越来越清晰。客户体验负责人、服务运营负责人、数字团队和企业软件负责人最可能是经济买家；终端用户则同时包括前端消费者和后端支持团队。早期采用在金融服务、零售、旅游、医疗和通信等面向消费者的垂直行业最强，因为这些行业服务量大，更好的响应质量、多语言覆盖和全天候支持能很快显现价值。公开证据还显示，采用正在越过狭窄的
              FAQ 自动化。Sierra 自己的案例覆盖信贷、医疗认证、保险理赔和通信订阅管理；Salesforce 使用数据也显示智能体横跨服务和销售。因此，市场正从实验走向运营基础设施，但仍处在早期，快速实施和可信
              ROI 仍是主要差异化因素。采购通常仍是跨职能流程，即使试点热情很高，也会拉长周期。
