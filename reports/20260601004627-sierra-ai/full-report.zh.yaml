  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Sierra 实际所处的市场
        blocks:
          - type: paragraph
            body: >-
              定义 Sierra 市场的最干净方式，不是“所有 AI”，甚至也不是“所有企业软件”。Sierra
              卖进的是客户体验与客服智能体层：这类软件处理或辅助客户对话，执行工作流步骤，并越来越多地覆盖从支持到转化和留存的完整旅程。这个市场包括自助服务、联络中心自动化、多渠道客户互动，以及贷款发放、订户留存等部分与收入挂钩的服务流程。它不需要把编码助手、内部知识助手或通用生产力智能体等无关
              AI 支出打包进来。这个边界很重要，因为它保住了现实的竞争集合，也避免用 Sierra 目前并未明显拥有的相邻品类抬高 TAM。它还澄清了 Sierra 最先替代的对象：传统 IVR 树、确定性聊天机器人、依赖
              BPO 的客服运营，以及正在加 AI 功能的既有帮助台套件。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
