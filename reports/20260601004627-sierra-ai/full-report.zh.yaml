  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              Sierra AI 以 “Agent OS” 交付其客户体验 AI 平台；公司称这是面向企业 AI 智能体的操作系统，覆盖语音、聊天、电子邮件、SMS，以及截至 2026 年初的 ChatGPT
              消费者分发层，贯穿完整客户互动生命周期。商业产品由几个清晰模块组成。Agent Studio 2.0 是低代码 / 无代码构建器，让运营团队定义智能体旅程、连接企业系统，并用 GitHub
              风格版本控制管理工作区，不需要专职工程员工。Insights 2.0 增加 Explorer 功能——被描述为面向客户对话的深度研究——持续分析互动日志，诊断表现缺口并提出候选改进。Agent Data
              Platform（ADP）提供持久记忆和智能决策，把结构化数据（CRM、账单、交易）与非结构化对话数据统一起来，让智能体按姓名问候客户、记住此前问题，并主动推荐下一步。Live Assist 连接 AI
              和人工客服，为支持人员提供实时对话指导、自动记录和即时答案浮现。Payments 模块于 2025 年 10 月发布，是市场上第一个 Level 1 PCI 合规的对话式支付能力，使语音和聊天可以完成卡和 ACH
              交易，而敏感卡数据从不接触 Sierra 核心平台或 LLM。2026 年 5 月，Sierra 发布 Ghostwriter——一个由 Codex 和 Claude Code 驱动的智能体构建智能体——它吸收
              SOP、通话记录、白板照片和自然语言指令，自主生成可投产智能体，把构建周期从数周压缩到数小时。所有模块都通过一个统一 API 部署，Sierra 称之为 Headless
              API，允许智能体嵌入客户自建界面，而不必使用 Sierra 的前端栈。[CE001] [CE002] [CE003] [CE004] [CE005]
