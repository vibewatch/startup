      - number: '7.6'
        title: 缓解框架与终止标准
        blocks:
          - type: paragraph
            body: >
              Sierra 的主要风险缓解来自结构，而不是合同：多模型架构降低单一 LLM
              供应商依赖；按结果计费让公司直接绑定客户价值交付；具名客户证据库带来社会证明和参考资本。不过，缓解措施必须放在潜在触发因素的严重程度和发生速度下评估。Sierra 投资的投资逻辑破坏情景包括：(1) 欧盟 AI
              Act 对 Sierra 某个欧盟部署采取执法行动，引发整改成本和客户犹豫；(2) 医疗或金融服务客户发生重大数据泄露或 AI 错误，引发监管调查，并在 30+ 个具名企业账户中造成声誉传染；(3) OpenAI
              或 Anthropic 对金融服务 AI 智能体施加用例限制，切断 Sierra 对领先基础模型的访问；(4) 投资后 12 个月内任一联合创始人离职，且没有披露继任计划；或 (5) 2026 年底前未达到
              $300 million ARR，意味着年化 ARR 增长降速至 70% 以下。每个情景都有可监测先导指标和明确尽调路径。投资人应在交割前设定合同性信息权，覆盖季度 ARR、流失指标、LLM
              供应商协议、数据泄露通知和领导层变动。终止标准不能孤立地按概率判断——多数都是低概率高影响情景——但监管、运营、财务、人才和伙伴维度的风险叠加后，残余风险画像即便对后期企业软件投资而言也偏高。
