      - number: '3.3'
        title: 切换成本、分发力量与多供应商并用
        blocks:
          - type: paragraph
            body: >-
              Sierra 的竞争耐久度，很大程度取决于这个品类会变得多依赖集成。平台一旦深度接入工作流、数据系统、政策和品牌行为，切换成本就会显著上升。但这种锁定效应看起来并不只来自独特模型
              IP，而是来自实施工作、工作流调优和对生产环境的信任。这个动态双向作用。一方面，Salesforce、Microsoft、ServiceNow 和 Zendesk 等既有厂商拥有 Sierra
              很难快速复制的分发和采购优势。另一方面，企业在深度投入前，仍能试点多家供应商或推进内部构建。换句话说，部署后市场可能很黏，但部署前仍高度可竞争。正因如此，分发力量和实施可信度至少和技术标题同样重要。部署前选型比拼是
              Sierra 最需要证明自己的地方。赢下一次选型比拼不等于长期拥有一个账户。
