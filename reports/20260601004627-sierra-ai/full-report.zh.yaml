  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Sierra Agent OS 采用分层架构：顶部是渠道交付，向下依次是智能体运行时、上下文管理、智能层、集成与合规基础设施。
    approximationNotes: 层级名称、子层分组和角色根据 Sierra 官方产品文档和博客文章推断。内部实现细节（具体云厂商、准确模型供应商名单、基础设施拓扑）未公开披露。
    data:
      layers:
        - id: layer-channels
          label: 渠道层
          detail: 语音（PSTN、SIP、联络中心）、聊天（网页组件、WhatsApp、SMS）、电子邮件、ChatGPT 插件，以及面向自定义界面的 Headless API
          sublayers:
            - id: ch-voice
              label: Voice
              detail: Multi-provider transcription ensembler; 70+ languages; conversational recovery
            - id: ch-chat
              label: Chat / SMS / Email
              detail: Web widget, WhatsApp Business API, SMS, email; universal web attachments
            - id: ch-chatgpt
              label: ChatGPT Publish
              detail: One-click agent publication to ChatGPT consumer surface with controlled journey scope
        - id: layer-agent-runtime
          label: Agent OS 运行时
          detail: >-
            Agent Studio 2.0（旅程构建器、Workspaces、Integrations）、Ghostwriter（构建智能体的智能体）、Insights 2.0（Explorer、Expert
            Answers）、Live Assist（实时人工指导）
          sublayers:
            - id: ar-studio
              label: Agent Studio 2.0
              detail: Low-code / no-code journey authoring; GitHub-style collaboration; Integrations hub
            - id: ar-ghostwriter
              label: Ghostwriter
              detail: Autonomous agent-building agent; ingests SOPs, transcripts, plain-English instructions
            - id: ar-insights
              label: Insights 2.0 / Explorer
              detail: Deep-research analysis of conversation logs; Expert Answers auto-article generation
            - id: ar-live-assist
              label: Live Assist
              detail: Real-time AI guidance for human agents; automatic note capture; escalation orchestration
        - id: layer-context-engine
          label: 上下文工程引擎
          detail: 在条件逻辑控制下，渐进披露可组合模块（旅程、工具、规则、政策、工作流、知识、记忆、术语表）；确保 LLM 每轮只接收最少且相关的上下文
        - id: layer-intelligence
          label: 智能层
          detail: LLM Constellation（15+ 个前沿、开放权重和自研模型）、Supervisor Models（抑制幻觉、拦截提示注入、执行政策）、Agent Data Platform 记忆与智能决策
          sublayers:
            - id: intel-llm
              label: LLM Constellation
              detail: >-
                Frontier models (OpenAI, Anthropic), open-weight models, proprietary specialist models; automatic
                failover
            - id: intel-supervisor
              label: Supervisor Models
              detail: Wraps every LLM call; detects hallucinations, blocks adversarial prompts, enforces policy
            - id: intel-adp
              label: Agent Data Platform (ADP)
              detail: Persistent cross-session memory; unifies conversation data with CRM/billing/transaction data
        - id: layer-integration
          label: 集成与支付层
          detail: Agent SDK 以及面向 CRM、计费、库存和联络中心系统的 30+ 个预置连接器；PCI DSS Level 1 支付基础设施（卡和 ACH，架构上与核心平台隔离）
        - id: layer-compliance
          label: 信任、安全与合规基础设施
          detail: >-
            SOC 2 Type II、PCI DSS Level 1、HIPAA、GDPR、ISO 27001、ISO 42001、CSA STAR、CCPA；Sierra Trust
            Center；数据隔离（不跨客户训练）；PII 加密和脱敏
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE008
      - CE009
      - CE027
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 客户互动在 Sierra 平台上的端到端流转：从发起联系到解决或升级，并展示上下文工程和 LLM 编排如何跑在关键路径上。
    approximationNotes: 流程反映 Sierra 技术博客和官方产品文档记录的运营模型。具体延迟、模型调用深度和供应商身份未披露。
    data:
      nodes:
        - id: f1
          label: 客户发起联系
          description: 通过语音（电话）、聊天（网页 / WhatsApp / SMS）、电子邮件或 ChatGPT 进入；路由到 Sierra 渠道层
          tone: neutral
        - id: f2
          label: 渠道层规范化输入
          description: 语音输入由多供应商转写集成器处理；文本输入被解析；上下文窗口打开
          tone: neutral
        - id: f3
          label: 上下文工程引擎启动
          description: Agent OS 根据客户身份、渠道和初始意图加载最少且相关的上下文模块；渐进披露开始
          tone: positive
        - id: f4
          label: LLM 星座推理
          description: 为当前轮次选择最合适的模型；监督模型包裹调用；生成任何回复前完成幻觉和政策检查
          tone: positive
        - id: f5
          label: 执行工具或系统调用
          description: 智能体按需调用 CRM 查询、计费系统查询、库存检查或支付 API；结果注入下一轮上下文
          tone: neutral
        - id: f6
          label: 智能体回复 / 执行动作
          description: 回复通过原渠道送达；支付完成处理；触发升级；ADP 更新记忆
          tone: positive
        - id: f7
          label: 判定结果
          description: 已解决：客户问题关闭且未升级——触发按结果计费事件。已升级：转交 Live Assist 或人工客服——通常不收费；自动生成交接摘要
          tone: neutral
        - id: f8
          label: Insights 2.0 / ADP 更新
          description: 互动被记录；Explorer 界面标记改进机会；ADP 更新客户记忆以供下一次互动使用；适用时 Expert Answers 生成知识库文章
          tone: positive
        - id: e1
          label: 联系进入渠道
          from: f1
          to: f2
        - id: e2
          label: 规范化文本进入上下文引擎
          from: f2
          to: f3
        - id: e3
          label: 上下文传给 LLM
          from: f3
          to: f4
        - id: e4
          label: 工具调用
          from: f4
          to: f5
        - id: e5
          label: 工具结果返回
          from: f5
          to: f4
        - id: e6
          label: 生成回复
          from: f4
          to: f6
        - id: e7
          label: 互动关闭或升级
          from: f6
          to: f7
        - id: e8
          label: 互动后学习
          from: f7
          to: f8
    claimRefs:
