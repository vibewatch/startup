      - number: '5.6'
        title: 路线图里程碑与产品风险
        blocks:
          - type: paragraph
            body: >-
              从 2025 年底到 2026 年中，Sierra 的产品节奏非常激进。2025 年 10 月的 Sierra Summit 一次性推出八项产品：Agent Studio 2.0、Insights
              2.0、Agent Data Platform、Live Assist、Payments、ChatGPT 发布功能，以及扩展后的语音和联络中心集成。2026 年 5 月，“Agents as a Service”
              重新发布，带来 Ghostwriter（构建智能体的智能体）、Explorer（自主对话分析），并重塑无头基础设施叙事，把 Sierra 定位成 AI 与 AI
              之间工作流的平台——智能体可以构建和改进智能体，不需要人类点击。公开披露中可见的近期路线图包括：在 2026 年 8 月欧盟 AI Act 高风险 AI 条款生效前，继续加深合规运营控制；扩大企业 SDK
              能力，支持第三方 AI 智能体编排；在 SiriusXM 以及更广泛媒体 / 零售发布之后，继续把 ADP 推给更多客户。[CE034] [CE035]

              关键产品与技术风险很实在。第一，大语言模型（LLM）供应商集中：Sierra 使用 15 个以上模型，但最强推理能力依赖少数前沿供应商（OpenAI、Anthropic）。这些供应商一旦涨价、修改 API
              条款或出现容量约束，Sierra 的成本结构和产品质量都会被直接影响。多模型架构能缓解宕机风险，但不能消除定价依赖。第二，模型商品化：LLM 能力整体提升后，Sierra
              通过模型群方式叠出的价值可能被压缩。如果单一模型能以较低成本处理语音、推理和专门子任务，Sierra 的编排层差异化就会下降。第三，高度定制交付的可扩展性：专属 AI
              工程师部署模式是主要质量来源，也是主要产能瓶颈。若要以同等质量服务 500 或 1,000 个企业账户，Sierra 需要成比例扩充专业 AI
              工程师队伍，成本高且难招聘。最后，自研转录基准没有经过独立审计；相较顶级供应商错误率降低 25–37% 的说法是 Sierra 自己的内部指标，第三方验证仍是尽调缺口。[CE036] [CE037]
              [CE038]
