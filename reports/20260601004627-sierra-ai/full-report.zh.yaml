        - 监督模型能否挡住新型对抗提示尚未经独立测试；模型刷新节奏未披露
      - - 多提供商转写集成器
        - 并行查询多个 STT 提供商；用集成逻辑和上下文注入生成准确语音转写
        - 多个未披露的 STT API 提供商；Sierra 内部基准数据集用于调校集成权重
        - 提供商名单和权重未披露；基准数据集为内部使用，未经审计
      - - Agent Data Platform（ADP）记忆层
        - 持久保存跨会话客户记忆；把非结构化对话数据与结构化 CRM / 账单数据统一起来；支撑智能决策和主动推荐
        - 客户数据仓库或 CRM 集成；Sierra 自有持久存储基础设施
        - 数据集成质量取决于客户的数据质量；在 HIPAA 和 GDPR 场景下，监管留存限制可能压缩记忆深度
      - - 渠道路由层
        - 在语音、聊天（Web、WhatsApp）、电子邮件、SMS、ChatGPT 插件和联络中心 SIP 之间路由交互
        - PSTN/SIP 电话合作伙伴；ChatGPT API（OpenAI）；WhatsApp Business API（Meta）
        - 第三方分发依赖（ChatGPT、WhatsApp）带来 Sierra 无法控制的政策变化风险
    notes: 架构根据 Sierra 官方博客披露和产品文档推断。LLM Constellation 和转写环节的具体提供商名称未公开。
