      - number: '8.6'
        title: 退出准备、尽调要求与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              在 $15.8 billion 入场估值下，Sierra 最可能的退出路径是 2027–2028 年 IPO，前提是 ARR 持续增长，且公开市场愿意接纳 AI 软件公司。$950 million Series
              E 在结构上符合 IPO 前融资：融资规模足以支撑公司运营到 IPO 申报窗口，无需额外新股资本；Tiger Global 入场也释放了近期流动性导向信号，因为该机构在许多组合公司 IPO
              时管理过公开股权头寸。由超大规模云厂商（Salesforce、Microsoft、Google、Workday 或 ServiceNow）战略收购是次级退出情景；NICE Systems 和 Genesys
              是潜在 CCaaS 整合方，但市值不足，无法在不对股东造成结构性稀释的情况下执行 $15+ billion 全现金收购。在形成完整投资信心之前，五个最高优先级数据室项目是：(1) 按队列年份披露
              ARR，并包含总留存率和净留存率，按客户规模和垂直行业分段；(2) 剔除客户成功和专业服务交付成本后的毛利率，并将 LLM 推理成本作为单独科目；(3) 前 10 大客户占总 ARR
              的比例，用于评估集中风险；(4) LLM 供应商协议、定价条款、最惠国保护，以及与金融服务或医疗部署有关的任何用例限制；(5) Series A 到 E
              的股权结构表瀑布，包括清算优先权、反稀释机制和任何影响普通股回报的棘轮条款。投资逻辑破坏触发器——也就是使投资逻辑被证伪的条件——包括：(a) ARR 增长连续两个季度降至 50% CAGR 以下；(b) 投资后
              12 个月内任一联合创始人离职；(c) 欧盟 AI Act 对 Sierra 某个部署采取执法行动，引发监管整改成本和企业犹豫；(d) OpenAI 或 Anthropic 限制受监管金融服务或医疗工作流中的
              AI 智能体访问；(e) 确认流失任一占 ARR >10% 的账户，且未披露替代管线。每个触发器都有可监测先导指标：ARR 季度速度、创始人 LinkedIn 和媒体状态、欧盟 DPA 往来、LLM
              供应商政策更新，以及续约期的客户背调。投资人应在交割时设立覆盖全部五个触发器的合同性信息权，包括季度 ARR 报告和任何达到投资逻辑破坏级别事件的即时通知。
