chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与运营边界
        blocks:
          - type: paragraph
            body: >-
              Sierra 把自己定义成一家帮助大型企业用 AI 交付更好、更有人味客户体验的公司。它的核心叙事不是泛泛的聊天机器人自动化：Sierra
              反复强调，一个智能体可以横跨聊天、SMS、WhatsApp、电子邮件、语音，甚至 ChatGPT；产品页则把 Agent OS 定位成一套长期构建、运营和优化智能体的平台。这个定位对尽调很关键，因为它让
              Sierra 更像客户互动的多渠道运营层，而不是单点工具。官方材料也显示，公司商业模式围绕结果导向定价和长期客户关系展开，而不是一次性客服分流。直白说，Sierra 正把自己包装成一类企业应用软件，用 AI
              智能体同时承接服务流程和与收入挂钩的客户流程。这个更宽的框架很重要：它抬高了合同价值上限，也放大了竞争压力，使 Sierra 更像一笔客户体验平台押注，而不是一款狭窄的聊天机器人工具。
