      - number: '4.5'
        title: 财务判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              Sierra 呈现出双重图景：收入轨迹极强，单位经济性却不透明。ARR 速度——28 个月从零到估计 $200 million——客观上很强，使 Sierra
              跻身现代企业软件史上扩张最快的公司之一。Fortune 50 客户基础、六位数最低合同规模，以及面向客户的 ROI 证据（Rocket Mortgage 转化倍数、高 CSAT
              分数），都表明收入质量明显高于普通企业试点。结果导向定价作为对齐机制在战略上合理，但它会引入预测不透明性；包括一篇竞争对手撰写的评测在内，多位独立观察者都将其标为潜在客户的实质性担忧。

              财务判断取决于三个尚未解决的结构性问题。第一，Sierra 的交付模式能支撑 SaaS 级毛利率（70–80%），还是专业服务层和 LLM
              推理成本结构会把它压向服务型业务画像（40–60%）？第二，不同年份客户队列的净收入留存曲线是什么样？一家公司增长这么快，可能用新增客户数量掩盖了显著的底层流失。第三，在当前烧钱倍数下，快速资本部署是否可持续；即便有
              $1 billion 现金余额，公司是否仍会在 18–24 个月内需要再融资？Sierra CEO 曾公开预测 AI 市场将在两年内修正——这是对全行业风险的认知信号，也适用于 Sierra
              自己的下一次融资窗口。在数据室提供毛利率、NRR、烧钱速度和客户队列数据之前，财务章节只能支持“收入增长异常强”的初步判断，无法承销单位经济性或资本效率逻辑。
