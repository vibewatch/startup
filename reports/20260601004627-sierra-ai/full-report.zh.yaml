      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Sierra 依赖少数基础模型供应商——主要是 OpenAI、Anthropic 和 Google——提供支撑智能体的核心推理能力。虽然 Sierra
              的信任页面确认其多模型架构允许客户在不同底层模型上运行智能体并切换供应商，但依赖外部控制的模型会带来定价风险（API
              成本上涨）、能力风险（模型退化或下线）和条款风险（供应商限制金融交易或医疗建议等用例）。OpenAI 和 Salesforce 构成双重威胁：二者既是供应商（模型访问），也可能成为竞争对手（OpenAI 的
              Operator 生态；Salesforce Agentforce）。Sierra 在法国收购 Fragment（2026 年初）和在日本收购 Opera Tech（2025
              年底），引入整合执行风险；两家公司都处于早期阶段，尚未证明自身能产生收入。SoftBank 的日本分销合作（Axios 称于 2025 年 12 月宣布）形成软渠道依赖——如果 SoftBank 降低 AI
              分销优先级，Sierra 的日本管线会受到实质损害。客户收入集中是直接财务依赖：Fortune 50 中 40%+ 是客户，但没有披露单账户收入拆分，任何一两个超大账户流失都可能代表 10–20%
              ARR。基础设施层——AWS、Azure 或 GCP——未披露但可假定集中；主要云供应商宕机会造成尚未缓解的服务中断风险。Sacra 的竞争研究将 Decagon 识别为企业对话式 AI
              领域最接近的直接竞争对手，而 Genesys、Nice inContact 和 Intercom Fin 是既有 CCaaS 替代方案的锚点，这些产品都在升级 AI 能力，可能侵蚀 Sierra 的差异化。
