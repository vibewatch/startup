      - number: '6.3'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >
              Sierra 的采用曲线很陡。公司 2024 年 2 月发布，七个季度内突破 $100 million ARR——联合创始人称这是企业软件史上最快速度之一，Benchmark 的 Peter Fenton
              也背书称 Sierra 轨迹“快得离谱”。2026 年 2 月内部更新披露，八个季度内 ARR 突破 $150 million。截至 2026 年 5 月 Series E 公告，Fortune 50 中超过
              40% 已是 Sierra 客户。公司未披露客户总数，但公开案例库和新闻稿已点名 30 多家不同企业。部署漏斗效率高：具名客户提到四到十周上线，并在发布后扩大范围；Rocket Mortgage 现在每月运行超过
              400,000 次聊天对话和 1 million 次外呼拨号，SoFi 每周处理 50,000+ 次对话。Ramp 一年内从单渠道入站智能体扩展到语音和多渠道工作流。Singtel 不到十周上线，并立即计划把
              AI 扩展给企业客户。部署足迹持续扩大，加上 ARR 轨迹，说明既有账户内净扩张很强，即便续约率数据尚未披露。
