      - number: '5.3'
        title: 客户工作流与部署模型
        blocks:
          - type: paragraph
            body: >-
              Sierra 采用高触达、专职 AI 工程师模式部署，而不是自助或交钥匙安装。每个企业客户都会分配一名 Sierra AI 工程师，从初始 SOP 摄入到生产发布和持续优化，全程指导实施。集成由 API
              驱动：Agent Studio 2.0 内的 Agent SDK 和 Integrations 功能，能在数天而非数月内连接 CRM
              系统（Salesforce、Kustomer）、账单平台、库存系统、联络中心基础设施和企业自有数据仓库。Workspaces 功能支持 CX、运营和工程团队安全协作迭代，并提供 GitHub
              风格分支，让联络中心运营负责人可以提出旅程变更，而不会把未经测试的代码推入生产环境。[CE014] [CE015]

              投产之后，Sierra 的运营模型会自我强化。Insights 2.0 通过分析互动日志持续暴露表现缺口。Expert Answers
              从最佳人工客服解决方案中自动生成新的知识库文章，再反馈进智能体的知识上下文。随着 2026 年 5 月 Ghostwriter 发布，优化循环变得部分自主：Ghostwriter
              分析互动、提出改进、在沙盒环境中验证，并排队等待人工审核——Sierra 称之为“智能体装配线”。[CE016] [CE017]

              截至 2026 年 6 月，部署渠道覆盖聊天（网站组件和 WhatsApp）、语音（PSTN 电话和基于 SIP 的联络中心）、电子邮件、SMS 和 ChatGPT 插件集成。ChatGPT 发布功能在
              Sierra Summit 2025 推出，允许客户一键把现有 Sierra 智能体扩展到 ChatGPT 每周 800 million
              用户的消费者受众，并完整控制暴露哪些旅程、数据和能力。客户部署验证了运营规模：Rocket Mortgage 每月用 Sierra 处理超过一百万次 AI 外呼和超过 400,000 次聊天对话，AI
              辅助客户完成按揭的比例是非 AI 路径的三到四倍。ADT 每月用 Sierra 处理数百万次客户关怀互动，智能体管理账单、故障排查和账户查询。Sonos 用 Sierra 推动其 “time-to-music”
              指标，覆盖设备设置、订单管理和网络故障排查，降低客户费力程度和升级量。[CE018] [CE019] [CE020]
