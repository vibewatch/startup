            title: 结果导向定价形成持久对齐
            body: >-
              Sierra 的结果导向模型把收入直接绑到交付给客户的价值上，消除了按席位授权内在的闲置软件问题。当智能体表现良好，这种对齐会降低流失风险，激励 Sierra
              持续提高解决率，并让公司在客户把更多互动量导向平台时捕获更多收入。采用按席位定价的传统竞争对手，如果不蚕食自己的装机基础，很难复制这一点。
            calloutType: strength
