      - number: '8.2'
        title: 估值背景、融资历史与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Sierra 于 2026 年 5 月完成 $950 million Series E，由 Tiger Global 和 GV（Alphabet 风险投资部门）领投，投后估值 $15.8
              billion。此前融资节奏非常精准：2024 年 10 月完成 $175 million Series C，估值约 $4.5 billion；2025 年 9 月完成 $350 million Series
              D，估值约 $10 billion。所有轮次累计融资超过 $1.475 billion。三轮融资压缩在 18 个月内，显示资本正加速投向全球扩张、收购（法国 Fragment、日本 Opera Tech）和 AI
              基础设施。假设交割前运营现金消耗很少，$950 million 融资可能在交割时提供 $1 billion 运营现金。隐含烧钱倍数——融资金额除以新增 ARR——公开数据无法得知，但这是关键承销变量。在 100%
              ARR 增长、烧钱倍数 1.5–2× 的情况下，Sierra 约以 $200 million ARR 为基础，每季度消耗 $75–100 million 净现金，符合激进但并非罕见的成长阶段烧钱画像。Series
              E 以 79–100× ARR 定价，意味着投资人已承销一条路径：在 18–24 个月内以持续 100%+ 增长达到 $500 million 或更高 ARR——Bret Taylor
              本人也公开表达过这一目标。公开证据无法确认是否存在清算优先权堆叠、棘轮条款或反稀释机制；但在累计融资 $1.475 billion、普通股基础未知的情况下，如果退出估值低于 $3
              billion，优先股堆叠可能很重要。以 $15.8 billion 入场，需要确信乐观情景是众数（最可能）结果，而不只是上行情形。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              上市企业软件可比公司，为 Sierra 79–100× 隐含 ARR 倍数提供了冷峻背景。C3.AI（NASDAQ: AI）是最直接的上市纯企业 AI 可比公司，截至 2026 年 6 月市值约 $1.56
              billion，过去十二个月收入 $300 million，倍数为 5.2×；其 2020 年 IPO 时投资人定价所期待的增长率和利润率画像后来未能实现。ServiceNow（NOW）是企业平台 SaaS
              金标准，也是工作流自动化的直接竞争者，市值 $128.3 billion，TTM 收入 $13.96 billion，倍数 9.2×，反映其更强增长、自由现金流率和平台黏性。Salesforce（CRM）市值
              $156.5 billion，收入 $41.5 billion，倍数 3.8×，已从 2021 年峰值显著压缩。NICE Systems（NASDAQ: NICE）是最接近的上市 CCaaS
              竞争者，具备企业级对话式 AI 和劳动力优化能力；其 SEC 提交的 2025 年 Form 20-F 显示全年收入约 $2.4 billion，隐含市值约 $10 billion，倍数 4.2×，且与
              Sierra 的核心客服智能体用例直接重叠。在并购中，Thoma Bravo 2022 年以 $10.2 billion 收购 Zendesk，后者 ARR 约 $1.7 billion，为领先 CX
              软件平台设定了 6× ARR 基准，且 Zendesk 并不具备 Sierra 的增长率。可比集合一致支持优质企业软件 4–10× 历史收入倍数，而 Sierra 隐含倍数为
              79–100×。投资人只有在假设持续超高速增长（100%+ CAGR）和类别赢家结果时，才能证明该溢价合理——两者都未被公开数据确认。Sacra 独立研究估计 Sierra 截至 2026 年 5 月 ARR 为
              $200 million，与 Bloomberg Series E 报道相互印证，但也指出该估计基于接近公司的数据，而非经审计财务。
