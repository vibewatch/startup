  - id: FR001
    title: Sierra 风险热力图
    type: matrix
    layout: wide
    summary: 覆盖 Sierra 五大主要风险域的风险热力图。可能性和影响按高 / 中 / 低评级，依据公开证据；缓释成熟度反映公开披露的控制措施；残余严重度反映缓释后的投资者敞口。
