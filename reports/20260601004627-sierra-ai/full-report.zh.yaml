        - 确认 EU 客户数量和数据驻留认证；索取法国 / 欧洲 ARR
      - - 被竞争对手替代风险
        - Salesforce Agentforce、Microsoft Dynamics 365、Genesys、ServiceNow 都在扩展智能体能力
        - 既有 CRM/CCaaS 厂商可能把智能体能力打包销售，压低独立 Sierra 的价格
        - 跟踪竞争性赢单 / 输单率；询问 2026 年被 Salesforce 或 Microsoft 替代的交易
