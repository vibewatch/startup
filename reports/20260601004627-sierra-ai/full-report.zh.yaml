      - number: '4.3'
        title: 单位经济代理指标与毛利结构
        blocks:
          - type: paragraph
            body: >-
              公开信息无法直接确定 Sierra 的毛利率：公司没有披露收入、收入成本或任何运营费用科目。两个结构性特征让 Sierra 的经济性如何对比纯软件 SaaS
              标杆存在明显不确定性。第一，公司采用高触达交付模式，为每个企业客户配备专职 AI 工程师，而不是提供自助部署。这层专业服务——从数周实施周期和依赖客户特定配置可以看见——相对产品化 SaaS
              同类，可能压低毛利率。第二，Sierra 平台同时运行十五个或更多大语言模型，为每次客户互动路由到最适合该任务的模型。按 Sierra 的运营规模——潜在每年数十亿次互动——LLM
              推理成本是一项有意义且持续的运营费用；模型商品化会改善这一点，但今天仍是实质性逆风。

              账本另一侧，若干代理指标显示客户经济性很强，可能支撑较高定价底线。分析师研究曾引用 70% 或更高的智能体拦截率，意味着客户可获得足以支撑六位数年度合同的大幅成本节省。SiriusXM 称其由 Sierra
              驱动的 Harmony 智能体是评分最高、客户费力程度最低的客服渠道，这种结果画像与高留存一致。2025 年末发布的 Agent Studio 2.0 和 Agent OS 2.0
              无代码工具，明确旨在降低对专业服务的依赖，并随时间改善毛利率；但发布以来毛利改善幅度尚未披露。平均合同价值、获客成本（CAC）、回本周期、NRR 和总留存率（GRR）都是私有指标，没有数据室无法获得。
