      - number: '2.4'
        title: 塑造近期机会的驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              支撑 Sierra
              市场顺风的同一批证据，也解释了为什么这个品类并非毫无摩擦。驱动因素很清楚：全渠道沟通、多语言支持、联络中心人力压力，以及客户在销售和服务场景中与智能体互动的意愿上升。但约束同样重要。遗留系统集成依旧困难，AI
              素养和变革管理参差不齐；面向客户的准确率必须明显好于“够用”，否则会引发信任和责任问题。Salesforce
              自身数据暗示，市场正在落到人类加智能体的混合运营，而不是完全自动化；这很现实，也可以说更健康。CMSWire 的提醒是对的：当对话式 AI 变成标配，供应商仍需证明持久 ROI、信任和差异化。对 Sierra
              来说，机会很大，但可投资的市场部分比自上而下 TAM 图表暗示的更窄，也更依赖执行。执行质量将决定市场获取。
