      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景（35% 概率）假设 Sierra 到 2027 年底达到 $400–500 million ARR，动力来自 Fortune 50 持续渗透、SoftBank
              日本分销合作显著放量、既有账户语音智能体量翻倍，以及 Agent OS 2.0 和 Agent Data Platform 推动 NRR 显著扩张至 120% 以上。在这些假设下，以 $450 million
              ARR 运行率、35–50× 前瞻 ARR 完成 IPO 或成长股老股交易，意味着 $15.75–22.5 billion 估值——低端基本与 Series E 入场持平，高端为 1.4×。基准情景（40%
              概率）假设受竞争性定价压力、日本爬坡慢于预期以及 Fragment 和 Opera Tech 收购整合摩擦影响，ARR 增长到 2027 年降速至 60–80% CAGR，达到 $280–350 million
              ARR。若使用与高增长 SaaS 上市可比公司高端一致的 20–30× 前瞻倍数，隐含估值为 $5.6–10.5 billion，相比 $15.8 billion Series E 入场减值
              33–65%。悲观情景（25% 概率）假设 ARR 增长降至 50% CAGR 以下，触发因素包括重大企业账户流失、欧盟监管执法行动，或 OpenAI 对金融服务智能体施加用例限制，使 ARR 降至
              $150–200 million。按陷入困境企业 AI 倍数 8–12×（与 C3.AI 重定价轨迹一致），隐含估值为 $1.2–2.4 billion，减值 85–92%。三个情景的概率加权预期退出价值约为
              $9.5–11 billion，低于 $15.8 billion Series E 入场，因此在标准基准 / 悲观假设下，这是一笔负期望值投资。只有当乐观情景概率超过 50–55%，投资才会转为正值。
