        blocks:
          - type: paragraph
            body: >-
              创始人履历异常强。Bret Taylor 的经历横跨 Google Maps、Facebook、Quip、Salesforce 和 OpenAI 董事会；Clay Bavor 则在 Google
              拥有长期产品领导经验，覆盖 Workspace、AR/VR 和 Google Labs。这个组合让 Sierra
              立刻获得企业买家、风险投资人和模型平台伙伴的信任。另一面是，公司的公众形象仍高度集中在两位创始人身上。Sierra 官方页面对 Bret 和 Clay
              的强调远多于更完整的高管团队；已审阅的公开材料也没有给出深入的董事会或治理图谱。对投资判断而言，创始人与市场的匹配是重大优势，但关键人物依赖同样真实存在。投资者押注的不只是产品逻辑，也是一套创始人主导的执行模式；从外部看，这套模式的组织厚度仍然偏窄。
