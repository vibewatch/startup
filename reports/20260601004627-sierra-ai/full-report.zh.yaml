      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >
              Sierra 由 Bret Taylor（前 Salesforce 联席 CEO、OpenAI 董事、Twitter 董事会主席）和 Clay Bavor（前 Google AR/VR 副总裁）创立；根据
              2025 年 11 月 Forbes 报道，两人均以联席 CEO 身份全职运营。他们的人脉、信誉以及技术和商业愿景，深度嵌入 Sierra 的品牌、融资和企业销售动作——分析师尤其把 Taylor 视为进入
              Fortune 50 的核心因素。Sierra 未披露继任计划、总裁或 COO，也未披露任何可在对外角色上替代任一创始人的明确候选人。在联合创始人之下，Sierra 与
              OpenAI、Anthropic、Google DeepMind 和 Salesforce 激烈争夺 AI 工程师和应用 ML 研究员，而这些公司都提供有竞争力或高于市场的薪酬。Fragment（法国）和
              Opera Tech（日本）两项国际收购同步整合，显著挤压管理带宽；每项整合都需要本地化平台、对齐销售动作，并在至少三个法律实体之间管理文化融合。Sierra 在 2025 和 2026 年入选 CNBC
              Disruptor 50，加上 Benchmark 和 Sequoia
              背书，为人才吸引提供杠杆，但仍无法完全抵消超大规模云厂商雇主的结构性薪酬优势。公司未披露总员工数、流失率或工程产能，仅凭公开来源无法独立评估执行风险。
