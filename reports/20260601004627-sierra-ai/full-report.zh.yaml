            - 部分（仅提供每月 2M 次客户服务请求背景）
            - 弱 — 未发布解决率
            - 扩展中 — 计划加入支付、改期
            - 中 — 案例研究有叙述，无指标
        - label: SiriusXM
          values:
            - 是
            - 部分（评分最高渠道；无 NPS 变化）
            - 中等 — 仅有「评分最高」定性说法
            - ADP 扩展确认合作已满 2 年以上
            - 高 — 案例研究 + ADP 新闻稿
        - label: Sonos
          values:
            - 是
            - 部分（定性；CES 指标未公开）
            - 弱 — 未发布指标
            - 15M 客户基础；F30 项目仍在推进
            - 中 — 叙述性案例研究
        - label: Sutter Health
          values:
            - 是
            - 部分（确认已投入运营）
            - 弱 — 未发布患者满意度指标
            - 上线后未知
            - 中 — 网络研讨会引用
    approximationNotes: 结果强度和引用质量均为分析师基于公开案例研究内容给出的评级；未经独立第三方验证。
