      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Sierra 拥有一套宽泛合规组合，覆盖通用企业安全标准和行业特定监管要求，使其能够部署到医疗、金融服务、保险、通信和零售等数据保护有合同和法律强制要求的垂直行业。截至 2026 年 6 月，已认证标准包括
              SOC 2 Type II、HIPAA（支持 Sutter Health 和 Cigna 等医疗部署）、GDPR（覆盖 Singtel 等欧洲客户及未来欧盟扩张）、ISO 27001（信息安全管理）、ISO
              42001（AI 管理体系，也是组合里最新、最 AI 专项的认证）、CSA STAR（云安全）、PCI DSS Level 1 Service Provider（支付处理）和
              CCPA（加州消费者隐私）。[CE027] [CE028]

              技术上，Sierra 的信任架构是多层的。监督模型包裹每一次 LLM 推理调用，在回复交付给客户前检测并压制幻觉、阻断对抗性提示注入尝试、执行业务政策约束，并防止越界回答。PII
              在平台内自动加密和脱敏；与智能体共享的个人身份信息从不以明文存储。对于支付交易，持卡人数据流经专用 PCI 认证基础设施层，该层在架构上与 Sierra 核心平台、LLM
              和持久存储隔离——这意味着即使核心平台遭攻破，也不会暴露卡数据。[CE029] [CE030]

              Sierra
              的数据治理政策明确规定，客户数据不会用于训练其他客户的模型——每家企业的互动数据相互隔离，并由该客户自己的数据使用指令治理。对受监管行业企业买家而言，这是关键差异化，因为它们不能允许自有工作流数据、客户 PII
              或业务逻辑污染另一家企业的 AI 训练。Sierra 将安全实践对照 NIST AI Risk Management Framework（2023 年 1 月发布，2024 年 7 月加入 GenAI
              Profile 更新）和 OWASP Top 10 for LLM Applications；后者代表社区验证过的指导，正对应客户面对对话式 AI
              平台所面临的对抗性风险类别——提示注入、不安全输出处理、过度代理性。EU AI Act 监管框架（高风险 AI 应用自 2026 年 8 月起生效）为 Sierra
              的欧洲企业业务增加了一层仍在落地的合规要求。公司 Sierra Trust Center 提供成文安全控制，并可按请求访问 SOC 2 报告。[CE031] [CE032] [CE033]
