        - 年度续约节点做客户背调；信息权覆盖流失通知
        - 把悲观情景重新评估为最可能结果；与管理层沟通替代管线状态
    notes: 触发阈值是分析师定义的监测标准，不是合同条款。投资人应在交割时谈判信息权，覆盖每个可监测信号。部分触发信号（LLM 提供商限制、欧盟执法）可能在预警有限的情况下出现，因此投资前法律和技术尽调必须提前完成。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调要求表
    description: >-
      The six highest-priority data-room requests for Sierra AI, with rationale for why each item is required before
      investment conviction can reach underwriting-grade confidence.
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - ARR、NRR 和队列留存
        - 按客户队列年份和细分市场拆分的总 ARR、净 ARR、总收入留存率（GRR）和净收入留存率（NRR）
        - 估值倍数完全依赖 100%+ ARR 增长能否维持；NRR 能确认增长来自新客户还是既有账户扩张
        - 数据室：要求提供过去 8 个季度 ARR 桥表、按年份划分的客户流失、按客户规模区间划分的 NRR
      - - 毛利率和 LLM COGS
        - 不含客户成功员工数的毛利率，并将 LLM 推理成本单列
        - 没有毛利率，就无法判断 Sierra 是 SaaS 级别（70–80%）还是带服务属性（40–60%）；LLM COGS 轨迹影响长期估值
        - 数据室：提供含毛利润行的 P&L；要求按模型提供商和用例类别拆分推理成本
      - - 客户收入集中度
        - 前 10 大账户占总 ARR 的比例，以及客户基数 Herfindahl 指数
        - 若一个 10–20% 账户不续约，就会证伪基准情景 ARR 轨迹，并触发下调估值融资信号
        - 数据室：按十分位提供 ARR 分布；确认是否有单一客户超过 ARR 的 10%
      - - LLM 提供商合同
        - 与 OpenAI、Anthropic 和 Google 的完整提供商协议；定价条款、MFN 或用量承诺保护、用例限制条款
        - LLM 涨价或用例限制是概率最高的毛利率风险；合同条款决定 Sierra 能通过合同缓释多少风险
        - 数据室：完整提供商协议；外部律师审查与金融服务和医疗有关的限制条款
      - - 股权结构表和优先权瀑布
        - Series A 到 E 的完整股权结构表，包括清算优先权、反稀释机制、棘轮条款和参与权
        - 在已融资 $1.475B、投后估值 $15.8B 的情况下，优先股堆叠可能在低于 $8B 的退出场景中显著损害普通股回报
        - 数据室：经认证的股权结构表；按 $5B、$10B、$15B、$20B 退出假设建模瀑布
      - - 欧盟监管姿态
        - Fragment（法国）EU AI Act 高风险系统评估；DPA 往来；欧盟客户 GDPR 数据处理协议
        - EU AI Act 高风险系统要求将于 2026 年 8 月生效；不利分类会要求合格评定，可能延迟或限制欧盟部署
        - 外部欧盟 AI 法律顾问；要求提供 Fragment 监管法律顾问备忘录和 DPA 往来日志
    notes: 尽调要求按对投资信心的影响排序。第 1、2 项（ARR/NRR 和毛利率）是门槛：没有它们，就无法可信承销 $15.8B 估值。第 3–6 项也很重要；如果数据室访问受限，部分问题可通过管理层陈述缓解。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
