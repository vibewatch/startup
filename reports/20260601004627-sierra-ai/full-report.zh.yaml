      - number: '2.2'
        title: 估算视角：市场很大，定义很乱
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个结论：Sierra 所处品类很大且在扩张；但数据并不支持假装存在一个标准 TAM。已发布的 2025 年市场规模数字从 $13.64B 到 $19.31B 不等，取决于发布方是在广义估算对话式
              AI，还是更窄地估算企业对话式生成式 AI，或更窄的智能体 AI。2026
              年起点同样分散，长期预测分歧更大。这种离散不是证据缺陷，而是市场现实：供应商、分析师和客户仍在收敛定义。对尽调而言，正确做法是保留多重视角：广义对话式 AI TAM，更窄的企业客户体验
              SAM，以及更窄、近期可获取的、愿意在生产环境运行关键任务智能体的大型受监管企业 SOM。Sierra 受益于这个增长背景，但投资判断应锚定受约束区间，而不是最大化的行业标题。
