      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 Series E 之后，Sierra 的资本状况达到历史最强。GV（Google Ventures）和 Tiger Global 领投，Benchmark、Sequoia 和
              Greenoaks 参投的 $950 million 融资，使已披露生命周期资本总额达到约 $1.585 billion，并把报告口径现金余额推到 $1 billion
              以上。这样的资产负债表厚度对私营成长公司并不常见，也为近期融资依赖提供了厚实缓冲。公司披露的资金用途覆盖 Agent OS 平台开发、面向非技术团队的部署工具、AI
              驱动的智能体改进，以及向销售和互动工作流扩张——这个宽泛授权会同时在产品、工程、销售和运营上消耗资本。

              融资节奏本身值得审视。Sierra 上一轮 $350 million 融资在 2025 年 9 月完成；Series E
              大约八个月后跟进。即使用超高增长标准看，这个间隔也很短，暗示现金部署非常快，或公司选择在估值势能强时提前融资。28 个月内三轮融资——2024 年 10 月以 $4.5 billion 估值募集 $175
              million，2025 年 9 月以 $10 billion 估值募集 $350 million，2026 年 5 月以 $15.8 billion 估值募集 $950 million——显示 Sierra
              随着全球足迹扩大、增加工程员工、进入新办公室（Tokyo、Singapore、Madrid、Paris、London、Sydney）并建设合规基础设施，资本强度正在加速。SoftBank Vision Fund
              2 在 2025 年 12 月随 Sierra 进入日本追加了一笔未披露战略投资。没有公开披露债务融资、可转债或信用额度；截至 Series
              E，所有融资看起来均由股权支持。月度烧钱速度未公开，因此无法精确计算现金跑道；谨慎做法是假设 Sierra 当前运营规模下支出激进。
