  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：同类公司、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Sierra 所处市场已经足够拥挤，草率界定竞争对手会带来虚假的安全感。直接创业公司同类包括明确销售 AI 客服智能体或相邻平台的公司：Decagon、Forethought、Intercom
              Fin、Gorgias、Kustomer、Kore.ai 和 Replicant。既有厂商更难对付，因为它们把 AI
              打包进客户已经在用的企业系统：Salesforce、Microsoft、ServiceNow、Zendesk、Genesys、LivePerson 和
              Freshworks。除此之外，还有一些看起来完全不像传统供应商的替代路径，例如用 CrewAI、Botpress 搭内部构建，或采用 UiPath 这样的工作流自动化栈。结果是，Sierra
              面对的不是少数几个显而易见的正面竞争者。它同时在和聚焦型创业公司、捆绑能力强的既有巨头，以及自建还是购买的替代方案竞争。因此，品类地图本身就是尽调任务，而不是形式动作。这也意味着，任何护城河主张都必须说明
              Sierra 究竟在哪条赛道、相对谁在赢。
