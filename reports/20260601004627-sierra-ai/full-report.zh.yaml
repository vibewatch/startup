      - number: '6.2'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Sierra 发布了十余家企业客户案例，包含具名高管和具体结果数据，这种透明度在企业 AI 平台中并不常见。已确认量化结果的生产部署包括 Rocket Mortgage（AI 加银行家路径带来 4×
              转化提升；每月 400,000+ 次聊天对话；每月 1M+ 次外呼拨号）、SoFi（61% 拦截率；每周 50,000+ 次对话；面向 13.7 million 会员发布三个月后 NPS 增加 33
              分）、Ramp（90% 案件通过自动化解决）和 Singtel（73% 移动故障排查案例无需人工坐席即可解决；前六周 70,000+ 个案例）。其他已确认生产部署包括 ADT（每月管理 2 million
              个关怀请求）、Sonos（覆盖 15 million 个家庭的首 30 天入门智能体）、SiriusXM（Harmony 智能体被评为公司满意度最高、费力度最低的服务渠道）、Sutter
              Health（SutterSync 慢病项目；25 家医院；3.5 million 名患者）、Nordstrom（语音智能体 Nora；五周上线）和 Cigna（患者认证时间缩短 80%；八周上线）。Sierra
