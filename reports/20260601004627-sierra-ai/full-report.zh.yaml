      - number: '3.2'
        title: 能力宽度与打包方式差异
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争差异不只是模型质量。有些供应商围绕电商专精，有些围绕帮助台套件，有些围绕 CRM，有些围绕语音，还有些围绕更宽的工作流自动化。Sierra
              自身定位强调一个服务复杂企业工作流的单一多渠道智能体，尤其面向受监管环境。这个框架不同于 Gorgias 的电商专长、Kustomer 以 CRM 牵引的服务栈、Genesys 的联络中心底色，也不同于
              Microsoft 或 Salesforce 的既有客户扩张策略。定价和打包方式也很不统一。Sierra 公开上依赖协商式、结果导向的企业合同，许多竞争对手则以更产品化或捆绑式动作切入。这意味着 Sierra
              可以在复杂度和部署深度最重要的场景胜出，但也意味着许多竞争者在首次评估时会显得更简单或更便宜。因此，买家选择的常常既是产品，也是商业化打法。实践中，简单本身就可能成为很多团队眼中的竞争功能。
