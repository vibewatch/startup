            body: >-
              Sierra 超过 $1 billion 的现金头寸提供了真实的资产负债表灵活性，但 28 个月三轮融资的节奏意味着资本强度在加速。即使有 $1 billion 现金跑道，如果月度烧钱跟随全球员工增长和规模化
              LLM 基础设施上行，18–24 个月内启动后续融资并不意外。Bret Taylor 自己预测 AI 市场将在两年内修正，也增加了时间压力：在修正前融资的有利窗口，可能比跑道数学暗示的更早关闭。
