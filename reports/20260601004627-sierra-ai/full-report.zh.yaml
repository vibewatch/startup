            body: >-
              投资判断最关键的两个输入——毛利率和月度烧钱——完全不公开。没有这些数据，就无法判断 Sierra 是否具备 SaaS 级经济性，还是采用服务占比很高、因而需要低得多进入估值的成本结构。Series D 到
              Series E 只有 8 个月，暗示资本正在快速部署，但烧钱倍数无法计算。
            calloutType: risk
