        title: 资本基础、客户质量证明与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              按公开标准看，Sierra 的扩张速度非常快。公司和媒体来源大体指向同一条轨迹：2024 年 2 月发布，七个季度后达到 $100M ARR，到 2026 年 2 月超过 $150M ARR，随后在 2026 年
              5 月以超过 $15B 估值融资。已披露轮次支持至少约 $1.585B 的生命周期融资额，且尚未计入 SoftBank 未披露的战略投资。同样重要的是，Sierra
              自己披露的客户质量对私营公司而言异常强：覆盖超过 40% 的 Fortune 50，处理数十亿次客户互动；客户组合中，一半账户收入超过 $1B，四分之一超过 $10B。这些说法在方向上很有说服力，因为它们暗示
              Sierra 赢下的是复杂大型企业，而不是小型实验性买家；尽管当前经审计员工数和精确股权结构表仍不可得。用投资人语言说，Sierra 已经更像一笔规模化品类押注，而不是早期试点阶段供应商。
