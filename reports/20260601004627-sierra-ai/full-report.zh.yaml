        title: 里程碑、国际扩张与早期反向背景
        blocks:
          - type: paragraph
            body: >-
              Sierra 的里程碑记录已经不只是直线式软件增长。公司从四个设计伙伴起步，2024 年初公开发布，到 2026 年扩张到九个列名办公室，2026 年 5 月开设 Toronto，2025 年末在
              SoftBank 支持下进入日本，并在 2026 年 3 月收购 Opera Tech。产品里程碑同样重要，因为它们显示公司正借 Ghostwriter 和 Agent OS
              从客服自动化走向关系管理。与此同时，公开叙事并非没有警示信号。Forbes 强调，智能体耐久性和错误处理仍是活跃问题；TechCrunch 则明确称 Sierra 2025 年末 ARR
              倍数很高。因此，公司概况支持后续章节的一个明确结论：Sierra
              迅速成为品类领导者，但它也同时承受领导权集中、资本预期沉重、私营公司披露不完整等压力。下一步尽调要检验的是，公司能否把这种快速公开势能转化成可重复的经济性和持久客户结果。
