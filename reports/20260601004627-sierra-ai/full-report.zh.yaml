  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体分层
        blocks:
          - type: paragraph
            body: >
              Sierra 瞄准客户互动量足够高、因而能支撑按结果计费 AI 智能体投入的大型企业。可服务买方画像偏向年收入超过 $1 billion 的公司；根据公司第二年披露，一半客户超过这一门槛，四分之一客户收入超过
              $10 billion。行业垂直覆盖金融服务（贷款、银行、保险、金融科技）、医疗、通信、消费电子、家庭安防和旅行 /
              酒店。买方角色高度一致，都是企业客户体验或运营负责人——首席客户官、会员体验副总裁、联络中心运营负责人——其成功指标包括解决率、拦截率、NPS 和单次互动成本。Sierra 不服务
              SMB，也没有自助层；据报道，最低合同门槛从每年 $150,000 起，另有 $50,000 实施费。平台覆盖美国各地，并在日本（SoftBank 合作、Opera Tech 收购）、法国（Fragment
