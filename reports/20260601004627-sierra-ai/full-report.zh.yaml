companyProfile:
  summary: >-
    Sierra AI 创立于 2023 年，由 Bret Taylor 和 Clay Bavor 领导。公司向大型企业销售多渠道 AI 智能体及配套工具，帮助它们在客服、留存、支付、信贷、医疗等高频流程里自动化并改善客户互动。到
    2026 年中，Sierra 已在投后估值 $15.8 billion 的 Series E 轮融资中募集 $950 million；公司确认 ARR 下限超过 $150 million，并称服务范围覆盖超过 40% 的
    Fortune 50。
