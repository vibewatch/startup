  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              Sierra AI 的商业模式就是为了摆脱按席位授权的企业软件许可。公司主要按结果收费，也就是说，只有当 Sierra AI
              智能体解决一次客户互动，或达成一个预先定义的业务结果时，客户才付费——一次已解决的支持对话、一次挽回的取消、一次完成的增购或交叉销售，或一笔端到端支付交易。如果互动升级给人工客服，多数情况下不会产生费用，从而拿掉了传统
              CX 供应商按结果计费时常见、阻碍升级的扭曲激励。对于更简单的路由或迎宾式互动，因为不适合用结果衡量，Sierra
              提供混合的用量式选项：无论是否解决，都按对话付费。这个混合模型让客户能按互动类型和复杂度搭配不同定价层。

              Sierra 不发布公开价格页，也不披露每次互动的实际价格。来自竞争对手的第三方分析估计，企业合同起价约为每年 $150,000，一次性实施费起价约 $50,000。这些数字很可能代表区间低端，因为公司面向
              Fortune 50 账户，并为每个客户部署专职 AI 工程师，而不是提供自助或交钥匙产品。Agent Data Platform（ADP）记忆和个性化层，以及 Live Assist 人工升级产品，在
              2025–2026 年均已商业化；但二者的定价结构——单独收费还是并入结果费用——尚未公开披露。Sierra 通过首创的对话式支付能力进入 Level 1 PCI
              合规支付处理，也为交易完成类用例增加了新的收入面。
            claimRefs:
