      - number: '4.2'
        title: 收入轨迹与公开牵引信号
        blocks:
          - type: paragraph
            body: >-
              Sierra 在 2025 年 11 月达到 $100 million 年经常性收入（ARR），距离 2024 年 2 月商业发布只有七个季度；CEO Bret Taylor 称这个速度在 SaaS
              历史上前所未有。作为参照，快速扩张企业软件标杆之一 Snowflake 用了 17 个季度才达到同一里程碑。Sierra 的第一个 $50 million 季度紧随其后出现在 2025 年 Q4，使公司到
              2026 年 2 月超过 $150 million ARR。Sacra 独立估计，到 2026 年 5 月 ARR 约为 $200 million，暗示 Series E
              融资为销售和员工容量带来顺风，季度环比仍在加速。按这个速度，Sierra 进入第三年时大约会处在每季度 $100 million 的运行率上。

              支撑收入信号的不只是客户数量，还有客户质量。Sierra 报告称，超过 40% 的 Fortune 50 已使用其平台；约一半企业客户年收入超过 $1 billion，约 20% 超过 $10
              billion。截至 2025 年 10 月，语音智能体按互动量已经超过文字聊天，成为 Sierra
              的主要互动渠道——距离语音产品发布不到一年，反映出大规模呼叫中心工作负载迁移。具体客户部署验证了转化提升：Rocket Mortgage 称，使用 Sierra Digital Assistant
              的客户成交率是非 AI 路径的三到四倍；每月通过 Sierra 处理超过 400,000 次聊天对话和超过一百万次外呼。Bret Taylor 估计，客户服务总可用市场每年为 $400
              billion；如果这个框架成立，Sierra 估计 $200 million ARR 代表的市场渗透率不到 0.1%。
