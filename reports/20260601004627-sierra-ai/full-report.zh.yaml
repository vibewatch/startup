      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              Sierra 平台在 30+ 个 Fortune 500 生产部署中，以生产规模处理关键企业工作流——抵押贷款发放、患者互动、保险理赔和高价值订阅。这样的生产暴露，在多个攻击面上带来实质运营和安全风险。LLM
              幻觉仍是基础风险：大语言模型可能生成看似合理但错误的输出，在金融或医疗场景中可能造成监管违规、错误放款或患者伤害。OWASP 的 LLM Top 10 框架将提示注入列为智能体系统最高严重性漏洞；攻击者若能操纵
              AI 智能体的系统提示，可能诱使其执行未授权的金融或数据访问操作。Sierra 的信任与可靠性页面确认公司使用安全评估、过滤和分层护栏，但未发布具体模型错误率、幻觉基准或红队结果。语音 AI
              部署引入额外风险：Sierra 关于语音 AI 的博客明确承认，嘈杂环境中的音频质量会降低 AI 表现——这对 ADT（家庭安防，环境通常嘈杂）和 SiriusXM（车载）部署都是实质缺口。对多租户 SaaS
              平台来说，企业租户之间的数据隔离也是问题；Sierra 隐私政策规范数据使用，但未说明租户隔离架构措施。若服务中断影响 ADT（每月 2 million 个关怀请求）或 Rocket Mortgage（每月
              400,000+ 次对话），客户和 Sierra 都会承受直接运营和声誉后果；Sierra 的按结果计费模式只有成功解决才收款。NIST Cybersecurity Framework 为韧性规划提供公认标准，但
              Sierra 尚未发布外部审计或渗透测试摘要来验证其安全姿态。
