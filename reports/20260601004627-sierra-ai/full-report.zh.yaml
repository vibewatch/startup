      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >
              Sierra 未披露净留存率（NRR）、总留存率（GRR）、流失率或队列级续约数据。可用代理指标主要是行为和结构。按结果计费——客户为已解决互动、已完成交易或挽回取消付费——把 Sierra
              收入直接绑定到客户感知价值：客户一旦流失，Sierra 就停止产生收入，双方都有强动机持续交付结果。SiriusXM 在 2024 年 2 月被宣布为 Sierra 最早设计伙伴之一，截至 2026 年 5 月
              Agent Data Platform 公告仍在扩展部署，意味着连续合作超过两年。Ramp 2023 年搭建第一套自研 AI，随后迁移到 Sierra，到 2025 年已扩展到所有支持渠道和语音。ADT 上线
              Sierra 智能体后，公开表示计划扩展到支付、改期和增购工作流，符合多年关系轨迹。平台的 Agent OS 和 Agent Data Platform
              会形成跨会话数据依赖，一旦大规模部署，切换成本会上升。客户满意度证据主要是定性材料（高管引述、“最高评分渠道”称号），而不是纵向队列数据，这仍是最主要的尽调缺口。
