      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Sierra 的 Fortune 50 集中度（Fortune 50 中 40%+ 为客户）既是证据点，也是风险因素。正面看，它验证了企业级可用性，并带来强参考杠杆。负面看，少数 Fortune 50
              账户可能贡献了不成比例的 ARR；单个大账户若流失或缩减支出，收入影响可能很大。Sierra 未披露收入集中度指标。地域扩张正在加速：SoftBank 在日本的支持（由 Opera Tech 收购牵引）、法国
              Fragment，以及 Singtel 作为亚洲锚定客户，构成第一批非美国收入基础；但大多数具名证据仍以美国为中心。按结果计费限制了 Sierra 的定价可预测性——买方若把已解决对话量从每周 50,000
              次放大到 500,000 次，且没有固定上限，成本可能增加十倍；行业观察者已将其列为采购摩擦点。账户内落地后扩张显然有效（Ramp：入站 → 语音 → 非支持；SiriusXM：支持 → ADP →
              外呼销售；Singtel：新加坡 → 企业客户），但缺少公开 NRR 数据，跨组合扩张率无法验证。
