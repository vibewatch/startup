              - CE023
          - type: callout
            title: LLM 依赖集中与专人服务扩张，是最主要的产品风险
            body: >-
              Sierra 的产品质量高度依赖少数前沿 LLM 供应商（OpenAI、Anthropic），而这些供应商的定价、条款和 API 可用性都不受 Sierra 控制。同时，支撑质量的专属 AI
              工程师部署模式会形成结构性产能上限，在当前员工规模下限制可服务账户数量。两项风险都很重要，且公开披露中尚未解决。
