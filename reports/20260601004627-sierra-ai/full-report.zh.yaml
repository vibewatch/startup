      - number: '5.7'
        title: 图表与证据
        blocks:
          - type: callout
            title: 上下文工程与自研转录叠出技术护城河
            body: >-
              Sierra 的渐进披露上下文引擎和多供应商转录集成器，为企业级客户体验（CX）生产环境专门打造，并非从通用 LLM 工具包改造而来。转录错误率降低 25–37%、解决率最高提升 1%，都是与 Sierra
              自研投入直接绑定的具体性能主张。随着基准数据增长，这些组件会随使用量继续叠加，拉大与商品化替代方案的差距。
            calloutType: strength
