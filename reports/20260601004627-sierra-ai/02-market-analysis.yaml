- id: drivers-constraints
  title: Drivers and constraints that shape the near-term opportunity
  body: 'The same evidence that supports Sierra’s market tailwind also shows why the category is not frictionless. Drivers are clear: omnichannel communication, multilingual support, contact-center labor pressure, and a growing willingness by customers to interact with agents in both sales and service contexts. But constraints are equally important. Legacy integration remains hard, AI literacy and change management are uneven, and customer-facing accuracy has to be materially better than “good enough” to avoid trust and liability problems. Salesforce’s own data implies the market is settling into hybrid human-plus-agent operations rather than full automation, which is realistic and arguably healthy. CMSWire’s caution is the right one: as conversational AI becomes table stakes, vendors still need to prove durable ROI, trust, and differentiation. For Sierra, that means the opportunity is large, but the investable part of the market is narrower and more execution-sensitive than top-down TAM
    graphics suggest. Execution quality will determine market capture.'
