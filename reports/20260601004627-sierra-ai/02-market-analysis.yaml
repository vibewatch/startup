  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-dispersion
    missingEvidence: A consistent analyst methodology that sizes the exact enterprise customer-experience agent market Sierra is targeting.
    whyItMatters: Published TAMs vary materially because they define the market differently, which can distort underwriting if treated as interchangeable.
    diligencePath: Request management’s internal market segmentation and reconcile it to at least two third-party methodologies.
    relatedQuestionRefs:
    - QM004
    - QM005
    - QM006
    - QM024
  - type: private-evidence-only
    severity: material
    topic: sierra-som
    missingEvidence: Actual win rates, ACVs, and segment-level pipeline data that would support Sierra’s true serviceable obtainable market.
    whyItMatters: Without internal commercial data, public analysis can only estimate SAM and cannot underwrite precise share capture.
    diligencePath: Request pipeline segmentation, deployed-customer counts by vertical, and average contract values by use case.
    relatedQuestionRefs:
    - QM022
    - QM023
    - QM025
  - type: missing-source
    severity: minor
    topic: buyer-budget-owner
    missingEvidence: More direct procurement evidence naming actual budget owners and buying committees by vertical.
    whyItMatters: Budget ownership shapes sales cycle length, implementation risk, and expansion economics.
    diligencePath: Interview reference customers and request anonymized procurement paths from management.
    relatedQuestionRefs:
    - QM010
    - QM012
  - type: stale
    severity: minor
    topic: vendor-market-shares
    missingEvidence: Fresh 2026 market-share data across customer-service agent vendors.
    whyItMatters: The market is moving quickly enough that older vendor share snapshots can become misleading within a few quarters.
    diligencePath: Refresh with 2026 analyst coverage and direct customer-reference sampling before using share assumptions in valuation.
    relatedQuestionRefs:
    - QM021
