chapter:
  number: 2
  title: Market Analysis
  summary: Sierra is selling into a fast-growing but definitionally messy market that spans customer-service software, conversational AI, and agentic enterprise applications. The evidence supports a large and growing opportunity, but published market estimates vary widely and near-term enterprise adoption still depends on integration, trust, and change management.
sections:
- id: market-boundary
  title: What market Sierra is actually in
  body: 'The cleanest way to define Sierra’s market is not “all AI” and not even “all enterprise software.” Sierra is selling into the customer-experience and customer-service agent layer: software that handles or assists customer conversations, executes workflow steps, and increasingly spans the full journey from support through conversion and retention. That market includes self-service, contact-center automation, multichannel customer engagement, and selected revenue-linked service workflows such as loan origination or subscriber retention. It does not require bundling in unrelated AI spend such as coding copilots, internal knowledge assistants, or generic productivity agents. This boundary matters because it preserves a realistic competitive set and avoids inflating TAM with adjacent categories Sierra does not obviously own today. It also clarifies the substitutes Sierra displaces first: legacy IVR trees, deterministic chatbots, BPO-heavy support operations, and incumbent helpdesk suites
    adding AI features.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses
  title: 'Sizing lenses: large market, messy definitions'
  body: 'Public market data supports the conclusion that Sierra operates in a very large and expanding category, but it does not support pretending there is one canonical TAM. The published 2025 market numbers range from $13.64B to $19.31B depending on whether the publisher is sizing conversational AI broadly, enterprise conversational GenAI more narrowly, or agentic AI more narrowly still. The 2026 starting points likewise vary, and long-run forecasts diverge even more. This dispersion is not a bug in the evidence; it is a fact about a market whose vendors, analysts, and customers are still converging on definitions. For diligence, the right answer is to maintain multiple lenses: a broad conversational-AI TAM, a narrower enterprise customer-experience SAM, and a still narrower near-term SOM for large regulated enterprises willing to run mission-critical agents in production. Sierra benefits from that growth backdrop, but underwriting should stay anchored to constrained ranges rather than
    maximal industry headlines.'
  claimRefs:
  - CM005
  - CM006
