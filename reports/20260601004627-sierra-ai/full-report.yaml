      - number: '3.4'
        title: Moat durability versus commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports both sides of the competitive argument. Sierra clearly has a real execution lead:
              meaningful ARR, elite customers, strong fundraising, and a broader workflow story than a basic chatbot
              vendor. But the adverse case is also strong. Sierra’s white-glove approach may be part of what makes
              deployments successful, yet that same model can cap scalability or compress margins relative to
              lower-touch rivals. Meanwhile, as more vendors claim to offer enterprise AI agents, the category risks
              becoming table stakes rather than scarce. CMSWire’s warning is the right one: ROI, trust, and
              differentiation will determine who keeps pricing power. The public record therefore supports a balanced
              conclusion. Sierra has a lead, but not a moat that can be underwritten lazily without deeper evidence on
              pricing realization, retention, and distribution durability. That distinction should carry directly into
              valuation discipline. The real question is whether Sierra can stay differentiated as buyers get more
              choice and lower switching frictions.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
