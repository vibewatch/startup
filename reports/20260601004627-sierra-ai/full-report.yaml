      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Sierra depends on a small number of foundation-model providers—primarily OpenAI, Anthropic, and Google—for
              the core reasoning capability underpinning its agents. While Sierra's trust page confirms a multi-model
              architecture that allows customers to run agents on different underlying models and switch providers,
              dependency on externally controlled models creates pricing risk (API cost increases), capability risk
              (model degradation or deprecation), and terms risk (provider restrictions on use cases such as financial
              transactions or healthcare advice). OpenAI and Salesforce represent a dual threat: each is simultaneously
              a supplier (model access) and a potential competitor (OpenAI's operator ecosystem; Salesforce Agentforce).
              Sierra's acquisition of Fragment in France (early 2026) and Opera Tech in Japan (late 2025) introduce
              integration execution risk; both are early-stage and have not been shown to be revenue-generating in their
              own right. The SoftBank partnership for Japan distribution (announced December 2025 per Axios) creates a
              soft channel dependency—if SoftBank reduces its priority on AI distribution, Sierra's Japan pipeline is
              materially impaired. Customer revenue concentration is a direct financial dependency: with 40%+ of the
              Fortune 50 as customers but no disclosed per-account revenue breakdown, the loss of any one or two very
              large accounts could represent 10–20% of ARR. The infrastructure layer—AWS, Azure, or GCP—is undisclosed
              but assumed concentrated; a major cloud-provider outage creates an unmitigated service disruption risk.
              Sacra's competitive research identifies Decagon as the closest direct competitor in the enterprise
              conversational-AI space, while Genesys, Nice inContact, and Intercom Fin anchor the incumbent CCaaS
              alternatives, all of which are being upgraded with AI capabilities that could erode Sierra's
              differentiation.
