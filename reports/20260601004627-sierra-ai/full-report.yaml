chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating scope
        blocks:
          - type: paragraph
            body: >-
              Sierra presents itself as a company built to help large enterprises deliver better, more human customer
              experiences with AI. The core message is not generic chatbot automation: Sierra repeatedly describes a
              single agent that can operate across chat, SMS, WhatsApp, email, voice, and even ChatGPT, while the
              product page frames Agent OS as a platform for building, operating, and optimizing those agents over time.
              That matters for diligence because it defines Sierra less as a point solution and more as a multichannel
              operating layer for customer interaction. The official materials also show a business model oriented
              around outcome-based pricing and long-lived customer relationships rather than one-off support deflection.
              In plain English, Sierra is positioning itself as enterprise application software that uses AI agents to
              handle both service and revenue-linked customer workflows. That broader framing is important because it
              raises the ceiling on both contract value and competitive pressure, making Sierra a customer-experience
              platform bet rather than a narrow chatbot tool.
