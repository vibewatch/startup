      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Sierra presents a dual picture: exceptional top-line trajectory with opaque unit economics. The ARR
              velocity—zero to an estimated $200 million in 28 months—is objectively strong and positions Sierra as one
              of the fastest-scaling enterprise software businesses in the modern era. The Fortune 50 customer base,
              six-figure minimum contract sizes, and customer-facing ROI evidence (Rocket Mortgage conversion multiples,
              high CSAT scores) suggest revenue quality well above the average enterprise pilot. Outcome-based pricing
              is strategically sound as an alignment mechanism, but it introduces forecasting opacity that multiple
              independent observers—including a competitor-authored review—have flagged as a material concern for
              prospective customers.

              The financial verdict hinges on three unresolved structural questions. First, does Sierra's delivery model
              support SaaS-tier gross margins (70–80 percent) or does the professional services layer and LLM inference
              cost structure compress it toward a services-business profile (40–60 percent)? Second, what does the net
              revenue retention curve look like across vintage cohorts? A company growing this fast could be masking
              significant underlying churn with new logo volume. Third, is the rapid capital deployment rate sustainable
              at the current burn multiple, or will the company need another raise within 18–24 months despite a $1
              billion cash balance? Sierra's CEO has publicly predicted a market correction in AI within two years—a
              signal of sector-wide risk awareness that applies to Sierra's own next financing window. Until gross
              margin, NRR, burn rate, and customer cohort data are available in a data room, the financials chapter
              supports a preliminary view of exceptional revenue growth but cannot underwrite the unit economics or
              capital efficiency thesis.
