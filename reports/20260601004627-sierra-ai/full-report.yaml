            title: Gross margin and burn rate are unverifiable from public data
            body: >-
              The two most critical inputs for underwriting—gross margin and monthly burn—are entirely private. Without
              them it is not possible to determine whether Sierra is operating with SaaS-grade economics or a
              services-heavy cost structure that would demand a much lower entry valuation. The 8-month interval between
              the Series D and Series E suggests capital is being deployed rapidly, but the burn multiple cannot be
              calculated.
