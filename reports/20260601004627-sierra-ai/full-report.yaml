  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Sierra AI delivers its customer-experience AI platform as "Agent OS," a self-described operating system
              for enterprise AI agents that spans the full customer interaction lifecycle across voice, chat, email,
              SMS, and—as of early 2026—ChatGPT's consumer distribution layer. The commercial offering is organized into
              several distinct modules. Agent Studio 2.0 is the low-code/no-code builder that lets operations teams
              define agent journeys, connect enterprise systems, and manage workspaces with GitHub-style version control
              without requiring dedicated engineering headcount. Insights 2.0 adds an Explorer feature—described as deep
              research for customer conversations—that continuously analyzes interaction logs to diagnose performance
              gaps and surface candidate improvements. The Agent Data Platform (ADP) provides persistent memory and
              intelligent decisioning, unifying structured data (CRM, billing, transactions) with unstructured
              conversational data so the agent can greet customers by name, remember prior issues, and proactively
              recommend next steps. Live Assist bridges AI and human agents, equipping support staff with real-time
              in-conversation guidance, automatic note capture, and instant answer surfacing. The Payments module,
              launched in October 2025, was the first Level 1 PCI-compliant conversational payment capability in the
              market, enabling card and ACH transactions through voice and chat without sensitive card data ever
              touching Sierra's core platform or LLMs. In May 2026, Sierra unveiled Ghostwriter—an agent-building agent
              powered by Codex and Claude Code—that ingests SOPs, call transcripts, whiteboard photos, and plain-English
              instructions to produce production-ready agents autonomously, collapsing the build cycle from weeks to
              hours. All modules deploy through a single unified API that Sierra calls the Headless API, allowing the
              agent to be embedded in customer-built interfaces without Sierra's front-end stack. [CE001] [CE002]
              [CE003] [CE004] [CE005]
