      - number: '7.2'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >
              Sierra's platform processes mission-critical enterprise workflows—mortgage originations, patient
              interactions, insurance claims, and high-value subscriptions—at production scale across 30+ Fortune 500
              deployments. This production exposure creates material operational and security risk across several attack
              surfaces. LLM hallucination remains a fundamental risk: large language models can generate plausible but
              incorrect output, and in financial or healthcare contexts this can cause regulatory violations, incorrect
              disbursements, or patient harm. OWASP's LLM Top 10 framework identifies prompt injection as the
              highest-severity vulnerability in agent systems; an adversary who can manipulate an AI agent's system
              prompt could cause it to take unauthorized financial or data-access actions. Sierra's trust and
              reliability page confirms it employs safety evaluations, filtering, and layered guardrails, but the
              company does not publish specific model error rates, hallucination benchmarks, or red-team results. Voice
              AI deployments introduce additional risk: Sierra's blog on voice AI explicitly acknowledges that audio
              quality degrades AI performance in noisy environments—a material gap for ADT (home security, often noisy)
              and SiriusXM (vehicle) deployments. Data isolation between enterprise tenants is another concern for a
              multi-tenant SaaS platform; Sierra's privacy policy governs data use but does not specify architectural
              tenant isolation measures. A service outage affecting ADT (2 million care requests per month) or Rocket
              Mortgage (400,000+ monthly conversations) would have direct operational and reputational consequences for
              the customer and for Sierra's outcome-based revenue model, which only pays on successful resolutions. The
              NIST Cybersecurity Framework provides a recognized standard for resilience planning, but Sierra has not
              published an external audit or penetration-test summary validating its posture.
            claimRefs:
