  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Sierra's regulatory exposure is unusually broad for a two-year-old company because its AI agents operate
              inside regulated workflows across at least three high-compliance verticals: financial services (mortgage
              origination, consumer lending, payments, corporate expense management), healthcare (chronic disease
              management, patient authentication, device troubleshooting), and telecommunications (subscription
              contracts, billing disputes). The EU AI Act, which entered force in August 2024 with high-risk system
              requirements effective from August 2026, is immediately relevant: Sierra acquired Fragment in France in
              early 2026, making its EU operations live. AI agents that materially assist in credit decisions, insurance
              claims processing, or patient triage could be classified as high-risk systems under Annex III of the EU AI
              Act, requiring conformity assessments, human oversight mechanisms, and technical documentation. In the
              United States, the CFPB has issued supervisory guidance on AI in consumer credit (2024), and HIPAA's
              Security and Privacy Rules impose business-associate obligations on any vendor processing protected health
              information—which Sierra does for Sutter Health, Cigna, and other named healthcare deployments. Sierra's
              terms-and-conditions limit liability for consequential damages, which is standard for enterprise SaaS but
              may create tension in jurisdictions with mandatory liability for AI-caused harm. State-level AI
              transparency laws in California and Colorado require disclosure when AI systems interact with consumers,
              adding compliance overhead for Sierra's US enterprise deployments. Sierra's payments blog post (2026)
              confirms the platform now routes financial transactions, triggering PCI DSS scope. While Sierra has not
              disclosed pending litigation, enforcement actions, or IP disputes, the absence of disclosure does not
              constitute confirmation of clean status; investor diligence via management representation letters and
              external counsel review is required.
