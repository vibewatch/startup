            title: Capital-rich but next-round timing may arrive sooner than expected
            body: >-
              Sierra's $1 billion-plus cash position provides real balance sheet flexibility, but the three-round pace
              across 28 months implies accelerating capital intensity. Even with a $1 billion runway, if monthly burn
              tracks global headcount growth and LLM infrastructure at scale, a follow-on process within 18–24 months is
              plausible. Bret Taylor's own prediction of an AI market correction within two years adds timing pressure:
              a favorable window to raise before a correction may close earlier than the runway math would suggest.
