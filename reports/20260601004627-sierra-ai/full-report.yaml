      - number: '7.6'
        title: Mitigation Framework and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Sierra's primary risk mitigations are structural rather than contractual: its multi-model architecture
              reduces single-provider LLM dependency, its outcome-based pricing aligns it directly to customer value
              delivery, and its named customer proof corpus creates social proof and reference capital. However,
              mitigations must be assessed against the severity and speed of potential triggers. The thesis-break
              scenarios for a Sierra investment are: (1) EU AI Act enforcement action against one of Sierra's EU
              deployments, triggering remediation costs and customer hesitation; (2) a material data breach or AI error
              at a healthcare or financial services customer, triggering regulatory investigation and reputational
              contagion across the 30+ named enterprise accounts; (3) OpenAI or Anthropic imposing use-case restrictions
              on financial services AI agents, removing Sierra's access to the leading foundation models; (4) the
              departure of either co-founder within 12 months of investment, without a disclosed succession plan; or (5)
              failure to reach $300 million ARR by end of 2026, implying annualized ARR growth deceleration below 70%.
              Each of these scenarios has a monitorable leading indicator and a defined diligence path. Investors should
              establish contractual information rights covering quarterly ARR, churn metrics, LLM provider agreements,
              data breach notification, and leadership changes before closing. The kill criteria are not probabilistic
              in isolation—most are low-probability high-impact scenarios—but their aggregation across regulatory,
              operational, financial, people, and partner dimensions constitutes a residual risk profile that is high
              even for a late-stage enterprise software investment.
