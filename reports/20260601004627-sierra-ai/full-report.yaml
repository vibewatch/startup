        title: Revenue trajectory and public traction signals
        blocks:
          - type: paragraph
            body: >-
              Sierra reached $100 million in annual recurring revenue in November 2025, seven quarters after its
              commercial launch in February 2024—a pace that CEO Bret Taylor has described as unprecedented in the
              history of SaaS. For context, Snowflake, one of the benchmarks for fast-scaling enterprise software, took
              17 quarters to hit the same milestone. Sierra's first $50 million quarter followed immediately in Q4 2025,
              carrying the company above $150 million ARR by February 2026. Sacra independently estimated approximately
              $200 million ARR by May 2026, implying continued quarter-on-quarter acceleration with the Series E raise
              as a tailwind for sales and headcount capacity. At that pace, Sierra would be on a roughly $100
              million-per-quarter run rate entering year three.

              Customer quality, not just count, underpins the revenue signal. Sierra reports that more than 40 percent
              of the Fortune 50 now use its platform, with roughly half of its enterprise customers generating annual
              revenues above $1 billion and approximately 20 percent above $10 billion. Voice agents surpassed
              text-based chat as Sierra's primary interaction channel by volume as of October 2025—less than a year
              after the voice product launched—reflecting large-scale call-center workload transfer. Specific customer
              deployments confirm the conversion lift: Rocket Mortgage reports clients using Sierra's Digital Assistant
              close at rates three to four times higher than non-AI pathways, with over 400,000 chat conversations and
              more than one million outbound dials processed monthly through Sierra. Bret Taylor estimates the total
              addressable customer service market at $400 billion annually; Sierra's estimated $200 million ARR
              represents less than 0.1 percent penetration of that market if the framing holds.
