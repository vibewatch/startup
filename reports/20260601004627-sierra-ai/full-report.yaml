  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: peers, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Sierra’s market is crowded enough that sloppy competitor framing creates false comfort. The direct startup
              peer set includes companies explicitly selling AI customer-service agents or closely adjacent platforms:
              Decagon, Forethought, Intercom Fin, Gorgias, Kustomer, Kore.ai, and Replicant. The incumbent set is even
              more formidable because it bundles AI into enterprise systems customers already use: Salesforce,
              Microsoft, ServiceNow, Zendesk, Genesys, LivePerson, and Freshworks. On top of that, there are substitutes
              that do not look like traditional vendors at all, such as internal build paths using CrewAI, Botpress, or
              workflow-automation stacks like UiPath. The result is a market where Sierra is not choosing between a few
              obvious head-to-head rivals. It is competing simultaneously against focused startups, bundle-rich
              incumbents, and build-vs-buy alternatives. That makes category mapping itself a diligence task rather than
              a formality. It also means any moat claim has to specify which lane Sierra is winning in and against whom.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
