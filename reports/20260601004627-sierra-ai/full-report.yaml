      - number: '1.3'
        title: Capital base, customer-quality proof, and public scale signals
        blocks:
          - type: paragraph
            body: >-
              By public standards Sierra has scaled at remarkable speed. Company and media sources line up around a
              trajectory from a February 2024 launch to $100M ARR seven quarters later and over $150M ARR by February
              2026, followed by a May 2026 financing that valued the company above $15B. The disclosed rounds support at
              least about $1.585B of lifetime capital raised before considering SoftBank’s undisclosed strategic
              investment. Just as important, Sierra’s own disclosures on customer quality are unusually strong for a
              private company: over 40% of the Fortune 50, billions of customer interactions, and a customer mix where
              half the accounts exceed $1B in revenue and one quarter exceed $10B. Those claims are directionally
              compelling because they imply Sierra is winning complex enterprises rather than small experimental buyers,
              even if current audited headcount and precise cap-table detail remain unavailable. In investor terms,
              Sierra already looks more like a scaled category wager than an early pilot-stage vendor.
