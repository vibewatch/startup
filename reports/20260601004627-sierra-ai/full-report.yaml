  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Sierra Agent OS organized as a layered architecture from channel delivery at the top through agent runtime,
      context management, intelligence, integration, and compliance infrastructure at the bottom.
    approximationNotes: >-
      Layer names, sublayer groupings, and roles are inferred from Sierra's official product documentation and blog
      posts. Internal implementation details (specific cloud provider, exact model vendor list, infrastructure topology)
      are not publicly disclosed.
    data:
      layers:
        - id: layer-channels
          label: Channel Layer
          detail: >-
            Voice (PSTN, SIP, contact-center), Chat (web widget, WhatsApp, SMS), Email, ChatGPT plugin, Headless API for
            custom interfaces
          sublayers:
            - id: ch-voice
              label: Voice
              detail: Multi-provider transcription ensembler; 70+ languages; conversational recovery
            - id: ch-chat
              label: Chat / SMS / Email
              detail: Web widget, WhatsApp Business API, SMS, email; universal web attachments
            - id: ch-chatgpt
              label: ChatGPT Publish
              detail: One-click agent publication to ChatGPT consumer surface with controlled journey scope
        - id: layer-agent-runtime
          label: Agent OS Runtime
          detail: >-
            Agent Studio 2.0 (journey builder, Workspaces, Integrations), Ghostwriter (agent-building agent), Insights
            2.0 (Explorer, Expert Answers), Live Assist (real-time human guidance)
          sublayers:
            - id: ar-studio
              label: Agent Studio 2.0
              detail: Low-code / no-code journey authoring; GitHub-style collaboration; Integrations hub
            - id: ar-ghostwriter
              label: Ghostwriter
              detail: Autonomous agent-building agent; ingests SOPs, transcripts, plain-English instructions
            - id: ar-insights
              label: Insights 2.0 / Explorer
              detail: Deep-research analysis of conversation logs; Expert Answers auto-article generation
            - id: ar-live-assist
              label: Live Assist
              detail: Real-time AI guidance for human agents; automatic note capture; escalation orchestration
        - id: layer-context-engine
          label: Context Engineering Engine
          detail: >-
            Progressive disclosure of composable blocks (journeys, tools, rules, policies, workflows, knowledge, memory,
            glossary) controlled by conditional logic; ensures LLM receives only minimum relevant context at each turn
        - id: layer-intelligence
          label: Intelligence Layer
          detail: >-
            LLM Constellation (15+ frontier, open-weight, and proprietary models), Supervisor Models (hallucination
            suppression, prompt-injection blocking, policy enforcement), Agent Data Platform memory and intelligent
            decisioning
          sublayers:
            - id: intel-llm
              label: LLM Constellation
              detail: >-
                Frontier models (OpenAI, Anthropic), open-weight models, proprietary specialist models; automatic
                failover
            - id: intel-supervisor
              label: Supervisor Models
              detail: Wraps every LLM call; detects hallucinations, blocks adversarial prompts, enforces policy
            - id: intel-adp
              label: Agent Data Platform (ADP)
              detail: Persistent cross-session memory; unifies conversation data with CRM/billing/transaction data
        - id: layer-integration
          label: Integration & Payments Layer
          detail: >-
            Agent SDK and 30+ pre-built connectors to CRM, billing, inventory, and contact-center systems; PCI DSS Level
            1 payment infrastructure (card and ACH, architecturally isolated from core platform)
        - id: layer-compliance
          label: Trust, Security & Compliance Infrastructure
          detail: >-
            SOC 2 Type II, PCI DSS Level 1, HIPAA, GDPR, ISO 27001, ISO 42001, CSA STAR, CCPA; Sierra Trust Center; data
            isolation (no cross-customer training); PII encryption and masking
