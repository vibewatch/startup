      - number: '6.4'
        title: Retention and Durability
        blocks:
          - type: paragraph
            body: >
              Sierra does not disclose net revenue retention (NRR), gross revenue retention (GRR), churn rate, or
              cohort-level renewal data. The proxies available are behavioral and structural. Outcome-based
              pricing—where customers pay per resolved interaction, completed transaction, or saved cancellation—aligns
              Sierra's revenue directly to customer-perceived value: a customer that churns stops generating revenue for
              Sierra, creating a strong mutual incentive to deliver ongoing outcomes. SiriusXM was announced as one of
              Sierra's original design partners in February 2024 and is still expanding its deployment as of the May
              2026 Agent Data Platform announcement, implying over two years of continuous engagement. Ramp built its
              first in-house AI in 2023, migrated to Sierra, and by 2025 was expanding across all support channels and
              voice. ADT launched its Sierra agent and publicly stated plans to expand into payment, rescheduling, and
              upsell workflows—consistent with a multi-year relationship trajectory. The platform's Agent OS and Agent
              Data Platform create cross-session data dependencies that raise switching costs once deployed at scale.
              Customer satisfaction evidence is largely qualitative (executive quotes, "highest-rated channel"
              designations) rather than longitudinal cohort data, which remains the principal diligence gap.
