              Sierra targets large enterprises whose customer-interaction volume is high enough to justify outcome-based
              AI agent investment. The addressable buyer profile skews toward companies with annual revenue above $1
              billion; half of Sierra's customers cross that threshold and one in four exceeds $10 billion in revenue,
