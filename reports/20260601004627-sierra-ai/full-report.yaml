      - number: '7.5'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Sierra was founded by Bret Taylor (former Salesforce co-CEO, OpenAI board member, Twitter board chair) and
              Clay Bavor (former Google VP of AR/VR), and both are operating full-time as co-CEOs per a November 2025
              Forbes profile. Their network, credibility, and technical and commercial vision are materially embedded in
              Sierra's brand, fundraising, and enterprise sales motion—Taylor in particular is cited by analysts as the
              primary factor in Fortune 50 access. Sierra has not disclosed a succession plan, a President or COO, or
              any identifiable candidate who could substitute for either founder in the external-facing role. Below the
              co-founders, Sierra faces intense competition for AI engineers and applied ML researchers from OpenAI,
              Anthropic, Google DeepMind, and Salesforce, all of which pay competitive or above-market compensation. The
              simultaneous integration of two international acquisitions—Fragment in France and Opera Tech in Japan—adds
              significant management bandwidth pressure; each integration requires localizing the platform, aligning
              sales motions, and managing cultural integration across at least three legal entities. Sierra's CNBC
              Disruptor 50 recognition in 2025 and 2026 and its Benchmark and Sequoia backing provide talent-attraction
              leverage, but cannot fully offset the structural compensation advantage of hyperscaler employers. The
              company has not disclosed total headcount, attrition rates, or engineering capacity, making an independent
