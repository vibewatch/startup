  - id: FV001
    title: Sierra AI Recommendation Logic
    type: flow
    description: >-
      Logical chain from Sierra AI's key evidence pillars through risk factors to investment recommendation. Decision
      nodes reflect where evidence is strong vs. where material uncertainty limits conviction.
    data:
      nodes:
        - id: N1
          label: |-
            ARR Ramp
            ($0→$100M <24 months;
            fastest enterprise SaaS)
        - id: N2
          label: |-
            Customer Quality
            (40%+ Fortune 50;
            outcome-based alignment)
        - id: N3
          label: |-
            Founder Network
            (Bret Taylor: ex-Salesforce CEO,
            ex-OpenAI board)
        - id: N4
          label: |-
            Multiple Risk
            (79–100× ARR;
            3–5× premium to comps)
