      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The bull scenario (35% probability) assumes Sierra reaches $400–500 million ARR by year-end 2027,
              propelled by continued Fortune 50 penetration, the SoftBank Japan distribution partnership scaling
              materially, voice agent volume doubling from existing accounts, and Agent OS 2.0 and the Agent Data
              Platform driving significant NRR expansion above 120%. Under these assumptions, an IPO or growth-equity
              secondary at 35–50× forward ARR on a $450 million ARR run-rate implies a $15.75–22.5 billion
              valuation—essentially flat to the Series E entry at the low end and 1.4× at the high end. The base
              scenario (40% probability) assumes ARR growth decelerates to 60–80% CAGR through 2027 due to competitive
              pricing pressure, a longer-than-expected Japan ramp, and integration friction from the Fragment and Opera
              Tech acquisitions, reaching $280–350 million ARR. At a 20–30× forward multiple consistent with the upper
              range of public comps for high-growth SaaS, the implied valuation is $5.6–10.5 billion, representing a
              33–65% impairment from the $15.8 billion Series E entry. The bear scenario (25% probability) posits ARR
              growth decelerating below 50% CAGR, triggered by a major enterprise account loss, a regulatory enforcement
              action in the EU, or OpenAI imposing use-case restrictions on financial services agents, bringing ARR to
              $150–200 million. At distressed enterprise AI multiples of 8–12× (consistent with C3.AI's repricing
              trajectory), the implied valuation is $1.2–2.4 billion—a 85–92% impairment. The probability-weighted
              expected exit value across three scenarios is approximately $9.5–11 billion, below the $15.8 billion
              Series E entry, making this a negative-expected-value investment at standard base/bear assumptions. Only
              if the bull scenario probability exceeds 50–55% does the investment cross into positive territory.
            claimRefs:
