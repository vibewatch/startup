      - number: '8.2'
        title: Valuation Context, Financing History, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Sierra completed its $950 million Series E in May 2026, led by Tiger Global and GV (Alphabet's venture
              arm), at a post-money valuation of $15.8 billion. This follows a precisely paced funding cadence: a $175
              million Series C in October 2024 at approximately $4.5 billion valuation, and a $350 million Series D in
              September 2025 at approximately $10 billion valuation. Total capital raised across all rounds exceeds
              $1.475 billion. The three-round funding sequence compressed into 18 months signals accelerating capital
              deployment into global expansion, acquisitions (Fragment in France, Opera Tech in Japan), and AI
              infrastructure. The $950 million raise likely provides $1 billion in operating cash at the time of close,
              assuming minimal pre-close operating cash utilization. The implied burn multiple—capital raised divided by
              incremental ARR generated—is unknown from public data but constitutes a critical underwriting variable. At
              100% ARR growth and a burn multiple of 1.5–2×, Sierra would be consuming $75–100 million in net cash per
              quarter against a roughly $200 million ARR base, consistent with an aggressive but not unusual
              growth-stage burn profile. The Series E pricing of 79–100× ARR implies that the investor base has
              underwritten a path to $500 million or more in ARR within 18–24 months at sustained 100%+ growth—a target
              Bret Taylor himself has articulated publicly. Public evidence does not confirm any liquidation preference
              overhang, ratchet provisions, or anti-dilution mechanisms, though at $1.475 billion raised against an
              unknown common equity base, the preference stack may be material in exit scenarios below $3 billion. Entry
              discipline at the $15.8 billion level requires conviction that the bull scenario is the modal (most
              likely) outcome, not merely the upside case.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
