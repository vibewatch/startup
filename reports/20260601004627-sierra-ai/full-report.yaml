      - number: '5.3'
        title: Customer workflow and deployment model
        blocks:
          - type: paragraph
            body: >-
              Sierra deploys through a high-touch, dedicated-AI-engineer model rather than a self-serve or turnkey
              installation. Each enterprise customer is assigned a Sierra AI engineer who guides implementation from
              initial SOP ingestion through production launch and continuous optimization. Integration is API-driven:
              the Agent SDK and Integrations feature inside Agent Studio 2.0 allow connections to CRM systems
              (Salesforce, Kustomer), billing platforms, inventory systems, contact-center infrastructure, and
              proprietary enterprise data warehouses in days, not months. The Workspaces feature enables safe
              collaborative iteration across CX, operations, and engineering teams, with GitHub-style branching so that
              a contact-center ops lead can propose journey changes without shipping untested code to production.
              [CE014] [CE015]

              Once in production, Sierra's operating model is self-reinforcing. Insights 2.0 continuously surfaces
              performance gaps by analyzing interaction logs. Expert Answers auto-generates new knowledge-base articles
              from the best human-agent resolutions, feeding those back into the agent's knowledge context. With the May
              2026 Ghostwriter release, the optimization cycle became partially autonomous: Ghostwriter analyzes
              interactions, proposes improvements, validates them in a sandboxed environment, and queues them for human
              review—what Sierra calls an "agent assembly line." [CE016] [CE017]

              Deployment channels as of June 2026 span chat (website widgets and WhatsApp), voice (PSTN telephony and
              SIP-based contact centers), email, SMS, and ChatGPT plugin integration. The ChatGPT publish feature,
              launched at Sierra Summit 2025, allows a customer to extend their existing Sierra agent into ChatGPT's
              800-million-weekly-user consumer audience with one click, with full control over which journeys, data, and
              capabilities are exposed. Customer deployments confirm the operational scale: Rocket Mortgage processes
              more than one million monthly outbound AI dials and over 400,000 chat conversations using Sierra, with
              AI-assisted clients closing mortgages at three to four times the rate of non-AI pathways. ADT handles
              millions of customer care interactions per month using Sierra, with the agent managing billing,
              troubleshooting, and account inquiries. Sonos uses Sierra to drive its "time-to-music" metric across
              device setup, order management, and network troubleshooting, reducing customer effort and escalations.
              [CE018] [CE019] [CE020]
