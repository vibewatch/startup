companyProfile:
  summary: >-
    Sierra AI is a 2023-founded enterprise software company led by Bret Taylor and Clay Bavor. The company sells
    multichannel AI agents and related tooling to large enterprises that want to automate and improve customer
    interactions across support, retention, payments, lending, healthcare, and other high-volume workflows. By mid-2026
    Sierra had raised a $950 million Series E at a $15.8 billion post-money valuation after reaching a company-confirmed
    ARR floor above $150 million and claiming service to more than 40% of the Fortune 50.
