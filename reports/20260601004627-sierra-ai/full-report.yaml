      - number: '1.2'
        title: Founders, leadership concentration, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder profile is unusually strong. Bret Taylor brings a resume spanning Google Maps, Facebook, Quip,
              Salesforce, and the OpenAI board, while Clay Bavor brings long product leadership experience from Google,
              including Workspace, AR/VR, and Google Labs. That combination gives Sierra immediate credibility with
              enterprise buyers, venture investors, and model-platform partners. The flip side is that the public face
              of the company remains heavily concentrated in those two founders. Sierra’s official pages emphasize Bret
              and Clay much more than a broad executive bench, and the reviewed public materials do not provide a deep
              board or governance map. For underwriting, that means founder-market fit is a major strength, but
              key-person dependence is also real. Investors are effectively backing not just a product thesis, but a
              founder-led execution model that still looks narrow from the outside.
