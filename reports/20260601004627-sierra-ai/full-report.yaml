      - number: '3.2'
        title: Capability breadth and packaging differences
        blocks:
          - type: paragraph
            body: >-
              The most important competitive differences are not just model quality. Some vendors are specialized around
              ecommerce, some around helpdesk suites, some around CRM, some around voice, and some around broader
              workflow automation. Sierra’s own positioning emphasizes a single multichannel agent for complex
              enterprise workflows, especially in regulated environments. That framing differs from Gorgias’ ecommerce
              specialization, Kustomer’s CRM-led service stack, Genesys’ contact-center heritage, and Microsoft or
              Salesforce’s installed-base expansion strategy. Pricing and packaging are also uneven. Sierra publicly
              leans on negotiated, outcome-based enterprise contracts, while many rivals lead with more productized or
              bundle-led motions. That means Sierra can win where complexity and deployment depth matter most, but it
              also means many competitors can look simpler or cheaper at the first point of evaluation. Buyers are
              therefore often choosing a go-to-market model as much as a product. In practice, simplicity itself can
              function as a competitive feature for many teams.
