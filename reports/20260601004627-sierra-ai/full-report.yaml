  - id: FR001
    title: Sierra Risk Heatmap
    type: matrix
    layout: wide
    summary: >-
      Risk heatmap across Sierra's five principal risk domains. Likelihood and impact are rated High / Medium / Low
      based on publicly available evidence; mitigation maturity reflects publicly disclosed controls; residual severity
      reflects the post-mitigation investor exposure.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation Maturity
        - Residual Severity
      rows:
        - label: Regulatory / Legal
          values:
            - High
            - High
            - Low
            - High
        - label: Operational / Security
          values:
            - Medium
            - High
            - Low–Medium
            - High
        - label: Partner / Dependency
          values:
            - Medium
            - High
            - Low–Medium
            - Medium–High
        - label: Financial / Valuation
          values:
            - Medium
            - High
            - Low
            - High
        - label: People / Execution
          values:
            - Low–Medium
            - High
            - Medium
            - Medium
    approximationNotes: >-
      Ratings are analyst estimates based on publicly available Sierra disclosures, regulatory framework texts, and
      comparable enterprise AI risk factors. No internal management risk register has been disclosed.
    claimRefs:
      - CR001
      - CR011
      - CR021
      - CR029
      - CR036
  - id: FR002
    title: Sierra Risk Transmission Map
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how primary risk events at Sierra cascade through operational, financial, and
      reputational channels to affect revenue, customer base, and enterprise valuation.
    data:
      nodes:
        - id: n1
          label: EU AI Act / Regulatory Enforcement
          type: risk-source
        - id: n2
          label: LLM Hallucination / AI Error Event
          type: risk-source
        - id: n3
          label: Data Breach / Security Incident
          type: risk-source
        - id: n4
          label: LLM Provider Terms / Price Shock
          type: risk-source
        - id: n5
          label: Co-founder Departure
          type: risk-source
        - id: n6
          label: Compliance Cost and Remediation
          type: intermediate
        - id: n7
          label: Customer Churn / Deployment Pause
          type: intermediate
        - id: n8
          label: Gross Margin Compression
          type: intermediate
        - id: n9
          label: ARR Growth Deceleration
          type: intermediate
        - id: n10
          label: Valuation Compression / Down-Round Risk
          type: outcome
      edges:
        - from: n1
          to: n6
          label: Conformity assessment and legal costs
        - from: n1
          to: n7
          label: Customers pause deployments citing Act requirements
        - from: n2
          to: n7
          label: Enterprise churn post-incident
        - from: n2
          to: n6
          label: Liability and regulatory investigation cost
        - from: n3
          to: n7
          label: Customer churn and contract termination
        - from: n3
          to: n6
          label: Breach notification, OCR fines, remediation
        - from: n4
          to: n8
          label: LLM cost increase compresses model margin
        - from: n5
          to: n9
          label: Sales motion and Fortune 50 access weakened
        - from: n6
          to: n9
          label: Unplanned cost consumes ARR capacity
        - from: n7
          to: n9
          label: Churn reduces net ARR growth rate
        - from: n8
          to: n10
          label: Margin compression reduces valuation multiple
        - from: n9
          to: n10
          label: Growth deceleration triggers multiple contraction
    approximationNotes: >-
      Transmission paths are analyst-constructed from public risk evidence; edge weights are qualitative. No internal
      risk model has been disclosed by Sierra.
    claimRefs:
