      - number: '4.3'
        title: Unit economics proxies and margin structure
        blocks:
          - type: paragraph
            body: >-
              Sierra's gross margin profile cannot be directly determined from public information: the company has not
              disclosed revenue, cost of revenue, or any operating expense line. Two structural features create
              meaningful uncertainty about how Sierra's economics compare to pure-software SaaS benchmarks. First, the
              company operates a high-touch delivery model that pairs dedicated AI engineers with each enterprise
              customer rather than providing self-serve deployment. This professional services layer—visible in the
              weeks-long implementation timelines and the reliance on customer-specific configuration—likely weighs on
              gross margin relative to a productized SaaS peer. Second, Sierra's platform simultaneously runs fifteen or
              more large language models, routing each customer interaction to the best-fit model for that task. LLM
              inference costs at the scale Sierra operates—potentially billions of interactions annually—are a
              meaningful and ongoing operating expense that will improve as models commoditize but remains a material
              headwind today.

              On the other side of the ledger, several proxies suggest strong customer economics that could support a
              premium pricing floor. A 70 percent or higher agent containment rate has been cited in analyst research,
              implying substantial cost savings for customers that justify six-figure annual contracts. SiriusXM
              describes its Sierra-powered Harmony agent as its highest-rated, lowest-effort customer service channel,
              an outcome profile consistent with high retention. The Agent Studio 2.0 and Agent OS 2.0 no-code tooling
              launched in late 2025 is expressly designed to reduce professional services dependency and improve gross
              margins over time, but the extent of margin improvement since launch has not been disclosed. Average
              contract value, CAC, payback period, NRR, and GRR are all private metrics unavailable without a data room.
