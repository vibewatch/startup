      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Outcome-based pricing creates durable alignment
            body: >-
              Sierra's outcome-based model directly ties its revenue to customer value delivered, eliminating the
              shelfware problem inherent in seat licensing. This alignment reduces churn risk when agents perform well,
              incentivizes Sierra to continuously improve resolution rates, and positions the company to capture
              increasing revenue as customers route more interaction volume to the platform. No legacy competitor using
              seat-based pricing can replicate this without cannibalizing their own install base.
            calloutType: strength
            claimRefs:
