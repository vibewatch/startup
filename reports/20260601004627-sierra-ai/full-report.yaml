      - number: '5.6'
        title: Roadmap milestones and product risks
        blocks:
          - type: paragraph
            body: >-
              Sierra's product cadence from late 2025 through mid-2026 was aggressive. Sierra Summit in October 2025
              delivered eight simultaneous product launches: Agent Studio 2.0, Insights 2.0, Agent Data Platform, Live
              Assist, Payments, ChatGPT publish, and expanded voice and contact-center integrations. In May 2026, the
              "Agents as a Service" relaunch introduced Ghostwriter (the agent-building agent), Explorer (autonomous
              conversation analysis), and a restructured headless infrastructure framing that positions Sierra as a
              platform for AI-to-AI workflows—agents building and improving agents without human clicks. Near-term
              roadmap items visible from public disclosures include deeper EU AI Act compliance operational controls
              ahead of the August 2026 high-risk-AI provisions, broader enterprise SDK capabilities to support
              third-party AI agent orchestration, and continued ADP rollout to more customers following the SiriusXM and
              broader media/retail launch. [CE034] [CE035]

              Key product and technology risks are material. First, LLM provider concentration: Sierra uses 15-plus
              models but the most capable reasoning relies on a small number of frontier providers (OpenAI, Anthropic).
              Any pricing increase, API term change, or capacity constraint from these providers would directly affect
              Sierra's cost structure and product quality. The multi-model architecture mitigates downtime risk but does
              not eliminate pricing dependence. Second, model commoditization: as LLM capabilities improve across the
              board, the value Sierra adds through its constellation approach may compress. If a single model handles
              voice, reasoning, and specialized subtasks cost-effectively, Sierra's orchestration layer becomes less
              differentiated. Third, white-glove scalability: the dedicated-AI-engineer deployment model is the primary
              quality driver but is also the primary capacity constraint. Scaling to 500 or 1,000 enterprise accounts at
              the same quality level requires a proportional buildout of specialized AI engineers, which is expensive
              and difficult to hire. Finally, the proprietary transcription benchmark is not independently audited; the
              claimed 25–37% error-rate reduction versus best-in-class providers is Sierra's own internal metric, and
              third-party validation is a diligence gap. [CE036] [CE037] [CE038]
