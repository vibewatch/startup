      - number: '2.2'
        title: 'Sizing lenses: large market, messy definitions'
        blocks:
          - type: paragraph
            body: >-
              Public market data supports the conclusion that Sierra operates in a very large and expanding category,
              but it does not support pretending there is one canonical TAM. The published 2025 market numbers range
              from $13.64B to $19.31B depending on whether the publisher is sizing conversational AI broadly, enterprise
              conversational GenAI more narrowly, or agentic AI more narrowly still. The 2026 starting points likewise
              vary, and long-run forecasts diverge even more. This dispersion is not a bug in the evidence; it is a fact
              about a market whose vendors, analysts, and customers are still converging on definitions. For diligence,
              the right answer is to maintain multiple lenses: a broad conversational-AI TAM, a narrower enterprise
              customer-experience SAM, and a still narrower near-term SOM for large regulated enterprises willing to run
              mission-critical agents in production. Sierra benefits from that growth backdrop, but underwriting should
              stay anchored to constrained ranges rather than maximal industry headlines.
