  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    description: >-
      Monitorable triggers that would falsify Sierra AI's investment thesis, with thresholds, transmission mechanisms,
      and action implications for investors.
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Monitorable Signal
      - Action Implication
    rows:
      - - ARR growth deceleration
        - Below 50% CAGR for two consecutive quarters
        - Multiple compression from 79× to 15–25× in next financing round; down-round risk
        - Quarterly ARR reporting in information rights agreement
        - Reduce position; negotiate information rights to quarterly ARR cadence immediately
      - - Co-founder departure
        - Departure of Bret Taylor or Clay Bavor before IPO, without announced successor
        - Pipeline access and enterprise credibility are founder-dependent; competitor account win rate likely declines
        - Press/LinkedIn monitoring; Board minutes via information rights
        - Trigger mandatory redemption clause if negotiated; reassess valuation floor
      - - EU AI Act enforcement
        - Material enforcement action against a Sierra EU deployment (Fragment, France)
        - >-
          Regulatory remediation costs; customer hesitation across 30+ named enterprise accounts; potential restriction
          on high-risk system deployments
        - EU DPA press releases; legal register via information rights
        - Engage external EU AI law counsel; assess whether enforcement is system-wide or deployment-specific
      - - LLM provider API restriction
        - OpenAI or Anthropic imposing use-case restrictions on financial services or healthcare AI agents
        - >-
          Immediate COGS increase or product capability removal for Sierra's highest-value use cases; gross margin
          compression
        - OpenAI/Anthropic API policy changelog; provider announcement monitoring
        - Require full LLM provider contract disclosure in data room before close; seek MFN protection representations
      - - Major account ARR loss
        - Confirmed non-renewal of any single account >10% of total ARR without replacement pipeline
        - Concentration risk crystallizes; ARR growth decelerates; public narratives around product fit questions
        - Customer reference checks at annual renewal intervals; information rights for churn notification
        - Reassess bear scenario as modal outcome; engage management for replacement pipeline status
    notes: >-
      Trigger thresholds are analyst-defined monitoring criteria, not contractual provisions. Investors should negotiate
      information rights at closing to cover each monitorable signal. Some triggers (LLM provider restriction, EU
      enforcement) may materialize with limited advance notice and warrant pre-investment legal and technical diligence.
