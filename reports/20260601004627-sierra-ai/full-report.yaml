  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Sierra AI's commercial model is purpose-built to break from seat-based enterprise software licensing. The
              company charges primarily on an outcome-based basis, meaning customers pay only when a Sierra AI agent
              resolves a customer interaction or achieves a pre-defined business outcome—a resolved support
              conversation, a saved cancellation, a completed upsell or cross-sell, or an end-to-end payment
              transaction. If an interaction escalates to a human agent, in most cases no charge is incurred, removing
              the perverse incentive to block escalations that plagues outcome-tied pricing in legacy CX vendors. For
              simpler routing or greeter-style interactions that do not lend themselves to outcome measurement, Sierra
              offers a blended consumption-based option: payment per conversation regardless of resolution. This blended
              model lets customers mix and match pricing tiers depending on the interaction type and complexity.

              Sierra does not publish a public pricing page and does not disclose realized pricing per interaction.
              Third-party analysis from a competitor estimates enterprise contracts start at approximately $150,000 per
              year, with one-time implementation fees starting at roughly $50,000. These figures likely represent the
              low end of the range, as the company targets Fortune 50 accounts and deploys dedicated AI engineers with
              each customer rather than offering a self-serve or turnkey product. The Agent Data Platform (ADP) memory
              and personalization layer and the Live Assist human-escalation product are both commercially available as
              of 2025–2026, but their pricing structures—whether separately charged or bundled into outcome fees—have
              not been publicly disclosed. Sierra's entry into Level 1 PCI-compliant payment processing via its
              first-of-its-kind conversational payment capability adds an additional revenue surface for
              transaction-completion use cases.
            claimRefs:
