      escalation, showing how context engineering and LLM orchestration operate in the critical path.
    approximationNotes: >-
      Flow represents the documented operating model from Sierra's technical blog posts and official product
      documentation. Specific latencies, model call depths, and provider identities are not disclosed.
    data:
      nodes:
        - id: f1
