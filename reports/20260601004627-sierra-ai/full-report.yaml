          tone: neutral
        - id: f2
          label: Channel layer normalizes input
          description: Voice input processed by multi-provider transcription ensembler; text input parsed; context window opened
          tone: neutral
        - id: f3
          label: Context Engineering Engine activates
          description: >-
            Agent OS loads minimum relevant context blocks based on customer identity, channel, and initial intent;
            progressive disclosure begins
          tone: positive
        - id: f4
          label: LLM constellation reasons
          description: >-
            Best-fit model selected for this turn; supervisor model wraps the call; hallucination and policy checks
            applied before any response is generated
          tone: positive
        - id: f5
          label: Tool or system call executed
          description: >-
            Agent invokes CRM lookup, billing system query, inventory check, or payment API as needed; result injected
            into next context turn
