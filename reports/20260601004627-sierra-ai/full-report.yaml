      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Sierra's capital position following the May 2026 Series E is its strongest ever. The $950 million raise,
              led by GV (Google Ventures) and Tiger Global with participation from Benchmark, Sequoia, and Greenoaks,
              brought total lifetime disclosed capital to approximately $1.585 billion and pushed reported cash on hand
              above $1 billion. That balance sheet depth is unusual for a private growth company and provides a
              substantial buffer against near-term financing dependency. The company's stated use of funds covers Agent
              OS platform development, deployment tooling for non-technical teams, AI-driven agent improvement, and
              expansion into sales and engagement workflows—a broad mandate that will consume capital across product,
              engineering, sales, and operations simultaneously.

              The funding cadence itself warrants scrutiny. Sierra's prior $350 million round closed in September 2025;
              the Series E followed roughly eight months later. The interval is short even by hypergrowth standards and
              implies either very rapid cash deployment or a strategic choice to raise early while valuation momentum
              was strong. The three-round sequence over 28 months—$175 million at $4.5 billion (October 2024), $350
              million at $10 billion (September 2025), $950 million at $15.8 billion (May 2026)— shows accelerating
              capital intensity as Sierra scales its global footprint, adds engineering headcount, expands into new
              offices (Tokyo, Singapore, Madrid, Paris, London, Sydney), and builds out compliance infrastructure.
              SoftBank Vision Fund 2 made an additional undisclosed strategic investment in December 2025 concurrent
              with Sierra's Japan entry. No debt facilities, convertible notes, or credit lines have been publicly
              disclosed; all financing appears equity-funded through the Series E. Monthly burn rate is not publicly
              disclosed, so an exact runway calculation is not possible; it is prudent to assume aggressive spend at
              Sierra's current operating scale.
