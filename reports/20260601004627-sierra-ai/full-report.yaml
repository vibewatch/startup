  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Sierra is actually in
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Sierra’s market is not “all AI” and not even “all enterprise software.” Sierra
              is selling into the customer-experience and customer-service agent layer: software that handles or assists
              customer conversations, executes workflow steps, and increasingly spans the full journey from support
              through conversion and retention. That market includes self-service, contact-center automation,
              multichannel customer engagement, and selected revenue-linked service workflows such as loan origination
              or subscriber retention. It does not require bundling in unrelated AI spend such as coding copilots,
              internal knowledge assistants, or generic productivity agents. This boundary matters because it preserves
              a realistic competitive set and avoids inflating TAM with adjacent categories Sierra does not obviously
              own today. It also clarifies the substitutes Sierra displaces first: legacy IVR trees, deterministic
              chatbots, BPO-heavy support operations, and incumbent helpdesk suites adding AI features.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
