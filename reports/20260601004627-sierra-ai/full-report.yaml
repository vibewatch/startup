      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              Public enterprise software comparables paint a sobering context for Sierra's 79–100× implied ARR multiple.
              C3.AI (NASDAQ: AI), the most direct publicly traded pure-play enterprise AI comparable, traded at
              approximately $1.56 billion market capitalization on $300 million in trailing-twelve-month revenue as of
              June 2026—a 5.2× multiple—after failing to achieve the growth rate and margin profile investors had priced
              in at its 2020 IPO. ServiceNow (NOW), the gold standard for enterprise platform SaaS and a direct
              competitor in workflow automation, trades at $128.3 billion market cap on $13.96 billion TTM revenue—a
              9.2× multiple—reflecting its superior growth, FCF margin, and platform stickiness. Salesforce (CRM) trades
              at $156.5 billion on $41.5 billion in revenue—a 3.8× multiple—following significant multiple compression
              from 2021 peaks. NICE Systems (NASDAQ: NICE), the closest public CCaaS competitor with enterprise-scale
              conversational AI and workforce optimization, disclosed full-year 2025 results in its SEC-filed Form 20-F,
              confirming revenues of approximately $2.4 billion with an implied market capitalization of roughly $10
              billion—a 4.2× multiple—and a direct product overlap with Sierra's core customer service agent use case.
              In M&A, Thoma Bravo's 2022 acquisition of Zendesk at $10.2 billion on approximately $1.7 billion ARR set
              the benchmark at 6× ARR for a leading CX software platform without Sierra's growth rate. The comparable
              set uniformly supports multiples of 4–10× trailing revenue for high-quality enterprise software, versus
              Sierra's 79–100× implied multiple. The premium is justified by investors only on the assumption of
              continued hypergrowth (100%+ CAGR) and a category-winner outcome—both of which are unconfirmed by public
              data. Sacra's independent research estimates $200 million ARR for Sierra as of May 2026, corroborating the
              Bloomberg Series E coverage but noting that the estimate is based on company-proximate data, not audited
              financials.
