      - number: '3.3'
        title: Switching costs, distribution power, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Sierra’s competitive durability will depend heavily on how integration-driven this category becomes. Once
              a platform is deeply connected to workflows, data systems, policies, and brand behavior, switching cost
              rises materially. But that lock-in does not appear to come from unique model IP alone. It comes from
              implementation work, workflow tuning, and trust in production. That dynamic cuts both ways. On the one
              hand, incumbents like Salesforce, Microsoft, ServiceNow, and Zendesk have distribution and procurement
              advantages Sierra cannot replicate quickly. On the other, enterprises can still pilot multiple vendors or
              pursue internal builds before they commit deeply. In other words, the market may be sticky after
              deployment but contestable before deployment. That is why distribution power and implementation
              credibility matter at least as much as technical headlines. Pre-deployment bake-offs are where Sierra most
              needs proof. Winning a bake-off is not the same as owning an account long term.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP026
              - CP027
              - CP028
              - CP029
