  - id: FV002
    title: Sierra AI Valuation Sensitivity to ARR and Multiple
    type: bar
    description: >-
      Implied valuation at twelve ARR-multiple combinations spanning three ARR scenarios ($150M, $200M, $300M) and four
      revenue multiples (10×, 20×, 35×, 79×). Shows the sensitivity of Sierra's $15.8B valuation to changes in both ARR
      realization and the applicable market multiple. All values in billions USD.
    data:
      items:
        - label: $150M × 10×
          value: 1.5
        - label: $150M × 20×
          value: 3
        - label: $150M × 35×
          value: 5.25
        - label: $150M × 79× (current)
          value: 11.85
        - label: $200M × 10×
          value: 2
        - label: $200M × 20×
          value: 4
        - label: $200M × 35×
          value: 7
        - label: $200M × 79× (current)
          value: 15.8
        - label: $300M × 10×
          value: 3
        - label: $300M × 20×
          value: 6
        - label: $300M × 35×
          value: 10.5
        - label: $300M × 79× (current)
          value: 23.7
    basis: >-
      ARR figures are from Sierra official blog (year-two-in-review: $150M as of Feb 2026) and Sacra independent
      estimate ($200M as of May 2026). $300M represents the base-case 2027 trajectory. Multiples derived from public
      comparable set and current implied entry multiple.
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV015
  - id: FV003
    title: Sierra AI Valuation and Return Range by Scenario
    type: range
    summary: >-
      Enterprise value range across bull, base, and bear scenarios for Sierra AI compared to the $15.8 billion Series E
      entry. All values in billions USD. Wide bear-to-bull range reflects the high sensitivity of the 79× ARR multiple
      to growth deceleration.
    data:
      items:
        - label: Bear Case (25%)
          low: 1.2
          high: 2.4
          mid: 1.8
        - label: Base Case (40%)
          low: 5.6
          high: 10.5
          mid: 8
        - label: Bull Case (35%)
          low: 14
          high: 22.5
          mid: 18
        - label: Series E Entry ($15.8B)
          low: 15.8
          high: 15.8
          mid: 15.8
    approximationNotes: >-
      Ranges are analyst estimates based on comparable multiple analysis and ARR trajectory extrapolation. Bear and base
      mid-points are below the Series E entry, producing a negative-expected-value outcome at base probability
      assignments (25% bear, 40% base, 35% bull). Probability-weighted expected value: approximately $9.9B. Actual
      outcomes depend on undisclosed unit economics, IPO market conditions, and strategic alternatives.
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV019
  - id: FV004
    title: Sierra AI Investment KPIs — IC Scoring
    type: kpi
    layout: standard
    description: >-
      Investment Committee scoring for Sierra AI across seven key diligence dimensions, each scored 1–5 (5 = excellent
      evidence; 1 = material gap or adverse signal). Scores reflect publicly available evidence as of June 2026 only;
      data-room disclosure could materially revise scores for dimensions marked with financial opacity caveats.
    data:
      items:
        - label: Market Opportunity
          value: 5 / 5
          detail: >-
            $400B customer service TAM; Gartner 40% agentic app penetration by 2026; conversational AI market >$13B by
            2025
          claimRefs:
            - CV024
        - label: Product and Customer Proof
          value: 4 / 5
          detail: >-
            40%+ Fortune 50 customers; ADT 2M care requests/month; Rocket Mortgage 3–4× close rate lift; voice surpassed
            text by Oct 2025
          claimRefs:
            - CV025
        - label: Competitive Moat
          value: 3 / 5
          detail: >-
            Outcome-based pricing alignment; founder network; multi-model architecture; but Salesforce/Microsoft/OpenAI
            have distribution leverage
          claimRefs:
            - CV027
        - label: Unit Economics
          value: 1 / 5
          detail: >-
            No gross margin, NRR, burn multiple, or CAC data available from public sources; financial opacity is the
            single highest-risk gap
          claimRefs:
            - CV034
        - label: Regulatory and Legal Risk
          value: 2 / 5
          detail: >-
            EU AI Act high-risk classification risk (Aug 2026); HIPAA business-associate obligations; CFPB AI guidance;
            PCI DSS scope from payments
          claimRefs:
            - CV041
        - label: Team and Governance
          value: 4 / 5
          detail: >-
            Bret Taylor and Clay Bavor co-CEOs; Benchmark + Sequoia + GV board; but no disclosed succession plan or
            organizational depth chart
          claimRefs:
            - CV033
        - label: Valuation Attractiveness
          value: 1 / 5
          detail: >-
            79–100× ARR at $15.8B is 3–5× above best-in-class public SaaS comps; negative-expected-value at base-case
            scenario probabilities
          claimRefs:
            - CV015
    basis: >-
      KPI scores synthesized from all eight Sierra AI diligence chapters. Scores are analyst estimates based on publicly
      available evidence only. Unit economics and valuation scores would improve materially upon favorable data-room
      disclosure. Overall composite: 20/35 (57%), reflecting medium conviction with significant financial opacity drag.
    claimRefs:
      - CV015
      - CV024
      - CV025
      - CV027
      - CV033
      - CV034
      - CV041
