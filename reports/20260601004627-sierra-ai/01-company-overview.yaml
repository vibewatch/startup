- id: milestones-expansion
  title: Milestones, international expansion, and early adverse context
  body: 'The milestone record already shows more than straight-line software growth. Sierra started with four design partners, reached a public launch in early 2024, scaled to nine listed offices by 2026, opened Toronto in May 2026, added SoftBank-backed Japan expansion in late 2025, and acquired Opera Tech in March 2026. Product milestones also matter because they show the company moving from support automation toward relationship management through Ghostwriter and Agent OS. At the same time, the public narrative is not free of caution flags. Forbes highlights that agent durability and error handling are still active issues, while TechCrunch explicitly called Sierra’s late-2025 ARR multiple hefty. The company overview therefore supports a clear conclusion for later chapters: Sierra has become a category leader quickly, but it is doing so under the pressures of leadership concentration, heavy capital expectations, and incomplete private-company disclosure. The next diligence step is to test
    whether the company can convert this fast public momentum into repeatable economics and durable customer outcomes.'
