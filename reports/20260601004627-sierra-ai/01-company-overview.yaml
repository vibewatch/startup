  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: A full current cap table showing primary ownership, investor ownership, and any secondary activity.
    whyItMatters: Without it, the company overview cannot fully translate financing headlines into control and dilution implications.
    diligencePath: Request latest financing documents, cap table, and any side-letter or secondary-sale summary from management.
    relatedQuestionRefs:
    - QO012
    - QO025
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A company-published current employee count or reliable third-party workforce estimate after the May 2026 financing.
    whyItMatters: Headcount is a basic scale and burn proxy for a private software company at this stage.
    diligencePath: Ask management for current FTE count by function and geography and reconcile it to payroll or HRIS snapshots.
    relatedQuestionRefs:
    - QO015
  - type: missing-source
    severity: minor
    topic: board-governance
    missingEvidence: A detailed public board roster, committee map, and governance-policy summary.
    whyItMatters: Leadership concentration is easier to assess when outside directors and formal governance structures are visible.
    diligencePath: Request board list, observer rights, cadence, and any governance memoranda prepared for the latest financing.
    relatedQuestionRefs:
    - QO007
  - type: missing-source
    severity: material
    topic: softbank-investment-size
    missingEvidence: The exact size and terms of SoftBank Vision Fund 2’s investment.
    whyItMatters: A strategic investment can affect dilution, signaling, and commercial leverage differently from a standard VC primary round.
    diligencePath: Request transaction size, security type, and whether any commercial or geographic rights were attached.
    relatedQuestionRefs:
    - QO011
    - QO012
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 and TO003 leadership and stakeholder completeness
    missingEvidence: A complete executive roster, full board map, and detailed ownership table that would turn the leadership and stakeholder lists into exhaustive records.
    whyItMatters: The chapter can name the most visible leaders and investors, but not every executive, observer, or ownership line from public data alone.
    diligencePath: Request the current org chart, board list, and financing ownership schedule from management before relying on these lists as exhaustive.
    relatedQuestionRefs:
    - QO007
    - QO011
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fuller milestone chronology covering every office opening, investor step, and product release with exact dates.
    whyItMatters: The chapter can ship with the core public chronology, but a refresh should reconcile every expansion and release date into one exact record.
    diligencePath: Request an internal company timeline or press archive and reconcile it to the public chronology before a future refresh.
    relatedQuestionRefs:
    - QO018
