        - id: "pilot"
          label: "Proof of Concept"
          description: "4–10 week pilot targeting highest-volume, lowest-risk use case (e.g. password reset, billing query, troubleshooting); AI agent deployed on single channel (chat or voice)"
        - id: "production-launch"
          label: "Production Launch"
          description: "Agent goes live at scale; Sierra Platform team co-develops journeys; outcome-based pricing activates; initial KPIs: containment rate, resolution rate, NPS delta"
        - id: "expand-channels"
          label: "Channel Expansion"
          description: "Customer adds voice, SMS, or in-app channels; Ramp example: inbound chat → voice; SiriusXM: chat → outbound sales"
