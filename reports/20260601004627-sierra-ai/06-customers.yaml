chapter:
  number: 6
  title: "Customers"
  summary: "Sierra's customer base spans 40%+ of the Fortune 50 with strong named proof across home lending, fintech, telecommunications, healthcare, and consumer electronics; Rocket Mortgage (4× conversion lift), SoFi (+33 NPS points and 61% containment), Ramp (90% resolution rate), and Singtel (73% autonomous resolution) are production deployments with quantified outcomes, while net revenue retention, full churn cohorts, and contract renewal rates remain undisclosed and represent the primary investor diligence gaps."

sections:
  - id: customer-segmentation
    title: "Customer Base Segmentation"
    body: >
      Sierra targets large enterprises whose customer-interaction volume is high enough to justify outcome-based AI agent investment. The addressable buyer profile skews toward companies with annual revenue above $1 billion; half of Sierra's customers cross that threshold and one in four exceeds $10 billion in revenue, based on the company's own year-two disclosures. Industry verticals span financial services (lending, banking, insurance, fintech), healthcare, telecommunications, consumer electronics, home security, and travel/hospitality. Buyer personas are uniformly enterprise CX or operations leaders—Chief Customer Officers, VPs of Member Experience, and heads of contact center operations—whose success metrics include resolution rate, containment, NPS, and cost per interaction. Sierra does not serve SMBs or operate a self-serve tier; minimum contract entry reportedly starts at $150,000 per year with a $50,000 implementation fee. The platform reaches across the United States, with international beachheads in Japan (SoftBank partnership, Opera Tech acquisition), France (Fragment acquisition), and Singapore (Singtel). Use cases have migrated from pure support deflection toward revenue-generating workflows: mortgage origination, subscription management, insurance claims processing, and outbound sales.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU029
      - CU030
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: "Named Customer Proof"
    body: >
      Sierra publishes case studies for more than a dozen enterprise customers with named executives and specific outcome data, a level of transparency uncommon among enterprise AI platforms. Production deployments confirmed with quantified outcomes include Rocket Mortgage (4× conversion lift with AI-plus-banker path; 400,000+ chat conversations per month; 1M+ outbound dials per month), SoFi (61% containment; 50,000+ conversations weekly; +33 NPS points three months post-launch across 13.7 million members), Ramp (90% case resolution rate via automation), and Singtel (73% of mobile troubleshooting cases resolved without a human agent; 70,000+ cases in the first six weeks). Additional confirmed production deployments include ADT (managing 2 million care requests per month), Sonos (first-30-day onboarding agent across 15 million homes), SiriusXM (Harmony agent rated the company's highest-satisfaction, lowest-effort service channel), Sutter Health (SutterSync chronic disease program; 25 hospitals; 3.5 million patients), Nordstrom (voice agent Nora; live in five weeks), and Cigna (patient authentication time cut 80%; live in eight weeks). The Sierra customers index lists additional named clients including Vivid Seats, Redfin, Safelite, Guild, BARK, ecoATM, Airtable, ScottsMiracle-Gro, Paychex, Modern Animal, RunBuggy, Woodside Collection, Imprint, and CLEAR. Other well-known enterprise names mentioned in press releases include Prudential, Blue Cross Blue Shield, DIRECTV, Gap, Hyvee, and Rivian. Deployment timelines average four to ten weeks across publicly reported cases, which is materially faster than traditional enterprise platform implementations.
