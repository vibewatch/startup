callouts:
  - calloutType: "strength"
    title: "Proof Corpus Depth Is Exceptional for Stage"
    body: "Sierra has published quantified outcome data for 10+ enterprise accounts within its first two years, including double-digit NPS improvements (SoFi +33 pts), 90%+ resolution rates (Ramp), and revenue-generating workflow conversions (Rocket Mortgage 4× lift). This level of named, metrics-backed evidence is rare at the growth stage and significantly de-risks the 'does this work?' question for prospective buyers and investors."
    claimRefs:
      - CU008
      - CU009
      - CU015
      - CU016

  - calloutType: "risk"
    title: "NRR / GRR Data Gap Is a Primary Investor Diligence Requirement"
    body: "Sierra does not disclose net revenue retention, gross revenue retention, or cohort churn rates. The ARR-growth trajectory and expansion signals are compelling, but without retention metrics it is impossible to determine whether the growth is driven by new-logo acquisition, account expansion, or both — or whether earlier cohorts are churning. Any investment decision should require audited NRR and GRR data as a condition."
    claimRefs:
      - CU037
      - CU038
      - CU019
      - CU020

  - calloutType: "risk"
    title: "Pricing Opacity Creates Procurement Friction and Concentration Risk"
    body: "Sierra's outcome-based, non-public pricing reportedly starts at $150,000 per year with a $50,000 implementation fee. Competitors have highlighted the unpredictability of outcome-based billing and the absence of a pricing page as a decision barrier. Combined with 40%+ Fortune 50 penetration, Sierra may be generating a significant share of ARR from a narrow account base, making revenue diversification a key growth requirement."
    claimRefs:
      - CU029
      - CU030
      - CU028
      - CU021

