    title: "Sierra Customer Journey Map"
    type: "journey-map"
    layout: "wide"
    summary: "Enterprise buyer journey from awareness through multi-vertical production deployment and land-and-expand, highlighting Sierra's conversion surfaces and platform lock-in points."
    data:
