      severity: "blocking"
      topic: "retention-gap"
      missingEvidence: "Net revenue retention (NRR), gross revenue retention (GRR), and cohort-level churn rate for Sierra's enterprise customers"
      whyItMatters: "Without NRR and GRR, it is impossible to determine whether Sierra's ARR growth reflects healthy expansion within a stable base or is masking churn that requires continuous new-logo acquisition to sustain the growth rate. NRR below 100% would fundamentally alter the valuation narrative."
      diligencePath: "Request audited cohort retention data from Sierra management; compare against SaaS benchmarks (top-quartile enterprise SaaS NRR >120%); ask for logo churn count by vintage cohort since the February 2024 launch."
