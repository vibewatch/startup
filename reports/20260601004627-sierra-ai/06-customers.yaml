  - id: adoption-trajectory
    title: "Adoption Trajectory"
    body: >
      Sierra's adoption arc is steep. The company launched in February 2024 and crossed $100 million ARR within seven quarters—a pace its co-founders claim is among the fastest in enterprise software history, validated by Benchmark's Peter Fenton, who described Sierra's trajectory as "ridiculous how quickly that happened." A February 2026 internal update disclosed crossing $150 million ARR in eight quarters. As of the May 2026 Series E announcement, more than 40% of the Fortune 50 are Sierra customers. The company has not disclosed a total customer count, but the public case study corpus and press releases name over 30 distinct enterprises. The deployment funnel is efficient: named customers cite go-live timelines of four to ten weeks and report growing scope post-launch, with Rocket Mortgage now running over 400,000 chat conversations and 1 million outbound dials per month, and SoFi handling 50,000+ weekly conversations. Ramp expanded from a single-channel inbound agent to voice and multi-channel workflows within a year. Singtel went live in under ten weeks and immediately plans to extend AI to enterprise clients. These expanding deployment footprints, combined with the ARR trajectory, suggest strong net expansion within existing accounts even if renewal rate data are not disclosed.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU022
      - CU034
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: retention-and-durability
    title: "Retention and Durability"
    body: >
      Sierra does not disclose net revenue retention (NRR), gross revenue retention (GRR), churn rate, or cohort-level renewal data. The proxies available are behavioral and structural. Outcome-based pricing—where customers pay per resolved interaction, completed transaction, or saved cancellation—aligns Sierra's revenue directly to customer-perceived value: a customer that churns stops generating revenue for Sierra, creating a strong mutual incentive to deliver ongoing outcomes. SiriusXM was announced as one of Sierra's original design partners in February 2024 and is still expanding its deployment as of the May 2026 Agent Data Platform announcement, implying over two years of continuous engagement. Ramp built its first in-house AI in 2023, migrated to Sierra, and by 2025 was expanding across all support channels and voice. ADT launched its Sierra agent and publicly stated plans to expand into payment, rescheduling, and upsell workflows—consistent with a multi-year relationship trajectory. The platform's Agent OS and Agent Data Platform create cross-session data dependencies that raise switching costs once deployed at scale. Customer satisfaction evidence is largely qualitative (executive quotes, "highest-rated channel" designations) rather than longitudinal cohort data, which remains the principal diligence gap.
    claimRefs:
      - CU023
      - CU024
      - CU036
      - CU037
      - CU038
      - CU039
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: expansion-and-concentration
    title: "Expansion and Concentration Risk"
    body: >
      Sierra's Fortune 50 concentration (40%+ of Fortune 50 are customers) is both a proof point and a risk factor. On the positive side, it validates enterprise readiness and creates powerful reference leverage. On the risk side, a handful of Fortune 50 accounts may represent a disproportionate share of ARR; if a single large account churns or reduces spend, the revenue impact could be material. Sierra has not disclosed revenue concentration metrics. Geographic expansion is accelerating: SoftBank's backing in Japan (led by the Opera Tech acquisition), Fragment in France, and Singtel as the Asia anchor customer represent the first non-US revenue base; but most named proof is US-centric. The outcome-based model limits Sierra's pricing predictability—a buyer scaling resolved conversation volume from 50,000 to 500,000 weekly may face a tenfold cost increase without a fixed cap, which has been cited by industry observers as a procurement friction point. Land-and-expand is clearly working within accounts (Ramp: inbound → voice → non-support; SiriusXM: support → ADP → outbound sales; Singtel: Singapore → enterprise clients), but the absence of public NRR data makes the cross-portfolio expansion rate unverifiable.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU041
    tableRefs:
      - TU005

