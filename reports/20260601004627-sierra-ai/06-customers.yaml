        - id: "adp-integration"
          label: "Agent Data Platform"
          description: "Customer adopts ADP for persistent cross-session customer memory; switching cost rises sharply; relationships deepen from transactional to proactive"
        - id: "advocate"
          label: "Advocate / Reference"
          description: "Named customer becomes public reference (case study, press release, conference talk); used in Sierra sales motion for next Fortune 50 prospect"
    approximationNotes: "Journey stages are inferred from named customer case studies; no internal Sierra funnel data has been disclosed."
