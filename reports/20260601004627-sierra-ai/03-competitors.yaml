  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing-and-unit-economics
    missingEvidence: Apples-to-apples realized pricing and margin data across Sierra and close peers.
    whyItMatters: Without it, public pricing comparisons remain descriptive rather than truly economic.
    diligencePath: Request anonymized pricing data from management and benchmark it against customer reference calls and any available peer data.
    relatedQuestionRefs:
    - QP009
    - QP024
  - type: missing-source
    severity: material
    topic: competitive-win-rates
    missingEvidence: Documented bake-off win rates, reasons for losses, and displacement data against key incumbents and startups.
    whyItMatters: A durable moat is easier to underwrite with actual competitive outcomes than with positioning language.
    diligencePath: Request pipeline analytics and recent competitive analyses from sales leadership.
    relatedQuestionRefs:
    - QP006
    - QP022
    - QP025
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion-vs-peers
    missingEvidence: Renewal, expansion, and churn data by cohort relative to deployment complexity.
    whyItMatters: Retention quality is one of the best ways to separate an execution lead from a durable competitive advantage.
    diligencePath: Request cohort renewal data and expansion rates by customer segment and use case.
    relatedQuestionRefs:
    - QP022
    - QP025
  - type: missing-source
    severity: minor
    topic: exact-enterprise-pricing-transparency
    missingEvidence: More direct public disclosure on contract structure and setup costs across competitors.
    whyItMatters: Public landing pages mostly describe value propositions, not procurement economics.
    diligencePath: Use customer reference calls and procurement summaries to build a more complete price map.
    relatedQuestionRefs:
    - QP024
