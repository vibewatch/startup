        - 标准快递无法覆盖的笨重、易碎或超大件物品末端派送
        - 中频；订单量驱动型需求；随电商渗透率提高同步扩张
        - 承接电商物流的长尾大件需求；对冲纯快递类竞争对手的战略防线
