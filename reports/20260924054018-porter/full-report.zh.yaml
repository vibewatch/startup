          note: 根据印度微中小企业部（MSME Ministry）数据（2023–24），印度约有 6300 万家注册 MSME。但并非所有企业都需要同城 LCV 物流服务。
        - label: 需要同城物流的城市 MSME
          value: 15000000
          note: 预估一、二线城市中，在制造业、商贸或分销领域具备实质性同城货运需求的城市 MSME 约 1500 万家（15m）。
        - label: Porter 覆盖区域内的 MSME（22 座城市）
          value: 5000000
          note: Porter 目前覆盖的印度 22 座城市内预估有 500 万家 MSME（5m），主要集中在一线特大城市（Bengaluru、Mumbai、Delhi-NCR、Hyderabad、Chennai、Kolkata）。
        - label: Porter App 或网页端用户（预估）
          value: 2000000
          note: 基于 1M+ Google Play 下载量及 iOS App 渗透率，预估独立用户约 200 万（约 2m，合并 MSME 与个人消费者）。活跃用户与下载量的转换比例未知。
        - label: Porter 活跃客户数（预估）
