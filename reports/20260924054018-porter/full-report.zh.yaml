      - number: '2.3'
        title: 客群细分、用户画像与采纳触发因素
        blocks:
          - type: paragraph
            body: >
              Porter 的目标市场分为三类买家，各自有不同的业务流程、预算安排和采用动因：

              第一类——中小微企业（MSME）：印度有 6,300 多万家 MSME，是 Porter 的主要增长驱动力。中小微企业主要将 Porter
              用于原材料采购跑单、工厂间物料调拨、成品向分销商与零售商交付，以及电商平台订单履约。采纳平台的核心触发因素在于相较非正规中介的降本效应（基于透明化定价通常可节省 15–25% 的运费）；符合财税要求的 GST
              发票也是采用平台的重要原因。预算决策者通常是企业主或物流负责人。多点配送和单次货量较大，使中小微企业的 ARPU（每用户/订单平均收入）高于个人用户。Redseer 调研数据显示，当前仅有约 20%
              的中小微企业采用线上物流平台，蕴藏着体量庞大的待转化增量空间。

              细分群体 2——个人与家庭用户：使用 Porter
              进行同城搬家（大件家具、家电、居家杂物搬运）或个人点对点物品取送的城市居民。采纳触发因素主要是相较传统无资质搬家队更透明的价格体系以及实时定位轨迹追踪。预算决策人即消费者个人。该客群对价格敏感度较高，复购频次相对中小微企业偏低。

              细分群体 3——大型企业与品牌电商：具有高频、稳定同城运力调配需求的大中型企业及 D2C 品牌。采纳触发因素在于 SLA 履约确定性、企业级 API
              接口对接能力以及集约化结算开票。预算负责人为供应链或物流部门总监。Porter 通过开放商业开放接口（Business API）与定制化计划车队合同服务该客群。

              中小微企业是 Porter 的战略重点：该群体客单价更高、下单更频繁，单笔经济效益也更好。在 GST 财税改革、UPI 移动支付普及与 PM GatiShakti 国家基建政策正推动印度 MSME
              数字化，使物流采购从人工叫车转向平台预订，扩大 Porter 可触达的 MSME 客群。
