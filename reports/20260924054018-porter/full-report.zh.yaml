      - number: '6.5'
        title: 扩张动能与集中度风险
        blocks:
          - type: paragraph
            body: >
              Porter 的主要扩张抓手包括地域拓展（新开拓城市及阿联酋）、客群纵深运营（推动中小微商户从低频使用向习惯性使用转变，并向上增销至 Porter Business API
              签约合同），以及车型多样化布局（用于快速电商近场配送的两轮车、用于工业物流的平板卡车）。“先入驻后拓展”（land-and-expand）动能在企业级客群中最为显著：最初通过 Porter Business
              门户进行即时散单叫车的企业，后续可迁移至基于月度或年度合同的 API 深度系统集成，从而拉高单客 GMV
              并降低叫车摩擦。在客户维度，营收集中度预计处于低位——鉴于中小微企业和个人用户高度分散，单一客户贡献营收占比大概率低于
              5%——但这仅基于市场结构的推断，并非公司披露的官方数据。地域集中度则显著偏高：作为大本营的班加罗尔预计贡献营收的 25–30%，排名前四的城市（班加罗尔、孟买、德里国家首都辖区、海得拉巴）可能合计占总营收的
              60–70%。同业竞争烈度持续加剧：Shadowfax（FY25 营收约 ₹1,750 crore，处于 IPO 阶段）在中小微企业物流赛道与 Porter 展开直接交锋；Lalamove
              凭借雄厚的跨国资本后盾在一线大都市积极布局；即时零售平台也在加速搭建自建物流网络，可能侵蚀 Porter 的小件包裹及 C 端业务份额。渠道端对 Porter 客户端应用的重度依赖构成了单渠道集中度风险。按 12
              亿美元（$1.2 billion）投后估值完成的 F 轮融资虽为业务扩张注入了弹药，但也大幅抬高了支撑该估值倍数所需的客户增长门槛。
