      - CV035
    rows:
      - - 收入增长持续性
        - 在大基数上连续两年维持 57% 同比增速；结构性 MSME 物流需求支撑增长延续
        - 随着覆盖城市走向成熟且竞争加剧，增速或将放缓；尚无队列数据确认其持续性
        - 高权重——最大价值驱动因素
        - 在不依赖资本密集型补贴的情况下，第 3–5 年能否维持 40%+ 的增速
      - - 经营杠杆
        - 可变成本占比 82.8%；每增收一卢比均带来高额增量利润；无自营车队固定成本
        - 《机动车聚合平台指引》与《社会保障法典》可能将可变成本转变为半固定法定义务
        - 高权重——核心回报驱动因素
        - 监管框架重构可变成本基础的时间点，是否早于盈利规模的充分释放
      - - 监管环境
        - 截至 2026 年 5 月未见不利监管通告；印度物流行业历来受监管较轻
        - MV Aggregator Guidelines（MoRTH）与 Code on Social Security 2020 均处于 12–24 个月通告时间表
        - 关键——二元风险
        - 两项法规是否会在 FY28 前以现有形式正式通告落地
      - - 市场地位与护城河
        - '据 Redseer 2025 报告，按 GMV 计在印度同城物流市场位列 #1；1.2M 司机合作伙伴构建起供给侧覆盖护城河'
        - 若 Lalamove 重启大额投入或 Shadowfax 上市后发起价格战，缺乏结构性锁定的市场份额或被侵蚀
        - 中权重——具支撑作用但单凭此点并不充分
        - 随着 MSME 市场日趋成熟，平台的市场领先地位能否转化为定价权
      - - IPO 与退出路径
        - FY25 首个盈利年确立了 IPO 准备度；Delhivery 与 Shadowfax 提供可比退出先例
        - FY27–28 的 IPO 市场环境存在不确定性；优先股堆叠与清算条款未见公开建模
        - 中权重——受时间窗口约束
        - 在 FY27–FY28 的印度市场环境下，IPO 市场能否承接估值逾 $2B 的物流独角兽上市
      - - 地域集中度
        - 业务已覆盖 22+ 座城市，集中度有所降低；2030 年拓展至 50 城的规划将进一步分散收入风险
        - 班加罗尔预计贡献 25–30% 收入；单一城市的局部冲击将对损益造成超预期冲击
        - 低至中权重——尚属可控但不可轻视
        - 新开城市的单体经济效益能否匹敌班加罗尔时期的水平，抑或随渗透至更小城市而出现恶化
    notes: 多空论点反映截至 2026 年 5 月公开证据的现状。监管风险评估基于公开可查的政策征询文件；目前尚未发布任何正式监管通告。所有权重评估均为定性判断，旨在指导尽调优先排序，而非正式的概率模型分析。
