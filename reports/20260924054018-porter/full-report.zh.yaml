      - number: '1.3'
        title: 融资历程、估值与投资方阵容
        blocks:
          - type: paragraph
            body: >
              2014 至 2025 年间，Porter 历经 6 轮机构融资，累计募集资金约 $350+ million。2025 年 5 月宣布完成 F 轮融资后，公司估值达到 $1.2B，正式跻身独角兽行列。

              早期融资历程：种子轮（约 $1 million，2014 年）用于平台早期开发；A 轮（$1.5 million，2016 年）提供商业模式验证资金；B 轮（$12 million，2018
              年）支持跨区域地理扩张；C 轮（$30 million，2020 年）进一步扩大业务规模；D 轮（$15 million，2021 年）作为过桥轮融资。

              E 轮（2022 年）：融资金额为 $150 million，是 F 轮前规模最大的一轮融资，全力支持大规模市场扩张。Vitruvian Partners 作为核心机构投资方参投，并在 F 轮中继续跟投。

              F 轮（2025 年 5 月）：Porter 完成由 Kedaara Capital 与 Wellington Management 领投的 $200 million 融资，投后估值达
              $1.2B，一举确立独角兽地位。深耕印度中盘成长型企业的私募股权机构 Kedaara Capital 与管理资产超 $1t（1 万亿美元）的全球资管巨头 Wellington Management
              共同领投，现有投资方 Vitruvian Partners 继续跟投。值得注意的是，Peak XV Partners（前身为 Sequoia India）和 Kae Capital
              借本轮融资完成了老股退出，显示部分早期投资人选择获利了结。2025 年 7 月 8 日，印度竞争委员会（CCI）正式批准 Kedaara Capital 收购 SmartShift Logistics
              Solutions 的股份。

              F 轮融资所得资金计划用于拓展新城市（目标到 2030 年覆盖 50 个城市）、深化中小微企业市场渗透、加大技术研发投入以及建设司机合作伙伴生态系统。
