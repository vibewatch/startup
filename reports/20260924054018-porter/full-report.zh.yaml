      - number: '8.7'
        title: 附件展示
        blocks:
          - type: callout
            title: 入局纪律：12 亿美元估值处于合理区间，但承担 MV Aggregator 风险需足够确信度
            body: >-
              从财务指标来看，12 亿美元 Series F 估值具备合理支撑：按印度成长型市场标准，对一家增速达 57% 且实现盈利的企业给予 2.8 倍 EV/Revenue 估值并不激进，且 Delhivery 与
              Lalamove 两家可比公司为入局价格划定了合理区间。然而，鉴于 MV Aggregator Guidelines 监管风险的二元特性，投资者必须审慎权衡发生概率为 20–25%、估值下行 40–50%
              的下行情景。在此估值下入局，需要明确确信监管环境将保持平稳，或 Porter 具备充足经营杠杆可在抽成率承压至多 7 个百分点时不跌破盈亏平衡点。附带保护条款的进场方案——例如在 MV Aggregator
              Guidelines 于 12 个月内落地生效时触发棘轮保护或估值调降条款——将显著优化风险收益比。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV029
              - CV030
          - type: callout
            title: 估值反向逻辑：82.8% 车队分成比例压缩抵御监管冲击的安全垫
            body: >-
              Porter 最受推崇的财务特征——占比达 82.8% 的可变成本结构——恰恰也是其面对监管介入时最脆弱的软肋。MV Aggregator Guidelines 与 Code on Social Security
              2020 的出台初衷，正是重构平台聚合型零工经济模式。若两项法规在 24 个月窗口期内同时落地推行，其冲击并非简单线性叠加，而是呈乘数级发酵：抽成率上限削减营收端，分成底线则抬高成本端，对 EBITDA
              形成两头挤压。Porter FY25 净利润为 ₹55 crore（约占营收的 1.3%），对双重监管冲击几无缓冲空间。在此情景下，12
              亿美元入局将沦为亏损投资。在投资委员会批准前，每一版财务模型均应对该风险进行严格压力测试。
            calloutType: risk
            claimRefs:
              - CV005
