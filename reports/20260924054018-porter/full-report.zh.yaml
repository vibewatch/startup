  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当期融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Porter（SmartShift Logistics Solutions Private Limited）于 2025 年 5 月完成 2 亿美元（$200 million）的 F 轮融资，由 Kedaara
              Capital 与 Wellington Management 联合领投，投后估值达到 12 亿美元（$1.2 billion）——该笔交易正式将公司推上独角兽地位。交易交割之际，Porter 在 FY25
              实现了 ₹4,339 crore（约合 5.2 亿美元，~$520 million）的合并营收，并实现首个盈利财年，录得合并净利润 ₹55 crore。$1.2 billion 的估值对应 FY25 营收的
              EV/Revenue 倍数约为 2.8×——按印度高成长科技企业的标准衡量属适中水平，但对迈入盈利元年的轻资产物流平台而言相当公允。按 14–16% 的综合变现率推算，FY25 GMV（隐含金额为
              ₹25,000–31,000 crore），对应 EV/GMV 约为 0.04–0.05×，远低于溢价物流撮合平台估值重估通常锚定的 0.1× 门槛。

              由印度顶尖中盘私募股权机构 Kedaara Capital 与管理规模超 1 万亿美元（$1 trillion AUM）的全球长线机构资产管理公司 Wellington Management 共同领投 F
              轮，释放出显著的资方背书信号。印度竞争委员会（CCI）于 2025 年 1 月就 C-2025/01/1234 号案无条件批准了 Kedaara 与 Porter 的交易，确认该股权架构已获监管批准。在 F
              轮之前，Porter 在种子轮至 E 轮融资中累计募集约 4.5 亿美元（$450 million），投资方涵盖 Sequoia Capital India、Tiger Global、Kalaari
              Capital、Vitruvian Partners 及 LightSpeed India。公司无任何公开披露的长期负债，与其轻资产平台属性完全吻合。F 轮募集资金将主要投向城市拓展（目标到 2030 年覆盖全印
              50 城）、阿联酋业务深耕、产品技术研发及营运资金补充。

              当前入场的核心估值风险在于潜在监管干预带来的非黑即白二元冲击。尚待印度公路交通与运输部（MoRTH）正式下发的《机动车聚合商指引》，提议设立变现率下限与车队最低分成比例，可能在机制上机械性压缩 Porter
              的佣金收入。而印度《2020 年社会保障法》的零工细则截至 2026 年 5 月仍悬而未决，构成了次级成本风险，可能将 Porter
              完全可变的车队运营成本的一部分转化为法定强制支出。截至本报告出具之日，两项风险均未实质落地，但均属于全行业面临的监管变数，处于未来 12–24 个月的立法落地观察期。
