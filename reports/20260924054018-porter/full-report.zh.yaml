  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Porter 在 FY25-26 面临显著抬升的复合监管风险。其中最严峻的一项是印度公路交通与运输部（MoRTH）出台的《2025 年机动车聚合商指引》（MV Aggregator
              Guidelines）。该指引提议对车辆聚合商设定 10-15% 的佣金或变现率（take rate）上限。Porter 目前的综合变现率约为 GMV 的 14-16%，意味着即使按 15%
              的上限执行也会抑制向上定价空间，而 10-12% 的上限则将迫使其对营收模式进行根本性重构。以 FY25 4,339 亿卢比（Rs 4,339 crore）的营收计算，在成本保持不变的前提下，变现率若被强制从
              15% 压低至 12%，预计将导致每年 400-600 亿卢比（Rs 400-600 crore）的营收缺口。具体执行时间表尚不明确——MoRTH
              尚未公布确切的落地实施日期——从而形成了缺乏明确化解窗口的监管阴霾。Porter 尚未公开披露合规应对策略，官方也未宣布任何针对货运或货物运输聚合商的行业豁免条款。包括 IAMAI 和 CII
              在内的行业协会虽已积极游说修改条款，但成效未经验证。

              《2020 年社会保障法》（Code on Social Security 2020）针对零工群体的条款自 2025 年 11 月起正式生效，强制要求企业按年营业额的 1-2% 向国家零工福利基金缴费。以
              FY25 营收 Rs 4,339 crore 计算，对应每年新增 Rs 43-87 crore 的支出，已确认为自 FY26
              起不可避免的重大刚性成本。与落地时间尚存不确定性的《机动车聚合商指引》不同，《社会保障法》已完成正式法定立法程序，Porter
              的合作司机作为平台工作者完全属于其管辖范畴。该成本属于全行业普遍承担的刚性支出，未来可能部分转嫁给车队运营商或终端客户，但对短期利润的负面冲击真实且不可规避。

              特伦甘纳邦零工与平台工人联盟（TGPWU）在海得拉巴提起的未决劳工诉讼指控称，Porter 在缺乏正当程序的情况下擅自冻结合作司机账号，且未能保障最低每公里运费底线。Porter 否认了上述指控；截至 2026
              年 5 月，劳工法庭尚未作出正式裁决。然而，该案确立了一个监管风向标：若 TGPWU 成功推动劳工法庭作出不利于平台的裁决，可能触发其他各邦对 Porter
              零工平台工作者雇员身份属性的重新定性审查，从而大幅拉高财务与运营合规风险。就反垄断与竞争法而言，印度竞争委员会（CCI）于 2025 年 7 月 8 日正式批准了 Kedaara Capital 对 Porter
              的股权收购。CCI 的放行为本次融资扫清了障碍，但若 Porter 未来开展进一步并购或市场份额触及垄断审查红线，将面临 CCI 的重新审查。印度《机动车聚合商指引》最早于 2020 年提出并历经多次修改，折射出
              Porter 及其行业同行面临着充满反复与变数的漫长监管通道。
