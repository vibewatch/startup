  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局全景概述
        blocks:
          - type: paragraph
            body: >-
              印度同城物流属于高度分散的长尾市场，全行业约 70% 的货运量仍由传统货运中介、依靠电话沟通的叫车黄牛以及路边趴活的小作坊撮合，这类非正规主体无法提供线上叫车、实时追踪或符合 GST
              规范的增值税发票。在正规化、由技术驱动的细分赛道中，Porter 稳居领跑地位，而具备相当业务体量的同城 LCV 纯平台型直面竞争对手仅有 Lalamove 与 Blowhorn
              两家。相近赛道的竞争对手则深耕在模式迥异的领域：Shadowfax 与 Delhivery 分别聚焦最后一公里电商快递和企业级 B2B 公路干线快运，目前与 Porter 的同城 LCV
              运力撮合模式交集有限，但二者坐拥全国化仓配网络与雄厚资本储备，理论上具备向同城 LCV 赛道切入的能力。Shiprocket
              则定位于中小企业快递聚合服务商，通过接入第三方承运商分发包裹，自身并不调度路面运力，业务形态与 Porter 不构成直接重叠。曾作为即时配送近邻跨界竞争的 Dunzo 于 2024
              年初全面停摆，消除了同城即时替代威胁。非正规货运中介网络依然是最大的运量竞争来源：凭借低廉的感知成本、深厚的人际信任关系以及零数字化软硬件开销牢牢把控着线下货源。在未来 36
              个月窗口期内，新进入者冲击风险整体可控；Delhivery 凭借资金厚度与技术沉淀构成最值得警惕的潜在平台级威胁，而截至 2026 年中，公开市场尚未出现国际物流巨头大举进军印度同城 LCV 物流的明确信号。
