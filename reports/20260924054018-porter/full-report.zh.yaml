      - number: '2.4'
        title: 增长驱动要素、制约瓶颈与市场动态
        blocks:
          - type: paragraph
            body: >
              印度同城物流市场受强劲的结构性宏利驱动，同时也面临现实的短期制约。需求端：印度电商市场 GMV 在 2024 年突破 $70 billion，预计到 2030 年将迈向 $200
              billion，而最后一公里同城配送正是首要物流瓶颈。到 2047 年，印度城市人口预计将新增 416 million 居民，为二线及三线城市注入澎湃的增量物流需求。印度政府推行的 PM GatiShakti
              国家总体规划——一项投资规模达 ₹100 lakh crore 的基础设施工程——正加速构建公铁多式联运网络，有效削减城际干线物流成本并激活同城商贸活力。GST
              税制的落地加速了中小微企业的正规化进程与数字开票普及，显著提升了在线物流平台的吸引力。新能源汽车（EV）的渗透正在催生全新的车队类别（电动轻型商用车、电动两轮车），降低了每公里运营成本，并吸引了一批新型司机合作伙伴入驻。

              制约瓶颈端：印度轻型商用车保有结构高度分散（绝大多数为个体挂靠或自购自营，而非规模化车队公司），给运力供给端拓展和司机留存带来较大阻力。零工经济中司机流失率居高不下；Porter 披露的 1.2 million
              入驻数据为历史累计指标，而非活跃运力规模。燃料价格波动直接侵蚀车队运营收益与 Porter 的平台抽成经济模型。《Code on Social Security 2020》与《Motor Vehicle
              Aggregator Guidelines 2025》带来的监管合规风险，转化为 Porter 无法回避的法定成本支出。此外，电商快递巨头（如
              Delhivery、Shadowfax）正试图向同城货运业务跨界渗透。

              市场结构的分散性机遇与挑战并存：70% 的非正规市场份额蕴含着巨大的数字化转化空间，但也意味着来自非正规小车队的直接价格竞争——后者几乎无需承担监管与合规成本。
