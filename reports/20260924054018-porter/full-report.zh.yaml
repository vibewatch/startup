      - - 地理集中度（班加罗尔）
        - 班加罗尔估计占收入的 25–30%；前 4 大城市很可能占总量的 60–70%
        - 高——单一城市级监管或竞争冲击对损益表影响过大
        - 每年新增 3–5 个城市；进军 UAE 树立了国际化样板
        - 向财务数据室调取分城市收入明细；核实班加罗尔占比
      - - 客户集中度（最大单一客户）
        - 鉴于 MSME 与个人消费者客群高度分散，估计无单一客户收入占比超过 5%
        - 低至中——分散的客群在结构上限制了单一客户风险
        - 保持 MSME 客群广度；避免过度偏向大型企业客户
        - 向数据室调取前 20 大客户收入集中度，以验证客群分散度的估算
      - - 企业级 API 落地与扩张
        - Porter Business API 支持建立合同制企业客户关系；接入量持续增长但未量化
        - 低（机会风险）——未能转化企业客户会限制 ACV 增长与客户黏性
        - 加大对企业销售和客户成功的投入，推动即时叫车客户向 API 合同迁移
        - 调取 B2B API 客户数、ACV 分布以及第 1 年到第 2 年的合同续约率
      - - 竞对价格竞争
        - Shadowfax（FY25 收入 ₹1,750 Cr）与 Lalamove 争夺同一 MSME 客户群
        - 高——估计节省 5–10% 成本即可引发 MSME 倒戈；结构性锁定效应有限
        - 凭履约可靠性、城市覆盖广度、App 体验与司机素质拉开差距
        - 跟踪 Shadowfax 的 IPO 披露，关注客户重合度与市场份额数据
      - - 单一渠道 GTM 依赖（App）
        - Porter App 是主要的 GTM 和履约渠道；无重大第三方分销渠道
        - 中——应用商店政策变动或宕机会带来单点故障风险
        - 建立直销企业团队与 API 分销渠道，降低对纯 App 的依赖
        - 在管理层访谈中评估企业销售团队人数及渠道组合
    notes: >-
      地理集中度估算（班加罗尔约占收入的 ~25-30%，前 4 大城市约占 ~60-70%）基于城市市场结构及进入先后顺序推算，仅具方向参考意义。Porter
      未披露官方的分城市收入明细。竞对收入数据源自公开监管文件与媒体报道，可能反映不同报告期。
