  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 营收模式、定价机制与收入质量
        blocks:
          - type: paragraph
            body: >-
              Porter 采用单一机制的营收变现体系：对在其平台上完成的每笔货物运输交易按比例抽取平台佣金。该佣金费率视车型、配送里程及城市能级不同，介于订单总金额的 14% 至 30% 之间，在会计处理上依据 Ind AS
              115 准则于行程履约完成时全额即时确认，因而账面无递延收入遗留，形成了一笔笔清晰透彻、按单结清的现金流源泉。FY25 合并口径营业收入达到 ₹4,339 crore，较 FY24 的 ₹2,734 crore
              劲增 57%，而 FY24 本身亦较 FY23 的 ₹1,753.8 crore 同比增长 56%。货运撮合佣金收入构成了 FY25 总收入的约 99%；其余约 1%
              收入源于其他经营性收入（包括平台辅助技术服务费及各类增值服务）。在公开财务数据中，公司不存在任何 SaaS 订阅、会员制或自营重资产货运带来的收入流。

              按照平台撮合类商业模式的标准审视，其营收质量表现扎实。收入确认为单点即时确认（每笔完成行程一次性确认），而非跨期分摊，从而大幅降低了收入冲回坏账的风险。平台未对客户强制绑定排他性长期协议，收入完全由实际运量规模及车型客单结构拉动——相较那些依赖复杂捆绑合同的软件服务商，具备更高的数据透明度与抗波动性。Porter
              14–30% 的抽佣费率，与全球同城即时物流行业基准相比具备竞争优势（如 Lalamove 在亚洲同类市场的抽佣率通常在 15–25% 之间）。两轮即时货运板块每单贡献的绝对佣金金额偏低（单均约
              ₹11–₹50），而中型 LCV 及大吨位卡车订单单均佣金贡献则达 ₹270–₹2,400。因此，将业务重心倾斜向预订大车型的中小微企业客群，构成了公司在佣金模型框架内撬动毛利率扩张的核心支点。

              Porter 尚未对企业级 B2B 与个人 C 端订单的履约运量进行拆分披露，亦未公开平台 GMV（即经由平台结算的订单总交易额）。若按 20% 的综合加权佣金率粗略匡算，对应 ₹4,339 crore
              营收的隐含平台 GMV 约为 ₹21,700 crore；若按 30% 的综合佣金率推算，对应 GMV 则约为 ~₹14,500 crore。这一宽幅区间凸显了 GMV 测算结果对真实综合货币化率的高度敏感性，而
              Porter 迄今尚未按车型或城市分级正式对外公布分部抽佣数据。

              推动营收扩张的市场开拓策略主要依托三项抓手：中小微企业专属客户经理团队拓展、通过 Porter App 形成的自然流量数字转化，以及将 Porter 预订系统深度嵌入大型企业 ERP 与派单中台的 B2B API
              对接。Porter
              对外并未披露获客成本（CAC）或投资回收期——这一关键财务数据缺位制约了外部对其销售效率的独立精准测算。尽管这种由运量和高复购驱动的撮合模式，在商业逻辑上意味着比单次低频消费平台享有更低的有效综合
              CAC，但仍需调取各批次用户留存率（Cohort Retention）明细数据，方能验证该增长逻辑的扎实性。
