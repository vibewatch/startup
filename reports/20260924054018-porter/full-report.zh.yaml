      - - 个人消费端
        - 个人——居民搬家、大家电运输、单次搬运
        - 因居家或个人用途偶尔租用 LCV 或微卡
        - 低频；估计占收入的 15–20%；需求呈现季节性高峰
        - 客户终身价值（LTV）较低；价格高度敏感；面临传统非正规渠道的激烈竞争
        - 缺少复购率数据；App 访问至付费用户转化率未予公开披露
      - - 企业级 / B2B
        - 规模较大企业——供应链物流、合同制车队服务、API 集成
        - 借助 Porter Business API 实现多点路线规划、计划性派送与车队调度
        - 中频；依托定期合同滚动履约；业务持续增长但规模尚未量化
        - API 集成带来合同黏性；单账户年合同价值（ACV）具备提升空间
        - 公开渠道未披露 B2B 客户数、平均 ACV 或企业端收入占比
