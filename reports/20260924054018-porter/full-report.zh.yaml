  - id: FI002
    title: 单笔订单经济模型拆解
    type: flow
    description: 典型微卡（mini-truck）订单的单笔经济模型拆解测算，展示从总预订金额到 Porter 单笔净边际贡献的推演路径。部分数据为估算值；详见测算说明（approximationNotes）。
    claimRefs:
      - CI005
      - CI018
      - CI019
      - CI022
      - CI035
    approximationNotes: 单笔经济模型采用公开价目表与分析师研报的中值估算。车队运力分成比例根据 FY25 总体财务数据推算；单笔实际数据未予披露。单笔分摊运营费用系由总运营费用除以推算年完单量估算；单笔贡献利润率仅供方向性参考。
    data:
      nodes:
        - id: u1
          label: 总预订金额：~₹1,200（典型微卡订单）
          type: input
        - id: u2
          label: Porter 佣金（综合抽佣率 ~20%）：~₹240
          type: process
        - id: u3
          label: 车队运力实际所得：~₹960（占订单金额 80%）
          type: deduct
        - id: u4
          label: 平台单笔毛利润：~₹204（扣除 ~15% 增量履约成本后）
          type: process
        - id: u5
          label: 单笔分摊运营支出：按当前完单量预估 ~₹180
          type: deduct
        - id: u6
          label: 单笔边际贡献：预估 ~₹24（随规模扩张而提升）
          type: output
        - id: u7
          label: 零车队资本开支：车辆由司机合作伙伴自备——无单笔折旧拖累
          type: annotation
      edges:
        - from: u1
          to: u2
          label: 平台按全额收取预订费用；实时扣除抽成佣金
        - from: u1
          to: u3
          label: 车队运力获得扣除 Porter 佣金后的订单金额
        - from: u2
          to: u4
          label: 扣除平台增量履约成本后的毛利润
        - from: u4
          to: u5
          label: 按当前单量分摊的单笔固定及半固定运营费用
        - from: u5
          to: u6
          label: 随着完单量扩张，剩余边际贡献逐步提升（经营杠杆效应）
        - from: u7
          to: u6
          label: 无单笔车队资本开支拖累；充分享受经营杠杆红利
