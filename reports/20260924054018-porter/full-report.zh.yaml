      - 已知局限
    rows:
      - - MSME 同城日常货运
        - 电话联系非正规货车中介、线下议价、耗费数小时等待、纸质收据
        - App 叫车、实时 GPS、透明定价、数分钟内开具 GST 发票
        - 消除中介抽成；常规行程周转时间（TAT）由数小时缩减至数分钟
        - 定制或重载货物定价并非始终透明；高峰期存在动态溢价风险
      - - 个人居民搬家（大件物品）
        - 本地搬家队、无 GPS、定价不透明、仅收现金
        - 预约 LCV 货车并支持实时追踪、无现金支付、电子签收单
        - 价格明确锁定；依靠 GPS 追踪确保履约责任可溯
        - 非全流程搬家（基础产品不含打包与搬运服务）
      - - 企业计划性车队运力（B2B 合同制）
        - 自有车队或通过非正规中介租车
        - 计划性叫车 API；定期运量享受协议价格
        - 减少企业物流在自建车队上的资本开支
        - 企业级 API 集成深度与 SLA 承诺未经验证
      - - 电商 / 即时零售末端配送（两轮车）
        - 采用 Shadowfax、Dunzo、Delhivery 进行末端快递配送
        - 预约两轮车，周转时间具竞争力且支持数字化追踪
        - 单一平台同时满足 LCV 与两轮车运力需求
        - Shadowfax 和 Delhivery 拥有规模更大的两轮车及快递网络；Porter 在该细分赛道属于挑战者
    notes: 业务用例梳理自 Porter 营销材料与媒体报道；量化收益估算仅具方向性参考意义。
