      - number: '6.3'
        title: 具名客户实证与标杆参考质量
        blocks:
          - type: paragraph
            body: >
              缺乏具名客户实证构成了 Porter 公开披露信息中最显著的尽调空白。与企业级 SaaS 或大型 B2B 物流企业不同，截至 2026 年 5 月，Porter
              从未在任何新闻宣传、投资人宣讲材料或监管申报文件中公开披露过任何具名企业大客户、具备可量化成效的客户案例研究或标杆参考客户。Porter
              官网上展示的中小微企业评价完全匿名——通常仅标注名字和所在城市，未注明公司名称、所属行业、发货单量或可核验的业务指标。这种做法在面向 C
              端的物流平台中屡见不鲜，却严重阻碍了外界对企业端采纳深度的独立验证。目前最有用的客户佐证来自两类间接指标：一是 Google Play 和 Apple App Store 评分，超百万次应用下载量与 4.1/5
              的评分证明了真实的消费级规模化应用；二是 Redseer 2025 年同城物流报告，该报告将 Porter 列为全印 GMV
              排名第一的平台型聚合商，提供了独立于公司自述的分析师口径行业地位背书。Shadowfax 在 IPO 筹备期发布的行业报告亦将 Porter 列为同城物流市场的主要参与者，构成规模层面的第三方佐证。G2 和
              Trustpilot 上虽有 Porter 的词条，但评论寥寥无几，折射出该平台主要服务中小微商户和个人用户而非软件采购企业。公开渠道无法获取任何客户企业标识（Logo）、具名落地案例或具有明确 ROI
              的业务成效数据。这种证据质量特征符合高频交易型消费者及 MSME 平台的情况，但对希望验证合同持续性与客户集中度的投资者而言，仍是实质性的尽调缺口。
