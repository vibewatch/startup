      - number: '5.4'
        title: 信任、安全、合规与监管风险
        blocks:
          - type: paragraph
            body: >
              监管政策收紧与零工权益诉讼，给 Porter 的合规与信任机制带来显著压力。安全管理层面，Porter 要求司机入驻前必须完成严格的车辆核验、驾照核查及营运保单审核方可激活账户。司机端应用内置 GPS
              轨迹追踪功能，构成了保障司乘双方人身与财产安全的被动防御屏障。同时 Porter 全面支持无现金数字支付，以此降低行程中的抢劫与现金纠纷风险。

              行业监管合规：根据印度《Motor Vehicle (Amendment) Act 2019》以及《Motor Vehicle Aggregator Guidelines 2025》，Porter
              的主要监管敞口来自其作为“平台聚合商”的法定身份。由道路运输和公路部（MoRTH）颁布的上述指引，拟针对平台设定司机最低保底收入、抽成比例上限（建议设定为 10–15% 封顶）、强制商业保险及健全纠纷申诉渠道。若
              10–15% 的抽成上限强制执行，将直接压缩 Porter 目前 14–16%（部分城市高达 30%）的平台实际抽成率。

              印度《Code on Social Security 2020》（定于 2025 年 11 月生效）要求平台型企业按年营业额的 1–2% 向零工社保基金缴纳专项法定供款。以 Porter 在 FY25 录得的约
              ₹4,339 crore 营收测算，对应每年 ₹43–87 crore 的新增合规支出——相当于其 ₹55 crore 合并净利润的 79–158% 左右。这对 FY25 刚刚实现的盈利成果构成了实质性威胁。

              劳工劳动条件：特伦甘纳邦零工与平台工人工会（TGPWU）于 2025 年发起公开投诉，指控 Porter 在海得拉巴涉嫌压榨合作司机、随意不公封禁账号，且缺乏应有的诉求申诉渠道。《Times of
              India》、《The Hans India》以及商业与人权资源中心（BHRRC）的调查报道印证了这些指控。工会要求明确设定每公里保底运价标准，并建立正规的劳动争议调解流程。

              数据安全防护：Porter 移动应用采集并处理支付数据（集成 Razorpay/Paytm）、地理位置轨迹以及客户身份信息。公开资料中未见任何第三方机构出具的安全审计报告。印度《Digital Personal
              Data Protection Act 2023》（当前处于落地实施阶段）将赋予企业更严格的数据合规处理义务。
