      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Porter 技术栈分为四个功能层：(1) 面向客户的客户端层（iOS/Android 应用、网页端下单门户）；(2) 核心平台服务层（订单处理引擎、派单算法、支付与消息通知）；(3)
              数据与算法层（GPS/定位、路线优化、动态定价与预计到达时间 ETA 预测）；(4) 基础设施层（云托管、地图 API 及第三方系统集成）。

              订单处理引擎负责处理叫车请求，按城市片区核验可用运力，并实时完成锁单。派单算法（在 Porter 产品宣传资料中称为“智能车队分配”）结合合作司机的实时 GPS
              坐标、车型筛选条件及预估接驾耗时，实现供需精准匹配。多点停靠逻辑支持客户在途中增设中间站点并实时重算运费。ETA 预测模型则整合了历史道路车速画像与实时路况数据。

              地图服务方面，Porter 集成 MapMyIndia（获取针对印度本土的高精道路数据）与 Google Maps（保障更广覆盖度与出色的移动端交互体验）。支付结算依托 Razorpay 以及 Paytm/UPI
              基础设施。平台采用微服务架构，支持订单、派单、轨迹追踪和计费模块独立扩容。GST 开票与电子签收（POD）模块作为增值服务，无缝叠加在核心行程履约工作流之上。

              面向阿联酋市场，Porter 对平台系统实施了本地化改造，包括适配全英文 UI 界面、AED
              货币结算通道以及阿联酋本土道路地图数据。这一拓展采用了独立平行部署架构而非全球统一的多租户架构，意味着系统背负着一定的额外运维管理开销。

              CPTO Shruti Ranjan Satpathy（2023 年履新）全面掌舵技术体系。Porter 迄今未曾公开发布深度工程技术博客、开源代码仓库或正式的公开 API
              接口文档，导致外部对公司宣称的技术架构主张难以展开充分的独立技术核验。司机端应用的核心功能（抢单接单、车载导航、数字签收采集、收入流水对账）与客户端功能保持精准镜像协同。
