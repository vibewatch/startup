        - 12–24 个月（当前处于意见征询阶段；截至 2026 年 5 月尚无公报草案）
      - - 《社会保障法典》零工工人条款正式通告
        - 政府通告平台从业人员社会保障缴费细则
        - 重大——车队分成支出增加 2–3% 额外成本，从结构上削弱经营杠杆
        - 劳工部公报；ESIC 与 EPFO 通告；行业圆桌会议报道
        - 18–36 个月（有待最终规则确立；实施细则尚未起草）
      - - 班加罗尔收入冲击（同比下滑 >15%）
        - 因任何特定于该市的诱因，班加罗尔收入同比下降 >15%
        - 高——涉及总收入的 25–30%；集团层面收入未达预期幅度达 5–8%
        - 月度城市级订单量；MCA 申报文件；地方媒体；竞争对手公告
        - 持续——按季度监测
      - - 城市拓展单体经济效益不及预期
        - FY24 之后新增城市中，有 ≥3 座开城 18 个月内未能实现边际贡献盈亏平衡
        - 重大——Series F 资金消耗加快；后续融资可能面临具稀释性的条款
        - 内部数据室：按队列划分的城市级边际贡献率；管理层说明
        - 自 FY24 之后首座新城开城起 12–18 个月（FY26 监测窗口）
      - - 竞对抽佣率价格战
        - Lalamove 或 Shadowfax 同时在 Porter 前五大城市推行 >10% 的佣金折扣
        - 中等至严重——若叠加任何监管上限，将从收入和成本两端同时挤压利润
        - 借助下单应用监测竞对定价；物流行业媒体；司机论坛
        - 持续——按季度监测；Shadowfax 挂牌上市后的策略是近期最为紧迫的触发因素
    notes: 阈值条件基于公开财务与监管数据的桌面分析。截至 2026 年 5 月，尚未有触发条件成为现实。概率判定仅为定性分析。尽调团队应将设立追踪 MoRTH 与劳工部公报更新的监测看板，作为持续投后管理的必要前提。
  - id: TV006
    title: Porter 退出准备度与最终尽职调查诉求
    subtitle: Exit pathway assessment, gate requirements, outstanding data asks, and diligence priority
    columns:
      - 维度
      - 当前状态
      - 准入要求
      - 尽调诉求
      - 优先级
    claimRefs:
      - CV025
      - CV033
      - CV040
      - CV042
      - CV044
      - CV045
      - CV027
    rows:
      - - IPO 准备度（财务）
        - FY25 首次实现合并净利润 ₹55 Cr；单体净利润 ₹131 Cr；营业收入 ₹4,339 Cr
        - SEBI 规定主板 IPO 须具备 3 年营业利润；FY25 为第一年
        - 索取 FY23–FY25 经审计 Ind AS 合并财务报表；确认 SEBI 申报时间表
        - 关键
      - - 股权结构表与优先股堆叠
        - 未公开披露；估计 Series F 前经 6 轮融资累计筹集约 $450M
        - 需获取完整股权结构表，以在各类情景下推演退出分配瀑布流及普通股回报
        - 向 CFO 索取最新股权结构表；包括 ESOP 池及所有未行权期权
        - 关键
      - - Series F 条款清单（棘轮与清算条款）
        - 未公开披露；Kedaara 与 Wellington 条款未知
        - 清算优先权类型直接影响悲观情景下的资金回收测算
        - 索取已签署的 Series F 条款清单；标明任何棘轮、反稀释或赎回条款
        - 关键
      - - 城市级单体经济效益
        - 公开资料中未见；外部完全无法对 FY24 之后拓展城市建立模型
        - 到 2030 年拓展至 50 城为主要募资用途；单体经济效益决定资本效率准入门槛
        - 索取前 15 大城市的城市级边际贡献率瀑布图；新城市投资回本周期
        - 高
      - - FY26–FY28 财务模型
        - 公开资料中未见；缺少管理层输入的情形下，投资人自编模型具有推测性
        - 需具备 3 年期财务模型以支持情景分析与 Series F 回报评估
        - 索取管理层编制的基准、乐观与悲观财务模型；对比公开数据点核验
        - 高
      - - 退出路径（IPO 对比同行并购）
        - IPO 为主要退出路径（FY27–FY28）；Wellington 作为财务投资人支持公开上市
        - IPO 估值取决于市场行情；兼并出售则需锁定战略买方
        - 梳理潜在战略收购方（DHL、Maersk、Yamato）；确认 Wellington 锁定期
        - 中
      - - 监管风险监测
        - 截至 2026 年 5 月，MV Aggregator Guidelines 与 Code on Social Security 均处于征求意见阶段
        - 投资前须承诺积极跟踪；作为任何提款分期的先决条件
        - 建立针对 MoRTH 与劳工部公报的监测机制以支持投后管理
        - 高
    notes: >-
      优先级评估反映投资委员会做出无条件批准的硬性要求。关键项构成投资决策的前置障碍；高优先级项应在最终交割前予以解决；中优先级项用于指导后续投后管理。所有数据诉求均针对非公开数据室权限，应由 CFO
      及法律顾问借助正式尽职调查渠道提出索取。
