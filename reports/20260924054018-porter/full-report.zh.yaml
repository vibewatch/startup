      - number: '3.5'
        title: 护城河韧性、同质化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Porter 的核心护城河——供给密度、中小微企业信任度、GST
              合规基础设施以及长达十年的运营先行优势——在未来三年窗口期内具备强韧防守性，但也暴露出需要持续跟踪监测的潜在风险点。运力供给密度是最难以短期跨越的护城河：累计 1.2 million
              名入驻司机合作伙伴凝聚了整整十年的获客与维系投入，复制这一生态需耗资数亿美元并经历漫长的时间沉淀。中小微企业信任壁垒则被结构性的 GST 税务合规技术所巩固，这是传统非正规中介在制度上无法逾越的鸿沟，也是
              Lalamove 与 Blowhorn 尚未在全印范围规模化复刻的软实力。Porter 在 2025 财年斩获 ₹55 crore 净利润——这是目前所有已具名的印度同城 LCV
              直面竞争对手均未公开达成的财务转正里程碑——提升了 Porter 的资金效率，也增强了其维持价格纪律的能力。最深层的同质化威胁来自非正规市场走向正规化的压力：若 GST
              执法促使中介网络数字化，它们可能与技术平台合作，或加剧司机招募竞争。反向证据主要是 TGPWU 零工工会的指控，以及 BHRRC 2025 年 7 月报告中关于 Porter
              工作条件、超载安全隐患和不公平停用司机账号的记录。若印度《Code on Social Security 2025》全面落地，强制征收平台零工养老金及工伤意外险，Porter
              的用工成本可能面临实质性推高，直接挤压利润空间，并在客观上拉平与合规薄弱的小竞对之间的成本差距。2025 年 7 月，印度竞争委员会（CCI）无附加条件地正式核准了 Porter 的 F
              轮投资架构，化解了眼前的反垄断反不正当竞争审查阻力，但零工劳工政策走向及 TGPWU 的持续发难仍构成尽调阶段不可忽视的风险源。Delhivery
              雄厚的现金储备与底层物流技术，构成长期最具威胁的潜在平台级跨界对手，虽然当下尚未显露大举切入同城轻型商用车的具体战略部署，但凭借其在各大城市的现有仓配网点和深厚的干线运力车队资源，在技术和基础设施上完全具备跨界可行性。Porter
              制定了在 2026 年覆盖 39 个以上城市、到 2030 年进驻 50
              个城市的扩张路线图，其战略实质正是抢在资本充裕的竞争对手立足未稳前，将自身的运力网络密度护城河提前卡位至广阔的二线与三线中小微企业增量腹地。
