        title: 图表与佐证
        blocks:
          - type: callout
            title: 未披露具名客户：实质性尽调空白
            body: >
              截至 2026 年 5 月，Porter 从未在任何公开渠道披露过任何具名企业或中小微企业客户、客户成效案例或基于业务结果的标杆客户参考。虽然这与其面向 C
              端的交易型物流模式相符，但也意味着合同持续性、企业端采纳深度、客户集中度以及同期群留存率在公开信息中完全无法核验。任何潜在投资者或收购方在对客户质量和合作粘性形成判断之前，必须要求调取客户维度的尽调虚拟数据室，审查前
