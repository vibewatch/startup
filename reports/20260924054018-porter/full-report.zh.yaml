      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Porter（2025 财年营收达 ₹4,339 crore，实现净利润 ₹55 crore，在 2025 年 5 月 F 轮融资中估值达 $1.2 billion）是业内领先的正规化龙头，覆盖 22+
              个城市，累计吸纳 1.2 million
              名司机合作伙伴，业务深耕中小微企业并涵盖轻型商用车（LCV）、两轮车、微型卡车及搬家货运等全矩阵服务。Lalamove（香港联交所代码：2082）是一家在亚太上市、获顶级机构注资的对标企业，在印度深耕孟买、德里、班加罗尔和钦奈四大核心都会区，运营着相似的按需调用
              LCV 及面包车平台；其印度专属财务数据未公开披露。Blowhorn 是一家完成 B 轮融资的同城 LCV 平台，主要聚焦印度南部和西部区域，累计融资金额约为 $15 million 左右——仅占 Porter
              $1.2 billion 估值的极小零头——显著制约了其竞争纵深与全国扩张野心。Shadowfax（2025 财年营收约 ₹1,750 crore；于 2025 年 4 月向 SEBI 递交 IPO
              招股书，拟募资 ₹2,000 crore）本质上是一家最后一公里电商快递履约平台，在 500 个以上城市拥有 300,000 名以上配送合作伙伴；其按单件快件追求极速履约的运营机制，与 Porter
              的大件商用车货运体系在底层逻辑上并不重叠。Delhivery（2025 财年营收达 ₹8,931 crore；在 BSE 上市，市值约 $4–5 billion）是印度规模最大的综合性纯物流企业，在 B2B
              零担干线快运与地面大件物流领域占据绝对统治地位，覆盖超过 18,000 个邮编区域并自持超 24 million 平方英尺仓储面积；其旗下 Delhivery Direct
              虽略有同城配送能力，但未被列为核心战略攻坚方向。Shiprocket（估值 $1.2 billion，2025 财年营收约 ₹1,670 crore）属于面向中小企业的快递物流聚合分发中台，与 Porter
              自建运力调度不同，该平台纯粹将包裹路由给第三方快递网络。未被正规化纳入统计的传统中介网络——尽管不具备技术属性——仍凭借深厚的民间地缘关系掌控着约 70%
              的同城货运吞吐量，构成了中小微企业在寻求低成本运输时的核心线下替代手段。
