  - id: FV002
    title: Porter 估值情景评分矩阵
    type: matrix
    summary: >-
      在乐观、基准和悲观情景下，评估 Porter
      五个投资维度的评分矩阵。得分为定性评估，反映各维度对整体投资逻辑贡献的方向与幅度。矩阵明确指出：无论其他维度表现如何，监管风险是唯一能够将整体投资逻辑从「强劲」转为「受损」的独立维度。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV018
      - CV019
      - CV043
      - CV041
    data:
      columns:
        - 收入增长
        - 运营杠杆
        - 监管风险
        - 退出路径
        - 整体投资逻辑
      rows:
        - label: 乐观情景
          values:
            - 高 — 50% CAGR 持续
            - 高 — 可变成本结构保持稳定
            - 低风险 — 无监管通告
            - 高 — IPO FY27–28，估值 $2B+
            - 强劲 — 1.6–2.1× 回报
          note: 五个维度全部正向契合。需要同时满足监管不干预与成功拓展至 50 座城市。概率：25–30%。
        - label: 基准情景
          values:
            - 中 — 40% CAGR
            - 中 — 局部监管压力
            - 中 — 一项法规通知发布
            - 中 — IPO 或 PE 老股转让
            - 可接受 — 1.2–1.5× 回报
          note: 最可能出现的结果。收入增速放缓，但 EBITDA 利润率温和扩张。一项监管法规通告出台，但两项不会同时触发。概率：50–55%。
        - label: 悲观情景
          values:
            - 低 — 25% CAGR；需求受扰动
            - 负面 — 双重冲击压缩利润率
            - 严重 — 两项法规均发布通告
            - 受限 — IPO 延迟或以低于入场价并购出售
            - 受损 — 低于 $1.2B 入场价格
          note: 双重监管冲击在 24 个月内兑现。冲击第 1 年 EBITDA 转负。以 $1.2B 入场存在资本减损风险。概率：20–25%。
  - id: FV003
    title: Porter 隐含估值敏感性区间
    type: range
    summary: >-
      以百万美元计，在悲观、基准和乐观情景下的企业价值区间。区间反映收入 CAGR、EBITDA 利润率表现以及相对于 $1.2B Series F 入场点的 EV/Revenue
      倍数压缩或扩张的相互作用。悲观情景区间（$700–1,000M）低于 Series F 入场价，提示在发生概率预估为 20–25% 的双重监管冲击情景下存在资本减损风险。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV043
    data:
      items:
        - label: 悲观情景（双重监管冲击）
          low: 700
          high: 1000
          note: MV 聚合商抽佣率上限加上《社会保障法典》零工成本；至 FY28 收入 CAGR 为 25%；1.5–2.0× EV/Revenue；低于 $1.2B Series F 入场价。存在资本减损风险。
        - label: 基准情景（$1.2B 入场点）
          low: 1400
          high: 1800
          note: 至 FY28 收入 CAGR 为 40%；监管环境稳定；2.5–3.0× EV/Revenue；与 Delhivery 可比倍数一致。Series F 入场带来 1.2–1.5× 回报。
        - label: 乐观情景（IPO 溢价）
          low: 1900
          high: 2500
          note: 至 FY28 收入 CAGR 为 50%；IPO 重新估值；企业客群占比提升带动 EBITDA 达 8–10%；3.5–4.0× EV/Revenue；$1.2B 入场在 3 年内带来 1.6–2.1× 回报。
  - id: FV004
    title: Porter 融资与估值里程碑时间线
    type: timeline
    summary: >-
      按时间顺序梳理 Porter 自 2014 年创立至 2025 年 5 月 Series F 独角兽轮的融资里程碑，展示资本部署节奏、估值跃升，以及随着 Porter
      逼近盈利并达成首个盈利财年里程碑，资本构成从风险投资向机构资本的转变。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV026
      - CV027
    data:
      items:
        - label: 在班加罗尔创立
          value: '2014'
          note: Porter 于 2014 年在班加罗尔创立；最初专注于利用佣金制撮合平台模式，为 MSME 和个人消费者提供技术赋能的同城物流服务。
        - label: Series A — $20M
          value: '2019'
          note: Sequoia Capital India 与 Kalaari Capital 领投 Series A；Porter 拓展至孟买和 Delhi-NCR；开启以 MSME 为核心的商业车队平台定位。
        - label: Series B/C — 约 $70M (2020–2021)
          value: '2021'
          note: Tiger Global 与 Vitruvian Partners 加入；支持快速城市扩张；COVID 加速了 MSME 从非正规替代方案向有组织同城物流的采纳步伐。
        - label: Series D/E — 约 $160M (2022–2023)
          value: '2023'
          note: LightSpeed India 领投 Series E；Porter 聚焦单位经济模型改善与盈利路径；收入自 ₹1,754 Cr（FY23）增至 ₹2,734 Cr（FY24），同比增长 56%。
        - label: Series F — $200M @ $1.2B（独角兽）
          value: '2025'
          note: >-
            Kedaara Capital 与 Wellington Management 联合领投；投后估值 $1.2B；Porter 首个合并报表盈利年（FY25 净利润 ₹55 Cr）；CCI 于 2025 年 1
            月批准；获得独角兽地位。
