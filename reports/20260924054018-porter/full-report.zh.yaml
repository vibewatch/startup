      - number: '4.2'
        title: 成本结构、毛利率与营运资金
        blocks:
          - type: paragraph
            body: >-
              Porter 的成本构成中占据绝对主导地位的是车队运营商支出——即就已完成行程向司机合作伙伴支付的履约运费分成——该项支出占 FY25 总成本费用的 82.8%，在约 ~₹4,284 crore
              的总支出中消耗了约 ₹3,660–3,679 crore。这一费用集中度在业务结构上构成了得天独厚的优势：车队履约成本为完全可变成本（仅在行程履约成功后才予结算），因此在市场需求面临下行冲击时，Porter
              无需承担任何闲置车队的固定折旧或运营摊销。这种完全可变成本架构正是 Porter 释放经营杠杆效应的基石，有力解释了为何在规模化后期，相对温和的营业收入增速便能超比例撬动巨额的盈利跃升。

              员工薪酬开支约为 ₹285 crore（占总费用的 ~6.5%），覆盖技术研发、地面运营、渠道拓展及大客户账户管理团队。技术体系及平台基础设施年化开支预估在 ~₹150 crore
              左右，主要用于云端服务器算力托管、派单分发算法迭代、移动端 App 架构开发及实时 GPS 物联车载通信。销售、行政与一般管理费用（SG&A，包含品牌市场投放）预估约为 ~₹100–150
              crore。上述固定与半固定管理费用池（预估总计在 ~₹535–585
              crore）构成了必须依靠毛利润覆盖的运营刚性底座。随着订单吞吐规模呈几何级扩张，这部分固定开支占营业收入的比重被迅速摊薄，直接驱动公司实现从 FY24 净亏损 ₹95.7 crore 到 FY25 财年净利润
              ₹55 crore 的跨越式反转。

              毛利率（定义为：[营业收入 - 车队运营商分成] / 营业收入）在 FY25 测算约为
              17–20%。该水准虽显温和，但完全符合双边平台在释放经营杠杆初期的典型特征；后续毛利率扩张的首要杠杆在于订单结构的持续优化——向客单价更高、绝对佣金留存额相较司机分成更为丰厚的高毛利中小微企业订单及高运力车型倾斜。营运资金运行状态极为优良：Porter
              通过 App
              线上支付或数字钱包在行程完成前后即时向货主全额收取运费，而对车队运营商则采用按固定结算周期打款的机制，从而沉淀出健康的短周期营运现金流正向浮存（Float）。平台不持有一切实体库存，在公开申报中亦未表现出任何账龄恶化应收账款问题。资本性支出极低：Porter
              自身并不自持任何运营车辆（司机合作伙伴需自行出资购车或通过外部机构贷款），因此完全摆脱了沉重的车队重资产购置开支负担。其平台及底层技术基础设施的资本化支出已全额消化在上文估算的技术研发运维成本之中。
