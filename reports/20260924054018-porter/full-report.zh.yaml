  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >
              Porter 依托移动优先的双边平台，提供即时与预约式同城货运服务。标准业务闭环始于客户（MSME、企业或个人）打开 Porter 移动端应用或网页端平台，选择车型（LCV 微卡、三轮货车
              tempo、两轮车或三轮车），设定取送货地点（支持多点停靠），并在确认下单前获取系统预估运费。随后系统运行派单算法，综合考量距离、车型与司机空闲状态，实时指派可接单的合作司机。派单完成后，客户利用 GPS
              实时追踪车辆位置并查看预计到达时间（ETA），并在行程结束后完成线上支付（接入 UPI/Razorpay/Paytm）。面向 MSME 客户，Porter 会自动生成符合 GST
              税制的合规发票与电子签收单据（POD）。

              Porter 提供五大主力车型：(1) 两轮摩托车（bikes），用于配送包裹和小件货物；(2) 三轮货车（auto/tempo），用于中等负荷运输；(3) 微型 LCV（Tata Ace 级别，额定载重约
              750 kg）；(4) 中型 LCV（Mahindra Supro/Bolero 皮卡，额定载重约 1.5 t）；(5) 大型 LCV（额定载重 2–4 t）。这些运力配置精准契合了 MSME
              货运常见的货量梯度。此外，Porter 还面向需要高频或大宗运力支持的企业客户提供预约制或合同制车队服务。

              客户工作流紧扣 MSME 痛点深度定制：GST 发票开具、多点停靠行程（单次行程覆盖多个取送货点）、面向企业平台的 API 接口集成，以及用于应收账款对账核销的数字化 POD。个人消费者使用 Porter
              主要用于搬家及大件货品运输。Porter 来自货物运输的收入占比高达 99%（而非增值服务或纯 SaaS 软件收入），印证了产品功能设计与物流承运场景之间的高度契合。
