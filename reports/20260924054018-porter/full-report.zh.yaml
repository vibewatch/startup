      - number: '6.4'
        title: 留存率、复购使用与满意度
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Porter 从未在任何公开文件、媒体采访或投资人沟通中披露过净金额留存率（NRR）、毛金额留存率（GRR）、同期群流失率或续约率数据。这一数据的缺失，是 Porter
              客户故事中最关键的无法验证维度。然而，多项间接指标表明其具有结构性的高频复购特征。第一，中小微企业的物流需求天然具备高复购性：按天或按周使用 Porter 运送货物的小型制造商或贸易商，很难找到同等替代品，能在
              Porter 覆盖的地理跨度与车型广度上，同时兼具即时叫车、实时追踪与同城 LCV 运力供给。第二，FY25 营收在 FY24 的庞大基数上同比增长
              57%，意味着客户留存水平至少足以在结合新客拓展的情况下支撑该等规模的净扩张。第三，Google Play 4.1/5
              的评分保持平稳，表明未出现因产品体验恶化或系统性服务崩溃引发的群体性流失。第四，向合作司机发放的毛分成支出与营收增长高度吻合，证实业务扩张源于真实的交易体量。与这些正面信号相对的是，2025
              年特伦甘纳邦零工工会（TGPWU）就海得拉巴不合理封号提出的申诉，暴露了潜在的供给侧不稳定隐患，未来可能传导为客户服务品质滑坡。中小微企业对价格高度敏感——估计运费差额达 5–10%
              即可触发服务商切换——表明客户忠诚度主要依附于运营履约可靠性与价格竞争力，而非强大的转换成本壁垒。若无法从尽职调查虚拟数据室（data room）获取 NPS、CSAT 或同期群留存数据，外界无法独立验证
              Porter 客户关系的稳固程度。
