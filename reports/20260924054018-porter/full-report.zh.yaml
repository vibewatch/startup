  - id: TP001
    title: 竞争对手概况表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the seven most significant competitive entities in India's intra-city logistics market — the three
        organized LCV tech platforms (Porter, Lalamove, Blowhorn), two adjacent platforms (Shadowfax, Delhivery), one
        SME aggregator (Shiprocket), and the unorganized broker segment. Regional micro-logistics startups with
        negligible GMV and no public funding records are excluded; their omission does not materially affect the
        competitive assessment.
    columns:
      - 竞争对手
      - 类别
      - FY25 收入／规模
      - 估值／融资
      - 目标细分市场
      - 核心服务
      - 印度城市覆盖
      - 相较 Porter 的差异化
      - 主要局限
    rows:
      - - Porter（研究标的）
        - 有组织城内 LCV 平台 —— 市场领导者
        - FY25 营收 ₹4,339 crore；净利润 ₹55 crore
        - $1.2B（Series F，2025 年 5 月）；累计融资 ~$350M+
        - MSME 约 60–65%，个人约 20–25%，企业约 10–15%
        - 按需 LCV、两轮车、小型货车、居家搬迁、企业车队
        - 印度 22+ 城市 + UAE
        - 标杆 —— GST 合规、供给密度、MSME 信任度、10 年先发优势
        - 零工群体负面指控（TGPWU、BHRRC 2025 年 7 月）；监管合规成本风险
      - - Lalamove
        - 有组织城内 LCV 平台 —— 直接竞争对手
        - 未披露（印度单独数据）；全球收入体量可观（港交所上市）
        - '港交所上市（HKEx: 2082）；机构支持；印度融资未披露'
        - 一线城市的小型企业与个人混合客群
        - 按需 LCV、厢式货车、摩托车配送 —— 聚焦一线城市
        - 4 个一线城市（Mumbai、Delhi、Bangalore、Chennai）
        - 具备全球打法、机构资本、核心 LCV 调度技术能力相当
        - 印度布局较小；缺少 MSME 专属合规工具；司机密度偏低
      - - Blowhorn
        - 有组织城内 LCV 平台 —— 直接竞争对手（较小体量）
        - 未披露；估计 GMV 不足 ₹500 crore
        - 累计融资 ~$15M+（Series B）；体量远小于 Porter
        - 聚焦 MSME；主打印度南部与西部
        - 按需 LCV、小型货车 —— 区域化深耕
        - 不足 10 个城市（主要在印度南部与西部）
        - MSME 定位与 Porter 高度重叠；拥有区域品牌认知
        - 较 Porter 融资差距大；规模受限；企业级服务能力不足
      - - Shadowfax
        - 邻近赛道 —— 最后一公里电商快递
        - FY25 约 ₹1,750 crore；300K+ 配送合作伙伴；500+ 城市
        - 估值 ~$750–860M；2025 年 4 月递交 IPO DRHP（募资目标 ₹2,000 crore）
        - D2C 与电商品牌；最后一公里包裹配送
        - 最后一公里快递配送（包裹，非 LCV 货运）
        - 500+ 城市（最后一公里包裹网络）
        - 包裹配送规模优势；电商对接能力强；IPO 级治理水平
        - 业务模式存在结构性差异（快递 vs LCV）；MSME 货运拓展有限
      - - Delhivery
        - 邻近赛道 —— B2B 快运与陆运物流
        - FY25 营收 ₹8,931 crore；18,000+ 邮政编码；24M+ sq ft 仓储
        - 市值 ~$4–5B（BSE 上市）；累计融资 ~$1.5B+
        - 企业与 B2B 发货方；电商履约
        - B2B 快运、陆运、履约；Delhivery Direct（轻量城内业务）
        - 18,000+ 邮政编码（城际）；城内 LCV 业务微乎其微
        - 规模体量庞大、资金实力雄厚、技术基建完善；最具可信度的潜在跨界威胁
        - 城内 LCV 非当前重点；买家画像与 Porter 的 MSME 客群差异明显
      - - Shiprocket
        - 邻近赛道 —— SME 快递聚合平台
        - FY25 约 ₹1,670 crore；估值 $1.2B（Series E，2021 年 $185M）
        - 估值 $1.2B；Series E 融资 $185M
        - SME 发货方（包裹与电商）；非货运 MSME
        - SME 快递聚合 —— 通过第三方承运商分流包裹
        - 200+ 城市（通过聚合承运商网络）
        - 在 SME 中品牌认知度高；承运商网络覆盖广
        - 模式不同（聚合而非调度）；侧重包裹而非 LCV 货物
      - - 非正规中介
        - 现状 —— 存量替代
        - 约占印度城内物流货运量的 70%（估计 GMV 达 ₹1.5–2L crore）
        - 无正规融资；个体运营者高度分散
        - 价格敏感型 MSME 与个人；非正规 B2B 物流
        - 电话／人际网络式货车调度 —— 无数字化平台
        - 全国覆盖（碎片化、超本地化）
        - 关系盘根错节；零平台抽佣；感知成本更低
        - 无 GST 合规；无法追踪；履约不可靠；无法随正规化进程做大规模
    notes: >-
      Lalamove 印度与 Blowhorn 的收入／估值数据未公开披露；估算源自分析师报告及已知融资轮次。Delhivery 和 Shadowfax 的数据来自已披露财报及 SEBI
      申报文件。非正规中介市场规模系分析师估算（Redseer、Mordor Intelligence），并非经审计数据。Porter 仅列入作为对比锚点。
