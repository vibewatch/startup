      - number: '5.6'
        title: 图表与附录
        blocks:
          - type: callout
            title: 零工合规成本或将吞噬 FY25 净利润
            body: >-
              两股合流的监管逆风正严重威胁 Porter 在 FY25 取得的 ₹55 crore 合并净利润：(1) 印度《Code on Social Security 2020》（定于 2025 年 11
              月生效）强制要求企业按年营业额的 1–2% 向零工保障基金缴纳供款——按 FY25 营收规模测算相当于 ₹43–87 crore；(2)《Motor Vehicle Aggregator Guidelines
              2025》可能将佣金比例上限限制在 10–15%，从而直接压缩 Porter 目前 14–16%（部分场景高达 30%）的实际抽成率。与此同时，TGPWU 的公开指控使 Porter
              在核心枢纽市场（海得拉巴/特伦甘纳邦）面临声誉与实际运营风险。从合规成本测算来看，若缺乏强劲的营收增长来消化这些新增刚性法定义务，其账面盈利更显脆弱而非持久稳固。
            calloutType: insight
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE023
          - type: callout
            title: 技术核验空白：缺乏公开 API 文档与工程性能基准
            body: >-
              Porter 宣传的产品技术特性——微服务架构、智能派单引擎、AI 驱动的预计到达时间（ETA）预测算法以及 MapMyIndia
              地图集成——主要来自公司官方营销资料与新闻通稿自述，缺乏独立的第三方技术核验。不同于已公布详尽技术架构文档的同行 Delhivery，Porter 既没有公开的工程技术博客，也未贡献开源项目，更没有发布任何对外
              API 参考文档或 SLA 服务可用性承诺指标。这是一项实质性的尽调空白：仅凭公开信息，外界无法独立验证 Porter 核心派单与路径算法的技术先进度及技术壁垒厚度。
