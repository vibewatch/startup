  - id: FP003
    title: 护城河与就绪度关键指标
    type: kpi
    summary: 精选 5 项核心 KPI 展示 Porter 在 FY25 的竞争护城河就绪度，并在有公开数据处与具名竞手做基准对比。在同城 LCV 同行中，Porter 在所有量化维度上均保持领先；零工风险指数则是最主要的反向信号。
    data:
      items:
        - label: 司机合作伙伴网络（累计入驻规模）
          value: 1.2 million
          detail: 行业基准：Lalamove India 未披露（预估 <100K）；Blowhorn 未披露（预估 <50K）。Porter 历时 10 年的供给端投入构成了其最核心的护城河。
        - label: 活跃城市覆盖（印度）
          value: 22+ cities
          detail: 行业基准：Lalamove India 覆盖 4 个特大城市；Blowhorn 覆盖 <10 个城市。Porter 目标到 2026 年覆盖 39+ 个城市，到 2030 年拓展至 50 个。
        - label: FY25 收入（货运业务）
          value: ₹4,339 crore (~$515M)
          detail: 行业基准：尚无直接同城 LCV 竞手披露印度本土专属收入。Porter 较 FY24 的 ₹2,734 crore 同比增长 57%。
        - label: FY25 净利润
          value: ₹55 crore — first profitable year
          detail: 行业基准：尚无具名直接 LCV 竞手实现公开盈利。实现盈利降低了对外部资本的依赖，使其能持续维持具竞争力的定价。
        - label: 零工风险指数
          value: Elevated — TGPWU/BHRRC allegations active (July 2025)
          detail: 行业基准：Lalamove India——未见对等的公开负面指控。该指标构成最主要的反向竞争风险；监管合规成本敞口待定（TBD）。
    approximationNotes: 竞手司机数量与收入基准均为估算值或未公开披露。零工风险指数系基于公开报道（TGPWU、BHRRC 2025 年 7 月）的定性评估，并非数值评分。
