  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体细分
        blocks:
          - type: paragraph
            body: >
              Porter
              服务于五类清晰可辨的客户群体，各群体在买家类型、应用场景、叫车频次及对平台的战略价值上各有不同。首要且体量最大的群体是中小微企业（MSME）——涵盖小型制造商、贸易商、零售商和分销商，这类客户按日或按周预订轻型商用车（LCV）或微型卡车，在同城内的仓库、供应商与终端客户之间转运货物。该群体复购频次最高；基于市场结构分析估计，其贡献了
              Porter FY25 4,339 亿卢比（₹4,339 crore）营收的 60–70%，不过公司未披露任何分部维度的拆分数据。个人消费者构成第二大群体，使用 Porter
              进行搬家、大件家电配送及单次货运；叫车频次偏低，且面临来自非正规货运部门（独立个体卡车司机）的激烈竞争。企业与 B2B 客户代表正在崛起的第三大客群：较大型企业通过接入 Porter Business
              API，获取合同制车队服务、供应链物流及多点配送路线规划支持。第四类群体涵盖电商履约商家——中小型网店卖家与电商平台入驻商户使用 Porter
              完成不适于标准快递网络运输的大件或易碎品末端配送。第五类新兴客群是三方物流（3PL）与白标物流合作伙伴，将 Porter
              的车队运力直接嵌入自身平台。地域分布上，大本营班加罗尔（Bengaluru）为最大市场，其次是孟买（Mumbai）、德里国家首都辖区（Delhi-NCR）、海得拉巴（Hyderabad）、金奈（Chennai）、加尔各答（Kolkata）和浦那（Pune）；另有
              14 座二线城市完善了其覆盖全印 22 城的业务版图。2024 年公司开辟阿联酋（UAE）市场，作为独立的国际化布局。公司官方尚未发布任何正式的地域营收细分数据。
