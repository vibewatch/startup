      - number: '1.5'
        title: 业务规模、关键里程碑与负面事件
        blocks:
          - type: paragraph
            body: >
              从 2014 年立足班加罗尔的本土物流初创公司，成长为覆盖全印度的独角兽企业，Porter 展现了长达十年的规模复利效应。截至 2025 年 5 月的核心规模指标：覆盖 22+
              个印度城市并进军阿联酋；累计入驻司机合作伙伴达 1.2 million 名；全职员工约 2,715 人（2025 年 2 月）；2025 财年合并营收达 ₹4,306–4,339
              crore。公司公布了雄心勃勃的扩张规划：进驻卡利卡特、蒂鲁普尔和拉杰果德（2025–26 年）；开拓 8
              个以中小微企业为主的城市（迈索尔、马杜赖、贾巴尔普尔、瓜廖尔、密拉特、阿格拉、奥兰加巴德、德里久尔），预计为司机合作伙伴创造 64,000 个新增就业岗位；并设立了到 2030 年覆盖 50 个城市的发展目标。

              财务里程碑：历经多年经营性亏损后，Porter 在 FY25 实现合并口径扭亏为盈，录得净利润 ₹55 crore（独立主体净利润 ₹131 crore），EBITDA 转正达 ~₹48 crore（FY24
              财年为 -₹112 crore）。营收从 FY23 的 ₹1,753.8 crore 增长至 FY24 的 ₹2,734 crore（同比增长 56%），并在 FY25 攀升至 ₹4,306–4,339
              crore（同比增长 57%）。

              负面事件与 ESG 风险：2025 年，零工劳工工会——尤其是 Telangana Gig and Platform Workers Union（TGPWU）——公开抨击 Porter
              海得拉巴平台存在剥削性用工条件、不公正封禁账号以及司机合作伙伴申诉机制缺失等问题。Times of India、The Hans India 以及 Business and Human Rights
              Resource Centre 对此进行了广泛报道。工会要求制定每公里费率标准、出台取消费用保障机制并建立正式申诉渠道。鉴于印度即将推行《Code on Social Security 2020》（2025 年
              11 月生效，要求平台企业向零工社会保障基金缴纳年营业额的 1–2%）以及《Motor Vehicle Aggregator Guidelines
              2025》（强制要求最低收入保障、佣金上限及法定保险），上述劳工问题带来了实质性的监管合规挑战。
