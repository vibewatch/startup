      - number: '7.2'
        title: 运营与平台风险
        blocks:
          - type: paragraph
            body: >
              Porter 的运营风险画像既折射出双边撮合平台的固有复杂性，也反映出激进地域扩张带来的执行压力。短期内最尖锐的运营风险在于司机运力供给中断。在累计入驻 1.2 million（120
              万）名合作司机却未公布同时在线活跃司机规模的情况下，任何协同停工、全市范围抵制或群体性司机流失，都会重创受波及城市的订单履约率。海得拉巴特伦甘纳邦零工工会（TGPWU）的维权先例表明，此类工会集体行动具备现实可能性，绝非空穴来风。Porter
              尚未公开披露任何旨在降低群体性停工风险的司机申诉处理机制、监察专员职能或系统性福利方案。

              跨城扩张的执行风险同样严峻。Porter 计划在现有 22 城市版图基础上，到 2030 年将覆盖拓展至 50 座城市——即在约五年内净增 28
              座城市。开拓每座新城市，都需要同步推进司机运力招募、本地运营基建落地、获客以及需求聚合，且须在合理的投资回报期内达到业务临界规模。Porter
              从未披露单城单位经济效益、新开城市实现盈利的平均周期或单城资金需求。现有的 22 座城市既包含竞争白热化的一线核心都会区（面临 Shadowfax、Lalamove 和 Loadshare
              的正面狙击），也包含非正规车队占统治地位且价格敏感度极高的二线市场。

              由于 Porter 为时效敏感型中小微企业配送提供实时调度撮合，平台稳定性风险在结构上处于高位。官方未对外公布平台可用性、调度延迟或订单履约率的服务等级协议（SLA）。Porter
              亦未披露任何灾难恢复（DR）或业务连续性计划（BCP）。一旦派单引擎在上午或下午的配送高峰时段发生重大宕机，将直接导致严重依赖 Porter
              作为主力物流提供商的中小微企业遭遇大面积履约失败。次级运营风险包括司机恶意刷单与虚假 GPS 定位、虚假叫车、司机接单后擅自取消以及客户失联等欺诈与履约瑕疵。Porter 在 Google Play
              上的应用评分为 4.1/5，下载量超 1M+ 次，部分用户评论直指司机频繁取消订单及预计到达时间（ETA）偏差——印证了这类欺诈与可靠性缺陷绝非纸上谈兵。

              Porter 于 2024
              年启动的阿联酋业务拓展，引入了跨境监管与跨国运营风险。阿联酋运输法规与印度存在实质性差异；当地市场需要获取独立的平台经营牌照，在不同的劳工法律框架下完成司机入驻，并搭建本地化支付基建。截至 2026 年 5
              月，公司尚未披露任何阿联酋市场的具体展业数据（订单量、营收或司机规模）。
