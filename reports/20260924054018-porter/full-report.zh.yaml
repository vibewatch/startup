      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              根据 Mordor Intelligence 测算，2025 年印度同城物流市场 TAM 约为 $33.5 billion，预计到 2031 年将以 4.2–5% 的复合年增长率（CAGR）增至 $43
              billion。该口径涵盖所有车型、正规与非正规渠道的全部同城货运业务。Shadowfax 发布的 2025 年第三方物流（3PL）行业报告显示，印度第三方物流整体市场规模约为 $25–30
              billion，其中同城物流是占比最大的子赛道。

              测算分层体系：TAM 口径囊括了依托商用车执行的所有同城货运交易，规模为 $33.5 billion。针对具备线上化、技术赋能特征的平台型玩家，测算保守的 SAM（可服务市场）需剔除无法数字化改造的场景（目前仅约
              30% 的市场已实现正规化），仅保留适合 App 叫车模式的有效业务——按当前渗透率测算，SAM 约为 $8–10 billion。Porter 在当前布局的 22 个城市所对应的
              SOM（可获取市场）则是该基数的进一步细分；若以 Porter 2025 财年录得的 ₹4,339 crore 营收（约合 $515M）作为年化运行速度（run-rate），Porter 在其对应 SAM
              中的市场份额大致为 5–6%，无论在深度（现有城市渗透率提升）还是广度（开拓增量城市）上均具备可观的增长空间。

              核心测算前提说明：Mordor Intelligence 给出的 $33.5 billion 数据采用了宽泛的市场定义，将所有商用 LCV 货运均计入在内，并未考量其是否由平台驱动。Redseer 报告（2024
              年）指出，正规化物流仅占整体市场的约 30%，其余 70% 仍处于非正规中介主导状态。鉴于 Porter 仅从正规化/平台赋能的交易中抽取佣金，其真实的 TAM
              明显小于上述公开统计口径。考虑到印度中小微企业数字化转型正加速推动物流市场由非正规向正规化演进，4.2–5% 的预测复合增速相对保守。
