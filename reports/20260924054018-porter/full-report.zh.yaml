      - number: '4.4'
        title: 资本充裕度与外部融资依赖
        blocks:
          - type: paragraph
            body: >-
              2025 年 5 月，Porter 完成了由 Kedaara Capital 与 Wellington Management 联合领投的 $200 million F 轮融资，投后估值达 $1.2
              billion，为其跨区域扩张战略储备了极其充裕的资金弹药。本轮融资同时伴随 Peak XV Partners（前身为 Sequoia India）与 Kae Capital
              的老股转让退出，印证了这属于早期投资人的正常分红变现行为，而非被迫折价纾困转让。印度竞争委员会（CCI）于 2025 年 7 月 8 日正式核准了 Kedaara Capital
              的股权收购申请，确认股权交割已完成监管审批。纵观其历史融资轨迹，从种子轮到 F 轮，Porter 历经约 7 轮股权融资累计吸纳资金约 $400+ million，历史知名投资方囊括 Tiger
              Global、Lightrock（前身为 LGT Impact）以及 Vitruvian Partners
              等。按轮次推进的完整投资人名册及具体日期详见第一章（公司概况）；本财务章节仅对资本充裕度评估具备实质性影响的客观事实独立形成研判主张。

              F 轮融资交割后公司账面持有的确切现金储备未对外公开；然而，鉴于 Porter 在 FY25 已实现合并口径盈利（录得净利润 ₹55
              crore），公司日常经营已彻底告别依靠股权现金流补贴失血的阶段。在实现盈利拐点前，FY24 净亏损额为 ₹95.7 crore——以该年化亏损速度测算，即便在未获得 F
              轮注资之前，公司既有账面流动性亦足以支撑数年运营消耗。随着经营性造血转正，本次 $200M 新筹资金主要用于进攻性增长项目的落地，而非维持日常运营消耗。公司公开信息中未见任何长期负债记录；Porter
              轻资产运作的双边平台模式（车辆资产全额归司机合作伙伴自有）使其免于承担任何车队融资带来的重资产偿债刚性负担。

              F 轮募集资金的既定投向主要聚焦四大方向：（1）加速推进全国化版图扩张，计划从 2025 年中的 22+ 个城市增加至 2030 年覆盖 50 个城市；（2）加码数字化技术底座研发，包括基于 AI
              的智能派单中台与实时动态路径算法优化；（3）在《Code on Social Security
              2025》全面落实前夕，前瞻性设立司机合作伙伴福利保障基金与平台安全防护基础设施；以及（4）布局国际化蓝海，以已开展业务的阿联酋为桥头堡，稳妥向更多海外增量市场辐射试水。公司的资本充裕度处于极为坚实的状态：经营性业务已稳定盈利、无任何自有车队固定资本开支拖累、无公开抵押借款负担，加之账面新注入的
              $200M 现金，共同筑牢了一张足以支撑未来 3–5 年激进扩张周期的资产负债表。未来潜在的融资依赖风险主要系于《CSS
              2025》社保法案落地情况——该政策可能强制要求平台按比例为零工承担社保缴费义务，从而在客观上将原本完全可变的车队运力结算成本，部分刚性固化为法定的固定经营支出。
