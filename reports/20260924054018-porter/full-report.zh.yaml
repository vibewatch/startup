      - number: '8.4'
        title: 可比公司估值对标
        blocks:
          - type: paragraph
            body: >-
              外部估值框架主要锚定三家可比公司。Delhivery（NSE: DELHIVERY）是核心的印度本土上市可比标的：作为 B2B 快递物流平台，其 FY25 营收约为 ₹8,931 crore，截至 2026 年
              5 月市值约为 ₹29,000–31,000 crore，对应公开市场 EV/Revenue 约为 3.0–3.5 倍。Delhivery 相对于 Porter 2.8
              倍入局倍数的溢价，反映二级市场流动性溢价与更大的业务规模；但 Delhivery 仍处于 EBITDA 亏损状态，按理应折价而非享有相对溢价。Porter 迈入首个盈利年份且营收增速更高（57% 对比
              Delhivery 的约 15–20%），足以支撑可比甚至更优的估值倍数，为 12 亿美元（$1.2b）估值提供支撑。

              Shadowfax Technologies 是次要的印度本土非上市可比标的：作为即时末端配送物流运营商，其 FY25 营收约为 ₹1,750 crore，约占 Porter 业务体量的 40%；其拟 IPO
              阶段隐含估值为 4–5 亿美元（$400–500m），对应约 1.6–2.0 倍 EV/Revenue。Shadowfax 所处细分赛道不同（末端 C 端配送对比 Porter 的同城 B2B MSME
              物流），因而估值折价具有一定结构性。尽管如此，这确立了估值下限：营收 ₹1,750 crore 且未盈利的印度非上市物流平台估值约为 2 倍 EV/Revenue，表明 Porter 以 12 亿美元估值对应
              ₹4,339 crore 营收（且已实现盈利），在经过规模调整后估值倍数大体相当，属于合理锚点（Porter $1.2b 入场估值）。

              Lalamove（HKEX: 2348）是跨市场 GMV 可比标的。Lalamove 2023 财年年营收约为 56 亿港元（约合 7.2 亿美元，~$720m，约 $5.6b 港元），覆盖 10
              余个亚洲市场，对应 EV/GMV 约为 0.03–0.05 倍，为 Porter 0.04–0.05 倍的 EV/GMV 提供了直接跨市场参照。该对标印证了 Porter 12 亿美元估值在 GMV
              维度上与高运量同城物流整合平台的成熟市场定价保持一致（Porter 估值 $1.2b）。
