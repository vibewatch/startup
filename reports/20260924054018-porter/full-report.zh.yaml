      - number: '8.6'
        title: 退出就绪度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              Porter 最可行的退出路径为印度本土 NSE 或 BSE 上市，综合首个盈利财年里程碑（FY25）、Series F 业务整合期以及印度物流行业可比 IPO
              推进节奏（Shadowfax、Delhivery），预计上市窗口期为 FY27–FY28。备选路径包括出售给跨国物流平台（DHL、Maersk 或 Yamato、SG Holdings
              等日本综合物流商）实现战略并购，或在 IPO 市场转弱时于 FY26–FY27 实施 PE 二级转让。Wellington Management 以财务回报型投资机构（非战略投资者）身份参投 Series
              F，强化了 IPO 路径确定性：Wellington 通常选择公开市场挂牌退出而非战略并购。

              四项重大尽调空白制约了无条件投资定论。其一，Kedaara 与 Wellington
              投资条款清单中的棘轮条款（具体包括保底回报、反稀释或价格保护条款）尚未公开，若进入基准或悲观情景可能改变回报分配结构。其二，FY24 后新设城市的单城单车经济模型数据未公开披露，无法独立测算 50
              城拓展计划的资本配置效率。其三，Series F 之上的优先股堆叠（早期轮次是否保留剩余清算优先权）尚未披露，在低于 12 亿美元（$1.2b）的退出情景下可能侵蚀普通股回报。其四，Series F
              清算优先权条款（1 倍非参与型还是参与型、赎回权）未予披露，直接影响下行情景下的资本回收。

              尽调团队应要求数据室提供：经审计的 FY25 合并财务报表（Ind AS）、排名前 10 城市的城市级损益贡献明细、包含优先股清算优先权安排的完整股权结构表（cap table）、Series F
              投资条款清单（棘轮条款、赎回权、反稀释）以及管理层编制的 FY26–FY28 财务模型。印度可比物流公司的 IPO 记录提供了实用参照：Delhivery 在 NSE 上市及 Shadowfax 的拟 IPO
              进程，为发行定价、禁售期及机构需求提供了直接基准。
