    rows:
      - - MV Aggregator Guidelines 强制执行
        - MoRTH 公布正式施行日期，或各邦政府开始对平台实施处罚
        - 抽成率强制限制在 12% 以下；且未给予货运聚合平台豁免
        - 投资逻辑破裂；收入模式需要彻底重组；投资建议转向负面
      - - Code on Social Security 2020 零工基金
        - 政府零工福利门户网站上线；向平台下发缴费通知书
        - 年度成本超过 Rs 100 crore（占 FY25 收入的 2% 以上）
        - 大幅下调盈利预期；下调 FY26 EBITDA 预估；按季度跟踪合规进展
      - - 运力供给中断
        - 新闻报道主要城市发生罢工或全市司机联合抵制
        - 两个或以上城市的运力供给下降超过 20%，且持续时间超 48 小时
        - 业务连续性风险；升级对司机申诉机制的尽调；必须制定应急预案
      - - MapMyIndia 服务宕机或合同终止
        - Porter 平台出现调度失败、路径规划错误或超时激增
        - 任一城市出现超过 30 分钟的路径规划故障，影响超过 10% 的订单
        - 确认存在备选地图供应商；从数据室调取 MapMyIndia 合同约定的 SLA
      - - 竞争加剧导致抽成率受压
        - 竞对折扣活动或司机补贴战导致综合抽成率下降
        - 在无监管强制要求的情况下，综合抽成率连续两个季度跌破 12%
        - 重新评估单模型经济效益与竞争护城河；审视受波及城市的差异化优势是否足够
    notes: 这些终止指标代表投资逻辑可能发生根本变化，而非一般业务波动。应持续跟踪行业新闻、官方监管公报和季度财务更新。
