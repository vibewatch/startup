      - number: '8.5'
        title: 逻辑证伪触发条件与否决标准
        blocks:
          - type: paragraph
            body: >-
              投后持续跟踪的否决标准由五项逻辑证伪触发条件构成，每项均明确了阈值、损益表影响及监测机制。其一，MV Aggregator Guidelines 落地：若 MoRTH
              出台抽成率上限规定、要求向运力端分成底线不低于 80%，受波及车型类别的佣金收入预计缩水 25–40%，综合抽成率拉低 5–7 个百分点，单年即可抹平 FY25 的全部
              EBITDA。这是严重程度最高的触发条件。其二，零工身份重新界定：正式推行 Code on Social Security 2020 并强制为平台从业人员缴纳社保，将把 2–3%
              的运力分成从完全可变成本转为半固定成本，削弱经营杠杆并推高单票履约成本。其三，新拓城市单车经济模型恶化：若 FY24 之后拓展的新城市未能在 18 个月内实现贡献毛利盈亏平衡，Series F
              募集资金消耗速度将快于模型预测，迫使公司以潜在稀释性条款追加融资。其四，Bengaluru 营收突发冲击：Bengaluru 占总营收预估达
              25–30%，该地出现监管、竞争或需求端震荡将对损益表产生超出地域维度的非对称冲击。其五，竞争性价格战：Lalamove 重新加大在印投资或 Shadowfax 在 IPO
              后争夺市场份额，可能引发一轮抽成率承压周期，若叠加上述监管底线，将对营收与成本端构成双向挤压。

              截至本报告出具日，尚无单一触发条件成为现实。MV Aggregator Guidelines 仍处于征求意见阶段；按现行官方表态，Code on Social Security 的落地时间表至少延至 FY27。
