      - number: '4.3'
        title: 单车经济模型与公开业务表现
        blocks:
          - type: paragraph
            body: >-
              以印度本土物流业发展水准衡量，Porter 披露的公开运营指标表现亮眼，但数据颗粒度依然有限。FY25 合并口径录得 ₹4,339 crore 营收，相较于 FY23 的 ₹1,753.8
              crore，其三年复合年增长率（CAGR）高达约 57%——这种持久的高复合增速在印度本土物流科技平台中屈指可数。截至 2025 年中，公司在印度本土拓展至 22+ 个城市，累计入驻司机合作伙伴突破 1.2
              million 名大关。FY25 公司成功扭亏为盈，合并净利润达 ₹55 crore（旗下 SmartShift Logistics 独立主体净利润更达 ₹131
              crore），终结了连续三年的净亏损困局。FY24 净亏损为 ₹95.7 crore（相较 FY23 的约 ~₹267 crore 缩窄 45%），清晰印证了在最终跨越盈利拐点前亏损额持续收窄的良性轨迹。

              17–20% 的隐含毛利率水平虽然低于高 GMV 平台的行业中位数，但这如实反映出与最后一公里小件电商快递相比，重型 LCV
              同城干线货运中车队运力分成占比更高的固有产业规律。其最关键的底层结构优势在于：向车队运营商支付的每笔款项皆为与实际履约收入紧密绑定的可变成本——没有任何闲置运力折旧拖累，亦无车辆租赁按揭等沉重固定负债。按公开披露的抽佣区间测算，覆盖不同车型后，Porter
              每完成单次行程获取的净抽成收入在 ₹84 至 ₹750 之间。FY25 EBITDA 达到约 ₹48 crore，而 FY24 EBITDA 则为约 -₹112 crore——在 ~₹1,605 crore
              的营业增量收入带动下实现了高达 ₹160 crore 的 EBITDA 强劲反转，表明业务对既有固定及半固定成本构架释放出了极为可观的边际经营杠杆效应。

              目前未对资本市场公开披露的核心非公开指标包括：GMV（平台总订单金额）、中小微企业客户及个人 C 端的获客成本（CAC）、按城市分级与车型划分的边际贡献率（Contribution
              Margin）、净收入留存率（NRR，分批次客户复购频次趋势）、活跃司机与历史累计入驻司机的真实比例，以及按细分车型拆分的营收明细。中小微企业业务作为 Porter
              旗下客单价值最高的战略板块，凭借稳定可预期的叫车频次、多点停靠配送单以及跨城合同履约带来了更高的客单均价，从而贡献了远超平均水平的单位经济效益。然而，由于官方尚未单独披露过任何关于中小微企业的专项营收与留存续约数据，外部机构难以独立量化评估该细分客群在此次利润跨越反转中所扮演的真实业绩权重。
