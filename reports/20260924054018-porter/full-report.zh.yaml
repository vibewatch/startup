      - number: '3.3'
        title: 综合能力、定价策略与 GTM 模式对比
        blocks:
          - type: paragraph
            body: >-
              从能力维度看，Porter 在全印地理覆盖广度、中小微企业账户管理工具、规模化 GST 合规开票体系、企业级 API
              接口集成以及多业态业务纵深（LCV、两轮货运、居民搬家、微卡运输）等维度，全面领先直面竞对。Lalamove 在其布局的四大都市圈内，按需响应调度与实时 GPS 追踪能力与 Porter
              旗鼓相当，但在专为中小微企业定制的增值功能、全国城市网络广度以及大都市以外的运力储备深度上落后于 Porter。Blowhorn
              的产品矩阵则更为单薄：缺乏企业级治理能力，在印度南部以外知名度受限，进驻城市范围狭窄。定价机制上，Porter 每单抽取 14–30% 佣金，处于印度即时物流平台的行业常规合理区间；Lalamove
              则采用大体相当的单均抽佣机制。非正规货运中介由于定价不透明，表面账面报价可能看似便宜，但完全缺乏合规开票、路径追踪和货损争议仲裁等衍生保障价值。Delhivery 与 Shadowfax
              则采用全然相异的计价法则——以单件包裹快递资费或 B2B 长期大宗包车合同结算——因其服务标的及底层客群与 Porter 存在本质差异。在市场进入（GTM）策略上，Porter
              聚焦中小微企业战略定位构成了核心护城河：约 60–65% 的收入贡献来自中小微企业客户，该群体对合规发票、历史轨迹对账、专属客服以及批量排单计划的重视程度远超单纯的低价诉求。相比之下，Lalamove
              在印度的市场策略聚焦特大都会，兼顾小微商户与个人散客，缺乏对中小微企业税务合规场景的深度打磨。谈及平台信誉与合规态势，Porter 面临来自 TGPWU 零工工会与 Business and Human
              Rights Resource Centre（2025 年 7 月）关于侵害劳工权益的负面指控，构成了实质性 ESG 和合规隐患，而 Lalamove
              在印度公开渠道尚未遭受同类严苛质疑。在公开可检索的信息中，尚无确凿证据显示 Porter 正在将其核心市场份额丢失给已具名的竞争对手。
