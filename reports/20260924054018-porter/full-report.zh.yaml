      - number: '2.5'
        title: 市场结构、竞争格局演变与行业前景
        blocks:
          - type: paragraph
            body: >
              印度同城物流市场正迎来正规化整合的拐点——与 2015 至 2020 年间印度网约车市场经历的洗牌高度相似。三大底层动能正在重塑行业竞争格局：

              第一，数字化渗透提速：中小微企业采用线上物流平台的比例正从 2025 年的约 20%
              快速攀升。凭借价格透明、税务合规及高可靠性建立起中小微企业信任壁垒的平台，将享有复利优势，因为每家沉淀下来的中小微企业都将带来持续数年的稳定叫车需求。

              第二，供给端同质化风险：随着司机合作伙伴网络初具规模（Porter 累计
              1.2M，竞对亦在跟进），单纯依赖运力密度的护城河容易受到侵蚀，除非平台能在司机实际收入、数字化作业工具及留存关怀计划上建立差异化。更为关键的是，随着印度出台《Social Security Code
              2020》强制要求提取社保基金，全行业司机综合成本将出现结构性上升，从而收窄各平台的利润率差距。

              第三，跨区域下沉扩张空间：全印度拥有 53 个常住人口超过 1m 的城市以及超过 500 个常住人口超 10 万的城镇。目前进驻 22+ 个城市的 Porter（计划到 2026 年拓展至 39+
              个城市，2030 年达 50 城）仍处于全国化扩张的中途。二线城市虽单均客单价偏低，但运力获客成本更廉价，非正规中间商的竞争壁垒也更薄弱，为先行开拓者提供了优异的单车经济模型空间。

              行业前景展望：在中小微企业数字化、电商繁荣与城市化浪潮的多重共振下，预计到 2031 年印度同城物流市场规模将扩容至 $43 billion。期间正规化物流的市场份额预计将由当前的约 30% 跃升至
              40–45%。深耕同城轻型商用车赛道 10+ 年并确立龙头地位的 Porter，处于捕获本轮结构性红利的最优站位。
