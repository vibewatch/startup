      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Porter 的轻资产平台模式对少数外部商业伙伴形成了深度依赖，每一个伙伴都是潜在的单点故障源，且均未对外披露完备的备用替代方案。最核心的技术依赖是 MapMyIndia（Mappls）。在覆盖的 22
              座城市中，Porter 的调度引擎高度依赖 Mappls 提供的实时道路地图绘制、路径规划与导航服务。MapMyIndia 官方宣传其 API 覆盖印度超过 6 million-plus
              公里公路，声称在印度车道级细节覆盖上具备领先优势。Porter 从未公开披露任何备用地图服务商，在最核心的运营功能上形成了单一供应商集中度风险。双方之间亦未公开任何正式 SLA；MapMyIndia
              出现的任何服务宕机、API 弃用或重新议价，都可能引发即刻的调度停摆，且缺乏公开可行的替代预案。

              支付结算环节依赖 Razorpay 与统一支付接口（UPI）。印度储备银行（RBI）对 UPI 激励机制的政策调整——例如修改零商户费率（zero-MDR）框架或调整交易费上限——可能冲击 Porter
              的支付成本结构。Razorpay 本身作为合作方，同样没有披露备用支付处理服务安排。虽然印度 UPI 生态月交易量突破 13+ billion 笔，技术底座成熟，服务中断概率较低，但 RBI RBI
              持续讨论支付商业经济性所带来的监管变数，对 Porter 这种体量的平台而言绝非无关紧要。

              车队运营商依赖是 Porter 最大的成本敞口。FY25 向车队发放的分成支出达 Rs 3,660-3,679 crore，占营收的 82.8%。Porter
              自身不持有运输车辆，完全依赖个体车队运营商与合作司机。若司机群体大面积倒戈流向竞对平台（如开出更高分成费率的 Shadowfax、Lalamove 或新晋入局者），Porter
              的供给侧运力将迅速瓦解。公司未对外公开任何车队运营商长期留存合同条款。此外，出资方集中度同样值得密切关注：Kedaara Capital 与 Wellington Management 联合领投了 2
              亿美元（$200 million）的 F 轮融资，一旦任一投资方的投资组合策略发生变动，都可能增加后续资金支持的复杂性。Porter 尚未公布其底层云服务提供商及任何灾难恢复安排，构成了更深层的隐性依赖。
