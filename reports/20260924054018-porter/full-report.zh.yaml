      - number: '6.2'
        title: 采纳与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Porter 最核心的业务采纳指标是营收：FY23 为 ₹1,754 crore，FY24 为 ₹2,734 crore（同比增长 56%），FY25 达到 ₹4,339 crore（同比增长
              57%）。在不断扩大的体量基数上连续两年保持约 57% 的年化营收增速，有力证明了业务增长源于真实的订单体量扩张，而非单纯靠涨价驱动，尤其是考虑到变现率（take rate）长期稳定在 14–16% 区间。按约
              15% 的综合变现率推算，FY25 GMV 约为 ₹29,000 crore，意味着覆盖广泛中小微企业和个人消费者的年订单量达数千万单。截至 2025 年累计 1.2 million（120
              万）名合作司机的规模，足以支撑这一需求，但这属于历史累计入驻人数，而非同时在线活跃司机数。Porter 客户端应用在 Google Play 上的下载量超过 1M+ 次，评分为 4.1/5；iOS 应用亦已上线
              Apple App Store。这些指标反映了平台已具备规模化个人用户基础，但并未披露月活跃用户数（MAU）或订单频次。Porter FY25 向合作司机发放的毛分成支出约为 ₹3,660–3,679
              crore，可作为佐证营收数据与确认交易量真实性的独立代理指标。业务覆盖城市从 2020 年的约 8 座扩张至 2025 年的 22+ 座城市及阿联酋，五年增幅超过
              175%。公司至今未公布月活跃客户数、月订单量或平均客单价（AOV）的官方数据。
