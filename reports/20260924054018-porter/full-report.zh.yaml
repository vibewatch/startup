      - number: '1.4'
        title: 商业模式、产品体系与技术架构
        blocks:
          - type: paragraph
            body: >
              Porter 采用佣金制物流双边市场模式。需求端：客户（中小微企业、商户及个人）通过 Porter App 或网页门户预订车辆。供给端：拥有或运营
              LCV、微型卡车或两轮车的独立司机合作伙伴接单履约，按单获取运费收入，平台扣除 14–16% 的佣金（在部分城市最高可达 30%）。

              技术平台涵盖：实时 GPS 车辆追踪；基于地理邻近度、车型及可用状态匹配供需的动态派单算法；多点停靠路线规划与路径优化；预计送达时间（ETA）预测；应用内整合 UPI/Razorpay
              支付；面向中小微企业客户的数字 GST 发票系统；电子送达证明（POD）以及客户评分与评价机制。

              Porter 技术架构采用微服务体系。位置服务由 MapMyIndia 与 Google Maps 的地图接口提供支持。平台支持 iOS 和 Android 移动端应用及网页预订门户。FY25
              得益于技术赋能模式，Porter 营收同比增长 57%，达到 ₹4,306–4,339 crore，其中 99% 的收入来自货运业务。

              Porter 的竞争优势建立在四大支柱之上：（1）供给端密度——累计入驻 1.2 million 名司机合作伙伴，形成充裕运力流动性与 ETA 确定性；（2）以中小微企业为中心的产品功能（GST
              开票、多点配送、企业账户 API 对接）；（3）一线城市的品牌认知度；以及（4）需求端订单密度与供给端司机收入之间的双边网络效应。阿联酋业务的拓展（于 F 轮融资前启动）标志着 Porter
              迈出国际化第一步，检验了其商业模式在高收入物流市场的复制能力。
