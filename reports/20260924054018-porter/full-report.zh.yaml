        - B2B 账户设有合同保底消费；不适用于个人零散预约
        - 是——标配 B2B GST 发票
        - 企业账户透明度高；小货主计费结构偏复杂
        - 难以替代同城 LCV；整体定价偏向企业级客户
      - - 非正规货运中介
        - 电话撮合调车——同城货物运输
