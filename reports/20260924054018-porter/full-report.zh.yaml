      - number: '7.5'
        title: 缓释举措、跟踪监测与投资逻辑破损触发条件
        blocks:
          - type: paragraph
            body: >
              Porter 针对其核心风险敞口采取的缓释举措虽然真实存在，但部分仍属推测性质或无法通过公开渠道验证。短期内最明确的风险缓冲是 F 轮资金注入（来自 Kedaara 和 Wellington 的 $200M
              融资），按 FY25 运营成本测算，即使在零营收增长的极端假设下，该资金亦可提供预计 12+
              个月的现金跑道。充裕的流动性降低了近期再融资风险，并为消化监管调整提供了缓冲垫，避免被迫立即削减开支或调整价格而伤及业务增速。

              针对《机动车聚合商指引》风险，Porter 最可能的应对路径包括：(1) 重新分类收入流以脱离指引的技术界定范围——例如将部分收费项目定性为物流管理费而非车辆聚合佣金；(2) 协同行业协会（IAMAI、CII）向
              MoRTH 游说，争取货运/货物运输业务豁免或延期执行；(3) 针对中小微企业级客户，逐步将收费模式转向订阅制或类 SaaS 服务费。这些缓释举措在法律上均无确凿保障，加上执行时间表悬而未决，截至 2026 年
              5 月外界无法确认其实际成效。

              针对零工福利基金刚性缴费义务，主要的应对抓手是将成本部分转嫁给终端客户（适度上调叫车手续费）或车队运营商（小幅调低基础分成费率）。作为全行业面临的共同成本，竞对同样无法规避，因而相对竞争劣势有限；但在
              Porter 当前微薄的净利率基数下，Rs 43-87 crore 的绝对年度支出依然构成实质负担。针对司机运力供给风险，1.2 million
              名累计入驻司机的体量为抵御局部停工提供了蓄水池；然而未披露正式申诉处理机制仍是一项结构性缺陷。

              投资逻辑破损的触发条件包括：《机动车聚合商指引》强制推行低于 12% 的变现率上限；多城市司机罢工致使履约率跌幅超 20%；在缺乏可行替代方案的情况下失去核心地图服务商 MapMyIndia；核心高管（CEO 或
              CPTO）离职且未敲定继任人选；或出现因平台体验恶化导致的客户侧持续性流失。投资者应当围绕上述各维度设定量化监测阈值，作为持续下注的前置条件，并在尽调数据室审查中优先跟进关键核查清单（参见 TR005）。
