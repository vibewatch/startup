chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司背景与创立历程
        blocks:
          - type: paragraph
            body: >
              Porter 是一家同城即时物流科技平台，法定注册实体为 SmartShift Logistics Solutions Private Limited，总部位于印度卡纳塔克邦班加罗尔（CIN:
              U63090KA2014PTC075462）。公司以 Porter 品牌通过 porter.in 运营面向客户的产品。Porter 由 Pranav Goel、Uttam Digga 和 Vikas
              Choudhary 于 2014 年共同创立——三位 IIT Kharagpur
              校友敏锐捕捉到印度同城货运市场的严重低效：该市场长期被分散的传统卡车中介与非正规信息掮客垄断，无法提供实时叫车、透明定价或可靠的服务履约保障。

              Porter 的核心产品是移动端和网页端平台（iOS 和 Android），支持企业与个人用户预订同城当日达轻型商用车（LCV）、微型卡车（Tata Ace/Mahindra Supro
              级别）、两轮车以及轻卡货车。该平台运用实时 GPS 追踪、动态路径规划、预计送达时间（ETA）预测与算法化车队调度系统。Porter
              主要服务三大客群：（1）需要高频货运的微型、小型与中型企业（MSME）；（2）处理个人或家庭搬家需求的个人消费者；以及（3）需要定期或合同制物流运力的大型企业。

              Porter 采用佣金制双边市场模式。司机合作伙伴均为自主购车或自筹资金购车的独立运营者；Porter 对每笔交易收取约 14–16% 的平台佣金，在特定市场可达 30%。平台支持 UPI 与 Razorpay
              应用内支付、数字 GST 发票开具、电子送达证明（POD）以及多点停靠路线优化。截至 2025 年 5 月完成 F 轮融资时，Porter 已在印度 22+ 个城市及阿联酋开展业务，累计入驻司机合作伙伴达 1.2
              million 名。货物运输收入占公司总收入的 99%。
