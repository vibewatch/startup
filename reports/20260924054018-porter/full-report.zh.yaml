      - number: '3.4'
        title: 切换成本、锁定效应与分销渠道壁垒
        blocks:
          - type: paragraph
            body: >-
              平台网络越大，Porter 的竞争壁垒越由切换成本和锁定效应加固。中小微企业接入后，GST
              开票、数字支付记录和行程记录都留在平台，迁移会增加行政成本：企业若改用竞品，就会失去统一合规开票系统带来的便利。在运力供给端，Porter 累计沉淀的 1.2 million
              名入驻司机合作伙伴在已覆盖城市形成供给密度优势，让接车更快、接单率更高、高峰溢价更少。任何资本充裕的新玩家即便试图复刻这种供给网络密度，也势必付出数年周期的司机招募拓展、背景审查与留存补贴资金。多平台并用（Multi-homing）现象主要出现在个人消费端，个人用户在叫车前常在
              Porter 与 Lalamove 之间比价，以及部分维持多供应商备选以分散运营风险的大型企业客户。而中小微企业客户一旦用上平台的发票和对账功能，黏性就会显著增强。看分销渠道穿透力，Porter 已覆盖 22
              个以上城市，运力密度远超仅覆盖印度 4 个大都市的 Lalamove 和主要布局印度南部、西部的 Blowhorn 因此是跨多个印度城市经营的中小微企业唯一可行的全国性 LCV 合作平台。通过 Porter
              API
              接入平台的企业客户面临最高的系统迁移壁垒，重新对接意味着庞大的软件研发投入、端到端接口联调以及与全新调度系统双轨并行的试错磨合成本，对于涉及多点停靠、跨城调度或高频重载用车需求的核心客户而言尤甚。中小微企业从
              Porter 倒退回传统线下货运中介，意味着主动舍弃进项税 GST 抵扣合规、实时在途轨迹、数字化对账凭证与丢损责任仲裁——对高度依赖税收进项抵扣的合规中小微企业而言，代价难以承受。
