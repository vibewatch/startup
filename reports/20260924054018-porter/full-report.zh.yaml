        - 每天或每周预约同城 LCV 进行货物转运，穿梭于仓库、供应商与客户之间
        - 高频；估计占 Porter 收入的 60–70%；坐拥印度约 63M 家 MSME 的庞大基数
        - 核心收入驱动力；复购率最高；价格敏感但贡献庞大订单体量
