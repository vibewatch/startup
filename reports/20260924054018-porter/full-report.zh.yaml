      - number: '8.3'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              入局时的潜在结果分布覆盖三种情景。乐观情景假设 FY25 至 FY28 营收复合年增长率达 50%，带来约 ₹14,700 crore（约合 17.6 亿美元，~$1.76b）的合并营收，约为 FY25 营收的
              3.4 倍。按 3.5–4.0 倍 EV/Revenue 估值倍数（规模化盈利增长、IPO 临近预期以及 Delhivery 估值重估先例构成合理支撑），隐含的 19–25
              亿美元（$1.9–2.5b）企业价值对应三年内针对 12 亿美元（$1.2b） Series F 入局估值实现 1.6–2.1 倍回报。乐观情景要求 50
              城拓展执行毫无差错、无不利监管政策出台，且订单持续向高客单价的企业与 B2B 业务转移，驱动业务结构优化并带动 EBITDA 扩张。

              基准情景假设至 FY28 营收复合年增长率为 40%，实现营收约 ₹11,900 crore（约合 14.3 亿美元，~$1.43b）。按 2.5–3.0 倍 EV/Revenue 倍数计算，隐含的 14–18
              亿美元（$1.4–1.8b）企业价值可带来 1.2–1.5 倍回报，符合持有期 4–5 年的 PE 或成长期投资机构的收益预期。基准情景假定监管环境保持稳定、至 FY28 部分拓展至 35–40 座城市，且
              EBITDA 利润率温和改善至 5–7%。

              悲观情景模拟了双重监管冲击：MV Aggregator Guidelines 正式颁布并设定抽成率上限，导致综合佣金率下降 5–7 个百分点；同时 Code on Social Security
              的零工保障条款增加车队运营商成本约 2–3%。两项冲击叠加使 FY28 EBITDA 利润率较基准情景降低 500–700 个基点，营收复合年增长率放缓至约 25%（反映提价转嫁成本带来的需求受挫），FY28
              营收降至约 ₹8,500 crore（约合 10.2 亿美元，~$1.02b）。在压缩至 1.5–2.0 倍 EV/Revenue 倍数（与接近盈亏平衡的物流运营商估值一致）下，隐含的 7–10
              亿美元（$0.7–1.0b）企业价值跌破 12 亿美元（$1.2b）的 Series F 入局价格，存在资本受损风险。结合当前立法进展，悲观情景发生概率评估为 20–25%。
