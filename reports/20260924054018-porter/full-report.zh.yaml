      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >
              Porter 的领导团队以三位 IIT Kharagpur 联合创始人为核心，他们自公司创立之初便塑造了企业发展轨迹。2023 年 8 月，公司完成关键治理结构调整：Uttam Digga 正式接任
              CEO，Pranav Goel 则转任执行副董事长。两位创始人均深度参与日常运营，并与 Vikas Choudhary 共同斩获 2025 年度安永企业家奖（EY Entrepreneur of the Year
              2025）初创企业类别大奖，印证了外部市场对创始团队业绩的高度认可。

              Uttam Digga（自 2023 年 8 月起担任 CEO）是 IIT Kharagpur 校友，从联合创始人晋升为首席执行官，主导公司迈向盈利并推动跨区域扩张。Pranav
              Goel（执行副董事长）作为联合创始人兼前任 CEO，已退出日常运营，转向把控战略方向。Vikas Choudhary（联合创始人）在公司内部统管产品与战略规划。Shruti Ranjan Satpathy 于
              2023 年获任首席产品与技术官，全面领导涵盖预订引擎、调度算法及车队智能系统的技术栈。

              2023 年的管理层重组——正式确立 Digga 为 CEO、Goel 为执行副董事长——经多家物流行业媒体广泛报道，标志着公司治理结构在 F 轮融资与潜在 IPO
              前夕逐步走向成熟。关键人物风险依然存在：创始三人组的运营把控力与行业人脉资源，对维系司机合作伙伴信任、中小微企业客户关系及投资方信心至关重要。

              Porter 董事会汇聚了来自领投 F 轮的 Kedaara Capital、Wellington Management 以及早期投资方 Vitruvian Partners 的机构代表。Peak XV
              Partners（前身为 Sequoia India）与 Kae Capital 在 F 轮融资中完成了老股转让退出——这既表明早期投资人实现了部分流动性变现，也意味着两个早期投资方退出了董事会席位。
