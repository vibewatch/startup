          note: 根据 FY25 推算 GMV 约 ~₹29,000 crore 除以每个 MSME 账户每年预估 ₹30,000–60,000 的支出，测算得出活跃下单客户约 500K–1M。Porter 从未公开披露过活跃客户数。
