      - number: '4.5'
        title: 财务裁决：收入质量、利润率路径与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Porter 在 FY25 实现合并口径盈利，标志着商业模式出现实质拐点：按完成订单确认的 99% 佣金收入、占比 82.8% 的可变车队运力成本基数，加上 57%
              的营收复合年增长率，共同构成了在运行机制上自洽且已获实证检验的利润率扩张逻辑。收入质量处于高位——遵循 Ind AS 115
              时点确认原则、无递延收入风险、终端客户应收账款集中度为零，交易量驱动模型有效规避了单一客户依赖。平台型撮合架构彻底消除了车队资本开支，使资本密集度低于任何重资产货运竞品。

              利润率扩张路径具备可信度，但取决于四项杠杆的协同生效：(1) MSME 业务结构转向客单价更高的长途或大吨位行程，提升单笔订单的绝对佣金收益；(2) 地域扩张形成规模效应，在更大订单体量上摊薄固定间接成本；(3)
              业务规模放大带来技术与平台成本的经营杠杆；(4) 车队运力分成比例维持定价纪律。最后一项杠杆面临的监管风险最大：印度《Code on Social Security
              2025》拟要求平台向零工社保基金缴纳法定供款，这可能将一部分可变车队成本转变为法定刚性支出。目前关于海得拉巴零工工作条件恶劣的指控（TGPWU 与 BHRRC，2025 年 7
              月）也可能推高司机获客成本和合规支出——这两项支出当前在公开资料中均未量化。

              面向机构投资决策，仍有三项关键尽调盲区尚未解决。第一，GMV 未披露——缺乏该指标，便无法独立验证不同车型与城市梯队的实际抽成率和定价权。第二，MSME 客户与司机的 CAC
              均未披露——无法独立核算单客经济效益与回收期。第三，按城市梯队和车型细分的边际贡献率未披露——盈利基础可能高度集中于少数高密度核心枢纽城市。此类信息缺失在印度 Pre-IPO
              阶段私有公司中十分常见，但对于希望独立构建 FY26–FY27
              利润率趋势模型的投资者至关重要。财务综合研判：收入质量优异，利润率扩张路径可信且正稳步推进，资本充足度稳健，但在确立投资头寸前，上述三项单客经济效益盲区仍是必须核实的重大尽调诉求。
