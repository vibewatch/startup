  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场界定与业务边界
        blocks:
          - type: paragraph
            body: >
              印度同城物流市场涵盖在单一城市行政边界内发生的所有货物运输活动——包括同城当日达、点对点商用货运、家庭搬家以及按计划执行的企业多点配送——主要使用轻型商用车（LCV，载重 ≤ 3.5
              吨）、微型卡车和两轮车。该细分市场在结构上区别于城际公路货运（长途干线物流）、电商仓配履约的首公里/最后一公里配送，以及国际航空或海运货运。Porter 核心业务对应的目标车型为 3.5
              吨以下轻型商用车（LCV）细分品类，主要车型包括 Tata Ace、Mahindra Supro 和 Ashok Leyland Dost。

              该市场的核心需求驱动力来自中小微企业（MSME）经济：印度超过 63+ million
              家注册中小微企业在原材料采购转运、厂际调拨、分销商及零售商成品交付以及电商履约环节，均产生高频且高度依赖确定性的同城货运需求。个人与家庭用户（居民搬家、大件物品即时送达）构成第二大细分市场。需要定制化或长期外包同城车队的大型企业客户则构成第三大客户群。

              Porter 当前 TAM 的地理边界限定在人口超过 100 万的印度城市群，此类区域的商用车利用率足以支撑平台化双边市场运营。截至 2025 年 5 月，Porter 已在 22+
              个此类城市开展业务，并在持续推进后续扩张。阿联酋则是 Porter 迈向国际市场的首站试验田。鉴于数据可得性，本章市场规模测算主要聚焦印度本土同城物流市场。
