  topStrengths:
    - 在印度快速增长的同城物流赛道占据市场领先地位，拥有 1.2M 司机伙伴网络，业务覆盖 22+ 座城市
    - FY25 首次实现盈利（合并净利润 ₹55 crore），收入增长 57% 且 EBITDA 保持向好走势
    - 轻资产撮合平台模式，佣金抽成率为 14–16%，并受益于 MSME 强劲的需求顺风
    - 在 $1.2B 估值下跻身独角兽行列，获机构投资者 Kedaara Capital 和 Wellington Management 支持
    - 获得 CCI 监管批准，为 Kedaara 的投资提供了法律层面的确定性
  topRisks:
    - 《2020 年印度社会保障法》（2025 年 11 月生效）要求按营业额的 1–2% 向零工基金缴费，直接挤压利润率
    - TGPWU 指控平台存在剥削性条件与不公停运，引发监管与声誉风险
    - 在同城物流领域面临来自 Shadowfax（拟 IPO）、Delhivery（已上市）和 Lalamove 的激烈竞争
    - 盈利缓冲较薄，且部分取决于车队运营成本控制；司机报酬分成占总支出的 82.8%
    - IPO 时间表尚不明确；Series F 轮投资者的退出变现路径存在不确定性
  unresolvedGaps:
    - 未公开披露各业务条线的详细损益拆分与毛利率
    - 净收入留存率（NRR）和客户队列留存指标暂缺
    - 未公开披露 IPO 或下一次重大流动性事件的具体时间表
    - 未单独拆分 UAE 业务的收入贡献与国际业务盈利情况
    - 未公开单司机收入数据及实际司机流失率
