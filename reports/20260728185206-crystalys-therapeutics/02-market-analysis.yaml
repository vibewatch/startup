- id: sizing-lenses-and-revenue-opportunity
  title: Multiple sizing lenses point to a real market, but only a fraction is truly in scope for Crystalys
  body: 'Top-down market reports confirm that gout is already a multibillion-dollar therapeutic category, but they also highlight why Crystalys needs a constrained sizing lens instead of a giant prevalence-based headline. Grand View Research puts the global gout therapeutics market at $2.49 billion in 2022 with 6.25% CAGR through 2030 and North America at 47.81% of 2022 revenue. Mordor Intelligence gives a higher and more recent path, projecting $4.24 billion in 2025, $4.52 billion in 2026, and $6.67 billion by 2031, with North America at 42.43% of 2025 value and oral formulations at 80.32% of 2025 revenue. Those reports disagree on scale, but they agree on the broad shape: gout drugs are already a large market; North America is the biggest current revenue pool; and oral therapy dominates volume and revenue before biologic escalation. For Crystalys, the relevant SAM is not all oral gout therapy. It is the subgroup where physicians and payers see enough unmet need to move beyond allopurinol
    or selective febuxostat use, yet still prefer an oral product over infusion-center therapy. That is large enough to justify venture-scale capital, but much smaller than the total 9.2 million-patient prevalence headline.'
