callouts:
- calloutType: insight
  title: The real market is the gap between cheap generics and burdensome biologics
  body: Crystalys does not need every gout patient. It needs the subset large enough to matter economically but frustrated enough by generic oral therapy that payers and prescribers will accept a branded second-line oral before infusion-based refractory care.
  claimRefs:
  - CM003
  - CM004
  - CM007
  - CM021
- calloutType: risk
  title: High prevalence does not equal high monetizable demand
  body: A 9.2 million-patient prevalence headline is helpful for framing disease burden, but market conversion is limited by allopurinol adherence problems, generic price anchors, and the fact that many patients never escalate beyond first-line therapy.
  claimRefs:
  - CM001
  - CM023
  - CM024
  - CM030
- calloutType: risk
  title: Crystalys will enter a more crowded URAT1 lane than the company narrative alone implies
  body: Pozdeutinurad and lingdolinurad show that other sponsors also see room for new uricosuric or URAT1-based therapy, so Crystalys must win on timing, evidence quality, and safety positioning rather than on novelty alone.
  claimRefs:
  - CM031
  - CM033
  - CM035
