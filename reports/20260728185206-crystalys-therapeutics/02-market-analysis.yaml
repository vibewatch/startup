tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / spend bucket
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Crystalys
  rows:
  - - First-line chronic urate lowering
    - Allopurinol and selective febuxostat use aimed at long-term urate control
    - Acute flare drugs and non-pharmacologic management
    - Prescriber chooses; payer reimburses mostly as low-cost oral pharmacy spend
    - Important as incumbent baseline but not the premium value pool Crystalys needs.
  - - Second-line oral escalation
    - Branded or differentiated oral urate-lowering options after inadequate response or intolerance to first-line therapy
    - Biologic uricase infusions and flare-only therapy
    - Rheumatologist or PCP drives switch; payer reviews step-through logic
    - Direct target zone for dotinurad according to company positioning.
  - - Refractory / infusion therapy
    - Pegloticase and high-touch specialty care for uncontrolled disease
    - Routine generic oral maintenance
    - Specialist prescriber and payer prior authorization dominate
    - Indirect comparator that proves willingness to pay for severe disease.
  - - Acute flare management
    - NSAIDs colchicine steroids and urgent symptom control
    - Long-term urate-lowering market share
    - Prescriber and retail pharmacy; payer mostly generic spend
    - Mostly outside Crystalys scope except as context for total gout care.
  - - Pipeline novel oral URAT1 therapy
    - Late-stage branded oral entrants seeking share from incumbents
    - Non-URAT1 biologics and acute-care only products
    - Specialist prescribers, payers, and sometimes specialty pharmacy influence adoption
    - Competitive lane where Crystalys must differentiate on safety efficacy and timing.
  notes: This market definition intentionally excludes acute-only flare management and the full biologic refractory-care stack from Crystalys core target market even though both influence total gout spending.
