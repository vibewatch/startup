- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow / adoption trigger
  - Crystalys relevance
  rows:
  - - Uncomplicated newly treated gout
    - Primary-care clinician
    - Patient with recurrent flares or hyperuricemia
    - Commercial or government pharmacy benefit
    - Start low-cost allopurinol and titrate
    - Indirect because this cohort anchors the generic baseline.
  - - Persistently uncontrolled oral-therapy patients
    - Rheumatologist or engaged PCP
    - Patient failing to hit serum urate target or tolerability goals
    - Pharmacy benefit with possible step edits
    - Need for better urate lowering while staying oral
    - Core Crystalys target segment.
  - - XOI-intolerant or contraindicated patients
    - Specialist prescriber
    - Patient unable to remain on standard first-line therapy
    - Payer requires evidence of prior failure or risk
    - Switch away from allopurinol/febuxostat
    - Important expansion segment reflected in AMETHYST positioning.
  - - Tophaceous or severe refractory gout
    - Rheumatologist / infusion center
    - Patient with advanced disease and high burden
    - Medical benefit and prior authorization
    - Escalate to monitored infusion therapy
    - Comparator segment showing high-value severe-disease spend.
  - - Payers and pharmacy benefit managers
    - Formulary committees
    - Indirect user role
    - Budget owner and access gatekeeper
    - Require superior efficacy safety or total-cost story vs generics
    - Critical nonclinical gate for any premium oral launch.
  notes: The commercial pathway is mediated by prescribers and payers rather than a single procurement buyer. Crystalys therefore needs both clinical and reimbursement proof.
