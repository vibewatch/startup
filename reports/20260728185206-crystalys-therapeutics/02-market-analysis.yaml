  evidenceGaps:
  - id: GM001
    type: private-evidence-only
    severity: material
    topic: second-line-sam
    missingEvidence: A canonical company or payer denominator for inadequately controlled patients who are still oral-therapy candidates before pegloticase escalation.
    whyItMatters: This is the true commercial SAM for Crystalys, and it cannot be derived cleanly from prevalence alone.
    diligencePath: Request management market research, claims-based patient stratification, and payer step-edit data supporting the second-line opportunity.
    relatedQuestionRefs:
    - QM022
    - QM023
  - id: GM002
    type: missing-source
    severity: material
    topic: europe-sizing
    missingEvidence: Open-source Europe-specific treated-patient and reimbursement data clean enough to size Crystalys realistic launch markets across major EU countries.
    whyItMatters: Crystalys is running U.S./EU pivotal development, but the reviewed public pack does not support a high-confidence Europe SAM.
    diligencePath: Pull country-specific prevalence and reimbursement data from national HTA sources and management launch-planning materials.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - id: GM003
    type: conflicting-data
    severity: minor
    topic: external-market-estimates
    missingEvidence: A reconciled explanation for why analyst market reports differ materially on current global gout therapeutics market size.
    whyItMatters: The difference does not change the thesis that gout is a multibillion-dollar market, but it affects TAM presentation and growth expectations.
    diligencePath: Triangulate analyst reports against manufacturer revenue roll-ups and management demand models before using a single headline market number.
    relatedQuestionRefs:
    - QM011
    - QM012
    relatedTableRefs:
    - TM002
