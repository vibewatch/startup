- id: buyer-user-payer-map-and-clinical-adoption-path
  title: Prescribers, patients, and payers all shape adoption; no single buyer controls the pathway
  body: 'The buyer-user-payer structure in gout is more complicated than a prevalence statistic implies. The user is the patient living with recurrent flares, tophi risk, pain, renal comorbidity, or cardiovascular concern. The practical buyer is usually the prescriber—often a primary-care clinician or rheumatologist—who chooses whether to titrate allopurinol, switch to febuxostat, add a uricosuric, or escalate to pegloticase. The financial gatekeeper is the payer, because oral generics are cheap while branded second-line or refractory therapies require a stronger coverage narrative. Guideline and label sources make the adoption path clear: first-line allopurinol is cheap and familiar; febuxostat is available but constrained by a boxed cardiovascular warning; probenecid is a renal-urate option with narrower use; and pegloticase is reserved for refractory disease and delivered by infusion with monitoring. Crystalys wants to sit in the clinical and economic gap between generic xanthine oxidase
    inhibition and infusion uricase. That means its market share will depend on physician willingness to switch earlier, patient willingness to persist with long-term urate-lowering therapy, and payer willingness to reimburse a premium oral against very cheap incumbent comparators.'
