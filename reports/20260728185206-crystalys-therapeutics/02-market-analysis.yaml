- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Evidence / rationale
  rows:
  - - Rising obesity and aging prevalence
    - positive
    - long-term
    - Expands diagnosed gout population and chronic treatment need
    - Prevalence and market reports identify population growth and obesity as core demand drivers.
  - - Treat-to-target guideline adoption
    - positive
    - medium-term
    - Pushes more active titration and switching when serum urate remains above goal
    - Guidelines emphasize urate targets below 6 mg/dL and below 5 mg/dL in severe disease.
  - - Novel oral URAT1 entrants
    - positive
    - medium-term
    - Creates room for second-line oral innovation beyond xanthine oxidase inhibition
    - Crystalys Sobi and Atom all frame next-generation URAT1 programs around unmet need.
  - - Poor allopurinol adherence
    - negative
    - current
    - Large unmet need exists but persistence problems reduce realized branded uptake
    - MEPS analysis shows only 35.2% high adherence and 27.4% no fills.
  - - Generic price compression
    - negative
    - current
    - Raises efficacy and safety burden for any premium oral launch
    - Allopurinol febuxostat generics and probenecid set a low-cost comparator baseline.
  - - Febuxostat cardiovascular warning
    - mixed
    - current
    - Creates space for alternatives but also makes payer and prescriber risk scrutiny sharper
    - Label warning narrows febuxostat use but also highlights safety sensitivity in this class.
  - - Pegloticase infusion burden
    - mixed
    - current
    - Proves willingness to pay for severe disease but sets a high bar for escalation economics
    - Infusion logistics and monitoring keep biologic use concentrated in refractory cases.
  - - Pipeline crowding from pozdeutinurad and lingdolinurad
    - negative
    - near-term
    - Crystalys must differentiate against other late-stage URAT1 programs, not only against legacy drugs
    - Sobi and Atom are advancing competing URAT1 assets through pivotal development.
  notes: 'Several constraints are double-edged: febuxostat safety concerns and pegloticase logistics both create demand for alternatives while reminding payers to scrutinize class risk and step-through economics.'
