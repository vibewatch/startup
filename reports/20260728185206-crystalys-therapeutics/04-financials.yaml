- id: economic-overhangs-and-unit-economics-gaps
  title: Urica and Fortress economics matter more than any public P&L, because they define what Crystalys may actually keep
  body: 'The most financially important primary document in the public pack is not a revenue statement but the 2024 Fortress/Urica transaction filing. It shows that Urica transferred rights related to dotinurad into the Crystalys structure while retaining meaningful economic interests, including a 35% equity position at closing, anti-dilution protection down to 15% until at least $150 million of equity financing had been raised, a 3% royalty on annual net sales, and governance rights. Those terms do not invalidate the company, but they do matter for future economics. Even if dotinurad launches successfully, not all value creation will accrue cleanly to new investors or operating-company common. The same filing also underscores how little public data exists on launch economics: there is no disclosed transfer-pricing structure, no realized reimbursement data, no inventory profile, no COGS guidance, and no sales-force efficiency benchmarks. Unit-economics analysis therefore remains mostly a
    diligence map rather than a quantitative model. The practical underwriting question is how much of gross product opportunity can survive royalties, dilution, and launch spend before the company needs additional capital.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI014
  - CI023
