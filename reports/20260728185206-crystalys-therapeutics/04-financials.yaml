  - CI019
  - CI020
  - CI021
- calloutType: risk
  title: The Fortress/Urica filing is the most important economic document
  body: The public financing narrative sounds clean until the 2024 filing is layered in. Equity retention, anti-dilution, royalty participation, and governance rights all affect what future value may actually accrue to new investors.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI033
