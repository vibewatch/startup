callouts:
- calloutType: insight
  title: Capital quality is better evidenced than business economics
  body: Crystalys has raised enough capital to be taken seriously, but open sources do not yet support a traditional revenue or margin model. The underwriting debate is therefore runway and dilution, not current operating performance.
  claimRefs:
