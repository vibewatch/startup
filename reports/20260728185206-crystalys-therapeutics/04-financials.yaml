chapter:
  number: 4
  title: Financials
  summary: Crystalys looks financeable but not yet conventionally underwritable. Public evidence supports a strong capital base for a single-asset biotech, yet offers little visibility into burn, cash-on-hand, pricing, realized partner economics, or launch-margin structure. The investable question is therefore capital adequacy and dilution risk rather than current revenue quality, because the company remains pre-approval and effectively pre-revenue in the U.S./EU opportunity it is financing.
sections:
- id: revenue-model-and-public-traction-limits
  title: The revenue model is conceptually simple but public traction is mostly absent
  body: 'Crystalys is developing a prescription drug company, so the long-term revenue model is conceptually straightforward: product sales, transfer-price or licensing economics, and possibly milestone or royalty flows depending on territory and partnership structure. The problem is timing and public visibility. The company is still running pivotal U.S./EU development, which means there is no disclosed U.S. or European product revenue to underwrite today. Public company materials and financing announcements focus on clinical progress and use of proceeds rather than on realized sales or unit economics. Ex-US commercialization of dotinurad in Japan and China is helpful as scientific and market precedent, but reviewed public sources do not show that Crystalys itself is already recognizing material commercial revenue from those territories. In practical terms, the chapter’s financial work starts from a near-zero public operating-data base: no reported revenue, no disclosed gross margin, no
    cohort economics, no CAC, no payer rebate structure, and no product-volume metrics robust enough to model a launch. That makes revenue quality a future thesis item rather than a current verified metric.'
  claimRefs:
  - CI001
  - CI002
  - CI012
  - CI013
  - CI015
  - CI027
  - CI028
  - CI029
  tableRefs:
  - TI001
  - TI002
