  - FI001
- id: capital-adequacy-and-balance-sheet-strength
  title: Public financing support is substantial, but actual cash runway remains undisclosed
  body: 'Where Crystalys does show unusually strong public evidence is capital raising. The company launched with a $205 million Series A in 2025 and added an oversubscribed $130 million Series B in July 2026, putting disclosed equity financing at about $335 million. That is a serious balance-sheet signal for a company centered on one late-stage asset, and it likely gives management more flexibility than a typical small biotech trying to finance parallel Phase 3 programs and launch preparation. But balance-sheet strength is not the same as cash clarity. Public sources do not disclose ending cash, monthly burn, runway months, debt covenants, or the exact timing of planned spend across clinical, manufacturing, and commercialization buckets. Investors therefore have to infer capital adequacy from round size, investor quality, and stated use of funds rather than from hard treasury numbers. The result is a favorable but incomplete picture: Crystalys seems better funded than many peers, yet the
    absence of cash-on-hand and burn reporting prevents a true runway model.'
  claimRefs:
  - CI004
  - CI005
