  productSummary: Crystalys is developing dotinurad, a once-daily oral URAT1 inhibitor, for gout patients in the U.S. and Europe through the RUBY, TOPAZ, and AMETHYST studies.
  customerFocus: Rheumatologists, gout patients needing better urate control or second-line options, and payers evaluating step-through access after generic xanthine oxidase inhibitors.
  businessModel: In-license and develop dotinurad for Western gout markets, then monetize through branded prescription sales and possible partnership economics once regulatory approval and payer access are secured.
