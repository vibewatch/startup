chapter:
  number: 7
  title: Risks
  summary: 'Crystalys’ risk profile is dominated by concentrated biotech execution: one core asset, late-stage but still pending Western approvals, thin public operating disclosure, and meaningful dependency on rights, capital, sites, and payer sequencing. The company’s biggest risks are therefore not mysterious—they are visible and monitorable—but several of them remain only partially mitigated in public evidence.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk is less about known litigation than about approvals labels and rights control
  body: 'The public record does not show a large live litigation cloud over Crystalys, but that does not make regulatory and legal risk small. The core legal-regulatory issues are Western approval uncertainty, label competitiveness, retained rights and economics embedded in the Urica/Fortress structure, and the legal cleanliness of company-controlled documentation and disclosures. Crystalys still needs successful pivotal data, acceptable regulator interpretation, and a launch label strong enough to justify second-line reimbursement. The SEC filing around the Urica transaction adds another layer: retained equity, anti-dilution protection, royalties, and governance rights mean Crystalys is not operating from a fully clean-slate ownership structure. Official privacy and contact pages also still show legacy Aristea traces, which is minor operationally but relevant as a governance-quality signal. In short, the biggest legal risk is not a courtroom event already visible today; it is the possibility
    that regulatory, contractual, or label-level realities produce a weaker commercial outcome than the financing narrative implies.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
