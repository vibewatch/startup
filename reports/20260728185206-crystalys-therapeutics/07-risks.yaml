- id: partner-capital-and-people-risk
  title: Crystalys is dependent on partners capital providers and a still-lean leadership bench
  body: Partner and people risk matter more than in a large commercial biopharma because Crystalys is still assembling the organization around one product. The rights chain depends on agreements originally linked to Fuji and Urica. Investor support is strong, but capital still matters because late-stage development, long-term extensions, launch preparation, and post-approval evidence can all consume more cash than expected. The company also appears lean relative to the ambition of running multiple global trials while planning commercialization. Trade reporting indicates the organization had roughly 14 employees in 2026 and expected to grow toward roughly 25 by year-end, with commercial infrastructure delayed until 2027. That is not necessarily alarming, but it does mean execution bandwidth and key-person dependency deserve attention. James Mackay’s gout experience is a strength and also a concentration risk. If the company mis-hires, scales too slowly, or cannot translate specialist credibility
    into launch infrastructure, the product may remain scientifically valid but commercially under-supported.
