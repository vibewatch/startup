  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Crystalys sells into a three-layer customer stack: patients prescribers and payers'
        blocks:
          - type: paragraph
            body: >-
              Because Crystalys is still pre-approval in the U.S. and Europe, its customer base has to be defined
              structurally rather than by disclosed revenue accounts. The end user is the gout patient who remains
              uncontrolled, intolerant to xanthine oxidase inhibitors, burdened by tophi, or stranded after uricase
              failure. The practical decision-maker is the rheumatologist, with primary-care physicians acting as
              referrers and first-line managers. The economic gatekeeper is the payer, since generic oral therapies keep
              the category price-sensitive and likely force step edits before a branded second-line oral is reimbursed.
              Public evidence suggests Crystalys is intentionally targeting a specialist-led, referral-heavy,
              second-line market rather than mass first-line primary care. Ex-Asia commercialization proves that
              dotinurad can reach real users, but those users are not the same as a disclosed Western customer base. As
              a result, the chapter’s segmentation is built around buyer-user-payer roles, geography, and evidence
              quality rather than around recognized revenue or named paying accounts.
