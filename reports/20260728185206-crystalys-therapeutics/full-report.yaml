  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The thesis is compelling, but the anti-thesis is equally valuation-relevant
        blocks:
          - type: paragraph
            body: >-
              The positive valuation case for Crystalys is easy to articulate. It is developing a late-stage, de-risked,
              once-daily oral URAT1 inhibitor with ex-Asia approvals, large recent financings, and a meaningful
              unmet-need narrative in second-line gout. Market data show gout therapeutics are already a
              multibillion-dollar category, and strategic buyers have recently paid substantial sums for adjacent
              assets. The company also benefits from an unusually strong syndicate for a private biotech at this stage.
              The anti-thesis is just as important. Crystalys is still a one-asset company, Western approval and payer
              access are unresolved, economic leakage from the Urica/Fortress structure is real, and public valuation
              inputs are thin. There is no disclosed post-money valuation, no clear pricing model, no burn/runway
              transparency beyond the cash-raise headline, and no public evidence that Western launch economics will
              match the strategic enthusiasm. This makes the company attractive as an asset story, but underdetermined
              as a price-sensitive investment decision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
