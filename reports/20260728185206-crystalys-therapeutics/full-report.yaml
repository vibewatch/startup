      - number: '8.3'
        title: The right way to value Crystalys is scenario-first and entry-disciplined
        blocks:
          - type: paragraph
            body: >-
              Because the current price is undisclosed and many commercialization variables remain unresolved, any
              valuation view must be conditional. In a bull case, Crystalys produces strong Phase 3 differentiation,
              secures a commercially meaningful second-line label, converts payer skepticism into a manageable
              step-through model, and either pursues a strategic exit or commands a late private / IPO rerating. In a
              base case, the company still creates value but with narrower access, slower adoption, and more dilution
              before launch maturity. In a bear case, trial differentiation, access, or operational readiness underwhelm
              enough to push the company into a weaker financing or a much smaller commercialization opportunity than
              the prevalence story implies. Under that setup, entry discipline matters more than admiration for the
              science. A great company can still be a bad investment at the wrong price, and Crystalys gives outsiders
              little public evidence on which to anchor a clean current fair-value estimate. That is why the report’s
              valuation stance is not “cheap” or “rich,” but “unverifiable.”
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
