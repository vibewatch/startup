    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and asset definition
        blocks:
          - type: paragraph
            body: >-
              Crystalys Therapeutics presents itself as a focused, clinical-stage biopharmaceutical company rather than
              a platform with a broad disclosed pipeline. Across its home, about, and science pages, the company anchors
              its identity on one problem—unmet need in gout—and one lead asset—dotinurad. The official website and
              launch press materials consistently place the company in San Diego, California and frame it as co-founded
              by the executive team together with Catalys Pacific and Novo Holdings. That is important because it makes
              Crystalys look less like a loosely assembled asset shell and more like a sponsor-created company built
              around a single licensing opportunity. The core product claim is also unusually concrete for a private
              biotech at this stage: dotinurad is described as a once-daily, oral, highly selective URAT1 inhibitor
              intended as a second-line therapy for patients who remain uncontrolled or intolerant on first-line
              urate-lowering therapy. Public disclosure is therefore strong on what the company is, what it is trying to
              do, and why gout is the only commercial story that matters today.
