              Where Crystalys does show unusually strong public evidence is capital raising. The company launched with a
              $205 million Series A in 2025 and added an oversubscribed $130 million Series B in July 2026, putting
              disclosed equity financing at about $335 million. That is a serious balance-sheet signal for a company
