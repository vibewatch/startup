            body: >-
              Leadership disclosure is founder-heavy but directionally credible. The 2025 launch release names James
              Mackay as co-founder, president, and chief executive officer, and ties him to decades of drug-development
              experience and multiple approvals. The same release identifies Nihar Bhakta as co-founder and chief
