companyProfile:
  summary: >-
    Crystalys Therapeutics is a San Diego-based private biotech building the Western gout franchise for dotinurad, a
    once-daily oral URAT1 inhibitor already marketed in multiple Asian countries. The company has assembled unusually
    large private financing for a single-asset program, moving RUBY and TOPAZ into Phase 3 while also running the
    AMETHYST study for harder-to-treat patients. That combination gives Crystalys a meaningfully de-risked scientific
    base relative to many private biotech peers, but public underwriting is still limited by sparse disclosure on round
    pricing, revenue expectations, payer strategy, and the downstream economics created by the legacy Fortress/Urica
    transaction.
