              pattern-recognition. Still, the public board picture remains incomplete. The about page lists
              sponsor-affiliated board seats from Catalys Pacific, Novo Holdings, SR One, Perceptive/Xontogeny, and
              Fortress Bio, but it does not provide a full, standardized roster with biographies, committee structure,
              ownership percentages, or control terms. Investors should therefore view the company as led by experienced
              gout operators and sponsors, but still only partially transparent on formal governance.
