      - number: '3.4'
        title: The moat today is evidence package plus timing plus capital, not entrenched network effects
        blocks:
          - type: paragraph
            body: >-
              Crystalys does not yet have the kind of durable moat seen in network businesses or embedded software
              systems. Its current defensibility rests on a more conventional biotech stack: licensed asset quality,
              late-stage development timing, cross-border clinical and commercialization precedent, management
              experience in gout, and enough capital to run pivotal trials and prepare launch. Those are meaningful
              advantages, but they are perishable. Competitors can generate rival data, large incumbents can discount or
              lean on existing physician familiarity, and payers can slow category migration with step edits. The most
              serious adverse signal is historical: lesinurad showed that URAT1-related innovation could still fail to
              become a durable commercial franchise in the U.S. despite regulatory approval. That does not invalidate
              dotinurad, but it means Crystalys must prove better execution, cleaner positioning, and superior market
              education. The company may win a valuable niche, yet the evidence does not support a claim of
              long-duration monopoly power before launch.
