            body: >-
              The most financially important primary document in the public pack is not a revenue statement but the 2024
              Fortress/Urica transaction filing. It shows that Urica transferred rights related to dotinurad into the
              Crystalys structure while retaining meaningful economic interests, including a 35% equity position at
              closing, anti-dilution protection down to 15% until at least $150 million of equity financing had been
