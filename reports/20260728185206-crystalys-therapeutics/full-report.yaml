      - number: '2.4'
        title: Growth is real, but adherence failure generic price compression and pipeline crowding constrain monetization
        blocks:
          - type: paragraph
            body: >-
              The market is attractive because several structural drivers are pushing more patients toward
              treat-to-target urate-lowering therapy: obesity and aging raise prevalence, clinical guidance emphasizes
              keeping serum urate below target, physicians are more willing to intensify chronic therapy, and novel
              agents are expanding the menu beyond xanthine oxidase inhibitors. But the same sources also show why
              monetization is harder than prevalence suggests. Allopurinol adherence remains poor in U.S. survey data,
              with only 35.2% of gout person-years showing high adherence and 27.4% showing no fills at all in the
              reviewed MEPS study. That means unmet need is real, but so is patient inertia. Generic competition is
              another brake. Allopurinol, generic febuxostat, and probenecid create a low-price baseline that any
              branded oral must beat on efficacy, safety, or persistence. At the high-acuity end, pegloticase proves
              that payers will reimburse expensive treatment for refractory disease, but its infusion logistics also
              show how much clinical burden is required to justify premium spend. Finally, Crystalys will not own the
              URAT1 category alone. Sobi’s pozdeutinurad and Atom’s lingdolinurad show that next-generation uricosurics
              are advancing quickly, so the company must win not just against status quo therapy but against a
              tightening late-stage pipeline.
