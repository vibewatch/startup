  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Disease burden is large, but Crystalys is not targeting all gout spend
        blocks:
          - type: paragraph
            body: >-
              Gout is common enough to support a meaningful therapeutics market, but Crystalys is not addressing every
              gout patient or every dollar of gout-related care. JAMA patient guidance says gout affects roughly 9.2
              million people in the United States, or about 3.9% of adults, while other reviewed clinical and market
              sources frame gout as the most common inflammatory arthritis. That prevalence number matters less than
              treatment boundary. Crystalys is not a flare-only company competing with NSAIDs, colchicine, or steroids,
              and it is not currently a biologic uricase company either. Its marketed narrative is a second-line oral
              option for patients who remain uncontrolled or intolerant after first-line xanthine oxidase inhibitors
              such as allopurinol or febuxostat. The addressable spend therefore sits inside a narrower window: chronic
              urate-lowering treatment for patients still inadequately served by generic oral options but not yet
              escalated, or not suitable for, infusion-based refractory-gout therapy such as pegloticase. That boundary
              is economically important because generic first-line therapy compresses pricing expectations even while
              the refractory biologic end of the market proves that payers will spend when disease burden becomes severe
              enough.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
