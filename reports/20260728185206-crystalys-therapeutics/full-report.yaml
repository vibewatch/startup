      - number: '3.2'
        title: Dotinurad is differentiated, but the differentiation must matter clinically and commercially
        blocks:
          - type: paragraph
            body: >-
              Crystalys’ core differentiation claim is that dotinurad is a selective URAT1 inhibitor that has already
              generated substantial human exposure in Japan and China, giving the company a better starting position
              than a de novo U.S.-only program. That matters because the most obvious comparisons split three ways.
              Against allopurinol and febuxostat, dotinurad offers a uricosuric mechanism rather than xanthine oxidase
              inhibition and may fit combination use or switch use in patients who do not reach target serum urate.
              Against probenecid, Crystalys can argue for a more targeted transporter profile and newer development
              package. Against pegloticase, the value proposition is convenience and earlier-line oral use rather than
              extreme urate-lowering power. Still, none of those differentiators are self-executing. Physicians will ask
              whether selectivity translates into better outcomes or tolerability, payers will ask whether it justifies
              a premium over generic oral therapy, and investors must remember that lesinurad also entered the market
              with a differentiated mechanistic story and still failed commercially.
