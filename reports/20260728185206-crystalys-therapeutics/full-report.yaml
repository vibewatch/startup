            title: High prevalence does not equal high monetizable demand
            body: >-
              A 9.2 million-patient prevalence headline is helpful for framing disease burden, but market conversion is
              limited by allopurinol adherence problems, generic price anchors, and the fact that many patients never
              escalate beyond first-line therapy.
            calloutType: risk
