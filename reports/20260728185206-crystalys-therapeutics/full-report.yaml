              company, but they do matter for future economics. Even if dotinurad launches successfully, not all value
              creation will accrue cleanly to new investors or operating-company common. The same filing also
              underscores how little public data exists on launch economics: there is no disclosed transfer-pricing
              structure, no realized reimbursement data, no inventory profile, no COGS guidance, and no sales-force
              efficiency benchmarks. Unit-economics analysis therefore remains mostly a diligence map rather than a
              quantitative model. The practical underwriting question is how much of gross product opportunity can
