      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a good asset story and a bad public pricing story
            body: >-
              Crystalys has the ingredients of a high-value late-stage biotech asset, but outsiders do not know enough
              about the current price or economics to call it cheap or fairly valued.
            calloutType: insight
            claimRefs:
              - CV001
              - CV013
              - CV035
          - type: callout
            title: The nearest strategic comp cuts both ways
            body: >-
              Arthrosi proves that late-stage gout assets can be worth a lot, but it also shows how much strategic value
              may already be embedded in the category before Crystalys reveals its own private price.
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV017
          - type: callout
            title: Recommendation discipline is really price discipline
            body: >-
              Without a disclosed post-money valuation, the right answer is not a soft buy or soft pass. It is watch
              until the price, dilution path, and launch economics become sufficiently concrete.
            calloutType: risk
            claimRefs:
              - CV034
              - CV035
