      - number: '7.4'
        title: The most important risks are monitorable and should be tied to explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              One useful feature of the Crystalys risk profile is that most major risks can be monitored rather than
              merely hand-waved. Regulatory risk can be monitored through trial progress, readouts, and any narrowing of
              label ambition. Operational risk can be monitored through enrollment pace, OLE planning, evidence of
              launch-grade quality systems, and whether the company discloses or demonstrates stronger commercial
              readiness over time. Partner and people risk can be monitored through changes in rights clarity, investor
              behavior, senior-hire quality, and org-build timing. Customer and payer risk can be monitored through how
              management frames second-line access, the degree of differentiation versus allopurinol and peer URAT1
              assets, and whether real-world durability evidence accumulates. The key diligence task is therefore not to
              discover exotic hidden risk, but to decide what threshold would break the investment thesis. In Crystalys’
              case, thesis-breaks likely include disappointing pivotal differentiation, a weak access narrative,
              evidence that quality or supply systems lag too far behind, or capital needs that expand before de-risking
              milestones are reached.
