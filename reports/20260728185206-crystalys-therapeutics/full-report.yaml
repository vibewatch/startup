      - number: '1.3'
        title: Financing chronology, rights transfer, and capital formation
        blocks:
          - type: paragraph
            body: >-
              Capital formation is one of the clearest parts of the public record. Crystalys emerged publicly in
              September 2025 with a $205 million Series A co-led by Novo Holdings, SR One, and Catalys Pacific, then
              returned less than a year later with an oversubscribed $130 million Series B led by Frazier Life Sciences
              and joined by new crossover-style healthcare investors including Wellington Management and HBM Healthcare
              Investments. On a disclosed basis, that puts cumulative equity capital at $335 million. The earlier
              rights-transfer mechanics also matter. Fortress Biotech's July 2024 SEC filing says Urica Therapeutics
              sold dotinurad rights and related intellectual property to Crystalys in exchange for 35% of Crystalys'
              outstanding equity, anti-dilution protection down to a 15% floor until $150 million of equity had been
              raised, a 3% securitized royalty on future net sales, and board-observer plus director rights. Together,
              those facts show that Crystalys is well funded but not cap-table simple: sponsor creation, a meaningful
              legacy rights holder, and large private rounds all shape future economics even before any valuation is
              publicly disclosed.
