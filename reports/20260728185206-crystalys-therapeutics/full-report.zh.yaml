            body: >-
              公开记录没有显示 Crystalys 头上有重大的进行中诉讼阴影，但这并不意味着监管和法律风险小。核心法律—监管问题是西方获批不确定性、标签竞争力、Urica/Fortress
              结构里保留的权利和经济权益，以及公司控制文件和披露的法律洁净度。Crystalys 仍需要成功的关键性数据、监管机构可接受的解读，以及足以支撑二线报销的强上市标签。Urica 交易的 SEC
              文件又加了一层：保留股权、反稀释保护、版税和治理权，意味着 Crystalys 并不是在完全无历史包袱的所有权结构上运营。官方隐私和联系页面也仍露出早期 Aristea
              痕迹；运营上这很小，但作为治理质量信号有意义。简言之，最大的法律风险不是今天已经可见的法庭事件；而是监管、合同或标签层面的现实，可能让商业结果弱于融资叙事暗示。
