    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与资产定义
        blocks:
          - type: paragraph
            body: >-
              Crystalys Therapeutics
              给自己的定位不是拥有广泛披露管线的平台，而是一家聚焦临床阶段的生物制药公司。在首页、关于和科学页面上，公司把身份钉在一个问题——痛风未满足需求——和一个核心资产——dotinurad——上。官网和启动新闻稿一致显示公司位于
              California 州 San Diego，并称其由执行团队与 Catalys Pacific、Novo Holdings 共同创立。这一点重要，因为 Crystalys
              看起来不太像临时拼出的资产壳，更像发起方围绕单一授权机会搭建的公司。核心产品主张在当前私营生物技术阶段也少见地具体：公司把 dotinurad 描述为每日一次口服、高选择性 URAT1
              抑制剂，定位为一线降尿酸治疗后仍控制不佳或不能耐受患者的二线疗法。因此，公开披露在公司是谁、想做什么，以及为什么痛风是今天唯一重要商业故事这三点上较强。
