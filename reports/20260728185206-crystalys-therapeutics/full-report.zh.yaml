      - number: '5.2'
        title: 这里的技术架构不是软件栈，而是机制、证据、运营和权利控制
        blocks:
          - type: paragraph
            body: >-
              对 Crystalys 来说，“架构”指的是把选择性 URAT1 抑制剂变成商业药物的链条：分子机制、临床证据、监管路径、供应和权利控制，以及一线部署。Dotinurad 的核心技术命题是选择性抑制
              URAT1，减少尿酸重吸收，并与降低尿酸生成的黄嘌呤氧化酶抑制剂区分开来。公开研究和公司叙事强调每日一次口服给药、日本和中国带来的临床去风险，以及管理层认为比传统促尿酸排泄药更有针对性的安全性画像。运营模型随后叠加到分子之上：全球
              3 期试验、面向难治细分的美国 2 期、从 Urica 获得的美国 / 欧洲 / MENA 权利版图，以及近期融资支持的商业化准备。这不是全栈药物发现平台，而是一套后期资产架构，把授权
              IP、多地区证据和围绕一个机制的商业化建设结合起来。这让执行依赖异常清楚：如果 dotinurad 失速，整个运营架构都会随之变弱。
