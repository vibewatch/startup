        title: 领导层、治理与运营控制
        blocks:
          - type: paragraph
            body: >-
              管理层披露高度围绕创始团队，但方向上可信。2025 年启动新闻稿点名 James Mackay 为联合创始人、总裁兼 CEO，并把他与数十年药物开发经验和多项获批经历绑定。同一新闻稿还确认 Nihar
              Bhakta 为联合创始人兼 CMO、Ashwin Ram 为联合创始人兼 COO，DeAnne Reid 则是具备痛风开发经验的创始级运营高管。2026 年 2 月，Crystalys 邀请 Horizon
              Therapeutics 前 CEO Tim Walbert 担任独立董事，治理能见度提高。这个任命重要，因为 Horizon 通过 Krystexxa
              打造了美国近年唯一规模可观的痛风商业化特许经营权，Walbert 因此带来直接相关的上市打法判断。不过，公开董事会图景仍不完整。关于页面列出来自 Catalys Pacific、Novo Holdings、SR
              One、Perceptive/Xontogeny 和 Fortress Bio
              的发起方关联董事席位，但没有提供统一完整的董事名单、履历、委员会架构、持股比例或控制条款。因此，投资者应把公司视为由经验丰富的痛风运营者和发起方带领，但正式治理仍只部分透明。
