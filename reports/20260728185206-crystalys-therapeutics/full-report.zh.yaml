companyProfile:
  summary: >-
    Crystalys Therapeutics 是一家位于 San Diego 的私营生物技术公司，围绕 dotinurad 打造西方痛风特许经营权；dotinurad 是一款每日一次口服 URAT1
    抑制剂，已在多个亚洲国家上市。公司为单资产项目集结了异常庞大的私募融资，在推进 RUBY 和 TOPAZ 进入 3 期的同时，也为更难治疗的患者开展 AMETHYST 研究。这个组合让 Crystalys
    相比许多私营生物技术同行拥有明显去风险的科学基础，但轮次定价、收入预期、支付方策略，以及早期 Fortress/Urica 交易带来的下游经济账披露稀疏，公开投资测算仍受限制。
