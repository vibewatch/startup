      - number: '2.3'
        title: 多种规模测算都指向真实市场，但真正落入 Crystalys 范围的只是其中一部分
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场报告确认，痛风已经是一个数十亿美元的治疗品类；它们也说明，Crystalys 需要受约束的规模测算，而不是巨大的患病率标题。Grand View Research 估算 2022
              年全球痛风治疗药物市场为 $2.49B，到 2030 年 CAGR 为 6.25%，北美占 2022 年收入的 47.81%。Mordor Intelligence 给出更高且更新的路径，预计 2025 年为
              $4.24B、2026 年为 $4.52B、2031 年达到 $6.67B，北美占 2025 年价值的 42.43%，口服剂型占 2025 年收入的
              80.32%。这些报告对规模判断不同，但对大轮廓一致：痛风药物已经是大市场；北美是当前最大的收入池；在升级到生物制剂前，口服治疗主导销量和收入。Crystalys 真正可用的 SAM
              不是所有口服痛风治疗，而是医生和支付方认为未满足需求足够高、愿意越过 allopurinol 或选择性 febuxostat
              使用，但仍偏好口服产品而非输注中心疗法的那一组。这个市场足以支撑风险投资级别资本，但远小于 9.2M 患者患病率标题。
