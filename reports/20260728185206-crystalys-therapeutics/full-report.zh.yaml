        title: 运营风险集中在试验执行、上市级 CMC 不透明和单资产集中度
        blocks:
          - type: paragraph
            body: >-
              Crystalys 手里有一项比一般风投生物科技项目中的分子更成熟的资产，但运营风险仍然不小：公司必须把这项资产转成欧美商业化产品。核心运营暴露仍在试验执行——RUBY、TOPAZ 和 AMETHYST
              都需要顺利入组、可信对照、持久安全性，以及可解读的结果。试验之外，公开信息最薄弱的是 CMC
              和质量体系透明度。公开来源没有充分展示上市级制造、放行检测、药物警戒或供应链架构，难以支撑对运营韧性的判断。单一资产集中度又放大问题。一旦 dotinurad
              遇到延误、安全信号、差异化问题或供应问题，公司几乎没有分散余地。亚洲以外获批降低了技术不确定性，但不能替代欧美运营能力。最终风险画像是：科学可行性相对去风险，但执行质量仍可能打破投资论点。
