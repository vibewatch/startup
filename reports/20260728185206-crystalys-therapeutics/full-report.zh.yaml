      - number: '3.2'
        title: Dotinurad 有差异化，但差异化必须在临床和商业上真正有用
        blocks:
          - type: paragraph
            body: >-
              Crystalys 的核心差异化主张是，dotinurad 是选择性 URAT1
              抑制剂，且已在日本和中国积累大量人体使用暴露，让公司的起点好于一个从零开始、只面向美国的项目。这一点重要，因为最直接的比较分成三组。相对 allopurinol 和 febuxostat，dotinurad
              提供促尿酸排泄机制，而不是黄嘌呤氧化酶抑制；对于血尿酸未达标患者，它可能适合联合用药或换药。相对 probenecid，Crystalys 可以主张更有针对性的转运体谱系和更新的开发包。相对
              pegloticase，价值主张不是极端降尿酸能力，而是便利性和更早线的口服使用。不过，这些差异化不会自动兑现。医生会问，选择性是否能转化为更好结局或耐受性；支付方会问，它是否足以支撑高于仿制口服药的溢价；投资者也必须记住，lesinurad
              当年同样带着差异化机制故事进入市场，最后仍在商业上失败。
