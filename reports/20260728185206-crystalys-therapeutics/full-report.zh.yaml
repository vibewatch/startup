  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: Crystalys 面向三层客户栈：患者、开方医生和支付方
        blocks:
          - type: paragraph
            body: >-
              由于 Crystalys
              在美国和欧洲仍未获批，客户基础必须按结构定义，而不是按已披露收入账户定义。终端用户是那些仍控制不佳、不能耐受黄嘌呤氧化酶抑制剂、受痛风石困扰，或尿酸酶治疗失败后无处可去的痛风患者。实际决策者是风湿科医生，初级保健医生则充当转诊方和一线管理者。经济守门人是支付方，因为仿制口服疗法让品类价格敏感，并可能在品牌二线口服药获报销前设置阶梯用药限制。公开证据显示，Crystalys
              有意瞄准一个由专科医生带动、转诊较重的二线市场，而不是大众化一线初级保健。亚洲商业化证明 dotinurad
              能触达真实用户，但这些用户不等同于已披露的西方客户基础。因此，本章的分层围绕买方—用户—支付方角色、地域和证据质量搭建，而不是围绕已确认收入或具名付费账户。
