      - number: '6.4'
        title: 扩张取决于专科转诊和支付方接受度，而集中度仍高
        blocks:
          - type: paragraph
            body: >-
              Crystalys 的先落地再扩张逻辑是临床驱动，而不是合同驱动。公司似乎预期先拿下专科医生主导的二线立足点，再扩大风湿科医生舒适度，并可能随后提升初级保健医生的转诊熟悉度。James Mackay 告诉
              GEN，支付方很可能希望患者先用 allopurinol
              失败，才准备覆盖新药；这进一步说明，扩张多大程度取决于报销顺序，而不是单纯医生热情。这造成几种集中度：一种疾病、一个核心资产、一个主要西方临床主张，以及大痛风患病群体里一个狭窄的初始客户细分。亚洲商业化可能增强信心，但不能消除西方集中风险，因为
              Crystalys
              仍需要支付方拉动、专科医生采用和获批后证据。因此，客户扩张看起来可行，但有门槛。如果公司赢下二线风湿科采用，就能拓宽；如果支付方保持严格控制，或试验差异化不及预期，客户基础可能比痛风患病率标题暗示的更小、更集中。
