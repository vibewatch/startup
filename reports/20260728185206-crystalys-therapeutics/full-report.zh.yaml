      - number: '5.3'
        title: 私营生物技术资产中成熟度较高，但路线图仍取决于试验、权利和运营扩张
        blocks:
          - type: paragraph
            body: >-
              相比多数风险投资支持的生物技术资产，dotinurad 更成熟，因为它不是临床前概念，甚至不是首次人体使用分子。它已在多个亚洲市场获批，有多项已发表研究，并处于美国 /
              欧盟关键性开发阶段。这种成熟度显著降低了科学不确定性。不过，上市成熟度不等于 Crystalys 内部具备完整运营成熟度。公司仍必须完成 3 期执行、收集长期安全性和持久性数据、准备美国 /
              欧盟监管申报、建立商业和医学基础设施，并证明自己能在上市规模下管理制造质量义务。管理层 2026 年的表态显示，Crystalys 预计从很精简的基础上扩充团队，并计划到 2027
              年才启动大规模商业化建设。这造成开发阶段的不对称：分子相对去风险，但围绕它的运营公司仍在搭建。因此，投资者评估执行风险时，应把资产成熟度和组织成熟度分开看。
