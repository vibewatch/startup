  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型概念上简单，但公开牵引力基本缺席
        blocks:
          - type: paragraph
            body: >-
              Crystalys 正在打造一家处方药公司，因此长期收入模型概念上很直接：产品销售、转移定价或许可经济权益，并可能根据地域和合作结构产生里程碑或版税收入。问题在于时间点和公开能见度。公司仍在推进美国 /
              欧盟关键性开发，意味着今天没有已披露的美国或欧洲产品收入可供测算。公司公开材料和融资公告聚焦临床进展及资金用途，而不是已实现销售或单位经济账。Dotinurad
              在日本和中国的美国以外商业化，有助于形成科学和市场先例，但已审阅公开来源没有显示 Crystalys
              自身已在这些地区确认实质商业收入。落到实务上，本章财务工作几乎从零公开运营数据出发：没有报告收入、没有披露毛利率、没有队列 经济账、没有
              CAC、没有支付方返利结构，也没有足够稳健的产品销量指标来建模上市。因此，收入质量仍是未来论点，而不是当前已验证指标。
