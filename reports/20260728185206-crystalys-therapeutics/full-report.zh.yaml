            body: >-
              里程碑节奏连贯，尽管披露深度不均。Crystalys 可以指向 2024 年 7 月权利转让、2025 年 9 月启动融资、2026 年 2 月董事会扩容、2026 年 5 月 AMETHYST
              首例患者入组、2026 年 7 月 RUBY 欧洲站点扩张，以及 2026 年 7 月 Series B。资产本身也带着已有亚洲里程碑，包括 2020 年日本上市，以及 2024–2025
              年中国获批和上市活动。仍披露不足的，正是投资者会用来把这些里程碑转化为定价权和所有权纪律的字段：公司尚未公开当前估值、员工人数、收入或完整股权结构。即便在运营层面，公开网站也不完全干净；联系页面在当前
              Crystalys 坐标旁仍保留早期 Aristea 痕迹。更广的痛风背景也值得警惕。Lesinurad 的商业撤回说明，有效的 URAT1 机制并不保证持久市场成功。因此，Crystalys
