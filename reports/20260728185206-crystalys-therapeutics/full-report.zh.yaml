      - number: '7.4'
        title: 最重要的风险可以监控，也应绑定明确的终止标准
        blocks:
          - type: paragraph
            body: >-
              Crystalys 风险画像的一个有用之处在于，大多数重大风险可以监控，不必只是空泛带过。监管风险可以通过试验进展、读数以及标签雄心是否收窄来跟踪。运营风险可以通过入组速度、OLE
              规划、上市级质量体系证据，以及公司是否逐步披露或证明更强商业化准备来跟踪。合作伙伴和团队风险可以通过权利清晰度变化、投资人行为、高管招聘质量和组织搭建节奏来跟踪。客户和支付方风险可以通过管理层如何表述二线准入、相对
              allopurinol 和同类 URAT1 资产的差异化程度，以及真实世界持久性证据是否累积来跟踪。因此，尽调重点不是去挖奇特隐性风险，而是决定什么阈值会打破投资论点。对 Crystalys
              而言，可能打破论点的情形包括关键试验差异化令人失望、准入叙事乏力、质量或供应体系明显滞后，或资本需求在去风险里程碑到来前膨胀。
