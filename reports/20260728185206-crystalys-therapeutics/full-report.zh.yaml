    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监控触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 关键试验差异化风险
        - RUBY / TOPAZ 疗效和持久性叙事
        - 数据未能证明相对标准治疗有足够强的价值
        - 将评级从上市论证下调为仅剩期权价值论证。
      - - 准入风险
        - 管理层 / 支付方关于别嘌醇失败后序列治疗的证据
        - 准入模型仍窄，支付方开放度弱
        - 大幅下调收入和采用假设。
      - - CMC / 质量风险
        - 供应链和质量体系准备度证据
        - 临近获批仍没有可信的上市准备度证据
        - 将上市时间和利润率假设视为受损。
      - - 资本风险
        - 重大去风险里程碑前需要新融资
        - 临床或准入证据不足前就启动融资
        - 更严厉地建模稀释和治理压力。
      - - 人员风险
        - 到 2027 年搭建商业化和质量领导层
        - 关键招聘延迟或仍不清晰
        - 下调执行信心，并拉长时间线假设。
    notes: 这些是打破投资论证的触发器，不是普通运营观察项。
    claimRefs:
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
