            body: >-
              Crystalys 在资本募集上拿出了异常强的公开证据。公司 2025 年以 $205M Series A 启动，并在 2026 年 7 月追加超额认购的 $130M Series B，使已披露股权融资达到约
              $335M。对一家围绕单一后期资产的公司来说，这是严肃的资产负债表信号，也很可能让管理层比典型小型生物技术公司更灵活，后者往往还要同时为平行 3
              期项目和上市准备融资。但资产负债表强，不等于现金清晰。公开来源没有披露期末现金、月度烧钱速度、跑道月数、债务契约，或临床、制造和商业化各项计划支出的精确时间安排。投资者只能从轮次规模、投资人质量和披露的资金用途推断资本充足性，而不是依靠硬性的现金管理数字。结果是一幅有利但不完整的图景：Crystalys
              看起来比许多同行资金更足，但缺少账上现金和烧钱披露，无法建立真正的跑道模型。
