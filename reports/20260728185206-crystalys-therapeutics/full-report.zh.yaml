        title: 财务结论是“推进资金充足，精确建模披露不足”
        blocks:
          - type: paragraph
            body: >-
              把现有证据放在一起，Crystalys
              在狭义上具备财务可信度：它已融到足够资本，值得认真看待，也有足够投资人支持继续推进后期开发。这是正面案例。负面案例是，投资者做传统测算所需的几乎每个指标——收入、已实现定价、毛利率、现金消耗、跑道、营运资本、销售效率，以及扣除合作伙伴义务后的净经济账——都没有出现在开放来源里。由于资产在公司的核心西方市场仍未获批，这种缺席并不意外，但它具有决定性。公开证据支持一个判断：短期融资风险低于许多私营生物技术同行，但中期稀释和商业化融资风险仍然存在。今天最站得住的财务结论，不是
              Crystalys 按经营指标看便宜或昂贵；而是 Crystalys 有足够资本去冲击主要价值拐点，但如果没有管理层尽调，透明度不足以支撑严谨的自下而上回报模型。
