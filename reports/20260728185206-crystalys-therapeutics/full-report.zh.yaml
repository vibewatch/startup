      - number: '2.4'
        title: 增长真实存在，但依从性失败、仿制药压价和管线拥挤限制变现
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，是因为几股结构性力量把更多患者推向达标降尿酸治疗：肥胖和老龄化抬高患病率，临床指南强调把血尿酸维持在目标以下，医生更愿意强化慢性治疗，新药也在把选择扩展到黄嘌呤氧化酶抑制剂之外。但同一批来源也说明，变现比患病率暗示的更难。美国调查数据里，allopurinol
              依从性仍差；已审阅 MEPS 研究显示，只有 35.2% 的痛风人年呈现高依从性，27.4% 完全没有配药记录。这意味着未满足需求真实存在，患者惯性也同样真实。仿制药竞争是另一道刹车。Allopurinol、仿制
              febuxostat 和 probenecid 建立了低价基线，任何品牌口服药都必须在疗效、安全性或持续用药上胜出。高严重度一端，pegloticase
              证明支付方会为难治性疾病报销昂贵治疗，但其输注物流也显示，需要多大的临床负担才能合理化高价支出。最后，Crystalys 不会独占 URAT1 品类。Sobi 的 pozdeutinurad 和 Atom 的
              lingdolinurad 说明，下一代促尿酸排泄药正在快速推进，因此公司不只要赢过既有疗法，还要面对不断收紧的后期管线。
