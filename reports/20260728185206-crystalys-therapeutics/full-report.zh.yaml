      - number: '2.2'
        title: 开方医生、患者和支付方共同塑造采用路径，没有单一买方能控制全链路
        blocks:
          - type: paragraph
            body: >-
              痛风的买方—用户—支付方结构，比一个患病率数字暗示的更复杂。用户是反复急性发作、痛风石风险、疼痛、肾脏共病或心血管顾虑缠身的患者。实际买方通常是开方医生——常见是初级保健医生或风湿科医生——由他们决定是否上调
              allopurinol、改用 febuxostat、加用促尿酸排泄药，或升级到
              pegloticase。财务守门人是支付方，因为口服仿制药很便宜，而品牌二线或难治性疗法需要更强的覆盖叙事。指南和标签来源把采用路径讲得很清楚：一线 allopurinol 便宜且熟悉；febuxostat
              可用但受心血管黑框警告限制；probenecid 是肾脏尿酸排泄选择，用途更窄；pegloticase 留给难治性疾病，并需输注和监测。Crystalys
              想站在仿制黄嘌呤氧化酶抑制和输注尿酸酶之间的临床与经济缺口里。这意味着，市场份额将取决于医生是否愿意更早换药、患者是否愿意长期坚持降尿酸治疗，以及支付方是否愿意在极便宜的既有对照疗法之外报销一款溢价口服药。
