      - CV022
  - id: TV005
    title: 投资论点失效与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 关键疗效或差异化不及预期
        - 数据无法支撑清晰的二线溢价逻辑
        - 同时削弱获批、准入和退出叙事
        - 除非价格大幅重置，否则从观察转为放弃。
      - - 数据之后准入仍窄
        - 支付方看起来不愿突破严格的用药失败顺序
        - 限制渗透率和峰值销售逻辑
        - 下调情景区间，并要求更深折扣。
      - - 私募尽调显示未披露估值偏激进
        - 实际价格在证据到来前已嵌入接近乐观情景的结果
        - 即便资产不错，也会压缩回报潜力
        - 拒绝按该轮价格 / 估值标记入场。
      - - 强去风险里程碑前又融资
        - 证据之前已出现摊薄
        - 暗示资本效率弱于叙事，或路径更难
        - 重做持股比例和回报假设。
      - - CMC / 上市准备明显滞后
        - 临近监管窗口仍没有可信的上市级运营证据
        - 推迟收入并抬高执行风险
        - 拉长时间线并降低确信度。
    notes: 这些触发因素界定的是观察如何变成放弃，而不只是哪些情况会让人不舒服。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前轮价格 / 投后估值
        - 确切股价、投后估值和股权结构表背景
        - 没有价格，就无法测算当前回报
        - 管理层 / 领投方尽调材料
      - - 烧钱与资金跑道
        - 手头现金、月度消耗、下一次融资阈值
        - 需要把融资强度转换成按时间展开的模型
        - 财务尽调和董事会材料
      - - 总价净价差和支付方准入
        - 价格假设、返利、阶梯用药限制和上市准入研究
        - 决定二线标签能否变成真实业务
        - 商业化 / 市场准入尽调
      - - 经济负担
        - 版税、反摊薄和保留权益的完整影响
        - 决定新投资人实际拿到多少股权价值
        - 法务 + 股权结构表尽调
      - - 组织准备度
        - 商业化、CMC 和质量负责人到上市阶段的深度
        - 决定价值能否按时兑现
        - 管理层组织架构审查
    notes: 这些问题足以把判断从叙事质量推进到真实入场纪律。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV034
      - CV037
      - CV038
