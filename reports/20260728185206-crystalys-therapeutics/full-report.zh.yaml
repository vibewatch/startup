  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 疾病负担很大，但 Crystalys 并不瞄准全部痛风支出
        blocks:
          - type: paragraph
            body: >-
              痛风足够常见，可以支撑一个有分量的治疗市场，但 Crystalys 并不覆盖每个痛风患者，也不覆盖痛风相关护理的每一美元。JAMA 患者指南称，美国约有 9.2M 人患痛风，约占成年人
              3.9%；其他已审阅的临床和市场来源也把痛风描述为最常见的炎症性关节炎。相比患病人数，治疗边界更关键。Crystalys 不是只治疗急性发作、与
              NSAIDs、秋水仙碱或类固醇竞争的公司，目前也不是尿酸酶生物制剂公司。公司的市场叙事是一款二线口服选择，面向接受 allopurinol 或 febuxostat
              等一线黄嘌呤氧化酶抑制剂后仍控制不佳或不能耐受的患者。因此，可触达支出落在更窄的窗口里：慢性降尿酸治疗中，那些仍未被仿制口服药充分服务、但尚未升级到或不适合 pegloticase
              等输注型难治性痛风疗法的患者。这个边界在经济上重要，因为仿制一线疗法会压低定价预期，而市场的难治性生物制剂高端又证明，一旦疾病负担足够严重，支付方愿意花钱。
