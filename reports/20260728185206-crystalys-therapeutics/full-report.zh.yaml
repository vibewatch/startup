  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Crystalys 只有一个核心资产，但定位覆盖多条临床工作流
        blocks:
          - type: paragraph
            body: >-
              Crystalys 今天卖的不是工具包，也不是宽管线平台；它围绕一个核心产品资产 dotinurad，以及围绕这个资产的一套紧密开发系统搭建业务。按工作流看，dotinurad
              旨在位于一线黄嘌呤氧化酶抑制剂疗法之后、pegloticase 等生物制剂终末选择之前。这个定位在同一资产里创造了多个使用场景：allopurinol
              控制不足后的二线降尿酸治疗，不能耐受或禁用黄嘌呤氧化酶抑制剂患者的治疗，痛风石患者支持，以及围绕现有标准治疗的潜在联合或互补使用。因此，资产在 SKU 层面简单，在临床工作流层面却有细节。Crystalys
              的产品章节最好理解为一个单资产运营模型，带有多条部署路径，每条路径都绑定独立证据包：RUBY 用于更广泛痛风，TOPAZ 用于痛风石疾病，AMETHYST
              用于难治患者，亚洲商业化经验则提供真实世界产品成熟度信号。
