  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Crystalys B 轮背景
        - 私募融资规模
        - $130M 超额认购 B 轮；估值未披露
        - 显示市场在后期私募阶段仍愿意为该资产买单
        - 未公开轮次价格或股本数。
      - - Arthrosi / pozdeutinurad 出售给 Sobi
        - 战略交易价值
        - 最高总额 $1.5B；$950M 首付款 + $550M 里程碑
        - 后期 URAT1 同类资产最直接的战略可比交易
        - 战略协同和里程碑让直接映射并不完美。
      - - Sobi CMD 对 pozdeutinurad 的展望
        - 峰值销售框架
        - 峰值销售预期 >SEK 10bn
        - 显示战略买家如何给痛风长期上行空间定价
        - 峰值销售乐观不等于现值，也不等于 Crystalys 估值。
      - - NASP / 未控制痛风路径
        - 监管和市场背景
        - BLA 已受理；美国未控制痛风人群 ~200k；Sobi CMD 给出的 NASP 峰值销售为 4-6bn SEK
        - 证明更窄的高严重度痛风细分市场仍能吸引重大投资关注
        - 机制不同，且用在更后线的输注使用场景。
      - - 公开市场痛风治疗品类
        - TAM 背景
        - 全球市场估算在数十亿美元区间
        - 支撑该品类足够大，能吸引战略兴趣
        - 品类 TAM 不等于股权价值。
    enumerationScope:
      coverage: partial
      basis: >-
        Public comps capture strategic and category context, but they do not provide a disclosed direct valuation
        multiple for Crystalys because its own round price is private.
    notes: 本表有意混合交易可比、战略展望和品类背景，因为没有单一公开可比对象能完整捕捉 Crystalys 后期私募阶段的位置。
