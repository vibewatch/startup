      - number: '8.4'
        title: 建议：关注，待价格清晰且商业化测算细节到位
        blocks:
          - type: paragraph
            body: >-
              本报告给出的建议是关注，置信度为中等。这不是否定资产。相反，证据支持 Crystalys
              已经搭起一个严肃的后期项目：资本支持强，市场切口合理，可比证据显示痛风领域存在真实战略价值。今天不建议投资，原因在于公开证据还没有补齐价格。投后估值未披露。保留权益、gross-to-net
              定价、支付方排序、上市成本和组织扩张准备对经济性的具体影响仍然太不清楚，难以下高置信度判断。若进入价格合适，尤其是关键数据和准入工作对齐，公司可能非常有吸引力。但在不知道实际价格、也没有更好测算输入的情况下，最干净的投资判断是继续跟踪、保持尽调在线，并要求以里程碑和价格为锚的进入纪律，而不是给一个泛泛的质量分。
