  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 3 期差异化清晰，二线报销跑出牵引力，战略退出或后期私募估值大幅重估
        - 按战略交易可比逻辑看，结果接近后期生物科技资产的高位区间；方向性价值区间会明显高过当前未披露的私募估值标记
        - 准入和运营执行仍必须守住
        - 存在可能，但证据还不完整
      - - 基准
        - 获批路径够用，准入更窄，采用更慢，规模化前还会继续摊薄
        - 仍能创造价值，但回报高度取决于入场价格和摊薄路径
        - 支付方摩擦和组织规模化滞后会压缩上行空间
        - 最符合现有证据的公开情景
      - - 悲观
        - 差异化偏弱，准入推迟，或融资需求高于预期
        - 战略溢价消失，价值收敛到小得多的可选性案例
        - 单一资产集中度和经济负担占主导
        - 读数前无法排除
    notes: 由于当前价格未披露，本表只定性呈现回报逻辑，不假装知道当前 IRR。
