  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真实竞争格局包括仿制药、生物制剂、既往 URAT1 失败案例和新一代 URAT1 同行
        blocks:
          - type: paragraph
            body: >-
              Crystalys 进入的不是空场。最重要的竞争者仍是现有标准治疗：作为一线降尿酸药的 allopurinol，作为更选择性黄嘌呤氧化酶抑制剂但背着安全性包袱的 febuxostat，作为较老促尿酸排泄药的
              probenecid，以及作为难治性疾病高负担生物制剂选项的 pegloticase。这些产品重要，因为它们定义了当下市场的阶梯用药逻辑和预算天花板。Crystalys
              随后还面对第二个竞争圈：失败或部分被替代的前代产品，以及更新的后期 URAT1 进入者。Lesinurad 虽已退出美国市场，仍然重要，因为它说明机制新颖性本身不能保证采用。Sobi 控制的
              pozdeutinurad 和 Atom 的 lingdolinurad 也重要，因为它们暗示 Crystalys
              在下一代促尿酸排泄药里可能不会拥有很长的无竞争窗口。因此，公司同时在和既有临床习惯、低价口服替代品，以及一批崛起的机制相邻品牌资产竞争。
