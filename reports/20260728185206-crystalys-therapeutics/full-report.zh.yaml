        title: 留存是客户故事最弱的一环，因为公开指标几乎缺席
        blocks:
          - type: paragraph
            body: >-
              如果 Crystalys 已在美国或欧洲商业化，一个强客户章节应能展示留存
              cohort、续用行为、依从性持续、医生重复开药频率或支付方持续性。公开市场上没有这些信息。即便是亚洲商业化历史，也主要通过汇总治疗患者数和获批 / 上市里程碑描述，而不是通过 Crystalys
              自身掌握的重复购买、续方持续性或市占率轨迹描述。确实存在一些间接耐久性信号。日本长期研究和换药研究显示，该产品可以超出单次急性互动持续使用，3
              期后的计划性开放标签延长期也说明管理层理解耐久性数据的价值。但这些仍是临床证据代理，而不是客户留存指标。结果是客户故事一分为二：利益相关方愿意尝试这条产品路径的证据强，真实商业环境中使用如何持续的证据弱，西方市场上关于满意度、流失率或合同式耐久性的公开指标则没有。
