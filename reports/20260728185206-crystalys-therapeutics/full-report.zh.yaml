      - number: '8.2'
        title: 公开可比交易提示战略价值，但无法锁定 Crystalys 当下公允价值
        blocks:
          - type: paragraph
            body: >-
              可比证据有帮助，但不能定论。最清晰的战略可比是 Arthrosi：Sobi 同意以最高 $1.5 billion 收购该公司，其中包括 $950 million 首付款和最高 $550 million
              里程碑付款，目标是一项面向进展性和痛风石性痛风的后期 URAT1 同类资产。随后，Sobi 在 2026 Capital Markets Day 将 pozdeutinurad 峰值销售预期设在 SEK 10
              billion 以上，进一步强化了信心。战略买家显然相信，差异化痛风资产可以做大。NASP 提供了另一类可比：一种后线未控制痛风生物制剂，已获得 BLA 受理，并围绕约 200,000
              名美国未控制患者展开叙事，说明即便更窄、病情更重的痛风细分，也能支撑重大开发和商业化投入。但可比仍有边界。Arthrosi 被战略买家收购，协同和时间表不同。NASP 是输注疗法，不是口服 URAT1
              抑制剂。Crystalys 还有自身经济包袱和价格不透明。因此，公开可比支撑的是「品类有价值」，而不是精确的当前公允价值。
