            body: >-
              资本形成是公开记录里最清楚的部分之一。Crystalys 在 2025 年 9 月以 $205M Series A 公开亮相，这轮由 Novo Holdings、SR One 和 Catalys Pacific
              共同领投；不到一年后，公司又完成由 Frazier Life Sciences 领投的超额认购 $130M Series B，Wellington Management、HBM Healthcare
              Investments 等新的 crossover 型医疗投资者参投。按披露口径，累计股权资本达到 $335M。更早的权利转让机制也很关键。Fortress Biotech 2024 年 7 月 SEC
              文件显示，Urica Therapeutics 将 dotinurad 权利及配套知识产权出售给 Crystalys，换取 Crystalys 35% 已发行股权、反稀释保护（在股权融资达到 $150M 前下限为
              15%）、未来净销售额 3% 的证券化版税，以及董事会观察员和董事权利。合在一起，这些事实说明 Crystalys
              资金充足，但股权结构并不简单：发起方创设、重要早期权利持有人和大额私募轮次，会在任何估值公开前就共同塑造未来经济账。
