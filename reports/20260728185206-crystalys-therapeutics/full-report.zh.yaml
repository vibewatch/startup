  - id: TV002
    title: 投资论证 / 反论证表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 后期去风险口服资产，具备亚洲以外先例和强联合投资方支持
        - 如果关键差异化清晰、估值纪律披露，观点会进一步增强。
      - - 痛风市场大，战略买家兴趣支撑上行空间
        - 如果二线准入明显窄于管理层预期，观点会削弱。
      - - 单一资产集中和价格不透明，无法给出干净的买入结论
        - 如果披露轮次定价、现金消耗可见度提高、上市经济性更清楚，观点会改善。
      - - 权利和经济负担会削弱股权端可拿到的收益
        - 如果股权结构表 / 版税测算细节更清楚，且未来稀释有限，观点会改善。
    notes: 反论证不是科学层面的批评，而是投资测算层面的批评。
