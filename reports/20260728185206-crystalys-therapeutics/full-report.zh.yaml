      - number: '7.3'
        title: Crystalys 依赖合作伙伴、资金方和仍精简的领导梯队
        blocks:
          - type: paragraph
            body: >-
              Crystalys 仍在围绕单一产品搭组织，合作伙伴和团队风险比大型商业化生物制药公司更重要。权利链条依赖最初与 Fuji 和 Urica
              相关的协议。投资人支持很强，但资金仍是变量：后期开发、长期延长期、上市准备和获批后证据都可能比预期更烧钱。相对于同时运行多项全球试验并规划商业化的雄心，公司看起来也偏精简。行业媒体报道称，公司 2026 年约有
              14 名员工，预计年底增至约 25 人，商业化基础设施要到 2027 年才启动。这不一定是警讯，但意味着执行带宽和关键人依赖值得关注。James Mackay
              的痛风经验是优势，也是集中度风险。如果公司招错关键人、扩张太慢，或无法把专科可信度转成上市基础设施，产品在科学上可能仍成立，但商业化支撑会不足。
