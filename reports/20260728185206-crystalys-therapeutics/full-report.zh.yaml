              周围的信任图景有好有坏，这对私营临床阶段生物技术公司很典型。正面看，公司的试验已经注册，资产在亚洲有上市先例，已发表研究也给外部人留下可检查的真实技术记录。药物机制、目标人群和终点表述清晰。负面看，制造控制、商业质量体系、正式认证、药物警戒基础设施，以及隐私
