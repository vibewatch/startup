  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正向论点有吸引力，反向论点同样影响估值
        blocks:
          - type: paragraph
            body: >-
              Crystalys 的正向估值故事不难讲。公司在开发一个后期、已去风险、每日一次口服的 URAT1
              抑制剂，已有亚洲以外获批、大额近期融资，以及二线痛风中有意义的未满足需求叙事。市场数据显示，痛风治疗已经是数十亿美元级品类，战略买家近期也为相邻资产支付了大额对价。以这一阶段的私营生物科技公司来看，公司还拥有异常强的投资人组合。反向论点同样重要。Crystalys
              仍是一家单一资产公司，欧美获批和支付方准入没有解决，Urica / Fortress 结构造成的经济漏损真实存在，公开估值输入也很薄。没有披露投后估值，没有清晰定价模型；除了融资标题之外，没有现金消耗 /
              现金跑道透明度；也没有公开证据证明欧美上市经济性会匹配战略热情。因此，公司作为资产故事很有吸引力，但作为价格敏感型投资决策，仍缺少定论。
