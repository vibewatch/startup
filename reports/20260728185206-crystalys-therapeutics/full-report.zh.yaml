      - number: '3.3'
        title: Crystalys 面对低价既有产品、不清晰的美国定价，以及只是中等水平的换药成本
        blocks:
          - type: paragraph
            body: >-
              痛风领域的竞争力更多受治疗习惯、药品目录排序和相对负担影响，而不是技术锁定。Allopurinol 便宜且熟悉，因此成为默认对照。Febuxostat 也已仿制，但受安全性认知限制。Probenecid
              更老、用途更窄，却仍锚定了一个观念：促尿酸排泄疗法并不自动值得溢价。Pegloticase 位于另一端：它是专科产品，需要输注中心交付，患者负担更高，也为严重难治性疾病提供更强的报销叙事。Crystalys
              很可能把 dotinurad
              放在这两个极端之间，但这意味着没有一个显然有利于公司的清晰定价参照。公开来源没有披露预期美国净价、折扣结构或合同策略。换药成本也真实存在，但不算压倒性。只要血尿酸仍未受控，患者和医生可以在口服方案之间切换，因此优势更取决于证据、准入和一线执行，而不是硬锁定。这会压低垄断潜力，但只要临床故事足够有说服力，仍留有抢份额空间。
