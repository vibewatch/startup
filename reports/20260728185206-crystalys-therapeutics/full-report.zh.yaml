        title: Crystalys 应先做情景估值，并严守进入纪律
        blocks:
          - type: paragraph
            body: >-
              当前价格未披露，许多商业化变量也没有解决，任何估值判断都必须有条件。乐观情景下，Crystalys 做出强 Phase 3
              差异化，拿到具有商业意义的二线标签，把支付方怀疑转成可控的阶梯准入模型，并寻求战略退出，或在后期私募 / IPO
              中重估。基准情景下，公司仍创造价值，但准入更窄、采用更慢，上市成熟前稀释更多。悲观情景下，试验差异化、准入或运营准备不足，把公司推向更弱融资，或使商业化机会远小于患病率故事暗示的规模。在这种设定下，进入纪律比欣赏科学更重要。好公司在错误价格上仍可能是坏投资；Crystalys
              给外部人的公开证据太少，无法锚定清晰的当前公允价值估计。因此，本报告的估值立场不是「便宜」或「贵」，而是「无法验证」。
