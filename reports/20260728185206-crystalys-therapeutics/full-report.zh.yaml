        blocks:
          - type: paragraph
            body: >-
              Crystalys 最强的公开采用证据不是发票或订阅指标，而是运营信号：亚洲市场已上市使用，注册导向试验首例患者给药，站点扩展到欧洲，以及一个围绕明确未满足需求队列设计的难治患者 2
              期试验。公司科学页面现在称，dotinurad 自 2020 年以来已用于治疗超过 2.2M 名患者，而 2025 年启动材料提到的治疗患者超过
              1.2M。这个差异不否定使用事实，但会削弱治疗患者信息精确性的可信度。西方市场里，更干净的证据是试验活动。AMETHYST 已完成首例患者给药，目标招募约 90 名 XOI
              不耐受或尿酸酶治疗失败后的参与者。RUBY 已扩展到欧洲站点，TOPAZ
              继续推进痛风石疾病。这些不是商业客户，却是强的商业化前采用信号，说明研究者、站点和合格患者都在参与项目。因此，采用轨迹真实存在，但仍处于收入前阶段，并由证据中介。
