      - number: '4.3'
        title: Urica 与 Fortress 的经济权益比任何公开损益表更重要，因为它们决定 Crystalys 最终可能留下什么
        blocks:
          - type: paragraph
            body: >-
              公开材料包里财务上最重要的原始文件，不是收入报表，而是 2024 年 Fortress/Urica 交易申报文件。文件显示，Urica 将 dotinurad 权利转入 Crystalys
              结构，同时保留了有分量的经济权益，包括交割时 35% 的股权、在至少 $150M 股权融资完成前下限为 15% 的反稀释保护、年净销售额 3% 的版税，以及治理权。这些条款不会否定公司，但确实影响未来经济账。即使
              dotinurad 成功上市，并非所有价值创造都会干净地归于新投资者或运营公司普通股股东。同一份文件也凸显了上市经济账公开数据的稀缺：没有披露转移定价结构，没有已实现报销数据，没有库存画像，没有 COGS
              指引，也没有销售队伍效率基准。因此，单位经济账分析目前更多是一张尽调地图，而不是量化模型。实际投资测算问题是，在公司需要更多资本之前，产品总机会有多少能在版税、稀释和上市开支后留下。
