- id: trust-safety-quality-and-gaps
  title: Safety and clinical governance look stronger than public quality-system disclosure
  body: The trust picture around Crystalys is mixed in a way that is typical for a private clinical-stage biotech. On the positive side, the company’s trials are registered, its asset has marketed precedent in Asia, and published studies give outsiders a real technical record to inspect. The drug’s mechanism, target population, and endpoints are clearly articulated. On the negative side, public documentation on manufacturing controls, commercial quality systems, formal certifications, pharmacovigilance infrastructure, and privacy/compliance posture is thin. The company does maintain public privacy disclosures, but even those official pages still show traces of legacy Aristea language, which is a small but useful reminder that corporate-process maturity may lag financing scale. There is also no public status page, no obvious quality dashboard, and limited external evidence about supply-chain partners or CMC readiness. That does not mean those systems are absent; it means they are not publicly
    inspectable. The trust conclusion is therefore that Crystalys looks clinically serious, but not yet institutionally transparent enough to prove launch-grade operating controls from open sources alone.
