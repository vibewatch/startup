tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Dotinurad core asset
    - Rheumatologist / gout patient
    - Late-stage; marketed in parts of Asia, Phase 3 in U.S./EU
    - Selective once-daily oral URAT1 inhibitor with ex-Asia precedent
    - Need full U.S./EU label strategy and commercial launch assumptions.
  - - RUBY program
    - Broad gout population inadequately controlled on current care
    - Phase 3 ongoing
    - Compares dotinurad against stable-dose allopurinol in pivotal setting
    - Need full protocol execution quality and readout timing confidence.
  - - TOPAZ program
    - Tophaceous gout patients
    - Phase 3 ongoing
    - Focuses on higher-burden tophaceous segment
    - Need tophus endpoint and durability readout quality.
  - - AMETHYST program
    - Patients intolerant to XOIs or failed uricase
    - Phase 2 ongoing
    - Extends asset into difficult-to-treat second-line niche
    - Need proof that niche expansion will support approval or payer leverage.
  - - Ex-Asia commercialization evidence
    - Future Western prescribers and regulators indirectly
    - Already commercialized via partners in Japan/China and other Asian markets
    - Provides human exposure and marketability precedent
    - Need economic and pharmacovigilance detail by territory.
  notes: Crystalys is essentially a single-asset company, so modules here are evidence and deployment layers around dotinurad rather than separate commercial SKUs.
