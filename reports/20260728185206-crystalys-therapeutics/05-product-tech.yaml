callouts:
- calloutType: insight
  title: This is a one-asset operating system, not a pipeline platform
  body: Crystalys’ technical story is not breadth but focus. The company wraps one selective URAT1 asset in multiple clinical workflows and multiple regions of evidence, which boosts clarity but also concentrates technical risk.
  claimRefs:
  - CE002
  - CE006
  - CE016
  - CE024
- calloutType: risk
  title: Asset maturity exceeds company-process transparency
  body: Dotinurad itself is unusually mature for a private biotech asset, yet open sources do not prove that Crystalys already has launch-grade CMC, quality, privacy, and operating controls.
  claimRefs:
  - CE024
  - CE028
  - CE037
  - CE039
  - CE040
- calloutType: risk
  title: The operating stack still depends on one molecule delivering
  body: Because Crystalys is effectively organized around dotinurad, a clinical, regulatory, or supply setback would undermine not just one program but the entire product architecture.
  claimRefs:
  - CE016
  - CE018
  - CE020
  - CE033
