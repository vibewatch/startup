- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Crystalys solution
  - Measurable benefit
  - Limitation
  rows:
  - - Lower uric acid after first-line failure
    - Escalate/titrate allopurinol, consider febuxostat, sometimes remain uncontrolled
    - Second-line oral dotinurad positioning in RUBY
    - Potential better control while staying oral
    - Requires payer acceptance after generic failure.
  - - Treat patients intolerant to XOIs
    - Limited options beyond workaround prescribing or later escalation
    - AMETHYST targets XOI-intolerant/contraindicated population
    - Could open a niche with strong unmet need
    - Current support is still Phase 2 and pre-approval.
  - - Address tophaceous disease before biologic boundary
    - Standard oral therapy may be insufficient before infusion escalation
    - TOPAZ explores tophaceous-gout evidence package
    - May improve control in a high-burden subset
    - Needs convincing clinical outcomes beyond urate lowering.
  - - Offer an oral option before or after uricase failure
    - Patients who fail pegloticase have few alternatives
    - AMETHYST includes prior uricase failure segment
    - Creates salvage-path relevance
    - Very narrow segment; commercial size uncertain.
  notes: Benefits are framed as potential because U.S./EU registration-directed outcomes are still pending.
