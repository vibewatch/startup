- id: mechanism-architecture-and-operating-model
  title: The technology architecture is less software stack and more mechanism evidence operations and rights control
  body: 'For Crystalys, “architecture” means the chain that turns a selective URAT1 inhibitor into a commercial medicine: molecular mechanism, clinical evidence, regulatory pathway, supply and rights control, and field deployment. Dotinurad’s core technical proposition is selective inhibition of URAT1, reducing uric acid reabsorption and differentiating the product from xanthine oxidase inhibitors that reduce uric acid production. Public studies and company narratives emphasize once-daily oral dosing, clinical de-risking from Japan and China, and a safety profile that management argues is better targeted than legacy uricosurics. The operating model then stacks on top of the molecule: global Phase 3 trials, a U.S.-focused Phase 2 for difficult-to-treat segments, rights obtained from Urica for the U.S./Europe/MENA footprint, and commercialization preparation funded by recent financing. This is not a full-stack drug-discovery platform but a late-stage asset architecture combining licensed IP,
    multi-region evidence, and a commercialization build around one mechanism. That makes execution dependency unusually visible: if dotinurad stumbles, the whole operating architecture weakens with it.'
