  rows:
  - - URAT1 selectivity
    - Core biological mechanism for urate lowering
    - Molecule potency/selectivity and clinical translation
    - Clinical benefit may not fully exceed incumbent generics.
  - - Once-daily oral dosing
    - Patient convenience and positioning versus infused biologics
    - Formulation reliability and adherence
    - Convenience alone may not justify premium pricing.
  - - Ex-Asia evidence package
    - Supports confidence in human exposure and real-world use
    - Access to partner data and regional precedent
    - May not transfer cleanly into Western label or payer logic.
  - - Global pivotal trials
    - Generate registration evidence for U.S./EU
    - Recruitment, site quality, data integrity, comparator choice
    - Trial delays or weaker-than-expected differentiation can damage thesis.
  - - Rights chain via Urica/Fuji
    - Enables territorial control for commercialization
    - License continuity and retained economic obligations
    - Royalty/rights structure can dilute retained economics or complicate control.
  notes: Architecture here refers to the biopharma operating stack around one asset, not a software codebase.
