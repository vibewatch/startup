chapter:
  number: 5
  title: Product & Technology
  summary: Crystalys is effectively a focused product company organized around one late-stage asset, dotinurad, rather than a diversified platform. The product story is strong on mechanism clarity, ex-Asia clinical and commercial precedent, and a targeted second-line workflow; it is weaker on public manufacturing detail, formal quality disclosures, and visible operational infrastructure beyond what the clinical program itself implies.
sections:
- id: asset-definition-and-workflow-position
  title: Crystalys delivers one core asset, but it is positioned across several clinical workflows
  body: 'Crystalys is not selling a toolkit or broad pipeline platform today; it is building around one core product asset, dotinurad, and one tightly related development system around that asset. In workflow terms, dotinurad is meant to sit after first-line xanthine oxidase inhibitor therapy but before biologic end-stage options such as pegloticase. That positioning creates multiple use cases inside the same asset: second-line urate lowering after inadequate allopurinol control, treatment for patients intolerant or contraindicated to xanthine oxidase inhibitors, support for patients with tophaceous disease, and potentially combination or complementary use around existing standard of care. The asset is therefore simple at SKU level but nuanced at clinical-workflow level. Crystalys’ product chapter is best read as a single-asset operating model with several deployment pathways, each tied to a separate evidence package: RUBY for broader gout, TOPAZ for tophaceous disease, AMETHYST for difficult-to-treat
    patients, and ex-Asia commercialization experience for real-world product maturity signals.'
  claimRefs:
