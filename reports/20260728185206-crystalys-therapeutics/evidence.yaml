    severity: minor
    topic: patient-exposure
    missingEvidence: >-
      A reconciled company explanation for why treated-patient disclosure moved from 1.2M+ in Sep-2025 to 2.2M+ on the
      Jul-2026 science page.
    whyItMatters: >-
      The discrepancy does not break the thesis, but it weakens confidence in headline proof points and external
      messaging discipline.
    diligencePath: Ask management to reconcile the definitions, time windows, and geography behind both patient-exposure figures.
    relatedQuestionRefs:
