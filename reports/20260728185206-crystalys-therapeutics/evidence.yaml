  - id: GO001
    type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Current post-money valuation price per share preference stack and any secondary liquidity terms from the Series B.
    whyItMatters: >-
      Entry price and liquidation structure determine whether Crystalys' strong asset story is investable at current
      terms.
    diligencePath: Request the latest term sheet cap table and board-approved financing summary from the company or lead investors.
    relatedQuestionRefs:
      - QO010
  - id: GO002
    type: private-evidence-only
    severity: material
    topic: headcount-and-scale
    missingEvidence: >-
      Official headcount functional organization chart and current operating budget by clinical commercial and G&A
      function.
    whyItMatters: >-
      Capital sufficiency and launch readiness cannot be underwritten from funding totals alone without a view on
      organizational scale.
    diligencePath: Request current headcount by function, hiring plan, and board materials on commercialization buildout.
    relatedQuestionRefs:
      - QO012
