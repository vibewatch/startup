- id: adoption-proof-and-trajectory
  title: Real adoption proof exists, but it is mostly indirect for the U.S./EU launch story
  body: 'Crystalys’ strongest public adoption proofs are not invoices or subscription metrics but operating signals: marketed use in Asia, first patients dosed in registration-directed trials, site expansion into Europe, and a difficult-to-treat Phase 2 trial designed around a clearly defined unmet-need cohort. The company’s science page now says dotinurad has been used to treat more than 2.2 million patients since 2020, while its 2025 launch materials referenced more than 1.2 million treated patients. That discrepancy does not negate usage, but it weakens confidence in the precision of treated-patient messaging. In the West, the cleaner proof is trial activity. AMETHYST has first patients dosed and aims for roughly 90 participants with XOI intolerance or post-uricase failure. RUBY has expanded to European sites, and TOPAZ continues in tophaceous disease. These are not commercial customers, yet they are strong pre-commercial adoption signals showing that investigators, sites, and eligible
    patients are engaging with the program. The adoption trajectory is therefore real but still pre-revenue and evidence-mediated.'
  claimRefs:
