- id: retention-durability-and-evidence-gaps
  title: Retention is the weakest part of the customer story because public metrics are almost absent
  body: 'If Crystalys were already commercial in the U.S. or Europe, a strong customer chapter would show retention cohorts, renewal behavior, adherence persistence, provider reorder frequency, or payer durability. None of that is publicly available. Even ex-Asia commercial history is described mainly through aggregate treated-patient counts and approval/launch milestones, not through repeat-purchase, refill persistence, or market-share trajectories that Crystalys itself captures. There are some indirect durability signals. Long-term Japanese studies and switching studies show the product can be used beyond a single acute interaction, and the planned open-label extension after Phase 3 suggests management understands the value of durability data. But those are still clinical evidence proxies rather than customer retention metrics. The result is a split customer story: strong proof that stakeholders are willing to try the product pathway, weak proof of how usage persists over time in real
    commercial settings, and no public Western metrics on satisfaction, churn, or contract-like durability.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
