- id: expansion-concentration-and-access-friction
  title: Expansion depends on specialist referrals and payer acceptance, while concentration remains high
  body: 'Crystalys’ land-and-expand logic is clinical rather than contractual. The company appears to expect an initial specialist-led second-line foothold, then broader comfort among rheumatologists and possibly later referral familiarity among primary-care physicians. James Mackay told GEN that payers will likely want patients to fail allopurinol before they are prepared to cover a new drug, which reinforces how much expansion depends on reimbursement sequence rather than on pure physician enthusiasm. This creates concentration in several forms: one disease, one core asset, one main Western clinical proposition, and a narrow initial customer segment inside broader gout prevalence. Ex-Asia commercialization may help confidence, but it does not eliminate Western concentration risk because Crystalys still needs payer pull-through, specialist adoption, and post-approval evidence. Customer expansion therefore looks plausible but gated. If the company wins second-line rheumatology adoption,
    it can broaden. If payers keep tight control or trial differentiation underwhelms, the customer base could remain smaller and more concentrated than the headline gout prevalence suggests.'
