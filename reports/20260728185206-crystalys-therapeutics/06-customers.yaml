    - label: Specialist referral and trial / treatment consideration
      note: Rheumatologists and investigators become the practical buyers or gatekeepers for second-line oral positioning.
    - label: Payer access and sequencing
      note: Even if physician interest exists, payer willingness to reimburse after generic failure shapes actual adoption.
    - label: Durability and expansion loop
