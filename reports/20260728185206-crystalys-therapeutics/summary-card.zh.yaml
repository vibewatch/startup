  topStrengths:
    - Dotinurad 是风险已部分释放的口服 URAT1 抑制剂，已有亚洲以外商业化和临床历史，不是首次人体试验阶段的科学项目。
    - 作为私营单资产 biotech，Crystalys 融资厚度少见，关键试验执行期的短期资产负债表压力下降。
    - 临床计划覆盖主流痛风、痛风石痛风，以及 XOI 不耐受或尿酸酶治疗失败患者，最终可服务机会更宽。
    - 公开战略可比证据显示，只要差异化和准入叙事可信，后期痛风资产能吸引有分量的买家兴趣。
  topRisks:
    - 西方市场获批仍取决于 RUBY 和 TOPAZ 执行成功；后期读出若失手，投资逻辑会迅速受损。
    - 报销和医生采用必须顶住根深蒂固的低价仿制药标准疗法，也要吸收此前 URAT1 失败案例的商业教训。
    - 当前私募价格未公开；拿不到轮次条款和稀释机制，就无法承销回报。
    - Fortress/Urica 历史经济安排，包括股权所有权和版税义务，可能把价值从普通股持有人手中分走。
    - 收入模型、商业化开支和支付方合约的公开证据仍太有限，支撑不了高确信度估值。
  unresolvedGaps:
    - Series B 每股价格、清算优先权堆叠，以及任何结构化投资人保护。
    - 管理层对关键读出后 FDA/EMA 申报路径和上市顺序的明确假设。
    - 美国商业化的净价、准入假设和所需销售队伍投入。
    - 经过口径校准的受治患者数据，以及亚洲以外持续用药、依从性和真实世界结果的更清晰证据。
