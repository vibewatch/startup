company:
  name: Crystalys Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Crystalys Therapeutics is a San Diego clinical-stage gout biotech built
    around dotinurad, an ex-Asia-approved oral URAT1 inhibitor that management
    is advancing through U.S./EU Phase 3 studies. Public evidence is strong on
    founding sponsors, financing chronology, trial milestones, and asset
    pedigree, but materially weaker on valuation, headcount, revenue
    visibility, and a fully reconciled governance or patient-exposure picture.
sections:
  - id: identity-and-asset-snapshot
    title: Identity, headquarters, and asset definition
    body: >-
      Crystalys Therapeutics presents itself as a focused, clinical-stage
      biopharmaceutical company rather than a platform with a broad disclosed
      pipeline. Across its home, about, and science pages, the company anchors
      its identity on one problem—unmet need in gout—and one lead
      asset—dotinurad. The official website and launch press materials
      consistently place the company in San Diego, California and frame it as
      co-founded by the executive team together with Catalys Pacific and Novo
      Holdings. That is important because it makes Crystalys look less like a
      loosely assembled asset shell and more like a sponsor-created company
      built around a single licensing opportunity. The core product claim is
      also unusually concrete for a private biotech at this stage: dotinurad is
      described as a once-daily, oral, highly selective URAT1 inhibitor
      intended as a second-line therapy for patients who remain uncontrolled or
      intolerant on first-line urate-lowering therapy. Public disclosure is
      therefore strong on what the company is, what it is trying to do, and why
      gout is the only commercial story that matters today.
    claimRefs: [CO001, CO002, CO003, CO019, CO020, CO021, CO043, CO044]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-governance-and-operating-control
    title: Leadership, governance, and operating control
    body: >-
      Leadership disclosure is founder-heavy but directionally credible. The
      2025 launch release names James Mackay as co-founder, president, and
      chief executive officer, and ties him to decades of drug-development
      experience and multiple approvals. The same release identifies Nihar
      Bhakta as co-founder and chief medical officer, Ashwin Ram as co-founder
      and chief operating officer, and DeAnne Reid as a co-founder-level
      operating executive with gout-development experience. Governance
      visibility improves in February 2026, when Crystalys added former Horizon
      Therapeutics chief executive Tim Walbert as an independent director. That
      appointment matters because Horizon built the only sizeable recent U.S.
      gout-commercialization franchise through Krystexxa, so Walbert adds
      directly relevant launch pattern-recognition. Still, the public board
      picture remains incomplete. The about page lists sponsor-affiliated board
      seats from Catalys Pacific, Novo Holdings, SR One,
      Perceptive/Xontogeny, and Fortress Bio, but it does not provide a full,
      standardized roster with biographies, committee structure, ownership
      percentages, or control terms. Investors should therefore view the
      company as led by experienced gout operators and sponsors, but still only
      partially transparent on formal governance.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO046]
    tableRefs: [TO002]
  - id: financing-rights-and-capital-formation
    title: Financing chronology, rights transfer, and capital formation
    body: >-
      Capital formation is one of the clearest parts of the public record.
      Crystalys emerged publicly in September 2025 with a $205 million Series A
      co-led by Novo Holdings, SR One, and Catalys Pacific, then returned less
      than a year later with an oversubscribed $130 million Series B led by
      Frazier Life Sciences and joined by new crossover-style healthcare
      investors including Wellington Management and HBM Healthcare Investments.
      On a disclosed basis, that puts cumulative equity capital at $335
      million. The earlier rights-transfer mechanics also matter. Fortress
      Biotech's July 2024 SEC filing says Urica Therapeutics sold dotinurad
      rights and related intellectual property to Crystalys in exchange for 35%
      of Crystalys' outstanding equity, anti-dilution protection down to a 15%
      floor until $150 million of equity had been raised, a 3% securitized
      royalty on future net sales, and board-observer plus director rights.
      Together, those facts show that Crystalys is well funded but not cap-table
      simple: sponsor creation, a meaningful legacy rights holder, and large
      private rounds all shape future economics even before any valuation is
      publicly disclosed.
    claimRefs: [CO004, CO005, CO014, CO015, CO016, CO017, CO018, CO033, CO034, CO035, CO036, CO047]
    tableRefs: [TO003]
  - id: milestones-disclosure-gaps-and-adverse-context
    title: Milestones, disclosure gaps, and the adverse sector backdrop
    body: >-
      The milestone cadence is coherent even though disclosure depth is uneven.
      Crystalys can point to a July 2024 rights transfer, a September 2025
      launch financing, a February 2026 board expansion, a May 2026
      first-patient milestone in AMETHYST, a July 2026 European-site expansion
      for RUBY, and the July 2026 Series B. The asset itself also arrives with
      dated ex-Asia milestones, including Japan launch in 2020 and China
      approval and launch activity in 2024-2025. What remains under-disclosed
      are exactly the fields investors would use to translate those milestones
      into pricing power and ownership discipline: the company has not publicly
      disclosed current valuation, headcount, revenue, or a full cap table.
      Even operationally, the public website is not perfectly clean; the
      contact page still contains legacy Aristea references alongside current
      Crystalys coordinates. The broader gout backdrop is also cautionary.
      Lesinurad's commercial withdrawal shows that a valid URAT1 mechanism does
      not guarantee durable market success. Crystalys therefore deserves credit
      for coherent execution and financing access, but not a free pass on
      disclosure rigor.
    claimRefs: [CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO037, CO038, CO039, CO040, CO041, CO042, CO045, CO048, CO049]
    tableRefs: [TO004]
    figureRefs: [FO001]
