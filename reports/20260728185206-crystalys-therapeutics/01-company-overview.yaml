callouts:
  - calloutType: strength
    title: De-risked asset plus unusually large private financing is the core overview takeaway
    body: >-
      Crystalys is not starting from a clean-sheet preclinical concept. It is
      building around a molecule already approved across multiple Asian markets
      and has now paired that ex-US proof base with $335 million of disclosed
      equity financing for late-stage development and commercialization
      readiness.
    claimRefs: [CO017, CO022, CO026, CO047]
  - calloutType: risk
    title: Public disclosure still lags the ambition implied by the capital raised
    body: >-
      The company has been highly specific on financing headlines and trial
      milestones, but still omits the fields most directly tied to entry price
      and execution scale: valuation, headcount, revenue, and a complete
      cap-table or governance picture.
    claimRefs: [CO034, CO035, CO040, CO049]
  - calloutType: risk
    title: The sector backdrop proves that a valid URAT1 mechanism is not enough on its own
    body: >-
      Lesinurad's withdrawal from the U.S. gout market means investors should
      not treat mechanism validity or regulatory approval alone as proof of
      commercial durability. Crystalys still has to show that dotinurad can
      succeed where an earlier URAT1 story stalled.
    claimRefs: [CO041, CO048]
