chapter:
  number: 3
  title: Competitors
  summary: 'Crystalys competes on two fronts at once: against entrenched status-quo therapies that are cheap, familiar, and often good enough, and against a narrower set of late-stage uricosuric or URAT1 programs attempting to modernize gout treatment. Dotinurad looks differentiated on selectivity and ex-US clinical de-risking, but commercial durability is still unproven because branded oral gout drugs have struggled before and payer incentives still favor generic step therapy.'
sections:
- id: landscape-and-competitive-classes
  title: The real landscape includes generics biologics prior URAT1 failures and next-wave URAT1 peers
  body: 'Crystalys is not entering an empty field. The most important competitors are still the incumbent standards of care: allopurinol as first-line urate lowering, febuxostat as a more selective xanthine oxidase inhibitor with safety baggage, probenecid as an older uricosuric, and pegloticase as the high-burden biologic option for refractory disease. Those products matter because they define the step-through logic and budget ceiling in the market today. Crystalys then faces a second competitive ring consisting of failed or partially displaced predecessors and newer late-stage URAT1 entrants. Lesinurad matters even though it is gone from the U.S. market because it shows that mechanistic novelty alone does not ensure adoption. Sobi-controlled pozdeutinurad and Atom’s lingdolinurad matter because they suggest Crystalys may not enjoy a long uncontested window in next-generation uricosurics. The company therefore competes simultaneously against status quo clinical habits, low-price oral substitutes,
    and a rising class of mechanism-adjacent branded assets.'
