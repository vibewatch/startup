callouts:
- calloutType: insight
  title: Crystalys competes more with treatment sequencing than with a single named rival
  body: The company’s hardest battle is against generic first-line inertia and payer sequencing, not just against another URAT1 program. That means share can be won without monopoly, but it also means differentiation has to survive contact with low-cost incumbents.
  claimRefs:
  - CP005
  - CP006
  - CP027
  - CP035
- calloutType: risk
  title: Lesinurad is the most relevant adverse precedent
  body: Zurampic shows that a URAT1-linked product can reach the market and still fail to build durable commercial traction. Any bullish competitor view must explain why dotinurad’s label, safety framing, and market timing are better.
  claimRefs:
  - CP016
  - CP017
  - CP018
- calloutType: risk
  title: The moat today is thinner than the capital raise suggests
  body: A large balance sheet and strong investors help Crystalys run quickly, but they do not create lock-in. Late-stage peers, generic price anchors, and payer friction can still compress long-term returns.
  claimRefs:
  - CP029
  - CP030
  - CP032
  - CP033
