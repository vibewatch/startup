    - Global Phase 3 in U.S./EU; marketed in Japan/China through partners
    - Patients inadequately controlled or not well served by first-line oral therapy
    - Selective URAT1 mechanism plus ex-US commercial and clinical de-risking
    - Pre-launch in U.S./EU with no commercial proof or disclosed pricing.
  - - Allopurinol
    - Incumbent generic XOI
    - Entrenched standard of care
    - Broad first-line chronic urate-lowering population
    - Cheap, familiar, guideline-preferred, widely available
    - Adherence and inadequate-control problems leave residual unmet need.
  - - Febuxostat / Uloric class
    - Incumbent generic XOI alternative
    - Established but safety-scrutinized oral option
    - Patients needing an alternative to allopurinol
    - Potent urate lowering and oral convenience
    - Boxed cardiovascular warning narrows comfort and payer narrative.
  - - Probenecid
    - Older uricosuric substitute
    - Long-marketed generic oral therapy
    - Selected patients needing uricosuric effect
    - Known urate-excretion mechanism and generic price
    - Older asset with narrower use and weaker premium story.
  - - Pegloticase / KRYSTEXXA
    - Specialty biologic substitute
    - Commercialized infusion therapy for uncontrolled gout
    - Severe refractory patients
    - Highest-intensity urate-lowering option with payer support in severe disease
    - Infusion burden and monitoring keep it later-line.
  - - Pozdeutinurad
    - Direct late-stage URAT1 peer
    - Positive pivotal readout and well-funded development history
    - Gout and tophaceous-gout segments
    - Mechanism-adjacent competitor that validates category interest
    - Could compress Crystalys launch window and bargaining power.
  - - Lingdolinurad
    - Emerging URAT1 peer
    - Late-stage development updates in 2026
    - Chronic gout patients seeking new oral options
    - Another modern URAT1 entrant in development
    - Less visible public dataset than Crystalys or Sobi-backed peer.
  notes: This table mixes commercialized incumbents with pipeline peers because buyers can solve the same job through either status quo or next-wave products.
