- id: pricing-distribution-and-switching-power
  title: Crystalys faces low-price incumbents, unclear U.S. pricing, and only moderate switching costs
  body: 'Competitive power in gout is shaped less by technical lock-in than by treatment habit, formulary sequencing, and relative burden. Allopurinol is cheap and familiar, which makes it the default comparator. Febuxostat is also generic but constrained by safety perception. Probenecid is older and narrower, yet it still anchors the idea that uricosuric therapy does not automatically deserve premium pricing. Pegloticase sits at the opposite end: it is a specialty product with infusion-center delivery, higher patient burden, and a much stronger reimbursement story for severe refractory disease. Crystalys will likely position dotinurad between those extremes, but that means there is no obvious pricing reference that cleanly favors the company. Public sources do not disclose expected U.S. net price, discount structure, or contracting strategy. Switching costs are also real but not overwhelming. Patients and doctors can move between oral regimens, especially when serum urate remains uncontrolled,
    so advantage will depend on evidence, access, and field execution more than on hard lock-in. That lowers monopoly potential while still leaving room for share capture if the clinical story is persuasive enough.'
