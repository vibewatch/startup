- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Strong Phase 3 differentiation, second-line reimbursement traction, strategic exit or strong late-private rerating
    - Strategic-comp logic approaches upper late-stage biotech outcomes; directional value range materially above current unknown private mark
    - Access and operational execution still need to hold
    - Possible but evidence-incomplete
  - - Base
    - Adequate approval path, narrower access, slower adoption, additional dilution before scale
    - Value creation still occurs, but return depends heavily on entry price and dilution path
    - Payer friction and org-scale lag compress upside
    - Most evidence-consistent public scenario
  - - Bear
    - Weak differentiation, delayed access, or heavier-than-expected financing need
    - Strategic premium disappears and value converges toward a much smaller optionality case
    - One-asset concentration and economic overhang dominate
    - Cannot be ruled out pre-readout
  notes: Because the current price is undisclosed, the table expresses return logic qualitatively rather than pretending to know current IRR.
