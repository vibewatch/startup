  - CV029
  - CV030
  - CV031
  - CV032
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current round price / post-money
    - Exact share price, post-money valuation, and cap-table context
    - Without price, current return underwriting is impossible
    - Management / lead investor diligence materials
  - - Burn and runway
    - Cash on hand, monthly burn, next financing threshold
    - Needed to convert financing strength into a time-based model
    - Finance diligence and board materials
  - - Gross-to-net and payer access
    - Price assumptions, rebates, step edits, and launch access research
    - Determines whether a second-line label becomes a real business
    - Commercial / market-access diligence
  - - Economic overhangs
    - Full effect of royalties, anti-dilution, and retained interests
    - Determines what equity value actually accrues to new investors
    - Counsel + cap-table diligence
  - - Org readiness
    - Commercial, CMC, and quality leadership depth through launch
    - Determines whether value can be realized on time
    - Management org-chart review
  notes: These asks are sufficient to move the call from narrative quality toward real entry discipline.
