- id: recommendation-and-final-diligence
  title: 'Recommendation: watch, pending price clarity and commercial-underwriting detail'
  body: The report’s recommendation is watch with medium confidence. That is not a dismissal of the asset. On the contrary, the evidence supports that Crystalys has assembled a serious late-stage program with strong capital support, a rational market wedge, and comparables suggesting genuine strategic value in gout. The reason not to recommend invest today is that public evidence is not price-complete. The post-money valuation is undisclosed. The exact economic effect of retained interests, gross-to-net pricing, payer sequencing, launch costs, and org-scale readiness is still too unclear for a conviction call. The company could become very attractive at the right entry, especially if pivotal data and access work line up. But without knowing the actual price and without having better underwriting inputs, the cleanest investment judgment is to stay engaged, keep diligence live, and demand milestone- and price-specific entry discipline rather than a generic quality score.
  claimRefs:
