- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Pivotal efficacy or differentiation disappointment
    - Data fail to justify clear second-line premium logic
    - Weakens approval, access, and exit narratives simultaneously
    - Move from watch to pass unless price resets dramatically.
  - - Access remains narrow after data
    - Payers appear unwilling to go beyond strict failure sequencing
    - Caps uptake and peak-sales logic
    - Cut scenario ranges and demand deeper discount.
  - - Undisclosed valuation proves aggressive in private diligence
    - Actual price embeds a near-bull outcome before evidence arrives
    - Compresses return potential despite a good asset
    - Decline entry at that round / mark.
  - - Further financing arrives before strong de-risking milestone
    - Dilution appears ahead of proof
    - Signals weaker capital efficiency or tougher path than narrative suggests
    - Rework ownership and return assumptions.
  - - CMC / launch readiness lags visibly
    - No credible launch-grade operational proof near regulatory horizon
    - Delays revenue and raises execution risk
    - Extend timelines and lower conviction.
  notes: These triggers define what would turn a watch into a pass, not just what would cause discomfort.
  claimRefs:
