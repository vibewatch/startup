- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Crystalys Series B context
    - Private financing scale
    - $130M oversubscribed Series B; valuation undisclosed
    - Shows market appetite for the asset at late private stage
    - No public round price or share count.
  - - Arthrosi / pozdeutinurad sale to Sobi
    - Strategic transaction value
    - Up to $1.5B total; $950M upfront + $550M milestones
    - Best direct strategic comp for a late-stage URAT1 peer
    - Strategic synergies and milestones make direct read-through imperfect.
  - - Sobi CMD pozdeutinurad outlook
    - Peak-sales framing
    - '>SEK 10bn peak-sales expectation'
    - Shows how a strategic owner values long-term gout upside
    - Peak-sales optimism is not present value or Crystalys valuation.
  - - NASP / uncontrolled gout pathway
    - Regulatory and market context
    - BLA accepted; uncontrolled gout population ~200k in U.S.; NASP peak sales 4-6bn SEK at Sobi CMD
    - Demonstrates that narrower high-acuity gout segments still command major investment attention
    - Different modality and later-line infusion use case.
  - - Public market gout therapeutics category
    - TAM context
    - Global market estimates in the multi-billion-dollar range
    - Supports that the category is large enough for strategic interest
    - Category TAM is not equity value.
  enumerationScope:
    coverage: partial
    basis: Public comps capture strategic and category context, but they do not provide a disclosed direct valuation multiple for Crystalys because its own round price is private.
  notes: The table is intentionally mixed between transaction comps, strategic outlook, and category context because no single public comp fully captures Crystalys’ late-stage private position.
