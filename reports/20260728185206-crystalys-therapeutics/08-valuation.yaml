- id: valuation-context-and-comparables
  title: Public comparables suggest strategic value, but they do not pin down Crystalys fair value today
  body: 'Comparable evidence is helpful but not decisive. The clearest strategic comp is Arthrosi: Sobi agreed to buy the company for up to $1.5 billion, including $950 million upfront and up to $550 million in milestones, for a late-stage URAT1 peer in progressive and tophaceous gout. Sobi’s 2026 Capital Markets Day then reinforced its confidence by assigning pozdeutinurad peak-sales expectations above SEK 10 billion. That is a strong signal that strategics believe a differentiated gout asset can be large. NASP provides a different comp: a later-line uncontrolled-gout biologic that reached BLA acceptance and was framed around roughly 200,000 uncontrolled U.S. patients, showing that even narrower high-acuity gout segments can justify major development and commercialization effort. But comparables still have limits. Arthrosi was acquired by a strategic buyer with different synergies and timeline. NASP is an infusion therapy, not an oral URAT1 inhibitor. Crystalys also has its own economic
    overhangs and price opacity. Public comps therefore support “valuable category,” not a precise current fair value.'
