evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: A current named executive roster, board composition, and control-rights summary.
    whyItMatters: Leadership breadth and oversight quality affect execution durability, succession risk, and investor protections.
    diligencePath: Request an org chart, board list, and financing governance summary directly from management or lead investors.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-opacity
    missingEvidence: Cap-table percentages, board rights, liquidation terms, and any debt or credit facilities.
    whyItMatters: Valuation quality depends on who controls the company and what economic seniority sits ahead of common equity.
    diligencePath: Obtain the latest financing deck, shareholder register, and principal financing documents.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-metrics-gap
    missingEvidence: Current revenue, gross margin, customer count, headcount, and cash-runway data.
    whyItMatters: >-
      The capital raise and valuation headline cannot be judged against operating traction without current scale
      metrics.
    diligencePath: Request audited or board-level KPI history and reconcile it with booked revenue and customer definitions.
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: Additional independently dated milestones from 2021 through mid-2025.
    whyItMatters: Earlier chronology is still thin, which weakens historical pacing analysis for product and commercial progress.
    diligencePath: Pull dated company newsroom releases, filings, or external event archives in a later chapter or follow-up refresh.
  - type: missing-source
    severity: material
    topic: sam-boundary
    missingEvidence: >-
      A public market study or comparable disclosure that isolates tactile sensing plus dexterous-hand spend rather than
      a broad force-sensor or general robotics category.
    whyItMatters: >-
      Without a narrower market cut, valuation discussions can drift from adjacent-category ceilings into unsupported
      SAM or SOM claims.
    diligencePath: >-
      Request customer or investor materials that size tactile-sensing and dexterous-manipulation budgets separately
      from full robot or generic sensor spending.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Named customers, contract values, pilot-to-production conversion, and attach-rate data by buyer segment.
    whyItMatters: >-
      Buyer segmentation is visible, but monetization timing and budget ownership remain too coarse to model revenue
      conversion confidently.
    diligencePath: >-
      Ask management for pipeline conversion data, ASP by product line, and examples of who signs and pays for tactile
      deployments.
    relatedQuestionRefs:
      - QM002
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: commercialization-depth
    missingEvidence: Counts or scale indicators behind the disclosed deployment sectors and application categories.
    whyItMatters: >-
      Current evidence proves breadth, but not whether those sectors represent a handful of pilots or repeatable scaled
      programs.
    diligencePath: Seek customer logos, site counts, shipment volumes, or repeat-order disclosures tied to the named sectors.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public list pricing, contract terms, and discount structure for PaXini, Unitree, and AGIBOT hardware.
