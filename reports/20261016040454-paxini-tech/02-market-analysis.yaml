callouts:
  - calloutType: insight
    title: The relevant market is a wedge, not a generic robotics TAM
    body: PaXini's evidence-supported opportunity sits in tactile sensing, dexterous manipulation, and embodied-AI deployment workflows, so broad robotics or force-sensor figures are only outer bounds.
    claimRefs: [CM001, CM007, CM008]
