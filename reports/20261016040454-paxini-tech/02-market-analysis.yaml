    title: Public commercialization evidence is still too coarse for precise SAM/SOM work
    body: The assigned sources show sector breadth and capital appetite, but they do not disclose attach rates, contract values, or pilot-to-production conversion that would let an investor model demand with confidence.
    claimRefs: [CM014, CM015]
