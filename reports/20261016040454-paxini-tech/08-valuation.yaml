  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Current recurring revenue, gross margin, backlog, pilot-to-production conversion, and cash runway by product line.
      whyItMatters: These metrics determine whether the reported private valuation is supported by durable economics or only by strategic scarcity and theme momentum.
      diligencePath: Request the latest board deck or audited management package with product-level revenue, margin, and cash metrics.
    - type: conflicting-data
      severity: material
      topic: valuation-markers
      missingEvidence: A reconciled post-money valuation, share count, and round documentation that explains why Dealroom still shows a lower band than March 2026 financing coverage.
      whyItMatters: Investors need a single anchor price before they can judge entry discipline, dilution risk, and expected return.
      diligencePath: Obtain the executed Series B term sheet, cap table, and any third-party valuation memo covering the latest round.
      relatedQuestionRefs: [QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: preference-overhang
      missingEvidence: Cap-table detail on liquidation preferences, debt, structured secondaries, and any investor rights that rank ahead of new money.
      whyItMatters: Downside outcomes can be materially worse than the headline valuation if the stack is heavily protected or already encumbered.
      diligencePath: Review the post-Series B cap table, shareholder agreement, debt schedule, and any side letters tied to the latest financing.
      relatedQuestionRefs: [QV009]
