      - [Anti-thesis, "Public valuation references conflict, so outsiders do not yet have a clean market-clearing price.", "Reconciled post-money data and share-count visibility would reduce pricing uncertainty."]
      - [Anti-thesis, "Public sources still do not disclose revenue quality, margins, runway, or preference stack.", "A board-approved operating packet or audited reporting would materially improve underwriteability."]
    notes: >-
      Rows separate the strategic case from the evidence-quality case; the anti-thesis is
      mostly about missing and conflicting valuation support rather than about product denial.
    claimRefs: [CV001, CV003, CV004, CV005, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Product breadth converts into repeat deployments and investors get credible revenue plus margin disclosure.", "Value can hold above the latest reported >RMB 10B private mark and potentially expand if economics validate the platform story.", "Commercial pilots stall, or the sector rerates before PaXini reaches wider production.", "Requires fresh proof of monetization rather than more category enthusiasm."]
      - [Base, "Financing support remains available but disclosure on revenue quality and cash efficiency stays limited.", "Fair value clusters around the latest private mark with little room for multiple expansion until operating proof catches up.", "Exit timing slips and new money arrives on terms that cap upside for common or new preferred investors.", "Most consistent with the current public evidence set."]
      - [Bear, "The company's public economics stay opaque while geopolitical and commercialization discounts widen for Chinese humanoid peers.", "Value resets toward more conservative external markers such as Dealroom's lower band or through a structured round that protects insiders.", "Down-round, preference overhang, or slower-than-expected production adoption.", "Triggered by financing on punitive terms or by sector exit windows closing."]
    notes: >-
      Scenario ranges are directional because the retained public record does not provide
      enough revenue, margin, or cap-table data for a precise model.
    claimRefs: [CV005, CV008, CV009, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Strong category positioning flows into a cautious recommendation because price support is less complete than product ambition.
    data:
      nodes:
        - label: Sector demand exists
          detail: Unitree's IPO process and shipment-scale coverage show a live Chinese humanoid financing and exit narrative.
        - label: PaXini stack breadth is real
          detail: Retained sources place PaXini across tactile sensors, dexterous hands, and humanoid systems.
        - label: Financing support is real
          detail: March 2026 coverage reported a Series B above RMB 1 billion and a valuation above RMB 10 billion.
        - label: Price markers conflict
          detail: Dealroom still places PaXini in a $500M–1B band, so the public mark is not yet reconciled.
        - label: Economics remain opaque
          detail: The current public pool still lacks disclosed revenue, margin, runway, and preference-stack detail.
        - label: Recommendation = track
          detail: Wait for cleaner monetization proof or a better entry point before underwriting upside.
    approximationNotes: null
    claimRefs: [CV001, CV003, CV005, CV008, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      The financing and product story are credible, but the public record still supports a
      cautious, price-sensitive stance because valuation markers conflict and operating
      disclosure remains thin.
    claimRefs: [CV005, CV013, CV014]
