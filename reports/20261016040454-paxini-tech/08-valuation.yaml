company:
  name: PaXini Tech
chapter:
  number: 8
  title: Valuation
  summary: >-
    PaXini's public financing evidence supports a live private mark above RMB 10 billion,
    but the same public record still lacks disclosed revenue, margin, and cap-table detail
    and even shows conflicting external valuation ranges. That combination supports a
    price-sensitive track recommendation: the product and funding story is real, but the
    current public evidence does not justify paying up without cleaner operating proof and
    tighter entry discipline.
sections:
  - id: public-valuation-context
    title: Public valuation markers are positive but internally inconsistent
    body: >-
      The strongest current pricing signal in the retained pool is the March 2026 financing
      coverage from EqualOcean and Gasgoo, both of which reported a Series B above RMB 1
      billion and a valuation above RMB 10 billion. That is meaningful because it shows the
      company can attract sizable capital into the embodied-AI theme. However, the public
      valuation picture is not clean: Dealroom still lists PaXini in a $500M–1B valuation
      band for 2026 and only discloses a broad $100–500M total-funding range. The resulting
      takeaway is not that either data point is necessarily wrong, but that outside investors
      still lack a single, reconciled public mark that can be tied to disclosed economics or
      share-class terms.
    claimRefs: [CV003, CV004, CV005, CV006]
  - id: thesis-and-antithesis
    title: The thesis is real, but proof still sits below the bar for an aggressive entry
    body: >-
      The long case starts with genuine product breadth. Dealroom and PaXini's own product
      materials show a stack that runs from tactile sensing into dexterous hands and
      humanoid systems, which is strategically attractive because value can accrue at several
      layers if commercialization works. The trademark filing also suggests the company is
      preparing for broader brand and IP positioning. The anti-thesis is that public
      evidence still describes ambition better than monetization. The current chapter pool
      provides financing and positioning detail, but it does not publish recurring revenue,
      gross margin, cash runway, pilot conversion, or liquidation-preference detail, so the
      public case for today's price remains thinner than the public case for PaXini's
      technical ambition.
    claimRefs: [CV001, CV007, CV011, CV013]
    tableRefs: [TV002]
  - id: scenarios-and-recommendation
    title: Scenario work argues for a track call and stretched valuation stance
    body: >-
      The valuation call should therefore stay price-sensitive. A bull case exists if PaXini
      converts its tactile-plus-humanoid positioning into repeat production deployments and
      if the current financing mark proves to be supported by durable revenue rather than
      category enthusiasm alone. The base case is more conservative: investors should assume
      financing access remains strong, but multiple support stays bounded until PaXini
      discloses operating metrics and the market gets a clearer read on sector exit windows.
      The bear case is not company failure; it is that the company's private mark has run
      ahead of what public evidence can currently underwrite, especially while Chinese
      humanoid exits still carry geopolitical and commercialization discounts. On that
      balance, track is more defensible than buy.
    claimRefs: [CV005, CV008, CV009, CV012, CV013, CV014]
    tableRefs: [TV001, TV003]
    figureRefs: [FV001]
  - id: diligence-asks-and-thesis-breaks
    title: Final diligence should focus on monetization quality and downside structure
    body: >-
      The next diligence cycle should try to disprove the current caution rather than simply
      collect more thematic enthusiasm. The most important asks are objective and
      transaction-specific: current revenue by product line, gross margin by hardware versus
      software or data products, pilot-to-production conversion, customer concentration,
      burn and runway, and the exact preference, debt, or secondary overhang that sits ahead
      of new money. A positive surprise on those items could move the recommendation upward.
      By contrast, a down-round, a financing that adds heavy preferences, or evidence that
      sector exit windows are narrowing would be thesis-break triggers even if PaXini keeps
      launching technically impressive products.
    claimRefs: [CV007, CV009, CV013, CV014]
