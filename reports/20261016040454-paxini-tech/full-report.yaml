  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape spans components, hands, humanoids, and internal integration
        blocks:
          - type: paragraph
            body: >
              The retained evidence suggests PaXini is not just a component company. Its official and partner surfaces,
              plus independent coverage, place it across tactile sensing, dexterous hands, and full humanoid robots,
              which means the real comparison set is layered rather than a single peer group. At the component end,
              incumbents such as Tekscan let buyers add force or tactile capability into existing equipment without
              adopting a new humanoid platform. At the platform end, Unitree and AGIBOT bring stronger public scale
              signals, while other named entrants such as Tesla Optimus, UBTech, Leju, DEEP Robotics, Galbot, and
              Xiaomi-linked efforts widen the future field.


              That breadth matters because it changes the substitute set by customer use case. A buyer solving a narrow
              sensing or end-effector problem can still choose component incumbents or custom integration rather than a
              PaXini robot, while a buyer seeking embodied-AI workflows evaluates PaXini against full humanoid OEMs with
              bigger disclosed shipment or financing signals. PaXini's competitive positioning is therefore strongest
              where tactile perception and manipulation need to be integrated into one stack, rather than where a
              customer can unbundle sensing from the robot platform.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
