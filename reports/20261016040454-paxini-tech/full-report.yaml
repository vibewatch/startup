      - number: '5.3'
        title: Maturity, risks, and visible controls
        blocks:
          - type: paragraph
            body: >-
              PaXini's public artifacts show meaningful IP-building activity and active commercialization, but they also
              surface diligence friction. The company has U.S. trademark activity and a large China-based IP footprint,
              yet the assigned pool does not provide public security documentation, reliability statistics,
              certification records, or developer-surface proxies such as repositories or package distributions. More
              importantly, PaXini's own English and Chinese TORA pages disagree on key robot specs, including degrees of
              freedom, tactile-signal counts, arm payload, and speed disclosures. Sector-level reporting also suggests
              that humanoid robotics still faces category-wide deployment and battery-life constraints. The net is a
              product story with real technical ambition but still incomplete external verification.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack positioning is the core product bet
            body: >-
              PaXini is presenting itself as an embodied-AI infrastructure company that owns sensing, manipulation,
              dataset creation, and model training, rather than as a standalone tactile component supplier.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Public diligence artifacts stop short of buyer-grade proof
            body: >-
              The assigned pool is rich enough to describe TORA and PaXini's stack, but not enough to verify security
              controls, developer adoption, uptime, certification status, or reconciled current engineering
              specifications.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint is broad by use case but thinly named
        blocks:
          - type: paragraph
            body: >-
              PaXini's disclosed customer surface spans more than one buyer type. The company and adjacent coverage
              describe a stack that can sell into component buyers, dexterous-hand integrators, humanoid deployment
              sites, and embodied-AI teams that need tactile data and models. Public sector references span precision
              manufacturing, logistics and warehousing, automotive production lines, retail, smart homes, and
              healthcare, which suggests management is pursuing horizontal demand rather than a single vertical wedge.
              That breadth helps explain the strategic-investor mix, but the current public record still provides few
              named customer accounts and no segment-level revenue split.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
              - CU008
              - CU009
              - CU013
      - number: '6.2'
        title: Adoption proof exists, with Geely as the strongest named reference
        blocks:
          - type: paragraph
            body: >-
              The chapter's strongest hard adoption evidence is operational rather than contractual. Gasgoo reported
              nearly 1 million proprietary tactile chips consumed over the prior year and described Paxini's multimodal
              data as already used by several leading embodied-intelligence model companies and major internet
              technology giants, but those buyers were not named. The named production-style proof comes from CnEVpost's
              report that Tora-One was deployed at Geely's Qiantang manufacturing base for wiring-harness assembly and
              pasting, with eight hours of continuous operation, zero anomalies, and a 99.8% task success rate. That is
              credible customer proof for one workflow, but it does not yet establish broad production density across
              the rest of the company's target sectors.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
