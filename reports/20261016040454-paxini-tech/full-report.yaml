      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              Public market sizing in the assigned pool is broad and indirect. The cleanest numeric lens is a
              MarketsandMarkets force-sensor estimate of USD 2.30 billion in 2024 growing to USD 3.93 billion by 2035 at
              a 5.0% CAGR, but that is a ceiling lens for an adjacent category rather than PaXini's served market
              because it spans multiple sensor technologies, applications, and geographies well beyond tactile robot
              hands. The stronger takeaway is directional: multiple sources show demand building where tactile sensing
              improves delicate manipulation, and 2026 coverage from EqualOcean describes embodied-intelligence demand
              shifting toward the data, simulation, and perception infrastructure needed to make physical AI work in the
              real world. Gasgoo's valuation context and deployment-sector list reinforce that investors and pilot
              customers are treating dexterous manipulation as a strategic bottleneck rather than a niche accessory, but
              the evidence still points to a market forming through adjacent budgets instead of a mature, standardized
              category with transparent SAM and SOM boundaries.
            claimRefs:
              - CM006
              - CM007
