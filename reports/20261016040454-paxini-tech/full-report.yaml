      - number: '5.2'
        title: Architecture and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public technical posture is more specific than generic robotics marketing. The English TORA page names
              SLAM navigation, lidar, five HD cameras, two depth cameras, tactile sensing units, dexterous-hand degrees
              of freedom, payload, reach, and endurance. EqualOcean and Gasgoo extend that picture upward into a
              data-and-model layer, describing a full-stack system that runs from embodied-perception hardware and data
              collection into VTLA/OmniVTLA model training. This is the chapter's clearest differentiation claim: PaXini
              is trying to own the sensing, manipulation, data, and model loop together. The underwriting problem is
              that the supporting proof remains descriptive; this pool does not include public benchmarks, APIs, SDKs,
              or third-party validation of the claimed closed-loop advantage.
