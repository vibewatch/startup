              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
              - CU014
      - number: '6.3'
        title: Expansion signals are visible, but repeatability remains under-documented
        blocks:
          - type: paragraph
            body: >-
              Expansion is visible in geography, adjacent monetization paths, and stated pilot activity. Gasgoo said
              Paxini is accelerating localized operations and delivery systems in North America, Japan, South Korea, and
              Europe, while EqualOcean said the March 2026 financing would help accelerate commercial pilots and
              large-scale deployment across application scenarios. Together, those signals support a go-to-market thesis
              that can expand from hardware into data and integration services. However, the public sources still stop
              short of what investors would usually want for durability: customer counts, renewal behavior, contract
              lengths, conversion rates from pilot to production, and concentration by revenue.
            claimRefs:
              - CU008
              - CU009
              - CU013
              - CU014
      - number: '6.4'
        title: Customer concentration and substitute-supplier risk remain open
        blocks:
          - type: paragraph
            body: >-
              The evidence base remains concentrated around one named production-style customer example and several
              ecosystem names that are better read as channel credibility than as customer proof. QCC's shareholder
              register supports BYD and JD Tech as strategic backers, but equity ownership is not the same as active
              product usage or renewals. That matters because alternative tactile-sensing vendors such as Tekscan
              already market solutions into OEM, R&D, and clinical workflows, implying buyers have substitute options if
              Paxini cannot convert pilots into repeat deployments. The main commercial question is therefore not
              whether there is interest, but whether PaXini can show a wider set of named production wins and sticky
              contracts behind the current narrative.
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercialization is real, but evidence quality is uneven
            body: >-
              Public sources support real deployment and demand signals across hardware and data surfaces, yet only one
              named production-style customer example is documented in detail. The rest of the narrative is still
              dominated by broad sector claims, unnamed users, and strategic-investor logos.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU014
          - type: callout
            title: Customer durability still hinges on proof beyond Geely
            body: >-
              Until PaXini discloses a wider set of named production accounts, renewal behavior, and concentration
              metrics, investors should treat the current customer story as promising but not yet fully de-risked.
              Substitute suppliers and logo inflation remain live diligence issues.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks cluster around issues that can change quickly but are only partly visible in
              public evidence: regulatory scrutiny as PaXini markets itself to global partners, financing and listing
              dependence after a RMB 1 billion-plus Series B at a reported valuation above RMB 10 billion, and the
              operational burden of shipping a humanoid platform that combines tactile sensors, dexterous hands,
              perception hardware, and embodied-AI models. The heatmap ranks these as higher-priority than ordinary
              supplier execution because the downside is not just slower growth; any one of them could delay overseas
              adoption, weaken IPO credibility, or expose how little public evidence currently confirms reliability and
              unit economics.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR009
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and capital-market risks
        blocks:
          - type: paragraph
            body: >-
              PaXini's public legal posture looks directionally positive but incomplete. Assigned evidence shows an
              active U.S. trademark filing and repeated descriptions of global ambition, yet the stronger public signal
              is that the company may seek a Hong Kong IPO soon after a large Series B round. That raises the bar for
              disclosure and exposes PaXini to the same geopolitical and security scrutiny now surrounding Chinese
              humanoid-robot vendors more broadly. Because the financing coverage discloses valuation and investors but
              not revenue, gross margin, or cash runway, the capital-markets story currently appears better evidenced
              than the underlying economics that would need to support it.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Operational, commercial, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The company's own product descriptions imply meaningful execution risk: PaXini is not selling a narrow
              component but a stack spanning tactile sensors, dexterous hands, humanoid bodies, navigation, computer
              vision, and multimodal models. That breadth can be strategically powerful, but it raises integration,
              service, safety, and cost-control burdens at the same time. Independent financing coverage also shows
              unusually dense ties to industrial investors and flagship deployment narratives, which may accelerate
              customer access but can hide concentration risk if production demand is clustered around sponsor
              ecosystems rather than a diversified external customer base. The force-sensor market backdrop adds another
              constraint: the component layer is real, but not obviously a hypergrowth market that guarantees margin
              expansion on its own. The assigned market preview identifies established sensor incumbents, but its
              publication label post-dates this report's run date, so it is useful for competitor identification rather
              than as a current growth benchmark.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.4'
        title: Mitigations, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most visible mitigation is strategic sponsorship: PaXini can point to industrial investors,
              global-partner messaging, and claimed batch commercial delivery across multiple verticals. Those signals
              matter, but they are not substitutes for audited operating metrics, customer-concentration disclosure,
              safety and security attestations, or hard evidence that flagship deployments convert into repeatable
              production revenue. The kill criteria are therefore monitorable. If a Hong Kong listing stalls without
              equivalent private financing, if overseas buyers slow because of security or regulatory concerns, or if
              the company cannot demonstrate durable uptime and economic performance beyond showcased deployments, the
              current valuation narrative would weaken materially.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top thesis-break trigger
            body: >-
              If a Hong Kong listing or comparable financing path slips before PaXini can show disclosed customer-backed
              production economics, the current valuation story loses its clearest public validation mechanism.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: Best visible mitigation
            body: >-
              Strategic investors, global-partner positioning, and claimed batch delivery reduce go-to-market friction,
              but they do not yet replace audited unit economics, diversified customer proof, or security and safety
              attestations.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation markers are positive but internally inconsistent
        blocks:
          - type: paragraph
            body: >-
              The strongest current pricing signal in the retained pool is the March 2026 financing coverage from
              EqualOcean and Gasgoo, both of which reported a Series B above RMB 1 billion and a valuation above RMB 10
              billion. That is meaningful because it shows the company can attract sizable capital into the embodied-AI
              theme. However, the public valuation picture is not clean: Dealroom still lists PaXini in a $500M–1B
              valuation band for 2026 and only discloses a broad $100–500M total-funding range. The resulting takeaway
              is not that either data point is necessarily wrong, but that outside investors still lack a single,
              reconciled public mark that can be tied to disclosed economics or share-class terms.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: The thesis is real, but proof still sits below the bar for an aggressive entry
        blocks:
          - type: paragraph
            body: >-
              The long case starts with genuine product breadth. Dealroom and PaXini's own product materials show a
              stack that runs from tactile sensing into dexterous hands and humanoid systems, which is strategically
              attractive because value can accrue at several layers if commercialization works. The trademark filing
              also suggests the company is preparing for broader brand and IP positioning. The anti-thesis is that
              public evidence still describes ambition better than monetization. The current chapter pool provides
              financing and positioning detail, but it does not publish recurring revenue, gross margin, cash runway,
              pilot conversion, or liquidation-preference detail, so the public case for today's price remains thinner
              than the public case for PaXini's technical ambition.
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
      - number: '8.3'
        title: Scenario work argues for a track call and stretched valuation stance
        blocks:
          - type: paragraph
            body: >-
              The valuation call should therefore stay price-sensitive. A bull case exists if PaXini converts its
              tactile-plus-humanoid positioning into repeat production deployments and if the current financing mark
              proves to be supported by durable revenue rather than category enthusiasm alone. The base case is more
              conservative: investors should assume financing access remains strong, but multiple support stays bounded
              until PaXini discloses operating metrics and the market gets a clearer read on sector exit windows. The
              bear case is not company failure; it is that the company's private mark has run ahead of what public
              evidence can currently underwrite, especially while Chinese humanoid exits still carry geopolitical and
              commercialization discounts. On that balance, track is more defensible than buy.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence should focus on monetization quality and downside structure
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should try to disprove the current caution rather than simply collect more
              thematic enthusiasm. The most important asks are objective and transaction-specific: current revenue by
              product line, gross margin by hardware versus software or data products, pilot-to-production conversion,
              customer concentration, burn and runway, and the exact preference, debt, or secondary overhang that sits
              ahead of new money. A positive surprise on those items could move the recommendation upward. By contrast,
              a down-round, a financing that adds heavy preferences, or evidence that sector exit windows are narrowing
              would be thesis-break triggers even if PaXini keeps launching technically impressive products.
            claimRefs:
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The financing and product story are credible, but the public record still supports a cautious,
              price-sensitive stance because valuation markers conflict and operating disclosure remains thin.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
              - CV014
