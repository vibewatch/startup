      - number: '1.4'
        title: Milestones, external validation, and what remains unverified
        blocks:
          - type: paragraph
            body: >-
              The dated milestones that survive this refresh are concentrated from late 2025 onward. Justia shows a U.S.
              trademark filing in October 2025, AutomationNews places the company at CES 2026 in late December 2025 and
              early January 2026, and EqualOcean dates the financing step-up to March 2026. Those events are enough to
              anchor a current timeline, but they do not prove broad market leadership or mature operating scale. The
              strongest counterweight in the assigned pool is not a negative incident report but an analyst-market
              preview that names other humanoid-robot vendors as key players while leaving PaXini unmentioned in visible
              preview text. That does not disprove the company’s category claims, but it does mean independent market
              recognition still lags the ambition of PaXini’s own positioning. Revenue, gross margin, customer count,
              and headcount remain unsupported by the retained public evidence and should stay as explicit gaps rather
              than be backfilled from stale memory or prior reports.
