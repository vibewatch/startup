      - number: '2.3'
        title: Adoption constraints and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same sources that support category momentum also define the valuation risk. A buyer can solve parts of
              the same problem through incumbent force or pressure sensing suppliers such as Tekscan, through less
              capable vision-only manipulation stacks, or by keeping tactile hardware confined to testing and research
              workflows rather than scaling it into production fleets. Integration effort matters because buyers need
              reliable sensors, data calibration, and repeatable validation before a dexterous hand becomes a line-item
              program rather than an experiment. Public evidence also stops short of the metrics investors would need to
              turn category enthusiasm into a defendable revenue model: the pool does not disclose customer counts,
              contract values, pilot-to-production conversion, tactile attach rates, or a clean market slice for tactile
              sensing plus dexterous hands. The result is a market thesis that is strategically credible but still
              under-specified on monetization timing, budget ownership, and how quickly adjacent demand converts into
              durable product revenue.
            claimRefs:
              - CM006
              - CM013
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The relevant market is a wedge, not a generic robotics TAM
            body: >-
              PaXini's evidence-supported opportunity sits in tactile sensing, dexterous manipulation, and embodied-AI
              deployment workflows, so broad robotics or force-sensor figures are only outer bounds.
