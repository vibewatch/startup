      - number: '4.2'
        title: Deployment signals exist, but sales efficiency is still a diligence gap
        blocks:
          - type: paragraph
            body: >-
              The available public traction indicators are operational rather than financial. Gasgoo says PaXini
              products and solutions are deployed across manufacturing, logistics, retail, smart homes, and healthcare,
              while RoboticsMedia reports a Geely production-line deployment in which Tora-One handled automotive tasks
              with eight hours of continuous operation and a 99.8% task success rate. Those signals matter because they
              suggest commercial relevance beyond lab demonstrations. They still do not answer whether pilots convert
              into repeat orders, what the average contract value looks like, how much custom integration is required,
              or whether channel and service costs compress margins. Public evidence therefore supports
              commercialization momentum, but not sales efficiency.
            claimRefs:
