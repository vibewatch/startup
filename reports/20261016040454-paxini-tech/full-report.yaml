chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and product stack
        blocks:
          - type: paragraph
            body: >-
              PaXini’s retained company materials consistently position it around tactile perception rather than a pure
              humanoid-robot narrative. The official about pages describe the company as focused on haptic core and
              automation technology, while the product stack now spans tactile sensors, dexterous hands, humanoid
              robots, and embodied-AI data and model infrastructure. That makes the reusable ground truth for later
              chapters narrower than the company’s own “global leader” language: PaXini is clearly building a full
              embodied-intelligence stack, but the public record still mixes self-description, exhibit copy, and
              trade-press repetition more than independently audited commercial disclosures. The most concrete scale
              marker inside the assigned evidence is the ITES exhibitor profile describing a Tianjin data factory with
              nearly 12,000 square meters, 15+N scenarios, 150 standardized collection units, and nearly 200 million
              annual data points, which is useful as an infrastructure signal even though it remains company-supplied
              text on a third-party platform.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO008
              - CO011
      - number: '1.2'
        title: Founding roots, leadership visibility, and governance limits
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports a coherent origin story but not a complete management map. Company and
              trade-press sources align on a founding team rooted in Waseda University’s robotics lab, and Gasgoo
              explicitly dates the company’s founding to 2021. What the evidence does not provide is a reliable public
              roster of named executives, board members, or control rights. That matters because the company’s strategy
              depends on integrating sensors, dexterous hands, humanoid systems, and large data assets; without named
              operator coverage or governance detail, later diligence cannot cleanly separate institutional capability
              from founder-centric execution. The practical takeaway is that PaXini’s technical pedigree is visible, but
              key-person and oversight risk remain under-documented in public materials available to this chapter.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO011
              - CO012
