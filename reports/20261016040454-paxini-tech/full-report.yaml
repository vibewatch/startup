  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Highest residual exposure sits in cross-border scrutiny, financing dependence, and full-stack reliability.
    data:
      columns:
        - label: Likelihood
          detail: Current 12- to 18-month risk realization probability
        - label: Impact
          detail: Damage to growth, financing, or commercialization if realized
        - label: Residual exposure
          detail: Remaining exposure after currently visible public mitigations
      rows:
        - label: Cross-border scrutiny
          values:
            - label: Medium
              detail: >-
                Security and procurement scrutiny around Chinese humanoid vendors is already rising in U.S. policy
                debate.
            - label: High
              detail: Overseas customer adoption and diligence burden could increase materially.
            - label: High
              detail: Assigned evidence does not yet show PaXini-specific mitigation artifacts for overseas buyers.
        - label: Financing / IPO dependence
          values:
            - label: Medium
              detail: Public coverage ties valuation momentum to fresh capital and possible listing activity.
            - label: High
              detail: A stalled listing or weaker private market could challenge current valuation support.
            - label: High
              detail: Public economics remain thinner than public valuation signals.
        - label: Full-stack reliability
          values:
            - label: High
              detail: The company is integrating multiple hardware and software layers into one commercial stack.
            - label: High
              detail: Field failures would affect product reputation and customer conversion simultaneously.
            - label: High
              detail: Public proof of uptime, serviceability, and safety remains limited.
        - label: Ecosystem concentration
          values:
            - label: Medium
              detail: >-
                Financing coverage shows dense strategic-backer involvement, but public concentration metrics are
                absent.
            - label: Medium
              detail: Dependence on a few counterparties could limit pricing power or reference diversity.
            - label: Medium
              detail: Strategic investors are a mitigation, but not proof of diversified independent demand.
        - label: IP / compliance completeness
          values:
            - label: Medium
              detail: >-
                A trademark filing is visible, but broader public compliance artifacts remain sparse in the assigned
                pool.
            - label: Medium
              detail: >-
                Missing certifications or freedom-to-operate evidence can slow enterprise procurement and overseas
                scaling.
            - label: Medium
              detail: The risk is manageable, but public mitigation detail is still thin.
        - label: Sector adoption maturity
          values:
            - label: Medium
              detail: A cited buyer survey indicates satisfaction with available humanoid products remains limited.
            - label: Medium
              detail: Slow sector-wide adoption can lengthen pilots and delay conversion into production demand.
            - label: Medium
              detail: PaXini-specific retention and pilot-conversion evidence is not public in the assigned pool.
    claimRefs:
      - CR003
      - CR007
      - CR009
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong category positioning flows into a cautious recommendation because price support is less complete than
      product ambition.
    data:
      nodes:
        - label: Sector demand exists
          detail: Unitree's IPO process and shipment-scale coverage show a live Chinese humanoid financing and exit narrative.
        - label: PaXini stack breadth is real
          detail: Retained sources place PaXini across tactile sensors, dexterous hands, and humanoid systems.
        - label: Financing support is real
          detail: March 2026 coverage reported a Series B above RMB 1 billion and a valuation above RMB 10 billion.
        - label: Price markers conflict
          detail: Dealroom still places PaXini in a $500M–1B band, so the public mark is not yet reconciled.
        - label: Economics remain opaque
          detail: The current public pool still lacks disclosed revenue, margin, runway, and preference-stack detail.
        - label: Recommendation = track
          detail: Wait for cleaner monetization proof or a better entry point before underwriting upside.
    approximationNotes: null
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV013
      - CV014
