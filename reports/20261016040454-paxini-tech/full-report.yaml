              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Capability breadth is visible, but pricing and commercial packaging are still opaque
        blocks:
          - type: paragraph
            body: >
              PaXini's public differentiation is centered on tactile-data depth and stack integration. Gasgoo,
              EqualOcean, the official TORA page, and Humanoid.Guide all reinforce the same picture: PaXini wants to own
              the sensor layer, the dexterous hand, and the humanoid embodiment around them. That gives it a more
              defensible position than a sensor-only incumbent when the buyer values closed-loop manipulation, but the
              disclosed evidence still stops short of proving broad production leadership. RBTX's partner page shows
              channel-led international positioning and cites large deployment counts, yet PaXini does not disclose the
              kind of revenue, shipment, or margin data that Unitree already surfaced through its IPO process.


              The commercial packaging signal is also revealing. None of the retained PaXini or Tekscan sales surfaces
              publishes list pricing or a self-serve transaction path; they route buyers into demos, expert contact, or
              custom engagement. Even the Humanoid.Guide surface provides product comparison value without solving
              procurement diligence because the visible USD 17,200 figure is for the market report download, not the
              DexH13 hardware. In practice, the buyer appears to be choosing among consultative enterprise sales motions
              rather than comparing transparent list prices, which raises switching-cost and discount-risk uncertainty.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP013
              - CP014
      - number: '3.3'
        title: Moat durability depends on tactile integration; displacement risk comes from scaled peers and trust barriers
        blocks:
          - type: paragraph
            body: >
              The strongest moat visible in public evidence is not a disclosed price advantage; it is PaXini's claim to
              combine tactile hardware, dexterous manipulation, and multimodal data into one system. That can create
              switching cost if customers train workflows around PaXini's perception stack or channel partners such as
              RBTX standardize around its products. The trademark filing across multiple robotics-machine classes also
              hints that management wants product-scope optionality rather than a narrow single-SKU footprint.


              The counterweight is that scale and trust can overwhelm architectural differentiation. Unitree and AGIBOT
              already publish stronger scale signals, and Techtimes frames Chinese providers as leaders in cost and
              task-specific integration, which raises the odds of price or volume pressure as the field matures. The
              same source also highlights pending U.S. security restrictions on Chinese humanoid vendors, so in
              regulated or Western deployments PaXini may face a trust discount even if its tactile stack is technically
              strong. That leaves the company with a credible but not yet fully proven moat: differentiated integration,
              but incomplete public evidence on economics, pricing power, and cross-border deployability.
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: PaXini's edge is stack integration, not disclosed price leadership
            body: >-
              The company looks more differentiated when a buyer needs tactile sensing, dexterous manipulation, and
              humanoid embodiment together than when the problem can be solved with a component-only incumbent. That
              gives PaXini a plausible architectural moat even before public economics are visible.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
          - type: callout
            title: Scale and trust signals favor larger peers in sensitive deployments
            body: >-
              Unitree and AGIBOT already disclose stronger public scale markers, while pending U.S. restrictions on
              Chinese humanoid vendors could make Western buyers favor alternatives with clearer trust posture. PaXini
              therefore risks being differentiated technically but still disadvantaged in the largest or most regulated
              procurement processes.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Visible revenue stack, but no public price realization
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports PaXini as a multi-surface robotics vendor rather than a single-sensor component
              company. Company and financing disclosures consistently describe a stack from tactile sensors to dexterous
              hands and humanoid robots, which means the eventual revenue model likely blends hardware, integration, and
              embodied-AI infrastructure rather than a clean recurring-software stream. What remains missing is the
              buyer-side economic detail: the public robot page discloses technical specifications and operating claims,
              but it does not publish list prices, contract structure, discounting, warranty terms, or any distinction
              between one-time hardware revenue and recurring software, data, or maintenance revenue. That makes the
              monetization architecture visible in product terms but still opaque in underwriting terms.
