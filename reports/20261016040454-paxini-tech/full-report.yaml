              - CO012
      - number: '1.3'
        title: Funding signal, valuation anchor, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest independently reported financing anchor in this pool is the March 2026 Series B. EqualOcean
              reports financing above RMB 1 billion and valuation above RMB 10 billion, while Gasgoo repeats the same
              round size and valuation threshold and adds context that PaXini sits among a broader group of richly
              funded embodied-robotics startups. Those articles also disclose a syndicate that mixes state-backed
              capital, industrial investors, and existing shareholder follow-on support, which is more informative than
              the official site’s unlabeled logo walls. The evidence is still incomplete for ownership analysis: no
              retained source discloses exact cap-table percentages, board seats, liquidation preferences, or
              debt/credit facilities. For this chapter, the funding conclusion should therefore stay bounded: PaXini has
              demonstrated strong capital access and ecosystem sponsorship, but not public financial transparency.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO003
            claimRefs:
