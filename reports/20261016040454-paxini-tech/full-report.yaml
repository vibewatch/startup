  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer chain
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence frames PaXini as a supplier to the manipulation layer of robotics, not as a generic
              automation vendor or a pure software model company. Robotichina describes the company as specializing in
              tactile sensors and dexterous hands for humanoid research, industrial manipulation, and embodied-AI
              development, while PaXini's own TORA ONE page extends that footprint into tactile humanoid hardware. That
              means the relevant spend boundary includes fingertip tactile sensing, dexterous end effectors,
              manipulation validation, and the integration work required to turn tactile data into reliable grasping
              behavior. It excludes large portions of general force-sensor demand, commodity industrial sensing, and
              full humanoid-system revenue where the tactile layer is not separately bought or budgeted. The visible
              buyer chain is similarly layered: robotics OEMs and integrators appear to be the most direct technical
              buyers, R&D teams are early users and evaluators, and enterprise operators in manufacturing, logistics,
              retail, and healthcare appear mainly as deployment environments rather than clearly disclosed branded end
              customers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
