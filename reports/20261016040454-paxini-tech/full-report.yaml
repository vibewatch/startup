      - number: '4.3'
        title: Capital access looks stronger than disclosed cash generation
        blocks:
          - type: paragraph
            body: >-
              PaXini's strongest public financial signal is external financing, not internally generated economics.
              Multiple independent outlets report a 2026 Series B exceeding RMB 1 billion at a valuation above RMB 10
              billion, and both EqualOcean and RoboticsMedia describe a use-of-funds plan oriented toward hardware
              upgrades, larger data collection capacity, world-model development, and scaled deployment. RoboticsMedia
              further says the company is exploring a Hong Kong IPO and explicitly links that listing to expansion of
              data-collection factories and model development. That combination implies management is financing growth
              through equity and potentially public-market capital rather than through publicly demonstrated free cash
              flow. No retained source discloses cash on hand, burn, debt obligations, or runway, so capital adequacy
              can only be judged as access to financing, not as proven self-funding durability.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI012
              - CI013
      - number: '4.4'
        title: 'Financial verdict: credible financing path, weak public underwriting inputs'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed. PaXini has enough public evidence to support a credible forward
              financing path: strategic investors, a recent large round, and a plausible IPO window tied to China's
              embodied-AI enthusiasm. It does not have enough public evidence to support conviction on revenue quality,
              gross-margin direction, payback period, or cash-runway sufficiency. Independent market sources also show
              that commercialization and investor attention are concentrating around a handful of scaled humanoid
              leaders, while China's new humanoid standards increase compliance and execution demands across the value
              chain. For underwriting, the company looks financeable but still economically under-disclosed, so the
              decisive next step is management diligence on pricing, margin, and working-capital behavior rather than
              more category narrative.
            claimRefs:
              - CI007
              - CI009
              - CI010
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is observable; monetization is not
            body: >-
              The public record is strong enough to show PaXini can raise large rounds for scale-up, but not strong
              enough to show whether those deployments produce attractive unit economics.
            calloutType: insight
            claimRefs:
              - CI003
              - CI005
              - CI012
              - CI014
          - type: callout
            title: Market leadership concentration could compress economics
            body: >-
              Independent market sources point to shipment and capital concentration around a few humanoid leaders,
              which raises the risk that PaXini must absorb pricing or support pressure to stay embedded in fast-scaling
              supply chains.
            calloutType: risk
            claimRefs:
