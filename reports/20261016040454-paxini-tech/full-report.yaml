  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The strongest consistent signal in the assigned pool is that PaXini is not marketing a single component
              but a layered product set. Fundz and Gasgoo both describe the company as spanning tactile sensors,
              dexterous hands, humanoid robots, and embodied-intelligence datasets, while the official TORA page shows
              how that stack is packaged into a customer- facing robot. In workflow terms, PaXini is pitching precision
              manipulation and mobile operation for settings such as manufacturing, warehousing, automotive lines,
              retail, and healthcare. That breadth matters strategically because it supports the company's full-stack
              narrative, but the evidence is still mostly company-described or announcement-amplified rather than
              independently measured by customer outcome data or production deployment counts.
            claimRefs:
