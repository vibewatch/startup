  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 强劲的品类定位最终导向谨慎建议，因为价格支撑不及产品雄心扎实。
    data:
      nodes:
        - label: 行业需求存在
          detail: Unitree 的 IPO 进程和出货规模报道显示，中国人形机器人融资与退出叙事仍在运转。
        - label: PaXini 技术栈覆盖面真实
          detail: 保留的来源将 PaXini 定位在触觉传感器、灵巧手和人形机器人系统多个方向。
        - label: 融资支持真实
          detail: 2026 年 3 月报道了一轮超过 RMB 1 billion 的 B 轮融资，估值超过 RMB 10 billion。
        - label: 价格标尺冲突
          detail: Dealroom 仍将 PaXini 放在 $500M–1B 区间，因此公开估值尚未厘清。
        - label: 经济性仍不透明
          detail: 当前公开来源池仍缺少收入、利润率、现金跑道和清算优先权结构的披露。
        - label: 推荐 = 跟踪
          detail: 等待更清晰的变现证据，或等到更好的入场点，再把上行空间纳入投资判断。
    approximationNotes: null
