      - number: '1.4'
        title: 里程碑、外部验证与仍待验证事项
        blocks:
          - type: paragraph
            body: >-
              本次更新保留下来的带日期里程碑，集中在 2025 年末以后。Justia 显示公司于 2025 年 10 月提交美国商标申请；AutomationNews 报道公司将在 2025 年 12 月下旬至 2026 年
              1 月上旬参加 CES 2026；EqualOcean 将融资升级定于 2026 年 3 月。这些事件足以锚定当前时间线，却不能证明 PaXini
              已具备广泛市场领导力或成熟运营规模。证据池里最有力的反向信息不是负面事件报道，而是一份分析师市场预览：它把其他人形机器人厂商列为关键玩家，却在可见预览文本中没有提到
              PaXini。这不等于推翻公司的品类主张，但说明独立市场认可仍落后于 PaXini 自身定位的野心。收入、毛利率、客户数和员工数仍没有保留公开证据支持，应明确列为缺口，不能用过时记忆或旧报告补齐。
