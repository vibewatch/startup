  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 看涨
        - 产品覆盖面转化为重复部署，投资者获得可信的收入和利润率披露。
        - 估值可以维持在最近一次报告的 >RMB 10B 私募估值之上；如果经济性验证平台叙事，估值还有可能继续扩张。
        - 商业试点停滞，或行业在 PaXini 实现更广泛生产前重新定价。
        - 需要新的变现证据，而不是更多品类热情。
      - - 基准
        - 融资支持仍然可得，但收入质量和现金效率的披露依旧有限。
        - 公允价值大致围绕最近一次私募估值，经营证据赶上来之前，倍数扩张空间不大。
        - 退出时点推迟，新资金以限制普通股或新优先股投资者上行空间的条款进入。
        - 与当前公开证据集最为一致。
      - - 看跌
        - 公司公开经济性仍然不透明，同时中国人形机器人同业面临的地缘政治和商业化折价扩大。
        - 估值向 Dealroom 的较低区间等更保守的外部标尺回落，或通过保护内部人的结构化融资轮重置。
        - 下轮融资、优先权压制，或生产端采用速度低于预期。
        - 惩罚性条款融资，或行业退出窗口关闭时触发。
    notes: 情景区间只是方向性判断，因为留存的公开记录没有提供足够的收入、利润率或股权结构数据，无法建立精确模型。
    claimRefs:
      - CV005
      - CV008
      - CV009
      - CV012
      - CV013
      - CV014
