  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方链条
        blocks:
          - type: paragraph
            body: >-
              指定证据将 PaXini 描述为机器人操作层供应商，而非泛自动化厂商或纯软件模型公司。Robotichina 称其专注于人形机器人研究、工业操作和具身 AI 开发所需的触觉传感器与灵巧机械手；PaXini 自己的
              TORA ONE
              页面则将范围延伸至触觉人形硬件。因此，相关支出边界包括指尖触觉感知、灵巧末端执行器、操作验证，以及把触觉数据转化为可靠抓取行为所需的集成工作；不包括大部分通用力传感器需求、商品化工业传感，以及触觉层没有单独采购或预算的整机人形机器人收入。可见买方链条同样分层：机器人
              OEM 和集成商似乎是最直接的技术买家，研发团队是早期使用者和评估者，制造、物流、零售和医疗领域的企业运营方更多是部署环境，而不是已明确披露品牌的终端客户。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
