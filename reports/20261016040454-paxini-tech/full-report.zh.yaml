  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争横跨组件、机械手、人形机器人与内部集成
        blocks:
          - type: paragraph
            body: >
              保留证据表明 PaXini 不只是组件公司。其官方与合作伙伴页面以及独立报道，都将它放在触觉感知、灵巧机械手和完整人形机器人这几层，因此真正的比较集合是分层的，而不是单一同行组。在组件端，Tekscan
              等既有厂商让买方无需采用新的人形平台，就能把力或触觉能力加进现有设备；在平台端，Unitree 和 AGIBOT 的公开规模信号更强，Tesla Optimus、UBTech、Leju、DEEP
              Robotics、Galbot 以及小米相关项目等其他入局者则扩大了未来竞争范围。


              这种广度很重要，因为替代选项会随客户用例变化。解决狭窄传感或末端执行器问题的买方，仍可选择组件老牌厂商或定制集成，而不是 PaXini 机器人；寻求具身 AI 工作流的买方，则会把 PaXini
              与已披露出更大出货量或融资规模信号的完整人形机器人 OEM 比较。因此，PaXini 在必须把触觉感知与操作集成到同一技术栈的场景中定位最强；若客户可以把传感从机器人平台中拆出来，优势就会减弱。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
