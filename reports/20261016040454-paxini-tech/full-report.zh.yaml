      - number: '2.3'
        title: 采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              支持品类势头的同一批来源，也揭示了估值风险。买方可以通过 Tekscan
              等传统力或压力传感供应商解决部分同类问题，也可以采用能力较弱的纯视觉操作技术栈，或者把触觉硬件限制在测试和研究工作流中，而不是扩展到生产车队。集成投入很关键：在灵巧机械手从实验变成正式项目之前，买方需要可靠传感器、数据校准和可重复验证。公开证据仍没有提供投资者将品类热度转化为可辩护收入模型所需的指标：证据池未披露客户数、合同金额、试点转生产转化率、触觉装配率，也没有清晰的触觉感知加灵巧机械手市场切片。因此，市场论点在战略上可信，但在变现时点、预算归属以及相邻需求转化为持久产品收入的速度上仍不完整。
            claimRefs:
              - CM006
              - CM013
              - CM015
