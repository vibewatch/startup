      - number: '3.2'
        title: 能力广度清晰可见，但定价与商业包装仍不透明
        blocks:
          - type: paragraph
            body: >
              PaXini 的公开差异化集中在触觉数据深度和技术栈集成。Gasgoo、EqualOcean、官方 TORA 页面和 Humanoid.Guide 都强化了同一幅图景：PaXini
              想掌握传感器层、灵巧机械手及其周围的人形实体。若买方重视闭环操作，这比纯传感器老牌厂商更有防守性；但已披露证据仍不足以证明其拥有广泛的生产领导力。RBTX
              合作伙伴页面展示了渠道驱动的国际化定位并引用较大部署数量，但 PaXini 没有披露 Unitree 已在 IPO 过程中展示的收入、出货量或利润率数据。


              商业包装信号同样值得注意。保留的 PaXini 或 Tekscan 销售页面都没有公布目录价或自助交易路径，而是把买方导向演示、专家联系或定制合作。Humanoid.Guide
              页面也只是提供产品比较价值，无法解决采购尽调，因为可见的 17,200 美元是市场报告下载价格，不是 DexH13
              硬件价格。实际上，买方似乎是在几种顾问式企业销售模式之间选择，而不是比较透明目录价，这增加了转换成本和折扣风险的不确定性。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP013
              - CP014
      - number: '3.3'
        title: 护城河取决于触觉集成；规模化同行与信任壁垒带来替代风险
        blocks:
          - type: paragraph
            body: >
              公开证据里最明显的护城河，不是已经披露的价格优势，而是 PaXini 声称能把触觉硬件、灵巧操作和多模态数据装进同一个系统。客户若围绕 PaXini 的感知技术栈训练工作流，或 RBTX
              等渠道伙伴围绕其产品做标准化，整合深度就可能形成切换成本。覆盖多个机器人设备类别的商标申请也说明，管理层想保留产品范围的选择权，而不把自己锁在单一 SKU 上。


              但规模和信任可能压过架构差异化。Unitree 与 AGIBOT 已公布更强的规模信号，Techtimes 将中国供应商描述为成本和任务型集成的领先者；行业成熟后，PaXini
              承受价格或数量压力的概率会随之上升。同一来源还强调，美国针对中国人形机器人厂商的安全限制正在推进。因此，在受监管或西方部署中，即使 PaXini 的触觉技术栈很强，也可能遭遇信任折价。PaXini
              的护城河目前可信，却还没有完全验证：集成能力确有差异化，但经济性、定价权和跨境部署能力的公开证据仍不完整。
            claimRefs:
              - CP004
              - CP008
              - CP009
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: PaXini 的优势是技术栈集成，而非已披露的价格领先
