  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险主要集中在跨境审查、融资依赖和全栈可靠性。
    data:
      columns:
        - label: 可能性
          detail: 未来 12 至 18 个月风险发生的概率
        - label: 影响
          detail: 风险发生后对增长、融资或商业化造成的损害
        - label: 剩余暴露
          detail: 扣除当前可见公开缓释措施后的剩余风险敞口
      rows:
        - label: 跨境审查
          values:
            - label: 中
              detail: 美国政策讨论中，围绕中国人形机器人厂商的安全与采购审查正在升温。
            - label: 高
              detail: 海外客户采用和尽调负担可能显著增加。
            - label: 高
              detail: 指定来源尚未显示 PaXini 为海外买方准备了特定缓释材料。
        - label: 融资 / IPO 依赖
          values:
            - label: 中
              detail: 公开报道将估值动能与新资本及潜在上市活动联系起来。
            - label: 高
              detail: 上市停滞或私募市场走弱，可能削弱当前估值支撑。
            - label: 高
              detail: 公开经济性仍比公开估值信号更不充分。
        - label: 全栈可靠性
          values:
            - label: 高
              detail: 公司正把多个硬件和软件层集成进一套商业技术栈。
            - label: 高
              detail: 现场故障会同时损害产品声誉，并拖累客户转化。
            - label: 高
              detail: 关于正常运行时间、可维护性和安全性的公开证据仍然有限。
        - label: 生态集中度
          values:
            - label: 中
              detail: 融资报道显示战略支持方密集参与，但公开集中度指标尚缺。
            - label: 中
              detail: 依赖少数交易对手可能限制定价能力或参考客户的多样性。
            - label: 中
              detail: 战略投资者能起到缓释作用，但不能证明独立需求已经多元化。
        - label: IP / 合规完整性
          values:
            - label: 中
              detail: 可以看到一项商标申请，但指定来源池中的更广泛公开合规材料仍然稀少。
            - label: 中
              detail: 认证缺失或自由实施证据不足，可能拖慢企业采购和海外扩张。
            - label: 中
              detail: 风险可管理，但公开缓释细节仍然不足。
        - label: 行业采用成熟度
          values:
            - label: 中
              detail: 一项被引用的买方调查显示，买方对现有人形机器人产品的满意度仍然有限。
            - label: 中
              detail: 行业整体采用缓慢，可能拉长试点周期，并延迟转化为生产需求。
            - label: 中
              detail: 指定来源池中没有公开 PaXini 特有的留存率和试点转化证据。
