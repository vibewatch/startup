chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、边界与产品技术栈
        blocks:
          - type: paragraph
            body: >-
              PaXini 保留的公司材料始终将其定位在触觉感知，而不是单纯的人形机器人叙事上。官方关于页面将公司描述为专注于触觉核心和自动化技术，产品技术栈如今覆盖触觉传感器、灵巧机械手、人形机器人，以及具身 AI
              数据和模型基础设施。因此，后续章节可复用的事实基础比公司自称的“全球领导者”更窄：PaXini
              确实在搭建完整的具身智能技术栈，但公开记录更多混合了自我描述、展会文案和贸易媒体复述，而非独立审计的商业披露。指定证据中最具体的规模指标来自 ITES 展商资料：天津数据工厂面积近 12,000 平方米，覆盖
              15+N 个场景，拥有 150 个标准化采集单元，年数据点近 2 亿。尽管这些仍是第三方平台上的公司供稿，它们可作为基础设施信号。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
