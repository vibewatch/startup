            title: 公开商业化证据仍过于粗略，无法精确测算 SAM/SOM
            body: 指定来源展示了行业广度和资本胃口，但没有披露装配率、合同金额或试点转生产转化率，投资者无法据此有把握地建模需求。
            calloutType: risk
            claimRefs:
