      - number: '2.2'
        title: 市场规模视角与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              证据池里的公开市场规模测算宽泛而且间接。最干净的数字视角来自 MarketsandMarkets：其估计力传感器市场规模为 USD 2.30 billion in 2024，预计到 2035 年达到 USD
              3.93 billion，CAGR 为 5.0%。但这只是相邻品类的上限视角，不是 PaXini
              的可服务市场，因为它涵盖的传感器技术、应用和地域远超触觉机械手。更有价值的结论是方向性的：多个来源显示，凡是触觉感知能改善精细操作的领域，需求都在增长；EqualOcean 的 2026
              年报道则称，具身智能需求正转向支撑物理 AI 在现实世界运行的数据、仿真和感知基础设施。Gasgoo
              的估值背景和部署行业清单进一步说明，投资者与试点客户把灵巧操作视为战略瓶颈，而非小众配件。不过，现有证据仍指向一个由相邻预算逐步拼成的市场，而不是 SAM、SOM 边界透明的成熟标准品类。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
