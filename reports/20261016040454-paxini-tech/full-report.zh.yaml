        title: 展示项
        blocks:
          - type: callout
            title: 相关市场是切入口，不是泛机器人 TAM
            body: PaXini 有证据支持的机会位于触觉感知、灵巧操作和具身 AI 部署工作流；泛机器人或力传感器数据只能作为外部边界。
            calloutType: insight
