  summary: >-
    PaXini Tech 是一家总部位于深圳的后期私人机器人公司，业务聚焦触觉感知、灵巧操作、人形系统，以及具身 AI 数据 / 模型基础设施。现有公开记录支持其于 2021 年成立，并在 2026 年 3 月完成一轮超过 RMB 1
