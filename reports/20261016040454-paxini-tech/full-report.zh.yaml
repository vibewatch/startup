              可以指向产业投资者、全球伙伴定位，以及其声称跨多个垂直领域进行批量商业交付。这些信号有意义，但不能替代经审计运营指标、客户集中度披露、安全与安保证明，或旗舰部署转化为可重复生产收入的硬证据。因此，论点失效标准是可监测的：如果香港上市在没有等值私募融资替代的情况下停滞；如果海外买方因安全或监管担忧而放缓；或者公司无法证明展示部署之外的持久在线率和经济表现，当前估值叙事就会明显走弱。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要论点失效触发器
            body: 如果香港上市或可比融资路径在 PaXini 展示已披露、由客户支撑的生产经济性之前延误，当前估值故事将失去最清晰的公开验证机制。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: callout
            title: 最明显的缓释措施
            body: 战略投资者、全球伙伴定位和声称的批量交付降低了市场进入摩擦，但尚不能替代经审计的单位经济性、多元化客户证明或安全与安保证明。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值指标积极，但彼此不一致
        blocks:
          - type: paragraph
            body: >-
              当前最强的定价信号来自 2026 年 3 月融资报道：EqualOcean 和 Gasgoo 都称 Series B 超过 RMB 1 billion、估值超过 RMB 10
              billion。这说明公司能把大额资本吸引到具身 AI 主题上，意义重大。但公开估值图景并不干净：Dealroom 仍将 PaXini 的 2026 年估值列在 $500M–1B 区间，只披露 $100–500M
              的宽泛累计融资区间。结论不是某个数据点必然错误，而是外部投资者仍没有一个能够与已披露经济性或股份类别条款对应、并经过相互核对的单一公开估值。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.2'
        title: 论点真实存在，但证据仍不足以支持激进买入
        blocks:
          - type: paragraph
            body: >-
              看多论点始于真实的产品广度。Dealroom 和 PaXini
              自己的产品材料展示了从触觉感知延伸到灵巧机械手、人形系统的技术栈；若商业化跑通，价值就能沿多条路径累积，因此具备战略吸引力。商标申请也说明公司正在准备更宽的品牌和 IP
              定位。反向论点是，公开证据对野心的描述仍多于对变现的证明。本章证据池提供了融资和定位细节，却没有披露经常性收入、毛利率、现金跑道、试点转化或清算优先权细节，因此公开证据对当前价格的支撑弱于对 PaXini
              技术野心的支撑。
            claimRefs:
              - CV001
              - CV007
              - CV011
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
      - number: '8.3'
        title: 情景分析支持“跟踪”判断与估值偏高立场
        blocks:
          - type: paragraph
            body: >-
              因此估值判断应继续对价格敏感。如果 PaXini 将触觉加人形定位转化为重复生产部署，且当前融资估值最终由持久收入而非单纯品类热度支撑，就存在乐观情景。基准情景更保守：投资者应假设融资渠道仍强，但在 PaXini
              披露运营指标、市场更清楚地判断行业退出窗口之前，估值倍数支撑仍有限。悲观情景不是公司失败，而是公司私募估值跑在公开证据当前能够支持的水平之前，尤其是在中国人形机器人退出仍带有地缘政治和商业化折价之时。综合来看，跟踪比买入更有依据。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调应聚焦变现质量与下行结构
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应尝试证伪当前谨慎判断，而不是继续收集主题热度。最重要的问题应客观且与交易直接相关：按产品线划分的当前收入、硬件与软件或数据产品各自的毛利率、试点转生产转化率、客户集中度、烧钱和现金续航，以及排在新资金之前的具体优先权、债务或老股压力。这些问题若出现积极意外，可能上调建议；相反，即使
              PaXini 继续推出技术上令人印象深刻的产品，降轮、附带重优先权的融资，或行业退出窗口收窄的证据，都将触发论点失效。
            claimRefs:
              - CV007
              - CV009
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪，不买入
            body: 融资和产品故事可信，但估值指标相互冲突、运营披露仍薄弱，公开记录仍支持谨慎且对价格敏感的立场。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV013
              - CV014
