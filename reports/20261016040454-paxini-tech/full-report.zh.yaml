      - number: '1.3'
        title: 融资信号、估值锚点与利益相关方
        blocks:
          - type: paragraph
            body: >-
              这组证据里，最清晰、且有独立媒体报道的融资锚点是 2026 年 3 月的 Series B。EqualOcean 报道融资额超过 RMB 1 billion、估值超过 RMB 10 billion；Gasgoo
              复述了相同的轮次规模和估值门槛，并补充称 PaXini 属于一批资金充裕的具身机器人初创公司。这些报道还披露了由国家资本、产业投资者和现有股东跟投组成的财团，比官网未标注的投资者 logo
              墙更有信息量。但所有权分析仍不完整：保留来源没有披露准确的股权比例、董事席位、清算优先权或债务 / 信贷安排。因此，本章对融资的结论必须守住边界：PaXini
              已证明融资能力和生态支持较强，但尚未证明具备公开财务透明度。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
