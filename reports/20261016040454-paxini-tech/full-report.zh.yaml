        title: 创业根基、管理层可见度与治理边界
        blocks:
          - type: paragraph
            body: >-
              保留证据支持一条连贯的起源故事，但不足以拼出完整的管理层图谱。公司及贸易媒体来源均称创始团队源自早稻田大学机器人实验室，Gasgoo 还明确将公司成立时间定为 2021
              年。证据没有提供可靠的公开高管、董事或控制权名单。这一点很重要：公司战略依赖传感器、灵巧机械手、人形系统和大规模数据资产的整合；若缺少具名运营团队和治理细节，后续尽调就无法清晰区分机构能力与创始人驱动的执行力。实际结论是，PaXini
              的技术背景清晰可见，但本章可用的公开材料对关键人风险和监督风险记录不足。
            claimRefs:
