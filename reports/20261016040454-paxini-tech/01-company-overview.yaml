    approximationNotes: >-
      The assigned pool does not provide enough reliable earlier dated milestones to reach eight entries without reusing unsupported historical memory, so the timeline is intentionally limited to sourced events.
    claimRefs: [CO005, CO006, CO007, CO008]
callouts:
  - calloutType: insight
    title: What is solid enough to reuse
    body: >-
      Later chapters can safely reuse PaXini's Waseda-rooted founding story, tactile-first product stack, March 2026 financing step-up, and Tianjin data-factory scale claims as sourced anchors.
    claimRefs: [CO002, CO003, CO004, CO008]
  - calloutType: risk
    title: Disclosure opacity is still a core diligence issue
    body: >-
      The chapter still lacks independently verified revenue, customer count, headcount, named executive coverage, board structure, and cap-table detail, which keeps judgment confidence below what the valuation headline alone implies.
    claimRefs: [CO010, CO011, CO012]
