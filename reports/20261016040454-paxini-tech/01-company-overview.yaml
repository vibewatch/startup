company:
  name: PaXini Tech
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PaXini enters this refresh as a late-stage private robotics company whose public story is
    strongest on tactile-sensing technology, embodied-AI infrastructure, and a March 2026 Series B
    above RMB 1 billion at a valuation above RMB 10 billion. The evidence base is materially weaker
    on named leadership, board structure, revenue, customer count, and headcount, so later chapters
    should reuse the identity and funding anchors here while treating operating scale claims as still
    under-disclosed.
sections:
  - id: identity-and-scope
    title: Identity, scope, and product stack
    body: >-
      PaXini’s retained company materials consistently position it around tactile perception rather
      than a pure humanoid-robot narrative. The official about pages describe the company as focused
      on haptic core and automation technology, while the product stack now spans tactile sensors,
      dexterous hands, humanoid robots, and embodied-AI data and model infrastructure. That makes the
      reusable ground truth for later chapters narrower than the company’s own “global leader”
      language: PaXini is clearly building a full embodied-intelligence stack, but the public record
      still mixes self-description, exhibit copy, and trade-press repetition more than independently
      audited commercial disclosures. The most concrete scale marker inside the assigned evidence is
      the ITES exhibitor profile describing a Tianjin data factory with nearly 12,000 square meters,
      15+N scenarios, 150 standardized collection units, and nearly 200 million annual data points,
      which is useful as an infrastructure signal even though it remains company-supplied text on a
      third-party platform.
    claimRefs: [CO001, CO002, CO003, CO004, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founding roots, leadership visibility, and governance limits
    body: >-
      The retained evidence supports a coherent origin story but not a complete management map.
      Company and trade-press sources align on a founding team rooted in Waseda University’s robotics
      lab, and Gasgoo explicitly dates the company’s founding to 2021. What the evidence does not
      provide is a reliable public roster of named executives, board members, or control rights. That
      matters because the company’s strategy depends on integrating sensors, dexterous hands, humanoid
      systems, and large data assets; without named operator coverage or governance detail, later
      diligence cannot cleanly separate institutional capability from founder-centric execution. The
      practical takeaway is that PaXini’s technical pedigree is visible, but key-person and oversight
      risk remain under-documented in public materials available to this chapter.
    claimRefs: [CO002, CO005, CO006, CO011, CO012]
    tableRefs: [TO002]
  - id: funding-and-stakeholders
    title: Funding signal, valuation anchor, and stakeholder map
    body: >-
      The clearest independently reported financing anchor in this pool is the March 2026 Series B.
      EqualOcean reports financing above RMB 1 billion and valuation above RMB 10 billion, while
      Gasgoo repeats the same round size and valuation threshold and adds context that PaXini sits
      among a broader group of richly funded embodied-robotics startups. Those articles also disclose
      a syndicate that mixes state-backed capital, industrial investors, and existing shareholder
      follow-on support, which is more informative than the official site’s unlabeled logo walls. The
      evidence is still incomplete for ownership analysis: no retained source discloses exact cap-table
      percentages, board seats, liquidation preferences, or debt/credit facilities. For this chapter,
      the funding conclusion should therefore stay bounded: PaXini has demonstrated strong capital
      access and ecosystem sponsorship, but not public financial transparency.
    claimRefs: [CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestones-and-reuse-boundaries
    title: Milestones, external validation, and what remains unverified
    body: >-
      The dated milestones that survive this refresh are concentrated from late 2025 onward. Justia
      shows a U.S. trademark filing in October 2025, AutomationNews places the company at CES 2026 in
      late December 2025 and early January 2026, and EqualOcean dates the financing step-up to March
      2026. Those events are enough to anchor a current timeline, but they do not prove broad market
      leadership or mature operating scale. The strongest counterweight in the assigned pool is not a
      negative incident report but an analyst-market preview that names other humanoid-robot vendors as
      key players while leaving PaXini unmentioned in visible preview text. That does not disprove the
      company’s category claims, but it does mean independent market recognition still lags the
      ambition of PaXini’s own positioning. Revenue, gross margin, customer count, and headcount remain
      unsupported by the retained public evidence and should stay as explicit gaps rather than be
      backfilled from stale memory or prior reports.
    claimRefs: [CO006, CO007, CO008, CO011, CO013, CO014]
    figureRefs: [FO001]
