  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public repository, SDK, package-registry, forum, conference, or integration-community evidence showing practitioner adoption of PaXini's stack.
      whyItMatters: Without a developer or practitioner proxy, it is hard to judge integration friction, third-party experimentation, and how open or closed the product surface really is.
      diligencePath: Request engineering docs, SDK/API references, partner-integration materials, or practitioner-community artifacts from management.
      relatedQuestionRefs: [QE008]
    - type: conflicting-data
      severity: material
      topic: tora-specs
      missingEvidence: A current engineering datasheet or controlled demo sheet that reconciles the English and Chinese TORA specifications.
      whyItMatters: Spec conflicts reduce confidence in payload, dexterity, and system-performance claims that matter for deployment underwriting.
      diligencePath: Obtain the latest signed product spec sheet and ask management to reconcile all public-language variants line by line.
    - type: missing-source
      severity: material
      topic: deployment-proof
      missingEvidence: Named production deployments, pilot-to-production conversion rates, uptime statistics, or customer outcome metrics for PaXini systems.
      whyItMatters: Sector lists and commercialization claims do not prove repeatable production adoption or durable ROI.
      diligencePath: Ask for named references, deployment counts by sector, contract stages, and reliability reports for live systems.
