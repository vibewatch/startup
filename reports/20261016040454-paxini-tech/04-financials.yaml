company:
  name: PaXini Tech
chapter:
  number: 4
  title: Financials
  summary: >-
    PaXini appears well capitalized for near-term expansion after a 2026 Series B above RMB 1 billion and an
    explored Hong Kong IPO, but public evidence still shows a financing story that is much better disclosed than its
    underlying revenue quality. The visible commercial stack spans tactile sensors, dexterous manipulation, and
    humanoid systems, yet public sources do not disclose pricing realization, revenue mix, gross margin, CAC, or
    runway, leaving underwriting dependent on management diligence rather than published operating metrics.
sections:
  - id: visible-revenue-stack
    title: Visible revenue stack, but no public price realization
    body: >-
      Public evidence supports PaXini as a multi-surface robotics vendor rather than a single-sensor component
      company. Company and financing disclosures consistently describe a stack from tactile sensors to dexterous hands
      and humanoid robots, which means the eventual revenue model likely blends hardware, integration, and embodied-AI
      infrastructure rather than a clean recurring-software stream. What remains missing is the buyer-side economic
      detail: the public robot page discloses technical specifications and operating claims, but it does not publish
      list prices, contract structure, discounting, warranty terms, or any distinction between one-time hardware
      revenue and recurring software, data, or maintenance revenue. That makes the monetization architecture visible in
      product terms but still opaque in underwriting terms.
    claimRefs: [CI001, CI002, CI004, CI006, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-without-efficiency
    title: Deployment signals exist, but sales efficiency is still a diligence gap
    body: >-
      The available public traction indicators are operational rather than financial. Gasgoo says PaXini products and
      solutions are deployed across manufacturing, logistics, retail, smart homes, and healthcare, while RoboticsMedia
      reports a Geely production-line deployment in which Tora-One handled automotive tasks with eight hours of
      continuous operation and a 99.8% task success rate. Those signals matter because they suggest commercial
      relevance beyond lab demonstrations. They still do not answer whether pilots convert into repeat orders, what
      the average contract value looks like, how much custom integration is required, or whether channel and service
      costs compress margins. Public evidence therefore supports commercialization momentum, but not sales efficiency.
    claimRefs: [CI002, CI006, CI008, CI012]
    tableRefs: [TI003]
  - id: capital-availability
    title: Capital access looks stronger than disclosed cash generation
    body: >-
      PaXini's strongest public financial signal is external financing, not internally generated economics. Multiple
      independent outlets report a 2026 Series B exceeding RMB 1 billion at a valuation above RMB 10 billion, and
      both EqualOcean and RoboticsMedia describe a use-of-funds plan oriented toward hardware upgrades, larger data
      collection capacity, world-model development, and scaled deployment. RoboticsMedia further says the company is
      exploring a Hong Kong IPO and explicitly links that listing to expansion of data-collection factories and model
      development. That combination implies management is financing growth through equity and potentially public-market
      capital rather than through publicly demonstrated free cash flow. No retained source discloses cash on hand,
      burn, debt obligations, or runway, so capital adequacy can only be judged as access to financing, not as proven
      self-funding durability.
    claimRefs: [CI003, CI004, CI005, CI009, CI012, CI013]
  - id: verdict-and-blockers
    title: "Financial verdict: credible financing path, weak public underwriting inputs"
    body: >-
      The financial verdict is therefore mixed. PaXini has enough public evidence to support a credible forward
      financing path: strategic investors, a recent large round, and a plausible IPO window tied to China's embodied-AI
      enthusiasm. It does not have enough public evidence to support conviction on revenue quality, gross-margin
      direction, payback period, or cash-runway sufficiency. Independent market sources also show that commercialization
      and investor attention are concentrating around a handful of scaled humanoid leaders, while China's new humanoid
      standards increase compliance and execution demands across the value chain. For underwriting, the company looks
      financeable but still economically under-disclosed, so the decisive next step is management diligence on pricing,
      margin, and working-capital behavior rather than more category narrative.
    claimRefs: [CI007, CI009, CI010, CI013, CI014]
