          note: Capital raised is visible, but margin, burn, and cash-balance data remain undisclosed.
    claimRefs: [CI001, CI002, CI005, CI006, CI008, CI012]
callouts:
  - calloutType: insight
    title: Financing is observable; monetization is not
    body: >-
      The public record is strong enough to show PaXini can raise large rounds for scale-up, but not strong enough to
      show whether those deployments produce attractive unit economics.
    claimRefs: [CI003, CI005, CI012, CI014]
  - calloutType: risk
    title: Market leadership concentration could compress economics
    body: >-
      Independent market sources point to shipment and capital concentration around a few humanoid leaders, which raises
      the risk that PaXini must absorb pricing or support pressure to stay embedded in fast-scaling supply chains.
    claimRefs: [CI009, CI013]
