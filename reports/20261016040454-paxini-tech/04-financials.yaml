      - ["Data/model infrastructure and integration", "Data collection, model development, and deployment services tied to embodied AI scale-up", "Project or service program", "Use of funds implies commercial importance but public customer monetization is undisclosed", "Could be valuable but currently inference-heavy", "Separate service revenue, software revenue, and internal R&D spend"]
    notes: >-
      Public sources show product categories and financing priorities, not booked revenue by stream; null pricing detail
      reflects unavailable public disclosure rather than zero monetization.
    claimRefs: [CI001, CI004, CI005, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Tora-One humanoid robot", "Public price not disclosed", "Only technical specs and operating claims are public", "Unknown enterprise discounting, warranty, or bundling", "Company robot page"]
      - ["Tactile sensors / dexterous hand stack", "Public price not disclosed", "No retained source publishes list or transaction pricing", "Unknown whether sold stand-alone or bundled into robots and pilots", "Company and financing coverage"]
      - ["Pilot deployment / data-collection / model-development programs", "Contract economics not disclosed", "Use-of-funds commentary implies commercialization but not price realization", "Unknown customer contribution, milestone billing, or support burden", "EqualOcean and RoboticsMedia"]
    notes: >-
      This is a disclosure table, not a price list: every row records the absence of public commercial terms in the
      retained evidence set.
    claimRefs: [CI001, CI004, CI005, CI006]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue disclosure", "Not publicly disclosed", "Low", "Revenue scale is the core denominator for valuation and runway analysis", "Provide latest revenue and trailing twelve-month bookings"]
      - ["Gross margin", "Not publicly disclosed", "Low", "Hardware and services can carry very different margin profiles", "Provide gross margin by product line and deployment program"]
      - ["Sales efficiency", "Deployment evidence but no CAC, payback, or sales-cycle disclosure", "Low", "Commercial traction without efficiency data cannot support spend scaling", "Share win rates, CAC, payback, and sales-cycle duration"]
      - ["Capital access", "Series B above RMB 1 billion and valuation above RMB 10 billion", "Medium", "Financing strength can extend runway even when operating metrics are private", "Provide post-round cash balance and covenant-free liquidity"]
      - ["Market concentration risk", "Unitree and AgiBot projected to capture nearly 80 percent of 2026 shipments", "Medium", "Concentrated shipment economics can pressure suppliers and late adopters", "Show PaXini's share of sensor, hand, and robot revenue by customer and application"]
    notes: >-
      Values are limited to public disclosures and independent market proxies; undisclosed items are diligence blockers,
      not negative conclusions.
    claimRefs: [CI003, CI007, CI009, CI012, CI013]
