      - [Capital-market window, Potential Hong Kong IPO and follow-on financing ecosystem, Funding growth infrastructure and commercialization, High until private economics are disclosed, Listing delay or weaker market appetite forces slower scaling or dilutive financing, High, Maintain contingency financing plan and evidence-backed milestone budget, High]
      - [Flagship deployment concentration, Highlighted enterprise deployments such as Geely in public coverage, Commercial proof and reference value, Unknown publicly, Named showcases overstate repeatable production demand or deployment durability, Medium, Publish deployment count renewal data and pilot-to-production conversion metrics, Medium]
    notes: >-
      Public coverage identifies counterparties and deployment examples but does not quantify revenue
      concentration, contract duration, or renewal mix.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Highest residual exposure sits in cross-border scrutiny, financing dependence, and full-stack reliability.
    data:
      columns:
        - label: Likelihood
          detail: Current 12- to 18-month risk realization probability
        - label: Impact
          detail: Damage to growth, financing, or commercialization if realized
        - label: Residual exposure
          detail: Remaining exposure after currently visible public mitigations
      rows:
        - label: Cross-border scrutiny
          values:
            - label: Medium
              detail: Security and procurement scrutiny around Chinese humanoid vendors is already rising in U.S. policy debate.
            - label: High
              detail: Overseas customer adoption and diligence burden could increase materially.
            - label: High
              detail: Assigned evidence does not yet show PaXini-specific mitigation artifacts for overseas buyers.
        - label: Financing / IPO dependence
          values:
            - label: Medium
              detail: Public coverage ties valuation momentum to fresh capital and possible listing activity.
            - label: High
              detail: A stalled listing or weaker private market could challenge current valuation support.
            - label: High
              detail: Public economics remain thinner than public valuation signals.
        - label: Full-stack reliability
          values:
            - label: High
              detail: The company is integrating multiple hardware and software layers into one commercial stack.
            - label: High
              detail: Field failures would affect product reputation and customer conversion simultaneously.
            - label: High
              detail: Public proof of uptime, serviceability, and safety remains limited.
        - label: Ecosystem concentration
          values:
            - label: Medium
              detail: Financing coverage shows dense strategic-backer involvement, but public concentration metrics are absent.
            - label: Medium
              detail: Dependence on a few counterparties could limit pricing power or reference diversity.
            - label: Medium
              detail: Strategic investors are a mitigation, but not proof of diversified independent demand.
        - label: IP / compliance completeness
          values:
            - label: Medium
              detail: A trademark filing is visible, but broader public compliance artifacts remain sparse in the assigned pool.
            - label: Medium
              detail: Missing certifications or freedom-to-operate evidence can slow enterprise procurement and overseas scaling.
            - label: Medium
              detail: The risk is manageable, but public mitigation detail is still thin.
        - label: Sector adoption maturity
          values:
            - label: Medium
              detail: A cited buyer survey indicates satisfaction with available humanoid products remains limited.
            - label: Medium
              detail: Slow sector-wide adoption can lengthen pilots and delay conversion into production demand.
            - label: Medium
              detail: PaXini-specific retention and pilot-conversion evidence is not public in the assigned pool.
    claimRefs: [CR003, CR007, CR009, CR013, CR015, CR016]
callouts:
  - calloutType: risk
    title: Top thesis-break trigger
    body: >-
      If a Hong Kong listing or comparable financing path slips before PaXini can show disclosed
      customer-backed production economics, the current valuation story loses its clearest public
      validation mechanism.
    claimRefs: [CR004, CR005, CR006, CR007]
  - calloutType: insight
    title: Best visible mitigation
    body: >-
      Strategic investors, global-partner positioning, and claimed batch delivery reduce go-to-market
      friction, but they do not yet replace audited unit economics, diversified customer proof, or
      security and safety attestations.
    claimRefs: [CR001, CR002, CR008, CR009]
