      - [Safety and deployment-complexity risk, TORA-ONE combines LiDAR 5 HD cameras 2 depth cameras 47 degrees of freedom and 2280 tactile sensors which increases verification burden in live environments, Medium, High, Low, High, Need site-safety certifications incident logs and supervised-vs-autonomous operating boundaries]
      - [Security and data-governance risk, Public assigned evidence highlights tactile-plus-vision data expansion but does not surface PaXini-specific security attestations or public incident disclosures, Medium, Medium, Low, Medium, Need privacy architecture security audits customer DPA terms and incident-response process]
      - [Component-margin and scaling risk, The assigned market preview lists established force-sensor incumbents but carries a publication label after the report run date, Medium, Medium, Medium, Medium, Need current third-party market evidence plus BOM yield gross-margin trend and proof that full-system value capture outweighs component price pressure]
    notes: >-
      Residual exposure reflects public evidence strength rather than confirmed incident history; no
      assigned source documents a PaXini-specific outage recall or breach.
    claimRefs: [CR001, CR002, CR003, CR011, CR014, CR015]
