  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-transparency
      missingEvidence: Public list pricing, contract terms, and discount structure for PaXini, Unitree, and AGIBOT hardware.
      whyItMatters: Without quoted pricing or contract model detail, it is hard to test whether PaXini wins on cost, bundle depth, or only narrative differentiation.
      diligencePath: Obtain customer quotations, reseller terms, or procurement documents that show SKU-level pricing and service commitments.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Named customer mix, pilot-to-production conversion, and recurring reorder behavior for PaXini deployments.
      whyItMatters: Partner and company deployment counts are directionally useful but do not prove durable production adoption or switching cost.
      diligencePath: Request customer cohort data, reference calls, and contract history separating pilots from scaled production programs.
      relatedQuestionRefs: [QP003, QP006]
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: competitive-pressure
      missingEvidence: Independent side-by-side benchmarks on tactile accuracy, grasp reliability, and workflow success versus Unitree, AGIBOT, and sensor-only substitutes.
      whyItMatters: Public specs and funding signals do not prove that PaXini's tactile stack translates into sustained performance or pricing power.
      diligencePath: Collect third-party benchmarks, customer acceptance-test data, or reproducible technical evaluations across comparable tasks.
      relatedQuestionRefs: [QP004, QP007, QP008]
      relatedTableRefs: [TP002]
