    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [PaXini, "Full-stack tactile sensing + dexterous manipulation", "Series B > RMB 1b; valuation > RMB 10b", "Industrial automation, logistics, healthcare, service robotics", "Combines tactile sensors, dexterous hands, and humanoid systems", "Public shipment, margin, and list-pricing disclosure is limited"]
      - [Unitree, "Humanoid / embodied-AI OEM", "STAR Market IPO review cleared; 2025 revenue CNY 1.699b; target valuation ~$6.2b", "Research, platform developers, commercial robotics buyers", "Public scale disclosure and cost-led positioning", "Security scrutiny and profit volatility create trust risk"]
      - [AGIBOT, "Humanoid OEM", "10,000th humanoid robot reported in Mar 2026", "Logistics, retail, hospitality, industrial manufacturing", "Fast throughput growth and broad deployment claims", "Commercial utilization depth is still not independently verified in retained sources"]
      - [Tekscan, "Force / pressure / tactile sensing incumbent", "No funding or revenue figure on retained surface", "OEMs, R&D, QC, clinical and research users", "Embedded sensors, pressure mapping, and custom sensor design", "Does not offer a full humanoid platform on the cited surface"]
    notes: >-
      Scale and funding cells use only retained public signals; blanks are not backfilled from
      prior reports. Limitation fields mix direct disclosures with clearly labeled evidence-set
      gaps where shipment, pricing, or commercialization depth is not public.
    claimRefs: [CP001, CP003, CP007, CP008, CP009, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - PaXini
      - Unitree
      - AGIBOT
      - Tekscan
    rows:
      - ["Native tactile sensing depth", "Yes — core positioning across hands and robots", "Unknown in retained sources", "Unknown in retained sources", "Yes — sensing specialist"]
      - ["Dexterous hand offering", "Yes — DexH13 family", "Unknown in retained sources", "Unknown in retained sources", "No humanoid hand surface retained"]
      - ["Full humanoid platform", "Yes — TORA line", "Yes", "Yes", "No"]
      - ["Public commercialization signal", "Partner cites 50+ industries and 1,000+ projects; no shipment count", "IPO-review clearance plus disclosed revenue", "10,000th unit reported", "Broad OEM / clinical application positioning, but not humanoid volume"]
    notes: >-
      "Unknown" means the retained chapter evidence did not support a yes/no determination on
      the cited surfaces. The matrix compares public evidence quality, not absolute technical
      superiority, and therefore weights disclosed scale signals separately from claimed specs.
    claimRefs: [CP001, CP004, CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Surface
      - Public price signal
      - Contract model / CTA
      - Included capability signal
      - Unknowns / implication
    rows:
      - ["PaXini TORA ONE official page", "Undisclosed", "Product page; no checkout shown", "Humanoid specs, application scenarios, tactile stack", "Buyer still needs direct sales engagement for pricing, terms, and volume commitments"]
      - ["PaXini via RBTX partner page", "Undisclosed", "Book live product demo", "Partner-led company profile and distribution signal", "Suggests consultative channel sale rather than transparent list pricing"]
      - ["Tekscan official surface", "Undisclosed", "Request a demonstration / Contact an expert", "Sensor systems, OEM integration, custom design", "Incumbent substitute also appears to sell through expert-led qualification"]
      - ["Humanoid.Guide DexH13 listing", "USD 17,200 visible only for the market report download", "Listing / compare page", "Product specs and in-production status", "Improves product comparability but does not reveal DexH13 hardware pricing"]
    notes: >-
      This table compares pricing disclosure and commercial packaging, not realized contract
      economics. "Undisclosed" means no list price appeared on the retained cited surface;
      the Humanoid.Guide dollar figure applies to the report product, not the robot hand.
    claimRefs: [CP004, CP013, CP014]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Public evidence places PaXini between sensor incumbents and scaled humanoid OEMs: broader
      than component specialists, but less commercially proven than the highest-volume peers.
    data:
      xAxis:
        label: System breadth
        min: 1
        max: 5
        lowLabel: Component or end-effector specialist
        highLabel: Full-stack humanoid platform
      yAxis:
        label: Commercialization signal
        min: 1
        max: 5
        lowLabel: Product proof only
        highLabel: Public deployment, financing, or volume signal
      points:
        - label: Tekscan
          x: 1.5
          y: 4
          detail: "Incumbent sensing specialist with OEM integration and custom design services, but no cited humanoid platform."
        - label: PaXini DexH13
          x: 2.5
          y: 3
          detail: "In-production four-finger dexterous hand with tactile/force sensing and 5 kg strength on retained evaluator surface."
        - label: PaXini TORA ONE
          x: 4
          y: 3.5
          detail: "Official humanoid product page shows 47 DOF, 2,280 tactile sensors, and application scenarios, but no public shipment count."
        - label: PaXini platform
          x: 5
          y: 4
          detail: "Retained sources consistently position PaXini across tactile sensors, dexterous hands, and humanoid systems."
        - label: Unitree
          x: 4.5
          y: 5
          detail: "IPO-review clearance, disclosed 2025 revenue, and NVIDIA reference-platform visibility imply stronger public scale proof."
        - label: AGIBOT
          x: 4.5
          y: 5
          detail: "10,000th humanoid unit and shipment-share commentary imply the strongest public throughput signal among retained peers."
    approximationNotes: >-
      Coordinates are ordinal scores anchored to retained public evidence quality, not measured
      benchmark deltas. Equal scores indicate similar public positioning signals, not identical
      technical capability.
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP009]
callouts:
  - calloutType: strength
    title: PaXini's edge is stack integration, not disclosed price leadership
    body: >-
      The company looks more differentiated when a buyer needs tactile sensing, dexterous
      manipulation, and humanoid embodiment together than when the problem can be solved with a
      component-only incumbent. That gives PaXini a plausible architectural moat even before
      public economics are visible.
    claimRefs: [CP001, CP005, CP006, CP007]
  - calloutType: risk
    title: Scale and trust signals favor larger peers in sensitive deployments
    body: >-
      Unitree and AGIBOT already disclose stronger public scale markers, while pending U.S.
      restrictions on Chinese humanoid vendors could make Western buyers favor alternatives with
      clearer trust posture. PaXini therefore risks being differentiated technically but still
      disadvantaged in the largest or most regulated procurement processes.
    claimRefs: [CP008, CP009, CP015]
