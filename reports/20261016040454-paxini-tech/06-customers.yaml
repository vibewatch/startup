figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence shows multiple adoption surfaces, but only one named production-style loop is well specified.
    data:
      nodes:
        - label: Component buyers
          detail: Sensor and dexterous-hand buyers evaluating tactile performance and integration.
          touchpoints:
            - Official product pages position DexH for fine and flexible multi-scene operations.
            - Nearly 1 million tactile chips consumed is the clearest disclosed component-demand signal.
        - label: Factory deployment
          detail: Automotive plant workflows using embodied-robot systems.
          touchpoints:
            - Geely's Qiantang manufacturing base is the only named production-style deployment in the reviewed set.
            - Public outcome evidence centers on wiring-harness assembly and pasting.
        - label: Horizontal sectors
          detail: Logistics, warehousing, retail, smart homes, healthcare, and precision manufacturing.
          touchpoints:
            - Sector breadth is disclosed in news coverage.
            - Named customers and deployment counts by sector are still absent.
        - label: Data customers
          detail: Model builders and internet companies using tactile datasets.
          touchpoints:
            - Gasgoo says several leading model companies and major internet technology giants use Paxini data.
            - Public materials do not identify who pays, how often, or under what contract structure.
        - label: Geographic expansion
          detail: North America, Japan, South Korea, and Europe.
          touchpoints:
            - Localized operations and delivery systems are being accelerated.
            - The public record does not yet show customer density or regional revenue by market.
        - label: Expansion loop
          detail: Pilots to scaled deployment.
          touchpoints:
            - EqualOcean says financing will accelerate commercial pilots and large-scale deployment.
            - Missing renewals, cohorts, and concentration data still block a strong durability read.
    claimRefs: [CU002, CU003, CU005, CU007, CU008, CU009, CU013]
callouts:
  - calloutType: insight
    title: Commercialization is real, but evidence quality is uneven
    body: >-
      Public sources support real deployment and demand signals across hardware
      and data surfaces, yet only one named production-style customer example
      is documented in detail. The rest of the narrative is still dominated by
      broad sector claims, unnamed users, and strategic-investor logos.
    claimRefs: [CU003, CU004, CU005, CU007, CU014]
  - calloutType: risk
    title: Customer durability still hinges on proof beyond Geely
    body: >-
      Until PaXini discloses a wider set of named production accounts, renewal
      behavior, and concentration metrics, investors should treat the current
      customer story as promising but not yet fully de-risked. Substitute
      suppliers and logo inflation remain live diligence issues.
    claimRefs: [CU007, CU012, CU013, CU014]
