  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer count, renewal, churn, contract length, and top-customer revenue disclosures.
      whyItMatters: Without durability and concentration metrics, it is difficult to convert the current commercialization narrative into a reliable recurring-revenue or stickiness view.
      diligencePath: Request cohort data, renewal schedules, top-10 customer mix, and pilot-to-production conversion metrics from management.
      relatedQuestionRefs: [QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table
