company:
  name: PaXini Tech
chapter:
  number: 6
  title: Customers
  summary: >-
    PaXini's public customer evidence points to real commercialization across
    tactile components, robot deployments, and embodied-AI data services, but
    the proof is still much deeper on breadth than on named durability. The
    clearest named production-style reference is Geely's Qiantang factory,
    while other customer and retention claims remain broad, unnamed, or mixed
    with strategic-investor logos.
sections:
  - id: customer-footprint
    title: Customer footprint is broad by use case but thinly named
    body: >-
      PaXini's disclosed customer surface spans more than one buyer type. The
      company and adjacent coverage describe a stack that can sell into
      component buyers, dexterous-hand integrators, humanoid deployment sites,
      and embodied-AI teams that need tactile data and models. Public sector
      references span precision manufacturing, logistics and warehousing,
      automotive production lines, retail, smart homes, and healthcare, which
      suggests management is pursuing horizontal demand rather than a single
      vertical wedge. That breadth helps explain the strategic-investor mix,
      but the current public record still provides few named customer accounts
      and no segment-level revenue split.
    claimRefs: [CU001, CU002, CU004, CU010, CU011, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof exists, with Geely as the strongest named reference
    body: >-
      The chapter's strongest hard adoption evidence is operational rather than
      contractual. Gasgoo reported nearly 1 million proprietary tactile chips
      consumed over the prior year and described Paxini's multimodal data as
      already used by several leading embodied-intelligence model companies and
      major internet technology giants, but those buyers were not named. The
      named production-style proof comes from CnEVpost's report that Tora-One
      was deployed at Geely's Qiantang manufacturing base for wiring-harness
      assembly and pasting, with eight hours of continuous operation, zero
      anomalies, and a 99.8% task success rate. That is credible customer
      proof for one workflow, but it does not yet establish broad production
      density across the rest of the company's target sectors.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion signals are visible, but repeatability remains under-documented
    body: >-
      Expansion is visible in geography, adjacent monetization paths, and
      stated pilot activity. Gasgoo said Paxini is accelerating localized
      operations and delivery systems in North America, Japan, South Korea, and
      Europe, while EqualOcean said the March 2026 financing would help
      accelerate commercial pilots and large-scale deployment across application
      scenarios. Together, those signals support a go-to-market thesis that can
      expand from hardware into data and integration services. However, the
      public sources still stop short of what investors would usually want for
      durability: customer counts, renewal behavior, contract lengths,
      conversion rates from pilot to production, and concentration by revenue.
    claimRefs: [CU008, CU009, CU013, CU014]
  - id: concentration-and-risks
    title: Customer concentration and substitute-supplier risk remain open
    body: >-
      The evidence base remains concentrated around one named production-style
      customer example and several ecosystem names that are better read as
      channel credibility than as customer proof. QCC's shareholder register
      supports BYD and JD Tech as strategic backers, but equity ownership is
      not the same as active product usage or renewals. That matters because
      alternative tactile-sensing vendors such as Tekscan already market
      solutions into OEM, R&D, and clinical workflows, implying buyers have
      substitute options if Paxini cannot convert pilots into repeat
      deployments. The main commercial question is therefore not whether there
      is interest, but whether PaXini can show a wider set of named production
      wins and sticky contracts behind the current narrative.
    claimRefs: [CU007, CU010, CU011, CU012, CU013, CU014]
