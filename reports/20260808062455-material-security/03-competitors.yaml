- id: moat-durability
  title: Moat durability and where the thesis can break
  body: Material’s moat is credible but conditional. It strengthens when customers value Google Workspace depth, multi-surface investigation, post-compromise containment, and automation that cuts triage time. It weakens if Microsoft, Google, Proofpoint, or other suite vendors close the gap on remediation, behavioral detection, and data-loss workflows fast enough that the specialist overlay becomes optional. Proofpoint’s Tessian integration matters because it shows incumbents are not standing still on behavioral and accidental-data-loss features. Native-suite pressure also matters because the productivity platforms already own the underlying identity, data, and event streams. Public reviews indicate Material’s customers like the product, but the outside evidence base is still thin on true head-to-head win rates and long-run displacement success. The competitive thesis therefore depends on Material continuing to translate architectural advantages into superior workflow outcomes, not just superior
    slides.
