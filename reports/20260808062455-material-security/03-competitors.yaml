  evidenceGaps:
  - type: missing-source
    severity: material
    topic: competitive-win-rates
    missingEvidence: Independent or customer-provided evidence on how often Material actually displaces Proofpoint, Mimecast, Abnormal, or native controls in live deals.
    whyItMatters: Positive product reviews do not show whether Material wins the economically important head-to-head bake-offs.
    diligencePath: Request competitive battle cards, recent bake-off summaries, and churn/win-loss analysis by incumbent competitor.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: pricing-transparency
    missingEvidence: Company-issued list pricing or normalized public contract examples for Material and Abnormal.
    whyItMatters: Quote-only pricing makes it hard to benchmark sales efficiency and discount pressure from public sources alone.
    diligencePath: Collect customer references with seat counts and contract structures, or request anonymized sample order forms.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-durability
    missingEvidence: Product telemetry or customer-usage evidence proving that Material’s post-compromise controls and workflow automation materially outperform native and incumbent alternatives.
    whyItMatters: The moat thesis depends on durable operational outcomes, not just feature checklists.
    diligencePath: Request benchmark studies, customer time-saved data, and comparative incident-response metrics from active deployments.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
