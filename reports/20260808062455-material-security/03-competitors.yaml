- id: pricing-and-switching
  title: Pricing, switching cost, and multi-homing dynamics
  body: 'Competitive economics in this market are shaped as much by switching cost as by headline feature lists. Gateway incumbents carry more operational weight because they require MX changes, policy tuning, and mail-flow ownership. API overlays are lighter to trial and easier to layer on top of an existing stack. That matters because many buyers do not make a clean rip-and-replace decision. Independent comparison work explicitly recommends layering an ICES product on top of a gateway for BEC and account takeover rather than treating the choice as either-or. That dynamic benefits Material by reducing initial sales friction, but it also means wallet share can expand more slowly if the customer keeps Proofpoint or Mimecast for legacy strengths. Pricing transparency is also poor: public directional bands exist for some incumbent bundles, but Material and Abnormal remain largely quote-driven. Buyers therefore focus heavily on deployment speed, analyst time saved, and day-two ergonomics when
    evaluating ROI. That is why diligence should test not only detection rates but also procurement ease, migration effort, coexistence with legacy gateways, and how quickly a new tool becomes indispensable in daily operations.'
  claimRefs:
  - CP005
  - CP006
