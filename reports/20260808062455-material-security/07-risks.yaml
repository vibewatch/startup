- id: TR005
  title: Mitigations and thesis-break triggers table
  columns:
  - Item
  - Public signal today
  - Why it helps / hurts
  - Watch indicator
  rows:
  - - Single-tenant / isolated deployment option
    - Visible in Mars story
    - Can reduce blast radius and ease privacy approvals
    - More references citing isolation as decisive
  - - Explainability emphasis
    - ML-trust and deeper-context materials
    - Can reduce black-box objections
    - Independent evidence on false-positive handling
  - - Workflow automation
    - User-report and triage materials
    - Improves stickiness and ROI
    - Customer references beyond Google-heavy stories
  - - Bundling threat
    - Native platform controls keep improving
    - Could reduce willingness to pay
    - Customer wins where native tools were displaced
  - - Valuation opacity
    - No current public ARR / retention / burn
    - Prevents clean downside underwriting
    - Any fresh financing, board, or metric disclosure
  notes: The thesis breaks fastest if buyers stop needing Material’s incremental depth or if Material itself becomes a privacy-control liability.
