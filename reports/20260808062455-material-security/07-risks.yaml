    - Third parties extend vendor-risk chain
    - Standard SaaS reality
    - Review subprocessor map and monitoring
  - - Deletion / retention
    - 30-day deletion after termination with exceptions
    - Important for exits and regulated retention
    - Clearly stated lifecycle helps
    - Validate deletion evidence and legal hold handling
  notes: The same features that make Material valuable also raise the stakes of internal control failure.
