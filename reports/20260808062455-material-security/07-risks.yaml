company:
  name: Material Security
chapter:
  number: 7
  title: Risks
  summary: 'Material Security’s risk profile is serious but understandable: the company handles unusually sensitive customer data, depends heavily on Google and Microsoft ecosystems, and sells into a threat environment that keeps shifting toward identity, social engineering, and cross-surface compromise. Public evidence suggests the company has designed thoughtful mitigants—single-tenancy options, auditability, explainability, and workflow depth—but it also highlights the need for stronger private diligence on internal controls, incident history, and current financial resilience. The largest downside is a trust failure or native-platform displacement, not a routine software hiccup.'
sections:
- id: threat-and-detection-risk
  title: Threat environment and residual detection risk
  body: 'Material operates in one of the most adversarial corners of enterprise software. Email, collaboration, identity, and connected apps remain constant targets, and the public threat evidence shows that attackers keep shifting tactics rather than disappearing. Microsoft’s Q2 2026 data still shows billions of phishing threats, continuing BEC activity, growth in Teams-based social engineering, and a rise in payloads such as calendar invites that exploit trusted collaboration surfaces outside the classic inbox. IC3, Proofpoint, Verizon, and CISA all point in the same direction: attackers still rely heavily on human behavior, stolen credentials, and low-friction social engineering. For Material, that means success can never mean perfect prevention. The realistic risk is residual miss rate, false positives, and operator fatigue if the product fails to keep pace with evolving workflows and threat vectors. Investors should therefore underwrite product risk as a moving-target problem rather
    than a one-time efficacy test.'
  claimRefs:
  - CR007
  - CR008
  - CR020
  - CR021
