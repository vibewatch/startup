  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: internal-control-depth
    missingEvidence: Internal access-control design, admin break-glass workflows, red-team results, incident history, and audit exceptions.
    whyItMatters: Public materials show the shape of controls but not whether they are sufficient for a vendor that processes sensitive historical email and file data.
    diligencePath: Request SOC report detail, pentest findings, access logs, and prior incident postmortems.
    relatedQuestionRefs:
    - QR004
    - QR012
    - QR013
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: economic-downside
    missingEvidence: Current ARR, burn, concentration, retention, and cash runway.
    whyItMatters: Without current financial and customer-economics data, investors cannot size how much platform or regulatory risk the company can absorb.
    diligencePath: Request board deck metrics and cohort-level operating data.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR024
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: minor
    topic: independent-efficacy-benchmarks
    missingEvidence: Independent benchmark evidence on detection quality and false-positive rates across Google and Microsoft environments.
    whyItMatters: Residual detection risk cannot be scored confidently from qualitative public materials alone.
    diligencePath: Request customer-level benchmarking, third-party testing, and win/loss analysis.
    relatedQuestionRefs:
