companyProfile:
  summary: Material Security is a Redwood City–based cybersecurity company founded in 2017 that sells API-native security for Google Workspace and Microsoft 365. The platform now spans email, files, accounts, and workflow-driven remediation rather than only pre-delivery filtering. Public sources confirm a $100M Series C at a $1.1B valuation in May 2022 and $166M of total disclosed funding. The company remains visibly active into 2026 through new OAuth, automation, and AI-governance product materials and maintains unusually strong named-customer proof for a private security vendor.
  foundedDate: '2017-01-01'
  foundingLocation: Redwood City, California, USA
  headquarters: Redwood City, California, USA
  productSummary: Material Security provides cloud-workspace security across Google Workspace and Microsoft 365, including post-delivery email protection, sensitive-data controls for historical mail and files, account-takeover containment, investigations, and newer OAuth / AI-governance workflows.
  customerFocus: Enterprise and upper-mid-market organizations running Google Workspace or Microsoft 365, especially buyers that need stronger post-delivery protection, investigation speed, data governance, and low-friction API deployment.
  businessModel: Enterprise SaaS subscription model sold through direct sales and partner / marketplace routes; public pricing, contract structure, expansion rates, and services mix remain undisclosed.
  stage: late-stage private
  fundingStatus: Public evidence confirms a $40M Series B in 2021 and a $100M Series C in 2022 at a $1.1B valuation, taking total disclosed funding to $166M. No later public primary financing round was identified.
