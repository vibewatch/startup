- id: use-cases-and-roi
  title: Use cases and ROI patterns across the case studies
  body: The case studies are consistent on what customers buy Material to do. They are not mainly about conventional spam reduction. Instead, they focus on post-delivery phishing response, protection of sensitive historical email, broader file and Drive governance, identity controls, investigations, and reduction of analyst toil. Headway, PagerDuty, Stake, Amplitude, Mars, Gopuff, and Gusto each describe the product as something that compresses time and extends security coverage after a message lands or an account is already at risk. That pattern matters because it supports the company’s broader platform narrative and suggests customers are paying for operational leverage as much as for detection quality. The limitation is that these ROI statements are self-selected and mostly company-authored, so they are directionally useful rather than audit-grade proof. That repeatability across sectors is one reason the customer evidence matters more than a generic logo wall.
  claimRefs:
  - CU010
  - CU011
  - CU012
