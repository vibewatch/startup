company:
  name: Material Security
chapter:
  number: 6
  title: Customers
  summary: 'Material Security’s customer proof is strong on quality and public referenceability. The company names recognizable brands, publishes multiple detailed case studies, and shows repeatable use cases around post-delivery phishing response, data protection, governance, and investigation speed. Public proof is richest in Google Workspace-heavy environments, though Microsoft 365 support is also evident. The main diligence gap is not whether customers exist, but the economics behind them: no public customer count, retention, concentration, or expansion data is available.'
sections:
- id: who-uses-material
  title: Who uses Material publicly today
  body: 'Material’s customer proof is unusually visible for a private cybersecurity vendor. The company names a broad roster of brands across its customer page, trust center, case studies, and financing announcement, including public companies, scaled private technology firms, consumer brands, and regulated organizations. That does not mean every logo is equally deep evidence. Some are only logos or quotes, while others are documented case studies with implementation detail and operational outcomes. Still, the overall picture is favorable: this is not a vendor hiding behind anonymous testimonials. Investors can see a real base of named adopters and can infer that the product has crossed beyond early-design-partner status. The strongest evidence clusters around cloud-first enterprises and growth companies that care about protecting Google Workspace or Microsoft 365 without resorting to heavy mail-routing changes. The breadth of logos also suggests Material has moved past a single-vertical
    niche and can sell into several security-sensitive buyer profiles.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU032
