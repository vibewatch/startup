- id: customer-proof-verdict
  title: Customer-proof verdict and remaining blind spots
  body: 'The customer chapter ends with a mixed but positive diligence view. Material clearly has credible adoption proof among the kinds of organizations that matter for an enterprise security business: public SaaS companies, consumer platforms, financial and insurance players, healthcare-sensitive environments, and recognizable global brands. The company also appears comfortable asking customers to speak in public, which is a good sign for referenceability. But the investor still does not get the quantitative customer facts that ultimately drive value: no total customer count, no concentration disclosures, no retention data, and no direct revenue-by-segment view. So the right read is that customer quality looks better than customer measurability. This is enough to strengthen conviction on product-market fit, but not enough to replace direct diligence on account economics, renewal behavior, or exposure to a handful of large logos. For this reason, customer quality should be treated as a
    strength and customer measurability as a remaining diligence task. That distinction is important because it keeps investors from over-interpreting a strong set of logos as proof of equally strong customer economics.'
