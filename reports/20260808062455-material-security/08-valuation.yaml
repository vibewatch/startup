company:
  name: Material Security
chapter:
  number: 8
  title: Valuation
  summary: 'Material Security’s public valuation story is attractive but incomplete. The company has a credible stale anchor—a $1.1 billion Series C in 2022—and it operates in parts of cybersecurity that still command premium multiples when growth, retention, and platform depth are proven. But the public record does not disclose the metrics needed to determine whether Material belongs near sector medians, premium cloud-security ranges, or below them. The result is a clear stance: keep the company in play, but require fresh private data or price protection before accepting a premium 2026 entry.'
sections:
- id: current-valuation-context
  title: Current financing context and what the public record can actually support
  body: 'Material’s public valuation record is unusually crisp at one point and frustratingly opaque thereafter. The crisp part is the May 2022 Series C: $100 million raised at a $1.1 billion valuation, with $166 million total disclosed funding. The opaque part is everything investors would now need to know in order to judge whether that unicorn mark still holds in 2026. There is no public ARR, no public growth rate, no public retention data, no public burn disclosure, and no public customer-concentration view. That means the last financing round is a valid historical anchor but not a current pricing tool. Any serious valuation conversation has to begin by admitting that the most important variable—the company’s present operating performance—is still private. That alone should force humility into any entry discussion. A sophisticated buyer would treat the 2022 mark as the beginning of diligence, not the end of it.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV026
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: market-comps-and-transaction-context
  title: Public comps and transaction context
  body: The public-market backdrop is constructive for strong cybersecurity assets, but it is not indiscriminate. Windsor Drake’s 2026 work shows a public cyber median around 6x to 7.8x revenue depending on the slice, with much richer pricing for cloud, identity, and AI-native leaders when Rule-of-40 quality and platform status are clear. Public market-cap comparables such as CrowdStrike, Zscaler, Palo Alto Networks, Microsoft, and Okta remind investors how large the reward can become once revenue quality and strategic relevance are visible. Transaction references such as Proofpoint and Mimecast matter too, but mainly as proof that email- and people-centric security can support large strategic values. They should not be used mechanically, because those deals were struck in different macro and multiple regimes and involved more mature disclosure surfaces. In other words, the market gives context, not an answer. That is especially true when the private company in question is not publishing
    current operating metrics.
