chapter:
  number: 5
  title: Product & technology
  summary: 'Material Security’s public technical story is strongest where traditional email security gets weakest: after delivery, during investigation, and across identities, files, and OAuth grants inside Google Workspace and Microsoft 365. The platform appears architected for low-friction API deployment, broad workspace coverage, and heavy automation rather than mail-routing control. Public materials also show thoughtful attention to explainability and operator workflow. The remaining diligence gap is quantitative efficacy data, especially independent evidence on model performance and false-positive tradeoffs.'
sections:
- id: architecture-and-scope
  title: Architecture and current product scope
  body: Material’s public product story is coherent and technically distinctive. The company does not present itself as a narrow secure email gateway or a single-point phishing filter. It instead frames the platform as a cloud-workspace security layer spanning email, files, accounts, posture, and operational workflows across both Google Workspace and Microsoft 365. The architecture matters because Material repeatedly emphasizes API-based integration rather than MX-record changes or a new mail-routing chokepoint. That choice implies easier coexistence with existing collaboration suites, less deployment friction, and the ability to operate on data and identities after messages are delivered. The result is a product boundary that looks broader than classic email security but still anchored in the mailbox and workspace rather than the whole enterprise security stack. That broader-but-still-focused scope is important because it suggests Material is trying to own a defensible slice of collaboration
    security without pretending to replace the rest of the SOC stack. Independent partner and press material also reinforce the low-friction deployment narrative.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
