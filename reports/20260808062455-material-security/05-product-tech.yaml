  evidenceGaps:
  - type: missing-source
    severity: material
    topic: efficacy-benchmarks
    missingEvidence: Independent precision, recall, false-positive, or attack-block-rate benchmarking for Material detections and remediations.
    whyItMatters: The product narrative is strong, but investors still need quantitative proof that automation works at scale without excessive analyst rework.
    diligencePath: Request customer-level efficacy dashboards, benchmark studies, and red-team / purple-team evaluations.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: microsoft-feature-depth
    missingEvidence: More detailed Microsoft 365-specific feature breakdowns comparable to the breadth of Google Workspace public materials.
    whyItMatters: The public record feels more Google-centric, making it harder to judge parity and roadmap priorities.
    diligencePath: Request Microsoft-specific roadmap, usage mix, and feature adoption data.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: single-tenancy-proof
    missingEvidence: Detailed architecture documentation for single-tenancy, data isolation, and operational tradeoffs.
    whyItMatters: Single-tenancy is commercially meaningful for regulated buyers, but the public record is brief.
    diligencePath: Review architecture whitepaper and reference-customer deployment diagrams.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE002
