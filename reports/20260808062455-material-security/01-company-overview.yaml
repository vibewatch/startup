- id: capital-formation-and-scale-signals
  title: Capital formation, customer proof, and scale signals
  body: 'Material’s public funding record is strong enough to anchor late-stage status even though newer operating metrics remain opaque. Independent and official 2021 sources show a $40 million Series B that took total funding to $62 million, while the May 2022 Series C raised another $100 million at a $1.1 billion valuation and lifted total funding to $166 million. The company and investors positioned those proceeds toward sales expansion, international growth, government go-to-market, and product extension. Customer proof also moved beyond early-design-partner status: the Series C announcement named Chubb, Compass, Roblox, and Brex as new reference accounts, while the current customers page shows a broader list including Gusto, Gopuff, Lyft, Dotmatics, Figma, Headway, and others. The one caution is data consistency: third-party trackers do not always agree on total funding, and public sources reviewed do not give a dependable current ARR, board, or headcount figure. Investors therefore
    get solid evidence of scale direction and customer quality, but not the full financial dashboard needed for easy underwriting.'
