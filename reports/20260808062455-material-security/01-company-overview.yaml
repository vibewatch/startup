  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board composition, observer rights, voting control, and any founder or investor protective provisions.
    whyItMatters: A founder-led company with a historical unicorn valuation can look stable externally while still having meaningful governance concentration or preference overhang.
    diligencePath: Request board deck materials, current cap table, voting agreements, and post-Series-C governance docs.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: Current ARR, GAAP revenue, growth rate, gross margin, and any net retention disclosure.
    whyItMatters: Recommendation quality will ultimately depend on whether the 2022 valuation still makes sense relative to current scale and efficiency.
    diligencePath: Request current board materials, KPI dashboards, and audited or management financial statements.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A company-issued current employee count or reconciled HR-system export.
    whyItMatters: Public headcount databases disagree and can overstate or understate operating scale.
    diligencePath: Ask management for current full-time employee count by function and geography.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: valuation-refresh
    missingEvidence: Any post-2022 financing, tender, or secondary-market price signal.
    whyItMatters: The last hard valuation anchor is the 2022 Series C, which is old for entry-underwriting in 2026.
    diligencePath: Ask for the latest 409A, any recent secondaries, and investor-mark support.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
