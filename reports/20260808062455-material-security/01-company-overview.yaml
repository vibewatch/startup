- id: founders-and-governance
  title: Founders, leadership transition, and governance visibility
  body: 'Material’s founding bench is a real asset. The current about page identifies Ryan Noon, Abhishek Agrawal, and Chris Park as the three co-founders, while First Round and founder interviews connect them to Dropbox, Parastructure, Google, and Microsoft Research. Those backgrounds are not cosmetic; they map directly to the company’s focus on securing the collaboration suites where modern work happens. The more material development for diligence is the visible leadership transition: Ryan is now chairman and Abhishek is CEO. Public sources support continuity of founder control and product vision, but they do not provide a clear board roster, voting structure, or post-Series-C control map. That means the company scores well on founder-market fit and leadership continuity but still leaves governance depth under-disclosed relative to its valuation history. For later chapters, the key reuse point is that Material looks founder-led and operationally credible, yet still needs direct diligence
    on board composition, investor rights, and key-person dependencies.'
  claimRefs:
