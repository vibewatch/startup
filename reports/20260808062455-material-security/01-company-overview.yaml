company:
  name: Material Security
chapter:
  number: 1
  title: Company Overview
  summary: Material Security is a Redwood City-founded cloud-workspace security company built around protecting Google Workspace and Microsoft 365 after attackers get inside. Public evidence strongly supports the 2017 founding, three-founder bench, $40 million Series B, and $100 million Series C at a $1.1 billion valuation, while current ARR, headcount, and board-control details remain under-disclosed. The company’s 2026 product-update cadence and current customer roster show ongoing operations beyond the 2022 unicorn milestone.
sections:
- id: identity-ground-truth
  title: Identity, category, and the reusable ground truth
  body: 'Material Security should be treated as a late-stage private cloud-workspace security company rather than a narrow email plug-in. The current homepage, product page, and Microsoft marketplace listing all describe a platform that secures Google Workspace and Microsoft 365 across email, files, and accounts. That matters because later diligence questions depend on whether Material is only an inbound-phishing layer or a broader control plane for sensitive collaboration data. The most durable identity facts are unusually well supported: the company was founded in 2017, is headquartered in Redwood City, and continues to operate publicly through 2026 with active product-update and thought-leadership pages. The company’s own messaging is consistent that fragmented point tools leave gaps once attackers move past the inbox, while partner surfaces reinforce the same platform framing. The practical takeaway is that Material’s identity is coherent across official, partner, and independent sources,
    but the company still provides far less public detail on financial scale than on product scope.'
  claimRefs:
