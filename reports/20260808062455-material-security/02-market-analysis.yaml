chapter:
  number: 2
  title: Market Analysis
  summary: Material Security operates in a multi-billion-dollar email-security market that is increasingly converging with broader cloud-workspace security. Independent sources put the 2026 addressable category at roughly $6.1-$6.2 billion with double-digit growth, driven by BEC losses, phishing volume, compliance pressure, and the shift from secure email gateways to API-connected cloud controls. Material’s real serviceable market is narrower than the headline TAM, but the enterprise Google Workspace / Microsoft 365 segment appears large and structurally aligned with the company’s architecture.
sections:
- id: market-boundary
  title: 'Market boundary: inbox security is only part of the spend pool'
  body: Material sits inside the email-security market, but the right boundary is narrower and more modern than the legacy category label suggests. Independent market reports still measure a broad universe that includes gateways, filtering, encryption, and compliance controls. Yet both vendor and threat evidence show that enterprise buyers increasingly think in terms of protecting a cloud workspace rather than just screening inbound mail. Material’s own product pages explicitly combine email, file, and account protection, while Google and Microsoft emphasize compliance, identity, sovereignty, and data-loss controls inside the same collaboration estate. That means the relevant included spend is not every mail-server or SMB anti-spam product; it is the specialist layer enterprises add when native Microsoft 365 and Google Workspace controls are necessary but insufficient. The biggest substitutes are secure email gateways, native-suite controls, and broader platform security bundles. The practical
    implication is that Material competes inside a fast-growing but architecturally shifting segment where the center of value is moving from perimeter filtering toward integrated cloud-workspace defense.
  claimRefs:
