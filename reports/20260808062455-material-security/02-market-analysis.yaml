    - Closest direct competitive bucket for Material
  - - Workspace data protection
    - DLP, file-sharing control, retention, sensitive-content discovery across mail and files
    - General-purpose archiving without active protection
    - Security / compliance
    - Critical because Material extends beyond inbox-only use cases
  - - Native suite security
    - Google Workspace and Microsoft 365 built-in controls, encryption, identity, compliance features
    - Third-party specialist overlay and managed services
    - IT / platform owners
    - Sets baseline and can absorb some demand
  - - Broader security suites
    - XDR, identity, training, and incident tooling with email modules
    - Pure productivity or CRM tooling
    - CISO / CIO
    - Compete for security budget and bundling power
  notes: The relevant market boundary centers on enterprise cloud-workspace security, not every mailbox-filtering product ever sold.
