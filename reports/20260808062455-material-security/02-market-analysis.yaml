  evidenceGaps:
  - type: missing-source
    severity: material
    topic: material-sam
    missingEvidence: A management-defined serviceable addressable market segmented by suite, company size, and geography.
    whyItMatters: Public top-down TAM reports are too broad to directly value a company that sells primarily into enterprise Google Workspace and Microsoft 365 environments.
    diligencePath: Ask management for pipeline segmentation, win rates by suite, and internal TAM/SAM models.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: native-vs-specialist-budget-split
    missingEvidence: Buyer-level data on how much of the security budget remains with native Microsoft/Google controls versus third-party overlays.
    whyItMatters: Bundling risk is one of the biggest determinants of long-run pricing power for specialist vendors like Material.
    diligencePath: Interview design partners, channel partners, and current customers on incremental spend above native controls.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: TM002-sizing-lens
    missingEvidence: A bottom-up market-build by mailbox count, regulated-seat density, or average contract value.
    whyItMatters: Top-down analyst reports can support directionally positive market views without telling investors how much share is realistically obtainable.
    diligencePath: Build a bottoms-up seat model from Microsoft 365 / Google Workspace enterprise penetration and likely attach rates.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
