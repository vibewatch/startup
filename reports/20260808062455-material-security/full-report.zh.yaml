      - number: '2.4'
        title: 增长驱动真实存在，但捆绑和技能约束同样存在
        blocks:
          - type: paragraph
            body: >-
              顺风很明显：钓鱼仍普遍存在，BEC 仍代价高昂，远程和混合办公持续扩大攻击面，协作套件现在把通信和敏感文件集中在同一处。市场报告也把合规、数字主权和 AI
              驱动的威胁升级列为结构性驱动。但这不是一个无摩擦市场。Google 和 Microsoft 原生控制每年都在改进，减少部分客户需要的专业支出。SME
              和资源不足团队面对真实的预算、培训和技能障碍。数据驻留、主权和错误配置问题也会拖慢或复杂化部署，尤其是跨多个租户或地域时。就 Material
              而言，投资逻辑在公司能证明其集成自动化和攻陷后控制显著优于原生套件安全与网关既有厂商时最强。好消息是，架构正朝 Material 的方向移动；难点是把架构优势转化为可重复的采购紧迫性和持续定价权。
