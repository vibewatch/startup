      - number: '2.3'
        title: 买方地图与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图异常清晰。安全和 IT 负责人通常掌握预算，法务或合规团队影响需求集，普通员工既是被保护用户，也是攻击者瞄准的薄弱环节。Proofpoint 调查证据显示，超过 70%
              员工承认有高风险行为，这进一步说明人的行为仍是采购决策核心。威胁遥测也指向同一方向：IC3 仍显示巨大的钓鱼和 BEC 损失，Microsoft 2026
              年报告显示数十亿钓鱼事件，以及个人分析师无法手工管理的自动化规模。因此，采用通常从具体痛点开始——钓鱼分诊、BEC、DLP 或错误配置风险——然后扩展到更广工作流自动化和攻陷后韧性。Material
              最强的自然适配，是已运行 Google Workspace 或 Microsoft 365 的大型企业；这些买方希望获得更好覆盖，又不想被邮件流重架构打断。这会缩窄
              TAM，但当平台真正减少欺诈、合规和响应痛点时，也会提高买方紧迫性和付费意愿。
