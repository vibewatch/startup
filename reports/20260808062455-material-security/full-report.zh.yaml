      - number: '2.2'
        title: 用多重视角测算类别规模
        blocks:
          - type: paragraph
            body: >-
              即便在收窄到 Material 可服务切片之前，这个类别也足够大。Fortune Business Insights 估计，全球邮件安全支出 2026 年为 $6.06 billion，2034 年达到
              $14.44 billion；Mordor 估计，仅云端子集 2026 年为 $6.24 billion，2031 年达到 $11.22
              billion。具体数字不同，因为一个视角捕捉更宽市场，另一个聚焦云软件，但方向一致：Microsoft 365 和 Google Workspace 采用、AI
              辅助钓鱼、更严格合规预期驱动双位数增长。更重要的承销细节是分层。大型企业已占云邮件安全支出的大多数，受监管或数据密集行业权重更高，因为它们面对不成比例的欺诈、隐私和运营暴露。因此，不应把 Material
              无差别地对照整个市场估值。它最可信的可服务可触达市场，是大型企业云工作区部分；这些买方愿意为 API-native 保护、DLP 和攻陷后控制付费。
