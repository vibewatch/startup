    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、类别与可复用事实基础
        blocks:
          - type: paragraph
            body: >-
              Material Security 应被视为后期私有云工作区安全公司，而不是狭窄的邮件插件。当前官网、产品页和 Microsoft marketplace 列表都把它描述为一个平台，可在 Google
              Workspace 和 Microsoft 365 中保护邮件、文件和账户。这很重要，因为后续尽调问题取决于 Material
              只是入站钓鱼层，还是敏感协作数据的更广控制平面。最耐久的身份事实有异常充分的支持：公司成立于 2017 年，总部位于 Redwood City，并通过活跃的产品更新和思想领导力页面持续公开运营至 2026
              年。公司自身叙事一致认为，一旦攻击者越过收件箱，碎片化单点工具会留下缺口；合作伙伴触点也强化同一平台框架。实际结论是，Material
              的身份在官方、合作伙伴和独立来源中一致，但公司在财务规模上的公开细节仍远少于产品范围。
