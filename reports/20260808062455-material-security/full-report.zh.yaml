      - number: '7.2'
        title: 隐私、平台与运营风险
        blocks:
          - type: paragraph
            body: >-
              核心运营风险与产品价值主张不可分割。Material
              之所以能提供杠杆，正是因为它能跨云办公套件看见敏感历史邮件、文件权限、账户行为和相关遥测。同一访问能力也带来巨大下行：若供应商处理数据不当、遭遇入侵，或与客户隐私要求失去对齐，后果会很严重。隐私政策确认，公司会处理富含个人数据的内容，并可能在特定支持或响应情形中手工处理数据。公开记录也显示，公司集中在
              Google Workspace 和 Microsoft 365 上，因此暴露于供应商 API 变化、limited-use 政策调整，以及平台所有者自身更广捆绑压力。Mars、Color 和 PagerDuty
              等案例研究暗示公司在隐私架构和可审计性上思考周到，但也凸显一旦这些控制失效，代价会很高。换句话说，产品最强之处，也正是控制义务最严苛之处。合同层面的隐私对齐几乎与纯功能深度同等重要。
