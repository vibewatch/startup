      - number: '5.4'
        title: 相比原生控制和传统网关的适配
        blocks:
          - type: paragraph
            body: >-
              Material 最好的公开定位，不是说 Google 或 Microsoft 缺少安全控制，而是说原生工具碎片化、运营更慢，并且在某些投递后和跨表面任务上更弱。同样，Material
              面向安全邮件网关的卖点，聚焦运营简单性、更深响应和更广工作区覆盖，而不是声称投递前过滤已经过时。这是可信楔子，因为现代邮件主导攻击在原始消息落地后，常会变成身份误用、OAuth
              滥用或敏感数据访问。公开客户故事通过强调比网关式工具更容易部署、覆盖更广，强化了这一架构论点。最大的细节是平台平衡：公司公开表面目前感觉更偏 Google，而不是 Microsoft，尽管 Microsoft
              支持显然真实存在，并非愿景。实践中，这意味着产品似乎最适合云优先组织；它们既关心初始消息拦截，也同样关心运营速度和入侵后遏制。
