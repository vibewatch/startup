              客户章节以一个混合但正面的尽调观点收束。Material 显然在企业安全业务重要组织中有可信采用证明：公开 SaaS
              公司、消费平台、金融和保险参与方、医疗敏感环境，以及可识别全球品牌。公司也似乎愿意让客户公开发声，这是可参考性的好信号。但投资者仍拿不到最终驱动价值的定量客户事实：没有总客户数、没有集中度披露、没有留存数据，也没有按细分的直接收入视图。因此，正确解读是客户质量好于客户可衡量性。这足以增强对产品市场适配的信心，但不能替代对账户经济性、续约行为或少数大型
