  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：收件箱安全只是支出池的一部分
        blocks:
          - type: paragraph
            body: >-
              Material
              位于邮件安全市场内，但正确边界比传统类别标签暗示的更窄、也更现代。独立市场报告仍衡量一个宽泛宇宙，包含网关、过滤、加密和合规控制。但供应商和威胁证据都显示，企业买方越来越从保护云工作区的角度思考，而不只是筛查入站邮件。Material
              自身产品页面明确结合邮件、文件和账户保护；Google 和 Microsoft 也在同一协作资产中强调合规、身份、主权和数据防泄露控制。因此，相关纳入支出不是每个邮件服务器或 SMB 反垃圾产品；而是当原生
              Microsoft 365 和 Google Workspace 控制必要但不足时，企业添加的专业层。最大替代品是安全邮件网关、原生套件控制和更广平台安全套件。实际含义是，Material
              在一个快速增长但架构正在迁移的细分中竞争，价值中心正从边界过滤转向集成式云工作区防御。
