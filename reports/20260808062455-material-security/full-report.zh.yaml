      - number: '8.2'
        title: 公开可比公司与交易背景
        blocks:
          - type: paragraph
            body: >-
              公开市场背景有利于强势网络安全资产，但市场并不照单全收。Windsor Drake 的 2026 年研究显示，按不同切片，公开网络安全公司的收入倍数中位数约为 6x 至 7.8x；若云、身份和 AI-native
              领导者的 Rule-of-40 质量与平台地位清晰，定价会高得多。CrowdStrike、Zscaler、Palo Alto Networks、Microsoft、Okta
              等公开市值可比公司提醒投资者：一旦收入质量和战略相关性可见，回报上限可以很高。Proofpoint、Mimecast
              等交易参照也重要，但主要证明以邮件和人为中心的安全资产可以支撑大型战略价值。它们不能机械套用，因为这些交易发生在不同宏观环境和倍数体系下，披露面也更成熟。换句话说，市场给的是背景，不是答案。若一家私有公司不披露当前经营指标，这一点尤其成立。
