      - number: '3.3'
        title: 定价、切换成本与多宿主动态
        blocks:
          - type: paragraph
            body: >-
              这个市场的竞争经济性受切换成本影响，不亚于受头部功能清单影响。网关既有厂商运营重量更高，因为它们要求 MX 修改、政策调优和邮件流所有权。API
              覆盖层试用更轻，也更容易叠加在既有栈上。这很重要，因为许多买方不会做干净的替换决策。独立比较工作明确建议，在网关之上叠加 ICES 产品来处理 BEC
              和账户接管，而不是把选择视为二选一。这一动态通过降低初始销售摩擦利好 Material，但如果客户保留 Proofpoint 或 Mimecast
              来满足传统优势，钱包份额也可能扩张更慢。定价透明度同样较差：部分既有套件有公开方向性区间，但 Material 和 Abnormal 基本仍由报价驱动。因此，买方评估 ROI
              时会高度关注部署速度、分析师时间节省和第二天使用体验。这就是为什么尽调不应只测试检测率，也要测试采购便利性、迁移工作量、与传统网关共存，以及新工具多快能在日常运营中变得不可或缺。
