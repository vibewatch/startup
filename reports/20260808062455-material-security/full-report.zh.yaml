            body: >-
              最后一层风险是经济性的，而不只是技术性的。Material
              在一个拥挤环境中竞争，云平台、安全邮件网关和专业供应商都在不同程度上重叠。公司差异化在买方需要投递后控制、历史数据保护和工作流自动化时看起来最强，但如果原生供应商或捆绑套件对一部分有意义账户而言已经足够好，这一优势可能缩窄。同时，公司在
              ARR、烧钱、留存和集中度上仍保持私有不透明，因此投资者无法把战略风险和简单信息风险完全分开。因此，2022 年独角兽估值应被视为过时历史锚点，而不是今天下行有限的证据。正确风险结论是，Material
              看起来具备战略相关性，但仍需要私下尽调，证明其敏感性高的架构、平台依赖和不完整披露不会压过产品优势。这也意味着，干净的技术演示本身并不够。
