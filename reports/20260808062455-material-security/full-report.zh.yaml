      - number: '8.3'
        title: Material 为什么可能享有溢价——以及为什么仍可能不配
        blocks:
          - type: paragraph
            body: >-
              Material 不只是旧式邮件网关，这会影响估值。产品现在覆盖 Google Workspace 和 Microsoft 365 上的邮件、文件、账户、OAuth
              风险和工作流自动化。作为私有安全公司，Material 的客户证明较强，路线图也落在云、身份相邻工作流、AI
              治理、投递后控制等仍能吸引估值溢价的领域。但关键限定是：必须有指标支撑。折价因素同样明显。投资者仍面对私有公司不透明、对 Google 和 Microsoft
              平台的依赖、原生套件捆绑风险，以及没有公开证据证明增长、留存或利润率足以支撑前四分位网络安全倍数。因此，溢价故事合理但未证实。投资者应把溢价叙事视为还需要数字验证的假设。在此之前，举证责任在管理层，不在市场。
