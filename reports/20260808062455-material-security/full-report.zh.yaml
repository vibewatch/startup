  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 架构与当前产品范围
        blocks:
          - type: paragraph
            body: >-
              Material 的公开产品故事连贯且技术上有辨识度。公司没有把自己描述成狭窄安全邮件网关或单点钓鱼过滤器，而是把平台定位为跨 Google Workspace 和 Microsoft 365
              的云工作区安全层，覆盖邮件、文件、账户、姿态和运营工作流。架构很重要，因为 Material 反复强调基于 API 的集成，而不是 MX
              记录修改或新的邮件路由瓶颈。这一选择意味着更容易与现有协作套件共存、部署摩擦更低，并能在消息投递后作用于数据和身份。结果是，产品边界看起来比传统邮件安全更宽，但仍锚定邮箱和工作区，而非整个企业安全栈。这种更宽但仍聚焦的范围很重要，因为它暗示
              Material 想占住协作安全中一个可防守切片，而不是假装替代 SOC 栈的其余部分。独立合作伙伴和媒体材料也强化了低摩擦部署叙事。
