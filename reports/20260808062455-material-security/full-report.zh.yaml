      - number: '8.4'
        title: 估值立场、情景与尽调门槛
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确立场是有纪律地保持兴趣，并严格控制入场条件。若管理层能私下证明高端云安全经济性——高增长、强留存、有吸引力的毛利率，以及可支撑持续定价权的运营
              ROI——乐观情景存在。若公司在这些维度扎实但不顶尖，基准情景成立，只能相对行业中位数给适度溢价。若原生套件缩小楔子，或财务数据暴露增长更慢、留存更弱、融资压力大于 2022
              年估值暗示，悲观情景存在。公开记录无法裁决这些路径，投资者不应提前为乐观情景买单。因此，正确估值结论是有条件推进：继续尽调，但在接受溢价估值前，要求新数据或价格保护。喜欢公司和喜欢价格之间有实质差别。好公司在错误入场价下仍可能是坏投资。这就是此处的核心估值纪律。
