              案例研究在客户购买 Material 做什么上高度一致。它们主要不是传统垃圾邮件减少，而是聚焦投递后钓鱼响应、保护敏感历史邮件、更广文件和 Drive
              治理、身份控制、调查，以及减少分析师苦活。Headway、PagerDuty、Stake、Amplitude、Mars、Gopuff 和 Gusto
              都把产品描述为一种在消息落地或账户已处于风险中之后压缩时间、扩大安全覆盖的工具。这个模式重要，因为它支撑公司更广平台叙事，并暗示客户支付的不只是检测质量，也包括运营杠杆。局限是，这些 ROI
              表述是自选择且大多由公司撰写，因此只有方向性用途，不是审计级证明。跨行业可重复性正是客户证据比普通 logo 墙更重要的原因之一。
