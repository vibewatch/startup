      - number: '3.4'
        title: 护城河耐久性与投资逻辑可能破裂之处
        blocks:
          - type: paragraph
            body: >-
              Material 的护城河可信但有条件。当客户看重 Google Workspace 深度、多表面调查、攻陷后遏制和减少分诊时间的自动化时，护城河增强。若 Microsoft、Google、Proofpoint
              或其他套件供应商在修复、行为检测和数据防泄露工作流上足够快地缩小差距，使专业覆盖层变成可选项，护城河会减弱。Proofpoint 的 Tessian
              集成很重要，因为它显示既有厂商没有在行为和意外数据泄露功能上停滞。原生套件压力也重要，因为生产力平台已经拥有底层身份、数据和事件流。公开评价显示 Material
              客户喜欢该产品，但外部证据库在真实头对头胜率和长期替换成功上仍薄。因此，竞争逻辑取决于 Material 能否继续把架构优势转化为更好的工作流结果，而不只是更好的幻灯片。
