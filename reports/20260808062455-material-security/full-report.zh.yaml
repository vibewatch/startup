  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：API 覆盖层对网关对原生套件
        blocks:
          - type: paragraph
            body: >-
              Material 所处竞争格局按架构可以清晰分层。Proofpoint 和 Mimecast 仍属于既有网关阵营：它们重路由邮件流、内联检查消息，并在附件沙箱、URL
              重写、连续性和归档最重要的场景取胜。Abnormal 代表更新的 API-based ICES 阵营，通过 Microsoft 365 或 Google Workspace API 部署，并在无载荷 BEC
              和账户接管上有优势。Material 属于同一 API-native 家族，但进一步推进到攻陷后的文件、账户和调查工作流。除这些直接同类之外，真实替代集合还包括 Microsoft Defender、Google
              原生控制、Check Point、Cisco，以及能吸收部分预算的捆绑套件，尽管它们并非逐点完美匹配。关键结论是，买方不是在不同 logo
              的相同工具中选择；他们在不同部署摩擦、不同优势、以及对“邮件安全”含义不同定义的架构之间选择。
