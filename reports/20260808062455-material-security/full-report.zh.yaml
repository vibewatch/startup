            body: >-
              因为 Material 不发布 CAC、回本周期或利润率数据，投资者只能使用客户结果代理指标。最清晰的公开证据是，产品似乎被设计来减少分析师时间、降低部署摩擦，并通过阻止或遏制昂贵事件来保住价值。Headway
              明确偏好基于 API
              的部署，因为它避开了网关式设置痛点；客户和用例页面则提到钓鱼分诊自动化、更快搜索，以及过去需要数天或数小时的工作流现在达到秒级响应。这些不是经审计的单位经济性指标，但有经济意义，因为它们描述了更低上线成本、更快价值实现和节省人力的自动化。客户名单也暗示企业级合同潜力，即便
              ACV 未披露。重要局限是，所有这些仍是贴近营销的证据。它支持健康软件经济性的可信故事，但不能替代关于胜率、扩张、折扣或续约效率的直接数据。
