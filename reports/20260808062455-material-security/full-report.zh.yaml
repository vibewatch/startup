              称，公司在构建前就售出 early access，用真实买方需求验证市场，并以 Stellarite 名称运营至 2020 年发布。到 2021 年 Series B，Material
              已经在营销可见性与控制、防泄露、账户接管防护和钓鱼群体免疫。到 2026 年，产品更新节奏已经明显越过传统邮件过滤：Material 正在推出 OAuth 修复、重建集成、更深工作流自动化，以及 AI /
