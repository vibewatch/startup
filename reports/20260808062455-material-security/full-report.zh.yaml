  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景，以及公开记录真正能支持什么
        blocks:
          - type: paragraph
            body: >-
              Material 的公开估值记录有一个异常清晰的锚点，之后却令人沮丧地不透明。清晰的部分是 2022 年 5 月的 Series C：融资 $100 million，估值 $1.1 billion，累计披露融资
              $166 million。不透明的是投资者现在判断 2026 年独角兽估值是否仍成立所需的一切。公开资料没有
              ARR、增长率、留存数据、烧钱披露，也没有客户集中度视图。因此，上一轮融资是有效的历史锚点，但不是当前定价工具。任何严肃估值讨论都必须先承认，最重要的变量——公司当前经营表现——仍然是私有信息。仅这一点就应让入场讨论保持克制。成熟买家会把
              2022 年估值当作尽调起点，而不是终点。
