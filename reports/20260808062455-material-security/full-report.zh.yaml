  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 威胁环境与残余检测风险
        blocks:
          - type: paragraph
            body: >-
              Material 运营在企业软件中最具对抗性的角落之一。邮件、协作、身份和连接应用仍是持续目标，公开威胁证据显示攻击者一直在改变战术，而不是消失。Microsoft Q2 2026 数据仍显示数十亿钓鱼威胁、持续
              BEC 活动、Teams 社交工程增长，以及日历邀请等载荷上升；这些载荷利用经典收件箱之外的可信协作表面。IC3、Proofpoint、Verizon 和 CISA
              都指向同一方向：攻击者仍大量依赖人的行为、被盗凭据和低摩擦社交工程。对 Material
              来说，成功永远不意味着完美预防。现实风险是，如果产品无法跟上演变中的工作流和威胁向量，会出现残余漏报率、误报和运营者疲劳。因此，投资者应把产品风险承销为一个移动靶问题，而不是一次性效果测试。
