            body: >-
              Material 的历史资本形成足够清晰：2021 年 Series B 融资 $40 million，2022 年 Series C 融资 $100 million，并在该轮后官方披露累计 $166
              million。管理层称这些资金将支持销售、产品、国际和政府扩张。不清楚的是当前资产负债表状态。公开来源没有提供现金、烧钱、现金跑道、债务或当前融资依赖。因此，即使公司很可能带着有意义的现金垫进入 2023
              年，也无法直接从公开证据承销资本充足性。更大的承销问题是时间：最后确认的估值锚点已经过去数年，仍没有公开经营披露显示独角兽轮次后效率或规模发生了什么。在这种情况下，公司可能仍保持商业健康，但投资者不能负责任地假设如此。缺少新的收入质量证据本身就是重要财务事实。
