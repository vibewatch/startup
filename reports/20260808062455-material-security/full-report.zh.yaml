  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现表面
        blocks:
          - type: paragraph
            body: >-
              Material 的公开触点都指向企业 SaaS 收入模式，但远没有给出投资者理想中需要的数字。公司作为面向 Google Workspace 和 Microsoft 365
              的云工作区安全平台销售，通过演示、直销，以及 Google Cloud Marketplace 和 Microsoft Marketplace
              等合作伙伴渠道完成采购。这种组合强烈暗示经常性订阅收入，而不是项目驱动、硬件或服务较重的模式。产品横跨邮件、文件、账户和工作流自动化，也意味着账户内有扩张空间，而不是单次一次性席位销售。缺失的是实际商业细节：没有公开价格表、没有合同价值区间、没有披露服务组合，也没有拆分多少收入来自初始落地、多少来自后续扩张。因此，正确解读不是模式不清楚；而是尽管平台结构相当易读，经济细节仍是私有信息。
