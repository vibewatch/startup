        title: 资本形成、客户证明与规模信号
        blocks:
          - type: paragraph
            body: >-
              尽管更新经营指标仍不透明，Material 的公开融资记录足以锚定后期阶段。独立和官方 2021 年来源显示，公司完成 $40 million Series B，将累计融资推至 $62 million；2022
              年 5 月 Series C 又以 $1.1 billion 估值融资 $100 million，使累计融资升至 $166 million。公司和投资者称这些资金将用于销售扩张、国际增长、政府 GTM
              和产品延伸。客户证明也已越过早期设计伙伴阶段：Series C 公告点名 Chubb、Compass、Roblox 和 Brex 为新参考账户，而当前客户页面显示更广名单，包括
              Gusto、Gopuff、Lyft、Dotmatics、Figma、Headway 等。一个需要谨慎的点是数据一致性：第三方追踪器并不总同意累计融资额，审阅的公开来源也没有给出可靠当前
              ARR、董事会或员工数。投资者因此能得到规模方向和客户质量的扎实证据，但拿不到便于承销的完整财务仪表盘。
