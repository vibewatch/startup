companyProfile:
  summary: >-
    Material Security 是一家位于 Redwood City 的网络安全公司，成立于 2017 年，为 Google Workspace 和 Microsoft 365 销售 API-native
    安全能力。平台现在覆盖邮件、文件、账户和工作流驱动修复，而不只是投递前过滤。公开来源确认，公司在 2022 年 5 月以 $1.1B 估值完成 $100M Series C，累计披露融资 $166M。到 2026 年，公司仍通过新的
    OAuth、自动化和 AI 治理产品材料保持可见活跃；作为私有安全供应商，其具名客户证明异常强。
  foundedDate: '2017-01-01'
  foundingLocation: Redwood City, California, USA
  headquarters: Redwood City, California, USA
