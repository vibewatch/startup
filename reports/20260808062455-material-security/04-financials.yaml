  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-revenue-quality
    missingEvidence: Current ARR, GAAP revenue, growth, retention, gross margin, and services mix.
    whyItMatters: The public evidence supports product-market fit but not the economics needed to underwrite the 2022 valuation in 2026.
    diligencePath: Request management financials, cohort retention, and pricing / discount data.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn, runway, and any debt or venture-lending obligations.
    whyItMatters: Without current balance-sheet data, investors cannot determine whether the company is self-funding or likely to need new capital.
    diligencePath: Request board materials, treasury reports, and cash-bridge analysis.
    relatedQuestionRefs:
    - QI017
    - QI024
    - QI021
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: minor
    topic: revenue-mix
    missingEvidence: Independent or customer-level evidence that isolates software subscription spend from services and marketplace pass-through.
    whyItMatters: Public sources show the model shape but not enough to score revenue quality precisely.
    diligencePath: Collect anonymized order forms and revenue-recognition memos.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI001
