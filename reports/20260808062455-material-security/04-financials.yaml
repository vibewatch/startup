- id: public-benchmark-context
  title: Public benchmark context and final financial read
  body: 'The cleanest external benchmark is the disclosure behavior of scaled public-security peers, not their raw size. Microsoft, CrowdStrike, Zscaler, and Okta all maintain current SEC-filings pages, and public market-cap sources show the enormous spread in how the market values security software once revenue quality, growth, and durability become visible. That does not mean Material should be compared directly to those companies on absolute valuation today. It does mean that the next step in underwriting is obvious: investors need the kind of operating transparency public comps provide, even if only in diligence rather than in the open market. Public customer proof and product momentum suggest the business could have attractive software economics, but the present evidence base does not let an outsider confirm margin profile, retention, or cash sufficiency. The correct financial verdict is therefore cautious rather than negative: the model looks attractive on paper, yet the underwriting
    case remains incomplete until management shares current metrics that connect revenue, efficiency, and valuation.'
