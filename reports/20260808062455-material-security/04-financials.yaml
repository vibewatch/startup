- id: gates-and-unit-economics
  title: GTM motion and unit-economics proxies
  body: Because Material does not publish CAC, payback, or margin data, investors have to work with customer-outcome proxies. The clearest public evidence is that the product appears designed to reduce analyst time, lower deployment friction, and preserve value by stopping or containing expensive incidents. Headway explicitly preferred an API-based deployment because it avoided gateway-style setup pain, while customer and use-case pages cite automation of phishing triage, faster search, and seconds-level response for workflows that previously took days or hours. Those are not audited unit-economics metrics, but they are economically meaningful signals because they describe lower onboarding cost, faster time-to-value, and labor-saving automation. The customer roster also suggests enterprise-grade contract potential even without disclosed ACV. The important limitation is that all of this is still marketing-adjacent evidence. It supports a plausible story of healthy software economics, but
    it does not replace direct data on win rates, expansion, discounting, or renewal efficiency.
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
