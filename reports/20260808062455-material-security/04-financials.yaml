- id: capital-and-disclosure
  title: Capital adequacy and the public-disclosure gap
  body: 'Material’s historical capital formation is clear enough: $40 million in Series B in 2021, $100 million in Series C in 2022, and an official $166 million disclosed total after that round. Management described those proceeds as fuel for sales, product, international, and government expansion. What is not clear is the current state of the balance sheet. Public sources do not provide cash, burn, runway, debt, or current financing dependency. That means capital adequacy cannot be underwritten directly from public evidence even though the company likely entered 2023 with a meaningful cash cushion. The bigger underwriting issue is timing: the last confirmed valuation mark is now several years old, and there is still no public operating disclosure to show what happened to efficiency or scale after the unicorn round. A company can remain commercially healthy under those conditions, but investors cannot responsibly assume it. The absence of fresh revenue-quality evidence is itself a material
    financial fact.'
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  - CI026
  - CI036
  - CI037
  - CI038
