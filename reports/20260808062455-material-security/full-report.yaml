  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: API overlays versus gateways versus native suites'
        blocks:
          - type: paragraph
            body: >-
              Material competes in a landscape that splits cleanly by architecture. Proofpoint and Mimecast remain the
              incumbent gateway camp: they reroute mail flow, inspect messages inline, and win where attachment
              sandboxing, URL rewriting, continuity, and archiving matter most. Abnormal represents the newer API-based
              ICES camp, with deployment over Microsoft 365 or Google Workspace APIs and strength in payloadless BEC and
              account takeover. Material belongs to that same API-native family, but it pushes farther into
              post-compromise file, account, and investigation workflows. Beyond those direct peers, the real substitute
              set includes Microsoft Defender, Google’s native controls, Check Point, Cisco, and bundled suites that can
              absorb part of the budget without being perfect point-for-point matches. The key takeaway is that buyers
              are not choosing from identical tools with different logos. They are choosing between architectures with
              different deployment friction, different strengths, and different definitions of what “email security”
              even includes.
            claimRefs:
