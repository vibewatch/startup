  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context and what the public record can actually support
        blocks:
          - type: paragraph
            body: >-
              Material’s public valuation record is unusually crisp at one point and frustratingly opaque thereafter.
              The crisp part is the May 2022 Series C: $100 million raised at a $1.1 billion valuation, with $166
              million total disclosed funding. The opaque part is everything investors would now need to know in order
              to judge whether that unicorn mark still holds in 2026. There is no public ARR, no public growth rate, no
              public retention data, no public burn disclosure, and no public customer-concentration view. That means
              the last financing round is a valid historical anchor but not a current pricing tool. Any serious
              valuation conversation has to begin by admitting that the most important variable—the company’s present
              operating performance—is still private. That alone should force humility into any entry discussion. A
              sophisticated buyer would treat the 2022 mark as the beginning of diligence, not the end of it.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV026
