  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Architecture and current product scope
        blocks:
          - type: paragraph
            body: >-
              Material’s public product story is coherent and technically distinctive. The company does not present
              itself as a narrow secure email gateway or a single-point phishing filter. It instead frames the platform
              as a cloud-workspace security layer spanning email, files, accounts, posture, and operational workflows
              across both Google Workspace and Microsoft 365. The architecture matters because Material repeatedly
              emphasizes API-based integration rather than MX-record changes or a new mail-routing chokepoint. That
              choice implies easier coexistence with existing collaboration suites, less deployment friction, and the
              ability to operate on data and identities after messages are delivered. The result is a product boundary
              that looks broader than classic email security but still anchored in the mailbox and workspace rather than
              the whole enterprise security stack. That broader-but-still-focused scope is important because it suggests
              Material is trying to own a defensible slice of collaboration security without pretending to replace the
              rest of the SOC stack. Independent partner and press material also reinforce the low-friction deployment
              narrative.
