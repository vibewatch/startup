      - number: '2.4'
        title: Growth drivers are real, but so are bundling and skills constraints
        blocks:
          - type: paragraph
            body: >-
              The tailwinds are obvious: phishing remains pervasive, BEC remains expensive, remote and hybrid work
              continue to expand the attack surface, and collaboration suites now concentrate both communications and
              sensitive files in one place. Market reports also point to compliance, digital sovereignty, and AI-enabled
              threat escalation as structural drivers. But this is not a frictionless market. Native Google and
              Microsoft controls improve every year, reducing the amount of specialist spend some customers need. SMEs
              and under-resourced teams face real budget, training, and skills barriers. Data residency, sovereignty,
              and misconfiguration issues can slow or complicate deployment, especially across multiple tenants or
              geographies. For Material specifically, that means the investment case is strongest when the company can
              prove that its integrated automation and post-compromise control meaningfully outperform what native suite
              security and gateway incumbents already provide. The good news is that architecture is moving in
              Material’s direction; the hard part is converting that architectural advantage into repeatable procurement
              urgency and sustained pricing power.
