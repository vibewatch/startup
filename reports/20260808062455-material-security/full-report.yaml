      - number: '8.4'
        title: Valuation stance, scenarios, and diligence gate
        blocks:
          - type: paragraph
            body: >-
              The right public-evidence stance is disciplined interest with firm entry discipline. A bull case exists if
              management can privately demonstrate premium-cloud-security economics: high growth, strong retention,
              attractive gross margin, and operator ROI that supports sustained pricing power. A base case exists if the
              company is solid but not elite on those dimensions, which would argue for only a measured premium to
              sector medians. A bear case exists if native suites narrow the wedge or if the financial data reveal
              slower growth, weaker retention, or financing pressure than the 2022 mark implied. Because the public
              record cannot adjudicate those paths, the investor should resist paying for the bull case upfront. The
              correct valuation verdict is therefore conditional: proceed with diligence, but require fresh data or
              pricing protection before accepting a premium valuation. That is a meaningful difference between liking
              the company and liking the price. Good companies can still be bad investments at the wrong entry price.
              That is the central valuation discipline here.
            claimRefs:
