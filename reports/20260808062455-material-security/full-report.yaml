      - number: '1.4'
        title: Milestones, product broadening, and current direction
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that widened from post-compromise email defense into a broader
              cloud-workspace resilience platform. The founding thesis came directly from 2016 election-hack lessons and
              the belief that inbox security fails once attackers get inside. First Round says the company sold early
              access before building, validated the market through real buyer demand, and operated as Stellarite until
              its 2020 launch. By the 2021 Series B, Material was already marketing visibility and control, leak
              prevention, account-takeover prevention, and phishing herd immunity. By 2026, the product-update cadence
              had clearly moved beyond classic email filtering: Material was shipping OAuth remediation, rebuilt
              integrations, deeper workflow automation, and AI/privacy thought leadership. The company’s Google
              partnership and marketplace positioning reinforce that current direction. Taken together, the chronology
              suggests Material has not stalled since its unicorn round, but the biggest remaining question is how much
              economic scale followed the platform broadening.
