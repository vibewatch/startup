  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Threat environment and residual detection risk
        blocks:
          - type: paragraph
            body: >-
              Material operates in one of the most adversarial corners of enterprise software. Email, collaboration,
              identity, and connected apps remain constant targets, and the public threat evidence shows that attackers
              keep shifting tactics rather than disappearing. Microsoft’s Q2 2026 data still shows billions of phishing
              threats, continuing BEC activity, growth in Teams-based social engineering, and a rise in payloads such as
              calendar invites that exploit trusted collaboration surfaces outside the classic inbox. IC3, Proofpoint,
              Verizon, and CISA all point in the same direction: attackers still rely heavily on human behavior, stolen
              credentials, and low-friction social engineering. For Material, that means success can never mean perfect
              prevention. The realistic risk is residual miss rate, false positives, and operator fatigue if the product
              fails to keep pace with evolving workflows and threat vectors. Investors should therefore underwrite
              product risk as a moving-target problem rather than a one-time efficacy test.
            claimRefs:
