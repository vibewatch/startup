            body: >-
              Material’s public surfaces all point toward an enterprise SaaS revenue model, but they stop well short of
              giving investors the numbers they would ideally want. The company is sold as a cloud-workspace security
              platform for Google Workspace and Microsoft 365, with procurement happening through demos, direct sales,
              and partner channels such as Google Cloud Marketplace and Microsoft Marketplace. That mix strongly
              suggests recurring subscription revenue rather than a project-led, hardware, or services-heavy model. The
              product breadth across email, files, accounts, and workflow automation also implies expansion room inside
              an account instead of a single one-off seat sale. What remains missing is the actual commercial detail: no
              public pricing list, no contract-value ranges, no disclosed services mix, and no breakdown of how much
              revenue comes from initial land versus later expansion. So the right read is not that the model is
