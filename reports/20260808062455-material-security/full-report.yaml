      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually clear. Security and IT leaders generally own the budget, legal or compliance
              teams influence the requirement set, and ordinary employees are both the protected users and the weak link
              attackers target. Proofpoint’s survey evidence that more than 70% of employees admit to risky behavior
              reinforces why human behavior remains central to purchase decisions. Threat telemetry points the same way:
              IC3 still shows enormous phishing and BEC losses, and Microsoft’s 2026 reporting shows billions of
              phishing events plus automation at scales individual analysts cannot manage manually. Adoption therefore
              tends to start with a concrete pain point—phishing triage, BEC, DLP, or misconfiguration risk—before
              expanding into broader workflow automation and post-compromise resilience. Material’s strongest natural
              fit is the large enterprise already running Google Workspace or Microsoft 365, where buyers want better
              coverage without the disruption of mail-flow rearchitecture. That narrows the TAM, but it also raises
              buyer urgency and willingness to pay when the platform genuinely reduces fraud, compliance, and response
              pain.
