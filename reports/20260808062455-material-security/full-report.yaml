  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: inbox security is only part of the spend pool'
        blocks:
          - type: paragraph
            body: >-
              Material sits inside the email-security market, but the right boundary is narrower and more modern than
              the legacy category label suggests. Independent market reports still measure a broad universe that
              includes gateways, filtering, encryption, and compliance controls. Yet both vendor and threat evidence
              show that enterprise buyers increasingly think in terms of protecting a cloud workspace rather than just
              screening inbound mail. Material’s own product pages explicitly combine email, file, and account
              protection, while Google and Microsoft emphasize compliance, identity, sovereignty, and data-loss controls
              inside the same collaboration estate. That means the relevant included spend is not every mail-server or
              SMB anti-spam product; it is the specialist layer enterprises add when native Microsoft 365 and Google
              Workspace controls are necessary but insufficient. The biggest substitutes are secure email gateways,
              native-suite controls, and broader platform security bundles. The practical implication is that Material
              competes inside a fast-growing but architecturally shifting segment where the center of value is moving
              from perimeter filtering toward integrated cloud-workspace defense.
