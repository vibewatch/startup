              Material’s historical capital formation is clear enough: $40 million in Series B in 2021, $100 million in
              Series C in 2022, and an official $166 million disclosed total after that round. Management described
              those proceeds as fuel for sales, product, international, and government expansion. What is not clear is
              the current state of the balance sheet. Public sources do not provide cash, burn, runway, debt, or current
