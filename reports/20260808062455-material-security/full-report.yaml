      - number: '2.2'
        title: Sizing the category with multiple lenses
        blocks:
          - type: paragraph
            body: >-
              The category is big enough to matter even before narrowing to Material’s serviceable slice. Fortune
              Business Insights pegs global email-security spend at $6.06 billion in 2026 and $14.44 billion by 2034,
              while Mordor estimates the cloud-based subset alone at $6.24 billion in 2026 and $11.22 billion by 2031.
              The exact numbers differ because one lens captures the broader market and the other focuses on cloud
              software, but both point in the same direction: double-digit growth driven by Microsoft 365 and Google
              Workspace adoption, AI-assisted phishing, and tighter compliance expectations. The more important
              underwriting nuance is segmentation. Large enterprises already represent the majority of
              cloud-email-security spend, and regulated or data-intensive sectors over-index because they face
              disproportionate fraud, privacy, and operational exposure. Material therefore should not be valued against
              the whole market indiscriminately. Its most plausible serviceable addressable market is the
              large-enterprise, cloud-workspace portion where buyers are willing to pay for API-native protection, DLP,
              and post-compromise controls.
