      - number: '8.2'
        title: Public comps and transaction context
        blocks:
          - type: paragraph
            body: >-
              The public-market backdrop is constructive for strong cybersecurity assets, but it is not indiscriminate.
              Windsor Drake’s 2026 work shows a public cyber median around 6x to 7.8x revenue depending on the slice,
              with much richer pricing for cloud, identity, and AI-native leaders when Rule-of-40 quality and platform
              status are clear. Public market-cap comparables such as CrowdStrike, Zscaler, Palo Alto Networks,
              Microsoft, and Okta remind investors how large the reward can become once revenue quality and strategic
              relevance are visible. Transaction references such as Proofpoint and Mimecast matter too, but mainly as
              proof that email- and people-centric security can support large strategic values. They should not be used
              mechanically, because those deals were struck in different macro and multiple regimes and involved more
              mature disclosure surfaces. In other words, the market gives context, not an answer. That is especially
              true when the private company in question is not publishing current operating metrics.
