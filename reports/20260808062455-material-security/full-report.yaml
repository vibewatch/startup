      - number: '7.2'
        title: Privacy, platform, and operational risk
        blocks:
          - type: paragraph
            body: >-
              The core operational risk is inseparable from the product’s value proposition. Material delivers leverage
              precisely because it can see sensitive historical mail, file permissions, account behavior, and related
              telemetry across cloud office suites. That same access creates large downside if the vendor mishandles
              data, suffers a breach, or loses alignment with customer privacy requirements. The privacy policy confirms
              the company processes personal data-rich content and may manually handle data in certain support or
              response situations. The public record also shows concentration on Google Workspace and Microsoft 365,
              making Material exposed to provider API changes, shifting limited-use policies, and broader bundling
              pressure from the platform owners themselves. Case studies such as Mars, Color, and PagerDuty suggest the
              company is thoughtful about privacy architecture and auditability, but they also underscore how high the
              stakes are if those controls fail. In other words, the product is strongest exactly where its control
              obligations are most demanding. Contractual privacy alignment matters almost as much as pure feature
              depth.
