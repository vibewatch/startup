  topStrengths:
    - >-
      Material is better framed as a cloud-workspace security platform than a narrow secure email gateway, with public
      proof across email, files, account security, and workflow automation.
    - >-
      Named-customer evidence is strong for a private vendor, including recognizable references across public SaaS,
      healthcare-sensitive, fintech, and large-enterprise environments.
    - >-
      Product direction aligns with cybersecurity segments that still attract premium multiples in 2026, especially
      cloud, post-delivery remediation, OAuth governance, and operator-efficiency workflows.
    - >-
      The company appears to offer low-friction API deployment and strong operational ROI narratives that can matter
      meaningfully in competitive enterprise evaluations.
  topRisks:
    - >-
      Current ARR, growth, retention, gross margin, burn, and concentration are not publicly disclosed, making price
      support weak without a private data room.
    - >-
      Google and Microsoft are both critical platform partners and long-term bundling threats, creating structural
      dependency and competitive compression risk.
    - >-
      Because Material touches highly sensitive historical email and file data, a product-side privacy or security
      incident would likely have outsized reputational and commercial consequences.
    - >-
      The last hard valuation mark is from May 2022, so investors risk overpaying if present-day performance no longer
      supports unicorn-level pricing.
    - >-
      Public customer proof remains more Google Workspace-heavy than Microsoft 365-heavy, leaving some platform-balance
      questions unresolved.
  unresolvedGaps:
    - Current ARR, revenue growth, gross margin, burn, and cash runway.
    - Net revenue retention, gross retention, churn, and pricing / discount behavior.
    - Customer concentration, deployment-size distribution, and top-account exposure.
    - Cap-table structure, liquidation preferences, and any financing expectations after the 2022 Series C.
    - Independent benchmark evidence on false-positive rates, detection quality, and platform-level expansion economics.
