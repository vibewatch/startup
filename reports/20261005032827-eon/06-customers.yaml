  title: "Customers"
  summary: "Eon targets enterprise cloud engineering, security, and FinOps leaders across AWS, Microsoft Azure, and Google Cloud, proving measurable storage savings in named deployments such as NETGEAR (35% backup storage cost reduction) and Innago (40% savings on an agentless architecture). While customer testimonials and channel initiatives validate rapid adoption and up to 50% storage waste reduction, exact total customer count, annual recurring revenue (ARR), net revenue retention (NRR), and account concentration remain undisclosed private metrics."
sections:
  - id: "customer-segmentation-and-buyer-matrix"
    title: "Customer Base Segmentation, Buyer Personas, and Enterprise Workloads"
    body: |
      Eon segments its enterprise customer base across cloud-first enterprises, regulated industry organizations, and data-intensive AI teams managing multi-cloud estates across Amazon Web Services (AWS), Microsoft Azure, and Google Cloud Platform (GCP). In typical enterprise cloud environments, organizations accumulate hundreds of terabytes to petabytes of secondary storage across backup vaults, snapshots, and disaster recovery tiers, often experiencing significant operational drift and snapshot sprawl. Eon addresses these workloads by deploying a single read-only IAM role that executes autonomous discovery, classification, and deduplicated secondary storage management without requiring disruptive backup agents or appliance hardware.

      The purchasing committee within target accounts spans distinct functional buyers and budget owners. The Chief Information Security Officer (CISO) and VP of Cloud Infrastructure serve as primary economic buyers, driven by ransomware recovery imperatives, compliance audits, and the need to defend against rogue AI agents corrupting enterprise datastores. Simultaneously, Directors of Infrastructure and Cloud Operations prioritize recovery point objectives (RPO) and operational simplicity, while Chief Data Officers and AI platform teams increasingly act as internal customers seeking to query dormant backup snapshots directly as zero-ETL data lakes formatted in open standards like Parquet and Iceberg.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "production-deployments-and-customer-proof"
    title: "Named Customer Deployments, Documented Outcomes, and Production Proof"
    body: |
      Evidence of production adoption is substantiated through verified enterprise deployments and practitioner reviews, demonstrating measurable operational and financial outcomes. Hardware and networking enterprise NETGEAR deployed Eon to manage secondary storage across its cloud infrastructure, achieving a verified 35% reduction in backup storage costs by replacing redundant native cloud snapshots with Eon's continuous deduplication and block-level compression. Similarly, property management software platform Innago achieved a 40% reduction in cloud backup expenses utilizing Eon's agentless deployment model, which eliminated complex manual tagging and operational overhead.

      Practitioner sentiment captured across industry platforms corroborates these operational benefits while surfacing tactical architectural dependencies. Directors of Infrastructure report substantial cost savings compared to native hyperscaler backup mechanisms and praise Eon's responsive enterprise support. At the same time, technical reviews from infrastructure managers note specific deployment limitations, such as recovery workflows requiring designated local network configurations. Across verified accounts, customers report achieving 15-minute recovery point objectives across their estates and converting backup budgets from administrative overhead into queryable analytical assets.
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
    figureRefs: []
  - id: "go-to-market-expansion-and-concentration-risks"
    title: "GTM Channel Acceleration, Hyperscaler Marketplaces, and Retention Gaps"
    body: |
      Eon's go-to-market trajectory relies heavily on hyperscaler cloud marketplaces and an expanding ecosystem of reseller partners, managed service providers (MSPs), and systems integrators. Co-founder Gonen Stein notes that enterprise customers overwhelmingly procure software through AWS, Azure, and Google Cloud marketplaces to draw down existing cloud commitments. By packaging backup storage into a unified platform with regular partner margins—yielding partners approximately 25% of deal value back—Eon incentivizes channel resellers to bundle its posture management solution with broader cloud modernization, security, and FinOps initiatives.

      Despite documented commercial traction, significant diligence gaps persist regarding long-term retention dynamics and revenue concentration. Eon does not publicly disclose its total enterprise customer count, Annual Recurring Revenue (ARR), Gross Revenue Retention (GRR), or Net Revenue Retention (NRR). While customer reviews indicate that teams often save more on secondary storage than they spend on Eon's software, the absence of cohort-level expansion metrics and customer concentration data leaves open questions regarding contract durability, top-account exposure, and long-term gross margins across multi-cloud environments.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU002"
    figureRefs: []
