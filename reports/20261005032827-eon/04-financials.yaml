callouts:
  - calloutType: "risk"
    title: "Capital Underwriting Blocker: Disclosed Funding vs Undisclosed Fundamentals"
    body: "While Eon's fundraising track record is extraordinary—scaling from seed to a $4.0B valuation in approximately two years—the complete absence of audited ARR, gross margins, and cash burn metrics prevents conventional quantitative underwriting. Institutional diligence must condition participation on comprehensive data-room transparency."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI011"
      - "CI012"
  - calloutType: "insight"
    title: "Architectural Decoupling as Gross Margin Catalyst"
    body: "By leveraging customer-tenancy read-only IAM roles rather than storing bulk raw data in company-owned infrastructure, Eon structurally offloads primary storage hosting costs. If compute overhead for autonomous indexing and AI contextualization remains disciplined, gross margins could match top-quartile enterprise infrastructure software."
    claimRefs:
      - "CI002"
      - "CI004"
      - "CI005"
