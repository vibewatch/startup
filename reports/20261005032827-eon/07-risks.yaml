callouts:
  - calloutType: "risk"
    title: "Control Plane IAM Blast Radius"
    body: "Modern cloud ransomware attacks exploit the fact that native snapshots and backups often operate under the identical identity boundary as production workloads. If an enterprise IAM role is compromised, attackers can systematically disable backups, delete recovery points, or contaminate secondary vaults before detonating payloads."
    claimRefs:
      - "CR004"
      - "CR005"
  - calloutType: "assumption"
    title: "Synthetic Benchmark Fidelity Limitation"
    body: "While reference-free synthetic data platforms like Era by Eon enable multi-system enterprise benchmarking without exposing confidential records, technical disclosures confirm that synthetic data cannot fully reproduce the nuance, human ambiguity, and edge-case errors of live production environments."
    claimRefs:
      - "CR007"
      - "CR008"
