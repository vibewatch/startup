              - CU012
      - number: '6.3'
        title: GTM Channel Acceleration, Hyperscaler Marketplaces, and Retention Gaps
        blocks:
          - type: paragraph
            body: >
              Eon's go-to-market trajectory relies heavily on hyperscaler cloud marketplaces and an expanding ecosystem
              of reseller partners, managed service providers (MSPs), and systems integrators. Co-founder Gonen Stein
              notes that enterprise customers overwhelmingly procure software through AWS, Azure, and Google Cloud
              marketplaces to draw down existing cloud commitments. By packaging backup storage into a unified platform
              with regular partner margins—yielding partners approximately 25% of deal value back—Eon incentivizes
              channel resellers to bundle its posture management solution with broader cloud modernization, security,
              and FinOps initiatives.


              Despite documented commercial traction, significant diligence gaps persist regarding long-term retention
              dynamics and revenue concentration. Eon does not publicly disclose its total enterprise customer count,
              Annual Recurring Revenue (ARR), Gross Revenue Retention (GRR), or Net Revenue Retention (NRR). While
              customer reviews indicate that teams often save more on secondary storage than they spend on Eon's
              software, the absence of cohort-level expansion metrics and customer concentration data leaves open
              questions regarding contract durability, top-account exposure, and long-term gross margins across
              multi-cloud environments.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
