    type: journey-map
    summary: >-
      Visualizes the enterprise adoption lifecycle from read-only posture discovery through cost reduction and zero-ETL
      AI data activation.
    data:
      items:
        - label: 1. Posture Discovery
          detail: Connect read-only IAM role to auto-discover unmanaged cloud backup assets
          unit: Onboarding Stage
          risk: Initial cloud permission and security audit reviews
        - label: 2. Autonomous Protection
          detail: Automate policy assignment and backup scheduling without deploying host agents
          unit: Deployment Stage
          risk: Integration hurdles across heterogeneous multi-cloud accounts
        - label: 3. Storage Optimization
          detail: Implement global deduplication and compression to achieve 30% to 50% cost savings
          unit: Optimization Stage
          risk: Variable savings dependent on customer snapshot duplication ratios
        - label: 4. Rapid Resiliency
          detail: Achieve 15-minute RTO and granular record-level rollback against ransomware
          unit: Resilience Stage
          risk: Restore process constraints requiring dedicated network environments
        - label: 5. Zero-ETL AI Activation
          detail: Convert secondary backup snapshots into queryable Parquet/Iceberg data lakes
          unit: Expansion Stage
          risk: Data governance and access boundaries between IT and AI teams
        - label: 6. Marketplace Expansion
          detail: Draw down hyperscaler marketplace commitments and expand across cloud estates
          unit: Commercial Stage
          risk: Enterprise contract renegotiation and multi-year commitment inertia
