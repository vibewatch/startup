        - Track preference stack and potential senior liquidation overhang
      - - Valuation Stance
        - Stretched
        - Headline $4.0B valuation implies speculative triple-digit revenue multiples (>65x)
        - Require 40-50% entry discount or verified ARR >$80M before re-rating
