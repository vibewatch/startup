      - Stance / Rating
      - Underlying Evidence & Rationale
      - Portfolio Action
    rows:
      - - Recommendation
        - Track
        - Elite founding team and tier-1 syndicate offset by total lack of financial disclosure
        - Maintain active monitoring; decline private secondary purchases at $4.0B
      - - Confidence
        - Medium
