      - number: '5.3'
        title: Diligence Assessment, Security Controls, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              A technical evaluation of Eon must balance executive pedigree against architectural opacity and market
              naming confusion. The founding engineering team previously created CloudEndure—a disaster recovery startup
              acquired by AWS in 2019 for approximately $250 million—bringing deep primary expertise in hypervisor-level
              replication and cloud migration mechanics (CE013, CE014). This background explains Eon's rapid product
              iteration and its strategic patent filings around secondary storage observation and write-reduction
              techniques (CE015). Nevertheless, critical technical verifications remain outstanding. While Eon promotes
              appliance-free simplicity via read-only cloud permissions, the exact mechanisms for achieving row-level
              database extraction across heterogeneous SQL engines without native database agents require technical
              data-room auditing (CE016). Furthermore, broad automated discovery introduces risks of cloud provider API
              rate-limiting during large-scale enterprise scanning operations. Disambiguation from adjacent entities in
              public records—ranging from industrial utilities to healthcare EHR software—underscores the imperative for
              direct technical diligence on Eon's production benchmarks.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Appliance-Free Read-Only Architecture
            body: >-
              By operating exclusively via a single read-only IAM role and executing data processing in isolated vaults,
              Eon eliminates credential escalation risks, proxy latency, and appliance maintenance overhead common to
              legacy enterprise backup software.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Proprietary Secondary Storage Opacity
            body: >-
              Eon relies on proprietary storage innovations and patent-pending algorithms to observe infrastructure
              changes and restore data without continuous rewriting. Diligence must audit these storage algorithms to
              verify throughput limits and recovery reliability under massive enterprise scale.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Enterprise Workloads
        blocks:
          - type: paragraph
            body: >
              Eon segments its enterprise customer base across cloud-first enterprises, regulated industry
              organizations, and data-intensive AI teams managing multi-cloud estates across Amazon Web Services (AWS),
              Microsoft Azure, and Google Cloud Platform (GCP). In typical enterprise cloud environments, organizations
              accumulate hundreds of terabytes to petabytes of secondary storage across backup vaults, snapshots, and
              disaster recovery tiers, often experiencing significant operational drift and snapshot sprawl. Eon
              addresses these workloads by deploying a single read-only IAM role that executes autonomous discovery,
              classification, and deduplicated secondary storage management without requiring disruptive backup agents
              or appliance hardware.


              The purchasing committee within target accounts spans distinct functional buyers and budget owners. The
              Chief Information Security Officer (CISO) and VP of Cloud Infrastructure serve as primary economic buyers,
              driven by ransomware recovery imperatives, compliance audits, and the need to defend against rogue AI
              agents corrupting enterprise datastores. Simultaneously, Directors of Infrastructure and Cloud Operations
              prioritize recovery point objectives (RPO) and operational simplicity, while Chief Data Officers and AI
              platform teams increasingly act as internal customers seeking to query dormant backup snapshots directly
              as zero-ETL data lakes formatted in open standards like Parquet and Iceberg.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
