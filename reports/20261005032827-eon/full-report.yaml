      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Value Proposition Bridges Infrastructure FinOps and Enterprise AI
            body: >-
              Eon expands its customer footprint by presenting a dual ROI proposition. Initial deployment is justified
              to CFOs and infrastructure heads through immediate 30% to 50% backup storage savings via deduplication.
              Once deployed, Eon enables expansion into data engineering and AI platform budgets by converting dormant
              snapshots into queryable Parquet and Iceberg tables without building brittle ETL pipelines.
            calloutType: insight
            claimRefs:
