  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Compliance, and Data Governance Exposure
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of autonomous cloud backup posture management and AI-ready data foundation platforms
              requires navigating rigorous international data privacy regimes and security compliance frameworks.
              Organizations deploying Eon across multi-cloud environments such as AWS, Microsoft Azure, and Google Cloud
              must ensure adherence to mandatory compliance mandates including HIPAA, PCI DSS, ISO 27001, and SOC 2 Type
              II, which strictly demand documented incident handling, prompt breach notification protocols, and
              continuous policy enforcement. A critical regulatory bottleneck remains the formal attestation and
              authorization for public sector and sensitive enterprise workloads; while commercial organizations
              leverage Eon's continuous discovery and classification mechanisms, public-sector environments demand
              verified authorizations such as FedRAMP. Furthermore, evolving AI governance frameworks and global data
              sovereignty rules impose strict constraints on cross-border data replication and training ingestion from
              operational backups. Without continuous validation of data residency and granular rollback capabilities,
              enterprise customers risk substantial regulatory penalties and compliance failures during mandatory
              audits. Finally, public filings from unrelated homonyms like EON Resources demonstrate that regulatory
              filings often mandate extensive disclosures across dozens of distinct risk factors.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
