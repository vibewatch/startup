      - number: '6.2'
        title: Named Customer Deployments, Documented Outcomes, and Production Proof
        blocks:
          - type: paragraph
            body: >
              Evidence of production adoption is substantiated through verified enterprise deployments and practitioner
              reviews, demonstrating measurable operational and financial outcomes. Hardware and networking enterprise
              NETGEAR deployed Eon to manage secondary storage across its cloud infrastructure, achieving a verified 35%
              reduction in backup storage costs by replacing redundant native cloud snapshots with Eon's continuous
              deduplication and block-level compression. Similarly, property management software platform Innago
              achieved a 40% reduction in cloud backup expenses utilizing Eon's agentless deployment model, which
              eliminated complex manual tagging and operational overhead.


              Practitioner sentiment captured across industry platforms corroborates these operational benefits while
              surfacing tactical architectural dependencies. Directors of Infrastructure report substantial cost savings
              compared to native hyperscaler backup mechanisms and praise Eon's responsive enterprise support. At the
              same time, technical reviews from infrastructure managers note specific deployment limitations, such as
              recovery workflows requiring designated local network configurations. Across verified accounts, customers
              report achieving 15-minute recovery point objectives across their estates and converting backup budgets
              from administrative overhead into queryable analytical assets.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
