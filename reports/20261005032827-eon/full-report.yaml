        title: Exhibits
        blocks:
          - type: callout
            title: Autonomous CBPM Disruption vs Legacy Backup Vendors
            body: >-
              Eon's architecture transforms cloud backup from an insurance expense into an active data asset. By
              leveraging a single read-only IAM role to snapshot and convert object data into Apache Iceberg/Parquet,
              Eon sidesteps brittle agent installations while directly challenging traditional appliance vendors [CO005,
              CO008].
            calloutType: insight
            claimRefs:
              - CO005
              - CO008
          - type: callout
            title: High Valuation Premium Without Public ARR Verification
            body: >-
              Eon achieved a $4.0B post-money valuation under two years from inception without disclosing ARR, operating
              margins, or customer count. The rapid series of five funding rounds creates substantial liquidation
              preference overhang that requires rigorous diligence into cap-table waterfall mechanics [CO013, CO015,
              CO016].
