              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than a list of venture-backed backup vendors. Buyers can remain
              with native hyperscaler services, purchase an established suite, assemble internal policies and scripts,
              or tolerate fragmented backup operations as the status quo. Eon's own comparison content places Google
              Cloud Cost Management and several FinOps platforms beside Eon, but also says Eon addresses backup and
              data-protection spend rather than compute or Kubernetes optimization. A third-party profile names Veeam,
              Druva, and Rubrik as direct alternatives, while a recruiting-page analysis also identifies Commvault and
              Cohesity as bundled-suite pressure. The retained pool additionally contains unrelated E.ON energy and EON
              Reality material; these are identity collisions, not competitors, and are excluded from the operating
              landscape.
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP016
