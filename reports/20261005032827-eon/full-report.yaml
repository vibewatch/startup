      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Second-Order Market Shift: From Static Insurance to AI-Queryable Secondary Data'
            body: >-
              Traditional backup solutions operated as passive, unindexed disaster insurance whose economic
              justification deteriorated outside catastrophic outage events. Eon's market positioning hinges on
              transforming dormant secondary snapshots into live, queryable data lakes using open columnar formats like
              Iceberg and Parquet. If adopted broadly, this redefines the addressable budget from defensive disaster
              recovery spend into offensive enterprise AI platform budgets.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: callout
            title: Market Boundary Dilution and Entity Disambiguation in Enterprise Discovery
            body: >-
              Because multiple prominent public and private commercial entities operate under the 'Eon' brand
              name—spanning European grid utilities, oil extraction, space systems, and fashion product passports—market
              research and automated diligence pipelines face persistent entity confusion. Underwriters must isolate
              Eon.io, Inc. filings and cloud data protection metrics from unrelated corporate data.
            calloutType: risk
            claimRefs:
