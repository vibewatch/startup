              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The core moat question is whether Eon's automation and backup-data activation remain differentiated after
              hyperscalers and suite vendors expand adjacent functionality. Simplify's analysis says Eon depends on
              cloud-provider APIs and that incumbents can squeeze stand-alone budgets through broader bundles.
              Checkthat's profile similarly assigns incumbents an advantage in hybrid infrastructure and integrated
              capabilities. These are useful adverse signals, not independent benchmarks: one sits inside a company job
              repost and the other is an unattributed profile with limited methodology. The investment case therefore
              needs customer-level win-loss data, renewal and expansion evidence, migration effort, realized pricing,
              and controlled recovery tests before treating product breadth or switching cost as durable. Until then,
              distribution power and rapid feature convergence remain credible displacement risks.
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP013
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A differentiated product combination
            body: >-
              Eon's combination of cross-cloud protection, granular access, and open-format backup data is distinctive
              in the retained evidence, although each element still requires independent performance validation.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: callout
            title: Distribution can outrun feature differentiation
            body: >-
              Hyperscalers control APIs and native procurement, while established vendors can bundle backup into broader
              suites; both mechanisms can compress Eon's stand-alone budget even without matching every feature.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Eon's commercial model is structured around enterprise autonomous cloud data management, positioning its
              platform to secure enterprise cloud infrastructure while eliminating brittle secondary ETL pipelines. The
              primary commercial mechanism combines autonomous cloud backup posture management with its Eon Mind data
              contextualization engine, targeting unstructured and semi-structured cloud workloads across Amazon Web
              Services, Microsoft Azure, and Google Cloud Platform. Monetization operates via cloud software
              subscriptions and usage tiers tied to protected data volume and analytical query throughput. Customers
              deploy Eon via a single read-only IAM role without requiring on-premises hardware appliances or virtual
              appliances, drastically reducing friction during technical evaluations and enterprise onboarding. The
              company highlights that continuous deduplication and cloud-native incremental capture can reduce
              enterprise cloud storage costs by up to 50 percent, creating a compelling cost-offset narrative against
              legacy backup infrastructure. However, official list pricing, realized per-terabyte rates, and baseline
              platform license fees remain opaque in public domains, necessitating direct customer contract and pricing
              schedule disclosure during underwriting.
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
      - number: '4.2'
        title: Cost Structure and Unit Economics Dynamics
        blocks:
          - type: paragraph
            body: >-
              Evaluating Eon's underlying unit economics reveals substantial structural advantages balanced by critical
              unverified assumptions. Operating as a pure cloud-native control plane, Eon's primary cost of goods sold
              drivers consist of compute resources required for autonomous data classification, index maintenance,
              metadata extraction, and multi-cloud egress coordination. Because Eon interfaces directly through
              customer-owned cloud accounts via read-only IAM permissions, substantial underlying block storage costs
              remain within customer cloud tenancy rather than passing directly through Eon's gross cost structure. This
              architectural decoupling enables software-like gross margin potential exceeding typical hardware-dependent
              storage appliances. However, advanced semantic processing, automated cataloging, and agentic AI query
              routing introduce variable compute overhead that scales directly with enterprise catalog complexity and
              active query volume. Without audited financials, gross margin performance, net retention rates, and
              customer acquisition payback periods cannot be independently verified, representing a primary diligence
              requirement.
            claimRefs:
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
