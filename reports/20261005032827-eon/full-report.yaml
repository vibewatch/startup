chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Autopilot Architecture
        blocks:
          - type: paragraph
            body: >-
              Eon (legally incorporated as EON IO, INC. on January 2, 2024, as a Delaware corporation) operates dual
              corporate headquarters at 245 Fifth Avenue in New York City and research and engineering facilities in Tel
              Aviv, Israel [CO001, CO002]. The company was founded to address critical architectural vulnerabilities in
              enterprise cloud backup posture [CO003]. Traditional cloud backups historically functioned as static,
              expensive, and opaque cold-storage silos requiring days for recovery while incurring massive storage costs
              across disconnected enterprise environments [CO004, CO005]. Eon developed what it defines as the first
              Cloud Backup Posture Management (CBPM) platform and autonomous data foundation [CO005, CO006]. The
              platform connects to customer cloud estates across Amazon Web Services (AWS), Microsoft Azure, and Google
              Cloud Platform via a single read-only IAM role without requiring software agents or dedicated hardware
              appliances [CO005, CO007]. By continuously discovering, classifying, and deduplicating storage objects
              into open file formats such as Apache Parquet and Apache Iceberg, Eon claims to reduce cloud backup
              storage expenditures by 30% to 50% while unlocking previously inaccessible datasets as queryable context
              for enterprise generative AI and business intelligence applications [CO005, CO008].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
