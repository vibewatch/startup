  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Adjacency Dynamics
        blocks:
          - type: paragraph
            body: >
              Enterprise cloud infrastructure spend represents a massive addressable expansion vector, with global
              annual cloud spending reaching approximately $679 billion by year-end 2024 and broader infrastructure
              expenditures projected to reach $838 billion by 2034. Within this infrastructure footprint, backup,
              disaster recovery, and data resilience operations consume between 10% and 30% of enterprise infrastructure
              budgets, driven by escalating external compliance mandates, internal data retention governance, and the
              imperative to defend against ransomware and rogue AI agent corruption.


              However, defining the addressable market for Eon requires establishing rigorous category boundaries and
              disentangling homonymous corporate entities. The primary target market for Eon (legal entity Eon.io, Inc.)
              comprises Cloud Backup Posture Management (CBPM), autonomous cloud data protection, and enterprise
              backup-to-AI data activation across AWS, Microsoft Azure, and Google Cloud environments. This category
              explicitly includes autonomous discovery, classification, policy assignment, deduplicated secondary
              storage, and SQL-queryable snapshot activation. Conversely, it excludes unrelated markets associated with
              homonymous entities such as European electric utility networks (E.ON SE), Permian Basin upstream oil and
              gas production (EON Resources Inc. / EONR), space payload optics (EON Space Labs), and textile digital
              product passports (EON Product Cloud). Within enterprise software, status-quo alternatives consist of
              legacy appliance-based backup software, native hyperscaler snapshot tooling, and manual disaster recovery
              runbooks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.2'
        title: Multi-Lens Market Sizing and Constrained Opportunity Layers
        blocks:
          - type: paragraph
            body: >
              Sizing Eon's market opportunity requires decomposing top-down macroeconomic cloud infrastructure
              projections into addressable workload budgets and realistic serviceable boundaries. Top-down industry
              estimates project global infrastructure expenditures to scale toward $838 billion by 2034, with global
              cloud spend surpassing $679 billion as of 2024. Applying enterprise IT allocation benchmarks, where 10% to
              30% of cloud infrastructure budgets are dedicated to data backup, retention, and resilience operations,
              yields a theoretical Total Addressable Market (TAM) of approximately $68 billion to $204 billion across
              global enterprise cloud deployments.


              Nevertheless, Eon's Serviceable Available Market (SAM) is bounded by organizations managing complex cloud
              estates with multi-terabyte to petabyte storage volumes across AWS, Azure, and Google Cloud that require
              automated backup posture management and rapid record-level recovery. The Serviceable Obtainable Market
              (SOM) is further constrained by enterprise adoption cycles, cloud security audit workflows, and initial
              deployment to high-risk production workloads. Rather than treating market size as an unconstrained single
              estimate, rigorous diligence models these sizing layers across distinct infrastructure, compliance, and
              workload dimensions while preserving open questions regarding verifiable bottom-up contract sizes and
              recurring net retention rates.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
