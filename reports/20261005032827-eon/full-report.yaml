      - number: '1.2'
        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Eon was conceived and founded by repeat enterprise cloud infrastructure entrepreneurs Ofir Ehrlich (Chief
              Executive Officer), Gonen Stein (President), and Ron Kimchi (Chief Technology Officer) [CO003, CO009]. The
              three co-founders previously built disaster recovery software startup CloudEndure, which Amazon acquired
              in 2019 for approximately $250M to establish AWS Disaster Recovery and Migration Services [CO009]. Their
              direct experience operating large-scale recovery pipelines within AWS highlighted severe configuration
              drift, ransomware recovery delays, and visibility gaps in modern cloud architectures, directly shaping
              Eon's product thesis [CO009, CO010]. The executive team also includes Chief Strategy Officer Moshe Milman,
              who contributes enterprise go-to-market and strategic positioning expertise [CO011]. While the leadership
              syndicate demonstrates exceptional founder-market fit within distributed storage and recovery systems, Eon
              displays significant key-person dependence on its founding trio for architectural vision and elite
              engineering recruitment across New York and Tel Aviv [CO003, CO009].
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO011
      - number: '1.3'
        title: Capitalization History, Investor Syndicate, and Dilution Analysis
        blocks:
          - type: paragraph
            body: >-
              Between January 2024 and December 2025, Eon executed one of the fastest venture capital ascents in
              enterprise infrastructure history, securing approximately $500M in aggregate equity financing across five
              funding rounds [CO012, CO013]. The company emerged from stealth in October 2024 with $127M in total
              capital raised, comprising a $20M Seed round led by Sequoia Capital, a $30M Series A led by Lightspeed
              Venture Partners, and a $77M Series B led by Greenoaks Capital Partners at a $750M post-money valuation
              [CO009, CO013]. In November 2024, BOND led a $70M Series C round at a $1.4B post-money valuation [CO013].
              Most recently, on December 2, 2025, investor Elad Gil (Gil Capital) led a $300M Series D financing round,
              tripling Eon's valuation to $4.0B with participation from prior leads Sequoia, Lightspeed, Greenoaks, and
              BOND, alongside secondary participation from Affinity, Vine Ventures, Meron Capital, and Eight Roads
              [CO012, CO013, CO014]. Despite this formidable capitalization and top-tier investor syndicate, Eon has not
              publicly disclosed annual recurring revenue (ARR), net retention rate (NRR), gross margin, or cash burn,
              rendering its $4.0B post-money valuation multiple and liquidation waterfall structure opaque to
              unaccredited public market observers [CO015, CO016].
            claimRefs:
              - CO009
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
