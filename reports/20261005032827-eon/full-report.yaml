            title: Private Unit Economics and Lack of Retention Disclosures
            body: >-
              While customer case studies from NETGEAR and Innago confirm production adoption, the absence of publicly
              disclosed Annual Recurring Revenue, Net Revenue Retention, and customer cohort churn creates underwriting
              risk. Investors cannot independently verify whether early storage cost savings reliably translate into
              expanding multi-year contract values.
            calloutType: risk
