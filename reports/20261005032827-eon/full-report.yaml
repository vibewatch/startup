      - number: '4.3'
        title: Capital Adequacy and Financial Trajectory
        blocks:
          - type: paragraph
            body: >-
              Eon has demonstrated extraordinary capital velocity since commencing active operations in January 2024.
              After emerging from stealth in October 2024 with $127 million raised across Seed ($20M led by Sequoia),
              Series A ($30M led by Lightspeed), and Series B ($77M led by Greenoaks), Eon secured an additional $300
              million Series D financing round in December 2025 led by Gil Capital at a $4 billion post-money valuation.
              Secondary share platforms including UpMarket and EquityZen confirm active private secondary liquidity
              demand, with UpMarket reporting proprietary valuation model estimates near $4.49 billion. This aggressive
              equity accumulation provides estimated multi-year cash runway, insulating the business from short-term
              venture capital market contraction. Nonetheless, forward cash consumption is anticipated to accelerate as
              Eon scales its enterprise go-to-market engineering team and expands infrastructure coverage. Secondary
              market platforms emphasize that pre-IPO investments in Eon remain speculative, highly illiquid, and
              subject to substantial volatility and complete capital loss risk.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Underwriting Blocker: Disclosed Funding vs Undisclosed Fundamentals'
            body: >-
              While Eon's fundraising track record is extraordinary—scaling from seed to a $4.0B valuation in
              approximately two years—the complete absence of audited ARR, gross margins, and cash burn metrics prevents
              conventional quantitative underwriting. Institutional diligence must condition participation on
              comprehensive data-room transparency.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI011
              - CI012
          - type: callout
            title: Architectural Decoupling as Gross Margin Catalyst
            body: >-
              By leveraging customer-tenancy read-only IAM roles rather than storing bulk raw data in company-owned
              infrastructure, Eon structurally offloads primary storage hosting costs. If compute overhead for
              autonomous indexing and AI contextualization remains disciplined, gross margins could match top-quartile
              enterprise infrastructure software.
            calloutType: insight
            claimRefs:
              - CI002
              - CI004
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Autonomous Architecture and Storage Foundation
        blocks:
          - type: paragraph
            body: >-
              Eon positions its core offering around Autonomous Cloud Data Protection, moving enterprise data management
              away from cumbersome hardware or virtual appliance models toward a cloud-native secondary storage
              approach. Rather than requiring customer environments to deploy inline agents or proprietary storage
              appliances, Eon establishes connectivity through a single read-only IAM role. Once authenticated, the
              system conducts automated resource discovery and data classification across cloud accounts, inspecting
              actual contents rather than relying exclusively on cloud provider tags (CE001, CE002). The underlying
              engineering architecture combines continuous incremental snapshot capture with cross-account, cloud-native
              deduplication to curb redundant snapshot expenses (CE003). To insulate against enterprise threat
              vectors—including sophisticated ransomware strains and unauthorized data manipulation by autonomous AI
              agents—captured records reside within immutable, isolated vaults designed for granular point-in-time
              rollbacks without necessitating whole-environment image rebuilds (CE004, CE005). Beyond passive recovery,
              Eon automatically translates raw snapshots into open table formats including Apache Iceberg and Apache
              Parquet, unlocking secondary data reserves for zero-ETL analytical queries (CE006). A comparative analysis
              of operating models highlights how this agentless architecture diverges from legacy appliance deployments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE008
              - CE010
      - number: '5.2'
        title: 'Product Suite: Data Protection and Eon Mind'
        blocks:
          - type: paragraph
            body: >-
              The commercial platform splits into two tightly integrated functional modules: Eon Data Protection and Eon
              Mind. Eon Data Protection functions as the operational resilience backbone across Amazon Web Services,
              Microsoft Azure, and Google Cloud environments, delivering cross-cloud file exploration and surgical
              single-row database restoration (CE007, CE008). In parallel, Eon Mind serves as a semantic intelligence
              layer, structuring backed-up corporate data into living, contextual knowledge assets ready for consumption
              by production AI applications without custom data engineering pipelines (CE009, CE010). This dual
              capability addresses the classic dilemma where backup repositories become dormant capital drains. Customer
              deployment workflows demonstrate rapid operationalization: security and infrastructure teams transition
              from credential onboarding to unified posture monitoring in under thirty minutes, while data platform
              engineers query Iceberg partitions directly through downstream data lakehouses (CE011). However, rigorous
              technical diligence reveals clear boundaries: while multi-cloud visibility is broadly marketed, detailed
              technical specifications regarding fine-grained object-level access controls and cross-region egress cost
              management remain private (CE012).
            claimRefs:
