evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance-metrics
    missingEvidence: >-
      Audited financial disclosure of Annual Recurring Revenue (ARR), Net Retention Rate (NRR), gross margins, and
      trailing 12-month net burn rate.
    whyItMatters: >-
      Without verified ARR or growth rates, the $4.0B post-money valuation cannot be underwritten against enterprise
      SaaS and cloud infrastructure multiples.
    diligencePath: >-
      Request confidential virtual data room (VDR) access to management financial accounts, ARR bridge schedules, and
      customer cohort retention tables.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cap-table-waterfall-mechanics
    missingEvidence: >-
      Detailed capitalization table schedule detailing liquidation preferences, participation rights, and anti-dilution
      provisions across Series Seed through D share classes.
    whyItMatters: >-
      Rapid valuation step-ups across five rounds can conceal senior preference stacks that severely impair common
      shareholder and employee option returns in sub-$4B exits.
    diligencePath: Obtain fully diluted cap table and Certificate of Incorporation amendments from company legal counsel.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-metrics-and-contract-values
    missingEvidence: >-
      Audited customer account counts, annual contract values (ACVs), and net revenue retention rates specifically
      isolated to Eon's cloud backup platform.
    whyItMatters: >-
      Without segmented customer counts and average contract sizes, bottom-up market penetration and precise Serviceable
      Obtainable Market (SOM) calculations cannot be independently verified.
    diligencePath: >-
      Review vendor customer data rooms, confidential sales pipeline retrospectives, and customer reference interview
      calls during formal investment diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable Eon, hyperscaler, incumbent-suite, and internal-build pricing with identical protected-data, retention,
      restore, egress, support, and contract assumptions.
    whyItMatters: >-
      Public list-price absence prevents a normalized total-cost comparison and leaves discounting and minimum
      commitments untested.
    diligencePath: >-
      Request redacted proposals and invoices, then price a common workload and restore scenario across all shortlisted
      alternatives.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent recovery benchmarks, customer references selected without vendor curation, renewal cohorts, win-loss
      records, migration effort, and measured multi-homing behavior.
    whyItMatters: >-
      Vendor claims and unattributed profiles cannot establish performance superiority, customer satisfaction, switching
      cost, or moat durability.
    diligencePath: >-
      Run controlled restore tests, interview reference and former customers, and inspect cohort-level renewal,
      expansion, churn, and competitive win-loss data.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: commercial-traction
    missingEvidence: Audited annualized recurring revenue (ARR), customer count, net revenue retention (NRR), and GAAP gross margins.
    whyItMatters: >-
      Without baseline revenue and margin figures, underwriting Eon's $4.0B private market valuation against public SaaS
      comparables is fundamentally impossible.
    diligencePath: >-
      Obtain confidential management financial pack, revenue schedule by customer tier, and 24-month financial
      projections under NDA.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current monthly operating cash burn, net operating loss, and cash on balance sheet following the Series D round.
    whyItMatters: >-
      Determines whether Eon requires follow-on capital before achieving self-sustaining profitability or whether
      current cash reserves support expansion into 2028.
    diligencePath: Review monthly cash flow statements, departmental expense budgets, and runway forecasts.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing-schedule
    missingEvidence: >-
      Standard enterprise list pricing schedule, capacity metering tiers, and average contracted customer annual
      recurring revenue.
    whyItMatters: Validates customer unit economics, sales cycles, and pricing power against legacy incumbents.
    diligencePath: Examine sample master services agreements, enterprise order forms, and discounting guidelines.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: database-recovery-architecture
    missingEvidence: >-
      Technical documentation detailing how single-row surgical database recovery is achieved across distinct managed
      database engines (AWS RDS, Aurora, Cloud SQL) without in-guest agents.
    whyItMatters: Validates technical feasibility and recovery integrity without relying on proprietary marketing abstractions.
    diligencePath: Request an architectural deep dive and engineering white paper in the management data room.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: minor
    topic: patent-claims
    missingEvidence: >-
      Specific published patent application numbers and claims regarding secondary storage observation and
