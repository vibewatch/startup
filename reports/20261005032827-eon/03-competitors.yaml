    columns:
      - "Buying criterion"
      - "Eon"
      - "Hyperscaler-native"
      - "Established suites"
      - "Internal build"
      - "Evidence confidence"
    rows:
      - ["Cross-cloud control plane", "Company claims AWS, Azure, and Google Cloud coverage", "Usually cloud-specific; exact breadth not tested here", "Broad coverage reported secondarily; exact parity unknown", "Possible but customer-specific", "Medium for Eon; low for comparisons"]
      - ["Agentless deployment", "One read-only IAM role claimed; no appliances reported", "Unknown in retained evidence", "Unknown in retained evidence", "Architecture-dependent", "Medium for Eon; unknown elsewhere"]
      - ["Granular recovery", "Company claims file, object, and database-row access", "Item-level recovery reported for selected AWS services", "Unknown in retained evidence", "Possible but implementation-dependent", "Medium"]
      - ["Backup-data activation", "Company claims open Parquet and Iceberg formats for AI", "Unknown in retained evidence", "Third-party profile says competitors emphasize protection and recovery", "Possible with custom pipelines", "Medium for Eon; low for competitor generalization"]
      - ["Hybrid infrastructure support", "Not established; positioning is cloud-first", "Cloud-specific", "Third-party profile assigns incumbents an advantage", "Possible but customer-specific", "Low to medium"]
      - ["Compute / Kubernetes optimization", "Company explicitly says this is out of scope", "Native recommendations available", "Unknown in retained evidence", "Possible with separate tooling", "Medium"]
    notes: >-
      Cells report only what the assigned sources support; "unknown" means the chapter lacks evidence, not that
      the capability is absent.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP008", "CP011", "CP012"]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Alternative"
      - "Price / unit / contract model"
      - "Included capability signal"
      - "Discounts or unknowns"
      - "Diligence implication"
    rows:
      - ["Eon", "Cost-per-GB and custom enterprise quote reported", "Data protection, recovery, posture management, and data access", "No public rate card, minimum, term, or realized discount", "Obtain a normalized quote against protected and retained data volumes"]
      - ["Hyperscaler-native backup", "Unknown in retained chapter evidence", "Native backup and recovery", "Storage, transfer, retrieval, and management charges not normalized", "Model the same retention and restore scenario across each cloud"]
      - ["Established suites", "Unknown in retained chapter evidence", "Broader backup / resilience bundle", "Bundle allocation and discounting unknown", "Separate incremental backup price from suite-wide spend"]
      - ["Internal build", "Labor, cloud consumption, and operating-risk model", "Custom policy, recovery, and data pipelines", "No staffing or maintenance baseline", "Include engineering time, testing, on-call, and failed-recovery exposure"]
      - ["Status quo / multi-tool", "Existing contracts plus cloud consumption", "Fragmented native and third-party coverage", "Hidden duplication and migration cost unknown", "Measure current total cost before crediting vendor savings claims"]
    notes: >-
      No retained source provides comparable realized prices; all non-Eon price cells are explicit evidence gaps,
      not zero-cost assumptions.
    claimRefs: ["CP009", "CP010", "CP013", "CP014"]
figures:
  - id: "FP001"
    title: "Ordinal positioning: cross-cloud breadth versus backup-data activation"
    type: "quadrant"
    summary: >-
      Analyst ordinal scores (1 low, 5 high) show the evidence-backed direction of six solution classes, not a
      measured benchmark.
    data:
      points:
        - label: "Eon"
          x: 4
          y: 5
          detail: "Cross-cloud coverage and open-format data activation are company claims; independent testing is absent."
        - label: "Hyperscaler-native backup"
          x: 2
          y: 2
          detail: "Strong native distribution, but retained evidence does not establish broad cross-cloud control or data activation."
        - label: "Established backup suites"
          x: 5
          y: 3
          detail: "Broad suite and hybrid posture reported secondarily; direct feature parity was not tested."
        - label: "Cloud cyber-resilience vendors"
          x: 4
          y: 3
          detail: "Named direct alternatives, with exact breadth and activation capabilities unknown in retained evidence."
        - label: "Internal build"
          x: 3
          y: 4
          detail: "Potentially flexible, but implementation depth, cost, and reliability are customer-specific."
        - label: "Adjacent FinOps tools"
          x: 4
          y: 1
          detail: "Broad cloud-cost visibility can span clouds, but these tools do not replace backup protection."
    approximationNotes: >-
      Scores are analyst ordinal judgments derived from the retained feature evidence; they are not market share,
      performance, price, or independently benchmarked measurements.
    claimRefs: ["CP015"]
callouts:
  - calloutType: "strength"
    title: "A differentiated product combination"
    body: >-
      Eon's combination of cross-cloud protection, granular access, and open-format backup data is distinctive in
      the retained evidence, although each element still requires independent performance validation.
    claimRefs: ["CP001", "CP002", "CP004"]
  - calloutType: "risk"
    title: "Distribution can outrun feature differentiation"
    body: >-
      Hyperscalers control APIs and native procurement, while established vendors can bundle backup into broader
      suites; both mechanisms can compress Eon's stand-alone budget even without matching every feature.
    claimRefs: ["CP007", "CP008", "CP015"]
