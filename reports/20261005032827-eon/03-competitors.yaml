      - ["Veeam / Commvault / Cohesity", "Established backup suites", "Not established by retained chapter evidence", "Large and hybrid enterprises", "Broader bundled suites and installed-base distribution", "Like-for-like feature, price, and recovery evidence is unavailable"]
      - ["Druva / Rubrik", "Cloud and cyber-resilience vendors", "Not established by retained chapter evidence", "Enterprise backup and security buyers", "Named as direct competitors by a third-party profile", "The profile supplies no independently tested benchmark"]
      - ["Internal build", "Substitute", "Customer-specific", "Engineering-led organizations", "Maximum policy and data-pipeline control", "Build cost, staffing, recovery assurance, and portability are unknown"]
      - ["Manual multi-tool status quo", "Status quo substitute", "Customer-specific", "Organizations tolerating fragmented operations", "Avoids a new vendor and contract", "Operational drift, fragmented visibility, and slow recovery remain risks"]
      - ["FinOps platforms", "Adjacent budget competitor", "Not established by retained chapter evidence", "Cloud-cost and platform teams", "Compute, Kubernetes, allocation, and optimization depth", "Generally does not replace backup protection or recovery"]
    notes: >-
      Partial landscape based only on assigned prefetched sources; current competitor scale, funding, customer
      counts, and pricing are unknown unless explicitly stated.
    claimRefs: ["CP003", "CP005", "CP006", "CP007", "CP011", "CP016"]
