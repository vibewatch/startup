company:
  name: "Eon"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in January 2024 by AWS CloudEndure alumni, Eon (EON IO, INC.) pioneered Cloud Backup Posture Management (CBPM) to autonomously index cloud storage and transform dormant backups into queryable, AI-ready data lakes across AWS, Azure, and Google Cloud. The company has raised approximately $500M across rapid funding rounds reaching a $4.0B valuation led by Elad Gil in December 2025, but structural gaps persist around unverified private metrics including undisclosed ARR, burn rate, and non-dilution terms."
sections:
  - id: "corporate-identity-and-foundational-mission"
    title: "Corporate Identity, Foundation, and Autopilot Architecture"
    body: "Eon (legally incorporated as EON IO, INC. on January 2, 2024, as a Delaware corporation) operates dual corporate headquarters at 245 Fifth Avenue in New York City and research and engineering facilities in Tel Aviv, Israel [CO001, CO002]. The company was founded to address critical architectural vulnerabilities in enterprise cloud backup posture [CO003]. Traditional cloud backups historically functioned as static, expensive, and opaque cold-storage silos requiring days for recovery while incurring massive storage costs across disconnected enterprise environments [CO004, CO005]. Eon developed what it defines as the first Cloud Backup Posture Management (CBPM) platform and autonomous data foundation [CO005, CO006]. The platform connects to customer cloud estates across Amazon Web Services (AWS), Microsoft Azure, and Google Cloud Platform via a single read-only IAM role without requiring software agents or dedicated hardware appliances [CO005, CO007]. By continuously discovering, classifying, and deduplicating storage objects into open file formats such as Apache Parquet and Apache Iceberg, Eon claims to reduce cloud backup storage expenditures by 30% to 50% while unlocking previously inaccessible datasets as queryable context for enterprise generative AI and business intelligence applications [CO005, CO008]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "executive-leadership-and-governance"
    title: "Founders, Executive Leadership, and Governance Architecture"
    body: "Eon was conceived and founded by repeat enterprise cloud infrastructure entrepreneurs Ofir Ehrlich (Chief Executive Officer), Gonen Stein (President), and Ron Kimchi (Chief Technology Officer) [CO003, CO009]. The three co-founders previously built disaster recovery software startup CloudEndure, which Amazon acquired in 2019 for approximately $250M to establish AWS Disaster Recovery and Migration Services [CO009]. Their direct experience operating large-scale recovery pipelines within AWS highlighted severe configuration drift, ransomware recovery delays, and visibility gaps in modern cloud architectures, directly shaping Eon's product thesis [CO009, CO010]. The executive team also includes Chief Strategy Officer Moshe Milman, who contributes enterprise go-to-market and strategic positioning expertise [CO011]. While the leadership syndicate demonstrates exceptional founder-market fit within distributed storage and recovery systems, Eon displays significant key-person dependence on its founding trio for architectural vision and elite engineering recruitment across New York and Tel Aviv [CO003, CO009]."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capitalization-syndicate-and-valuation-trajectory"
    title: "Capitalization History, Investor Syndicate, and Dilution Analysis"
    body: "Between January 2024 and December 2025, Eon executed one of the fastest venture capital ascents in enterprise infrastructure history, securing approximately $500M in aggregate equity financing across five funding rounds [CO012, CO013]. The company emerged from stealth in October 2024 with $127M in total capital raised, comprising a $20M Seed round led by Sequoia Capital, a $30M Series A led by Lightspeed Venture Partners, and a $77M Series B led by Greenoaks Capital Partners at a $750M post-money valuation [CO009, CO013]. In November 2024, BOND led a $70M Series C round at a $1.4B post-money valuation [CO013]. Most recently, on December 2, 2025, investor Elad Gil (Gil Capital) led a $300M Series D financing round, tripling Eon's valuation to $4.0B with participation from prior leads Sequoia, Lightspeed, Greenoaks, and BOND, alongside secondary participation from Affinity, Vine Ventures, Meron Capital, and Eight Roads [CO012, CO013, CO014]. Despite this formidable capitalization and top-tier investor syndicate, Eon has not publicly disclosed annual recurring revenue (ARR), net retention rate (NRR), gross margin, or cash burn, rendering its $4.0B post-money valuation multiple and liquidation waterfall structure opaque to unaccredited public market observers [CO015, CO016]."
    claimRefs:
      - "CO009"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
callouts:
  - calloutType: "insight"
    title: "Autonomous CBPM Disruption vs Legacy Backup Vendors"
    body: "Eon's architecture transforms cloud backup from an insurance expense into an active data asset. By leveraging a single read-only IAM role to snapshot and convert object data into Apache Iceberg/Parquet, Eon sidesteps brittle agent installations while directly challenging traditional appliance vendors [CO005, CO008]."
    claimRefs:
      - "CO005"
      - "CO008"
  - calloutType: "risk"
    title: "High Valuation Premium Without Public ARR Verification"
    body: "Eon achieved a $4.0B post-money valuation under two years from inception without disclosing ARR, operating margins, or customer count. The rapid series of five funding rounds creates substantial liquidation preference overhang that requires rigorous diligence into cap-table waterfall mechanics [CO013, CO015, CO016]."
    claimRefs:
      - "CO013"
      - "CO015"
      - "CO016"
