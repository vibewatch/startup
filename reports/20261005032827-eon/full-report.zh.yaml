  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现架构
        blocks:
          - type: paragraph
            body: >-
              Eon 的商业模式以企业自主云数据管理为核心：平台既保护企业云基础设施，也消除脆弱的二级 ETL 流程。其主要商业机制把自主云备份态势管理与 Eon Mind 数据上下文引擎结合起来，面向 Amazon Web
              Services、Microsoft Azure 和 Google Cloud Platform
              上的非结构化及半结构化云工作负载。变现方式是云软件订阅和按使用量分层，收费取决于受保护数据量和分析查询吞吐量。客户只需通过单个只读 IAM 角色部署
              Eon，无需本地硬件设备或虚拟设备，大幅降低技术评估和企业上线摩擦。公司强调，持续去重和云原生增量捕获最多可降低企业云存储成本 50%，相对于传统备份基础设施形成有吸引力的成本抵消逻辑。不过，官方价目、实际每
              TB 费率和基础平台许可费在公开渠道仍不透明，投资判断时必须直接披露客户合同和定价表。
            claimRefs:
