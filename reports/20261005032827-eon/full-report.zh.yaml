  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与邻接市场动态
        blocks:
          - type: paragraph
            body: >
              企业云基础设施支出构成巨大的可拓展市场，全球年度云支出截至 2024 年底约为 $679 billion，更广义的基础设施支出预计到 2034 年达到 $838
              billion。在这片基础设施支出中，备份、灾难恢复和数据韧性运营占企业基础设施预算的 10% 至 30%，驱动力包括日益严格的外部合规要求、内部数据留存治理，以及抵御勒索软件和恶意 AI 智能体破坏的必要性。


              但要界定 Eon 的可服务市场，必须先划清严格的品类边界，并把同名企业拆分开来。Eon 的主要目标市场（法定实体 Eon.io, Inc.）包括云备份态势管理（CBPM）、自主云数据保护，以及
              AWS、Microsoft Azure 和 Google Cloud 环境中的企业备份转 AI 数据激活。该品类明确涵盖自主发现、分类、策略分配、去重二级存储，以及可用 SQL
              查询的快照激活；相反，它不包括同名实体对应的无关市场，例如欧洲电力公用事业网络（E.ON SE）、二叠纪盆地上游油气生产（EON Resources Inc. / EONR）、空间载荷光学（EON Space
              Labs）和纺织品数字产品护照（EON Product Cloud）。在企业软件中，现状替代方案包括传统设备型备份软件、超大规模云厂商原生快照工具，以及手动灾难恢复操作手册。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
      - number: '2.2'
        title: 多视角市场测算与受约束的机会层级
        blocks:
          - type: paragraph
            body: >
              测算 Eon 的市场机会，需要把自上而下的宏观云基础设施预测拆解成可服务工作负载预算和现实的服务边界。行业自上而下估计，到 2034 年全球基础设施支出将接近 $838 billion，截至 2024
              年全球云支出已超过 $679 billion。按照企业 IT 预算分配基准，假设云基础设施预算的 10% 至 30% 用于数据备份、留存和韧性运营，则全球企业云部署对应的理论总可用市场（TAM）约为 $68
              billion 至 $204 billion。


              不过，Eon 的可服务市场（SAM）受限于这样一类组织：它们在 AWS、Azure 和 Google Cloud 上管理复杂的云环境，存储规模从多 TB 到
              PB，需要自动化备份态势管理和快速的记录级恢复。可获取市场（SOM）还受到企业采用周期、云安全审计流程以及先在高风险生产工作负载中部署等因素限制。严谨的尽调不会把市场规模当作一个不受约束的单一估值，而是从基础设施、合规和工作负载等不同维度建模这些市场层级，同时保留对可验证的自下而上合同规模和经常性净留存率的疑问。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
