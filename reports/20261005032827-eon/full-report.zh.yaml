      - number: '2.3'
        title: 买方分层、预算归属与采用驱动因素
        blocks:
          - type: paragraph
            body: >
              企业采购自主云备份和数据态势解决方案时，会牵涉安全、云基础设施和数据工程等多个高管利益相关方。主要经济买方通常是首席信息安全官（CISO）或云基础设施副总裁，他们的预算由监管合规审计、业务连续性义务和网络保险承保标准驱动。企业数据架构师和机器学习平台负责人则是次级受益者，他们希望直接用
              Parquet、Apache Iceberg 等开放格式查询备份快照，从而摆脱脆弱的 ETL 流程。


              加速平台采用的主要增长动力包括：能够破坏企业数据存储的自主 AI
              智能体日益普及、严格的监管留存要求，以及备份保管库、运营数据湖和灾难恢复层之间重复存储带来的成本压力。反过来，采用约束依然明显：企业切换惯性、对只读云 IAM
              角色的严格供应商风险评估、多云权限审查摩擦，以及组织对备份厂商整合的疑虑，都会拉长采购和技术验证周期。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM010
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 二阶市场变化：从静态保险到可供 AI 查询的二级数据
            body: >-
              传统备份解决方案是被动、未索引的灾难保险，除灾难性宕机外，其经济价值都在下降。Eon 的市场定位取决于能否利用 Iceberg 和 Parquet
              等开放列式格式，把沉睡的二级快照转成实时、可查询的数据湖。若得到广泛采用，目标预算就会从防御性的灾难恢复支出转向进攻性的企业 AI 平台预算。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM012
          - type: callout
            title: 企业发现中的市场边界稀释与实体消歧
            body: >-
              多个知名公私营商业实体都使用“Eon”品牌，业务横跨欧洲电网公用事业、石油开采、空间系统和时尚产品护照，因此市场研究和自动化尽调流程长期面临实体混淆。投资判断必须把 Eon.io, Inc.
              的文件和云数据保护指标，与无关企业的数据隔离开来。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合远不止一批拿到风投的备份厂商。买方可以继续使用超大规模云厂商的原生服务，购买成熟套件，自己组装策略和脚本，或者继续容忍碎片化的备份运营。Eon 自己的对比内容把 Google Cloud Cost
              Management 和若干 FinOps 平台列在 Eon 旁边，但也说明 Eon 解决的是备份和数据保护支出，而不是计算或 Kubernetes 优化。第三方资料把 Veeam、Druva 和 Rubrik
              列为直接替代方案，招聘页面分析还指出 Commvault 和 Cohesity 带来套件化压力。保留的资料池中另有无关的 E.ON 能源和 EON Reality
              材料；这些是身份碰撞，不是竞争对手，应从运营竞争版图中排除。
            claimRefs:
              - CP003
              - CP005
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP011
              - CP016
      - number: '3.2'
        title: 能力与定位
        blocks:
          - type: paragraph
            body: >-
              Eon 的差异化来自一组能力，而不是某个独占功能。公司称，一个只读 IAM 角色就能支持发现和保护，受保护数据则以 Parquet、Iceberg 等开放格式落地，供 AI 使用。其对比页面收窄了这一主张：Eon
              不优化计算、GKE 或一般基础设施支出。这一边界很关键，因为云原生服务掌握默认分发，成熟套件覆盖混合云环境和更广泛的安全需求。因此，Eon
              最适合重视多云可见性、细粒度访问和数据激活的云优先组织；现有证据并未通过独立基准证明它在恢复、安全或经济性上更优。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
