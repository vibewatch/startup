  - id: FP001
    title: 序位定位：跨云广度与备份数据激活
    type: quadrant
    summary: 分析师序位评分（1 为低，5 为高）展示六类解决方案有证据支持的方向，而非实测基准。
    data:
      points:
        - label: Eon
          x: 4
          'y': 5
          detail: 跨云覆盖和开放格式数据激活属于公司口径；没有独立测试。
        - label: 超大规模云厂商原生备份
          x: 2
          'y': 2
          detail: 原生分发能力强，但现有证据无法证明其具备广泛的跨云控制或数据激活能力。
        - label: 成熟备份套件
          x: 5
          'y': 3
          detail: 二手资料称其套件广泛且支持混合态势；但未经直接功能对等测试。
        - label: 云网络韧性厂商
          x: 4
          'y': 3
          detail: 已点名的直接替代方案，但现有证据无法确定其确切广度和激活能力。
        - label: 内部构建
          x: 3
          'y': 4
          detail: 可能更灵活，但实施深度、成本和可靠性取决于客户。
        - label: 相邻 FinOps 工具
          x: 4
          'y': 1
          detail: 广泛的云成本可见性可以跨云覆盖，但这些工具无法替代备份保护。
    approximationNotes: 评分是分析师根据保留的功能证据作出的序位判断，不代表市场份额、性能、价格或独立基准测试结果。
    claimRefs:
      - CP015
  - id: FI001
    title: Eon 自主数据变现流程
    type: flow
    summary: 可视化展示客户云基础设施活动如何转化为平台收入和运营毛利。
    data:
      nodes:
        - id: cloud-estate
          label: 企业云资产
          description: 客户 AWS、Azure 和 GCP 数据资产通过单一只读 IAM 角色接入
        - id: data-discovery
          label: 自主发现与索引
          description: 持续分类和增量捕获使存储量最多减少 50%
        - id: core-subscription
          label: 核心保护收入
          description: 按受保护容量和账户规模分层的经常性软件订阅
        - id: eon-mind
          label: Eon Mind AI 上下文化
          description: 将备份存储库转换为供 AI 代理查询的 Parquet/Iceberg 表
        - id: expansion-arr
          label: 平台扩张 ARR
          description: 高毛利分析与语义查询变现，推动净留存
        - id: gross-profit
          label: 运营毛利
          description: 扣除云计算和索引托管成本后实现的软件毛利率
      edges:
        - from: cloud-estate
          to: data-discovery
          label: IAM 连接
        - from: data-discovery
          to: core-subscription
          label: 按容量授权
        - from: data-discovery
          to: eon-mind
          label: 数据湖激活
        - from: core-subscription
          to: expansion-arr
          label: 账户交叉销售
        - from: eon-mind
          to: expansion-arr
          label: 上下文使用
        - from: expansion-arr
          to: gross-profit
          label: 利润流
    approximationNotes: 流程结构综合自已披露的产品架构和 SaaS 变现模型；具体美元转化利润率尚未验证。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层功能堆栈展示 Eon 从云提供商发现到 AI 上下文交付的数据流。
    data:
      layers:
        - label: 消费者 AI 与分析层
          detail: 外部 LLM、Claude、Gemini、Databricks 和 BI 应用
        - label: 上下文与语义引擎
          detail: Eon Mind 实时上下文引擎和自我改进的代理任务路由器
        - label: 开放数据转换层
          detail: 自动以 zero-ETL 方式转换为 Apache Iceberg 和 Parquet 格式
        - label: 存储与去重备份库
          detail: 不可变的隔离二级备份库，持续执行去重
        - label: 云摄入与扫描
          detail: 自动发现资源、分类载荷并检查漂移
        - label: 云 IAM 认证
          detail: 单一只读 IAM 角色扫描 AWS、Azure 和 Google Cloud 环境
    approximationNotes: 基于 Eon 官方架构披露的概念性功能分层图。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 企业客户旅程与扩张闭环
    type: journey-map
    summary: 可视化展示企业从只读态势发现，到降本和 zero-ETL AI 数据激活的采用生命周期。
    data:
      items:
        - label: 1. 态势发现
          detail: 接入只读 IAM 角色，自动发现未受管控的云备份资产
          unit: Onboarding Stage
          risk: Initial cloud permission and security audit reviews
        - label: 2. 自主保护
          detail: 无需部署主机代理，自动分配策略并安排备份
          unit: Deployment Stage
          risk: Integration hurdles across heterogeneous multi-cloud accounts
        - label: 3. 存储优化
          detail: 执行全局去重和压缩，实现 30% 至 50% 的成本节省
          unit: Optimization Stage
          risk: Variable savings dependent on customer snapshot duplication ratios
        - label: 4. 快速韧性恢复
          detail: 实现 15 分钟 RTO，并针对勒索软件支持细粒度记录级回滚
          unit: Resilience Stage
          risk: Restore process constraints requiring dedicated network environments
        - label: 5. Zero-ETL AI 激活
          detail: 将二级备份快照转换为可查询的 Parquet/Iceberg 数据湖
          unit: Expansion Stage
          risk: Data governance and access boundaries between IT and AI teams
        - label: 6. 市场扩张
          detail: 消耗超大规模云厂商市场承诺，并扩展至各云资产
          unit: Commercial Stage
          risk: Enterprise contract renegotiation and multi-year commitment inertia
    approximationNotes: 代表公司技术和管理层披露中描述的标准产品驱动客户采用与扩张生命周期。
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU006
      - CU011
      - CU013
  - id: FR001
    title: 企业风险热力图
    type: matrix
    summary: 评估矩阵映射运营、合规、依赖和技术等核心风险类别的可能性与影响。
    data:
      columns:
        - 运营威胁
        - 监管要求
        - 云依赖
        - 估值与资本
        - 消歧暴露
        - 生态集成
      rows:
        - label: 灾难性影响
          values:
            - 备份库遭攻陷
            - FedRAMP 市场排除
            - 超大规模云厂商费用变动
            - 估值倍数压缩
            - 监管行动错误归因
            - 核心 API 弃用
        - label: 严重影响
          values:
            - 恢复延迟扩大
            - GDPR 监管调查
            - 伙伴生态流失
            - 现金消耗率加速
            - 资本市场标识符漂移
            - 安全套件不兼容
        - label: 中等影响
          values:
            - 合成基准漂移
            - 审计文档缺口
            - API 速率限制
            - 资本结构表流动性摩擦
            - 行业基准混淆
            - 遥测数据外泄误报
    approximationNotes: 该矩阵按运营影响阈值和结构性缓解措施对风险严重程度分类。
    claimRefs:
      - CR004
      - CR002
      - CR009
      - CR012
