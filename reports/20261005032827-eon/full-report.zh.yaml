      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              核心护城河问题在于：当超大规模云厂商和套件厂商拓展邻近功能后，Eon 的自动化和备份数据激活是否仍有差异化。Simplify 的分析称，Eon 依赖云厂商
              API，而成熟厂商可以通过更广泛的套件挤压独立预算。Checkthat
              的资料同样认为，成熟厂商在混合基础设施和集成能力上占优。这些是有价值的反向信号，但不是独立基准：一个来自公司招聘信息的转载，另一个是方法论有限且未署名的资料。因此，在把产品广度或切换成本视为持久优势前，投资判断还需要客户层面的输赢数据、续约和扩张证据、迁移工作量、实际定价以及受控恢复测试。在此之前，分发能力和功能快速趋同仍是可信的替代风险。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP013
              - CP015
