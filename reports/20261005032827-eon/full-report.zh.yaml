      - number: '3.3'
        title: 定价、市场进入与切换
        blocks:
          - type: paragraph
            body: >-
              在这组比较中，定价透明度是一个明显弱项。Eon 自己的页面称没有公开价目表，并描述了按 GB
              计费的模式；第三方资料则把它定义为定制报价的企业定价。两类来源都没有披露价目表、最低承诺、实际折扣或成熟厂商的可比价格。当前企业客户经理招聘信息要求负责获客、复杂谈判和完整销售周期，这支持一种销售驱动的企业模式，而非自助式采用。另一份资料认为，跨多云的按使用量计费集成可能制造切换成本，但现有合同或客户迁移研究都没有量化锁定效应、多归属摩擦或实施成本。
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
