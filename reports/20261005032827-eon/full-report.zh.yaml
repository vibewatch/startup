  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 自主架构与存储基础
        blocks:
          - type: paragraph
            body: >-
              Eon 的核心产品是自主云数据保护，让企业数据管理摆脱笨重的硬件或虚拟设备模式，转向云原生二级存储。Eon 不要求客户环境部署内联代理或专有存储设备，而是通过单个只读 IAM
              角色建立连接。认证后，系统会跨云账户自动发现资源并分类数据，检查实际内容，而不是只依赖云厂商标签（CE001、CE002）。底层工程架构把持续增量快照捕获与跨账户云原生去重结合起来，压低重复快照成本（CE003）。为抵御企业威胁——包括复杂勒索软件和自主
              AI 智能体未经授权的数据篡改——捕获的记录存放在不可变、隔离的保管库中，支持细粒度的时间点回滚，无需重建整个环境镜像（CE004、CE005）。除被动恢复外，Eon 还能自动把原始快照转换为 Apache
              Iceberg、Apache Parquet 等开放表格式，为零 ETL 分析查询释放二级数据储备（CE006）。运营模式对比显示，这种无代理架构与传统设备部署截然不同。
