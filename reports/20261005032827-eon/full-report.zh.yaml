      - number: '1.3'
        title: 资本化历程、投资人阵容与稀释分析
        blocks:
          - type: paragraph
            body: >-
              2024 年 1 月至 2025 年 12 月，Eon 在企业基础设施史上完成了最快的风险投资跃升之一，通过五轮融资累计获得约 $500M 股权融资 [CO012, CO013]。公司于 2024 年 10
              月结束隐身阶段，当时累计融资 $127M，包括 Sequoia Capital 领投的 $20M 种子轮、Lightspeed Venture Partners 领投的 $30M A 轮，以及 Greenoaks
              Capital Partners 领投、投后估值 $750M 的 $77M B 轮 [CO009, CO013]。2024 年 11 月，BOND 领投 $70M C 轮，投后估值达到 $1.4B
              [CO013]。最近一次融资发生于 2025 年 12 月 2 日：投资人 Elad Gil（Gil Capital）领投 $300M D 轮，使 Eon 估值翻至 $4.0B；此前各轮领投方
              Sequoia、Lightspeed、Greenoaks 和 BOND 继续参与，Affinity、Vine Ventures、Meron Capital 及 Eight Roads 也参与了老股交易
              [CO012, CO013, CO014]。尽管资本化规模可观、投资人阵容顶尖，Eon 仍未公开披露年经常性收入（ARR）、净留存率（NRR）、毛利率或烧钱速度，导致其 $4.0B
              投后估值倍数及清算瀑布结构对未获认证的公开市场观察者而言仍不透明 [CO015, CO016]。
            claimRefs:
