      - number: '7.3'
        title: 超大规模云平台依赖、资本密集度与治理边界
        blocks:
          - type: paragraph
            body: >-
              Eon 的架构基础与底层超大规模云厂商——Amazon Web Services、Microsoft Azure 和 Google Cloud
              Platform——不可分割地耦合在一起。整个发现和备份摄取流水线依靠只读云 IAM 角色运行，因此服务容易受到供应商 API
              配额变化、身份策略弃用、出口费用结构变化或竞争性云原生备份增强的影响。除技术平台集中度外，战略生态合作和与股权挂钩的商业安排，也可能在竞争性企业客户中引发治理及利益冲突问题。从财务角度看，运营一个持续去重、零
              ETL
              数据转换的托管二级存储网络，需要持续投入大量资本支出和计算资源。尽管顶级风险投资支持推动私人市场估值迅速上升，但缺乏关于年经常性收入、净收入留存率和毛利率的公开披露，仍让投资判断充满不确定性。如果基础设施增长快于扩张收入，资本密集型运营模式叠加宏观经济对企业
              IT 预算的压力，可能压缩经营利润率。与此同时，欧洲公用事业 E.ON SE 等同名企业的公开披露显示，其资本承诺达到数十亿欧元、盈利对多项因素敏感，这也说明绝不能混淆使用 Eon 名称的不同企业的财务画像。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
