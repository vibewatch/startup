chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与自动驾驶架构
        blocks:
          - type: paragraph
            body: >-
              Eon（于 2024 年 1 月 2 日在特拉华州注册成立，法定实体为 EON IO, INC.）在纽约市第五大道 245 号设有双总部，并在以色列特拉维夫设有研发设施 [CO001,
              CO002]。公司成立的初衷，是解决企业云备份态势中的关键架构漏洞 [CO003]。传统云备份长期以来都是静态、昂贵且不透明的冷存储孤岛，恢复往往需要数天，同时还在彼此割裂的企业环境中产生巨额存储成本
              [CO004, CO005]。Eon 打造了其定义为首个云备份态势管理（CBPM）平台和自主数据基础设施的产品 [CO005, CO006]。平台通过单个只读 IAM 角色连接 Amazon Web
              Services（AWS）、Microsoft Azure 和 Google Cloud Platform 上的客户云环境，无需软件代理或专用硬件设备 [CO005, CO007]。Eon
              持续发现、分类并去重存储对象，将其转换为 Apache Parquet、Apache Iceberg 等开放文件格式；公司称，这能将云备份存储支出降低 30% 至 50%，同时把此前无法访问的数据集变成企业生成式
              AI 和商业智能应用可查询的上下文 [CO005, CO008]。
            claimRefs:
              - CO001
