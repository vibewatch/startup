  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、合规与数据治理暴露
        blocks:
          - type: paragraph
            body: >-
              企业采用自主云备份态势管理和 AI 就绪数据基础设施平台，需要应对严格的国际数据隐私制度和安全合规框架。在 AWS、Microsoft Azure 和 Google Cloud 等多云环境部署 Eon
              的组织，必须遵守 HIPAA、PCI DSS、ISO 27001 和 SOC 2 Type II
              等强制合规要求；这些要求严格规定了事件处理记录、及时的泄露通知流程和持续的策略执行。一个关键监管瓶颈仍是公共部门及敏感企业工作负载所需的正式认证和授权：商业组织可以利用 Eon
              的持续发现与分类机制，但公共部门环境需要 FedRAMP 等经过验证的授权。此外，不断演进的 AI
              治理框架和全球数据主权规则，严格限制跨境数据复制以及从运营备份中摄取训练数据。若不能持续验证数据驻留位置和细粒度回滚能力，企业客户在强制审计期间就可能面临重大监管处罚和合规失败。最后，EON Resources
              等无关同名企业的公开文件表明，监管申报往往要求围绕数十项不同风险因素进行广泛披露。
            claimRefs:
              - CR001
              - CR002
