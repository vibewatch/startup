      - number: '1.2'
        title: 创始人、高管团队与治理架构
        blocks:
          - type: paragraph
            body: >-
              Eon 由连续创业的企业云基础设施创业者 Ofir Ehrlich（CEO）、Gonen Stein（总裁）和 Ron Kimchi（CTO）构想并创立 [CO003,
              CO009]。三位联合创始人此前共同打造灾难恢复软件初创公司 CloudEndure；Amazon 于 2019 年以约 $250M 收购该公司，并据此成立 AWS Disaster Recovery and
              Migration Services [CO009]。他们在 AWS 运营大规模恢复流水线的直接经验，暴露出现代云架构中的严重配置漂移、勒索软件恢复延迟和可见性缺口，直接塑造了 Eon 的产品逻辑 [CO009,
              CO010]。高管团队还包括首席战略官 Moshe Milman，他带来企业级市场进入和战略定位经验 [CO011]。这支管理团队在分布式存储与恢复系统领域展现出极强的创始人与市场匹配度，但 Eon
              的架构愿景以及纽约、特拉维夫两地顶尖工程人才招聘，仍高度依赖三位创始人这一关键人物组合 [CO003, CO009]。
            claimRefs:
              - CO003
