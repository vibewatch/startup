      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 控制平面 IAM 爆炸半径
            body: 现代云勒索软件攻击利用了这一事实：云原生快照和备份往往与生产工作负载处于相同的身份边界内。如果企业 IAM 角色被攻破，攻击者就能在引爆载荷前系统性地禁用备份、删除恢复点或污染二级保管库。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
          - type: callout
            title: 合成基准的保真度局限
            body: Era by Eon 等无需参考数据的合成数据平台可以在不暴露机密记录的情况下开展多系统企业基准测试，但技术披露证实，合成数据无法完整复现真实生产环境中的细微差异、人为歧义和边界错误。
            calloutType: assumption
            claimRefs:
              - CR007
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Eon 是近年成立、增长最快的企业基础设施软件初创公司之一；开始商业运营仅 23 个月后，公司就在 2025 年 12 月达到 $4.0B 的标志性估值。核心投资逻辑建立在连续创业者履历和品类扩张之上：CEO
              Ofir Ehrlich、总裁 Gonen Stein 和 CTO Ron Kimchi 此前共同打造了被 AWS 收购的灾难恢复引擎
              CloudEndure，并设计云备份态势管理（CBPM），把静态、沉睡的备份转成 Parquet、Iceberg 等开放格式的活跃可查询数据湖。


              与这一势头相抵的是经营指标完全没有披露。SoFi 等企业买方报告数据准备时间提速超过 90%，证明架构具有实用性；但 Eon 仍拒绝披露年经常性收入、订阅收入运行率、净留存率或毛利率。在累计融资
              $497M–$500M、估值 $4.0B 的情况下，对 Eon 做投资判断需要采用投机性的收入假设，与 Rubrik 等公开市场可比公司的情况明显不同。我们给出“观察”建议，置信度为中，估值判断为偏高。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
