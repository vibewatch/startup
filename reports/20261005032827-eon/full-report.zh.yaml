        title: 客户分层、买方画像与企业工作负载
        blocks:
          - type: paragraph
            body: >
              Eon 的企业客户包括云优先企业、受监管行业组织，以及在 Amazon Web Services（AWS）、Microsoft Azure 和 Google Cloud
              Platform（GCP）上管理多云环境的数据密集型 AI 团队。典型企业云环境会在备份保管库、快照和灾难恢复层积累数百 TB 至 PB 的二级存储，并经常出现明显的运营漂移和快照泛滥。部署单个只读 IAM
              角色后，Eon 就能处理这些工作负载，自动发现、分类并管理去重后的二级存储，无需部署具有干扰性的备份代理或设备硬件。


              目标客户的采购委员会由不同职能买方和预算负责人组成。首席信息安全官（CISO）和云基础设施副总裁是主要经济买方，他们受到勒索软件恢复要求、合规审计以及防止恶意 AI
              智能体破坏企业数据存储的需求驱动。同时，基础设施和云运营总监优先考虑恢复点目标（RPO）及运营简洁性；首席数据官和 AI 平台团队则越来越像内部客户，希望把沉睡的备份快照直接作为采用
              Parquet、Iceberg 等开放标准的零 ETL 数据湖来查询。
