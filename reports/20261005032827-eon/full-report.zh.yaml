              - CV014
      - number: '8.2'
        title: 资本结构与可比基准
        blocks:
          - type: paragraph
            body: >
              2024 年 1 月至 2025 年 12 月，Eon 快速完成四轮机构股权融资：$20M 种子轮、$30M A 轮、估值 $750M 的 $77M B 轮，以及 Elad Gil 领投、估值 $4.0B 且
              Sequoia、Lightspeed、Greenoaks 和 BOND 回归参与的 $300M D 轮。顶级一级投资人的信心由此可见，但老股交易市场定价仍缺乏流动性和锚点：Forge Global
              报告订单流无法匹配，没有公开 Forge Price 或交易，表明私人市场价格发现完全关闭。


              将 Eon 与成熟的企业数据管理可比公司对照，会发现估值严重偏离。Rubrik 的远期订阅收入倍数约为 7x 至 9x，透明毛利率高于 75%。如果 Eon 到 2025 年底的年化运行率收入估计为 $40M 至
              $60M，那么 $4.0B 估值对应的收入倍数将超过 65x 至 100x。此外，私人市场聚合平台和搜索引擎存在严重的实体消歧错误，把 Eon（eon.io）与欧洲能源公用事业 E.ON SE、医疗健康创投
              EonHealth 以及卫星运输初创公司 EON（Endeavor Optical Networks）混为一谈；后者于 2026 年 8 月完成种子轮。这些噪音进一步说明，投资判断前必须严格核验数据室材料。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.3'
        title: 情景分析、反向逻辑与尽调要求
        blocks:
          - type: paragraph
            body: >
              我们的乐观、基准和悲观情景显示，在倍数压缩下，下行风险并不对称。在乐观情景（概率 15%）中，Eon 成为企业 AI 事实上的自主数据层，到 2027 年 ARR 超过 $150M，同时为超大规模云工作负载保持
              50% 的存储基础设施节省，支撑 $6.0B 至 $8.0B 的战略退出。在基准情景（概率 50%）中，Eon 保持快速的两位数增长，但估值倍数回归至 ARR 的 15x–20x，企业价值持平，普通股权大幅稀释。


              在悲观情景（概率 35%）中，AWS、Azure 和 Google Cloud 的原生云态势工具，加上 Rubrik、Druva 和 Veeam 的成熟平台扩展，会压缩 Eon 的定价权。如果 Eon 的实际
              ARR 低于 $25M，下轮降价融资或结构化资本重组将触发对已融资 $497M 的严重优先权压力。关键逻辑破坏触发因素包括客户新增停滞、主要云厂商让合作伙伴失去中介地位，或 CloudEndure
              创始团队中的高管离职。在投入资本前，必须补上经审计 ARR 和清算优先权的证据缺口。
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV014
              - CV015
