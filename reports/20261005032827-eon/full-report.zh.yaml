        - $6.0B - $8.0B
        - 1.5x - 2.0x 回报；成功 IPO 或被超大规模云厂商战略收购
      - - 基准情景
        - 50%
        - ARR 稳健增长至 $60M-$80M；二级市场倍数从 >65x 压缩至 20x-25x
        - $2.5B - $3.5B
        - 账面回报持平至 -35%；普通股面临显著的优先权悬压
      - - 悲观情景
        - 35%
        - ARR 停滞在 $30M 以下；超大规模云厂商的定价压力和高额现金消耗迫使公司重组资本
        - $1.0B - $1.8B
        - '-55% 至 -75% 损失；次级股权受损；可能进行结构化下轮融资'
    notes: 情景基于企业基础设施可比收入倍数，对 2026-2028 年退出期限建模。
    claimRefs:
      - CV001
      - CV007
      - CV012
      - CV013
      - CV015
