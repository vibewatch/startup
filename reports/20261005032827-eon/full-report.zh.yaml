      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 建议提示：为何不应买入
            body: >-
              尽管创始人履历出色、风险投资支持顶级，但在没有经核实财务数据的情况下，以 $4.0B 估值给 Eon 买入建议，会违背核心投资判断纪律。投资者应继续观察该资产，直到能在正式数据室中核验经审计的 ARR
              和股权结构表优先权。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV011
          - type: callout
            title: 老股交易市场流动性与优先权警示
            body: 不到 24 个月内，公司分五轮累计融资 $497M 至 $500M 的优先股资本；后期投资人很可能持有优先清算权。因此，退出估值低于 $2.0B 时，普通股股东和二级市场买方的权益都可能归零。
            calloutType: risk
            claimRefs:
              - CV001
