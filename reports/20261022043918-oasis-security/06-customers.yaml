artifact: customers
slug: oasis-security
runDate: 2026-10-22
company:
  name: Oasis Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports enterprise demand and several concrete security or
    operational outcomes, but only JLL is named in the retained customer proof and
    several other results are anonymous company claims. Active-customer count,
    production-versus-pilot status, retention, expansion, and concentration remain
    undisclosed, limiting confidence in commercial durability.
sections:
  - id: customer-segments-and-jobs
    title: Enterprise buyers, users, and adoption surfaces
    body: >-
      Oasis is positioned for large enterprises whose security, identity, and
      engineering teams must govern service accounts, secrets, API keys, certificates,
      and AI agents across hybrid environments. The buyer is most plausibly the CISO
      organization or identity-security leadership, while identity operations,
      cloud-security teams, application owners, and developers are the day-to-day
      users required to assign ownership and execute lifecycle actions. Company
      materials span IaaS, SaaS, PaaS, and on-premises systems and name major identity
      providers, vaults, data platforms, developer systems, and AI applications. This
      breadth supports a cross-environment enterprise workflow, but it does not reveal
      customer mix by geography, vertical, company size, or revenue band. Independent
      directory coverage likewise describes an enterprise non-human-identity focus
      rather than a quantified segment distribution.
    claimRefs: [CU001, CU002, CU011]
    tableRefs: [TU001]
  - id: adoption-and-reference-quality
    title: Adoption evidence is concrete but selectively disclosed
    body: >-
      The strongest named proof is a 2024 JLL testimonial in an Oasis-issued release:
      JLL's head of identity security said the product improved visibility, lifecycle
      automation, security, and governance. The current homepage adds four outcome
      examples, including avoided regulatory exposure, lower secret-rotation effort,
      outage containment, and attack-surface reduction. Those examples show relevant
      enterprise pain and measurable value, yet the customers are unnamed and one
      result is explicitly described as occurring during a proof of value. The evidence
      therefore establishes use-case resonance more strongly than repeatable,
      production-scale adoption. A Wiz integration page provides partner-issued proof
      that joint customers can connect cloud findings to identity remediation, but it
      reports no deployment count, realized customer outcome, or commercial channel
      contribution.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-transition
    title: Durability and concentration remain private as ownership changes
    body: >-
      The retained public evidence does not disclose an active-customer count, NRR,
      GRR, churn, renewal rates, contract duration, cohort behavior, expansion revenue,
      or top-customer concentration. These are not merely missing dashboard metrics:
      without them, investors cannot distinguish broad logo acquisition from durable
      production use or test whether a small number of enterprises or partners drives
      revenue. An independent identity review describes Oasis as best suited to
      enterprises seeking lifecycle and rotation workflows, but also flags opaque
      pricing, sales-led procurement, and proof-of-value onboarding. The pending Cyera
      transaction introduces another durability variable. Oasis promises continuity
      for customers, team, platform, and roadmap, while independent coverage notes that
      only a letter of intent existed and that post-acquisition integration depth and
      vendor lock-in remain execution questions.
    claimRefs: [CU010, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
