      - ["F300 CPG company (unnamed)", "Consumer packaged goods", "Attack-surface reduction", "POV", "60% reduction in days", "Pilot-stage claim; no conversion or sustained outcome disclosed"]
    notes: "Sample of the customer proof retained for this chapter; only JLL is named, so the enumeration is not a complete customer list."
    enumerationScope:
      coverage: sample
      basis: "Publicly retained named and anonymous customer outcome evidence available on 2026-10-22."
    claimRefs: [CU003, CU004, CU006, CU007, CU008]
