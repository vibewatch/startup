      - ["Outage containment", "Affected 50% of production workloads", "Accessed 2026-10-22", "Oasis", "Low-medium", "Anonymous F500 insurer; prevented loss and observation period absent"]
      - ["Attack-surface reduction", "60% in days", "Accessed 2026-10-22", "Oasis", "Low-medium", "Anonymous F300 CPG company and explicitly during POV, not confirmed production"]
