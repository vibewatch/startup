company:
  name: Oasis Security
chapter:
  number: 1
  title: Company Overview
  summary: Oasis Security was founded in 2022 to govern non-human identities and was acquired by Cyera in a transaction announced as completed on September 3, 2026. Public evidence supports the company's product scope, funding history, leadership, and post-acquisition transition, but current operating metrics, deal structure, and customer-contract terms remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating model
    body: >-
      Oasis Security was founded in 2022 and built a cybersecurity platform for
      non-human identities, including service accounts, API keys, secrets, and
      AI agents. The available evidence describes a lifecycle-oriented product:
      discovery and inventory, ownership attribution, posture monitoring,
      governance, rotation, remediation, and decommissioning across cloud, SaaS,
      and on-premises environments. A Wiz integration describes the operating
      workflow more concretely by correlating cloud issues and data-security
      findings with identity privilege, usage, and ownership before teams take
      actions such as attestation, key rotation, right-sizing, or
      decommissioning. Independent review evidence characterizes Oasis as
      complementary to an existing identity provider and secrets manager rather
      than a replacement for human SSO or MFA. Pricing is not public, so the
      commercial model and current revenue remain diligence gaps.
    claimRefs:
      - CO001
      - CO002
      - CO008
      - CO009
      - CO012
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: leadership-and-stakeholders
    title: Leadership, governance, and stakeholder map
    body: >-
      Danny Brickman is identified as co-founder and CEO in the retained
      company-profile evidence, while Cyera's completion announcement names Amit
      Zimerman as CTO of Cyera Identity and describes Brickman as Oasis's
      co-founder and CEO. The acquisition therefore creates a material
      key-person and integration question: the public materials support
      continuity messaging but do not specify Brickman's formal post-close title
      or the full governance structure inside Cyera. Cyera is the controlling
      strategic stakeholder after closing; prior investors remain relevant to
      capitalization and incentives, while the Wiz partnership illustrates the
      ecosystem route by which Oasis connected identity context to cloud-risk
      workflows. Enterprise customers are the most exposed operating
      stakeholders because pricing, contract terms, support continuity, and
      integration timing were not published in the retained sources.
    claimRefs:
      - CO007
      - CO011
      - CO015
      - CO017
    tableRefs:
      - TO002
      - TO003
  - id: financing-and-milestones
    title: Financing, acquisition, and remaining diligence
    body: >-
      Tracxn reports $195 million of total funding across three rounds, a Series
      B on March 20, 2026, and 146 employees as of September 30, 2026; an
      independent company profile separately reports a $40 million Series A in
      2024. These sources establish a financing and scale trajectory but do not
      disclose Oasis revenue, ARR, gross margin, burn, runway, or customer
      count. The July 28 letter of intent was described by a secondary report as
      approximately $1 billion and mostly cash, while Cyera's September 3
      announcement confirms completion and a $1 billion deal value; the
      transaction structure is still not disclosed by the retained primary
      announcement. The post-close rebrand to Cyera Identity is clear, but
      contract migration, pricing, and the depth and timing of technical
      integration remain open questions. The timeline separates dated facts from
      unresolved diligence items rather than treating a funding total as cash
      available or a deal value as a valuation of current operations.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
      - CO010
      - CO013
      - CO014
    tableRefs: []
    figureRefs: []
