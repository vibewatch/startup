schemaVersion: "report-v2"
artifact: market-analysis
slug: oasis-security
runDate: 2026-10-22
company:
  name: Oasis Security
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Oasis addresses the enterprise non-human identity lifecycle, a security category
    broadened by AI agents but narrower than human IAM, secrets management, and cloud
    security. Public evidence supports strong problem intensity and enterprise interest,
    but not a defensible dollar TAM, SAM, or standalone obtainable-market estimate.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable boundary is enterprise non-human identity governance: discovering
      service accounts, secrets, tokens, certificates, bots, and AI agents; assigning
      ownership; evaluating privilege and use; and executing lifecycle actions such as
      attestation, rotation, right-sizing, and decommissioning. Oasis spans cloud, SaaS,
      and on-premises environments, but it is not a human identity provider and does not
      replace SSO or MFA. It also sits beside, rather than wholly replacing, secrets
      managers, conventional IAM/PAM, cloud-security posture tools, and internal scripts.
      That boundary makes the category strategically important without treating all
      identity-security or cloud-security spend as addressable revenue for Oasis.
    claimRefs: [CM001, CM002, CM003, CM006, CM007]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      No retained source provides a transparent dollar TAM, SAM, or SOM with geography,
      denominator, and methodology. The best public sizing lenses are therefore operating
      proxies, not market values. A March 2026 article relayed Palo Alto Networks' estimate
      that machine identities outnumber people 82 to 1, while an Oasis-issued January 2024
      release claimed 50 to 1. The difference may reflect timing, scope, or methodology,
      none of which is disclosed well enough to reconcile. Tracxn's 47 active competitors,
      10 funded competitors, and three exits indicate a populated category, while the
      reported acquisition letter of intent shows strategic demand but cannot be converted
      into recurring market spend.
    claimRefs: [CM004, CM005, CM014, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The core buying coalition is likely led by security leadership and identity-security
      owners, with cloud-security, IAM/PAM, platform engineering, DevOps, and AI-platform
      teams supplying deployment context and bearing workflow disruption. Wiz's integration
      description shows why a cross-functional sale is required: privilege, data
      sensitivity, usage, and ownership must be correlated before a team can rotate or
      right-size a machine credential without breaking production. Oasis has claimed broad
      enterprise traction, including a majority-Fortune-500 customer mix and mostly
      multi-year new revenue. Those signals support enterprise willingness to pay, but they
      do not reveal seat, identity, workload, or platform budgets.
    claimRefs: [CM006, CM007, CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Adoption is driven by the proliferation of autonomous agents and machine credentials,
      the inadequacy of human-centric access controls, and the operational need to move
      from inventory to safe remediation. Constraints are equally material: Start With
      Identity describes opaque pricing, a sales-led proof-of-value process, SaaS-only
      deployment, dependence on existing IdP and secrets tooling, and an early market whose
      integrations are still expanding. A reported fivefold increase in new annual
      recurring revenue is directional evidence of demand, not ARR, market growth, or cash
      generation. The approximately $1 billion acquisition letter of intent indicates
      strategic scarcity, but it was not closed in the cited reports and is not a market
      multiple or standalone valuation proof.
    claimRefs: [CM003, CM008, CM009, CM011, CM015, CM016]
tables:
  - id: TM001
    title: Market definition and adjacency boundary
    columns:
      - Segment or category
      - Included spend or workflow
      - Excluded or adjacent spend
      - Buyer or payer
      - Relevance to Oasis
    rows:
      - - Core non-human identity lifecycle
        - Discovery, ownership, posture, attestation, rotation, right-sizing, and decommissioning
        - Human workforce authentication and directory administration
        - CISO, identity security, IAM/PAM
        - Direct addressable workflow
      - - AI-agent access governance
        - Agent credentials, permissions, behavioral context, audit trails, and task-scoped access
        - Model development, inference infrastructure, and general AI observability
        - CISO, AI platform owner, application security
        - Direct emerging use case
      - - Cloud and data-risk correlation
        - Linking exposed data and cloud findings to the machine identity behind access
        - Standalone CSPM, DSPM, vulnerability management, and data classification
        - Cloud security and data security
        - Adjacent workflow reached through integrations
      - - Secrets and identity infrastructure
        - Context needed to govern credentials across existing systems
        - Replacement of IdP, SSO, MFA, or a dedicated secrets manager
        - IAM/PAM, platform engineering, DevOps
        - Substitute and complement rather than full replacement
    notes: >-
      Boundary is synthesized from independent reviews, company-attributed product descriptions,
      and the Wiz partner integration; no source discloses category revenue pools.
    claimRefs: [CM001, CM002, CM003, CM006, CM007]
  - id: TM002
    title: Public sizing and demand lenses
    columns:
      - Publisher
      - Year
      - Geography
      - Value or signal
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - FinTech Global, relaying Palo Alto Networks
        - 2026
        - Global enterprise context
        - "82 machine identities per human identity"
        - null
        - Secondary article quoting an external ratio
        - Medium
        - Population, sample, and identity definition are not disclosed
      - - Oasis Security via Newswire
        - 2024
        - Global enterprise context
        - "50 non-human identities per human identity"
        - null
        - Company-issued market claim
        - Low
        - Company-controlled and not independently benchmarked here
      - - Tracxn
        - 2026
        - Global company database
        - "47 active competitors; 10 funded; 3 exited"
        - null
        - Database classification and ranking
        - Medium
        - Category taxonomy and coverage methodology are not shown
      - - Oasis Security via FinTech Global
        - 2026
        - Company-level enterprise demand
        - "New ARR grew 5x year over year"
        - null
        - Company-reported commercial momentum
        - Low
        - New ARR is not total ARR, revenue, market growth, or cash generation
    notes: >-
      These are non-comparable demand proxies, not a TAM/SAM/SOM calculation; dates,
      denominators, attribution, and methodological limitations are retained.
    claimRefs: [CM004, CM005, CM011, CM014]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Enterprise identity security
        - CISO or identity-security leader
        - Identity governance and security operations
        - Enterprise security organization
        - Inventory, ownership, policy, attestation, and remediation
        - CISO or IAM executive
        - Unknown ownership and excessive machine privilege
      - - Cloud security
        - Cloud-security leader
        - CSPM and incident-response teams
        - Cloud-security program
        - Correlate cloud findings with NHI privilege, use, and blast radius
        - CISO or cloud-security executive
        - Exposed resources or sensitive-data paths
      - - IAM/PAM
        - IAM or PAM leader
        - Identity engineers and access reviewers
        - Identity program
        - Extend governance from human to machine identities
        - CIO, CISO, or identity executive
        - Existing tools cannot govern NHI scale or lifecycle
      - - Platform engineering and DevOps
        - Platform or engineering leader
        - Developers, SREs, and service owners
        - Engineering or shared infrastructure
        - Safe key rotation, right-sizing, and decommissioning
        - CTO or platform executive
        - Credential sprawl with production-change risk
      - - AI platform and application security
        - AI platform owner with security sponsorship
        - Agent builders and application-security teams
        - AI program with security participation
        - Scope and audit agent access to APIs, data, and tools
        - CTO and CISO coalition
        - Production deployment of autonomous agents
    notes: >-
      Roles and budget ownership are analytical mappings from the evidenced workflows;
      no retained source discloses Oasis customer budget allocation by segment.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM012, CM013]
figures:
  - id: FM001
    title: Constrained market-sizing pyramid
    type: pyramid
    summary: >-
      The evidence narrows from broad enterprise identity exposure to Oasis's obtainable
      wedge, but it does not support proportional layer widths or dollar values.
    data:
      items:
        - label: Enterprise identity and access estate
          value: Human plus non-human identities
          detail: Broad context only; not wholly addressable by Oasis.
        - label: Non-human identity population
          value: "50:1 to 82:1 reported ratios"
          detail: Different years and undisclosed methodologies prevent reconciliation.
        - label: Connected identity-system surface
          value: "More than 30 systems"
          detail: Company-stated connectivity reported by TechStartups.
        - label: Lifecycle-governance workflows
          value: Discovery through decommissioning
          detail: Core operational boundary supported by review and partner evidence.
        - label: AI-agent access subset
          value: Agent credentials and permissions
          detail: Emerging use case within the wider NHI estate.
        - label: Oasis obtainable wedge
          value: Not publicly quantified
          detail: Requires pricing, customer, workload, geography, and win-rate data.
    approximationNotes: >-
      Conceptual narrowing only; layer widths are not value-proportional. The 50:1 and
      82:1 ratios come from different years and opaque methodologies, and no retained
      source supplies a defensible TAM, SAM, or SOM in dollars.
    claimRefs: [CM001, CM002, CM004, CM005, CM010, CM014, CM015, CM016]
callouts:
  - calloutType: risk
    title: Dollar market size remains unproven
    body: >-
      Public ratios, commercial momentum, competitor counts, and acquisition interest
      establish problem intensity, not recurring market spend. A bottom-up model needs
      eligible identity counts, pricing, attach rates, geography, and achievable win rates.
    claimRefs: [CM004, CM005, CM008, CM011, CM014, CM015, CM016]
