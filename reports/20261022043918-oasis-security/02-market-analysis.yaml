      topic: identity-prevalence
      missingEvidence: >-
        The population, sampling period, identity definitions, and methodology behind the
        reported 50-to-1 and 82-to-1 ratios.
      whyItMatters: >-
        Unreconciled ratios cannot be used as a denominator for a bottom-up market model or
        as proof of category growth.
      diligencePath: >-
        Request the underlying Palo Alto Networks study and Oasis research methodology,
        normalize identity definitions, and compare like-for-like periods.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budgets
      missingEvidence: >-
        Customer-level budget owner, sales-cycle duration, proof-of-value conversion,
        identity-based pricing, expansion, and renewal data by segment.
      whyItMatters: >-
        Buyer workflow evidence does not establish who ultimately pays, how budgets are
        created, or how much spend Oasis can capture.
      diligencePath: >-
        Review pipeline and cohort data, interview reference customers across IAM, cloud,
        platform, and AI teams, and reconcile contract value with deployed identity counts.
      relatedQuestionRefs: [QM004, QM007]
      relatedTableRefs: [TM003]
