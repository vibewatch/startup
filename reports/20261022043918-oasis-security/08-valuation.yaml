company:
  name: Oasis Security
chapter:
  number: 8
  title: Valuation
  summary: "Oasis Security's reported $1 billion acquisition by Cyera creates a clear strategic exit signal for non-human identity security, but the public record does not disclose ARR, margins, retention, or final transaction terms. The appropriate stance is research-more: strategic value is credible, while price discipline and deal completion remain unresolved."
sections:
  - id: investment-case
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Oasis built a differentiated position in a newly important security
      category and converted that position into strategic value. CRN reports that Cyera agreed
      to acquire Oasis for $1 billion and that Oasis had raised $195 million, while an independent
      review describes the product as unusually operational because it extends beyond inventory
      into ownership, rotation, and decommissioning. The product page supports a broad workflow
      from discovery and context through posture, threat detection, remediation, and lifecycle
      management. This combination supports category relevance and a credible strategic buyer
      rationale, but it does not establish standalone revenue quality or a cash-on-cash return.
      The anti-thesis is that the public price is reported rather than a completed transaction
      consideration, and the product's independent review identifies opaque pricing and an early
      market. A buyer should therefore underwrite strategic scarcity as an option, not as proof
      that the reported headline price is fair.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-and-financing
    title: Financing context and entry discipline
    body: >-
      Public financing evidence establishes a capital and exit frame but not a complete
      valuation bridge. Tracxn records $195 million of total funding across three rounds and
      identifies a March 2026 Series B, while CRN independently reports the $120 million
      Series B and $195 million total. The acquisition reporting places the transaction near
      $1 billion, implying roughly 5.1 times total capital raised, but that ratio is a capital
      multiple, not a revenue multiple and should not be treated as an operating valuation.
      A separate report says the letter of intent is expected to be mostly cash with the
      remainder in Cyera shares; because the deal was not closed in that account, liquidity,
      consideration mix, preferences, escrow, earn-outs, and employee rollover remain open.
      The evidence therefore supports entry discipline based on verified closing terms and
      operating metrics rather than a precise public mark. The missing ARR, gross margin,
      burn, runway, NRR, and cap-table terms are material to any investor return model.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: scenarios-and-comps
    title: Scenarios, comparables, and downside
    body: >-
      Scenario work should use the reported acquisition as an observable strategic reference
      while keeping operating assumptions explicit. The bull case is a closed transaction near
      the reported price followed by successful integration that preserves Oasis's agent and
      non-human identity capability inside Cyera's data-security platform. The base case is a
      strategic outcome that validates the category but leaves the standalone economics
      unproven, warranting a research-more decision until terms and metrics are disclosed. The
      bear case is a delayed, repriced, or failed transaction, or an integration that weakens
      product fidelity; an independent review specifically cautions that the letter of intent
      and roadmap can change. Tracxn supplies a directional peer set including Keyfactor,
      GitGuardian, AKEYLESS, Astrix, Token Security, and Clutch Security, but its score and
      funding table are not a like-for-like public-company multiple set. These references help
      define category breadth, not a defensible comp-derived enterprise value. No public source
      in the assigned pool supplies comparable revenue multiples, so precision would be false.
    claimRefs: [CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation and thesis-break triggers
    body: >-
      The recommendation is research-more with high uncertainty and a high risk rating. The
      strategic logic is supported by Cyera's stated plan to unite data and identity security,
      by independent commentary on the scarcity of non-human identity capability, and by Oasis's
      documented lifecycle product surface. The price conclusion is deliberately narrower:
      public evidence supports strategic importance and a reported $1 billion headline, but not
      fair value, investor proceeds, or a target return. The decision should move toward a more
      positive valuation stance only after signed closing terms, consideration mix, preference
      treatment, and standalone operating metrics are obtained. Thesis-break indicators are a
      failed or materially repriced transaction, loss of key product functionality after
      integration, evidence that customer adoption does not convert to durable recurring revenue,
      or concentration and renewal metrics that make the category position economically fragile.
      Exit readiness is consequently conditional on transaction completion and retention of
      Oasis's technical and customer momentum inside Cyera.
    claimRefs: [CV016, CV017, CV019]
    callouts:
      - calloutType: recommendation
        title: Research-more at reported strategic price
        body: The acquisition signal is strong enough to justify focused diligence, but undisclosed operating and deal terms prevent a supported buy or fair-value conclusion.
        claimRefs: [CV016, CV017]
      - calloutType: risk
        title: Letter-of-intent and integration risk
        body: The transaction may change before closing, and a broader platform could dilute the standalone product differentiation that supports the strategic thesis.
        claimRefs: [CV012, CV019]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, research-more, "Reported acquisition and category evidence; no verified closing terms", "Do not underwrite a final price yet"]
      - [Confidence, low, "Strategic rationale is corroborated, operating metrics are undisclosed", "Obtain primary transaction and KPI evidence"]
      - [Risk rating, high, "LOI status, integration, and economics remain unresolved", "Use explicit kill criteria"]
      - [Valuation stance, stretched, "Approximately $1B reported against $195M raised; no ARR multiple", "Require price and metric discipline"]
    notes: "Assessment is analytical, not a quoted company rating; the reported acquisition amount is not a verified completed consideration."
    claimRefs: [CV001, CV006, CV008, CV012, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Category scarcity and strategic fit", "Cyera seeks to combine data security with Oasis non-human identity governance", "Evidence of weak integration demand or substitute capability", "Supports strategic relevance"]
      - ["Operational product differentiation", "Independent review cites lifecycle workflows, rotation, and offboarding", "Customer references showing limited production use", "Supports product thesis, not price"]
      - ["Reported $1B exit signal", "CRN reports Cyera confirmed the $1B figure", "Signed closing terms materially below the report", "Positive signal with transaction risk"]
      - ["Economics remain unproven", "Pricing, ARR, margins, retention, and cap-table terms are not public", "Audited KPI package and clean preferences", "Blocks a precise valuation"]
    notes: "Rows distinguish strategic evidence from valuation evidence; absence of public metrics is an evidence gap, not proof that metrics are weak."
    claimRefs: [CV001, CV003, CV004, CV008, CV010, CV017]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Deal closes near $1B; Cyera preserves Oasis product and customer momentum", "Strategic scarcity is validated; upside depends on consideration and retention terms", "Integration dilution; undisclosed KPI quality", "Low-to-medium"]
      - [Base, "Deal closes with changed terms or limited standalone disclosure", "Use reported price as a reference only; research-more remains appropriate", "Cash/share mix, preferences, and operating metrics unknown", "Medium"]
      - [Bear, "LOI fails, reprices, or integration weakens product and adoption", "No supported exit value; downside is primarily loss of strategic path", "Deal completion, customer retention, category consolidation", "Medium-to-high"]
      - [Diligence-gated upside, "ARR, margin, NRR, burn, cap table, and closing documents become available", "Rebuild revenue-based and strategic valuation cases", "Data may remain private or inconsistent", "Unresolved"]
      - [Keyfactor, "Tracxn lists it as a top competitor with $1.22B total funding", "Category scale and maturity context", "Funding is not enterprise value or comparable revenue", "Directional"]
      - [GitGuardian, "Tracxn lists it as a competitor with $106M total funding", "Private category breadth context", "Different product mix and stage", "Directional"]
      - [Astrix / Token Security, "Tracxn lists both as AI or machine-identity peers", "Competitive positioning and exit-path context", "No public operating multiples in source", "Directional"]
      - [Closing package, "Obtain signed merger or purchase agreement and consideration schedule", "Verify price, cash/share mix, escrow, preferences, and rollover", "Not public in assigned evidence", "Required"]
      - [Operating KPI package, "Obtain ARR bridge, gross margin, NRR/GRR, burn, and runway", "Enable revenue and cash-efficiency valuation", "Not public in assigned evidence", "Required"]
      - [Customer and cap-table package, "Obtain concentration, renewals, option pool, debt, and preference terms", "Test durability and proceeds waterfall", "Not public in assigned evidence", "Required"]
    notes: "Scenarios are qualitative because the assigned evidence does not provide ARR, revenue multiples, signed consideration, or probability data; probability signals are directional, not statistical estimates."
    claimRefs: [CV008, CV010, CV012, CV013, CV014, CV017]
