      - ["Lifecycle action", "Execute rotation, decommissioning, or remediation", "Production credentials and workload dependencies", "Rollback, approvals, and production safety"]
    notes: This is an evidence-bounded operating model assembled from product and integration descriptions; undisclosed implementation details remain diligence items.
    claimRefs: [CE005, CE006, CE007, CE013, CE015]
figures:
  - id: FE001
    title: Oasis Security product architecture map
    type: stack
    summary: The public evidence supports a layered path from environment telemetry to identity-aware governance actions.
    data:
      layers:
        - label: Connected environments
          detail: Customer environments and machine identity assets observed through an agentless connection.
          modules: ["Cloud and hybrid workloads", "Service accounts, secrets, tokens, and certificates"]
        - label: Identity context
          detail: Context used to assign accountability and understand access.
          modules: ["Ownership and consumers", "Privilege and usage"]
        - label: Risk prioritization
          detail: Risk scoring and identity-aware security-finding context.
          modules: ["Severity and posture", "Blast-radius correlation"]
        - label: Lifecycle governance
          detail: Governance and remediation actions described in the integration.
          modules: ["Attestation and hygiene", "Rotation and decommissioning"]
        - label: Trust and control plane
          detail: Publicly stated safety objectives that require validation before production automation.
          modules: ["Approval gates", "Audit and rollback evidence"]
        - label: Product maturity boundary
          detail: Scope and roadmap claims that remain incompletely independently validated.
          modules: ["AI-agent coverage", "Reliability and certification diligence"]
    approximationNotes: The stack is a conceptual rendering of documented product workflows, not a disclosed software-component diagram or proof of implementation depth.
    claimRefs: [CE005, CE006, CE007, CE013, CE016]
callouts:
  - calloutType: strength
    title: Workflow-oriented differentiation
    body: >-
      The strongest public product evidence is the link from cloud exposure to identity-level action, including ownership context and lifecycle workflows rather than inventory alone.
    claimRefs: [CE005, CE006, CE013]
  - calloutType: risk
    title: Controls are not publicly evidenced
    body: >-
      Public sources describe desired safety outcomes but do not verify isolation, reliability, certifications, incident performance, or rollback behavior for production changes.
    claimRefs: [CE014, CE015, CE016]
  - calloutType: recommendation
    title: Gate automation through a production proof of value
    body: >-
      Validate connector scope, identity coverage, approval and rollback controls, audit trails, and measurable remediation outcomes before enabling lifecycle actions on production credentials.
    claimRefs: [CE014, CE015, CE016]
