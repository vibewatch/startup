    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Independent security architecture, certification, penetration-test, incident, uptime, privacy, and data-retention evidence.
      whyItMatters: Oasis may be granted access to production identities and could initiate high-impact lifecycle changes.
      diligencePath: Request current SOC 2 or equivalent reports, security questionnaire responses, incident history, penetration-test executive summary, uptime SLA, and data-processing terms under NDA.
      relatedQuestionRefs: [QE007]
