      severity: material
      topic: reliability
      missingEvidence: Controlled measurements for discovery coverage, connector latency, recommendation precision, remediation success, rollback, and false positives.
      whyItMatters: Marketing-described visibility and safe remediation do not establish operational reliability at enterprise scale.
      diligencePath: Run a proof of value across representative cloud and hybrid environments with pre-agreed coverage, time-to-detect, action-success, rollback, and exception metrics.
      relatedQuestionRefs: [QE005, QE008]
    - type: private-evidence-only
      severity: minor
      topic: developer-signal
      missingEvidence: No public developer repository, package-download series, API forum, or other practitioner-community signal was present in the assigned pool.
      whyItMatters: Independent developer adoption and integration depth are not observable from the available product pages and partner material.
      diligencePath: Request private developer adoption, integration usage, support-volume, and release-history metrics, or validate practitioner references directly.
      relatedQuestionRefs: [QE004, QE006]
