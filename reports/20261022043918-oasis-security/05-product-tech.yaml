company:
  name: Oasis Security
chapter:
  number: 5
  title: Product & Technology
  summary: Oasis Security addresses non-human identity governance by discovering machine identities, attaching ownership and risk context, and supporting lifecycle remediation. Public evidence describes a product with agentless visibility and integration-led remediation, but leaves important questions about deployment depth, reliability, security controls, and independent technical validation unresolved.
sections:
  - id: product-scope
    title: Product scope and user workflow
    body: >-
      Oasis Security is positioned as an enterprise platform for non-human identities such as service accounts, secrets, API keys, tokens, certificates, bots, and AI agents. The user problem is operational rather than merely inventory: security teams need to identify machine identities, determine who owns them and what they can reach, assess whether they are active, and take lifecycle action without breaking production. SecurityWeek describes an agentless connection to customer environments with continuous observation, resource and privilege context, severity scoring, and remediation recommendations. The public record therefore supports a workflow from discovery and posture assessment to ownership, prioritization, and remediation, but does not establish measured discovery coverage, time-to-value, or production success rates.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      The apparent operating model combines an agentless SaaS control plane with connectors or integrations into enterprise environments and adjacent security systems. The Wiz integration is concrete evidence of one pathway: Wiz Issues and DSPM findings are correlated with Oasis identity, privilege, usage, and ownership context, after which teams can initiate attestation, hygiene, right-sizing, key rotation, or decommissioning workflows. This architecture is strategically useful because it connects cloud findings to the machine identity behind access rather than leaving remediation at the resource level. However, the sources do not disclose the connector catalogue, collection protocols, tenant isolation model, data residency, latency, failure handling, or whether lifecycle actions are fully automated versus approval-assisted.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-differentiation
    title: Maturity, differentiation, and roadmap
    body: >-
      Public descriptions consistently distinguish Oasis from a human identity provider: its focus is the lifecycle of machine identities, including discovery, ownership attribution, posture, rotation, and decommissioning. The product's differentiating promise is operational closure rather than a dashboard, especially the ability to prioritize by blast radius and safely execute remediation. A community review says pricing is opaque, deployment is SaaS-only, and human SSO and MFA are out of scope; it also characterizes AI-agent coverage as part of the roadmap. Those statements are useful external checks on scope, but they are not independently audited product benchmarks. The category appears early, and the evidence does not establish feature parity, implementation duration, or a durable technical moat.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-and-gaps
    title: Trust, safety, and diligence gaps
    body: >-
      Oasis's product value depends on acting safely on identities that may power production workloads. The Wiz integration explicitly frames safe rotation, right-sizing, and decommissioning as actions that should avoid production impact, while the company's earlier product description emphasizes risk scoring and tailored remediation recommendations. These are important control objectives, not proof that the controls work under all failure modes. No assigned source provides a public security architecture, independent certification, incident history, uptime commitment, penetration-test summary, privacy posture, or quantified false-positive and rollback performance. A buyer should therefore test permissions, approval gates, auditability, connector failure behavior, rollback, and evidence retention in a proof of value       before relying on automated lifecycle actions.
    claimRefs: [CE013, CE014, CE015, CE016]
