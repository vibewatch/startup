company:
  name: Oasis Security
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a sales-led annual enterprise subscription scoped by identity count
    and connected systems, but Oasis does not publish list pricing or operating metrics. Reported
    funding and a roughly $1 billion acquisition letter of intent provide financing and exit
    context, not evidence of ARR, margins, cash on hand, burn, or runway.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing
    body: >-
      Oasis appears to monetize as enterprise software rather than through a public self-service
      tariff. Start With Identity describes an annual enterprise subscription, scoped by identity
      count and connected systems, sold through a sales-led proof of value; it also says no public
      pricing is available. That supports recurring contract form, but not realized price, contract
      duration, discounts, usage overages, revenue recognition, or mix. The Wiz integration shows
      how additional connected systems and remediation workflows can broaden deployed scope, yet
      neither source quantifies attach rates or incremental revenue. The underwriting file should
      therefore treat subscription structure as supported and every dollar-level revenue input as
      unavailable.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: commercial-motion-and-cost-drivers
    title: Commercial motion and cost drivers
    body: >-
      The disclosed go-to-market motion is enterprise and proof-of-value led. A company-issued 2024
      release said Oasis had signed blue-chip customers within its first year, but it provided no
      customer count, contract value, sales cycle, conversion rate, or expansion measure. The
      product also spans identity discovery, posture analysis, ownership context, integrations,
      rotation, right-sizing, and decommissioning. Those capabilities can support platform value
      and expansion, but they may also create implementation, connector maintenance, customer
      success, and support costs. Public sources do not separate software gross margin from
      service-delivery cost, so neither SaaS-like margin assumptions nor implementation revenue
      should be imposed without cohort-level contract data.
    claimRefs: [CI002, CI003, CI004, CI014]
  - id: traction-capital-and-transaction
    title: Public traction, capital, and transaction context
    body: >-
      Capital formation is visible, while operating traction is not. Oasis announced $40 million
      of funding in January 2024; Tracxn later reported $195 million raised across three rounds,
      and separate reporting identified a $120 million Series B in March 2026. These are financing
      flows, not current cash. The assigned evidence discloses no Oasis revenue, ARR, growth, gross
      margin, retention, burn, or runway. A July 2026 letter of intent valued a proposed Cyera
      acquisition at roughly $1 billion, reportedly mostly cash, but multiple sources stress that
      the deal had not closed. The headline value is therefore a contingent transaction signal,
      not revenue validation or cash available to Oasis.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      Revenue quality cannot be underwritten from the public record beyond the likely recurring
      subscription form. The strongest commercial positives are a sales-led enterprise motion,
      partner-enabled workflow breadth, and reports of early large-enterprise adoption. The
      counterweight is severe metric opacity: no public ARR bridge, bookings, ACV, renewal,
      concentration, CAC, payback, gross margin, operating expense, debt, cash, burn, or runway.
      The adverse case is also strategic: if incumbent identity or cloud platforms absorb
      non-human-identity governance, pricing power and standalone renewal durability could weaken.
      Investment-grade diligence requires the company ledger, contract cohort data, cost allocation,
      liquidity schedule, and acquisition closing documentation rather than extrapolation from
      funding or the headline letter-of-intent value.
    claimRefs: [CI010, CI011, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization status
    columns:
      - Stream
      - Mechanism
      - Unit or scope
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Enterprise platform subscription
        - Annual enterprise contract
        - Identity count and connected systems
        - Model disclosed; realized price unavailable
        - Recurring form is supported, retention is not
        - ARR by cohort, contract term, renewal, and expansion
      - - Proof-of-value conversion
        - Sales-led evaluation before production
        - Proof-of-value engagement
        - Motion disclosed; paid status unavailable
        - Conversion economics are unknown
        - Win rate, cycle length, pilot cost, and conversion timing
      - - Connected-system expansion
        - Broader integrations and remediation workflows
        - Connected systems and deployed use cases
        - Product mechanism supported; monetization unavailable
        - Potential expansion lever, not quantified
        - Attach rate, expansion ARR, and connector-level support cost
      - - Implementation or services
        - No retained source establishes a separate service stream
        - Unavailable
        - Not publicly disclosed
        - Must not be assumed to be software revenue
        - Services revenue, delivery hours, partner share, and margin
    notes: >-
      Public sources establish contract form and scope drivers, not realized pricing, revenue mix,
      recognition policy, renewal behavior, or a separate services stream.
    claimRefs: [CI001, CI002, CI003, CI010]
  - id: TI002
    title: Pricing and packaging evidence
    columns:
      - Pricing element
      - Public evidence
      - List versus realized
      - Unknowns
      - Underwriting implication
    rows:
      - - Public list price
        - No public pricing
        - Neither list nor realized price is available
        - ACV, minimum commitment, tiers, and overages
        - Do not infer price from category peers
      - - Contract scope
        - Identity count and connected systems
        - Scope basis disclosed; rate card unavailable
        - Included identities, connector tiers, and true-up mechanics
        - Volume expansion is plausible but unquantified
      - - Sales process
        - Sales-led process with a proof of value
        - Commercial process disclosed; discounting unavailable
        - Pilot duration, paid status, conversion, and discount bands
        - CAC and payback cannot be calculated
    notes: >-
      This is a partial public-pricing snapshot; unavailable fields mean not disclosed, not zero or
      not applicable, and the subscription description comes from independent review evidence.
    claimRefs: [CI001, CI002, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Required diligence
    rows:
      - - ARR and revenue growth
        - null
        - Publicly unavailable
        - Establishes scale and trajectory
        - Monthly ARR bridge, bookings, revenue, and recognized-versus-contracted reconciliation
      - - Gross margin
        - null
        - Publicly unavailable
        - Tests software economics and delivery burden
        - Gross margin by subscription, services, cloud, and support cost
      - - CAC and payback
        - null
        - Publicly unavailable
        - Tests the sales-led proof-of-value motion
        - Fully loaded CAC, win rate, sales cycle, and cohort payback
      - - NRR, GRR, and churn
        - null
        - Publicly unavailable
        - Tests revenue durability and expansion
        - Cohort NRR, GRR, logo churn, expansion, and contraction
      - - Cash, burn, and runway
        - null
        - Publicly unavailable
        - Determines financing dependency before deal close
        - Current cash, monthly net burn, debt, obligations, and downside runway
      - - Reported capital raised
        - $195M across three rounds
        - Medium; third-party database
        - Provides financing history but not liquidity
        - Cap table, round proceeds received, secondary sales, preferences, and cash use
    notes: >-
      Null means no value was disclosed in the retained public evidence; funding raised is not cash
      on hand, and the reported transaction value is intentionally excluded from operating metrics.
    claimRefs: [CI005, CI006, CI007, CI010, CI011]
figures:
  - id: FI001
    title: Supported revenue-model bridge
    type: flow
    summary: >-
      Public evidence supports the path from enterprise identity scope to a sales-led annual
      subscription, but it does not quantify contract value, revenue, or gross profit.
    data:
      nodes:
        - id: enterprise-estate
          label: Enterprise non-human identity estate
          detail: Service accounts, secrets, tokens, certificates, and AI-agent identities
        - id: discovery-context
          label: Discovery and ownership context
          detail: Inventory, ownership, privilege, usage, and connected-system context
        - id: posture-prioritization
          label: Posture and risk prioritization
          detail: Findings are ranked using privilege, data sensitivity, usage, and blast radius
        - id: lifecycle-actions
          label: Lifecycle and remediation workflows
          detail: Attestation, hygiene, rotation, right-sizing, and decommissioning
        - id: proof-of-value
          label: Sales-led proof of value
          detail: Enterprise evaluation step; duration, cost, and conversion are unavailable
        - id: annual-subscription
          label: Annual enterprise subscription
          detail: Scoped by identity count and connected systems; price and gross profit unavailable
      edges:
        - from: enterprise-estate
          to: discovery-context
          label: inventory
        - from: discovery-context
          to: posture-prioritization
          label: enrich
        - from: posture-prioritization
          to: lifecycle-actions
          label: remediate
        - from: lifecycle-actions
          to: proof-of-value
          label: demonstrate outcome
        - from: proof-of-value
          to: annual-subscription
          label: contract
    approximationNotes: >-
      The sequence is a supported commercial mechanism, not a quantified conversion funnel; no
      conversion rate, contract value, recognized revenue, cost, or gross-profit figure is public.
    claimRefs: [CI002, CI003, CI004, CI014]
callouts:
  - calloutType: risk
    title: Funding and headline deal value do not establish runway
    body: >-
      The $195 million reported funding total and roughly $1 billion acquisition letter of intent
      cannot substitute for cash, burn, debt, closing certainty, or operating-performance data.
    claimRefs: [CI006, CI008, CI009, CI010]
