evidenceGaps:
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: Current ARR, revenue bridge, gross margin, burn, runway, customer count, and concentration by segment.
    whyItMatters: >-
      The acquisition value and funding history cannot be assessed against operating performance or capital efficiency
      without these metrics.
    diligencePath: >-
      Request monthly or quarterly KPI packages, audited or management financials, cohort retention, and customer
      concentration under NDA.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: acquisition
    missingEvidence: >-
      Definitive transaction terms, consideration mix, cap-table proceeds, preferences, debt, and any secondary
      activity.
    whyItMatters: >-
      A deal value is not equivalent to equity value or proceeds to existing holders, and the structure affects
      incentives and integration risk.
    diligencePath: >-
      Obtain the signed purchase agreement summary, capitalization table, preference stack, debt schedule, and board
      approvals.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: integration
    missingEvidence: >-
      Post-close pricing, customer contract treatment, support ownership, retention commitments, and technical
      integration milestones.
    whyItMatters: >-
      Customers and investors face execution and concentration risk if continuity commitments change during the Cyera
      transition.
    diligencePath: >-
      Interview reference customers and request current order forms, renewal terms, SLA ownership, product roadmap, and
      integration plan.
    relatedQuestionRefs:
      - QO003
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      A complete public search of litigation, regulatory actions, sanctions, outages, and security incidents
      attributable to Oasis.
    whyItMatters: >-
      The assigned source set contains no verified adverse event record, which is not proof that no adverse event
      occurred.
    diligencePath: >-
      Run legal, regulatory, sanctions, incident, and customer-reference checks using company legal names and major
      jurisdictions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A transparent bottom-up TAM, SAM, and SOM with eligible identity counts, customer segments, geography, pricing,
      attach rates, and achievable win rates.
    whyItMatters: >-
      Identity ratios and acquisition interest show problem intensity but cannot support market revenue, obtainable
      share, or valuation sensitivity.
    diligencePath: >-
      Obtain Oasis pricing and customer-cohort data, then triangulate it against identity counts and security budgets
      from representative enterprises.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: identity-prevalence
    missingEvidence: >-
      The population, sampling period, identity definitions, and methodology behind the reported 50-to-1 and 82-to-1
      ratios.
    whyItMatters: Unreconciled ratios cannot be used as a denominator for a bottom-up market model or as proof of category growth.
    diligencePath: >-
      Request the underlying Palo Alto Networks study and Oasis research methodology, normalize identity definitions,
      and compare like-for-like periods.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      Customer-level budget owner, sales-cycle duration, proof-of-value conversion, identity-based pricing, expansion,
      and renewal data by segment.
    whyItMatters: >-
      Buyer workflow evidence does not establish who ultimately pays, how budgets are created, or how much spend Oasis
      can capture.
    diligencePath: >-
      Review pipeline and cohort data, interview reference customers across IAM, cloud, platform, and AI teams, and
      reconcile contract value with deployed identity counts.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable customer pricing, discounting, implementation cost, and identity-count pricing for Oasis and its direct
      specialists.
    whyItMatters: >-
      Without realized commercial data, the buyer's total cost and the durability of any price premium cannot be
      underwritten.
    diligencePath: >-
      Request anonymized quotes, proof-of-value conversion data, implementation statements of work, and renewal pricing
      from management and reference customers.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: competitor-outcomes
    missingEvidence: >-
      Independent benchmarks, customer references, and retention or deployment outcomes comparing Oasis with Astrix,
      Token Security, GitGuardian, Keyfactor, and Venafi.
    whyItMatters: >-
      Product descriptions establish category overlap but do not establish superior efficacy, win rates, or switching
      costs.
    diligencePath: >-
      Run reference calls and a controlled proof-of-value against named alternatives using the same NHI population and
      remediation tasks.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP008
  - type: stale
    severity: material
    topic: acquisition
    missingEvidence: Closing status, final consideration mix, and post-close product or brand treatment for the Cyera transaction.
    whyItMatters: >-
      A signed letter of intent can change, and the outcome directly affects standalone competition, distribution, and
      roadmap assumptions.
    diligencePath: >-
      Verify the transaction through a current company or regulatory announcement and refresh the competitive assessment
      after closing.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly gross and net burn, debt, committed obligations, and downside runway.
    whyItMatters: Funding raised cannot establish present liquidity or financing dependency before a transaction closes.
    diligencePath: >-
      Obtain the latest balance sheet, monthly cash bridge, debt schedule, board budget, and acquisition closing
      conditions.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, payback, ACV, sales-cycle length, proof-of-value conversion, channel economics, NRR, GRR, and churn by
      cohort.
    whyItMatters: >-
      The sales-led subscription model cannot be tested for efficient growth or durable expansion without cohort
      economics.
    diligencePath: >-
      Review CRM funnel exports, bookings cohorts, renewal schedules, compensation plans, and customer-level ARR
      bridges.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, ARR, bookings, growth, gross margin, service-delivery cost, and revenue-recognition policy.
    whyItMatters: >-
      These inputs determine scale, revenue quality, margin path, and whether the business merits software valuation
      treatment.
    diligencePath: Reconcile audited financials, billing records, deferred revenue, cloud costs, support costs, and signed contracts.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: acquisition
    missingEvidence: >-
      Executed definitive agreement, final consideration mix, closing conditions, regulatory approvals, and stakeholder
      proceeds.
    whyItMatters: A letter of intent can change or fail and does not establish realized liquidity.
    diligencePath: Obtain signed transaction documents, board approvals, closing checklist, and current legal-status confirmation.
    relatedQuestionRefs:
      - QI009
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent security architecture, certification, penetration-test, incident, uptime, privacy, and data-retention
      evidence.
    whyItMatters: Oasis may be granted access to production identities and could initiate high-impact lifecycle changes.
    diligencePath: >-
      Request current SOC 2 or equivalent reports, security questionnaire responses, incident history, penetration-test
      executive summary, uptime SLA, and data-processing terms under NDA.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Controlled measurements for discovery coverage, connector latency, recommendation precision, remediation success,
      rollback, and false positives.
    whyItMatters: Marketing-described visibility and safe remediation do not establish operational reliability at enterprise scale.
    diligencePath: >-
      Run a proof of value across representative cloud and hybrid environments with pre-agreed coverage, time-to-detect,
      action-success, rollback, and exception metrics.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      No public developer repository, package-download series, API forum, or other practitioner-community signal was
      present in the assigned pool.
    whyItMatters: >-
      Independent developer adoption and integration depth are not observable from the available product pages and
      partner material.
    diligencePath: >-
      Request private developer adoption, integration usage, support-volume, and release-history metrics, or validate
      practitioner references directly.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level deployment status, ARR cohorts, NRR, GRR, logo churn, renewal rates, contract length, and
      pilot-to-production conversion.
    whyItMatters: >-
      These metrics determine whether customer outcomes translate into durable recurring revenue rather than isolated
      proofs of value.
    diligencePath: >-
      Request an anonymized quarterly cohort bridge, renewal schedule, pilot-conversion funnel, and five reference calls
      spanning new, renewed, expanded, and churned customers.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer
    missingEvidence: >-
      A complete list of referenceable production customers with deployment scope, go-live date, outcome baseline, and
      current contract status.
    whyItMatters: >-
      The public sample has one named customer and cannot establish repeatability across segments or production
      maturity.
    diligencePath: >-
      Obtain the customer roster and select references independently by vertical, contract age, deployment scale, and
      renewal status.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer shares, vertical and geographic mix, direct-versus-partner sourcing, expansion
      ARR, and partner-attributed pipeline.
    whyItMatters: >-
      Concentration and channel dependence could make growth and renewal sensitive to a few enterprises, partners, or
      the Cyera transition.
    diligencePath: >-
      Request concentration schedules, bookings by source and vertical, account-level expansion history, and the
      post-transaction customer migration plan.
    relatedQuestionRefs:
      - QU009
      - QU010
  - type: missing-source
    severity: blocking
    topic: acquisition-status
    missingEvidence: >-
      Definitive Cyera-Oasis transaction agreement, closing confirmation, final consideration, employee treatment, and
      post-close operating commitments.
    whyItMatters: >-
      The reported transaction changes ownership, liquidity, product continuity, and the interpretation of the
      approximately $1 billion headline.
    diligencePath: >-
