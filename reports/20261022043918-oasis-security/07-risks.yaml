company:
  name: Oasis Security
chapter:
  number: 7
  title: Risks
  summary: >-
    Oasis Security's current risk profile is dominated by an unclosed reported Cyera transaction,
    integration execution, opaque operating economics, and dependencies on adjacent identity,
    secrets-management, and cloud-security systems. The evidence supports concrete product and
    transaction risks, but legal, regulatory, incident, retention, concentration, and runway
    exposure remain diligence gaps rather than clean findings.
sections:
  - id: transaction-and-legal-exposure
    title: Transaction, legal, and ownership exposure
    body: >-
      The most consequential current risk is transaction status. The Brief and Masternode AI
      describe a July 28, 2026 letter of intent for Cyera to acquire Oasis for approximately $1
      billion, with consideration expected to be mostly cash and partly Cyera shares. Masternode
      explicitly says the deal was not closed and final terms could change, while Tracxn labels
      Oasis as acquired on the same date. Until definitive documents and closing evidence are
      produced, ownership, consideration, timing, employee treatment, and product commitments
      remain unsettled. The assigned evidence also does not resolve litigation, regulatory,
      privacy, sanctions, or security-incident exposure. That is a material diligence gap, not
      evidence of a clean record. Nasdaq Private Market's fetched Oasis page adds no transaction
      pricing and states that its investor services are limited to accredited investors, so it
      should not be treated as proof of secondary liquidity or a market-clearing value.
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
  - id: integration-and-operational-control
    title: Integration and operational-control risk
    body: >-
      Cyera reportedly intends to combine Oasis's non-human identity capability with a broader
      identity and data-security platform. The strategic fit is plausible, but the integration
      must preserve discovery, ownership attribution, posture, rotation, and decommissioning
      workflows across heterogeneous systems. Wiz's partner page shows that Oasis consumes Wiz
      Issues and DSPM findings to correlate cloud risk with identity context, illustrating both
      useful interoperability and dependence on connected products and data quality. Oasis's own
      company-issued release claims automatic discovery, risk assessment, and remediation, but
      the assigned pool does not independently quantify coverage, false negatives, failed
      rotations, or production impact. A loss of product fidelity, broken connector coverage, or
      unsafe lifecycle actions would directly undermine the product's risk-reduction thesis.
      Diligence should therefore test control effectiveness, connector failure modes, audit logs,
      release continuity, and named deployment outcomes rather than rely on feature descriptions.
    claimRefs: [CR003, CR004, CR015]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: commercial-and-financial-model
    title: Commercial, financial, and capacity risk
    body: >-
      Start with Identity identifies structural commercial constraints: Oasis is not an identity
      provider, human authentication, SSO, and MFA are outside scope, deployment is SaaS-only, and
      pricing is opaque. It recommends using Oasis alongside an existing identity provider and
      secrets manager. Those boundaries increase procurement coordination and can make realized
      value depend on adjacent systems, implementation quality, and enterprise willingness to buy
      another control plane. Public capacity indicators are also inconsistent: DecipherU described
      a 50-100 employee company in April 2026, whereas Tracxn reported 146 employees as of
      September 30, 2026. More importantly, the assigned evidence does not provide revenue,
      retention, gross margin, burn, runway, implementation cost, or customer-concentration
      denominators. Funding raised must not be treated as cash available, and the reported
      acquisition headline must not substitute for operating evidence.
    claimRefs: [CR005, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: dependencies-and-thesis-breaks
    title: Dependencies, monitoring indicators, and thesis breaks
    body: >-
      Oasis depends on the reported acquirer, enterprise identity and secrets-management stacks,
      cloud-security integrations, and a still-forming non-human identity category. Tracxn reports
      47 active competitors, including 10 funded companies and three that have exited; the count
      is market-data context, not an independent product benchmark. Investors should monitor
      definitive transaction status, retained product leadership, connector and remediation
      reliability, deployment time, referenceable renewals, expansion, gross margin, cash runway,
      and customer or partner concentration. Thesis-break triggers are a failed or materially
      changed transaction, discontinuation or dilution of agent-governance functionality, loss of
      referenceable enterprise renewals, repeated unsafe remediation, or evidence that opaque
      pricing and implementation burden prevent repeatable sales. Each trigger is observable and
      should prompt a re-underwrite rather than a narrative adjustment.
    claimRefs: [CR003, CR004, CR005, CR014, CR016]

tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, jurisdiction or status, likelihood, severity, mitigation maturity, residual exposure, diligence path]
    rows:
      - [Transaction closing and final consideration, "Cyera letter of intent reported on July 28, 2026; no closing established by retained sources", medium, high, low, high, "Obtain the definitive agreement, closing confirmation, consideration schedule, and employee treatment"]
      - [Public ownership-status conflict, "Tracxn says acquired while two reports describe an unclosed letter of intent", high, high, low, high, "Reconcile status against primary company and transaction-counsel documents"]
      - ["Legal, regulatory, privacy, and incident exposure", "Not resolved by the assigned evidence pool", unknown, high, low, high, "Commission legal, sanctions, privacy, and incident-record checks across confirmed entities"]
      - [Secondary liquidity and price discovery, "Nasdaq Private Market page limits investor services to accredited investors and provides no fetched transaction price", medium, medium, low, medium, "Request cap-table, secondary-transfer, and actual transaction evidence"]
    notes: "Rows cover the material legal and transaction signals visible in the assigned pool; unknown means evidence is unavailable, not that the risk is absent."
    enumerationScope:
      coverage: partial
      basis: "Public transaction, ownership, regulatory, legal, incident, and private-market signals available in the assigned source pool as of 2026-10-22"
    claimRefs: [CR001, CR002, CR006, CR007, CR008, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, likelihood, severity, mitigation maturity, residual exposure, unresolved gap]
    rows:
      - [Post-transaction integration dilutes agent-focused functionality, medium, high, low, high, "Obtain the integration roadmap, retained ownership, and release commitments"]
      - [Incomplete discovery or ownership attribution across connected systems, medium, high, medium, high, "Test measured coverage, false negatives, and connector degradation"]
      - [Rotation or decommissioning causes production impact, medium, high, medium, high, "Review rollback design, failed-action logs, and customer control tests"]
      - [Partner data or connector failure weakens prioritization, medium, medium, medium, medium, "Validate Wiz and other connector SLAs, field mappings, and degraded-mode behavior"]
      - [Capacity or control maturity is misread from conflicting headcount signals, unknown, medium, low, medium, "Reconcile current headcount, engineering allocation, attrition, and control ownership"]
    notes: "Likelihood and residual exposure are qualitative analytical ratings anchored to disclosed dependencies and missing control evidence; they are not incident probabilities."
    claimRefs: [CR003, CR004, CR012, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, counterparty or role, concentration, failure scenario, severity, mitigation, residual exposure]
    rows:
      - [Reported acquirer and future platform owner, Cyera, "Single reported acquirer", "Deal changes or integration deprioritizes Oasis", high, "Require definitive terms, retained leadership, and milestone ownership", high]
      - [Identity and secrets-management stack, "Existing enterprise IdP and secrets manager", "Customer-specific and undisclosed", "Adjacent systems constrain deployment, remediation, or data quality", high, "Test reference architectures and connector failure modes", medium]
      - [Cloud-risk context, Wiz and other connected systems, "Not disclosed", "Missing or stale partner findings distort blast-radius prioritization", medium, "Require connector telemetry, SLAs, and reconciliation controls", medium]
      - [Enterprise procurement, "Sales-led security buyers", "Not disclosed", "Opaque pricing and proof-of-value effort prevent repeatable conversion", medium, "Request cycle time, proof-of-value conversion, win rate, and cohort data", high]
      - [Competitive category, "47 active competitors reported by Tracxn", fragmented, "Feature convergence and pricing pressure erode differentiation", medium, "Obtain win-loss, displacement, and renewal evidence", medium]
    notes: "Concentration is qualitative because the assigned sources do not disclose customer, partner, channel, or revenue shares; no numerical concentration is inferred."
    claimRefs: [CR003, CR004, CR005, CR010, CR011, CR014]

