        - label: "Unknown likelihood"
          values: [0, 2, 2]
        - label: "High residual exposure"
          values: [0, 1, 4]
        - label: "Medium residual exposure"
          values: [0, 3, 1]
        - label: "Low residual exposure"
          values: [0, 1, 0]
    approximationNotes: "Cells count qualitative risk-register placements; they are not calibrated probabilities, loss estimates, or evidence that an incident occurred."
    claimRefs: [CR001, CR003, CR010, CR013, CR016]

callouts:
  - calloutType: risk
    title: Closing status is a gating uncertainty
    body: >-
      Two retained reports describe only a letter of intent, while Tracxn labels Oasis acquired;
      do not treat the reported price, ownership transition, or post-close operating model as
      settled without primary closing evidence.
    claimRefs: [CR001, CR002, CR006, CR007]
  - calloutType: assumption
    title: Public silence is not a clean bill of health
    body: >-
      The assigned pool does not resolve litigation, regulatory, privacy, sanctions, or incident
      exposure. Those items require direct diligence and should remain unknown rather than zero.
    claimRefs: [CR008]

