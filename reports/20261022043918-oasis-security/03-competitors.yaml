    title: Feature and capability matrix
    columns: [Buying criterion, Oasis Security, Direct specialists, Incumbent or adjacent platforms, Evidence implication]
    rows:
      - [NHI discovery and inventory, "Supported by reviewed descriptions", "Likely core for Astrix, Token Security, and GitGuardian; not independently verified here", "Keyfactor and Venafi have machine-identity scope", "Category overlap is clear; relative completeness is unknown"]
      - [Ownership and posture context, "Supported by reviewed descriptions", "Unknown by competitor", "Wiz integration adds privilege, usage, and ownership context", "Oasis and Wiz evidence support workflow context, not parity"]
      - ["Rotation, hygiene, right-sizing, and decommissioning", "Supported by reviewed descriptions", "Unknown by competitor", "Wiz integration explicitly describes these workflows", "Operational remediation is a central differentiator but not a benchmark"]
      - [AI-agent permissions and behavior, "AI-agent coverage described; maturity uncertain", "Astrix described as AI-agent/NHI security", "Cyera acquisition rationale centers on AI-agent control", "Category demand is validated; performance is not"]
      - ["Human SSO, MFA, and authentication", "Out of scope in independent review", "Unknown", "Existing IdP remains necessary", "Buyer must combine controls; no replacement claim"]
      - [Deployment model, "SaaS-only per independent review", "Unknown", "Existing controls may be hybrid", "Deployment constraints may affect regulated buyers"]
      - [Pricing transparency, "No public pricing", "Unknown", "No comparable public prices", "Commercial diligence is required"]
    notes: >-
      Cells marked unknown are deliberately not scored. Descriptions of competitor
      capabilities are not treated as independent benchmarks, and the matrix does not
      establish feature parity.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing, packaging, and switching implications
    columns: [Provider or alternative, Public price or model, Included or implied capability, Discount or unknown, Competitive implication]
    rows:
      - [Oasis Security, "No public pricing; annual enterprise subscription described", "Scoped by identity count and connected systems; proof of value", "Realized price, discounting, and minimum contract unknown", "Sales-led evaluation can support high ACV but slows comparability"]
      - [Direct specialists, "No comparable public pricing in assigned evidence", "NHI or machine-identity scope varies", "Packaging and discounts unknown", "Buyer must run competitive proofs"]
      - [Keyfactor/Venafi/AppViewX, "No comparable public pricing in assigned evidence", "PKI, certificate, and machine-identity automation", "NHI-specific modules and realized price unknown", "Incumbent distribution may reduce specialist switching"]
      - [Wiz integration, "No standalone Oasis price disclosed", "Cloud findings connected to identity remediation", "Joint commercial terms unknown", "Partner route can improve distribution while increasing dependency"]
      - [Cyera, "Acquisition price reported at approximately $1B; not a customer price", "Unified data and identity platform strategy", "Final deal terms and packaging unknown", "Bundling could pressure standalone pricing"]
      - [Status quo/internal build, "Internal labor and existing-tool cost not quantified", "Fragmented controls and scripts", "Operational risk and engineering cost unknown", "Avoided license spend may trade off against slower remediation"]
    notes: >-
      The acquisition amount is a corporate transaction value, not Oasis customer
      pricing or ARR. No realized customer price, discount, margin, or TCO figure is
      inferred from the available evidence.
    claimRefs: [CP009, CP010, CP011, CP012]
