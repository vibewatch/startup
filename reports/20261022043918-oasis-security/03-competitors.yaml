runDate: 2026-10-22
company:
  name: Oasis Security
chapter:
  number: 3
  title: Competitors
  summary: >-
    Oasis Security occupies a focused non-human identity governance niche,
    differentiated by lifecycle remediation rather than inventory alone. The
    competitive picture is tightening: established machine-identity vendors and
    adjacent cloud/data-security platforms can converge on the same buyer, while
    Cyera's announced acquisition indicates that standalone positioning may be
    difficult to sustain.
sections:
  - id: landscape
    title: Landscape and category boundaries
    body: >-
      Oasis addresses non-human identities such as service accounts, secrets, tokens,
      certificates, API keys, service principals, and AI agents. The closest direct
      alternatives are specialist machine-identity vendors including Astrix, Token
      Security, Clutch Security, and GitGuardian, while Keyfactor, Venafi, and
      AppViewX represent incumbent or adjacent certificate, PKI, and machine-identity
      automation capabilities. Cyera is an important strategic incumbent after signing
      a letter of intent to acquire Oasis, and Wiz is an adjacent cloud-security
      platform with an Oasis integration. The status quo remains a fragmented mix of
      identity-provider, secrets-manager, cloud-security, and internally scripted
      workflows; a buyer may therefore compare a specialist purchase with extending
      existing controls rather than selecting among identical products.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: differentiation
    title: Differentiation, capability, and buyer trade-offs
    body: >-
      Public evidence points to Oasis's main distinction being operational depth:
      discovery is paired with ownership attribution, posture, rotation, attestation,
      hygiene, right-sizing, and decommissioning. An independent category review says
      Oasis pushes “past inventory into lifecycle and remediation workflows,” while
      also documenting boundaries: it is not an identity provider, human
      authentication, SSO, or MFA product, and its deployment is SaaS-only. Wiz's
      partner description reinforces the remediation-oriented workflow, describing
      correlation of cloud findings with privilege, usage, ownership, and blast radius.
      These strengths can create workflow value, but they also leave room for larger
      platforms to bundle comparable controls and for buyers to retain existing IdP and
      secrets-management systems. Unsupported cells in the matrix remain unknown rather
      than being inferred from marketing language.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability
    title: Pricing, switching costs, and moat durability
    body: >-
      Pricing is not publicly disclosed, so competitive economics cannot be compared
      on a verified per-identity or per-system basis. The available review describes an
      annual enterprise subscription scoped by identity count and connected systems,
      sold through a sales-led proof-of-value process; this is a directional packaging
      signal, not realized pricing. Switching costs should rise when Oasis is connected
      to production identities and remediation workflows, because rotation,
      decommissioning, and ownership decisions must avoid operational impact. However,
      the same integration surface can favor broader platforms with existing
      distribution. The Cyera transaction is adverse to durable standalone
      independence: TechCrunch reports a roughly $1 billion letter of intent and says
      Cyera plans to integrate Oasis into a unified identity and data-security
      platform. Deal terms were not closed in the prefetched evidence, so the
      strategic implication is stronger than any conclusion about final ownership.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
  - id: exhibits
    title: Evidence exhibits
    body: >-
      The exhibits separate verified competitor descriptions from analyst or directory
      classifications. Tracxn supplies a broad competitor set and funding snapshots,
      but its ranking is a database signal rather than a buyer-validated performance
      benchmark. Start with Identity supplies an independent qualitative assessment,
      including limitations and opaque pricing. Wiz supplies partner evidence of an
      integration and use case, not independent proof of customer outcomes. The
      resulting positioning map is ordinal and evidence-backed: it is a synthesis of
      documented scope and lifecycle depth, not a quantitative market-share or product
      performance claim.
    claimRefs: [CP003, CP005, CP007, CP009]
    tableRefs: []
    figureRefs: []
