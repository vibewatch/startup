  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is enterprise non-human identity governance: discovering service accounts,
              secrets, tokens, certificates, bots, and AI agents; assigning ownership; evaluating privilege and use; and
              executing lifecycle actions such as attestation, rotation, right-sizing, and decommissioning. Oasis spans
              cloud, SaaS, and on-premises environments, but it is not a human identity provider and does not replace
              SSO or MFA. It also sits beside, rather than wholly replacing, secrets managers, conventional IAM/PAM,
              cloud-security posture tools, and internal scripts. That boundary makes the category strategically
              important without treating all identity-security or cloud-security spend as addressable revenue for Oasis.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM007
