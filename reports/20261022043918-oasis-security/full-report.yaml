      - CR003
      - CR010
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic category fit and reported transaction value support focused diligence, while missing operating and
      closing evidence keeps the recommendation at research-more.
    data:
