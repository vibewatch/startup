  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction, legal, and ownership exposure
        blocks:
          - type: paragraph
            body: >-
              The most consequential current risk is transaction status. The Brief and Masternode AI describe a July 28,
              2026 letter of intent for Cyera to acquire Oasis for approximately $1 billion, with consideration expected
              to be mostly cash and partly Cyera shares. Masternode explicitly says the deal was not closed and final
              terms could change, while Tracxn labels Oasis as acquired on the same date. Until definitive documents and
              closing evidence are produced, ownership, consideration, timing, employee treatment, and product
              commitments remain unsettled. The assigned evidence also does not resolve litigation, regulatory, privacy,
              sanctions, or security-incident exposure. That is a material diligence gap, not evidence of a clean
              record. Nasdaq Private Market's fetched Oasis page adds no transaction pricing and states that its
              investor services are limited to accredited investors, so it should not be treated as proof of secondary
              liquidity or a market-clearing value.
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.2'
        title: Integration and operational-control risk
        blocks:
          - type: paragraph
            body: >-
              Cyera reportedly intends to combine Oasis's non-human identity capability with a broader identity and
              data-security platform. The strategic fit is plausible, but the integration must preserve discovery,
              ownership attribution, posture, rotation, and decommissioning workflows across heterogeneous systems.
              Wiz's partner page shows that Oasis consumes Wiz Issues and DSPM findings to correlate cloud risk with
              identity context, illustrating both useful interoperability and dependence on connected products and data
              quality. Oasis's own company-issued release claims automatic discovery, risk assessment, and remediation,
              but the assigned pool does not independently quantify coverage, false negatives, failed rotations, or
              production impact. A loss of product fidelity, broken connector coverage, or unsafe lifecycle actions
              would directly undermine the product's risk-reduction thesis. Diligence should therefore test control
              effectiveness, connector failure modes, audit logs, release continuity, and named deployment outcomes
              rather than rely on feature descriptions.
            claimRefs:
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR010
              - CR013
              - CR016
      - number: '7.3'
        title: Commercial, financial, and capacity risk
        blocks:
          - type: paragraph
            body: >-
              Start with Identity identifies structural commercial constraints: Oasis is not an identity provider, human
              authentication, SSO, and MFA are outside scope, deployment is SaaS-only, and pricing is opaque. It
              recommends using Oasis alongside an existing identity provider and secrets manager. Those boundaries
              increase procurement coordination and can make realized value depend on adjacent systems, implementation
              quality, and enterprise willingness to buy another control plane. Public capacity indicators are also
              inconsistent: DecipherU described a 50-100 employee company in April 2026, whereas Tracxn reported 146
              employees as of September 30, 2026. More importantly, the assigned evidence does not provide revenue,
              retention, gross margin, burn, runway, implementation cost, or customer-concentration denominators.
              Funding raised must not be treated as cash available, and the reported acquisition headline must not
              substitute for operating evidence.
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Dependencies, monitoring indicators, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Oasis depends on the reported acquirer, enterprise identity and secrets-management stacks, cloud-security
              integrations, and a still-forming non-human identity category. Tracxn reports 47 active competitors,
              including 10 funded companies and three that have exited; the count is market-data context, not an
              independent product benchmark. Investors should monitor definitive transaction status, retained product
              leadership, connector and remediation reliability, deployment time, referenceable renewals, expansion,
              gross margin, cash runway, and customer or partner concentration. Thesis-break triggers are a failed or
              materially changed transaction, discontinuation or dilution of agent-governance functionality, loss of
              referenceable enterprise renewals, repeated unsafe remediation, or evidence that opaque pricing and
              implementation burden prevent repeatable sales. Each trigger is observable and should prompt a
              re-underwrite rather than a narrative adjustment.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Closing status is a gating uncertainty
            body: >-
              Two retained reports describe only a letter of intent, while Tracxn labels Oasis acquired; do not treat
              the reported price, ownership transition, or post-close operating model as settled without primary closing
              evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
          - type: callout
            title: Public silence is not a clean bill of health
            body: >-
              The assigned pool does not resolve litigation, regulatory, privacy, sanctions, or incident exposure. Those
              items require direct diligence and should remain unknown rather than zero.
            calloutType: assumption
            claimRefs:
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Oasis built a differentiated position in a newly important security category and
              converted that position into strategic value. CRN reports that Cyera agreed to acquire Oasis for $1
              billion and that Oasis had raised $195 million, while an independent review describes the product as
              unusually operational because it extends beyond inventory into ownership, rotation, and decommissioning.
              The product page supports a broad workflow from discovery and context through posture, threat detection,
              remediation, and lifecycle management. This combination supports category relevance and a credible
              strategic buyer rationale, but it does not establish standalone revenue quality or a cash-on-cash return.
              The anti-thesis is that the public price is reported rather than a completed transaction consideration,
              and the product's independent review identifies opaque pricing and an early market. A buyer should
              therefore underwrite strategic scarcity as an option, not as proof that the reported headline price is
              fair.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV010
              - CV017
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence establishes a capital and exit frame but not a complete valuation bridge. Tracxn
              records $195 million of total funding across three rounds and identifies a March 2026 Series B, while CRN
              independently reports the $120 million Series B and $195 million total. The acquisition reporting places
              the transaction near $1 billion, implying roughly 5.1 times total capital raised, but that ratio is a
              capital multiple, not a revenue multiple and should not be treated as an operating valuation. A separate
              report says the letter of intent is expected to be mostly cash with the remainder in Cyera shares; because
              the deal was not closed in that account, liquidity, consideration mix, preferences, escrow, earn-outs, and
              employee rollover remain open. The evidence therefore supports entry discipline based on verified closing
              terms and operating metrics rather than a precise public mark. The missing ARR, gross margin, burn,
              runway, NRR, and cap-table terms are material to any investor return model.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and downside
        blocks:
          - type: paragraph
            body: >-
              Scenario work should use the reported acquisition as an observable strategic reference while keeping
              operating assumptions explicit. The bull case is a closed transaction near the reported price followed by
              successful integration that preserves Oasis's agent and non-human identity capability inside Cyera's
              data-security platform. The base case is a strategic outcome that validates the category but leaves the
              standalone economics unproven, warranting a research-more decision until terms and metrics are disclosed.
              The bear case is a delayed, repriced, or failed transaction, or an integration that weakens product
              fidelity; an independent review specifically cautions that the letter of intent and roadmap can change.
              Tracxn supplies a directional peer set including Keyfactor, GitGuardian, AKEYLESS, Astrix, Token Security,
              and Clutch Security, but its score and funding table are not a like-for-like public-company multiple set.
              These references help define category breadth, not a defensible comp-derived enterprise value. No public
              source in the assigned pool supplies comparable revenue multiples, so precision would be false.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV017
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV012
              - CV017
              - CV019
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with high uncertainty and a high risk rating. The strategic logic is
              supported by Cyera's stated plan to unite data and identity security, by independent commentary on the
              scarcity of non-human identity capability, and by Oasis's documented lifecycle product surface. The price
              conclusion is deliberately narrower: public evidence supports strategic importance and a reported $1
              billion headline, but not fair value, investor proceeds, or a target return. The decision should move
              toward a more positive valuation stance only after signed closing terms, consideration mix, preference
              treatment, and standalone operating metrics are obtained. Thesis-break indicators are a failed or
              materially repriced transaction, loss of key product functionality after integration, evidence that
              customer adoption does not convert to durable recurring revenue, or concentration and renewal metrics that
              make the category position economically fragile. Exit readiness is consequently conditional on transaction
              completion and retention of Oasis's technical and customer momentum inside Cyera.
            claimRefs:
              - CV016
              - CV017
              - CV019
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No false precision
            body: >-
              No revenue multiple, target return, or probability-weighted enterprise value is presented because public
              evidence in this pool does not disclose the required denominators or signed transaction terms.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV010
              - CV015
              - CV017
