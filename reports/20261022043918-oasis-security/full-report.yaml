      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The apparent operating model combines an agentless SaaS control plane with connectors or integrations into
              enterprise environments and adjacent security systems. The Wiz integration is concrete evidence of one
              pathway: Wiz Issues and DSPM findings are correlated with Oasis identity, privilege, usage, and ownership
              context, after which teams can initiate attestation, hygiene, right-sizing, key rotation, or
              decommissioning workflows. This architecture is strategically useful because it connects cloud findings to
              the machine identity behind access rather than leaving remediation at the resource level. However, the
              sources do not disclose the connector catalogue, collection protocols, tenant isolation model, data
              residency, latency, failure handling, or whether lifecycle actions are fully automated versus
              approval-assisted.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
