      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Pricing is not publicly disclosed, so competitive economics cannot be compared on a verified per-identity
              or per-system basis. The available review describes an annual enterprise subscription scoped by identity
              count and connected systems, sold through a sales-led proof-of-value process; this is a directional
              packaging signal, not realized pricing. Switching costs should rise when Oasis is connected to production
              identities and remediation workflows, because rotation, decommissioning, and ownership decisions must
              avoid operational impact. However, the same integration surface can favor broader platforms with existing
              distribution. The Cyera transaction is adverse to durable standalone independence: TechCrunch reports a
              roughly $1 billion letter of intent and says Cyera plans to integrate Oasis into a unified identity and
              data-security platform. Deal terms were not closed in the prefetched evidence, so the strategic
