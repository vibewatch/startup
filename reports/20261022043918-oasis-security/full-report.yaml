  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise buyers, users, and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              Oasis is positioned for large enterprises whose security, identity, and engineering teams must govern
              service accounts, secrets, API keys, certificates, and AI agents across hybrid environments. The buyer is
              most plausibly the CISO organization or identity-security leadership, while identity operations,
              cloud-security teams, application owners, and developers are the day-to-day users required to assign
              ownership and execute lifecycle actions. Company materials span IaaS, SaaS, PaaS, and on-premises systems
              and name major identity providers, vaults, data platforms, developer systems, and AI applications. This
              breadth supports a cross-environment enterprise workflow, but it does not reveal customer mix by
              geography, vertical, company size, or revenue band. Independent directory coverage likewise describes an
              enterprise non-human-identity focus rather than a quantified segment distribution.
            claimRefs:
              - CU001
              - CU002
              - CU011
          - type: table
            tableRef: TU001
