              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability and concentration remain private as ownership changes
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence does not disclose an active-customer count, NRR, GRR, churn, renewal rates,
              contract duration, cohort behavior, expansion revenue, or top-customer concentration. These are not merely
              missing dashboard metrics: without them, investors cannot distinguish broad logo acquisition from durable
              production use or test whether a small number of enterprises or partners drives revenue. An independent
              identity review describes Oasis as best suited to enterprises seeking lifecycle and rotation workflows,
              but also flags opaque pricing, sales-led procurement, and proof-of-value onboarding. The pending Cyera
              transaction introduces another durability variable. Oasis promises continuity for customers, team,
              platform, and roadmap, while independent coverage notes that only a letter of intent existed and that
              post-acquisition integration depth and vendor lock-in remain execution questions.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
