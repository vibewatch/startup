      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof does not yet establish revenue durability
            body: >-
              One named testimonial and several anonymous outcomes support product relevance, but the public file does
              not establish how many customers are active, how many pilots convert, whether cohorts renew, or how
              concentrated revenue is.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
