  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and user workflow
        blocks:
          - type: paragraph
            body: >-
              Oasis Security is positioned as an enterprise platform for non-human identities such as service accounts,
              secrets, API keys, tokens, certificates, bots, and AI agents. The user problem is operational rather than
              merely inventory: security teams need to identify machine identities, determine who owns them and what
              they can reach, assess whether they are active, and take lifecycle action without breaking production.
              SecurityWeek describes an agentless connection to customer environments with continuous observation,
              resource and privilege context, severity scoring, and remediation recommendations. The public record
              therefore supports a workflow from discovery and posture assessment to ownership, prioritization, and
              remediation, but does not establish measured discovery coverage, time-to-value, or production success
              rates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
