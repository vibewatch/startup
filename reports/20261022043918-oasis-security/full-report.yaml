chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Oasis Security was founded in 2022 and built a cybersecurity platform for non-human identities, including
              service accounts, API keys, secrets, and AI agents. The available evidence describes a lifecycle-oriented
              product: discovery and inventory, ownership attribution, posture monitoring, governance, rotation,
              remediation, and decommissioning across cloud, SaaS, and on-premises environments. A Wiz integration
              describes the operating workflow more concretely by correlating cloud issues and data-security findings
              with identity privilege, usage, and ownership before teams take actions such as attestation, key rotation,
              right-sizing, or decommissioning. Independent review evidence characterizes Oasis as complementary to an
              existing identity provider and secrets manager rather than a replacement for human SSO or MFA. Pricing is
              not public, so the commercial model and current revenue remain diligence gaps.
