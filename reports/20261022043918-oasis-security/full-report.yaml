        title: Differentiation, capability, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Oasis's main distinction being operational depth: discovery is paired with
              ownership attribution, posture, rotation, attestation, hygiene, right-sizing, and decommissioning. An
              independent category review says Oasis pushes “past inventory into lifecycle and remediation workflows,”
              while also documenting boundaries: it is not an identity provider, human authentication, SSO, or MFA
