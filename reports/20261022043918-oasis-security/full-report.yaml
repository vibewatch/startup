      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by the proliferation of autonomous agents and machine credentials, the inadequacy of
              human-centric access controls, and the operational need to move from inventory to safe remediation.
              Constraints are equally material: Start With Identity describes opaque pricing, a sales-led proof-of-value
