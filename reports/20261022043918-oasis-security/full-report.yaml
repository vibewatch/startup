      xAxis:
        label: Evidence-backed NHI lifecycle depth (ordinal 0–10)
        min: 0
        max: 10
      yAxis:
        label: Potential distribution breadth (ordinal 0–10)
        min: 0
        max: 10
    approximationNotes: >-
      Coordinates are analyst ordinal scores synthesized from the assigned sources' described scope and distribution
      signals; they are not measured market share, customer counts, or benchmark results.
    claimRefs:
      - CP005
      - CP007
      - CP011
  - id: FI001
    title: Supported revenue-model bridge
    type: flow
    summary: >-
      Public evidence supports the path from enterprise identity scope to a sales-led annual subscription, but it does
      not quantify contract value, revenue, or gross profit.
    data:
      nodes:
        - id: enterprise-estate
          label: Enterprise non-human identity estate
          detail: Service accounts, secrets, tokens, certificates, and AI-agent identities
        - id: discovery-context
          label: Discovery and ownership context
          detail: Inventory, ownership, privilege, usage, and connected-system context
        - id: posture-prioritization
          label: Posture and risk prioritization
          detail: Findings are ranked using privilege, data sensitivity, usage, and blast radius
        - id: lifecycle-actions
          label: Lifecycle and remediation workflows
          detail: Attestation, hygiene, rotation, right-sizing, and decommissioning
        - id: proof-of-value
          label: Sales-led proof of value
          detail: Enterprise evaluation step; duration, cost, and conversion are unavailable
        - id: annual-subscription
          label: Annual enterprise subscription
          detail: Scoped by identity count and connected systems; price and gross profit unavailable
      edges:
        - from: enterprise-estate
          to: discovery-context
          label: inventory
        - from: discovery-context
          to: posture-prioritization
          label: enrich
        - from: posture-prioritization
          to: lifecycle-actions
          label: remediate
        - from: lifecycle-actions
          to: proof-of-value
          label: demonstrate outcome
        - from: proof-of-value
          to: annual-subscription
          label: contract
    approximationNotes: >-
      The sequence is a supported commercial mechanism, not a quantified conversion funnel; no conversion rate, contract
      value, recognized revenue, cost, or gross-profit figure is public.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI014
  - id: FE001
    title: Oasis Security product architecture map
    type: stack
    summary: The public evidence supports a layered path from environment telemetry to identity-aware governance actions.
    data:
      layers:
        - label: Connected environments
          detail: Customer environments and machine identity assets observed through an agentless connection.
          modules:
            - Cloud and hybrid workloads
            - Service accounts, secrets, tokens, and certificates
        - label: Identity context
          detail: Context used to assign accountability and understand access.
          modules:
            - Ownership and consumers
            - Privilege and usage
        - label: Risk prioritization
          detail: Risk scoring and identity-aware security-finding context.
          modules:
            - Severity and posture
            - Blast-radius correlation
        - label: Lifecycle governance
          detail: Governance and remediation actions described in the integration.
          modules:
            - Attestation and hygiene
            - Rotation and decommissioning
        - label: Trust and control plane
          detail: Publicly stated safety objectives that require validation before production automation.
          modules:
            - Approval gates
            - Audit and rollback evidence
        - label: Product maturity boundary
          detail: Scope and roadmap claims that remain incompletely independently validated.
          modules:
            - AI-agent coverage
            - Reliability and certification diligence
    approximationNotes: >-
      The stack is a conceptual rendering of documented product workflows, not a disclosed software-component diagram or
      proof of implementation depth.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE013
      - CE016
  - id: FU001
    title: Enterprise customer journey and evidence breaks
    type: journey-map
    summary: >-
      Public evidence covers problem recognition through proof of value, but becomes sparse at production measurement,
      renewal, and expansion.
    data:
      nodes:
        - id: trigger
          label: Risk trigger
          detail: NHI sprawl, cloud findings, secret rotation burden, or AI-agent access creates urgency.
        - id: evaluation
          label: Enterprise evaluation
          detail: Sales-led process and proof of value; pricing is not public.
        - id: integration
          label: Integration
          detail: Connect identity providers, vaults, cloud/data platforms, and partner findings.
        - id: remediation
          label: Govern and remediate
          detail: Assign ownership, attest, rotate, right-size, and decommission identities.
        - id: outcome
          label: Outcome proof
          detail: JLL testimonial plus anonymous efficiency, risk, outage, and POV outcomes.
        - id: renewal
          label: Renewal and expansion
          detail: NRR, GRR, churn, renewal, cross-sell, and concentration are not publicly disclosed.
    approximationNotes: >-
      Stages synthesize the retained evidence; they are not measured conversion stages and no conversion rates are
      implied.
    claimRefs:
      - CU001
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
