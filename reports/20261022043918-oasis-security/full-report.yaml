          value: Strategic relevance
        - id: proof
          label: Product and partner proof
          value: Lifecycle governance and integrations
        - id: deal
          label: Reported acquisition
          value: $1B; LOI status
        - id: gaps
          label: Valuation evidence gaps
          value: ARR, margins, retention, terms
        - id: risk
          label: Execution and integration risk
          value: Closing and product fidelity
        - id: decision
          label: Recommendation
          value: Research-more
      edges:
        - from: scale
          to: proof
        - from: proof
          to: deal
        - from: deal
          to: gaps
        - from: gaps
          to: risk
        - from: risk
          to: decision
    claimRefs:
      - CV001
