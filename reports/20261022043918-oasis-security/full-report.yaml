  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              Oasis addresses non-human identities such as service accounts, secrets, tokens, certificates, API keys,
              service principals, and AI agents. The closest direct alternatives are specialist machine-identity vendors
              including Astrix, Token Security, Clutch Security, and GitGuardian, while Keyfactor, Venafi, and AppViewX
              represent incumbent or adjacent certificate, PKI, and machine-identity automation capabilities. Cyera is
              an important strategic incumbent after signing a letter of intent to acquire Oasis, and Wiz is an adjacent
              cloud-security platform with an Oasis integration. The status quo remains a fragmented mix of
              identity-provider, secrets-manager, cloud-security, and internally scripted workflows; a buyer may
              therefore compare a specialist purchase with extending existing controls rather than selecting among
              identical products.
