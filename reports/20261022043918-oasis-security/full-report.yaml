      - number: '6.2'
        title: Adoption evidence is concrete but selectively disclosed
        blocks:
          - type: paragraph
            body: >-
              The strongest named proof is a 2024 JLL testimonial in an Oasis-issued release: JLL's head of identity
              security said the product improved visibility, lifecycle automation, security, and governance. The current
              homepage adds four outcome examples, including avoided regulatory exposure, lower secret-rotation effort,
              outage containment, and attack-surface reduction. Those examples show relevant enterprise pain and
              measurable value, yet the customers are unnamed and one result is explicitly described as occurring during
              a proof of value. The evidence therefore establishes use-case resonance more strongly than repeatable,
              production-scale adoption. A Wiz integration page provides partner-issued proof that joint customers can
              connect cloud findings to identity remediation, but it reports no deployment count, realized customer
              outcome, or commercial channel contribution.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
