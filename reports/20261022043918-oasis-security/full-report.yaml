      - number: '5.3'
        title: Maturity, differentiation, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Public descriptions consistently distinguish Oasis from a human identity provider: its focus is the
              lifecycle of machine identities, including discovery, ownership attribution, posture, rotation, and
              decommissioning. The product's differentiating promise is operational closure rather than a dashboard,
              especially the ability to prioritize by blast radius and safely execute remediation. A community review
              says pricing is opaque, deployment is SaaS-only, and human SSO and MFA are out of scope; it also
              characterizes AI-agent coverage as part of the roadmap. Those statements are useful external checks on
              scope, but they are not independently audited product benchmarks. The category appears early, and the
              evidence does not establish feature parity, implementation duration, or a durable technical moat.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Oasis's product value depends on acting safely on identities that may power production workloads. The Wiz
              integration explicitly frames safe rotation, right-sizing, and decommissioning as actions that should
              avoid production impact, while the company's earlier product description emphasizes risk scoring and
              tailored remediation recommendations. These are important control objectives, not proof that the controls
              work under all failure modes. No assigned source provides a public security architecture, independent
              certification, incident history, uptime commitment, penetration-test summary, privacy posture, or
              quantified false-positive and rollback performance. A buyer should therefore test permissions, approval
              gates, auditability, connector failure behavior, rollback, and evidence retention in a proof of
              value       before relying on automated lifecycle actions.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
