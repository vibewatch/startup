callouts:
  - calloutType: "risk"
    title: "Antitrust Reclassification as a Thesis-Breaking Event"
    body: "The primary existential risk facing Groq is the potential retroactive reclassification of its December 2025 Nvidia transaction by antitrust authorities. With U.S. Senators challenging the deal under the Sherman Act and the FTC scrutinizing reverse acquihires, any regulatory enforcement that rescinds IP licensing rights or restricts Nvidia capital participation would invalidate Groq's neocloud strategy and severely impair investor recovery."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR011"
      - "CR014"
  - calloutType: "insight"
    title: "The Neocloud Capital Trap and Asymmetric Incumbent Dependence"
    body: "Groq's strategic shift from a pure-play custom AI chip designer to a GPU-based neocloud provider significantly alters its risk profile. Rather than competing with Nvidia on proprietary LPU silicon, Groq is now dependent on Nvidia for hardware allocation and investment while taking on heavy data center capital expenditures. In a market where 75% of specialized hardware startups face consolidation or insolvency, scaling from 54MW to 200+MW risks creating a debt-burdened infrastructure operator vulnerable to rapid hardware depreciation."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR010"
