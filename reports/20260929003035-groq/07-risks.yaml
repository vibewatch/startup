company:
  name: Groq
chapter:
  number: 7
  title: Risks
  summary: Groq faces execution, supplier, financing and legal-interpretation questions after its reported Nvidia licensing
    arrangement and senior personnel departures. Retained commentary reports a March 2026 Senate inquiry but does not supply
    underlying government records or establish a Groq-specific enforcement outcome. Reported capacity plans and announced
    financing do not disclose debt, cash or runway. Risk priorities are analyst judgments, not measured event probabilities.
sections:
- id: regulatory-antitrust-deal-structure
  title: Regulatory Scrutiny, Antitrust Exposure, and Deal Structure
  body: Retained sources describe a reported December 2025 licensing-and-hiring arrangement between Groq and Nvidia, but differ
    in their characterization of asset transfer. CIO describes non-exclusive licensing rather than an asset or stock purchase,
    while other commentary uses acquisition terminology. The underlying transaction documents were not reviewed, so ownership
    transfer of all IP is not established. IntuitionLabs and Angel Investors Network report a March 2026 Senate inquiry; those
    secondary accounts are not the original letter, an FTC or DOJ enforcement filing, or a legal finding. Alumni Ventures,
    which identifies itself as a Groq investor, discusses possible scrutiny by analogy with other transactions. Such commentary
    supports a diligence question, not a verified blocked acquisition, calibrated enforcement probability or known remedy
    schedule. Legal significance depends on actual agreements and current primary records.
  claimRefs:
  - CR001
  - CR003
  - CR011
  - CR014
  tableRefs:
  - TR001
- id: operational-execution-talent-transition
  title: Operational Viability and Talent Transition Post-Acquihire
  body: Founder Jonathan Ross, president Sunny Madra and senior technical personnel reportedly moved to Nvidia following the
    December 2025 arrangement. Early-2026 commentary describes Simon Edwards taking the CEO role after that transaction; it
    does not verify the current September 2026 executive roster. CIO quotes Gartner analyst Gaurav Gupta expressing concern
    about the remaining company's capability, which is an opinion rather than demonstrated permanent technological impairment.
    The same January 2026 article reports a Gartner forecast that 75% of AI startups offering custom compute silicon for data
    centers will be acquired or go bankrupt by 2029. That combines different outcomes and does not measure Groq's bankruptcy
    probability or describe all neocloud operators. Retained engineering capability, roadmap ownership, current management
    and workload delivery require specific evidence rather than inference from a sector forecast.
  claimRefs:
  - CR002
  - CR004
  - CR006
  - CR010
  tableRefs:
  - TR002
- id: partner-dependency-contractual-liability
  title: Strategic Partner Dependencies, Terms of Service, and SLA Transparency
  body: Groq's Nvidia Cloud Partner role and licensing relationship create supplier-dependency questions; Nvidia participation
    in the August 2026 financing remains planned, not established as a completed investment. Contractual protection also depends
    on the applicable customer agreement rather than a generic procurement checklist. Section 14.2 ordinarily caps each party's
    aggregate cloud-services damages at fees paid for those services during the 12 months before the event; Groq's beta/free-service
    damages are capped at $5,000. Section 14.3 excludes either party's fraud or fraudulent misrepresentation, gross negligence
    or willful misconduct, indemnification obligations, infringement of the other party's IP, payment obligations, confidentiality
    breaches and legally non-excludable matters from these limits. The Services Agreement defines URL Terms to include service-level
    agreements and permits separately purchased service commitments. RFP.wiki's category checklist identifies issues to test
    and says paid or enterprise contracts have stronger SLA detail; it does not document a blanket absence of enforceable
    remedies at Groq. Diligence should inspect the customer's order, supplemental terms, service-credit conditions and actual
    workload requirements instead of asserting that every enterprise SLA is missing or unenforceable.
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR013
  tableRefs:
  - TR003
- id: financial-sustainability-risk-matrix
  title: Neocloud Capital Intensity, Valuation Compression, and Thesis-Break Triggers
  body: Groq faces capital-expenditure and execution risk as it adds Nvidia-accelerated infrastructure to its LPU business.
    The August 2026 company release announces $350M at a $3.5B valuation, led by Disruptive with planned Nvidia participation
    and subject to customary closing conditions. Combining that announcement with the reported June $650M raise does not establish
    current cash or runway. The company reports 13 data centers and plans to expand from 54 MW to more than 200 MW in 2027,
    rather than documenting a completed expansion or contracted utilization. TechCrunch discusses neocloud-sector concerns
    about debt, depreciation and cash-flow conversion using CoreWeave as an example; it does not disclose Groq debt or demonstrate
    that Groq has the same financing structure. Relevant downside conditions include delayed power delivery, insufficient
    customer demand, restricted supplier access or adverse regulatory action. Their probability, timing and financial effect
    cannot be calibrated from the retained public evidence.
  claimRefs:
  - CR005
  - CR006
  - CR010
  - CR012
  figureRefs:
  - FR001
