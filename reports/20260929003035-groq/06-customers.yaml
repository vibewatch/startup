    body: "While Groq attracts massive top-of-funnel developer adoption with generous free tiers and ultra-low per-token costs on standard models, standard accounts cannot self-serve custom fine-tuned weights. Gating LoRA hosting behind enterprise approval creates friction that drives teams needing customized models to competing platforms like Fireworks AI or Together AI."
