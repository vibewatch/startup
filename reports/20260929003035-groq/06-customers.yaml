callouts:
  - calloutType: risk
    title: Enterprise Gating Restricts Developer Self-Serve Expansion
    body: Deepak Gupta's August 2026 comparison reports that standard Groq accounts cannot upload custom fine-tuned weights directly and that LoRA hosting is Enterprise-tier and request-based. This is an account-eligibility and workflow consideration, not measured evidence that customization causes churn. Teams need current model support, commercial terms and their own workload evaluation; the retained comparison does not establish that a single alternative deployment path is mandatory.
    claimRefs:
      - CU004
      - CU005
  - calloutType: insight
    title: Partner Channels Do Not Establish Revenue Mix
    body: IBM's October 2025 announcement and Welcome AI's Hugging Face coverage describe routes to enterprise and developer users. They do not reveal how much Groq revenue comes through partners, whether direct sales are secondary, or whether the company can avoid building a sales organization. IBM's immediate access offer and reported use cases remain distinct from its planned integrations and from independently measured customer outcomes.
    claimRefs:
      - CU002
      - CU006
