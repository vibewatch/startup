company:
  name: Groq
chapter:
  number: 6
  title: Customers
  summary: Groq reports serving more than six million developers, but that reach is not a paying-customer, registered-account or active-usage measure. Evidence includes IBM's October 2025 partnership announcement, third-party McLaren coverage and older Moxie, Argonne and Aramco examples whose current continuity is not established. Contract values, revenue mix, conversion and retention remain undisclosed; they cannot be inferred from partner names or hardware configurations.
sections:
  - id: customer-segmentation
    title: Customer Base Segmentation & Market Profile
    body: The retained evidence supports several possible customer access routes rather than a measured commercial segmentation. Groq's August 2026 release says it serves more than six million developers, separately Fortune 500 enterprises and thousands of AI-native companies; it does not define registered, active, paying or self-serve cohorts. Public API documentation and pricing articles describe developer access, while IBM's October 2025 announcement establishes a partner distribution route for enterprise workflows. Older coverage discusses hardware use by research and sovereign organizations. These examples do not show which route contributes most revenue, whether enterprise procurement is predominantly indirect, or whether historical hardware arrangements continue unchanged. Contract values, customer concentration and segment-level economics require company data rather than inference from recognizable names.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU006
      - CU009
      - CU010
      - CU012
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory
    title: Adoption Trajectory & Developer Velocity
    body: Company-reported developer reach and token volume are different measures from revenue-producing adoption. The August 2026 release reports more than six million developers, 13 data centers and trillions of weekly tokens, without active-account, paying-account or free-versus-billable denominators. The retained eesel and Deepak Gupta pricing snapshots quote Llama 3.1 8B at $0.05 per million input and $0.08 per million output tokens; those dated third-party observations are not independently confirmed September 2026 quotes or proof of matched-workload cost superiority. A no-credit-card free tier and account or organization limits provide evaluation routes, but the evidence does not measure their causal effect on conversion. Token throughput, price and developer reach cannot establish retention or sustainable monetization without cohort, utilization and margin data.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU012
      - CU014
    tableRefs:
      - TU002
  - id: enterprise-deployments
    title: Enterprise Deployments & Strategic Case Studies
    body: The named examples have different evidence types and time bases. IBM's October 20, 2025 announcement offers immediate GroqCloud access through watsonx Orchestrate and describes company-reported healthcare and HR use cases, while Red Hat vLLM enhancements and Granite support remain plans in that release. It supplies no independently measured sub-second outcome. The retained eesel article mentions McLaren using Groq for real-time race analytics, but not the generated Grand Prix telemetry details or verified production performance. VMblog describes Moxie and Argonne in a historical press-tour account discussing 2023/2024 shipment expectations; that does not establish September 2026 continuity. Value Add VC retrospectively describes pre-December-2025 GroqRack sales and an Aramco multi-rack example. Its generic 64-to-576-plus chip range is not a verified count for that customer.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU011
    tableRefs:
      - TU003
  - id: retention-and-concentration
    title: Expansion Barriers, Retention Gaps & Customer Concentration Risks
    body: Customization requirements may affect how a developer evaluates Groq, but the retained evidence does not measure customer churn caused by those requirements. Deepak Gupta's August 2026 comparison describes LoRA hosting as Enterprise-tier and request-based rather than a standard self-serve upload, making model fit and account terms relevant diligence questions. That observation is not proof that particular teams left or that every custom workload must use a competing GPU service. IBM and Hugging Face coverage indicates distribution options, not a disclosed direct-versus-partner sales mix or proof that channel partnerships replace a salesforce. The retained sources do not establish current NRR, GRR, churn, average contract value, duration or customer concentration. Historical hardware cases also do not disclose current maintenance revenue or renewal economics.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU009
      - CU010
      - CU013
      - CU014
