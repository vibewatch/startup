  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Selected primary partner announcement and attributed secondary or historical examples; not a verified current production-customer inventory.
    columns:
      - Customer / Partner
      - Segment
      - Deployment / Use Case
      - Evidence Type and Time Context
      - Reported Observation, Not Independently Measured Outcome
      - Diligence Limitation
    rows:
      - - IBM (watsonx Orchestrate)
        - Enterprise Platform Partner
        - Immediate GroqCloud access and company-reported healthcare/HR use cases in the October 20, 2025 release
        - Primary partnership announcement; vLLM enhancement and Granite support were planned
        - IBM reports use cases but supplies no measured sub-second result or independent outcome study
        - Current rollout, client volumes, revenue split and completion of planned integrations require verification
      - - McLaren F1 Team
        - Third-Party Reported Commercial Example
        - eesel article mentions real-time race analytics
        - Secondary pricing-article example; no inspected McLaren case study
        - No supported event-specific telemetry, latency measurement or independently verified production result
        - Current usage, contractual relationship and hardware footprint remain unverified
      - - Aramco Digital
        - Historical Sovereign/Enterprise Example
        - Value Add VC describes a multi-rack GroqRack example in its retrospective of the pre-December-2025 business
        - Historical secondary reporting, not September 2026 production verification
        - The 64-to-576-plus LPU range describes generic configurations, not a verified Aramco chip count
        - Current hardware, contracts, maintenance and post-transaction support continuity require confirmation
      - - Embodied (Moxie)
        - Historical Robotics Example
        - VMblog describes Groq hardware/platform services and a Moxie conversational demonstration
        - Historical press-tour context discussing the 2023/2024 shipment outlook
        - Reported responsiveness and demonstration, not a current measured production outcome
        - Current operation, volumes and contract continuity are not established; no cessation date is inferred
    notes: These entries have different dates, publishers and verification levels. An announcement or historical demonstration is not evidence of ongoing September 2026 production, retention or commercial performance. IBM offered access immediately but separately described future integrations; preserve both distinctions.
