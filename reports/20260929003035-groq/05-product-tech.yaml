chapter:
  number: 5
  title: "Product & Technology"
  summary: "Groq's documented product surface includes an OpenAI-compatible inference API and a broad integration catalog. Company announcements also describe expanded Nvidia-accelerated infrastructure for training and inference; the August financing remains subject to closing, with Nvidia participation planned rather than completed. Historical LPU architecture is documented in a company technical presentation and practitioner accounts, but current independent performance, reliability, security and post-pivot roadmap evidence remains insufficient for technical investment assessment."
sections:
  - id: "product-surfaces-and-workflows"
    title: "Product Surfaces and Customer Workflows"
    body: "The clearest current entry point is GroqCloud's OpenAI-compatible API: the official quickstart uses standard OpenAI clients with Groq's base URL, reducing application-level switching work for teams already using that interface. Groq also publishes an integration catalog spanning agent frameworks, browser automation, observability, sandboxed code execution, voice, Model Context Protocol connections, and hardware-oriented applications. These pages establish breadth of developer surfaces, not production adoption, support quality, or service levels for each listed integration. Current reporting adds a second product track: larger NVIDIA accelerated-computing clusters for training and inference, which broadens Groq from an LPU inference endpoint into a more general infrastructure provider."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs: []
  - id: "lpu-architecture"
    title: "LPU Architecture and Compiler-Controlled Execution"
    body: "Groq's durable technical thesis is to move scheduling complexity out of runtime hardware and into the compiler. A 2024 presentation by Groq chief architect Igor Arsovski describes software-controlled memory, no dynamic hardware caching, 220 MiB of on-chip memory at 80 TBps, cycle-accurate instruction scheduling, and a network whose messages are compiler scheduled. Independent practitioner articles broadly describe the same deterministic model, although they are not neutral laboratory benchmarks. The architecture is best suited to predictable tensor programs: one technical review says complex dynamic control flow falls back to the host CPU, while another flags meaningful compile time when a model changes. Low-level microarchitecture remains proprietary, limiting external verification of current implementations."
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-and-roadmap"
    title: "Deployment Model and 2026 Infrastructure Direction"
    body: "As of August 2026, Groq said it operated 13 data centers across four broad regions and served more than six million developers. Both Groq and TechCrunch reported a plan to scale power capacity from 54 megawatts to more than 200 megawatts in 2027. TechCrunch characterized the company as pivoting from a pure AI-chip vendor toward a neocloud operating NVIDIA systems after a licensing transaction and senior technical departures; Groq separately identified itself as an NVIDIA Cloud Partner certified to operate to NVIDIA reference architecture. The reported footprint and capacity trajectory are useful maturity signals, but they do not disclose delivered availability, utilization, redundancy, incident history, or how LPU and NVIDIA capacity are allocated."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs: []
    figureRefs: []
  - id: "trust-reliability-and-diligence"
    title: "Trust, Reliability, Compliance, and Technical Diligence"
    body: "The assigned evidence does not include an official trust center, security architecture, privacy and retention specification, status history, service-level agreement, certification report, or incident record. That absence is an evidence gap, not evidence that controls or incidents do not exist. A Baytech Consulting review says standard inference is covered by a HIPAA Business Associate Addendum while Compound and Built-In Tools are excluded, but this material boundary needs confirmation in Groq's current contractual documents before regulated use. Technical diligence should also separate historical LPU claims from the current neocloud: obtain model-specific latency distributions, workload and batch assumptions, availability by region, failover behavior, compiler support matrices, current silicon roadmap, and support ownership for third-party integrations."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE013"
      - "CE014"
    tableRefs: []
    figureRefs: []
