companyProfile:
  summary: >-
    Groq began in 2016 as an AI accelerator company and developed its LPU technology and GroqCloud inference service.
    Historical sources describe Groq, Inc., while the August 2026 funding announcement names Groq LLC; legal and
    shareholder continuity are not established by the brand alone. After a reported December 2025 Nvidia licensing
    transaction and senior leadership departures, the company describes plans to combine LPU operations with
    Nvidia-accelerated clusters for training and inference. Its 13-site footprint and developer reach are
    company-reported. Planned expansion, announced financing and technical performance claims do not establish available
    cash, durable commercial advantage or profitable unit economics.
  founders:
