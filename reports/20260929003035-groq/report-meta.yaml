  headquarters: Mountain View, California (historical profiles; current Groq LLC address unverified)
  productSummary: >-
    Groq sells low-latency inference access through GroqCloud and related enterprise capacity, alongside a post-pivot
    neocloud footprint built around Nvidia-accelerated infrastructure.
  customerFocus: Developers, AI-native companies, and enterprise infrastructure teams that need fast inference capacity.
  businessModel: Usage-based inference plus enterprise and dedicated capacity arrangements.
  stage: private; announced 2026 Series A
  fundingStatus: >-
    On August 17, 2026, Groq LLC announced a $350M Series A at a $3.5B valuation, led by Disruptive with planned Nvidia
    participation and subject to customary closing conditions. Together with the reported $650M June raise, this is $1B
    of recent financing context, not disclosed cash or a reconciled lifetime total.
