companyProfile:
  summary: >-
    Groq is a late-stage private AI inference infrastructure company founded in 2016 by former Google engineers Jonathan
    Ross and Douglas Wightman and headquartered in Mountain View, California. It began as a custom LPU silicon vendor,
    then pivoted after a reported December 2025 Nvidia licensing transaction into a broader neocloud operator with
    GroqCloud, Nvidia-backed clusters, and a 13-data-center footprint. The company now pairs a low-latency inference
    product surface with heavy capital requirements and unresolved private financial disclosure.
