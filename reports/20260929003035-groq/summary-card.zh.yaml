    - 净留存率（NRR）、留存、付费客户数和客户集中度数据尚未确认。
    - 8 月融资是否交割、Nvidia 计划参与是否落实，以及法律主体和股东关系是否延续，均需文件确认。
    - Nvidia 和沙特相关安排的经济细节及持续义务仍不透明。
    - 拟扩建设施的实际利用率和可靠性尚未独立核实；现有资料也不足以建立可靠的内在估值或投资者回报模型。
