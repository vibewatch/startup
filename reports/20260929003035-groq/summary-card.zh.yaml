  topStrengths:
    - 公司披露，开发者覆盖逾六百万人，数据中心共 13 座；付费客户数和活跃账户数尚未确认。
    - 据报道，LPU 和 GroqCloud 对特定工作负载有性能优势；商业优势能否持续，仍须用条件匹配的独立证据检验。
    - Disruptive 牵头的融资公告和 Nvidia Cloud Partner 合作关系，为未来扩建提供支持； 交割、资源分配和经营回报仍受条件约束。
  topRisks:
    - 二手资料报道了参议院问询，Nvidia 许可与人员聘用安排的法律定性仍有疑问；尚无独立核实的监管机构处理结果。
    - 创始人和高级技术人员离职后，管理层与工程团队的连续性面临风险。
    - 转型新型算力云厂商需要大量资本开支，单位经济性仍不透明。
  unresolvedGaps:
