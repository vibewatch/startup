  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operational Assumptions
      - Valuation / Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Successful expansion from 54 MW to 200+ MW in 2027; dedicated enterprise clusters achieve >65% gross margin.
        - Valuation expands to $7.0B-$10.0B on strong inference demand and premium multiples.
        - Power procurement delays; hyperscaler pricing competition in LLM inference.
        - Strong developer token volume growth and major Fortune 500 enterprise contract expansion.
      - - Base Case
        - Steady compute utilization across 13 datacenters; margins mirror commodity neoclouds at 35%-45%.
        - Valuation holds near $3.5B-$4.5B entry level, providing modest enterprise appreciation.
        - Hardware obsolescence; margin compression from rival GPU cloud operators.
        - Consistent token throughput but private financial opacity persists.
      - - Bear Case
        - Capacity underutilization; heavy fixed lease and power commitments strain liquidity; talent churn.
        - Valuation compresses below $2.0B or requires additional dilutive recapitalization.
        - Cash burn acceleration; rapid depreciation of server clusters.
        - Secondary market discounts and lack of verified tier-1 enterprise retention.
    notes: Scenarios model the scaling of Groq's inference infrastructure from 54 MW to 200+ MW through 2027.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
