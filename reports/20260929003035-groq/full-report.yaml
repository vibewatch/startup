      - number: '7.4'
        title: Neocloud Capital Intensity, Valuation Compression, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Groq faces capital-expenditure and execution risk as it adds Nvidia-accelerated infrastructure to its LPU
              business. The August 2026 company release announces $350M at a $3.5B valuation, led by Disruptive with
              planned Nvidia participation and subject to customary closing conditions. Combining that announcement with
              the reported June $650M raise does not establish current cash or runway. The company reports 13 data
              centers and plans to expand from 54 MW to more than 200 MW in 2027, rather than documenting a completed
              expansion or contracted utilization. TechCrunch discusses neocloud-sector concerns about debt,
              depreciation and cash-flow conversion using CoreWeave as an example; it does not disclose Groq debt or
              demonstrate that Groq has the same financing structure. Relevant downside conditions include delayed power
              delivery, insufficient customer demand, restricted supplier access or adverse regulatory action. Their
              probability, timing and financial effect cannot be calibrated from the retained public evidence.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
