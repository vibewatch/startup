      - number: '6.4'
        title: Expansion Barriers, Retention Gaps & Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customization requirements may affect how a developer evaluates Groq, but the retained evidence does not
              measure customer churn caused by those requirements. Deepak Gupta's August 2026 comparison describes LoRA
              hosting as Enterprise-tier and request-based rather than a standard self-serve upload, making model fit
              and account terms relevant diligence questions. That observation is not proof that particular teams left
              or that every custom workload must use a competing GPU service. IBM and Hugging Face coverage indicates
              distribution options, not a disclosed direct-versus-partner sales mix or proof that channel partnerships
              replace a salesforce. The retained sources do not establish current NRR, GRR, churn, average contract
              value, duration or customer concentration. Historical hardware cases also do not disclose current
              maintenance revenue or renewal economics.
            claimRefs:
              - CU002
