  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surfaces and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              The clearest current entry point is GroqCloud's OpenAI-compatible API: the official quickstart uses
              standard OpenAI clients with Groq's base URL, reducing application-level switching work for teams already
              using that interface. Groq also publishes an integration catalog spanning agent frameworks, browser
              automation, observability, sandboxed code execution, voice, Model Context Protocol connections, and
              hardware-oriented applications. These pages establish breadth of developer surfaces, not production
              adoption, support quality, or service levels for each listed integration. Current reporting adds a second
              product track: larger NVIDIA accelerated-computing clusters for training and inference, which broadens
              Groq from an LPU inference endpoint into a more general infrastructure provider.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
