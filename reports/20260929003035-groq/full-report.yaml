      - number: '7.2'
        title: Operational Viability and Talent Transition Post-Acquihire
        blocks:
          - type: paragraph
            body: >-
              Founder Jonathan Ross, president Sunny Madra and senior technical personnel reportedly moved to Nvidia
              following the December 2025 arrangement. Early-2026 commentary describes Simon Edwards taking the CEO role
              after that transaction; it does not verify the current September 2026 executive roster. CIO quotes Gartner
              analyst Gaurav Gupta expressing concern about the remaining company's capability, which is an opinion
              rather than demonstrated permanent technological impairment. The same January 2026 article reports a
              Gartner forecast that 75% of AI startups offering custom compute silicon for data centers will be acquired
              or go bankrupt by 2029. That combines different outcomes and does not measure Groq's bankruptcy
              probability or describe all neocloud operators. Retained engineering capability, roadmap ownership,
              current management and workload delivery require specific evidence rather than inference from a sector
              forecast.
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR010
