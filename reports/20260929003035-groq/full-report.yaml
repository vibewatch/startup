      - number: '1.2'
        title: Governance Rebuild and Key-Person Transition
        blocks:
          - type: paragraph
            body: >-
              The December 2025 transaction precipitated an unprecedented leadership transition that reshuffled Groq's
              governance structure and executive bench. Following Jonathan Ross's departure to Nvidia, Adam Winter
              assumed the chief executive officer role in 2026, having originally joined Groq in 2024 to lead
              international business operations. Groq's governance shifted heavily toward its institutional financial
              sponsors, notably Dallas-based growth firm Disruptive. Alex Davis, founder and CEO of Disruptive, serves
              as Groq's executive chairman, actively guiding corporate strategy and data center expansion. The executive
              suite underwent a comprehensive rebuild with the appointments of Matt Eng as chief financial officer, Alan
              Rice as chief operating officer, Sinclair Schuller as chief technology officer, and Rakesh Malhotra as
              chief product officer. While this seasoned bench brings operational discipline to neocloud scaling, the
              mass exodus of Groq's founding architecture team to Nvidia represents an acute key-person departure,
              leaving ongoing silicon differentiation dependent on residual licensing terms and software orchestration.
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO011
      - number: '1.3'
        title: Capital Structure, Reset Valuation, and Neocloud Capacity
        blocks:
          - type: paragraph
            body: >-
              Groq's financing trajectory reflects two distinct corporate eras: an initial chip-venture track that
              culminated in a $6.9 billion valuation in September 2025, and a restructured neocloud era operating under
              an adjusted capital base. After returning capital to earlier investors via the Nvidia transaction, Groq
              secured $650 million in June 2026, followed on August 17, 2026, by a $350 million Series A fundraise led
              by Disruptive with planned investment from Nvidia. This round formally established a $3.5 billion
              valuation for the post-licensing entity, which company representatives framed as a new-entity baseline
              rather than a traditional down round. Cumulatively, Groq has raised $1.0 billion in fresh equity for its
              restructured business, alongside prior historical funding exceeding $2.4 billion. Operationally, Groq
              manages 13 data centers across North America, Europe, the Middle East, and Asia Pacific, serving over six
              million developers and thousands of AI-native enterprises generating trillions of tokens weekly. To meet
              surging enterprise compute demand, Groq plans to expand its operational footprint from 54 megawatts to
              more than 200 megawatts in 2027. However, verified audited financials, operating margins, and trailing
              cash flows remain undisclosed private metrics.
            claimRefs:
              - CO003
              - CO007
              - CO009
              - CO010
              - CO012
              - CO014
              - CO015
              - CO016
