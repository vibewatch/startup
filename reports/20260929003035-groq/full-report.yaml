      - number: '7.3'
        title: Strategic Partner Dependencies, Terms of Service, and SLA Transparency
        blocks:
          - type: paragraph
            body: >-
              Groq's Nvidia Cloud Partner role and licensing relationship create supplier-dependency questions; Nvidia
              participation in the August 2026 financing remains planned, not established as a completed investment.
              Contractual protection also depends on the applicable customer agreement rather than a generic procurement
              checklist. Section 14.2 ordinarily caps each party's aggregate cloud-services damages at fees paid for
              those services during the 12 months before the event; Groq's beta/free-service damages are capped at
              $5,000. Section 14.3 excludes either party's fraud or fraudulent misrepresentation, gross negligence or
              willful misconduct, indemnification obligations, infringement of the other party's IP, payment
              obligations, confidentiality breaches and legally non-excludable matters from these limits. The Services
              Agreement defines URL Terms to include service-level agreements and permits separately purchased service
              commitments. RFP.wiki's category checklist identifies issues to test and says paid or enterprise contracts
              have stronger SLA detail; it does not document a blanket absence of enforceable remedies at Groq.
              Diligence should inspect the customer's order, supplemental terms, service-credit conditions and actual
              workload requirements instead of asserting that every enterprise SLA is missing or unenforceable.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
