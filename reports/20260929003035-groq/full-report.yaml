      - number: '5.2'
        title: LPU Architecture and Compiler-Controlled Execution
        blocks:
          - type: paragraph
            body: >-
              Groq's durable technical thesis is to move scheduling complexity out of runtime hardware and into the
              compiler. A 2024 presentation by Groq chief architect Igor Arsovski describes software-controlled memory,
              no dynamic hardware caching, 220 MiB of on-chip memory at 80 TBps, cycle-accurate instruction scheduling,
              and a network whose messages are compiler scheduled. Independent practitioner articles broadly describe
              the same deterministic model, although they are not neutral laboratory benchmarks. The architecture is
              best suited to predictable tensor programs: one technical review says complex dynamic control flow falls
              back to the host CPU, while another flags meaningful compile time when a model changes. Low-level
              microarchitecture remains proprietary, limiting external verification of current implementations.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE014
