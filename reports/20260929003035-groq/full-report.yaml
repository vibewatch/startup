              - CE014
      - number: '5.3'
        title: Deployment Model and 2026 Infrastructure Direction
        blocks:
          - type: paragraph
            body: >-
              As of August 2026, Groq said it operated 13 data centers across four broad regions and served more than
              six million developers. Both Groq and TechCrunch reported a plan to scale power capacity from 54 megawatts
              to more than 200 megawatts in 2027. TechCrunch characterized the company as pivoting from a pure AI-chip
              vendor toward a neocloud operating NVIDIA systems after a licensing transaction and senior technical
              departures; Groq separately identified itself as an NVIDIA Cloud Partner certified to operate to NVIDIA
              reference architecture. The reported footprint and capacity trajectory are useful maturity signals, but
              they do not disclose delivered availability, utilization, redundancy, incident history, or how LPU and
              NVIDIA capacity are allocated.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, Reliability, Compliance, and Technical Diligence
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not include an official trust center, security architecture, privacy and
              retention specification, status history, service-level agreement, certification report, or incident
              record. That absence is an evidence gap, not evidence that controls or incidents do not exist. A Baytech
              Consulting review says standard inference is covered by a HIPAA Business Associate Addendum while Compound
              and Built-In Tools are excluded, but this material boundary needs confirmation in Groq's current
              contractual documents before regulated use. Technical diligence should also separate historical LPU claims
              from the current neocloud: obtain model-specific latency distributions, workload and batch assumptions,
              availability by region, failover behavior, compiler support matrices, current silicon roadmap, and support
              ownership for third-party integrations.
            claimRefs:
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not just an API claim
            body: >-
              Groq's strongest documented technical distinction is the compiler-controlled LPU design: flat
              software-controlled SRAM, predetermined execution, and compiler-scheduled inter-chip messages form a
              coherent architecture rather than a single benchmark result.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: callout
            title: The current operating model outruns the public assurance record
            body: >-
              Groq's reported data-center and power expansion is material, but the assigned evidence does not establish
              availability, incident history, utilization, regional controls, or the current boundary between
              proprietary LPU and NVIDIA capacity.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Market Profile
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports several possible customer access routes rather than a measured commercial
              segmentation. Groq's August 2026 release says it serves more than six million developers, separately
              Fortune 500 enterprises and thousands of AI-native companies; it does not define registered, active,
              paying or self-serve cohorts. Public API documentation and pricing articles describe developer access,
              while IBM's October 2025 announcement establishes a partner distribution route for enterprise workflows.
              Older coverage discusses hardware use by research and sovereign organizations. These examples do not show
              which route contributes most revenue, whether enterprise procurement is predominantly indirect, or whether
              historical hardware arrangements continue unchanged. Contract values, customer concentration and
              segment-level economics require company data rather than inference from recognizable names.
            claimRefs:
