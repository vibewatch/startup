            title: Underwrite from private statements, not valuation marks
            body: >-
              Investment work should reconcile audited revenue and cash flow with contracts, capacity utilization, cost
              of service, capex commitments, debt, and post-transaction ownership.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI013
