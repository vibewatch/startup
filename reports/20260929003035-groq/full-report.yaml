      - number: '4.2'
        title: Pricing and go-to-market economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing is useful for understanding the billing mechanism, not realized economics. RFP.wiki reports
              pay-as-you-go rates for selected GPT OSS and Whisper products and says some Llama offerings require
              enterprise sales contact. Those figures indicate a consumption-led developer funnel with an enterprise
              conversion path, but the source is a third-party snapshot rather than the retained official rate card. The
              public record does not expose negotiated discounts, minimum commitments, support charges, channel shares,
              customer-acquisition cost, sales-cycle duration, payback, or net retention. Groq's OpenAI-compatible
              interface may reduce technical adoption friction, but it does not prove low commercial acquisition cost or
              durable expansion. Underwriting should therefore separate list-price comparability from contracted price,
              collected revenue, and gross profit.
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI011
      - number: '4.3'
        title: Cost structure and unit-economics boundary
        blocks:
          - type: paragraph
            body: >-
              The dominant visible operating commitment is infrastructure expansion. Groq reports 13 data centers across
              four regions and a plan to move from 54 megawatts to more than 200 megawatts in 2027. That target signals
              substantial accelerator, power, networking, facility, and operating requirements, but the assigned
              evidence does not quantify ownership versus lease exposure, utilization, energy cost, hardware
              depreciation, supplier commitments, or service-delivery cost. TechCrunch treats Groq as a neocloud after
              its strategic pivot and highlights sector concerns around capital expenditure, debt, rapidly depreciating
              hardware, and free-cash-flow conversion using CoreWeave as a comparator; these are relevant risk
              mechanisms, not Groq-specific balance-sheet figures. Gross margin, contribution margin, CAC payback, and
              working-capital behavior remain private.
            claimRefs:
              - CI005
              - CI006
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
