  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Scrutiny, Antitrust Exposure, and Deal Structure
        blocks:
          - type: paragraph
            body: >-
              Retained sources describe a reported December 2025 licensing-and-hiring arrangement between Groq and
              Nvidia, but differ in their characterization of asset transfer. CIO describes non-exclusive licensing
              rather than an asset or stock purchase, while other commentary uses acquisition terminology. The
              underlying transaction documents were not reviewed, so ownership transfer of all IP is not established.
              IntuitionLabs and Angel Investors Network report a March 2026 Senate inquiry; those secondary accounts are
              not the original letter, an FTC or DOJ enforcement filing, or a legal finding. Alumni Ventures, which
              identifies itself as a Groq investor, discusses possible scrutiny by analogy with other transactions. Such
              commentary supports a diligence question, not a verified blocked acquisition, calibrated enforcement
              probability or known remedy schedule. Legal significance depends on actual agreements and current primary
              records.
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
