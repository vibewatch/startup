      - number: '6.2'
        title: Adoption Trajectory & Developer Velocity
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity on GroqCloud has accelerated substantially due to aggressive per-token pricing and
              drop-in compatibility with the OpenAI API specification. By pricing Llama 3.1 8B inference at $0.05 per
              million input tokens and $0.08 per million output tokens, Groq significantly undercuts conventional GPU
              cloud providers while delivering generation speeds exceeding 500 tokens per second. The platform's
              generous zero-credit-card free tier has driven rapid developer experimentation, but organizational rate
              limits on tokens per minute (TPM) serve as the primary throttle governing the transition to paid
              commercial accounts. Groq reports operating 13 globally distributed data centers delivering trillions of
              tokens weekly to sustain this demand. However, because Groq does not disclose the proportion of active
              accounts that convert from promotional free tokens to recurring billable spend, top-line developer counts
              may overstate true commercial traction.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU012
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU014
      - number: '6.3'
        title: Enterprise Deployments & Strategic Case Studies
        blocks:
          - type: paragraph
            body: >-
              Enterprise validation for Groq is anchored by a select group of high-profile commercial deployments and
              platform distribution partnerships. In the enterprise software category, IBM integrated GroqCloud
              inference into watsonx Orchestrate in October 2025, enabling enterprise clients across healthcare, retail,
              and consumer packaged goods to execute complex multi-step HR and customer service workflows without
              latency lag. In high-performance commercial operations, the McLaren Formula 1 racing team utilizes Groq
              LPU compute for real-time race telemetry analytics, where deterministic millisecond response times are
              critical for tactical strategy. In specialized edge and robotics hardware, Embodied incorporates Groq's
              low-latency conversational processing into its Moxie pediatric companion robot. Additionally, sovereign
              deployments like Aramco Digital's multi-rack GroqRack cluster and scientific research installations at
              Argonne National Laboratory prove that Groq's hardware handles demanding enterprise workloads, even as
              software packaging and post-Nvidia licensing support questions remain open.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
