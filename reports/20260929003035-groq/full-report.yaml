chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Genesis, and Strategic Pivot
        blocks:
          - type: paragraph
            body: >-
              Historical sources describe Groq, Inc. as an American AI accelerator company founded in 2016 by former
              Google engineers Jonathan Ross and Douglas Wightman, with headquarters in Mountain View. Its LPU
              architecture and GroqCloud service provide context for the company's inference business; Wikipedia
              explicitly dates the GroqCloud soft launch to February 19, 2024. Reporting describes a December 2025
              non-exclusive licensing arrangement with Nvidia and the departure of Ross, Sunny Madra and senior
              technical personnel. The retained material discusses possible antitrust motivations and scrutiny, not a
              regulator decision blocking an outright Groq acquisition. Groq's August 2026 announcement names Groq LLC
              and describes training- and inference-capable Nvidia clusters alongside its LPU experience. The brand and
              financing narrative do not establish legal succession, shareholder continuity or the exact retained
              technology rights, which require corporate and transaction documents.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO011
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO009
              - CO010
              - CO014
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
              - CO011
              - CO013
      - number: '1.2'
        title: Governance Rebuild and Key-Person Transition
        blocks:
          - type: paragraph
            body: >-
              The retained sources establish a reported leadership transition but not a fully verified current executive
              register. RevenueMemo's 2026 profile lists Adam Winter as CEO and Matt Eng, Alan Rice, Sinclair Schuller
              and Rakesh Malhotra as the rebuilt finance, operations, technology and product leaders. Those names and
              appointment narratives remain attributed directory observations rather than independently inspected
              primary appointment records. Alex Davis has stronger direct support: the August 2026 company release names
              him executive chairman and CEO of Disruptive. RevenueMemo also explicitly says equity stakes, voting
              rights and board-control provisions are undisclosed. Lead-investor status and a chairmanship therefore do
              not establish majority ownership or voting control. Founder and senior technical departures create
              execution questions, but retained engineering capability, organizational responsibilities and current
              management appointments require separate confirmation.
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO011
      - number: '1.3'
        title: Capital Structure, Reset Valuation, and Neocloud Capacity
        blocks:
          - type: paragraph
            body: >-
              Groq has reported financing across materially different strategic periods, so its historical and current
              marks need separate interpretation. TechCrunch reports a $6.9 billion September 2025 valuation and says
              the subsequent Nvidia licensing transaction paid proceeds to investors. On August 17, 2026, Groq LLC
              announced a $350 million Series A at a $3.5 billion valuation, led by Disruptive with planned Nvidia
              participation and subject to customary closing conditions. The company combines that announcement with
              $650 million raised in June as $1 billion of recent funding; this is not disclosed cash, runway, or an
              audited lifetime total. RevenueMemo separately reports more than $2.3 billion in historical equity
              funding, without reconciling that coverage to the current legal entity and capital structure.
              Company-reported operating metrics include 13 data centers in four broad regions, more than six million
              developers, and trillions of weekly tokens. Its planned expansion from 54 MW to more than 200 MW in 2027
              is a capacity target, not delivered capacity or a revenue forecast. Closing documentation, ownership
              continuity, audited financials and use of proceeds remain diligence requirements.
            claimRefs:
              - CO003
              - CO007
              - CO009
              - CO010
              - CO012
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO011
              - CO013
              - CO015
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Licensing Structure and Retained Rights Require Verification
            body: >-
              Retained reporting describes non-exclusive licensing and senior personnel moving to Nvidia, while
              commentary discusses possible antitrust motivations. That does not establish an agency finding, a blocked
              Groq acquisition or transfer of every intellectual-property right. Groq's Nvidia Cloud Partner role
              creates supplier and execution questions, but retained rights, allocation terms and present legal and
              shareholder continuity require transaction documents rather than inference from the deal headline.
            calloutType: risk
            claimRefs:
              - CO011
              - CO012
          - type: callout
            title: Strategic Repositioning from Semiconductor Challenger to Infrastructure Utility
            body: >-
              The August 2026 announcement describes a $350M Series A at a $3.5B valuation, with planned Nvidia
              participation and customary closing conditions. Together with the company-reported $650M June raise, it
              supplies a $1B recent-financing context rather than a disclosed cash balance. Groq plans to combine its
              LPU operations with Nvidia clusters across a reported 13-site footprint, but neither the financing mark
              nor the capacity plan establishes profitable unit economics, available runway, or continuity of historical
              shareholder claims.
            calloutType: insight
            claimRefs:
              - CO003
              - CO007
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              This analysis uses an inference-led market lens, not a claim that Groq currently offers only inference.
              Its August 2026 company announcement describes Nvidia clusters supporting training and inference,
              alongside its historical LPU business. Relevant analytical categories include API usage, dedicated
              inference capacity and infrastructure partnerships, but they are not interchangeable revenue measures.
              Training, inference and general-purpose cloud budgets can overlap, and the retained evidence does not
              provide a reconciled spending taxonomy or customer-level allocation. GPU clouds, hyperscaler services and
              dedicated deployments are possible substitutes whose suitability depends on model support, workload,
              contractual terms and operating capability. Neither a generic hardware category nor a reported latency
              example establishes that one provider is universally slower or that the whole category is addressable by
              Groq.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Lenses, and Growth Horizons
        blocks:
          - type: paragraph
            body: >-
              The retained sources provide separate contextual lenses, not a single nested market model. AInvest's
              September 17, 2025 AI-generated commentary attributes a forecast of $106.15B in 2025 to $254.98B in 2030,
              at 19.2% CAGR, to MarketsandMarkets; the underlying research methodology was not reviewed. TokenRing AI
              commentary syndicated through a FinancialContent/WRAL page dated October 13, 2025 separately projects
              $400B in annual AI-chip sales within five years and potentially $1T by 2030. Those broad chip projections
              are not industry consensus, Groq revenue forecasts or a comparable series with the inference estimate. No
              defensible Groq-specific SAM or monetary SOM is derived from the retained evidence. The company-reported
              54 MW footprint and planned expansion beyond 200 MW in 2027 describe operating capacity and execution
              requirements, not dollars of obtainable market or an assumed conversion to revenue.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Developer APIs, enterprise requirements and sovereign infrastructure are useful analytical buyer
              categories, but the retained sources do not measure the associated revenue mix or procurement authority.
              Groq reports more than six million developers overall; that figure does not establish how many are active,
              paying or members of a particular segment. Third-party material describes token pricing and
              OpenAI-compatible integration, while Sacra discusses enterprise hardware, Saudi infrastructure
              arrangements and Bell Canada's progressively planned network. These observations do not establish
              universal first-token guarantees, annual commitments or a single verified budget owner. Workload-specific
              latency, model availability, service commitments, residency and integration effort are diligence
              considerations rather than observed contract terms. Historical developer counts and revenue estimates also
              have different dates and denominators and cannot by themselves establish current conversion or share of
              wallet.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Structural Growth Drivers, Switching Friction, and Valuation Realities
        blocks:
          - type: paragraph
            body: >-
              Real-time agent workflows, multi-step reasoning and voice interfaces can benefit from responsive
              inference, but their acceptable latency and throughput depend on the workload rather than a universal
              token-per-second threshold. Power access, deployment execution, demand and capital availability constrain
              Groq differently from broad market-spending forecasts. The company plans to expand from 54 MW to more than
              200 MW in 2027; that plan does not establish delivered capacity, a required debt balance, or obtainable
              revenue. Nvidia ecosystem dependence remains a competitive consideration. After the reported December 2025
              licensing transaction and leadership changes, Groq announced a $350M August 2026 round at a $3.5B
              valuation, with planned Nvidia participation and customary closing conditions. Comparing that mark with
              September 2025 does not establish investor losses or isolate the reason for the difference because
              distributions, legal structure and ownership continuity remain unverified.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Transition from Silicon Vendor to Neocloud Operator
            body: >-
              Company announcements and TechCrunch describe Groq moving from its historical LPU focus toward operating
              Nvidia-accelerated infrastructure for both training and inference. The August 2026 $350M announcement at a
              $3.5B valuation, with planned Nvidia participation and customary closing conditions, is financing context
              for that strategy rather than proof of completed investment, delivered capacity or profitable market
              share.
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: Capital Intensity and Power Availability Constrain Addressable Scale
            body: >-
              The reported plan to expand from 54 MW to more than 200 MW in 2027 is an execution and financing
              requirement, not a quantified obtainable market. Power, utilization, pricing, customer demand and
              deployment timing could all affect results. The retained sources do not establish that demand exceeds
              supply for every Groq workload or provide a reliable MW-to-revenue conversion.
            calloutType: risk
            claimRefs:
              - CM006
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Alternatives, Architectural Archetypes, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The alternatives in this chapter are architectural and service categories, not a like-for-like vendor
              leaderboard. Nvidia supplies a broad GPU and software ecosystem; specialized accelerators such as Cerebras
              pursue different hardware designs; hyperscalers combine proprietary silicon and cloud services; GPU clouds
              provide rented capacity; and managed frontier APIs sell access to different models. Their suitability
              depends on workload, model licenses, memory, supported software, operational capability and commercial
              terms. GPU programmability does not guarantee that every checkpoint fits or that a particular serving
              stack supports all tuning methods. The retained evidence also does not establish a comparable current
              funding, market-share or revenue dataset for every provider. Comparisons below separate reported
              observations from unmeasured capabilities and avoid treating historical private-company descriptions as
              verified current listing status.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP012
      - number: '3.2'
        title: Inference Performance, Token Economics, and Serving-Stack Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The pricing and performance observations require source, date and workload qualifications. Spheron's July
              22, 2026 comparison quotes Groq Llama 3.3 70B rates of $0.59 input and $0.79 output per million tokens and
              illustrates blended rates of $0.63 at an 80/20 input/output mix or $0.67 at 60/40. It separately reports
              H100 serving-cost scenarios of roughly $0.62 and $1.24 per million tokens for two GPUs near 85%
              utilization and four GPUs near 40%, using $2.01 per GPU-hour. These are not input/output rates. Its
              single-H100 SXM5 benchmark discussion and multi-GPU PCIe cost table do not establish a neutral
              matched-workload comparison. The cited 276-token/s Llama 3.3 70B figure is retained through Spheron citing
              Artificial Analysis via Groq, not direct inspection of that benchmark. Model prices, catalog scope,
              asynchronous batch eligibility and cache-hit input discounts remain dated observations, not current
              universal promises.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Switching Costs, Supply Chain Dependencies, and Neocloud Repositioning
        blocks:
          - type: paragraph
            body: >-
              Groq combines historical LPU specialization with a newer Nvidia Cloud Partner strategy, rather than
              retaining an unchanged competitive position. Its SRAM-based LPU architecture has different memory and
              cluster-design tradeoffs from GPU serving, while model and workload conditions matter to performance
              comparisons. The reported December 2025 licensing transaction accompanied founder Jonathan Ross, president
              Sunny Madra and senior engineering personnel moving to Nvidia; that historical transition does not
              establish the current CEO. The August 17, 2026 company release names executive chairman Alex Davis and
              announces a $350M Series A at a $3.5B valuation, led by Disruptive with planned Nvidia participation and
              subject to customary closing conditions. The release describes Nvidia clusters for training and inference
              and a planned expansion from 54 MW to more than 200 MW in 2027. These plans introduce supplier,
              deployment, capital-intensity and utilization risks, but they do not establish a completed buildout, Groq
              debt balance, or a like-for-like shareholder valuation loss.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Tokenomics Utilization Paradox: Groq vs Dedicated Rented GPUs'
            body: >-
              Spheron illustrates a Groq Llama 3.3 70B blended rate of $0.63/M tokens at an 80/20 input/output mix and
              $0.67/M at 60/40. Its separate FP8 serving scenarios use two H100 PCIe GPUs near 85% utilization for about
              $0.62/M and four near 40% for about $1.24/M, at $2.01 per GPU-hour on July 22, 2026. These values are not
              input/output GPU tariffs or universal cost parity. The article also discusses a single-H100 SXM5
              benchmark, so its multi-GPU comparison is not established as a neutral matched-workload measurement. Real
              economics depend on hardware, workload, configuration, utilization and total operating costs.
            calloutType: insight
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: callout
            title: Model Catalog and Customization Require Account-Specific Review
            body: >-
              The July 2026 Spheron snapshot lists six non-enterprise LLM models and describes request-based Enterprise
              LoRA support. That is a dated model list, not six architectures, a complete audio/enterprise inventory, or
              proof that a model is unavailable today. Buyers needing a custom checkpoint should verify current catalog
              and account terms. GPU hosting offers another route only when model licensing, memory and serving software
              fit; it is not automatically the mandatory or universally compatible choice.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Groq's possible monetization surface is broader than a single chip sale. Retained evidence describes
              usage-based GroqCloud inference, quote-based enterprise or dedicated capacity, and a reported Nvidia
              asset/licensing transaction whose payment and rights details are not independently reconciled here. That
              transaction is not evidence of recurring operating revenue. Groq documentation presents an
              OpenAI-compatible API, while a third-party pricing review describes token- and audio-based self-serve
              rates plus enterprise offerings. Company materials report more than six million developers and trillions
              of weekly tokens, but neither measure discloses paying accounts, billed consumption, revenue, retention or
              concentration. CNBC reported a $500 million revenue target for 2025; this remains a historical target, not
              evidence of achievement. Potential commercial routes therefore remain distinct from verified realized
              revenue and unit economics.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.2'
        title: Pricing and go-to-market economics
        blocks:
          - type: paragraph
            body: >-
              Public pricing helps explain billing mechanisms, not realized economics. RFP.wiki reports pay-as-you-go
              rates for selected GPT OSS and Whisper products and says some Llama offerings require enterprise sales
              contact. These are self-serve and separately negotiated access routes, not a measured
              developer-to-enterprise conversion funnel. The source is a third-party snapshot rather than a retained
              official rate card. The public record does not expose negotiated discounts, minimum commitments, support
              charges, channel shares, customer-acquisition cost, sales-cycle duration, payback or net retention. Groq's
              OpenAI-compatible interface may reduce technical adoption friction, but it does not prove low acquisition
              cost or durable expansion. Investment assessment must separate list prices, customer contracts, collected
              revenue and gross profit.
            claimRefs:
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI010
              - CI011
      - number: '4.3'
        title: Cost structure and unit-economics boundary
        blocks:
          - type: paragraph
            body: >-
              The dominant visible operating commitment is infrastructure expansion. Groq reports 13 data centers across
              four regions and a plan to move from 54 megawatts to more than 200 megawatts in 2027. That target signals
              substantial accelerator, power, networking, facility, and operating requirements, but the assigned
              evidence does not quantify ownership versus lease exposure, utilization, energy cost, hardware
              depreciation, supplier commitments, or service-delivery cost. TechCrunch treats Groq as a neocloud after
              its strategic pivot and highlights sector concerns around capital expenditure, debt, rapidly depreciating
              hardware, and free-cash-flow conversion using CoreWeave as a comparator; these are relevant risk
              mechanisms, not Groq-specific balance-sheet figures. Gross margin, contribution margin, CAC payback, and
              working-capital behavior remain private.
            claimRefs:
              - CI005
              - CI006
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Groq announced $650 million of new growth capital in June 2026 and a $350 million Series A in August, with
              the latter subject to customary closing conditions. Company and independent coverage describe $1 billion
              of recent funding, while Tracxn reports $2.77 billion raised across eight rounds. None of those amounts is
              a cash-balance disclosure, and the sources do not reveal proceeds already deployed, debt, project-finance
              obligations, restricted cash, operating burn, or runway. The $3.5 billion Series A valuation also follows
              a reported roughly $20 billion Nvidia asset and licensing transaction that excluded GroqCloud, making pre-
              and post-transaction equity marks poor substitutes for operating performance. The verdict is therefore
              capital-supported but not financially underwritable: revenue quality, margin path, financing dependency,
              and free-cash-flow durability require primary private evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The 2026 financing announcements provide capital-raising context, not confirmation that the August round
              has closed. Retained sources do not disclose cash on hand, burn, committed capex, debt or proceeds still
              available; planned Nvidia participation remains distinct from completed investment.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI015
          - type: callout
            title: Scale proxies need financial denominators
            body: >-
              Developer count, weekly tokens, data-center count, and megawatts describe reach or capacity; none
              establishes paying-customer conversion, utilization, recognized revenue, or margin.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI015
