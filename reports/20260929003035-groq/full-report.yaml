              - CI009
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Groq announced $650 million of new growth capital in June 2026 and a $350 million Series A in August, with
              the latter subject to customary closing conditions. Company and independent coverage describe $1 billion
              of recent funding, while Tracxn reports $2.77 billion raised across eight rounds. None of those amounts is
              a cash-balance disclosure, and the sources do not reveal proceeds already deployed, debt, project-finance
              obligations, restricted cash, operating burn, or runway. The $3.5 billion Series A valuation also follows
              a reported roughly $20 billion Nvidia asset and licensing transaction that excluded GroqCloud, making pre-
              and post-transaction equity marks poor substitutes for operating performance. The verdict is therefore
              capital-supported but not financially underwritable: revenue quality, margin path, financing dependency,
              and free-cash-flow durability require primary private evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
