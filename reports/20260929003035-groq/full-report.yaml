          - type: callout
            title: Capital Intensity and Nvidia Supplier Dependency
            body: >-
              The announced Nvidia-cluster expansion exposes Groq to supplier allocation, utilization and
              capital-expenditure risks. TechCrunch discusses substantial debt and depreciation concerns at other
              neocloud operators, but does not establish Groq debt, cash burn or runway. Its planned move from 54 MW to
              more than 200 MW in 2027 requires execution and financing diligence. The $350M August announcement remains
              subject to customary closing conditions, with planned rather than completed Nvidia participation; the
              reported financing context cannot substitute for a company balance sheet.
            calloutType: insight
            claimRefs:
              - CR004
