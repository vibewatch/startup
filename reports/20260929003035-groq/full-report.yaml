      - number: '6.2'
        title: Adoption Trajectory & Developer Velocity
        blocks:
          - type: paragraph
            body: >-
              Company-reported developer reach and token volume are different measures from revenue-producing adoption.
              The August 2026 release reports more than six million developers, 13 data centers and trillions of weekly
              tokens, without active-account, paying-account or free-versus-billable denominators. The retained eesel
              and Deepak Gupta pricing snapshots quote Llama 3.1 8B at $0.05 per million input and $0.08 per million
              output tokens; those dated third-party observations are not independently confirmed September 2026 quotes
              or proof of matched-workload cost superiority. A no-credit-card free tier and account or organization
              limits provide evaluation routes, but the evidence does not measure their causal effect on conversion.
              Token throughput, price and developer reach cannot establish retention or sustainable monetization without
              cohort, utilization and margin data.
            claimRefs:
