chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Genesis, and Strategic Pivot
        blocks:
          - type: paragraph
            body: >-
              Groq, Inc. is an American artificial intelligence infrastructure company founded in 2016 and headquartered
              in Mountain View, California. Established by former Google engineers Jonathan Ross and Douglas Wightman,
              the company originated as a pure semiconductor challenger developing application-specific integrated
              circuits (ASICs) dubbed Language Processing Units (LPUs). These processors utilized single-core
              deterministic architectures and on-chip SRAM to eliminate memory bandwidth bottlenecks during real-time
              large language model inference. Over its first nine years, Groq scaled its proprietary silicon, launched
              the GroqCloud developer platform in early 2024, and built high-performance clusters across 13 data center
              facilities globally. However, the capital intensity of independent fab production and cluster buildouts
              culminated in a profound strategic turning point in December 2025. Facing antitrust constraints that
              blocked an outright acquisition, Nvidia entered into an agreement valued at approximately $20 billion to
              license Groq's inference technology on a non-exclusive basis and hire founder Jonathan Ross, president
              Sunny Madra, and senior technical staff. Following this transaction, Groq restructured its core mission
              from an independent silicon manufacturer into an AI inference neocloud operator, combining its LPU
              foundation with Nvidia accelerated computing clusters.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
