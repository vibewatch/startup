      - number: '6.3'
        title: Enterprise Deployments & Strategic Case Studies
        blocks:
          - type: paragraph
            body: >-
              The named examples have different evidence types and time bases. IBM's October 20, 2025 announcement
              offers immediate GroqCloud access through watsonx Orchestrate and describes company-reported healthcare
              and HR use cases, while Red Hat vLLM enhancements and Granite support remain plans in that release. It
              supplies no independently measured sub-second outcome. The retained eesel article mentions McLaren using
              Groq for real-time race analytics, but not the generated Grand Prix telemetry details or verified
              production performance. VMblog describes Moxie and Argonne in a historical press-tour account discussing
              2023/2024 shipment expectations; that does not establish September 2026 continuity. Value Add VC
              retrospectively describes pre-December-2025 GroqRack sales and an Aramco multi-rack example. Its generic
              64-to-576-plus chip range is not a verified count for that customer.
            claimRefs:
