              - CV006
              - CV008
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Implications of the Post-Licensing Valuation Reset
            body: >-
              The announced $3.5B August 2026 financing mark is about 49.3% below the reported $6.9B September 2025 mark
              by simple arithmetic. This is not a demonstrated investor loss: TechCrunch reports intervening investor
              distributions and a company spokesperson describes a post-licensing baseline. Legal continuity, share
              classes, distributions and dilution are not reconciled. The August round remains subject to customary
              closing conditions, with planned Nvidia participation, and cannot establish intrinsic value or profitable
              operating economics.
