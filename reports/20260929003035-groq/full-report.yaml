        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Risk Requires Primary Records
            body: >-
              Commentary raises potential scrutiny of licensing-and-hiring structures, and secondary sources report a
              March 2026 Senate inquiry. A reported letter is not an enforcement judgment, an FTC or DOJ case, or a
              blocked Groq acquisition. Other-transaction precedents and speculative exit discounts cannot establish
              Groq-specific probabilities or recoveries. Actual transaction agreements and available primary regulatory
              records are required before drawing a legal or financial conclusion.
            calloutType: risk
            claimRefs:
              - CR001
