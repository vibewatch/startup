                Section 14.3 excludes either party's fraud or fraudulent misrepresentation, gross negligence or willful
                misconduct, indemnification obligations, infringement of the other party's IP, payment obligations,
                confidentiality breaches and legally non-excludable matters from these limits.
            - label: >-
                Customer order, supplements, service credits and verified incident history; retain all section 14.3
                exceptions.
        - label: Commercial Retention and Switching
          values:
            - label: >-
                OpenAI-compatible interfaces and company-reported developer reach do not disclose current retention or
                paying accounts.
            - label: Potential pricing and retention pressure; no measured churn probability or margin collapse is forecast.
            - label: Customer cohorts, paid usage, switching effort and realized unit economics.
