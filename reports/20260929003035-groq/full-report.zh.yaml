            body: >-
              Groq 持久的技术主张是将调度复杂性从运行时硬件转移至编译器中。Groq 首席架构师 Igor Arsovski 在 2024 年的一次演讲中描述了软件控制的内存、无动态硬件缓存、以 80 TBps 带宽运行的
              220 MiB
              片上内存、时钟周期精确的指令调度，以及消息全由编译器调度的网络。独立技术从业人员的文章也广泛描述了相同的确定性模型，尽管这些并非中立的实验室基准测试。该架构最适合可预测的张量程序：一份技术评测称复杂的动态控制流会回退至宿主
              CPU 执行，而另一份评测则指出模型变动时会产生不可忽视的编译耗时。底层的微架构仍属专有技术，限制了外界对其当前具体实现的独立验证。
