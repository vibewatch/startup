      - number: '1.3'
        title: 资本结构、重置估值与新型算力云容量
        blocks:
          - type: paragraph
            body: >-
              Groq 在不同战略阶段的融资报道需要分开解读。TechCrunch 报道，2025 年 9 月其估值为 $6.9B，并称随后的 Nvidia 许可交易向投资者分配了所得款项。2026 年 8 月 17
              日，Groq LLC 宣布一轮 $350M 的 Series A 融资，估值为 $3.5B，由 Disruptive 领投，Nvidia 计划参与，且仍须满足惯常交割条件。公司把这项公告与 6 月筹集的
              $650M 合并，称近期融资规模为 $1B；这不是已披露的现金余额或现金可支撑运营时长，也不是经审计的历史累计总额。RevenueMemo 另报历史股权融资超过
              $2.3B，但未将统计范围与当前法律实体和资本结构对账。公司报告的运营指标包括分布在四个大区的 13 座数据中心、开发者触达超过 6,000,000 人，以及每周数万亿 tokens。公司计划在 2027
              年将电力容量从 54 MW 扩至超过 200 MW；这是容量目标，不代表已经交付的容量或收入预测。交割文件、股权延续性、经审计财务数据和资金用途仍需尽调核实。
