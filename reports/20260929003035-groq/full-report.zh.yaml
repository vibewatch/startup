      - number: '8.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 授权交易后估值重置的结构性影响
            body: >-
              按简单算术计算，公布的 2026 年 8 月 $3.5B 融资估值比据报道的 2025 年 9 月 $6.9B 估值低约 49.3%。这不等于已证实投资者实际亏损：TechCrunch
              报道了期间向投资者分配款项，公司发言人则将其称为授权交易后的新基准。法律主体延续性、股份类别、分配和股权稀释均未核实。8 月这轮融资仍须满足惯常交割条件，Nvidia
              为计划参投，不能确立公司的内在价值，也不能证明经营经济性为正。
            calloutType: insight
            claimRefs:
              - CV001
              - CV006
              - CV008
