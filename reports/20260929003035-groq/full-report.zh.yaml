          - type: callout
            title: 资本密集度与 Nvidia 供应商依赖
            body: >-
              宣布的 Nvidia 集群扩张使 Groq 面临供应商配额、算力利用率以及资本支出风险。TechCrunch 探讨了其他新型算力云厂商的高额负债与折旧隐忧，但并未证实 Groq
              的负债规模、现金消耗或现金可支撑的运营时长。其计划在 2027 年将电力从 54 MW 扩至超过 200 MW，需要审慎的执行与融资尽调。8 月 $350M 融资公告仍须满足惯常交割条件，Nvidia
              为计划参投而非已完成出资；据报道的融资背景无法替代正式的公司资产负债表。
