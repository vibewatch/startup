        - $0.075
        - $0.30
        - 据来源报告，符合条件的异步 Batch 可享 50% 折扣；仅适用于符合条件且命中缓存的输入 tokens，可享 50% 折扣；受模型和日期限制
        - 带日期的 token 报价；模型适用性和实际综合成本取决于工作负载
      - - Groq（大型开放权重模型）
        - Llama 3.3 70B Versatile
        - $0.59
        - $0.79
        - 据来源报告，符合条件的异步 Batch 可享 50% 折扣；仅适用于符合条件且命中缓存的输入 tokens，可享 50% 折扣；受模型和日期限制
        - Spheron 给出的示例为：输入 / 输出占比 80/20 时 $0.63/M，60/40 时 $0.67/M；尚未证明其普遍达到与自托管相当的成本
