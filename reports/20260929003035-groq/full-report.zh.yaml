companyProfile:
  summary: >-
    Groq 于 2016 年作为一家 AI 加速芯片公司起步，并研发了其 LPU 技术及 GroqCloud 推理服务。历史信源所描述的法律实体为 Groq, Inc.，而 2026 年 8 月的融资公告中名称则为 Groq
    LLC；仅凭品牌名称无法确立法律与股东层面的延续性。在据报于 2025 年 12 月达成 Nvidia 技术授权安排以及多位高管离职后，该公司描述了将 LPU 运营与用于训练和推理的 Nvidia 加速集群相结合的规划。其拥有 13
    处站点的足迹与开发者触达规模均为公司自述。规划中的扩张、已公布的融资以及技术性能主张，并不能确立现有可用现金、持久商业优势或盈利的单位经济性。
