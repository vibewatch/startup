      - number: '2.4'
        title: 结构性增长驱动力、迁移摩擦与估值现实
        blocks:
          - type: paragraph
            body: >-
              实时智能体、多步推理和语音界面都可能受益于快速推理，但可接受的延迟和吞吐量取决于具体工作负载，没有通用的 tokens/second 门槛。电力接入、部署执行、需求和资本可得性对 Groq
              的约束，与宏观市场支出预测不是一回事。公司计划在 2027 年把电力容量从 54 MW 扩至超过 200 MW；计划本身不能证明容量已交付、所需债务规模或可实现收入。对 Nvidia 生态的依赖仍是竞争考量。有关
              2025 年 12 月许可交易和领导层变动的报道之后，Groq 于 2026 年 8 月宣布一轮 $350M 融资，估值 $3.5B；Nvidia 计划参与，且交易仍须满足惯常交割条件。将这一估值与 2025 年
              9 月的估值相比，不能直接认定投资者亏损，也不能单独解释差异；期间分配、法律结构和股权延续性均未核实。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 市场转型：从芯片供应商到新型算力云运营商
            body: >-
              公司公告和 TechCrunch 报道称，Groq 正从以 LPU 为核心转向运营 Nvidia 加速基础设施，同时支持训练和推理。2026 年 8 月宣布的 $350M 融资、$3.5B 估值，以及
              Nvidia 计划参与且仍待惯常交割条件满足，构成这一战略的融资背景；它们不证明投资已交割、容量已交付或已取得盈利的市场份额。
            calloutType: insight
            claimRefs:
              - CM014
              - CM015
          - type: callout
            title: 资本密集度与电力供应制约可触达规模
            body: >-
              据报道 2027 年将电力从 54 MW 扩张至超过 200 MW 的计划是一项执行与融资要求，而非量化的可获取市场空间。电力接入、利用率、定价、客户需求以及部署节奏均可能影响最终结果。留存信源并未证实 Groq
              的每项工作负载都供不应求，也未提供可靠的兆瓦转收入测算公式。
            calloutType: risk
            claimRefs:
              - CM006
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场替代方案、架构流派与现状替代品
        blocks:
          - type: paragraph
            body: >-
              本章比较的是不同架构和服务类型，不是同类厂商排名。Nvidia 提供广泛的 GPU 与软件生态；Cerebras 等专用加速器厂商采用不同硬件设计；超大规模云厂商把自研芯片与云服务整合；GPU
              云出租算力；托管前沿模型 API 则提供不同模型的访问。具体适配度要看工作负载、模型许可、显存、软件支持、运维能力和商务条款。GPU
              可编程不代表所有模型检查点都能装载，也不代表某套服务栈支持所有调优方法。留存证据没有为各供应商建立可比的当前融资、市场份额或收入数据集。下文将已报道的观察与未经测量的能力分开，也不把历史私营公司资料当作当前上市状态的证明。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP012
      - number: '3.2'
        title: 推理性能、Token 经济学与服务堆栈权衡
        blocks:
          - type: paragraph
            body: >-
              价格和性能数据必须连同来源、日期与工作负载一起看。Spheron 在 2026 年 7 月 22 日的比较引用 Groq 对 Llama 3.3 70B 的报价：每百万输入 tokens $0.59、每百万输出
              tokens $0.79；按输入 / 输出占比 80/20 和 60/40 混算，分别为 $0.63 和 $0.67。该文另列 H100 推理服务成本情景：每 GPU 小时 $2.01；两张 GPU 利用率接近
              85% 时约为每百万 tokens $0.62，四张 GPU 利用率接近 40% 时约为 $1.24。这些是服务成本情景，不是输入 / 输出费率。文中的单卡 H100 SXM5 基准讨论与多卡 PCIe
              成本表，并未建立中立、同工作负载的对照。276 tokens/s 的 Llama 3.3 70B 数值是 Spheron 转引 Groq 发布的 Artificial Analysis
              数据，并非直接查验基准原文。模型报价、目录范围、异步批处理资格和缓存命中输入折扣都是有日期的观察，不是当前普遍承诺。
