      - number: '1.2'
        title: 治理重构与核心人员更迭
        blocks:
          - type: paragraph
            body: >-
              留存材料能确认有高管更迭报道，但不足以拼出一份完全核实的现任高管名单。RevenueMemo 2026 年档案将 Adam Winter 列为 CEO，并把 Matt Eng、Alan Rice、Sinclair
              Schuller 和 Rakesh Malhotra 分别列作重组后的财务、运营、技术和产品负责人。这些姓名与任命说法来自该目录，尚非独立查阅的一手任命记录。Alex Davis 的依据更直接：Groq 2026
              年 8 月新闻稿称他为执行董事长，并称其为 Disruptive 的 CEO。RevenueMemo
              还明确指出，持股比例、投票权及董事会控制条款均未披露。领投方身份和董事长职务都不能证明多数持股或表决控制。创始人和资深技术人员离开带来执行疑问；Groq
              保留了哪些工程能力、组织职责如何划分、现任管理层任命是否属实，都需分别核实。
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
