              McLaren 使用 Groq 做实时赛事分析，但未提供大奖赛遥测细节或经验证的生产表现。VMblog 在讨论 2023 / 2024 年出货预期的历史媒体报道中提到 Moxie 和
              Argonne；这不能证明业务延续至 2026 年 9 月。Value Add VC 回顾了 2025 年 12 月前的 GroqRack 销售和 Aramco 多机架案例。文中泛指的芯片配置范围为 64 颗至
              576 颗以上，并非经核实的 Aramco 芯片数量。
            claimRefs:
              - CU006
