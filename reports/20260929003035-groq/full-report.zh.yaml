      - number: '7.4'
        title: 新型算力云资本密集度、估值承压与投资逻辑破灭触发因素
        blocks:
          - type: paragraph
            body: >-
              Groq 在 LPU 业务之外扩展 Nvidia 加速基础设施，也面临资本支出和执行风险。公司于 2026 年 8 月宣布一轮 $350M 融资，估值 $3.5B，由 Disruptive 领投；Nvidia
              计划参与，交易仍须满足惯常交割条件。将这项公告与据报 6 月筹集的 $650M 合并，不能据此确定当前现金余额或现金可支撑的运营时长。公司报告有 13 座数据中心，并计划在 2027 年从 54 MW 扩至超过
              200 MW；这不是已完成扩建或已签约利用率的记录。TechCrunch 以 CoreWeave 为例讨论新型算力云行业的债务、折旧和现金流转化风险，并未披露 Groq
              的债务，也未证明两家公司采用相同的融资结构。下行情景包括电力交付延迟、客户需求不足、供应商接入受限及不利监管行动。留存的公开证据不足以校准这些情景的发生概率、时间或财务影响。
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
