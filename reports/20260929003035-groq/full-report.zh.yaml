  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 从算力规模和高管调整出发，逐步推导至持续跟踪的投资建议。
    data:
      nodes:
        - label: 公司披露的触达规模：开发者超过 6,000,000 人；并非付费客户数
        - label: 历史背景：据报与 Nvidia 达成许可交易，且有领导层离职
        - label: 已宣布融资：估值 $3.5B、融资额 $350M；Nvidia 计划参与；仍须满足惯常交割条件
        - label: 产能计划：2027 年从 54 MW 扩至超过 200 MW；尚未完成部署
        - label: 经济性仍待确认：现金、利润率、股权连续性和投资者回报均未得到确认
        - label: 分析师判断：持续跟踪；中等置信度；高风险；估值未知
      edges:
        - from: 'Company-Reported Reach: more than six million developers; not paying-customer count'
          to: 'Historical Context: reported Nvidia licensing transaction and leadership departures'
        - from: 'Historical Context: reported Nvidia licensing transaction and leadership departures'
          to: 'Announced Financing: $350M at $3.5B; planned Nvidia participation; subject to customary closing conditions'
        - from: 'Announced Financing: $350M at $3.5B; planned Nvidia participation; subject to customary closing conditions'
          to: 'Capacity Plan: 54 MW to more than 200 MW in 2027; not completed deployment'
        - from: 'Capacity Plan: 54 MW to more than 200 MW in 2027; not completed deployment'
          to: 'Unresolved Economics: cash, margins, ownership continuity and investor returns not established'
        - from: 'Unresolved Economics: cash, margins, ownership continuity and investor returns not established'
          to: 'Analyst Judgment: Track; medium confidence; high risk; valuation unknown'
    approximationNotes: 这是分析判断的推导顺序，并非因果证明或估值模型。融资仍须满足交割条件；开发者触达规模、token 数量和 MW 产能是不同指标，不能据此推断现金流或股权回报。
