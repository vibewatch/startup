            body: >-
              评论讨论了许可与人员聘用安排可能受到的审查，二手资料报道了 2026 年 3 月的参议院问询。被报道的信函不等于执法裁决、FTC 或 DOJ 的案件，也不能证明收购 Groq
              遭到阻止。其他交易先例和推测性的退出折价，不能据此推断 Groq 自身的风险概率或回收水平。作出法律或财务结论前，须查阅实际交易协议和可获取的一手监管记录。
            calloutType: risk
            claimRefs:
              - CR001
