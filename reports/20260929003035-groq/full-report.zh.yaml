chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 实体沿革、创立渊源与战略转型
        blocks:
          - type: paragraph
            body: >-
              历史信源将 Groq, Inc. 描述为一家总部位于山景城、由前 Google 工程师 Jonathan Ross 和 Douglas Wightman 于 2016 年创立的美国 AI 加速芯片公司。其 LPU
              架构与 GroqCloud 服务为理解该公司的推理业务提供了背景；维基百科明确将 GroqCloud 的小规模试运行（soft launch）时间定在 2024 年 2 月 19 日。报道称其在 2025 年
              12 月与 Nvidia 达成了非独家技术授权协议，随后 Ross、Sunny Madra 以及多位高层技术人员相继离职。留存材料探讨了潜在的反垄断动因与审查，而非监管机构正式做出的阻止完全收购 Groq
              的决定。Groq 在 2026 年 8 月的公告中名称为 Groq LLC，并在阐述其 LPU 经验的同时，描述了具备训练与推理能力的 Nvidia
              集群。品牌和融资叙事并不能确立法律层面的承继关系、股东延续性或保留的具体技术权利，这些需要查验公司与交易法律文件。
            claimRefs:
