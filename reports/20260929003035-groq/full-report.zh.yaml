      - number: '2.3'
        title: 买方细分、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              开发者 API、企业需求和主权基础设施可作为买方分析类别，但留存来源没有量化各自收入占比或采购决策权。Groq 报告开发者触达超过 6,000,000
              人，却没有说明其中活跃、付费或属于特定细分市场的有多少。第三方材料提及 token 定价和 OpenAI 兼容集成；Sacra 则讨论企业硬件、沙特基础设施安排，以及 Bell Canada
              逐步规划的网络。这些材料没有证明普遍适用的首 token
              延迟保证、年度采购承诺或唯一明确的预算负责人。尽调时应核实具体工作负载的延迟、模型可用性、服务承诺、数据驻留和集成工作量；它们不是已观察到的合同条款。历史开发者数与收入估算的日期和分母也不相同，不能单独证明当前转化率或客户钱包份额。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
