      - number: '6.4'
        title: 扩张阻碍、留存缺口与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              定制化需求可能会影响开发者对 Groq 的评估，但留存证据未能量化由于这些需求所导致的客户流失。Deepak Gupta 2026 年 8 月的对比分析指出，LoRA 托管属于 Enterprise
              档且需申请，而非标准的自助式上传，这使得模型适配度与账户条款成为关键的尽调问题。该观察不能证明已有团队因此流失，也不能证明所有定制工作负载都必须转向竞争对手的 GPU 服务。IBM 和 Hugging Face
              的报道显示存在分销渠道，但没有披露直销和伙伴销售各占多少，也不能证明伙伴渠道可替代自建销售团队。留存来源未确认当前
              NRR、GRR、客户流失率、ACV、合同期限或客户集中度。历史硬件案例也没有披露当前维护收入或续约经济性。
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU009
              - CU010
              - CU013
              - CU014
      - number: '6.5'
        title: 图表与附录
        blocks:
          - type: callout
            title: 企业级门槛制约开发者自助式扩张
            body: >-
              Deepak Gupta 2026 年 8 月的比较称，标准 Groq 账户不能直接上传自定义微调权重，LoRA 托管属于 Enterprise
              档且须申请。这关系到账户资格和工作流，但并非定制需求导致客户流失的量化证据。团队应评估当前模型支持、商业条款和自身工作负载；留存比较没有证明某一种替代部署路径是唯一选择。
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
          - type: callout
            title: 合作伙伴渠道无法确立真实收入构成
            body: >-
              IBM 2025 年 10 月公告和 Welcome AI 对 Hugging Face 的报道，分别介绍了触达企业与开发者的渠道，但没有披露 Groq
              收入中伙伴渠道的占比、直销是否处于次要地位，也未说明公司是否可以不组建销售团队。IBM 当时提供立即接入服务，并报告了用例；这与计划中的集成、经过独立测量的客户成效有别，不能混为一谈。
            calloutType: insight
            claimRefs:
              - CU002
              - CU006
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管审查、反垄断风险与交易结构
        blocks:
          - type: paragraph
            body: >-
              留存信源称，Groq 与 Nvidia 于 2025 年 12 月达成技术授权与人才聘用安排，但对资产是否转移的说法并不一致。CIO
              认为这是非独家授权，不是资产购买或股权收购；其他评论则使用“收购”一词。我们未查阅交易文件，因此不能确认所有知识产权都已转移。IntuitionLabs 和 Angel Investors Network 报道
              2026 年 3 月的参议院问询，但它们是二手报道，不是原始信函、FTC 或 DOJ 的执法文件，也不是法律认定。自称 Groq 投资者的 Alumni Ventures
              以其他交易作类比，讨论潜在审查。这些评论只能提示尽调问题，不能证明收购已被阻止，也没有给出经过校准的执法概率或已知补救时间表。法律意义仍取决于实际协议和当前一手记录。
            claimRefs:
              - CR001
              - CR003
              - CR011
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR011
              - CR014
      - number: '7.2'
        title: 运营可行性与人才收购后的人员交接
        blocks:
          - type: paragraph
            body: >-
              据报，2025 年 12 月达成协议后，创始人 Jonathan Ross、总裁 Sunny Madra 和资深技术人员转投 Nvidia。2026 年初的评论称 Simon Edwards 在交易后接任
              CEO，但这不能确认 2026 年 9 月的现任高管名单。CIO 援引 Gartner 分析师 Gaurav Gupta 对交易后 Groq 整体能力的担忧；这是主观判断，不是 Groq
              技术能力已永久受损的证据。CIO 2026 年 1 月文章还报道 Gartner 预测：到 2029 年，为数据中心提供定制算力芯片的 AI 初创公司中，75%
              将被收购或破产。该预测合并了两种不同结局，不能据此推算 Groq 自身的破产概率，也不涵盖所有新型算力云厂商。Groq
              保留了哪些工程能力、谁主导路线图、当前管理层是谁、能否交付工作负载，都要用具体事实核实，不能从行业预测反推。
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR010
      - number: '7.3'
        title: 战略伙伴依赖、服务条款与 SLA 透明度
        blocks:
          - type: paragraph
            body: >-
              Groq 的 Nvidia Cloud Partner 身份及许可关系，引出供应商依赖问题；Nvidia 参与 2026 年 8
              月融资仍属计划，投资是否完成尚未确认。合同保障以具体客户协议为准，不能只看通用采购清单。第 14.2 条通常将各方云服务损害赔偿总额限制为事件发生前 12 个月内就所涉服务已支付的费用；Groq 对 beta /
              免费服务承担的损害赔偿责任上限为 $5,000。第 14.3
              条规定，任一方的欺诈或欺诈性失实陈述、重大过失或故意不当行为、赔偿保障义务、侵犯对方知识产权、付款义务、违反保密义务，以及法律不允许排除的事项，不受上述责任限制。《Services Agreement》定义的
              URL Terms 包括 SLA，并允许另行购买服务承诺。RFP.wiki 的品类采购清单列出待核查事项，并称付费或企业合同通常有更详细的 SLA；该清单不能证明 Groq
              普遍缺少可执行的救济。尽调应检查客户订单、补充条款、服务费抵扣条款及实际工作负载要求，不能断言所有企业 SLA 都缺失或无法执行。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
