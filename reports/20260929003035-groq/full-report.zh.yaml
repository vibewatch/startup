  - id: FE001
    title: Groq 产品与技术依赖栈
    type: stack
    summary: 该技术栈区分面向客户的接口、LPU 过往的差异化优势，以及当前由 NVIDIA 支持的基础设施底座，并保留各层的尽调边界。
    data:
      layers:
        - label: 应用层
          detail: 客户应用调用兼容 OpenAI 的 Groq 端点。
          modules:
            - 标准 OpenAI 客户端
            - Groq API 基础 URL
        - label: 集成层
          detail: 目录中的连接器将应用扩展至工具和外部服务。
          modules:
            - Agent 与 MCP
            - 可观测性与监控
            - 浏览器、语音、沙箱和硬件集成
        - label: 编译器与运行时层
          detail: 静态调度安排计算、内存传输和受支持的通信。
          modules:
            - 周期精确的指令调度
            - 复杂动态控制流的主机回退方案
        - label: LPU 芯片层
          detail: 公司技术材料将片上 SRAM 描述为由软件控制、结构扁平。
          modules:
            - 220 MiB 片上内存
            - 公司称带宽为 80 TBps
        - label: 横向扩展网络层
          detail: 编译器调度消息，按全局时序协调芯片。
          modules:
            - 由软件调度的芯片间通信
            - 确定性时序模型
        - label: 云基础设施层
          detail: 当前平台新增全球分布式 NVIDIA 加速计算基础设施。
          modules:
            - 公司报告的 13 座数据中心
            - 2027 年从 54 MW 扩至超过 200 MW 的计划
            - NVIDIA Cloud Partner 运营标准
    approximationNotes: 该排序是分析性的依赖关系图，不代表 Groq 的每种工作负载都会同时经过 LPU 和 NVIDIA 硬件。
    claimRefs:
