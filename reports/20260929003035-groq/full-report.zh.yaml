              和音频计费的自助方案及企业产品。公司报告触达超过 6,000,000 名开发者、每周处理数万亿 tokens，但这两项指标都没有披露付费账户、计费消耗、收入、留存或客户集中度。CNBC 曾报道 Groq 设定
              2025 年收入目标 $500M；这只是历史目标，不是目标已实现的证据。潜在销售路径与经核实的实际收入、单位经济性仍是两回事。
