  - id: FR001
    title: 风险证据与待核实事项
    type: matrix
    summary: 风险领域的定性梳理及明确的证据边界，并非经过校准的概率或监管时间表。
    data:
      columns:
        - 证据依据
        - 潜在风险
        - 待核实事项
      rows:
        - label: 监管解读
          values:
            - label: 二手报道提及 2026 年 3 月的参议院问询，以及对许可架构的评论。
            - label: 可能产生法律或交易后果；未量化执法概率或结果。
            - label: 原始往来文件、实际合同条款及任何真实的监管机构申报文件；不预设 3-6 个月的监管时间表。
        - label: 领导层与技术延续性
          values:
            - label: 据报创始人及高级人员离职；另有关于 2026 年初 CEO 更替的历史报道。
            - label: 执行能力和保留能力存疑，但不能据此认定已永久受损。
            - label: 当前任命、工程职责、保留的权利及交付证据。
        - label: 资本与产能落地
          values:
            - label: 据报产能为 54 MW；计划于 2027 年超过 200 MW。8 月宣布的 $350M 融资仍待交割。
            - label: 利用率、折旧和融资风险；Groq 的债务规模与现金可支撑的运营时长尚无可靠估算。
            - label: 现金、实际债务 / 租赁义务、现金消耗、已承诺电力及已完成部署；没有经核实的季度现金消耗跟踪序列。
        - label: Nvidia 供应商关系
          values:
            - label: 公司披露的 NCP 角色和许可关系；Nvidia 计划参与 8 月宣布的融资。
            - label: 可能涉及资源分配和战略依赖；尚未确认存在相互许可或保供安排。
            - label: 已签署的许可、供应商分配、定价和融资条款，而非臆测的交付期限。
        - label: 特定工作负载的合同救济
          values:
            - label: 公开条款允许约定服务承诺；RFP.wiki 提供的是有条件的采购建议，并非观察到 SLA 违约。
            - label: 救济取决于适用协议；尚未证实存在普遍适用的责任上限，也未证实条款缺乏可执行性。
              detail: >-
                第 14.2 条通常将各方云服务损害赔偿总额限制为事件发生前 12 个月内就所涉服务已支付的费用；Groq 对 beta / 免费服务的损害赔偿上限为 $5,000。第 14.3
                条规定，任一方的欺诈或欺诈性失实陈述、重大过失或故意不当行为、赔偿保障义务、侵犯另一方知识产权、付款义务、违反保密义务及法律不允许排除的事项，均不受上述限制。
            - label: 客户订单、补充协议、服务费抵扣额及经核实的事故记录；并保留第 14.3 条的全部例外。
        - label: 商业留存与切换
          values:
            - label: 兼容 OpenAI 的接口和公司披露的开发者触达规模，均未披露当前客户留存情况或付费账户数。
            - label: 可能面临定价和客户留存压力；没有对流失概率或利润率崩塌作出量化预测。
            - label: 客户群组、付费使用、迁移所需工作量及实际单位经济性。
    approximationNotes: 这是分析师对风险的定性梳理，并非风险概率评分、影响量化、失败预测或官方时间表。二手报道、公司公告和公开条款的证据作用各不相同。融资不等于现金；法律责任上限仍须按适用主体及例外理解。
