      - number: '3.3'
        title: 迁移成本、供应链依赖与新型算力云再定位
        blocks:
          - type: paragraph
            body: >-
              Groq 把历史上的 LPU 专长与较新的 Nvidia Cloud Partner 战略结合，竞争定位并未保持不变。基于 SRAM 的 LPU 与 GPU
              服务在内存和集群设计上取舍不同，性能比较还要匹配模型与工作负载。据报道，2025 年 12 月许可交易后，创始人 Jonathan Ross、总裁 Sunny Madra 和资深工程人员转入
              Nvidia；这段历史不能据以确认现任 CEO。Groq 2026 年 8 月 17 日新闻稿称 Alex Davis 为执行董事长，并宣布一轮 $350M 的 Series A 融资，估值 $3.5B，由
              Disruptive 领投；Nvidia 计划参与，交易仍须满足惯常交割条件。新闻稿还描述了用于训练和推理的 Nvidia 集群，并计划于 2027 年把电力容量从 54 MW 扩至超过 200
              MW。这些计划带来供应商、部署、资本密集度和利用率风险，但不能证明扩建已经完成、Groq 负债规模，或股东遭受了可比口径的估值损失。
