  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              本分析采用以推理为主导的市场视角，但并不表明 Groq 目前仅提供推理服务。其 2026 年 8 月的公司公告描述了支持训练与推理的 Nvidia 集群，与其传统的 LPU 业务并行。相关的分析类别包括 API
              用量、专用推理算力以及基础设施合作伙伴关系，但它们并非可以相互替换的收入指标。训练、推理和通用云预算之间可能存在重叠，且留存证据未能提供经过对账的支出分类法或客户层面的资金分配方案。GPU
              云、超大规模云厂商服务以及专用部署方案均是潜在的替代选项，其适用性取决于模型支持、工作负载、合同条款及运维能力。通用的硬件品类或据报道的延迟案例，既不能确立某一供应商普遍更慢，也不能确立整个品类都在 Groq
              的有效可达市场之内。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 目标市场空间测算、测算维度与增长周期
        blocks:
          - type: paragraph
            body: >-
              留存来源提供的是几组不同的市场背景，不是一个层层嵌套的市场模型。AInvest 于 2025 年 9 月 17 日发布的 AI 生成评论转述 MarketsandMarkets 预测：AI 推理市场从 2025
              年的 $106.15B 增至 2030 年的 $254.98B，CAGR 为 19.2%；报告未审阅其一手研究方法。TokenRing AI 的评论经 2025 年 10 月 13 日的
              FinancialContent / WRAL 页面转载，另预测 AI 芯片年销售额五年内达到 $400B，到 2030 年可能达到 $1T。这些广义芯片预测不是行业共识、Groq
              收入预测，也不能与推理市场估算拼成可比序列。现有证据不足以推导有依据的 Groq 专属 SAM 或货币口径 SOM。公司报告的 54 MW 规模和计划于 2027 年扩至超过 200
              MW，描述的是运营容量与执行要求，不是可获取市场金额，也不能据此假定收入换算。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
