    summary: 定性比较不同基础设施和服务方案，不编造速度或灵活性的序数评分。
    approximationNotes: 仅为分析师定性比较。留存材料不支持推断 1 至 10 的人为评分、校准分数、统一基准工作负载或普遍适用的成本 / 性能排名。
    data:
      columns:
