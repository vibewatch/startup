figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 Groq 从 AI 加速器初创公司发展为与 Nvidia 结盟的新型算力云平台的关键公司事件。
    data:
      items:
        - date: '2016'
          label: 公司成立
          detail: Jonathan Ross 和 Douglas Wightman 在加州创立 Groq，开发专用推理 ASIC。
          claimRef: CO001
        - date: '2017'
          label: 种子轮融资
          detail: Wikipedia 和 RevenueMemo 报道，Social Capital 于 2017 年投资 $10M 种子轮。
          claimRef: CO006
        - date: 2021-04
          label: Series C 独角兽融资
          detail: 历史来源报道称，Tiger Global 和 D1 Capital 领投 $300M Series C，估值约 $1B。
          claimRef: CO006
        - date: '2024-02-19'
          label: GroqCloud 软启动
          detail: Wikipedia 明确记载，GroqCloud 开发者平台于 2024 年 2 月 19 日软启动。
          claimRef: CO002
        - date: 2024-08
          label: Series D 成长轮
          detail: BlackRock 领投 $640M 融资，Groq 估值 $2.8B，用于扩大数据中心规模。
          claimRef: CO006
        - date: '2025-02-10'
          label: 沙特基础设施交易
          detail: 获得沙特阿拉伯 $1.5B 基础设施部署承诺，用于在达曼建设数据中心。
          claimRef: CO013
        - date: 2025-09
          label: 据报 Series E 融资
          detail: Disruptive 领投 $750M Series E，峰值估值为 $6.9B。
          claimRef: CO006
        - date: 2025-12
          label: Nvidia $20B 许可协议
          detail: Nvidia 获得推理 IP 许可；创始人 Jonathan Ross 和核心工程团队转入 Nvidia。
          claimRef: CO011
        - date: 2026-06
          label: 转向新型算力云的融资
          detail: 留存报道描述 Groq 于 2026 年 6 月融资 $650M，Disruptive 和 Infinitum 被列为领投方；此处未确定具体日期。
          claimRef: CO007
        - date: '2026-08-17'
          label: Series A 公告
          detail: Groq LLC 宣布融资 $350M，估值 $3.5B，由 Disruptive 领投，Nvidia 计划参与；融资仍须满足惯常交割条件。
          claimRef: CO003
    approximationNotes: >-
      日期精度以审阅过的来源正文为准：未确定具体日期时仅标注年份或月份。Wikipedia 明确记载 2024 年 2 月 19 日和 2025 年 2 月 10 日；2026 年 8 月 17
      日是官方公告日期，并非已确认的交割日。不根据参考资料的发布日期推断公司注册日或缴资时间线。
    claimRefs:
      - CO001
      - CO002
      - CO003
