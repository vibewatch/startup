            - label: 276 token/s 的示例经由 Groq 转述，属于二手信息；并非直接审阅的中立排名，也不是完整的当前产品清单。
        - label: Nvidia GPU 生态
          values:
            - label: 通用硬件和软件生态可支持多种工作负载。
