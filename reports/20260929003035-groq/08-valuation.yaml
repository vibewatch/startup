      commitments are not established.
  - - Valuation Stance
    - unknown
    - The announced $3.5B financing mark is subject to customary closing conditions; undisclosed financials and capital structure
      prevent independent intrinsic valuation.
  notes: Analyst recommendation, not a priced equity assessment. August 2026 terms are announced and subject to customary
    closing conditions, with planned Nvidia participation. No claim of fairness, post-money basis, investor returns or confirmed
    cash availability is established by the financing mark.
