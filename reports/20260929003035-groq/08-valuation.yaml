chapter:
  number: 8
  title: Valuation
  summary: Groq announced a $350M Series A at a $3.5B valuation in August 2026, led by Disruptive with planned Nvidia participation
    and customary closing conditions. The June $650M raise and the later announcement are financing context, not cash or runway.
    Undisclosed operating economics, shareholder continuity and contractual terms prevent an independent intrinsic valuation
    or investor-return calculation. Track remains the analyst recommendation, with medium confidence, high risk and an unknown
    valuation stance.
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The investment thesis is a conditional opportunity to combine GroqCloud and LPU experience with expanded Nvidia-accelerated infrastructure for training and inference. In August 2026, Groq reported more than six million developers, trillions of weekly tokens and 13 data centers across four broad regions. These company-reported scale indicators do not establish active or paying developer cohorts, billed usage, revenue, margins or a durable competitive moat. Reported founder and senior-personnel departures following the December 2025 Nvidia licensing arrangement create continuity and execution questions. The planned increase from 54 MW to more than 200 MW in 2027 implies substantial potential infrastructure requirements, not verified delivered capacity or quantified facility obligations. Historical licensing margins and present unit economics remain undisclosed. The August $350M financing announcement retains customary closing conditions and planned Nvidia participation; a financing mark cannot resolve the operating and ownership uncertainties.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV008
  tableRefs:
  - TV002
- id: valuation-context-and-financing-history
  title: Valuation Context, Capital Structure, and Financing History
  body: Groq LLC announced a $350 million Series A on August 17, 2026 at a $3.5 billion valuation, led by Disruptive with
    planned Nvidia participation and subject to customary closing conditions. The announcement combines that amount with $650
    million raised in June as $1 billion of recent funding; it is not a disclosed cash balance or runway estimate. The $3.5
    billion mark is arithmetically about 49.3% below the September 2025 $6.9 billion mark, but TechCrunch reports intervening
    investor distributions and attributes a new post-licensing baseline explanation to a company spokesperson. Without verified
    legal continuity, distributions, dilution and ownership rights, that comparison is not an investor loss or return. Tracxn
    and FundedIQ report different historical round sets and totals, which are separate database observations rather than a
    coherent funding range. The retained sources do not reconcile the present capital structure or support an independently
    derived intrinsic valuation.
  claimRefs:
  - CV001
  - CV006
  - CV007
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
- id: scenario-analysis-and-recommendation
  title: Scenario Analysis, Exit Pathways, and Recommendation
  body: 'Bull, base and bear cases are qualitative operating conditions, not priced forecasts. A favorable case would require
    demand, utilization and contribution economics to support the planned capacity expansion; a middle case would combine
    continued adoption with competitive pricing and uncertain returns on infrastructure investment; an adverse case would
    involve underused capacity, delayed deployment or constrained financing. None of these descriptions supplies a supported
    gross-margin percentage, probability or target valuation. The public evidence lacks audited revenue, margins, cash flows,
    debt and cohort retention, so it cannot establish a defensible revenue multiple, discounted cash-flow model or equity
    return. Track with medium confidence and high risk remains an analyst judgment. The valuation stance is unknown rather
    than fair: the announced $3.5B financing mark is subject to closing qualifications and is not an independent measure of
    intrinsic value.'
  claimRefs:
