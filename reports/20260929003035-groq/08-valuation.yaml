- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Angle
  - Core Argument
  - What Would Change the View
  rows:
  - - Inference Scale & Developer Moat
    - Over 6 million developers generate trillions of tokens weekly on GroqCloud across 13 global datacenters.
    - Deceleration in token generation or developer defection to alternative hyperscaler inference endpoints.
  - - Strategic Relationships and Announced Financing
    - Disruptive leads the announced $350M Series A; Nvidia participation is planned and the round is subject to customary
      closing conditions. These relationships do not guarantee GPU allocation or investment completion.
    - Executed closing documents, actual investor participation, supplier allocation terms and deployment evidence.
  - - Leadership Continuity & Talent
    - Sweeping C-suite turnover after Nvidia absorbed founders Ross and Madra into a separate licensing structure.
    - Demonstrated operational outperformance by new C-suite executives in securing Fortune 500 commitments.
  - - Neocloud Margin Profile
    - Transitioning from silicon IP to hardware cloud operator carries heavy depreciation and hardware rental risk.
    - Proof of sustained high software-like gross margins and customer lock-in via dedicated enterprise clusters.
  notes: Qualitative thesis and anti-thesis. The June reported raise and August announced round are distinct from cash and
    runway; shareholder continuity and distributions are not established. Financial and operating outcomes remain contingent,
    not validated by financing headlines.
  claimRefs:
  - CV002
  - CV003
  - CV004
  - CV005
  - CV008
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operational Assumptions
  - Valuation / Scenario Logic
  - Key Risks
  - Observable Diligence Indicators
  rows:
  - - Bull Case
    - Planned expansion from 54 MW to more than 200 MW in 2027 is delivered with sustainable customer utilization and positive
      unit economics.
    - Potential operating upside; no supported margin percentage, valuation target, multiple or investor return is estimated.
    - Power-delivery delays, execution costs and competing inference offers.
    - Verified utilization, customer renewal, contribution margins and completed capacity milestones.
  - - Base Case
    - Customer adoption continues while competitive pricing and capital expenditure constrain operating returns.
    - Outcome remains unpriced; the announced $3.5B funding mark is context, not a fair-value estimate or assumed entry price.
    - Depreciation, pricing pressure, uncertain financing needs and private financial disclosure.
    - Audited operating results, debt and lease schedules, workload profitability and customer concentration.
  - - Bear Case
    - Underused or delayed capacity and restricted financing could strain the business; existing debt, leases and cash burn
      are not disclosed.
    - Potential downside or further financing needs; no defensible sub-$2B target or quantified equity impairment is derived.
    - Demand shortfalls, supplier constraints, cash requirements and execution failures.
    - Verified liquidity information, deployment delays, customer losses and financing terms.
  notes: Illustrative analyst operating scenarios only. No calibrated probabilities, gross-margin forecasts or numerical valuation
    targets are supported by the retained evidence. The 54 MW to more than 200 MW roadmap is a company plan, not committed
    revenue. Financing is not cash; legal structure and shareholder claims must be established before any investor-return
    model.
  claimRefs:
  - CV001
  - CV004
  - CV006
  - CV008
