callouts:
- calloutType: insight
  title: 'The Tokenomics Utilization Paradox: Groq vs Dedicated Rented GPUs'
  body: Spheron illustrates a Groq Llama 3.3 70B blended rate of $0.63/M tokens at an 80/20 input/output mix and $0.67/M at
    60/40. Its separate FP8 serving scenarios use two H100 PCIe GPUs near 85% utilization for about $0.62/M and four near
    40% for about $1.24/M, at $2.01 per GPU-hour on July 22, 2026. These values are not input/output GPU tariffs or universal
    cost parity. The article also discusses a single-H100 SXM5 benchmark, so its multi-GPU comparison is not established as
    a neutral matched-workload measurement. Real economics depend on hardware, workload, configuration, utilization and total
    operating costs.
  claimRefs:
  - CP007
  - CP008
  - CP009
- calloutType: risk
  title: Model Catalog and Customization Require Account-Specific Review
  body: The July 2026 Spheron snapshot lists six non-enterprise LLM models and describes request-based Enterprise LoRA support.
    That is a dated model list, not six architectures, a complete audio/enterprise inventory, or proof that a model is unavailable
    today. Buyers needing a custom checkpoint should verify current catalog and account terms. GPU hosting offers another
    route only when model licensing, memory and serving software fit; it is not automatically the mandatory or universally
    compatible choice.
  claimRefs:
  - CP006
  - CP007
  - CP010
