chapter:
  number: 3
  title: Competitors
  summary: Groq competes with GPU clouds, specialized accelerators, hyperscaler infrastructure and managed model APIs, but
    these are different service and hardware categories. Retained third-party snapshots report particular LPU throughput and
    token rates without establishing a universal speed or cost ranking. Catalog, customization and workload limits require
    dated, account-specific interpretation, while the Nvidia licensing and infrastructure relationship changes the competitive
    context.
sections:
- id: competitive-landscape-overview
  title: Market Alternatives, Architectural Archetypes, and Status-Quo Substitutes
  body: The alternatives in this chapter are architectural and service categories, not a like-for-like vendor leaderboard.
    Nvidia supplies a broad GPU and software ecosystem; specialized accelerators such as Cerebras pursue different hardware
    designs; hyperscalers combine proprietary silicon and cloud services; GPU clouds provide rented capacity; and managed
    frontier APIs sell access to different models. Their suitability depends on workload, model licenses, memory, supported
    software, operational capability and commercial terms. GPU programmability does not guarantee that every checkpoint fits
    or that a particular serving stack supports all tuning methods. The retained evidence also does not establish a comparable
    current funding, market-share or revenue dataset for every provider. Comparisons below separate reported observations
    from unmeasured capabilities and avoid treating historical private-company descriptions as verified current listing status.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP012
  tableRefs:
  - TP001
- id: capability-and-pricing-benchmarks
  title: Inference Performance, Token Economics, and Serving-Stack Tradeoffs
  body: The pricing and performance observations require source, date and workload qualifications. Spheron's July 22, 2026
    comparison quotes Groq Llama 3.3 70B rates of $0.59 input and $0.79 output per million tokens and illustrates blended
    rates of $0.63 at an 80/20 input/output mix or $0.67 at 60/40. It separately reports H100 serving-cost scenarios of roughly
    $0.62 and $1.24 per million tokens for two GPUs near 85% utilization and four GPUs near 40%, using $2.01 per GPU-hour.
    These are not input/output rates. Its single-H100 SXM5 benchmark discussion and multi-GPU PCIe cost table do not establish
    a neutral matched-workload comparison. The cited 276-token/s Llama 3.3 70B figure is retained through Spheron citing Artificial
    Analysis via Groq, not direct inspection of that benchmark. Model prices, catalog scope, asynchronous batch eligibility
    and cache-hit input discounts remain dated observations, not current universal promises.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  - CP009
  - CP014
  tableRefs:
  - TP002
  - TP003
- id: switching-costs-and-moat-durability
  title: Switching Costs, Supply Chain Dependencies, and Neocloud Repositioning
  body: Groq combines historical LPU specialization with a newer Nvidia Cloud Partner strategy, rather than retaining an unchanged
    competitive position. Its SRAM-based LPU architecture has different memory and cluster-design tradeoffs from GPU serving,
    while model and workload conditions matter to performance comparisons. The reported December 2025 licensing transaction
    accompanied founder Jonathan Ross, president Sunny Madra and senior engineering personnel moving to Nvidia; that historical
    transition does not establish the current CEO. The August 17, 2026 company release names executive chairman Alex Davis
    and announces a $350M Series A at a $3.5B valuation, led by Disruptive with planned Nvidia participation and subject to
    customary closing conditions. The release describes Nvidia clusters for training and inference and a planned expansion
    from 54 MW to more than 200 MW in 2027. These plans introduce supplier, deployment, capital-intensity and utilization
    risks, but they do not establish a completed buildout, Groq debt balance, or a like-for-like shareholder valuation loss.
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP013
  - CP015
  - CP016
  figureRefs:
  - FP001
