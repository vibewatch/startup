  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: Audited revenue, revenue recognition policy, gross margin, contribution margin, operating cash flow, and free cash flow for 2025 and 2026 year to date.
      whyItMatters: Public activity, capacity, and financing figures cannot establish revenue quality, profitability, or cash generation.
      diligencePath: Obtain audited statements, monthly management accounts, revenue-by-stream schedules, cost-of-revenue detail, and a CFO reconciliation to bank statements.
      relatedQuestionRefs: [QI001, QI004, QI005, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Cash on hand, monthly burn, restricted cash, debt and project-finance schedules, committed capex, remaining round proceeds, and downside runway.
      whyItMatters: Funding raised is not cash available, and the 200+ MW target may require material financing beyond disclosed equity rounds.
      diligencePath: Review bank statements, debt agreements, capex commitments, board-approved budget, cash-flow forecast, and financing-trigger scenarios.
      relatedQuestionRefs: [QI006, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Current official rate cards, realized enterprise pricing, discounts, minimum commitments, support charges, channel economics, sales-cycle duration, CAC, and payback.
      whyItMatters: Third-party list-price observations cannot establish realized revenue per unit or sales efficiency.
      diligencePath: Sample executed contracts and invoices, reconcile them to the billing system, and review cohort-level acquisition spend, bookings, renewals, and expansion.
      relatedQuestionRefs: [QI001, QI002, QI003, QI008]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: capacity
      missingEvidence: Commissioned versus contracted megawatts, utilization, accelerator ownership, depreciation, power price, lease terms, capex per megawatt, and gross margin by region and deployment type.
      whyItMatters: Capacity expansion can create operating leverage only if utilization and pricing exceed the fully loaded cost of capital and service delivery.
      diligencePath: Review data-center and supplier contracts, asset registers, utilization telemetry, deployment schedules, unit-cost models, and customer capacity commitments.
      relatedQuestionRefs: [QI004, QI006, QI007, QI008]
      relatedTableRefs: [TI003]
