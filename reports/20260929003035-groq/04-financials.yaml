schemaVersion: "report-v2"
artifact: financials
slug: groq
runDate: 2026-09-29
company:
  name: Groq
chapter:
  number: 4
  title: Financials
  summary: >-
    Groq reported $650 million of June 2026 growth capital and announced a $350 million August Series A subject to customary closing conditions, with planned Nvidia participation. These financing observations do not establish completed August funding, cash available or runway. Public evidence describes usage-based and enterprise access routes, but actual revenue, gross margin, cash burn, debt, utilization, customer concentration and realized pricing remain unavailable for investment assessment.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      Groq's possible monetization surface is broader than a single chip sale. Retained evidence
      describes usage-based GroqCloud inference, quote-based enterprise or dedicated capacity,
      and a reported Nvidia asset/licensing transaction whose payment and rights details are not
      independently reconciled here. That transaction is not evidence of recurring operating
      revenue. Groq documentation presents an OpenAI-compatible API, while a third-party pricing
      review describes token- and audio-based self-serve rates plus enterprise offerings. Company
      materials report more than six million developers and trillions of weekly tokens, but
      neither measure discloses paying accounts, billed consumption, revenue, retention or
      concentration. CNBC reported a $500 million revenue target for 2025; this remains a
      historical target, not evidence of achievement. Potential commercial routes therefore
      remain distinct from verified realized revenue and unit economics.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-go-to-market
    title: Pricing and go-to-market economics
    body: "Public pricing helps explain billing mechanisms, not realized economics. RFP.wiki reports pay-as-you-go rates for selected GPT OSS and Whisper products and says some Llama offerings require enterprise sales contact. These are self-serve and separately negotiated access routes, not a measured developer-to-enterprise conversion funnel. The source is a third-party snapshot rather than a retained official rate card. The public record does not expose negotiated discounts, minimum commitments, support charges, channel shares, customer-acquisition cost, sales-cycle duration, payback or net retention. Groq's OpenAI-compatible interface may reduce technical adoption friction, but it does not prove low acquisition cost or durable expansion. Investment assessment must separate list prices, customer contracts, collected revenue and gross profit."
    claimRefs: [CI010, CI011, CI012]
    tableRefs: [TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics boundary
    body: >-
      The dominant visible operating commitment is infrastructure expansion. Groq reports 13 data
      centers across four regions and a plan to move from 54 megawatts to more than 200 megawatts
      in 2027. That target signals substantial accelerator, power, networking, facility, and
      operating requirements, but the assigned evidence does not quantify ownership versus lease
      exposure, utilization, energy cost, hardware depreciation, supplier commitments, or
      service-delivery cost. TechCrunch treats Groq as a neocloud after its strategic pivot and
      highlights sector concerns around capital expenditure, debt, rapidly depreciating hardware,
      and free-cash-flow conversion using CoreWeave as a comparator; these are relevant risk
      mechanisms, not Groq-specific balance-sheet figures. Gross margin, contribution margin,
      CAC payback, and working-capital behavior remain private.
    claimRefs: [CI005, CI006, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Groq announced $650 million of new growth capital in June 2026 and a $350 million Series A
      in August, with the latter subject to customary closing conditions. Company and independent
      coverage describe $1 billion of recent funding, while Tracxn reports $2.77 billion raised
      across eight rounds. None of those amounts is a cash-balance disclosure, and the sources do
      not reveal proceeds already deployed, debt, project-finance obligations, restricted cash,
      operating burn, or runway. The $3.5 billion Series A valuation also follows a reported
      roughly $20 billion Nvidia asset and licensing transaction that excluded GroqCloud, making
      pre- and post-transaction equity marks poor substitutes for operating performance. The
      verdict is therefore capital-supported but not financially underwritable: revenue quality,
      margin path, financing dependency, and free-cash-flow durability require primary private
      evidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI013, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and monetization quality
    columns:
      - Stream
      - Mechanism and unit
      - Public status
      - Revenue-quality implication
      - Diligence ask
    rows:
      - [GroqCloud self-serve inference, "Usage billed by input/output tokens or audio hour", "Selected third-party list-price examples are public", "Variable usage can scale, but billed volume and retention are undisclosed", "Provide monthly billed tokens, revenue, gross margin, and cohort retention by model"]
      - [Enterprise cloud capacity, "Negotiated contract, commitment, rate limits, or dedicated capacity", "Enterprise packaging is described as sales-led; realized prices are unavailable", "Commitments could improve visibility, but term, discount, and concentration are unknown", "Provide top contracts, committed backlog, discounts, renewal terms, and support obligations"]
      - ["Rack, regional, or dedicated deployment", "Quote-based infrastructure and deployment arrangement", "Third-party review describes rack and regional options without prices", "May increase contract value while adding hardware and implementation exposure", "Provide ownership model, capex responsibility, acceptance terms, and deployment margin"]
      - [Nvidia licensing and asset transaction, "Non-recurring technology license and asset transfer", "CNBC reported about $20 billion in cash for assets; GroqCloud was excluded", "Historical liquidity event is not recurring cloud revenue", "Reconcile proceeds, investor distributions, retained cash, IP economics, and continuing obligations"]
    notes: >-
      Mechanisms combine retained official documentation with third-party reporting; no row states
      recognized revenue, and all realized pricing, margins, and contract economics remain private.
    claimRefs: [CI010, CI011, CI012, CI013]
  - id: TI002
    title: Selected public pricing and packaging signals
    columns:
      - Offer
      - Billing unit
      - Reported public price or status
      - Qualification
      - Diligence ask
    rows:
      - ["GPT OSS 20B input", "1 million input tokens", "About $0.075", "Third-party snapshot; realized price and effective date require confirmation", "Verify current official rate, cache treatment, discounts, and cost per billed unit"]
      - ["GPT OSS 20B output", "1 million output tokens", "About $0.30", "Output-heavy workloads can raise spend", "Verify realized mix, discounting, and contribution margin"]
      - ["GPT OSS 120B input", "1 million input tokens", "About $0.15", "Third-party snapshot; no contracted-price evidence", "Verify current rate and enterprise commit tiers"]
      - ["GPT OSS 120B output", "1 million output tokens", "About $0.60", "Third-party snapshot; no contracted-price evidence", "Verify billed output mix and serving cost"]
      - ["Whisper Large v3 and Turbo", "Audio hour", "About $0.111 and $0.04, respectively", "Audio usage is not directly comparable with token-priced text", "Verify current SKU availability, utilization, and gross margin by model"]
      - ["Llama 3.1 8B Instant and Llama 3.3 70B Versatile", "Enterprise contract", "Contact sales", "Public list price is unavailable in the retained snapshot", "Obtain rate card, minimum commit, support terms, and discount schedule"]
    notes: >-
      All prices and packaging statuses are copied as approximate third-party observations from
      RFP.wiki's research pass; they are list-price signals, not realized Groq revenue or margin.
    claimRefs: [CI010, CI011]
  - id: TI003
    title: Unit economics and capital-efficiency underwriting
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2025 revenue", "$500 million target reported by CNBC; actual result unavailable", Medium, "A target cannot establish revenue scale or quality", "Provide audited 2025 revenue and 2026 year-to-date revenue by stream"]
      - [Developer reach, "More than 6 million company-claimed developers", "High for the claim; low as a revenue proxy", "Registered developers are not paying customers", "Reconcile registered, active, paying, enterprise, and retained cohorts"]
      - [Weekly platform activity, "Trillions of tokens company-claimed each week", Medium, "Activity needs billed-token and price realization context", "Provide billed versus free tokens, model mix, caching, and effective revenue per token"]
      - [Power capacity, "54 MW scaling to 200+ MW in 2027", "High for the stated plan; outcome not verified", "Capacity growth raises utilization and financing sensitivity", "Provide commissioned versus contracted MW, utilization, capex per MW, and delivery schedule"]
      - [Gross and contribution margin, "Not publicly disclosed", Unavailable, "Core test of whether usage growth creates economic value", "Provide margins by model, deployment type, region, and customer cohort"]
      - ["Cash, burn, runway, debt, and project finance", "Not publicly disclosed in the assigned evidence", Unavailable, "Funding raised does not establish capital adequacy", "Provide cash reconciliation, monthly burn, debt schedule, covenants, committed capex, and downside runway"]
    notes: >-
      Public values are company claims or third-party reports as labeled; null financial metrics
      are intentional gaps and must not be inferred from funding raised, activity, or capacity.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge and missing gross-profit inputs
    type: flow
    summary: >-
      Public evidence supports the operating sequence, but the conversion from activity to
      recognized revenue and gross profit is not disclosed.
    data:
      nodes:
        - {id: users, label: Developers and enterprise workloads, detail: "More than 6 million developers is a company-claimed reach metric, not a payer count."}
        - {id: api, label: OpenAI-compatible API access, detail: "The official documentation shows a low-friction API integration surface."}
        - {id: consumption, label: Token and audio consumption, detail: "Groq reports trillions of weekly tokens; billed share and workload mix are unknown."}
        - {id: pricing, label: Self-serve rates or enterprise quote, detail: "Selected token and audio rates are public through a third-party snapshot; enterprise terms are private."}
        - {id: billings, label: Contracted usage and billings, detail: "Discounts, free usage, commitments, concentration, and recognized revenue are undisclosed."}
        - {id: delivery-cost, label: Accelerator and data-center delivery cost, detail: "Power, depreciation, lease, networking, support, and utilization costs are undisclosed."}
        - {id: gross-profit, label: Gross profit, detail: "Revenue, cost of revenue, and gross margin are not publicly available in the assigned evidence."}
    approximationNotes: >-
      This is a mechanism map, not a quantified waterfall; it deliberately does not infer
      conversion rates, revenue, cost, or margin from developer, token, funding, or capacity figures.
    claimRefs: [CI007, CI008, CI010, CI011, CI012, CI015]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: "The 2026 financing announcements provide capital-raising context, not confirmation that the August round has closed. Retained sources do not disclose cash on hand, burn, committed capex, debt or proceeds still available; planned Nvidia participation remains distinct from completed investment."
    claimRefs: [CI001, CI003, CI004, CI015]
  - calloutType: insight
    title: Scale proxies need financial denominators
    body: >-
      Developer count, weekly tokens, data-center count, and megawatts describe reach or capacity;
      none establishes paying-customer conversion, utilization, recognized revenue, or margin.
    claimRefs: [CI005, CI006, CI007, CI008, CI015]
  - calloutType: recommendation
    title: Underwrite from private statements, not valuation marks
    body: >-
      Investment work should reconcile audited revenue and cash flow with contracts, capacity
      utilization, cost of service, capex commitments, debt, and post-transaction ownership.
    claimRefs: [CI002, CI013, CI014, CI015]
