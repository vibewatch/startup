callouts:
  - calloutType: insight
    title: Market Transition from Silicon Vendor to Neocloud Operator
    body: Company announcements and TechCrunch describe Groq moving from its historical LPU focus toward operating Nvidia-accelerated infrastructure for both training and inference. The August 2026 $350M announcement at a $3.5B valuation, with planned Nvidia participation and customary closing conditions, is financing context for that strategy rather than proof of completed investment, delivered capacity or profitable market share.
    claimRefs:
      - CM014
      - CM015
  - calloutType: risk
    title: Capital Intensity and Power Availability Constrain Addressable Scale
    body: The reported plan to expand from 54 MW to more than 200 MW in 2027 is an execution and financing requirement, not a quantified obtainable market. Power, utilization, pricing, customer demand and deployment timing could all affect results. The retained sources do not establish that demand exceeds supply for every Groq workload or provide a reliable MW-to-revenue conversion.
    claimRefs:
      - CM006
      - CM013
