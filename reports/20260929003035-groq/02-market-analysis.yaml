    columns:
      - Category
      - Included Spend
      - Excluded Spend
      - Primary Buyer
      - Relevance to Groq
    rows:
      - - Managed Cloud Inference APIs
        - Pay-per-token API calls, reserved cloud inference throughput, OpenAI-compatible proxy endpoints
        - Application SaaS subscriptions, front-end web hosting, end-user seat licenses
        - AI Engineering Leads, VP of Technology, CTO
        - Direct core revenue channel via GroqCloud consumption billing
      - - Dedicated Enterprise Systems
        - On-premises rack deployments, private cloud pods, custom hardware leasing contracts
        - General enterprise server hardware, storage area networks, desktop workstations
        - Chief Information Officer, VP of Infrastructure
        - Direct enterprise revenue via GroqRack deployments and managed system operations
      - - Sovereign AI Infrastructure
        - National AI cluster builds, sovereign datacenter capacity, long-term multi-megawatt compute agreements
        - Civil construction, physical real estate, public utility power grid transmission assets
        - Sovereign Wealth Funds, National Ministries, Telecom Operators
        - Reported Saudi infrastructure arrangements and Bell Canada plans provide context, not measured current segment revenue
      - - Model Training Compute
        - Multi-node foundational training runs, pre-training clusters, distributed checkpointing
        - Standalone consumer SaaS, edge microcontrollers, end-user seat licenses
        - AI Research Directors, Foundation Model Training Teams
        - Adjacent market; retained evidence shows current Groq clusters can support training and inference, but this report does not quantify training-only spend
    claimRefs:
      - CM001
      - CM002
      - CM003
