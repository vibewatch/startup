callouts:
  - calloutType: "insight"
    title: "Market Transition from Silicon Vendor to Neocloud Operator"
    body: "Groq's market posture underwent a structural reset following the December 2025 non-exclusive licensing agreement with Nvidia. Rather than attempting to challenge Nvidia's semiconductor hardware monopoly with standalone chip sales, Groq leveraged its August 2026 financing to become an Nvidia Cloud Partner, focusing on operating high-density inference datacenter clusters."
    claimRefs:
      - "CM014"
      - "CM015"
  - calloutType: "risk"
    title: "Capital Intensity and Power Availability Constrain Addressable Scale"
    body: "While customer demand for fast inference continues to outstrip supply, Groq's obtainable market share is strictly dictated by data center colocation access and power capacity. Expanding from 54 MW to over 200 MW requires massive capital investment in hardware and grid interconnects amid intense competition from incumbent hyperscalers."
    claimRefs:
      - "CM006"
      - "CM013"
