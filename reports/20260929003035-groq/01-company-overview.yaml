  - CO012
- calloutType: insight
  title: Strategic Repositioning from Semiconductor Challenger to Infrastructure Utility
  body: The August 2026 announcement describes a $350M Series A at a $3.5B valuation, with planned Nvidia participation and
    customary closing conditions. Together with the company-reported $650M June raise, it supplies a $1B recent-financing
    context rather than a disclosed cash balance. Groq plans to combine its LPU operations with Nvidia clusters across a reported
    13-site footprint, but neither the financing mark nor the capacity plan establishes profitable unit economics, available
    runway, or continuity of historical shareholder claims.
  claimRefs:
  - CO003
  - CO007
  - CO010
