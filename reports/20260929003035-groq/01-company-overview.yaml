company:
  name: Groq
chapter:
  number: 1
  title: Company Overview
  summary: Groq began in 2016 as an AI accelerator developer and later added GroqCloud. A reported December 2025 Nvidia licensing
    agreement accompanied the departure of founder Jonathan Ross and senior technical personnel. On August 17, 2026, Groq
    LLC announced a $350M Series A at a $3.5B valuation, led by Disruptive with planned Nvidia participation and subject to
    customary closing conditions. The announced neocloud expansion does not establish legal or shareholder continuity with
    historical financing.
sections:
- id: identity-and-corporate-evolution
  title: Corporate Identity, Genesis, and Strategic Pivot
  body: Historical sources describe Groq, Inc. as an American AI accelerator company founded in 2016 by former Google engineers
    Jonathan Ross and Douglas Wightman, with headquarters in Mountain View. Its LPU architecture and GroqCloud service provide
    context for the company's inference business; Wikipedia explicitly dates the GroqCloud soft launch to February 19, 2024.
    Reporting describes a December 2025 non-exclusive licensing arrangement with Nvidia and the departure of Ross, Sunny Madra
    and senior technical personnel. The retained material discusses possible antitrust motivations and scrutiny, not a regulator
    decision blocking an outright Groq acquisition. Groq's August 2026 announcement names Groq LLC and describes training-
    and inference-capable Nvidia clusters alongside its LPU experience. The brand and financing narrative do not establish
    legal succession, shareholder continuity or the exact retained technology rights, which require corporate and transaction
    documents.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO006
  - CO007
  - CO011
  - CO013
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: governance-and-leadership-transition
  title: Governance Rebuild and Key-Person Transition
  body: 'The retained sources establish a reported leadership transition but not a fully verified current executive register.
    RevenueMemo''s 2026 profile lists Adam Winter as CEO and Matt Eng, Alan Rice, Sinclair Schuller and Rakesh Malhotra as
    the rebuilt finance, operations, technology and product leaders. Those names and appointment narratives remain attributed
    directory observations rather than independently inspected primary appointment records. Alex Davis has stronger direct
    support: the August 2026 company release names him executive chairman and CEO of Disruptive. RevenueMemo also explicitly
    says equity stakes, voting rights and board-control provisions are undisclosed. Lead-investor status and a chairmanship
    therefore do not establish majority ownership or voting control. Founder and senior technical departures create execution
    questions, but retained engineering capability, organizational responsibilities and current management appointments require
    separate confirmation.'
  claimRefs:
  - CO004
  - CO005
  - CO008
  - CO011
  tableRefs:
  - TO002
- id: capitalization-and-scale-metrics
  title: Capital Structure, Reset Valuation, and Neocloud Capacity
  body: Groq has reported financing across materially different strategic periods, so its historical and current marks need
    separate interpretation. TechCrunch reports a $6.9 billion September 2025 valuation and says the subsequent Nvidia licensing
    transaction paid proceeds to investors. On August 17, 2026, Groq LLC announced a $350 million Series A at a $3.5 billion
    valuation, led by Disruptive with planned Nvidia participation and subject to customary closing conditions. The company
    combines that announcement with $650 million raised in June as $1 billion of recent funding; this is not disclosed cash,
    runway, or an audited lifetime total. RevenueMemo separately reports more than $2.3 billion in historical equity funding,
    without reconciling that coverage to the current legal entity and capital structure. Company-reported operating metrics
    include 13 data centers in four broad regions, more than six million developers, and trillions of weekly tokens. Its planned
    expansion from 54 MW to more than 200 MW in 2027 is a capacity target, not delivered capacity or a revenue forecast. Closing
    documentation, ownership continuity, audited financials and use of proceeds remain diligence requirements.
  claimRefs:
  - CO003
  - CO007
  - CO009
  - CO010
  - CO012
  - CO014
  - CO015
  - CO016
