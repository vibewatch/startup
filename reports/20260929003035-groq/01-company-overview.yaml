  title: Licensing Structure and Retained Rights Require Verification
  body: Retained reporting describes non-exclusive licensing and senior personnel moving to Nvidia, while commentary discusses
    possible antitrust motivations. That does not establish an agency finding, a blocked Groq acquisition or transfer of every
    intellectual-property right. Groq's Nvidia Cloud Partner role creates supplier and execution questions, but retained rights,
    allocation terms and present legal and shareholder continuity require transaction documents rather than inference from
    the deal headline.
  claimRefs:
