- id: TV004
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation range (USD B)
  - Probability signal
  - Primary failure mode
  rows:
  - - Bull
    - Cyber Command and adjacent mission work convert into a much larger recurring program base; margins clear as software-like; investor premium holds.
    - 1.3-1.7
    - Possible but under-proven on public evidence
    - Current contract proof turns out to be too small or too services-heavy.
  - - Base
    - The company is strategically real and wins follow-on work, but remains concentrated, delivery-heavy, and partially opaque.
    - 0.8-1.1
    - Most defensible public-evidence case
    - Program expansion lags the expectations implied by the current mark.
  - - Bear
    - Ceiling values do not translate into meaningful recognized revenue; oversight, procurement friction, or concentration compress the premium.
    - 0.4-0.7
    - Material risk if diligence disappoints
    - Investors discover a thinner revenue base and less attractive common-equity terms.
  notes: Ranges are valuation judgments derived from the evidence file, not market quotes or audited company forecasts.
  claimRefs:
