  - CV039
  - CV040
- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Contract economics disappoint
    - Obligated or recognized revenue is far below the headline contract narrative
    - The round was priced on future scale that is not yet economically visible.
    - Re-cut fair value and pause underwriting.
  - - Services mix dominates
    - Gross margin or delivery model looks contractor-like rather than software-like
    - The premium cyber-platform comp set no longer applies cleanly.
    - Move valuation toward the low end of the range.
  - - Concentration remains extreme
    - A handful of agencies or programs drive the majority of economics
    - Customer risk and procurement timing volatility stay too high for premium pricing.
    - Require a lower entry price or stronger protections.
  - - Policy friction rises
    - Oversight, authority, or intelligence-equity issues slow deployment or expansion
    - Strategic demand remains real but monetization slows materially.
    - Extend time horizon and lower multiple assumptions.
  - - Round terms are investor-protective
    - Preferences, secondaries, or structure erode common-equity upside
    - Headline valuation stops being a useful proxy for return potential.
    - Do not rely on the mark without cap-table diligence.
  notes: These triggers are designed to be monitored in diligence and the next financing cycle, not only at IPO time.
  claimRefs:
  - CV015
  - CV016
  - CV023
  - CV035
  - CV036
  - CV040
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Contract-to-revenue bridge
    - Award ceiling, obligations, recognized revenue, and option-year structure for the Cyber Command and Navy work
    - Determines whether the visible traction is economically large or just strategically notable.
    - Management data room plus contracting counsel review.
  - - Revenue quality
    - ARR or revenue run rate, gross margin, NRR, retention, and services mix
    - Decides whether software-platform comps or contractor-like comps belong.
    - CFO pack, board KPIs, and customer cohort review.
  - - Concentration and renewals
    - Revenue by agency, program, and contract renewal date
    - Tests whether the business is broadening or still dependent on a narrow mission set.
    - Customer concentration schedule and pipeline walk-through.
  - - Round mechanics
    - Preference stack, secondary mix, anti-dilution, and any investor side letters
    - Determines actual return economics for new money.
    - Cap table, term sheet, and lead counsel memo.
  - - Competitive proof
    - Win-loss data against established cyber platforms and other defense-autonomy vendors
    - Shows whether the mission narrative converts into real purchasing decisions.
    - Commercial diligence, customer references, and procurement debriefs.
  notes: Every item in this table can move the relevant comp set and the valuation range; none are cosmetic asks.
