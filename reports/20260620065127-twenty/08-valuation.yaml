- id: TV003
  title: Comparable Valuation Table
  enumerationScope:
    coverage: exhaustive
    basis: 'Rows cover every structural reference set used in this chapter: founder-pedigree cyber exits, public AI-security platforms, services-heavy adjacent cyber models, defense-autonomy analogs, and category-rhetoric cautions.'
  columns:
  - Comparable set
  - Current status or signal
  - Why it matters
  - Relevance to Twenty
  - Limitation
  rows:
  - - Expanse / Palo Alto lineage
    - Past cyber-platform exit pedigree
    - Shows the founders have seen a valuable national-security cyber asset built before.
    - Good pedigree signal for team quality and buyer understanding.
    - Pedigree is not a valuation multiple for the new company.
  - - Darktrace / SentinelOne
    - Public AI-security platform analogs
    - Show that machine-speed and autonomous-security narratives can become large, durable software categories.
    - Helpful structural benchmark for what premium cyber software can look like.
    - Both disclose far more economics than Twenty does and target different buyers.
  - - Mandiant
    - Services-plus-software cyber model
    - Useful caution that adjacent cyber categories can stay expertise- and services-heavy.
    - Important if Twenty’s delivery model is more bespoke than software-like.
    - Not an offensive-cyber or pure-software analog.
  - - Anduril / Shield AI
    - Defense autonomy mission-software analogs
    - Show that national-security autonomy platforms can attract strong strategic support.
    - Helpful for thinking about mission-software appetite outside traditional cyber.
    - They are not cyber businesses and do not solve Twenty’s pricing opacity.
  - - IronNet
    - Category-rhetoric caution
    - Reminds investors that ambitious cyber-platform language is not itself valuation proof.
    - Useful adverse check against narrative overreach.
    - Current public material is qualitative and does not by itself explain the full downside path.
  - - Recorded Future / threat-intel adjacency
    - Large adjacent intelligence-spend signal
    - Supports the idea that cyber decision support can command meaningful budgets.
    - Useful for market adjacency, especially if Twenty expands beyond narrow mission execution.
    - Adjacency is not proof of identical customers, margins, or multiples.
  notes: This is a structural comp table because the reviewed source set does not disclose enough peer financial detail to support a clean numerical-multiple table.
