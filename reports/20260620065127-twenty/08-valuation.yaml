- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Demand proof
    - Real government contracts and mission-work references suggest genuine buyer pull.
    - Visible awards could still be small prototypes or ceilings rather than durable software revenue.
    - Contract numbers, obligations, renewal cadence, and recognized-revenue bridge.
  - - Category timing
    - AI-enabled cyber operations fit the broader push toward machine-speed operations.
    - Category enthusiasm can outrun monetization, especially in opaque government markets.
    - Evidence of repeatable program expansion and customer-level budget ownership.
  - - Pedigree
    - Expanse / Palo Alto lineage and strong investors support founder credibility.
    - Pedigree helps sourcing and hiring, but it does not replace current unit economics.
    - Proof that current product economics clear as software, not just contractor capability.
  - - Concentration
    - Deep government focus can create defensibility and mission intimacy.
    - It can also create procurement friction, oversight drag, and customer concentration.
    - Agency mix, pipeline diversity, and data on non-pilot renewals.
  - - Price today
    - A $1B mark could be justified if current contracts are an early wedge into much larger recurring programs.
    - Without ARR, margin, and NRR disclosure, the same mark may simply be paying up for strategic narrative.
    - Private KPI pack plus round-term disclosure.
  notes: The anti-thesis is mostly about evidence quality and contract economics rather than disbelief that the product category exists.
