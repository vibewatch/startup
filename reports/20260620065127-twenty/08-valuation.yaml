- id: diligence-gates-and-thesis-breaks
  title: Diligence Gates and Thesis-Breaks
  body: 'The diligence burden here is unusually specific. First, investors need contract-level economics, not headlines: obligated value, revenue-recognition timing, option-year structure, renewal cadence, and whether the visible Navy and Cyber Command work is prototype, software subscription, services delivery, or some blend of all three. Second, they need the private metrics that separate a strategic story from a financeable platform: ARR or revenue run rate, gross margin, retention, concentration, and the degree of dependence on a handful of mission buyers. Third, they need the cap-table reality of the June 2026 round, including any liquidation preferences, secondaries, or investor protections that make the headline $1 billion less meaningful for new common-equity holders. The thesis breaks if these answers come back weak. A materially smaller revenue base than the headline narrative implies, heavy services mix, weak renewals, or investor-protective round terms would all compress the
    reasonable valuation range fast. Until those points are verified, the company merits active tracking, not blind underwriting.'
