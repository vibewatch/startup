company:
  name: Twenty Technologies, Inc.
chapter:
  number: 8
  title: Valuation
summary: Twenty’s June 2026 $1 billion Series B mark is strategically plausible because the company has elite investors, real government contract proof, and credible mission pedigree, but the public file is far too thin on revenue quality to call the entry attractive. No reviewed source discloses ARR, recognized revenue, gross margin, NRR, customer concentration, or round terms. The best-supported recommendation is therefore research-more with medium confidence, high risk, and a stretched valuation stance. The upside case depends on visible contract wins converting into a much larger recurring program base; the downside case is multiple compression once investors look past narrative and into economics.
sections:
- id: pricing-context-and-disclosure-gap
  title: Pricing Context and Disclosure Gap
  body: 'Twenty has a real financing signal and a real demand signal, but still not a public operating model. The strongest pricing fact in the file is the June 17, 2026 Series B: Axios said the company raised $100 million at a $1 billion valuation and pushed total disclosed funding to $138 million. The historical baseline is also clear enough: the November 2025 stealth-exit release disclosed $38 million of total funding and tied the business to Caffeinated Capital, General Catalyst, and In-Q-Tel. What remains unclear is almost everything an investor would normally underwrite between those two marks. No reviewed public source discloses ARR, recognized revenue, gross margin, NRR, customer count, backlog, or the mix between software and delivery. Even the best demand proof in the file—the Cyber Command contract worth up to $12.6 million and the separate $240,000 Navy research award—supports traction more than economics. The word ''up to'' matters: it points to ceiling value, not proven recognized
    revenue. On public evidence alone, the round is real, but the underlying revenue engine is still opaque.'
