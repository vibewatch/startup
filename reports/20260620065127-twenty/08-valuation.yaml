  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Contract numbers, obligations, option-year structure, and recognized-revenue timing for the Cyber Command and Navy awards.
    whyItMatters: The current valuation can look fair or stretched depending on whether visible awards are small wedges or the first step in a much larger revenue base.
    diligencePath: Obtain contract schedules, period-of-performance data, and revenue-recognition memos from finance and contracting counsel.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV028
  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: ARR or current revenue run rate, gross margin, NRR, retention, and delivery-versus-software mix.
    whyItMatters: These metrics decide whether premium software analogs or lower contractor-like analogs are the right comp frame.
    diligencePath: Review CFO model, board KPIs, and cohort retention cuts before making any price-sensitive recommendation.
    relatedQuestionRefs:
    - QV007
    - QV022
    - QV028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue by agency, program, and renewal cycle plus any non-U.S. government or non-government customer exposure.
    whyItMatters: Concentration determines both downside volatility and how much of the current strategic premium is durable.
    diligencePath: Request top-customer concentration schedule, pipeline by agency, and renewal calendar.
    relatedQuestionRefs:
    - QV025
    - QV028
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Preference stack, secondary mix, anti-dilution terms, and any other investor protections in the June 2026 round.
    whyItMatters: Headline post-money valuation can materially overstate the economics available to new investors or common holders.
    diligencePath: Review the signed term sheet, cap table, and counsel summary before underwriting the current mark.
