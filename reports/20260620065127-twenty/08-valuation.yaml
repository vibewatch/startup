- id: structural-comps-and-what-they-do-not-prove
  title: Structural Comps and What They Do Not Prove
  body: 'The right comp frame for Twenty is structural, not arithmetic, because the company has not published the metrics needed for a normal revenue-multiple exercise. Some signals are positive. The Expanse-to-Palo Alto lineage is a credible pedigree marker, not a guarantee but evidence that the founding team has seen a valuable cyber platform built and sold before. Darktrace and SentinelOne show that buyers and public investors will back AI-driven, machine-speed security platforms when they can see category breadth and operating data. Anduril and Shield AI show that national-security buyers can support autonomy-centric mission software businesses outside cyber. But those are only partial analogs. Mandiant reminds investors that adjacent cyber categories can remain service-intensive, while the House testimony and Atlantic Council research show that private offensive cyber carries governance and opacity burdens that do not disappear just because demand is real. IronNet is also useful as
    a humility check: premium cyber-platform rhetoric exists in many adjacent companies, so language about AI, nations, and mission urgency is not by itself valuation proof.'
