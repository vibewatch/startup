    rows:
      - - U.S. Cyber Command
        - Program office / mission leadership / operators
        - Offensive-cyber workflow acceleration and mission execution
        - Forbes-reported contract up to $12.6M; repeated by Tectonic; broader military-contract references in Bloomberg/Axios
        - Highest-confidence named buyer; validates real procurement traction
        - No contract number, obligated amount, or deployment scope disclosed
      - - U.S. Navy
        - Research sponsor / technical buyer / operators or tool developers
        - Research-stage offensive-cyber capability evaluation
        - Forbes-reported $240K Navy research contract; echoed by Tectonic
        - Demonstrates second named government buyer and non-single-agency reach
        - Research contract does not prove fleet-wide operational rollout
      - - Intelligence Community agencies (unnamed)
        - Mission owners / cleared analysts / operators
        - Mission deployment, analysis, and operations support in classified settings
        - PRNewswire, Axios, careers page, and WVU partnership all reference IC work or IC deployment roles
        - Potentially large strategic value if embedded in repeat mission programs
        - No named agencies, outcomes, or contract values disclosed
      - - Broader U.S. military organizations (unnamed)
        - Service or joint commands / operators / mission teams
        - End-to-end systems for offensive cyber missions and readiness improvement
        - Company and media sources describe partnerships with the U.S. military during stealth and thereafter
        - Broadens beyond one command if substantiated
        - Public evidence is cohort-level only, not named-program level
      - - Universities / workforce partners
        - Education partner / student interns / future operators
        - Talent pipeline, applied research, and experiential mission support
        - WVU partnership for internships and applied research tied to top military and intelligence missions
