  - id: TU004
    title: Buyer pain and procurement logic
    columns:
      - Buyer pain / enabler
      - Evidence
      - Why it matters for Twenty
      - Impact
      - Diligence path
    rows:
      - - Offensive-operator training bottleneck
        - ION training takes 1–3 years and costs $220K–$500K per service member
        - Automation that preserves elite tradecraft can lower readiness drag and reduce dependence on scarce experts
        - High
        - Ask whether Twenty is funded from training, mission-software, or R&D budget lines
      - - Classified-workflow expense
        - Offensive training historically had to occur in highly classified environments, increasing cost and friction
        - Supports demand for software that can standardize workflows across sensitive environments
        - High
        - Request deployment model, enclave requirements, and accreditation path
      - - CMF readiness churn
        - Teams cycle in and out, losing institutional knowledge; Nakasone wants longer tenure and repeat tours
        - Twenty’s software narrative directly addresses knowledge capture and continuity
        - High
        - Ask for proof that operators can onboard faster or execute more missions per person
      - - JCWA acquisition path
        - JCWA includes C2, big data, training, and offensive-operations tooling under Cyber Command budget control
        - Clarifies a plausible procurement lane for platform expansion
        - Medium
        - Map each current contract to JCWA element, vehicle, and recompete timing
      - - Machine-speed adversaries
        - CyberScoop sources describe AI agents operating across hundreds of threads and compressing response windows
        - Reinforces why buyers may tolerate rapid experimentation with offensive-cyber automation
        - Medium
        - Validate whether customer urgency has translated into multi-year program funding
    notes: >
      This table explains adoption logic rather than named-customer count. Impact ranks how strongly each buyer condition supports
      Twenty’s value proposition and procurement credibility.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024]

  - id: TU005
    title: Retention, expansion, and concentration signals
    columns:
      - Metric / risk
      - Value or evidence
      - Segment
      - Confidence
      - Diligence ask
    rows:
      - - NRR / GRR
        - null — not disclosed
        - All customers
        - low
        - Request renewal, option-exercise, and recompete data by agency under NDA
      - - Contract length / option structure
        - null — not disclosed
        - All customers
        - low
        - Request base period, option years, and ceiling-to-obligation conversion by award
      - - Persistence proxy
        - Military and IC contracts still referenced by Axios in June 2026 after stealth-period contracts surfaced in Nov 2025
        - Government cohort
        - medium
        - Ask whether this reflects renewal, expansion, or merely ongoing initial award performance
      - - Delivery-depth proxy
        - Cleared mission-deployment, forward-deployed, and IC roles remain open in 2026
        - Government cohort
        - medium
        - Ask for deployment-headcount-to-program ratio and customer-support model
      - - Expansion vector
        - Could grow from research or single-command awards into wider military and IC programs through JCWA-style procurement lanes
        - Government cohort
        - medium
        - Request pipeline by current customer, adjacent agency, and allied buyer
      - - Concentration risk
        - Every public proof point is U.S.-government national-security demand; no commercial customers named
        - Revenue mix
        - high
        - Request top-3 customer share, civilian-vs-military split, and non-U.S. exposure
      - - Proof-quality risk
        - Core headline contract is an “up to” ceiling and underlying procurement record was not directly visible in fetched evidence
        - Revenue quality
        - medium
        - Pull official award IDs and obligated amounts from USASpending or FPDS before underwriting revenue quality
    notes: >
      Nulls are intentional because public retention and revenue-mix disclosures are absent. The table uses hiring and repeat media
      references only as durability proxies, not as substitutes for renewal metrics.
    claimRefs: [CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU040]

  - id: TU006
    title: Customer diligence ask register
    columns:
      - Diligence ask
      - Why needed
      - Current evidence gap
      - Decision implication
    rows:
      - - Provide Cyber Command and Navy award IDs, base periods, and obligated amounts
        - Distinguishes ceiling value from recognized revenue and clarifies scope
        - Public sources cite contracts but not official award detail
        - Essential before crediting the headline $12.6M as revenue-quality traction
      - - Provide named or anonymized count of active IC agencies and mission programs
        - Tests whether IC traction is one pilot or a repeatable customer set
        - Public proof names only an IC cohort, not agencies
        - Critical for assessing concentration and platform breadth
      - - Provide renewal, option-exercise, or recompete history by contract
        - Establishes whether contracts convert into durable relationships
        - No public NRR, GRR, or award-continuation data exists
        - Directly changes confidence in customer durability
      - - Provide customer-reference calls or redacted operator outcomes
        - Converts existence proof into mission-impact proof
        - No named end-user testimonials or quantified outcomes are public
        - Needed to separate interesting technology from indispensable workflow
      - - Provide revenue mix by top customers and by military versus IC exposure
        - Measures concentration risk and downside if one program stalls
        - All public customer proof is government and national-security facing
        - Needed to size single-customer and budget-cycle exposure
    notes: >
      This table converts the chapter’s largest unresolved customer questions into specific diligence asks. It is additive to the
      retention table because public proof exists for customer presence but not for customer durability or breadth.
    claimRefs: [CU016, CU025, CU029, CU030, CU031, CU037, CU040]

figures:
  - id: FU001
    title: Customer journey map — Twenty’s government mission path
    type: journey-map
    layout: wide
    summary: Maps how a national-security buyer could move from threat pressure to sustained mission use of Twenty’s platform.
    data:
      items:
        - label: Threat pressure from nation-state cyber activity and machine-speed attacks
        - label: Readiness bottleneck identified by Cyber Command or service leadership
        - label: Evaluation in cleared environment with mission operators and program sponsors
        - label: Initial research or pilot contract for offensive-cyber workflow tooling
        - label: Human-governed deployment into mission operations and analyst workflows
        - label: Follow-on support through forward-deployed analysts, SREs, and IC mission leads
        - label: Expansion into additional commands, agencies, or allied use cases if outcomes hold
        - label: Long-term retention depends on renewal data, obligational follow-through, and referenceable mission impact
    approximationNotes: >
      Journey stages synthesize contract evidence, hiring signals, and government readiness reporting; no public customer has
      disclosed its full procurement-to-deployment workflow for Twenty.
    claimRefs: [CU001, CU002, CU003, CU017, CU018, CU019, CU020, CU027, CU033]

  - id: FU002
    title: Adoption and deployment flow
    type: flow
    layout: standard
    summary: Shows the procurement and deployment logic linking readiness pain to contract expansion.
    data:
      nodes:
        - label: Nation-state threat / operational urgency
        - label: Readiness gap and operator scarcity
        - label: Budget owner / procurement lane
        - label: Pilot or research contract
        - label: Cleared mission deployment
        - label: Follow-on contract or wider program adoption
    approximationNotes: >
      Flow stages are inferred from DefenseScoop reporting on training and acquisition, plus Twenty’s public contract and hiring
      evidence. The figure is logical rather than quantitative because no conversion ratios are disclosed.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU029, CU034]

  - id: FU003
    title: Customer proof quality matrix
    type: matrix
    layout: wide
    summary: Distinguishes the quality of public proof across named agencies and broader customer cohorts.
    data:
      columns:
        - Low proof (company or partner claim only)
        - Medium proof (multiple sources, still indirect)
        - Higher proof (named contract or named buyer)
      rows:
        - label: Buyer named, scope unclear
          values:
            - ''
            - U.S. Navy research contract
            - U.S. Cyber Command contract up to $12.6M
        - label: Buyer cohort named, agency unnamed
          values:
            - U.S. military cohort
            - Intelligence Community cohort
            - ''
        - label: Delivery / talent signal, not revenue proof
          values:
            - WVU partnership and careers roles
            - Cleared deployment hiring footprint
            - Congressional testimony / policy visibility
    approximationNotes: >
      Matrix placement reflects proof quality, not customer value. Higher proof means more concrete public evidence, not necessarily
      larger revenue or deeper production maturity.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU026, CU027, CU028, CU040]

