- id: operational-security-and-people-fragility
  title: Operational security, control, and people fragility
  body: The company is also exposed to failure modes that are specific to offensive cyber operations rather than generic SaaS execution. Public sources describe AI agents scanning many targets, attack-path tooling, persona-development work, and machine-speed workflows that still keep humans in consequential decisions. That lowers one category of autonomy risk, but it does not remove custody-chain risk, model misuse risk, or the chance that leaked tooling can be studied and used against U.S. targets. Industry and government sources both warn that AI is compressing attacker timelines and making exploit discovery faster, while CISA and MITRE reinforce that defenders operate against continuously evolving threat actors and technique sets. NIST’s cyber supply-chain risk-management program adds a related burden; in federal-sensitive environments, trust depends not only on model behavior but also on how software components, vendors, and upstream dependencies are governed. On the labor side, Twenty's job boards and careers pages point to heavy dependence on TS/SCI-cleared data engineers, forward-deployed reliability staff, offensive research engineers, and mission architects. DefenseScoop's reporting on operator training costs
    and readiness churn shows how expensive and slow that talent base is to build, which means execution can bottleneck on people as much as on software.
