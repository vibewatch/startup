    - Pause underwriting of durable deployment at scale
  - - Talent bottleneck
    - Cleared hiring and retention
    - Critical cleared roles remain open for two or more consecutive quarters
    - Assume delivery friction, slower onboarding, and higher burn
  - - Customer concentration
    - Referenceable award / renewal evidence
    - No additional independently referenceable contracts or renewal proof beyond current public anecdotes
    - Do not underwrite broad platform adoption or premium multiple persistence
  - - Narrative outruns execution
    - Deployment proof versus valuation and hiring pace
    - Public valuation / capital milestones continue without stronger control or customer evidence
    - Move view toward research-more / avoid unless price resets or diligence closes gaps
  notes: Kill criteria are framed around externally checkable milestones because public evidence remains stronger on urgency and funding than on durable control maturity or renewal depth.
