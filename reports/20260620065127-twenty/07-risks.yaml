  evidenceGaps:
  - type: missing-source
    severity: material
    topic: export-controls
    missingEvidence: A Twenty-specific export-classification memo or counsel view on whether any current or planned allied support triggers EAR or ITAR licensing.
    whyItMatters: The company publicly references allies, so international upside and support models cannot be underwritten cleanly without a classification position.
    diligencePath: Request outside-counsel export analysis, any commodity-classification filings, and a policy for allied deployments or support access.
    relatedQuestionRefs:
    - QR004
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: government-contracts
    missingEvidence: Award identifiers, obligated amounts, contract type, period of performance, and renewal or option structure for the publicized Cyber Command and Navy contracts.
    whyItMatters: Revenue concentration, procurement timing, and durability are hard to judge when the public record stops at headline contract mentions.
    diligencePath: Request redacted award documents, invoice or obligation history, and customer-approved program reference language.
    relatedQuestionRefs:
    - QR007
    - QR008
  - type: private-evidence-only
    severity: blocking
    topic: control-proof-gap
    missingEvidence: Independent security, approval-control, audit-log, and deployment-segregation evidence for offensive workflows in sensitive environments.
    whyItMatters: Human-in-the-loop messaging is not enough to underwrite safe scale without proof of how authorities, logging, and release controls work in practice.
    diligencePath: Request architecture review, red-team or security assessments, approval workflow diagrams, and incident-response materials used with government customers.
    relatedQuestionRefs:
    - QR022
    - QR030
  - type: conflicting-data
    severity: material
    topic: active-defense-boundaries
    missingEvidence: A clear matrix of which activities Twenty performs directly, which are customer-directed, and which require additional legal or policy approvals.
    whyItMatters: The public debate around private-sector offensive cyber is active, and the line between analysis, active defense, and offensive action can affect legal and reputational risk.
    diligencePath: Review authorities memo, customer rules-of-engagement language, and escalation or denial procedures for borderline mission requests.
    relatedQuestionRefs:
    - QR004
    - QR030
  - type: missing-source
    severity: material
    topic: customer-durability
    missingEvidence: Referenceable renewal, expansion, backlog, or contract-duration evidence beyond current contract anecdotes and partner statements.
    whyItMatters: A premium valuation can be defended only if programs persist and expand, not just if early flagship wins exist.
    diligencePath: Request cohort of active programs, renewal timing, expansion history, and customer reference calls where classification allows.
    relatedQuestionRefs:
    - QR007
    - QR021
    - QR025
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A full clause-by-clause register of export, procurement, and oversight requirements across every agency or allied deployment scenario.
    whyItMatters: The chapter can rank the main public regime clusters without this, but deeper diligence still needs a complete controls matrix.
    diligencePath: Expand the compliance workstream with counsel and program-security owners after access to internal contracts and deployment plans is available.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
