- id: mitigation-maturity-and-kill-triggers
  title: Mitigation maturity, monitoring, and kill triggers
  body: 'The mitigation picture is credible but incomplete. Public materials consistently say humans remain in the loop, that deployment is controlled, and that the company is expanding engineering and research rather than over-promising fully autonomous offense. Those are useful starting points, especially in a category where unmanaged autonomy would be commercially and politically untenable. But there is still no public audit package, control attestation, export-classification memo, or contract-level evidence showing how the company clears licenses, logs approvals, segments sensitive environments, or proves renewal durability. FedRAMP’s public marketplace also shows what a visible federal-assurance surface can look like, yet Twenty’s public materials still do not point to an analogous authorization or independently referenceable control artifact. That means the investment implication should be framed around milestones, not narratives: a clean export/compliance map, independently referenceable contract evidence, successful cleared hiring, and customer proof that survives beyond founder- and policy-led storytelling. If those do not materialize, the same warfighting urgency that makes Twenty compelling could
    amplify downside through oversight shock, procurement slippage, or reputational blowback.'
