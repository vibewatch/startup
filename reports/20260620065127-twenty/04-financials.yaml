callouts:
  - calloutType: strength
    title: Capital Access Is Proven
    body: >-
      Twenty has already done the hard part of capital formation for a very young company: it raised
      $38M at stealth exit, then $100M more at a $1B valuation seven months later, with top-tier
      defense-tech and venture names involved. That sharply reduces financing-access risk in the near
      term even though operating efficiency is still opaque.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004

  - calloutType: risk
    title: Contract Headlines Are Not Revenue Quality
    body: >-
      The strongest public customer proof point is also the most important caveat: the Cyber Command
      award is reported as worth up to $12.6M, which is a ceiling value, not a disclosed recognized
      revenue figure. Without obligations, billing schedules, or delivery mix, public contract
      signals cannot be used as a clean top-line proxy.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI017
      - CI020

  - calloutType: risk
    title: Private-Metric Opacity Is the Core Diligence Blocker
    body: >-
      There is no public revenue, ARR, gross margin, burn, runway, NRR, or precise customer-count
      disclosure. The financial downside case is therefore not primarily about whether demand exists;
      it is about whether the company can convert venture capital and early government traction into
      efficient, repeatable economics before another financing event is required.
    claimRefs:
      - CI010
      - CI018
      - CI019
      - CI024

