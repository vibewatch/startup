    rows:
      - - Total disclosed funding
        - $138M through 2026-06-17
        - Series A plus Series B public announcements
        - Proven access to capital, but not proof of operating efficiency
        - Reconcile net cash raised after fees and any employee tender or secondary activity
      - - Cash on hand
        - Undisclosed
        - No public balance-sheet disclosure
        - Current solvency and investment pace cannot be judged
        - Request treasury balance and latest monthly cash report
      - - Monthly burn
        - Undisclosed
        - No public operating disclosure
        - Cannot size how fast Series B proceeds are being consumed
        - Request monthly burn by R&D, delivery, G&A, and recruiting
      - - Runway months
        - Undisclosed
        - No public management guidance
        - Next financing timing cannot be modeled
        - Request base / upside / downside runway model used by management or board
      - - Planned use of funds
        - R&D and existing roadmap
        - CEO quote in Axios
        - Capital is being deployed into product and team expansion rather than publicly proven ARR
        - Request capital-allocation plan by function and by quarter
      - - Next-round trigger
        - Undisclosed
        - No public revenue or runway target
        - Hard to judge whether Series B is a scaling round or a bridge to product-market proof
        - Ask management what metrics must be hit before raising again
      - - Debt / project-finance obligations
        - No public debt or project-finance facility disclosed
        - Reviewed public sources through 2026-06-20
        - Absence of disclosure is not proof that no obligations exist
        - Confirm venture debt, equipment leases, letters of credit, and any classified-program working-capital facilities
