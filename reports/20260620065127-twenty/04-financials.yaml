        - Appears highly concentrated in U.S. military and intelligence buyers
        - Public customer references are exclusively national-security oriented
        - A small number of agencies could dominate revenue and renewal risk
        - Request revenue concentration by agency, program, and prime-contractor path
    notes: >-
      The capital story is unusually strong for a company with so little public operating disclosure.
      The funding history therefore reduces financing access risk but does not resolve capital
      adequacy.
