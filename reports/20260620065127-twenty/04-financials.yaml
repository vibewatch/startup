  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Why missing
      - Underwriting impact
      - Exact diligence path
    rows:
      - - Revenue / ARR / backlog
        - Private company does not publish operating financials
        - Impossible to measure scale, growth rate, or quality of demand
        - Request monthly revenue bridge, remaining performance obligations, and booked backlog
      - - Gross margin / services mix
        - No segment or cost disclosure
        - Cannot tell whether growth improves or compresses economics
        - Request gross margin by contract and split of software, labor, hosting, and subcontractor cost
      - - Burn / runway
        - No public cash-flow disclosure
        - Cannot assess whether Series B is ample or merely necessary
        - Request board cash slide, 12-month operating plan, and downside runway case
      - - Customer count / concentration / renewal
        - Only customer category, not roster or count, is public
        - Concentration and renewal risk are hidden
        - Request revenue by agency, contract renewal dates, and re-compete exposure
      - - Contract accounting
        - Public articles give ceilings and teaser amounts, not obligations or recognized revenue
        - Public contract signals may overstate realized economics
        - Obtain contract schedules showing awarded, obligated, invoiced, and recognized amounts
      - - Net revenue retention / expansion
        - No public cohort or account metrics
        - Cannot tell whether growth comes from renewals, expansion, or one-off awards
        - Request cohort analysis, upsell history, and contract-expansion rates
    notes: >-
      These are not cosmetic gaps. They are the minimum set of metrics needed to move from strategic
      interest to financial underwriting.
