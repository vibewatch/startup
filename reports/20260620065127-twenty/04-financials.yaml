  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-and-margin-disclosure
      missingEvidence: >-
        Actual revenue, ARR, gross margin, services mix, and recognized revenue by contract are not
        publicly disclosed.
      whyItMatters: >-
        Without these metrics, investors cannot determine whether Twenty is building a software-like
        business with leverage or a labor-intensive government-services motion with lower-quality
        gross profit.
      diligencePath: >-
        Request monthly revenue and gross-margin bridges by customer and by program, including the
        split among software, labor, hosting, and subcontractor cost.
      relatedTableRefs:
        - TI001
        - TI002
        - TI003
      relatedQuestionRefs:
        - QI001
        - QI002
        - QI009
    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-and-runway
      missingEvidence: >-
        Cash on hand, monthly burn, runway, and management's next-round trigger are not public.
      whyItMatters: >-
        Capital adequacy cannot be assessed just from funding history. A $138M-funded company can
        still be near another financing event if hiring, clearances, and delivery costs are high.
      diligencePath: >-
        Request treasury reports, board cash slides, monthly burn by function, and management's base,
        upside, and downside runway cases.
      relatedTableRefs:
        - TI003
        - TI004
      relatedQuestionRefs:
        - QI004
        - QI015
    - type: missing-source
      severity: material
      topic: contract-accounting-and-obligation-schedules
      missingEvidence: >-
        Public articles cite contract amounts but do not provide contract numbers, obligated amounts,
        billing schedules, periods of performance, or renewal mechanics.
      whyItMatters: >-
        Award ceilings can materially overstate realized economics. The difference between ceiling,
        obligation, invoice, and recognized revenue is central to underwriting a government-software
        company.
      diligencePath: >-
        Request contract schedules for all named programs, including CLIN structure, funded value,
        remaining option value, and accounting treatment.
      relatedTableRefs:
        - TI001
        - TI002
        - TI005
      relatedQuestionRefs:
        - QI005
        - QI010
    - type: private-evidence-only
      severity: material
      topic: customer-concentration-and-renewal
      missingEvidence: >-
        Public sources do not disclose customer count, revenue concentration by agency, renewal
        dates, or re-compete exposure.
      whyItMatters: >-
        A company selling primarily into military and intelligence channels can look strategically
        important while still depending on a very small number of budgets or classified programs.
      diligencePath: >-
        Request top-customer concentration, revenue by agency and program, renewal schedule, and any
        prime-contractor dependency.
      relatedTableRefs:
        - TI004
        - TI005
      relatedQuestionRefs:
        - QI011
        - QI014
    - type: missing-source
      severity: material
      topic: balance-sheet-obligations
      missingEvidence: >-
        No public source resolves whether Twenty carries venture debt, equipment leases, letters of
        credit, or other working-capital facilities linked to classified program delivery.
      whyItMatters: >-
        Hidden balance-sheet obligations can materially change runway, covenant risk, and dilution
        pressure even when headline venture funding looks ample.
      diligencePath: >-
        Request debt schedules, lease obligations, banking covenants, and any customer-advance or
        security-related working-capital arrangements.
      relatedTableRefs:
        - TI004
      relatedQuestionRefs:
        - QI012
