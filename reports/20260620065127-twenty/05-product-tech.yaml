- id: trust-controls-and-open-risks
  title: Trust, control posture, and open risks
  body: 'The best public trust signal is also the narrowest one: multiple sources say humans remain in control of consequential decisions and that deployment is controlled and mission aligned. That is necessary, but it is not enough. There is still no public control package showing how models are evaluated, how authorities are enforced, how logs are reviewed, or how the platform behaves in classified or air-gapped settings. The most concrete new public clue is a DevOps role that spells out single-tenant and multi-tenant AWS environments, Terraform-managed infrastructure, IAM and network-security controls, observability, and runbooks. Hiring for cleared data engineers and reliability/infrastructure roles therefore strongly suggests that sensitive deployment is a first-order product concern even if the enclave topology itself remains private. Regulatory context also matters. Export-control regimes and the broader policy debate around offensive cyber mean this category is not just hard technically; it is exposed to oversight, escalation, and proliferation concerns. Congressional testimony and Atlantic Council work both reinforce that skepticism. The result is a chapter with high conviction on strategic demand and medium conviction on product maturity. Twenty
    looks directionally like a credible mission platform, but its public disclosure remains too thin to underwrite resilience, safety controls, and interoperability without private diligence materials.'
