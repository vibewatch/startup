  evidenceGaps:
  - type: missing-source
    severity: material
    topic: module-disclosure
    missingEvidence: A public module catalog, docs portal, or architecture whitepaper that names the product components and their boundaries.
    whyItMatters: Without explicit modules or APIs, investors cannot tell whether the product is a durable platform, a services-heavy workflow, or a tightly held classified custom build.
    diligencePath: Request current product briefings, named modules, demo environment screenshots, and integration documentation under NDA.
    relatedQuestionRefs:
    - QE005
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: deployment-architecture
    missingEvidence: Deployment diagrams showing where data lives, what runs in customer enclaves, and how the platform behaves in classified or air-gapped environments.
    whyItMatters: Public hiring strongly implies sensitive-environment deployment, but deployment topology is central to security review, gross margin, and implementation risk.
    diligencePath: Request a classified/unclassified deployment architecture pack, hosting model matrix, and sample authority-to-operate or enclave boundary documentation.
    relatedQuestionRefs:
    - QE011
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-metrics
    missingEvidence: Uptime, mission success, false-positive, or time-to-target benchmarks plus any release cadence or incident-history disclosure.
    whyItMatters: A mission-critical cyber operations product cannot be underwritten on narrative alone when the buyer consequence of failure is operational rather than merely administrative.
    diligencePath: Request internal KPI dashboards, customer acceptance criteria, benchmark methodology, and post-mission review statistics.
    relatedQuestionRefs:
    - QE013
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Security certifications, audit letters, model-governance procedures, and red-team or legal-review processes covering offensive use of the platform.
    whyItMatters: The company sells into one of the most sensitive mission areas in government, so governance quality is a core part of the product, not a back-office issue.
    diligencePath: Request SOC 2 or equivalent materials, export-control compliance procedures, human-approval workflow design, and any model-evaluation or safety review artifacts.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE004
  - type: stale
    severity: minor
    topic: roadmap-specificity
    missingEvidence: A dated roadmap showing what shipped before Series B, what is in validation now, and what remains pre-deployment.
    whyItMatters: Investors can see hiring intensity and funding, but cannot yet separate already-deployed functionality from planned research programs.
    diligencePath: Request the internal release roadmap with milestone owners, dependency risks, and customer-linked shipment commitments.
    relatedQuestionRefs:
    - QE012
    - QE025
    relatedTableRefs:
    - TE005
