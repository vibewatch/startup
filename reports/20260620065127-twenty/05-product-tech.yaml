- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current manual workflow
  - Twenty solution signal
  - Measurable benefit signal
  - Limitation
  rows:
  - - Identify candidate targets
    - Analysts serialize recon across many systems and sources
    - AI agents scan many targets in parallel and surface weak points
    - Parallelization across hundreds of targets is explicitly claimed
    - Public evidence does not disclose precision, false positives, or source coverage
  - - Prioritize exploitable exposures
    - Human teams reconcile threat context with technical findings
    - End-to-end platform positioning implies triage plus prioritization inside one workflow
    - Better analyst leverage under machine-speed attack tempo
    - No public prioritization logic or scoring rubric
  - - Develop attack paths and course-of-action options
    - Operators and researchers assemble options manually from scattered tools
    - Attack path frameworks and automation tools are referenced in hiring evidence
    - Shorter cycle from detection to proposed action
    - No public benchmark on exploit-path quality or safety checks
  - - Approve offensive action
    - Humans review and decide on mission-relevant options
    - Public sources repeatedly say human judgment remains central
    - Governance model is clearer than fully autonomous offense
    - No public documentation on approval workflow design or logging
  - - Sustain mission execution in sensitive environments
    - Customer teams coordinate deployments and reliability support with scarce cleared talent
    - Forward-deployed SRE and mission roles suggest embedded deployment support
    - Better fit for real-world government operations than cloud-only tooling
    - Implementation burden and gross-margin profile remain undisclosed
  notes: Benefits are directional because Twenty does not publish mission KPIs, time-to-target metrics, or operator productivity benchmarks in public materials.
