company:
  name: Twenty Technologies, Inc.
chapter:
  number: 5
  title: Product & Technology
  summary: 'Twenty appears to be building an operator-governed offensive-cyber workflow platform rather than a single exploit or scanning tool: public evidence points to automation for target discovery, attack-path preparation, and continuous operations, with humans retaining authority over consequential actions. The product thesis is credible because it matches government pain around operator scarcity and machine-speed adversaries, but public product disclosure remains unusually thin: there are no named SKUs, docs, benchmarks, or control attestations that let an outside investor fully verify production maturity.'
sections:
- id: product-definition-and-user-workflow
  title: Product definition and user workflow
  body: 'Public evidence suggests Twenty is selling a mission workflow for offensive cyber operators, not a conventional enterprise security SKU. The company’s own language centers on industrializing the American arsenal for cyber warfare, building software that wins in war, and converting weeks of manual work into continuous operations across hundreds of targets. Third-party coverage fills in the missing workflow detail. Tectonic describes AI agents that scan large numbers of targets, identify weak points, and route proposed actions to human operators. Series B mirrors describe AI-enabled end-to-end systems for military and intelligence operators and emphasize that human judgment remains central to every offensive operation. Hiring signals reinforce that picture: the company is recruiting applied-AI engineers, backend and DevSecOps talent, forward-deployed analysts, mission architects, and mission deployment leads. That mix implies a product that combines automation, operator interfaces,
    and customer-embedded deployment support. Newly surfaced role pages sharpen that inference further: one senior backend opening explicitly references real-time operational signals, high-throughput APIs, and cloud/on-prem mission software, while a DevOps role describes AWS infrastructure, single-tenant and multi-tenant environments, Terraform, and observability. The most important caveat is that Twenty still has not published a named product catalog or technical documentation, so the module map below is reconstructed from credible but incomplete public evidence rather than from first-party docs.'
