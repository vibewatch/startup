              Navy research contract. Tectonic repeated the same figures four days after Twenty’s stealth exit, and
              Bloomberg’s contemporaneous story described the company as having contracts that give U.S. military
              hackers AI tools. By June 2026, Axios still described Twenty as holding contracts with the U.S. military
              and intelligence community, showing that government traction persisted beyond the initial stealth-launch
              narrative. However, proof quality is mixed. None of the fetched materials include a contract number,
              awarding office, performance period, option structure, or statement of work. The Cyber Command figure is
              explicitly phrased as “up to $12.6 million,” which strongly suggests a ceiling value rather than fully
              obligated revenue, and the Navy award is described only as a research contract, not a scaled operational
              deployment. The chapter therefore supports real buyer traction while remaining cautious on scope,
              maturity, and recognized revenue.
