  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage and Product Framing
        blocks:
          - type: paragraph
            body: >-
              Twenty Technologies, Inc. presents itself as an offense-first national-security software company rather
              than a conventional defensive cybersecurity vendor. Its public materials say the company was founded in
              2024, is headquartered in Arlington, Virginia, and exists to deliver industrial-scale cyber capabilities
              for the United States and its allies. The company says it builds end-to-end offensive cyber systems that
              encode elite operator tradecraft into software, automate work that previously required weeks of manual
              effort, and let analysts pursue multiple targets in parallel while humans retain control over
              consequential decisions. The commercial posture is still private and venture backed, but the stage changed
              materially between its November 2025 stealth exit and its June 2026 Series B: Twenty moved from a newly
              public defense-tech startup with early government traction to a unicorn-priced company openly arguing that
              offensive cyber should be treated as a core national mission area.
