      - number: '4.2'
        title: Capital Base and Forward Funding Use
        blocks:
          - type: paragraph
            body: >-
              The financing story is much clearer than the operating story. Twenty disclosed $38 million of total
              funding when it emerged from stealth in November 2025, with the Series A led by Caffeinated Capital and
              participation from General Catalyst and In-Q-Tel. On June 17, 2026, Axios reported a $100 million Series B
              at a $1 billion valuation led by Accel, with Friends & Family Capital, Point72 Ventures, and Caffeinated
              Capital also participating, bringing total disclosed funding to $138 million. Axios also quoted CEO Joseph
              Lin saying the new money would be spent on supercharging research and development and the existing
              roadmap.

              That use-of-funds guidance is strategically coherent with the company's posture: a mission set that
              depends on AI, cleared engineering talent, and custom government deployment is likely to consume capital
              well before it yields public SaaS-style metrics. The financial issue is not whether Twenty can raise
              money; it clearly can. The issue is whether the company can translate a unicorn-priced Series B into
              durable, repeatable, margin-bearing revenue before the next capital need appears.
