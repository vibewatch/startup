      - number: '1.3'
        title: Funding History, Investors and Disclosure Boundaries
        blocks:
          - type: paragraph
            body: >-
              Twenty's capital story has two disclosed financing landmarks so far. The company emerged from stealth in
              November 2025 saying it had raised $38 million in total funding in a Series A led by Caffeinated Capital
              with participation from General Catalyst and In-Q-Tel. On June 17, 2026, Axios reported that Twenty raised
              a $100 million Series B at a $1 billion valuation, bringing total disclosed funding to $138 million; Accel
              led the round, with Friends & Family Capital, Point72 Ventures, and Caffeinated Capital also
              participating, while company-controlled surfaces continue to cite General Catalyst and In-Q-Tel among
              backers. The company says the new capital will fund research, engineering, and the existing roadmap. What
              remains missing is almost everything a conventional growth investor would want for basic underwriting: no
              public revenue, no public customer count, no public board list, no public burn or margin profile, and only
              partial visibility into contract values.
