  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Contract economics disappoint
        - Obligated or recognized revenue is far below the headline contract narrative
        - The round was priced on future scale that is not yet economically visible.
        - Re-cut fair value and pause underwriting.
      - - Services mix dominates
        - Gross margin or delivery model looks contractor-like rather than software-like
        - The premium cyber-platform comp set no longer applies cleanly.
        - Move valuation toward the low end of the range.
      - - Concentration remains extreme
        - A handful of agencies or programs drive the majority of economics
        - Customer risk and procurement timing volatility stay too high for premium pricing.
        - Require a lower entry price or stronger protections.
      - - Policy friction rises
        - Oversight, authority, or intelligence-equity issues slow deployment or expansion
        - Strategic demand remains real but monetization slows materially.
        - Extend time horizon and lower multiple assumptions.
      - - Round terms are investor-protective
        - Preferences, secondaries, or structure erode common-equity upside
        - Headline valuation stops being a useful proxy for return potential.
        - Do not rely on the mark without cap-table diligence.
    notes: These triggers are designed to be monitored in diligence and the next financing cycle, not only at IPO time.
