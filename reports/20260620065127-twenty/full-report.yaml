      - number: '7.3'
        title: Commercial concentration and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Commercially, Twenty appears to have real traction, but the visible demand base is narrow and
              procurement-heavy. Forbes and Tectonic both point to actual government contracts, while the company's own
              press and partner materials emphasize military, intelligence, and allied missions rather than a broader
              commercial customer mix. That can be a strength while budgets are supportive, but it also leaves revenue
              heavily dependent on a small set of U.S. government buyers, JCWA-style acquisition pathways, and
              politically durable support for private-sector offensive cyber. DefenseScoop's CYBERCOM budget reporting
              shows real money in the system, yet those dollars are increasingly centralized under command-led
              priorities and rapid-acquisition mechanisms that can be slow, opaque, or programmatic rather than
              repeatable SaaS-like channels. The same concentration heightens competition risk because primes and
              established cyber incumbents can attack the category from trusted relationships, broader product suites,
              and stronger compliance infrastructure. Public contract databases show that outside observers still lack a
              clean award-level picture of Twenty's mix, timing, and renewal profile.
