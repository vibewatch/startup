      - number: '3.3'
        title: Switching Costs, Internal Build and Buying Friction
        blocks:
          - type: paragraph
            body: >-
              Switching costs are likely to come more from workflow integration, accreditation, and operator trust than
              from proprietary feature lock-in. The official pages reviewed here expose very little public pricing
              across the peer set, which is itself a competitive signal: buyers in this category are mostly buying
              through opaque, sales-led, or contract-specific motions rather than transparent SaaS procurement. That
              opacity makes public comparison difficult and shifts diligence toward deployment model, mission fit, and
              adoption friction. It also leaves internal build as a serious alternative. A government buyer can pair
              Xpanse or runZero for discovery, Metasploit for exploitation, Mandiant or internal teams for red teaming,
              AttackIQ for validation, ZeroFox for external intelligence, and Gotham or other analytics platforms for
              higher-level mission context. Twenty's burden is therefore to prove that a unified offensive workflow
              genuinely reduces operator load and cycle time enough to justify choosing a young vendor over a stitched
              incumbent stack or an internally governed toolchain.
