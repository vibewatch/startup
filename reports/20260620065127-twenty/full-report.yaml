      - number: '5.2'
        title: Architecture and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The architecture that can be reconstructed publicly looks like a layered system. At the bottom is target
              and threat data: ATT&CK-style lifecycle knowledge, government threat reporting, and whatever
              reconnaissance and vulnerability signals Twenty can collect or ingest. Above that sits an automation layer
              that likely handles target triage, attack-path generation, and recommendation assembly. Public job-ad
              evidence also points to persona-development work and AI-powered automation tools, suggesting the workflow
              may extend into social-engineering support or other preparatory tradecraft. The strongest direct technical
              clues come from a senior backend role that names real-time operational signals, graph data, event-driven
              architectures, and machine-speed APIs, and from a DevOps role that describes AWS infrastructure,
              single-tenant and multi-tenant environments, Terraform, IAM/network security, and observability. Human
              operators remain a formal control layer rather than an afterthought. That matters because the company is
              selling into sensitive government missions where speed matters, but unbounded autonomy would be
              commercially and politically untenable. The largest architectural dependencies are external rather than
              publicly productized: scarce cleared personnel, sensitive customer environments, and the need to operate
              at machine tempo while ingesting accurate intelligence. Compared with modern threat-intelligence and CTEM
              platforms, Twenty’s likely edge is not a unique taxonomy or scanning primitive; it is the orchestration of
              many primitives into one operator-facing mission system.
