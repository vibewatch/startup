  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Buyer, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Twenty is not selling into the entire cybersecurity market and not even into all national-security
              software. The closest public market boundary is offensive cyber operations software and adjacent mission
              infrastructure bought by U.S. military and intelligence organizations that need to find, prioritize, and
              pursue targets faster than human-only workflows allow. Twenty's own pages repeatedly frame the problem as
              industrial-scale cyber conflict already underway, with software that encodes elite tradecraft, automates
              continuous operations across hundreds of targets, and supports U.S. and allied mission partners. That
              boundary is materially narrower than generic enterprise security, zero-trust modernization, or broad
              defense-AI spending.


              The most credible near-term buyer is U.S. Cyber Command and the network of service, Navy, and intelligence
              organizations that support or execute cyber missions around it. Public contract reporting, company
              statements, the congressional hearing roster, and university-partnership language all point to the same
              buyer cluster: national-security agencies running offensive or intelligence-linked cyber missions. The
              user is the operator or analyst; the payer is a government program office or mission budget; and the
              adoption path is procurement-led rather than self-serve. Status-quo substitutes are bespoke operator
              workflows, legacy primes, and older niche contractors. Forbes explicitly called Twenty unusual because
              VC-backed offensive cyber companies rarely win Cyber Command work, which historically went to bespoke
              shops or old-guard defense contractors rather than startup software platforms.
