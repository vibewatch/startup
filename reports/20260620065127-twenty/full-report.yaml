              surrounding the same January 2026 hearing warned that persistent offensive cyber raises unresolved
              oversight, intelligence-equity, escalation, and legal-boundary questions, and Twenty still discloses too
              little customer and governance detail to separate durable traction from momentum-driven narrative.
