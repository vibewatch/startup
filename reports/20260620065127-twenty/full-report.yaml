      - number: '6.5'
        title: Expansion path and concentration risk
        blocks:
          - type: paragraph
            body: >
              Expansion appears plausible but highly concentrated. Twenty can plausibly grow within the same customer
              base by moving from one mission team to broader command adoption, from research contracts to operational
              programs, and from direct military buyers into adjacent intelligence-community and allied use cases. The
              procurement architecture helps explain that path: Cyber Command now has enhanced budget control and a
              Joint Cyber Warfighting Architecture that includes offensive-operations and training systems, creating a
              clearer budget owner than in prior years. But concentration risk is stark. Every public customer proof
              point in fetched evidence is tied to the U.S. government national-security ecosystem; no commercial
              customer is named, no allied customer is named, and no customer revenue mix is disclosed. Proof quality is
              also constrained by policy and procurement opacity. The official USASpending and SAM.gov pages in this
              research set show the right databases and opportunity channels, yet they do not surface Twenty’s award
              details in retrievable form here. Cilluffo’s January 2026 testimony and Atlantic Council research also
              underscore the legal and strategic ambiguity surrounding private-sector participation in active cyber
              operations. For investors, the implication is straightforward: the upside is large if Twenty becomes
              embedded in a few durable government programs, but the downside is equally concentrated because outside
              observers still cannot verify how broad or repeatable that customer base really is.
            claimRefs:
              - CU033
