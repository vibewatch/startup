      - number: '4.4'
        title: Capital Adequacy, Public Traction, and Missing Private Metrics
        blocks:
          - type: paragraph
            body: >-
              The capital-adequacy question cannot be answered from public evidence alone. Twenty has disclosed a large
              venture base for a two-year-old company and at least some government contract traction, but it has not
              disclosed cash on hand, monthly burn, runway, revenue, ARR, gross margin, customer count, expansion
              metrics, backlog, deferred revenue, or the size of any pipeline beyond teaser statements. The visible
              contract signals sum to at most $12.84 million if one simply adds the Navy award to the Cyber Command
              ceiling, and even that upper bound should not be treated as recognized revenue.

              This leaves two simultaneous truths. First, Twenty has credible evidence of product-market pull inside a
              demanding government customer set. Second, there is no public basis to conclude that the company is
              self-funding, nearing break-even, or capable of avoiding another financing round on a management-planned
              timeline. The chapter therefore has to keep burn, runway, and margin as explicit diligence gaps rather
              than reverse-engineered guesses.
