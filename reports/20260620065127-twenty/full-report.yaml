      - number: '8.3'
        title: Scenario Ranges and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The current $1 billion mark is not absurd, but it is under-evidenced. The bullish case is straightforward:
              Twenty already has elite investors, real government contracts, policy visibility, and a product narrative
              that fits the market's move toward machine-speed cyber operations. If those visible contracts are only the
              first wedge into a much larger, repeatable program base, and if the business ultimately looks
              software-like rather than services-heavy, the current round could even prove conservative. The base case
              is less heroic: the valuation is probably directionally fair only if the company can convert today’s
              strategic credibility into larger obligated revenue streams without losing margin to cleared labor,
              deployment friction, or contract concentration. The downside case is also easy to see. If public contract
              proof never converts into software-quality economics, if oversight or procurement slows adoption, or if
              the market starts treating Twenty more like an opaque government contractor than a premium autonomy
              platform, the valuation resets quickly. That combination makes the best present call research-more, with
              high risk, medium confidence, and a stretched valuation stance rather than a clean buy.
            claimRefs:
