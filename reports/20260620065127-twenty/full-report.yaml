  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and oversight exposure
        blocks:
          - type: paragraph
            body: >-
              Twenty has chosen one of the most policy-sensitive positions in cybersecurity: privately built offensive
              cyber systems for U.S. and allied mission partners. Its own website and press materials repeatedly say the
              company serves the U.S. and its allies, is shifting cyber posture from defense to offense, and is
              industrializing cyber warfare rather than merely selling defensive software. That posture creates a more
              complex regulatory stack than a normal enterprise-security vendor faces. BIS export rules, State
              defense-trade controls, and EO 14028-era federal cyber contracting requirements all matter if the company
              deploys tools, models, or support workflows across allied boundaries or within classified government
              environments. The congressional hearing record adds a second layer of risk: lawmakers and expert witnesses
              are actively debating how far private firms should participate in active cyber defense and offensive
              operations, and the testimony stresses that legal and oversight frameworks still lag the operational tempo
              of the domain. A further wrinkle is that Twenty frames allies as part of its natural operating context
              while also building AI-enabled workflows; the European Commission’s live AI regulatory framework shows
              that non-U.S. compliance surfaces can attach quickly once deployment or support extends into allied
              jurisdictions.
            claimRefs:
