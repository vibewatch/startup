      - number: '3.2'
        title: Direct, Adjacent and Substitute Vendors
        blocks:
          - type: paragraph
            body: >-
              The direct-versus-adjacent distinction matters more here than in a normal enterprise software market.
              Xpanse is the strongest direct technical comparator because it operationalizes continuous external
              discovery and already advertises all six U.S. military branches as users, but it is framed as
              attack-surface management and remediation rather than offensive mission execution. Mandiant is a
              services-led substitute for elite operators who want red teaming, threat intelligence, or response depth
              without buying a new offense-native platform. Elastic is strategically important because its public
              language around autonomous agents, human approval, air-gapped deployment, and model-agnostic openness
              closely overlaps the systems rhetoric Twenty uses. AttackIQ, Rapid7 Metasploit, runZero, and ZeroFox each
              cover narrower slices of the workflow, yet together they show how a sophisticated buyer could approximate
              pieces of Twenty's value proposition. Palantir Gotham and broader defense-AI platforms such as Shield AI
              or Anduril sit one level higher: they are not cyber-offense clones, but they compete for the same
              national-security attention, integration budgets, and operator mindshare.
