      - number: '4.3'
        title: Cost Structure, Cleared-Talent Load, and Scaling Signals
        blocks:
          - type: paragraph
            body: >-
              Public cost structure data is absent, but the hiring footprint gives a useful proxy. Ashby showed 39 open
              roles across engineering, finance, growth, product, and talent as of June 2026, and the role list includes
              both TS/SCI-cleared and TS/SCI-required positions plus forward-deployed reliability work. The openings are
              concentrated in Arlington, Washington, New York, Fort Meade, and San Antonio, with some finance hiring
              also sourced from San Francisco. Those signals point to a company still investing heavily in senior
              technical talent, classified-program delivery capacity, and internal finance operations rather than
              harvesting a mature installed base.

              This matters because offensive-cyber productization for classified customers is unlikely to resemble a
              clean, self-serve software cost structure. Cleared labor, on-site deployment, forward engineering, and
              procurement friction can all delay gross-margin expansion even if top line grows. Customer-side readiness
              data also points in the same direction: DefenseScoop says some Interactive On-Net Operator training takes
              one to three years and costs $220,000 to $500,000 per service member, while separate coverage describes
              Cyber Command wrestling with readiness and personnel churn. That is a useful willingness-to-pay proxy for
              automation, but it also implies long, consultative, government-specific sales and deployment cycles.
              Without disclosed headcount, compensation structure, hosting profile, or services mix, the right read is
              not that margins are weak, but that public evidence is insufficient to judge whether Twenty is becoming
              software-like or remaining labor-intensive.
