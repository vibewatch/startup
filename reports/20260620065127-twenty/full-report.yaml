              inseparable from Washington's broader shift toward a more offensive cyber posture, which helps explain why
              the company came out of stealth when it did. The commercial opportunity therefore depends not only on
              product execution, but also on continuing political support for outsourcing parts of a sensitive mission
              set to private vendors.
