      - number: '3.4'
        title: Moat Durability and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Twenty is early in a category that still lacks a dominant offense-first platform for
              U.S. government cyber operations. The bear case is that its language is already being crowded from
              multiple directions. Elastic uses nearly identical human-supervised automation rhetoric. AttackIQ talks
              about AI-speed closed loops and measurable threat reduction. Xpanse remains the obvious incumbent
              benchmark on reconnaissance scale. Palantir and Mandiant already have trust, distribution, and integration
              depth with government buyers. Even outside cyber, Anduril and Shield AI absorb defense-tech capital and
              attention with similarly urgent autonomy narratives. Public evidence also remains thin where investors
              would most want precision: list pricing is mostly unavailable, direct head-to-head procurement outcomes
              are not visible, and Axios itself notes that cyber success stories are rarer than more kinetic defense
              bets. The skeptical read, then, is not that Twenty lacks a real wedge. It is that the wedge must be proven
              through faster mission outcomes, not through category rhetoric alone, because many surrounding substitutes
              are improving at the same time.
