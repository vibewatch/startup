  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and user workflow
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Twenty is selling a mission workflow for offensive cyber operators, not a
              conventional enterprise security SKU. The company’s own language centers on industrializing the American
              arsenal for cyber warfare, building software that wins in war, and converting weeks of manual work into
              continuous operations across hundreds of targets. Third-party coverage fills in the missing workflow
              detail. Tectonic describes AI agents that scan large numbers of targets, identify weak points, and route
              proposed actions to human operators. Series B mirrors describe AI-enabled end-to-end systems for military
              and intelligence operators and emphasize that human judgment remains central to every offensive operation.
              Hiring signals reinforce that picture: the company is recruiting applied-AI engineers, backend and
              DevSecOps talent, forward-deployed analysts, mission architects, and mission deployment leads. That mix
              implies a product that combines automation, operator interfaces, and customer-embedded deployment support.
              Newly surfaced role pages sharpen that inference further: one senior backend opening explicitly references
              real-time operational signals, high-throughput APIs, and cloud/on-prem mission software, while a DevOps
              role describes AWS infrastructure, single-tenant and multi-tenant environments, Terraform, and
              observability. The most important caveat is that Twenty still has not published a named product catalog or
              technical documentation, so the module map below is reconstructed from credible but incomplete public
              evidence rather than from first-party docs.
