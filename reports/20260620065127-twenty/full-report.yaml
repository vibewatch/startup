      - number: '2.4'
        title: Constraints, Contradictions, and Preserved Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The bullish case is not the whole story. This market remains politically sensitive, procurement-heavy, and
              partially opaque. Frank Cilluffo's January 2026 congressional testimony says the United States has gained
              operational benefits from defend-forward and delegated offensive authorities, but he also warns that the
              shift revives unresolved questions around oversight, intelligence equities, escalation, and democratic
              accountability. The same testimony says the private sector's role in active cyber defense could otherwise
              drift into an ad hoc legal gray zone. CyberScoop adds a more technical version of the same caution,
              quoting Morgan Adamski that any AI capability introduced into the ecosystem can be used back against the
              United States. Atlantic Council's Mythical Beasts work widens that concern from policy to market structure
              by documenting offensive-capability and spyware proliferation, showing why opacity and intermediary risk
              remain part of the category narrative even for U.S.-aligned vendors.


              Those contradictions matter directly for market sizing and adoption. The category clearly has real
              budgets, real missions, and real urgency, yet public evidence still does not reveal how much of CYBERCOM's
              budget is actually contestable by software like Twenty, how much is bound up in classified infrastructure
              or services, or what percentage of the opportunity sits inside the intelligence community rather than DoD.
              Even public award verification is incomplete from the fetched USASpending page, which exposes the search
              surface but not a specific Twenty contract record or award ID. The result is a market chapter that should
              preserve uncertainty instead of averaging it away: Twenty appears to be operating in a strategically
              important but still immature procurement segment where proof exists, top-down budgets are large, and the
              main diligence work is now around contract mix, buyer concentration, renewal pathways, and how policy
              scrutiny may shape the acceptable scope of private-sector offensive cyber.
