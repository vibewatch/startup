  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Pricing Context and Disclosure Gap
        blocks:
          - type: paragraph
            body: >-
              Twenty has a real financing signal and a real demand signal, but still not a public operating model. The
              strongest pricing fact in the file is the June 17, 2026 Series B: Axios said the company raised $100
              million at a $1 billion valuation and pushed total disclosed funding to $138 million. The historical
              baseline is also clear enough: the November 2025 stealth-exit release disclosed $38 million of total
              funding and tied the business to Caffeinated Capital, General Catalyst, and In-Q-Tel. What remains unclear
              is almost everything an investor would normally underwrite between those two marks. No reviewed public
              source discloses ARR, recognized revenue, gross margin, NRR, customer count, backlog, or the mix between
              software and delivery. Even the best demand proof in the file—the Cyber Command contract worth up to $12.6
              million and the separate $240,000 Navy research award—supports traction more than economics. The word 'up
              to' matters: it points to ceiling value, not proven recognized revenue. On public evidence alone, the
              round is real, but the underlying revenue engine is still opaque.
            claimRefs:
