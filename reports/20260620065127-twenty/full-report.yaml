      - number: '6.3'
        title: Buyer pain, readiness gaps, and adoption logic
        blocks:
          - type: paragraph
            body: >
              Twenty’s customer logic is easier to verify than its customer list. DefenseScoop reported that the Army,
              on behalf of the joint force and U.S. Cyber Command, was piloting an eight-month course for offensive
              operators because Interactive On-Net Operator training historically took one to three years and cost
              $220,000 to $500,000 per service member, with classified environments making the pipeline especially
              expensive. A separate DefenseScoop report quoted Gen. Paul Nakasone describing readiness pressure caused
              by personnel cycling in and out of Cyber Command, weakening institutional knowledge and raising training
              costs. These bottlenecks map directly to Twenty’s product positioning: encoding elite tradecraft into
              software, automating continuous operations across hundreds of targets, and giving humans control over
              consequential decisions. Budget context reinforces the relevance of that pitch. Cyber Command’s FY2024
              request included roughly $1.1 billion of RDT&E and $129 million of procurement under the Joint Cyber
              Warfighting Architecture, which explicitly spans command-and-control, big-data, training, and
              offensive-operations tooling. In other words, the underlying buyer pain is not generic cyber demand; it is
              a readiness and workflow problem inside a classified mission environment where scale, operator scarcity,
              and machine- speed adversaries all matter at once.
