      - number: '6.4'
        title: Durability, reference quality, and what is still missing
        blocks:
          - type: paragraph
            body: >
              Public retention evidence is thin. There are no disclosed metrics for customer count, contract duration,
              renewal rate, recompete win rate, NRR, GRR, or customer satisfaction. The best durability proxies are
              indirect: Twenty was already working with government buyers while in stealth, still had military and
              intelligence-community contracts according to Axios seven months later, and in 2026 was expanding its
              cleared deployment and support hiring footprint while building a WVU talent and research partnership
              around offensive-cyber missions. Those signals imply active workloads and some confidence in follow-on
              demand, but they are not substitutes for renewals or referenceable end-user outcomes. The chapter should
              therefore distinguish among three different levels of proof. First, there is credible evidence of real
              contracts. Second, there is moderate evidence of ongoing mission use and delivery activity. Third, there
              is weak public evidence on user satisfaction, contract expansion, and long-term stickiness. The gap is
              partly structural: many of Twenty’s likely users work in classified environments where public references
              are rare. But the result for diligence is the same—durability remains more inferred than proven.
