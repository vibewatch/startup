            body: >-
              Public evidence indicates Twenty is already more than a concept company. Axios says it has contracts with
              the U.S. military and intelligence community, while Tectonic Defense and Forbes report more specific award
              signals: a U.S. Cyber Command contract worth up to $12.6 million and a Navy research contract worth about
