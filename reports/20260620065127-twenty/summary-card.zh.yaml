  topStrengths:
    - 真实政府牵引力可见：据报道有 U.S. Cyber Command 和 Navy 合同信号，也有更广泛的军方与情报体系引用。
    - 创始人与市场高度匹配：团队兼具进攻型网络行动经验、Expanse / Palo Alto Networks 领导经历和政策入口。
    - 产品逻辑正好对准买方痛点：操作员稀缺、对手以机器速度行动、任务流程高度保密。
    - 公司已经拿到顶级投资人支持，最终在 $1B 估值下完成 $100M Series B，披露累计融资 $138M。
    - human-in-the-loop 定位提升了可信度；在这个品类里，完全自主的进攻工具在商业和政治上都难以成立。
  topRisks:
    - 公开经济性远远不够：没有披露收入、ARR、毛利率、烧钱速度、现金跑道、留存或客户数，无法支撑当前价格。
    - 客户暴露似乎高度集中在美国政府进攻型网络预算和采购路径。
    - 进攻型网络监管、出口管制、监督审查和声誉反噬，都可能快速改写可服务市场。
    - 如此敏感的品类却缺少产品控制证据：没有公开审计包、基准集或可独立引用的保障材料。
    - 合同证明真实存在，但相对估值标题仍偏小；可见授标上限不等于确认收入。
  unresolvedGaps:
    - 合同级经济性，包括义务金额、收入确认节奏、续约节奏，以及软件与服务组合。
    - 按机构划分的客户集中度、可引用的生产部署，以及早期项目胜利之外的耐久扩张证据。
    - 收入运行率、毛利率、烧钱速度、现金跑道、留存和准确员工数等核心私营 KPI。
    - 治理与合规细节，包括出口分类分析、审批控制、可审计性和敏感环境架构。
    - 2026 年 6 月融资条款，包括任何清算优先权、老股交易、董事会权利或其他投资人保护条款。
