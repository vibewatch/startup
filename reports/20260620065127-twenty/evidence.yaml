evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Current board composition, observer rights, and any national-security advisory board or classified governance
      structure.
    whyItMatters: >-
      Board control and information-rights structure affect investor protection, government oversight, and succession
      planning.
    diligencePath: Request the current cap table, board deck headers, and governing documents under NDA.
    relatedQuestionRefs:
      - QO009
      - QO024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named customer count, share of revenue by agency, recompete timelines, and contract vehicle details.
    whyItMatters: >-
      A unicorn valuation is hard to underwrite without understanding whether traction is broad and renewable or
      concentrated in a few classified programs.
    diligencePath: >-
      Request a customer concentration schedule with contract start dates, ceilings, funded amounts, and renewal
      assumptions.
    relatedQuestionRefs:
      - QO014
      - QO023
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Exact employee count and cleared-versus-uncleared mix.
    whyItMatters: The public employee band and open-role count show growth but do not reveal current delivery capacity or burn.
    diligencePath: Request an org-level headcount report broken out by engineering, mission delivery, policy, and G&A.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: material
