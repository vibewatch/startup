companyProfile:
  summary: >
    Twenty Technologies, Inc. is a private Arlington, Virginia-based offensive-cyber startup founded
    in 2024 and led by operators and executives from military cyber units plus the Expanse / Palo
    Alto Networks ecosystem. The company sells AI-enabled, human-governed mission software for target
    discovery, attack-path preparation, and continuous cyber operations for U.S. military and
    intelligence customers. Public evidence supports real contract traction, including a reported
    U.S. Cyber Command award worth up to $12.6 million and a separate Navy research contract, and a
    June 17, 2026 Series B that brought disclosed funding to $138 million at a $1 billion valuation.
    What remains missing is the operating data needed for a clean late-stage underwrite: revenue,
    margins, customer concentration, renewals, and governance detail are still largely undisclosed.
  foundedDate: '2024-01-01'
  founders:
    - name: Joe Lin
      role: Co-founder & CEO
      background: Former Palo Alto Networks vice president and Expanse public-sector leader with prior Navy Reserve service.
      claimRefs: ['CO009', 'CO010']
