    - name: Skyler Onken
      role: Co-founder & VP Engineering
      background: Former U.S. Army and USCYBERCOM operator identified as one of the first Master Cyber Operators.
      claimRefs: ['CO014']
  foundingLocation: Arlington, Virginia, USA
  headquarters: Arlington, Virginia, USA
  productSummary: >
    Twenty sells an AI-enabled offensive-cyber mission workflow platform rather than a conventional
    enterprise-security SKU. Public evidence supports software for target discovery, weak-point
    identification, attack-path preparation, operator decision support, and controlled deployment,
    with humans retaining authority over consequential actions and the company supporting both cloud
    and sensitive mission environments.
  customerFocus: >
    Primary customers are U.S. military and intelligence-community organizations running offensive or
    intelligence-linked cyber missions; public materials also frame allies as part of the target
    mission set, but no named allied customer is publicly confirmed.
  businessModel: >
    Government-contract-driven mission software and deployment support, with the visible revenue base
    currently tied to military and intelligence contracts; the split among recurring software,
    prototype work, research contracts, and services remains undisclosed.
  stage: Series B private
