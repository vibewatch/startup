  topStrengths:
    - >-
      Real government traction is visible, with reported U.S. Cyber Command and Navy contract signals plus broader
      military and intelligence-community references.
    - >-
      Founder-market fit is unusually strong, combining offensive-cyber operators with Expanse / Palo Alto Networks
      leadership and policy access.
    - >-
      The product thesis matches urgent buyer pain around operator scarcity, machine-speed adversaries, and classified
      mission workflows.
    - >-
      The company has already attracted elite investor support, culminating in a $100M Series B at a $1B valuation and
      $138M total disclosed funding.
    - >-
      Human-in-the-loop positioning improves credibility in a category where fully autonomous offense would be
      commercially and politically untenable.
  topRisks:
    - >-
      Public economics are far too sparse: no disclosed revenue, ARR, gross margin, burn, runway, retention, or
      customer-count data support the current price.
    - >-
      Customer exposure appears heavily concentrated in U.S. government offensive-cyber budgets and procurement
      pathways.
    - >-
      Offensive-cyber regulation, export controls, oversight scrutiny, and reputational blowback can change the
      addressable market quickly.
    - >-
      Product-control evidence is thin for such a sensitive category, with no public audit package, benchmark set, or
      independently referenceable assurance artifact.
    - >-
      Contract proof is real but still small relative to the valuation headline, and visible award ceilings are not the
      same as recognized revenue.
  unresolvedGaps:
    - >-
      Contract-level economics, including obligated value, revenue-recognition timing, renewal cadence, and
      software-versus-services mix.
    - >-
      Customer concentration by agency, referenceable production deployments, and evidence of durable expansion beyond
      early program wins.
    - Core private KPIs such as revenue run rate, gross margin, burn, runway, retention, and exact headcount.
    - >-
      Governance and compliance detail, including export-classification analysis, approval controls, auditability, and
      sensitive-environment architecture.
    - >-
      June 2026 financing terms, including any liquidation preferences, secondaries, board rights, or other investor
      protections.
