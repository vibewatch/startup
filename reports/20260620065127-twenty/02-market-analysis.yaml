tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Twenty
  rows:
  - - Offensive cyber operations platforms
    - Software and mission systems for reconnaissance, targeting, access development, orchestration, and analyst/operator workflow acceleration
    - General enterprise security, commodity IT, and pure compliance tooling
    - USCYBERCOM, military services acting on its behalf, and intelligence mission organizations
    - Core market boundary supported by company and government-language evidence
  - - JCWA-linked mission systems
    - Command and control, big data, training, and systems used to execute offensive operations
    - Broader DoD cyberspace activities such as zero trust, encryption, and general DIB support
    - CYBERCOM-controlled programming and execution path
    - Closest public budget bucket to a Twenty-like product
  - - Prime-contractor and bespoke alternatives
    - Mission-specific integration work and niche cyber tooling bought for the same mission set
    - Unrelated defense platforms outside cyber operations
    - Program offices using incumbent contractors
    - Status-quo substitute rather than pure adjacent category
  - - Training and readiness tooling
    - Operator training environments, curriculum modernization, and readiness-support systems
    - General classroom IT or unrelated workforce software
    - Services and commands funding CMF readiness
    - Important adjacent spend because labor bottlenecks drive automation demand
  - - Manual internal workflows
    - Government labor time spent on human-led targeting, access development, and mission preparation
    - External market spend with no software or contractor component
    - The taxpayer ultimately pays through labor and readiness budgets
    - The most important non-vendor substitute Twenty is trying to replace
  - - Excluded civilian cyber demand
    - N/A
    - Commercial SOC, retail security, SME IT management, and mass-market security software
    - Commercial enterprises and civilian agencies outside mission scope
    - Too broad to count as Twenty TAM despite headline cyber-market size
  notes: The table defines the market narrowly around offensive cyber mission software and adjacent readiness infrastructure rather than all cybersecurity or all defense AI spend.
