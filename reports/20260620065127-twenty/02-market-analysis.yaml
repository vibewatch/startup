- id: budget-and-sizing-lenses
  title: Budget Envelope and Evidence-Constrained Sizing
  body: 'The public top-down budget backdrop is real, but it should not be mistaken for Twenty''s serviceable market. DefenseScoop reports that the Department of Defense committed $13.5 billion to cyberspace activities in FY2024, while USCYBERCOM''s visible headquarters, procurement, and RDT&E lines were about $332.6 million, $129 million, and roughly $1.05 billion to $1.1 billion respectively. That provides a large budget envelope and proves this is not a hobby market. It also shows why this category matters financially: a startup that wins even a small fraction of those pools can become meaningful. But the same evidence also warns against lazy TAM inflation. The DoD topline includes many activities — zero trust, encryption, defense-industrial-base support, and other cyber programs — that are not automatically addressable by an offensive-operations platform.


    A better market lens narrows from the broad DoD cyberspace total to the CYBERCOM-controlled envelope and then further to the specific JCWA components that mention command and control, big data, training, and executing offensive operations. Even there, public sources do not disclose how much spend is truly available to software like Twenty rather than to labor, infrastructure, or other categories. The most grounded lower-bound market proof is not a report at all but public contract evidence: Forbes and Tectonic together point to about $12.84 million of named contract signals, which shows the category can clear procurement hurdles. The honest conclusion is therefore bounded rather than precise: the relevant market sits somewhere between a small public proof point and a much larger but only partially addressable government cyber budget, and public sources cannot isolate a clean SAM or SOM without inventing assumptions.'
