- id: TM005
  title: Diligence gaps and contradictory estimates table
  columns:
  - Topic
  - What public evidence supports
  - What remains unknown
  - Why it matters
  - Diligence path
  rows:
  - - Addressable budget
    - DoD and CYBERCOM budget envelopes are large and visible
    - The specific software-contestable share is not public
    - Determines whether the market is venture-scale or just strategically important
    - Request program-level budget mapping and pipeline by budget line
  - - Contract proof
    - Forbes and Tectonic support named USCYBERCOM and Navy award signals
    - Award IDs, obligation profile, and contract vehicle are not visible in fetched federal pages
    - Needed to judge repeatability and revenue quality
    - Pull FPDS / USASpending award records directly and reconcile to management disclosure
  - - Customer concentration
    - Public sources point to military and IC buyers
    - Count of active programs, recompete cadence, and renewal exposure are undisclosed
    - A narrow customer set can make growth and valuation fragile
    - Request customer concentration and renewal schedules under NDA
  - - Policy tolerance
    - Congress is openly debating private-sector offensive cyber
    - Future rules for oversight and active defense are unsettled
    - Can expand or cap the role private vendors may play
    - Review legal authorities, mission approval workflows, and escalation controls
  - - Operational ROI
    - Training cost and readiness pain clearly exist
    - Public sources do not quantify how much operator time Twenty actually saves
    - Without measurable ROI, urgency does not automatically become budget adoption
    - Ask for before/after mission metrics and user reference interviews
  notes: The chapter deliberately preserves unresolved gaps because public budgets alone do not answer whether Twenty's niche is both large enough and accessible enough to justify a venture outcome.
