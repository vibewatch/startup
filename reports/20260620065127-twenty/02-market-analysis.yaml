- id: demand-drivers-and-technical-context
  title: Demand Drivers, Technical Context, and Readiness Pain
  body: 'Demand is strongest where persistent nation-state conflict meets machine-speed operations. CISA, the White House, CrowdStrike, CyberScoop, and Twenty''s own materials all describe a cyber environment defined by continuous pressure from sophisticated adversaries, not sporadic incidents. CrowdStrike''s 2026 report says attacks by AI-enabled adversaries rose 89% in 2025, average breakout speed increased 65% year over year, and more than 90 organizations had legitimate AI tools abused to generate malicious commands or steal data. CyberScoop''s RSAC 2026 reporting sharpens the market implication: Kevin Mandia described a near-term perfect storm for offense, and both he and Alex Stamos argued that AI is compressing the time from discovery to exploitation. If attackers can move at machine speed, commands built around human-only targeting and execution loops will look increasingly underpowered.


    The technical market context also validates the category. DARPA''s $29.5 million AI Cyber Challenge shows the government itself wants AI systems applied to cybersecurity problems, while MITRE ATT&CK provides the public taxonomy of tradecraft that any offensive-cyber platform must navigate from reconnaissance through impact. The workforce side is equally important. DefenseScoop''s reporting on Interactive On-Net Operator training shows why automation sells to this buyer: the military''s offensive operators are a critical readiness shortfall, training takes one to three years, and costs run roughly $220,000 to $500,000 per operator in heavily classified environments. Nakasone''s separate readiness remarks reinforce that the problem is not only technology but also retention and institutional memory. Taken together, the market driver is not generic cyber growth; it is the convergence of AI-compressed attack cycles, a persistent-state adversary set, and expensive human bottlenecks inside
    the exact buyer organizations Twenty targets.'
