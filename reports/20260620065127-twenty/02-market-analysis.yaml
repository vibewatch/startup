  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: Program-level budget mapping that shows what share of CYBERCOM and IC cyber spending is actually contestable by offensive-workflow software rather than labor, infrastructure, or unrelated cyber categories.
    whyItMatters: Without that mapping, the analysis can show a large budget envelope but cannot underwrite a precise SAM or judge whether the niche is venture-scale.
    diligencePath: Request pipeline, budget-line, and contract-mix detail from management under NDA, with at least one customer-backed explanation of where the product sits inside acquisition programs.
    relatedQuestionRefs:
    - QM010
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: access-blocked
    severity: material
    topic: award-verification
    missingEvidence: Specific award IDs, obligated amounts, vehicles, and performance periods for the public USCYBERCOM and Navy contract signals.
    whyItMatters: Those records are necessary to test repeatability, revenue quality, and whether the named awards are pilots, ceilings, or durable production contracts.
    diligencePath: Pull FPDS or USASpending award records directly with an interactive browser or procurement database access and reconcile them to management disclosures.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Active-customer count, buyer concentration, renewal cadence, and the split between DoD, IC, and other national-security accounts.
    whyItMatters: A market can be important yet still too narrow or concentrated to support durable venture returns if growth depends on only a handful of programs.
    diligencePath: Request customer cohort, concentration, and renewal data plus reference calls with at least one current government program user.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    - TM005
