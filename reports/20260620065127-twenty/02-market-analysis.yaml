- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Persistent nation-state cyber conflict
    - Driver
    - Current
    - Makes offensive cyber a continuously funded mission rather than a sporadic experiment
    - Confirm which threat sets and mission types actually map to Twenty deployments
  - - AI-compressed exploit and breakout cycles
    - Driver
    - Current to near-term
    - Raises the value of automation and parallel target pursuit
    - Test whether Twenty's product meaningfully outperforms human-only workflows
  - - Enhanced budget control and PEO maturation
    - Driver
    - Near-term
    - Creates a clearer centralized procurement path inside CYBERCOM
    - Verify where software buys sit inside the emerging acquisition structure
  - - Operator training cost and time
    - Driver
    - Current
    - Automation can substitute for scarce labor and reduce the burden on expensive specialists
    - Measure how much operator time the product actually saves per mission
  - - Force-rotation and readiness shortfalls
    - Driver
    - Current
    - Supports tools that preserve institutional knowledge and increase throughput
    - Request evidence of deployment durability across rotating teams
  - - Oversight, escalation, and democratic-accountability debate
    - Constraint
    - Current
    - Can slow or narrow the acceptable role of private vendors in offensive cyber
    - Assess legal authorities, customer rules of engagement, and approval boundaries
  - - OCC opacity and proliferation narratives
    - Constraint
    - Current to medium-term
    - Creates reputational and policy risk even for domestically aligned vendors
    - Map how Twenty differentiates itself from controversial OCC intermediaries and spyware narratives
  - - Classified procurement opacity
    - Constraint
    - Current
    - Prevents a clean public SAM/SOM and complicates underwriting
    - Request contract mix, renewal data, and buyer concentration under NDA
  notes: Rows mix tailwinds and constraints because the same market drivers that create urgency also create the strongest underwriting risks.
