  researchQuestions:
  - id: QP001
    question: Which public vendors are Twenty's closest direct competitors versus adjacent or substitute alternatives?
    type: enumeration
    targets:
    - contentRequirements/0
    priority: high
    status: answered
    answerSummary: The direct benchmark is the Xpanse lineage; Mandiant, Elastic, Palantir, AttackIQ, Metasploit, runZero, ZeroFox, and mission-adjacent defense-AI platforms are mostly adjacent or substitute routes.
  - id: QP002
    question: How much of Twenty's competitive story is anchored in the founders' Expanse and Palo Alto Networks background?
    type: verification
    targets:
    - contentRequirements/1
    priority: high
    status: answered
    answerSummary: Company, PR, and independent coverage all tie the founding story to Expanse and Palo Alto Networks public-sector work.
  - id: QP003
    question: What official evidence makes Cortex Xpanse the clearest direct benchmark for Twenty?
    type: verification
    targets:
    - contentRequirements/0
    priority: high
    status: answered
    answerSummary: Xpanse publicly claims continuous internet-scale discovery, automated response, and use by all six U.S. military branches.
  - id: QP004
    question: Is Mandiant a direct offensive-cyber competitor or mainly a high-trust services substitute?
    type: comparison
    targets:
    - contentRequirements/0
    priority: high
    status: answered
    answerSummary: Mandiant appears mainly as a services-led substitute around red teaming, response, and threat intelligence rather than a clone of Twenty's offense-first product framing.
  - id: QP005
    question: Does Elastic use materially similar human-supervised automation language to Twenty in 2026?
    type: comparison
    targets:
    - contentRequirements/2
    priority: high
    status: answered
    answerSummary: Yes. Elastic explicitly says the human is moved to the top of the loop, echoing Twenty's public architecture rhetoric.
  - id: QP006
    question: What makes AttackIQ an adjacent readiness competitor rather than a direct offensive mission platform?
    type: mechanism
    targets:
    - contentRequirements/2
    priority: medium
    status: answered
    answerSummary: AttackIQ focuses on CTEM, attack-path validation, and threat-debt reduction instead of selling operator mission execution.
  - id: QP007
    question: How does Metasploit compare as an offensive tooling substitute for part of Twenty's workflow?
    type: comparison
    targets:
    - contentRequirements/2
    priority: medium
    status: answered
    answerSummary: Metasploit is strong on exploit modules and pentest productivity but is a component tool rather than an end-to-end mission platform.
  - id: QP008
    question: Does runZero overlap most closely with the discovery portion of the Twenty thesis?
    type: mechanism
    targets:
    - contentRequirements/0
    priority: medium
    status: answered
    answerSummary: Yes. runZero is strongest as a visibility and fingerprinting substitute for the discovery layer, not the full mission layer.
  - id: QP009
    question: What overlap does ZeroFox create on external intelligence and disruption workflows?
    type: comparison
    targets:
    - contentRequirements/2
    priority: medium
    status: answered
    answerSummary: ZeroFox overlaps on external intelligence, validation, and disruption, but its public posture is enterprise digital risk rather than offensive cyber operations.
  - id: QP010
    question: How should Darktrace be classified in Twenty's competitor set for this chapter?
    type: enumeration
    targets:
    - contentRequirements/0
    priority: medium
    status: answered
    answerSummary: Darktrace is best treated as an adjacent automated-defense platform, not as a direct offensive cyber competitor.
  - id: QP011
    question: What public evidence shows how Palantir Gotham competes with Twenty on cyber missions specifically?
    type: verification
    targets:
    - contentRequirements/1
    priority: medium
    status: partial
    answerSummary: The reviewed Gotham fetch only proves platform branding, so Palantir is included as a mission-intelligence incumbent but not mapped in detail to offensive cyber workflows.
  - id: QP012
    question: Should Shield AI and Anduril be treated as direct cyber competitors or mission-adjacent defense-AI platforms?
