company:
  name: Twenty Technologies, Inc.
chapter:
  number: 3
  title: Competitors
  summary: 'Twenty does not face one clean peer set. Its closest direct benchmark is the Expanse-to-Cortex Xpanse lineage around internet-scale discovery, but most other credible alternatives are adjacent or substitute routes: Mandiant and Palantir for government-grade analysis and services, Elastic for agentic security operations, AttackIQ and Metasploit for validation and offensive tooling, and runZero or ZeroFox for visibility and external intelligence. Twenty''s wedge is the claim that it stitches those layers into one offensive cyber mission system for U.S. government operators. That wedge is meaningful, but public pricing is opaque, direct head-to-head win data is sparse, and much of the surrounding feature rhetoric is increasingly commoditized across broader cyber and defense-AI incumbents.'
sections:
- id: landscape-and-solution-classes
  title: Landscape and Solution Classes
  body: 'Twenty should not be benchmarked against consumer or enterprise companies that merely share the word ''Twenty.'' Its real competitive frame is a layered government and mission-tech stack. At the most direct end sits the Expanse lineage now commercialized as Cortex Xpanse: the founders'' prior domain and the clearest public proof that internet-scale asset discovery and automated response can sell into demanding government buyers. Around that core are adjacent incumbents such as Mandiant, Palantir Gotham, and Elastic that already sell high-trust cyber or intelligence workflows with human-supervised automation. A third layer consists of substitutes such as AttackIQ, Metasploit, runZero, and ZeroFox, each covering one piece of discovery, exploitation, validation, or intelligence. Internal build is the final substitute underneath everything else. That matters because Twenty''s claim is not that it invented every component technology. Its claim is that mission operators need one offense-first
    system that turns fragmented reconnaissance and tradecraft into persistent, parallel, human-governed operations for the U.S. military and intelligence community.'
