- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why the threat is credible
  - Mitigation / diligence ask
  rows:
  - - End-to-end offensive workflow
    - Buyers self-assemble from incumbents and internal tools
    - High
    - Discovery, exploit, validation, intelligence, and analytics alternatives already exist in public markets
    - Request operator-level evidence that Twenty materially compresses cycle time versus stitched stacks
  - - Founder-market fit from Expanse lineage
    - Xpanse itself remains a live incumbent benchmark
    - High
    - The prior platform already advertises scale and military adoption
    - Ask where Twenty has actually displaced Xpanse-derived workflows instead of merely inheriting pedigree
  - - Human-governed autonomy narrative
    - Elastic and others now use near-identical rhetoric
    - Medium-High
    - Human-approved agentic automation is no longer unique language in cyber
    - Test whether differentiation lies in mission outcomes, not in messaging
  - - Government-mission specialization
    - Mandiant, Palantir, and internal government teams already have trust and distribution
    - High
    - Trust and accreditation can outweigh startup speed in sensitive missions
    - Probe contract duration, recompete risk, and who signs off on deployment
  - - Category scarcity
    - Axios notes cyber success stories are rare versus kinetic defense bets
    - Medium
    - Capital-market mindshare and public comps are thinner than in drones or hardware
    - Benchmark follow-on financing appetite and exit paths against non-cyber defense tech
  - - Opaque commercial packaging
    - Weak public pricing visibility hides commoditization or heavy services dependence
    - Medium
    - Nearly every reviewed vendor avoids public price disclosure
    - Request realized pricing, gross-margin mix, and services share before underwriting moat
  notes: Severity reflects competitive and procurement risk to moat durability, not existential legal or regulatory risk.
