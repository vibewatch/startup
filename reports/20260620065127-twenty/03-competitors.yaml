  - Limitation versus Twenty
  rows:
  - - Cortex Xpanse
    - Direct technical benchmark / external attack-surface management
    - Officially claims 500B+ ports scanned daily and use by all six U.S. military branches
    - Government and enterprise teams needing internet-scale visibility
    - Continuous discovery, prioritization, automated response
    - Framed around exposure management rather than end-to-end offensive mission operations
  - - Mandiant / Google
    - Adjacent incumbent / services-led substitute
    - Two decades of frontline incident-response and threat-intelligence positioning
    - Government and large-enterprise cyber teams
    - Red teaming, incident response, threat intel, flexible retainers
    - Service-heavy and defense-oriented rather than offense-native mission software
  - - Elastic Security
    - Adjacent platform / agentic SOC competitor
    - Publicly markets autonomous agents plus sovereign, on-prem, and air-gapped deployment
    - Security operations teams with data-platform depth
    - Human-approved automation, open architecture, explicit pricing posture
    - Centered on defensive SOC workflows rather than offensive tradecraft
  - - AttackIQ
    - Substitute / CTEM validation platform
    - Closed-loop CTEM positioning with MITRE ATT&CK coverage and threat-debt metrics
    - Security teams validating controls and attack paths
    - Continuous validation and measurable readiness framing
    - Validates and simulates; does not market itself as an operator mission system
  - - Rapid7 Metasploit
    - Substitute / offensive tooling component
    - 4,000+ exploit modules and long-lived practitioner adoption
    - Pen testers, red teams, internal offensive-security shops
    - Exploit depth and social-engineering support
    - Tool-level capability, not integrated government mission orchestration
  - - runZero
    - Substitute / discovery component
    - Safe active and passive discovery across internal and external assets
    - Asset visibility and exposure-management teams
    - Fast deployment and rich asset fingerprinting
    - Stops at visibility and prioritization rather than mission execution
  - - ZeroFox
    - Adjacent external-intelligence platform
    - Dark web, threat-channel, and disruption workflows in one external-risk surface
    - Threat-intel and digital-risk teams
    - Finished intelligence plus disruption workflow
    - Enterprise digital-risk framing is broader and less mission-specific than Twenty
  - - Palantir Gotham
    - Adjacent mission-intelligence incumbent
    - Dedicated platform brand with deep national-security associations
    - Defense and intelligence mission owners
    - Higher-level intelligence and decision support context
    - Reviewed public material does not evidence offensive cyber workflow depth
  - - Shield AI / Anduril
    - Mission-adjacent defense-AI platforms
    - Strong autonomy and defense-tech mindshare outside cyber
    - Defense buyers prioritizing autonomy and mission systems
    - Distribution, capital access, and urgent mission narratives
    - Different operational domain; not direct cyber-offense clones
  - - Twenty
    - Integrated offensive cyber mission platform
    - Reported military and intelligence contracts plus $1B valuation by mid-2026
    - U.S. military and intelligence operators
    - End-to-end offense-first workflow and parallel target pursuit
    - Proof of displacement, pricing, and long-term moat remains thin in public
  notes: Rows are grouped by solution class rather than pretending the market is made of one homogeneous peer set.
