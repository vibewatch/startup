- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Route
  - Public pricing posture
  - What is included
  - Unknowns / caveats
  - Buyer implication
  rows:
  - - Twenty
    - No public list pricing observed
    - Company claims end-to-end offensive cyber operations for military and intelligence users
    - Module mix, contract length, services content, and realized pricing are undisclosed
    - Procurement diligence must test whether workflow integration offsets young-vendor risk
  - - Cortex Xpanse
    - No public list pricing observed
    - Internet-scale discovery, attack-surface learning, and automated response playbooks
    - Government pricing, implementation scope, and service wrap are undisclosed
    - Likely easier to buy as a known reconnaissance layer than as a full mission replacement
  - - Mandiant
    - Retainer and consulting motion; no public list pricing in reviewed page
    - Incident response, threat intel, red teaming, assessments, and AI security support
    - Whether comparable government buyers treat it as tool spend or services spend is not public
    - Can absorb urgent mission support budgets without requiring belief in a new product category
  - - Elastic
    - Explicitly priced on compute and storage, not endpoints
    - Unified SIEM, XDR, automation, and AI reasoning stack
    - Realized government pricing and air-gapped economics are still undisclosed
    - Most transparent reviewed pricing posture, which helps comparison shopping
  - - AttackIQ / Metasploit
    - Commercial-sales motion; no list pricing observed in reviewed pages
    - Validation, simulation, exploit modules, and offensive-security productivity
    - How much services labor is required is not public in reviewed materials
    - Can be purchased as narrower capability blocks instead of a full workflow bet
  - - runZero / ZeroFox / Gotham
    - No public list pricing observed
    - Discovery, external intelligence, or mission-intelligence context by route
    - Reviewed pages do not expose public unit economics
    - These alternatives can slot into existing stacks and preserve buyer optionality
