  - FO003
- id: leadership-and-org-design
  title: Founders, Leadership and Key-Person Dependence
  body: The founding bench is unusually concentrated in people who previously served in military cyber units and in the Expanse-to-Palo Alto Networks ecosystem. Joe Lin leads the company as co-founder and chief executive officer after work at Palo Alto Networks and Expanse, and outside coverage also identifies him as a former Navy Reserve officer. Co-founder and chief technology officer Leo Olson is described as having led engineering for Palo Alto Networks' first cyber-operations capability after a long Army and signals-intelligence career. Pete Sorrentino and Skyler Onken extend that pattern on growth and engineering, respectively, while Dan Quinlan runs finance and operations and Adam Howard leads cyber policy. The result is strong founder-market fit for a sensitive government mission set, but it also means the public narrative, policy engagement, and customer-access story are heavily concentrated in Lin and a small circle of senior operators, which is a real diligence risk if any one
    of them departs.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
