      - number: '8.3'
        title: 情景区间与建议
        blocks:
          - type: paragraph
            body: >-
              当前 $1 billion 估值并不荒唐，但证据不足。乐观情景很直接：Twenty
              已有顶级投资人、真实政府合同、政策可见度，以及契合市场向机器速度网络行动迁移的产品叙事。如果这些可见合同只是切入更大、可复制项目基础的第一楔子，而且业务最终更像软件而不是重服务，那么本轮估值甚至可能显得保守。基准情景没那么英雄主义：只有当公司能把今天的战略可信度转化为更大规模的义务收入流，同时不让涉密劳动力、部署摩擦或合同集中度吞掉毛利，估值大概率才算方向上合理。下行情景也很容易看到。如果公开合同证明始终不能转化为软件质量经济性，如果监督或采购放慢采用，或者市场开始把
              Twenty 更像一个不透明政府承包商、而不是高溢价自主平台来定价，估值会很快重置。这个组合让当前最好的判断是继续研究：风险高，信心中等，估值立场偏紧，而不是干净买入。
