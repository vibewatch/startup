      - number: '3.3'
        title: 切换成本、内部自建和购买摩擦
        blocks:
          - type: paragraph
            body: >-
              切换成本更可能来自工作流集成、资质认证和操作员信任，而不是专有功能锁定。本文审阅的官方页面几乎没有公开同业定价，这本身就是竞争信号：该品类买方大多通过不透明、销售主导或按合同定制的动作采购，而非透明 SaaS
              采购。这种不透明让公开比较变得困难，并把尽调重点转向部署模型、任务契合度和采用摩擦。它也让内部自建成为严肃替代方案。政府买方可以用 Xpanse 或 runZero 做发现，用 Metasploit 做利用，用
              Mandiant 或内部团队做红队，用 AttackIQ 做验证，用 ZeroFox 做外部情报，用 Gotham 或其他分析平台做更高层任务背景。因此，Twenty
              必须证明统一进攻性工作流确实能降低操作员负担和周期时间，且幅度足以让买方选择一家年轻供应商，而不是拼接现任者栈或内部治理的工具链。
