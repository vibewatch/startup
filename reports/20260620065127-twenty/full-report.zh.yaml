      - number: '7.4'
        title: 缓释成熟度、监控与终止触发点
        blocks:
          - type: paragraph
            body: >-
              缓释图景可信但不完整。公开材料一贯表示，人仍在环内，部署受到控制，公司在扩张工程和研究，而不是过度承诺完全自主进攻。在一个不受控自主性会在商业和政治上都难以成立的品类里，这些都是有用起点。但公开层面仍没有审计包、控制证明、出口分类备忘录，或合同级证据，能说明公司如何清理许可、记录审批、隔离敏感环境，或证明续约耐久性。FedRAMP
              的公开市场也展示了可见的联邦保障表面可以是什么样；但 Twenty 的公开材料仍未指向类似授权或可由独立方引用的控制工件。因此，投资含义应围绕里程碑，而不是叙事来框定：清晰的出口 /
              合规地图、可由独立方引用的合同证据、成功招聘涉密人才，以及能超越创始人和政策叙事的客户证明。如果这些不能落地，让 Twenty 变得有吸引力的战斗紧迫性，反而可能通过监督冲击、采购滑坡或声誉反噬放大下行。
