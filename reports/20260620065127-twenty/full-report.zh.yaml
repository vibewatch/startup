      - number: '6.4'
        title: 耐久性、参考质量和仍缺什么
        blocks:
          - type: paragraph
            body: >
              公开留存证据很薄。客户数量、合同期限、续约率、重新竞标胜率、NRR、GRR 或客户满意度，Twenty 都没有披露指标。最好的耐久性代理信号只能间接看：Twenty 还在隐身期时就已经与政府买方合作；七个月后，据
              Axios 报道，公司仍有军方和情报界合同；到 2026 年，公司一边扩张涉密部署和支持岗位，一边围绕进攻性网络任务，与 WVU
              建人才和研究合作。这些信号说明确有活跃工作负载，也显示后续需求有一定可信度，但它们不能替代续约数据或可引用的终端用户结果。因此，本章要区分三层证明。第一，真实合同有可信证据。第二，持续任务使用和交付活动有中等证据。第三，用户满意度、合同扩张和长期黏性方面，公开证据较弱。缺口部分来自结构性原因：Twenty
              的许多潜在用户可能在涉密环境中工作，公开背书本来就少。但对尽调而言，结论不变——耐久性更多是推断出来的，还没有被证明。
