      - number: '4.3'
        title: 成本结构、持证人才负担和扩张信号
        blocks:
          - type: paragraph
            body: >-
              公开成本结构数据缺失，但招聘足迹提供了有用代理。Ashby 显示，截至 2026 年 6 月，公司有 39 个开放岗位，覆盖工程、财务、增长、产品和人才；职位列表既包括已有 TS/SCI 许可，也包括要求
              TS/SCI 的岗位，并包含前线部署可靠性工作。开放岗位集中在阿灵顿、华盛顿、纽约、Fort Meade 和 San Antonio，部分财务招聘也从 San Francisco
              寻源。这些信号指向一家仍在重金投入资深技术人才、机密项目交付能力和内部财务运营的公司，而不是收割成熟装机基础。

              这一点重要，因为面向机密客户的进攻性网络产品化，不太可能像干净的自助式软件成本结构。持证劳动力、现场部署、前线工程和采购摩擦，即便在收入增长时，也可能延迟毛利率扩张。客户侧战备数据也指向同一方向：DefenseScoop
              称部分 Interactive On-Net Operator 训练需要一到三年，每名军人成本 $220,000 至 $500,000，另有报道描述 Cyber Command
              正在应对战备和人员流失。这是自动化付费意愿的有用代理，但也意味着漫长、咨询式、政府定制的销售和部署周期。没有披露的员工数、薪酬结构、托管画像或服务组合时，正确解读不是利润率薄弱，而是公开证据不足以判断
              Twenty 正在变得像软件公司，还是仍然偏劳动密集。
