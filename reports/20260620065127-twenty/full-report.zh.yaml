  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 出口 / 政策冲击
        - 正式出口分类和授权图谱
        - 到下一轮尽调仍没有针对盟友或跨境支持的书面许可立场
        - 将国际上行空间视为投机，并下调收入扩张假设
      - - 控制不足
        - 独立安全与审批控制材料包
        - 没有可审计证据证明日志、隔离、人工审批和事件处理
        - 暂停按可耐久大规模部署来承销
      - - 人才瓶颈
        - 涉密岗位招聘和留存
        - 关键涉密岗位连续两个或更多季度空缺
        - 假设交付摩擦增加、上线更慢、烧钱更高
      - - 客户集中
        - 可背书授标 / 续约证据
        - 除当前公开轶事外，没有额外可独立背书的合同或续约证明
        - 不按广泛平台采用或溢价倍数延续来承销
      - - 叙事跑在执行前面
        - 部署证明相对于估值和招聘节奏
        - 公开估值 / 融资里程碑继续推进，但控制或客户证据没有变强
        - 将观点转向继续研究 / 回避，除非价格重置或尽调补齐缺口
    notes: 否决标准围绕外部可核验里程碑设计，因为公开证据对紧迫性和融资更强，对耐久控制成熟度或续约深度更弱。
