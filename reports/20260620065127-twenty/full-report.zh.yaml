  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、买方和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Twenty
              并不是面向整个网络安全市场销售，甚至也不是面向全部国家安全软件市场。最接近的公开市场边界，是美国军方和情报机构采购的进攻性网络行动软件及相邻任务基础设施；这些组织需要比纯人工工作流更快地发现、排序并追踪目标。Twenty
              自有页面反复把问题定义为已经发生的工业级网络冲突，并称软件会编码精英技战法、自动化数百个目标上的持续行动，并支持美国及盟友任务伙伴。这个边界明显窄于通用企业安全、零信任现代化或广义国防 AI 支出。


              近期最可信的买方是 U.S. Cyber Command，以及围绕它支持或执行网络任务的军种、Navy
              和情报组织网络。公开合同报道、公司声明、国会听证名单和大学合作措辞都指向同一个买方簇：执行进攻性或情报相关网络任务的国家安全机构。用户是操作员或分析师；付款方是政府项目办公室或任务预算；采用路径由采购牵引，而不是自助式。现状替代方案包括定制化操作员工作流、传统主承包商和更老的垂直小承包商。Forbes
              明确称 Twenty 不寻常，因为风投支持的进攻性网络公司很少赢得 Cyber Command 工作；这类工作过去通常流向定制化商店或老牌国防承包商，而不是创业软件平台。
