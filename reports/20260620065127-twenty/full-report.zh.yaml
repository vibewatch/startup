      - number: '2.3'
        title: 需求驱动、技术背景和战备痛点
        blocks:
          - type: paragraph
            body: >-
              需求最强的地方，是持续性国家级冲突与机器速度行动交汇处。CISA、White House、CrowdStrike、CyberScoop 和 Twenty
              自有材料都描述了一个由成熟对手持续施压、而非零星事件定义的网络环境。CrowdStrike 2026 年报告称，AI 赋能对手的攻击在 2025 年增加 89%，平均突破速度同比提高 65%，超过 90
              家组织的合法 AI 工具被滥用来生成恶意命令或窃取数据。CyberScoop 的 RSAC 2026 报道把市场含义说得更尖锐：Kevin Mandia 描述了进攻侧近期的完美风暴，他和 Alex Stamos
              都认为 AI 正在压缩从发现到利用的时间。如果攻击者能以机器速度移动，仍围绕纯人工目标选择和执行循环构建的指挥体系会越来越显得乏力。


              技术市场背景也验证了该品类。DARPA 的 $29.5 million AI Cyber Challenge 显示政府自身希望把 AI 系统用于网络安全问题，MITRE ATT&CK
              则提供了公开技战法分类，任何进攻性网络平台都必须从侦察到影响全程穿过这套分类。劳动力侧同样重要。DefenseScoop 关于 Interactive On-Net Operator
              训练的报道说明自动化为何能卖给这个买方：军方进攻操作员是关键战备短板，训练需要一到三年，在高度机密环境中每名操作员成本约 $220,000 至 $500,000。Nakasone
              另行发表的战备言论也强化了这一点：问题不只是技术，还有留任和机构记忆。合在一起，市场驱动不是通用网络增长，而是 AI 压缩的攻击周期、持续状态的对手集合，以及 Twenty
              精准瞄准的买方组织内部昂贵的人力瓶颈同时汇合。
