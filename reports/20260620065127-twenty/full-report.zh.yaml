      - number: '2.2'
        title: 预算包络和证据约束下的规模判断
        blocks:
          - type: paragraph
            body: >-
              公开的自上而下预算背景是真实的，但不应被误认为 Twenty 的可服务市场。DefenseScoop 报道称，Department of Defense 在 FY2024 为网络空间活动投入 $13.5
              billion，而 USCYBERCOM 可见的总部、采购和 RDT&E 条线分别约为 $332.6 million、$129 million，以及大约 $1.05 billion 至 $1.1
              billion。这给出了很大的预算包络，也证明这不是兴趣型市场。它还说明这个品类为何在财务上重要：创业公司即使赢下这些资金池的一小部分，也能变得有意义。但同一证据也警告不要懒惰地抬高 TAM。DoD
              总额包含许多活动——零信任、加密、国防工业基础支持和其他网络项目——并不自动都能被进攻行动平台触达。


              更好的市场镜头，是从广义 DoD 网络空间总额收窄到 CYBERCOM 控制的包络，再进一步收窄到明确提到指挥控制、大数据、训练和执行进攻行动的 JCWA 组件。即便如此，公开来源也没有披露究竟有多少支出真正可被
              Twenty 这样的软件触达，而不是流向劳动力、基础设施或其他类别。最扎实的下限市场证据不是报告，而是公开合同证据：Forbes 和 Tectonic 合起来指向约 $12.84 million
              的具名合同信号，说明该品类可以通过采购门槛。因此，诚实结论是有边界而非精确：相关市场位于一个小的公开验证点和一个大得多但只部分可触达的政府网络预算之间；公开来源无法在不发明假设的情况下隔离出干净的 SAM 或
              SOM。
