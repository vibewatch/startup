      - number: '7.3'
        title: 商业集中度与依赖风险
        blocks:
          - type: paragraph
            body: >-
              从商业上看，Twenty 似乎已有真实牵引，但可见需求基础很窄，而且高度依赖采购。Forbes 和 Tectonic
              都指向实际政府合同，而公司自己的新闻和合作材料强调的是军方、情报和盟友任务，不是更广的商业客户组合。预算支持时，这可能是优势；但也让收入高度依赖少数美国政府买方、JCWA
              式采购路径，以及政治上能长期支持私营部门进攻性网络的环境。DefenseScoop 对 CYBERCOM
              预算的报道显示，体系里确有真金白银；但这些资金越来越集中在指挥部主导的优先事项和快速采购机制下，渠道可能缓慢、不透明，或更像项目制，而不是可复制的 SaaS
              渠道。同样的集中度也放大竞争风险，因为主承包商和成熟网络安全厂商可以凭可信关系、更宽产品套件和更强合规基础设施切入这一品类。公开合同数据库显示，外部观察者仍缺少一张清晰的授标级图谱，无法看清 Twenty
              的组合、时间线和续约画像。
