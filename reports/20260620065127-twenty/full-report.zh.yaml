      - number: '2.4'
        title: 约束、矛盾和保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              看多逻辑并不是全部。这个市场仍具政治敏感性、采购繁重且部分不透明。Frank Cilluffo 2026 年 1
              月国会证词称，美国已从前沿防御和授权下放的进攻权限中获得作战收益，但他也警告，这一转变重新激活了围绕监督、情报权益、升级和民主问责的未解问题。同一证词称，私营部门在主动网络防御中的角色否则可能滑入临时性的法律灰区。CyberScoop
              给出了同一谨慎态度的更技术版本，引用 Morgan Adamski 的话称，任何引入生态系统的 AI 能力都可能反过来被用来对付美国。Atlantic Council 的 Mythical Beasts
              研究则把担忧从政策扩展到市场结构，记录了进攻能力和间谍软件扩散，说明即使对亲美供应商而言，不透明性和中介风险仍是品类叙事的一部分。


              这些矛盾直接影响市场规模和采用。该品类显然有真实预算、真实任务和真实紧迫性，但公开证据仍未显示 CYBERCOM 预算中究竟有多少可被 Twenty
              这样的软件争夺，有多少被机密基础设施或服务绑定，或者机会中有多大比例位于情报界而非 DoD。即便公开授标验证也不完整：抓取到的 USASpending 页面暴露了搜索界面，但没有给出具体 Twenty
              合同记录或授标 ID。结果是，本市场章节应保留不确定性，而不是把它平均掉：Twenty
              看起来运行在一个战略上重要、但采购段仍不成熟的市场中；这里已有验证，自上而下预算很大，接下来的主要尽调工作围绕合同组合、买方集中度、续约路径，以及政策审视可能如何塑造私营部门进攻性网络的可接受范围。
