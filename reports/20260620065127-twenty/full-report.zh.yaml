      - number: '5.2'
        title: 架构和技术依赖
        blocks:
          - type: paragraph
            body: >-
              公开可重构的架构像一个分层系统。底层是目标和威胁数据：ATT&CK 式生命周期知识、政府威胁报告，以及 Twenty
              能够收集或摄取的侦察和漏洞信号。其上是自动化层，可能处理目标分诊、攻击路径生成和建议组装。公开招聘广告证据也指向人物画像开发工作和 AI
              驱动自动化工具，说明工作流可能延伸到社会工程支持或其他准备性技战法。最强的直接技术线索来自一个高级后端岗位，点名实时操作信号、图数据、事件驱动架构和机器速度 API；也来自一个 DevOps 岗位，描述 AWS
              基础设施、单租户和多租户环境、Terraform、IAM /
              网络安全和可观测性。人类操作员仍是正式控制层，而不是事后补丁。这一点重要，因为公司销售对象是敏感政府任务：速度重要，但无边界自主在商业和政治上都不可接受。最大架构依赖并不是公开产品化内容，而是外部条件：稀缺的持证人员、敏感客户环境，以及在摄取准确情报的同时以机器节奏运行的需求。与现代威胁情报和
              CTEM 平台相比，Twenty 可能的优势不是独特分类法或扫描原语，而是把许多原语编排成一个面向操作员的任务系统。
