      - number: '3.2'
        title: 直接、相邻和替代供应商
        blocks:
          - type: paragraph
            body: >-
              在这里，直接与相邻之分比普通企业软件市场更重要。Xpanse
              是最强的直接技术对标，因为它把持续外部发现运营化，并已公开宣称六个美国军种都是用户；但它的定位是攻击面管理和修复，而不是进攻性任务执行。Mandiant
              是服务主导型替代品，适合那些想要红队、威胁情报或响应深度、但不想购买新进攻原生平台的精英操作员。Elastic 具有战略重要性，因为它围绕自主代理、人类审批、隔离部署和模型无关开放性的公开语言，与 Twenty
              使用的系统叙事高度重叠。AttackIQ、Rapid7 Metasploit、runZero 和 ZeroFox 各自覆盖工作流中更窄的切片，但合在一起显示，成熟买方可以近似拼出 Twenty
              价值主张的若干部分。Palantir Gotham 和 Shield AI、Anduril 等更广义国防 AI 平台位于更高一层：它们不是网络进攻克隆品，但会争夺同一批国家安全注意力、集成预算和操作员心智。
