      - number: '3.4'
        title: 护城河耐久性和负面信号
        blocks:
          - type: paragraph
            body: >-
              看多情形是，Twenty 很早进入一个仍缺乏主导进攻优先平台的品类，该平台面向美国政府网络行动。看空情形是，它的语言已经从多个方向被挤压。Elastic 使用几乎相同的人类监督自动化话术。AttackIQ 谈论
              AI 速度的闭环和可衡量威胁降低。Xpanse 仍是侦察规模上最明显的现任者基准。Palantir 和 Mandiant 已在政府买方中拥有信任、分销和集成深度。即使在网络之外，Anduril 和 Shield
              AI 也用类似紧迫的自主叙事吸收国防科技资本和注意力。公开证据在投资人最想要精确性的地方仍然薄弱：标价大多不可得，直接正面采购结果不可见，Axios
              本身也指出，网络成功故事比更动能化的国防押注更少。因此，怀疑性解读不是 Twenty 没有真实切入点，而是这个切入点必须通过更快的任务结果来证明，不能只靠品类话术，因为周边许多替代品也在同时改进。
