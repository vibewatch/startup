  - id: TV003
    title: 可比估值表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Rows cover every structural reference set used in this chapter: founder-pedigree cyber exits, public AI-security
        platforms, services-heavy adjacent cyber models, defense-autonomy analogs, and category-rhetoric cautions.
    columns:
      - 可比对象
      - 当前状态或信号
      - 重要性
      - 与 Twenty 的相关性
      - 局限
    rows:
      - - Expanse / Palo Alto 背景
        - 过往网络平台退出背景
        - 说明创始人曾参与打造过有价值的国家安全网络资产。
        - 对团队质量和买方理解是好的背景信号。
        - 背景不是新公司的估值倍数。
      - - Darktrace / SentinelOne
        - 公开 AI 安全平台类比
        - 说明机器速度和自主安全叙事可以成长为大型、耐久的软件品类。
        - 有助于理解高溢价网络软件可能长什么样。
        - 两家公司披露的经济数据远多于 Twenty，且面向不同买方。
      - - Mandiant
        - 服务加软件的网络安全模型
        - 提醒投资人：相邻网络安全品类可能长期依赖专家和服务。
        - 如果 Twenty 的交付模型更定制、没那么像软件，这一点很重要。
        - 不是进攻性网络或纯软件类比。
      - - Anduril / Shield AI
        - 防务自主化任务软件类比
        - 说明国家安全自主化平台可以获得强战略支持。
        - 有助于思考传统网络安全之外的任务软件需求。
        - 它们不是网络安全公司，也不能解决 Twenty 的定价不透明。
      - - IronNet
        - 品类话术警示
        - 提醒投资人：宏大的网络平台语言本身不是估值证明。
        - 可用作防范叙事过度的反向校验。
        - 当前公开材料偏定性，不能单独解释完整下行路径。
      - - Recorded Future / 威胁情报相邻市场
        - 大额相邻情报支出信号
        - 支持网络决策支持可以获得有意义预算这一判断。
        - 对市场相邻性有帮助，尤其是 Twenty 若扩展到狭窄任务执行之外。
        - 相邻性不能证明客户、利润率或倍数完全相同。
    notes: 这是结构性可比表，因为已审阅来源集没有披露足够的同行财务细节，无法支撑干净的数值倍数表。
    claimRefs:
      - CV013
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 示意估值区间（USD B）
      - 概率信号
      - 主要失效模式
    rows:
      - - 乐观
        - Cyber Command 和相邻任务工作转化为大得多的经常性项目基础；利润率按软件型跑通；投资人溢价维持。
        - 1.3-1.7
        - 从公开证据看有可能，但证据仍不足
        - 当前合同证明最终显得太小，或服务成分太重。
      - - 基准
        - 公司战略上真实，并能拿到后续工作，但仍然集中、交付较重，且部分不透明。
        - 0.8-1.1
        - 公开证据下最站得住的情形
        - 项目扩张落后于当前估值隐含的预期。
      - - 悲观
        - 上限金额没有转化为有意义的确认收入；监管、采购摩擦或集中度压缩溢价。
        - 0.4-0.7
        - 尽调不及预期时存在实质风险
        - 投资人发现收入基础更薄，普通股条款也没那么有吸引力。
    notes: 估值区间是基于证据文件形成的判断，不是市场报价或经审计的公司预测。
