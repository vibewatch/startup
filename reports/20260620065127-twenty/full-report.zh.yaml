      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >
              扩张看起来可行，但高度集中。Twenty 可能在同一客户群里做深：从一个任务团队扩到更广的指挥体系采用，从研究合同走向作战项目，再从直接军方买方延伸到相邻的情报界和盟友用例。采购架构解释了这条路径：Cyber
              Command 现在拥有更强的预算控制权，Joint Cyber Warfighting Architecture
              也纳入进攻行动和训练系统，相比过去，预算责任人更清晰。但集中度风险很突出。本研究抓取到的所有公开客户证明点，都绑定在美国政府国家安全生态；没有具名商业客户，没有具名盟友客户，也没有披露客户收入结构。政策和采购不透明，也限制了证明质量。本研究集里的官方
              USASpending 和 SAM.gov 页面说明数据库和机会渠道是对的，但这里无法检索到 Twenty 的授标细节。Cilluffo 2026 年 1 月证词和 Atlantic Council
              研究也强调，私营部门参与主动网络行动仍存在法律和战略模糊性。投资含义很直接：如果 Twenty
              嵌入少数几个耐久政府项目，上行空间很大；但下行也同样集中，因为外部观察者仍无法核验客户基础到底有多宽、可复制性有多强。
