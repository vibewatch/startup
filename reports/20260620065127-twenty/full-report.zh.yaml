        blocks:
          - type: paragraph
            body: >
              Twenty 的客户逻辑比客户名单更容易验证。DefenseScoop 报道称，Army 代表联合部队和 U.S. Cyber Command 试点了一门为期八个月的进攻操作员课程，因为 Interactive
              On-Net Operator 训练过去需要一到三年，每名军人成本 $220,000 至 $500,000，机密环境让人才管线尤其昂贵。另一篇 DefenseScoop 报道引用 Gen. Paul
              Nakasone 的话称，人员进出 Cyber Command 带来战备压力，削弱机构知识并抬高训练成本。这些瓶颈直接映射到 Twenty
              的产品定位：把精英技战法编码进软件，自动化跨数百个目标的持续行动，并让人类控制关键决策。预算背景强化了这个推介的相关性。Cyber Command 的 FY2024 申请包含 Joint Cyber
              Warfighting Architecture 下约 $1.1 billion 的 RDT&E 和 $129 million
              的采购；该架构明确覆盖指挥控制、大数据、训练和进攻行动工具。换句话说，底层买方痛点不是通用网络需求，而是机密任务环境中的战备和工作流问题；规模、操作员稀缺和机器速度对手同时重要。
