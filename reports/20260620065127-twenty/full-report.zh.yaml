        title: 客户群分层和买方画像
        blocks:
          - type: paragraph
            body: >
              Twenty 的客户范围压倒性地面向国家安全，而非商业市场。公司自有 Series A 新闻稿称，其在隐身期与美国军方和 Intelligence Community
              合作，构建并部署端到端进攻性网络系统；Axios 在 2026 年 6 月也独立报道 Twenty 与美国军方和情报界有合同，尽管 Joe Lin 拒绝提供细节。公开招聘信息把买方地图勾勒得更清楚：公司在招聘面向
              Intelligence Community 的 Mission Deployment Lead、前线部署分析师、站点可靠性工程师，以及位于 National Capital Region、Fort Meade
              和 Augusta 的持证数据工程师。这个岗位组合显示，付款方是政府机构或主承包预算持有者，买方是负责进攻性网络能力的任务或项目办公室，日常用户是持证分析师或操作员。最强的公开具名验证仍是 U.S. Cyber
              Command 和 U.S. Navy；除此之外，客户集合大多以宽泛群体而非具名机构披露。Twenty 首页和关于页面也提到支持美国及其盟友，但抓取证据中没有公开确认的具名盟国政府客户。地域或收入带分层未披露。
