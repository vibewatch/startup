      - number: '8.2'
        title: 结构性可比公司，以及它们不能证明什么
        blocks:
          - type: paragraph
            body: >-
              Twenty 正确的可比框架是结构性的，不是算术性的，因为公司没有公布正常收入倍数分析所需的指标。有些信号是正面的。Expanse 到 Palo Alto
              的传承是可信的履历标记；这不是保证，但说明创始团队此前见过一个有价值的网络安全平台如何被搭建并出售。Darktrace 和 SentinelOne 说明，只要能看到品类宽度和运营数据，买方和公开市场投资人会支持
              AI 驱动、机器速度的安全平台。Anduril 和 Shield AI 说明，国家安全买方可以在网络安全之外支撑以自主性为核心的任务软件公司。但这些都只是部分相似。Mandiant
              提醒投资人，相邻网络安全品类可能长期保持服务密集；House 证词和 Atlantic Council 研究则说明，私营进攻性网络自带治理和不透明负担，不会因为需求真实就消失。IronNet
              也适合作为谦逊检查：许多相邻公司都有高端网络平台叙事，因此关于 AI、国家和任务紧迫性的语言，本身不是估值证明。
