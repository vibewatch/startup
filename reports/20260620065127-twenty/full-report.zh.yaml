      - number: '4.5'
        title: 财务结论和承销风险
        blocks:
          - type: paragraph
            body: >-
              支持 Twenty
              的最佳财务论点，是顶级风险投资人、独立记者和大学伙伴都指向来自国家安全买方的真实需求。反对基于公开材料承销的最佳论点，是为执行风险定价所需的指标没有一项公开。同一生态中的国会公开证词还强调，持续进攻性网络会带来未解的监督、情报权益和灰区问题。对于一家可见客户群几乎全是军方和情报组织的公司，这种治理和政策复杂性不是财务故事之外的东西；它会直接塑造采购速度、披露限制、集中度风险和收入可预测性。

              因此结论很直接：Twenty 看起来能获得风险融资，也具有战略相关性，但公开层面还无法基于经营基本面承销。尽调流程需要合同层面收入确认、客户集中度、毛利率、员工数、现金和跑道数据，之后才可能形成财务确信判断。
