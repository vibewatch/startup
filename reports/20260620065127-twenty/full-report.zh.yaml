  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局和解决方案类别
        blocks:
          - type: paragraph
            body: >-
              评估 Twenty 时，不应拿那些只是同样含有 “Twenty” 一词的消费者或企业公司做基准。它真正的竞争框架是一套分层的政府和任务科技栈。最直接的一端，是如今商业化为 Cortex Xpanse 的
              Expanse 谱系：这是创始人此前的领域，也是互联网规模资产发现和自动化响应能够卖给高要求政府买方的最清晰公开验证。围绕这一核心，是 Mandiant、Palantir Gotham 和 Elastic
              等相邻现任者，它们已在销售高信任度网络或情报工作流，并带有人类监督的自动化。第三层是 AttackIQ、Metasploit、runZero 和 ZeroFox
              等替代品，各自覆盖发现、利用、验证或情报中的一个环节。内部自建是所有这些之下的最终替代。这一点重要，因为 Twenty
              的主张不是它发明了每项组件技术。它主张的是，任务操作员需要一个进攻优先系统，把碎片化侦察和技战法转化为面向美国军方和情报界的持续、并行、由人类治理的行动。
