      - number: '8.4'
        title: 尽调关口与论点破裂点
        blocks:
          - type: paragraph
            body: >-
              这里的尽调负担异常具体。第一，投资人需要合同级经济性，而不是标题：义务金额、收入确认节奏、选项年结构、续约节奏，以及可见的 Navy 和 Cyber Command
              工作到底是原型、软件订阅、服务交付，还是三者混合。第二，需要能把战略故事和可融资平台区分开的私有指标：ARR 或收入 run rate、毛利率、留存、集中度，以及对少数任务买方的依赖程度。第三，需要 2026 年
              6 月这一轮的股权结构现实，包括任何清算优先权、老股转让或投资人保护条款，这些都可能让名义 $1 billion
              对新普通股持有人没那么有意义。如果这些答案偏弱，投资论点就会破裂。若实际收入基数明显小于标题叙事暗示、服务占比重、续约弱，或本轮条款偏保护投资人，合理估值区间都会迅速压缩。在这些点被核验之前，公司值得主动跟踪，而不是盲目承销。
