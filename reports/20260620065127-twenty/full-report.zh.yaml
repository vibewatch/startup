  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 合同经济性不及预期
        - 义务收入或确认收入远低于头部合同叙事
        - 本轮定价基于尚未在经济上显现的未来规模。
        - 重新切分公允价值，并暂停承销。
      - - 服务占比主导
        - 毛利率或交付模型看起来更像承包商，而不是软件
        - 高溢价网络安全平台可比公司组已不再完全适用。
        - 估值应向区间低端移动。
      - - 集中度仍然极高
        - 少数机构或项目贡献大部分经济价值
        - 客户风险和采购节奏波动仍然过高，难以支撑溢价定价。
        - 要求更低入场价格或更强保护条款。
      - - 政策摩擦上升
        - 监督、授权或情报权益问题拖慢部署或扩张
        - 战略需求仍真实存在，但货币化明显放缓。
        - 拉长时间线，并下调倍数假设。
      - - 轮次条款保护投资人
        - 优先权、老股出售或结构安排侵蚀普通股上行空间
        - 表面估值不再能有效代表回报潜力。
        - 完成股权结构尽调前，不要依赖该估值标记。
    notes: 这些触发项用于尽调和下一轮融资周期中持续跟踪，而不是只在 IPO 时观察。
    claimRefs:
      - CV015
      - CV016
      - CV023
      - CV035
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合同到收入桥接
        - Cyber Command 和 Navy 项目的授标上限、义务金额、确认收入和期权年度结构
        - 判断可见牵引到底经济规模够大，还是只是战略意义突出。
        - 管理层资料室加合同律师复核。
      - - 收入质量
        - ARR 或收入运行率、毛利率、NRR、留存和服务收入占比
        - 判断应采用软件平台可比公司，还是更接近承包商的可比公司。
        - CFO 材料、董事会 KPI 和客户队列复核。
      - - 集中度和续约
        - 按机构、项目和合同续约日拆分收入
        - 检验业务是在拓宽，还是仍依赖狭窄任务集。
        - 客户集中度明细和管线走查。
      - - 轮次机制
        - 优先权栈、老股比例、反稀释条款以及任何投资人附函
        - 判断新资金的实际回报经济性。
        - 股权结构、投资意向书和主办律师备忘录。
      - - 竞争证明
        - 相对成熟网络安全平台和其他防务自主化厂商的赢单 / 输单数据
        - 说明任务叙事能否转化为真实采购决定。
        - 商业尽调、客户访谈和采购复盘。
    notes: 表中每一项都可能改变适用可比公司组和估值区间；没有一项只是形式问题。
