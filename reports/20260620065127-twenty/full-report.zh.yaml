  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与监督敞口
        blocks:
          - type: paragraph
            body: >-
              Twenty
              选择了网络安全里政策最敏感的位置之一：为美国及盟友任务伙伴构建私营进攻性网络系统。公司官网和新闻材料反复强调，它服务美国及其盟友，把网络态势从防御转向进攻，并且是在工业化网络战，而不只是销售防御软件。这一定位带来的监管栈，比普通企业安全厂商复杂得多。只要公司跨盟友边界或在涉密政府环境中部署工具、模型或支持流程，BIS
              出口规则、国务院防务贸易管制，以及 EO 14028
              时代的联邦网络承包要求都会发挥作用。国会听证记录又叠加了第二层风险：议员和专家证人正在积极讨论私营公司应在多大程度上参与主动网络防御和进攻行动；证词强调，法律与监督框架仍跟不上该领域的作战节奏。还有一个变量是，Twenty
              把盟友纳入其自然运营场景，同时又在构建 AI 赋能流程；European Commission 正在运行的 AI 监管框架说明，一旦部署或支持延伸到盟友司法辖区，非美国合规表面会很快贴上来。
