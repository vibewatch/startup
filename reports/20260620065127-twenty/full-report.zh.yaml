      - number: '4.2'
        title: 资本基础和前瞻资金用途
        blocks:
          - type: paragraph
            body: >-
              融资故事比经营故事清晰得多。Twenty 在 2025 年 11 月脱离隐身时披露总融资 $38 million，Series A 由 Caffeinated Capital 领投，General
              Catalyst 和 In-Q-Tel 参投。2026 年 6 月 17 日，Axios 报道其完成由 Accel 领投、估值 $1 billion 的 $100 million Series B，Friends
              & Family Capital、Point72 Ventures 和 Caffeinated Capital 也参与，披露融资总额达到 $138 million。Axios 还引用 CEO Joseph Lin
              的话称，新资金将用于加速研究开发和现有路线图。

              这类资金用途指引与公司姿态在战略上相符：任务集合依赖 AI、具备安全许可的工程人才和定制政府部署，往往会在产出公开 SaaS 式指标之前先消耗资本。财务问题不是 Twenty
              能否融资；它显然能。问题是，公司能否在下一次资本需求出现之前，把独角兽估值的 Series B 转化为持久、可重复、带利润率的收入。
