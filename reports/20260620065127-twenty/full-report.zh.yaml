  - id: TV002
    title: 正反论点表
    columns:
      - 视角
      - 正向论点
      - 反向论点
      - 什么会改变观点
    rows:
      - - 需求证明
        - 真实政府合同和任务工作案例显示买方确有拉动。
        - 可见授标仍可能只是小规模原型或上限金额，而不是耐久软件收入。
        - 合同金额、义务金额、续约节奏，以及与确认收入的桥接。
      - - 品类时点
        - AI 赋能的网络行动契合向机器速度行动推进的大趋势。
        - 品类热度可能跑在变现前面，在不透明政府市场尤其如此。
        - 可重复项目扩张，以及客户层面预算归属的证据。
      - - 背景血统
        - Expanse / Palo Alto 背景和强投资人支撑创始人可信度。
        - 背景有助于获客和招聘，但不能替代当前单位经济性。
        - 证明当前产品经济性按软件模型成立，而不只是承包商能力。
      - - 集中度
        - 深耕政府可形成防御性和任务贴近度。
        - 也可能带来采购摩擦、监管拖累和客户集中。
        - 机构组合、管线多样性，以及非试点续约数据。
      - - 当前价格
        - 如果当前合同只是切入更大经常性项目的早期楔子，$1B 估值可以被证明合理。
        - 如果没有 ARR、毛利率和 NRR 披露，同样的估值可能只是为战略叙事付溢价。
        - 私有 KPI 包和轮次条款披露。
    notes: 反向论点主要指向证据质量和合同经济性，而不是否认这一产品品类存在。
