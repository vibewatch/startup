  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、变现表面和确认限制
        blocks:
          - type: paragraph
            body: >-
              公开变现图景很窄，且以政府为中心。Twenty 称自己为美国军方和情报界构建端到端进攻性网络系统；公开可见、具名且带收入属性的验证点只有一项最高 $12.6 million 的 U.S. Cyber
              Command 合同，以及一项约 $240,000 的 Navy 研究合同。这足以说明收入并非纯假设，但不足以判断 Twenty
              销售的是经常性软件、按里程碑交付、原型服务，还是三者组合。本文审阅的公开来源没有披露标价、最低合同规模、合同期限、续约结构、专业服务组合、收入确认政策、总留存、净留存或按客户确认的收入。

              核心财务谨慎点是，授标语言和收入语言不是一回事。Forbes 报道称 Cyber Command 合同价值最高 $12.6 million，这传递的是上限或最高项目价值，而不是已经收到的现金或已经按 GAAP
              确认的收入。Navy 授标规模小得多，且看起来偏研究导向，可能是早期切入点，而非可重复收入线。DefenseScoop 关于 Cyber Command 首个 POM
              支持预算和增强预算控制权的报道也显示，从早期胜利扩展到规模收入，很可能需要穿过集中化、正式采购渠道，而不是快速商业席位扩张。公开层面最有支撑的结论是，Twenty
              的收入模型似乎由任务软件和研究合同驱动，但收入组合和确认时点仍未披露。
