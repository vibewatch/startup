  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 定价背景与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Twenty 有真实融资信号，也有真实需求信号，但仍没有公开运营模型。文件中最强的定价事实是 2026 年 6 月 17 日的 Series B：Axios 称公司以 $1 billion 估值融资 $100
              million，并把已披露总融资推至 $138 million。历史基线也足够清楚：2025 年 11 月隐身期结束公告披露总融资 $38 million，并把业务与 Caffeinated
              Capital、General Catalyst 和 In-Q-Tel 绑定。真正不清楚的是投资人通常会在这两个点之间核保的几乎所有东西。已审阅公开来源没有披露
              ARR、确认收入、毛利率、NRR、客户数量、待履约订单，或软件与交付之间的结构。即使文件中最好的需求证明——Cyber Command 最高 $12.6 million 的合同，以及另一个 $240,000
              Navy 研究授标——更多证明牵引，而不是经济性。“最高”这个词很关键：它指向上限价值，不是已经证明的确认收入。仅看公开证据，这轮融资是真实的，但底层收入引擎仍不透明。
