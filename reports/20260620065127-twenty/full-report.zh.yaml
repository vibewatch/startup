      - number: '6.2'
        title: 具名政府客户验证
        blocks:
          - type: paragraph
            body: >
              最强采用验证来自公开合同引用，而不是客户标识页面或客户证言。Forbes 2025 年 11 月报道称，根据联邦合同记录，Twenty 当年夏天签下一项最高 $12.6 million 的 U.S. Cyber
              Command 合同，并获得一项 $240,000 的 Navy 研究合同。Tectonic 在 Twenty 脱离隐身四天后重复了同样数字，Bloomberg 同期报道则称公司拥有为美国军方黑客提供 AI
              工具的合同。到 2026 年 6 月，Axios 仍把 Twenty
              描述为持有美国军方和情报界合同，说明政府牵引延续到了最初隐身发布叙事之后。不过，验证质量参差不齐。抓取材料没有包含合同编号、授标办公室、履约期、期权结构或工作说明书。Cyber Command 数字被明确表述为
              “最高 $12.6 million”，强烈暗示这是上限值，而非已全额义务化收入；Navy 授标也只被描述为研究合同，不是规模化作战部署。因此，本章支持真实买方牵引，同时对范围、成熟度和已确认收入保持谨慎。
