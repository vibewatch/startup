    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段和产品定位
        blocks:
          - type: paragraph
            body: >-
              Twenty Technologies, Inc. 把自己定位为进攻优先的国家安全软件公司，而不是传统防御型网络安全厂商。公开材料称，公司成立于 2024
              年，总部位于弗吉尼亚州阿灵顿，使命是为美国及其盟友交付工业级网络能力。公司称其打造端到端进攻性网络系统，把精英操作员的技战法编码进软件，自动化过去需要数周手工完成的工作，并让分析师并行追踪多个目标，同时人类仍掌控关键决策。商业姿态仍是私营、风投支持，但从
              2025 年 11 月脱离隐身到 2026 年 6 月 Series B，阶段已明显变化：Twenty
              从一个刚公开、有早期政府牵引的国防科技创业公司，变成一家独角兽估值公司，并公开主张进攻性网络应被视为核心国家任务领域。
