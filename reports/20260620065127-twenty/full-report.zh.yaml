        title: 资本充足性、公开牵引和缺失的私有指标
        blocks:
          - type: paragraph
            body: >-
              资本充足性问题无法仅靠公开证据回答。Twenty
              为一家成立两年的公司披露了很大的风险资本基础，也至少有一些政府合同牵引，但没有披露手头现金、月度烧钱、跑道、收入、ARR、毛利率、客户数、扩张指标、积压订单、递延收入，或任何超出预告式表述的管线规模。若只是把
              Navy 授标加到 Cyber Command 上限上，可见合同信号最多合计 $12.84 million；即便这个上限也不应被当作已确认收入。

              这留下两个同时成立的事实。第一，Twenty
              有可信证据显示，严苛政府客户群体内部存在产品市场拉力。第二，没有公开依据可以断定公司已能自我供血、接近盈亏平衡，或能按管理层计划的时间线避免下一轮融资。因此，本章必须把烧钱、跑道和利润率保留为明确尽调缺口，而不是反向工程出猜测。
