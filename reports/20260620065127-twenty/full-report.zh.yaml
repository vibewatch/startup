      - number: '5.3'
        title: 相对企业工具的差异化和成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Twenty 最强的公开差异化在于范围。Xpanse 和 runZero 专注发现和攻击面可视化。Metasploit 专注利用和钓鱼生产力。AttackIQ 专注威胁知情验证。Elastic
              提供了相近的人类治理自动化类比，但重心是防御型 SOC 工作流，而非进攻性任务执行。Twenty
              的主张是，它把这些动作中的若干部分结合成一个面向美国机构的端到端进攻性工作流。这在战略上有吸引力，因为操作员训练昂贵，战备脆弱，AI
              驱动攻击正在加速。也正因此，执行门槛很高。一家公司若试图统一发现、路径规划、决策支持和交付，就会一次性继承多个产品的集成复杂度。公开成熟度信号显示的是动量，而非充分验证：2024 年隐身成立，2025
              年末公开亮相，2026 年融资轮指定用于研究和工程。仍缺的是把产品叙事与生产就绪度区分开的证据——基准、发布证据、集成文档和第三方验证。
