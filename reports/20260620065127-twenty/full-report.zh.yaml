      - number: '7.2'
        title: 作战安全、控制与人员脆弱性
        blocks:
          - type: paragraph
            body: >-
              公司还暴露在进攻性网络行动特有的失效模式中，而不是普通 SaaS 执行问题。公开来源描述了 AI agent 扫描大量目标、攻击路径工具、persona
              开发工作，以及机器速度流程；这些流程仍把人保留在关键决策里。这降低了一类自主性风险，但没有消除保管链风险、模型误用风险，也没有消除工具泄露后被研究并反用于美国目标的可能。行业和政府来源都警告，AI
              正在压缩攻击者时间线、加快漏洞发现；CISA 和 MITRE 也强调，防御方面对的是持续演进的威胁行为体和技术集。NIST
              的网络供应链风险管理项目又增加了一项相关负担；在联邦敏感环境中，信任不只取决于模型行为，也取决于软件组件、供应商和上游依赖如何治理。人力侧，Twenty 的招聘栏和职业页面显示，公司高度依赖拥有 TS/SCI
              许可的数据工程师、前置部署可靠性人员、进攻研究工程师和任务架构师。DefenseScoop 关于操作员训练成本和战备流失的报道说明，这类人才库搭建又贵又慢，意味着执行瓶颈可能和软件一样卡在人上。
