companyProfile:
  summary: >
    Twenty Technologies, Inc. 是一家位于弗吉尼亚州阿灵顿的私营进攻性网络创业公司，成立于 2024 年，由来自军事网络部队以及 Expanse / Palo Alto Networks
    生态的人士和高管领导。公司面向美国军方和情报客户，销售 AI 赋能、由人类治理的任务软件，用于目标发现、攻击路径准备和持续网络行动。公开证据支持其已有真实合同牵引，包括一项据称最高 $12.6 million 的 U.S.
    Cyber Command 合同，以及另一项 Navy 研究合同；2026-06-17 的 Series B 之后，披露融资总额达到 $138 million，估值 $1
    billion。缺口仍是后期投资判断所需的经营数据：收入、利润率、客户集中度、续约和治理细节大多仍未披露。
