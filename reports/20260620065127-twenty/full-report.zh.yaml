        title: 政府牵引和政策背景
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Twenty 已不只是概念公司。Axios 称公司与美国军方和情报界有合同，Tectonic Defense 和 Forbes 则报告了更具体的授标信号：一项最高 $12.6 million 的
