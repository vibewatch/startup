              小组委员会作证，并于 2026 年 3 月出席 Reagan Institute 的 National Security Innovation Base
              Summit，显示出一家成立两年的创业公司少见的政策触达。同时，市场开启叙事与华盛顿转向更进攻性网络姿态的更大趋势密不可分，也解释了公司为何在那个时间点脱离隐身。因此，商业机会不仅取决于产品执行，也取决于政治层面对把敏感任务集合部分外包给私营供应商的持续支持。
