  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和用户工作流
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Twenty 销售的是面向进攻性网络操作员的任务工作流，而不是传统企业安全
              SKU。公司自有语言围绕工业化美国网络战武器库、构建赢得战争的软件，以及把数周手工工作转化为跨数百个目标的持续行动。第三方报道补上了缺失的工作流细节。Tectonic 描述了 AI
              代理扫描大量目标、识别弱点，并把拟议行动路由给人类操作员。Series B 相关转载描述了面向军方和情报操作员的 AI
              赋能端到端系统，并强调每一次进攻行动仍以人类判断为核心。招聘信号强化了这幅图景：公司在招聘应用 AI 工程师、后端和 DevSecOps
              人才、前线部署分析师、任务架构师和任务部署负责人。这种组合意味着产品把自动化、操作员界面和嵌入客户的部署支持结合在一起。新出现的职位页面让这一推断更具体：一个高级后端岗位明确提到实时操作信号、高吞吐 API 和云
              / 本地任务软件，一个 DevOps 岗位则描述 AWS 基础设施、单租户和多租户环境、Terraform 和可观测性。最重要的提醒是，Twenty
