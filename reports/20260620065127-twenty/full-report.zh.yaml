      - number: '5.4'
        title: 信任、控制姿态和开放风险
        blocks:
          - type: paragraph
            body: >-
              最好的公开信任信号也最窄：多个来源称，人类仍控制关键决策，部署受控且与任务一致。这是必要条件，但还不够。公开层面仍没有控制包显示模型如何评估、权限如何执行、日志如何审阅，或平台在机密或隔离环境中如何运行。最具体的新公开线索是一个
              DevOps 岗位，写明单租户和多租户 AWS 环境、Terraform 管理的基础设施、IAM 和网络安全控制、可观测性以及运行手册。因此，招聘持证数据工程师和可靠性 /
              基础设施岗位强烈暗示，敏感部署是一级产品关切，即便隔离区拓扑本身仍不公开。监管背景也重要。出口管制制度和围绕进攻性网络的更广泛政策辩论，意味着这个品类不只是技术难；它还暴露于监督、升级和扩散担忧。国会证词和
              Atlantic Council 研究都强化了这种怀疑。结果是，本章对战略需求高度确信，对产品成熟度中等确信。Twenty
              的方向像一个可信任务平台，但其公开披露仍太薄，无法在没有私有尽调材料的情况下承销韧性、安全控制和互操作性。
