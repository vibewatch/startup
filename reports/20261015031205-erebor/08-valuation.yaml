  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-proof
      missingEvidence: Audited or board-level revenue, margin, loss, and loan-yield data by product line.
      whyItMatters: Without earnings evidence, the public pool cannot support a conventional multiple-based valuation case or target return range.
      diligencePath: Request the latest management accounts, call-report detail, and product-level revenue bridge before revisiting price.
    - type: conflicting-data
      severity: material
      topic: capitalization-reconciliation
      missingEvidence: A reconciled cap-table and financing history that explains the difference between disclosed funding, launch capital, and secondary-data totals.
      whyItMatters: Entry pricing, dilution, and preference analysis all change if the public totals are measuring different instruments or different dates.
      diligencePath: Obtain executed round documents, a capitalization table, and management reconciliation of equity, commitments, and regulatory capital.
    - type: private-evidence-only
      severity: material
      topic: deposit-quality
      missingEvidence: Deposit concentration, uninsured-balance share, client cohort mix, and churn or repricing behavior after the stablecoin policy change.
      whyItMatters: Wholesale and concentrated balances can support fast growth but can also reverse quickly and pressure both liquidity and valuation.
      diligencePath: Request customer concentration schedules, liquidity stress testing, and post-policy-change deposit retention data from management.
