    title: Recommendation summary table
    columns: [Decision factor, Assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Wait for private diligence rather than underwriting momentum from public headlines.]
      - [Confidence, medium, "Demand and capital-raising evidence exists, but valuation evidence is inconsistent and operating data is thin."]
      - [Risk rating, high, "Funding precision, deposit stickiness, and product-execution risk can all move entry value materially."]
      - [Valuation stance, expensive, Rumored 2026 pricing runs ahead of publicly supported revenue and earnings proof.]
      - [Entry discipline, milestone-based, "Require closed-round terms, revenue disclosure, and balance-sheet quality evidence before paying up."]
    notes: Public-only recommendation synthesized from retained financing, balance-sheet, and product-risk sources; no audited revenue, loss, or exit-value disclosure is available in the assigned pool.
    claimRefs: [CV004, CV006, CV012, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Current support, What would change the view]
    rows:
      - ["Thesis: real demand exists", "Deposits reportedly passed $7B and the company continues to attract large financing interest", "We would strengthen this view if private diligence confirms customer mix, deposit concentration, and durable fee income."]
      - ["Thesis: public terms do not show aggressive preference overhang", "Forge lists the Series A as 1.0x non-participating and non-cumulative", "We would upgrade if full cap-table documents confirm those terms and show limited seniority stacking in newer securities."]
      - ["Anti-thesis: price discovery is not settled", "Public references span disclosed funding at $350M, tracker totals near $397M-$443M, and a $635Mn capital figure at launch", "A signed round close with full economics would remove much of this ambiguity."]
      - ["Anti-thesis: live product economics are still being tuned", "Erebor reportedly removed free stablecoin conversions for smaller users after arbitrage activity", "A stable fee schedule plus evidence of recurring net revenue would reduce this concern."]
    notes: Support and anti-thesis rows use only retained public evidence; valuation-comparison rows are not normalized GAAP or regulatory filings.
    claimRefs: [CV008, CV010, CV011, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "The 2026 raise closes near the rumored $1.5B / $8B pre-money range and deposit growth converts into durable fee and lending income", "Upside exists only if private data shows that the higher round price is backed by earnings power rather than balance-sheet scale alone", "Revenue opacity, deposit concentration, and execution on crypto banking controls", "Reported demand and capital access continue to improve."]
      - [Base, "Erebor keeps growing but outside investors still lack public revenue, loss, and credit metrics", "The right move is to track milestones and wait because available public data does not support a clean multiple-based underwriting case", "Extended ambiguity on round terms and on how quickly deposits can be monetized", "Most directly supported by the current retained pool."]
      - [Bear, "The round slips, reprices, or closes on weaker terms while product repricing and wholesale-deposit volatility erode the premium narrative", "Downside comes from multiple compression against lower secondary marks plus a harder path to profitable growth", "Funding-market cooling, mobile deposits, and further evidence of product frictions", "More likely if public momentum fades before private economics are validated."]
    notes: No numeric target range is presented because the retained pool does not disclose revenue, losses, or a comparable public valuation basis strong enough to support precise multiple math.
    claimRefs: [CV004, CV005, CV008, CV009, CV010, CV012, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence links strong demand and capital need to a still expensive, not-yet-de-risked entry.
    data:
      nodes:
        - id: demand
          label: Demand proof
          value: Deposits reportedly >$7B with 500+ new customers in the prior quarter.
          tone: positive
        - id: round
          label: 2026 round chatter
          value: Commentary points to a prospective $1.5B raise at an $8B pre-money valuation.
          tone: warning
        - id: divergence
          label: Valuation divergence
          value: Forge shows a far lower $2.28B mark than late-2026 round headlines.
          tone: warning
        - id: capital
          label: Capital constraint
          value: FDIC conditions and 12% leverage math make new equity strategically important.
          tone: warning
        - id: execution
          label: Execution risk
          value: Stablecoin conversion pricing had to be reset after arbitrage pressure.
          tone: negative
        - id: decision
          label: Decision
          value: Research more; treat current public pricing as expensive until private diligence closes the proof gap.
          tone: warning
      edges:
        - { from: demand, to: round, label: supports fundraising interest }
        - { from: round, to: divergence, label: still lacks clean price confirmation }
        - { from: divergence, to: capital, label: public marks and capital needs must reconcile }
        - { from: capital, to: execution, label: balance-sheet growth alone does not de-risk the model }
        - { from: execution, to: decision, label: entry should wait for stronger proof }
    claimRefs: [CV004, CV006, CV007, CV008, CV010, CV012, CV016]
callouts:
  - calloutType: recommendation
    title: Track, do not chase the rumored 2026 price
    body: The retained pool can support a watchlist stance, but it does not justify paying an $8B-style price without private revenue, loss, and round-term diligence.
    claimRefs: [CV004, CV006, CV012, CV016]
  - calloutType: risk
    title: The most visible thesis-break is not demand, but monetization quality
    body: Rapid deposit accumulation helps the story, yet public evidence already shows product repricing and wholesale-balance-sheet questions that could compress valuation if earnings lag.
    claimRefs: [CV008, CV009, CV010, CV016]
  - calloutType: assumption
    title: The upgrade path requires private proof, not another headline
    body: A stronger view would need validated round documents, deposit concentration data, revenue mix, and credit or fee economics that turn scale into durable returns.
    claimRefs: [CV007, CV012, CV014, CV016]
