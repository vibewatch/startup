schemaVersion: report-v2
artifact: company-overview
slug: erebor
runDate: 2026-10-15
company:
  name: Erebor
chapter:
  number: 1
  title: Company Overview
  summary: >
    Erebor appears to have moved from a 2025 stealth-launch narrative into a live,
    fast-scaling niche bank unusually quickly: third-party sources converge on a
    Columbus HQ, a $350M December 2025 financing at a $4.35B post-money valuation,
    and October 2026 reporting that deposits passed $7B while a larger 2026 round
    was still being marketed rather than closed. The same evidence also shows why
    later chapters need caution: founder attribution conflicts across sources,
    product economics remain thinly disclosed, and a stablecoin-conversion perk had
    to be tightened after traders exploited it.
sections:
  - id: identity-and-positioning
    title: Identity and operating scope
    body: >
      Erebor is consistently described across third-party profiles as a digital,
      nationally chartered or charter-seeking bank built for the "innovation
      economy" rather than a mass-market neobank. The recurring target segments are
      startups, crypto firms, AI companies, defense contractors, and other
      high-growth businesses that traditional banks have often treated as difficult
      or higher-risk customers. Public profiles line up on a 2025 founding and a
      Columbus, Ohio headquarters, but they also describe a wider operating
      footprint that includes New York and, in one profile, Newport Beach with no
      branch network. That mix suggests Erebor's core identity is a digitally
      distributed specialty bank whose differentiation depends more on sector
      willingness and treasury rails than on physical distribution.
    claimRefs: [CO001, CO002, CO003, CO004]
    figureRefs: [FO001]
  - id: leadership-governance-and-stakeholders
    title: Leadership, governance, and key stakeholders
    body: >
      The management picture is clearer than the founder record. Multiple sources
      identify Jacob Hirshman and Owen Rapaport as the day-to-day co-CEOs, while
      Palmer Luckey and Joe Lonsdale are framed as high-profile founders, sponsors,
      or board-level figures whose networks materially shape Erebor's market access
      and narrative credibility. That concentration is a double-edged sword: it
      likely helps customer acquisition and capital formation in crypto, defense,
      and venture circles, but it also creates visible key-person dependence around
      a small set of operators and celebrity backers. A further wrinkle is that
      FundedIQ lists Aaron Pelz and Rapaport as founders, so the exact formal
      founder roster still needs documentary confirmation before it is treated as
      settled fact in later diligence work.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-milestones
    title: Funding, scale signals, and operating proof
    body: >
      The strongest closed financing evidence still points to December 2025, when
      sources aligned around a $350M round at a $4.35B post-money valuation. Public
      reporting later moved the narrative forward but not all the way to a new
      priced mark: FundedIQ records an additional March 2026 undisclosed round,
      while QuantLogix and a fintech newsletter both describe a much larger 2026
      raise at an $8B pre-money valuation as still pending rather than closed. The
      most important operating signal is October 2026 reporting that deposits
      passed $7B after 500-plus customers were added in the prior quarter, which
      indicates real market uptake but also a likely wholesale-deposit profile with
      large balances and liquidity sensitivity. The September 2026 stablecoin
      arbitrage episode reinforces that Erebor already has product-market pull in
      the crypto workflow, yet still lacks public revenue, lending-mix, and exact
      headcount disclosure that would show how durable that momentum really is.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO001]
