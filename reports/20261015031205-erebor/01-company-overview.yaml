          claimRefs: [CO008]
        - date: "Feb 2026"
          label: "Bank opens for business"
          detail: "Fintech Brain Food and Silicon Valley Invest Club both describe Erebor as having opened in February 2026."
          tone: positive
          claimRefs: [CO004, CO010]
        - date: "Mar 2026"
          label: "Undisclosed follow-on round appears in trackers"
          detail: "FundedIQ records a March 2026 round but excludes it from the disclosed funding total because no amount was reported."
          tone: neutral
          claimRefs: [CO009]
        - date: "Aug 2026"
