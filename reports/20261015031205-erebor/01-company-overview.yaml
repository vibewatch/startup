          detail: "QuantLogix and fintech reporting describe a much larger 2026 financing in progress, but QuantLogix explicitly keeps the December 2025 mark because the round was not yet closed."
          tone: opportunity
          claimRefs: [CO011]
        - date: "Sep 2026"
          label: "Stablecoin conversion perk is tightened"
          detail: "After traders reportedly arbitraged Erebor's fee-free redemptions, the bank moved to fees, limits, and deposit requirements."
          tone: risk
          claimRefs: [CO012]
        - date: "Oct 2026"
          label: "Deposits reportedly pass $7B"
          detail: "FT-cited reporting said Erebor had added more than $3B and 500-plus customers in the prior quarter, pushing deposits past $7B."
          tone: high
