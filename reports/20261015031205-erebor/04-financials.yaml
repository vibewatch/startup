schemaVersion: report-v2
artifact: financials
slug: erebor
runDate: 2026-10-15
company:
  name: Erebor
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence suggests Erebor has built a concentrated, deposit-led commercial banking
    model: Sacra estimates $112M of annualized revenue in July 2026, with 68% from interest
    income and 32% from fees, while August 2026 press reports say deposits had reached $4.6B
    and a new $1.5B financing was being discussed. The core underwriting blocker is that
    public sources still do not disclose cash, burn, gross margin, CAC, or depositor
    concentration in enough detail to judge capital adequacy or unit economics with high
    confidence.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: |-
      The strongest public read-through is that Erebor monetizes a regulated balance sheet, not
      a lightweight software subscription. Sacra estimates the bank reached $112M of annualized
      revenue in July 2026, up from $31M in March, with deposits growing to $4.6B by the end of
      July after launch in February 2026. In Sacra's framing, 68% of revenue comes from interest
      income on deposits and 32% from noninterest lines such as payment fees, account fees, and
      API/BaaS fees. That mix implies Erebor's economics are driven first by deposit capture and
      asset deployment, then by fee attachment.

      The customer shape also matters. Sacra describes roughly 500-600 large, capital-intensive
      customers averaging about $7M on deposit and roughly $175K in annualized revenue per
      customer. That is a narrow-and-deep account base rather than a self-serve SMB funnel. It
      may support higher revenue per relationship, but it also means the business is less proven
      on breadth, and public traction claims remain heavily dependent on a small number of large
      accounts plus third-party estimates rather than audited disclosures.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, monetization, and unit-economics visibility
    body: |-
      Public pricing visibility is limited. The reviewed pool does not expose a clean consumer- or
      SME-style price card for business banking, treasury, lending, or API products. Instead, the
      best public evidence comes from monetization proxies: deposit-driven spread income, average
      revenue per customer, and a reported change to stablecoin-conversion pricing after abuse by
      trading firms. BeInCrypto reported that Erebor initially let customers convert USDC and
      USDT at par for free, then added fees, limits, and deposit requirements after professional
      traders exploited the offer. That episode is adverse evidence that at least one fee policy
      started as a growth incentive rather than a settled margin-positive product.

      The same limitation shows up across classic unit-economics questions. Public sources give
      deposit, revenue, and some capital-ratio proxies, but not CAC, payback, gross margin, loan
      yields, charge-offs, or contribution margin by product. As a result, public financial work
      can describe the model and direction of travel, but it cannot underwrite realized pricing
      quality or operating leverage without private diligence.
    claimRefs: [CI003, CI004, CI010, CI011, CI014, CI015]
    tableRefs: [TI002, TI003]
  - id: capital-position-and-financing-dependency
    title: Capital position and financing dependency
    body: |-
      Public funding evidence is directionally positive but numerically messy. FundedIQ says
      Erebor has raised $350M across two rounds on record, with the March 2026 round undisclosed
      and excluded from the total; Multiples similarly anchors the December 2025 valuation at
      about $4.3B and leaves the later round amount blank. Sacra, by contrast, estimates total
      funding raised at $635M as of mid-2026. The most defensible conclusion is not a precise
      lifetime-funding number, but that public databases disagree because they treat undisclosed
      round amounts differently.

      More current press coverage points to continued external capital dependence. Retail Banker
      International and Traders Union both reported in August 2026 that Erebor was in advanced
      talks to raise about $1.5B at roughly an $8B valuation, while also citing deposits of $4.6B
      and annualized recurring revenue above $100M after February regulatory approval. Those are
      useful signals that fundraising markets may still support the company, but they are not the
      same as cash on hand, runway, or disclosed burn. Public sources also do not quantify debt
      facilities, minimum operating capital thresholds, or the funding needed to absorb credit or
      compliance shocks.
    claimRefs: [CI006, CI007, CI008, CI009, CI012, CI013, CI016]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: |-
      The public case for Erebor is that a focused chartered-bank model has found early traction:
      large deposits, fast estimated revenue growth, and investor willingness to discuss another
      very large round within months of launch. The public case against underwriting too quickly
      is that nearly every investor-critical margin and capital question remains private. Revenue
      quality appears more deposit-spread-driven than software-recurring, noninterest fee lines
      are only partially described, and at least one stablecoin pricing tactic had to be revised
      after market participants arbitraged it.

      The practical verdict is that Erebor looks financially credible enough to merit continued
      diligence, but not yet transparent enough for conviction on revenue durability, margin path,
      or capital intensity. Private diligence should focus on NIM and asset-yield bridge, loan and
      reserve performance, customer concentration, insured versus uninsured deposit mix by cohort,
      operating burn, and post-fundraise regulatory capital planning.
    claimRefs: [CI005, CI011, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: insight
    title: Deposit-led, not software-led
    body: >-
      The reviewed evidence points to Erebor behaving more like a concentrated commercial bank
      with tech-native distribution than like a pure SaaS fintech: deposit balances and interest
      spread appear to drive the majority of current revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
  - calloutType: risk
    title: Capital adequacy is still a private-diligence question
    body: >-
      Public sources support fundraising momentum and some balance-sheet proxies, but they do not
      disclose cash, burn, gross margin, or customer concentration in enough detail to underwrite
      runway or downside absorption.
    claimRefs: [CI008, CI012, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Interest income
        - Deploy customer deposits into short-duration bonds and loans and earn spread income
        - Revenue share
        - 68% of revenue per Sacra's July 2026 estimate
        - Third-party estimate anchored to deposit growth, not audited disclosure
        - Provide NIM, asset-yield, and cost-of-funds bridge
      - - Payment and account fees
        - Fees on wires, ACH, accounts, and treasury operations
        - Revenue share
        - Part of the 32% noninterest bucket; no public breakout
        - Directionally supported, not separately quantified
        - Provide fee schedule, take rate, and mix by product
      - - API / BaaS fees
        - Banking backend fees from API customers using Erebor infrastructure
        - Revenue share
        - Minority component within the 32% noninterest bucket
        - Public customer examples exist, but revenue contribution is undisclosed
        - Provide API customer count, volumes, and gross margin
      - - Specialized credit
        - Loans against GPUs, government contracts, and digital assets
        - Loan yield / balances
        - Product capability is public, but no revenue or balance-sheet mix is disclosed
        - Product exists; financial contribution unverified
        - Provide loan-book size, weighted yield, losses, and reserve policy
    notes: >-
      Mix and status combine third-party estimates with product descriptions; null or missing
      breakouts indicate no underwriting-grade public disclosure in the assigned source pool.
    claimRefs: [CI003, CI005, CI011, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - Current status
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Stablecoin conversion at par
        - Initially offered at face value for USDC and USDT; later moved to volume-based fees and limits
        - Realized economics turned negative enough to trigger policy changes
        - Exact fee schedule, thresholds, and customer eligibility remain undisclosed
        - BeInCrypto
      - - Average revenue per customer
        - Approximately $175K annualized revenue per customer on roughly $7M average deposits
        - Realized proxy, not a published price list
        - Depends on deposit balances and account mix rather than a fixed subscription fee
        - Sacra
      - - Deposit-spread monetization
        - 68% of revenue attributed to interest income
        - Realized mix proxy, not a published contract term
        - No public NIM, funding cost, or asset-yield disclosure
        - Sacra
      - - API / BaaS fees
        - Minority share of revenue within the 32% noninterest bucket
        - Implied realized monetization
        - No public price card, rev-share terms, or implementation fees in reviewed sources
        - Sacra
    notes: >-
      This table mixes public policy changes and monetization proxies because the assigned public
      evidence does not include a full Erebor pricing schedule.
    claimRefs: [CI003, CI004, CI010]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Annualized revenue (July 2026)
        - $112M estimate
        - Medium
        - Best public top-line traction proxy
        - Reconcile to management reporting, GAAP revenue, and quarter-to-date run rate
      - - Deposits (end-July 2026)
        - $4.6B
        - Medium
        - Main input to balance-sheet-driven revenue
        - Break out insured versus uninsured and top-20 depositor concentration
      - - Average revenue per customer
        - ~$175K annualized
        - Medium
        - Indicates high-value, concentrated relationships rather than self-serve economics
        - Provide customer count, ACV distribution, and cohort retention
      - - Insured deposit share
        - 77%
        - Medium
        - Signals liability stability and depositor risk mix
        - Confirm methodology, cohort split, and month-end trend
      - - Tier 1 leverage ratio
        - 12%
        - Medium
        - Proxy for capital cushion before private cash-flow disclosure
        - Provide current ratio, target band, and stress scenario minima
      - - Gross margin
        - null
        - Low
        - Needed to distinguish high-revenue optics from true earnings power
        - Provide margin by product line and by interest vs noninterest revenue
      - - CAC / payback
        - null
        - Low
        - Required to judge scaling efficiency and sales dependence
        - Provide CAC by channel, payback, and sales-cycle length
      - - Cash runway
        - null
        - Low
        - Required to assess financing dependency and next-round urgency
        - Provide cash, monthly burn, debt facilities, and use of proceeds
      - - Disclosed funding raised
        - $350M across two rounds on record; March 2026 amount undisclosed
        - Medium
        - Sets a floor for known external capital but not current cash availability
        - Reconcile all round closes, secondaries, and net cash proceeds
      - - Estimated lifetime funding
        - $635M as of mid-2026 per Sacra
        - Medium
        - Shows that public databases may omit undisclosed round amounts
        - Provide cap table and round-by-round use-of-proceeds schedule
      - - Latest valuation signal
        - ~$8B pre-money in August 2026 fundraising talks
        - Medium
        - Useful for financing appetite but not for liquidity or loss absorption
        - Provide signed term sheet status, investor concentration, and close timing
    notes: >-
      Public quantitative support is strongest for deposits, estimated annualized revenue, and
      financing signals; null entries mark metrics not disclosed in the assigned source pool and
      therefore become diligence asks rather than invented estimates.
    claimRefs: [CI001, CI002, CI004, CI006, CI008, CI013, CI014, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a deposit-led monetization chain, while gross profit and cash-flow
      conversion remain undisclosed.
    data:
      nodes:
        - id: customer-base
          label: Concentrated customer base
          value: 500-600 large accounts
          context: Capital-intensive AI, defense, crypto, and related customers
          claimRefs: [CI004]
        - id: deposits
          label: Large average balances
          value: "~$7M average deposits per customer"
          context: Narrow-and-deep account economics rather than broad self-serve volume
          claimRefs: [CI004]
        - id: deposit-base
          label: Deposit base scales quickly
          value: $4.6B deposits by end-July 2026
          context: Main operating input to interest-driven revenue
          claimRefs: [CI002, CI009]
        - id: interest-income
          label: Interest income dominates
          value: 68% of revenue
          context: Spread income appears to be the primary revenue engine
          claimRefs: [CI003]
        - id: fee-income
          label: Fees provide secondary monetization
          value: 32% of revenue
          context: Payments, account, and API/BaaS fees are disclosed only in aggregate
          claimRefs: [CI003]
        - id: margin-visibility
          label: Gross profit and runway still private
          value: Undisclosed
          context: Public sources do not disclose gross margin, CAC, burn, or runway
          claimRefs: [CI014]
    approximationNotes: >-
      Node values mix third-party estimates with public-source summaries and intentionally stop
      before gross profit because no assigned source quantifies that step.
    claimRefs: [CI002, CI003, CI004, CI014]
