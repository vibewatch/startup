  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: Segment-level SAM or SOM by vertical, geography, and product line, plus management's definition of which deposit and payments pools it can realistically capture.
      whyItMatters: Without a disclosed segmentation model, current evidence validates realized demand but does not bound the durable market size or support a valuation-through-penetration argument.
      diligencePath: Request management's internal market map, segmented pipeline, and product-level revenue bridge; reconcile it to disclosed deposits, customer counts, and underwriting capacity.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Customer count by segment, top-depositor concentration, insured versus uninsured balances, and retention or cohort data for the first operating quarters.
      whyItMatters: The reported growth could reflect a durable operating-account franchise or a narrower set of large, rate-sensitive institutional balances, which has very different implications for adoption quality and valuation.
      diligencePath: Obtain internal deposit-concentration reports, cohort retention, and segment mix by balances and product usage; compare them with call-report trends and fee changes after the stablecoin conversion incident.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM003]
