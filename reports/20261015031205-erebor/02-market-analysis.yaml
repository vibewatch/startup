          claimRefs: [CM006, CM013]
    approximationNotes: "This is not a literal TAM-to-SOM derivation; it mixes adjacent-market, balance-sheet, and adoption-signal evidence because public segment-level SAM/SOM disclosures are unavailable."
    claimRefs: [CM005, CM006, CM007, CM008, CM011, CM013, CM014]
