      - number: '2.3'
        title: 规模测算视角、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              现有规模证据是一组不完整的视角，而非干净的市场模型。其中一个相邻视角是稳定币规模：Cryptonews 引用 BIS 估计，2026 年 5 月稳定币市值约为
              $320B，这勾勒了更广泛的数字美元结算池，但没有测量 Erebor 的银行收入机会。更接近的视角是已观察到的资产负债表采用。 BankRegReports 显示第二季度存款
              $4.06B，核心存款与经纪存款几乎各半；Cryptonews 则报道现金和同业余额 $4.17B，而总贷款仅 $77.8M。 Fintech Brain Food 认为 Erebor 的 12%
              杠杆约束意味着存款增长可能迫使公司继续融资；BeInCrypto 报道，专业交易员套利后，一项早期稳定币功能很快
              加上费用、限额和存款要求重新定价。合在一起看，这些事实说明采用可以真实且快速，但尚未证明市场份额具有黏性、多元化或高利润。
