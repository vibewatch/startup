      - number: '4.3'
        title: 资本状况与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开融资证据方向积极，但数字混乱。FundedIQ 称 Erebor 有两轮已记录融资，合计 $350M；2026 年 3 月的一轮金额未披露，且未计入总额。 Multiples 同样将 2025 年 12
              月估值锚定在约 $4.3B，并把之后一轮金额留空。相比之下，Sacra 估计截至 2026 年中累计融资 $635M。 最稳妥的结论不是给出精确的累计融资数，而是公开数据库因对未披露轮次金额的处理不同而存在分歧。

              更新的媒体报道指向持续依赖外部资本。Retail Banker International 和 Traders Union 都在 2026 年 8 月报道，Erebor 正就约 $1.5B、 约 $8B
              估值的融资进行深入谈判，同时引用 $4.6B 存款和 2 月监管批准后的 $100M 以上年化经常性收入。这些是融资市场仍可能支持公司的有用信号，
              但不等于手头现金、资金续航或已披露烧钱。公开来源也没有量化债务额度、最低运营资本门槛，或吸收信用及合规冲击所需的资金。
