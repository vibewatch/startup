              乐观情景很直接：Erebor 以接近传闻中的 2026 年融资完成交易，把快速流入的存款转化为黏性的收费和放贷收入，并证明其服务加密及前沿科技客户时，
              摩擦点少于传统机构。悲观情景也已在公开证据中出现。BeInCrypto 报道稳定币赎回定价遭到套利，随后加入费用和限额重新定价；Fintech Brain Food
              将存款基础描述为批发型，因此比表面增长本身暗示的更容易流动。由于 Silicon Valley Investclub 仍称除融资和估值参考外，公开财务数字不可得， 正确的收尾姿态是在从审慎的继续跟踪 /
              继续研究建议升级之前，要求收入组合、存款集中度、信贷政策和最终融资条款的私下证据。
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪，不要追逐传闻中的 2026 年价格
            body: 保留资料池支持观察名单立场，但没有私下收入、损失和融资条款尽调，不足以支持按 $8B 级别价格支付。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV012
              - CV016
          - type: callout
            title: 最明显的论点破坏点不是需求，而是变现质量
            body: 存款快速积累有助于故事，但公开证据已经显示产品重新定价和批发型资产负债表问题；如果盈利落后，估值可能因此承压。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV016
          - type: callout
            title: 升级路径需要私下证明，而不是又一个醒目标题
            body: 更强的判断需要经验证的融资文件、存款集中度数据、收入组合，以及能把规模转化为持久回报的信贷或收费经济性。
            calloutType: assumption
            claimRefs:
              - CV007
              - CV012
              - CV014
              - CV016
