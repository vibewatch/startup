      - number: '3.2'
        title: 特许权覆盖面和前沿行业聚焦是最清晰的差异化
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的定位差异，是 Erebor 试图把完整的全国性银行范围，与面向加密、AI、国防、支付和先进制造业客户的稳定币交易及托管结合起来。 BlockBeats 将该模式与 Anchorage
              Digital 的机构托管重点，以及 Circle 和 Ripple 的稳定币与结算策略作了对比。这让 Erebor 的产品抱负更广， 但抱负广不等于能力已得到证明。SQ Magazine 报道称，2025 年
              12 月 FDIC 已批准存款保险，OCC 已批准附条件特许权；后续保留来源将 Erebor
              描述为全国运营，但本章资料池没有监管原始文件。因此能力比较刻意不对称：只陈述有来源支持的功能，不把无支持的单元格填成未知之外的内容。 Fintech Brain Food 还指出，3
              月份的电话报告显示贷款为零，因此放贷时间、承保模式及其收入贡献仍未解决。信任优势依赖运营控制和资产负债表执行， 不能只靠特许权地位。
