  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与已验证需求
        blocks:
          - type: paragraph
            body: >-
              Erebor 提交的 CRA 计划划出的市场边界，比宽泛的“初创企业银行”标签紧得多。银行称其服务虚拟货币、AI、国防和制造业科技公司，
              以及支付服务商、投资基金和交易公司，并且不会运营分行网络或广泛的消费者业务。独立资料也强调，这是一家拥有银行特许权的机构，
              而非套在赞助银行之上的金融科技外壳。公开需求证据很强，但只针对公司本身：BankRegReports 显示 2026 年第二季度存款为 $4.06B， 后续独立报道则称存款超过 $7B，且一季度新增 500
              多名客户。这验证了真实的细分市场，但仍只是实际采用证据，不是已发布的 TAM/SAM/SOM。
