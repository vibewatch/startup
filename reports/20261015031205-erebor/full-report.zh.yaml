    title: 产品架构图
    type: stack
    summary: 公开来源描述了一套分层银行技术栈，但核心系统和供应商细节大多仍属机密，或等待补充提交。
    data:
      layers:
        - label: 目标细分市场
          detail: 银行为之服务的创新经济客户
          modules:
            - 虚拟货币公司
            - AI 公司
            - 国防公司
            - 制造业公司
            - 支付服务商、基金和交易公司
            - 部分高净值及超高净值个人
        - label: 面向客户的银行产品
          detail: 披露的三年期新设银行产品系列
          modules:
            - 信贷产品
            - 存款产品
            - 稳定币相关服务
            - 资金管理
            - 支付服务
            - 通过银行合作安排发行银行卡
        - label: 加密交易层
          detail: 公开披露的加密专属运营组件
          modules:
            - 为稳定币或封装稳定币服务持有虚拟货币
            - 为 Layer-1 和 Layer-2 gas 费持有虚拟货币
            - OCC 解释性指引中提及的加密资产托管和执行活动
        - label: 交付与结算层
          detail: 数字优先的运营模式，而非分行分销
          modules:
            - 新设银行阶段没有公开网点
            - 从总行向全国提供服务
            - 通过境外代理行关系提供部分全球服务
            - 公开材料描述的 24/7 结算用例
        - label: 控制与治理层
          detail: 开业前的监管依赖
          modules:
            - BSA/AML/OFAC 计划
            - 附录 B 信息安全计划
            - OCC 事先不反对任命 CISO
            - 外部审计和忠诚保险保障
            - 至少 12% 的一级杠杆率要求
        - label: 未披露或待定的基础设施
          detail: 公开记录仍未披露的重要部分
          modules:
            - 最终信息系统和运营架构
            - 详细流程图和示意图
            - 外包条款和供应商协议
            - 公开开发者或 API 文档
          note: These are known diligence gaps, not inferred completed modules.
    approximationNotes: 图示限定于公开披露，并将机密或待定组件明确标为缺口，而不是推测隐藏架构。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据指向一条以数字化和资金管理为主导的采用路径：从受监管的存款入口开始，延伸至支付／稳定币流程；规模较小或机会型用户则出现定价摩擦。
    data:
      items:
        - label: 服务不足的创新行业寻找受监管银行
          actor: 加密、AI、国防、制造、支付和基金运营商
          channel: 牌照驱动的定位
          touchpoints:
            - OCC 定义的目标细分市场
            - 全国性银行／FDIC 保险带来的信任信号
          tone: opportunity
        - label: 数字开户取代分行主导的关系
          actor: 创始人、CFO 和资金管理团队
          channel: 远程开户和客户关系管理
          touchpoints:
            - 没有实体网点或吸收存款的 ATM
            - 网站强调受保险状态，而非本地零售网点存在
          tone: neutral
        - label: 存款和电汇成为初始切入口
          actor: 企业资金和运营团队
          channel: 存款、ACH 和电汇通道
          touchpoints:
            - 带路由号码的专用账户
            - 存款、取款以及境内／国际电汇
          tone: positive
        - label: 稳定币流程创造差异化效用
          actor: 嵌入式金融和原生加密平台
          channel: API 连接的资金管理流程
          touchpoints:
            - 同一账户内的法币和稳定币活动
            - Infinite 所引用的薪资和资金管理类用例
          tone: positive
        - label: 扩张取决于向相邻资金管理产品交叉销售
          actor: 现有企业账户
          channel: 资金管理、银行卡、信贷和支付服务
          touchpoints:
            - 产品菜单比基础存款更宽
            - 尚无公开 NRR、GRR 或队列证据
          tone: neutral
        - label: 用户以机会型方式使用时，经济性趋紧
          actor: 交易公司和余额较小的客户
          channel: 稳定币兑换政策
          touchpoints:
            - 套利后增加费用、限额和存款要求
            - 可能更偏向余额更大、黏性更高的账户
          tone: risk
    claimRefs:
      - CU003
      - CU008
      - CU009
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在公开盈利和贷款表现数据尚未成熟之前，存款快速增长、客户行业集中以及仍处早期的产品控制交织之处，剩余风险最高。
    data:
      columns:
        - label: 可能性
          note: 基于 2026 年公开证据的当前概率，不是管理层指引。
        - label: 影响
          note: 风险一旦兑现，可能对融资、流动性或投资判断信心造成的损害。
        - label: 缓释成熟度
          note: 可见公开缓释措施的成熟度，而非其理论设计。
        - label: 剩余风险敞口
          note: 扣除可见缓释措施后的净评估。
      rows:
        - label: 存款集中／未保险流动性
          note: 公开存款增长似乎集中于大额企业余额，而非受保险的零售账户。
          values:
            - label: 高
              tone: critical
            - label: 严重
              tone: critical
            - label: 早期
              tone: warning
            - label: 严重
              tone: critical
        - label: 资本充足性与资产负债表增长
          note: 杠杆率下限有所帮助，但增长仍可能迫使公司频繁增发股权。
          values:
            - label: 高
              tone: critical
            - label: 高
              tone: critical
            - label: 发展中
              tone: warning
            - label: 高
              tone: critical
        - label: 稳定币控制／定价设计
          note: 一项正在运行的漏洞已经迫使上线功能加入费用和限额。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 发展中
              tone: warning
            - label: 高
              tone: critical
        - label: 执行深度和承保论证
          note: 公开人员配置和定制核心系统证据仍显示，运营平台的实际证明较薄弱。
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 早期
              tone: warning
            - label: 中
              tone: warning
        - label: 监管边界变化
          note: 稳定币和加密银行权限仍取决于一个年轻且政治敏感的规则环境。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 发展中
              tone: warning
            - label: 中
              tone: warning
        - label: 生态与合作伙伴依赖
          note: 早期投资者客户和引荐会加速增长，但下行期也可能收紧相关性。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 早期
              tone: warning
            - label: 高
              tone: critical
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据将强劲需求和资本需求，与仍然昂贵且尚未完成去风险的入场价格联系起来。
    data:
      nodes:
        - id: demand
          label: 需求证明
          value: Deposits reportedly >$7B with 500+ new customers in the prior quarter.
          tone: positive
        - id: round
          label: 2026 年融资传闻
          value: Commentary points to a prospective $1.5B raise at an $8B pre-money valuation.
          tone: warning
        - id: divergence
          label: 估值分歧
          value: Forge shows a far lower $2.28B mark than late-2026 round headlines.
          tone: warning
        - id: capital
          label: 资本约束
          value: FDIC conditions and 12% leverage math make new equity strategically important.
          tone: warning
        - id: execution
          label: 执行风险
          value: Stablecoin conversion pricing had to be reset after arbitrage pressure.
          tone: negative
        - id: decision
          label: 决策
          value: Research more; treat current public pricing as expensive until private diligence closes the proof gap.
          tone: warning
      edges:
        - from: demand
          to: round
          label: 支持融资兴趣
        - from: round
          to: divergence
          label: 仍缺乏清晰的价格确认
        - from: divergence
          to: capital
          label: 公开估值和资本需求必须相互匹配
        - from: capital
          to: execution
          label: 单靠资产负债表增长并不能消除模型风险
        - from: execution
          to: decision
          label: 等待更强的证据后再入场
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV010
      - CV012
      - CV016
