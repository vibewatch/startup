  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开市场进展
        blocks:
          - type: paragraph
            body: >-
              公开资料最清楚的结论是，Erebor 依靠受监管资产负债表变现，而不是轻量软件订阅。Sacra 估计，银行 2026 年 7 月年化收入达到 $112M， 高于 3 月的 $31M；2026 年 2
              月启动后，截至 7 月底存款增至 $4.6B。按 Sacra 的口径，68% 收入来自存款利息收入，32% 来自支付费、 账户费和 API/BaaS 费等非利息业务。这一结构意味着 Erebor
              的经济性首先由吸收存款和配置资产驱动，其次才是附加收费。

              客户结构同样重要。Sacra 描述约 500-600 家资金密集型大客户，平均存款约 $7M，每位客户年化收入约 $175K。这是窄而深的账户基础， 而不是自助式 SMB
              漏斗。它可能带来更高的单客户关系收入，但也意味着公司在广度上的证明更少，公开市场上的进展主张仍高度依赖少数大客户和第三方估算， 而非审计披露。
