            title: 产品新颖性没有阻止即时套利
            body: 免费稳定币兑换吸引了专业交易活动，据报道迫使公司加入费用、限额和存款条件。这一事件削弱了“仅凭该功能就能形成持久转换成本或定价能力”的说法。
