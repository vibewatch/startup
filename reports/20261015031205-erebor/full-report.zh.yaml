      - number: '2.2'
        title: 买方、用户与流程分层
        blocks:
          - type: paragraph
            body: >-
              买方和预算负责人通常是企业，而不是终端消费者。各来源反复呈现的采用模式由 CFO、资金管理和支付团队主导：企业需要运营账户、大额存款、
              支付通道、风投或设备融资，以及愿意承接传统机构仍谨慎对待行业的银行提供稳定币结算。这也解释了为什么 Erebor 的市场更像批发型、
              关系驱动型业务，而不是自助式大众市场。银行可服务的流程还位于受监管银行业务和加密通道的交叉处：稳定币存取款可成为加密及支付公司的差异化能力， 而
              AI、国防和先进制造业初创企业，比起基础支票账户，更可能看重高余额资金管理账户和专业信贷。
