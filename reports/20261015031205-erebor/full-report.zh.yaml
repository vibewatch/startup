  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 买方在银行、金融科技公司和数字资产专业机构之间选择
        blocks:
          - type: paragraph
            body: >-
              Erebor 的竞争集合比聚焦初创企业的数字银行更广。一个独立市场图谱列出 HSBC、First Citizens、Stifel 和 JPMorgan Chase 等传统及创新银行； Mercury 和 Brex
              等初创企业平台；金融科技基础设施提供商 Cross River；以及 Anchorage Digital、Custodia 和 Sygnum 等数字资产专业机构。 另一份加密银行分析还将
              Circle、Ripple 和 Paxos 列为相邻的稳定币或信托银行替代方案。因此买方可以选择完整银行，将初创企业账户平台与合作机构组合， 使用托管专业机构，或保留现有银行和资金管理流程。公开报道的规模给
              Erebor 带来势头，但没有形成无争议地位：Fintech Brain Food 报道存款超过 $7B， 上一季度新增客户超过 500 名；FundedIQ 报告两轮记录融资合计 $350M，员工规模为
              11–50 人。这些是分母不同的不同指标；已募集资金不等于可用现金， 两个来源都没有证明盈利能力或客户留存。
