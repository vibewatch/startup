  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 当前支持
      - 哪些信息会改变判断
    rows:
      - - 正论：真实需求存在
        - 据报道存款已超过 $7B，公司仍持续吸引大型融资兴趣
        - 如果私下尽调确认客户组合、存款集中度和可持续费用收入，我们会强化这一判断。
      - - 正论：公开条款没有显示激进的优先权悬挂
        - Forge 将 Series A 列为 1.0x 不参与分配、非累积
        - 如果完整的股权结构表确认这些条款，并显示新证券的高级顺位叠加有限，我们会提高评级。
      - - 反论：价格发现尚未确定
        - 公开参考包括披露的 $350M 融资、接近 $397M–$443M 的跟踪器总额，以及上线时的 $635Mn 资本数字
        - 签署完成且包含完整经济条款的轮次将消除大部分歧义。
      - - 反论：实时产品经济仍在调试
        - 据报道，套利活动后 Erebor 取消了面向较小用户的免费稳定币兑换
        - 稳定的收费表加上经常性净收入证据将降低这一担忧。
    notes: 正论与反论行只使用保留的公开证据；估值比较行未经 GAAP 或监管申报文件标准化。
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看多
        - 2026 年融资接近传闻中的 $1.5B / $8B 融资前估值区间落地，存款增长转化为持久的手续费和贷款收入
        - 只有私人数据证明更高的融资价格由盈利能力支撑，而非仅靠资产负债表规模，上行空间才成立
        - 收入不透明、存款集中度，以及加密银行控制措施的执行
        - 据报道，需求和融资渠道持续改善。
      - - 基准
        - Erebor 持续增长，但外部投资者仍缺乏公开收入、损失和信贷指标
        - 正确做法是跟踪里程碑并等待，因为现有公开数据不足以支撑清晰的基于倍数的投资判断
        - 融资条款以及存款变现速度仍存在更大不确定性
        - 这一情景最符合当前留存证据池的直接支持。
      - - 看空
        - 融资延期、重新定价或以更差条款落地，同时产品重新定价和批发存款波动侵蚀溢价叙事
        - 下行风险来自相对于更低二级市场估值的倍数压缩，以及实现盈利增长的路径变得更难
        - 融资市场降温、移动存款，以及更多产品摩擦证据
        - 如果公开势头在私人经济性得到验证前减弱，这一情景更可能发生。
    notes: 报告没有给出数值目标区间，因为留存证据池未披露收入、亏损或足以支撑精确倍数计算的可比公开估值基础。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV012
      - CV016
