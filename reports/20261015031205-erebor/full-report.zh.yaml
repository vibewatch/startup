      - number: '1.3'
        title: 融资、规模信号与运营证据
        blocks:
          - type: paragraph
            body: >-
              最强的已完成融资证据仍指向 2025 年 12 月：来源都指向一轮 $350M 融资，投后估值为 $4.35B。后续公开报道推动了叙事， 但尚未形成新的定价标记：FundedIQ 记录了 2026 年 3
              月另一轮未披露金额的融资，而 QuantLogix 和一家金融科技通讯都将 2026 年一轮更大、投前估值 $8B 的融资描述为仍在等待而非已经完成。最重要的运营信号是 2026 年 10 月的报道：上一季度新增
              500 多名客户后，存款超过 $7B。这说明市场确有采用，但也暗示存款可能偏批发型，余额大且对流动性敏感。2026 年 9 月的稳定币套利事件 进一步说明 Erebor
              已在加密流程中获得产品市场拉力，但公开收入、放贷构成和确切员工数仍未披露，无法说明这种势头究竟多持久。
