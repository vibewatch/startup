      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              支持 Erebor 的公开论据是：聚焦型特许银行模式已经获得早期市场拉力——存款规模大、估算收入增长快，而且公司启动后几个月内投资人就愿意讨论另一轮超大融资。
              反对过快进行投资判断的公开理由是，几乎所有投资人关心的利润率和资本问题仍属私密。收入质量看起来更由存款利差而非软件经常性收入驱动，非利息费用线只得到部分描述，
              至少有一项稳定币定价策略在市场参与者套利后不得不调整。

              实际结论是，Erebor 的财务可信度足以值得继续尽调，但透明度还不足以让人确信收入持久性、利润率路径或资本强度。私下尽调应重点关注 NIM 与资产收益率桥接、
              贷款及准备金表现、客户群层面的有保险与无保险存款组合、运营烧钱，以及融资后的监管资本规划。
            claimRefs:
              - CI005
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
