        title: 领导层、治理与关键利益相关方
        blocks:
          - type: paragraph
            body: >-
              管理层情况比创始人记录更清楚。多个来源确认 Jacob Hirshman 和 Owen Rapaport 是日常运营的联合 CEO， Palmer Luckey 和 Joe Lonsdale
              则被定位为高知名度创始人、支持者或董事会层面的关键人物；他们的人脉实质上影响 Erebor
              的市场触达和叙事可信度。这种集中既有利也有弊：它可能帮助公司在加密、国防和风投圈获客及融资，但也让公司明显依赖少数运营者和明星支持者。 另一个疑点是 FundedIQ 将 Aaron Pelz 和
              Rapaport 列为创始人，因此在后续尽调把正式创始人名单视为定论前，仍需文件确认。
