chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              第三方资料一贯将 Erebor 描述为一家数字化、全国性特许或正在申请特许的银行，服务“创新经济”而非大众市场数字银行。 其反复出现的目标客群包括初创企业、加密公司、AI
              公司、国防承包商和其他传统银行往往视为难服务或风险更高的高增长企业。 公开资料都指向 2025 年成立和俄亥俄州哥伦布总部，但也描述了包含纽约、以及某一资料中的加州纽波特海滩在内的更广运营范围，
              且没有分行网络。这种组合表明，Erebor 的核心身份是数字化分布的特色银行，差异化更多依靠行业承接意愿和资金管理通道， 而非实体分销。
