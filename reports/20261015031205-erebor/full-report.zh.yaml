      - number: '3.3'
        title: 首次可见的定价实验暴露出较弱的经济锁定
        blocks:
          - type: paragraph
            body: >-
              保留的竞争者资料池中，唯一的数字化产品定价涉及稳定币兑换。BeInCrypto 和 Fintech Brain Food 报道称，Erebor 起初将 USDC 和 USDT 按面值 免费兑换成美元，而
              Tether 的直接赎回基准是 $1,000 或 0.1% 两者取高。专业交易公司据称利用二级市场的小幅折价，随后 Erebor 将免费兑换
              限制给有大额存款的客户，并引入按量收费和限额。这一事件构成护城河持久性的反向证据：醒目功能吸引了资金流，但成熟客户可以多重开户并套利补贴，
              直到条款改变。同一报道将存款基础描述为批发型，因此可能不如零售资金黏性强。没有保留来源披露一般账户定价、实际合同经济性、转换成本、 续约行为或同业折扣，所以完整价格比较会是编造。可辩护的结论更窄：Erebor
              有分销势头和差异化的特许权主张，但公开证据尚未证明产品锁定或定价能力持久。
