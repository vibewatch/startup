      - number: '4.2'
        title: 定价、变现与单位经济可见度
        blocks:
          - type: paragraph
            body: >-
              公开定价可见度有限。审阅的资料池没有展示面向消费者或 SME 的清晰商业银行、资金管理、放贷或 API 产品价目表。最好的公开证据来自变现代理指标：
              存款驱动的利差收入、单客户平均收入，以及交易公司滥用后稳定币兑换价格的变化。BeInCrypto 报道，Erebor 起初允许客户免费按面值兑换 USDC 和 USDT，
              专业交易员利用该优惠后，公司加入费用、限额和存款要求。这一反向证据说明，至少有一项收费政策起初是增长激励，而非已经稳定、能够贡献利润的产品。

              经典单位经济问题也存在同样限制。公开来源给出存款、收入和一些资本比率代理指标，却没有 CAC、回本期、毛利率、贷款收益率、核销或按产品划分的贡献利润。
              因此，公开财务材料可以描述模式和发展方向，却无法在没有私下尽调的情况下评估实际定价质量或运营杠杆。
