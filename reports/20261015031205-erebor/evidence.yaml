evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founder-attribution
    missingEvidence: >-
      Official charter, incorporation, cap-table, or leadership materials that reconcile whether Aaron Pelz is a founder
      and whether Luckey/Lonsdale are formal founders or sponsors.
    whyItMatters: Founder attribution affects governance, historical accountability, and key-person mapping in later chapters.
    diligencePath: >-
      Request charter documents, board materials, and the current cap table from management and confirm the formal
      founder roster.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue, NIM, fee mix, deposit cost, and loan-book composition.
    whyItMatters: >-
      The company can look scaled on deposits and valuation while still lacking durable earnings power or prudent asset
      deployment.
    diligencePath: >-
      Obtain call reports, internal management reporting, or board materials covering revenue lines, lending mix, and
      balance-sheet composition.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Total customer count, customer segmentation, and deposit concentration metrics beyond the 500-plus
      incremental-customer datapoint.
    whyItMatters: >-
      Rapid deposit growth can be attractive or fragile depending on how concentrated balances are across venture funds,
      exchanges, or a few large startups.
    diligencePath: Request customer segmentation, top-depositor concentration, and account-balance distribution from management.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: TO003 stakeholder coverage
    missingEvidence: >-
      A current cap table, board observer list, and major counterparty exposure summary that show which investors and
      power users are economically material today.
    whyItMatters: >-
      The public stakeholder map identifies visible sponsors and counterparties, but not the full control or
      concentration picture behind governance and treasury risk.
    diligencePath: >-
      Request the latest cap table, board and observer roster, and any top-counterparty or top-depositor concentration
      deck used internally.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Segment-level SAM or SOM by vertical, geography, and product line, plus management's definition of which deposit
      and payments pools it can realistically capture.
    whyItMatters: >-
      Without a disclosed segmentation model, current evidence validates realized demand but does not bound the durable
      market size or support a valuation-through-penetration argument.
    diligencePath: >-
      Request management's internal market map, segmented pipeline, and product-level revenue bridge; reconcile it to
      disclosed deposits, customer counts, and underwriting capacity.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer count by segment, top-depositor concentration, insured versus uninsured balances, and retention or cohort
      data for the first operating quarters.
    whyItMatters: >-
      The reported growth could reflect a durable operating-account franchise or a narrower set of large, rate-sensitive
      institutional balances, which has very different implications for adoption quality and valuation.
    diligencePath: >-
      Obtain internal deposit-concentration reports, cohort retention, and segment mix by balances and product usage;
      compare them with call-report trends and fee changes after the stablecoin conversion incident.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Current price books, realized contracts, discount schedules, minimum balances, and service-level terms for Erebor
      and the named alternatives.
    whyItMatters: >-
      Without comparable realized prices and included services, the analysis cannot establish total cost, price premium,
      or sustainable pricing power.
    diligencePath: >-
      Request anonymized contracts and current rate cards from Erebor, then obtain like-for-like proposals from Mercury,
      First Citizens, Anchorage Digital, Cross River, and one global incumbent.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-substitutes
    missingEvidence: >-
      Customer-level deposit retention, product usage, migration cost, multi-bank behavior, renewal evidence, and
      partner dependency.
    whyItMatters: >-
      Reported deposit growth does not reveal whether customers are primary-bank relationships, opportunistic balances,
      or readily movable wholesale deposits.
    diligencePath: >-
      Review cohort-level balances and product adoption, interview reference customers that moved from different
      alternatives, and inspect concentration and attrition reports.
    relatedQuestionRefs:
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      A complete procurement-level census of status-quo providers, internal treasury builds, and likely new charter
      applicants.
    whyItMatters: >-
      Public competitor databases emphasize named vendors and can omit internal builds, multi-provider stacks, and
      recent entrants.
    diligencePath: >-
      Build a loss-log taxonomy from sales data and cross-check it against customer interviews, procurement records, and
      current regulator application lists.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, charge-offs, and contribution margin by revenue line.
    whyItMatters: These metrics determine whether early top-line traction converts into durable earnings power.
    diligencePath: >-
      Request board or lender reporting with monthly margin bridge, channel CAC, payback, and product-level
      profitability.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: >-
      Cash on hand, monthly burn, planned use of proceeds, debt facilities, and minimum regulatory-capital operating
      thresholds.
    whyItMatters: Fundraising headlines do not reveal whether Erebor can self-fund growth or must raise again under pressure.
    diligencePath: Obtain current treasury report, funding plan, and post-close regulatory-capital model.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI004
  - type: conflicting-data
    severity: minor
    topic: funding-reconciliation
    missingEvidence: A reconciled round-by-round schedule showing disclosed and undisclosed capital actually closed.
    whyItMatters: Public databases disagree on lifetime funding totals and can distort dilution and runway analysis.
    diligencePath: Reconcile cap table, wire-close schedule, and signed round documents against public database entries.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Depositor concentration by top accounts, insured versus uninsured split by cohort, and customer retention by
      revenue band.
    whyItMatters: A narrow customer base can make revenue and liquidity more fragile than top-line growth suggests.
    diligencePath: Request concentration reports, retention cohorts, and account-level deposit distribution snapshots.
    relatedQuestionRefs:
      - QI004
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public API documentation, repository activity, package metrics, or an official status surface showing how external
      developers or operators actually integrate with Erebor.
    whyItMatters: >-
      Without a verifiable developer surface, it is hard to judge implementation maturity, integration friction, or
      operational transparency for a bank that is marketed as digital-first and API-aware.
    diligencePath: >-
      Request current API docs, sandbox access, a status page, and any external integration references from management
      or launch customers.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: technical-architecture
    missingEvidence: >-
      The final information-systems architecture, risk assessment, vendor map, and security design that the OCC requires
      before opening.
    whyItMatters: >-
      The product thesis depends on secure movement between fiat, stablecoins, and correspondent-bank workflows, but the
      public record withholds the core technical implementation details.
    diligencePath: >-
      Obtain the finalized architecture package, outsourced-service inventory, and control narratives prepared for the
      pre-opening examination.
    relatedQuestionRefs:
      - QE003
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: operational-reliability
    missingEvidence: >-
      Public uptime, incident, SLA, corridor, and customer implementation evidence for deposits, payments, and
      stablecoin workflows.
    whyItMatters: >-
      Product-market fit for a transaction bank depends on dependable operating performance, not just charter approval
      or fundraising momentum.
    diligencePath: >-
      Ask for launch KPIs, incident summaries, status reporting, and at least two named production customer references
      by workflow.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort retention by segment.
    whyItMatters: >-
      Without retention metrics, it is impossible to tell whether Erebor's early customer growth is sticky or simply
      opportunistic balance inflow.
    diligencePath: >-
      Request segment-level retention and renewal cohorts, plus top-20 account tenure and wallet-share movement from
      management.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Additional named production customers across Erebor's core target verticals and the operating outcomes attached to
      each account.
    whyItMatters: >-
      One positive named platform relationship and two adverse usage examples are not enough to judge reference quality
      or sector breadth.
    diligencePath: >-
      Ask management for a customer reference list by vertical, indicating production status, account age, products
      used, and measurable outcomes.
    relatedQuestionRefs:
      - QU003
      - QU005
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Top-depositor concentration, uninsured deposit share, segment mix of the 500+ customers, and account-size
      distribution.
    whyItMatters: >-
      Erebor's public customer-count headline may mask a wholesale-heavy base whose balances move faster than SMB or
      retail deposits.
    diligencePath: >-
      Obtain the top-10 / top-20 depositor concentration schedule, uninsured-deposit ratio, and balance distribution by
      segment and geography.
    relatedQuestionRefs:
      - QU005
      - QU007
  - type: private-evidence-only
    severity: material
    topic: deposit-concentration
    missingEvidence: >-
      Breakout of insured versus uninsured balances, top-depositor share, sector concentration by balances, and
      management runoff assumptions.
    whyItMatters: >-
      Deposit concentration is the clearest public fragility signal, but outside investors cannot yet quantify how
      quickly funding could move under stress.
    diligencePath: >-
      Request recent call-report supplements, ALCO materials, and concentration dashboards with depositor cohorts and
      stress scenarios.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: stablecoin-control-risk
    missingEvidence: >-
      Fraud-loss history, exception monitoring thresholds, AML escalation metrics, and policy-approval records for
      stablecoin conversion and redemption flows.
    whyItMatters: >-
      A live exploit has already been reported, but public coverage does not show whether losses were immaterial or
      whether controls now match the risk.
    diligencePath: >-
      Review incident postmortems, control attestations, and current operating procedures for stablecoin conversion,
      fees, limits, and customer screening.
    relatedQuestionRefs:
      - QR002
      - QR006
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: material
    topic: loan-book-maturity
    missingEvidence: >-
      Loan-vintage performance, underwriting exceptions, criticized assets, net interest margin, fee revenue mix, and
      cohort economics by customer type.
    whyItMatters: >-
      Erebor's core strategic question is whether its deposit growth can become durable, profitable specialty banking
      rather than capital-intensive balance-sheet warehousing.
    diligencePath: >-
      Obtain loan tapes, underwriting policy documents, and management reporting on yields, losses, utilization, and
      customer expansion behavior.
    relatedQuestionRefs:
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue-proof
    missingEvidence: Audited or board-level revenue, margin, loss, and loan-yield data by product line.
    whyItMatters: >-
      Without earnings evidence, the public pool cannot support a conventional multiple-based valuation case or target
      return range.
    diligencePath: >-
      Request the latest management accounts, call-report detail, and product-level revenue bridge before revisiting
      price.
  - type: conflicting-data
    severity: material
    topic: capitalization-reconciliation
    missingEvidence: >-
      A reconciled cap-table and financing history that explains the difference between disclosed funding, launch
      capital, and secondary-data totals.
    whyItMatters: >-
      Entry pricing, dilution, and preference analysis all change if the public totals are measuring different
      instruments or different dates.
    diligencePath: >-
      Obtain executed round documents, a capitalization table, and management reconciliation of equity, commitments, and
      regulatory capital.
  - type: private-evidence-only
    severity: material
    topic: deposit-quality
    missingEvidence: >-
      Deposit concentration, uninsured-balance share, client cohort mix, and churn or repricing behavior after the
      stablecoin policy change.
    whyItMatters: >-
      Wholesale and concentrated balances can support fast growth but can also reverse quickly and pressure both
      liquidity and valuation.
    diligencePath: >-
      Request customer concentration schedules, liquidity stress testing, and post-policy-change deposit retention data
      from management.
