  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: NRR, GRR, churn, renewal rates, contract length, and cohort retention by segment.
      whyItMatters: Without retention metrics, it is impossible to tell whether Erebor's early customer growth is sticky or simply opportunistic balance inflow.
      diligencePath: Request segment-level retention and renewal cohorts, plus top-20 account tenure and wallet-share movement from management.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Additional named production customers across Erebor's core target verticals and the operating outcomes attached to each account.
      whyItMatters: One positive named platform relationship and two adverse usage examples are not enough to judge reference quality or sector breadth.
      diligencePath: Ask management for a customer reference list by vertical, indicating production status, account age, products used, and measurable outcomes.
      relatedQuestionRefs: [QU003, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-depositor concentration, uninsured deposit share, segment mix of the 500+ customers, and account-size distribution.
      whyItMatters: Erebor's public customer-count headline may mask a wholesale-heavy base whose balances move faster than SMB or retail deposits.
      diligencePath: Obtain the top-10 / top-20 depositor concentration schedule, uninsured-deposit ratio, and balance distribution by segment and geography.
      relatedQuestionRefs: [QU005, QU007]
