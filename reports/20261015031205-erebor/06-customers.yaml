schemaVersion: "report-v2"
artifact: customers
slug: erebor
runDate: 2026-10-15
company:
  name: Erebor
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows real early customer demand for Erebor's niche as a federally regulated
    bank serving crypto, AI, defense, manufacturing, and payment-related businesses, with third-party
    reports citing roughly $4.05-$4.06 billion of Q2 2026 deposits and more than $7 billion / 500+
    customers by early October. The proof of production usage is still narrow, however: Infinite is the
    clearest named live integration, while public materials still do not disclose retention, renewal,
    cohort, or top-depositor concentration metrics.
sections:
  - id: target-segments-and-acquisition
    title: Target segments are explicit, and the operating model is digital-first
    body: >-
      Erebor's public and regulatory materials make its intended customer base unusually explicit for an
      early bank. The OCC plan centers the "innovation economy": virtual-currency, AI, defense,
      manufacturing, payment-service, fund, and trading-firm customers, plus select individuals tied to
      those ecosystems. Prelaunch coverage repeated the same positioning and framed Erebor as a digitally
      delivered national bank for sectors legacy banks often treat cautiously. That matters because the
      customer story is not "broad SMB banking" or consumer retail; it is a concentrated B2B treasury and
      payments wedge aimed at underserved, often higher-balance accounts. The acquisition channel also
      appears remote and relationship-led rather than branch-led, because Erebor's OCC materials describe
      a no-branch, no-deposit-ATM model while the website foregrounds insured banking status rather than a
      local retail footprint.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-named-usage
    title: Aggregate adoption looks strong, but named production proof is still thin
    body: >-
      The strongest public adoption signals are aggregate, not cohort-level. Third-party reporting said
      deposits rose from a March 2026 baseline of about $1.1 billion to roughly $4.05-$4.06 billion by
      Q2 2026, then to more than $7 billion and 500+ customers by early October. That is meaningful
      evidence that Erebor found market pull after launch, especially given the bank's narrow ICP. The
      main named operating proof is Infinite, which launched bank accounts and stablecoin-linked treasury
      workflows with Erebor handling deposits, withdrawals, ACH, and wire services. Public evidence
      therefore supports real usage and at least one live embedded-banking relationship, but it still does
      not show how many of the 500+ customers are active, expanding, or concentrated in any one vertical.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-risk
    title: Durability, expansion, and concentration remain the chapter's main diligence gaps
    body: >-
      Public materials remain weak on durability. The sources reviewed here do not disclose NRR, GRR,
      churn, renewal rates, contract terms, or cohort behavior, so the gap between "customer acquisition"
      and "customer retention" is still unresolved. The adverse evidence also cuts against a simple growth
      narrative: BeInCrypto reported Erebor pulled back free stablecoin conversion for customers without
      sizable deposits and added fees and limits after arbitrage by trading firms, while Fintech Brain
      Food argued the bank's recent deposit growth likely skewed toward wholesale-sized balances. That does
      not disprove product-market fit, but it does suggest the public customer base may be more liquidity-
      sensitive, large-balance, and pricing-aware than a headline customer-count figure implies.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Crypto businesses
        - Company treasury and finance teams as buyer/user/payer
        - Regulated deposits, stablecoin-adjacent payments, and operating accounts
        - Repeated target segment across OCC and 2026 reporting
        - Core niche where Erebor is trying to replace post-SVB and post-Silvergate banking capacity
        - No public split between exchanges, infrastructure firms, funds, or operating startups
      - - AI, defense, and advanced manufacturing companies
        - CFO / treasury teams pay; operating teams consume banking rails indirectly
        - Deposit accounts, treasury management, payment services, and later credit products
        - Named repeatedly in OCC and prelaunch coverage
        - Expands beyond crypto and may diversify sector risk if real adoption matches positioning
        - No public logo list, seat count, or deposit mix by vertical
      - - Payment service providers and fintech platforms
        - Platform operator pays; finance / ops users consume rails
        - Dedicated accounts, ACH, domestic/international wires, and embedded banking workflows
        - Infinite launch is direct proof of at least one live partner-customer implementation
        - Could make Erebor an infrastructure provider rather than only a direct bank relationship
        - No disclosed revenue share, API volumes, or partner concentration
      - - Investment funds and trading firms
        - Treasury desks and operations teams pay/use
        - Deposit parking, dollar settlement, and stablecoin conversion / redemption flows
        - OCC explicitly names funds/trading firms; adverse reporting names Wintermute and Galaxy Digital
        - High balances can accelerate deposit growth quickly
        - Also the segment most likely to create uninsured-balance and hot-money concentration risk
    notes: >-
      Data source convention: rows combine OCC target-segment language with 2026 news/adverse reporting;
      "scale signal" is directional public evidence, not disclosed revenue mix.
    claimRefs: [CU001, CU003, CU004, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Deposits at regulatory baseline
        - $1.1bn
        - Mar 2026
        - Catenaa citing regulator-reported March level
        - Medium
        - Starting point before Q2 acceleration
        - No segment or account-count breakout at this baseline
      - - Deposits by Q2 2026
        - $4.05-$4.06bn
        - Q2 2026
        - Catenaa; Cryptopolitan citing Q2 filings / Bank Data Insights
        - Medium
        - Roughly 4x the March baseline in one quarter, indicating fast early onboarding
        - No breakdown between net-new customers and wallet share expansion
      - - Customers added in prior three months
        - Nearly 400
        - Jul 2026
        - Catenaa
        - Medium
        - Recent acquisition pace was still accelerating midyear
        - No geography, vertical, or deposit-size distribution
      - - Customers / deposits since opening
        - ">500 customers / >$7bn deposits"
        - Oct 2026
        - Cryptopolitan citing Financial Times
        - Medium
        - Public traction materially exceeded prelaunch scale assumptions
        - No disclosure of active accounts, retention, or top-customer concentration
    notes: >-
      Values are third-party-reported snapshots at different dates; ranges reflect two outlets citing
      roughly the same Q2 deposit figure, and null denominators remain open diligence questions.
    claimRefs: [CU005, CU006, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / named account
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Infinite
        - Institutional stablecoin infrastructure / fintech platform
        - Infinite Accounts uses Erebor for deposits, withdrawals, ACH, and domestic/international wires
        - Live launch announced in April 2026
        - Clear named proof that Erebor is already powering embedded banking workflows
        - No public volume, account count, or revenue contribution disclosed
      - - Wintermute
        - Crypto trading firm
        - Stablecoin-to-dollar redemption / conversion activity
        - Reported live transactional use, not a reference case study
        - Proves Erebor's crypto treasury rails were attractive enough to be exploited economically
        - Adverse evidence only; no indication of a durable primary banking relationship
      - - Galaxy Digital
        - Crypto / digital-asset trading and investing firm
        - Stablecoin redemption trades with Erebor
        - Reported live transactional use
        - Adds a second named institution using the stablecoin conversion surface
        - Same adverse report; no disclosed tenure, balances, or cross-sell depth
    notes: >-
      Enumeration is partial: only publicly named, source-verifiable accounts/usages are listed, and two
      rows come from adverse reporting rather than positive customer references.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial public evidence set limited to named 2026 sources in the assigned pool; Erebor's broader
        customer base is not publicly enumerated.
    claimRefs: [CU008, CU011, CU012, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a digital, treasury-led adoption path that starts with regulated deposit
      access and expands into payment/stablecoin workflows, with pricing friction emerging for smaller or
      opportunistic users.
    data:
      items:
        - label: Underserved innovation sectors seek a regulated bank
          actor: Crypto, AI, defense, manufacturing, payment, and fund operators
          channel: Charter-driven positioning
          touchpoints:
            - OCC-defined target segments
            - National-bank / FDIC-insured trust signals
          tone: opportunity
        - label: Digital onboarding replaces a branch-led relationship
          actor: Founders, CFOs, and treasury teams
          channel: Remote account opening and relationship management
          touchpoints:
            - No physical branches or deposit-taking ATMs
            - Website emphasizes insured status over local retail presence
          tone: neutral
        - label: Deposits and wires become the initial wedge
          actor: Corporate treasury and operations
          channel: Deposit, ACH, and wire rails
          touchpoints:
            - Dedicated accounts with routing numbers
            - Deposits, withdrawals, and domestic/international wires
          tone: positive
        - label: Stablecoin workflows create differentiated utility
          actor: Embedded-finance and crypto-native platforms
          channel: API-linked treasury workflow
          touchpoints:
            - Same-account fiat and stablecoin activity
            - Infinite cited payroll and treasury-style use cases
          tone: positive
        - label: Expansion depends on cross-sell into adjacent treasury products
          actor: Existing enterprise accounts
          channel: Treasury management, cards, credit, and payment services
          touchpoints:
            - Product menu is broader than basic deposits
            - No public NRR, GRR, or cohort proof yet
          tone: neutral
        - label: Economics tighten when usage is opportunistic
          actor: Trading firms and smaller-balance customers
          channel: Stablecoin conversion policy
          touchpoints:
            - Fees, limits, and deposit requirements after arbitrage
            - Potential bias toward larger balances and stickier accounts
          tone: risk
    claimRefs: [CU003, CU008, CU009, CU011]
callouts:
  - calloutType: strength
    title: Aggregate traction is real even if the public ledger is still coarse
    body: >-
      Third-party reporting ties Erebor to a jump from roughly $1.1 billion deposits in March 2026 to
      about $4.05-$4.06 billion in Q2 and more than $7 billion / 500+ customers by early October. That
      is meaningful proof of demand for the bank's niche even though public customer-level denominators are
      still missing.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Durability remains unproven
    body: >-
      Public materials still omit NRR, GRR, churn, renewals, cohorts, and top-depositor concentration,
      while adverse reporting shows Erebor tightened free stablecoin conversion for customers without
      sizable deposits after arbitrage. The customer base may be real, but its stickiness and balance
      distribution remain unverified.
    claimRefs: [CU010, CU011, CU012, CU013]
