callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: If deposits keep outgrowing capital and lending proof, Erebor can look more like a fragile wholesale funding node than a durable specialty bank.
    claimRefs: [CR004, CR005, CR006, CR013]
  - calloutType: insight
    title: What the public mitigants actually prove
    body: The higher leverage floor and quick fee changes show supervisory and managerial responsiveness, but they do not yet prove stable economics, sticky deposits, or mature controls under stress.
    claimRefs: [CR002, CR005, CR008]
