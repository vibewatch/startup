chapter:
  number: 7
  title: Risks
  summary: Erebor's highest residual risks cluster around a concentrated uninsured deposit base, a still-unproven earnings model, and novel stablecoin controls that have already needed mid-course correction. Public evidence supports real mitigations such as high capital buffers and tightened conversion rules, but it still leaves core underwriting, control, and depositor-stickiness questions unresolved.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      Erebor's public risk profile is unusually top-heavy for a six-to-eight-month-old de novo bank because its balance sheet appears to be scaling faster than its operating proof. Independent commentary and competitor analysis converge on the same pattern: Erebor has gathered large balances from a narrow set of frontier-industry customers, while disclosed lending and public monetization evidence still trail deposit growth. That creates a residual risk stack in which liquidity concentration, capital needs, and product-control design matter more than classical retail-bank branch or customer-acquisition risks. The mitigants are meaningful—high required leverage, a capital-call backstop, and a willingness to add fees and limits when a crypto product was gamed—but those mitigants are still early-stage rather than time-tested.
    claimRefs: [CR001, CR004, CR005, CR006, CR013, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-and-product-control-risks
    title: Regulatory and product-control risks
    body: >-
      Erebor's charter status is a strength, but it also codifies a demanding control burden. Public reporting describes a three-year 12% Tier 1 leverage requirement plus a capital-call agreement if capital falls below well-capitalized levels, which signals that regulators already view the model as high-risk enough to require thicker buffers than a typical bank. The September stablecoin-conversion incident shows the operational side of that scrutiny: a customer-acquisition feature that looked attractive for crypto-native clients was reportedly exploitable in practice and had to be narrowed with fees, limits, and deposit requirements. That does not prove systemic control failure, but it does show that a novel product perimeter can create real loss channels before the bank has demonstrated mature control feedback loops in public.
    claimRefs: [CR002, CR007, CR008, CR011]
    tableRefs: [TR001]
  - id: funding-concentration-and-dependency-risks
    title: Funding, concentration, and dependency risks
    body: >-
      The remaining thesis-break risk is that Erebor's funding, customer, and partner model may be more correlated than the headline growth suggests. Public sources describe a small-team institution serving defense, AI, crypto, and advanced manufacturing, while partner materials openly note that early investors also became customers, referrers, talent connectors, and regulatory door-openers. That network can accelerate launch, but it also raises the cost of any future repricing in venture appetite, crypto sentiment, or sector-specific regulation. Without public disclosure on depositor concentration, churn, loan performance, or examination results, an outside investor still cannot separate durable franchise formation from early network-driven growth.
    claimRefs: [CR003, CR009, CR010, CR012, CR015]
    tableRefs: [TR003]
tables:
