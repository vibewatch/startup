    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / perimeter
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - ["De novo charter oversight and capital compliance", "U.S. OCC / FDIC", "Operating under a 12% Tier 1 leverage floor and capital-call support during the first three years", "Medium", "High", "Large opening capital base and explicit capital-call agreement", "High", "Review call reports, capital composition, and any future changes to leverage requirements or formal supervisory actions."]
      - ["Stablecoin product / consumer-protection control risk", "U.S. bank + crypto payment flows", "Free par-value stablecoin conversions were reportedly exploited and then narrowed with fees, limits, and deposit thresholds", "Medium", "High", "Management has already removed the most permissive version of the feature", "High", "Request loss history, policy versions, approval memos, and fraud / AML exception reporting for stablecoin flows."]
      - ["Evolving crypto-banking rule perimeter", "U.S. federal banking and crypto policy", "Public materials emphasize stablecoin deposits, withdrawals, and crypto-collateralized services, but rule durability is still being tested in market practice", "Medium", "Medium", "Charter ownership and regulated deposit perimeter", "Medium", "Test whether product economics still work if stablecoin redemption, custody, or collateral rules tighten."]
    notes: Public evidence supports the rows but not a full supervisory file; severity ordering reflects reported capital constraints, a documented product-control incident, and dependence on still-novel crypto-banking permissions.
    enumerationScope:
      coverage: partial
      basis: This register covers the principal publicly documented regulatory and legal exposures visible in the assigned 2025-2026 source set, not a complete supervisory or litigation inventory.
    claimRefs: [CR001, CR002, CR007, CR008, CR011]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Wholesale deposit concentration and uninsured-balance flight", "Public commentary says deposits passed $7bn with 500+ customers and likely sit mostly above the FDIC cap; competitor analysis also describes a small number of very large accounts", "High", "Critical", "Early", "Critical", "No public top-depositor share, insured/uninsured mix by cohort, or runoff assumptions."]
      - ["Balance-sheet growth outruns earnings and lending proof", "Airwallex reports $4.06bn of deposits, $4.66bn of total assets, and only $77.2m of loans at the end of June 2026", "High", "High", "Early", "High", "No public net interest margin, fee mix, or loan-vintage performance to show how deposits become durable earnings."]
      - ["Stablecoin control design can leak value before controls harden", "BeInCrypto says traders bought tokens below par and redeemed them through Erebor until the bank added fees and limits", "Medium", "High", "Developing", "High", "No public disclosure of losses, exception volume, or the exact monitoring architecture behind conversion controls."]
      - ["Custom core and small team create execution / key-person risk", "Public profiles say the core processing system is being written from scratch and FundedIQ still places Erebor in an 11-50 employee band", "Medium", "Medium", "Early", "Medium", "No public data on engineering depth, SRE coverage, audit cadence, or control ownership by function."]
    notes: The register mixes observed public incidents with inferred operating risks; it preserves the reported figures and flags where key denominators or internal-control evidence are missing.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR010, CR011, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / cluster
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Investor and partner network for GTM", "MVP Ventures and overlapping venture ecosystem", "Early customer introductions, product feedback, talent, and strategic/regulatory introductions", "Partner materials say an investor became one of Erebor's earliest customers and helped source customers and talent", "If ecosystem enthusiasm cools, customer acquisition and hiring efficiency could fall together", "High", "Broaden channels beyond sponsor ecosystem and show independent customer proof", "High"]
      - ["Capital markets for balance-sheet support", "Current and prospective venture investors", "Fund growth capital needed to support leverage requirements as deposits scale", "Public commentary ties the next raise to keeping pace with a $7bn balance sheet under a 12% leverage floor", "If fundraising slows, growth or product breadth may need to slow with it", "High", "Large opening capital base and visible investor demand", "High"]
      - ["Sector concentration in defense / AI / crypto / advanced manufacturing", "Frontier-industry customer base", "Core deposit and lending audience", "Multiple public profiles describe the bank as focused on a handful of correlated frontier sectors", "A sector downturn, de-risking cycle, or policy shock could hit deposits, credit quality, and reputation at once", "High", "Relationship underwriting and higher capital buffers", "High"]
    notes: Counterparty risk here is ecosystem dependence rather than a single supplier contract; the key issue is correlation across customers, investors, and funding sources.
    claimRefs: [CR001, CR004, CR005, CR012, CR013, CR015]
