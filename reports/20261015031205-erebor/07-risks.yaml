  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: deposit-concentration
      missingEvidence: Breakout of insured versus uninsured balances, top-depositor share, sector concentration by balances, and management runoff assumptions.
      whyItMatters: Deposit concentration is the clearest public fragility signal, but outside investors cannot yet quantify how quickly funding could move under stress.
      diligencePath: Request recent call-report supplements, ALCO materials, and concentration dashboards with depositor cohorts and stress scenarios.
      relatedQuestionRefs: [QR003, QR008]
      relatedTableRefs: [TR002, TR003]
    - type: private-evidence-only
      severity: material
      topic: stablecoin-control-risk
      missingEvidence: Fraud-loss history, exception monitoring thresholds, AML escalation metrics, and policy-approval records for stablecoin conversion and redemption flows.
      whyItMatters: A live exploit has already been reported, but public coverage does not show whether losses were immaterial or whether controls now match the risk.
      diligencePath: Review incident postmortems, control attestations, and current operating procedures for stablecoin conversion, fees, limits, and customer screening.
      relatedQuestionRefs: [QR002, QR006, QR008]
      relatedTableRefs: [TR001, TR002]
    - type: missing-source
      severity: material
      topic: loan-book-maturity
      missingEvidence: Loan-vintage performance, underwriting exceptions, criticized assets, net interest margin, fee revenue mix, and cohort economics by customer type.
      whyItMatters: Erebor's core strategic question is whether its deposit growth can become durable, profitable specialty banking rather than capital-intensive balance-sheet warehousing.
      diligencePath: Obtain loan tapes, underwriting policy documents, and management reporting on yields, losses, utilization, and customer expansion behavior.
      relatedQuestionRefs: [QR004, QR008]
      relatedTableRefs: [TR002]
