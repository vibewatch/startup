  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: |-
              The strongest public read-through is that Erebor monetizes a regulated balance sheet, not
              a lightweight software subscription. Sacra estimates the bank reached $112M of annualized
              revenue in July 2026, up from $31M in March, with deposits growing to $4.6B by the end of
              July after launch in February 2026. In Sacra's framing, 68% of revenue comes from interest
              income on deposits and 32% from noninterest lines such as payment fees, account fees, and
              API/BaaS fees. That mix implies Erebor's economics are driven first by deposit capture and
              asset deployment, then by fee attachment.

              The customer shape also matters. Sacra describes roughly 500-600 large, capital-intensive
              customers averaging about $7M on deposit and roughly $175K in annualized revenue per
              customer. That is a narrow-and-deep account base rather than a self-serve SMB funnel. It
              may support higher revenue per relationship, but it also means the business is less proven
              on breadth, and public traction claims remain heavily dependent on a small number of large
              accounts plus third-party estimates rather than audited disclosures.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI005
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI014
      - number: '4.2'
        title: Pricing, monetization, and unit-economics visibility
        blocks:
          - type: paragraph
            body: |-
              Public pricing visibility is limited. The reviewed pool does not expose a clean consumer- or
              SME-style price card for business banking, treasury, lending, or API products. Instead, the
              best public evidence comes from monetization proxies: deposit-driven spread income, average
              revenue per customer, and a reported change to stablecoin-conversion pricing after abuse by
              trading firms. BeInCrypto reported that Erebor initially let customers convert USDC and
              USDT at par for free, then added fees, limits, and deposit requirements after professional
              traders exploited the offer. That episode is adverse evidence that at least one fee policy
              started as a growth incentive rather than a settled margin-positive product.

              The same limitation shows up across classic unit-economics questions. Public sources give
              deposit, revenue, and some capital-ratio proxies, but not CAC, payback, gross margin, loan
              yields, charge-offs, or contribution margin by product. As a result, public financial work
              can describe the model and direction of travel, but it cannot underwrite realized pricing
              quality or operating leverage without private diligence.
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI011
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI008
              - CI013
              - CI014
              - CI016
      - number: '4.3'
        title: Capital position and financing dependency
        blocks:
          - type: paragraph
            body: |-
              Public funding evidence is directionally positive but numerically messy. FundedIQ says
              Erebor has raised $350M across two rounds on record, with the March 2026 round undisclosed
              and excluded from the total; Multiples similarly anchors the December 2025 valuation at
              about $4.3B and leaves the later round amount blank. Sacra, by contrast, estimates total
              funding raised at $635M as of mid-2026. The most defensible conclusion is not a precise
              lifetime-funding number, but that public databases disagree because they treat undisclosed
              round amounts differently.

              More current press coverage points to continued external capital dependence. Retail Banker
              International and Traders Union both reported in August 2026 that Erebor was in advanced
              talks to raise about $1.5B at roughly an $8B valuation, while also citing deposits of $4.6B
              and annualized recurring revenue above $100M after February regulatory approval. Those are
              useful signals that fundraising markets may still support the company, but they are not the
              same as cash on hand, runway, or disclosed burn. Public sources also do not quantify debt
              facilities, minimum operating capital thresholds, or the funding needed to absorb credit or
              compliance shocks.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: |-
              The public case for Erebor is that a focused chartered-bank model has found early traction:
              large deposits, fast estimated revenue growth, and investor willingness to discuss another
              very large round within months of launch. The public case against underwriting too quickly
              is that nearly every investor-critical margin and capital question remains private. Revenue
              quality appears more deposit-spread-driven than software-recurring, noninterest fee lines
              are only partially described, and at least one stablecoin pricing tactic had to be revised
              after market participants arbitraged it.

              The practical verdict is that Erebor looks financially credible enough to merit continued
              diligence, but not yet transparent enough for conviction on revenue durability, margin path,
              or capital intensity. Private diligence should focus on NIM and asset-yield bridge, loan and
              reserve performance, customer concentration, insured versus uninsured deposit mix by cohort,
              operating burn, and post-fundraise regulatory capital planning.
            claimRefs:
              - CI005
              - CI011
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deposit-led, not software-led
            body: >-
              The reviewed evidence points to Erebor behaving more like a concentrated commercial bank with tech-native
              distribution than like a pure SaaS fintech: deposit balances and interest spread appear to drive the
              majority of current revenue.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: callout
            title: Capital adequacy is still a private-diligence question
            body: >-
              Public sources support fundraising momentum and some balance-sheet proxies, but they do not disclose cash,
              burn, gross margin, or customer concentration in enough detail to underwrite runway or downside
              absorption.
            calloutType: risk
            claimRefs:
              - CI008
              - CI012
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product scope and target workflow
        blocks:
          - type: paragraph
            body: >-
              Erebor's public charter package is specific about who the bank is for even if it is sparse on
              customer-facing product documentation. The bank is positioned around the "innovation economy":
              virtual-currency, AI, defense, manufacturing, payments, and trading customers, plus select wealthy
              individuals and some foreign banking relationships that need U.S.-dollar access. Within that scope, the
              disclosed product families are deposits, credit, stablecoin-related services, and adjacent treasury,
              payments, and bank-partner card capabilities. That mix makes the core workflow less like a consumer
              neobank and more like a regulated treasury and transaction bank for corporates that need both fiat banking
              and crypto-adjacent settlement.
            claimRefs:
              - CE001
              - CE002
              - CE004
