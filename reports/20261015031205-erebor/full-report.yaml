  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a digital, treasury-led adoption path that starts with regulated deposit access and
      expands into payment/stablecoin workflows, with pricing friction emerging for smaller or opportunistic users.
    data:
      items:
        - label: Underserved innovation sectors seek a regulated bank
          actor: Crypto, AI, defense, manufacturing, payment, and fund operators
          channel: Charter-driven positioning
          touchpoints:
            - OCC-defined target segments
            - National-bank / FDIC-insured trust signals
          tone: opportunity
        - label: Digital onboarding replaces a branch-led relationship
          actor: Founders, CFOs, and treasury teams
          channel: Remote account opening and relationship management
          touchpoints:
            - No physical branches or deposit-taking ATMs
            - Website emphasizes insured status over local retail presence
          tone: neutral
        - label: Deposits and wires become the initial wedge
          actor: Corporate treasury and operations
          channel: Deposit, ACH, and wire rails
          touchpoints:
            - Dedicated accounts with routing numbers
            - Deposits, withdrawals, and domestic/international wires
          tone: positive
        - label: Stablecoin workflows create differentiated utility
          actor: Embedded-finance and crypto-native platforms
          channel: API-linked treasury workflow
          touchpoints:
            - Same-account fiat and stablecoin activity
            - Infinite cited payroll and treasury-style use cases
          tone: positive
        - label: Expansion depends on cross-sell into adjacent treasury products
          actor: Existing enterprise accounts
          channel: Treasury management, cards, credit, and payment services
          touchpoints:
            - Product menu is broader than basic deposits
            - No public NRR, GRR, or cohort proof yet
          tone: neutral
        - label: Economics tighten when usage is opportunistic
          actor: Trading firms and smaller-balance customers
          channel: Stablecoin conversion policy
          touchpoints:
            - Fees, limits, and deposit requirements after arbitrage
            - Potential bias toward larger balances and stickier accounts
          tone: risk
    claimRefs:
      - CU003
      - CU008
      - CU009
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk remains highest where rapid deposit growth, concentrated customer sectors, and still-early product
      controls intersect before public earnings and loan-performance data mature.
    data:
      columns:
        - label: Likelihood
          note: Current probability based on public 2026 evidence, not management guidance.
        - label: Impact
          note: Potential damage to funding, liquidity, or underwriting confidence if the risk crystallizes.
        - label: Mitigation maturity
          note: Maturity of visible public mitigations rather than their theoretical design.
        - label: Residual exposure
          note: Net assessment after visible mitigations.
      rows:
        - label: Deposit concentration / uninsured liquidity
          note: Public deposit growth appears concentrated in large corporate balances rather than insured retail accounts.
          values:
            - label: High
              tone: critical
            - label: Critical
              tone: critical
            - label: Early
              tone: warning
            - label: Critical
              tone: critical
        - label: Capital adequacy vs balance-sheet growth
          note: The leverage floor helps, but growth can still force frequent equity raises.
          values:
            - label: High
              tone: critical
            - label: High
              tone: critical
            - label: Developing
              tone: warning
            - label: High
              tone: critical
        - label: Stablecoin control / pricing design
          note: A live exploit already forced fees and limits onto a launch feature.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Developing
              tone: warning
            - label: High
              tone: critical
        - label: Execution depth and underwriting proof
          note: Public staffing and custom-core evidence still imply a thinly demonstrated operating platform.
          values:
            - label: Medium
              tone: warning
            - label: Medium
              tone: warning
            - label: Early
              tone: warning
            - label: Medium
              tone: warning
        - label: Regulatory perimeter shift
          note: >-
            Stablecoin and crypto-banking permissions still depend on a young and politically sensitive rule
            environment.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Developing
              tone: warning
            - label: Medium
              tone: warning
        - label: Ecosystem / partner dependence
          note: Early investor-customers and introductions speed growth but can tighten correlation in a downturn.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Early
              tone: warning
            - label: High
              tone: critical
