chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >
              Erebor is consistently described across third-party profiles as a digital, nationally chartered or
              charter-seeking bank built for the "innovation economy" rather than a mass-market neobank. The recurring
              target segments are startups, crypto firms, AI companies, defense contractors, and other high-growth
              businesses that traditional banks have often treated as difficult or higher-risk customers. Public
              profiles line up on a 2025 founding and a Columbus, Ohio headquarters, but they also describe a wider
              operating footprint that includes New York and, in one profile, Newport Beach with no branch network. That
              mix suggests Erebor's core identity is a digitally distributed specialty bank whose differentiation
              depends more on sector willingness and treasury rails than on physical distribution.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Leadership, governance, and key stakeholders
        blocks:
          - type: paragraph
            body: >
              The management picture is clearer than the founder record. Multiple sources identify Jacob Hirshman and
              Owen Rapaport as the day-to-day co-CEOs, while Palmer Luckey and Joe Lonsdale are framed as high-profile
              founders, sponsors, or board-level figures whose networks materially shape Erebor's market access and
              narrative credibility. That concentration is a double-edged sword: it likely helps customer acquisition
              and capital formation in crypto, defense, and venture circles, but it also creates visible key-person
              dependence around a small set of operators and celebrity backers. A further wrinkle is that FundedIQ lists
              Aaron Pelz and Rapaport as founders, so the exact formal founder roster still needs documentary
              confirmation before it is treated as settled fact in later diligence work.
