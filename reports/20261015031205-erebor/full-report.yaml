figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show Erebor moving quickly from stealth narrative to regulated-bank scale, with capital
      formation and product controls still evolving.
    data:
      items:
        - date: Jul 2025
          label: Stealth bank narrative becomes public
          detail: >-
            Access IPOs and Sreedevi's profile described Erebor as a post-SVB digital bank being built for startup,
            crypto, AI, defense, and innovation-economy clients.
          tone: opportunity
          claimRefs:
            - CO001
            - CO006
        - date: Oct 2025
          label: National-charter path clears a key hurdle
          detail: >-
            Public reporting and later retrospectives point to conditional OCC approval / a key charter milestone in
            October 2025.
          tone: neutral
          claimRefs:
            - CO004
            - CO006
        - date: Dec 2025
          label: FDIC approval reported
          detail: SQ Magazine and later news archives described FDIC approval as a major checkpoint before launch.
          tone: positive
          claimRefs:
            - CO004
            - CO006
        - date: Dec 2025
          label: $350M financing closes at $4.35B
          detail: >-
            Multiple sources align on the December 2025 round as the last closed priced financing and the anchor for the
            current confirmed valuation.
          tone: positive
          claimRefs:
            - CO008
        - date: Feb 2026
          label: Bank opens for business
          detail: Fintech Brain Food and Silicon Valley Invest Club both describe Erebor as having opened in February 2026.
          tone: positive
          claimRefs:
            - CO004
            - CO010
        - date: Mar 2026
          label: Undisclosed follow-on round appears in trackers
          detail: >-
            FundedIQ records a March 2026 round but excludes it from the disclosed funding total because no amount was
            reported.
          tone: neutral
          claimRefs:
            - CO009
        - date: Aug 2026
          label: $1.5B raise marketed at $8B pre-money
          detail: >-
            QuantLogix and fintech reporting describe a much larger 2026 financing in progress, but QuantLogix
            explicitly keeps the December 2025 mark because the round was not yet closed.
          tone: opportunity
          claimRefs:
            - CO011
        - date: Sep 2026
          label: Stablecoin conversion perk is tightened
          detail: >-
            After traders reportedly arbitraged Erebor's fee-free redemptions, the bank moved to fees, limits, and
            deposit requirements.
          tone: risk
          claimRefs:
            - CO012
        - date: Oct 2026
