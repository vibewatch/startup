  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and validated demand
        blocks:
          - type: paragraph
            body: >
              Erebor's own filed CRA plan draws a much tighter market boundary than the broad "startup banking" label
              suggests. The bank says it is built for technology companies in virtual currencies, AI, defense, and
              manufacturing, plus payment providers, investment funds, and trading firms, and that it will not run a
              branch network or broad consumer franchise. Independent profiles reinforce that this is a charter-owning
              institutional bank rather than a sponsor-bank fintech wrapper. Public demand proof is strong but
              company-specific: BankRegReports shows $4.06 billion of Q2 2026 deposits, while later independent coverage
              said deposits passed $7 billion and that the bank added more than 500 customers in one quarter. That
              validates a real niche, but it is still evidence of realized adoption, not a published TAM/SAM/SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM014
