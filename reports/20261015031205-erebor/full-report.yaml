      - number: '1.3'
        title: Funding, scale signals, and operating proof
        blocks:
          - type: paragraph
            body: >
              The strongest closed financing evidence still points to December 2025, when sources aligned around a $350M
              round at a $4.35B post-money valuation. Public reporting later moved the narrative forward but not all the
              way to a new priced mark: FundedIQ records an additional March 2026 undisclosed round, while QuantLogix
              and a fintech newsletter both describe a much larger 2026 raise at an $8B pre-money valuation as still
              pending rather than closed. The most important operating signal is October 2026 reporting that deposits
              passed $7B after 500-plus customers were added in the prior quarter, which indicates real market uptake
              but also a likely wholesale-deposit profile with large balances and liquidity sensitivity. The September
              2026 stablecoin arbitrage episode reinforces that Erebor already has product-market pull in the crypto
              workflow, yet still lacks public revenue, lending-mix, and exact headcount disclosure that would show how
              durable that momentum really is.
            claimRefs:
