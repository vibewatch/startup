              - CM011
              - CM013
              - CM014
      - number: '2.2'
        title: Buyer, user, and workflow segmentation
        blocks:
          - type: paragraph
            body: >
              The buyer and budget owner are usually the company rather than an end consumer. The recurring pattern
              across the sources is CFO-, treasury-, and payments-led adoption: companies need operating accounts,
              large-balance deposits, payments rails, venture or equipment credit, and stablecoin-linked settlement from
              a bank willing to underwrite sectors that traditional institutions still treat cautiously. That helps
              explain why Erebor's market looks wholesale and relationship-driven rather than self-serve and
              mass-market. The bank's addressable workflows also sit at the intersection of regulated banking and crypto
              rails: stablecoin deposits and withdrawals can be a differentiator for crypto and payments firms, while
              AI, defense, and advanced-manufacturing startups are more likely to value high-balance treasury accounts
              and specialized credit than a basic checking product.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
