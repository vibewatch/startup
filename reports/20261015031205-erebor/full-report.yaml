              - CE013
      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              Erebor's differentiation is clear at the narrative level: it wants to be the most regulated stablecoin
              intermediary and a specialist bank for sectors that many incumbents still approach cautiously. That
              positioning is credible insofar as the OCC documents explicitly permit crypto servicing and later
              reporting describes a blend of digital banking, stablecoin rails, and API- oriented treasury services. The
              maturity problem is that public proof lags the ambition. Roadmap features such as crypto-collateralized
              lending or rich API access are described more by outside coverage than by official product documentation,
              and third-party reporting still suggests the operating proof points are stronger for deposits and
              settlement than for scaled lending.
            claimRefs:
              - CE008
              - CE009
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Controls, security, and product-tech risks
        blocks:
          - type: paragraph
            body: >-
              The controls story is directionally stronger than the implementation proof. The OCC conditioned opening on
              a complete information-systems architecture package, an Appendix B information- security program, and
              prior no-objection for the CISO, which indicates regulators view the control stack as a live gating item
              rather than settled infrastructure. The public risk signal since launch points the same way: Erebor's free
              stablecoin conversion offer had to be repriced with fees, limits, and deposit requirements after traders
              arbitraged the workflow. For a bank pitching 24/7 crypto-financial rails, pricing controls, partner
              controls, and incident visibility matter as much as charter status, and those remain under-documented in
              the public surface.
            claimRefs:
              - CE006
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments are explicit, and the operating model is digital-first
        blocks:
          - type: paragraph
            body: >-
              Erebor's public and regulatory materials make its intended customer base unusually explicit for an early
              bank. The OCC plan centers the "innovation economy": virtual-currency, AI, defense, manufacturing,
              payment-service, fund, and trading-firm customers, plus select individuals tied to those ecosystems.
              Prelaunch coverage repeated the same positioning and framed Erebor as a digitally delivered national bank
              for sectors legacy banks often treat cautiously. That matters because the customer story is not "broad SMB
              banking" or consumer retail; it is a concentrated B2B treasury and payments wedge aimed at underserved,
              often higher-balance accounts. The acquisition channel also appears remote and relationship-led rather
              than branch-led, because Erebor's OCC materials describe a no-branch, no-deposit-ATM model while the
              website foregrounds insured banking status rather than a local retail footprint.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
