      - number: '5.2'
        title: Disclosed architecture and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The architecture that is public today is more operating-model disclosure than detailed systems
              documentation. Erebor says it will hold certain virtual currencies on balance sheet to support stablecoin
              or wrapped-stablecoin services and to pay gas fees on supported Layer-1 and Layer-2 blockchains, and it
              plans to pair that with correspondent and international-banking flows. But the same public packet
              repeatedly defers primary system descriptions, vendor arrangements, security components, and process
              flowcharts to confidential exhibits or later supplemental filings. The result is enough evidence to map
              the intended stack, but not enough to verify how the core, custody, or controls architecture actually
              performs in production.
            claimRefs:
              - CE003
