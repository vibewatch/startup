              - CM005
              - CM011
              - CM012
      - number: '2.3'
        title: Sizing lenses, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              The available sizing evidence is a set of partial lenses, not a clean market model. One adjacent lens is
              stablecoin scale: Cryptonews cited a BIS estimate of roughly $320 billion of stablecoin market
              capitalization by May 2026, which frames the broader digital-dollar settlement pool but does not measure
              Erebor's bank revenue opportunity. A closer lens is observed balance-sheet adoption. BankRegReports shows
              $4.06 billion of Q2 deposits, split almost evenly between core and brokered funding, while Cryptonews
              reported $4.17 billion of cash and interbank balances against just $77.8 million of gross loans. Fintech
              Brain Food argues that Erebor's 12% leverage constraint means deposit growth can force new capital raises,
              and BeInCrypto reported that one early stablecoin feature was quickly repriced with fees, limits, and
              deposit requirements after professional traders exploited it. Together, those facts suggest adoption can
              be real and fast without yet proving sticky, diversified, or high-margin market capture.
            claimRefs:
