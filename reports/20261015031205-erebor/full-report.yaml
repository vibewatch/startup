              - CU008
              - CU009
              - CU011
      - number: '6.2'
        title: Aggregate adoption looks strong, but named production proof is still thin
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals are aggregate, not cohort-level. Third-party reporting said deposits
              rose from a March 2026 baseline of about $1.1 billion to roughly $4.05-$4.06 billion by Q2 2026, then to
              more than $7 billion and 500+ customers by early October. That is meaningful evidence that Erebor found
              market pull after launch, especially given the bank's narrow ICP. The main named operating proof is
              Infinite, which launched bank accounts and stablecoin-linked treasury workflows with Erebor handling
              deposits, withdrawals, ACH, and wire services. Public evidence therefore supports real usage and at least
              one live embedded-banking relationship, but it still does not show how many of the 500+ customers are
              active, expanding, or concentrated in any one vertical.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU011
              - CU012
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration remain the chapter's main diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public materials remain weak on durability. The sources reviewed here do not disclose NRR, GRR, churn,
              renewal rates, contract terms, or cohort behavior, so the gap between "customer acquisition" and "customer
              retention" is still unresolved. The adverse evidence also cuts against a simple growth narrative:
              BeInCrypto reported Erebor pulled back free stablecoin conversion for customers without sizable deposits
              and added fees and limits after arbitrage by trading firms, while Fintech Brain Food argued the bank's
              recent deposit growth likely skewed toward wholesale-sized balances. That does not disprove product-market
              fit, but it does suggest the public customer base may be more liquidity- sensitive, large-balance, and
              pricing-aware than a headline customer-count figure implies.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggregate traction is real even if the public ledger is still coarse
            body: >-
              Third-party reporting ties Erebor to a jump from roughly $1.1 billion deposits in March 2026 to about
              $4.05-$4.06 billion in Q2 and more than $7 billion / 500+ customers by early October. That is meaningful
              proof of demand for the bank's niche even though public customer-level denominators are still missing.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability remains unproven
            body: >-
              Public materials still omit NRR, GRR, churn, renewals, cohorts, and top-depositor concentration, while
              adverse reporting shows Erebor tightened free stablecoin conversion for customers without sizable deposits
              after arbitrage. The customer base may be real, but its stickiness and balance distribution remain
              unverified.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              Erebor's public risk profile is unusually top-heavy for a six-to-eight-month-old de novo bank because its
              balance sheet appears to be scaling faster than its operating proof. Independent commentary and competitor
              analysis converge on the same pattern: Erebor has gathered large balances from a narrow set of
              frontier-industry customers, while disclosed lending and public monetization evidence still trail deposit
              growth. That creates a residual risk stack in which liquidity concentration, capital needs, and
              product-control design matter more than classical retail-bank branch or customer-acquisition risks. The
              mitigants are meaningful—high required leverage, a capital-call backstop, and a willingness to add fees
              and limits when a crypto product was gamed—but those mitigants are still early-stage rather than
              time-tested.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
              - CR013
              - CR014
      - number: '7.2'
        title: Regulatory and product-control risks
        blocks:
          - type: paragraph
            body: >-
              Erebor's charter status is a strength, but it also codifies a demanding control burden. Public reporting
              describes a three-year 12% Tier 1 leverage requirement plus a capital-call agreement if capital falls
              below well-capitalized levels, which signals that regulators already view the model as high-risk enough to
              require thicker buffers than a typical bank. The September stablecoin-conversion incident shows the
              operational side of that scrutiny: a customer-acquisition feature that looked attractive for crypto-native
              clients was reportedly exploitable in practice and had to be narrowed with fees, limits, and deposit
              requirements. That does not prove systemic control failure, but it does show that a novel product
              perimeter can create real loss channels before the bank has demonstrated mature control feedback loops in
              public.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR011
      - number: '7.3'
        title: Funding, concentration, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The remaining thesis-break risk is that Erebor's funding, customer, and partner model may be more
              correlated than the headline growth suggests. Public sources describe a small-team institution serving
              defense, AI, crypto, and advanced manufacturing, while partner materials openly note that early investors
              also became customers, referrers, talent connectors, and regulatory door-openers. That network can
              accelerate launch, but it also raises the cost of any future repricing in venture appetite, crypto
              sentiment, or sector-specific regulation. Without public disclosure on depositor concentration, churn,
              loan performance, or examination results, an outside investor still cannot separate durable franchise
              formation from early network-driven growth.
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR012
              - CR013
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              If deposits keep outgrowing capital and lending proof, Erebor can look more like a fragile wholesale
              funding node than a durable specialty bank.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: callout
            title: What the public mitigants actually prove
            body: >-
              The higher leverage floor and quick fee changes show supervisory and managerial responsiveness, but they
              do not yet prove stable economics, sticky deposits, or mature controls under stress.
            calloutType: insight
            claimRefs:
              - CR002
              - CR005
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: |-
              The cleanest read from the retained pool is that Erebor deserves to stay
              on a watchlist, not in a commit-now bucket. Public reporting consistently
              supports real demand: December 2025 reporting tied the company to a $350M
              round at a $4.35B post-money valuation, and 2026 commentary says deposits
              have already moved past $7B while management is exploring a far larger
              financing. What the same pool does not provide is public revenue, margin,
              or credit-performance evidence that would let an outside investor bridge
              demand into a defensible earnings multiple. The most recent visible price
              points also diverge sharply, with Forge showing a much lower valuation
              reference than late-2026 round chatter, so paying up before private
              diligence would mean underwriting momentum rather than audited operating
              proof.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV006
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV016
      - number: '8.2'
        title: Financing context and valuation support
        blocks:
          - type: paragraph
            body: |-
              The disclosed capital stack is still easier to describe directionally than
              precisely. FundedIQ keeps the disclosed total at $350M and notes that a
              March 2026 round had no public amount, while Silicon Valley Investclub
              presents the seed and Series A rounds as roughly $46.5M and $350M and
              estimates dilution at about 15% and 8% respectively. Forge adds useful
              preference detail by showing a 1.0x non-participating, non-cumulative
              Series A security, but its valuation and total-funding fields sit well
              below the later press narratives. Yahoo's summary of FDIC conditions and
              Fintech Brain Food's leverage math both reinforce that new capital is not
              just opportunistic marketing: if deposits are scaling this quickly, fresh
              equity may be needed to keep the balance sheet inside regulatory guardrails.
              That makes a new round plausible, but the public record still does not pin
              down closed 2026 pricing tightly enough to treat the rumored step-up as
              proven fair value.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-breaks
        blocks:
          - type: paragraph
            body: |-
              The bull case is straightforward: Erebor closes something near the rumored
              2026 round, converts rapid deposit inflows into sticky fee and lending
              revenue, and shows that it can serve crypto and frontier-tech clients with
              fewer friction points than incumbents. The bear case is also already
              visible in public evidence. BeInCrypto reports that stablecoin redemption
              pricing was exploited and then repriced with fees and limits, while
              Fintech Brain Food frames the deposit base as wholesale and therefore more
              mobile than headline growth alone suggests. Because Silicon Valley
              Investclub still says public financial figures remain unavailable beyond
              funding and valuation references, the right closing posture is to demand
              private evidence on revenue mix, deposit concentration, credit policy, and
              final round terms before upgrading beyond a disciplined track / research-more
              recommendation.
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV012
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase the rumored 2026 price
            body: >-
              The retained pool can support a watchlist stance, but it does not justify paying an $8B-style price
              without private revenue, loss, and round-term diligence.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV012
              - CV016
          - type: callout
            title: The most visible thesis-break is not demand, but monetization quality
            body: >-
              Rapid deposit accumulation helps the story, yet public evidence already shows product repricing and
              wholesale-balance-sheet questions that could compress valuation if earnings lag.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV016
          - type: callout
            title: The upgrade path requires private proof, not another headline
            body: >-
              A stronger view would need validated round documents, deposit concentration data, revenue mix, and credit
              or fee economics that turn scale into durable returns.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV012
              - CV014
              - CV016
