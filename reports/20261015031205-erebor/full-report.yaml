      - number: '3.3'
        title: The first visible pricing experiment exposed weak economic lock-in
        blocks:
          - type: paragraph
            body: >-
              The only numeric product pricing in the retained competitor pool concerns stablecoin conversion.
              BeInCrypto and Fintech Brain Food report that Erebor initially converted USDC and USDT into dollars at par
              without a fee, while Tether's direct-redemption benchmark was the greater of $1,000 or 0.1%. Professional
              trading firms reportedly exploited small secondary-market discounts, after which Erebor restricted free
              conversion to customers with sizable deposits and introduced volume fees and limits. This episode is
              adverse evidence on moat durability: a headline feature attracted flow, yet sophisticated customers could
              multi-home and arbitrage the subsidy until terms changed. The same reporting characterizes the deposit
              base as wholesale and therefore potentially less sticky than retail funding. No retained source discloses
              general account pricing, realized contract economics, switching costs, renewal behavior, or peer
              discounting, so a full price comparison would be fabricated. The defensible conclusion is narrower: Erebor
              has distribution momentum and a differentiated charter thesis, but public evidence does not yet prove
              durable product lock-in or pricing power.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Product novelty did not prevent immediate arbitrage
            body: >-
              Free stablecoin conversion attracted professional trading activity that reportedly forced fees, limits,
              and deposit conditions. The episode weakens any claim that the feature alone creates durable switching
              costs or pricing power.
            calloutType: risk
            claimRefs:
