  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources describe a layered banking stack, but core system and vendor details remain largely confidential or
      pending supplementary submission.
    data:
      layers:
        - label: Target segments
          detail: Innovation-economy customers the bank is built to serve
          modules:
            - Virtual-currency companies
            - AI companies
            - Defense companies
            - Manufacturing companies
            - Payment providers, funds, and trading firms
            - Select high and ultra-high-net-worth individuals
        - label: Customer-facing bank products
          detail: Disclosed three-year de novo product families
          modules:
            - Credit products
            - Deposit products
            - Stablecoin-related services
            - Treasury management
            - Payments services
            - Card issuance through bank-partnership arrangements
        - label: Crypto transaction layer
          detail: Publicly disclosed crypto-specific operating components
          modules:
            - Hold virtual currencies for stablecoin or wrapped-stablecoin services
            - Hold virtual currencies for Layer-1 and Layer-2 gas fees
            - Crypto-asset custody and execution activity cited through OCC interpretive guidance
        - label: Delivery and settlement layer
          detail: Digital-first operating model rather than branch distribution
          modules:
            - No public branches during de novo period
            - Nationwide service from main office
            - Some global service via foreign-correspondent relationships
            - 24/7 settlement use case described in public materials
        - label: Control and governance layer
          detail: Pre-opening supervisory dependencies
          modules:
            - BSA/AML/OFAC program
            - Appendix B information-security program
            - Prior OCC no-objection for CISO appointment
            - External audit and fidelity coverage
            - Minimum 12% Tier 1 leverage requirement
        - label: Undisclosed or pending infrastructure
          detail: Material pieces the public record still withholds
          modules:
            - Final information-systems and operations architecture
            - Detailed process flowcharts and diagrams
            - Outsourcing terms and vendor agreements
            - Public developer or API documentation
          note: These are known diligence gaps, not inferred completed modules.
