        - Aggressive acquisition feature but economically exploitable
      - - Erebor stablecoin conversion after policy change
        - Volume-based fees and limits; exact schedule undisclosed
        - Conversion retained for customers meeting deposit conditions
        - Free conversion reportedly remained for sizable depositors
        - Packaging now links economics to relationship value
