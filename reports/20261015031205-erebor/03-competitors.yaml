company:
  name: Erebor
chapter:
  number: 3
  title: Competitors
  summary: >-
    Erebor occupies a distinctive but contested intersection: a full-service national bank
    aimed at frontier-technology companies, with stablecoin capabilities that overlap with
    digital-asset banks and infrastructure providers. Reported deposit growth demonstrates
    demand, while the rapid retreat from free stablecoin conversion shows that product
    novelty does not by itself establish durable pricing power.
sections:
  - id: competitive-landscape
    title: The buyer chooses among banks, fintechs, and digital-asset specialists
    body: >-
      Erebor's competitive set is broader than startup-focused neobanks. One independent
      landscape maps traditional and innovation-bank incumbents such as HSBC, First Citizens,
      Stifel, and JPMorgan Chase; startup platforms such as Mercury and Brex; fintech
      infrastructure provider Cross River; and digital-asset specialists including Anchorage
      Digital, Custodia, and Sygnum. A separate crypto-banking analysis adds Circle, Ripple,
      and Paxos as adjacent stablecoin or trust-bank alternatives. The buyer therefore can
      select a full bank, combine a startup account platform with partner institutions, use a
      custody specialist, or retain existing bank and treasury processes. Publicly reported
      scale gives Erebor momentum but not an uncontested position: Fintech Brain Food reported
      deposits above $7 billion and more than 500 customers added in the preceding quarter,
      while FundedIQ reports $350 million raised across two recorded rounds and an 11-50
      employee band. Those are different metrics with different denominators; funding raised
      is not cash available, and neither source establishes profitability or customer
      retention.
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP006
      - CP007
      - CP014
      - CP016
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-trust
    title: Charter breadth and frontier-sector focus are the clearest differentiators
    body: >-
      The strongest positioning distinction in the assigned evidence is Erebor's attempt to
      combine full national-bank scope with stablecoin trading and custody for crypto, AI,
      defense, payments, and advanced-manufacturing customers. BlockBeats contrasts that model
      with Anchorage Digital's institutional custody emphasis and with Circle and Ripple's
      stablecoin and settlement strategies. This gives Erebor a broader product ambition, but
      broad ambition is not the same as demonstrated capability. SQ Magazine reported in
      December 2025 that the FDIC had approved deposit insurance and the OCC had granted
      conditional charter approval; the later retained sources describe Erebor as operating
      nationally, but the pool does not provide primary regulatory documents for this chapter.
      Capability comparisons are therefore deliberately asymmetric: sourced functions are
      stated, and unsupported cells remain unknown. Fintech Brain Food also notes that the
      March call report showed zero loans, leaving the timing, underwriting model, and revenue
      contribution of lending unresolved. The trust advantage depends on operational controls
      and balance-sheet execution, not charter status alone.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP008
      - CP012
    tableRefs:
      - TP002
  - id: pricing-switching-and-moat
    title: The first visible pricing experiment exposed weak economic lock-in
    body: >-
      The only numeric product pricing in the retained competitor pool concerns stablecoin
      conversion. BeInCrypto and Fintech Brain Food report that Erebor initially converted
      USDC and USDT into dollars at par without a fee, while Tether's direct-redemption
      benchmark was the greater of $1,000 or 0.1%. Professional trading firms reportedly
      exploited small secondary-market discounts, after which Erebor restricted free
      conversion to customers with sizable deposits and introduced volume fees and limits.
      This episode is adverse evidence on moat durability: a headline feature attracted flow,
      yet sophisticated customers could multi-home and arbitrage the subsidy until terms
      changed. The same reporting characterizes the deposit base as wholesale and therefore
      potentially less sticky than retail funding. No retained source discloses general
      account pricing, realized contract economics, switching costs, renewal behavior, or
      peer discounting, so a full price comparison would be fabricated. The defensible
      conclusion is narrower: Erebor has distribution momentum and a differentiated charter
      thesis, but public evidence does not yet prove durable product lock-in or pricing power.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP013
      - CP015
      - CP016
    tableRefs:
      - TP003
