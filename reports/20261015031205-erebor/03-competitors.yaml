    title: Product novelty did not prevent immediate arbitrage
    body: >-
      Free stablecoin conversion attracted professional trading activity that reportedly
      forced fees, limits, and deposit conditions. The episode weakens any claim that the
      feature alone creates durable switching costs or pricing power.
    claimRefs:
