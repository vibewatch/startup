  topStrengths:
    - Strong early deposit traction and investor interest suggest the market has demand for the product.
    - A regulated-bank structure gives the company a more durable operating perch than a thin partner-bank overlay.
    - Public reporting shows management is willing to tighten product controls when abuse appears.
  topRisks:
    - Deposit concentration and uninsured funding mix remain hard to quantify from public sources.
    - Public revenue, margin, and loan-performance disclosure is still too thin to underwrite earnings durability.
    - Product-control and stablecoin pricing experiments have already required mid-course correction.
    - Founder attribution and governance details remain partly unsettled in the public record.
  unresolvedGaps:
    - Live product surface, pricing, and support model are not fully auditable from public sources.
    - Verified customer concentration, retention, and deposit mix by cohort remain undisclosed.
    - Management depth, underwriting policy, and control architecture still require private diligence.
