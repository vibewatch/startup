schemaVersion: report-v2
artifact: product-tech
slug: erebor
runDate: 2026-10-15
company:
  name: Erebor
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Erebor's disclosed product is a digital-first national-bank stack for crypto, AI, defense,
    manufacturing, payments, and trading customers, anchored in deposits, payments, stablecoin
    services, and planned credit. The regulatory and capital envelope is visible, but the public
    technical surface is still incomplete: the OCC still requires a final information-systems
    architecture and security plan, and the clearest live workflow in public sources—stablecoin
    conversion—already needed fees and limits after arbitrage pressure.
sections:
  - id: delivered-product-scope
    title: Delivered product scope and target workflow
    body: >-
      Erebor's public charter package is specific about who the bank is for even if it is sparse on
      customer-facing product documentation. The bank is positioned around the "innovation economy":
      virtual-currency, AI, defense, manufacturing, payments, and trading customers, plus select
      wealthy individuals and some foreign banking relationships that need U.S.-dollar access.
      Within that scope, the disclosed product families are deposits, credit, stablecoin-related
      services, and adjacent treasury, payments, and bank-partner card capabilities. That mix makes
      the core workflow less like a consumer neobank and more like a regulated treasury and
      transaction bank for corporates that need both fiat banking and crypto-adjacent settlement.
    claimRefs: [CE001, CE002, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture-and-dependencies
    title: Disclosed architecture and operating dependencies
    body: >-
      The architecture that is public today is more operating-model disclosure than detailed
      systems documentation. Erebor says it will hold certain virtual currencies on balance sheet to
      support stablecoin or wrapped-stablecoin services and to pay gas fees on supported Layer-1 and
      Layer-2 blockchains, and it plans to pair that with correspondent and international-banking
      flows. But the same public packet repeatedly defers primary system descriptions, vendor
      arrangements, security components, and process flowcharts to confidential exhibits or later
      supplemental filings. The result is enough evidence to map the intended stack, but not enough
      to verify how the core, custody, or controls architecture actually performs in production.
    claimRefs: [CE003, CE005, CE006, CE007]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-differentiation
    title: Maturity and differentiation
    body: >-
      Erebor's differentiation is clear at the narrative level: it wants to be the most regulated
      stablecoin intermediary and a specialist bank for sectors that many incumbents still approach
      cautiously. That positioning is credible insofar as the OCC documents explicitly permit crypto
      servicing and later reporting describes a blend of digital banking, stablecoin rails, and API-
      oriented treasury services. The maturity problem is that public proof lags the ambition. Roadmap
      features such as crypto-collateralized lending or rich API access are described more by outside
      coverage than by official product documentation, and third-party reporting still suggests the
      operating proof points are stronger for deposits and settlement than for scaled lending.
    claimRefs: [CE008, CE009, CE011, CE012, CE014]
  - id: controls-and-product-risks
    title: Controls, security, and product-tech risks
    body: >-
      The controls story is directionally stronger than the implementation proof. The OCC conditioned
      opening on a complete information-systems architecture package, an Appendix B information-
      security program, and prior no-objection for the CISO, which indicates regulators view the
      control stack as a live gating item rather than settled infrastructure. The public risk signal
      since launch points the same way: Erebor's free stablecoin conversion offer had to be repriced
      with fees, limits, and deposit requirements after traders arbitraged the workflow. For a bank
      pitching 24/7 crypto-financial rails, pricing controls, partner controls, and incident
      visibility matter as much as charter status, and those remain under-documented in the public
      surface.
    claimRefs: [CE006, CE010, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Deposit and treasury accounts
        - Innovation-economy companies; select UHNW individuals
        - "Chartered and publicly described; customer-facing terms still thin"
        - "Banking wrapper aimed at crypto, AI, defense, manufacturing, and payments clients"
        - "Need pricing, onboarding SLA, and deposit product documentation"
      - - Stablecoin-related services
        - Crypto firms, payment providers, and global treasury users
        - "Live workflow evidence exists, but pricing changed after arbitrage"
        - "Regulated bank model that can hold crypto for stablecoin facilitation and gas fees"
        - "Need supported-token list, reserve mechanics, and conversion policy"
      - - Payments and correspondent flows
        - Domestic and cross-border operators needing USD access
        - "Planned and conditionally approved; public production references limited"
        - "Nationwide and some global service with correspondent-banking angle"
        - "Need partner list, corridor coverage, and live volume metrics"
      - - Credit and card-linked products
        - Companies and eligible individual clients
        - "Planned; public evidence of scaled lending is limited"
        - "Combines lending with stablecoin-aware banking rather than a sponsor-bank stack"
        - "Need underwriting policy, collateral haircuts, and post-launch loan metrics"
    notes: >-
      Status labels distinguish chartered or described capability from publicly verified production
      proof; gaps name the missing external evidence needed to underwrite implementation maturity.
    claimRefs: [CE001, CE002, CE003, CE008, CE010, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - Move between fiat balances and stablecoins
        - "Treasury teams otherwise juggle banks, exchanges, and direct redemption fees"
        - "Erebor offers bank deposits plus stablecoin deposit and withdrawal workflows"
        - "Public sources pitch 24/7 settlement and lower friction than correspondent banking"
        - "Free conversion proved unsustainable and later required fees, limits, and deposit thresholds"
      - - Maintain global USD operating access
        - "International firms depend on correspondent banks and manual treasury operations"
        - "Digital-first national bank with some global service and foreign-correspondent onboarding"
        - "Charter application says stablecoins can support 24/7 settlement year-round"
        - "Public sources do not identify partner banks, corridors, or service levels"
      - - Consolidate operating bank relationship for frontier-tech companies
        - "Companies often split traditional banking, crypto servicing, and payments across providers"
        - "One bank relationship spanning deposits, payments, treasury, and stablecoin-related services"
        - "Specialized targeting of crypto, AI, defense, manufacturing, and trading customers"
        - "No public customer case studies or implementation documentation in the assigned evidence"
      - - Add credit and card capabilities around treasury activity
        - "Corporate customers usually bolt lending and cards onto separate sponsor-bank programs"
        - "Planned credit products plus card issuance through bank-partnership arrangements"
        - "Could reduce vendor sprawl if launched as described"
        - "March call-report commentary still pointed to zero loans, so lending execution remains unproven"
    notes: >-
      Benefit statements preserve source language where possible; where production metrics are absent,
      the table records directional workflow value and states the missing denominator or customer proof.
    claimRefs: [CE001, CE002, CE005, CE008, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - - Compliance and onboarding layer
        - "Supports international banking and foreign-correspondent onboarding through BSA/AML/OFAC controls"
        - "Regulatory approvals, policy build-out, and supervisory no-objection"
        - "Complex onboarding can slow launch or constrain customer mix"
      - - Product-core layer
        - "Combines deposit, credit, payments, treasury, and card-partner workflows"
        - "Confidential business-plan detail and not-yet-public vendor stack"
        - "Public packet is too abstract to verify module maturity or integration depth"
      - - Crypto-operations layer
        - "Uses on-balance-sheet virtual currencies for stablecoin services and gas fees on supported chains"
        - "Supported-chain design, custody/execution controls, and pricing rules"
        - "Pricing leakage and operational loss can appear quickly when workflow assumptions are wrong"
      - - Security and information-systems layer
        - "Requires final architecture submission, risk assessment, security program, external audit, and CISO approval"
        - "Supplemental schematics, vendor diligence, and final implementation artifacts"
        - "Opening can be delayed or constrained if security architecture is incomplete"
    notes: >-
      This is a public-evidence operating map, not a verified internal system diagram; missing
      schematics and vendor disclosures are treated as dependencies rather than filled in from memory.
    claimRefs: [CE003, CE006, CE007, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public sources describe a layered banking stack, but core system and vendor details remain
      largely confidential or pending supplementary submission.
    data:
      layers:
        - label: Target segments
          detail: Innovation-economy customers the bank is built to serve
          modules:
            - Virtual-currency companies
            - AI companies
            - Defense companies
            - Manufacturing companies
            - Payment providers, funds, and trading firms
            - Select high and ultra-high-net-worth individuals
        - label: Customer-facing bank products
          detail: Disclosed three-year de novo product families
          modules:
            - Credit products
            - Deposit products
            - Stablecoin-related services
            - Treasury management
            - Payments services
            - Card issuance through bank-partnership arrangements
        - label: Crypto transaction layer
          detail: Publicly disclosed crypto-specific operating components
          modules:
            - Hold virtual currencies for stablecoin or wrapped-stablecoin services
            - Hold virtual currencies for Layer-1 and Layer-2 gas fees
            - Crypto-asset custody and execution activity cited through OCC interpretive guidance
        - label: Delivery and settlement layer
          detail: Digital-first operating model rather than branch distribution
          modules:
            - No public branches during de novo period
            - Nationwide service from main office
            - Some global service via foreign-correspondent relationships
            - 24/7 settlement use case described in public materials
        - label: Control and governance layer
          detail: Pre-opening supervisory dependencies
          modules:
            - BSA/AML/OFAC program
            - Appendix B information-security program
            - Prior OCC no-objection for CISO appointment
            - External audit and fidelity coverage
            - Minimum 12% Tier 1 leverage requirement
        - label: Undisclosed or pending infrastructure
          detail: Material pieces the public record still withholds
          modules:
            - Final information-systems and operations architecture
            - Detailed process flowcharts and diagrams
            - Outsourcing terms and vendor agreements
            - Public developer or API documentation
          note: These are known diligence gaps, not inferred completed modules.
    approximationNotes: >-
      The figure is constrained to public disclosures and flags confidential or pending components as
      explicit gaps instead of inferring hidden architecture.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007, CE013]
