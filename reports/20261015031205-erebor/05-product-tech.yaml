  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public API documentation, repository activity, package metrics, or an official status surface showing how external developers or operators actually integrate with Erebor.
      whyItMatters: Without a verifiable developer surface, it is hard to judge implementation maturity, integration friction, or operational transparency for a bank that is marketed as digital-first and API-aware.
      diligencePath: Request current API docs, sandbox access, a status page, and any external integration references from management or launch customers.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: technical-architecture
      missingEvidence: The final information-systems architecture, risk assessment, vendor map, and security design that the OCC requires before opening.
      whyItMatters: The product thesis depends on secure movement between fiat, stablecoins, and correspondent-bank workflows, but the public record withholds the core technical implementation details.
      diligencePath: Obtain the finalized architecture package, outsourced-service inventory, and control narratives prepared for the pre-opening examination.
      relatedQuestionRefs: [QE003, QE006]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: operational-reliability
      missingEvidence: Public uptime, incident, SLA, corridor, and customer implementation evidence for deposits, payments, and stablecoin workflows.
      whyItMatters: Product-market fit for a transaction bank depends on dependable operating performance, not just charter approval or fundraising momentum.
      diligencePath: Ask for launch KPIs, incident summaries, status reporting, and at least two named production customer references by workflow.
      relatedQuestionRefs: [QE004, QE007]
      relatedTableRefs: [TE001, TE002]
