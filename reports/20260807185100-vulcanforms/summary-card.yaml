      are not public.
    - >-
      Factory-model capital intensity, site dependency, and qualification drag can compress returns even if the
      strategic thesis is right.
    - Regulatory, safety, and permit complexity remain material as the Massachusetts footprint expands.
    - >-
      Public custom-manufacturing and AM comparables show that scale does not automatically translate into clean
      profitability.
  unresolvedGaps:
