  rows:
  - - Qualified production parts
    - Integrated additive + machining + inspection workflow
    - Program / production purchase order
    - Core company positioning is public; recognized revenue undisclosed
    - Medium — real manufacturing output appears likely, but realized scale is not disclosed
    - Request trailing 24-month revenue by part family and customer
  - - Qualification / NPI work
    - Engineering-led part development and process qualification
    - Milestone / engineering engagement
    - Implied by regulated end-market positioning; no explicit pricing or volume disclosure
    - Medium-low — important entry wedge but may not recur cleanly
    - Request qualification-to-production conversion rate and NRE recovery policy
  - - Software / traceability layer
    - Workflow, monitoring, and production-software support around manufacturing programs
    - Bundled platform component
    - Software is marketed publicly, but standalone software revenue is not disclosed
    - Unknown — could support margin expansion, but public attach rate is absent
    - Request whether software is billed separately and request software ARR or service mix
  - - Repeat production programs
    - Ongoing manufacturing after qualification
    - Purchase-order / supply agreement
    - Management and third parties describe scaled industrial production, but no backlog schedule is public
    - Potentially high if repeat orders dominate; currently unverified
    - Request repeat-order share of bookings and average program duration
  - - Capacity-resilience programs
    - Domestic-supply-chain and defense-oriented manufacturing capacity
    - Strategic sourcing / framework style relationships
    - Public rhetoric emphasizes reshoring and secure supply chains, not commercial terms
    - Medium — likely strategic, but pricing and margins remain opaque
    - Request contract structures, committed volumes, and SLA terms
