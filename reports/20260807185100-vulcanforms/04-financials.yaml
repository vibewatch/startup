- id: pricing-opacity-and-sales-motion
  title: Pricing Opacity, GTM Motion, and Sales-Efficiency Proxies
  body: 'Public evidence implies a high-touch, engineering-led go-to-market motion. Vulcan markets end-use, qualified parts and integrated manufacturing rather than transparent catalog pricing, which usually means commercial terms are negotiated program by program. That is consistent with the industries it targets: aerospace, defense, medical, and semiconductor buyers normally require qualification, documentation, machining, inspection, and production transfer support before volume revenue becomes repeatable. The same evidence suggests pricing power may come from avoided handoffs and domestic supply-chain resilience rather than from raw machine-hour arbitrage alone. However, the public record is nearly silent on the operating metrics that would tell an investor whether this GTM motion is efficient. No retained source discloses ASP per part family, engineering NRE recovery, qualification-to-production conversion rates, CAC, payback, or NRR. Even the stronger third-party sources mainly restate
    the financing event and employee footprint. The practical implication is that Vulcan may have attractive strategic accounts, but those accounts could still be expensive to win and serve if qualification cycles are long and program-specific engineering remains labor-intensive. Investors need customer cohort economics, production-ramp timelines, and evidence that repeat orders meaningfully outrun upfront enablement cost.'
  claimRefs:
  - CI010
