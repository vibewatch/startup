  - - Debt, leases, and vendor financing
    - Subordination and fixed commitments change downside risk
    - Medium
    - Request debt schedule, lease obligations, and equipment-financing agreements
  notes: These are the principal blockers to a fully underwritten financial view as of the 2026-08-07 run date.
