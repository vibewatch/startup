- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'Vulcan''s financial story is investable only if one separates what is actually public from what is merely suggestive. Public evidence supports a strong financing record, visible state-backed expansion, a broad end-market narrative, and meaningful organizational scale for a private advanced-manufacturing company. Public evidence does not support a clean view of recognized revenue, recurring revenue, gross margin by workflow step, working-capital intensity, or runway. That means the most important debate is not whether Vulcan has demand; it is whether the integrated-factory model converts demand into attractive unit economics before another major capital raise is required. The best diligence questions are therefore concrete: trailing twenty-four month revenue by end market and by process step; backlog and conversion cadence; additive-printer and machining-cell utilization; yield, scrap, and rework rates; blended and segment gross margins; cash balance after the 2026 financing; and
    the share of bookings that come from repeat production rather than funded experimentation. Until those metrics are produced, the right underwriting stance is that Vulcan has more commercial substance than a typical pre-revenue hardware startup but still carries meaningful financial-opacity risk relative to the amount of capital already raised.'
