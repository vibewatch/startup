    - Without it, valuation and revenue quality cannot be underwritten
    - High
    - Request audited revenue split across printing, machining, software, inspection, and engineering
  - - Gross margin by workflow step
    - Integrated manufacturing can hide loss-making steps inside blended reporting
    - High
