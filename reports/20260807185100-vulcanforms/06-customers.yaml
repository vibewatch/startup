figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: VulcanForms' visible customer path starts with a difficult geometry or supply-chain problem, moves through qualification and low-volume proof, and only later has a chance to become repeat production revenue.
  data:
    items:
    - label: Problem discovery
      detail: Customer has a metal part with complexity, tolerance, qualification, or supply-chain constraints that traditional workflows handle poorly.
    - label: Technical evaluation
      detail: Vulcan helps with materials selection, design, manufacturability, and build-prep logic.
    - label: Qualification / first articles
      detail: Early builds prove geometry, properties, post-processing route, and inspection pathway.
    - label: Repeat production opportunity
      detail: If the part family passes qualification, the account can expand into additional volume or adjacent applications.
    - label: Long-term relationship
      detail: The goal is to grow the relationship over time as manufacturing capabilities become more important to the customer.
  approximationNotes: The map is synthesized from MIT, 3DPrint, and official workflow descriptions rather than from disclosed CRM stages.
  claimRefs:
  - CU006
  - CU015
  - CU016
  - CU017
