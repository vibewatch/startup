- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AM Forward and domestic-sourcing policy
    - Positive
    - Current / medium term
    - Large OEMs are being nudged to train, qualify, and buy from U.S.-based additive suppliers
    - Which OEM-led programs or prime pathways has Vulcan already entered?
  - - DoD OIB modernization challenge
    - Positive
    - Current / medium term
    - Defense manufacturing modernization budgets explicitly call out additive, robotics, sensors, and quality tooling
    - Has Vulcan participated in or benefited from OIB/ManTech-related programs?
  - - JAQS-SQ supplier qualification infrastructure
    - Positive
    - Current / medium term
    - Defense AM supply becomes more scalable when qualification is standardized
    - What part families or facilities are already aligned to JAQS-style qualification requirements?
  - - Compute and thermal-complexity growth
    - Positive
    - Current
    - Higher power density increases demand for complex heat-transfer parts that fit Vulcan's compute positioning
    - What percentage of current bookings comes from thermal-management use cases?
  - - Medical adoption in complex devices
    - Positive
    - Current / long term
    - Established additive categories prove regulated demand exists for metal devices
    - Which medical applications have already moved from prototyping to repeat production?
  - - Bespoke validation and contamination burdens
    - Negative
    - Current
    - Medical and semiconductor programs can stall even when geometry fit is strong
    - How long does qualification take by vertical and by material family?
  - - Defense procurement and supplier-approval cycles
    - Negative
    - Medium term
    - Market demand may be real but monetization can lag because approved-supplier status takes time
    - What is the backlog split between qualified repeat work and pre-qualification pilots?
  - - Additive capex cyclicality / industry downturn
    - Negative
    - Current
    - Broad AM-market weakness can delay customer investment even when long-term demand is favorable
    - How resilient is Vulcan to slower customer capex or longer production ramps?
  notes: The market is helped by policy, qualification infrastructure, and complex-part demand, but slowed by the fact that every high-value vertical imposes a different trust-and-validation burden before production budgets convert.
