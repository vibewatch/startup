- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Process
  - Role
  - Dependency
  - Risk
  rows:
  - - Multiple-laser LPBF hardware
    - Core metal-part formation engine
    - Lasers, optics, powder handling, thermal stability
    - Beam-control complexity can undermine throughput
  - - Build-plate thermal management
    - Controls part quality and flatness
    - Heating sectors, clamping, thermal interfaces
    - Thermal instability can hurt repeatability
  - - Build-prep / slicing software
    - Converts geometry into scan patterns
    - Software correctness and process libraries
    - Bad parameters can create hidden yield problems
  - - In-process sensing / monitoring
    - Observes builds in real time
    - Sensors, control logic, data retention
    - Monitoring may not prevent failures without intervention logic
  - - Machining / automation / assembly
    - Converts blanks into finished parts
    - CNC capacity, tooling, robotics, labor
    - Downstream bottlenecks can erase printer-speed advantage
  - - Validation / traceability
    - Supports auditable delivery
    - Inspection systems, serialization, process records
    - Weak QA data breaks customer qualification
  notes: Dependencies and risks are derived from product pages, patents, and recruiting evidence.
