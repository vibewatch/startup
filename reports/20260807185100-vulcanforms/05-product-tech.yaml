company:
  name: VulcanForms
chapter:
  number: 5
  title: Product & Technology
  summary: 'VulcanForms'' product is a vertically integrated manufacturing system: proprietary LPBF printers, software for build prep and closed-loop monitoring, and downstream machining/inspection that turn prints into production-ready metal parts. Public evidence is unusually concrete on architecture and process controls, reinforced by MIT reporting and Google Patents around multiple-beam additive manufacturing and build-plate control. The main diligence gap is execution proof: uptime, yield, certification depth, and software/security assurance.'
sections:
- id: product-definition-and-customer-workflow
  title: Product Definition in Customer Workflow Terms
  body: 'VulcanForms does not market a single isolated machine. Its public materials and MIT coverage describe a manufacturing platform that begins with customer design and material selection, moves through proprietary LPBF printing, and ends with machining, quality control, and traceable finished-part delivery. That framing matters because buyers in aerospace, defense, medical, compute, and semiconductor manufacturing usually care less about access to a printer than about whether a difficult geometry can be manufactured repeatedly inside a controlled production value stream. The technical value is therefore workflow ownership: build prep, slicing, in-process sensing, centralized control, CNC finishing, and digital traceability all exist to reduce handoffs and make production repeatable rather than artisanal.'
