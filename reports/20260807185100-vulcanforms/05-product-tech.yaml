- id: architecture-and-module-map
  title: Architecture and Module Map
  body: The public architecture is four-layered. First is the LPBF hardware layer, now marketed around GEN 3, a 40kW metal printer using 75 lasers at 550W for industrial-scale output. Second is the process-software layer, which Vulcan says covers build prep, slicing, monitoring, process control, and end-to-end traceability. Third is the downstream production layer built around machining, robotics, and assembly; the precision-machining page says the subtractive facility integrates more than 60 CNC machines. Fourth is the application layer, where the stack is specialized into compute, medical, and semiconductor use cases through materials and validation workflows. Patents add technical depth by showing claimed IP around multiple-beam additive manufacturing and build-plate heating/mounting.
