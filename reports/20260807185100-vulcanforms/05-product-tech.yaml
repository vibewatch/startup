- id: maturity-deployment-and-roadmap
  title: Maturity, Deployment, and Roadmap Signals
  body: Public evidence shows meaningful maturity signals, but not enough to remove scale-up risk. The current site says GEN 3 runs 24/7, produces fully dense parts with micron-level precision, and is centrally monitored in real time. MIT's 2022 profile described an earlier stage with synchronized laser arrays, hundreds of weld tracks per layer, and up to 100 kilowatts of collective power in the foundry. Read together, those sources suggest real technical progression from early foundry vision into a more packaged platform story, though public spec language has also evolved and should not be treated as a stationary benchmark. 2026 financing coverage that says demand exceeds capacity is positive if true, but it makes uptime, yield, and utilization the key diligence questions. Public spec language also leaves open whether different facilities operate the same configuration or a mixed installed base.
  claimRefs:
