    - Fewer handoffs and faster iteration
    - Benefit is directional, not audited
  - - Produce compute thermal hardware
    - Complex internal channels are hard to fabricate conventionally
    - LPBF plus machining for heat exchangers and cold plates
    - Supports complex geometries
    - Named customer proof is limited
  - - Manufacture medical implants and tools
    - Medical parts require biocompatible alloys and repeatability
    - Titanium / stainless / cobalt-chrome additive plus finishing
    - Supports custom implants and tools
    - Named certification evidence not retained
  - - Scale defense / industrial parts domestically
    - Secure domestic sourcing is fragmented
    - Domestic integrated production with QA controls
    - Improves resilience narrative
    - Program-level qualification depth is not public
  - - Ramp repeat production after qualification
    - Pilot-to-production handoff often breaks across vendors
    - Centralized process control across additive and subtractive steps
    - Potentially better repeatability
    - Need conversion, scrap, and uptime metrics
  notes: Public evidence is stronger on workflow definition than on realized benchmark performance.
