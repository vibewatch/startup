  topStrengths:
    - 航空航天、国防、医疗和其他高规格制造垂直领域带来庞大且增长中的市场敞口。
    - 增材制造、机加工和软件一体化堆栈，构成超越单一机器 SKU 的潜在护城河。
    - 重大融资和州政府支持的扩张，显示投资人和政策端对平台有真实信心。
