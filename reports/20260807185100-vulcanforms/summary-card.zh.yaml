    - 准确的 2026 年投后估值和股权结构表条款未公开，估值信号只能依赖分析师和二手来源。
    - 即便战略逻辑成立，工厂模式的资本强度、场地依赖和认证拖累也可能压缩回报。
    - Massachusetts 产能版图扩张后，监管、安全和许可复杂度仍然重大。
