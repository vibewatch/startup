      - number: '8.4'
        title: 牛市、基准、熊市情景与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              在这里，情景框架比虚假的精确性更有用。牛市情景下，VulcanForms
              把一体化栈变成规模化安全生产平台，在航空航天、医疗、半导体及相邻项目中拿到持久产量，最终支撑数亿美元收入和溢价经济性。基准情景下，公司战略上成功，但认证周期、产能增加和固定成本杠杆压住回报，价值增长较慢。熊市情景下，认证转化变慢、站点利用率缺口、价格压力或追加融资中的某种组合，会显著削弱回报。关键观察是，$1
              billion 风格的入场点已经吃掉了大量未来成功。公开证据还不足以断言牛市情景会发生，但足以说明，如果当前经济性弱于市场信号所暗示，熊市情景就是真实的。这种不对称支持有纪律的耐心。
