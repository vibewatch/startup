    claimRefs:
      - CR004
      - CR015
      - CR016
      - CR023
      - CR036
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议取决于市场增长和护城河是否真实，但当前价格支撑仍缺证据。
    data:
      nodes:
        - id: n1
          label: 增长中的 AM 市场
          detail: 3D 打印和金属需求规模大且在增长
        - id: n2
          label: Vulcan 护城河逻辑
          detail: 增材 + 机加工 + 软件一体化栈
        - id: n3
          label: 客户 / 经济性不透明
          detail: 收入、利润率、集中度和股权结构条款仍未公开
        - id: n4
          label: 公开可比公司约束
          detail: 规模化同业收入更清楚，但仍面临盈利能力审视
        - id: n5
          label: 当前价格信号
          detail: ~$1B 级别私募估值已经需要实质证据支撑
        - id: n6
          label: 估值立场
          detail: 缺少当前经济性证据时偏高
        - id: n7
          label: 建议
          detail: 观察 / 继续研究
      edges:
        - - n1
          - n6
        - - n2
          - n6
        - - n3
          - n6
        - - n4
          - n6
        - - n5
          - n6
        - - n6
          - n7
    claimRefs:
      - CV001
      - CV009
      - CV019
      - CV035
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 即便按宽松的倍数假设，$1B 参考估值也需要相当大的收入支撑。
    data:
      items:
        - label: 3x 收入倍数
          value: 333.3
        - label: 5x 收入倍数
          value: 200
        - label: 8x 收入倍数
          value: 125
        - label: 10x 收入倍数
          value: 100
        - label: 12x 收入倍数
          value: 83.3
    approximationNotes: 各项数值表示在对应倍数下支撑 $1B 估值所需的收入，单位为百万美元。
    claimRefs:
      - CV020
      - CV021
      - CV023
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以 $1B 左右价格进入后，未来价值结果高度不对称，取决于 Vulcan 能否跑出规模化制造经济性。
    data:
      items:
        - label: 悲观情景
          low: 320
          high: 720
        - label: 基准情景
          low: 900
          high: 1750
        - label: 乐观情景
          low: 2450
          high: 5000
    approximationNotes: 各项数值是由宽口径收入和倍数区间推导出的隐含未来股权价值，单位为百万美元，并非折现现金流输出。
    claimRefs:
      - CV025
      - CV026
      - CV027
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会式打分看好市场和护城河，但估值支撑和证据质量偏弱。
