      - number: '3.3'
        title: 商业模式、包装、定价不透明度与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个品类几乎所有公司的公开定价都不透明。EOS、Nikon、ATLIX 和 3D Systems
              的主流包装模式，仍是资本开支型设备销售，加材料、支持和认证服务，商业条款通过报价处理。这让直接同口径价格比较变得困难，也把竞争推向非价格变量：参数自由度、认证支持、正常运行时间、软件集成和本地服务能力。Velo3D
              更灵活，因为它可以卖设备，也可以把客户导入 Rapid Production Solutions，降低前期产能投资需求。Seurat 在这个方向走得最远，要求买方买零件而不是硬件。Digital Metal
              历史上两边都做：卖过打印机，也提供小批量和量产打印服务。


              这些包装差异会制造真实切换成本。一旦买方认证了某台设备、参数集、材料和后处理路径，或批准了某个具备已验证文档的制造伙伴，更换供应商的门槛就会急剧上升。EOS 和 Nikon
              都通过认证和参数控制语言明确这一点；3D Systems 强调监控和检测；Velo3D 依赖 Golden Print File；Vulcan
              则依赖一体化生产可追溯性。结果是，市场存在价格压力，但尚未完全商品化。买方可能多宿主使用多个供应商，却很少愿意在没有明显成本、速度、几何或韧性优势时重启认证。
