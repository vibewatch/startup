      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              VulcanForms
              三个公开垂直领域的买方图谱并不均质。国防领域里，实际买方通常是主承包商、项目办公室、维修基地或认证机构，他们寻找的是有韧性的美国本土供应，而不是绝对最便宜的零部件。预算所有权可能落在主承包商采购团队、国防项目办公室或更宽的现代化预算里；采用取决于供应商能否通过认证和过程控制门槛。White
              House 的 AM Forward 计划和 America Makes 的 JAQS-SQ 认证项目都强化了这一点：瓶颈常常是供应商准备度、标准和导入，而不是对增材制造的原始认知。


              医疗买方行为不同。终端客户通常是器械 OEM 或合同制造组织，但实际用户横跨研发、监管、质量和运营。FDA
              材料清楚说明，增材采用可以真实且持久——助听器和金属脊柱融合笼已经是成熟案例——但每个项目仍要走完软件工作流控制、材料可追溯、后处理、清洗、无菌和最终器械测试。计算和半导体买方更由工程驱动。用户是基础设施、热管理或设备设计团队；付款方可能在先进制造、产品线或
              资本开支预算里；采用触发点往往是传统制造难以干净解决的热管理或几何问题。Vulcan 自己的计算页面、Mordor 的半导体 AM 报告和 3D Systems
              的数据中心评论都指向同一模式：功率密度、冷却复杂度和迭代速度同时上升，需求就会增长。
