        title: 成本结构、CapEx 与经营杠杆争议
        blocks:
          - type: paragraph
            body: >-
              公司披露的扩张计划让人很难把 Vulcan 说成轻资本制造企业。2026 年 Massachusetts 批准超过 $21M EDIP 税收抵免，用于支持 Vulcan 在 Devens
              的项目；项目描述为最高一百万平方英尺、1,063 个新增岗位。管理层还表示，2026 年 1 月融资将支持未来产能扩张、材料组合工作和技术路线图继续执行。这组信息指向一套成本栈，可能包括昂贵金属 AM
              设备、机加工产能、检测和自动化系统、工程人员、质量体系、设施，以及粉末、零件和 WIP 所需营运资本。上市公司类比也强化这一点。3D Systems 2026
              年业绩显示，即便是一家大得多的增材平台，仍承受毛利率压力，盈利能力只是正在改善；Velo3D 2026 年备案显示，这家更小金属 AM 同行季度收入 $13.8M、毛利率 17.2%、季度经营现金消耗
              $18.0M，并计划 2026 年资本开支为 $40M-$50M。Vulcan
              与这两家公司经济性并不完全相同，但二者都强化了同一条投资判断信息：量产级金属增材制造可能在利润率稳定前吞掉大量资本。缺失的问题是，Vulcan
              垂直整合工作流在已认证零件进入重复生产后，是否能创造明显更好的吞吐、良率或定价。
