      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点并不难讲。市场报告显示，全球和北美 3D 打印机会在增长，金属 AM 和服务受益于航空航天、国防、医疗以及其他高规格需求。VulcanForms
              的垂直整合生产模型，加上专利足迹，构成了可信的护城河，尤其是在本土供应链韧性和严公差很重要的应用中。反论点也几乎同样直接。公开证据没有给出足够当前经济性证明，不能把公司当成完全风险出清的平台。客户保密、长认证周期、固定成本杠杆和监管
              / 合规复杂度，都会抬高溢价定价门槛。即使是支持性的公开可比公司，也不能证明价格合理；它们更多说明，投资者通常要看到多少运营证明，才会放心付溢价。核心结论是：商业论点可能成立，但估值仍然吃力。
