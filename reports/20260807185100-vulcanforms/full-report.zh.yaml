chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、使命和生产模式
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 把自己定位成制造公司，而不是独立设备供应商或原型车间。从官网、媒体资料到 2026 年 1
              月融资新闻稿，公司反复称自己是美国第一家全栈一体化数字金属制造平台，目标是把碎片化、多供应商的金属供应链压缩成一条美国本土、量产级工作流。官方叙事围绕制造回流展开：管理层认为，关键任务金属零件不该再穿过多个国家和供应商；美国本土数字优先生产可以更好控制交期、减少浪费，也能强化供应链安全。


              运营模式不是卖一台设备，而是把增材制造、精密机加工、自动化、检测和自有软件拼在一起。官方产品页展示了技术栈前端：GEN 3 金属 LPBF 打印机，标称 40 kW 系统，使用 75 路 550 W
              激光器；集中控制系统实时跟踪打印作业；软件模块覆盖 DFAM、切片、仿真、过程内监控和可追溯性。MIT 2022 年报道印证了核心技术论点：VulcanForms 自建激光阵列 LPBF
              架构，并把它与机加工、机器人和后处理整合；真正的工业价值来自这条一体化数字线程，而不只是打印机功率。


              这种全栈定位有战略意义，因为 VulcanForms 想掌控从粉末到成品零件的生产价值流，而不是只在设备销售上竞争。公司页面和投资方背书的公告称，平台已经嵌入医疗、国防、航空航天、计算 /
              半导体、消费和工业应用的客户工作流。因此，需要证明的不是 VulcanForms 能否打印出一个零件，而是这套组合工厂系统能否按其美国本土再工业化叙事所暗示的速度和经济性，持续交付可重复、可认证的产出。
