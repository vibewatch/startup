      - number: '6.5'
        title: 客户结论与尽调优先级
        blocks:
          - type: paragraph
            body: >-
              客户结论：相关性强，可衡量性弱。VulcanForms 显然服务于真实工业用例，而传统制造往往难以解决这些问题：带微观内部通道的冷却零件、医疗植入物几何形态、航空航天 / 国防硬件，以及其他受益于增材 +
              机加工一体化流程的零件。问题不是公开客户相关性不足，而是公开客户分析不足。投资者仍需要头部客户名称、按垂直划分的收入、零件族集中度、从认证到重复生产的转化、复购率、合同期限，以及最大项目能顶住价格或认证压力的证据。在这些数据给出之前，正确的客户判断是：VulcanForms
              在一小组高价值细分市场里似乎有强产品市场匹配，但集中度和留存仍有显著不透明风险。
