  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 不属于一个清晰的软件或设备单一类别。最接近的定位，是面向复杂、认证负担重零件的量产级金属增材制造；但公司明确销售的是把
              LPBF、机加工、监控和可追溯性结合起来的一体化工作流，而不只是打印机。官方行业页面把这套工作流锚定在三个对投资判断重要的公开垂直领域：国防、医疗和计算。在这些领域，纳入支出不是工厂自动化的每一美元，而是金属零部件支出的一个子集：复杂几何、短交期、美国本土采购或供应商认证，让数字化生产具备结构性吸引力。Vulcan
              的计算页面尤其有信息量，因为它把产品映射到换热器、液冷冷板、高导热结构和半导体制造部件——这些任务里，热性能和几何形状比大宗单件价格更重要。


              因此，最好的市场边界应排除通用报告里常见的大部分简单「3D 打印 TAM」叙事。它不应包括聚合物打印、宽泛 PLM /
              软件预算、大众消费设备，或传统铸造、锻造、机加工已经在成本上占优的高产量大宗制造。真正的现状竞争者，是传统海外供应链，或碎片化美国本土供应链：它们把铸造 / 锻造、CNC
              精加工、检测和认证拆给多个供应商再拼接。McKinsey 较早但仍有参考价值的制造业框架，也解释了这个细分市场为何存在：当买方需要备件、小批量生产、工装，或传统方法难以处理的几何形状时，增材制造最有经济吸引力。对
              VulcanForms 而言，只有先设定这个更窄、更高价值的边界，市场规模才有意义。
