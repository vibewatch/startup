      - number: '8.5'
        title: 可比公司集合与市场参照
        blocks:
          - type: paragraph
            body: >-
              可比公司集合必然混乱，因为 VulcanForms 夹在多个类别之间。Xometry 和 Protolabs 是最相关的“定制制造平台”可比公司，但它们更偏市场平台或服务，也比 VulcanForms
              披露更多收入细节。Materialise 展示了软件、服务和医疗应用多元化后，长期增材规模可能长成什么样。3D Systems 和 Velo3D
              更接近核心增材制造，但它们也说明，在公开市场里，利润率压力、亏损和融资需求可能持续存在。市场研究来源以另一种方式有帮助：它们确认整体类别庞大且在增长，服务和金属 AM
              占据有意义的子细分。合在一起看，可比集合不能证明 VulcanForms 被高估；但它显示，投资者通常会先拿到清晰得多的收入和利润率可见性，然后才有信心为溢价定价辩护。
