        title: 定价不透明、GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据暗示，高接触、工程主导的市场拓展动作。Vulcan
              营销的是终端使用、已认证零件和一体化制造，而不是透明目录定价；这通常意味着商业条款按项目逐一谈判。这与其目标行业一致：航空航天、国防、医疗和半导体买方通常要求认证、文档、机加工、检测和生产转移支持，之后批量收入才会变得可重复。同一组证据也说明，定价权可能来自减少交接和美国本土供应链韧性，而不只是原始机时套利。不过，公开记录几乎没有披露能让投资者判断这套
              GTM 动作是否高效的运营指标。已保留来源没有披露每个零件族 ASP、工程 NRE 回收、认证到量产转化率、CAC、回本周期或 NRR。即便较强的第三方来源，也主要复述融资事件和员工规模。实际含义是，Vulcan
              可能有吸引力强的战略客户，但如果认证周期长、项目专属工程仍然吃人力，赢得并服务这些客户仍可能很贵。投资者需要客户群组经济性、生产爬坡时间表，以及重复订单明显跑赢前期赋能成本的证据。
