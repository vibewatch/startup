  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 不营销单台孤立设备。公开材料和 MIT 报道描述的是一个制造平台：从客户设计和材料选择开始，经过自有 LPBF
              打印，最后交付经过机加工、质量控制且可追溯的成品零件。这种框架很重要，因为航空航天、国防、医疗、计算和半导体制造买方，通常不太关心能否接触到一台打印机，而更关心困难几何能否在受控生产价值流内反复制造出来。因此，技术价值在于工作流所有权：构建准备、切片、过程内传感、集中控制、CNC
              精加工和数字可追溯性，都是为了减少交接，让生产可重复，而不是像手工艺一样依赖个体经验。
