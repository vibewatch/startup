      - number: '7.4'
        title: 人员、客户与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              风险图谱中较软的一面仍然重要，因为 VulcanForms 正试图从突破性制造能力转向可重复的工业执行。2024 年 CEO
              和总裁任命，为公司搭起了面向下一阶段的运营领导结构；但在公司加速扩厂、招聘和客户项目的同一时点，这也引入了过渡风险。公开报道仍持续强调 John Hart
              的技术和战略角色，说明机构知识仍集中在小型创始圈层。客户不透明又放大了这一点。公开来源显示细分市场相关性强——医疗植入物、冷却零件、航空航天和国防硬件——但具名账户很少，没有合同期限披露，也没有公开集中度指标。财务上，公司的私有状态意味着投资者无法直接检验产能利用率、单位经济性或营运资本效率。因此，新融资应被视为时间和选择权，而不是规模经济已经稳固的证明。
