      - number: '7.5'
        title: 缓释措施、监控指标与否决条件
        blocks:
          - type: paragraph
            body: >-
              处理 VulcanForms 风险，最有用的办法是把风险翻译成可监控的尽调条件。一些缓释因素已经可见：公司增加了新领导层，投入 HSSE 治理，公开强调软件驱动监控和一体化生产控制，并获得新融资和
              Massachusetts
              激励支持。这些都是真实正面因素。但它们都不能替代数据。如果许可或审计准备度跟不上扩张，关键站点成为瓶颈，旗舰客户项目无法从认证转入重复生产，或在产能利用率证明经营杠杆之前又需要追加融资，投资论点会很快变弱。因此，优先尽调包应要求精确许可清单、OSHA
              和事故日志、供应商冗余地图、头部账户集中度、按项目划分的在手订单、站点级良率和稼动率指标，以及围绕运营取舍的明确治理权。在拿到这套材料前，正确投资姿态是选择性跟踪，而不是盲目承销。
