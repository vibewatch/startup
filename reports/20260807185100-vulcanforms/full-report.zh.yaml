  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式，以及公开牵引力真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              VulcanForms
              看起来通过一体化制造平台变现，而不是纯软件或纯设备公司。公开材料把增材制造、精密机加工和软件描述为一条美国本土生产工作流中的组成部分；行业页面和员工数聚合器则称，公司服务航空航天、国防、医疗、计算和半导体项目。这支持一种收入模式：围绕已认证零件生产、工程密集型项目爬坡，以及零件族获批后的后续制造工作展开。问题在于，这些公开证据证明的是包装和市场重点，不是已实现收入。公司官网和
              2026 年融资新闻稿都没有披露年收入、毛利率、在手订单转化，或增材打印、机加工、软件、检测之间的收入拆分。第三方数据库和简介网站提供融资和员工数估计，但仍没有可审计的利润表。因此，正确的财务解读是：Vulcan
              公开证明了真实商业活动和客户相关性，但没有公开证明已确认收入的规模或质量。尽调需要按收入流拆分收入、头部客户集中度、按生产单元划分的产能利用率，以及来自重复生产而非一次性认证或 NPI 工作的收入占比。
