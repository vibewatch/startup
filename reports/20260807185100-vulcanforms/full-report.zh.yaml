      - number: '1.2'
        title: 领导层交接与治理轮廓
        blocks:
          - type: paragraph
            body: >-
              2024 年一手来源显示，VulcanForms 通过高层管理交接进入新的运营阶段。PR Newswire 于 2024 年 9 月 23 日报道，Kevin Kassekert 出任首席执行官，Jay
              Martin 加入担任总裁；公司和行业媒体都把这次变化描述为 VulcanForms 从试点规模运营迈向更高产量生产的一部分。Kassekert 带来 Redwood Materials 和 Tesla
              经历，包括大型工厂爬坡和基础设施执行经验；Martin 则带来 Globus Medical 的商业化和规模化经验。John Hart 仍以联合创始人和董事会成员身份公开露面，公司称 Martin
              Feldmann 是最初的技术和公司搭建负责人，他的工作奠定了平台基础。


              相比正式治理机制，官方公司页面更清楚地展示了运营团队。About 和媒体页面列出 Tom Pacheco 为 CFO、John Conway 为 COO、Katie O'Kelly 为首席质量官、Melissa
              Hoang 为首席人事官。网站可见的董事会简介包括 Eclipse 的 Greg Reichow、Stata Venture Partners 的 Ray Stata，以及 Eclipse 的 Lior
              Susan。信息足以确认投资人和工业运营者的影响力，但不足以还原投票控制、董事会委员会结构或保护性条款。公司也未公开披露完整股权结构、独立董事构成或继任规划框架。


              因此，治理图景可信但只透明了一半。VulcanForms 桌边有可识别的制造业和投资运营者；2024 年 CEO
              交接也显示，公司有意从创始人主导的技术搭建转向规模化执行。与此同时，公开记录仍留下关键人集中度和治理尽调问题：Hart 仍是核心技术发声者，Kassekert
              承担工厂规模化责任，外部投资人看起来影响很大，但准确所有权和控制条款仍未披露。
