      - CV039
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 支持
      - 制衡因素
      - 什么会改变判断
    rows:
      - - 市场大且仍在增长
        - 市场研究来源显示，3D 打印和金属领域持续增长，北美和工业细分市场尤其明显
        - 品类增长不会自动证明高溢价私募入场倍数合理
        - 证明 Vulcan 能拿到超额份额，并跑出强利润率和重复生产
      - - 一体化本土生产护城河
        - 官方材料显示，增材、机加工和软件整合在同一套栈里
        - 一体化工厂扩张也可能更难、更吃资本
        - 提供站点级经济性、良率和客户扩张数据
      - - 战略性终端市场有吸引力
        - 公开证据指向航空航天、国防、医疗等高规格需求
        - 这些行业往往也有很长认证周期和沉重合规负担
        - 展示认证周期、转化率和多年项目持续性
      - - IP 和 know-how 可能重要
        - Dealroom 和公司来源显示专利覆盖面和技术差异化
        - 专利估算不能证明定价权或客户锁定
        - 展示赢单 / 输单证据、切换成本和利润率韧性
      - - 投资人信心真实存在
        - 大额融资和分析师 / 二级市场估值口径显示投资人确有兴趣
        - 当前投后估值和 waterfall 条款仍不透明，因此信心不等于公允价格
        - 披露轮次条款、当前收入和当前积压订单质量
    notes: 本表把公司论点强度与当前价格支撑强度分开。
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV010
      - CV013
      - CV028
      - CV029
      - CV042
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 退出时收入 $350-500M，退出倍数 7-10x；多站点利用率强，且高溢价行业组合占优
        - 以 $1B 级入场参考计，未来价值约 $2.45-5.0B
        - 执行、认证和可持续高溢价利润率
        - 有可能，但需要异常强的证据
      - - 基准
        - 退出时收入 $180-250M，退出倍数 5-7x；增长真实，但资本强度和认证拖累仍在
        - 未来价值约 $0.9-1.75B，意味着创投回报中等或不均衡
        - 固定成本杠杆、定价和产能填充偏慢
        - 从公开证据看最合理
      - - 悲观
        - 退出时收入 $80-120M，退出倍数 4-6x；利用率和转化不及预期，融资需求回潮
        - 未来价值约 $0.32-0.72B，存在重大资本减值风险
        - 进一步稀释、利润率压力或客户项目滑坡
        - 如果证据仍弱，下行空间重大
    notes: 情景测算刻意保持粗略，目的在展示不对称性，而不是声称精确公允价值。
    claimRefs:
      - CV020
      - CV021
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Xometry（2026 年 Q2）
        - 季度收入 / 增长 / EBITDA / 现金
        - $229M 收入，同比 +41%，$14.1M 调整后 EBITDA，股权融资后现金 $517M
        - 展示定制制造做到规模后，在公开市场上可能呈现的可见度
        - 资产轻型市场平台占比高于 Vulcan
      - - Protolabs（2026 年 Q2）
        - 季度收入和盈利能力
        - $149.3M 收入，同比 +10.6%，GAAP 与非 GAAP EPS 均为正
        - 有成熟航空航天可信度的数字制造服务可比样本
        - 工艺组合更宽，经营历史也长得多
      - - Materialise（2025/2026 公开投资者关系指标）
        - 年度收入和使用规模
        - 年收入 €268M；2025 年打印 2.1M+ 个零件；帮助 60K+ 名患者
        - 说明增材制造软件 / 服务可以做到真实且多元的规模
        - 软件、医疗和服务的组合不同
      - - 3D Systems（2026 年 Q2）
        - 季度收入和盈利状态
        - $94.6M 收入；净亏损；调整后 EBITDA 小幅为负；本季度完成股权融资
        - 上市增材制造可比样本：增长不保证盈利质量清晰
        - 成熟厂商，产品组合和重组历史不同
      - - Velo3D（2026 年 Q1 文件）
        - 融资和风险因素状态
        - 公开申报文件突出融资需求和持续经营敏感性
        - 可作为金属增材制造资本强度和客户集中风险的下行参照
        - 业务困境使其更像底部参照，而不是公允价值可比样本
      - - Vulcan 私营市场估值信号
        - 分析师和二级市场信息面
        - Legion 和 Tracxn 给出的 ~$1B 综合 / 最新估值信号
        - 锚定投资者当前被要求判断的市场信号
        - 间接、部分建模，且不是主要投后估值披露
    notes: 行项目混合了经营口径较干净的可比公司和间接私营估值信号，因为没有单一上市可比公司能干净匹配 Vulcan 的制造-软件混合定位。
    enumerationScope:
      coverage: partial
      basis: >-
        The table includes the most decision-relevant public manufacturing and AM references plus private-market
        signals, but Vulcan’s hybrid model and limited disclosure prevent a perfect peer set.
    claimRefs:
      - CV006
      - CV007
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV030
      - CV031
      - CV043
      - CV044
      - CV045
  - id: TV005
    title: 击穿投资论点与止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 当前经营经济性仍不透明
        - 管理层仍无法拿出可信的当前收入、利润率和在手订单质量
        - 私营市场信号仍无法验证
        - 不要做投资测算；保持跟踪 / 继续研究状态
      - - 许可或 EHS 失效
        - 扩张期间收到重大监管通知、发生严重事故或审计失败
        - 合规冲击会打击产出、客户信任和融资信心
        - 暂停任何投资工作，直到整改得到证明
      - - 关键项目认证延误
        - 大型项目停滞，或无法进入重复生产
        - 基础情景和牛市情景会很快失去产量假设
        - 重估至熊市情景，或要求修订价格
      - - 利用率得到证明前再次融资
        - 运营杠杆可见前就需要新资本
        - 稀释和资本强度担忧会压过上行空间
        - 立即假设普通股回报更低
      - - 重大客户项目流失或集中度意外
        - 头部账户占比比预期更糟，或旗舰项目退出
        - 收入韧性和议价权假设被击穿
        - 要求按客户层级重建模型
    notes: 这些是直接击穿投资论点的触发项，不是泛化的创业公司风险。
    claimRefs:
      - CV034
      - CV040
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前收入和在手订单
        - 当前 ARR / 收入、已签在手订单、按项目划分的结构，以及在手订单账龄
        - 这是从故事走向可投资定价的核心桥
        - CFO 数据室和董事会材料
      - - 毛利率和单位经济性
        - 按工艺 / 工厂划分的毛利率、贡献利润率、报废 / 返工和利用率
        - 只有运营杠杆真实，溢价定价才可信
        - 财务、运营和工厂财务负责人审阅
      - - 客户集中度和持续性
        - Top-20 账户、零件族集中度、合同期限、续约 / 扩张数据
        - 在工厂模式中，集中度可能主导估值
        - CRO / CEO 尽调，配合分群导出
      - - 股权结构和优先权
        - 股份类别、清算顺位、反稀释、参与权和内部人二级交易
        - 名义估值可能显著高估普通股价值
        - 公司法律顾问加股权结构表导出
      - - 许可和质量 / 合规
        - 许可清单、近期申报、监管通知、审计结果，以及良率 / 质量 KPI
        - 合规和质量失效比缓慢增长更快击穿投资论点
        - HSSE 和运营尽调
    notes: 这些要求是从估值框架走向真实投资测算所需的最低材料包。
    claimRefs:
      - CV023
      - CV032
      - CV033
      - CV039
      - CV041
