      - number: '6.3'
        title: 留存、耐久度与扩展机制
        blocks:
          - type: paragraph
            body: >-
              客户耐久度方面，保留下来的最好证据是关系型的，不是指标型的。John Hart 告诉 3DPrint.com，目标是从少量应用切入；等到 VulcanForms
              的制造能力对客户越来越重要，再逐步加深关系。这正是受监管或任务关键制造服务的典型采用路径：早期验证通常从一个狭窄零件族开始，只有在认证、可重复性和供应商信任建立后才扩展。2026
              年融资报道称需求超过产能，并包含大额长期订单，这在方向上支持上述扩展模型。但公开记录没有披露合同期限、复购率、NRR、GRR、流失率，甚至没有披露客户数量。因此，耐久度还无法直接承销。合理解读是：扩展逻辑存在且可信，但真实留存质量仍是私有信息。
