      - number: '3.5'
        title: 反向信号与投资判断角度
        blocks:
          - type: paragraph
            body: >-
              最重要的反向信号不是 Vulcan 没有竞争对手，而是已有多个竞争对手把类似技术叙事转化成制度化平台。EOS 和 3D Systems 比一家私营初创公司拥有更宽的装机基础和服务逻辑。Nikon
              在美国具备国防专用制造基础设施。Velo3D 提供相似的复杂几何、美国本土供应和生产转型话术，只是资产负债表背景更脆弱。Seurat 和 Digital Metal 说明，不同工艺选择可能在不需要 Vulcan
              精确 LPBF 加机加工流程的零件族里，靠成本或产量取胜。


              因此，投资判断问题在于：Vulcan 只是另一个金属 AM
              故事，还是针对特定买方任务的真正更优生产模式。最持久的论点不是宽泛技术领先，而是细分市场里的具体优势：哪些零件需要一体化精加工，哪些场景愿意为美国本土供应和认证付费，哪些客户更偏好外包制造伙伴而不是内部拥有设备。若
              Vulcan 无法在这些细分里展示可重复胜利，既有玩家和替代方案会给买方太多选择。若它能够做到，公司的定位就足够差异化，既能抵御设备供应商的直接价格竞争，也能与在相邻任务上表现更好的替代工艺共存。
            claimRefs:
              - CP029
              - CP030
              - CP032
