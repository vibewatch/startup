      - number: '7.3'
        title: 运营、质量与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营上，VulcanForms
              暴露在一组问题之下，而这些问题恰恰让它的价值主张成立。公司承诺为困难金属零件提供压缩、垂直整合的供应链；这意味着必须由公司自己，而不是外部分包网络，让增材设备、后处理、机加工、检测、软件、公用工程和 EHS
              控制保持同步。独立报道显示，业务足迹以 Devens 为中心，Newburyport 支撑机加工和检测；2026
              年披露则指向第三个站点。长期看，这可能带来冗余；但当前阶段也带来投产、吞吐平衡和用工爬坡风险。供应商依赖同样重要。公开报道显示 VulcanForms 依赖成熟粉末生产商，LIMO
              案也显示至少存在过一个带有经济和排他性维度的激光系统依赖。再叠加大型金属 AM 厂商的竞争压力，这些依赖意味着停机、输入扰动或认证慢于预期，都可能迅速变成利润率和融资问题。
