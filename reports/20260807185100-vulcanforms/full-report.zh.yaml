        title: 财务判断与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              Vulcan
              的财务故事只有在区分公开事实和暗示性信息后才具备可投性。公开证据支持强融资记录、可见州政府背书扩张、宽终端市场叙事，以及作为私营先进制造公司的可观组织规模。公开证据不支持对已确认收入、经常性收入、按工作流步骤拆分的毛利率、营运资本强度或现金跑道
              的清晰判断。因此，最重要的争论不是 Vulcan 有没有需求，而是一体化工厂模式能否在下一次重大融资前，把需求转化成有吸引力的单位经济。最好的尽调问题都很具体：过去 24
              个月收入按终端市场和工艺步骤拆分；在手订单及转化节奏；增材打印机和机加工单元利用率；良率、报废和返工率；综合及分部毛利率；2026
              年融资后的现金余额；来自重复生产而非受资助实验的订单占比。在拿出这些指标之前，正确投资判断应是：Vulcan 比典型收入前硬件初创公司更有商业实质，但相对于已融资本额，仍承载明显财务不透明风险。
