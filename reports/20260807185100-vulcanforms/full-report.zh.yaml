              最强的公开质量信号包括闭环控制、实时监控、过程内传感、测试 /
              验证话术，以及从粉末到零件的可追溯性。这些控制看起来可信，并且在产品页面和招聘信息中表述一致。但稼动率、报废率、良率和认证深度仍缺少独立证明。保留下来的最不利来源是一篇 2023 年 3DPrint.com
              文章；它援引匿名前员工称，公司存在低稼动率和认证困难。由于该文其他地方也有事实错误，应把它看成警示信号，而不是已证实的经营诊断。技术结论偏正面，但有条件：架构看起来真实且差异化，但投资者在把平台视为风险已出清的工业基础设施之前，应要求当前生产
