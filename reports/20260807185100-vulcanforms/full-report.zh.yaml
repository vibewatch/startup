      - number: '3.2'
        title: 能力宽度与量产就绪度对比
        blocks:
          - type: paragraph
            body: >-
              最大的既有玩家比 VulcanForms 拥有更深的设备组合和更宽的正式支持生态。EOS 的 M4 ONYX 是一款六激光平台，面向航空航天、能源、工业和半导体用途，宣称吞吐量提升 50%、零件成本降低
              30%，监控软件还能减少无损检测。Nikon SLM 围绕开放架构、可定制参数集和大型材料 / 参数组合定位，并有航空航天与 Honeywell 认证证言，以及 Nikon AM Synergy
              面向美国国防的工程单位背书。3D Systems 把成熟 DMP 打印机家族、金属材料、监控、检测软件，以及航空航天、国防、医疗技术和数据中心基础设施中的可见需求信号组合起来。Velo3D
              强调复杂几何、大尺寸产能、美国本土系统设计和 Golden Print File，以便在不同合作模式中保持可重复性。


              Vulcan 的差异化不在于竞争对手缺少工业级金属打印；他们显然具备。区别在工作流所有权。Vulcan
              出售的是增材加机加工的组合生产系统，而大多数既有玩家仍从设备和赋能切入。这很重要，因为许多买方不想从零搭建内部 AM 组织，尤其当认证、精加工、检测和文档才是瓶颈时。Seurat
              通过完全取消客户设备所有权，把这种对比进一步拉开，但它使用不同工艺和商业模式，目标是系列化生产。Digital Metal
              从另一个角度加剧对比：当全密度和精加工要求可控时，粘结剂喷射可以承诺小型复杂零件的高精度和高产量，进而挑战 LPBF 经济性。因此，能力宽度偏向既有玩家；制造模式便利性，则是 Vulcan、Seurat 和
              Velo3D 最有力的竞争论点。
