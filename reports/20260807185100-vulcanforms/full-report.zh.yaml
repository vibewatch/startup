  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - VulcanForms
        - 基准 / 一体化制造商
        - 私有公司；规模从多轮大额融资和工厂建设推断
        - 国防、医疗、算力、半导体、高价值工业零件
        - 在本土生产流程中整合 LPBF、机加工、软件和可追溯性
        - 营收和客户集中度未公开披露；私有公司证明仍有限
      - - EOS
        - 老牌设备供应商 + 服务
        - 大型工业老牌玩家，拥有全球装机基础和正式服务生态
        - 航空航天、能源、工业、半导体、汽车、医疗
        - 材料 / 工艺栈扎实，强调 M4 ONYX 吞吐量，并提供认证和可用性服务
        - 主要帮助客户自建产能，而不是自己掌握成品零件流程
      - - Nikon SLM Solutions / Nikon AM 设备商
        - 设备供应商 + 工程服务
        - Nikon 支持；设有面向美国国防的 AM Synergy 单元
        - 航空航天、国防、能源、出行、太空
        - 开放架构、多激光 LPBF、DED 相邻能力、美国认证服务
        - 仍从以硬件为中心的采用路径切入；公开证据中，成品零件制造的广泛规模比技术叙事更薄弱
      - - ATLIX（原 TRUMPF Additive）
        - 设备供应商
        - 2025 年在 LEO III Fund 旗下从 TRUMPF 剥离
        - 大型工业金属零件、连续生产用户
        - TruPrint 5000 主打大型金属零件高速连续生产
        - 剥离阶段带来执行和品牌过渡不确定性
      - - 3D Systems
        - 上市老牌平台供应商
        - NYSE 上市；医疗、牙科、工业、A&D 收入流多元
        - 医疗、牙科、航空航天、国防、数据中心基础设施、工业用户
        - DMP 产品线、材料、监控 / 检测软件覆盖广，终端市场已有可见牵引
        - 仍暴露于增材行业整体周期性和工业增长分化
      - - Velo3D
        - 混合平台供应商 + 生产服务
        - Nasdaq 上市；2026 年势头改善，但流动性紧张
        - 国防、航空航天、能源、太空、半导体相邻用户
        - Golden Print File、复杂几何、本土 LPBF 身份、Rapid Production Solutions、大幅面产能
        - 资产负债表脆弱、仍需融资，抬高经营连续性风险
      - - Seurat
        - 合同制造商 / 工艺替代方案
        - 私有公司；合同生产模式获得战略背书
        - 汽车、能源、航空航天领域的大批量工业金属零件
        - Area Printing、客户无需 CapEx、制造回流和连续生产叙事
        - 工艺和商业模式不同于 Vulcan；真实客户生产规模在公开信息中仍不够透明
      - - Digital Metal / PX100
        - 粘结剂喷射工艺替代方案
        - 2022 年被 Markforged 收购；聚焦大批量小零件
        - 汽车、工业、MedTech、能源、奢侈品、学术界
        - 高精度粘结剂喷射、数十万件零件、打印机 + 服务模式
        - 最适合更小的大批量零件，可能不匹配需要不同属性或工作流的 LPBF 用例
    notes: 这组竞争对手混合了直接 LPBF 对手和工艺 / 商业模式替代者，因为买方可以通过购买设备、制造服务或替代增材工艺来解决同一采购问题。ATLIX 覆盖依赖行业报道，因为本轮无法获取官方网站。
