              公开证明比简单罗列客户标识更强，但仍不完整。MIT 报道及衍生报道称，VulcanForms
              曾在两天内为一家超级计算机制造商生产复杂冷却部件，也生产过医疗植入物、工业工装、轮胎模具，以及航空和国防承包商部件。3DPrint.com 和 MIT Mechanical Engineering
              较新的独立报道展示了膝关节、髋关节植入物部件、计算机冷却装置和小型导弹发动机等演示零件；官方产品 / 行业页面又补充了航空航天、医疗、算力、半导体和消费品的应用话术。公司还称，2026
              年初需求已超过可用产能，客户也已下达大额长期订单。这些都是有意义的信号，但没有解决最大的客户证明问题：大多数真实客户名称仍保密。因此，公开证据更能证明解决方案适配和购买兴趣，对账户集中度、留存或跨垂直的完整量产深度证明较弱。
