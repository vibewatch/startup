      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开财务事实是，Vulcan 反复能够融到大额外部资本。官方新闻稿、PRNewswire 和行业报道都把 2026 年 1 / 2 月融资描述为一轮超额认购的 $220M 融资，由 Eclipse 和
              1789 Capital 领投，Washington Harbour、Fontinalis、IEQ Capital 等参与。Vulcan 2022 年公告披露了一轮 $355M
              融资，用于工业级数字制造基础设施；多个第三方数据集现在把生命周期融资放在约 $575M-$576M，并显示当前员工数约
              265。一方面，这个资本基础相较资金不足的初创公司，显著降低了近期生存风险。另一方面，同一组来源也说明，公司仍依赖外部融资，因为制造规模化、设施扩张、员工增长和研发都需要先烧现金，之后才可能产生可见自由现金流。公开来源没有披露
              2026 年融资后的在手现金、债务安排、契约、月度消耗或下一轮时点。3DPrint.com 2023
              年反向报道声称技术和管理存在动荡，佐证不足，不能直接纳入投资判断；但它确实强化了一个结论：投资者需要当前产能利用率、正常运行时间、报废和现金效率数据，而不能只依赖融资公告。审慎结论是，资本可得性一直强，但如果没有私有运营指标，资本充足性仍未被证明。
