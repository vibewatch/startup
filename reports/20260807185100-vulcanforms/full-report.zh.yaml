        title: 融资背景、估值信号与入场纪律
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 无疑吸引到了资本：累计融资约 $575-$576 million，包括 2026 年 1 月的 $220 million 融资。分析师和二级市场来源大多围绕 $1 billion
              私募市场信号；Legion 明确显示 $1 billion 混合估值和近期二级报价界面，Tracxn 则把公司截至 2022 轮的估值放在 $1 billion。问题不是没有信号，而是信号质量。2026
              年融资后的确切投后估值
              没有在保留下来的一级来源中清楚披露，公开记录也没有给出当前收入或利润率数据，让投资者判断这个信号是便宜、公允还是昂贵。因此，入场纪律应以证明为基础，而不是以故事为基础。新资金要么需要明显更好的价格，要么需要管理层级别证据，证明当前收入、利润率和
              在手订单质量已经越过私募市场标记隐含的门槛。
