  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险集中在 EHS / 合规、站点和供应商依赖、客户不透明以及资本效率上，而不是某个已知单一危机。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: EHS / 许可合规
          values:
            - label: 高
              tone: negative
              detail: 这些危险是该模式的结构性问题。
            - label: 极高
              tone: negative
              detail: 严重事故可能停掉产出，并伤害客户信任。
            - label: 中
              tone: warning
              detail: 专门建设 HSSE 有帮助，但没有补上数据缺口。
            - label: 高
              tone: negative
              detail: 首要剩余风险。
        - label: 站点集中
          values:
            - label: 中
              tone: warning
              detail: 关键职能仍集中在少数站点。
            - label: 高
              tone: negative
              detail: 中断可能影响多个工作流步骤。
            - label: 中低
              tone: warning
              detail: 已有多站点布局，但冗余能力公开上未证实。
            - label: 中高
              tone: negative
              detail: 连续性证据仍未公开。
        - label: 供应商 / 子系统依赖
          values:
            - label: 中
              tone: warning
              detail: 激光和粉末依赖清晰可见。
            - label: 高
              tone: negative
              detail: 中断可能拖慢生产或挤压利润率。
            - label: 中低
              tone: warning
              detail: 未保留公开的第二来源图谱。
            - label: 中高
              tone: negative
              detail: 剩余敞口仍然重要。
        - label: 客户集中度不透明
          values:
            - label: 高
              tone: negative
              detail: 具名客户披露稀少。
            - label: 高
              tone: negative
              detail: 少数项目可能权重很高。
            - label: 低
              tone: warning
              detail: 指标未公开，公开可见的缓释措施较弱。
            - label: 高
              tone: negative
              detail: 需要管理层数据。
        - label: 认证周期拖累
          values:
            - label: 中高
              tone: negative
              detail: 目标行业验证负担重。
            - label: 高
              tone: negative
              detail: 延误会扭曲利用率和营运资本。
            - label: 中
              tone: warning
              detail: 聚焦这些行业有道理，但推进仍慢。
            - label: 中高
              tone: negative
              detail: 商业化节奏风险仍在。
        - label: 资本效率 / 未来融资
          values:
            - label: 中
              tone: warning
              detail: 新融资争取了时间。
            - label: 高
              tone: negative
              detail: 固定成本杠杆让失误代价高。
            - label: 中
              tone: warning
              detail: 融资和激励有帮助。
            - label: 中高
              tone: negative
              detail: 利用率证据仍未公开。
        - label: 领导层 / 招聘执行
          values:
            - label: 中
              tone: warning
              detail: 交接与扩张同步推进。
            - label: 中高
              tone: negative
              detail: 招聘不到位会拖慢投产和合规。
            - label: 中
              tone: warning
              detail: 新高管和计划已经到位。
            - label: 中
              tone: warning
              detail: 管理梯队厚度仍待证明。
        - label: 竞争压力
          values:
            - label: 中
              tone: warning
              detail: 金属 AM 竞争活跃。
            - label: 中高
              tone: negative
              detail: 压力可能体现在定价和客户耐心上。
            - label: 中
              tone: warning
              detail: 差异化存在，但守住也要成本。
            - label: 中
              tone: warning
              detail: 重要但次要的风险。
    approximationNotes: 定性评分综合自保留的公开证据，而非私有运营 KPI。
    claimRefs:
      - CR029
      - CR031
      - CR037
      - CR041
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多数下行路径从合规或爬坡问题，传导到停机、利用不足、现金压力和估值压缩。
    data:
      nodes:
        - id: permit-or-safety-failure
          label: 许可或安全失效
          description: 风险驱动
        - id: site-or-supplier-disruption
          label: 站点或供应商中断
          description: 风险驱动
        - id: qualification-delay
          label: 认证延误
          description: 风险驱动
        - id: delayed-output
          label: 产出延迟
          description: 传导节点
        - id: underutilization
          label: 利用不足
          description: 传导节点
        - id: margin-pressure
          label: 利润率压力
          description: 传导节点
        - id: financing-need
          label: 融资需求
          description: 传导节点
        - id: valuation-compression
          label: 估值压缩
          description: 结果节点
        - id: customer-program-loss
          label: 客户项目流失
          description: 结果节点
      edges:
        - from: permit-or-safety-failure
          to: delayed-output
        - from: site-or-supplier-disruption
          to: delayed-output
        - from: qualification-delay
          to: underutilization
        - from: delayed-output
          to: underutilization
        - from: underutilization
          to: margin-pressure
        - from: margin-pressure
          to: financing-need
        - from: financing-need
          to: valuation-compression
        - from: qualification-delay
          to: customer-program-loss
        - from: customer-program-loss
          to: valuation-compression
    approximationNotes: 该图偏方向性而非量化；精确权重取决于私有积压订单、良率和资产负债表数据。
    claimRefs:
      - CR037
      - CR038
      - CR041
      - CR042
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: VulcanForms 同时依赖监管方、站点、供应商、客户和资本提供方。
