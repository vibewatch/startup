      - number: '1.4'
        title: 矛盾信号、反向证据与未解缺口
        blocks:
          - type: paragraph
            body: >-
              已保留来源集中最强的公开反向信号，是 3DPrint.com 2024 年文章。文章称 VulcanForms
              围绕一项尚未准备好可靠量产的技术过度建设。报道引用一名前员工匿名说法，指称机器正常运行时间低、换线时间长、早期裁员、设施收缩和管理压力。由于文章依赖未署名证词和第三方职场评论，而非文件型备案或诉讼记录，不能把它当成定论。但它仍然重要，因为它直接挑战公司的核心主张：一体化
              LPBF 平台已经具备规模化量产能力。


              其他缺口更普通，但对尽调同样关键。总部表述在不同来源中变化：公开公司页面强调 Devens 和 Newburyport 运营点，一些二级数据库称 Burlington 或
              Newburyport，多个公司新闻稿则以 Devens 作为发稿地。公开来源对生命周期融资总额也有分歧，因为有些只计入两轮已披露巨额融资，另一些则暗示更早资本或超过 $575M
              的四舍五入总额。一手材料未披露收入、客户数量、毛利率和在手订单转化，因此在进一步尽调前，都不应把这些指标当作硬事实。


              合并看，VulcanForms 像是一家严肃的先进制造平台，拥有异常具体的工厂资产，也有异常不完整的外部运营披露。上行逻辑押注三件事：自有 LPBF
              硬件、垂直整合的美国本土生产，以及可见投资人支持。关键未解风险在于，公司能否足够快地把工业叙事转化成持久单位经济和可重复生产表现，从而支撑持续资本强度。
