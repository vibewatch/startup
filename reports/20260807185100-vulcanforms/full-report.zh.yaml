      - number: '1.3'
        title: 融资时间线、设施与规模信号
        blocks:
          - type: paragraph
            body: >-
              公开融资记录由两次公司背书的大额公告锚定。Business Wire 报道，VulcanForms 2022 年以超过 $1B 的估值融资 $355M，同时公布位于 Massachusetts Devens 和
              Newburyport 的前两座数字化生产设施。2026 年 1 月 30 日的公司新闻稿及同步 PR Newswire 声明披露，公司又完成一轮超额认购的 $220M 融资，由 Eclipse 和 1789
              Capital 领投，Washington Harbour、Fontinalis、IEQ Capital 等参与。两轮已披露头部融资合计至少
              $575M；不过，公司完整生命周期融资历史仍不透明，因为公开记录没有在一手材料中清楚列出更早的种子轮或过渡轮次。


              设施证据在功能上很强，但命名口径略有不一致。招聘页面称 Devens 的 VulcanOne 是一座 160,000 平方英尺增材制造枢纽，配有机器人和中央控制中心；Newburyport
              承载精密机加工、装配和检测。2022 年 Business Wire 新闻稿还把 VulcanOne 描述为未来两兆瓦级增材制造铸造厂，并指出 Arwood Machine 是 Newburyport
              减材业务的收购基础。2026 年 1 月，Kassekert 在「Building the Capacity America Needs」文章中提出 VulcanThree
              和更大的园区概念，将新增粉末生产建筑以及按材料族划分的制造建筑。


              公开运营证据显示真实工业牵引力，但仍没有完整财务透明度。官方来源称 VulcanForms 支撑多个关键行业的大型项目，并正在转向更高产量生产；3DPrint 2026
              年初报道，客户需求首次超过可用产能。Massachusetts 随后在 2026 年 7 月 EDIP 公告中披露，VulcanForms 计划在 Devens 建设最高一百万平方英尺的垂直整合设施，对应
              1,063 个新增岗位和 $21.26M 州税收抵免。这些规模信号有分量，但也放大了对在手订单质量、资本效率和执行速度的尽调需求。
