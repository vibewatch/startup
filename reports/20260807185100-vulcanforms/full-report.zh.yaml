      - number: '7.2'
        title: 监管、法律与 EHS 暴露
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 的公开材料没有显示当前执法危机，但显示这是一门背着严肃监管和法律义务的生意。最强的单项证据是 HSSE
              负责人招聘，它明确提到可燃粉尘、多千瓦激光安全、环境和空气质量许可、事故调查、动力工业车辆许可、ITAR 边界，以及 ATF
              文件就绪。这已经远远不是轻工业车间的话术；更像一个规模化先进制造环境，安全和审计纪律都是核心运营约束。联邦和州许可页面进一步强化这一点，说明 Massachusetts 设施可能面临环境许可和 NPDES
              相关义务。法律侧，2025 年 LIMO 裁定在方向上令人放心，因为 VulcanForms
              赢得驳回；但它也暴露出，在公司最专业的技术关系中，供应商、排他性和合同争议会浮出水面。因此，投资者应把法律和监管风险视为受控但仍然活跃。
