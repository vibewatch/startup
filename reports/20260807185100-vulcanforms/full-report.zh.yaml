      - number: '2.2'
        title: 规模测算口径与互相矛盾的自上而下估算
        blocks:
          - type: paragraph
            body: >-
              已保留第三方来源中，没有任何一家能干净测算「面向国防、医疗和计算的一体化美国数字金属制造」市场。公开记录提供的是多个定义不同、彼此重叠的口径。即便针对同一年，宽泛金属增材估算也分歧很大：Fortune
              Business Insights 认为 2026 年 3D 打印金属市场为 $3.75B，Straits Research 则把 2026 年金属增材制造市场放在 $6.27B。Credence
              Research 从 2024 年 $5.86B 基数和到 2032 年 13.4% CAGR 出发；若沿用同一轨迹，折算 2026 年约 $7.5B。Intent Market Research
              给出另一条增长路径：从 2023 年 $2.2B 增至 2030 年 $7.4B。头部结论不是其中某个数字一定正确，而是 TAM 很大程度取决于发布方是否把系统、材料、服务、成品零件或更宽相邻领域纳入。


              更适合决策的规模口径来自 Vulcan 实际点名的垂直行业。Mordor 估计 2026 年半导体增材制造为 $423M；相邻的半导体晶圆厂热管理硬件在 2026 年达到 $2.22B（冷却机和换热器）以及
              $8.60B（半导体热管理材料）。医疗器械相邻市场大得多——Dimension Market Research 估计 2026 年医疗器械增材制造市场为 $17.7B——但这个市场比 Vulcan
              的纯金属覆盖面更宽，也包括未必匹配公司当前生产范围的应用类别。正确推论是，Vulcan 的近期机会几乎肯定小于最宽泛的医疗相邻市场，但大于最窄的半导体 AM 子集；计算 / 半导体是最容易量化的滩头阵地，国防 /
              医疗则提供真实但更难从公开来源中数值拆分的战略扩张向量。
