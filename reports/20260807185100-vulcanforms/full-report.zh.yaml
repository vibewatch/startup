  - id: TP004
    title: 护城河耐久度 / 竞争风险台账
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 重要性
      - 缓释措施 / 尽调问题
    rows:
      - - 一体化生产工作流
        - 竞争对手也把 LPBF 与软件、监测和认证服务打包
        - 高
        - Vulcan 不是唯一讲全栈故事的公司，证据必须来自已交付产出，而不是宣传话术
        - 索要重复生产案例，证明加工 + 增材一体化改变了采购决定
      - - 本土国防定位
        - Nikon AM Synergy、Velo3D 和 3D Systems 都宣传国防或本土供应资质
        - 高
        - 本土制造在金属 AM 已不再是独特叙事
        - 要求项目级证据，覆盖已认证零件族和采购中标
      - - 复杂几何领先地位
        - Velo3D 和 EOS 明确宣传复杂几何和先进热管理用例
        - 中高
        - 如果买方能在别处获得类似能力，零件几何优势可能收窄
        - 在相同基准零件上比较设计规则、良率和后处理负担
      - - 客户规避资本开支
        - Seurat 和 Velo 已经提供零或低资本开支采用路径
        - 中高
        - 按结果收费的竞争对手会抵消 Vulcan 的一项主要 GTM 优势
        - 梳理 Vulcan 因一体化精加工或认证而赢单的场景，而不只是因为客户避开资本开支
      - - 小型高批量零件上的 LPBF 经济性
        - Digital Metal 粘结剂喷射可能靠吞吐量和小件经济性胜出
        - 中
        - 并非每个零件族都需要 Vulcan 的特定工艺
        - 识别哪些零件必须依赖 LPBF 材料属性、密度或几何形状，才能支撑溢价经济性
      - - 规模与生态成熟度
        - EOS 和 3D Systems 拥有更广的服务与材料生态
        - 中高
        - 大型在位者能降低全球 OEM 采用风险
        - 验证 Vulcan 的本土一体化工作流，能否在目标客户中打过更宽的生态
      - - 竞争对手财务疲软利好 Vulcan
        - 弱势对手仍可能在技术上构成威胁，同时让买方担心连续性
        - 中
        - Velo 说明脆弱性有两面：更容易击败，但如果买方不敢依赖创业公司，也会很危险
        - 评估买方偏好是在转向稳定的上市在位者，还是转向专业化私营伙伴
      - - 市场碎片化保护 Vulcan
        - 市场碎片化也让买方可以多栖和双源采购
        - 中
        - 没有单一对手占主导，但这也意味着切换壁垒必须按零件族一个个打出来
        - 衡量头部客户项目中的实际钱包份额和独家供应状态
    notes: 核心竞争问题不是有没有替代方案——替代方案显然存在；而是 Vulcan 能否在目标买方最在意的认证、本土性、一体化精加工和外包生产组合上胜出。
