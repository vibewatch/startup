        - from: newburyport-site
          to: vulcanforms-platform
        - from: third-site-plan
          to: vulcanforms-platform
        - from: laser-suppliers
          to: vulcanforms-platform
        - from: powder-suppliers
          to: vulcanforms-platform
        - from: unnamed-customers
          to: vulcanforms-platform
        - from: capital-providers
          to: vulcanforms-platform
