  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与价格敏感评分
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 的估值判断应从一个简单区分开始：这可能是一家强公司，但不代表当前价格自动可投。公开证据支持正面论点。VulcanForms
              位于工业技术中有吸引力的环节，已经融资不少，看起来能解决真实客户问题，并在搭建差异化的本土制造栈。公开证据在真正支撑价格的地方弱得多。现有记录没有足够披露当前收入、利润率、在手订单
              质量、头部客户集中度或股权结构保护条款，无法支撑有信心的买入判断。在约 $1 billion
              的私募市场信号下，故事已经需要有意义的规模和经济性证明。如果真实价格高于这个水平，门槛会显著升高。因此，合适的公开建议是跟踪 / 继续研究；中等信心、高风险，在当前经济性被直接展示之前，估值姿态偏紧。
