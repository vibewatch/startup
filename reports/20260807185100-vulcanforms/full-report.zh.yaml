      - number: '3.4'
        title: 护城河耐久性、多宿主与替代风险
        blocks:
          - type: paragraph
            body: >-
              当客户想从一条美国本土工作流中获得成品、已认证金属零件，而这条工作流已经结合增材、机加工、监控和文档时，Vulcan
              的护城河最强。这一组合比单纯打印机性能更能防守。不过，护城河并非无人挑战。EOS、Nikon、3D Systems 和 Velo3D 都宣传认证支持、软件或监控能力，从不同方向攻击同一个信任瓶颈。Nikon 和
              Velo 的国防与航空航天证据尤其可信；3D Systems 则展示了上市公司规模和多元终端市场牵引力。Seurat 和 Digital Metal
              扩大了威胁面，因为它们用不同生产经济性处理同一个问题：一个靠承诺系列化规模的合同制造，另一个靠粘结剂喷射和高产量小零件精密制造。


              市场也有结构性更替迹象。ATLIX 本身是从 TRUMPF 增材业务剥离出来的；Velo3D 公开披露显示，公司动能在改善，但流动性和执行风险仍有分量。3D Systems
              规模较大，但仍称整个增材行业正在走出多年低迷。换句话说，赛场活跃但尚未定局。Vulcan
              面对的不是一个完全匹配其一体化工厂模式的主导既有玩家；它面对的是一组拼图式对手。若买方决定在别处组装这些能力，对手就能侵蚀其价值主张的一部分——设备能力、服务灵活性、国防认证或规模经济。
