      - number: '2.5'
        title: 尽调缺口与市场投资判断影响
        blocks:
          - type: paragraph
            body: >-
              主要市场分析风险是假精确。公开证据足以说明 VulcanForms 所处的是一组战略重要且扩张中的市场，但不足以在不做分析转换的情况下给出单一干净的 SAM / SOM
              数字。最大的相邻市场数字——尤其是医疗器械——高估了 Vulcan 可能捕获的规模，因为它们纳入了金属 LPBF
              加精密精加工之外的更宽增材类别、器械类型和制造模式。最窄的数字——例如仅半导体增材制造——又低估了完整机会，因为 Vulcan 还销售给国防、医疗和更宽的计算基础设施。


              这种不确定性应改变尽调姿态。与其按头部 TAM
              给公司下注，更持久的市场问题是运营性的：哪个垂直行业才是真正的近期滩头阵地；多少零件族已经通过认证；计算热管理和半导体工装需求是一次性还是可重复；国防机会有多少依赖政策辅助的供应商导入，又有多少来自主承包商的自然采用。3D
              Systems 这类上市公司代理指标可以确认，航空航天、国防、医疗技术和数据中心基础设施里确有高价值增材需求；但它们不能证明 Vulcan 的一体化工厂模式能规模化捕获这些预算。因此，市场尽调应少看自上而下
              TAM 乐观叙事，多看买方认证速度、项目转化、重复生产占比，以及 Vulcan 是否已经找到某个细分市场，使其一体化美国本土工作流明显优于既有替代方案。
            claimRefs:
              - CM032
