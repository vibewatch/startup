        title: 退出就绪度、论点破裂触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 还没到公开证据足以支持清晰退出就绪或承销结论的阶段。最大缺口不是抽象市场规模，而是当前商业质量。投资者仍需要当前收入、按工艺和站点拆分的毛利率、在手订单
              构成、头部客户集中度、合同期限、定价 / 组合、股权结构表 和优先权条款、许可状态、质量 KPI，以及新增产能无需融资重置即可被填满的证据。同样这些缺口也定义了论点破裂触发器：许可或 EHS
              失败、重大客户项目流失、认证转化慢于预期，或在产能利用率被证明之前再发生一轮融资。如果管理层能补上这些缺口，估值论点可能迅速改善。在此之前，正确姿态是把公司视为战略上有意思，但价格尚未出清。
