      - number: '6.4'
        title: 集中度、保密性与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              保护 VulcanForms 客户基础的保密性，也制造了真实的客户承销难题。多方来源强调，VulcanForms
              很少点名客户，大多数项目都保密；即便友好的独立报道也承认客户名称基本缺席。在国防和先进制造领域，这可能是正常现象，但也意味着投资者无法从公开证据判断收入是否足够分散，还是绑定在少数战略项目上。采购摩擦大概率仍高，因为目标客户买的不是商品化零件，而是认证、供应链信心和可重复性。这往往带来更长周期，也带来杠铃型客户结构：少数重要项目权重很高。因此，公开证据支持真实客户价值，同时也指向有意义的集中度风险；尽调中需要项目级管线披露。
