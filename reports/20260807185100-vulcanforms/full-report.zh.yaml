        - label: 客户验证（1-10）
          value: '5'
        - label: 经济性可见度（1-10）
          value: '3'
        - label: 风险控制（1-10）
          value: '4'
        - label: 估值支撑（1-10）
          value: '3'
        - label: 证据质量（1-10）
          value: '4'
    claimRefs:
      - CV028
