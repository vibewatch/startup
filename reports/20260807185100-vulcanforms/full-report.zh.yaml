        - id: laser-suppliers
          label: 激光 / 光学供应商
          description: 依赖节点
        - id: powder-suppliers
          label: 粉末供应商
          description: 依赖节点
        - id: unnamed-customers
          label: 未具名旗舰客户
          description: 依赖节点
        - id: capital-providers
          label: 资本提供方
          description: 依赖节点
      edges:
        - from: regulators
