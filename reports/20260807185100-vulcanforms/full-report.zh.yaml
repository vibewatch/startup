  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险视图
        blocks:
          - type: paragraph
            body: >-
              VulcanForms 风险最高的问题，不是技术能不能跑通，而是一个雄心很大、资本密集的工厂系统能否在复杂度堆积之前完成扩张。公开证据显示真实正面因素：2022 和 2026 年的大额融资，扩展到
              Massachusetts
              多个站点，据称超过可用产能的需求，以及一个更清晰的运营栈，覆盖软件、机加工和增材生产。但同样这些事实也定义了下行风险。全一体化模式意味着，安全、许可、公用工程、校准、人员、供应商连续性或客户认证的任何短板，都可能直接传导到产出、利润率和融资需求。由于客户名称、集中度、产能利用率和站点级经济性大多仍是私有信息，公开记录支持谨慎承销。最重要的残余风险是
              EHS 与监管负担、设施和供应商依赖、任务关键终端市场的长认证周期，以及如果爬坡时间滑后，新资本仍可能不够用。
