  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图：设备供应商、服务平台与合同制造商
        blocks:
          - type: paragraph
            body: >-
              竞争集合分为三类。第一类是工业设备和软件供应商：EOS、Nikon SLM Solutions、ATLIX（原 TRUMPF Additive Manufacturing）和 3D Systems
              都销售量产级金属打印平台，并用材料、软件和工艺服务支撑。第二类是把硬件与制造服务混合的平台玩家：Velo3D 现在营销一套硬件-软件-服务一体化技术栈，并明确提供 Rapid Production
              Solutions，让客户不必自己承担全部产能风险就能采用增材制造。第三类是合同制造商或替代工艺提供商，它们卖产出，而不是主要卖设备。Seurat 最符合这一模式：公司把自己定位为使用 Area Printing
              的合同金属制造商，不要求客户 CapEx；Digital Metal / Markforged 则把粘结剂喷射推向高产量生产，也提供服务化生产。


              因此，VulcanForms 面对的不是一个单一直接对手。面对 EOS、Nikon、ATLIX 和 3D Systems，它竞争的是买方可以认证自有或合作伙伴的硬件中心生产栈这一可能性。面对 Velo3D 和
              Seurat，它更直接地在外包、美国本土相关产能承诺上竞争。面对 Digital
              Metal，它遇到的是一种工艺替代：在小型、精密且可能高产量的金属零件上，粘结剂喷射可能靠经济性取胜。市场足够碎片化，买方可以混合采购模式——有些零件族买机器，有些外包；在可用性或安全性重要时，还会双源化认证供应商。
