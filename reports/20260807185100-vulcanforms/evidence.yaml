evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-convention
    missingEvidence: >-
      A single authoritative corporate profile or legal filing that defines headquarters, principal office, and
      operating-site nomenclature.
    whyItMatters: Location ambiguity complicates cover-fact consistency, regulatory mapping, and real-estate diligence.
    diligencePath: >-
      Request the latest certificate of incorporation, principal-office address, and internal facilities map from the
      company.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: private-metrics
    missingEvidence: Revenue, gross margin, backlog conversion, customer count, and cash-burn disclosures.
    whyItMatters: The company's scale story cannot be underwritten on capital raised and factory footprint alone.
    diligencePath: >-
      Obtain board materials, lender packages, or investor updates with monthly bookings, shipments, gross margin, and
      liquidity.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: missing-source
    severity: material
    topic: cap-table-and-lifetime-funding
    missingEvidence: A full round-by-round funding history with dates, securities, and ownership consequences.
    whyItMatters: >-
      Public releases confirm large rounds but do not reveal dilution, liquidation stack, or whether total funding
      exceeds the $575M disclosed headline rounds.
    diligencePath: Request the cap table, financing documents, and any Form D or side-letter evidence from counsel or investors.
    relatedQuestionRefs:
      - QO010
      - QO025
  - type: conflicting-data
    severity: minor
    topic: operating-readiness-claims
    missingEvidence: Independent production metrics on uptime, cycle time, scrap, and qualification pass rates.
    whyItMatters: >-
      The adverse 3DPrint article directly challenges the company's industrial-scale narrative, but the retained
      evidence is not documentary.
    diligencePath: >-
      Ask management for plant-level uptime, OEE, scrap, and customer qualification dashboards and cross-check them with
      customer references.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and founder table coverage
    missingEvidence: A complete public org chart and full board roster with committee roles.
    whyItMatters: Current governance visibility is adequate for surface diligence but not for control analysis.
    diligencePath: Request the latest board deck, committee list, and executive roster.
    relatedQuestionRefs:
      - QO013
      - QO014
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder or investor map coverage
    missingEvidence: Complete cap-table ownership and earlier-round investor history.
    whyItMatters: The retained map captures visible investors but not the entire financing stack.
    diligencePath: Request financing docs or investor data-room materials with round-by-round ownership.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO003
