- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'The most useful way to handle VulcanForms risk is to translate it into monitorable diligence conditions. Some mitigations are visible already: the company has added new leadership, is investing in HSSE governance, publicly emphasizes software-driven monitoring and integrated production control, and has obtained new financing plus Massachusetts incentive support. Those are real positives. But none of them removes the need for data. The thesis weakens quickly if permits or audit readiness lag expansion, if a key site becomes a bottleneck, if flagship customer programs fail to convert from qualification into repeat production, or if additional financing is needed before utilization proves operating leverage. The priority diligence package should therefore request exact permits, OSHA and incident logs, supplier-redundancy maps, top-account concentration, backlog by program, site-level yield and uptime metrics, and explicit governance rights for operational tradeoffs. Until that package
    is available, the correct investment posture is selective tracking rather than blind underwriting.'
  claimRefs:
  - CR033
  - CR034
  - CR035
  - CR041
  - CR042
