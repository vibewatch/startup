- id: leadership-and-governance
  title: Leadership transition and governance footprint
  body: |-
    Primary 2024 sources show that VulcanForms entered a new operating phase with a top-level management handoff. PR Newswire reported on September 23, 2024 that Kevin Kassekert became chief executive officer and Jay Martin joined as president, while company and trade-press sources describe this shift as part of VulcanForms' move from pilot-scale operations toward higher-volume production. Kassekert brought experience from Redwood Materials and Tesla, including large-factory ramp and infrastructure execution, while Martin brought commercialization and scaling experience from Globus Medical. John Hart remained publicly visible as co-founder and board member, and Martin Feldmann was described by the company as the original technical and company-building leader whose work created the platform foundation.

    Official company pages provide a clearer public view of the operating team than of formal governance mechanics. The about and media pages identify Tom Pacheco as CFO, John Conway as COO, Katie O'Kelly as Chief Quality Officer, and Melissa Hoang as Chief People Officer. The board profile visible on the site includes Greg Reichow of Eclipse, Ray Stata of Stata Venture Partners, and Lior Susan of Eclipse. That is enough to establish investor and industrial influence, but not enough to reconstruct voting control, board committee structure, or protective provisions. The company also does not publicly disclose a full cap table, independent director mix, or succession planning framework.

    The governance picture therefore looks credible but only partially transparent. VulcanForms has recognizable manufacturing and investor operators around the table, and the 2024 CEO transition suggests a deliberate pivot from founder-led technology buildout to scale execution. At the same time, the public record leaves key-person concentration and governance diligence open: Hart remains a central technical spokesperson, Kassekert now carries factory-scaling accountability, and outside investors appear highly influential even though exact ownership and control terms remain undisclosed.
