company:
  name: VulcanForms
chapter:
  number: 1
  title: Company Overview
  summary: VulcanForms is an MIT-born advanced manufacturing company building digital-first U.S. factories that combine proprietary laser powder bed fusion, precision machining, automation, inspection, and software into one production workflow. Primary company and MIT sources consistently describe the business as founded in 2015 by Martin C. Feldmann and MIT professor John Hart, while 2024-2026 company releases show a leadership transition to CEO Kevin Kassekert and President Jay Martin as the firm scaled toward higher-volume industrial production. Public evidence supports two major disclosed financing events—a $355 million 2022 round at a $1 billion-plus valuation and a January 2026 oversubscribed $220 million round—while also preserving unresolved questions around exact headquarters conventions, full lifetime funding beyond the two headline rounds, and independent confirmation of operating turbulence raised by adverse press.
sections:
- id: identity-and-platform
  title: Identity, mission, and production model
  body: |-
    VulcanForms positions itself as a manufacturing company rather than a standalone machine vendor or prototype shop. Across its homepage, media kit, and January 2026 financing release, the company repeatedly describes itself as the first fully integrated digital metal manufacturing platform in the United States and says its objective is to compress fragmented multi-vendor metal supply chains into one domestic, production-grade workflow. The official narrative centers on reshoring: management argues that mission-critical metal parts should no longer pass through multiple countries and suppliers when digital-first U.S. production can offer tighter lead-time control, lower waste, and stronger supply-chain security.

    The operating model combines additive manufacturing, precision machining, automation, inspection, and proprietary software rather than selling a single box. Official product pages show the front end of the stack: a GEN 3 metal LPBF printer with a stated 40 kW system using 75 lasers at 550 W, a centralized control system that tracks builds in real time, and software modules spanning DFAM, slicing, simulation, in-process monitoring, and traceability. MIT's 2022 profile corroborates the core technical thesis: VulcanForms built its own laser-array LPBF architecture, integrated it with machining, robotics, and post-processing, and framed that integrated digital thread—not just printer power—as the real source of industrial relevance.

    This full-stack positioning matters strategically because VulcanForms is trying to own the production value stream from powder through finished part rather than compete only on machine sales. Company pages and investor-backed announcements claim the platform is already embedded in customer workflows across medical, defense, aerospace, compute/semiconductor, consumer, and industrial applications. The burden of proof is therefore not whether VulcanForms can print a part, but whether the combined factory system can deliver repeatable, qualified output at the pace and economics implied by its domestic reindustrialization pitch.
