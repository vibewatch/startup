- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current economics stay opaque
    - Management still cannot show credible current revenue, margin, and backlog quality
    - The private-market signal remains impossible to validate
    - Do not underwrite; stay in track / research-more mode
  - - Permit or EHS failure
    - Material agency notice, serious incident, or failed audit during expansion
    - Compliance shock hits output, customer trust, and financing confidence
    - Pause any investment work until remediation is demonstrated
  - - Qualification slippage on key programs
    - Large programs stall or fail to move into repeat production
    - Base and bull cases lose volume assumptions quickly
    - Re-rate to bear or demand revised price
  - - Another financing before utilization proof
    - New capital is needed before operating leverage is visible
    - Dilution and capital-intensity concerns dominate upside
    - Assume lower common-equity returns immediately
  - - Major customer-program loss or concentration surprise
    - Top-account share is worse than expected or a flagship program exits
    - Revenue durability and bargaining power assumptions break
    - Require customer-level rebuild of the model
  notes: These are direct thesis-breakers, not generic startup risks.
  claimRefs:
  - CV034
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current revenue and backlog
    - Current ARR/revenue, booked backlog, mix by program, and backlog aging
    - This is the core bridge from story to underwriteable price
    - CFO data room and board package
  - - Gross margin and unit economics
    - Gross margin by process/site, contribution margin, scrap/rework, and utilization
    - Premium pricing is only credible if operating leverage is real
    - Finance, operations, and plant-controller review
  - - Customer concentration and durability
    - Top-20 accounts, part-family concentration, contract duration, renewal/expand data
    - Concentration can dominate value in a factory model
    - CRO/CEO diligence with cohort exports
  - - Cap table and preferences
    - Share classes, liquidation stack, anti-dilution, participation, and insider secondaries
    - Headline valuation may overstate common-equity value materially
    - Company counsel plus cap-table export
  - - Permits and quality/compliance
    - Permit inventory, recent filings, agency notices, audit results, and yield/quality KPIs
    - Compliance and quality failures can break the thesis faster than slow growth
    - HSSE and operations diligence
  notes: These asks are the minimum package required to move from valuation framing to actual underwriting.
  claimRefs:
  - CV023
  - CV032
  - CV033
  - CV039
  - CV041
