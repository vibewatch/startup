- id: comparable-set-and-market-reference
  title: Comparable Set and Market Reference
  body: 'The comparable set is necessarily messy because Vulcan sits between categories. Xometry and Protolabs are the most relevant ''custom manufacturing platform'' comps, but they are more marketplace- or service-centric and disclose far more revenue detail than Vulcan does. Materialise shows what long-run additive scale can look like when software, services, and medical applications are diversified. 3D Systems and Velo3D are closer to core additive manufacturing, but they also demonstrate how margin pressure, losses, and financing needs can persist in public markets. Market-research sources are helpful in a different way: they confirm that the overall category is large and growing, with services and metal AM occupying meaningful subsegments. Taken together, the comp set does not prove Vulcan is overvalued. It does show that investors normally get much clearer revenue and margin visibility before they can defend premium pricing with confidence.'
