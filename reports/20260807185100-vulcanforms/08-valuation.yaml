- id: scenarios-and-return-logic
  title: Bull, Base, Bear Scenarios and Return Logic
  body: Scenario framing is more useful here than false precision. In the bull case, Vulcan turns its integrated stack into a scaled secure-production platform, gains durable volume in aerospace, medical, semiconductor, and adjacent programs, and eventually supports multi-hundred-million revenue with premium economics. In the base case, the company succeeds strategically but grows into value only slowly as qualification cycles, capacity additions, and fixed-cost leverage keep returns moderate. In the bear case, some combination of slower qualification conversion, site-utilization gaps, pricing pressure, or additional financing weakens returns materially. The key observation is that a $1 billion-style entry point already consumes a lot of future success. Public evidence is not strong enough to say the bull case will happen, but it is strong enough to say the bear case is real if current economics are weaker than the market signal implies. That asymmetry argues for disciplined patience.
  claimRefs:
