      - number: '8.6'
        title: Exit Readiness, Thesis-break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              VulcanForms is not yet at the stage where public evidence supports a clean exit-readiness or underwriting
              verdict. The biggest missing pieces are current commercial quality, not abstract market size. Investors
              still need current revenue, gross margin by process and site, backlog composition, top-customer
              concentration, contract duration, pricing/mix, cap-table and preference terms, permit status, quality
              KPIs, and evidence that new capacity can be filled without a financing reset. Those same gaps define the
              thesis-break triggers: permit or EHS failure, a major customer-program loss, slower-than-expected
              qualification conversion, or another financing event before utilization has been proven. If management can
              close those gaps, the valuation case could improve quickly. Until then, the right stance is to treat the
              company as strategically interesting but not yet price-cleared.
