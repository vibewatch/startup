chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and production model
        blocks:
          - type: paragraph
            body: >-
              VulcanForms positions itself as a manufacturing company rather than a standalone machine vendor or
              prototype shop. Across its homepage, media kit, and January 2026 financing release, the company repeatedly
              describes itself as the first fully integrated digital metal manufacturing platform in the United States
              and says its objective is to compress fragmented multi-vendor metal supply chains into one domestic,
              production-grade workflow. The official narrative centers on reshoring: management argues that
              mission-critical metal parts should no longer pass through multiple countries and suppliers when
              digital-first U.S. production can offer tighter lead-time control, lower waste, and stronger supply-chain
              security.


              The operating model combines additive manufacturing, precision machining, automation, inspection, and
              proprietary software rather than selling a single box. Official product pages show the front end of the
              stack: a GEN 3 metal LPBF printer with a stated 40 kW system using 75 lasers at 550 W, a centralized
              control system that tracks builds in real time, and software modules spanning DFAM, slicing, simulation,
              in-process monitoring, and traceability. MIT's 2022 profile corroborates the core technical thesis:
              VulcanForms built its own laser-array LPBF architecture, integrated it with machining, robotics, and
              post-processing, and framed that integrated digital thread—not just printer power—as the real source of
              industrial relevance.


              This full-stack positioning matters strategically because VulcanForms is trying to own the production
              value stream from powder through finished part rather than compete only on machine sales. Company pages
              and investor-backed announcements claim the platform is already embedded in customer workflows across
              medical, defense, aerospace, compute/semiconductor, consumer, and industrial applications. The burden of
              proof is therefore not whether VulcanForms can print a part, but whether the combined factory system can
              deliver repeatable, qualified output at the pace and economics implied by its domestic reindustrialization
              pitch.
            claimRefs:
