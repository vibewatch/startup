  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked Risk View
        blocks:
          - type: paragraph
            body: >-
              The highest-risk question on VulcanForms is not whether the technology works; it is whether an ambitious,
              capital-intensive factory system can scale faster than complexity accumulates. Public evidence shows real
              positives: large financings in 2022 and 2026, expansion into multiple Massachusetts sites, demand that
              reportedly exceeds available capacity, and a more explicit operating stack that includes software,
              machining, and additive production. But those same facts define the downside. A fully integrated model
              means shortfalls in safety, permits, utilities, calibration, staffing, supplier continuity, or customer
              qualification can transmit directly into output, margins, and financing needs. Because customer names,
              concentration, utilization, and site-level economics remain mostly private, the public record supports a
              cautious underwriting stance. The most important residual risks are EHS and regulatory burden, facility
              and supplier dependency, long qualification cycles in mission-critical end markets, and the possibility
              that fresh capital still proves insufficient if ramp timing slips.
            claimRefs:
              - CR001
              - CR002
