  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              VulcanForms does not sit inside a single clean software or equipment category. The closest fit is
              production-grade metal additive manufacturing for complex, qualification-heavy parts, but the company is
              explicitly selling an integrated workflow that combines LPBF, machining, monitoring, and traceability
              rather than a printer alone. Its official industry pages anchor that workflow in three public verticals
              that matter for underwriting: defense, medical, and compute. In those verticals, the included spend is not
              every dollar of factory automation. It is the subset of metal-component spend where complex geometry,
              short lead time, domestic sourcing, or supplier qualification make digital production structurally
              attractive. Vulcan's compute page is especially revealing because it maps the offering to heat exchangers,
              liquid-cooled cold plates, high-conductivity structures, and semiconductor-manufacturing components—jobs
              where thermal performance and geometry matter more than commodity piece-part pricing.


              The best market boundary therefore excludes most of the simple '3D-printing TAM' language seen in generic
              reports. It should not include polymer printing, broad PLM/software budgets, mass-market consumer devices,
              or high-volume commodity fabrication where conventional casting, forging, or machining already dominates
              on cost. The real status quo competitors are legacy overseas or fragmented domestic supply chains that
              stitch together casting/forging, CNC finishing, inspection, and qualification across multiple vendors.
              McKinsey's older but still useful manufacturing framing reinforces why this niche exists at all: additive
              is most economically compelling when buyers need spare parts, small-series production, tooling, or
              geometries that conventional methods handle poorly. For VulcanForms, market size only becomes meaningful
              once that narrower, high-value boundary is set.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
