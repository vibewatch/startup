      - number: '8.2'
        title: Investment Thesis versus Anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is not hard to articulate. Market reports show a growing global and North American 3D-printing
              opportunity, with metal AM and services benefiting from aerospace, defense, medical, and other high-spec
              demand. Vulcan’s vertically integrated production model plus its patent footprint create a plausible moat,
              especially in applications where domestic supply-chain resilience and tight tolerances matter. The
              anti-thesis is almost equally straightforward. Public evidence does not show enough current economic proof
              to justify treating the company like a fully de-risked platform. Customer secrecy, long qualification
              cycles, fixed-cost leverage, and regulatory/compliance complexity all raise the hurdle for premium
              pricing. Even supportive public comparables do not prove the price; they mostly show how much operational
              proof is normally visible by the time investors can comfortably pay up. The core conclusion is that the
              business thesis may be right while the valuation still remains demanding.
            claimRefs:
              - CV001
              - CV002
              - CV003
