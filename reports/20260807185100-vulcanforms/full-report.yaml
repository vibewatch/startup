      - number: '6.4'
        title: Concentration, Secrecy, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              The same secrecy that protects Vulcan's account base also creates a real customer-underwriting problem.
              Multiple sources stress that Vulcan rarely names clients and that most projects are confidential, with
              even friendly independent coverage conceding that customer names are largely absent. That can be benign in
              defense and advanced manufacturing, but it also means investors cannot tell from public evidence whether
              revenue is well diversified or tied to a small number of strategic programs. Procurement friction likely
              remains high because the target customers are not buying commodity parts: they are buying qualification,
              supply-chain confidence, and repeatability. This tends to produce longer cycles and a barbell-shaped
              customer mix in which a few important programs matter a lot. Public evidence therefore supports real
              customer value, but also meaningful concentration risk and a need for program-level pipeline disclosure
              during diligence.
            claimRefs:
              - CU021
