      - number: '3.3'
        title: Business Model, Packaging, Pricing Opacity, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains opaque almost everywhere in this category. The dominant packaging model among EOS,
              Nikon, ATLIX, and 3D Systems is still capex machine sale plus materials, support, and qualification
              services, with commercial terms handled by quote. That makes direct apples-to-apples price comparison
              difficult and pushes competition into non-price variables such as parameter freedom, qualification
              support, uptime, software integration, and local service capacity. Velo3D is more flexible because it can
              sell equipment or route customers into Rapid Production Solutions, reducing the need for upfront capacity
              investment. Seurat goes furthest in that direction by asking buyers to buy parts rather than hardware.
              Digital Metal historically straddles both sides: it has sold printers while also offering small-volume and
              mass-production printing services.


              Those packaging differences create real switching costs. Once a buyer has qualified a machine, parameter
              set, material, and post-processing route—or once it has approved a manufacturing partner with validated
              documentation—the hurdle to change suppliers rises sharply. EOS and Nikon both make this explicit through
              qualification and parameter-control language; 3D Systems pushes monitoring and inspection; Velo3D leans on
              the Golden Print File; and Vulcan leans on integrated production traceability. The result is a market
              where pricing pressure exists, but commoditization is incomplete. Buyers may multi-home across vendors,
              yet they rarely want to restart qualification without a compelling cost, speed, geometry, or resilience
              advantage.
