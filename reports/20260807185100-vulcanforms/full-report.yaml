      - number: '7.4'
        title: People, Customer, and Financial-model Risk
        blocks:
          - type: paragraph
            body: >-
              The softer side of the risk picture is still material because VulcanForms is trying to move from
              breakthrough manufacturing capability to repeatable industrial execution. The 2024 CEO and president
              appointments give the company an operating leadership structure built for the next stage, but they also
              introduce transition risk at the same moment the company is accelerating facilities, hiring, and customer
              programs. Public reporting continues to emphasize John Hart’s technical and strategic role, which suggests
              that institutional knowledge remains concentrated in a small founding circle. Customer opacity compounds
              this. Public sources show strong segment relevance—medical implants, cooling parts, aerospace and defense
              hardware—but very few named accounts, no contract-duration disclosure, and no public concentration
              metrics. Financially, the company’s private status means investors cannot directly test utilization, unit
              economics, or working-capital efficiency. That is why fresh financing should be seen as time and
              optionality, not proof that scale economics are already secure.
