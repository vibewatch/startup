      - number: '6.3'
        title: Retention, Durability, and Expansion Mechanics
        blocks:
          - type: paragraph
            body: >-
              The best retained evidence for customer durability is relational rather than metric-driven. John Hart told
              3DPrint.com that the goal is to start with a small number of applications and grow the relationship over
              time as Vulcan's manufacturing capabilities become more important to the customer. That is exactly how one
              would expect adoption to work in a regulated or mission-critical manufacturing service: early proof often
              starts with a narrow part family, then expands only after qualification, repeatability, and supplier trust
              are established. The 2026 funding coverage that says demand exceeds capacity and includes large long-term
              orders is directionally supportive of this expansion model. But the public record does not disclose
              contract length, repeat-order rates, NRR, GRR, churn, or even customer count. So durability cannot be
              underwritten directly. The right interpretation is that expansion logic exists and is plausible, but
              actual retention quality remains private.
            claimRefs:
