      - number: '8.3'
        title: Financing Context, Valuation Signals, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              VulcanForms has undeniably attracted capital: roughly $575-$576 million raised, including the $220 million
              January 2026 financing. Analyst and secondary sources cluster around a $1 billion private-market signal,
              with Legion explicitly showing a $1 billion blended valuation and a recent secondary quote surface, and
              Tracxn placing the company at a $1 billion valuation as of the 2022 round. The problem is not a lack of
              signal; it is the quality of the signal. The exact 2026 post-money is not clearly disclosed in a retained
              primary source, and the public record does not present current revenue or margin data that would let
              investors test whether the signal is cheap, fair, or expensive. That means entry discipline should be
              proof-based rather than story-based. New money should require either a meaningfully better price or
              management-grade evidence that current revenue, margin, and backlog quality already clear the hurdle
              implied by the private-market mark.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV039
      - number: '8.4'
        title: Bull, Base, Bear Scenarios and Return Logic
        blocks:
          - type: paragraph
            body: >-
              Scenario framing is more useful here than false precision. In the bull case, Vulcan turns its integrated
              stack into a scaled secure-production platform, gains durable volume in aerospace, medical, semiconductor,
              and adjacent programs, and eventually supports multi-hundred-million revenue with premium economics. In
              the base case, the company succeeds strategically but grows into value only slowly as qualification
              cycles, capacity additions, and fixed-cost leverage keep returns moderate. In the bear case, some
              combination of slower qualification conversion, site-utilization gaps, pricing pressure, or additional
              financing weakens returns materially. The key observation is that a $1 billion-style entry point already
              consumes a lot of future success. Public evidence is not strong enough to say the bull case will happen,
              but it is strong enough to say the bear case is real if current economics are weaker than the market
              signal implies. That asymmetry argues for disciplined patience.
            claimRefs:
              - CV020
