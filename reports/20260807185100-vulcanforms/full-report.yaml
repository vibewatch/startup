      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is not homogeneous across VulcanForms' three public verticals. In defense, the practical
              buyer is usually a prime contractor, program office, depot, or qualification authority looking for
              resilient domestic supply rather than the absolute cheapest component. Budget ownership can sit with prime
              procurement teams, defense-program offices, or broader modernization budgets, and adoption depends on a
              supplier clearing qualification and process-control hurdles. The White House's AM Forward initiative and
              the America Makes JAQS-SQ qualification program both reinforce that point: the gating factor is often
              supplier readiness, standards, and onboarding rather than raw awareness of additive manufacturing.


              Medical buyers behave differently. The end customer is typically a device OEM or a contract-manufacturing
              organization, but the effective user set spans R&D, regulatory, quality, and operations. FDA materials
              make clear that additive adoption can be real and durable—hearing aids and metal spine cages are already
              established examples—yet every program still has to work through software workflow controls, materials
              traceability, post-processing, cleaning, sterility, and final-device testing. Compute and semiconductor
              buyers are more engineering-led. The user is an infrastructure, thermal, or equipment-design team; the
              payer may sit in advanced-manufacturing, product-line, or capex budgets; and the adoption trigger is often
              a thermal or geometry problem that conventional manufacturing cannot solve cleanly. Vulcan's own compute
              page, Mordor's semiconductor-AM report, and 3D Systems' data-center commentary all point to the same
              pattern: demand grows when power density, cooling complexity, and iteration speed rise together.
