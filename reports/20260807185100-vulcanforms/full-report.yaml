              The strongest public quality signals are closed-loop control, real-time monitoring, in-process sensing,
              testing/validation language, and powder-to-part traceability. Those controls are plausible and described
              consistently across the product pages and recruiting surface. Yet independent proof of uptime, scrap,
              yield, and qualification depth remains thin. The most adverse retained source is a 2023 3DPrint.com
              article alleging low uptime and qualification struggles based on anonymous former-employee accounts;
              because that article also contains factual inaccuracies elsewhere, it should be treated as a warning
              signal rather than a confirmed operating diagnosis. The technical verdict is favorable but conditional:
              the architecture looks real and differentiated, but investors should demand current production KPIs,
              certification evidence, and software/security assurance before treating the platform as de-risked
