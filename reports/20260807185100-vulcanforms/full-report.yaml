      - number: '2.5'
        title: Diligence Gaps and Market Underwriting Implications
        blocks:
          - type: paragraph
            body: >-
              The main market-analysis risk is false precision. Public evidence is good enough to show that VulcanForms
              operates in a strategically important and expanding set of markets, but it is not good enough to produce a
              single clean SAM/SOM figure without analytical transformation. The largest adjacency numbers—especially in
              medical devices—overstate what Vulcan can likely capture because they include broader additive categories,
              device types, and manufacturing models beyond metal LPBF plus precision finishing. The narrowest
              numbers—such as semiconductor additive manufacturing alone—understate the full opportunity because Vulcan
              also sells into defense, medical, and broader compute infrastructure.


              That uncertainty should change the diligence posture. Rather than underwriting the company on a headline
              TAM, the more durable market questions are operational: which vertical is the true near-term beachhead;
              how many part families have already cleared qualification; whether compute thermal-management and
              semiconductor-tooling demand is episodic or repeat; and how much of the defense opportunity depends on
              policy-assisted supplier onboarding versus organic prime adoption. Public-company proxies like 3D Systems
              help confirm that high-value additive demand exists in aerospace, defense, med-tech, and data-center
              infrastructure, but they do not prove that Vulcan's integrated-factory model will capture those budgets at
              scale. Market diligence should therefore focus less on top-down TAM optimism and more on buyer
              qualification velocity, program conversion, repeat production share, and whether Vulcan has a segment
              where its integrated domestic workflow is meaningfully better than incumbent alternatives.
            claimRefs:
