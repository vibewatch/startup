      - number: '6.2'
        title: Public Customer Proof and Adoption Signals
        blocks:
          - type: paragraph
            body: >-
              Public proof is better than a simple logo wall, but it is still incomplete. MIT coverage and derivative
              reporting say VulcanForms produced a complex cooling component for a supercomputer manufacturer in two
              days, and that it has also produced medical implants, industrial tooling, tire molds, and components for
              aviation and defense contractors. More recent independent reporting from 3DPrint.com and MIT Mechanical
              Engineering shows demonstration parts such as knee and hip implant components, computer-cooling devices,
              and small missile engines, while the official product/industry pages add market-specific application
              language for aerospace, medical, compute, semiconductor, and consumer goods. The company also says demand
              exceeded available capacity in early 2026 and that customers were already placing large, long-term orders.
              Those are meaningful signals, but they do not solve the biggest customer-proof problem: most actual
              customer names remain confidential, so public evidence proves solution fit and buying interest more
              clearly than it proves account concentration, retention, or full production depth across verticals.
