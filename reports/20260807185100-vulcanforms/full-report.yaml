      - number: '3.2'
        title: Capability Breadth and Production-Readiness Comparison
        blocks:
          - type: paragraph
            body: >-
              The largest incumbents have deeper machine portfolios and broader formal support ecosystems than
              VulcanForms. EOS's M4 ONYX is a six-laser platform aimed at aerospace, energy, industrial, and
              semiconductor use cases, with claimed 50% higher throughput, 30% lower part cost, and monitoring software
              that reduces non-destructive testing. Nikon SLM positions itself around open architecture, customizable
              parameter sets, and a large material-and-parameter portfolio, backed by aerospace and Honeywell
              qualification testimonials and by Nikon AM Synergy's U.S. defense-oriented engineering unit. 3D Systems
              combines an established DMP printer family with metal materials, monitoring, inspection software, and
              visible demand signals in aerospace, defense, med-tech, and data-center infrastructure. Velo3D emphasizes
              complex geometry, large-format capacity, domestic system design, and the Golden Print File to preserve
              repeatability across engagement models.


              Vulcan's differentiation is not that rivals lack industrial-grade metal printing; they clearly have it.
              The distinction is instead in workflow ownership. Vulcan sells a combined additive-plus-machining
              production system, while most incumbents still begin from equipment and enablement. That matters because
              many buyers do not want to build an internal AM organization from scratch, especially when qualification,
              finishing, inspection, and documentation are the bottlenecks. Seurat sharpens that contrast by eliminating
              customer machine ownership entirely, but it does so with a different process and business model aimed at
              serial production. Digital Metal sharpens it from another angle: binder jetting can promise high precision
              and high volume for small complex parts, potentially challenging LPBF economics when full-density and
              finishing requirements are manageable. Capability breadth therefore favors incumbents; manufacturing-model
              convenience is where Vulcan, Seurat, and Velo3D make their strongest competitive case.
