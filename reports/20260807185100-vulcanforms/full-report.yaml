  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Permits / EHS compliance
        - Agency notice, failed audit, or incident spike
        - Any material notice of violation or serious lost-time incident
        - Pause underwriting until corrective-action evidence is reviewed.
      - - Site concentration / continuity
        - Extended downtime at Devens or Newburyport
        - Multi-day interruption or missed customer deliveries at a key site
        - Stress-test redundancy and working-capital buffer before proceeding.
      - - Customer concentration / qualification
        - Top-program slip or delayed conversion to repeat production
        - A flagship program fails qualification or backlog concentration exceeds management claims
        - Require customer-level cohort and backlog data before committing.
      - - Capital efficiency
        - New financing need before utilization proof
        - Another equity or expensive debt raise before operating leverage is demonstrated
        - Re-rate downside and treat prior valuation as unsupported.
      - - Leadership / execution depth
        - Missed hiring, launch, or governance milestones
        - Key roles remain unfilled or decision rights appear fragmented during ramp
        - Move to track / research-more until bench depth is clearer.
    notes: These kill criteria translate public risks into diligence conditions investors can actually monitor.
    claimRefs:
      - CR033
      - CR034
      - CR041
      - CR042
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
      - Basis
    rows:
      - - Recommendation
        - Track / research-more
        - Do not underwrite the current private-market signal for new money without management-grade proof
        - Public evidence supports company quality more than price support
      - - Confidence
        - Medium
        - Directional conviction is possible, precision is not
        - Funding and market facts are visible; revenue and margin facts are not
      - - Risk rating
        - High
        - Downside remains sensitive to utilization, compliance, concentration, and financing
        - Factory-model leverage plus opaque metrics widen outcomes
      - - Valuation stance
        - Stretched
        - Treat current marks as aspirational until revenue quality is demonstrated
        - $1B-style signals already imply substantial future scale
      - - Entry discipline
        - Require lower price or better proof
        - Either price resets or current economics must clear the hurdle table
        - Primary-source post-money and current revenue are not publicly disclosed
    notes: >-
      Recommendation is based on public evidence only and could move with private diligence on current economics and
      round terms.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Support
      - Counterweight
      - What would change the view
    rows:
      - - Large and growing market
        - >-
          Market-research sources show continued 3D-printing and metals growth, especially in North America and
          industrial segments
        - Category growth does not automatically justify a premium private entry multiple
        - Show that Vulcan captures outsized share with strong margins and repeat production
      - - Integrated domestic-production moat
        - Official materials show additive, machining, and software integrated in one stack
        - Integrated factories can also be harder and more capital-intensive to scale
        - Provide site-level economics, yields, and customer expansion data
      - - Strategic end markets are attractive
        - Public evidence points to aerospace, defense, medical, and other high-spec demand
        - Those same sectors often have long qualification cycles and heavy compliance overhead
        - Show time-to-qualification, conversion, and multi-year program durability
      - - IP and know-how may matter
        - Dealroom and company sources indicate patent breadth and technical differentiation
        - Patent estimates do not prove pricing power or customer lock-in
        - Show win/loss evidence, switching costs, and margin resilience
      - - Investor conviction is real
        - Large financings and analyst/secondary valuation surfaces show genuine investor interest
        - Current post-money and waterfall terms remain opaque, so conviction may not equal fair price
        - Disclose round terms, current revenue, and current backlog quality
    notes: This table separates the strength of the company thesis from the strength of the current price.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV010
      - CV013
      - CV028
      - CV029
      - CV042
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Exit revenue of $350-500M with 7-10x exit multiple; strong multi-site utilization and premium sector mix
        - Approx. $2.45-5.0B future value from a $1B-style entry reference
        - Execution, qualification, and sustained premium margins
        - Possible but needs unusually strong proof
      - - Base
        - >-
          Exit revenue of $180-250M with 5-7x exit multiple; growth is real but capital intensity and qualification drag
          persist
        - Approx. $0.9-1.75B future value, implying moderate or uneven venture returns
        - Fixed-cost leverage, pricing, and slower capacity fill
        - Most plausible from public evidence
      - - Bear
        - Exit revenue of $80-120M with 4-6x exit multiple; utilization and conversion underwhelm and financing returns
        - Approx. $0.32-0.72B future value with material capital impairment risk
        - Further dilution, margin pressure, or customer-program slippage
        - Material downside if proof stays weak
    notes: Scenario math is deliberately coarse and intended to illustrate asymmetry rather than claim a precise fair value.
    claimRefs:
      - CV020
      - CV021
      - CV025
      - CV026
      - CV027
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Xometry (Q2 2026)
        - Quarterly revenue / growth / EBITDA / cash
        - $229M revenue, +41% YoY, $14.1M Adj. EBITDA, $517M cash after equity raise
        - Shows what scaled custom-manufacturing visibility can look like in public markets
        - More asset-light marketplace mix than Vulcan
      - - Protolabs (Q2 2026)
        - Quarterly revenue and profitability
        - $149.3M revenue, +10.6% YoY, positive GAAP and non-GAAP EPS
        - Useful digital-manufacturing services comp with established aerospace credibility
        - Broader process mix and far longer operating history
      - - Materialise (2025/2026 public IR markers)
        - Annual revenue and usage scale
        - €268M annual revenue; 2.1M+ parts printed in 2025; 60K+ patients helped
        - Shows that AM software/services scale can be real and diversified
        - Different mix of software, medical, and services
      - - 3D Systems (Q2 2026)
        - Quarterly revenue and profitability status
        - $94.6M revenue; net loss; slightly negative Adj. EBITDA; raised equity in quarter
        - Public AM comp showing that growth does not guarantee clean profitability
        - Mature incumbent with different portfolio and restructuring history
      - - Velo3D (Q1 2026 filing)
        - Financing and risk-factor posture
        - Public filing highlights financing need and going-concern sensitivity
        - Useful downside comp for metal-AM capital intensity and customer-concentration risk
        - Business distress makes it a floor-style rather than fair-value comp
      - - Private Vulcan valuation signals
        - Analyst and secondary surfaces
        - ~$1B blended / latest valuation signals in Legion and Tracxn
        - Anchors the current market signal investors are being asked to assess
        - Indirect, partially modeled, and not a primary post-money disclosure
    notes: >-
      Rows mix clean operating comps with indirect private valuation signals because no single public comp cleanly
      matches Vulcan’s hybrid manufacturing-software position.
