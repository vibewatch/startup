      - number: '6.5'
        title: Customer Verdict and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              The customer verdict is favorable on relevance and weaker on measurability. Vulcan clearly serves real
              industrial use cases that conventional manufacturing often struggles to solve: cooling parts with
              microscopic internal channels, medical implant geometries, aerospace/defense hardware, and other parts
              that benefit from integrated additive-plus-machining workflows. The problem is not lack of public customer
              relevance; it is lack of public customer analytics. Investors still need named top accounts, revenue by
              vertical, part-family concentration, conversion from qualification to repeat production, repeat-order
              rates, contract duration, and evidence that the largest programs can survive pricing or qualification
              pressure. Until those data are provided, the right customer stance is that Vulcan appears to have strong
              product-market fit in a narrow set of high-value segments, but still carries significant opacity risk
              around concentration and retention.
