  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Equipment Vendors, Service Platforms, and Contract Manufacturers'
        blocks:
          - type: paragraph
            body: >-
              The competitive set divides into three classes. First are industrial machine-and-software vendors: EOS,
              Nikon SLM Solutions, ATLIX (formerly TRUMPF Additive Manufacturing), and 3D Systems all sell
              production-grade metal-printing platforms supported by materials, software, and process services. Second
              are hybrid platform players that blend hardware with manufacturing services: Velo3D now markets an
              integrated hardware-software-services stack and explicitly offers Rapid Production Solutions so customers
              can adopt additive without taking all capacity risk themselves. Third are contract manufacturers or
              alternative process providers that sell output rather than primarily selling boxes. Seurat fits this model
              most clearly by positioning itself as a contract metal manufacturer using Area Printing with no customer
              CapEx, while Digital Metal/Markforged pushes binder jetting toward high-volume production and also offers
              service production.


              VulcanForms therefore does not face one single direct rival. Against EOS, Nikon, ATLIX, and 3D Systems, it
              competes against the possibility that a buyer can qualify its own or a partner's hardware-centered
              production stack. Against Velo3D and Seurat, it competes more directly on the promise of outsourced,
              domestically relevant production capacity. Against Digital Metal, it faces a process substitute designed
              for small, precise, and potentially high-volume metal parts where binder jetting can win on economics. The
              field is fragmented enough that buyers can mix sourcing models—buying machines for some part families,
              outsourcing others, and dual-sourcing qualified suppliers where availability or security matters.
