      - number: '2.2'
        title: Sizing Lenses and Contradictory Top-Down Estimates
        blocks:
          - type: paragraph
            body: >-
              No retained third-party source cleanly sizes 'integrated U.S. digital metal manufacturing for defense,
              medical, and compute.' Instead, the public record offers several overlapping lenses with different
              definitions. Broad metal-additive estimates diverge sharply even for the same year: Fortune Business
              Insights puts the 2026 3D-printing-metals market at $3.75 billion, while Straits Research places the 2026
              metal additive manufacturing market at $6.27 billion. Credence Research starts from a $5.86 billion 2024
              base and a 13.4% CAGR to 2032, which implies a roughly $7.5 billion 2026 equivalent if the same trajectory
              is carried forward. Intent Market Research offers another growth path from $2.2 billion in 2023 to $7.4
              billion by 2030. The headline conclusion is not that one of these numbers must be correct; it is that TAM
              depends heavily on whether the publisher includes systems, materials, services, finished parts, or broader
              adjacencies.


              The more decision-useful sizing lenses come from the verticals Vulcan actually names. Semiconductor
              additive manufacturing is estimated by Mordor at $423 million in 2026, while adjacent thermal-management
              hardware in semiconductor fabs reaches $2.22 billion in 2026 for chillers and heat exchangers and $8.60
              billion for semiconductor thermal-management materials. Medical-device adjacency is much larger—Dimension
              Market Research estimates $17.7 billion in 2026 for additive manufacturing in medical devices—but that
              market is broader than Vulcan's metal-only footprint and includes application classes not necessarily
              matched to the company's current production scope. The right inference is that Vulcan's near-term
              opportunity is almost certainly smaller than the broadest medical adjacency but larger than the narrowest
              semiconductor-AM subset, with compute/semiconductor serving as the cleanest quantified beachhead and
              defense/medical providing strategic expansion vectors that are real but harder to isolate numerically from
              public sources.
