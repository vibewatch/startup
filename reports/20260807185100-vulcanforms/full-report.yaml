      - number: '2.4'
        title: Growth Drivers, Policy Tailwinds, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Four drivers matter most for VulcanForms. First, U.S. industrial policy is moving toward domestic,
              qualified additive capacity: AM Forward creates OEM pull for U.S.-based suppliers, and the 2026 DoD
              Organic Industrial Base Modernization Challenge explicitly funds additive, in-situ quality, robotics, and
              automation capabilities relevant to factory-scale metal production. Second, qualification infrastructure
              is slowly becoming more formalized. America Makes' $10.5 million JAQS-SQ expansion is effectively an
              attempt to turn fragmented metal-AM supplier readiness into a more repeatable defense-manufacturing
              pipeline. Third, compute and semiconductor systems are creating geometry and cooling demands that reward
              additive manufacturing, especially in high-conductivity metals and complex thermal pathways. Fourth, the
              medical market continues to value patient-specific and high-complexity devices where additive enables
              design freedom that conventional manufacturing struggles to match.


              The counterweights are just as important. Qualification and contamination burdens remain severe in both
              medical and semiconductor environments. FDA guidance emphasizes material controls, post-processing, and
              final-device validation; Mordor similarly notes that cleanroom and contamination frameworks for
              semiconductor additive builds remain bespoke and immature. Defense adds its own friction through long
              procurement cycles, program gating, and qualification audits. Finally, additive remains a cyclical
              capital-spending market. Even supportive sources acknowledge that the industry is still emerging from a
              downturn: 3D Systems' Q2 2026 commentary described a multi-year slump even while reporting strong growth
              in aerospace, defense, medical technology, and data-center infrastructure. That combination means Vulcan's
              market can grow quickly in pockets without translating into smooth, linear adoption across the whole
              industrial base.
