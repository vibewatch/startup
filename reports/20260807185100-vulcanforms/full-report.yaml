  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and What Public Traction Actually Proves
        blocks:
          - type: paragraph
            body: >-
              VulcanForms appears to monetize as an integrated manufacturing platform rather than as a pure software or
              pure equipment company. Its public materials describe additive manufacturing, precision machining, and
              software as pieces of one domestic production workflow, while industry pages and headcount aggregators
              describe the company serving aerospace, defense, medical, compute, and semiconductor programs. That
              supports a revenue model built around qualified-part production, engineering-heavy program ramps, and
              follow-on manufacturing work once a part family is approved. The problem is that this public evidence
              proves packaging and market focus, not realized revenue. Neither the company's own site nor the 2026
              financing releases disclose annual revenue, gross margin, backlog conversion, or revenue split between
              additive printing, machining, software, and inspection. Third-party databases and profile sites supply
              funding and employee estimates, but they still do not provide an auditable income statement. As a result,
              the right financial read is that Vulcan has public proof of real commercial activity and customer
              relevance, but not public proof of the scale or quality of recognized revenue. Diligence needs revenue by
              stream, top-customer concentration, utilization by production cell, and the percentage of revenue that
              recurs through repeat production rather than one-time qualification or NPI work.
            claimRefs:
