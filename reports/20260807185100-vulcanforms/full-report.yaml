  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer / User Jobs
        blocks:
          - type: paragraph
            body: >-
              VulcanForms appears to sell into a narrow set of demanding industrial customer segments rather than a
              broad mass market. Across official industry pages and independent coverage, the most visible customer
              clusters are aerospace and defense buyers needing complex, high-reliability metal components;
              medical-device and implant programs needing biocompatible materials and validated quality; compute and
              semiconductor-adjacent customers needing thermal-management components and tight tolerances; and a smaller
              but expanding set of consumer-goods or clean-tech applications where additive geometry or supply-chain
              resilience matters. In practice, the buyer is likely a manufacturing, supply-chain, or engineering
              organization, while the end user is a program team that needs finished parts rather than printer access.
              That aligns with Vulcan's manufacturing-as-a-service posture: it is not trying to maximize the number of
              logos so much as the number of qualified part families that can expand into repeat production over time.
