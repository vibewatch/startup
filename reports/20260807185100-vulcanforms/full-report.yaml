      - number: '3.5'
        title: Adverse Signals and the Underwriting Angle
        blocks:
          - type: paragraph
            body: >-
              The most important adverse signal is not that Vulcan has no competitors; it is that several competitors
              have already translated comparable technical narratives into institutionalized platforms. EOS and 3D
              Systems possess broader installed-base and services logic than a private startup. Nikon has
              defense-specific manufacturing infrastructure in the United States. Velo3D offers a similar rhetoric of
              complex geometries, domestic supply, and production transition, though with a more fragile balance-sheet
              backdrop. Seurat and Digital Metal suggest that different process choices could win on cost or volume in
              part families that do not require Vulcan's exact LPBF-plus-machining flow.


              That means the underwriting question is whether Vulcan is merely another metal-AM story or a genuinely
              superior production model for specific buyer jobs. The most durable case is not broad technological
              leadership but segment-specific superiority: parts where integrated finishing matters, where domestic
              supply and qualification are worth paying for, and where customers prefer an outsourced manufacturing
              partner over internal machine ownership. If Vulcan cannot show repeatable wins in those niches, incumbents
              and substitutes give buyers too many alternatives. If it can, its position is differentiated enough to
              resist direct price competition from machine vendors and enough to coexist with process alternatives that
              solve adjacent jobs better than the core Vulcan flow does.
