      - Dependency or gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence path
    rows:
      - - CEO / President transition
        - Operating model changed in 2024 during scale-up
        - medium
        - high
        - Named new leadership team
        - Review delegated decision rights, retention of key operators, and ramp metrics by function.
      - - HSSE leadership buildout
        - The need for a VP HSSE signals complexity that may still be maturing
        - medium
        - high
        - Dedicated senior role and explicit KPIs
        - Request organization chart, audit cadence, and open compliance hires.
      - - Workforce expansion
        - Planned jobs materially exceed current visible workforce
        - high
        - high
        - Massachusetts support and multi-site hiring plan
        - Review hiring pace, training throughput, attrition, and time-to-productivity by role.
      - - Founder / technical knowledge concentration
        - Public narrative still leans on founding technical leadership
        - medium
        - medium-high
        - Board/advisor continuity and broader executive bench
        - Map who owns process know-how, customer escalation, and technology roadmap decisions.
    notes: >-
