  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, and Price-sensitive Score
        blocks:
          - type: paragraph
            body: >-
              The valuation call on VulcanForms should start with a simple distinction: this may be a strong company,
              but that does not mean the current price is automatically investable. Public evidence supports the
              positive side of the case. Vulcan operates in an attractive part of industrial technology, has raised
              significant capital, appears to solve real customer problems, and is building a differentiated domestic
              manufacturing stack. Public evidence is much weaker where price is actually underwritten. The current
              record does not disclose current revenue, margins, backlog quality, top-customer concentration, or
              cap-table protections tightly enough to support a confident buy call. At roughly $1 billion private-market
              signals, the story already requires meaningful scale and economic proof. If the real price is above that
              level, the bar rises materially. The right published recommendation is therefore track / research-more,
              with medium confidence, high risk, and a stretched valuation stance until current economics are shown
              directly.
            claimRefs:
              - CV004
              - CV006
