  topStrengths:
    - Large and growing market exposure across aerospace, defense, medical, and other high-spec manufacturing verticals.
    - Integrated additive-plus-machining-plus-software stack creates a plausible moat beyond a single machine SKU.
    - Major financings and state-supported expansion show real investor and policy conviction behind the platform.
    - Public demand signals indicate the company has moved beyond pure R&D into meaningful industrial production.
  topRisks:
    - Current revenue, margin, backlog, utilization, and top-customer concentration are not publicly disclosed well enough to underwrite price.
    - The valuation signal relies on analyst and secondary sources because the exact 2026 post-money and cap-table terms are not public.
    - Factory-model capital intensity, site dependency, and qualification drag can compress returns even if the strategic thesis is right.
    - Regulatory, safety, and permit complexity remain material as the Massachusetts footprint expands.
    - Public custom-manufacturing and AM comparables show that scale does not automatically translate into clean profitability.
  unresolvedGaps:
    - Current revenue, gross margin, EBITDA, utilization, and backlog composition.
    - Top-customer share, contract duration, and repeat-production conversion by major program.
    - 2026 financing post-money, liquidation preferences, participation rights, and any secondary transactions.
    - Permit inventory, recent agency correspondence, and plant-level quality / yield KPIs.
    - Site-level economics for Devens, Newburyport, and planned expansion capacity.
