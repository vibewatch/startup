companyProfile:
  summary: >-
    VulcanForms is a Massachusetts-based advanced-manufacturing company founded in 2015 by Martin C. Feldmann
    and MIT professor John Hart. The company builds and operates an integrated digital metal-manufacturing platform
    that combines additive manufacturing, precision machining, automation, inspection, and software to produce
    high-spec parts for aerospace, defense, medical, semiconductor, and adjacent industrial customers. Public
    materials anchor operations to Devens and Newburyport, with additional Massachusetts expansion planned, while
    2022 and 2026 financings established VulcanForms as a heavily funded late-stage private manufacturing platform.
  foundedDate: '2015-01-01'
  founders:
    - name: Martin C. Feldmann
      role: Co-founder
      background: Original technical and company-building leader behind VulcanForms' metal-additive manufacturing platform.
      claimRefs: [CO001, CO020]
    - name: John Hart
      role: Co-founder
      background: MIT mechanical engineering professor and co-founder who remains publicly visible as a board member and technical voice.
      claimRefs: [CO001, CO023]
  foundingLocation: Massachusetts, USA
  headquarters: Devens / Newburyport, Massachusetts, USA
  productSummary: >-
    VulcanForms sells integrated digital metal manufacturing that spans proprietary LPBF systems, machining,
    inspection, automation, and software-driven process control rather than a single standalone printer SKU.
  customerFocus: >-
    Aerospace, defense, medical, semiconductor, and other high-spec industrial programs that need domestic,
    precise, and scalable production of difficult metal parts.
  businessModel: >-
    Manufacturing-as-a-service model built on owned production capacity, proprietary process technology,
    and vertically integrated finishing/inspection workflows; public sources do not disclose a recurring-software-only revenue layer.
  stage: Series D / late-stage private
  fundingStatus: >-
    Approximately $575-$576M raised publicly across the 2022 and 2026 financings, with current analyst and
    secondary valuation signals clustering around $1B while the exact 2026 post-money remains undisclosed in retained primary sources.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO006, CO018, CO019, CO033, CV004, CV006, CV009, CV012]
