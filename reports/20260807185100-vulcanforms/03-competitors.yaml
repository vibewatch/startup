- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Integrated production workflow
    - Rivals pair LPBF with software, monitoring, and qualification services
    - High
    - Vulcan is not alone in full-stack language, so proof must come from delivered output not messaging
    - Ask for repeat-production case studies where machining + additive integration changed the buying decision
  - - Domestic defense positioning
    - Nikon AM Synergy, Velo3D, and 3D Systems all market defense or domestic-supply credentials
    - High
    - Domestic manufacturing is no longer a unique narrative in metal AM
    - Request program-level evidence of qualified part families and procurement wins
  - - Complex geometry leadership
    - Velo3D and EOS explicitly market complex geometries and advanced thermal-management use cases
    - Medium-high
    - Part geometry advantage may narrow if buyers can source similar capability elsewhere
    - Compare design rules, yield, and post-processing burden on identical benchmark parts
  - - Customer avoidance of capex
    - Seurat and Velo already offer no- or low-capex adoption paths
    - Medium-high
    - Outcome-based rivals can neutralize one of Vulcan's main GTM advantages
    - Map where Vulcan wins because of integrated finishing or qualification, not only capex avoidance
  - - LPBF economics on small high-volume parts
    - Digital Metal binder jetting can win on throughput and small-part economics
    - Medium
    - Not every part family needs Vulcan's exact process
    - Identify which parts require LPBF material properties, density, or geometry to justify premium economics
  - - Scale and ecosystem maturity
    - EOS and 3D Systems have broader service and material ecosystems
    - Medium-high
    - Large incumbents can de-risk adoption for global OEMs
    - Test whether Vulcan's domestic integrated workflow beats ecosystem breadth in target accounts
  - - Competitor financial weakness helps Vulcan
    - Weak rivals can still threaten on technology while creating continuity concerns for buyers
    - Medium
    - 'Velo shows that fragility can cut both ways: easier to beat, but also dangerous if buyers hesitate to rely on startups'
    - Assess whether buyer preference is shifting toward stable public incumbents or toward specialized private partners
  - - Market fragmentation protects Vulcan
    - Fragmentation also enables buyer multi-homing and dual-sourcing
    - Medium
    - No single rival dominates, but that means switching barriers must be earned part family by part family
    - Measure actual share of wallet and sole-source status inside top customer programs
  notes: The core competitive question is not whether alternatives exist—they clearly do—but whether Vulcan wins on the specific combination of qualification, domesticity, integrated finishing, and outsourced production that target buyers care about most.
