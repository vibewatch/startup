    - Competes mainly on industrial machine ROI, not turnkey outsourced production
  - - 3D Systems
    - Capex + materials + services
    - DMP printers, metal materials, monitoring, inspection, application support
    - Opaque / quote-based
    - Specific DMP commercial terms not public
    - Broad portfolio supports land-and-expand but makes direct price comparison difficult
  - - Velo3D
    - Capex or production service
    - Systems plus Rapid Production Solutions and engineering support
    - Opaque / flexible
    - Split between equipment revenue and service revenue is evolving
    - Reduces buyer need to commit all capex upfront
