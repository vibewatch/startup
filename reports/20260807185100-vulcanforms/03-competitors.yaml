  rows:
  - - VulcanForms
    - Manufacturing-service / program engagement
    - Qualified finished parts and production workflow
    - Opaque
    - No public ASP, contract structure, or minimum-volume disclosure
    - Helps buyers avoid internal machine buildout when they need finished output
  - - EOS
    - Capex + service
    - Printers, materials, software, service, qualification support
    - Opaque / quote-based
    - System pricing, discounting, and service attach rate are not public
    - Favors buyers willing to build internal AM capability
  - - Nikon SLM / Nikon AM
    - Capex + engineering services
    - LPBF systems, DED adjacency, AM Synergy support and qualification work
