  evidenceGaps:
  - type: missing-source
    severity: material
    topic: portfolio-tam
    missingEvidence: A consistent third-party market model that maps Bending Spoons’s full portfolio into one portfolio-wide TAM/SAM stack.
    whyItMatters: Without a single market model, valuation must lean on a portfolio-of-markets frame rather than a clean top-down TAM narrative.
    diligencePath: Request management’s internal segmentation bridge from product revenue into market buckets and test it against outside category data.
    relatedQuestionRefs:
    - QM021
    - QM022
  - type: private-evidence-only
    severity: material
    topic: product-level-revenue-mix
    missingEvidence: Current product-level revenue mix across subscriptions, ads, ticketing, and enterprise contracts for the largest portfolio assets.
    whyItMatters: Market quality depends on which monetization pools actually dominate the portfolio, but public evidence only exposes fragments such as Eventbrite fees or app-estimate snapshots.
    diligencePath: Ask for 2025 and Q1 2026 revenue mix by major asset and by monetization type, plus cohort retention after price changes.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: retention-versus-price-hikes
    missingEvidence: Long-term churn, NPS, and cohort-retention evidence showing whether aggressive repricing improves durable LTV or merely front-loads cash collection.
    whyItMatters: The market can look attractive on short-term monetization benchmarks while still degrading brand equity and renewal quality.
    diligencePath: Compare pre- and post-acquisition retention, refund, and customer-support metrics for Evernote, Meetup, and WeTransfer.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: portfolio-som
    missingEvidence: A disclosed paying-user, seat, or ARR bridge that isolates Bending Spoons’s current serviceable obtainable market across its core products.
    whyItMatters: Without SOM evidence, investors can only infer capture from asset-level anecdotes and public-company summaries rather than from a market-share model.
    diligencePath: Request internal active paid accounts, seat counts, and net-dollar-retention by product family.
    relatedQuestionRefs:
    - QM022
    - QM023
