company:
  name: Bending Spoons
chapter:
  number: 2
  title: Market Analysis
  summary: 'Bending Spoons does not sit inside one neat software market: the public evidence points instead to a stack of monetization pools spanning non-game mobile apps, creator and enterprise-video tools, file-sharing and knowledge-work subscriptions, and event or community software. The most durable signals are not a single TAM number but a market structure that favors scaled operators with installed bases, pricing power, and conversion discipline, even as app-store fees, privacy rules, and user-trust backlash constrain adoption. That makes chapter-two diligence less about proving “a huge market” and more about showing which segments actually fund the roll-up and where platform or retention friction could cap the model.'
sections:
- id: market-boundary-and-sizing-logic
  title: Market Boundary and Sizing Logic
  body: |-
    Bending Spoons should not be analyzed as a single-purpose app publisher. Its owned products span note-taking and knowledge work, file transfer and creative collaboration, video hosting and enterprise communications, event ticketing and discovery, community management, and AI-enhanced media utilities. The relevant market boundary is therefore a monetization stack of mature software categories with overlapping traits: large installed user bases, low marginal distribution cost, high sensitivity to conversion design, and meaningful willingness to pay for convenience, workflow integration, or audience access. That boundary includes subscriptions, enterprise seats, ticketing and payment take rates, and in some cases ad-adjacent monetization. It excludes most hardware, agency services, and the broader consumer or creator economy spend that may surround these products but does not flow directly through Bending Spoons’s software surfaces.

    The best public sizing evidence is layered rather than singular. Sensor Tower’s 2026 release shows a very large global mobile app spend pool and confirms that non-game apps have now overtaken games for monetization, which matters because Bending Spoons’s biggest current assets sit on the non-game side of the market. RevenueCat’s benchmark adds a more useful operating lens: the market is getting larger, but revenue capture is concentrating among established, well-executed apps rather than diffusing evenly across new entrants. That pattern fits Bending Spoons’s portfolio strategy better than a generic “software TAM is huge” claim, because the company specializes in acquiring scaled or known brands and extracting more value from them.
