  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Mobile subscription utilities
    - Paid upgrades, subscriptions, bundles, and conversion-driven upsells in non-game mobile apps
    - Gaming spend, device sales, telecom plans
    - Individual consumers and household payers
    - Core monetization pool for Remini and app-heavy assets
  - - Knowledge-work and productivity software
    - Seats or subscriptions for note-taking, collaboration, search, tasks, and admin controls
    - Generic office hardware, consulting, implementation services
    - Individuals, team leads, workplace budgets
    - Explains Evernote-style value capture and switching-cost logic
  - - File sharing and creative delivery
    - Paid file-transfer plans, team accounts, enterprise security, branding, and workflow features
    - Agency retainers, creative labor, cloud infrastructure resale
    - Freelancers, agencies, creative teams, enterprise IT
    - Explains WeTransfer and similar collaboration budgets
  - - Enterprise video and creator media tools
    - Creator subscriptions, team plans, enterprise contracts, live-event features, analytics, and governance layers
    - Broadcast hardware, ad-only video inventory, generic CDN spend without workflow software
    - Creators, marketers, internal comms, training, customer-success teams
    - Captures Vimeo and the broader creator/video software stack
  - - Events and communities
    - Ticketing take rates, payment processing, event promotion, organizer tools, and community-management subscriptions
    - Venue rent, catering, travel, and offline event operations outside software
    - Organizers, venues, marketers, community operators
    - Captures Eventbrite and Meetup-style monetization
  - - Adjacent creator and adtech context
    - Budgets for creator content, streaming, brand partnerships, and measurable digital reach
    - Offline media, general retail spend, non-software consumer commerce
    - Marketing executives, brand teams, agencies
    - Important demand tailwind, but broader than direct Bending Spoons revenue capture
  notes: Rows separate direct monetization pools from the much broader consumer, creator, and media economies that only indirectly support Bending Spoons demand.
