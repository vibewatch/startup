  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: The lender list, covenant package, maturity ladder, interest-cost profile, and collateral terms for the 2025 multibillion-dollar debt package.
    whyItMatters: Leverage could materially change downside risk and acquisition flexibility, but public summaries only disclose the existence and rough size of the package.
    diligencePath: Review future F-1 amendments, debt exhibits, or lender presentations for plain-English term disclosure.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO003
  - type: stale
    severity: material
    topic: ipo-pricing
    missingEvidence: Final IPO share count, price range, valuation, float size, and proceeds split between the company and selling shareholders.
    whyItMatters: Without pricing details, the public-market valuation anchor and founder liquidity outcomes remain provisional.
    diligencePath: Monitor F-1/A amendments and the final prospectus immediately before pricing.
    relatedQuestionRefs:
    - QO023
  - type: missing-source
    severity: minor
    topic: acquisition-ledger
    missingEvidence: An official exhaustive public ledger of all acquisitions with close dates and integration status.
    whyItMatters: Public articles and marketing pages agree on major deals but not always on the full acquisition count or exact chronology of smaller assets.
    diligencePath: Request investor-relations materials or future annual reports that enumerate the full portfolio history.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: founder-liquidity
    missingEvidence: Exact founder and insider secondary-sale amounts in the 2025 financing and planned IPO.
    whyItMatters: Insider liquidity affects incentive alignment, governance interpretation, and the true split between growth capital and shareholder cash-out.
    diligencePath: Review later shareholder tables, lock-up disclosures, and any Italian registry updates tied to the IPO.
    relatedQuestionRefs:
    - QO025
  - type: missing-source
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A public, complete org chart or board roster tying every senior operator to role scope and decision rights.
    whyItMatters: The chapter can describe the disclosed founder-control and named executive bench, but public materials still do not expose a full leadership map across all product and corporate functions.
    diligencePath: Review later annual-report style disclosures, investor presentations, or company leadership pages that enumerate the full executive team and board committees.
    relatedTableRefs:
    - TO002
