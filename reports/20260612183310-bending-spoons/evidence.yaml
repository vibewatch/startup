    whyItMatters: >-
      Independent backlash signals exist, but without operator metrics it is impossible to judge whether monetization
      and restructuring are improving economics faster than they erode trust.
    diligencePath: Request monthly churn, review-trend, support-response, and feature-adoption dashboards by major product.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Brand-level GRR, NRR, churn, cancellation, refund, and contract-length data for Vimeo, Eventbrite, Evernote,
