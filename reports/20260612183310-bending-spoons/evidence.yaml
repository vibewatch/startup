    whyItMatters: >-
      The public evidence shows backlash and some revenue gains, but it does not show whether pricing changes create
      durable cash flow or delayed churn.
    diligencePath: >-
      Request subscription cohorts, gross and net retention, refund rates, support backlog, and rating trends before and
      after major pricing or free-tier changes.
    relatedQuestionRefs:
      - QR023
      - QR030
  - type: missing-source
    severity: minor
    topic: Platform fee mix by product
    missingEvidence: >-
      Current mix of revenue billed through Apple, Google, web, direct sales, payment processors, and ad intermediaries
