    diligencePath: >-
      Request channel-level revenue mix, take-rate assumptions, refund responsibility map, and direct-billing migration
      options by product.
    relatedQuestionRefs:
      - QR030
  - type: missing-source
    severity: blocking
    topic: ipo-proceeds-split
    missingEvidence: >-
      An amended F-1 or underwriting update that explicitly states the primary-versus-secondary share split and intended
      issuer proceeds.
    whyItMatters: If the IPO is largely secondary, the equity may not materially de-risk leverage even if the listing succeeds.
    diligencePath: Track the first F-1/A or public prospectus supplement and request the banker teaching deck before underwriting.
    relatedQuestionRefs:
      - QV027
  - type: private-evidence-only
    severity: material
    topic: 2025-round-terms
    missingEvidence: >-
      The 2025 financing term sheet, preference stack, lockups, and any registration rights attached to the late-stage
      holders.
    whyItMatters: >-
      These terms determine whether the public float carries hidden overhang or downside protection that common buyers
      lack.
    diligencePath: >-
      Request the cap table, preference waterfall, and major-investor side-letter summary from management or placement
      agents.
    relatedQuestionRefs:
      - QV028
  - type: private-evidence-only
    severity: material
    topic: segment-disclosure
    missingEvidence: Product-level revenue, gross margin, churn, and net retention by major asset or cohort.
    whyItMatters: >-
      Without segment disclosure, investors cannot tell whether the best assets are subsidizing weaker properties or
      whether repricing damage is localized.
    diligencePath: >-
      Ask for a product-level revenue bridge and cohort-retention pack covering Evernote, Vimeo, Eventbrite, WeTransfer,
      AOL, and Remini.
    relatedQuestionRefs:
      - QV029
  - type: missing-source
    severity: material
    topic: debt-maturity-ladder
    missingEvidence: >-
      A debt deck that reconciles term-loan maturities, hedging, pricing, covenants, and refinancing assumptions across
      the 2025 and January 2026 facilities.
    whyItMatters: >-
      Leverage is the biggest valuation discount, so missing maturity and pricing detail directly limits supportable
      entry price.
    diligencePath: Request the lender presentation, debt schedule, and treasury hedge summary used for board or IPO materials.
    relatedQuestionRefs:
      - QV030
