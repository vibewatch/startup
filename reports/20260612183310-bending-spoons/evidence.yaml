evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: >-
      The lender list, covenant package, maturity ladder, interest-cost profile, and collateral terms for the 2025
      multibillion-dollar debt package.
    whyItMatters: >-
      Leverage could materially change downside risk and acquisition flexibility, but public summaries only disclose the
      existence and rough size of the package.
    diligencePath: Review future F-1 amendments, debt exhibits, or lender presentations for plain-English term disclosure.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: ipo-pricing
    missingEvidence: >-
      Final IPO share count, price range, valuation, float size, and proceeds split between the company and selling
      shareholders.
    whyItMatters: Without pricing details, the public-market valuation anchor and founder liquidity outcomes remain provisional.
    diligencePath: Monitor F-1/A amendments and the final prospectus immediately before pricing.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: minor
    topic: acquisition-ledger
    missingEvidence: An official exhaustive public ledger of all acquisitions with close dates and integration status.
    whyItMatters: >-
      Public articles and marketing pages agree on major deals but not always on the full acquisition count or exact
      chronology of smaller assets.
    diligencePath: Request investor-relations materials or future annual reports that enumerate the full portfolio history.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: founder-liquidity
    missingEvidence: Exact founder and insider secondary-sale amounts in the 2025 financing and planned IPO.
    whyItMatters: >-
      Insider liquidity affects incentive alignment, governance interpretation, and the true split between growth
      capital and shareholder cash-out.
    diligencePath: Review later shareholder tables, lock-up disclosures, and any Italian registry updates tied to the IPO.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A public, complete org chart or board roster tying every senior operator to role scope and decision rights.
    whyItMatters: >-
      The chapter can describe the disclosed founder-control and named executive bench, but public materials still do
      not expose a full leadership map across all product and corporate functions.
    diligencePath: >-
      Review later annual-report style disclosures, investor presentations, or company leadership pages that enumerate
      the full executive team and board committees.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: portfolio-tam
    missingEvidence: >-
      A consistent third-party market model that maps Bending Spoons’s full portfolio into one portfolio-wide TAM/SAM
      stack.
    whyItMatters: >-
      Without a single market model, valuation must lean on a portfolio-of-markets frame rather than a clean top-down
      TAM narrative.
    diligencePath: >-
      Request management’s internal segmentation bridge from product revenue into market buckets and test it against
      outside category data.
    relatedQuestionRefs:
      - QM021
      - QM022
  - type: private-evidence-only
    severity: material
    topic: product-level-revenue-mix
    missingEvidence: >-
      Current product-level revenue mix across subscriptions, ads, ticketing, and enterprise contracts for the largest
      portfolio assets.
    whyItMatters: >-
      Market quality depends on which monetization pools actually dominate the portfolio, but public evidence only
      exposes fragments such as Eventbrite fees or app-estimate snapshots.
    diligencePath: >-
      Ask for 2025 and Q1 2026 revenue mix by major asset and by monetization type, plus cohort retention after price
      changes.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: material
    topic: retention-versus-price-hikes
    missingEvidence: >-
      Long-term churn, NPS, and cohort-retention evidence showing whether aggressive repricing improves durable LTV or
      merely front-loads cash collection.
    whyItMatters: >-
      The market can look attractive on short-term monetization benchmarks while still degrading brand equity and
      renewal quality.
    diligencePath: >-
      Compare pre- and post-acquisition retention, refund, and customer-support metrics for Evernote, Meetup, and
      WeTransfer.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: portfolio-som
    missingEvidence: >-
      A disclosed paying-user, seat, or ARR bridge that isolates Bending Spoons’s current serviceable obtainable market
      across its core products.
    whyItMatters: >-
      Without SOM evidence, investors can only infer capture from asset-level anecdotes and public-company summaries
      rather than from a market-share model.
    diligencePath: Request internal active paid accounts, seat counts, and net-dollar-retention by product family.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Post-acquisition churn, renewal, refund, and net-retention cohorts for Evernote, Meetup, WeTransfer, and Vimeo.
    whyItMatters: >-
      Without retention cohorts, public evidence can show near-term price power but cannot prove that competitive
      durability outweighs backlash over a full renewal cycle.
    diligencePath: >-
      Request monthly and annual churn, refund, NPS, and support-ticket trends by major product before and after
      repricing actions.
    relatedQuestionRefs:
      - QP022
  - type: missing-source
    severity: material
    topic: alternative-distribution-uptake
    missingEvidence: >-
      Actual adoption, economics, and user-conversion data for alternative app marketplaces or web distribution among
      large consumer app operators in the EU.
    whyItMatters: >-
      The DMA creates optionality on paper, but competitive power changes only if users and developers adopt those
      channels at meaningful scale.
    diligencePath: >-
      Ask management for region-level App Store versus alternative-channel tests, gross-to-net economics, and conversion
      funnels where EU experiments exist.
    relatedQuestionRefs:
      - QP020
  - type: missing-source
    severity: minor
    topic: realized-enterprise-pricing
    missingEvidence: >-
      Realized discounts, contract lengths, and support commitments for Vimeo enterprise, Circle Plus, Cvent, and large
      Eventbrite programs.
    whyItMatters: >-
      List prices show competitive posture, but underwriting durable pricing power requires understanding how far
      negotiated enterprise pricing departs from list.
    diligencePath: >-
      Collect redlined customer contracts, renewal quotes, and channel-discount ranges for the largest products and
      compare them with list pricing.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: product-level-segmentation
    missingEvidence: >-
      Product-level revenue, gross margin, and cash-flow disclosures for Evernote, Eventbrite, Vimeo, AOL, Remini, and
      WeTransfer.
    whyItMatters: >-
      Underwriting recurring-revenue quality is difficult when the filing reports portfolio-level metrics but not
      product-level contribution or concentration.
    diligencePath: >-
      Request internal segment reporting or board reporting that splits revenue, gross profit, and free cash flow by
      major acquired property.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: >-
      Exact maturities, spreads, security package, mandatory amortization, and refinancing triggers for the 2025 debt
      package.
    whyItMatters: >-
      Interest burden is already material, so missing maturity and pricing detail limits confidence on refinancing risk
      and covenant headroom.
    diligencePath: >-
      Review the full credit agreements and lender presentation behind the 2025 term-loan package, then reconcile them
      to the F-1 capitalization table.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ARPU, discounting, refund rates, and platform-fee net take by product and channel.
    whyItMatters: >-
      List pricing pages show monetization architecture but do not show realized net revenue or whether price hikes are
      durable.
    diligencePath: Ask for cohort-level billing data, plan migration statistics, and channel mix by acquired product.
    relatedQuestionRefs:
      - QI010
      - QI011
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales-cycle length, payback, and expansion by motion for enterprise, self-serve, and marketplace surfaces.
    whyItMatters: >-
      The filing shows strong revenue and retention, but not whether enterprise expansion and ticketing growth require
      materially different acquisition costs.
    diligencePath: Request funnel, cohort, and payback metrics by product family and by distribution motion.
    relatedQuestionRefs:
      - QI011
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: minor
    topic: 2025-round-sizing
    missingEvidence: >-
      A fully reconciled bridge between the announced $710 million raise, the €612 million adviser disclosure, and the
      SEC Form D amounts sold.
    whyItMatters: >-
      The broad financing picture is directionally clear, but the exact split among equity, secondary, and
      currency-denominated disclosures remains fuzzy.
    diligencePath: >-
      Reconcile the company cap-table update, adviser announcement, and Form D notices with management before relying on
