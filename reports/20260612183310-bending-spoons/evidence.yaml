    diligencePath: Request top-10 customer or account share, top-channel share, and revenue mix by product line.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: proof-quality-gaps
    missingEvidence: >-
      Current named production customer stories for Brightcove, WeTransfer, and business-oriented Remini deployments
