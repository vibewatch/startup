    diligencePath: >-
      Request debt agreements, maturity ladder, covenant model, hedging schedule, and management refinance plan by
      quarter.
    relatedQuestionRefs:
      - QR024
  - type: missing-source
    severity: material
    topic: Product-level churn after repricing
    missingEvidence: >-
      Cohort retention, refund rates, cancellation reasons, and review-volume trends for Evernote, WeTransfer, Meetup,
