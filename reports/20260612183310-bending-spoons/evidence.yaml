    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: shared-platform-inheritance
    missingEvidence: >-
      Engineer-level architecture documentation that maps Minerva, Juno, Xina, Galf, Matrix, and Pico to specific
      acquired products, cloud boundaries, and failure domains.
    whyItMatters: >-
      Without a real architecture map, outside diligence cannot verify whether portfolio leverage comes from deeply
      shared systems or from loosely coordinated product teams, which changes integration speed and blast-radius
      assumptions.
    diligencePath: >-
      Request an internal architecture review with service ownership, identity boundaries, cloud-account segmentation,
      and one representative post-acquisition migration dossier.
    relatedQuestionRefs:
      - QE021
      - QE025
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-roadmaps
    missingEvidence: >-
      Named 12-month roadmaps and migration milestones for Eventbrite, Vimeo, Brightcove, and StreamYard under Bending
      Spoons ownership.
    whyItMatters: >-
      Public pages show improvement counts and themes, but they do not reveal which features are being cut,
      consolidated, rebuilt, or merely marketed, which limits confidence in retention and execution risk.
    diligencePath: >-
      Request current roadmap decks plus shipped-versus-abandoned feature logs for the first two quarters after each
      acquisition.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
