- id: constraints-backlash-and-verdict
  title: Constraints, backlash, and verdict
  body: |-
    The main reason this chapter does not graduate to a fully de-risked product-tech verdict is that the public record is much better at showing visible outputs than hidden trade-offs. Evernote’s help center confirms that local notebooks are gone in the rebuilt app generation, which is a concrete reminder that the post-acquisition product story includes feature removals as well as AI additions. Independent coverage is even sharper: TechCrunch describes a repeatable pattern of product, monetization, and staffing changes after acquisitions, while Appfigures argues that pricing pressure and unhappy users are a recurring part of the playbook. Its review snapshots — extremely weak recent Evernote ratings and soft Meetup sentiment — are not dispositive on their own, but they are strong enough to treat backlash as a real product risk rather than a social-media anecdote.

    The balanced conclusion is that Bending Spoons appears strong at visible iteration, app-store execution, AI packaging, and API-rich workflow software. It also appears dependent on external platforms, public-cloud and partner ecosystems, and a central operating layer that is only partially disclosed. That means the product story is stronger than a pure cost-cutting caricature, but still incomplete for underwriting. The missing artifacts are not cosmetic: product-level roadmaps, inherited security architecture, churn by brand after major repricing, and clearer evidence on how shared proprietary systems actually map into acquired products.
