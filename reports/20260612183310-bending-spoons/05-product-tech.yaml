company:
  name: Bending Spoons
chapter:
  number: 5
  title: Product & Technology
  summary: 'Bending Spoons'' product record is broader and more technically substantive than a simple cost-cutting narrative suggests: public evidence shows active release cadence, visible API and integration surfaces, named shared operating technologies, and credible trust disclosures for several major brands. The same evidence also shows why underwriting should stay cautious: roadmap disclosure is uneven, some trust surfaces are thin, mobile-store and partner dependencies are material, and backlash from repricing or feature removals is a real product risk.'
sections:
- id: portfolio-map-and-user-jobs
  title: Portfolio map and user jobs
  body: |-
    Bending Spoons now presents itself less like a single-app developer and more like an operator of distinct but adjacent digital workflows. The public roster spans note-taking and personal knowledge management (Evernote), event discovery and ticketing (Eventbrite), community organizing (Meetup), live streaming and browser production (StreamYard), enterprise and creator video infrastructure (Vimeo and Brightcove), file transfer and review (WeTransfer), and AI image enhancement (Remini). That breadth matters because the product chapter is not evaluating one codebase or one SKU ladder; it is evaluating whether Bending Spoons can repeatedly improve acquired software that lives in different customer contexts and different distribution channels.

    The strongest public signal is that Bending Spoons is explicit about deep post-acquisition intervention. Its own site frames the model as long-term ownership plus deep transformations, while third-party reporting says those changes reach UX, underlying tech, monetization, and team structure. The same official page also names six proprietary technologies spanning LTV prediction, payment management, attribution, access control, UX propagation, and data ingestion. That does not prove a single unified stack across every brand, but it does show the company wants outsiders to believe there is reusable operating infrastructure behind the portfolio rather than a loose holding company with no shared product systems.
