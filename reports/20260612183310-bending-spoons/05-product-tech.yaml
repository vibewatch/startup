- id: TE001
  title: Product module / asset matrix
  columns:
  - Product / asset
  - Primary user
  - Workflow solved
  - Public maturity signal
  - Diligence gap
  rows:
  - - Evernote
    - Knowledge worker / team
    - Capture notes, tasks, documents, calendars, and search them across devices
    - v11 AI release plus 200+ improvements / 250+ features claimed since 2024
    - Need product-level retention, migration pain, and enterprise seat adoption after repricing
  - - Eventbrite
    - Attendee / organizer
    - Discover events, buy tickets, promote events, manage event data
    - Consumer apps are active and developer/app-marketplace surfaces are public; Bending Spoons still says initial improvements only
    - Need roadmap for organizer tooling, integrations, and post-takeover migration priorities
  - - Meetup
    - Organizer / member
    - Run groups, host local or online events, message members, discover communities
    - Redesigned apps and free organizer plan claimed; store apps still update frequently
    - Need clearer organizer economics and post-repricing churn by cohort
  - - StreamYard
    - Creator / broadcaster
    - Produce browser-based live streams and recordings
    - 50+ improvements plus AI editing and 4K local recording claimed on parent site
    - Readable public trust/compliance surface is weak under current ownership
  - - Vimeo / Brightcove
    - Enterprise video team / creator
    - Host, stream, secure, monetize, and analyze video across partner workflows
    - Public APIs, integration catalog, and security or status surfaces are visible
    - Need clarity on where Vimeo and Brightcove stacks converge or stay separate
  - - WeTransfer
    - Creative professional / team
    - Send large files, collect feedback, manage access, recover transfers
    - 2026 update feed and public status page show active shipping and ops visibility
    - Need SLA, enterprise-security, and post-free-plan-limit churn data
  - - Remini
    - Consumer creator
    - Restore, upscale, and generate AI-enhanced images from mobile
    - Storefronts show active release cadence and broad subscription monetization
    - Need model-cost economics, abuse controls, and retention by paid tier
  notes: Rows summarize externally visible product surfaces and maturity signals only. They do not prove shared code ownership or reveal internal migration status by acquired brand.
