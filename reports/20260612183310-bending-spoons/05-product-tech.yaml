- id: architecture-integration-and-developer-surface
  title: Architecture, integration, and developer surface
  body: |-
    The public architecture evidence is uneven but still informative. Evernote is the clearest example of a product with visible workflow, API, and security layers: the app ties notes, tasks, and calendars together; its integrations page links the product to Google Calendar, Outlook Calendar, and Slack; its developer documentation requires manual API-key approval and publishes SDK guidance across multiple platforms; and its security page says third-party clients authenticate with OAuth through a thrift API. Eventbrite, Vimeo, and Brightcove show a different flavor of architecture. Eventbrite exposes a developer platform and app marketplace around event workflows. Vimeo pairs an API surface with a large partner catalog that plugs into editing, CRM, accessibility, cloud storage, and monetization systems. Brightcove goes even deeper, publishing APIs for analytics, audience, ingest, playback, live, OAuth, and SSAI.

    Taken together, these sources imply that Bending Spoons is operating portfolio companies whose technical moats are not just front-end brands. They also rely on real integration ecosystems, external developer relationships, and third-party platforms. That creates leverage, but it also creates dependency. App stores, calendar suites, CRM partners, adtech or payments rails, cloud infrastructure, and security inheritance all sit underneath the user-facing brands. Public evidence supports a portfolio with meaningful API and integration depth; it does not yet provide a maintainer-grade diagram of how much of that depth is actually unified under Bending Spoons rather than still product-specific.
