  evidenceGaps:
  - type: missing-source
    severity: material
    topic: shared-platform-inheritance
    missingEvidence: Engineer-level architecture documentation that maps Minerva, Juno, Xina, Galf, Matrix, and Pico to specific acquired products, cloud boundaries, and failure domains.
    whyItMatters: Without a real architecture map, outside diligence cannot verify whether portfolio leverage comes from deeply shared systems or from loosely coordinated product teams, which changes integration speed and blast-radius assumptions.
    diligencePath: Request an internal architecture review with service ownership, identity boundaries, cloud-account segmentation, and one representative post-acquisition migration dossier.
    relatedQuestionRefs:
    - QE021
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-roadmaps
    missingEvidence: Named 12-month roadmaps and migration milestones for Eventbrite, Vimeo, Brightcove, and StreamYard under Bending Spoons ownership.
    whyItMatters: Public pages show improvement counts and themes, but they do not reveal which features are being cut, consolidated, rebuilt, or merely marketed, which limits confidence in retention and execution risk.
    diligencePath: Request current roadmap decks plus shipped-versus-abandoned feature logs for the first two quarters after each acquisition.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: access-blocked
    severity: minor
    topic: streamyard-trust-surface
    missingEvidence: Readable public security/compliance documentation for StreamYard mapped to current ownership and service-level commitments.
    whyItMatters: StreamYard is positioned as production infrastructure, so sparse public trust detail makes enterprise-readiness comparisons harder than for Evernote, Eventbrite, Vimeo, or Brightcove.
    diligencePath: Obtain authenticated support/security material or a current trust-center export from Bending Spoons for StreamYard.
    relatedQuestionRefs:
    - QE015
    - QE022
  - type: missing-source
    severity: material
    topic: product-backlash-metrics
    missingEvidence: Brand-level churn, support backlog, SLA, and recent review-trend data for Evernote, Meetup, WeTransfer, Vimeo, and Eventbrite.
    whyItMatters: Independent backlash signals exist, but without operator metrics it is impossible to judge whether monetization and restructuring are improving economics faster than they erode trust.
    diligencePath: Request monthly churn, review-trend, support-response, and feature-adoption dashboards by major product.
    relatedQuestionRefs:
    - QE023
