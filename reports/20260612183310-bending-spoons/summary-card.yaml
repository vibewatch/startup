summary:
  headline: >-
    Bending Spoons looks like a real software compounder with rare scale and recurring-revenue quality, but leverage,
    incomplete segment disclosure, and recurring user-trust backlash keep the right call at research-more until the IPO
    file is fuller and priced.
  overallScore: 6.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: fair
