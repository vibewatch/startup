- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Product
  - List price / fee
  - Contract model
  - Included capabilities
  - Unknowns / discount caveat
  - Implication
  rows:
  - - Evernote Advanced
    - $20.83 per month annual ($249.99 per year)
    - Self-serve annual plan
    - Unlimited notes, notebooks, attachments, and devices
    - Realized discounts and enterprise attach are undisclosed
    - Evernote now sits in a prosumer software band rather than a cheap utility band
  - - Evernote Enterprise Flexible
    - From €10 per seat per month
    - Self-serve enterprise starting point
    - Business data ownership, advanced admin, security/compliance, AI, collaboration
    - Unlimited plan pricing is custom and starts at 10+ users
    - Bending Spoons is explicitly pushing Evernote into structured seat-based enterprise packaging
  - - WeTransfer Ultimate / Teams
    - $25 per month individual; Teams priced per user with 2-user minimum
    - Self-serve plus team upsell
    - Unlimited transfers, branding, shared workspaces, centralized billing
    - Enterprise pricing and exact team seat pricing are custom
    - The file-transfer business is no longer purely freemium; Bending Spoons can ladder toward team budgets
  - - Dropbox Standard
    - $15 per user per month for 3+ users
    - Seat-based team SaaS
    - 5TB team storage, 100GB transfers, branding, password protection, admin control
    - Enterprise discounts and final contract pricing are not public
    - Dropbox narrows WeTransfer’s pricing room by bundling transfer with persistent storage and admin
  - - Vimeo Advanced
    - $75 per month for 10 users
    - Self-serve annual plan with enterprise custom tier
    - Hosted livestreams, Q&A, chat, analytics, and marketing integrations
    - Enterprise pricing is custom and bandwidth terms vary
    - Vimeo is priced closer to business video infrastructure than to consumer media hosting
  - - Eventbrite paid event fee
    - 3.7% + $1.79 service fee per ticket plus 2.9% processing per order
    - Usage-based marketplace take rate
    - Discovery, checkout, payouts, organizer tools, and marketing add-ons
    - Large-event negotiated programs are not public
    - Take-rate monetization differs structurally from SaaS seats and can be defended if discovery remains valuable
  - - Meetup Pro
    - $55 per group per month, or $47 on a six-month plan
    - Per-group subscription
    - Network analytics, targeted communications, and dedicated support
    - Regional pricing and special offers vary
    - Meetup monetizes organizer network ownership rather than ticket volume or seat count
  - - Circle Business
    - $199 per month
    - Monthly SaaS with custom Plus tier
    - Workflows, APIs, branded emails, transcriptions, and owned community controls
    - Custom Plus pricing and branded-app economics are undisclosed
    - Circle can undercut Meetup’s network story with higher-control owned-community software
  notes: List prices are public surface prices, not realized enterprise pricing. Unknowns are material because discounting and negotiated bandwidth or support terms likely drive large-account economics.
