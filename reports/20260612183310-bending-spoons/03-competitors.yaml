  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Post-acquisition churn, renewal, refund, and net-retention cohorts for Evernote, Meetup, WeTransfer, and Vimeo.
    whyItMatters: Without retention cohorts, public evidence can show near-term price power but cannot prove that competitive durability outweighs backlash over a full renewal cycle.
    diligencePath: Request monthly and annual churn, refund, NPS, and support-ticket trends by major product before and after repricing actions.
    relatedQuestionRefs:
    - QP022
  - type: missing-source
    severity: material
    topic: alternative-distribution-uptake
    missingEvidence: Actual adoption, economics, and user-conversion data for alternative app marketplaces or web distribution among large consumer app operators in the EU.
    whyItMatters: The DMA creates optionality on paper, but competitive power changes only if users and developers adopt those channels at meaningful scale.
    diligencePath: Ask management for region-level App Store versus alternative-channel tests, gross-to-net economics, and conversion funnels where EU experiments exist.
    relatedQuestionRefs:
    - QP020
  - type: missing-source
    severity: minor
    topic: realized-enterprise-pricing
    missingEvidence: Realized discounts, contract lengths, and support commitments for Vimeo enterprise, Circle Plus, Cvent, and large Eventbrite programs.
    whyItMatters: List prices show competitive posture, but underwriting durable pricing power requires understanding how far negotiated enterprise pricing departs from list.
    diligencePath: Collect redlined customer contracts, renewal quotes, and channel-discount ranges for the largest products and compare them with list pricing.
    relatedQuestionRefs:
    - QP023
