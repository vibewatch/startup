tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Bending Spoons
    - Direct subject / app conglomerate operator
    - 500M+ MAUs, 9M payers, $1.31B 2025 revenue, 50+ acquisitions
    - Under-monetized consumer, creator, and SMB software assets
    - Centralized subscription optimization and turnaround playbook across multiple mature brands
    - Evidence of user backlash and continuing platform dependence makes the model less durable than topline scale implies
  - - AppLovin
    - Direct public operator peer
    - Public software operator; $5.481B FY2025 revenue
    - Advertisers, app developers, streaming-TV partners
    - Adtech-led monetization stack with Axon, Adjust, and Wurl gives powerful performance-marketing engine
    - Much less overlap with collaboration, creator workflow, or ticketing jobs than Bending Spoons-owned assets face
  - - People Incorporated (formerly IAC)
    - Incumbent digital holding company
    - Public operator; People Inc FY2025 digital revenue $1.1B
    - Media, publishing, and strategic internet holdings
    - Long record of opportunistic ownership, capital allocation, and spin-off discipline
    - Broader holding-company model rather than subscription-first app turnarounds
  - - Ziff Davis
    - Acquisition-led internet / media operator
    - Public operator; $1.45B FY2025 revenue and $3B+ M&A deployed
    - Tech media, shopping, cybersecurity, connectivity, and martech users
    - Repeatable M&A program and diversified digital-brand base
    - More content, lead-gen, and services exposure than Bending Spoons’ app-heavy subscription model
  - - Microsoft 365
    - Bundled incumbent / status quo suite
    - Enterprise plans for organizations above 300 users
    - Knowledge work, collaboration, storage, communications, and IT-admin buyers
    - Email, Teams, security, AI, and file collaboration bundled into one procurement motion
    - Not every niche workflow is best-in-class, but bundling reduces willingness to pay for stand-alone tools
  - - Dropbox
    - Status-quo substitute in file sharing
    - Standard plan at $15 per user per month for 3+ users; enterprise upsell available
    - Teams that want transfer, storage, and admin in one contract
    - Combines transfer, storage, branding, password protection, and admin controls
    - Lacks Eventbrite-style discovery or Meetup-style network effects and is less creator-brand centric than WeTransfer
  - - Cvent
    - Enterprise event incumbent
    - Custom-quote enterprise sales model with modular event stack
    - Large event operators, sourcing teams, and enterprise event programs
    - High-touch workflow depth across sourcing, webinars, abstracts, and integrations
    - Weaker consumer-side discovery marketplace than Eventbrite
  - - Circle
    - Adjacent community substitute
    - Business at $199 per month; Plus custom pricing
    - Brands and creators building owned communities
    - APIs, branded apps, workflows, and owned-member experience
    - Does not provide Meetup’s open member network or event-discovery layer
  notes: Rows intentionally mix operator peers with workflow incumbents because Bending Spoons competes both for assets and for the underlying user jobs those assets serve.
