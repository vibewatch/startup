- id: switching-costs-distribution-power-and-moat-durability
  title: Switching Costs, Distribution Power, and Moat Durability
  body: 'The evidence suggests Bending Spoons’ moat is real but operational rather than absolute. Appfigures shows that the company can lift revenue at Evernote and WeTransfer without matching download growth, which implies some pricing power over sticky installed bases. In products with archives, workflows, branded event pages, or organizer histories, user inconvenience creates enough friction to support repricing. Eventbrite’s marketplace scale is another tangible moat element because discovery and conversion happen on the same surface.


    That moat is also conditional. The same Appfigures analysis highlights severe user backlash at Evernote and Meetup, implying that trust can decay faster than revenue at least in the short run. Meanwhile Apple’s 2026 EU DMA changes and the European Commission’s interoperability orders show that app distribution economics remain politically and technically unstable. Apple is opening alternative distribution paths, but the legal terms still demand substantial scale or a €1 million letter of credit, so platform dependence does not disappear for portfolio operators. In practice, Bending Spoons looks strongest when it buys a sticky workflow with weak ownership discipline and limited bundle competition; it looks weakest when a frustrated user can move to a broader suite, a cheaper point tool, or a status-quo internal workflow without much pain. Public filings and official pricing pages therefore support a narrower moat conclusion than the IPO growth story alone: the company has real pricing leverage, but it still has to earn retention product by product.'
