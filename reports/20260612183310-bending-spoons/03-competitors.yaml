- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Public evidence
  - Mitigation / diligence ask
  rows:
  - - Sticky archives and creator workflows support repricing
    - Users can still migrate to Notion, Dropbox, or broader suites if frustration outruns switching cost
    - High
    - Appfigures shows Evernote revenue rose even as downloads fell and reviews worsened
    - Request churn, export usage, refund rates, and renewal cohorts by product before underwriting durable price power
  - - Portfolio breadth and centralized monetization make Bending Spoons a differentiated operator
    - Other public operators can still bid for assets or copy portfolio optimization playbooks
    - Medium
    - AppLovin, IAC, and Ziff Davis all demonstrate scaled capital-allocation models
    - Review target pipeline win/loss data and acquisition sourcing advantages versus public peers and PE buyers
  - - Eventbrite’s marketplace creates distribution power
    - Large organizers can bypass discovery and buy high-touch enterprise tooling from Cvent or direct channels
    - Medium
    - Eventbrite advertises 89M monthly users and 270M tickets while Cvent sells deep enterprise modules
    - Segment organizer retention and contribution margin by discovery-dependent versus brand-led events
  - - Meetup’s network is hard to recreate quickly
    - Owned-community platforms can win when brands prefer white-label control and APIs
    - Medium
    - Circle sells branded apps, APIs, and SSO while Meetup Pro sells per-group access to its network
    - Measure Pro organizer churn and cross-posting to Circle, Discord, Slack, and owned channels
  - - App distribution liberalization could widen routing options
    - Apple still controls core platform rules, timelines, and legal economics
    - High
    - Apple and the European Commission both show distribution is opening but still tightly administered
    - Model gross-to-net economics by geography, channel, and app under App Store, web, and alternative marketplace paths
  - - Cost-cutting and repricing improve near-term cash generation
    - Trust erosion can invite substitution and future retention decay
    - High
    - Appfigures documents revenue lifts alongside steep user backlash and low review scores
    - Ask for NPS, support tickets, churn, and reactivation data before assuming current monetization is durable
  - - Standalone product focus can sharpen each asset’s P&L
    - Microsoft and Google can neutralize many jobs with broader bundles
    - High
    - Workspace and Microsoft 365 package storage, meetings, AI, and admin into default contracts
    - Track win rates where bundle incumbents are already present and test whether stand-alone tools still command new budget
  notes: Severity labels are analytical judgments based on retained evidence, not management-disclosed risk ratings.
