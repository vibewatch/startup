- id: FP003
  title: Moat / readiness KPIs
  type: kpi
  layout: compact
  summary: Compact scorecard of the public facts that best capture Bending Spoons’s current competitive durability and its biggest structural risks.
  data:
    items:
    - label: Portfolio MAUs
      value: 500M+
      unit: users
      note: TechCrunch reports more than 500 million monthly active users across owned apps.
    - label: Paying customers
      value: 9M
      unit: users
      note: Scale of recurring payer base supports pricing experiments across multiple products.
    - label: Subscription revenue mix
      value: 84
      unit: '%'
      note: TechCrunch says subscriptions are the majority of the business, reinforcing cash-flow discipline.
    - label: Evernote repricing effect
      value: 39
      unit: '% revenue uplift'
      note: Appfigures estimated revenue up 39% while downloads fell 64%, showing price power but also trust risk.
    - label: Eventbrite marketplace reach
      value: 89M / 270M
      unit: monthly users / tickets
      note: Owned discovery and transaction flow remain one of the clearest downstream moats in the portfolio.
    - label: EU alternative-market gate
      value: €1M or 1M+
      unit: letter of credit or annual installs
      note: Apple’s legal terms show alternative distribution is open, but only at meaningful scale and compliance cost.
  approximationNotes: This scorecard mixes directly reported public metrics with one legal threshold and one third-party monetization signal because competitive durability here depends on both scale and the practical costs of escaping platform dependence.
