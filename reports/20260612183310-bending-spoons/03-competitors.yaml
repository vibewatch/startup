- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Bending Spoons-owned surface
  - Strongest external alternative
  - What the alternative proves
  - Implication
  rows:
  - - Team knowledge base + admin controls
    - Evernote now sells Starter, Advanced, and enterprise plans
    - Notion, Microsoft 365, and Google Workspace
    - Incumbents bundle SSO, governance, email, meetings, AI, and storage around note-centric workflows
    - Evernote can charge more, but must beat suites that arrive inside larger workplace contracts
  - - Large-file delivery + team administration
    - WeTransfer adds Teams, Enterprise, SSO, and security logs
    - Dropbox
    - Dropbox couples high transfer limits with persistent team storage and admin control
    - WeTransfer keeps creative-brand simplicity, but Dropbox is the stronger status-quo procurement substitute
  - - Hosted video + webinars + enterprise governance
    - Vimeo advertises starter through enterprise ladders with events and SSO
    - Wistia
    - Wistia emphasizes marketing analytics, webinars, CTAs, and media performance workflows
    - Vimeo must win on breadth and governance, not only on video hosting basics
  - - Event discovery + checkout
    - Eventbrite ties discovery, ticketing, marketing, and payouts together
    - Cvent
    - Cvent shows how much workflow depth enterprise buyers can buy via custom quotes and modular products
    - Eventbrite’s discovery moat matters most below the high-touch enterprise tier
  - - Paid branded communities
    - Meetup Pro monetizes organizer networks per group
    - Circle
    - Circle sells owned community workflows, APIs, branded apps, and optional SSO
    - Meetup’s network can defend discovery, but Circle is stronger where brands want control and white-label ownership
  - - Default office suite / internal build
    - Multiple owned workflows can be approximated with email, storage, docs, meetings, and chat bundles
    - Microsoft 365 and Google Workspace
    - Both suites package collaboration, storage, AI, and admin under one master subscription
    - Bundle pressure is the most pervasive status-quo threat across the portfolio
  notes: This table compares jobs-to-be-done rather than literal one-to-one substitutes; many buyers can solve the same workflow through bundles or adjacent tools rather than category-pure products.
