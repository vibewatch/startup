      - number: '4.4'
        title: 承保缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              公开证据现在支持比一味乐观或全盘怀疑更细的判断。正面看，Bending Spoons
              已经证明，多产品组合仍可以以经常性收入为主、具备毛利润、留存有韧性，并能产生现金。Evernote、Eventbrite、Meetup Pro、StreamYard、Vimeo 和 Remini
              的官方定价页也显示，公司不是靠单一脆弱的应用机制变现；它运营的是更宽的组合，包括消费者订阅、企业席位、票务费用、支付和广告库存。这种多元化降低了单一变现渠道破坏整个论点的风险。


              承保阻碍同样具体。文件仍缺少产品层面收入结构、折扣后实际 ARPU、按获客路径拆分的 CAC 或回收期，以及债务到期细节。融资披露方向清楚，但公司、顾问和 SEC
              通知之间并未完全对齐。结果是一家公司收入质量看起来好于名声，但股权故事仍被杠杆不透明和分部披露不完整约束。现阶段，财务章节支持对收入质量和利润率路径给出有条件的正面判断；但在把公开文件本身视为足够承保证据之前，必须严格要求补齐债务条款和产品层面分部尽调。
