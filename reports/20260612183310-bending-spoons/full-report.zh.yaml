      - number: '5.4'
        title: 约束、反弹与结论
        blocks:
          - type: paragraph
            body: >-
              本章无法升级为完全去风险的产品技术结论，主要原因是公开记录更擅长展示可见产出，而不是隐藏取舍。Evernote 帮助中心确认，本地笔记本在重建后的应用世代中已经消失，这是一个具体提醒：收购后的产品故事既包括 AI
              增量，也包括功能移除。独立报道更尖锐：TechCrunch 描述了收购后反复出现的产品、变现和人员变化模式；Appfigures
              则认为，定价压力和不满用户是这套打法中的反复组成部分。它的评论快照——Evernote 近期评分极弱、Meetup 情绪偏软——本身并非决定性证据，但足以把反弹视为真实产品风险，而不是社交媒体轶事。


              平衡结论是，Bending Spoons 在可见迭代、应用商店执行、AI 包装和 API
              丰富的工作流软件上显得很强。它也依赖外部平台、公有云和合作伙伴生态，以及一个只披露了一部分的中央运营层。这意味着产品故事强于单纯削成本的漫画式描述，但用于承保仍不完整。缺失材料并不只是装饰：产品层面路线图、继承来的安全架构、重大重新定价后的分品牌流失，以及共享自有系统如何实际映射到收购产品上的更清晰证据。
