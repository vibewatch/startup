  - id: FI002
    title: 单位经济模型桥
    type: flow
    layout: wide
    summary: 留存和使用年限让收入基底更耐久，但利息费用仍是营业利润到股权价值之间的主要漏损。
    data:
      nodes:
        - id: installed
          label: 长生命周期存量用户
          detail: 按收入加权的订阅用户使用年限为 8.0 年。
          tone: positive
        - id: retention
          label: 高留存
          detail: 净收入留存率（NRR）在 2025 年为 95%，2026 年 Q1 为 94%。
          tone: positive
        - id: s_and_m
          label: 低 S&M 强度
          detail: 销售和营销约占收入的十分之一。
          tone: positive
        - id: gm
          label: 毛利率扩张
          detail: 估计毛利率提升至 60% 多的中高段。
          tone: positive
        - id: opm
          label: 营业利润率
          detail: 估计营业利润率在 2025 年和 2026 年 Q1 维持在约 20%。
          tone: neutral
        - id: interest
          label: 利息拖累
          detail: 利息费用吞掉 2025 年收入的 10.9%、2026 年 Q1 收入的 15.5%。
          tone: warning
        - id: equity
          label: 股权盈利能力
          detail: 净利润在 2026 年 Q1 恢复，但仍比营业利润更脆弱。
          tone: warning
      edges:
        - to: retention
          label: 耐久 cohort 支撑经常性计费
          from: installed
        - to: s_and_m
          label: cohort 留住后，替换性支出减少
          from: retention
        - to: gm
          label: 成本结构支撑毛利润留存
          from: s_and_m
        - to: opm
          label: 经营杠杆来自毛利润
          from: gm
        - to: interest
          label: 杠杆位于经营层之下
          from: opm
        - to: equity
          label: 债务服务塑造净利润质量
          from: interest
    approximationNotes: 费用率和利润率节点依赖基于 F-1 的公开计算，应作为方向性框架看待，而不是管理层定义的 KPI。
