      - number: '4.3'
        title: 现金、杠杆与资本充足性
        blocks:
          - type: paragraph
            body: >-
              最大的财务张力不是 Bending Spoons 能否从经营中产生现金；它可以。经营净现金流在 2025 年升至 $291M，并在 2026 年 Q1 保持 $76M 的正值。问题在于规模错配。2025
              年投资净流出为 $1.852B，2026 年 Q1 为 $1.648B，远高于内部现金生成，使收购引擎依赖债务、股权或两者并用。因此，同一份证明经营强度的文件，也证明了融资依赖。


              资产负债表把这种取舍说得很清楚。截至 2026 年 3 月 31 日，Bending Spoons 报告现金 $740.8M，含一年内到期部分的债务 $4.356B，负债 $5.920B，权益仅
              $1.063B。管理层认为杠杆仍审慎，因为债务契约上限是 4.00x，报告杠杆在 2025 年末为 2.24x、2026 年 Q1 为
              2.19x；但公开市场投资者仍缺少详细的到期、定价和抵押图景，无法检验再融资风险。当前最稳妥的结论是，基础组合能产生现金，但复利战略仍然资本密集且对资产负债表敏感，尤其是在收购机会早于债务市场或 IPO
              募资能以有吸引力条款明确到位之前。
