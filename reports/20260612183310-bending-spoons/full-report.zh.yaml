  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Bending Spoons 旗下触点
      - 最强外部替代方案
      - 替代方案证明了什么
      - 含义
    rows:
      - - 团队知识库 + 管理员控制
        - Evernote 现在销售 Starter、Advanced 和企业套餐
        - Notion、Microsoft 365 和 Google Workspace
        - 既有厂商围绕以笔记为中心的工作流捆绑 SSO、治理、邮件、会议、AI 和存储
        - Evernote 可以提价，但必须打赢那些嵌入更大职场合同的套件
      - - 大文件交付 + 团队管理
        - WeTransfer 增加 Teams、Enterprise、SSO 和安全日志
        - Dropbox
        - Dropbox 把高传输上限与持久团队存储和管理员控制绑在一起
        - WeTransfer 保留创意品牌的简洁性，但 Dropbox 是更强的现状采购替代品
      - - 托管视频 + 网络研讨会 + 企业治理
        - Vimeo 宣传从入门到企业的套餐阶梯，并包含活动和 SSO
        - Wistia
        - Wistia 强调营销分析、网络研讨会、行动号召和媒体表现工作流
        - Vimeo 必须靠广度和治理取胜，不能只靠视频托管基础功能
      - - 活动发现 + 结账
        - Eventbrite 把发现、票务、营销和付款绑在一起
        - Cvent
        - Cvent 显示企业买方可以通过定制报价和模块化产品买到多深的工作流
        - Eventbrite 的发现护城河在高接触企业层以下最重要
      - - 付费品牌社区
        - Meetup Pro 按小组变现主办方网络
        - Circle
        - Circle 销售自有社区工作流、APIs、品牌应用和可选 SSO
        - Meetup 的网络可以守住发现，但在品牌想要控制权和白标所有权时，Circle 更强
      - - 默认办公套件 / 内部自建
        - 多个旗下工作流可用邮件、存储、文档、会议和聊天套件近似实现
        - Microsoft 365 和 Google Workspace
        - 两个套件都把协作、存储、AI 和管理打包到一份主订阅里
        - 捆绑压力是投资组合中最普遍的现状威胁
    notes: 本表比较的是待完成任务，而非字面对字面的一对一替代品；许多买方可以通过套件或相邻工具解决同一工作流，而不必购买纯品类产品。
