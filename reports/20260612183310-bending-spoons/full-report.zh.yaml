  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开证据指向一套分层产品组合架构：共享的 Bending Spoons 系统位于底层，上方是各产品自己的工作流、API，以及 app store 或网页分发。
    data:
      layers:
        - label: 共享 Bending Spoons 系统
          detail: 母公司称会在产品组合中复用的具名专有技术
          items:
            - Minerva（LTV 预测）
            - Juno（多渠道支付管理）
            - Xina（营销归因）
            - Galf（安全访问控制）
            - Matrix（已验证 UX 模式）
            - Pico（高吞吐数据摄取）
        - label: 产品工作流层
          detail: 品牌化界面，解决不同客户任务
          items:
            - Evernote 知识工作区
            - Eventbrite 票务与发现
            - Meetup 组织者 / 成员网络
            - Remini AI 照片增强
            - Vimeo / Brightcove 视频基础设施
            - WeTransfer 文件交接
        - label: API / 集成层
          detail: 外部可见的公开扩展界面
          items:
            - Evernote OAuth + SDKs
            - Eventbrite 开发者平台 + 市场
            - Vimeo 开发者 API + 集成
            - Brightcove 分析 / 直播 / 播放 API
        - label: 分发 / 商业层
          detail: 控制更新、身份和计费的渠道
          items:
            - Apple App Store
            - Google Play
            - Web app 交付
            - 订阅 / 票务 / OTT 变现
        - label: 信任 / 运营层
          detail: 塑造企业就绪度的控制和状态界面
          items:
            - Evernote GCP + Terraform + ISO 27001
            - Eventbrite PCI / ISO / EC2
            - WeTransfer 公开状态 + 反恶意软件
            - Brightcove 事故透明度
            - Vimeo 企业安全定位
    approximationNotes: 这套堆栈是示意性的，范围限于外部可见层。它并不能证明所有被收购产品共享同一个内部运行时或云边界。
    claimRefs:
