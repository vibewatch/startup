      - number: '1.4'
        title: 里程碑、转型打法与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑模式正是 Bending Spoons 的战略独特性所在。公司反复用新资本和集中运营工具买下知名品牌，吸收到米兰主导的平台中，再加速变现、技术现代化，或两者并行。官方公司材料现在把
              Remini、Evernote、WeTransfer、Vimeo 和 Eventbrite 作为旗舰案例，F-1 还补充称公司看到超过 1,000 个后续收购候选。这种广度是战略资产，因为它能让产品间的经验
              复利；但它也抬高了整合门槛：公司必须持续证明，随着品牌集合扩大，它仍能提升质量、增长和利润率，同时不破坏当初买下这些品牌所依赖的用户信任。


              负面记录说明了为什么这个限定条件重要。TechCrunch 报道称，Bending Spoons 在 2024 年 7 月收购 WeTransfer 后计划裁掉其 75% 员工，后来又把类似重组模式与
              Evernote、WeTransfer 和 Vimeo 联系起来。关于 Immuni 的独立学术研究也给出反例：这款由 Bending Spoons 在 2020 年开发的意大利 COVID-19 追踪应用，到
              2021 年识别出的病例不到意大利报告 COVID-19 病例的 1%，在全国人群中的采用率也很低。这些信号并不抹掉公司的执行记录，但显示出一个一致模式：Bending Spoons
              能快速行动并改善经济性；同时，速度、集中化和激进转型也可能带来声誉、产品信任和人员风险外部性，投资者应密切跟踪。
