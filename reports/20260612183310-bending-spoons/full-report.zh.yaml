companyProfile:
  summary: >-
    Bending Spoons 是一家总部位于米兰的软件运营商，2013 年创立于哥本哈根，目前持有覆盖
    Evernote、Vimeo、WeTransfer、Eventbrite、Meetup、StreamYard、Brightcove、Remini
    及其他数字产品的组合。它的模式不是围绕单一旗舰产品搭建公司，而是收购已有基础的软件资产，集中推进运营和技术改造，并在长期持有中复利式提升变现能力。2026 年 6 月的 F-1 显示，这套模式已经跑到少见规模：2025 年收入
    $1.306B、月活跃用户超过 5 亿、付费客户超过 900 万、收入以订阅为主且经营现金流为正。但同一份文件也留下了关键尽调缺口：杠杆、分部经济性，以及收购后变现打法到底能持续多久。
