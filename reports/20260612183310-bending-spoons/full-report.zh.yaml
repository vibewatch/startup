          detail: 控制分发、隐私标签、OS 兼容性和订阅 UX
          type: dependency
        - id: partners
          label: 合作伙伴集成与 API
          detail: 日历、Slack、Adobe、HubSpot、Dropbox、AppsFlyer、市场和外部客户端
          type: dependency
        - id: cloud
          label: 云 / 合规控制层
          detail: GCP、Amazon EC2、ISO / PCI 项目、状态运营和事故流程
          type: dependency
        - id: dev
          label: 公开 SDK / GitHub 生态
          detail: API 和集成面向外部开发者的触点及维护信号
          type: dependency
        - id: shared
          label: Bending Spoons 专有系统
          detail: Minerva、Juno、Xina、Galf、Matrix 和 Pico 构成具名跨产品运营层
          type: system
        - id: products
          label: 品牌产品界面
          detail: 组合品牌：Evernote、Eventbrite、Meetup、Remini、WeTransfer、Vimeo、Brightcove、StreamYard
          type: system
        - id: users
          label: 用户 / 组织者 / 创作者 / 企业
          detail: 终端客户会直接感受到分发、可靠性和定价变化的影响
          type: output
      edges:
        - from: stores
          to: products
        - from: partners
          to: products
        - from: cloud
          to: shared
        - from: dev
          to: products
        - from: shared
          to: products
        - from: products
          to: users
        - from: stores
