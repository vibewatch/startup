  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 重要性
      - 证据
      - 压力点
      - 什么会改变判断
    rows:
      - - 经常性收入质量真实存在
        - 以订阅为主的组合，相比一次性并购整合，能支撑更高倍数
        - 2026 年 Q1 收入的 84%、2025 年收入的 93% 来自订阅
        - 组合层面披露可能掩盖弱势资产
        - 按主要品牌拆分的产品级留存和利润率数据
      - - 存量客户韧性异常强
        - 长年限队列降低替换支出，也支撑重新定价
        - Q1 订阅收入的 48% 来自合作 5+ 年的客户
        - 韧性可能来自老用户；重新定价冲击后，这批用户后来仍会流失
        - 重新定价前后的队列留存和降级数据
      - - 收购价差可以创造价值
        - 低价买入资产并改造，可以证明组合溢价合理
        - Eventbrite、Vimeo 和 Brightcove 的收购价远低于高端 SaaS 估值
        - 如果整合成本或流失吞掉重新定价收益，价差捕获可能失效
        - 每项资产交割后的队列、利润率和协同证据
      - - 杠杆仍是主要折价来源
        - 债务可能吃掉原本有吸引力的软件利润率
        - 公司在 2025 年和 2026 年 Q1 叠加定期贷款，为大型交易融资
        - 仅满足契约要求，并不保证再融资轻松
        - 一套已对齐的债务材料，列明到期、利率和对冲
      - - IPO 结构可能无法降低资产负债表风险
        - 以老股出售为主的发行，对卖方的好处大于对新公众投资者
        - IPOGrid 目前仅显示售股股东，没有发行人募资
        - 后续修订可能改变这一点
        - 后续 F-1/A 或招股书显示有意义的新股发行
      - - 尚未配得上高端 SaaS 估值上限
        - AppLovin 式倍数需要更清晰的披露和更简单的经济模型
        - 公开可比公司约为 1x 至 30x 收入；Bending Spoons 缺少 AppLovin 级透明度
        - 如果订单簿强劲，市场仍可能为增长动能买单
        - 路演中证明去杠杆和分部清晰度的证据
    notes: 这些论点刻意与可能证伪它们的条件配对。这样估值判断就对证据保持敏感，而不是由叙事驱动。
