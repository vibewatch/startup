  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons 作为一门生意看起来可以投资，但并不意味着任何价格都可投。2026 年 6 月的 F-1 用真实规模和质量信号替代了轶事：2025 年收入增至 $1.31 billion，Q1
              2026 收入达到 $601 million，订阅仍占销售的 84%，装机用户底座已经覆盖超过 500 million 月活用户和 9 million
              付费客户。这些事实重要，因为它们显示公司不只是把资产滚在一起的财务壳，而是在一个庞大、粘性强的组合上变现，并具备真实运营杠杆。问题在于入场纪律。2025 年末那轮约 $11.0 billion 至 $11.7
              billion 的融资，已经把高质量、能产现金的软件运营商预期计入价格；但如果增长和去杠杆继续推进，仍留有价值创造空间。传闻中的约 $20 billion IPO
              视角则不同。在这个水平上，公司开始按优质软件复利机器定价，但公开市场投资者仍缺少产品级组合、债务到期透明度，以及 IPO
              会实质性去杠杆的确定性。这个组合支持对价格敏感的跟踪或继续研究姿态，而不是盲目的质量优先买入结论。
