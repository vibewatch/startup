          detail: 竞争审查、DSA、隐私和消费者保护监督
          type: dependency
        - id: payment
          label: 支付与卡组织通道
          detail: 应用内购买、活动票务处理和周期性计费
          type: dependency
        - id: legal
          label: 产品法律承诺
          detail: 条款、隐私、仲裁、许可和披露义务
          type: dependency
        - id: portfolio
          label: 组合产品
          detail: Evernote、Eventbrite、Meetup、Vimeo、WeTransfer、Brightcove 等
          type: system
        - id: integration
          label: Bending Spoons 运营层
          detail: 收购尽调、迁移、支持、商业化和合规运营
          type: system
        - id: users
          label: 用户与主办方
          detail: 订阅者、参会者、创作者、企业和社区
          type: output
        - id: cash
          label: 现金生成
          detail: 收入留存、广告收益和扣费后利润率
          type: output
      edges:
