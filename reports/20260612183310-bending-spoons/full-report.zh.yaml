        blocks:
          - type: paragraph
            body: >-
              给估值搭框架，最干净的方法是在私募标记、公开可比公司和 Bending Spoons 自身交易行为之间三角验证。私募侧，2025 年 10 月融资给出约 $11 billion
              的有文件支撑底线，市场数据源则把标记推近 $11.7 billion。公开市场侧，可比公司组很宽，并不整齐：AppLovin 的倍数高得多，因为它同时具备规模、增长和更轻的资产负债表叙事；Braze 和
              DoubleVerify 位于低到中个位数收入倍数的中间区间；Ziff Davis 和 IAC 则说明，收购驱动或控股公司式软件资产在增长和简单性较弱时，可能只能以低个位数倍数出清。Bending Spoons
              自己收购成熟互联网和软件资产的价格，远低于 $20 billion IPO 传闻所隐含的倍数。Eventbrite 约 $500 million 出售，Vimeo 约 $1.38
              billion，Brightcove 约 $233 million。这些交易并不能证明 Bending Spoons
              只配困境资产倍数，因为该平台或许能靠整合和重新定价创造利差。但它们确实让投资者更难在没有更强披露包和更清晰去杠杆路径的情况下，承销一个高端 SaaS 式倍数。
