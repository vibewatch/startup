  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 为什么会打破投资逻辑
      - 对价值的传导
      - 行动含义
    rows:
      - - IPO 仍以老股出售为主
        - 发行人获得很少或没有新股资本
        - 公众买方得不到他们可能假设的去杠杆
        - 股权价值相比亮眼增长故事暗示的程度，更暴露于债务和再融资风险
        - 降价重估，或回避交易
      - - 债务材料显示条款比暗示更严苛
        - 到期结构、定价或对冲让股权缓冲更薄
        - 杠杆折价应扩大，而不是收窄
        - 更高利息或再融资风险压缩可支撑倍数
        - 下调价值区间，并提高要求回报
      - - 产品级队列数据令人失望
        - 主要资产在重新定价或整合后显示留存疲弱
        - 组合质量弱于汇总收入线所暗示的水平
        - 基准情景倍数向运营商可比公司下移
        - 除非价格重置，否则从观察转为回避
      - - 监管或平台摩擦上升
        - 计费、应用商店、隐私或退款规则冲击变现
        - 重新定价和转化引擎变得不那么可靠
        - 利润率和现金转化假设同时走弱
        - 视为情景下调至悲观
      - - 路演价格区间接近传闻上限，却没有补足披露
        - 营销要求投资者在证据不完整时支付高端软件价格
        - 入场安全边际消失
        - 即便执行良好，也可能只能证明公允价值，而不是上行空间
        - 放弃，或等待二级市场重置
    notes: 这些触发因素旨在后续修订、贷款方材料和 IPO 后披露中可监测。每一项都会直接改变可支撑入场价，而不只是改变情绪。
    claimRefs:
      - CV007
      - CV034
      - CV035
      - CV039
      - CV040
      - CV043
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
      - 是否阻塞？
    rows:
      - - IPO 募资拆分
        - 新股与老股分配，以及发行人募资用途
        - 决定上市是否真正修复资产负债表，还是主要为现有持有人提供流动性
        - 阅读首版 F-1/A，并索取承销材料
        - 是
      - - 股权结构表和优先股堆叠
        - 2025 年轮次条款、清算优先权、注册权和锁定期
        - 决定普通股真实下行空间，以及是否存在近期抛压
        - 向律师或牵头银行索取股权结构分配瀑布表
        - 是
      - - 产品级分部包
        - 按主要产品拆分的收入、毛利率、留存、流失和现金贡献
        - 区分最强资产和较弱资产，并检验重新定价是否持久
        - 要求管理层按资产和队列提供桥接表
        - 是
      - - 债务和对冲时间表
        - 按融资工具拆分的到期、契约、定价、摊销和对冲覆盖
        - 杠杆是主要估值折价，必须精确建模
        - 索取贷款方材料和资金管理摘要
        - 是
      - - 扩展可比公司集
        - 付费投行或私募市场关于软件并购整合平台和近期私有化交易的可比公司表
        - 围绕最终发行价区间强化价格纪律
        - IC 签署前，用机构数据集补充公开可比公司
        - 否
    notes: 这些是从观察判断推进到可承销定价决策时，价值最高的未解请求。前四项确实会阻塞买入建议。
    claimRefs:
      - CV034
      - CV039
      - CV040
      - CV044
      - CV045
