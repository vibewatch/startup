          detail: 2026 年 Q1 收入的 12% 来自广告。
          tone: neutral
        - id: other
          label: 其他收入
          detail: 剩余来源占 2026 年 Q1 收入的 4%。
          tone: neutral
        - id: gross
          label: 毛利润
          detail: 毛利润在 2025 年达到 $857M，2026 年 Q1 达到 $408M。
          tone: positive
        - id: op
          label: 营业利润
          detail: 营业利润在 2025 年达到 $278M，2026 年 Q1 达到 $120M。
