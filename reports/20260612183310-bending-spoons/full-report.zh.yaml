  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量与结构
        blocks:
          - type: paragraph
            body: >-
              这份文件实质性提升了 Bending Spoons 财务证据的质量，因为它用接近审计口径的收入、结构和留存披露，替代了风投式轶事。核心看点不只是规模，而是规模的质量：收入从 2023 年的 $387M 增至
              2025 年的 $1.306B，同时订阅仍占 2025 年收入的 93%、2026 年 Q1 收入的 84%。广告有贡献，但文件清楚表明，公司仍主要是一台订阅机器，其他来源仅占 2026 年 Q1 收入的
              4%。这很重要，因为它意味着投资论点更多取决于经常性计费的耐久性，而不是一次性应用销售或波动较大的广告变现。


              留存数据比市场上「连续收购者」的简称更能支撑这一判断。净收入留存率（NRR）在 2025 年达到 95%，2026 年 Q1 为 94%；2026 年 Q1 订阅收入中有 48% 来自已经付费至少 5
              年的客户。加权平均订阅者任期为 8.0 年，这对一个通过 M&A 搭建的组合来说异常强。反面是披露颗粒度：Bending Spoons
              仍按组合层面报告经济性，而不是按收购资产报告。投资者现在能看到，收入质量好于典型滚动收购刻板印象；但仍看不到哪些产品支撑结构、集中度有多高，以及由价格驱动的增长能否在组合内均匀持续。
