      - number: '3.2'
        title: 工作流既有玩家、替代品与定价压力
        blocks:
          - type: paragraph
            body: >-
              下游竞争图景分散，但脉络清楚。Evernote 面对 Notion 等现代知识工作套件，也面对 Microsoft 365 和 Google Workspace 这类捆绑式既有玩家。WeTransfer
              的竞争对手不只是小众传文件服务，也包括 Dropbox 式存储和管理套件。Vimeo 位于创作者视频、网络研讨会和企业通信预算之间，Wistia
              及相邻既有套件可以用更低价格或更专门化能力进攻。Eventbrite 必须同时在票务经济性和发现上防守 Cvent 等企业活动栈；Meetup Pro 现在也面对 Circle
              等品牌化社区平台，后者销售的是所有权、API 和更高接触度的工作流自动化，而不是 Meetup 会员网络的访问权。


              重要的尽调点在于，Bending Spoons 持有的资产越来越多，其标价和功能阶梯与高 ACV 软件重叠，而不是低摩擦工具。Evernote 现在同时销售自助式和企业计划，WeTransfer 明确提供
              Teams 和 Enterprise，Vimeo 的企业包增加了 SSO 和 SCIM，Eventbrite 通过抽成加付费营销插件变现。如果 Bending Spoons
              能在整个组合中专业化包装，这会抬高上行空间；但它也增加了对既有玩家的直接暴露，这些对手拥有更宽的捆绑、更长的采购历史和更强的默认分发渠道。
