  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与付款方地图
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons 没有单一客户基础。保留的 2026 年公开证据显示，它的组合混合了消费者订阅、市场买卖双方、社区管理员、创作者工具和企业软件买方。Vimeo
              是披露最清晰的分层案例：公司明确称其服务个人客户、企业公司和 OTT 卖方，并为每个群体给出单独路线图。Evernote
              同样把免费和自助付费用户，与带有安全、管理和客户成功层的定制企业层区分开。Eventbrite 的结构分裂更明显：组织者发布和营销活动，参与者发现并购买，默认费用付款方是购票者而不是组织者。Meetup
              也有类似双边结构，组织者付费运营小组，会员也可以在消费者应用内购买自己的订阅。StreamYard 和 Remini
              更偏自助式，但即便如此，公开界面也指向个人创作者与企业或组织买方之间的差异。这种多样性有利于组合广度，但也意味着不能只从一个品牌来承保客户质量。
