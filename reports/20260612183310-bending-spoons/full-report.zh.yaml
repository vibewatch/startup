  - id: TI001
    title: 收入来源表
    columns:
      - 收入来源
      - 机制
      - 当前价值 / 状态
      - 质量判断
      - 尽调要求
    rows:
      - - 组合订阅
        - 跨产品的经常性应用和软件订阅
        - 2026 年 Q1 收入的 84%；2025 年收入的 93%
        - 高质量经常性核心，但产品组合仍未披露
        - 要求按主要产品和计费渠道拆分收入与毛利率
      - - 广告
        - 主要是 AOL 及相关库存等广告支持界面
        - 2026 年 Q1 收入的 12%
        - 有助于多元化，但结构上不如订阅可预测
        - 要求按资产、广告主集中度和季节性拆分广告收入
      - - 其他收入
        - 非订阅、非广告来源的剩余收入
        - 2026 年 Q1 收入的 4%
        - 当前规模小，且聚合过度，难以作为稳定类别承销
        - 拆出交易、服务和其他一次性组成部分
      - - 活动票务与支付
        - Eventbrite 的付费票服务费加支付处理费
        - 每张票 3.7% + $1.79，另每笔订单 2.9%；Eventbrite Pro 起价 $15/month
        - 抽佣率和软件收入结合，拓宽组合变现
        - 要求提供净抽佣率、打款浮存经济性，以及免费活动与付费活动的组合
      - - 企业席位与合同
        - Evernote、Vimeo 和 Brightcove 类产品的按席位或定制合同
        - Evernote Enterprise Flexible 起价 €10/seat/month；Vimeo 和 Brightcove 企业定价多数为定制
        - 支撑 ACV 上行，但实际定价和客户标识数量缺失
        - 要求按企业界面提供席位数、合同期限和总留存
      - - 应用商店订阅
        - Remini 和 StreamYard 等自助式消费者订阅
        - Remini 周订阅 $9.99、月订阅 $9.99；StreamYard 免费，Core $35/mo，Advanced $68/mo
        - 变现路径快，但容易受商店费用和重定价反弹影响
        - 要求提供渠道组合、退款率和扣除平台费后的净收入
    notes: 各行混合了监管文件层面的组合收入桶和产品级公开标价证据。实际成交定价、折扣和单产品贡献仍未披露。
