      - number: '1.3'
        title: 资本形成、估值路径与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons 生命早期的大部分时间看起来都比最终规模更接近自举增长，但现在公开融资记录已丰富得多。Sifted 报道称，公司第一笔外部股权融资发生在 2022 年 9 月；后续来源和 F-1
              时期报道则勾勒出快速重定价路径：2024 年 2 月以 $2.55B 估值融资 $155M，随后在 2025 年 10 月以 $11B 投前估值融资 $710M。Sacra 和 CB Insights 都将
              2025 年末估值区间放在约 $11.0B 至 $11.71B，Business Wire 确认投资者名单包括 T. Rowe Price、Baillie Gifford、Cox
              Enterprises、Durable Capital Partners、Fidelity 等。


              2026 年 6 月的 IPO 文件再次提升了证据质量，把讨论从私募市场估值转向已披露的经营表现。Fortune 对文件的摘要称，2025 年销售额的 93% 来自订阅，净收入留存率（NRR）为
              95%，月活跃用户从 2023 年 12 月的 1.11 亿升至 2026 年 3 月的 5 亿，付费客户从 300 万增至 900
              万。对于一家仍被部分观察者视作私募股权式运营商的公司来说，这些规模信号异常强。不过，重要缺口仍在：招股书尚未确定最终 IPO 价格区间，2025
              年债务包背后的精确杠杆条款尚未以清晰白话公开，市场仍缺少按产品拆分的收入、留存和收购经济性。
