  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多数下行情景从融资、平台或法律变化开始，随后同时传导到定价弹性、转化、留存和估值。
    data:
      nodes:
        - id: capital
          label: 资本结构
          detail: 债务偿付、契约、再融资通道和利率敏感度
          type: dependency
        - id: platforms
          label: 平台与计费通道
          detail: Apple、Google、搜索、广告、处理商和退款规则
