  - id: TP004
    title: 护城河耐久性 / 竞争风险登记
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 公开证据
      - 缓释措施 / 尽调问题
    rows:
      - - 粘性档案和创作者工作流支撑重新定价
        - 如果挫败感超过切换成本，用户仍可迁移到 Notion、Dropbox 或更广的套件
        - 高
        - Appfigures 显示 Evernote 收入上升，同时下载下降、评价恶化
        - 承销可持续定价权之前，按产品索取流失、导出使用、退款率和续费同期群
      - - 投资组合宽度和集中式变现让 Bending Spoons 成为差异化运营方
        - 其他上市运营方仍可竞标资产，或复制投资组合优化剧本
        - 中
        - AppLovin、IAC 和 Ziff Davis 都展示了规模化资本配置模式
        - 审阅相对上市同行和 PE 买方的目标管线胜负数据及收购来源优势
      - - Eventbrite 的市场平台创造分发能力
        - 大型主办方可绕开发现，向 Cvent 或直接渠道购买高接触企业工具
        - 中
        - Eventbrite 宣传 89M 月用户和 270M 门票，而 Cvent 销售深度企业模块
        - 按依赖发现与品牌主导活动，细分主办方留存和贡献利润率
      - - Meetup 的网络很难快速重建
        - 当品牌更偏好白标控制权和 APIs 时，自有社区平台可能胜出
        - 中
        - Circle 销售品牌应用、APIs 和 SSO，而 Meetup Pro 按小组销售其网络访问
        - 衡量 Pro 主办方流失，以及向 Circle、Discord、Slack 和自有渠道的交叉发布
      - - 应用分发放开，可能拓宽路由选择
        - Apple 仍控制核心平台规则、时间表和法律经济性
        - 高
        - Apple 和 European Commission 都显示分发在开放，但仍受到严格管理
        - 按地域、渠道和应用，对 App Store、网页和替代应用市场路径下的毛收入到净收入经济性建模
      - - 降本和重定价改善近期现金生成
        - 信任受损可能引发替代，并在未来拖累留存
        - 高
        - Appfigures 记录收入抬升，同时伴随强烈用户反弹和低评分
        - 在假设当前变现可持续之前，要求提供 NPS、支持工单、流失和重新激活数据
      - - 单一产品聚焦能让每项资产的 P&L 更清晰
        - Microsoft 和 Google 可用更宽的套件抵消许多使用场景
        - 高
        - Workspace 和 Microsoft 365 把存储、会议、AI、管理打包进默认合同
        - 跟踪套件型在位厂商已在场时的胜率，并测试独立工具是否仍能争取到新增预算
    notes: 严重程度标签是基于已保留证据作出的分析判断，不是管理层披露的风险评级。
