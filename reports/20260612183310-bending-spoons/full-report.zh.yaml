      - number: '1.2'
        title: 领导层、治理与人才密度
        blocks:
          - type: paragraph
            body: >-
              对一家准备上市的公司而言，Bending Spoons 的治理异常以创始人为中心。F-1 称 Luca Ferrari 自 2013 年 6 月起担任 CEO，Francesco Patarnello
              负责业务收购，Matteo Danieli 仍活跃于董事会和产品职能。文件还显示，IPO 后 Ferrari、Danieli、Patarnello 和 Luca Querella 将保留 A 类股，每股拥有 5
              票。公司扩大外部股东基础后，这一结构仍能保住创始人控制权。由于收购加转型战略高度依赖管理层判断，而不是稳定的单产品路线图，这一点很重要。


              公开记录也显示，Bending Spoons 正围绕创始人核心走向专业化。招股书列出 CFO Davide Scarpazza、CTO Francesco Mancone、总法律顾问 Ignacio
              Pereira，以及一个已经纳入外部董事的董事会，成员包括 Robert Mylod、Joshua Motta、Steve Sinwell、Donald O’Neal、Leah Schwartz 和 Paola
              Tagliavini。人才密度不只是内部品牌叙事：LinkedIn 将公司列入 501-1000 人区间，F-1 和 LinkedIn 都强调其招聘选择性极高，包括 2025 年约 800,000
              份求职申请。同时，文件明确警示公司对 Ferrari 和 Patarnello 有重大依赖，并指出两人与公司均没有雇佣协议。因此，创始人延续性既是优势，也是关键人风险。
