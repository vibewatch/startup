      - CE028
      - CE032
      - CE036
      - CE044
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: 在整个产品组合中，用户通常从品牌 app 或网页界面进入，借助集成或 AI 丰富工作，通过订阅或票务完成交易，再依赖信任与同步系统维持工作流可用。
    data:
      nodes:
        - id: entry
          label: 打开 app / 网页界面
          type: input
        - id: core
          label: 捕捉、发现、流式传输或上传核心对象
          type: process
        - id: enrich
          label: 加入 AI、搜索、元数据或合作伙伴工具上下文
          type: process
        - id: collab
          label: 跨设备 / 参与者同步、分享或协作
          type: process
        - id: pay
          label: 订阅、购票或以其他方式授权访问
          type: process
        - id: deliver
          label: 发布、参加、下载或完成任务
          type: process
        - id: trust
          label: 信任、状态和支持控制维持可用性
          type: output
      edges:
        - from: entry
          to: core
          label: 开始
        - from: core
          to: enrich
          label: 为其创建上下文
        - from: enrich
          to: collab
          label: 供给
        - from: collab
          to: pay
          label: 通过它门控价值
        - from: pay
          to: deliver
          label: 使其成为可能
        - from: deliver
          to: trust
          label: 依赖
    approximationNotes: 该流程是从 Evernote、Eventbrite、Meetup、WeTransfer、Remini、Vimeo 和 Brightcove 的公开界面综合出的代表性运营模式，并非字面意义上的单一产品漏斗。
