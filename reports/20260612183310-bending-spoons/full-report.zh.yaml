  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 组合地图与用户任务
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons
              如今呈现出的形态，不像单一应用开发商，更像不同但相邻数字工作流的运营者。公开产品名单覆盖笔记和个人知识管理（Evernote）、活动发现和票务（Eventbrite）、社区组织（Meetup）、直播和浏览器制作（StreamYard）、企业和创作者视频基础设施（Vimeo
              与 Brightcove）、文件传输和审阅（WeTransfer），以及 AI 图像增强（Remini）。这种广度重要，因为产品章节评估的不是一个代码库或一条 SKU 阶梯，而是 Bending Spoons
              能否反复改善那些处于不同客户场景和不同分发渠道中的收购软件。


              最强的公开信号是，Bending Spoons 明确强调收购后的深度介入。它自己的官网把模式描述为长期持有加深度转型；第三方报道则称这些变化触及 UX、底层技术、变现和团队结构。同一官方页面还列出 6
              项自有技术，覆盖 LTV 预测、支付管理、归因、访问控制、UX
              传播和数据摄取。这并不能证明所有品牌都接入了单一统一技术栈，但确实表明，公司希望外界相信组合背后有可复用的运营基础设施，而不是一个没有共享产品系统的松散控股公司。
