        - 虽然摆出企业级姿态，但没有公开续费或集中度数据
        - 组合里目前最强的企业级证明，但用于承销仍不完整
        - 需要企业净留存率（NRR）、logo 数和合同规模分布
      - - Eventbrite
        - 市场平台指标庞大，有主办方证言，iOS 评分很强
        - 未披露主办方留存，本轮对企业页面的发现也偏弱
        - 双边采用是真实的，但耐久性仍靠代理指标支撑
