  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 关键外部依赖落在应用商店、并购监管机构、计费和支付层，以及产品层面的法律或信任承诺上；Bending Spoons 必须在庞大组合里持续维护这些承诺。
    data:
      nodes:
        - id: stores
