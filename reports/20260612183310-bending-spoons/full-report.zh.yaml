      - CR036
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议取决于组合规模经济性是否足以抵消杠杆、定价不确定性和披露缺口。
    data:
      nodes:
        - id: n1
          label: 规模与复现性
          detail: 2025 年收入 $1.31B，Q1 2026 订阅占比 84%，且队列年限较长
          tone: positive
        - id: n2
          label: 运营验证
          detail: 经营现金流和利润指标说明这是真实业务，不是投机壳
          tone: positive
        - id: n3
          label: 杠杆负担
          detail: 大额定期贷款栈和收购融资让股权价值风险维持高位
          tone: warning
        - id: n4
          label: 定价不确定性
          detail: 尚未披露股数或价格区间；$20B 仍是传闻，不是申报条款
          tone: warning
        - id: n5
          label: 披露缺口
          detail: 产品层面的结构和债务细节仍不完整
          tone: warning
        - id: n6
          label: 当前判断
          detail: 在价格和募资用途更清晰前，维持跟踪 / 继续研究
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 支撑质量判断
        - from: n2
          to: n6
          label: 允许继续参与
        - from: n3
          to: n6
          label: 要求折价
        - from: n4
          to: n6
          label: 阻断买入判断
        - from: n5
          to: n6
          label: 让信心维持中等
