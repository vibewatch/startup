  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              不应把 Bending Spoons 当作单一用途应用发行商来分析。它持有的产品横跨笔记和知识工作、文件传输和创意协作、视频托管和企业通信、活动票务和发现、社区管理，以及 AI
              增强媒体工具。因此，相关市场边界是一组成熟软件品类的变现栈，具备相互重叠的特征：庞大的已安装用户基础、低边际分发成本、对转化设计高度敏感，以及用户愿意为便利性、工作流集成或受众触达付费。这个边界包括订阅、企业席位、票务和支付抽成，在某些情况下也包括广告相邻变现；但不包括大多数硬件、代理服务，以及围绕这些产品存在却不直接流经
              Bending Spoons 软件界面的更广泛消费者或创作者经济支出。


              最好的公开市场规模证据是分层的，而不是单一数字。Sensor Tower 的 2026 年发布材料显示，全球移动应用支出池很大，并确认非游戏应用在变现上已经超过游戏。这一点重要，因为 Bending Spoons
              当前最大的资产位于非游戏市场一侧。RevenueCat 的基准数据则提供了更有用的运营视角：市场在变大，但收入捕获正集中到成熟且执行良好的应用，而不是均匀扩散给新进入者。这个模式比泛泛一句「软件 TAM
              很大」更贴合 Bending Spoons 的组合战略，因为公司专门收购已有规模或知名度的品牌，并从中榨出更多价值。
