        title: 扩张、集中度与承销缺口
        blocks:
          - type: paragraph
            body: >-
              客户模型更多靠可见的扩张阶梯来承销，而不是靠已披露的集中度数据。Eventbrite 从免费发布扩展到付费票务费、Pro 套餐、营销附加项，以及面向大型活动的定制销售支持。Vimeo
              可以把客户从标准套餐推向企业治理，再推到 OTT 能力。Evernote 从免费版扩展到 Starter、Advanced 和 Enterprise；Meetup 则能从单一主办方订阅爬升到 Pro
              网络部署。StreamYard 和 Remini 也都有清晰的循环变现阶梯。问题在于，公开证据还没触及投资级问题。留存资料没有显示头部客户占比、渠道集中度、合同期限或产品级流失。组合内部的证据也不均衡：Vimeo
              看起来最强，Eventbrite 和 StreamYard 尚可；如果门槛是当前有名可查的生产部署，而不是标识或泛化证言，Evernote、Brightcove、WeTransfer 和 Remini
              的证据就薄得多。因此，本章对采用广度和变现设计给出建设性判断，但对耐久性和集中度只能给出部分判断。
