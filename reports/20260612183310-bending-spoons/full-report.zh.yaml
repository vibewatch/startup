      - number: '2.2'
        title: 买方分层与变现路径
        blocks:
          - type: paragraph
            body: >-
              组合的买方地图比「应用公司」这个标题更分层。Evernote 现在面向需要共享工作区、协作、搜索、任务分配和管理控制的组织销售；Vimeo
              将自助式创作者与购买安全、治理、分析和支持的大型企业区分开；WeTransfer 从免费个人分享一路升级到付费个人、团队和企业计划；Eventbrite 向组织者销售发现、推广、结账和支付运营的组合；Meetup
              Pro 向社区运营者出售跨多个小组扩展品牌化网络的能力。整个组合里，用户可以是个人创作者、营销人员或组织者，但付款方可能从个人信用卡转向部门预算，或转向活动票务流的经济性。


              这关系到市场质量。产品组合若以自助式采用起步，同时提供清晰的团队或企业工作流升级路径，就能同时支撑消费者规模的漏斗顶端和关系后期更高价值的预算所有者。这里最好的证据不是一个统一 ARPU
              数字，而是产品页面持续把个人使用与多席位或企业使用分开。这使 Bending Spoons 的机会更像一组成熟的专业消费者和 SMB 软件漏斗，而不是纯粹由爆款驱动的消费者应用业务。
