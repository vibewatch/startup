      - CE038
      - CE041
      - CE042
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 可见依赖从应用商店和合作伙伴生态，经过共享的 Bending Spoons 系统，进入品牌产品； 也就是说，产品质量既取决于内部运营杠杆，也取决于外部平台稳定性。
    data:
      nodes:
