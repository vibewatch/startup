  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 运营商版图与竞争框架
        blocks:
          - type: paragraph
            body: >-
              不能只拿一个笔记应用、一个文件传输工具或一个活动平台来给 Bending Spoons
              做基准。公司现在持有的组合已经足够大，首先是在低优化数字资产的市场中竞争，其次才是在这些资产所服务的各个产品品类中竞争。TechCrunch 的 IPO 报道展示了这个运营商假设的规模：超过 5
              亿月活跃用户、900 万付费客户，以及围绕传统消费者和创作者品牌完成的 50 多起收购。Appfigures 对收购后的分析补上了数字背后的机制：即便下载动能走弱，Bending Spoons
              也反复提价、简化成本结构，并依靠订阅变现。


              最接近的公开类比对象并不是完全复制品。AppLovin 也是规模化软件运营商，但它通过广告技术和增长基础设施变现，而不是通过工作流订阅。IAC 和 Ziff Davis
              也表明，收购驱动的互联网控股公司可以随时间复利增长，但两者都是更宽泛的媒体和互联网组合，而不是应用专用的扭转机器。这意味着 Bending Spoons
              的竞争场是不对称的：上游要和其他资本配置者争夺品牌；下游仍必须打赢 Microsoft、Google、Dropbox、Wistia、Cvent、Circle 等直接进攻底层工作流的对手。
