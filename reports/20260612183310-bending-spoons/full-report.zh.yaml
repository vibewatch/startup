  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 资本、平台与模型风险
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons 的核心风险在于，其运营打法仍依赖一套公司无法完全控制的资本结构和分发栈。2026 年 6 月的 F-1
              清楚说明，收购仍是优先事项，公司可能仍需要额外融资，债务也可能限制灵活性、迫使再融资，或挤占未来投资。这不只是资产负债表问题。一家公司如果 Q1 2026 收入的 84%
              来自订阅，并依赖应用商店、搜索、广告和第三方支付系统，同一个外部变化就可能同时打到转化、续费、退款、佣金和广告收益率。Apple
              自身的订阅经济和审核规则进一步说明，第三方平台确实拥有定价和审批权。该模型横跨多个产品，且不依赖单一大客户，但结构上仍暴露于杠杆、平台费和政策变化；这些因素压缩利润率的速度，可能快于收入摘要给人的印象。
