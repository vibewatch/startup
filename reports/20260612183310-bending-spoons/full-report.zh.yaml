  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: 可见旅程从具体产品需求开始，随后分流到自助、市场或企业工作流；只有走到这里之后，留存问题才有可观察基础。
    data:
      items:
        - id: need-arises
          label: 需求出现
          actor: 创作者、组织者、员工、消费者或管理员
          description: 产品组合从不同任务切入：流式传输一场演出、办一场活动、整理笔记、加入一个社区，或优化一张照片。
          channels:
            - 官方产品页面
            - 应用商店
            - 产品组合品牌认知
        - id: choose-surface
          label: 选择界面
          actor: 主要是自助用户；有时是团队管理员或组织者
          description: 客户在消费者 app、市场工作流，或需要销售联系的企业视频平台之间选择。
          channels:
            - 定价页面
            - 产品品类页面
            - App 列表
        - id: activate
          label: 激活 / 购买
          actor: 购票者、组织者、订阅用户或采购负责人
          description: 激活可能意味着买票、开始订阅、启动创作者套餐，或为企业部署联系销售。
          channels:
            - 结账流程
            - 免费试用
            - 销售表单
        - id: use-and-share
          label: 使用并分享
          actor: 终端用户、参与者、员工、创作者、社区
          description: 价值证明来自协作、发布、活动参与、笔记分享，或增强后的视觉输出。
          channels:
            - 应用商店
            - 客户页面
            - 官方功能界面
        - id: expand-or-renew
          label: 扩张 / 续约 / 流失
          actor: 预算负责人或经常性订阅用户
          description: 公开记录清楚展示了扩张阶梯，但对实际续约、流失，或按 cohort 划分的集中度着墨不足。
          channels:
            - 定价阶梯
            - 负面报道
            - 路线图表述
    claimRefs:
      - CU006
      - CU008
      - CU010
      - CU012
      - CU013
      - CU039
      - CU040
      - CU042
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 发现和激活环节证据较扎实，但首次购买或首次部署之后，公开记录很快变薄。
    data:
      nodes:
        - id: discover
          label: 发现
          description: 用户通过市场、应用商店或知名品牌入口接触到某个具体产品。
        - id: evaluate
          label: 评估
          description: 价格档位、功能页和产品文案说明产品如何匹配参会者、主办方、创作者、企业或消费者。
        - id: purchase
          label: 购买 / 订阅
          description: 激活可能来自购票、周期性套餐、主办方订阅，或企业联系销售的动作。
        - id: deploy
          label: 部署 / 使用
          description: 真实使用可从 Vimeo 上的 Garver 案例、Eventbrite 的主办方引述、StreamYard 的创作者证言，以及应用商店里的大量足迹看出。
        - id: expand
          label: 扩展
          description: 官方页面显示，Vimeo、Evernote、Eventbrite、Meetup、StreamYard 和 Remini 都有套餐阶梯和跨客群追加销售机会。
        - id: retain
          label: 留存或流失
          description: 证据在这里转弱：公开来源很少披露续约、净留存率（NRR）、总留存率（GRR）或大客户敞口。
      edges:
        - from: discover
          to: evaluate
          label: 找到合适的产品入口
        - from: evaluate
          to: purchase
          label: 试用、购票费或销售接触
        - from: purchase
          to: deploy
          label: 在生产环境使用产品
        - from: deploy
          to: expand
          label: 升级到更宽套餐或客群
        - from: expand
          to: retain
          label: 续约、加深使用或流失
    claimRefs:
      - CU014
      - CU023
      - CU025
      - CU030
      - CU032
      - CU039
      - CU044
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: standard
    summary: Vimeo 和 Eventbrite 的证据质量最强；Evernote 证据尚可但偏重客户标识；企业式验证较薄的板块缺口最大。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 留存可见度
        - 覆盖缺口
      rows:
        - label: Vimeo Enterprise
          values:
            - 高——案例细节加路线图背景
            - 高——互动提升、办公室、员工
            - 低——无续约指标
            - 需要客户标识数量、净留存率（NRR）和合同集中度
        - label: Eventbrite 市场
          values:
            - 高——大规模主张加应用商店足迹
            - 中——主办方引述和运营功能
            - 低——无主办方队列留存
            - 需要重复主办方指标和大型活动占比
        - label: Evernote 企业
          values:
            - 中——定价加客户标识墙
            - 低——客户标识多于量化结果
            - 低——无席位续约数据
            - 需要具名部署和席位留存历史
        - label: StreamYard 创作者
          values:
            - 中——具名证言和透明定价
            - 中——有重复使用引述，但无量化业务影响
            - 低——周期性计费可见，但流失不可见
            - 需要企业客户标识和按套餐划分的续约
        - label: Remini / 覆盖较薄的品牌
          values:
            - 低到中——有规模主张和评分，但具名企业验证弱
            - 低——几乎没有量化业务结果证据
            - 低——无合同或留存指标
            - 需要 Brightcove、WeTransfer 和商业 Remini 使用的当前客户故事
    claimRefs:
      - CU023
      - CU026
      - CU027
      - CU045
      - CU047
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余严重度主要集中在杠杆、平台依赖、整合执行和监管 / 隐私敞口，而不是单一产品需求风险。
    data:
