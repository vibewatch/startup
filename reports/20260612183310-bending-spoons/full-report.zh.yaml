  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 产品
      - 标价 / 费用
      - 合同模式
      - 包含能力
      - 未知项 / 折扣提示
      - 含义
    rows:
      - - Evernote Advanced
        - 年付每月 $20.83（每年 $249.99）
        - 自助式年度套餐
        - 不限量笔记、笔记本、附件和设备
        - 实际折扣和企业附加销售未披露
        - Evernote 现在处在专业消费者软件价格带，而不是廉价工具价格带
      - - Evernote Enterprise Flexible 企业版
        - 每席位每月 €10 起
        - 自助式企业起点
        - 企业数据所有权、高级管理、安全 / 合规、AI、协作
        - Unlimited 套餐为定制价格，且从 10+ 用户起
        - Bending Spoons 正明确把 Evernote 推向结构化、按席位计价的企业包装
      - - WeTransfer Ultimate / Teams
        - 个人每月 $25；Teams 按用户计价，至少 2 名用户
        - 自助式加团队向上销售
        - 不限量传输、品牌露出、共享工作区、集中计费
        - 企业价格和具体团队席位价格为定制
        - 文件传输业务不再是纯免费增值；Bending Spoons 可以向团队预算爬梯
      - - Dropbox Standard
        - 3+ 用户每用户每月 $15
        - 按席位计价的团队 SaaS
        - 5TB 团队存储、100GB 传输、品牌、密码保护、管理员控制
        - 企业折扣和最终合同价格未公开
        - Dropbox 把传输与持久存储和管理打包，压窄了 WeTransfer 的定价空间
      - - Vimeo Advanced
        - 10 名用户每月 $75
        - 自助式年度套餐，另有企业定制层
        - 托管直播、问答、聊天、分析和营销集成
        - 企业价格为定制，带宽条款各不相同
        - Vimeo 的定价更接近商业视频基础设施，而非消费者媒体托管
      - - Eventbrite 付费活动费用
        - 每张票 3.7% + $1.79 服务费，另每笔订单 2.9% 处理费
        - 按使用量计价的市场平台抽成
        - 发现、结账、付款、主办方工具和营销附加组件
        - 大型活动谈判项目未公开
        - 抽成式变现与 SaaS 席位在结构上不同；如果发现仍有价值，就能防守
      - - Meetup Pro
        - 每小组每月 $55，或六个月套餐 $47
        - 按小组订阅
        - 网络分析、定向沟通和专属支持
        - 区域价格和特别优惠各不相同
        - Meetup 变现的是主办方网络所有权，而非门票量或席位数
      - - Circle Business
        - 每月 $199
        - 月度 SaaS，另有定制 Plus 层
        - 工作流、APIs、品牌邮件、转录和自有社区控制
        - 定制 Plus 价格和品牌应用经济性未披露
        - Circle 可以用控制权更强的自有社区软件削弱 Meetup 的网络叙事
    notes: 标价是公开表面价格，不是实际企业价格。未知项很关键，因为折扣、谈判带宽或支持条款很可能驱动大客户经济性。
