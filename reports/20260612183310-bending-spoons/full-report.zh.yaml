      - number: '2.4'
        title: 尽调缺口与估值相关性
        blocks:
          - type: paragraph
            body: >-
              第二章尽调最难的地方，不是寻找 Bending Spoons
              触达大市场的证据，而是证明这些市场中有多少真正可由这套特定运营模式服务并长期守住。组合显然进入了几个大池子：移动应用支出、创作者软件、企业视频、文件传输、活动运营和社区工具。但公开证据仍没有给出一座清晰桥梁，把这些池子连接到
              Bending Spoons 特定的 SAM 或
              SOM。这个缺口很重要，因为如果滚动收购能反复捕获变现不足的存量用户基础，就可以支撑溢价；但如果重新定价和成本削减最终削弱留存的速度快于现金流扩张，它也可能高估价值。


              因此，估值相关性来自市场结构，而不只是标题式 TAM。公开基准显示，回报正集中到规模化运营商；Bending Spoons
              自身组合证据也显示，它能在具备粘性工作流的成熟产品上提高变现。这是有利的市场结构。开放问题在于，公司能否持续升级产品并进入团队或企业预算，同时不耗尽用户信任，也不撞上平台成本天花板。在管理层披露产品层面收入桥和市场分层框架之前，投资者应把
              TAM/SAM/SOM 叙事视作受证据约束，并把重点放在用户队列质量、变现耐久性和平台暴露上。
