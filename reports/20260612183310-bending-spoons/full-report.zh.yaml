            body: >-
              最强的公开采用证据来自 Eventbrite、Meetup、Evernote、Remini 和 Vimeo。Eventbrite 披露了保留证据集中最清楚的市场规模：2.70 亿张门票、8,900 万月度用户和
              470 万场活动，并由 170 万条评分形成的 4.9 iOS 评分补强。Meetup 应用声称拥有 6,000 万会员、每周 100,000 场活动和 330,000 个小组，另有 273,000 条 iOS
              评分。Evernote 即便在产品收紧后仍有 76,000 条 iOS 评分；Remini 声称拥有 1 亿月活跃用户、1,500 万月下载量，以及 50 亿张增强照片或视频，并由 345,000 条 iOS
              评分支撑。具名客户证明更不均匀。本轮中 Vimeo Enterprise 通过 Garver 的 60 个办公室、1,300 多名员工和报告的互动提升，给出最好量化案例。StreamYard
              提供具名创作者和企业推荐语，Eventbrite 发布带有具体转化和关注者收益的组织者引述。Evernote 的企业页有用，但主要基于标识，而不是基于结果。净判断是，采用真实存在，但证明质量因品牌而异。
