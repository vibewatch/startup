  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 公开证据显示，Bending Spoons 把庞大存量用户主要转成经常性收入，再转成毛利润； 杠杆随后在更下层吃掉一部分价值。
