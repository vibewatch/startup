          detail: 2026 年 3 月披露的产品组合规模。
          tone: positive
        - id: payers
          label: 900 万+付费客户
          detail: 2026 年 3 月披露的产品组合付费用户。
          tone: positive
        - id: subs
          label: 订阅收入
          detail: 2026 年 Q1 收入的 84%、2025 年收入的 93% 来自订阅。
