        title: 情景区间与回报逻辑
        blocks:
          - type: paragraph
            body: >-
              因此，情景分析必须简单且明确。熊市情形假设产品级披露仍薄、杠杆仍居核心位置，即使收入继续增长，市场也会给出运营商式折价。在这个世界里，公允价值低于 2025
              年私募标记；如果再融资成本、流失或监管摩擦侵蚀现金转化，下行可能很快出现。基准情形假设 Bending Spoons 继续复合增长循环收入，把部分 IPO
              转化为真正的发行人所得，并证明组合能够在没有持续重新定价冲击的情况下维持利润率和留存。该情形支持低十几到中十几 billion 的价值区间，大致相当于 2025
              年末私募标记加上一些执行信用。牛市情形需要后续修订或路演证据显示，市场正在把 Bending Spoons
              更接近高质量复利机器来承销：耐久增长、可管理的债务服务、更清晰的分部披露，以及有限的二级出售压力。只有到那时，接近传闻 $20 billion
              的估值才开始显得可信，而不只是宣传。换句话说，上行情形并非不可能，但仍取决于证据。
