            body: >-
              最终估值决定应取决于能直接回答当前盲点的尽调，而不是公司整体是否令人印象深刻。三个问题最重要。第一，IPO 募资到底流向谁？IPOGrid
              目前把文件描述为仅出售股东售股、发行人没有所得；如果这一点延续到后续修订，外部投资者可能是在提供流动性，而没有降低杠杆。第二，组合里好的部分到底有多集中？投资者仍需要产品级收入、利润率和流失，才能判断最强品牌是否在扛着较弱品牌。第三，2026
              年 1 月融资激增后，债务栈要求有多高？F-1
              显示杠杆仍在债务契约以内，但债务契约余量不等于股权价值舒适。这些尽调问题也定义了打破投资论点的因素。如果后续修订显示大量二级出售、去杠杆有限、重新定价后留存恶化，或债务条款吸收的股权价值高于预期，估值案例就应重定基准。如果后续修订反而显示有意义的发行人募资、稳定的分群行为和可信的分部披露，建议可以在合适价格下从跟踪转向买入。
