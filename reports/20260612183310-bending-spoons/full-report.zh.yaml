  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 品类
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Bending Spoons
        - 直接标的 / 应用集团运营方
        - 500M+ MAU、9M 付费用户、2025 年收入 $1.31B、50+ 次收购
        - 变现不足的消费者、创作者和 SMB 软件资产
        - 跨多个成熟品牌的集中式订阅优化和扭转剧本
        - 用户反弹证据和持续的平台依赖，让该模式的耐久性弱于收入规模表面暗示
      - - AppLovin
        - 直接上市运营方可比公司
        - 上市软件运营方；FY2025 收入 $5.481B
        - 广告主、应用开发者、流媒体电视合作伙伴
        - 由 Axon、Adjust 和 Wurl 组成的广告技术变现栈，提供强大的效果营销引擎
        - 与 Bending Spoons 旗下资产面对的协作、创作者工作流或票务任务重叠少得多
      - - People Incorporated（前 IAC）
        - 既有数字控股公司
        - 上市运营方；People Inc FY2025 数字收入 $1.1B
        - 媒体、出版和战略互联网持股
        - 长期擅长机会型持有、资本配置和分拆纪律
        - 更偏广义控股公司模式，而非订阅优先的应用扭转
      - - Ziff Davis
        - 收购驱动的互联网 / 媒体运营方
        - 上市运营方；FY2025 收入 $1.45B，并购投入 $3B+
        - 科技媒体、购物、网络安全、连接和营销技术用户
        - 可重复的 M&A 计划和多元化数字品牌基础
        - 相比 Bending Spoons 偏应用、重订阅的模式，内容、线索生成和服务敞口更高
      - - Microsoft 365
        - 捆绑型既有厂商 / 现状套件
        - 面向 300 名以上用户组织的企业套餐
        - 知识工作、协作、存储、通信和 IT 管理买方
        - 邮件、Teams、安全、AI 和文件协作被打包进一次采购动作
        - 并非每个细分工作流都是同类最佳，但捆绑会降低独立工具的付费意愿
      - - Dropbox
        - 文件共享领域的现状替代品
        - Standard 套餐为 3+ 用户每用户每月 $15；可向上销售企业版
        - 希望把传输、存储和管理放在同一份合同里的团队
        - 结合传输、存储、品牌、密码保护和管理员控制
        - 缺少 Eventbrite 式发现或 Meetup 式网络效应，也不如 WeTransfer 以创作者品牌为中心
      - - Cvent
        - 企业活动既有厂商
        - 模块化活动栈，企业销售采用定制报价
        - 大型活动运营方、采购团队和企业活动项目
        - 在采购、网络研讨会、摘要和集成等高接触工作流上有深度
        - 消费者侧发现市场平台弱于 Eventbrite
      - - Circle
        - 相邻社区替代品
        - Business 每月 $199；Plus 定制价格
        - 建设自有社区的品牌和创作者
        - APIs、品牌应用、工作流和自有成员体验
        - 不提供 Meetup 的开放成员网络或活动发现层
    notes: 这些行刻意混合了运营方可比公司和工作流既有厂商，因为 Bending Spoons 既争夺资产，也争夺这些资产服务的底层用户任务。
