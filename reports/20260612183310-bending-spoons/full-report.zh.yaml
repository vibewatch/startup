  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性价值区间
      - 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 悲观
        - 去杠杆很少，发行人募资有限，分部组合不透明，且运营商式倍数压缩
        - USD 7.5B-10.0B
        - 低于或仅略触及 2025 年私募估值；如果公开市场买方在接近 $20B 传闻估值处进入，回报偏弱或为负
        - 如果后续修订仍让交易大体以老股出售为主且债务沉重，则可能发生
        - 利率更高、队列证据疲弱，或监管摩擦上升
      - - 基准
        - 收入仍然强劲，部分 IPO 募资流入公司，尽管存在杠杆，市场仍给予部分软件溢价
        - USD 11.0B-15.0B
        - 只有定价更接近 2025 年末私募估值、而非传闻上限时，才支撑持有或选择性进入
        - 以当前证据集看最可辩护
        - 新股募资或分部数据不足，会把估值推低
      - - 乐观
        - 后续修订显示有意义的新股资本、可管理的债务服务，以及产品级韧性，足以证明相对高端软件同业的折价应收窄
        - USD 17.0B-22.0B
        - 唯一能让接近传闻上限的估值成立、且不立即承受倍数痛感的情景
        - 需要尚未公开的证据，而不只是叙事热情
        - 如果增长放缓或去杠杆不及预期，投资逻辑会退回基准情景
      - - 极端下行
        - IPO 定价偏高，市场随后向运营商可比公司正常化
        - USD 5.0B-7.0B
        - 展示公众投资者在债务、募资用途和分部问题回答前先高价买入会发生什么
        - 低概率但高后果
        - 被收购应用出现一轮重新定价，或再融资挤压
    notes: 区间是锚定留存证据的分析估计，不是管理层指引或 DCF。区间刻意放宽，因为定价、募资结构和债务细节仍未解决。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态
      - 指标基准
      - 估值或市值
      - 隐含倍数 / 视角
      - 相关性
      - 局限性
    enumerationScope:
      coverage: partial
      basis: >-
        This set intentionally mixes documented private marks, current public comps, and recent software-asset
        transactions to bracket Bending Spoons. It is partial because a full comparable universe would require paid
        banking or private-market databases, and because the company itself still reports only portfolio-level rather
        than product-level financials.
    rows:
      - - Bending Spoons 私募轮
        - 私募估值（2025 年 10 月）
        - 2025 年收入 $1.31B / 2026 年 Q1 年化收入 $2.40B
        - $11.0B 投前
        - 约 8.4x 2025 年收入 / 约 4.6x 年化 Q1 2026 收入
        - 为当前投资者预期提供有文件支撑的底线
        - 仍处于 IPO 前，且与大额债务包同时设定
      - - Bending Spoons 市场数据估值
        - 私募估值（2025 年末）
        - 2025 年收入 $1.31B / 2026 年 Q1 年化收入 $2.40B
        - ~$11.7B
        - 约 9.0x 2025 年收入 / 约 4.9x 年化 Q1 2026 收入
        - 显示独立数据服务如何定位该轮融资
        - 依赖第三方综合，而不是已提交的股权结构表
      - - 传闻 IPO 估值
        - 公开市场传闻（2026 年）
        - 2025 年收入 $1.31B / 年化 Q1 2026 收入 $2.40B
        - ~$20.0B
        - 约 15.3x 2025 年收入 / 约 8.3x 年化 Q1 2026 收入
        - 检验路演叙事中已经包含多少乐观预期
        - 尚未出现在 SEC 文件中，且可能大幅变化
      - - AppLovin
        - 公开可比公司
        - FY2025 收入 $5.481B
        - $166.88B 市值
        - ~30.4x
        - 增长和市场信念的上界
        - 相比 Bending Spoons，叙事更干净，资产负债表负担更轻
      - - Braze
        - 公开可比公司
        - FY2026 收入 $738.2M
        - $2.43B 市值
        - ~3.3x
        - 有用的软件增长中位参照
        - 单一产品软件平台，不是收购组合
      - - DoubleVerify
        - 公开可比公司
        - FY2025 收入 $748.3M
        - $1.56B 市值
        - ~2.1x
        - 邻近广告技术、现金状况为正的运营商
        - 需求驱动不同，也没有收购堆叠
      - - Ziff Davis / IAC
        - 公开运营商可比公司
        - ZD 的 FY2025 收入 $1.45B；IAC 的年化 Q1 2026 数字收入约 $1.0B
        - $1.70B 和 $3.14B 市值
        - 约 1.2x 和低个位数
        - 显示收购驱动或控股公司模型的低倍数结果
        - 增速更慢，资产组合也不同于 Bending Spoons
      - - Eventbrite / Vimeo 交易
        - 近期资产交易
        - Eventbrite 的 TTM 收入 $295M；Vimeo 基于溢价的视角
        - $500M 和 $1.38B 交易价值
        - 约 1.7x Eventbrite 收入；Vimeo 享有战略溢价
        - 锚定 Bending Spoons 自身为成熟资产支付的价格
        - 资产级交易不同于给平台所有者估值
    notes: 倍数是使用留存市值和收入来源得出的分析估计，用来框定合理性，而不是宣称企业价值精确无误。
