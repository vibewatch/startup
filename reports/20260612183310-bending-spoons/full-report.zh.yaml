      - number: '3.3'
        title: 转换成本、分发权力与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              证据显示，Bending Spoons 的护城河真实存在，但它是运营型的，不是绝对型的。Appfigures 显示，公司能在 Evernote 和 WeTransfer
              上提高收入，却无需匹配下载增长，这意味着它对粘性存量用户基础拥有一定定价权。对于有档案、工作流、品牌化活动页或组织者历史的产品，用户迁移的不便形成了足够摩擦，支撑重新定价。Eventbrite
              的市场规模也是一个具体的护城河元素，因为发现和转化发生在同一个界面上。


              但这条护城河也有条件。同一份 Appfigures 分析强调，Evernote 和 Meetup 出现严重用户反弹，意味着至少在短期内，信任衰减可能快于收入。与此同时，Apple 的 2026 年欧盟 DMA
              变化和 European Commission 的互操作性命令显示，应用分发经济性在政治和技术上仍不稳定。Apple 正在开放替代分发路径，但法律条款仍要求相当规模，或提供 €1M
              信用证，因此组合运营商的平台依赖不会消失。实务上，Bending Spoons
              买到的是具备粘性工作流、所有权纪律薄弱且捆绑竞争有限的资产时最强；当沮丧用户可以轻松迁往更宽套件、更便宜点工具或维持现状内部流程时最弱。因此，公开文件和官方定价页支持的护城河结论，比 IPO
              增长叙事本身更窄：公司确有定价杠杆，但仍必须逐个产品赚回留存。
