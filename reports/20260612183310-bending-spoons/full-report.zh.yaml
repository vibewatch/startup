      - number: '2.3'
        title: 增长驱动与平台约束
        blocks:
          - type: paragraph
            body: >-
              结构性增长驱动因素确实存在，但比经典风投式 TAM 故事窄。Sensor Tower、IAB 和 Forrester 都指向非游戏应用、创作者工具、流媒体视频，以及相邻商业或联盟渠道的持续变现增长。IAB 的
              2025 年数字广告报告显示，创作者经济和流媒体视频工作流仍在扩张；Forrester 的 2026 年观点则表明，营销人员正主动把预算分散到旧有平台三巨头之外。这些趋势有助于解释为什么 Bending
              Spoons 能在成熟品牌内部持续找到可变现工作流：即便产品名称本身显得老旧，终端市场仍在演化。


              约束同样具体。Apple 在欧盟的规则变化新增了围绕获客费、商店服务费和核心技术费的复杂性，而这正发生在大型应用运营商试图优化经常性收入的时候。DMA 旨在让应用商店市场更公平、更可竞争，但 Apple
              自己的说明也强调了侧载和多市场分发可能带来的隐私、支付和信任摩擦。与此同时，RevenueCat 数据显示，账单追回、试用设计和付费墙设计对增长有实质影响；Appfigures 也显示，Bending
              Spoons 的短期变现提升可以与可见的用户反弹并存。因此，这个市场有吸引力，但并非没有摩擦：采用和留存取决于定价、分发和信任管理的执行质量。
