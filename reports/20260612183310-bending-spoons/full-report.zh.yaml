        title: 利润率结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              盈利能力真实存在，但不能简单说 Bending Spoons 是一家高利润率软件公司。文件显示，2025 年毛利润为 $857.3M，估算毛利率 65.6%，2026 年 Q1 又提升至估算
              67.9%。营业利润在 2025 年达到 $277.9M，在 2026 年 Q1 达到
              $120.2M；销售和营销支出仍仅约为收入的十分之一。这些都是强信号，说明公司可以在不支撑经典风投烧钱机器的情况下，从粘性存量用户基础中变现。


              同时，单位经济性桥并不会止于营业利润。2025 年利息支出达到 $142.6M，仅 2026 年 Q1 就达到
              $93.2M，已经高到足以吃掉本来有吸引力的软件利润率中的相当一部分。文件还把收入耐久性描述为变现举措的函数，这与 Appfigures 和 TechCrunch 的报道一致：Bending Spoons
              常在收购后收紧定价和成本结构。从实务尽调看，公开证据支持这样一家企业：毛利率稳健、留存强、销售强度相对低；但产品层面披露仍不足，无法逐品牌承保标准化生命周期价值、CAC 回收期或利润率耐久性。
