chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式与组合形态
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Bending Spoons 的身份比它大部分私有公司阶段都更清晰。SEC 招股书称，公司 2013
              年创立于哥本哈根，后来把总部迁至米兰，现在主要通过子公司以控股公司形态运营。公司自有页面和创始人访谈也描述了同一个核心模式：收购已有产品市场契合度的数字业务，深度改造运营和技术，并长期持有，而不是转手卖出。这套模式解释了为什么
              Bending Spoons 不像传统单产品创业公司，更像一家拥有集中运营基础设施的软件复利机器。


              目前的组合横跨创作者工具、消费者工具和部分偏企业的互联网品牌。在官网和 LinkedIn 页面上，Bending Spoons 将
              Vimeo、Evernote、Remini、WeTransfer、Eventbrite、Meetup、Brightcove、StreamYard 和 AOL 列为更知名的持有资产。招股书和独立 IPO
              报道进一步放大了规模叙事：到 2026 年 3 月，组合服务的月活跃用户超过 5 亿、月度付费客户超过 900 万，2025 年收入超过 $1.31B。这使 Bending Spoons
              不只是一个意大利成功案例，而是一家全球规模的组合运营商；它的经济引擎依赖经常性订阅、集中化工具，以及比原所有者更快改善收购产品的能力。
