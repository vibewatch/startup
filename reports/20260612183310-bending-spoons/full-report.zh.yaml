  - id: TI004
    title: 资本充足性表
    columns:
      - 资本变量
      - 最新公开证据
      - 穿透判断
      - 重要性
      - 尽调要求
    rows:
      - - 手头现金
        - 2026-03-31 现金及现金等价物为 $740.823M
        - 流动性缓冲充足
        - 支撑近期灵活性，但不足以单独自筹十亿美元级 M&A
        - 要求提供非受限现金、受限现金和最低流动性政策
      - - 债务负担
        - 2026-03-31 总债务 $4.356B，含一年内到期部分
        - 杠杆是主要财务约束
        - 债务可能通过利息和再融资风险吞掉经营上行
        - 要求提供完整债务结构、到期日、利差和抵押品
      - - 经营现金流
        - 2025 年 $291M；2026 年 Q1 $76M
        - 基础组合能产生现金
        - 显示即便不计 IPO 募资，资产也能吐出现金
        - 提供经常性与并购相关现金流桥
      - - 投资现金流
        - 2025 年 -$1.852B；2026 年 Q1 -$1.648B
        - 并购计划消耗超过内生现金生成
        - 证实滚动并购策略仍依赖外部融资
        - 拆分并购支出、或有对价和维护性资本开支
      - - 融资现金流
        - 2025 年 $1.936B；2026 年 Q1 $1.741B
        - 债务和股权仍是关键资金来源
        - 显示复利模型仍依赖资本市场通道
        - 按来源提供债务、股权和 IPO 用途之间的桥
      - - 杠杆契约
        - 最高 4.00x；披露 2025 年末为 2.24x，2026 年 Q1 为 2.19x
        - 存在余量，但债务契约细节不完整
        - 公开债务契约舒适度总比没有好，但仍不能排除到期风险
        - 提供贷款人定义和降档时间表
      - - 已募集新股融资
        - 截至 2026 年 Q1 末累计 $549M；99% 来自 2023 年以来
        - 管理层偏好使用杠杆，而不是频繁发行股权
        - 未来稀释可能是阶段性的，而非持续发生
        - 提供完全稀释股数和 IPO 后备考股权结构表
      - - IPO 募资用途计划
        - 价格区间和明确募集资金用途仍未披露
        - 公开投资者尚无法在去杠杆与并购资金之间建模
        - 没有募资用途桥，估值和资本结构情景仍会很宽
        - 披露目标募资规模、偿债金额和 M&A 储备政策
    notes: 本表强调资本充足性，而非历史融资时间线。经营强度已有公开证据；确切债务条款和 IPO 后资金配置仍是关键未解约束。
