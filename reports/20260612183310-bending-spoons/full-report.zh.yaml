      - number: '5.2'
        title: 架构、集成与开发者界面
        blocks:
          - type: paragraph
            body: >-
              公开架构证据并不均匀，但仍有信息量。Evernote 是最清楚的例子，它具备可见的工作流、API 和安全层：应用把笔记、任务和日历连在一起；集成页把产品连接到 Google Calendar、Outlook
              Calendar 和 Slack；开发者文档要求手动批准 API key，并发布跨平台 SDK 指南；安全页称第三方客户端通过 thrift API 使用 OAuth 认证。Eventbrite、Vimeo 和
              Brightcove 展示了另一种架构形态。Eventbrite 围绕活动工作流开放开发者平台和应用市场。Vimeo 将 API
              界面与大型合作伙伴目录相连，后者接入剪辑、CRM、无障碍、云存储和变现系统。Brightcove 则更深入，发布分析、受众、摄取、播放、直播、OAuth 和 SSAI API。


              合在一起看，这些来源暗示 Bending Spoons 运营的组合公司，技术护城河不只是前端品牌。它们还依赖真实的集成生态、外部开发者关系和第三方平台。这带来杠杆，也带来依赖。应用商店、日历套件、CRM
              合作伙伴、广告技术或支付轨道、云基础设施，以及继承来的安全能力，都位于面向用户品牌的底层。公开证据支持一个具有实质 API 和集成深度的组合；但还没有提供维护者级别图纸，说明这些深度有多少已经统一到
              Bending Spoons 之下，而不是仍由各产品自己维持。
