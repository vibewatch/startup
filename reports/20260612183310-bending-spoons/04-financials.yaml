company:
  name: Bending Spoons
chapter:
  number: 4
  title: Financials
  summary: 'The June 2026 F-1 shows that Bending Spoons is not just growing quickly but doing so on a mostly recurring revenue base with strong retention and positive operating cash flow. The same filing also shows why the equity story is still constrained: acquisition spend far exceeds internal cash generation, debt and interest expense are material, and investors still lack product-level segment and debt-term disclosure needed for full underwriting comfort.'
sections:
- id: revenue-quality-and-mix
  title: Revenue Quality and Mix
  body: |-
    The filing materially upgrades the quality of Bending Spoons financial evidence because it replaces venture-style anecdotes with audited-style revenue, mix, and retention disclosures. The core headline is not just scale but quality of scale: revenue rose from $387 million in 2023 to $1.306 billion in 2025, while subscriptions still made up 93% of 2025 revenue and 84% of Q1 2026 revenue. Advertising mattered, but the filing makes clear that the business is still primarily a subscription machine, with other sources only 4% of Q1 2026 revenue. That matters because it means the investment case rests more on recurring billing durability than on one-off app sales or volatile ad monetization.

    Retention data supports that view better than the market’s “serial acquirer” shorthand does. Net revenue retention reached 95% in 2025 and 94% in Q1 2026, while 48% of Q1 subscription revenue came from customers who had already been paying for at least five years. The weighted average subscriber tenure of 8.0 years is unusually strong for a portfolio built through M&A. The counterpoint is disclosure granularity: Bending Spoons still reports the economics at portfolio level, not by acquired property. Investors can now see that revenue quality is better than a typical roll-up stereotype, but they still cannot see which products carry the mix, how concentrated that mix is, or whether price-led growth is evenly sustainable across the portfolio.
