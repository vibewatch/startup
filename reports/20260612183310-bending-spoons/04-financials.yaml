- id: cash-leverage-and-capital-adequacy
  title: Cash, Leverage, and Capital Adequacy
  body: |-
    The biggest financial tension is not whether Bending Spoons can generate cash from operations; it can. Net operating cash flow rose to $291 million in 2025 and stayed positive at $76 million in Q1 2026. The problem is scale mismatch. Net investing outflows were $1.852 billion in 2025 and $1.648 billion in Q1 2026, dwarfing internal cash generation and making the acquisition engine dependent on debt, equity, or both. That is why the same filing that proves operating strength also proves financing dependence.

    The balance sheet makes that trade-off explicit. As of March 31, 2026, Bending Spoons reported $740.8 million of cash and $4.356 billion of debt including current portion, alongside $5.920 billion of liabilities and only $1.063 billion of equity. Management argues leverage remains prudent because the covenant cap is 4.00x and reported leverage was 2.24x at the end of 2025 and 2.19x at Q1 2026, but public investors still lack the detailed maturity, pricing, and collateral picture needed to test refinancing risk. The most defensible current conclusion is that the base portfolio is cash generative, yet the compounding strategy is still capital-intensive and balance-sheet sensitive, especially if acquisition opportunities arrive before debt markets or IPO proceeds are clearly available on attractive terms.
