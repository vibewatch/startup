  evidenceGaps:
  - type: missing-source
    severity: material
    topic: product-level-segmentation
    missingEvidence: Product-level revenue, gross margin, and cash-flow disclosures for Evernote, Eventbrite, Vimeo, AOL, Remini, and WeTransfer.
    whyItMatters: Underwriting recurring-revenue quality is difficult when the filing reports portfolio-level metrics but not product-level contribution or concentration.
    diligencePath: Request internal segment reporting or board reporting that splits revenue, gross profit, and free cash flow by major acquired property.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Exact maturities, spreads, security package, mandatory amortization, and refinancing triggers for the 2025 debt package.
    whyItMatters: Interest burden is already material, so missing maturity and pricing detail limits confidence on refinancing risk and covenant headroom.
    diligencePath: Review the full credit agreements and lender presentation behind the 2025 term-loan package, then reconcile them to the F-1 capitalization table.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ARPU, discounting, refund rates, and platform-fee net take by product and channel.
    whyItMatters: List pricing pages show monetization architecture but do not show realized net revenue or whether price hikes are durable.
    diligencePath: Ask for cohort-level billing data, plan migration statistics, and channel mix by acquired product.
    relatedQuestionRefs:
    - QI010
    - QI011
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, sales-cycle length, payback, and expansion by motion for enterprise, self-serve, and marketplace surfaces.
    whyItMatters: The filing shows strong revenue and retention, but not whether enterprise expansion and ticketing growth require materially different acquisition costs.
    diligencePath: Request funnel, cohort, and payback metrics by product family and by distribution motion.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: 2025-round-sizing
    missingEvidence: A fully reconciled bridge between the announced $710 million raise, the €612 million adviser disclosure, and the SEC Form D amounts sold.
    whyItMatters: The broad financing picture is directionally clear, but the exact split among equity, secondary, and currency-denominated disclosures remains fuzzy.
    diligencePath: Reconcile the company cap-table update, adviser announcement, and Form D notices with management before relying on one number.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
