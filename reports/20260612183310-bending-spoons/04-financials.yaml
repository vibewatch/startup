tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Current value / status
  - Quality read
  - Diligence ask
  rows:
  - - Portfolio subscriptions
    - Recurring app and software subscriptions across products
    - 84% of Q1 2026 revenue; 93% of 2025 revenue
    - High-quality recurring core, but product mix remains undisclosed
    - Request revenue and gross margin split by major product and billing channel
  - - Advertising
    - Mainly ad-supported surfaces such as AOL and related inventory
    - 12% of Q1 2026 revenue
    - Useful diversification, but structurally less predictable than subscriptions
    - Request ad revenue split by property, advertiser concentration, and seasonality
  - - Other revenue
    - Residual non-subscription, non-ad sources
    - 4% of Q1 2026 revenue
    - Small today, but too aggregated to underwrite as a stable category
    - Break out transaction, services, and other one-time components
  - - Event ticketing & payments
    - Paid-ticket service fees plus payment processing on Eventbrite
    - 3.7% + $1.79 per ticket plus 2.9% per order; Eventbrite Pro starts at $15/month
    - Blend of take-rate and software revenue broadens portfolio monetization
    - Request net take rate, payout float economics, and mix between free and paid events
  - - Enterprise seats & contracts
    - Seat-based or custom contracts for Evernote, Vimeo, and Brightcove-style offerings
    - Evernote Enterprise Flexible from €10/seat/month; Vimeo and Brightcove enterprise pricing mostly custom
    - Supports ACV upside, but realized pricing and logo counts are missing
    - Request seat counts, contract lengths, and gross retention by enterprise surface
  - - App-store subscriptions
    - Self-serve consumer subscriptions such as Remini and StreamYard
    - Remini weekly $9.99 and monthly $9.99; StreamYard free, Core $35/mo, Advanced $68/mo
    - Fast monetization path, but vulnerable to store fees and repricing backlash
    - Request channel mix, refund rates, and net revenue after platform fees
  notes: Rows mix filing-level portfolio revenue buckets with product-specific list-pricing evidence. Exact realized pricing, discounting, and per-product contribution remain undisclosed.
