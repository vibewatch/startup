- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric or disclosure
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Product-level revenue mix by major acquired brand
    - Cannot tell whether the best economics come from a few assets or from the portfolio broadly
    - Request product-level income statements and management reporting for top brands
  - - Gross margin by revenue stream and product
    - Gross-margin quality could differ materially between subscriptions, ads, and payments
    - Request segment gross-margin bridge and direct cost allocation policy
  - - Realized ARPU after discounts and platform fees
    - List pricing does not reveal net monetization or elasticity after price hikes
    - Request billed ARPU, net ARPU, discount cadence, and app-store fee mix by product
  - - CAC, sales cycle, and payback by motion
    - Public revenue growth is not enough to judge efficient scaling across enterprise, creator, and marketplace motions
    - Request funnel and cohort tables for self-serve, inside sales, field sales, and organizer acquisition
  - - Debt maturity, rate, and collateral schedule
    - Interest burden is already significant, so missing debt detail limits valuation confidence
    - Review full lender agreements, hedging schedule, and covenant definitions
  - - Restructuring and integration cost by acquisition
    - Cannot distinguish one-time margin noise from recurring earnings power
    - Request acquisition-by-acquisition integration, severance, and replatforming costs
  - - Cash tax profile and deferred-revenue unwind by property
    - Cash conversion may differ materially from accounting earnings
    - Request cash-tax bridge and deferred-revenue cohort unwind by major product
  notes: These are the highest-value remaining disclosure gaps after the June 2026 filing. None are cosmetic; each could move the underwriting view on quality, leverage, or valuation comfort.
  claimRefs:
  - CI029
  - CI030
  - CI046
  - CI049
  - CI050
