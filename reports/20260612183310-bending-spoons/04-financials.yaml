callouts:
- calloutType: insight
  title: Revenue quality is stronger than the roll-up stereotype
  body: The filing shows a business that is still mostly subscription driven, retains revenue well, and monetizes customers with unusually long tenure. That is a better starting point than the market usually assumes for an acquisition-heavy app portfolio.
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI008
  - CI009
- calloutType: risk
  title: Leverage, not operating burn, is the main financial constraint
  body: The portfolio is cash generative, but debt and interest expense are now large enough that balance-sheet terms matter almost as much as revenue growth. Public underwriting still needs the missing maturity, pricing, and collateral detail before the equity story looks complete.
  claimRefs:
  - CI017
  - CI020
  - CI021
  - CI023
  - CI033
  - CI048
  - CI049
- calloutType: recommendation
  title: Require product-level and debt-term diligence before underwriting the IPO aggressively
  body: The public filing is good enough to support a qualified positive view on revenue quality and margin path, but not good enough to remove segment, pricing, or refinancing uncertainty. The next diligence cycle should focus on debt documents, product contribution, and realized ARPU rather than on topline storytelling.
  claimRefs:
  - CI038
  - CI045
  - CI046
  - CI049
