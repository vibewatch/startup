- id: TI004
  title: Capital adequacy table
  columns:
  - Capital variable
  - Latest public evidence
  - Read-through
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - $740.823M cash and cash equivalents at 2026-03-31
    - Substantial liquidity buffer
    - Supports near-term flexibility, but not enough to self-fund billion-dollar M&A on its own
    - Request unrestricted cash, trapped cash, and minimum-liquidity policy
  - - Debt load
    - $4.356B total debt including current portion at 2026-03-31
    - Leverage is the main financial constraint
    - Debt can absorb operating upside through interest and refinancing risk
    - Request full debt stack, maturities, spreads, and collateral
  - - Operating cash flow
    - $291M in 2025; $76M in Q1 2026
    - Base portfolio is cash generative
    - Shows the assets can throw off cash even before IPO proceeds
    - Provide recurring vs acquisition-related cash-flow bridge
  - - Investing cash flow
    - -$1.852B in 2025; -$1.648B in Q1 2026
    - Acquisition program outruns organic cash generation
    - Confirms continued external financing dependence for roll-up strategy
    - Break out acquisition spend, earn-outs, and maintenance capex
  - - Financing cash flow
    - $1.936B in 2025; $1.741B in Q1 2026
    - Debt and equity remain critical funding sources
    - Shows compounding model still depends on capital-market access
    - Provide source-by-source bridge between debt, equity, and IPO uses
  - - Leverage covenant
    - Maximum 4.00x; reported 2.24x end-2025 and 2.19x Q1 2026
    - Headroom exists, but covenant detail is incomplete
    - Public covenant comfort is better than nothing, but still not maturity-proof
    - Provide lender definitions and step-down schedule
  - - Primary equity raised
    - $549M lifetime by end-Q1 2026; 99% since 2023
    - Management prefers leverage to frequent equity issuance
    - Future dilution may be episodic rather than continuous
    - Provide fully diluted share count and post-IPO pro forma cap table
  - - IPO proceeds plan
    - Price range and explicit use-of-proceeds still undisclosed
    - Public investors cannot yet model deleveraging vs acquisition funding
    - Without a proceeds bridge, valuation and capital-structure scenarios stay wide
    - Disclose targeted raise size, debt paydown, and M&A reserve policy
  notes: The table emphasizes capital adequacy rather than historical fundraising chronology. Operating strength is public; exact debt terms and post-IPO allocation remain the key open constraints.
