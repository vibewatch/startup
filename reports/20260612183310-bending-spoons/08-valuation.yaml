    "number": 8,
    "title": "Valuation",
    "summary": "The evidence supports Bending Spoons as a real recurring-revenue software operator, but the valuation call is highly price-sensitive. The documented late-2025 private marks of roughly $11.0 billion to $11.7 billion look defensible against the current revenue run-rate and mid-band public comps; the rumored ~$20 billion IPO lens moves the company into fair-to-stretched territory unless later amendments show meaningful issuer proceeds, lighter leverage risk, and cleaner segment disclosure."
  },
  "sections": [
    {
      "id": "recommendation-and-price-discipline",
      "title": "Recommendation and Price Discipline",
      "body": "Bending Spoons looks investable as a business before it looks investable at every price. The June 2026 F-1 replaced anecdote with real scale and quality signals: revenue grew to $1.31 billion in 2025, Q1 2026 revenue reached $601 million, subscriptions still accounted for 84% of sales, and the installed base now spans more than 500 million monthly active users and 9 million paying customers. Those facts matter because they show the company is not merely a financial shell rolling assets together; it is monetizing a large, sticky portfolio with real operating leverage. The problem is entry discipline. The late-2025 round at roughly $11.0 billion to $11.7 billion already prices in a high-quality, cash-generative software operator, but it still leaves room for value creation if growth and de-leveraging continue. The rumored ~$20 billion IPO lens is different. At that level the company starts to price like a premium software compounder even though public investors still lack product-level mix, debt-maturity transparency, and certainty that the IPO will materially delever the balance sheet. That combination supports a price-sensitive track or research-more posture rather than a blind quality-first buy call.",
