summary:
  headline: Bending Spoons 确实像一家罕见规模、经常性收入质量也不错的软件复利型公司，但杠杆高、分部披露不完整， 用户信任又反复反噬；在 IPO 文件更完整且定价明确前，合理结论仍是继续研究。
