        title: Exhibits
        blocks:
          - type: callout
            title: >-
              The main question is not whether the company is real; it is whether public buyers get paid for the
              leverage and opacity they still inherit.
            body: >-
              The filing proves Bending Spoons has reached meaningful scale and recurring revenue quality, but it does
              not yet prove that a rumor-level IPO price would leave adequate margin of safety for new investors.
            calloutType: risk
