      - number: '3.2'
        title: Workflow Incumbents, Substitutes, and Pricing Pressure
        blocks:
          - type: paragraph
            body: >-
              The downstream competitive picture is fragmented but legible. Evernote competes against modern
              knowledge-work suites such as Notion plus bundled incumbents such as Microsoft 365 and Google Workspace.
              WeTransfer competes not only with niche send-a-file services but with Dropbox-style storage and admin
              bundles. Vimeo sits between creator video, webinar, and enterprise communications budgets, where Wistia
              and adjacent incumbent suites can undercut or out-specialize it. Eventbrite must defend both ticketing
              economics and discovery against enterprise event stacks such as Cvent, while Meetup Pro now faces
              branded-community platforms such as Circle that sell ownership, APIs, and higher-touch workflow automation
              rather than access to Meetup’s member network.


              The important diligence point is that Bending Spoons increasingly owns assets whose list prices and
              feature ladders overlap with higher-ACV software rather than low-friction utilities. Evernote now sells
              both self-serve and enterprise plans, WeTransfer has explicit Teams and Enterprise offers, Vimeo’s
              enterprise package adds SSO and SCIM, and Eventbrite monetizes through take rates plus paid marketing
              add-ons. That raises upside if Bending Spoons can professionalize packaging across the portfolio, but it
              also increases direct exposure to incumbents with broader bundles, longer procurement histories, and
              stronger default distribution channels.
