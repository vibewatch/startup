  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Indicative value range
      - Return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bear
        - Little deleveraging, limited issuer proceeds, opaque segment mix, and operator-style multiple compression
        - USD 7.5B-10.0B
        - >-
          Below or only barely at the 2025 private mark; public buyers earn weak or negative returns if they enter near
          a $20B rumor
        - Possible if later amendments keep the deal largely secondary and debt-heavy
        - Higher rates, weak cohort evidence, or rising regulatory friction
      - - Base
        - >-
          Revenue remains strong, some IPO proceeds reach the company, and market grants partial software premium
          despite leverage
        - USD 11.0B-15.0B
        - >-
          Supports a hold or selective entry only if pricing lands closer to the late-2025 private mark than to the
          rumor ceiling
        - Most defensible with current evidence set
        - Insufficient primary proceeds or segment data would push this lower
      - - Bull
        - >-
          Later amendments show meaningful primary capital, manageable debt service, and product-level durability that
          justifies a narrower discount to premium software peers
        - USD 17.0B-22.0B
        - Only scenario where a valuation near the rumor ceiling can work without immediate multiple pain
        - Needs evidence not yet public, not just narrative enthusiasm
        - If growth slows or de-leveraging disappoints, the case collapses back to base
      - - Stretch downside
        - IPO priced rich and market later normalizes toward operator comps
        - USD 5.0B-7.0B
        - Shows what happens if public investors pay up before the debt, proceeds, and segment questions are answered
        - Low probability but high consequence
