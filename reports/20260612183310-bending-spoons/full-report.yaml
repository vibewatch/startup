      - number: '1.3'
        title: Capital Formation, Valuation Path, and Public Scale Signals
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons spent much of its life looking bootstrapped relative to its eventual scale, but the public
              funding record is now much richer. Sifted reported that the company’s first external equity financing
              arrived in September 2022, while later sources and the F-1-era coverage map a rapid repricing from a
              February 2024 $155 million round at a $2.55 billion valuation to an October 2025 equity round that raised
              $710 million at an $11 billion pre-money valuation. Sacra and CB Insights both place the late-2025
              valuation band around $11.0 billion to $11.71 billion, and Business Wire confirms the investor roster
              included T. Rowe Price, Baillie Gifford, Cox Enterprises, Durable Capital Partners, Fidelity, and others.


              The June 2026 IPO filing changes the evidence quality again by shifting the conversation from private-mark
              valuation to disclosed operating performance. Fortune’s summary of the filing says 93% of 2025 sales came
              from subscriptions, net revenue retention was 95%, and monthly active users rose from 111 million in
              December 2023 to 500 million in March 2026 while paying customers tripled from 3 million to 9 million.
              Those are unusually strong scale signals for a company still framed by some observers as a
              private-equity-style operator. Still, important gaps remain: the prospectus had not yet fixed a final IPO
              price range, the precise leverage terms behind the 2025 debt package are not public in plain English, and
              the market still lacks a clean product-by-product breakdown of revenue, retention, and acquisition
              economics.
