chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Operating Model, and Portfolio Shape
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons’ identity is clearer in 2026 than it was during most of its private-company life. The SEC
              prospectus says the business was founded in 2013 in Copenhagen, later relocated its headquarters to Milan,
              and now operates primarily as a holding company through subsidiaries. Company-owned surfaces and founder
              interviews describe the same core model: acquire digital businesses with existing product-market fit,
              apply deep operational and technical transformations, and hold the assets for the long term rather than
              flip them. That model helps explain why Bending Spoons looks less like a traditional single-product
              startup and more like a software compounder with centralized operating infrastructure.


              The current portfolio spans creator tools, consumer utilities, and selected enterprise-leaning internet
              brands. On the homepage and LinkedIn page, Bending Spoons highlights Vimeo, Evernote, Remini, WeTransfer,
              Eventbrite, Meetup, Brightcove, StreamYard, and AOL among the better-known holdings. The prospectus and
              independent IPO coverage push the scale story further: by March 2026, the portfolio was serving more than
              500 million monthly active users and more than 9 million monthly paying customers, with over $1.31 billion
              of 2025 revenue. That makes Bending Spoons more than an Italian success story; it is a globally scaled
              portfolio operator whose economic engine depends on recurring subscriptions, centralized tooling, and the
              ability to improve acquired products faster than their prior owners could.
