  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons looks investable as a business before it looks investable at every price. The June 2026 F-1
              replaced anecdote with real scale and quality signals: revenue grew to $1.31 billion in 2025, Q1 2026
              revenue reached $601 million, subscriptions still accounted for 84% of sales, and the installed base now
              spans more than 500 million monthly active users and 9 million paying customers. Those facts matter
              because they show the company is not merely a financial shell rolling assets together; it is monetizing a
              large, sticky portfolio with real operating leverage. The problem is entry discipline. The late-2025 round
              at roughly $11.0 billion to $11.7 billion already prices in a high-quality, cash-generative software
              operator, but it still leaves room for value creation if growth and de-leveraging continue. The rumored
              ~$20 billion IPO lens is different. At that level the company starts to price like a premium software
              compounder even though public investors still lack product-level mix, debt-maturity transparency, and
              certainty that the IPO will materially delever the balance sheet. That combination supports a
              price-sensitive track or research-more posture rather than a blind quality-first buy call.
            claimRefs:
              - CV001
