  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - Evidence
      - Pressure point
      - What would change the view
    rows:
      - - Recurring revenue quality is real
        - A mostly subscription portfolio can support higher multiples than a one-off roll-up
        - 84% of Q1 2026 revenue and 93% of 2025 revenue came from subscriptions
        - Portfolio-level disclosure may mask weak assets
        - Product-level retention and margin data by major brand
      - - Installed-base durability is unusually strong
        - Long-tenured cohorts reduce replacement spend and support repricing
        - 48% of Q1 subscription revenue came from customers with 5+ years of tenure
        - Durability may reflect legacy users who later churn after repricing shocks
        - Cohort retention and downgrade data before and after repricing
      - - Acquisition spread can create value
        - Buying assets cheaply and improving them can justify a portfolio premium
        - Eventbrite, Vimeo, and Brightcove were acquired well below premium-SaaS valuations
        - Spread capture can fail if integration costs or churn overwhelm repricing
        - Post-close cohort, margin, and synergy evidence per asset
      - - Leverage is still the main discount
        - Debt can absorb otherwise attractive software margins
        - The company layered term loans across 2025 and Q1 2026 to fund large deals
        - Covenant compliance alone does not guarantee easy refinancing
        - A reconciled debt deck with maturities, rates, and hedges
      - - IPO structure may not de-risk the balance sheet
        - A mostly secondary offering benefits sellers more than new public investors
        - IPOGrid currently shows selling stockholders only and no issuer proceeds
        - This could change in later amendments
        - Later F-1/A or prospectus showing meaningful primary issuance
      - - Premium-SaaS ceiling is not yet earned
        - AppLovin-style multiples require cleaner disclosure and simpler economics
        - Public comps span ~1x to ~30x revenue, with Bending Spoons lacking AppLovin-grade transparency
        - The market may still pay for growth momentum if the book is strong
        - Roadshow evidence of de-leveraging and segment clarity
    notes: >-
      Arguments are deliberately paired with the conditions that could falsify them. This keeps the valuation call
      evidence-sensitive rather than narrative-driven.
