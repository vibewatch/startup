  - id: TM004
    title: Growth Drivers and Constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication
      - Why it matters to valuation
      - Diligence ask
    rows:
      - - Non-game app monetization leadership
        - Driver
        - Current
        - >-
          The monetization pool is shifting toward Bending Spoons-relevant categories like productivity, video, and AI
          tools
        - Supports a thesis that mature non-game apps can still compound cash flow
        - Bridge category growth to Bending Spoons product mix
      - - Subscription revenue concentration
        - Driver with barbell risk
        - Current
        - Scaled apps and strong operators capture disproportionate gains
        - Favors roll-up strategies that buy known brands, but punishes weak execution
        - Request cohort and renewal quality by asset
      - - Creator and media budget diversification
        - Driver
        - 2026+
        - Brands are allocating more budget to creator-led channels, streaming, and newer media surfaces
        - Can lift willingness to pay for video, creator, and event software
        - Quantify exposure of Vimeo, StreamYard-like, and Eventbrite-like workflows
      - - Enterprise workflow expansion
        - Driver
        - Current to medium term
        - Team and enterprise packaging opens larger budgets than consumer-only plans
        - Can raise ARPU and reduce churn if product quality holds
        - Ask for enterprise seat growth and expansion revenue
      - - App-store fee complexity in the EU
        - Constraint
        - Current
        - Acquisition, services, and install fees can compress margins and complicate pricing decisions
        - Raises platform risk for large subscription operators
        - Model EU gross-to-net revenue after Apple terms
      - - Privacy, payment, and trust fragmentation
        - Constraint
        - Current
        - Sideloading, third-party payments, and fragmented data make conversion and compliance harder
        - Can slow adoption and raise support or fraud costs
        - Audit fraud, refund, and payment-failure rates by channel
      - - Aggressive repricing backlash
        - Constraint
        - Current
        - Short-term monetization gains can coexist with user anger and weaker brand trust
        - May cap long-run retention and multiple expansion
        - Test post-price-hike retention and support burden
      - - Billing recovery and onboarding execution
        - Driver or constraint
        - Current
        - Conversion timing, billing health, and paywall design materially move recurring revenue outcomes
        - Execution quality can matter more than top-of-funnel growth in mature categories
        - Review paywall experiments, trial length, and failed-payment recovery rates
    notes: >-
      Direction reflects whether the factor expands market capture, compresses economics, or does both depending on
      execution quality.
