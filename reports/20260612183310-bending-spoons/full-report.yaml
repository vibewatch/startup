  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Operator Landscape and Competitive Frame
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons should not be benchmarked only against one note app, one file-transfer tool, or one event
              platform. The company now owns a portfolio large enough that it competes first in the market for
              under-optimized digital assets and only second in each product category those assets serve. TechCrunch’s
              IPO coverage shows the scale of that operator thesis: more than 500 million monthly active users, 9
              million paying customers, and over 50 acquisitions across legacy consumer and creator brands. Appfigures’
              post-acquisition analysis adds the mechanism behind the numbers: Bending Spoons repeatedly raises prices,
              simplifies cost structures, and leans on subscription monetization even when download momentum softens.


              The closest public analogs are not exact copies. AppLovin is another scaled software operator, but it
              monetizes through adtech and growth infrastructure rather than through workflow subscriptions. IAC and
              Ziff Davis also show that acquisition-led internet holding companies can compound over time, yet both are
              broader media and internet portfolios rather than app-specific turnaround machines. That means Bending
              Spoons’ competitive field is asymmetric. It competes upstream with other capital allocators for brands,
              but downstream it must still beat Microsoft, Google, Dropbox, Wistia, Cvent, Circle, and others that
              attack the underlying workflows directly.
