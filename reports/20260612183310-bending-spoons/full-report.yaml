companyProfile:
  summary: >-
    Bending Spoons is a Milan-based software operator founded in 2013 in Copenhagen that now owns a portfolio spanning
    Evernote, Vimeo, WeTransfer, Eventbrite, Meetup, StreamYard, Brightcove, Remini, and other digital products. Its
    model is to acquire established software assets, centralize operating and technical improvements, and compound
    monetization over long holding periods rather than building around a single flagship product. The June 2026 F-1
    shows the model has reached unusual scale — $1.306 billion of 2025 revenue, more than 500 million monthly active
    users, more than 9 million paying customers, mostly subscription revenue, and positive operating cash flow — but the
    same filing leaves investors with meaningful diligence gaps on leverage, segment economics, and how durable the
    post-acquisition monetization playbook will be.
