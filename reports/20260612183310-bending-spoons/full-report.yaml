  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and payer map
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons does not have one customer base. The retained 2026 public evidence shows a portfolio that
              mixes consumer subscriptions, marketplace buyers and sellers, community administrators, creator tools, and
              enterprise software buyers. Vimeo is the cleanest published segmentation example: the company explicitly
              says it serves individual customers, enterprise companies, and OTT sellers, then gives each group a
              separate roadmap. Evernote likewise separates free and self-serve paid users from a custom enterprise tier
              with security, administration, and customer-success layers. Eventbrite is even more structurally split:
              organizers publish and market events, attendees discover and buy, and the default fee payer is the ticket
              buyer rather than the organizer. Meetup has a similar two-sided structure, with organizers paying to run
              groups while members can also buy their own subscriptions inside the consumer app. StreamYard and Remini
              skew more self-serve, but even there the public surfaces point to a distinction between individual
              creators and business or organizational buyers. That variety is a strength for portfolio breadth, but it
