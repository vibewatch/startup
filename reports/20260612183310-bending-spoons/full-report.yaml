  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Why it breaks the thesis
      - Transmission to value
      - Action implication
    rows:
      - - IPO remains mostly secondary
        - Issuer receives little or no primary capital
        - Public buyers do not get the de-leveraging they may assume
        - Equity value stays more exposed to debt and refinancing than the headline growth story suggests
        - Reprice lower or avoid the deal
      - - Debt deck reveals harsher terms than implied
        - Maturity stack, pricing, or hedging creates thinner equity cushion
        - Leverage discount deserves to widen, not narrow
        - Higher interest or refinancing risk compresses supportable multiples
        - Cut value range and raise required return
      - - Product-level cohort data disappoints
        - Major assets show weak retention after repricing or integration
        - Portfolio quality is weaker than the aggregate revenue line implies
        - Base-case multiple falls toward operator comps
        - Move from track to avoid unless price resets
      - - Regulatory or platform friction rises
        - Billing, app-store, privacy, or refund rules hit monetization
        - Repricing and conversion engines become less reliable
        - Margin and cash-conversion assumptions weaken simultaneously
        - Treat this as a scenario-downshift to bear
      - - Roadshow price range clears near rumor ceiling without offsetting disclosure
        - Marketing asks investors to pay premium-software pricing on incomplete evidence
        - Margin of safety disappears at entry
        - Even good execution may only justify fair value rather than upside
        - Pass or wait for aftermarket reset
    notes: >-
      These triggers are designed to be monitorable in later amendments, lender materials, and post-IPO disclosures.
      Each one directly changes supportable entry price, not just sentiment.
    claimRefs:
      - CV007
      - CV034
      - CV035
