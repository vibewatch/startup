      - number: '4.2'
        title: Margin Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Profitability is real, but it is not as simple as saying Bending Spoons is a high-margin software company.
              The filing shows gross profit of $857.3 million in 2025 and an estimated 65.6% gross margin, improving
              again to an estimated 67.9% in Q1 2026. Operating income reached $277.9 million in 2025 and $120.2 million
              in Q1 2026, while sales and marketing remained only about a tenth of revenue. Those are strong signs that
              the business can monetize a sticky installed base without funding a classic venture burn machine.


              At the same time, the unit-economics bridge does not end at operating profit. Interest expense reached
              $142.6 million in 2025 and $93.2 million in Q1 2026 alone, which is high enough to absorb a meaningful
              share of otherwise attractive software margins. The filing also frames revenue durability as a function of
              monetization initiatives, which matches Appfigures and TechCrunch reporting that Bending Spoons often
              tightens pricing and cost structures after acquisitions. In practical diligence terms, the public evidence
              supports a business with solid gross margins, strong retention, and relatively low sales intensity, but
              not yet one with enough product-level disclosure to underwrite normalized lifetime value, CAC payback, or
              margin durability brand by brand.
