      - number: '6.2'
        title: Adoption trajectory and named proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence sits with Eventbrite, Meetup, Evernote, Remini, and Vimeo.
              Eventbrite discloses the clearest marketplace scale in the retained set: 270 million tickets, 89 million
              monthly users, and 4.7 million events, reinforced by a 4.9 iOS rating from 1.7 million ratings. Meetup’s
              app claims 60 million members, 100,000 events per week, and 330,000 groups, plus 273,000 iOS ratings.
              Evernote still shows 76,000 iOS ratings even after product tightening, while Remini claims 100 million
              monthly active users, 15 million monthly downloads, and 5 billion enhanced photos or videos, backed by
              345,000 iOS ratings. Named customer proof is more uneven. Vimeo Enterprise has the best quantified case in
              this run through Garver’s 60 offices, 1.3 thousand-plus employees, and reported engagement gains.
              StreamYard offers named creator and business testimonials, and Eventbrite publishes organizer quotes with
              specific conversion and follower benefits. Evernote’s enterprise page is useful but mostly logo-based
              rather than outcome-based. The net read is that adoption is real, but proof quality differs sharply by
              brand.
