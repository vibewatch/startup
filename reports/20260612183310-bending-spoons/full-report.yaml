      - number: '6.3'
        title: Retention proxies and backlash
        blocks:
          - type: paragraph
            body: >-
              Public durability evidence is proxy-heavy rather than contract-grade. Vimeo offers the cleanest
              operational proxy because it says more than 50 customer interviews shaped the next six months of
              Enterprise and OTT priorities, and its enterprise page ties video to conversions, training compliance, and
              customer-success metrics. Eventbrite’s organizer feature set—automated reminders, mobile check-in,
              marketing tools, and support—also looks built for repeat organizer use. Evernote’s trial structure and
              monthly or annual plan choices make conversion mechanics visible, while StreamYard and Remini clearly run
              recurring subscriptions with straightforward auto-renew and cancellation mechanics. But none of the
              retained sources disclose NRR, GRR, churn, contract length, or cohort retention. That gap matters more
              because adverse sources show backlash is real. TechCrunch and PetaPixel both describe an acquisition
              playbook that includes pricing changes, feature resets, and subscription optimization, and PetaPixel
              reports that some renewing users were pushed toward stripped-down plans. Strong app-store ratings for
              Eventbrite, Meetup, and Remini do not erase that risk; they only show that sentiment is uneven rather than
              universally negative.
