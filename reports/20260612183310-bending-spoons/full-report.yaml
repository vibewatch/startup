          holders
        - Read the first F-1/A and request underwriting materials
        - 'Yes'
      - - Cap table and preference stack
        - 2025 round terms, liquidation preferences, registration rights, and lockups
        - Determines true common-equity downside and any near-term overhang
        - Request cap-table waterfall from counsel or lead banks
        - 'Yes'
      - - Product-level segment pack
        - Revenue, gross margin, retention, churn, and cash contribution by major product
        - Separates the strongest assets from the weaker ones and tests whether repricing is durable
        - Request management bridge by asset and cohort
        - 'Yes'
      - - Debt and hedge schedule
        - Maturities, covenants, pricing, amortization, and hedge coverage by facility
        - Leverage is the main valuation discount and must be modeled precisely
        - Request lender deck and treasury summary
        - 'Yes'
      - - Expanded comparable set
        - Paid banker or private-market comp sheets for software roll-ups and recent take-privates
        - Improves price discipline around the final offer range
        - Supplement the public set with institutional datasets before IC sign-off
        - 'No'
    notes: >-
      These are the highest-value open asks for moving from a track call to an underwritten pricing decision. The first
      four are genuinely blocking for a buy recommendation.
