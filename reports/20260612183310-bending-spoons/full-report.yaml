      - number: '8.4'
        title: Diligence Gates and Thesis Breakers
        blocks:
          - type: paragraph
            body: >-
              The final valuation decision should hinge on diligence that directly answers the current blind spots, not
              on whether the company is generally impressive. Three questions matter most. First, who actually receives
              the IPO proceeds? IPOGrid currently frames the filing as selling-stockholder-only with no issuer proceeds,
              and if that survives into later amendments, outside investors may be funding liquidity without shrinking
              leverage. Second, how concentrated is the good part of the portfolio? Investors still need product-level
              revenue, margin, and churn to know whether the strongest brands are carrying weaker ones. Third, how
              demanding is the debt stack after the January 2026 financing surge? The F-1 shows leverage is inside
              covenant, but covenant headroom is not the same thing as comfortable equity value. These diligence asks
              also define the thesis-breakers. If later amendments show heavy secondary selling, limited deleveraging,
              deteriorating retention after repricing, or debt terms that absorb more equity value than expected, the
              valuation case should be rebased. If later amendments instead show meaningful primary proceeds, stable
              cohort behavior, and credible segment disclosure, the recommendation can move from track toward buy at the
              right price.
            claimRefs:
              - CV007
              - CV008
              - CV034
              - CV039
              - CV040
              - CV043
              - CV044
              - CV045
