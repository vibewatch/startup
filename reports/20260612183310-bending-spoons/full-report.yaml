  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital, platform, and model risk
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons’ core risk is that its operating playbook still depends on a capital structure and
              distribution stack that it does not fully control. The June 2026 F-1 makes clear that acquisitions remain
              the priority, that additional financing may still be needed, and that indebtedness can restrict
              flexibility, force refinancing, or crowd out future investment. This is not just a balance-sheet concern.
              A business that gets 84% of Q1 2026 revenue from subscriptions and relies on app stores, search, ads, and
              third-party payment systems can see the same external change hit conversion, renewals, refunds,
              commissions, and ad yield at once. Apple’s own subscription economics and review rules reinforce that
              these third-party platforms have real pricing and approval power. The model is diversified across products
              and not dependent on one large customer, but it is still structurally exposed to leverage, platform fees,
              and policy changes that can compress margins faster than topline summaries suggest.
            claimRefs:
