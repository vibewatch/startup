              its ownership. WeTransfer’s 2026 update feed adds contact groups, upload recovery, preview feedback,
              restricted transfers, and anti-malware scanning. Remini’s app-store listings show AI enhancement as the
              core workflow and same-day update activity. The net read is that Bending Spoons is not starving these
              products of shipping activity; the sharper diligence question is whether the publicly visible cadence is
