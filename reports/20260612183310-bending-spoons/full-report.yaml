      - number: '8.2'
        title: Valuation Anchors and Comparable Lenses
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame valuation is to triangulate between private marks, public comps, and Bending
              Spoons’ own transaction behavior. On the private side, the October 2025 financing set a documented floor
              around $11 billion and market-data sources push the mark closer to $11.7 billion. On the public side, the
              comp set is wide rather than tidy: AppLovin trades on a dramatically richer multiple because it combines
              scale, growth, and a lighter balance-sheet story; Braze and DoubleVerify sit in a middle band of
              low-to-mid single-digit revenue multiples; Ziff Davis and IAC show how acquisition-led or holding-company
              software assets can clear at low-single-digit levels when growth and simplicity are weaker. Bending Spoons
              itself buys mature internet and software properties at much lower prices than the multiple implied by a
              $20 billion IPO rumor. Eventbrite sold for about $500 million, Vimeo for $1.38 billion, and Brightcove for
              $233 million. Those deals do not prove Bending Spoons deserves only distressed-asset multiples, because
              the platform can arguably create spread through integration and repricing. They do, however, make it
              harder to underwrite a premium SaaS-style multiple without a stronger disclosure package and clearer
              de-leveraging path.
            claimRefs:
