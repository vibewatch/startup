- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: Discovery and activation are well evidenced, but the public record thins out rapidly after first purchase or first deployment.
  data:
    nodes:
    - id: discover
      label: Discover
      description: Users encounter a specific product through marketplaces, app stores, or a well-known brand surface.
    - id: evaluate
      label: Evaluate
      description: Pricing tiers, feature pages, and product copy explain the fit for attendees, organizers, creators, enterprises, or consumers.
    - id: purchase
      label: Purchase / subscribe
      description: Activation can be a ticket purchase, recurring plan, organizer subscription, or enterprise contact-sales motion.
    - id: deploy
      label: Deploy / use
      description: Real use shows up through Garver on Vimeo, organizer quotes on Eventbrite, creator testimonials on StreamYard, and heavy app-store footprints.
    - id: expand
      label: Expand
      description: Official pages show plan ladders and cross-segment upsell opportunities across Vimeo, Evernote, Eventbrite, Meetup, StreamYard, and Remini.
    - id: retain
      label: Retain or churn
      description: 'This is where the evidence weakens: public sources rarely disclose renewals, NRR, GRR, or top-customer exposure.'
