tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - Vimeo creators / self-serve customers
    - Buyer=user=payer in most self-serve plans
    - Host, review, publish, and monetize video content
    - Three explicit customer groups on 2026 roadmap; standard-to-enterprise pricing ladder
    - Creator base anchors brand reach and feeds OTT upsell
    - No public renewal or ARPU split by creator cohort
  - - Vimeo Enterprise buyers
    - Buyer=company admin or budget owner; users=employees and distributed teams
    - Internal comms, training, compliance, branded business video
    - Garver case with 60 offices and 1.3K+ employees; enterprise features centered on SSO and admin controls
    - Best current enterprise proof in retained set
    - Only one quantified case in this retained corpus
  - - Eventbrite organizers + attendees
    - Buyer can be organizer or attendee; default fee payer is attendee on paid events
    - List, market, discover, book, and manage live events
    - 270M tickets, 89M monthly users, 4.7M events, 1.7M iOS ratings
    - Two-sided marketplace with clear monetization levers
    - No disclosed organizer retention or enterprise revenue split
  - - Meetup organizers + members
    - Buyer can be organizer or member; users are group members and attendees
    - Run recurring communities, host events, and maintain group discussions
    - 60M members, 100K weekly events, 330K groups, 273K iOS ratings
    - Community network effects can create stickiness
    - No public cohort retention or Pro customer concentration
  - - Evernote individuals + enterprise teams
    - Buyer can be individual subscriber or enterprise procurement owner
    - Capture, organize, search, and share notes, tasks, calendars, and docs
    - 76K iOS ratings plus enterprise tier and 250K business-professional claim
    - Bridges consumer productivity and org collaboration
    - Enterprise proof is heavy on logos and light on outcomes
  - - StreamYard creators / Remini consumers
    - Mostly buyer=user=payer, with some business buyer overlays
    - Live streaming for creators or AI enhancement for photos and videos
    - Named StreamYard testimonials; Remini claims 100M MAU and 345K iOS ratings
    - Large self-serve reach can monetize quickly through subscriptions
    - Named enterprise deployments are much thinner than consumer proof
  notes: Mixes company segmentation, marketplace structure, and storefront proof. Gaps are genuine public-data limits rather than omitted analysis.
