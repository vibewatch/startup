- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Eventbrite marketplace to Pro and custom sales
    - Large-organizer concentration is undisclosed
    - Could lift ARPU materially if large recurring events stay on-platform
    - Request organizer revenue split, top-account share, and retention by event size
  - - Vimeo standard to Enterprise to OTT ladder
    - Enterprise logo concentration and OTT contract size are undisclosed
    - Enterprise and OTT can deepen monetization far beyond self-serve plans
    - Request enterprise ARR mix, OTT logo count, and top-customer concentration
  - - Evernote free to Starter to Advanced to Enterprise
    - Portfolio may depend on squeezing a mature base rather than net-new logos
    - Expansion ladder is visible, but churn sensitivity after pricing changes is unknown
    - Request plan-mix migration, enterprise seat growth, and cancellation reasons
  - - Meetup organizer subscription to Pro network
    - Brand community programs may be concentrated in a small set of large networks
    - Could create sticky B2B revenue but also concentrated exposure
    - Request Pro customer count, seat or group count, and renewal history
  - - StreamYard free to paid creator plans to business motion
    - Creator subscriptions may churn quickly when workflows pause
    - Clear upsell exists but is likely more consumer-like than contractually locked
    - Request creator retention by billing term and business-pipeline conversion
  - - Remini free / ads to premium recurring plans
    - Heavy consumer scale may hide dependence on mobile-store distribution and renewals
    - Large audience can monetize quickly, but concentration by channel is unknown
    - Request platform revenue mix, ad versus subscription split, and refund rate
  notes: Expansion mechanics are visible in product packaging and sales motion, but concentration is almost entirely private evidence today.
  claimRefs:
  - CU038
  - CU039
  - CU040
  - CU041
  - CU042
  - CU043
  - CU044
- id: TU006
  title: Backlash / coverage-gap snapshot
  columns:
  - Brand / surface
  - Positive signal
  - Adverse or missing signal
  - What it likely means
  - Primary gap
  rows:
  - - Vimeo
    - Clear segmentation, quantified Garver case, and explicit customer-interview loop
    - No public renewal or concentration data despite enterprise posture
    - Best current enterprise proof in the portfolio, but still incomplete for underwriting
    - Need enterprise NRR, logo count, and contract-size distribution
  - - Eventbrite
    - Massive marketplace metrics, organizer testimonials, and very strong iOS ratings
    - No disclosed organizer retention, and enterprise-page discovery was weak in this run
    - Two-sided adoption is real, but durability still relies on proxies
    - Need repeat organizer frequency and revenue concentration by large events
  - - Evernote
    - Visible enterprise tier, business logos, and meaningful storefront footprint
    - Adverse coverage links the playbook to feature and free-tier tightening
    - Customer base likely remains large, but backlash risk is more visible here than on Eventbrite or Meetup
    - Need churn by plan after repricing or feature resets
  - - StreamYard
    - Named creator testimonials and transparent recurring-plan mechanics
    - Proof is mostly testimonial rather than deployment or contract evidence
    - Useful creator and SMB motion, but enterprise proof is thin
    - Need business logo list, renewal rates, and segment-level revenue
  - - Remini / Brightcove / WeTransfer gap
    - Remini has scale claims and strong ratings; Brightcove and WeTransfer remain recognized portfolio brands
    - Named current enterprise deployments were thin or unreadable in the retained public set for this chapter
    - Coverage is broad enough to map the portfolio, not broad enough to validate every brand equally
    - Need current customer stories, contract examples, and concentration data for thinner-covered brands
  notes: This table separates real customer proof from public-data blind spots. It is intentionally qualitative because the missing metrics are themselves the underwriting issue.
