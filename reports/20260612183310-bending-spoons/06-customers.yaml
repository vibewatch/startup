- id: expansion-concentration-and-underwriting-gaps
  title: Expansion, concentration, and underwriting gaps
  body: 'The customer model is underwritten more by visible expansion ladders than by disclosed concentration data. Eventbrite expands from free publishing into paid-ticket fees, Pro plans, marketing add-ons, and custom sales support for larger events. Vimeo can move customers from standard plans to enterprise governance and on to OTT capabilities. Evernote expands from free to Starter to Advanced to Enterprise, while Meetup can climb from single-organizer subscriptions into Pro network deployments. StreamYard and Remini both have clear recurring monetization ladders too. The problem is that public evidence stops before the investor-grade questions. No retained source shows top-customer share, channel concentration, contract length, or product-level churn. Proof is also uneven across the portfolio: Vimeo looks strongest, Eventbrite and StreamYard are decent, and Evernote, Brightcove, WeTransfer, and Remini are thinner when the bar is current named production deployment rather than logos
    or broad testimonials. That leaves the chapter with a constructive read on adoption breadth and monetization design, but only a partial read on durability and concentration.'
