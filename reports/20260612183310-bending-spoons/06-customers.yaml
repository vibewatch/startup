company:
  name: Bending Spoons
chapter:
  number: 6
  title: Customers
  summary: 'Bending Spoons has credible public customer breadth across self-serve apps, marketplaces, creator tools, and enterprise video, with the best current proof coming from Eventbrite scale disclosures, Vimeo Enterprise customer evidence, and large storefront footprints for Eventbrite, Meetup, Evernote, and Remini. The underwriting gap is not adoption but durability: public sources still do not disclose brand-level retention, concentration, or contract depth, and adverse reporting suggests aggressive pricing changes can create real backlash.'
sections:
- id: customer-segmentation-and-payer-map
  title: Customer segmentation and payer map
  body: 'Bending Spoons does not have one customer base. The retained 2026 public evidence shows a portfolio that mixes consumer subscriptions, marketplace buyers and sellers, community administrators, creator tools, and enterprise software buyers. Vimeo is the cleanest published segmentation example: the company explicitly says it serves individual customers, enterprise companies, and OTT sellers, then gives each group a separate roadmap. Evernote likewise separates free and self-serve paid users from a custom enterprise tier with security, administration, and customer-success layers. Eventbrite is even more structurally split: organizers publish and market events, attendees discover and buy, and the default fee payer is the ticket buyer rather than the organizer. Meetup has a similar two-sided structure, with organizers paying to run groups while members can also buy their own subscriptions inside the consumer app. StreamYard and Remini skew more self-serve, but even there the public surfaces
    point to a distinction between individual creators and business or organizational buyers. That variety is a strength for portfolio breadth, but it also means customer quality cannot be underwritten from one brand alone.'
