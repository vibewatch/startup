  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Brand-level GRR, NRR, churn, cancellation, refund, and contract-length data for Vimeo, Eventbrite, Evernote, Meetup, StreamYard, and Remini.
    whyItMatters: The chapter can show adoption and pricing ladders, but cannot underwrite durability or payback without true retention metrics.
    diligencePath: Request cohort tables and renewal dashboards from management, segmented by product, channel, and plan tier.
    relatedQuestionRefs:
    - QU016
    - QU026
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-organizer, and channel concentration by brand, including enterprise logo concentration and large-event exposure.
    whyItMatters: Public evidence does not show whether a small number of enterprise contracts, organizer accounts, or mobile channels drive disproportionate revenue.
    diligencePath: Request top-10 customer or account share, top-channel share, and revenue mix by product line.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: proof-quality-gaps
    missingEvidence: Current named production customer stories for Brightcove, WeTransfer, and business-oriented Remini deployments under Bending Spoons ownership.
    whyItMatters: Portfolio-level breadth is clear, but the current public customer-proof set is uneven and may overstate confidence if the thinner brands are assumed equivalent to Vimeo or Eventbrite.
    diligencePath: Collect current customer references, case studies, renewal references, or procurement records for thinner-covered brands.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU003
    - TU006
  - type: conflicting-data
    severity: minor
    topic: portfolio-scale-drift
    missingEvidence: A reconciled company explanation for why early-2026 public coverage cites different aggregate monthly-active-user and paying-customer counts than June IPO coverage.
    whyItMatters: The drift does not change the conclusion that scale is large, but it does reduce precision when using top-line portfolio counts as underwriting inputs.
    diligencePath: Ask management to reconcile 2026 portfolio MAU and paying-customer counts across press, prospectus, and product-level reporting.
    relatedQuestionRefs:
    - QU005
  - type: stale
    severity: minor
    topic: logo-vs-deployment-proof
    missingEvidence: Time-stamped confirmation that public logos on enterprise pages still correspond to current active customers, not historical references.
    whyItMatters: Logo walls are easy to over-read; current deployment proof is much stronger than legacy brand association.
    diligencePath: Request logo recency dates, current account status, and short outcome summaries for each referenced enterprise customer.
    relatedQuestionRefs:
    - QU013
    - QU014
