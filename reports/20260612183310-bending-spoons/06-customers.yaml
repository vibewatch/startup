- id: TU003
  title: Named customer proof table
  columns:
  - Customer / public proof
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / public signal
  - Limitation
  rows:
  - - Garver / Darla Yarbrough
    - Vimeo Enterprise business customer
    - Daily video across 60 offices and 1.3K+ employees
    - Production / long-running deployment
    - 10+ years of video use and reported significant boost in team engagement
    - Only one quantified enterprise case in retained set
  - - Something Dope for the People organizer quote
    - Eventbrite event organizer
    - Uses Eventbrite for discoverability, marketing, and ticket conversion
    - Production / recurring events implied
    - Quote says conversion was 20% better than other platforms and follower growth improved
    - Quote is short and economics are not independently audited
  - - B Live Media TV / Bridgetti Lim Banda
    - StreamYard business creator
    - Runs talk-show style live broadcasts and values flawless execution
    - Production / repeated broadcast use
    - Named executive producer attributes reliable show delivery to StreamYard
    - Testimonial is promotional and does not disclose spend or contract length
  - - Pace Morby / Chris Brogan
    - StreamYard professional creators
    - Use StreamYard in business and host workflows
    - Production / repeated use
    - Named users describe StreamYard as a core business tool and a dependable show-in-a-box workflow
    - Outcome is qualitative rather than quantitative
  - - Evernote Enterprise logo wall
    - Evernote organizational buyers
    - Public logos include Columbia, UC Berkeley, Red Bull, Sequoia, and BlackRock
    - Likely production, but proof is only logo-level
    - Shows enterprise reach into education, consumer brands, finance, and venture
    - Logos alone do not prove current deployment scale, spend, or retention
  notes: This is a sample of public customer proof, not an exhaustive census. Rows mix quantified case studies, named testimonials, and weaker logo evidence to show proof quality dispersion.
