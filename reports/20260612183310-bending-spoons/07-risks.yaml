- id: regulatory-privacy-and-legal-exposure
  title: Regulatory, privacy, and legal exposure
  body: 'The filing’s legal risk language is stronger than a generic tech disclaimer because it ties together consumer-protection, privacy, intermediary-liability, antitrust, and litigation exposure across a portfolio with many different product types. Bending Spoons explicitly says that free trials, automatic renewals, billing disclosures, refunds, and cancellation flows are under increasing regulatory and plaintiff scrutiny, and that failure or alleged failure can lead to investigations, class actions, restitution, injunctions, and required changes to paywalls or subscription flows. The same filing says the company has already faced VPPA, ECPA, CIPA, and BIPA claims tied to some websites. Product-level legal pages reinforce how broad the compliance perimeter is: Eventbrite, Meetup, Vimeo, and Evernote all run recurring billing, collect sensitive user data, or operate user-generated or community features that raise moderation, privacy, and dispute-resolution obligations. The DSA makes the
    EU side of that burden more concrete, especially for moderation, age safeguards, ad transparency, and dark-pattern restrictions.'
  claimRefs:
  - CR010
  - CR011
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR027
