  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Regulatory / legal risk register coverage
    missingEvidence: A current product-by-product docket of active claims, arbitration matters, regulator correspondence, and settlement reserves across the portfolio.
    whyItMatters: The filing names risk classes and some existing claim categories, but investors still cannot tell which products carry the highest live legal cost or timing risk.
    diligencePath: Request outside-counsel summaries, litigation reserve schedules, insurance notices, and regulator inquiry logs by product and jurisdiction.
    relatedQuestionRefs:
    - QR009
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: Debt maturity and refinancing calendar
    missingEvidence: Instrument-level debt maturities, lender concentration, interest resets, and refinancing sequencing after the IPO.
    whyItMatters: Residual leverage severity depends on when major tranches mature and how much covenant headroom survives if markets tighten.
    diligencePath: Request debt agreements, maturity ladder, covenant model, hedging schedule, and management refinance plan by quarter.
    relatedQuestionRefs:
    - QR024
  - type: missing-source
    severity: material
    topic: Product-level churn after repricing
    missingEvidence: Cohort retention, refund rates, cancellation reasons, and review-volume trends for Evernote, WeTransfer, Meetup, and other repriced products.
    whyItMatters: The public evidence shows backlash and some revenue gains, but it does not show whether pricing changes create durable cash flow or delayed churn.
    diligencePath: Request subscription cohorts, gross and net retention, refund rates, support backlog, and rating trends before and after major pricing or free-tier changes.
    relatedQuestionRefs:
    - QR023
    - QR030
  - type: missing-source
    severity: minor
    topic: Platform fee mix by product
    missingEvidence: Current mix of revenue billed through Apple, Google, web, direct sales, payment processors, and ad intermediaries for each major product.
    whyItMatters: Without channel mix, investors cannot quantify how much margin or renewal risk sits on each external platform rule change.
    diligencePath: Request channel-level revenue mix, take-rate assumptions, refund responsibility map, and direct-billing migration options by product.
    relatedQuestionRefs:
    - QR030
