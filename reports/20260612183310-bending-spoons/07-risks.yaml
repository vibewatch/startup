- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Leverage / refinancing
    - Debt service flexibility
    - Refinancing delayed, costs step up materially, or leverage fails to trend down after IPO proceeds.
    - Pause underwriting until debt ladder, covenants, and lender concentration are fully reworked.
  - - Platform dependence
    - App-store or platform enforcement
    - Material approval delays, product removals, refund-policy disputes, or worse commission economics on a core app.
    - Re-cut margin and growth assumptions by affected product; test web or direct-billing alternatives.
  - - Privacy / legal exposure
    - Named claims or regulator actions
    - New VPPA, CIPA, BIPA, DSA, or consumer-protection action on a scaled product.
    - Move risk rating up one notch unless reserve, remediation, and scope are clearly bounded.
  - - Customer backlash / churn
    - Sentiment and renewal deterioration
    - Sharp drop in ratings, visible complaint spikes, refund growth, or management acknowledges higher churn after repricing.
    - Treat monetization upside as temporary until cohorts stabilize.
  - - Integration reliability
    - Migration or product delivery slips
    - Repeated outages, delayed roadmap milestones, or prolonged support backlogs after a large acquisition.
    - Reduce confidence in acquisition-return assumptions and slow expected synergy timing.
  - - Key-person / control risk
    - Leadership change or control conflict
    - Unexpected founder or top operator departure, or governance dispute around post-IPO priorities.
    - Reassess whether the operating playbook is durable beyond the founding control group.
  notes: These are monitorable underwriting triggers rather than exhaustive operating KPIs. They are designed to convert qualitative risk into explicit follow-up actions.
