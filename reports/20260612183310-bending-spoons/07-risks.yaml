  rows:
  - - Subscription and dark-pattern enforcement
    - U.S., EU, UK, app-store billing flows
    - F-1 says automatic renewals, refunds, disclosures, and cancellation flows face rising regulator and plaintiff scrutiny; Apple subscription rules and product terms confirm recurring-billing dependence.
    - High
    - High
    - Legal pages and product terms exist, but public proof of cancellation-flow quality is thin.
    - Request product-level renewal funnels, cancellation UX, complaint volumes, refund rates, and outside-counsel memos by major app.
  - - Privacy, cookies, biometric, and cross-border data claims
    - Global web and app data processing
    - F-1 cites GDPR, CCPA, VPPA, ECPA, CIPA, and BIPA exposure; Evernote, Vimeo, Meetup, and Eventbrite legal pages show broad personal-data handling and AI or tracking surfaces.
    - High
    - High
    - Privacy policies and security controls are public, including Evernote ISO 27001 and MFA.
    - Request open claims list, regulatory correspondence, DPIA summaries, vendor map, and consent-logging controls by product.
  - - Intermediary liability, DSA, and moderation obligations
    - EU user-content and community products
    - F-1 warns about evolving intermediary-liability law; DSA overview and Meetup terms show appeals, moderation, transparency, and age-safeguard burdens.
    - Medium
    - Medium-High
    - Existing legal pages reference DSA obligations, but product-by-product enforcement readiness is not public.
    - Request DSA compliance owners, moderation SLAs, appeals metrics, trusted-flagger process, and geography-specific product restrictions.
  - - Deal-related litigation and merger review
    - Public-company acquisitions and future M&A
    - F-1 says public-company acquisitions can trigger shareholder suits and regulatory scrutiny; Eventbrite, Vimeo, and Brightcove releases all show approval gates and legal-adviser involvement.
    - Medium
    - Medium-High
    - Bending Spoons has repeatedly closed deals, but each large public target adds new approval and disclosure burden.
    - Request post-close claims history, antitrust timelines, pending investigations, and standard remedy thresholds for future deals.
  - - IP and product claims
    - Portfolio-wide software, media, AI, and UGC surfaces
    - F-1 warns of IP disputes, DMCA safe-harbor exposure, and litigation around technology and content use.
    - Medium
    - Medium
    - Existing terms and policies help, but public clearance and indemnity detail is limited.
    - Request top pending IP matters, indemnity caps, open-source audits, and AI-training rights review for each major product.
