company:
  name: Bending Spoons
chapter:
  number: 7
  title: Risks
  summary: Bending Spoons’ risks are concentrated where leverage, platform dependence, regulatory scrutiny, and repeated post-acquisition change interact rather than in any single product anomaly. Public evidence shows real mitigations—strong recurring revenue, diversified brands, and some mature security practices—but it also shows that refinancing pressure, app-store and billing dependency, customer backlash after repricing, and legal or privacy complexity can all hit the same cash-flow engine at once.
sections:
- id: capital-platform-and-model-risk
  title: Capital, platform, and model risk
  body: Bending Spoons’ core risk is that its operating playbook still depends on a capital structure and distribution stack that it does not fully control. The June 2026 F-1 makes clear that acquisitions remain the priority, that additional financing may still be needed, and that indebtedness can restrict flexibility, force refinancing, or crowd out future investment. This is not just a balance-sheet concern. A business that gets 84% of Q1 2026 revenue from subscriptions and relies on app stores, search, ads, and third-party payment systems can see the same external change hit conversion, renewals, refunds, commissions, and ad yield at once. Apple’s own subscription economics and review rules reinforce that these third-party platforms have real pricing and approval power. The model is diversified across products and not dependent on one large customer, but it is still structurally exposed to leverage, platform fees, and policy changes that can compress margins faster than topline summaries
    suggest.
  claimRefs:
  - CR001
  - CR005
  - CR006
  - CR007
  - CR012
  - CR013
  - CR014
  - CR015
