  claims:
  - id: CR001
    statement: The highest-residual risks visible in public evidence are leverage and refinancing risk, platform and billing dependence, acquisition-integration execution, subscription-law and privacy compliance, and customer backlash after monetization changes.
    type: inferred
    topic: top-risks
    sourceRefs:
    - SR001
    - SR003
    - SR009
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR003
  - id: CR002
    statement: Bending Spoons says acquisitions will remain its priority for the foreseeable future, and the filing states that sourcing, diligencing, and integrating deals can divert leadership attention and consume significant time and resources.
    type: company-claimed
    topic: acquisition-execution
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: The filing warns that inaccurate pre-acquisition forecasts can lead Bending Spoons to overpay, miss expected returns, incur impairments, or divert leadership attention from other opportunities.
    type: company-claimed
    topic: acquisition-execution
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
  - id: CR004
    statement: The F-1 says post-acquisition changes can include rewriting software, redesigning interfaces, accelerating product development, and restructuring organizations, and that those changes can introduce defects, performance issues, or downtime that hurt retention and ratings.
    type: company-claimed
    topic: integration-reliability
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR011
    - QR014
    - QR020
  - id: CR005
    statement: Bending Spoons discloses that it may need additional capital to support operations, growth strategy, and acquisitions, and that unavailable or expensive financing could force delays or cancellations of investment.
    type: company-claimed
    topic: capital-needs
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR021
  - id: CR006
    statement: The filing says existing and future indebtedness can restrict operating flexibility, that covenant breaches could accelerate debt, and that an inability to refinance could force expenditure cuts, forgone acquisitions, or asset sales.
    type: company-claimed
    topic: leverage-refinancing
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR021
    - QR024
  - id: CR007
    statement: The F-1 states that higher interest rates can raise debt service, increase refinancing costs, make acquisitions more expensive, and reduce expected returns on future investments.
    type: company-claimed
    topic: interest-rate-risk
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR022
  - id: CR008
    statement: After the IPO, Matteo Danieli, Luca Ferrari, Francesco Patarnello, and Luca Querella will control all class A shares and therefore retain considerable influence over important corporate matters.
    type: company-claimed
    topic: founder-control
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR009
    statement: The F-1 says Bending Spoons may be unable to attract, develop, or retain talent at the scale it needs and that limited engineering and product capacity relative to portfolio breadth can slow delivery and raise execution risk.
    type: company-claimed
    topic: talent-capacity
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
    - QR014
  - id: CR010
    statement: The filing says acquisitions of public companies can attract shareholder litigation, appraisal demands, and regulatory scrutiny, and Eventbrite, Vimeo, and Brightcove transaction releases all show formal approval processes and outside-counsel involvement.
    type: inferred
    topic: deal-approval-risk
    sourceRefs:
    - SR001
    - SR024
    - SR025
    - SR026
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR019
  - id: CR011
    statement: Bending Spoons discloses that it is, and may become, subject to litigation, regulatory inquiries, arbitration, enforcement actions, and other disputes across products, acquisitions, labor, privacy, consumer protection, cybersecurity, and monetization.
    type: company-claimed
    topic: litigation-exposure
    sourceRefs:
    - SR001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
  - id: CR012
    statement: A significant portion of Bending Spoons products depends on mobile app stores and other third-party platforms for distribution, marketing, discoverability, and payment collection.
    type: company-claimed
    topic: platform-dependence
    sourceRefs:
    - SR001
    - SR010
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR016
  - id: CR013
    statement: The filing says Apple App Store, Google Play, and other platforms can change reviews, rankings, search, privacy requirements, fees, refunds, and payment rules in inconsistent or unfavorable ways.
    type: company-claimed
    topic: platform-dependence
    sourceRefs:
    - SR001
    - SR010
    - SR011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR016
  - id: CR014
    statement: Because Bending Spoons generally cannot negotiate platform terms, it must adapt products and business practices to comply with third-party requirements, which can delay releases and reduce margins or retention.
    type: company-claimed
    topic: platform-dependence
    sourceRefs:
    - SR001
    - SR010
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR016
  - id: CR015
    statement: Apple’s subscription framework gives developers 70% of subscription price during the first paid year and 85% after one year, confirming that platform commissions remain a structural margin drag for app-store subscriptions.
    type: observed
    topic: platform-economics
    sourceRefs:
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR017
  - id: CR016
    statement: The F-1 says Bending Spoons is subject to evolving laws on pricing disclosures, refunds, free trials, subscriptions, automatic renewals, and dark patterns, and that failure or alleged failure can trigger investigations, class actions, civil penalties, and forced changes to monetization.
    type: company-claimed
    topic: consumer-protection
    sourceRefs:
    - SR001
    - SR019
    - SR020
    confidence: high
    freshness: current
    answersQuestionRefs:
