- id: integration-customer-and-operating-risk
  title: Integration, customer, and operating risk
  body: 'Execution risk is not abstract here because Bending Spoons has chosen a model that repeatedly changes codebases, pricing systems, teams, and support motions across acquired businesses. The F-1 says integrations can require rewriting software, redesigning interfaces, and restructuring organizations, and that those changes can create defects, downtime, and retention damage. TechCrunch’s reporting on Vimeo layoffs and the broader coverage of Evernote and WeTransfer show how quickly acquired teams can be disrupted. Customer evidence then shows the second-order risk: some price increases and free-tier restrictions do appear to lift monetization, but Appfigures, TechCrunch, and product help pages show that the same changes can also depress downloads, intensify one-star reviews, or push users to reconsider the product altogether. Evernote’s and WeTransfer’s official changes are especially important because they move the risk from rumor to recorded company policy. Even visible security
    controls at Evernote help only partially; they show mitigation maturity, not a free pass from the burden of securing and operating a fast-changing portfolio.'
  claimRefs:
