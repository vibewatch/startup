      - number: '1.4'
        title: 产品发布、客户进展与关键里程碑
        blocks:
          - type: paragraph
            body: >
              Island 经历了约 18 个月的隐身期产品研发，于 2022 年 2 月 1 日正式推出 Island Enterprise Browser。产品发布仅一个月，公司便拿下 $115M 的 Series B
              轮融资。截至 2023 年 10 月 Series C 轮交割，Island 累计售出超过 200 万个授权浏览器席位，客户群囊括多家排名前 20 的 Fortune 100 巨头。到 2024 年 4 月
              Series D 轮时，公司已拥有约 200 家企业客户和 280 名员工。截至 2025 年 3 月 Series E 轮，客户规模扩大至 450+ 家，员工增至约 500 人，自发布以来 ARR
              每年翻倍以上，据估计 2024 日历年达到约 $87M。


              产品入选《Fast Company》“2025 年下一代重大科技突破”，连续登上 2024 与 2025 年《Forbes》全球云计算百强榜（Cloud 100），荣获 2025 年零信任架构领域
              TechForward 大奖，并于 2023、2024 和 2025 年蝉联《Fortune》Cyber60 榜单。截至 2026 年，Gartner Peer Insights 基于 238 条评价给出
              4.9/5 的评分，位居安全企业浏览器品类用户满意度榜首；G2 基于 21 条经认证的企业评价给出 4.7/5 分。


              公开的知名企业标杆客户包括：辉瑞（Pfizer，全球生物制药巨头，拥有 87,000+ 名员工，其内部风险主管称 Island 是公司最核心的安全工具）、Mattress Firm、Swiss
              Life、Fiverr、TaskUs、Hendrick Motorsports 以及 Brightline。典型应用场景涵盖自有设备办公（BYOD）支持、外包人员快速接入、VDI 替代、SaaS
              数据防泄露、零信任网络访问以及并购过渡期安全保障。CEO 提及的一家代表性客户通过替换 VDI 机架基础设施，每年节省 $300M。


              关键反向事件：Palo Alto Networks 于 2023 年 12 月以约 $458M 完成对竞争对手企业浏览器初创公司 Talon Cyber Security 的收购，并随即向符合条件的 SASE
              AI 客户免费提供企业浏览器——借助平台捆绑销售大幅加剧了竞争。
