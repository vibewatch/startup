      - number: '1.5'
        title: 关键指标与证据缺口
        blocks:
          - type: paragraph
            body: >
              截至本报告发布日，Island 公开披露的指标包括：累计融资约 $730M；2025 年 3 月投后估值达 $4.85B；450+ 家企业客户；约 500 名员工；自产品发布以来 ARR
              每年大致翻倍，第三方分析平台 LATKA 数据估计其 2024 年 ARR 达到约 $87M。Island
              从未公开披露过毛利率、净留存率（NRR）、烧钱速度、自由现金流或具体的收入指引。公开渠道无法获取经审计的财务报表。


              研发团队高度集中在以色列（约 500 名总员工中，特拉维夫拥有 200+ 名工程师），这既是人才优势，也是地缘政治风险因素。Island 尚未披露针对研发业务的业务连续性或地理多元化预案。公司在估计 $87M
              ARR 的基数下获得 $4.85B 估值，隐含的 ARR 估值倍数约 55 倍——即便按网络安全 SaaS 标准衡量也处于极高水平——因此对任何潜在投资方而言，独立的财务尽调核实都至关重要。


              本章公开调研中未发现涉及 Island 的负面事件，包括数据泄露、监管处罚或诉讼诉求。
