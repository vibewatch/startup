      - number: '1.3'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >
              自 2020 年成立以来，Island 已完成六轮有明确估值的定价融资。截至 2025 年 3 月完成 Series E 轮，累计筹集约 $730M 外部资金。2022 年 3 月，公司在走出隐身期仅一个月后便以
              $1.3B 的投后估值完成 Series B 轮，晋升独角兽。后续几轮融资持续推高估值：2023 年 10 月 Series C 轮达 $1.5B；2024 年 4 月 Series D 轮达 $3B；2025
              年 3 月 Series E 轮达 $4.85B——不到 12 个月内估值跃升 3.2 倍。


              Series A 轮（2022 年 1 月，约 $100M）由 Insight Partners 和 Sequoia Capital 领投。Series B 轮（2022 年 3 月，融资金额 $115M，估值
              $1.3B）由 Insight Partners 领投，Stripes 和 Sequoia 跟投。B 轮后续追加资金包括 Cisco Investments（2022 年 7 月，约 $10M 战略投资）和
              Georgian（2022 年 11 月，约 $60M）。Series C 轮（2023 年 10 月，融资金额 $100M，估值 $1.5B）由 Prysm Capital 领投，专注于金融领域的 Canapi
              Ventures 作为新投资方加入。Series D 轮（2024 年 4 月，融资金额 $175M，估值 $3B）由 Coatue Management 与 Sequoia 联合领投，交割时累计融资达
              $487M。Series E 轮（2025 年 3 月，融资金额 $250M，估值 $4.85B）再次由 Coatue 领投，Insight Partners、Sequoia 和 Canapi Ventures
              跟投。


              历轮战略投资方包括 Capital One Ventures、Citi Ventures、Cisco Investments、新加坡 EDBI 以及 ServiceNow
              Ventures。尚无公开的老股交易、要约收购或结构化流动性事件记录。CEO Mike Fey 曾于 2024 年 4 月表示，Island
              期望有朝一日成为“强有力的上市候选企业”，但公司尚未提交首次公开募股（IPO）申请，也未设定具体时间表。
