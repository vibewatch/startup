      - - 估值立场
        - Series E 价格偏贵；折价 15–20% 才合理
        - 56x 估算 ARR 处在 2025 年网络安全 SaaS 溢价区间上沿
      - - IPO 目标回报（基准情景）
        - 基于 $4.85B 投后估值的 1.5–2.0x
        - 需要 $250–300M ARR 和 20x 公开市场倍数；IPO 时间线 12–24 个月
      - - 下行情景
        - 0.6–0.85x（低于 Series E 价格）
        - 熊市情景：竞争商品化或 NRR 不及预期；$3–4B 退出
      - - IPO 准备度
        - 12–24 个月
        - 需要经审计财务、可预测单位经济、管理控制台安全验证
