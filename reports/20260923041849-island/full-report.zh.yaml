companyProfile:
  summary: >-
    Island 是企业浏览器品类的开创者，也是首家将受管 Chromium 浏览器作为企业核心安全控制面部署的公司。公司由 Symantec 前总裁 Mike Fey 与 Fireglass 创始人 Dan Amiga 于 2020
    年创立。Island 已实现显著的企业级落地，积累了 450+ 家客户，并在金融服务领域实现关键渗透（拿下全球前十大银行中的 7 家）。其在 2025 年 3 月达成的 $4.85B Series E
    轮估值反映了专业投资机构的认可，但净留存率（NRR）和单位经济模型仍未公开，这是任何新投资方最核心的尽调不确定性。
