      - number: '2.2'
        title: 市场规模测算
        blocks:
          - type: paragraph
            body: >
              分析机构对 SEB 总可用市场（TAM）的测算区间在 $2.1B 至 $15B 之间，差异主要源于统计口径。GrowthMarketReports 预计 2025 年达 $5.5B，2033 年以 21–22%
              的复合年增长率（CAGR）增至 $14–15B；WiseGuyReports 估计 2024 年为 $2.1–5B，增速类似。如此悬殊的区间反映出业界对是否计入 VDI、SWG 和 CASB 的替代支出存在分歧。


              若参考 Gartner 的审慎口径，可得出相对保守的可服务市场（SAM）测算：假设到 2028 年全球 25% 的企业采用 SEB，企业平均年度合同价值（ACV）为每年 $150K–300K，按 $200K
              ACV 计算，1,250 家 Fortune 5000 强企业对应约 $250M 的美国 SAM。若扩展至全球，计入欧洲和亚太企业（按 2 倍系数测算），到 2028 年对应的可获取市场（SOM）规模在
              $500M–1.5B 之间。


              按 Island 设定的替代框架测算，市场潜力则更为广阔：企业浏览器所瞄准的相邻市场包括 VPN（$10B）+ VDI（$15B）+ SWG（$12B），若能吃下这三大市场 10% 的份额，对应收入池即达
              $3.7B。最终能落地的 TAM 实际规模，高度取决于客户在实际部署中对旧架构替换的彻底程度。
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM010
              - CM011
