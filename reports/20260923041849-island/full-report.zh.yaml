  - id: FE001
    title: 产品架构分层图
    description: Island 企业级浏览器从终端客户端到云端基础设施的产品技术栈架构。
    type: stack
    data:
      layers:
        - id: L1
          label: 终端用户层
          detail: 运行在受管及非受管设备上的浏览器客户端，全面覆盖 Windows、macOS、Linux、ChromeOS、iOS、 iPadOS 与 Android。
          items:
            - label: Island Enterprise Browser（企业浏览器）
              description: 内嵌策略引擎的 Chromium 分支；支持 Windows、macOS、Linux、iOS 及 Android
            - label: Island Mobile Browser
              description: 具备企业级同等安全策略能力的 iOS/iPadOS/Android 原生移动端应用
        - id: L2
          label: 策略与控制层
          detail: Island 自研核心执行层 —— 将 DLP、ZTNA 及设备安全基线检查原生内嵌至浏览器内部，无需任何网络代理。
          items:
            - label: 策略引擎
              description: Island 自研专有技术资产；在浏览器原生执行应用级、用户级与设备级安全策略
            - label: 最后一公里 DLP 360
              description: 在浏览器层管控打印、下载、粘贴、截屏与上传
            - label: 零信任网络访问（ZTNA）
              description: 免客户端访问私有应用，替代传统 VPN 客户端
        - id: L3
          label: 管理与分析层
          detail: SaaS 托管的管理控制台与分析层，集中统一管理 IT 策略、审计日志、DEX 监控并对接 SIEM 系统。
          items:
            - label: 管理控制台（SaaS）
              description: 托管于 AWS 的管理平面，负责策略、设备与用户管理
            - label: Island DEX
              description: 数字员工体验分析，监控应用性能与设备健康状态
            - label: SIEM 集成
              description: 向 Splunk、Sentinel 导出审计日志与 UBA 行为事件
        - id: L4
          label: 云基础设施层
          detail: 基于 AWS 的云基础设施，提供可扩展微服务、安全存储、全球 CDN，并为符合 FedRAMP High 资格的联邦部署提供 GovCloud 隔离环境。
          items:
            - label: AWS EKS
              description: Kubernetes 微服务架构，支撑管理平面的横向扩展
            - label: AWS S3 / CloudFront
              description: 审计日志存储与全球 CDN 分发
            - label: AWS GovCloud
              description: 符合 FedRAMP High 要求的隔离区域，专供联邦政府客户使用
    sourceRefs:
      - SE006
      - SE008
      - SE010
  - id: FE002
    title: 客户工作流 / 运营流程
    description: 企业如何部署 Island 以及由此带来的工作流变化。
    type: flow
    data:
      nodes:
        - id: N1
          label: IT 管理员配置策略
          description: CISO 与 IT 团队在管理控制台中按应用、用户和设备维度定义访问与 DLP 规则
        - id: N2
          label: 向员工分发浏览器
          description: 终端用户下载 Island 浏览器，首次登录即自动套用 IT 设定的安全策略
        - id: N3
          label: 评估设备安全体态
          description: Island 检查系统补丁级别、磁盘加密、在运行的 MDM/EDR 客户端及网络上下文
        - id: N4
          label: 授予应用访问权限
          description: 用户在策略允许范围内访问 SaaS 和内部应用，无需绕经 VPN 或代理跳转
        - id: N5
          label: 活动监控与日志留存
          description: 所有操作均记录至高保真审计日志，并导出至 SIEM 供 SOC 团队审查
        - id: N6
          label: 告警与实时处置
          description: 一旦触发违规行为（例如尝试粘贴 PII、截屏 PHI），系统立即执行实时拦截并发出告警
    sourceRefs:
