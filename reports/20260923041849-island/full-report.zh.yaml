  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >
              安全企业浏览器（SEB）市场涵盖专为企业定制的浏览器软件，通过企业级安全、数据治理和访问控制能力替代或增强原有的消费级浏览器层。Island 将其市场边界界定得十分宽广：凡是在浏览器中发生的企业工作流——访问
              SaaS 应用（Salesforce、Workday、M365）、内部 Web 应用或第三方合作伙伴门户——均属于该市场。网络层安全工具（防火墙、边缘 SASE）和原生移动应用属于相邻领域，未被纳入 SEB
              边界。


              Island 替代的主要竞品与存量传统方案包括：用于远程访问的 VPN/ZTNA 代理（全球市场规模约 $10B）、用于应用交付的 VDI 平台（约 $15B）、用于云流量检测的安全 Web 网关（SWG）与
              CASB 工具（约 $12B），以及用于数据保护的终端 DLP 客户端（约 $5B）。Island 将其浏览器定位为统一控制面，把上述功能全部收敛到用户实际开展工作的浏览器层。


              基于插件的安全产品（Seraphic、LayerX）在不更换现有浏览器的情况下附加安全能力，属于切换成本更低但管控深度受限的替代方案。Gartner 的《Innovation Insight》报告认可了 SEB
              的品类定义，将 Island、Palo Alto Networks（Talon/Prisma）、Citrix 和 Seraphic 列为代表性厂商。
            claimRefs:
              - CM001
              - CM002
