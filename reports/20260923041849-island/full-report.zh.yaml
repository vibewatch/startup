chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 主体身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Island Technology Inc. 注册于特拉华州，总部位于得克萨斯州达拉斯，核心研发中心设在以色列特拉维夫。公司将自身定位为企业浏览器品类的开创者：基于 Chromium 深度定制，原生嵌入安全、IT
              治理与生产力管控能力，替代从未针对企业环境设计的消费级浏览器。Island 产品以受管 SaaS 订阅方式交付：企业按席位采购 Island Enterprise
              Browser，获得持续更新、策略管理工具以及云端管理控制台。浏览器本身在终端本地运行，支持 Windows、macOS 和部分 Linux 发行版。


              商业模式瞄准中型企业与大型机构的首席信息安全官（CISO）、首席信息官（CIO）以及 IT 和安全团队。收入来自订阅制（年付合同），定价阶梯与席位规模和功能模块挂钩。Island
              将自身定位为一个整合平台，直接替代虚拟桌面（VDI）、数据防泄露（DLP）客户端、网页隔离网关和安全 Web 网关等多款相邻安全产品的支出，从而拿出清晰的投资回报率（ROI）算账逻辑。Island 委托
              Forrester 开展的总体经济影响（Total Economic Impact）研究显示，某复合代表性企业客户的投资回报率达 344%。


              Island 的客户覆盖各大核心行业：金融服务、医疗健康、制药、零售、制造、政府和高等教育。截至 2025 年 3 月，公司公布拥有 450 家企业客户，包括多家 Fortune 100
              头部企业与政府机构。Island 总部设在达拉斯，研发由特拉维夫主导；公司尚未公开按地理区域划分的收入数据。
