      - number: '1.2'
        title: 创始人、领导层与治理结构
        blocks:
          - type: paragraph
            body: >
              Island 由 Mike Fey 与 Dan Amiga 于 2020 年 8 月创立。两人结识于 2017 年 Symantec 收购 Amiga 此前创办的 Fireglass 之际。Fey 曾任
              Symantec（现 Broadcom）总裁兼首席运营官，以及 McAfee（现 Trellix）总经理兼首席技术官，深耕企业安全领域超过二十年。Amiga 在定义了细分品类的以色列安全初创公司
              Fireglass 发明了远程浏览器隔离技术，并曾担任 Axis Security、Cycode 和 Build.Security 等多家以色列网络安全公司的天使投资人或顾问。


              两位创始人抓住了结构性空白：随着企业工作全面转向 SaaS 和 Web 应用，浏览器成了主要攻击面和数据外泄通道，但企业普遍部署的消费级浏览器根本不具备企业级管控能力。他们的打法是基于行业标准的开源
              Chromium 引擎，打造一款对终端用户体验完全无感、却能被 IT 和安全团队全面管控的浏览器。自 2020 年 8 月成立后，团队进行了两年的隐身期产品研发，随后于 2022 年 2 月正式公开发布。


              除创始人外，Island 的高管团队还吸纳了来自企业安全、身份认证和 SaaS 生态的资深人才；公司未公开披露扩展高管团队的具体名单。董事会成员包括来自 Sequoia Capital（主导了 Series A
              至 D 轮投资的 Doug Leone）和 Coatue Management（Series D 和 E 轮领投人 David
              Schneider）的代表。截至本报告发布日，公司尚未公开任命独立董事。关键人物风险集中在两位创始人身上，他们依然牢牢掌握技术和商业主导权。设在特拉维夫的研发中心拥有 200 多名工程师，是核心产品开发枢纽。
