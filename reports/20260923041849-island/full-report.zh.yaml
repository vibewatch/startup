  - id: TM004
    title: 增长驱动因素与约束表
    description: Key demand drivers and adoption constraints for the secure enterprise browser market.
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调追问
    rows:
      - - 远程与混合办公普及
        - 驱动因素
        - 当前——持续推进
        - 浏览器成为企业首要访问入口；安全企业浏览器（SEB）需求具备结构性
        - 核验 Island 客户席位中与远程 / 混合办公员工挂钩的比例
      - - SaaS 与云应用加速普及
        - 驱动因素
        - 当前——持续推进
        - 网络边界已无法护住 SaaS；浏览器天然填补这一真空
        - 评估 Island 与排名前 100 企业级 SaaS 的集成深度与覆盖度
      - - 零信任架构合规指令
        - 驱动因素
        - 当前——正处于合规周期
        - ZTNA 指令要求在应用层落实访问控制；浏览器天然契合 NIST 800-207 标准
        - 核验 Island 对齐 ZTNA 的进展及政务客户采用落地情况
      - - 生成式 AI 泛滥
        - 驱动因素
        - 新兴——2025 年加速发酵
        - 员工使用 ChatGPT 引发数据泄露风险；浏览器可管控 AI 访问
        - 对比评估 Island 的 AI 治理功能与 Palo Alto Prisma 的能力差异
      - - 针对浏览器的威胁快速攀升（同比增 40%）
        - 驱动因素
        - 当前——持续恶化
        - 钓鱼与恶意插件激增，倒逼企业部署浏览器原生防护
        - 索取 Island 客户威胁拦截实际案例
      - - 强监管压力（GDPR、HIPAA、PCI-DSS）
        - 驱动因素
        - 当前——合规推进期
        - 浏览器级 DLP 比网络层控制更易接受审计
        - 核验 Island 合规认证情况：SOC 2、ISO 27001、FedRAMP
      - - Microsoft Edge for Business 免费捆绑
        - 约束
        - 当前——压力加剧
        - Edge for Business 随 M365 免费附带；Island 必须证明相对零成本竞品的增量价值
        - 梳理 Island 在以微软为主的企业客户中的输赢单率
      - - Palo Alto SASE 捆绑（Prisma Browser）
        - 约束
        - 当前——2023 年 12 月收购 Talon 之后
        - Prisma Browser 对 SASE 客户免费提供；压缩了 Island 在 Palo Alto 存量客户中的 TAM
        - 评估 Island 相对 Palo Alto 的输赢单情况；跟踪 Prisma 在大型企业的赢单动向
      - - 组织惯性（替换 Chrome / Edge 阻力大）
        - 约束
        - 当前——拖慢成单周期
        - IT 部署浏览器需历经数年；且要安全与人力部门形成广泛共识
        - 向客户了解部署周期及变革管理要求
      - - 缺乏既定采购预算品类
        - 约束
        - 当前——面临多年市场培育周期
        - Island 必须推动客户新设预算科目；需持续培育内部倡导者，而非直接接管成熟预算
        - 向 Island 了解：新增独立预算签约占比 vs 替代 VDI/SWG 预算签约占比
    sourceRefs:
      - SM001
      - SM009
      - SM018
      - SM021
      - SM024
    enumerationScope:
      coverage: partial
      basis: >-
        Drivers and constraints inferred from analyst reports, news coverage, and Island communications. Quantitative
        driver weights such as relative contribution to pipeline are not available from public sources.
