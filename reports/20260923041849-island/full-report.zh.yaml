          value: $250–300M
          unit: USD
          status: target
          note: 要求从 2024 年预估的 $87M 起算，到 2027 年实现 50% 的 CAGR 复合增长
        - label: NRR 门槛（最低可接受水平）
          value: 110%
          unit: '%'
          status: unverified
          note: 未公开披露；必须签署 NDA 核实；若 <100% 则投资逻辑破裂
        - label: 毛利率（网络安全 SaaS 目标值）
          value: 75–80%
          unit: '%'
          status: unverified
          note: 符合 SaaS 安全行业常规；交付模式理应支撑该毛利；须签署 NDA 核实
        - label: IPO 时间表（基准情景）
          value: 12–24 months
          unit: months
          status: estimated
          note: 需要经审计的财务数据及可预测的单客经济模型支撑
        - label: FedRAMP High ATO 授权（联邦 ARR 准入门槛）
          value: 2026–2027
          unit: year
          status: in-progress
          note: 处于审核流程推进阶段（In Process）；联邦市场收入取决于正式获发 ATO 授权
        - label: 入场 Series E 估值折扣（建议争取）
          value: 15–20%
          unit: '%'
          status: recommendation
          note: 将入场投后估值压低至 $3.9–4.1B；改善风险回报收益比
