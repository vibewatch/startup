figures:
  - id: FO001
    title: Island 估值里程碑时间线
    type: timeline
    summary: |
      Island 投后估值在三年历经六次融资事件，从跻身独角兽时的 $1.3B（2022 年 3 月）跃升至
      $4.85B（2025 年 3 月）。融资节奏在 2024–2025 年明显加快，两次间隔仅 11 个月的融资将公司估值推高 60%。
      每一个里程碑都印证了投资者对企业级浏览器赛道不断增强的信心。
    data:
      items:
        - date: 2020-08
          label: 创立
          detail: Island 在 Dallas 注册成立；Mike Fey 与 Dan Amiga 在 Tel Aviv 启动研发
          tone: neutral
        - date: 2022-01
          label: Series A 轮 —— 产品上线前
          detail: 在产品正式发布前，从 Insight Partners 与 Sequoia 融资 $100M
          tone: positive
        - date: '2022-02-01'
          label: 结束隐身状态 —— 产品正式发布
          detail: Island Enterprise Browser 正式公开上线；开创全球首款企业级浏览器
          tone: positive
        - date: 2022-03
          label: Series B 轮 —— 估值 $1.3B
          detail: 融资 $115M；产品发布仅 6 周即跻身独角兽行列
          tone: positive
        - date: 2023-10
          label: Series C 轮 —— 估值 $1.5B
          detail: 融资 $100M；售出 2M+ 浏览器席位；签下多家 Fortune 100 前 20 强标杆客户
          tone: positive
        - date: 2023-12
          label: Palo Alto 收购 Talon（反向）
          detail: 竞争对手 Talon 被 Palo Alto 以约 $458M 收购；免费捆绑竞争风险初现
          tone: risk
        - date: 2024-04
          label: Series D 轮 —— 估值 $3.0B
