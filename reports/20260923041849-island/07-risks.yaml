  evidenceGaps:
  - type: private-evidence-only
    severity: major
    topic: Island's Chromium CVE patch SLA and historical patch lag not publicly disclosed
    missingEvidence: "Island has not disclosed its Chromium CVE patch SLA \u2014 the time between a Chromium CVE public disclosure\
      \ and Island's patched version reaching enterprise customers. This is a critical security risk metric."
    whyItMatters: A patch lag of more than 72 hours on a critical Chromium CVE creates a window where Island customers face
      publicly known browser exploits that Chrome users have already patched. This is a fundamental product security risk.
    diligencePath: Request Island's CVE patch SLA commitment, historical patch timing data for last 10 critical Chromium CVEs,
      and incident response runbook under NDA.
    relatedQuestionRefs:
    - QR002
    - QR022
  - type: private-evidence-only
    severity: major
    topic: Burn rate, runway, and unit economics not publicly disclosed
    missingEvidence: Island has not disclosed burn rate, estimated runway from $730M total funding, CAC, payback period, or
      gross margin.
    whyItMatters: Without unit economics, it is impossible to assess whether Island is capital-efficient or burning aggressively
      to maintain growth that would stall without continued investment.
    diligencePath: Request FY2023, FY2024, and YTD 2025 P&L, including S&M spend, R&D spend, gross margin, and cash position
      under NDA.
    relatedQuestionRefs:
    - QR012
    - QR031
  - type: private-evidence-only
    severity: minor
    topic: FedRAMP 3PAO assessment status and ATO timeline not disclosed
    missingEvidence: Island has not disclosed which 3PAO is conducting its FedRAMP assessment, current assessment phase, or
      expected ATO date.
    whyItMatters: FedRAMP High ATO is the gating requirement for significant federal ARR. Without knowing the timeline, it
      is impossible to model federal revenue contribution in the next 24 months.
    diligencePath: Request 3PAO identity, assessment phase, and ATO timeline under NDA.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: minor
    topic: IP landscape beyond US Patent 12,235,922 not disclosed
    missingEvidence: Island has only one publicly visible patent (US 12,235,922). The breadth of Island's trade secret and
      IP protection strategy is not publicly disclosed.
    whyItMatters: IP gap leaves most of Island's proprietary technology exposed to imitation by well-capitalized competitors.
      IP protection strategy is a critical competitive moat question.
    diligencePath: Request full IP inventory, freedom-to-operate opinion, and trade secret protection framework from legal
      counsel under NDA.
    relatedQuestionRefs:
    - QR028
    - QR005
  - type: private-evidence-only
    severity: minor
    topic: Island management console uptime SLA and incident response posture not disclosed
    missingEvidence: Island has not publicly disclosed its management console uptime SLA, incident response runbook, or historical
      security incident disclosures. These are standard diligence items for security control plane vendors.
    whyItMatters: "Enterprise customers deploying Island as their primary security policy enforcement mechanism need to understand\
      \ the risk of management console downtime \u2014 a gap in uptime could leave enterprise policies unenforced."
    diligencePath: Request management console uptime SLA, incident response plan, penetration test results, and historical
      incident disclosures under NDA.
    relatedQuestionRefs:
    - QR019
  - type: no-public-evidence
    severity: minor
    topic: "Regulatory / legal risk register \u2014 full regulatory exposure not comprehensively documented"
    missingEvidence: Island's full regulatory exposure (GDPR DPA stance, state privacy law compliance, export control classification,
      HIPAA BAA execution status) is not publicly documented. The regulatory risk register is derived from public context
      rather than Island's internal compliance posture.
    whyItMatters: "Regulatory surprise risks \u2014 an unexpected GDPR enforcement action, an EAR classification challenge,\
      \ or a HIPAA BAA dispute \u2014 could significantly damage Island's enterprise reputation in regulated verticals."
    diligencePath: Request Island's regulatory compliance matrix, DPA agreements, HIPAA BAA template, and export control legal
      opinion under NDA.
